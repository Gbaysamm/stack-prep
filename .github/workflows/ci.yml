# Every check that must pass before main is deployable.
#
# Mirrors the Makefile targets, but against a disposable PostgreSQL service so it
# needs no local cluster. Keep the two in step: if a check only exists here, it
# will not be run before a push.
#
# A push to `integration` that passes every check deploys to both instances: the
# unprivileged one on the Stack Junior server (ADR-0017), reachable only through an
# SSH tunnel, and the review instance at stackprep.binaax.app (ADR-0018), which is
# what anyone outside the team is shown. They deploy independently, so one box being
# unreachable does not hold the other back. `main` is never deployed automatically,
# because a production deploy needs a rollback story this has not got yet.
#
# ADR-0012 lists the gates this should enforce. Present: ruff, mypy, pytest,
# Vitest, parity vectors, the TypeScript check and a migration run against an
# empty database. Still missing, because the tooling does not exist in the repo
# yet: size-limit on every PR, and Playwright plus Schemathesis on main.

name: CI / CD

on:
  push:
    # integration is where the work happens, so it is where the checks belong. Without
    # it a fortnight of commits goes unchecked and every problem surfaces at once on
    # the merge into main, which is how nine type errors arrived in a single run.
    branches: [main, integration, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  python:
    name: Python · lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scorepilot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/scorepilot
      DATABASE_SCHEMA: stackprep
      APP_ENV: ci
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type-check
        run: uv run --frozen mypy packages/engine/src apps/api/src

      - name: Apply migrations
        run: |
          for f in database/migrations/*.sql; do
            echo "  $f"
            psql -X -q -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d scorepilot -f "$f"
          done

      - name: Tests
        run: uv run --frozen pytest -q

      - name: Parity vectors are current
        # ADR-0005: a rule change must regenerate packages/fixtures/vectors.json in the
        # same commit, or the TypeScript mirror silently drifts from the Python engine.
        run: |
          uv run --frozen python -m engine.fixtures packages/fixtures/vectors.json
          if ! git diff --quiet -- packages/fixtures/vectors.json; then
            echo "::error file=packages/fixtures/vectors.json::Engine rules changed but the parity vectors were not regenerated. Run 'make fixtures' and commit the result."
            git diff -- packages/fixtures/vectors.json
            exit 1
          fi

  javascript:
    name: JavaScript · types and engine parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the web client
        run: npm run build

  schema:
    name: Database · schema tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sp_schema_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Apply every migration, then the schema assertions
        # The mirror of `make db-test`: the assertions in database/tests are what
        # prove the triggers still refuse content that is not ready for a student.
        run: |
          for f in database/migrations/*.sql database/tests/*.sql; do
            echo "  $f"
            psql -X -q -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d sp_schema_test -f "$f"
          done
          echo "Schema tests passed."

  image:
    name: Docker · API image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: score-pilot-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image can find its migrations
        run: |
          docker run --rm score-pilot-api:ci \
            python -c "from app.migrations import discover; print(f'{len(discover())} migrations visible')"

  deploy:
    name: Deploy · integration to the Stack Junior server
    # Only once every check above is green.
    #
    # `integration` deploys because it is where the work actually lands, and the
    # target is a loopback-only demo box: nothing reaches it without an SSH
    # tunnel, so publishing work in progress costs nothing. `main` is deliberately
    # not wired up — a production deploy needs a rollback story this has not got.
    needs: [python, javascript, schema, image]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/integration')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      # Never two deploys at once against one box, and queued rather than
      # cancelled: a half-applied migration is worse than a slow pipeline.
      group: deploy-stackjunior
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Authorise SSH
        # Secrets arrive as environment variables rather than being pasted into the
        # script, so nothing sensitive is ever part of the command text.
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          {
            echo "Host target"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
          } >> ~/.ssh/config

      - name: Release
        # The script is piped in rather than copied, so the far end keeps no stale
        # version and what runs is always what this commit says should run. The
        # server pulls the code itself using its own read-only deploy key, which is
        # why no write credential ever needs to reach it.
        env:
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          ssh target "SHA='$SHA' BRANCH='$BRANCH' bash -euo pipefail -s" < deploy/stackjunior/release.sh

      - name: Confirm the release actually finished
        # Not decoration. A release script piped over SSH can be cut short -- a
        # command that reads stdin swallows the rest of it -- and bash then exits 0,
        # so the job goes green having done part of the work. The script writes this
        # file last, so the commit being present is the only proof it reached the end.
        env:
          SHA: ${{ github.sha }}
        run: |
          recorded=$(ssh target "head -1 ~/score-pilot/.deployed 2>/dev/null || true")
          echo "recorded: ${recorded:-<nothing>}"
          if [ "$recorded" != "$SHA" ]; then
            echo "::error::The release did not run to completion. Expected $SHA."
            exit 1
          fi

  deploy-binaax:
    name: Deploy · integration to the Binaax review instance
    # The instance people are actually shown: https://stackprep.binaax.app, behind
    # basic auth. It deploys from the same commit and on the same trigger as the
    # Stack Junior one, and runs independently — one box being unreachable must not
    # stop the other from getting the change.
    needs: [python, javascript, schema, image]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/integration')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-binaax
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Authorise SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.BINAAX_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.BINAAX_SSH_HOST }}
          SSH_USER: ${{ secrets.BINAAX_SSH_USER }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_binaax
          chmod 600 ~/.ssh/id_binaax
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          {
            echo "Host binaax"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  IdentityFile ~/.ssh/id_binaax"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
          } >> ~/.ssh/config

      - name: Release
        env:
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          ssh binaax "SHA='$SHA' BRANCH='$BRANCH' bash -euo pipefail -s" < deploy/binaax/release.sh

      - name: Confirm the release actually finished
        # See the note on the same step in the Stack Junior job. This one caught it
        # for real: the first run of this job reported success having stopped after
        # migrations, because `docker compose run` without -T ate the rest of the
        # piped script.
        env:
          SHA: ${{ github.sha }}
        run: |
          recorded=$(ssh binaax "head -1 /opt/score-pilot/.deployed 2>/dev/null || true")
          echo "recorded: ${recorded:-<nothing>}"
          if [ "$recorded" != "$SHA" ]; then
            echo "::error::The release did not run to completion. Expected $SHA."
            exit 1
          fi
