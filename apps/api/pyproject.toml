[project]
name = "score-pilot-api"
version = "0.1.0"
description = "Score Pilot HTTP API and background worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "arq>=0.26",
    "openai>=1.60",
    # Multipart form parsing, for the spoken question upload (ai_listen).
    "python-multipart>=0.0.9",
    # Content loaders in database/ read YAML, and the deploy runs one inside this image.
    "pyyaml>=6.0",
    "score-pilot-engine",
    "argon2-cffi>=25.1.0",
    # Calls to Paystack (app/paystack.py).
    "httpx>=0.27",
    "anthropic>=2.7.0",
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
# The free Kokoro voice (app/kokoro_voice.py): the model run on onnxruntime, phonemes from a
# bundled espeak-ng, mp3 from LAME. Imported lazily; without it the voice is not offered.
kokoro = [
    "kokoro-onnx>=0.6.1",
    "lameenc>=1.8",
]

[tool.uv.sources]
score-pilot-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
