# Subtopic lesson: cell structure and the job of each cell part, told as the story of a busy
# Nigerian family compound. One animal cell grows on the board, organelle by organelle (stages
# a to a10), then a plant cell (b) shows the three plant-only parts.
format_version: 1
subject: biology
subtopic: 'Cell structure and functions of cell components'
subtopic_id: 3ef0e4af-860d-5467-8fd2-f23a09a82b77
sources:
  - https://syllabus.ng/jamb/biology/
  - https://www.headteacher.ng/the-cell-cell-theory-forms-of-life-cell-structures-plant-animal-cell-for-sss-1/
  - https://edupadi.com/classroom/lessons/ss1/biology/the-cell/page/1
  - https://classnotes.ng/?p=70074
moments:
  - section: 'The cell compound'
    say: 'Welcome to the cell compound. One tiny house, and everybody inside has a job and an attitude. JAMB asks who does what, so let us meet them.'
    write: 'The cell compound: one tiny house, plenty of drama'
    doodle: {name: 'custom:sub_bio_cell_structure_a', id: cell, size: scene, caption: 'an animal cell'}

  - section: 'The unit of life'
    say: 'Every living thing is built from cells. A cell is the smallest unit that can carry out life. An amoeba is just one cell, and your body has trillions.'
    write: 'Cell = the basic unit of structure and function of life'
    doodle_do:
      - {id: cell, op: pulse, 'on': 'cell'}

  - section: 'The gateman'
    say: 'First character, the cell membrane. He is the gateman. He goes round the whole cell, and he decides what comes in and what goes out.'
    write: 'Cell membrane, the gateman: controls what enters and leaves'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a2', 'on': 'membrane'}
    point:
      - {line: 2, kind: highlight, at: 'Cell membrane', to: {doodle: cell, part: membrane}}

  - say: 'We call the membrane selectively permeable, which means it lets some substances pass and holds others back. Water and oxygen pass through it easily.'
    write: 'Selectively (differentially) permeable'

  - section: 'The compound ground'
    say: 'Inside the gate is the cytoplasm. It is the compound ground, a jelly-like fluid where everybody lives. It holds the organelles, and many cell reactions happen in it.'
    write: 'Cytoplasm, the ground: jelly that holds the organelles; reactions happen here'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a3', 'on': 'cytoplasm'}

  - section: 'The boss'
    say: 'Now the boss. The nucleus thinks she runs the whole compound, and to be fair, she does. She is the control centre of the cell.'
    write: 'Nucleus, the boss: control centre of the cell'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a4', 'on': 'nucleus'}
    point:
      - {line: 5, kind: highlight, at: 'Nucleus', to: {doodle: cell, part: nucleus}}

  - say: 'Why is she the boss? The nucleus holds the chromosomes. They are made of DNA, and they carry the genes, which are the instructions for everything the cell makes.'
    write: 'Nucleus holds chromosomes (DNA, genes) = the instructions'
    doodle_do:
      - {id: cell, op: circle, part: nucleus, 'on': 'chromosomes'}

  - say: 'Those genes come from your parents. So a question on heredity, or on what proves who a child''s father is, points to the nucleus. A paternity test reads that DNA.'
    write: 'Heredity and paternity: the DNA in the nucleus'

  - say: 'Inside the nucleus sits a small dark body, the nucleolus. It is the boss''s assistant, and it makes the ribosomes we will meet soon.'
    write: 'Nucleolus, inside the nucleus: makes ribosomes'
    doodle_do:
      - {id: cell, op: circle, part: nucleolus, 'on': 'nucleolus'}

  - section: 'The generator'
    say: 'Next, the mitochondria. They do the real work. Like the compound generator when there is no light, they burn fuel to give power. The fuel is food, such as glucose.'
    write: 'Mitochondria, the generator: aerobic respiration'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a5', 'on': 'mitochondria'}
    point:
      - {line: 9, kind: highlight, at: 'Mitochondria', to: {doodle: cell, part: mitochondrion}}

  - say: 'This burning with oxygen is aerobic respiration, and it releases energy as ATP. So a very busy cell, like a muscle cell or a sperm cell, is packed with mitochondria.'
    write: 'Releases energy as ATP; many in muscle and sperm cells'
    doodle_do:
      - {id: cell, op: pulse, part: mitochondrion-2, 'on': 'packed'}

  - section: 'The corridors'
    say: 'Around the nucleus runs the endoplasmic reticulum, a network of folded sacs and tubes. Think of it as the corridors of the compound. Materials travel along it through the cell.'
    write: 'Endoplasmic reticulum, the corridors: transports materials'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a6', 'on': 'endoplasmic'}

  - section: 'The tailors'
    say: 'Now the ribosomes, these tiny dots. They are the tailors in the corner, sewing all day. They follow the instructions from the nucleus, and they make proteins.'
    write: 'Ribosomes, the tailors: make (synthesise) proteins'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a7', 'on': 'ribosomes'}

  - say: 'Many ribosomes sit on the endoplasmic reticulum, and we call it rough endoplasmic reticulum. Smooth endoplasmic reticulum has no ribosomes, and it makes fats, which are lipids.'
    write: 'Rough ER has ribosomes.  Smooth ER has none, makes lipids'
    doodle_do:
      - {id: cell, op: circle, part: er, 'on': 'rough'}

  - section: 'The dispatch rider'
    say: 'Next, the Golgi body, a stack of flat curved sacs. It is the dispatch rider. It packs the proteins into small bags called vesicles and sends them out of the cell.'
    write: 'Golgi body, the dispatch rider: packages and secretes'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a8', 'on': 'Golgi'}

  - say: 'That is how the gland cells of your stomach send out their enzymes, and how cells send out mucus. A cell that secretes a lot has a big Golgi body.'
    write: 'Secretion: enzymes, mucus, hormones'
    doodle_do:
      - {id: cell, op: pulse, part: golgi, 'on': 'big'}

  - section: 'The cleaner'
    say: 'The lysosome is the cleaner. It is a small bag of digestive enzymes, made by the Golgi body. It breaks down worn out cell parts and germs.'
    write: 'Lysosome, the cleaner: digestive enzymes break down waste and germs'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a9', 'on': 'lysosome'}

  - section: 'The last two'
    say: 'The centrioles are a pair of short tubes at right angles. When the cell divides, they help form the spindle that pulls the chromosomes apart. Animal cells have them.'
    write: 'Centrioles: form the spindle in cell division (animal cells)'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a10', 'on': 'centrioles'}

  - say: 'An animal cell may also have a few small vacuoles. They come and go, holding food or water for a short time.'
    write: 'Vacuoles in animal cells: small and temporary'
    doodle_do:
      - {id: cell, op: circle, part: vacuole, 'on': 'vacuoles'}

  - section: 'The plant cell'
    say: 'Now cross the road to a plant cell. It has the boss, the generators, the tailors and the dispatch rider too, plus three things an animal cell lacks.'
    write: 'Plant cell: the same characters, plus three extras'
    doodle: {name: 'custom:sub_bio_cell_structure_b', id: plant, size: scene, caption: 'a plant cell', 'on': 'plant'}

  - say: 'The first extra is the cell wall. It is the block fence, outside the gateman. It is made of cellulose, and it gives the cell a firm shape and support.'
    write: 'Cell wall, the fence: cellulose, gives shape and support'
    doodle_do:
      - {id: plant, op: circle, part: wall, 'on': 'wall'}
    point:
      - {line: 20, kind: highlight, at: 'Cell wall', to: {doodle: plant, part: wall}}

  - say: 'Careful here. The wall is fully permeable, so it lets almost everything through. It is still the gateman, the membrane, who chooses what enters the cell.'
    write: 'Wall: fully permeable.  Membrane: selectively permeable'
    doodle_do:
      - {id: plant, op: pulse, part: membrane, 'on': 'membrane'}

  - say: 'The second extra is the chloroplast, the kitchen. It holds the green pigment chlorophyll, which traps sunlight, so the plant makes its own food by photosynthesis.'
    write: 'Chloroplast, the kitchen: chlorophyll traps light, photosynthesis'
    doodle_do:
      - {id: plant, op: circle, part: chloroplasts, 'on': 'chloroplast'}

  - say: 'But not every plant cell has a kitchen. Cells in a cassava root, or in onion skin, do not make food, so they have no chloroplasts.'
    write: 'No chloroplasts in roots or onion skin'

  - say: 'The third extra is one large central vacuole, the overhead tank, full of cell sap. It presses the cytoplasm into a thin layer and pushes the nucleus to the side.'
    write: 'Large central vacuole of cell sap; nucleus pushed to the side'
    doodle_do:
      - {id: plant, op: circle, part: vacuole, 'on': 'vacuole'}
      - {id: plant, op: pulse, part: nucleus, 'on': 'nucleus'}

  - section: 'Plant versus animal'
    say: 'So how do plant and animal cells differ? Plant cells have a cellulose wall, chloroplasts and one large vacuole. Animal cells have none of these, but they have centrioles.'
    write: 'Plant: wall, chloroplasts, large vacuole.  Animal: centrioles, small vacuoles'

  - say: 'Two more differences. Plants store food as starch, and animals store it as glycogen. Plant cells have a regular, box shape, and animal cells are irregular.'
    write: 'Food store: starch vs glycogen.  Shape: regular vs irregular'

  - section: 'Traps'
    say: 'Trap one. Mitochondria release energy, they do not store it. Food energy is stored as starch, glycogen or fat. And plant cells have mitochondria too, not only chloroplasts.'
    write: 'Mitochondria RELEASE energy; plants have them too'
    doodle_do:
      - {id: plant, op: circle, part: mitochondrion, 'on': 'plant'}

  - say: 'Trap two. The membrane, cytoplasm, nucleus, mitochondria, ribosomes, endoplasmic reticulum and Golgi body are in both cells. Only the wall, chloroplasts and big vacuole are the plant''s own.'
    write: 'In both: membrane, cytoplasm, nucleus, mitochondria, ribosomes, ER, Golgi'

  - section: 'Check yourself'
    say: 'Quick check. A leaf cell in sunlight is respiring and making food at the same time. Which two organelles must be busy? Think before I answer.'
    write: 'Leaf cell in sunlight: respiring and photosynthesising. Which two?'

  - say: 'The mitochondria, for respiration, and the chloroplasts, for photosynthesis. If you said that, you can read the compound well.'
    write: 'Mitochondria + chloroplasts'
    doodle_do:
      - {id: plant, op: circle, part: mitochondrion, 'on': 'mitochondria'}
      - {id: plant, op: circle, part: chloroplasts, 'on': 'chloroplasts'}

  - section: 'Remember'
    say: 'Remember the compound. Membrane the gateman, nucleus the boss, mitochondria the generator, ribosomes the tailors. Then the corridors, the dispatch rider and the cleaner. Plants add the fence, kitchen and tank.'
    write: 'Gate, boss, gen, tailors, corridors, dispatch, cleaner + fence, kitchen, tank'
