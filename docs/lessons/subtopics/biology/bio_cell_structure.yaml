# Subtopic lesson: the structure of plant and animal cells and the function of each part, built
# to docs/lessons/subtopic-lesson-guide.md. One textbook animal cell grows on the board part by
# part (stages a to a10), each part labelled in its own colour with an arrow and a short note of
# its job; then a labelled plant cell (b) shows the plant-only parts.
format_version: 1
subject: biology
subtopic: 'Cell structure and functions of cell components'
subtopic_id: 3ef0e4af-860d-5467-8fd2-f23a09a82b77
sources:
  - https://syllabus.ng/jamb/biology/
  - https://www.headteacher.ng/the-cell-cell-theory-forms-of-life-cell-structures-plant-animal-cell-for-sss-1/
  - https://edupadi.com/classroom/lessons/ss1/biology/the-cell/page/1
  - https://classnotes.ng/?p=70074
moments:
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is cell structure and the functions of the cell components.'
    write: 'Cell structure and functions of cell components'
    doodle: {name: 'custom:sub_bio_cell_structure_a', id: cell, size: scene, caption: 'an animal cell'}

  - section: 'Introduction'
    say: 'Every living thing is made of cells. The cell is the basic unit of structure and function of life. An amoeba is one cell, and your body has trillions.'
    write: 'Cell: the basic unit of structure and function of life'
    doodle_do:
      - {id: cell, op: pulse, 'on': 'cell'}

  - say: 'Inside a cell are small parts called organelles, and each one has its own job. JAMB asks about them nearly every year.'
    write: 'Organelles: the parts of a cell, each with a job'

  - say: 'JAMB names a job and asks which organelle does it, or it shows a cell diagram and asks you to name a labelled part.'
    write: 'JAMB asks: which organelle does this job? Name the labelled part.'

  - section: 'Objectives'
    say: 'By the end of this lesson you will be able to name the parts of plant and animal cells, state the function of each part, and compare the two.'
    write: '1. Name the parts   2. State their functions   3. Compare plant and animal cells'

  - section: 'Cell membrane'
    say: 'We start with an animal cell. The cell membrane is the thin layer round the whole cell, made of protein and lipid. It controls what enters and leaves the cell.'
    write: 'Cell membrane: controls what enters and leaves'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a2', 'on': 'membrane'}

  - say: 'We say it is selectively permeable, which means it lets some substances through and holds others back. Water and oxygen, for example, pass through it easily.'
    write: 'Selectively (differentially) permeable'
    doodle_do:
      - {id: cell, op: pulse, part: membrane, 'on': 'selectively'}

  - section: 'Cytoplasm'
    say: 'Inside the membrane is the cytoplasm, a jelly-like fluid. It holds all the organelles, and many of the cell''s reactions take place in it.'
    write: 'Cytoplasm: jelly that holds the organelles; site of reactions'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a3', 'on': 'cytoplasm'}

  - section: 'Nucleus'
    say: 'The nucleus is the large round body, wrapped in a double nuclear membrane with pores. It is the control centre of the cell.'
    write: 'Nucleus: control centre of the cell'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a4', 'on': 'nucleus'}

  - say: 'The nucleus holds the chromosomes. They are made of DNA, and they carry the genes, which are the instructions for everything the cell does.'
    write: 'Nucleus: holds chromosomes (DNA, genes)'
    doodle_do:
      - {id: cell, op: circle, part: nucleus, 'on': 'chromosomes'}

  - say: 'Genes pass from parents to children. So heredity depends on the DNA in the nucleus, and so does a test of who a child''s father is.'
    write: 'Heredity and paternity: DNA in the nucleus'

  - say: 'Inside the nucleus is a small dark body, the nucleolus. It makes the ribosomes.'
    write: 'Nucleolus: inside the nucleus, makes ribosomes'
    doodle_do:
      - {id: cell, op: circle, part: nucleolus, 'on': 'nucleolus'}

  - section: 'Mitochondria'
    say: 'Mitochondria are sausage-shaped, with an inner membrane folded into cristae. They are the site of aerobic respiration.'
    write: 'Mitochondria: site of aerobic respiration'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a5', 'on': 'Mitochondria'}

  - say: 'In respiration, food such as glucose is broken down with oxygen, and energy is released as ATP. That is why mitochondria are called the powerhouse of the cell.'
    write: 'Release energy as ATP: the powerhouse of the cell'
    doodle_do:
      - {id: cell, op: pulse, part: mitochondrion, 'on': 'powerhouse'}

  - say: 'For example, muscle cells and sperm cells use a lot of energy, so they are packed with mitochondria.'
    write: 'Many in muscle and sperm cells'
    doodle_do:
      - {id: cell, op: pulse, part: mitochondrion-2, 'on': 'packed'}

  - section: 'Endoplasmic reticulum'
    say: 'The endoplasmic reticulum is a network of folded membranes and channels running through the cytoplasm. It transports materials through the cell.'
    write: 'Endoplasmic reticulum: transports materials'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a6', 'on': 'endoplasmic'}

  - section: 'Ribosomes'
    say: 'Ribosomes are tiny granules, some free in the cytoplasm and some on the endoplasmic reticulum. They make proteins, using the instructions from the nucleus.'
    write: 'Ribosomes: make (synthesise) proteins'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a7', 'on': 'Ribosomes'}

  - say: 'Endoplasmic reticulum with ribosomes on it is called rough endoplasmic reticulum. Smooth endoplasmic reticulum has no ribosomes, and it makes lipids, which are fats.'
    write: 'Rough ER: has ribosomes.  Smooth ER: no ribosomes, makes lipids'
    doodle_do:
      - {id: cell, op: circle, part: er, 'on': 'rough'}

  - section: 'Golgi body'
    say: 'The Golgi body is a stack of flat, curved sacs. It packages substances such as proteins into small vesicles and secretes them out of the cell.'
    write: 'Golgi body: packages and secretes'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a8', 'on': 'Golgi'}

  - say: 'For example, the gland cells of the stomach secrete enzymes this way. Cells that secrete a lot, like these, have a large Golgi body.'
    write: 'Secretion: enzymes, mucus, hormones'
    doodle_do:
      - {id: cell, op: pulse, part: golgi, 'on': 'large'}

  - section: 'Lysosomes'
    say: 'Lysosomes are small sacs of digestive enzymes, made by the Golgi body. They break down worn-out parts of the cell and germs the cell has taken in.'
    write: 'Lysosome: digestive enzymes break down waste and germs'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a9', 'on': 'Lysosomes'}

  - section: 'Centrioles'
    say: 'Centrioles are a pair of short tubes at right angles, near the nucleus. In cell division they form the spindle that pulls the chromosomes apart. Animal cells have them.'
    write: 'Centrioles: form the spindle in cell division (animal cells)'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a10', 'on': 'Centrioles'}

  - section: 'Vacuoles'
    say: 'A vacuole is a fluid-filled sac. In an animal cell the vacuoles are few, small and temporary, holding food or water for a short time.'
    write: 'Vacuole: fluid-filled sac; small and temporary in animal cells'
    doodle_do:
      - {id: cell, op: circle, part: vacuole, 'on': 'vacuoles'}

  - section: 'Plant cell'
    say: 'Now a plant cell. It has a cell membrane, cytoplasm, a nucleus, mitochondria, ribosomes, endoplasmic reticulum and a Golgi body too. It also has three structures an animal cell lacks.'
    write: 'Plant cell: the same organelles, plus three more'
    doodle: {name: 'custom:sub_bio_cell_structure_b', id: plant, size: scene, caption: 'a plant cell', 'on': 'plant'}

  - section: 'Cell wall'
    say: 'First, the cell wall, outside the cell membrane. It is made of cellulose. It gives the cell a fixed shape, supports it, and stops it bursting when it takes in water.'
    write: 'Cell wall: cellulose; gives shape and support'
    doodle_do:
      - {id: plant, op: circle, part: wall, 'on': 'wall'}

  - say: 'The cell wall is fully permeable, so it lets almost everything through. It is the cell membrane that is selectively permeable.'
    write: 'Wall: fully permeable.  Membrane: selectively permeable'
    doodle_do:
      - {id: plant, op: pulse, part: membrane, 'on': 'membrane'}

  - section: 'Chloroplasts'
    say: 'Second, the chloroplasts. These are the oval green bodies. They contain chlorophyll, which traps light energy, and they are the site of photosynthesis, where the plant makes its food.'
    write: 'Chloroplast: contains chlorophyll; site of photosynthesis'
    doodle_do:
      - {id: plant, op: circle, part: chloroplasts, 'on': 'chloroplasts'}

  - say: 'Not every plant cell has them. Root cells, such as cassava root cells, do not photosynthesise, and neither do onion skin cells, so they have no chloroplasts.'
    write: 'No chloroplasts in root or onion skin cells'
    doodle_do:
      - {id: plant, op: pulse, part: chloroplasts, 'on': 'Root'}

  - section: 'Large central vacuole'
    say: 'Third, a plant cell has one large central vacuole, full of cell sap. It keeps the cell firm, presses the cytoplasm into a thin layer, and pushes the nucleus to the side.'
    write: 'Large vacuole of cell sap: keeps the cell firm, nucleus at the side'
    doodle_do:
      - {id: plant, op: circle, part: vacuole, 'on': 'vacuole'}
      - {id: plant, op: pulse, part: nucleus, 'on': 'nucleus'}

  - section: 'Comparison'
    say: 'Now compare them. Plant cells have a cellulose wall, chloroplasts and one large vacuole. Animal cells have none of these, but they have centrioles and small vacuoles.'
    write: 'Plant: wall, chloroplasts, large vacuole.  Animal: centrioles, small vacuoles'

  - say: 'Plants store food as starch, and animals store it as glycogen. Plant cells have a regular shape, and animal cells are irregular.'
    write: 'Food store: starch vs glycogen.  Shape: regular vs irregular'

  - say: 'Both cells have a cell membrane, cytoplasm, a nucleus, mitochondria, ribosomes, endoplasmic reticulum and a Golgi body.'
    write: 'In both: membrane, cytoplasm, nucleus, mitochondria, ribosomes, ER, Golgi body'

  - section: 'JAMB traps'
    say: 'Here is a JAMB question. Which cell organelle is responsible for aerobic respiration? Is it the nucleus, the nucleolus, the endoplasmic reticulum or the mitochondrion?'
    write: 'Organelle for aerobic respiration? Nucleus, nucleolus, ER or mitochondrion'

  - say: 'Aerobic respiration takes place in the mitochondrion, so that is the answer.'
    write: '∴ mitochondrion'
    doodle_do:
      - {id: cell, op: circle, part: mitochondrion, 'on': 'mitochondrion'}

  - say: 'Now the traps. The nucleus controls the cell but does not respire. The nucleolus makes ribosomes. The endoplasmic reticulum transports materials.'
    write: 'Nucleus controls, nucleolus makes ribosomes, ER transports'

  - say: 'One more trap. Mitochondria release energy. They do not store it. Energy is stored as starch, glycogen or fat. And plant cells have mitochondria too.'
    write: 'Mitochondria RELEASE energy; plant cells have them too'
    doodle_do:
      - {id: plant, op: circle, part: mitochondrion, 'on': 'plant'}

  - section: 'Check yourself'
    say: 'Your turn. A leaf cell in sunlight is respiring and photosynthesising at the same time. Which two organelles are at work? Pause and think.'
    write: 'Leaf cell in sunlight: respiring and photosynthesising. Which two?'

  - say: 'Mitochondria carry out respiration, and chloroplasts carry out photosynthesis. So the answer is mitochondria and chloroplasts.'
    write: '∴ mitochondria and chloroplasts'
    doodle_do:
      - {id: plant, op: circle, part: mitochondrion, 'on': 'Mitochondria'}
      - {id: plant, op: circle, part: chloroplasts, 'on': 'chloroplasts'}

  - section: 'Recap'
    say: 'Let us recap. You can now name the parts of a cell. The nucleus controls the cell, mitochondria release energy, ribosomes make proteins, the Golgi body packages substances and lysosomes digest waste.'
    write: '1, 2. Nucleus controls, mitochondria release energy, ribosomes make proteins, Golgi packages, lysosomes digest'
    doodle_do:
      - {id: cell, op: pulse, 'on': 'parts'}

  - say: 'And you can compare the cells. Only plant cells have a cell wall, chloroplasts and a large vacuole. That is the lesson. Next, try new questions on it.'
    write: '3. Plant only: wall, chloroplasts, large vacuole'
    doodle_do:
      - {id: plant, op: pulse, 'on': 'plant'}
