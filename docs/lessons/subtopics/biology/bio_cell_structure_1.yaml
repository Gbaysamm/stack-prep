# The cell, its membrane and its nucleus (lesson 1 of 5): the big picture of the cell and its
# organelles, then the cell membrane, the cytoplasm, the nucleus and the nucleolus of an animal
# cell, each added to the drawing as it is taught (stages a, a2, a3, a3n, a4).
format_version: 1
subject: biology
subtopic: 'Cell structure and functions of cell components'
subtopic_id: 3ef0e4af-860d-5467-8fd2-f23a09a82b77
part: 1
title: 'The cell, its membrane and its nucleus'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/biology/
  - https://www.headteacher.ng/the-cell-cell-theory-forms-of-life-cell-structures-plant-animal-cell-for-sss-1/
  - https://edupadi.com/classroom/lessons/ss1/biology/the-cell/page/1
  - https://classnotes.ng/?p=70074
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is the cell, its membrane and its nucleus.'
    write: 'The cell, its membrane and its nucleus'

  # ---------------------------------------------------------------- introduction: the big picture
  - section: 'Introduction'
    say: 'Every living thing is made of cells. The cell is the basic unit of structure and function of life.'
    write: 'Cell: the basic unit of structure and function of life'
    doodle: {name: 'custom:sub_bio_cell_structure_a', id: cell, size: scene, caption: 'an animal cell', 'on': cells}
  - say: 'For example, an amoeba is a living thing made of just one cell, and your body is made of trillions of cells.'
    write: 'Amoeba: one cell. Your body: trillions of cells'
  - say: 'Inside a cell are small parts called organelles, and each one has its own job.'
    write: 'Organelles: the parts of a cell, each with a job'
    doodle_do:
      - {id: cell, op: pulse, 'on': organelles}
  - say: 'JAMB asks about them nearly every year. It names a job and asks which organelle does it, or it shows a cell diagram and asks you to name a labelled part.'
    write: 'JAMB: which organelle does this job? Name the labelled part.'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn the jobs of three parts of an animal cell. They are the cell membrane, the cytoplasm and the nucleus.'
    write: 'Today: the cell membrane, the cytoplasm and the nucleus'

  # ---------------------------------------------------------------- cell membrane
  - section: 'Cell membrane'
    say: 'We start at the outside of the cell. The cell membrane is the thin layer round the whole cell. It is made of protein and lipid, and lipid is a kind of fat.'
    write: 'Cell membrane: thin layer round the cell (protein and lipid)'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a2', 'on': membrane}
  - say: 'The job of the cell membrane is to control what enters and leaves the cell.'
    write: 'Job: controls what enters and leaves the cell'
    doodle_do:
      - {id: cell, op: pulse, part: membrane, 'on': control}
  - say: 'It can do this because it is selectively permeable. This means that it lets some substances through and holds others back. For example, water and oxygen pass through it easily.'
    write: 'Selectively (differentially) permeable: lets some substances through, not others'
    point:
      - {line: 8, kind: underline, at: 'some substances through'}

  # ---------------------------------------------------------------- cytoplasm
  - section: 'Cytoplasm'
    say: 'Inside the membrane is the cytoplasm, a jelly-like fluid. It holds all the organelles, and many of the cell''s reactions take place in it.'
    write: 'Cytoplasm: jelly that holds the organelles; site of many reactions'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a3', 'on': cytoplasm}

  # ---------------------------------------------------------------- nucleus
  - section: 'Nucleus'
    say: 'Now the nucleus. It is the large round body in the cytoplasm. It is wrapped in a double membrane, called the nuclear membrane, which has small pores in it.'
    write: 'Nucleus: large round body with a double nuclear membrane'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a3n', 'on': nucleus}
  - say: 'The nucleus is the control centre of the cell. It controls everything the cell does.'
    write: 'Job: the control centre of the cell'
    doodle_do:
      - {id: cell, op: circle, part: nucleus, 'on': control}
  - say: 'It can do this because it holds the chromosomes. Chromosomes are made of DNA, and they carry the genes. The genes are the instructions for everything the cell does.'
    write: 'It holds the chromosomes, made of DNA, which carry the genes'
    doodle_do:
      - {id: cell, op: pulse, part: nucleus, 'on': chromosomes}
  - say: 'Genes pass from parents to their children. So heredity depends on the DNA in the nucleus, and so does a test of who a child''s father is.'
    write: 'Heredity and paternity tests: DNA in the nucleus'
  - say: 'Inside the nucleus is a small dark body called the nucleolus. Its job is to make ribosomes. Ribosomes are tiny granules that make proteins, and we meet them in the next lesson.'
    write: 'Nucleolus: small dark body in the nucleus; makes ribosomes'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a4', 'on': nucleolus}

  # ---------------------------------------------------------------- worked example
  - section: 'Worked example'
    say: 'Now let us use this. A question names a job and gives four parts. Which part of the cell controls what enters and leaves it? Is it the nucleus, the nucleolus, the cytoplasm or the cell membrane?'
    write: 'Which part controls what enters and leaves? Nucleus, nucleolus, cytoplasm, cell membrane'
  - say: 'We take each part in turn and ask what its job is. The nucleus controls the cell''s activities, but it does not decide what crosses the outside of the cell.'
    write: 'Nucleus: control centre, not entry and exit ✗'
    doodle_do:
      - {id: cell, op: pulse, part: nucleus, 'on': nucleus}
  - say: 'The nucleolus makes ribosomes, so it is not the answer either.'
    write: 'Nucleolus: makes ribosomes ✗'
  - say: 'The cytoplasm holds the organelles, and reactions take place in it, so it is not the answer.'
    write: 'Cytoplasm: holds the organelles ✗'
  - say: 'The cell membrane is the selectively permeable layer round the cell. It lets some substances in and keeps others out, so the answer is the cell membrane.'
    write: '∴ cell membrane: controls entry and exit ✓'
    doodle_do:
      - {id: cell, op: circle, part: membrane, 'on': answer}
    point:
      - {line: 19, kind: circle, at: 'cell membrane'}

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is a common trap. Students mix up the nucleus and the nucleolus, because the names are close. The nucleus is the control centre, and the nucleolus is the small body inside it that makes ribosomes.'
    write: 'Trap: the nucleus controls; the nucleolus, inside it, makes ribosomes'
    doodle_do:
      - {id: cell, op: circle, part: nucleolus, 'on': small}
  - say: 'Here is another fact that JAMB likes. Most cells have a nucleus, but a mature red blood cell of a mammal, such as a human, has none.'
    write: 'Mature red blood cell of a mammal: no nucleus'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Which part of the cell holds the chromosomes? Is it the cytoplasm, the nucleus, the cell membrane or the nucleolus? Pause the lesson and decide before I go on.'
    write: 'Which part holds the chromosomes? Cytoplasm, nucleus, cell membrane, nucleolus'
  - say: 'The cytoplasm holds the organelles, the membrane controls entry and exit, and the nucleolus makes ribosomes. So none of these three is the answer.'
    write: 'Cytoplasm, membrane, nucleolus ✗'
  - say: 'The chromosomes, made of DNA, are kept in the nucleus, the control centre. So the answer is the nucleus.'
    write: '∴ nucleus: holds the chromosomes ✓'
    doodle_do:
      - {id: cell, op: circle, part: nucleus, 'on': answer}
    point:
      - {line: 24, kind: circle, at: 'nucleus'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. The cell membrane is selectively permeable, and it controls what enters and leaves the cell. The cytoplasm holds the organelles.'
    write: '1. Membrane: controls entry and exit. Cytoplasm: holds the organelles'
  - say: 'The nucleus is the control centre and holds the chromosomes, and the nucleolus makes ribosomes. In the next lesson, we look at the parts that release energy and make proteins. Now try the problem.'
    write: '2. Nucleus: control centre, chromosomes. Nucleolus: makes ribosomes'
    doodle_do:
      - {id: cell, op: pulse, part: nucleus, 'on': nucleus}

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Which part of an animal cell is the control centre of the cell? A. cytoplasm  B. cell membrane  C. nucleus  D. nucleolus'
    answer: 'C'
    accept: ['nucleus', 'C. nucleus', 'the nucleus']
    working:
      - 'The cytoplasm holds the organelles: not the control centre.'
      - 'The cell membrane controls what enters and leaves: not the control centre.'
      - 'The nucleolus is inside the nucleus and makes ribosomes.'
      - 'The nucleus holds the chromosomes (DNA) and controls the cell. Answer: C.'
    needs_working: false
