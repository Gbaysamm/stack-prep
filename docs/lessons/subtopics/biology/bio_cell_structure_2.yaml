# Mitochondria, endoplasmic reticulum and ribosomes (lesson 2 of 5): where the cell releases its
# energy and where it makes its proteins; the animal cell grows from stage a4 to a7.
format_version: 1
subject: biology
subtopic: 'Cell structure and functions of cell components'
subtopic_id: 3ef0e4af-860d-5467-8fd2-f23a09a82b77
part: 2
title: 'Mitochondria, endoplasmic reticulum and ribosomes'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/biology/
  - https://www.headteacher.ng/the-cell-cell-theory-forms-of-life-cell-structures-plant-animal-cell-for-sss-1/
  - https://edupadi.com/classroom/lessons/ss1/biology/the-cell/page/1
  - https://classnotes.ng/?p=70074
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is mitochondria, endoplasmic reticulum and ribosomes.'
    write: 'Mitochondria, endoplasmic reticulum and ribosomes'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson, you met the cell membrane, the cytoplasm and the nucleus, the control centre. Now we add three more organelles to the animal cell.'
    write: 'So far: cell membrane, cytoplasm, nucleus'
    doodle: {name: 'custom:sub_bio_cell_structure_a4', id: cell, size: scene, caption: 'an animal cell', 'on': membrane}

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn where the cell releases its energy, and where it makes and carries its proteins.'
    write: 'Today: where energy is released and proteins are made'

  # ---------------------------------------------------------------- mitochondria
  - section: 'Mitochondria'
    say: 'We start with the mitochondria. Just one of them is called a mitochondrion. Each one is sausage-shaped and has two membranes, and the inner membrane is folded into ridges called cristae.'
    write: 'Mitochondria (one: mitochondrion): sausage-shaped; inner folds called cristae'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a5', 'on': mitochondria}
  - say: 'The mitochondria are the site of aerobic respiration. In aerobic respiration, food such as glucose is broken down using oxygen, and energy is released.'
    write: 'Site of aerobic respiration: glucose broken down with oxygen'
    doodle_do:
      - {id: cell, op: pulse, part: mitochondrion, 'on': respiration}
  - say: 'The released energy is carried in a small molecule called ATP, and the cell uses ATP to power its work. Because the mitochondria supply the cell''s energy, they are called the powerhouse of the cell.'
    write: 'Energy released as ATP: the powerhouse of the cell'
    point:
      - {line: 5, kind: underline, at: 'powerhouse'}

  # ---------------------------------------------------------------- worked example
  - section: 'Worked example'
    say: 'Now that we know the mitochondria release energy, let us use this to explain a fact. A muscle cell and a sperm cell are both packed with mitochondria. Why?'
    write: 'Why are muscle and sperm cells packed with mitochondria?'
  - say: 'We are told what the two cells have, and we must explain it. So for each cell we ask one question. How much energy does it use?'
    write: 'Ask: how much energy does the cell use?'
  - say: 'A muscle cell contracts again and again, so it uses a lot of energy.'
    write: 'Muscle cell: contracts again and again, so much energy'
  - say: 'A sperm cell swims all the way to the egg, so it also uses a lot of energy.'
    write: 'Sperm cell: swims to the egg, so much energy'
  - say: 'Energy is released in the mitochondria, so a cell that uses a lot of energy needs many of them. That is why both cells are packed with mitochondria.'
    write: '∴ they use much energy, and mitochondria release it'
    doodle_do:
      - {id: cell, op: pulse, part: mitochondrion-2, 'on': many}
  - say: 'What does this tell us? The more energy a cell uses, the more mitochondria it has.'
    write: 'More energy used, more mitochondria'

  # ---------------------------------------------------------------- endoplasmic reticulum
  - section: 'Endoplasmic reticulum'
    say: 'We have seen where the cell releases its energy. Now we look at where it makes and carries its proteins. First comes the endoplasmic reticulum, or ER for short. It is a network of folded membranes and channels that runs through the cytoplasm.'
    write: 'Endoplasmic reticulum (ER): a network of membranes and channels'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a6', 'on': endoplasmic}
  - say: 'Its job is to transport materials. They move along its channels from one part of the cell to another.'
    write: 'Job: transports materials through the cell'
    doodle_do:
      - {id: cell, op: pulse, part: er, 'on': transport}

  # ---------------------------------------------------------------- ribosomes
  - section: 'Ribosomes'
    say: 'In the last lesson, we saw that the nucleolus makes ribosomes. Now we see what ribosomes are. They are tiny granules. Some are free in the cytoplasm, and some sit on the endoplasmic reticulum.'
    write: 'Ribosomes: tiny granules, free or on the ER'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a7', 'on': ribosomes}
  - say: 'The job of the ribosomes is to make proteins, following the instructions carried by the genes in the nucleus. Making proteins is called protein synthesis.'
    write: 'Job: make (synthesise) proteins, using instructions from the nucleus'
    doodle_do:
      - {id: cell, op: pulse, part: ribosomes, 'on': proteins}

  # ---------------------------------------------------------------- rough and smooth ER
  - section: 'Rough and smooth ER'
    say: 'There are two kinds of endoplasmic reticulum, and we tell them apart by the ribosomes. Endoplasmic reticulum with ribosomes on it is called rough endoplasmic reticulum, because the ribosomes make it look rough.'
    write: 'Rough ER: has ribosomes on it'
    doodle_do:
      - {id: cell, op: circle, part: er, 'on': rough}
  - say: 'Its ribosomes make proteins, and the rough endoplasmic reticulum carries these proteins through the cell.'
    write: 'Rough ER: carries the proteins'
  - say: 'Smooth endoplasmic reticulum has no ribosomes. It makes lipids, which are fats.'
    write: 'Smooth ER: no ribosomes; makes lipids (fats)'

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is a common trap. Some students write that mitochondria store energy. They do not. Mitochondria RELEASE energy from food, and the energy is stored in the food itself, such as starch, fat or glycogen, the food store of animals. Releasing energy and storing it are different jobs.'
    write: 'Trap: mitochondria RELEASE energy; they do not store it'
    point:
      - {line: 19, kind: underline, at: 'RELEASE'}
  - say: 'Here is another. Ribosomes make proteins, but it is the nucleolus that makes ribosomes. Read the question carefully to see whether it asks what makes proteins or what makes ribosomes.'
    write: 'Ribosomes make proteins; the nucleolus makes ribosomes'
    doodle_do:
      - {id: cell, op: circle, part: nucleolus, 'on': nucleolus}

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Which organelle is the site of protein synthesis? Is it the mitochondrion, the ribosome, the smooth endoplasmic reticulum or the nucleolus? Pause the lesson and decide before I go on.'
    write: 'Site of protein synthesis? Mitochondrion, ribosome, smooth ER, nucleolus'
  - say: 'The mitochondrion releases energy, so it is not the answer.'
    write: 'Mitochondrion: releases energy ✗'
  - say: 'Smooth endoplasmic reticulum makes lipids, not proteins, so it is not the answer either.'
    write: 'Smooth ER: makes lipids ✗'
  - say: 'The nucleolus makes ribosomes, not proteins, so it is not the answer.'
    write: 'Nucleolus: makes ribosomes ✗'
  - say: 'The ribosome makes proteins, so the answer is the ribosome.'
    write: '∴ ribosome ✓'
    doodle_do:
      - {id: cell, op: circle, part: ribosomes, 'on': answer}
    point:
      - {line: 25, kind: circle, at: 'ribosome'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. The mitochondria are the site of aerobic respiration, and they release energy as ATP.'
    write: '1. Mitochondria: aerobic respiration; release energy'
    doodle_do:
      - {id: cell, op: pulse, part: mitochondrion, 'on': mitochondria}
  - say: 'Ribosomes make proteins. The endoplasmic reticulum transports materials. The rough kind has ribosomes and carries their proteins, and the smooth kind makes lipids. In the next lesson, we see how the cell packs and sends out what it makes. Now try the problem.'
    write: '2. Ribosomes: make proteins. ER: transports (rough: proteins; smooth: lipids)'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Which organelle is the site of aerobic respiration? A. nucleus  B. ribosome  C. mitochondrion  D. endoplasmic reticulum'
    answer: 'C'
    accept: ['mitochondrion', 'mitochondria', 'C. mitochondrion']
    working:
      - 'The nucleus controls the cell: it does not respire.'
      - 'The ribosome makes proteins.'
      - 'The endoplasmic reticulum transports materials.'
      - 'Aerobic respiration, which releases energy, takes place in the mitochondrion. Answer: C.'
    needs_working: false
