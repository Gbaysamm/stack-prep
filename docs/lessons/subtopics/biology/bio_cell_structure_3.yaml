# Golgi body, lysosomes, centrioles and vacuoles (lesson 3 of 5): how the cell packs and sends out
# what it makes, breaks down waste, divides and stores; the animal cell is finished, stage a7 to
# a10 (a9c adds the centrioles alone, so the vacuole comes in on its own word).
format_version: 1
subject: biology
subtopic: 'Cell structure and functions of cell components'
subtopic_id: 3ef0e4af-860d-5467-8fd2-f23a09a82b77
part: 3
title: 'Golgi body, lysosomes, centrioles and vacuoles'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/biology/
  - https://www.headteacher.ng/the-cell-cell-theory-forms-of-life-cell-structures-plant-animal-cell-for-sss-1/
  - https://edupadi.com/classroom/lessons/ss1/biology/the-cell/page/1
  - https://classnotes.ng/?p=70074
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is the Golgi body, lysosomes, centrioles and vacuoles.'
    write: 'Golgi body, lysosomes, centrioles and vacuoles'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson, you saw that the ribosomes make proteins and the endoplasmic reticulum carries them. Now we finish the animal cell with four more parts.'
    write: 'So far: ribosomes make proteins; the ER carries them'
    doodle: {name: 'custom:sub_bio_cell_structure_a7', id: cell, size: scene, caption: 'an animal cell', 'on': ribosomes}

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn the jobs of the last four parts of the animal cell.'
    write: 'Today: the last four parts of the animal cell'

  # ---------------------------------------------------------------- Golgi body
  - section: 'Golgi body'
    say: 'We start with the Golgi body. It is a stack of flat, curved sacs.'
    write: 'Golgi body: a stack of flat, curved sacs'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a8', 'on': golgi}
  - say: 'The Golgi body packages substances, such as proteins, into tiny sacs called vesicles. The vesicles carry them to the cell membrane, and the cell secretes them. To secrete means to release a substance out of the cell.'
    write: 'Job: packages substances into vesicles and secretes them'
    doodle_do:
      - {id: cell, op: pulse, part: golgi, 'on': packages}
  - say: 'So the ribosomes make the proteins, the rough endoplasmic reticulum carries them, and the Golgi body packs them and sends them out.'
    write: 'Ribosomes make → rough ER carries → Golgi body packs and secretes'

  # ---------------------------------------------------------------- worked example
  - section: 'Worked example'
    say: 'Now let us use this. The gland cells of the stomach secrete digestive enzymes, and enzymes are proteins. Which organelle would you expect to be large in these cells?'
    write: 'Stomach gland cells secrete enzymes. Which organelle is large?'
  - say: 'We are given the cell''s main job, which is secreting. The Golgi body is the organelle that packages and secretes, so it is large in these cells.'
    write: '∴ the Golgi body: large in secreting cells'
    doodle_do:
      - {id: cell, op: circle, part: golgi, 'on': large}
    point:
      - {line: 7, kind: circle, at: 'Golgi body'}
  - say: 'What does this tell us? Cells that secrete a lot, such as cells that make enzymes, mucus or hormones, have a large Golgi body.'
    write: 'Secreting cells (enzymes, mucus, hormones): large Golgi body'

  # ---------------------------------------------------------------- lysosomes
  - section: 'Lysosomes'
    say: 'Next, the lysosomes. A lysosome is a small sac of digestive enzymes, and it is made by the Golgi body.'
    write: 'Lysosome: a small sac of digestive enzymes'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a9', 'on': lysosomes}
  - say: 'Its job is to break down worn-out parts of the cell, and germs that the cell has taken in.'
    write: 'Job: breaks down worn-out parts and germs'
    doodle_do:
      - {id: cell, op: pulse, part: lysosome, 'on': break}

  # ---------------------------------------------------------------- centrioles
  - section: 'Centrioles'
    say: 'Now the centrioles. They are a pair of short tubes, set at right angles to each other, near the nucleus.'
    write: 'Centrioles: a pair of short tubes at right angles'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a9c', 'on': centrioles}
  - say: 'When the cell divides, the centrioles form the spindle, a set of threads that pulls the chromosomes apart. Animal cells have centrioles, but the cells of flowering plants do not.'
    write: 'Job: form the spindle in cell division (animal cells)'
    doodle_do:
      - {id: cell, op: pulse, part: centrioles, 'on': spindle}

  # ---------------------------------------------------------------- vacuoles
  - section: 'Vacuoles'
    say: 'Last, the vacuoles. A vacuole is a sac filled with fluid.'
    write: 'Vacuole: a fluid-filled sac'
    doodle_do:
      - {id: cell, op: stage, stage: 'custom:sub_bio_cell_structure_a10', 'on': vacuoles}
  - say: 'In an animal cell, the vacuoles are few, small and temporary. They hold food or water for a short time.'
    write: 'Animal cell: vacuoles few, small and temporary'
    doodle_do:
      - {id: cell, op: circle, part: vacuole, 'on': small}

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is a common trap. The lysosome is made by the Golgi body, so students mix up the two. The Golgi body packages and secretes, but the lysosome breaks things down.'
    write: 'Trap: the Golgi body packages; the lysosome digests'
    doodle_do:
      - {id: cell, op: pulse, part: golgi, 'on': packages}
      - {id: cell, op: pulse, part: lysosome, 'on': breaks}
  - say: 'Here is another. Some students write that an animal cell has a large vacuole. It does not. It is the plant cell that has one large vacuole, as we see in the next lesson.'
    write: 'Large vacuole: plant cell. Animal cell: small, temporary vacuoles'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Which organelle forms the spindle when an animal cell divides? Is it the Golgi body, the lysosome, the centriole or the vacuole? Pause the lesson and decide before I go on.'
    write: 'Forms the spindle in cell division? Golgi body, lysosome, centriole, vacuole'
  - say: 'The Golgi body packages, the lysosome digests and the vacuole stores. So none of these three forms the spindle.'
    write: 'Golgi body, lysosome, vacuole ✗'
  - say: 'The centrioles form the spindle that pulls the chromosomes apart. So the answer is the centriole.'
    write: '∴ centriole ✓'
    doodle_do:
      - {id: cell, op: circle, part: centrioles, 'on': answer}
    point:
      - {line: 19, kind: circle, at: 'centriole'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. The Golgi body packages and secretes, and the lysosomes break down waste and germs.'
    write: '1. Golgi body: packages, secretes. Lysosome: digests'
  - say: 'The centrioles form the spindle in cell division, and an animal cell''s vacuoles are small and temporary. In the next lesson, we look at the plant cell. Now try the problem.'
    write: '2. Centrioles: spindle. Vacuoles: small, temporary'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Which organelle is a small sac of digestive enzymes that breaks down worn-out parts of the cell? A. ribosome  B. lysosome  C. centriole  D. Golgi body'
    answer: 'B'
    accept: ['lysosome', 'lysosomes', 'B. lysosome']
    working:
      - 'The ribosome makes proteins.'
      - 'The centriole forms the spindle in cell division.'
      - 'The Golgi body packages and secretes; it makes the lysosomes, but it does not digest.'
      - 'The lysosome holds digestive enzymes that break down worn-out parts and germs. Answer: B.'
    needs_working: false
