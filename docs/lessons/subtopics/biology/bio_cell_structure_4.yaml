# The plant cell (lesson 4 of 5): the parts a plant cell shares with an animal cell, then the
# three it alone has, each popping into the drawing on its word (data-later parts of b: wall,
# chloroplasts, vacuole).
format_version: 1
subject: biology
subtopic: 'Cell structure and functions of cell components'
subtopic_id: 3ef0e4af-860d-5467-8fd2-f23a09a82b77
part: 4
title: 'The plant cell'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/biology/
  - https://www.headteacher.ng/the-cell-cell-theory-forms-of-life-cell-structures-plant-animal-cell-for-sss-1/
  - https://edupadi.com/classroom/lessons/ss1/biology/the-cell/page/1
  - https://classnotes.ng/?p=70074
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is the plant cell.'
    write: 'The plant cell'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last three lessons, you built up an animal cell, part by part. A plant cell has most of the same parts.'
    write: 'A plant cell has most of the same parts'
  - say: 'Like an animal cell, a plant cell has a cell membrane, cytoplasm, a nucleus and mitochondria. It also has ribosomes, endoplasmic reticulum and a Golgi body.'
    write: 'Also in a plant cell: membrane, cytoplasm, nucleus, mitochondria, ribosomes, ER, Golgi body'
    doodle: {name: 'custom:sub_bio_cell_structure_b', id: plant, size: scene, caption: 'a plant cell', 'on': plant}
    doodle_do:
      - {id: plant, op: pulse, part: membrane, 'on': membrane}
      - {id: plant, op: pulse, part: nucleus, 'on': nucleus}
      - {id: plant, op: pulse, part: mitochondrion, 'on': mitochondria}
  - say: 'It also has three structures that an animal cell does not have. They are the cell wall, chloroplasts and a large central vacuole.'
    write: 'Plant only: cell wall, chloroplasts, large vacuole'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn the job of each of these three structures.'
    write: 'Today: the three parts only plant cells have'

  # ---------------------------------------------------------------- cell wall
  - section: 'Cell wall'
    say: 'First, the cell wall. It lies outside the cell membrane, and it is made of cellulose.'
    write: 'Cell wall: outside the membrane; made of cellulose'
    doodle_do:
      - {id: plant, op: show, part: wall, 'on': wall}
  - say: 'The cell wall gives the cell a fixed shape and supports it. It also stops the cell bursting when it takes in a lot of water.'
    write: 'Job: gives shape and support; stops the cell bursting'
    doodle_do:
      - {id: plant, op: pulse, part: wall, 'on': shape}
  - say: 'The cell wall is fully permeable, which means it lets almost everything through. So it is the cell membrane, just inside the wall, that controls what enters and leaves.'
    write: 'Wall: fully permeable. Membrane: selectively permeable'
    doodle_do:
      - {id: plant, op: pulse, part: membrane, 'on': membrane}

  # ---------------------------------------------------------------- chloroplasts
  - section: 'Chloroplasts'
    say: 'Second, the chloroplasts. These are the oval green bodies in the cytoplasm.'
    write: 'Chloroplasts: oval green bodies in the cytoplasm'
    doodle_do:
      - {id: plant, op: show, part: chloroplasts, 'on': chloroplasts}
  - say: 'They contain a green pigment called chlorophyll, which traps light energy. They are the site of photosynthesis, where the plant makes its food.'
    write: 'Contain chlorophyll; site of photosynthesis'
    doodle_do:
      - {id: plant, op: pulse, part: chloroplasts, 'on': photosynthesis}

  # ---------------------------------------------------------------- worked example
  - section: 'Worked example'
    say: 'Now let us use this. Does a root cell of a cassava plant have chloroplasts? We are told where the cell is, under the ground, and we must decide.'
    write: 'Does a cassava root cell have chloroplasts?'
  - say: 'Chloroplasts are for photosynthesis, and photosynthesis needs light. A root cell is in the dark soil, so it does not photosynthesise.'
    write: 'Root: no light, so no photosynthesis'
  - say: 'So a cassava root cell has no chloroplasts. What does this tell us? Not every plant cell has chloroplasts. Onion skin cells have none either.'
    write: '∴ no chloroplasts in root or onion skin cells'
    point:
      - {line: 12, kind: circle, at: 'no chloroplasts'}

  # ---------------------------------------------------------------- large central vacuole
  - section: 'Large central vacuole'
    say: 'Third, the large central vacuole. A plant cell has one large vacuole in the middle, full of a liquid called cell sap.'
    write: 'Large central vacuole: full of cell sap'
    doodle_do:
      - {id: plant, op: show, part: vacuole, 'on': vacuole}
  - say: 'The vacuole keeps the cell firm. It also presses the cytoplasm into a thin layer, and pushes the nucleus to one side.'
    write: 'Keeps the cell firm; nucleus pushed to the side'
    doodle_do:
      - {id: plant, op: pulse, part: vacuole, 'on': firm}
      - {id: plant, op: pulse, part: nucleus, 'on': nucleus}

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is a common trap. Many students think plant cells have no mitochondria, because they have chloroplasts. They do have mitochondria, because a plant cell respires all the time, day and night.'
    write: 'Trap: plant cells have mitochondria too'
    doodle_do:
      - {id: plant, op: circle, part: mitochondrion, 'on': mitochondria}
  - say: 'Here is another. Chlorophyll is the green pigment, and the chloroplast is the organelle that holds it. Do not write one for the other.'
    write: 'Chlorophyll: the pigment. Chloroplast: the organelle that holds it'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Which part of a plant cell is made of cellulose and gives the cell its shape? Is it the cell membrane, the cell wall, the vacuole or the chloroplast? Pause the lesson and decide before I go on.'
    write: 'Made of cellulose, gives shape? Membrane, wall, vacuole, chloroplast'
  - say: 'The membrane controls entry and exit, the vacuole holds cell sap, and the chloroplast makes food. None of these three is made of cellulose.'
    write: 'Membrane, vacuole, chloroplast ✗'
  - say: 'The cell wall is made of cellulose and gives the cell its shape. So the answer is the cell wall.'
    write: '∴ cell wall ✓'
    doodle_do:
      - {id: plant, op: pulse, part: wall, 'on': answer}
    point:
      - {line: 19, kind: circle, at: 'cell wall'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. A plant cell has the same parts as an animal cell, and three more.'
    write: '1. Plant cell: the same parts, plus three more'
  - say: 'The cell wall gives shape, the chloroplasts carry out photosynthesis, and the large vacuole keeps the cell firm. In the next lesson, we compare the two cells. Now try the problem.'
    write: '2. Wall: shape. Chloroplasts: photosynthesis. Vacuole: keeps it firm'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Which structure in a plant cell contains chlorophyll? A. vacuole  B. cell wall  C. chloroplast  D. nucleus'
    answer: 'C'
    accept: ['chloroplast', 'chloroplasts', 'C. chloroplast']
    working:
      - 'The vacuole holds cell sap.'
      - 'The cell wall is made of cellulose and gives shape.'
      - 'The nucleus controls the cell.'
      - 'The chloroplast holds the green pigment chlorophyll and carries out photosynthesis. Answer: C.'
    needs_working: false
