<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="A textbook animal cell, built up part by part: a rounded cell inside a thin cell membrane; cytoplasm with granules; a round nucleus with a double membrane, chromatin and a nucleolus; two mitochondria with cristae; endoplasmic reticulum sacs; ribosomes on the reticulum and free; a Golgi body of stacked sacs; a small round lysosome; two centrioles and a small vacuole. Coloured labels with arrows and jobs: cell membrane (controls entry and exit), cytoplasm (holds the organelles), nucleus (controls the cell, holds DNA), nucleolus (makes ribosomes), mitochondrion (respiration, energy), endoplasmic reticulum (transport), ribosomes (make proteins), Golgi body (packages), lysosome (digests waste), centrioles (spindle), vacuole (storage)"><g transform="translate(24 15) scale(0.85)"><path data-part="membrane" d="M160 22C200 20 228 40 232 72C236 100 230 132 214 154C196 176 160 180 128 174C100 168 86 146 88 112C89 82 96 56 116 38C128 27 142 23 160 22Z" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/></g><g font-family="Caveat, cursive" fill="#1d1b3a" text-anchor="start"><text x="226" y="16" font-size="14">cell membrane</text><text x="226" y="28" font-size="12">controls entry, exit</text></g><path d="M223 12L203.3 43.9M207.5 41.2L203.3 43.9L203.8 38.9" fill="none" stroke="#1d1b3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(24 15) scale(0.85)"><g data-part="cytoplasm"><path d="M160 22C200 20 228 40 232 72C236 100 230 132 214 154C196 176 160 180 128 174C100 168 86 146 88 112C89 82 96 56 116 38C128 27 142 23 160 22Z" fill="#fde047" fill-opacity="0.35" stroke="none"/><g fill="#1d1b3a"><circle cx="178" cy="62" r="1.3"/><circle cx="140" cy="40" r="1.3"/><circle cx="135" cy="132" r="1.3"/><circle cx="215" cy="140" r="1.3"/><circle cx="165" cy="166" r="1.3"/><circle cx="100" cy="140" r="1.3"/><cir