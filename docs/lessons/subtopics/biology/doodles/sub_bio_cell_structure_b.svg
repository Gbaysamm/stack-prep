<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="A labelled plant cell drawn as in a textbook: a box-shaped cell with a thick cellulose cell wall, a thin cell membrane pressed against it, a large central vacuole full of cell sap, cytoplasm as a thin layer round the edge, the nucleus with its nucleolus pushed to one side, oval green chloroplasts with grana round the edge, and a mitochondrion. Coloured labels, each with an arrow and a note of its job: cell wall (cellulose, support), cell membrane (controls entry and exit), chloroplast (photosynthesis), cytoplasm (holds organelles), mitochondrion (respiration releases energy), vacuole (cell sap, keeps the cell firm), nucleus (controls the cell), nucleolus (makes ribosomes)"><g transform="translate(24 15) scale(0.85)"><g data-part="wall" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"><rect x="76" y="14" width="168" height="172" rx="5" fill="#22c55e" fill-opacity="0.35"/><rect x="84" y="22" width="152" height="156" rx="3" fill="#ffffff"/></g><g data-part="cytoplasm"><path d="M89 25H231Q233 25 233 27V173Q233 175 231 175H89Q87 175 87 173V27Q87 25 89 25ZM106 38H218Q224 38 224 44V72Q192 76 190 100Q192 124 224 128V156Q224 162 218 162H106Q100 162 100 156V44Q100 38 106 38Z" fill="#fde047" fill-opacity="0.35" fill-rule="evenodd" stroke="none"/><g fill="#1d1b3a"><circle cx="94" cy="100" r="1.2"/><circle cx="145" cy="31" r="1.2"/><circle cx="228" cy="100" r="1.2"/><circle cx="170" cy="169" r="1.2"/></g></g><path data-part="membrane" d="M89 25H231Q233 25 233 27V173Q233 175 231 175H89Q87 175 87 173V27Q87 25 89 25Z" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"/><path data-part="vacuole" d="M106 38H218Q224 38 224 44V72Q192 76 190 100Q192 124 224 128V156Q224 162 218 162H106Q100 162 100 156V44Q100 38 106 38Z" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2" stroke-linejoi