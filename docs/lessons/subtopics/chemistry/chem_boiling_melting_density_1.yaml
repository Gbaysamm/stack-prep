# Melting and freezing points (lesson 1 of 6): the big picture of the topic, the melting point read from the first part of the heating curve, why the line is flat, identifying a solid from its melting point, and the freezing point of a pure substance.
format_version: 1
subject: chemistry
subtopic: 'Boiling, density, freezing and melting points'
subtopic_id: 181e119e-6a41-5215-816d-834d6d563163
part: 1
title: 'Melting and freezing points'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://edupadi.com/classroom/l/classification-of-matter
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is melting and freezing points.'
    write: 'Melting and freezing points'

  # ---------------------------------------------------------------- introduction: the big picture
  - section: 'Introduction'
    say: 'When you heat a solid, it melts into a liquid. When you heat the liquid further, it boils and turns into a gas. When the liquid cools, it freezes back into a solid.'
    write: 'Heating: solid → liquid → gas. Cooling: liquid → solid'
  - say: 'Every pure substance does these things at its own fixed temperatures. They are called its melting point, its freezing point and its boiling point.'
    write: 'Fixed temperatures: melting point, freezing point, boiling point'
  - say: 'These temperatures help chemists to identify a substance, to test whether it is pure and to separate one liquid from another. Later in this topic, you will also meet density, which tells us how heavy a substance is for its size.'
    write: 'They identify a substance, test purity and help to separate liquids'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn what the melting point and the freezing point are, and how to read them from a heating curve.'
    write: 'Today: melting point, freezing point and the heating curve'

  # ---------------------------------------------------------------- melting point
  - section: 'Melting point'
    say: 'Let us start with melting. The melting point of a solid is the temperature at which it changes into a liquid. We write melting point in short as m.p.'
    write: 'Melting point (m.p.): the temperature at which a solid becomes a liquid'
    point:
      - {line: 5, kind: underline, at: 'a solid becomes a liquid'}
  - say: 'While the solid is melting, the solid and the liquid are both present, and the temperature stays at the melting point until all the solid has melted.'
    write: 'While melting: solid and liquid together, temperature steady'

  # ---------------------------------------------------------------- the heating curve
  - section: 'The heating curve'
    say: 'We can see the melting point on a heating curve. A heating curve is a graph of the temperature of a substance against time, as it is heated steadily.'
    write: 'Heating curve: temperature against time, heated steadily'
    diagram:
      id: g
      kind: graph
      'on': graph
      caption: 'heating curve of ice'
      size: scene
      x: [0, 10]
      y: [-20, 40]
      x_step: 2
      y_step: 10
      x_label: 'time (min)'
      y_label: 'temperature (°C)'
      plots:
        - {points: [[0, -20], [2, 0]], join: straight, label: 'ice warms', colour: blue, later: true}
        - {points: [[2, 0], [6, 0]], join: straight, label: 'melting', colour: purple, later: true}
        - {points: [[6, 0], [9, 30]], join: straight, label: 'water warms', colour: blue, later: true}
  - say: 'Time in minutes goes along the bottom, and temperature in degrees Celsius goes up the side. Now let us heat some ice.'
    write: 'Time along the bottom, temperature up the side'
  - say: 'We start with ice at minus 20 degrees Celsius. As heat goes in, the ice warms up steadily to 0 degrees Celsius.'
    write: 'Ice warms from −20 °C to 0 °C'
    diagram_do:
      - {id: g, op: plot, 'on': warms}
  - say: 'Then the line goes flat. The ice is melting, and the temperature stays at 0 degrees Celsius until all of it has melted. So the melting point of ice is 0 degrees Celsius.'
    write: 'Flat part: ice melting, so the m.p. of ice is 0 °C'
    diagram_do:
      - {id: g, op: plot, 'on': flat}
      - {id: g, op: point, x: 2, y: 0, text: 'm.p. = 0 °C', colour: purple, 'on': melting point}
  - say: 'Why is the line flat? Heat is still going in, but it is used to break the forces that hold the particles together in the solid. So the temperature does not rise.'
    write: 'Heat breaks the forces between the particles, so the temperature is steady'
    diagram_do:
      - {id: g, op: highlight, part: 'plot:2', 'on': forces}
  - say: 'Once all the ice has melted, the heat warms the water, and the line rises again.'
    write: 'All melted: the water warms, and the line rises'
    diagram_do:
      - {id: g, op: plot, 'on': rises}

  # worked example: identify a solid
  - section: 'Worked example'
    say: 'Now let us use a melting point to identify a solid. We are given a white solid that melts sharply at 133 degrees Celsius, and we must find which substance it is.'
    write: 'Example: a white solid melts sharply at 133 °C. Which is it?'
  - say: 'A data book lists melting points. Naphthalene melts at 80 degrees Celsius, urea at 133 degrees Celsius and sodium chloride at 801 degrees Celsius.'
    write: 'Data book: naphthalene 80 °C, urea 133 °C, sodium chloride (NaCl) 801 °C'
  - say: 'A pure substance melts at one sharp temperature, and this solid does. So it is pure, and its melting point can be matched with the data book.'
    write: 'Sharp m.p., so it is pure: match it with the data book'
  - say: 'What does this tell us? 133 degrees Celsius matches urea, and no other value is close. So the white solid is urea.'
    write: '133 °C is the m.p. of urea, so the solid is urea'
    point:
      - {line: 16, kind: circle, at: 'the solid is urea'}

  # ---------------------------------------------------------------- freezing point
  - section: 'Freezing point'
    say: 'Now the reverse. The freezing point of a liquid is the temperature at which it changes into a solid. We write freezing point in short as f.p.'
    write: 'Freezing point (f.p.): the temperature at which a liquid becomes a solid'
  - say: 'Cooling runs the heating curve backwards. As water cools, the line goes flat at 0 degrees Celsius while the water freezes. So pure water freezes at 0 degrees Celsius, the same temperature at which ice melts.'
    write: 'Water freezes at 0 °C, where ice melts'
    diagram_do:
      - {id: g, op: label, part: 'plot:2', text: 'freezing point = melting point', 'on': freezes}
  - say: 'This is true of every pure substance. Its freezing point is the same as its melting point.'
    write: 'Pure substance: f.p. = m.p.'
    point:
      - {line: 19, kind: underline, at: 'f.p. = m.p.'}

  # worked example: freezing point from a cooling
  - section: 'Worked example'
    say: 'Let us solve this. A pure liquid is cooled. Its temperature falls, stays at 17 degrees Celsius for four minutes and then falls again. We must find its freezing point and its melting point.'
    write: 'Example: a pure liquid cools; temperature steady at 17 °C. Find its f.p. and m.p.'
  - say: 'The temperature stays steady while the liquid turns to solid, just like the flat part of the curve. So the freezing point is 17 degrees Celsius.'
    write: 'Steady while freezing, so f.p. = 17 °C'
  - say: 'The liquid is pure, and for a pure substance the melting point equals the freezing point. So the melting point is also 17 degrees Celsius.'
    write: 'Pure, so m.p. = f.p. = 17 °C'
  - say: 'What does this tell us? Below 17 degrees Celsius, this substance is a solid. Pure ethanoic acid, the acid in vinegar, freezes at about 17 degrees Celsius. So it can freeze in the bottle on a cold harmattan morning, and it is called glacial ethanoic acid.'
    write: 'Pure (glacial) ethanoic acid: f.p. about 17 °C'

  # ---------------------------------------------------------------- trap
  - section: 'JAMB trap'
    say: 'Here is a common trap. Some students think the temperature rises while a solid melts, because heat is still going in. It does not. The heat breaks the forces between the particles, so the temperature stays steady until all the solid has melted.'
    write: 'Trap: while melting, heat goes in but the temperature stays steady'
    diagram_do:
      - {id: g, op: highlight, part: 'plot:2', 'on': steady}

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. A pure solid X melts at 44 degrees Celsius. At what temperature does liquid X freeze? Pause the lesson and decide before I go on.'
    write: 'Pure X: m.p. 44 °C. At what temperature does it freeze?'
  - say: 'X is pure, so its freezing point equals its melting point. Liquid X freezes at 44 degrees Celsius.'
    write: 'Pure, so f.p. = m.p. = 44 °C ✓'
    point:
      - {line: 26, kind: circle, at: '44 °C'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. The melting point is the temperature at which a solid becomes a liquid, and the freezing point is the reverse. For a pure substance, they are the same temperature.'
    write: '1. m.p.: solid → liquid; f.p.: liquid → solid; pure: f.p. = m.p.'
  - say: 'On a heating curve, the flat part shows melting, because the heat breaks the forces between the particles. In the next lesson, we look at boiling. Now try the problem.'
    write: '2. Flat part of the heating curve: melting, temperature steady'
    diagram_do:
      - {id: g, op: highlight, part: 'plot:2', 'on': flat}

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'A pure solid is heated steadily. Its temperature rises, stays at 80 °C for five minutes, then rises again. What is its freezing point?'
    answer: '80 °C'
    accept: ['80', '80°C', '80 C', '80 degrees', '80 degrees Celsius']
    working:
      - 'The temperature stays steady while the solid melts, so its melting point is 80 °C.'
      - 'For a pure substance, the freezing point equals the melting point.'
      - 'So the freezing point is 80 °C.'
    needs_working: false
