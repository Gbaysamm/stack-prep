# The boiling point (lesson 2 of 6): the second flat part of the heating curve, vapour pressure taught before the definition, the boiling point and standard pressure, how pressure changes it, the pressure cooker, and JAMB's Jos Plateau question.
format_version: 1
subject: chemistry
subtopic: 'Boiling, density, freezing and melting points'
subtopic_id: 181e119e-6a41-5215-816d-834d6d563163
part: 2
title: 'The boiling point'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://edupadi.com/classroom/l/classification-of-matter
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is the boiling point.'
    write: 'The boiling point'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson, you saw the flat part of the heating curve where ice melts at 0 degrees Celsius. Now we heat the water further, until it boils.'
    write: 'After melting: heat the water until it boils'
    diagram:
      id: g
      kind: graph
      'on': curve
      caption: 'heating curve of ice'
      size: scene
      x: [0, 24]
      y: [-20, 120]
      x_step: 2
      y_step: 20
      x_label: 'time (min)'
      y_label: 'temperature (°C)'
      plots:
        - {points: [[0, -20], [1, 0]], join: straight, label: 'ice warms', colour: blue}
        - {points: [[1, 0], [4, 0]], join: straight, label: 'melting', colour: purple}
        - {points: [[4, 0], [14, 100]], join: straight, label: 'water warms', colour: blue, later: true}
        - {points: [[14, 100], [22, 100]], join: straight, label: 'boiling', colour: purple, later: true}

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn what the boiling point is, and how pressure changes it.'
    write: 'Today: the boiling point, and how pressure changes it'

  # ---------------------------------------------------------------- the curve
  - section: 'The heating curve'
    say: 'Let us go back to the curve. After the ice has melted, the water warms steadily from 0 to 100 degrees Celsius.'
    write: 'Water warms from 0 °C to 100 °C'
    diagram_do:
      - {id: g, op: plot, 'on': warms}
  - say: 'Then the line goes flat again. The water is boiling, and the temperature stays at 100 degrees Celsius until all of it has turned to steam.'
    write: 'Second flat part: water boiling at 100 °C'
    diagram_do:
      - {id: g, op: plot, 'on': flat}
      - {id: g, op: point, x: 14, y: 100, text: 'b.p. = 100 °C', colour: purple, 'on': boiling}
  - say: 'Once again, heat goes in but the temperature does not rise. This time, the heat breaks the forces that still hold the particles together in the liquid, and sets them free as a gas.'
    write: 'Heat sets the particles free as a gas, so the temperature is steady'
    diagram_do:
      - {id: g, op: highlight, part: 'plot:4', 'on': forces}

  # ---------------------------------------------------------------- vapour pressure, taught before it is used
  - section: 'Vapour pressure'
    say: 'Why does water boil at 100 degrees Celsius? To see this, we need an idea called vapour pressure.'
    write: 'Why 100 °C? We need vapour pressure'
  - say: 'Even below its boiling point, some particles escape from the surface of a liquid and form a gas above it, called vapour. This vapour presses on everything around it, and its pressure is called the vapour pressure of the liquid.'
    write: 'Vapour pressure: the pressure of the vapour from a liquid'
  - say: 'In a closed space, the vapour builds up until the space holds as much vapour as it can. The vapour pressure at that point is called the saturated vapour pressure.'
    write: 'Saturated vapour pressure: the most vapour the space can hold'
  - say: 'As the liquid gets hotter, more particles escape, so its vapour pressure rises.'
    write: 'Hotter liquid, higher vapour pressure'
  - say: 'The liquid is also pressed on from outside. The air above it presses down on its surface, and this is called the external pressure.'
    write: 'External pressure: the air pressing on the liquid'

  # ---------------------------------------------------------------- boiling point
  - section: 'Boiling point'
    say: 'Now we can define the boiling point. The boiling point of a liquid is the temperature at which its saturated vapour pressure equals the external pressure. For short, we write boiling point as b.p.'
    write: 'Boiling point (b.p.): saturated vapour pressure = external pressure'
    point:
      - {line: 11, kind: underline, at: 'saturated vapour pressure = external pressure'}
  - say: 'At that temperature, the vapour pushes out as hard as the air pushes in. So bubbles of vapour can form all through the liquid without being squashed, and the liquid boils.'
    write: 'Then bubbles form all through the liquid, and it boils'

  # ---------------------------------------------------------------- pressure
  - section: 'Pressure'
    say: 'So the boiling point depends on the external pressure. To compare pressures, we measure air pressure by the height of mercury it can hold up in a tube, in millimetres of mercury. Standard pressure, the usual air pressure at sea level, is 760 millimetres of mercury.'
    write: 'Standard pressure: 760 mmHg (millimetres of mercury)'
  - say: 'Water boils at 100 degrees Celsius only at standard pressure. At any other pressure, its boiling point is different.'
    write: 'Water: b.p. 100 °C at 760 mmHg'
  - say: 'If the external pressure is lower, the vapour pressure reaches it at a lower temperature. So the liquid boils at a lower temperature.'
    write: 'Lower external pressure → lower b.p.'
  - say: 'If the external pressure is higher, the liquid must get hotter before its vapour pressure reaches it. So the boiling point is higher.'
    write: 'Higher external pressure → higher b.p.'

  # worked example: pressure cooker
  - section: 'Worked example'
    say: 'Here is an example. A pressure cooker traps the steam, so the pressure inside rises above 760 millimetres of mercury. We must find what happens to the boiling point of the water inside.'
    write: 'Example: pressure cooker, pressure above 760 mmHg. b.p. of the water?'
  - say: 'The pressure inside is higher than standard pressure, so the vapour pressure of the water must rise higher before it equals it. That means the water must get hotter before it boils, so it boils above 100 degrees Celsius.'
    write: 'Higher pressure, so b.p. above 100 °C'
  - say: 'What does this tell us? The water is hotter than in an open pot, and food cooks faster in hotter water. So beans cook faster in a pressure cooker.'
    write: 'Hotter water, so the beans cook faster'

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is a question of the kind JAMB sets. On the Jos Plateau, the air pressure is below 760 millimetres of mercury. Does pure water there boil at exactly 100 degrees Celsius, above 100 degrees Celsius, below 100 degrees Celsius or at 0 degrees Celsius?'
    write: 'Jos Plateau, pressure below 760 mmHg: b.p. of water? A. 100 °C B. above 100 °C C. below 100 °C D. 0 °C'
  - say: 'The air pressure is lower, so the vapour pressure of the water reaches it at a lower temperature. The answer is C, below 100 degrees Celsius.'
    write: 'Lower pressure, so lower b.p.: C, below 100 °C ✓'
  - say: 'The trap is A. Many students take 100 degrees Celsius as the boiling point of water everywhere. But a boiling point always goes with a pressure, and water boils at exactly 100 degrees Celsius only at 760 millimetres of mercury.'
    write: 'A ✗: 100 °C only at 760 mmHg'
    point:
      - {line: 22, kind: circle, at: '760 mmHg'}

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. A liquid boils at 78 degrees Celsius at 760 millimetres of mercury. On a high mountain, the air pressure is lower. Does the liquid boil above or below 78 degrees Celsius there? Pause the lesson and decide before I go on.'
    write: 'b.p. 78 °C at 760 mmHg. On a mountain, lower pressure: above or below 78 °C?'
  - say: 'The external pressure is lower, so the vapour pressure reaches it at a lower temperature. The liquid boils below 78 degrees Celsius.'
    write: 'Lower pressure, so b.p. below 78 °C ✓'
    point:
      - {line: 24, kind: circle, at: 'below 78 °C'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. The boiling point is the temperature at which the saturated vapour pressure of a liquid equals the external pressure. On the heating curve, it is the second flat part.'
    write: '1. b.p.: vapour pressure = external pressure; the second flat part'
    diagram_do:
      - {id: g, op: highlight, part: 'plot:4', 'on': flat}
  - say: 'Water boils at 100 degrees Celsius only at 760 millimetres of mercury. A lower pressure gives a lower boiling point, and a higher pressure gives a higher one. In the next lesson, we meet the kelvin scale. Now try the problem.'
    write: '2. 100 °C at 760 mmHg; lower pressure → lower b.p.'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'At the top of a high mountain, the air pressure is 500 mmHg. Pure water there boils at: A. exactly 100 °C  B. above 100 °C  C. below 100 °C  D. 0 °C'
    answer: 'C'
    accept: ['below 100 °C', 'below 100', 'below', 'C. below 100 °C']
    working:
      - '500 mmHg is lower than standard pressure, 760 mmHg.'
      - 'With a lower external pressure, the vapour pressure of the water reaches it at a lower temperature.'
      - 'So the water boils below 100 °C. Answer: C.'
    needs_working: false
