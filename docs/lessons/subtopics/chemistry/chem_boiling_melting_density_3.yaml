# Temperature in kelvin (lesson 3 of 6): the Celsius and kelvin scales side by side, absolute zero, why kelvin is always 273 more, changing degrees Celsius to kelvin and back, and the degree-sign trap.
format_version: 1
subject: chemistry
subtopic: 'Boiling, density, freezing and melting points'
subtopic_id: 181e119e-6a41-5215-816d-834d6d563163
part: 3
title: 'Temperature in kelvin'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://edupadi.com/classroom/l/classification-of-matter
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is temperature in kelvin.'
    write: 'Temperature in kelvin'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last two lessons, every temperature was in degrees Celsius. Chemists also use a second scale, the kelvin scale, and JAMB often gives temperatures in kelvin. Here are the two scales side by side.'
    write: 'Two scales: degrees Celsius (°C) and kelvin (K)'
    doodle: {name: 'custom:sub_chem_boiling_melting_density_c', id: sc, size: scene, caption: 'two temperature scales', 'on': side by side}

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn what the kelvin scale is, and how to change degrees Celsius to kelvin and back.'
    write: 'Today: change °C to K, and K to °C'

  # ---------------------------------------------------------------- the two scales
  - section: 'The Celsius scale'
    say: 'Let us start with the scale you know. On the Celsius scale, ice melts at 0 degrees, and water boils at 100 degrees at standard pressure.'
    write: 'Celsius: ice melts at 0 °C, water boils at 100 °C'
    doodle_do:
      - {id: sc, op: show, part: c-melt, 'on': melts}
      - {id: sc, op: show, part: c-boil, 'on': boils}
  - section: 'The kelvin scale'
    say: 'The kelvin scale starts lower, at absolute zero. This is the coldest temperature there can be, where the particles have the least energy they can have.'
    write: 'Kelvin: starts at absolute zero, the coldest there can be'
    doodle_do:
      - {id: sc, op: show, part: k-zero, 'on': absolute zero}
  - say: 'Absolute zero is 0 kelvin, which is about minus 273 degrees Celsius.'
    write: '0 K = −273 °C'
    doodle_do:
      - {id: sc, op: show, part: c-zero, 'on': '273'}
  - say: 'A step of one kelvin is the same size as a step of one degree Celsius. So every temperature in kelvin is 273 more than the same temperature in degrees Celsius.'
    write: 'Same size of step, so K is always 273 more than °C'
    point:
      - {line: 6, kind: underline, at: '273 more'}
  - say: 'For example, ice melts at 0 degrees Celsius, which is 273 kelvin.'
    write: 'Ice melts: 0 °C = 273 K'
    doodle_do:
      - {id: sc, op: show, part: k-melt, 'on': kelvin}
  - say: 'Water boils at 100 degrees Celsius, which is 373 kelvin.'
    write: 'Water boils: 100 °C = 373 K'
    doodle_do:
      - {id: sc, op: show, part: k-boil, 'on': kelvin}

  # ---------------------------------------------------------------- Celsius to kelvin
  - section: 'Celsius to kelvin'
    say: 'So to change degrees Celsius to kelvin, we add 273.'
    write: 'Celsius to kelvin: add 273'
  - say: 'Let us solve this. Ethanol boils at 78 degrees Celsius. We must find its boiling point in kelvin.'
    write: 'Example 1: ethanol, b.p. 78 °C. In kelvin?'
  - say: 'We are going from Celsius to kelvin, so we add 273. 78 plus 273 is 351, so ethanol boils at 351 kelvin.'
    write: '78 + 273 = 351 K'
    point:
      - {line: 11, kind: circle, at: '351 K'}

  # ---------------------------------------------------------------- kelvin to Celsius
  - section: 'Kelvin to Celsius'
    say: 'To go back from kelvin to degrees Celsius, we do the reverse and subtract 273.'
    write: 'Kelvin to Celsius: subtract 273'
  - say: 'Let us solve this. A gas is at 300 kelvin. We must find its temperature in degrees Celsius.'
    write: 'Example 2: a gas at 300 K. In °C?'
  - say: 'We are going from kelvin to Celsius, so we subtract 273. 300 minus 273 is 27, so the gas is at 27 degrees Celsius.'
    write: '300 − 273 = 27 °C'
  - say: 'What does this tell us? 27 degrees Celsius is about the temperature of a warm room, so 300 kelvin is room temperature, not a very hot gas.'
    write: '300 K is about room temperature'

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is a common trap. Kelvin is written as a capital K with no degree sign. Write 351 K, not 351 degrees K.'
    write: 'Trap: write 351 K, never 351 °K'
  - say: 'A quick check also stops you adding when you should subtract. The kelvin number is always the bigger of the two, by 273.'
    write: 'Check: the kelvin number is always 273 bigger'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Pure benzene melts at 5.5 degrees Celsius. What is its freezing point in kelvin? Pause the lesson and work it out.'
    write: 'Pure benzene: m.p. 5.5 °C. Its f.p. in kelvin?'
  - say: 'Benzene is pure, so its freezing point equals its melting point, which is 5.5 degrees Celsius.'
    write: 'Pure, so f.p. = m.p. = 5.5 °C'
  - say: 'To change to kelvin, we add 273. 5.5 plus 273 is 278.5 kelvin.'
    write: '5.5 + 273 = 278.5 K'
    point:
      - {line: 20, kind: circle, at: '278.5 K'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. The kelvin scale starts at absolute zero, which is minus 273 degrees Celsius, and its steps are the same size as degrees Celsius.'
    write: '1. Kelvin starts at absolute zero: 0 K = −273 °C'
    doodle_do:
      - {id: sc, op: pulse, part: k-zero, 'on': absolute zero}
  - say: 'To change degrees Celsius to kelvin, add 273, and to change kelvin to degrees Celsius, subtract 273. In the next lesson, we see what an impurity does to these points. Now try the problem.'
    write: '2. °C to K: add 273; K to °C: subtract 273'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Methanol boils at 65 °C at 760 mmHg. What is its boiling point in kelvin?'
    answer: '338 K'
    accept: ['338', '338K', '338 kelvin', '338 k']
    working:
      - 'From Celsius to kelvin, add 273.'
      - '65 + 273 = 338'
      - 'So methanol boils at 338 K.'
    needs_working: false
