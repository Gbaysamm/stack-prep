# Density (lesson 5 of 6): what density is, the cubic centimetre, rho = m/V and its units, finding a density and a mass with guided steps, volume by displacement, and the units trap.
format_version: 1
subject: chemistry
subtopic: 'Boiling, density, freezing and melting points'
subtopic_id: 181e119e-6a41-5215-816d-834d6d563163
part: 5
title: 'Density'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://edupadi.com/classroom/l/classification-of-matter
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is density.'
    write: 'Density'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'So far, we have used melting and boiling points to describe a substance. Density is another property of a substance. It tells us how heavy a substance is for its size.'
    write: 'Density: how heavy a substance is for its size'
  - say: 'For example, a small iron nail sinks in water, but a big piece of wood floats. Iron is heavier than water for its size, so we say it is denser than water. Wood is lighter than water for its size, so it is less dense.'
    write: 'Iron nail sinks: denser than water. Wood floats: less dense'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn what density is and its units, and how to calculate density and mass.'
    write: 'Today: define density, and calculate it with its units'

  # ---------------------------------------------------------------- density
  - section: 'Density'
    say: 'Density is the mass per unit volume of a substance. Mass is how much matter the substance has, and volume is how much space it takes up.'
    write: 'Density: mass per unit volume'
    point:
      - {line: 4, kind: underline, at: 'mass per unit volume'}
  - say: 'Volume is often measured in cubic centimetres. A cubic centimetre, written cm³, is the space taken up by a small cube one centimetre long on each side. It is the same as one millilitre. So the density of a substance is the mass of each cubic centimetre of it.'
    write: 'cm³: a cube 1 cm on each side (= 1 mL)'
  - say: 'To find density, we divide the mass by the volume.'
    write: 'Density = mass ÷ volume'
  - say: 'In symbols, we use the Greek letter rho for density, m for mass and V for volume. So rho equals m over V.'
    write: '$\rho = \dfrac{m}{V}$'

  # ---------------------------------------------------------------- units
  - section: 'Units'
    say: 'The units of density come from this formula. Mass in grams divided by volume in cubic centimetres gives grams per cubic centimetre.'
    write: 'Units: g/cm³ (grams per cubic centimetre)'
  - say: 'Mass in kilograms divided by volume in cubic metres gives kilograms per cubic metre.'
    write: 'or kg/m³ (kilograms per cubic metre)'
  - say: 'For example, water has a density of 1 gram per cubic centimetre, which is the same as 1000 kilograms per cubic metre.'
    write: 'Water: 1 g/cm³ = 1000 kg/m³'

  # ---------------------------------------------------------------- finding density
  - section: 'Worked example'
    say: 'Let us solve this. A metal block has a mass of 54 grams and a volume of 20 cubic centimetres. We must find its density.'
    write: 'Example 1: m = 54 g, V = 20 cm³. Find ρ.'
  - say: 'We want the density, so we use rho equals m over V, and put in the numbers with their units.'
    write: '$\rho = \dfrac{m}{V} = \dfrac{54\ \text{g}}{20\ \text{cm}^3}$'
  - say: '54 divided by 20 is 2.7. Grams divided by cubic centimetres gives grams per cubic centimetre. So the density is 2.7 grams per cubic centimetre.'
    write: '$\rho = 2.7\ \text{g/cm}^3$'
    point:
      - {line: 13, kind: circle, at: '2.7'}
  - say: 'What does this tell us? Each cubic centimetre of the metal has a mass of 2.7 grams. That is more than water''s 1 gram, so the metal is denser than water, and it sinks.'
    write: 'Each cm³ has 2.7 g: denser than water, so it sinks'

  # ---------------------------------------------------------------- finding mass
  - section: 'Finding the mass'
    say: 'We have used the formula to find a density. It can also find a mass when we know the density and the volume. Multiplying both sides by V gives m equals rho times V, so mass equals density times volume.'
    write: '$m = \rho \times V$'
  - say: 'Let us solve this. Kerosene has a density of 0.8 grams per cubic centimetre. We must find the mass of 250 cubic centimetres of it.'
    write: 'Example 2: ρ = 0.8 g/cm³, V = 250 cm³. Find m.'
  - say: 'We want the mass, so we multiply the density by the volume, 0.8 times 250.'
    write: '$m = 0.8\ \text{g/cm}^3 \times 250\ \text{cm}^3$'
  - say: '0.8 is 8 divided by 10. 8 times 250 is 2000, and 2000 divided by 10 is 200. The cubic centimetres cancel and leave grams, so the mass is 200 grams.'
    write: '$m = 200\ \text{g}$'
    point:
      - {line: 18, kind: circle, at: '200'}

  # ---------------------------------------------------------------- displacement
  - section: 'Volume by displacement'
    say: 'To find the density of a stone, we also need its volume, but a stone has no regular shape to measure. So we pour some water into a measuring cylinder, read the level and lower the stone in. The water level rises, because the stone pushes aside its own volume of water. So the rise is the volume of the stone.'
    write: 'Odd-shaped solid: its volume = the rise in the water level'

  # ---------------------------------------------------------------- trap
  - section: 'JAMB trap'
    say: 'Here is a common trap. Density always has a unit, either grams per cubic centimetre or kilograms per cubic metre. Writing only grams, or no unit at all, loses marks.'
    write: 'Trap: density needs its unit, g/cm³ or kg/m³, never just g'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. A stone of mass 75 grams is lowered into a measuring cylinder, and the water rises from 40 to 70 cubic centimetres. Find its density. Pause the lesson and work it out.'
    write: 'm = 75 g; the water rises from 40 cm³ to 70 cm³. Find ρ.'
  - say: 'The volume of the stone is the rise in the water. 70 minus 40 is 30 cubic centimetres.'
    write: '$V = 70\ \text{cm}^3 - 40\ \text{cm}^3 = 30\ \text{cm}^3$'
  - say: 'Density is mass over volume. 75 over 30 is 2.5, so the density is 2.5 grams per cubic centimetre.'
    write: '$\rho = \dfrac{75\ \text{g}}{30\ \text{cm}^3} = 2.5\ \text{g/cm}^3$'

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. Density is mass per unit volume, so rho equals m over V, and mass equals rho times V.'
    write: '1. $\rho = \dfrac{m}{V}$, and $m = \rho \times V$'
  - say: 'Its units are grams per cubic centimetre or kilograms per cubic metre. In the next lesson, we use density and boiling points to separate liquids. Now try the problem.'
    write: '2. Units: g/cm³ or kg/m³'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'A metal block has a mass of 39 g and a volume of 5 cm³. Find its density.'
    answer: '7.8 g/cm³'
    accept: ['7.8', '7.8 g/cm3', '7.8 g cm-3', '7.8g/cm³', '7.8 g per cm³']
    working:
      - '$\rho = \dfrac{m}{V}$'
      - '$\rho = \dfrac{39\ \text{g}}{5\ \text{cm}^3}$'
      - '$39 \div 5 = 7.8$, so $\rho = 7.8\ \text{g/cm}^3$'
    needs_working: false
