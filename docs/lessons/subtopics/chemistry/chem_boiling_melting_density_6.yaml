# Separating liquids by density and boiling point (lesson 6 of 6): miscible and immiscible liquids, the less dense liquid floating, the separating funnel, fractional distillation by the lower boiling point, the two methods side by side, and the top-layer trap.
format_version: 1
subject: chemistry
subtopic: 'Boiling, density, freezing and melting points'
subtopic_id: 181e119e-6a41-5215-816d-834d6d563163
part: 6
title: 'Separating liquids by density and boiling point'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://edupadi.com/classroom/l/classification-of-matter
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is separating liquids by density and boiling point.'
    write: 'Separating liquids by density and boiling point'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lessons, you met the boiling point and density. Both of them are used to separate one liquid from another.'
    write: 'Density and boiling point both separate liquids'
  - say: 'Some liquids mix completely, such as ethanol and water. They are called miscible liquids.'
    write: 'Miscible: they mix completely, e.g. ethanol and water'
  - say: 'Other liquids do not mix, and they form two layers, such as palm oil and water. They are called immiscible liquids.'
    write: 'Immiscible: they do not mix, two layers, e.g. palm oil and water'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn how density separates immiscible liquids, and how the boiling point separates miscible ones.'
    write: 'Today: density for immiscible liquids; b.p. for miscible ones'

  # ---------------------------------------------------------------- floating
  - section: 'Floating'
    say: 'Let us start with density. When two liquids do not mix, the less dense liquid floats on top of the denser one.'
    write: 'Immiscible: the less dense liquid floats on top'
    doodle: {name: 'custom:sub_chem_boiling_melting_density_a', id: bk, size: scene, caption: 'palm oil and water', 'on': floats}
  - say: 'For example, let us pour palm oil and water together. Water has a density of 1 gram per cubic centimetre.'
    write: 'Water: 1.0 g/cm³'
    doodle_do:
      - {id: bk, op: show, part: water, 'on': water}
  - say: 'Palm oil has a density of about 0.9 grams per cubic centimetre. It is less dense than water, so it floats on top, and the water stays at the bottom.'
    write: 'Palm oil: about 0.9 g/cm³, less dense, so on top'
    doodle_do:
      - {id: bk, op: show, part: oil, 'on': palm oil}

  # ---------------------------------------------------------------- separating funnel
  - section: 'Separating funnel'
    say: 'Now that we know which liquid lies at the bottom, we can separate them. Two immiscible liquids are separated with a separating funnel. This is a glass vessel with a tap at the bottom.'
    write: 'Separating funnel: a glass vessel with a tap at the bottom'
    doodle: {name: 'custom:sub_chem_boiling_melting_density_b', id: sf, size: scene, caption: 'a separating funnel', 'on': separating funnel}
    doodle_do:
      - {id: sf, op: show, part: tap, 'on': tap}
  - say: 'Pour in the mixture and let it stand. The liquids settle into two layers, with the denser water at the bottom and the palm oil on top.'
    write: 'The layers settle: denser water below, palm oil on top'
    doodle_do:
      - {id: sf, op: pulse, part: water, 'on': water}
      - {id: sf, op: pulse, part: oil, 'on': palm oil}
  - say: 'Now open the tap. The bottom layer runs out first, so the denser water runs off into a beaker. The tap is closed just as the palm oil reaches it, so the palm oil stays in the funnel.'
    write: 'Open the tap: the denser layer runs off first'
    doodle_do:
      - {id: sf, op: show, part: beaker, 'on': beaker}
    point:
      - {line: 10, kind: underline, at: 'the denser layer runs off first'}

  # worked example: which runs off first?
  - section: 'Worked example'
    say: 'Let us solve this. Kerosene, with a density of 0.8 grams per cubic centimetre, is poured into a separating funnel with water, and the two do not mix. We must find which liquid runs out first.'
    write: 'Example: kerosene (0.8 g/cm³) and water (1.0 g/cm³). Which runs off first?'
  - say: 'To decide, we compare the densities. Water has the higher density, 1.0 against 0.8, so water forms the bottom layer.'
    write: 'Water is denser, so water is the bottom layer'
  - say: 'What does this tell us? The bottom layer runs out first, so the water runs off first, and the kerosene stays in the funnel.'
    write: 'So water runs off first; kerosene stays'
    point:
      - {line: 13, kind: circle, at: 'water runs off first'}

  # ---------------------------------------------------------------- fractional distillation
  - section: 'Fractional distillation'
    say: 'We have separated liquids that do not mix. Now let us look at miscible liquids, which do mix. Ethanol and water mix completely, so they form no layers, and a separating funnel cannot separate them. Instead, we use their boiling points.'
    write: 'Miscible: no layers, so we use boiling points'
  - say: 'When the mixture is heated slowly, the liquid with the lower boiling point reaches its boiling point first, so it turns to vapour first.'
    write: 'Heated slowly: the lower b.p. liquid turns to vapour first'
  - say: 'The vapour passes over into a cooled tube, where it turns back into a liquid and is collected. We say that this liquid distils over. This way of separating liquids by their boiling points is called fractional distillation.'
    write: 'The vapour is cooled and collected: fractional distillation'

  # worked example: which distils first?
  - section: 'Worked example'
    say: 'Let us solve this. Ethanol boils at 78 degrees Celsius and water at 100 degrees Celsius. A mixture of the two is heated slowly. We must find which liquid distils over first.'
    write: 'Example: ethanol (b.p. 78 °C) and water (b.p. 100 °C). Which distils first?'
  - say: 'To decide, we compare the boiling points. 78 degrees Celsius is lower than 100 degrees Celsius, so ethanol reaches its boiling point first.'
    write: '78 °C < 100 °C, so ethanol boils first'
  - say: 'What does this tell us? Ethanol distils over first, and the water stays behind until the temperature reaches 100 degrees Celsius.'
    write: 'So ethanol distils over first'
    point:
      - {line: 19, kind: circle, at: 'ethanol'}

  # ---------------------------------------------------------------- comparison
  - section: 'Comparison'
    say: 'So, to separate two liquids, first ask whether they mix. If they do not mix, use a separating funnel, and the denser liquid runs off first.'
    write: 'Do not mix: separating funnel; the denser runs off first'
    doodle_do:
      - {id: sf, op: pulse, part: water, 'on': denser}
  - say: 'If they mix, use fractional distillation, and the liquid with the lower boiling point distils over first.'
    write: 'Mix: fractional distillation; the lower b.p. distils first'

  # ---------------------------------------------------------------- trap
  - section: 'JAMB trap'
    say: 'Here is a common trap. Some students think the top layer runs out of a separating funnel first. But the tap is at the bottom, so the denser bottom layer always runs out first.'
    write: 'Trap: the bottom (denser) layer runs off first, not the top'
    doodle_do:
      - {id: sf, op: pulse, part: tap, 'on': tap}

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Liquid X boils at 65 degrees Celsius and liquid Y at 118 degrees Celsius, and the two mix completely. How are they separated, and which comes over first? Pause the lesson and decide before I go on.'
    write: 'X (b.p. 65 °C) and Y (b.p. 118 °C) mix. Method? Which first?'
  - say: 'They mix, so a separating funnel will not work, and we use fractional distillation.'
    write: 'They mix, so fractional distillation'
  - say: 'X has the lower boiling point, so X distils over first.'
    write: 'Lower b.p., so X distils over first ✓'
    point:
      - {line: 25, kind: circle, at: 'X distils over first'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. Immiscible liquids are separated with a separating funnel, and the denser layer runs off first.'
    write: '1. Immiscible: separating funnel; the denser layer runs off first'
    doodle_do:
      - {id: sf, op: pulse, part: water, 'on': denser}
  - say: 'Miscible liquids are separated by fractional distillation, and the liquid with the lower boiling point distils over first. Now try the problem.'
    write: '2. Miscible: fractional distillation; the lower b.p. distils first'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Liquid P (density 1.6 g/cm³) and water (density 1.0 g/cm³) do not mix. They are poured into a separating funnel. Which liquid runs out first when the tap is opened?'
    answer: 'P'
    accept: ['liquid P', 'P runs out first', 'P runs first']
    working:
      - 'P and water do not mix, so they settle into two layers.'
      - 'P is denser (1.6 g/cm³ against 1.0 g/cm³), so P is the bottom layer.'
      - 'The tap is at the bottom, so the bottom layer, P, runs out first.'
    needs_working: false
