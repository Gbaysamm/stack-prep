part: 1
title: 'Conservation of mass and constant composition'
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is the law of conservation of mass and the law of constant composition.'
    write: 'Conservation of mass and constant composition'

  # ---------------------------------------------------------------- introduction: the big picture of the topic
  - section: 'Introduction'
    say: 'When elements react to form compounds, they always combine by fixed rules. This topic is about those rules.'
    write: 'This topic: the rules by which elements combine'
  - say: 'The rules are written as six laws. Four of them are about the masses that react, and two are about the volumes of gases.'
    write: 'Six laws: four about masses, two about gas volumes'
  - say: 'After the laws, we learn to write formulae and equations. Then we meet the mole, which is the unit chemists use to count atoms and molecules. JAMB sets calculations on all of these most years.'
    write: 'Then formulae, equations and the mole'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn the first two laws, and use each of them in a calculation.'
    write: 'Today: the first two laws, and how to use them'

  # ---------------------------------------------------------------- conservation of mass
  - section: 'Law of conservation of mass'
    say: 'The first law is the law of conservation of mass. It says that matter is neither created nor destroyed in a chemical reaction.'
    write: 'Conservation of mass: matter is neither created nor destroyed in a reaction'
    point:
      - {line: 5, kind: underline, at: 'neither created nor destroyed'}
  - say: 'The substances we start with are called the reactants, and the substances that form are called the products. So the total mass of the reactants equals the total mass of the products.'
    write: 'Total mass of reactants = total mass of products'
  - say: 'This is because a reaction only rearranges atoms. No atom is lost and no new atom appears, so the total mass cannot change.'
    write: 'Atoms are only rearranged, so the mass does not change'

  # worked example
  - section: 'Worked example'
    say: 'Let us use this law. We are given 5.6 g of iron and 3.2 g of sulphur, which react completely to form iron(II) sulphide. We must find the mass of iron(II) sulphide.'
    write: '5.6 g of iron (Fe) + 3.2 g of sulphur (S) → iron(II) sulphide (FeS). Mass = ?'
  - say: 'Iron and sulphur are the reactants, and iron(II) sulphide is the only product. By the law, the mass of the product equals the total mass of the reactants.'
    write: 'Mass of product = total mass of reactants'
  - say: 'So we add the two masses. 5.6 g plus 3.2 g is 8.8 g of iron(II) sulphide.'
    write: 'Mass of FeS = 5.6 g + 3.2 g = 8.8 g'
    point:
      - {line: 10, kind: circle, at: '8.8 g'}
  - say: 'What does this tell us? The iron and sulphur have changed into a new substance, yet no mass was lost or gained. This law is also the reason we balance equations, which you will learn in a later lesson.'
    write: '∴ no mass lost or gained; this is why we balance equations'

  # ---------------------------------------------------------------- constant composition
  - section: 'Law of constant composition'
    say: 'We have seen that no mass is lost in a reaction. The second law is about what a compound is made of. It is called the law of definite proportions, or the law of constant composition.'
    write: 'Second law: definite proportions (constant composition)'
  - say: 'It says that every pure sample of a compound contains the same elements combined in the same proportion by mass, however the sample was made.'
    write: 'A pure compound always has the same elements in the same proportion by mass'
    point:
      - {line: 13, kind: underline, at: 'same proportion by mass'}
  - say: 'For example, pure water from a well and pure water from rain both have 1 g of hydrogen for every 8 g of oxygen.'
    write: 'E.g. water: hydrogen : oxygen = 1 : 8 by mass, in every sample'

  # worked example
  - section: 'Worked example'
    say: 'Let us use this law. Copper(II) oxide is made in two different ways, giving samples A and B. Each sample is changed back to copper, and the copper is weighed. We must show that the two samples obey the law of constant composition.'
    write: 'Copper(II) oxide made two ways, A and B. Show the law holds'
  - say: 'Sample A, 1.60 g of the oxide, gives 1.28 g of copper.'
    write: 'A: 1.60 g of oxide gives 1.28 g of copper (Cu)'
  - say: 'Sample B, 2.40 g of the oxide, gives 1.92 g of copper.'
    write: 'B: 2.40 g of oxide gives 1.92 g of Cu'
  - say: 'The samples have different masses, so we cannot compare the copper directly. Instead we find the percentage of copper in each. The percentage of copper is the mass of copper divided by the mass of oxide, times 100.'
    write: '% of copper = mass of copper ÷ mass of oxide × 100'
  - say: 'For sample A, 1.28 divided by 1.60, times 100, is 80 percent.'
    write: 'A: 1.28 g ÷ 1.60 g × 100 = 80%'
  - say: 'For sample B, 1.92 divided by 2.40, times 100, is also 80 percent.'
    write: 'B: 1.92 g ÷ 2.40 g × 100 = 80%'
  - say: 'What does this tell us? Both samples are 80 percent copper, which is the same proportion. So the law of constant composition is obeyed.'
    write: '∴ same proportion (80%), so the law is obeyed ✓'
    point:
      - {line: 21, kind: circle, at: 'the law is obeyed'}

  # ---------------------------------------------------------------- trap
  - section: 'JAMB trap'
    say: 'Here is a common trap. When some solids are heated in an open tube, the solid left weighs less than before. Some students say that mass has been destroyed.'
    write: 'Trap: a solid is heated and its mass falls. Mass destroyed? ✗'
  - say: 'It has not. A gas has escaped into the air. If the gas is collected and weighed too, the total mass is the same as at the start. So when a mass seems to change, look for a gas that has escaped or been taken in.'
    write: 'A gas escaped; count every substance, gases too, and the mass is unchanged'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. 2.4 g of magnesium burns completely in 1.6 g of oxygen to form magnesium oxide. What mass of magnesium oxide forms? Pause the lesson and work it out.'
    write: '2.4 g magnesium (Mg) + 1.6 g oxygen → magnesium oxide. Mass = ?'
  - say: 'The mass of the product equals the total mass of the reactants. 2.4 g plus 1.6 g is 4.0 g of magnesium oxide.'
    write: 'Mass = 2.4 g + 1.6 g = 4.0 g'
    point:
      - {line: 25, kind: circle, at: '4.0 g'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. The law of conservation of mass says that the total mass of the reactants equals the total mass of the products.'
    write: '1. Conservation of mass: mass of reactants = mass of products'
  - say: 'The law of constant composition says that a pure compound always has the same elements in the same proportion by mass, however it was made. In the next lesson, we meet two more laws about masses. Now try the problem.'
    write: '2. Constant composition: a pure compound''s proportion by mass is fixed'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'A 10.0 g sample of pure magnesium oxide contains 6.0 g of magnesium. What is the percentage of magnesium in a 25.0 g sample of pure magnesium oxide?'
    answer: '60%'
    accept: ['60', '60 %', '60 percent', '60.0%']
    needs_working: true
    working:
      - '% of magnesium in the first sample = 6.0 g ÷ 10.0 g × 100 = 60%'
      - 'By the law of constant composition, every pure sample has the same proportion by mass.'
      - 'So the 25.0 g sample is also 60% magnesium.'
