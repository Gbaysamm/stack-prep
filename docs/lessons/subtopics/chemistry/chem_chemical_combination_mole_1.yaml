part: 1
title: 'The laws of chemical combination'
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is the laws of chemical combination.'
    write: 'The laws of chemical combination'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'Six laws tell us how elements combine. Four are about masses, and two are about the volumes of gases. JAMB sets questions on them most years, and most of them are calculations.'
    write: 'Six laws: four about masses, two about gas volumes'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'By the end of this lesson you will be able to state the six laws of chemical combination and use them in calculations.'
    write: '1. State and use the six laws of chemical combination'

  # ---------------------------------------------------------------- conservation of mass
  - section: 'Law of conservation of mass'
    say: 'The first law is the law of conservation of mass. Matter is neither created nor destroyed in a reaction, so the reactants and products have the same total mass.'
    write: 'Conservation of mass: total mass of reactants = total mass of products'
  - say: 'Let us solve this. 5.6 grams of iron is heated with 3.2 grams of sulphur, and both react completely. What mass of iron(II) sulphide forms?'
    write: '5.6 g of iron (Fe) + 3.2 g of sulphur (S) react completely; mass of iron(II) sulphide (FeS) = ?'
  - say: 'The mass of the product equals the total mass of the reactants. 5.6 grams plus 3.2 grams is 8.8 grams of iron(II) sulphide.'
    write: 'Mass of FeS = 5.6 g + 3.2 g = 8.8 g'
  - say: 'This law is why we balance equations. A balanced equation has the same atoms on both sides, so the same mass on both sides.'
    write: 'A balanced equation obeys the law of conservation of mass'

  # ---------------------------------------------------------------- definite proportions
  - section: 'Law of definite proportions'
    say: 'The second law is the law of definite proportions, or constant composition. Every pure sample of a compound has the same elements in the same ratio by mass.'
    write: 'Definite proportions: a pure compound has a fixed ratio by mass'
  - say: 'Let us solve this. Copper(II) oxide is made in two ways, giving samples A and B. 1.60 grams of sample A gives 1.28 grams of copper, and 2.40 grams of sample B gives 1.92 grams of copper.'
    write: 'A: 1.60 g oxide → 1.28 g copper (Cu);  B: 2.40 g oxide → 1.92 g Cu'
  - say: 'Now find the percentage of copper in each. For A, 1.28 over 1.60, times 100, is 80 percent. For B, 1.92 over 2.40, times 100, is also 80 percent. The percentage is the same, so the law is obeyed.'
    write: 'A: 1.28 g ÷ 1.60 g × 100 = 80%;  B: 1.92 g ÷ 2.40 g × 100 = 80% ✓'

  # ---------------------------------------------------------------- multiple proportions
  - section: 'Law of multiple proportions'
    say: 'The third law is the law of multiple proportions. If two elements form two compounds, the masses of one element that combine with a fixed mass of the other are in a simple ratio.'
    write: 'Multiple proportions: with a fixed mass of one element, the masses of the other are in a simple ratio'
  - say: 'In carbon(II) oxide, 12 grams of carbon combine with 16 grams of oxygen. In carbon(IV) oxide, 12 grams of carbon combine with 32 grams of oxygen. The masses of oxygen, 16 to 32, are in the ratio 1 to 2.'
    write: 'Carbon(II) oxide (CO): 12 g carbon (C) + 16 g oxygen (O);  carbon(IV) oxide ($\ce{CO2}$): 12 g C + 32 g O ∴ O is 1 : 2'
  - say: 'Let us solve this. 2.50 grams of copper oxide A gives 2.00 grams of copper. 2.25 grams of copper oxide B also gives 2.00 grams of copper.'
    write: 'A: 2.50 g oxide → 2.00 g Cu;  B: 2.25 g oxide → 2.00 g Cu'
  - say: 'The mass of oxygen is the mass of the oxide minus the mass of copper. In A it is 0.50 grams, and in B it is 0.25 grams.'
    write: 'O in A = 2.50 g − 2.00 g = 0.50 g;  O in B = 2.25 g − 2.00 g = 0.25 g'
  - say: 'The copper is fixed at 2.00 grams, so the masses of oxygen are 0.50 to 0.25, which is 2 to 1. That is a simple ratio, so the law is obeyed. A is CuO and B is Cu₂O.'
    write: 'O in A : O in B = 0.50 g : 0.25 g = 2 : 1 ✓ (copper(II) oxide, CuO, and copper(I) oxide, $\ce{Cu2O}$)'

  # ---------------------------------------------------------------- reciprocal proportions
  - section: 'Law of reciprocal proportions'
    say: 'The fourth law is the law of reciprocal proportions. Take two elements, B and C, that each combine with a fixed mass of a third element, A.'
    write: 'Reciprocal proportions: B and C each combine with a fixed mass of A'
  - say: 'The masses of B and C are in the same ratio as when B and C combine with each other, or a simple multiple of it.'
    write: 'The B : C ratio = the ratio when B and C combine, or a simple multiple of it'
  - say: 'Let us solve this. In methane, CH₄, 1 gram of hydrogen combines with 3 grams of carbon. In water, H₂O, 1 gram of hydrogen combines with 8 grams of oxygen. So carbon to oxygen is 3 to 8.'
    write: 'Methane ($\ce{CH4}$): 1 g hydrogen (H) + 3 g C;  water ($\ce{H2O}$): 1 g H + 8 g O ∴ C : O = 3 : 8'
  - say: 'Now carbon and oxygen combine with each other. In CO₂, 12 grams of carbon combine with 32 grams of oxygen. Dividing both by 4 gives 3 to 8, the same ratio, so the law is obeyed.'
    write: '$\ce{CO2}$: C : O = 12 g : 32 g = 3 : 8 ✓'

  # ---------------------------------------------------------------- Gay-Lussac
  - section: 'Gay-Lussac''s law'
    say: 'The fifth law is Gay-Lussac''s law of combining volumes. When gases react, the volumes of the reacting gases and any gaseous products are in a simple whole number ratio.'
    write: 'Gay-Lussac: volumes of reacting gases are in a simple whole number ratio'
  - say: 'The volumes are measured at the same temperature and pressure. The ratio is the same as the numbers in front of the gases in the balanced equation.'
    write: 'Same temperature and pressure; volume ratio = ratio in the equation'
  - say: 'Let us solve this. 50 cubic centimetres of methane burns in oxygen. 1 volume of methane needs 2 volumes of oxygen, so it needs 100 cubic centimetres, and it gives 50 cubic centimetres of carbon(IV) oxide.'
    write: '$\ce{CH4(g) + 2O2(g) -> CO2(g) + 2H2O(l)}$: 50 cm³ + 100 cm³ → 50 cm³ (water is a liquid)'
  - say: 'Another one. 60 cubic centimetres of hydrogen is exploded with 40 cubic centimetres of oxygen. Which gas is left over, and how much? Let me draw a table.'
    write: '$\ce{2H2(g) + O2(g) -> 2H2O(l)}$'
    diagram:
      id: gl
      kind: table
      caption: 'hydrogen and oxygen by volume'
      'on': table
      columns: ['Gas', 'H₂', 'O₂']
      rows:
        - ['ratio', '2', '1']
        - ['given', '60 cm³', '40 cm³']
        - ['used', '', '']
        - ['left', '', '']
  - say: 'The ratio is 2 volumes of hydrogen to 1 volume of oxygen. All 60 cubic centimetres of hydrogen needs half that volume of oxygen, which is 30 cubic centimetres.'
    write: 'Oxygen used = 60 cm³ ÷ 2 = 30 cm³'
    diagram_do:
      - {id: gl, op: highlight, part: 'row:1', 'on': ratio}
      - {id: gl, op: fill, part: 'cell:3,2', text: '60 cm³', 'on': All}
      - {id: gl, op: fill, part: 'cell:3,3', text: '30 cm³', 'on': half}
  - say: 'So the oxygen left over is 40 cubic centimetres minus 30 cubic centimetres, which is 10 cubic centimetres. All the hydrogen is used up.'
    write: '∴ oxygen left = 40 cm³ − 30 cm³ = 10 cm³'
    diagram_do:
      - {id: gl, op: fill, part: 'cell:4,3', text: '10 cm³', answer: true, 'on': left}
      - {id: gl, op: fill, part: 'cell:4,2', text: '0', 'on': used}

  # ---------------------------------------------------------------- Avogadro
  - section: 'Avogadro''s law'
    say: 'The sixth law is Avogadro''s law. Equal volumes of all gases, at the same temperature and pressure, contain the same number of molecules.'
    write: 'Avogadro: equal volumes of gases at the same T and P hold equal numbers of molecules'
  - say: 'So for gases, the volume ratio is the mole ratio. This is why Gay-Lussac''s law works.'
    write: 'For gases: volume ratio = mole ratio'
  - say: 'Let us solve this. 2 cubic decimetres of hydrogen holds n molecules. At the same temperature and pressure, 6 cubic decimetres of carbon(IV) oxide is three times the volume, so it holds 3n molecules.'
    write: '2 dm³ of $\ce{H2}$ has n molecules ∴ 6 dm³ of $\ce{CO2}$ has 3n'
  - say: 'Vapour density is the mass of a gas divided by the mass of the same volume of hydrogen. The relative molecular mass of H₂ is 2, so the relative molecular mass of a gas is 2 times its vapour density.'
    write: 'Relative molecular mass = 2 × vapour density'
  - say: 'Let us solve this. A gas has a vapour density of 32. Its relative molecular mass is 2 times 32, which is 64, the same as sulphur(IV) oxide, SO₂.'
    write: 'M = 2 × 32 = 64, e.g. sulphur(IV) oxide ($\ce{SO2}$) = 32 + 2(16) = 64'

  # ---------------------------------------------------------------- comparison
  - section: 'Comparison'
    say: 'Here are the six laws side by side. The first four are about masses, and the last two are about gas volumes.'
    write: 'Four laws of mass, two laws of gas volumes'
    diagram:
      id: laws
      kind: table
      caption: 'the six laws'
      'on': side
      columns: ['Law', 'Key idea']
      rows:
        - ['conservation', 'mass unchanged']
        - ['definite prop.', 'one fixed ratio']
        - ['multiple prop.', 'ratio like 1 : 2']
        - ['reciprocal prop.', 'A-B-C ratios fit']
        - ['Gay-Lussac', 'volumes in ratio']
        - ['Avogadro', 'same V, same no.']
  - say: 'To tell the mass laws apart, count. One compound means definite proportions. Two compounds of the same two elements means multiple proportions. Three elements means reciprocal proportions.'
    write: 'One compound: definite; two compounds: multiple; three elements: reciprocal'
    diagram_do:
      - {id: laws, op: highlight, part: 'row:2', 'on': One}
      - {id: laws, op: highlight, part: 'row:3', 'on': Two}
      - {id: laws, op: highlight, part: 'row:4', 'on': Three}

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is a real JAMB question. In sample Y, 0.36 grams of chlorine is combined with 0.20 grams of a metal X. In sample Z, 0.71 grams of chlorine is combined with 0.40 grams of X. Which law does this show?'
    write: 'Y: 0.36 g chlorine (Cl) + 0.20 g X;  Z: 0.71 g Cl + 0.40 g X. Which law?'
  - say: 'Find the mass of chlorine per gram of X. In Y it is 0.36 over 0.20, which is 1.8. In Z it is 0.71 over 0.40, which is about 1.8.'
    write: 'Y: 0.36 g ÷ 0.20 g = 1.8;  Z: 0.71 g ÷ 0.40 g = 1.78 ≈ 1.8'
  - say: 'The ratio is the same, so Y and Z are the same compound. This shows the law of constant composition. The trap is multiple proportions, which needs two different ratios.'
    write: 'Same ratio ∴ constant composition, not multiple proportions ✗'
  - say: 'Another one. 50 cubic centimetres of carbon(II) oxide is exploded with 150 cubic centimetres of air that is 20 percent oxygen. So the oxygen is 30 cubic centimetres. From the equation, 2CO needs one O₂.'
    write: '$\ce{2CO + O2 -> 2CO2}$;  oxygen = 20% of 150 cm³ = 30 cm³'
  - say: '50 cubic centimetres of carbon(II) oxide needs only 25 cubic centimetres of oxygen, so oxygen is in excess. Nitrogen is the trap. It is left over, but it does not react.'
    write: 'Needed = 50 cm³ ÷ 2 = 25 cm³ ∴ oxygen in excess (nitrogen does not react ✗)'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Your turn. A gas has a vapour density of 22. What is its relative molecular mass? Pause and work it out before I go on.'
    write: 'Vapour density = 22;  relative molecular mass = ?'
  - say: 'Relative molecular mass is 2 times the vapour density. 2 times 22 is 44, the same as that of CO₂.'
    write: '∴ M = 2 × 22 = 44, e.g. $\ce{CO2}$ = 12 + 2(16) = 44'

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. Mass is conserved in a reaction. A compound has a fixed composition. Two compounds of the same two elements give simple mass ratios, and three elements follow the law of reciprocal proportions.'
    write: '1. Conservation of mass; definite, multiple and reciprocal proportions'
  - say: 'Gases react in simple volume ratios, and equal volumes hold equal numbers of molecules. Relative molecular mass is 2 times the vapour density. That''s the lesson. In the next lesson we look at formulae and equations.'
    write: '2. Gay-Lussac and Avogadro; M = 2 × vapour density'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: '20 cm³ of hydrogen burns in excess chlorine: $\ce{H2(g) + Cl2(g) -> 2HCl(g)}$. What volume of hydrogen chloride forms, measured at the same temperature and pressure?'
    answer: '40 cm³'
    accept: ['40', '40 cm3', '40cm3', '40 cm^3', '40cm³']
    needs_working: false
    working:
      - 'By Gay-Lussac''s law, the volume ratio is the ratio in the equation: 1 volume of $\ce{H2}$ gives 2 volumes of HCl.'
      - 'volume of HCl = 2 × 20 cm³ = 40 cm³'
