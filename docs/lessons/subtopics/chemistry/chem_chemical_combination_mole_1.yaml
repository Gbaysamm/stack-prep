# Conservation of mass and constant composition (lesson 1 of 10): the big picture of the topic, then the first two laws of chemical combination, each stated, explained and used in a guided worked example.
format_version: 1
subject: chemistry
subtopic: 'Laws of chemical combination, formulae, equations and the mole'
subtopic_id: bf0c2ac8-4a5f-54e0-99a2-37ff23fb0988
sources:            # the source map's pages for this topic (docs/lessons/sources.md), for reviewers
  - https://ibass.jamb.gov.ng
