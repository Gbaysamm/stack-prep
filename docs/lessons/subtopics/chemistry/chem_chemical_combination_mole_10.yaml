part: 10
title: 'Reacting masses and volumes'
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is reacting masses and volumes.'
    write: 'Reacting masses and volumes'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lessons, you changed masses, gas volumes and solutions into moles on the mole map. Now we put it all together with balanced equations, to find how much of a substance reacts and how much forms.'
    write: 'How much reacts, and how much forms'
    doodle: {name: 'custom:sub_chem_chemical_combination_mole_a4', id: mm, size: scene, caption: 'the mole map', 'on': map}

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn to find reacting masses and gas volumes from a balanced equation.'
    write: 'Today: masses and gas volumes from a balanced equation'

  # ---------------------------------------------------------------- the method
  - section: 'The mole ratio'
    say: 'A balanced equation gives the ratio of the moles that react. For example, when magnesium burns, 2Mg plus O₂ gives 2MgO. So 2 moles of magnesium react with 1 mole of oxygen to give 2 moles of magnesium oxide.'
    write: 'Magnesium (Mg): $\ce{2Mg + O2 -> 2MgO}$, mole ratio 2 : 1 : 2'
    point:
      - {line: 3, kind: underline, at: 'mole ratio 2 : 1 : 2'}
  - say: 'So we follow four steps. Write the balanced equation. Change what is given into moles. Use the mole ratio. Then change the answer into the mass or volume asked for.'
    write: 'Equation → moles → mole ratio → mass or volume'

  # worked example 1
  - section: 'Worked example'
    say: 'Let us solve this. 25 g of calcium trioxocarbonate(IV), CaCO₃, is heated strongly. We must find the mass of calcium oxide that forms, and the volume of carbon(IV) oxide at s.t.p.'
    write: '25 g of calcium trioxocarbonate(IV) ($\ce{CaCO3}$) heated. Mass of calcium oxide (CaO)? Volume of $\ce{CO2}$ at s.t.p.?'
  - say: 'Step one, the balanced equation. CaCO₃ breaks down into CaO and CO₂, one of each.'
    write: '$\ce{CaCO3(s) -> CaO(s) + CO2(g)}$ [Ca = 40, C = 12, O = 16]'
  - say: 'Step two, the moles. M of CaCO₃ is 100 grams per mole, so 25 g is 0.25 mole.'
    write: 'n($\ce{CaCO3}$) = 25 g ÷ 100 g mol⁻¹ = 0.25 mol'
    doodle_do:
      - {id: mm, op: pulse, part: to-moles, 'on': moles}
  - say: 'Step three, the mole ratio. It is 1 to 1 to 1, so 0.25 mole of CaO and 0.25 mole of CO₂ form.'
    write: 'Ratio 1 : 1 : 1, so 0.25 mol of CaO and 0.25 mol of $\ce{CO2}$'
  - say: 'Step four, the answers. M of CaO is 56 grams per mole, so the mass of calcium oxide is 0.25 times 56, which is 14 g.'
    write: 'Mass of CaO = 0.25 mol × 56 g mol⁻¹ = 14 g'
    doodle_do:
      - {id: mm, op: circle, part: to-mass, 'on': times}
  - say: 'The volume of CO₂ at s.t.p. is 0.25 mole times 22.4 cubic decimetres per mole, which is 5.6 cubic decimetres.'
    write: 'V($\ce{CO2}$) = 0.25 mol × 22.4 dm³ mol⁻¹ = 5.6 dm³'
    doodle_do:
      - {id: mm, op: circle, part: to-gas, 'on': times}

  # worked example 2
  - say: 'Another one, where the ratio is not 1 to 1. What mass of aluminium oxide forms when 5.4 g of aluminium burns in oxygen?'
    write: '5.4 g of aluminium (Al) burns. Mass of aluminium oxide? Al = 27, O = 16'
  - say: 'Step one. You balanced this equation in an earlier lesson. 4Al plus 3O₂ gives 2Al₂O₃.'
    write: '$\ce{4Al + 3O2 -> 2Al2O3}$'
  - say: 'Step two. The moles of aluminium are 5.4 divided by 27, which is 0.2 mole.'
    write: 'n(Al) = 5.4 g ÷ 27 g mol⁻¹ = 0.2 mol'
  - say: 'Step three. The ratio of Al to Al₂O₃ is 4 to 2, so there is half as much oxide. Half of 0.2 is 0.1 mole.'
    write: 'n($\ce{Al2O3}$) = 0.2 mol × 2/4 = 0.1 mol'
    point:
      - {line: 14, kind: underline, at: '2/4'}
  - say: 'Step four. M of Al₂O₃ is 54 plus 48, which is 102 grams per mole. So the mass is 0.1 times 102, which is 10.2 g.'
    write: 'Mass = 0.1 mol × 102 g mol⁻¹ = 10.2 g'

  # ---------------------------------------------------------------- equation from masses
  - section: 'Equation from masses'
    say: 'Masses can also tell us the equation. 2.4 g of magnesium displaces 6.4 g of copper from copper(II) tetraoxosulphate(VI) solution. We must find the mole ratio.'
    write: '2.4 g of Mg displaces 6.4 g of copper (Cu). Mg = 24, Cu = 64'
  - say: 'Magnesium is 2.4 divided by 24, which is 0.1 mole. Copper is 6.4 divided by 64, also 0.1 mole.'
    write: 'Mg: 0.1 mol; Cu: 0.1 mol'
  - say: 'The ratio is 1 to 1, so one magnesium atom gives one copper atom.'
    write: '1 : 1 ∴ $\ce{Mg + CuSO4 -> MgSO4 + Cu}$'

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Examiners often see these slips. Students leave the equation unbalanced, or skip the mole ratio and use the masses directly. Always balance first, and always go through moles.'
    write: 'Balance first; always go through moles'
  - say: 'Students also drop units and round too early. Keep the units, and round only at the end. Molar mass is in grams per mole, not grams.'
    write: 'Keep units; round only at the end; M in g mol⁻¹'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. 1.2 g of magnesium reacts with excess hydrochloric acid. What volume of hydrogen forms at s.t.p.? Pause the lesson and work it out.'
    write: '$\ce{Mg + 2HCl -> MgCl2 + H2}$: 1.2 g of Mg gives ? dm³ of $\ce{H2}$ at s.t.p.'
  - say: 'The moles of magnesium are 1.2 g divided by 24 grams per mole, which is 0.05 mole. One Mg gives one H₂, so the hydrogen is 0.05 mole too.'
    write: 'n = 1.2 g ÷ 24 g mol⁻¹ = 0.05 mol of Mg, so 0.05 mol of $\ce{H2}$'
    doodle_do:
      - {id: mm, op: pulse, part: to-moles, 'on': moles}
  - say: 'The volume is 0.05 mole times 22.4 cubic decimetres per mole, which is 1.12 cubic decimetres.'
    write: '∴ V = 0.05 mol × 22.4 dm³ mol⁻¹ = 1.12 dm³'
    doodle_do:
      - {id: mm, op: circle, part: to-gas, 'on': times}
    point:
      - {line: 23, kind: circle, at: '1.12 dm³'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. A balanced equation gives the mole ratio of the substances that react and form.'
    write: '1. The numbers in front give the mole ratio'
  - say: 'To find a reacting mass or volume, write the equation, find the moles, use the mole ratio, then change to the mass or volume. Now try the problem. After it come new questions on the whole topic.'
    write: '2. Equation → moles → mole ratio → mass or volume'
    doodle_do:
      - {id: mm, op: pulse, part: moles, 'on': moles}

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'What mass of magnesium oxide forms when 4.8 g of magnesium burns completely in oxygen? $\ce{2Mg + O2 -> 2MgO}$  [Mg = 24, O = 16]'
    answer: '8.0 g'
    accept: ['8 g', '8.0', '8', '8g', '8.0g']
    needs_working: true
    working:
      - 'n(Mg) = 4.8 g ÷ 24 g mol⁻¹ = 0.2 mol'
      - 'From the equation, 2 mol Mg give 2 mol MgO, a ratio of 1 : 1, so n(MgO) = 0.2 mol.'
      - 'M(MgO) = 24 + 16 = 40 g mol⁻¹'
      - 'Mass of MgO = 0.2 mol × 40 g mol⁻¹ = 8.0 g'
