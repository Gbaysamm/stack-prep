part: 2
title: 'Multiple and reciprocal proportions'
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is the law of multiple proportions and the law of reciprocal proportions.'
    write: 'Multiple and reciprocal proportions'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson, you met the law of conservation of mass and the law of constant composition. Those laws were about one compound. The next two laws are about elements that form more than one compound.'
    write: 'Laws for elements that form more than one compound'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn to state these two laws, and to show from masses that each is obeyed.'
    write: 'Today: state the two laws, and test them with masses'

  # ---------------------------------------------------------------- multiple proportions
  - section: 'Law of multiple proportions'
    say: 'The third law is the law of multiple proportions. It is about two elements that combine to form more than one compound.'
    write: 'Third law: multiple proportions'
  - say: 'It says that if two elements form more than one compound, the masses of one element that combine with a fixed mass of the other are in a simple whole number ratio.'
    write: 'Two elements, two or more compounds: with a fixed mass of one, the masses of the other are in a simple ratio'
    point:
      - {line: 4, kind: underline, at: 'simple ratio'}
  - say: 'For example, carbon and oxygen form two compounds. In carbon(II) oxide, CO, 12 g of carbon combines with 16 g of oxygen.'
    write: 'Carbon(II) oxide (CO): 12 g carbon (C) + 16 g oxygen (O)'
  - say: 'In carbon(IV) oxide, CO₂, the same 12 g of carbon combines with 32 g of oxygen.'
    write: 'Carbon(IV) oxide ($\ce{CO2}$): 12 g C + 32 g O'
  - say: 'The carbon is fixed at 12 g, so we compare the masses of oxygen. 16 g to 32 g is 1 to 2, which is a simple ratio.'
    write: 'Carbon fixed at 12 g, so O is 16 g : 32 g = 1 : 2'

  # worked example
  - section: 'Worked example'
    say: 'Now let us test the law with numbers. Two oxides of copper, A and B, are each changed back to copper. We must show that they obey the law of multiple proportions.'
    write: 'Two copper oxides, A and B. Show the law of multiple proportions'
  - say: 'We are given that 2.50 g of oxide A gives 2.00 g of copper.'
    write: 'A: 2.50 g of oxide gives 2.00 g of copper (Cu)'
  - say: 'And 2.25 g of oxide B also gives 2.00 g of copper.'
    write: 'B: 2.25 g of oxide gives 2.00 g of Cu'
  - say: 'The copper is already fixed at 2.00 g in both, so we need the mass of oxygen in each. The oxygen is the mass of the oxide minus the mass of copper.'
    write: 'Oxygen = mass of oxide − mass of copper'
  - say: 'In A, 2.50 g minus 2.00 g is 0.50 g of oxygen.'
    write: 'O in A = 2.50 g − 2.00 g = 0.50 g'
  - say: 'In B, 2.25 g minus 2.00 g is 0.25 g of oxygen.'
    write: 'O in B = 2.25 g − 2.00 g = 0.25 g'
  - say: 'Now we compare the two masses of oxygen. 0.50 g to 0.25 g, with both divided by 0.25, is 2 to 1.'
    write: 'O in A : O in B = 0.50 g : 0.25 g = 2 : 1'
  - say: 'What does this tell us? 2 to 1 is a simple whole number ratio, so the law is obeyed. In fact, A is copper(II) oxide, CuO, and B is copper(I) oxide, Cu₂O.'
    write: '∴ simple ratio 2 : 1 ✓ (copper(II) oxide, CuO, and copper(I) oxide, $\ce{Cu2O}$)'
    point:
      - {line: 15, kind: circle, at: '2 : 1'}

  # ---------------------------------------------------------------- reciprocal proportions
  - section: 'Law of reciprocal proportions'
    say: 'The fourth law is the law of reciprocal proportions. This one is about three elements.'
    write: 'Fourth law: reciprocal proportions'
  - say: 'Take two elements, B and C, that each combine with a fixed mass of a third element, A.'
    write: 'B and C each combine with a fixed mass of A'
  - say: 'The law says that the masses of B and C are in the same ratio as when B and C combine with each other, or a simple multiple of that ratio.'
    write: 'Then B : C = their ratio when they combine with each other, or a simple multiple'

  # worked example
  - section: 'Worked example'
    say: 'Let us test it with hydrogen, carbon and oxygen. Hydrogen will be the fixed element, at 1 g.'
    write: 'Hydrogen fixed at 1 g; carbon and oxygen'
  - say: 'In methane, CH₄, 1 g of hydrogen combines with 3 g of carbon.'
    write: 'Methane ($\ce{CH4}$): 1 g hydrogen (H) + 3 g C'
  - say: 'In water, H₂O, 1 g of hydrogen combines with 8 g of oxygen.'
    write: 'Water ($\ce{H2O}$): 1 g H + 8 g O'
  - say: 'So with the same 1 g of hydrogen, the ratio of carbon to oxygen is 3 to 8.'
    write: 'With 1 g of H, C : O = 3 : 8'
  - say: 'Now carbon and oxygen combine with each other. In CO₂, 12 g of carbon combines with 32 g of oxygen, and dividing both by 4 gives 3 to 8.'
    write: '$\ce{CO2}$: C : O = 12 g : 32 g = 3 : 8'
  - say: 'What does this tell us? The two ratios are the same, so the law of reciprocal proportions is obeyed.'
    write: '∴ same ratio, 3 : 8 ✓'

  # ---------------------------------------------------------------- JAMB question
  - section: 'JAMB trap'
    say: 'Here is a real JAMB question. In sample Y, 0.36 g of chlorine is combined with 0.20 g of a metal X. In sample Z, 0.71 g of chlorine is combined with 0.40 g of X. Which law does this show?'
    write: 'Y: 0.36 g chlorine (Cl) + 0.20 g X. Z: 0.71 g Cl + 0.40 g X. Which law?'
  - say: 'To decide, we find the mass of chlorine for each gram of X. In Y, 0.36 divided by 0.20 is 1.8.'
    write: 'Y: 0.36 g ÷ 0.20 g = 1.8 g of Cl per g of X'
  - say: 'In Z, 0.71 divided by 0.40 is 1.78, which is about 1.8.'
    write: 'Z: 0.71 g ÷ 0.40 g = 1.78 ≈ 1.8'
  - say: 'The ratio is the same, so Y and Z are the same compound, and this shows the law of constant composition. The trap is multiple proportions, which needs two different compounds with two different ratios.'
    write: '∴ same ratio, so constant composition, not multiple proportions ✗'
    point:
      - {line: 28, kind: circle, at: 'constant composition'}
  - say: 'So to tell the mass laws apart, count. One compound means constant composition. Two compounds of the same two elements means multiple proportions. Three elements means reciprocal proportions.'
    write: 'One compound: constant; two compounds: multiple; three elements: reciprocal'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. In two oxides of nitrogen, 14 g of nitrogen combines with 16 g of oxygen in one, and with 32 g of oxygen in the other. Which law do they show? Pause the lesson and decide.'
    write: 'Nitrogen (N): 14 g N + 16 g O, and 14 g N + 32 g O. Which law?'
  - say: 'Nitrogen is fixed at 14 g in two different compounds, and the masses of oxygen, 16 g to 32 g, are 1 to 2. So this is the law of multiple proportions.'
    write: 'Two compounds, O = 1 : 2, so multiple proportions ✓'

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. In multiple proportions, two elements form two or more compounds, and with one element fixed, the masses of the other are in a simple ratio.'
    write: '1. Multiple: two compounds; with one element fixed, a simple ratio'
  - say: 'In reciprocal proportions, three elements give ratios that agree. In the next lesson, we learn to read formulae and balance equations. Now try the problem.'
    write: '2. Reciprocal: three elements; the ratios agree'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Sulphur forms two oxides. In oxide A, 32 g of sulphur combines with 32 g of oxygen. In oxide B, 32 g of sulphur combines with 48 g of oxygen. Find the ratio of the masses of oxygen that combine with the fixed mass of sulphur.'
    answer: '2 : 3'
    accept: ['2:3', '2 to 3', '2 : 3', '32:48']
    needs_working: false
    working:
      - 'Sulphur is fixed at 32 g in both oxides.'
      - 'Oxygen in A : oxygen in B = 32 g : 48 g'
      - 'Divide both by 16: 2 : 3, a simple whole number ratio, as the law of multiple proportions says.'
