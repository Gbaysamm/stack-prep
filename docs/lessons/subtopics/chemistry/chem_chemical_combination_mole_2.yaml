# Multiple and reciprocal proportions (lesson 2 of 10): the third and fourth laws of chemical combination, each stated, shown with numbers and tested in a guided worked example, then the JAMB question that tells the mass laws apart.
format_version: 1
subject: chemistry
subtopic: 'Laws of chemical combination, formulae, equations and the mole'
subtopic_id: bf0c2ac8-4a5f-54e0-99a2-37ff23fb0988
sources:            # the source map's pages for this topic (docs/lessons/sources.md), for reviewers
  - https://ibass.jamb.gov.ng
