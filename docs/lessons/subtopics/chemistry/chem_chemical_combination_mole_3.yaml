# Formulae and equations (lesson 3 of 10): counting atoms in a formula, brackets included, then what a balanced equation is and how to balance one, with two guided examples and state symbols.
format_version: 1
subject: chemistry
subtopic: 'Laws of chemical combination, formulae, equations and the mole'
subtopic_id: bf0c2ac8-4a5f-54e0-99a2-37ff23fb0988
sources:            # the source map's pages for this topic (docs/lessons/sources.md), for reviewers
  - https://ibass.jamb.gov.ng
  - https://syllabus.ng/jamb/chemistry
  - https://syllabus.ng/waec/chemistry/
  - https://syllabus.ng/neco/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://elearn.education.gov.ng
part: 3
title: 'Formulae and equations'
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is chemical formulae and equations.'
    write: 'Formulae and equations'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last two lessons, you met the four laws about masses. Now we learn to read a formula and to write a balanced equation. The law of conservation of mass is the reason equations must balance.'
    write: 'Reading a formula; writing a balanced equation'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn to count the atoms in a formula, and to balance a chemical equation.'
    write: 'Today: count the atoms in a formula, and balance an equation'

  # ---------------------------------------------------------------- reading a formula
  - section: 'Reading a formula'
    say: 'A formula shows the elements in a substance and the number of atoms of each. As you know, the small number after a symbol counts the atoms of that element only.'
    write: 'A formula: which elements, and how many atoms of each'
  - say: 'Some formulae have a group of atoms in brackets. The number after the bracket multiplies everything inside it.'
    write: 'A number after a bracket multiplies everything inside'
    point:
      - {line: 4, kind: underline, at: 'multiplies everything inside'}

  # worked example
  - section: 'Worked example'
    say: 'Let us count the atoms in aluminium tetraoxosulphate(VI), Al₂(SO₄)₃. We must find how many atoms of each element it has.'
    write: 'Aluminium tetraoxosulphate(VI) ($\ce{Al2(SO4)3}$): count the atoms'
  - say: 'The small 2 after Al gives 2 aluminium atoms.'
    write: 'Aluminium (Al): 2'
  - say: 'The 3 after the bracket multiplies the SO₄. There is one sulphur atom inside, so 1 times 3 gives 3 sulphur atoms.'
    write: 'Sulphur (S): 1 × 3 = 3'
  - say: 'There are 4 oxygen atoms inside, so 4 times 3 gives 12 oxygen atoms.'
    write: 'Oxygen (O): 4 × 3 = 12'

  # ---------------------------------------------------------------- equations
  - section: 'Chemical equations'
    say: 'Now equations. A chemical equation shows a reaction with formulae. The reactants are written on the left, the products on the right, and an arrow goes between them.'
    write: 'Equation: reactants → products'
  - say: 'By the law of conservation of mass, no atom is lost or made in a reaction. So an equation is balanced when each kind of atom has the same number on both sides.'
    write: 'Balanced: the same number of each kind of atom on both sides'
  - say: 'To balance an equation, first write every formula correctly. Then put numbers in front of the formulae. Never change the small numbers inside a formula, because that makes a different substance.'
    write: 'Balance with numbers in front; never change the small numbers'
    point:
      - {line: 11, kind: underline, at: 'never change the small numbers'}
  - say: 'For example, a 2 in front of water, 2H₂O, means two molecules of water. But changing H₂O to H₂O₂ makes hydrogen peroxide, which is a different substance.'
    write: '$\ce{2H2O}$: two water molecules. Hydrogen peroxide ($\ce{H2O2}$) is another substance'

  # worked example 1
  - section: 'Worked example'
    say: 'Let us balance one. Aluminium burns in oxygen to form aluminium oxide. We write the formulae first.'
    write: 'Aluminium + oxygen → aluminium oxide: $\ce{Al + O2 -> Al2O3}$'
  - say: 'Start with oxygen. There are 2 oxygen atoms on the left and 3 on the right. The lowest common multiple of 2 and 3 is 6, so we need 6 oxygen atoms on each side.'
    write: 'O: 2 on the left, 3 on the right; lowest common multiple = 6'
  - say: 'So we put 3 in front of O₂, which gives 6, and 2 in front of Al₂O₃, which also gives 6.'
    write: '$\ce{Al + 3O2 -> 2Al2O3}$ (O: 6 = 6)'
  - say: 'Now there are 2 times 2, which is 4 aluminium atoms on the right. So we put 4 in front of Al.'
    write: '$\ce{4Al + 3O2 -> 2Al2O3}$'
  - say: 'Finally, we check. Aluminium is 4 on each side, and oxygen is 6 on each side, so the equation is balanced.'
    write: 'Check: Al 4 = 4, O 6 = 6 ✓'
    point:
      - {line: 17, kind: circle, at: '✓'}

  # worked example 2
  - say: 'Another one. Propane, C₃H₈, burns in oxygen to give carbon(IV) oxide and water. For a fuel like this, we balance carbon first, then hydrogen, and oxygen last.'
    write: 'Propane ($\ce{C3H8}$) + oxygen → carbon(IV) oxide + water. Balance C, then H, then O'
  - say: 'There are 3 carbon atoms on the left, so we need 3CO₂ on the right.'
    write: '$\ce{C3H8 + O2 -> 3CO2 + H2O}$'
  - say: 'There are 8 hydrogen atoms, and each water molecule has 2, so we need 4H₂O.'
    write: '$\ce{C3H8 + O2 -> 3CO2 + 4H2O}$'
  - say: 'Now count the oxygen on the right. 3CO₂ has 6 oxygen atoms and 4H₂O has 4, which makes 10. So we need 5O₂ on the left.'
    write: '$\ce{C3H8 + 5O2 -> 3CO2 + 4H2O}$ (O: 10 = 10) ✓'

  # ---------------------------------------------------------------- state symbols
  - section: 'State symbols'
    say: 'When you are asked, add state symbols. The letter s means solid, l means liquid, g means gas, and aq means dissolved in water.'
    write: 'State symbols: (s) solid, (l) liquid, (g) gas, (aq) dissolved in water'

  # ---------------------------------------------------------------- trap
  - section: 'JAMB trap'
    say: 'Here is a common trap. To balance hydrogen and oxygen forming water, some students change H₂O to H₂O₂. That changes the substance. The right way is 2H₂ plus O₂ gives 2H₂O.'
    write: 'Trap: $\ce{H2 + O2 -> H2O2}$ ✗. Right: $\ce{2H2 + O2 -> 2H2O}$ ✓'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Balance the equation for making ammonia from nitrogen and hydrogen. Pause the lesson and work it out.'
    write: 'Balance nitrogen + hydrogen → ammonia: $\ce{N2 + H2 -> NH3}$'
  - say: 'There are 2 nitrogen atoms on the left, so we put 2 in front of NH₃. That gives 6 hydrogen atoms on the right, so we put 3 in front of H₂.'
    write: '$\ce{N2 + 3H2 -> 2NH3}$ check: N 2 = 2, H 6 = 6 ✓'

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. In a formula, the small number counts the atoms of one element, and a number after a bracket multiplies everything inside.'
    write: '1. Small numbers count atoms; a number after a bracket multiplies all inside'
  - say: 'An equation is balanced with numbers in front, until each kind of atom is the same on both sides. In the next lesson, we use equations with the laws about gas volumes. Now try the problem.'
    write: '2. Balance with numbers in front; check each kind of atom'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Balance this equation for magnesium burning in oxygen: $\ce{Mg + O2 -> MgO}$'
    answer: '2Mg + O₂ → 2MgO'
    accept: ['2Mg + O2 -> 2MgO', '2Mg + O2 → 2MgO', '2Mg+O2->2MgO', '2, 1, 2', '2 1 2']
    needs_working: false
    working:
      - 'O: 2 on the left, 1 on the right, so put 2 in front of MgO.'
      - 'Now there are 2 Mg atoms on the right, so put 2 in front of Mg.'
      - '$\ce{2Mg + O2 -> 2MgO}$. Check: Mg 2 = 2, O 2 = 2 ✓'
