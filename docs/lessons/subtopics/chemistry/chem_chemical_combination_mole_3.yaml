# Lesson 3 of 4 on chemical combination and the mole: the mole, the Avogadro constant, molar mass, and changing between mass, particles and gas volume, on the growing mole map.
format_version: 1
subject: chemistry
subtopic: 'Laws of chemical combination, formulae, equations and the mole'
subtopic_id: bf0c2ac8-4a5f-54e0-99a2-37ff23fb0988
sources:            # the source map's pages for this topic (docs/lessons/sources.md), for reviewers
  - https://ibass.jamb.gov.ng
  - https://syllabus.ng/jamb/chemistry
  - https://syllabus.ng/waec/chemistry/
  - https://syllabus.ng/neco/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
