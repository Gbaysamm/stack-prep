part: 3
title: 'The mole: mass, particles and gas volume'
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. This is lesson three of four on chemical combination and the mole: the mole, with mass, particles and gas volume.'
    write: 'The mole: mass, particles and gas volume'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson you worked out formulae. This lesson counts particles in moles, and links moles to mass, number of particles and gas volume. JAMB asks on the mole every year.'
    write: 'The mole links mass, particles and gas volume'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'By the end of this lesson you will be able to do two things. One, define the mole, the Avogadro constant and molar mass.'
    write: '1. Define the mole, the Avogadro constant and molar mass'
  - say: 'Two, change between mass, moles, number of particles and gas volume at s.t.p.'
    write: '2. Mass, moles, particles and gas volume at s.t.p.'

  # ---------------------------------------------------------------- the mole
  - section: 'The mole'
    say: 'Atoms are too small to count, so we count them in moles. A mole is as many particles as there are atoms in exactly 12 grams of carbon-12.'
    write: 'Mole: as many particles as there are atoms in 12 g of carbon-12'
  - say: 'That number is 6.02 × 10²³. It is called the Avogadro constant, L, or the Avogadro number.'
    write: 'L = 6.02 × 10²³ mol⁻¹, the Avogadro constant'
  - say: 'The particles can be atoms, molecules or ions, so always say which. One mole of O₂ molecules holds two moles of oxygen atoms.'
    write: '1 mol of $\ce{O2}$ molecules = 2 mol of O atoms'
  - say: 'The molar mass, M, is the mass of one mole. It is the relative atomic or molecular mass in grams, and its unit is grams per mole.'
    write: 'Molar mass M: the mass of 1 mol, in g mol⁻¹'
  - say: 'Let us solve this. Tetraoxosulphate(VI) acid, H₂SO₄, is 2 plus 32 plus 64, which is 98 grams per mole. CaCO₃ is 40 plus 12 plus 48, which is 100.'
    write: '$\ce{H2SO4}$ = 2(1) + 32 + 4(16) = 98 g mol⁻¹;  $\ce{CaCO3}$ = 40 + 12 + 3(16) = 100 g mol⁻¹'

  # ---------------------------------------------------------------- mass and moles
  - section: 'Mass and moles'
    say: 'To change a mass into moles, divide by the molar mass. Look at the mole map. Mass goes to moles by dividing by M, and back by multiplying by M.'
    write: 'Number of moles, n = mass ÷ molar mass'
    doodle: {name: 'custom:sub_chem_chemical_combination_mole_a', id: mm, size: scene, caption: 'the mole map', 'on': map}
    doodle_do:
      - {id: mm, op: circle, part: to-moles, 'on': dividing}
      - {id: mm, op: circle, part: to-mass, 'on': multiplying}
  - say: 'Let us solve this. How many moles are in 4.9 grams of H₂SO₄? 4.9 grams divided by 98 grams per mole is 0.05 mole.'
    write: 'n = 4.9 g ÷ 98 g mol⁻¹ = 0.05 mol'
    doodle_do:
      - {id: mm, op: pulse, part: to-moles, 'on': divided}

  # ---------------------------------------------------------------- particles
  - section: 'Number of particles'
    say: 'To find the number of particles, multiply the moles by the Avogadro constant. The mole map grows a box for particles.'
    write: 'Number of particles = n × L'
    doodle_do:
      - {id: mm, op: stage, stage: 'custom:sub_chem_chemical_combination_mole_a2', 'on': box}
      - {id: mm, op: circle, part: to-particles, 'on': multiply}
  - say: 'Let us solve this. How many molecules are in 8.8 grams of CO₂? CO₂ is 44 grams per mole, so it is 0.2 mole.'
    write: 'n = 8.8 g ÷ 44 g mol⁻¹ = 0.2 mol'
    doodle_do:
      - {id: mm, op: pulse, part: to-moles, 'on': mole}
  - say: 'Then multiply by L. 0.2 times 6.02 × 10²³ is 1.204 × 10²³ molecules.'
    write: 'Molecules = 0.2 mol × 6.02 × 10²³ mol⁻¹ = 1.204 × 10²³'
    doodle_do:
      - {id: mm, op: pulse, part: to-particles, 'on': multiply}
  - say: 'Each CO₂ molecule has 3 atoms, so there are 3.612 × 10²³ atoms. Always read whether the question asks for atoms or molecules.'
    write: 'Atoms = 3 × 1.204 × 10²³ = 3.612 × 10²³'

  # ---------------------------------------------------------------- molar volume
  - section: 'Molar volume of a gas'
    say: 'One mole of any gas takes up 22.4 cubic decimetres at s.t.p., standard temperature and pressure: 0 degrees Celsius and 760 millimetres of mercury.'
    write: 'Molar volume = 22.4 dm³ mol⁻¹ at s.t.p. (273 K, 760 mmHg)'
    doodle_do:
      - {id: mm, op: stage, stage: 'custom:sub_chem_chemical_combination_mole_a3', 'on': gas}
  - say: 'This follows from Avogadro''s law. On the mole map, moles times 22.4 gives the volume, and the volume divided by 22.4 gives the moles.'
    write: 'Volume at s.t.p. = n × 22.4 dm³ mol⁻¹'
    doodle_do:
      - {id: mm, op: circle, part: to-gas, 'on': times}
      - {id: mm, op: circle, part: from-gas, 'on': divided}
  - say: 'Let us solve this. Find the volume of 3.2 grams of O₂ at s.t.p. That is 0.1 mole, and 0.1 times 22.4 is 2.24 cubic decimetres.'
    write: 'n = 3.2 g ÷ 32 g mol⁻¹ = 0.1 mol;  V = 0.1 mol × 22.4 dm³ mol⁻¹ = 2.24 dm³'
    doodle_do:
      - {id: mm, op: pulse, part: to-gas, 'on': times}
  - say: 'Another one. 560 cubic centimetres of a gas at s.t.p. has a mass of 1.1 grams. Find its molar mass. First change to cubic decimetres by dividing by 1000.'
    write: '560 cm³ = 560 ÷ 1000 = 0.560 dm³'
  - say: 'The moles are 0.560 divided by 22.4, which is 0.025 mole. The molar mass is 1.1 grams divided by 0.025 mole, which is 44 grams per mole.'
    write: 'n = 0.560 dm³ ÷ 22.4 dm³ mol⁻¹ = 0.025 mol;  M = 1.1 g ÷ 0.025 mol = 44 g mol⁻¹'
    doodle_do:
      - {id: mm, op: pulse, part: from-gas, 'on': divided}

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'A JAMB trap. The atoms in 24 grams of magnesium equal the molecules in which: 16 grams or 32 grams of oxygen? 24 grams of magnesium is 1 mole.'
    write: 'Atoms in 24 g Mg: 24 g ÷ 24 g mol⁻¹ = 1 mol'
  - say: 'Oxygen gas is O₂, 32 grams per mole, so 32 grams is 1 mole of molecules. 16 grams is the trap: only 0.5 mole of O₂.'
    write: '$\ce{O2}$: 32 g ÷ 32 g mol⁻¹ = 1 mol ✓;  16 g ÷ 32 g mol⁻¹ = 0.5 mol ✗'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Your turn. How many molecules are in 9 grams of water, H₂O? Pause and work it before I go on.'
    write: 'Molecules in 9 g of $\ce{H2O}$ = ?  [H = 1, O = 16]'
  - say: 'H₂O is 2 plus 16, which is 18 grams per mole, so 9 grams is 0.5 mole. 0.5 times 6.02 × 10²³ is 3.01 × 10²³ molecules.'
    write: 'n = 9 g ÷ 18 g mol⁻¹ = 0.5 mol;  molecules = 0.5 mol × 6.02 × 10²³ mol⁻¹ = 3.01 × 10²³'
    doodle_do:
      - {id: mm, op: pulse, part: to-moles, 'on': mole}
      - {id: mm, op: pulse, part: to-particles, 'on': times}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. A mole is 6.02 × 10²³ particles, and the mass of one mole is the molar mass, in grams per mole.'
    write: '1. 1 mol = 6.02 × 10²³ particles;  mass of 1 mol = M in g mol⁻¹'
  - say: 'The mole links them: mass over M, particles over L, or gas volume over 22.4 at s.t.p. That''s the lesson. Next lesson: concentration and reacting masses.'
    write: '2. n = m ÷ M = N ÷ L = V ÷ 22.4 dm³ mol⁻¹'
    doodle_do:
      - {id: mm, op: pulse, part: moles, 'on': mole}

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'What volume does 4.2 g of nitrogen gas, $\ce{N2}$, occupy at s.t.p.? [N = 14; molar volume = 22.4 dm³ mol⁻¹ at s.t.p.]'
    answer: '3.36 dm³'
    accept: ['3.36', '3.36 dm3', '3.36dm3', '3.36 dm^3', '3.36dm³', '3360 cm3', '3360 cm³']
    needs_working: true
    working:
      - 'M($\ce{N2}$) = 2 × 14 = 28 g mol⁻¹'
      - 'n = 4.2 g ÷ 28 g mol⁻¹ = 0.15 mol'
      - 'V = 0.15 mol × 22.4 dm³ mol⁻¹ = 3.36 dm³'
