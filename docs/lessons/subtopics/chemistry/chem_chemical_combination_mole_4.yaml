part: 4
title: 'Concentration and reacting masses'
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. This is lesson four of four on chemical combination and the mole: concentration and reacting masses.'
    write: 'Concentration and reacting masses'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson you used the mole map for mass, particles and gas volume. This lesson adds solutions, then uses balanced equations to find how much reacts and how much forms.'
    write: 'Solutions, then how much reacts and how much forms'
    doodle: {name: 'custom:sub_chem_chemical_combination_mole_a3', id: mm, size: scene, caption: 'the mole map', 'on': map}

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'By the end of this lesson you will be able to do two things. One, find the concentration of a solution, and use C₁V₁ equals C₂V₂ for dilution.'
    write: '1. Find concentration; dilution C₁V₁ = C₂V₂'
  - say: 'Two, find reacting masses and gas volumes from a balanced equation.'
    write: '2. Reacting masses and volumes from a balanced equation'

  # ---------------------------------------------------------------- concentration
  - section: 'Concentration of a solution'
    say: 'The molar concentration of a solution is the number of moles of solute in one cubic decimetre of solution. Its unit is moles per cubic decimetre.'
    write: 'Concentration C = n ÷ V (V in dm³), in mol dm⁻³'
    doodle_do:
      - {id: mm, op: stage, stage: 'custom:sub_chem_chemical_combination_mole_a4', 'on': solution}
  - say: 'So the moles in a solution are the concentration times the volume. Always change cubic centimetres to cubic decimetres first.'
    write: 'n = C × V;  cm³ ÷ 1000 = dm³'
    doodle_do:
      - {id: mm, op: circle, part: from-solution, 'on': times}
  - say: 'Let us solve this. 5.3 grams of sodium trioxocarbonate(IV), Na₂CO₃, is dissolved to make 250 cubic centimetres of solution. Find its concentration.'
    write: '$\ce{Na2CO3}$: M = 2(23) + 12 + 3(16) = 106 g mol⁻¹'
  - say: 'The moles are 5.3 grams divided by 106 grams per mole, which is 0.05 mole. The volume is 250 divided by 1000, which is 0.250 cubic decimetres.'
    write: 'n = 5.3 g ÷ 106 g mol⁻¹ = 0.05 mol;  V = 0.250 dm³'
  - say: 'The concentration is 0.05 mole divided by 0.250 cubic decimetres, which is 0.20 moles per cubic decimetre.'
    write: 'C = 0.05 mol ÷ 0.250 dm³ = 0.20 mol dm⁻³'
    doodle_do:
      - {id: mm, op: pulse, part: to-solution, 'on': divided}
  - say: 'In grams per cubic decimetre, multiply by the molar mass. 0.20 times 106 is 21.2 grams per cubic decimetre.'
    write: 'Mass concentration = 0.20 mol dm⁻³ × 106 g mol⁻¹ = 21.2 g dm⁻³'
  - say: 'When water is added, the moles of solute stay the same, so C₁V₁ equals C₂V₂. V₂ is the final volume, acid and water together.'
    write: 'Dilution: C₁V₁ = C₂V₂  (V₂ = the final total volume)'
  - say: 'Let us solve this. 50 cubic centimetres of 2.0 molar acid is made up to 250 cubic centimetres. C₂ is 2.0 times 50 over 250, which is 0.40 molar.'
    write: 'C₂ = 2.0 mol dm⁻³ × 50 cm³ ÷ 250 cm³ = 0.40 mol dm⁻³'

  # ---------------------------------------------------------------- reacting masses
  - section: 'Reacting masses and volumes'
    say: 'For reacting masses, write the balanced equation. Change what is given into moles. Use the mole ratio from the equation, then change to what is asked.'
    write: 'Equation → moles → mole ratio → mass or volume'
  - say: 'Let us solve this. 25 grams of CaCO₃ is heated strongly. What mass of calcium oxide forms, and what volume of CO₂ at s.t.p.?'
    write: '$\ce{CaCO3(s) -> CaO(s) + CO2(g)}$  [Ca = 40, C = 12, O = 16]'
  - say: 'CaCO₃ is 25 grams over 100 grams per mole, which is 0.25 mole. The ratio is 1 to 1 to 1, so each product is 0.25 mole too.'
    write: 'n($\ce{CaCO3}$) = 25 g ÷ 100 g mol⁻¹ = 0.25 mol ∴ 0.25 mol CaO and 0.25 mol $\ce{CO2}$'
    doodle_do:
      - {id: mm, op: pulse, part: to-moles, 'on': over}
  - say: 'The mass of calcium oxide is 0.25 mole times 56 grams per mole, which is 14 grams.'
    write: 'Mass of CaO = 0.25 mol × 56 g mol⁻¹ = 14 g'
    doodle_do:
      - {id: mm, op: circle, part: to-mass, 'on': times}
  - say: 'The volume of CO₂ is 0.25 mole times 22.4 cubic decimetres per mole, which is 5.6 cubic decimetres.'
    write: 'V($\ce{CO2}$) = 0.25 mol × 22.4 dm³ mol⁻¹ = 5.6 dm³'
    doodle_do:
      - {id: mm, op: circle, part: to-gas, 'on': times}
  - say: 'Another one. What mass of aluminium oxide forms when 5.4 grams of aluminium burns? Use the balanced equation: 4Al gives 2Al₂O₃.'
    write: '$\ce{4Al + 3O2 -> 2Al2O3}$  [Al = 27, O = 16]'
  - say: 'Aluminium is 5.4 grams over 27 grams per mole, which is 0.2 mole. The ratio is 4 to 2, so the oxide is half of that, 0.1 mole.'
    write: 'n(Al) = 5.4 g ÷ 27 g mol⁻¹ = 0.2 mol;  n($\ce{Al2O3}$) = 0.2 mol × 2/4 = 0.1 mol'
  - say: 'Al₂O₃ is 54 plus 48, which is 102 grams per mole. So the mass is 0.1 mole times 102 grams per mole, which is 10.2 grams.'
    write: 'Mass = 0.1 mol × 102 g mol⁻¹ = 10.2 g'
  - say: 'Masses can also tell you the equation. 2.4 grams of magnesium displaces 6.4 grams of copper from copper(II) tetraoxosulphate(VI) solution. Find the mole ratio.'
    write: '2.4 g Mg → 6.4 g Cu  [Mg = 24, Cu = 64]'
  - say: 'Magnesium is 2.4 over 24, which is 0.1 mole. Copper is 6.4 over 64, also 0.1 mole. The ratio is 1 to 1, so one Mg gives one Cu.'
    write: '0.1 mol : 0.1 mol = 1 : 1 ∴ $\ce{Mg + CuSO4 -> MgSO4 + Cu}$'

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'A JAMB trap. 2 grams of NaOH is in 100 cubic centimetres of solution. That is 2 over 40, or 0.05 mole, in 0.1 cubic decimetres.'
    write: 'n = 2 g ÷ 40 g mol⁻¹ = 0.05 mol;  V = 100 cm³ = 0.1 dm³'
  - say: 'So the concentration is 0.05 over 0.1, which is 0.50 moles per cubic decimetre. The option 0.05 is the trap: it stops at the moles.'
    write: 'C = 0.05 mol ÷ 0.1 dm³ = 0.50 mol dm⁻³  (not 0.05 ✗)'
  - say: 'Another. 1 litre of 2.2 molar acid goes into 10 litres of water. The final volume is 11 litres, so it is 2.2 over 11, which is 0.20 molar.'
    write: 'C₂ = 2.2 M × 1 dm³ ÷ 11 dm³ = 0.20 M  (not ÷ 10 ✗)'
  - say: 'Examiners also see these slips: molar mass in grams instead of grams per mole, equations left unbalanced, units dropped, and answers rounded too early.'
    write: 'M in g mol⁻¹; balance first; keep units; round only at the end'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Your turn. 1.2 grams of magnesium reacts with excess hydrochloric acid. What volume of hydrogen forms at s.t.p.? Pause and work it before I go on.'
    write: '$\ce{Mg + 2HCl -> MgCl2 + H2}$;  1.2 g Mg → ? dm³ of $\ce{H2}$ at s.t.p.'
  - say: 'Magnesium is 1.2 grams over 24 grams per mole, which is 0.05 mole. One Mg gives one H₂, so the hydrogen is 0.05 mole too.'
    write: 'n = 1.2 g ÷ 24 g mol⁻¹ = 0.05 mol Mg → 0.05 mol $\ce{H2}$'
    doodle_do:
      - {id: mm, op: pulse, part: to-moles, 'on': over}
  - say: 'The volume is 0.05 mole times 22.4 cubic decimetres per mole, which is 1.12 cubic decimetres.'
    write: '∴ V = 0.05 mol × 22.4 dm³ mol⁻¹ = 1.12 dm³'
    doodle_do:
      - {id: mm, op: circle, part: to-gas, 'on': times}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. Concentration is moles over volume in cubic decimetres. When water is added, C₁V₁ equals C₂V₂.'
    write: '1. C = n ÷ V (V in dm³);  dilution: C₁V₁ = C₂V₂'
  - say: 'For reacting masses: balanced equation, moles, mole ratio, then mass or volume. That''s the lesson. Next, try new questions on it.'
    write: '2. Equation → moles → mole ratio → mass or volume'
    doodle_do:
      - {id: mm, op: pulse, part: moles, 'on': moles}

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'What mass of magnesium oxide forms when 4.8 g of magnesium burns completely in oxygen? $\ce{2Mg + O2 -> 2MgO}$  [Mg = 24, O = 16]'
    answer: '8.0 g'
    accept: ['8 g', '8.0', '8', '8g', '8.0g']
    needs_working: true
    working:
      - 'n(Mg) = 4.8 g ÷ 24 g mol⁻¹ = 0.2 mol'
      - 'From the equation, 2 mol Mg give 2 mol MgO, a ratio of 1 : 1, so n(MgO) = 0.2 mol.'
      - 'M(MgO) = 24 + 16 = 40 g mol⁻¹'
      - 'mass of MgO = 0.2 mol × 40 g mol⁻¹ = 8.0 g'
