# Gay-Lussac's law and Avogadro's law (lesson 4 of 10): the two laws about gas volumes, reacting volumes from a balanced equation, the left-over gas in a table, equal volumes holding equal numbers of molecules, and the JAMB air trap.
format_version: 1
subject: chemistry
subtopic: 'Laws of chemical combination, formulae, equations and the mole'
subtopic_id: bf0c2ac8-4a5f-54e0-99a2-37ff23fb0988
sources:            # the source map's pages for this topic (docs/lessons/sources.md), for reviewers
  - https://ibass.jamb.gov.ng
