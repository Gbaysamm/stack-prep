part: 4
title: 'Gay-Lussac''s law and Avogadro''s law'
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is Gay-Lussac''s law and Avogadro''s law.'
    write: 'Gay-Lussac''s law and Avogadro''s law'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson, you learnt to balance equations. Now we meet the last two laws of chemical combination, which are about gases. Gases are easier to measure by volume than by mass, so these two laws use volumes.'
    write: 'Two laws about the volumes of gases'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn to state both laws, and to use them to find the volumes of gases that react and form.'
    write: 'Today: state both laws, and find the volumes of reacting gases'

  # ---------------------------------------------------------------- Gay-Lussac
  - section: 'Gay-Lussac''s law'
    say: 'The fifth law is Gay-Lussac''s law of combining volumes. It says that when gases react, the volumes of the reacting gases, and of any gaseous products, are in a simple whole number ratio.'
    write: 'Gay-Lussac: the volumes of reacting gases and gaseous products are in a simple whole number ratio'
  - say: 'The volumes must all be measured at the same temperature and pressure, because the volume of a gas changes when these change.'
    write: 'All volumes at the same temperature and pressure'
  - say: 'The ratio of the volumes is the same as the numbers in front of the gases in the balanced equation.'
    write: 'Volume ratio = the numbers in front of the gases in the equation'
    point:
      - {line: 5, kind: underline, at: 'numbers in front'}

  # worked example 1
  - section: 'Worked example'
    say: 'Let us use this. 50 cubic centimetres of methane burns completely in oxygen. We must find the volume of oxygen used and the volume of carbon(IV) oxide formed, at the same temperature and pressure.'
    write: '50 cm³ of methane ($\ce{CH4}$) burns. Oxygen used? Carbon(IV) oxide formed?'
  - say: 'First, the balanced equation. One molecule of methane reacts with two molecules of oxygen, to give one molecule of carbon(IV) oxide and two molecules of water.'
    write: '$\ce{CH4(g) + 2O2(g) -> CO2(g) + 2H2O(l)}$'
  - say: 'So 1 volume of methane needs 2 volumes of oxygen. 2 times 50 cubic centimetres is 100 cubic centimetres of oxygen.'
    write: 'Oxygen = 2 × 50 cm³ = 100 cm³'
  - say: '1 volume of methane gives 1 volume of carbon(IV) oxide, so 50 cubic centimetres of it forms.'
    write: 'Carbon(IV) oxide = 1 × 50 cm³ = 50 cm³'
  - say: 'What about the water? At room temperature, water is a liquid, as its state symbol l shows. Gay-Lussac''s law is only for gases, so we do not count a volume for the water.'
    write: 'Water is a liquid (l), so it has no gas volume to count'

  # worked example 2: the table
  - say: 'Another one. 60 cubic centimetres of hydrogen is exploded with 40 cubic centimetres of oxygen. We must find which gas is left over, and how much of it.'
    write: '60 cm³ of hydrogen ($\ce{H2}$) + 40 cm³ of oxygen ($\ce{O2}$). Which is left over?'
  - say: 'The balanced equation is 2H₂ plus O₂ gives 2H₂O. Let me set the volumes out in a table.'
    write: '$\ce{2H2(g) + O2(g) -> 2H2O(l)}$'
    diagram:
      id: gl
      kind: table
      caption: 'hydrogen and oxygen by volume'
      'on': table
      columns: ['Gas', 'H₂', 'O₂']
      rows:
        - ['ratio', '2', '1']
        - ['given', '60 cm³', '40 cm³']
        - ['used', '', '']
        - ['left', '', '']
  - say: 'The ratio is 2 volumes of hydrogen to 1 volume of oxygen. If all 60 cubic centimetres of hydrogen reacts, it needs half that volume of oxygen, which is 30 cubic centimetres.'
    write: 'Oxygen used = 60 cm³ ÷ 2 = 30 cm³'
    diagram_do:
      - {id: gl, op: highlight, part: 'row:1', 'on': ratio}
      - {id: gl, op: fill, part: 'cell:3,2', text: '60 cm³', 'on': all}
      - {id: gl, op: fill, part: 'cell:3,3', text: '30 cm³', 'on': half}
  - say: 'We had 40 cubic centimetres of oxygen, so 40 minus 30 leaves 10 cubic centimetres of oxygen. All the hydrogen is used up, so none of it is left.'
    write: '∴ oxygen left = 40 cm³ − 30 cm³ = 10 cm³'
    diagram_do:
      - {id: gl, op: fill, part: 'cell:4,3', text: '10 cm³', answer: true, 'on': leaves}
      - {id: gl, op: fill, part: 'cell:4,2', text: '0', 'on': none}

  # ---------------------------------------------------------------- Avogadro
  - section: 'Avogadro''s law'
    say: 'The sixth law is Avogadro''s law. It says that equal volumes of all gases, at the same temperature and pressure, contain the same number of molecules.'
    write: 'Avogadro: equal volumes of gases, at the same temperature and pressure, hold equal numbers of molecules'
    point:
      - {line: 15, kind: underline, at: 'equal numbers of molecules'}
  - say: 'So for gases, the ratio of volumes is the ratio of molecules. This is why Gay-Lussac''s law works. 2 volumes of hydrogen react with 1 volume of oxygen because 2 molecules of hydrogen react with 1 molecule of oxygen.'
    write: 'Volume ratio = ratio of molecules; this explains Gay-Lussac'
  - say: 'Let us use it. A cubic decimetre is 1000 cubic centimetres. At some temperature and pressure, 2 cubic decimetres of hydrogen holds n molecules. How many molecules are in 6 cubic decimetres of carbon(IV) oxide at the same temperature and pressure?'
    write: '2 dm³ of $\ce{H2}$ has n molecules. 6 dm³ of $\ce{CO2}$ has ?'
  - say: 'By Avogadro''s law, the kind of gas does not matter, only its volume. 6 cubic decimetres is 3 times 2 cubic decimetres, so it holds 3 times as many molecules, which is 3n.'
    write: '6 dm³ ÷ 2 dm³ = 3, so 3n molecules'
    point:
      - {line: 18, kind: circle, at: '3n molecules'}

  # ---------------------------------------------------------------- JAMB trap
  - section: 'JAMB trap'
    say: 'Here is a real JAMB question. 50 cubic centimetres of carbon(II) oxide is exploded with 150 cubic centimetres of air, and the air is 20 percent oxygen. Which gas is in excess?'
    write: '50 cm³ of carbon(II) oxide (CO) + 150 cm³ of air (20% oxygen). Which gas is in excess?'
  - say: 'Only the oxygen in the air reacts. 20 percent of 150 cubic centimetres is 30 cubic centimetres of oxygen.'
    write: 'Oxygen = 20% of 150 cm³ = 30 cm³'
  - say: 'The equation is 2CO plus O₂ gives 2CO₂. So 50 cubic centimetres of carbon(II) oxide needs half its volume of oxygen, which is 25 cubic centimetres.'
    write: '$\ce{2CO + O2 -> 2CO2}$: oxygen needed = 50 cm³ ÷ 2 = 25 cm³'
  - say: 'We have 30 cubic centimetres of oxygen and need only 25, so oxygen is in excess. Nitrogen is the trap. It is left over too, but it never took part in the reaction.'
    write: '∴ oxygen is in excess (nitrogen does not react ✗)'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. 10 cubic centimetres of nitrogen reacts with hydrogen to form ammonia. The equation is N₂ plus 3H₂ gives 2NH₃. What volume of hydrogen is needed? Pause the lesson and work it out.'
    write: '$\ce{N2 + 3H2 -> 2NH3}$: 10 cm³ of $\ce{N2}$ needs ? cm³ of $\ce{H2}$'
  - say: '1 volume of nitrogen needs 3 volumes of hydrogen. 3 times 10 cubic centimetres is 30 cubic centimetres of hydrogen.'
    write: 'Hydrogen = 3 × 10 cm³ = 30 cm³'

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. Gay-Lussac''s law says that reacting gases have volumes in a simple ratio, the ratio of the numbers in the balanced equation.'
    write: '1. Gay-Lussac: gas volumes in the ratio of the equation'
  - say: 'Avogadro''s law says that equal volumes of gases hold equal numbers of molecules. In the next lesson, we meet the mole. Now try the problem.'
    write: '2. Avogadro: equal volumes, equal numbers of molecules'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: '20 cm³ of hydrogen burns in excess chlorine: $\ce{H2(g) + Cl2(g) -> 2HCl(g)}$. What volume of hydrogen chloride forms, measured at the same temperature and pressure?'
    answer: '40 cm³'
    accept: ['40', '40 cm3', '40cm3', '40 cm^3', '40cm³']
    needs_working: false
    working:
      - 'By Gay-Lussac''s law, the volume ratio is the ratio in the equation: 1 volume of $\ce{H2}$ gives 2 volumes of HCl.'
      - 'Volume of HCl = 2 × 20 cm³ = 40 cm³'
