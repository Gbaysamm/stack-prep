# The mole and molar mass (lesson 5 of 10): relative atomic and molecular mass, the mole and the Avogadro constant, molar mass, and changing between mass and moles on the mole map.
format_version: 1
subject: chemistry
subtopic: 'Laws of chemical combination, formulae, equations and the mole'
subtopic_id: bf0c2ac8-4a5f-54e0-99a2-37ff23fb0988
sources:            # the source map's pages for this topic (docs/lessons/sources.md), for reviewers
  - https://ibass.jamb.gov.ng
  - https://syllabus.ng/jamb/chemistry
  - https://syllabus.ng/waec/chemistry/
  - https://syllabus.ng/neco/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://elearn.education.gov.ng
part: 5
title: 'The mole and molar mass'
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is the mole and molar mass.'
    write: 'The mole and molar mass'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson, Avogadro''s law told us that equal volumes of gases hold equal numbers of molecules. Chemists often need to count particles like these, and they count them in moles.'
    write: 'Chemists count particles in moles'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn what a mole is, what molar mass is, and how to change a mass into moles.'
    write: 'Today: the mole, molar mass, and mass into moles'

  # ---------------------------------------------------------------- relative masses
  - section: 'Relative masses'
    say: 'First, we need the masses of atoms. The relative atomic mass of an element compares the mass of its atom with one twelfth of the mass of a carbon-12 atom.'
    write: 'Relative atomic mass: compared with 1/12 of a carbon-12 atom'
  - say: 'For example, hydrogen is 1, carbon is 12 and oxygen is 16. JAMB gives you these values in the question.'
    write: 'E.g. H = 1, C = 12, O = 16 (given in the question)'
  - say: 'The relative molecular mass of a substance is the sum of the relative atomic masses of all the atoms in its formula.'
    write: 'Relative molecular mass = sum of the relative atomic masses in the formula'
  - say: 'For example, water, H₂O, has two hydrogen atoms and one oxygen atom. 2 times 1, plus 16, is 18.'
    write: 'Water ($\ce{H2O}$): 2(1) + 16 = 18'

  # ---------------------------------------------------------------- the mole
  - section: 'The mole'
    say: 'Now the mole. Atoms are far too small to count one by one, so we count them in moles. A mole is the amount of substance that holds as many particles as there are atoms in exactly 12 g of carbon-12.'
    write: 'Mole: as many particles as there are atoms in 12 g of carbon-12'
  - say: 'That number is 6.02 × 10²³. It is called the Avogadro constant, L.'
    write: 'L = 6.02 × 10²³ per mole, the Avogadro constant'
    point:
      - {line: 8, kind: circle, at: '6.02 × 10²³'}
  - say: 'The particles can be atoms, molecules or ions, so we always say which. For example, one mole of oxygen molecules, O₂, holds two moles of oxygen atoms, because each molecule has two atoms.'
    write: '1 mol of oxygen ($\ce{O2}$) molecules = 2 mol of O atoms'

  # ---------------------------------------------------------------- molar mass
  - section: 'Molar mass'
    say: 'The molar mass, M, is the mass of one mole of a substance. It is the relative atomic or molecular mass written in grams, and its unit is grams per mole.'
    write: 'Molar mass M: the mass of 1 mol, in g mol⁻¹'
  - say: 'For example, the relative molecular mass of water is 18, so one mole of water has a mass of 18 g. Its molar mass is 18 grams per mole.'
    write: 'Water: M = 18 g mol⁻¹'
  - say: 'Let us find the molar mass of tetraoxosulphate(VI) acid, H₂SO₄. We are given hydrogen 1, sulphur 32 and oxygen 16.'
    write: 'Tetraoxosulphate(VI) acid ($\ce{H2SO4}$): H = 1, sulphur (S) = 32, O = 16'
  - say: 'It has 2 hydrogen atoms, 1 sulphur atom and 4 oxygen atoms. So M is 2 times 1, plus 32, plus 4 times 16, which is 98 grams per mole.'
    write: 'M = 2(1) + 32 + 4(16) = 98 g mol⁻¹'

  # ---------------------------------------------------------------- mass and moles
  - section: 'Mass and moles'
    say: 'Now we can change a mass into moles. The number of moles is the mass divided by the molar mass.'
    write: 'Number of moles, n = mass ÷ molar mass'
    point:
      - {line: 14, kind: underline, at: 'mass ÷ molar mass'}
  - say: 'Look at the mole map. To go from mass to moles, we divide by M. To go back from moles to mass, we multiply by M.'
    write: 'Mass ÷ M = moles; moles × M = mass'
    doodle: {name: 'custom:sub_chem_chemical_combination_mole_a', id: mm, size: scene, caption: 'the mole map', 'on': map}
    doodle_do:
      - {id: mm, op: circle, part: to-moles, 'on': divide}
      - {id: mm, op: circle, part: to-mass, 'on': multiply}

  # worked examples
  - section: 'Worked example'
    say: 'Let us use it. How many moles are in 4.9 g of H₂SO₄? We are given the mass, and we have just found that M is 98 grams per mole.'
    write: 'Moles in 4.9 g of $\ce{H2SO4}$? (M = 98 g mol⁻¹)'
  - say: 'We are going from mass to moles, so we divide. 4.9 g divided by 98 grams per mole is 0.05 mole.'
    write: 'n = 4.9 g ÷ 98 g mol⁻¹ = 0.05 mol'
    doodle_do:
      - {id: mm, op: pulse, part: to-moles, 'on': divide}
  - say: 'Now the other way. What is the mass of 2 moles of water? We are going from moles to mass, so we multiply by the molar mass. 2 times 18 is 36 g.'
    write: 'Mass of 2 mol of water = 2 mol × 18 g mol⁻¹ = 36 g'
    doodle_do:
      - {id: mm, op: pulse, part: to-mass, 'on': multiply}

  # ---------------------------------------------------------------- JAMB trap
  - section: 'JAMB trap'
    say: 'Here is a JAMB trap. The number of atoms in 24 g of magnesium equals the number of molecules in what mass of oxygen gas? Magnesium is 24 grams per mole, so 24 g is 1 mole of atoms.'
    write: 'Atoms in 24 g of magnesium (Mg) = 24 g ÷ 24 g mol⁻¹ = 1 mol'
  - say: 'So we need 1 mole of oxygen molecules. Oxygen gas is O₂, with a molar mass of 32 grams per mole, so the answer is 32 g. 16 g is the trap, because it is only half a mole of O₂.'
    write: '$\ce{O2}$: 1 mol = 32 g ✓; 16 g is only 0.5 mol ✗'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. How many moles are in 10 g of calcium trioxocarbonate(IV), CaCO₃? Calcium is 40, carbon is 12 and oxygen is 16. Pause the lesson and work it out.'
    write: 'Moles in 10 g of calcium trioxocarbonate(IV) ($\ce{CaCO3}$)? Ca = 40, C = 12, O = 16'
  - say: 'First the molar mass. 40 plus 12 plus 3 times 16 is 100 grams per mole. Then 10 g divided by 100 grams per mole is 0.1 mole.'
    write: 'M = 40 + 12 + 3(16) = 100 g mol⁻¹; n = 10 g ÷ 100 g mol⁻¹ = 0.1 mol'
    point:
      - {line: 22, kind: circle, at: '0.1 mol'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. A mole is 6.02 × 10²³ particles, and the molar mass is the mass of one mole, in grams per mole.'
    write: '1. 1 mol = 6.02 × 10²³ particles; M = mass of 1 mol, in g mol⁻¹'
  - say: 'To find the moles, divide the mass by the molar mass. In the next lesson, we add particles and gas volumes to the mole map. Now try the problem.'
    write: '2. n = mass ÷ M'
    doodle_do:
      - {id: mm, op: pulse, part: moles, 'on': moles}

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'What is the mass of 0.5 mol of sodium hydroxide, NaOH? [Na = 23, O = 16, H = 1]'
    answer: '20 g'
    accept: ['20', '20g', '20.0 g', '20 grams']
    needs_working: true
    working:
      - 'M(NaOH) = 23 + 16 + 1 = 40 g mol⁻¹'
      - 'From moles to mass, multiply by M: mass = 0.5 mol × 40 g mol⁻¹ = 20 g'
