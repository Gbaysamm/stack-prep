# Percentage composition and the empirical formula (lesson 7 of 10): the percentage of an element in a compound, then the empirical formula from masses and from percentages, each guided step by step, with the JAMB nitrogen question.
format_version: 1
subject: chemistry
subtopic: 'Laws of chemical combination, formulae, equations and the mole'
subtopic_id: bf0c2ac8-4a5f-54e0-99a2-37ff23fb0988
sources:            # the source map's pages for this topic (docs/lessons/sources.md), for reviewers
  - https://ibass.jamb.gov.ng
  - https://syllabus.ng/jamb/chemistry
  - https://syllabus.ng/waec/chemistry/
  - https://syllabus.ng/neco/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://elearn.education.gov.ng
part: 7
title: 'Percentage composition and the empirical formula'
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is percentage composition and the empirical formula.'
    write: 'Percentage composition and the empirical formula'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last two lessons, you learnt to find molar masses and moles. Now we use them to find how much of each element is in a compound, and to work out a formula from masses.'
    write: 'From a formula to percentages, and from masses to a formula'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn to find the percentage of an element in a compound, and to find the empirical formula of a compound.'
    write: 'Today: percentage composition, and the empirical formula'

  # ---------------------------------------------------------------- percentage composition
  - section: 'Percentage composition'
    say: 'The percentage by mass of an element in a compound is the mass of that element in one mole of the compound, divided by the molar mass, times 100.'
    write: '% of element = mass of element in 1 mol ÷ molar mass × 100'
  - say: 'Let us find the percentage of nitrogen in ammonium trioxonitrate(V), NH₄NO₃. Nitrogen is 14, hydrogen is 1 and oxygen is 16.'
    write: '% of nitrogen in ammonium trioxonitrate(V) ($\ce{NH4NO3}$)? N = 14, H = 1, O = 16'
  - say: 'First the molar mass. There are 2 nitrogen atoms, 4 hydrogen atoms and 3 oxygen atoms, so M is 28 plus 4 plus 48, which is 80 grams per mole.'
    write: 'M = 2(14) + 4(1) + 3(16) = 80 g mol⁻¹'
  - say: 'Next the mass of nitrogen in one mole. There is one nitrogen atom in NH₄ and another in NO₃, so it is 2 times 14, which is 28 g.'
    write: 'Nitrogen in 1 mol = 2 × 14 g = 28 g'
  - say: 'So the percentage is 28 divided by 80, times 100, which is 35 percent.'
    write: '% N = 28 g ÷ 80 g × 100 = 35%'
    point:
      - {line: 7, kind: circle, at: '35%'}

  # ---------------------------------------------------------------- empirical formula
  - section: 'Empirical formula'
    say: 'Now we go the other way, from masses to a formula. The empirical formula of a compound is the simplest whole number ratio of its atoms.'
    write: 'Empirical formula: the simplest whole number ratio of atoms'
  - say: 'To find it, we first divide the mass or percentage of each element by its relative atomic mass. This gives the moles of atoms of each element.'
    write: 'Step 1: mass or % ÷ relative atomic mass = moles of atoms'
  - say: 'Then we divide every answer by the smallest one, to get the simplest ratio.'
    write: 'Step 2: divide each by the smallest'

  # worked example 1: from masses
  - section: 'Worked example'
    say: 'Let us solve this. 2.4 g of magnesium burns to give 4.0 g of magnesium oxide. We must find the empirical formula. Magnesium is 24 and oxygen is 16.'
    write: '2.4 g of magnesium (Mg) → 4.0 g of magnesium oxide. Mg = 24, O = 16'
  - say: 'We need the mass of oxygen too. By the law of conservation of mass, it is 4.0 g minus 2.4 g, which is 1.6 g.'
    write: 'Oxygen = 4.0 g − 2.4 g = 1.6 g'
  - say: 'Step 1 for magnesium. 2.4 divided by 24 is 0.1 mole.'
    write: 'Mg: 2.4 ÷ 24 = 0.1 mol'
  - say: 'Step 1 for oxygen. 1.6 divided by 16 is also 0.1 mole.'
    write: 'O: 1.6 ÷ 16 = 0.1 mol'
  - say: 'Step 2. Both are 0.1, so dividing by 0.1 gives 1 to 1. So the empirical formula is MgO.'
    write: '∴ Mg : O = 1 : 1, so MgO'

  # worked example 2: from percentages, in a table
  - say: 'Another one. A compound contains 40.0 percent carbon, 6.7 percent hydrogen and 53.3 percent oxygen. Let me set out a table.'
    write: 'Carbon (C) 40.0%, hydrogen (H) 6.7%, oxygen (O) 53.3%. C = 12, H = 1, O = 16'
    diagram:
      id: ef
      kind: table
      caption: 'empirical formula'
      'on': table
      columns: ['Element', '% by mass', '÷ Ar', '÷ smallest']
      rows:
        - ['C', '40.0', '', '']
        - ['H', '6.7', '', '']
        - ['O', '53.3', '', '']
  - say: 'Step 1, divide each by its relative atomic mass. Carbon is 40.0 divided by 12, which is 3.33.'
    write: 'C: 40.0 ÷ 12 = 3.33'
    diagram_do:
      - {id: ef, op: fill, part: 'cell:1,3', text: '3.33', 'on': Carbon}
  - say: 'Hydrogen is 6.7 divided by 1, which is 6.7.'
    write: 'H: 6.7 ÷ 1 = 6.7'
    diagram_do:
      - {id: ef, op: fill, part: 'cell:2,3', text: '6.7', 'on': Hydrogen}
  - say: 'Oxygen is 53.3 divided by 16, which is 3.33.'
    write: 'O: 53.3 ÷ 16 = 3.33'
    diagram_do:
      - {id: ef, op: fill, part: 'cell:3,3', text: '3.33', 'on': Oxygen}
  - say: 'Step 2, divide each by the smallest, which is 3.33. Carbon gives 1, hydrogen gives 2.01, which we round to 2, and oxygen gives 1.'
    write: '÷ 3.33: C = 1, H = 2.01 ≈ 2, O = 1'
    diagram_do:
      - {id: ef, op: fill, part: 'cell:1,4', text: '1', 'on': Carbon}
      - {id: ef, op: fill, part: 'cell:2,4', text: '2', 'on': hydrogen}
      - {id: ef, op: fill, part: 'cell:3,4', text: '1', 'on': oxygen}
  - say: 'So the empirical formula is CH₂O.'
    write: '∴ empirical formula = $\ce{CH2O}$'
    diagram_do:
      - {id: ef, op: highlight, part: 'col:4', text: 'C 1 : H 2 : O 1', answer: true, 'on': formula}

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is a trap. If a ratio comes out near a half, as in 1 to 1.5, do not round it. Multiply every number by 2, so 1 to 1.5 becomes 2 to 3. For iron and oxygen, that gives iron(III) oxide, Fe₂O₃.'
    write: 'Trap: 1 : 1.5 is not 1 : 2. × 2 → 2 : 3, as in iron(III) oxide ($\ce{Fe2O3}$)'
  - say: 'Here is a real JAMB question. Find the percentage of nitrogen in calcium trioxonitrate(V). Calcium is 40, nitrogen is 14 and oxygen is 16.'
    write: '% N in calcium trioxonitrate(V)? Ca = 40, N = 14, O = 16'
  - say: 'A calcium ion carries a charge of plus two, and a trioxonitrate(V) ion carries minus one, so two of them are needed. The formula is Ca(NO₃)₂, with 2 nitrogen atoms. M is 40 plus 2 times 62, which is 164 grams per mole.'
    write: '$\ce{Ca(NO3)2}$: M = 40 + 2(14 + 48) = 164 g mol⁻¹'
  - say: 'So the percentage is 28 divided by 164, times 100, which is 17.1 percent. The trap is to count only one nitrogen atom, which gives 8.5 percent.'
    write: '% N = 28 g ÷ 164 g × 100 = 17.1% (14 ÷ 164 gives 8.5% ✗)'
    point:
      - {line: 25, kind: circle, at: '17.1%'}

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Find the percentage of carbon in carbon(IV) oxide, CO₂. Pause the lesson and work it out.'
    write: '% of carbon in carbon(IV) oxide ($\ce{CO2}$)? C = 12, O = 16'
  - say: 'M of CO₂ is 12 plus 32, which is 44 grams per mole, and one mole holds 12 g of carbon. 12 divided by 44, times 100, is 27.3 percent.'
    write: '% C = 12 g ÷ 44 g × 100 = 27.3%'

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. The percentage of an element is its mass in one mole of the compound, divided by the molar mass, times 100.'
    write: '1. % of element = mass in 1 mol ÷ molar mass × 100'
  - say: 'For the empirical formula, divide by the relative atomic masses, then by the smallest. In the next lesson, we find the molecular formula. Now try the problem.'
    write: '2. Empirical formula: ÷ relative atomic mass, then ÷ the smallest'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'A hydrocarbon contains 75% carbon and 25% hydrogen by mass. Find its empirical formula. [C = 12, H = 1]'
    answer: 'CH4'
    accept: ['CH₄', 'ch4']
    needs_working: true
    working:
      - 'C: 75 ÷ 12 = 6.25; H: 25 ÷ 1 = 25'
      - 'Divide by the smallest, 6.25: C = 1, H = 25 ÷ 6.25 = 4'
      - 'C : H = 1 : 4, so the empirical formula is $\ce{CH4}$.'
