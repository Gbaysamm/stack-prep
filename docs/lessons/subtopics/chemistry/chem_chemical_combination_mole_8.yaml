# The molecular formula and water of crystallisation (lesson 8 of 10): from the empirical formula and the molar mass to the molecular formula, then the number of water molecules in a hydrated salt from its loss of mass on heating.
format_version: 1
subject: chemistry
subtopic: 'Laws of chemical combination, formulae, equations and the mole'
subtopic_id: bf0c2ac8-4a5f-54e0-99a2-37ff23fb0988
sources:            # the source map's pages for this topic (docs/lessons/sources.md), for reviewers
  - https://ibass.jamb.gov.ng
