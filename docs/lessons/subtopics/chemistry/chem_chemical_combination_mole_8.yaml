part: 8
title: 'The molecular formula and water of crystallisation'
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is the molecular formula and water of crystallisation.'
    write: 'The molecular formula and water of crystallisation'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson, you found the empirical formula, the simplest ratio of atoms. But a molecule often holds more atoms than the simplest ratio shows.'
    write: 'The simplest ratio is not always the real molecule'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn to find the molecular formula, and the number of water molecules in a hydrated salt.'
    write: 'Today: the molecular formula, and water of crystallisation'

  # ---------------------------------------------------------------- molecular formula
  - section: 'Molecular formula'
    say: 'The molecular formula shows the actual number of atoms of each element in one molecule.'
    write: 'Molecular formula: the actual atoms in one molecule'
  - say: 'For example, one molecule of ethene is C₂H₄. Its atoms are in the ratio 2 to 4, which is 1 to 2 at its simplest, so its empirical formula is CH₂. The molecular formula is 2 times the empirical formula.'
    write: 'Ethene: empirical $\ce{CH2}$, molecular $\ce{C2H4}$ = 2 × $\ce{CH2}$'
  - say: 'So the molecular formula is the empirical formula multiplied by a whole number, n. The empirical formula mass is the sum of the relative atomic masses in the empirical formula. To find n, we divide the molar mass by the empirical formula mass.'
    write: 'Molecular formula = (empirical formula)ₙ; n = molar mass ÷ empirical formula mass'
    point:
      - {line: 5, kind: underline, at: 'n = molar mass ÷ empirical formula mass'}

  # worked example
  - section: 'Worked example'
    say: 'Let us solve this. A compound has the empirical formula CH₂O and a vapour density of 30. We must find its molecular formula.'
    write: 'Empirical formula $\ce{CH2O}$, vapour density 30. Molecular formula?'
  - say: 'First the molar mass. You learnt that the relative molecular mass is 2 times the vapour density. 2 times 30 is 60, so M is 60 grams per mole.'
    write: 'M = 2 × 30 = 60 g mol⁻¹'
  - say: 'Next the empirical formula mass. CH₂O is 12, plus 2 times 1, plus 16, which is 30.'
    write: '$\ce{CH2O}$ = 12 + 2(1) + 16 = 30'
  - say: 'So n is 60 divided by 30, which is 2.'
    write: 'n = 60 ÷ 30 = 2'
  - say: 'So we multiply the number of each atom in CH₂O by 2, and the molecular formula is C₂H₄O₂. This is ethanoic acid, the acid in vinegar.'
    write: '∴ ($\ce{CH2O}$)₂ = $\ce{C2H4O2}$, ethanoic acid'
    point:
      - {line: 10, kind: circle, at: '$\ce{C2H4O2}$'}
  - say: 'What does this tell us? The empirical formula gives the ratio of the atoms, and the molar mass tells us how many times that ratio fits into one molecule.'
    write: 'The ratio from the empirical formula; the size from the molar mass'

  # ---------------------------------------------------------------- water of crystallisation
  - section: 'Water of crystallisation'
    say: 'Now water of crystallisation. When some salts form crystals from water, they hold a fixed number of water molecules inside the crystals. This water is called water of crystallisation, and it is written after a dot in the formula.'
    write: 'Water of crystallisation: water held in crystals, written after a dot'
  - say: 'For example, washing soda is hydrated sodium trioxocarbonate(IV), Na₂CO₃·xH₂O. Hydrated means it holds water of crystallisation. Here x is the number of water molecules for each Na₂CO₃. Heating drives the water off, and the masses tell us x.'
    write: 'Washing soda (Na₂CO₃·xH₂O): heating drives off the water; find x'

  # worked example
  - section: 'Worked example'
    say: 'Let us solve this. 2.86 g of washing soda is heated until all its water is lost, and 1.06 g of Na₂CO₃ is left. We must find x. Sodium is 23, carbon 12, oxygen 16 and hydrogen 1.'
    write: '2.86 g of washing soda → 1.06 g of $\ce{Na2CO3}$. Na = 23, C = 12, O = 16, H = 1'
  - say: 'First, the mass of water lost. 2.86 g minus 1.06 g is 1.80 g.'
    write: 'Water lost = 2.86 g − 1.06 g = 1.80 g'
  - say: 'Next, the moles of water. M of water is 18 grams per mole, so 1.80 g divided by 18 is 0.100 mole.'
    write: 'Water: 1.80 g ÷ 18 g mol⁻¹ = 0.100 mol'
  - say: 'Then, the moles of Na₂CO₃. Its M is 46 plus 12 plus 48, which is 106 grams per mole, so 1.06 g divided by 106 is 0.0100 mole.'
    write: '$\ce{Na2CO3}$: M = 2(23) + 12 + 3(16) = 106 g mol⁻¹; 1.06 g ÷ 106 g mol⁻¹ = 0.0100 mol'
  - say: 'To find how many water molecules there are for each Na₂CO₃, we divide the moles of water by the moles of Na₂CO₃. 0.100 divided by 0.0100 is 10, so x is 10.'
    write: 'x = 0.100 mol ÷ 0.0100 mol = 10'
  - say: 'So the formula of washing soda is Na₂CO₃·10H₂O.'
    write: '∴ Na₂CO₃·10H₂O'
    point:
      - {line: 19, kind: circle, at: 'Na₂CO₃·10H₂O'}

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is a common trap. Some students use the vapour density as the molar mass. With 30 instead of 60, n comes out as 1, and they wrongly give CH₂O as the molecular formula. The molar mass is always 2 times the vapour density.'
    write: 'Trap: M = 2 × vapour density, not the vapour density itself ✗'
  - say: 'Another trap is to divide the whole 2.86 g by 18. The sample is salt and water together, so only the mass lost on heating is water.'
    write: 'Trap: water = the mass lost on heating, not the whole sample ✗'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. A hydrocarbon has the empirical formula CH₂ and a molar mass of 42 grams per mole. Find its molecular formula. Pause the lesson and work it out.'
    write: 'Empirical formula $\ce{CH2}$, M = 42 g mol⁻¹. Molecular formula?'
  - say: 'CH₂ is 12 plus 2, which is 14. 42 divided by 14 is 3, so the molecular formula is C₃H₆.'
    write: '$\ce{CH2}$ = 14; n = 42 ÷ 14 = 3 ∴ $\ce{C3H6}$'

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. The molecular formula is n times the empirical formula, where n is the molar mass divided by the empirical formula mass.'
    write: '1. Molecular formula = (empirical)ₙ; n = M ÷ empirical formula mass'
  - say: 'For water of crystallisation, find the moles of water lost and the moles of the dry salt, then divide the moles of water by the moles of salt. In the next lesson, we meet solutions and concentration. Now try the problem.'
    write: '2. Water of crystallisation: moles of water ÷ moles of dry salt'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'A hydrocarbon has the empirical formula CH and a vapour density of 39. Find its molecular formula. [C = 12, H = 1]'
    answer: 'C6H6'
    accept: ['C₆H₆', 'c6h6', '(CH)6']
    needs_working: true
    working:
      - 'M = 2 × vapour density = 2 × 39 = 78 g mol⁻¹'
      - 'Empirical formula mass of CH = 12 + 1 = 13'
      - 'n = 78 ÷ 13 = 6, so the molecular formula is $\ce{C6H6}$.'
