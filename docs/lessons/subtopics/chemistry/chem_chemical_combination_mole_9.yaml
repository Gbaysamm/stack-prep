# Concentration and dilution (lesson 9 of 10): the molar concentration of a solution added to the mole map, changing cm³ to dm³, mass concentration and molarity, then dilution with C₁V₁ = C₂V₂, and the JAMB traps.
format_version: 1
subject: chemistry
subtopic: 'Laws of chemical combination, formulae, equations and the mole'
subtopic_id: bf0c2ac8-4a5f-54e0-99a2-37ff23fb0988
sources:            # the source map's pages for this topic (docs/lessons/sources.md), for reviewers
  - https://ibass.jamb.gov.ng
  - https://syllabus.ng/jamb/chemistry
  - https://syllabus.ng/waec/chemistry/
  - https://syllabus.ng/neco/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://elearn.education.gov.ng
part: 9
title: 'Concentration and dilution'
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is the concentration of a solution, and dilution.'
    write: 'Concentration and dilution'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'So far, you have used the mole with masses, particles and gases. Many reactions happen in solution, so now we add solutions to the mole map.'
    write: 'Solutions on the mole map'
    doodle: {name: 'custom:sub_chem_chemical_combination_mole_a3', id: mm, size: scene, caption: 'the mole map', 'on': map}

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn to find the concentration of a solution, and the new concentration after water is added.'
    write: 'Today: concentration, and dilution'

  # ---------------------------------------------------------------- concentration
  - section: 'Concentration of a solution'
    say: 'A solution is made by dissolving a solute in a solvent, such as salt in water. The molar concentration of a solution is the number of moles of solute in one cubic decimetre of the solution.'
    write: 'Concentration: moles of solute in 1 dm³ of solution'
    doodle_do:
      - {id: mm, op: stage, stage: 'custom:sub_chem_chemical_combination_mole_a4', 'on': concentration}
  - say: 'So the concentration, C, is the moles divided by the volume in cubic decimetres. Its unit is moles per cubic decimetre.'
    write: 'C = n ÷ V (V in dm³), in mol dm⁻³'
    doodle_do:
      - {id: mm, op: circle, part: to-solution, 'on': divided}
    point:
      - {line: 4, kind: underline, at: 'V in dm³'}
  - say: 'Turned round, the moles in a solution are the concentration times the volume.'
    write: 'n = C × V'
    doodle_do:
      - {id: mm, op: circle, part: from-solution, 'on': times}
  - say: 'Volumes are often given in cubic centimetres. There are 1000 cubic centimetres in a cubic decimetre, so we always divide by 1000 first.'
    write: 'cm³ ÷ 1000 = dm³'

  # worked example
  - section: 'Worked example'
    say: 'Let us solve this. 5.3 g of sodium trioxocarbonate(IV), Na₂CO₃, is dissolved in water to make 250 cubic centimetres of solution. We must find its concentration.'
    write: '5.3 g of sodium trioxocarbonate(IV) ($\ce{Na2CO3}$) in 250 cm³ of solution. C = ?'
  - say: 'First the moles. M of Na₂CO₃ is 106 grams per mole, so 5.3 g divided by 106 is 0.05 mole.'
    write: 'n = 5.3 g ÷ 106 g mol⁻¹ = 0.05 mol'
    doodle_do:
      - {id: mm, op: pulse, part: to-moles, 'on': moles}
  - say: 'Next the volume in cubic decimetres. 250 divided by 1000 is 0.250 cubic decimetres.'
    write: 'V = 250 cm³ ÷ 1000 = 0.250 dm³'
  - say: 'Then the concentration. 0.05 mole divided by 0.250 cubic decimetres is 0.20 moles per cubic decimetre.'
    write: 'C = 0.05 mol ÷ 0.250 dm³ = 0.20 mol dm⁻³'
    doodle_do:
      - {id: mm, op: pulse, part: to-solution, 'on': concentration}
    point:
      - {line: 10, kind: circle, at: '0.20 mol dm⁻³'}
  - say: 'Concentration can also be given in grams per cubic decimetre. To change it, we multiply by the molar mass. 0.20 times 106 is 21.2 grams per cubic decimetre.'
    write: 'Mass concentration = 0.20 mol dm⁻³ × 106 g mol⁻¹ = 21.2 g dm⁻³'
  - say: 'A concentration in moles per cubic decimetre is also called the molarity. For example, 0.20 moles per cubic decimetre may be written 0.20 M, and said as 0.20 molar.'
    write: 'Molarity: 0.20 mol dm⁻³ = 0.20 M (molar)'

  # ---------------------------------------------------------------- dilution
  - section: 'Dilution'
    say: 'Now dilution. To dilute a solution, we add water. The water adds volume, but the number of moles of solute stays the same.'
    write: 'Dilution: add water; the moles of solute stay the same'
  - say: 'The moles are C times V, so C₁V₁ before equals C₂V₂ after. Here V₂ is the final volume, the solution and the water together.'
    write: 'C₁V₁ = C₂V₂ (V₂ = the final total volume)'
    point:
      - {line: 14, kind: underline, at: 'final total volume'}

  # worked example
  - section: 'Worked example'
    say: 'Let us solve this. 50 cubic centimetres of 2.0 M acid is made up to 250 cubic centimetres with water. We must find the new concentration.'
    write: '50 cm³ of 2.0 M acid made up to 250 cm³. C₂ = ?'
  - say: 'We are given C₁ as 2.0 M, V₁ as 50 cubic centimetres and V₂ as 250 cubic centimetres. Both volumes are in the same unit, so here we need not change them.'
    write: 'C₁ = 2.0 M, V₁ = 50 cm³, V₂ = 250 cm³'
  - say: 'Rearranging, C₂ is C₁V₁ divided by V₂. 2.0 times 50, divided by 250, is 0.40 M.'
    write: 'C₂ = 2.0 M × 50 cm³ ÷ 250 cm³ = 0.40 M'
  - say: 'What does this tell us? The volume became five times bigger, so the concentration became five times smaller.'
    write: 'Volume × 5, so concentration ÷ 5'

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is a JAMB trap. 2 g of sodium hydroxide, NaOH, is in 100 cubic centimetres of solution. That is 2 divided by 40, or 0.05 mole, in 0.1 cubic decimetres.'
    write: 'Sodium hydroxide (NaOH): n = 2 g ÷ 40 g mol⁻¹ = 0.05 mol; V = 100 cm³ = 0.1 dm³'
  - say: 'So the concentration is 0.05 divided by 0.1, which is 0.50 moles per cubic decimetre. The option 0.05 is the trap, because it stops at the moles.'
    write: 'C = 0.05 mol ÷ 0.1 dm³ = 0.50 mol dm⁻³ (not 0.05 ✗)'
  - say: 'Another one. 1 cubic decimetre of 2.2 M acid is added to 10 cubic decimetres of water. The final volume is 11 cubic decimetres, not 10, so the concentration is 2.2 divided by 11, which is 0.20 M.'
    write: 'C₂ = 2.2 M × 1 dm³ ÷ 11 dm³ = 0.20 M (not ÷ 10 ✗)'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. 4 g of sodium hydroxide is dissolved to make 500 cubic centimetres of solution. Find its concentration. Pause the lesson and work it out.'
    write: '4 g of NaOH in 500 cm³ of solution. C = ? (M = 40 g mol⁻¹)'
  - say: '4 g divided by 40 grams per mole is 0.1 mole, and 500 cubic centimetres is 0.5 cubic decimetres. So the concentration is 0.1 divided by 0.5, which is 0.2 moles per cubic decimetre.'
    write: 'n = 0.1 mol; V = 0.5 dm³; C = 0.1 ÷ 0.5 = 0.2 mol dm⁻³'

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. Concentration is the moles divided by the volume in cubic decimetres.'
    write: '1. C = n ÷ V (V in dm³)'
    doodle_do:
      - {id: mm, op: pulse, part: solution, 'on': Concentration}
  - say: 'When water is added, C₁V₁ equals C₂V₂, with V₂ the final volume. In the next lesson, we find reacting masses and volumes from equations. Now try the problem.'
    write: '2. Dilution: C₁V₁ = C₂V₂'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: '100 cm³ of 0.50 mol dm⁻³ acid is diluted with water to 500 cm³. What is the new concentration?'
    answer: '0.10 mol dm⁻³'
    accept: ['0.1', '0.10', '0.1 mol dm-3', '0.10 mol dm-3', '0.1 M', '0.10 M', '0.1 mol/dm3']
    needs_working: true
    working:
      - 'C₁ = 0.50 mol dm⁻³, V₁ = 100 cm³, V₂ = 500 cm³'
      - 'C₂ = C₁V₁ ÷ V₂ = 0.50 × 100 ÷ 500 = 0.10 mol dm⁻³'
