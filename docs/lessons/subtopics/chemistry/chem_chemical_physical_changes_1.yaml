# Chemical and physical changes, lesson 1 of 2: physical change and chemical change defined, with worked examples on masses (ice, salt solution, burning magnesium, heating limestone), on one annotated diagram (ice melting beside magnesium burning).
format_version: 1
subject: chemistry
subtopic: 'Chemical and physical changes'
subtopic_id: de2dc2e7-3f2c-5103-82dd-3602efcec260
part: 1
title: 'Physical change and chemical change'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://edupadi.com/classroom/l/physical-and-chemical-changes
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
  - https://www.headteacher.ng/first-term-chemistry-revision-for-ss-1/
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. This is lesson one of two on chemical and physical changes: physical change and chemical change.'
    write: 'Physical change and chemical change'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'Substances change all the time. Ice melts, iron rusts, kerosene burns and cassava ferments. Every one of these is either a physical change or a chemical change.'
    write: 'Every change is physical or chemical'
  - say: 'JAMB often asks which of four changes is chemical, or which is physical. There is one simple test, and this lesson teaches it.'
    write: 'JAMB asks: which is a chemical change? which is physical?'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'By the end of this lesson you will be able to do two things. One, define a physical change and give examples.'
    write: '1. Define a physical change, with examples'
  - say: 'Two, define a chemical change and give examples.'
    write: '2. Define a chemical change, with examples'

  # ---------------------------------------------------------------- physical change
  - section: 'Physical change'
    say: 'A physical change is a change in which no new substance is formed, and which is easily reversed. Look at the left side of the picture.'
    write: 'Physical change: no new substance is formed; easily reversed'
    doodle: {name: 'custom:sub_chem_chemical_physical_changes_a', id: dia, size: scene, caption: 'physical and chemical change', 'on': physical}
    doodle_do:
      - {id: dia, op: circle, part: physical-tag, 'on': picture}
    point:
      - {line: 5, kind: underline, at: 'no new substance'}
  - say: 'Only the state, shape or size of the substance changes, and its particles stay the same. When ice melts it becomes water, and both are H₂O.'
    write: 'Only the state or form changes; ice and water are both $\ce{H2O}$'
    doodle_do:
      - {id: dia, op: pulse, part: ice, 'on': ice}
      - {id: dia, op: pulse, part: water, 'on': water}
  - say: 'Cool the water to nought degrees Celsius and it freezes back to ice. So the change is easily reversed.'
    write: 'Water freezes back to ice: easily reversed'
    doodle_do:
      - {id: dia, op: circle, part: back-arrow, 'on': freezes}
  - say: 'In a physical change the mass does not change. Melting and boiling do take in heat, but usually much less than a chemical reaction gives out or takes in.'
    write: 'No change in mass; the heat change is usually small'

  # ---------------------------------------------------------------- worked example 1
  - section: 'Worked example 1'
    say: 'Let us solve this. 10 g of ice melts completely. What mass of water is formed, and what kind of change is this?'
    write: 'Example 1: 10 g of ice melts. Mass of water? Kind of change?'
  - say: 'Step one, ask if a new substance is formed. The ice and the water are both H₂O, so no new substance is formed.'
    write: 'Step 1: new substance? ice and water are both $\ce{H2O}$, so no'
    doodle_do:
      - {id: dia, op: pulse, part: ice, 'on': ice}
  - say: 'Step two, ask if it is easily reversed. Freeze the water and the ice comes back, so yes.'
    write: 'Step 2: easily reversed? freezing gives the ice back, so yes'
    doodle_do:
      - {id: dia, op: pulse, part: back-arrow, 'on': Freeze}
  - say: 'Step three, the mass. Nothing is added and nothing escapes, so the mass stays the same.'
    write: 'Step 3: mass of water = mass of ice = 10 g'
  - say: 'Therefore 10 g of water is formed, and melting is a physical change.'
    write: '∴ 10 g of water; melting is a physical change'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_chemical_physical_changes_a2', 'on': water}

  # ---------------------------------------------------------------- worked example 2
  - section: 'Worked example 2'
    say: 'Let us solve another. 15 g of common salt is dissolved in 60 g of water. What is the mass of the solution, and what kind of change is it?'
    write: 'Example 2: 15 g of salt dissolves in 60 g of water'
  - say: 'The salt and the water are both still there, so their masses add up. 15 g plus 60 g is 75 g.'
    write: 'Mass of solution = 15 g + 60 g = 75 g'
  - say: 'Now evaporate the solution to dryness. The water leaves as steam, and 15 g of salt is left, unchanged and still salty.'
    write: 'Evaporate to dryness: 15 g of salt is left, unchanged'
  - say: 'No new substance is formed, and the salt is got back by evaporation. Therefore dissolving salt in water is a physical change.'
    write: '∴ dissolving salt in water is a physical change'

  # ---------------------------------------------------------------- chemical change
  - section: 'Chemical change'
    say: 'A chemical change is a change in which one or more new substances are formed, and which is not easily reversed. Look at the right side of the picture.'
    write: 'Chemical change: new substance(s) formed; not easily reversed'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_chemical_physical_changes_a3', 'on': chemical}
      - {id: dia, op: circle, part: chemical-tag, 'on': picture}
    point:
      - {line: 18, kind: underline, at: 'new substance(s)'}
  - say: 'The atoms rearrange into new particles with new properties. Magnesium ribbon burns in air with a bright white flame and leaves a white ash, which is magnesium oxide.'
    write: '$\ce{2Mg + O2 -> 2MgO}$'
    doodle_do:
      - {id: dia, op: pulse, part: ribbon, 'on': ribbon}
      - {id: dia, op: pulse, part: flame, 'on': flame}
      - {id: dia, op: circle, part: ash, 'on': ash}
  - say: 'The ash does not turn back into shiny magnesium when it cools. A new substance has been formed.'
    write: 'MgO is a white powder, not a shiny metal: a new substance'
    doodle_do:
      - {id: dia, op: cross, part: burn-arrow, 'on': back}
  - say: 'Matter is not created or destroyed, so the total mass stays the same. But the solid you weigh often gains or loses mass, because a gas from the air joins it or a gas given off escapes.'
    write: 'Total mass is conserved; the solid often gains or loses mass (a gas joins or escapes)'
  - say: 'A chemical change usually gives out or takes in a lot of heat. Burning gives out heat and light.'
    write: 'Usually a large heat change, often light too'
    doodle_do:
      - {id: dia, op: pulse, part: flame, 'on': light}

  # ---------------------------------------------------------------- worked example 3
  - section: 'Worked example 3'
    say: 'Let us solve this. 2.4 g of magnesium burns in air to give 4.0 g of magnesium oxide. What mass of oxygen combined, and what kind of change is it?'
    write: 'Example 3: 2.4 g of Mg burns to give 4.0 g of MgO. Mass of oxygen?'
  - say: 'The solid gained mass because oxygen from the air joined it. So the mass of oxygen is the mass of magnesium oxide minus the mass of magnesium.'
    write: 'Mass of oxygen = mass of MgO − mass of Mg'
  - say: 'Put in the numbers. 4.0 g minus 2.4 g is 1.6 g of oxygen.'
    write: '= 4.0 g − 2.4 g = 1.6 g'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_chemical_physical_changes_a4', 'on': oxygen}
  - say: 'A new substance, magnesium oxide, is formed, and the mass of the solid has changed. Therefore burning magnesium is a chemical change.'
    write: '∴ 1.6 g of oxygen combined; burning Mg is a chemical change'

  # ---------------------------------------------------------------- worked example 4
  - section: 'Worked example 4'
    say: 'Let us solve another. 10.0 g of limestone, which is CaCO₃, is heated strongly until its mass stops changing. 5.6 g of solid is left. Explain the loss in mass.'
    write: 'Example 4: 10.0 g of $\ce{CaCO3}$ is heated; 5.6 g of solid is left'
  - say: 'Heat breaks calcium trioxocarbonate(IV), or calcium carbonate, into calcium oxide, which is quicklime, and carbon(IV) oxide gas.'
    write: 'Calcium trioxocarbonate(IV) (calcium carbonate): $\ce{CaCO3 -> CaO + CO2}$'
  - say: 'The carbon(IV) oxide, or carbon dioxide, escapes into the air, so the solid loses mass. The mass of gas is 10.0 g minus 5.6 g, which is 4.4 g.'
    write: 'Mass of carbon(IV) oxide (carbon dioxide) = 10.0 g − 5.6 g = 4.4 g'
  - say: 'Two new substances are formed, and cooling does not give the limestone back. Therefore heating limestone is a chemical change.'
    write: '∴ 4.4 g of $\ce{CO2}$ escaped; a chemical change'

  # ---------------------------------------------------------------- trap
  - section: 'JAMB trap'
    say: 'A trap: the burnt magnesium gained mass, but no mass was created. The oxygen it gained came from the air, so the total mass is the same before and after.'
    write: 'Mg gains mass: oxygen from the air joined it; total mass is conserved'
    doodle_do:
      - {id: dia, op: pulse, part: mass-chemical, 'on': oxygen}

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Your turn. 5.0 g of sugar dissolves in 50 g of water. What is the mass of the solution, and what kind of change is it? Pause and decide before I go on.'
    write: '5.0 g of sugar dissolves in 50 g of water. Mass of solution? Kind of change?'
  - say: 'The sugar and the water are both still there, so 5.0 g plus 50 g is 55 g. Evaporation gives the sugar back, so no new substance is formed. It is a physical change.'
    write: '5.0 g + 50 g = 55 g; nothing new, sugar got back: physical ✓'

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. A physical change forms no new substance, is easily reversed and keeps its mass, like melting ice or dissolving salt.'
    write: '1. Physical: no new substance, easily reversed, same mass'
    doodle_do:
      - {id: dia, op: pulse, part: physical-tag, 'on': physical}
  - say: 'A chemical change forms one or more new substances and is not easily reversed, like burning magnesium or heating limestone. The total mass is conserved, but the solid often gains or loses mass. That''s the lesson. Next, lesson two: telling the two changes apart.'
    write: '2. Chemical: new substance(s), not easily reversed; solid''s mass often changes'
    doodle_do:
      - {id: dia, op: pulse, part: chemical-tag, 'on': chemical}

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: '6.4 g of copper is heated in air and forms 8.0 g of black copper(II) oxide. What mass of oxygen combined, and is this a chemical or a physical change?'
    answer: '1.6 g, chemical'
    accept: ['1.6 g chemical', '1.6g, chemical', '1.6 g; chemical change', '1.6, chemical']
    working:
      - 'mass of oxygen = mass of CuO − mass of Cu'
      - '= 8.0 g − 6.4 g = 1.6 g'
      - 'A new substance, copper(II) oxide, is formed and the solid gains mass: a chemical change.'
    needs_working: false
