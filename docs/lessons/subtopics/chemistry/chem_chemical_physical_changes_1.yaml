# Physical change (lesson 1 of 3): the big picture (every change is physical or chemical, and one question tells them apart), then what a physical change is, its mass and heat, two guided worked examples (melting ice, dissolving salt), the physical changes JAMB uses, and the dissolving trap.
format_version: 1
subject: chemistry
subtopic: 'Chemical and physical changes'
subtopic_id: de2dc2e7-3f2c-5103-82dd-3602efcec260
part: 1
title: 'Physical change'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://edupadi.com/classroom/l/physical-and-chemical-changes
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
  - https://www.headteacher.ng/first-term-chemistry-revision-for-ss-1/
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is physical change.'
    write: 'Physical change'

  # ---------------------------------------------------------------- introduction: the big picture
  - section: 'Introduction'
    say: 'Substances around you change all the time. For example, ice melts, iron rusts, kerosene burns and cassava ferments.'
    write: 'Substances change all the time'
  - say: 'Chemists sort every change into two kinds. They are physical changes and chemical changes.'
    write: 'Two kinds of change: physical and chemical'
  - say: 'One question tells the two kinds apart. Is a new substance formed, one that was not there before the change? In this lesson we look at physical changes, and in the next lesson at chemical changes.'
    write: 'The test: is a new substance formed?'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn what a physical change is, what happens to its mass, and how to recognise one.'
    write: 'Today: what a physical change is, and how to recognise one'

  # ---------------------------------------------------------------- physical change
  - section: 'Physical change'
    say: 'A physical change is a change in which no new substance is formed, and which is easily reversed.'
    write: 'Physical change: no new substance is formed; easily reversed'
    doodle: {name: 'custom:sub_chem_chemical_physical_changes_a', id: dia, size: scene, caption: 'a physical change', 'on': physical}
    point:
      - {line: 5, kind: underline, at: 'no new substance'}
  - say: 'Only the state, shape or size of the substance changes. By its state, we mean whether it is a solid, a liquid or a gas. The particles it is made of stay exactly the same.'
    write: 'Only the state, shape or size changes'
  # The pieces of the picture pop in on their words (founder, 12 Nov 2026).
  - say: 'For example, when ice melts, it becomes liquid water. Ice and liquid water are the same substance, water, H₂O.'
    write: 'Ice melts to liquid water: both are water ($\ce{H2O}$)'
    doodle_do:
      - {id: dia, op: show, part: ice, 'on': ice}
      - {id: dia, op: show, part: melt-arrow, 'on': melts}
      - {id: dia, op: show, part: water, 'on': liquid}
  - say: 'So no new substance is formed. The ice has only changed its state, from solid to liquid.'
    write: 'No new substance: only the state changed'
    doodle_do:
      - {id: dia, op: show, part: same, 'on': substance}
  - say: 'If we cool the water to nought degrees Celsius, it freezes back to ice. So the change is easily reversed.'
    write: 'Water freezes back to ice at 0 °C: easily reversed'
    doodle_do:
      - {id: dia, op: show, part: back-arrow, 'on': freezes}
  - say: 'Next, the mass. In a physical change, nothing is added to the substance and nothing escapes from it. So there is no change in mass.'
    write: 'No change in mass'
  - say: 'Last, the heat. A physical change takes in or gives out only a little heat. Melting and boiling do take in heat, but usually much less than burning a fuel gives out.'
    write: 'Heat change: usually small'

  # ---------------------------------------------------------------- worked example 1
  - section: 'Worked example 1'
    say: 'Now that we know the signs of a physical change and what happens to its mass, let us use them. We are given 10 g of ice that melts completely. We must find the mass of the water formed, and say what kind of change this is.'
    write: 'Example 1: 10 g of ice melts. Mass of water? Kind of change?'
  - say: 'To decide the kind of change, we ask two questions. Is a new substance formed, and is the change easily reversed?'
    write: 'Ask: new substance? Easily reversed?'
  - say: 'First, is a new substance formed? The ice and the water are both H₂O, so no new substance is formed.'
    write: 'New substance? Ice and water are both $\ce{H2O}$, so no'
    doodle_do:
      - {id: dia, op: pulse, part: ice, 'on': ice}
  - say: 'Next, is the change easily reversed? Freezing the water gives the ice back, so it is.'
    write: 'Easily reversed? Freezing gives the ice back, so yes'
    doodle_do:
      - {id: dia, op: pulse, part: back-arrow, 'on': Freezing}
  - say: 'Now the mass. Nothing is added and nothing escapes, so the mass of the water equals the mass of the ice, which is 10 g.'
    write: 'Mass of water = mass of ice = 10 g'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_chemical_physical_changes_a2', 'on': equals}
  - say: 'What does this tell us? 10 g of water is formed. No new substance is formed and the change is easily reversed, so melting is a physical change.'
    write: '∴ 10 g of water; melting is a physical change'
    point:
      - {line: 17, kind: circle, at: 'physical change'}

  # ---------------------------------------------------------------- worked example 2
  - section: 'Worked example 2'
    say: 'Now an example where the substance seems to disappear. 15 g of common salt is dissolved in 60 g of water. We must find the mass of the solution, and say what kind of change this is.'
    write: 'Example 2: 15 g of salt dissolves in 60 g of water. Mass of solution? Kind of change?'
  - say: 'First, the mass. Nothing is added and nothing escapes, so the mass of the solution is the mass of the salt plus the mass of the water. 15 g plus 60 g is 75 g.'
    write: 'Mass of solution = 15 g + 60 g = 75 g'
  - say: 'Next, is a new substance formed? To find out, we evaporate the solution to dryness, which means we heat it until all the water has gone. The water leaves as steam, and 15 g of salt is left, unchanged and still salty.'
    write: 'Evaporate to dryness: 15 g of salt is left, unchanged'
  - say: 'So no new substance is formed, and evaporation gives the salt back. This tells us that dissolving salt in water is a physical change.'
    write: '∴ 75 g of solution; dissolving salt is a physical change'

  # ---------------------------------------------------------------- examples
  - section: 'Examples of physical change'
    say: 'We have seen two physical changes. Here are others that JAMB often uses. First, every change of state is physical. For example, melting, freezing and boiling change only the state.'
    write: 'Changes of state: melting, freezing, boiling'
  - say: 'Sublimation is also physical. This is when a solid turns straight into a vapour, which is a gas, without melting first. Iodine does this when it is warmed, and on cooling, the vapour turns back into solid iodine.'
    write: 'Sublimation of iodine: solid to vapour, and back'
  - say: 'Magnetising a piece of iron is physical too. The iron is still iron, and it can lose its magnetism again.'
    write: 'Magnetising iron: still iron'
  - say: 'Separating a mixture by filtration, evaporation or distillation is physical as well. It only pulls apart substances that were already there, and nothing new is made.'
    write: 'Filtration, evaporation, distillation: physical'
  - say: 'At home, shea butter melts in the hot afternoon sun and sets again in the cool evening. That is a physical change.'
    write: 'Shea butter melts and sets again: physical'

  # ---------------------------------------------------------------- trap
  - section: 'JAMB trap'
    say: 'Here is a common trap. When a solid dissolves, it seems to disappear, so some students call it a chemical change. But what we can see does not decide. What matters is whether a new substance is formed, and a dissolved solid is still there, unchanged, in the water.'
    write: 'Trap: seeming to disappear is not a new substance; dissolving is physical'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. 5.0 g of sugar dissolves in 50 g of water. What is the mass of the solution, and what kind of change is it? Pause the lesson and decide before I go on.'
    write: '5.0 g of sugar dissolves in 50 g of water. Mass of solution? Kind of change?'
  - say: 'Nothing is added and nothing escapes, so the masses add up. 5.0 g plus 50 g is 55 g.'
    write: 'Mass of solution = 5.0 g + 50 g = 55 g'
  - say: 'Evaporation gives the sugar back, so no new substance is formed. It is a physical change.'
    write: 'Sugar got back, nothing new: physical ✓'
    point:
      - {line: 30, kind: circle, at: 'physical'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. A physical change forms no new substance, and it is easily reversed.'
    write: '1. Physical change: no new substance; easily reversed'
    doodle_do:
      - {id: dia, op: pulse, part: physical-tag, 'on': physical}
  - say: 'Only the state, shape or size changes, so the mass stays the same, and the heat change is usually small. In the next lesson, we look at chemical changes. Now try the problem.'
    write: '2. Only state, shape or size changes; same mass; small heat change'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: '8.0 g of common salt is dissolved in 40 g of water. What is the mass of the solution, and is this a physical or a chemical change?'
    answer: '48 g, physical'
    accept: ['48 g physical', '48g, physical', '48 g; physical change', '48, physical']
    working:
      - 'The salt and the water are both still there, so their masses add up.'
      - 'Mass of solution = 8.0 g + 40 g = 48 g'
      - 'Evaporation gives the salt back unchanged: no new substance, so a physical change.'
    needs_working: false
