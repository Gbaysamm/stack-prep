# Chemical and physical changes, lesson 2 of 2: telling them apart (new substance, reversibility, mass, heat), everyday examples and JAMB's traps, on one annotated diagram (ice melting beside magnesium burning).
format_version: 1
subject: chemistry
subtopic: 'Chemical and physical changes'
subtopic_id: de2dc2e7-3f2c-5103-82dd-3602efcec260
part: 2
title: 'Telling them apart, and the JAMB traps'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://edupadi.com/classroom/l/physical-and-chemical-changes
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
  - https://www.headteacher.ng/first-term-chemistry-revision-for-ss-1/
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. This is lesson two of two on chemical and physical changes: telling them apart, and the JAMB traps.'
    write: 'Telling physical and chemical changes apart'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson you met physical change and chemical change: ice melting on the left of the picture, magnesium burning on the right.'
    write: 'physical: no new substance; chemical: new substance(s)'
    doodle: {name: 'custom:sub_chem_chemical_physical_changes_a4', id: dia, size: scene, caption: 'physical and chemical change', 'on': picture}
  - say: 'JAMB gives four changes and asks which one is chemical, or which is physical. This lesson shows how to tell them apart.'
    write: 'JAMB asks: which is a chemical change? which is physical?'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'By the end of this lesson you will be able to do two things. One, state how the two changes differ in new substance, reversibility, mass and heat.'
    write: '1. Differences: new substance, reversibility, mass, heat'
  - say: 'Two, classify any change and spot the traps JAMB sets.'
    write: '2. Classify a change and spot the JAMB traps'

  # ---------------------------------------------------------------- more physical changes
  - section: 'Examples of physical change'
    say: 'Common physical changes are melting, freezing, boiling, dissolving, the sublimation of iodine, and magnetising a piece of iron.'
    write: 'e.g. melting, freezing, boiling, dissolving, sublimation of iodine, magnetising iron'
  - say: 'Separating a mixture by filtration, evaporation or distillation is also physical, because it only separates substances that were already there.'
    write: 'filtration, evaporation, distillation: physical'
  - say: 'At home, shea butter melts in the hot afternoon sun and sets again in the cool evening. That is a physical change.'
    write: 'shea butter melts and sets again: physical'

  # ---------------------------------------------------------------- more chemical changes
  - section: 'Examples of chemical change'
    say: 'Common chemical changes are the burning of kerosene or firewood, rusting of iron, fermentation, souring of milk, decay, and cooking food.'
    write: 'e.g. burning, rusting, fermentation, souring of milk, decay, cooking'
  - say: 'Electrolysis of water is chemical, and so are respiration, digestion and photosynthesis in living things.'
    write: 'electrolysis, respiration, digestion, photosynthesis: chemical'
  - say: 'At home, cassava is soaked and fermented to make garri and fufu, and fresh palm wine turns sour. Both make new substances, so both are chemical changes.'
    write: 'fermenting cassava, palm wine going sour: chemical'

  # ---------------------------------------------------------------- comparison
  - section: 'Comparison'
    say: 'Now compare the two sides of the picture. First, a physical change forms no new substance, but a chemical change forms one or more.'
    write: 'new substance: physical none; chemical one or more'
    doodle_do:
      - {id: dia, op: pulse, part: physical-tag, 'on': physical}
      - {id: dia, op: pulse, part: chemical-tag, 'on': chemical}
  - say: 'Second, a physical change is easily reversed, but a chemical change is not easily reversed.'
    write: 'reversed: physical easily; chemical not easily'
    doodle_do:
      - {id: dia, op: pulse, part: back-arrow, 'on': physical}
      - {id: dia, op: pulse, part: burn-arrow, 'on': chemical}
  - say: 'Third, the mass. In a physical change the substance keeps its mass. In a chemical change the total mass is kept too, but the solid often gains or loses mass as a gas joins or escapes.'
    write: 'mass: physical same; chemical: total same, solid often gains or loses'
    doodle_do:
      - {id: dia, op: pulse, part: mass-physical, 'on': physical}
      - {id: dia, op: pulse, part: mass-chemical, 'on': chemical}
  - say: 'Fourth, heat. A physical change usually takes in or gives out only a little heat, but a chemical change usually gives out or takes in a lot of heat.'
    write: 'heat: physical usually small; chemical usually large'

  # ---------------------------------------------------------------- worked example
  - section: 'Worked example'
    say: 'Let us use these differences. A platinum wire and a magnesium ribbon are each held in a flame. Which one is a chemical change?'
    write: 'Example: platinum wire and magnesium ribbon in a flame'
  - say: 'The platinum glows, then cools back to the same shiny wire with the same mass. No new substance is formed, so it is a physical change.'
    write: 'platinum: same wire, same mass: physical'
  - say: 'The magnesium burns to white magnesium oxide and gains mass. A new substance is formed, so heating magnesium is the chemical change.'
    write: 'magnesium: white MgO, gains mass: chemical ✓'
    doodle_do:
      - {id: dia, op: circle, part: ash, 'on': oxide}

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is a real JAMB question. Which of these is a chemical change? Dissolution of salt in water, rusting of iron, melting of ice, or separating a mixture by distillation.'
    write: 'Which is chemical? salt dissolving, rusting, ice melting, distillation'
  - say: 'Rusting forms a new substance. Iron, oxygen and water combine to give rust, which is hydrated iron(III) oxide. So rusting of iron is the answer.'
    write: '$\ce{4Fe + 3O2 + 2xH2O -> 2Fe2O3.xH2O}$, rust: chemical ✓'
    point:
      - {line: 19, kind: circle, at: 'chemical'}
  - say: 'The trap is dissolving salt. The salt seems to disappear, but evaporation gives it back unchanged, so it is physical. Melting and distillation make nothing new either.'
    write: 'salt dissolving, ice melting, distillation: nothing new, physical ✗'
  - say: 'Another trap is speed. Rusting is slow and dissolving is fast, but speed does not decide. Only ask if a new substance is formed.'
    write: 'slow or fast does not decide; a new substance does'
  - say: 'A burning candle shows both changes. The wax melts, which is physical. The wax vapour burns to carbon(IV) oxide and water, which is chemical.'
    write: 'candle: wax melts (physical); wax burns (chemical)'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Your turn. Which of these is a physical change? Souring of milk, burning of kerosene, sublimation of iodine, or fermentation of cassava. Pause and decide before I go on.'
    write: 'Which is physical? souring milk, burning kerosene, subliming iodine, fermenting cassava'
  - say: 'Souring, burning and fermentation all form new substances, so they are chemical changes.'
    write: 'souring, burning, fermentation: new substances, chemical ✗'
  - say: 'Iodine turns from solid to vapour, and back to solid on cooling. It is still iodine, so sublimation of iodine is the physical change.'
    write: 'sublimation of iodine: still iodine, physical ✓'
    point:
      - {line: 25, kind: circle, at: 'physical'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. A physical change forms no new substance, is easily reversed, keeps its mass and usually has a small heat change.'
    write: '1. physical: nothing new, easily reversed, same mass, small heat change'
    doodle_do:
      - {id: dia, op: pulse, part: physical-tag, 'on': physical}
  - say: 'A chemical change forms one or more new substances, is not easily reversed, usually has a large heat change, and the solid often gains or loses mass.'
    write: '2. chemical: new substance(s), not easily reversed, large heat change'
    doodle_do:
      - {id: dia, op: pulse, part: chemical-tag, 'on': chemical}
  - say: 'And for every question, ask one thing. Is a new substance formed? Then it is a chemical change. That''s the lesson. Next, try new questions on it.'
    write: '3. new substance formed? then it is chemical'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Which of these is a physical change? A. rusting of iron  B. freezing of water  C. burning of firewood  D. fermentation of palm wine'
    answer: 'B'
    accept: ['freezing of water', 'B. freezing of water', 'freezing']
    working:
      - 'Rusting forms rust, a new substance: chemical.'
      - 'Burning firewood forms ash, carbon(IV) oxide and water: chemical.'
      - 'Fermentation of palm wine forms alcohol and acids: chemical.'
      - 'Freezing turns water into ice, still $\ce{H2O}$, and melting reverses it: physical. Answer: B.'
    needs_working: false
