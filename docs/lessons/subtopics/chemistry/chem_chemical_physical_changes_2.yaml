# Chemical change (lesson 2 of 3): what a chemical change is, burning magnesium drawn a piece at a time, what happens to the total mass and to the solid's mass, two guided worked examples (burning magnesium, heating limestone), the chemical changes JAMB uses, and the gained-mass trap.
format_version: 1
subject: chemistry
subtopic: 'Chemical and physical changes'
subtopic_id: de2dc2e7-3f2c-5103-82dd-3602efcec260
part: 2
title: 'Chemical change'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://edupadi.com/classroom/l/physical-and-chemical-changes
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
  - https://www.headteacher.ng/first-term-chemistry-revision-for-ss-1/
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is chemical change.'
    write: 'Chemical change'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson, you learnt that a physical change forms no new substance. Look at the left side of the picture. Ice melts to water, and both are H₂O.'
    write: 'Last lesson: a physical change forms no new substance'
    doodle: {name: 'custom:sub_chem_chemical_physical_changes_a3', id: dia, size: scene, caption: 'physical and chemical change', 'on': picture}

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn what a chemical change is, what happens to its mass, and how to recognise one.'
    write: 'Today: what a chemical change is, and how to recognise one'

  # ---------------------------------------------------------------- chemical change
  - section: 'Chemical change'
    say: 'A chemical change is a change in which one or more new substances are formed, and which is not easily reversed.'
    write: 'Chemical change: new substance(s) formed; not easily reversed'
    doodle_do:
      - {id: dia, op: show, part: chemical-tag, 'on': chemical}
    point:
      - {line: 3, kind: underline, at: 'new substance(s)'}
  - say: 'In a chemical change, the atoms are rearranged into new particles. So the new substance has new properties.'
    write: 'Atoms rearranged: new substances with new properties'
  # The pieces of the picture pop in on their words (founder, 12 Nov 2026).
  - say: 'For example, a magnesium ribbon burns in air with a bright white flame, and it leaves a white ash.'
    write: 'Magnesium ribbon burns with a bright white flame'
    doodle_do:
      - {id: dia, op: show, part: ribbon, 'on': ribbon}
      - {id: dia, op: show, part: flame, 'on': flame}
      - {id: dia, op: show, part: ash, 'on': ash}
  - say: 'The white ash is a new substance called magnesium oxide. It forms when magnesium combines with oxygen from the air.'
    write: 'Magnesium (Mg) + oxygen ($\ce{O2}$) → magnesium oxide (MgO)'
    doodle_do:
      - {id: dia, op: show, part: new, 'on': new}
  - say: 'When it cools, the ash does not turn back into shiny magnesium. So the change is not easily reversed.'
    write: 'MgO does not turn back into Mg: not easily reversed'
    doodle_do:
      - {id: dia, op: show, part: burn-arrow, 'on': back}
  - say: 'Now the mass. In a chemical change, matter is not created or destroyed, so the total mass stays the same.'
    write: 'Total mass stays the same'
  - say: 'But the solid you weigh often gains or loses mass. It gains mass when a gas from the air joins it, and it loses mass when a gas it gives off escapes.'
    write: 'The solid often gains or loses mass: a gas joins or escapes'
  - say: 'A chemical change also usually gives out or takes in a lot of heat. For example, burning gives out heat and light.'
    write: 'Heat change: usually large; burning gives heat and light'
    doodle_do:
      - {id: dia, op: pulse, part: flame, 'on': light}

  # ---------------------------------------------------------------- worked example 1
  - section: 'Worked example 1'
    say: 'Let us use this. 2.4 g of magnesium burns in air to give 4.0 g of magnesium oxide. We must find the mass of oxygen that combined, and say what kind of change this is.'
    write: 'Example 1: 2.4 g of Mg burns to give 4.0 g of MgO. Mass of oxygen? Kind of change?'
  - say: 'The solid gained mass because oxygen from the air joined it. So the mass of oxygen is the mass of magnesium oxide minus the mass of magnesium.'
    write: 'Mass of oxygen = mass of MgO − mass of Mg'
  - say: 'Putting in the numbers, 4.0 g minus 2.4 g is 1.6 g of oxygen.'
    write: '= 4.0 g − 2.4 g = 1.6 g'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_chemical_physical_changes_a4', 'on': numbers}
  - say: 'What does this tell us? 1.6 g of oxygen combined, and a new substance, magnesium oxide, was formed. So burning magnesium is a chemical change.'
    write: '∴ 1.6 g of oxygen; burning Mg is a chemical change'
    point:
      - {line: 14, kind: circle, at: 'chemical change'}

  # ---------------------------------------------------------------- worked example 2
  - section: 'Worked example 2'
    say: 'Now a solid that loses mass. 10.0 g of limestone, which is calcium trioxocarbonate(IV), is heated strongly until its mass stops changing. 5.6 g of solid is left. We must explain the loss in mass.'
    write: 'Example 2: 10.0 g of limestone, calcium trioxocarbonate(IV) ($\ce{CaCO3}$), is heated; 5.6 g is left'
  - say: 'Heat breaks calcium trioxocarbonate(IV) into two new substances. They are calcium oxide, which is quicklime, and carbon(IV) oxide gas.'
    write: 'Calcium trioxocarbonate(IV) → calcium oxide + carbon(IV) oxide'
  - say: 'Carbon(IV) oxide is also called carbon dioxide. It is a gas, so it escapes into the air, and the solid loses mass.'
    write: 'Carbon(IV) oxide ($\ce{CO2}$) escapes, so the solid loses mass'
  - say: 'The mass of gas that escaped is 10.0 g minus 5.6 g, which is 4.4 g.'
    write: 'Mass of $\ce{CO2}$ = 10.0 g − 5.6 g = 4.4 g'
  - say: 'What does this tell us? New substances are formed, and cooling does not give the limestone back. So heating limestone is a chemical change.'
    write: '∴ 4.4 g of $\ce{CO2}$ escaped; a chemical change'

  # ---------------------------------------------------------------- examples
  - section: 'Examples of chemical change'
    say: 'We have seen two chemical changes. Here are others that JAMB uses. Burning kerosene or firewood is chemical, and so is the rusting of iron.'
    write: 'Burning and rusting: chemical'
  - say: 'Fermentation, the souring of milk, decay and cooking food are chemical too, because each forms new substances.'
    write: 'Fermentation, souring of milk, decay, cooking: chemical'
  - say: 'In living things, respiration, digestion and photosynthesis are chemical changes. Splitting water by electrolysis is also chemical.'
    write: 'Respiration, digestion, photosynthesis, electrolysis: chemical'
  - say: 'At home, cassava is soaked and fermented to make garri and fufu, and fresh palm wine turns sour. Both make new substances, so both are chemical changes.'
    write: 'Fermenting cassava, palm wine going sour: chemical'

  # ---------------------------------------------------------------- trap
  - section: 'JAMB trap'
    say: 'Here is a common trap. The burnt magnesium gained mass, so some students think that mass was created. It was not. The oxygen it gained came from the air, so the total mass is the same before and after.'
    write: 'Mg gains mass: oxygen from the air joined it; total mass is conserved'
    doodle_do:
      - {id: dia, op: pulse, part: mass-chemical, 'on': oxygen}

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. 5.0 g of calcium trioxocarbonate(IV) is heated strongly, and 2.8 g of solid is left. What mass of gas escaped, and what kind of change is it? Pause the lesson and work it out.'
    write: '5.0 g of $\ce{CaCO3}$ is heated; 2.8 g of solid is left. Mass of gas? Kind of change?'
  - say: 'The gas that escaped is carbon(IV) oxide. Its mass is 5.0 g minus 2.8 g, which is 2.2 g.'
    write: 'Mass of $\ce{CO2}$ = 5.0 g − 2.8 g = 2.2 g'
  - say: 'New substances are formed, so it is a chemical change.'
    write: 'New substances formed: chemical ✓'
    point:
      - {line: 27, kind: circle, at: 'chemical'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. A chemical change forms one or more new substances, and it is not easily reversed.'
    write: '1. Chemical change: new substance(s); not easily reversed'
    doodle_do:
      - {id: dia, op: pulse, part: chemical-tag, 'on': chemical}
  - say: 'The total mass stays the same, but the solid often gains or loses mass as a gas joins or escapes. In the next lesson, we will tell the two kinds of change apart. Now try the problem.'
    write: '2. Total mass kept; the solid often gains or loses mass'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: '6.4 g of copper is heated in air and forms 8.0 g of black copper(II) oxide. What mass of oxygen combined, and is this a chemical or a physical change?'
    answer: '1.6 g, chemical'
    accept: ['1.6 g chemical', '1.6g, chemical', '1.6 g; chemical change', '1.6, chemical']
    working:
      - 'Mass of oxygen = mass of copper(II) oxide − mass of copper'
      - '= 8.0 g − 6.4 g = 1.6 g'
      - 'A new substance, copper(II) oxide, is formed and the solid gains mass: a chemical change.'
    needs_working: false
