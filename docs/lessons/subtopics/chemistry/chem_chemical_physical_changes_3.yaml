# Telling physical and chemical changes apart (lesson 3 of 3): the four differences named and then taught one at a time, the platinum and magnesium example, a real JAMB question with its traps (dissolving, speed, the candle), on the whole picture (ice melting beside magnesium burning).
format_version: 1
subject: chemistry
subtopic: 'Chemical and physical changes'
subtopic_id: de2dc2e7-3f2c-5103-82dd-3602efcec260
part: 3
title: 'Telling physical and chemical changes apart'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://edupadi.com/classroom/l/physical-and-chemical-changes
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
  - https://www.headteacher.ng/first-term-chemistry-revision-for-ss-1/
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is telling physical and chemical changes apart.'
    write: 'Telling physical and chemical changes apart'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'You have now met both kinds of change. Look at the picture. Ice melting on the left is a physical change, and magnesium burning on the right is a chemical change.'
    write: 'Ice melting: physical. Magnesium burning: chemical'
    doodle: {name: 'custom:sub_chem_chemical_physical_changes_b', id: dia, size: scene, caption: 'physical and chemical change', 'on': picture}
  - say: 'JAMB often gives four changes and asks which one is chemical, or which one is physical. So in this lesson we put the two kinds side by side.'
    write: 'JAMB asks: which change is chemical, or which is physical?'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'You will learn the four ways the two changes differ, and how to answer the JAMB questions on them.'
    write: 'Today: the four differences, and the JAMB questions'

  # ---------------------------------------------------------------- comparison
  # The list named first, then each difference in its own moment (founder, 12 Nov 2026).
  - section: 'Comparison'
    say: 'The two kinds of change differ in four ways. They are new substance, reversibility, mass and heat.'
    write: 'Four differences: new substance, reversibility, mass, heat'
  - say: 'First, a new substance. A physical change forms no new substance, but a chemical change forms one or more.'
    write: 'New substance: physical, none; chemical, one or more'
    doodle_do:
      - {id: dia, op: pulse, part: physical-tag, 'on': physical}
      - {id: dia, op: pulse, part: chemical-tag, 'on': chemical}
  - say: 'Second, reversibility. A physical change is easily reversed, but a chemical change is not easily reversed.'
    write: 'Reversed: physical, easily; chemical, not easily'
    doodle_do:
      - {id: dia, op: pulse, part: back-arrow, 'on': physical}
      - {id: dia, op: pulse, part: burn-arrow, 'on': chemical}
  - say: 'Third, mass. In a physical change the substance keeps its mass. In a chemical change the total mass is kept too, but the solid often gains or loses mass as a gas joins or escapes.'
    write: 'Mass: physical, same; chemical, total same but the solid often changes'
    doodle_do:
      - {id: dia, op: pulse, part: mass-physical, 'on': physical}
      - {id: dia, op: pulse, part: mass-chemical, 'on': chemical}
  - say: 'Fourth, heat. A physical change usually takes in or gives out only a little heat, but a chemical change usually gives out or takes in a lot.'
    write: 'Heat: physical, usually small; chemical, usually large'
  - say: 'Of the four, the first one always decides. If a new substance is formed, the change is chemical.'
    write: 'New substance formed? Then it is chemical'
    point:
      - {line: 9, kind: underline, at: 'New substance formed'}

  # ---------------------------------------------------------------- worked example
  - section: 'Worked example'
    say: 'Let us use these differences. A platinum wire and a magnesium ribbon are each held in a flame. We must find which of them goes through a chemical change.'
    write: 'Example: platinum wire and magnesium ribbon in a flame. Which is chemical?'
  - say: 'The platinum glows, then cools back to the same shiny wire with the same mass. No new substance is formed, so it is a physical change.'
    write: 'Platinum: same wire, same mass, so physical'
  - say: 'The magnesium burns to white magnesium oxide and gains mass. A new substance is formed, so heating magnesium is the chemical change.'
    write: 'Magnesium: white magnesium oxide (MgO), gains mass, so chemical ✓'
    doodle_do:
      - {id: dia, op: circle, part: ash, 'on': oxide}

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is a real JAMB question. Which of these is a chemical change? Is it dissolution of salt in water, rusting of iron, melting of ice, or separating a mixture by distillation?'
    write: 'Which is chemical? Salt dissolving, rusting, ice melting or distillation'
  - say: 'Rusting forms a new substance. Iron, oxygen and water combine to give rust, which is hydrated iron(III) oxide. So rusting of iron is the answer.'
    write: 'Iron + oxygen + water → rust: $\ce{4Fe + 3O2 + 2xH2O -> 2Fe2O3.xH2O}$, chemical ✓'
    point:
      - {line: 14, kind: circle, at: 'chemical'}
  - say: 'The trap is dissolving salt. The salt seems to disappear, but evaporation gives it back unchanged, so it is physical. Melting and distillation make nothing new either.'
    write: 'Salt dissolving, ice melting, distillation: nothing new, physical ✗'
  - say: 'Another trap is speed. Rusting is slow and dissolving is fast, but speed does not decide. Just ask whether a new substance is formed.'
    write: 'Slow or fast does not decide; a new substance does'
  - say: 'A burning candle shows both kinds of change at once. First, the wax melts, and that is a physical change.'
    write: 'Candle: the wax melts (physical)'
  - say: 'Then the wax vapour burns to carbon(IV) oxide and water. These are new substances, so that is a chemical change.'
    write: 'Wax vapour burns to carbon(IV) oxide and water (chemical)'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Which of these is a physical change? Is it souring of milk, burning of kerosene, sublimation of iodine, or fermentation of cassava? Pause the lesson and decide before I go on.'
    write: 'Which is physical? Souring milk, burning kerosene, subliming iodine or fermenting cassava'
  - say: 'Souring, burning and fermentation all form new substances, so they are chemical changes.'
    write: 'Souring, burning, fermentation: new substances, chemical ✗'
  - say: 'Iodine turns from solid to vapour, and back to solid on cooling. It is still iodine, so sublimation of iodine is the physical change.'
    write: 'Sublimation of iodine: still iodine, physical ✓'
    point:
      - {line: 21, kind: circle, at: 'physical'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. A physical change forms no new substance, is easily reversed, keeps its mass and usually has a small heat change.'
    write: '1. Physical: nothing new, easily reversed, same mass, small heat change'
    doodle_do:
      - {id: dia, op: pulse, part: physical-tag, 'on': physical}
  - say: 'A chemical change forms one or more new substances, is not easily reversed, usually has a large heat change, and the solid often gains or loses mass.'
    write: '2. Chemical: new substance(s), not easily reversed, large heat change'
    doodle_do:
      - {id: dia, op: pulse, part: chemical-tag, 'on': chemical}
  - say: 'For every question, ask one thing. Is a new substance formed? If it is, the change is chemical. Now try the problem.'
    write: '3. New substance formed? Then it is chemical'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Which of these is a physical change? A. rusting of iron  B. freezing of water  C. burning of firewood  D. fermentation of palm wine'
    answer: 'B'
    accept: ['freezing of water', 'B. freezing of water', 'freezing']
    working:
      - 'Rusting forms rust, a new substance: chemical.'
      - 'Burning firewood forms ash, carbon(IV) oxide and water: chemical.'
      - 'Fermentation of palm wine forms alcohol and acids: chemical.'
      - 'Freezing turns water into ice, still H₂O, and melting reverses it: physical. Answer: B.'
    needs_working: false
