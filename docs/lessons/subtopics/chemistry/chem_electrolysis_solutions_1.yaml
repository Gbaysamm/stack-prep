# Electrolysis of brine: ions, electrodes and products in a graphite-electrode cell.
format_version: 1
subject: chemistry
subtopic: 'Electrolysis of solutions and the factors that decide products'
subtopic_id: 0c67e944-9123-5004-b8fd-88283badbb40
part: 1
title: 'Electrolysis of brine: what forms at each electrode'
sources:
  - https://jambsyllabus.pages.dev/chemistry/
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
moments:
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is electrolysis of brine and what forms at each electrode.'
    write: 'Electrolysis of brine: products at the electrodes'

  - section: 'Introduction'
    say: 'Electrolysis uses electrical energy to cause a chemical change in a substance that conducts electricity through moving ions.'
    write: 'Electrolysis: electrical energy causes a chemical change'

  - say: 'Brine is a solution of sodium chloride in water. In this lesson, we use concentrated brine.'
    write: 'Concentrated brine: sodium chloride ($\ce{NaCl}$) solution'

  # PICTURE NEEDED: An electrolytic cell with a battery, connecting wires, two graphite electrodes dipping into concentrated brine, labelled cathode and anode, moving ions and bubbles of hydrogen and chlorine.
  - say: 'An electrolytic cell has two graphite electrodes dipped into the brine and connected by wires to a battery. An electrode conducts electricity into or out of the solution.'
    write: 'Cell: battery, two graphite electrodes and brine'

  - say: 'The cathode is the electrode connected to the negative terminal of the battery.'
    write: 'Cathode: negative electrode'

  - say: 'The anode is the electrode connected to the positive terminal of the battery.'
    write: 'Anode: positive electrode'

  - section: 'Objectives'
    say: 'By the end of this lesson, you will be able to identify the ions in brine and explain the products at each electrode.'
    write: '1. Identify the ions in brine.  2. Explain the electrode products.'

  - section: 'Ions in brine'
    say: 'Sodium chloride dissolves to give positive sodium ions and negative chloride ions.'
    write: 'Sodium ions ($\ce{Na+}$); chloride ions ($\ce{Cl-}$)'

  # H+ is the usual school-level shorthand for hydrated hydrogen ions in water.
  - say: 'Water also supplies small amounts of positive hydrogen ions and negative hydroxide ions.'
    write: 'Hydrogen ions ($\ce{H+}$); hydroxide ions ($\ce{OH-}$)'

  - say: 'An ion is a charged particle. The plus sign shows a positive charge, and the minus sign shows a negative charge.'
    write: 'Ion: a charged particle; plus is positive, minus is negative'

  - section: 'Worked example'
    say: 'Let us use those charges. Which ions move towards each electrode in concentrated brine? Opposite charges attract.'
    write: 'Which ions move towards each electrode?'

  - say: 'The positive sodium ions and hydrogen ions move towards the negative cathode.'
    write: 'Cathode: $\ce{Na+}$ and $\ce{H+}$'

  - say: 'The negative chloride ions and hydroxide ions move towards the positive anode.'
    write: 'Anode: $\ce{Cl-}$ and $\ce{OH-}$'

  - say: 'More than one kind of ion reaches each electrode, so we must decide which substance forms at each one.'
    write: 'At each electrode, ions compete for discharge'

  - say: 'At an electrode, ions can gain or lose electrons. This is called discharge. An electron is a negatively charged particle.'
    write: 'Discharge: ions gain or lose electrons at an electrode'

  - say: 'We represent an electron by the symbol shown on the board. Gaining electrons is called reduction, and losing electrons is called oxidation.'
    write: 'Electron: $\ce{e-}$. Reduction: gain; oxidation: loss'

  - section: 'Cathode'
    say: 'Let us solve the product question. What forms at the cathode when concentrated brine is electrolysed using graphite electrodes?'
    write: 'Concentrated brine: what forms at the cathode?'

  - say: 'Sodium is more reactive than hydrogen. In this aqueous solution, hydrogen is discharged in preference to sodium.'
    write: 'Sodium is more reactive; hydrogen is discharged'

  - say: 'The product is hydrogen gas. Its formula shows that each molecule contains two hydrogen atoms.'
    write: 'Cathode product: hydrogen gas ($\ce{H2}$)'

  - say: 'At the cathode, water molecules gain electrons to form hydrogen gas and hydroxide ions. The gain of electrons is reduction.'
    write: 'Cathode: water gains electrons; reduction'

  - say: 'The balanced equation shows two H₂O molecules gaining two electrons to form one H₂ molecule and two OH⁻ ions.'
    write: '$\ce{2H2O + 2e- -> H2 + 2OH-}$'

  - section: 'Anode'
    say: 'Now let us find the anode product. Chloride and hydroxide ions both reach the anode.'
    write: 'Anode: chloride and hydroxide ions compete'

  - say: 'With concentrated brine and graphite electrodes, chloride ions are discharged in preference to hydroxide ions.'
    write: 'Concentrated brine: chloride ions are discharged'

  - say: 'The product is chlorine gas. Each chlorine molecule contains two chlorine atoms.'
    write: 'Anode product: chlorine gas ($\ce{Cl2}$)'

  - say: 'Chloride ions lose electrons at the anode. This loss of electrons is oxidation.'
    write: 'Anode: chloride ions lose electrons; oxidation'

  - say: 'In the balanced equation, two chloride ions lose two electrons and form one chlorine molecule.'
    write: '$\ce{2Cl- -> Cl2 + 2e-}$'

  - say: 'So the gases are hydrogen at the cathode and chlorine at the anode.'
    write: 'Cathode: $\ce{H2}$. Anode: $\ce{Cl2}$.'

  - section: 'JAMB traps'
    say: 'Here is a JAMB-style question. Are the gases hydrogen and chlorine, chlorine and hydrogen, or sodium and chlorine, in cathode to anode order?'
    write: 'Cathode → anode: A. $\ce{H2}$, $\ce{Cl2}$; B. $\ce{Cl2}$, $\ce{H2}$; C. Na, $\ce{Cl2}$'

  - say: 'Option B reverses the electrodes. Chloride ions move to the positive anode, not to the negative cathode.'
    write: 'B: electrodes reversed ✗'

  - say: 'Option C assumes that sodium is discharged at the cathode. In brine, hydrogen is discharged in preference to sodium.'
    write: 'C: sodium is not the cathode product ✗'

  - say: 'Option A is correct. Hydrogen forms at the cathode and chlorine forms at the anode.'
    write: 'A: $\ce{H2}$ at cathode, $\ce{Cl2}$ at anode ✓'

  - section: 'Check yourself'
    say: 'Now it is your turn. Which ion loses electrons at the anode in concentrated brine? Pause and decide.'
    write: 'Which ion loses electrons at the anode?'

  - say: 'The chloride ion loses electrons at the anode, producing chlorine gas. Loss of electrons is oxidation.'
    write: 'Chloride ion ($\ce{Cl-}$): oxidised at the anode ✓'

  - section: 'Recap'
    say: 'Let us recap. Brine contains sodium, hydrogen, chloride and hydroxide ions. Positive ions move to the cathode, and negative ions move to the anode.'
    write: '1. Positive ions → cathode; negative ions → anode'

  - say: 'With concentrated brine and graphite electrodes, hydrogen forms by reduction at the cathode, while chlorine forms by oxidation at the anode. Now try the problem.'
    write: '2. Cathode: $\ce{H2}$, reduction. Anode: $\ce{Cl2}$, oxidation.'

problems:
  - ask: 'Concentrated brine is electrolysed using graphite electrodes. Which gas forms at the cathode?'
    answer: 'Hydrogen'
    accept: ['hydrogen gas', 'H2', 'H₂']
    working:
      - 'Sodium and hydrogen ions move towards the negative cathode.'
      - 'Hydrogen is discharged in preference to sodium in aqueous brine.'
      - 'The gas formed at the cathode is hydrogen, H₂.'
    needs_working: false
