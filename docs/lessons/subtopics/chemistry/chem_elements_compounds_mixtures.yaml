# Elements, compounds and mixtures: definitions, how to tell them apart, everyday examples and JAMB's traps, on one annotated particle diagram.
format_version: 1
subject: chemistry
subtopic: 'Elements, compounds and mixtures'
subtopic_id: 4657fe1f-0818-5df4-b5ce-36b724e9b42a
sources:            # pages consulted for the approach, for reviewers
  - https://jambsyllabus.pages.dev/chemistry/
  - https://edupadi.com/classroom/l/classification-of-matter
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
  - https://www.headteacher.ng/first-term-chemistry-revision-for-ss-1/
  - https://syllabus.ng/ss1-scheme-of-work/chemistry/
  - https://www.vedantu.com/chemistry/difference-between-compound-and-mixture
  - https://www.pearson.com/channels/general-chemistry/asset/18025671/which-of-the-following-is-a-mixture
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is elements, compounds and mixtures.'
    write: 'Elements, compounds and mixtures'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'Every substance around you, the air, the water you drink, the salt in your food, is an element, a compound or a mixture.'
    write: 'every substance is an element, a compound or a mixture'
  - say: 'JAMB asks you to tell them apart, often as which of these is a mixture. It is also the first step before separating mixtures.'
    write: 'JAMB asks: which is a mixture? how do they differ?'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'By the end of this lesson you will be able to do four things. One, define an element, a compound and a mixture.'
    write: '1. Define an element, a compound and a mixture'
  - say: 'Two, tell a compound from a mixture by its composition, its properties and how it is separated.'
    write: '2. Tell them apart: composition, properties, separation'
  - say: 'Three, tell homogeneous mixtures from heterogeneous ones, with everyday examples.'
    write: '3. Homogeneous and heterogeneous mixtures'
  - say: 'Four, spot the traps JAMB sets on this topic.'
    write: '4. Spot the JAMB traps'

  # ---------------------------------------------------------------- element
  - section: 'Element'
    say: 'An element is a pure substance that cannot be split into anything simpler by chemical means. Look at the box. All its atoms are of one kind, here sodium.'
    write: 'Element: cannot be split into simpler substances by chemical means'
    doodle: {name: 'custom:sub_chem_elements_compounds_mixtures_a', id: dia, size: scene, caption: 'element, compound, mixture', 'on': box}
    doodle_do:
      - {id: dia, op: circle, part: element-tag, 'on': element}
      - {id: dia, op: pulse, part: element-box, 'on': box}
    point:
      - {line: 7, kind: underline, at: 'cannot be split'}
  - say: 'Sodium, chlorine, iron, copper, gold and carbon are elements. So is the aluminium in a cooking pot.'
    write: 'e.g. Na, Cl, Fe, Cu, Au, C, Al'
  - say: 'Careful. Oxygen gas is O two, and nitrogen gas is N two. Each molecule has two atoms, but both are the same kind, so these gases are still elements.'
    write: '$\ce{O2}$, $\ce{N2}$, $\ce{Cl2}$ are elements, not compounds'
    doodle_do:
      - {id: dia, op: pulse, part: element-box, 'on': same}

  # ---------------------------------------------------------------- compound
  - section: 'Compound'
    say: 'A compound is two or more elements chemically combined in a fixed ratio by mass.'
    write: 'Compound: elements chemically combined in a fixed ratio'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_elements_compounds_mixtures_a2', 'on': compound}
  - say: 'Look at the second box. Each particle is a sodium atom joined to a chlorine atom. Sodium burns in chlorine to form sodium chloride, which is table salt.'
    write: '$\ce{2Na + Cl2 -> 2NaCl}$'
    doodle_do:
      - {id: dia, op: pulse, part: compound-box, 'on': joined}
  - say: 'The composition is fixed. Sodium chloride always has one sodium to one chlorine. Water always has two hydrogen atoms to one oxygen, which is one to eight by mass.'
    write: 'fixed composition: NaCl is 1 : 1; in $\ce{H2O}$, H : O = 1 : 8 by mass'
    doodle_do:
      - {id: dia, op: circle, part: compound-tag, 'on': always}
    point:
      - {line: 12, kind: circle, at: 'fixed composition'}
  - say: 'Because the composition is fixed, every compound has a chemical formula. Pure water from Kano or from Lagos is always H two O.'
    write: 'a compound has a formula, e.g. NaCl, $\ce{H2O}$, $\ce{CO2}$'
  - say: 'A compound has new properties. Sodium is a soft metal that reacts violently with water. Chlorine is a poisonous greenish yellow gas. Sodium chloride is the white salt we eat.'
    write: 'new properties, unlike those of its elements'
  - say: 'A compound can be split only by chemical means. Electrolysis of molten sodium chloride gives back sodium and chlorine. Stirring, filtering or boiling never will.'
    write: 'separated only by chemical means, e.g. electrolysis'
    doodle_do:
      - {id: dia, op: pulse, part: compound-box, 'on': Electrolysis}

  # ---------------------------------------------------------------- mixture
  - section: 'Mixture'
    say: 'A mixture is two or more substances put together without chemical combination. In the third box, salt and water particles sit side by side, but they are not joined.'
    write: 'Mixture: substances together, not chemically combined'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_elements_compounds_mixtures_a3', 'on': mixture}
      - {id: dia, op: pulse, part: salt, 'on': salt}
      - {id: dia, op: pulse, part: water, 'on': water}
  - say: 'A mixture has no fixed composition. One spoon of salt or five, it is still salt water. So a mixture has no chemical formula.'
    write: 'no fixed composition, so no formula'
    doodle_do:
      - {id: dia, op: circle, part: mixture-tag, 'on': composition}
  - say: 'Each part of a mixture keeps its own properties. Salt water tastes salty, because the salt is still salt.'
    write: 'each part keeps its own properties'
  - say: 'So a mixture can be separated by physical means. Boil the salt water, and the water leaves as steam while the salt is left behind. That is evaporation.'
    write: 'separated by physical means, e.g. evaporation'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_elements_compounds_mixtures_a4', 'on': Boil}
      - {id: dia, op: cross, part: water, 'on': steam}
      - {id: dia, op: circle, part: salt, 'on': left}
  - say: 'A pure substance melts and boils at one sharp temperature. Pure water boils at one hundred degrees Celsius at sea level, but salt water boils higher.'
    write: 'pure substance: sharp melting and boiling points; mixture: not sharp'

  # ---------------------------------------------------------------- two kinds
  - section: 'Homogeneous and heterogeneous'
    say: 'In salt water the salt is spread evenly, and you cannot see it at all. That is a homogeneous mixture, which means the same all through.'
    write: 'homogeneous: the same all through, e.g. salt water, sea water, air'
    doodle_do:
      - {id: dia, op: pulse, part: mixture-box, 'on': evenly}
  - say: 'In a heterogeneous mixture you can see the different parts. Garri sinks in cold water, palm oil floats on water as a layer, and blood separates in a centrifuge.'
    write: 'heterogeneous: parts you can see, e.g. garri and water, oil on water, blood'

  # ---------------------------------------------------------------- comparison
  - section: 'Comparison'
    say: 'Now compare the three boxes. An element has one kind of atom. A compound has different atoms chemically joined. A mixture has different substances that are not joined.'
    write: 'element: one kind of atom; compound: joined; mixture: not joined'
    doodle_do:
      - {id: dia, op: pulse, part: element-box, 'on': element}
      - {id: dia, op: pulse, part: compound-box, 'on': compound}
      - {id: dia, op: pulse, part: mixture-box, 'on': mixture}
  - say: 'A compound has a fixed composition, a formula and new properties, and is separated only by chemical means. A mixture varies, keeps its properties, and separates by physical means.'
    write: 'compound: fixed, formula, chemical means; mixture: variable, physical means'

  # ---------------------------------------------------------------- everyday
  - section: 'Everyday mixtures'
    say: 'Air is a mixture of nitrogen, oxygen, argon, carbon four oxide and water vapour. Its make-up changes from place to place, and liquid air is separated by fractional distillation.'
    write: 'air = $\ce{N2}$ + $\ce{O2}$ + Ar + $\ce{CO2}$ + water vapour'
  - say: 'Crude oil, or petroleum, is a mixture of many hydrocarbons. Even petrol and kerosene, the fractions we buy, are each a mixture and not a single compound.'
    write: 'petroleum, petrol, kerosene = mixtures of hydrocarbons'
  - say: 'Alloys are metals melted and mixed together. Brass is copper and zinc, bronze is copper and tin, and steel is iron and carbon. Every alloy is a mixture.'
    write: 'alloys are mixtures: brass (Cu + Zn), bronze (Cu + Sn), steel (Fe + C)'
    doodle_do:
      - {id: dia, op: pulse, part: mixture-box, 'on': alloy}

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is a real JAMB question. Which of these are mixtures? Petroleum, rubber latex, vulcaniser''s solution and carbon four sulphide.'
    write: 'Which are mixtures? petroleum, rubber latex, vulcaniser''s solution, $\ce{CS2}$'
  - say: 'Petroleum is many hydrocarbons, rubber latex is rubber in water, and vulcaniser''s solution is rubber dissolved in a solvent. All three are mixtures.'
    write: 'petroleum, latex, vulcaniser''s solution = mixtures ✓'
  - say: 'The trap is carbon four sulphide. It is a liquid, but it has a formula, C S two, so it is a compound, not a mixture.'
    write: '$\ce{CS2}$ has a formula, so it is a compound ✗'
    point:
      - {line: 30, kind: circle, at: 'compound'}
  - say: 'Another trap. Washing soda and table salt have formulae, so they are compounds. Clean sand is mostly silicon four oxide, S i O two, so treat it as a compound.'
    write: 'washing soda, salt, sand ($\ce{SiO2}$) = compounds'
  - say: 'A last trap. A mixture is not always homogeneous, and it has no formula. A compound does not keep its elements'' properties. Cross out any option that says otherwise.'
    write: 'mixture: not always uniform, no formula; compound: new properties'
    point:
      - {line: 32, kind: underline, at: 'not always uniform'}

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Your turn. Which of these is a mixture? Distilled water, oxygen gas, carbon four sulphide, or brass. Pause and decide before I go on.'
    write: 'Which is a mixture? distilled water, oxygen, $\ce{CS2}$, brass'
  - say: 'Distilled water is H two O, a compound with a formula. Oxygen gas has one kind of atom, so it is an element. Carbon four sulphide is a compound.'
    write: 'water, $\ce{CS2}$ = compounds; oxygen = element ✗'
    doodle_do:
      - {id: dia, op: pulse, part: compound-box, 'on': formula}
      - {id: dia, op: pulse, part: element-box, 'on': element}
  - say: 'Brass is copper and zinc mixed, with no formula and no fixed composition. So brass is the mixture.'
    write: 'brass = mixture ✓'
    doodle_do:
      - {id: dia, op: circle, part: mixture-tag, 'on': mixture}
    point:
      - {line: 35, kind: circle, at: 'mixture'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. An element has one kind of atom. A compound is elements chemically combined in a fixed ratio. A mixture is substances together, not chemically combined.'
    write: '1. element: one kind of atom; compound: combined, fixed ratio; mixture: not combined'
    doodle_do:
      - {id: dia, op: pulse, part: element-tag, 'on': element}
      - {id: dia, op: pulse, part: compound-tag, 'on': compound}
      - {id: dia, op: pulse, part: mixture-tag, 'on': mixture}
  - say: 'A compound has a fixed composition, a formula and new properties, and needs chemical means to separate. A mixture keeps its properties and separates by physical means.'
    write: '2. compound: formula, new properties, chemical means; mixture: physical means'
  - say: 'A homogeneous mixture is the same all through, like salt water or air. A heterogeneous mixture shows its parts, like garri in water.'
    write: '3. homogeneous: salt water, air; heterogeneous: garri and water'
  - say: 'And for the traps, ask one question. Does it have a formula? Then it is a compound, not a mixture. That''s the lesson. Next, try new questions on it.'
    write: '4. has a formula? then not a mixture'
