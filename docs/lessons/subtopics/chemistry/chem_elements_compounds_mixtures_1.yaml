# Elements (lesson 1 of 5): the big picture of matter drawn first, then what an element is, its symbol, molecules and the small number in a formula, each taught before it is used.
format_version: 1
subject: chemistry
subtopic: 'Elements, compounds and mixtures'
subtopic_id: 4657fe1f-0818-5df4-b5ce-36b724e9b42a
part: 1
title: 'Elements'
sources:            # pages consulted for the approach, for reviewers
  - https://jambsyllabus.pages.dev/chemistry/
  - https://syllabus.ng/jamb/chemistry
  - https://edupadi.com/classroom/l/classification-of-matter
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
  - https://www.headteacher.ng/first-term-chemistry-revision-for-ss-1/
  - https://syllabus.ng/ss1-scheme-of-work/chemistry/
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is elements.'
    write: 'Elements'

  # ---------------------------------------------------------------- introduction: the big picture, drawn
  - section: 'Introduction'
    say: 'Everything around you is matter. The air, the water you drink and the salt in your food are all examples of matter.'
    write: 'Matter: everything around you'
    doodle: {name: 'custom:sub_chem_elements_compounds_mixtures_m', id: mat, size: scene, caption: 'matter around you', 'on': matter}
    doodle_do:
      - {id: mat, op: show, part: air, 'on': air}
      - {id: mat, op: show, part: water, 'on': water}
      - {id: mat, op: show, part: salt, 'on': salt}
  - say: 'All of these, and everything else, are made of very tiny particles called atoms. They are so small that they cannot be seen, even with a hand lens.'
    write: 'All matter is made of tiny particles called atoms'
    doodle_do:
      - {id: mat, op: stage, stage: 'custom:sub_chem_elements_compounds_mixtures_m2', 'on': atoms}
  # The three kinds named first, then each explained with its picture brought in as it is
  # explained (founder, 12 Nov 2026).
  - say: 'Chemists sort every substance into three kinds. They are elements, compounds and mixtures.'
    write: 'Three kinds: element, compound, mixture'
  - say: 'In an element, every atom is the same kind.'
    doodle: {name: 'custom:sub_chem_elements_compounds_mixtures_a', id: dia, size: scene, caption: 'three kinds of substance', 'on': element}
  - say: 'In a compound, different atoms are joined together.'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_elements_compounds_mixtures_a2', 'on': compound}
  - say: 'In a mixture, different substances are only mixed, not joined.'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_elements_compounds_mixtures_a3', 'on': mixture}

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn what an element is, how its symbol and formula are written, and how to tell whether a substance is an element.'
    write: 'Today: what an element is, and how to recognise one'

  # ---------------------------------------------------------------- element
  - section: 'Element'
    say: 'Let us start with elements. An element is a substance that cannot be split into two or more simpler substances by chemical means.'
    write: 'Element: cannot be split into simpler substances by chemical means'
    doodle_do:
      - {id: dia, op: pulse, part: element-box, 'on': elements}
    point:
      - {line: 8, kind: underline, at: 'cannot be split'}
  - say: 'In other words, no chemical change can break an element down into anything simpler. Gold stays gold, and sulphur stays sulphur.'
    write: 'No chemical change breaks it into anything simpler'
  - say: 'This is because all the atoms in an element are of one kind. Look at the first box. Every atom in it is a sodium atom.'
    write: 'All its atoms are of one kind'
    doodle_do:
      - {id: dia, op: circle, part: element-tag, 'on': kind}
      - {id: dia, op: pulse, part: element-box, 'on': box}
  - section: 'Symbols and formulae'
    say: 'Each element has a symbol of one or two letters. For example, the symbol for sodium is Na, for iron Fe, for copper Cu and for carbon C.'
    write: 'Symbols: sodium (Na), iron (Fe), copper (Cu), carbon (C)'
  - say: 'Some elements exist as molecules, which are small groups of atoms joined together. For example, oxygen gas is made of molecules, and each one is two oxygen atoms joined together.'
    write: 'Molecule: a small group of atoms joined together'
  - say: 'We write an oxygen molecule as O₂. The small 2, written below and to the right of the O, tells us that the molecule has two oxygen atoms.'
    write: 'Oxygen ($\ce{O2}$): the small 2 means two O atoms'
    point:
      - {line: 13, kind: underline, at: 'the small 2'}
  - say: 'Since both atoms are oxygen, the molecule has only one kind of atom, so oxygen is still an element. A molecule made of two atoms is called a diatomic molecule. Nitrogen gas is also made of diatomic molecules, written N₂.'
    write: 'One kind of atom, so still an element (diatomic)'
    doodle_do:
      - {id: dia, op: circle, part: element-tag, 'on': kind}
  - say: 'When no small number is written after a symbol, it stands for one atom. For example, Fe stands for one iron atom.'
    write: 'No small number, as in Fe: one atom'

  # worked example: which are elements?
  - section: 'Worked example'
    say: 'Now that we know how symbols and formulae are written, let us use them to pick out elements. We are given O₂, CO₂, Fe, NaCl and N₂. Which of these are elements?'
    write: 'Which are elements? Oxygen ($\ce{O2}$), carbon(IV) oxide ($\ce{CO2}$), Fe, sodium chloride (NaCl), nitrogen ($\ce{N2}$)'
  - say: 'To answer this, we look at the kinds of atom in each one. If it has only one kind, it is an element.'
    write: 'Ask: only one kind of atom?'
  # One verdict said, then written; then the next (founder, 12 Nov 2026).
  - say: 'O₂ has only oxygen atoms. That is one kind of atom, so O₂ is an element.'
    write: '$\ce{O2}$: only O atoms, so an element ✓'
    doodle_do:
      - {id: dia, op: pulse, part: element-box, 'on': kind}
  - say: 'N₂ has only nitrogen atoms, so N₂ is an element too.'
    write: '$\ce{N2}$: only N atoms, so an element ✓'
  - say: 'Fe is iron, so it is also an element.'
    write: 'Fe: only Fe atoms, so an element ✓'
  - say: 'CO₂ has carbon atoms and oxygen atoms. That is two kinds of atom, so CO₂ is not an element.'
    write: '$\ce{CO2}$: C and O atoms, not an element ✗'
  - say: 'NaCl has sodium atoms and chlorine atoms, which is also two kinds, so NaCl is not an element either.'
    write: 'NaCl: Na and Cl atoms, not an element ✗'
  - say: 'So the elements are O₂, Fe and N₂. Each has only one kind of atom.'
    write: '∴ elements: $\ce{O2}$, Fe, $\ce{N2}$'
    point:
      - {line: 23, kind: circle, at: 'elements'}

  # ---------------------------------------------------------------- trap
  - section: 'JAMB trap'
    say: 'Here is a common trap in the examination. Some students think that any substance with two or more atoms in it must be a compound. That is not so. What matters is the kind of atoms, not how many there are. If all the atoms are of the same element, it is still an element.'
    write: 'Trap: more than one atom does not make a compound; the kind of atom decides'
    doodle_do:
      - {id: dia, op: circle, part: element-tag, 'on': element}

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Which of these is an element? Is it sodium chloride, carbon(IV) oxide, copper or water? Pause the lesson and decide before I go on.'
    write: 'Which is an element? NaCl, $\ce{CO2}$, Cu, $\ce{H2O}$'
  - say: 'Sodium chloride has sodium and chlorine atoms. Carbon(IV) oxide has carbon and oxygen atoms, and water has hydrogen and oxygen atoms.'
    write: 'NaCl: Na, Cl.  $\ce{CO2}$: C, O.  $\ce{H2O}$: H, O'
  - say: 'Each of them has two different kinds of atom, so none of them is an element.'
    write: 'Two kinds of atom each, so not elements ✗'
  - say: 'Copper has only copper atoms, so copper is the element.'
    write: 'Cu: one kind of atom = element ✓'
    doodle_do:
      - {id: dia, op: circle, part: element-tag, 'on': element}
    point:
      - {line: 28, kind: circle, at: 'element'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. An element has only one kind of atom, and it cannot be split into anything simpler by chemical means.'
    write: '1. Element: one kind of atom; cannot be split by chemical means'
    doodle_do:
      - {id: dia, op: pulse, part: element-tag, 'on': element}
  - say: 'Each element has a symbol. A small number written below and to the right of a symbol tells us how many atoms of that element there are, and no number means one. In the next lesson, we look at compounds. Now try the problem.'
    write: '2. Symbols (Na, Fe); the small number counts atoms, as in $\ce{O2}$'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Which of these is an element? A. carbon(IV) oxide  B. sodium chloride  C. chlorine (Cl₂)  D. water'
    answer: 'C'
    accept: ['chlorine', 'Cl2', 'Cl₂', 'C. chlorine']
    working:
      - 'Carbon(IV) oxide has carbon and oxygen atoms: two kinds, so not an element.'
      - 'Sodium chloride has sodium and chlorine atoms: two kinds, so not an element.'
      - 'Water has hydrogen and oxygen atoms: two kinds, so not an element.'
      - 'Chlorine, Cl₂, has two atoms in each molecule, but both are chlorine: one kind, so an element. Answer: C.'
    needs_working: false
