# Mixtures, and telling them apart (lesson 2 of 2): mixtures and their unfixed ratio, homogeneous and heterogeneous, the comparison with compounds, and JAMB's traps, on one annotated particle diagram.
format_version: 1
subject: chemistry
subtopic: 'Elements, compounds and mixtures'
subtopic_id: 4657fe1f-0818-5df4-b5ce-36b724e9b42a
part: 2
title: 'Mixtures, and telling them apart'
sources:            # pages consulted for the approach, for reviewers
  - https://jambsyllabus.pages.dev/chemistry/
  - https://syllabus.ng/jamb/chemistry
  - https://edupadi.com/classroom/l/classification-of-matter
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
  - https://www.headteacher.ng/first-term-chemistry-revision-for-ss-1/
  - https://syllabus.ng/ss1-scheme-of-work/chemistry/
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. This is lesson two of two on elements, compounds and mixtures: mixtures, and how to tell all three apart.'
    write: 'Mixtures, and telling them apart'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson you met elements and compounds. JAMB often asks which substance is a mixture, or how a mixture differs from a compound. It is also the first step before separating mixtures.'
    write: 'JAMB asks: which is a mixture? how does it differ from a compound?'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'By the end of this lesson you will be able to do two things. One, define a mixture, tell homogeneous from heterogeneous, and tell a mixture from a compound.'
    write: '1. Define a mixture; homogeneous or heterogeneous; mixture vs compound'
  - say: 'Two, spot the traps JAMB sets on this topic.'
    write: '2. Spot the JAMB traps'

  # ---------------------------------------------------------------- mixture
  - section: 'Mixture'
    say: 'A mixture contains two or more substances that are together but not chemically combined. In the third box, salt and water particles sit side by side, but they are not joined.'
    write: 'Mixture: substances together, not chemically combined'
    doodle: {name: 'custom:sub_chem_elements_compounds_mixtures_a3', id: dia, size: scene, caption: 'element, compound, mixture', 'on': mixture}
    doodle_do:
      - {id: dia, op: pulse, part: salt, 'on': salt}
      - {id: dia, op: pulse, part: water, 'on': water}
    point:
      - {line: 4, kind: underline, at: 'not chemically combined'}
  - say: 'A mixture has no fixed composition. One spoon of salt or five, it is still salt water. So a mixture has no chemical formula.'
    write: 'no fixed composition, so no formula'
    doodle_do:
      - {id: dia, op: circle, part: mixture-tag, 'on': composition}
  - say: 'Each part of a mixture keeps its own properties. Salt water tastes salty, because the salt is still salt.'
    write: 'each part keeps its own properties'
  - say: 'So a mixture can be separated by physical means. Boil the salt water, and the water leaves as steam while the salt is left behind. That is evaporation.'
    write: 'separated by physical means, e.g. evaporation'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_elements_compounds_mixtures_a4', 'on': Boil}
      - {id: dia, op: cross, part: water, 'on': steam}
      - {id: dia, op: circle, part: salt, 'on': left}

  # worked example 5: no fixed ratio
  - say: 'Let us solve this. Ngozi dissolves 5 g of salt in 100 g of water. Musa dissolves 20 g of salt in 100 g of water. Show that salt water is a mixture.'
    write: 'Show that salt water is a mixture'
  - say: 'Ngozi''s ratio of salt to water is 5 g to 100 g. Divide both by 5, and it is 1 to 20.'
    write: 'Ngozi: salt : water = 5 g : 100 g = 1 : 20'
  - say: 'Musa''s ratio is 20 g to 100 g. Divide both by 20, and it is 1 to 5.'
    write: 'Musa: salt : water = 20 g : 100 g = 1 : 5'
  - say: 'The ratios are different, yet both are still salt water. There is no fixed composition, so salt water is a mixture.'
    write: '∴ ratio not fixed, so salt water is a mixture'
    doodle_do:
      - {id: dia, op: pulse, part: mixture-tag, 'on': mixture}
    point:
      - {line: 11, kind: circle, at: 'mixture'}

  # ---------------------------------------------------------------- two kinds
  - section: 'Homogeneous and heterogeneous'
    say: 'A homogeneous mixture is the same all through. Its parts are spread evenly and you cannot see them apart. Salt water is homogeneous.'
    write: 'homogeneous: the same all through, e.g. salt water'
    doodle_do:
      - {id: dia, op: pulse, part: mixture-box, 'on': evenly}
  - say: 'A heterogeneous mixture is not the same all through. You can see its different parts.'
    write: 'heterogeneous: parts you can see'

  # worked example 6: homogeneous or heterogeneous?
  - say: 'Let us solve this. Classify each as homogeneous or heterogeneous. Air, garri in water, brass, and palm oil on water.'
    write: 'air, garri in water, brass, palm oil on water?'
  - say: 'Air is nitrogen, oxygen, argon, CO₂ and water vapour, spread evenly. You cannot see the gases apart. So air is homogeneous.'
    write: 'air: gases spread evenly ✓ homogeneous'
  - say: 'Brass is an alloy of copper and zinc, melted and mixed evenly. It looks the same all through, so brass is a homogeneous mixture.'
    write: 'brass (Cu + Zn): the same all through ✓ homogeneous'
  - say: 'In garri and water, you can see the grains settle at the bottom. Palm oil floats on water as a separate layer. Both show their parts, so both are heterogeneous.'
    write: 'garri in water, palm oil on water: parts seen ✓ heterogeneous'

  # ---------------------------------------------------------------- comparison
  - section: 'Comparison'
    say: 'Now compare the three boxes. An element has one kind of atom. A compound has different atoms chemically joined. A mixture has substances that are not joined.'
    write: 'element: one kind; compound: joined; mixture: not joined'
    doodle_do:
      - {id: dia, op: pulse, part: element-box, 'on': element}
      - {id: dia, op: pulse, part: compound-box, 'on': compound}
      - {id: dia, op: pulse, part: mixture-box, 'on': mixture}
  - say: 'A compound has a fixed ratio, a formula and new properties, and it is separated only by chemical means.'
    write: 'compound: fixed ratio, formula, new properties, chemical means'
  - say: 'A mixture has any ratio and no formula. Its parts keep their own properties, and it is separated by physical means.'
    write: 'mixture: any ratio, no formula, own properties, physical means'
  - say: 'Forming a compound usually gives out or takes in heat that you can notice. Making a mixture usually gives little or no heat change.'
    write: 'heat change on forming: compound, usually yes; mixture, little or none'

  # worked example 7: iron and sulphur
  - say: 'Let us solve this. Iron filings and sulphur powder are mixed. A second portion is heated strongly. Which one is the mixture, and how do you show it?'
    write: 'iron + sulphur: mixed, then heated. Which is which?'
  - say: 'Hold a magnet over the first portion. The iron filings are pulled out, so the iron has kept its own property. That is a mixture.'
    write: 'unheated: magnet pulls out iron, so mixture'
  - say: 'Heating makes the two react. The mixture glows and forms a black solid, iron(II) sulphide.'
    write: '$\ce{Fe + S -> FeS}$'
  - say: 'A magnet does not pull iron out of iron(II) sulphide, because the iron is now chemically combined. The black solid has new properties, so it is a compound.'
    write: 'heated: magnet does not attract FeS, so compound'
    point:
      - {line: 25, kind: circle, at: 'compound'}

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is a real JAMB question. Which of these are mixtures? Petroleum, rubber latex, vulcaniser''s solution and carbon(IV) sulphide.'
    write: 'Which are mixtures? petroleum, latex, vulcaniser''s solution, $\ce{CS2}$'
  - say: 'Petroleum is many hydrocarbons. Rubber latex is rubber in water. Vulcaniser''s solution is rubber dissolved in a solvent. All three are mixtures.'
    write: 'petroleum, latex, vulcaniser''s solution = mixtures ✓'
  - say: 'The trap is carbon(IV) sulphide. It is a liquid, but it has a formula, CS₂, so it is a compound, not a mixture. The answer is one, two and three.'
    write: '$\ce{CS2}$ has a formula, so compound ✗'
    point:
      - {line: 28, kind: circle, at: 'compound'}
  - say: 'Another JAMB question. Which is a mixture? Common salt, blood, sand or washing soda.'
    write: 'Which is a mixture? common salt, blood, sand, washing soda'
  - say: 'Common salt is NaCl. Washing soda is Na₂CO₃·10H₂O. Pure sand is silicon(IV) oxide, SiO₂. All three have formulae, so they are compounds.'
    write: 'NaCl, $\ce{Na2CO3.10H2O}$, $\ce{SiO2}$ (sand) = compounds ✗'
  - say: 'Blood is plasma carrying cells, salts, sugar and proteins. A centrifuge separates them. So blood is the mixture.'
    write: 'blood = mixture ✓'
  - say: 'A third JAMB question asks how a mixture differs from a compound. Two options are reversed. A mixture with a formula is wrong, and so is a compound that keeps its old properties.'
    write: 'wrong: mixture has a formula ✗; compound keeps old properties ✗'
    point:
      - {line: 32, kind: strike, at: 'mixture has a formula'}
  - say: 'Another option says a mixture is always homogeneous. Garri in water shows it is not. The answer is that a compound''s parts are chemically bound, and a mixture''s are not.'
    write: '✓ compound: parts chemically bound; mixture: not bound'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Your turn. Which of these is a mixture? Distilled water, oxygen gas, carbon(IV) sulphide, or brass. Pause and decide before I go on.'
    write: 'Which is a mixture? distilled water, oxygen, $\ce{CS2}$, brass'
  - say: 'Distilled water is H₂O, a compound with a formula. Carbon(IV) sulphide is CS₂, also a compound. Oxygen gas has one kind of atom, so it is an element.'
    write: '$\ce{H2O}$, $\ce{CS2}$ = compounds; $\ce{O2}$ = element ✗'
    doodle_do:
      - {id: dia, op: pulse, part: compound-box, 'on': compound}
      - {id: dia, op: pulse, part: element-box, 'on': element}
  - say: 'Brass is copper and zinc mixed, with no formula and no fixed composition. So brass is the mixture.'
    write: 'brass = mixture ✓'
    doodle_do:
      - {id: dia, op: circle, part: mixture-tag, 'on': mixture}
    point:
      - {line: 36, kind: circle, at: 'mixture'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. A mixture is substances together, not chemically combined. It has no fixed ratio and no formula, and it is separated by physical means.'
    write: '1. mixture: not combined, any ratio, no formula, physical means'
    doodle_do:
      - {id: dia, op: pulse, part: mixture-tag, 'on': mixture}
  - say: 'A homogeneous mixture is the same all through, like salt water, air or brass. A heterogeneous mixture shows its parts, like garri in water.'
    write: '2. homogeneous: salt water, air, brass; heterogeneous: garri in water'
  - say: 'And for the traps, a mixture has no formula and is not always homogeneous. That''s the lesson. Next, try the problem.'
    write: '3. mixture: no formula, not always uniform'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Which of these is a compound? A. air  B. brass  C. carbon(IV) oxide  D. sea water'
    answer: 'C'
    accept: ['carbon(IV) oxide', 'C. carbon(IV) oxide', 'CO2', 'carbon dioxide']
    working:
      - 'Air is nitrogen, oxygen and other gases spread evenly, with no fixed ratio: a mixture.'
      - 'Brass is copper and zinc melted and mixed: an alloy, which is a mixture.'
      - 'Sea water is salts dissolved in water, in no fixed ratio: a mixture.'
      - 'Carbon(IV) oxide, $\ce{CO2}$, is carbon and oxygen chemically combined in a fixed ratio, with a formula: a compound. Answer: C.'
    needs_working: false
