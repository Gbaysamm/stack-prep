# Compounds (lesson 2 of 5): what a compound is, what chemically combined and a fixed ratio mean, what its formula tells us, its new properties, and splitting it by chemical means.
format_version: 1
subject: chemistry
subtopic: 'Elements, compounds and mixtures'
subtopic_id: 4657fe1f-0818-5df4-b5ce-36b724e9b42a
part: 2
title: 'Compounds'
sources:            # pages consulted for the approach, for reviewers
  - https://jambsyllabus.pages.dev/chemistry/
  - https://syllabus.ng/jamb/chemistry
  - https://edupadi.com/classroom/l/classification-of-matter
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
  - https://www.headteacher.ng/first-term-chemistry-revision-for-ss-1/
  - https://syllabus.ng/ss1-scheme-of-work/chemistry/
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is compounds.'
    write: 'Compounds'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson, you saw that an element has only one kind of atom. Most substances around you are not elements. For example, water, table salt and sugar are all compounds.'
    write: 'Water, table salt and sugar are compounds'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn what a compound is, what its formula tells us, and how a compound differs from the elements that form it.'
    write: 'Today: what a compound is, and what its formula tells us'

  # ---------------------------------------------------------------- compound
  - section: 'Compound'
    say: 'A compound is a substance formed when two or more elements are chemically combined in a fixed ratio by mass.'
    write: 'Compound: elements chemically combined in a fixed ratio by mass'
    doodle: {name: 'custom:sub_chem_elements_compounds_mixtures_a2', id: dia, size: scene, caption: 'element and compound', 'on': compound}
    point:
      - {line: 3, kind: underline, at: 'fixed ratio'}
  - say: 'Chemically combined means the elements are joined to each other, not just mixed together. Look at the second box. In each particle, sodium and chlorine are joined together.'
    write: 'Chemically combined: joined, not just mixed'
    doodle_do:
      - {id: dia, op: pulse, part: compound-box, 'on': box}
  - say: 'This compound is sodium chloride, the table salt in your kitchen. It forms when sodium burns in chlorine gas.'
    write: 'Sodium + chlorine → sodium chloride: $\ce{2Na + Cl2 -> 2NaCl}$'
  - say: 'Fixed ratio by mass means that the masses of the elements in a compound are always in the same proportion, wherever the compound comes from. The next lesson shows this with water.'
    write: 'Fixed ratio: always the same proportion by mass'
    doodle_do:
      - {id: dia, op: circle, part: compound-tag, 'on': ratio}

  # ---------------------------------------------------------------- formula
  - section: 'Formula'
    say: 'Because its make-up is fixed, every compound has its own chemical formula. For example, sodium chloride is NaCl, water is H₂O and carbon(IV) oxide is CO₂.'
    write: 'Fixed make-up, so a formula: NaCl, water ($\ce{H2O}$), $\ce{CO2}$'
    doodle_do:
      - {id: dia, op: circle, part: compound-tag, 'on': formula}
  - say: 'A formula tells us which atoms are joined and how many of each. In H₂O, the small 2 shows two hydrogen atoms, and the O with no number shows one oxygen atom.'
    write: '$\ce{H2O}$: two H atoms joined to one O atom'

  # ---------------------------------------------------------------- new properties
  - section: 'New properties'
    say: 'A compound also has new properties, quite unlike those of the elements that formed it. For example, sodium is a soft metal that reacts violently with water, and chlorine is a poisonous greenish-yellow gas.'
    write: 'New properties, unlike those of its elements'
  - say: 'Yet when the two combine, they form sodium chloride, the harmless salt we eat. Neither the reactive metal nor the poisonous gas is left.'
    write: 'Reactive metal + poisonous gas → the salt we eat'
    doodle_do:
      - {id: dia, op: pulse, part: compound-box, 'on': combine}

  # ---------------------------------------------------------------- splitting
  - section: 'Splitting a compound'
    say: 'A compound can be split back into simpler substances only by chemical means. Physical methods such as filtering or boiling cannot do it, so a chemical method is needed, such as strong heating or electrolysis.'
    write: 'Split only by chemical means (e.g. strong heating), not by filtering'
  - say: 'Here is an example. When red mercury(II) oxide, HgO, is heated strongly, it breaks down into mercury and oxygen gas. Is mercury(II) oxide an element or a compound?'
    write: 'Mercury(II) oxide (HgO), heated: $\ce{2HgO -> 2Hg + O2}$'
  - say: 'Heating has split it into two simpler substances, mercury and oxygen. An element cannot be split like this, so mercury(II) oxide is a compound.'
    write: '∴ split into simpler substances, so a compound'
    point:
      - {line: 13, kind: underline, at: 'a compound'}

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'JAMB often sets this as a wrong option. The option says that a compound keeps the properties of its elements. It does not. Sodium chloride is neither a soft metal nor a poisonous gas.'
    write: 'Wrong: a compound keeps its elements'' properties ✗'
    point:
      - {line: 14, kind: strike, at: 'keeps its elements'' properties'}
  - say: 'WAEC examiners also report that many students write a formula when the question asks for a name. If you are asked to name a compound, write sodium chloride, not NaCl.'
    write: 'Name asked? Write the name: sodium chloride, not NaCl'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Which of these is a compound? Is it copper, oxygen, water or gold? Pause the lesson and decide before I go on.'
    write: 'Which is a compound? Copper, oxygen, water, gold'
  - say: 'Copper, oxygen and gold each have only one kind of atom, so they are elements.'
    write: 'Cu, $\ce{O2}$, gold (Au): one kind of atom = elements ✗'
    doodle_do:
      - {id: dia, op: pulse, part: element-box, 'on': elements}
  - say: 'Water, H₂O, has hydrogen and oxygen chemically combined, and it has a formula. So water is the compound.'
    write: 'Water ($\ce{H2O}$): elements combined, with a formula = compound ✓'
    doodle_do:
      - {id: dia, op: circle, part: compound-tag, 'on': compound}
    point:
      - {line: 18, kind: circle, at: 'compound'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. A compound is two or more elements chemically combined in a fixed ratio by mass, and it has a formula.'
    write: '1. Compound: elements combined in a fixed ratio; it has a formula'
    doodle_do:
      - {id: dia, op: pulse, part: compound-tag, 'on': compound}
  - say: 'It has new properties, and it can be split only by chemical means. In the next lesson, we will see the fixed ratio at work. Now try the problem.'
    write: '2. New properties; split only by chemical means'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Which of these is a compound? A. nitrogen  B. iron  C. carbon(IV) oxide  D. sulphur'
    answer: 'C'
    accept: ['carbon(IV) oxide', 'CO2', 'CO₂', 'carbon dioxide', 'C. carbon(IV) oxide']
    working:
      - 'Nitrogen, iron and sulphur each have only one kind of atom, so they are elements.'
      - 'Carbon(IV) oxide, CO₂, is carbon and oxygen chemically combined, with a formula, so it is a compound. Answer: C.'
    needs_working: false
