# The fixed ratio by mass (lesson 3 of 5): a compound's fixed ratio shown with water's masses, the ratio of masses against the ratio of atoms, and the ratio used to find an unknown mass, each step guided.
format_version: 1
subject: chemistry
subtopic: 'Elements, compounds and mixtures'
subtopic_id: 4657fe1f-0818-5df4-b5ce-36b724e9b42a
part: 3
title: 'The fixed ratio by mass'
sources:            # pages consulted for the approach, for reviewers
  - https://jambsyllabus.pages.dev/chemistry/
  - https://syllabus.ng/jamb/chemistry
  - https://edupadi.com/classroom/l/classification-of-matter
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
  - https://www.headteacher.ng/first-term-chemistry-revision-for-ss-1/
  - https://syllabus.ng/ss1-scheme-of-work/chemistry/
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is the fixed ratio by mass in a compound.'
    write: 'The fixed ratio by mass'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson, you learnt that the elements in a compound are combined in a fixed ratio by mass. In this lesson, we will see what that means with numbers.'
    write: 'Compound: elements in a fixed ratio by mass'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'You will learn how to show from its masses that a substance is a compound, and how to use a fixed ratio to find an unknown mass.'
    write: 'Today: show a fixed ratio, and use it to find a mass'

  # ---------------------------------------------------------------- water
  - section: 'Water'
    say: 'Let us start with water. We are given two samples of water, one from a well and one from rain. Each sample is broken down into hydrogen and oxygen, and the two gases are weighed. We must show that water is a compound.'
    write: 'Show that water is a compound: well water and rain water broken down'
  - say: 'To do this, we find the ratio of the mass of hydrogen to the mass of oxygen in each sample. A compound has a fixed ratio by mass, so if water is a compound, the two ratios must be the same.'
    write: 'Find H : O by mass in each sample; a compound gives the same ratio'
  - say: 'Sample A is 9 g of well water. It gives 1 g of hydrogen and 8 g of oxygen. So the ratio of hydrogen to oxygen is 1 g to 8 g, which is 1 to 8.'
    write: 'A (9 g): H : O = 1 g : 8 g = 1 : 8'
  - say: 'Sample B is 18 g of rain water. It gives 2 g of hydrogen and 16 g of oxygen, so the ratio is 2 g to 16 g. To compare it with sample A, we simplify it. Dividing both numbers by 2 gives 1 to 8.'
    write: 'B (18 g): H : O = 2 g : 16 g = 1 : 8'
  - say: 'What does this tell us? The samples came from different places and had different masses, yet the ratio is 1 to 8 in both. This fixed ratio by mass shows that water is a compound.'
    write: '∴ same fixed ratio 1 : 8, so water is a compound'
    point:
      - {line: 7, kind: circle, at: 'compound'}
  - say: 'There is one thing to notice about this ratio. 1 to 8 compares the masses of hydrogen and oxygen, not the numbers of their atoms.'
    write: 'By mass, H : O = 1 : 8'
  - say: 'The formula H₂O counts atoms instead. It has two hydrogen atoms for every oxygen atom, so by atoms the ratio is 2 to 1.'
    write: 'By atoms, $\ce{H2O}$ has H : O = 2 : 1'
  - say: 'Why are the two ratios different? An oxygen atom is sixteen times as heavy as a hydrogen atom. So two hydrogen atoms weigh 2 units, one oxygen atom weighs 16 units, and 2 to 16 is 1 to 8.'
    write: 'O atom 16 times as heavy: 2 × 1 : 16 = 2 : 16 = 1 : 8'

  # ---------------------------------------------------------------- using the ratio
  - section: 'Using the ratio'
    say: 'We have used the fixed ratio to show that a substance is a compound. It also lets us find a mass we do not know. Here is an example. 7 g of iron always combines with 4 g of sulphur to form iron(II) sulphide, FeS. What mass of sulphur combines with 14 g of iron?'
    write: '7 g iron (Fe) + 4 g sulphur (S) → iron(II) sulphide (FeS). 14 g Fe needs ? g S'
  - say: 'First, we ask how many times as much iron we now have. 14 g divided by 7 g is 2, so we have twice as much iron.'
    write: '14 g ÷ 7 g = 2'
  - say: 'The ratio of iron to sulphur is fixed, so if the iron doubles, the sulphur must double too. 2 times 4 g is 8 g of sulphur.'
    write: '∴ sulphur = 2 × 4 g = 8 g'
    point:
      - {line: 13, kind: circle, at: '8 g'}
  - say: 'We can check this. 14 g to 8 g, with both divided by 2, gives 7 g to 4 g, which is the same fixed ratio.'
    write: 'Check: 14 : 8 = 7 : 4 ✓'

  # ---------------------------------------------------------------- trap
  - section: 'JAMB trap'
    say: 'Here is a common trap. Some students read the small numbers in a formula as a ratio of masses. They are not. They count atoms, and atoms of different elements have different masses. So H₂O is 2 to 1 in atoms, but 1 to 8 by mass.'
    write: 'Trap: small numbers count atoms, not mass. $\ce{H2O}$ is 2 : 1 in atoms, but 1 : 8 by mass'
    point:
      - {line: 15, kind: underline, at: '1 : 8 by mass'}

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. 2 g of hydrogen always combines with 16 g of oxygen to form water. What mass of oxygen combines with 6 g of hydrogen? Pause the lesson and work it out.'
    write: '2 g H + 16 g O → water. 6 g H needs ? g O'
  - say: 'First, 6 g divided by 2 g is 3, so there is three times as much hydrogen. The ratio is fixed, so the oxygen must be three times as much too, and 3 times 16 g is 48 g of oxygen.'
    write: '6 ÷ 2 = 3, so oxygen = 3 × 16 g = 48 g'
    point:
      - {line: 17, kind: circle, at: '48 g'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. In a compound, the masses of the elements are always in the same ratio, wherever the compound comes from. This is a ratio of masses, not of numbers of atoms.'
    write: '1. Fixed ratio: the same proportion by mass in every sample'
  - say: 'To find an unknown mass, divide the given mass by its mass in the ratio, then multiply the other mass in the ratio by the same number. Now try the problem.'
    write: '2. Given mass ÷ its mass in the ratio; multiply the other mass by that number'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'In carbon(IV) oxide, 3 g of carbon always combines with 8 g of oxygen. What mass of oxygen combines with 12 g of carbon?'
    answer: '32 g'
    accept: ['32', '32g', '32 grams']
    working:
      - 'Carbon : oxygen = 3 g : 8 g, a fixed ratio'
      - '12 g ÷ 3 g = 4, so there is 4 times as much carbon'
      - 'Oxygen = 4 × 8 g = 32 g'
      - 'Check: 12 g : 32 g, divide both by 4, gives 3 : 8 ✓'
    needs_working: true
