# Mixtures (lesson 4 of 5): what a mixture is, why it has no fixed ratio or formula, how it is separated, and homogeneous against heterogeneous, with guided examples.
format_version: 1
subject: chemistry
subtopic: 'Elements, compounds and mixtures'
subtopic_id: 4657fe1f-0818-5df4-b5ce-36b724e9b42a
part: 4
title: 'Mixtures'
sources:            # pages consulted for the approach, for reviewers
  - https://jambsyllabus.pages.dev/chemistry/
  - https://syllabus.ng/jamb/chemistry
  - https://edupadi.com/classroom/l/classification-of-matter
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
  - https://www.headteacher.ng/first-term-chemistry-revision-for-ss-1/
  - https://syllabus.ng/ss1-scheme-of-work/chemistry/
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is mixtures.'
    write: 'Mixtures'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'You have met elements and compounds. The third kind of substance is the mixture, and most things around you are mixtures. For example, air, sea water and soil are all mixtures.'
    write: 'Mixtures all around us: air, sea water, soil'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn what a mixture is, how it is separated, and the two kinds of mixture.'
    write: 'Today: what a mixture is, and its two kinds'

  # ---------------------------------------------------------------- mixture
  - section: 'Mixture'
    say: 'A mixture contains two or more substances that are together but not chemically combined. Look at the third box. Salt and water particles sit side by side, but they are not joined.'
    write: 'Mixture: substances together, not chemically combined'
    doodle: {name: 'custom:sub_chem_elements_compounds_mixtures_a3', id: dia, size: scene, caption: 'three kinds of substance', 'on': mixture}
    doodle_do:
      - {id: dia, op: pulse, part: salt, 'on': Salt}
      - {id: dia, op: pulse, part: water, 'on': water}
    point:
      - {line: 3, kind: underline, at: 'not chemically combined'}
  - say: 'A mixture has no fixed composition. You can add one spoon of salt to water, or five, and it is still salt water. So a mixture has no chemical formula.'
    write: 'No fixed composition, so no formula'
    doodle_do:
      - {id: dia, op: circle, part: mixture-tag, 'on': composition}
  - say: 'Each part of a mixture also keeps its own properties. For example, salt water tastes salty, because the salt in it is still salt.'
    write: 'Each part keeps its own properties'
  - say: 'Because the parts are not joined, a mixture can be separated by physical means. For example, when salt water is boiled, the water leaves as steam and the salt is left behind. This is called evaporation.'
    write: 'Separated by physical means, e.g. evaporation'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_elements_compounds_mixtures_a4', 'on': boiled}
      - {id: dia, op: cross, part: water, 'on': steam}
      - {id: dia, op: circle, part: salt, 'on': left}

  # worked example: no fixed ratio
  - section: 'Worked example'
    say: 'Let us test this with numbers. Ngozi dissolves 5 g of salt in 100 g of water, and Musa dissolves 20 g of salt in 100 g of water. We must show that salt water is a mixture.'
    write: 'Show that salt water is a mixture'
  - say: 'Ngozi''s ratio of salt to water is 5 g to 100 g. Dividing both by 5 gives 1 to 20.'
    write: 'Ngozi: salt : water = 5 g : 100 g = 1 : 20'
  - say: 'Musa''s ratio is 20 g to 100 g. Dividing both by 20 gives 1 to 5.'
    write: 'Musa: salt : water = 20 g : 100 g = 1 : 5'
  - say: 'What does this tell us? The ratios are different, yet both are still salt water. The composition is not fixed, so salt water is a mixture.'
    write: '∴ ratio not fixed, so salt water is a mixture'
    doodle_do:
      - {id: dia, op: pulse, part: mixture-tag, 'on': mixture}
    point:
      - {line: 10, kind: circle, at: 'mixture'}

  # ---------------------------------------------------------------- two kinds
  - section: 'Homogeneous and heterogeneous'
    say: 'Mixtures come in two kinds. A homogeneous mixture is the same all through. Its parts are spread evenly, and you cannot see them apart. For example, salt water is homogeneous.'
    write: 'Homogeneous: the same all through, e.g. salt water'
    doodle_do:
      - {id: dia, op: pulse, part: mixture-box, 'on': evenly}
  - say: 'A heterogeneous mixture is not the same all through, and you can see its different parts. For example, sand in water is heterogeneous.'
    write: 'Heterogeneous: parts you can see, e.g. sand in water'
  - say: 'Let us sort four mixtures, which are air, garri in water, brass and palm oil on water. For each one, we ask whether we can see its parts.'
    write: 'Homogeneous or heterogeneous? Air, garri in water, brass, palm oil on water'
  - say: 'Air is a mixture of gases, such as nitrogen and oxygen, spread evenly, and we cannot see the gases apart. So air is homogeneous.'
    write: 'Air: gases spread evenly ✓ homogeneous'
  - say: 'Brass is an alloy, which is a mixture of metals melted together. It is made of copper and zinc, and it looks the same all through. So brass is homogeneous too.'
    write: 'Brass (copper + zinc): the same all through ✓ homogeneous'
  - say: 'In garri and water, we can see the grains settle at the bottom. Palm oil floats on water as a separate layer. We can see the parts in both, so both are heterogeneous.'
    write: 'Garri in water, palm oil on water: parts seen ✓ heterogeneous'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Which of these is a heterogeneous mixture? Is it salt water, air, chalk in water or brass? Pause the lesson and decide before I go on.'
    write: 'Which is heterogeneous? Salt water, air, chalk in water, brass'
  - say: 'Salt water, air and brass are the same all through, so they are homogeneous. In chalk and water, we can see the chalk powder, so chalk in water is the heterogeneous mixture.'
    write: 'Chalk in water: parts seen = heterogeneous ✓'
    point:
      - {line: 18, kind: circle, at: 'heterogeneous'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. A mixture is two or more substances together but not chemically combined. It has no fixed composition and no formula, and it is separated by physical means.'
    write: '1. Mixture: not combined, no fixed ratio, no formula, physical means'
    doodle_do:
      - {id: dia, op: pulse, part: mixture-tag, 'on': mixture}
  - say: 'A homogeneous mixture is the same all through, and a heterogeneous mixture shows its parts. Now try the problem.'
    write: '2. Homogeneous: the same all through; heterogeneous: parts seen'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Which of these is a heterogeneous mixture? A. sea water  B. air  C. sand and water  D. brass'
    answer: 'C'
    accept: ['sand and water', 'sand in water', 'C. sand and water']
    working:
      - 'Sea water, air and brass are the same all through, so they are homogeneous mixtures.'
      - 'In sand and water, the sand can be seen at the bottom, so it is heterogeneous. Answer: C.'
    needs_working: false
