# Telling elements, compounds and mixtures apart (lesson 5 of 5): the three kinds side by side, a compound against a mixture point by point, the iron and sulphur experiment, and JAMB's questions and traps.
format_version: 1
subject: chemistry
subtopic: 'Elements, compounds and mixtures'
subtopic_id: 4657fe1f-0818-5df4-b5ce-36b724e9b42a
part: 5
title: 'Telling elements, compounds and mixtures apart'
sources:            # pages consulted for the approach, for reviewers
  - https://jambsyllabus.pages.dev/chemistry/
  - https://syllabus.ng/jamb/chemistry
  - https://edupadi.com/classroom/l/classification-of-matter
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
  - https://www.headteacher.ng/first-term-chemistry-revision-for-ss-1/
  - https://syllabus.ng/ss1-scheme-of-work/chemistry/
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is telling elements, compounds and mixtures apart.'
    write: 'Telling elements, compounds and mixtures apart'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'You have now met all three kinds of substance. JAMB often asks you to tell them apart, especially a compound from a mixture, so in this lesson we put them side by side.'
    write: 'Element, compound or mixture?'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'You will learn how a compound differs from a mixture, and how to answer the JAMB questions on them.'
    write: 'Today: compound or mixture, and the JAMB questions'

  # ---------------------------------------------------------------- comparison
  - section: 'Comparison'
    say: 'Look at the three boxes. In an element, all the atoms are of one kind.'
    write: 'Element: one kind of atom'
    doodle: {name: 'custom:sub_chem_elements_compounds_mixtures_a3', id: dia, size: scene, caption: 'three kinds of substance', 'on': boxes}
    doodle_do:
      - {id: dia, op: pulse, part: element-box, 'on': element}
  - say: 'In a compound, different atoms are chemically joined.'
    write: 'Compound: different atoms joined'
    doodle_do:
      - {id: dia, op: pulse, part: compound-box, 'on': compound}
  - say: 'In a mixture, the substances are together but not joined.'
    write: 'Mixture: substances together, not joined'
    doodle_do:
      - {id: dia, op: pulse, part: mixture-box, 'on': mixture}
  - say: 'Now let us compare a compound with a mixture. A compound has a fixed ratio and a formula, but a mixture can have any ratio and has no formula.'
    write: 'Compound: fixed ratio, formula; mixture: any ratio, no formula'
  - say: 'A compound has new properties, but the parts of a mixture keep their own properties.'
    write: 'Compound: new properties; mixture: parts keep their own'
  - say: 'A compound is separated only by chemical means, but a mixture is separated by physical means.'
    write: 'Compound: chemical means; mixture: physical means'
  - say: 'Forming a compound usually gives out or takes in heat that you can notice. Making a mixture usually gives little or no heat change.'
    write: 'Heat change on forming: compound, usually yes; mixture, little or none'

  # ---------------------------------------------------------------- iron and sulphur
  - section: 'Iron and sulphur'
    say: 'Let us see these differences in one experiment. Iron filings and sulphur powder are mixed and split into two portions, and only the second portion is heated strongly. Which portion is the mixture, and how do we show it?'
    write: 'Iron + sulphur: mixed, then one portion heated. Which is which?'
  - say: 'Hold a magnet over the first portion. The iron filings are pulled out, so the iron has kept its own property. That portion is a mixture.'
    write: 'Unheated: magnet pulls out iron, so mixture'
  - say: 'When the second portion is heated, the iron and sulphur react. The mixture glows and forms a black solid called iron(II) sulphide.'
    write: 'Iron + sulphur → iron(II) sulphide: $\ce{Fe + S -> FeS}$'
  - say: 'A magnet does not pull iron out of iron(II) sulphide, because the iron is now chemically combined. The black solid has new properties, so it is a compound.'
    write: 'Heated: magnet does not attract FeS, so compound'
    point:
      - {line: 13, kind: circle, at: 'compound'}

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is a real JAMB question. It asks which of petroleum, rubber latex, vulcaniser''s solution and carbon(IV) sulphide are mixtures.'
    write: 'Which are mixtures? Petroleum, latex, vulcaniser''s solution, carbon(IV) sulphide ($\ce{CS2}$)'
  - say: 'Petroleum is a mixture of many different compounds of carbon and hydrogen. Rubber latex is rubber in water, and vulcaniser''s solution is rubber dissolved in a solvent. So all three are mixtures.'
    write: 'Petroleum, latex, vulcaniser''s solution = mixtures ✓'
  - say: 'The trap is carbon(IV) sulphide. It is a liquid, but it has a formula, CS₂, so it is a compound, not a mixture.'
    write: '$\ce{CS2}$ has a formula, so compound ✗'
    point:
      - {line: 16, kind: circle, at: 'compound'}
  - say: 'Here is another JAMB question. Which is a mixture? Is it common salt, blood, sand or washing soda?'
    write: 'Which is a mixture? Common salt, blood, sand, washing soda'
  - say: 'Common salt is sodium chloride, washing soda is hydrated sodium carbonate, and pure sand is silicon(IV) oxide. All three have formulae, so they are compounds.'
    write: 'Salt (NaCl), washing soda ($\ce{Na2CO3.10H2O}$), sand ($\ce{SiO2}$) = compounds ✗'
  - say: 'Blood is plasma carrying cells, salts, sugar and proteins, and these can be separated in a machine called a centrifuge. So blood is the mixture.'
    write: 'Blood = mixture ✓'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Which of these is a mixture? Is it distilled water, oxygen gas, carbon(IV) sulphide or brass? Pause the lesson and decide before I go on.'
    write: 'Which is a mixture? Distilled water, oxygen, $\ce{CS2}$, brass'
  - say: 'Distilled water, H₂O, and carbon(IV) sulphide, CS₂, both have formulae, so they are compounds.'
    write: 'Water ($\ce{H2O}$), $\ce{CS2}$: formulae, so compounds ✗'
    doodle_do:
      - {id: dia, op: pulse, part: compound-box, 'on': compounds}
  - say: 'Oxygen gas has only one kind of atom, so it is an element.'
    write: 'Oxygen ($\ce{O2}$): one kind of atom, so an element ✗'
    doodle_do:
      - {id: dia, op: pulse, part: element-box, 'on': element}
  - say: 'Brass is copper and zinc mixed together, with no formula and no fixed composition. So brass is the mixture.'
    write: 'Brass = mixture ✓'
    doodle_do:
      - {id: dia, op: circle, part: mixture-tag, 'on': mixture}
    point:
      - {line: 23, kind: circle, at: 'mixture'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. A compound has a fixed ratio, a formula and new properties, and it is separated only by chemical means.'
    write: '1. Compound: fixed ratio, formula, new properties, chemical means'
  - say: 'A mixture has any ratio and no formula, its parts keep their own properties, and it is separated by physical means. So if a substance has a formula, it is not a mixture. Now try the problem.'
    write: '2. Mixture: any ratio, no formula, own properties, physical means'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Which of these is a compound? A. air  B. brass  C. carbon(IV) oxide  D. sea water'
    answer: 'C'
    accept: ['carbon(IV) oxide', 'C. carbon(IV) oxide', 'CO2', 'carbon dioxide']
    working:
      - 'Air is nitrogen, oxygen and other gases spread evenly, with no fixed ratio: a mixture.'
      - 'Brass is copper and zinc melted and mixed: an alloy, which is a mixture.'
      - 'Sea water is salts dissolved in water, in no fixed ratio: a mixture.'
      - 'Carbon(IV) oxide, CO₂, is carbon and oxygen chemically combined in a fixed ratio, with a formula: a compound. Answer: C.'
    needs_working: false
