# Boyle's law (lesson 1 of 7): the big picture of a gas's pressure, volume and temperature drawn first, then Boyle's law stated, explained on the cylinder, worked step by step and drawn as a graph.
format_version: 1
subject: chemistry
subtopic: 'The gas laws'
subtopic_id: 475d9837-e728-5acf-99be-2a5313095800
part: 1
title: 'Boyle''s law'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://edupadi.com/classroom/l/gas-laws
  - https://schoolings.org/chemistry-lesson-note-for-ss1-second-term/
  - https://myschool.ng/classroom/chemistry
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is Boyle''s law.'
    write: 'Boyle''s law'

  # ---------------------------------------------------------------- introduction: the big picture, drawn
  - section: 'Introduction'
    say: 'A gas has no fixed volume. It spreads out to fill whatever container it is in, and its volume changes when we squeeze it or heat it.'
    write: 'A gas has no fixed volume'
  - say: 'Look at this gas, trapped in a cylinder under a piston. The piston can slide up and down, so the gas can take up more space or less.'
    write: 'A gas trapped under a piston'
    doodle: {name: 'custom:sub_chem_gas_laws_a', id: dia, size: scene, caption: 'a gas in a cylinder', 'on': gas}
    doodle_do:
      - {id: dia, op: pulse, part: piston, 'on': piston}
  # The three quantities named first, then each brought in as it is explained.
  - say: 'Three things describe the gas. They are its pressure, its volume and its temperature.'
    write: 'Three quantities: pressure, volume, temperature'
  - say: 'Pressure is how hard the gas is pushed on. Here the piston presses down on the gas. We use the letter P for pressure.'
    write: 'Pressure (P): how hard the gas is pushed on'
    doodle_do:
      - {id: dia, op: show, part: pressure-tag, 'on': presses}
  - say: 'Volume is the space the gas fills, here the space under the piston. We use the letter V for volume.'
    write: 'Volume (V): the space the gas fills'
    doodle_do:
      - {id: dia, op: show, part: volume-tag, 'on': space}
  - say: 'Temperature is how hot the gas is. We use the letter T, and we come to it in the next lesson.'
    write: 'Temperature (T): how hot the gas is'
  - say: 'The gas laws tell us exactly how these three affect each other, for a fixed mass of gas. JAMB asks about them almost every year, mostly as calculations.'
    write: 'The gas laws link P, V and T for a fixed mass of gas'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn Boyle''s law, how to use it to find a new volume or pressure, and how its graph looks.'
    write: 'Today: Boyle''s law, its calculations and its graph'

  # ---------------------------------------------------------------- Boyle
  - section: 'Boyle''s law'
    say: 'Boyle''s law states that at constant temperature, the volume of a fixed mass of gas is inversely proportional to its pressure.'
    write: 'Boyle''s law: at constant temperature, $V \propto \dfrac{1}{P}$'
    doodle_do:
      - {id: dia, op: pulse, part: volume-tag, 'on': volume}
      - {id: dia, op: pulse, part: pressure-tag, 'on': pressure}
    point:
      - {line: 9, kind: underline, at: 'at constant temperature'}
  - say: 'Inversely proportional means that when one goes up, the other goes down by the same factor. If one is made twice as big, the other becomes half as big.'
    write: 'Inversely proportional: one doubles, the other halves'
  - say: 'Look at the cylinder. Push the piston down with twice the pressure, and the volume becomes half. The particles of gas are squeezed closer together.'
    write: 'Double the pressure, and the volume halves'
    doodle_do:
      - {id: dia, op: pulse, part: piston, 'on': piston}
      - {id: dia, op: label, part: volume-tag, text: 'P × 2, so V ÷ 2', 'on': half}
  - say: 'So pressure times volume does not change. If P is 1 and V is 10, then PV is 10. Double P to 2, and V halves to 5, so PV is still 10.'
    write: '$PV = \text{constant}$: 1 × 10 = 2 × 5 = 10'
  - say: 'We call the gas before the change state one, and after the change state two. So P₁ and V₁ are the first pressure and volume, P₂ and V₂ the new ones, and P₁V₁ = P₂V₂.'
    write: 'Before (1) and after (2): $P_1V_1 = P_2V_2$'
    point:
      - {line: 13, kind: circle, at: '$P_1V_1 = P_2V_2$'}

  # ---------------------------------------------------------------- worked example
  - section: 'Worked example'
    say: 'Let us solve this. A gas occupies 300 cubic centimetres at 760 millimetres of mercury. Find its volume at 950 millimetres of mercury, at constant temperature.'
    write: 'Example: 300 cm³ at 760 mmHg. Volume at 950 mmHg?'
  - say: 'Millimetres of mercury, written mmHg, is a unit of pressure. It is the height of mercury the gas can hold up in a tube.'
    write: 'mmHg (millimetres of mercury): a unit of pressure'
  - say: 'First we list what we are given. P₁ is 760 millimetres of mercury, V₁ is 300 cubic centimetres, and P₂ is 950. We must find V₂. The temperature does not change, so this is Boyle''s law.'
    write: '$P_1 = 760$ mmHg, $V_1 = 300$ cm³, $P_2 = 950$ mmHg, $V_2 = ?$'
  - say: 'We want V₂ on its own, so we divide both sides of P₁V₁ = P₂V₂ by P₂. Then we put in the numbers, with their units.'
    write: '$V_2 = \dfrac{P_1V_1}{P_2} = \dfrac{760 \text{ mmHg} \times 300 \text{ cm}^3}{950 \text{ mmHg}}$'
  - say: '760 times 300 is 228 000. The millimetres of mercury cancel, and 228 000 divided by 950 is 240. So the new volume is 240 cubic centimetres.'
    write: '$V_2 = \dfrac{228\,000}{950}$ cm³ $\therefore V_2 = 240$ cm³'
    point:
      - {line: 18, kind: circle, at: '240'}
  - say: 'What does this tell us? The pressure went up, and the volume went down from 300 to 240, just as Boyle''s law says. Always check that your answer moves the right way.'
    write: 'Pressure up, volume down: 240 is less than 300 ✓'

  # ---------------------------------------------------------------- graphs
  - section: 'The graph'
    say: 'JAMB also asks for the graph. Let me draw volume against pressure. It is a curve that falls steeply, then gently, and never touches either axis.'
    write: 'Graph of V against P: a falling curve'
    diagram:
      id: g
      kind: graph
      'on': draw
      x: [0, 6]
      y: [0, 12]
      step: 2
      x_label: 'pressure, P'
      y_label: 'volume, V'
      plots:
        - {fn: '12/x', domain: [1, 6], label: 'V = k ÷ P', colour: purple}
  - say: 'Now draw PV against P. For an ideal gas, PV does not change, so the graph is a flat, horizontal line. A line that bends or slopes shows a real gas.'
    write: 'Ideal gas: PV against P is a horizontal line'
    point:
      - {line: 21, kind: underline, at: 'horizontal line'}

  # ---------------------------------------------------------------- trap
  - section: 'JAMB trap'
    say: 'Here is a common trap. Some students multiply by the wrong pressure and work out 300 times 950 over 760, which gives 375 cubic centimetres. That volume went up when the pressure went up, so it must be wrong.'
    write: 'Trap: 300 × 950 ÷ 760 = 375 cm³, bigger, so wrong ✗'
    point:
      - {line: 22, kind: strike, at: '375 cm³'}

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. A gas occupies 50 cubic centimetres at 2 atmospheres. Find its volume at 1 atmosphere, at constant temperature. Pause the lesson and work it out.'
    write: 'Check: 50 cm³ at 2 atm. Volume at 1 atm?'
  - say: 'By Boyle''s law, V₂ is P₁V₁ over P₂, which is 2 times 50 over 1. That is 100 cubic centimetres. The pressure halved, so the volume doubled, which makes sense.'
    write: '$V_2 = \dfrac{2 \times 50}{1} = 100$ cm³ ✓'
    point:
      - {line: 24, kind: circle, at: '100'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. Boyle''s law says that at constant temperature, the volume of a fixed mass of gas is inversely proportional to its pressure, so P₁V₁ = P₂V₂.'
    write: '1. Boyle''s law: at constant T, $P_1V_1 = P_2V_2$'
  - say: 'When the pressure goes up, the volume goes down, and the graph of V against P is a falling curve. In the next lesson, we heat the gas. Now try the problem.'
    write: '2. Pressure up, volume down; V against P is a falling curve'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'A gas occupies 150 cm³ at 600 mmHg. Find its volume at 900 mmHg, the temperature staying the same.'
    answer: '100 cm³'
    accept: ['100', '100cm³', '100 cm3', '100 cm^3']
    needs_working: true
    working:
      - 'Boyle''s law: $P_1V_1 = P_2V_2$, so $V_2 = \dfrac{P_1V_1}{P_2}$.'
      - '$P_1 = 600$ mmHg, $V_1 = 150$ cm³, $P_2 = 900$ mmHg.'
      - '$V_2 = \dfrac{600 \times 150}{900} = \dfrac{90\,000}{900} = 100$ cm³.'
      - 'The pressure went up and the volume went down, which fits.'
