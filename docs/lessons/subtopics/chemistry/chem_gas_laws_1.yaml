# Boyle's law (lesson 1 of 7): the big picture of a gas's pressure, volume and temperature drawn first, then Boyle's law stated, explained on the cylinder, worked step by step and drawn as a graph.
format_version: 1
subject: chemistry
subtopic: 'The gas laws'
subtopic_id: 475d9837-e728-5acf-99be-2a5313095800
part: 1
title: 'Boyle''s law'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://edupadi.com/classroom/l/gas-laws
  - https://schoolings.org/chemistry-lesson-note-for-ss1-second-term/
  - https://myschool.ng/classroom/chemistry
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is Boyle''s law.'
    write: 'Boyle''s law'

  # ---------------------------------------------------------------- introduction: the big picture, drawn
  - section: 'Introduction'
    say: 'A gas has no fixed volume. It spreads out to fill whatever container it is in, and its volume changes when we squeeze it or heat it.'
    write: 'A gas has no fixed volume'
  - say: 'Look at this gas, trapped in a cylinder under a piston. A piston is a close-fitting lid that can slide up and down the cylinder, so the gas can take up more space or less.'
    write: 'A gas trapped under a piston'
    doodle: {name: 'custom:sub_chem_gas_laws_a', id: dia, size: scene, caption: 'a gas in a cylinder', 'on': gas}
    doodle_do:
      - {id: dia, op: pulse, part: piston, 'on': piston}
  # The three quantities named first, then each brought in as it is explained.
  - say: 'Three things describe the gas. They are its pressure, its volume and its temperature.'
    write: 'Three quantities: pressure, volume, temperature'
  - say: 'Pressure is how hard the gas pushes on the walls of its container. Here the piston presses down on the gas, and the gas pushes back up on the piston. We use the letter P for pressure.'
    write: 'Pressure (P): how hard the gas pushes on its container'
    doodle_do:
      - {id: dia, op: show, part: pressure-tag, 'on': presses}
  - say: 'Volume is the space the gas takes up. Here it is the space under the piston. We use the letter V for volume.'
    write: 'Volume (V): the space the gas takes up'
    doodle_do:
      - {id: dia, op: show, part: volume-tag, 'on': space}
  - say: 'Temperature is how hot the gas is. We use the letter T for temperature, and we come back to it in the next lesson.'
    write: 'Temperature (T): how hot the gas is'
  - say: 'The gas laws tell us exactly how these three affect each other, for a fixed mass of gas. A fixed mass means that no gas gets in or out while we change it. JAMB asks about the gas laws almost every year, mostly as calculations.'
    write: 'The gas laws link P, V and T for a fixed mass of gas'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn Boyle''s law, how to use it to find a new volume or pressure, and how its graph looks.'
    write: 'Today: Boyle''s law, its calculations and its graph'

  # ---------------------------------------------------------------- Boyle
  - section: 'Boyle''s law'
    say: 'Boyle''s law states that at constant temperature, the volume of a fixed mass of gas is inversely proportional to its pressure.'
    write: 'Boyle''s law: at constant temperature, $V \propto \dfrac{1}{P}$'
    doodle_do:
      - {id: dia, op: pulse, part: volume-tag, 'on': volume}
      - {id: dia, op: pulse, part: pressure-tag, 'on': pressure}
    point:
      - {line: 9, kind: underline, at: 'at constant temperature'}
  - say: 'Inversely proportional means that when one of them is multiplied by a number, the other is divided by the same number. So if the pressure is made twice as big, the volume becomes half as big.'
    write: 'Inversely proportional: one doubles, the other halves'
  - say: 'Look at the cylinder. When we push the piston down with twice the pressure, the gas is squeezed into half the space, because its particles are pushed closer together.'
    write: 'Double the pressure, and the volume halves'
    doodle_do:
      - {id: dia, op: pulse, part: piston, 'on': piston}
      - {id: dia, op: label, part: volume-tag, text: 'P × 2, so V ÷ 2', 'on': half}
  - say: 'Since one doubles while the other halves, pressure times volume, written PV, stays the same. For example, if P is 1 and V is 10, then PV is 10. When P doubles to 2, V halves to 5, and PV is still 10.'
    write: '$PV = \text{constant}$: 1 × 10 = 2 × 5 = 10'
  - say: 'To use this in a calculation, we mark the gas before the change with a small 1, and after the change with a small 2. So P₁ and V₁ are the pressure and volume before, and P₂ and V₂ are the pressure and volume after. Since PV stays the same, P₁V₁ = P₂V₂.'
    write: 'Before (1) and after (2): $P_1V_1 = P_2V_2$'
    point:
      - {line: 13, kind: circle, at: '$P_1V_1 = P_2V_2$'}

  # ---------------------------------------------------------------- worked example
  - section: 'Worked example'
    say: 'Now let us use P₁V₁ = P₂V₂ to find a new volume. First, one unit we need. Pressure is often measured in millimetres of mercury, written mmHg. It is the height, in millimetres, of the column of mercury that the pressure can hold up in a tube.'
    write: 'mmHg (millimetres of mercury): a unit of pressure'
  - say: 'Here is the problem. A gas occupies 300 cubic centimetres at 760 millimetres of mercury. Find its volume at 950 millimetres of mercury, at constant temperature.'
    write: 'Example: 300 cm³ at 760 mmHg. Volume at 950 mmHg?'
  - say: 'We list what we are given. P₁ is 760 millimetres of mercury, V₁ is 300 cubic centimetres, and P₂ is 950 millimetres of mercury. We must find V₂. The temperature does not change, so we use Boyle''s law.'
    write: '$P_1 = 760$ mmHg, $V_1 = 300$ cm³, $P_2 = 950$ mmHg, $V_2 = ?$'
  - say: 'We want V₂ on its own, so we divide both sides of P₁V₁ = P₂V₂ by P₂. Then we put in the numbers, with their units.'
    write: '$V_2 = \dfrac{P_1V_1}{P_2} = \dfrac{760 \text{ mmHg} \times 300 \text{ cm}^3}{950 \text{ mmHg}}$'
  - say: '760 times 300 is 228 000. The millimetres of mercury on the top and the bottom cancel, leaving cubic centimetres. 228 000 divided by 950 is 240, so the new volume is 240 cubic centimetres.'
    write: '$V_2 = \dfrac{228\,000}{950}$ cm³ $\therefore V_2 = 240$ cm³'
    point:
      - {line: 18, kind: circle, at: '240'}
  - say: 'What does this tell us? The pressure went up, and the volume went down from 300 to 240, just as Boyle''s law says. Always check that your answer moves the right way.'
    write: 'Pressure up, volume down: 240 is less than 300 ✓'

  # ---------------------------------------------------------------- graphs
  - section: 'The graph'
    say: 'We have seen that as the pressure goes up, the volume goes down. JAMB also asks what this looks like on a graph. Let me draw volume against pressure, with volume up the side and pressure along the bottom. It is a curve that falls steeply at first, then more gently. It never touches either axis, because neither the volume nor the pressure ever reaches zero.'
    write: 'Graph of V against P: a falling curve'
    diagram:
      id: g
      kind: graph
      'on': draw
      x: [0, 6]
      y: [0, 12]
      step: 2
      x_label: 'pressure, P'
      y_label: 'volume, V'
      plots:
        - {fn: '12/x', domain: [1, 6], label: 'V = k ÷ P', colour: purple}
  - say: 'Now let us plot PV, the pressure times the volume, against P. We saw that PV stays the same at every pressure, so this graph is a flat, horizontal line. A gas that obeys Boyle''s law exactly like this is called an ideal gas. A real gas gives a line that bends or slopes a little.'
    write: 'Ideal gas: PV against P is a horizontal line'
    point:
      - {line: 21, kind: underline, at: 'horizontal line'}

  # ---------------------------------------------------------------- trap
  - section: 'JAMB trap'
    say: 'Here is a common trap. Some students put the pressures the wrong way up and work out 300 times 950 over 760, which gives 375 cubic centimetres. But the pressure went up, so the volume must go down, and 375 is bigger than 300. The rule is to decide first which way the volume must move, then check that your answer moves that way.'
    write: 'Trap: 300 × 950 ÷ 760 = 375 cm³, bigger, so wrong ✗'
    point:
      - {line: 22, kind: strike, at: '375 cm³'}

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. A gas occupies 50 cubic centimetres at 2 atmospheres. Find its volume at 1 atmosphere, at constant temperature. Pause the lesson and work it out.'
    write: 'Check: 50 cm³ at 2 atm. Volume at 1 atm?'
  - say: 'By Boyle''s law, V₂ is P₁V₁ over P₂, which is 2 times 50 over 1. That is 100 cubic centimetres. The pressure halved, so the volume doubled, just as Boyle''s law says.'
    write: '$V_2 = \dfrac{2 \times 50}{1} = 100$ cm³ ✓'
    point:
      - {line: 24, kind: circle, at: '100'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. Boyle''s law says that at constant temperature, the volume of a fixed mass of gas is inversely proportional to its pressure, so P₁V₁ = P₂V₂.'
    write: '1. Boyle''s law: at constant T, $P_1V_1 = P_2V_2$'
  - say: 'When the pressure goes up, the volume goes down. The graph of V against P is a falling curve, and the graph of PV against P is a horizontal line. In the next lesson, we heat the gas. Now try the problem.'
    write: '2. Pressure up, volume down; V against P falls; PV against P is flat'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'A gas occupies 150 cm³ at 600 mmHg. Find its volume at 900 mmHg, the temperature staying the same.'
    answer: '100 cm³'
    accept: ['100', '100cm³', '100 cm3', '100 cm^3']
    needs_working: true
    working:
      - 'Boyle''s law: $P_1V_1 = P_2V_2$, so $V_2 = \dfrac{P_1V_1}{P_2}$.'
      - '$P_1 = 600$ mmHg, $V_1 = 150$ cm³, $P_2 = 900$ mmHg.'
      - '$V_2 = \dfrac{600 \times 150}{900} = \dfrac{90\,000}{900} = 100$ cm³.'
      - 'The pressure went up and the volume went down, which fits.'
