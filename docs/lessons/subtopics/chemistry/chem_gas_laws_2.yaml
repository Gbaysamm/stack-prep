# The gas laws, lesson 2 of 2: the ideal gas equation PV = nRT, molar volume and vapour density, Gay-Lussac's law, Dalton's law of partial pressures and Graham's law of diffusion, each stated and worked step by step, on the growing gas diagram.
format_version: 1
subject: chemistry
subtopic: 'The gas laws'
subtopic_id: 475d9837-e728-5acf-99be-2a5313095800
part: 2
title: 'The ideal gas equation, molar volume, and the laws of Gay-Lussac, Dalton and Graham'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://edupadi.com/classroom/l/gas-laws
  - https://schoolings.org/chemistry-lesson-note-for-ss1-second-term/
  - https://myschool.ng/classroom/chemistry
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. This is lesson two of two on the gas laws: the ideal gas equation, molar volume, and the laws of Gay-Lussac, Dalton and Graham.'
    write: 'The ideal gas equation, molar volume, and the laws of Gay-Lussac, Dalton and Graham'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson you met Boyle''s law, Charles''s law, the pressure law and the general gas equation, with T in kelvin. Now we bring in moles, then mixtures of gases and how fast gases spread.'
    write: 'Last lesson: $\dfrac{P_1V_1}{T_1} = \dfrac{P_2V_2}{T_2}$;  now: moles, mixtures, diffusion'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'By the end of this lesson you will be able to do two things. One, use PV = nRT, molar volume, vapour density and Gay-Lussac''s law of combining volumes.'
    write: '1. $PV = nRT$, molar volume, vapour density, Gay-Lussac''s law'
  - say: 'Two, use Dalton''s law of partial pressures and Graham''s law of diffusion, and avoid the traps JAMB sets.'
    write: '2. Dalton''s law, Graham''s law, the JAMB traps'

  # ---------------------------------------------------------------- ideal gas equation
  - section: 'Ideal gas equation'
    say: 'The ideal gas equation is PV = nRT. Here n is the number of moles, T is in kelvin, and R is the molar gas constant.'
    write: 'Ideal gas equation: $PV = nRT$'
    point:
      - {line: 4, kind: circle, at: 'Ideal gas equation'}
  - say: 'R is 8.314 joules per kelvin per mole, when P is in pascals and V is in cubic metres. With atmospheres and cubic decimetres, R is 0.082.'
    write: 'R = 8.314 J K⁻¹ mol⁻¹, or 0.082 atm dm³ K⁻¹ mol⁻¹'
  - say: 'Let us solve this. Find the volume of 0.5 moles of a gas at 27 degrees Celsius and 1 atmosphere. Divide both sides of PV = nRT by P. T is 300 kelvin, and R is 0.082, because P is in atmospheres.'
    write: 'Example: 0.5 mol, 27 °C, 1 atm:  $V = \dfrac{nRT}{P} = \dfrac{0.5 \times 0.082 \times 300}{1}$ dm³'
  - say: '0.5 times 0.082 is 0.041, and 0.041 times 300 is 12.3. So the volume is 12.3 cubic decimetres.'
    write: '$V = 0.041 \times 300$, $\therefore V = 12.3$ dm³'

  # ---------------------------------------------------------------- molar volume and vapour density
  - section: 'Molar volume and vapour density'
    say: 'You met Avogadro''s law and the molar volume in the lesson on the mole. One mole of any gas fills 22.4 cubic decimetres at s.t.p. PV = nRT agrees: 1 times 0.082 times 273, over 1, is about 22.4.'
    write: 'Molar volume at s.t.p. = 22.4 dm³  ($1 \times 0.082 \times 273 \approx 22.4$)'
    point:
      - {line: 8, kind: underline, at: '22.4 dm³'}
  - say: 'Use 22.4 only at s.t.p. Let us solve this. A gas occupies 11.2 cubic decimetres at 2 atmospheres and 273 degrees Celsius. How many moles is it? First bring it to s.t.p. T₁ is 273 plus 273, which is 546 kelvin.'
    write: 'Example: 11.2 dm³ at 2 atm, 273 °C = 546 K. Moles?'
  - say: 'V at s.t.p. is P₁V₁T₂ over T₁P₂, which is 2 times 11.2 times 273, over 546 times 1. 273 over 546 is a half, so this is 11.2 cubic decimetres.'
    write: '$V_{s.t.p.} = \dfrac{2 \times 11.2 \times 273}{546 \times 1} = 11.2$ dm³'
  - say: 'Now divide by the molar volume. 11.2 over 22.4 is 0.5 moles.'
    write: 'Moles $= \dfrac{11.2 \text{ dm}^3}{22.4 \text{ dm}^3 \text{ mol}^{-1}} = 0.5$ mol'
    point:
      - {line: 11, kind: circle, at: '0.5'}
  - say: 'Vapour density compares the mass of a gas with the mass of the same volume of hydrogen. Hydrogen, H₂, has a relative molecular mass of 2, so relative molecular mass is twice the vapour density.'
    write: 'Vapour density: compared with hydrogen, so $M_r = 2 \times$ V.D.'
  - say: 'Let us solve this. The relative molecular mass of CO₂ is 12 plus 2 times 16, which is 44. So its vapour density is 44 over 2, which is 22.'
    write: '$\ce{CO2}$: $M_r = 12 + 2(16) = 44$, so V.D. $= 44 \div 2 = 22$'

  # ---------------------------------------------------------------- Gay-Lussac
  - section: 'Gay-Lussac''s law'
    say: 'Gay-Lussac''s law of combining volumes, from the lesson on the mole, says gases react in simple ratios by volume, at the same temperature and pressure. The ratio comes from the balanced equation.'
    write: 'Gay-Lussac''s law: gases react in simple ratios by volume'
  - say: 'Let us solve this. 30 cubic centimetres of carbon(II) oxide burns in 25 cubic centimetres of oxygen. The equation says 2 volumes of CO use 1 volume of O₂, so 30 cubic centimetres of CO uses 15 of O₂.'
    write: '$\ce{2CO + O2 -> 2CO2}$: 30 cm³ of CO uses 30 ÷ 2 = 15 cm³ of $\ce{O2}$'
  - say: 'Oxygen left is 25 minus 15, which is 10 cubic centimetres. And 2 volumes of CO give 2 volumes of CO₂, so 30 cubic centimetres of CO₂ is formed.'
    write: '$\ce{O2}$ left = 25 − 15 = 10 cm³;  $\ce{CO2}$ formed = 30 cm³'

  # ---------------------------------------------------------------- Dalton
  - section: 'Dalton''s law'
    say: 'Dalton''s law of partial pressures states that the total pressure of a mixture of gases that do not react is the sum of their partial pressures. A partial pressure is the pressure one gas would exert if it were alone in the container.'
    write: 'Dalton''s law: $P_{total} = P_A + P_B + P_C + \dots$'
    doodle: {name: 'custom:sub_chem_gas_laws_a3', id: dia, size: scene, caption: 'a gas: P, V and T', 'on': mixture}
  - say: 'Look at the gas jar. A gas collected over water is wet. It holds water vapour, so the pressure inside is the gas''s pressure plus the water vapour pressure.'
    write: 'Gas over water: $P_{atm} = P_{gas} + P_{water}$'
    doodle_do:
      - {id: dia, op: pulse, part: jar-gas, 'on': jar}
      - {id: dia, op: pulse, part: water, 'on': vapour}
  - say: 'So the pressure of the dry gas is the atmospheric pressure minus the saturated vapour pressure, or s.v.p., of water at that temperature.'
    write: '$P_{dry\ gas} = P_{atm} - $ s.v.p. of water'
    doodle_do:
      - {id: dia, op: circle, part: dalton-tag, 'on': dry}
    point:
      - {line: 19, kind: underline, at: 's.v.p. of water'}
  - say: 'Let us solve this. Oxygen is collected over water at 20 degrees Celsius and 760 millimetres of mercury. The s.v.p. of water at 20 degrees Celsius is 17.5 millimetres of mercury. Subtract. 760 minus 17.5 is 742.5. So the dry oxygen exerts 742.5 millimetres of mercury. This is the P₁ you would put in the general gas equation.'
    write: 'Example: s.v.p. at 20 °C = 17.5 mmHg, so $P_{O_2} = 760 - 17.5 = 742.5$ mmHg'

  # ---------------------------------------------------------------- Graham
  - section: 'Graham''s law'
    say: 'Graham''s law of diffusion states that at the same temperature and pressure, the rate of diffusion of a gas is inversely proportional to the square root of its density.'
    write: 'Graham''s law: rate $\propto \dfrac{1}{\sqrt{\text{density}}}$'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_gas_laws_a4', 'on': diffusion}
  - say: 'Density goes with relative molecular mass, so we compare rates using masses. R₁ over R₂ equals the square root of M₂ over M₁. Notice the masses are upside down.'
    write: '$\dfrac{R_1}{R_2} = \sqrt{\dfrac{M_2}{M_1}}$'
    point:
      - {line: 22, kind: circle}
  - say: 'You met this tube in the kinetic theory lesson. The ring forms nearer HCl because the lighter NH₃ moves faster. Graham''s law puts a number on it.'
    write: 'The lighter gas diffuses faster: $\ce{NH3}$ (17) beats HCl (36.5)'
    doodle_do:
      - {id: dia, op: circle, part: ring, 'on': ring}
  - say: 'Let us solve this. Compare the rates of diffusion of hydrogen, mass 2, and oxygen, mass 32. 32 over 2 is 16, and the square root of 16 is 4. So hydrogen diffuses 4 times as fast as oxygen.'
    write: '$\dfrac{R_{H_2}}{R_{O_2}} = \sqrt{\dfrac{32}{2}} = \sqrt{16} = 4$, so $\ce{H2}$ is 4 times as fast'
  - say: 'Time goes the other way. The heavier gas takes longer, so for the same volume, t₁ over t₂ equals the square root of M₁ over M₂. If the volumes differ, first find each rate as volume divided by time.'
    write: '$\dfrac{t_1}{t_2} = \sqrt{\dfrac{M_1}{M_2}}$ (same volume);  rate = volume ÷ time'
  - say: 'Let us solve this. 50 cubic centimetres of methane, CH₄, mass 16, diffuses in 10 seconds. How long will 50 cubic centimetres of sulphur(IV) oxide, SO₂, mass 64, take?'
    write: 'Example: $\ce{CH4}$ (16) takes 10 s; $\ce{SO2}$ (64) takes ?'
  - say: 't for SO₂ over 10 seconds equals the square root of 64 over 16, which is the square root of 4, which is 2. So t is 2 times 10, which is 20 seconds. The heavier gas takes longer, which makes sense.'
    write: '$\dfrac{t}{10 \text{ s}} = \sqrt{\dfrac{64}{16}} = \sqrt{4} = 2$  $\therefore t = 2 \times 10 = 20$ s'

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'A Graham''s law trap. If X diffuses twice as fast as Y, square the ratio. The mass of Y is 2 squared, which is 4, times that of X. And a Dalton''s law trap. For a gas collected over water, take away the water vapour pressure first, before you use the general gas equation.'
    write: 'Graham: square the rate ratio, $2^2 = 4$;  over water: subtract the s.v.p. first'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Your turn. A gas has a vapour density of 16. What volume does 8 grams of it fill at s.t.p.? Pause and work it.'
    write: 'Check: V.D. = 16. Volume of 8 g at s.t.p.?'
  - say: 'Relative molecular mass is twice the vapour density, so 2 times 16 is 32. Moles are mass over molar mass, so 8 over 32 is 0.25 moles.'
    write: '$M_r = 2 \times 16 = 32$;  moles $= \dfrac{8 \text{ g}}{32 \text{ g mol}^{-1}} = 0.25$ mol'
  - say: 'At s.t.p. each mole fills 22.4 cubic decimetres. 0.25 times 22.4 is 5.6 cubic decimetres.'
    write: '$V = 0.25 \times 22.4 = 5.6$ dm³ ✓'
    point:
      - {line: 31, kind: circle, at: '5.6'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. PV = nRT brings in moles. One mole of gas fills 22.4 cubic decimetres at s.t.p., relative molecular mass is twice the vapour density, and gases react in simple volume ratios.'
    write: '1. $PV = nRT$; 22.4 dm³ at s.t.p.; $M_r = 2 \times$ V.D.; simple volume ratios'
  - say: 'Dalton, partial pressures add up, so take away the water vapour. Graham, the lighter gas diffuses faster. That''s the lesson. Next, try new questions on it.'
    write: '2. Dalton: pressures add; Graham: $\dfrac{R_1}{R_2} = \sqrt{\dfrac{M_2}{M_1}}$'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Under the same conditions, a gas X diffuses 4 times as fast as sulphur(IV) oxide, $\ce{SO2}$ ($M_r$ = 64). What is the relative molecular mass of X?'
    answer: '4'
    accept: ['M = 4', 'Mr = 4', '4 g/mol', '4 g mol⁻¹']
    needs_working: false
    working:
      - 'Graham''s law: $\dfrac{R_X}{R_{SO_2}} = \sqrt{\dfrac{M_{SO_2}}{M_X}}$'
      - '$4 = \sqrt{\dfrac{64}{M_X}}$'
      - 'Square both sides: $16 = \dfrac{64}{M_X}$'
      - '$M_X = 64 \div 16 = 4$. The faster gas is the lighter one, which fits.'
