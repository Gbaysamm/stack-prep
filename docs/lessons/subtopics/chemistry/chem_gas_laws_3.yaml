# The general gas equation (lesson 3 of 7): s.t.p. taught first, then the three laws joined into one equation, worked step by step to s.t.p., the laws side by side, and a real JAMB question with its traps.
format_version: 1
subject: chemistry
subtopic: 'The gas laws'
subtopic_id: 475d9837-e728-5acf-99be-2a5313095800
part: 3
title: 'The general gas equation'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://edupadi.com/classroom/l/gas-laws
  - https://schoolings.org/chemistry-lesson-note-for-ss1-second-term/
  - https://myschool.ng/classroom/chemistry
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is the general gas equation.'
    write: 'The general gas equation'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last two lessons, each law kept one thing constant. Boyle''s law kept the temperature constant, and Charles''s law and the pressure law kept the pressure or the volume constant. But often pressure, volume and temperature all change at once.'
    write: 'Often P, V and T all change at once'
    doodle: {name: 'custom:sub_chem_gas_laws_a2', id: dia, size: scene, caption: 'a gas: P, V and T', 'on': often}
    doodle_do:
      - {id: dia, op: show, part: flame, 'on': change}
      - {id: dia, op: show, part: temp-tag, 'on': once}

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn what s.t.p. is, and how to use the general gas equation when all three change.'
    write: 'Today: s.t.p. and the general gas equation'

  # ---------------------------------------------------------------- s.t.p.
  - section: 's.t.p.'
    say: 'To compare gases fairly, chemists use one standard set of conditions. It is called standard temperature and pressure, or s.t.p.'
    write: 's.t.p.: standard temperature and pressure'
  - say: 'Standard temperature is 0 degrees Celsius, which is 273 kelvin.'
    write: 'Standard temperature: 0 °C = 273 K'
  - say: 'Standard pressure is 760 millimetres of mercury. That is 1 atmosphere, or about 101 000 pascals.'
    write: 'Standard pressure: 760 mmHg = 1 atm = 1.01 × 10⁵ Pa'
    point:
      - {line: 5, kind: underline, at: '760 mmHg'}

  # ---------------------------------------------------------------- general gas equation
  - section: 'General gas equation'
    say: 'Now we join the three laws. Boyle''s law has P times V, and the other two laws divide by T. Put together, P times V over T stays constant for a fixed mass of gas.'
    write: '$\dfrac{PV}{T} = \text{constant}$ for a fixed mass of gas'
    doodle_do:
      - {id: dia, op: pulse, part: pressure-tag, 'on': P}
      - {id: dia, op: pulse, part: volume-tag, 'on': V}
      - {id: dia, op: pulse, part: temp-tag, 'on': T}
  - say: 'From state one to state two, this gives the general gas equation. P₁V₁ over T₁ equals P₂V₂ over T₂.'
    write: 'General gas equation: $\dfrac{P_1V_1}{T_1} = \dfrac{P_2V_2}{T_2}$'
    point:
      - {line: 7, kind: circle, at: 'General gas equation'}
  - say: 'Each earlier law is hidden inside it. For example, if the temperature stays the same, T₁ and T₂ cancel, and we are back to Boyle''s law, P₁V₁ = P₂V₂.'
    write: 'Same T: $T_1$ and $T_2$ cancel, leaving $P_1V_1 = P_2V_2$'

  # ---------------------------------------------------------------- worked example
  - section: 'Worked example'
    say: 'Let us solve this. 380 cubic centimetres of a gas is collected at 27 degrees Celsius and 800 millimetres of mercury. Find its volume at s.t.p.'
    write: 'Example: 380 cm³ at 27 °C and 800 mmHg. Volume at s.t.p.?'
  - say: 'First we list state one. P₁ is 800 millimetres of mercury, V₁ is 380 cubic centimetres, and T₁ is 27 plus 273, which is 300 kelvin.'
    write: '$P_1 = 800$ mmHg, $V_1 = 380$ cm³, $T_1 = 300$ K'
  - say: 'State two is s.t.p. So P₂ is 760 millimetres of mercury, T₂ is 273 kelvin, and V₂ is what we must find.'
    write: '$P_2 = 760$ mmHg, $T_2 = 273$ K, $V_2 = ?$'
  - say: 'We want V₂ on its own, so we multiply both sides by T₂ and divide by P₂. Then we put in the numbers. The millimetres of mercury cancel, and so do the kelvins.'
    write: '$V_2 = \dfrac{P_1V_1T_2}{T_1P_2} = \dfrac{800 \times 380 \times 273}{300 \times 760}$ cm³'
  - say: 'We simplify step by step. 380 over 760 is a half, and 800 times a half is 400.'
    write: '$\dfrac{380}{760} = \dfrac{1}{2}$, so $800 \times \dfrac{1}{2} = 400$'
  - say: 'Then 400 times 273 is 109 200, and 109 200 divided by 300 is 364. So the volume at s.t.p. is 364 cubic centimetres.'
    write: '$V_2 = \dfrac{400 \times 273}{300} = \dfrac{109\,200}{300}$ cm³ $\therefore V_2 = 364$ cm³'
    point:
      - {line: 14, kind: circle, at: '364'}
  - say: 'What does this tell us? The gas was cooled, and its pressure was lowered. Cooling shrinks it, but lowering the pressure lets it expand. Here the cooling wins, so the volume fell from 380 to 364.'
    write: 'Cooled and less pressure: cooling wins, 380 → 364 cm³'

  # ---------------------------------------------------------------- comparison
  - section: 'Comparison'
    say: 'Here are the four laws side by side. Each of the first three keeps one thing constant. Every law is for a fixed mass of gas, and every temperature is in kelvin.'
    write: 'Every law: a fixed mass of gas, T in kelvin'
    diagram:
      id: t
      kind: table
      'on': side
      columns: [Law, Kept constant, Equation]
      rows:
        - ['Boyle', 'temperature', 'P₁V₁ = P₂V₂']
        - ['Charles', 'pressure', 'V₁/T₁ = V₂/T₂']
        - ['Pressure law', 'volume', 'P₁/T₁ = P₂/T₂']
        - ['General', 'mass only', 'P₁V₁/T₁=P₂V₂/T₂']

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is a real JAMB question. 200 cubic centimetres of a gas at 25 degrees Celsius exerts a pressure of 700 millimetres of mercury. Find its pressure at 350 cubic centimetres and 75 degrees Celsius.'
    write: 'JAMB: 200 cm³, 25 °C, 700 mmHg, then 350 cm³, 75 °C. Pressure?'
  - say: 'We must find P₂. First change the temperatures to kelvin, which gives 298 and 348. Then we make P₂ the subject, so P₂ is P₁V₁T₂ over T₁V₂.'
    write: '$P_2 = \dfrac{P_1V_1T_2}{T_1V_2} = \dfrac{700 \times 200 \times 348}{298 \times 350}$ mmHg'
  - say: '700 times 200 over 350 is 400. Then 400 times 348 is 139 200, and 139 200 over 298 is 467.11 millimetres of mercury. We round only at the end.'
    write: '$P_2 = \dfrac{400 \times 348}{298} = \dfrac{139\,200}{298} = 467.11$ mmHg'
    point:
      - {line: 19, kind: circle, at: '467.11'}
  - say: 'Now the traps among the options. The answer 400 forgets the temperature change altogether.'
    write: 'Trap: 400 mmHg leaves out the temperature change ✗'
    point:
      - {line: 20, kind: strike, at: '400 mmHg'}
  - say: 'The answer 342.53 comes from putting the temperatures upside down.'
    write: 'Trap: 342.53 mmHg has the temperatures upside down ✗'
    point:
      - {line: 21, kind: strike, at: '342.53 mmHg'}
  - say: 'And using 25 and 75 without adding 273 gives 1200, which is far too big.'
    write: 'Trap: 1200 mmHg uses °C, not kelvin ✗'
    point:
      - {line: 22, kind: strike, at: '1200 mmHg'}

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. A gas occupies 300 cubic centimetres at 27 degrees Celsius and 1 atmosphere. Find its volume at 127 degrees Celsius and 2 atmospheres. Pause the lesson and work it out.'
    write: 'Check: 300 cm³ at 27 °C, 1 atm. Volume at 127 °C, 2 atm?'
  - say: 'In kelvin, T₁ is 300 and T₂ is 400. V₂ is P₁V₁T₂ over T₁P₂, which is 1 times 300 times 400, over 300 times 2.'
    write: '$V_2 = \dfrac{1 \times 300 \times 400}{300 \times 2}$ cm³'
  - say: 'The 300s cancel, and 400 over 2 is 200. So the new volume is 200 cubic centimetres.'
    write: '$V_2 = \dfrac{400}{2} = 200$ cm³ ✓'
    point:
      - {line: 25, kind: circle, at: '200'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. s.t.p. is 273 kelvin and 760 millimetres of mercury.'
    write: '1. s.t.p. = 273 K and 760 mmHg'
  - say: 'When pressure, volume and temperature all change, use the general gas equation, with T in kelvin, and round only at the end. In the next lesson, we bring in the number of moles. Now try the problem.'
    write: '2. $\dfrac{P_1V_1}{T_1} = \dfrac{P_2V_2}{T_2}$, T in kelvin'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'A gas occupies 120 cm³ at 27 °C and 750 mmHg. Find its volume at s.t.p. (273 K, 760 mmHg), to the nearest cm³.'
    answer: '108 cm³'
    accept: ['108', '108cm³', '108 cm3', '107.8', '107.8 cm³', '107.76']
    needs_working: true
    working:
      - 'General gas equation: $\dfrac{P_1V_1}{T_1} = \dfrac{P_2V_2}{T_2}$, so $V_2 = \dfrac{P_1V_1T_2}{T_1P_2}$.'
      - '$T_1 = 27 + 273 = 300$ K; $P_1 = 750$ mmHg, $V_1 = 120$ cm³; $P_2 = 760$ mmHg, $T_2 = 273$ K.'
      - '$V_2 = \dfrac{750 \times 120 \times 273}{300 \times 760}$'
      - '$750 \times 120 = 90\,000$; $90\,000 \times 273 = 24\,570\,000$; $300 \times 760 = 228\,000$.'
      - '$V_2 = 24\,570\,000 \div 228\,000 = 107.76$ cm³, so 108 cm³ to the nearest cm³.'
