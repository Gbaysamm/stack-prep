# The ideal gas equation and molar volume (lesson 4 of 7): PV = nRT with its constant R, the molar volume of 22.4 dm³ at s.t.p., and vapour density, each stated and worked step by step.
format_version: 1
subject: chemistry
subtopic: 'The gas laws'
subtopic_id: 475d9837-e728-5acf-99be-2a5313095800
part: 4
title: 'The ideal gas equation and molar volume'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
