moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is the ideal gas equation and molar volume.'
    write: 'The ideal gas equation and molar volume'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson, the general gas equation linked pressure, volume and temperature for a fixed mass of gas. Now we bring in how much gas there is, measured in moles.'
    write: 'Last lesson: P, V and T. Today: the amount of gas, in moles'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn to use the ideal gas equation, the molar volume at s.t.p., and vapour density.'
    write: 'Today: $PV = nRT$, molar volume and vapour density'

  # ---------------------------------------------------------------- ideal gas equation
  - section: 'Ideal gas equation'
    say: 'The ideal gas equation is PV = nRT. Here n is the number of moles of gas, T is the temperature in kelvin, and R is a fixed number called the molar gas constant.'
    write: 'Ideal gas equation: $PV = nRT$ (n = moles, T in K)'
    point:
      - {line: 3, kind: circle, at: 'Ideal gas equation'}
  - say: 'The value of R depends on the units. R is 8.314 joules per kelvin per mole, when P is in pascals and V is in cubic metres.'
    write: 'R = 8.314 J K⁻¹ mol⁻¹ (P in Pa, V in m³)'
  - say: 'When P is in atmospheres and V is in cubic decimetres, R is 0.082. A cubic decimetre is 1000 cubic centimetres.'
    write: 'R = 0.082 atm dm³ K⁻¹ mol⁻¹ (P in atm, V in dm³)'
    point:
      - {line: 5, kind: underline, at: '0.082'}

  # ---------------------------------------------------------------- worked example
  - section: 'Worked example'
    say: 'Let us solve this. Find the volume of 0.5 moles of a gas at 27 degrees Celsius and 1 atmosphere.'
    write: 'Example: volume of 0.5 mol at 27 °C and 1 atm?'
  - say: 'We are given n as 0.5 moles and P as 1 atmosphere. T is 27 plus 273, which is 300 kelvin. P is in atmospheres, so R is 0.082. We must find V.'
    write: '$n = 0.5$ mol, $P = 1$ atm, $T = 300$ K, $R = 0.082$, $V = ?$'
  - say: 'We want V on its own, so we divide both sides of PV = nRT by P. Then we put in the numbers.'
    write: '$V = \dfrac{nRT}{P} = \dfrac{0.5 \times 0.082 \times 300}{1}$ dm³'
  - say: '0.5 times 0.082 is 0.041, and 0.041 times 300 is 12.3. So the volume is 12.3 cubic decimetres.'
    write: '$V = 0.041 \times 300$, $\therefore V = 12.3$ dm³'
    point:
      - {line: 9, kind: circle, at: '12.3'}

  # ---------------------------------------------------------------- molar volume
  - section: 'Molar volume'
    say: 'You met the molar volume in the lesson on the mole. One mole of any gas fills 22.4 cubic decimetres at s.t.p.'
    write: 'Molar volume: 1 mol of any gas = 22.4 dm³ at s.t.p.'
    point:
      - {line: 10, kind: underline, at: '22.4 dm³ at s.t.p.'}
  - say: 'PV = nRT agrees. At s.t.p., P is 1 atmosphere and T is 273 kelvin, so V for 1 mole is 1 times 0.082 times 273, over 1. That is about 22.4.'
    write: '$V = \dfrac{1 \times 0.082 \times 273}{1} \approx 22.4$ dm³'
  - say: 'So, at s.t.p., the number of moles is the volume divided by 22.4 cubic decimetres. But use 22.4 only at s.t.p.'
    write: 'At s.t.p. only: moles = volume ÷ 22.4 dm³'
  - say: 'Let us solve this. A gas occupies 11.2 cubic decimetres at 2 atmospheres and 273 degrees Celsius. How many moles of gas is this?'
    write: 'Example: 11.2 dm³ at 2 atm and 273 °C. Moles?'
  - say: 'These are not s.t.p. conditions, so first we bring the volume to s.t.p. with the general gas equation. T₁ is 273 plus 273, which is 546 kelvin.'
    write: 'Not s.t.p.: $P_1 = 2$ atm, $V_1 = 11.2$ dm³, $T_1 = 546$ K'
  - say: 'V at s.t.p. is P₁V₁T₂ over T₁P₂, which is 2 times 11.2 times 273, over 546 times 1. 273 over 546 is a half, and 2 times a half is 1, so the volume at s.t.p. is 11.2 cubic decimetres.'
    write: '$V_{s.t.p.} = \dfrac{2 \times 11.2 \times 273}{546 \times 1} = 11.2$ dm³'
  - say: 'Now we divide by the molar volume. 11.2 over 22.4 is 0.5, so this is 0.5 moles of gas.'
    write: 'Moles $= \dfrac{11.2 \text{ dm}^3}{22.4 \text{ dm}^3 \text{ mol}^{-1}} = 0.5$ mol'
    point:
      - {line: 16, kind: circle, at: '0.5'}

  # ---------------------------------------------------------------- vapour density
  - section: 'Vapour density'
    say: 'Vapour density compares the mass of a gas with the mass of the same volume of hydrogen, at the same temperature and pressure.'
    write: 'Vapour density (V.D.): mass of a gas ÷ mass of the same volume of hydrogen'
  - say: 'A hydrogen molecule, H₂, has a relative molecular mass of 2. So the relative molecular mass of a gas is twice its vapour density.'
    write: 'Hydrogen ($\ce{H2}$) has $M_r = 2$, so $M_r = 2 \times$ V.D.'
    point:
      - {line: 18, kind: underline, at: '$M_r = 2 \times$ V.D.'}
  - say: 'Let us solve this. Find the vapour density of carbon(IV) oxide, CO₂. Its relative molecular mass is 12 plus 2 times 16, which is 44. So its vapour density is 44 over 2, which is 22.'
    write: 'Carbon(IV) oxide ($\ce{CO2}$): $M_r = 12 + 2(16) = 44$, so V.D. $= 44 \div 2 = 22$'

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here are two traps. First, R must match the units. With P in atmospheres and V in cubic decimetres, use 0.082, not 8.314.'
    write: 'Trap: atm and dm³ need R = 0.082, not 8.314'
  - say: 'Second, 22.4 cubic decimetres is the molar volume only at s.t.p. At any other temperature or pressure, bring the volume to s.t.p. first, or use PV = nRT.'
    write: 'Trap: 22.4 dm³ only at s.t.p.'
    point:
      - {line: 21, kind: underline, at: 'only at s.t.p.'}

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. A gas has a vapour density of 16. What volume does 8 grams of it fill at s.t.p.? Pause the lesson and work it out.'
    write: 'Check: V.D. = 16. Volume of 8 g at s.t.p.?'
  - say: 'Relative molecular mass is twice the vapour density, so 2 times 16 is 32. The number of moles is the mass over the molar mass, so 8 over 32 is 0.25 moles.'
    write: '$M_r = 2 \times 16 = 32$;  moles $= \dfrac{8 \text{ g}}{32 \text{ g mol}^{-1}} = 0.25$ mol'
  - say: 'At s.t.p. each mole fills 22.4 cubic decimetres, so 0.25 times 22.4 is 5.6 cubic decimetres.'
    write: '$V = 0.25 \times 22.4 = 5.6$ dm³ ✓'
    point:
      - {line: 24, kind: circle, at: '5.6'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. The ideal gas equation, PV = nRT, brings in the number of moles, with R to match the units.'
    write: '1. $PV = nRT$; R = 0.082 with atm and dm³'
  - say: 'One mole of any gas fills 22.4 cubic decimetres at s.t.p., and relative molecular mass is twice the vapour density. In the next lesson, we see how gases react by volume. Now try the problem.'
    write: '2. 22.4 dm³ per mole at s.t.p.; $M_r = 2 \times$ V.D.'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'A gas has a vapour density of 22. What is the mass of 11.2 dm³ of the gas at s.t.p.?'
    answer: '22 g'
    accept: ['22', '22g', '22 grams']
    needs_working: true
    working:
      - '$M_r = 2 \times$ V.D. $= 2 \times 22 = 44$, so the molar mass is 44 g mol⁻¹.'
      - 'At s.t.p., moles = volume ÷ 22.4 dm³ = 11.2 ÷ 22.4 = 0.5 mol.'
      - 'Mass = moles × molar mass = 0.5 × 44 = 22 g.'
