# Gay-Lussac's law of combining volumes (lesson 5 of 7): the law stated and tied to Avogadro's law, then reacting volumes read from the balanced equation, worked step by step, with a gas left over.
format_version: 1
subject: chemistry
subtopic: 'The gas laws'
subtopic_id: 475d9837-e728-5acf-99be-2a5313095800
part: 5
title: 'Gay-Lussac''s law of combining volumes'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://edupadi.com/classroom/l/gas-laws
  - https://schoolings.org/chemistry-lesson-note-for-ss1-second-term/
  - https://myschool.ng/classroom/chemistry
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is Gay-Lussac''s law of combining volumes.'
    write: 'Gay-Lussac''s law of combining volumes'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson, you saw that one mole of any gas fills the same volume at s.t.p. So when gases react, their volumes tell us how many moles react, and we can work with volumes instead of masses.'
    write: 'Gases react: work with volumes instead of masses'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn Gay-Lussac''s law, and how to find the volumes of gases that react and form.'
    write: 'Today: Gay-Lussac''s law and reacting volumes'

  # ---------------------------------------------------------------- the law
  - section: 'Gay-Lussac''s law'
    say: 'Gay-Lussac''s law states that when gases react, the volumes of the gases that react and of any gases formed are in a simple ratio of whole numbers, at the same temperature and pressure.'
    write: 'Gay-Lussac''s law: reacting gases and gas products are in simple whole-number ratios by volume'
    point:
      - {line: 3, kind: underline, at: 'simple whole-number ratios'}
  - say: 'Why does this happen? It follows from Avogadro''s law, which you met in the lesson on the mole. Avogadro''s law says that equal volumes of gases, at the same temperature and pressure, hold equal numbers of molecules.'
    write: 'Avogadro: equal volumes hold equal numbers of molecules'
  - say: 'So if one gas has twice the volume of another, it has twice as many molecules. The ratio of volumes is the same as the ratio of molecules, and the balanced equation gives that ratio as the numbers in front of each gas.'
    write: 'Volume ratio = the numbers in the balanced equation'

  # ---------------------------------------------------------------- worked example 1
  - section: 'Worked example'
    say: 'Let us use the law. 10 cubic centimetres of nitrogen reacts with hydrogen to form ammonia, all gases at the same temperature and pressure. Find the volume of hydrogen used and the volume of ammonia formed.'
    write: 'Example: 10 cm³ nitrogen ($\ce{N2}$) + hydrogen ($\ce{H2}$) → ammonia ($\ce{NH3}$)'
  - say: 'First we write the balanced equation, N₂ + 3H₂ gives 2NH₃. It says that one nitrogen molecule reacts with three hydrogen molecules to give two ammonia molecules.'
    write: '$\ce{N2 + 3H2 -> 2NH3}$'
  - say: 'So the volumes of nitrogen, hydrogen and ammonia are in the ratio 1 to 3 to 2.'
    write: 'Volumes: $\ce{N2}$ : $\ce{H2}$ : $\ce{NH3}$ = 1 : 3 : 2'
  - say: 'We have 10 cubic centimetres of nitrogen. The hydrogen used is 3 times that, so 30 cubic centimetres of hydrogen is used.'
    write: '$\ce{H2}$ used = 3 × 10 = 30 cm³'
  - say: 'The ammonia formed is 2 times the nitrogen, so 20 cubic centimetres of ammonia is formed.'
    write: '$\ce{NH3}$ formed = 2 × 10 = 20 cm³'
    point:
      - {line: 10, kind: circle, at: '20 cm³'}
  - say: 'What does this tell us? 10 and 30 make 40 cubic centimetres of gas going in, but only 20 cubic centimetres comes out. The total volume of gas can change in a reaction, because four molecules join up to make only two.'
    write: '40 cm³ in, 20 cm³ out: the total volume can change'

  # ---------------------------------------------------------------- worked example 2: one gas left over
  - section: 'A gas left over'
    say: 'Often one gas is in excess, which means there is more of it than the reaction needs, so some of it is left over. Let us solve this. 30 cubic centimetres of carbon(II) oxide burns in 25 cubic centimetres of oxygen. Find the volume of each gas at the end, at the same temperature and pressure.'
    write: 'Example: 30 cm³ carbon(II) oxide (CO) + 25 cm³ oxygen ($\ce{O2}$). Gases at the end?'
  - say: 'The balanced equation is 2CO + O₂ gives 2CO₂. So the volumes of carbon(II) oxide, oxygen and carbon(IV) oxide are in the ratio 2 to 1 to 2.'
    write: '$\ce{2CO + O2 -> 2CO2}$: CO : $\ce{O2}$ : $\ce{CO2}$ = 2 : 1 : 2'
  - say: 'To find which gas is left over, we ask how much oxygen the 30 cubic centimetres of carbon(II) oxide needs. The oxygen used is half the carbon(II) oxide, so 30 divided by 2 is 15 cubic centimetres.'
    write: '$\ce{O2}$ used = 30 ÷ 2 = 15 cm³'
  - say: 'We had 25 cubic centimetres of oxygen, which is more than enough, so all the carbon(II) oxide burns. The oxygen left over is 25 minus 15, which is 10 cubic centimetres.'
    write: '$\ce{O2}$ left = 25 − 15 = 10 cm³'
    point:
      - {line: 15, kind: circle, at: '10 cm³'}
  - say: 'And 2 volumes of carbon(II) oxide give 2 volumes of carbon(IV) oxide, so 30 cubic centimetres of carbon(IV) oxide is formed.'
    write: 'Carbon(IV) oxide ($\ce{CO2}$) formed = 30 cm³'
  - say: 'So at the end there are 10 cubic centimetres of oxygen and 30 of carbon(IV) oxide, which is 40 cubic centimetres of gas in all.'
    write: 'At the end: 10 cm³ $\ce{O2}$ + 30 cm³ $\ce{CO2}$ = 40 cm³'

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is the trap. Some students simply add 30 and 25 and give 55 cubic centimetres. But when gases react, their volumes do not simply add. The rule is to use the ratio from the balanced equation, then count the gas formed and any gas left over.'
    write: 'Trap: 30 + 25 = 55 cm³ ✗. Use the equation, and count what is left'
    point:
      - {line: 18, kind: strike, at: '55 cm³'}
  - say: 'Also note that water formed at room temperature is a liquid. Its volume is so small compared with a gas that we do not count it with the gas volumes.'
    write: 'Water at room temperature is a liquid: not counted as gas'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. 20 cubic centimetres of hydrogen burns in 20 cubic centimetres of oxygen, and the water formed is cooled to a liquid. What volume of oxygen is left over? Pause the lesson and work it out.'
    write: 'Check: 20 cm³ $\ce{H2}$ + 20 cm³ $\ce{O2}$. Oxygen left?'
  - say: 'The equation is 2H₂ + O₂ gives 2H₂O. So 2 volumes of hydrogen use 1 volume of oxygen, which means the oxygen used is half the hydrogen. Half of 20 is 10 cubic centimetres.'
    write: '$\ce{2H2 + O2 -> 2H2O}$: $\ce{O2}$ used = 20 ÷ 2 = 10 cm³'
  - say: 'The water is now a liquid, so we do not count it. The oxygen left over is 20 minus 10, which is 10 cubic centimetres.'
    write: '$\ce{O2}$ left = 20 − 10 = 10 cm³ ✓'
    point:
      - {line: 22, kind: circle, at: '10 cm³'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. Gay-Lussac''s law says gases react in simple whole-number ratios by volume, at the same temperature and pressure.'
    write: '1. Gases react in simple whole-number ratios by volume'
  - say: 'The ratio of volumes is the ratio of the numbers in front of each gas in the balanced equation, and any gas in excess is left over. In the next lesson, we look at mixtures of gases. Now try the problem.'
    write: '2. Ratio from the balanced equation; count the gas left over'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: '10 cm³ of methane burns in 50 cm³ of oxygen: $\ce{CH4 + 2O2 -> CO2 + 2H2O}$. What volume of oxygen is left unused?'
    answer: '30 cm³'
    accept: ['30', '30cm³', '30 cm3', '30 cm^3']
    needs_working: true
    working:
      - 'From the equation, $\ce{CH4}$ : $\ce{O2}$ = 1 : 2 by volume.'
      - 'Oxygen used = 2 × 10 = 20 cm³.'
      - 'Oxygen left = 50 − 20 = 30 cm³.'
