# Dalton's law of partial pressures (lesson 6 of 7): partial pressure taught first, the law stated and worked for a mixture, then a gas collected over water and the saturated vapour pressure taken away, each step guided.
format_version: 1
subject: chemistry
subtopic: 'The gas laws'
subtopic_id: 475d9837-e728-5acf-99be-2a5313095800
part: 6
title: 'Dalton''s law of partial pressures'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://edupadi.com/classroom/l/gas-laws
  - https://schoolings.org/chemistry-lesson-note-for-ss1-second-term/
  - https://myschool.ng/classroom/chemistry
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is Dalton''s law of partial pressures.'
    write: 'Dalton''s law of partial pressures'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson, the gases reacted with each other. Now we look at a mixture of gases that do not react, such as the air, and ask what pressure the mixture exerts.'
    write: 'A mixture of gases that do not react: what pressure?'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn Dalton''s law, and how to find the pressure of a dry gas collected over water.'
    write: 'Today: Dalton''s law, and a gas collected over water'

  # ---------------------------------------------------------------- partial pressure
  - section: 'Partial pressure'
    say: 'In a mixture, each gas pushes on the walls of the container as if the others were not there. The partial pressure of a gas is the pressure it would exert if it were alone in the container.'
    write: 'Partial pressure: the pressure one gas would exert alone'
    point:
      - {line: 3, kind: underline, at: 'alone'}

  # ---------------------------------------------------------------- Dalton
  - section: 'Dalton''s law'
    say: 'Dalton''s law of partial pressures states that the total pressure of a mixture of gases that do not react is the sum of their partial pressures.'
    write: 'Dalton''s law: $P_{total} = P_A + P_B + P_C + \dots$'
    point:
      - {line: 4, kind: circle, at: '$P_{total} = P_A + P_B + P_C + \dots$'}
  - say: 'Let us solve this. A container holds nitrogen at a partial pressure of 600 millimetres of mercury and oxygen at 150 millimetres of mercury. Find the total pressure.'
    write: 'Example: nitrogen at 600 mmHg, oxygen at 150 mmHg. Total?'
  - say: 'By Dalton''s law, we add the partial pressures. 600 plus 150 is 750, so the total pressure is 750 millimetres of mercury.'
    write: '$P_{total} = 600 + 150 = 750$ mmHg'
    point:
      - {line: 6, kind: circle, at: '750'}

  # ---------------------------------------------------------------- gas over water
  - section: 'A gas collected over water'
    say: 'Dalton''s law matters most when a gas is collected over water. Look at the gas jar standing upside down in a trough of water. The gas bubbles in and pushes the water down.'
    write: 'A gas collected over water'
    doodle: {name: 'custom:sub_chem_gas_laws_a3', id: dia, size: scene, caption: 'a gas collected over water', 'on': jar}
    doodle_do:
      - {id: dia, op: show, part: dalton-tag, 'on': collected}
      - {id: dia, op: show, part: jar-gas, 'on': bubbles}
  - say: 'But some water also evaporates into the jar. So the gas collected is wet. It is a mixture of the gas and water vapour.'
    write: 'The gas is wet: gas + water vapour'
    doodle_do:
      - {id: dia, op: pulse, part: water, 'on': water}
  - say: 'When the water levels inside and outside are the same, the pressure in the jar equals the atmospheric pressure. By Dalton''s law, that pressure is the gas''s pressure plus the water vapour''s pressure.'
    write: '$P_{atm} = P_{gas} + P_{water\ vapour}$'
    doodle_do:
      - {id: dia, op: show, part: sum-tag, 'on': plus}
  - say: 'The pressure of the water vapour is called the saturated vapour pressure of water, or s.v.p. It depends only on the temperature, and the question gives it to you.'
    write: 's.v.p.: the pressure of the water vapour; it depends on temperature'
  - say: 'So the pressure of the dry gas is the atmospheric pressure minus the s.v.p. of water at that temperature.'
    write: '$P_{dry\ gas} = P_{atm} - $ s.v.p. of water'
    doodle_do:
      - {id: dia, op: circle, part: sum-tag, 'on': minus}
    point:
      - {line: 11, kind: underline, at: 's.v.p. of water'}

  # ---------------------------------------------------------------- worked example
  - section: 'Worked example'
    say: 'Let us solve this. Oxygen is collected over water at 20 degrees Celsius and 760 millimetres of mercury. The s.v.p. of water at 20 degrees Celsius is 17.5 millimetres of mercury. Find the pressure of the dry oxygen.'
    write: 'Example: over water at 20 °C, 760 mmHg; s.v.p. = 17.5 mmHg. Dry oxygen?'
  - say: 'We are given the atmospheric pressure, 760, and the s.v.p., 17.5. The dry oxygen pressure is 760 minus 17.5, which is 742.5 millimetres of mercury.'
    write: '$P_{\ce{O2}} = 760 - 17.5 = 742.5$ mmHg'
    point:
      - {line: 13, kind: circle, at: '742.5'}
  - say: 'What does this tell us? Only 742.5 of the 760 millimetres comes from the oxygen. This is the P₁ you would put in the general gas equation to find the volume of dry oxygen at s.t.p.'
    write: '742.5 mmHg is the $P_1$ for the general gas equation'

  # ---------------------------------------------------------------- trap
  - section: 'JAMB trap'
    say: 'Here is the trap. For a gas collected over water, many students put the full atmospheric pressure into the general gas equation. Take away the s.v.p. of water first.'
    write: 'Trap: over water, subtract the s.v.p. first'
    point:
      - {line: 15, kind: underline, at: 'subtract the s.v.p. first'}

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Air at 760 millimetres of mercury holds nitrogen at 600 millimetres of mercury, other gases at 10 millimetres of mercury, and oxygen. What is the partial pressure of the oxygen? Pause the lesson and work it out.'
    write: 'Check: total 760 mmHg; nitrogen 600, other gases 10. Oxygen?'
  - say: 'The partial pressures add up to the total. So the oxygen is 760 minus 600 minus 10, which is 150 millimetres of mercury.'
    write: '$P_{\ce{O2}} = 760 - 600 - 10 = 150$ mmHg ✓'
    point:
      - {line: 17, kind: circle, at: '150'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. Dalton''s law says the total pressure of a mixture of gases that do not react is the sum of their partial pressures.'
    write: '1. $P_{total}$ = the sum of the partial pressures'
  - say: 'For a gas collected over water, take away the s.v.p. of water to get the pressure of the dry gas. In the next lesson, we see how fast gases spread. Now try the problem.'
    write: '2. Over water: $P_{dry\ gas} = P_{atm} - $ s.v.p.'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Hydrogen is collected over water at 25 °C and 755 mmHg. The s.v.p. of water at 25 °C is 24 mmHg. What is the pressure of the dry hydrogen?'
    answer: '731 mmHg'
    accept: ['731', '731mmHg', '731 mm Hg']
    needs_working: false
    working:
      - 'Dalton''s law: $P_{atm} = P_{hydrogen} + $ s.v.p. of water.'
      - '$P_{hydrogen} = 755 - 24 = 731$ mmHg.'
