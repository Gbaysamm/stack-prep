# Graham's law of diffusion (lesson 7 of 7): diffusion recalled, the law stated, the rate ratio from molar masses shown on the ammonia and hydrogen chloride tube, then times compared, each worked step by step, with JAMB's squaring trap.
format_version: 1
subject: chemistry
subtopic: 'The gas laws'
subtopic_id: 475d9837-e728-5acf-99be-2a5313095800
part: 7
title: 'Graham''s law of diffusion'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://edupadi.com/classroom/l/gas-laws
  - https://schoolings.org/chemistry-lesson-note-for-ss1-second-term/
  - https://myschool.ng/classroom/chemistry
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is Graham''s law of diffusion.'
    write: 'Graham''s law of diffusion'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson, gases were mixed together in a container. Now we ask how fast a gas spreads out on its own.'
    write: 'How fast does a gas spread?'
  - say: 'You met diffusion in the kinetic theory lesson. Diffusion is the spreading of gas particles from where there are many of them to where there are few.'
    write: 'Diffusion: particles spread from where there are many to where there are few'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn Graham''s law, and how to use it to compare the rates and times of diffusion of two gases.'
    write: 'Today: Graham''s law, comparing rates and times'

  # ---------------------------------------------------------------- Graham
  - section: 'Graham''s law'
    say: 'Graham''s law of diffusion states that at the same temperature and pressure, the rate of diffusion of a gas is inversely proportional to the square root of its density.'
    write: 'Graham''s law: rate $\propto \dfrac{1}{\sqrt{\text{density}}}$'
    point:
      - {line: 4, kind: underline, at: 'rate'}
  - say: 'In plain words, a heavier gas diffuses more slowly, and a lighter gas diffuses faster.'
    write: 'Heavier gas: slower. Lighter gas: faster'
  - say: 'The density of a gas goes with its relative molecular mass, M. So we compare the rates of two gases using their masses. R₁ over R₂ equals the square root of M₂ over M₁.'
    write: '$\dfrac{R_1}{R_2} = \sqrt{\dfrac{M_2}{M_1}}$'
    point:
      - {line: 6, kind: circle}
  - say: 'Notice that the masses are upside down. Gas 1''s rate is on top on the left, but gas 2''s mass is on top on the right.'
    write: 'Masses upside down: $M_2$ on top'

  # ---------------------------------------------------------------- the tube
  - section: 'The tube'
    say: 'Here is the experiment from the kinetic theory lesson. A long glass tube has cotton wool soaked in ammonia at one end.'
    write: 'Ammonia ($\ce{NH3}$) at one end of a tube'
    doodle: {name: 'custom:sub_chem_gas_laws_a4', id: dia, size: scene, caption: 'which gas spreads faster?', 'on': tube}
    doodle_do:
      - {id: dia, op: show, part: nh3-end, 'on': ammonia}
  - say: 'At the other end is cotton wool soaked in hydrogen chloride.'
    write: 'Hydrogen chloride (HCl) at the other end'
    doodle_do:
      - {id: dia, op: show, part: hcl-end, 'on': chloride}
  - say: 'Where the two gases meet, a white ring of ammonium chloride forms. It forms nearer the hydrogen chloride end, so the ammonia has travelled further.'
    write: 'The white ring forms nearer the HCl end'
    doodle_do:
      - {id: dia, op: show, part: ring, 'on': ring}
  - say: 'Ammonia has a mass of 17, and hydrogen chloride has 36.5. The lighter ammonia diffuses faster, just as Graham''s law says.'
    write: 'Ammonia (17) is lighter than HCl (36.5), so faster'
    doodle_do:
      - {id: dia, op: circle, part: ring, 'on': faster}

  # ---------------------------------------------------------------- rates
  - section: 'Worked example'
    say: 'Graham''s law puts a number on it. Let us solve this. Compare the rates of diffusion of hydrogen, H₂, of mass 2, and oxygen, O₂, of mass 32.'
    write: 'Example: rates of hydrogen ($\ce{H2}$, 2) and oxygen ($\ce{O2}$, 32)?'
  - say: 'Gas 1 is hydrogen and gas 2 is oxygen. So R for hydrogen over R for oxygen is the square root of 32 over 2.'
    write: '$\dfrac{R_{H_2}}{R_{O_2}} = \sqrt{\dfrac{32}{2}}$'
  - say: '32 over 2 is 16, and the square root of 16 is 4. So hydrogen diffuses 4 times as fast as oxygen. The lighter gas is faster, which makes sense.'
    write: '$= \sqrt{16} = 4$, so hydrogen is 4 times as fast'
    point:
      - {line: 14, kind: circle, at: '4 times as fast'}

  # ---------------------------------------------------------------- times
  - section: 'Times'
    say: 'Time goes the other way. The heavier gas is slower, so it takes longer. For the same volume of gas, t₁ over t₂ equals the square root of M₁ over M₂.'
    write: 'Same volume: $\dfrac{t_1}{t_2} = \sqrt{\dfrac{M_1}{M_2}}$'
  - say: 'If the volumes are different, first find each rate as volume divided by time.'
    write: 'Volumes differ? Rate = volume ÷ time'
  - say: 'Let us solve this. 50 cubic centimetres of methane, CH₄, of mass 16, diffuses in 10 seconds. How long will 50 cubic centimetres of sulphur(IV) oxide, SO₂, of mass 64, take?'
    write: 'Example: methane ($\ce{CH4}$, 16) takes 10 s. Sulphur(IV) oxide ($\ce{SO2}$, 64)?'
  - say: 'The volumes are the same, so we use the times. The time for sulphur(IV) oxide over 10 seconds equals the square root of 64 over 16.'
    write: '$\dfrac{t}{10 \text{ s}} = \sqrt{\dfrac{64}{16}}$'
  - say: '64 over 16 is 4, and the square root of 4 is 2. So t is 2 times 10, which is 20 seconds. The heavier gas takes longer, which makes sense.'
    write: '$= \sqrt{4} = 2$  $\therefore t = 2 \times 10 = 20$ s'
    point:
      - {line: 19, kind: circle, at: '20'}

  # ---------------------------------------------------------------- trap
  - section: 'JAMB trap'
    say: 'Here is the trap. A question says that gas X diffuses twice as fast as gas Y, and asks how their masses compare. Many students answer 2. But the rates go with the square root of the masses, so we must square the ratio.'
    write: 'X twice as fast as Y? Square the ratio, do not stop at 2'
  - say: '2 squared is 4, so Y is 4 times as heavy as X.'
    write: '$2^2 = 4$: Y is 4 times as heavy as X'
    point:
      - {line: 21, kind: circle, at: '4 times as heavy'}

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. How many times as fast as methane, of mass 16, does helium, of mass 4, diffuse? Pause the lesson and work it out.'
    write: 'Check: helium (He, 4) against methane ($\ce{CH4}$, 16). How many times as fast?'
  - say: 'R for helium over R for methane is the square root of 16 over 4. That is the square root of 4, which is 2. So helium diffuses 2 times as fast.'
    write: '$\dfrac{R_{He}}{R_{CH_4}} = \sqrt{\dfrac{16}{4}} = \sqrt{4} = 2$ ✓'
    point:
      - {line: 23, kind: circle, at: '= 2'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. Graham''s law says the lighter gas diffuses faster. R₁ over R₂ is the square root of M₂ over M₁.'
    write: '1. $\dfrac{R_1}{R_2} = \sqrt{\dfrac{M_2}{M_1}}$: lighter is faster'
  - say: 'Times go the other way, and a rate ratio is squared to compare masses. That completes the gas laws. Now try the problem, and then some new questions on the whole topic.'
    write: '2. Times go the other way; square a rate ratio for the masses'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Under the same conditions, a gas X diffuses 4 times as fast as sulphur(IV) oxide, $\ce{SO2}$ ($M_r$ = 64). What is the relative molecular mass of X?'
    answer: '4'
    accept: ['M = 4', 'Mr = 4', '4 g/mol', '4 g mol⁻¹']
    needs_working: false
    working:
      - 'Graham''s law: $\dfrac{R_X}{R_{SO_2}} = \sqrt{\dfrac{M_{SO_2}}{M_X}}$'
      - '$4 = \sqrt{\dfrac{64}{M_X}}$'
      - 'Square both sides: $16 = \dfrac{64}{M_X}$'
      - '$M_X = 64 \div 16 = 4$. The faster gas is the lighter one, which fits.'
