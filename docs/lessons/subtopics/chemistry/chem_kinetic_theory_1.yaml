# The kinetic theory (lesson 1 of 6): the big picture of the topic, what the kinetic theory says, its five ideas for a gas on a container of moving particles, kelvin and proportion taught before the guided worked example.
format_version: 1
subject: chemistry
subtopic: 'Kinetic theory and changes of state'
subtopic_id: 702e0df2-1ca8-5737-8c9b-32846cd78f8f
part: 1
title: 'The kinetic theory'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://elearn.education.gov.ng
  - https://passnownow.com
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is the kinetic theory.'
    write: 'The kinetic theory'

  # ---------------------------------------------------------------- introduction: the big picture
  - section: 'Introduction'
    say: 'Everything around you is a solid, a liquid or a gas. Ice can melt into water, and water can boil away as steam. The kinetic theory explains all of this, using tiny particles that are always moving.'
    write: 'Matter is made of tiny particles that are always moving'
  - say: 'The word kinetic means to do with motion. In this topic, we use the theory to explain the three states of matter and how one state changes into another. JAMB asks about it almost every year.'
    write: 'Kinetic: to do with motion'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn the main ideas of the kinetic theory, and use them to compare the energy of particles at two temperatures.'
    write: 'Today: the ideas of the kinetic theory'

  # ---------------------------------------------------------------- the theory
  - section: 'Kinetic theory'
    say: 'The kinetic theory says that all matter is made of tiny particles, and that these particles are in constant motion.'
    write: 'Kinetic theory: matter is tiny particles in constant motion'
    point:
      - {line: 4, kind: underline, at: 'constant motion'}
  - say: 'These particles may be atoms, molecules or ions. Because they move, they have kinetic energy, which is the energy a body has because it is moving. We shorten kinetic energy to K.E.'
    write: 'Moving particles have kinetic energy (K.E.)'

  # ---------------------------------------------------------------- the five ideas for a gas
  - section: 'The theory for a gas'
    say: 'The theory is set out most fully for a gas, as five ideas. Let us look at gas particles in a closed container.'
    write: 'For a gas, the theory has five ideas'
    doodle: {name: 'custom:sub_chem_kinetic_theory_g', id: gas, size: scene, caption: 'gas particles in a container', 'on': container}
  - say: 'First, gas particles move at random, in straight lines, until they hit each other or the walls of the container.'
    write: '1. Gas particles move at random, in straight lines'
    doodle_do:
      - {id: gas, op: show, part: paths, 'on': straight}
  - say: 'Second, their collisions are perfectly elastic. This means that no kinetic energy is lost when they collide, so the particles never slow down and settle.'
    write: '2. Collisions are perfectly elastic: no K.E. is lost'
  - say: 'Third, the forces of attraction between gas particles are negligible, which means so small that we can ignore them. That is why a particle moves in a straight line between collisions. No force acts to turn it.'
    write: '3. The forces between the particles are negligible'
    doodle_do:
      - {id: gas, op: pulse, part: paths, 'on': straight}
  - say: 'Fourth, the particles themselves take up almost no space compared with the container. Their own volume is negligible.'
    write: '4. The particles'' own volume is negligible'
    doodle_do:
      - {id: gas, op: pulse, part: gas-box, 'on': space}
  - say: 'This idea also explains gas pressure. The pressure of a gas comes from its particles hitting the walls of the container. Each hit pushes on the wall.'
    write: 'Pressure: the particles hitting the walls'
    doodle_do:
      - {id: gas, op: show, part: hits, 'on': hitting}
  - say: 'Fifth, the average kinetic energy of the particles is directly proportional to the absolute temperature. Absolute temperature is the temperature in kelvin.'
    write: '5. Average K.E. is directly proportional to the temperature in kelvin'
    point:
      - {line: 12, kind: circle, at: 'kelvin'}

  # ---------------------------------------------------------------- kelvin and proportion, before they are used
  - section: 'Kelvin'
    say: 'To change a temperature in degrees Celsius to kelvin, we add 273. For example, 27 degrees Celsius is 27 plus 273, which is 300 kelvin.'
    write: 'Kelvin = °C + 273, e.g. 27 °C = 300 K'
  - say: 'Directly proportional means that when the kelvin temperature doubles, the average kinetic energy doubles too. We write this with the sign for proportional.'
    write: 'Average K.E. $\propto T$: double $T$, double the K.E.'

  # ---------------------------------------------------------------- worked example
  - section: 'Worked example'
    say: 'Let us solve one. A gas is heated from 27 degrees Celsius to 327 degrees Celsius. We must find the factor by which the average kinetic energy of its particles changes.'
    write: 'Gas heated from 27 °C to 327 °C. By what factor does the K.E. change?'
  - say: 'We are given the temperatures in degrees Celsius, but the rule works in kelvin. So first we change both to kelvin. 27 plus 273 is 300 kelvin.'
    write: '$T_1 = 27 + 273 = 300$ K'
  - say: 'And 327 plus 273 is 600 kelvin.'
    write: '$T_2 = 327 + 273 = 600$ K'
  - say: 'The kinetic energy is proportional to the kelvin temperature, so the factor is the new temperature divided by the old one. 600 kelvin divided by 300 kelvin is 2.'
    write: 'Factor $= \frac{600 \text{ K}}{300 \text{ K}} = 2$'
  - say: 'What does this tell us? The average kinetic energy doubles, because the particles move faster at the higher temperature.'
    write: '∴ the average K.E. doubles'
    doodle_do:
      - {id: gas, op: pulse, part: paths, 'on': faster}
    point:
      - {line: 19, kind: circle, at: 'doubles'}

  # ---------------------------------------------------------------- trap
  - section: 'JAMB trap'
    say: 'Here is a common trap. Some students divide 327 by 27 and get about 12. That is wrong, because the rule works only with temperatures in kelvin.'
    write: 'Trap: 327 ÷ 27 ✗; always change to kelvin first'
    point:
      - {line: 20, kind: underline, at: 'always change to kelvin first'}

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. A gas is at 0 degrees Celsius. To what temperature must it be heated for the average kinetic energy of its particles to double? Pause the lesson and decide before I go on.'
    write: 'A gas at 0 °C. Heat it to what temperature to double the K.E.?'
  - say: '0 degrees Celsius is 273 kelvin. To double the kinetic energy, we double the kelvin temperature, which gives 546 kelvin.'
    write: '0 °C = 273 K; doubled, 2 × 273 = 546 K'
  - say: 'To change back to degrees Celsius, we take away 273. 546 minus 273 is 273 degrees Celsius. Doubling 0 degrees Celsius would give 0, which is why we never double a Celsius temperature.'
    write: '546 − 273 = 273 °C ✓'
    point:
      - {line: 23, kind: circle, at: '273 °C'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. The kinetic theory says that matter is tiny particles in constant motion. Gas particles move at random in straight lines, their collisions are elastic, and the forces between them and their own volume are negligible.'
    write: '1. Particles always moving; for a gas: random, elastic, no forces, tiny volume'
    doodle_do:
      - {id: gas, op: pulse, part: gas-box, 'on': Gas}
  - say: 'Their average kinetic energy is proportional to the temperature in kelvin. In the next lesson, we use these ideas to explain the three states of matter. Now try the problem.'
    write: '2. Average K.E. $\propto T$, with $T$ in kelvin'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'A gas at 27 °C is heated to 627 °C. By what factor does the average kinetic energy of its particles increase?'
    answer: '3'
    accept: ['3 times', 'x3', '×3', 'three', 'three times', 'triples']
    working:
      - '$T_1 = 27 + 273 = 300$ K'
      - '$T_2 = 627 + 273 = 900$ K'
      - 'average K.E. $\propto T$ in kelvin, so the factor is $\frac{900 \text{ K}}{300 \text{ K}} = 3$'
      - 'The average kinetic energy is 3 times as large. (Not 627 ÷ 27: always use kelvin.)'
    needs_working: true
