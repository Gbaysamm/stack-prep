# Kinetic theory and changes of state, lesson 1 of 2: the ideas of the kinetic theory and the three states as particles, on one particle diagram that grows.
format_version: 1
subject: chemistry
subtopic: 'Kinetic theory and changes of state'
subtopic_id: 702e0df2-1ca8-5737-8c9b-32846cd78f8f
part: 1
title: 'The kinetic theory and the three states of matter'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://elearn.education.gov.ng
  - https://passnownow.com
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. This is lesson one of two on kinetic theory and changes of state: the kinetic theory and the three states of matter.'
    write: 'The kinetic theory and the three states of matter'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'Everything around you is a solid, a liquid or a gas. The kinetic theory explains why, using tiny particles that are always moving.'
    write: 'Matter is made of tiny particles that are always moving'
  - say: 'JAMB asks about it almost every year: the ideas of the theory, and why a solid keeps its shape while a gas fills its container.'
    write: 'JAMB asks: the theory, and the three states'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'By the end of this lesson you will be able to do two things. One, state the main ideas of the kinetic theory. Two, describe a solid, a liquid and a gas by their particles.'
    write: '1. State the kinetic theory  2. Describe the three states'

  # ---------------------------------------------------------------- kinetic theory
  - section: 'Kinetic theory'
    say: 'The kinetic theory says that all matter is made of tiny particles, which are atoms, molecules or ions, and that these particles are in constant motion.'
    write: 'Kinetic theory: matter is tiny particles in constant motion'
    point:
      - {line: 4, kind: underline, at: 'constant motion'}
  - say: 'For a gas, the theory adds five ideas. First, the particles move at random, in straight lines, until they hit each other or the walls of the container.'
    write: '1. Gas particles move at random, in straight lines'
  - say: 'Second, their collisions are perfectly elastic, which means no kinetic energy is lost when they collide.'
    write: '2. Collisions are perfectly elastic'
  - say: 'Third, the forces of attraction and repulsion between gas particles are negligible. That is why a particle moves in a straight line between collisions: no force acts to turn it.'
    write: '3. Negligible forces, so straight lines between collisions'
    point:
      - {line: 7, kind: underline, at: 'straight lines'}
  - say: 'Fourth, the particles themselves take up almost no space compared with the container. The pressure of a gas comes from its particles hitting the walls.'
    write: '4. Negligible particle volume; pressure = hits on the walls'
  - say: 'Fifth, the average kinetic energy of the particles is directly proportional to the absolute temperature, which is the temperature in kelvin.'
    write: '5. Average K.E. $\propto T$, with $T$ in kelvin'
    point:
      - {line: 9, kind: circle, at: 'kelvin'}

  # ---------------------------------------------------------------- worked example
  - section: 'Worked example'
    say: 'Let us solve this. A gas is heated from 27 degrees Celsius to 327 degrees Celsius. By what factor does the average kinetic energy of its particles change?'
    write: 'Gas heated from 27 °C to 327 °C. K.E. changes by what factor?'
  - say: 'Step one. Change both temperatures to kelvin by adding 273. 27 plus 273 is 300 kelvin, and 327 plus 273 is 600 kelvin.'
    write: '$T_1 = 27 + 273 = 300$ K;  $T_2 = 327 + 273 = 600$ K'
  - say: 'Step two. Kinetic energy is proportional to the kelvin temperature, so the factor is 600 kelvin over 300 kelvin, which is 2.'
    write: '$\frac{T_2}{T_1} = \frac{600 \text{ K}}{300 \text{ K}} = 2$'
  - say: 'So the average kinetic energy doubles. The trap is to divide 327 by 27 and get about 12. Always work in kelvin.'
    write: '∴ average K.E. doubles (not 327 ÷ 27)'
    point:
      - {line: 13, kind: circle, at: 'doubles'}

  # ---------------------------------------------------------------- solid
  - section: 'Solid'
    say: 'Now the three states of matter. In a solid, the particles are packed close together in a regular pattern. Look at the first box.'
    write: 'Solid: particles close together, in a regular pattern'
    doodle: {name: 'custom:sub_chem_kinetic_theory_a', id: dia, size: scene, caption: 'the three states as particles', 'on': box}
    doodle_do:
      - {id: dia, op: circle, part: solid-tag, 'on': solid}
      - {id: dia, op: pulse, part: solid-box, 'on': box}
  - say: 'Strong forces of attraction hold each particle in a fixed place. It cannot move about. It only vibrates about that fixed place.'
    write: 'Strong forces: particles vibrate about fixed positions'
    doodle_do:
      - {id: dia, op: pulse, part: solid-box, 'on': vibrates}
  - say: 'So a solid has a definite shape and a definite volume, and it can hardly be compressed.'
    write: 'Definite shape and definite volume'

  # ---------------------------------------------------------------- liquid
  - section: 'Liquid'
    say: 'In a liquid, the particles are still close together, but not in a regular pattern. Look at the second box.'
    write: 'Liquid: particles close together, no regular pattern'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_kinetic_theory_a2', 'on': liquid}
      - {id: dia, op: pulse, part: liquid-box, 'on': box}
  - say: 'The forces between them are weaker than in a solid, so the particles can slide past one another.'
    write: 'Weaker forces: particles slide past one another'
    doodle_do:
      - {id: dia, op: circle, part: liquid-tag, 'on': slide}
  - say: 'So a liquid has a definite volume but no definite shape. It takes the shape of its container, like water poured into a cup.'
    write: 'Definite volume, but takes the shape of its container'

  # ---------------------------------------------------------------- gas
  - section: 'Gas'
    say: 'In a gas, the particles are far apart and move fast in all directions. Look at the third box.'
    write: 'Gas: particles far apart, moving fast at random'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_kinetic_theory_a3', 'on': gas}
      - {id: dia, op: pulse, part: gas-box, 'on': box}
  - say: 'The forces between gas particles are very weak. So a gas has no definite shape and no definite volume. It fills any container, and it is easily compressed.'
    write: 'No definite shape or volume; easily compressed'
    doodle_do:
      - {id: dia, op: circle, part: gas-tag, 'on': fills}
  - say: 'Let us solve this. Arrange ice, water and steam in order of increasing kinetic energy of their particles.'
    write: 'Arrange ice, water, steam by increasing K.E.'
  - say: 'Ice is a solid, so its particles only vibrate and have the least kinetic energy. Water is a liquid, and its particles slide about, so they have more. Steam is a gas, with the fastest particles of all.'
    write: 'Ice: vibrate, least; water: more; steam: most'
    doodle_do:
      - {id: dia, op: pulse, part: solid-box, 'on': Ice}
      - {id: dia, op: pulse, part: liquid-box, 'on': liquid}
      - {id: dia, op: pulse, part: gas-box, 'on': gas}
  - say: 'So the order is ice, then water, then steam. From solid to liquid to gas, the kinetic energy and the disorder increase, and the forces of attraction decrease.'
    write: '∴ ice < water < steam; solid → liquid → gas: K.E. ↑, order ↓'
    point:
      - {line: 24, kind: circle, at: 'ice < water < steam'}

  # ---------------------------------------------------------------- comparison
  - section: 'Comparison'
    say: 'Here are the three states side by side. In a solid, the particles are close, regular, and vibrate in place, held by strong forces. It has a definite shape and volume.'
    write: 'Solid: close, regular, vibrate; definite shape and volume'
    doodle_do:
      - {id: dia, op: pulse, part: solid-box, 'on': solid}
  - say: 'In a liquid they are close but irregular and slide past one another, so it has a definite volume only. A gas has neither.'
    write: 'Liquid: definite volume only; gas: neither'
    doodle_do:
      - {id: dia, op: pulse, part: liquid-box, 'on': liquid}
      - {id: dia, op: pulse, part: gas-box, 'on': gas}

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is a real JAMB question. Which statement about the states of matter is not correct? Option D says random motion of particles increases from gas to solid.'
    write: 'Not correct? D: random motion increases from gas to solid'
  - say: 'The other options are true. D is backwards, because from gas to solid the random motion decreases. So D is the answer.'
    write: 'Gas → solid: random motion decreases, so D ✓'
    point:
      - {line: 28, kind: circle, at: 'decreases'}
  - say: 'A second trap. A solid has a definite shape because of the strong forces of attraction between its particles, not because of its high melting point.'
    write: 'Definite shape: strong forces, not high melting point ✗'
  - say: 'Last, two common mistakes. The particles of a solid do move, they vibrate. And heated particles do not get bigger. They move faster, and the spaces between them grow.'
    write: 'Solid particles vibrate; heated particles do not swell ✗'
    point:
      - {line: 30, kind: underline, at: 'do not swell'}

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Your turn. Why can a gas be compressed easily, but a solid hardly at all? Pause and decide before I go on.'
    write: 'Why is a gas easily compressed, but not a solid?'
  - say: 'In a gas, the particles are far apart, with large spaces between them, so pushing squeezes them closer. In a solid, the particles are already packed close together, so there is almost no space to squeeze.'
    write: 'Gas: particles far apart, space to squeeze ✓; solid: already packed close'
    doodle_do:
      - {id: dia, op: pulse, part: gas-box, 'on': far apart}
      - {id: dia, op: pulse, part: solid-box, 'on': packed}
    point:
      - {line: 32, kind: circle, at: 'space to squeeze'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. Matter is tiny particles in constant motion, and their average kinetic energy is proportional to the temperature in kelvin.'
    write: '1. Particles always moving; K.E. $\propto T$ in kelvin'
  - say: 'In a solid the particles vibrate in fixed places. In a liquid they slide past one another. In a gas they are far apart and move fast.'
    write: '2. Solid: vibrate; liquid: slide; gas: far apart, fast'
    doodle_do:
      - {id: dia, op: pulse, part: solid-tag, 'on': solid}
      - {id: dia, op: pulse, part: liquid-tag, 'on': liquid}
      - {id: dia, op: pulse, part: gas-tag, 'on': gas}
  - say: 'From solid to liquid to gas, the kinetic energy rises and the forces fall. That''s the lesson. In the next lesson, the changes of state.'
    write: '3. Solid → liquid → gas: K.E. ↑, forces ↓'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'A gas at 27 °C is heated to 627 °C. By what factor does the average kinetic energy of its particles increase?'
    answer: '3'
    accept: ['3 times', 'x3', '×3', 'three', 'three times', 'triples']
    working:
      - '$T_1 = 27 + 273 = 300$ K'
      - '$T_2 = 627 + 273 = 900$ K'
      - 'average K.E. $\propto T$ in kelvin, so the factor is $\frac{900 \text{ K}}{300 \text{ K}} = 3$'
      - 'The average kinetic energy is 3 times as large. (Not 627 ÷ 27: always use kelvin.)'
    needs_working: true
