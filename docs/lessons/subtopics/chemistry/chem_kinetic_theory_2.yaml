# Kinetic theory and changes of state, lesson 2 of 2: every change of state, vapour pressure and boiling, the evidence that particles move, and JAMB's traps, on the particle diagram that grows.
format_version: 1
subject: chemistry
subtopic: 'Kinetic theory and changes of state'
subtopic_id: 702e0df2-1ca8-5737-8c9b-32846cd78f8f
part: 2
title: 'Changes of state, boiling and the evidence that particles move'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://elearn.education.gov.ng
  - https://passnownow.com
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. This is lesson two of two on kinetic theory and changes of state: the changes of state, boiling, and the evidence that particles move.'
    write: 'Changes of state, boiling and the evidence that particles move'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson you met the kinetic theory and the three states. Now we see how heating and cooling change one state into another.'
    write: 'Heating and cooling change one state into another'
  - say: 'JAMB asks about it almost every year. When a liquid boils, why evaporation cools, and what shows that particles move.'
    write: 'JAMB asks: boiling, evaporation, the evidence'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'By the end of this lesson you will be able to do two things. One, explain melting, freezing, evaporation, boiling, condensation and sublimation.'
    write: '1. Explain the changes of state'
  - say: 'Two, give the evidence that particles move, and spot the traps JAMB sets.'
    write: '2. The evidence, and the traps'

  # ---------------------------------------------------------------- melting and freezing
  - section: 'Melting and freezing'
    say: 'Heat a solid, and its particles vibrate faster. At its melting point they break free of their fixed places, and the solid becomes a liquid. This is melting. Pure ice melts at 0 degrees Celsius.'
    write: 'Melting: solid → liquid, heat taken in'
    doodle: {name: 'custom:sub_chem_kinetic_theory_a4', id: dia, size: scene, caption: 'the changes of state as particles', 'on': becomes}
    doodle_do:
      - {id: dia, op: circle, part: melting, 'on': This}
  - say: 'Freezing is the reverse. A liquid loses heat, its particles slow down, and the forces pull them back into fixed places. A pure liquid freezes at the same temperature as it melts.'
    write: 'Freezing: liquid → solid, heat given out'
    doodle_do:
      - {id: dia, op: circle, part: freezing, 'on': Freezing}
  - say: 'You saw in the lesson on melting points that ice stays at 0 degrees Celsius while it melts. The heat breaks the forces between the particles instead of speeding them up. Heat taken in like this, with no rise in temperature, is called latent heat.'
    write: 'Latent heat: breaks the forces; the temperature stays the same'
    point:
      - {line: 7, kind: underline, at: 'latent heat'}

  # ---------------------------------------------------------------- evaporation
  - section: 'Evaporation'
    say: 'In a liquid, some particles near the surface move faster than the rest. They escape into the air as vapour. This is evaporation. It happens at any temperature, but only at the surface.'
    write: 'Evaporation: liquid → vapour, at the surface, at any temperature'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_kinetic_theory_a5', 'on': escape}
      - {id: dia, op: circle, part: evaporation, 'on': evaporation}
  - say: 'The fastest particles leave, so the average kinetic energy of the particles left behind falls. So evaporation causes cooling.'
    write: 'Evaporation causes cooling'
  - say: 'Let us solve this. Water kept in a clay pot stays cooler than water kept in a metal bucket. Why?'
    write: 'Why does water in a clay pot stay cool?'
  - say: 'Water seeps through the tiny pores of the clay and evaporates from the outside of the pot. The fast particles leave and carry heat away, so the water inside cools.'
    write: 'Water evaporates from the pot''s surface and takes heat away'

  # ---------------------------------------------------------------- boiling
  - section: 'Vapour pressure and boiling'
    say: 'In a closed container, vapour gathers above the liquid. When particles return as fast as they leave, the vapour is saturated. Its pressure is the saturated vapour pressure.'
    write: 's.v.p.: rate of escape = rate of return'
  - say: 'The saturated vapour pressure of a liquid rises as its temperature rises.'
    write: 's.v.p. rises with temperature'
  - say: 'A liquid boils when its saturated vapour pressure equals the atmospheric pressure above it. Then bubbles of vapour form all through the liquid.'
    write: 'Boiling: s.v.p. = atmospheric pressure'
    doodle_do:
      - {id: dia, op: pulse, part: evaporation, 'on': boils}
    point:
      - {line: 14, kind: underline, at: 's.v.p. = atmospheric pressure'}
  - say: 'Pure water boils at 100 degrees Celsius at one atmosphere. Where the air pressure is lower, as on a high mountain, it boils below 100 degrees Celsius.'
    write: 'b.p. of pure water = 100 °C at 1 atm; lower pressure, lower b.p.'
  - say: 'Let us solve this. At 20 degrees Celsius, the saturated vapour pressure of ether is far higher than that of water. Which liquid has the lower boiling point?'
    write: 'At 20 °C, s.v.p. of ether ≫ s.v.p. of water. Lower b.p.?'
  - say: 'The s.v.p. of ether is already high, so only a little heating brings it up to atmospheric pressure. So ether boils first, at about 35 degrees Celsius. A higher s.v.p. means a lower boiling point, and a more volatile liquid.'
    write: '∴ ether: higher s.v.p., lower b.p., more volatile'
    point:
      - {line: 17, kind: circle, at: 'lower b.p.'}

  # ---------------------------------------------------------------- comparison: evaporation and boiling
  - section: 'Evaporation and boiling'
    say: 'Now compare the two. Evaporation happens at any temperature, from the surface only, slowly, and it cools the liquid.'
    write: 'Evaporation: any temperature, surface only, slow, cools'
  - say: 'Boiling happens at one fixed temperature, the boiling point, all through the liquid, quickly, with bubbles.'
    write: 'Boiling: fixed temperature, all through, fast, bubbles'

  # ---------------------------------------------------------------- condensation
  - section: 'Condensation'
    say: 'Condensation is a vapour changing back into a liquid. The vapour particles lose energy and slow down, and the forces of attraction pull them together.'
    write: 'Condensation: vapour → liquid, heat given out'
    doodle_do:
      - {id: dia, op: circle, part: condensation, 'on': Condensation}
  - say: 'Let us solve this. A cold bottle of milk is taken out of the fridge, and soon droplets of water form on the outside. Where do they come from?'
    write: 'Droplets on a cold bottle: where from?'
  - say: 'The bottle is colder than the air. Water vapour in the air hits the cold glass, loses energy to it, and condenses. It does not gain energy from the bottle, because heat flows from hot to cold. The water comes from the air.'
    write: '∴ vapour in the air loses energy to the cold glass and condenses'
    doodle_do:
      - {id: dia, op: pulse, part: condensation, 'on': condenses}

  # ---------------------------------------------------------------- sublimation
  - section: 'Sublimation'
    say: 'Some solids change straight into a gas when heated, without melting first. This is sublimation. On cooling, the vapour turns straight back into the solid.'
    write: 'Sublimation: solid → gas, with no liquid stage'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_kinetic_theory_a6', 'on': sublimation}
  - say: 'You met these in separation processes: iodine, ammonium chloride, naphthalene, and dry ice, which is solid carbon(IV) oxide.'
    write: 'e.g. iodine, $\ce{NH4Cl}$, naphthalene, solid $\ce{CO2}$'
  - say: 'Let us solve this. A naphthalene ball left in a wardrobe gets smaller over some weeks, but no liquid is ever seen, and the clothes smell of it. Explain.'
    write: 'Naphthalene ball shrinks, no liquid, clothes smell. Why?'
  - say: 'Particles at the surface of the solid gain enough energy to escape straight into the air as vapour. That is sublimation. The vapour then spreads through the wardrobe, so the clothes smell.'
    write: '∴ naphthalene sublimes: solid → vapour, which spreads'
    doodle_do:
      - {id: dia, op: circle, part: sublimation, 'on': sublimation}

  # ---------------------------------------------------------------- evidence
  - section: 'Evidence that particles move'
    say: 'How do we know particles move? Evaporation and sublimation are evidence, because particles must move to escape. Two more are diffusion and Brownian motion.'
    write: 'Evidence: evaporation, sublimation, diffusion, Brownian motion'
  - say: 'Diffusion is the spreading of particles from where there are many to where there are few. The smell of frying akara spreads through the house by diffusion.'
    write: 'Diffusion: particles spread from high to low concentration'
    doodle_do:
      - {id: dia, op: pulse, part: gas-box, 'on': spreading}
  - say: 'Brownian motion is the random zigzag movement of tiny specks, like pollen grains in water or smoke in air. Moving particles too small to see keep hitting them.'
    write: 'Brownian motion: specks jiggle, hit by moving particles'
  - say: 'Let us solve this. Cotton wool with ammonia is put at one end of a long tube, and cotton wool with concentrated hydrochloric acid at the other. Where does the white ring form?'
    write: '$\ce{NH3}$ at one end, HCl at the other: where is the ring?'
  - say: 'Ammonia, NH₃, has a molar mass of 17 grams per mole, and hydrogen chloride 36.5 grams per mole. The lighter gas diffuses faster, so the ammonia travels further, and the white ring of ammonium chloride forms nearer the HCl end.'
    write: '$\ce{NH3}$ 17, HCl 36.5: $\ce{NH3 + HCl -> NH4Cl}$, ring nearer HCl'
    point:
      - {line: 31, kind: circle, at: 'ring nearer HCl'}
  - say: 'JAMB uses the same idea. Heated ammonium chloride splits into NH₃ and HCl. Through a porous plug, the lighter NH₃ arrives first, so damp litmus turns blue first, and red only later.'
    write: '$\ce{NH4Cl ->[heat] NH3 + HCl}$: $\ce{NH3}$ first, litmus turns blue'

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'A JAMB trap. A liquid begins to boil when its vapour pressure equals the atmospheric pressure, not when molecules start escaping its surface. That is evaporation.'
    write: 'Escaping the surface = evaporation, not boiling ✗'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Your turn. Which of these changes gives out heat? Melting, evaporation, sublimation or condensation. Pause and decide before I go on.'
    write: 'Gives out heat? melting, evaporation, sublimation, condensation'
  - say: 'Melting, evaporation and sublimation all take in heat, to break the forces of attraction. In condensation, the vapour particles lose energy as the forces pull them together. So condensation gives out heat, and it is the answer.'
    write: 'Melting, evaporation, sublimation take in heat ✗; condensation gives out heat ✓'
    doodle_do:
      - {id: dia, op: cross, part: melting, 'on': Melting}
      - {id: dia, op: cross, part: evaporation, 'on': evaporation}
      - {id: dia, op: circle, part: condensation, 'on': condensation}
    point:
      - {line: 35, kind: circle, at: 'condensation gives out heat'}


  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. Melting, evaporation, boiling and sublimation take in heat. Freezing and condensation give it out.'
    write: '1. Heat in: melt, evaporate, boil, sublime; out: freeze, condense'
  - say: 'Evaporation happens at the surface at any temperature, and it cools. A liquid boils when its saturated vapour pressure equals the atmospheric pressure.'
    write: '2. Boiling: s.v.p. = atmospheric pressure; evaporation cools'
  - say: 'And evaporation, sublimation, diffusion and Brownian motion are the evidence that particles move. That''s the lesson. Next, try new questions on it.'
    write: '3. Evidence: evaporation, sublimation, diffusion, Brownian'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Which of these statements is NOT correct? A. Evaporation takes place at any temperature  B. Boiling takes place throughout the liquid  C. A liquid boils when its saturated vapour pressure equals the atmospheric pressure  D. Evaporation takes place throughout the liquid'
    answer: 'D'
    accept: ['D.', 'option D']
    working:
      - 'A is true: evaporation happens at any temperature.'
      - 'B is true: in boiling, bubbles of vapour form all through the liquid.'
      - 'C is true: that is the condition for boiling.'
      - 'D is not correct: evaporation happens only at the surface. Answer: D.'
