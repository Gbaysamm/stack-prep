# The three states of matter (lesson 2 of 6): a solid, a liquid and a gas as particles, each on its own box as it is taught, then the three joined, a guided ordering example, and JAMB's traps.
format_version: 1
subject: chemistry
subtopic: 'Kinetic theory and changes of state'
subtopic_id: 702e0df2-1ca8-5737-8c9b-32846cd78f8f
part: 2
title: 'The three states of matter'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://elearn.education.gov.ng
  - https://passnownow.com
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is the three states of matter.'
    write: 'The three states of matter'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson, you learnt that matter is made of tiny particles that are always moving. Now we use this idea to explain the three states of matter. They are solid, liquid and gas.'
    write: 'Three states: solid, liquid, gas'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn how the particles are arranged, and how they move, in a solid, a liquid and a gas.'
    write: 'Today: the three states as particles'

  # ---------------------------------------------------------------- solid
  - section: 'Solid'
    say: 'Let us start with a solid. In a solid, the particles are packed close together in a regular pattern. Look at the first box, which shows a solid.'
    write: 'Solid: particles close together, in a regular pattern'
    doodle: {name: 'custom:sub_chem_kinetic_theory_a', id: dia, size: scene, caption: 'the three states as particles', 'on': packed}
  - say: 'Strong forces of attraction hold each particle in a fixed position. It cannot move from place to place. It only vibrates, which means it moves to and fro about that fixed position.'
    write: 'Strong forces: particles vibrate about fixed positions'
    doodle_do:
      - {id: dia, op: circle, part: solid-tag, 'on': fixed}
      - {id: dia, op: pulse, part: solid-box, 'on': vibrates}
  - say: 'So a solid has a definite shape and a definite volume, which means that its shape and size stay the same wherever it is put. For example, a block of wood keeps the same shape whether it is on a table or in a box. A solid can also hardly be compressed, which means squeezed into a smaller space, because its particles are already packed close.'
    write: 'Definite shape and volume; hardly compressed'

  # ---------------------------------------------------------------- liquid
  - section: 'Liquid'
    say: 'Now a liquid. In a liquid, the particles are still close together, but not in a regular pattern.'
    write: 'Liquid: particles close together, no regular pattern'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_kinetic_theory_a2', 'on': liquid}
  - say: 'The forces between them are weaker than in a solid, so the particles can slide past one another.'
    write: 'Weaker forces: particles slide past one another'
    doodle_do:
      - {id: dia, op: circle, part: liquid-tag, 'on': slide}
  - say: 'So a liquid has a definite volume, but no definite shape. It takes the shape of its container. For example, water poured from a bottle into a cup takes the shape of the cup.'
    write: 'Definite volume; takes the shape of its container'

  # ---------------------------------------------------------------- gas
  - section: 'Gas'
    say: 'Last, a gas. In a gas, the particles are far apart, and they move fast, at random, in all directions.'
    write: 'Gas: particles far apart, moving fast at random'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_kinetic_theory_a3', 'on': gas}
  - say: 'The forces between gas particles are very weak, so nothing holds the particles together. They spread out to fill any container, so a gas has no definite shape and no definite volume.'
    write: 'Very weak forces: fills its container, no definite shape or volume'
    doodle_do:
      - {id: dia, op: circle, part: gas-tag, 'on': fill}
  - say: 'There are large spaces between gas particles, so a gas is easily compressed.'
    write: 'Large spaces, so easily compressed'
    doodle_do:
      - {id: dia, op: pulse, part: gas-box, 'on': spaces}

  # ---------------------------------------------------------------- the three joined
  - section: 'Comparison'
    say: 'Now that we have seen each state, let us compare them. From solid to liquid to gas, the particles move faster, so their kinetic energy increases.'
    write: 'Solid → liquid → gas: K.E. increases'
    doodle_do:
      - {id: dia, op: pulse, part: solid-box, 'on': solid}
      - {id: dia, op: pulse, part: liquid-box, 'on': liquid}
      - {id: dia, op: pulse, part: gas-box, 'on': gas}
  - say: 'In the same order, the forces of attraction get weaker, and the particles become less orderly. We say that the disorder increases.'
    write: 'Forces decrease; disorder increases'

  # worked example: put them in order
  - section: 'Worked example'
    say: 'Now let us use this order to solve a problem. We are given ice, water and steam, and we must arrange them in order of increasing kinetic energy of their particles.'
    write: 'Arrange ice, water and steam by increasing K.E.'
  - say: 'For each one, we ask which state it is in, because the state tells us how fast its particles move.'
    write: 'Ask: which state is it in?'
  - say: 'Ice is a solid, so its particles only vibrate. They have the least kinetic energy.'
    write: 'Ice: solid, particles vibrate, least K.E.'
    doodle_do:
      - {id: dia, op: pulse, part: solid-box, 'on': solid}
  - say: 'Water is a liquid, so its particles slide past one another. They have more kinetic energy.'
    write: 'Water: liquid, particles slide, more K.E.'
    doodle_do:
      - {id: dia, op: pulse, part: liquid-box, 'on': liquid}
  - say: 'Steam is a gas, so its particles move fastest of all. They have the most kinetic energy.'
    write: 'Steam: gas, particles fastest, most K.E.'
    doodle_do:
      - {id: dia, op: pulse, part: gas-box, 'on': gas}
  - say: 'So the order is ice, then water, then steam.'
    write: '∴ ice < water < steam'
    point:
      - {line: 19, kind: circle, at: 'ice < water < steam'}

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is a real JAMB question. Which statement about the states of matter is not correct? Option D says that the random motion of particles increases from gas to solid.'
    write: 'Which is not correct? D: random motion increases from gas to solid'
  - say: 'From gas to solid, the particles slow down and settle into fixed positions, so their random motion decreases. Option D has it backwards, so D is the answer. The rule to remember is that random motion increases from solid to liquid to gas, and decreases the other way.'
    write: 'Gas → solid: random motion decreases, so D ✓'
    point:
      - {line: 21, kind: circle, at: 'decreases'}
  - say: 'A second trap. A solid has a definite shape because of the strong forces of attraction between its particles. It is not because of its high melting point, which is the temperature at which it melts.'
    write: 'Definite shape: strong forces, not a high melting point'
  - say: 'Some students also say that the particles of a solid do not move. They do move. They vibrate about their fixed positions.'
    write: 'Solid particles do move: they vibrate'
  - say: 'Others say that heated particles get bigger. They do not. They move faster, and the spaces between them grow.'
    write: 'Heated particles do not swell: they move faster'
    point:
      - {line: 24, kind: underline, at: 'do not swell'}

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Why can a gas be compressed easily, but a solid hardly at all? Pause the lesson and decide before I go on.'
    write: 'Why is a gas easily compressed, but not a solid?'
  - say: 'In a gas, the particles are far apart, with large spaces between them, so pushing squeezes them closer.'
    write: 'Gas: particles far apart, space to squeeze ✓'
    doodle_do:
      - {id: dia, op: pulse, part: gas-box, 'on': far}
  - say: 'In a solid, the particles are already packed close together, so there is almost no space to squeeze.'
    write: 'Solid: packed close, almost no space'
    doodle_do:
      - {id: dia, op: pulse, part: solid-box, 'on': packed}
    point:
      - {line: 27, kind: underline, at: 'almost no space'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. In a solid, the particles vibrate about fixed positions, so it has a definite shape and volume. In a liquid, they are close together but slide past one another, so it has a definite volume but takes the shape of its container. In a gas, they are far apart and move fast, so it fills any container.'
    write: '1. Solid: vibrate; liquid: slide; gas: far apart, fast'
    doodle_do:
      - {id: dia, op: pulse, part: solid-tag, 'on': solid}
      - {id: dia, op: pulse, part: liquid-tag, 'on': liquid}
      - {id: dia, op: pulse, part: gas-tag, 'on': gas}
  - say: 'From solid to liquid to gas, the kinetic energy rises and the forces fall. In the next lesson, we see how heating changes a solid into a liquid. Now try the problem.'
    write: '2. Solid → liquid → gas: K.E. ↑, forces ↓'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Which of these has a definite volume but takes the shape of its container? A. a block of ice  B. water  C. steam  D. air'
    answer: 'B'
    accept: ['water', 'B. water', 'B.']
    working:
      - 'A block of ice is a solid: it has a definite shape and a definite volume.'
      - 'Steam and air are gases: they have neither a definite shape nor a definite volume.'
      - 'Water is a liquid: its particles slide past one another, so it has a definite volume but takes the shape of its container. Answer: B.'
    needs_working: false
