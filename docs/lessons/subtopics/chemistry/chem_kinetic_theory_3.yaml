# Melting and freezing (lesson 3 of 6): what a change of state is, melting and freezing as particles, the melting point, latent heat with a guided heating example, and the traps.
format_version: 1
subject: chemistry
subtopic: 'Kinetic theory and changes of state'
subtopic_id: 702e0df2-1ca8-5737-8c9b-32846cd78f8f
part: 3
title: 'Melting and freezing'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://elearn.education.gov.ng
  - https://passnownow.com
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is melting and freezing.'
    write: 'Melting and freezing'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson, you saw how the particles behave in a solid, a liquid and a gas. When we heat or cool a substance, it can change from one state to another. This is called a change of state.'
    write: 'Change of state: heating or cooling turns one state into another'
  - say: 'Here are the three states again, side by side. Heating moves a substance from solid towards gas, and cooling moves it back.'
    write: 'Heating: solid → liquid → gas; cooling: back again'
    doodle: {name: 'custom:sub_chem_kinetic_theory_a6', id: dia, size: scene, caption: 'the changes of state as particles', 'on': three}

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn what happens to the particles when a solid melts and when a liquid freezes.'
    write: 'Today: melting and freezing, as particles'

  # ---------------------------------------------------------------- melting
  - section: 'Melting'
    say: 'Let us start with melting. When a solid is heated, its particles take in energy and vibrate faster and faster.'
    write: 'Heat a solid: its particles vibrate faster'
    doodle_do:
      - {id: dia, op: pulse, part: solid-box, 'on': vibrate}
  - say: 'At a certain temperature, the particles vibrate hard enough to break free of their fixed positions. They begin to slide past one another, and the solid becomes a liquid. This change is melting.'
    write: 'Melting: solid → liquid, heat taken in'
    doodle_do:
      - {id: dia, op: show, part: melting, 'on': melting}
  - say: 'The temperature at which a solid melts is its melting point. For example, pure ice melts at 0 degrees Celsius.'
    write: 'Melting point: pure ice melts at 0 °C'

  # ---------------------------------------------------------------- latent heat
  - section: 'Latent heat'
    say: 'Now something surprising. While ice melts, we keep heating it, yet its temperature stays at 0 degrees Celsius until all the ice has melted.'
    write: 'While ice melts, its temperature stays at 0 °C'
  - say: 'This is because the heat is used to break the forces of attraction that hold the particles in place. It does not make the particles move faster, so the temperature does not rise.'
    write: 'The heat breaks the forces, so no rise in temperature'
    doodle_do:
      - {id: dia, op: pulse, part: melting, 'on': forces}
  - say: 'Heat taken in like this, with no rise in temperature, is called latent heat. Latent means hidden.'
    write: 'Latent heat: heat taken in with no rise in temperature'
    point:
      - {line: 9, kind: underline, at: 'Latent heat'}

  # ---------------------------------------------------------------- freezing
  - section: 'Freezing'
    say: 'Now the reverse. When a liquid is cooled, its particles lose energy and slow down.'
    write: 'Cool a liquid: its particles slow down'
    doodle_do:
      - {id: dia, op: pulse, part: liquid-box, 'on': slow}
  - say: 'The forces of attraction pull the particles back into fixed positions, and the liquid becomes a solid. This change is freezing. Heat is given out as the particles settle into place.'
    write: 'Freezing: liquid → solid, heat given out'
    doodle_do:
      - {id: dia, op: show, part: freezing, 'on': freezing}
  - say: 'A pure substance freezes at the same temperature as it melts. So pure water freezes at 0 degrees Celsius, the melting point of ice.'
    write: 'Freezing point = melting point: water freezes at 0 °C'

  # ---------------------------------------------------------------- worked example
  - section: 'Worked example'
    say: 'Let us solve one. Ice at minus 10 degrees Celsius is heated steadily until it has all melted. We must describe how its temperature changes, and why.'
    write: 'Ice at −10 °C is heated until it melts. How does its temperature change?'
  - say: 'First, the ice warms up. Its particles vibrate faster, so its temperature rises from minus 10 degrees Celsius to 0 degrees Celsius.'
    write: 'Step 1: the temperature rises from −10 °C to 0 °C'
    doodle_do:
      - {id: dia, op: pulse, part: solid-box, 'on': vibrate}
  - say: 'Next, the ice melts. The heat now breaks the forces between the particles, so the temperature stays at 0 degrees Celsius until all the ice has melted.'
    write: 'Step 2: it stays at 0 °C while it melts (latent heat)'
    doodle_do:
      - {id: dia, op: pulse, part: melting, 'on': melts}
  - say: 'What does this tell us? While a substance changes state, its temperature stays the same, because the heat is used to break the forces.'
    write: '∴ during a change of state, the temperature stays the same'
    point:
      - {line: 16, kind: circle, at: 'stays the same'}

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is a common trap. Some students think the temperature of melting ice rises as heat is added. It does not. The heat goes into breaking the forces, not into speeding up the particles.'
    write: 'Trap: melting ice does not get hotter until it has all melted'
  - say: 'Another mistake is to think that freezing takes in heat, because things get cold. Freezing gives out heat, because the particles lose energy as they settle into place.'
    write: 'Trap: freezing gives out heat; it does not take it in'
    doodle_do:
      - {id: dia, op: circle, part: freezing, 'on': Freezing}
    point:
      - {line: 18, kind: underline, at: 'gives out heat'}

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Pure naphthalene melts at 80 degrees Celsius. At what temperature does liquid naphthalene freeze? Pause the lesson and decide before I go on.'
    write: 'Naphthalene melts at 80 °C. At what temperature does it freeze?'
  - say: 'A pure substance freezes at the same temperature as it melts. So liquid naphthalene freezes at 80 degrees Celsius.'
    write: 'Freezing point = melting point = 80 °C ✓'
    point:
      - {line: 20, kind: circle, at: '80 °C'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. In melting, a solid takes in heat, its particles break free of their fixed positions, and it becomes a liquid.'
    write: '1. Melting: solid → liquid, heat taken in'
    doodle_do:
      - {id: dia, op: pulse, part: melting, 'on': melting}
  - say: 'In freezing, a liquid gives out heat and becomes a solid, at the same temperature. While either happens, the temperature stays the same. In the next lesson, we look at evaporation and boiling. Now try the problem.'
    write: '2. Freezing: liquid → solid, heat given out; temperature steady'
    doodle_do:
      - {id: dia, op: pulse, part: freezing, 'on': freezing}

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Pure water is cooled to 0 °C and begins to freeze. What happens to its temperature while it is freezing? A. It rises  B. It falls  C. It stays at 0 °C  D. It falls to −10 °C'
    answer: 'C'
    accept: ['C.', 'it stays at 0 °C', 'stays at 0 °C', 'stays the same', 'C. It stays at 0 °C']
    working:
      - 'While a substance changes state, its temperature stays the same.'
      - 'Pure water freezes at 0 °C, so its temperature stays at 0 °C until it has all frozen. Answer: C.'
    needs_working: false
