# Evaporation and boiling (lesson 4 of 6): evaporation and why it cools, the clay pot worked through, saturated vapour pressure taught before boiling, the ether example, the two compared, and JAMB's trap.
format_version: 1
subject: chemistry
subtopic: 'Kinetic theory and changes of state'
subtopic_id: 702e0df2-1ca8-5737-8c9b-32846cd78f8f
part: 4
title: 'Evaporation and boiling'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://elearn.education.gov.ng
  - https://passnownow.com
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is evaporation and boiling.'
    write: 'Evaporation and boiling'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson, you saw a solid change into a liquid. Now we see how a liquid changes into a gas. There are two ways. They are evaporation and boiling.'
    write: 'Liquid → gas in two ways: evaporation and boiling'
    doodle: {name: 'custom:sub_chem_kinetic_theory_a6', id: dia, size: scene, caption: 'the changes of state as particles', 'on': liquid}

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn how evaporation and boiling happen, and how they differ.'
    write: 'Today: evaporation and boiling, and how they differ'

  # ---------------------------------------------------------------- evaporation
  - section: 'Evaporation'
    say: 'Let us start with evaporation. In a liquid, the particles do not all move at the same speed. Some move faster than the rest.'
    write: 'In a liquid, some particles move faster than others'
    doodle_do:
      - {id: dia, op: pulse, part: liquid-box, 'on': faster}
  - say: 'Some of the fastest particles near the surface have enough energy to break away from the others. They escape into the air, and a gas formed from a liquid in this way is called a vapour. This escape is evaporation.'
    write: 'Evaporation: fast particles escape from the surface as vapour'
    doodle_do:
      - {id: dia, op: show, part: evaporation, 'on': escape}
  - say: 'Evaporation happens at any temperature, but only at the surface, because only the particles at the surface can escape into the air. That is why wet clothes dry on a line without ever being boiled.'
    write: 'At any temperature, at the surface only'
  - say: 'When the fastest particles leave, the slower ones are left behind, so the average kinetic energy of the particles in the liquid falls. In the first lesson, we saw that the average kinetic energy goes up and down with the temperature. So the temperature falls too, and evaporation causes cooling.'
    write: 'The fast particles leave, so evaporation causes cooling'
    point:
      - {line: 6, kind: underline, at: 'evaporation causes cooling'}

  # worked example: the clay pot
  - section: 'Worked example'
    say: 'Now let us use this to explain something you see at home. Water kept in a clay pot stays cooler than water kept in a metal bucket. We must explain why, and the question to ask is where the water can evaporate.'
    write: 'Why does water in a clay pot stay cool?'
  - say: 'A clay pot has tiny pores. Water seeps through them to the outside surface of the pot.'
    write: 'Water seeps through the pores to the outside'
  - say: 'There, the water evaporates. The fastest particles leave and carry energy away, so the water inside the pot cools. A metal bucket has no pores, so this does not happen.'
    write: '∴ it evaporates from the outside and cools the water'
    doodle_do:
      - {id: dia, op: pulse, part: evaporation, 'on': evaporates}

  # ---------------------------------------------------------------- vapour pressure
  - section: 'Vapour pressure'
    say: 'We have seen how a liquid evaporates. Now boiling. To understand boiling, we first need the idea of vapour pressure. In a closed container, vapour particles gather above the liquid. Like any gas, they hit the walls and push on them, and this push is the vapour pressure.'
    write: 'Vapour pressure: vapour particles push on the walls'
    doodle_do:
      - {id: dia, op: pulse, part: gas-box, 'on': vapour}
  - say: 'Some vapour particles return to the liquid. When particles return as fast as they leave, the vapour is saturated, which means it holds as many particles as it can at that temperature. Its pressure is then called the saturated vapour pressure, or s.v.p.'
    write: 'Saturated vapour pressure (s.v.p.): particles return as fast as they leave'
  - say: 'When the liquid is heated, more particles have enough energy to escape. So the saturated vapour pressure rises as the temperature rises.'
    write: 'The s.v.p. rises as the temperature rises'

  # ---------------------------------------------------------------- boiling
  - section: 'Boiling'
    say: 'A liquid boils when its saturated vapour pressure equals the atmospheric pressure, which is the pressure of the air pressing down on it. Then the vapour can push back as hard as the air, so bubbles of vapour form all through the liquid, not only at the surface.'
    write: 'Boiling: s.v.p. = atmospheric pressure'
    doodle_do:
      - {id: dia, op: pulse, part: evaporation, 'on': boils}
    point:
      - {line: 13, kind: underline, at: 's.v.p. = atmospheric pressure'}
  - say: 'The temperature at which this happens is the boiling point. Pure water boils at 100 degrees Celsius at one atmosphere, which is the normal air pressure at sea level.'
    write: 'Boiling point of pure water: 100 °C at 1 atm'
  - say: 'Where the air pressure is lower, as on a high mountain, the saturated vapour pressure reaches it at a lower temperature. So water there boils below 100 degrees Celsius.'
    write: 'Lower air pressure, lower boiling point'

  # worked example: ether and water
  - section: 'Worked example'
    say: 'Now let us use this to compare two liquids. At 20 degrees Celsius, the saturated vapour pressure of ether is far higher than that of water. We must find which liquid has the lower boiling point.'
    write: 'At 20 °C, s.v.p. of ether ≫ s.v.p. of water. Which boils at a lower temperature?'
  - say: 'A liquid boils when its saturated vapour pressure reaches the atmospheric pressure. The saturated vapour pressure of ether is already high, so only a little heating brings it up to that pressure.'
    write: 'Ether''s s.v.p. is already much closer to atmospheric pressure'
  - say: 'So ether boils first, at about 35 degrees Celsius. What does this tell us? A higher saturated vapour pressure means a lower boiling point. Such a liquid evaporates easily, and we call it volatile.'
    write: '∴ ether: higher s.v.p., lower boiling point, more volatile'
    point:
      - {line: 18, kind: circle, at: 'lower boiling point'}

  # ---------------------------------------------------------------- comparison
  - section: 'Evaporation and boiling'
    say: 'Now let us compare the two. Evaporation happens slowly, at any temperature and from the surface only, and it cools the liquid.'
    write: 'Evaporation: any temperature, surface only, slow, cools'
  - say: 'Boiling happens quickly, at one fixed temperature, the boiling point, with bubbles forming all through the liquid.'
    write: 'Boiling: fixed temperature, all through, fast, bubbles'

  # ---------------------------------------------------------------- trap
  - section: 'JAMB trap'
    say: 'Here is a JAMB trap. An option says that a liquid begins to boil when its molecules start escaping from its surface. That is wrong. Molecules escape from the surface at any temperature, and that is evaporation. A liquid boils only when bubbles form all through it, at its boiling point.'
    write: 'Escaping from the surface = evaporation, not boiling ✗'
    point:
      - {line: 21, kind: strike, at: 'not boiling'}

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Which of these happens only at the surface of a liquid, and at any temperature? Is it boiling, evaporation, melting or freezing? Pause the lesson and decide before I go on.'
    write: 'Which happens only at the surface, at any temperature?'
  - say: 'Boiling happens all through the liquid, at one temperature. Melting and freezing are changes between a solid and a liquid. So the answer is evaporation.'
    write: 'Evaporation ✓'
    doodle_do:
      - {id: dia, op: circle, part: evaporation, 'on': evaporation}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. In evaporation, fast particles escape from the surface at any temperature, and the liquid cools.'
    write: '1. Evaporation: surface, any temperature, cools'
  - say: 'A liquid boils when its saturated vapour pressure equals the atmospheric pressure, and then bubbles form all through it at a fixed temperature, the boiling point. A higher saturated vapour pressure means a lower boiling point. In the next lesson, we look at condensation and sublimation. Now try the problem.'
    write: '2. Boiling: s.v.p. = atmospheric pressure; higher s.v.p., lower boiling point'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Which of these statements is NOT correct? A. Evaporation takes place at any temperature  B. Boiling takes place throughout the liquid  C. A liquid boils when its saturated vapour pressure equals the atmospheric pressure  D. Evaporation takes place throughout the liquid'
    answer: 'D'
    accept: ['D.', 'option D']
    working:
      - 'A is true: evaporation happens at any temperature.'
      - 'B is true: in boiling, bubbles of vapour form all through the liquid.'
      - 'C is true: that is the condition for boiling.'
      - 'D is not correct: evaporation happens only at the surface. Answer: D.'
    needs_working: false
