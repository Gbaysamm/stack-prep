# Condensation and sublimation (lesson 5 of 6): condensation with the cold bottle worked through, sublimation with its examples and the naphthalene ball, then every change of state sorted into heat taken in and heat given out.
format_version: 1
subject: chemistry
subtopic: 'Kinetic theory and changes of state'
subtopic_id: 702e0df2-1ca8-5737-8c9b-32846cd78f8f
part: 5
title: 'Condensation and sublimation'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://elearn.education.gov.ng
  - https://passnownow.com
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is condensation and sublimation.'
    write: 'Condensation and sublimation'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last two lessons, you met three changes of state. They are melting, freezing and evaporation.'
    write: 'So far: melting, freezing, evaporation'
    doodle: {name: 'custom:sub_chem_kinetic_theory_a6', id: dia, size: scene, caption: 'the changes of state as particles', 'on': changes}
    doodle_do:
      - {id: dia, op: show, part: melting, 'on': melting}
      - {id: dia, op: show, part: freezing, 'on': freezing}
      - {id: dia, op: show, part: evaporation, 'on': evaporation}

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn two more changes of state, which are condensation and sublimation, and which changes take in heat.'
    write: 'Today: condensation and sublimation'

  # ---------------------------------------------------------------- condensation
  - section: 'Condensation'
    say: 'Let us start with condensation. Condensation is a vapour changing back into a liquid. It is the reverse of evaporation.'
    write: 'Condensation: vapour → liquid'
    doodle_do:
      - {id: dia, op: show, part: condensation, 'on': vapour}
  - say: 'When a vapour is cooled, its particles lose energy and slow down. The forces of attraction then pull them close together, and they form a liquid. Heat is given out.'
    write: 'The particles lose energy and are pulled together; heat is given out'

  # worked example: the cold bottle
  - section: 'Worked example'
    say: 'Let us solve one. A cold bottle of milk is taken out of the fridge, and soon droplets of water form on the outside. We must find where the water comes from.'
    write: 'Droplets on a cold bottle: where do they come from?'
  - say: 'We are given two facts. The air around us contains water vapour, and the bottle is colder than the air.'
    write: 'The air holds water vapour; the bottle is colder'
  - say: 'Heat flows from hot to cold. So vapour particles that hit the cold glass lose energy to it. They slow down and condense into droplets.'
    write: 'The vapour loses energy to the cold glass and condenses'
    doodle_do:
      - {id: dia, op: pulse, part: condensation, 'on': condense}
  - say: 'What does this tell us? The water comes from the air, not from inside the bottle.'
    write: '∴ the water comes from the air'
    point:
      - {line: 8, kind: circle, at: 'from the air'}

  # ---------------------------------------------------------------- sublimation
  - section: 'Sublimation'
    say: 'Now sublimation. Some solids change straight into a gas when heated, without melting first. This change is sublimation.'
    write: 'Sublimation: solid → gas, with no liquid stage'
    doodle_do:
      - {id: dia, op: show, part: sublimation, 'on': straight}
  - say: 'On cooling, the vapour turns straight back into the solid, again with no liquid stage.'
    write: 'On cooling, the vapour turns straight back into the solid'
  - say: 'For example, iodine, ammonium chloride, naphthalene and dry ice all sublime. Dry ice is solid carbon(IV) oxide.'
    write: 'E.g. iodine, ammonium chloride ($\ce{NH4Cl}$), naphthalene, dry ice (solid carbon(IV) oxide, $\ce{CO2}$)'

  # worked example: the naphthalene ball
  - section: 'Worked example'
    say: 'Let us solve one. A naphthalene ball left in a wardrobe gets smaller over some weeks, but no liquid is ever seen, and the clothes smell of it. We must explain this.'
    write: 'A naphthalene ball shrinks, with no liquid, and the clothes smell. Why?'
  - say: 'No liquid is seen, so the solid has not melted. Particles at its surface escape straight into the air as vapour. That is sublimation.'
    write: 'No liquid, so it goes straight from solid to vapour: sublimation'
    doodle_do:
      - {id: dia, op: pulse, part: sublimation, 'on': sublimation}
  - say: 'The vapour then spreads through the wardrobe, so the clothes smell of naphthalene.'
    write: '∴ the vapour spreads, and the clothes smell'

  # ---------------------------------------------------------------- heat in, heat out
  - section: 'Heat in, heat out'
    say: 'Now let us join all the changes of state. Melting, evaporation, boiling and sublimation all take in heat, because energy is needed to pull the particles apart.'
    write: 'Take in heat: melting, evaporation, boiling, sublimation'
    doodle_do:
      - {id: dia, op: pulse, part: melting, 'on': Melting}
      - {id: dia, op: pulse, part: evaporation, 'on': evaporation}
      - {id: dia, op: pulse, part: sublimation, 'on': sublimation}
  - say: 'Freezing and condensation give out heat, because the particles lose energy as the forces pull them together.'
    write: 'Give out heat: freezing, condensation'
    doodle_do:
      - {id: dia, op: pulse, part: freezing, 'on': Freezing}
      - {id: dia, op: pulse, part: condensation, 'on': condensation}
    point:
      - {line: 16, kind: underline, at: 'Give out heat'}

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is a common trap. For the cold bottle, some students say that the water vapour gains energy from the bottle. It does not. It loses energy to the cold glass, and that is why it condenses.'
    write: 'Trap: the vapour loses energy to the cold glass; it does not gain it'
  - say: 'Another trap. Sublimation starts from a solid, but evaporation starts from a liquid. A shrinking naphthalene ball is sublimation, not evaporation.'
    write: 'Sublimation: from a solid; evaporation: from a liquid'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Which of these changes gives out heat? Is it melting, evaporation, sublimation or condensation? Pause the lesson and decide before I go on.'
    write: 'Which gives out heat: melting, evaporation, sublimation or condensation?'
  - say: 'Melting, evaporation and sublimation all take in heat, to pull the particles apart.'
    write: 'Melting, evaporation, sublimation: take in heat ✗'
    doodle_do:
      - {id: dia, op: cross, part: melting, 'on': Melting}
      - {id: dia, op: cross, part: evaporation, 'on': evaporation}
      - {id: dia, op: cross, part: sublimation, 'on': sublimation}
  - say: 'In condensation, the particles lose energy as they are pulled together. So condensation gives out heat, and it is the answer.'
    write: 'Condensation: gives out heat ✓'
    doodle_do:
      - {id: dia, op: circle, part: condensation, 'on': condensation}
    point:
      - {line: 21, kind: circle, at: 'gives out heat'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. Condensation is a vapour changing into a liquid, and it gives out heat. Sublimation is a solid changing straight into a gas.'
    write: '1. Condensation: vapour → liquid; sublimation: solid → gas'
  - say: 'Melting, evaporation, boiling and sublimation take in heat. Freezing and condensation give it out. In the next lesson, we look at the evidence that particles move. Now try the problem.'
    write: '2. Heat in: melt, evaporate, boil, sublime; heat out: freeze, condense'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Which of these substances sublimes when heated? A. sodium chloride  B. iodine  C. sand  D. candle wax'
    answer: 'B'
    accept: ['iodine', 'B. iodine', 'B.']
    working:
      - 'Sodium chloride, sand and candle wax do not change straight from solid to gas (candle wax melts first).'
      - 'Iodine changes straight from a solid into a vapour when heated, so it sublimes. Answer: B.'
    needs_working: false
