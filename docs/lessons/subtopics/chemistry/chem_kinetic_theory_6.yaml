# The evidence that particles move (lesson 6 of 6): the four pieces of evidence named, then each taught, then a lighter gas diffusing faster, worked through on the ammonia and hydrogen chloride tube, with JAMB's porous-plug form and the trap.
format_version: 1
subject: chemistry
subtopic: 'Kinetic theory and changes of state'
subtopic_id: 702e0df2-1ca8-5737-8c9b-32846cd78f8f
part: 6
title: 'The evidence that particles move'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://elearn.education.gov.ng
  - https://passnownow.com
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is the evidence that particles move.'
    write: 'The evidence that particles move'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lessons, we used the idea that particles are always moving. But particles are far too small to see. So how do we know that they move? We look for evidence.'
    write: 'Particles are too small to see. How do we know they move?'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn the evidence that particles move, and use diffusion to tell which of two gases moves faster.'
    write: 'Today: the evidence, and which gas diffuses faster'

  # ---------------------------------------------------------------- the evidence, named
  - section: 'The evidence'
    say: 'There are four pieces of evidence. They are evaporation, sublimation, diffusion and Brownian motion.'
    write: 'Evidence: evaporation, sublimation, diffusion, Brownian motion'
  - say: 'Evaporation and sublimation are evidence, because particles must move to escape from a liquid or a solid. You met both in the last two lessons.'
    write: 'Evaporation, sublimation: particles must move to escape'

  # ---------------------------------------------------------------- diffusion
  - section: 'Diffusion'
    say: 'Now diffusion. Diffusion is the spreading of particles from a region of high concentration, where there are many of them, to a region of low concentration, where there are few.'
    write: 'Diffusion: particles spread from high to low concentration'
    doodle: {name: 'custom:sub_chem_kinetic_theory_a3', id: dia, size: scene, caption: 'the three states as particles', 'on': spreading}
  - say: 'For example, when akara is fried in the kitchen, the smell soon reaches every room. The smell particles move and spread out among the particles of the air.'
    write: 'E.g. the smell of frying akara spreads through the house'
  - say: 'Diffusion is fastest in gases, because gas particles are far apart and move fast. It is slower in liquids, and it hardly happens in solids.'
    write: 'Fastest in gases, slower in liquids'
    doodle_do:
      - {id: dia, op: pulse, part: gas-box, 'on': gases}
      - {id: dia, op: pulse, part: liquid-box, 'on': liquids}

  # ---------------------------------------------------------------- Brownian motion
  - section: 'Brownian motion'
    say: 'Now Brownian motion. Under a microscope, tiny specks such as pollen grains in water, or smoke in air, move about in a random zigzag path.'
    write: 'Brownian motion: tiny specks move in a random zigzag'
  - say: 'The specks are pushed about by particles of water or air, which are far too small to see, hitting them from all sides. So the zigzag shows that those particles are moving.'
    write: 'They are hit by moving particles too small to see'

  # ---------------------------------------------------------------- lighter gases diffuse faster
  - section: 'Which gas is faster?'
    say: 'Gases do not all diffuse at the same speed. At the same temperature, a lighter gas diffuses faster than a heavier one. We compare how heavy their molecules are by the relative molecular mass.'
    write: 'A lighter gas (smaller relative molecular mass) diffuses faster'
    point:
      - {line: 10, kind: underline, at: 'diffuses faster'}

  # worked example: the tube
  - section: 'Worked example'
    say: 'Let us solve one. Cotton wool soaked in ammonia solution is put at one end of a long glass tube, and cotton wool soaked in concentrated hydrochloric acid at the other end. We must find where the white ring forms.'
    write: 'Ammonia ($\ce{NH3}$) at one end, hydrochloric acid (HCl) at the other: where is the ring?'
    doodle: {name: 'custom:sub_chem_kinetic_theory_t', id: tube, size: scene, caption: 'ammonia and hydrogen chloride in a tube', 'on': tube}
  - say: 'Each end gives off a gas. Ammonia gas and hydrogen chloride gas diffuse towards each other. Where they meet, they react to form white ammonium chloride.'
    write: '$\ce{NH3 + HCl -> NH4Cl}$ (white) where the gases meet'
  - say: 'The relative molecular mass of ammonia is 17, and that of hydrogen chloride is 36.5. Ammonia is the lighter gas, so it diffuses faster.'
    write: '$\ce{NH3}$ = 17, HCl = 36.5: $\ce{NH3}$ is lighter, so faster'
    doodle_do:
      - {id: tube, op: show, part: nh3-path, 'on': ammonia}
      - {id: tube, op: show, part: hcl-path, 'on': hydrogen}
  - say: 'What does this tell us? In the same time, the ammonia travels further. So the white ring forms nearer the hydrochloric acid end.'
    write: '∴ the white ring forms nearer the HCl end'
    doodle_do:
      - {id: tube, op: show, part: ring, 'on': ring}
    point:
      - {line: 14, kind: circle, at: 'nearer the HCl end'}

  # ---------------------------------------------------------------- JAMB's other form
  - section: 'JAMB example'
    say: 'JAMB uses the same idea in another form. When ammonium chloride is heated, it splits into ammonia and hydrogen chloride. If the two gases pass through a porous plug, the lighter ammonia comes through first.'
    write: '$\ce{NH4Cl ->[heat] NH3 + HCl}$: $\ce{NH3}$ comes through first'
  - say: 'Ammonia is an alkaline gas, so damp litmus paper on the far side turns blue first. Later, when the hydrogen chloride arrives, it turns red.'
    write: 'Damp litmus paper turns blue first, then red'

  # ---------------------------------------------------------------- trap
  - section: 'JAMB trap'
    say: 'Here is a common trap. Some students think the heavier gas travels further. It does not. The lighter gas diffuses faster, so it travels further, and the ring forms nearer the heavier gas.'
    write: 'Trap: the lighter gas travels further, not the heavier'
    doodle_do:
      - {id: tube, op: pulse, part: nh3-path, 'on': lighter}

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Oxygen has a relative molecular mass of 32, and carbon(IV) oxide has 44. Which of them diffuses faster? Pause the lesson and decide before I go on.'
    write: 'Which diffuses faster: oxygen ($\ce{O2}$ = 32) or carbon(IV) oxide ($\ce{CO2}$ = 44)?'
  - say: 'Oxygen has the smaller relative molecular mass, 32 against 44. So oxygen is the lighter gas, and it diffuses faster.'
    write: '$\ce{O2}$: lighter, so it diffuses faster ✓'
    point:
      - {line: 19, kind: circle, at: 'diffuses faster'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. Evaporation, sublimation, diffusion and Brownian motion are the evidence that particles move.'
    write: '1. Evidence: evaporation, sublimation, diffusion, Brownian motion'
  - say: 'In diffusion, particles spread from high to low concentration, and a lighter gas diffuses faster. That completes the kinetic theory and changes of state. Now try the problem, and then you will try new questions on the whole topic.'
    write: '2. Diffusion: high to low concentration; a lighter gas is faster'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'At the same temperature, which of these gases diffuses fastest? A. oxygen (O₂ = 32)  B. hydrogen (H₂ = 2)  C. carbon(IV) oxide (CO₂ = 44)  D. chlorine (Cl₂ = 71)'
    answer: 'B'
    accept: ['hydrogen', 'H2', 'H₂', 'B. hydrogen', 'B.']
    working:
      - 'A lighter gas diffuses faster than a heavier one.'
      - 'Hydrogen has the smallest relative molecular mass, 2, so it is the lightest and diffuses fastest. Answer: B.'
    needs_working: false
