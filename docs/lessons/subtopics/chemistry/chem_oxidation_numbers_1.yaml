# Oxidation numbers (lesson 1): the rules and their use in finding an unknown oxidation number.
format_version: 1
subject: chemistry
subtopic: 'Oxidation numbers'
subtopic_id: b8f4af08-5104-52c6-a17c-ea300c893b9d
part: 1
title: 'The rules for oxidation numbers'
sources:
  - https://jambsyllabus.pages.dev/chemistry/
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
moments:
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is the rules for oxidation numbers.'
    write: 'The rules for oxidation numbers'

  - section: 'Introduction'
    say: 'Oxidation numbers help us keep track of electrons in chemical changes. Before we use them in reactions, we need to know how to assign them.'
    write: 'Oxidation numbers help track electrons'

  - say: 'An oxidation number is a charge assigned to an atom by a set of rules. It is not necessarily the atom''s actual charge.'
    write: 'Oxidation number: an assigned charge on an atom'

  - section: 'Objectives'
    say: 'By the end of this lesson, you will be able to apply the oxidation number rules and find an unknown oxidation number in a formula.'
    write: '1. Apply the rules.  2. Find an unknown number.'

  - section: 'The rules'
    say: 'We will use rules for an element on its own, a simple ion, oxygen, hydrogen, a compound total and an ion total.'
    write: 'Rules: element, simple ion, oxygen, hydrogen, compound total, ion total'
    diagram:
      id: rules
      kind: table
      caption: 'Oxidation number rules'
      columns: ['Case', 'Number or total']
      rows:
        - ['Element alone', '']
        - ['Simple ion', '']
        - ['Oxygen', '']
        - ['Hydrogen', '']
        - ['Compound total', '']
        - ['Ion total', '']

  - say: 'Before we use a formula, remember that a small number after a symbol counts the atoms of that element. If there is no small number, there is one atom of that element.'
    write: 'Small number: atoms of that element; no number means one'

  - section: 'Element'
    say: 'An element on its own has an oxidation number of zero.'
    write: 'Element on its own: oxidation number = $0$'
    diagram_do:
      - {id: rules, op: fill, part: 'cell:1,2', text: '0', 'on': zero}

  - say: 'For example, oxygen gas is written O₂. It is an element on its own, so each oxygen atom has oxidation number zero.'
    write: 'Oxygen ($\ce{O2}$): each $\ce{O}$ is $0$'

  - section: 'Simple ion'
    say: 'An ion is a charged atom or group of atoms. A simple ion is a single charged atom, and its oxidation number equals its charge.'
    write: 'Simple ion: oxidation number = ion charge'
    diagram_do:
      - {id: rules, op: fill, part: 'cell:2,2', text: 'ion charge', 'on': charge}

  - say: 'For example, the sodium ion, Na⁺, has a charge of plus one. Its oxidation number is therefore plus one.'
    write: 'Sodium ion ($\ce{Na+}$): oxidation number $+1$'

  - section: 'Oxygen'
    say: 'Oxygen usually has oxidation number minus two in a compound. For example, oxygen in water, H₂O, has oxidation number minus two.'
    write: 'Oxygen: usually $-2$; in water ($\ce{H2O}$), $\ce{O}$ is $-2$'
    diagram_do:
      - {id: rules, op: fill, part: 'cell:3,2', text: 'usually −2', 'on': two}

  - say: 'There are exceptions. In hydrogen peroxide, H₂O₂, each oxygen atom has oxidation number minus one.'
    write: 'Hydrogen peroxide ($\ce{H2O2}$): each $\ce{O}$ is $-1$'

  - section: 'Hydrogen'
    say: 'Hydrogen usually has oxidation number plus one in a compound. For example, hydrogen in water has oxidation number plus one.'
    write: 'Hydrogen: usually $+1$; in $\ce{H2O}$, $\ce{H}$ is $+1$'
    diagram_do:
      - {id: rules, op: fill, part: 'cell:4,2', text: 'usually +1', 'on': one}

  - say: 'An exception is a metal hydride. In sodium hydride, NaH, hydrogen has oxidation number minus one.'
    write: 'Sodium hydride ($\ce{NaH}$): $\ce{H}$ is $-1$'

  - section: 'Compound total'
    say: 'In a compound with no overall charge, the oxidation numbers of all the atoms add up to zero. We must count every atom in the formula.'
    write: 'Neutral compound: oxidation numbers add up to $0$'
    diagram_do:
      - {id: rules, op: fill, part: 'cell:5,2', text: '0', 'on': zero}

  - say: 'Let us check water. It has two hydrogen atoms, each at plus one, and one oxygen atom at minus two.'
    write: '$\ce{H2O}$: $2(+1) + 1(-2) = 0$'

  - say: 'Two plus minus two is zero, as the compound rule requires.'
    write: '$+2 - 2 = 0$'

  - section: 'Ion total'
    say: 'For an ion made of several atoms, the oxidation numbers add up to the overall charge of the ion.'
    write: 'Ion: oxidation numbers add up to its charge'
    diagram_do:
      - {id: rules, op: fill, part: 'cell:6,2', text: 'ion charge', 'on': charge}

  - say: 'For example, the hydroxide ion, OH⁻, has an overall charge of minus one. Its oxygen is minus two and its hydrogen is plus one.'
    write: 'Hydroxide ion ($\ce{OH-}$): $\ce{O}$ is $-2$, $\ce{H}$ is $+1$'

  - say: 'Minus two plus one is minus one, which equals the charge of the hydroxide ion.'
    write: '$-2 + 1 = -1$'

  - section: 'Worked example'
    say: 'Let us find the oxidation number of sulphur in tetraoxosulphate(VI) acid, also called sulphuric acid. Its formula is H₂SO₄.'
    write: 'Find sulphur in tetraoxosulphate(VI) acid ($\ce{H2SO4}$)'

  - say: 'There are two hydrogen atoms, each with oxidation number plus one.'
    write: '$\ce{H}$: $2$ atoms, each $+1$'

  - say: 'There are four oxygen atoms, each with oxidation number minus two.'
    write: '$\ce{O}$: $4$ atoms, each $-2$'

  - say: 'Let x be the oxidation number of sulphur. There is one sulphur atom in the formula.'
    write: 'Let sulphur ($\ce{S}$) be $x$; there is $1$ $\ce{S}$ atom'

  - say: 'The acid has no overall charge, so the total is zero. We write two times plus one, plus x, plus four times minus two, equals zero.'
    write: '$2(+1) + x + 4(-2) = 0$'

  - say: 'Multiplying gives two plus x minus eight equals zero.'
    write: '$2 + x - 8 = 0$'

  - say: 'Combining the numbers gives x minus six equals zero.'
    write: '$x - 6 = 0$'

  - say: 'Adding six to both sides gives x equals plus six. The oxidation number of sulphur is plus six.'
    write: '$x = +6$; sulphur is $+6$'

  - section: 'JAMB example'
    say: 'A JAMB question asks for the oxidation number of boron in sodium tetrahydridoborate, NaBH₄. Take sodium as plus one and each hydrogen as minus one.'
    write: 'Find boron in sodium tetrahydridoborate ($\ce{NaBH4}$); $\ce{Na}$ is $+1$, $\ce{H}$ is $-1$'

  - say: 'Let x be the oxidation number of boron. The compound is neutral, so one plus x plus four times minus one equals zero.'
    write: '$1 + x + 4(-1) = 0$'

  - say: 'The four hydrogen atoms contribute minus four. Combining the numbers gives x minus three equals zero.'
    write: '$x - 3 = 0$'

  - say: 'Adding three to both sides gives plus three for boron.'
    write: 'Boron ($\ce{B}$): $x = +3$'

  - section: 'JAMB traps'
    say: 'Do not use minus two for oxygen in every substance. Check for an exception such as a peroxide. Also multiply each oxidation number by the number of those atoms before finding the total.'
    write: 'Traps: check exceptions; count every atom'

  - section: 'Check yourself'
    say: 'Find the oxidation number of chlorine in hydrogen chloride, HCl. Pause the lesson and try it.'
    write: 'Find chlorine in hydrogen chloride ($\ce{HCl}$)'

  - say: 'Hydrogen is plus one. Let chlorine be x. The compound is neutral, so plus one plus x equals zero.'
    write: '$+1 + x = 0$'

  - say: 'Subtracting one from both sides gives x equals minus one. Chlorine has oxidation number minus one.'
    write: 'Chlorine ($\ce{Cl}$): $x = -1$'

  - section: 'Recap'
    say: 'An element on its own is zero, and a simple ion has the same oxidation number as its charge.'
    write: '1. Element alone: $0$; simple ion: its charge'

  - say: 'Oxygen is usually minus two and hydrogen is usually plus one. Peroxides and metal hydrides are exceptions we have seen.'
    write: '2. $\ce{O}$ usually $-2$; $\ce{H}$ usually $+1$; check exceptions'

  - say: 'The total is zero in a neutral compound and equals the charge in an ion. Use that total to find an unknown oxidation number. Now try the problem.'
    write: '3. Compound total: $0$; ion total: ion charge'

problems:
  - ask: 'Find the oxidation number of nitrogen in the nitrate ion ($\ce{NO3-}$).'
    answer: '+5'
    accept: ['5', 'plus 5', 'plus five', '+5']
    working:
      - 'Let the oxidation number of nitrogen be $x$. Each oxygen atom is $-2$.'
      - 'The ion has charge $-1$, so $x + 3(-2) = -1$.'
      - '$x - 6 = -1$, so $x = +5$.'
    needs_working: true
