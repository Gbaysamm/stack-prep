# Pure and impure substances, lesson 1 of 2: definitions and the tests for purity (melting and boiling points, chromatography, density), on one annotated diagram (two particle boxes, a heating graph and two chromatography strips).
format_version: 1
subject: chemistry
subtopic: 'Pure and impure substances'
subtopic_id: 2bd073d8-69e8-59b2-9839-192158a09fe7
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://edupadi.com/classroom/l/classification-of-matter
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
  - JAMB 2013 and 2017 Q (effect of an impurity on melting point), 2011 Q (impurities in iron), in our bank under related subtopics
part: 1
title: 'Pure and impure substances and tests for purity'
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is pure and impure substances and the tests for purity.'
    write: 'Pure and impure substances and tests for purity'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In chemistry, a substance is pure only when it is one substance with nothing else mixed in. Most things around us are not pure in this sense.'
    write: 'Pure = one substance, nothing else mixed in'
  - say: 'JAMB asks how we test a substance for purity. We check whether a substance is pure before we learn to separate mixtures.'
    write: 'JAMB asks how to test for purity'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'By the end of this lesson you will be able to define a pure substance and an impure substance.'
    write: '1. Define pure and impure substances'
  - say: 'You will also be able to use melting point, boiling point, chromatography and density to decide whether a substance is pure.'
    write: '2. Test a substance for purity'

  # ---------------------------------------------------------------- pure substance
  - section: 'Pure substance'
    say: 'A pure substance contains one substance only. It has a fixed composition and fixed properties, such as a sharp melting point. Look at the first box. Every particle is the same.'
    write: 'Pure substance: one substance only, fixed composition and properties'
    doodle: {name: 'custom:sub_chem_pure_impure_substances_a', id: dia, size: scene, caption: 'pure and impure', 'on': box}
    doodle_do:
      - {id: dia, op: circle, part: pure-tag, 'on': pure}
      - {id: dia, op: pulse, part: pure-box, 'on': same}
    point:
      - {line: 5, kind: underline, at: 'one substance only'}
  - say: 'Both elements and compounds can be pure. Gold, oxygen gas and sulphur are pure elements. Distilled water, sodium chloride and sugar are pure compounds.'
    write: 'Elements and compounds can be pure, e.g. gold (Au), oxygen ($\ce{O2}$), sulphur (S), water ($\ce{H2O}$), sodium chloride (NaCl)'
  - say: 'Let us solve this. Which of these is a pure substance? Is it palm wine, kerosene, sea water or sulphur?'
    write: 'Example 1: Which is pure? Palm wine, kerosene, sea water or sulphur'
  - say: 'Palm wine is water with sugars and alcohol in it. Kerosene is a mixture of many hydrocarbons. Sea water is water with salt and other substances dissolved in it. Each one contains more than one substance, so each is impure.'
    write: 'Palm wine, kerosene, sea water: more than one substance, so impure ✗'
  - say: 'Sulphur is one element, S, with nothing else mixed in. So sulphur is the pure substance.'
    write: 'Sulphur = S only, so pure ✓'
    doodle_do:
      - {id: dia, op: pulse, part: pure-box, 'on': pure}

  # ---------------------------------------------------------------- impure substance
  - section: 'Impure substance'
    say: 'An impure substance is a substance with other substances mixed in it. The unwanted substances are called impurities. So an impure substance is a mixture. Look at the second box.'
    write: 'Impure substance: contains impurities, so it is a mixture'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_pure_impure_substances_a2', 'on': impure}
      - {id: dia, op: circle, part: impure-tag, 'on': mixture}
      - {id: dia, op: pulse, part: impure-box, 'on': second}
  - say: 'The pink particles are the impurities. They are a different substance from the rest, and their amount can change from one sample to another.'
    write: 'Impurities: other substances present, in any amount'
    doodle_do:
      - {id: dia, op: circle, part: impurity, 'on': pink}
  - say: 'Be careful with the everyday word pure. Sachet pure water has minerals dissolved in it, and pure orange juice is water with sugar and acids in it. In chemistry, both are mixtures.'
    write: 'Sachet "pure water", "pure" juice = mixtures in chemistry'
  - say: 'Let us solve this. A sample of rock salt is sodium chloride with some sand in it. Is the sample pure, and what is the impurity?'
    write: 'Example 2: rock salt = NaCl with sand. Pure or impure?'
  - say: 'The sample holds two substances, sodium chloride and sand, so it is impure. We want the salt, so the sand is the impurity.'
    write: 'Two substances present, so impure; impurity = sand'
    doodle_do:
      - {id: dia, op: pulse, part: impurity, 'on': sand}
  - say: 'To purify it, dissolve the sample in water, filter off the sand and then evaporate the water to get the salt back. You will meet these methods again under separation processes.'
    write: 'To purify: dissolve, filter, evaporate'

  # ---------------------------------------------------------------- tests for purity
  - section: 'Tests for purity'
    say: 'How do we know a substance is pure? We test it. The main tests are its melting point, its boiling point, its density and paper chromatography.'
    write: 'Tests for purity: melting point (m.p.), boiling point (b.p.), density, chromatography'
  - say: 'A pure solid melts at one sharp, fixed temperature. Look at the graph of a pure solid being heated. The temperature rises, stays flat while it melts and then rises again.'
    write: 'Pure solid: melts sharply at a fixed temperature'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_pure_impure_substances_a3', 'on': graph}
      - {id: dia, op: pulse, part: pure-curve, 'on': flat}
  - say: 'A pure liquid boils at one fixed temperature too. Pure water boils at 100 degrees Celsius at sea level, and pure ice melts at 0 degrees Celsius.'
    write: 'Pure water: b.p. 100 °C (sea level); pure ice: m.p. 0 °C'
  - say: 'Each pure substance has its own melting point and boiling point, listed in data books. If a sample melts sharply at the book value, it is pure.'
    write: 'Sharp m.p. equal to the data book value, so pure'
    doodle_do:
      - {id: dia, op: circle, part: pure-curve, 'on': sharply}
  - say: 'Let us solve this. Pure naphthalene melts at 80 degrees Celsius. Sample A melts sharply at 80 degrees Celsius. Sample B melts between 74 and 78 degrees Celsius. Which is pure?'
    write: 'Example 3: naphthalene m.p. 80 °C. A melts at 80 °C; B melts 74–78 °C'
  - say: 'Sample A melts sharply, at exactly the book value. So sample A is pure.'
    write: 'A: sharp, equal to 80 °C, so pure ✓'
  - say: 'Sample B melts over a range of 4 degrees, and it melts below 80 degrees Celsius. Both are signs of an impurity, so sample B is impure.'
    write: 'B: range 74 to 78 °C, below 80 °C, so impure ✗'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_pure_impure_substances_a4', 'on': below}
      - {id: dia, op: pulse, part: impure-curve, 'on': impurity}

  # ---------------------------------------------------------------- chromatography and density
  - section: 'Chromatography and density'
    say: 'Two more tests. On chromatography paper, a pure substance gives only one spot. An impure one gives two or more spots. Look at the two paper strips.'
    write: 'Chromatography: pure gives 1 spot; impure gives 2 or more'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_pure_impure_substances_a5', 'on': strips}
      - {id: dia, op: circle, part: chroma-pure, 'on': one}
  - say: 'The impure sample on the right gives three spots. So it contains at least three substances.'
    write: 'Impure sample: 3 spots, so at least 3 substances'
    doodle_do:
      - {id: dia, op: circle, part: chroma-impure, 'on': three}
  - say: 'A pure substance also has a fixed density. Pure water has a density of about 1 gram per cubic centimetre. A different value shows something else is mixed in.'
    write: 'Pure substance: fixed density, e.g. pure water about 1 g/cm³'

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is a trap. A pure substance is not always an element. Water has two kinds of atom, yet distilled water is pure, because it is one compound.'
    write: 'Pure is not only elements: distilled water ($\ce{H2O}$) is pure'
  - say: 'Here is a last trap, for written answers. Every solid has a melting point, so do not just write that a pure substance has a melting point. Write that it has a sharp, fixed melting point.'
    write: 'Write "sharp, fixed m.p.", not just "a m.p."'
    point:
      - {line: 27, kind: underline, at: 'sharp, fixed m.p.'}

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Your turn. Pure benzoic acid melts at 122 degrees Celsius. A sample melts between 115 and 119 degrees Celsius. Is the sample pure? Pause and decide before I go on.'
    write: 'Benzoic acid m.p. 122 °C; sample melts 115–119 °C. Pure?'
  - say: 'The sample melts over a range of 4 degrees, so it does not melt sharply.'
    write: 'Melts over a range, not sharp'
    doodle_do:
      - {id: dia, op: pulse, part: impure-curve, 'on': range}
  - say: 'And it melts below 122 degrees Celsius. An impurity lowers the melting point. So the sample is impure.'
    write: 'Below 122 °C, so the sample is impure ✓'
    point:
      - {line: 30, kind: circle, at: 'impure'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. A pure substance is one substance with a fixed composition and fixed properties. An impure substance has impurities in it, so it is a mixture.'
    write: '1. Pure: one substance; impure: has impurities, a mixture'
    doodle_do:
      - {id: dia, op: pulse, part: pure-tag, 'on': pure}
      - {id: dia, op: pulse, part: impure-tag, 'on': impure}
  - say: 'A pure substance melts and boils sharply at its data book values, has a fixed density and gives one spot on chromatography paper. That''s the lesson. In the next lesson you will learn the effect of impurities and percentage purity.'
    write: '2. Tests: sharp m.p. and b.p., fixed density, one spot'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Pure naphthalene melts at 80 °C. A sample of naphthalene melts between 75 °C and 78 °C. What does this show? A. the sample is pure  B. the sample is impure  C. the sample is an element  D. the impurity raised its melting point'
    answer: 'B'
    accept: ['B. the sample is impure', 'impure', 'the sample is impure']
    working:
      - 'It melts over a range (75 to 78 °C), not sharply: a sign of an impurity.'
      - 'It melts below 80 °C: an impurity lowers the melting point.'
      - 'So the sample is impure. Answer: B.'
      - 'D is wrong: an impurity lowers the melting point; it raises the boiling point.'
