# Pure and impure substances (lesson 1 of 5): what a substance is, what a pure substance and an impure substance are, impurities, two guided examples and the everyday word "pure", each taught before it is used.
format_version: 1
subject: chemistry
subtopic: 'Pure and impure substances'
subtopic_id: 2bd073d8-69e8-59b2-9839-192158a09fe7
part: 1
title: 'Pure and impure substances'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://edupadi.com/classroom/l/classification-of-matter
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
  - JAMB 2013 and 2017 Q (effect of an impurity on melting point), 2011 Q (impurities in iron), in our bank under related subtopics
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is pure and impure substances.'
    write: 'Pure and impure substances'

  # ---------------------------------------------------------------- introduction: the big picture
  - section: 'Introduction'
    say: 'Everything around you is matter, and all matter is made of tiny particles, far too small to see. Matter comes in many different kinds, and each kind is called a substance. For example, water, table salt and gold are three different substances.'
    write: 'A substance is one kind of matter, e.g. water, salt, gold'
  - say: 'Chemists often need to know whether a sample of a substance has anything else mixed into it. This matters because even a little of something else changes how the substance behaves. For example, a medicine must have nothing harmful mixed into it before it is sold.'
    write: 'Chemists must know whether a sample has anything else mixed in'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn what pure and impure substances are, and how to tell them apart.'
    write: 'Today: pure and impure substances, and how to tell them apart'

  # ---------------------------------------------------------------- pure substance
  - section: 'Pure substance'
    say: 'Let us start with a pure substance. A pure substance is one substance only, with nothing else mixed in.'
    write: 'Pure substance: one substance only, nothing else mixed in'
    doodle: {name: 'custom:sub_chem_pure_impure_substances_a', id: dia, size: scene, caption: 'pure and impure', 'on': pure}
    point:
      - {line: 4, kind: underline, at: 'one substance only'}
  - say: 'Look at the box. It shows the particles of a pure substance. Every particle in it is the same, because there is only one substance.'
    write: 'Every particle is the same'
    doodle_do:
      - {id: dia, op: pulse, part: pure-box, 'on': box}
      - {id: dia, op: circle, part: pure-tag, 'on': only}
  - say: 'The composition of a sample is what it is made of. Because nothing else is mixed in, every sample of a pure substance is made of exactly the same thing. So we say that a pure substance has a fixed composition.'
    write: 'Fixed composition: every sample is made of the same thing'
  - say: 'A pure substance also has fixed properties. Properties are the things we can measure about a substance, such as the temperature at which it boils. For example, pure water always boils at 100 degrees Celsius at sea level. In the next lesson, we use these fixed properties to test whether a sample is pure.'
    write: 'Fixed properties, e.g. pure water boils at 100 °C'
  - say: 'A pure substance can be a single element, such as gold or sulphur. It can also be a single compound, such as distilled water or sodium chloride. Distilled water is water made pure by boiling it and cooling the steam back into water. You will meet elements and compounds in their own lessons.'
    write: 'Pure, e.g. gold (Au), sulphur (S), distilled water ($\ce{H2O}$), sodium chloride (NaCl)'

  # ---------------------------------------------------------------- impure substance
  - section: 'Impure substance'
    say: 'We have seen that a pure substance has nothing else mixed in. Now let us look at an impure substance. An impure substance is a substance with one or more other substances mixed into it.'
    write: 'Impure substance: other substances mixed in'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_pure_impure_substances_a2', 'on': impure}
  - say: 'The other substances mixed in are unwanted, and they are called impurities. Look at the second box. The pink particles are the impurities.'
    write: 'Impurities: the unwanted substances mixed in'
    doodle_do:
      - {id: dia, op: pulse, part: impure-box, 'on': second}
      - {id: dia, op: circle, part: impurity, 'on': pink}
  - say: 'A mixture is two or more substances mixed together. An impure substance holds the main substance and its impurities, which is two or more substances, so an impure substance is a mixture.'
    write: 'Two or more substances, so it is a mixture'
    doodle_do:
      - {id: dia, op: circle, part: impure-tag, 'on': mixture}
  - say: 'The amount of impurity can change from one sample to another. So, unlike a pure substance, an impure substance has no fixed composition.'
    write: 'The amount of impurity varies, so no fixed composition'

  # ---------------------------------------------------------------- worked examples
  - section: 'Worked example'
    say: 'Now that we know what pure and impure substances are, let us use this to pick out a pure substance. We are given palm wine, kerosene, sea water and sulphur. Which of them is pure?'
    write: 'Which is pure? Palm wine, kerosene, sea water, sulphur'
  - say: 'To answer this, we ask one question of each. Is it one substance only, with nothing else mixed in?'
    write: 'Ask: one substance only?'
  # One verdict said, then written; then the next (founder, 12 Nov 2026).
  - say: 'Palm wine is water with sugars and alcohol in it. That is more than one substance, so palm wine is impure.'
    write: 'Palm wine: water, sugars, alcohol, so impure ✗'
  - say: 'Kerosene is a mixture of many different substances taken from crude oil, so kerosene is impure too.'
    write: 'Kerosene: many substances from crude oil, so impure ✗'
  - say: 'Sea water is water with salt and other substances dissolved in it, so sea water is also impure.'
    write: 'Sea water: water, salt and more, so impure ✗'
  - say: 'Sulphur is one substance only, with nothing else mixed in. So sulphur is the pure substance.'
    write: 'Sulphur: one substance only, so pure ✓'
    doodle_do:
      - {id: dia, op: pulse, part: pure-box, 'on': pure}
    point:
      - {line: 18, kind: circle, at: 'pure ✓'}
  - say: 'Here is a second example, where we must also name the impurity. A sample of rock salt is sodium chloride with some sand in it. Is the sample pure, and what is the impurity?'
    write: 'Rock salt: sodium chloride with sand. Pure? Impurity?'
  - say: 'The sample holds two substances, sodium chloride and sand. That is more than one substance, so the sample is impure.'
    write: 'Two substances, so impure'
  - say: 'The substance we want is the salt, so the sand is the unwanted substance. This makes the sand the impurity.'
    write: 'The impurity is sand'
    doodle_do:
      - {id: dia, op: pulse, part: impurity, 'on': impurity}
  - say: 'To make the salt pure, we would dissolve it in water and filter off the sand, which does not dissolve. Then we would evaporate the water to leave the salt behind. You will meet these methods under the separation of mixtures.'
    write: 'To purify: dissolve, filter, evaporate'

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is a common trap. In everyday speech, pure often means clean or safe. In chemistry, pure means one substance only. For example, sachet pure water is clean and safe to drink, but it has minerals dissolved in it, so in chemistry it is impure.'
    write: 'Pure means one substance only, not clean; sachet "pure water" is impure'
  - say: 'Here is another trap. Some students think that only an element can be pure. That is not so. A compound on its own, with nothing mixed in, is also pure. For example, every particle of distilled water contains hydrogen and oxygen, yet distilled water is pure, because it is one substance only.'
    write: 'Pure is not only elements: distilled water is pure'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Which of these is impure? Is it distilled water, gold, sachet water or sodium chloride? Pause the lesson and decide before I go on.'
    write: 'Which is impure? Distilled water, gold, sachet water, sodium chloride'
  - say: 'Distilled water, gold and sodium chloride are each one substance only, so they are pure.'
    write: 'Distilled water, gold, sodium chloride: one substance, so pure ✗'
    doodle_do:
      - {id: dia, op: pulse, part: pure-box, 'on': pure}
  - say: 'Sachet water has minerals dissolved in it, so sachet water is the impure one.'
    write: 'Sachet water: minerals mixed in, so impure ✓'
    doodle_do:
      - {id: dia, op: circle, part: impurity, 'on': minerals}
    point:
      - {line: 27, kind: circle, at: 'impure ✓'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. A pure substance is one substance only, with nothing else mixed in. Every sample of it is made of the same thing, and it has fixed properties, such as its boiling point.'
    write: '1. Pure: one substance only; fixed composition and properties'
    doodle_do:
      - {id: dia, op: pulse, part: pure-tag, 'on': pure}
  - say: 'An impure substance has unwanted substances, called impurities, mixed into it. So it is a mixture, and it has no fixed composition. In the next lesson, we use melting and boiling points to test whether a sample is pure. Now try the problem.'
    write: '2. Impure: impurities mixed in, so a mixture'
    doodle_do:
      - {id: dia, op: pulse, part: impure-tag, 'on': impure}

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Which of these is a pure substance? A. sea water  B. distilled water  C. palm wine  D. air'
    answer: 'B'
    accept: ['distilled water', 'B. distilled water']
    working:
      - 'Sea water is water with salt and other substances dissolved in it: more than one substance, so impure.'
      - 'Palm wine is water with sugars and alcohol in it: impure.'
      - 'Air is a mixture of gases, such as nitrogen and oxygen: impure.'
      - 'Distilled water is one substance only, with nothing else mixed in, so it is pure. Answer: B.'
    needs_working: false
