# Pure and impure substances, lesson 2 of 2: the effect of impurities on melting and boiling points, percentage purity and JAMB's traps, on one annotated diagram (two particle boxes, a heating graph and two chromatography strips).
format_version: 1
subject: chemistry
subtopic: 'Pure and impure substances'
subtopic_id: 2bd073d8-69e8-59b2-9839-192158a09fe7
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://edupadi.com/classroom/l/classification-of-matter
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
  - JAMB 2013 and 2017 Q (effect of an impurity on melting point), 2011 Q (impurities in iron), in our bank under related subtopics
part: 2
title: 'The effect of impurities and percentage purity'
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. This is lesson two of two on pure and impure substances: the effect of impurities and percentage purity.'
    write: 'Effect of impurities; percentage purity'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson you met pure and impure substances and the tests for purity. JAMB also asks how an impurity changes the melting point and the boiling point.'
    write: 'JAMB asks: effect of impurities on m.p. and b.p.'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'By the end of this lesson you will be able to do two things. One, state how an impurity changes the melting point and the boiling point, and work out a percentage purity.'
    write: '1. Effect of impurities; percentage purity'
  - say: 'Two, spot the traps JAMB sets on this topic.'
    write: '2. Spot the JAMB traps'

  # ---------------------------------------------------------------- effect of impurities
  - section: 'Effect of impurities'
    say: 'Now the key rule. An impurity lowers the melting point of a solid, and makes it melt over a range of temperature, not sharply.'
    write: 'Impurity: lowers m.p. and makes it melt over a range'
    doodle: {name: 'custom:sub_chem_pure_impure_substances_a4', id: dia, size: scene, caption: 'pure and impure', 'on': lowers}
    point:
      - {line: 4, kind: underline, at: 'lowers m.p.'}
  - say: 'Look at the orange line on the graph. The impure solid melts at a lower temperature, and its line slopes instead of staying flat. That slope is the range.'
    write: 'Impure: melts lower, and the line slopes, not flat'
    doodle_do:
      - {id: dia, op: pulse, part: impure-curve, 'on': orange}
      - {id: dia, op: pulse, part: pure-curve, 'on': flat}
  - say: 'A solid impurity dissolved in a liquid raises its boiling point, and the liquid boils over a range. Salt water boils above 100 degrees Celsius.'
    write: 'Dissolved solid impurity: raises b.p.; boils over a range'
  - say: 'So remember the pair. An impurity lowers the melting point and raises the boiling point.'
    write: 'Impurity: m.p. lowered ↓, b.p. raised ↑'
    point:
      - {line: 7, kind: circle, at: 'm.p. lowered'}
  - say: 'Let us solve this. Pure water freezes at 0 degrees Celsius and boils at 100 degrees Celsius. Some salt is dissolved in it. What happens to each temperature?'
    write: 'Example 4: salt in pure water. Freezing point? Boiling point?'
  - say: 'The salt is an impurity. The freezing point is the same temperature as the melting point, so it is lowered. Salt water freezes below 0 degrees Celsius.'
    write: 'Freezing point lowered: below 0 °C'
  - say: 'The salt also raises the boiling point. So salt water boils above 100 degrees Celsius.'
    write: 'Boiling point raised: above 100 °C'
  - say: 'The same rule works for metals. The carbon in cast iron lowers its melting point below that of pure iron, so cast iron is easier to melt and pour into moulds.'
    write: 'Carbon in cast iron lowers its m.p., so it is easy to cast'
    doodle_do:
      - {id: dia, op: pulse, part: impure-curve, 'on': lowers}

  # ---------------------------------------------------------------- percentage purity
  - section: 'Percentage purity'
    say: 'We can also say how pure a sample is. Percentage purity is the mass of the pure substance divided by the mass of the whole sample, times 100.'
    write: '% purity = $\frac{\text{mass of pure substance}}{\text{mass of sample}} \times 100$'
  - say: 'Let us solve this. A 25.0 gram sample of impure salt contains 22.5 grams of sodium chloride. Find its percentage purity.'
    write: 'Example 5: sample = 25.0 g, NaCl = 22.5 g, % purity = ?'
  - say: 'Put the masses into the formula. 22.5 grams over 25.0 grams, times 100.'
    write: '% purity = $\frac{22.5\text{ g}}{25.0\text{ g}} \times 100$'
  - say: 'The grams cancel. 22.5 divided by 25.0 is 0.900, and 0.900 times 100 is 90.0.'
    write: '$= 0.900 \times 100 = 90.0\%$'
  - say: 'So the sample is 90.0 percent pure. The other 2.5 grams is the impurity.'
    write: '∴ % purity = 90.0%; impurity = 25.0 g − 22.5 g = 2.5 g'

  # ---------------------------------------------------------------- comparison
  - section: 'Comparison'
    say: 'Now compare the two boxes. A pure substance is one substance, with a fixed composition, a sharp melting point and a fixed boiling point.'
    write: 'Pure: one substance, fixed composition, sharp m.p. and b.p.'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_pure_impure_substances_a5', 'on': compare}
      - {id: dia, op: pulse, part: pure-box, 'on': pure}
      - {id: dia, op: pulse, part: pure-curve, 'on': sharp}
  - say: 'An impure substance is a mixture. It melts lower and over a range, boils higher and over a range, and gives more than one spot.'
    write: 'Impure: m.p. lower, b.p. higher, both over a range; 2 or more spots'
    doodle_do:
      - {id: dia, op: pulse, part: impure-box, 'on': mixture}
      - {id: dia, op: pulse, part: impure-curve, 'on': lower}
      - {id: dia, op: pulse, part: chroma-impure, 'on': spot}

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is a real JAMB question. The presence of an impurity in a substance will cause the melting point to do what? Be zero, reduce, increase, or be stable.'
    write: 'JAMB: an impurity makes the m.p. A. be zero B. reduce C. increase D. be stable'
  - say: 'The answer is reduce, option B. An impurity lowers the melting point.'
    write: 'B. reduce ✓'
    doodle_do:
      - {id: dia, op: circle, part: impure-curve, 'on': lowers}
  - say: 'Many students pick increase, because they mix up the melting point with the boiling point. It is the boiling point that an impurity raises.'
    write: 'C. increase ✗ (that is the b.p.)'
    point:
      - {line: 21, kind: circle, at: 'b.p.'}
  - say: 'Be stable is wrong too, because a steady, sharp melting point is the sign of a pure substance. And an impurity never makes the melting point zero.'
    write: 'D. be stable ✗ (sign of purity); A. be zero ✗'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Your turn. A 20.0 gram sample of impure sulphur contains 16.0 grams of pure sulphur. What is its percentage purity? Pause and work it out before I go on.'
    write: 'Sample = 20.0 g, sulphur = 16.0 g, % purity = ?'
  - say: 'Put the masses into the formula. 16.0 grams over 20.0 grams, times 100.'
    write: '% purity = $\frac{16.0\text{ g}}{20.0\text{ g}} \times 100$'
  - say: '16.0 divided by 20.0 is 0.800, and 0.800 times 100 is 80.0. So the sample is 80.0 percent pure.'
    write: '$= 0.800 \times 100 = 80.0\%$ pure'

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. An impurity lowers the melting point and raises the boiling point, both over a range. Percentage purity is the mass of pure substance over the mass of the sample, times 100.'
    write: '1. impurity: m.p. ↓, b.p. ↑; % purity = mass pure ÷ mass of sample × 100'
  - say: 'And for the traps, remember the pair. Lower melting point, higher boiling point. That''s the lesson. Next, try new questions on pure and impure substances.'
    write: '2. impurity: m.p. lower, b.p. higher'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'A 40.0 g sample of impure sodium chloride contains 34.0 g of pure sodium chloride. Calculate its percentage purity.'
    answer: '85.0%'
    accept: ['85%', '85', '85.0', '85 %', '85.0 %', '85 percent']
    working:
      - '% purity = mass of pure substance ÷ mass of sample × 100'
      - '= 34.0 g ÷ 40.0 g × 100'
      - '= 0.850 × 100'
      - '= 85.0%'
