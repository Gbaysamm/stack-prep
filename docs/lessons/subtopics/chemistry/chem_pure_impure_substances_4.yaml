# The effect of impurities (lesson 4 of 5): an impurity lowers the melting point and a dissolved solid impurity raises the boiling point, read on the heating graph, a guided salt-water example, pure against impure side by side, and the real JAMB question with its traps.
format_version: 1
subject: chemistry
subtopic: 'Pure and impure substances'
subtopic_id: 2bd073d8-69e8-59b2-9839-192158a09fe7
part: 4
title: 'The effect of impurities'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
  - https://edupadi.com/classroom/l/classification-of-matter
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
  - JAMB 2013 and 2017 Q (effect of an impurity on melting point), 2011 Q (impurities in iron), in our bank under related subtopics
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is the effect of impurities.'
    write: 'The effect of impurities'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lessons, you saw that an impure solid melts over a range, and below its data book value. Now we look closely at what an impurity does to the melting point and the boiling point. JAMB asks this often.'
    write: 'Impurities change the melting point (m.p.) and boiling point (b.p.)'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn what an impurity does to each of these two temperatures, and how to use this to answer JAMB questions.'
    write: 'Today: what an impurity does to the m.p. and the b.p.'

  # ---------------------------------------------------------------- melting point
  - section: 'Melting point'
    say: 'First, the melting point. An impurity lowers the melting point of a solid. It also makes the solid melt over a range of temperatures, instead of sharply.'
    write: 'Impurity: lowers the m.p., and it melts over a range'
    doodle: {name: 'custom:sub_chem_pure_impure_substances_a4', id: dia, size: scene, caption: 'pure and impure', 'on': lowers}
    point:
      - {line: 3, kind: underline, at: 'lowers the m.p.'}
  - say: 'Look at the graph. The blue line is the pure solid. It stays flat at one sharp melting point.'
    write: 'Blue line: pure, flat at a sharp m.p.'
    doodle_do:
      - {id: dia, op: pulse, part: pure-curve, 'on': blue}
  - say: 'The orange line is the impure solid. It melts at a lower temperature, and it slopes instead of staying flat. The slope shows that it melts over a range of temperatures.'
    write: 'Orange line: impure, lower and sloped'
    doodle_do:
      - {id: dia, op: pulse, part: impure-curve, 'on': orange}
      - {id: dia, op: circle, part: impure-curve, 'on': slope}

  # ---------------------------------------------------------------- boiling point
  - section: 'Boiling point'
    say: 'We have seen what an impurity does to the melting point. Now the boiling point. When a solid is dissolved in a liquid as an impurity, it raises the boiling point of the liquid, and the liquid boils over a range of temperatures.'
    write: 'Dissolved solid impurity: raises the b.p.; boils over a range'
    point:
      - {line: 6, kind: underline, at: 'raises the b.p.'}
  - say: 'So remember the two effects together. An impurity lowers the melting point and raises the boiling point.'
    write: 'Impurity: m.p. lowered ↓, b.p. raised ↑'
    point:
      - {line: 7, kind: circle, at: 'm.p. lowered'}

  # ---------------------------------------------------------------- worked example
  - section: 'Worked example'
    say: 'Now let us use these two effects on water. We are given that pure water freezes at 0 degrees Celsius and boils at 100 degrees Celsius. Some salt is dissolved in it. We must find what happens to each of these temperatures.'
    write: 'Salt in pure water (freezes at 0 °C, boils at 100 °C). What changes?'
  - say: 'First, the salt is a solid dissolved in the water, so it is an impurity in the water.'
    write: 'Salt = a dissolved impurity'
  - say: 'Freezing is melting in reverse, so a substance freezes at the same temperature at which it melts. The freezing point is the melting point, so the salt lowers it. Salt water freezes below 0 degrees Celsius.'
    write: 'Freezing point = m.p., lowered: below 0 °C'
  - say: 'Because the salt is a dissolved solid, it also raises the boiling point. So salt water boils above 100 degrees Celsius.'
    write: 'Boiling point raised: above 100 °C'
  - say: 'What does this tell us? One impurity moves the two temperatures in opposite directions. The melting point goes down, and the boiling point goes up.'
    write: '∴ m.p. down, b.p. up'
  - say: 'The same rule is used with metals. For example, cast iron is iron with some carbon in it. The carbon is an impurity, so it lowers the melting point below that of pure iron. This makes cast iron easier to melt and pour into moulds.'
    write: 'Carbon in cast iron lowers its m.p., so it is easy to cast'
    doodle_do:
      - {id: dia, op: pulse, part: impure-curve, 'on': lowers}

  # ---------------------------------------------------------------- comparison
  - section: 'Comparison'
    say: 'Now let us put pure and impure side by side. A pure substance melts sharply and boils at a fixed temperature, at its data book values, and it gives one spot on chromatography paper.'
    write: 'Pure: sharp m.p., fixed b.p., one spot'
    doodle_do:
      - {id: dia, op: stage, stage: 'custom:sub_chem_pure_impure_substances_a5', 'on': side}
      - {id: dia, op: pulse, part: pure-curve, 'on': sharply}
      - {id: dia, op: show, part: chroma-pure, 'on': spot}
  - say: 'An impure substance melts lower and boils higher, both over a range, and it gives two or more spots.'
    write: 'Impure: m.p. lower, b.p. higher, both over a range; two or more spots'
    doodle_do:
      - {id: dia, op: pulse, part: impure-curve, 'on': lower}
      - {id: dia, op: show, part: chroma-impure, 'on': spots}

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Here is a real JAMB question. The presence of an impurity in a substance will cause the melting point to be zero, to reduce, to increase or to be stable. Which is it?'
    write: 'JAMB: an impurity makes the m.p. A. be zero B. reduce C. increase D. be stable'
  - say: 'An impurity lowers the melting point, so the answer is reduce, option B.'
    write: 'B. reduce ✓'
    doodle_do:
      - {id: dia, op: circle, part: impure-curve, 'on': lowers}
  - say: 'Many students pick increase, because they mix up the melting point with the boiling point. It is the boiling point that an impurity raises. The melting point always goes down.'
    write: 'C. increase ✗ (that is the b.p.)'
    point:
      - {line: 18, kind: circle, at: 'b.p.'}
  - say: 'Option D, be stable, is wrong. A steady, sharp melting point is the sign of a pure substance, not an impure one.'
    write: 'D. be stable ✗ (a sign of purity)'
  - say: 'Option A, be zero, is wrong too. An impurity lowers the melting point by a few degrees, not all the way down to zero.'
    write: 'A. be zero ✗ (lowered by a few degrees)'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Some sugar is dissolved in pure water, and the solution is heated. Will it boil at 100 degrees Celsius, above it or below it? Pause the lesson and decide before I go on.'
    write: 'Sugar dissolved in pure water. Boils at, above or below 100 °C?'
  - say: 'The sugar is a dissolved solid impurity, and a dissolved solid impurity raises the boiling point. So the sugar solution boils above 100 degrees Celsius.'
    write: 'Dissolved impurity raises the b.p., so above 100 °C ✓'
    point:
      - {line: 22, kind: circle, at: 'above 100 °C'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. An impurity lowers the melting point, and the solid melts over a range.'
    write: '1. Impurity: m.p. lowered, over a range'
    doodle_do:
      - {id: dia, op: pulse, part: impure-curve, 'on': lowers}
  - say: 'A dissolved solid impurity raises the boiling point, and the liquid boils over a range. In the next lesson, we work out how pure a sample is. Now try the problem.'
    write: '2. Dissolved solid impurity: b.p. raised'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Which of these is true of an impure solid? A. it melts sharply at a higher temperature  B. it melts over a range at a lower temperature  C. it melts sharply at a lower temperature  D. it melts over a range at a higher temperature'
    answer: 'B'
    accept: ['B. it melts over a range at a lower temperature', 'over a range at a lower temperature']
    working:
      - 'An impurity stops a solid melting sharply: it melts over a range. So A and C are wrong.'
      - 'An impurity lowers the melting point, not raises it. So D is wrong.'
      - 'The impure solid melts over a range at a lower temperature. Answer: B.'
    needs_working: false
