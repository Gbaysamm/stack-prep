# Separation processes, lesson 1 of 2: separating solids from liquids and from other solids (filtration to magnetic separation), with a worked "which method?" example after each, on the solids apparatus scene.
format_version: 1
subject: chemistry
subtopic: 'Separation processes'
subtopic_id: c6a7158d-ee05-5392-bb4b-a39693edd7ac
part: 1
title: 'Separating solids from liquids and from other solids'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://syllabus.ng/waec/chemistry/
  - https://edupadi.com/classroom/l/separation-techniques
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. This is lesson one of two on separation processes: separating solids from liquids and from other solids.'
    write: 'Separating solids from liquids and from other solids'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'The parts of a mixture are not chemically joined, so a mixture is separated by physical means. Each method uses one property in which the parts differ.'
    write: 'a mixture is separated by physical means, using a difference between its parts'
  - say: 'JAMB asks which method separates a given mixture almost every year. It is also the first topic in the JAMB chemistry syllabus.'
    write: 'JAMB asks: which method separates this mixture?'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'By the end of this lesson you will be able to do two things. One, name each method for separating solids, and the difference between the parts that it uses.'
    write: '1. Each method for solids and the difference it uses'
  - say: 'Two, choose the right method for a given mixture, say why, and spot the traps JAMB sets.'
    write: '2. Choose the method for a given mixture; the JAMB traps'

  # ---------------------------------------------------------------- choosing
  - section: 'Choosing a method'
    say: 'For every mixture, ask two questions. Is each part a solid or a liquid? And how do the parts differ, in solubility, boiling point, density, magnetism or how fast they move?'
    write: 'ask: solid or liquid? how do the parts differ?'
    point:
      - {line: 5, kind: circle, at: 'how do the parts differ?'}

  # ---------------------------------------------------------------- filtration
  - section: 'Filtration'
    say: 'Filtration separates an insoluble solid from a liquid. The liquid passes through the tiny holes in the filter paper, but the solid particles are too big to pass.'
    write: 'Filtration: an insoluble solid from a liquid'
    doodle: {name: 'custom:sub_chem_separation_processes_a', id: sol, size: scene, caption: 'separating solids', 'on': filter}
    doodle_do:
      - {id: sol, op: pulse, part: paper, 'on': paper}
  - say: 'The solid left on the filter paper is called the residue. The clear liquid that passes through is called the filtrate.'
    write: 'residue: stays on the paper; filtrate: passes through'
    doodle_do:
      - {id: sol, op: circle, part: residue, 'on': residue}
      - {id: sol, op: circle, part: filtrate, 'on': filtrate}
  - say: 'Let us solve this. Which method separates sand from water? Step one, sand is a solid and water is a liquid.'
    write: 'Example: sand and water. sand = solid, water = liquid'
  - say: 'Step two, sand does not dissolve in water. An insoluble solid in a liquid is separated by filtration. Sand is the residue and water is the filtrate.'
    write: 'sand is insoluble ∴ filtration; residue = sand, filtrate = water'
    doodle_do:
      - {id: sol, op: pulse, part: residue, 'on': residue}
      - {id: sol, op: pulse, part: filtrate, 'on': filtrate}
    point:
      - {line: 9, kind: underline, at: 'filtration'}

  # ---------------------------------------------------------------- decantation
  - section: 'Decantation'
    say: 'Decantation separates a heavy insoluble solid from a liquid. The mixture is left to stand until the solid settles at the bottom. Then the liquid is gently poured off.'
    write: 'Decantation: let a heavy solid settle, then pour off the liquid'
  - say: 'Let us solve this. Muddy water is left to stand, and the mud settles. The clear water is poured off, so that is decantation. It is quick but rough, so filtration often follows.'
    write: 'Example: muddy water. mud settles, water poured off = decantation'

  # ---------------------------------------------------------------- evaporation
  - section: 'Evaporation'
    say: 'Evaporation recovers a soluble solid from its solution. The solution is heated in an evaporating dish. The liquid boils off as vapour, and the solid is left behind.'
    write: 'Evaporation: a soluble solid from its solution; the liquid is lost'
    doodle_do:
      - {id: sol, op: stage, stage: 'custom:sub_chem_separation_processes_a2', 'on': evaporating}
      - {id: sol, op: pulse, part: flame, 'on': heated}
      - {id: sol, op: pulse, part: vapour, 'on': vapour}
  - say: 'Let us solve this. How is common salt got from sea water? Salt is a solid that dissolves in water. So filtration cannot work, because the dissolved salt passes through the filter paper.'
    write: 'Example: salt from sea water. salt is soluble, so not filtration'
  - say: 'So we evaporate the sea water to dryness. The water leaves as steam, and the salt is left in the dish.'
    write: 'evaporate to dryness: water leaves, salt is left ✓'
    doodle_do:
      - {id: sol, op: pulse, part: vapour, 'on': steam}
      - {id: sol, op: circle, part: solution, 'on': salt}

  # ---------------------------------------------------------------- crystallisation
  - section: 'Crystallisation'
    say: 'Crystallisation gets a pure solid as crystals from its solution. The solution is heated only until it is saturated. Then it is left to cool, and crystals form.'
    write: 'Crystallisation: heat to saturation, then cool; crystals form'
    doodle_do:
      - {id: sol, op: pulse, part: dish, 'on': heated}
  - say: 'A saturated solution holds all the solute it can dissolve at that temperature. Most solids dissolve less in cold water, so as it cools the extra solid comes out as crystals.'
    write: 'saturated: holds all the solute it can at that temperature'
  - say: 'Why not evaporate to dryness? Strong heat spoils some solids. Sugar chars, and blue crystals of copper(II) tetraoxosulphate(VI) lose their water of crystallisation and turn into a white powder.'
    write: 'used when strong heat would spoil the solid, e.g. sugar, copper(II) tetraoxosulphate(VI) (copper sulphate)'
  - say: 'Let us solve this. Which method gives blue crystals of CuSO₄·5H₂O from its solution? Heating to dryness would leave white powder. So we use crystallisation.'
    write: 'Example: blue $\ce{CuSO4.5H2O}$ crystals ∴ crystallisation, not evaporation to dryness'
    point:
      - {line: 18, kind: underline, at: 'crystallisation'}

  # ---------------------------------------------------------------- fractional crystallisation
  - section: 'Fractional crystallisation'
    say: 'Fractional crystallisation separates two soluble solids with different solubilities. As the hot solution cools, the solid whose solubility drops sharply crystallises out first. The other stays in solution.'
    write: 'Fractional crystallisation: two soluble solids, different solubilities'
  - say: 'Let us solve this. Separate potassium trioxonitrate(V), KNO₃, from sodium chloride, NaCl. Both are white solids, and both dissolve in water, so filtration fails.'
    write: 'Example: $\ce{KNO3}$ and NaCl. both soluble, so not filtration'
  - say: 'KNO₃ is far less soluble in cold water than in hot water. NaCl dissolves about the same amount hot or cold. So on cooling a hot solution, KNO₃ crystallises out and NaCl stays dissolved.'
    write: 'on cooling, $\ce{KNO3}$ crystallises, NaCl stays ∴ fractional crystallisation'

  # ---------------------------------------------------------------- sublimation
  - section: 'Sublimation'
    say: 'Sublimation is when a solid turns straight into a gas on heating, without melting. The gas turns back into a solid on a cool surface. It separates a solid that sublimes from one that does not.'
    write: 'Sublimation: solid → gas directly; back to solid on a cool surface'
    doodle_do:
      - {id: sol, op: stage, stage: 'custom:sub_chem_separation_processes_a3', 'on': Sublimation}
  - say: 'Solids that sublime include ammonium chloride, NH₄Cl, iodine, naphthalene, camphor, dry ice, which is solid CO₂, and anhydrous iron(III) chloride and aluminium chloride.'
    write: 'sublime: $\ce{NH4Cl}$, $\ce{I2}$, naphthalene, camphor, dry ice, anhydrous $\ce{FeCl3}$, $\ce{AlCl3}$'
  - say: 'Let us solve this. Separate ammonium chloride from sodium chloride. Both are white solids that dissolve in water. But NH₄Cl sublimes and NaCl does not.'
    write: 'Example: $\ce{NH4Cl}$ and NaCl. only $\ce{NH4Cl}$ sublimes'
    doodle_do:
      - {id: sol, op: pulse, part: mixture, 'on': Separate}
  - say: 'So we heat the mixture under an inverted funnel. NH₄Cl rises as a gas and collects on the cool funnel as a white solid. NaCl stays in the dish. Strictly, NH₄Cl splits into NH₃ and HCl gases, which join again on the cool funnel, but JAMB still calls this sublimation.'
    write: '$\ce{NH4Cl}$ collects on the funnel; NaCl stays ∴ sublimation ✓'
    doodle_do:
      - {id: sol, op: pulse, part: cool-funnel, 'on': funnel}
      - {id: sol, op: circle, part: sublimate, 'on': collects}
      - {id: sol, op: pulse, part: mixture, 'on': stays}

  # ---------------------------------------------------------------- magnetic separation
  - section: 'Magnetic separation'
    say: 'Magnetic separation removes a magnetic solid from a mixture. Iron, cobalt and nickel are pulled by a magnet. Most other substances are not.'
    write: 'Magnetic separation: a magnetic solid (Fe, Co, Ni) from a non-magnetic one'
  - say: 'Let us solve this. Separate iron filings from sand. Both are insoluble solids, so filtration cannot part them. But iron is magnetic and sand is not. Pass a magnet over the mixture, and the iron filings stick to it.'
    write: 'Example: iron filings and sand ∴ magnet; iron sticks, sand stays'
  - say: 'Careful. As we saw in elements, compounds and mixtures, iron heated with sulphur forms iron(II) sulphide, FeS, which is a compound. A magnet can no longer pull out the iron.'
    write: 'heated together → FeS, a compound: a magnet cannot separate it'
    point:
      - {line: 28, kind: circle, at: 'a compound'}

  # ---------------------------------------------------------------- comparison
  - section: 'Comparison'
    say: 'Now put the methods side by side. An insoluble solid in a liquid needs filtration or decantation. A soluble solid needs evaporation or crystallisation.'
    write: 'insoluble solid + liquid → filtration, decantation; soluble solid → evaporation, crystallisation'
    doodle_do:
      - {id: sol, op: pulse, part: filtration-tag, 'on': filtration}
      - {id: sol, op: pulse, part: evaporation-tag, 'on': evaporation}
  - say: 'Two soluble solids with different solubilities need fractional crystallisation. A solid that sublimes needs sublimation. A magnetic solid needs a magnet.'
    write: 'different solubilities → fractional crystallisation; sublimes → sublimation; magnetic → magnet'
    doodle_do:
      - {id: sol, op: pulse, part: sublimation-tag, 'on': sublimation}

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Students often mix up the residue and the filtrate. The residue stays on the paper. The filtrate is the liquid that passes through.'
    write: 'residue stays on the paper; filtrate passes through'
    doodle_do:
      - {id: sol, op: circle, part: residue, 'on': residue}
  - say: 'The other trap is filtering a dissolved solid. Salt dissolved in water passes straight through the filter paper, so a soluble solid is got by evaporation or crystallisation, never by filtration.'
    write: 'a dissolved solid passes through the paper: filtration ✗; evaporate or crystallise ✓'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Your turn. Which method separates a mixture of iodine and sand? Pause and decide before I go on.'
    write: 'Which method separates iodine and sand?'
  - say: 'Both are solids, and neither dissolves well in water. But iodine sublimes and sand does not. Heat the mixture, and iodine collects as crystals on the cool funnel. So the answer is sublimation.'
    write: 'iodine sublimes, sand does not ∴ sublimation ✓'
    doodle_do:
      - {id: sol, op: circle, part: sublimate, 'on': collects}
    point:
      - {line: 34, kind: circle, at: 'sublimation'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. Each method uses one difference. For solids, use filtration, decantation, evaporation, crystallisation, fractional crystallisation, sublimation or a magnet.'
    write: '1. solids: filtration, decantation, evaporation, crystallisation, sublimation, magnet'
  - say: 'To choose, ask whether the parts are solids or liquids, and how they differ. That''s the lesson. Next, separating liquids.'
    write: '2. ask: solid or liquid? how do they differ?'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'A mixture contains ammonium chloride, common salt and sand. Give, in order, the steps to separate all three.'
    answer: 'sublimation, then dissolve in water and filter, then evaporate the filtrate'
    accept: ['heat to sublime the ammonium chloride; add water and filter off the sand; evaporate the filtrate to get the salt', 'sublimation, filtration, evaporation', 'sublime, dissolve and filter, evaporate']
    working:
      - 'Heat the mixture under a cool funnel: only $\ce{NH4Cl}$ sublimes and collects on the funnel.'
      - 'Add water to what is left: the salt dissolves, the sand does not. Filter: sand is the residue, salt solution the filtrate.'
      - 'Evaporate the filtrate to dryness (or crystallise it): the salt is left. Order: sublimation, filtration, evaporation.'
    needs_working: false
