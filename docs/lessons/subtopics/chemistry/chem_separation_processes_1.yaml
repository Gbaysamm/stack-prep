# Filtration and decantation (lesson 1 of 7): the big picture of separating a mixture, the two questions for choosing a method, soluble and insoluble taught first, then filtration and decantation, each with a guided example.
format_version: 1
subject: chemistry
subtopic: 'Separation processes'
subtopic_id: c6a7158d-ee05-5392-bb4b-a39693edd7ac
part: 1
title: 'Filtration and decantation'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://syllabus.ng/waec/chemistry/
  - https://edupadi.com/classroom/l/separation-techniques
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is separating mixtures, starting with filtration and decantation.'
    write: 'Separating mixtures: filtration and decantation'

  # ---------------------------------------------------------------- introduction: the big picture
  - section: 'Introduction'
    say: 'In the lesson on mixtures, you learnt that the parts of a mixture are not chemically joined. So a mixture can be separated by physical means, without any chemical change.'
    write: 'A mixture is separated by physical means'
  - say: 'Each method of separation uses one property in which the parts differ. For example, iron filings are pulled by a magnet, but sand is not.'
    write: 'Each method uses one difference between the parts'
  - say: 'Almost every year, JAMB asks which method separates a given mixture. It is also the first topic in the JAMB chemistry syllabus.'
    write: 'JAMB asks which method separates a mixture'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn how to choose a method, and how filtration and decantation separate a solid from a liquid.'
    write: 'Today: choosing a method; filtration and decantation'

  # ---------------------------------------------------------------- choosing a method
  - section: 'Choosing a method'
    say: 'To choose a method, we ask two questions about the mixture. The first question is whether each part is a solid or a liquid.'
    write: '1. Is each part a solid or a liquid?'
  - say: 'The second question is how the parts differ. They may differ in how well they dissolve, in boiling point, in density, in magnetism or in how fast they move.'
    write: '2. How do the parts differ?'
  # Soluble and insoluble taught before filtration uses them (no gaps).
  - say: 'How well a substance dissolves is called its solubility. For example, salt dissolves in water, so we say that salt is soluble in water.'
    write: 'Soluble: dissolves, e.g. salt in water'
  - say: 'Sand does not dissolve in water, so we say that sand is insoluble in water. Today''s two methods both separate an insoluble solid from a liquid.'
    write: 'Insoluble: does not dissolve, e.g. sand in water'

  # ---------------------------------------------------------------- filtration
  - section: 'Filtration'
    say: 'Let us start with filtration. Filtration separates an insoluble solid from a liquid. The mixture is poured into a funnel lined with filter paper.'
    write: 'Filtration: an insoluble solid from a liquid'
    doodle: {name: 'custom:sub_chem_separation_processes_a', id: sol, size: scene, caption: 'filtration', 'on': funnel}
    doodle_do:
      - {id: sol, op: pulse, part: paper, 'on': filter paper}
  - say: 'The filter paper has tiny holes. The liquid passes through the holes, but the solid particles are too big to pass.'
    write: 'The liquid passes through; the solid is held back'
    doodle_do:
      - {id: sol, op: pulse, part: paper, 'on': holes}
  - say: 'The solid left on the filter paper is called the residue.'
    write: 'Residue: the solid left on the paper'
    doodle_do:
      - {id: sol, op: circle, part: residue, 'on': residue}
  - say: 'The clear liquid that passes through is called the filtrate.'
    write: 'Filtrate: the liquid that passes through'
    doodle_do:
      - {id: sol, op: circle, part: filtrate, 'on': filtrate}

  # worked example: sand and water
  - section: 'Worked example'
    say: 'Now let us use this. We are given a mixture of sand and water, and we must find the method that separates it. First, we ask what each part is. Sand is a solid, and water is a liquid.'
    write: 'Sand and water: which method? Sand is a solid, water a liquid'
  - say: 'Next, we ask how they differ. Sand is insoluble in water, so it cannot pass through filter paper. An insoluble solid in a liquid is separated by filtration.'
    write: 'Sand is insoluble, so filtration ✓'
    point:
      - {line: 14, kind: underline, at: 'filtration'}
  - say: 'What does this tell us? The sand stays on the paper as the residue, and the water runs through as the filtrate.'
    write: 'Residue = sand; filtrate = water'
    doodle_do:
      - {id: sol, op: pulse, part: residue, 'on': residue}
      - {id: sol, op: pulse, part: filtrate, 'on': filtrate}

  # ---------------------------------------------------------------- decantation
  - section: 'Decantation'
    say: 'We have seen filtration. Now let us look at decantation. Decantation also separates an insoluble solid from a liquid, when the solid is heavy and settles quickly.'
    write: 'Decantation: a heavy insoluble solid from a liquid'
  - say: 'The mixture is left to stand until the solid settles at the bottom. Then the liquid on top is gently poured off into another container.'
    write: 'Let the solid settle, then pour off the liquid'
  - say: 'Here is an example. Muddy water is left to stand in a bucket, and the mud settles at the bottom. Then the clear water is gently poured off. That is decantation.'
    write: 'Muddy water: mud settles, water poured off = decantation'
  - say: 'Decantation is quick, but some fine solid is usually poured off with the liquid. So filtration often follows it, to remove the last of the solid.'
    write: 'Quick but rough, so filtration often follows'

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Students often mix up the residue and the filtrate. The residue is the solid that stays on the paper. The filtrate is the liquid that passes through.'
    write: 'Trap: the residue stays on the paper; the filtrate passes through'
    doodle_do:
      - {id: sol, op: circle, part: residue, 'on': residue}
      - {id: sol, op: circle, part: filtrate, 'on': filtrate}
  - say: 'A second trap is filtering a dissolved solid. Salt dissolved in water passes straight through the filter paper with the water, so filtration cannot separate salt from water.'
    write: 'Trap: a dissolved solid passes through, so salt water cannot be filtered ✗'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Which method separates chalk powder from water? Pause the lesson and decide before I go on.'
    write: 'Which method separates chalk powder and water?'
  - say: 'Chalk is a solid and water is a liquid. Chalk does not dissolve in water, so it is an insoluble solid in a liquid. So we use filtration, and the chalk is the residue.'
    write: 'Chalk is insoluble, so filtration; chalk is the residue ✓'
    doodle_do:
      - {id: sol, op: pulse, part: residue, 'on': residue}
    point:
      - {line: 23, kind: circle, at: 'filtration'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. To choose a method, ask whether each part is a solid or a liquid, and how the parts differ.'
    write: '1. Ask: solid or liquid? How do the parts differ?'
  - say: 'Filtration and decantation separate an insoluble solid from a liquid. In the next lesson, we recover a soluble solid. Now try the problem.'
    write: '2. Insoluble solid from a liquid: filtration or decantation'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'A mixture of sand and water is filtered. Which is the filtrate? A. sand  B. water  C. the filter paper  D. sand and water'
    answer: 'B'
    accept: ['water', 'B. water']
    working:
      - 'Sand is insoluble in water, so it cannot pass through the filter paper: it stays behind as the residue.'
      - 'The water passes through the paper, so the water is the filtrate. Answer: B.'
    needs_working: false
