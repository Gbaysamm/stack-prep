# Filtration and decantation (lesson 1 of 7): the big picture of separating a mixture, the two questions for choosing a method, soluble and insoluble taught first, then filtration and decantation, each with a guided example.
format_version: 1
subject: chemistry
subtopic: 'Separation processes'
subtopic_id: c6a7158d-ee05-5392-bb4b-a39693edd7ac
part: 1
title: 'Filtration and decantation'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://syllabus.ng/waec/chemistry/
  - https://edupadi.com/classroom/l/separation-techniques
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is separating mixtures, starting with filtration and decantation.'
    write: 'Separating mixtures: filtration and decantation'

  # ---------------------------------------------------------------- introduction: the big picture
  - section: 'Introduction'
    say: 'In the lesson on mixtures, you learnt that the parts of a mixture are only mixed, not chemically joined. So we can separate them by physical means, without any chemical change.'
    write: 'A mixture is separated by physical means'
  - say: 'To separate the parts, we use a property in which they differ. For example, a magnet pulls iron filings but not sand, so a magnet can take the iron out of a mixture of the two.'
    write: 'Each method uses one difference between the parts'
  - say: 'Separation of mixtures is the first topic in the JAMB chemistry syllabus. Almost every year, JAMB gives a mixture and asks which method separates it.'
    write: 'JAMB asks which method separates a mixture'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn how to choose a method, and how filtration and decantation separate a solid from a liquid.'
    write: 'Today: choosing a method; filtration and decantation'

  # ---------------------------------------------------------------- choosing a method
  - section: 'Choosing a method'
    say: 'To choose a method, we ask two questions about the mixture. The first question is whether each part is a solid or a liquid.'
    write: '1. Is each part a solid or a liquid?'
  - say: 'The second question is how the parts differ. For example, they may differ in how well they dissolve, in boiling point, in density or in magnetism. Each difference has its own method, and these lessons teach them one at a time.'
    write: '2. How do the parts differ?'
  # Soluble and insoluble taught before filtration uses them (no gaps).
  - say: 'The difference we need today is how well a substance dissolves, which is called its solubility. A substance that dissolves is soluble. For example, salt dissolves in water, so salt is soluble in water.'
    write: 'Soluble: dissolves, e.g. salt in water'
  - say: 'A substance that does not dissolve is insoluble. For example, sand does not dissolve in water, so sand is insoluble in water. Today''s two methods both separate an insoluble solid from a liquid.'
    write: 'Insoluble: does not dissolve, e.g. sand in water'

  # ---------------------------------------------------------------- filtration
  - section: 'Filtration'
    say: 'Let us start with filtration. Filtration separates an insoluble solid from a liquid. The mixture is poured into a funnel lined with filter paper.'
    write: 'Filtration: an insoluble solid from a liquid'
    doodle: {name: 'custom:sub_chem_separation_processes_a', id: sol, size: scene, caption: 'filtration', 'on': funnel}
    doodle_do:
      - {id: sol, op: pulse, part: paper, 'on': filter paper}
  - say: 'Filter paper has very small holes. The liquid passes through the holes, but the grains of the solid are too big to pass, so they are held back.'
    write: 'The liquid passes through; the solid is held back'
    doodle_do:
      - {id: sol, op: pulse, part: paper, 'on': holes}
  - say: 'The solid left on the filter paper is called the residue.'
    write: 'Residue: the solid left on the paper'
    doodle_do:
      - {id: sol, op: circle, part: residue, 'on': residue}
  - say: 'The liquid that passes through and collects below is called the filtrate.'
    write: 'Filtrate: the liquid that passes through'
    doodle_do:
      - {id: sol, op: circle, part: filtrate, 'on': filtrate}

  # worked example: sand and water
  - section: 'Worked example'
    say: 'Now that we know how filtration works, let us use the two questions to choose a method. We are given a mixture of sand and water, and we must find the method that separates it.'
    write: 'Sand and water: which method?'
  - say: 'The first question is what each part is. Sand is a solid, and water is a liquid.'
    write: 'Sand is a solid; water is a liquid'
  - say: 'The second question is how they differ. Sand is insoluble in water, so its grains are held back by filter paper while the water passes through. An insoluble solid in a liquid is separated by filtration.'
    write: 'Sand is insoluble, so filtration ✓'
    point:
      - {line: 15, kind: underline, at: 'filtration'}
  - say: 'What does this tell us? The sand stays on the paper as the residue, and the water runs through as the filtrate.'
    write: 'Residue = sand; filtrate = water'
    doodle_do:
      - {id: sol, op: pulse, part: residue, 'on': residue}
      - {id: sol, op: pulse, part: filtrate, 'on': filtrate}

  # ---------------------------------------------------------------- decantation
  - section: 'Decantation'
    say: 'We have seen filtration. Now let us look at decantation. Decantation also separates an insoluble solid from a liquid. It is used when the solid is heavy, so that it sinks to the bottom quickly.'
    write: 'Decantation: a heavy insoluble solid from a liquid'
  - say: 'The mixture is left to stand until the solid settles at the bottom. Then the liquid on top is gently poured off into another container, and the solid stays behind.'
    write: 'Let the solid settle, then pour off the liquid'
  - say: 'For example, when muddy water stands in a bucket, the heavy mud settles at the bottom. Pouring the clear water off the top into another bucket is decantation.'
    write: 'Muddy water: mud settles, water poured off = decantation'
  - say: 'Decantation is quick, but some fine solid is usually poured off with the liquid. So the liquid is often filtered afterwards, to remove the last of the solid.'
    write: 'Quick but rough, so filtration often follows'

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Students often mix up the residue and the filtrate. To get them right, ask where each part ends up. Whatever stays on the filter paper is the residue, and whatever passes through it is the filtrate.'
    write: 'Trap: what stays on the paper is the residue; what passes through is the filtrate'
    doodle_do:
      - {id: sol, op: circle, part: residue, 'on': residue}
      - {id: sol, op: circle, part: filtrate, 'on': filtrate}
  - say: 'A second trap is trying to filter a dissolved solid. Filter paper holds back only solid that has not dissolved. Dissolved salt passes through the paper with the water, so filtration cannot separate salt from water.'
    write: 'Trap: a dissolved solid passes through, so salt water cannot be filtered ✗'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Which method separates chalk powder from water? Pause the lesson and decide before I go on.'
    write: 'Which method separates chalk powder and water?'
  - say: 'Chalk is a solid and water is a liquid. Chalk does not dissolve in water, so it is an insoluble solid in a liquid. So we use filtration, and the chalk is the residue.'
    write: 'Chalk is insoluble, so filtration; chalk is the residue ✓'
    doodle_do:
      - {id: sol, op: pulse, part: residue, 'on': residue}
    point:
      - {line: 24, kind: circle, at: 'filtration'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. To choose a method, ask whether each part is a solid or a liquid, and how the parts differ.'
    write: '1. Ask: solid or liquid? How do the parts differ?'
  - say: 'Filtration separates an insoluble solid from a liquid. The solid stays on the filter paper as the residue, and the liquid passes through as the filtrate.'
    write: '2. Filtration: residue on the paper, filtrate through it'
  - say: 'Decantation lets a heavy solid settle, and then the liquid is poured off. In the next lesson, we recover a solid that has dissolved. Now try the problem.'
    write: '3. Decantation: let the solid settle, pour off the liquid'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'A mixture of sand and water is filtered. Which is the filtrate? A. sand  B. water  C. the filter paper  D. sand and water'
    answer: 'B'
    accept: ['water', 'B. water']
    working:
      - 'Sand is insoluble in water, so it cannot pass through the filter paper: it stays behind as the residue.'
      - 'The water passes through the paper, so the water is the filtrate. Answer: B.'
    needs_working: false
