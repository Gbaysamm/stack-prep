# Sublimation and magnetic separation (lesson 3 of 7): sublimation and the solids that sublime, magnetic separation and its iron(II) sulphide trap, then a three-solid mixture separated step by step.
format_version: 1
subject: chemistry
subtopic: 'Separation processes'
subtopic_id: c6a7158d-ee05-5392-bb4b-a39693edd7ac
part: 3
title: 'Sublimation and magnetic separation'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://syllabus.ng/waec/chemistry/
  - https://edupadi.com/classroom/l/separation-techniques
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is sublimation and magnetic separation.'
    write: 'Sublimation and magnetic separation'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson, you recovered soluble solids from their solutions. Some mixtures are two solids that both dissolve, or both do not, so dissolving and filtering cannot separate them. Then we use another difference between them.'
    write: 'Two solids: use another difference'
    doodle: {name: 'custom:sub_chem_separation_processes_a2', id: sol, size: scene, caption: 'separating solids', 'on': solutions}

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn how sublimation and a magnet separate two solids, and how to separate a mixture of three solids.'
    write: 'Today: sublimation, a magnet, and a three-part mixture'

  # ---------------------------------------------------------------- sublimation
  - section: 'Sublimation'
    say: 'Let us start with sublimation. Sublimation is when a solid turns straight into a gas on heating, without first melting.'
    write: 'Sublimation: solid → gas directly, without melting'
    doodle_do:
      - {id: sol, op: stage, stage: 'custom:sub_chem_separation_processes_a3', 'on': sublimation, on_nth: 2}
  - say: 'When the gas meets a cool surface, it turns straight back into a solid. The solid that collects is called the sublimate.'
    write: 'On a cool surface, the gas turns back to a solid'
    doodle_do:
      - {id: sol, op: pulse, part: cool-funnel, 'on': cool surface}
      - {id: sol, op: circle, part: sublimate, 'on': sublimate}
  - say: 'So when a mixture is heated, only the solid that sublimes leaves as a gas, and the other solid stays behind. In this way, sublimation separates a solid that sublimes from a solid that does not.'
    write: 'It separates a solid that sublimes from one that does not'
  - say: 'Only a few solids sublime. For example, ammonium chloride, iodine, naphthalene and camphor all sublime.'
    write: 'These sublime: ammonium chloride ($\ce{NH4Cl}$), iodine ($\ce{I2}$), naphthalene, camphor'
  - say: 'A few more sublime. Dry ice, which is solid carbon(IV) oxide, sublimes. So do anhydrous iron(III) chloride and anhydrous aluminium chloride, where anhydrous means without water.'
    write: 'Also dry ice (solid $\ce{CO2}$), anhydrous iron(III) chloride and aluminium chloride'

  # worked example: ammonium chloride and common salt
  - section: 'Worked example'
    say: 'Now that we know which solids sublime, let us use this to separate a mixture. We are given ammonium chloride mixed with sodium chloride, and we must separate them.'
    write: 'Ammonium chloride ($\ce{NH4Cl}$) and sodium chloride (NaCl): separate them'
    doodle_do:
      - {id: sol, op: pulse, part: mixture, 'on': mixed}
  - say: 'We ask how they differ. Both are white solids that dissolve in water, so dissolving and filtering will not work. But ammonium chloride sublimes, and sodium chloride does not. So we use sublimation.'
    write: 'Only $\ce{NH4Cl}$ sublimes ∴ sublimation'
  - say: 'We heat the mixture in a dish under an upturned funnel. The ammonium chloride rises as a gas and collects on the cool funnel as a white solid. The sodium chloride stays in the dish.'
    write: '$\ce{NH4Cl}$ collects on the funnel; NaCl stays in the dish ✓'
    doodle_do:
      - {id: sol, op: pulse, part: cool-funnel, 'on': upturned funnel}
      - {id: sol, op: circle, part: sublimate, 'on': collects}
      - {id: sol, op: pulse, part: mixture, 'on': stays}
  - say: 'Strictly, ammonium chloride splits into two gases, ammonia and hydrogen chloride, which join again on the cool funnel. JAMB still calls this sublimation.'
    write: 'Strictly it splits and joins again, but JAMB calls it sublimation'

  # ---------------------------------------------------------------- magnetic separation
  - section: 'Magnetic separation'
    say: 'We have seen sublimation. Now let us look at magnetic separation. It removes a magnetic solid from a solid that is not magnetic.'
    write: 'Magnetic separation: a magnetic solid from a non-magnetic one'
  - say: 'A substance that a magnet pulls is called magnetic. Iron, cobalt and nickel are magnetic, but most other substances are not.'
    write: 'Magnetic: iron, cobalt and nickel'
  - say: 'Here is an example. We are given iron filings mixed with sand, and we must separate them. Both are insoluble solids, so filtration cannot separate them. But iron is magnetic and sand is not.'
    write: 'Iron filings and sand: both insoluble, but only iron is magnetic'
  - say: 'So we pass a magnet over the mixture. The iron filings stick to the magnet, and the sand is left behind. That is magnetic separation.'
    write: '∴ a magnet: iron sticks, sand stays ✓'
  - say: 'Be careful here. A magnet pulls out iron only while the iron is free in a mixture. In the lesson on compounds, you saw iron heated with sulphur to form iron(II) sulphide, FeS. Once the iron is joined in a compound, a magnet can no longer pull it out.'
    write: 'Trap: iron(II) sulphide (FeS) is a compound; a magnet cannot separate it ✗'
    point:
      - {line: 16, kind: circle, at: 'a compound'}

  # ---------------------------------------------------------------- three solids
  - section: 'Three solids'
    say: 'Some mixtures need several methods, one after another. We are given ammonium chloride, common salt and sand, and we must get each one out. We take away one part at a time, using one difference at each step.'
    write: 'Ammonium chloride, salt and sand: one part at a time'
  - say: 'First, we heat the mixture under a cool funnel. Only the ammonium chloride sublimes, and it collects on the funnel.'
    write: '1. Heat: $\ce{NH4Cl}$ sublimes onto the funnel'
    doodle_do:
      - {id: sol, op: circle, part: sublimate, 'on': collects}
  - say: 'Next, we add water to the salt and sand that are left. The salt dissolves, but the sand does not. We filter, so the sand is the residue and the salt solution is the filtrate.'
    write: '2. Add water and filter: the sand is the residue'
    doodle_do:
      - {id: sol, op: pulse, part: residue, 'on': residue}
  - say: 'Last, we evaporate the filtrate to dryness, and the salt is left.'
    write: '3. Evaporate the filtrate: the salt is left'
    doodle_do:
      - {id: sol, op: pulse, part: evaporation-tag, 'on': evaporate}
  - say: 'So the order is sublimation, then filtration, then evaporation. Each step takes out one part.'
    write: 'Order: sublimation, filtration, evaporation'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Which method separates a mixture of iodine and sand? Pause the lesson and decide before I go on.'
    write: 'Which method separates iodine and sand?'
  - say: 'Both are solids, and neither dissolves well in water. But iodine sublimes and sand does not. When the mixture is heated, the iodine collects on the cool funnel. So the answer is sublimation.'
    write: 'Iodine sublimes, sand does not ∴ sublimation ✓'
    doodle_do:
      - {id: sol, op: circle, part: sublimate, 'on': collects}
    point:
      - {line: 23, kind: circle, at: 'sublimation'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. Sublimation separates a solid that sublimes, such as ammonium chloride or iodine, from one that does not. On heating, it turns to a gas, and it turns back to a solid on a cool surface.'
    write: '1. Sublimation: solid → gas → solid on a cool surface'
  - say: 'A magnet pulls iron, cobalt or nickel out of a solid that is not magnetic, but not iron that is joined in a compound.'
    write: '2. Magnetic separation: iron, cobalt and nickel'
  - say: 'A mixture of three solids is separated one part at a time, each step using one difference. In the next lesson, we separate liquids. Now try the problem.'
    write: '3. Three solids: one method for each part'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Which method separates iron filings from powdered chalk? A. sublimation  B. filtration  C. magnetic separation  D. evaporation'
    answer: 'C'
    accept: ['magnetic separation', 'a magnet', 'magnet', 'C. magnetic separation']
    working:
      - 'Iron filings and chalk are both insoluble solids, so filtration cannot separate them, and evaporation needs a solution.'
      - 'Neither sublimes, so sublimation will not work.'
      - 'Iron is magnetic and chalk is not, so a magnet pulls out the iron: magnetic separation. Answer: C.'
    needs_working: false
