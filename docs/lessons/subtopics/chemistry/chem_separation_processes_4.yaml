# The separating funnel and simple distillation (lesson 4 of 7): immiscible and miscible taught first, the separating funnel with kerosene and water, then simple distillation and its apparatus with sea water, each guided.
format_version: 1
subject: chemistry
subtopic: 'Separation processes'
subtopic_id: c6a7158d-ee05-5392-bb4b-a39693edd7ac
part: 4
title: 'The separating funnel and simple distillation'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://syllabus.ng/waec/chemistry/
  - https://edupadi.com/classroom/l/separation-techniques
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is the separating funnel and simple distillation.'
    write: 'The separating funnel and simple distillation'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last three lessons, you separated solids. Now the mixture may be two liquids, or a solution whose liquid we want to keep. Each method still uses one difference between the parts.'
    write: 'Liquids: each method still uses one difference'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn how a separating funnel separates two liquids that do not mix, and how simple distillation keeps the liquid from a solution.'
    write: 'Today: the separating funnel and simple distillation'

  # ---------------------------------------------------------------- two words
  - section: 'Immiscible and miscible'
    say: 'First, two new words. Liquids that do not mix are called immiscible. For example, kerosene and water are immiscible.'
    write: 'Immiscible: liquids that do not mix, e.g. kerosene and water'
  - say: 'Liquids that mix completely are called miscible. For example, ethanol and water are miscible.'
    write: 'Miscible: liquids that mix completely, e.g. ethanol and water'

  # ---------------------------------------------------------------- separating funnel
  - section: 'Separating funnel'
    say: 'A separating funnel separates two immiscible liquids. In the funnel, they form two layers, and the denser liquid sinks to the bottom.'
    write: 'Separating funnel: two immiscible liquids, in layers'
    doodle: {name: 'custom:sub_chem_separation_processes_c', id: liq, size: scene, caption: 'separating funnel', 'on': separating funnel}
    doodle_do:
      - {id: liq, op: pulse, part: water, 'on': bottom}
  - say: 'To separate them, open the tap and run the bottom layer into a beaker. Close the tap just as the boundary between the layers reaches it.'
    write: 'Run off the bottom layer through the tap'
    doodle_do:
      - {id: liq, op: circle, part: tap, 'on': tap}
  - say: 'Then the top layer is poured out of the funnel into a second beaker.'
    write: 'Pour the top layer into another beaker'
    doodle_do:
      - {id: liq, op: pulse, part: kerosene, 'on': top layer}
  - say: 'Now let us use this. We are given kerosene and water, and we must separate them. They do not mix, so they are immiscible, and we use a separating funnel.'
    write: 'Kerosene and water: immiscible ∴ separating funnel'
  - say: 'Which comes out first? Kerosene is less dense than water, so it floats on top. The water is the bottom layer, so the water runs out of the tap first.'
    write: 'Kerosene floats; water (denser) runs out first'
    doodle_do:
      - {id: liq, op: pulse, part: kerosene, 'on': floats}
      - {id: liq, op: pulse, part: water, 'on': bottom layer}

  # ---------------------------------------------------------------- simple distillation
  - section: 'Simple distillation'
    say: 'We have seen the separating funnel. Now let us look at simple distillation. It separates a liquid from a solution, and it keeps the liquid.'
    write: 'Simple distillation: a liquid from a solution; the liquid is kept'
  - say: 'The solution is boiled in a flask. Its vapour passes into a condenser, which is a tube cooled by cold water.'
    write: 'Boil the solution; the vapour passes into a condenser'
    doodle: {name: 'custom:sub_chem_separation_processes_b', id: dis, size: scene, caption: 'distillation', 'on': flask}
    doodle_do:
      - {id: dis, op: pulse, part: condenser, 'on': condenser}
  - say: 'In the condenser, the vapour cools and turns back into a liquid. The pure liquid that collects is called the distillate.'
    write: 'The vapour condenses; the pure liquid is the distillate'
    doodle_do:
      - {id: dis, op: circle, part: distillate, 'on': distillate}
  - say: 'Look at the apparatus. The thermometer bulb is level with the side arm, so it reads the temperature of the vapour that is leaving.'
    write: 'Thermometer bulb level with the side arm'
    doodle_do:
      - {id: dis, op: circle, part: thermometer, 'on': thermometer}
  - say: 'Cold water enters the condenser at the bottom and leaves at the top. This keeps the condenser full of cold water.'
    write: 'Cold water in at the bottom, out at the top'
    doodle_do:
      - {id: dis, op: pulse, part: water-in, 'on': enters}
      - {id: dis, op: pulse, part: water-out, 'on': leaves}
  - say: 'Here is an example. We are given sea water, and we must get pure water from it. We want to keep the water, so evaporation will not do, because evaporation loses the water.'
    write: 'Pure water from sea water: keep the water, so not evaporation'
  - say: 'So we distil the sea water. The steam condenses to pure water in the receiver, and the salt stays behind in the flask.'
    write: '∴ simple distillation: pure water collects, salt stays ✓'
    doodle_do:
      - {id: dis, op: circle, part: distillate, 'on': condenses}
      - {id: dis, op: pulse, part: mixture, 'on': flask}
    point:
      - {line: 16, kind: underline, at: 'simple distillation'}

  # ---------------------------------------------------------------- trap
  - section: 'JAMB trap'
    say: 'Here is a common trap. Students often mix up evaporation and distillation. Evaporation loses the liquid and keeps the solid, but distillation keeps the liquid.'
    write: 'Trap: evaporation loses the liquid; distillation keeps it'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Which method separates groundnut oil from water, and which liquid leaves the tap first? Pause the lesson and decide before I go on.'
    write: 'Groundnut oil and water: which method? Which comes out first?'
  - say: 'Oil and water do not mix, so they are immiscible, and we use a separating funnel. Water is denser than the oil, so water is the bottom layer and runs out of the tap first.'
    write: 'Immiscible ∴ separating funnel; water (denser) out first ✓'
    doodle_do:
      - {id: liq, op: circle, part: tap, 'on': tap}
    point:
      - {line: 19, kind: circle, at: 'separating funnel'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. A separating funnel separates immiscible liquids, and the denser liquid runs out of the tap first.'
    write: '1. Immiscible liquids: separating funnel, denser layer out first'
  - say: 'Simple distillation keeps the liquid from a solution, as the distillate. In the next lesson, we separate miscible liquids. Now try the problem.'
    write: '2. Simple distillation: the liquid is kept as the distillate'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Which method gives pure water from copper(II) tetraoxosulphate(VI) solution? A. evaporation  B. filtration  C. simple distillation  D. crystallisation'
    answer: 'C'
    accept: ['simple distillation', 'distillation', 'C. simple distillation']
    working:
      - 'We want to keep the water, the liquid.'
      - 'Evaporation and crystallisation keep the solid and lose the water; filtration cannot hold back a dissolved solid.'
      - 'Simple distillation boils off the water and condenses it as pure distillate; the salt stays in the flask. Answer: C.'
    needs_working: false
