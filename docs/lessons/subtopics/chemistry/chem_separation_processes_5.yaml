# Fractional distillation (lesson 5 of 7): why simple distillation fails for close boiling points, the fractionating column, methanol and ethanol worked step by step, its uses, and the palm-wine ethanol JAMB question.
format_version: 1
subject: chemistry
subtopic: 'Separation processes'
subtopic_id: c6a7158d-ee05-5392-bb4b-a39693edd7ac
part: 5
title: 'Fractional distillation'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://syllabus.ng/waec/chemistry/
  - https://edupadi.com/classroom/l/separation-techniques
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is fractional distillation.'
    write: 'Fractional distillation'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson, simple distillation boiled off the liquid from a solution. But when two miscible liquids boil at temperatures close together, both turn to vapour together and collect together in the receiver. So simple distillation cannot separate them.'
    write: 'Miscible liquids with close boiling points'
    doodle: {name: 'custom:sub_chem_separation_processes_b', id: dis, size: scene, caption: 'distillation', 'on': simple distillation}

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn how fractional distillation separates such liquids, and where it is used.'
    write: 'Today: fractional distillation and its uses'

  # ---------------------------------------------------------------- the method
  - section: 'Fractional distillation'
    say: 'Fractional distillation is the method that separates miscible liquids whose boiling points are close together.'
    write: 'Fractional distillation: miscible liquids, close boiling points'
  - say: 'It uses the same apparatus as simple distillation, with one more part. A fractionating column is fitted between the flask and the condenser.'
    write: 'A fractionating column between the flask and the condenser'
    doodle_do:
      - {id: dis, op: stage, stage: 'custom:sub_chem_separation_processes_b2', 'on': fractionating column}
  - say: 'The column is packed with glass beads. As the vapour rises, it cools on the beads and condenses, and then the hot vapour coming up behind it boils it again. This happens many times on the way up.'
    write: 'On the glass beads, the vapour condenses and boils again many times'
    doodle_do:
      - {id: dis, op: circle, part: column, 'on': glass beads}
  - say: 'Each time it boils again, more of the liquid with the lower boiling point goes up as vapour, and more of the other liquid runs back down. So the liquid with the lower boiling point reaches the top first, and it distils over first.'
    write: 'The lower boiling point distils over first'
  - say: 'The thermometer tells us which liquid is coming over. Its reading stays steady at one liquid''s boiling point while that liquid distils.'
    write: 'The thermometer shows which liquid is coming over'
    doodle_do:
      - {id: dis, op: pulse, part: thermometer, 'on': thermometer}

  # worked example: methanol and ethanol
  - section: 'Worked example'
    say: 'Now that we know how the column works, let us use it. We are given methanol, which boils at about 65 °C, and ethanol, which boils at 78 °C, and we must separate them.'
    write: 'Methanol (65 °C) and ethanol (78 °C): separate them'
  - say: 'We ask what they are and how they differ. They are both liquids, and they mix completely, so they are miscible. Their boiling points are only about 13 °C apart, which is close, so we use fractional distillation.'
    write: 'Miscible, close boiling points ∴ fractional distillation'
    point:
      - {line: 9, kind: underline, at: 'fractional distillation'}
  - say: 'Which comes over first? Methanol has the lower boiling point, so it distils over first. The thermometer stays near 65 °C while it comes over.'
    write: 'Methanol first, at about 65 °C'
    doodle_do:
      - {id: dis, op: pulse, part: thermometer, 'on': thermometer}
  - say: 'When the reading starts to rise towards 78 °C, ethanol is coming over. So we change the receiver, to collect the ethanol separately.'
    write: 'Reading rises to 78 °C: change the receiver for ethanol'
    doodle_do:
      - {id: dis, op: pulse, part: distillate, 'on': receiver}

  # ---------------------------------------------------------------- uses
  - section: 'Uses'
    say: 'Fractional distillation has two big uses. They are refining crude oil and separating liquid air.'
    write: 'Uses: crude oil and liquid air'
  - say: 'For example, in the refineries at Port Harcourt, Warri and Kaduna, crude oil is separated into parts called fractions, such as petrol, kerosene and diesel.'
    write: 'Crude oil → petrol, kerosene, diesel'
  - say: 'Air is cooled until it turns to a liquid, and then it is separated in the same way. Nitrogen boils off before oxygen, because its boiling point is lower.'
    write: 'Liquid air → nitrogen ($\ce{N2}$) first, then oxygen ($\ce{O2}$)'

  # ---------------------------------------------------------------- JAMB question
  - section: 'JAMB trap'
    say: 'Here is a real JAMB question. It asks how to get high-quality ethanol from palm wine. Palm wine is mostly water, with some ethanol in it.'
    write: 'JAMB: high-quality ethanol from palm wine?'
  - say: 'Fractional distillation is the first step, and it gives ethanol of about 95.6 percent. It cannot go any higher, because at that point ethanol and water boil off together as one mixture.'
    write: 'Fractional distillation stops at about 95.6% ethanol'
  - say: 'To remove the last water, we add a dehydrant, which is a substance that takes up water. Quicklime, CaO, takes up the last water, and the ethanol is distilled again.'
    write: 'Then a dehydrant, quicklime (CaO), removes the last water ✓'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Ethanol boils at 78 °C and water boils at 100 °C. When the two are fractionally distilled, which comes over first? Pause the lesson and decide before I go on.'
    write: 'Ethanol (78 °C) and water (100 °C): which comes over first?'
  - say: 'The liquid with the lower boiling point distils over first. 78 °C is lower than 100 °C, so ethanol comes over first.'
    write: '78 °C is lower ∴ ethanol first ✓'
    point:
      - {line: 19, kind: circle, at: 'ethanol first'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. Fractional distillation separates miscible liquids with close boiling points. A fractionating column is fitted between the flask and the condenser.'
    write: '1. Fractional distillation: miscible liquids, close boiling points, a column'
  - say: 'The liquid with the lower boiling point distils over first, and the thermometer shows which liquid is coming over.'
    write: '2. The lower boiling point comes over first'
  - say: 'It is used to refine crude oil and to separate liquid air. In the next lesson, we separate dyes. Now try the problem.'
    write: '3. Uses: crude oil and liquid air'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Two liquids mix completely. One boils at 60 °C and the other at 75 °C. Which method separates them? A. separating funnel  B. evaporation  C. fractional distillation  D. filtration'
    answer: 'C'
    accept: ['fractional distillation', 'C. fractional distillation']
    working:
      - 'The liquids mix completely, so they are miscible: a separating funnel cannot work.'
      - 'Both are liquids, so filtration cannot work, and evaporation loses the liquids.'
      - 'Their boiling points are close, so fractional distillation separates them; the 60 °C liquid comes over first. Answer: C.'
    needs_working: false
