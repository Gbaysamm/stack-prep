# Chromatography (lesson 6 of 7): what chromatography uses, paper chromatography set up a piece at a time (the paper, the solvent, the pencil line), why the spots separate, reading a chromatogram, column chromatography and its JAMB question.
format_version: 1
subject: chemistry
subtopic: 'Separation processes'
subtopic_id: c6a7158d-ee05-5392-bb4b-a39693edd7ac
part: 6
title: 'Chromatography'
sources:            # pages consulted for the approach, for reviewers
  - https://syllabus.ng/jamb/chemistry
  - https://syllabus.ng/waec/chemistry/
  - https://edupadi.com/classroom/l/separation-techniques
  - https://schoolings.org/chemistry-lesson-note-for-ss1-first-term-2/
  - https://waeconline.org.ng/e-learning/Chemistry/chemmain.html
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is chromatography.'
    write: 'Chromatography'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lessons, each method used a difference such as solubility or boiling point. Some mixtures, such as the dyes in ink, are tiny amounts of coloured substances mixed together. For these, we use chromatography.'
    write: 'The dyes in ink: chromatography'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn how paper chromatography separates the parts of a mixture, and why the parts move apart.'
    write: 'Today: how chromatography works'

  # ---------------------------------------------------------------- chromatography
  - section: 'Chromatography'
    say: 'Chromatography separates the parts of a mixture because they move at different speeds, carried along by a solvent.'
    write: 'Chromatography: the parts move at different speeds with a solvent'
    doodle: {name: 'custom:sub_chem_separation_processes_c', id: liq, size: scene, caption: 'chromatography', 'on': chromatography}
    doodle_do:
      - {id: liq, op: show, part: chroma-tag, 'on': chromatography}
  - say: 'It is used for coloured substances, such as the dyes in ink and the pigments in leaves.'
    write: 'Used for the dyes in ink and the pigments in leaves'

  # ---------------------------------------------------------------- paper chromatography
  - section: 'Paper chromatography'
    say: 'Let us see paper chromatography. A strip of filter paper hangs in a beaker, with a little solvent at the bottom. The solvent may be water or ethanol.'
    write: 'A strip of paper stands in a little solvent'
    doodle_do:
      - {id: liq, op: show, part: paper, 'on': paper}
      - {id: liq, op: show, part: solvent, 'on': solvent}
  - say: 'A pencil line is drawn near the bottom of the paper, and a spot of the mixture is put on it.'
    write: 'A spot of the mixture on a pencil line'
    doodle_do:
      - {id: liq, op: show, part: start-line, 'on': pencil line}
      - {id: liq, op: label, part: start-line, text: 'ink spot here', 'on': spot}
  - say: 'The line must sit above the solvent level. If the spot sat in the solvent, it would wash off into the beaker.'
    write: 'The spot sits above the solvent, not in it'
    doodle_do:
      - {id: liq, op: pulse, part: solvent, 'on': solvent level}
  - say: 'The line is drawn in pencil, not in ink, because pencil does not dissolve and run, but an ink line would.'
    write: 'Pencil, because it does not run'
    doodle_do:
      - {id: liq, op: circle, part: start-line, 'on': pencil}

  # ---------------------------------------------------------------- why the parts separate
  - section: 'Why the parts separate'
    say: 'Now the solvent soaks up the paper, and it carries the parts of the spot with it.'
    write: 'The solvent soaks up the paper, carrying the parts'
  - say: 'A part that dissolves well in the solvent and clings weakly to the paper moves far up.'
    write: 'Held weakly → moves far'
  - say: 'A part that clings strongly to the paper moves only a little. So the parts separate into spots at different heights.'
    write: 'Held strongly → moves little; the spots separate'
    doodle_do:
      - {id: liq, op: stage, stage: 'custom:sub_chem_separation_processes_c2', 'on': separate}
      - {id: liq, op: circle, part: spots, 'on': spots}
  - say: 'The highest point the solvent reaches is called the solvent front. The finished paper, with its spots, is called a chromatogram.'
    write: 'Solvent front: how far the solvent rose; the result is a chromatogram'
    doodle_do:
      - {id: liq, op: pulse, part: front, 'on': solvent front}
      - {id: liq, op: pulse, part: spots, 'on': chromatogram}

  # worked example: black ink
  - section: 'Worked example'
    say: 'Now let us use this. A black ink is spotted on the paper, and after the run there are three coloured spots. What does this tell us?'
    write: 'Black ink gives three spots. What does this tell us?'
  - say: 'Each spot is a different dye, so the black ink is a mixture of three dyes. A pure substance would give only one spot.'
    write: 'Three dyes, so a mixture; a pure substance gives one spot'
    doodle_do:
      - {id: liq, op: circle, part: spots, 'on': three dyes}

  # ---------------------------------------------------------------- column chromatography
  - section: 'Column chromatography'
    say: 'Column chromatography works the same way. The mixture runs down a glass column packed with a solid such as alumina, and its parts come out as separate bands.'
    write: 'Column chromatography: the same idea, in a packed column'

  # ---------------------------------------------------------------- trap
  - section: 'JAMB trap'
    say: 'Here is a real JAMB question. It asks for the principle of column chromatography. The answer is that the parts move at different speeds in the column.'
    write: 'JAMB: the principle of column chromatography? Different speeds ✓'
  - say: 'The wrong options say that the parts react with the solvent or with each other. They do not react. Chromatography is a physical method, like every method in this topic.'
    write: 'Reactions ✗: it is a physical method'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. A green leaf extract gives four spots on the paper. How many pigments does it contain, and is it pure? Pause the lesson and decide before I go on.'
    write: 'A leaf extract gives four spots: how many pigments? Pure?'
  - say: 'Each spot is a different pigment, so the extract has four pigments. It gives more than one spot, so it is a mixture, not a pure substance.'
    write: 'Four spots = four pigments, so a mixture ✓'
    point:
      - {line: 19, kind: circle, at: 'a mixture'}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. Chromatography separates the parts of a mixture because they move at different speeds with a solvent.'
    write: '1. Chromatography: different speeds with a solvent'
  - say: 'The spot sits on a pencil line above the solvent, and a pure substance gives one spot. In the next lesson, we put all the methods together. Now try the problem.'
    write: '2. Pencil line above the solvent; one spot = pure'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Which method separates the coloured dyes in a sample of ink? A. filtration  B. chromatography  C. evaporation  D. separating funnel'
    answer: 'B'
    accept: ['chromatography', 'paper chromatography', 'B. chromatography']
    working:
      - 'The dyes are all dissolved together, so filtration cannot separate them, and evaporation leaves them all mixed.'
      - 'They are not two layers of liquid, so a separating funnel cannot work.'
      - 'The dyes move at different speeds with a solvent, so chromatography separates them. Answer: B.'
    needs_working: false
