<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="A beaker of palm oil floating on water: the less dense palm oil on top, labelled with the densities of both liquids"><g data-part="water"><path d="M42 112L138 112L138 176L42 176Z" fill="#3b82f6" fill-opacity="0.45" stroke="none"/></g><g data-part="oil"><path d="M42 82L138 82L138 112L42 112Z" fill="#f97316" fill-opacity="0.5" stroke="none"/></g><g data-part="beaker"><path d="M34 36L42 44L42 176Q42 184 50 184L130 184Q138 184 138 176L138 44L146 36" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6"/><path d="M42 112L138 112" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" stroke-dasharray="5 4"/></g><text x="90" y="24" font-family="Caveat, cursive" font-size="16" font-weight="700" fill="#1d1b3a" text-anchor="middle">oil floats on water</text><g data-part="oil-tag"><rect x="186" y="56" width="110" height="24" rx="9" fill="#f97316" fill-opacity="0.45" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/><text x="241" y="73" font-family="Caveat, cursive" font-size="16" font-weight="700" fill="#1d1b3a" text-anchor="middle">palm oil</text><text x="241" y="96" font-family="Caveat, cursive" font-size="14" font-weight="700" fill="#1d1b3a" text-anchor="middle">about 0.9 g/cm³, on top</text></g><path d="M184 70L144 94M147.5 88.6L144 94L150.3 93.4" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/><g data-part="water-tag"><rect x="186" y="126" width="110" height="24" rx="9" fill="#3b82f6" fill-opacity="0.45" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/><text x="241" y="143" font-family="Caveat, cursive" font-size="16" font-weight="700" fill="#1d1b3a" text-anchor="middle">water</text><text x="241" y="166" font-family="Caveat, cursive" font-size="14" font-weight="700" fill="#1d1b3a" text-anchor="middle">1.0 g/cm³, denser, below</text></g><path d="M184 140L144 146M149.3 142.6L144 146L150 148.4" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/></svg>
