<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="The Celsius and kelvin scales side by side: water boils at 100 °C or 373 K, ice melts at 0 °C or 273 K, and absolute zero is −273 °C or 0 K"><g data-part="scales"><path d="M100 36L100 182M220 36L220 182" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8"/><text x="100" y="26" font-family="Caveat, cursive" font-size="16" font-weight="700" fill="#1d1b3a" text-anchor="middle">Celsius (°C)</text><text x="220" y="26" font-family="Caveat, cursive" font-size="16" font-weight="700" fill="#1d1b3a" text-anchor="middle">kelvin (K)</text></g><g data-part="c-boil" data-later="1"><path d="M92 54L108 54" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/><text x="86" y="59" font-family="Caveat, cursive" font-size="16" font-weight="700" fill="#1d1b3a" text-anchor="end">100 °C</text><text x="160" y="50" font-family="Caveat, cursive" font-size="14" font-weight="700" fill="#1d1b3a" text-anchor="middle">water boils</text><path d="M116 54L204 54" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" stroke-dasharray="3 5"/></g><g data-part="k-boil" data-later="1"><path d="M212 54L228 54" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/><text x="234" y="59" font-family="Caveat, cursive" font-size="16" font-weight="700" fill="#1d1b3a" text-anchor="start">373 K</text></g><g data-part="c-melt" data-later="1"><path d="M92 112L108 112" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/><text x="86" y="117" font-family="Caveat, cursive" font-size="16" font-weight="700" fill="#1d1b3a" text-anchor="end">0 °C</text><text x="160" y="108" font-family="Caveat, cursive" font-size="14" font-weight="700" fill="#1d1b3a" text-anchor="middle">ice melts</text><path d="M116 112L204 112" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" stroke-dasharray="3 5"/></g><g data-part="k-melt" data-later="1"><path d="M212 112L228 112" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/><text x="234" y="117" font-family="Caveat, cursive" font-size="16" font-weight="700" fill="#1d1b3a" text-anchor="start">273 K</text></g><g data-part="c-zero" data-later="1"><path d="M92 172L108 172" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/><text x="86" y="177" font-family="Caveat, cursive" font-size="16" font-weight="700" fill="#1d1b3a" text-anchor="end">−273 °C</text><text x="160" y="168" font-family="Caveat, cursive" font-size="14" font-weight="700" fill="#1d1b3a" text-anchor="middle">absolute zero</text><path d="M116 172L204 172" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" stroke-dasharray="3 5"/></g><g data-part="k-zero" data-later="1"><path d="M212 172L228 172" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/><text x="234" y="177" font-family="Caveat, cursive" font-size="16" font-weight="700" fill="#1d1b3a" text-anchor="start">0 K</text></g></svg>