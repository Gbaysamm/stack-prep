<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="The mole map: mass, moles and number of particles, joined by the molar mass and the Avogadro constant"><g data-part="moles"><path d="M118 80L202 80L202 120L118 120Z" fill="#7c3aed" fill-opacity="0.4" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6"/><text x="160" y="98" font-family="Caveat, cursive" font-size="16" font-weight="700" fill="#1d1b3a" text-anchor="middle">moles, n</text><text x="160" y="113" font-family="Caveat, cursive" font-size="12" font-weight="700" fill="#1d1b3a" text-anchor="middle">unit: mol</text></g><g data-part="mass"><path d="M6 80L86 80L86 120L6 120Z" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6"/><text x="46" y="98" font-family="Caveat, cursive" font-size="15" font-weight="700" fill="#1d1b3a" text-anchor="middle">mass, m</text><text x="46" y="113" font-family="Caveat, cursive" font-size="12" font-weight="700" fill="#1d1b3a" text-anchor="middle">in g</text></g><g data-part="mass-note"><text x="6" y="138" font-family="Caveat, cursive" font-size="12" font-weight="700" fill="#1d1b3a" text-anchor="start">M = molar mass</text><text x="6" y="151" font-family="Caveat, cursive" font-size="12" font-weight="700" fill="#1d1b3a" text-anchor="start">in g mol⁻¹</text></g><g data-part="to-moles"><path d="M89 90L115 90M109.7 87.1L115 90L109.7 92.9" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/><text x="102" y="84" font-family="Caveat, cursive" font-size="13" font-weight="700" fill="#1d1b3a" text-anchor="middle">÷ M</text></g><g data-part="to-mass"><path d="M115 110L89 110M94.3 107.1L89 110L94.3 112.9" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/><text x="102" y="126" font-family="Caveat, cursive" font-size="13" font-weight="700" fill="#1d1b3a" text-anchor="middle">× M</text></g><g data-part="particles"><path d="M234 80L314 80L314 120L234 120Z" fill="#ec4899" fill-opacity="0.4" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6"/><text x="274" y="98" font-family="Caveat, cursive" font-size="15" font-weight="700" fill="#1d1b3a" text-anchor="middle">particles</text><text x="274" y="113" font-family="Caveat, cursive" font-size="12" font-weight="700" fill="#1d1b3a" text-anchor="middle">number, N</text></g><g data-part="particles-note"><text x="314" y="138" font-family="Caveat, cursive" font-size="12" font-weight="700" fill="#1d1b3a" text-anchor="end">L = 6.02 × 10²³</text><text x="314" y="151" font-family="Caveat, cursive" font-size="12" font-weight="700" fill="#1d1b3a" text-anchor="end">per mol</text></g><g data-part="to-particles"><path d="M205 90L231 90M225.7 87.1L231 90L225.7 92.9" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/><text x="218" y="84" font-family="Caveat, cursive" font-size="13" font-weight="700" fill="#1d1b3a" text-anchor="middle">× L</text></g><g data-part="from-particles"><path d="M231 110L205 110M210.3 107.1L205 110L210.3 112.9" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/><text x="218" y="126" font-family="Caveat, cursive" font-size="13" font-weight="700" fill="#1d1b3a" text-anchor="middle">÷ L</text></g></svg>