<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="Physical and chemical change side by side: ice melting and freezing back, magnesium burning to white magnesium oxide, with their masses"><g data-part="physical-tag"><rect x="22" y="4" width="112" height="22" rx="9" fill="#3b82f6" fill-opacity="0.45" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/><text x="78" y="20" font-family="Caveat, cursive" font-size="16" font-weight="700" fill="#1d1b3a" text-anchor="middle">physical change</text><text x="78" y="39" font-family="Caveat, cursive" font-size="12" font-weight="700" fill="#1d1b3a" text-anchor="middle">no new substance</text><text x="78" y="51" font-family="Caveat, cursive" font-size="12" font-weight="700" fill="#1d1b3a" text-anchor="middle">easily reversed</text></g><path d="M78 57L78 74M75.1 68.7L78 74L80.9 68.7" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/><g data-part="ice"><rect x="14" y="86" width="38" height="38" rx="4" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6"/><path d="M20 94L30 94M20 100L25 100" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/></g><g data-part="melt-arrow"><path d="M58 98L98 98M92.7 95.1L98 98L92.7 100.9" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/><text x="78" y="92" font-family="Caveat, cursive" font-size="12" font-weight="700" fill="#1d1b3a" text-anchor="middle">melt</text></g><g data-part="back-arrow"><path d="M98 112L58 112M63.3 109.1L58 112L63.3 114.9" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/><text x="78" y="126" font-family="Caveat, cursive" font-size="12" font-weight="700" fill="#1d1b3a" text-anchor="middle">freeze</text></g><g data-part="water"><path d="M124 84Q110 104 112 