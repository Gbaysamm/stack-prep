<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="A long tube with ammonia at one end and hydrochloric acid at the other; the white ring of ammonium chloride forms nearer the hydrochloric acid end"><g data-part="tube"><rect x="18" y="84" width="284" height="32" rx="16" fill="#0ea5e9" fill-opacity="0.12" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6"/></g><g data-part="nh3-end"><g fill="#3b82f6" fill-opacity="0.45" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"><circle cx="30" cy="94" r="6"/><circle cx="40" cy="92" r="6"/><circle cx="30" cy="106" r="6"/><circle cx="40" cy="107" r="6"/><circle cx="35" cy="100" r="6"/><circle cx="45" cy="100" r="6"/></g><path d="M48.0 146.0L40.0 120.0M43.9 123.8L40.0 120.0L38.9 125.3" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/><text x="55" y="160" font-family="Caveat, cursive" font-size="13" font-weight="700" fill="#1d1b3a" text-anchor="middle">ammonia</text><text x="55" y="175" font-family="Caveat, cursive" font-size="13" font-weight="700" fill="#1d1b3a" text-anchor="middle">(NH₃)</text></g><g data-part="hcl-end"><g fill="#f59e0b" fill-opacity="0.45" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"><circle cx="290" cy="94" r="6"/><circle cx="280" cy="92" r="6"/><circle cx="290" cy="106" r="6"/><circle cx="280" cy="107" r="6"/><circle cx="285" cy="100" r="6"/><circle cx="275" cy="100" r="6"/></g><path d="M272.0 146.0L280.0 120.0M281.1 125.3L280.0 120.0L276.1 123.8" fill="none" stroke="#1d1b3a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/><text x="262" y="160" font-family="Caveat, cursive" font-size="13" font-weight="700" fill="#1d1b3a" text-anchor="middle">hydrochloric acid</text><text x="262" y="175" font-family="Caveat, cursive" font-size="13" font-weight="700" fill="#1d1b3a" text-anchor="middle">(HCl)</text