# Synonyms (lesson 1 of 3): what a synonym is, and the four steps for a JAMB synonym question,
# worked on one real past question. No diagram: the board carries the sentences, the key word
# underlined on its word. Names for the pronunciation list: Ugo.
format_version: 1
subject: english
subtopic: 'Synonyms'
subtopic_id: 07638d23-d61b-5b51-b2d5-68c5ad72dea5
part: 1
title: 'What a synonym is, and four steps to answer'
sources:            # what the approach rests on, for reviewers
  - 'JAMB UTME past questions in our bank (database/subtopic_brief.py), 2010 to 2018'
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is synonyms.'
    write: 'Synonyms'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'JAMB sets synonym questions in the Use of English paper every year. You are given a sentence with one word in italics, and you choose the option nearest in meaning to that word.'
    write: 'JAMB: choose the option nearest in meaning to the word in italics'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'By the end of this lesson, you will be able to say what a synonym is, and use four steps to answer a synonym question.'
    write: 'Today: what a synonym is, and four steps to answer'

  # ---------------------------------------------------------------- synonym
  - section: 'Synonym'
    say: 'A synonym is a word that means the same, or nearly the same, as another word.'
    write: 'Synonym: a word that means the same, or nearly the same, as another'
    point:
      - {line: 3, kind: underline, at: 'the same, or nearly the same', 'on': same}
  - say: 'For example, big and large are synonyms. They live in a big house means the same as they live in a large house.'
    write: 'They live in a big house. = They live in a large house.'
    point:
      - {line: 4, kind: underline, at: 'big', 'on': big, on_nth: 2}
      - {line: 4, kind: underline, at: 'large', 'on': large, on_nth: 2}
  - say: 'Very few words mean exactly the same thing in every sentence. That is why JAMB asks for the option nearest in meaning, not an exact match.'
    write: 'Few words match exactly, so we choose the nearest'

  # ---------------------------------------------------------------- the four steps, one at a time
  - section: 'Four steps'
    say: 'We answer every synonym question in four steps. Step one. Read the whole sentence, because the sentence shows what the word means here.'
    write: '1. Read the whole sentence'
  - say: 'Step two. Before you look at the options, say what the word means in this sentence, in your own simple words.'
    write: '2. Say what the word means here, in your own words'
  - say: 'Step three. Put each option in the place of the word, and read the sentence again.'
    write: '3. Put each option in its place'
  - say: 'Step four. Keep the option that gives the sentence the same meaning, and give a reason for rejecting each of the others.'
    write: '4. Keep the one that keeps the meaning'

  # ---------------------------------------------------------------- worked example (JAMB 2010)
  - section: 'Worked example'
    say: 'Let us solve this. Ugo is eligible for the post of secretary. We want the option nearest in meaning to eligible.'
    write: 'Ugo is eligible for the post of secretary.'
    point:
      - {line: 10, kind: underline, at: 'eligible', 'on': eligible}
  - say: 'The options are nominated, invited, qualified and intelligent.'
    write: 'A. nominated   B. invited   C. qualified   D. intelligent'
  - say: 'Steps one and two. The sentence is about a post, so eligible here means that Ugo meets the conditions for the post. He is allowed to be chosen.'
    write: 'Eligible here: meets the conditions, so may be chosen'
    point:
      - {line: 10, kind: circle, at: 'eligible', 'on': eligible}
  # One option said, then written; then the next (founder, 12 Nov 2026).
  - say: 'Now step three. Nominated means his name has been put forward. That can only happen after he is eligible, so it is not the same meaning.'
    write: 'Nominated: name put forward, which comes later ✗'
  - say: 'Invited means someone has asked him to come. That is something done to him, not the conditions he meets.'
    write: 'Invited: asked to come, not the conditions ✗'
  - say: 'Qualified means he has what the post asks for. Ugo is qualified for the post of secretary keeps our meaning.'
    write: 'Qualified: has what the post asks for ✓'
  - say: 'Intelligent means clever. A clever man may still not meet the conditions, so intelligent does not fit.'
    write: 'Intelligent: clever, not the conditions ✗'
  - say: 'Step four. Only qualified keeps the meaning, so the answer is C, qualified.'
    write: '∴ C. qualified'
    point:
      - {line: 11, kind: circle, at: 'qualified', 'on': answer}

  # ---------------------------------------------------------------- trap
  - section: 'JAMB trap'
    say: 'Here is the trap. Nominated and invited are words about a post, so they feel right. But a word about the same topic is not a synonym. Test the meaning, not the topic.'
    write: 'Trap: a word on the same topic is not a synonym'

  # ---------------------------------------------------------------- check yourself (JAMB 2013)
  - section: 'Check yourself'
    say: 'Now it is your turn. The lamb is a feeble little animal. Is feeble nearest to fat, quiet, loving or weak? Pause the lesson and decide before I go on.'
    write: 'The lamb is a feeble little animal. (fat, quiet, loving, weak)'
    point:
      - {line: 19, kind: underline, at: 'feeble', 'on': feeble}
  - say: 'Feeble means lacking strength. Weak also means lacking strength, so weak keeps the meaning.'
    write: 'Feeble: lacking strength, so weak ✓'
  - say: 'Fat is about size, quiet is about sound, and loving is about feeling. None of them is about strength.'
    write: 'Fat, quiet, loving: not about strength ✗'

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. A synonym is a word that means the same, or nearly the same, as another word.'
    write: '1. Synonym: the same, or nearly the same, meaning'
  - say: 'To answer, read the whole sentence, say the meaning in your own words, put each option in its place, and keep the one that keeps the meaning. Now try the problem.'
    write: '2. Read, say the meaning, put each option in, keep the one that fits'

# ---------------------------------------------------------------- after the lesson: try it (JAMB 2010)
problems:
  - ask: 'The girl’s father was astounded to see her appear from the shrine. Which option is nearest in meaning to astounded? A. collected  B. overwhelmed  C. embarrassed  D. astonished'
    answer: 'D'
    accept: ['astonished', 'D. astonished', 'D astonished']
    working:
      - 'Read the whole sentence: the father sees his daughter come out of a shrine, which he did not expect.'
      - 'Astounded here means very surprised, shocked.'
      - 'Collected means calm, which is the opposite ✗. Overwhelmed means overcome by strong feeling, not surprise ✗. Embarrassed means ashamed ✗.'
      - 'Astonished means very surprised, so it keeps the meaning. Answer: D.'
    needs_working: false
