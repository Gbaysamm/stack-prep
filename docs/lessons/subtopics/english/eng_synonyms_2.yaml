# Synonyms (lesson 2 of 3): the meaning in context. One word has several meanings; the sentence
# picks one, and JAMB marks that one. Worked on a real past question where the usual meaning
# (explode, to burst) leads nowhere. Names for the pronunciation list: Nwankwo.
format_version: 1
subject: english
subtopic: 'Synonyms'
subtopic_id: 07638d23-d61b-5b51-b2d5-68c5ad72dea5
part: 2
title: 'The meaning in this sentence'
sources:            # what the approach rests on, for reviewers
  - 'JAMB UTME past questions in our bank (database/subtopic_brief.py), 2010 to 2018'
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is the meaning of a word in its sentence.'
    write: 'The meaning of a word in its sentence'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson you met the four steps. Now we look closely at step two, because one word can have more than one meaning.'
    write: 'One word can have more than one meaning'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'By the end of this lesson, you will be able to find the meaning a sentence gives a word, and choose the synonym for that meaning.'
    write: 'Today: find the meaning in this sentence'

  # ---------------------------------------------------------------- meaning in context
  - section: 'Meaning in context'
    say: 'A dictionary may give a word several meanings. The words around it in the sentence show which meaning is used. We call this the meaning in context.'
    write: 'Meaning in context: the meaning the sentence gives the word'
    point:
      - {line: 3, kind: underline, at: 'Meaning in context', 'on': context}
  - say: 'For example, explode usually means to burst with a loud bang, as a bomb or a gas cylinder does.'
    write: 'Explode: usually, to burst with a loud bang'

  # ---------------------------------------------------------------- worked example (JAMB 2012)
  - section: 'Worked example'
    say: 'Let us solve this. Her finding exploded widely held beliefs about learning. We want the option nearest in meaning to exploded.'
    write: 'Her finding exploded widely held beliefs about learning.'
    point:
      - {line: 5, kind: underline, at: 'exploded', 'on': exploded}
  - say: 'The options are challenged, debunked, projected and confirmed.'
    write: 'A. challenged   B. debunked   C. projected   D. confirmed'
  - say: 'A finding is a result from careful study, and it cannot burst with a bang. Here it acts on beliefs, so exploded means that it showed the beliefs were false.'
    write: 'Here: showed the beliefs to be false'
    point:
      - {line: 5, kind: circle, at: 'exploded', 'on': exploded}
  # One option said, then written; then the next (founder, 12 Nov 2026).
  - say: 'Challenged means questioned. You can question a belief without proving it false, so challenged is too weak.'
    write: 'Challenged: only questioned, too weak ✗'
  - say: 'Debunked means showed to be false. Her finding debunked widely held beliefs keeps our meaning.'
    write: 'Debunked: showed to be false ✓'
  - say: 'Projected means thrown forward, or shown on a screen. It says nothing about beliefs being false.'
    write: 'Projected: thrown forward, or shown on a screen ✗'
  - say: 'Confirmed means showed to be true. That is the opposite of our meaning.'
    write: 'Confirmed: showed to be true, the opposite ✗'
  - say: 'So the answer is B, debunked. The usual meaning of explode, to burst with a bang, would not have led you to it.'
    write: '∴ B. debunked'
    point:
      - {line: 6, kind: circle, at: 'debunked', 'on': answer}

  # ---------------------------------------------------------------- trap
  - section: 'JAMB trap'
    say: 'Here is the trap. JAMB often puts in an option that matches the usual meaning of the word, not its meaning in the sentence. Always go back to the sentence before you choose.'
    write: 'Trap: the usual meaning may not be the meaning here'

  # ---------------------------------------------------------------- check yourself (JAMB 2013)
  - section: 'Check yourself'
    say: 'Now it is your turn. Nwankwo was on the verge of signing a two-year contract with the club.'
    write: 'Nwankwo was on the verge of signing a two-year contract with the club.'
    point:
      - {line: 14, kind: underline, at: 'verge', 'on': verge}
  - say: 'Is verge nearest to shore, brink, summit or height? Pause the lesson and decide before I go on.'
    write: 'A. shore   B. brink   C. summit   D. height'
  - say: 'A verge is an edge, such as the grass edge of a road. But on the verge of signing means that he was just about to sign.'
    write: 'On the verge of signing: just about to sign'
  - say: 'On the brink of also means just about to. So brink is the answer.'
    write: 'On the brink of: just about to, so brink ✓'
  - say: 'Shore is the edge of the sea, and summit and height are the top of something. None of them means just about to.'
    write: 'Shore, summit, height: not just about to ✗'

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. A word can have several meanings, and the sentence shows which one is used.'
    write: '1. The sentence shows which meaning is used'
  - say: 'Choose the option that matches the meaning in context, not just the usual meaning of the word. Now try the problem.'
    write: '2. Match the meaning in context'

# ---------------------------------------------------------------- after the lesson: try it (JAMB 2018)
problems:
  - ask: 'Tunde’s reaction underscores the points I was making. Which option is nearest in meaning to underscores? A. justifies  B. summarizes  C. emphasizes  D. clarifies'
    answer: 'C'
    accept: ['emphasizes', 'emphasises', 'C. emphasizes', 'C emphasizes']
    working:
      - 'To underscore usually means to draw a line under words.'
      - 'A reaction cannot draw a line, so here it means gives extra weight to the points: stresses them.'
      - 'Emphasizes means stresses, so it keeps the meaning ✓.'
      - 'Justifies means shows to be right, summarizes means gives in short, and clarifies means makes clearer: none means stresses ✗. Answer: C.'
    needs_working: false
