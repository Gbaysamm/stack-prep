# Synonyms (lesson 3 of 3): two more tests for close options (same word class, same tone) and
# the JAMB traps (the look-alike word, the opposite). Worked on a real past question.
# Names for the pronunciation list: Okibe, Ada. "Rusticated" is the Nigerian school word for
# sent away from school as a punishment.
format_version: 1
subject: english
subtopic: 'Synonyms'
subtopic_id: 07638d23-d61b-5b51-b2d5-68c5ad72dea5
part: 3
title: 'Word class, tone and the traps'
sources:            # what the approach rests on, for reviewers
  - 'JAMB UTME past questions in our bank (database/subtopic_brief.py), 2010 to 2018'
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is word class, tone and the traps in synonym questions.'
    write: 'Word class, tone and the traps'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last two lessons you met the four steps and the meaning in context. When two options still seem close, two more tests help. They are word class and tone.'
    write: 'Two more tests: word class and tone'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'By the end of this lesson, you will be able to use these two tests, and avoid the common traps.'
    write: 'Today: two tests, and the traps'

  # ---------------------------------------------------------------- word class
  - section: 'Word class'
    say: 'Word class means whether a word is a noun, a verb, an adjective or another kind of word. The synonym is always the same word class as the word in italics.'
    write: 'The synonym is the same word class as the word in italics'
  - say: 'The word class also shows which meaning is used. For example, in Ada''s answer was right, the word right is an adjective. It means correct.'
    write: 'Ada''s answer was right. (adjective: correct)'
    point:
      - {line: 4, kind: underline, at: 'right', 'on': right, on_nth: 2}
  - say: 'But in every child has a right to education, the word right is a noun. It means something you are allowed to have, so correct would not fit there.'
    write: 'Every child has a right to education. (noun: something you are allowed)'
    point:
      - {line: 5, kind: underline, at: 'right', 'on': right, on_nth: 2}

  # ---------------------------------------------------------------- tone
  - section: 'Tone'
    say: 'Now tone. Tone is the feeling a word carries, good or bad, and how strong that feeling is. The synonym carries the same feeling.'
    write: 'Tone: the good or bad feeling a word carries'

  # ---------------------------------------------------------------- worked example (JAMB 2012)
  - section: 'Worked example'
    say: 'Let us solve this. Okibe was rusticated for his derogatory remark about the principal. We want the option nearest in meaning to derogatory.'
    write: 'Okibe was rusticated for his derogatory remark about the principal.'
    point:
      - {line: 7, kind: underline, at: 'derogatory', 'on': derogatory}
  - say: 'The options are complimentary, unsavoury, unwarranted and lacklustre.'
    write: 'A. complimentary   B. unsavoury   C. unwarranted   D. lacklustre'
  - say: 'Derogatory is an adjective that describes the remark. It means insulting, so its tone is bad. Okibe was punished for it, which agrees.'
    write: 'Derogatory (adjective): insulting, a bad tone'
    point:
      - {line: 7, kind: circle, at: 'derogatory', 'on': derogatory}
  # One option said, then written; then the next (founder, 12 Nov 2026).
  - say: 'Complimentary means full of praise. Its tone is good, which is the opposite of insulting.'
    write: 'Complimentary: full of praise, a good tone ✗'
  - say: 'Unsavoury means unpleasant or offensive. It is an adjective with the same bad tone, so it keeps the meaning.'
    write: 'Unsavoury: unpleasant, offensive, a bad tone ✓'
  - say: 'Unwarranted means without good reason. A remark can be unwarranted without being insulting, so it does not match.'
    write: 'Unwarranted: without good reason, not insulting ✗'
  - say: 'Lacklustre means dull and without energy. It describes a weak remark, not an insulting one.'
    write: 'Lacklustre: dull, not insulting ✗'
  - say: 'So the answer is B, unsavoury.'
    write: '∴ B. unsavoury'
    point:
      - {line: 8, kind: circle, at: 'unsavoury', 'on': answer}

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Now the traps. The first is a word that looks or sounds like the word in italics. For example, complements, spelt with an e, means completes. It is not a synonym of compliments, which means praises.'
    write: 'Trap 1: a look-alike word, such as complements for compliments ✗'
  - say: 'The second trap is the opposite. JAMB often puts a word of opposite meaning among the options. Opposites are taught in the lesson on antonyms.'
    write: 'Trap 2: a word of opposite meaning ✗'

  # ---------------------------------------------------------------- check yourself (JAMB 2014)
  - section: 'Check yourself'
    say: 'Now it is your turn. The candidates looked aghast at the first reading of the questions.'
    write: 'The candidates looked aghast at the first reading of the questions.'
    point:
      - {line: 17, kind: underline, at: 'aghast', 'on': aghast}
  - say: 'Is aghast nearest to fulfilled, dismayed, satisfied or relaxed? Pause the lesson and decide before I go on.'
    write: 'A. fulfilled   B. dismayed   C. satisfied   D. relaxed'
  - say: 'Aghast means filled with shock and horror, so its tone is bad.'
    write: 'Aghast: shocked and horrified, a bad feeling'
  - say: 'Fulfilled, satisfied and relaxed are all happy feelings, so their tone is wrong.'
    write: 'Fulfilled, satisfied, relaxed: happy feelings ✗'
  - say: 'Dismayed means shocked and upset, which is the same bad feeling. So the answer is dismayed.'
    write: 'Dismayed: shocked and upset ✓'

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. The synonym is the same word class as the word, and the word class shows which meaning is used.'
    write: '1. Same word class, which shows the meaning used'
  - say: 'The synonym also carries the same tone. Watch for look-alike words and for opposites. Now try the problem.'
    write: '2. Same tone; watch for look-alikes and opposites'

# ---------------------------------------------------------------- after the lesson: try it (JAMB 2014)
problems:
  - ask: 'The first round of the tournament was a doddle. Which option is nearest in meaning to doddle? A. easy  B. balanced  C. dodgy  D. exasperating'
    answer: 'A'
    accept: ['easy', 'A. easy', 'A easy']
    working:
      - 'A doddle is an informal word for a task that is very easy.'
      - 'Easy keeps the meaning: the first round was easy ✓.'
      - 'Dodgy looks like doddle, but it means suspicious or risky: the look-alike trap ✗.'
      - 'Balanced means even between the two sides, and exasperating means very annoying ✗. Answer: A.'
    needs_working: false
