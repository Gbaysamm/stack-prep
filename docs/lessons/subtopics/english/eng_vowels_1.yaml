# Spelling and sound (lesson 1 of 3): the British model stated; why spelling misleads (cat/car,
# see/sea, food/good); what a pure vowel sound is; the length mark (quality differs too); the
# twelve pure vowel sounds filled into ONE table kept as the reference, short ones then long
# ones (founder, 18 Nov: groups, not pairs); schwa taught on its own, not as a partner of /ɜː/. One short exam example (key,
# 2018), laid out as JAMB prints it, one option per moment; problem: patch (2012).
#
# SOUND (founder, 18 Nov 2026, review docs/lessons/reviews/eng_vowels_2026-11-18.md). No
# pronunciation demonstrations and no talking mouth: the voice names a sound by its key word
# ("the vowel sound in seat") as the board writes its symbol. Key words are the guide's table,
# always the same. Tested letters are underlined on the board, never spelt out. The voice does
# not read IPA symbols aloud (the speech has no reading for them); the board carries them.
format_version: 1
subject: english
subtopic: 'Vowels (monophthongs, diphthongs and triphthongs)'
subtopic_id: 3f2afdfd-8d74-5e08-963d-1a98326b16c5
part: 1
title: 'Spelling and sound: the twelve pure vowel sounds'
sources:            # what the approach rests on, for reviewers
  - 'JAMB UTME past questions in our bank (database/subtopic_brief.py), 2010 to 2018'
  - 'JAMB UTME Use of English syllabus: Oral Forms, vowels (monophthongs, diphthongs, triphthongs)'
  - 'The British (RP) vowel set as Nigerian SS oral English texts teach it (12 pure vowels, 8 diphthongs, 5 triphthongs)'
  - 'Founder review of the pilot, docs/lessons/reviews/eng_vowels_2026-11-18.md'
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is spelling and sound, and the twelve pure vowel sounds.'
    write: 'Spelling and sound: the twelve pure vowel sounds'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'English has only five vowel letters, A, E, I, O and U. But in the traditional British English pronunciation model we are studying, there are twenty vowel sounds. This means the spelling of a word does not always tell us which vowel sound it has.'
    write: 'Five vowel letters, but twenty vowel sounds in the traditional British model'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'By the end of this lesson, you will be able to name the twelve pure vowel sounds, each by its symbol and its key word.'
    write: 'Name the twelve pure vowel sounds by symbol and key word'

  # ---------------------------------------------------------------- why spelling misleads
  - section: 'Spelling and sound'
    say: 'First, let us see why spelling misleads. Cat and car are spelt with the same vowel letter, yet their vowel sounds are different.'
    write: 'Cat and car: same letter, different vowel sounds'
    point:
      - {line: 3, kind: underline, at: 'C[[a]]t', 'on': cat}
      - {line: 3, kind: underline, at: 'c[[a]]r', 'on': car}
  - say: 'See and sea are spelt differently, yet they have the same vowel sound.'
    write: 'See and sea: different letters, same vowel sound'
    point:
      - {line: 4, kind: underline, at: 'S[[ee]]', 'on': see}
      - {line: 4, kind: underline, at: 's[[ea]]', 'on': sea}
  - say: 'Food and good are spelt with the same vowel letters, yet their vowel sounds are different. So we learn to identify the sound, not read it from the letters.'
    write: 'Food and good: same letters, different vowel sounds'
    point:
      - {line: 5, kind: underline, at: 'F[[oo]]d', 'on': food}
      - {line: 5, kind: underline, at: 'g[[oo]]d', 'on': good}

  # ---------------------------------------------------------------- pure vowel sounds
  - section: 'Pure vowel sounds'
    say: 'A pure vowel sound, also called a monophthong, is a vowel sound produced without the tongue changing position significantly. It is one steady vowel sound, with no movement from one vowel to another.'
    write: 'Pure vowel (monophthong): one steady vowel sound, no movement from one vowel to another'
  - say: 'Each vowel sound has a symbol, written between two slanting lines. We will learn each symbol using a key word. This is a familiar word that helps us recognise and remember the sound.'
    write: 'Each sound: a symbol between slanting lines, and one key word'
  - say: 'There are twelve pure vowel sounds. Seven are short and five are long. We write long vowel sounds with a special length mark after their symbols. It looks like two small dots.'
    write: 'Seven short, five long. Length mark ː (two small dots)'
    diagram:
      id: t
      kind: table
      columns: ['Short sounds', 'Long sounds']
      rows: [['', ''], ['', ''], ['', ''], ['', ''], ['', ''], ['', ''], ['', '']]
      caption: 'the twelve pure vowel sounds'
      'on': 'twelve'

  # ---------------------------------------------------------------- the twelve sounds, into the table
  - section: 'The twelve sounds'
    say: 'First, the seven short vowel sounds. The vowel sounds in sit, book and hot are short.'
    diagram_do:
      - {id: t, op: fill, part: 'cell:1,1', text: '/ɪ/ sit', 'on': 'sit'}
      - {id: t, op: fill, part: 'cell:2,1', text: '/ʊ/ book', 'on': 'book'}
      - {id: t, op: fill, part: 'cell:3,1', text: '/ɒ/ hot', 'on': 'hot'}
  - say: 'The vowel sounds in cat, bed and cup are short too.'
    diagram_do:
      - {id: t, op: fill, part: 'cell:4,1', text: '/æ/ cat', 'on': 'cat'}
      - {id: t, op: fill, part: 'cell:5,1', text: '/e/ bed', 'on': 'bed'}
      - {id: t, op: fill, part: 'cell:6,1', text: '/ʌ/ cup', 'on': 'cup'}
  - say: 'The seventh short vowel sound is schwa, the first vowel sound in about. Schwa is a weak, unstressed vowel sound, as at the end of doctor, and it is the most common vowel sound in English.'
    diagram_do:
      - {id: t, op: fill, part: 'cell:7,1', text: '/ə/ about', 'on': 'about'}
  - say: 'Now the five long vowel sounds, each written with the length mark. They are the vowel sounds in seat, food and saw.'
    diagram_do:
      - {id: t, op: fill, part: 'cell:1,2', text: '/iː/ seat', 'on': 'seat'}
      - {id: t, op: fill, part: 'cell:2,2', text: '/uː/ food', 'on': 'food'}
      - {id: t, op: fill, part: 'cell:3,2', text: '/ɔː/ saw', 'on': 'saw'}
  - say: 'The last two are the vowel sounds in car and bird. The vowel sound in bird is a long sound of its own, and schwa is not a short form of it.'
    diagram_do:
      - {id: t, op: fill, part: 'cell:4,2', text: '/ɑː/ car', 'on': 'car'}
      - {id: t, op: fill, part: 'cell:5,2', text: '/ɜː/ bird', 'on': 'bird'}
  - say: 'Compare sit and seat. One is short and the other is long, but their actual sounds are also slightly different, so we use different symbols.'
    write: 'Short and long differ in quality, not only in length'
    diagram_do:
      - {id: t, op: highlight, part: 'cell:1,1', 'on': 'sit'}
      - {id: t, op: highlight, part: 'cell:1,2', 'on': 'seat'}
  - section: 'Using the table'
    say: 'Now, how do we use the table? Spelling alone cannot tell us the vowel sound. So we say the word to ourselves, find its vowel sound, and match it to a key word. The key words work because you already know how they sound.'
    write: 'Say the word, find its vowel sound, match it to a key word'

  # ---------------------------------------------------------------- JAMB example (2018)
  - section: 'JAMB example'
    say: 'Now let us see how JAMB tests this, with a question from 2018. The given word is key, with its last two letters underlined. Which option has the same vowel sound as the underlined letters in key?'
    write: 'Which option has the same vowel sound as the underlined letters in key?'
    point:
      - {line: 11, kind: underline, at: 'k[[ey]]', 'on': key}
  - say: 'The options are sit, bet, seat and tread.'
    write: 'A. sit   B. bet   C. seat   D. tread'
  - say: 'The vowel sound in key is the same as the vowel sound in seat.'
    write: 'Key: /iː/, as in seat'
    diagram_do:
      - {id: t, op: highlight, part: 'cell:1,2', 'on': 'seat'}
  - say: 'Sit is the key word for a short vowel sound, so it does not match.'
    write: 'A. sit /ɪ/ ✗'
  - say: 'Bet has the vowel sound of bed, so it does not match.'
    write: 'B. bet /e/ ✗'
    diagram_do:
      - {id: t, op: highlight, part: 'cell:5,1', 'on': 'bed'}
  - say: 'Seat is the key word for the long vowel sound, so it matches key.'
    write: 'C. seat /iː/ ✓'
  - say: 'Tread also has the vowel sound of bed, so it does not match.'
    write: 'D. tread /e/ ✗'
  - say: 'So the answer is C, seat.'
    write: 'Answer: C, seat ✓'
    point:
      - {line: 12, kind: circle, at: 'C. seat', 'on': answer}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. English has twelve pure vowel sounds, seven short and five long, each with its own symbol and key word. To answer, find the vowel sound in the given word, recall its key word, and compare it with the options, because different spellings can share a vowel sound. Now try the problem.'
    write: 'Twelve pure vowel sounds: seven short, five long, one key word each'

# ---------------------------------------------------------------- after the lesson: try it (JAMB 2012)
problems:
  - ask: 'Choose the option that has the same vowel sound as the underlined letter in p*a*tch.  A. starch  B. fare  C. mad  D. brave'
    answer: 'C'
    accept: ['mad', 'C. mad', 'C mad']
    working:
      - 'The underlined a in patch has the short vowel sound of cat, /æ/.'
      - 'Starch has the long vowel sound of car, /ɑː/ (in British English the r is not pronounced). Not the same.'
      - 'Fare has the gliding vowel sound of hair, /eə/, and brave has the gliding vowel sound of day, /eɪ/. Not the same.'
      - 'Mad has the short vowel sound of cat, /æ/, like patch. Answer: C.'
    needs_working: false
