# Single vowel letters (lesson 2 of 4): open and closed syllables. A single a, o, i or u is
# usually long (its letter name: day, go, my, food or cute) when it ends its syllable, and
# short (cat, hot, sit, cup) when a consonant closes it; one consonant before the next vowel
# usually leaves it open, two close it; a final silent e opens it. Then the consonant patterns
# around a vowel (founder, 18 Nov): a before ss, st, th, nt, sk is /ɑː/ in British English;
# i and o before ld, and i before nd, ght, are long (o before nd is not: bond, pond); al before l or k
# is /ɔː/ (palm, calm /ɑː/). Each a clue with its exceptions (come, son, give; river, lemon);
# the true exceptions (indict, coup, colonel) named once. Worked on tolerated (2017), one
# option per moment; checked on coma (2013); problem: glazier (2013), whose wrong option glass
# is the a-before-ss pattern.
#
# Left out for length (founder's addition): a after w is /ɒ/ (was, want, swan; war, warm
# /ɔː/), as no bank question tests it.
#
# Not used here: poster (2017), because o before st breaks the two-consonant clue (post, most
# are long, cost, lost short), and bubble (2011), whose option bull needs the bull, full, put
# list; patch (2012) is lesson 1's problem.
#
# SOUND: as in lesson 1. No demonstrations; key words from the guide's table; the voice never
# reads a symbol; tested letters underlined, never spelt out.
format_version: 1
subject: english
subtopic: 'Vowels (monophthongs, diphthongs and triphthongs)'
subtopic_id: 3f2afdfd-8d74-5e08-963d-1a98326b16c5
part: 2
title: 'Single vowel letters: open and closed syllables'
sources:            # what the approach rests on, for reviewers
  - 'JAMB UTME past questions in our bank (database/subtopic_brief.py), 2010 to 2018'
  - 'JAMB UTME Use of English syllabus: Oral Forms, vowels (monophthongs, diphthongs, triphthongs)'
  - 'The British (RP) vowel set as Nigerian SS oral English texts teach it (12 pure vowels, 8 diphthongs, 5 triphthongs)'
  - 'Founder review of the pilot, docs/lessons/reviews/eng_vowels_2026-11-18.md'
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is single vowel letters, and open and closed syllables.'
    write: 'Single vowel letters: open and closed syllables'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'Now we work out the sound of a single vowel letter, even in a word we have never met. The clue is its syllable.'
    write: 'A single vowel letter: its syllable is the clue'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'By the end of this lesson, you will be able to tell whether a single a, o, i or u is long or short.'
    write: 'Tell whether a single a, o, i or u is long or short'

  # ---------------------------------------------------------------- open and closed
  - section: 'Open and closed'
    say: 'A syllable is open when it ends with its vowel letter, as co does in coma. It is closed when a consonant ends it, as com does in comma.'
    write: 'Open: co-ma.   Closed: com-ma'
    point:
      - {line: 3, kind: underline, at: 'c[[o]]-ma', 'on': coma}
      - {line: 3, kind: underline, at: 'c[[o]]m-ma', 'on': comma}
  - say: 'Look after the vowel letter. One consonant then a vowel usually leaves it open, as in mo-tor. Two consonants usually close it, as in jot-ter.'
    write: 'One consonant: mo-tor, open.   Two: jot-ter, closed'
  - say: 'In an open syllable, the letter usually says its name. So a has the vowel sound of day, o of go and i of my, gliding sounds we meet in lesson four.'
    diagram:
      id: t
      kind: table
      columns: ['Letter', 'Open: long', 'Closed: short']
      rows: [['a', '', ''], ['o', '', ''], ['i', '', ''], ['u', '', '']]
      caption: 'a single vowel letter'
      'on': 'open'
    diagram_do:
      - {id: t, op: fill, part: 'cell:1,2', text: '/eɪ/ day', 'on': 'day'}
      - {id: t, op: fill, part: 'cell:2,2', text: '/əʊ/ go', 'on': 'go'}
      - {id: t, op: fill, part: 'cell:3,2', text: '/aɪ/ my', 'on': 'my'}
  - say: 'In a closed syllable, it is usually short. So a has the vowel sound of cat, o of hot and i of sit.'
    diagram_do:
      - {id: t, op: fill, part: 'cell:1,3', text: '/æ/ cat', 'on': 'cat'}
      - {id: t, op: fill, part: 'cell:2,3', text: '/ɒ/ hot', 'on': 'hot'}
      - {id: t, op: fill, part: 'cell:3,3', text: '/ɪ/ sit', 'on': 'sit'}
  - say: 'U follows the same rule. Open, it has the vowel sound of food, sometimes after a y sound, as in cute. Closed, it has that of cup.'
    diagram_do:
      - {id: t, op: fill, part: 'cell:4,2', text: '/uː/ food', 'on': 'food'}
      - {id: t, op: fill, part: 'cell:4,3', text: '/ʌ/ cup', 'on': 'cup'}
  - say: 'A final silent e makes the syllable open. So bit has the vowel sound of sit, but bite that of my, and hop has the vowel sound of hot, but hope that of go.'
    write: 'Silent e opens it: bit → bite, hop → hope'
    diagram_do:
      - {id: t, op: highlight, part: 'row:3', 'on': 'bite'}
      - {id: t, op: highlight, part: 'row:2', 'on': 'hope'}

  # ---------------------------------------------------------------- consonant patterns
  - section: 'Consonant clues'
    say: 'More clues come from the consonants after it. In British English, a before ss, st, th, nt or sk usually has the vowel sound of car, as in glass, last, path and ask. Yet mass has that of cat.'
    write: 'a + ss, st, th, nt, sk: /ɑː/ car: glass, last, path, ask. But mass'
  - say: 'Before ld, i and o usually say their names, as in child and cold, and so does i before nd or ght, as in mind and night.'
    write: 'Long: i, o + ld (child, cold); i + nd, ght (mind, night)'
  - say: 'Al before l or k usually has the vowel sound of saw, as in ball and talk. Yet palm and calm have a silent l and the vowel sound of car.'
    write: 'al + l, k: /ɔː/ saw: ball, talk. But palm, calm /ɑː/'

  # ---------------------------------------------------------------- limits
  - section: 'Clues, not laws'
    say: 'These are clues, not laws. Come, son, give, river and lemon are short. A few true exceptions are learned as words. Indict has the vowel sound of my, coup of food, and colonel of bird.'
    write: 'Learn: come, son, give, river, lemon. Indict /aɪ/, coup /uː/, colonel /ɜː/'

  # ---------------------------------------------------------------- worked example (2017)
  - section: 'Worked example'
    say: 'Now a JAMB question from 2017. Which option has the same vowel sound as the underlined letter in tolerated?'
    write: 'Which option has the same vowel sound as the underlined letter in tolerated?'
    point:
      - {line: 10, kind: underline, at: 'toler[[a]]ted', 'on': tolerated}
  - say: 'The options are stale, kneel, met and mat.'
    write: 'A. stale   B. kneel   C. met   D. mat'
  - say: 'In tolerated, one consonant and a vowel follow the a, so it is open, with the vowel sound of day.'
    write: 'Tolerated: ra-ted, open: /eɪ/, as in day'
    diagram_do:
      - {id: t, op: highlight, part: 'cell:1,2', 'on': 'day'}
  - say: 'Stale ends in a silent e, so its a has the vowel sound of day too.'
    write: 'A. stale /eɪ/, as in day ✓'
  - say: 'Kneel has the vowel sound of seat.'
    write: 'B. kneel /iː/, as in seat ✗'
  - say: 'Met is closed, with the vowel sound of bed.'
    write: 'C. met /e/, as in bed ✗'
  - say: 'Mat is closed, with the vowel sound of cat. So the answer is A, stale.'
    write: 'D. mat /æ/, as in cat ✗'
    diagram_do:
      - {id: t, op: highlight, part: 'cell:1,3', 'on': 'cat'}
    point:
      - {line: 11, kind: circle, at: 'A. stale', 'on': answer}

  # ---------------------------------------------------------------- check yourself (2013)
  - section: 'Check yourself'
    say: 'Now it is your turn, with a question from 2013. Which option has the same vowel sound as the underlined letter in coma?'
    write: 'Which option has the same vowel sound as the underlined letter in coma?'
    point:
      - {line: 17, kind: underline, at: 'c[[o]]ma', 'on': coma}
  - say: 'The options are colonel, cogent, come and comma. Pause the lesson and decide.'
    write: 'A. colonel   B. cogent   C. come   D. comma'
  - say: 'Coma and cogent are open, with the vowel sound of go. Comma is closed, with that of hot, come has that of cup, and colonel is a true exception. So the answer is B, cogent.'
    write: 'Coma, cogent /əʊ/ ✓   Comma /ɒ/, come /ʌ/, colonel /ɜː/ ✗'
    diagram_do:
      - {id: t, op: highlight, part: 'cell:2,2', 'on': 'go'}
    point:
      - {line: 18, kind: circle, at: 'B. cogent', 'on': answer}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. A single vowel letter is usually long in an open syllable or before a silent e, and short in a closed one. The consonants after it add clues. Now try the problem.'
    write: 'Open: long. Closed: short. Then the consonant clues, and the list'

# ---------------------------------------------------------------- after the lesson: try it (JAMB 2013)
problems:
  - ask: 'Choose the option that has the same vowel sound as the underlined letter in gl*a*zier.  A. gleam  B. flat  C. feign  D. glass'
    answer: 'C'
    accept: ['feign', 'C. feign', 'C feign']
    working:
      - 'In glazier, one consonant and then a vowel follow the a (gla-zier), so its syllable is open and it has the long vowel sound of day, /eɪ/.'
      - 'Gleam has the vowel sound of seat, /iː/. Not the same.'
      - 'Flat is closed, so its a has the short vowel sound of cat, /æ/. Not the same.'
      - 'Glass has a before ss, so in British English it has the vowel sound of car, /ɑː/. It looks like glazier but does not sound like it.'
      - 'Feign sounds like fain, with the vowel sound of day, /eɪ/. Answer: C.'
    needs_working: false
