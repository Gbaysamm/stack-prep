# Letter pairs (lesson 3 of 4): the spelling families JAMB's bank tests, each with its usual
# sound, the rule that decides it and the short list to learn. oo: /uː/ food by default; /ʊ/
# book before k; good, hood, wood, stood, foot, wool learned; blood, flood /ʌ/. ea, ee: /iː/
# seat; bread, head, death /e/. ei: weight, eight /eɪ/. ey (founder, 18 Nov): /eɪ/ day in they,
# grey, obey; a weak ending in money, valley; key /iː/ learned. ou, ow: /aʊ/ cow; low, flow,
# show /əʊ/ at the end. au, aw, augh: /ɔː/ saw; aunt, laugh /ɑː/. Worked on cowed (2017), one
# option per moment; checked on book (2012); problems: leach (2011) and taught (2018).
#
# A vowel before r is taught in lesson 4, beside the diphthongs of here and hair (it did not
# fit this lesson's length). Not used: cool (2014, the same test as book), laud (2013, the same
# family as taught), palm (2014, ranch differs between British and American English), key
# (2018, lesson 1), roared (2010).
#
# SOUND: as in lesson 1. No demonstrations; key words from the guide's table; the voice never
# reads a symbol; tested letters underlined, never spelt out.
format_version: 1
subject: english
subtopic: 'Vowels (monophthongs, diphthongs and triphthongs)'
subtopic_id: 3f2afdfd-8d74-5e08-963d-1a98326b16c5
part: 3
title: 'Letter pairs'
sources:            # what the approach rests on, for reviewers
  - 'JAMB UTME past questions in our bank (database/subtopic_brief.py), 2010 to 2018'
  - 'JAMB UTME Use of English syllabus: Oral Forms, vowels (monophthongs, diphthongs, triphthongs)'
  - 'The British (RP) vowel set as Nigerian SS oral English texts teach it (12 pure vowels, 8 diphthongs, 5 triphthongs)'
  - 'Founder review of the pilot, docs/lessons/reviews/eng_vowels_2026-11-18.md'
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is letter pairs, and the vowel sounds they usually stand for.'
    write: 'Letter pairs'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson, a single vowel letter was long or short by its syllable. Two letters together, such as oo or ea, form spelling families. Each family has a usual sound, and a short list of words to learn by heart.'
    write: 'Each pair: a usual sound, and a short list to learn'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'By the end of this lesson, you will be able to work out the vowel sound of words spelt with oo, ea, ey, ou or au, even words you have never met.'
    write: 'Work out the sound of oo, ea, ey, ou and au words'

  # ---------------------------------------------------------------- oo
  - section: 'oo'
    say: 'We start with oo. Its usual vowel sound is the long one in food, as in cool, spool, moon and school.'
    write: 'oo: usually /uː/, as in food: cool, spool, moon, school'
    diagram:
      id: t
      kind: table
      columns: ['Letters', 'Usual sound', 'Learn these']
      rows: [['oo', '', ''], ['ea, ee', '', ''], ['ey', '', ''], ['ou, ow', '', ''], ['au, aw', '', '']]
      caption: 'letter pairs'
      'on': 'oo'
    diagram_do:
      - {id: t, op: fill, part: 'cell:1,2', text: '/uː/ food', 'on': 'food'}
  - say: 'But before k, oo often has the short vowel sound of book, as in cook, crook, look and took. Spook is an exception and keeps the long sound.'
    write: 'oo + k: often /ʊ/, as in book: cook, crook, look, took (but spook /uː/)'
    diagram_do:
      - {id: t, op: fill, part: 'cell:1,3', text: '/ʊ/ before k', 'on': 'book'}
  - say: 'Six more words keep that short sound, and are learned by heart. They are good, hood, wood, stood, foot and wool. And blood and flood have the vowel sound of cup.'
    write: 'Learn: good, hood, wood, stood, foot, wool /ʊ/; blood, flood /ʌ/'

  # ---------------------------------------------------------------- ea, ee, ei
  - section: 'ea, ee and ei'
    say: 'Next, ea and ee. They usually have the long vowel sound of seat, as in leach, team and see.'
    diagram_do:
      - {id: t, op: fill, part: 'cell:2,2', text: '/iː/ seat', 'on': 'seat'}
  - say: 'But some common ea words have the short vowel sound of bed, such as bread, head and death. And ei in weight and eight has the vowel sound of day.'
    write: 'But bread, head, death /e/; weight, eight /eɪ/'
    diagram_do:
      - {id: t, op: fill, part: 'cell:2,3', text: '/e/ bread', 'on': 'bread'}

  # ---------------------------------------------------------------- ey
  - section: 'ey'
    say: 'At the end of a word, ey usually has the vowel sound of day when it is stressed, as in they, grey, obey and prey.'
    diagram_do:
      - {id: t, op: fill, part: 'cell:3,2', text: '/eɪ/ day', 'on': 'day'}
  - say: 'When ey ends an unstressed syllable, it has a weak, short form of the vowel sound in seat, as in money, honey and valley. And key is the one to learn, with the full long vowel sound of seat.'
    write: 'Weak: money, honey, valley /i/. Learn: key /iː/'
    diagram_do:
      - {id: t, op: fill, part: 'cell:3,3', text: '/iː/ key', 'on': 'key'}

  # ---------------------------------------------------------------- ou, ow
  - section: 'ou and ow'
    say: 'Now ou and ow. They usually have the vowel sound of cow, as in loud, count and how. But ow at the end of some words has the vowel sound of go, as in low, flow, show and grow.'
    diagram_do:
      - {id: t, op: fill, part: 'cell:4,2', text: '/aʊ/ cow', 'on': 'cow'}
      - {id: t, op: fill, part: 'cell:4,3', text: '/əʊ/ low, flow', 'on': 'low'}

  # ---------------------------------------------------------------- au, aw
  - section: 'au and aw'
    say: 'Last, au, aw and augh usually have the long vowel sound of saw, as in laud, law and taught. In the British model we use, aunt and laugh are the ones to learn, with the vowel sound of car.'
    diagram_do:
      - {id: t, op: fill, part: 'cell:5,2', text: '/ɔː/ saw', 'on': 'saw'}
      - {id: t, op: fill, part: 'cell:5,3', text: '/ɑː/ aunt', 'on': 'aunt'}

  # ---------------------------------------------------------------- worked example (2017)
  - section: 'Worked example'
    say: 'Now let us use these spelling families to answer a JAMB question from 2017. Which option has the same vowel sound as the underlined letters in cowed?'
    write: 'Which option has the same vowel sound as the underlined letters in cowed?'
    point:
      - {line: 8, kind: underline, at: 'c[[ow]]ed', 'on': cowed}
  - say: 'The options are low, flow, loud and cooed.'
    write: 'A. low   B. flow   C. loud   D. cooed'
  - say: 'Cowed comes from cow, so its ow has the vowel sound of cow.'
    write: 'Cowed: /aʊ/, as in cow'
    diagram_do:
      - {id: t, op: highlight, part: 'cell:4,2', 'on': 'cow'}
  - say: 'Low ends in ow, and it is one of the words with the vowel sound of go.'
    write: 'A. low /əʊ/, as in go ✗'
    diagram_do:
      - {id: t, op: highlight, part: 'cell:4,3', 'on': 'go'}
  - say: 'Flow is on the list too, with the vowel sound of go.'
    write: 'B. flow /əʊ/, as in go ✗'
  - say: 'Loud has ou with its usual sound, the vowel sound of cow.'
    write: 'C. loud /aʊ/, as in cow ✓'
  - say: 'Cooed has oo with its usual sound, the vowel sound of food, so it does not match.'
    write: 'D. cooed /uː/, as in food ✗'
  - say: 'So the answer is C, loud.'
    write: 'Answer: C, loud ✓'
    point:
      - {line: 9, kind: circle, at: 'C. loud', 'on': answer}

  # ---------------------------------------------------------------- check yourself (2012)
  - section: 'Check yourself'
    say: 'Now it is your turn, with a question from 2012. Which option has the same vowel sound as the underlined letters in book?'
    write: 'Which option has the same vowel sound as the underlined letters in book?'
    point:
      - {line: 16, kind: underline, at: 'b[[oo]]k', 'on': book}
  - say: 'The options are cool, cook, fool and tool. Pause the lesson and decide.'
    write: 'A. cool   B. cook   C. fool   D. tool'
  - say: 'Book and cook both have oo before k, so both have the short vowel sound of book.'
    write: 'Book, cook: oo + k, /ʊ/ ✓'
    diagram_do:
      - {id: t, op: highlight, part: 'cell:1,3', 'on': 'short'}
  - say: 'Cool, fool and tool have the usual long sound of food, so they do not match.'
    write: 'Cool, fool, tool: /uː/, as in food ✗'
  - say: 'So the answer is B, cook.'
    write: 'Answer: B, cook ✓'
    point:
      - {line: 17, kind: circle, at: 'B. cook', 'on': answer}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. Oo usually has the vowel sound of food, but often that of book before k. Ea and ee usually have the vowel sound of seat. Ey usually has the vowel sound of day when stressed, but weakens at the end of an unstressed syllable. Ou and ow often have the vowel sound of cow, and ow can also have that of go. Au, aw and augh usually have the vowel sound of saw. Learn the exceptions, and always compare sounds, not letters. Now try the problems.'
    write: 'Usual sound first, then check the short list'

# ---------------------------------------------------------------- after the lesson: try it (JAMB 2011, 2018)
problems:
  - ask: 'Choose the option that has the same vowel sound as the underlined letters in l*ea*ch.  A. gear  B. cedar  C. cheer  D. death'
    answer: 'B'
    accept: ['cedar', 'B. cedar', 'B cedar']
    working:
      - 'The ea in leach has its usual sound, the long vowel sound of seat, /iː/.'
      - 'Gear and cheer have the gliding vowel sound of here, /ɪə/ (in British English the r is not pronounced). Not the same.'
      - 'Death is on the short list with bread and head: the vowel sound of bed, /e/. Not the same.'
      - 'Cedar is ce-dar: the e ends its syllable, so it is long, the vowel sound of seat, /iː/. Answer: B.'
    needs_working: false
  - ask: 'Choose the option that has the same vowel sound as the underlined letters in t*augh*t.  A. law  B. aunt  C. count  D. plateau'
    answer: 'A'
    accept: ['law', 'A. law', 'A law']
    working:
      - 'The augh in taught has its usual sound, the long vowel sound of saw, /ɔː/.'
      - 'Law has aw, with the same vowel sound of saw, /ɔː/. The same.'
      - 'Aunt is on the list to learn: the vowel sound of car, /ɑː/. Not the same.'
      - 'Count has ou, the vowel sound of cow, /aʊ/, and plateau ends with the vowel sound of go, /əʊ/. Answer: A.'
    needs_working: false
