# Diphthongs, triphthongs and weak endings (lesson 4 of 4): the eight diphthongs sorted by
# where the glide ends, each by the guide's key word; a vowel before r (moved here from lesson
# 3 for length): ar /ɑː/, or and oar /ɔː/, ir, ur, er /ɜː/; ear, eer /ɪə/; air, are /eə/; with
# heard, learn, bear, wear and carry as the ones to learn. Worked on gearbox (2017), one option
# per moment. Triphthongs in one moment. Weak endings: -our, -or, -ar, -er are schwa in an
# unstressed syllable; -age is /ɪ/. Checked on odour (2014); problems: weight (2011) and
# village (2012).
#
# SOUND: as in lesson 1. No demonstrations; key words from the guide's table; triphthongs, not
# in that table: player, fire, employer, lower, power. The voice never reads a symbol.
format_version: 1
subject: english
subtopic: 'Vowels (monophthongs, diphthongs and triphthongs)'
subtopic_id: 3f2afdfd-8d74-5e08-963d-1a98326b16c5
part: 4
title: 'Diphthongs, triphthongs and weak endings'
sources:            # what the approach rests on, for reviewers
  - 'JAMB UTME past questions in our bank (database/subtopic_brief.py), 2010 to 2018'
  - 'JAMB UTME Use of English syllabus: Oral Forms, vowels (monophthongs, diphthongs, triphthongs)'
  - 'The British (RP) vowel set as Nigerian SS oral English texts teach it (12 pure vowels, 8 diphthongs, 5 triphthongs)'
  - 'Founder review of the pilot, docs/lessons/reviews/eng_vowels_2026-11-18.md'
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is diphthongs, triphthongs and weak endings.'
    write: 'Diphthongs, triphthongs and weak endings'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'Twelve of the twenty vowel sounds are pure. The other eight glide, and are called diphthongs. You have met some already, as the names of a, o and i.'
    write: 'Twenty vowel sounds: twelve pure, eight diphthongs'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'By the end of this lesson, you will be able to name the eight diphthongs, and spot a vowel before r and a weak ending.'
    write: 'Name the 8 diphthongs; spot a vowel before r and a weak ending'

  # ---------------------------------------------------------------- diphthong
  - section: 'Diphthong'
    say: 'A diphthong is one vowel sound that glides from one vowel position to another, within one syllable. Its symbol shows where the glide starts, then where it ends.'
    write: 'Diphthong: one vowel sound that glides. Symbol: start, then end'
  - say: 'We sort the eight diphthongs by where they end. Three glide towards the vowel sound in sit. They are the vowel sounds in day, my and boy.'
    diagram:
      id: t
      kind: table
      columns: ['Ends at /ɪ/', 'Ends at /ʊ/', 'Ends at /ə/']
      rows: [['', '', ''], ['', '', ''], ['', '', '']]
      caption: 'the eight diphthongs'
      'on': 'eight'
    diagram_do:
      - {id: t, op: fill, part: 'cell:1,1', text: '/eɪ/ day', 'on': 'day'}
      - {id: t, op: fill, part: 'cell:2,1', text: '/aɪ/ my', 'on': 'my'}
      - {id: t, op: fill, part: 'cell:3,1', text: '/ɔɪ/ boy', 'on': 'boy'}
  - say: 'Two glide towards the vowel sound in book. They are the vowel sounds in go and cow.'
    diagram_do:
      - {id: t, op: fill, part: 'cell:1,2', text: '/əʊ/ go', 'on': 'go'}
      - {id: t, op: fill, part: 'cell:2,2', text: '/aʊ/ cow', 'on': 'cow'}
  - say: 'The last three glide towards schwa, the first sound of about. They are the vowel sounds in here, hair and tour.'
    diagram_do:
      - {id: t, op: fill, part: 'cell:1,3', text: '/ɪə/ here', 'on': 'here'}
      - {id: t, op: fill, part: 'cell:2,3', text: '/eə/ hair', 'on': 'hair'}
      - {id: t, op: fill, part: 'cell:3,3', text: '/ʊə/ tour', 'on': 'tour'}

  # ---------------------------------------------------------------- a vowel before r
  - section: 'A vowel before r'
    say: 'In British English, an r with no vowel after it is not pronounced, so the letters before it make one vowel sound. Ar is usually the vowel sound of car, or and oar the vowel sound of saw, and ir, ur and er the vowel sound of bird.'
    write: 'ar /ɑː/ car; or, oar /ɔː/ saw; ir, ur, er /ɜː/ bird'
  - say: 'Ear and eer usually have the vowel sound of here, as in gear and beer, and air and are that of hair, as in fair and bare.'
    write: 'ear, eer /ɪə/ here; air, are /eə/ hair'
    diagram_do:
      - {id: t, op: highlight, part: 'cell:1,3', 'on': 'here'}
      - {id: t, op: highlight, part: 'cell:2,3', 'on': 'hair'}
  - say: 'Learn these by heart. Heard and learn have the vowel sound of bird, and bear and wear that of hair. When a vowel follows the r, as in carry, the clue does not apply.'
    write: 'Learn: heard, learn /ɜː/; bear, wear /eə/; carry /æ/'

  # ---------------------------------------------------------------- worked example (2017)
  - section: 'Worked example'
    say: 'Now a JAMB question from 2017. Which option has the same vowel sound as the underlined letters in gearbox?'
    write: 'Which option has the same vowel sound as the underlined letters in gearbox?'
    point:
      - {line: 7, kind: underline, at: 'g[[ear]]box', 'on': gearbox}
  - say: 'The options are bare, feature, beer and teacher.'
    write: 'A. bare   B. feature   C. beer   D. teacher'
  - say: 'Gearbox has ear with no vowel after the r, so it has the vowel sound of here.'
    write: 'Gearbox: /ɪə/, as in here'
    diagram_do:
      - {id: t, op: highlight, part: 'cell:1,3', 'on': 'here'}
  - say: 'Bare has the vowel sound of hair. It glides to schwa too, but starts in a different place.'
    write: 'A. bare /eə/, as in hair ✗'
    diagram_do:
      - {id: t, op: highlight, part: 'cell:2,3', 'on': 'hair'}
  - say: 'Feature has ea with its usual sound, the vowel sound of seat.'
    write: 'B. feature /iː/, as in seat ✗'
  - say: 'Beer has eer, the vowel sound of here, the same as gearbox.'
    write: 'C. beer /ɪə/, as in here ✓'
  - say: 'Teacher, like feature, has the vowel sound of seat. So the answer is C, beer.'
    write: 'D. teacher /iː/, as in seat ✗'
    point:
      - {line: 8, kind: circle, at: 'C. beer', 'on': answer}

  # ---------------------------------------------------------------- triphthong
  - section: 'Triphthong'
    say: 'A triphthong is a diphthong followed by schwa, all in one syllable. There are five, in player, fire, employer, lower and power.'
    write: 'Triphthong: diphthong + /ə/: player, fire, employer, lower, power'

  # ---------------------------------------------------------------- weak endings
  - section: 'Weak endings'
    say: 'Last, weak endings. In an unstressed final syllable, the vowel letters often weaken to schwa, the first sound of about, as in odour, doctor, sugar and teacher.'
    write: 'Weak endings: odour, doctor, sugar, teacher /ə/'
  - say: 'The ending age, as in village and cottage, usually weakens to the short vowel sound of sit.'
    write: 'Weak -age: village, cottage /ɪ/, as in sit'

  # ---------------------------------------------------------------- check yourself (2014)
  - section: 'Check yourself'
    say: 'Now it is your turn, with a question from 2014. Which option has the same vowel sound as the underlined letters in odour?'
    write: 'Which option has the same vowel sound as the underlined letters in odour?'
    point:
      - {line: 17, kind: underline, at: 'od[[our]]', 'on': odour}
  - say: 'The options are flow, sugar, hold and floor. Pause the lesson and decide.'
    write: 'A. flow   B. sugar   C. hold   D. floor'
  - say: 'Odour has a weak ending, schwa, and sugar ends the same way. Flow and hold have the vowel sound of go, and floor that of saw. So the answer is B, sugar.'
    write: 'Odour, sugar /ə/ ✓   Flow, hold /əʊ/, floor /ɔː/ ✗'
    point:
      - {line: 18, kind: circle, at: 'B. sugar', 'on': answer}

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. There are eight diphthongs, each with its key word. Before an r with no vowel after it, the letters make one long or gliding sound. A triphthong is a diphthong plus schwa, and a weak ending is usually schwa. Now try the problems.'
    write: 'Diphthongs glide; vowel + r is one sound; weak endings are /ə/'

# ---------------------------------------------------------------- after the lesson: try it (JAMB 2011, 2012)
problems:
  - ask: 'Choose the option that has the same vowel sound as the underlined letters in w*ei*ght.  A. whale  B. while  C. wheat  D. writhe'
    answer: 'A'
    accept: ['whale', 'A. whale', 'A whale']
    working:
      - 'The ei in weight has the vowel sound of day, /eɪ/: weight sounds the same as wait.'
      - 'Whale has a with a final silent e, so its a is long: the vowel sound of day, /eɪ/. The same.'
      - 'While and writhe have i with a final silent e: the vowel sound of my, /aɪ/. Not the same.'
      - 'Wheat has the vowel sound of seat, /iː/. Not the same. Answer: A.'
    needs_working: false
  - ask: 'Choose the option that has the same vowel sound as the underlined letter in vill*a*ge.  A. page  B. pig  C. made  D. came'
    answer: 'B'
    accept: ['pig', 'B. pig', 'B pig']
    working:
      - 'The ending age in village is unstressed, so it weakens to the short vowel sound of sit, /ɪ/.'
      - 'Pig has the short vowel sound of sit, /ɪ/. The same.'
      - 'Page, made and came have a with a final silent e: the vowel sound of day, /eɪ/. Not the same. Answer: B.'
    needs_working: false
