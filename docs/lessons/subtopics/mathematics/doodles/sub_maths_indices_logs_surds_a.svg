<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="2 to the power 3, the base 2 marked in blue and the index 3 in purple: 2 times 2 times 2 is 8; the base is the number multiplied and the index says how many 2s">
<g data-part="base"><rect x="12" y="12" width="26" height="36" rx="3" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="25" y="42" font-family="Caveat, cursive" font-size="32" text-anchor="middle" fill="#1d1b3a">2</text></g>
<g data-part="index"><rect x="39" y="4" width="18" height="22" rx="3" fill="#7c3aed" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="21" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">3</text></g>
<g data-part="expand" data-later="1"><text x="64" y="40" font-family="Caveat, cursive" font-size="22" text-anchor="start" fill="#1d1b3a">= 2 × 2 × 2 = 8</text></g>
<g data-part="base-label" data-later="1"><rect x="4" y="54" width="42" height="20" rx="3" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="25" y="69" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">base</text><text x="52" y="69" font-family="Caveat, cursive" font-size="13" text-anchor="start" fill="#1d1b3a">the number multiplied</text></g>
<g data-part="index-label" data-later="1"><rect x="222" y="4" width="48" height="20" rx="3" fill="#7c3aed" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="246" y="19" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">index</text><path d="M222 14 L62 14 M68.0 10.0 L62 14 L68.0 18.0" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="246" y="40" font-family="Caveat, cursive" font-size="13" text-anchor="middle" fill="#1d1b3a">how many 2s</text></g>
</svg>
