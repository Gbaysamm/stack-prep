<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="2 to the power 3, the base 2 marked in blue and the index 3 in purple: 2 times 2 times 2 is 8; the base is the number multiplied and the index says how many 2s; below it, log base 2 of 8 equals 3: the log in pink, the base 2 in blue, and the answer 3 in purple is the index, since 2 to the power 3 gives 8; below that, root 12 in orange is a surd; root 12 equals root of 4 times 3, and 4 is a perfect square">
<g data-part="base"><rect x="12" y="12" width="26" height="36" rx="3" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="25" y="42" font-family="Caveat, cursive" font-size="32" text-anchor="middle" fill="#1d1b3a">2</text></g>
<g data-part="index"><rect x="39" y="4" width="18" height="22" rx="3" fill="#7c3aed" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="21" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">3</text></g>
<g data-part="expand"><text x="64" y="40" font-family="Caveat, cursive" font-size="22" text-anchor="start" fill="#1d1b3a">= 2 × 2 × 2 = 8</text></g>
<g data-part="base-label"><rect x="4" y="54" width="42" height="20" rx="3" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="25" y="69" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">base</text><text x="52" y="69" font-family="Caveat, cursive" font-size="13" text-anchor="start" fill="#1d1b3a">the number multiplied</text></g>
<g data-part="index-label"><rect x="222" y="4" width="48" height="20" rx="3" fill="#7c3aed" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="246" y="19" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">index</text><path d="M222 14 L62 14 M68.0 10.0 L62 14 L68.0 18.0" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="246" y="40" font-family="Caveat, cursive" font-size="13" text-anchor="middle" fill="#1d1b3a">how many 2s</text></g>
<g data-part="log"><rect x="8" y="82" width="42" height="30" rx="3" fill="#ec4899" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="29" y="104" font-family="Caveat, cursive" font-size="26" text-anchor="middle" fill="#1d1b3a">log</text></g>
<g data-part="log-base"><rect x="50" y="100" width="14" height="18" rx="3" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="57" y="114" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">2</text></g>
<g data-part="log-number"><text x="70" y="104" font-family="Caveat, cursive" font-size="26" text-anchor="start" fill="#1d1b3a">8 =</text></g>
<g data-part="log-answer"><rect x="104" y="82" width="22" height="30" rx="3" fill="#7c3aed" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="115" y="104" font-family="Caveat, cursive" font-size="26" text-anchor="middle" fill="#1d1b3a">3</text></g>
<g data-part="log-base-label"><rect x="36" y="124" width="42" height="18" rx="3" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="57" y="138" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">base</text></g>
<g data-part="log-answer-label"><rect x="150" y="82" width="116" height="20" rx="3" fill="#7c3aed" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="208" y="97" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">answer = the index</text><path d="M150 92 L130 94 M135.6 89.4 L130 94 L136.4 97.4" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g data-part="log-question"><rect x="172" y="108" width="140" height="20" rx="3" fill="#ec4899" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="242" y="123" font-family="Caveat, cursive" font-size="13" text-anchor="middle" fill="#1d1b3a">2 to what power gives 8?</text></g>
<g data-part="surd"><rect x="8" y="148" width="46" height="30" rx="3" fill="#f97316" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="31" y="170" font-family="Caveat, cursive" font-size="24" text-anchor="middle" fill="#1d1b3a">√12</text></g>
<g data-part="surd-label"><rect x="8" y="182" width="46" height="17" rx="3" fill="#f97316" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="31" y="195" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">surd</text></g>
<g data-part="split"><text x="66" y="170" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a">=</text><text x="86" y="170" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a">√(</text><text x="103" y="170" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a">4</text><text x="117" y="170" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">×</text><text x="134" y="170" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a">3)</text></g>
<g data-part="square-label"><rect x="64" y="182" width="112" height="17" rx="3" fill="#f97316" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="195" font-family="Caveat, cursive" font-size="13" text-anchor="middle" fill="#1d1b3a">4 is a perfect square</text></g>
</svg>
