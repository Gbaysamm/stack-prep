<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="Ade builds a tower of blocks, each block a 2: three twos make 8, so 2 to the power 3 is 8; two more twos join the tower, so five twos make 2 to the power 5, which is 32; a pink box asks how many 2s: log base 2 of 8 is 3 and log base 2 of 32 is 5; beside it the root house holds 12 under its root; 12 is written as 4 times 3 inside the house">
<g data-part="first"><rect x="36" y="166" width="34" height="24" fill="#3b82f6" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="53" y="184" font-family="Caveat, cursive" text-anchor="middle" fill="#1d1b3a" font-size="18">2</text><rect x="36" y="142" width="34" height="24" fill="#3b82f6" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="53" y="160" font-family="Caveat, cursive" text-anchor="middle" fill="#1d1b3a" font-size="18">2</text><rect x="36" y="118" width="34" height="24" fill="#3b82f6" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="53" y="136" font-family="Caveat, cursive" text-anchor="middle" fill="#1d1b3a" font-size="18">2</text></g>
<g data-part="count"><rect x="78" y="131" width="54" height="22" fill="#7c3aed" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="105" y="147" font-family="Caveat, cursive" text-anchor="middle" fill="#1d1b3a" font-size="16">2³ = 8</text></g>
<g data-part="second"><rect x="36" y="94" width="34" height="24" fill="#3b82f6" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="53" y="112" font-family="Caveat, cursive" text-anchor="middle" fill="#1d1b3a" font-size="18">2</text><rect x="36" y="70" width="34" height="24" fill="#3b82f6" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="53" y="88" font-family="Caveat, cursive" text-anchor="middle" fill="#1d1b3a" font-size="18">2</text><rect x="78" y="71" width="46" height="22" fill="#7c3aed" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="101" y="87" font-family="Caveat, cursive" text-anchor="middle" fill="#1d1b3a" font-size="16">× 2²</text></g>
<g data-part="all"><rect x="14" y="38" width="78" height="22" fill="#7c3aed" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="53" y="54" font-family="Caveat, cursive" text-anchor="middle" fill="#1d1b3a" font-size="16">2⁵ = 32</text></g>
<g data-part="logs"><text x="184" y="94" font-family="Caveat, cursive" text-anchor="middle" fill="#1d1b3a" font-size="15">how many 2s?</text><rect x="144" y="102" width="80" height="50" fill="#ec4899" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-part="log8"><text x="184" y="122" font-family="Caveat, cursive" text-anchor="middle" fill="#1d1b3a" font-size="15">log₂ 8 = 3</text></g><g data-part="log32"><text x="184" y="144" font-family="Caveat, cursive" text-anchor="middle" fill="#1d1b3a" font-size="15">log₂ 32 = 5</text></g></g>
<g data-part="house"><polygon points="236,110 278,72 318,110" fill="#f97316" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="242" y="110" width="72" height="72" fill="#f97316" fill-opacity="0.3" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="278" y="126" font-family="Caveat, cursive" text-anchor="middle" fill="#1d1b3a" font-size="13">root house</text><text x="278" y="150" font-family="Caveat, cursive" text-anchor="middle" fill="#1d1b3a" font-size="20">12</text></g>
<g data-part="four"><text x="278" y="173" font-family="Caveat, cursive" text-anchor="middle" fill="#1d1b3a" font-size="15">= 4 × 3</text></g>
</svg>
