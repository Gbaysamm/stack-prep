# Subtopic lesson: indices (meaning, laws, zero/negative/fractional indices, equations), logarithms as the inverse of indices (laws, a JAMB question), surds (simplifying, like surds, rationalising), traps and a summary.
#
# One annotated diagram grows with the lesson. Colours, one per idea: base blue, index purple, log pink, surd orange.
format_version: 1
subject: mathematics
subtopic: 'Indices, Logarithms and Surds'
subtopic_id: a33da1ac-bc18-55d5-83af-029e0acd9980
sources:
  - https://www.headteacher.ng/lesson-note-on-indices-laws-and-exponential-equations-for-sss-1/
  - https://www.headteacher.ng/deducing-logarithm-from-indices-and-standard-form-and-definition-of-logarithm-for-ss-1/
  - https://lessonotes.com/v3/senior-secondary-school-1/lesson-notes-for-senior-secondary-1-3rd-term-week-2-further-mathematics-topic-is-surds.html
  - https://edupadi.com/classroom/l/rationalizing-surds
  - https://ancourage.academy/articles/a-maths-indices-surds-logarithms-exponentials-singapore
moments:
  # ---------------------------------------------------------------- Indices
  - section: 'Indices'
    say: 'Is two to the power three, times two to the power two, two to the power six or two to the power five? Many students say six. Let''s see why it is five.'
    write: '$2^{3} \times 2^{2} = 2^{?}$'
    doodle: {name: 'custom:sub_maths_indices_logs_surds_a', id: d, caption: 'base and index', size: scene}
  - say: 'In two to the power three, 2 is the base, the number multiplied. 3 is the index, how many 2s we multiply. So it is 2 times 2 times 2, which is 8.'
    write: '$2^{3} = 2 \times 2 \times 2 = 8$'
    doodle_do:
      - {id: d, op: pulse, part: base, 'on': 'base'}
      - {id: d, op: pulse, part: index, 'on': 'index'}
  - section: 'Law 1: multiplying powers'
    say: 'Now multiply two to the power three by two to the power two. Write out every 2. That is three 2s, times two more 2s.'
    write: '$2^{3} \times 2^{2} = (2 \times 2 \times 2) \times (2 \times 2)$'
  - say: 'Count them. Three plus two is five 2s, so the answer is two to the power five, which is 32. When we multiply powers of the same base, we add the indices.'
    write: '$= 2^{3+2} = 2^{5} = 32 \quad [a^{m} \times a^{n} = a^{m+n}]$'
    point:
      - {line: 3, kind: circle, at: '3+2', text: 'add the indices', 'on': 'add'}
  - section: 'Law 2: dividing powers'
    say: 'When we divide, the 2s below cancel the same number of 2s on top. Five minus two leaves three. So when we divide powers of the same base, we subtract the indices.'
    write: '$\dfrac{2^{5}}{2^{2}} = 2^{5-2} = 2^{3} \quad [a^{m} \div a^{n} = a^{m-n}]$'
  - section: 'Law 3: power of a power'
    say: 'Two to the power three, all squared, is two to the power three, twice over. That is six 2s. So for a power of a power, we multiply the indices.'
    write: '$(2^{3})^{2} = 2^{3 \times 2} = 2^{6} \quad [(a^{m})^{n} = a^{mn}]$'
  - section: 'Zero, negative and fractional indices'
    say: 'Divide two to the power three by itself. By law 2 the index is three minus three, which is nought. But 8 over 8 is 1. So anything to the power nought is 1.'
    write: '$\dfrac{2^{3}}{2^{3}} = 2^{0}$ and $\dfrac{8}{8} = 1$, so $a^{0} = 1$'
  - say: 'A negative index means one over. Two to the power minus three is one over two to the power three, which is one over 8.'
    write: '$2^{-3} = \dfrac{1}{2^{3}} = \dfrac{1}{8} \quad [a^{-n} = \dfrac{1}{a^{n}}]$'
  - say: 'A fractional index means a root. In two over three, the 3 below is the root and the 2 on top is the power. Cube root of 8 is 2, and 2 squared is 4.'
    write: '$8^{\frac{2}{3}} = (\sqrt[3]{8})^{2} = 2^{2} = 4$'
  - section: 'Equations in indices'
    say: 'A typical JAMB question. Solve 9 to the power x plus 1 equals 27 to the power x. The first step is to write both sides with the same base.'
    write: 'Solve $9^{x+1} = 27^{x}$'
  - say: '9 is three squared, and 27 is three cubed. So both sides can be written in base 3.'
    write: '$(3^{2})^{x+1} = (3^{3})^{x}$'
  - say: 'By law 3, multiply the indices. 2 times x plus 1 is 2x plus 2, and 3 times x is 3x.'
    write: '$3^{2x+2} = 3^{3x}$'
  - say: 'The bases are now the same, so the indices must be equal. We equate indices.'
    write: '$2x + 2 = 3x$'
  - say: 'Subtract 2x from both sides. 3x minus 2x is x, so x is 2. Check it. 9 cubed is 729, and 27 squared is also 729.'
    write: '$\therefore x = 2 \quad (9^{3} = 27^{2} = 729\ \checkmark)$'
  - section: 'Trap: different bases'
    say: 'The laws need the same base. Two to the power three times three to the power two is not six to the power five. It is 8 times 9, which is 72.'
    write: '$2^{3} \times 3^{2} = 8 \times 9 = 72$, not $6^{5}$'
    point:
      - {line: 14, kind: strike, at: '65', 'on': 'not'}
  # ---------------------------------------------------------------- Logarithms
  - section: 'Logarithms'
    say: 'A logarithm is the inverse of an index. It asks, the base to what power gives this number? 2 cubed is 8, so log base 2 of 8 is 3.'
    write: '$2^{3} = 8$, so $\log_{2}8 = 3$'
    doodle_do:
      - {id: d, op: stage, stage: 'custom:sub_maths_indices_logs_surds_a2', 'on': 'inverse'}
    point:
      - {line: 15, kind: travel, at: 'log28=[[3]]', from: {doodle: d, part: log-answer}, text: 'the index'}
  - say: 'In general, log base a of N equals k means a to the power k equals N. So log base a of a is 1, and log base a of 1 is nought.'
    write: 'Recall: $\log_{a}N = k$ means $a^{k} = N$'
    doodle_do:
      - {id: d, op: pulse, part: log-answer-label, 'on': 'means'}
  - section: 'Laws of logarithms'
    say: 'A log is an index, so law 1 becomes the product law. The log of a product is the sum of the logs. Log base 2 of 8 times 4 is 3 plus 2.'
    write: '$\log_{2}(8 \times 4) = \log_{2}8 + \log_{2}4 = 3 + 2 = 5$'
    point:
      - {line: 17, kind: highlight, at: '3+2=5', 'on': 'sum'}
  - say: 'In the same way, the log of a quotient is the log of the top minus the log of the bottom. And a power inside a log comes down in front.'
    write: '$\log_{a}\dfrac{M}{N} = \log_{a}M - \log_{a}N, \quad \log_{a}M^{n} = n\log_{a}M$'
  - section: 'JAMB question: simplify without tables'
    say: 'A real JAMB question. Log base 2 of 6 minus log base 2 of 3, over log base 2 of 8 minus 2 log base 2 of a half. Work top and bottom separately.'
    write: 'Simplify $\dfrac{\log_{2}6 - \log_{2}3}{\log_{2}8 - 2\log_{2}\frac{1}{2}}$'
  - say: 'The top first. By the quotient law, it is log base 2 of 6 over 3, which is log base 2 of 2. That is 1, since 2 to the power 1 is 2.'
    write: 'Top: $\log_{2}\dfrac{6}{3} = \log_{2}2 = 1$'
  - say: 'Now the bottom. 2 cubed is 8, so log base 2 of 8 is 3. A half is 2 to the power minus 1, so log base 2 of a half is minus 1.'
    write: '$\log_{2}8 = 3, \quad \log_{2}\tfrac{1}{2} = -1$ (since $2^{-1} = \tfrac{1}{2}$)'
  - say: 'So the bottom is 3 minus 2 times minus 1. 2 times minus 1 is minus 2, and 3 minus minus 2 is 3 plus 2, which is 5.'
    write: 'Bottom: $3 - 2(-1) = 3 + 2 = 5$'
  - say: 'The top is 1 and the bottom is 5. So the answer is one over 5.'
    write: '$\therefore \dfrac{1}{5}$'
  - section: 'Trap: the log of a sum'
    say: 'The product law is for a product, not a sum. Log base 2 of 8 plus 8 is log base 2 of 16, which is 4. It is not 3 plus 3.'
    write: '$\log_{2}(8 + 8) = \log_{2}16 = 4$, not $\log_{2}8 + \log_{2}8 = 6$'
  # ---------------------------------------------------------------- Surds
  - section: 'Surds'
    say: 'A surd is a root that is not a whole number. Root 9 is exactly 3, so it is not a surd. Root 12 is about 3.46 and never ends, so it is a surd.'
    write: '$\sqrt{9} = 3$, but $\sqrt{12} \approx 3.46$ is a surd'
    doodle_do:
      - {id: d, op: stage, stage: 'custom:sub_maths_indices_logs_surds_a3', 'on': 'surd'}
  - say: 'The law of surds. The root of a product equals the root of each factor, multiplied together.'
    write: '$\sqrt{a \times b} = \sqrt{a} \times \sqrt{b}$'
  - section: 'Simplifying a surd'
    say: 'To simplify root 12, find the biggest perfect square that divides 12. That is 4, because 4 times 3 is 12.'
    write: '$\sqrt{12} = \sqrt{4 \times 3}$'
    doodle_do:
      - {id: d, op: stage, stage: 'custom:sub_maths_indices_logs_surds_a4', 'on': 'perfect'}
    point:
      - {line: 27, kind: highlight, at: '4×3', to: {doodle: d, part: split}}
  - say: 'By the law of surds, this is root 4 times root 3. Root 4 is 2, so the 4 comes out as 2. The 3 stays under the root.'
    write: '$= \sqrt{4} \times \sqrt{3} = 2\sqrt{3}$'
    doodle_do:
      - {id: d, op: stage, stage: 'custom:sub_maths_indices_logs_surds_a5', 'on': 'comes'}
    point:
      - {line: 28, kind: highlight, at: '=23', to: {doodle: d, part: result}}
  - say: 'Surds add only when the number under the root is the same, just as 2x plus 5x is 7x. So 2 root 3 plus 5 root 3 is 7 root 3.'
    write: '$2\sqrt{3} + 5\sqrt{3} = 7\sqrt{3}$'
  - section: 'Trap: the root of a sum'
    say: 'The law of surds is for a product, not a sum. Root of 9 plus 16 is root 25, which is 5. Root 9 plus root 16 is 7.'
    write: '$\sqrt{9 + 16} = \sqrt{25} = 5$, not $\sqrt{9} + \sqrt{16} = 7$'
  - section: 'Rationalising the denominator'
    say: 'To rationalise means to clear the surd from the bottom of a fraction. The bottom is root 3 minus root 2, so multiply by its conjugate, root 3 plus root 2.'
    write: 'Rationalise $\dfrac{1}{\sqrt{3} - \sqrt{2}}$'
  - say: 'Multiply the top and the bottom by the same thing, so the value of the fraction does not change. Forgetting the top is a common slip.'
    write: '$= \dfrac{1 \times (\sqrt{3} + \sqrt{2})}{(\sqrt{3} - \sqrt{2})(\sqrt{3} + \sqrt{2})}$'
  - say: 'The bottom is a difference of two squares. Root 3 squared is 3, and root 2 squared is 2, so the roots disappear. 3 minus 2 is 1.'
    write: 'Bottom: $(\sqrt{3})^{2} - (\sqrt{2})^{2} = 3 - 2 = 1$'
  - say: 'Anything over 1 is itself, so the answer is root 3 plus root 2. Check with decimals. 1 over 0.318 is about 3.15, and 1.732 plus 1.414 is about 3.15 too.'
    write: '$\therefore \dfrac{1}{\sqrt{3} - \sqrt{2}} = \sqrt{3} + \sqrt{2} \ \checkmark$'
  - section: 'Remember'
    say: 'Remember. Multiplying the same base adds the indices. A log is an index, so the log of a product is a sum of logs. A root splits over a product, not a sum.'
    write: '$a^{m} \times a^{n} = a^{m+n}, \quad \log_{a}MN = \log_{a}M + \log_{a}N, \quad \sqrt{ab} = \sqrt{a}\sqrt{b}$'
