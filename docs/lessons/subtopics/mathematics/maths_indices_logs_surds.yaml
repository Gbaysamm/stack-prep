moments:
  # ---------------------------------------------------------------- Welcome, introduction, objectives
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is indices, logarithms and surds.'
    write: 'Indices, Logarithms and Surds'
  - section: 'Introduction'
    say: 'This topic is about powers and roots. Indices are powers, logarithms undo powers, and surds are roots that do not come out whole.'
    write: 'Indices are powers; logs undo powers; surds are roots'
  - say: 'JAMB asks about it nearly every year. You may be asked to simplify logs without tables, solve an equation in indices, or rationalise a surd.'
    write: 'In JAMB: simplify, solve, rationalise'
  - section: 'Objectives'
    say: 'By the end of this lesson you will be able to do three things. One, use the laws of indices and solve equations in indices.'
    write: '1. Use the laws of indices; solve equations in indices'
  - say: 'Two, change between indices and logarithms, and use the laws of logarithms.'
    write: '2. Change indices to logs; use the laws of logs'
  - say: 'Three, simplify surds, and rationalise the denominator of a fraction.'
    write: '3. Simplify surds; rationalise the denominator'
  # ---------------------------------------------------------------- Indices
  - section: 'Indices'
    say: 'An index, or power, tells us how many times a number is multiplied by itself. The number being multiplied is called the base.'
    write: 'Index: $a^{n} = a \times a \times \cdots \times a$, $n$ times'
    doodle: {name: 'custom:sub_maths_indices_logs_surds_a', id: d, caption: 'base and index', size: scene, 'on': 'base'}
  - say: 'For example, in two to the power three, 2 is the base and 3 is the index. So it is 2 times 2 times 2, which is 8.'
    write: '$2^{3} = 2 \times 2 \times 2 = 8$'
    doodle_do:
      - {id: d, op: pulse, part: base, 'on': 'base'}
      - {id: d, op: pulse, part: index, 'on': 'index'}
  - section: 'Law 1: multiplying powers'
    say: 'Multiply two to the power three by two to the power two. Write out every 2. That is three 2s times two more 2s.'
    write: '$2^{3} \times 2^{2} = (2 \times 2 \times 2) \times (2 \times 2)$'
  - say: 'Count them. There are five 2s, so it is two to the power five, which is 32, not two to the power six. When we multiply powers of the same base, we add the indices.'
    write: '$= 2^{3+2} = 2^{5} = 32 \quad [a^{m} \times a^{n} = a^{m+n}]$'
    point:
      - {line: 9, kind: circle, at: '3+2', text: 'add the indices', 'on': 'add'}
  - section: 'Law 2: dividing powers'
    say: 'When we divide, the 2s at the bottom cancel the same number of 2s on top. Five minus two leaves three. So when we divide powers of the same base, we subtract the indices.'
    write: '$\dfrac{2^{5}}{2^{2}} = 2^{5-2} = 2^{3} \quad [a^{m} \div a^{n} = a^{m-n}]$'
  - section: 'Law 3: power of a power'
    say: 'Two to the power three, all squared, is two to the power three, twice over. That is six 2s. So for a power of a power, we multiply the indices.'
    write: '$(2^{3})^{2} = 2^{3 \times 2} = 2^{6} \quad [(a^{m})^{n} = a^{mn}]$'
  - section: 'Zero, negative and fractional indices'
    say: 'Divide two to the power three by itself. By law 2 the index is three minus three, which is nought. But 8 over 8 is 1. So anything to the power nought is 1.'
    write: '$\dfrac{2^{3}}{2^{3}} = 2^{0}$ and $\dfrac{8}{8} = 1$, so $a^{0} = 1$'
  - say: 'A negative index means one over the positive power. Two to the power minus three is one over two to the power three, which is one over 8.'
    write: '$2^{-3} = \dfrac{1}{2^{3}} = \dfrac{1}{8} \quad [a^{-n} = \dfrac{1}{a^{n}}]$'
  - say: 'A fractional index means a root. In two over three, the 3 below is the root and the 2 on top is the power. The cube root of 8 is 2, and 2 squared is 4.'
    write: '$8^{\frac{2}{3}} = (\sqrt[3]{8})^{2} = 2^{2} = 4$'
  - section: 'Equations in indices'
    say: 'Here is a typical JAMB question. Solve 9 to the power x plus 1 equals 27 to the power x. The first step is to write both sides with the same base.'
    write: 'Solve $9^{x+1} = 27^{x}$'
  - say: '9 is three squared, and 27 is three cubed. So both sides can be written in base 3.'
    write: '$(3^{2})^{x+1} = (3^{3})^{x}$'
  - say: 'By law 3, multiply the indices. 2 times, x plus 1, is 2x plus 2, and 3 times x is 3x.'
    write: '$3^{2x+2} = 3^{3x}$'
  - say: 'The bases are now the same, so the indices must be equal. We equate indices.'
    write: '$2x + 2 = 3x$'
  - say: 'Subtract 2x from both sides. 3x minus 2x is x, so x is 2. Check it. 9 cubed is 729, and 27 squared is also 729.'
    write: '$\therefore x = 2 \quad (9^{3} = 27^{2} = 729\ \checkmark)$'
  # ---------------------------------------------------------------- Logarithms
  - section: 'Logarithms'
    say: 'A logarithm is the inverse of an index. Log base a of N equals k means that a to the power k equals N. So a log is an index.'
    write: 'Logarithm: $\log_{a}N = k$ means $a^{k} = N$'
  - say: 'For example, 2 to the power 3 is 8, so log base 2 of 8 is 3. The base stays the base, and the answer is the index.'
    write: '$2^{3} = 8$, so $\log_{2}8 = 3$'
    doodle_do:
      - {id: d, op: stage, stage: 'custom:sub_maths_indices_logs_surds_a2', 'on': 'example'}
      - {id: d, op: pulse, part: log-answer, 'on': 'answer'}
    point:
      - {line: 21, kind: circle, at: 'log28=[[3]]', text: 'the index', 'on': 'answer'}
  - say: 'Two results follow. Log base a of a is 1, because a to the power 1 is a. Log base a of 1 is nought, because a to the power nought is 1.'
    write: '$\log_{a}a = 1, \quad \log_{a}1 = 0$'
  - section: 'Laws of logarithms'
    say: 'Because a log is an index, law 1 of indices becomes the product law. The log of a product is the sum of the logs.'
    write: '$\log_{a}(M \times N) = \log_{a}M + \log_{a}N$'
  - say: 'For example, 32 is 8 times 4. So log base 2 of 32 is log base 2 of 8 plus log base 2 of 4.'
    write: '$\log_{2}32 = \log_{2}8 + \log_{2}4$'
  - say: 'That is 3 plus 2, which is 5. Check it. 2 to the power 5 is 32.'
    write: '$= 3 + 2 = 5 \quad (2^{5} = 32\ \checkmark)$'
    doodle_do:
      - {id: d, op: pulse, part: log-answer-label, 'on': 'Check'}
  - say: 'From law 2 of indices, the log of a quotient is the log of the top minus the log of the bottom.'
    write: '$\log_{a}\dfrac{M}{N} = \log_{a}M - \log_{a}N$'
  - say: 'From law 3, a power inside a log comes down in front as a multiplier.'
    write: '$\log_{a}M^{n} = n\log_{a}M$'
  # ---------------------------------------------------------------- Surds
  - section: 'Surds'
    say: 'A surd is a root that is not a whole number, so its decimal never ends and never repeats. We keep it as a root and simplify it.'
    write: 'Surd: a root that is not a whole number'
    doodle_do:
      - {id: d, op: stage, stage: 'custom:sub_maths_indices_logs_surds_a3', 'on': 'surd'}
  - say: 'For example, root 9 is exactly 3, so it is not a surd. Root 12 is about 3.46, so root 12 is a surd.'
    write: '$\sqrt{9} = 3$, but $\sqrt{12} \approx 3.46$ is a surd'
    doodle_do:
      - {id: d, op: pulse, part: surd, 'on': 'surd', 'on_nth': 2}
  - say: 'The law of surds says that the root of a product equals the root of each factor, multiplied together.'
    write: '$\sqrt{a \times b} = \sqrt{a} \times \sqrt{b}$'
  - section: 'Simplifying surds'
    say: 'To simplify root 12, find the biggest perfect square that divides 12. That is 4, because 4 times 3 is 12.'
    write: '$\sqrt{12} = \sqrt{4 \times 3}$'
    doodle_do:
      - {id: d, op: stage, stage: 'custom:sub_maths_indices_logs_surds_a4', 'on': 'perfect'}
    point:
      - {line: 31, kind: highlight, at: '4×3', 'on': 'times'}
  - say: 'By the law of surds, this is root 4 times root 3. Root 4 is 2, so the 4 comes out as 2. The 3 stays under the root.'
    write: '$= \sqrt{4} \times \sqrt{3} = 2\sqrt{3}$'
    doodle_do:
      - {id: d, op: stage, stage: 'custom:sub_maths_indices_logs_surds_a5', 'on': 'comes'}
  - say: 'Surds add only when the number under the root is the same, just as 2x plus 5x is 7x. So 2 root 3 plus 5 root 3 is 7 root 3.'
    write: '$2\sqrt{3} + 5\sqrt{3} = 7\sqrt{3}$'
  - section: 'Rationalising the denominator'
    say: 'To rationalise means to clear the surd from the bottom of a fraction. For a bottom like root 3 minus root 2, we multiply by its conjugate, root 3 plus root 2.'
    write: 'Rationalise: clear the surd from the denominator'
  - say: 'For example, let us rationalise one over, root 3 minus root 2.'
    write: 'Rationalise $\dfrac{1}{\sqrt{3} - \sqrt{2}}$'
  - say: 'Multiply the top and the bottom by root 3 plus root 2, so the value of the fraction does not change. Forgetting the top is a common slip.'
    write: 'Multiply top and bottom by $\sqrt{3} + \sqrt{2}$'
  - say: 'The top is 1 times, root 3 plus root 2, which is just root 3 plus root 2.'
    write: 'Top: $1 \times (\sqrt{3} + \sqrt{2}) = \sqrt{3} + \sqrt{2}$'
  - say: 'The bottom is a difference of two squares. Root 3 squared is 3, and root 2 squared is 2, so the roots disappear. 3 minus 2 is 1.'
    write: 'Bottom: $(\sqrt{3})^{2} - (\sqrt{2})^{2} = 3 - 2 = 1$'
  - say: 'Anything over 1 is itself, so the answer is root 3 plus root 2. Check it with decimals. 1 over 0.318 is about 3.15, and 1.732 plus 1.414 is about 3.15 too.'
    write: '$\therefore \dfrac{1}{\sqrt{3} - \sqrt{2}} = \sqrt{3} + \sqrt{2}\ \checkmark$'
  # ---------------------------------------------------------------- Comparison
  - section: 'Comparison'
    say: 'Here are the three product laws side by side. For indices, multiplying powers of the same base adds the indices.'
    write: 'Indices: $a^{m} \times a^{n} = a^{m+n}$'
    doodle_do:
      - {id: d, op: pulse, part: index, 'on': 'indices'}
  - say: 'For logs, the log of a product is the sum of the logs.'
    write: 'Logs: $\log_{a}MN = \log_{a}M + \log_{a}N$'
    doodle_do:
      - {id: d, op: pulse, part: log, 'on': 'logs'}
  - say: 'For surds, the root of a product is the root of each factor, multiplied.'
    write: 'Surds: $\sqrt{ab} = \sqrt{a} \times \sqrt{b}$'
    doodle_do:
      - {id: d, op: pulse, part: surd, 'on': 'surds'}
  - say: 'All three laws work for a product. The laws of indices and logs also need the same base. None of them works for a sum.'
    write: 'A product and the same base, never a sum'
  # ---------------------------------------------------------------- JAMB example and traps
  - section: 'JAMB example'
    say: 'Here is a real JAMB question. Simplify log base 2 of 6 minus log base 2 of 3, over log base 2 of 8 minus 2 log base 2 of a half. Work out the top and the bottom separately.'
    write: 'Simplify $\dfrac{\log_{2}6 - \log_{2}3}{\log_{2}8 - 2\log_{2}\frac{1}{2}}$'
  - say: 'Take the top first. By the quotient law, it is log base 2 of 6 over 3, which is log base 2 of 2. That is 1, since 2 to the power 1 is 2.'
    write: 'Top: $\log_{2}\dfrac{6}{3} = \log_{2}2 = 1$'
  - say: 'Now the bottom. 2 cubed is 8, so log base 2 of 8 is 3. A half is 2 to the power minus 1, so log base 2 of a half is minus 1.'
    write: '$\log_{2}8 = 3, \quad \log_{2}\tfrac{1}{2} = -1$'
  - say: 'So the bottom is 3 minus 2 times minus 1. 2 times minus 1 is minus 2, and 3 minus minus 2 is 3 plus 2, which is 5.'
    write: 'Bottom: $3 - 2(-1) = 3 + 2 = 5$'
  - say: 'The top is 1 and the bottom is 5. So the answer is one over 5, which is option A.'
    write: '$\therefore \dfrac{1}{5}$ (option A)'
  - section: 'JAMB traps'
    say: 'Option D, log base 2 of 3 over log base 2 of 7, comes from subtracting the numbers inside the logs. But log 6 minus log 3 is the log of 6 over 3, not 6 minus 3.'
    write: 'D: $\log_{2}6 - \log_{2}3 \ne \log_{2}(6 - 3)$'
  - say: 'Option B, a half, comes from taking 2 log base 2 of a half as 2 times a half, which is 1. But log base 2 of a half is minus 1.'
    write: 'B: $2\log_{2}\tfrac{1}{2} = 2 \times (-1) = -2$, not $1$'
  - say: 'Option C is negative. But the top is 1 and the bottom is 5, both positive, so the answer cannot be negative.'
    write: 'C: $\dfrac{1}{5}$ is positive, so not $-\tfrac{1}{2}$'
  - say: 'Now some other traps. The laws need the same base. Two to the power three times three to the power two is not six to the power five. It is 8 times 9, which is 72.'
    write: '$2^{3} \times 3^{2} = 8 \times 9 = 72$, not $6^{5}$'
    point:
      - {line: 52, kind: strike, at: '65', 'on': 'not'}
  - say: 'Adding powers is not multiplying them. Two to the power three plus two to the power two is 8 plus 4, which is 12, not two to the power five.'
    write: '$2^{3} + 2^{2} = 8 + 4 = 12$, not $2^{5}$'
  - say: 'The product law is not for a sum. Log base 2 of, 8 plus 8, is log base 2 of 16, which is 4. It is not 3 plus 3.'
    write: '$\log_{2}(8 + 8) = \log_{2}16 = 4$, not $6$'
  - say: 'The law of surds is not for a sum either. The root of, 9 plus 16, is root 25, which is 5. But root 9 plus root 16 is 7.'
    write: '$\sqrt{9 + 16} = \sqrt{25} = 5$, not $3 + 4 = 7$'
  # ---------------------------------------------------------------- Check yourself
  - section: 'Check yourself'
    say: 'Now check yourself. Simplify root 50 minus root 18.'
    write: 'Simplify $\sqrt{50} - \sqrt{18}$'
  - say: 'Pause the lesson and try it. Look for the biggest perfect square in each number.'
    write: 'Hint: a perfect square in 50, and in 18'
    doodle_do:
      - {id: d, op: pulse, part: square-label, 'on': 'perfect'}
  - say: '50 is 25 times 2, and root 25 is 5. So root 50 is 5 root 2.'
    write: '$\sqrt{50} = \sqrt{25 \times 2} = 5\sqrt{2}$'
  - say: '18 is 9 times 2, and root 9 is 3. So root 18 is 3 root 2.'
    write: '$\sqrt{18} = \sqrt{9 \times 2} = 3\sqrt{2}$'
  - say: 'Both are surds in root 2, so we subtract them just as we subtract like terms. 5 root 2 minus 3 root 2 is 2 root 2.'
    write: '$\therefore 5\sqrt{2} - 3\sqrt{2} = 2\sqrt{2}$'
  # ---------------------------------------------------------------- Recap
  - section: 'Recap'
    say: 'Let''s recap. One, multiplying the same base adds the indices, dividing subtracts them, and a power of a power multiplies them. Once the bases match, equate the indices.'
    write: '1. Add, subtract, multiply indices; equate them'
  - say: 'Two, a log is an index. Log base a of N equals k means a to the power k equals N, and the log of a product is the sum of the logs.'
    write: '2. $\log_{a}N = k$ means $a^{k} = N$'
  - say: 'Three, a perfect square comes out of a root, and we rationalise by multiplying top and bottom by the conjugate.'
    write: '3. Take out perfect squares; use the conjugate'
  - say: 'That''s the lesson. Next, try new questions on it.'
    write: 'Next: try new questions'
