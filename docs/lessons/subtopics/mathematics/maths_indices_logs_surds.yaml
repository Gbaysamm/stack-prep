# Subtopic lesson: indices (laws, zero/negative/fractional indices, equations), logarithms as the inverse of indices (laws), surds (simplifying, like surds, rationalising); laws side by side, a JAMB question with its traps, check yourself, recap.
#
# Built to docs/lessons/subtopic-lesson-guide.md. One annotated diagram grows with the lesson.
# Colours, one per idea: base blue, index purple, log pink, surd orange.
format_version: 1
subject: mathematics
subtopic: 'Indices, Logarithms and Surds'
subtopic_id: a33da1ac-bc18-55d5-83af-029e0acd9980
sources:
