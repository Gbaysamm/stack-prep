# Zero, negative and fractional indices (lesson 2 of 7): each meaning found from the laws of lesson 1 (2³ ÷ 2³, 2² ÷ 2⁵, 9^½ × 9^½), stated, then used on a worked example; a negative and fractional index together.
format_version: 1
subject: mathematics
subtopic: 'Indices, Logarithms and Surds'
subtopic_id: a33da1ac-bc18-55d5-83af-029e0acd9980
part: 2
title: 'Zero, negative and fractional indices'
sources:            # pages consulted for the approach, for reviewers
  - https://www.headteacher.ng/lesson-note-on-indices-laws-and-exponential-equations-for-sss-1/
  - https://ancourage.academy/articles/a-maths-indices-surds-logarithms-exponentials-singapore
  - https://syllabus.ng/jamb/mathematics
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is zero, negative and fractional indices.'
    write: 'Zero, negative and fractional indices'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson, you learnt the three laws of indices. So far, every index was a positive whole number, like the 3 in two to the power three.'
    write: 'So far: indices that are positive whole numbers'
    doodle: {name: 'custom:sub_maths_indices_logs_surds_a', id: d, caption: 'base and index', size: scene, 'on': 'index'}
    doodle_do:
      - {id: d, op: show, part: index-label, 'on': 'the 3'}
  - say: 'But an index can also be nought, negative or a fraction. The laws tell us what each one means.'
    write: 'An index can be nought, negative or a fraction'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn what a zero, a negative and a fractional index mean, and how to work them out by hand.'
    write: 'Today: what zero, negative and fractional indices mean'

  # ---------------------------------------------------------------- zero index
  - section: 'Zero index'
    say: 'Let us start with a zero index. Divide two to the power three by itself. By the second law, we subtract the indices. Three minus three is nought, so we get two to the power nought.'
    write: '$\dfrac{2^{3}}{2^{3}} = 2^{3-3} = 2^{0}$'
  - say: 'But two to the power three is 8, and 8 divided by 8 is 1. So two to the power nought must be 1.'
    write: '$\dfrac{8}{8} = 1$, so $2^{0} = 1$'
  - say: 'The same is true for any base that is not nought. Any number to the power nought is 1.'
    write: 'Zero index: $a^{0} = 1$'
  - say: 'For example, five to the power nought is 1, x to the power nought is 1, and even 1000 to the power nought is 1.'
    write: '$5^{0} = 1, \quad x^{0} = 1, \quad 1000^{0} = 1$'

  # ---------------------------------------------------------------- negative index
  - section: 'Negative index'
    say: 'Now a negative index. Divide two to the power two by two to the power five. By the second law, two minus five is minus three, so we get two to the power minus three.'
    write: '$\dfrac{2^{2}}{2^{5}} = 2^{2-5} = 2^{-3}$'
  - say: 'Now write it out. The two 2s on top cancel two of the five 2s at the bottom. That leaves 1 on top and three 2s at the bottom, which is one over two to the power three.'
    write: '$\dfrac{2 \times 2}{2 \times 2 \times 2 \times 2 \times 2} = \dfrac{1}{2^{3}}$'
  - say: 'So two to the power minus three is one over two to the power three, which is one over 8. A negative index means one over the positive power.'
    write: 'Negative index: $a^{-n} = \dfrac{1}{a^{n}}$, so $2^{-3} = \dfrac{1}{8}$'
  - say: 'Let us use it. Work out three to the power minus two. The minus sign tells us to take one over the positive power. Three squared is 9, so the answer is one over 9.'
    write: '$3^{-2} = \dfrac{1}{3^{2}} = \dfrac{1}{9}$'
  - say: 'Note that a negative index does not make the number negative. Three to the power minus two is one ninth, not minus 9.'
    write: '$3^{-2} = \dfrac{1}{9}$, not $-9$'

  # ---------------------------------------------------------------- fractional index
  - section: 'Fractional index'
    say: 'Now a fractional index. Take 9 to the power a half, times 9 to the power a half. By the first law, we add the indices. A half plus a half is 1, so the answer is 9 to the power 1, which is 9.'
    write: '$9^{\frac{1}{2}} \times 9^{\frac{1}{2}} = 9^{\frac{1}{2}+\frac{1}{2}} = 9^{1} = 9$'
  - say: 'So 9 to the power a half is a number that, multiplied by itself, gives 9. That is the square root of 9, which is 3. So the power a half means the square root.'
    write: '$9^{\frac{1}{2}} = \sqrt{9} = 3$'
  - say: 'In the same way, the power a third means the cube root. 8 to the power a third is the cube root of 8, which is 2, because 2 times 2 times 2 is 8.'
    write: '$8^{\frac{1}{3}} = \sqrt[3]{8} = 2$'
  - say: 'When the top of the fraction is not 1, the top is a power. The bottom of the fraction is the root, and the top is the power.'
    write: 'Fractional index: $a^{\frac{m}{n}} = (\sqrt[n]{a})^{m}$'
  - say: 'Let us work out 8 to the power two over three. The 3 at the bottom means the cube root, and the cube root of 8 is 2. The 2 on top means square it, and 2 squared is 4.'
    write: '$8^{\frac{2}{3}} = (\sqrt[3]{8})^{2} = 2^{2} = 4$'
  - say: 'Taking the root first keeps the numbers small, so it is easier to do by hand.'
    write: 'Take the root first: the numbers stay small'

  # ---------------------------------------------------------------- both together
  - section: 'Worked example'
    say: 'Here is one that uses both ideas. Evaluate 27 to the power minus two over three. The minus sign means one over. The 3 means the cube root, and the 2 means square it.'
    write: 'Evaluate $27^{-\frac{2}{3}}$'
  - say: 'The cube root of 27 is 3, because 3 times 3 times 3 is 27. Then 3 squared is 9. The minus sign puts it under 1, so the answer is one over 9.'
    write: '$= \dfrac{1}{(\sqrt[3]{27})^{2}} = \dfrac{1}{3^{2}} = \dfrac{1}{9}$'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Evaluate 16 to the power three over four. Pause the lesson and work it out.'
    write: 'Evaluate $16^{\frac{3}{4}}$'
  - say: 'The 4 at the bottom means the fourth root. The fourth root of 16 is 2, because 2 times 2 times 2 times 2 is 16. Then the 3 on top means cube it, and 2 cubed is 8.'
    write: '$(\sqrt[4]{16})^{3} = 2^{3} = 8$'

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. Any number to the power nought is 1, and a negative index means one over the positive power.'
    write: '1. $a^{0} = 1$, and $a^{-n} = \dfrac{1}{a^{n}}$'
  - say: 'In a fractional index, the bottom is the root and the top is the power. In the next lesson, we use all of this to solve equations in indices. Now try the problem.'
    write: '2. Fractional index: the bottom is the root, the top is the power'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Evaluate $4^{-\frac{3}{2}}$.'
    answer: '1/8'
    accept: ['⅛', '0.125', '1 / 8', 'one eighth']
    working:
      - 'The minus sign means one over: 4^(-3/2) = 1 ÷ 4^(3/2).'
      - 'The 2 at the bottom means the square root: √4 = 2.'
      - 'The 3 on top means cube it: 2³ = 8.'
      - 'So 4^(-3/2) = 1/8.'
    needs_working: true
