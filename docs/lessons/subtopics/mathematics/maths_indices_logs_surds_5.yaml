# The laws of logarithms (lesson 5 of 7): the product, quotient and power laws, each from its law of indices with a worked example and a check; a real JAMB question simplified without tables, and the wrong options explained.
format_version: 1
subject: mathematics
subtopic: 'Indices, Logarithms and Surds'
subtopic_id: a33da1ac-bc18-55d5-83af-029e0acd9980
part: 5
title: 'The laws of logarithms'
sources:            # pages consulted for the approach, for reviewers
  - https://www.headteacher.ng/deducing-logarithm-from-indices-and-standard-form-and-definition-of-logarithm-for-ss-1/
  - https://ancourage.academy/articles/a-maths-indices-surds-logarithms-exponentials-singapore
  - https://syllabus.ng/jamb/mathematics
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is the laws of logarithms.'
    write: 'The laws of logarithms'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson, you learnt that a log is an index. So each law of indices gives a law of logs. These laws let us simplify logs without tables, and JAMB asks this nearly every year.'
    write: 'Each law of indices gives a law of logs'
    doodle: {name: 'custom:sub_maths_indices_logs_surds_a2', id: d, caption: 'a power and its log', size: scene, 'on': 'log'}
    doodle_do:
      - {id: d, op: show, part: log, 'on': 'log'}
      - {id: d, op: show, part: log-base, 'on': 'log'}
      - {id: d, op: show, part: log-number, 'on': 'log'}

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn the three laws of logs, and use them on a JAMB question.'
    write: 'Today: three laws of logs, used on a JAMB question'
  - say: 'The three laws are the product law, the quotient law and the power law.'
    write: 'Three laws: product, quotient, power'

  # ---------------------------------------------------------------- product law
  - section: 'Product law'
    say: 'The first is the product law. When we multiply powers, we add the indices, and a log is an index. So the log of a product is the sum of the logs.'
    write: 'Product law: $\log_{a}(MN) = \log_{a}M + \log_{a}N$'
    doodle_do:
      - {id: d, op: show, part: log-answer, 'on': 'is an index'}
      - {id: d, op: show, part: log-answer-label, 'on': 'is an index'}
  - say: 'For example, 32 is 8 times 4. So log base 2 of 32 is log base 2 of 8, plus log base 2 of 4.'
    write: '$\log_{2}32 = \log_{2}8 + \log_{2}4$'
  - say: '2 cubed is 8, so log base 2 of 8 is 3. 2 squared is 4, so log base 2 of 4 is 2. That is 3 plus 2, which is 5.'
    write: '$= 3 + 2 = 5$'
  - say: 'What does this tell us? 2 to the power 5 is 32, so log base 2 of 32 really is 5. The law works.'
    write: 'Check: $2^{5} = 32$ ✓'

  # ---------------------------------------------------------------- quotient law
  - section: 'Quotient law'
    say: 'The second is the quotient law. When we divide powers, we subtract the indices. So the log of a quotient is the log of the top minus the log of the bottom.'
    write: 'Quotient law: $\log_{a}\dfrac{M}{N} = \log_{a}M - \log_{a}N$'
  - say: 'For example, simplify log base 3 of 54, minus log base 3 of 2. By the quotient law, it is log base 3 of 54 over 2, which is log base 3 of 27.'
    write: '$\log_{3}54 - \log_{3}2 = \log_{3}\dfrac{54}{2} = \log_{3}27$'
  - say: '3 cubed is 27, so the answer is 3.'
    write: '$= 3$, since $3^{3} = 27$'

  # ---------------------------------------------------------------- power law
  - section: 'Power law'
    say: 'The third is the power law. For a power of a power, we multiply the indices. So a power inside a log comes down in front as a multiplier.'
    write: 'Power law: $\log_{a}M^{n} = n\log_{a}M$'
  - say: 'For example, log base 2 of 8 squared is 2 times log base 2 of 8. That is 2 times 3, which is 6.'
    write: '$\log_{2}8^{2} = 2\log_{2}8 = 2 \times 3 = 6$'
  - say: 'We check it. 8 squared is 64, and 2 to the power 6 is also 64.'
    write: 'Check: $8^{2} = 64 = 2^{6}$ ✓'

  # ---------------------------------------------------------------- JAMB example
  - section: 'JAMB example'
    say: 'Here is a real JAMB question. Simplify log base 2 of 6 minus log base 2 of 3, all over log base 2 of 8 minus 2 log base 2 of a half.'
    write: 'Simplify $\dfrac{\log_{2}6 - \log_{2}3}{\log_{2}8 - 2\log_{2}\frac{1}{2}}$'
  - say: 'The options are A, one fifth. B, a half. C, minus a half. And D, log base 2 of 3 over log base 2 of 7. We work out the top and the bottom separately.'
    write: 'A. $\tfrac{1}{5}$  B. $\tfrac{1}{2}$  C. $-\tfrac{1}{2}$  D. $\dfrac{\log_{2}3}{\log_{2}7}$'
  - say: 'Take the top first. By the quotient law, it is log base 2 of 6 over 3, which is log base 2 of 2. That is 1, since 2 to the power 1 is 2.'
    write: 'Top: $\log_{2}\dfrac{6}{3} = \log_{2}2 = 1$'
  - say: 'Now the bottom. 2 cubed is 8, so log base 2 of 8 is 3. A half is 2 to the power minus 1, so log base 2 of a half is minus 1.'
    write: '$\log_{2}8 = 3, \quad \log_{2}\tfrac{1}{2} = -1$'
  - say: 'So the bottom is 3 minus 2 times minus 1. 2 times minus 1 is minus 2, and 3 minus minus 2 is 3 plus 2, which is 5.'
    write: 'Bottom: $3 - 2(-1) = 3 + 2 = 5$'
  - say: 'The top is 1 and the bottom is 5. So the answer is one over 5, which is option A.'
    write: '$\therefore \dfrac{1}{5}$ (option A)'

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'Option D comes from subtracting the numbers inside the logs. But log 6 minus log 3 is the log of 6 over 3, not the log of 6 minus 3.'
    write: 'D: $\log_{2}6 - \log_{2}3 \ne \log_{2}(6 - 3)$'
  - say: 'Option B comes from taking 2 log base 2 of a half as 2 times a half, which is 1. But log base 2 of a half is minus 1, so 2 log base 2 of a half is minus 2.'
    write: 'B: $2\log_{2}\tfrac{1}{2} = 2 \times (-1) = -2$, not $1$'
  - say: 'Option C is negative. But the top is 1 and the bottom is 5, and both are positive, so the answer cannot be negative.'
    write: 'C: the top and bottom are positive, so not $-\tfrac{1}{2}$'
  - say: 'One more trap. The product law is for a product, not a sum. Log base 2 of, 8 plus 8, is log base 2 of 16, which is 4. It is not 3 plus 3.'
    write: '$\log_{2}(8 + 8) = \log_{2}16 = 4$, not $6$'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Simplify log base 10 of 25, plus log base 10 of 4. Pause the lesson and work it out.'
    write: 'Simplify $\log_{10}25 + \log_{10}4$'
  - say: 'By the product law, it is log base 10 of 25 times 4, which is log base 10 of 100. 10 squared is 100, so the answer is 2.'
    write: '$= \log_{10}(25 \times 4) = \log_{10}100 = 2$'

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. The log of a product is the sum of the logs, and the log of a quotient is the difference of the logs.'
    write: '1. Product: add the logs; quotient: subtract them'
  - say: 'A power inside a log comes down in front. In the next lesson, we move on to surds. Now try the problem.'
    write: '2. Power: $\log_{a}M^{n} = n\log_{a}M$'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Simplify $\log_{3}18 - \log_{3}2$.'
    answer: '2'
    accept: ['two']
    working:
      - 'Quotient law: log₃18 − log₃2 = log₃(18 ÷ 2) = log₃9.'
      - '3² = 9, so log₃9 = 2.'
    needs_working: false
