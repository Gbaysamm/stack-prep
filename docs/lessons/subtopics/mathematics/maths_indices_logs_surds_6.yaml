# Surds (lesson 6 of 7): what a surd is, the law of surds (shown to work), simplifying by the biggest perfect square on the picture, like surds added and subtracted; the three product laws side by side, never for a sum.
format_version: 1
subject: mathematics
subtopic: 'Indices, Logarithms and Surds'
subtopic_id: a33da1ac-bc18-55d5-83af-029e0acd9980
part: 6
title: 'Surds: simplifying, adding and subtracting'
sources:            # pages consulted for the approach, for reviewers
  - https://edupadi.com/classroom/l/rationalizing-surds
  - https://ancourage.academy/articles/a-maths-indices-surds-logarithms-exponentials-singapore
  - https://syllabus.ng/jamb/mathematics
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is surds.'
    write: 'Surds'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the earlier lessons, you saw that the power a half means a square root. Some square roots come out as whole numbers, and some do not. The ones that do not are the subject of this lesson.'
    write: 'Square roots: some come out whole, some do not'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn what a surd is, how to simplify it, and how to add and subtract surds.'
    write: 'Today: what a surd is; simplify, add and subtract'

  # ---------------------------------------------------------------- surd
  - section: 'Surd'
    say: 'For example, root 9 is exactly 3, because 3 times 3 is 9. So root 9 is a whole number.'
    write: '$\sqrt{9} = 3$, a whole number'
  - say: 'But root 12 is about 3.46, and its decimal never ends and never repeats. So we keep it as root 12. A root like this, which is not a whole number, is called a surd.'
    write: 'Surd: a root that is not a whole number, such as $\sqrt{12}$'
    doodle: {name: 'custom:sub_maths_indices_logs_surds_a5', id: d, caption: 'index, log and surd', size: scene, 'on': 'but'}
    doodle_do:
      - {id: d, op: show, part: surd, 'on': 'keep'}
      - {id: d, op: show, part: surd-label, 'on': 'surd'}

  # ---------------------------------------------------------------- law of surds
  - section: 'Law of surds'
    say: 'To simplify a surd, we use the law of surds. The root of a product equals the root of each factor, multiplied together.'
    write: 'Law of surds: $\sqrt{a \times b} = \sqrt{a} \times \sqrt{b}$'
  - say: 'For example, root 36 is 6. Root 4 times root 9 is 2 times 3, which is also 6. So the law works.'
    write: '$\sqrt{4 \times 9} = \sqrt{36} = 6$, and $\sqrt{4} \times \sqrt{9} = 2 \times 3 = 6$ ✓'

  # ---------------------------------------------------------------- simplifying
  - section: 'Simplifying surds'
    say: 'Now let us simplify root 12. A perfect square is a number like 4, 9, 16 or 25, whose root is a whole number. We look for the biggest perfect square that divides 12. Here it is 4, because 4 times 3 is 12.'
    write: '$\sqrt{12} = \sqrt{4 \times 3}$'
    doodle_do:
      - {id: d, op: show, part: square-label, 'on': 'perfect square'}
      - {id: d, op: show, part: split, 'on': 'here'}
  - say: 'By the law of surds, this is root 4 times root 3. Root 4 is 2, so the 4 comes out as 2. The 3 stays under the root.'
    write: '$= \sqrt{4} \times \sqrt{3} = 2\sqrt{3}$'
    doodle_do:
      - {id: d, op: show, part: comes-out, 'on': 'comes'}
      - {id: d, op: show, part: result, 'on': 'comes'}
      - {id: d, op: show, part: stays-label, 'on': 'stays'}
  - say: 'What does this tell us? Root 12 and 2 root 3 are the same number. But 2 root 3 is the simplest form, because the number under the root is as small as it can be.'
    write: 'Simplest form: the smallest number under the root'
  - say: 'Let us try another. We are given root 72, and we must simplify it. The biggest perfect square that divides 72 is 36, because 36 times 2 is 72.'
    write: '$\sqrt{72} = \sqrt{36 \times 2}$'
  - say: 'Root 36 is 6, so the 36 comes out as 6, and the 2 stays under the root. The answer is 6 root 2.'
    write: '$= \sqrt{36} \times \sqrt{2} = 6\sqrt{2}$'
  - say: 'If you took 9 or 4 instead, you would get 3 root 8 or 2 root 18. Those are not finished, because 8 and 18 still hold a perfect square. So always take the biggest one.'
    write: 'Not $3\sqrt{8}$ or $2\sqrt{18}$: take the biggest perfect square'

  # ---------------------------------------------------------------- like surds
  - section: 'Like surds'
    say: 'Now adding and subtracting. Surds can be added only when the number under the root is the same. These are called like surds, and they work just like like terms in algebra, where 2x plus 5x is 7x.'
    write: 'Like surds: the same number under the root'
  - say: 'So 2 root 3 plus 5 root 3 is 7 root 3. We add the numbers in front and keep the root.'
    write: '$2\sqrt{3} + 5\sqrt{3} = 7\sqrt{3}$'
  - say: 'But root 2 plus root 3 cannot be put together, because the numbers under the roots are different, just as x plus y stays x plus y.'
    write: '$\sqrt{2} + \sqrt{3}$ stays as it is'

  # ---------------------------------------------------------------- comparison
  - section: 'Comparison'
    say: 'We have now met indices, logs and surds. Each has a law for a product. For indices, multiplying powers of the same base adds the indices.'
    write: 'Indices: $a^{m} \times a^{n} = a^{m+n}$'
    doodle_do:
      - {id: d, op: pulse, part: index, 'on': 'adds the indices'}
  - say: 'For logs, the log of a product is the sum of the logs.'
    write: 'Logs: $\log_{a}MN = \log_{a}M + \log_{a}N$'
    doodle_do:
      - {id: d, op: pulse, part: log, 'on': 'logs'}
  - say: 'For surds, the root of a product is the root of each factor, multiplied together.'
    write: 'Surds: $\sqrt{ab} = \sqrt{a} \times \sqrt{b}$'
    doodle_do:
      - {id: d, op: pulse, part: surd, 'on': 'surds'}
  - say: 'All three laws work for a product. The laws of indices and logs also need the same base. None of them works for a sum.'
    write: 'For a product, with the same base; never for a sum'

  # ---------------------------------------------------------------- trap
  - section: 'JAMB trap'
    say: 'Here is the common trap. The law of surds is not for a sum. The root of, 9 plus 16, is root 25, which is 5. But root 9 plus root 16 is 3 plus 4, which is 7.'
    write: '$\sqrt{9 + 16} = \sqrt{25} = 5$, not $3 + 4 = 7$'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Simplify root 50 minus root 18.'
    write: 'Simplify $\sqrt{50} - \sqrt{18}$'
  - say: 'Pause the lesson and try it. Here is a hint. Look for the biggest perfect square in each number.'
    write: 'Hint: a perfect square in 50, and in 18'
    doodle_do:
      - {id: d, op: pulse, part: square-label, 'on': 'perfect square'}
  - say: '50 is 25 times 2, and root 25 is 5. So root 50 is 5 root 2.'
    write: '$\sqrt{50} = \sqrt{25 \times 2} = 5\sqrt{2}$'
  - say: '18 is 9 times 2, and root 9 is 3. So root 18 is 3 root 2.'
    write: '$\sqrt{18} = \sqrt{9 \times 2} = 3\sqrt{2}$'
  - say: 'Both are now surds in root 2, so they are like surds, and we subtract them. 5 root 2 minus 3 root 2 is 2 root 2.'
    write: '$\therefore 5\sqrt{2} - 3\sqrt{2} = 2\sqrt{2}$'

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. A surd is a root that is not a whole number. To simplify it, take the biggest perfect square out of the root.'
    write: '1. Simplify: take the biggest perfect square out'
  - say: 'Only like surds, with the same number under the root, can be added or subtracted. In the next lesson, we clear surds from the bottom of a fraction. Now try the problem.'
    write: '2. Add or subtract like surds only'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Simplify $\sqrt{48} + \sqrt{27}$.'
    answer: '7√3'
    accept: ['7sqrt3', '7 root 3', '7sqrt(3)', '7√(3)']
    working:
      - '48 = 16 × 3, so √48 = √16 × √3 = 4√3.'
      - '27 = 9 × 3, so √27 = √9 × √3 = 3√3.'
      - 'Like surds: 4√3 + 3√3 = 7√3.'
    needs_working: true
