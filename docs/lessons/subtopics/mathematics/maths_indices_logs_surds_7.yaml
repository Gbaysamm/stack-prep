# Rationalising the denominator (lesson 7 of 7): a single surd at the bottom (multiply by itself), then a bottom of two terms (the conjugate, through the difference of two squares, taught first), two worked examples with checks, the slips.
format_version: 1
subject: mathematics
subtopic: 'Indices, Logarithms and Surds'
subtopic_id: a33da1ac-bc18-55d5-83af-029e0acd9980
part: 7
title: 'Rationalising the denominator'
sources:            # pages consulted for the approach, for reviewers
  - https://edupadi.com/classroom/l/rationalizing-surds
  - https://ancourage.academy/articles/a-maths-indices-surds-logarithms-exponentials-singapore
  - https://syllabus.ng/jamb/mathematics
moments:
  # ---------------------------------------------------------------- welcome
  - section: 'Welcome'
    say: 'Welcome. Today''s lesson is rationalising the denominator.'
    write: 'Rationalising the denominator'

  # ---------------------------------------------------------------- introduction
  - section: 'Introduction'
    say: 'In the last lesson, you learnt to simplify surds. The bottom of a fraction is called its denominator, and sometimes a surd sits there. To rationalise the denominator means to clear the surd from the bottom, so that no surd is left there.'
    write: 'Rationalise: clear the surd from the denominator'

  # ---------------------------------------------------------------- objectives
  - section: 'Objectives'
    say: 'In this lesson you will learn to rationalise a bottom that is one surd, and a bottom of two terms, such as root 3 minus root 2.'
    write: 'Today: a bottom of one surd, and a bottom of two terms'

  # ---------------------------------------------------------------- one surd
  - section: 'One surd at the bottom'
    say: 'Let us start with one surd. The key fact is that a root times itself gives the number under it. For example, root 2 times root 2 is 2.'
    write: '$\sqrt{2} \times \sqrt{2} = 2$'
  - say: 'So to rationalise 3 over root 2, we multiply the top and the bottom by root 2. Multiplying the top and the bottom by the same number does not change the value of the fraction.'
    write: '$\dfrac{3}{\sqrt{2}} = \dfrac{3 \times \sqrt{2}}{\sqrt{2} \times \sqrt{2}}$'
  - say: 'The top is 3 root 2. The bottom is root 2 times root 2, which is 2. So the answer is 3 root 2 over 2, and the bottom is now a whole number.'
    write: '$= \dfrac{3\sqrt{2}}{2}$'

  # ---------------------------------------------------------------- two terms: the conjugate
  - section: 'The conjugate'
    say: 'Now a bottom with two terms, such as root 3 minus root 2. Multiplying by root 3 alone does not clear both roots, because root 3 times the bracket root 3 minus root 2 is 3 minus root 6, and root 6 is still a surd. Instead, we multiply by its conjugate.'
    write: 'Bottom $\sqrt{3} - \sqrt{2}$: multiply by its conjugate'
  - say: 'The conjugate is the same two terms with the sign between them changed. So the conjugate of root 3 minus root 2 is root 3 plus root 2.'
    write: 'Conjugate of $\sqrt{3} - \sqrt{2}$ is $\sqrt{3} + \sqrt{2}$'
  - say: 'This works because of the difference of two squares. A minus B, times A plus B, is A squared minus B squared, because when we multiply out, the middle terms, minus AB and plus AB, cancel. When A and B are square roots, squaring them clears the roots.'
    write: '$(A - B)(A + B) = A^{2} - B^{2}$'

  # ---------------------------------------------------------------- worked example 1
  - section: 'Worked example'
    say: 'Let us use this on an example. We must rationalise 1 over the bracket root 3 minus root 2. We are given a fraction with two terms at the bottom, and we must clear the surds from the bottom.'
    write: 'Rationalise $\dfrac{1}{\sqrt{3} - \sqrt{2}}$'
  - say: 'We multiply the top and the bottom by the conjugate, root 3 plus root 2, so the value of the fraction does not change.'
    write: 'Multiply top and bottom by $\sqrt{3} + \sqrt{2}$'
  - say: 'The top is 1 times the bracket root 3 plus root 2, which is just root 3 plus root 2.'
    write: 'Top: $1 \times (\sqrt{3} + \sqrt{2}) = \sqrt{3} + \sqrt{2}$'
  - say: 'The bottom is a difference of two squares. Root 3 squared is 3, and root 2 squared is 2, so the roots disappear. 3 minus 2 is 1.'
    write: 'Bottom: $(\sqrt{3})^{2} - (\sqrt{2})^{2} = 3 - 2 = 1$'
  - say: 'Anything over 1 is itself, so the answer is root 3 plus root 2.'
    write: '$\therefore \dfrac{1}{\sqrt{3} - \sqrt{2}} = \sqrt{3} + \sqrt{2}$'
  - say: 'We check the answer with decimals. Root 3 is about 1.732 and root 2 is about 1.414, so the bottom of the first fraction is about 0.318. 1 over 0.318 is about 3.15, and 1.732 plus 1.414 is about 3.15 too. So the two are equal.'
    write: 'Check: $\dfrac{1}{0.318} \approx 3.15$, and $1.732 + 1.414 \approx 3.15$ ✓'

  # ---------------------------------------------------------------- worked example 2
  - section: 'Another example'
    say: 'Now a bottom with a plus sign and a whole number. We must rationalise 4 over the bracket root 5 plus 1. We change the sign between the terms, so the conjugate of root 5 plus 1 is root 5 minus 1, and we multiply the top and the bottom by it.'
    write: 'Rationalise $\dfrac{4}{\sqrt{5} + 1}$: multiply by $\sqrt{5} - 1$'
  - say: 'By the difference of two squares, the bottom is root 5 squared minus 1 squared. That is 5 minus 1, which is 4.'
    write: 'Bottom: $(\sqrt{5})^{2} - 1^{2} = 5 - 1 = 4$'
  - say: 'The top is 4 times the bracket root 5 minus 1. The 4 on top and the 4 at the bottom cancel, so the answer is root 5 minus 1.'
    write: '$\dfrac{4(\sqrt{5} - 1)}{4} = \sqrt{5} - 1$'

  # ---------------------------------------------------------------- traps
  - section: 'JAMB traps'
    say: 'A common slip is to multiply only the bottom. Whatever you multiply the bottom by, you must multiply the top by too, or the value of the fraction changes.'
    write: 'Multiply the top too, or the value changes'
  - say: 'Another slip is to multiply the bottom by itself, keeping the same sign. Root 3 minus root 2, squared, is 5 minus 2 root 6, which still has a surd. The sign between the terms must change, so that the middle terms cancel.'
    write: '$(\sqrt{3} - \sqrt{2})^{2} = 5 - 2\sqrt{6}$, still a surd'

  # ---------------------------------------------------------------- check
  - section: 'Check yourself'
    say: 'Now it is your turn. Rationalise 6 over root 3, and simplify. Pause the lesson and work it out.'
    write: 'Rationalise $\dfrac{6}{\sqrt{3}}$'
  - say: 'Multiply the top and the bottom by root 3. The top is 6 root 3, and the bottom is root 3 times root 3, which is 3.'
    write: '$\dfrac{6 \times \sqrt{3}}{\sqrt{3} \times \sqrt{3}} = \dfrac{6\sqrt{3}}{3}$'
  - say: '6 divided by 3 is 2, so the answer is 2 root 3.'
    write: '$= 2\sqrt{3}$'

  # ---------------------------------------------------------------- recap
  - section: 'Recap'
    say: 'Let us recap. For one surd at the bottom, multiply the top and the bottom by that surd.'
    write: '1. One surd: multiply top and bottom by it'
  - say: 'For two terms, multiply the top and the bottom by the conjugate, which changes the sign between them. That is the last lesson on indices, logarithms and surds. Try the problem, and then new questions on the whole topic.'
    write: '2. Two terms: multiply top and bottom by the conjugate'

# ---------------------------------------------------------------- after the lesson: try it
problems:
  - ask: 'Rationalise $\dfrac{2}{\sqrt{5} - \sqrt{3}}$.'
    answer: '√5 + √3'
    accept: ['sqrt5 + sqrt3', 'root 5 + root 3', '√3 + √5', '√5+√3']
    working:
      - 'Multiply top and bottom by the conjugate, √5 + √3.'
      - 'Bottom: (√5)² − (√3)² = 5 − 3 = 2.'
      - 'Top: 2(√5 + √3).'
      - '2(√5 + √3) ÷ 2 = √5 + √3.'
    needs_working: true
