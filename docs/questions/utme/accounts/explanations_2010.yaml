format_version: 1
exam_year: 2010
subject: ACC
explanations:
  2:
    answer: C
    steps:
      - 'This is about the professional accounting bodies in Nigeria: the Institute of Chartered Accountants of Nigeria (ICAN) and the Association of National Accountants of Nigeria (ANAN).'
      - 'Their main job is to regulate the profession: they set the standard of entry by examinations, keep a register of members and, above all, lay down and enforce a code of ethics so that accountants act with integrity, objectivity and confidentiality.'
      - 'A member who breaks the code can be called before a disciplinary tribunal and struck off the register. That is how the bodies promote the ethics of the profession.'
      - 'If an Abuja chartered accountant signs off false accounts for a client, ICAN can discipline him, because its rules of conduct bind every member.'
      - 'Remember: a professional body is the referee of the profession; it writes and enforces the rules of fair play.'
      - 'The trap is A, financial management of businesses. That is the work each business does for itself, with its own managers; the bodies regulate the accountants, not the businesses.'
    hint: 'What does a professional body do for its own members and the public they serve?'
    why:
      A: 'Managing a business''s finances is the job of that business''s own managers, not of ICAN or ANAN.'
      B: 'Pay is set by employers and the market; a professional body does not exist to pay its members.'
      D: 'Showing that the profession changes is not a function; the bodies exist to regulate it.'

  3:
    answer: A
    steps:
      - 'This is the classification of ledger accounts.'
      - 'Ledger accounts fall into three classes. Personal accounts are for people and firms (debtors, creditors, capital). Real accounts are for property and assets (land, motor van, cash). Nominal accounts are for incomes, expenses, gains and losses (rent, wages, commission received).'
      - 'Every account in the ledger belongs to one of the three. For example, Musa''s account is personal, the furniture account is real and the salaries account is nominal.'
      - 'An Onitsha provisions shop keeps an account for its supplier Chidi Ventures (personal), for its shop fittings (real) and for electricity (nominal).'
      - 'Remember "PRN": Personal for people, Real for things, Nominal for names of incomes and expenses.'
      - 'The trap is B, fixed and current. Those describe kinds of assets on the balance sheet, not the classes of ledger account.'
    hint: 'Think of people, things, and incomes or expenses.'
    why:
      B: 'Fixed and current describe assets in the balance sheet, not the classes of ledger account.'
      C: 'Management, financial and public sector accounting are branches of accounting, not classes of account.'
      D: 'Bank and cash accounts are two real accounts; they are examples, not the classification.'

  4:
    answer: A
    steps:
      - 'This is an error of commission, one of the errors a trial balance does not show.'
      - 'An error of commission is the right amount entered on the right side, but in the wrong account of the same class. An error of principle puts an item in the wrong class of account, such as an expense in an asset account.'
      - 'Salaries and stationery are both nominal (expense) accounts. Debiting salaries instead of stationery keeps the item in the right class but the wrong account, so it is an error of commission. To put it right: debit stationery, credit salaries.'
      - 'A pharmacy in Ibadan pays ₦3,000 for receipt books and the clerk debits salaries. Both are running expenses, so the total of expenses is right but the two accounts are wrong.'
      - 'Remember: commission is a wrong account in the right class; principle is the wrong class altogether.'
      - 'The trap is C, principle. That would need a change of class, such as a motor van bought being debited to motor expenses.'
    hint: 'Are salaries and stationery the same class of account?'
    why:
      B: 'An error of omission leaves the transaction out of the books entirely; here it was entered.'
      C: 'An error of principle moves an item into the wrong class of account; both accounts here are expenses.'
      D: 'Compensating errors are two separate mistakes of equal amount that cancel each other out.'

  5:
    answer: B
    steps:
      - 'This is putting right an error in amount in the stationery account.'
      - 'Rule: find the difference between what was entered and what should have been entered, then post that difference on the opposite side.'
      - 'Stationery was debited ₦2,000 instead of ₦200. Excess debit = ₦2,000 − ₦200 = ₦1,800. To remove an excess debit, credit stationery with ₦1,800.'
      - 'Check: ₦2,000 debit − ₦1,800 credit = ₦200, the true cost of the stationery.'
      - 'A school bursar in Enugu buys exercise books for ₦200 but writes ₦2,000. Crediting ₦1,800 brings the account back to ₦200.'
      - 'Remember: too much on one side is taken away by the same difference on the other side.'
      - 'The trap is C, debit stationery with ₦1,800. That would make the account ₦3,800, adding to the error instead of removing it.'
    hint: 'By how much is the debit too big, and which side takes it away?'
    why:
      A: 'Debiting ₦2,200 more would push the stationery account up to ₦4,200.'
      C: 'Debiting ₦1,800 adds to the excess instead of removing it.'
      D: 'Crediting ₦2,200 removes more than the ₦1,800 excess and leaves a credit of ₦200.'

  6:
    answer: B
    steps:
      - 'This is the real account, one of the three classes of ledger account.'
      - 'Real accounts record property and assets: land and buildings, machinery, furniture, motor vans, and cash. Tangible assets of a permanent nature (fixed assets) are kept in real accounts.'
      - 'Personal accounts are for people and firms, and nominal accounts for incomes and expenses. A building is neither a person nor an expense, so its account is real.'
      - 'A bakery in Ibadan keeps a land and buildings account and an oven account. Both are real accounts that run on from year to year.'
      - 'Remember: real accounts are for real things you can touch.'
      - 'The trap is D, cash account. Cash is a real account too, but it is a current asset that changes every day, not a permanent one.'
    hint: 'Which class of account is kept for things you can see and touch?'
    why:
      A: 'Personal accounts are kept for people and firms, such as debtors and creditors.'
      C: 'Nominal accounts are kept for incomes, expenses, gains and losses.'
      D: 'Cash is a current asset that changes daily, not a permanent tangible asset.'

  7:
    answer: C
    steps:
      - 'This is the invoice, a source document.'
      - 'An invoice is the bill a seller sends a buyer for goods sold on credit. Its main feature is that it gives the particulars of the goods: the description, quantity, unit price, total, trade discount and terms of payment.'
      - 'The seller keeps a copy and enters it in the sales day book; the buyer enters it in the purchases day book. The details on it are what make those entries possible.'
      - 'A wholesaler at Idumota market sends a Surulere shop an invoice for 20 cartons of noodles at ₦4,000 each, less 10% trade discount, payable within 30 days.'
      - 'Remember: an invoice says what, how many, how much and when to pay.'
      - 'The trap is A. The invoice is entered in a day book, but that is what is done with it, not its feature.'
    hint: 'What does an invoice show about the goods?'
    why:
      A: 'Entry in the sales day book is what is done with the invoice, not what the invoice is.'
      B: 'Cash and bank columns belong to the cash book.'
      D: 'An invoice is used for credit sales; cash sales use a cash receipt.'

  8:
    answer: D
    steps:
      - 'This is source documents, the first papers in the accounting process.'
      - 'A source document is the original paper that proves a transaction happened: invoices, credit notes, debit notes, receipts, cheque counterfoils and petty cash vouchers. The books of original entry are written up from them.'
      - 'A credit note is sent to a customer who returns goods; it is the source document for the returns inwards book. The cash book and petty cash book are books of original entry, and the general ledger is the main book of accounts.'
      - 'A Kano textile shop that takes back two damaged wrappers sends the buyer a credit note for ₦6,000. That note is the proof the shop''s clerk writes up from.'
      - 'Remember the order: document, then day book, then ledger.'
      - 'The trap is B, petty cash book. Its vouchers are source documents, but the book itself is a book of original entry.'
    hint: 'Which one is a piece of paper that proves a transaction, not a book?'
    why:
      A: 'The cash book is a book of original entry, written up from receipts and cheque counterfoils.'
      B: 'The petty cash book is a book of original entry; the petty cash voucher is the source document.'
      C: 'The general ledger is where entries are posted from the books of original entry.'

  9:
    answer: B
    steps:
      - 'This is cash discount, called discount allowed when we give it to a customer.'
      - 'Cash discount is a reduction given for prompt payment. Rule: $\text{Discount} = \text{Rate} \times \text{Amount owed}$. It is entered in the discount column on the debit side of the cash book.'
      - 'Fatima owed ₦2,000 at 2%: discount = $\dfrac{2}{100} \times 2{,}000$ = ₦40. She pays ₦2,000 − ₦40 = ₦1,960 in cash.'
      - 'Check: ₦1,960 cash + ₦40 discount = ₦2,000, so her account is fully cleared.'
      - 'A Jos farmer who owes a feed dealer ₦2,000 and pays within the week gets 2% off and hands over ₦1,960.'
      - 'Remember: discount allowed sits with the money received, on the debit side.'
      - 'The trap is A, ₦20, which takes 1% instead of 2%.'
    hint: 'What is 2% of the ₦2,000 Fatima owed?'
    why:
      A: '₦20 is 1% of ₦2,000; the rate is 2%.'
      C: '₦60 is 3% of ₦2,000.'
      D: '₦4 is 2% of ₦200, not of ₦2,000.'

  10:
    answer: A
    steps:
      - 'This is balancing the cash column of a three-column cash book.'
      - 'Rule: cash balance = total cash received (debit column) − total cash paid (credit column). The discount column is a memorandum only and is never added to cash.'
      - 'Fatima''s cash = ₦2,000 − ₦40 = ₦1,960. Cash debits: 3,000 + 1,000 + 1,960 + 200 = ₦6,160.'
      - 'Cash credits: electricity 200 + purchases 3,000 + Khadija 200 = ₦3,400. Balance c/d = ₦6,160 − ₦3,400 = ₦2,760.'
      - 'Check: ₦3,400 + ₦2,760 = ₦6,160, so both sides agree.'
      - 'A Kaduna kiosk owner who starts with ₦3,000, takes in ₦3,160 and pays out ₦3,400 has ₦2,760 left in the drawer.'
      - 'The trap is C, ₦6,200. That is the cash debit side with Fatima''s full ₦2,000 and nothing paid out taken away.'
    hint: 'Fatima did not hand over the full ₦2,000. Total the cash column on each side.'
    why:
      B: '₦4,300 is the total of the bank debit column, not the cash balance.'
      C: '₦6,200 is the cash debit side with Fatima''s full ₦2,000, before the payments are taken away.'
      D: '₦2,400 treats Baffa''s receipt as a payment and ignores the discount.'

  11:
    answer: B
    steps:
      - 'This is a cause of difference between the cash book and the bank statement.'
      - 'Rule: an item the bank adds to the account before the trader knows of it makes the bank statement balance higher (overstated) than the cash book. Items the bank takes away first make it lower.'
      - 'Interest received is credited by the bank straight into the account. The trader sees it only on the statement, so the bank balance is higher until the cash book is updated with a debit.'
      - 'A Lagos trader''s savings earn ₦1,500 interest. The bank statement shows it, but her cash book does not, so the statement shows ₦1,500 more.'
      - 'Remember: money the bank gives first lifts the statement; money the bank takes first lowers it.'
      - 'The trap is A, commission paid. That is a charge the bank takes away, which makes the statement lower, not higher.'
    hint: 'Which item does the bank add to the account before the trader records it?'
    why:
      A: 'Commission is taken out by the bank, so it lowers the bank statement balance.'
      C: 'A standing order is paid out by the bank, so it lowers the bank statement balance.'
      D: 'A direct withdrawal takes money out, so it lowers the bank statement balance.'

  12:
    answer: B
    steps:
      - 'This is commission on turnover (COT), the bank charge on current accounts.'
      - 'A bank charged current account holders a commission on turnover: a small rate on the total of the debits (withdrawals and payments) passing through the account in the period.'
      - 'The bank debits the charge to the account, so it appears on the bank statement first and must then be credited in the trader''s cash book as bank charges.'
      - 'In 2010 a Nigerian bank might charge ₦5 for every ₦1,000 a trader withdrew. The Central Bank later phased COT out, and banks now charge a capped account maintenance fee instead.'
      - 'Remember: COT, commission on turnover, the charge on money moving through a current account.'
      - 'The trap is A, transactions. Charges are linked to transactions, but the named charge is on turnover.'
    hint: 'The charge has a three-letter name, C O T.'
    why:
      A: 'The named charge was on turnover, not a fee on each transaction.'
      C: 'A transfer fee is a separate charge for moving money, not the current account charge asked about.'
      D: 'Banks did not charge on cash paid in; the commission was on the turnover of the account.'

  13:
    answer: C
    steps:
      - 'This is a cause of difference that makes the cash book balance higher (overstated) than the bank statement.'
      - 'Rule: an item the trader has entered as money in, but which the bank has not yet credited, makes the cash book higher than the bank statement.'
      - 'Uncredited cheques (also called lodgements not yet credited) are cheques the trader paid in and debited in the cash book, but the bank has not yet cleared and credited them. So the cash book shows more than the bank does.'
      - 'A Port Harcourt hardware shop lodges a ₦50,000 cheque on 31 December. Its cash book shows the ₦50,000, but the bank credits it only on 3 January.'
      - 'Remember: money in the cash book but not yet in the bank lifts the cash book.'
      - 'The trap is B, unpresented cheques. They have been taken out of the cash book but not yet out of the bank, so they make the cash book lower, not higher.'
    hint: 'Which cheques has the trader counted as received while the bank has not?'
    why:
      A: 'A dividend received direct by the bank appears on the statement first, so it makes the bank balance higher.'
      B: 'Unpresented cheques are already taken out of the cash book, so they make the cash book lower than the bank.'
      D: 'Interest on lodgements is added by the bank first, so it makes the bank balance higher.'

  14:
    answer: B
    steps:
      - 'This is gross profit, found in the trading account (today the first part of the statement of profit or loss).'
      - 'Rules: net sales = sales − returns inwards; cost of sales = opening stock + purchases − returns outwards + carriage inwards − closing stock; gross profit = net sales − cost of sales. Carriage outwards is a selling expense for the profit and loss account, not the trading account.'
      - 'Net sales = 10,900 − 600 = ₦10,300. Net purchases = 4,000 − 800 = ₦3,200; add carriage inwards 200 = ₦3,400.'
      - 'Cost of sales = 1,000 + 3,400 − 2,000 = ₦2,400. Gross profit = 10,300 − 2,400 = ₦7,900.'
      - 'Check: 2,400 + 7,900 = 10,300, the net sales.'
      - 'A provisions dealer in Onitsha pays ₦200 to bring goods in by lorry; that carriage inwards is part of the cost of her stock (inventory), but the ₦300 she pays to deliver to customers is a selling cost.'
      - 'The trap is A, ₦7,800, which puts carriage outwards (₦300) in the trading account in place of carriage inwards (₦200).'
    hint: 'Which carriage belongs in the trading account, and which returns come off sales?'
    why:
      A: '₦7,800 uses carriage outwards in place of carriage inwards in the cost of sales.'
      C: '₦9,700 is too high; cost of sales is ₦2,400, so gross profit is ₦10,300 − ₦2,400.'
      D: '₦5,700 is too low; it takes away far more than the ₦2,400 cost of sales.'

  15:
    answer: D
    steps:
      - 'This is the cost of goods available for sale, a subtotal in the trading account.'
      - 'Rule: $\text{Goods available for sale} = \text{Opening stock} + \text{Purchases} - \text{Returns outwards} + \text{Carriage inwards}$. Closing stock has not yet been taken away.'
      - 'Net purchases = 4,000 − 800 = ₦3,200. Goods available = 1,000 + 3,200 + 200 = ₦4,400.'
      - 'Check: taking away closing stock of ₦2,000 gives a cost of sales of ₦2,400, which leaves the sensible gross profit of ₦7,900.'
      - 'A Kano grain seller begins with ₦1,000 of maize, buys ₦4,000 more, sends back ₦800 of bad bags and pays ₦200 transport: she has ₦4,400 worth to sell.'
      - 'Remember: what you had, plus what you kept of what you bought, plus the cost of bringing it in.'
      - 'The trap is A, ₦4,600, which takes returns inwards off purchases instead of returns outwards.'
    hint: 'Start with opening stock and net purchases. Which carriage adds to the cost of the goods?'
    why:
      A: '₦4,600 takes returns inwards (₦600) off purchases instead of returns outwards (₦800).'
      B: '₦5,000 is just opening stock plus purchases, with no returns or carriage.'
      C: '₦6,400 adds the closing stock instead of leaving it out.'

  16:
    answer: D
    steps:
      - 'This is the provision for bad debts, an adjustment in the final accounts.'
      - 'Rule: only the change in the provision goes to the profit and loss account. An increase is a debit (an expense); a decrease is a credit.'
      - 'New provision = 4% × ₦20,000 = ₦800. Old provision = ₦500. Increase = ₦800 − ₦500 = ₦300, debited to profit and loss.'
      - 'Check: ₦500 already in the provision account + ₦300 now = ₦800, the level wanted.'
      - 'An Aba shoe wholesaler owed ₦20,000 by retailers (receivables) keeps 4% aside for those who may not pay. She already had ₦500 set aside, so this year she charges only ₦300 more.'
      - 'Remember: profit and loss pays for the top-up, not the whole tank.'
      - 'The trap is A, ₦500. That is the old provision, already charged in an earlier year.'
    hint: 'Find the new provision first. How much more is needed than the ₦500 already there?'
    why:
      A: '₦500 is the old provision, already charged in an earlier year.'
      B: '₦820 does not come from 4% of ₦20,000 less the ₦500 already provided.'
      C: '₦1,300 adds the old provision to the new one instead of taking the difference.'

  17:
    answer: B
    steps:
      - 'This is the provision for bad debts shown in the balance sheet (today the statement of financial position).'
      - 'Rule: the balance sheet shows the full provision at the year end, the required percentage of debtors, deducted from debtors.'
      - 'Provision = 4% × ₦20,000 = $\dfrac{4}{100} \times 20{,}000$ = ₦800. Debtors are shown as ₦20,000 − ₦800 = ₦19,200.'
      - 'Check: of the ₦800, ₦500 was there already and ₦300 was charged this year.'
      - 'A Calabar pharmacy owed ₦20,000 by clinics shows debtors ₦20,000, less provision ₦800, giving ₦19,200 it expects to collect.'
      - 'Remember: profit and loss gets the change; the balance sheet gets the whole provision.'
      - 'The trap is A, ₦300. That is the increase charged to profit and loss, not the provision in the balance sheet.'
    hint: 'The balance sheet shows the whole provision. What is 4% of ₦20,000?'
    why:
      A: '₦300 is the increase charged to profit and loss, not the full provision.'
      C: '₦1,300 adds the old ₦500 to the new ₦800.'
      D: '₦19,200 is the net debtors after the provision, not the provision itself.'

  18:
    answer: A
    steps:
      - 'This is accruals (accrued expenses), an adjustment in the final accounts.'
      - 'An accrual is an expense for a service already used in the period but not yet paid for. By the accruals (matching) concept, it is still charged to the period that enjoyed the benefit.'
      - 'The amount owing is added to the expense in the profit and loss account and shown as a current liability in the balance sheet.'
      - 'An Ibadan bakery uses electricity all December but pays the ₦15,000 bill in January. The ₦15,000 is an accrual in December''s accounts.'
      - 'Remember: accrued means used now, paid later; prepaid means paid now, used later.'
      - 'The trap is B, prepayments. They are the opposite: paid for but not yet enjoyed.'
    hint: 'The benefit has come first and the payment has not.'
    why:
      B: 'A prepayment is paid for before the benefit is enjoyed, the opposite case.'
      C: 'Acquisitions are things bought, such as assets, not unpaid benefits.'
      D: 'A provision is an amount set aside for a likely loss, such as bad debts.'

  19:
    answer: A
    steps:
      - 'This is the periodic stock system, one way of keeping track of stock (inventory).'
      - 'Under the periodic system, stock is not recorded with each sale or purchase. It is found by a physical count at the end of the accounting period, and that count is the closing stock.'
      - 'The other system, the perpetual system, updates the stock record after every receipt and issue, so the balance is known all the time.'
      - 'A small Onitsha provisions shop counts every carton on 31 December to find its closing stock; it does not keep a running stock card.'
      - 'Remember: periodic counts at the period end; perpetual keeps a running record.'
      - 'The trap is C, updated continuously. That describes the perpetual system.'
    hint: 'When is the stock counted if no running record is kept?'
    why:
      B: 'Stock is updated under the periodic system, once, at the year end.'
      C: 'Continuous updating is the perpetual system.'
      D: 'The count is made at the end of the year, and it becomes the next year''s opening stock.'

  20:
    answer: A
    steps:
      - 'This is LIFO (last in, first out), a method of valuing stock, in a time of rising prices.'
      - 'Under LIFO the latest goods bought are treated as the first ones issued, so the cost of goods sold is priced at the newest prices, and closing stock at the oldest prices.'
      - 'When prices are rising the newest prices are the highest. So cost of goods sold is higher, which makes gross profit lower, tax lower and closing stock lower.'
      - 'A Kano rice dealer bought bags at ₦20,000, then at ₦25,000. Under LIFO a bag sold is costed at ₦25,000, so her cost of sales is higher than under FIFO.'
      - 'Remember: in rising prices, LIFO Lifts the cost and lowers the profit.'
      - 'The trap is B, higher gross profit. That is the effect of FIFO, which charges the older, cheaper prices.'
    hint: 'Which prices, old or new, are charged to the goods sold under LIFO, and are they high or low when prices rise?'
    why:
      B: 'Higher cost of sales means lower, not higher, gross profit under LIFO; FIFO gives the higher profit.'
      C: 'Lower profit means lower income tax under LIFO, not higher.'
      D: 'Closing stock under LIFO is valued at the older, lower prices, so its value is lower.'

  21:
    answer: D
    steps:
      - 'This is the sales ledger control account (today often called the receivables control account).'
      - 'Rule: it is a summary of all debtors'' accounts. Debit side: opening balance, credit sales, and dishonoured bills and cheques (which revive debts). Credit side: cash received, discount allowed, returns inwards, bills receivable, and the closing balance c/d.'
      - 'Credit sales = 160% × ₦280,000 = ₦448,000. Debit total = 87,000 + 448,000 + 58,000 + 50,000 = ₦643,000.'
      - 'Credits other than the balance = 40,000 + 50,000 + 280,000 + 30,000 = ₦400,000. Balance c/d = 643,000 − 400,000 = ₦243,000.'
      - 'Check: 400,000 + 243,000 = 643,000, so both sides agree.'
      - 'A Lagos building-materials firm sells ₦448,000 of cement on credit in the year. The control account shows its customers still owe ₦243,000 at the year end.'
      - 'The trap is C, ₦343,000, which is ₦100,000 too high, a slip in the subtraction. Remember: the closing balance is the figure that makes the smaller side equal the bigger one.'
    hint: 'Find credit sales first, then make both sides of the account equal.'
    why:
      A: '₦333,000 does not balance the account; the debit total is ₦643,000 and the other credits ₦400,000.'
      B: '₦234,000 swaps the digits of ₦243,000.'
      C: '₦343,000 is ₦100,000 too high; 643,000 − 400,000 is 243,000.'

  22:
    answer: C
    steps:
      - 'This is credit sales, the main debit in the sales ledger control account.'
      - 'Rule: here credit sales are given as a percentage of cash received: $\text{Credit sales} = 160\% \times \text{Cash received}$.'
      - 'Credit sales = $\dfrac{160}{100} \times 280{,}000$ = 1.6 × 280,000 = ₦448,000.'
      - 'Check: ₦448,000 is more than the ₦280,000 received, as 160% must be.'
      - 'An Aba trader who collects ₦280,000 from customers and sells 1.6 times that on credit has credit sales of ₦448,000.'
      - 'Remember: 160% means one whole and six tenths more, so multiply by 1.6.'
      - 'The trap is B, ₦484,000, which swaps two digits of the right answer.'
    hint: 'Multiply the cash received by 1.6.'
    why:
      A: '₦558,000 is not 1.6 × ₦280,000.'
      B: '₦484,000 swaps two digits of ₦448,000.'
      D: '₦584,000 is not 1.6 × ₦280,000.'

  23:
    answer: D
    steps:
      - 'This is finding a missing figure, purchases, from incomplete records.'
      - 'Rule: $\text{Cost of goods sold} = \text{Opening stock} + \text{Purchases} - \text{Closing stock}$. Turn it round: $\text{Purchases} = \text{Cost of goods sold} - \text{Opening stock} + \text{Closing stock}$.'
      - 'Opening stock (31/12/07) = ₦4,200; closing stock (31/12/08) = ₦3,900. Purchases = 6,000 − 4,200 + 3,900 = ₦5,700.'
      - 'Check: 4,200 + 5,700 − 3,900 = 6,000, the cost of goods sold given.'
      - 'A Benin trader who does not keep full books knows she sold goods costing ₦6,000, started with ₦4,200 of stock and ended with ₦3,900. She must have bought ₦5,700.'
      - 'Remember: fill in the trading account and let the missing figure balance it.'
      - 'The trap is C, ₦14,100, which adds both stocks to the cost of goods sold instead of taking the opening stock away.'
    hint: 'Write the cost of goods sold formula and solve it for purchases.'
    why:
      A: '₦6,000 is the cost of goods sold itself, not the purchases.'
      B: '₦9,900 adds closing stock to cost of goods sold but forgets to take away opening stock.'
      C: '₦14,100 adds both stocks instead of taking the opening stock away.'

  24:
    answer: D
    steps:
      - 'This is the charge for expenses with prepayments and accruals at both ends of the year.'
      - 'Rules: expense charged = cash paid + prepayment at the start − prepayment at the end; and expense charged = cash paid − accrual at the start + accrual at the end.'
      - 'Rates = 1,300 + 1,000 − 1,500 = ₦800. The ₦1,000 paid last year belongs to this year; the ₦1,500 paid now belongs to next year.'
      - 'Wages = 2,200 − 1,150 + 1,350 = ₦2,400. The ₦1,150 paid this year was last year''s debt; the ₦1,350 still owed belongs to this year.'
      - 'Total charged to profit and loss = 800 + 2,400 = ₦3,200.'
