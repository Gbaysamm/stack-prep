      - 'In the subscriptions account they are carried down as a credit balance; in the balance sheet (statement of financial position) they are shown under current liabilities.'
      - 'A member of a Kaduna sports club pays ₦10,000 in December for next year''s subscription; at 31 December the club owes her a year of membership.'
