    answer: D
    steps:
      - 'This is prime cost in the manufacturing account.'
      - 'Rule: prime cost is the total of direct costs: direct materials, direct labour and direct expenses, the costs that can be traced straight to each unit made.'
      - '$\text{Prime cost} = \text{Direct materials} + \text{Direct labour} + \text{Direct expenses}$. Factory overheads are then added to give production cost.'
      - 'A furniture maker in Ibadan can trace the wood and the carpenter''s wages to each chair; those are its prime cost. The factory rent cannot be traced to one chair.'
      - 'Remember: prime means first; the direct costs come first in the manufacturing account.'
      - 'The trap is B, overhead cost. Overheads are exactly the costs that cannot be traced to each unit.'
    hint: 'What is the total of all the direct costs called?'
    why:
      A: 'Partly manufactured goods are work-in-progress, not a kind of cost.'
      B: 'Overheads are indirect costs, which cannot be traced to each unit.'
      C: 'Total factory expenses include indirect costs as well as direct ones.'

  28:
    answer: B
    steps:
      - 'This is an indirect cost (factory overhead).'
      - 'Rule: an indirect cost is a cost of running production that cannot be traced to any one unit, such as factory rent, factory power, supervisors'' wages and depreciation of machines.'
      - '$\text{Production cost} = \text{Prime cost} + \text{Factory overheads}$, so indirect costs are added after prime cost.'
      - 'A bakery in Ibadan pays for diesel to run its generator; the diesel helps every loaf get baked but is not part of any one loaf, so it is an indirect cost.'
      - 'Remember: direct goes into the product; indirect helps it get made.'
      - 'The trap is D, direct cost, which is the opposite: a direct cost does form part of the product.'
    hint: 'A cost that helps production but cannot be traced to each unit is called what?'
    why:
      A: 'Prime cost is the total of direct costs, which do form part of the product.'
      C: 'Total cost includes both direct and indirect costs, and selling costs too.'
      D: 'A direct cost does form part of the product.'

