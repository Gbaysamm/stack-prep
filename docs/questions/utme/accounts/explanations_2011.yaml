format_version: 1
exam_year: 2011
subject: ACC
explanations:
  2:
    answer: C
    steps:
      - 'This is the historical development of accounting, how the subject grew from simple records to modern financial reporting.'
      - 'The rule the texts teach: accounting is a product of its environment. It changes as the society, its trade and its laws change, so each age shapes the accounting it needs.'
      - 'Stewardship records in ancient estates gave way to double entry when Italian merchants traded on credit (Luca Pacioli wrote it down in 1494), and company reporting grew when joint-stock companies and company law arrived.'
      - 'In Nigeria, a market woman in Onitsha keeps a simple notebook of who owes her, while a bank in Lagos must publish audited accounts under company law. The same subject takes the shape its environment demands.'
      - 'Remember: accounting grows where it is planted; the environment shapes the books.'
      - 'The trap is A, debit and credit terms. Accounting does use debit and credit, but that is its method, not what its history reveals about it.'
    hint: 'What does the long story of accounting show about why it keeps changing?'
    why:
      A: 'Debit and credit describe how accounts are kept, not what the history of accounting shows.'
      B: 'Accounting grew from the needs of trade and society as a whole, not from financial development alone.'
      D: 'This says nothing about how accounting developed; it is a vague claim, not a lesson of its history.'

  3:
    answer: B
    steps:
      - 'This is the trial balance, a list of every ledger balance on its debit or credit side.'
      - 'Rule: debit balances are expenses, assets and drawings; credit balances are liabilities, income and capital.'
      - 'Income (sales, commission received, rent received) is credited when earned, so it shows a credit balance. Liabilities (creditors, loans) are credited when the debt arises, so they too show credit balances.'
      - 'A pharmacy in Ibadan lists sales ₦900,000 and creditors ₦120,000 in its trial balance; both go in the credit column.'
      - 'Remember DEAD CLIC: Debits are Expenses, Assets, Drawings; Credits are Liabilities, Income, Capital.'
      - 'The trap is A, debited and credited respectively. Only expenses and assets sit on the debit side; income sits with liabilities on the credit side.'
    hint: 'Say DEAD CLIC. Which half holds income and liabilities?'
    why:
      A: 'Income is not debited; it is credited, like liabilities.'
      C: 'Liabilities are not debited; they are credited, like income.'
      D: 'Debit balances are expenses, assets and drawings, not income and liabilities.'

  4:
    answer: A
    steps:
      - 'This is the principle of double entry, the base of all book keeping.'
      - 'Rule: every transaction has two sides, so every debit entry has an equal credit entry.'
      - 'Because each amount is entered twice, once on each side, total debits always equal total credits. When the balances are listed, the trial balance agrees, which proves the arithmetical accuracy of the books.'
      - 'A bakery in Ibadan buys flour for ₦50,000 cash: debit purchases ₦50,000, credit cash ₦50,000. Both columns of the trial balance rise by ₦50,000.'
      - 'Remember: two entries, equal amounts, so the two columns agree.'
      - 'The trap is C, increases in assets and liabilities. Some transactions do raise both, but many do not; a cash purchase lowers one asset and raises an expense.'
    hint: 'If every debit has an equal credit, what must happen when all the balances are listed?'
    why:
      B: 'Double entry records the bank balance but does not make sure there is one.'
      C: 'Many transactions do not raise assets and liabilities; double entry only keeps the two sides equal.'
      D: 'The cash account is balanced like any other account; double entry is about the whole set of books agreeing.'

  5:
    answer: A
    steps:
      - 'This is balancing a ledger account, finding what is left on it at the end of a period.'
      - 'Rule: first add up both sides, then take the smaller total from the bigger, then put the difference on the smaller side as the balance carried down, so both sides show the same total.'
      - 'That is II (add both sides), then I (deduct the smaller from the bigger), then III (put the difference on the smaller side). It is brought down on the other side as the opening balance.'
      - 'A cash account in an Onitsha shop shows debits ₦80,000 and credits ₦65,000. Add each side, take ₦65,000 from ₦80,000 to get ₦15,000, and enter "Balance c/d ₦15,000" on the credit side. Both sides now total ₦80,000.'
      - 'Remember: add, subtract, then fill the gap.'
      - 'The trap is D, I, II and III. You cannot deduct one side from the other before you have added each side up.'
    hint: 'You cannot find a difference between two totals until you have the totals.'
    why:
      B: 'It subtracts before adding the sides and adds them up last.'
      C: 'It places the balance before the difference has been worked out.'
      D: 'It subtracts before the two sides have been added up.'

  6:
    answer: D
    steps:
      - 'This is the trial balance, and the total asked for is the total of either column, which must be the same.'
      - 'Rule (DEAD CLIC): expenses, assets and purchases go in the debit column; sales, liabilities and capital go in the credit column.'
      - 'Debit: lighting ₦400 + purchases ₦3,000 + debtors ₦50 = ₦3,450. Credit: sales ₦1,200 + capital ₦2,250 = ₦3,450.'
      - 'Check: the two columns agree at ₦3,450, so that is the total of the trial balance.'
      - 'A provisions shop in Aba lists its balances at the month end. If debits and credits both come to ₦3,450, its books agree.'
      - 'Remember: one column total is the trial balance total; never add the two columns together.'
      - 'The trap is A, ₦4,250, which comes from adding numbers from both columns. A trial balance total is the total of one side.'
    hint: 'Put each balance on its side first. What does each column add up to?'
    why:
      A: 'Adds balances from both sides together; the total of each side is ₦3,450.'
      B: 'Does not come from either column; each side totals ₦3,450.'
      C: 'Mixes items from both columns; each side totals ₦3,450.'

  7:
    answer: B
    steps:
      - 'This is the journal (the general journal), a book of original entry for transactions that go into no other day book.'
      - 'Rule: the journal is ruled with five columns: date, particulars (with the narration), folio, debit and credit.'
      - 'The debit and credit amount columns stand side by side, so each entry shows the account to be debited, the account to be credited, the two amounts and a short narration.'
      - 'A Kano trader buys a delivery van on credit from Abuja Motors for ₦4,000,000. The journal shows the date, "Motor van Dr / Abuja Motors Cr", the folios and ₦4,000,000 in both the debit and credit columns.'
      - 'Remember: D P F D C, Date, Particulars, Folio, Debit, Credit; five fingers on one hand.'
      - 'The trap is A, six columns. It adds a separate "amount" column, but the amounts are already the debit and credit columns.'
    hint: 'Count the columns: date, particulars, folio, and then how many money columns?'
    why:
      A: 'There is no separate amount column; the debit and credit columns are the amounts.'
      C: 'Has one money column only; the journal needs both a debit and a credit column.'
      D: 'Has a single amount column, so it cannot show the debit and the credit side by side.'

  8:
    answer: C
    steps:
      - 'This is the suspense account.'
      - 'Rule: when a trial balance does not agree, the difference is put into a suspense account so that final accounts can go ahead; the account is cleared as each error is found and put right.'
      - 'If debits are ₦500 more than credits, suspense is credited ₦500. When the error (say, sales undercast by ₦500) is found, debit suspense ₦500 and credit sales ₦500, and suspense closes.'
      - 'A pharmacy in Enugu finds its trial balance short by ₦2,000 on the credit side. It opens a suspense account for ₦2,000 while the clerks look for the error.'
      - 'Remember: suspense holds the difference in suspense until the errors are found.'
      - 'The trap is D, ledger account. Every account is a ledger account; the special one that holds a trial balance difference is suspense.'
    hint: 'Where does the difference wait while the clerk hunts for the error?'
    why:
      A: 'The debtors'' account records amounts owed by customers, not trial balance differences.'
      B: 'The creditors'' account records amounts owed to suppliers, not trial balance differences.'
      D: 'All accounts are ledger accounts; the one that holds a difference is the suspense account.'

  9:
    answer: A
    steps:
      - 'These are trade discount and cash discount.'
      - 'Rule: trade discount comes off the list price first and is never entered in the books. Cash discount is then allowed on the net invoice for paying promptly.'
      - 'Trade discount = 10% of ₦400 = ₦40, so the net invoice is ₦400 − ₦40 = ₦360. Cash discount = 15% of ₦360 = ₦54. Amount paid = ₦360 − ₦54 = ₦306.'
      - 'Check: ₦306 + ₦54 = ₦360, the debt in the books, and ₦360 + ₦40 = ₦400, the list price.'
      - 'A Kaduna shop orders from a wholesaler at list price, gets 10% off as a trader, and a further discount for paying within a week. The second discount is on what it owes, not on the list price.'
      - 'Remember: trade first, then cash, and cash is on the net.'
      - 'The trap is B, ₦300. It takes both discounts on the list price; cash discount is worked on the net invoice of ₦360.'
    hint: 'Take off the trade discount first. What is the cash discount worked on?'
    why:
      B: 'Takes the cash discount on the list price (₦60) instead of on the net invoice (₦54).'
      C: 'Leaves out the trade discount and takes the cash discount on the list price.'
      D: 'Takes off only the trade discount; ₦360 is the debt before the cash discount.'

  10:
    answer: B
    steps:
      - 'This is cash discount, an allowance for paying promptly.'
      - 'Rule: cash discount is worked on the net invoice, which is the list price less trade discount.'
      - 'Net invoice = ₦400 − 10% of ₦400 = ₦400 − ₦40 = ₦360. Cash discount = 15% of ₦360 = $0.15 \times 360 = 54$, so ₦54.'
      - 'Check: ₦54 is less than ₦60, as it must be, because 15% is taken of a smaller amount than the list price.'
      - 'In Adamu Stores'' books the ₦54 is discount received, credited to the discount received account; in Mu''azu Beverages'' books it is discount allowed.'
      - 'Remember: trade discount never reaches the ledger; cash discount does.'
      - 'The trap is A, ₦60, which is 15% of the list price. The trade discount must come off first.'
    hint: 'Find the net invoice after the trade discount, then take 15% of it.'
    why:
      A: 'Takes 15% of the list price; cash discount is on the net invoice of ₦360.'
      C: 'Is the trade discount, 10% of ₦400, not the cash discount.'
      D: 'Adds the trade discount and 15% of the list price; the cash discount alone is ₦54.'

  11:
    answer: A
    steps:
      - 'These are timing differences in bank reconciliation.'
      - 'Rule: a timing difference arises when a transaction reaches one record before the other, so it is found by comparing the cash book with the bank statement.'
      - 'Unpresented cheques are in the cash book but not yet on the bank statement. Uncredited lodgements are in the cash book but not yet credited by the bank. Standing orders and bank charges are on the statement before the cash book.'
      - 'A Lagos firm pays a supplier by cheque on 30 June; the supplier banks it on 3 July. On the June statement the cheque is missing, though it is in the firm''s cash book.'
      - 'Remember: timing means two records, one early and one late.'
      - 'The trap is D, cash book only. A timing difference needs both records, because it is the gap between them.'
    hint: 'A difference in timing is a gap between which two records?'
    why:
      B: 'The bank statement alone cannot show a timing gap; it must be compared with the cash book.'
      C: 'Only the cash book and the bank statement are compared; other records do not cause the timing gap.'
      D: 'The cash book alone shows no gap; the gap is between it and the bank statement.'

  12:
    answer: A
    steps:
      - 'This is cheque clearing.'
      - 'Rule: clearing is the process by which banks exchange the cheques drawn on one another, settle the amounts between themselves, and so credit the payee and debit the drawer.'
      - 'A cheque paid into Bank X but drawn on Bank Y goes through the clearing house. Bank Y checks it and pays, and Bank X then credits its customer. Until then the lodgement is "uncredited".'
      - 'A school in Abeokuta pays a supplier with a cheque drawn on its own bank; the supplier lodges it in a different bank, and the two banks settle it through the Nigerian clearing system run under the Central Bank.'
      - 'Remember: cheques clear between banks; accounts reconcile between records.'
      - 'The trap is B, truncation. Cheque truncation is a way of clearing by sending an image of the cheque instead of the paper, a method within clearing, not the name of the process itself.'
    hint: 'What is the name of the system through which banks exchange each other''s cheques?'
    why:
      B: 'Truncation replaces the paper cheque with an image; it is a method used within clearing, not the process itself.'
      C: 'Holding a cheque means keeping it back; it is not the process of settling between banks.'
      D: 'Confirmation is checking that a cheque is genuine; it is only a step, not the whole process.'

  13:
    answer: D
    steps:
      - 'This is updating the cash book (the adjusted cash book) before a bank reconciliation.'
      - 'Rule: items the bank has entered but the cash book has not (bank charges, interest charged, standing orders, credit transfers) are entered in the cash book. Interest charged is a payment, so it goes on the credit (bank) side.'
      - 'An overdraft is a credit balance in the cash book. Crediting the interest adds to it: overdraft ₦20,000 + interest ₦1,500 = adjusted overdraft ₦21,500.'
      - 'Check: the bank statement already shows ₦21,500 overdrawn, because the bank charged the interest itself. Now both records agree on this item.'
      - 'A Port Harcourt contractor runs an overdraft; the bank adds its interest at the month end, and the contractor''s accountant must add that interest to the overdraft in the cash book.'
      - 'Remember: whichever book is missing the entry is the book you change.'
      - 'The trap is A, the bank statement balance. It already includes the interest; adding it again would count it twice.'
    hint: 'Which record already has the interest, and which one still lacks it?'
    why:
      A: 'The bank statement already includes the interest, so adding it there would count it twice.'
      B: 'The adjusted cash book balance is the result after the interest has been added, not the figure it is added to.'
      C: 'There is no aggregate balance; the interest goes to the overdraft in the cash book.'

  14:
    answer: A
    steps:
      - 'These are current liabilities, in the balance sheet (now called the statement of financial position).'
      - 'Rule: current liabilities are debts the business must pay within one year, such as creditors (now called payables), bank overdraft and accrued expenses.'
      - 'Sort the five items: stock (I) and cash at bank (IV) are current assets; furniture (II) is a fixed asset; creditors (III) and bank overdraft (V) are current liabilities.'
      - 'A provisions shop in Onitsha owes its wholesaler ₦300,000 for goods and has an overdraft at its bank; both must be paid within the year.'
      - 'Remember: current liabilities are bills due this year.'
      - 'The trap is C, IV and V. A bank overdraft is a current liability, but cash at bank is an asset the business owns.'
    hint: 'Which two items does the business owe, not own?'
    why:
      B: 'Furniture is a fixed asset, not a liability.'
      C: 'Cash at bank is a current asset, though the bank overdraft is a current liability.'
      D: 'Stock is a current asset and furniture a fixed asset; neither is owed.'

  15:
    answer: D
    steps:
      - 'These are current assets, in the balance sheet (statement of financial position).'
      - 'Rule: current assets are cash, or items that will turn into cash within a year in the normal course of trade: stock (now inventory), debtors (receivables), cash at bank and cash in hand.'
      - 'Of the five items, stock (I) and cash at bank (IV) are current assets. Furniture (II) is a fixed asset; creditors (III) and the bank overdraft (V) are liabilities.'
      - 'A bakery in Ibadan holds flour in stock and money in its bank account; the flour will be baked and sold within days, so both are current.'
      - 'Remember: current assets circulate, stock becomes debtors, debtors become cash, and cash buys stock again.'
      - 'The trap is B, II and I. Stock is current, but furniture is kept for years to run the business, so it is a fixed asset.'
    hint: 'Which items will turn into cash within the year?'
    why:
      A: 'Creditors and the bank overdraft are liabilities, not assets.'
      B: 'Furniture is a fixed asset, kept for use, not for turning into cash.'
      C: 'Cash at bank is current, but the bank overdraft is a liability.'

  16:
    answer: A
    steps:
      - 'This is the classification of expenses in the profit and loss account (statement of profit or loss).'
      - 'Rule: administrative expenses are the costs of running the office and premises; selling and distribution expenses are the costs of selling; financial expenses are the costs of borrowing and discounts; tax is charged on the profit.'
      - 'Repairs on the office building are an administrative expense. Interest on a loan is a financial expense, discount allowed is a financial (or selling) expense, and tax comes after profit is found.'
      - 'A firm of lawyers in Abuja fixes the leaking roof of its office for ₦150,000; that is charged to administration.'
      - 'Remember: admin keeps the house running; finance pays for the money; selling gets the goods out.'
      - 'The trap is B, interest paid on a loan. It is a cost of borrowing, so it is a financial expense, not an administrative one.'
    hint: 'Which expense is about keeping the business premises in working order?'
    why:
      B: 'Interest on a loan is a financial expense, the cost of borrowing.'
      C: 'Discount allowed is a financial or selling expense, given to customers for prompt payment.'
      D: 'Tax is charged on the profit, not on the administration of the firm.'

  17:
    answer: C
    steps:
      - 'These are the methods of stock valuation and their effect on profit.'
      - 'Rule: the lower the cost of sales, the higher the gross profit. Whichever method charges the cheapest units to cost of sales gives the highest profit.'
      - 'When prices are falling, the oldest stock is the dearest and the newest is the cheapest. LIFO (last in, first out) issues the newest, cheapest units, so cost of sales is lowest and profit highest. FIFO issues the old, dear units and gives the lowest profit; the averages fall between.'
      - 'If a Kano grain dealer bought maize at ₦50,000 a bag in January and ₦40,000 in March, a bag sold in April costs ₦40,000 under LIFO but ₦50,000 under FIFO, so LIFO shows ₦10,000 more profit on it.'
      - 'Remember: when prices fall, LIFO is the lighter cost; when prices rise, FIFO is. (LIFO is no longer allowed under IAS 2, but its effect is still examined.)'
      - 'The trap is A, FIFO. FIFO gives the higher profit when prices are rising, not when they are falling.'
    hint: 'In falling prices, which units are the cheapest, the old or the new?'
    why:
      A: 'In falling prices FIFO charges the old, dear stock, so it gives the lowest profit.'
      B: 'The simple average lies between FIFO and LIFO, so its profit is not the highest.'
      D: 'The weighted average also lies between FIFO and LIFO, so its profit is not the highest.'

  18:
    answer: C
    steps:
      - 'This is the trading account, the first part of the statement of profit or loss.'
      - 'Rule: the trading account is debited with the cost of sales (opening stock, purchases, carriage inwards) and credited with sales (less returns inwards).'
      - 'Gross profit is the credit side (sales) less the debit side (cost of sales). Closing stock is also shown, either credited or deducted from the debit side.'
      - 'A shoe seller at Aba market sells ₦2,000,000 of shoes in the year; that figure stands on the credit side of her trading account.'
      - 'Remember: what comes in from customers is credited; what goes into the goods is debited.'
      - 'The trap is A, returns outwards. Returns outwards reduce purchases on the debit side; they are not a credit to the trading account.'
    hint: 'Which item is income from selling goods?'
    why:
      A: 'Returns outwards are deducted from purchases on the debit side.'
      B: 'Carriage on sales (carriage outwards) is a selling expense in the profit and loss account.'
      D: 'Purchases are part of the cost of sales on the debit side.'

  19:
    answer: C
    steps:
      - 'This is a stock record (stores ledger card), counting units in and out.'
      - 'Rule: units on hand = opening units + purchases − returns to suppliers − sales.'
      - 'Opening 100. Add 200 (July 8) = 300. Less 160 (July 10) = 140. Less 80 returned (July 17) = 60. Add 200 (July 18) = 260. Less 180 (July 20) = 80. Add 200 (July 28) = 280. Less 120 (July 29) = 160. Less 100 (July 30) = 60.'
      - 'Check by totals: in = 100 + 200 + 200 + 200 = 700; out = 160 + 80 + 180 + 120 + 100 = 640; 700 − 640 = 60.'
      - 'A cement dealer in Abuja keeps a card for each product and counts the bags at the month end to see that the card agrees.'
      - 'Remember: returns outwards leave the store just like sales.'
      - 'The trap is A, 80. That is the balance after July 20; there are two more sales after the last purchase.'
    hint: 'Add every purchase and take away every sale and return, to the very last date.'
    why:
      A: '80 is the balance after July 20, before the later purchase and two sales.'
      B: '100 is the opening stock, not the closing balance.'
      D: '160 is the balance after July 29, before the July 30 sale of 100 units.'

  20:
    answer: B
    steps:
      - 'This is FIFO (first in, first out) stock valuation.'
      - 'Rule: under FIFO the oldest units are issued first, so the stock left is from the latest purchases.'
      - 'Before July 10 the store holds 100 units at ₦90 and 200 at ₦95. The sale of 160 takes all 100 at ₦90 and 60 at ₦95. Left: 200 − 60 = 140 units at ₦95.'
      - 'Value = $140 \times 95 = 13{,}300$, so ₦13,300. Check: the store held ₦9,000 + ₦19,000 = ₦28,000; the units issued cost ₦9,000 + ₦5,700 = ₦14,700; ₦28,000 − ₦14,700 = ₦13,300.'
      - 'A pharmacy in Enugu sells its oldest drugs first so they do not expire, which is FIFO in real life.'
      - 'Remember: first in, first out, so the last in are still on the shelf.'
      - 'The trap is D, ₦12,600, which values the 140 units at the old price of ₦90. Under FIFO the ₦90 units went out first.'
    hint: 'Issue the 160 units from the oldest layer first. What price are the units left at?'
    why:
      A: 'Values 160 units at ₦90; 140 units are left, all at ₦95.'
      C: 'Values 160 units at ₦95; only 140 units are left.'
      D: 'Values the 140 units at ₦90, but under FIFO the ₦90 units were issued first.'

  21:
    answer: C
    steps:
      - 'This is the classification of ledger accounts into personal, real and nominal.'
      - 'Rule: personal accounts are for people and firms; real accounts are for property and assets you can see or own, such as plant, buildings and stock; nominal accounts are for expenses, income, gains and losses.'
      - 'Plant is a tangible asset, so its account is a real account. Expenses and income are nominal; a prepayment is an adjustment to an expense account.'
      - 'A block-making firm in Ibadan keeps a "Plant and machinery" account for its block-moulding machine; it is a real account.'
      - 'Remember: real means really there, you can touch it.'
      - 'The trap is A, prepayment. It is shown as an asset, but it comes from an expense account, which is nominal.'
    hint: 'Which of these could you walk up to and touch?'
    why:
      A: 'A prepayment is an expense paid in advance; it arises from a nominal account.'
      B: 'Expenses are recorded in nominal accounts.'
      D: 'Income is recorded in nominal accounts.'

  22:
    answer: D
    steps:
      - 'This is the control account (total account): the sales ledger control and the purchases ledger control.'
      - 'Rule: a control account repeats, in totals, everything posted to a ledger of personal accounts. Its balance must equal the total of the balances in that ledger.'
      - 'If the sales ledger control shows ₦450,000 but the debtors'' balances add to ₦446,000, the ledger clerk has made an error. So the control account checks the accuracy of the ledger clerks'' work, helps locate errors and helps prevent fraud.'
      - 'In a Lagos distributor with 500 customers, the chief accountant keeps the control account while a clerk keeps the sales ledger; each month the two totals are compared.'
      - 'Remember: control accounts control the clerks.'
      - 'The trap is C, monitoring the books of original entry. The control account is built from the day books, but what it checks is the personal ledger.'
    hint: 'A control account''s balance is compared with the total of which ledger, kept by whom?'
    why:
      A: 'All transactions are recorded in the books of original entry and ledger, not in a control account.'
      B: 'Direct deposits are recorded in the cash book and bank statement, not a control account.'
      C: 'The day books supply the control account''s totals; the control account checks the ledgers, not the day books.'

  23:
    answer: B
    steps:
      - 'This is finding a missing figure in incomplete records, using the gross profit margin.'
      - 'Rule: margin is gross profit as a percentage of sales. So $\text{Cost of goods sold} = \text{Sales} \times (100\% - \text{Margin})$.'
      - 'Gross profit = 20% of ₦10,600 = ₦2,120. Cost of goods sold = ₦10,600 − ₦2,120 = ₦8,480, the same as 80% of ₦10,600.'
      - 'Check: $\dfrac{2{,}120}{10{,}600} \times 100 = 20\%$, the margin given.'
      - 'A trader in Jos who keeps no full books knows she sells everything at a margin of 20%; from her sales she can work out what the goods cost her.'
      - 'Remember: margin is on sales (the selling price); mark-up is on cost.'
      - 'The trap is C, ₦2,320, which is not the cost of sales at all; the gross profit is ₦2,120 and the cost of sales is the larger part, ₦8,480.'
    hint: 'If 20% of sales is gross profit, what per cent of sales is the cost of the goods?'
    why:
      A: '₦4,800 does not come from the data; 80% of ₦10,600 is ₦8,480.'
      C: '₦2,320 is close to the gross profit, not the cost of sales; cost of sales is ₦8,480.'
      D: '₦9,900 is too large; cost of sales is ₦10,600 less 20% of it, ₦8,480.'

  24:
    answer: C
    steps:
      - 'This is net profit from incomplete records.'
      - 'Rule: $\text{Net profit} = \text{Gross profit} - \text{Expenses}$, and depreciation is one of the expenses.'
      - 'Gross profit = 20% of ₦10,600 = ₦2,120. Depreciation = 10% of ₦5,000 = ₦500. Expenses = rent ₦200 + depreciation ₦500 = ₦700. Net profit = ₦2,120 − ₦700 = ₦1,420.'
      - 'Check: ₦8,480 cost of sales + ₦700 expenses + ₦1,420 profit = ₦10,600, the sales.'
      - 'A Jos trader with a delivery van must charge the van''s wear and tear each year, even though no cash leaves her purse for it.'
      - 'Remember: gross minus every expense, cash or not.'
      - 'The trap is B, ₦1,920, which takes off the rent but forgets the depreciation of ₦500.'
    hint: 'Find gross profit first. Which two expenses come off it?'
    why:
      A: 'Takes off depreciation but forgets the rent of ₦200.'
      B: 'Takes off the rent but forgets the depreciation of ₦500.'
      D: 'Is the gross profit, before any expense is taken off.'

  25:
    answer: D
    steps:
      - 'This is average stock, the figure used for the rate of stock turnover.'
      - 'Rule: $\text{Average stock} = \dfrac{\text{Opening stock} + \text{Closing stock}}{2}$.'
      - 'Opening stock ₦32,000 and closing stock ₦9,000: $\dfrac{32{,}000 + 9{,}000}{2} = \dfrac{41{,}000}{2} = 20{,}500$, so ₦20,500.'
      - 'Check: ₦20,500 lies between ₦9,000 and ₦32,000, as an average must.'
      - 'A supermarket in Abuja divides its cost of sales by its average stock to see how many times a year its shelves are emptied and refilled.'
      - 'Remember: average stock is the stock at the two ends, added and halved.'
      - 'The trap is B, ₦23,000, which is opening stock minus closing stock, not their average.'
    hint: 'Pick out the opening and closing stock only. What do you do with two figures to find their average?'
    why:
      A: 'Does not come from averaging ₦32,000 and ₦9,000.'
      B: 'Subtracts closing stock from opening stock instead of averaging them.'
      C: 'Does not come from averaging ₦32,000 and ₦9,000.'

