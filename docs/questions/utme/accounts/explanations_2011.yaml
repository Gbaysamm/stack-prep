    answer: C
    steps:
      - 'This is the cost of goods sold (cost of sales) in the trading account.'
      - 'Rule: $\text{Cost of goods sold} = \text{Opening stock} + \text{Net purchases} - \text{Closing stock}$, where net purchases are purchases plus carriage inwards less returns outwards.'
      - 'Net purchases = ₦40,000 + ₦1,000 − ₦2,000 = ₦39,000. Goods available for sale = ₦32,000 + ₦39,000 = ₦71,000. Cost of goods sold = ₦71,000 − ₦9,000 = ₦62,000.'
      - 'Check: ₦62,000 + ₦9,000 left = ₦71,000 available.'
      - 'A Kano textile trader pays a lorry ₦1,000 to bring cloth to her shop; that carriage inwards is part of the cost of the cloth.'
      - 'Remember: carriage inwards is added to purchases; returns outwards come off; sales play no part.'
      - 'The trap is A, ₦61,000, which leaves out the carriage inwards. Carriage inwards is part of the cost of getting goods into the shop.'
    hint: 'Build net purchases first: what is added, and what is taken off?'
    why:
      A: 'Leaves out the carriage inwards of ₦1,000.'
      B: 'Does not come from the data; the cost of goods sold is ₦71,000 − ₦9,000 = ₦62,000.'
      D: 'Does not come from the data; it is ₦5,000 short of ₦62,000.'

