format_version: 1
exam_year: 2012
subject: ACC
explanations:
  2:
    answer: A
    steps:
      - 'This is the historical cost concept, also called the cost concept, one of the basic accounting concepts.'
      - 'The rule: assets are recorded and valued at what they cost when they were bought, not at what the owner thinks they are worth today.'
      - 'If a machine cost ₦500,000 and a valuer now says it would fetch ₦650,000, the books still show ₦500,000 (less depreciation). Cost is a fact on an invoice that anyone can check.'
      - 'A bakery in Ibadan bought its oven for ₦800,000 in 2010. Its balance sheet carries the oven at that cost less depreciation, even though a new oven now costs far more.'
      - 'Remember: "cost is fact, value is opinion", so the books keep the fact.'
      - 'The trap is B, the business entity concept. It is a real concept, but it says the business is separate from its owner; it says nothing about how assets are valued.'
    hint: 'Which concept says an asset stays in the books at the price paid for it?'
    why:
      B: 'Business entity keeps the business separate from its owner; it is not a basis of valuing assets.'
      C: 'Periodicity divides the life of the business into accounting periods, such as a year.'
      D: 'Materiality says small items need not be treated with full precision; it does not value assets.'

  3:
    answer: A
    steps:
      - 'This is about the qualities of an accountant, which go beyond keeping records.'
      - 'Record keeping already covers posting, casting (adding up) and preparing the final accounts. On top of that, an accountant must apply professional competence: the skill, knowledge and judgement the profession expects, kept up to date.'
      - 'The ethics of the profession (ICAN and ANAN in Nigeria) list professional competence and due care with integrity, objectivity and confidentiality as what a member owes the public.'
      - 'An ICAN member auditing a Lagos company does not just add up figures; he judges whether the accounts follow the standards and gives a professional opinion.'
      - 'Remember: records are the hands of accounting; professional competence is the head.'
      - 'The trap is B, the accuracy of postings. Accurate posting matters, but it is part of record keeping itself, not something beyond it.'
    hint: 'Three of the options are parts of record keeping. Which one is not?'
    why:
      B: 'Accurate posting is part of record keeping, which the stem has already named.'
      C: 'Casting means adding up figures, a routine part of keeping the records.'
      D: 'Preparing the balance sheet is the end of the record-keeping work, not a separate quality.'

  4:
    answer: C
    steps:
      - 'This is the double entry rule for increases.'
      - 'Debit an increase in assets or expenses; credit an increase in capital or liabilities. Every debit has an equal credit.'
      - 'When an owner pays ₦100,000 into the business, the asset cash rises (debit cash) and capital rises (credit capital). So the debit goes to the asset and the credit to capital.'
      - 'A pharmacist in Enugu starts her shop with ₦100,000: debit cash ₦100,000, credit capital ₦100,000.'
      - 'Remember "DEAD CLIC": Debits are Expenses, Assets, Drawings; Credits are Liabilities, Income, Capital.'
      - 'The trap is D, debit capital and credit assets. That is the entry for a decrease in both, such as the owner taking money out for good.'
    hint: 'Assets rise on which side? Capital rises on which side?'
    why:
      A: 'An increase in capital is a credit, not a debit.'
      B: 'An increase in liabilities is a credit, and an increase in assets is a debit; this is the wrong way round.'
      D: 'Debiting capital and crediting assets records a fall in both, not an increase.'

  5:
    answer: B
    steps:
      - 'This is the capital account, the owner''s claim on the business.'
      - 'Capital is what the business owes its owner, so it behaves like a liability: it increases on the credit side and decreases on the debit side.'
      - 'When the owner brings in more money: debit cash (the asset rises), credit capital (capital rises). Net profit for the year is also credited to capital; drawings are debited.'
      - 'A provisions trader in Onitsha adds ₦200,000 of her savings to her shop: debit cash ₦200,000, credit capital ₦200,000. Her capital has gone up by a credit.'
      - 'Remember "DEAD CLIC": Capital is a Credit.'
      - 'The trap is C, debiting the cash account. Cash is debited in the same transaction, but that records the money coming in, not the rise in capital.'
    hint: 'Capital is owed to the owner. On which side does something owed increase?'
    why:
      A: 'Debiting capital reduces it, as drawings or a loss do.'
      C: 'Debiting cash records the cash received; the increase in capital itself is the credit to capital.'
      D: 'Crediting cash means money has gone out, which does not raise capital.'

  6:
    answer: C
    steps:
      - 'This is the purchase of a fixed asset for cash.'
      - 'The asset received is debited; the asset given up is credited. Motor van comes in, cash goes out.'
      - 'Debit motor van account, credit cash account, with the same amount. Akirika''s own name is not used, because the business is separate from its owner.'
      - 'A transporter in Aba buys a van for ₦3 million cash: debit motor van ₦3,000,000, credit cash ₦3,000,000.'
      - 'Remember: debit what comes in, credit what goes out.'
      - 'The trap is A, credit Akirika. Akirika paid with the business''s cash, so the cash account is credited, not the owner.'
    hint: 'What came into the business, and what went out of it?'
    why:
      A: 'The business paid in cash, so cash is credited; Akirika is not owed anything.'
      B: 'Nothing was sold, so the sales account has no part in this entry.'
      D: 'This is the wrong way round; it records selling the van for cash.'

  7:
    answer: B
    steps:
      - 'This is a credit sale, posted in the seller''s books.'
      - 'In the seller''s books, the customer who owes is debited (a debtor, an asset) and the sales account is credited (income).'
      - 'Ibrahim debits Jide''s account ₦12,000 and credits sales account ₦12,000. The goods are not given their own "sugar account"; all goods sold go to sales.'
      - 'A sugar dealer at Kano''s Sabon Gari market sells 10 bags on credit to a customer: debit the customer, credit sales.'
      - 'Remember: debit the receiver, credit the giver. Jide receives the goods; the sales account gives them.'
      - 'The trap is A, debit sugar account and credit Jide. That turns the entry upside down and invents a sugar account.'
    hint: 'Who now owes Ibrahim money?'
    why:
      A: 'Jide receives the goods and owes money, so he is debited, not credited; goods sold go to sales, not a sugar account.'
      C: 'Ibrahim does not open an account for himself in his own books for a sale.'
      D: 'Ibrahim is the owner of these books, and goods sold go to sales, not a sugar account.'

  8:
    answer: A
    steps:
      - 'This is the same sale seen from the buyer''s books, a credit purchase.'
      - 'In the buyer''s books, goods bought for resale are debited to purchases, and the supplier who is owed is credited (a creditor, a liability).'
      - 'Jide debits purchases ₦12,000 and credits Ibrahim ₦12,000.'
      - 'A shop in Kaduna buys stock on credit from a wholesaler: debit purchases, credit the wholesaler.'
      - 'Remember: one transaction, two books, mirror entries. Ibrahim debits Jide; Jide credits Ibrahim.'
      - 'The trap is B, credit sugar account. The person owed is Ibrahim, so it is his account that is credited.'
    hint: 'In Jide''s books, who is now owed money?'
    why:
      B: 'The supplier Ibrahim is owed, so his account is credited, not a sugar account.'
      C: 'Jide does not debit himself in his own books, and purchases is debited, not credited.'
      D: 'Ibrahim is the creditor, so he is credited, not debited.'

  9:
    answer: B
    steps:
      - 'This is balancing the bank columns of a cash book.'
      - 'Add each side. The difference is the balance; it is written on the smaller side as balance c/d and brought down on the bigger side.'
      - 'Debit side: $2{,}600 + 28{,}200 = 30{,}800$. Credit side: $15{,}000 + 1{,}250 + 7{,}600 = 23{,}850$. Balance: $30{,}800 - 23{,}850 = 6{,}950$.'
      - 'The debit side is bigger, so the balance b/d is ₦6,950 debit: money in the bank. Check: $23{,}850 + 6{,}950 = 30{,}800$.'
      - 'A tailor in Ilorin paid in ₦30,800 and wrote cheques for ₦23,850; she still has ₦6,950 in the bank.'
      - 'Remember: the balance comes down on the heavier side. A debit balance in the bank column is money in the bank.'
      - 'The trap is A, ₦6,950 credit. The figure is right, but a credit balance would mean an overdraft; here more came in than went out.'
    hint: 'Total each side. Which side is heavier?'
    why:
      A: 'The amount is right, but more came in than went out, so the balance is a debit, not a credit.'
      C: '₦6,000 does not come from the totals; 30,800 − 23,850 is 6,950.'
      D: '₦6,000 is the wrong figure; the difference between the sides is ₦6,950.'

  10:
    answer: B
    steps:
      - 'This is a dishonoured cheque in a three-column cash book.'
      - 'When a customer''s cheque is paid in, the bank column is debited. If the bank dishonours it (it "bounces"), that debit must be reversed: credit the bank column and debit the customer again.'
      - 'Entry: debit customer (debtor) account, credit cash book, bank column. Any discount allowed on it is reversed too.'
      - 'A shop in Port Harcourt banks a ₦50,000 cheque from a customer and it bounces: credit bank ₦50,000, debit the customer ₦50,000, who owes again.'
      - 'Remember: a bounced cheque bounces back out of the bank column, to the credit side.'
      - 'The trap is A, bank column debit. That is where the cheque went when it was received; the dishonour reverses it.'
    hint: 'The cheque was first debited to the bank column. How do you cancel that?'
    why:
      A: 'The debit was made when the cheque was received; dishonour reverses it with a credit.'
      C: 'A cheque passes through the bank column, not the cash column.'
      D: 'The cash column records notes and coins; a cheque goes through the bank column.'

  11:
    answer: A
    steps:
      - 'This is a trade discount, shown in a day book.'
      - 'A trade discount is a reduction off the list price, given to traders who buy to resell. It is deducted on the invoice and in the day book, and never posted to a discount account.'
      - 'Here the goods total ₦8,800; 5% is $0.05 \times 8{,}800 = ₦440$, so the net sale is ₦8,360. Only ₦8,360 goes to sales and to the debtor.'
      - 'A wholesaler in Onitsha''s main market gives retailers 5% off his list price on every invoice; that is trade discount.'
      - 'Remember: trade discount is in the day book; cash discount is in the cash book. A cash discount is for paying quickly, and only appears when cash is paid.'
      - 'The trap is B, cash discount. A cash discount is recorded in the cash book when payment is made, not in the day book with the goods.'
    hint: 'In which book does each kind of discount appear?'
    why:
      B: 'A cash discount is for prompt payment and is recorded in the cash book, not the day book.'
      C: 'Discount allowed is a cash discount given to debtors, recorded in the cash book.'
      D: 'Discount received is a cash discount from suppliers, recorded in the cash book.'

  12:
    answer: D
    steps:
      - 'This is about the instruments used to withdraw cash from a bank account.'
      - 'An ATM (automated teller machine) card, a debit card, is linked to the holder''s own account. Put it in an ATM with the PIN and cash comes out of that account.'
      - 'A bank teller in Nigeria is the deposit slip used to pay money in; a credit card is mainly for buying on credit; a recharge card buys airtime.'
      - 'A student in Nsukka uses his ATM card at the campus machine to take out ₦10,000 from his savings account.'
      - 'Remember: teller to pay in, ATM card to take out.'
      - 'The trap is A, a bank teller. The teller is the slip for lodging money, the opposite of drawing it out.'
    hint: 'Which card takes money out of your own account at a machine?'
    why:
      A: 'A bank teller is the slip used to pay money into an account, not to draw it out.'
      B: 'A credit card is for buying on credit; it does not draw on the holder''s own deposit.'
      C: 'A recharge card buys telephone airtime; it has nothing to do with a bank account.'

  13:
    answer: A
    steps:
      - 'This is an electronic funds transfer in modern banking.'
      - 'A transfer moves money from the payer''s (transferor''s) account to the payee''s. The bank can only move money that is there, so the account must hold enough funds.'
      - 'If Ada has ₦5,000 in her account and tries to transfer ₦20,000, the bank declines it: "insufficient funds".'
      - 'A trader in Ibadan can send money by mobile app to a supplier in Kano who banks elsewhere, but only up to the balance in her account.'
      - 'Remember: no funds, no transfer.'
      - 'The trap is B, no account with the beneficiary''s bank. Transfers between different banks go through every day, through NIBSS instant payments.'
    hint: 'What must be in the payer''s account before any money can leave it?'
    why:
      B: 'Transfers between different banks are routine, so the payer need not bank where the payee does.'
      C: 'People living abroad can still transfer money from their Nigerian accounts.'
      D: 'A transfer moves a bank balance; the transferor does not need to hold cash notes.'

  14:
    answer: B
    steps:
      - 'This is the adjusted (updated) cash book, written before the bank reconciliation statement.'
      - 'Items the bank has recorded but the cash book has not are put into the cash book: direct credits increase the balance; dishonoured cheques and direct debits reduce it.'
      - 'Start with ₦5,000. Dishonoured cheque: $5{,}000 - 1{,}000 = 4{,}000$. Direct credit: $4{,}000 + 800 = 4{,}800$. Direct debit: $4{,}800 - 500 = 4{,}300$.'
      - 'Check with a T account: debit $5{,}000 + 800 = 5{,}800$; credit $1{,}000 + 500 = 1{,}500$; balance $5{,}800 - 1{,}500 = ₦4{,}300$ debit.'
      - 'A chemist in Jos finds his bank has paid in ₦800 of interest but taken ₦500 for charges, and a customer''s ₦1,000 cheque bounced; his true bank balance is ₦4,300.'
      - 'Remember: money the bank gave you goes up; money the bank took or refused goes down.'
      - 'The trap is A, ₦6,300. It adds the dishonoured cheque, but a bounced cheque is money the business never got.'
    hint: 'Which of the three items brings money in, and which take it away?'
    why:
      A: 'Adds the dishonoured cheque; a bounced cheque reduces the balance.'
      C: 'Takes the direct credit away and adds the direct debit, the wrong way round for both.'
      D: 'Takes the direct credit away; money the bank received for you increases the balance.'

  15:
    answer: D
    steps:
      - 'This is gross profit in the trading account (now part of the statement of profit or loss).'
      - 'Rule: $\text{Gross profit} = \text{Net sales} - \text{Cost of goods sold}$.'
      - 'Cost of goods sold: $20{,}000 + 250{,}000 - 40{,}000 = 230{,}000$. Gross profit: $370{,}000 - 230{,}000 = ₦140{,}000$.'
      - 'Check: $230{,}000 + 140{,}000 = 370{,}000$, the net sales. Rent is not used yet; it is an expense for net profit.'
      - 'A fabric shop at Balogun sells ₦370,000 of cloth that cost it ₦230,000; its gross profit is ₦140,000 before paying the shop rent.'
      - 'Remember: gross is from trading only, before any expense.'
      - 'The trap is B, ₦230,000. That is the cost of goods sold, one step short of the answer.'
    hint: 'Gross profit compares sales with what the goods sold cost.'
    why:
      A: '₦370,000 is net sales; the cost of the goods sold must be taken away.'
      B: '₦230,000 is the cost of goods sold, not the profit.'
      C: '₦150,000 is not net sales less cost of goods sold; 370,000 − 230,000 is 140,000.'

  16:
    answer: C
    steps:
      - 'This is net profit in the profit and loss account.'
      - 'Rule: $\text{Net profit} = \text{Gross profit} - \text{Expenses}$.'
      - 'Gross profit is ₦140,000 (net sales ₦370,000 less cost of goods sold ₦230,000). The only expense is rent, ₦35,000. Net profit: $140{,}000 - 35{,}000 = ₦105{,}000$.'
      - 'Check: $230{,}000 + 35{,}000 + 105{,}000 = 370{,}000$, so cost of goods sold, expenses and profit together use up all the sales.'
      - 'The Balogun fabric shop makes ₦140,000 on its cloth and pays ₦35,000 rent, so it keeps ₦105,000.'
      - 'Remember: gross minus expenses is net.'
      - 'The trap is D, ₦115,000. That takes rent from ₦150,000 instead of from the true gross profit of ₦140,000.'
    hint: 'Find gross profit first, then take away the expense.'
    why:
      A: '₦35,000 is the rent itself, not the profit.'
      B: '₦40,000 is the closing stock, not a profit figure.'
      D: '₦115,000 takes rent from ₦150,000; the gross profit is ₦140,000.'

  17:
    answer: B
    steps:
      - 'These are errors that affect profit: a revenue posted as an expense, and an expense posted as revenue.'
      - 'Each such error moves profit twice. Revenue shown as an expense leaves the revenue out and adds an expense, so profit is understated by twice the amount; an expense shown as revenue overstates profit by twice the amount.'
      - 'Revenue error: $2 \times 15{,}000 = 30{,}000$ too low, so add ₦30,000. Expense error: $2 \times 4{,}000 = 8{,}000$ too high, so take away ₦8,000.'
      - 'Adjusted net profit: $180{,}000 + 30{,}000 - 8{,}000 = ₦202{,}000$.'
      - 'A caterer in Abuja posted ₦15,000 of fees received as an expense and ₦4,000 of fuel as income; her true profit is ₦202,000, not ₦180,000.'
      - 'Remember: wrong side means double the effect, once to remove it, once to put it right.'
      - 'The trap is C, ₦195,000. It moves each figure only once: $180{,}000 + 15{,}000$, ignoring that each error counts twice and that the expense error lowers profit.'
    hint: 'If revenue was treated as an expense, by how much was profit understated?'
    why:
      A: '₦210,000 puts the revenue error right but forgets to take away ₦8,000 for the expense error.'
      C: '₦195,000 adds the ₦15,000 once only and ignores the expense error.'
      D: '₦184,000 just adds ₦4,000; it does not follow either error through.'

  18:
    answer: B
    steps:
      - 'This is putting right one error that affects profit: revenue recorded as an expense.'
      - 'Two things went wrong. The ₦15,000 was charged as an expense, which cut profit by ₦15,000; and it was left out of revenue, which lost another ₦15,000.'
      - 'To put it right, remove the false expense (+₦15,000) and add the revenue (+₦15,000): $15{,}000 + 15{,}000 = ₦30{,}000$.'
      - 'A barber in Ilorin records ₦15,000 received for a training course as "expenses". His profit was too low by ₦30,000, not ₦15,000.'
      - 'Remember: an item on the wrong side moves profit by twice its amount.'
      - 'The trap is C, ₦15,000. It puts back only one half of the error.'
    hint: 'The ₦15,000 was taken away when it should have been added. How far is profit from where it should be?'
    why:
      A: '₦34,000 also adds the ₦4,000, which belongs to the other error and lowers profit.'
      C: '₦15,000 corrects only one side of the mistake.'
      D: '₦4,000 is the other error, an expense recorded as revenue.'

  19:
    answer: C
    steps:
      - 'This is an intangible asset, an asset with no physical form.'
      - 'Intangible assets have value because of the rights they give, not because they can be touched: goodwill, patents, trademarks, copyrights.'
      - 'A trademark is the legal right to a name or logo. It brings in customers, so it is an asset, but it cannot be seen or handled.'
      - 'The name and logo of a well-known Nigerian noodle or beverage brand is a trademark worth a great deal to its owner.'
      - 'Remember: if you cannot kick it, but it still earns money, it is intangible.'
      - 'The trap is A, motor vehicles. They are fixed assets, but tangible ones, because they have a physical body.'
    hint: 'Which item has value but no physical body?'
    why:
      A: 'Motor vehicles are tangible fixed assets; they can be seen and touched.'
      B: 'Debtors are a current asset, amounts owed by customers.'
      D: 'Gratuity is a payment due to staff when they leave, a liability or expense, not an asset.'

  20:
    answer: B
    steps:
      - 'This is FIFO, first in, first out, a method of stock valuation.'
      - 'Under FIFO, goods issued are taken from the oldest stock first, so what is left is valued at the latest prices.'
      - 'Before 9/5/07: 100 bags at ₦10.00 and 60 bags at ₦11.50. The 85 bags issued come from the 1/5 lot, leaving $100 - 85 = 15$ bags at ₦10.00 and all 60 at ₦11.50.'
      - 'Value: $15 \times 10.00 = 150.00$ and $60 \times 11.50 = 690.00$; total $₦840.00$. Check: 15 + 60 = 75 bags, and 100 + 60 − 85 = 75.'
      - 'A provisions store in Owerri sells its oldest tins of milk first so they do not expire; its stock left is the newer, dearer tins.'
      - 'Remember: FIFO, oldest out, newest left.'
      - 'The trap is D, ₦750.00. That is LIFO: issuing the newest bags first leaves 75 bags at ₦10.00.'
    hint: 'Which lot do the 85 bags come from under first in, first out?'
    why:
      A: '₦862.50 values all 75 bags at ₦11.50, as if the old ₦10.00 bags were gone.'
      C: '₦806.25 values the 75 bags at the average price ₦10.75, not by FIFO.'
      D: '₦750.00 is the LIFO figure, 75 bags at ₦10.00.'

  21:
    answer: B
    steps:
      - 'This is the simple average method of pricing issues.'
      - 'Rule: issue price = sum of the unit prices of the lots in stock ÷ number of lots. The quantities in each lot are not used (that would be the weighted average).'
      - 'After the 9/5/07 issue, 15 bags at ₦10.00 and 60 bags at ₦11.50 remain; on 15/5/07, 180 bags at ₦12.80 arrive. So on 22/5/07 three lots are in stock.'
      - 'Simple average: $\dfrac{10.00 + 11.50 + 12.80}{3} = \dfrac{34.30}{3} = 11.4333$, so ₦11.43 per bag.'
      - 'Check: ₦11.43 lies between the lowest price, ₦10.00, and the highest, ₦12.80, as an average must.'
      - 'Remember: simple average adds the prices, weighted average adds the money.'
      - 'The trap is C, ₦12.08. That is the weighted average, the value of stock ₦3,080.25 divided by 255 bags.'
    hint: 'Which lots still have bags in stock on 22/5/07? Average their prices.'
    why:
      A: '₦10.75 is the simple average for the 9/5/07 issue, when only two lots were in stock.'
      C: '₦12.08 is the weighted average (₦3,080.25 ÷ 255 bags), not the simple average.'
      D: '₦12.15 leaves out the 15 bags still held at ₦10.00.'

  22:
    answer: B
    steps:
      - 'This is LIFO, last in, first out, compared with FIFO.'
      - 'Under LIFO the newest goods are issued first, so goods issued (the cost of sales) are charged at the latest, current prices; closing stock is left at older prices.'
      - 'When prices are rising, charging current prices to cost of sales gives a profit that matches today''s costs, so the business does not overstate profit and pay out too much.'
      - 'If a bakery in Ibadan buys flour at ₦30,000 a bag in January and ₦38,000 in March, LIFO charges its bread at the ₦38,000 price, the cost of replacing the flour.'
      - 'Remember: last in, first out, so the latest price goes out first.'
      - 'The trap is A, previous prices. That describes FIFO''s issues, which come from the oldest stock.'
    hint: 'Under LIFO, which purchase are issues taken from?'
    why:
      A: 'Issues at previous (older) prices is FIFO, not LIFO.'
      C: 'Average rates belong to the simple or weighted average method.'
      D: 'No standard method charges issues at a flat rate.'

  23:
    answer: B
    steps:
      - 'This is returns inwards (sales returns) in the sales ledger control account (total debtors account).'
      - 'The control account copies, in total, what happens to the debtors. A return from a customer reduces what he owes, so debtors are credited; the other entry debits the returns inwards (sales returns) account.'
      - 'Entry: debit returns inwards, credit sales ledger control account. So in the control account it is a credit item.'
      - 'A wholesaler in Aba takes back ₦20,000 of faulty shoes from a retailer: debit returns inwards ₦20,000, credit the retailer (and the control account) ₦20,000.'
      - 'Remember: anything that makes a debtor owe less is a credit in the sales ledger control account.'
      - 'The trap is A, debited and debtors credited. Returns inwards is debited in its own account, but in the control account, which stands for debtors, it is a credit.'
    hint: 'Does a return make the customer owe more or less?'
    why:
      A: 'Inside the control account the return reduces debtors, so it is a credit there, not a debit.'
      C: 'Cash is not involved when goods are simply returned.'
      D: 'An entry cannot credit both sides, and no bank money moves.'

  24:
    answer: C
    steps:
      - 'This is the purchases ledger control account.'
      - 'It summarises, in totals, all the creditors'' accounts in the purchases ledger, so it is also called the creditors control account or total creditors account.'
      - 'Credit side: credit purchases (from the purchases day book) and the opening balance. Debit side: payments, discount received, returns outwards. Its balance should equal the total of the creditors'' balances.'
      - 'A supermarket in Lekki with 200 suppliers checks its purchases ledger by comparing the creditors control account with the total of the 200 balances.'
      - 'Remember: purchases ledger = creditors, sales ledger = debtors.'
      - 'The trap is B, the purchases day book. It supplies the credit purchases figure to the control account, but it is a book of original entry, not the control account.'
    hint: 'Whom does the purchases ledger hold accounts for?'
    why:
      A: 'The sales day book lists credit sales, a book of original entry.'
      B: 'The purchases day book is a book of original entry that feeds the control account.'
      D: 'The debtors ledger is the sales ledger, the opposite of the purchases ledger.'

  25:
    answer: B
    steps:
      - 'This is the sales ledger control account (total debtors account).'
      - 'Debit side: opening debtors, credit sales, dishonoured cheques, interest charged. Credit side: cash and cheques received, discount allowed, returns inwards, bad debts, bills receivable.'
      - 'A dishonoured cheque was first credited to debtors when it came in. When it bounces, the debtor owes again, so the control account is debited.'
      - 'A customer in Ilorin pays ₦30,000 by cheque, and it bounces; the ₦30,000 goes back on the debit side of the debtors control account.'
      - 'Remember: what makes a debtor owe more is a debit.'
      - 'The trap is D, bills receivable. A bill received settles the debt for now, so it is a credit, just like cash.'
    hint: 'Which item makes a customer owe money again?'
    why:
      A: 'Cheques received reduce what debtors owe, so they are credited.'
      C: 'Discount allowed reduces what debtors owe, so it is credited.'
      D: 'Bills receivable replace the debt, so they are credited to the control account.'

  26:
    answer: B
    steps:
