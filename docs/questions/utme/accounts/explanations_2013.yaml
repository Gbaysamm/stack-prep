format_version: 1
exam_year: 2013
subject: ACC
explanations:
  2:
    answer: A
    steps:
      - 'This is about the objectives of book keeping and accounting, what accounting information is for.'
      - 'The first aim of accounting is to keep a permanent, orderly record of every business transaction, so that nothing depends on memory and the owner can later find out profit, assets and debts.'
      - 'Every sale, purchase, payment and receipt is written in a book of original entry, posted to the ledger and kept. From that permanent record the trial balance and final accounts are drawn up.'
      - 'A provisions shop in Onitsha that records every sale in a day book can tell, months later, exactly what Mama Chika bought on credit and when. Without the record the shop would be guessing.'
      - 'Remember: accounting starts with a record; no record, no accounts.'
      - 'The trap is C, audited reports. Only companies must be audited, and an audit checks the records after they are kept; it is not what accounting information as a whole seeks to provide.'
    hint: 'What must exist before any report, analysis or audit can be made?'
    why:
      B: 'Analysis of accounts is done for the owner and other users, not given out to trade debtors.'
      C: 'Audited reports are a later check on a company''s accounts, not the basic aim of all accounting information.'
      D: 'Data about employees is personnel information, not the main purpose of accounting.'

  3:
    answer: C
    steps:
      - 'This is balancing a ledger account.'
      - 'To balance an account, add both sides. If the debit side is bigger, the difference is a debit balance; if the credit side is bigger, it is a credit balance.'
      - 'Say a debtor''s account shows debits of ₦8,000 and credits of ₦5,000. The balance carried down is placed on the smaller (credit) side, ₦3,000, and brought down on the debit side as a debit balance of ₦3,000.'
      - 'A pharmacy in Ibadan sold drugs on credit to Mr Ade for ₦8,000 and he paid ₦5,000. His account in the pharmacy''s ledger has a debit balance of ₦3,000, money he still owes.'
      - 'Remember: the balance takes the name of the bigger side.'
      - 'The trap is A, overdrawn. Only a bank account can be overdrawn, and in the cash book an overdraft shows as a credit balance, not a debit balance.'
    hint: 'When one side is bigger, which side does the balance brought down appear on?'
    why:
      A: 'Overdrawn applies only to a bank account, and in the cash book an overdraft is a credit balance.'
      B: 'A bigger debit side does not mean anything was understated; it is simply the balance.'
      D: 'A credit balance arises when the credit side is the bigger one.'

  4:
    answer: C
    steps:
      - 'This is the double entry for capital, the owner starting the business with cash.'
      - 'Rule: debit the account that receives value and credit the account that gives value. The cash account receives the money; the capital account records what the business now owes the owner.'
      - 'Double entry: debit cash account ₦10,500; credit capital account ₦10,500. Check with the accounting equation: assets (cash ₦10,500) = capital ₦10,500.'
      - 'When Musa opens a phone-accessories stall in Kano with ₦10,500 of his own money, the stall''s cash goes up and the stall owes Musa ₦10,500 as capital.'
      - 'Remember DEAD CLIC: Debits are Expenses, Assets, Drawings; Credits are Liabilities, Income, Capital. Cash is an asset (debit); capital is capital (credit).'
      - 'The trap is A, debit capital and credit cash. That is the entry turned round; it would show cash going out of the business.'
    hint: 'Which account receives the money, and which account shows what the business owes the owner?'
    why:
      A: 'This reverses the entry, as if cash left the business and capital fell.'
      B: 'No bank account is involved; the owner brought in cash.'
      D: 'Nothing was bought; the owner brought in capital.'

  5:
    answer: A
    steps:
      - 'This is the double entry for paying a creditor, Agromachinex.'
      - 'Rule: the creditor''s account receives the payment, so it is debited; cash gives the value, so cash is credited.'
      - 'Double entry: debit Agromachinex account ₦6,000; credit cash account ₦6,000. Check: assets fall by ₦6,000 (cash) and liabilities fall by ₦6,000 (the creditor), so the accounting equation still balances.'
      - 'A poultry farm in Ogun owed a feed supplier ₦6,000. When the farm pays in cash, the supplier''s account is cleared and the cash box is lighter by ₦6,000.'
      - 'Remember: pay a creditor, debit the creditor; the money leaves through the credit side of cash.'
      - 'The trap is B, debit equipment and credit Agromachinex. That is the entry made when the equipment was first bought on credit, not when the debt is paid.'
    hint: 'Who receives the ₦6,000, and which account does the money leave from?'
    why:
      B: 'This records buying equipment on credit, not paying off the debt.'
      C: 'This is the entry for the owner bringing in capital, not a payment.'
      D: 'The payment settles an old debt; no new purchase is made.'

  6:
    answer: B
    steps:
      - 'This is the sales day book, one of the books of original entry.'
      - 'Every credit sale is first written in the sales day book (sales journal) from the copy of the sales invoice. Cash sales go to the cash book instead.'
      - 'At the end of the period the sales day book is added up. That total is the credit sales for the period, and it is posted to the credit of sales account, while each customer''s account is debited.'
      - 'A cement dealer in Aba writes each credit sale to a builder in the sales day book. At month end she adds the column and knows her credit sales at once.'
      - 'Remember: credit sales, sales day book; cash sales, cash book.'
      - 'The trap is A, the cash book. It records only money received or paid, so it shows cash sales, not credit sales.'
    hint: 'Which book of original entry is written up from sales invoices?'
    why:
      A: 'The cash book records cash sales and receipts, not credit sales.'
      C: 'The petty cash book records small expenses paid in cash.'
      D: 'The returns inwards book records goods sent back by customers, not sales.'

  7:
    answer: B
    steps:
      - 'This is about source documents, the papers from which entries are made.'
      - 'Wages are paid by the hour or by the day, so the employer needs a record of the time each worker put in. That record is the clock card or time sheet.'
      - 'Gross wages = hours worked × rate per hour. For 45 hours at ₦500 an hour, wages are 45 × ₦500 = ₦22,500. Without the hours, the sum cannot be done.'
      - 'In a Lagos block-moulding yard, each labourer''s hours are written in the time book every day, and on Friday the owner pays from it.'
      - 'Remember: wages follow the hours; salaries follow the month.'
      - 'The trap is A, the nominal roll. It lists who works there, but it does not say how many hours each one worked.'
    hint: 'To work out a worker''s wages, what must you multiply by the rate per hour?'
    why:
      A: 'The nominal roll lists the staff but gives no hours, so it cannot fix wages.'
      C: 'Effort is not recorded on any document and cannot be measured in naira.'
      D: 'The number of dependants does not decide wages.'

  8:
    answer: D
    steps:
      - 'This is capital expenditure, as against revenue expenditure.'
      - 'Capital expenditure is spending to buy a fixed asset or to add to one, which will be used for more than a year. Revenue expenditure is the day-to-day cost of running the business.'
      - 'Office machinery will serve the business for years, so it is a fixed asset shown in the balance sheet (statement of financial position). Maintenance, stationery and carriage inwards are used up within the year and go to the trading or profit and loss account.'
      - 'A secondary school in Enugu that buys a new photocopier has made capital expenditure. The toner and repairs it pays for each term are revenue expenditure.'
      - 'Remember: buy the machine, capital; keep it running, revenue.'
      - 'The trap is A, maintenance of office machine. It has the word machine in it, but it only keeps an existing asset working; it adds nothing new.'
    hint: 'Which item buys something the business will use for many years?'
    why:
      A: 'Maintenance only keeps an existing machine working, so it is revenue expenditure.'
      B: 'Stationery is used up quickly, so it is revenue expenditure.'
      C: 'Carriage inwards is part of the cost of goods bought for resale, a revenue item.'

  9:
    answer: C
    steps:
      - 'This is the double entry for receipts in the cash book.'
      - 'The cash book is itself a ledger account. The debit side holds money received; each receipt from a person (a debtor) has its other half on the credit side of that person''s account in the ledger.'
      - 'If Bisi pays ₦4,000: debit cash book ₦4,000; credit Bisi''s account in the sales ledger ₦4,000. Every debit in the cash book is matched by a credit in the ledger.'
      - 'A tailor in Ibadan receives ₦4,000 from a customer who owed her. She writes it on the receipts side of her cash book and credits the customer''s account, which clears the debt.'
      - 'Remember: cash in, debit cash book, credit the payer in the ledger.'
      - 'The trap is A, credit real accounts. Real accounts are for property such as furniture and vehicles; a receipt from a person is posted to that person''s personal account in the ledger.'
    hint: 'The cash book was debited. Where must the matching credit go?'
    why:
      A: 'Real accounts record property, not the people who pay the business.'
      B: 'A debit in the cash book needs a credit elsewhere, not another debit.'
      D: 'Debiting the ledger as well would give two debits and no credit.'

  10:
    answer: D
    steps:
      - 'This is cash discount allowed, recorded in the books of Saka, who receives the money.'
      - 'Saka gives the discount, so it is a loss (expense) to him: debit discount allowed account. Alaka''s debt is reduced by the discount, so credit Alaka''s account.'
      - 'Discount = 10% × ₦15,000 = ₦1,500. Cash received = ₦15,000 − ₦1,500 = ₦13,500. In Saka''s books: debit cash ₦13,500 and discount allowed ₦1,500; credit Alaka ₦15,000. Check: ₦13,500 + ₦1,500 = ₦15,000, so Alaka''s account is cleared.'
      - 'A Kano grain merchant lets a customer pay early and knocks off ₦1,500. That ₦1,500 is discount allowed, an expense in the merchant''s profit and loss account.'
      - 'Remember: the seller allows, the buyer receives.'
      - 'The trap is A, discount received. That is how Alaka records the same discount in his own books, not how Saka records it.'
    hint: 'In whose books are we, and did that person give or receive the discount?'
    why:
      A: 'Discount received is the entry in Alaka''s books, the one who pays.'
      B: 'This reverses the entry and calls it discount received, which is wrong for the seller.'
      C: 'Saka does not keep an account for himself in his own ledger.'

  11:
    answer: D
    steps:
      - 'This is the imprest system of keeping petty cash.'
      - 'Under the imprest system the petty cashier is given a fixed float at the start. At the end of each period the main cashier reimburses exactly what was spent, so the float is restored to the same fixed amount.'
      - 'Take a float of ₦20,000. If ₦13,500 is spent in the month, the petty cashier holds ₦6,500 and is given ₦13,500, bringing the float back to ₦20,000. So III is true and II is false, because the sum given at the end varies with spending.'
      - 'Each business picks its own float to suit its small expenses, so I is false. The fixed float and the vouchers that must account for every naira give control over petty cash, so IV is true.'
      - 'In a Port Harcourt office the petty cashier pays for diesel, stamps and drinks from a ₦20,000 float and is topped up every Friday by what she spent.'
      - 'Remember: imprest means top up what was spent, back to the same float.'
      - 'The trap is C, II and IV. Statement II sounds right, but the fixed sum is given only at the start; at the end the cashier gets the amount spent.'
    hint: 'At the end of the period, does the petty cashier get a fixed sum or what was spent?'
    why:
      A: 'I is false, because firms choose different floats, and II is false, because the end-of-period payment equals what was spent.'
      B: 'I is false: the imprest amount differs from one organization to another.'
      C: 'II is false: the end-of-period payment is the amount spent, which varies.'

  12:
    answer: C
    steps:
      - 'This is straight line depreciation, which charges the same amount every year.'
      - 'Formula: $\text{Yearly depreciation} = \dfrac{\text{Cost} - \text{Scrap value}}{\text{Useful life}}$.'
      - 'Data: cost ₦35,000, scrap value ₦9,000, life 5 years. Working: $\dfrac{35{,}000 - 9{,}000}{5} = \dfrac{26{,}000}{5} = ₦5{,}200$.'
      - 'Check: 5 years × ₦5,200 = ₦26,000 written off, and ₦35,000 − ₦26,000 = ₦9,000, the scrap value left at the end.'
      - 'A bakery in Ibadan buys a ₦35,000 mixer, expects to use it for 5 years and sell it for ₦9,000 as scrap. Each year ₦5,200 of its cost is charged to profit and loss.'
      - 'Remember: take off the scrap first, then share by the years.'
      - 'The trap is B, ₦6,500. That divides ₦26,000 by 4 instead of 5 years.'
    hint: 'Take the scrap value from the cost before you divide by the years.'
    why:
      A: '₦8,800 adds the scrap value to the cost instead of taking it away.'
      B: '₦6,500 divides by 4 years instead of 5.'
      D: '₦4,400 is too small; ₦26,000 ÷ 5 is ₦5,200.'

  13:
    answer: A
    steps:
      - 'This is straight line depreciation again, with a new scrap value.'
      - 'Formula: $\text{Yearly depreciation} = \dfrac{\text{Cost} - \text{Scrap value}}{\text{Useful life}}$.'
      - 'Data: cost ₦35,000, scrap value now ₦15,000, life 5 years. Working: $\dfrac{35{,}000 - 15{,}000}{5} = \dfrac{20{,}000}{5} = ₦4{,}000$.'
      - 'Check: 5 × ₦4,000 = ₦20,000, and ₦35,000 − ₦20,000 = ₦15,000, the new scrap value. A higher scrap value leaves less to write off, so the charge falls from ₦5,200 to ₦4,000, as it should.'
      - 'If the Ibadan bakery expects to sell its old mixer for ₦15,000 instead of ₦9,000, it loses less on the machine, so each year''s charge is smaller.'
      - 'Remember: the bigger the scrap value, the smaller the yearly depreciation.'
      - 'The trap is B, ₦7,000. That is ₦35,000 ÷ 5, which forgets to take off the scrap value.'
    hint: 'What is left to write off after the new scrap value is taken from the cost?'
    why:
      B: '₦7,000 divides the full cost by 5 and ignores the scrap value.'
      C: '₦11,000 does not come from (₦35,000 − ₦15,000) ÷ 5.'
      D: '₦24,000 is far more than the whole amount to be written off each year.'

  14:
    answer: B
    steps:
      - 'This is the double entry for goods bought for resale, paid by cheque.'
      - 'Goods bought to sell again are debited to purchases account. Payment by cheque reduces the money in the bank, so bank account is credited.'
      - 'Double entry: debit purchases account ₦305,150; credit bank account ₦305,150. Freehold Enterprises has been paid at once, so no account is opened for it as a creditor.'
      - 'A furniture shop in Abuja buys mattresses from a factory and pays by cheque from its First Bank account. The mattresses are its stock in trade, so they go to purchases.'
      - 'Remember: goods for resale, debit purchases; paid by cheque, credit bank.'
      - 'The trap is D, debit bank and credit Freehold Enterprises. That is the entry for receiving a cheque from Freehold, the opposite of paying them.'
    hint: 'Goods for resale go to which account, and a cheque comes out of which account?'
    why:
      A: 'Sales account is for goods sold, not goods bought.'
      C: 'Cash was not received; a cheque was paid out, and Freehold is not owed anything.'
      D: 'This would record a cheque received from Freehold, not one paid to them.'

  15:
    answer: C
    steps:
      - 'This is the gross profit in the trading account (now part of the statement of profit or loss).'
      - 'Rule: $\text{Gross profit} = \text{Sales} - \text{Cost of sales}$, where $\text{Cost of sales} = \text{Opening stock} + \text{Purchases} + \text{Carriage inwards} - \text{Closing stock}$. Carriage outwards, discount received and expenses go to profit and loss, not trading.'
      - 'Cost of sales = ₦28,000 + ₦128,000 + ₦4,000 − ₦10,000 = ₦150,000.'
      - 'Gross profit = ₦232,000 − ₦150,000 = ₦82,000. Check: ₦150,000 + ₦82,000 = ₦232,000, the sales.'
      - 'A provisions shop in Onitsha pays the lorry ₦4,000 to bring goods from Lagos. That carriage inwards is part of what the goods cost her, so it belongs in cost of sales.'
      - 'Remember: carriage IN goes INto the trading account; carriage OUT goes OUT to profit and loss.'
      - 'The trap is B, ₦86,000. That leaves carriage inwards out of the cost of sales.'
    hint: 'Which of the items belong in the trading account, and which wait for profit and loss?'
    why:
      A: '₦100,000 adds the discount received, which is an income in profit and loss, not trading.'
      B: '₦86,000 leaves carriage inwards out of the cost of sales.'
      D: '₦76,000 takes carriage outwards off in the trading account; it belongs in profit and loss.'

  16:
    answer: C
    steps:
      - 'This is the expenses side (the debit side) of the profit and loss account.'
      - 'Expenses of selling and running the business are debited to profit and loss. Carriage outwards is a selling expense; carriage inwards is part of cost of sales; discount received is an income and is credited.'
      - 'Expenses debited = carriage outwards ₦6,000 + expenses ₦20,000 = ₦26,000.'
      - 'Check: net profit = gross profit ₦82,000 + discount received ₦18,000 − ₦26,000 = ₦74,000, a sensible positive figure.'
      - 'A bakery in Ibadan pays a bike man to deliver bread to customers. That delivery cost is carriage outwards, an expense of selling, so it goes in profit and loss.'
      - 'Remember: income on the credit side, expenses on the debit side; discount received is income.'
      - 'The trap is D, ₦30,000. That wrongly adds carriage inwards, which was already used in the trading account.'
    hint: 'Which items are expenses, and which belong in the trading account or are income?'
    why:
      A: '₦17,000 does not come from adding the expenses in the list.'
      B: '₦23,000 does not match carriage outwards plus the other expenses.'
      D: '₦30,000 adds carriage inwards, which belongs in the trading account.'

  17:
    answer: A
    steps:
      - 'This is closing capital, the owner''s interest at the end of the year.'
      - 'Rule: $\text{Closing capital} = \text{Opening capital} + \text{Capital introduced} + \text{Profit} - \text{Drawings}$.'
      - 'Working: ₦1,500 + ₦500 + ₦800 − ₦250 = ₦2,550.'
      - 'Check: what went in (₦1,500 + ₦500 + ₦800 = ₦2,800) less what came out (₦250) is ₦2,550.'
      - 'A recharge-card seller in Owerri starts with ₦1,500, adds ₦500 more, makes ₦800 profit and takes ₦250 for her lunch. Her stake in the business is now ₦2,550.'
      - 'Remember: capital grows with new money and profit, and shrinks with drawings and losses.'
      - 'The trap is B, ₦2,500. A slip in the adding gives a figure close to the right one; every item must be counted once.'
    hint: 'Add what the owner put in and the profit, then take away what the owner took out.'
    why:
      B: '₦2,500 does not equal ₦1,500 + ₦500 + ₦800 − ₦250.'
      C: '₦2,350 does not equal ₦1,500 + ₦500 + ₦800 − ₦250.'
      D: '₦2,250 does not equal ₦1,500 + ₦500 + ₦800 − ₦250.'

  18:
    answer: B
    steps:
      - 'This is choosing a method of stock valuation.'
      - 'FIFO (first in, first out) assumes the goods bought first are sold first. It suits goods that spoil, because the oldest stock must go out before it rots.'
      - 'A vegetable seller physically sells yesterday''s tomatoes before today''s. Her closing stock is the latest batch, so FIFO values it at the most recent prices, matching what is really on her table.'
      - 'At Mile 12 market in Lagos, a pepper seller who kept old pepper back and sold the fresh ones first would lose the old stock to rot. Perishable goods move first in, first out.'
      - 'Remember: fresh food, first in, first out.'
      - 'The trap is A, LIFO. Last in, first out would mean selling today''s vegetables and leaving the old ones to spoil.'
    hint: 'Which goods must a vegetable seller sell first before they go bad?'
    why:
      A: 'LIFO sells the newest goods first, which would leave old vegetables to rot.'
      C: 'Simple average ignores the order in which perishable goods must leave.'
      D: 'Weighted average is used for goods that are mixed together, such as grain or oil, not perishables sold in order.'

  19:
    answer: B
    steps:
      - 'This is the sales ledger control account and the source of its figures.'
      - 'A control account takes its figures from the totals of the books of original entry. Credit sales come from the sales day book, returns from the returns inwards book, and cash and cheques received from the cash book.'
      - 'Each month the debit (receipts) side of the cash book is added for money from credit customers, and that total is credited to the sales ledger control account.'
      - 'A distributor in Kaduna adds up all the cash and cheques its credit customers paid in March from its cash book, and posts the total to the control account in one line.'
      - 'Remember: money in or out, look in the cash book.'
      - 'The trap is D, the sales journal. It gives the total credit sales, the debit in the control account, not the money received.'
    hint: 'Which book records every naira the business receives?'
    why:
      A: 'The purchases day book gives credit purchases, used in the purchases ledger control account.'
      C: 'The income and expenditure account belongs to clubs and records no customer receipts.'
      D: 'The sales journal gives the credit sales, not the cash received from customers.'

  20:
    answer: B
    steps:
      - 'This is opening capital from a statement of affairs, used when records are incomplete.'
      - 'Rule: $\text{Capital} = \text{Assets} - \text{Liabilities}$. Rates prepaid is an asset (paid in advance); rent owing is a liability (still to pay).'
      - 'Assets at 1/1/2010: rates prepaid ₦2,000 + motor van ₦8,000 + premises ₦10,500 = ₦20,500. Liabilities: creditors ₦9,000 + rent owing ₦3,800 = ₦12,800.'
      - 'Opening capital = ₦20,500 − ₦12,800 = ₦7,700. Check: ₦12,800 + ₦7,700 = ₦20,500, so the statement balances.'
      - 'A barber in Jos who never kept books can still find his capital: list what the shop owns, list what it owes, and subtract.'
      - 'Remember: prepaid is paid ahead, an asset; owing is a debt, a liability.'
      - 'The trap is A, ₦5,700. That leaves out the rates prepaid, which is an asset.'
    hint: 'Sort each item: is it something the business owns or something it owes?'
    why:
      A: '₦5,700 leaves the rates prepaid out of the assets.'
      C: '₦9,800 is the closing creditors figure, not a capital.'
      D: '₦14,900 does not come from opening assets ₦20,500 less liabilities ₦12,800.'

  21:
    answer: C
    steps:
      - 'This is closing capital from the statement of affairs at 31/12/2010.'
      - 'Rule: $\text{Capital} = \text{Assets} - \text{Liabilities}$, using the closing figures.'
      - 'Assets: rates prepaid ₦3,500 + motor van ₦8,000 + premises ₦10,500 = ₦22,000. Liabilities: creditors ₦9,800 + rent owing ₦2,500 = ₦12,300.'
      - 'Closing capital = ₦22,000 − ₦12,300 = ₦9,700. Check: ₦12,300 + ₦9,700 = ₦22,000.'
      - 'The Jos barber repeats his list at the end of the year. His capital has grown from ₦7,700 to ₦9,700, which points to a profit if he took no drawings.'
      - 'Remember: same rule, closing column.'
      - 'The trap is B, ₦9,500. Mixing an opening figure into the closing column gives a figure near the right one.'
    hint: 'Use only the 31/12/2010 column, and put each item on the right side.'
    why:
      A: '₦8,700 does not come from closing assets ₦22,000 less liabilities ₦12,300.'
      B: '₦9,500 mixes opening and closing figures.'
      D: '₦10,700 does not come from closing assets ₦22,000 less liabilities ₦12,300.'

  22:
    answer: D
    steps:
      - 'This is net profit from the change in capital, the incomplete records method.'
      - 'Rule: $\text{Net profit} = \text{Closing capital} - \text{Opening capital} + \text{Drawings}$ (less any new capital, none here).'
      - 'Increase in capital = ₦64,000 − ₦50,000 = ₦14,000. Add back drawings: ₦14,000 + ₦16,000 = ₦30,000.'
      - 'Check: ₦50,000 + ₦30,000 profit − ₦16,000 drawings = ₦64,000, the closing capital.'
      - 'A trader in Onitsha whose capital rose by ₦14,000 also took ₦16,000 home for school fees. Her business must have earned ₦30,000 to do both.'
      - 'Remember: drawings hid part of the profit, so add them back.'
      - 'The trap is B, ₦14,000. That is only the increase in capital; the drawings must be added back.'
    hint: 'The capital went up by some amount. What else did the profit pay for?'
    why:
      A: '₦2,000 takes the increase in capital from the drawings instead of adding them.'
      B: '₦14,000 is only the increase in capital, without the drawings added back.'
      C: '₦20,000 does not come from ₦64,000 − ₦50,000 + ₦16,000.'

  23:
    answer: A
    steps:
      - 'This is profit from incomplete records, by comparing capital.'
      - 'Rule: profit is the growth in capital, plus whatever the owner took out: $\text{Profit} = \text{Closing capital} - \text{Opening capital} + \text{Drawings}$ (less any new capital brought in).'
      - 'If the result is negative, it is a loss. For example, closing ₦40,000 − opening ₦50,000 + drawings ₦4,000 = −₦6,000, a loss of ₦6,000.'
      - 'A roadside mechanic in Benin with no books finds his capital at the start and end of the year from statements of affairs, and works out his profit this way.'
      - 'Remember: close minus open, plus drawings.'
      - 'The trap is B, opening capital less closing capital add drawings. It subtracts the wrong way round, so a growing business would show a loss.'
    hint: 'Profit makes capital grow. Which capital do you start from?'
    why:
      B: 'This subtracts the wrong way round, so a growing business would show a loss.'
      C: 'Adding opening and closing capital does not measure growth.'
      D: 'Adding all three gives a total, not the change in capital.'

  24:
    answer: B
    steps:
      - 'This is the adjusted (closing) capital of a sole trader.'
      - 'Rule: $\text{Closing capital} = \text{Opening capital} + \text{Additional capital} + \text{Net profit} - \text{Drawings}$. A net loss is taken away, like drawings.'
      - 'Working: ₦35,000 + ₦10,000 = ₦45,000. Less net loss ₦2,500 gives ₦42,500. Less drawings ₦3,500 gives ₦39,000.'
