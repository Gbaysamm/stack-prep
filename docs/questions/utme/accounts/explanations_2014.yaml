format_version: 1
exam_year: 2014
subject: ACC
explanations:
  2:
    answer: A
    steps:
      - 'This is the difference between bookkeeping and accounting, the two stages of keeping a business''s financial records.'
      - 'Bookkeeping is the recording stage: it writes every transaction into the books of original entry and the ledger. Accounting goes further: it summarises those records into final accounts, then analyses and interprets them so owners and others can make decisions.'
      - 'So bookkeeping produces the data and accounting explains what the data mean. Bookkeeping comes first, and accounting is built on it.'
      - 'In a bakery in Ibadan, the clerk who writes each day''s flour purchases and bread sales into the books is the bookkeeper. The accountant who reads the year''s figures and tells the owner that profit fell because flour costs rose is doing accounting.'
      - 'Remember: the bookkeeper writes, the accountant reads and explains.'
      - 'The trap is C, which turns the two round. Interpreting is the accountant''s job, not the bookkeeper''s.'
    hint: 'Which comes first, writing the figures down or explaining what they mean?'
    why:
      B: 'Accounting, not bookkeeping, is called the language of business.'
      C: 'This reverses the two; bookkeeping records and accounting interprets.'
      D: 'Summarising and communicating are both parts of accounting, so this does not separate the two.'

  3:
    answer: C
    steps:
      - 'This is the realisation concept, one of the basic accounting concepts.'
      - 'Rule: revenue is recognised, that is counted as earned, when the sale is made, which means when the goods pass to the buyer or the service is done, and not when the cash is collected.'
      - 'So a credit sale made on 28 December belongs to this year''s sales, even if the customer pays in January.'
      - 'A furniture maker in Aba delivers a set of chairs to a school on credit in December. The sale is realised in December, when the chairs are delivered, so it goes into December''s sales.'
      - 'Remember: realised means the sale is real, the goods have changed hands.'
      - 'The trap is A, matching. Matching sets the expenses of a period against the revenue of the same period; it does not decide when the revenue itself is earned.'
    hint: 'Which concept says when a sale becomes real enough to count?'
    why:
      A: 'Matching pairs expenses with the revenue they helped to earn; it does not fix when revenue is earned.'
      B: 'Consistency means using the same methods from year to year.'
      D: 'Going concern assumes the business will carry on into the foreseeable future.'

  4:
    answer: C
    steps:
      - 'This is putting right an error of omission on one side only, using the suspense account.'
      - 'Rule: when only one half of a double entry is missing, the trial balance does not agree, and the difference is put in a suspense account. To put the error right, make the missing entry and take the other side to suspense.'
      - 'The cheque was credited in the cash book (bank column), correctly. The debit to Sulieman''s account was never made, so the debit side of the trial balance was ₦5,000 short and suspense took a debit of ₦5,000. Entry: Dr Sulieman ₦5,000, Cr Suspense ₦5,000. Suspense is now cleared to nil.'
      - 'A pharmacy in Jos pays a supplier by cheque and the clerk writes it in the cash book but forgets the supplier''s ledger page. At the month end the trial balance is out by exactly that cheque, and the debit to the supplier with a credit to suspense puts it right.'
      - 'Remember: if one side was done right, never touch it again; the other half of the fix goes to suspense.'
      - 'The trap is B, bank account. The bank side was already credited; crediting it again would show the cheque paid twice.'
    hint: 'The cash book entry was correct. Which account was holding the difference while the debit was missing?'
    why:
      A: 'The payment was by cheque, and the cash book was already right, so cash is not touched.'
      B: 'The bank side was already credited correctly; a second credit would record the payment twice.'
      D: 'Paying a supplier is not a purchase of goods, and purchases played no part in this error.'

  5:
    answer: D
    steps:
      - 'This is the double entry for buying a fixed asset for cash.'
      - 'Rule: the account that receives value is debited and the account that gives value is credited. The vehicles account receives the vans; cash gives the money, and cash is kept in the cash book.'
      - 'Entry: Dr Motor vehicles ₦6,000,000, Cr Cash (cash book) ₦6,000,000. The vans are a fixed asset (non-current asset in today''s terms), so they never go through the purchases day book, which is only for goods bought on credit for resale.'
      - 'If a transport firm in Kano pays cash for three buses, the cashier writes the payment on the credit side of the cash book and the ledger clerk debits the motor vehicles account.'
      - 'Remember: cash goes out, credit the cash book.'
      - 'The trap is B, the purchases day book. It records goods bought on credit for resale, not assets bought for cash.'
    hint: 'The vans were paid for in cash. Where is every cash payment recorded?'
    why:
      A: 'The sales day book records credit sales, and nothing was sold here.'
      B: 'The purchases day book is for goods bought on credit for resale, not a cash purchase of vans.'
      C: 'A sales subsidiary book records sales, and this was a purchase.'

  6:
    answer: C
    steps:
      - 'This is the error of transposition, one of the types of error in the books.'
      - 'Rule: an error that makes the debit side and the credit side unequal shows up in the trial balance. Errors of omission, commission and original entry each leave both sides equal, so they do not show up.'
      - 'A transposition swaps two digits, such as ₦5,400 written as ₦4,500. If it happens in one account only, one side of the trial balance is ₦900 out and the totals disagree. The difference, 900, divides exactly by 9, which is the sign of a transposition.'
      - 'A shop in Onitsha sells goods for ₦5,400 on credit. The clerk debits the customer ₦5,400 but credits sales ₦4,500. The trial balance will not agree until the swap is found.'
      - 'Remember: a difference that divides by 9 points to a transposition.'
      - 'The trap is A, error of omission. Leaving a transaction out completely leaves out both the debit and the credit, so the two sides still agree.'
    hint: 'Which error puts a different figure on one side from the other?'
    why:
      A: 'A complete omission leaves out both the debit and the credit, so the totals still agree.'
      B: 'An error of commission posts the right amount to the wrong person''s account of the same class, so both sides stay equal.'
      D: 'An error of original entry puts the same wrong figure on both sides, so the totals still agree.'

  7:
    answer: D
    steps:
      - 'This is the division of the ledger.'
      - 'Rule: as a business grows, its one ledger is split into three main ledgers. The sales ledger holds the debtors'' accounts, the purchases ledger holds the creditors'' accounts, and the general ledger holds all the other accounts.'
      - 'The general ledger is often split again into the nominal ledger, for incomes and expenses, and the private ledger, for capital and drawings that the owner wants kept confidential.'
      - 'A wholesaler in Kano with three hundred customers keeps their accounts in the sales ledger, its suppliers in the purchases ledger, and rent, wages, capital and equipment in the general ledger.'
      - 'Remember: S P G, sales, purchases, general.'
      - 'The trap is A. The private ledger is real, but it is part of the general ledger, and A leaves the general ledger out.'
    hint: 'Where do the debtors go, where do the creditors go, and where does everything else go?'
    why:
      A: 'It leaves out the general ledger, which holds every account that is not a debtor or creditor.'
      B: 'The journal and day books are books of original entry, not ledgers.'
      C: 'It leaves out the purchases ledger, where the creditors'' accounts are kept.'

  8:
    answer: B
    steps:
      - 'This is the books of account, where transactions are recorded after they arrive on source documents.'
      - 'Rule: information on source documents (invoices, receipts, credit notes) is first entered in the subsidiary books, also called the books of original entry, then posted to the ledger.'
      - 'So the books of account are made up of the subsidiary books (the day books, the journal and the cash book) and the ledger.'
      - 'In a provisions shop in Onitsha, the invoice from a supplier is the source document. It is written in the purchases day book and then posted to the supplier''s account in the ledger.'
      - 'Remember: document, then day book, then ledger.'
      - 'The trap is A, debit and credit notes. Those are source documents themselves, not books of account.'
    hint: 'After an invoice is received, which books does it pass through?'
    why:
      A: 'Debit and credit notes are source documents, not books of account.'
      C: 'Prepayments and accruals are year-end adjustments, not books.'
      D: 'The profit and loss account and balance sheet are final accounts prepared from the ledger, not where source documents are recorded.'

  9:
    answer: B
    steps:
      - 'This is the double entry for a payment by cheque.'
      - 'Rule: money leaving the bank is credited in the bank column of the cash book, and the person who receives it (the payee) is debited because he receives value.'
      - 'Entry for a cheque of ₦20,000 to a supplier: Cr Cash book (bank column) ₦20,000, Dr Supplier''s account ₦20,000.'
      - 'A school in Enugu pays its stationery supplier by cheque. The bursar credits the bank column and debits the supplier''s account, so the school no longer owes him.'
      - 'Remember: the bank gives, so credit the bank; the payee receives, so debit the payee. The drawer is the business that writes the cheque.'
      - 'The trap is A, which reverses the entry. Debiting the cash book would show money coming in when it is going out.'
    hint: 'Is money coming into or going out of the bank, and who receives it?'
    why:
      A: 'This reverses the entry; a cheque issued takes money out, so the cash book is credited.'
      C: 'Debiting the cash book shows money received, and nothing here goes to suspense.'
      D: 'The cash book side is right, but the debit belongs to the payee, not to suspense.'

  10:
    answer: C
    steps:
      - 'This is cash discount received, a reward for paying a supplier promptly.'
      - 'Rule: cash discount = invoice amount × discount rate, and the cash paid = invoice amount − cash discount. Payment within 5 days is inside the 7 days allowed, so the discount is earned.'
      - 'Discount = ₦22,800 × 12½% = ₦22,800 × 1/8 = ₦2,850. Cash paid = ₦22,800 − ₦2,850 = ₦19,950. This is credited in the cash column; the ₦2,850 goes in the discount column on the credit side.'
      - 'Check: ₦19,950 + ₦2,850 = ₦22,800, the full debt that is cleared.'
      - 'Remember: 12½% is one eighth; divide by 8 for the discount.'
      - 'The trap is B, ₦22,800. That is the debt cleared, but less cash than that leaves the business because of the discount.'
    hint: 'Was the payment made within the discount period? Then take 12½% off before you pay.'
    why:
      A: '₦25,650 adds the discount instead of taking it off.'
      B: '₦22,800 is the full invoice; the discount was earned, so less cash is paid.'
      D: '₦18,240 takes off 20%, not 12½%.'

  11:
    answer: C
    steps:
      - 'This is the imprest system of petty cash.'
      - 'Rule: the chief cashier gives the petty cashier a fixed float, the imprest. The petty cashier pays small expenses from it, and at the end of the period the chief cashier refunds exactly what was spent, bringing the float back to the same figure.'
      - 'Its main advantage is that the chief cashier is freed from paying out many small sums (transport, stamps, tea), so he can deal with the large payments, while the petty cashier handles the small ones.'
      - 'In a pharmacy in Port Harcourt, the petty cashier holds ₦20,000. She pays for bus fares and cleaning soap, and on Friday the chief cashier gives her back what she spent, say ₦14,500, to restore the ₦20,000.'
      - 'Remember: imprest keeps the petty sums away from the chief cashier''s desk.'
      - 'The trap is D. The analysis columns belong to the petty cash book layout; they are not what the imprest system itself achieves.'
    hint: 'Who used to make all those small payments before a petty cashier was given a float?'
    why:
      A: 'The imprest makes checking easier, since cash plus vouchers must equal the float; it does not remove the need to check.'
      B: 'Training staff may happen, but it is not the purpose of the imprest system.'
      D: 'Analysis columns are a feature of the petty cash book, not the advantage of the imprest.'

  12:
    answer: C
    steps:
      - 'This is the petty cash book, the book for small cash payments.'
      - 'Rule: like any cash account, it has a debit side for money received (the imprest and its refills from the chief cashier) and a credit side for money paid out (fares, postage, cleaning), with analysis columns on the credit side.'
      - 'Example of entries: Dr Cash received from chief cashier ₦10,000; Cr Transport ₦1,500; Cr Postage ₦800. The balance, ₦7,700, is carried down on the debit side.'
      - 'A school bursary in Abeokuta records the ₦10,000 float it receives on the left and each small payment on the right.'
      - 'Remember: money in on the left, money out on the right, as in the main cash book.'
      - 'The trap is B. The many payments are on the credit side, but the receipts from the chief cashier are written on the debit side.'
    hint: 'Where are the receipts from the chief cashier written, and where are the payments?'
    why:
      A: 'Payments, which are most of the entries, go on the credit side.'
      B: 'Receipts of the float and its refills go on the debit side, so both sides are used.'
      D: 'A reversed entry is a type of error, not a way of keeping the petty cash book.'

  13:
    answer: D
    steps:
      - 'This is control of branch cash by head office, under branch accounts.'
      - 'Rule: head office stops a branch from hiding takings by keeping branch cash simple to check. Credit sales are made only by, or with the approval of, head office; the branch makes cash sales and banks all its takings intact into head office''s account.'
      - 'If the branch could sell on credit by itself, a dishonest manager could pocket cash and record the sale as a credit sale to a customer who never pays. With credit sales left to head office, every branch sale must appear as cash banked, so the stock sent out and the cash remitted can be checked against each other.'
      - 'A Lagos company with a branch in Ilorin lets the branch sell only for cash. Each evening the takings are banked in the head office account, and head office alone grants credit to big customers.'
      - 'Remember: the branch sells for cash and banks it all; credit is a head office decision.'
      - 'The trap is A. Paying expenses out of the takings is exactly what lets cash disappear before it is remitted; branch expenses should come from an imprest float.'
    hint: 'Which arrangement leaves the branch with only cash sales to account for?'
    why:
      A: 'Paying expenses from the takings lets cash vanish before it is sent in; expenses should come from an imprest float.'
      B: 'Letting the branch buy its own goods weakens head office control over stock and cash.'
      C: 'A separate branch accountant does not stop takings being held back; it gives the branch more freedom, not less.'

  14:
    answer: C
    steps:
      - 'This is the cash book, and which side each item goes on.'
      - 'Rule: the debit side of the cash book records money coming in, and the credit side records money going out.'
      - 'Cash sales (I) and cash receipts (V) bring money in, so they are debits. Cash purchases (II) and cash payments (IV) send money out, so they are credits. Discount received (III) is written in the discount column on the credit side, next to the payment to the supplier.'
      - 'A shop in Onitsha writes the day''s cash sales of ₦35,000 and ₦12,000 received from a debtor on the left. The ₦8,000 paid for goods and the ₦300 discount received from a supplier go on the right.'
      - 'Remember: in on the left, out on the right.'
      - 'The trap is B. Discount received sits beside the payment to the supplier, so it is on the credit side, not the debit side.'
    hint: 'Which items bring money into the business?'
    why:
      A: 'Cash purchases send money out, so they are credited.'
      B: 'Discount received is entered on the credit side, beside the payment to the supplier.'
      D: 'Cash payments send money out, so they are credited.'

  15:
    answer: D
    steps:
      - 'This is one cause of a difference between the cash book and the bank statement.'
      - 'Rule: the bank credits the account when money comes in. Some money reaches the account without the firm knowing at once, such as a direct deposit or credit transfer by a customer, and it is not in the cash book until the statement arrives.'
      - 'When the statement shows a direct deposit of ₦45,000, the firm writes it on the debit side of the cash book to update it (the adjusted cash book).'
      - 'A customer in Abuja pays a Kaduna supplier ₦45,000 by bank transfer straight into its account. The supplier''s cashier only sees it on the bank statement at the month end.'
      - 'Remember: money in that you did not see coming is a direct deposit; money out that you did not see is a charge or a standing order.'
      - 'The trap is C. A standing order takes money out, so it is a debit on the bank statement, not a credit.'
    hint: 'Which item adds money to the account without the firm being told at once?'
    why:
      A: 'Bank charges take money out, so they are debits in the bank statement.'
      B: 'A contract payment is a payment the firm itself makes and records.'
      C: 'A standing order pays money out, so it is a debit in the bank statement.'

  16:
    answer: B
    steps:
      - 'This is the straight line method of depreciation.'
      - 'Rule: the asset''s cost less what it will fetch at the end (the scrap or residual value) is spread equally over its useful life. $\text{Depreciation per year} = \dfrac{\text{Cost} - \text{Scrap value}}{\text{Useful life}}$.'
      - 'Example: a generator costing ₦500,000, scrap value ₦50,000, life 5 years: $\dfrac{500{,}000 - 50{,}000}{5} = ₦90{,}000$ a year, the same every year.'
      - 'A printing press in Ibadan buys a machine and charges the same depreciation each year, so its yearly profit is not distorted by one large cost.'
      - 'Remember: what you paid, less what you will get back, shared by the years.'
      - 'The trap is C. Sales have nothing to do with depreciation; the starting figure is the cost of the asset.'
    hint: 'Depreciation spreads which figure over the years?'
    why:
      A: 'Depreciation starts from cost, not sales, and scrap value is taken away, not added.'
      C: 'Depreciation starts from the cost of the asset, not from sales.'
      D: 'Purchases and sales belong to the trading account, not to depreciation.'

  17:
    answer: B
    steps:
      - 'This is the trading account, the first part of the profit and loss account (now the statement of profit or loss).'
      - 'Rule: the trading account sets the cost of goods sold against net sales to find the gross profit, also called the gross margin.'
      - '$\text{Gross profit} = \text{Net sales} - \text{Cost of goods sold}$. Expenses such as rent and wages come later, in the profit and loss account, to give net profit.'
      - 'A shop in Aba sells goods for ₦500,000 that cost it ₦350,000. The trading account shows a gross profit of ₦150,000.'
      - 'Remember: trading gives gross; profit and loss gives net.'
      - 'The trap is A, net profit. That is found in the profit and loss account, after the expenses.'
    hint: 'Which profit is found before any expenses are taken off?'
    why:
      A: 'Net profit is found in the profit and loss account, after expenses.'
      C: 'Purchases are one figure in the trading account, not its purpose.'
      D: 'Sales are entered in the trading account, but the aim is the profit on them.'

  18:
    answer: B
    steps:
      - 'This is cash discount received for prompt payment.'
      - 'Rule: cash paid = invoice amount − (invoice amount × discount rate).'
      - 'Discount = ₦9,000 × 5% = ₦450. Cash paid = ₦9,000 − ₦450 = ₦8,550.'
      - 'Check: ₦8,550 + ₦450 = ₦9,000, the debt cleared in Tanko''s account.'
      - 'A trader in Zaria who pays Tanko within the discount period pays ₦8,550 and records ₦450 as discount received, an income.'
      - 'Remember: pay promptly, pay less.'
      - 'The trap is C, ₦9,000. That is the full debt; prompt payment earns the discount, so less is paid.'
    hint: 'Find 5% of ₦9,000 and take it off.'
    why:
      A: '₦4,500 takes off half the invoice, not 5%.'
      C: '₦9,000 ignores the discount earned by paying promptly.'
      D: '₦9,450 adds the discount instead of taking it off.'

  19:
    answer: C
    steps:
      - 'This is depreciation by the straight line method.'
      - 'Rule: $\text{Depreciation per year} = \dfrac{\text{Cost} - \text{Scrap value}}{\text{Useful life}}$.'
      - 'Per year $= \dfrac{600{,}000 - 50{,}000}{5} = \dfrac{550{,}000}{5} = ₦110{,}000$. For two years, $2 \times 110{,}000 = ₦220{,}000$.'
      - 'Check: after two years the book value is ₦600,000 − ₦220,000 = ₦380,000, and three more years of ₦110,000 bring it to ₦50,000, the scrap value.'
      - 'A block factory in Ogbomosho that buys machine X would charge ₦110,000 to profit each year for five years.'
      - 'Remember: take off the scrap value first, then divide.'
      - 'The trap is B, ₦240,000. It divides the cost without taking away the scrap value (₦120,000 a year).'
    hint: 'Take away the scrap value before you divide by the life.'
    why:
      A: '₦700,000 is more than the machine cost.'
      B: '₦240,000 forgets to take away the scrap value.'
      D: '₦202,000 does not come from the straight line formula.'

  20:
    answer: B
    steps:
      - 'These are current assets, the assets of the balance sheet (statement of financial position) that will turn into cash within a year.'
      - 'Rule: current assets are stock (inventory), debtors (receivables), prepaid expenses, and cash and bank balances. Creditors and accrued expenses are current liabilities.'
      - 'Current assets = prepaid expenses 290 + stock 4,500 + cash 4,956 + debtors 905 = ₦10,651.'
      - 'Check by adding in another order: 4,500 + 4,956 = 9,456; 9,456 + 905 = 10,361; 10,361 + 290 = 10,651.'
      - 'A supermarket in Owerri counts its stock on the shelves, cash in the till, money owed by customers and rent paid in advance as current assets.'
      - 'Remember: current assets are things owned that turn into cash within the year.'
      - 'The trap is A, ₦10,361. It leaves out the prepaid expenses, which are a current asset.'
    hint: 'Which four items does the business own that will become cash within a year?'
    why:
      A: '₦10,361 leaves out the prepaid expenses of ₦290.'
      C: '₦17,396 wrongly adds the creditors in place of the debtors and prepayment.'
      D: '₦17,848 is far more than the four current assets add up to.'

  21:
    answer: B
    steps:
      - 'These are current liabilities, debts the business must pay within a year (payables in today''s terms).'
      - 'Rule: current liabilities include creditors and accrued expenses, which are expenses used but not yet paid.'
      - 'Current liabilities = creditors 7,940 + accrued expenses 323 = ₦8,263.'
      - 'Check: the other four items (stock, cash, debtors and prepaid expenses) are all assets, so nothing else is owed.'
      - 'A provisions shop in Onitsha owes its supplier ₦7,940 and owes ₦323 for electricity already used. Both must be paid soon.'
      - 'Remember: accrued means owed; prepaid means paid ahead, which is an asset.'
      - 'The trap is A, ₦8,553. It adds the prepaid expenses, which are an asset, to the creditors.'
    hint: 'Which items does the business owe?'
    why:
      A: '₦8,553 adds the prepaid expenses, an asset, to the creditors.'
      C: '₦7,940 is creditors alone; the accrued expenses are also owed.'
      D: '₦1,228 adds the debtors, an asset, to the accrued expenses and leaves out the creditors.'

  22:
    answer: B
    steps:
      - 'This is gross profit.'
      - 'Rule: $\text{Gross profit} = \text{Sales} - \text{Cost of goods sold}$. It is the profit on trading before any running expenses are taken off.'
      - 'If sales are ₦300,000 and cost of goods sold is ₦200,000, gross profit is ₦100,000.'
      - 'A tomato seller at Mile 12 market buys a basket for ₦20,000 and sells it for ₦28,000. Her gross profit is ₦8,000, before she pays for transport and the stall.'
      - 'Remember: sales less cost of sales is gross; take off expenses and it is net.'
      - 'The trap is C, net profit. Net profit is what remains after the expenses are taken from gross profit.'
    hint: 'Is this before or after expenses?'
    why:
      A: 'Gross sales are total sales before returns, not a profit.'
      C: 'Net profit is gross profit less expenses.'
      D: 'Net sales are sales less returns inwards.'

  23:
    answer: B
    steps:
      - 'This is FIFO, first in, first out, a method of stock valuation.'
      - 'Rule: under FIFO the goods bought first are taken to be sold first, so the cost of goods sold uses the earliest prices.'
      - 'The 300 books sold on 15 March come from the 900 bought on 2 March at ₦1,000. Cost of goods sold = 300 × ₦1,000 = ₦300,000.'
      - 'Check: 300 is fewer than the 900 in the first batch, so no books come from the 4 March batch.'
      - 'A bookshop in Nsukka puts the oldest copies at the front of the shelf so they sell first, which is FIFO.'
      - 'Remember: first in, first out, so the oldest price goes to cost of sales.'
      - 'The trap is A, ₦285,000. That uses the latest price of ₦950, which is LIFO.'
    hint: 'Which batch do the first books sold come from?'
    why:
      A: '₦285,000 uses the latest price of ₦950, which is LIFO.'
      C: '₦570,000 prices 600 books at ₦950; only 300 were sold.'
      D: '₦600,000 prices 600 books at ₦1,000; only 300 were sold.'

  24:
    answer: D
    steps:
      - 'This is LIFO, last in, first out, used here to value the closing stock.'
      - 'Rule: under LIFO the goods bought last are taken to be sold first, so the closing stock is valued at the earliest prices.'
      - 'Goods available: 900 × ₦1,000 = ₦900,000 and 590 × ₦950 = ₦560,500, a total of ₦1,460,500. The 300 books sold come from the 4 March batch: 300 × ₦950 = ₦285,000.'
      - 'Closing stock = ₦1,460,500 − ₦285,000 = ₦1,175,500. Check by counting what is left: 900 books at ₦1,000 = ₦900,000 and 290 books at ₦950 = ₦275,500, which total ₦1,175,500.'
      - 'A cement dealer in Onitsha piles new bags on top and sells from the top of the pile, so the last in goes out first.'
      - 'Remember: under LIFO the old prices stay in the store.'
      - 'The trap is C, ₦1,160,500. That is the FIFO closing stock, which takes the 300 books sold at ₦1,000.'
    hint: 'Take the 300 books sold from the last batch. What is left, and at what prices?'
    why:
      A: '₦801,000 does not come from the stock records.'
      B: '₦1,100,500 does not match the books left at their prices.'
      C: '₦1,160,500 is the closing stock under FIFO, not LIFO.'

  25:
    answer: A
    steps:
      - 'This is the control account, also called a total account.'
      - 'Rule: a control account holds, in total, every entry made to the individual accounts in one ledger. Its balance should equal the total of the balances in that ledger.'
      - 'If the sales ledger control account shows ₦480,000 but the debtors'' balances add up to ₦475,000, the ₦5,000 error is inside the sales ledger. The accountant searches that ledger only, not the whole set of books.'
      - 'A distributor in Kano with 400 customers checks its sales ledger against the control account each month, so a posting slip is found quickly.'
      - 'Remember: a control account controls the search; it tells you which ledger holds the error.'
      - 'The trap is C. Control accounts check the records of debts; they do not pay them.'
    hint: 'What does comparing a total account with its ledger help the accountant to find?'
    why:
      B: 'Bank transactions are brought up to date by the bank reconciliation, not by a control account.'
