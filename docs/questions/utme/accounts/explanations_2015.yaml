      - 'In the trial balance of a pharmacy in Owerri, sales ₦900,000 and creditors ₦120,000 are both in the credit column.'
      - 'Remember DEAD CLIC: Debits are Expenses, Assets, Drawings; Credits are Liabilities, Income, Capital.'
      - 'The trap is B. It treats liabilities as debits; they are credit balances, just like income.'
    hint: 'Use DEAD CLIC. Where are Liabilities and Income?'
    why:
      B: 'Liabilities are credit balances, not debit.'
      C: 'Both incomes and liabilities are credit balances.'
      D: 'Income is a credit balance, not a debit.'

