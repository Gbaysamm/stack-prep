      - 'Rule: add both sides. Put the difference on the smaller side as balance c/d, then bring it down on the other side as balance b/d. The side it comes down on names the balance.'
      - 'Debit side: $2{,}600 + 28{,}200 = ₦30{,}800$. Credit side: $15{,}000 + 1{,}250 + 7{,}600 = ₦23{,}850$.'
      - 'Balance $= 30{,}800 - 23{,}850 = ₦6{,}950$. It is written c/d on the credit side and comes down b/d on the debit side, so it is a debit balance: money in hand. Check: $23{,}850 + 6{,}950 = 30{,}800$.'
