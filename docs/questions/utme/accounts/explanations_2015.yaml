format_version: 1
exam_year: 2015
subject: ACC
explanations:
  1:
    answer: B
    steps:
      - 'This is the accounting period, the stretch of time each set of final accounts covers. It goes with the periodicity concept.'
      - 'Rule: a business lives on, but its owners need results at regular intervals, so its life is cut into equal periods, usually one year, and a set of financial statements is prepared for each one.'
      - 'The trading and profit and loss account (the statement of profit or loss) shows the profit for that period, and the balance sheet (the statement of financial position) shows the position on its last day.'
      - 'A bakery in Ibadan may run its accounting year from 1 January to 31 December, and every December it closes the books to see that year''s profit.'
      - 'Remember: one period, one set of statements, usually twelve months.'
      - 'The trap is D, the budget period. A budget is a plan for the future; the accounting period is the past year the statements report on.'
    hint: 'Which period do the profit and loss account and balance sheet cover?'
    why:
      A: 'That is the credit period allowed to debtors, often a month, not the accounting period.'
      C: 'Tax is paid on the year''s profit, but the accounting period is defined by the financial statements, not by tax payments.'
      D: 'A budget period looks forward and plans; the accounting period looks back and reports.'

  2:
    answer: A
    steps:
      - 'This is the matching concept, closely tied to the accruals concept.'
      - 'Rule: the revenue of a period is matched with the expenses incurred to earn it in that same period, whether or not cash has changed hands. Profit is revenue less the expenses matched with it.'
      - 'So a sale made in December belongs to December even if the customer pays in January, and rent for December belongs to December even if it is paid later. This is why accruals and prepayments are adjusted at the year end.'
      - 'A pharmacy in Enugu sells drugs worth ₦300,000 in December and owes its shop assistant ₦20,000 December wages, paid in January. Both go in December''s accounts.'
      - 'Remember: match the sale with the cost that earned it, in the same period.'
      - 'The trap is B, consistency. Consistency means using the same method from year to year; it does not say which period a revenue or expense belongs to.'
    hint: 'Which concept pairs each period''s revenue with that period''s expenses?'
    why:
      B: 'Consistency is about keeping the same methods each year, not about timing revenue and expenses.'
      C: 'Adjusting for revenue is a step taken because of the matching concept, not the name of the concept.'
      D: 'Passing entries is simply recording transactions in the books.'

  3:
    answer: D
    steps:
      - 'This is about the users of accounting information and what a good accounting system gives them.'
      - 'Rule: accounting serves two groups. Internal users, the managers, need information to plan and control (management accounting). External users, the third parties such as owners, investors, lenders, creditors and government, need reports on results and position (financial accounting).'
      - 'An effective system therefore produces both internal reports for managers and external reports for third parties.'
      - 'A Kano textile company prepares monthly cost reports for its managers and yearly audited accounts for its shareholders, its bank and the Federal Inland Revenue Service.'
      - 'Remember: inside for managers, outside for third parties; a good system feeds both.'
      - 'The trap is C. It lists some users, but it leaves out the owners, investors, lenders and government, the main outside users, so it is not the whole aim.'
    hint: 'Accounting serves people inside the business and people outside it. Which option covers both?'
    why:
      A: 'Customer feedback is a marketing matter, not the output of the accounting system.'
      B: 'New products and methods come from research and production, not from accounting.'
      C: 'It is a narrow and odd list of users that misses owners, lenders and government.'

  4:
    answer: B
    steps:
      - 'These are source documents, the first written evidence of a transaction.'
      - 'Rule: a source document is the paper that comes out of the transaction itself: invoices, credit notes, debit notes, receipts, cheque counterfoils and payment vouchers. Books such as the journals, the cash book and the ledger are where these documents are recorded later.'
      - 'Sales invoice: issued when goods are sold on credit, a source document. Debit note: issued for an undercharge or for goods returned to a supplier, a source document. Cash book, journals and ledger: books of account.'
      - 'A provisions shop in Onitsha keeps a file of invoices and debit notes, and the bookkeeper copies them into the day books each evening.'
      - 'Remember: documents come first, books come after.'
      - 'The trap is A, sales invoice and cash book. The invoice is a source document, but the cash book is a book of original entry.'
    hint: 'Which pair are both papers from the transaction itself, not books they are written into?'
    why:
      A: 'The cash book is a book of original entry, not a source document.'
      C: 'Journals and the ledger are books of account built from source documents.'
      D: 'The debit note is a source document, but the cash book is a book of account.'

  5:
    answer: B
    steps:
      - 'These are source documents.'
      - 'Rule: every business transaction produces a document, and the general name for all such documents is source documents. They are the evidence from which the books are written up.'
      - 'Invoices, receipts, credit notes, debit notes, cheque counterfoils and vouchers are all kinds of source document.'
      - 'When a trader in Aba buys shoes on credit, she receives an invoice; when she pays, she gets a receipt. Both are source documents.'
      - 'Remember: source means where it starts; the record starts from the document.'
      - 'The trap is A, invoices. An invoice is only one kind of source document, so it is too narrow for all the instruments a firm generates.'
    hint: 'Is there a name that covers invoices, receipts and credit notes together?'
    why:
      A: 'An invoice is just one kind of source document.'
      C: 'There is no such general class; purchase invoices are one kind of source document.'
      D: 'Journals are books of original entry written up from the documents.'

  6:
    answer: C
    steps:
      - 'This is the credit note.'
      - 'Rule: when a buyer returns goods, the seller sends a credit note. It tells the buyer that his account has been credited, so he owes less.'
      - 'In the seller''s books: debit returns inwards, credit the buyer. In the buyer''s books: debit the seller, credit returns outwards.'
      - 'A Lagos supermarket returns twenty cartons of spoilt milk to the distributor, and the distributor sends a credit note for ₦60,000.'
      - 'Remember: goods come back, credit goes out.'
      - 'The trap is B, a debit note. A debit note is what the buyer may send when he returns goods, or what a seller sends for an undercharge; the seller acknowledges a return with a credit note.'
    hint: 'After a return, does the buyer owe more or less? Which note reduces his account?'
    why:
      A: 'An invoice charges the buyer for goods sold, it does not acknowledge a return.'
      B: 'A debit note increases what is owed, or comes from the buyer, not the seller''s acknowledgement of a return.'
      D: 'A voucher supports a payment, not a return of goods.'

  7:
    answer: C
    steps:
      - 'This is the Institute of Chartered Accountants of Nigeria, ICAN, the oldest professional accounting body in the country.'
      - 'Fact: ICAN was established by an Act of Parliament, Act No. 15 of 1965. The law gives it the power to train, examine, register and discipline chartered accountants in Nigeria.'
      - 'The second body set up by law is the Association of National Accountants of Nigeria, ANAN, established by Decree No. 76 of 1993.'
      - 'A graduate in Abuja who passes the ICAN examinations is admitted as a chartered accountant and may write ACA after her name.'
      - 'Remember: ICAN 1965, ANAN 1993, twenty-eight years apart.'
      - 'The trap is A, 1960. That is the year of independence; the ICAN Act came five years later.'
    hint: 'Was the ICAN Act passed before or after Nigeria became a republic?'
    why:
      A: '1960 is the year of independence, not of the ICAN Act.'
      B: '1963 is the year Nigeria became a republic; the ICAN Act came in 1965.'
      D: '1993 is the year of the decree that set up ANAN, not ICAN.'

  8:
    answer: C
    steps:
      - 'This is the voucher system, a way of controlling payments.'
      - 'Rule: under the voucher system, no payment is made until a payment voucher has been prepared, supported by the invoice and other papers, checked and approved by an authorised officer.'
      - 'So every expenditure is reviewed and verified before money leaves the business, which prevents fraud and errors.'
      - 'In a Lagos State ministry, a contractor is paid only after the voucher is raised, checked by the internal auditor and approved by the accounting officer.'
      - 'Remember: no voucher, no payment.'
      - 'The trap is A. The voucher system controls payments; it does not by itself reduce how many cheques are written.'
    hint: 'What must happen to a voucher before the cashier can pay?'
    why:
      A: 'The voucher system checks payments, it does not cut the number of cheques.'
      B: 'It is a fixed, step-by-step routine, which makes it rigid rather than flexible for unusual items.'
      D: 'A record of business with each supplier is kept in the creditors ledger, not by the voucher system.'

  9:
    answer: B
    steps:
      - 'This is the purchases ledger control account (the payables control account), which shows the total of all the suppliers'' accounts.'
      - 'Rule: it is written like one big supplier''s account. Credit side: opening credit balances and credit purchases. Debit side: opening debit balances, returns outwards, cash and cheques paid, bills (promissory notes) given, discount received, set-offs, and the closing credit balance.'
      - 'Credit side: $40{,}000 + 500{,}000 = ₦540{,}000$.'
      - 'Debit side: $1{,}000 + 50{,}000 + 400{,}000 + 30{,}000 + 8{,}000 + 2{,}000 = ₦491{,}000$, and the balance c/d makes it up to ₦540,000, so both sides total ₦540,000.'
      - 'A building materials dealer in Kaduna keeps one account per supplier, and the control account totals them all on one page each month.'
      - 'Remember: purchases and opening credits go to the credit side, because suppliers are owed more; payments and returns go to the debit side.'
      - 'The trap is D, ₦500,000. That is only the purchases; the opening credit balances of ₦40,000 also sit on the credit side.'
    hint: 'Put the opening credit balances and the purchases on one side. What do they add up to?'
    why:
      A: '₦480,000 matches neither side; the credit side is ₦40,000 + ₦500,000 = ₦540,000.'
      C: '₦490,000 is the debit-side items without the opening debit balance and the balance c/d.'
      D: '₦500,000 is the purchases alone, without the opening credit balances.'

  10:
    answer: A
    steps:
      - 'This is the closing balance of the purchases ledger control account, the total still owed to suppliers.'
      - 'Rule: the balance c/d is the figure that makes the smaller side equal the bigger side.'
      - 'Credit side total: $40{,}000 + 500{,}000 = ₦540{,}000$.'
      - 'Debit items: $1{,}000 + 50{,}000 + 400{,}000 + 30{,}000 + 8{,}000 + 2{,}000 = ₦491{,}000$.'
      - 'Balance c/d $= 540{,}000 - 491{,}000 = ₦49{,}000$, on the debit side. Check: $491{,}000 + 49{,}000 = 540{,}000$, and it comes down as a credit balance, because the business still owes its suppliers.'
      - 'Remember: big side total, less the small side items, gives the balance c/d.'
      - 'The trap is C, ₦40,000. That is the opening balance, not the closing one.'
    hint: 'Total the credit side first. How much of it has the debit side not yet covered?'
    why:
      B: '₦2,000 is the set-off against the sales ledger, one of the debit items.'
      C: '₦40,000 is the opening credit balance on 1 February.'
      D: '₦8,000 is the discount received, one of the debit items.'

  11:
    answer: D
    steps:
      - 'This is net profit, with an adjustment for a prepaid expense.'
      - 'Rule: $\text{Gross profit} = \text{Sales} - \text{Cost of sales}$, then $\text{Net profit} = \text{Gross profit} - \text{Expenses of the period}$. A prepayment is paid now for a later period, so it is taken out of this year''s expenses and shown as a current asset.'
      - 'Gross profit $= 20{,}000 - 10{,}000 = ₦10{,}000$.'
      - 'Expenses of this period $= 2{,}500 - 500 = ₦2{,}000$.'
      - 'Net profit $= 10{,}000 - 2{,}000 = ₦8{,}000$. Check: $10{,}000 + 2{,}000 + 8{,}000 = 20{,}000$, the sales.'
      - 'A barbing salon in Port Harcourt pays ₦2,500 for rent and lights, but ₦500 of it is rent for next year. Only ₦2,000 belongs to this year''s profit and loss account.'
      - 'The trap is A, ₦7,500. It charges the whole ₦2,500, forgetting that ₦500 belongs to next year.'
    hint: 'How much of the operating expenses really belongs to this year?'
    why:
      A: '₦7,500 charges the full ₦2,500, including the ₦500 that belongs to next year.'
      B: '₦12,500 adds the expenses to the gross profit instead of taking them away.'
      C: '₦10,000 is the gross profit, before any expenses are charged.'

  12:
    answer: A
    steps:
      - 'This is the gross profit margin, also called the gross profit percentage on sales.'
      - 'Rule: $\text{Gross profit margin} = \dfrac{\text{Gross profit}}{\text{Sales}} \times 100\%$.'
      - 'Gross profit $= 20{,}000 - 10{,}000 = ₦10{,}000$.'
      - 'Margin $= \dfrac{10{,}000}{20{,}000} \times 100\% = 50\%$. Check: half of ₦20,000 is ₦10,000.'
      - 'A trader at Ariaria market who buys a bag of rice for ₦10,000 and sells it for ₦20,000 keeps half of every naira of sales as gross profit.'
      - 'Remember: margin is on sales, mark-up is on cost.'
      - 'The trap is D, 100%. That divides the gross profit by the cost of sales, which is the mark-up, not the margin.'
    hint: 'Gross profit divided by which figure, sales or cost?'
    why:
      B: '40% is the net profit margin, ₦8,000 over ₦20,000, not the gross margin.'
      C: '30% does not come from these figures; gross profit is half of sales.'
      D: '100% is the mark-up on cost, ₦10,000 over ₦10,000.'

  13:
    answer: C
    steps:
      - 'This is the objective of financial reports (accounting reports).'
      - 'Rule: accounting reports give useful information about the entity''s economic resources, that is, what it owns and controls, the claims against those resources, and how they changed during the period. Owners, lenders and others use this to make decisions.'
      - 'The balance sheet shows the resources and the claims on them; the profit and loss account shows how they grew or fell through the year''s trading.'
      - 'A Nigerian bank reading the accounts of a Lagos food company asks: what assets does it hold, how much does it owe, and is it making profit? The reports answer about its economic resources.'
      - 'Remember: reports are about the resources, for the users.'
      - 'The trap is A, the shareholders. Shareholders are users of the reports; the reports are not about them.'
    hint: 'Do the reports describe the people who read them, or what the business owns and owes?'
    why:
      A: 'Shareholders are users of the reports, not their subject.'
      B: 'How well assets work is judged from the reports, but it is only a small part of what they are about.'
      D: 'The management structure is shown in an organization chart, not in the accounting reports.'

  14:
    answer: D
    steps:
      - 'This is the accounting equation.'
      - 'Rule: $\text{Assets} = \text{Liabilities} + \text{Equity}$. Every naira the business holds came from its owners or from outsiders.'
      - 'Total assets $= 12{,}045 + 26{,}896 = ₦38{,}941$.'
      - 'Cash $= \text{Total assets} - \text{Other assets} = 38{,}941 - 36{,}800 = ₦2{,}141$.'
      - 'Check: $36{,}800 + 2{,}141 = 38{,}941 = 12{,}045 + 26{,}896$. Both sides agree.'
      - 'Remember: what you have equals what you owe plus what is yours.'
      - 'The trap is A, ₦2,241. The options are very close, so a slip in the subtraction picks the wrong one; always add back to check.'
    hint: 'Find total assets from liabilities and equity first. Then take away the other assets.'
    why:
      A: 'With ₦2,241, total assets would be ₦39,041, which is more than ₦38,941.'
      B: 'With ₦2,214, total assets would be ₦39,014, which is more than ₦38,941.'
      C: 'With ₦2,114, total assets would be ₦38,914, which is less than ₦38,941.'

  15:
    answer: B
    steps:
      - 'This is the bad debts account and how it is closed at the year end.'
      - 'Rule: a bad debt is a debt the business will never collect. It is a loss, an expense of running the business, so it is charged to the profit and loss account.'
      - 'During the year: debit bad debts, credit the debtor. At the year end: debit profit and loss, credit bad debts, which closes the account.'
      - 'A Jos building materials shop writes off ₦15,000 owed by a customer who has disappeared. The ₦15,000 reduces the shop''s net profit.'
      - 'Remember: bad debts are an expense, and expenses go to profit and loss.'
      - 'The trap is D, the provision for bad debts account. That account holds the estimate for debts that may go bad in future; debts already written off go straight to profit and loss.'
    hint: 'Is a bad debt part of cost of goods, an asset, or an expense?'
    why:
      A: 'The balance sheet shows balances that remain, but a bad debt is an expense to be closed off.'
      C: 'The trading account holds only sales and the cost of goods sold.'
      D: 'The provision account holds the estimate for future bad debts, not the debts already written off.'

  16:
    answer: A
    steps:
      - 'This is the cost of goods sold for a bakery, whose bakery wages are charged in the trading account.'
      - 'Rule: $\text{Cost of goods sold} = \text{Opening stock} + \text{Purchases} + \text{Direct wages} - \text{Closing stock}$. Sales, carriage outwards, office salaries and capital do not enter it.'
      - 'Opening stock plus purchases: $800 + 2{,}450 = ₦3{,}250$.'
      - 'Add the bakery wages: $3{,}250 + 675 = ₦3{,}925$.'
      - 'Take away the closing stock: $3{,}925 - 940 = ₦2{,}985$. Check: gross profit would be $4{,}750 - 2{,}985 = ₦1{,}765$, a sensible figure.'
      - 'In a bakery in Ibadan, the bakers who knead the flour turn it into bread, so their wages are part of the cost of the bread sold.'
      - 'The trap is C, ₦3,925. It forgets to take away the ₦940 of flour still in stock at the end of the year.'
    hint: 'Pick out only opening stock, purchases, bakery wages and closing stock. What do you do with closing stock?'
    why:
      B: '₦2,515 does not come from the trading items; the cost of goods sold is ₦2,985.'
      C: '₦3,925 leaves the closing stock of ₦940 in.'
      D: '₦3,250 is opening stock plus purchases only, with no wages and no closing stock.'

  17:
    answer: C
    steps:
      - 'This is updating (adjusting) the cash book before a bank reconciliation statement is prepared.'
      - 'Rule: items the bank has already put through, but the business has not yet recorded, are entered in the cash book. Items the business has recorded but the bank has not yet put through go in the reconciliation statement.'
      - 'Update the cash book: bank interest received, direct credits (standing order receipts), bank charges and commission, dishonoured cheques. Reconciliation statement: unpresented cheques and uncredited cheques (lodgements not yet credited).'
      - 'A pharmacy in Benin City finds ₦4,000 interest and a ₦50,000 transfer from a customer on its bank statement. It writes both into its cash book before reconciling.'
      - 'Remember: the bank knew first, so update the cash book; the business knew first, so reconcile.'
      - 'The trap is D. Direct credits do update the cash book, but unpresented cheques are already in it; they go in the reconciliation statement.'
    hint: 'Which pair did the bank record first, so that the business still has to enter them?'
    why:
      A: 'Interest received updates the cash book, but unpresented cheques are already in it.'
      B: 'Commission updates the cash book, but uncredited cheques are already in it and go in the reconciliation.'
      D: 'Direct credits update the cash book, but unpresented cheques belong in the reconciliation statement.'

  18:
    answer: D
    steps:
      - 'These are the professional accounting bodies set up by Nigerian law.'
      - 'Fact: the Institute of Chartered Accountants of Nigeria (ICAN) was established by Act No. 15 of 1965, and the Association of National Accountants of Nigeria (ANAN) by Decree No. 76 of 1993. These two are the bodies recognized by law to produce accountants in Nigeria.'
      - 'Each body trains, examines, registers and disciplines its members.'
      - 'An accountant in Abeokuta who signs a company''s audited accounts must be a member of ICAN or ANAN.'
      - 'Remember: I can, and ANAN can too; ICAN and ANAN.'
      - 'The trap is C. The Association of Accountants in Nigeria was the forerunner of ICAN, and there is no Institute of Management Accountants of Nigeria set up by law.'
    hint: 'One body is chartered, the other is national. Which option names both?'
    why:
      A: 'Neither of these is a professional body set up by Nigerian law.'
      B: 'These names are not the bodies established by law in Nigeria.'
      C: 'Neither of these is one of the two bodies recognized by law today.'

  19:
    answer: B
    steps:
      - 'This is the source document and its purpose.'
      - 'Rule: a source document (an invoice, receipt, credit note, debit note, cheque counterfoil or voucher) is the evidence that a transaction happened. It gives the date, the parties, the goods and the amount, so it supplies the figures to record and lets anyone check the entry later.'
      - 'The bookkeeper writes up the books of original entry from the source documents, and an auditor traces entries back to them to verify them.'
      - 'A Kano grain dealer keeps every receipt and invoice in a file. When the auditor asks why ₦80,000 was paid on 3 March, the receipt proves it.'
      - 'Remember: no document, no entry.'
      - 'The trap is C, testing arithmetical accuracy. That is the job of the trial balance, not the source document.'
    hint: 'What would an auditor ask to see to prove a transaction happened?'
    why:
      A: 'Ledger balances are shown by balancing the ledger accounts, not by source documents.'
      C: 'Testing the arithmetic of the ledger is the purpose of the trial balance.'
      D: 'The year''s results are summarized in the final accounts.'

  20:
    answer: C
    steps:
      - 'This is the accounting equation and where accounts payable belong.'
      - 'Rule: $\text{Assets} = \text{Capital} + \text{Liabilities}$. Accounts payable (creditors, or trade payables) are amounts the business owes to suppliers, so they are liabilities.'
      - 'If a shop buys goods on credit for ₦30,000, assets (stock) rise by ₦30,000 and liabilities (accounts payable) rise by ₦30,000, and the equation still balances.'
      - 'A provisions shop in Onitsha that collects goods from a wholesaler and pays at the month end shows the unpaid sum as accounts payable under liabilities.'
      - 'Remember: payable means you must pay it, so it is a liability.'
      - 'The trap is A, capital. Capital is what the owner has put in; a supplier is an outsider, so what he is owed is a liability.'
    hint: 'Payable means the business must pay it. Which side of the equation holds what is owed to outsiders?'
    why:
      A: 'Capital is owed to the owner, not to suppliers.'
      B: 'Assets are what the business owns; accounts payable are what it owes.'
      D: 'Expenses are costs of the period, not amounts still owed to suppliers.'

  21:
    answer: C
    steps:
      - 'This is the history of double entry bookkeeping.'
      - 'Fact: Luca Pacioli, an Italian monk and mathematician, set out the double entry system in his book Summa de Arithmetica, published in Venice in 1494. He is called the father of accounting.'
      - 'He wrote down the method Venetian merchants were using: every transaction has two sides, a debit and a credit, of equal amount.'
      - 'Every Nigerian business that keeps a ledger today, from a supermarket in Abuja to a bank in Lagos, still uses Pacioli''s rule.'
      - 'Remember: Pacioli, 1494, Venice, the father of accounting.'
      - 'The trap is D, Frank Wood. His Business Accounting is the textbook many Nigerian students use, but he wrote centuries after double entry began.'
    hint: 'Think of the Italian monk of the fifteenth century.'
    why:
      A: 'William Pickles wrote an accountancy textbook in the twentieth century; he did not develop double entry.'
      B: 'Akintola Williams was the first Nigerian chartered accountant and founded an accounting firm; he did not develop double entry.'
      D: 'Frank Wood is a modern textbook author, not the developer of double entry.'

  22:
    answer: D
    steps:
      - 'This is the conservatism concept, also called prudence.'
      - 'Rule: do not anticipate profits, but provide for all foreseeable losses. When in doubt, take the lower figure for assets and income and the higher figure for liabilities and expenses.'
      - 'So stock is valued at the lower of cost and net realizable value, and a provision for bad debts is made before the debts actually go bad. Both lower the asset in the balance sheet and lower the profit in the same year, which is why prudence shapes asset valuation and income determination together.'
      - 'A Kano shoe seller has stock that cost ₦200,000 but would now sell for only ₦150,000 after selling costs. Prudence values it at ₦150,000 and the ₦50,000 fall cuts this year''s profit.'
      - 'Remember: count your losses now, your gains only when you have them.'
      - 'The trap is C, matching. Matching pairs revenue with the expenses of the same period; it does not write stock down to a lower value.'
    hint: 'Which concept says take the lower figure and provide for losses you can foresee?'
    why:
      A: 'The entity concept separates the business from its owner; it does not value stock.'
      B: 'Realization decides when revenue is earned, not that stock is written down or losses provided for.'
      C: 'Matching pairs expenses with revenue in the same period; it does not take the lower of cost and net realizable value.'

  23:
    answer: B
    steps:
      - 'This is depreciation by the straight-line method.'
      - 'Rule: $\text{Yearly depreciation} = \dfrac{\text{Cost} - \text{Residual value}}{\text{Useful life}}$. The same amount is charged every year.'
      - 'Depreciable amount $= 56{,}000 - 1{,}000 = ₦55{,}000$.'
      - 'Yearly depreciation $= \dfrac{55{,}000}{5} = ₦11{,}000$. Check: $11{,}000 \times 5 = 55{,}000$, and the machine ends at ₦1,000.'
      - 'A sachet water factory in Ilorin buys a sealing machine for ₦56,000. After five years it can sell it as scrap for ₦1,000, so it charges ₦11,000 each year.'
      - 'Remember: cost minus scrap, over the years.'
      - 'The trap is A, ₦11,200. It divides the full cost by 5 and forgets to take away the residual value.'
    hint: 'Take the residual value off the cost before you divide.'
    why:
      A: '₦11,200 is ₦56,000 ÷ 5, with the residual value left in.'
      C: '₦11,300 does not come from the straight-line formula with these figures.'
      D: '₦11,400 is ₦57,000 ÷ 5, adding the residual value instead of taking it away.'

  24:
    answer: A
    steps:
      - 'This is the straight-line rate of depreciation.'
      - 'Rule: $\text{Rate} = \dfrac{\text{Yearly depreciation}}{\text{Cost} - \text{Residual value}} \times 100\%$, which for the straight-line method is the same as $\dfrac{100\%}{\text{Useful life}}$.'
      - 'Yearly depreciation is ₦11,000 (question 23), on a depreciable amount of ₦55,000.'
      - 'Rate $= \dfrac{11{,}000}{55{,}000} \times 100\% = 20\%$. Check: $\dfrac{100\%}{5} = 20\%$.'
      - 'A five-year machine in an Ibadan printing press loses one fifth of its depreciable value each year.'
      - 'Remember: five years, twenty per cent; four years, twenty-five per cent; ten years, ten per cent.'
      - 'The trap is D, 50%. That would write the machine off in only two years.'
    hint: 'If the machine lasts five years, what fraction is used up each year?'
    why:
      B: '30% would use up the machine in about three and a third years, not five.'
      C: '40% would write it off in two and a half years.'
      D: '50% would write it off in only two years.'

  25:
    answer: B
    steps:
      - 'This is the manufacturing account and how it links to the trading account.'
      - 'Rule: a manufacturer makes the goods it sells instead of buying them. Raw materials, direct labour and factory overheads are added up in the manufacturing account to give the cost of goods manufactured (production cost of goods completed).'
      - 'That figure is carried to the trading account and sits exactly where a trader would show purchases: opening stock of finished goods, plus cost of goods manufactured, less closing stock of finished goods, gives cost of sales.'
      - 'A soap factory in Aba adds its palm oil, caustic soda, factory wages and factory power to get ₦2 million cost of soap made, and that ₦2 million goes into its trading account.'
      - 'Remember: in a factory, made replaces bought.'
      - 'The trap is D, the purchases of raw materials. They are real purchases, but they belong in the manufacturing account, not in the trading account.'
    hint: 'A trader buys finished goods. Where does a manufacturer get its finished goods from?'
    why:
      A: 'Factory overhead is only one part of the cost of goods manufactured.'
      C: 'Prime cost leaves out the factory overheads, so it is less than the full cost of goods manufactured.'
      D: 'Raw material purchases are shown in the manufacturing account, not the trading account.'

  26:
    answer: C
    steps:
      - 'These are branch accounts kept by head office, and goods in transit at the year end.'
      - 'Rule: when head office sends goods, it debits the branch account (the branch owes it for them) and credits goods sent to branch. The branch records only what it has received: debit goods received from head office, credit head office account.'
      - 'Head office: debit branch account ₦50,000, credit goods sent to branch ₦50,000. Branch: debit goods received from head office ₦40,000, credit head office ₦40,000.'
      - 'The ₦10,000 still on the road is goods in transit. At the year end, head office debits goods in transit ₦10,000 and credits the branch account ₦10,000, so both books then show ₦40,000. Check: $50{,}000 - 10{,}000 = 40{,}000$.'
      - 'A Lagos head office sends ₦50,000 of goods to its Kano branch by lorry; one ₦10,000 load is still on the road on 31 December.'
      - 'Remember: head office debits the branch with all it sends; the branch records only what arrives.'
      - 'The trap is A. The branch cannot record ₦50,000 received when only ₦40,000 has arrived.'
    hint: 'When head office sends goods, who owes whom? Which account does head office debit?'
    why:
      A: 'Only ₦40,000 reached the branch, so it cannot debit ₦50,000 as received.'
      B: 'Head office credits goods sent to branch, and with the full ₦50,000, not debits it with ₦10,000.'
      D: 'The ₦10,000 has not arrived, so the branch does not record it as received.'

  27:
    answer: A
    steps:
      - 'This is the trial balance, a list of ledger balances with debits in one column and credits in the other.'
      - 'Rule: assets, expenses and drawings are debit balances; liabilities, incomes and capital are credit balances. If the books are right, the two columns agree, and that total is the total of the trial balance.'
      - 'Debits: light expenses 2,900, rent 15,000, purchases 7,500, debtors 6,000, drawings 25, bank 400, general expenses 1,500. Total $= ₦33{,}325$.'
      - 'Credits: sales 4,000, creditors 29,325. Total $= ₦33{,}325$.'
      - 'Both columns agree at ₦33,325, which checks the sorting.'
      - 'Remember DEAD CLIC: Debits are Expenses, Assets, Drawings; Credits are Liabilities, Income, Capital.'
      - 'The trap is to add every balance into one big sum, which points to a large option such as D, ₦64,300. The total of a trial balance is the total of one column, and here each column is ₦33,325.'
    hint: 'Sort the balances into debits and credits first. Do the two columns agree?'
    why:
      B: '₦41,850 does not equal either column; each column totals ₦33,325.'
      C: '₦46,825 does not equal either column; each column totals ₦33,325.'
      D: '₦64,300 is far more than either column; the total of a trial balance is one column, ₦33,325.'

  28:
    answer: B
    steps:
      - 'This is the double entry for an expense paid in cash.'
      - 'Rule: debit the account that receives the value, credit the account that gives it. Stationery is an expense that comes in, so it is debited; cash goes out, so it is credited.'
      - 'Debit stationery ₦12,000, credit cash ₦12,000.'
      - 'A law office in Abuja pays ₦12,000 cash for paper and printer ink: stationery account up, cash account down.'
      - 'Remember: debit what comes in, credit what goes out.'
      - 'The trap is C. Stationery for the office is not stock for resale, so purchases is not touched, and it was paid in cash.'
    hint: 'What came in, and what went out?'
    why:
      A: 'This reverses the entry; cash went out, so cash is credited.'
      C: 'Purchases is for goods bought for resale; the money left by cash, so cash is credited.'
      D: 'Stationery is not goods for resale, and it came in, so it is debited, not credited.'

  29:
    answer: C
    steps:
      - 'This is the cash discount in the three-column cash book.'
      - 'Rule: discount allowed to customers who pay promptly is written in the discount column on the debit side, beside the cash received. Discount received from suppliers is written in the discount column on the credit side, beside the payment.'
      - 'So cash discounts appear on both sides. The columns are memorandum only; their totals are posted to discount allowed (debit) and discount received (credit) in the ledger.'
      - 'An Onitsha provisions shop receives ₦9,700 from a customer who owed ₦10,000, allowing ₦300 discount (debit side), and pays a supplier ₦19,500 for a ₦20,000 debt, receiving ₦500 discount (credit side).'
      - 'Remember: allowed sits with receipts, received sits with payments.'
      - 'The trap is A. Discount allowed is on the debit side, but discount received is on the credit side, so both sides are used.'
    hint: 'Where is discount allowed written, and where is discount received written?'
    why:
      A: 'Only discount allowed goes on the debit side; discount received goes on the credit side.'
      B: 'Only discount received goes on the credit side; discount allowed goes on the debit side.'
      D: 'The folio column shows ledger page numbers, not discounts.'

  30:
    answer: D
    steps:
      - 'This is the standing order, an instrument of bank transactions.'
      - 'Rule: a standing order is a written instruction from a customer to his bank to pay a fixed sum to a named person at regular intervals, for example every month, until told to stop.'
      - 'The bank then debits the customer''s account on each due date without a new cheque.'
      - 'A civil servant in Abuja tells her bank to pay ₦25,000 every month to her landlord. That is a standing order.'
      - 'Remember: the customer stands the order with the bank.'
      - 'The trap is C. The bank carries out the order, but it is the customer who gives it.'
    hint: 'Who tells the bank to keep paying someone each month?'
    why:
      A: 'One customer cannot instruct another; the instruction goes to the bank.'
      B: 'A bank paying its own employee is payroll, not a standing order.'
      C: 'The bank obeys the standing order; the customer gives it.'

