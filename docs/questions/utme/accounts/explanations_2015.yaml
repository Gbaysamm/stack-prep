    answer: A
    steps:
      - 'These are the professional accounting bodies, ICAN and ANAN, and their main function.'
      - 'Rule: a professional body exists to guard the standard of the profession. Its chief duty is to promote and enforce the ethics of the profession: integrity, objectivity, competence, confidentiality and professional behaviour, so that the public can trust accountants.'
      - 'It does this through a code of conduct, examinations, continuing education and a disciplinary tribunal that can strike off a member who cheats.'
      - 'If an accountant in Lagos signs false accounts for a client, ICAN''s disciplinary tribunal can suspend or expel him.'
      - 'Remember: the body guards the name of the profession, so ethics comes first.'
      - 'The trap is D. Managing a business''s finances is the work of its own managers and accountants, not of the professional body.'
    hint: 'What must a professional body protect so that the public can trust its members?'
    why:
      B: 'Showing that the profession changes is not a function; bodies set and enforce standards.'
      C: 'Pay is agreed between members and employers; the body does not exist to raise it.'
      D: 'Each business manages its own finances; the body regulates the accountants, not the businesses.'

  32:
    answer: B
    steps:
      - 'These are the classes of ledger accounts.'
      - 'Rule: ledger accounts are classified as personal accounts (people and firms, such as debtors and creditors), real accounts (assets such as land, buildings, motor vehicles) and nominal accounts (incomes and expenses, such as sales, rent and wages).'
      - 'Personal accounts show who owes and who is owed; real accounts show what the business owns; nominal accounts are closed to the profit and loss account at the year end.'
      - 'In a Kaduna hardware shop, Musa''s account is personal, the delivery van account is real, and the electricity account is nominal.'
      - 'Remember: people, property, profit items; personal, real, nominal.'
      - 'The trap is D. Management, financial and public sector accounting are branches of accounting, not classes of ledger accounts.'
    hint: 'Think of an account for a person, one for a thing owned, and one for an expense.'
    why:
      A: 'Fixed and current describe assets and liabilities in the balance sheet, not ledger classes.'
      C: 'Bank and cash are two accounts in the cash book, not the classification of the ledger.'
      D: 'These are branches of accounting, not classes of ledger accounts.'

  33:
    answer: B
    steps:
      - 'This is the historical development of accounting.'
      - 'Fact: accounting grew from simple records of stores in ancient times, to double entry for the merchants of Venice, to company accounts after the industrial revolution, to today''s standards. At each stage it changed to meet the needs of the trade, law and society around it.'
      - 'So its history shows that accounting is a product of its environment: as the environment changes, accounting changes with it.'
      - 'In Nigeria, accounting moved from the cash records of colonial trading firms to CAMA company accounts and, from 2012, to IFRS, each change following the needs of the economy.'
      - 'Remember: accounting moves with its world.'
      - 'The trap is C. Debit and credit is the method accounting uses, but it is not what its history reveals.'
    hint: 'Did accounting stay the same through history, or change with the society around it?'
    why:
      A: 'Accounting is a tool for business, not described by its history as a subject for financial development.'
      C: 'Debit and credit describe its method, not the lesson of its history.'
      D: 'Financial development is only one part of the environment that shaped accounting.'

