      - 'Rule: bookkeeping is the recording stage, writing up transactions in the books of original entry and the ledger. Accounting goes further: it summarizes, analyses and interprets the records and communicates the results to users.'
      - 'In the question, the former is bookkeeping and the latter is accounting.'
      - 'In a Lagos company, the bookkeeper posts invoices into the ledger each day, while the accountant prepares the final accounts and explains to the directors why profit fell.'
      - 'Remember: the bookkeeper keeps the books; the accountant accounts for what they mean.'
      - 'The trap is C. It is the same pair of ideas the wrong way round.'
    hint: 'Which one writes, and which one explains?'
    why:
      B: 'Accounting, not bookkeeping, is called the language of business.'
      C: 'This reverses them; bookkeeping records and accounting interprets.'
      D: 'Summarizing and communicating are both parts of accounting, not of bookkeeping.'

  40:
    answer: D
    steps:
      - 'This is the realization concept.'
      - 'Rule: revenue is recognized when it is earned, which is when the goods pass to the buyer or the service is done and the buyer takes on the debt, not when the order is received and not when the cash is collected.'
      - 'So a credit sale is recorded as revenue on the day the goods are delivered, even though the money comes later.'
      - 'A furniture maker in Abeokuta takes an order in March, delivers in May and is paid in July. The sale is realized in May.'
      - 'Remember: real when the sale is real, at delivery.'
      - 'The trap is A, matching. Matching pairs expenses with revenue once revenue is known; realization decides when the revenue is recognized.'
    hint: 'Which concept fixes the moment a sale becomes revenue?'
    why:
      A: 'Matching pairs expenses with revenue; it does not decide when revenue is earned.'
      B: 'Consistency means keeping the same methods from year to year.'
      C: 'Going concern assumes the business will continue into the future.'
