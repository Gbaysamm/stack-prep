      - 'Remember: the heavier side names the balance.'
      - 'The trap is B. The balance c/d is written on the credit side, but the balance the account holds is on the debit side.'
    hint: 'Which side is heavier, and which side does the balance come down on?'
    why:
      B: 'A credit balance comes when the credit side is the bigger one.'
      C: 'A bigger debit side is normal; it does not mean the account is understated.'
      D: 'Overdrawn describes a bank account with a credit balance in the cash book, not any account with bigger debits.'

