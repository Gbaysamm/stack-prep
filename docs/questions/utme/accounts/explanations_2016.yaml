    answer: A
    steps:
      - 'This is the trading account, where gross profit is found from sales and cost of goods sold.'
      - 'Rule: gross profit margin $= \dfrac{\text{Gross profit}}{\text{Sales}} \times 100\%$, and $\text{Cost of goods sold} = \text{Sales} - \text{Gross profit}$.'
      - 'Gross profit $= 10\% \times 100{,}000 = ₦10{,}000$. Cost of goods sold $= 100{,}000 - 10{,}000 = ₦90{,}000$.'
      - 'Check: on the debit side, $90{,}000 + 10{,}000 = 100{,}000$, the total shown.'
      - 'A provisions shop in Onitsha that keeps ten kobo of every naira of sales as gross profit has a cost of goods sold of ninety kobo per naira.'
      - 'Remember: margin is on sales; markup is on cost.'
      - 'The trap is B, ₦10,000. That is the gross profit, not the cost of goods sold.'
    hint: 'Find the gross profit first. What is 10% of the sales?'
    why:
      B: '₦10,000 is the gross profit, not the cost of goods sold.'
      C: '₦110,000 adds the gross profit to sales instead of taking it away.'
      D: '₦105,600 adds the closing stock to sales; it is not the cost of goods sold.'

  30:
    answer: B
    steps:
      - 'This is purchases found by working back through the trading account.'
      - 'Rule: $\text{Cost of goods sold} = \text{Opening stock} + \text{Purchases} - \text{Closing stock}$, so $\text{Purchases} = \text{Cost of goods sold} + \text{Closing stock} - \text{Opening stock}$.'
      - 'Opening stock $= 5\% \times 100{,}000 = ₦5{,}000$, as the account shows. Cost of goods sold $= ₦90{,}000$ from the 10% margin.'
      - 'Purchases $= 90{,}000 + 5{,}600 - 5{,}000 = ₦90{,}600$. Check: $5{,}000 + 90{,}600 - 5{,}600 = 90{,}000$.'
      - 'A pharmacy in Benin that knows its cost of sales and its two stock counts can tell how much it bought in the year.'
      - 'Remember: what you sold, plus what is left, less what you started with, is what you bought.'
      - 'The trap is A, ₦95,600. It adds the closing stock but forgets to take away the opening stock.'
    hint: 'Cost of goods sold is ₦90,000. Add the closing stock, then take away the opening stock.'
    why:
      A: '₦95,600 adds the closing stock but does not take away the opening stock.'
      C: '₦95,000 adds the opening stock instead of the closing stock.'
      D: '₦85,000 takes the opening stock away but leaves out the closing stock.'

