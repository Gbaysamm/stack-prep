      - 'Interest received is credited by the bank to the account before the trader knows of it, so the bank statement shows more than the cash book. The trader puts it right by debiting the cash book.'
      - 'A trader in Abeokuta sees ₦1,200 interest on his bank statement that is not yet in his cash book, so his bank balance is ₦1,200 higher.'
      - 'Remember: the bank adds interest, so the statement goes up.'
      - 'The trap is C, direct withdrawal. A withdrawal takes money out, so it makes the bank statement lower, not higher.'
    hint: 'Which item makes the bank put money into the account before the trader records it?'
    why:
      A: 'A standing order payment is taken out by the bank, so it lowers the bank statement balance.'
      B: 'Commission paid is a charge taken out by the bank, so it lowers the bank statement balance.'
      C: 'A direct withdrawal takes money out, so it lowers the bank statement balance.'

