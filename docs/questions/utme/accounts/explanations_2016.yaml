format_version: 1
exam_year: 2016
subject: ACC
explanations:
  1:
    answer: C
    steps:
      - 'This is the capital of a partnership: everything the partners bring into the firm, in cash or in kind.'
      - 'Rule: a partner''s capital is the total value of all he contributes, cash plus assets at their agreed values. The firm''s capital is the sum of all the partners'' capitals.'
      - 'Ada: $12{,}000 + 18{,}000 + 70{,}000 = ₦100{,}000$. Udo: $10{,}000 + 105{,}000 + 35{,}000 = ₦150{,}000$. Firm: $100{,}000 + 150{,}000 = ₦250{,}000$. Check: total assets brought in, cash ₦22,000 plus other assets ₦228,000, is also ₦250,000.'
      - 'Two lawyers in Abuja who open chambers together may bring cash, law books, a car and an office; every item is valued and credited to its owner''s capital account.'
      - 'Remember: capital is not only cash. Count everything each partner brings, then add the partners together.'
      - 'The trap is A, ₦100,000. That is Ada''s capital alone; the firm''s capital includes Udo''s ₦150,000 too.'
    hint: 'Add up what Ada brings, add up what Udo brings, then put the two together.'
    why:
      A: '₦100,000 is only Ada''s contribution, not the firm''s whole capital.'
      B: '₦22,000 is only the cash both partners brought; the furnishings, vehicle, building and computer are capital too.'
      D: '₦150,000 is only Udo''s contribution.'

  2:
    answer: B
    steps:
      - 'This is a profit-sharing ratio based on capital, one of the terms a partnership deed may set.'
      - 'Rule: when profits are shared in the ratio of capital, each partner''s share is his capital over the total, written in the same order as the partners are named.'
      - 'Ada''s capital is ₦100,000 and Udo''s is ₦150,000. Ada : Udo $= 100{,}000 : 150{,}000$; dividing both by 50,000 gives $2 : 3$. Check: Ada gets 2/5 = 40% and Udo 3/5 = 60%, and 40% of ₦250,000 is ₦100,000.'
      - 'If the Abuja law firm makes ₦50,000 profit, Ada takes ₦20,000 and Udo takes ₦30,000.'
      - 'Remember: keep the names in order, Ada first, then reduce.'
      - 'The trap is A, 3:2. It is the right numbers the wrong way round, giving Ada, who brought less, the bigger share.'
    hint: 'Ada brought ₦100,000 and Udo ₦150,000. Write them in that order and reduce.'
    why:
      A: '3:2 reverses the order and gives Ada, who brought less, the larger share.'
      C: '1:2 would mean Udo brought twice Ada''s capital, ₦200,000; he brought ₦150,000.'
      D: '2:1 would mean Ada brought twice Udo''s capital, which is far from the case.'

  3:
    answer: D
    steps:
      - 'This is the ledger, the main book of account in which every transaction is posted to its own account.'
      - 'Rule: every transaction changes the accounting equation, so in principle a new balance sheet could be drawn up after each one. That is impossible in a busy business. Instead each change is recorded in ledger accounts, and a balance sheet is drawn up only at the end of the period from the account balances.'
      - 'So the ledger''s great advantage is that it removes the need to prepare a balance sheet after each transaction, while still keeping every asset, liability, income and expense up to date.'
      - 'A provisions shop in Onitsha may make two hundred sales a day; it posts them to the sales and cash accounts and prepares one balance sheet at the year end.'
      - 'Remember: the ledger collects, the balance sheet summarises once.'
      - 'The trap is A. The ledger is the book of final entry; the journals and the cash book are the books of original entry.'
    hint: 'Without ledger accounts, what would the trader have to redraw every time a transaction happened?'
    why:
      A: 'The ledger is the book of final (secondary) entry; the day books and journal are the books of original entry.'
      B: 'The ledger is used by the business every day, not kept for shareholders during liquidation.'
      C: 'Sole traders, partnerships, clubs and companies all keep ledgers, not only limited companies.'

  4:
    answer: D
    steps:
      - 'This is the trial balance, a list of all the ledger balances on one date, with debits in one column and credits in the other.'
      - 'Rule: under double entry every debit has an equal credit, so the two columns should agree. Its main purpose is to test the arithmetical accuracy of the ledger postings and balances; it also helps in preparing the final accounts.'
      - 'If debits total ₦500,000 and credits ₦498,000, a ₦2,000 error is somewhere in the ledger and must be found before the accounts are prepared.'
      - 'A bookkeeper at a pharmacy in Enugu extracts a trial balance every month end to be sure the ledger adds up before the owner sees the figures.'
      - 'Remember: trial balance, a trial of the arithmetic.'
      - 'The trap is B. The balance sheet items come from the trial balance, but identifying them is not why it is drawn up; its purpose is to check that the books agree.'
    hint: 'What does it prove when the two columns come to the same total?'
    why:
      A: 'Accounts are classified when the ledger is opened, not by drawing up a trial balance.'
      B: 'Balance sheet items are taken from it later, but its purpose is to test the arithmetic of the ledger.'
      C: 'A trial balance checks the books, not the competence of the accountant.'

  5:
    answer: C
    steps:
      - 'This is a missing figure from incomplete records: credit purchases found from the total creditors account (the payables control account).'
      - 'Rule: in the creditors account, purchases and the opening balance go on the credit side; payments, discount received and the closing balance go on the debit side. So $\text{Purchases} = \text{Payments} + \text{Discount received} + \text{Closing creditors} - \text{Opening creditors}$.'
      - 'Debit side: $26{,}500 + 130 + 5{,}250 = ₦31{,}880$. Credit side: opening ₦4,600 plus purchases. Purchases $= 31{,}880 - 4{,}600 = ₦27{,}280$.'
      - 'Check: $4{,}600 + 27{,}280 = 31{,}880$, so both sides of the creditors account agree.'
      - 'A building materials dealer in Kaduna who keeps no purchases book can still find his year''s purchases this way, from his supplier balances and his cheque stubs.'
      - 'Remember: what we paid, plus what we were let off, plus what we still owe, less what we owed at the start.'
      - 'The trap is B, ₦26,630. It adds the payments and the discount but forgets that creditors rose by ₦650 over the year.'
    hint: 'Draw the creditors account. What goes on each side, and what figure balances it?'
    why:
      A: '₦27,038 does not come from the creditors account; the balancing figure is ₦27,280.'
      B: '₦26,630 is payments plus discount only; it ignores the rise in creditors from ₦4,600 to ₦5,250.'
      D: '₦27,150 leaves out the ₦130 discount received, which also settled what was owed for purchases.'

  6:
    answer: C
    steps:
      - 'This is profit found by comparing capital (the statement of affairs method), used when full books are not kept.'
      - 'Rule: $\text{Profit} = \text{Closing capital} - \text{Opening capital} + \text{Drawings} - \text{New capital introduced}$. Drawings are added back because they took capital out; new capital is taken off because it did not come from trading.'
      - 'Profit $= 30{,}000 - 20{,}000 + 3{,}000 - 8{,}000 = ₦5{,}000$.'
      - 'Check: $20{,}000 + 8{,}000 + 5{,}000 - 3{,}000 = 30{,}000$, the closing capital.'
      - 'A tailor in Aba who keeps no ledger can still work out his profit from what his business was worth at the start and at the end of the year.'
      - 'Remember: growth in capital, plus drawings, less new capital.'
      - 'The trap is A, ₦8,000. That is the new capital put in by the owner, not profit earned by trading.'
    hint: 'Capital grew by ₦10,000. How much of that growth was not profit, and what profit was taken out?'
    why:
      A: '₦8,000 is the new capital introduced, which is not profit.'
      B: '₦4,000 does not fit the capital equation; profit must be ₦5,000 to take capital from ₦20,000 to ₦30,000.'
      D: '₦6,000 would give a closing capital of ₦31,000, not ₦30,000.'

  7:
    answer: A
    steps:
      - 'This is the trial balance: each ledger balance goes in the debit or the credit column, and the two totals should agree.'
      - 'Rule (DEAD CLIC): Debits are Expenses, Assets and Drawings; Credits are Liabilities, Income and Capital.'
      - 'Debits: bank $59{,}410$ + purchases $20{,}000$ + rent $2{,}500$ + stationery $90$ + typewriter $6{,}500$ $= ₦88{,}500$.'
      - 'Credits: capital $50{,}000$ + sales $38{,}500$ $= ₦88{,}500$. The columns agree, which is the check.'
      - 'A new typing pool in Ibadan with a bank account, a typewriter and some sales would draw up exactly this kind of short trial balance.'
      - 'Remember: DEAD on the left, CLIC on the right.'
      - 'The trap is D, ₦138,500. That is ₦88,500 plus the ₦50,000 capital, as if capital were a debit; capital is owed to the owner, so it is a credit.'
    hint: 'Sort each balance with DEAD CLIC. Which two are credits?'
    why:
      B: '₦85,800 swaps two digits of the right total, ₦88,500.'
      C: '₦147,910 is ₦88,500 plus the bank balance a second time.'
      D: '₦138,500 adds the ₦50,000 capital to the debits; capital belongs in the credit column.'

  8:
    answer: D
    steps:
      - 'This is capital expenditure: money spent on fixed assets, which are kept to run the business, not to resell.'
      - 'Rule: an item bought for use over several years is a fixed asset (non-current asset) and is debited to its asset account. Goods bought to resell are purchases (stock). Day-to-day costs are expenses.'
      - 'The generators will power the workshop for years, so the entry is: debit generators (fixed assets) account, credit bank or the supplier.'
      - 'A barbing salon in Lagos that buys a generator for its clippers records a fixed asset; a generator dealer at Alaba market who buys ten to sell records purchases.'
      - 'Remember: bought to use, fixed asset; bought to sell, stock.'
      - 'The trap is B, an acquisition of stock. That fits only goods bought for resale, and these generators are for the workshop.'
    hint: 'Will the generators be sold to customers or used in the business for years?'
    why:
      A: 'Capital is what the owner puts in; buying an asset does not add to the owner''s capital.'
      B: 'Stock is goods bought for resale, and these generators are for the business''s own use.'
      C: 'An expense is used up in the period; generators last many years, so they are an asset.'

  9:
    answer: C
    steps:
      - 'This is the profit and loss appropriation account of a partnership, which shares out the net profit.'
      - 'Rule: the net profit is shared out as interest on capital, partners'' salaries and then the shares of the remaining profit. So, working back, net profit = the total of all the appropriations (with no interest on drawings given).'
      - 'Kudu: $750 + 800 + 3{,}300 = ₦4{,}850$. Wale: $550 + 600 + 3{,}300 = ₦4{,}450$. Net profit $= 4{,}850 + 4{,}450 = ₦9{,}300$.'
      - 'Check by type: interest $1{,}300$ + salaries $1{,}400$ + shares $6{,}600 = ₦9{,}300$.'
      - 'Two partners running a pharmacy in Kano pay themselves interest and salaries from the profit first, then split what is left equally.'
      - 'Remember: everything given out on the appropriation account came from the net profit.'
      - 'The trap is A, ₦6,600. That is only the shared residue; interest and salaries were taken from the net profit first.'
    hint: 'Every naira given to the partners in the account came out of the net profit. Add them all.'
    why:
      A: '₦6,600 is only the residue shared equally, without interest on capital and salaries.'
      B: '₦4,850 is Kudu''s total appropriation alone.'
      D: '₦4,450 is Wale''s total appropriation alone.'

  10:
    answer: B
    steps:
      - 'This is the conversion of a partnership into a limited liability company, which works like a dissolution of the partnership.'
      - 'Rule: the company is a new legal person, separate from its members. The partnership''s books are closed through a realisation account, the assets are sold to the company for shares (purchase consideration), and the company opens new books.'
      - 'So even though Dele and Seun are the same people, the partnership ends formally and the company begins with its own books.'
      - 'Two brothers running a block-making business in Ilorin who register it as a limited company close the partnership books and open fresh books for the company.'
      - 'Remember: new legal person, new books.'
      - 'The trap is A. The members are the same, but the business is now a different legal person, so it cannot simply continue in the old books.'
    hint: 'Is a limited company the same legal person as the partnership that formed it?'
    why:
      A: 'The company is a separate legal person, so the partnership books cannot simply carry on.'
      C: 'Goodwill may be valued if the partners agree, but no law requires it.'
      D: 'Shares are allotted by agreement, usually in the old capital or profit ratios, not necessarily equally.'

  11:
    answer: B
    steps:
      - 'This is the single column cash book, which records only cash received and cash paid.'
      - 'Rule: the number of money columns follows the trader''s needs. Single column: cash only. Two column: cash and bank. Three column: cash, bank and discount.'
      - 'A petty trader with no bank nearby has no bank transactions, and gives or gets little discount, so a single money column for cash is all he needs.'
      - 'A woman selling pepper and tomatoes in a village market near Ogoja writes each day''s takings on the left and her payments on the right in one cash column.'
      - 'Remember: one kind of money, one column.'
      - 'The trap is C, the two column cash book. Its second column is for the bank, which this trader does not use.'
    hint: 'If there is no bank, which column of the bigger cash books would always stay empty?'
    why:
      A: 'There is no standard four column cash book for a petty trader; he needs only cash.'
      C: 'The two column cash book adds a bank column, useless where there is no bank.'
      D: 'The three column cash book adds bank and discount columns, more than a petty cash trader needs.'

  12:
    answer: A
    steps:
      - 'This is the general journal (the journal proper), a book of original entry for items that fit no other day book.'
      - 'Rule: its columns are date, particulars with a short narration, folio, debit and credit. Each entry names the account debited, then the account credited, then explains why.'
      - 'For example: 1 March, Motor van Dr ₦800,000, Capital Cr ₦800,000, being a van brought in by the owner.'
      - 'A bakery in Ibadan uses the journal for opening entries, buying an oven on credit and putting errors right.'
      - 'Remember: Date, Narration, Folio, Debit, Credit, "Dear Nigerians Fill Debit Credit".'
      - 'The trap is C. It looks like A but replaces the credit column with purchases, which is an account, not a journal column.'
    hint: 'Every journal entry has both a debit and a credit. Which list keeps both?'
    why:
      B: 'It drops the narration and adds "sales", an account, not a column.'
      C: 'It drops the credit column and adds "purchases", an account, not a column.'
      D: 'It drops the debit column and adds "discount", which is not a journal column.'

  13:
    answer: D
    steps:
      - 'This is a missing figure in a trial balance: the cash balance that makes the debit column equal the credit column.'
      - 'Rule (DEAD CLIC): expenses, assets and drawings are debits; liabilities, income and capital are credits. Cash in hand is an asset, so it is the missing debit.'
      - 'Credits: sales $197{,}000$ + share capital $120{,}000$ + creditors $16{,}050 = ₦333{,}050$.'
      - 'Debits: fixed assets $85{,}600$ + stock $34{,}300$ + salaries $37{,}000$ + purchases $127{,}700$ + motor expenses $10{,}500$ + debtors $25{,}000 = ₦320{,}100$.'
      - 'Cash $= 333{,}050 - 320{,}100 = ₦12{,}950$. Check: $320{,}100 + 12{,}950 = 333{,}050$.'
      - 'Remember: total the side you are sure of, then the missing balance is the gap.'
      - 'The trap is B, ₦12,905. It swaps the last two digits of the right figure, so take care with each column.'
    hint: 'Add the three credit balances, then add the six debit balances. What fills the gap?'
    why:
      A: '₦12,095 jumbles the digits of the right figure, ₦12,950.'
      B: '₦12,905 swaps the last two digits of ₦12,950.'
      C: '₦12,590 swaps the middle digits of ₦12,950.'

  14:
    answer: C
    steps:
      - 'This is the total of the trial balance, the figure at the foot of both columns once every balance is in.'
      - 'Rule: when the books agree, the debit total equals the credit total, so either column gives the answer.'
      - 'Credits: $197{,}000 + 120{,}000 + 16{,}050 = ₦333{,}050$.'
      - 'Debits with cash: $320{,}100 + 12{,}950 = ₦333{,}050$. Both columns agree, which is the check.'
      - 'A trading company in Port Harcourt adds both columns of its month-end trial balance and writes the same total under each.'
      - 'Remember: one total, written twice.'
      - 'The trap is A, ₦335,050. It is ₦2,000 too much; adding sales, share capital and creditors carefully gives ₦333,050.'
    hint: 'The credit side has only three balances. What do they add up to?'
    why:
      A: '₦335,050 is ₦2,000 more than the three credit balances add up to.'
      B: '₦323,050 is ₦10,000 less than the true total.'
      D: '₦230,550 is far below either column; it jumbles the digits.'

  15:
    answer: A
    steps:
      - 'This is share capital, the money the owners (shareholders) have invested in a limited company.'
      - 'Rule: in a company the owners'' investment is shown as share capital, a credit balance. Creditors are owed to outsiders, and sales are income, so neither is the owners'' capital.'
      - 'In Udo Co. Ltd''s list the only capital balance is share capital, ₦120,000.'
      - 'If a hundred people in Owerri each buy ₦1,200 of shares in a new bakery company, its share capital is ₦120,000.'
      - 'Remember: owners of a company hold shares, so their capital is share capital.'
      - 'The trap is to add the creditors to the share capital. Creditors are outsiders who have lent the company goods, not owners.'
    hint: 'Which balance in the list belongs to the shareholders?'
    why:
      B: '₦103,000 is not a balance in the list; the share capital is ₦120,000.'
      C: '₦100,000 is not a balance in the list; the share capital is ₦120,000.'
      D: '₦110,000 is not a balance in the list; the share capital is ₦120,000.'

  16:
    answer: B
    steps:
      - 'These are the company''s liabilities to outsiders, the amounts it owes to people other than its owners.'
      - 'Rule: liabilities are credit balances owed to outsiders, such as creditors, loans and accruals. Share capital is owed to the owners and is shown as equity, not as a liability to outsiders.'
      - 'In the list the only amount owed to outsiders is creditors, ₦16,050. Sales are income and share capital is equity.'
      - 'A supermarket company in Abuja owes its suppliers for goods bought on credit; that amount, its trade creditors (payables), is a liability.'
      - 'Remember: owners own, outsiders are owed.'
      - 'The trap is C, ₦136,050. It adds share capital to the creditors, treating the shareholders as outsiders.'
    hint: 'Which credit balance is owed to someone outside the company?'
    why:
      A: '₦120,000 is share capital, owed to the owners, not to outsiders.'
      C: '₦136,050 adds share capital to the creditors; only the creditors are outsiders.'
      D: '₦29,000 adds the cash balance to the creditors, but cash is an asset, not a liability.'

  17:
    answer: B
    steps:
      - 'This is the trial balance total, with one balance, drawings, to be worked out first.'
      - 'Rule: drawings are 50% of capital, and drawings are a debit (DEAD CLIC). Then total each column.'
      - 'Drawings $= 50\% \times 2{,}000 = ₦1{,}000$.'
      - 'Debits: bank $1{,}200$ + purchases $2{,}500$ + stock $1{,}300$ + fixed assets $3{,}700$ + drawings $1{,}000 = ₦9{,}700$. Credits: capital $2{,}000$ + sales $6{,}700$ + creditors $1{,}000 = ₦9{,}700$. The columns agree.'
      - 'A provisions shop in Onitsha whose owner takes goods and cash for his family each month shows those drawings on the debit side.'
      - 'Remember: drawings reduce what the owner is owed, so they sit on the debit side.'
      - 'The trap is A, ₦8,700. That is the debit column without the drawings.'
    hint: 'Find the drawings first, then decide which side they go on.'
    why:
      A: '₦8,700 is the debit column with the drawings left out.'
      C: '₦7,800 is not the total of either column.'
      D: '₦7,900 is not the total of either column.'

  18:
    answer: A
    steps:
      - 'These are drawings, the cash or goods the owner takes out of the business for private use.'
      - 'Rule: here drawings are estimated at 50% of capital.'
      - 'Drawings $= \dfrac{50}{100} \times 2{,}000 = ₦1{,}000$.'
      - 'Check: with ₦1,000 of drawings the debits total ₦9,700, the same as the credits, so the trial balance agrees.'
      - 'A trader in Kano who takes rice from his own shop for his household records it as drawings, not as an expense.'
      - 'Remember: drawings go out to the owner, so they come off what the business owes him.'
      - 'The trap is B, ₦2,000. That is the whole capital, not half of it.'
    hint: 'What is half of the capital?'
    why:
      B: '₦2,000 is the whole capital, not 50% of it.'
      C: '₦1,500 is 75% of capital and would make the debits exceed the credits by ₦500.'
      D: '₦1,250 is 62.5% of capital and would make the debits exceed the credits by ₦250.'

  19:
    answer: A
    steps:
      - 'This is a missing figure found from the capital equation, used when a trader keeps incomplete records.'
      - 'Rule: $\text{Closing capital} = \text{Opening capital} + \text{Profit} - \text{Drawings}$, so $\text{Drawings} = \text{Opening capital} + \text{Profit} - \text{Closing capital}$.'
      - 'Opening capital is what he started with: shop $54{,}000$ + stock $7{,}600 = ₦61{,}600$.'
      - 'Drawings $= 61{,}600 + 22{,}100 - 73{,}800 = 83{,}700 - 73{,}800 = ₦9{,}900$. Check: $61{,}600 + 22{,}100 - 9{,}900 = 73{,}800$.'
      - 'A shoe seller in Aba who knows what he started with, what he earned and what he has now can tell how much he took home.'
      - 'Remember: start, plus profit, less drawings, gives the end.'
      - 'The trap is to forget the stock in the opening capital; the shop and the stock together are ₦61,600.'
    hint: 'Opening capital plus profit is ₦83,700. How much is missing at the end?'
    why:
      B: '₦2,300 does not fit the equation; ₦61,600 + ₦22,100 − ₦2,300 is ₦81,400, not ₦73,800.'
      C: '₦19,500 would leave a closing capital of ₦64,200, not ₦73,800.'
      D: '₦17,100 would leave a closing capital of ₦66,600, not ₦73,800.'

  20:
    answer: A
    steps:
      - 'This is the provision for depreciation account (accumulated depreciation), which builds up each year''s depreciation charge on an asset.'
      - 'Rule: each year''s charge is debited to the profit and loss account and credited to the provision account. The provision''s balance is shown on the balance sheet as a deduction from the fixed asset''s cost, giving the net book value.'
      - 'A van costing ₦2,000,000 with ₦600,000 accumulated depreciation is shown as $2{,}000{,}000 - 600{,}000 = ₦1{,}400{,}000$ net book value.'
      - 'A transport company in Onitsha shows each bus at cost less its depreciation to date.'
      - 'Remember: the charge goes to profit and loss, the balance comes off the asset.'
      - 'The trap is D. Only the charge for the year is taken to the profit and loss account; the balance built up over the years is deducted from the asset.'
    hint: 'Where is the net book value of an asset worked out?'
    why:
      B: 'Depreciation lowers an asset''s value, so it is never added to the asset.'
      C: 'Accumulated depreciation is not owed to anyone, so it is not a current liability.'
      D: 'Only the year''s charge goes to profit and loss; the accumulated balance is deducted from the asset.'

  21:
    answer: C
    steps:
      - 'This is the order of the bookkeeping cycle, from the first paper to the trial balance.'
      - 'Rule: a transaction first produces a source document (invoice, receipt, credit note). It is entered in a book of original entry, posted to the ledger accounts, and the ledger balances are then listed in the trial balance.'
      - 'So the order is source documents, then ledgers, then trial balance.'
      - 'A pharmacy in Enugu files its invoices, posts them to the ledger at the end of each day, and extracts a trial balance at the month end.'
      - 'Remember: paper, post, prove.'
      - 'The trap is A. The ledger cannot come first, because nothing can be posted until a source document shows that a transaction happened.'
    hint: 'What must exist before anything can be written in a ledger?'
    why:
      A: 'Ledger entries are made from source documents, so the documents must come first.'
      B: 'It puts the source documents last, but they are where the whole process starts.'
      D: 'The cash account is only one ledger account; the process starts with the source documents.'

  22:
    answer: A
    steps:
      - 'This is an error of principle: an entry made in the wrong class of account.'
      - 'Rule: a motor vehicle bought for use is a fixed asset (capital expenditure) and should be debited to the motor vehicles account. Purchases is a revenue account for goods bought for resale. Debiting purchases puts a capital item in a revenue account.'
      - 'The amounts and sides are right, so the trial balance still agrees. To put the error right: debit motor vehicles account, credit purchases account.'
      - 'A trader in Kano who buys a bus for deliveries and books it as purchases overstates his cost of sales and understates his profit and his assets.'
      - 'Remember: principle, wrong class of account; commission, right class but wrong person''s account.'
      - 'The trap is D, commission. Commission is posting to the wrong account of the same class, such as Ade''s account instead of Ada''s; here the class itself is wrong.'
    hint: 'Is the purchases account the same kind of account as a motor vehicle account?'
    why:
      B: 'Omission means the transaction was not recorded at all, but it was recorded here.'
      C: 'An error of original entry is a wrong amount entered on both sides; here the amount is right.'
      D: 'Commission is the wrong account of the right class; here a capital item went to a revenue account.'

  23:
    answer: C
    steps:
      - 'This is the accruals basis of accounting compared with the cash basis.'
      - 'Rule: the cash basis records income and expenses only when cash is received or paid. The accruals basis records them when they are earned or incurred, so sales not yet paid for create debtors (receivables) and costs not yet paid create creditors (payables).'
      - 'So what accrual accounting recognises that cash accounting does not is debtors and creditors.'
      - 'A provisions shop in Onitsha that sells ₦50,000 of goods on credit in December shows the sale and a debtor in December under the accruals basis, even though the cash comes in January.'
      - 'Remember: accruals means owed, both ways.'
      - 'The trap is B. Cash is recorded under both bases, so cash cannot be the difference.'
    hint: 'Which two items exist only because money is owed and has not yet moved?'
    why:
      A: 'Cash is recorded under both bases, and creditors alone are only half the difference.'
      B: 'Cash is recorded under both bases, and debtors alone are only half the difference.'
      D: 'Cash is recorded under both bases; prepayments alone are only part of the difference.'

