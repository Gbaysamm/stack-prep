    hint: 'The cash book was debited. Which side of the payer''s account is the other half of the entry?'
    why:
      B: 'The payer is a person, so his personal account is credited, not a real (asset) account.'
      C: 'The cash book was debited, so the other entry must be a credit, not a debit.'
      D: 'The cash book was debited, so the other entry must be a credit, not a debit.'

