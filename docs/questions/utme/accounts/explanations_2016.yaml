      - 'Cost of goods sold $= 20{,}000 + 250{,}000 - 40{,}000 = ₦230{,}000$, as the extract shows. Gross profit $= 370{,}000 - 230{,}000 = ₦140{,}000$.'
      - 'Check: $230{,}000 + 140{,}000 = 370{,}000$, the net sales.'
