      - 'At ₦5 per ₦1,000, a trader whose withdrawals in a month total ₦400,000 would pay ₦2,000 COT.'
      - 'Today the Central Bank has phased COT out, and banks charge a capped account maintenance fee on current accounts instead.'
      - 'Remember: COT goes with current accounts, the accounts that turn over money every day.'
      - 'The trap is C, all bank accounts. Savings and fixed deposit accounts were not charged COT.'
    hint: 'Which kind of account carries the many cheque payments that make up turnover?'
    why:
      A: 'Savings accounts earn interest and were not charged commission on turnover.'
      C: 'COT was not charged on savings or fixed deposit accounts, only on current accounts.'
      D: 'Fixed deposits earn interest and have few transactions, so they carry no COT.'

