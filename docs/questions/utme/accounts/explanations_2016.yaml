      - '$\text{Gross profit} = \text{Net sales} - \text{Cost of goods sold}$.'
      - 'A shoe shop in Aba sells ₦500,000 of shoes that cost ₦350,000, so its trading account shows ₦150,000 gross profit.'
      - 'Remember: trading gives gross; profit and loss gives net.'
      - 'The trap is A, net profit. Net profit comes after the expenses, in the profit and loss account, not in the trading account.'
    hint: 'Which profit is found before any expenses are taken off?'
    why:
      A: 'Net profit is found in the profit and loss account, after the expenses.'
      B: 'Purchases appear in the trading account, but showing them is not its purpose.'
      D: 'Sales appear in the trading account, but its purpose is to find the gross profit.'
