    answer: C
    steps:
      - 'This is the straight line method of depreciation, which spreads an asset''s cost evenly over its useful life.'
      - 'Rule: $\text{Annual depreciation} = \dfrac{\text{Cost} - \text{Scrap value}}{\text{Useful life}}$. The scrap value (residual value) is what the asset will fetch at the end, so it is not used up and is taken off first.'
      - 'A machine costing ₦600,000, with a scrap value of ₦50,000 and a life of 5 years: $\dfrac{600{,}000 - 50{,}000}{5} = ₦110{,}000$ a year.'
      - 'A cassava processing firm in Ogun State charges the same depreciation on its grater every year using this formula.'
      - 'Remember: cost minus scrap, over life; the same each year, a straight line.'
      - 'The trap is B. It uses sales in place of cost, but sales have nothing to do with the asset''s depreciation.'
    hint: 'What did the asset cost, and what will it still be worth at the end?'
    why:
      A: 'Depreciation uses the asset''s cost, not sales, and the scrap value is taken off, not added.'
      B: 'It uses sales in place of the asset''s cost.'
      D: 'Purchases and sales are trading figures and have nothing to do with an asset''s depreciation.'

