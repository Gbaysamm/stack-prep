      - 'The club''s income and expenditure account plays the role of the profit and loss account, and its own balance sheet shows the accumulated fund.'
      - 'A tennis club in Jos lists all subscriptions received and all bills paid in the year; the closing figure is the cash in hand and at bank.'
      - 'Remember: receipts and payments, cash in and cash out, a cash account.'
      - 'The trap is C, a balance sheet. A club has its own balance sheet; the receipts and payments account shows only cash.'
    hint: 'What does a receipts and payments account record: cash, or profit?'
    why:
      B: 'It records receipts as well as payments, so it is not an expenses account.'
      C: 'A club prepares a separate balance sheet; the receipts and payments account shows only cash moving in and out.'
      D: 'It records payments as well as receipts, and the club''s income account is the income and expenditure account.'

  26:
    answer: C
    steps:
      - 'This is goodwill brought in by a new partner as a premium in cash.'
      - 'Rule: the old partners give up part of their profit share to the newcomer, so they are paid for it. The entry is: debit cash, credit the old partners'' capital accounts in their sacrificing ratio. No goodwill account is opened.'
      - 'Sacrifice = old share − new share. Osei: $\dfrac{3}{5} - \dfrac{1}{3} = \dfrac{4}{15}$. Yabo: $\dfrac{2}{5} - \dfrac{1}{3} = \dfrac{1}{15}$. So the ₦30,000 is shared 4:1, Osei ₦24,000 and Yabo ₦6,000. Check: $24{,}000 + 6{,}000 = 30{,}000$.'
      - 'When a third lawyer joins a two-partner firm in Lagos and pays for a share of the clients the firm has built up, that cash goes to the two old partners.'
      - 'Remember: the newcomer pays, the old partners who give up share are credited.'
      - 'The trap is A. A goodwill account is debited only when goodwill is raised in the books; when the cash is paid, cash is debited and the old partners are credited.'
    hint: 'Who gives up part of their profit share when Takwa joins, and so who should receive the ₦30,000?'
    why:
      A: 'The cash account is debited; a goodwill account is used only when goodwill is raised in the books.'
      B: 'Takwa paid the premium, so it is not credited to him; it is credited to the partners who gave up their share.'
      D: 'Takwa gave up nothing, so he does not share the premium; only the old partners are credited.'

  27:
    answer: B
    steps:
