      - 'Rule: the cash book is itself a ledger account. Every debit in it needs a credit in another ledger account. Cash received from a debtor is debited in the cash book and credited to that debtor''s personal account in the ledger.'
      - 'Example: Musa pays ₦8,000. Debit cash book ₦8,000; credit Musa''s account in the sales ledger ₦8,000.'
      - 'A pharmacy in Enugu receives cash from a clinic that owes it, and credits the clinic''s account so it shows less owing.'
      - 'Remember: debit the receiver, credit the giver; Musa gave, so Musa is credited.'
