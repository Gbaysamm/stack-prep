format_version: 1
exam_year: 2017
subject: ACC
explanations:
  1:
    answer: C
    steps:
      - 'This is the profit and loss appropriation account, the account that shows how a partnership''s net profit is shared.'
      - 'A sole trader keeps all the net profit, so it goes straight to her capital account. Partners must divide theirs, so a partnership adds an appropriation account below the profit and loss account.'
      - 'The appropriation account is credited with the net profit and with interest on drawings, then debited with interest on capital, partners'' salaries and each partner''s share of what is left.'
      - 'Two lawyers in Abuja share a net profit of ₦2,400,000. Their appropriation account first gives each the interest on capital the deed allows, then splits the rest in their profit sharing ratio.'
      - 'Remember: a sole trader takes it all, partners must appropriate.'
      - 'The trap is D, the capital account. A sole trader has a capital account too, so it does not set the two apart.'
    hint: 'Which account exists only because there is more than one owner to share the profit?'
    why:
      A: 'A sole trader keeps a drawings account too, so drawings do not set a partnership apart.'
      B: 'Every business that buys on credit has creditors, sole trader or partnership.'
      D: 'A sole trader also has a capital account; only the appropriation account is special to partners.'

  2:
    answer: B
    steps:
      - 'This is goodwill, the extra value of a business''s good name, location and customers above its net assets.'
      - 'Rule: under the prudence concept, goodwill is shown as an asset only when it has been purchased, that is, paid for when a business was bought. Goodwill a business builds for itself is not recorded, because its value cannot be measured reliably.'
      - 'When a buyer pays ₦5,000,000 for a business whose net assets are worth ₦4,200,000, the extra ₦800,000 is purchased goodwill: debit goodwill, credit cash.'
      - 'In a partnership, goodwill is valued when a partner joins, retires or dies, but only to adjust the partners'' capitals fairly; the goodwill account is normally written off again.'
      - 'A pharmacist in Enugu who buys a well-known chemist shop pays extra for its loyal customers. That extra is recorded as goodwill in her books.'
      - 'Remember: no payment, no goodwill in the books.'
      - 'The trap is A, the admission of a new partner. Goodwill is valued then, but only to share it fairly between partners, not to keep it as an asset.'
    hint: 'Under prudence, what must happen before an intangible like goodwill can be measured reliably?'
    why:
      A: 'On admission goodwill is valued to adjust capitals and is normally written off, not kept as an asset.'
      C: 'On a partner''s death goodwill is valued to settle what is due to the estate, then written off.'
      D: 'Raising goodwill to hide insolvency would overstate the assets, which prudence forbids.'

  3:
    answer: A
    steps:
      - 'This is putting right an error where an entry was made on the wrong sides of the accounts.'
      - 'Rule: a cash payment to John should be debit John, credit cash. Putting right a reversed entry needs twice the amount: once to cancel the wrong entry and once to make the right one.'
      - 'The wrong entry was debit cash ₦20, credit John ₦20. Debit John ₦20, credit cash ₦20 cancels it. Debit John ₦20, credit cash ₦20 again records the payment. Together: debit John ₦40, credit cash ₦40.'
      - 'Check: cash had ₦20 wrongly added and must now lose ₦20 for the real payment, a fall of ₦40. John''s account wrongly showed ₦20 owed to him and should show ₦20 paid to him, also a change of ₦40.'
      - 'A shopkeeper in Kaduna pays her supplier John ₦20 but writes it on the receipts side. Her cash book now shows ₦40 more than the cash in her drawer.'
      - 'Remember: wrong side, double it.'
      - 'The trap is D, John ₦20 Dr, Cash ₦20 Cr. It only cancels the wrong entry and leaves the payment unrecorded.'
    hint: 'First undo the wrong entry, then make the right one. How much does that come to?'
    why:
      B: 'Debit cash and credit John repeats the wrong direction, making the error twice as big.'
      C: 'Debit cash ₦20, credit John ₦20 is the same as the wrong entry, so it doubles the error.'
      D: 'This cancels the wrong entry but leaves the ₦20 payment unrecorded.'

  4:
    answer: C
    steps:
      - 'This is finding a missing purchases figure by working back through the trading and profit and loss account (the statement of profit or loss).'
      - 'Rules: $\text{Gross profit} = \text{Net profit} + \text{Expenses}$, $\text{Cost of sales} = \text{Sales} - \text{Gross profit}$ and $\text{Purchases} = \text{Cost of sales} + \text{Closing stock} - \text{Opening stock}$.'
      - 'Gross profit = ₦1,000 + ₦2,000 = ₦3,000. Cost of sales = ₦11,000 − ₦3,000 = ₦8,000. Purchases = ₦8,000 + ₦6,400 − ₦2,400 = ₦12,000.'
      - 'Check forwards: opening stock ₦2,400 + purchases ₦12,000 − closing stock ₦6,400 = ₦8,000 cost of sales; ₦11,000 − ₦8,000 = ₦3,000 gross profit; ₦3,000 − ₦2,000 = ₦1,000 net profit, as given.'
      - 'A provisions shop in Onitsha lost its purchase invoices for the month, but the owner knows her stock, sales and profit, and works back to ₦12,000 of purchases.'
      - 'Remember: climb back up the account, net profit to gross profit to cost of sales to purchases.'
      - 'The trap is D, ₦14,000. It takes the ₦1,000 as gross profit and forgets to add back the ₦2,000 of other expenses.'
    hint: 'Add the expenses back to the net profit first. What is the gross profit?'
    why:
      A: '₦13,000 would give cost of sales of ₦9,000 and a net profit of nothing, not ₦1,000.'
      B: '₦11,000 is the sales figure, not the purchases.'
      D: '₦14,000 treats the ₦1,000 as gross profit and forgets the ₦2,000 of other expenses.'

  5:
    answer: A
    steps:
      - 'This is the subscription income of a club for one year, the figure credited to the income and expenditure account.'
      - 'Rule: subscription for the year = cash received − arrears from last year received − advance for next year received + amount still owing for this year. Only what belongs to 1993 counts.'
      - 'Cash received ₦14,400. Take off the ₦750 that belongs to 1992 and the ₦250 that belongs to 1994: $14{,}400 - 750 - 250 = 13{,}400$. Add the ₦900 members still owe for 1993: $13{,}400 + 900 = ₦14{,}300$.'
      - 'Check with the subscriptions account: debit arrears b/d 750 + income 14,300 + advance c/d 250 = 15,300; credit cash 14,400 + owing c/d 900 = 15,300. Both sides agree.'
      - 'An Ibadan social club charges its members a yearly fee. Some pay late for last year, some pay early for next year, and some still owe for this year; the accounts count only this year''s fees.'
      - 'Remember: income for the year is what was earned in the year, not just what came in.'
      - 'The trap is B, ₦13,400. It takes out the arrears and the advance but forgets to add the ₦900 still owing for 1993.'
    hint: 'Which parts of the ₦14,400 belong to other years, and what is still owed for 1993?'
    why:
      B: '₦13,400 forgets to add the ₦900 still owing for 1993.'
      C: '₦15,050 leaves in the ₦750 received for 1992.'
      D: '₦14,550 leaves in the ₦250 received in advance for 1994.'

  6:
    answer: B
    steps:
      - 'This is the accumulated fund, the capital of a club or other not-for-profit body.'
      - 'Rule: $\text{Accumulated fund} = \text{Assets} - \text{Liabilities}$, taken at the opening date.'
      - 'Assets on 1 January 1993: club equipment ₦5,000 + cash at bank ₦2,295 + subscriptions in arrears ₦750 = ₦8,045. The arrears are an asset, because members owe them to the club.'
      - 'Liabilities: rent owing ₦525. Accumulated fund = ₦8,045 − ₦525 = ₦7,520. Check: ₦7,520 + ₦525 = ₦8,045, the total assets.'
      - 'A club in Ibadan cannot have "capital" from an owner, so what it owns less what it owes is its accumulated fund.'
      - 'Remember: own minus owe, the same as a trader''s capital, with a club''s name.'
      - 'The trap is A, ₦8,570. It adds the rent owing to the assets instead of taking it away.'
    hint: 'List what the club owned on 1 January, then take away what it owed.'
    why:
      A: '₦8,570 adds the ₦525 rent owing instead of taking it away.'
      C: '₦8,470 is too large; the assets of ₦8,045 less the rent owing of ₦525 give ₦7,520.'
      D: '₦7,850 is too large; ₦8,045 − ₦525 = ₦7,520.'

  7:
    answer: B
    steps:
      - 'This is the cost of a fixed asset (a non-current asset, under property, plant and equipment).'
      - 'Rule: the cost of a fixed asset is every cost of getting it to its place and ready for use, less any discount received on it. Things bought for later, such as spare parts, are not part of it.'
      - 'Include: invoice price ₦15,000 + sales tax ₦900 − purchases discount ₦300 + freight ₦750 + assembly ₦500 + installation ₦800 + tuning and adjusting ₦700.'
      - '$15{,}000 + 900 = 15{,}900$; $- 300 = 15{,}600$; $+ 750 = 16{,}350$; $+ 500 = 16{,}850$; $+ 800 = 17{,}650$; $+ 700 = ₦18{,}350$. The ₦1,200 spare parts are kept as stores, not added.'
      - 'A bakery in Ibadan buys a new oven. The price, the transport from Lagos and the fitting are all part of the oven''s cost; the spare elements bought for next year are not.'
      - 'Remember: everything to get it working, nothing for later.'
      - 'The trap is C, ₦19,550. It adds the ₦1,200 spare parts, which are for future use, not for getting the machine ready.'
    hint: 'Which costs were needed to make the machine ready for use, and which are for later?'
    why:
      A: '₦17,500 is too small; it leaves out part of the cost of getting the machine ready for use.'
      C: '₦19,550 adds the ₦1,200 spare parts, which are for future use.'
      D: '₦18,950 adds the ₦300 discount instead of taking it off.'

  8:
    answer: D
    steps:
      - 'This is the gross profit method of finding closing stock (inventory), used when stock cannot be counted.'
      - 'Rule: $\text{Cost of sales} = \text{Sales} \times (100\% - \text{gross profit rate})$, then $\text{Closing stock} = \text{Goods available for sale} - \text{Cost of sales}$.'
      - 'Gross profit = 40% × ₦176,000 = ₦70,400. Cost of sales = ₦176,000 − ₦70,400 = ₦105,600, or 60% × ₦176,000.'
      - 'Closing stock = ₦128,000 − ₦105,600 = ₦22,400. Check: ₦128,000 − ₦22,400 = ₦105,600 cost of sales, and ₦176,000 − ₦105,600 = ₦70,400, which is 40% of sales.'
      - 'A pottery in Abuja loses its stock sheets in a fire. From its sales and its usual 40% margin it works out that ₦22,400 of pots should have been on the shelves.'
      - 'Remember: sales less margin gives cost of sales; goods available less cost of sales gives what is left.'
      - 'The trap is A, ₦76,800. That is 60% of the goods available, but the 60% belongs to sales, not to goods available.'
    hint: 'Use the 40% rate on sales to find cost of sales first.'
    why:
      A: '₦76,800 applies 60% to the goods available instead of to sales.'
      B: '₦51,300 does not come from goods available less cost of sales.'
      C: '₦32,000 is too large; cost of sales is ₦105,600, which leaves ₦22,400.'

  9:
    answer: B
    steps:
      - 'This is the quick ratio, also called the acid test ratio, read from the balance sheet (the statement of financial position).'
      - 'Rule: $\text{Quick ratio} = \dfrac{\text{Current assets} - \text{Stock}}{\text{Current liabilities}}$. Stock (inventory) is left out because it takes longest to turn into cash.'
      - 'Quick assets: debtors (receivables) less provision ₦87,000 + cash ₦60,000 + bank ₦100,000 = ₦247,000. Fixed assets and long-term investments are not current.'
      - 'Current liabilities: creditors (payables) ₦200,000 + other current liabilities ₦100,000 = ₦300,000. The long-term loan is not current.'
      - 'Quick ratio $= \dfrac{247{,}000}{300{,}000} = 0.82$, written 0.82:1. Check: $300{,}000 \times 0.82 = 246{,}000$, close to ₦247,000.'
      - 'A Lagos company with a quick ratio of 0.82:1 has only 82 kobo of fast cash for every ₦1 it owes soon, so it may struggle to pay its suppliers on time.'
      - 'Remember: the acid test burns off the stock.'
      - 'The trap is D, 0.91:1. It keeps the stock in, which gives the current ratio, not the quick ratio.'
    hint: 'Take the stock out of current assets, then divide by current liabilities.'
    why:
      A: '0.95:1 does not come from quick assets of ₦247,000 over current liabilities of ₦300,000.'
      C: '1.53:1 is far too large; quick assets are less than current liabilities, so the ratio is below 1.'
      D: '0.91:1 is about the current ratio, 275,000 ÷ 300,000, which keeps the stock in.'

  10:
    answer: A
    steps:
      - 'This is owners'' equity, also called shareholders'' funds: what the company owes its shareholders.'
      - 'Rule: $\text{Owners'' equity} = \text{Share capital} + \text{Reserves}$. Share premium is a capital reserve, and the profit and loss balance is a revenue reserve; both belong to the shareholders.'
      - 'Owners'' equity = ₦200,000 + ₦15,000 + ₦60,000 = ₦275,000.'
      - 'Check with the accounting equation: total assets ₦755,000 − long-term loan ₦180,000 − creditors ₦200,000 − other current liabilities ₦100,000 = ₦275,000.'
      - 'A shareholder in a Lagos plc owns a share of the paid-up capital and of every reserve kept back for the company, not only the shares'' face value.'
      - 'Remember: equity is capital plus reserves, or assets minus outside liabilities.'
      - 'The trap is C, ₦200,000. That is the paid-up capital alone; the share premium and retained profit also belong to the owners.'
    hint: 'Which items on the left side belong to the shareholders and not to outsiders?'
    why:
      B: '₦755,000 is the total of the balance sheet, which includes the loan and creditors owed to outsiders.'
      C: '₦200,000 is only the paid-up capital; it leaves out the share premium and retained profit.'
      D: '₦215,000 adds the share premium but leaves out the ₦60,000 retained profit.'

  11:
    answer: C
    steps:
      - 'This is finding a missing opening stock of raw materials in a manufacturing account.'
      - 'Rule: $\text{Raw materials consumed} = \text{Opening stock} + \text{Purchases} - \text{Returns outwards} - \text{Closing stock}$. Turn it round: $\text{Opening stock} = \text{Consumed} + \text{Closing stock} + \text{Returns outwards} - \text{Purchases}$.'
      - 'Opening stock = ₦300,000 + ₦100,250 + ₦6,700 − ₦320,000. Add first: $300{,}000 + 100{,}250 + 6{,}700 = 406{,}950$. Then $406{,}950 - 320{,}000 = ₦86{,}950$.'
      - 'Check forwards: $86{,}950 + 320{,}000 = 406{,}950$; less returns 6,700 gives 400,250; less closing stock 100,250 gives ₦300,000, the cost of raw materials consumed given.'
      - 'A furniture factory in Aba knows how much timber it used, bought, sent back and has left. From these it finds the timber it must have started the year with.'
      - 'Remember: what you started with, plus what you bought, less what went back, less what is left, is what you used.'
      - 'The trap is A, ₦400,250. That is the raw materials available after returns; the purchases have not been taken out to reach the opening stock.'
    hint: 'Write the raw materials consumed formula, then make opening stock the subject.'
    why:
      A: '₦400,250 is consumed plus closing stock; the ₦320,000 purchases still have to come out.'
      B: '₦73,550 treats the returns the wrong way round, taking them off instead of adding them back.'
      D: '₦100,250 is the closing stock, not the opening stock.'

  12:
    answer: B
    steps:
      - 'This is the production cost of finished goods in the manufacturing account.'
      - 'Rule: $\text{Prime cost} = \text{Raw materials consumed} + \text{Direct wages} + \text{Direct expenses}$, and $\text{Production cost} = \text{Prime cost} + \text{Factory overheads}$ (with no work in progress to adjust).'
      - 'Factory overheads: lighting $\tfrac{1}{3} \times 30{,}000 = 10{,}000$; power $\tfrac{2}{5} \times 75{,}000 = 30{,}000$; insurance $\tfrac{1}{6} \times 36{,}000 = 6{,}000$; rent $\tfrac{1}{7} \times 56{,}000 = 8{,}000$. Total = ₦54,000.'
      - 'Prime cost = ₦300,000 + ₦27,000 = ₦327,000. Production cost = ₦327,000 + ₦54,000 = ₦381,000.'
      - 'Check: the office takes the rest of each expense, ₦20,000 + ₦45,000 + ₦30,000 + ₦48,000 = ₦143,000, and $54{,}000 + 143{,}000 = 197{,}000$, the total of the four bills.'
      - 'A soap factory in Aba pays one electricity bill for the factory and the office, so only the factory''s share goes into the cost of making the soap.'
      - 'Remember: prime cost is direct costs; add the factory''s share of overheads for production cost.'
      - 'The trap is C, ₦327,000. That is the prime cost; the factory overheads have not been added.'
    hint: 'Find the factory''s share of each overhead first, then build prime cost.'
    why:
      A: '₦408,000 counts the ₦27,000 wages twice.'
      C: '₦327,000 is the prime cost, before the factory overheads are added.'
      D: '₦54,000 is the factory overheads alone.'

  13:
    answer: D
    steps:
      - 'This is subscriptions received in advance, money members paid for next year''s membership.'
      - 'Rule: money received for a service the club has not yet given is owed to the members, so it is a liability. It will be used up within a year, so it is a current liability.'
      - 'In the subscriptions account the ₦6,000 is carried down as a credit balance, and it appears under current liabilities in the balance sheet (statement of financial position).'
      - 'A sports club in Port Harcourt collects next year''s fees in December. If it closed in January it would have to pay that money back, so it owes it.'
      - 'Remember: in advance is in debt; in arrears is an asset.'
      - 'The trap is C, a current asset. That is subscriptions in arrears, money members owe the club, not money the club holds for them.'
    hint: 'Has the club given the members anything yet for that ₦6,000?'
    why:
      A: 'The club''s capital is its accumulated fund; advance subscriptions are owed to members.'
      B: 'A fixed asset is something like equipment kept for long use, not money received.'
      C: 'Subscriptions in arrears are a current asset; subscriptions in advance are the opposite.'

  14:
    answer: A
    steps:
      - 'This is the subscription income for the year, credited to the income and expenditure account.'
      - 'Rule: subscription for the year = cash received − arrears for last year received − advance for next year received (+ any still owing for this year, here none).'
      - 'Subscription = ₦30,000 − ₦4,000 − ₦6,000 = ₦20,000.'
      - 'Check: ₦20,000 for this year + ₦4,000 for last year + ₦6,000 for next year = ₦30,000, the cash received.'
      - 'A Kano youth club takes in ₦30,000 of fees, but ₦4,000 settles last year and ₦6,000 is for next year. Only ₦20,000 is this year''s income.'
      - 'Remember: count only this year''s fees, whenever they were paid.'
      - 'The trap is B, ₦30,000. That is the cash received, but part of it belongs to other years.'
    hint: 'Take out of the ₦30,000 what belongs to last year and to next year.'
    why:
      B: '₦30,000 is the cash received, which includes money for other years.'
      C: '₦34,000 adds the ₦4,000 for last year instead of taking it out.'
      D: '₦36,000 adds the ₦6,000 for next year instead of taking it out.'

  15:
    answer: A
    steps:
      - 'This is net profit found from a gross profit ratio (gross margin) and the expenses.'
      - 'Rule: $\text{Gross profit} = \text{Gross profit ratio} \times \text{Net sales}$, then $\text{Net profit} = \text{Gross profit} - \text{Expenses}$.'
      - 'Net sales = ₦161,000 − ₦4,000 = ₦157,000. Gross profit = 25% × ₦157,000 = ₦39,250.'
      - 'Net profit = ₦39,250 − ₦20,845 = ₦18,405. Check: ₦18,405 + ₦20,845 = ₦39,250, and ₦39,250 ÷ ₦157,000 = 25%.'
      - 'Erero runs a provisions store in Benin. Each ₦100 of goods she sells brings ₦25 of gross profit, and from that she pays her shop''s running costs.'
      - 'Remember: the ratio works on net sales, after returns inwards.'
      - 'The trap is C, ₦19,149. It does not come from 25% of net sales less the expenses; always find the gross profit first.'
    hint: 'Find 25% of net sales first.'
    why:
      B: '₦21,655 would need a gross profit of ₦42,500, but 25% of ₦157,000 is ₦39,250.'
      C: '₦19,149 does not come from 25% of ₦157,000 less ₦20,845.'
      D: '₦16,168 is too small; ₦39,250 − ₦20,845 = ₦18,405.'

  16:
    answer: C
    steps:
      - 'This is finding closing stock from the gross profit ratio, working back through the trading account.'
      - 'Rule: $\text{Cost of sales} = \text{Net sales} - \text{Gross profit}$, and $\text{Closing stock} = \text{Goods available for sale} - \text{Cost of sales}$.'
      - 'Gross profit = 25% × ₦157,000 = ₦39,250. Cost of sales = ₦157,000 − ₦39,250 = ₦117,750.'
      - 'Closing stock = ₦149,000 − ₦117,750 = ₦31,250.'
      - 'Check: the debit side is ₦117,750 cost of sales + ₦39,250 gross profit = ₦157,000, the same as net sales on the credit side.'
      - 'A trader in Benin whose stock count is lost uses her usual margin to work out the ₦31,250 of goods that should be left.'
      - 'Remember: goods available less what was sold is what is left.'
      - 'The trap is D, ₦45,000. That is the opening stock, not the closing stock.'
    hint: 'Cost of sales is net sales less gross profit. What is left of goods available?'
    why:
      A: '₦72,000 would make cost of sales ₦77,000 and gross profit ₦80,000, far more than 25%.'
      B: '₦42,500 would make cost of sales ₦106,500 and gross profit ₦50,500, more than 25%.'
      D: '₦45,000 is the opening stock.'

  17:
    answer: D
    steps:
      - 'This is gross capital employed, the total of all the assets a business uses.'
      - 'Rule: $\text{Gross capital employed} = \text{Fixed assets} + \text{Current assets}$. (Net capital employed takes away current liabilities as well.)'
      - 'Fixed assets: land and buildings ₦18,470 + furniture and fittings ₦5,120 + motor vehicles ₦3,462 = ₦27,052. Current assets: stock ₦3,000 + debtors ₦11,474 + cash ₦1,518 = ₦15,992.'
      - 'Gross capital employed = ₦27,052 + ₦15,992 = ₦43,044. Check: debit total ₦46,044 less drawings ₦3,000 = ₦43,044, since drawings are the only debit that is not an asset.'
      - 'For comparison, net capital employed is ₦43,044 − ₦7,354 = ₦35,690, which equals capital ₦24,000 + profit ₦3,600 − drawings ₦3,000 + mortgage ₦11,090.'
      - 'A transport business in Jos uses buildings, vehicles, stock and cash to earn its profit. Together they are the gross capital it employs.'
      - 'Remember: gross means all the assets, net means after current liabilities.'
      - 'The trap is B, ₦43,052. It adds fixed assets to a current asset total of ₦16,000, but current assets come to ₦15,992.'
    hint: 'Add up every asset balance. Is drawings an asset?'
    why:
      A: '₦44,600 is not the total of the asset balances, which is ₦43,044.'
      B: '₦43,052 uses ₦16,000 for current assets; they total ₦15,992.'
      C: '₦38,600 is neither the total assets of ₦43,044 nor the net figure of ₦35,690.'

  18:
    answer: C
    steps:
      - 'This is fixed assets (non-current assets), the assets kept for long use in the business.'
      - 'Rule: fixed assets are held to run the business, not to sell. Here they are land and buildings, furniture and fittings and motor vehicles.'
      - 'Fixed assets = ₦18,470 + ₦5,120 + ₦3,462 = ₦27,052. Add in steps: $18{,}470 + 5{,}120 = 23{,}590$, then $23{,}590 + 3{,}462 = 27{,}052$.'
      - 'Check: total assets ₦43,044 − current assets ₦15,992 = ₦27,052.'
      - 'A shop in Jos keeps its building, shelves and delivery van for years, but sells its stock every week. Only the first three are fixed assets.'
      - 'Remember: fixed assets stay, current assets circulate.'
      - 'The trap is B, ₦18,470. That is only the land and buildings; furniture and vehicles are fixed assets too.'
    hint: 'Which balances are kept for long use rather than for sale?'
    why:
      A: '₦15,992 is the total of the current assets.'
      B: '₦18,470 is only the land and buildings.'
      D: '₦27,000 is close but not the exact sum, ₦27,052.'

  19:
    answer: D
    steps:
      - 'This is a departmental profit and loss account, with shared expenses apportioned between departments.'
      - 'Rule: an expense not already split is shared in the agreed ratio, here 60% to S and 40% to T. Then $\text{Net profit} = \text{Gross profit} - \text{Expenses}$ for each department.'
      - 'Electricity for S = 60% × ₦2,000 = ₦1,200 (T takes ₦800). Department S''s expenses: salaries ₦1,800 + electricity ₦1,200 + depreciation ₦600 = ₦3,600.'
      - 'Net profit of S = ₦6,000 − ₦3,600 = ₦2,400.'
      - 'Check: T''s net profit is ₦4,000 − ₦1,200 − ₦800 − ₦400 = ₦1,600, as shown, and ₦2,400 + ₦1,600 = ₦4,000, the total net profit.'
      - 'A supermarket in Lagos with a food department and a clothing department splits its one electricity bill so each department carries its fair share.'
      - 'Remember: share the common costs first, then subtract.'
      - 'The trap is C, ₦3,600. That is S''s total expenses, or its profit with the electricity left out.'
