      - 'Department Q: cost of sales before the transfer = ₦1,000 + ₦1,500 − ₦500 = ₦2,000. Less goods transferred to P, ₦300: ₦1,700.'
      - 'Gross profit of Q = ₦4,000 − ₦1,700 = ₦2,300. P''s expenses do not touch Q''s gross profit.'
      - 'Check: the whole business has gross profit ₦10,000 − (₦3,000 + ₦4,000 − ₦2,000) = ₦5,000. P''s gross profit is ₦2,700 and Q''s is ₦2,300, which add up to ₦5,000.'
      - 'In a supermarket in Lagos, the drinks section passes ₦300 of bottled water to the restaurant section. The water was bought by drinks but used by the restaurant, so its cost moves too. Remember: the cost follows the goods.'
