      - 'Adding factory (works) overheads to prime cost gives the production cost; administration, selling and distribution expenses come later, in the profit and loss account.'
      - 'A furniture maker in Ikorodu spends ₦50,000 on wood (direct materials), ₦30,000 on carpenters'' wages (direct labour) and ₦5,000 on a design royalty per batch (direct expenses). Prime cost is ₦85,000.'
      - 'Remember: prime cost is all direct, nothing indirect.'
      - 'The trap is C, direct materials plus works overhead. Works overheads are indirect costs; they turn prime cost into production cost and leave out direct labour.'
    hint: 'Prime cost uses only costs that can be traced to each unit. Which option is all direct?'
    why:
      A: 'Production cost plus selling expenses goes far beyond prime cost.'
      B: 'Administration, selling and distribution expenses are overheads charged in the profit and loss account.'
      C: 'Works overheads are indirect, and direct labour is left out.'

