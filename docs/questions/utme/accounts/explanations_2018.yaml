    hint: 'Q bought the ₦300 of goods but did not sell them. Whose cost of sales should they be in?'
    why:
      A: '₦2,500 is department P''s net profit, not Q''s gross profit.'
      B: '₦2,200 does not come from Q''s figures; the gross profit is ₦4,000 − ₦1,700.'
      D: '₦1,700 is Q''s cost of sales, not its gross profit.'

  28:
    answer: A
    steps:
