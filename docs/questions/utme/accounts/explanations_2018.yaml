      - 'Department P: cost of sales = ₦2,000 + ₦2,500 + ₦300 − ₦1,500 = ₦3,300.'
      - 'Gross profit = ₦6,000 − ₦3,300 = ₦2,700. Net profit = ₦2,700 − ₦200 = ₦2,500.'
      - 'Check: P''s gross profit ₦2,700 and Q''s ₦2,300 add up to the whole shop''s ₦5,000.'
      - 'The restaurant section of the Lagos supermarket used ₦300 of water from the drinks section and spent ₦200 on gas. Both are its costs. Remember: goods received are a cost to the department that receives them.'
      - 'The trap is B, ₦2,800. It forgets the ₦300 of goods P received from Q.'
