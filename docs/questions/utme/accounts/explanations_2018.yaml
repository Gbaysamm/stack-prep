      - 'Net purchases = ₦40,000 + ₦1,000 − ₦2,000 = ₦39,000.'
      - 'Cost of goods available for sale = ₦32,000 + ₦39,000 = ₦71,000. Cost of goods sold = ₦71,000 − ₦9,000 = ₦62,000.'
