      - 'Rule: a club''s income and expenditure account shows a surplus (excess of income over expenditure) or a deficit. A surplus is added to the accumulated fund and a deficit is taken from it, as a trader''s profit is added to capital.'
      - 'Closing accumulated fund = opening accumulated fund + surplus (or − deficit).'
      - 'A social club in Enugu starts the year with an accumulated fund of ₦400,000 and has a surplus of ₦60,000. Its accumulated fund becomes ₦460,000.'
      - 'Remember: a club has no capital; it has an accumulated fund.'
      - 'The trap is B, added to the capital. The idea is right, but a not-for-profit body has no owners'' capital; the accumulated fund takes its place.'
    hint: 'What does a club call the fund that takes the place of capital?'
    why:
      A: 'A club has no capital, and a surplus is added, not deducted.'
      B: 'A club has no capital; the surplus goes to the accumulated fund.'
      D: 'A deficit is deducted from the accumulated fund; a surplus is added.'

