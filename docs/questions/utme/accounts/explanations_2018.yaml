      - 'Rule (section 24): when there is no partnership deed, profits and losses are shared equally; no partner gets a salary; no interest is paid on capital; no interest is charged on drawings; and a partner''s loan to the firm earns 5% a year.'
      - 'So if Ade and Bola run a business with no deed, Bola''s ₦200,000 drawings attract no interest, and a ₦300,000 profit is shared ₦150,000 each.'
      - 'Two lawyers in Abuja who start a firm on a handshake fall back on these rules until they sign a deed.'
      - 'Remember: no deed means equal shares, no salaries, no interest on capital or drawings, and 5% on loans.'
      - 'The trap is B. The Act says profits and losses are shared equally, the opposite of B.'
    hint: 'Without a deed, the Act keeps things simple and equal. Is interest charged on drawings?'
    why:
      A: 'The Act gives no salary to any partner.'
      B: 'The Act says profits and losses are shared equally.'
      C: 'The Act gives interest on partners'' loans at 5%, not 25%.'

