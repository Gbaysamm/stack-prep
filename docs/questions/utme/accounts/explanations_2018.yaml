      - 'Entry in the branch books: Dr Profit and loss account, Cr Head office current account. Head office records the same profit the other way: Dr Branch account, Cr its own profit and loss account.'
      - 'The Ibadan branch of a Lagos firm makes ₦250,000 profit. Ibadan credits head office ₦250,000, because that profit is owed to Lagos.'
      - 'Remember: the branch earns it, head office owns it.'
      - 'The trap is C, the adjustment account. That account is kept by head office to find the gross profit at selling price; it is not where the branch puts its profit.'
    hint: 'Who owns the branch''s profit? Which account in the branch books stands for that owner?'
    why:
