      - 'Rule: $\text{Average stock} = \dfrac{\text{Opening stock} + \text{Closing stock}}{2}$.'
      - 'Average stock = $\dfrac{32{,}000 + 9{,}000}{2} = \dfrac{41{,}000}{2} = ₦20{,}500$.'
      - 'Check: ₦20,500 lies between the closing stock of ₦9,000 and the opening stock of ₦32,000, as an average must. It then gives the rate of stock turnover: cost of goods sold ₦62,000 ÷ ₦20,500, about 3 times a year.'
      - 'A provisions shop in Onitsha had ₦32,000 of goods on 1 January and ₦9,000 on 31 December. On average it held ₦20,500 of stock.'
