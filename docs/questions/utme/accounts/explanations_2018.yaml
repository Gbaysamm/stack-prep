format_version: 1
exam_year: 2018
subject: ACC
explanations:
  1:
    answer: D
    steps:
      - 'This is the admission of a new partner when no goodwill is recorded, sometimes called the bonus method.'
      - 'Rule: with no goodwill, the new partner''s capital is his share of the total capital after he joins: $\text{New partner''s capital} = (\text{Old capital} + \text{Cash brought in}) \times \text{his share}$.'
      - 'Old capital = ₦40,000 + ₦50,000 + ₦70,000 = ₦160,000. Add Wamo''s ₦50,000: total capital = ₦210,000. Wamo''s equity = $\tfrac{1}{5} \times 210{,}000 = ₦42{,}000$.'
      - 'Check: the old partners now hold ₦210,000 − ₦42,000 = ₦168,000, which is four-fifths of ₦210,000. Wamo paid ₦8,000 more than his equity, and that ₦8,000 is a bonus credited to the old partners.'
      - 'Three lawyers in Abuja with ₦160,000 of capital let a fourth lawyer in for one-fifth. He pays ₦50,000, but his capital account shows one-fifth of the new total, ₦42,000.'
      - 'Remember: new total first, then the fraction.'
      - 'The trap is B, ₦50,000, the cash Wamo paid. It would be his capital only if goodwill of ₦40,000 were brought into the books, and here no goodwill is recorded.'
    hint: 'Add Wamo''s cash to the old capital first. What is one-fifth of that total?'
    why:
      A: '₦40,000 is one-quarter of the old capital, as if one-fifth meant one share to four; it ignores Wamo''s own cash.'
      B: '₦50,000 is the cash paid; with no goodwill recorded his equity is one-fifth of ₦210,000.'
      C: '₦32,000 is one-fifth of the old capital only; Wamo''s own ₦50,000 must be added first.'

  2:
    answer: A
    steps:
      - 'This is the dissolution of a partnership, the ending of the old partnership agreement.'
      - 'Rule: a partnership is an agreement between particular persons. Any change in who the partners are, by admission, retirement or death of a partner, ends the old agreement, and a new partnership is formed, even if the business carries on.'
      - 'So when a new partner is admitted, the old firm is dissolved and reconstituted: assets are revalued, goodwill is dealt with and a new profit-sharing ratio is agreed.'
      - 'Two accountants in Enugu take in a third partner. The old two-partner firm ends, and a new deed is signed for the three of them.'
      - 'Remember: a new face means a new firm.'
      - 'The trap is D, the retirement of a manager. A manager who is not a partner is only an employee, so his leaving does not touch the partnership agreement.'
    hint: 'Which option changes who the partners are?'
    why:
      B: 'Moving the head office changes the address, not the partners or their agreement.'
      C: 'Buying fixed assets is ordinary business; it does not end the agreement.'
      D: 'A manager who is not a partner is an employee; his retirement leaves the partners unchanged.'

  3:
    answer: C
    steps:
      - 'This is bank reconciliation worked backwards, from the bank statement to the cash book.'
      - 'Rule: a lodgement not yet credited by the bank is already in the cash book but not on the statement, so $\text{Cash book balance} = \text{Bank statement balance} + \text{Uncredited lodgement}$. An overdraft counts as a minus figure.'
      - 'Working: −₦600 + ₦1,080 = +₦480. Once the lodgement is credited, Adama has ₦480 in the bank, a favourable balance.'
      - 'In the cash book, money in the bank is an asset, so a favourable balance is a debit: ₦480 Dr. The bank sees the same ₦480 as money it owes Adama, so its statement would show it as a credit.'
      - 'A pharmacy in Jos pays in ₦1,080 on 29 March. The bank statement printed on 31 March still shows the old overdraft of ₦600, but the pharmacy''s cash book already shows ₦480 in hand at the bank.'
      - 'Remember: money in the bank is Dr in your cash book and Cr in the bank''s statement.'
      - 'The trap is A, ₦1,680 Dr. It adds the overdraft as if it were money in the account; an overdraft is money owed, so it must be taken away.'
    hint: 'Treat the overdraft as minus ₦600. What happens when the ₦1,080 is added?'
    why:
      A: 'Adds the ₦600 overdraft as if it were a positive balance.'
      B: '₦1,080 is the lodgement alone, and a favourable balance is not a credit in the cash book.'
      D: 'Leaves the overdraft unadjusted, and an overdraft would be a credit in the cash book in any case.'

  4:
    answer: D
    steps:
      - 'These are the year-end adjustments: accruals, prepayments, bad debts, provisions and depreciation.'
      - 'Rule: by the accruals (matching) concept, the profit and loss account (statement of profit or loss) must show the expenses incurred and the income earned in the year, not just the cash paid and received.'
      - 'So an expense owed at the year end is added (accrued), an expense paid in advance is taken off (prepaid), and income earned but not received is added. Each figure becomes the true amount for the year.'
      - 'A bakery in Ibadan paid ₦90,000 for electricity in the year but still owes ₦10,000 for December. Its profit and loss account shows ₦100,000, the electricity actually used.'
      - 'Remember: adjust to what was used and earned, not what was paid and received.'
      - 'The trap is C, the expenses paid and income received. That is cash accounting; the adjustments exist to move away from it.'
    hint: 'Does the profit and loss account want cash figures or the true figures for the year?'
    why:
      A: 'A prepayment is carried forward to next year; the aim is the right expense for this year, not to cover next year''s.'
      B: 'Provisions are one kind of adjustment, not the reason for making adjustments.'
      C: 'Cash paid and received is what the adjustments correct; the account wants amounts incurred and earned.'

  5:
    answer: C
    steps:
      - 'This is working capital, also called net current assets.'
      - 'Rule: $\text{Working capital} = \text{Current assets} - \text{Current liabilities}$.'
      - 'Current assets: stock ₦4,000 + debtors ₦6,000 + cash ₦8,000 = ₦18,000. Land and building are fixed assets and stay out.'
      - 'Current liabilities: creditors ₦9,000 + accrued wages ₦5,000 = ₦14,000. The long-term loan is not current, and capital is owed to the owner.'
      - 'Working capital = ₦18,000 − ₦14,000 = ₦4,000. Check: long-term funds (capital ₦39,000 + loan ₦15,000 = ₦54,000) less fixed assets (₦50,000) also give ₦4,000.'
      - 'A provisions shop in Onitsha with ₦18,000 of goods, debts due and cash, and ₦14,000 of bills to pay soon, has ₦4,000 to run the shop with. Remember: current less current.'
      - 'The trap is B, ₦8,000, the cash alone. Stock and debtors are current assets too, and the current liabilities must come off.'
    hint: 'Add only the current assets, add only the current liabilities, then subtract.'
    why:
      A: '₦11,000 does not come from current assets less current liabilities, which is ₦18,000 − ₦14,000.'
      B: '₦8,000 is the cash alone; working capital uses all current assets less all current liabilities.'
      D: '₦12,000 is too high; current assets of ₦18,000 less current liabilities of ₦14,000 leave ₦4,000.'

  6:
    answer: A
    steps:
      - 'This is the acid test ratio, also called the quick ratio or liquid ratio.'
      - 'Rule: $\text{Acid test ratio} = \dfrac{\text{Current assets} - \text{Stock}}{\text{Current liabilities}}$. Stock is left out because it takes time to sell.'
      - 'Current assets ₦18,000 less stock ₦4,000 = ₦14,000 (debtors ₦6,000 + cash ₦8,000).'
      - 'Current liabilities: creditors ₦9,000 + accrued wages ₦5,000 = ₦14,000. Ratio = $\dfrac{14{,}000}{14{,}000} = 1$, written 1:1. Check: ₦14,000 of quick assets meets ₦14,000 of short-term debts exactly.'
      - 'A pharmacy in Kaduna with ₦14,000 of cash and money due from customers can pay its ₦14,000 of short-term bills without selling a single drug.'
      - 'Remember: acid test takes the stock out; 1:1 is the textbook guide.'
      - 'The trap is D, 3:2. It sounds like a healthy figure, but it would need ₦21,000 of quick assets, and the company has only ₦14,000.'
    hint: 'Take stock out of the current assets. How does what is left compare with the current liabilities?'
    why:
      B: '2:3 would mean quick assets of only about ₦9,333; they are ₦14,000.'
      C: '1:2 would mean quick assets of only ₦7,000; they are ₦14,000.'
      D: '3:2 would need quick assets of ₦21,000; they are ₦14,000.'

  7:
    answer: C
    steps:
      - 'This is drawing up a new balance sheet (statement of financial position) after a month of trading, with a prepayment.'
      - 'Rule: closing capital = opening capital + net profit. Rent paid for the whole year belongs to January only for one month; the other eleven months are a prepayment, an asset.'
      - 'Gross profit: cost of sales = ₦15,000 − ₦10,000 = ₦5,000; sales ₦8,200 − ₦5,000 = ₦3,200. Rent for January = ₦12,000 ÷ 12 = ₦1,000. Net profit = ₦3,200 − ₦1,000 − ₦500 = ₦1,700, so capital = ₦40,000 + ₦1,700 = ₦41,700.'
      - 'Cash: ₦28,500 + ₦8,200 − ₦12,000 − ₦15,000 − ₦500 = ₦9,200.'
      - 'Assets: furnishings ₦10,000 + ceiling fan ₦1,500 + stock ₦10,000 + rent prepaid ₦11,000 + cash ₦9,200 = ₦41,700. Both sides agree, so the total is ₦41,700.'
      - 'A shop in Aba pays its landlord a full year''s rent in January. Only one month is January''s cost; the rest is rent it owns in advance. Remember: charge the months used, carry the months paid ahead.'
      - 'The trap is A, ₦40,000, the opening total. The business made ₦1,700 profit in January, so it is worth more now.'
    hint: 'Find January''s profit first. How much of the ₦12,000 rent belongs to January?'
    why:
      A: '₦40,000 is the opening total; it leaves out January''s profit of ₦1,700.'
      B: '₦41,500 is ₦200 short; the assets add up to ₦41,700.'
      D: '₦48,500 is too high; capital can only grow by January''s profit of ₦1,700.'

  8:
    answer: B
    steps:
      - 'This is the cash account, which records cash received on the debit side and cash paid on the credit side.'
      - 'Rule: closing cash = opening cash + cash received − cash paid.'
      - 'Debit side: balance b/d ₦28,500 + sales ₦8,200 = ₦36,700. Credit side: rent ₦12,000 + purchases ₦15,000 + sales boy ₦500 = ₦27,500.'
      - 'Balance c/d = ₦36,700 − ₦27,500 = ₦9,200, a debit balance. Check: ₦27,500 + ₦9,200 = ₦36,700, so the two sides agree.'
      - 'A kiosk owner in Kano starts the month with ₦28,500 in her cash box, takes in ₦8,200 and pays out ₦27,500. She ends with ₦9,200.'
      - 'Remember: cash in on the left, cash out on the right, the difference is the balance.'
      - 'The trap is C, ₦800. It takes off the closing stock of ₦10,000 as if it were a payment, but stock left is goods on the shelf, not cash spent.'
    hint: 'List what came into the cash box and what went out. Is the closing stock a cash payment?'
    why:
      A: '₦22,800 is too high; rent, purchases and wages together took ₦27,500 out of the cash box.'
      C: 'Takes the closing stock off as though it were a payment; stock is goods, not cash paid out.'
      D: '₦21,120 does not come from cash in less cash out, which leaves ₦9,200.'

  9:
    answer: C
    steps:
      - 'These are calls in advance, money a shareholder pays before the company has called for it.'
      - 'Rule: until the call is made, the money is not yet share capital. The company holds it for the shareholder and may pay interest on it, so it is shown as a liability, a current liability, until the call falls due.'
      - 'Entry: debit bank, credit calls in advance account. When the call is made, the calls in advance account is debited and the call account credited.'
      - 'A shareholder of a Lagos company pays the final call of ₦20,000 three months early. The company owes her that ₦20,000 as a liability until the call is made.'
      - 'Remember: paid before called is still owed.'
      - 'The trap is A, current asset. The cash received is an asset, but the calls in advance item itself is money the company owes the shareholder.'
    hint: 'Until the call is made, does the money belong to the company or is it held for the shareholder?'
    why:
      A: 'The cash is an asset, but calls in advance are owed to the shareholder, a liability.'
      B: 'A fixed asset is property used for years in the business, such as land or machinery.'
      D: 'A long-term liability lasts for years, like debentures; calls in advance are cleared when the call is made.'

  10:
    answer: D
    steps:
      - 'This is the purchase of a business paid for by issuing shares to the vendor, the seller.'
      - 'Rule: first the assets bought are debited and the vendor is credited with the purchase price, because the company owes him. When shares are issued to settle the debt, the vendor is debited and share capital is credited.'
      - 'Entry: Dr Vendor''s account, Cr Share capital account. The vendor''s account is cleared, and share capital rises by the value of the shares issued.'
      - 'A Lagos company buys a bakery for ₦5 million and pays the baker with 5 million ₦1 shares. It debits the baker''s (vendor''s) account ₦5 million and credits share capital ₦5 million.'
      - 'Remember: shares going out are credited to share capital; the vendor who is paid is debited.'
      - 'The trap is B. It has the right two accounts but on the wrong sides; issuing shares always credits share capital.'
    hint: 'Issuing shares increases share capital. Which side increases a capital account?'
    why:
      A: 'No cash moves when the vendor is paid in shares.'
      B: 'The sides are reversed; share capital is credited when shares are issued.'
      C: 'No cash is paid, and share capital is credited, not debited.'

  11:
    answer: B
    steps:
      - 'This is interest on drawings, a charge a partnership makes on partners who take money out during the year.'
      - 'Rule: interest runs from the date of each drawing to the year end: $\text{Interest} = \text{Amount} \times \text{Rate} \times \dfrac{\text{Months to year end}}{12}$.'
      - '1 April to 31 December is 9 months: $100 \times 5\% \times \tfrac{9}{12} = ₦3.75$.'
      - '1 July to 31 December is 6 months: $240 \times 5\% \times \tfrac{6}{12} = ₦6.00$. Total interest = ₦3.75 + ₦6.00 = ₦9.75.'
      - 'Check: a full year''s interest on all ₦340 would be ₦17, and Joy kept her money in the firm for part of the year, so the answer must be below ₦17.'
      - 'Two tailors in Owerri agree to pay 5% a year on money they take out. The earlier in the year a partner draws, the longer the money is out and the more interest he pays. Remember: count from the day taken to the year end.'
      - 'The trap is A, ₦17.00. It charges a full year on both drawings, but each sum was out for only part of the year.'
    hint: 'How many months are there from each drawing to 31 December?'
    why:
      A: 'Charges a full year on both drawings; they were out for only 9 and 6 months.'
      C: '₦11.25 is the interest on Rakiya''s drawings, not Joy''s.'
      D: 'Counts the April drawing from 1 January instead of to the year end.'

  12:
    answer: D
    steps:
      - 'This is a partner''s current account, which records her share of profit, her drawings and the interest on them.'
      - 'Rule: drawings and interest on drawings are debited to the partner''s current account; salary, interest on capital and share of profit are credited.'
      - 'Interest: 31 March to 31 December is 9 months, $200 \times 5\% \times \tfrac{9}{12} = ₦7.50$; 30 September to 31 December is 3 months, $300 \times 5\% \times \tfrac{3}{12} = ₦3.75$. Total ₦11.25.'
      - 'Debit side: drawings ₦500 + interest ₦11.25 = ₦511.25. Credit side: nothing. Closing balance = ₦511.25 debit, which means Rakiya owes the firm.'
      - 'If a partner in an Abuja law firm takes out ₦500 and earns no share of profit, her current account shows she has taken more than she is owed.'
      - 'Remember: money taken out is a debit, and a debit balance on a current account means the partner owes the firm.'
      - 'The trap is B, ₦500.00 credit. It forgets the interest and puts drawings on the wrong side; drawings are always debited.'
    hint: 'Which side do drawings and interest on drawings go? Is anything credited?'
    why:
      A: '₦340 is Joy''s drawings, and drawings make a debit, not a credit.'
      B: 'Forgets the interest of ₦11.25 and puts drawings on the credit side.'
      C: '₦340.75 does not come from Rakiya''s figures; her drawings and interest total ₦511.25.'

  13:
    answer: A
    steps:
      - 'This is the branch''s own books, where the head office account shows what the branch owes head office.'
      - 'Rule: when head office pays a branch expense, the branch has incurred the expense but paid no cash. So the branch debits the expense (charged to its profit and loss account) and credits the head office account, because it now owes head office more.'
      - 'Entry in the branch books: Dr Profit and loss (expense) account, Cr Head office account. Head office makes the opposite entry: Dr Branch account, Cr Bank.'
      - 'Head office in Lagos pays ₦40,000 rent for its Ilorin branch. Ilorin debits rent ₦40,000 and credits head office ₦40,000.'
      - 'Remember: the branch had the benefit, head office had the cash.'
      - 'The trap is B. No cash left the branch, so the branch cannot credit cash, and the head office account is credited, not debited.'
    hint: 'Did any cash leave the branch? Who does the branch now owe?'
    why:
      B: 'The branch paid no cash, and the head office account is credited, not debited.'
      C: 'No cash left the branch; head office paid it.'
      D: 'The sides are reversed; an expense is debited, not credited.'

  14:
    answer: C
    steps:
      - 'This is the Auditor-General, the chief auditor of public accounts.'
      - 'Rule: the Auditor-General audits the government''s accounts to check that public money was spent as the appropriation law allowed and in line with approved rules, then reports to the legislature (for the federation, the National Assembly''s Public Accounts Committees).'
      - 'The Accountant-General keeps the government''s accounts and pays out funds; the Minister of Finance makes financial policy and presents the budget; a Permanent Secretary heads a ministry as its accounting officer. Only the Auditor-General examines the others.'
      - 'If a ministry in Abuja spends money meant for school buildings on cars, the Auditor-General''s report brings it to light.'
      - 'Remember: the Accountant-General accounts, the Auditor-General audits.'
      - 'The trap is A, the Accountant-General. He prepares the accounts, and an officer cannot be the one to check his own work.'
    hint: 'Which officer checks the work of the others after the money is spent?'
    why:
      A: 'The Accountant-General keeps the accounts and disburses funds; he does not audit them.'
      B: 'The Minister of Finance sets policy and presents the budget.'
      D: 'A Permanent Secretary is the accounting officer of a ministry, whose spending is audited.'

  15:
    answer: D
    steps:
      - 'This is the branch trading account when goods are sent to the branch at cost.'
      - 'Rule: $\text{Cost of sales} = \text{Opening stock} + \text{Goods sent} - \text{Returns} - \text{Closing stock}$, and $\text{Gross profit} = \text{Sales} - \text{Cost of sales}$.'
      - 'Cost of sales = ₦400 + ₦8,000 − ₦340 − ₦720 = ₦7,340.'
      - 'Gross profit = ₦9,160 − ₦7,340 = ₦1,820, carried to the profit and loss account. Check: ₦7,340 + ₦1,820 = ₦9,160.'
      - 'The Ede branch of an Osogbo trader started with ₦400 of goods, received ₦8,000, sent back ₦340 and had ₦720 left. It sold goods that cost ₦7,340 for ₦9,160.'
      - 'Remember: what came in, less what went back, less what is left, is what was sold.'
      - 'The trap is A, ₦1,870, which is close. Work every line of the cost of sales; only ₦7,340 gives a gross profit of exactly ₦1,820.'
    hint: 'Find the cost of the goods the branch sold first. Do returns to head office add or subtract?'
    why:
      A: '₦1,870 is ₦50 too high; the cost of sales is ₦7,340, not ₦7,290.'
      B: '₦1,530 is too low; it would need a cost of sales of ₦7,630.'
      C: '₦1,640 is too low; it would need a cost of sales of ₦7,520.'

  16:
    answer: D
    steps:
      - 'This is the goods sent to branch account in the head office books.'
      - 'Rule: goods sent to the branch are credited to goods sent to branch account; returns from the branch are debited to it. At the year end its balance, the net goods sent, is transferred to the head office trading account, where it is credited (or shown as a deduction from purchases).'
      - 'Net goods sent = ₦8,000 − ₦340 = ₦7,660.'
      - 'Entry: Dr Goods sent to branch ₦7,660, Cr Head office trading account ₦7,660. Check: the goods sent account now has ₦8,000 on each side and closes.'
      - 'A Lagos head office sends ₦8,000 of goods to Ede and gets ₦340 back. Its own trading account must take out ₦7,660 of goods that are no longer its stock to sell.'
      - 'Remember: sent less returned is transferred.'
      - 'The trap is to bring in the branch stocks. Opening and closing branch stock belong to the branch trading account, not to goods sent to branch.'
    hint: 'Goods went out to the branch and some came back. What is the net amount?'
    why:
      A: '₦7,200 does not come from goods sent less returns.'
      B: '₦7,460 takes off ₦540 instead of the ₦340 of returns.'
      C: '₦7,500 does not come from goods sent less returns, which is ₦7,660.'

  17:
    answer: A
    steps:
      - 'This is the charging of expenses to departments in departmental accounts.'
      - 'Rule: each expense goes to the department whose activity caused it. Advertising is a selling expense, incurred to sell the product, so it is charged to the sales department (when shared among selling departments, it is apportioned by their sales).'
      - 'Production pays for making goods, purchases for buying them and administration for running the office. None of them advertises the product.'
      - 'A Kano textile firm pays for radio adverts for its new wax print. The cost goes to the sales department, whose job is to sell it.'
      - 'Remember: advertising sells, so sales pays.'
      - 'The trap is D, the administration department. Administration covers office costs such as salaries of clerks, not the cost of selling.'
    hint: 'Advertising is spent to do what with the product?'
    why:
      B: 'Production bears the cost of making goods, not of selling them.'
      C: 'The purchases department buys goods; it does not advertise them.'
      D: 'Administration covers office running costs, not selling costs.'

  18:
    answer: C
    steps:
      - 'These are overheads, the indirect costs of a business, the costs that cannot be traced to one unit of product.'
      - 'Rule: overheads fall into four broad classes: production (factory) overheads, administration overheads, selling overheads and distribution overheads.'
      - 'Direct materials, direct labour and direct expenses are not overheads; together they make the prime cost.'
      - 'A soap factory in Aba has factory rent (production), office salaries (administration), sales commission (selling) and lorry costs to deliver the soap (distribution).'
      - 'Remember: P A S D, production, administration, selling, distribution.'
      - 'The trap is A, which slips in materials. Materials are a direct cost, part of prime cost, not an overhead.'
    hint: 'Which option lists only indirect costs, four of them?'
    why:
      A: 'Materials are a direct cost, not an overhead, and administration is missing.'
      B: 'Production wages are a direct cost, and administration is missing.'
      D: 'Materials are a direct cost, and production overheads are missing.'

  19:
    answer: B
    steps:
      - 'These are the bases on which head office prices goods sent to its branches.'
      - 'Rule: there are three bases: cost price, cost plus a fixed percentage (cost plus mark-up), and selling price.'
      - 'At cost plus 25%, goods that cost head office ₦8,000 are invoiced to the branch at ₦8,000 + 25% of ₦8,000 = ₦10,000. The ₦2,000 added is a mark-up, and any of it still in branch stock at the year end is taken out as unrealised profit.'
      - 'A Lagos distributor sends drinks costing ₦8,000 to its Benin branch at ₦10,000. That is invoicing at cost plus mark-up.'
      - 'Remember: cost plus a percentage is cost plus mark-up.'
      - 'The trap is C, selling price. The branch''s selling price to customers is a separate figure; cost plus 25% need not equal it.'
    hint: 'The price is cost with a percentage added. What is that added percentage called?'
    why:
      A: 'Cost price adds nothing to cost.'
      C: 'Selling price is what the branch charges customers, which need not be cost plus 25%.'
      D: 'Market price is the going price outside the firm, not cost plus a fixed percentage.'

  20:
    answer: B
    steps:
      - 'This is the dissolution of a partnership and the final settlement with the partners.'
      - 'Rule: on dissolution the assets are sold, the creditors are paid, then partners'' loans are repaid. Profit or loss on realisation is shared in the profit-sharing ratio, and what remains is paid to each partner to clear the balance on his capital account.'
      - 'So the final cash each partner gets equals his closing capital balance, after his share of the realisation profit or loss and any current account balance have been transferred to it.'
      - 'When two lawyers in Abuja close their firm, one with a closing capital of ₦300,000 and the other ₦200,000, the cash left is paid out as ₦300,000 and ₦200,000.'
      - 'Remember: the last payment closes the capital accounts.'
      - 'The trap is A, the partnership agreement. The agreement gives the ratio for sharing the realisation profit or loss, but the cash finally paid is each partner''s capital balance.'
    hint: 'After everything else is settled, which account must the final cash clear?'
    why:
      A: 'The agreement fixes the sharing ratio, but the cash paid is the capital balance.'
      C: 'Goodwill is an asset that may be sold; it is not the basis for paying partners.'
      D: 'Articles of Association belong to companies, not partnerships.'

  21:
    answer: C
    steps:
      - 'This is the reconciliation of the head office and branch current accounts at the year end.'
      - 'Rule: an item in transit has been recorded by the side that sent it but not yet by the side that will receive it. The adjustment is made in the books of the receiver, as if the item had arrived.'
      - 'The branch sent the cash, so the branch has already debited its head office account and credited cash. Head office has not recorded it, so head office debits cash in transit and credits the branch account.'
      - 'Check: before the entry, the branch account in head office''s books is higher than the head office account in the branch''s books by the cash in transit. The credit brings it down, and the two agree.'
      - 'The Kaduna branch of a Lagos firm sends ₦50,000 on 30 December, and it reaches Lagos on 3 January. At 31 December, Lagos debits cash in transit ₦50,000 and credits the Kaduna branch account ₦50,000.'
      - 'Remember: adjust in the books that have not yet heard of it.'
