      - 'New ratio: Sule $\tfrac{2}{5}$, Ahmed $\tfrac{2}{5}$, Khadija $\tfrac{1}{5}$, or 2:2:1. Check: $\tfrac{2}{5} + \tfrac{2}{5} + \tfrac{1}{5} = 1$.'
