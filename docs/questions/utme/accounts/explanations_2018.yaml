      - 'Check the other way: ₦17,500 − ₦5,120 + ₦2,300 = ₦14,680, the adjusted cash book.'
      - 'A school in Ilorin writes cheques of ₦5,120 to suppliers who have not yet banked them, so its bank balance is still higher than its cash book. Remember: cheques not presented keep money in the bank.'
