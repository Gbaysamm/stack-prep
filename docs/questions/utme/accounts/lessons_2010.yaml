# UTME 2010 Principles of Accounts, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Nigerian Accounts teacher works on the
# board: what is given and what we must find, the account or rule named, the rule in plain
# words, the working (double entry, T account or calculation), and the answer moment that
# names the option.
#
#   say:     heard, not read. Abbreviations as letters or words, money in words, percentages
#            as "per cent", no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2010.yaml. Answers match that file. Q1, the
# paper-type question, has no lesson.
format_version: 1
exam_year: 2010
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'We must name the major function of the accounting bodies in Nigeria.'
        write: 'Major function of accounting bodies in Nigeria = ?'
      - section: 'Name it'
        say: 'The bodies are I C A N, the Institute of Chartered Accountants of Nigeria, and A N A N, the Association of National Accountants of Nigeria.'
        write: 'ICAN and ANAN'
      - section: 'The rule'
        say: 'Their main job is to regulate the profession. They set examinations, keep a register of members, and above all enforce a code of ethics.'
        write: 'Regulate the profession, enforce a code of ethics'
      - say: 'The code asks every member to act with integrity, objectivity and confidentiality.'
        write: 'Integrity, objectivity, confidentiality'
      - section: 'How it works'
        say: 'A member who breaks the code can be called before a disciplinary tribunal and struck off the register.'
        write: 'Breaks the code ⇒ tribunal ⇒ struck off'
      - section: 'Answer'
        say: 'So the major function of accounting bodies is to promote the ethics of the profession, which is option C.'
        write: '$\therefore$ promote the ethics of the profession'
        answer: true
    traps:
      A: 'You chose financial management of businesses. Each business manages its own money, and the bodies regulate the accountants, not the businesses.'
      B: 'You went for good pay for members. Pay is set by employers, and a professional body does not exist to pay its members.'
      D: 'You picked showing the dynamic nature of the profession. That is not a function, because the bodies exist to regulate the profession.'
  3:
    moments:
      - section: 'The question'
        say: 'We must name the classes into which ledger accounts are divided.'
        write: 'Ledger accounts are classified into ?'
      - section: 'The rule'
        say: 'Personal accounts are for people and firms, like debtors, creditors and capital.'
        write: 'Personal = people and firms'
      - say: 'Real accounts are for property and assets, like land, a motor van and cash.'
        write: 'Real = property and assets'
      - say: 'Nominal accounts are for incomes, expenses, gains and losses, like rent, wages and commission received.'
        write: 'Nominal = incomes and expenses'
      - section: 'Answer'
        say: 'So ledger accounts are classified into nominal, real and personal accounts, which is option A.'
        write: '$\therefore$ nominal, real and personal accounts'
        answer: true
    traps:
      B: 'You chose fixed and current. Those describe kinds of assets on the balance sheet, not the classes of ledger account.'
      C: 'You went for management, financial and public sector accounting. Those are branches of accounting, not classes of account.'
      D: 'You picked bank and cash accounts. Those are two real accounts, so they are examples, not the classification.'
  4:
    moments:
      - section: 'The question'
        say: 'The salaries account was debited when the stationery account should have been. We must name the kind of error.'
        write: 'Salaries debited instead of stationery ⇒ error of ?'
      - section: 'Name it'
        say: 'The debit is still the right amount on the right side, so the trial balance still agrees. This is one of the errors a trial balance does not show.'
        write: 'Errors not shown by a trial balance'
      - section: 'The rule'
        say: 'An error of commission is the right amount on the right side, but in the wrong account of the same class.'
        write: 'Commission = wrong account, same class'
      - say: 'An error of principle puts an item in the wrong class of account, such as an asset in an expense account.'
        write: 'Principle = wrong class of account'
      - section: 'Work it'
        say: 'Salaries and stationery are both expense accounts, so both are nominal. The class is right but the account is wrong.'
        write: 'Salaries (nominal), stationery (nominal) ⇒ same class'
      - say: 'To put it right, we debit stationery and credit salaries with the same amount.'
        write: 'Dr Stationery, Cr Salaries'
      - section: 'Answer'
        say: 'So debiting salaries instead of stationery is an error of commission, which is option A.'
        write: '$\therefore$ error of commission'
        answer: true
    traps:
      B: 'You chose omission. An error of omission leaves the transaction out of the books entirely, but here it was entered.'
      C: 'You went for principle. That needs a change of class, and salaries and stationery are both expenses.'
      D: 'You picked compensation. Compensating errors are two separate mistakes of equal amount that cancel each other out.'
  5:
    moments:
      - section: 'The question'
        say: 'Stationery that cost two hundred naira was debited to the stationery account as two thousand naira. We must find the entry that puts it right.'
        write: 'Stationery ₦200 debited as ₦2,000'
      - section: 'The rule'
        say: 'Find the difference between what was entered and what should have been entered, then post the difference on the opposite side.'
        write: 'Difference, posted on the opposite side'
      - section: 'Work it'
        say: 'The debit is too big. Two thousand naira minus two hundred naira is one thousand eight hundred naira.'
        write: '₦2,000 − ₦200 = ₦1,800 excess debit'
      - say: 'An excess debit is removed by a credit, so we credit stationery with one thousand eight hundred naira.'
        write: 'Cr Stationery ₦1,800'
      - section: 'Answer'
        say: 'So we credit stationery with one thousand eight hundred naira, which is option B.'
        write: '$\therefore$ credit stationery with ₦1,800'
        answer: true
    traps:
      A: 'You chose debit stationery with two thousand two hundred naira. That pushes the account even higher, to four thousand two hundred naira.'
      C: 'You went for debit stationery with one thousand eight hundred naira. That adds to the excess instead of removing it.'
      D: 'You picked credit stationery with two thousand two hundred naira. That removes too much and leaves a credit of two hundred naira.'
  6:
    moments:
      - section: 'The question'
        say: 'We must name the class of account that records tangible assets of a permanent nature, such as buildings, machines and vans.'
        write: 'Account for permanent tangible assets = ?'
      - section: 'Name it'
        say: 'There are three classes of ledger account, personal, real and nominal.'
        write: 'Personal, real, nominal'
      - section: 'The rule'
        say: 'Real accounts record property and assets, such as land and buildings, machinery, furniture, motor vans and cash.'
        write: 'Real = property and assets'
      - say: 'Tangible assets of a permanent nature, which we call fixed assets, are kept in real accounts.'
        write: 'Fixed assets ⇒ real accounts'
      - section: 'Work it'
        say: 'A building is not a person, so it is not personal. It is not an income or an expense, so it is not nominal. It is real.'
        write: 'Not personal, not nominal ⇒ real'
      - section: 'Answer'
        say: 'So the account for permanent tangible assets is the real account, which is option B.'
        write: '$\therefore$ real account'
        answer: true
    traps:
      A: 'You chose personal account. Personal accounts are kept for people and firms, such as debtors and creditors.'
      C: 'You went for nominal account. Nominal accounts are kept for incomes, expenses, gains and losses.'
      D: 'You picked cash account. Cash is real too, but it is a current asset that changes every day, not a permanent one.'
  7:
    moments:
      - section: 'The question'
        say: 'We must find the major feature of an invoice.'
        write: 'Major feature of an invoice = ?'
      - section: 'The rule'
        say: 'An invoice is the bill a seller sends for goods sold on credit. It gives the particulars of the goods.'
        write: 'Invoice = bill for goods sold on credit'
      - say: 'It shows the description, quantity, unit price, total, trade discount and terms of payment.'
        write: 'Description, quantity, price, total, terms'
      - section: 'How it works'
        say: 'The seller enters its copy in the sales day book, and the buyer enters it in the purchases day book.'
        write: 'Seller ⇒ sales day book.  Buyer ⇒ purchases day book.'
      - section: 'Answer'
        say: 'So the major feature of an invoice is that it specifies the particulars of goods bought, which is option C.'
        write: '$\therefore$ specifies the particulars of goods bought'
        answer: true
    traps:
      A: 'You chose passing through the sales day book. That is what is done with an invoice, not what the invoice is.'
      B: 'You went for cash and bank columns. Those belong to the cash book.'
      D: 'You picked cash sales only. An invoice is used for credit sales, and cash sales get a receipt.'
  8:
    moments:
      - section: 'The question'
        say: 'We must pick the source document from the four options.'
        write: 'Source documents include ?'
      - section: 'The rule'
        say: 'A source document is the original paper that proves a transaction happened. The books of original entry are written up from it.'
        write: 'Source document = proof of a transaction'
      - say: 'Examples are invoices, credit notes, debit notes, receipts, cheque counterfoils and petty cash vouchers.'
        write: 'Invoice, credit note, debit note, receipt, voucher'
      - section: 'Sort the options'
        say: 'The cash book is a book of original entry. It is written up from receipts and cheque counterfoils, so it is not a source document.'
        write: 'Cash book ⇒ book of original entry'
      - say: 'The petty cash book is also a book of original entry. Its vouchers are source documents, but the book itself is not.'
        write: 'Petty cash book ⇒ book of original entry'
      - say: 'The general ledger is where entries are posted from those books, so it is not a document either.'
        write: 'General ledger ⇒ where entries are posted'
      - say: 'A credit note is the paper a seller sends when goods are returned. It proves the return happened, so it is a source document.'
        write: 'Credit note ⇒ source document'
      - section: 'Answer'
        say: 'So source documents include credit notes, which is option D.'
        write: '$\therefore$ credit notes'
        answer: true
    traps:
      A: 'You chose cash book. The cash book is a book of original entry, written up from receipts and counterfoils.'
      B: 'You went for petty cash book. Its vouchers are source documents, but the book itself is a book of original entry.'
      C: 'You picked general ledger. That is where entries are posted from the books of original entry.'
  9:
    moments:
      - section: 'The question'
        say: 'Fatima owed two thousand naira. She settled in cash and was allowed a cash discount of two per cent. We must find the discount allowed.'
        write: 'Fatima owes ₦2,000, cash discount 2%'
      - section: 'Name it'
        say: 'This is cash discount. When we give it to a customer, we call it discount allowed.'
        write: 'Discount allowed'
      - section: 'The rule'
        say: 'Discount equals the rate times the amount owed. It goes in the discount column on the debit side of the cash book.'
        write: '$\text{Discount} = \text{Rate} \times \text{Amount owed}$'
      - section: 'Work it'
        say: 'Two per cent means two in every hundred, so we write two over one hundred. Two over one hundred times two thousand naira is forty naira.'
        write: '$\dfrac{2}{100} \times 2{,}000 = 40$'
      - section: 'Answer'
        say: 'So the discount allowed is forty naira, which is option B.'
        write: '$\therefore$ Discount allowed $=$ ₦40'
        answer: true
    traps:
      A: 'You chose twenty naira. That is one per cent of two thousand, but the rate is two per cent.'
      C: 'You went for sixty naira. That is three per cent of two thousand.'
      D: 'You picked four naira. That is two per cent of two hundred, not of two thousand.'
  10:
    moments:
      - section: 'The question'
        say: 'From the three column cash book, we must find the cash balance carried down on the eighth. Fatima settled her two thousand naira debt in cash, less a two per cent discount.'
        write: 'Cash balance c/d on the 8th = ?'
      - section: 'The rule'
        say: 'The cash balance is total cash received minus total cash paid. The discount column is only a memorandum and is never added to cash.'
        write: '$\text{Balance} = \text{Cash debits} - \text{Cash credits}$'
      - section: 'Fatima''s cash'
        say: 'First we need Fatima''s cash. Two per cent of two thousand naira is forty naira, so she paid two thousand naira minus forty naira, which is one thousand nine hundred and sixty naira.'
        write: 'Fatima: ₦2,000 − ₦40 = ₦1,960'
      - say: 'The forty naira goes in the discount column, and only the one thousand nine hundred and sixty naira goes in the cash column.'
        write: 'Cash column ₦1,960, discount column ₦40'
      - section: 'Debit side'
        say: 'Now we add the cash debit side. It holds the opening balance of three thousand, cash sales of one thousand, Fatima''s one thousand nine hundred and sixty and Baffa''s two hundred. Together that is six thousand one hundred and sixty naira.'
        write: '3,000 + 1,000 + 1,960 + 200 = ₦6,160'
      - section: 'Credit side'
        say: 'Next the cash credit side. Cash paid is electricity two hundred plus purchases three thousand plus Khadija two hundred, which is three thousand four hundred naira. Ahmad was paid from the bank, so he is left out.'
        write: '200 + 3,000 + 200 = ₦3,400'
      - section: 'Balance'
        say: 'The balance carried down is the money left, so we take what was paid from what was received. Six thousand one hundred and sixty naira minus three thousand four hundred naira is two thousand seven hundred and sixty naira.'
        write: '₦6,160 − ₦3,400 = ₦2,760'
      - section: 'Answer'
        say: 'So the cash balance carried down is two thousand seven hundred and sixty naira, which is option A.'
        write: '$\therefore$ Cash balance c/d $=$ ₦2,760'
        answer: true
    traps:
      B: 'You chose four thousand three hundred naira. That is the total of the bank debit column, not the cash balance.'
      C: 'You went for six thousand two hundred naira. That is the cash debit side with Fatima''s full two thousand, before any payments are taken away.'
      D: 'You picked two thousand four hundred naira. That treats Baffa''s receipt as a payment and forgets the discount.'
  11:
    moments:
      - section: 'The question'
        say: 'We must find the item that makes the bank statement balance higher than the cash book balance.'
        write: 'Bank statement balance higher than cash book ⇐ ?'
      - section: 'The rule'
        say: 'If the bank adds money to the account before the trader knows, the bank statement is higher than the cash book.'
        write: 'Bank adds first ⇒ statement higher'
      - say: 'If the bank takes money out first, the statement is lower.'
        write: 'Bank takes first ⇒ statement lower'
      - section: 'Sort the options'
        say: 'Commission paid is taken out of the account by the bank, so it makes the statement lower.'
        write: 'Commission paid ⇒ out'
      - say: 'A standing order payment is paid out by the bank, so it also makes the statement lower.'
        write: 'Standing order ⇒ out'
      - say: 'A direct withdrawal takes money out, so it makes the statement lower too.'
        write: 'Direct withdrawal ⇒ out'
      - say: 'Interest received is added by the bank before the trader records it, so only it makes the statement higher.'
        write: 'Interest received ⇒ in'
      - section: 'Answer'
        say: 'So the item that overstates the bank statement balance is interest received, which is option B.'
        write: '$\therefore$ interest received'
        answer: true
    traps:
      A: 'You chose commission paid. The bank takes commission out, so it makes the statement lower, not higher.'
      C: 'You went for a standing order payment. The bank pays it out, so it lowers the statement balance.'
      D: 'You picked direct withdrawal. Money taken out lowers the bank balance.'
  12:
    moments:
      - section: 'The question'
        say: 'Banks charged current account holders a commission. We must find what it was charged on.'
        write: 'Bank charge on a current account = commission on ?'
      - section: 'Name it'
        say: 'This is C O T, commission on turnover.'
        write: 'COT = commission on turnover'
      - section: 'The rule'
        say: 'The bank charged a small rate on the total of the withdrawals and payments passing through the account. That total is the turnover.'
        write: 'Charge = rate × debit turnover'
      - section: 'Example'
        say: 'For example, in two thousand and ten a bank might charge five naira for every one thousand naira a trader withdrew.'
        write: '₦5 per ₦1,000 withdrawn'
      - section: 'Answer'
        say: 'So the charge is commission on turnover, which is option B.'
        write: '$\therefore$ turnover'
        answer: true
    traps:
      A: 'You chose transactions. Charges are linked to transactions, but the named charge was on turnover.'
      C: 'You went for transfers. A transfer fee is a separate charge, not the current account charge asked about.'
      D: 'You picked cash received. Banks did not charge on cash paid in. The commission was on turnover.'
  13:
    moments:
      - section: 'The question'
        say: 'We must find the item that makes the cash book balance higher than the bank statement balance.'
        write: 'Cash book balance higher than bank statement ⇐ ?'
      - section: 'The rule'
        say: 'If the trader records money coming in before the bank credits it, the cash book is higher than the bank statement.'
        write: 'Trader records money in first ⇒ cash book higher'
      - section: 'Work it'
        say: 'Uncredited cheques are cheques the trader paid in and debited in the cash book, but the bank has not yet cleared them.'
        write: 'Uncredited cheques = lodged, not yet credited by bank'
      - say: 'So the cash book counts the money and the bank does not, yet.'
        write: 'Cash book counts it, bank does not'
      - section: 'Answer'
        say: 'So the item that overstates the cash book is uncredited cheques, which is option C.'
        write: '$\therefore$ uncredited cheques'
        answer: true
    traps:
      A: 'You chose dividend received. The bank credits it first, so it makes the bank statement higher, not the cash book.'
      B: 'You went for unpresented cheques. They are already out of the cash book but not out of the bank, so the cash book is lower.'
      D: 'You picked interest on lodgement. The bank adds it first, so the bank statement is higher.'
  14:
    moments:
      - section: 'The question'
        say: 'We are given the year''s sales, stocks, purchases, returns and carriage. We must find the gross profit.'
        write: 'Gross profit = ?'
      - section: 'Name it'
        say: 'Gross profit is found in the trading account, which today is the first part of the statement of profit or loss.'
        write: 'Trading account (statement of profit or loss)'
      - section: 'The rule'
        say: 'Gross profit is net sales minus cost of sales.'
        write: '$\text{Gross profit} = \text{Net sales} - \text{Cost of sales}$'
      - say: 'Carriage outwards is left out. It is a selling expense, so it goes to the profit and loss account, not the trading account.'
        write: 'Carriage outwards ⇒ profit and loss, not trading'
      - section: 'Net sales'
        say: 'First, net sales. Returns inwards are goods customers sent back, so they come off sales. Ten thousand nine hundred minus six hundred is ten thousand three hundred naira.'
        write: '10,900 − 600 = ₦10,300'
      - section: 'Net purchases'
        say: 'Next, purchases. Returns outwards are goods we sent back to suppliers, so they come off purchases. Four thousand minus eight hundred is three thousand two hundred naira.'
        write: '4,000 − 800 = ₦3,200'
      - say: 'Carriage inwards is the cost of bringing the goods in, so it is added to purchases. Three thousand two hundred plus two hundred is three thousand four hundred naira.'
        write: '3,200 + 200 = ₦3,400'
      - section: 'Cost of sales'
        say: 'Cost of sales is opening stock plus net purchases minus closing stock, because the closing stock was not sold. One thousand plus three thousand four hundred minus two thousand is two thousand four hundred naira.'
        write: '1,000 + 3,400 − 2,000 = ₦2,400'
      - section: 'Gross profit'
        say: 'Now gross profit is net sales minus cost of sales. Ten thousand three hundred minus two thousand four hundred is seven thousand nine hundred naira.'
        write: '10,300 − 2,400 = ₦7,900'
      - section: 'Answer'
        say: 'So the gross profit is seven thousand nine hundred naira, which is option B.'
        write: '$\therefore$ Gross profit $=$ ₦7,900'
        answer: true
    traps:
      A: 'You chose seven thousand eight hundred naira. That puts carriage outwards in the trading account in place of carriage inwards.'
      C: 'You went for nine thousand seven hundred naira. That swaps the first two digits of seven thousand nine hundred, which is net sales of ten thousand three hundred less cost of sales of two thousand four hundred.'
      D: 'You picked five thousand seven hundred naira. Cost of sales is only two thousand four hundred naira, and ten thousand three hundred less two thousand four hundred is seven thousand nine hundred.'
  15:
    moments:
      - section: 'The question'
        say: 'From the trading figures, we must find the cost of goods available for sale, the goods the trader had to sell before closing stock is taken away.'
        write: 'Cost of goods available for sale = ?'
      - section: 'The rule'
        say: 'It is opening stock plus purchases minus returns outwards plus carriage inwards. Closing stock is not taken away yet.'
        write: '$\text{Opening stock} + \text{Purchases} - \text{Returns out} + \text{Carriage in}$'
      - section: 'Net purchases'
        say: 'First, purchases less returns outwards, the goods sent back to suppliers. Four thousand minus eight hundred is three thousand two hundred naira.'
        write: '4,000 − 800 = ₦3,200'
      - section: 'Add it up'
        say: 'Now we add opening stock of one thousand, net purchases of three thousand two hundred and carriage inwards of two hundred. That is four thousand four hundred naira.'
        write: '1,000 + 3,200 + 200 = ₦4,400'
      - section: 'Answer'
        say: 'So the cost of goods available for sale is four thousand four hundred naira, which is option D.'
        write: '$\therefore$ ₦4,400'
        answer: true
    traps:
      A: 'You chose four thousand six hundred naira. That takes returns inwards off purchases instead of returns outwards.'
      B: 'You went for five thousand naira. That is just opening stock plus purchases, with no returns or carriage.'
      C: 'You picked six thousand four hundred naira. That adds the closing stock instead of leaving it out.'
  16:
    moments:
      - section: 'The question'
        say: 'Debtors are twenty thousand naira, the provision for bad debts at the start of the year is five hundred naira, and the provision is to be kept at four per cent of debtors. We must find the charge to profit and loss.'
        write: 'Debtors ₦20,000, old provision ₦500, new rate 4%'
      - section: 'Name it'
        say: 'This is the provision for bad debts, an amount set aside from profit for debts that may never be paid.'
        write: 'Provision for bad debts'
      - section: 'The rule'
        say: 'The old provision of five hundred naira was charged in an earlier year and is still there. So only the change in the provision goes to the profit and loss account, and an increase is debited as an expense.'
        write: 'P and L charge = new provision − old provision'
      - section: 'New provision'
        say: 'Four per cent of twenty thousand naira is eight hundred naira.'
        write: '$\dfrac{4}{100} \times 20{,}000 = 800$'
      - section: 'The increase'
        say: 'Eight hundred naira minus the old five hundred naira is three hundred naira.'
        write: '₦800 − ₦500 = ₦300'
      - section: 'Answer'
        say: 'So the charge to profit and loss is three hundred naira, which is option D.'
        write: '$\therefore$ ₦300'
        answer: true
    traps:
      A: 'You chose five hundred naira. That is the old provision, already charged in an earlier year.'
      B: 'You went for eight hundred and twenty naira. The new provision is four per cent of twenty thousand, which is eight hundred naira, and only its rise over the old five hundred naira is charged, which is three hundred.'
      C: 'You picked one thousand three hundred naira. That adds the old provision to the new one instead of taking the difference.'
  17:
    moments:
      - section: 'The question'
        say: 'Debtors are twenty thousand naira, and the provision for bad debts is to be kept at four per cent of debtors. We must find the provision shown in the balance sheet.'
        write: 'Provision in the balance sheet = ?'
      - section: 'Name it'
        say: 'The balance sheet is called the statement of financial position today. It shows the full provision against debtors.'
        write: 'Balance sheet (statement of financial position)'
      - section: 'The rule'
        say: 'The balance sheet shows the whole provision at the year end, the required percentage of debtors.'
        write: 'Balance sheet provision = rate × debtors'
      - section: 'Work it'
        say: 'Four per cent of twenty thousand naira is eight hundred naira.'
        write: '$\dfrac{4}{100} \times 20{,}000 = ₦800$'
      - section: 'How it shows'
        say: 'Debtors of twenty thousand naira, less the provision of eight hundred, leaves nineteen thousand two hundred naira.'
        write: 'Debtors 20,000 − 800 = ₦19,200'
      - section: 'Compare'
        say: 'Profit and loss is charged only the rise in the provision, eight hundred less the old five hundred, but the balance sheet shows the whole provision.'
        write: 'P and L = change.  Balance sheet = whole.'
      - section: 'Answer'
        say: 'So the provision in the balance sheet is eight hundred naira, which is option B.'
        write: '$\therefore$ ₦800'
        answer: true
    traps:
      A: 'You chose three hundred naira. That is the increase charged to profit and loss, not the full provision.'
      C: 'You went for one thousand three hundred naira. That adds the old five hundred to the new eight hundred.'
      D: 'You picked nineteen thousand two hundred naira. That is the debtors after the provision, not the provision itself.'
  18:
    moments:
      - section: 'The question'
        say: 'We must name benefits that have been enjoyed but not yet paid for.'
        write: 'Benefits enjoyed, not yet paid for = ?'
      - section: 'The rule'
        say: 'An accrual, also called an accrued expense, is an expense for a service already used in the period but not yet paid for.'
        write: 'Accrual = used now, paid later'
      - say: 'By the accruals concept, it is still charged to the period that enjoyed the benefit.'
        write: 'Accruals concept ⇒ charge it to this period'
      - section: 'In the books'
        say: 'The amount owing is added to the expense in profit and loss, and shown as a current liability in the balance sheet.'
        write: 'Add to expense, show as current liability'
      - section: 'Compare'
        say: 'A prepayment is the opposite. It is paid now for a benefit used later.'
        write: 'Prepaid = paid now, used later'
      - section: 'Answer'
        say: 'So benefits enjoyed but not yet paid for are accruals, which is option A.'
        write: '$\therefore$ accruals'
        answer: true
    traps:
      B: 'You chose prepayments. They are the opposite, paid for but not yet enjoyed.'
      C: 'You went for acquisitions. Those are things bought, such as assets, not unpaid benefits.'
      D: 'You picked provisions. A provision is an amount set aside for a likely loss, such as bad debts.'
  19:
    moments:
      - section: 'The question'
