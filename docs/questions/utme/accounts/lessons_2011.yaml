        write: '160 = 100 at ₦90 + 60 at ₦95'
      - section: 'What is left'
        say: 'Two hundred minus sixty leaves one hundred and forty units, all at ninety five naira.'
        write: '200 − 60 = 140 at ₦95'
      - section: 'Value'
