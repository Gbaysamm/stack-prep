        say: 'Cost of goods sold is opening stock plus net purchases minus closing stock. Net purchases are purchases plus carriage inwards less returns outwards.'
        write: '$\text{COGS} = \text{Opening stock} + \text{Net purchases} - \text{Closing stock}$'
