        write: 'Goods sent to branch: debit ... ? credit ... ?'
      - section: 'The rule'
        say: 'The branch stock account receives the goods, so it is debited. The goods sent to branch account gives them, so it is credited.'
        write: 'Dr receiver, Cr giver'
      - section: 'Work it'
        say: 'Say goods worth six hundred thousand naira go to the branch. We debit branch stock and credit goods sent to branch, six hundred thousand naira each.'
        write: 'Dr Branch stock ₦600,000.  Cr Goods sent to branch ₦600,000'
      - section: 'Answer'
        say: 'So we debit branch stock account and credit goods sent to branch account, which is option A.'
        write: '$\therefore$ Dr branch stock, Cr goods sent to branch'
        answer: true
    traps:
      B: 'You chose debit branch supplies and credit branch stock. There is no branch supplies account here, and branch stock is debited, not credited.'
      C: 'You went for credit purchases. The credit goes to goods sent to branch, not to purchases.'
      D: 'You picked the reverse entry. Branch stock receives the goods, so it is debited.'
  37:
    moments:
      - section: 'The question'
        say: 'We must name the two accounts head office opens when goods are sent to a branch.'
        write: 'Two accounts opened in head office = ?'
      - section: 'The rule'
        say: 'Head office opens a branch stock account, for the goods the branch holds, and a goods sent to branch account, to take them out of its own purchases.'
        write: 'Branch stock + goods sent to branch'
      - section: 'The entry'
        say: 'Branch stock is debited and goods sent to branch is credited, so the two always appear together.'
        write: 'Dr Branch stock.  Cr Goods sent to branch'
      - section: 'Answer'
        say: 'So the two accounts are branch stock account and goods sent to branch account, which is option B.'
        write: '$\therefore$ branch stock and goods sent to branch'
        answer: true
    traps:
      A: 'You chose branch supplies and branch receipts. Those are not the accounts opened for goods sent.'
      C: 'You went for goods sent to branch and branch receipts. The first is right, but the second should be branch stock.'
      D: 'You picked goods sent to branch and branch supplies. The first is right, but the second should be branch stock.'
  38:
    moments:
      - section: 'The question'
        say: 'We must name the three bases on which goods may be invoiced to a branch.'
        write: 'Three bases for invoicing goods to a branch = ?'
      - section: 'The rule'
        say: 'Goods may be invoiced at cost price, at selling price, or at cost plus a fixed percentage of cost.'
        write: 'Cost, selling price, cost plus a percentage'
      - section: 'Work it'
        say: 'For example, take goods costing one hundred thousand naira. At cost price they are invoiced at one hundred thousand naira.'
        write: 'Cost price: ₦100,000'
      - say: 'At selling price they may go at one hundred and fifty thousand naira.'
        write: 'Selling price: ₦150,000'
      - say: 'At cost plus twenty per cent, we add twenty thousand naira to the cost, which gives one hundred and twenty thousand naira.'
        write: 'Cost plus 20%: ₦100,000 + ₦20,000 = ₦120,000'
      - section: 'Answer'
        say: 'So the three bases are cost price, selling price and a fixed percentage on cost price, which is option B.'
        write: '$\therefore$ cost, selling price, fixed percentage on cost'
        answer: true
    traps:
      A: 'You chose a percentage on selling price. The third basis adds a percentage to cost, not to selling price.'
      C: 'You went for cost and cost plus. Both are right, but selling price is missing, so that is only two bases.'
      D: 'You picked cost and a percentage on selling price. Selling price is missing, and the percentage goes on cost.'
  39:
    moments:
      - section: 'The question'
        say: 'We must name the major point a partnership deed settles.'
        write: 'The major point of a partnership deed = ?'
      - section: 'The rule'
        say: 'The partnership deed is the written agreement that sets out how the partnership is run. Its chief term is the ratio in which profits and losses are shared.'
        write: 'Chief term = profit and loss sharing ratio'
      - section: 'Other terms'
        say: 'It also covers capital, interest on capital and drawings, and salaries.'
        write: 'Also: capital, interest, drawings, salaries'
      - say: 'Where there is no deed, the Partnership Act applies, with equal shares and five per cent on partners'' loans.'
        write: 'No deed ⟹ Partnership Act: equal shares, 5% on loans'
      - section: 'Answer'
        say: 'So the major point of the deed is the profit and loss sharing ratio of the partners, which is option D.'
        write: '$\therefore$ the profit and loss sharing ratio'
        answer: true
    traps:
      A: 'You chose five per cent interest on loans. That is the Partnership Act rule when there is no deed, not the main term a deed settles.'
      B: 'You went for an oral agreement. A deed is written, not spoken.'
      C: 'You picked inheritance by the partners'' children. That is not a normal term of a partnership deed.'
  40:
    moments:
      - section: 'The question'
        say: 'We are given the capitals of Keme and Kemi and an interest rate on capital of five per cent for a full year. We must find the interest on Kemi''s capital.'
        write: 'Kemi''s capital ₦10,000, interest on capital 5%. Interest = ?'
      - section: 'The rule'
        say: 'Interest on capital rewards a partner for the money put in. It is the capital times the rate, here for a full year.'
        write: '$\text{Interest on capital} = \text{Capital} \times \text{Rate}$'
      - section: 'Pick the figures'
        say: 'Kemi''s capital is ten thousand naira and the rate is five per cent.'
        write: 'Kemi ₦10,000 at 5%'
      - section: 'Work it'
        say: 'Five per cent of ten thousand naira is five hundred naira.'
        write: '$0.05 \times 10{,}000 = 500$'
      - section: 'Answer'
        say: 'So the interest on Kemi''s capital is five hundred naira, which is option C.'
        write: '$\therefore$ ₦500'
        answer: true
    traps:
      A: 'You chose one thousand naira. That is Keme''s interest, on twenty thousand naira. Kemi''s capital is ten thousand naira.'
      B: 'You went for two thousand naira. That uses the ten per cent drawings rate on Keme''s capital.'
      D: 'You picked three thousand naira. That uses ten per cent on the total capital of thirty thousand naira.'
  41:
    moments:
      - section: 'The question'
        say: 'We are given the partners'' drawings and an interest rate on drawings of ten per cent for a full year. We must find the interest on Keme''s drawings.'
        write: 'Keme''s drawings ₦2,000, interest on drawings 10%. Interest = ?'
      - section: 'The rule'
        say: 'Interest on drawings is the drawings times the rate, here for a full year.'
        write: '$\text{Interest on drawings} = \text{Drawings} \times \text{Rate}$'
      - say: 'It is charged to the partner, because he took money out of the business during the year, and it is added to the profit to be shared.'
        write: 'Charged to the partner, added to profit'
      - section: 'Pick the figures'
        say: 'Keme''s drawings are two thousand naira and the rate is ten per cent.'
        write: 'Keme ₦2,000 at 10%'
      - section: 'Work it'
        say: 'Ten per cent of two thousand naira is two hundred naira.'
        write: '$0.10 \times 2{,}000 = 200$'
      - section: 'Answer'
        say: 'So the interest on Keme''s drawings is two hundred naira, which is option A.'
        write: '$\therefore$ ₦200'
        answer: true
    traps:
      B: 'You chose one hundred and fifty naira. That uses the five per cent capital rate on Kemi''s drawings.'
      C: 'You went for three hundred naira. That is Kemi''s interest on drawings, not Keme''s.'
      D: 'You picked one hundred naira. That uses the five per cent capital rate on Keme''s drawings.'
  42:
    moments:
      - section: 'The question'
        say: 'A new partner is joining a firm. We must name the account that can be used on the admission.'
        write: 'Account used on admission of a new partner = ?'
      - section: 'The rule'
        say: 'The assets were valued years ago. So when a partner joins, the assets and liabilities are revalued in a revaluation account, and the gain or loss belongs to the old partners.'
        write: 'Revaluation account ⟹ gain or loss to old partners'
      - section: 'Work it'
        say: 'Say premises rise in value by two hundred thousand naira. We debit premises and credit revaluation with two hundred thousand naira.'
        write: 'Dr Premises ₦200,000.  Cr Revaluation ₦200,000'
      - say: 'The profit on revaluation is then shared among the old partners'' capital accounts in their old ratio.'
        write: 'Revaluation profit ⟶ old partners'' capital'
      - section: 'Answer'
        say: 'So the revaluation account is used on admission of a new partner, which is option A.'
        write: '$\therefore$ revaluation account'
        answer: true
    traps:
      B: 'You chose the profit and loss account. It finds the year''s trading profit, not the change in asset values.'
      C: 'You went for the capital account. It receives the revaluation result, but the revaluing is done in the revaluation account.'
      D: 'You picked the trading account. It finds gross profit, not changes on admission.'
  43:
    moments:
      - section: 'The question'
        say: 'We must say what goodwill mainly arises from.'
        write: 'Goodwill arises mainly from ... ?'
      - section: 'The rule'
        say: 'Goodwill is the value of a business above its net assets. It comes from its good name, location, skilled staff and loyal customers.'
        write: 'Goodwill = value above net assets'
      - section: 'Work it'
        say: 'Say a business sells for five million naira, and its net assets are four million, two hundred thousand naira. The buyer pays eight hundred thousand naira for goodwill, because of the customers the business has built up.'
        write: '₦5,000,000 − ₦4,200,000 = ₦800,000'
      - section: 'Answer'
        say: 'So goodwill arises mainly from the business and its customer relations, which is option C.'
        write: '$\therefore$ the business and its customer relations'
        answer: true
    traps:
      A: 'You chose the capital of the old partners. Capital is a book figure. Goodwill is the extra value the books do not show.'
      B: 'You went for the number of partners admitted. Admitting partners does not create goodwill.'
      D: 'You picked the number of active partners. How many partners work does not create goodwill.'
  44:
    moments:
      - section: 'The question'
        say: 'We must name the founders of a company.'
        write: 'The founders of a company are ... ?'
      - section: 'The rule'
        say: 'The founders are called promoters. They prepare the memorandum and articles of association, register the company, and find its first directors and shareholders.'
        write: 'Promoters = form and register the company'
      - section: 'Answer'
        say: 'So the founders of a company are the promoters, which is option A.'
        write: '$\therefore$ promoters'
        answer: true
    traps:
      B: 'You chose shareholders. They own the company once it exists. Promoters bring it into being.'
      C: 'You went for canvassers. Canvassers look for customers or votes. They do not form companies.'
      D: 'You picked stakeholders. Stakeholders are all who have an interest in the company, like staff and customers.'
  45:
    moments:
      - section: 'The question'
        say: 'We must name the fund into which all government revenues are paid.'
        write: 'The fund into which all government revenues are paid = ?'
      - section: 'The rule'
        say: 'Under section eighty of the nineteen ninety nine Constitution, all revenues of the Federation are paid into one fund, the Consolidated Revenue Fund, unless a law says otherwise. Consolidated means gathered into one.'
        write: 'All revenue ⟶ CRF (1999 Constitution, s. 80)'
      - section: 'The other funds'
        say: 'The other funds are special funds. The development fund pays for capital projects, such as roads and buildings.'
        write: 'Development fund = capital projects'
      - say: 'A trust fund holds money for one stated purpose.'
        write: 'Trust fund = one purpose'
      - say: 'The contingency fund meets urgent needs that were not expected.'
        write: 'Contingency fund = urgent needs'
      - section: 'Answer'
        say: 'So all government revenue is paid into the Consolidated Revenue Fund, which is option A.'
        write: '$\therefore$ Consolidated Revenue Fund'
        answer: true
    traps:
      B: 'You chose the development fund. It pays for capital projects. It does not receive all revenue.'
      C: 'You went for a trust fund. A trust fund holds money for one stated purpose.'
      D: 'You picked the contingency fund. It meets urgent, unexpected spending.'
  46:
    moments:
      - section: 'The question'
        say: 'We must pick the source that brings Nigeria its highest revenue.'
        write: 'Highest source of revenue to Nigeria = ?'
      - section: 'The rule'
        say: 'When this question was set, petroleum revenue, from crude oil sales, petroleum profits tax and royalties, was by far the largest source.'
        write: 'Petroleum = crude sales + PPT + royalties'
      - section: 'The others'
        say: 'Import duties, personal income tax and company tax are all much smaller. In recent years non oil taxes have grown, but oil has long been the biggest single source.'
        write: 'Import duty, PIT, CIT < petroleum'
      - section: 'Answer'
        say: 'So the highest revenue comes from petroleum resources, which is option C.'
        write: '$\therefore$ petroleum resources'
        answer: true
    traps:
      A: 'You chose import duties. They are a real source, but smaller than petroleum.'
      B: 'You went for personal income tax. It goes mainly to the states and is far smaller than petroleum revenue.'
      D: 'You picked company tax. It is a large non oil source, but smaller than petroleum.'
  47:
    moments:
      - section: 'The question'
        say: 'We are given one hundred and twenty thousand shares with a nominal value of two naira each, issued at five naira fifty kobo each. We must find the share premium.'
        write: '120,000 shares, nominal ₦2.00, issued at ₦5.50. Share premium = ?'
      - section: 'The rule'
        say: 'Share premium is the amount received above the nominal value, the face value printed on the share. It is the premium per share times the number of shares.'
        write: '$\text{Share premium} = (\text{Issue price} - \text{Nominal value}) \times \text{Shares}$'
      - section: 'Premium per share'
        say: 'Five naira fifty kobo minus two naira is three naira fifty kobo per share.'
        write: '₦5.50 − ₦2.00 = ₦3.50'
      - section: 'Total premium'
        say: 'Three naira fifty kobo times one hundred and twenty thousand shares is four hundred and twenty thousand naira.'
        write: '$3.50 \times 120{,}000 = 420{,}000$'
      - section: 'Answer'
        say: 'So the share premium is four hundred and twenty thousand naira, which is option D.'
        write: '$\therefore$ ₦420,000'
        answer: true
    traps:
      A: 'You chose five hundred thousand naira. No correct working gives that. The premium is three naira fifty kobo a share, times one hundred and twenty thousand shares, which is four hundred and twenty thousand naira.'
      B: 'You went for four hundred and fifty thousand naira. That is thirty thousand naira too much. The premium is three naira fifty kobo a share, times one hundred and twenty thousand shares.'
      C: 'You picked five hundred and fifty thousand naira. That is too large. Only the three naira fifty kobo above the nominal value of each share is premium.'
  48:
    moments:
      - section: 'The question'
        say: 'We must name the officer who is a signatory to the federal government account.'
        write: 'Signatory to the federal government account = ?'
      - section: 'The rule'
        say: 'The Accountant General of the Federation operates the government''s bank accounts, signs for them, and prepares the annual accounts.'
        write: 'Accountant-General operates, signs, prepares the accounts'
      - section: 'The others'
        say: 'The Auditor General audits those accounts afterwards, so he must not sign them.'
        write: 'Auditor-General checks'
      - say: 'The Central Bank of Nigeria is the government''s banker. It keeps the money, but its Governor does not sign for the government.'
        write: 'CBN banks'
      - say: 'The President heads the government, but he does not sign on its accounts.'
        write: 'President does not sign'
      - section: 'Answer'
        say: 'So the signatory is the Accountant General, which is option C.'
        write: '$\therefore$ Accountant-General'
        answer: true
    traps:
      A: 'You chose the Auditor General. He audits the accounts and must stay independent of them.'
      B: 'You went for the Governor of the Central Bank. The bank keeps the money, but its Governor does not sign for the government.'
      D: 'You picked the President. The President does not sign the government''s accounts.'
  49:
    moments:
      - section: 'The question'
        say: 'We must name the accounting officer of a local government.'
        write: 'The accounting officer of a local government = ?'
      - section: 'The rule'
        say: 'An accounting officer is the person who must answer for the money of a body. Under the Financial Memoranda, the Chairman is the chief executive and accounting officer of a local government.'
        write: 'Chairman = chief executive + accounting officer'
      - section: 'The Treasurer'
        say: 'The Treasurer heads the treasury, keeps the books and advises on finance, but he answers to the Chairman.'
        write: 'Treasurer keeps the books, answers to the Chairman'
      - section: 'Answer'
        say: 'So the accounting officer of a local government is the Chairman, which is option A.'
        write: '$\therefore$ Chairman'
        answer: true
    traps:
      B: 'You chose the Treasurer. He keeps the accounts and advises, but the one who must answer for the money is the Chairman.'
      C: 'You went for the Director of Personnel. That officer handles staff, not the accounts.'
      D: 'You picked the Auditor. The Auditor checks the accounts and must stay independent of them.'
  50:
    moments:
      - section: 'The question'
        say: 'We must name the officer who signs the general warrant releasing money from the Consolidated Revenue Fund.'
        write: 'Who signs the general warrant?'
      - section: 'The rule'
        say: 'After the National Assembly passes the Appropriation Act, the Minister of Finance signs the general warrant. It lets the Accountant General release money from the Consolidated Revenue Fund.'
        write: 'Appropriation Act ⟶ general warrant (Minister of Finance) ⟶ release'
      - section: 'Other warrants'
        say: 'A supplementary warrant covers extra spending later in the year, and a contingencies warrant covers urgent spending.'
        write: 'Supplementary warrant, contingencies warrant'
      - section: 'Answer'
        say: 'So the general warrant is signed by the Minister of Finance, which is option A.'
        write: '$\therefore$ Minister of Finance'
        answer: true
    traps:
      B: 'You chose the chairman of an advisory committee. He gives advice, but he cannot authorize spending.'
      C: 'You went for a Permanent Secretary. He spends under the warrant, but he does not sign it.'
      D: 'You picked the Minister of Economic Planning. That minister plans, but the Minister of Finance releases funds.'
