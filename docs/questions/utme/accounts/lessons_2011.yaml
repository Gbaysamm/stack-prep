        write: '₦32,000 + ₦39,000 = ₦71,000'
      - section: 'Cost of goods sold'
        say: 'Take away the closing stock. Seventy one thousand minus nine thousand is sixty two thousand naira.'
        write: '₦71,000 − ₦9,000 = ₦62,000'
      - section: 'Check'
        say: 'Sixty two thousand sold plus nine thousand left gives back the seventy one thousand naira available.'
        write: '₦62,000 + ₦9,000 = ₦71,000 ✓'
      - section: 'Remember'
        say: 'Remember, carriage inwards is added to purchases, returns outwards come off, and sales play no part.'
        write: '+ carriage inwards, − returns outwards'
      - section: 'Answer'
        say: 'So the cost of goods sold is sixty two thousand naira, which is option C.'
        write: '$\therefore$ ₦62,000'
        answer: true
    traps:
      A: 'You chose sixty one thousand naira. That leaves out the carriage inwards of one thousand naira, which is part of the cost of the goods.'
      B: 'You went for fifty eight thousand naira. That does not come from the account. The working gives sixty two thousand naira.'
      D: 'You picked fifty seven thousand naira. That is five thousand naira short of the true cost of sixty two thousand naira.'
