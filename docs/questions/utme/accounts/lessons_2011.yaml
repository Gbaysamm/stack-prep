# UTME 2011 Principles of Accounts, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Nigerian Accounts teacher works on the
# board: what is given and what is asked, the account, rule or concept that connects them, the
# double entry or the calculation worked step by step, and the answer moment that names the
# option.
#
#   say:     heard, not read. Abbreviations as letters or words ("F I F O", "brought down"),
#            money in words, percentages as "per cent", no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2011.yaml. Answers match that file. Q1 (the paper
# type) is left out, so 49 questions have a lesson.
format_version: 1
exam_year: 2011
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'We are asked what the history of accounting shows about the subject.'
        write: 'The historical development of accounting reveals that it ... ?'
      - section: 'The rule'
        say: 'The texts teach that accounting is a product of its environment. It changes as the society, trade and law around it change.'
        write: 'Accounting = a product of its environment'
      - section: 'How it grew'
        say: 'It began as stewardship records. A steward who looked after an owner''s estate kept records to show the owner what he had done with the property.'
        write: 'Stewardship records'
      - say: 'As trade on credit grew, merchants needed fuller records, and double entry was developed. Luca Pacioli wrote it down in fourteen ninety four.'
        write: 'Trade on credit ⟶ double entry (Pacioli, 1494)'
      - say: 'When companies and company law arrived, accounting grew again, into published and audited reports.'
        write: 'Companies ⟶ published, audited reports'
      - say: 'At each stage, the needs of the society shaped the records it kept. That is what a product of its environment means.'
        write: 'Each society''s needs ⟶ its accounting'
      - section: 'Answer'
        say: 'So the history of accounting reveals that it is a product of its own environment, which is option C.'
        write: '$\therefore$ a product of its own environment'
        answer: true
    traps:
      A: 'You chose debit and credit terms. Accounting does use debit and credit, but that is its method, not what its history shows.'
      B: 'You went for a product of financial development. Accounting grew from the needs of the whole society, its trade, law and ownership, not from finance alone.'
      D: 'You picked an ideal subject for financial development. That says nothing about how accounting grew over time.'
  3:
    moments:
      - section: 'The question'
        say: 'We must say on which side of a trial balance income and liabilities are listed.'
        write: 'Trial balance: income and liabilities are ... ?'
      - section: 'The trial balance'
        say: 'A trial balance lists every ledger balance, either in a debit column or in a credit column.'
        write: 'Trial balance = Dr column and Cr column'
      - section: 'The rule'
        say: 'Debit balances are expenses, assets and drawings. These go in the debit column.'
        write: 'Dr: expenses, assets, drawings'
      - say: 'Credit balances are liabilities, income and capital. These go in the credit column.'
        write: 'Cr: liabilities, income, capital'
      - section: 'Why'
        say: 'Income like sales is credited each time it is earned, so the sales account ends with a credit balance.'
        write: 'Income ⟶ Cr'
      - say: 'A liability like a creditor is credited when the debt arises, so it too ends on the credit side.'
        write: 'Liabilities ⟶ Cr'
      - section: 'Remember'
        say: 'Remember DEAD CLIC. The letters stand for debits, expenses, assets and drawings, then credits, liabilities, income and capital.'
        write: 'DEAD CLIC'
      - section: 'Answer'
        say: 'So in a trial balance, income and liabilities are both credited, which is option B.'
        write: '$\therefore$ credited'
        answer: true
    traps:
      A: 'You chose debited and credited respectively. Income is not debited. It sits on the credit side with the liabilities.'
      C: 'You went for credited and debited respectively. Liabilities are not debited. They are credit balances like income.'
      D: 'You picked debited. The debit side holds expenses, assets and drawings, not income and liabilities.'
  4:
    moments:
      - section: 'The question'
        say: 'We must say what the principle of double entry makes sure of.'
        write: 'The principle of double entry ensures ... ?'
      - section: 'The rule'
        say: 'Double entry says every transaction has two sides, so every debit entry has an equal credit entry.'
        write: 'Every debit = an equal credit'
      - section: 'Work it'
        say: 'Say a bakery buys flour for fifty thousand naira cash. We debit purchases with fifty thousand naira and credit cash with fifty thousand naira.'
        write: 'Dr Purchases ₦50,000.  Cr Cash ₦50,000'
      - say: 'Both columns of the trial balance rise by the same fifty thousand naira, so they still agree.'
        write: 'Dr total + ₦50,000 = Cr total + ₦50,000'
      - section: 'The result'
        say: 'Because every amount goes in twice, once on each side, the totals of the trial balance agree. That shows the books are arithmetically accurate.'
        write: 'Total debits = total credits ⟹ arithmetical accuracy'
      - section: 'Answer'
        say: 'So the principle of double entry ensures arithmetical accuracy in the trial balance, which is option A.'
        write: '$\therefore$ arithmetical accuracy in the trial balance'
        answer: true
    traps:
      B: 'You chose a balance at the bank. Double entry records what is in the bank, but it cannot make sure there is money there.'
      C: 'You went for increases in assets and liabilities. Many transactions do not raise both. A cash purchase lowers cash and raises an expense.'
      D: 'You picked the balance of the cash account. Double entry makes the whole set of books agree, not one account.'
  5:
    moments:
      - section: 'The question'
        say: 'Three steps for balancing an account are given, and we must put them in the right order.'
        write: 'I. deduct smaller from bigger.  II. add both sides.  III. put the difference on the smaller side'
      - section: 'Balancing'
        say: 'Balancing an account means finding the amount left on it at the end of a period.'
        write: 'Balancing an account'
      - section: 'Step one'
        say: 'First we add up both sides. We cannot compare two sides until we have their totals.'
        write: 'Step 1 = II, add both sides'
      - section: 'Step two'
        say: 'Next we take the smaller total away from the bigger total. That gives the difference.'
        write: 'Step 2 = I, bigger minus smaller'
      - section: 'Step three'
        say: 'Last, we put the difference on the smaller side as the balance carried down, so both sides show the same total.'
        write: 'Step 3 = III, balance c/d on the smaller side'
      - section: 'Work it'
        say: 'For example, a cash account adds up to eighty thousand naira on the debit side and sixty five thousand naira on the credit side. The difference of fifteen thousand naira goes on the credit side as the balance carried down.'
        write: '₦80,000 − ₦65,000 = ₦15,000 Balance c/d'
      - section: 'Answer'
        say: 'So the order is two, one and three, which is option A.'
        write: '$\therefore$ II, I and III'
        answer: true
    traps:
      B: 'You chose one, three and two. That subtracts before the sides have been added, and adds them last.'
      C: 'You went for two, three and one. That places the balance before you have worked out the difference.'
      D: 'You picked one, two and three. You cannot take one side from the other before you have added each side up.'
  6:
    moments:
      - section: 'The question'
        say: 'We are given five balances and must find the total of the trial balance.'
        write: 'Lighting ₦400, purchases ₦3,000, sales ₦1,200, debtors ₦50, capital ₦2,250'
      - section: 'The total'
        say: 'The total of a trial balance is the total of one column. The debit and credit columns must come to the same figure, so we never add the two together.'
        write: 'Total of trial balance = total of one column'
      - section: 'The rule'
        say: 'Expenses, assets and purchases go in the debit column.'
        write: 'Dr: expenses, assets, purchases'
      - say: 'Sales, liabilities and capital go in the credit column.'
        write: 'Cr: sales, liabilities, capital'
      - section: 'The debit side'
        say: 'Lighting is an expense, purchases are the cost of goods bought, and debtors are an asset, because customers owe us that money. So all three go in the debit column.'
        write: 'Lighting, purchases, debtors ⟶ Dr'
      - say: 'Now we add them. Lighting four hundred, plus purchases three thousand, plus debtors fifty, gives three thousand, four hundred and fifty naira.'
        write: 'Dr: ₦400 + ₦3,000 + ₦50 = ₦3,450'
      - section: 'The credit side'
        say: 'Sales is income and capital is what the owner put in, so both go in the credit column.'
        write: 'Sales, capital ⟶ Cr'
      - say: 'Now we add them. Sales one thousand, two hundred, plus capital two thousand, two hundred and fifty, gives three thousand, four hundred and fifty naira.'
        write: 'Cr: ₦1,200 + ₦2,250 = ₦3,450'
      - section: 'Answer'
        say: 'Both columns come to three thousand, four hundred and fifty naira, so the total of the trial balance is three thousand, four hundred and fifty naira, which is option D.'
        write: '$\therefore$ ₦3,450'
        answer: true
    traps:
      A: 'You chose four thousand, two hundred and fifty naira. That is purchases, sales and debtors added together, which mixes a credit balance with debit balances. Each column totals three thousand, four hundred and fifty naira.'
      B: 'You went for three thousand, five hundred naira. Neither column adds up to that. Each comes to three thousand, four hundred and fifty naira.'
      C: 'You picked four thousand, three hundred naira. Neither column adds up to that. Sort each balance to its side, and each side totals three thousand, four hundred and fifty naira.'
  7:
    moments:
      - section: 'The question'
        say: 'We must say how the journal is ruled, that is, which columns it has.'
        write: 'The major feature of a journal is that it has ... ?'
      - section: 'The journal'
        say: 'The journal is a book of original entry for transactions that go in no other day book.'
        write: 'The journal'
      - section: 'The rule'
        say: 'The journal has five columns. They are date, particulars, folio, debit and credit.'
        write: 'Date | Particulars | Folio | Debit | Credit'
      - section: 'How it works'
        say: 'The debit and credit money columns stand side by side, so one entry shows both accounts and both amounts.'
        write: 'Two money columns, side by side'
      - say: 'For example, a van bought on credit from Abuja Motors for four million naira is entered as motor van debit and Abuja Motors credit, with four million naira in each money column.'
        write: 'Motor van Dr ₦4,000,000 | Abuja Motors Cr ₦4,000,000'
      - section: 'Answer'
        say: 'So the journal has five columns, date, particulars, folio, debit and credit, which is option B.'
        write: '$\therefore$ five columns'
        answer: true
    traps:
      A: 'You chose six columns. There is no separate amount column, because the debit and credit columns are the amounts.'
      C: 'You went for three columns with one amount. The journal needs both a debit and a credit column.'
      D: 'You picked four columns with one amount. A single amount column cannot show the debit and credit side by side.'
  8:
    moments:
      - section: 'The question'
        say: 'The trial balance does not agree, and the errors behind the difference have not been found. We must name the account used to hold the difference while those errors are corrected.'
        write: 'Errors that cause a trial balance difference are put right using ... ?'
      - section: 'The rule'
        say: 'When a trial balance does not agree, the difference is put into a suspense account, so the final accounts can go ahead. Each error is then put right through it.'
        write: 'Difference ⟶ suspense, until errors found'
      - section: 'Work it'
        say: 'Say the debits are five hundred naira more than the credits. The credit side is short, so we credit suspense with five hundred naira, and now the two sides agree.'
        write: 'Cr Suspense ₦500'
      - say: 'Later we find sales were undercast by five hundred naira. Undercast means added up too low, so the sales account needs five hundred naira more on its credit side.'
        write: 'Sales undercast by ₦500'
      - say: 'So we debit suspense and credit sales with five hundred naira. Suspense now has five hundred naira on each side, so it closes.'
        write: 'Dr Suspense ₦500.  Cr Sales ₦500 ⟹ suspense closed'
      - section: 'Answer'
        say: 'So these errors are put right through the suspense account, which is option C.'
        write: '$\therefore$ suspense account'
        answer: true
    traps:
      A: 'You chose the debtors account. It records what customers owe, not a trial balance difference.'
      B: 'You went for the creditors account. It records what we owe suppliers, not a trial balance difference.'
      D: 'You picked the ledger account. Every account is a ledger account. The special one that holds the difference is suspense.'
  9:
    moments:
      - section: 'The question'
        say: 'We are given a list price of four hundred naira, a trade discount of ten per cent and a cash discount of fifteen per cent, and Adamu Stores paid within the discount period. We must find the amount paid.'
        write: 'List price ₦400, trade discount 10%, cash discount 15%. Amount paid = ?'
      - section: 'The rule'
        say: 'Trade discount comes off the list price first and never enters the books. What is left is called the net invoice.'
        write: 'Net invoice = list price − trade discount'
      - say: 'Cash discount is then allowed on the net invoice, for paying promptly. So it is worked on the smaller figure, not the list price.'
        write: 'Cash discount = rate × net invoice'
      - section: 'Trade discount'
        say: 'Ten per cent of four hundred naira is forty naira.'
        write: '$0.10 \times 400 = 40$, so ₦40'
      - say: 'Four hundred minus forty leaves three hundred and sixty naira. That is the net invoice.'
        write: '₦400 − ₦40 = ₦360 net invoice'
      - section: 'Cash discount'
        say: 'Fifteen per cent of three hundred and sixty naira is fifty four naira.'
        write: '$0.15 \times 360 = 54$, so ₦54'
      - section: 'Amount paid'
        say: 'Adamu Stores paid within the discount period, so the cash discount comes off. Three hundred and sixty naira minus fifty four naira is three hundred and six naira.'
        write: '₦360 − ₦54 = ₦306'
      - section: 'Answer'
        say: 'So Adamu Stores paid three hundred and six naira, which is option A.'
        write: '$\therefore$ ₦306'
        answer: true
    traps:
      B: 'You chose three hundred naira. That takes the cash discount on the list price. It must be fifteen per cent of the net invoice of three hundred and sixty naira.'
      C: 'You went for three hundred and forty naira. That forgets the trade discount and takes the cash discount on the list price.'
      D: 'You picked three hundred and sixty naira. That takes off only the trade discount. The cash discount still comes off for prompt payment.'
  10:
    moments:
      - section: 'The question'
        say: 'We are given the same invoice, a list price of four hundred naira with a trade discount of ten per cent and a cash discount of fifteen per cent. Now we must find the cash discount itself.'
        write: 'List ₦400, trade 10%, cash 15%. Cash discount = ?'
      - section: 'The rule'
        say: 'Cash discount is an allowance for paying promptly. It is worked on the net invoice, which is the list price less the trade discount.'
        write: 'Cash discount = rate × net invoice'
      - section: 'Net invoice'
        say: 'Ten per cent of four hundred naira is forty naira, so the net invoice is three hundred and sixty naira.'
        write: '₦400 − ₦40 = ₦360'
      - section: 'Cash discount'
        say: 'Fifteen per cent of three hundred and sixty naira is fifty four naira.'
        write: '$0.15 \times 360 = 54$'
      - section: 'Answer'
        say: 'So the cash discount is fifty four naira, which is option B.'
        write: '$\therefore$ ₦54'
        answer: true
    traps:
      A: 'You chose sixty naira. That is fifteen per cent of the list price. The trade discount must come off first.'
      C: 'You went for forty naira. That is the trade discount, ten per cent of four hundred naira, not the cash discount.'
      D: 'You picked one hundred naira. That adds the trade discount to fifteen per cent of the list price. The cash discount alone is fifty four naira.'
  11:
    moments:
      - section: 'The question'
        say: 'We must say which records the timing differences in a bank reconciliation come from.'
        write: 'Timing differences arise as a result of ... ?'
      - section: 'The rule'
        say: 'A timing difference arises when a transaction reaches one record before the other. So it is found by comparing the cash book with the bank statement.'
        write: 'Cash book vs bank statement'
      - section: 'Examples'
        say: 'An unpresented cheque is a cheque we have written and entered, but the person paid has not yet taken it to the bank.'
        write: 'Unpresented cheque = written, not yet banked by the payee'
      - say: 'An uncredited lodgement is money we have paid in and entered, but the bank has not yet credited it.'
        write: 'Uncredited lodgement = paid in, not yet credited by the bank'
      - say: 'So these two are in the cash book but not yet on the statement.'
        write: 'In cash book first: unpresented cheques, uncredited lodgements'
      - say: 'It also works the other way. Bank charges and standing orders are on the statement before they reach the cash book, because the bank enters them first.'
        write: 'On statement first: bank charges, standing orders'
      - section: 'Answer'
        say: 'Each timing difference is a gap between those two records, so timing differences arise from the cash book and the bank statement, which is option A.'
        write: '$\therefore$ cash book and bank statement'
        answer: true
    traps:
      B: 'You chose the bank statement only. A timing gap needs two records to compare, not one.'
      C: 'You went for other incidental records too. Only the cash book and the bank statement are compared.'
      D: 'You picked the cash book only. The gap is between the cash book and the bank statement.'
  12:
    moments:
      - section: 'The question'
        say: 'A cheque drawn on one bank is paid into another bank. We must name the process by which the two banks settle it.'
        write: 'Settling cheques between banks is termed cheque ... ?'
      - section: 'The rule'
        say: 'Clearing is the process by which banks exchange the cheques drawn on one another and settle the amounts between themselves.'
        write: 'Clearing = banks exchange and settle cheques'
      - section: 'How it works'
        say: 'For example, a cheque drawn on Bank Y is paid into Bank X. Bank X sends it to the clearing house, where the banks exchange cheques.'
        write: 'Bank X ⟶ clearing house'
      - say: 'Bank Y then pays the amount, and Bank X credits its customer.'
        write: 'Bank Y pays ⟶ Bank X credits payee'
      - section: 'Not reconciling'
        say: 'Do not confuse clearing with reconciling. Clearing settles cheques between banks, while reconciling compares a cash book with a bank statement.'
        write: 'Clear between banks.  Reconcile between records'
      - section: 'Answer'
        say: 'So the process is called cheque clearing, which is option A.'
        write: '$\therefore$ clearing'
        answer: true
    traps:
      B: 'You chose truncation. Truncation sends an image of the cheque instead of the paper. It is a method used within clearing, not the process itself.'
      C: 'You went for holding. Holding a cheque means keeping it back, not settling it between banks.'
      D: 'You picked confirmation. Confirmation is the bank checking with the drawer that a cheque is genuine. It does not settle the amount between banks.'
  13:
    moments:
      - section: 'The question'
        say: 'The bank has charged interest on an overdraft. It is on the bank statement but not yet in the cash book. We must say which balance the interest is added to when the cash book is brought up to date.'
        write: 'Interest on overdraft, on statement only. Add it to ... ?'
      - section: 'The rule'
        say: 'Before we reconcile, items the bank has entered but the cash book has not are entered in the cash book. This gives the adjusted cash book.'
        write: 'Bank has it, cash book lacks it ⟶ enter in cash book'
      - say: 'Interest charged is money taken from us, a payment, and payments go on the credit side of the cash book.'
        write: 'Interest charged ⟶ Cr bank column of cash book'
      - section: 'The overdraft'
        say: 'An overdraft means we have taken out more than we had in the bank, so it is a credit balance in the cash book. Crediting the interest adds to that credit balance, so the overdraft grows.'
        write: 'Overdraft = Cr balance.  Cr interest ⟹ overdraft grows'
      - section: 'Work it'
        say: 'Say the cash book shows an overdraft of twenty thousand naira and the interest is one thousand, five hundred naira. The adjusted overdraft is twenty one thousand, five hundred naira.'
        write: '₦20,000 + ₦1,500 = ₦21,500 overdrawn'
      - section: 'Answer'
        say: 'So the interest is added to the overdrawn balance as per cash book, which is option D.'
        write: '$\therefore$ overdrawn balance as per cash book'
        answer: true
    traps:
      A: 'You chose the bank statement balance. The bank already put the interest there, so adding it again would count it twice.'
      B: 'You went for the adjusted cash book balance. That is the result after adding the interest, not the figure we add it to.'
      C: 'You picked an aggregate balance. There is no such balance here. The interest goes to the overdraft in the cash book.'
  14:
    moments:
      - section: 'The question'
        say: 'We are given five balance sheet items and must pick the two that are current liabilities.'
        write: 'I stock, II furniture, III creditors, IV cash at bank, V bank overdraft'
      - section: 'The rule'
        say: 'Current liabilities are debts the business must pay within one year, such as creditors, a bank overdraft and accrued expenses. Creditors are now called payables.'
        write: 'Current liabilities = owed, due within a year'
      - section: 'Sort them'
        say: 'Stock and cash at bank are things the business owns, so they are current assets, not liabilities.'
        write: 'I, IV current assets'
      - say: 'Furniture is also owned, and it is kept for years, so it is a fixed asset.'
        write: 'II fixed asset'
      - say: 'Creditors and the bank overdraft are owed and must be paid soon, so they are current liabilities.'
        write: 'III, V current liabilities'
      - section: 'Answer'
        say: 'So the current liabilities are three and five, which is option A.'
        write: '$\therefore$ III and V'
        answer: true
    traps:
      B: 'You chose two and three. Creditors are right, but furniture is a fixed asset, not a liability.'
      C: 'You went for four and five. The overdraft is right, but cash at bank is an asset the business owns.'
      D: 'You picked one and two. Stock and furniture are both assets, so nothing there is owed.'
  15:
    moments:
      - section: 'The question'
        say: 'We are given the same five items and must pick the two that are current assets.'
        write: 'I stock, II furniture, III creditors, IV cash at bank, V bank overdraft'
      - section: 'The rule'
        say: 'Current assets are cash, or items that will become cash within a year, such as stock, debtors and cash at bank. Stock is now called inventory.'
        write: 'Current assets = cash or near cash within a year'
      - section: 'Sort them'
        say: 'Stock will be sold, and cash at bank is already cash. Both are current assets.'
        write: 'I stock, IV cash at bank ⟹ current'
      - say: 'Furniture is kept for years and is not meant to be sold, so it is a fixed asset.'
        write: 'II fixed asset'
      - say: 'Creditors and the overdraft are money the business owes, so they are liabilities, not assets.'
        write: 'III, V liabilities'
      - section: 'Answer'
        say: 'So the current assets are one and four, which is option D.'
        write: '$\therefore$ I and IV'
        answer: true
    traps:
      A: 'You chose three and five. Creditors and the overdraft are liabilities, not assets.'
      B: 'You went for two and one. Stock is current, but furniture is a fixed asset kept for use.'
      C: 'You picked four and five. Cash at bank is current, but the overdraft is a liability.'
  16:
    moments:
      - section: 'The question'
        say: 'We are given four expenses and must pick the one charged against the administration of the firm.'
        write: 'Expense charged against administration = ?'
      - section: 'The rule'
        say: 'Expenses in the profit and loss account are grouped by what they pay for. Administrative expenses keep the office and premises running.'
        write: 'Admin = office and premises'
      - say: 'Selling expenses are the costs of getting the goods to customers, such as carriage outwards and advertising.'
        write: 'Selling = getting goods to customers'
      - say: 'Financial expenses are the costs of borrowing money and of discounts.'
        write: 'Finance = borrowing and discounts'
      - say: 'Tax is different. It is charged on the profit itself, not on running the firm.'
        write: 'Tax = on profit'
      - section: 'Sort them'
        say: 'Repairs on the building keep the premises in order, so they are administrative.'
        write: 'Repairs ⟶ admin'
      - say: 'Interest on a loan is the cost of borrowing, and discount allowed is given for paying early, so both are financial.'
        write: 'Interest, discount ⟶ financial'
      - section: 'Answer'
        say: 'So the administrative expense is repairs on building, which is option A.'
        write: '$\therefore$ repairs on building'
        answer: true
    traps:
      B: 'You chose interest paid on a loan. That is the cost of borrowing, so it is a financial expense.'
      C: 'You went for discount allowed. It is given to customers who pay early, so it is a financial or selling expense.'
      D: 'You picked tax expense. Tax is charged on the profit, not on the running of the office.'
  17:
    moments:
      - section: 'The question'
        say: 'Prices are falling. We must find which stock valuation method gives the higher profit.'
        write: 'Declining prices. Higher profit from ... ?'
      - section: 'The methods'
        say: 'Each stock valuation method decides which units, the old ones or the new ones, are charged to cost of sales when goods are sold.'
        write: 'FIFO, LIFO, simple average, weighted average'
      - section: 'The rule'
        say: 'Profit is sales less cost of sales. So the method that charges the cheapest units to cost of sales gives the highest profit.'
        write: 'Lower cost of sales ⟹ higher profit'
      - section: 'Falling prices'
        say: 'When prices fall, the old stock was bought dear and the new stock is cheap.'
        write: 'Old units dear.  New units cheap'
      - section: 'Compare'
        say: 'L I F O means last in, first out. It issues the new cheap units first, so cost of sales is lowest and profit is highest.'
        write: 'LIFO ⟹ lowest cost ⟹ highest profit'
      - say: 'F I F O means first in, first out. It issues the old dear units first, so cost of sales is highest and profit is lowest.'
        write: 'FIFO ⟹ highest cost ⟹ lowest profit'
      - say: 'The two average methods mix old and new prices, so their profit falls in between.'
        write: 'Averages ⟹ profit in between'
      - section: 'Work it'
        say: 'For example, maize bought at fifty thousand naira a bag in January and forty thousand in March. A bag sold in April is charged at forty thousand naira under L I F O but fifty thousand naira under F I F O, so L I F O leaves more profit.'
        write: 'LIFO ₦40,000 vs FIFO ₦50,000 per bag'
      - section: 'Answer'
        say: 'So in a period of declining prices, L I F O gives the higher profit, which is option C.'
        write: '$\therefore$ LIFO'
        answer: true
    traps:
      A: 'You chose F I F O. That gives the higher profit when prices rise. When prices fall it issues the dear old stock and gives the lowest profit.'
