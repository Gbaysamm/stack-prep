        write: '₦28,000 − ₦14,700 = ₦13,300 ✓'
      - section: 'Remember'
        say: 'Remember, first in, first out, so the last in are still on the shelf. A pharmacy sells its oldest drugs first, which is F I F O in real life.'
        write: 'Last in still on the shelf'
      - section: 'Answer'
        say: 'So the stock at the end of July ten is worth thirteen thousand, three hundred naira, which is option B.'
        write: '$\therefore$ ₦13,300'
        answer: true
