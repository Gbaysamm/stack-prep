# UTME 2011 Principles of Accounts, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Nigerian Accounts teacher works on the
# board: the question, the account, rule or concept named, the rule in plain words, the double
# entry or the calculation worked (data, formula, working, check), a Nigerian example, a way to
# remember it, and the answer moment that names the option.
#
#   say:     heard, not read. Abbreviations as letters or words ("F I F O", "brought down"),
#            money in words, percentages as "per cent", no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2011.yaml. Answers match that file. Q1 (the paper
# type) is left out, so 49 questions have a lesson.
format_version: 1
exam_year: 2011
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'Accounting today looks nothing like the records kept a thousand years ago. What does that long story tell us about the subject?'
        write: 'The historical development of accounting reveals that it ... ?'
      - section: 'Name it'
        say: 'This is the historical development of accounting, how it grew from simple records to modern reports.'
        write: 'History of accounting'
      - section: 'The rule'
        say: 'The texts teach that accounting is a product of its environment. It changes as society, trade and the law change.'
        write: 'Accounting = a product of its environment'
      - section: 'How it grew'
        say: 'First came simple stewardship records on great estates. Then Italian merchants trading on credit gave us double entry, written down by Luca Pacioli in fourteen ninety four.'
        write: 'Stewardship records ⟶ double entry (Pacioli, 1494)'
      - say: 'When companies and company law arrived, accounting grew again, into published and audited reports.'
        write: 'Double entry ⟶ company reports and audit'
      - section: 'In Nigeria'
        say: 'A market woman in Onitsha keeps a simple notebook of who owes her. A bank in Lagos must publish audited accounts. Each environment shapes the accounting it needs.'
        write: 'Onitsha notebook vs Lagos bank''s audited accounts'
      - section: 'Remember'
        say: 'Remember, accounting grows where it is planted. The environment shapes the books.'
        write: 'Environment shapes the books'
      - section: 'Answer'
        say: 'So the history of accounting reveals that it is a product of its own environment, which is option C.'
        write: '$\therefore$ a product of its own environment'
        answer: true
    traps:
      A: 'You chose debit and credit terms. Accounting does use debit and credit, but that is its method, not what its history shows.'
      B: 'You went for a product of financial development. Accounting grew from the needs of the whole society, not from finance alone.'
      D: 'You picked an ideal subject for financial development. That says nothing about how accounting grew over time.'
  3:
    moments:
      - section: 'The question'
        say: 'Every balance in a trial balance sits on one side or the other. Where do income and liabilities go?'
        write: 'Trial balance: income and liabilities are ... ?'
      - section: 'Name it'
        say: 'This is the trial balance, a list of every ledger balance in a debit column or a credit column.'
        write: 'Trial balance = Dr column and Cr column'
      - section: 'The rule'
        say: 'Debit balances are expenses, assets and drawings. Credit balances are liabilities, income and capital.'
        write: 'Dr: expenses, assets, drawings.  Cr: liabilities, income, capital'
      - section: 'Why'
        say: 'Income like sales is credited when it is earned, so it ends with a credit balance. A liability like a creditor is credited when the debt arises, so it too ends on the credit side.'
        write: 'Income ⟶ Cr.  Liabilities ⟶ Cr.'
      - section: 'In Nigeria'
        say: 'A pharmacy in Ibadan lists sales of nine hundred thousand naira and creditors of one hundred and twenty thousand naira. Both go in the credit column.'
        write: 'Sales ₦900,000 Cr.  Creditors ₦120,000 Cr.'
      - section: 'Remember'
        say: 'Remember DEAD CLIC. Debits are expenses, assets and drawings. Credits are liabilities, income and capital.'
        write: 'DEAD CLIC'
      - section: 'Answer'
        say: 'So in a trial balance, income and liabilities are both credited, which is option B.'
        write: '$\therefore$ credited'
        answer: true
    traps:
      A: 'You chose debited and credited respectively. Income is not debited. It sits on the credit side with the liabilities.'
      C: 'You went for credited and debited respectively. Liabilities are not debited. They are credit balances like income.'
      D: 'You picked debited. The debit side holds expenses, assets and drawings, not income and liabilities.'
  4:
    moments:
      - section: 'The question'
        say: 'Every transaction is written twice in the books. What does that double writing make sure of?'
        write: 'The principle of double entry ensures ... ?'
      - section: 'Name it'
        say: 'This is the principle of double entry, the base of all book keeping.'
        write: 'Double entry'
      - section: 'The rule'
        say: 'Every transaction has two sides, so every debit entry has an equal credit entry.'
        write: 'Every debit = an equal credit'
      - section: 'Work it'
        say: 'A bakery in Ibadan buys flour for fifty thousand naira cash. We debit purchases with fifty thousand naira and credit cash with fifty thousand naira.'
        write: 'Dr Purchases ₦50,000.  Cr Cash ₦50,000'
      - say: 'Both columns of the trial balance rise by the same fifty thousand naira, so they still agree.'
        write: 'Dr total + ₦50,000 = Cr total + ₦50,000'
      - section: 'The result'
        say: 'Because every amount goes in twice, once on each side, the totals of the trial balance agree. That proves the arithmetical accuracy of the books.'
        write: 'Total debits = total credits ⟹ arithmetical accuracy'
      - section: 'Remember'
        say: 'Remember, two entries and equal amounts, so the two columns agree.'
        write: 'Two entries, equal amounts'
      - section: 'Answer'
        say: 'So the principle of double entry ensures arithmetical accuracy in the trial balance, which is option A.'
        write: '$\therefore$ arithmetical accuracy in the trial balance'
        answer: true
    traps:
      B: 'You chose a balance at the bank. Double entry records what is in the bank, but it cannot make sure there is money there.'
      C: 'You went for increases in assets and liabilities. Many transactions do not raise both. A cash purchase lowers cash and raises an expense.'
      D: 'You picked the balance of the cash account. Double entry is about the whole set of books agreeing, not one account.'
  5:
    moments:
      - section: 'The question'
        say: 'Three steps are given for balancing an account. In what order do they come?'
        write: 'I. deduct smaller from bigger.  II. add both sides.  III. put the difference on the smaller side'
      - section: 'Name it'
        say: 'This is balancing a ledger account, finding what is left on it at the end of a period.'
        write: 'Balancing an account'
      - section: 'Step one'
        say: 'First we add up both sides. We cannot compare two sides until we have their totals.'
        write: 'Step 1 = II, add both sides'
      - section: 'Step two'
        say: 'Next we take the smaller total away from the bigger total. That gives the difference.'
        write: 'Step 2 = I, bigger minus smaller'
      - section: 'Step three'
        say: 'Last, we put the difference on the smaller side as the balance carried down, so both sides show the same total.'
        write: 'Step 3 = III, balance c/d on the smaller side'
      - section: 'In Nigeria'
        say: 'A cash account in an Onitsha shop has eighty thousand naira on the debit side and sixty five thousand naira on the credit side. The difference of fifteen thousand naira goes on the credit side as the balance carried down.'
        write: '₦80,000 − ₦65,000 = ₦15,000 Balance c/d'
      - section: 'Remember'
        say: 'Remember, add, then subtract, then fill the gap.'
        write: 'Add, subtract, fill the gap'
      - section: 'Answer'
        say: 'So the order is two, one and three, which is option A.'
        write: '$\therefore$ II, I and III'
        answer: true
    traps:
      B: 'You chose one, three and two. That subtracts before the sides have been added, and adds them last.'
      C: 'You went for two, three and one. That places the balance before you have worked out the difference.'
      D: 'You picked one, two and three. You cannot take one side from the other before you have added each side up.'
  6:
    moments:
      - section: 'The question'
        say: 'Five balances are given. What is the total of the trial balance? Many students add everything together. Let us see why that is wrong.'
        write: 'Lighting ₦400, purchases ₦3,000, sales ₦1,200, debtors ₦50, capital ₦2,250'
      - section: 'Name it'
        say: 'This is the trial balance. Its total is the total of one column, and both columns must agree.'
        write: 'Total of trial balance = total of one column'
      - section: 'The rule'
        say: 'Expenses, assets and purchases go in the debit column. Sales, liabilities and capital go in the credit column.'
        write: 'DEAD CLIC'
      - section: 'The debit side'
        say: 'Lighting four hundred, plus purchases three thousand, plus debtors fifty, gives three thousand, four hundred and fifty naira.'
        write: 'Dr: ₦400 + ₦3,000 + ₦50 = ₦3,450'
      - section: 'The credit side'
        say: 'Sales one thousand, two hundred, plus capital two thousand, two hundred and fifty, gives three thousand, four hundred and fifty naira.'
        write: 'Cr: ₦1,200 + ₦2,250 = ₦3,450'
      - section: 'Check'
        say: 'The two columns agree at three thousand, four hundred and fifty naira, so the books balance.'
        write: '₦3,450 = ₦3,450 ✓'
      - section: 'In Nigeria'
        say: 'A provisions shop in Aba lists its balances at the month end. When both columns come to the same figure, its books agree.'
        write: 'Both columns equal ⟹ books agree'
      - section: 'Remember'
        say: 'Remember, the total is one column. Never add the two columns together.'
        write: 'One column, never both'
      - section: 'Answer'
        say: 'So the total of the trial balance is three thousand, four hundred and fifty naira, which is option D.'
        write: '$\therefore$ ₦3,450'
        answer: true
    traps:
      A: 'You chose four thousand, two hundred and fifty naira. That adds balances from both sides. The total of each side is three thousand, four hundred and fifty naira.'
      B: 'You went for three thousand, five hundred naira. Neither column adds up to that. Each comes to three thousand, four hundred and fifty naira.'
      C: 'You picked four thousand, three hundred naira. That mixes items from both columns. Each side totals three thousand, four hundred and fifty naira.'
  7:
    moments:
      - section: 'The question'
        say: 'The journal has a special ruling. How many columns does it have, and what are they?'
        write: 'The major feature of a journal is that it has ... ?'
      - section: 'Name it'
        say: 'This is the journal, a book of original entry for transactions that fit no other day book.'
        write: 'The journal'
      - section: 'The rule'
        say: 'The journal has five columns. They are date, particulars, folio, debit and credit.'
        write: 'Date | Particulars | Folio | Debit | Credit'
      - section: 'How it works'
        say: 'The debit and credit money columns stand side by side, so one entry shows both accounts and both amounts.'
        write: 'Two money columns, side by side'
      - section: 'In Nigeria'
        say: 'A Kano trader buys a van on credit from Abuja Motors for four million naira. The journal shows motor van debit, Abuja Motors credit, and four million naira in each money column.'
        write: 'Motor van Dr ₦4,000,000 | Abuja Motors Cr ₦4,000,000'
      - section: 'Remember'
        say: 'Remember date, particulars, folio, debit and credit. That makes five columns, like five fingers on one hand.'
        write: 'D P F D C = five'
      - section: 'Answer'
        say: 'So the journal has five columns, date, particulars, folio, debit and credit, which is option B.'
        write: '$\therefore$ five columns'
        answer: true
    traps:
      A: 'You chose six columns. There is no separate amount column, because the debit and credit columns are the amounts.'
      C: 'You went for three columns with one amount. The journal needs both a debit and a credit column.'
      D: 'You picked four columns with one amount. A single amount column cannot show the debit and credit side by side.'
  8:
    moments:
      - section: 'The question'
        say: 'The trial balance does not agree and the errors are not yet found. Where does the difference wait?'
        write: 'Errors that cause a trial balance difference are put right using ... ?'
      - section: 'Name it'
        say: 'This is the suspense account.'
        write: 'Suspense account'
      - section: 'The rule'
        say: 'When a trial balance does not agree, the difference is put into a suspense account, so the final accounts can go ahead. Each error is then put right through it.'
        write: 'Difference ⟶ suspense, until errors found'
      - section: 'Work it'
        say: 'Say the debits are five hundred naira more than the credits. We credit suspense with five hundred naira.'
        write: 'Cr Suspense ₦500'
      - say: 'Later we find sales were undercast by five hundred naira. We debit suspense and credit sales, and suspense closes.'
        write: 'Dr Suspense ₦500.  Cr Sales ₦500 ⟹ suspense closed'
      - section: 'In Nigeria'
        say: 'A pharmacy in Enugu finds its trial balance two thousand naira short. It opens a suspense account while the clerks hunt for the error.'
        write: 'Short by ₦2,000 ⟶ suspense ₦2,000'
      - section: 'Remember'
        say: 'Remember, suspense holds the difference in suspense until the errors are found.'
        write: 'Suspense holds it, in suspense'
      - section: 'Answer'
        say: 'So these errors are put right through the suspense account, which is option C.'
        write: '$\therefore$ suspense account'
        answer: true
    traps:
      A: 'You chose the debtors account. It records what customers owe, not a trial balance difference.'
      B: 'You went for the creditors account. It records what we owe suppliers, not a trial balance difference.'
      D: 'You picked the ledger account. Every account is a ledger account. The special one that holds the difference is suspense.'
  9:
    moments:
      - section: 'The question'
        say: 'There are two discounts on one invoice. Most students take both off the list price, and that is the trap. Let us do it properly.'
        write: 'List price ₦400, trade discount 10%, cash discount 15%. Amount paid = ?'
      - section: 'Name it'
        say: 'These are trade discount and cash discount.'
        write: 'Trade discount, then cash discount'
      - section: 'The rule'
        say: 'Trade discount comes off the list price first and never enters the books. Cash discount is then allowed on the net invoice, for paying promptly.'
        write: 'Net invoice = list − trade discount.  Cash discount on net invoice'
      - section: 'Trade discount'
        say: 'Ten per cent of four hundred naira is forty naira. Four hundred minus forty leaves three hundred and sixty naira.'
        write: '₦400 − ₦40 = ₦360 net invoice'
      - section: 'Cash discount'
        say: 'Fifteen per cent of three hundred and sixty naira is fifty four naira.'
        write: '$0.15 \times 360 = 54$, so ₦54'
      - section: 'Amount paid'
        say: 'Three hundred and sixty naira minus fifty four naira is three hundred and six naira.'
        write: '₦360 − ₦54 = ₦306'
      - section: 'Check'
        say: 'Three hundred and six plus fifty four is three hundred and sixty, the debt. Add the forty naira trade discount and we are back at four hundred naira.'
        write: '₦306 + ₦54 + ₦40 = ₦400 ✓'
      - section: 'Remember'
        say: 'Remember, trade first, then cash, and cash is on the net.'
        write: 'Trade first, cash on the net'
      - section: 'Answer'
        say: 'So Adamu Stores paid three hundred and six naira, which is option A.'
        write: '$\therefore$ ₦306'
        answer: true
    traps:
      B: 'You chose three hundred naira. That takes the cash discount on the list price. It must be fifteen per cent of the net invoice of three hundred and sixty naira.'
      C: 'You went for three hundred and forty naira. That forgets the trade discount and takes the cash discount on the list price.'
      D: 'You picked three hundred and sixty naira. That takes off only the trade discount. The cash discount still comes off for prompt payment.'
  10:
    moments:
      - section: 'The question'
        say: 'This is the same invoice. Now we want the cash discount itself. Is it fifteen per cent of four hundred naira, or of something smaller?'
        write: 'List ₦400, trade 10%, cash 15%. Cash discount = ?'
      - section: 'Name it'
        say: 'This is cash discount, an allowance for paying promptly.'
        write: 'Cash discount'
      - section: 'The rule'
        say: 'Cash discount is worked on the net invoice, which is the list price less the trade discount.'
        write: 'Cash discount = rate × net invoice'
      - section: 'Net invoice'
        say: 'Ten per cent of four hundred naira is forty naira, so the net invoice is three hundred and sixty naira.'
        write: '₦400 − ₦40 = ₦360'
      - section: 'Cash discount'
        say: 'Fifteen per cent of three hundred and sixty naira is fifty four naira.'
        write: '$0.15 \times 360 = 54$'
      - section: 'Check'
        say: 'Fifty four naira is less than sixty naira, as it must be, because we took fifteen per cent of a smaller figure.'
        write: '₦54 < ₦60 ✓'
      - section: 'In the books'
        say: 'Adamu Stores credits the fifty four naira to discount received. Mu''azu Beverages debits it to discount allowed.'
        write: 'Adamu: discount received ₦54.  Mu''azu: discount allowed ₦54'
      - section: 'Remember'
        say: 'Remember, trade discount never reaches the ledger, but cash discount does.'
        write: 'Trade discount, not in the ledger.  Cash discount, in the ledger'
      - section: 'Answer'
        say: 'So the cash discount is fifty four naira, which is option B.'
        write: '$\therefore$ ₦54'
        answer: true
    traps:
      A: 'You chose sixty naira. That is fifteen per cent of the list price. The trade discount must come off first.'
      C: 'You went for forty naira. That is the trade discount, ten per cent of four hundred naira, not the cash discount.'
      D: 'You picked one hundred naira. That adds the trade discount to fifteen per cent of the list price. The cash discount alone is fifty four naira.'
  11:
    moments:
      - section: 'The question'
        say: 'Your cash book says one thing and the bank statement says another. When the gap is only about timing, where does it come from?'
        write: 'Timing differences arise as a result of ... ?'
      - section: 'Name it'
        say: 'These are timing differences in bank reconciliation.'
        write: 'Timing differences'
      - section: 'The rule'
        say: 'A timing difference arises when a transaction reaches one record before the other. So it is found by comparing the cash book with the bank statement.'
        write: 'Cash book vs bank statement'
      - section: 'Examples'
        say: 'Unpresented cheques and uncredited lodgements are in the cash book but not yet on the statement.'
        write: 'In cash book first: unpresented cheques, uncredited lodgements'
      - say: 'Bank charges and standing orders are on the statement before they reach the cash book.'
        write: 'On statement first: bank charges, standing orders'
      - section: 'In Nigeria'
        say: 'A Lagos firm pays a supplier by cheque on the thirtieth of June. The supplier banks it on the third of July, so the June statement does not show it.'
        write: 'Cheque 30 June, presented 3 July'
      - section: 'Remember'
        say: 'Remember, timing means two records, one early and one late.'
        write: 'Timing = two records'
      - section: 'Answer'
        say: 'So timing differences arise from the cash book and the bank statement, which is option A.'
        write: '$\therefore$ cash book and bank statement'
        answer: true
    traps:
      B: 'You chose the bank statement only. A timing gap needs two records to compare, not one.'
      C: 'You went for other incidental records too. Only the cash book and the bank statement are compared.'
      D: 'You picked the cash book only. The gap is between the cash book and the bank statement.'
  12:
    moments:
      - section: 'The question'
        say: 'You pay a cheque from one bank into another bank. How do the two banks settle it between them?'
        write: 'Settling cheques between banks is termed cheque ... ?'
      - section: 'Name it'
        say: 'This is cheque clearing.'
        write: 'Cheque clearing'
      - section: 'The rule'
        say: 'Clearing is the process by which banks exchange the cheques drawn on one another and settle the amounts between themselves.'
        write: 'Clearing = banks exchange and settle cheques'
      - section: 'How it works'
        say: 'A cheque drawn on Bank Y is paid into Bank X. It goes through the clearing house, Bank Y pays, and Bank X credits its customer.'
        write: 'Bank X ⟶ clearing house ⟶ Bank Y pays ⟶ Bank X credits payee'
      - section: 'In Nigeria'
        say: 'A school in Abeokuta pays a supplier by cheque. The supplier banks it elsewhere, and the two banks settle it through the clearing system under the Central Bank.'
        write: 'School''s bank ⟷ supplier''s bank, via clearing'
      - section: 'Remember'
        say: 'Remember, cheques clear between banks, but accounts reconcile between records.'
        write: 'Clear between banks.  Reconcile between records'
      - section: 'Answer'
        say: 'So the process is called cheque clearing, which is option A.'
        write: '$\therefore$ clearing'
        answer: true
    traps:
      B: 'You chose truncation. Truncation sends an image of the cheque instead of the paper. It is a method used within clearing, not the process itself.'
      C: 'You went for holding. Holding a cheque means keeping it back, not settling it between banks.'
      D: 'You picked confirmation. Confirming a cheque is only one check, not the whole process of settlement.'
  13:
    moments:
      - section: 'The question'
        say: 'The bank has charged interest on your overdraft. It is on the statement but not yet in your cash book. Where do you add it?'
        write: 'Interest on overdraft, on statement only. Add it to ... ?'
      - section: 'Name it'
        say: 'This is updating the cash book, which gives the adjusted cash book, before we reconcile.'
        write: 'Adjusted cash book'
      - section: 'The rule'
        say: 'Items the bank has entered but the cash book has not are entered in the cash book. Interest charged is a payment, so it goes on the credit side.'
        write: 'Interest charged ⟶ Cr bank column of cash book'
      - section: 'The overdraft'
        say: 'An overdraft is a credit balance in the cash book. So crediting the interest makes the overdraft bigger.'
        write: 'Overdraft = Cr balance.  Cr interest ⟹ overdraft grows'
      - section: 'Work it'
        say: 'Say the cash book shows an overdraft of twenty thousand naira and the interest is one thousand, five hundred naira. The adjusted overdraft is twenty one thousand, five hundred naira.'
        write: '₦20,000 + ₦1,500 = ₦21,500 overdrawn'
      - section: 'Check'
        say: 'The bank statement already shows twenty one thousand, five hundred naira overdrawn. Now both records agree on this item.'
        write: 'Statement ₦21,500 = adjusted cash book ₦21,500 ✓'
      - section: 'In Nigeria'
        say: 'A Port Harcourt contractor runs an overdraft. At the month end the bank adds interest, and the accountant must add it to the overdraft in the cash book.'
        write: 'Contractor''s cash book overdraft + interest'
      - section: 'Remember'
        say: 'Remember, whichever book is missing the entry is the book you change.'
        write: 'Change the book that lacks the entry'
      - section: 'Answer'
        say: 'So the interest is added to the overdrawn balance as per cash book, which is option D.'
        write: '$\therefore$ overdrawn balance as per cash book'
        answer: true
    traps:
      A: 'You chose the bank statement balance. The bank already put the interest there, so adding it again would count it twice.'
      B: 'You went for the adjusted cash book balance. That is the result after adding the interest, not the figure we add it to.'
      C: 'You picked an aggregate balance. There is no such balance here. The interest goes to the overdraft in the cash book.'
  14:
    moments:
      - section: 'The question'
        say: 'Here are five balance sheet items. Which two does the business owe and must pay within the year?'
        write: 'I stock, II furniture, III creditors, IV cash at bank, V bank overdraft'
      - section: 'Name it'
        say: 'These are current liabilities in the balance sheet, now called the statement of financial position.'
        write: 'Current liabilities'
      - section: 'The rule'
        say: 'Current liabilities are debts payable within one year, such as creditors, a bank overdraft and accrued expenses. Creditors are now called payables.'
        write: 'Current liabilities = owed, due within a year'
      - section: 'Sort them'
        say: 'Stock and cash at bank are current assets. Furniture is a fixed asset.'
        write: 'I, IV current assets.  II fixed asset'
      - say: 'Creditors and the bank overdraft are owed and must be paid soon, so they are current liabilities.'
        write: 'III, V current liabilities'
      - section: 'In Nigeria'
        say: 'A provisions shop in Onitsha owes its wholesaler three hundred thousand naira and has an overdraft at its bank. Both are due within the year.'
        write: 'Owes wholesaler + overdraft ⟹ current liabilities'
      - section: 'Remember'
        say: 'Remember, current liabilities are the bills due this year.'
        write: 'Bills due this year'
      - section: 'Answer'
        say: 'So the current liabilities are three and five, which is option A.'
        write: '$\therefore$ III and V'
        answer: true
    traps:
      B: 'You chose two and three. Creditors are right, but furniture is a fixed asset, not a liability.'
      C: 'You went for four and five. The overdraft is right, but cash at bank is an asset the business owns.'
      D: 'You picked one and two. Stock and furniture are both assets, so nothing there is owed.'
  15:
    moments:
      - section: 'The question'
        say: 'These are the same five items. Which two will turn into cash within the year?'
        write: 'I stock, II furniture, III creditors, IV cash at bank, V bank overdraft'
      - section: 'Name it'
        say: 'These are current assets, which are now listed in the statement of financial position.'
        write: 'Current assets'
      - section: 'The rule'
        say: 'Current assets are cash, or items that will become cash within a year, such as stock, debtors and cash at bank. Stock is now called inventory.'
        write: 'Current assets = cash or near cash within a year'
      - section: 'Sort them'
        say: 'Stock will be sold, and cash at bank is already cash. Both are current assets.'
        write: 'I stock, IV cash at bank ⟹ current'
      - say: 'Furniture is kept for years, so it is fixed. Creditors and the overdraft are liabilities.'
        write: 'II fixed.  III, V liabilities'
      - section: 'In Nigeria'
        say: 'A bakery in Ibadan holds flour in its store and money in its bank. The flour becomes bread and then cash within days.'
        write: 'Flour + money in bank = current assets'
      - section: 'Remember'
        say: 'Remember, current assets circulate. Stock becomes debtors, debtors become cash, and cash buys stock again.'
        write: 'Stock ⟶ debtors ⟶ cash ⟶ stock'
      - section: 'Answer'
        say: 'So the current assets are one and four, which is option D.'
        write: '$\therefore$ I and IV'
        answer: true
    traps:
      A: 'You chose three and five. Creditors and the overdraft are liabilities, not assets.'
      B: 'You went for two and one. Stock is current, but furniture is a fixed asset kept for use.'
      C: 'You picked four and five. Cash at bank is current, but the overdraft is a liability.'
