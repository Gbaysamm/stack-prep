        say: 'Remember, prime means first. The direct costs come first in the manufacturing account.'
        write: 'Prime = first'
      - section: 'Answer'
        say: 'So the directly traceable costs are the prime cost, which is option D.'
        write: '$\therefore$ prime cost'
        answer: true
