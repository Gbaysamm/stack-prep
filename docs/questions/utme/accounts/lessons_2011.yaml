  17:
    moments:
      - section: 'The question'
        say: 'Prices are falling. Which stock method shows the higher profit? Many students say F I F O, and here that is the trap.'
        write: 'Declining prices. Higher profit from ... ?'
      - section: 'Name it'
        say: 'These are the methods of stock valuation, and their effect on profit.'
        write: 'FIFO, LIFO, simple average, weighted average'
      - section: 'The rule'
        say: 'The lower the cost of sales, the higher the profit. So the method that charges the cheapest units to cost of sales gives the highest profit.'
        write: 'Lower cost of sales ⟹ higher profit'
      - section: 'Falling prices'
        say: 'When prices fall, the old stock is dear and the new stock is cheap.'
        write: 'Old units dear.  New units cheap'
      - section: 'The methods'
        say: 'L I F O, last in first out, issues the new cheap units, so cost of sales is lowest and profit highest. F I F O issues the old dear units, so profit is lowest.'
        write: 'LIFO ⟹ lowest cost ⟹ highest profit'
      - section: 'In Nigeria'
        say: 'A Kano grain dealer bought maize at fifty thousand naira a bag in January and forty thousand in March. A bag sold in April costs forty thousand under L I F O but fifty thousand under F I F O.'
        write: 'LIFO ₦40,000 vs FIFO ₦50,000 per bag'
      - section: 'Remember'
        say: 'Remember, when prices fall L I F O gives the lighter cost, and when prices rise F I F O does. L I F O is no longer allowed under I A S two, but its effect is still tested.'
        write: 'Falling prices ⟹ LIFO.  Rising prices ⟹ FIFO'
      - section: 'Answer'
        say: 'So in a period of declining prices, L I F O gives the higher profit, which is option C.'
        write: '$\therefore$ LIFO'
        answer: true
    traps:
      A: 'You chose F I F O. That gives the higher profit when prices rise. When prices fall it issues the dear old stock and gives the lowest profit.'
      B: 'You went for the simple average. It lies between F I F O and L I F O, so its profit is not the highest.'
      D: 'You picked the weighted average. It also lies between the two, so its profit is not the highest.'
  18:
    moments:
      - section: 'The question'
        say: 'The trading account has two sides. Which item sits on the credit side?'
        write: 'Credit side of the trading account = ?'
      - section: 'Name it'
        say: 'This is the trading account, the first part of the statement of profit or loss.'
        write: 'Trading account'
      - section: 'The rule'
        say: 'The debit side holds the cost of sales, which is opening stock, purchases and carriage inwards. The credit side holds sales, less returns inwards.'
        write: 'Dr: cost of sales.  Cr: sales'
      - section: 'Gross profit'
        say: 'Gross profit is the sales on the credit side less the cost of sales on the debit side.'
        write: 'Gross profit = sales − cost of sales'
      - section: 'In Nigeria'
        say: 'A shoe seller at Aba market sells two million naira of shoes in a year. That figure stands on the credit side of her trading account.'
        write: 'Sales ₦2,000,000 ⟶ Cr'
      - section: 'Remember'
        say: 'Remember, what comes in from customers is credited, and what goes into the goods is debited.'
        write: 'In from customers ⟶ Cr'
      - section: 'Answer'
        say: 'So the item on the credit side of the trading account is sales, which is option C.'
        write: '$\therefore$ sales'
        answer: true
    traps:
      A: 'You chose returns outwards. They are taken away from purchases on the debit side, not credited.'
      B: 'You went for carriage on sales. That is a selling expense in the profit and loss account.'
      D: 'You picked purchases. Purchases are part of the cost of sales, on the debit side.'
  19:
    moments:
      - section: 'The question'
        say: 'There are nine movements on a stock card. How many units are left at the end of July thirty? Watch the return on July seventeen.'
        write: 'Units on hand at July 30 = ?'
      - section: 'Name it'
        say: 'This is a stock record, a card that counts units in and out of the store.'
        write: 'Stock record card'
      - section: 'The rule'
        say: 'Units on hand equal opening units, plus purchases, minus returns to suppliers, minus sales.'
        write: 'On hand = opening + purchases − returns − sales'
      - section: 'Up to July 17'
        say: 'Start with one hundred. Add two hundred to get three hundred. Sell one hundred and sixty, leaving one hundred and forty. Return eighty, leaving sixty.'
        write: '100 + 200 = 300;  300 − 160 = 140;  140 − 80 = 60'
      - section: 'Up to July 20'
        say: 'Add two hundred to get two hundred and sixty. Sell one hundred and eighty, leaving eighty.'
        write: '60 + 200 = 260;  260 − 180 = 80'
      - section: 'Up to July 30'
        say: 'Add two hundred to get two hundred and eighty. Sell one hundred and twenty, leaving one hundred and sixty. Sell one hundred, leaving sixty.'
        write: '80 + 200 = 280;  280 − 120 = 160;  160 − 100 = 60'
      - section: 'Check'
        say: 'Units in are seven hundred. Units out are six hundred and forty. Seven hundred minus six hundred and forty is sixty.'
        write: 'In 700 − out 640 = 60 ✓'
      - section: 'Remember'
        say: 'Remember, goods returned to the supplier leave the store just like sales.'
        write: 'Returns outwards leave the store'
      - section: 'Answer'
        say: 'So sixty units are on hand at July thirty, which is option C.'
        write: '$\therefore$ 60 units'
        answer: true
    traps:
      A: 'You chose eighty. That is the balance after July twenty. Another purchase and two more sales come after it.'
      B: 'You went for one hundred. That is the opening stock, not what is left at the end.'
      D: 'You picked one hundred and sixty. That is the balance after July twenty nine, before the last sale of one hundred units.'
  20:
    moments:
