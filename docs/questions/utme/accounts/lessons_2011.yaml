  23:
    moments:
      - section: 'The question'
        say: 'The trader kept no full books. We know her sales and her gross profit margin. Can we find what her goods cost?'
        write: 'Sales ₦10,600, gross profit margin 20%. Cost of goods sold = ?'
      - section: 'Name it'
        say: 'This is finding a missing figure in incomplete records, using the gross profit margin.'
        write: 'Incomplete records, margin'
      - section: 'The rule'
        say: 'Margin is gross profit as a percentage of sales. So the cost of goods sold is the rest of the sales.'
        write: '$\text{Cost of goods sold} = \text{Sales} \times (100\% - \text{Margin})$'
      - section: 'Gross profit'
        say: 'Twenty per cent of ten thousand, six hundred naira is two thousand, one hundred and twenty naira.'
        write: '$0.20 \times 10{,}600 = 2{,}120$'
      - section: 'Cost of goods sold'
        say: 'Ten thousand, six hundred minus two thousand, one hundred and twenty is eight thousand, four hundred and eighty naira.'
        write: '₦10,600 − ₦2,120 = ₦8,480'
      - section: 'Check'
        say: 'Eighty per cent of ten thousand, six hundred naira is also eight thousand, four hundred and eighty naira.'
        write: '$0.80 \times 10{,}600 = 8{,}480$ ✓'
      - section: 'In Nigeria'
        say: 'A trader in Jos knows she sells at a margin of twenty per cent. From her sales alone she can tell what her goods cost her.'
        write: 'Jos trader, margin 20%'
      - section: 'Remember'
        say: 'Remember, margin is on the selling price, and mark up is on cost.'
        write: 'Margin on sales.  Mark-up on cost'
      - section: 'Answer'
        say: 'So the cost of goods sold is eight thousand, four hundred and eighty naira, which is option B.'
        write: '$\therefore$ ₦8,480'
        answer: true
    traps:
      A: 'You chose four thousand, eight hundred naira. That does not come from the data. Eighty per cent of the sales is eight thousand, four hundred and eighty naira.'
      C: 'You went for two thousand, three hundred and twenty naira. That is near the gross profit, which is the small part. The cost of sales is the large part.'
      D: 'You picked nine thousand, nine hundred naira. That is too large. The cost of sales is sales less twenty per cent of them.'
  24:
    moments:
      - section: 'The question'
        say: 'This is the same trader. Now we want her net profit. Two expenses come off, and one of them involves no cash at all.'
        write: 'Sales ₦10,600, margin 20%, rent ₦200, vehicle ₦5,000 at 10%. Net profit = ?'
      - section: 'Name it'
        say: 'This is net profit from incomplete records.'
        write: 'Net profit'
      - section: 'The rule'
        say: 'Net profit is gross profit less all the expenses, and depreciation is one of the expenses.'
        write: '$\text{Net profit} = \text{Gross profit} - \text{Expenses}$'
      - section: 'Gross profit'
        say: 'Twenty per cent of ten thousand, six hundred naira is two thousand, one hundred and twenty naira.'
        write: 'Gross profit = ₦2,120'
      - section: 'Depreciation'
        say: 'Ten per cent of the vehicle cost of five thousand naira is five hundred naira.'
        write: '$0.10 \times 5{,}000 = 500$'
      - section: 'Expenses'
        say: 'Rent two hundred plus depreciation five hundred gives seven hundred naira of expenses.'
        write: '₦200 + ₦500 = ₦700'
      - section: 'Net profit'
        say: 'Two thousand, one hundred and twenty minus seven hundred is one thousand, four hundred and twenty naira.'
        write: '₦2,120 − ₦700 = ₦1,420'
      - section: 'Check'
        say: 'Cost of sales eight thousand, four hundred and eighty, plus expenses seven hundred, plus profit one thousand, four hundred and twenty, gives back the sales of ten thousand, six hundred naira.'
        write: '₦8,480 + ₦700 + ₦1,420 = ₦10,600 ✓'
      - section: 'Remember'
        say: 'Remember, net profit is gross profit minus every expense, cash or not. Depreciation is the wear on the van, even though no cash leaves her purse.'
        write: 'Every expense, cash or not'
      - section: 'Answer'
        say: 'So the net profit is one thousand, four hundred and twenty naira, which is option C.'
        write: '$\therefore$ ₦1,420'
        answer: true
    traps:
      A: 'You chose one thousand, six hundred and twenty naira. That takes off depreciation but forgets the rent of two hundred naira.'
      B: 'You went for one thousand, nine hundred and twenty naira. That takes off the rent but forgets the depreciation of five hundred naira.'
      D: 'You picked two thousand, one hundred and twenty naira. That is the gross profit, before any expense comes off.'
  25:
    moments:
      - section: 'The question'
        say: 'A whole trading account is given, but we need only two figures from it. Which two?'
        write: 'Average stock for the period = ?'
      - section: 'Name it'
        say: 'This is average stock, the figure used to find the rate of stock turnover.'
        write: 'Average stock'
      - section: 'The rule'
        say: 'Average stock is opening stock plus closing stock, divided by two.'
        write: '$\text{Average stock} = \dfrac{\text{Opening stock} + \text{Closing stock}}{2}$'
      - section: 'Pick the figures'
        say: 'Opening stock is thirty two thousand naira and closing stock is nine thousand naira.'
        write: 'Opening ₦32,000.  Closing ₦9,000'
      - section: 'Add'
        say: 'Thirty two thousand plus nine thousand is forty one thousand naira.'
        write: '₦32,000 + ₦9,000 = ₦41,000'
      - section: 'Halve'
        say: 'Forty one thousand divided by two is twenty thousand, five hundred naira.'
        write: '$\dfrac{41{,}000}{2} = 20{,}500$'
      - section: 'Check'
        say: 'Twenty thousand, five hundred lies between nine thousand and thirty two thousand, as an average must.'
        write: '₦9,000 < ₦20,500 < ₦32,000 ✓'
      - section: 'Remember'
        say: 'Remember, average stock is the two ends, added and halved. A supermarket in Abuja uses it to see how often its shelves are refilled.'
        write: 'Two ends, added and halved'
      - section: 'Answer'
        say: 'So the average stock is twenty thousand, five hundred naira, which is option D.'
        write: '$\therefore$ ₦20,500'
        answer: true
    traps:
      A: 'You chose twenty seven thousand naira. That is not the average of thirty two thousand and nine thousand naira.'
      B: 'You went for twenty three thousand naira. That is opening stock minus closing stock. We add them and halve.'
      C: 'You picked twenty eight thousand naira. That is not the average of the opening and closing stock.'
