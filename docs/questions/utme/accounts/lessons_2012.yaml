        write: '$500{,}000 - 420{,}000 - 70{,}000 = 10{,}000$'
      - say: 'So ten thousand naira is missing, and head office can ask why. At cost price, it would not know what the sales should have been.'
        write: 'Shortage ₦10,000'
      - section: 'Answer'
