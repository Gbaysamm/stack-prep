  45:
    moments:
      - section: 'The question'
        say: 'We are given a list of balances, including debtors, prepaid and accrued expenses, creditors and stock. We must find the acid test ratio.'
        write: 'Acid test ratio $= ?$'
      - section: 'Name it'
        say: 'This is the acid test ratio, also called the quick ratio.'
        write: 'Acid test (quick) ratio'
      - section: 'The rule'
        say: 'Acid test ratio equals current assets minus stock, divided by current liabilities. Stock is left out because it is the hardest current asset to turn into cash.'
        write: '$\text{Acid test} = \dfrac{\text{Current assets} - \text{Stock}}{\text{Current liabilities}}$'
      - section: 'Quick assets'
        say: 'The current assets here are debtors, prepaid expenses and closing stock. Leaving out the stock, debtors twenty four thousand plus prepaid expenses seven hundred is twenty four thousand seven hundred naira.'
        write: '$24{,}000 + 700 = 24{,}700$'
      - section: 'Current liabilities'
        say: 'The current liabilities are what is owed soon. Creditors twelve thousand two hundred and fifty plus accrued expenses three hundred and fifty is twelve thousand six hundred naira.'
        write: '$12{,}250 + 350 = 12{,}600$'
      - section: 'Divide'
        say: 'Twenty four thousand seven hundred divided by twelve thousand six hundred is one point nine six.'
        write: '$\dfrac{24{,}700}{12{,}600} = 1.96$'
      - section: 'Answer'
        say: 'So the acid test ratio is one point nine six to one, which is option B.'
        write: '$\therefore$ 1.96 : 1'
        answer: true
    traps:
      A: 'You chose one point nine zero to one. That leaves out the prepaid expenses, which are a current asset.'
      C: 'You went for two point zero two to one. That leaves out the accrued expenses, which are a current liability.'
      D: 'You picked four point one seven to one. That keeps the stock in, so it is the current ratio.'
  46:
    moments:
      - section: 'The question'
        say: 'We are given the opening and closing stock and the purchases for the year. We must find how many times stock was turned over, to the nearest whole number.'
        write: 'Stock turnover $= ?$'
      - section: 'Name it'
        say: 'This is the rate of stock turnover.'
        write: 'Rate of stock turnover'
      - section: 'The rule'
        say: 'Stock turnover equals cost of sales divided by average stock. Both are at cost price.'
        write: '$\text{Stock turnover} = \dfrac{\text{Cost of sales}}{\text{Average stock}}$'
      - section: 'Cost of sales'
        say: 'Cost of sales is opening stock plus purchases minus closing stock. Twenty five thousand one hundred and twenty plus forty four thousand eight hundred and eighty, minus twenty seven thousand eight hundred and forty, is forty two thousand one hundred and sixty naira.'
        write: '$25{,}120 + 44{,}880 - 27{,}840 = 42{,}160$'
      - section: 'Average stock'
        say: 'Average stock is opening plus closing stock, divided by two. Twenty five thousand one hundred and twenty plus twenty seven thousand eight hundred and forty is fifty two thousand nine hundred and sixty, and half of that is twenty six thousand four hundred and eighty naira.'
        write: '$\dfrac{25{,}120 + 27{,}840}{2} = 26{,}480$'
      - section: 'Divide'
        say: 'Forty two thousand one hundred and sixty divided by twenty six thousand four hundred and eighty is about one point five nine.'
        write: '$\dfrac{42{,}160}{26{,}480} = 1.59$'
      - section: 'Round'
        say: 'The question asks for the nearest whole number. One point five nine is above one point five, so it rounds up to two.'
        write: '$1.59 \approx 2$'
      - section: 'Answer'
        say: 'So stock was turned over two times, which is option B.'
        write: '$\therefore$ 2 times'
        answer: true
    traps:
      A: 'You chose one. That cuts one point five nine down instead of rounding it to the nearest whole number.'
      C: 'You went for three. That divides sales by average stock, mixing selling price with cost.'
      D: 'You picked four. That is far too high, since cost of sales is less than twice the average stock.'
