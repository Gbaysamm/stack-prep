        write: 'Invoicing goods to branches'
      - section: 'The rule'
        say: 'At selling price, goods sent must equal sales plus closing stock at selling price. Any gap shows at once.'
        write: 'Goods sent = sales + closing stock (at selling price)'
      - section: 'Work it'
        say: 'For example, goods worth five hundred thousand naira at selling price are sent. The branch banks four hundred and twenty thousand and holds seventy thousand of stock.'
        write: 'Sent ₦500,000, banked ₦420,000, stock ₦70,000'
