# UTME 2012 Principles of Accounts, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Nigerian Accounts teacher works on the
# board: the question, the account, rule or concept named, the rule in plain words, the working
# (double entry, T account or calculation), and the answer moment that names the option.
#
#   say:     heard, not read. Money in words, abbreviations as words, no symbols the voice
#            would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2012.yaml. Answers match that file. Q1, the
# paper-type question, has no lesson.
format_version: 1
exam_year: 2012
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'We must name the concept on which an organization values its assets in the books.'
        write: 'Assets are valued on the basis of the ? concept'
      - section: 'Name it'
        say: 'This is the historical cost concept, also called the cost concept.'
        write: 'Historical cost concept'
      - section: 'The rule'
        say: 'Assets are recorded at what they cost when they were bought, not at what someone thinks they are worth today.'
        write: 'Asset in the books = price paid'
      - say: 'Each year a part of that cost is written off as depreciation, the share of the asset used up. So the books show cost less depreciation, never a new valuation.'
        write: 'Cost less depreciation, never a valuation'
      - section: 'How it works'
        say: 'A machine cost five hundred thousand naira. A valuer now says six hundred and fifty thousand. The books still show five hundred thousand naira.'
        write: 'Cost ₦500,000 stays, not the ₦650,000 valuation'
      - say: 'Cost is a fact on an invoice that anyone can check, while a valuation is an opinion. So the books keep the cost.'
        write: 'Cost = fact you can check'
      - section: 'Answer'
        say: 'So assets are valued on the historical cost concept, which is option A.'
        write: '$\therefore$ historical cost concept'
        answer: true
    traps:
      B: 'You chose the business entity concept. That one keeps the business separate from its owner. It does not tell us how to value assets.'
      C: 'You went for periodicity. That concept divides the business life into periods such as a year. It is not about valuing assets.'
      D: 'You picked materiality. That says small items need not be treated with full precision. It does not value assets.'
  3:
    moments:
      - section: 'The question'
        say: 'An accountant must care about more than record keeping. We must find what else he must care about.'
        write: 'Not only record keeping, but also ?'
      - section: 'Name it'
        say: 'This is about the qualities of an accountant.'
        write: 'Qualities of an accountant'
      - section: 'The rule'
        say: 'Posting entries, casting, which means adding up figures, and preparing the balance sheet are all part of record keeping itself.'
        write: 'Posting, casting, final accounts = record keeping'
      - say: 'Beyond them, an accountant must apply professional competence. That means the skill, knowledge and judgement the profession expects, kept up to date.'
        write: 'Professional competence = skill + knowledge + judgement'
      - section: 'Answer'
        say: 'So the accountant must also apply professional competence, which is option A.'
        write: '$\therefore$ the application of professional competence'
        answer: true
    traps:
      B: 'You chose the accuracy of postings. That matters, but it is part of record keeping itself, which the question has already named.'
      C: 'You went for casting, which means adding up. That is routine record keeping, not something beyond it.'
      D: 'You picked preparing the balance sheet. That is the end of the record keeping work, not a separate quality.'
  4:
    moments:
      - section: 'The question'
        say: 'Assets go up and capital goes up in the same transaction. We must find which is debited and which is credited.'
        write: 'Increase in assets and capital, debit ? credit ?'
      - section: 'Name it'
        say: 'This is the double entry rule for increases.'
        write: 'Double entry, rule for increases'
      - section: 'The rule'
        say: 'Debit an increase in assets or expenses, because they sit on the debit side.'
        write: 'Assets, expenses up = Dr'
      - say: 'Credit an increase in capital or liabilities, because they sit on the credit side.'
        write: 'Capital, liabilities up = Cr'
      - section: 'Work it'
        say: 'An owner pays one hundred thousand naira into the business. Cash, an asset, goes up, so we debit cash.'
        write: 'Dr Cash ₦100,000'
      - say: 'Capital goes up as well, so we credit capital with the same amount.'
        write: 'Cr Capital ₦100,000'
      - section: 'Remember'
        say: 'Remember dead, D E A D. Debits are expenses, assets and drawings.'
        write: 'DEAD = Debit Expenses, Assets, Drawings'
      - say: 'Then click, C L I C. Credits are liabilities, income and capital.'
        write: 'CLIC = Credit Liabilities, Income, Capital'
      - section: 'Answer'
        say: 'So we debit assets and credit capital, which is option C.'
        write: '$\therefore$ debit assets, credit capital'
        answer: true
    traps:
      A: 'You chose debit capital and credit liabilities. An increase in capital is a credit, not a debit.'
      B: 'You went for debit liabilities and credit assets. That is the wrong way round for both.'
      D: 'You picked debit capital and credit assets. That records a fall in both, such as the owner taking money out.'
  5:
    moments:
      - section: 'The question'
        say: 'We must find how the capital of a sole trader is increased in the books.'
        write: 'Capital is increased by ?'
      - section: 'Name it'
        say: 'This is the capital account, the owner''s claim on the business.'
        write: 'Capital account'
      - section: 'The rule'
        say: 'Capital is what the business owes its owner. So, like a liability, it increases on the credit side.'
        write: 'Capital up = credit'
      - section: 'Work it'
        say: 'The owner brings in more money. Cash rises, so cash is debited.'
        write: 'Dr Cash'
      - say: 'Capital rises, so capital is credited. That credit is the increase in capital.'
        write: 'Cr Capital'
      - section: 'Answer'
        say: 'So capital is increased by crediting the capital account, which is option B.'
        write: '$\therefore$ crediting the capital account'
        answer: true
    traps:
      A: 'You chose debiting the capital account. A debit to capital reduces it, as drawings do.'
      C: 'You went for debiting cash. Cash is debited in the same entry, but that records the money received, not the rise in capital.'
      D: 'You picked crediting cash. That means money has gone out, which does not raise capital.'
  6:
    moments:
      - section: 'The question'
        say: 'Akirika buys a motor van for his business and pays cash. We must find the double entry.'
        write: 'Motor van bought for cash, debit ?'
      - section: 'Name it'
        say: 'This is the purchase of a fixed asset for cash.'
        write: 'Fixed asset bought for cash'
      - section: 'The rule'
        say: 'Debit what comes into the business and credit what goes out.'
        write: 'Dr what comes in.  Cr what goes out.'
      - section: 'Work it'
        say: 'The motor van comes in, so we debit motor van account.'
        write: 'Dr Motor van'
      - say: 'Cash goes out, so we credit cash account. Akirika himself is not used, because the business is separate from its owner.'
        write: 'Cr Cash'
      - section: 'Answer'
        say: 'So we debit motor van and credit cash, which is option C.'
        write: '$\therefore$ debit motor van, credit cash'
        answer: true
    traps:
      A: 'You chose credit Akirika. He paid with the business cash, so cash is credited, not the owner.'
      B: 'You went for debit sales. Nothing was sold, so the sales account has no part here.'
      D: 'You picked debit cash and credit motor van. That is the wrong way round. It records selling the van.'
  7:
    moments:
      - section: 'The question'
        say: 'Ibrahim sells twelve thousand naira of sugar to Jide on credit. We must find the entry in Ibrahim''s books.'
        write: 'Ibrahim sells ₦12,000 sugar to Jide on credit'
      - section: 'Name it'
        say: 'This is a credit sale in the seller''s books.'
        write: 'Credit sale, seller''s books'
      - section: 'The rule'
        say: 'The customer who received the goods and now owes is debited, because he is a debtor.'
        write: 'Dr Debtor'
      - say: 'The sales account is credited, because the sale is income.'
        write: 'Cr Sales'
      - section: 'Work it'
        say: 'Jide owes Ibrahim twelve thousand naira, so Ibrahim debits Jide.'
        write: 'Dr Jide ₦12,000'
      - say: 'Goods sold go to the sales account, not a sugar account. So Ibrahim credits sales.'
        write: 'Cr Sales ₦12,000'
      - section: 'Answer'
        say: 'So Ibrahim debits Jide and credits sales, twelve thousand naira each, which is option B.'
        write: '$\therefore$ Dr Jide ₦12,000, Cr Sales ₦12,000'
        answer: true
    traps:
      A: 'You chose debit sugar account and credit Jide. Jide owes the money, so he is debited, and goods sold go to sales.'
      C: 'You went for debit Ibrahim. Ibrahim does not open an account for himself in his own books, and Jide, who owes, is debited, not credited.'
      D: 'You picked credit Ibrahim. These are his own books, and goods sold go to the sales account.'
  8:
    moments:
      - section: 'The question'
        say: 'Jide buys twelve thousand naira of sugar from Ibrahim on credit. We must find the entry in Jide''s books.'
        write: 'Jide buys ₦12,000 sugar from Ibrahim on credit'
      - section: 'Name it'
        say: 'In Jide''s books this is a credit purchase.'
        write: 'Credit purchase, buyer''s books'
      - section: 'The rule'
        say: 'Goods bought for resale are debited to purchases, not to an account named after the goods.'
        write: 'Dr Purchases'
      - say: 'The supplier who is owed is credited, because he is now a creditor.'
        write: 'Cr Creditor'
      - section: 'Work it'
        say: 'Jide debits purchases with twelve thousand naira.'
        write: 'Dr Purchases ₦12,000'
      - say: 'Jide owes Ibrahim, so he credits Ibrahim with twelve thousand naira.'
        write: 'Cr Ibrahim ₦12,000'
      - section: 'Answer'
        say: 'So Jide debits purchases and credits Ibrahim, which is option A.'
        write: '$\therefore$ Dr Purchases ₦12,000, Cr Ibrahim ₦12,000'
        answer: true
    traps:
      B: 'You chose credit sugar account. The person owed is Ibrahim, so his account is credited.'
      C: 'You went for debit Jide. Jide does not debit himself, and purchases is debited, not credited.'
      D: 'You picked debit Ibrahim. Ibrahim is owed money, so he is credited, not debited.'
  9:
    moments:
      - section: 'The question'
        say: 'We are given the bank columns of a cash book, with money paid in on the debit side and money paid out on the credit side. We must find the bank balance and its side.'
        write: 'Bank balance $= ?$'
      - section: 'Name it'
        say: 'This is balancing the bank columns of a cash book.'
        write: 'Balancing the cash book'
      - section: 'The rule'
        say: 'In the bank columns, money paid into the bank goes on the debit side, and money paid out goes on the credit side.'
        write: 'Dr = money in.  Cr = money out.'
      - say: 'So we add each side. The difference is the balance, and it comes down on the heavier side.'
        write: 'Balance = bigger total minus smaller total'
      - section: 'Debit side'
        say: 'Capital two thousand six hundred plus sales twenty eight thousand two hundred gives thirty thousand eight hundred naira.'
        write: '$2{,}600 + 28{,}200 = 30{,}800$'
      - section: 'Credit side'
        say: 'Purchases fifteen thousand plus rent one thousand two hundred and fifty plus motor vehicle seven thousand six hundred gives twenty three thousand eight hundred and fifty naira.'
        write: '$15{,}000 + 1{,}250 + 7{,}600 = 23{,}850$'
      - section: 'Balance'
        say: 'Thirty thousand eight hundred minus twenty three thousand eight hundred and fifty is six thousand nine hundred and fifty naira.'
        write: '$30{,}800 - 23{,}850 = 6{,}950$'
      - say: 'The debit side is heavier, so the balance brought down, written b slash d, is a debit. That is money in the bank. A credit balance would mean an overdraft.'
        write: 'Balance b/d ₦6,950 Dr'
      - section: 'Answer'
        say: 'So the bank balance is six thousand nine hundred and fifty naira debit, which is option B.'
        write: '$\therefore$ ₦6,950 debit'
        answer: true
    traps:
      A: 'You chose six thousand nine hundred and fifty naira credit. The amount is right, but more came in than went out, so it is a debit.'
      C: 'You went for six thousand naira credit. The difference between the sides is six thousand nine hundred and fifty, and it is a debit.'
      D: 'You picked six thousand naira debit. The side is right, but the difference is six thousand nine hundred and fifty naira.'
  10:
    moments:
      - section: 'The question'
        say: 'A cheque received from a customer is dishonoured. We must find the column and the side it goes on in a three column cash book.'
        write: 'Dishonoured cheque, which column and side?'
      - section: 'Name it'
        say: 'This is a dishonoured cheque, one the bank refuses to pay.'
        write: 'Dishonoured cheque'
      - say: 'A three column cash book has a discount column, a cash column for notes and coins, and a bank column for money in the bank, on each side.'
        write: 'Three columns = discount, cash, bank'
      - section: 'The rule'
        say: 'When the cheque came in, we debited the bank column. When it bounces, we reverse that debit.'
        write: 'Received = Dr bank.  Dishonoured = reverse it.'
      - section: 'Work it'
        say: 'So we credit the bank column of the cash book.'
        write: 'Cr Cash book, bank column'
      - say: 'And we debit the customer again, because he owes us once more.'
        write: 'Dr Customer'
      - section: 'Answer'
        say: 'So a dishonoured cheque is shown in the bank column, credit side, which is option B.'
        write: '$\therefore$ bank column (credit)'
        answer: true
    traps:
      A: 'You chose bank column debit. That is where the cheque went when it was received. The dishonour reverses it.'
      C: 'You went for the cash column. A cheque passes through the bank column, not the cash column.'
      D: 'You picked cash column credit. The cash column is for notes and coins, and a cheque goes through the bank column.'
  11:
    moments:
      - section: 'The question'
        say: 'A sales day book takes five per cent off its total of eight thousand eight hundred naira. We must name that kind of discount.'
        write: 'Day book total ₦8,800, less 5% discount'
      - section: 'Name it'
        say: 'This is trade discount.'
        write: 'Trade discount'
      - section: 'The rule'
        say: 'Trade discount is taken off the list price for traders who buy to resell. It is deducted on the invoice, and so in the day book, the book that lists the invoices.'
        write: 'Trade discount = off the list price, in the day book'
      - say: 'A cash discount is different. It is given for paying quickly, so it is recorded in the cash book when the money is paid.'
        write: 'Cash discount = for quick payment, in the cash book'
      - section: 'Work it'
        say: 'Five per cent of eight thousand eight hundred is four hundred and forty naira.'
        write: '$0.05 \times 8{,}800 = 440$'
      - say: 'Eight thousand eight hundred minus four hundred and forty leaves eight thousand three hundred and sixty naira. Only that net figure is posted, because the trade discount never goes into the ledger.'
        write: '$8{,}800 - 440 = 8{,}360$ posted to sales'
      - section: 'Answer'
        say: 'So the five per cent discount in the day book is a trade discount, which is option A.'
        write: '$\therefore$ trade discount'
        answer: true
    traps:
      B: 'You chose cash discount. That is for paying quickly, and it is recorded in the cash book, not the day book.'
      C: 'You went for discount allowed. That is a cash discount given to debtors, and it is recorded in the cash book.'
      D: 'You picked discount received. That is a cash discount from suppliers, recorded in the cash book.'
  12:
    moments:
      - section: 'The question'
        say: 'We must find what a customer uses to draw cash from his own bank account.'
        write: 'Cash can be drawn from the bank using ?'
      - section: 'Name it'
        say: 'This is about the instruments of bank transactions.'
        write: 'Instruments of bank transactions'
      - section: 'The rule'
        say: 'An A T M card is linked to your own account. Put it in the machine with your PIN, and cash comes out of that account.'
        write: 'ATM card + PIN ⇒ cash from your account'
      - section: 'The others'
        say: 'In Nigeria a bank teller is the slip for paying money in.'
        write: 'Teller = pay in'
      - say: 'A credit card is mainly for buying on credit, with money the bank lends.'
        write: 'Credit card = buy on credit'
      - say: 'And a recharge card buys phone airtime. It has nothing to do with a bank account.'
        write: 'Recharge card = airtime'
      - section: 'Answer'
        say: 'So cash is drawn from the bank using an A T M card, which is option D.'
        write: '$\therefore$ an ATM card'
        answer: true
    traps:
      A: 'You chose a bank teller. In Nigeria the teller is the slip for paying money in, the opposite of drawing it out.'
      B: 'You went for a credit card. It is mainly for buying on credit, not for drawing your own deposit.'
      C: 'You picked a recharge card. That buys phone airtime and has nothing to do with a bank account.'
  13:
    moments:
      - section: 'The question'
        say: 'We must find the condition under which a bank transfer cannot be made.'
        write: 'A transfer cannot be made where the transferor ?'
      - section: 'Name it'
        say: 'This is an electronic funds transfer in modern banking.'
        write: 'Electronic funds transfer'
      - section: 'The rule'
        say: 'A transfer moves money from the payer''s account to the payee''s account. The bank can only move money that is there.'
        write: 'Transfer ≤ balance in the payer''s account'
      - section: 'Work it'
        say: 'Ada has five thousand naira in her account and tries to send twenty thousand naira. The bank declines it for insufficient funds.'
        write: '₦5,000 balance, ₦20,000 transfer ⇒ declined'
      - section: 'The others'
        say: 'Where the payer lives, which bank the payee uses, and whether the payer holds cash notes do not matter. Transfers between different banks go through every day.'
        write: 'Different banks are fine, empty accounts are not'
      - section: 'Answer'
        say: 'So a transfer cannot be made where the transferor does not have sufficient funds, which is option A.'
        write: '$\therefore$ does not have sufficient funds in his account'
        answer: true
    traps:
      B: 'You chose no account with the beneficiary bank. Transfers between different banks go through every day.'
      C: 'You went for living abroad. People outside Nigeria can still transfer from their Nigerian accounts.'
      D: 'You picked not holding the local currency. A transfer moves a bank balance, so cash notes are not needed.'
  14:
    moments:
      - section: 'The question'
        say: 'We are given a debit cash book balance of five thousand naira, a dishonoured cheque, a direct credit and a direct debit. We must find the adjusted cash book balance.'
        write: 'Adjusted cash book balance $= ?$'
      - section: 'Name it'
        say: 'This is the adjusted cash book, written before the bank reconciliation statement.'
        write: 'Adjusted cash book'
      - section: 'The rule'
        say: 'A direct credit is money paid straight into our account, such as interest. It increases the balance.'
        write: 'Direct credit = add'
      - say: 'A dishonoured cheque is one we paid in that bounced, so we never got that money. It reduces the balance.'
        write: 'Dishonoured cheque = subtract'
      - say: 'A direct debit is money the bank paid out of our account, such as charges. It reduces the balance too.'
        write: 'Direct debit = subtract'
      - section: 'Work it'
        say: 'Start with five thousand naira. Take away the dishonoured cheque of one thousand, leaving four thousand.'
        write: '$5{,}000 - 1{,}000 = 4{,}000$'
      - say: 'Add the direct credit of eight hundred, giving four thousand eight hundred.'
        write: '$4{,}000 + 800 = 4{,}800$'
      - say: 'Take away the direct debit of five hundred, leaving four thousand three hundred naira.'
        write: '$4{,}800 - 500 = 4{,}300$'
      - section: 'Answer'
        say: 'So the adjusted cash book balance is four thousand three hundred naira, which is option B.'
        write: '$\therefore$ ₦4,300'
        answer: true
    traps:
      A: 'You chose six thousand three hundred naira. That adds the dishonoured cheque, but a bounced cheque is money the business never got.'
      C: 'You went for three thousand seven hundred naira. That takes away the direct credit and adds the direct debit, the wrong way round.'
      D: 'You picked two thousand seven hundred naira. That takes away the direct credit, but money the bank received for you adds to the balance.'
  15:
    moments:
      - section: 'The question'
        say: 'We are given net sales of three hundred and seventy thousand naira, the stocks, the purchases and the rent. We must find the gross profit.'
        write: 'Gross profit $= ?$'
      - section: 'Name it'
        say: 'This is gross profit, from the trading account, now part of the statement of profit or loss.'
        write: 'Gross profit (trading account)'
      - section: 'The rule'
        say: 'Gross profit equals net sales minus cost of goods sold.'
        write: '$\text{Gross profit} = \text{Net sales} - \text{Cost of goods sold}$'
      - section: 'Cost of goods sold'
        say: 'First, the goods available. Opening stock twenty thousand plus purchases two hundred and fifty thousand gives two hundred and seventy thousand naira.'
        write: '$20{,}000 + 250{,}000 = 270{,}000$'
      - say: 'The closing stock of forty thousand was not sold, so we take it away. That leaves a cost of goods sold of two hundred and thirty thousand naira.'
        write: '$270{,}000 - 40{,}000 = 230{,}000$'
      - section: 'Gross profit'
        say: 'Now net sales minus cost of goods sold. Three hundred and seventy thousand minus two hundred and thirty thousand is one hundred and forty thousand naira. Rent is not used, because rent is an expense and gross profit comes before expenses.'
        write: '$370{,}000 - 230{,}000 = 140{,}000$'
      - section: 'Answer'
        say: 'So the gross profit is one hundred and forty thousand naira, which is option D.'
        write: '$\therefore$ Gross profit $=$ ₦140,000'
        answer: true
    traps:
      A: 'You chose three hundred and seventy thousand naira. That is net sales. The cost of goods sold must come off.'
      B: 'You went for two hundred and thirty thousand naira. That is the cost of goods sold, one step short.'
      C: 'You picked one hundred and fifty thousand naira. Three hundred and seventy thousand minus two hundred and thirty thousand is one hundred and forty thousand.'
  16:
    moments:
      - section: 'The question'
        say: 'We are given the same trading figures and rent of thirty five thousand naira. We must find the net profit.'
        write: 'Net profit $= ?$'
      - section: 'Name it'
        say: 'This is net profit, from the profit and loss account.'
        write: 'Net profit'
      - section: 'The rule'
        say: 'Net profit equals gross profit minus expenses.'
        write: '$\text{Net profit} = \text{Gross profit} - \text{Expenses}$'
      - section: 'Gross profit'
        say: 'First we need gross profit. The table gives net sales of three hundred and seventy thousand and cost of goods sold of two hundred and thirty thousand. The difference is one hundred and forty thousand naira.'
        write: '$370{,}000 - 230{,}000 = 140{,}000$'
      - section: 'Net profit'
        say: 'The only expense is rent of thirty five thousand naira. One hundred and forty thousand minus thirty five thousand is one hundred and five thousand naira.'
        write: '$140{,}000 - 35{,}000 = 105{,}000$'
      - section: 'Answer'
        say: 'So the net profit is one hundred and five thousand naira, which is option C.'
        write: '$\therefore$ Net profit $=$ ₦105,000'
        answer: true
    traps:
      A: 'You chose thirty five thousand naira. That is the rent itself, not the profit.'
      B: 'You went for forty thousand naira. That is the closing stock, not a profit.'
      D: 'You picked one hundred and fifteen thousand naira. The gross profit is one hundred and forty thousand, and taking away rent of thirty five thousand leaves one hundred and five thousand.'
  17:
    moments:
      - section: 'The question'
        say: 'A profit of one hundred and eighty thousand naira was found with two errors. Revenue of fifteen thousand was recorded as an expense, and an expense of four thousand was recorded as revenue. We must find the adjusted net profit.'
        write: 'Profit ₦180,000, two errors, adjusted profit $= ?$'
      - section: 'Name it'
        say: 'These are errors that affect profit.'
        write: 'Errors affecting profit'
      - section: 'The rule'
        say: 'An item on the wrong side moves profit by twice its amount, once for being left out of its own side and once for being put on the other side.'
        write: 'Wrong side ⇒ effect $= 2 \times$ amount'
      - section: 'Revenue error'
        say: 'Revenue of fifteen thousand was shown as an expense. It was taken away when it should have been added, so profit is too low by two times fifteen thousand, which is thirty thousand naira. So we add thirty thousand.'
        write: '$2 \times 15{,}000 = 30{,}000$, add'
      - section: 'Expense error'
        say: 'An expense of four thousand was shown as revenue. It was added when it should have been taken away, so profit is too high by two times four thousand, which is eight thousand naira. So we take away eight thousand.'
        write: '$2 \times 4{,}000 = 8{,}000$, subtract'
      - section: 'Adjusted profit'
        say: 'Now we correct the profit shown. One hundred and eighty thousand plus thirty thousand minus eight thousand is two hundred and two thousand naira.'
        write: '$180{,}000 + 30{,}000 - 8{,}000 = 202{,}000$'
      - section: 'Answer'
        say: 'So the adjusted net profit is two hundred and two thousand naira, which is option B.'
        write: '$\therefore$ ₦202,000'
        answer: true
    traps:
      A: 'You chose two hundred and ten thousand naira. You fixed the revenue error but forgot to take away eight thousand for the expense error.'
      C: 'You went for one hundred and ninety five thousand naira. That adds fifteen thousand only once and ignores the expense error.'
      D: 'You picked one hundred and eighty four thousand naira. That just adds four thousand and does not follow either error through.'
  18:
    moments:
      - section: 'The question'
        say: 'Revenue of fifteen thousand naira was recorded as an expense. We must find by how much profit must be increased to put this right.'
        write: 'Revenue ₦15,000 recorded as an expense'
      - section: 'Name it'
        say: 'This is putting right an error that affects profit.'
        write: 'Putting right a profit error'
      - section: 'The rule'
        say: 'Two things went wrong. The amount was charged as an expense, so fifteen thousand was taken off profit.'
        write: 'Charged as expense ⇒ profit down ₦15,000'
      - say: 'And it was left out of revenue, so another fifteen thousand that should have been added was not.'
        write: 'Left out of revenue ⇒ profit down another ₦15,000'
      - section: 'Work it'
        say: 'Removing the false expense adds fifteen thousand naira back to profit.'
        write: 'Remove expense: $+15{,}000$'
      - say: 'Putting it into revenue adds another fifteen thousand naira.'
