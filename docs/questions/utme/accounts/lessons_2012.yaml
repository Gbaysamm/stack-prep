  37:
    moments:
      - section: 'The question'
        say: 'Modibbo put in sixty thousand naira and Jakata ninety thousand, and they share profit in the ratio of their capitals. We must find Modibbo''s share of a profit of one hundred and twenty thousand naira.'
        write: 'Modibbo ₦60,000, Jakata ₦90,000, profit ₦120,000'
      - section: 'Name it'
        say: 'This is sharing profit in the capital ratio, in the appropriation account.'
        write: 'Appropriation in capital ratio'
      - section: 'The rule'
        say: 'A partner''s share equals his capital over total capital, times the profit.'
        write: 'Share $= \dfrac{\text{his capital}}{\text{total capital}} \times \text{profit}$'
      - section: 'The ratio'
        say: 'Dividing both capitals by thirty thousand, sixty thousand to ninety thousand reduces to two to three. Two plus three is five parts.'
        write: '$60{,}000 : 90{,}000 = 2 : 3$, total 5 parts'
      - section: 'Modibbo'
        say: 'Modibbo has two of the five parts, so he gets two fifths. Two fifths of one hundred and twenty thousand is forty eight thousand naira.'
        write: '$\dfrac{2}{5} \times 120{,}000 = 48{,}000$'
      - section: 'Answer'
        say: 'So Modibbo gets forty eight thousand naira, which is option B.'
        write: '$\therefore$ ₦48,000'
        answer: true
    traps:
      A: 'You chose sixty two thousand naira. That is more than half the profit, but Modibbo has the smaller capital.'
      C: 'You went for forty four thousand naira. Two fifths of one hundred and twenty thousand is forty eight thousand.'
      D: 'You picked forty three thousand naira. Two fifths of one hundred and twenty thousand is forty eight thousand.'
