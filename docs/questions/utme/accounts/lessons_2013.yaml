# UTME 2013 Principles of Accounts, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Nigerian Accounts teacher works on the
# board: the question, the account, rule or concept named, the rule in plain words, the double
# entry or the calculation (data, formula, working, check), a Nigerian example, a way to
# remember it, and the answer moment that names the option.
#
#   say:     heard, not read. Abbreviations as letters or words, money in words, percentages
#            as "per cent", no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2013.yaml. Answers match that file. Q1, the
# paper-type question, has no lesson.
format_version: 1
exam_year: 2013
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'We must say what accounting information mainly seeks to provide.'
        write: 'Accounting information seeks to provide ?'
      - section: 'The rule'
        say: 'The first aim of book keeping and accounting is a permanent, orderly record of every transaction, so that nothing depends on memory.'
        write: 'Aim 1 = a permanent record of every transaction'
      - section: 'How it works'
        say: 'Every sale, purchase, payment and receipt is first written in a book of original entry. It is then posted to the ledger, checked in a trial balance and summed up in the final accounts.'
        write: 'Book of original entry ⟶ ledger ⟶ trial balance ⟶ final accounts'
      - say: 'From that permanent record, the owner and other users can later find the profit, the assets and the debts. Without the record, none of these can be found.'
        write: 'Record first, then profit, assets, debts'
      - section: 'Answer'
        say: 'So accounting information seeks to provide permanent records of all transactions, which is option A.'
        write: '$\therefore$ permanent records of all transactions'
        answer: true
    traps:
      B: 'You chose analysis of accounts to trade debtors. Accounts are analysed for the owner and other users of the information, not prepared for debtors.'
      C: 'You went for audited reports. Only companies must be audited, and an audit checks records that must already exist. The record comes first.'
      D: 'You picked data about employees. That is personnel information, not the main aim of accounting.'
  3:
    moments:
      - section: 'The question'
        say: 'We are told that the debit side total of an account is greater than its credit side total. We must say what that means.'
        write: 'Debit total greater than credit total ⟹ ?'
      - section: 'The rule'
        say: 'To balance an account, we add both sides and find the difference. That difference is the balance, and it takes the name of the bigger side.'
        write: 'Bigger debit side ⟹ debit balance'
      - section: 'Work it'
        say: 'For example, in the books of a pharmacy, Mister Ade''s account shows sales to him of eight thousand naira on the debit side, and cash he paid of five thousand naira on the credit side.'
        write: '$\begin{array}{|l|r||l|r|}\hline \text{Dr} & \text{₦} & \text{Cr} & \text{₦} \\ \hline \text{Sales} & 8{,}000 & \text{Cash} & 5{,}000 \\ \hline\end{array}$'
      - say: 'The debit side is bigger, so we take the smaller side from it. Eight thousand minus five thousand is three thousand naira.'
        write: '$8{,}000 - 5{,}000 = 3{,}000$'
      - say: 'We write the three thousand on the smaller credit side as balance carried down, so both sides now total eight thousand naira.'
        write: 'Balance c/d ₦3,000 on the credit side, both sides ₦8,000'
      - say: 'Then we bring the three thousand down on the debit side as balance brought down. So the account has a debit balance, here the money Mister Ade still owes.'
        write: 'Balance b/d ₦3,000 on the debit side'
      - section: 'Answer'
        say: 'So the account has a debit balance, which is option C.'
        write: '$\therefore$ a debit balance'
        answer: true
    traps:
      A: 'You chose overdrawn. Only a bank account can be overdrawn, and in the cash book that shows as a credit balance.'
      B: 'You went for understated. An account is understated only when an amount has been left out. A bigger debit side simply gives a debit balance.'
      D: 'You picked a credit balance. That comes when the credit side is the bigger one.'
  4:
    moments:
      - section: 'The question'
        say: 'On July the first, the owner starts the business with ten thousand five hundred naira in cash. We must find the double entry.'
        write: 'July 1, started business with ₦10,500 cash'
      - section: 'The rule'
        say: 'Debit the account that receives value, and credit the account that gives value.'
        write: 'Debit the receiver, credit the giver'
      - section: 'Double entry'
        say: 'The cash account receives the money, so we debit cash.'
        write: 'Dr Cash ₦10,500'
      - say: 'The owner gives the value, and his capital account shows what the business now owes him, so we credit capital.'
        write: 'Cr Capital ₦10,500'
      - say: 'The same result comes from the other rule. Assets increase on the debit side, and capital increases on the credit side. Cash, an asset, goes up, and capital goes up.'
        write: 'Assets up ⟹ debit.  Capital up ⟹ credit.'
      - section: 'Answer'
        say: 'So we debit cash and credit capital, which is option C.'
        write: '$\therefore$ Dr Cash, Cr Capital'
        answer: true
    traps:
      A: 'You chose debit capital and credit cash. That turns the entry round, as if cash left the business.'
      B: 'You went for credit cash and debit bank. No bank was involved, because the owner brought in cash.'
      D: 'You picked debit purchases. Nothing was bought here. The owner brought in capital.'
  5:
    moments:
      - section: 'The question'
        say: 'On July thirty one, the business pays Agromachinex six thousand naira in cash, the amount it owed them. We must find the double entry.'
        write: 'July 31, paid Agromachinex ₦6,000 cash'
      - section: 'The rule'
        say: 'Debit the account that receives value, and credit the account that gives value.'
        write: 'Debit the receiver, credit the giver'
      - section: 'Double entry'
        say: 'Agromachinex receives the money, so we debit Agromachinex six thousand naira. That clears the debt the business owed them.'
        write: 'Dr Agromachinex ₦6,000'
      - say: 'Cash gives the money, so we credit cash six thousand naira.'
        write: 'Cr Cash ₦6,000'
      - section: 'Answer'
        say: 'So we debit Agromachinex and credit cash, which is option A.'
        write: '$\therefore$ Dr Agromachinex, Cr Cash'
        answer: true
    traps:
      B: 'You chose debit equipment and credit Agromachinex. That is the entry for first buying equipment on credit, not for paying the debt.'
      C: 'You went for credit capital and debit cash. That is the entry for the owner bringing in money.'
      D: 'You picked debit purchases. The payment settles an old debt, and nothing new was bought.'
  6:
    moments:
      - section: 'The question'
        say: 'We must find the book from which the total credit sales for a period can be taken.'
        write: 'Total credit sales come from ?'
      - section: 'The rule'
        say: 'Credit sales are first written in the sales day book, one of the books of original entry, from the sales invoices. Cash sales go to the cash book instead.'
        write: 'Credit sales ⟶ sales day book.  Cash sales ⟶ cash book.'
      - section: 'How it works'
        say: 'At the end of the period the sales day book is added up. That total is the credit sales for the period, and it is credited to sales account.'
        write: 'Total of sales day book = credit sales'
      - section: 'Answer'
        say: 'So the total credit sales come from the sales day book, which is option B.'
        write: '$\therefore$ sales day book'
        answer: true
    traps:
      A: 'You chose the cash book. It records money received or paid, so it holds cash sales, not credit sales.'
      C: 'You went for the petty cash book. That records small expenses paid in cash.'
      D: 'You picked the returns inwards book. That records goods sent back by customers.'
  7:
    moments:
      - section: 'The question'
        say: 'We must find the main source document an employer uses to calculate the wages of employees.'
        write: 'Source document for wages = ?'
      - section: 'The rule'
        say: 'A source document is the paper from which an entry is made. Wages are paid for time worked, so the employer needs a record of the hours, such as a clock card or a time sheet.'
        write: 'Wages ⟸ record of hours worked'
      - section: 'Work it'
        say: 'Gross wages equal hours worked times the rate per hour.'
        write: '$\text{Wages} = \text{Hours} \times \text{Rate per hour}$'
      - say: 'For example, forty five hours at five hundred naira an hour gives forty five times five hundred, which is twenty two thousand five hundred naira. Without the hours, this cannot be worked out.'
        write: '$45 \times 500 = 22{,}500$'
      - section: 'Answer'
        say: 'So the major source document is the record of the number of hours worked, which is option B.'
        write: '$\therefore$ record of the number of hours worked'
        answer: true
    traps:
      A: 'You chose the nominal roll. It lists the staff, but it gives no hours, so it cannot fix wages.'
      C: 'You went for the effort of the employee. Effort is not a document, and it cannot be measured in naira.'
      D: 'You picked the number of dependants. That does not decide how much a worker earns.'
  8:
    moments:
      - section: 'The question'
        say: 'We must pick the item that is capital expenditure.'
        write: 'Which is capital expenditure?'
      - section: 'The rule'
        say: 'Capital expenditure buys or adds to a fixed asset used for more than a year. Revenue expenditure is the day to day cost of running the business.'
        write: 'Capital = fixed asset.  Revenue = running cost.'
      - section: 'Sort them'
        say: 'Office machinery will serve for years, so buying it adds a fixed asset to the balance sheet.'
        write: 'Office machinery ⟶ fixed asset'
      - say: 'Maintenance only keeps an old machine working. It adds nothing new, so it is revenue expenditure.'
        write: 'Maintenance ⟶ revenue'
      - say: 'Stationery is used up within weeks, so it is revenue expenditure too.'
        write: 'Stationery ⟶ revenue'
      - say: 'Carriage inwards is the cost of bringing in goods for resale, so it is also revenue expenditure.'
        write: 'Carriage inwards ⟶ revenue'
      - section: 'Answer'
        say: 'So the capital expenditure is the purchase of office machinery, which is option D.'
        write: '$\therefore$ purchase of office machinery'
        answer: true
    traps:
      A: 'You chose maintenance of office machine. It has the word machine, but it only keeps an old asset working, so it is revenue.'
      B: 'You went for stationery. It is used up quickly, so it is revenue expenditure.'
      C: 'You picked carriage inwards. It is part of the cost of goods bought for resale, a revenue item.'
  9:
    moments:
      - section: 'The question'
        say: 'A personal account, the account of a person such as a customer, appears on the debit side of the cash book. We must find the corresponding entry.'
        write: 'Personal account on the debit side of the cash book ⟹ other entry ?'
      - section: 'The rule'
        say: 'The cash book is itself a ledger account. Every debit in it needs a matching credit in another ledger account.'
        write: 'Debit in cash book ⟹ credit in the ledger'
      - section: 'Double entry'
        say: 'For example, a customer, Bisi, pays four thousand naira. The money comes in, so we debit the cash book four thousand naira.'
        write: 'Dr Cash book ₦4,000'
      - say: 'Bisi gives the money, so we credit Bisi''s personal account four thousand naira. It is kept in the sales ledger, the ledger that holds the customers'' accounts.'
        write: 'Cr Bisi (sales ledger) ₦4,000'
      - section: 'Answer'
        say: 'So the corresponding entry is to credit the ledger, which is option C.'
        write: '$\therefore$ credit the ledger'
        answer: true
    traps:
      A: 'You chose credit real accounts. Real accounts are for property such as buildings and machinery. Money from a person is credited to that person''s account in the ledger.'
      B: 'You went for debit real accounts. A debit in the cash book needs a credit somewhere, not another debit.'
      D: 'You picked debit the ledger. That would give two debits and no credit.'
  10:
    moments:
      - section: 'The question'
        say: 'Alaka owed Saka fifteen thousand naira and paid after taking off a cash discount of ten per cent. We must record the discount in the books of Saka.'
        write: 'Alaka owes Saka ₦15,000, cash discount 10%'
      - section: 'Name it'
        say: 'Saka gives the discount, so in his books it is discount allowed. Alaka, who gets it, calls it discount received in his own books.'
        write: 'Discount allowed (in Saka''s books)'
      - section: 'The rule'
        say: 'Discount allowed is an expense to Saka, so it is debited. Alaka now owes less, so Alaka''s account is credited.'
        write: 'Dr Discount allowed, Cr Alaka'
      - section: 'Work it'
        say: 'Ten per cent of fifteen thousand naira is one thousand five hundred naira.'
        write: '$10\% \times 15{,}000 = 1{,}500$'
      - say: 'So Alaka pays fifteen thousand minus one thousand five hundred, which is thirteen thousand five hundred naira in cash. The cash and the discount together clear his debt.'
        write: '$15{,}000 - 1{,}500 = 13{,}500$ cash received'
      - section: 'Answer'
        say: 'So Saka debits discount allowed account and credits Alaka''s account, which is option D.'
        write: '$\therefore$ Dr Discount allowed, Cr Alaka'
        answer: true
    traps:
      A: 'You chose debit discount received. Discount received is the name in Alaka''s books. In Saka''s books the discount is allowed.'
      B: 'You went for debit Alaka, credit discount received. That turns the entry round and uses the buyer''s account name.'
      C: 'You picked Saka''s account. Saka does not keep an account for himself in his own ledger.'
  11:
    moments:
      - section: 'The question'
        say: 'We are given four statements about the imprest system of petty cash, and we must find which of them are correct.'
        write: 'Imprest system, which statements are true?'
      - section: 'The rule'
        say: 'The petty cashier gets a fixed sum at the start, called the float or imprest. At the end of each period, she is paid back exactly what she spent, so the float is full again.'
        write: 'Fixed float at start, reimburse what was spent'
      - section: 'Work it'
        say: 'For example, take a float of twenty thousand naira. If thirteen thousand five hundred naira is spent, she holds twenty thousand minus thirteen thousand five hundred, which is six thousand five hundred naira.'
        write: '$20{,}000 - 13{,}500 = 6{,}500$ left'
      - say: 'She is given thirteen thousand five hundred naira, the amount spent, and the float is twenty thousand naira again.'
        write: '$6{,}500 + 13{,}500 = 20{,}000$'
      - section: 'Test each one'
        say: 'Statement one is false. Each firm picks its own float, so the amount differs from one organization to another.'
        write: 'I ✗  the float differs from firm to firm'
      - say: 'Statement two is false. The fixed sum comes at the start. At the end she gets only what was spent, and that changes with spending.'
        write: 'II ✗  the sum at the end changes'
      - say: 'Statement three is true, because she is reimbursed exactly what was spent, as we just saw.'
        write: 'III ✓  reimbursed what was spent'
      - say: 'Statement four is true, because the fixed float and the vouchers for each payment keep control of petty cash.'
        write: 'IV ✓  a measure of control'
      - section: 'Answer'
        say: 'So the true statements are three and four, which is option D.'
        write: '$\therefore$ III and IV'
        answer: true
    traps:
      A: 'You chose one, two and three. Firms choose different floats, and the sum at the end is what was spent, so one and two are false.'
      B: 'You went for one, three and four. Statement one is false, because the imprest differs from firm to firm.'
      C: 'You picked two and four. Statement two sounds right, but the fixed sum is given at the start. At the end of the period the cashier gets only what was spent, and that changes.'
  12:
    moments:
      - section: 'The question'
        say: 'A machine costs thirty five thousand naira, lasts five years and has a scrap value of nine thousand naira. We must find the yearly depreciation by the straight line method.'
        write: 'Cost ₦35,000, life 5 years, scrap ₦9,000'
      - section: 'The rule'
        say: 'The straight line method charges the same amount every year. Yearly depreciation equals cost minus scrap value, divided by the useful life.'
        write: '$\text{Depreciation} = \dfrac{\text{Cost} - \text{Scrap value}}{\text{Useful life}}$'
      - section: 'Work it'
        say: 'First we take the scrap value from the cost, because the machine will be sold for that at the end. Thirty five thousand minus nine thousand is twenty six thousand naira to be written off.'
        write: '$35{,}000 - 9{,}000 = 26{,}000$'
      - say: 'Then we share it over the five years. Twenty six thousand divided by five is five thousand two hundred naira a year.'
        write: '$\dfrac{26{,}000}{5} = 5{,}200$'
      - section: 'Answer'
        say: 'So the yearly depreciation is five thousand two hundred naira, which is option C.'
        write: '$\therefore$ Depreciation $=$ ₦5,200 a year'
        answer: true
    traps:
      A: 'You went for eight thousand eight hundred naira. That adds the scrap value to the cost instead of taking it away.'
      B: 'You chose six thousand five hundred naira. That divides by four years instead of five.'
      D: 'You picked four thousand four hundred naira. That does not come from the formula. Cost minus scrap is twenty six thousand, and twenty six thousand divided by five is five thousand two hundred.'
  13:
    moments:
      - section: 'The question'
        say: 'The same machine costs thirty five thousand naira and lasts five years, but its scrap value is now fifteen thousand naira. We must find the new yearly depreciation.'
        write: 'Cost ₦35,000, life 5 years, scrap now ₦15,000'
      - section: 'The rule'
        say: 'Yearly depreciation by the straight line method equals cost minus scrap value, divided by the useful life.'
        write: '$\text{Depreciation} = \dfrac{\text{Cost} - \text{Scrap value}}{\text{Useful life}}$'
      - section: 'Work it'
        say: 'Thirty five thousand minus fifteen thousand is twenty thousand naira to be written off.'
        write: '$35{,}000 - 15{,}000 = 20{,}000$'
      - say: 'Twenty thousand divided by five is four thousand naira. A bigger scrap value leaves less to write off, so the yearly charge is smaller.'
        write: '$\dfrac{20{,}000}{5} = 4{,}000$'
      - section: 'Answer'
        say: 'So the yearly depreciation is four thousand naira, which is option A.'
        write: '$\therefore$ Depreciation $=$ ₦4,000 a year'
        answer: true
    traps:
      B: 'You chose seven thousand naira. That divides the full cost by five and forgets the scrap value.'
      C: 'You went for eleven thousand naira. That does not come from the formula. Thirty five thousand minus fifteen thousand is twenty thousand, and twenty thousand divided by five is four thousand.'
      D: 'You picked twenty four thousand naira. That is more than the twenty thousand to be written off over all five years, so it cannot be one year''s charge.'
  14:
    moments:
      - section: 'The question'
        say: 'A furniture shop buys mattresses for resale from Freehold Enterprises and pays three hundred and five thousand, one hundred and fifty naira by cheque. We must find the entries in the shop''s books.'
        write: 'Mattresses for resale, ₦305,150 by cheque'
      - section: 'The rule'
        say: 'Goods bought to sell again are debited to purchases. A cheque takes money out of the bank, so bank is credited.'
        write: 'Goods for resale ⟶ purchases.  Cheque ⟶ bank.'
      - section: 'Double entry'
        say: 'Debit purchases three hundred and five thousand, one hundred and fifty naira.'
        write: 'Dr Purchases ₦305,150'
      - say: 'Credit bank the same amount, because the cheque takes the money out of the bank.'
        write: 'Cr Bank ₦305,150'
      - say: 'Freehold Enterprises has been paid at once, so the shop owes it nothing. Freehold is not a creditor, and its account is not used.'
        write: 'Freehold paid at once ⟹ not a creditor'
      - section: 'Answer'
        say: 'So we debit purchases account and credit bank account, which is option B.'
        write: '$\therefore$ Dr Purchases, Cr Bank'
        answer: true
    traps:
      A: 'You chose sales account. Sales is for goods sold, not goods bought.'
      C: 'You went for debit cash and credit Freehold. No cash came in, and since Freehold was paid at once, the shop owes it nothing.'
      D: 'You picked debit bank and credit Freehold. That records a cheque received from Freehold, the opposite of paying them.'
  15:
    moments:
      - section: 'The question'
        say: 'We are given eight figures, starting with sales of two hundred and thirty two thousand naira. We must find the gross profit.'
        write: 'Sales ₦232,000, find gross profit'
      - section: 'The rule'
        say: 'Gross profit is found in the trading account. Gross profit equals sales minus cost of sales.'
        write: '$\text{Gross profit} = \text{Sales} - \text{Cost of sales}$'
      - say: 'Cost of sales is opening stock, plus purchases, plus carriage inwards, minus closing stock.'
        write: '$\text{Cost of sales} = \text{Op. stock} + \text{Purchases} + \text{Carr. in} - \text{Cl. stock}$'
      - say: 'Carriage outwards, discount received and expenses are left out here, because they belong in profit and loss, not in trading.'
        write: 'Carriage out, discount received, expenses ⟶ not in trading'
      - section: 'Cost of sales'
        say: 'Opening stock of twenty eight thousand, plus purchases of one hundred and twenty eight thousand, plus carriage inwards of four thousand, is one hundred and sixty thousand naira.'
        write: '$28{,}000 + 128{,}000 + 4{,}000 = 160{,}000$'
      - say: 'Take away closing stock of ten thousand naira. Cost of sales is one hundred and fifty thousand naira.'
        write: '$160{,}000 - 10{,}000 = 150{,}000$'
      - section: 'Gross profit'
        say: 'Now sales of two hundred and thirty two thousand minus cost of sales of one hundred and fifty thousand is eighty two thousand naira.'
        write: '$232{,}000 - 150{,}000 = 82{,}000$'
      - section: 'Answer'
        say: 'So the gross profit is eighty two thousand naira, which is option C.'
        write: '$\therefore$ Gross profit $=$ ₦82,000'
        answer: true
    traps:
      A: 'You went for one hundred thousand naira. That adds the discount received, which is income in profit and loss, not trading.'
      B: 'You chose eighty six thousand naira. That leaves carriage inwards out of the cost of sales.'
      D: 'You picked seventy six thousand naira. That takes off carriage outwards, which belongs in profit and loss.'
  16:
    moments:
      - section: 'The question'
        say: 'From the same figures, we must find the expenses debited to the profit and loss account.'
        write: 'Expenses debited to profit and loss $= ?$'
      - section: 'The rule'
        say: 'Selling, office and other running expenses are debited to profit and loss. Carriage inwards has already gone to trading, and discount received is income, so it is credited.'
        write: 'Dr = expenses.  Discount received = Cr.'
      - section: 'Sort them'
        say: 'Carriage outwards of six thousand naira is the cost of delivering goods to customers, a selling expense. The general expenses are twenty thousand naira.'
        write: 'Carriage out ₦6,000, expenses ₦20,000'
      - section: 'Work it'
        say: 'So the expenses debited are six thousand plus twenty thousand, which is twenty six thousand naira.'
        write: '$6{,}000 + 20{,}000 = 26{,}000$'
      - section: 'Answer'
        say: 'So the expenses debited are twenty six thousand naira, which is option C.'
        write: '$\therefore$ Expenses $=$ ₦26,000'
        answer: true
    traps:
      A: 'You went for seventeen thousand naira. That does not come from the list. Only carriage outwards of six thousand and expenses of twenty thousand are debited, which is twenty six thousand.'
      B: 'You chose twenty three thousand naira. That does not come from the list. Carriage outwards of six thousand plus expenses of twenty thousand is twenty six thousand.'
      D: 'You picked thirty thousand naira. That adds carriage inwards, which already went into the trading account.'
  17:
    moments:
      - section: 'The question'
        say: 'We are given the opening capital, the capital introduced, the profit for the year and the cash drawings. We must find the closing capital.'
        write: 'Closing capital $= ?$'
      - section: 'The rule'
        say: 'Capital is what the business owes the owner. New capital and profit raise it, and drawings lower it. So closing capital equals opening capital, plus capital introduced, plus profit, minus drawings.'
        write: '$\text{Closing} = \text{Opening} + \text{Introduced} + \text{Profit} - \text{Drawings}$'
      - section: 'Work it'
        say: 'Opening capital of one thousand five hundred, plus capital introduced of five hundred, plus profit of eight hundred, is two thousand eight hundred naira.'
        write: '$1{,}500 + 500 + 800 = 2{,}800$'
      - say: 'Take away drawings of two hundred and fifty naira. That leaves two thousand five hundred and fifty naira.'
        write: '$2{,}800 - 250 = 2{,}550$'
      - section: 'Answer'
        say: 'So the closing capital is two thousand five hundred and fifty naira, which is option A.'
        write: '$\therefore$ Closing capital $=$ ₦2,550'
        answer: true
    traps:
      B: 'You chose two thousand five hundred naira. The working gives two thousand eight hundred minus two hundred and fifty, which is two thousand five hundred and fifty.'
      C: 'You went for two thousand three hundred and fifty naira. That does not come from the formula. Add the capital introduced and the profit to the opening capital, then take off the drawings once.'
      D: 'You picked two thousand two hundred and fifty naira. That does not come from the formula. Add the capital introduced and the profit to the opening capital, then take off the drawings once.'
  18:
    moments:
      - section: 'The question'
        say: 'We must choose the method of stock valuation a vegetable seller would use.'
        write: 'Vegetable seller, which stock valuation method?'
      - section: 'Name it'
        say: 'The usual methods are F I F O, L I F O and the averages.'
        write: 'Methods: FIFO, LIFO, averages'
      - section: 'The rule'
        say: 'F I F O, first in, first out, assumes the goods bought first are sold first. That is how goods that spoil must move, because old stock rots if it waits.'
        write: 'FIFO = first in, first out'
      - section: 'How it works'
        say: 'She sells yesterday''s vegetables before today''s, so what is left at the end is the newest batch, valued at the latest prices.'
        write: 'Old stock out first, newest stock left'
      - section: 'Answer'
        say: 'So the vegetable seller would use F I F O, which is option B.'
        write: '$\therefore$ FIFO'
        answer: true
    traps:
      A: 'You chose L I F O. Last in, first out would sell today''s vegetables and leave the old ones to rot.'
      C: 'You went for simple average. It ignores the order in which perishable goods must leave.'
      D: 'You picked weighted average. That suits goods mixed together, like grain or oil, not perishables sold in order.'
  19:
    moments:
      - section: 'The question'
        say: 'A sales ledger control account shows the total cash and cheques received from customers. We must find the book that total comes from.'
        write: 'Cash and cheques from customers ⟸ ?'
      - section: 'The rule'
        say: 'A control account takes its totals from the books of original entry.'
