# UTME 2013 Principles of Accounts, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Nigerian Accounts teacher works on the
# board: the question, the account, rule or concept named, the rule in plain words, the double
# entry or the calculation (data, formula, working, check), a Nigerian example, a way to
# remember it, and the answer moment that names the option.
#
#   say:     heard, not read. Abbreviations as letters or words, money in words, percentages
#            as "per cent", no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2013.yaml. Answers match that file. Q1, the
# paper-type question, has no lesson.
format_version: 1
exam_year: 2013
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'Why do businesses keep accounts at all? Before any report or audit, something has to exist first. Let us find it.'
        write: 'Accounting information seeks to provide ?'
      - section: 'Name it'
        say: 'This is about the objectives of book keeping and accounting.'
        write: 'Objectives of accounting'
      - section: 'The rule'
        say: 'The first aim of accounting is a permanent, orderly record of every transaction, so that nothing depends on memory.'
        write: 'Aim 1 = a permanent record of every transaction'
      - section: 'How it works'
        say: 'Every sale, purchase, payment and receipt is first written in a book of original entry. It is then posted to the ledger, checked in a trial balance and summed up in the final accounts.'
        write: 'Book of original entry ⟶ ledger ⟶ trial balance ⟶ final accounts'
      - say: 'From that permanent record, the owner can later find profit, assets and debts.'
        write: 'Record first, then profit, assets, debts'
      - section: 'In Nigeria'
        say: 'A provisions shop in Onitsha that records every credit sale can tell, months later, exactly what Mama Chika owes.'
        write: 'Onitsha shop ⟶ day book shows what each customer owes'
      - section: 'Remember'
        say: 'Remember, accounting starts with a record. No record, no accounts.'
        write: 'No record, no accounts'
      - section: 'Answer'
        say: 'So accounting information seeks to provide permanent records of all transactions, which is option A.'
        write: '$\therefore$ permanent records of all transactions'
        answer: true
    traps:
      B: 'You chose analysis of accounts to trade debtors. Accounts are analysed for the owner and other users, not handed to debtors.'
      C: 'You went for audited reports. Only companies must be audited, and an audit checks records that already exist.'
      D: 'You picked data about employees. That is personnel information, not the main aim of accounting.'
  3:
    moments:
      - section: 'The question'
        say: 'An account has a bigger debit side than credit side. What does that tell us? Let us balance one and see.'
        write: 'Debit total greater than credit total ⟹ ?'
      - section: 'Name it'
        say: 'This is balancing a ledger account.'
        write: 'Balancing an account'
      - section: 'The rule'
        say: 'To balance an account, we add both sides and find the difference. That difference is the balance, and it takes the name of the bigger side.'
        write: 'Bigger debit side ⟹ debit balance'
      - section: 'Work it'
        say: 'For example, in the books of an Ibadan pharmacy, Mister Ade''s account shows sales to him of eight thousand naira on the debit side, and cash he paid of five thousand naira on the credit side.'
        write: '$\begin{array}{|l|r||l|r|}\hline \text{Dr} & \text{₦} & \text{Cr} & \text{₦} \\ \hline \text{Sales} & 8{,}000 & \text{Cash} & 5{,}000 \\ \hline\end{array}$'
      - say: 'The debit side is bigger, so we take the smaller side from it. Eight thousand minus five thousand is three thousand naira.'
        write: '$8{,}000 - 5{,}000 = 3{,}000$'
      - say: 'We write the three thousand on the smaller credit side as balance carried down, so both sides now total eight thousand naira.'
        write: 'Balance c/d ₦3,000 on the credit side, both sides ₦8,000'
      - say: 'Then we bring the three thousand down on the debit side as balance brought down. So the account has a debit balance.'
        write: 'Balance b/d ₦3,000 on the debit side'
      - section: 'In Nigeria'
        say: 'That debit balance of three thousand naira is money Mister Ade still owes the Ibadan pharmacy.'
        write: 'Debit balance ₦3,000 = Mr Ade still owes'
      - section: 'Remember'
        say: 'Remember, the balance takes the name of the bigger side.'
        write: 'Balance = name of the bigger side'
      - section: 'Answer'
        say: 'So the account has a debit balance, which is option C.'
        write: '$\therefore$ a debit balance'
        answer: true
    traps:
      A: 'You chose overdrawn. Only a bank account can be overdrawn, and in the cash book that shows as a credit balance.'
      B: 'You went for understated. A bigger debit side is simply a balance, not a mistake.'
      D: 'You picked a credit balance. That comes when the credit side is the bigger one.'
  4:
    moments:
      - section: 'The question'
        say: 'On July the first, the owner starts the business with ten thousand five hundred naira in cash. Which account is debited?'
        write: 'July 1, started business with ₦10,500 cash'
      - section: 'Name it'
        say: 'This is the double entry for capital.'
        write: 'Double entry for capital'
      - section: 'The rule'
        say: 'Debit the account that receives value, and credit the account that gives value.'
        write: 'Debit the receiver, credit the giver'
      - section: 'Double entry'
        say: 'The cash account receives the money, so we debit cash.'
        write: 'Dr Cash ₦10,500'
      - say: 'The owner gives the value, and his capital account shows what the business now owes him, so we credit capital.'
        write: 'Cr Capital ₦10,500'
      - section: 'Check'
        say: 'Assets of ten thousand five hundred naira equal capital of ten thousand five hundred naira. The equation balances.'
        write: 'Assets ₦10,500 = Capital ₦10,500 ✓'
      - section: 'In Nigeria'
        say: 'When Musa opens a phone accessories stall in Kano with his own money, the stall has the cash and owes Musa the capital.'
        write: 'Musa''s stall, cash in, owes Musa'
      - section: 'Remember'
        say: 'Remember the word dead clic. In dead, the D is for debit, and expenses, assets and drawings increase on the debit side.'
        write: 'DEAD = Debit, Expenses, Assets, Drawings'
      - say: 'In clic, the C is for credit, and liabilities, income and capital increase on the credit side. Cash is an asset, so it is debited, and capital is credited.'
        write: 'CLIC = Credit, Liabilities, Income, Capital'
      - section: 'Answer'
        say: 'So we debit cash and credit capital, which is option C.'
        write: '$\therefore$ Dr Cash, Cr Capital'
        answer: true
    traps:
      A: 'You chose debit capital and credit cash. That turns the entry round, as if cash left the business.'
      B: 'You went for credit cash and debit bank. No bank was involved, because the owner brought in cash.'
      D: 'You picked debit purchases. Nothing was bought here. The owner brought in capital.'
  5:
    moments:
      - section: 'The question'
        say: 'On July thirty one, the business pays Agromachinex six thousand naira in cash, money it owed them. How is it recorded?'
        write: 'July 31, paid Agromachinex ₦6,000 cash'
      - section: 'Name it'
        say: 'This is the double entry for paying a creditor.'
        write: 'Paying a creditor'
      - section: 'The rule'
        say: 'The creditor receives the money, so the creditor is debited. Cash gives the money, so cash is credited.'
        write: 'Debit the receiver, credit the giver'
      - section: 'Double entry'
        say: 'Agromachinex receives the money, so we debit Agromachinex six thousand naira.'
        write: 'Dr Agromachinex ₦6,000'
      - say: 'Cash gives the money, so we credit cash six thousand naira.'
        write: 'Cr Cash ₦6,000'
      - section: 'Check'
        say: 'Cash, an asset, falls by six thousand naira, and the debt, a liability, falls by six thousand naira. The equation still balances.'
        write: 'Assets − ₦6,000 = Liabilities − ₦6,000 ✓'
      - section: 'In Nigeria'
        say: 'A poultry farm in Ogun that pays off its feed supplier clears the supplier''s account and has less in its cash box.'
        write: 'Feed supplier cleared, cash box lighter'
      - section: 'Remember'
        say: 'Remember, pay a creditor and you debit the creditor.'
        write: 'Pay a creditor ⟹ debit the creditor'
      - section: 'Answer'
        say: 'So we debit Agromachinex and credit cash, which is option A.'
        write: '$\therefore$ Dr Agromachinex, Cr Cash'
        answer: true
    traps:
      B: 'You chose debit equipment and credit Agromachinex. That is the entry for first buying the equipment on credit, not for paying the debt.'
      C: 'You went for credit capital and debit cash. That is the entry for the owner bringing in money.'
      D: 'You picked debit purchases. The payment settles an old debt, and nothing new was bought.'
  6:
    moments:
      - section: 'The question'
        say: 'At the end of the month, where would you look to find all the credit sales in one total?'
        write: 'Total credit sales come from ?'
      - section: 'Name it'
        say: 'This is the sales day book, one of the books of original entry.'
        write: 'Sales day book (sales journal)'
      - section: 'The rule'
        say: 'Every credit sale is first written in the sales day book from the sales invoice. Cash sales go to the cash book.'
        write: 'Credit sales ⟶ sales day book.  Cash sales ⟶ cash book.'
      - section: 'How it works'
        say: 'At the end of the period the sales day book is added up. That total is the credit sales.'
        write: 'Total of sales day book = credit sales'
      - say: 'The total is credited to sales account, and each customer''s account is debited.'
        write: 'Cr Sales account, Dr each customer'
      - section: 'In Nigeria'
        say: 'A cement dealer in Aba writes every credit sale to a builder in her sales day book, and adds the column at month end.'
        write: 'Aba cement dealer ⟶ adds the sales day book'
      - section: 'Remember'
        say: 'Remember, credit sales go to the sales day book, and cash sales go to the cash book.'
        write: 'Credit ⟶ day book.  Cash ⟶ cash book.'
      - section: 'Answer'
        say: 'So the total credit sales come from the sales day book, which is option B.'
        write: '$\therefore$ sales day book'
        answer: true
    traps:
      A: 'You chose the cash book. It records money received or paid, so it holds cash sales, not credit sales.'
      C: 'You went for the petty cash book. That records small expenses paid in cash.'
      D: 'You picked the returns inwards book. That records goods sent back by customers.'
  7:
    moments:
      - section: 'The question'
        say: 'A worker is paid by the hour. What paper does the employer need to work out the wages?'
        write: 'Source document for wages = ?'
      - section: 'Name it'
        say: 'This is about source documents, the papers from which entries are made.'
        write: 'Source documents'
      - section: 'The rule'
        say: 'Wages are paid for time worked, so the employer needs a record of the hours, a clock card or a time sheet.'
        write: 'Wages ⟸ record of hours worked'
      - section: 'Work it'
        say: 'Gross wages equal hours worked times the rate per hour.'
        write: '$\text{Wages} = \text{Hours} \times \text{Rate per hour}$'
      - say: 'For example, forty five hours at five hundred naira an hour gives forty five times five hundred, which is twenty two thousand five hundred naira.'
        write: '$45 \times 500 = 22{,}500$'
      - section: 'In Nigeria'
        say: 'In a Lagos block moulding yard, each labourer''s hours go in the time book every day, and on Friday the owner pays from it.'
        write: 'Time book ⟶ Friday pay'
      - section: 'Remember'
        say: 'Remember, wages follow the hours, and salaries follow the month.'
        write: 'Wages follow the hours'
      - section: 'Answer'
        say: 'So the major source document is the record of the number of hours worked, which is option B.'
        write: '$\therefore$ record of the number of hours worked'
        answer: true
    traps:
      A: 'You chose the nominal roll. It lists the staff, but it gives no hours, so it cannot fix wages.'
      C: 'You went for the effort of the employee. Effort is not written on any document and cannot be priced in naira.'
      D: 'You picked the number of dependants. That does not decide how much a worker earns.'
  8:
    moments:
      - section: 'The question'
        say: 'There are four items, and only one buys something the business will use for years. Which one?'
        write: 'Which is capital expenditure?'
      - section: 'Name it'
        say: 'This is capital expenditure, as against revenue expenditure.'
        write: 'Capital vs revenue expenditure'
      - section: 'The rule'
        say: 'Capital expenditure buys or adds to a fixed asset used for more than a year. Revenue expenditure is the day to day cost of running the business.'
        write: 'Capital = fixed asset.  Revenue = running cost.'
      - section: 'Sort them'
        say: 'Office machinery will serve for years, so it is a fixed asset in the balance sheet, also called the statement of financial position.'
        write: 'Office machinery ⟶ fixed asset ⟶ balance sheet'
      - say: 'Maintenance only keeps an old machine working. It buys nothing new, so it is revenue expenditure.'
        write: 'Maintenance ⟶ revenue'
      - say: 'Stationery is used up within weeks, so it is revenue expenditure too.'
        write: 'Stationery ⟶ revenue'
      - say: 'Carriage inwards is the cost of bringing in goods for resale, so it is also revenue expenditure.'
        write: 'Carriage inwards ⟶ revenue'
      - section: 'In Nigeria'
        say: 'A school in Enugu that buys a photocopier makes capital expenditure. The toner and repairs each term are revenue expenditure.'
        write: 'Photocopier = capital.  Toner, repairs = revenue.'
      - section: 'Remember'
        say: 'Remember, buying the machine is capital, and keeping it running is revenue.'
        write: 'Buy it = capital.  Run it = revenue.'
      - section: 'Answer'
        say: 'So the capital expenditure is the purchase of office machinery, which is option D.'
        write: '$\therefore$ purchase of office machinery'
        answer: true
    traps:
      A: 'You chose maintenance of office machine. It has the word machine, but it only keeps an old asset working, so it is revenue.'
      B: 'You went for stationery. It is used up quickly, so it is revenue expenditure.'
      C: 'You picked carriage inwards. It is part of the cost of goods bought for resale, a revenue item.'
  9:
    moments:
      - section: 'The question'
        say: 'Money from a customer is written on the debit side of the cash book. Where does the other half of the entry go?'
        write: 'Receipt on the debit side of the cash book ⟹ other entry ?'
      - section: 'Name it'
        say: 'This is the double entry for receipts in the cash book.'
        write: 'Cash book receipts'
      - section: 'The rule'
        say: 'The cash book is itself a ledger account. Every debit in it needs a matching credit in another ledger account.'
        write: 'Debit in cash book ⟹ credit in the ledger'
      - section: 'Double entry'
        say: 'For example, a customer, Bisi, pays four thousand naira. The money comes in, so we debit the cash book four thousand naira.'
        write: 'Dr Cash book ₦4,000'
      - say: 'Bisi gives the money, so we credit Bisi''s personal account four thousand naira. It is kept in the sales ledger, the ledger that holds the customers'' accounts.'
        write: 'Cr Bisi (sales ledger) ₦4,000'
      - section: 'In Nigeria'
        say: 'A tailor in Ibadan receives four thousand naira from a customer, writes it on the receipts side and credits the customer, which clears the debt.'
        write: 'Ibadan tailor, customer''s debt cleared'
      - section: 'Remember'
        say: 'Remember, when cash comes in, debit the cash book and credit the payer in the ledger.'
        write: 'Cash in ⟹ credit the payer'
      - section: 'Answer'
        say: 'So the corresponding entry is to credit the ledger, which is option C.'
        write: '$\therefore$ credit the ledger'
        answer: true
    traps:
      A: 'You chose credit real accounts. Real accounts are for property. A payment from a person goes to that person''s account.'
      B: 'You went for debit real accounts. A debit in the cash book needs a credit somewhere, not another debit.'
      D: 'You picked debit the ledger. That would give two debits and no credit.'
  10:
    moments:
      - section: 'The question'
        say: 'Alaka owes Saka fifteen thousand naira and pays early with ten per cent cash discount. How does Saka record the discount?'
        write: 'Alaka owes Saka ₦15,000, cash discount 10%'
      - section: 'Name it'
        say: 'This is discount allowed, in the books of Saka, the one who receives the money.'
        write: 'Discount allowed (in Saka''s books)'
      - section: 'The rule'
        say: 'Saka gives the discount, so it is an expense to him. Debit discount allowed. Alaka''s debt goes down, so credit Alaka.'
        write: 'Dr Discount allowed, Cr Alaka'
      - section: 'Work it'
        say: 'Ten per cent of fifteen thousand naira is one thousand five hundred naira.'
        write: '$10\% \times 15{,}000 = 1{,}500$'
      - say: 'So Alaka pays fifteen thousand minus one thousand five hundred, which is thirteen thousand five hundred naira.'
        write: '$15{,}000 - 1{,}500 = 13{,}500$ cash received'
      - section: 'Check'
        say: 'Cash of thirteen thousand five hundred plus discount of one thousand five hundred is fifteen thousand naira, so Alaka''s account is cleared.'
        write: '$13{,}500 + 1{,}500 = 15{,}000$ ✓'
      - section: 'In Nigeria'
        say: 'A Kano grain merchant who knocks off one thousand five hundred naira for early payment records it as discount allowed, an expense.'
        write: 'Kano grain merchant ⟶ discount allowed'
      - section: 'Remember'
        say: 'Remember, the seller allows and the buyer receives.'
        write: 'Seller allows, buyer receives'
      - section: 'Answer'
        say: 'So Saka debits discount allowed account and credits Alaka''s account, which is option D.'
        write: '$\therefore$ Dr Discount allowed, Cr Alaka'
        answer: true
    traps:
      A: 'You chose discount received. That is how Alaka records it in his own books, not how Saka does.'
      B: 'You went for debit Alaka, credit discount received. That turns the entry round and uses the buyer''s account name.'
      C: 'You picked Saka''s account. Saka does not keep an account for himself in his own ledger.'
  11:
    moments:
      - section: 'The question'
        say: 'Here are four statements about the imprest system of petty cash. Only some are true. Let us test each one.'
        write: 'Imprest system, which statements are true?'
      - section: 'Name it'
        say: 'This is the imprest system of keeping petty cash.'
        write: 'Imprest system'
      - section: 'The rule'
        say: 'The petty cashier gets a fixed sum at the start, called the float or imprest. At the end of each period, she is paid back exactly what she spent, so the float is full again.'
        write: 'Fixed float at start, reimburse what was spent'
      - section: 'Work it'
        say: 'For example, take a float of twenty thousand naira. If thirteen thousand five hundred naira is spent, she holds twenty thousand minus thirteen thousand five hundred, which is six thousand five hundred naira.'
        write: '$20{,}000 - 13{,}500 = 6{,}500$ left'
      - say: 'She is given thirteen thousand five hundred naira, the amount spent, and the float is twenty thousand naira again.'
        write: '$6{,}500 + 13{,}500 = 20{,}000$'
      - section: 'Test each one'
        say: 'Now we test each statement. Statement one is false, because each firm picks its own float, so the amount differs from one firm to another.'
        write: 'I ✗  the float differs from firm to firm'
      - say: 'Statement two is false. The fixed sum comes at the start. At the end she gets only what was spent, and that changes with spending.'
        write: 'II ✗  the sum at the end changes'
      - say: 'Statement three is true, because she is reimbursed exactly what was spent, as we just saw.'
        write: 'III ✓  reimbursed what was spent'
      - say: 'Statement four is true, because the fixed float and the vouchers for each payment keep control of petty cash.'
        write: 'IV ✓  a measure of control'
      - section: 'In Nigeria'
        say: 'In a Port Harcourt office, the petty cashier pays for diesel and stamps from the float and is topped up every Friday by what she spent.'
        write: 'Topped up every Friday by what was spent'
      - section: 'Remember'
        say: 'Remember, imprest means topping up what was spent, back to the same float.'
        write: 'Top up what was spent'
      - section: 'Answer'
        say: 'So the true statements are three and four, which is option D.'
        write: '$\therefore$ III and IV'
        answer: true
    traps:
      A: 'You chose one, two and three. Firms choose different floats, and the sum at the end is what was spent, so one and two are false.'
      B: 'You went for one, three and four. Statement one is false, because the imprest differs from firm to firm.'
      C: 'You picked two and four. Statement two sounds right, but the fixed sum comes at the start. At the end she gets what was spent.'
  12:
    moments:
      - section: 'The question'
        say: 'A machine costs thirty five thousand naira, lasts five years and is sold for nine thousand naira as scrap. How much is written off each year?'
        write: 'Cost ₦35,000, life 5 years, scrap ₦9,000'
      - section: 'Name it'
        say: 'This is straight line depreciation, the same charge every year.'
        write: 'Straight line depreciation'
      - section: 'The rule'
        say: 'Yearly depreciation equals cost minus scrap value, divided by the useful life.'
        write: '$\text{Depreciation} = \dfrac{\text{Cost} - \text{Scrap value}}{\text{Useful life}}$'
      - section: 'Work it'
        say: 'First we take the scrap value from the cost, because the machine will be sold for that at the end. Thirty five thousand minus nine thousand is twenty six thousand naira to be written off.'
        write: '$35{,}000 - 9{,}000 = 26{,}000$'
      - say: 'Then we share it over the five years. Twenty six thousand divided by five is five thousand two hundred naira a year.'
        write: '$\dfrac{26{,}000}{5} = 5{,}200$'
      - section: 'Check'
        say: 'Five years times five thousand two hundred is twenty six thousand, and thirty five thousand minus twenty six thousand leaves the nine thousand scrap.'
        write: '$5 \times 5{,}200 = 26{,}000$ ✓'
      - section: 'In Nigeria'
        say: 'A bakery in Ibadan charges five thousand two hundred naira a year for its mixer in profit and loss.'
        write: 'Ibadan bakery mixer ⟶ ₦5,200 a year'
      - section: 'Remember'
        say: 'Remember, take off the scrap first, then share by the years.'
        write: 'Scrap off first, then divide'
      - section: 'Answer'
        say: 'So the yearly depreciation is five thousand two hundred naira, which is option C.'
        write: '$\therefore$ Depreciation $=$ ₦5,200 a year'
        answer: true
    traps:
      A: 'You went for eight thousand eight hundred naira. That adds the scrap value to the cost instead of taking it away.'
      B: 'You chose six thousand five hundred naira. That divides by four years instead of five.'
      D: 'You picked four thousand four hundred naira. That is too small. Twenty six thousand divided by five is five thousand two hundred.'
  13:
    moments:
      - section: 'The question'
        say: 'It is the same machine, but now the scrap value is fifteen thousand naira. Will the yearly charge go up or down?'
        write: 'Cost ₦35,000, life 5 years, scrap now ₦15,000'
      - section: 'Name it'
        say: 'This is straight line depreciation again.'
        write: 'Straight line depreciation'
      - section: 'The rule'
        say: 'Yearly depreciation equals cost minus scrap value, divided by the useful life.'
        write: '$\text{Depreciation} = \dfrac{\text{Cost} - \text{Scrap value}}{\text{Useful life}}$'
      - section: 'Work it'
        say: 'Thirty five thousand minus fifteen thousand is twenty thousand naira.'
        write: '$35{,}000 - 15{,}000 = 20{,}000$'
      - say: 'Twenty thousand divided by five is four thousand naira.'
        write: '$\dfrac{20{,}000}{5} = 4{,}000$'
      - section: 'Check'
        say: 'Five times four thousand is twenty thousand, which leaves the fifteen thousand scrap. A bigger scrap value means a smaller charge, as we expect.'
        write: '$5 \times 4{,}000 = 20{,}000$ ✓'
      - section: 'In Nigeria'
        say: 'If the Ibadan bakery can sell its old mixer for more, it loses less on it, so each year''s charge is smaller.'
        write: 'Higher scrap ⟹ smaller charge'
      - section: 'Remember'
        say: 'Remember, the bigger the scrap value, the smaller the yearly depreciation.'
        write: 'Scrap up, depreciation down'
      - section: 'Answer'
        say: 'So the yearly depreciation is four thousand naira, which is option A.'
        write: '$\therefore$ Depreciation $=$ ₦4,000 a year'
        answer: true
    traps:
      B: 'You chose seven thousand naira. That divides the full cost by five and forgets the scrap value.'
      C: 'You went for eleven thousand naira. That does not come from thirty five thousand minus fifteen thousand, divided by five.'
      D: 'You picked twenty four thousand naira. That is more than the whole amount to be written off in a year.'
  14:
    moments:
      - section: 'The question'
        say: 'A furniture shop buys mattresses to sell from a supplier, Freehold Enterprises, and pays three hundred and five thousand, one hundred and fifty naira by cheque. Which accounts move?'
        write: 'Mattresses for resale, ₦305,150 by cheque'
      - section: 'Name it'
        say: 'This is the double entry for goods bought for resale.'
        write: 'Goods for resale, paid by cheque'
      - section: 'The rule'
        say: 'Goods bought to sell again are debited to purchases. A cheque takes money out of the bank, so bank is credited.'
        write: 'Goods for resale ⟶ purchases.  Cheque ⟶ bank.'
      - section: 'Double entry'
        say: 'Debit purchases three hundred and five thousand, one hundred and fifty naira.'
        write: 'Dr Purchases ₦305,150'
      - say: 'Credit bank the same amount, because the cheque takes the money out of the bank.'
        write: 'Cr Bank ₦305,150'
      - say: 'Freehold Enterprises has been paid at once, so the shop owes it nothing. Freehold is not a creditor, and its account is not used.'
        write: 'Freehold paid at once ⟹ not a creditor'
      - section: 'In Nigeria'
        say: 'A furniture shop in Abuja pays the mattress factory from its bank account. The mattresses are its stock in trade.'
        write: 'Abuja furniture shop ⟶ stock in trade'
      - section: 'Remember'
        say: 'Remember, for goods for resale, debit purchases, and for a cheque payment, credit bank.'
        write: 'Dr Purchases, Cr Bank'
      - section: 'Answer'
        say: 'So we debit purchases account and credit bank account, which is option B.'
        write: '$\therefore$ Dr Purchases, Cr Bank'
        answer: true
    traps:
      A: 'You chose sales account. Sales is for goods sold, not goods bought.'
      C: 'You went for debit cash. No cash came in, and Freehold is not owed anything.'
      D: 'You picked debit bank and credit Freehold. That records a cheque received from Freehold, the opposite of paying them.'
  15:
