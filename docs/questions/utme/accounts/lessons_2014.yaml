# UTME 2014 Principles of Accounts, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Nigerian Accounts teacher works on the
# board: the question, the account, rule or concept named, the rule in plain words, the working
# (the double entry, the T account or the calculation, then a check), a Nigerian example, a way
# to remember it, and the answer moment that names the option.
#
#   say:     heard, not read. Abbreviations as letters or words, money in words, percentages as
#            "per cent", no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2014.yaml. Answers match that file. Q1, the
# paper-type question, has no lesson.
format_version: 1
exam_year: 2014
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'Bookkeeping and accounting sound like the same job. They are not. Let us see where one stops and the other starts.'
        write: 'Bookkeeping vs accounting'
      - section: 'Name it'
        say: 'These are the two stages of keeping a business''s financial records.'
        write: 'Stage 1 bookkeeping, stage 2 accounting'
      - section: 'The rule'
        say: 'Bookkeeping is the recording stage. It writes every transaction into the books.'
        write: 'Bookkeeping = recording the data'
      - say: 'Accounting goes further. It summarises the records into final accounts, then analyses and interprets them.'
        write: 'Accounting = summarising, analysing, interpreting'
      - section: 'In Nigeria'
        say: 'In a bakery in Ibadan, the clerk who writes down each day''s flour and bread sales is the bookkeeper.'
        write: 'Clerk writes the sales ⇒ bookkeeping'
      - say: 'The accountant who reads the year''s figures and explains why profit fell is doing accounting.'
        write: 'Accountant explains the profit ⇒ accounting'
      - section: 'Remember'
        say: 'Remember, the bookkeeper writes, and the accountant reads and explains.'
        write: 'Bookkeeper writes. Accountant explains.'
      - section: 'Answer'
        say: 'So bookkeeping records data while accounting interprets it, which is option A.'
        write: '$\therefore$ records data while the latter interprets it'
        answer: true
    traps:
      B: 'You chose the language of business. That name belongs to accounting, not to bookkeeping.'
      C: 'You picked the reverse. Bookkeeping records and accounting interprets, not the other way round.'
      D: 'You went for summarises and communicates. Both of those are parts of accounting, so they do not separate the two.'
  3:
    moments:
      - section: 'The question'
        say: 'A customer takes goods in December and pays in January. In which month is the sale counted? One concept answers that.'
        write: 'When is revenue recognised?'
      - section: 'Name it'
        say: 'This is the realisation concept, one of the basic accounting concepts.'
        write: 'Realisation concept'
      - section: 'The rule'
        say: 'Revenue is counted as earned when the sale is made, which means when the goods pass to the buyer, and not when the cash is collected.'
        write: 'Revenue earned when goods pass to the buyer'
      - section: 'How it works'
        say: 'So a credit sale made on the twenty eighth of December belongs to this year, even if the customer pays in January.'
        write: 'Sale 28 Dec, cash 10 Jan ⇒ December sale'
      - section: 'In Nigeria'
        say: 'A furniture maker in Aba delivers chairs to a school on credit in December. The sale is realised in December, when the chairs are delivered.'
        write: 'Chairs delivered in December ⇒ December sales'
      - section: 'Remember'
        say: 'Remember, realised means the sale is real, because the goods have changed hands.'
        write: 'Realised = goods have changed hands'
      - section: 'Answer'
        say: 'So revenue recognised at the point of sale is the realisation concept, which is option C.'
        write: '$\therefore$ realisation'
        answer: true
    traps:
      A: 'You chose matching. Matching sets expenses against the revenue they earned, but it does not decide when the revenue is earned.'
      B: 'You picked consistency. That means using the same methods from year to year.'
      D: 'You went for going concern. That assumes the business will carry on into the future.'
  4:
    moments:
      - section: 'The question'
        say: 'One half of an entry was done right and the other half was forgotten. Where does the fix go? Let us trace it.'
        write: 'Cheque ₦5,000 to Sulieman, in cash book, not in his account'
      - section: 'Name it'
        say: 'This is putting right an error where only one side of the double entry was made. It uses the suspense account.'
        write: 'One-sided error ⇒ suspense account'
      - section: 'The rule'
        say: 'When one half of an entry is missing, the trial balance does not agree, and the difference waits in suspense.'
        write: 'Trial balance difference ⇒ suspense'
      - section: 'What happened'
        say: 'The bank column of the cash book was credited with five thousand naira, and that was correct.'
        write: 'Cr Bank (cash book) ₦5,000 ✓'
      - say: 'But Sulieman''s account was never debited. So the debit side was five thousand naira short, and suspense took a debit of five thousand naira.'
        write: 'Dr Sulieman missing ⇒ Dr Suspense ₦5,000'
      - section: 'The fix'
        say: 'Now we make the missing debit to Sulieman, and the credit goes to suspense to clear it.'
        write: 'Dr Sulieman ₦5,000, Cr Suspense ₦5,000'
      - section: 'Check'
        say: 'Suspense had a debit of five thousand naira and now has a credit of five thousand naira, so it is cleared to nothing.'
        write: 'Suspense: ₦5,000 − ₦5,000 = 0 ✓'
      - section: 'In Nigeria'
        say: 'A pharmacy in Jos pays a supplier by cheque and forgets the supplier''s ledger page. The trial balance is out by exactly that cheque until it is put right.'
        write: 'Pharmacy forgets the supplier''s page'
      - section: 'Remember'
        say: 'Remember, if one side was done right, never touch it again. The other half of the fix goes to suspense.'
        write: 'Right side stays. Fix goes to suspense.'
      - section: 'Answer'
        say: 'So we debit Sulieman''s account and credit the suspense account, which is option C.'
        write: '$\therefore$ Cr suspense account'
        answer: true
    traps:
      A: 'You chose cash account. The payment was by cheque and the cash book was already right, so cash is not touched.'
      B: 'You went for bank account. The bank was already credited correctly. A second credit would show the cheque paid twice.'
      D: 'You picked purchases account. Paying a supplier is not buying goods, and purchases played no part in this error.'
  5:
    moments:
      - section: 'The question'
        say: 'Aduke Motors pays six million naira in cash for three vans. The vans account is debited. Where is the credit?'
        write: 'Dr Motor vehicles ₦6,000,000, Cr ?'
      - section: 'Name it'
        say: 'This is the double entry for buying a fixed asset for cash.'
        write: 'Fixed asset bought for cash'
      - section: 'The rule'
        say: 'Debit the account that receives value, and credit the account that gives value.'
        write: 'Debit the receiver, credit the giver'
      - section: 'The working'
        say: 'The vans account receives the vans, so it is debited. Cash gives the money, and cash is kept in the cash book.'
        write: 'Dr Motor vehicles, Cr Cash book'
      - say: 'The purchases day book is only for goods bought on credit for resale. These vans are for use, and they were paid for in cash.'
        write: 'Purchases day book = credit goods for resale only'
      - section: 'In Nigeria'
        say: 'A transport firm in Kano that pays cash for three buses writes the payment on the credit side of the cash book.'
        write: 'Cash paid out ⇒ credit side of the cash book'
      - section: 'Remember'
        say: 'Remember, when cash goes out, credit the cash book.'
        write: 'Cash out ⇒ credit cash book'
      - section: 'Answer'
        say: 'So the credit for the vans appears in the cash book, which is option D.'
        write: '$\therefore$ cash book'
        answer: true
    traps:
      A: 'You chose the sales day book. That records credit sales, and nothing was sold here.'
      B: 'You went for the purchases day book. That is for goods bought on credit for resale, not vans bought for cash.'
      C: 'You picked a sales subsidiary book. This was a purchase, not a sale.'
  6:
    moments:
      - section: 'The question'
        say: 'Some errors hide inside a trial balance that still agrees. Only one of these makes the totals disagree. Which one?'
        write: 'Which error makes the trial balance disagree?'
      - section: 'The rule'
        say: 'An error shows up in the trial balance only if it makes the debit side and the credit side unequal.'
        write: 'Debits ≠ credits ⇒ trial balance disagrees'
      - section: 'The others'
        say: 'An error of omission leaves out both the debit and the credit, so the two sides still agree.'
        write: 'Omission ⇒ both sides left out ⇒ agrees'
      - say: 'Errors of commission and of original entry put equal amounts on both sides, so they agree too.'
        write: 'Commission, original entry ⇒ agrees'
      - section: 'Transposition'
        say: 'A transposition swaps two digits. Five thousand four hundred becomes four thousand five hundred on one side only.'
        write: '₦5,400 posted as ₦4,500'
      - say: 'Now one side is nine hundred naira out, so the totals disagree.'
        write: '5,400 − 4,500 = 900'
      - section: 'Check'
        say: 'Nine hundred divided by nine is one hundred, a whole number. A difference that divides by nine is the sign of a transposition.'
        write: '900 ÷ 9 = 100 ✓'
      - section: 'In Nigeria'
        say: 'A shop in Onitsha debits a customer five thousand four hundred naira but credits sales four thousand five hundred naira. The trial balance will not agree until the swap is found.'
        write: 'Dr 5,400, Cr 4,500 ⇒ out by 900'
      - section: 'Remember'
        say: 'Remember, a difference that divides by nine points to a transposition.'
        write: 'Divides by 9 ⇒ transposition'
      - section: 'Answer'
        say: 'So the error that makes the trial balance disagree is the error of transposition, which is option C.'
        write: '$\therefore$ error of transposition'
        answer: true
    traps:
      A: 'You chose omission. Leaving a transaction out completely removes both sides, so the totals still agree.'
      B: 'You went for commission. That posts the right amount to the wrong person, so both sides stay equal.'
      D: 'You picked original entry. The same wrong figure goes on both sides, so the totals still agree.'
  7:
    moments:
      - section: 'The question'
        say: 'A big business cannot keep every account in one book. How is the ledger divided?'
        write: 'A ledger is commonly divided into ?'
      - section: 'Name it'
        say: 'This is the division of the ledger.'
        write: 'Division of the ledger'
      - section: 'The rule'
        say: 'The sales ledger holds the debtors, who are the customers who owe us.'
        write: 'Sales ledger = debtors'
      - say: 'The purchases ledger holds the creditors, who are the suppliers we owe.'
        write: 'Purchases ledger = creditors'
      - say: 'The general ledger holds every other account, like rent, wages, capital and equipment.'
        write: 'General ledger = all other accounts'
      - section: 'Inside the general ledger'
        say: 'The general ledger is often split again into the nominal ledger and the private ledger, which keeps capital and drawings confidential.'
        write: 'General = nominal + private'
      - section: 'In Nigeria'
        say: 'A wholesaler in Kano keeps three hundred customers in the sales ledger, its suppliers in the purchases ledger, and everything else in the general ledger.'
        write: 'Customers, suppliers, everything else'
      - section: 'Remember'
        say: 'Remember S P G, which stands for sales, purchases and general.'
        write: 'S P G'
      - section: 'Answer'
        say: 'So the ledger is divided into the sales, purchases and general ledgers, which is option D.'
        write: '$\therefore$ sales, purchases and general ledgers'
        answer: true
    traps:
      A: 'You chose private, sales and purchases. The private ledger is part of the general ledger, and this leaves the general ledger out.'
      B: 'You went for journal, day books and private ledger. The journal and day books are books of original entry, not ledgers.'
      C: 'You picked general, private and sales. That leaves out the purchases ledger, where the creditors are kept.'
  8:
    moments:
      - section: 'The question'
        say: 'An invoice arrives at the shop. Which books does it travel through? That tells us what the books of account are.'
        write: 'Books of account consist of ?'
      - section: 'Name it'
        say: 'These are the books of account, where transactions are recorded after they arrive on source documents.'
        write: 'Source document ⇒ books of account'
      - section: 'The rule'
        say: 'Information on source documents is first entered in the subsidiary books, also called the books of original entry.'
        write: 'Step 1 subsidiary books'
      - say: 'From the subsidiary books it is posted to the ledger.'
        write: 'Step 2 ledger'
      - say: 'So the books of account are the subsidiary books and the ledger together.'
        write: 'Books of account = subsidiary books + ledger'
      - section: 'In Nigeria'
        say: 'In a provisions shop in Onitsha, the supplier''s invoice is written in the purchases day book, then posted to the supplier''s account in the ledger.'
        write: 'Invoice ⇒ purchases day book ⇒ ledger'
      - section: 'Remember'
        say: 'Remember, document, then day book, then ledger.'
        write: 'Document ⇒ day book ⇒ ledger'
      - section: 'Answer'
        say: 'So the books of account consist of the ledger and subsidiary books, which is option B.'
        write: '$\therefore$ ledger and subsidiary books'
        answer: true
    traps:
      A: 'You chose debit and credit notes. Those are source documents themselves, not books of account.'
      C: 'You went for prepayments and accruals. Those are adjustments made at the year end, not books.'
      D: 'You picked the profit and loss account and balance sheet. Those are final accounts prepared from the ledger.'
  9:
    moments:
      - section: 'The question'
        say: 'A business writes a cheque to pay a supplier. Which side of the cash book takes it, and who is debited?'
        write: 'Cheque issued ⇒ entries ?'
      - section: 'Name it'
        say: 'This is the double entry for a payment by cheque.'
        write: 'Payment by cheque'
      - section: 'The rule'
        say: 'Money leaving the bank is credited in the bank column of the cash book.'
        write: 'Money out ⇒ Cr cash book (bank)'
      - say: 'The person who receives the money is called the payee. He receives value, so he is debited.'
        write: 'Payee receives ⇒ Dr payee'
      - section: 'The working'
        say: 'For a cheque of twenty thousand naira to a supplier, we credit the bank column and debit the supplier.'
        write: 'Cr Bank ₦20,000, Dr Supplier ₦20,000'
      - section: 'In Nigeria'
        say: 'A school in Enugu pays its stationery supplier by cheque. The bursar credits the bank column and debits the supplier, so the school no longer owes him.'
        write: 'School pays supplier by cheque'
      - section: 'Remember'
        say: 'Remember, the bank gives, so credit the bank. The payee receives, so debit the payee. The drawer is the business that writes the cheque.'
        write: 'Bank gives ⇒ Cr. Payee receives ⇒ Dr.'
      - section: 'Answer'
        say: 'So we credit the cash book and debit the payee, which is option B.'
        write: '$\therefore$ Cr cash book, Dr payee'
        answer: true
    traps:
      A: 'You chose debit cash book and credit payee. That is reversed. A cheque issued takes money out, so the cash book is credited.'
      C: 'You went for debit cash book and credit suspense. Debiting the cash book shows money coming in, and nothing here goes to suspense.'
      D: 'You picked credit cash book and debit suspense. The cash book side is right, but the debit belongs to the payee.'
  10:
    moments:
      - section: 'The question'
        say: 'Emeka Enterprises pays early and earns a discount. How much cash actually leaves the business?'
        write: 'Goods ₦22,800, paid in 5 days, discount 12½% within 7 days'
      - section: 'Name it'
        say: 'This is cash discount received, a reward for paying a supplier promptly.'
        write: 'Cash discount received'
      - section: 'The rule'
        say: 'Cash paid equals the invoice amount minus the discount. Payment in five days is inside the seven days allowed, so the discount is earned.'
        write: '$\text{Cash paid} = \text{Invoice} - \text{Discount}$'
      - section: 'The discount'
        say: 'Twelve and a half per cent is one eighth. One eighth of twenty two thousand eight hundred naira is two thousand eight hundred and fifty naira.'
        write: '₦22,800 × $\tfrac{1}{8}$ = ₦2,850'
      - section: 'Cash paid'
        say: 'Twenty two thousand eight hundred naira minus two thousand eight hundred and fifty naira is nineteen thousand nine hundred and fifty naira.'
        write: '₦22,800 − ₦2,850 = ₦19,950'
      - section: 'Check'
        say: 'Nineteen thousand nine hundred and fifty plus two thousand eight hundred and fifty gives back twenty two thousand eight hundred, the full debt cleared.'
        write: '₦19,950 + ₦2,850 = ₦22,800 ✓'
      - section: 'In the cash book'
        say: 'The nineteen thousand nine hundred and fifty naira goes in the cash column on the credit side, and the discount goes in the discount column beside it.'
        write: 'Cr cash ₦19,950, discount column ₦2,850'
      - section: 'Remember'
        say: 'Remember, twelve and a half per cent is one eighth, so divide by eight for the discount.'
        write: '12½% = ÷ 8'
      - section: 'Answer'
        say: 'So the amount credited in the cash column is nineteen thousand nine hundred and fifty naira, which is option C.'
        write: '$\therefore$ ₦19,950'
        answer: true
    traps:
      A: 'You chose twenty five thousand six hundred and fifty naira. That adds the discount instead of taking it off.'
      B: 'You went for twenty two thousand eight hundred naira. That is the full invoice, but the discount was earned, so less cash is paid.'
      D: 'You picked eighteen thousand two hundred and forty naira. That takes off twenty per cent, not twelve and a half per cent.'
  11:
    moments:
      - section: 'The question'
        say: 'Why give a junior staff member a small float of cash? What does the imprest system really achieve?'
        write: 'Major advantage of the imprest system ?'
      - section: 'Name it'
        say: 'This is the imprest system of petty cash.'
        write: 'Imprest system'
      - section: 'The rule'
        say: 'The chief cashier gives the petty cashier a fixed float, called the imprest.'
        write: 'Fixed float = imprest'
      - say: 'At the end of the period the chief cashier refunds exactly what was spent, so the float is back to the same figure.'
        write: 'Refund = amount spent ⇒ float restored'
      - section: 'The advantage'
        say: 'Its main advantage is that the chief cashier is freed from paying out many small sums, so he can deal with the large payments.'
        write: 'Chief cashier freed from petty payments'
      - section: 'In Nigeria'
        say: 'In a pharmacy in Port Harcourt, the petty cashier holds twenty thousand naira. She spends fourteen thousand five hundred naira on fares and soap, and on Friday she is given back fourteen thousand five hundred naira.'
        write: '₦20,000 − ₦14,500 + ₦14,500 = ₦20,000'
      - section: 'Remember'
        say: 'Remember, the imprest keeps the petty sums away from the chief cashier''s desk.'
        write: 'Petty sums off the chief cashier''s desk'
      - section: 'Answer'
        say: 'So the major advantage is that it relieves the chief cashier of the numerous petty cash payments, which is option C.'
        write: '$\therefore$ relieves the chief cashier of petty payments'
        answer: true
    traps:
      A: 'You chose removes the need to check petty cash spending. The imprest makes checking easier, but it never removes it.'
      B: 'You went for training young accountants. That may happen, but it is not the purpose of the imprest.'
      D: 'You picked an analysis column. Analysis columns belong to the petty cash book layout, not to the imprest itself.'
  12:
    moments:
      - section: 'The question'
        say: 'Most entries in a petty cash book are small payments. Does that mean it has only one side? Let us look.'
        write: 'Petty cash book records on which side ?'
      - section: 'Name it'
        say: 'This is the petty cash book, the book for small cash payments.'
        write: 'Petty cash book'
      - section: 'The rule'
        say: 'Like any cash account, it has a debit side for money received and a credit side for money paid out.'
        write: 'Dr money in, Cr money out'
      - section: 'The working'
        say: 'The float of ten thousand naira from the chief cashier goes on the debit side.'
        write: 'Dr Cash from chief cashier ₦10,000'
      - say: 'Transport of one thousand five hundred naira and postage of eight hundred naira go on the credit side.'
        write: 'Cr Transport ₦1,500, Cr Postage ₦800'
      - section: 'Check'
        say: 'Ten thousand minus two thousand three hundred leaves seven thousand seven hundred naira, carried down on the debit side.'
        write: '₦10,000 − ₦2,300 = ₦7,700 balance'
      - section: 'Remember'
        say: 'Remember, money in on the left and money out on the right, as in the main cash book.'
        write: 'In on the left, out on the right'
      - section: 'Answer'
        say: 'So the petty cash book records on both the credit and debit sides, which is option C.'
        write: '$\therefore$ both the credit and debit sides'
        answer: true
    traps:
      A: 'You chose the debit side only. The payments, which are most of the entries, go on the credit side.'
      B: 'You went for the credit side only. The float and its refills are received on the debit side.'
      D: 'You picked reversed entry. That is a type of error, not a way of keeping the petty cash book.'
  13:
    moments:
      - section: 'The question'
        say: 'A branch manager far from head office handles cash every day. How does head office stop the cash from going missing?'
        write: 'Head office guard on branch cash ?'
      - section: 'Name it'
        say: 'This is head office control over branch cash, in branch accounts.'
        write: 'Branch cash control'
      - section: 'The rule'
        say: 'The branch sells only for cash and banks all its takings, untouched, into the head office account.'
        write: 'Branch sells for cash, banks it all'
      - say: 'Credit sales are made only by head office, or with its approval.'
        write: 'Credit sales by head office only'
      - section: 'Why it works'
        say: 'If the branch could sell on credit by itself, a dishonest manager could keep the cash and call it a credit sale to a customer who never pays.'
        write: 'Branch credit sales ⇒ cash can be hidden'
      - say: 'With credit left to head office, every branch sale must show up as cash banked, so goods sent and cash remitted can be checked against each other.'
        write: 'Goods sent ⇔ cash banked'
      - section: 'In Nigeria'
        say: 'A Lagos company lets its Ilorin branch sell only for cash. Each evening the takings go into the head office account.'
        write: 'Ilorin branch banks takings daily'
      - section: 'Remember'
        say: 'Remember, the branch sells for cash and banks it all, and credit is a head office decision.'
        write: 'Branch = cash. Head office = credit.'
      - section: 'Answer'
        say: 'So the guard is credit sales by only the headquarters, which is option D.'
        write: '$\therefore$ credit sales by only the headquarters'
        answer: true
    traps:
      A: 'You chose letting the branch pay expenses from its takings. That is exactly how cash can vanish before it is sent in.'
      B: 'You went for direct purchase by the branch. That gives the branch more freedom and weakens control.'
      C: 'You picked a separate branch accountant. That does not stop takings being held back.'
  14:
    moments:
      - section: 'The question'
        say: 'Five items, and only some of them go on the debit side of the cash book. Which ones?'
        write: 'I cash sales, II cash purchases, III discount received, IV cash payments, V cash receipts'
      - section: 'Name it'
        say: 'This is the cash book, and which side each item goes on.'
        write: 'Cash book sides'
      - section: 'The rule'
        say: 'The debit side records money coming in, and the credit side records money going out.'
        write: 'Dr money in, Cr money out'
      - section: 'Sort them'
        say: 'Cash sales and cash receipts bring money in, so they are debits.'
        write: 'I and V ⇒ debit'
      - say: 'Cash purchases and cash payments send money out, so they are credits.'
        write: 'II and IV ⇒ credit'
      - say: 'Discount received sits in the discount column on the credit side, next to the payment to the supplier.'
        write: 'III ⇒ credit side'
      - section: 'In Nigeria'
        say: 'A shop in Onitsha writes the day''s cash sales and money from a debtor on the left, and the cash paid for goods on the right.'
        write: 'Sales and receipts left, payments right'
      - section: 'Remember'
        say: 'Remember, in on the left and out on the right.'
        write: 'In left, out right'
      - section: 'Answer'
        say: 'So the debit side records one and five, which is option C.'
        write: '$\therefore$ I and V'
        answer: true
    traps:
      A: 'You chose one and two. Cash purchases send money out, so they are credited.'
      B: 'You went for one and three. Discount received sits beside the payment on the credit side.'
      D: 'You picked one and four. Cash payments send money out, so they are credited.'
  15:
    moments:
      - section: 'The question'
        say: 'The bank statement shows money in that the firm never wrote down. Where did it come from?'
        write: 'Credited by the bank, not yet in the cash book ?'
      - section: 'Name it'
        say: 'This is one cause of a difference between the cash book and the bank statement.'
        write: 'Cash book vs bank statement'
      - section: 'The rule'
        say: 'The bank credits the account when money comes in. A customer can pay straight into the account without telling the firm.'
        write: 'Money in without notice ⇒ bank credit'
      - say: 'That payment is a direct deposit, also called a credit transfer.'
        write: 'Direct deposit = credit transfer'
      - section: 'The working'
        say: 'When the statement shows a direct deposit of forty five thousand naira, the firm debits its cash book to bring it up to date.'
        write: 'Dr Cash book ₦45,000 (adjusted cash book)'
      - section: 'In Nigeria'
        say: 'A customer in Abuja pays a Kaduna supplier by bank transfer. The supplier only sees it on the bank statement at the month end.'
        write: 'Transfer seen only on the statement'
      - section: 'Remember'
        say: 'Remember, money in that you did not see coming is a direct deposit. Money out that you did not see is a charge or a standing order.'
        write: 'Unseen in = deposit. Unseen out = charge, standing order.'
      - section: 'Answer'
        say: 'So the item credited by the bank but not yet in the cash book is a direct deposit, which is option D.'
        write: '$\therefore$ direct deposit'
        answer: true
    traps:
      A: 'You chose bank charges. Charges take money out, so they are debits in the bank statement.'
      B: 'You went for contract payment. That is a payment the firm makes and records itself.'
      C: 'You picked standing order. A standing order pays money out, so it is a debit.'
  16:
    moments:
      - section: 'The question'
        say: 'Four fractions, and only one spreads the cost of an asset fairly over its life. Which is it?'
        write: 'Straight line depreciation formula ?'
      - section: 'Name it'
        say: 'This is the straight line method of depreciation.'
        write: 'Straight line method'
