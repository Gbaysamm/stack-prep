# UTME 2014 Principles of Accounts, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Nigerian Accounts teacher works on the
# board: the question, the account, rule or concept named, the rule in plain words, the working
# (the double entry, the T account or the calculation, then a check), a Nigerian example, a way
# to remember it, and the answer moment that names the option.
#
#   say:     heard, not read. Abbreviations as letters or words, money in words, percentages as
#            "per cent", no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2014.yaml. Answers match that file. Q1, the
# paper-type question, has no lesson.
format_version: 1
exam_year: 2014
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'We must pick out one real difference between bookkeeping and accounting. The former in the question means bookkeeping, and the latter means accounting.'
        write: 'Bookkeeping (former) vs accounting (latter)'
      - section: 'Two stages'
        say: 'They are two stages of the same financial records. Stage one is bookkeeping, and stage two is accounting.'
        write: 'Stage 1 bookkeeping, stage 2 accounting'
      - section: 'The rule'
        say: 'Bookkeeping is the recording stage. It writes every transaction into the books.'
        write: 'Bookkeeping = recording the data'
      - say: 'Accounting goes further. It summarises the records into final accounts, then analyses and interprets them.'
        write: 'Accounting = summarising, analysing, interpreting'
      - section: 'Answer'
        say: 'So bookkeeping records data while accounting interprets it, which is option A.'
        write: '$\therefore$ records data while the latter interprets it'
        answer: true
    traps:
      B: 'You chose the language of business. That name is given to accounting, not to bookkeeping, so it does not describe the former.'
      C: 'You picked the reverse. Bookkeeping records and accounting interprets, not the other way round.'
      D: 'You went for summarises and communicates. Both of those are parts of accounting, so they do not separate the two.'
  3:
    moments:
      - section: 'The question'
        say: 'We must name the concept that says revenue is recognised at the point when the sale is made.'
        write: 'Revenue recognised at the point of sale ⇒ which concept?'
      - section: 'Name it'
        say: 'This is the realisation concept.'
        write: 'Realisation concept'
      - section: 'The rule'
        say: 'Revenue is counted as earned when the sale is made, which means when the goods pass to the buyer, and not when the cash is collected.'
        write: 'Revenue earned when goods pass to the buyer'
      - section: 'How it works'
        say: 'So a credit sale made on the twenty eighth of December belongs to December, even if the customer pays in January.'
        write: 'Sale 28 Dec, cash 10 Jan ⇒ December sale'
      - section: 'Answer'
        say: 'So revenue recognised at the point of sale is the realisation concept, which is option C.'
        write: '$\therefore$ realisation'
        answer: true
    traps:
      A: 'You chose matching. Matching sets expenses against the revenue they earned, but it does not decide when the revenue is earned.'
      B: 'You picked consistency. That means using the same accounting methods from year to year. It says nothing about when a sale counts.'
      D: 'You went for going concern. That assumes the business will carry on into the future. It does not decide when revenue is earned.'
  4:
    moments:
      - section: 'The question'
        say: 'A cheque of five thousand naira paid to Sulieman was entered correctly in the cash book, but never entered in Sulieman''s account. We debit Sulieman''s account, and we must find the account to credit.'
        write: 'Cheque ₦5,000 to Sulieman, in cash book, not in his account'
      - section: 'What happened'
        say: 'The bank column of the cash book was credited with five thousand naira, and that was correct.'
        write: 'Cr Bank (cash book) ₦5,000 ✓'
      - say: 'But Sulieman''s account was never debited. So the debit side of the trial balance is five thousand naira short, and the trial balance does not agree.'
        write: 'Dr Sulieman missing ⇒ debits ₦5,000 short'
      - section: 'The rule'
        say: 'When only one half of an entry is made, the difference in the trial balance is held in a suspense account. A suspense account is a temporary account that holds the difference until the error is found.'
        write: 'One-sided error ⇒ difference held in suspense'
      - say: 'Here the debits are short, so suspense was given a debit of five thousand naira to make the trial balance agree for now.'
        write: 'Dr Suspense ₦5,000'
      - section: 'The fix'
        say: 'Now we make the missing debit to Sulieman. The bank side was already right, so the credit goes to suspense, and that clears it.'
        write: 'Dr Sulieman ₦5,000, Cr Suspense ₦5,000'
      - section: 'Answer'
        say: 'So we debit Sulieman''s account and credit the suspense account, which is option C.'
        write: '$\therefore$ Cr suspense account'
        answer: true
    traps:
      A: 'You chose cash account. The payment was by cheque, and the cash book was already right, so it is not touched again.'
      B: 'You went for bank account. The bank was already credited correctly. A second credit would record the cheque twice.'
      D: 'You picked purchases account. Paying a supplier is not buying goods, and purchases played no part in this error.'
  5:
    moments:
      - section: 'The question'
        say: 'Aduke Motors paid six million naira in cash for three vans. The vehicle account is debited, and we must find the book where the credit appears.'
        write: 'Dr Motor vehicles ₦6,000,000, Cr ?'
      - section: 'The rule'
        say: 'Debit the account that receives value, and credit the account that gives value.'
        write: 'Debit the receiver, credit the giver'
      - section: 'The working'
        say: 'The vans account receives the vans, so it is debited. Cash gives the money, and cash is kept in the cash book, so the cash book is credited.'
        write: 'Dr Motor vehicles, Cr Cash book'
      - say: 'The purchases day book is only for goods bought on credit for resale. These vans are for use in the business, and they were paid for in cash.'
        write: 'Purchases day book = credit goods for resale only'
      - section: 'Answer'
        say: 'So the credit for the vans appears in the cash book, which is option D.'
        write: '$\therefore$ cash book'
        answer: true
    traps:
      A: 'You chose the sales day book. That records credit sales, and nothing was sold here.'
      B: 'You went for the purchases day book. That is for goods bought on credit for resale, not vans bought for cash.'
      C: 'You picked a sales subsidiary book. That is another name for the sales day book, and this was a purchase, not a sale.'
  6:
    moments:
      - section: 'The question'
        say: 'We must find which of four errors makes the totals of the trial balance disagree.'
        write: 'Which error makes the trial balance disagree?'
      - section: 'The rule'
        say: 'An error shows up in the trial balance only if it makes the debit side and the credit side unequal.'
        write: 'Debits ≠ credits ⇒ trial balance disagrees'
      - section: 'The others'
        say: 'An error of omission leaves out both the debit and the credit, so the two sides still agree.'
        write: 'Omission ⇒ both sides left out ⇒ agrees'
      - say: 'An error of commission posts the right amount to the wrong person''s account, on the correct side. Both sides still carry equal amounts, so the totals agree.'
        write: 'Commission ⇒ wrong person, equal amounts ⇒ agrees'
      - say: 'An error of original entry puts the same wrong figure on both sides, so the totals agree too.'
        write: 'Original entry ⇒ same wrong figure both sides ⇒ agrees'
      - section: 'Transposition'
        say: 'An error of transposition swaps two digits of a figure. Say five thousand four hundred naira is debited correctly, but credited as four thousand five hundred naira.'
        write: '₦5,400 debited, ₦4,500 credited'
      - say: 'Now the debit side is nine hundred naira more than the credit side, so the totals disagree.'
        write: '5,400 − 4,500 = 900 ⇒ totals disagree'
      - section: 'Answer'
        say: 'So the error that makes the trial balance disagree is the error of transposition, which is option C.'
        write: '$\therefore$ error of transposition'
        answer: true
    traps:
      A: 'You chose omission. Leaving a transaction out completely removes both sides, so the totals still agree.'
      B: 'You went for commission. That posts the right amount to the wrong person, so both sides stay equal.'
      D: 'You picked original entry. The same wrong figure goes on both sides, so the totals still agree.'
  7:
    moments:
      - section: 'The question'
        say: 'We must name the usual divisions of the ledger.'
        write: 'A ledger is commonly divided into ?'
      - section: 'The rule'
        say: 'The sales ledger holds the debtors, who are the customers who owe us.'
        write: 'Sales ledger = debtors'
      - say: 'The purchases ledger holds the creditors, who are the suppliers we owe.'
        write: 'Purchases ledger = creditors'
      - say: 'The general ledger holds every other account, like rent, wages, capital and equipment.'
        write: 'General ledger = all other accounts'
      - section: 'Inside the general ledger'
        say: 'The general ledger is often split again into the nominal ledger and the private ledger, which keeps capital and drawings confidential. So the private ledger is part of the general ledger, not a main division.'
        write: 'General = nominal + private'
      - section: 'Answer'
        say: 'So the ledger is divided into the sales, purchases and general ledgers, which is option D.'
        write: '$\therefore$ sales, purchases and general ledgers'
        answer: true
    traps:
      A: 'You chose private, sales and purchases. The private ledger is part of the general ledger, and this leaves the general ledger out.'
      B: 'You went for journal, day books and private ledger. The journal and day books are books of original entry, not ledgers.'
      C: 'You picked general, private and sales. That leaves out the purchases ledger, where the creditors are kept.'
  8:
    moments:
      - section: 'The question'
        say: 'We must name the books of account where information from source documents is recorded.'
        write: 'Books of account consist of ?'
      - section: 'The rule'
        say: 'Source documents are papers like invoices, receipts and credit notes. The information on them is first entered in the subsidiary books, also called the books of original entry, such as the day books.'
        write: 'Source document ⇒ subsidiary books'
      - say: 'From the subsidiary books it is posted to the ledger.'
        write: 'Subsidiary books ⇒ ledger'
      - say: 'So the books of account are the subsidiary books and the ledger together.'
        write: 'Books of account = subsidiary books + ledger'
      - section: 'Answer'
        say: 'So the books of account consist of the ledger and subsidiary books, which is option B.'
        write: '$\therefore$ ledger and subsidiary books'
        answer: true
    traps:
      A: 'You chose debit and credit notes. Those are source documents themselves, not books of account.'
      C: 'You went for prepayments and accruals. Those are adjustments made at the year end, not books.'
      D: 'You picked the profit and loss account and balance sheet. Those are final accounts prepared from the ledger.'
  9:
    moments:
      - section: 'The question'
        say: 'We must give the double entry for a cheque issued by a business.'
        write: 'Cheque issued ⇒ entries ?'
      - section: 'The rule'
        say: 'A cheque issued takes money out of the bank. Money leaving the bank is credited in the bank column of the cash book.'
        write: 'Money out ⇒ Cr cash book (bank)'
      - say: 'The person who receives the cheque is called the payee. The account that receives value is debited, so the payee is debited.'
        write: 'Payee receives ⇒ Dr payee'
      - section: 'The working'
        say: 'For a cheque of twenty thousand naira to a supplier, we credit the bank column and debit the supplier.'
        write: 'Cr Bank ₦20,000, Dr Supplier ₦20,000'
      - section: 'Answer'
        say: 'So we credit the cash book and debit the payee, which is option B.'
        write: '$\therefore$ Cr cash book, Dr payee'
        answer: true
    traps:
      A: 'You chose debit cash book and credit payee. That is reversed. A cheque issued takes money out, so the cash book is credited.'
      C: 'You went for debit cash book and credit suspense. Debiting the cash book shows money coming in, and nothing here goes to suspense.'
      D: 'You picked credit cash book and debit suspense. The cash book side is right, but the debit belongs to the payee.'
  10:
    moments:
      - section: 'The question'
        say: 'Emeka Enterprises bought goods for twenty two thousand eight hundred naira and paid within five days. Paying within seven days earns a cash discount of twelve and a half per cent. We must find the cash credited in the cash book.'
        write: 'Goods ₦22,800, paid in 5 days, discount 12½% within 7 days'
      - section: 'The rule'
        say: 'A cash discount is a reduction the supplier allows for prompt payment. Cash paid equals the invoice amount minus the discount.'
        write: '$\text{Cash paid} = \text{Invoice} - \text{Discount}$'
      - say: 'Payment in five days is inside the seven days allowed, so the discount is earned.'
        write: '5 days < 7 days ⇒ discount earned'
      - section: 'The discount'
        say: 'Twelve and a half per cent is twelve and a half over one hundred, and that simplifies to one eighth.'
        write: '12½% = $\tfrac{12.5}{100} = \tfrac{1}{8}$'
      - say: 'So the discount is one eighth of twenty two thousand eight hundred naira. Twenty two thousand eight hundred divided by eight is two thousand eight hundred and fifty naira.'
        write: '₦22,800 × $\tfrac{1}{8}$ = ₦2,850'
      - section: 'Cash paid'
        say: 'Twenty two thousand eight hundred naira minus two thousand eight hundred and fifty naira is nineteen thousand nine hundred and fifty naira.'
        write: '₦22,800 − ₦2,850 = ₦19,950'
      - section: 'In the cash book'
        say: 'The nineteen thousand nine hundred and fifty naira goes in the cash column on the credit side, and the discount goes in the discount column beside it.'
        write: 'Cr cash ₦19,950, discount column ₦2,850'
      - section: 'Answer'
        say: 'So the amount credited in the cash column is nineteen thousand nine hundred and fifty naira, which is option C.'
        write: '$\therefore$ ₦19,950'
        answer: true
    traps:
      A: 'You chose twenty five thousand six hundred and fifty naira. That adds the discount instead of taking it off.'
      B: 'You went for twenty two thousand eight hundred naira. That is the full invoice, but the discount was earned, so less cash is paid.'
      D: 'You picked eighteen thousand two hundred and forty naira. That takes off twenty per cent, not twelve and a half per cent.'
  11:
    moments:
      - section: 'The question'
        say: 'We must name the major advantage of the imprest system of petty cash.'
        write: 'Major advantage of the imprest system ?'
      - section: 'The rule'
        say: 'Under the imprest system, the chief cashier gives the petty cashier a fixed float, called the imprest.'
        write: 'Fixed float = imprest'
      - say: 'At the end of the period the chief cashier refunds exactly what was spent, so the float is back to the same figure.'
        write: 'Refund = amount spent ⇒ float restored'
      - section: 'The advantage'
        say: 'The petty cashier now makes all the small payments. So the chief cashier is freed from paying out many small sums, and can deal with the large payments.'
        write: 'Chief cashier freed from petty payments'
      - section: 'Answer'
        say: 'So the major advantage is that it relieves the chief cashier of the numerous petty cash payments, which is option C.'
        write: '$\therefore$ relieves the chief cashier of petty payments'
        answer: true
    traps:
      A: 'You chose removes the need to check petty cash spending. The imprest makes checking easier, but it never removes it.'
      B: 'You went for training young accountants. That may happen, but it is not the purpose of the imprest.'
      D: 'You picked an analysis column. Analysis columns belong to the petty cash book layout, not to the imprest itself.'
  12:
    moments:
      - section: 'The question'
        say: 'We must say which side or sides of the petty cash book carry entries.'
        write: 'Petty cash book records on which side ?'
      - section: 'The rule'
        say: 'Like any cash account, the petty cash book has a debit side for money received and a credit side for money paid out.'
        write: 'Dr money in, Cr money out'
      - section: 'The working'
        say: 'The float received from the chief cashier, say ten thousand naira, goes on the debit side.'
        write: 'Dr Cash from chief cashier ₦10,000'
      - say: 'Payments such as transport of one thousand five hundred naira and postage of eight hundred naira go on the credit side.'
        write: 'Cr Transport ₦1,500, Cr Postage ₦800'
      - section: 'Answer'
        say: 'So the petty cash book records on both the credit and debit sides, which is option C.'
        write: '$\therefore$ both the credit and debit sides'
        answer: true
    traps:
      A: 'You chose the debit side only. The payments, which are most of the entries, go on the credit side.'
      B: 'You went for the credit side only. The float and its refills are received on the debit side.'
      D: 'You picked reversed entry. That is a type of error, not a way of keeping the petty cash book.'
  13:
    moments:
      - section: 'The question'
        say: 'We must find how head office guards against fraud with the cash its branches send in.'
        write: 'Head office guard on branch cash ?'
      - section: 'The rule'
        say: 'The branch sells only for cash and banks all its takings, untouched, into the head office account.'
        write: 'Branch sells for cash, banks it all'
      - say: 'Credit sales are made only by head office, or with its approval.'
        write: 'Credit sales by head office only'
      - section: 'Why it works'
        say: 'If the branch could sell on credit by itself, a dishonest manager could keep the cash and call it a credit sale to a customer who never pays.'
        write: 'Branch credit sales ⇒ cash can be hidden'
      - say: 'With credit left to head office, every branch sale must show up as cash banked, so goods sent and cash banked can be checked against each other.'
        write: 'Goods sent ⇔ cash banked'
      - section: 'Answer'
        say: 'So the guard is credit sales by only the headquarters, which is option D.'
        write: '$\therefore$ credit sales by only the headquarters'
        answer: true
    traps:
      A: 'You chose letting the branch pay its expenses out of its takings. Then cash is spent before it is banked, which makes fraud easier to hide, not harder.'
      B: 'You went for direct purchase by the branch. That gives the branch more freedom and weakens control.'
      C: 'You picked a separate accountant for the branch. That person still works at the branch, so takings could still be held back.'
  14:
    moments:
      - section: 'The question'
        say: 'We are given five items and must find which ones go on the debit side of the cash book.'
        write: 'I cash sales, II cash purchases, III discount received, IV cash payments, V cash receipts'
      - section: 'The rule'
        say: 'The debit side of the cash book records money coming in, and the credit side records money going out.'
        write: 'Dr money in, Cr money out'
      - section: 'Sort them'
        say: 'Cash sales and cash receipts bring money in, so they are debits.'
        write: 'I and V ⇒ debit'
      - say: 'Cash purchases and cash payments send money out, so they are credits.'
        write: 'II and IV ⇒ credit'
      - say: 'Discount received is allowed to us when we pay a supplier, so it sits in the discount column on the credit side, beside that payment.'
        write: 'III ⇒ credit side'
      - section: 'Answer'
        say: 'So the debit side records one and five, which is option C.'
        write: '$\therefore$ I and V'
        answer: true
    traps:
      A: 'You chose one and two. Cash purchases send money out, so they are credited.'
      B: 'You went for one and three. Discount received sits beside the payment on the credit side.'
      D: 'You picked one and four. Cash payments send money out, so they are credited.'
  15:
    moments:
      - section: 'The question'
        say: 'We must name an item the bank has credited on its statement, but the firm has not yet written in its cash book.'
        write: 'Credited by the bank, not yet in the cash book ?'
      - section: 'The rule'
        say: 'The bank credits the account when money comes in. A customer can pay straight into the firm''s account without telling the firm.'
        write: 'Money in without notice ⇒ bank credit'
      - say: 'That payment is a direct deposit, also called a credit transfer.'
        write: 'Direct deposit = credit transfer'
      - section: 'The working'
        say: 'When the statement shows a direct deposit of forty five thousand naira, the firm debits its cash book to bring it up to date.'
        write: 'Dr Cash book ₦45,000 (adjusted cash book)'
      - section: 'Answer'
        say: 'So the item credited by the bank but not yet in the cash book is a direct deposit, which is option D.'
        write: '$\therefore$ direct deposit'
        answer: true
    traps:
      A: 'You chose bank charges. Charges take money out of the account, so the bank debits them, not credits them.'
      B: 'You went for contract payment. That is a payment the firm makes and writes in its own cash book.'
      C: 'You picked standing order. A standing order pays money out of the account, so it is a debit on the statement.'
  16:
    moments:
      - section: 'The question'
        say: 'We must pick the formula for depreciation by the straight line method.'
        write: 'Straight line depreciation formula ?'
      - section: 'The rule'
        say: 'Depreciation is the part of an asset''s cost used up each year. The straight line method takes the cost, less the scrap value the asset will fetch at the end, and shares it equally over its useful life.'
        write: '$\text{Depreciation} = \dfrac{\text{Cost} - \text{Scrap value}}{\text{Useful life}}$'
      - section: 'Example'
        say: 'A generator costs five hundred thousand naira, its scrap value is fifty thousand naira, and it lasts five years.'
        write: 'Cost ₦500,000, scrap ₦50,000, life 5 years'
      - say: 'Five hundred thousand minus fifty thousand is four hundred and fifty thousand. Divided by five, that is ninety thousand naira a year.'
        write: '$\dfrac{500{,}000 - 50{,}000}{5} = 90{,}000$'
      - section: 'Answer'
        say: 'So the formula is cost minus scrap value, over useful life, which is option B.'
        write: '$\therefore \dfrac{\text{Cost} - \text{Scrap value}}{\text{Useful life}}$'
        answer: true
    traps:
      A: 'You chose scrap value plus sales. Depreciation starts from cost, and the scrap value is taken away, not added.'
      C: 'You went for sales minus scrap value. Sales have nothing to do with depreciation. We start from the cost of the asset.'
      D: 'You picked purchases plus sales. Those belong to the trading account, not to depreciation.'
  17:
    moments:
      - section: 'The question'
        say: 'We must say what the trading account mainly shows.'
        write: 'Main focus of the trading account ?'
      - section: 'The rule'
        say: 'The trading account sets the cost of goods sold against net sales to find gross profit, also called gross margin.'
        write: '$\text{Gross profit} = \text{Net sales} - \text{Cost of goods sold}$'
      - say: 'Expenses like rent and wages come later, in the profit and loss account, to give net profit.'
        write: 'Then less expenses ⇒ net profit'
      - section: 'Example'
        say: 'For example, goods that cost three hundred and fifty thousand naira and sell for five hundred thousand naira give a gross profit of one hundred and fifty thousand naira.'
        write: '₦500,000 − ₦350,000 = ₦150,000'
      - section: 'Answer'
        say: 'So the trading account mainly shows the gross margin, which is option B.'
        write: '$\therefore$ gross margin'
        answer: true
    traps:
      A: 'You chose net profit. That comes in the profit and loss account, after the expenses.'
      C: 'You went for total purchases. Purchases are one figure in the trading account, not its purpose.'
      D: 'You picked total sales. Sales are entered there, but the aim is the profit on them.'
  18:
    moments:
      - section: 'The question'
        say: 'Goods were bought from Tanko for nine thousand naira, with a cash discount of five per cent for prompt payment. Payment was prompt, and we must find the amount paid.'
        write: 'Cost ₦9,000, cash discount 5%'
      - section: 'The rule'
        say: 'Cash paid equals the invoice amount minus the discount.'
        write: '$\text{Cash paid} = \text{Invoice} - \text{Discount}$'
      - section: 'The discount'
        say: 'Five per cent means five out of every hundred. So we multiply nine thousand naira by five and divide by one hundred, which gives four hundred and fifty naira.'
        write: '₦9,000 × 5% = ₦450'
      - section: 'Cash paid'
        say: 'Nine thousand minus four hundred and fifty is eight thousand five hundred and fifty naira.'
        write: '₦9,000 − ₦450 = ₦8,550'
      - section: 'Answer'
        say: 'So the amount paid is eight thousand five hundred and fifty naira, which is option B.'
        write: '$\therefore$ ₦8,550'
        answer: true
    traps:
      A: 'You chose four thousand five hundred naira. That takes off half the invoice, not five per cent.'
      C: 'You went for nine thousand naira. That ignores the discount earned by paying promptly.'
      D: 'You picked nine thousand four hundred and fifty naira. That adds the discount instead of taking it off.'
  19:
    moments:
      - section: 'The question'
        say: 'Machine X cost six hundred thousand naira, will last five years, and has a scrap value of fifty thousand naira. We must find the straight line depreciation for two years.'
        write: 'Cost ₦600,000, life 5 years, scrap ₦50,000, find 2 years'' depreciation'
      - section: 'The rule'
        say: 'Depreciation per year is cost minus scrap value, divided by the useful life.'
        write: '$\text{Depreciation} = \dfrac{\text{Cost} - \text{Scrap value}}{\text{Useful life}}$'
      - section: 'Take off scrap'
        say: 'Six hundred thousand minus fifty thousand is five hundred and fifty thousand naira.'
        write: '600,000 − 50,000 = 550,000'
      - section: 'Per year'
        say: 'Five hundred and fifty thousand divided by five is one hundred and ten thousand naira a year.'
        write: '550,000 ÷ 5 = ₦110,000 a year'
      - section: 'Two years'
        say: 'The charge is the same each year, so two years is two times one hundred and ten thousand, which is two hundred and twenty thousand naira.'
        write: '2 × 110,000 = ₦220,000'
      - section: 'Answer'
        say: 'So the depreciation for two years is two hundred and twenty thousand naira, which is option C.'
        write: '$\therefore$ ₦220,000'
        answer: true
    traps:
      A: 'You chose seven hundred thousand naira. That is more than the machine cost, so it cannot be two years of its depreciation.'
      B: 'You went for two hundred and forty thousand naira. That divides the full six hundred thousand by five and doubles it, without taking off the scrap value first.'
      D: 'You picked two hundred and two thousand naira. The yearly charge is one hundred and ten thousand naira, so two years give two hundred and twenty thousand.'
  20:
    moments:
      - section: 'The question'
        say: 'We are given six balance sheet items, and we must find the total of the current assets.'
        write: 'Creditors 7,940, prepaid 290, accrued 323, stock 4,500, cash 4,956, debtors 905'
      - section: 'The rule'
        say: 'Current assets are things the business owns that turn into cash, or are used up, within a year. Here they are stock, debtors, prepaid expenses and cash.'
        write: 'Stock, debtors, prepaid expenses, cash'
