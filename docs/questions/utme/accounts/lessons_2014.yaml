      - section: 'Name it'
        say: 'This is recording the cash received on an issue of shares.'
        write: 'Cash on share issue'
      - section: 'The rule'
        say: 'Cash received is debited in the cash book, at the full price paid.'
        write: 'Cash in ⇒ Dr cash book'
      - section: 'Cash received'
        say: 'Eight hundred thousand shares times one naira is eight hundred thousand naira.'
        write: '800,000 × ₦1 = ₦800,000'
      - section: 'The other side'
        say: 'Share capital takes the nominal value, eight hundred thousand times fifty kobo, which is four hundred thousand naira.'
        write: 'Cr Share capital 800,000 × 50k = ₦400,000'
      - say: 'Share premium takes the other fifty kobo a share, which is four hundred thousand naira.'
        write: 'Cr Share premium ₦400,000'
      - section: 'Check'
        say: 'Four hundred thousand plus four hundred thousand is eight hundred thousand, so the entry balances.'
        write: '400,000 + 400,000 = 800,000 ✓'
      - section: 'Remember'
        say: 'Remember, cash in means debit the cash book with the full price paid.'
        write: 'Debit cash with the full price'
      - section: 'Answer'
        say: 'So the entry in the cash book is debit eight hundred thousand naira, which is option D.'
        write: '$\therefore$ Dr ₦800,000'
        answer: true
