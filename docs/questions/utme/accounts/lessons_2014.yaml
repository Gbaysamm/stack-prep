      - section: 'The question'
        say: 'A company has two founding documents. Which one states how much share capital it may issue?'
        write: 'Authorised share capital is stated in ?'
      - section: 'Name it'
        say: 'This is the Memorandum of Association.'
        write: 'Memorandum of Association'
      - section: 'The rule'
        say: 'The memorandum sets out the company''s relationship with the outside world. It gives the name, the objects, limited liability and the share capital.'
        write: 'Name, objects, liability, capital clause'
      - say: 'The articles of association deal with internal rules, like meetings and directors'' powers.'
        write: 'Articles = internal rules'
      - section: 'Example'
        say: 'A memorandum may say the share capital is ten million naira, in ten million ordinary shares of one naira each.'
        write: '₦10,000,000 in 10,000,000 shares of ₦1'
      - section: 'In Nigeria'
        say: 'A new company files its memorandum at the Corporate Affairs Commission. Under the old Act this was the authorised share capital, and since CAMA twenty twenty it is called the minimum issued share capital.'
        write: 'CAC filing, CAMA 1990 then CAMA 2020'
      - section: 'Remember'
        say: 'Remember, the memorandum faces the outside world, and the articles face inside.'
        write: 'Memorandum outside, articles inside'
      - section: 'Answer'
        say: 'So the share capital a company may issue is in the Memorandum of Association, which is option C.'
        write: '$\therefore$ Memorandum of Association'
        answer: true
    traps:
      A: 'You chose the Articles of Association. They cover internal rules, not the capital clause.'
      B: 'You went for the Companies and Allied Matters Act. That law governs all companies, not one company''s capital.'
      D: 'You picked a share certificate. That shows one member''s holding, not what the company may issue.'
  46:
    moments:
