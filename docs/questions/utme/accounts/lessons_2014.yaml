      A: 'You chose debit four hundred thousand naira. That is only the nominal value. The cash includes the premium.'
      B: 'You went for debit one million six hundred thousand naira. That doubles the number of shares.'
      C: 'You picked credit eight hundred thousand naira. Cash received is a debit in the cash book, not a credit.'
