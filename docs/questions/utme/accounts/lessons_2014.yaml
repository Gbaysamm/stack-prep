  50:
    moments:
      - section: 'The question'
        say: 'A business keeps one set of books for its owner. Government keeps many. What is that method called?'
        write: 'Self-balancing books per fund = ?'
      - section: 'Name it'
        say: 'This is fund accounting, the method used in government accounts.'
        write: 'Fund accounting'
      - section: 'The rule'
        say: 'Each fund is treated as a separate entity with its own self balancing books, instead of one owner''s entity.'
        write: 'Each fund = its own entity, own books'
      - section: 'How it works'
        say: 'The Consolidated Revenue Fund, the Development Fund and the Contingencies Fund each have their own receipts, payments and balances.'
        write: 'CRF, Development Fund, Contingencies Fund'
      - section: 'In Nigeria'
        say: 'A state government keeps its roads fund apart from its education fund, so the House of Assembly can see each was spent as approved.'
        write: 'Roads fund apart from education fund'
      - section: 'Remember'
        say: 'Remember, a fund is its own little business with its own books.'
        write: 'Fund = its own books'
      - section: 'Answer'
        say: 'So the method is fund accounting, which is option B.'
        write: '$\therefore$ fund accounting'
        answer: true
