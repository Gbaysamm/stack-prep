        say: 'A furniture maker in Abeokuta takes an order in March, delivers in May and is paid in July. The sale is realized in May.'
        write: 'March order, May delivery, July cash ⇒ May'
      - section: 'Remember'
        say: 'Remember, the sale is real at delivery.'
        write: 'Real at delivery'
      - section: 'Answer'
        say: 'So the concept is realization, which is option D.'
        write: '$\therefore$ realization'
        answer: true
    traps:
