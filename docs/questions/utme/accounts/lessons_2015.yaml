        write: 'Realization concept'
      - section: 'The rule'
        say: 'Revenue is recognized when it is earned, which is when the goods pass to the buyer and he takes on the debt.'
        write: 'Revenue earned when goods pass to the buyer'
      - section: 'Not the order, not the cash'
