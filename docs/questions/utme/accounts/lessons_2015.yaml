# UTME 2015 Principles of Accounts, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Nigerian Accounts teacher works on the
# board: the question, the account, rule or concept named, the rule in plain words, the working
# (the double entry, the T account, or the calculation with data, formula, working and check), a
# Nigerian example, a way to remember it, and the answer moment that names the option.
#
#   say:     heard, not read. Abbreviations as letters or words ("I C A N", "brought down"),
#            money in words, percentages as "per cent", no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2015.yaml. Answers match that file. This paper
# has no paper-type question, so all 40 questions have a lesson.
format_version: 1
exam_year: 2015
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'A business may last fifty years, but its owners want results every year. How do accountants cut its life into pieces?'
        write: 'Accounting period = ?'
      - section: 'Name it'
        say: 'This is the accounting period, the stretch of time each set of final accounts covers.'
        write: 'Accounting period (periodicity concept)'
      - section: 'The rule'
        say: 'The life of the business is cut into equal periods, usually one year, and a set of financial statements is prepared for each one.'
        write: 'One period, usually 12 months ⇒ one set of financial statements'
      - section: 'How it works'
        say: 'The profit and loss account shows the profit for the period, and the balance sheet shows the position on its last day.'
        write: 'P and L = the year''s profit.  Balance sheet = the last day'
      - section: 'In Nigeria'
        say: 'A bakery in Ibadan runs its year from first January to thirty-first December, and every December it closes its books to see that year''s profit.'
        write: '1 Jan to 31 Dec ⇒ the bakery''s accounting year'
      - section: 'Remember'
        say: 'Remember, one period gives one set of statements, and a period is usually twelve months.'
        write: 'One period = one set of statements'
      - section: 'Answer'
        say: 'So the accounting period is the time span, usually one year, covered by the financial statements, which is option B.'
        write: '$\therefore$ the time span covered by the financial statements'
        answer: true
    traps:
      A: 'You chose the period debtors have to pay. That is the credit period, often a month, not the accounting period.'
      C: 'You went for the time taxes are paid. Tax follows the year''s profit, but the accounting period is the time the statements cover.'
      D: 'You picked the budget period. A budget plans the future, while the accounting period reports on the past year.'
  2:
    moments:
      - section: 'The question'
        say: 'A sale is made in December but paid for in January. Which month does it belong to? One concept decides.'
        write: 'Revenue and expenses assigned to their period = ?'
      - section: 'Name it'
        say: 'This is the matching concept, which works hand in hand with the accruals concept.'
        write: 'Matching concept'
      - section: 'The rule'
        say: 'The revenue of a period is matched with the expenses incurred to earn it in that same period, whether or not cash has moved.'
        write: 'Profit = revenue of the period − expenses of the same period'
      - section: 'How it works'
        say: 'That is why accountants adjust for accruals and prepayments at the year end.'
        write: 'Accruals and prepayments ⇒ each cost in its own period'
      - section: 'In Nigeria'
        say: 'A pharmacy in Enugu sells drugs worth three hundred thousand naira in December and owes twenty thousand naira of December wages, paid in January. Both belong to December.'
        write: 'December sales ₦300,000 matched with December wages ₦20,000'
      - section: 'Remember'
        say: 'Remember, match the sale with the cost that earned it, in the same period.'
        write: 'Same period, sale and cost together'
      - section: 'Answer'
        say: 'So this is the matching concept, which is option A.'
        write: '$\therefore$ matching concept'
        answer: true
    traps:
      B: 'You chose consistency. Consistency means using the same methods every year. It does not say which period a revenue belongs to.'
      C: 'You went for adjusting for revenue. Adjusting is a step we take because of matching, but it is not the concept itself.'
      D: 'You picked passing of entries. That simply means recording transactions in the books.'
  3:
    moments:
      - section: 'The question'
        say: 'Who should a good accounting system serve? Let us find the option that covers everyone it must serve.'
        write: 'An effective accounting system provides information ?'
      - section: 'Name it'
        say: 'This is about the users of accounting information.'
        write: 'Users of accounting information'
      - section: 'The rule'
        say: 'Accounting serves internal users, the managers, and external users, the third parties such as owners, lenders, creditors and government.'
        write: 'Internal users = managers.  External users = third parties'
      - section: 'How it works'
        say: 'So a good system produces internal reports for managers and external reports for third parties.'
        write: 'Internal reporting + external reporting'
      - section: 'In Nigeria'
        say: 'A Kano textile company prepares monthly cost reports for its managers and yearly audited accounts for its shareholders, its bank and the tax office.'
        write: 'Managers ⇐ monthly reports.  Shareholders, bank, FIRS ⇐ yearly accounts'
      - section: 'Remember'
        say: 'Remember, inside reports are for managers, outside reports are for third parties, and a good system feeds both.'
        write: 'Inside and outside, both fed'
      - section: 'Answer'
        say: 'So it should provide information on internal and external reporting for managers and third parties, which is option D.'
        write: '$\therefore$ internal and external reporting'
        answer: true
    traps:
      A: 'You chose customer feedback. That is a marketing matter, not the output of the accounting system.'
      B: 'You went for new products and methods. Those come from research and production, not from accounting.'
      C: 'You picked a list of some users. It leaves out the owners, lenders and government, the main outside users.'
  4:
    moments:
      - section: 'The question'
        say: 'Some of these are papers from a transaction, and some are books. Which pair are both papers?'
        write: 'Which pair are source documents?'
      - section: 'Name it'
        say: 'Source documents are the first written evidence of a transaction.'
        write: 'Source documents'
      - section: 'The rule'
        say: 'Invoices, credit notes, debit notes, receipts and vouchers are source documents. Journals, the cash book and the ledger are books written up from them.'
        write: 'Documents first ⟶ books after'
      - section: 'Sort them'
        say: 'The sales invoice is a source document, and so is the debit note.'
        write: 'Sales invoice ✓  Debit note ✓'
      - say: 'The cash book, the journals and the ledger are books of account, not source documents.'
        write: 'Cash book ✗  Journals ✗  Ledger ✗'
      - section: 'In Nigeria'
        say: 'A provisions shop in Onitsha files its invoices and debit notes, and the bookkeeper copies them into the day books each evening.'
        write: 'File of invoices and debit notes ⟶ day books'
      - section: 'Remember'
        say: 'Remember, documents come first, and books come after.'
        write: 'Documents first, books after'
      - section: 'Answer'
        say: 'So the pair of source documents is the sales invoice and the debit note, which is option B.'
        write: '$\therefore$ sales invoice and debit note'
        answer: true
    traps:
      A: 'You chose sales invoice and cash book. The invoice is a source document, but the cash book is a book of original entry.'
      C: 'You went for journals and ledger. Both are books written up from the source documents.'
      D: 'You picked cash book and debit note. The debit note is a source document, but the cash book is a book.'
  5:
    moments:
      - section: 'The question'
        say: 'Every deal between two firms leaves paper behind. What is the general name for those papers?'
        write: 'Instruments generated by business transactions = ?'
      - section: 'Name it'
        say: 'These are source documents.'
        write: 'Source documents'
      - section: 'The rule'
        say: 'Every transaction produces a document, and the general name for all of them is source documents. They are the evidence the books are written from.'
        write: 'Transaction ⟶ document ⟶ books'
      - section: 'Examples'
        say: 'Invoices, receipts, credit notes, debit notes, cheque counterfoils and vouchers are all kinds of source document.'
        write: 'Invoice, receipt, credit note, debit note, counterfoil, voucher'
      - section: 'In Nigeria'
        say: 'A trader in Aba gets an invoice when she buys shoes on credit, and a receipt when she pays. Both are source documents.'
        write: 'Invoice + receipt = source documents'
      - section: 'Remember'
        say: 'Remember, source means where it starts, and the record starts from the document.'
        write: 'Source = where the record starts'
      - section: 'Answer'
        say: 'So the instruments are called source documents, which is option B.'
        write: '$\therefore$ source documents'
        answer: true
    traps:
      A: 'You chose invoices. An invoice is only one kind of source document, so it is too narrow.'
      C: 'You went for purchases documents. That is not a general class. A purchase invoice is just one kind of source document.'
      D: 'You picked journals. Journals are books written up from the documents.'
  6:
    moments:
      - section: 'The question'
        say: 'A buyer sends goods back. What does the seller send to say the return has been accepted?'
        write: 'Seller acknowledges goods returned with ?'
      - section: 'Name it'
        say: 'This is the credit note.'
        write: 'Credit note'
      - section: 'The rule'
        say: 'When goods come back, the seller sends a credit note to show the buyer''s account has been credited, so he owes less.'
        write: 'Goods returned ⇒ credit note ⇒ buyer owes less'
      - section: 'The entries'
        say: 'In the seller''s books, debit returns inwards and credit the buyer.'
        write: 'Seller: Dr Returns inwards, Cr Buyer'
      - say: 'In the buyer''s books, debit the seller and credit returns outwards.'
        write: 'Buyer: Dr Seller, Cr Returns outwards'
      - section: 'In Nigeria'
        say: 'A Lagos supermarket returns twenty cartons of spoilt milk, and the distributor sends a credit note for sixty thousand naira.'
        write: '20 cartons back ⇒ credit note ₦60,000'
      - section: 'Remember'
        say: 'Remember, goods come back and credit goes out.'
        write: 'Goods back, credit note out'
      - section: 'Answer'
        say: 'So the seller acknowledges the return with a credit note, which is option C.'
        write: '$\therefore$ credit note'
        answer: true
    traps:
      A: 'You chose an invoice. An invoice charges the buyer for a sale. It does not accept a return.'
      B: 'You went for a debit note. That raises what is owed, or comes from the buyer. The seller answers a return with a credit note.'
      D: 'You picked a voucher. A voucher supports a payment, not a return of goods.'
  7:
    moments:
      - section: 'The question'
        say: 'The oldest accounting body in Nigeria was set up by law. In which year was that law passed?'
        write: 'ICAN Act passed in ?'
      - section: 'Name it'
        say: 'This is I C A N, the Institute of Chartered Accountants of Nigeria.'
        write: 'ICAN = Institute of Chartered Accountants of Nigeria'
      - section: 'The fact'
        say: 'I C A N was established by an Act of Parliament, Act number fifteen of nineteen sixty-five.'
        write: 'Act No. 15 of 1965'
      - section: 'What it does'
        say: 'The Act lets I C A N train, examine, register and discipline chartered accountants.'
        write: 'Train, examine, register, discipline'
      - section: 'The other body'
        say: 'The second body set up by law is A N A N, the Association of National Accountants of Nigeria, by a decree of nineteen ninety-three.'
        write: 'ANAN = Decree No. 76 of 1993'
      - section: 'In Nigeria'
        say: 'A graduate in Abuja who passes the I C A N examinations becomes a chartered accountant.'
        write: 'Pass ICAN exams ⇒ chartered accountant'
      - section: 'Remember'
        say: 'Remember, I C A N came in nineteen sixty-five and A N A N in nineteen ninety-three.'
        write: 'ICAN 1965.  ANAN 1993.'
      - section: 'Answer'
        say: 'So the I C A N Act was passed in nineteen sixty-five, which is option C.'
        write: '$\therefore$ 1965'
        answer: true
    traps:
      A: 'You chose nineteen sixty. That is the year of independence. The I C A N Act came five years later.'
      B: 'You went for nineteen sixty-three, the year Nigeria became a republic. The I C A N Act came in nineteen sixty-five.'
      D: 'You picked nineteen ninety-three. That is the year of the decree that set up A N A N, not I C A N.'
  8:
    moments:
      - section: 'The question'
        say: 'Why do offices insist on a voucher before anyone is paid? Let us find the real advantage.'
        write: 'Advantage of the voucher system = ?'
      - section: 'Name it'
        say: 'This is the voucher system, a way of controlling payments.'
        write: 'Voucher system'
      - section: 'The rule'
        say: 'No payment is made until a payment voucher has been prepared, backed by the invoice, checked, and approved by an officer.'
        write: 'Voucher ⟶ checked ⟶ approved ⟶ paid'
      - section: 'Why it helps'
        say: 'So every expense is reviewed and verified before money leaves, which stops fraud and errors.'
        write: 'Every expense verified before payment'
      - section: 'In Nigeria'
        say: 'In a state ministry, a contractor is paid only after the voucher is raised, checked by the internal auditor and approved.'
        write: 'Ministry contractor paid only on an approved voucher'
      - section: 'Remember'
        say: 'Remember, no voucher, no payment.'
        write: 'No voucher, no payment'
      - section: 'Answer'
        say: 'So the voucher system ensures every expenditure is reviewed and verified before payment, which is option C.'
        write: '$\therefore$ every expenditure reviewed before payment'
        answer: true
    traps:
      A: 'You chose fewer cheques. The voucher system checks payments, but it does not cut the number of cheques.'
      B: 'You went for flexibility. The voucher system is a fixed routine, so it is rigid rather than flexible.'
      D: 'You picked a record of each supplier. That record is kept in the creditors ledger.'
  9:
    moments:
      - section: 'The question'
        say: 'We have eight figures for Aminu and Sons. We must put each on the right side of the purchases ledger control account and add up.'
        write: 'Purchases ledger control account, total of each side = ?'
      - section: 'Name it'
        say: 'The purchases ledger control account is one big account for all the suppliers together.'
        write: 'Purchases ledger control = total of all suppliers'' accounts'
      - section: 'The rule'
        say: 'Things that raise what we owe go on the credit side. Things that lower it, and opening debit balances, go on the debit side.'
        write: 'Cr = opening credit balances, purchases.  Dr = the rest'
      - section: 'Credit side'
        say: 'On the credit side we put the opening credit balances of forty thousand naira and the purchases of five hundred thousand naira.'
        write: 'Cr: ₦40,000 + ₦500,000'
      - say: 'Forty thousand plus five hundred thousand is five hundred and forty thousand naira.'
        write: 'Cr total $= 540{,}000$'
      - section: 'Debit side'
        say: 'The opening debit balance of one thousand naira goes on the debit side, because it is the opposite of an amount owed.'
        write: 'Dr: opening debit balance $1{,}000$'
      - say: 'Returns outwards, cheques paid, promissory notes sent, discount received and the set off each reduce what we owe the suppliers, so each one is a debit.'
        write: 'Dr: $50{,}000 + 400{,}000 + 30{,}000 + 8{,}000 + 2{,}000$'
      - say: 'Now we add all the debit items, one thousand plus those five, and they come to four hundred and ninety-one thousand naira.'
        write: 'Dr items $= 491{,}000$'
      - section: 'Both sides'
        say: 'The debit side is smaller, so the balance carried down is written on it to make it equal to the credit side. That is why each side totals five hundred and forty thousand naira.'
        write: 'Dr items + balance c/d $= 540{,}000 =$ Cr total'
      - section: 'In Nigeria'
        say: 'A building materials dealer in Kaduna checks all his supplier accounts at once with this one control account every month.'
        write: 'One control account checks every supplier'
      - section: 'Remember'
        say: 'Remember, purchases and opening credits raise what we owe, so they sit on the credit side.'
        write: 'Owe more ⇒ credit side'
      - section: 'Answer'
        say: 'So each side of the control account totals five hundred and forty thousand naira, which is option B.'
        write: '$\therefore$ Total $=$ ₦540,000'
        answer: true
    traps:
      A: 'You chose four hundred and eighty thousand naira. That matches neither side. The credit side is forty thousand plus five hundred thousand.'
      C: 'You went for four hundred and ninety thousand naira. That is the debit items without the opening debit balance and the balance carried down.'
      D: 'You picked five hundred thousand naira. That is the purchases alone. The opening credit balances belong on that side too.'
  10:
    moments:
      - section: 'The question'
        say: 'We use the same control account. Now we want the closing balance, the amount still owed to suppliers.'
        write: 'Balance c/d in the purchases ledger control account = ?'
      - section: 'The rule'
        say: 'The balance carried down is the figure that makes the smaller side equal to the bigger side.'
        write: 'Balance c/d = bigger side − smaller side'
      - section: 'Bigger side'
        say: 'The credit side is forty thousand plus five hundred thousand, which is five hundred and forty thousand naira.'
        write: 'Cr total $= 40{,}000 + 500{,}000 = 540{,}000$'
      - section: 'Smaller side'
        say: 'The debit items are one thousand, fifty thousand, four hundred thousand, thirty thousand, eight thousand and two thousand naira.'
        write: 'Dr items $= 1{,}000 + 50{,}000 + 400{,}000 + 30{,}000 + 8{,}000 + 2{,}000$'
      - say: 'Together they come to four hundred and ninety-one thousand naira.'
        write: 'Dr items $= 491{,}000$'
      - section: 'The balance'
        say: 'Five hundred and forty thousand minus four hundred and ninety-one thousand is forty-nine thousand naira.'
        write: '$540{,}000 - 491{,}000 = 49{,}000$'
      - section: 'Check'
        say: 'Four hundred and ninety-one thousand plus forty-nine thousand gives back five hundred and forty thousand, so both sides agree.'
        write: '$491{,}000 + 49{,}000 = 540{,}000$ ✓'
      - section: 'What it tells us'
        say: 'The credit side was bigger, so the forty-nine thousand naira is brought down as a credit balance. It is the amount still owed to the suppliers at the end of February.'
        write: '₦49,000 credit balance = still owed to suppliers'
      - section: 'Remember'
        say: 'Remember, the big side total, less the small side items, gives the balance carried down.'
        write: 'Big total − small items = balance c/d'
      - section: 'Answer'
        say: 'So the balance carried down is forty-nine thousand naira, which is option A.'
        write: '$\therefore$ Balance c/d $=$ ₦49,000'
        answer: true
    traps:
      B: 'You chose two thousand naira. That is the set off against the sales ledger, one of the debit items.'
      C: 'You went for forty thousand naira. That is the opening balance on the first of February, not the closing one.'
      D: 'You picked eight thousand naira. That is the discount received, one of the debit items.'
  11:
    moments:
      - section: 'The question'
        say: 'Five hundred naira of these expenses belongs to next year. Will you remember to take it out?'
        write: 'Sales ₦20,000, cost of sales ₦10,000, expenses ₦2,500 (₦500 prepaid). Net profit = ?'
      - section: 'Name it'
        say: 'We want net profit, with an adjustment for a prepaid expense.'
        write: 'Net profit, with a prepayment'
      - section: 'The rule'
        say: 'Gross profit is sales minus cost of sales. Net profit is gross profit minus the expenses of this period only.'
        write: '$\text{Net profit} = \text{Gross profit} - \text{Expenses of the period}$'
      - section: 'Gross profit'
        say: 'Twenty thousand naira minus ten thousand naira is ten thousand naira.'
        write: 'Gross profit $= 20{,}000 - 10{,}000 = 10{,}000$'
      - section: 'This year''s expenses'
        say: 'A prepaid expense is paid now for a later period. The five hundred naira prepaid is for next year, so we take it out. Two thousand five hundred minus five hundred is two thousand naira.'
        write: 'Expenses $= 2{,}500 - 500 = 2{,}000$'
      - section: 'Net profit'
        say: 'Ten thousand naira minus two thousand naira is eight thousand naira.'
        write: 'Net profit $= 10{,}000 - 2{,}000 = 8{,}000$'
      - section: 'Check'
        say: 'Cost of sales, expenses and profit together, ten thousand plus two thousand plus eight thousand, give back the twenty thousand naira of sales.'
        write: '$10{,}000 + 2{,}000 + 8{,}000 = 20{,}000$ ✓'
      - section: 'In Nigeria'
        say: 'A barbing salon in Port Harcourt pays two thousand five hundred naira, but five hundred naira of it is next year''s rent. Only two thousand naira belongs to this year.'
        write: 'Prepaid rent ₦500 ⇒ a current asset, not this year''s cost'
      - section: 'Answer'
        say: 'So the net profit is eight thousand naira, which is option D.'
        write: '$\therefore$ Net profit $=$ ₦8,000'
        answer: true
    traps:
      A: 'You chose seven thousand five hundred naira. That charges the whole two thousand five hundred, including the five hundred naira that belongs to next year.'
      B: 'You went for twelve thousand five hundred naira. That adds the expenses to the gross profit instead of taking them away.'
      C: 'You picked ten thousand naira. That is the gross profit, before any expenses are charged.'
  12:
    moments:
      - section: 'The question'
        say: 'We use the same figures. Now we want the gross profit margin. Is it worked on sales or on cost?'
        write: 'Gross profit margin = ?'
      - section: 'Name it'
        say: 'The gross profit margin is gross profit as a percentage of sales.'
        write: 'Gross profit margin'
      - section: 'The rule'
        say: 'Gross profit margin equals gross profit over sales, times one hundred per cent.'
        write: '$\text{Margin} = \dfrac{\text{Gross profit}}{\text{Sales}} \times 100\%$'
      - section: 'Gross profit'
        say: 'Twenty thousand naira minus ten thousand naira gives a gross profit of ten thousand naira.'
        write: 'Gross profit $= 20{,}000 - 10{,}000 = 10{,}000$'
      - section: 'The margin'
        say: 'Ten thousand over twenty thousand, times one hundred, is fifty per cent.'
        write: '$\dfrac{10{,}000}{20{,}000} \times 100\% = 50\%$'
      - section: 'Check'
        say: 'Half of twenty thousand naira is ten thousand naira, so fifty per cent is right.'
        write: '$\tfrac{1}{2} \times 20{,}000 = 10{,}000$ ✓'
      - section: 'Remember'
        say: 'Remember, margin is on sales, and mark up is on cost.'
        write: 'Margin ÷ sales.  Mark-up ÷ cost.'
      - section: 'Answer'
        say: 'So the gross profit margin is fifty per cent, which is option A.'
        write: '$\therefore$ Gross profit margin $= 50\%$'
        answer: true
    traps:
      B: 'You chose forty per cent. That is the net profit margin, eight thousand over twenty thousand, not the gross margin.'
      C: 'You went for thirty per cent. That does not come from these figures. The gross profit is half of sales.'
      D: 'You picked one hundred per cent. That divides by cost of sales, which gives the mark up, not the margin.'
  13:
    moments:
      - section: 'The question'
        say: 'What are accounting reports really about? Are they about the people who read them, or something else?'
        write: 'Main objective of accounting reports = information about ?'
      - section: 'Name it'
        say: 'This is the objective of financial reports.'
        write: 'Objective of financial reporting'
      - section: 'The rule'
        say: 'Accounting reports give information about the entity''s economic resources, the claims against them, and how they changed in the period.'
        write: 'Resources + claims on them + changes in them'
      - section: 'How it works'
        say: 'The balance sheet shows the resources and the claims, and the profit and loss account shows how they grew or fell through trading.'
        write: 'Balance sheet = resources and claims.  P and L = change'
      - section: 'In Nigeria'
        say: 'A bank reading the accounts of a Lagos food company asks what it owns, what it owes and whether it makes profit. The reports answer that.'
        write: 'Bank asks: owns? owes? profit?'
      - section: 'Remember'
        say: 'Remember, the reports are about the resources, and they are for the users.'
        write: 'About resources, for users'
      - section: 'Answer'
        say: 'So the main objective is to provide information about a company''s economic resources, which is option C.'
        write: '$\therefore$ a company''s economic resources'
        answer: true
    traps:
      A: 'You chose the shareholders. Shareholders read the reports, but the reports are not about them.'
      B: 'You went for the efficacy of assets. That is judged from the reports, but it is only a small part of what they cover.'
      D: 'You picked the management structure. That is shown on an organization chart, not in the accounting reports.'
  14:
    moments:
      - section: 'The question'
        say: 'We know the liabilities, the equity and the other assets. Can the accounting equation find the cash?'
        write: 'Liabilities ₦12,045, other assets ₦36,800, equity ₦26,896. Cash = ?'
      - section: 'The rule'
        say: 'The accounting equation says assets equal liabilities plus equity.'
        write: '$\text{Assets} = \text{Liabilities} + \text{Equity}$'
      - section: 'Total assets'
        say: 'So total assets equal the liabilities plus the equity. Twelve thousand and forty-five plus twenty-six thousand eight hundred and ninety-six is thirty-eight thousand nine hundred and forty-one naira.'
        write: 'Total assets $= 12{,}045 + 26{,}896 = 38{,}941$'
      - section: 'The cash'
        say: 'Cash and the other assets together make up the total assets, so cash is total assets minus the other assets.'
        write: '$\text{Cash} = \text{Total assets} - \text{Other assets}$'
      - say: 'Thirty-eight thousand nine hundred and forty-one minus thirty-six thousand eight hundred is two thousand one hundred and forty-one naira.'
        write: '$38{,}941 - 36{,}800 = 2{,}141$'
      - section: 'Check'
        say: 'Thirty-six thousand eight hundred plus two thousand one hundred and forty-one gives back thirty-eight thousand nine hundred and forty-one, so the equation balances.'
        write: '$36{,}800 + 2{,}141 = 38{,}941$ ✓'
      - section: 'Remember'
        say: 'Remember, what you have equals what you owe plus what is yours.'
        write: 'Have = owe + own'
      - section: 'Answer'
        say: 'So the cash in hand is two thousand one hundred and forty-one naira, which is option D.'
        write: '$\therefore$ Cash $=$ ₦2,141'
        answer: true
    traps:
      A: 'You chose two thousand two hundred and forty-one naira. Add it to the other assets and you get more than thirty-eight thousand nine hundred and forty-one.'
      B: 'You went for two thousand two hundred and fourteen naira. That makes total assets too big, so the equation does not balance.'
      C: 'You picked two thousand one hundred and fourteen naira. That makes total assets too small by twenty-seven naira.'
  15:
    moments:
      - section: 'The question'
        say: 'A customer will never pay. At the year end, where does the bad debts account go?'
