    moments:
      - section: 'The question'
        say: 'Here is a cash book with money in and money out. What is the balance, and which side is it?'
        write: 'Balance on the cash book = ?'
      - section: 'The rule'
        say: 'Add both sides. The difference is carried down on the smaller side and brought down on the bigger side, which names the balance.'
        write: 'Bigger side names the balance'
      - section: 'Debit side'
        say: 'Two thousand six hundred plus twenty-eight thousand two hundred is thirty thousand eight hundred naira.'
        write: 'Dr $= 2{,}600 + 28{,}200 = 30{,}800$'
      - section: 'Credit side'
        say: 'Fifteen thousand plus one thousand two hundred and fifty plus seven thousand six hundred is twenty-three thousand eight hundred and fifty naira.'
        write: 'Cr $= 15{,}000 + 1{,}250 + 7{,}600 = 23{,}850$'
      - section: 'The balance'
        say: 'Thirty thousand eight hundred minus twenty-three thousand eight hundred and fifty is six thousand nine hundred and fifty naira.'
        write: '$30{,}800 - 23{,}850 = 6{,}950$'
      - section: 'Which side'
        say: 'The debit side is bigger, so the balance comes down on the debit side. It is a debit balance, money in hand.'
        write: 'Balance b/d ₦6,950 on the Dr side'
      - section: 'Check'
        say: 'Twenty-three thousand eight hundred and fifty plus six thousand nine hundred and fifty gives thirty thousand eight hundred.'
        write: '$23{,}850 + 6{,}950 = 30{,}800$ ✓'
      - section: 'Remember'
        say: 'Remember, more money in than out gives a debit balance.'
        write: 'In > out ⇒ debit balance'
      - section: 'Answer'
        say: 'So the balance is six thousand nine hundred and fifty naira debit, which is option D.'
        write: '$\therefore$ ₦6,950 debit'
        answer: true
    traps:
      A: 'You chose six thousand nine hundred and fifty naira credit. The figure is right, but more came in than went out, so the balance is debit.'
      B: 'You went for six thousand naira credit. That is not the difference between the two sides, and the balance is debit.'
      C: 'You picked six thousand naira debit. The side is right, but the difference is six thousand nine hundred and fifty naira.'
