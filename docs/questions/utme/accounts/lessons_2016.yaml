  38:
    moments:
      - section: 'The question'
        say: 'Money received from a person is entered on the debit side of the cash book. We must say where the corresponding entry goes.'
        write: 'Debit side of the cash book ⇒ corresponding entry $= ?$'
      - section: 'Name it'
        say: 'This is the double entry for cash received from a person.'
        write: 'Cash received from a debtor'
      - section: 'The rule'
        say: 'The cash book is itself a ledger account. Every debit in it needs a credit in another ledger account, here the person''s own account.'
        write: 'Dr in the cash book ⇒ Cr in the ledger'
      - section: 'An example'
        say: 'Musa, who owes us, pays eight thousand naira. We debit the cash book and credit Musa''s account in the ledger.'
        write: 'Dr Cash ₦8,000, Cr Musa ₦8,000'
      - section: 'Remember'
        say: 'Remember, debit the receiver and credit the giver. Musa gave, so Musa is credited.'
        write: 'Debit the receiver, credit the giver'
      - section: 'Answer'
        say: 'So the corresponding entry is to credit the ledger, which is option A.'
        write: '$\therefore$ credit the ledger'
        answer: true
    traps:
      B: 'You chose real accounts. The payer is a person, so his personal account is credited, not an asset account.'
      C: 'You went for debit real accounts. The cash book was debited, so the other entry must be a credit.'
      D: 'You picked debit the ledger. The cash book was debited, so the other entry must be a credit.'
  39:
    moments:
      - section: 'The question'
        say: 'We must choose the formula for depreciation by the straight line method.'
        write: 'Straight line depreciation formula $= ?$'
      - section: 'Name it'
        say: 'The straight line method spreads an asset''s cost evenly over its useful life, so the charge is the same each year.'
        write: 'Straight line = equal charge each year'
      - section: 'The rule'
        say: 'Annual depreciation equals cost minus scrap value, all over useful life.'
        write: 'Depreciation $= \dfrac{\text{Cost} - \text{Scrap value}}{\text{Useful life}}$'
      - section: 'Why scrap value'
        say: 'The scrap value is what the asset still fetches at the end, so it is not used up and is taken off first.'
        write: 'Scrap value is not used up'
      - section: 'An example'
        say: 'A machine costing six hundred thousand naira, with fifty thousand naira scrap value and a five year life, gives one hundred and ten thousand naira a year.'
        write: '$\dfrac{600{,}000 - 50{,}000}{5} = 110{,}000$'
      - section: 'Remember'
        say: 'Remember, it is cost minus scrap, over life.'
        write: 'Cost − scrap, over life'
      - section: 'Answer'
        say: 'So the formula is cost minus scrap value over useful life, which is option C.'
        write: '$\therefore \dfrac{\text{Cost} - \text{Scrap value}}{\text{Useful life}}$'
        answer: true
    traps:
      A: 'You chose scrap value plus sales. Depreciation uses the asset''s cost, and scrap value is taken off, not added.'
      B: 'You went for sales minus scrap value. It uses sales where the asset''s cost belongs.'
      D: 'You picked purchases plus sales. Those are trading figures, not the cost of the asset.'
  40:
    moments:
      - section: 'The question'
        say: 'We must say what the trading account is mainly there to show.'
        write: 'Major focus of the trading account $= ?$'
      - section: 'Name it'
        say: 'The trading account is the first part of the final accounts.'
        write: 'Trading account'
      - section: 'The rule'
        say: 'It compares net sales with the cost of goods sold to find the gross profit, also called the gross margin.'
        write: 'Gross profit = Net sales − Cost of goods sold'
      - section: 'What comes next'
        say: 'The profit and loss account then takes off the expenses to find the net profit.'
        write: 'P and L ⇒ net profit'
      - section: 'Remember'
        say: 'Remember, trading gives gross, and profit and loss gives net.'
        write: 'Trading ⇒ gross.  P and L ⇒ net'
      - section: 'Answer'
        say: 'So the major focus of the trading account is to show the gross margin, which is option C.'
        write: '$\therefore$ gross margin'
        answer: true
    traps:
      A: 'You chose net profit. Net profit comes after the expenses, in the profit and loss account.'
      B: 'You went for total purchases. Purchases appear in the trading account, but showing them is not its purpose.'
      D: 'You picked total sales. Sales appear there too, but the account is there to find the gross profit.'
