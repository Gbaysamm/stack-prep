        write: 'Capital expenditure ⇒ fixed assets'
      - section: 'The rule'
        say: 'Buying or improving a fixed asset is capital expenditure. Running costs used up within the year are revenue expenditure.'
        write: 'Buy the asset ⇒ capital.  Run it ⇒ revenue'
      - section: 'Sort the options'
        say: 'Office machinery is used for years. Maintenance, stationery and carriage inwards are used up in the year.'
        write: 'Machinery ⇒ capital.  Maintenance, stationery, carriage ⇒ revenue'
      - section: 'Remember'
        say: 'Remember, buying the machine is capital, and keeping it running is revenue.'
        write: 'Buy ⇒ capital, run ⇒ revenue'
