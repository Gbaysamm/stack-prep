        say: 'From the trading account, gross profit is net sales of three hundred and seventy thousand minus cost of goods sold of two hundred and thirty thousand, which is one hundred and forty thousand naira.'
        write: 'Gross profit $= 370{,}000 - 230{,}000 = 140{,}000$'
      - section: 'Net profit'
        say: 'One hundred and forty thousand minus the rent of thirty-five thousand is one hundred and five thousand naira.'
        write: 'Net profit $= 140{,}000 - 35{,}000 = 105{,}000$'
      - section: 'Remember'
        say: 'Remember, gross profit less every expense gives net profit.'
        write: 'Gross − expenses = net'
