# UTME 2016 Principles of Accounts, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Nigerian Accounts teacher works on the
# board: the question, the account, rule or concept named, the rule in plain words, the working
# (the double entry, the T account, or the calculation with data, formula, working and check), a
# Nigerian example, a way to remember it, and the answer moment that names the option.
#
#   say:     heard, not read. Abbreviations as letters or words ("C O T", "brought down"),
#            money in words, percentages as "per cent", no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2016.yaml. Answers match that file. This paper
# has no paper-type question, so all 40 questions have a lesson.
format_version: 1
exam_year: 2016
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'Ada brings a car and Udo brings a building. Do those count as capital, or only the cash? Let us find the capital of Ado and Co.'
        write: 'Capital of Ado and Co. $= ?$'
      - section: 'Name it'
        say: 'The capital of a partnership is everything the partners bring in, in cash or in kind.'
        write: 'Partnership capital = all that the partners bring in'
      - section: 'The rule'
        say: 'Each partner''s capital is his cash plus his assets at their agreed values. The firm''s capital is the partners'' capitals added together.'
        write: 'Firm''s capital = Ada''s capital + Udo''s capital'
      - section: 'Ada'
        say: 'Ada brings twelve thousand naira cash, eighteen thousand naira of furnishings and a seventy thousand naira motor vehicle. That is one hundred thousand naira.'
        write: 'Ada $= 12{,}000 + 18{,}000 + 70{,}000 = 100{,}000$'
      - section: 'Udo'
        say: 'Udo brings ten thousand naira cash, a building of one hundred and five thousand naira and a computer of thirty-five thousand naira. That is one hundred and fifty thousand naira.'
        write: 'Udo $= 10{,}000 + 105{,}000 + 35{,}000 = 150{,}000$'
      - section: 'The firm'
        say: 'One hundred thousand plus one hundred and fifty thousand is two hundred and fifty thousand naira.'
        write: 'Capital $= 100{,}000 + 150{,}000 = 250{,}000$'
      - section: 'Check'
        say: 'Let us check by adding it another way. The cash is Ada''s twelve thousand plus Udo''s ten thousand, which is twenty-two thousand naira, and the other assets come to two hundred and twenty-eight thousand naira. Together that is two hundred and fifty thousand naira again.'
        write: '$22{,}000 + 228{,}000 = 250{,}000$ ✓'
      - section: 'In Nigeria'
        say: 'Two lawyers opening chambers in Abuja may bring cash, law books, a car and an office. Every item is valued and credited to its owner''s capital.'
        write: 'Cash, books, car, office ⇒ all capital'
      - section: 'Remember'
        say: 'Remember, capital is not only cash. Count everything each partner brings.'
        write: 'Capital = cash + assets brought in'
      - section: 'Answer'
        say: 'So the capital of Ado and Co. is two hundred and fifty thousand naira, which is option C.'
        write: '$\therefore$ Capital $=$ ₦250,000'
        answer: true
    traps:
      A: 'You chose one hundred thousand naira. That is Ada''s capital alone. Udo''s one hundred and fifty thousand naira belongs to the firm too.'
      B: 'You went for twenty-two thousand naira. That is only the cash. The car, building, furnishings and computer are capital as well.'
      D: 'You picked one hundred and fifty thousand naira. That is Udo''s capital alone. Add Ada''s share as well.'
  2:
    moments:
      - section: 'The question'
        say: 'Ada and Udo share profits in the ratio of their capitals. Whose number comes first, and does it matter? It does.'
        write: 'Profit-sharing ratio, Ada to Udo, by capital $= ?$'
      - section: 'Name it'
        say: 'This is a profit-sharing ratio based on capital, one of the terms a partnership deed can set.'
        write: 'Profit-sharing ratio = ratio of capitals'
      - section: 'The capitals'
        say: 'From the last question, Ada brought one hundred thousand naira and Udo brought one hundred and fifty thousand naira.'
        write: 'Ada $100{,}000$, Udo $150{,}000$'
      - section: 'The ratio'
        say: 'We write Ada first, because the question names Ada first. So it is one hundred thousand to one hundred and fifty thousand.'
        write: 'Ada : Udo $= 100{,}000 : 150{,}000$'
      - say: 'Now we reduce it. Fifty thousand is the largest number that divides both, so we divide both by fifty thousand, and we get two to three.'
        write: '$= 2 : 3$'
      - section: 'Check'
        say: 'Two to three makes five parts in all, and Ada has two of them, so her share is two fifths. Two fifths of two hundred and fifty thousand naira is one hundred thousand naira, which is Ada''s capital.'
        write: '$\dfrac{2}{5} \times 250{,}000 = 100{,}000$ ✓'
      - section: 'In Nigeria'
        say: 'If the Abuja law firm makes fifty thousand naira profit, Ada takes twenty thousand naira and Udo takes thirty thousand naira.'
        write: '₦50,000 profit ⇒ Ada ₦20,000, Udo ₦30,000'
      - section: 'Remember'
        say: 'Remember, keep the names in the order the question gives, then reduce.'
        write: 'Same order as the names, then reduce'
      - section: 'Answer'
        say: 'So the ratio is two to three, which is option B.'
        write: '$\therefore$ 2:3'
        answer: true
    traps:
      A: 'You chose three to two. Those are the right numbers the wrong way round. Ada brought less, so her share is the smaller one.'
      C: 'You went for one to two. That would need Udo to bring twice Ada''s capital, which is two hundred thousand naira.'
      D: 'You picked two to one. That would need Ada to bring twice Udo''s capital, which she did not.'
  3:
    moments:
      - section: 'The question'
        say: 'Every sale changes the balance sheet. Must a trader draw a new balance sheet after every sale? The ledger answers that.'
        write: 'One major advantage of a ledger = ?'
      - section: 'Name it'
        say: 'The ledger is the main book of account, where every transaction is posted to its own account.'
        write: 'Ledger = the book of accounts'
      - section: 'The problem'
        say: 'Each transaction changes the accounting equation, so in theory a new balance sheet could follow each one. In a busy business that is impossible.'
        write: 'Assets = Capital + Liabilities, changed by every transaction'
      - section: 'The rule'
        say: 'So each change is posted to ledger accounts, and one balance sheet is drawn up at the end from the balances.'
        write: 'Post to accounts ⇒ one balance sheet at the end'
      - section: 'In Nigeria'
        say: 'A provisions shop in Onitsha may make two hundred sales a day. It posts them to its accounts and prepares one balance sheet at the year end.'
        write: '200 sales a day, 1 balance sheet a year'
      - section: 'Remember'
        say: 'Remember, the ledger collects, and the balance sheet summarises once.'
        write: 'Ledger collects, balance sheet summarises'
      - section: 'Answer'
        say: 'So the ledger removes the need for preparing a balance sheet after each transaction, which is option D.'
        write: '$\therefore$ no balance sheet needed after each transaction'
        answer: true
    traps:
      A: 'You chose a book of original entry. The ledger is the book of final entry. The day books and the journal come first.'
      B: 'You went for shareholders during liquidation. The ledger is used by the business every day, not kept for that.'
      C: 'You picked limited companies only. Sole traders, partnerships and clubs keep ledgers too.'
  4:
    moments:
      - section: 'The question'
        say: 'The accountant lists every ledger balance in two columns. Why go to that trouble?'
        write: 'Purpose of a trial balance $= ?$'
      - section: 'Name it'
        say: 'This is the trial balance, a list of all the ledger balances on one date, debits in one column and credits in the other.'
        write: 'Trial balance = list of ledger balances, Dr and Cr'
      - section: 'The rule'
        say: 'Under double entry every debit has an equal credit, so the two columns should agree.'
        write: 'Every debit = a credit ⇒ total Dr = total Cr'
      - section: 'How it works'
        say: 'If debits come to five hundred thousand naira and credits to four hundred and ninety-eight thousand naira, there is a two thousand naira mistake to find.'
        write: '$500{,}000 \ne 498{,}000$ ⇒ find the ₦2,000 error'
      - section: 'In Nigeria'
        say: 'A bookkeeper at a pharmacy in Enugu extracts a trial balance at every month end before the owner sees the figures.'
        write: 'Month end ⇒ trial balance'
      - section: 'Remember'
        say: 'Remember, trial balance means a trial of the arithmetic.'
        write: 'Trial balance = a test of the arithmetic'
      - section: 'Answer'
        say: 'So a trial balance is prepared for testing the arithmetical accuracy of the ledger balances, which is option D.'
        write: '$\therefore$ testing arithmetical accuracy'
        answer: true
    traps:
      A: 'You chose classifying accounts. Accounts are classified when the ledger is opened, not by the trial balance.'
      B: 'You went for identifying balance sheet items. They are taken from it later, but that is not its purpose.'
      C: 'You picked the accountant''s competence. The trial balance checks the books, not the person.'
  5:
    moments:
      - section: 'The question'
        say: 'The trader kept no purchases book, but he knows his creditors and his payments. Can we find his purchases? Yes, with a creditors account.'
        write: 'Purchases for the year $= ?$'
      - section: 'Name it'
        say: 'We draw the total creditors account, which is one account for all the suppliers together.'
        write: 'Total creditors account'
      - section: 'The rule'
        say: 'The opening balance is what we owed the suppliers at the start, and purchases on credit add to what we owe. So both go on the credit side.'
        write: 'Cr = opening + purchases'
      - say: 'Payments and discount received both reduce what we owe, because a discount received is an amount the supplier lets us off. The closing balance is what is still owed at the end. These go on the debit side.'
        write: 'Dr = payments + discount + closing'
      - section: 'Debit side'
        say: 'Now the figures. On the debit side we have twenty-six thousand five hundred paid, one hundred and thirty discount and five thousand two hundred and fifty closing. That is thirty-one thousand eight hundred and eighty naira.'
        write: 'Dr $= 26{,}500 + 130 + 5{,}250 = 31{,}880$'
      - section: 'Credit side'
        say: 'The two sides of an account must agree, so the credit side must also total thirty-one thousand eight hundred and eighty naira. It holds the opening four thousand six hundred, plus purchases.'
        write: '$4{,}600 + \text{Purchases} = 31{,}880$'
      - section: 'Purchases'
        say: 'So purchases are thirty-one thousand eight hundred and eighty minus four thousand six hundred, which is twenty-seven thousand two hundred and eighty naira.'
        write: 'Purchases $= 31{,}880 - 4{,}600 = 27{,}280$'
      - section: 'Check'
        say: 'Four thousand six hundred plus twenty-seven thousand two hundred and eighty gives back thirty-one thousand eight hundred and eighty, so both sides agree.'
        write: '$4{,}600 + 27{,}280 = 31{,}880$ ✓'
      - section: 'In Nigeria'
        say: 'A building materials dealer in Kaduna can find his year''s purchases this way from his cheque stubs and his supplier balances.'
        write: 'Cheque stubs + supplier balances ⇒ purchases'
      - section: 'Remember'
        say: 'Remember, purchases are what we paid, plus what we were let off, plus what we still owe, less what we owed at the start.'
        write: 'Paid + discount + closing − opening'
      - section: 'Answer'
        say: 'So the purchases for the year are twenty-seven thousand two hundred and eighty naira, which is option C.'
        write: '$\therefore$ Purchases $=$ ₦27,280'
        answer: true
    traps:
      A: 'You chose twenty-seven thousand and thirty-eight naira. That figure does not balance the creditors account.'
      B: 'You went for twenty-six thousand six hundred and thirty naira. That is payments plus discount only. Creditors rose by six hundred and fifty naira, and that was bought too.'
      D: 'You picked twenty-seven thousand one hundred and fifty naira. That leaves out the one hundred and thirty naira discount, which also settled a debt for purchases.'
  6:
    moments:
      - section: 'The question'
        say: 'Capital grew from twenty thousand to thirty thousand naira. Is the whole ten thousand naira profit? Not quite.'
        write: 'Profit for the period $= ?$'
      - section: 'Name it'
        say: 'This is profit by comparing capital, used when a trader keeps no full books.'
        write: 'Capital comparison method'
      - section: 'The rule'
        say: 'Profit equals closing capital, minus opening capital, plus drawings, minus new capital introduced.'
        write: 'Profit = Closing − Opening + Drawings − New capital'
      - section: 'Why'
        say: 'Drawings are added back because the owner took them out. New capital is taken off because it came from the owner, not from trading.'
        write: 'Drawings back in, new capital out'
      - section: 'The data'
        say: 'We are given a closing capital of thirty thousand naira, an opening capital of twenty thousand naira, drawings of three thousand naira and new capital of eight thousand naira.'
        write: 'Closing $30{,}000$, Opening $20{,}000$, Drawings $3{,}000$, New capital $8{,}000$'
      - section: 'Substitute'
        say: 'We put them into the rule. We take thirty thousand minus twenty thousand plus three thousand minus eight thousand.'
        write: 'Profit $= 30{,}000 - 20{,}000 + 3{,}000 - 8{,}000$'
      - say: 'That gives five thousand naira.'
        write: 'Profit $= 5{,}000$'
      - section: 'Check'
        say: 'Twenty thousand plus eight thousand plus five thousand minus three thousand gives thirty thousand, the closing capital.'
        write: '$20{,}000 + 8{,}000 + 5{,}000 - 3{,}000 = 30{,}000$ ✓'
      - section: 'In Nigeria'
        say: 'A tailor in Aba with no ledger can still find his profit from what his business was worth at the start and the end of the year.'
        write: 'Worth at start and end ⇒ profit'
      - section: 'Remember'
        say: 'Remember, profit is the growth in capital, plus drawings, less new capital.'
        write: 'Growth + drawings − new capital'
      - section: 'Answer'
        say: 'So the profit for the period is five thousand naira, which is option C.'
        write: '$\therefore$ Profit $=$ ₦5,000'
        answer: true
    traps:
      A: 'You chose eight thousand naira. That is the new capital the owner put in, and that is not profit.'
      B: 'You went for four thousand naira. That does not fit the equation. Profit must be five thousand naira to reach thirty thousand.'
      D: 'You picked six thousand naira. That would make the closing capital thirty-one thousand naira, not thirty thousand.'
  7:
    moments:
      - section: 'The question'
        say: 'We have seven balances and two columns. Which ones are debits and which are credits? Sort them and the totals will tell us.'
        write: 'Trial balance total $= ?$'
      - section: 'The rule'
        say: 'We use the memory aid DEAD CLIC. In DEAD, the D is for debit, and expenses, assets and drawings are debit balances.'
        write: 'DEAD ⇒ Dr = Expenses, Assets, Drawings'
      - say: 'In CLIC, the C is for credit, and liabilities, income and capital are credit balances.'
        write: 'CLIC ⇒ Cr = Liabilities, Income, Capital'
      - section: 'Sort them'
        say: 'Now we sort the seven balances. Bank and the typewriter are assets. Purchases, rent and stationery are expenses. So all five are debits.'
        write: 'Dr: bank, purchases, rent, stationery, typewriter'
      - say: 'Capital is owed to the owner and sales are income. So those two are credits.'
        write: 'Cr: capital, sales'
      - section: 'Debit column'
        say: 'Fifty-nine thousand four hundred and ten, plus twenty thousand, plus two thousand five hundred, plus ninety, plus six thousand five hundred, is eighty-eight thousand five hundred naira.'
        write: 'Dr $= 59{,}410 + 20{,}000 + 2{,}500 + 90 + 6{,}500 = 88{,}500$'
      - section: 'Credit column'
        say: 'Fifty thousand plus thirty-eight thousand five hundred is also eighty-eight thousand five hundred naira.'
        write: 'Cr $= 50{,}000 + 38{,}500 = 88{,}500$ ✓'
      - section: 'In Nigeria'
        say: 'A small typing pool in Ibadan with a bank account, a typewriter and some sales would draw up just this kind of trial balance.'
        write: 'Typing pool in Ibadan'
      - section: 'Remember'
        say: 'Remember, DEAD goes on the left and CLIC on the right.'
        write: 'DEAD | CLIC'
      - section: 'Answer'
        say: 'So each column totals eighty-eight thousand five hundred naira, which is option A.'
        write: '$\therefore$ Total $=$ ₦88,500'
        answer: true
    traps:
      B: 'You chose eighty-five thousand eight hundred naira. Two digits are swapped. Add the debit column again slowly.'
      C: 'You went for one hundred and forty-seven thousand nine hundred and ten naira. That counts the bank balance twice.'
      D: 'You picked one hundred and thirty-eight thousand five hundred naira. That puts capital with the debits. Capital belongs in the credit column.'
  8:
    moments:
      - section: 'The question'
        say: 'Hassan Electronics buys two generators for its workshop. Is that stock, an expense, or something else?'
        write: 'Two generators for the workshop ⇒ ?'
      - section: 'Name it'
        say: 'This is capital expenditure, money spent on fixed assets that the business keeps and uses.'
        write: 'Capital expenditure ⇒ fixed assets'
      - section: 'The rule'
        say: 'What decides it is why the item was bought. Bought to use for years, it is a fixed asset.'
        write: 'Use for years ⇒ fixed asset'
      - say: 'Bought to resell, it is stock.'
        write: 'Resell ⇒ stock'
      - say: 'Used up within the year, it is an expense.'
        write: 'Used up ⇒ expense'
      - section: 'Apply it'
        say: 'The generators will power the workshop for years, so they are fixed assets.'
        write: 'Generators for the workshop ⇒ fixed assets'
      - section: 'The double entry'
        say: 'We debit the generators account and credit the bank or the supplier.'
        write: 'Dr Generators (fixed asset), Cr Bank or Supplier'
      - section: 'In Nigeria'
        say: 'A barbing salon in Lagos that buys a generator for its clippers has a fixed asset. A dealer at Alaba market who buys ten to sell has stock.'
        write: 'Salon ⇒ fixed asset.  Alaba dealer ⇒ stock'
      - section: 'Remember'
        say: 'Remember, bought to use is a fixed asset, and bought to sell is stock.'
        write: 'Use ⇒ fixed asset, sell ⇒ stock'
      - section: 'Answer'
        say: 'So the purchase is recorded as an acquisition of fixed assets, which is option D.'
        write: '$\therefore$ acquisition of fixed assets'
        answer: true
    traps:
      A: 'You chose part of capital. Capital is what the owner puts in. Buying an asset does not add to it.'
      B: 'You went for stock. Stock is goods bought to resell, and these generators are for the workshop.'
      C: 'You picked an expense. An expense is used up within the year, but generators last for years.'
  9:
    moments:
      - section: 'The question'
        say: 'We can see what Kudu and Wale each received. Can we work back to the profit they shared? Yes, by adding it all up.'
        write: 'Net profit of the partnership $= ?$'
      - section: 'Name it'
        say: 'This is the profit and loss appropriation account, which shares out a partnership''s net profit.'
        write: 'Appropriation account shares out the net profit'
      - section: 'The rule'
        say: 'The net profit pays the interest on capital, then the salaries, then the shares of what is left. So the net profit is the total of all of them.'
        write: 'Net profit = interest + salaries + shares'
      - section: 'Kudu'
        say: 'Kudu gets seven hundred and fifty interest on capital, plus eight hundred salary, plus three thousand three hundred share of profit, which is four thousand eight hundred and fifty naira.'
        write: 'Kudu $= 750 + 800 + 3{,}300 = 4{,}850$'
      - section: 'Wale'
        say: 'In the same way, Wale gets five hundred and fifty interest, plus six hundred salary, plus three thousand three hundred share of profit, which is four thousand four hundred and fifty naira.'
        write: 'Wale $= 550 + 600 + 3{,}300 = 4{,}450$'
      - section: 'Total'
        say: 'Four thousand eight hundred and fifty plus four thousand four hundred and fifty is nine thousand three hundred naira.'
        write: 'Net profit $= 4{,}850 + 4{,}450 = 9{,}300$'
      - section: 'Check'
        say: 'By type, interest is one thousand three hundred, salaries one thousand four hundred and shares six thousand six hundred. That is nine thousand three hundred again.'
        write: '$1{,}300 + 1{,}400 + 6{,}600 = 9{,}300$ ✓'
      - section: 'In Nigeria'
        say: 'Two partners running a pharmacy in Kano pay themselves interest and salaries from the profit first, then split the rest equally.'
        write: 'Interest and salaries first, then the rest shared'
      - section: 'Remember'
        say: 'Remember, everything given out in the appropriation account came from the net profit.'
        write: 'All appropriations = net profit'
      - section: 'Answer'
        say: 'So the net profit of the partnership is nine thousand three hundred naira, which is option C.'
        write: '$\therefore$ Net profit $=$ ₦9,300'
        answer: true
    traps:
      A: 'You chose six thousand six hundred naira. That is only the shared remainder. Interest and salaries came out of the net profit first.'
      B: 'You went for four thousand eight hundred and fifty naira. That is Kudu''s total alone. Add Wale''s too.'
      D: 'You picked four thousand four hundred and fifty naira. That is Wale''s total alone. Add Kudu''s too.'
  10:
    moments:
      - section: 'The question'
        say: 'Dele and Seun stay the same people but become directors of a company. Can they keep the old books going?'
        write: 'Partnership ⇒ limited liability company. What happens?'
      - section: 'Name it'
        say: 'This is the conversion of a partnership into a company, which works like a dissolution of the partnership.'
        write: 'Conversion = dissolution of the partnership'
      - section: 'The rule'
        say: 'A company is a new legal person, separate from its members. So the partnership must end and the company starts its own books.'
        write: 'Company = a separate legal person'
      - section: 'How it works'
        say: 'The partnership books are closed through a realisation account, the account used to close off the old firm''s assets. The assets then pass to the company in return for shares.'
        write: 'Realisation account ⇒ assets to the company for shares'
      - section: 'In Nigeria'
        say: 'Two brothers running a block-making business in Ilorin who register it as a limited company close the old books and open new ones.'
        write: 'Old partnership books closed, company books opened'
      - section: 'Remember'
        say: 'Remember, a new legal person needs new books.'
        write: 'New legal person ⇒ new books'
      - section: 'Answer'
        say: 'So the partnership is formally ended and new company books are opened, which is option B.'
        write: '$\therefore$ partnership ended, new company books opened'
        answer: true
    traps:
      A: 'You chose simply continuing. The members are the same, but the company is a different legal person, so the old books cannot carry on.'
      C: 'You went for goodwill being legally required. The partners may value goodwill if they agree, but no law demands it.'
      D: 'You picked sharing everything equally. Shares are allotted by agreement, usually in the old ratios.'
  11:
    moments:
      - section: 'The question'
        say: 'A petty trader sells in a place with no bank at all. How many money columns does her cash book need?'
        write: 'Cash book for a petty trader with no bank $= ?$'
      - section: 'Name it'
        say: 'Cash books are named by how many money columns they have on each side. A single column cash book has one column, for cash.'
        write: 'Single column ⇒ cash'
      - say: 'A two column cash book adds a second column, for the bank.'
        write: 'Two column ⇒ cash, bank'
      - say: 'A three column cash book adds a third, for discount.'
        write: 'Three column ⇒ cash, bank, discount'
      - section: 'Apply it'
        say: 'With no bank nearby, she has no bank transactions, and she gives or gets little discount. Only cash moves.'
        write: 'No bank, little discount ⇒ cash only'
      - section: 'The rule'
        say: 'So one money column for cash is all she needs, which is the single column cash book.'
        write: 'Cash only ⇒ single column cash book'
      - section: 'In Nigeria'
        say: 'A woman selling pepper and tomatoes in a village market near Ogoja writes her takings on the left and her payments on the right, in one cash column.'
        write: 'Takings on the left, payments on the right'
      - section: 'Remember'
        say: 'Remember, one kind of money needs one column.'
        write: 'One kind of money ⇒ one column'
      - section: 'Answer'
        say: 'So the most convenient cash book is the single column cash book, which is option B.'
        write: '$\therefore$ single column cash book'
        answer: true
    traps:
      A: 'You chose four column. A petty trader with no bank needs only one money column, for cash.'
      C: 'You went for two column. Its second column is for the bank, and this trader has no bank.'
      D: 'You picked three column. It adds bank and discount columns that would stay empty here.'
  12:
    moments:
      - section: 'The question'
        say: 'There are four lists of columns, and they look alike. Only one is the real general journal. Let us find it.'
        write: 'Columns of the general journal $= ?$'
      - section: 'Name it'
        say: 'The general journal, or journal proper, is a book of original entry for items that fit no other day book.'
        write: 'General journal = journal proper'
      - section: 'The rule'
        say: 'Its columns are date, the particulars with a short narration, folio, debit and credit.'
        write: 'Date | Particulars and narration | Folio | Dr | Cr'
      - say: 'The narration is a short note saying what the entry is for, and the folio is the page number of the ledger account the entry is posted to.'
        write: 'Narration = what it is for.  Folio = ledger page'
      - section: 'An entry'
        say: 'For example, on the first of March, motor van is debited eight hundred thousand naira and capital is credited, being a van brought in by the owner.'
        write: '1 Mar  Motor van Dr ₦800,000, Capital Cr ₦800,000'
      - section: 'In Nigeria'
        say: 'A bakery in Ibadan uses its journal for opening entries, for an oven bought on credit, and for putting errors right.'
        write: 'Opening entries, credit purchase of an oven'
      - section: 'Remember'
        say: 'Remember, a journal entry always has a debit and a credit, so both columns must be there.'
        write: 'Every entry ⇒ Dr and Cr'
      - section: 'Answer'
        say: 'So a general journal contains date, narration, folio, debit and credit, which is option A.'
        write: '$\therefore$ date, narration, folio, debit, credit'
        answer: true
    traps:
      B: 'You chose the list ending in sales. It has no narration, and sales is an account, not a column.'
      C: 'You went for the list ending in purchases. It drops the credit column, and purchases is an account, not a column.'
      D: 'You picked the list ending in discount. It drops the debit column, and discount is not a journal column.'
  13:
    moments:
      - section: 'The question'
        say: 'Udo Co. Limited lists nine balances, but the cash is missing. The trial balance must agree, so the gap tells us the cash.'
