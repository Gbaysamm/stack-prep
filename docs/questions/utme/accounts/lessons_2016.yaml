      D: 'You picked eighty-five thousand naira. You took away the opening stock but left out the closing stock.'
  31:
    moments:
      - section: 'The question'
        say: 'We must find the item that makes the bank statement balance higher than the cash book balance.'
        write: 'Item that makes the bank statement balance higher $= ?$'
      - section: 'Name it'
        say: 'This is a cause of difference between the cash book and the bank statement, dealt with in a bank reconciliation statement.'
        write: 'Bank reconciliation statement'
      - section: 'The rule'
        say: 'Items the bank adds before the trader knows of them make the statement higher. Items the bank takes off make it lower.'
        write: 'Bank adds ⇒ statement higher.  Bank takes off ⇒ statement lower'
      - section: 'Sort the options'
        say: 'A standing order, commission and a direct withdrawal all take money out. Interest received puts money in.'
        write: 'Out: standing order, commission, withdrawal.  In: interest received'
      - section: 'Putting it right'
        say: 'The trader puts it right by debiting the interest in the cash book.'
        write: 'Dr Cash book, Cr Interest received'
      - section: 'Remember'
        say: 'Remember, the bank adds interest, so the statement goes up.'
        write: 'Interest added ⇒ statement up'
      - section: 'Answer'
        say: 'So the cause that overstates the bank statement balance is interest received, which is option D.'
        write: '$\therefore$ interest received'
        answer: true
    traps:
      A: 'You chose a standing order payment. The bank takes it out, so the statement goes down, not up.'
      B: 'You went for commission paid. That is a charge taken out, so the statement goes down.'
      C: 'You picked direct withdrawal. Money taken out makes the statement lower, not higher.'
  32:
    moments:
      - section: 'The question'
        say: 'We must name what the bank charge on a current account holder is a commission on.'
        write: 'Commission on ?'
      - section: 'Name it'
        say: 'The charge is known as C O T, which means commission on turnover.'
        write: 'C O T = commission on turnover'
      - section: 'The rule'
        say: 'It was a small rate on the total of the withdrawals and payments passing through a current account in the period. That total is the turnover.'
        write: 'C O T = rate × debit turnover'
      - section: 'Today'
        say: 'The Central Bank later phased C O T out, and banks now charge a capped account maintenance fee instead.'
        write: 'Today ⇒ account maintenance fee'
      - section: 'Remember'
        say: 'Remember, the T in C O T stands for turnover.'
        write: 'C O T ⇒ T = turnover'
      - section: 'Answer'
        say: 'So the charge on a current account holder is the commission on turnover, which is option C.'
        write: '$\therefore$ turnover'
        answer: true
    traps:
      A: 'You chose transactions. Some services are charged one by one, but the commission is worked on the turnover.'
      B: 'You went for cash received. C O T is worked on money paid out, not money paid in.'
      D: 'You picked transfers. Transfers are only one kind of payment, and the commission is on the whole turnover.'
  33:
    moments:
      - section: 'The question'
        say: 'We are given five balances. We must sort them into debits and credits and find the total of the trial balance.'
        write: 'Trial balance total $= ?$'
      - section: 'The rule'
        say: 'Use DEAD CLIC. Expenses and assets are debits. Liabilities and income are credits.'
        write: 'Dr = Expenses, Assets.  Cr = Liabilities, Income'
      - section: 'Sort them'
        say: 'Light expenses and purchases are expenses, and debtors are an asset. So those three are debits.'
        write: 'Dr: light, purchases, debtors'
      - say: 'Sales are income, and creditors are a liability. So those two are credits.'
        write: 'Cr: sales, creditors'
      - section: 'Debit column'
        say: 'Four hundred plus three thousand plus fifty is three thousand four hundred and fifty naira.'
        write: 'Dr $= 400 + 3{,}000 + 50 = 3{,}450$'
      - section: 'Credit column'
        say: 'One thousand two hundred plus two thousand two hundred and fifty is also three thousand four hundred and fifty naira.'
        write: 'Cr $= 1{,}200 + 2{,}250 = 3{,}450$'
      - section: 'Remember'
        say: 'Remember, DEAD goes on the left and CLIC on the right.'
        write: 'DEAD | CLIC'
      - section: 'Answer'
        say: 'So the trial balance totals three thousand four hundred and fifty naira, which is option A.'
        write: '$\therefore$ Total $=$ ₦3,450'
        answer: true
    traps:
      B: 'You chose four thousand three hundred naira. That is not the total of either column. Each column adds to three thousand four hundred and fifty naira.'
      C: 'You went for three thousand five hundred naira. That adds sales, creditors and debtors, mixing the two sides.'
      D: 'You picked four thousand two hundred and fifty naira. That adds purchases, sales and debtors, mixing the two sides.'
  34:
    moments:
      - section: 'The question'
        say: 'We must say how many columns a journal has, and what they are.'
        write: 'Columns of the journal $= ?$'
      - section: 'Name it'
        say: 'The journal, or journal proper, shows each entry with its debit and its credit side by side.'
        write: 'Journal = debit and credit side by side'
      - section: 'The rule'
        say: 'Its columns are date, particulars with the narration, folio, debit and credit. That is five.'
        write: 'Date | Particulars | Folio | Dr | Cr ⇒ 5 columns'
      - section: 'An entry'
        say: 'For example, on the fifth of June, office equipment is debited sixty thousand naira and Kola Stores is credited, being a computer bought on credit.'
        write: '5 June  Office equipment Dr ₦60,000, Kola Stores Cr ₦60,000'
      - section: 'Remember'
        say: 'Remember, five columns, with a debit and a credit side by side.'
        write: '5 columns, Dr and Cr'
      - section: 'Answer'
        say: 'So a journal has five columns, date, particulars, folio, debit and credit, which is option D.'
        write: '$\therefore$ five columns'
        answer: true
    traps:
      A: 'You chose six columns with an amount column. The money goes in the debit and credit columns, so there is no separate amount column.'
      B: 'You went for four columns. One amount column cannot show both the debit and the credit.'
      C: 'You picked three columns. With no money column at all, it could record no amounts.'
  35:
    moments:
      - section: 'The question'
        say: 'We are given an extract of a trading and profit and loss account with net sales of three hundred and seventy thousand naira. We must find the gross profit.'
        write: 'Gross profit $= ?$'
      - section: 'Name it'
        say: 'Gross profit is found in the trading account, before any expenses.'
        write: 'Gross profit = trading account'
      - section: 'The rule'
        say: 'Gross profit equals net sales minus cost of goods sold.'
        write: 'Gross profit = Net sales − Cost of goods sold'
      - section: 'Cost of goods sold'
        say: 'Opening stock twenty thousand, plus purchases two hundred and fifty thousand, minus closing stock forty thousand, is two hundred and thirty thousand naira.'
        write: 'COGS $= 20{,}000 + 250{,}000 - 40{,}000 = 230{,}000$'
      - section: 'Gross profit'
        say: 'Three hundred and seventy thousand minus two hundred and thirty thousand is one hundred and forty thousand naira.'
        write: 'Gross profit $= 370{,}000 - 230{,}000 = 140{,}000$'
      - section: 'Remember'
        say: 'Remember, gross profit is before expenses, and net profit is after.'
        write: 'Gross before expenses, net after'
      - section: 'Answer'
        say: 'So the gross profit is one hundred and forty thousand naira, which is option B.'
        write: '$\therefore$ Gross profit $=$ ₦140,000'
        answer: true
    traps:
      A: 'You chose three hundred and seventy thousand naira. That is the net sales, before the cost of goods is taken off.'
      C: 'You went for two hundred and thirty thousand naira. That is the cost of goods sold, not the profit.'
      D: 'You picked one hundred and fifty thousand naira. That is ten thousand naira too much. Take two hundred and thirty thousand from three hundred and seventy thousand again.'
  36:
    moments:
      - section: 'The question'
