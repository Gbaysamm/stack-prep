        say: 'This is cheque clearing. Banks exchange the cheques drawn on one another through a clearing house and settle what they owe each other.'
        write: 'Banks exchange and settle cheques ⇒ clearing'
      - section: 'Example'
        say: 'A customer pays in a cheque drawn on another bank. Her bank presents it through clearing, and the money reaches her account in a few days.'
        write: 'Cheque from Bank X paid into Bank Y ⇒ clearing'
