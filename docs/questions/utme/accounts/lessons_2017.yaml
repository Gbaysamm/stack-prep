      - section: 'In Nigeria'
        say: 'A pharmacy in Ilorin sells its oldest packs of paracetamol first, so the packs left are the newest ones.'
        write: 'Oldest packs sold first'
      - section: 'Answer'
        say: 'So the FIFO closing stock is seventeen thousand naira, which is option A.'
        write: '$\therefore$ ₦17,000'
        answer: true
    traps:
      B: 'You chose twenty-nine thousand naira. That is the stock before the January five issue.'
      C: 'You went for thirty-four thousand naira. That is the stock before any issue at all.'
      D: 'You picked twelve thousand naira. That is the value of the January five issue, not what is left.'
  30:
    moments:
      - section: 'The question'
        say: 'We have the same receipts and issues, but now each issue is priced at a plain average of the prices. What stock is left?'
        write: 'Closing stock by simple average = ?'
      - section: 'Name it'
        say: 'This is the simple average method.'
        write: 'Simple average'
      - section: 'The rule'
        say: 'Each issue is priced at the plain average of the unit prices received so far, without counting how many units came in at each price.'
        write: 'Issue price = average of prices so far'
      - say: 'Then the closing stock is the value received minus the value issued.'
        write: 'Closing stock = received − issued'
      - section: 'January three'
        say: 'By January three, two prices have come in, ten naira and twelve naira. Ten plus twelve, divided by two, is eleven naira. One thousand, five hundred times eleven is sixteen thousand, five hundred naira.'
        write: '$(10 + 12) \div 2 = 11$,  1,500 × 11 = 16,500'
      - section: 'January five'
        say: 'By January five, the eleven naira batch has come in too, so there are three prices. Ten plus twelve plus eleven, divided by three, is eleven naira. One thousand times eleven is eleven thousand naira.'
        write: '$(10 + 12 + 11) \div 3 = 11$,  1,000 × 11 = 11,000'
      - section: 'Totals'
        say: 'Received is ten thousand plus twenty-four thousand plus eleven thousand, which is forty-five thousand naira. Issued is sixteen thousand, five hundred plus eleven thousand, which is twenty-seven thousand, five hundred.'
        write: 'Received 45,000,  issued 27,500'
      - section: 'Closing stock'
        say: 'Forty-five thousand minus twenty-seven thousand, five hundred is seventeen thousand, five hundred naira.'
        write: '45,000 − 27,500 = ₦17,500'
      - section: 'Check'
        say: 'Four thousand units came in and two thousand, five hundred went out, so one thousand, five hundred units are left, at about eleven naira, sixty-seven kobo each. That lies between the lowest and highest prices paid.'
        write: '17,500 ÷ 1,500 ≈ ₦11.67, between ₦10 and ₦12 ✓'
      - section: 'Remember'
        say: 'Remember, simple average adds the prices and divides by how many prices.'
        write: 'Add prices ÷ number of prices'
      - section: 'Answer'
        say: 'So the closing stock by simple average is seventeen thousand, five hundred naira, which is option D.'
        write: '$\therefore$ ₦17,500'
        answer: true
    traps:
      A: 'You chose eleven thousand, five hundred naira. That is an issue value, not the stock left.'
      B: 'You went for seventeen thousand naira. That is the FIFO value, not the simple average value.'
      C: 'You picked twenty-eight thousand, five hundred naira. That is the stock before the January five issue.'
  31:
    moments:
      - section: 'The question'
        say: 'Sometimes making goods costs more than buying them would. Where does that loss go?'
