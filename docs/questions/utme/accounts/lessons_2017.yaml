      C: 'You went for holding. That is not a stage of settling cheques between banks.'
      D: 'You picked confirmation. That is checking with the customer that a cheque is genuine, not settling it between banks.'
  35:
    moments:
      - section: 'The question'
        say: 'We are given a cash book extract and the opening and closing debtors. All sales are on credit, and we must find the sales for the period.'
        write: 'Credit sales for the period = ?'
      - section: 'The rule'
        say: 'In the debtors account, opening debtors plus credit sales equals receipts from debtors plus closing debtors. So credit sales are receipts, plus closing debtors, minus opening debtors.'
        write: '$\text{Credit sales} = \text{Receipts} + \text{Closing debtors} - \text{Opening debtors}$'
      - section: 'Pick the figure'
        say: 'Only receipts from customers, sixteen thousand, four hundred naira, is needed from the cash book. The opening balance, the expenses, the drawings and the payments to suppliers have nothing to do with what customers bought.'
        write: 'Receipts from customers ₦16,400'
      - section: 'Working'
        say: 'Sixteen thousand, four hundred plus seven thousand, six hundred, minus six thousand, five hundred, is seventeen thousand, five hundred naira.'
        write: '16,400 + 7,600 − 6,500 = ₦17,500'
      - section: 'Answer'
        say: 'So the sales figure is seventeen thousand, five hundred naira, which is option A.'
        write: '$\therefore$ ₦17,500'
        answer: true
    traps:
      B: 'You chose twenty-nine thousand, four hundred naira. That brings in cash book items that have nothing to do with sales.'
      C: 'You went for thirty-one thousand, six hundred naira. That does not come from the debtors account.'
      D: 'You picked fifteen thousand, three hundred naira. That uses the debtor balances the wrong way round, adding the opening debtors and taking away the closing ones.'
  36:
    moments:
      - section: 'The question'
        say: 'We are given a business''s assets and its creditors, and we must find its capital.'
        write: 'Capital = ?'
      - section: 'The rule'
        say: 'By the accounting equation, capital is assets minus liabilities.'
        write: '$\text{Capital} = \text{Assets} - \text{Liabilities}$'
      - section: 'Assets'
        say: 'Fixtures, debtors and stock are assets, and goodwill is an asset too. Thirty thousand, plus seven thousand, plus eight thousand, plus ten thousand, makes fifty-five thousand naira.'
        write: '30,000 + 7,000 + 8,000 + 10,000 = 55,000'
      - section: 'Liabilities'
        say: 'Creditors of three thousand are the only liability. Fifty-five thousand minus three thousand is fifty-two thousand naira.'
        write: '55,000 − 3,000 = ₦52,000'
      - section: 'Answer'
        say: 'So the capital is fifty-two thousand naira, which is option C.'
        write: '$\therefore$ ₦52,000'
        answer: true
    traps:
      A: 'You chose ten thousand naira. That is just the goodwill, one of the assets.'
      B: 'You went for forty-two thousand naira. That leaves goodwill out, but goodwill is an asset.'
