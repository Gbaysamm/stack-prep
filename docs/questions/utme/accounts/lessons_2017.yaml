  37:
    moments:
      - section: 'The question'
        say: 'We are given a list of trading and profit and loss items, and we must find the gross profit.'
        write: 'Gross profit = ?'
      - section: 'The rule'
        say: 'Carriage inwards is the cost of bringing goods in, so it is part of their cost. Cost of sales is opening stock plus purchases plus carriage inwards minus closing stock.'
        write: '$\text{COS} = \text{Opening} + \text{Purchases} + \text{Carriage in} - \text{Closing}$'
      - say: 'Gross profit is sales minus cost of sales. Carriage outwards, discount received and the other expenses come later, in profit and loss, so they stay out.'
        write: '$\text{GP} = \text{Sales} - \text{COS}$'
      - section: 'Cost of sales'
        say: 'Twenty-eight thousand plus one hundred and twenty-eight thousand plus four thousand is one hundred and sixty thousand. Taking away ten thousand leaves one hundred and fifty thousand naira.'
        write: '28,000 + 128,000 + 4,000 − 10,000 = 150,000'
      - section: 'Gross profit'
        say: 'Two hundred and thirty-two thousand minus one hundred and fifty thousand is eighty-two thousand naira.'
        write: '232,000 − 150,000 = ₦82,000'
      - section: 'Answer'
        say: 'So the gross profit is eighty-two thousand naira, which is option D.'
        write: '$\therefore$ ₦82,000'
        answer: true
    traps:
