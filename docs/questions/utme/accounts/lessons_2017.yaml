  33:
    moments:
      - section: 'The question'
        say: 'In bank reconciliation, we must say which records timing differences arise from.'
        write: 'Timing differences arise from ?'
      - section: 'The rule'
        say: 'A timing difference is the same transaction recorded in the cash book and in the bank statement on different dates. So it involves both records.'
        write: 'Same item, two records, two dates'
      - section: 'Examples'
        say: 'Unpresented cheques and uncredited lodgements are the usual timing differences.'
        write: 'Unpresented cheques, uncredited lodgements'
      - say: 'Say a trader writes a cheque on the thirtieth of June, but her supplier banks it on the third of July. It is in June''s cash book, but not yet on June''s bank statement.'
        write: 'Cheque 30 June, banked 3 July'
      - section: 'Answer'
        say: 'So timing differences arise from the cash book and the bank statement, which is option B.'
        write: '$\therefore$ cash book and bank statement'
        answer: true
    traps:
      A: 'You chose the bank statement only. An item only there, like bank charges, must be entered in the cash book. It is not a timing difference.'
      C: 'You went for incidental records as well. The reconciliation compares only the cash book and the bank statement.'
      D: 'You picked the cash book only. An item only there is an error or omission, not a timing difference.'
  34:
