        say: 'This is F I F O, first in, first out.'
        write: 'FIFO, first in, first out'
      - section: 'The rule'
        say: 'Each issue comes from the oldest units still in stock, so the closing stock is made of the newest ones.'
        write: 'Oldest out first ⇒ newest left'
      - section: 'January one and two'
        say: 'On January one, one thousand units come in at ten naira each. On January two, two thousand more come in at twelve naira each.'
        write: '1,000 @ ₦10, then 2,000 @ ₦12'
      - section: 'January three'
        say: 'The issue of one thousand, five hundred takes all one thousand at ten naira and five hundred at twelve naira. One thousand, five hundred at twelve naira are left.'
        write: '1,500 = 1,000 @ ₦10 + 500 @ ₦12  ⇒  left 1,500 @ ₦12'
      - section: 'January four'
        say: 'One thousand more come in at eleven naira.'
        write: '+ 1,000 @ ₦11'
      - section: 'January five'
        say: 'The issue of one thousand comes from the twelve naira batch, leaving five hundred at twelve naira.'
        write: '1,000 @ ₦12 out  ⇒  left 500 @ ₦12 + 1,000 @ ₦11'
      - section: 'Value'
        say: 'Five hundred times twelve is six thousand, and one thousand times eleven is eleven thousand. Together that is seventeen thousand naira.'
        write: '6,000 + 11,000 = ₦17,000'
      - section: 'Check'
        say: 'Ten thousand, twenty-four thousand and eleven thousand came in, which is forty-five thousand naira. Ten thousand, six thousand and twelve thousand went out, which is twenty-eight thousand. Forty-five thousand minus twenty-eight thousand is seventeen thousand.'
