# UTME 2017 Principles of Accounts, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Nigerian Accounts teacher works on the
# board: the question, the account, rule or concept named, the rule in plain words, the working
# (the double entry, the T account or the calculation, then a check), a Nigerian example, a way
# to remember it, and the answer moment that names the option.
#
#   say:     heard, not read. Abbreviations as letters or words, money in words, percentages as
#            "per cent", no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2017.yaml. Answers match that file. This paper
# has no paper-type question, so all 40 questions have a lesson.
format_version: 1
exam_year: 2017
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'A sole trader and a partnership both make a profit. One of them needs an extra account to deal with it. Which one, and what is it called?'
        write: 'Partnership final accounts vs sole trader final accounts ?'
      - section: 'Name it'
        say: 'This is the profit and loss appropriation account, the account that shares out a partnership''s net profit.'
        write: 'Profit and loss appropriation account'
      - section: 'The rule'
        say: 'A sole trader keeps all the net profit, so it goes straight to her capital. Partners must divide theirs, so a partnership adds an appropriation account.'
        write: 'Sole trader ⇒ capital.  Partners ⇒ appropriation account'
      - section: 'How it works'
        say: 'The appropriation account is credited with the net profit and with interest on drawings, because each partner pays the firm interest on what he took out.'
        write: 'Cr  net profit, interest on drawings'
      - say: 'It is then debited with interest on capital, partners'' salaries and each partner''s share of what is left.'
        write: 'Dr  interest on capital, salaries, shares of profit'
      - section: 'In Nigeria'
        say: 'Two lawyers in Abuja make a net profit of two million, four hundred thousand naira. Their appropriation account gives each the interest the deed allows, then splits the rest.'
        write: '₦2,400,000 shared by the deed'
      - section: 'Remember'
        say: 'Remember, a sole trader takes it all, but partners must appropriate.'
        write: 'Many owners ⇒ appropriation'
      - section: 'Answer'
        say: 'So the account that sets a partnership''s final accounts apart is the appropriation account, which is option C.'
        write: '$\therefore$ the appropriation account'
        answer: true
    traps:
      A: 'You went for drawings. A sole trader takes drawings too, so drawings do not set a partnership apart.'
      B: 'You chose the creditors account. Any business that buys on credit has creditors, whoever owns it.'
      D: 'You picked the capital account. A sole trader has a capital account too. Only the appropriation account belongs to partners.'
  2:
    moments:
      - section: 'The question'
        say: 'Goodwill is valuable, but you cannot touch it. So when is it allowed into the books as an asset?'
        write: 'Goodwill appears as an asset only if it has been ?'
      - section: 'Name it'
        say: 'Goodwill is the extra value of a business''s good name, location and customers, above its net assets.'
        write: 'Goodwill = price paid − net assets'
      - section: 'The rule'
        say: 'Under the prudence concept, goodwill is shown as an asset only when it has been purchased, which means paid for.'
        write: 'Only purchased goodwill is recorded'
      - say: 'Goodwill a business builds for itself is not recorded, because nobody has measured it with a real payment.'
        write: 'Self-made goodwill ⇒ not recorded'
      - section: 'The entry'
        say: 'A buyer pays five million naira for a business with net assets of four million, two hundred thousand naira. The extra eight hundred thousand naira is purchased goodwill.'
        write: '₦5,000,000 − ₦4,200,000 = ₦800,000 goodwill'
      - say: 'So we debit goodwill and credit cash with eight hundred thousand naira.'
        write: 'Dr Goodwill ₦800,000,  Cr Cash ₦800,000'
      - section: 'Partners'
        say: 'When a partner joins or dies, goodwill is valued only to adjust the capitals fairly, and it is normally written off again.'
        write: 'Admission or death ⇒ valued, then written off'
      - section: 'Remember'
        say: 'Remember, no payment means no goodwill in the books.'
        write: 'No payment, no goodwill'
      - section: 'Answer'
        say: 'So goodwill appears as an asset only if it has been purchased, which is option B.'
        write: '$\therefore$ purchased, that is, paid for'
        answer: true
    traps:
      A: 'You went for the admission of a new partner. Goodwill is valued then, but only to share it fairly, and it is normally written off.'
      C: 'You chose the death of a partner. Goodwill is valued to settle the estate, then written off, so it does not stay as an asset.'
      D: 'You picked raising goodwill to hide insolvency. That would overstate the assets, which prudence forbids.'
  3:
    moments:
      - section: 'The question'
        say: 'A twenty naira payment went on the wrong side of the cash book. Does twenty naira put it right? Most students think so. Let us see.'
        write: 'Payment ₦20 to John, entered as a receipt'
      - section: 'Name it'
        say: 'This is putting right an entry made on the wrong sides.'
        write: 'Error made on the wrong sides'
      - section: 'The right entry'
        say: 'A cash payment to John should be debit John, because John receives the money, and credit cash, because cash goes out.'
        write: 'Right: Dr John ₦20, Cr Cash ₦20'
      - section: 'The wrong entry'
        say: 'What was done instead was debit cash, credit John.'
        write: 'Done: Dr Cash ₦20, Cr John ₦20'
      - section: 'Undo it'
        say: 'First we cancel the wrong entry with debit John, credit cash, twenty naira.'
        write: 'Cancel: Dr John ₦20, Cr Cash ₦20'
      - section: 'Record it'
        say: 'Then we record the real payment with debit John, credit cash, another twenty naira.'
        write: 'Record: Dr John ₦20, Cr Cash ₦20'
      - section: 'Together'
        say: 'Twenty plus twenty is forty naira, so one journal entry does both jobs.'
        write: 'Dr John ₦40, Cr Cash ₦40'
      - section: 'Check'
        say: 'Cash had twenty naira wrongly added and must lose twenty naira for the payment. That is a fall of forty naira.'
        write: '+₦20 wrong, −₦20 payment ⇒ change of ₦40 ✓'
      - section: 'Remember'
        say: 'Remember, when it is on the wrong side, double it.'
        write: 'Wrong side ⇒ double it'
      - section: 'Answer'
        say: 'So the journal entry is debit John forty naira, credit cash forty naira, which is option A.'
        write: '$\therefore$ John ₦40 Dr, Cash ₦40 Cr'
        answer: true
    traps:
      B: 'You chose debit cash, credit John, forty naira. That goes the same wrong way again and makes the error bigger.'
      C: 'You went for debit cash, credit John, twenty naira. That repeats the wrong entry.'
      D: 'You picked debit John, credit cash, twenty naira. That only cancels the wrong entry. The payment itself is still not recorded.'
  4:
    moments:
      - section: 'The question'
        say: 'We know the stocks, the sales, the expenses and the net profit, but not the purchases. We will climb back up the account to find them.'
        write: 'Opening stock ₦2,400, closing stock ₦6,400, expenses ₦2,000, sales ₦11,000, net profit ₦1,000'
      - section: 'The rules'
        say: 'Gross profit minus expenses gives net profit. So, going back up, gross profit is net profit plus expenses.'
        write: '$\text{GP} = \text{NP} + \text{Expenses}$'
      - say: 'Sales minus cost of sales gives gross profit. So cost of sales is sales minus gross profit.'
        write: '$\text{COS} = \text{Sales} - \text{GP}$'
      - say: 'Cost of sales is opening stock plus purchases minus closing stock. Turned round, purchases are cost of sales plus closing stock minus opening stock.'
        write: '$\text{Purchases} = \text{COS} + \text{Closing stock} - \text{Opening stock}$'
      - section: 'Gross profit'
        say: 'One thousand naira plus two thousand naira is three thousand naira of gross profit.'
        write: '₦1,000 + ₦2,000 = ₦3,000'
      - section: 'Cost of sales'
        say: 'Eleven thousand naira minus three thousand naira is eight thousand naira.'
        write: '₦11,000 − ₦3,000 = ₦8,000'
      - section: 'Purchases'
        say: 'Eight thousand plus six thousand, four hundred, minus two thousand, four hundred, is twelve thousand naira.'
        write: '₦8,000 + ₦6,400 − ₦2,400 = ₦12,000'
      - section: 'Check'
        say: 'Now we check by going forward. Opening stock of two thousand, four hundred plus purchases of twelve thousand, minus closing stock of six thousand, four hundred, gives cost of sales of eight thousand.'
        write: '2,400 + 12,000 − 6,400 = 8,000'
      - say: 'Sales of eleven thousand minus eight thousand leaves three thousand, and minus two thousand of expenses leaves one thousand, the net profit given. It works.'
        write: '11,000 − 8,000 − 2,000 = 1,000 ✓'
      - section: 'In Nigeria'
        say: 'A provisions shop in Onitsha lost its purchase invoices, but the owner works back like this to her purchases.'
        write: 'Net profit ⇒ gross profit ⇒ cost of sales ⇒ purchases'
      - section: 'Answer'
        say: 'So the purchases for the month are twelve thousand naira, which is option C.'
        write: '$\therefore$ Purchases $=$ ₦12,000'
        answer: true
    traps:
      A: 'You chose thirteen thousand naira. That gives cost of sales of nine thousand and no net profit at all.'
      B: 'You went for eleven thousand naira. That is the sales figure, not the purchases.'
      D: 'You picked fourteen thousand naira. That treats the one thousand naira as gross profit and forgets to add back the expenses.'
  5:
    moments:
      - section: 'The question'
        say: 'The club received fourteen thousand, four hundred naira in subscriptions. But is all of it the income of nineteen ninety-three?'
        write: 'Subscriptions for 1993 = ?'
      - section: 'Name it'
        say: 'This is subscription income for the year, credited to the income and expenditure account.'
        write: 'Subscription income for 1993'
      - section: 'The rule'
        say: 'Take the cash received, remove what belongs to other years, and add what is still owed for this year.'
        write: 'Cash − last year''s − next year''s + still owing'
      - section: 'Remove other years'
        say: 'Fourteen thousand, four hundred minus seven hundred and fifty for nineteen ninety-two, minus two hundred and fifty for nineteen ninety-four, is thirteen thousand, four hundred naira.'
        write: '14,400 − 750 − 250 = 13,400'
      - section: 'Add what is owed'
        say: 'Members still owe nine hundred naira for nineteen ninety-three, so we add it. That gives fourteen thousand, three hundred naira.'
        write: '13,400 + 900 = ₦14,300'
      - section: 'Check'
        say: 'In the subscriptions account the debit side is seven hundred and fifty, plus fourteen thousand, three hundred, plus two hundred and fifty, which is fifteen thousand, three hundred. The credit side is fourteen thousand, four hundred plus nine hundred, also fifteen thousand, three hundred.'
        write: 'Dr 750 + 14,300 + 250 = 15,300;  Cr 14,400 + 900 = 15,300 ✓'
      - section: 'In Nigeria'
        say: 'In an Ibadan social club some members pay late, some pay early, and some still owe. The accounts count only this year''s fees.'
        write: 'Count only 1993''s fees'
      - section: 'Remember'
        say: 'Remember, income for the year is what was earned in the year, not just what came in.'
        write: 'Earned, not just received'
      - section: 'Answer'
        say: 'So the subscription for nineteen ninety-three is fourteen thousand, three hundred naira, which is option A.'
        write: '$\therefore$ ₦14,300'
        answer: true
    traps:
      B: 'You went for thirteen thousand, four hundred naira. You took out the other years, well done, but forgot to add the nine hundred naira still owing.'
      C: 'You chose fifteen thousand and fifty naira. That leaves in the seven hundred and fifty naira that belongs to nineteen ninety-two.'
      D: 'You picked fourteen thousand, five hundred and fifty naira. That leaves in the two hundred and fifty naira paid early for nineteen ninety-four.'
  6:
    moments:
      - section: 'The question'
        say: 'A club has no owner who puts in capital. So what do we call what it is worth, and how do we find it?'
        write: 'Accumulated fund on 1 January 1993 = ?'
      - section: 'Name it'
        say: 'This is the accumulated fund, the capital of a club.'
        write: 'Accumulated fund = club''s capital'
      - section: 'The rule'
        say: 'The accumulated fund is assets minus liabilities at the opening date.'
        write: '$\text{Accumulated fund} = \text{Assets} - \text{Liabilities}$'
      - section: 'Assets'
        say: 'Club equipment five thousand, plus cash at bank two thousand, two hundred and ninety-five, plus subscriptions in arrears seven hundred and fifty, gives eight thousand and forty-five naira.'
        write: '5,000 + 2,295 + 750 = 8,045'
      - say: 'The arrears are an asset, because the members owe that money to the club.'
        write: 'Arrears = owed to the club ⇒ asset'
      - section: 'Liabilities'
        say: 'The only liability is the rent owing of five hundred and twenty-five naira, because the club owes it to the landlord.'
        write: 'Rent owing ₦525 ⇒ liability'
      - say: 'So we take it from the assets. Eight thousand and forty-five minus five hundred and twenty-five is seven thousand, five hundred and twenty naira.'
        write: '8,045 − 525 = ₦7,520'
      - section: 'Check'
        say: 'Seven thousand, five hundred and twenty plus five hundred and twenty-five gives back eight thousand and forty-five, the assets.'
        write: '7,520 + 525 = 8,045 ✓'
      - section: 'Remember'
        say: 'Remember, it is own minus owe, the same as a trader''s capital with a club''s name.'
        write: 'Own − owe'
      - section: 'Answer'
        say: 'So the accumulated fund on the first of January is seven thousand, five hundred and twenty naira, which is option B.'
        write: '$\therefore$ ₦7,520'
        answer: true
    traps:
      A: 'You chose eight thousand, five hundred and seventy naira. That adds the rent owing, but rent owing is a liability, so it comes off.'
      C: 'You went for eight thousand, four hundred and seventy naira. That is too large. The assets less the rent owing give seven thousand, five hundred and twenty.'
      D: 'You picked seven thousand, eight hundred and fifty naira. That is still too large. Take the five hundred and twenty-five from eight thousand and forty-five.'
  7:
    moments:
      - section: 'The question'
        say: 'Eight amounts were spent on one machine. Which of them are part of its cost? One of them is a trap.'
        write: 'Initial cost of the machine = ?'
      - section: 'Name it'
        say: 'This is the cost of a fixed asset, now called property, plant and equipment.'
        write: 'Cost of a fixed asset'
      - section: 'The rule'
        say: 'Cost is every amount spent to get the machine in place and ready for use, less any discount on it. Things bought for later are not included.'
        write: 'Cost = price + costs to make it ready − discount'
      - section: 'Sort the list'
        say: 'Spare parts for future use are kept as stores, so they are left out.'
        write: 'Spare parts ₦1,200 ⇒ left out'
      - say: 'Sales tax, freight, assembly, installation and tuning are all paid to get the machine in place and working, so they are part of its cost.'
        write: 'Tax, freight, assembly, installation, tuning ⇒ included'
      - say: 'The purchases discount was taken off the price, so the machine really cost three hundred naira less. It comes off.'
        write: 'Discount ₦300 ⇒ taken off'
      - section: 'Add up'
        say: 'Fifteen thousand plus nine hundred sales tax is fifteen thousand, nine hundred. Less the three hundred discount, that leaves fifteen thousand, six hundred.'
        write: '15,000 + 900 − 300 = 15,600'
      - say: 'Add freight seven hundred and fifty, assembly five hundred, installation eight hundred and tuning seven hundred. That is eighteen thousand, three hundred and fifty naira.'
        write: '15,600 + 750 + 500 + 800 + 700 = ₦18,350'
      - section: 'In Nigeria'
        say: 'A bakery in Ibadan buys an oven. The price, the transport from Lagos and the fitting are all part of the oven''s cost.'
        write: 'Oven + transport + fitting = cost'
      - section: 'Remember'
        say: 'Remember, count everything to get it working and nothing for later.'
        write: 'Ready for use, nothing for later'
      - section: 'Answer'
        say: 'So the initial cost of the machine is eighteen thousand, three hundred and fifty naira, which is option B.'
        write: '$\therefore$ ₦18,350'
        answer: true
    traps:
      A: 'You chose seventeen thousand, five hundred naira. That is too small. It leaves out part of the cost of getting the machine ready.'
      C: 'You went for nineteen thousand, five hundred and fifty naira. That adds the spare parts, which are for future use.'
      D: 'You picked eighteen thousand, nine hundred and fifty naira. That adds the discount instead of taking it off.'
  8:
    moments:
      - section: 'The question'
        say: 'The pottery does not know its closing stock, but it knows its usual profit margin. That is enough to find it.'
        write: 'Sales ₦176,000, GP rate 40%, goods available ₦128,000'
      - section: 'Name it'
        say: 'This is the gross profit method of finding closing stock, now called inventory.'
        write: 'Gross profit method'
      - section: 'The rule'
        say: 'A gross profit rate of forty per cent on sales means gross profit is forty per cent of sales. Cost of sales is sales minus gross profit.'
        write: '$\text{COS} = \text{Sales} - \text{GP}$'
      - say: 'Goods available were either sold or are still in stock. So closing stock is goods available minus cost of sales.'
        write: '$\text{Closing stock} = \text{Goods available} - \text{Cost of sales}$'
      - section: 'Gross profit'
        say: 'Forty per cent of one hundred and seventy-six thousand naira is seventy thousand, four hundred naira.'
        write: '40% × 176,000 = 70,400'
      - section: 'Cost of sales'
        say: 'One hundred and seventy-six thousand minus seventy thousand, four hundred is one hundred and five thousand, six hundred naira.'
        write: '176,000 − 70,400 = 105,600'
      - section: 'Closing stock'
        say: 'One hundred and twenty-eight thousand minus one hundred and five thousand, six hundred is twenty-two thousand, four hundred naira.'
        write: '128,000 − 105,600 = ₦22,400'
      - section: 'Check'
        say: 'Seventy thousand, four hundred divided by one hundred and seventy-six thousand is forty per cent, the rate given.'
        write: '70,400 ÷ 176,000 = 40% ✓'
      - section: 'Remember'
        say: 'Remember, the margin belongs to sales, so use it on sales first.'
        write: 'Margin on sales first'
      - section: 'Answer'
        say: 'So the ending inventory is twenty-two thousand, four hundred naira, which is option D.'
        write: '$\therefore$ ₦22,400'
        answer: true
    traps:
      A: 'You chose seventy-six thousand, eight hundred naira. That takes sixty per cent of the goods available, but the rate belongs to sales.'
      B: 'You went for fifty-one thousand, three hundred naira. That does not come from goods available less cost of sales.'
      C: 'You picked thirty-two thousand naira. That is too large. Cost of sales is one hundred and five thousand, six hundred, which leaves twenty-two thousand, four hundred.'
  9:
    moments:
      - section: 'The question'
        say: 'Can Zoom pay its short-term debts without selling any stock? The quick ratio tells us.'
        write: 'Quick ratio of Zoom Plc = ?'
      - section: 'Name it'
        say: 'This is the quick ratio, also called the acid test ratio.'
        write: 'Quick ratio = acid test ratio'
      - section: 'The rule'
        say: 'Quick ratio is current assets minus stock, divided by current liabilities. Stock is left out because it is slowest to turn into cash.'
        write: '$\text{Quick ratio} = \dfrac{\text{Current assets} - \text{Stock}}{\text{Current liabilities}}$'
      - section: 'Quick assets'
        say: 'The quick assets are the current assets other than stock. Fixed assets and long-term investments are not current, so they stay out. Net debtors eighty-seven thousand, plus cash sixty thousand, plus bank one hundred thousand, is two hundred and forty-seven thousand naira.'
        write: '87,000 + 60,000 + 100,000 = 247,000'
      - section: 'Current liabilities'
        say: 'Creditors two hundred thousand plus other current liabilities one hundred thousand is three hundred thousand naira. The long-term loan is not current.'
        write: '200,000 + 100,000 = 300,000'
      - section: 'Divide'
        say: 'Two hundred and forty-seven thousand divided by three hundred thousand is about zero point eight two.'
        write: '$\dfrac{247{,}000}{300{,}000} = 0.82$'
      - section: 'Check'
        say: 'Quick assets are less than current liabilities, so the ratio must be below one. Zero point eight two fits.'
        write: '247,000 < 300,000 ⇒ ratio below 1 ✓'
      - section: 'Remember'
        say: 'Remember, the acid test burns off the stock.'
        write: 'Acid test burns off stock'
      - section: 'Answer'
        say: 'So the quick ratio is zero point eight two to one, which is option B.'
        write: '$\therefore$ 0.82 : 1'
        answer: true
    traps:
      A: 'You chose zero point nine five to one. That does not come from quick assets over current liabilities.'
      C: 'You went for one point five three to one. That is far too large, because quick assets are smaller than current liabilities.'
      D: 'You picked zero point nine one to one. That keeps the stock in, which is the current ratio, not the quick ratio.'
  10:
    moments:
      - section: 'The question'
        say: 'How much of Zoom belongs to its shareholders? Is it only the share capital? Let us see.'
        write: 'Owners'' equity = ?'
      - section: 'Name it'
        say: 'This is owners'' equity, also called shareholders'' funds.'
        write: 'Owners'' equity = shareholders'' funds'
      - section: 'The rule'
        say: 'Owners'' equity is share capital plus reserves, because the reserves are kept back for the shareholders.'
        write: '$\text{Equity} = \text{Share capital} + \text{Reserves}$'
      - say: 'Here there are two reserves. Share premium is a capital reserve, and the profit and loss balance is a revenue reserve, the profit kept back.'
        write: 'Reserves: share premium 15,000, profit and loss 60,000'
      - section: 'Add them'
        say: 'Paid-up capital two hundred thousand, plus fifteen thousand, plus sixty thousand, is two hundred and seventy-five thousand naira.'
        write: '200,000 + 15,000 + 60,000 = ₦275,000'
      - section: 'Check'
        say: 'Total assets of seven hundred and fifty-five thousand, less the loan, the creditors and the other current liabilities, also leaves two hundred and seventy-five thousand naira.'
        write: '755,000 − 180,000 − 200,000 − 100,000 = 275,000 ✓'
      - section: 'In Nigeria'
        say: 'A shareholder in a Lagos company owns a share of the capital and of every reserve kept back, not only the face value of her shares.'
        write: 'Shareholders own capital + reserves'
      - section: 'Remember'
        say: 'Remember, equity is capital plus reserves, or assets minus outside debts.'
        write: 'Capital + reserves = assets − outside debts'
      - section: 'Answer'
        say: 'So the owners'' equity is two hundred and seventy-five thousand naira, which is option A.'
        write: '$\therefore$ ₦275,000'
        answer: true
    traps:
      B: 'You chose seven hundred and fifty-five thousand naira. That is the balance sheet total, which includes debts owed to outsiders.'
      C: 'You went for two hundred thousand naira. That is the share capital alone. The share premium and retained profit also belong to the owners.'
      D: 'You picked two hundred and fifteen thousand naira. You added the share premium, good, but left out the sixty thousand naira of retained profit.'
  11:
    moments:
      - section: 'The question'
        say: 'We know how much raw material was used, bought, returned and left. Can we find how much there was at the start?'
        write: 'Opening stock of raw materials = ?'
      - section: 'Name it'
        say: 'This is a missing figure in the raw materials part of the manufacturing account.'
        write: 'Raw materials consumed'
      - section: 'The rule'
        say: 'Raw materials consumed is opening stock, plus purchases, less returns outwards, less closing stock.'
        write: '$\text{Consumed} = \text{Opening} + \text{Purchases} - \text{Returns} - \text{Closing}$'
      - section: 'Turn it round'
        say: 'To find the opening stock, we move the other items across, and each one changes its sign. So we add consumed, closing stock and returns, then take away the purchases.'
        write: '$\text{Opening} = \text{Consumed} + \text{Closing} + \text{Returns} - \text{Purchases}$'
      - section: 'Add'
        say: 'Three hundred thousand, plus one hundred thousand, two hundred and fifty, plus six thousand, seven hundred, is four hundred and six thousand, nine hundred and fifty naira.'
        write: '300,000 + 100,250 + 6,700 = 406,950'
      - section: 'Subtract'
        say: 'Four hundred and six thousand, nine hundred and fifty minus three hundred and twenty thousand is eighty-six thousand, nine hundred and fifty naira.'
        write: '406,950 − 320,000 = ₦86,950'
      - section: 'Check'
        say: 'Eighty-six thousand, nine hundred and fifty plus three hundred and twenty thousand, less six thousand, seven hundred, less one hundred thousand, two hundred and fifty, gives three hundred thousand. That is the amount consumed.'
        write: '86,950 + 320,000 − 6,700 − 100,250 = 300,000 ✓'
      - section: 'In Nigeria'
        say: 'A furniture factory in Aba knows how much timber it used, bought, sent back and has left. From these it finds what it started with.'
        write: 'Used, bought, returned, left ⇒ started with'
      - section: 'Answer'
        say: 'So the opening stock of raw materials is eighty-six thousand, nine hundred and fifty naira, which is option C.'
        write: '$\therefore$ ₦86,950'
        answer: true
    traps:
      A: 'You chose four hundred thousand, two hundred and fifty naira. That is consumed plus closing stock. The purchases still have to come out.'
      B: 'You went for seventy-three thousand, five hundred and fifty naira. That takes the returns off instead of adding them back.'
      D: 'You picked one hundred thousand, two hundred and fifty naira. That is the closing stock, not the opening stock.'
  12:
    moments:
      - section: 'The question'
        say: 'Four bills are shared between the factory and the office. Only the factory''s share goes into the cost of making goods. Let us build the production cost.'
        write: 'Production cost of finished goods = ?'
      - section: 'The rule'
        say: 'Prime cost is the direct cost of making the goods, which here is raw materials consumed plus manufacturing wages.'
        write: '$\text{Prime cost} = \text{Materials consumed} + \text{Direct wages}$'
      - say: 'Production cost is prime cost plus factory overheads, the indirect costs of running the factory.'
        write: '$\text{Production cost} = \text{Prime cost} + \text{Factory overheads}$'
      - section: 'Factory shares'
        say: 'The table gives the factory''s fraction of each shared bill, so we multiply each total by its fraction. Lighting first. One third of thirty thousand is ten thousand.'
        write: '$\tfrac{1}{3} \times 30{,}000 = 10{,}000$'
      - say: 'Power. Two fifths of seventy-five thousand is thirty thousand.'
