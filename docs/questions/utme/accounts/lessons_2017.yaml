        say: 'This is a gross loss on manufacturing.'
        write: 'Manufacturing loss'
      - section: 'How it arises'
        say: 'Goods made are passed to trading at market value. If that value is below the production cost, there is a loss.'
        write: 'Market value < production cost ⇒ loss'
      - section: 'The rule'
        say: 'A profit is carried forward as a credit and a loss as a debit. So the loss is debited to the profit and loss account.'
        write: 'Loss ⇒ Dr Profit and loss'
      - section: 'Example'
        say: 'If production cost is five hundred thousand naira and market value is four hundred and eighty thousand naira, the twenty thousand naira loss is debited to profit and loss.'
        write: '500,000 − 480,000 = ₦20,000 ⇒ Dr P and L'
      - section: 'In Nigeria'
        say: 'A furniture factory in Aba makes chairs that would be cheaper to buy outside. The shortfall cuts its net profit.'
        write: 'Loss cuts net profit'
      - section: 'Remember'
        say: 'Remember, losses land on the debit side, and profits on the credit side.'
        write: 'Loss = debit.  Profit = credit'
      - section: 'Answer'
        say: 'So a gross loss on manufacturing goes to the debit side of the profit and loss account, which is option D.'
        write: '$\therefore$ debit side of the profit and loss account'
        answer: true
    traps:
      A: 'You chose the credit side of the balance sheet. A loss for the year passes through profit and loss, not straight to the balance sheet.'
      B: 'You went for the credit side of profit and loss. That is where a manufacturing profit goes, not a loss.'
      C: 'You picked the debit side of the balance sheet. A loss is not an asset.'
