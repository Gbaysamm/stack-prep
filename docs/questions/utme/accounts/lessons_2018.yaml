# UTME 2018 Principles of Accounts, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Nigerian Accounts teacher works on the
# board: the question, the account, rule or concept named, the rule in plain words, the working
# (the double entry, the T account, or the calculation with data, formula, working and check), a
# Nigerian example, a way to remember it, and the answer moment that names the option.
#
#   say:     heard, not read. Abbreviations as letters or words ("brought down", "debit"),
#            money in words, percentages as "per cent", no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2018.yaml. Answers match that file. This paper
# has no paper-type question, so all 40 questions have a lesson.
format_version: 1
exam_year: 2018
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'Wamo pays fifty thousand naira to join a firm for one-fifth. Is his capital fifty thousand naira? Most students say yes. Let us check.'
        write: 'Old capitals ₦40,000, ₦50,000, ₦70,000. Wamo brings ₦50,000 for $\tfrac{1}{5}$. Equity $= ?$'
      - section: 'Name it'
        say: 'This is the admission of a new partner when no goodwill is recorded, sometimes called the bonus method.'
        write: 'Admission, no goodwill recorded (bonus method)'
      - section: 'The rule'
        say: 'With no goodwill, the new partner gets his share of the total capital after he joins.'
        write: '$\text{New partner''s capital} = (\text{Old capital} + \text{Cash brought in}) \times \text{share}$'
      - section: 'The working'
        say: 'First the old capital. Forty thousand plus fifty thousand plus seventy thousand is one hundred and sixty thousand naira.'
        write: '₦40,000 + ₦50,000 + ₦70,000 = ₦160,000'
      - say: 'Add Wamo''s fifty thousand naira, and the new total capital is two hundred and ten thousand naira.'
        write: '₦160,000 + ₦50,000 = ₦210,000'
      - say: 'One-fifth of two hundred and ten thousand naira is forty-two thousand naira.'
        write: '$\tfrac{1}{5} \times 210{,}000 =$ ₦42,000'
      - section: 'Check'
        say: 'Let us check. The old partners now hold two hundred and ten thousand less forty-two thousand, which is one hundred and sixty-eight thousand naira. That is four-fifths of the total, the share left after Wamo''s one-fifth.'
        write: '₦210,000 − ₦42,000 = ₦168,000 $= \tfrac{4}{5}$ ✓'
      - say: 'Now, Wamo paid fifty thousand naira but his capital is only forty-two thousand naira. The eight thousand naira difference is a bonus credited to the old partners.'
        write: '₦50,000 − ₦42,000 = ₦8,000 bonus to the old partners'
      - section: 'In Nigeria'
        say: 'Three lawyers in Abuja let a fourth in for one-fifth. He pays fifty thousand naira, but his capital account shows one-fifth of the new total.'
        write: 'Pays ₦50,000, capital ₦42,000'
      - section: 'Remember'
        say: 'Remember, new total first, then the fraction.'
        write: 'New total, then the fraction'
      - section: 'Answer'
        say: 'So Wamo''s equity is forty-two thousand naira, which is option D.'
        write: '$\therefore$ Wamo''s equity $=$ ₦42,000'
        answer: true
    traps:
      A: 'You chose forty thousand naira. That is a quarter of the old capital, and it forgets Wamo''s own fifty thousand naira.'
      B: 'You went for fifty thousand naira, the cash he paid. That would be his capital only if goodwill were recorded, and here it is not.'
      C: 'You picked thirty-two thousand naira. That is one-fifth of the old capital only. Add Wamo''s cash first.'
  2:
    moments:
      - section: 'The question'
        say: 'A partnership can carry on trading and still be dissolved in law. Which change does that?'
        write: 'A partnership is dissolved by ?'
      - section: 'Name it'
        say: 'This is the dissolution of a partnership, the ending of the old partnership agreement.'
        write: 'Dissolution = the old agreement ends'
      - section: 'The rule'
        say: 'A partnership is an agreement between particular persons. Any change in who the partners are ends the old agreement.'
        write: 'Change of partners ⇒ old partnership dissolved'
      - section: 'How it works'
        say: 'Admission, retirement or death of a partner each end the old firm, and a new firm is formed, even if the business carries on.'
        write: 'Admission, retirement, death ⇒ new firm'
      - section: 'In Nigeria'
        say: 'Two accountants in Enugu take in a third partner. The old two-partner firm ends, and a new deed is signed for all three.'
        write: 'Two partners + one ⇒ new deed for three'
      - section: 'Remember'
        say: 'Remember, a new face means a new firm.'
        write: 'New face, new firm'
      - section: 'Answer'
        say: 'So a partnership is dissolved on the admission of a new partner, which is option A.'
        write: '$\therefore$ admission of a new partner'
        answer: true
    traps:
      B: 'You chose a change of head office. That changes the address, not the partners or their agreement.'
      C: 'You went for buying fixed assets. That is ordinary business and does not end the agreement.'
      D: 'You picked the retirement of a manager. He is an employee, not a partner, so the partners stay the same.'
  3:
    moments:
      - section: 'The question'
        say: 'The bank says Adama is overdrawn by six hundred naira, but one thousand and eighty naira he paid in is missing. What should his cash book show?'
        write: 'Bank statement overdraft ₦600; lodgement ₦1,080 not credited. Cash book $= ?$'
      - section: 'Name it'
        say: 'This is bank reconciliation worked backwards, from the bank statement to the cash book.'
        write: 'Bank statement ⟶ cash book'
      - section: 'The rule'
        say: 'The lodgement is already in the cash book but not on the statement. So the cash book balance is the bank balance plus the uncredited lodgement.'
        write: '$\text{Cash book} = \text{Bank statement} + \text{Uncredited lodgement}$'
      - section: 'The working'
        say: 'An overdraft is money owed, so it counts as minus six hundred naira.'
        write: 'Bank statement balance $= -600$'
      - say: 'Minus six hundred plus one thousand and eighty is plus four hundred and eighty naira.'
        write: '$-600 + 1{,}080 = +480$'
      - section: 'Which side'
        say: 'Plus means money in the bank, an asset. In the cash book an asset is a debit, so we write four hundred and eighty naira debit.'
        write: 'Favourable balance in the cash book ⇒ ₦480 Dr'
      - say: 'The bank sees the same money as owed to Adama, so its statement would show it as a credit.'
        write: 'Cash book Dr = bank statement Cr'
      - section: 'In Nigeria'
        say: 'A pharmacy in Jos pays in money on the twenty-ninth of March. The statement printed on the thirty-first still shows the old overdraft, but the cash book already shows money in hand at the bank.'
        write: 'Paid in 29 March, statement 31 March'
      - section: 'Remember'
        say: 'Remember, money in the bank is a debit in your cash book and a credit on the bank statement.'
        write: 'Your book Dr, bank''s statement Cr'
      - section: 'Answer'
        say: 'So Adama''s cash book shows four hundred and eighty naira debit, which is option C.'
        write: '$\therefore$ ₦480 Dr'
        answer: true
    traps:
      A: 'You chose one thousand six hundred and eighty naira. That adds the overdraft as if it were money in the bank. An overdraft must be taken away.'
      B: 'You went for one thousand and eighty naira credit. That is the lodgement alone, and a favourable balance is not a credit in the cash book.'
      D: 'You picked six hundred naira debit. That leaves the overdraft unadjusted, and an overdraft would be a credit in the cash book anyway.'
  4:
    moments:
      - section: 'The question'
        say: 'Why does an accountant fiddle with the figures at the year end instead of just using what was paid? Let us see.'
        write: 'Why are adjustments in the P and L account necessary?'
      - section: 'Name it'
        say: 'These are the year-end adjustments, such as accruals, prepayments, bad debts and depreciation.'
        write: 'Adjustments = accruals, prepayments, bad debts, depreciation'
      - section: 'The rule'
        say: 'By the accruals concept, the profit and loss account must show the expenses incurred and the income earned in the year, not just the cash.'
        write: 'Expenses incurred and income earned, not cash paid and received'
      - section: 'How it works'
        say: 'An expense still owed at the year end is added to what was paid, because it was used this year.'
        write: 'Expense owed ⇒ add'
      - say: 'An expense paid in advance is taken off, because it belongs to next year.'
        write: 'Expense prepaid ⇒ take off'
      - say: 'Income earned but not yet received is added, because it was earned this year.'
        write: 'Income earned, not received ⇒ add'
      - section: 'In Nigeria'
        say: 'A bakery in Ibadan paid ninety thousand naira for electricity but still owes ten thousand naira for December. Its account shows one hundred thousand naira, the power it really used.'
        write: '₦90,000 paid + ₦10,000 owed = ₦100,000 used'
      - section: 'Remember'
        say: 'Remember, adjust to what was used and earned, not what was paid and received.'
        write: 'Used and earned, not paid and received'
      - section: 'Answer'
        say: 'So adjustments are made to ascertain the actual expenses incurred and income earned in the year, which is option D.'
        write: '$\therefore$ to find the actual expenses incurred and income earned'
        answer: true
    traps:
      A: 'You chose covering next year''s expenses. A prepayment is carried forward, but the aim is the right expense for this year.'
      B: 'You went for showing provisions. Provisions are one kind of adjustment, not the reason for making them.'
      C: 'You picked total expenses paid and income received. That is cash accounting, which the adjustments correct.'
  5:
    moments:
      - section: 'The question'
        say: 'Udoh Trading Company has a balance sheet worth sixty-eight thousand naira. How much does it really have to run the business day to day?'
        write: 'Udoh Trading Company, working capital $= ?$'
      - section: 'Name it'
        say: 'This is working capital, also called net current assets.'
        write: 'Working capital (net current assets)'
      - section: 'The rule'
        say: 'Working capital is current assets minus current liabilities.'
        write: '$\text{Working capital} = \text{Current assets} - \text{Current liabilities}$'
      - section: 'Current assets'
        say: 'Current assets are cash and items that turn into cash within a year. Stock four thousand, debtors six thousand and cash eight thousand naira make eighteen thousand naira.'
        write: '₦4,000 + ₦6,000 + ₦8,000 = ₦18,000'
      - say: 'Land and building are kept for many years, so they are fixed assets and stay out.'
        write: 'Land, building ⇒ fixed, left out'
      - section: 'Current liabilities'
        say: 'Current liabilities are debts due within a year. Creditors nine thousand and accrued wages five thousand naira make fourteen thousand naira.'
        write: '₦9,000 + ₦5,000 = ₦14,000'
      - say: 'The long-term loan is repaid over many years, so it is not current and stays out.'
        write: 'Long-term loan ⇒ not current, left out'
      - section: 'The working'
        say: 'Eighteen thousand minus fourteen thousand is four thousand naira.'
        write: '₦18,000 − ₦14,000 = ₦4,000'
      - section: 'Check'
        say: 'Another way. The long-term money is capital plus the loan, fifty-four thousand naira. The fixed assets take fifty thousand naira of it, so the four thousand naira left over is what runs the business day to day. It agrees.'
        write: '(₦39,000 + ₦15,000) − ₦50,000 = ₦4,000 ✓'
      - section: 'Remember'
        say: 'Remember, current less current. A provisions shop in Onitsha with eighteen thousand naira coming in and fourteen thousand naira going out soon has four thousand naira to work with.'
        write: 'Current less current'
      - section: 'Answer'
        say: 'So the working capital is four thousand naira, which is option C.'
        write: '$\therefore$ Working capital $=$ ₦4,000'
        answer: true
    traps:
      A: 'You chose eleven thousand naira. That does not come from current assets less current liabilities, which is eighteen thousand minus fourteen thousand.'
      B: 'You went for eight thousand naira, the cash alone. Stock and debtors are current assets too, and the current liabilities must come off.'
      D: 'You picked twelve thousand naira. That is too high. Eighteen thousand less fourteen thousand leaves four thousand naira.'
  6:
    moments:
      - section: 'The question'
        say: 'If Udoh could not sell any stock tomorrow, could it still pay its short term bills? The acid test tells us.'
        write: 'Udoh Trading Company, acid test ratio $= ?$'
      - section: 'Name it'
        say: 'This is the acid test ratio, also called the quick ratio.'
        write: 'Acid test (quick) ratio'
      - section: 'The rule'
        say: 'Take the stock out of current assets, then divide by current liabilities. Stock is left out because it takes time to sell.'
        write: '$\text{Acid test} = \dfrac{\text{Current assets} - \text{Stock}}{\text{Current liabilities}}$'
      - section: 'Quick assets'
        say: 'Current assets of eighteen thousand naira, less stock of four thousand naira, leave fourteen thousand naira.'
        write: '₦18,000 − ₦4,000 = ₦14,000'
      - section: 'Current liabilities'
        say: 'Creditors and accrued wages together are fourteen thousand naira.'
        write: '₦9,000 + ₦5,000 = ₦14,000'
      - section: 'The working'
        say: 'Fourteen thousand over fourteen thousand is one, so the ratio is one to one.'
        write: '$\dfrac{14{,}000}{14{,}000} = 1 \Rightarrow 1:1$'
      - section: 'In Nigeria'
        say: 'A pharmacy in Kaduna with fourteen thousand naira of cash and money due can pay fourteen thousand naira of bills without selling a single drug.'
        write: 'Quick assets ₦14,000 cover bills ₦14,000'
      - section: 'Remember'
        say: 'Remember, the acid test takes the stock out, and one to one is the textbook guide.'
        write: 'Stock out. Guide 1:1'
      - section: 'Answer'
        say: 'So the acid test ratio is one to one, which is option A.'
        write: '$\therefore$ Acid test ratio $= 1:1$'
        answer: true
    traps:
      B: 'You chose two to three. That would mean quick assets of only about nine thousand naira, but they are fourteen thousand naira.'
      C: 'You went for one to two. That would mean quick assets of only seven thousand naira, but they are fourteen thousand naira.'
      D: 'You picked three to two. That would need twenty-one thousand naira of quick assets, and the company has fourteen thousand naira.'
  7:
    moments:
      - section: 'The question'
        say: 'Wazobia Enterprises trades for one month. What is its balance sheet total at the end of January? Watch the rent carefully.'
        write: 'Wazobia Enterprises, balance sheet total at 31/1/95 $= ?$'
      - section: 'The rule'
        say: 'The balance sheet total is the closing capital, and closing capital is opening capital plus net profit. So we must first find January''s net profit.'
        write: 'Closing capital = opening capital + net profit'
      - say: 'Now the rent. Rent paid for the whole year belongs to January for one month only. The rest is a prepayment, which is an asset.'
        write: 'Rent, one month = expense, rest = prepaid asset'
      - section: 'Gross profit'
        say: 'Cost of sales is purchases of fifteen thousand naira less the stock left of ten thousand naira, which is five thousand naira. There was no opening stock.'
        write: 'Cost of sales ₦15,000 − ₦10,000 = ₦5,000'
      - say: 'So sales of eight thousand two hundred naira less five thousand naira give a gross profit of three thousand two hundred naira.'
        write: 'Gross profit ₦8,200 − ₦5,000 = ₦3,200'
      - section: 'January''s rent'
        say: 'Twelve thousand naira for twelve months is one thousand naira a month. So January''s rent is one thousand naira, and eleven thousand naira is prepaid.'
        write: '₦12,000 ÷ 12 = ₦1,000;  prepaid ₦11,000'
      - section: 'Net profit'
        say: 'Three thousand two hundred, less rent of one thousand, less the sales boy''s five hundred, gives a net profit of one thousand seven hundred naira.'
        write: '₦3,200 − ₦1,000 − ₦500 = ₦1,700'
      - say: 'So capital grows from forty thousand naira to forty-one thousand seven hundred naira.'
        write: '₦40,000 + ₦1,700 = ₦41,700'
      - section: 'The assets'
        say: 'Now the cash. Cash is twenty-eight thousand five hundred plus sales of eight thousand two hundred, less rent of twelve thousand, purchases of fifteen thousand and wages of five hundred, which is nine thousand two hundred naira.'
        write: 'Cash ₦28,500 + ₦8,200 − ₦12,000 − ₦15,000 − ₦500 = ₦9,200'
      - say: 'Furnishings ten thousand, fan one thousand five hundred, stock ten thousand, rent prepaid eleven thousand and cash nine thousand two hundred add up to forty-one thousand seven hundred naira.'
        write: '10,000 + 1,500 + 10,000 + 11,000 + 9,200 = ₦41,700'
      - section: 'Check'
        say: 'Capital and assets both come to forty-one thousand seven hundred naira, so the balance sheet balances.'
        write: 'Capital ₦41,700 = Assets ₦41,700 ✓'
      - section: 'Remember'
        say: 'Remember, charge the months used and carry forward the months paid ahead.'
        write: 'Months used = expense.  Months ahead = asset'
      - section: 'Answer'
        say: 'So the new balance sheet total is forty-one thousand seven hundred naira, which is option C.'
        write: '$\therefore$ Balance sheet total $=$ ₦41,700'
        answer: true
    traps:
      A: 'You chose forty thousand naira, the opening total. The business made a profit of one thousand seven hundred naira in January.'
      B: 'You went for forty-one thousand five hundred naira. That is two hundred naira short. The assets add up to forty-one thousand seven hundred naira.'
      D: 'You picked forty-eight thousand five hundred naira. That is too high, because capital can only grow by January''s profit.'
  8:
    moments:
      - section: 'The question'
        say: 'Wazobia started January with twenty-eight thousand five hundred naira in cash. How much is left at the end of the month?'
        write: 'Wazobia Enterprises, cash at 31/1/95 $= ?$'
      - section: 'Name it'
        say: 'This is the cash account. Cash received goes on the debit side and cash paid goes on the credit side.'
        write: 'Cash account: Dr = in, Cr = out'
      - section: 'The rule'
        say: 'Closing cash is opening cash plus cash received minus cash paid.'
        write: 'Closing cash = opening + received − paid'
      - section: 'Debit side'
        say: 'Balance brought down twenty-eight thousand five hundred naira, plus sales of eight thousand two hundred naira, makes thirty-six thousand seven hundred naira.'
        write: '₦28,500 + ₦8,200 = ₦36,700'
      - section: 'Credit side'
        say: 'Rent twelve thousand, purchases fifteen thousand and the sales boy five hundred naira make twenty-seven thousand five hundred naira.'
        write: '₦12,000 + ₦15,000 + ₦500 = ₦27,500'
      - section: 'The working'
        say: 'Thirty-six thousand seven hundred minus twenty-seven thousand five hundred is nine thousand two hundred naira.'
        write: '₦36,700 − ₦27,500 = ₦9,200'
      - section: 'Check'
        say: 'Twenty-seven thousand five hundred plus nine thousand two hundred gives back thirty-six thousand seven hundred, so both sides agree.'
        write: '₦27,500 + ₦9,200 = ₦36,700 ✓'
      - section: 'Remember'
        say: 'Remember, the stock left on the shelf is goods, not cash spent, so it stays out of the cash account.'
        write: 'Closing stock is not a payment'
      - section: 'Answer'
        say: 'So the cash balance at the end of January is nine thousand two hundred naira, which is option B.'
        write: '$\therefore$ Cash $=$ ₦9,200'
        answer: true
    traps:
      A: 'You chose twenty-two thousand eight hundred naira. That is too high. Rent, purchases and wages took twenty-seven thousand five hundred naira out.'
      C: 'You went for eight hundred naira. That takes the closing stock off as if it were a payment, but stock is goods on the shelf.'
      D: 'You picked twenty-one thousand one hundred and twenty naira. That does not come from cash in less cash out.'
  9:
    moments:
      - section: 'The question'
        say: 'A shareholder pays before the company asks. Is that money the company''s, or does it still owe it? Let us see.'
        write: 'Calls in advance in the balance sheet = ?'
      - section: 'Name it'
        say: 'These are calls in advance, money a shareholder pays before the call is due.'
        write: 'Calls in advance = paid before the call is made'
      - section: 'The rule'
        say: 'Until the call is made, the money is not yet share capital. The company holds it for the shareholder and may pay interest on it, so it is a current liability.'
        write: 'Not yet share capital ⇒ current liability'
      - section: 'The entry'
        say: 'When the money comes in, debit bank and credit calls in advance account.'
        write: 'Dr Bank, Cr Calls in advance'
      - section: 'In Nigeria'
        say: 'A shareholder of a Lagos company pays the final call of twenty thousand naira three months early. The company owes her that money until the call is made.'
        write: '₦20,000 paid early ⇒ owed to her'
      - section: 'Remember'
        say: 'Remember, paid before called is still owed.'
        write: 'Paid before called = still owed'
      - section: 'Answer'
        say: 'So calls in advance are shown as a current liability, which is option C.'
        write: '$\therefore$ current liability'
        answer: true
    traps:
      A: 'You chose current asset. The cash is an asset, but the calls in advance are owed to the shareholder.'
      B: 'You went for fixed asset. A fixed asset is property used for years, like land or machinery.'
      D: 'You picked fixed liability. That lasts for years, like debentures, but calls in advance clear when the call is made.'
  10:
    moments:
      - section: 'The question'
        say: 'A company buys a business and pays the seller with shares, not cash. What is the double entry?'
        write: 'Shares issued to a vendor ⇒ debit ?'
      - section: 'Name it'
        say: 'This is the purchase of a business paid for in shares. The seller is called the vendor.'
        write: 'Vendor = the seller of the business'
      - section: 'Step one'
        say: 'When the business is bought, the assets are debited and the vendor is credited, because the company owes him.'
        write: 'Dr Assets, Cr Vendor'
      - section: 'Step two'
        say: 'When shares are issued to pay him, the vendor is debited to clear his account and share capital is credited.'
        write: 'Dr Vendor, Cr Share capital'
      - section: 'Check'
        say: 'The vendor''s account now has the same amount on both sides, so it closes, and share capital rises.'
        write: 'Vendor account closes ✓'
      - section: 'In Nigeria'
        say: 'A Lagos company buys a bakery for five million naira and pays the baker with five million one naira shares.'
        write: '₦5 million bakery ⇒ 5 million ₦1 shares'
      - section: 'Remember'
        say: 'Remember, shares going out are credited to share capital, and the vendor who is paid is debited.'
        write: 'Shares out = Cr share capital'
      - section: 'Answer'
        say: 'So we debit the vendor''s account and credit share capital, which is option D.'
        write: '$\therefore$ Dr Vendor''s account, Cr Share capital account'
        answer: true
    traps:
      A: 'You chose debit cash. No cash moves when the vendor is paid in shares.'
      B: 'You went for debit share capital and credit the vendor. The sides are reversed, because issuing shares credits share capital.'
      C: 'You picked debit share capital and credit cash. No cash is paid, and share capital is credited, not debited.'
  11:
    moments:
      - section: 'The question'
        say: 'Joy took money out of the firm twice. The firm charges her five per cent a year for it. How much interest does she pay?'
        write: 'Joy, ₦100 on 1 April and ₦240 on 1 July, 5% p.a., year ends 31 Dec. Interest $= ?$'
      - section: 'Name it'
        say: 'This is interest on drawings, a charge on partners who take money out during the year.'
        write: 'Interest on drawings'
      - section: 'The rule'
        say: 'Interest runs from the date of each drawing to the year end. So it is the amount, times the rate, times the months to the year end over twelve.'
        write: '$\text{Interest} = \text{Amount} \times \text{Rate} \times \dfrac{\text{Months to year end}}{12}$'
      - section: 'First drawing'
        say: 'From the first of April to the thirty-first of December is nine months.'
        write: '1 April ⟶ 31 December = 9 months'
      - say: 'One hundred naira times five per cent times nine over twelve is three naira seventy-five kobo.'
        write: '$100 \times 5\% \times \tfrac{9}{12} = 3.75$'
      - section: 'Second drawing'
        say: 'From the first of July to the year end is six months.'
        write: '1 July ⟶ 31 December = 6 months'
      - say: 'Two hundred and forty naira times five per cent times six over twelve is six naira.'
        write: '$240 \times 5\% \times \tfrac{6}{12} = 6.00$'
      - section: 'Total'
        say: 'Three naira seventy-five kobo plus six naira is nine naira seventy-five kobo.'
        write: '₦3.75 + ₦6.00 = ₦9.75'
      - section: 'Check'
        say: 'A full year on all three hundred and forty naira would be seventeen naira. Joy''s money was out for only part of the year, so her interest must be less.'
        write: '₦9.75 < ₦17 ✓'
      - section: 'Remember'
        say: 'Remember, count from the day the money was taken to the year end. Two tailors in Owerri who draw early in the year pay more.'
        write: 'Count from the day taken to the year end'
      - section: 'Answer'
        say: 'So the interest on Joy''s drawings is nine naira seventy-five kobo, which is option B.'
        write: '$\therefore$ Interest on Joy''s drawings $=$ ₦9.75'
        answer: true
    traps:
      A: 'You chose seventeen naira. That charges a full year on both drawings, but they were out for only nine and six months.'
      C: 'You went for eleven naira twenty-five kobo. That is the interest on Rakiya''s drawings, not Joy''s.'
      D: 'You picked seven naira twenty-five kobo. That counts the April drawing from the first of January instead of to the year end.'
  12:
    moments:
      - section: 'The question'
        say: 'Rakiya took five hundred naira out and earned nothing this year. What does her current account show at the end?'
        write: 'Rakiya, ₦200 on 31 March and ₦300 on 30 September, 5% p.a. Closing current account $= ?$'
      - section: 'Name it'
