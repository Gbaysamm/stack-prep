# UTME 2018 Principles of Accounts, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Nigerian Accounts teacher works on the
# board: what is given and what we must find, the account, rule or concept named, the rule in
# plain words, the working (the double entry, the T account, or the calculation), and the
# answer moment that names the option.
#
#   say:     heard, not read. Abbreviations as letters or words ("brought down", "debit"),
#            money in words, percentages as "per cent", no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2018.yaml. Answers match that file. This paper
# has no paper-type question, so all 40 questions have a lesson.
format_version: 1
exam_year: 2018
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'Three partners have capitals of forty thousand, fifty thousand and seventy thousand naira. Wamo brings in fifty thousand naira cash for a one-fifth share of the capital, and no goodwill is recorded. We must find Wamo''s equity, his capital in the new firm.'
        write: 'Old capitals ₦40,000, ₦50,000, ₦70,000. Wamo brings ₦50,000 for $\tfrac{1}{5}$. Equity $= ?$'
      - section: 'The rule'
        say: 'With no goodwill recorded, the new partner''s capital is his share of the total capital after he joins. That total is the old capital plus the cash he brings in.'
        write: '$\text{New partner''s capital} = (\text{Old capital} + \text{Cash brought in}) \times \text{share}$'
      - section: 'The working'
        say: 'First the old capital. Forty thousand plus fifty thousand plus seventy thousand is one hundred and sixty thousand naira.'
        write: '₦40,000 + ₦50,000 + ₦70,000 = ₦160,000'
      - say: 'Add Wamo''s fifty thousand naira, and the new total capital is two hundred and ten thousand naira.'
        write: '₦160,000 + ₦50,000 = ₦210,000'
      - say: 'One-fifth of two hundred and ten thousand naira is forty-two thousand naira.'
        write: '$\tfrac{1}{5} \times 210{,}000 =$ ₦42,000'
      - say: 'Wamo paid fifty thousand naira but his capital is only forty-two thousand naira. The eight thousand naira difference is a bonus credited to the old partners.'
        write: '₦50,000 − ₦42,000 = ₦8,000 bonus to the old partners'
      - section: 'Answer'
        say: 'So Wamo''s equity is forty-two thousand naira, which is option D.'
        write: '$\therefore$ Wamo''s equity $=$ ₦42,000'
        answer: true
    traps:
      A: 'You chose forty thousand naira. That treats the old one hundred and sixty thousand naira as four-fifths, which makes one-fifth forty thousand. But Wamo''s own fifty thousand naira is also in the firm, so the total is two hundred and ten thousand naira, and one-fifth of it is forty-two thousand.'
      B: 'You went for fifty thousand naira, the cash he paid. That would be his capital only if goodwill were recorded, and here it is not.'
      C: 'You picked thirty-two thousand naira. That is one-fifth of the old capital only. Add Wamo''s cash first, then take one-fifth.'
  2:
    moments:
      - section: 'The question'
        say: 'We must find which change dissolves a partnership.'
        write: 'A partnership is dissolved by ?'
      - section: 'The rule'
        say: 'A partnership is an agreement between particular persons. Dissolution means that agreement ends. So any change in who the partners are ends the old agreement.'
        write: 'Change of partners ⇒ old partnership dissolved'
      - section: 'How it works'
        say: 'The admission, retirement or death of a partner each ends the old firm, and a new firm is formed, even if the business carries on trading.'
        write: 'Admission, retirement, death ⇒ new firm'
      - section: 'Answer'
        say: 'So a partnership is dissolved on the admission of a new partner, which is option A.'
        write: '$\therefore$ admission of a new partner'
        answer: true
    traps:
      B: 'You chose a change of head office. That changes the address, not the partners or their agreement.'
      C: 'You went for buying fixed assets. That is ordinary business and does not end the agreement.'
      D: 'You picked the retirement of a manager. He is an employee, not a partner, so the partners stay the same.'
  3:
    moments:
      - section: 'The question'
        say: 'Adama''s bank statement shows an overdraft of six hundred naira. One thousand and eighty naira he paid in has not yet been credited by the bank. We must find the balance in his cash book.'
        write: 'Bank statement overdraft ₦600; lodgement ₦1,080 not credited. Cash book $= ?$'
      - section: 'The rule'
        say: 'Adama recorded the lodgement in his cash book when he paid it in, but the bank has not. So the cash book balance is the bank balance plus the uncredited lodgement.'
        write: '$\text{Cash book} = \text{Bank statement} + \text{Uncredited lodgement}$'
      - section: 'The working'
        say: 'An overdraft is money owed to the bank, so it counts as minus six hundred naira.'
        write: 'Bank statement balance $= -600$'
      - say: 'Minus six hundred plus one thousand and eighty is plus four hundred and eighty naira.'
        write: '$-600 + 1{,}080 = +480$'
      - section: 'Which side'
        say: 'Plus means money in the bank, an asset. In the cash book an asset is a debit, so we write four hundred and eighty naira debit.'
        write: 'Favourable balance in the cash book ⇒ ₦480 Dr'
      - say: 'The bank sees the same money as owed to Adama, so its statement would show it as a credit.'
        write: 'Cash book Dr = bank statement Cr'
      - section: 'Answer'
        say: 'So Adama''s cash book shows four hundred and eighty naira debit, which is option C.'
        write: '$\therefore$ ₦480 Dr'
        answer: true
    traps:
      A: 'You chose one thousand six hundred and eighty naira. That adds the overdraft as if it were money in the bank. An overdraft is minus six hundred, so the lodgement brings it to plus four hundred and eighty.'
      B: 'You went for one thousand and eighty naira credit. That is the lodgement alone, and a favourable balance is a debit in the cash book, not a credit.'
      D: 'You picked six hundred naira debit. That leaves out the lodgement, and an overdraft would be a credit in the cash book anyway.'
  4:
    moments:
      - section: 'The question'
        say: 'We must say why adjustments are needed in the profit and loss account.'
        write: 'Why are adjustments in the P and L account necessary?'
      - section: 'Name it'
        say: 'Adjustments are the year-end changes such as accruals, prepayments, bad debts and depreciation.'
        write: 'Adjustments = accruals, prepayments, bad debts, depreciation'
      - section: 'The rule'
        say: 'By the accruals concept, the profit and loss account must show the expenses incurred and the income earned in the year, not just the cash paid and received.'
        write: 'Expenses incurred and income earned, not cash paid and received'
      - section: 'How it works'
        say: 'An expense still owed at the year end is added to what was paid, because it was used this year.'
        write: 'Expense owed ⇒ add'
      - say: 'An expense paid in advance is taken off, because it belongs to next year.'
        write: 'Expense prepaid ⇒ take off'
      - say: 'Income earned but not yet received is added, because it was earned this year.'
        write: 'Income earned, not received ⇒ add'
      - section: 'Answer'
        say: 'So adjustments are made to ascertain the actual expenses incurred and income earned in the year, which is option D.'
        write: '$\therefore$ to find the actual expenses incurred and income earned'
        answer: true
    traps:
      A: 'You chose covering next year''s expenses. A prepayment is carried forward, but the aim is the right expense for this year.'
      B: 'You went for showing provisions. Provisions are one kind of adjustment, not the reason for making them.'
      C: 'You picked total expenses paid and income received. That is cash accounting, which the adjustments correct.'
  5:
    moments:
      - section: 'The question'
        say: 'We are given the balance sheet of Udoh Trading Company. We must find its working capital.'
        write: 'Udoh Trading Company, working capital $= ?$'
      - section: 'The rule'
        say: 'Working capital, also called net current assets, is current assets minus current liabilities.'
        write: '$\text{Working capital} = \text{Current assets} - \text{Current liabilities}$'
      - section: 'Current assets'
        say: 'Current assets are cash and items that turn into cash within a year. Stock four thousand, debtors six thousand and cash eight thousand naira make eighteen thousand naira.'
        write: '₦4,000 + ₦6,000 + ₦8,000 = ₦18,000'
      - say: 'Land and building are kept for many years, so they are fixed assets and stay out.'
        write: 'Land, building ⇒ fixed, left out'
      - section: 'Current liabilities'
        say: 'Current liabilities are debts due within a year. Creditors nine thousand and accrued wages five thousand naira make fourteen thousand naira.'
        write: '₦9,000 + ₦5,000 = ₦14,000'
      - say: 'The long-term loan is repaid over many years, so it is not current and stays out.'
        write: 'Long-term loan ⇒ not current, left out'
      - section: 'The working'
        say: 'Eighteen thousand minus fourteen thousand is four thousand naira.'
        write: '₦18,000 − ₦14,000 = ₦4,000'
      - section: 'Answer'
        say: 'So the working capital is four thousand naira, which is option C.'
        write: '$\therefore$ Working capital $=$ ₦4,000'
        answer: true
    traps:
      A: 'You chose eleven thousand naira. Working capital is current assets of eighteen thousand less current liabilities of fourteen thousand, which is four thousand naira.'
      B: 'You went for eight thousand naira, the cash alone. Stock and debtors are current assets too, and the current liabilities must come off.'
      D: 'You picked twelve thousand naira. Current assets are eighteen thousand naira and current liabilities fourteen thousand naira, so the working capital is four thousand.'
  6:
    moments:
      - section: 'The question'
        say: 'From the same balance sheet of Udoh Trading Company, we must find the acid test ratio.'
        write: 'Udoh Trading Company, acid test ratio $= ?$'
      - section: 'The rule'
        say: 'The acid test ratio, also called the quick ratio, takes the stock out of current assets and divides what is left by current liabilities. Stock is left out because it takes time to sell.'
        write: '$\text{Acid test} = \dfrac{\text{Current assets} - \text{Stock}}{\text{Current liabilities}}$'
      - section: 'Quick assets'
        say: 'Current assets are stock, debtors and cash, which make eighteen thousand naira. Less stock of four thousand naira, they leave fourteen thousand naira.'
        write: '₦18,000 − ₦4,000 = ₦14,000'
      - section: 'Current liabilities'
        say: 'Creditors of nine thousand and accrued wages of five thousand naira make fourteen thousand naira.'
        write: '₦9,000 + ₦5,000 = ₦14,000'
      - section: 'The working'
        say: 'Fourteen thousand over fourteen thousand is one, so the ratio is one to one.'
        write: '$\dfrac{14{,}000}{14{,}000} = 1 \Rightarrow 1:1$'
      - section: 'Answer'
        say: 'So the acid test ratio is one to one, which is option A.'
        write: '$\therefore$ Acid test ratio $= 1:1$'
        answer: true
    traps:
      B: 'You chose two to three. Quick assets of fourteen thousand naira over current liabilities of fourteen thousand naira is one to one.'
      C: 'You went for one to two. That would need current liabilities twice the quick assets, but both are fourteen thousand naira.'
      D: 'You picked three to two. Quick assets and current liabilities are equal, fourteen thousand naira each, so the ratio is one to one.'
  7:
    moments:
      - section: 'The question'
        say: 'Wazobia Enterprises starts January with capital of forty thousand naira. During the month it pays a year''s rent, buys and sells goods for cash, keeps some stock and pays wages. We must find the balance sheet total at the end of January.'
        write: 'Wazobia Enterprises, balance sheet total at 31/1/95 $= ?$'
      - section: 'The rule'
        say: 'The balance sheet total is the closing capital, and closing capital is opening capital plus net profit. So we must first find January''s net profit.'
        write: 'Closing capital = opening capital + net profit'
      - say: 'The rent of twelve thousand naira was paid for the whole year, but only one month of it belongs to January. The rest is a prepayment, which is an asset.'
        write: 'Rent, one month = expense, rest = prepaid asset'
      - section: 'Gross profit'
        say: 'There was no opening stock. So cost of sales is purchases of fifteen thousand naira less the stock left of ten thousand naira, which is five thousand naira.'
        write: 'Cost of sales ₦15,000 − ₦10,000 = ₦5,000'
      - say: 'Sales of eight thousand two hundred naira less five thousand naira give a gross profit of three thousand two hundred naira.'
        write: 'Gross profit ₦8,200 − ₦5,000 = ₦3,200'
      - section: 'January''s rent'
        say: 'Twelve thousand naira for twelve months is one thousand naira a month. So January''s rent is one thousand naira, and eleven thousand naira is prepaid.'
        write: '₦12,000 ÷ 12 = ₦1,000;  prepaid ₦11,000'
      - section: 'Net profit'
        say: 'Three thousand two hundred, less rent of one thousand, less the sales boy''s five hundred, gives a net profit of one thousand seven hundred naira.'
        write: '₦3,200 − ₦1,000 − ₦500 = ₦1,700'
      - say: 'So capital grows from forty thousand naira to forty-one thousand seven hundred naira.'
        write: '₦40,000 + ₦1,700 = ₦41,700'
      - section: 'The assets'
        say: 'The assets side must come to the same total. First the cash. Twenty-eight thousand five hundred plus sales of eight thousand two hundred, less rent of twelve thousand, purchases of fifteen thousand and wages of five hundred, is nine thousand two hundred naira.'
        write: 'Cash ₦28,500 + ₦8,200 − ₦12,000 − ₦15,000 − ₦500 = ₦9,200'
      - say: 'Furnishings ten thousand, fan one thousand five hundred, stock ten thousand, rent prepaid eleven thousand and cash nine thousand two hundred add up to forty-one thousand seven hundred naira.'
        write: '10,000 + 1,500 + 10,000 + 11,000 + 9,200 = ₦41,700'
      - section: 'Answer'
        say: 'So the new balance sheet total is forty-one thousand seven hundred naira, which is option C.'
        write: '$\therefore$ Balance sheet total $=$ ₦41,700'
        answer: true
    traps:
      A: 'You chose forty thousand naira, the opening total. The business made a profit of one thousand seven hundred naira in January, which adds to capital.'
      B: 'You went for forty-one thousand five hundred naira. Capital of forty thousand plus January''s profit of one thousand seven hundred is forty-one thousand seven hundred naira.'
      D: 'You picked forty-eight thousand five hundred naira. Capital can only grow by January''s profit of one thousand seven hundred naira, so the total is forty-one thousand seven hundred.'
  8:
    moments:
      - section: 'The question'
        say: 'Wazobia started January with twenty-eight thousand five hundred naira in cash, and all its purchases and sales were for cash. We must find the cash balance at the end of January.'
        write: 'Wazobia Enterprises, cash at 31/1/95 $= ?$'
      - section: 'The rule'
        say: 'In the cash account, cash received goes on the debit side and cash paid goes on the credit side. Closing cash is opening cash plus cash received minus cash paid.'
        write: 'Closing cash = opening + received − paid'
      - section: 'Debit side'
        say: 'The opening balance of twenty-eight thousand five hundred naira, plus sales of eight thousand two hundred naira, makes thirty-six thousand seven hundred naira.'
        write: '₦28,500 + ₦8,200 = ₦36,700'
      - section: 'Credit side'
        say: 'Rent twelve thousand, purchases fifteen thousand and the sales boy five hundred naira make twenty-seven thousand five hundred naira.'
        write: '₦12,000 + ₦15,000 + ₦500 = ₦27,500'
      - say: 'The stock left on the shelf is goods, not cash paid out, so it does not go in the cash account.'
        write: 'Closing stock is not a payment'
      - section: 'The working'
        say: 'Thirty-six thousand seven hundred minus twenty-seven thousand five hundred is nine thousand two hundred naira.'
        write: '₦36,700 − ₦27,500 = ₦9,200'
      - section: 'Answer'
        say: 'So the cash balance at the end of January is nine thousand two hundred naira, which is option B.'
        write: '$\therefore$ Cash $=$ ₦9,200'
        answer: true
    traps:
      A: 'You chose twenty-two thousand eight hundred naira. Rent, purchases and wages took twenty-seven thousand five hundred naira out of thirty-six thousand seven hundred, leaving nine thousand two hundred.'
      C: 'You went for eight hundred naira. That takes the closing stock off as well, but stock is goods on the shelf, not cash paid.'
      D: 'You picked twenty-one thousand one hundred and twenty naira. Cash in of thirty-six thousand seven hundred less cash out of twenty-seven thousand five hundred is nine thousand two hundred naira.'
  9:
    moments:
      - section: 'The question'
        say: 'We must say how calls in advance are shown in the balance sheet.'
        write: 'Calls in advance in the balance sheet = ?'
      - section: 'Name it'
        say: 'Calls in advance are money a shareholder pays before the company has called for it.'
        write: 'Calls in advance = paid before the call is made'
      - section: 'The rule'
        say: 'Until the call is made, the money is not yet share capital. The company holds it for the shareholder and may pay interest on it, so it is a current liability.'
        write: 'Not yet share capital ⇒ current liability'
      - section: 'The entry'
        say: 'When the money comes in, debit bank and credit calls in advance account.'
        write: 'Dr Bank, Cr Calls in advance'
      - section: 'Answer'
        say: 'So calls in advance are shown as a current liability, which is option C.'
        write: '$\therefore$ current liability'
        answer: true
    traps:
      A: 'You chose current asset. The cash received is an asset, but the calls in advance are owed to the shareholder.'
      B: 'You went for fixed asset. A fixed asset is property used for years, like land or machinery.'
      D: 'You picked fixed liability. That lasts for years, like debentures, but calls in advance clear when the call is made.'
  10:
    moments:
      - section: 'The question'
        say: 'A company buys a business and pays the seller with shares, not cash. We must find the double entry for issuing those shares.'
        write: 'Shares issued to a vendor ⇒ debit ?'
      - section: 'Name it'
        say: 'The seller of the business is called the vendor.'
        write: 'Vendor = the seller of the business'
      - section: 'Step one'
        say: 'When the business is bought, the assets are debited and the vendor is credited, because the company owes him.'
        write: 'Dr Assets, Cr Vendor'
      - section: 'Step two'
        say: 'When shares are issued to pay him, the vendor is debited to clear what he is owed, and share capital is credited.'
        write: 'Dr Vendor, Cr Share capital'
      - section: 'Answer'
        say: 'So we debit the vendor''s account and credit share capital, which is option D.'
        write: '$\therefore$ Dr Vendor''s account, Cr Share capital account'
        answer: true
    traps:
      A: 'You chose debit cash. No cash moves when the vendor is paid in shares.'
      B: 'You went for debit share capital and credit the vendor. The sides are reversed, because issuing shares credits share capital.'
      C: 'You picked debit share capital and credit cash. No cash is paid, and share capital is credited, not debited.'
  11:
    moments:
      - section: 'The question'
        say: 'Joy drew one hundred naira on the first of April and two hundred and forty naira on the first of July. Interest of five per cent a year is charged on drawings, and the year ends on the thirty-first of December. We must find the interest on Joy''s drawings.'
        write: 'Joy, ₦100 on 1 April and ₦240 on 1 July, 5% p.a., year ends 31 Dec. Interest $= ?$'
      - section: 'The rule'
        say: 'Interest on drawings runs from the date of each drawing to the year end. So it is the amount, times the rate, times the months to the year end over twelve.'
        write: '$\text{Interest} = \text{Amount} \times \text{Rate} \times \dfrac{\text{Months to year end}}{12}$'
      - section: 'First drawing'
        say: 'From the first of April to the thirty-first of December is nine months.'
        write: '1 April ⟶ 31 December = 9 months'
      - say: 'One hundred naira times five per cent times nine over twelve is three naira seventy-five kobo.'
        write: '$100 \times 5\% \times \tfrac{9}{12} = 3.75$'
      - section: 'Second drawing'
        say: 'From the first of July to the year end is six months.'
        write: '1 July ⟶ 31 December = 6 months'
      - say: 'Two hundred and forty naira times five per cent times six over twelve is six naira.'
        write: '$240 \times 5\% \times \tfrac{6}{12} = 6.00$'
      - section: 'Total'
        say: 'Three naira seventy-five kobo plus six naira is nine naira seventy-five kobo.'
        write: '₦3.75 + ₦6.00 = ₦9.75'
      - section: 'Answer'
        say: 'So the interest on Joy''s drawings is nine naira seventy-five kobo, which is option B.'
        write: '$\therefore$ Interest on Joy''s drawings $=$ ₦9.75'
        answer: true
    traps:
      A: 'You chose seventeen naira. That charges a full year on both drawings, but they were out for only nine and six months.'
      C: 'You went for eleven naira twenty-five kobo. That is the interest on Rakiya''s drawings, not Joy''s.'
      D: 'You picked seven naira twenty-five kobo. That counts the April drawing for the three months from the first of January, instead of the nine months to the year end.'
  12:
    moments:
      - section: 'The question'
        say: 'Rakiya drew two hundred naira on the thirty-first of March and three hundred naira on the thirtieth of September, with interest of five per cent a year charged on drawings. Her current account had no opening balance and she was credited with no income. We must find its closing balance.'
        write: 'Rakiya, ₦200 on 31 March and ₦300 on 30 September, 5% p.a. Closing current account $= ?$'
      - section: 'The rule'
        say: 'A partner''s current account is debited with her drawings and the interest on them. It is credited with her salary, interest on capital and share of profit.'
        write: 'Dr drawings, interest on drawings.  Cr salary, interest on capital, profit'
      - section: 'Interest'
        say: 'Interest runs from the date of each drawing to the year end. From the thirty-first of March to the thirty-first of December is nine months.'
        write: '31 March ⟶ 31 December = 9 months'
      - say: 'Two hundred naira times five per cent times nine over twelve is seven naira fifty kobo.'
        write: '$200 \times 5\% \times \tfrac{9}{12} = 7.50$'
      - say: 'From the thirtieth of September to the year end is three months.'
        write: '30 September ⟶ 31 December = 3 months'
      - say: 'Three hundred naira times five per cent times three over twelve is three naira seventy-five kobo.'
        write: '$300 \times 5\% \times \tfrac{3}{12} = 3.75$'
      - say: 'Her total interest is eleven naira twenty-five kobo.'
        write: '₦7.50 + ₦3.75 = ₦11.25'
      - section: 'The current account'
        say: 'On the debit side, drawings of five hundred naira and interest of eleven naira twenty-five kobo make five hundred and eleven naira twenty-five kobo.'
        write: 'Dr ₦500 + ₦11.25 = ₦511.25'
      - say: 'The credit side is empty, because she earned no income and there was no opening balance.'
        write: 'Cr nil'
      - section: 'The balance'
        say: 'So the account closes with a debit balance of five hundred and eleven naira twenty-five kobo. A debit balance means Rakiya owes the firm.'
        write: 'Balance = ₦511.25 Dr'
      - section: 'Answer'
        say: 'So Rakiya''s closing current account balance is five hundred and eleven naira twenty-five kobo debit, which is option D.'
        write: '$\therefore$ ₦511.25 debit'
        answer: true
    traps:
      A: 'You chose three hundred and forty naira credit. That is Joy''s drawings, and drawings are a debit, not a credit.'
      B: 'You went for five hundred naira credit. That puts the drawings on the wrong side and leaves out the interest of eleven naira twenty-five kobo.'
      C: 'You picked three hundred and forty naira seventy-five kobo debit. Rakiya''s drawings of five hundred naira plus her interest of eleven naira twenty-five kobo give five hundred and eleven naira twenty-five kobo.'
  13:
    moments:
      - section: 'The question'
        say: 'Head office pays an expense on behalf of its branch. We must find the entry in the branch''s own books.'
        write: 'Expenses paid by head office for the branch, branch books ⇒ ?'
      - section: 'Name it'
        say: 'In the branch books, the head office account shows what the branch owes head office.'
        write: 'Branch books, head office account'
      - section: 'The rule'
        say: 'The branch has had the expense, so it debits the expense to its profit and loss account.'
        write: 'Dr Profit and loss (expense)'
      - say: 'It paid no cash, so instead it credits head office, because it now owes head office more.'
        write: 'Cr Head office account'
      - section: 'The other side'
        say: 'Head office makes the mirror entry. It debits the branch account and credits its bank.'
        write: 'Head office books, Dr Branch, Cr Bank'
      - section: 'Answer'
        say: 'So the branch debits profit and loss account and credits head office account, which is option A.'
        write: '$\therefore$ Dr Profit and loss, Cr Head office account'
        answer: true
    traps:
      B: 'You chose debit head office and credit cash. The branch paid no cash, and head office is credited, not debited.'
      C: 'You went for credit cash. No cash left the branch, because head office paid it.'
      D: 'You picked credit profit and loss. The sides are reversed, and an expense is always debited.'
  14:
    moments:
      - section: 'The question'
        say: 'We must name the officer who checks that all public spending is in line with the approved guidelines.'
        write: 'Officer who checks public spending against approved guidelines = ?'
      - section: 'The rule'
        say: 'The Auditor-General is the chief auditor of public accounts. He audits the government''s accounts, checks that money was spent as the appropriation law allowed, and reports to the legislature.'
        write: 'Auditor-General audits, checks against appropriation, reports to the legislature'
      - section: 'The others'
        say: 'The Accountant-General keeps the government''s accounts and pays out funds.'
        write: 'Accountant-General keeps the accounts'
      - say: 'The Minister of Finance makes financial policy and presents the budget.'
        write: 'Minister of Finance sets policy'
      - say: 'A Permanent Secretary heads a ministry and spends its money, so his spending is what gets audited.'
        write: 'Permanent Secretary spends'
      - section: 'Answer'
        say: 'So the officer is the Auditor-General, which is option C.'
        write: '$\therefore$ the Auditor-General'
        answer: true
    traps:
      A: 'You chose the Accountant-General. He keeps the accounts and pays out funds, and he cannot audit his own work.'
      B: 'You went for the Minister of Finance. The minister sets policy and presents the budget.'
