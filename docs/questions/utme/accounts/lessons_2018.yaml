  15:
    moments:
      - section: 'The question'
        say: 'The Ede branch gets goods at cost and sells them for cash. What gross profit did it make?'
        write: 'Ede branch, gross profit $= ?$'
      - section: 'Name it'
        say: 'This is the branch trading account when goods are sent at cost.'
        write: 'Branch trading account (at cost)'
      - section: 'The rule'
        say: 'Cost of sales is opening stock plus goods sent, less returns to head office, less closing stock.'
        write: '$\text{Cost of sales} = \text{Opening} + \text{Sent} - \text{Returns} - \text{Closing}$'
      - say: 'Then gross profit is sales minus cost of sales.'
        write: '$\text{Gross profit} = \text{Sales} - \text{Cost of sales}$'
      - section: 'Cost of sales'
        say: 'Opening stock of four hundred plus goods sent of eight thousand is eight thousand four hundred naira.'
        write: '₦400 + ₦8,000 = ₦8,400'
      - say: 'Take off the returns of three hundred and forty naira, and we have eight thousand and sixty naira.'
        write: '₦8,400 − ₦340 = ₦8,060'
      - say: 'Take off the closing stock of seven hundred and twenty naira, and the cost of sales is seven thousand three hundred and forty naira.'
        write: '₦8,060 − ₦720 = ₦7,340'
      - section: 'Gross profit'
        say: 'Sales of nine thousand one hundred and sixty naira, less seven thousand three hundred and forty naira, give one thousand eight hundred and twenty naira.'
        write: '₦9,160 − ₦7,340 = ₦1,820'
      - section: 'Check'
        say: 'Seven thousand three hundred and forty plus one thousand eight hundred and twenty gives back the sales.'
        write: '₦7,340 + ₦1,820 = ₦9,160 ✓'
      - section: 'Remember'
        say: 'Remember, what came in, less what went back, less what is left, is what was sold.'
        write: 'In − back − left = sold'
      - section: 'Answer'
        say: 'So the gross profit carried to profit and loss is one thousand eight hundred and twenty naira, which is option D.'
        write: '$\therefore$ Gross profit $=$ ₦1,820'
        answer: true
    traps:
      A: 'You chose one thousand eight hundred and seventy naira. That is fifty naira too high. Work each line, and the cost of sales is seven thousand three hundred and forty naira.'
      B: 'You went for one thousand five hundred and thirty naira. That is too low for a cost of sales of seven thousand three hundred and forty naira.'
      C: 'You picked one thousand six hundred and forty naira. That is too low for a cost of sales of seven thousand three hundred and forty naira.'
