        write: 'Average stock $= ?$'
      - section: 'The rule'
        say: 'Average stock is opening stock plus closing stock, divided by two. Sales and purchases do not come into it.'
        write: '$\text{Average stock} = \dfrac{\text{Opening} + \text{Closing}}{2}$'
      - section: 'The working'
        say: 'Thirty-two thousand plus nine thousand is forty-one thousand naira.'
        write: '₦32,000 + ₦9,000 = ₦41,000'
      - say: 'Forty-one thousand divided by two is twenty thousand five hundred naira.'
        write: '₦41,000 ÷ 2 = ₦20,500'
      - section: 'Answer'
        say: 'So the average stock is twenty thousand five hundred naira, which is option A.'
        write: '$\therefore$ Average stock $=$ ₦20,500'
        answer: true
    traps:
      B: 'You chose twenty-three thousand naira. That is half of the net sales, and sales are not stock.'
      C: 'You went for twenty-eight thousand naira. The average of opening stock of thirty-two thousand and closing stock of nine thousand is twenty thousand five hundred.'
      D: 'You picked twenty-seven thousand naira. The average of thirty-two thousand and nine thousand is twenty thousand five hundred.'
  34:
    moments:
      - section: 'The question'
        say: 'The trading account gives opening stock, purchases, carriage inwards, returns outwards and closing stock. We must find the cost of goods sold.'
        write: 'Cost of goods sold $= ?$'
      - section: 'The rule'
        say: 'Cost of goods sold is opening stock plus net purchases minus closing stock.'
        write: '$\text{COGS} = \text{Opening stock} + \text{Net purchases} - \text{Closing stock}$'
      - say: 'Net purchases are purchases plus carriage inwards minus returns outwards, because carriage inwards adds to what the goods cost and returns outwards are goods sent back.'
        write: 'Net purchases = Purchases + Carriage inwards − Returns outwards'
      - section: 'Net purchases'
        say: 'Forty thousand plus one thousand carriage inwards is forty-one thousand naira.'
        write: '₦40,000 + ₦1,000 = ₦41,000'
      - say: 'Taking off returns outwards of two thousand naira gives thirty-nine thousand naira.'
        write: '₦41,000 − ₦2,000 = ₦39,000'
      - section: 'Goods available'
        say: 'Opening stock of thirty-two thousand plus thirty-nine thousand is seventy-one thousand naira of goods available for sale.'
        write: '₦32,000 + ₦39,000 = ₦71,000'
      - section: 'Cost of goods sold'
        say: 'Take off the closing stock of nine thousand naira, and the cost of goods sold is sixty-two thousand naira.'
        write: '₦71,000 − ₦9,000 = ₦62,000'
      - section: 'Answer'
        say: 'So the cost of goods sold is sixty-two thousand naira, which is option B.'
        write: '$\therefore$ Cost of goods sold $=$ ₦62,000'
        answer: true
    traps:
      A: 'You chose sixty-one thousand naira. That leaves out the one thousand naira of carriage inwards, which is part of what the goods cost.'
      C: 'You went for fifty-eight thousand naira. Goods available are seventy-one thousand naira and nine thousand were left, so sixty-two thousand were sold.'
      D: 'You picked fifty-seven thousand naira. Goods available are seventy-one thousand naira and nine thousand were left, so sixty-two thousand were sold.'
  35:
    moments:
      - section: 'The question'
        say: 'Head office sends goods to its branch. We must find the entry in the head office ledger.'
        write: 'Head office ledger, goods sent to branch ⇒ ?'
      - section: 'Name it'
        say: 'In the head office books, the branch current account shows what the branch owes head office. The head office current account is kept in the branch books.'
        write: 'Head office books, branch current account'
      - section: 'The rule'
        say: 'The branch receives the goods and now owes for them, so the branch account is debited. Goods sent to branch account is credited.'
        write: 'Dr Branch current account, Cr Goods sent to branch'
      - section: 'The mirror'
        say: 'The branch makes the mirror entry in its own books, debiting goods received and crediting the head office current account.'
        write: 'Branch books, Dr Goods received, Cr Head office current account'
      - section: 'Answer'
        say: 'So the goods are debited to the branch current account, which is option A.'
        write: '$\therefore$ debited to the branch current account'
        answer: true
    traps:
      B: 'You chose debited to the head office current account. That account is kept in the branch books, not head office''s ledger.'
      C: 'You went for credited to the head office current account. That account belongs to the branch books.'
      D: 'You picked credited to the branch current account. The branch receives the goods, so it is debited.'
  36:
    moments:
      - section: 'The question'
        say: 'We must find the method of invoicing goods to branches that makes it easiest to check what the branches do.'
        write: 'Invoicing method that makes branches easiest to check = ?'
      - section: 'The rule'
        say: 'At selling price, goods sent must equal sales plus closing stock, all at selling price. Any shortage of cash or stock shows at once.'
        write: 'Goods sent = Sales + Closing stock (at selling price)'
      - section: 'The working'
        say: 'Say a branch gets five hundred thousand naira of goods at selling price, banks four hundred and twenty thousand naira and holds seventy thousand naira of stock. Then ten thousand naira is missing.'
        write: '₦500,000 − ₦420,000 − ₦70,000 = ₦10,000 missing'
      - section: 'Answer'
        say: 'So invoicing at selling price makes the branches easiest to check, which is option A.'
        write: '$\therefore$ selling price'
        answer: true
    traps:
      B: 'You chose a fixed percentage on cost. That hides the selling price unless the mark-up is worked out again.'
      C: 'You went for cost price. At cost, head office cannot tell what the goods should have sold for.'
      D: 'You picked invoice price. That is a general term, not a method that makes control easier.'
  37:
    moments:
      - section: 'The question'
        say: 'A new partner pays the old partners for the reputation they built up. We must name that payment.'
        write: 'Payment for the old partners'' reputation = ?'
      - section: 'The rule'
        say: 'Goodwill is the value of a firm''s good name and its customers. The reputation will bring profit to the new partner too, so he pays the old partners for it. That payment is goodwill.'
        write: 'Payment for reputation = goodwill'
      - section: 'The entry'
        say: 'If it is paid in cash and kept by the old partners, debit cash and credit the old partners'' capitals.'
        write: 'Dr Cash, Cr old partners'' capitals'
      - section: 'Answer'
        say: 'So the payment is goodwill, which is option B.'
        write: '$\therefore$ goodwill'
        answer: true
    traps:
      A: 'You chose bonus. A bonus is extra pay or a capital adjustment, not payment for a good name.'
      C: 'You went for salary. A salary is paid to a partner for work, not by a new partner for reputation.'
      D: 'You picked commission. That is paid to an agent for selling.'
  38:
    moments:
      - section: 'The question'
        say: 'We must name the document that sets out a partnership''s internal rules.'
        write: 'A partnership''s internal regulations are set out in ?'
      - section: 'The rule'
        say: 'The partnership deed, also called the partnership agreement, sets out the capital, the profit sharing ratio, salaries, interest on capital and drawings, and what happens when a partner joins or leaves.'
        write: 'Capital, ratio, salaries, interest, admission, retirement'
      - section: 'No deed'
        say: 'Where there is no deed, the Partnership Act fills in the rules.'
        write: 'No deed ⇒ Partnership Act'
      - section: 'Others'
        say: 'A company''s rules are in its Articles of Association, and a club''s are in its constitution.'
        write: 'Partnership deed.  Company articles.  Club constitution'
      - section: 'Answer'
        say: 'So a partnership''s internal regulations are set out in a deed, which is option C.'
        write: '$\therefore$ a deed'
        answer: true
    traps:
      A: 'You chose a constitution. That governs a club or society, not a partnership.'
      B: 'You went for a law. The Partnership Act applies only where the deed is silent.'
      D: 'You picked an article. Articles of Association are the rules of a company.'
  39:
    moments:
      - section: 'The question'
        say: 'Partners have no partnership deed. We must find what the Partnership Act lays down for them.'
        write: 'No partnership deed ⇒ the Partnership Act says ?'
      - section: 'Name it'
        say: 'Where partners have no deed, the rules in section twenty-four of the Partnership Act of eighteen ninety apply.'
        write: 'Partnership Act 1890, section 24'
      - section: 'The rule'
        say: 'Profits and losses are shared equally. No partner gets a salary, and no interest is paid on capital.'
        write: 'Equal shares, no salary, no interest on capital'
      - say: 'No interest is charged on drawings, and a partner''s loan earns five per cent a year.'
        write: 'No interest on drawings; 5% on partners'' loans'
      - section: 'Answer'
        say: 'So the Act says interest should not be allowed on partners'' drawings, which is option D.'
        write: '$\therefore$ no interest on partners'' drawings'
        answer: true
    traps:
      A: 'You chose a fixed salary for partners. The Act gives no salary to any partner.'
      B: 'You went for profits not shared equally. The Act says the opposite, that profits and losses are shared equally.'
      C: 'You picked twenty-five per cent on loans. The Act gives five per cent, not twenty-five.'
  40:
    moments:
      - section: 'The question'
        say: 'A branch has made a profit. We must find the account it is credited to in the branch''s own books.'
        write: 'Branch books, branch profit credited to ?'
      - section: 'Name it'
        say: 'In the branch books, the head office current account shows what the branch owes head office.'
        write: 'Branch books, head office current account'
      - section: 'The rule'
        say: 'The branch profit belongs to head office. So the branch debits its profit and loss account and credits the head office current account.'
        write: 'Dr Profit and loss, Cr Head office current account'
      - section: 'The mirror'
        say: 'Head office records the same profit the other way, debiting the branch account and crediting its own profit and loss.'
        write: 'Head office books, Dr Branch, Cr Profit and loss'
      - section: 'Answer'
        say: 'So in the branch books the profit is credited to the head office current account, which is option D.'
        write: '$\therefore$ head office current account'
        answer: true
    traps:
      A: 'You chose a goods account. A goods account records goods, not profit.'
      B: 'You went for the head office sales account. Profit is not a sale.'
      C: 'You picked the adjustment account. That is a head office account used to find gross profit, not where the branch puts its profit.'
