      - section: 'Name it'
        say: 'This is the reconciliation of the head office and branch current accounts.'
        write: 'Reconciling head office and branch current accounts'
      - section: 'The rule'
        say: 'An item in transit is adjusted in the books that have not yet recorded it, as if it had arrived.'
        write: 'Adjust in the books that have not recorded it'
      - section: 'Who has recorded it'
        say: 'The branch sent the cash, so the branch has already debited head office and credited its cash.'
        write: 'Branch books, Dr Head office, Cr Cash ✓ done'
      - say: 'Head office has not recorded it yet, so the adjustment goes in the head office books.'
        write: 'Head office books, not yet recorded'
