        write: '₦17,500 − ₦5,120 + ₦2,300 = ₦14,680 ✓'
      - section: 'Remember'
        say: 'Remember, cheques not yet presented keep money in the bank. A school in Ilorin that has written cheques its suppliers have not banked still has that money at the bank.'
        write: 'Unpresented cheques ⇒ bank higher'
      - section: 'Answer'
        say: 'So the balance on the bank statement is seventeen thousand five hundred naira, which is option D.'
        write: '$\therefore$ Bank statement $=$ ₦17,500'
        answer: true
    traps:
