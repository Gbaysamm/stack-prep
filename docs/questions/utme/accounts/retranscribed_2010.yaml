# UTME 2010 Principles of Accounts, written up by hand from source/past-questions.pdf, pages 2-12.
# Q1 asks for the paper type and is left out, so 49 questions are kept; none is dropped. Every
# answer was worked out afresh. Printed keys that did not hold up: Q8 (a petty cash book is a book
# of original entry; the credit note is the source document), Q11 (interest received raises the
# bank statement balance), Q20 (LIFO in rising prices gives a higher cost of goods sold, not a
# higher gross profit), Q24 (no option; rebuilt), Q28 (depreciation on a vehicle used for both is
# shared between the manufacturing account and the profit and loss account) and Q46 (the discount
# provision is worked on debtors after the bad debts provision, giving ₦744,800). Rebuilt: Q9 and
# Q10 (the cash book had no debit and credit sides and the 2% discount did not match the cash
# entered; it is now a T account and Fatima's ₦2,000 debt is settled less 2%), Q17 (no option
# gave the ₦800 provision), Q24 (expenses come to ₦3,200, which no option gave), Q38 (it repeated
# Q36; it now asks about goods returned by the branch to head office). Repaired: Q11 option C and
# Q13 option B (each made a second option right or meaningless), Q32's stem, Q33 option A
# ("4 1 200"), Q34's turnover for M (₦89,000 to ₦80,000, so the ₦1,800 shares out exactly),
# Q35's department letters (V to Y) and Z's profit (1 800 to ₦18,000), Q42 option D (crediting
# the current account was also true), Q44 (the figures are issued share capital) and Q46 (says
# which debtors the discount provision is worked on). All tables and ledger extracts are KaTeX
# arrays in the stem. No figures.
