questions:
  - number: 2
    stem: 'The historical development of accounting reveals that it'
    options:
      A: 'deals with debit and credit terms'
      B: 'is a product of financial development'
      C: 'is a product of its own environment'
      D: 'is an ideal subject for financial development'
    answer: C
    printed_key: A
    key_note: 'The texts (Igben, Ekwue) teach that accounting grew out of the needs of each society, from stewardship records to double entry and company reporting, so it is a product of its environment; debit and credit describe its method, not what its history reveals.'
    subtopic: ACC.1.a
    level: 2
    level_reason: link the history of accounting to the idea that it changes with society

