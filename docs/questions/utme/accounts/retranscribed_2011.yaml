  - number: 9
    stem: 'Use the information below to answer questions 9 and 10. Adamu Stores bought accessories with a list price of ₦400 from Mu''azu Beverages on credit. A trade discount of 10% and a cash discount of 15% for prompt payment were allowed, and Adamu Stores paid within the cash discount period. Find the total amount paid.'
    options:
      A: '₦306'
      B: '₦300'
      C: '₦340'
      D: '₦360'
    answer: A
    printed_key: null
    key_note: 'No key printed. ₦400 less 10% trade discount is ₦360; 15% cash discount on ₦360 is ₦54; ₦360 − ₦54 = ₦306.'
    subtopic: ACC.4.b
    level: 4
    level_reason: take the trade discount off first, then the cash discount on the net invoice
    corrected: 'rebuilt: no option matched the right working (₦400 less 10% is ₦360, less 15% of ₦360 is ₦306), so the options became ₦306, ₦300 (both discounts taken on the list price), ₦340 (only the cash discount, on the list price) and ₦360 (only the trade discount); the stem now says ₦400 is the list price and that payment was made within the discount period'

