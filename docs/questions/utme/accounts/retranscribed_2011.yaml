# UTME 2011 Principles of Accounts, written up by hand from source/past-questions.pdf, pages 13-23.
# Q1 (the paper type) is left out, so 49 questions are kept; none is dropped. Every answer was
# worked out afresh. Printed keys that did not hold up: Q2 (accounting grows out of its own
# environment), Q13 (interest on an overdraft, not yet in the cash book, is added to the overdraft
# as per cash book), Q17 (in falling prices LIFO gives the higher profit), Q34 (dissolution is
# recorded in the realization account), Q35 (goods go to a branch at cost when they are perishable
# and no fixed selling price can be set) and Q43 (goodwill arises from the business and its
# customer relations). Q9 and Q10 printed no key. Rebuilt: Q6 (the four balances did not agree, so
# a capital of ₦2,250 was added to make the trial balance agree at ₦3,450), Q9 and Q10 (no option
# matched the discounts on ₦400, so the options were rebuilt round the right working: ₦306 paid,
# ₦54 cash discount) and Q13 (the stem now says the interest is not yet in the cash book, and D
# names the overdraft as per cash book). Repaired: Q14 and Q15 (the bank loan became a bank
# overdraft, a current liability), Q22 (D now names the check on the ledger clerks' work), Q38
# (asks for the three bases), Q40 (option C ₦4,500 became ₦500), Q41 (a full year's interest),
# Q43 (asks where goodwill arises from), Q49 (asks for the accounting officer), Q12 (asks for the
# settling of cheques between banks, not their reconciling), Q25 (the garbled purchases lines set
# out in order), and small wording faults in Q4, Q8, Q11, Q17, Q19, Q20, Q27, Q30, Q31, Q34, Q35,
# Q36, Q42, Q45, Q47 and Q50. The stock card (Q19-20), the incomplete
# record (Q23-24), the trading account (Q25-26) and the partnership data (Q40-41) are KaTeX tables
# in the stems. No figures.
