  - number: 14
    stem: 'Given: $$\begin{array}{|l|r|}\hline \text{Item} & \text{₦} \\ \hline \text{Cash book balance (debit)} & 5{,}000 \\ \hline \text{Dishonoured cheque} & 1{,}000 \\ \hline \text{Direct credit} & 800 \\ \hline \text{Direct debit} & 500 \\ \hline\end{array}$$ The adjusted cash book balance is'
