questions:
  - number: 2
    stem: 'The basis upon which the assets of an organization are valued is the'
    options:
      A: 'historical cost concept'
      B: 'business entity concept'
      C: 'periodicity concept'
      D: 'materiality concept'
    answer: A
    printed_key: A
    subtopic: ACC.1.d
    level: 1
    level_reason: recall that assets are recorded at what they cost
    corrected: 'option A "historical concept" became "historical cost concept"; "assets ... is valued" became "are valued"'

  - number: 3
    stem: 'An accountant must not only be interested in record keeping but also in'
    options:
      A: 'the application of professional competence'
      B: 'the accuracy of postings'
      C: 'the casting of financial figures'
      D: 'the effective preparation of the balance sheet'
    answer: A
    printed_key: A
    subtopic: ACC.3.b
    level: 2
    level_reason: tell a professional quality apart from tasks that are part of record keeping
    corrected: '"professional competency" became "professional competence"'

  - number: 4
    stem: 'Under the double entry system, when assets or expenses increase and capital or liabilities increase, the correct posting is to debit'
    options:
      A: 'capital and credit liabilities'
      B: 'liabilities and credit assets'
      C: 'assets and credit capital'
      D: 'capital and credit assets'
    answer: C
    printed_key: C
    subtopic: ACC.2.d
    level: 2
    level_reason: apply the debit and credit rules for increases
    corrected: 'the stem "when there is an increase in assets, expenses, capital or liabilities is to debit" was reworded so it reads as one sentence'

  - number: 5
    stem: 'The capital of a sole trader can be increased by'
    options:
      A: 'debiting the capital account'
      B: 'crediting the capital account'
      C: 'debiting the cash account'
      D: 'crediting the cash account'
    answer: B
    printed_key: C
    key_note: 'Capital is a liability to the owner and increases on the credit side; debiting cash records the money received, not the rise in capital.'
    subtopic: ACC.2.d
    level: 1
    level_reason: recall that capital increases on the credit side

