# UTME 2012 Principles of Accounts, written up by hand from source/past-questions.pdf, pages 24-34.
# Q1, the paper-type question (Yellow), is left out; the other 49 questions keep their printed
# numbers and none is dropped. Every answer was worked out afresh. Printed keys that did not hold
# up: Q5 (capital rises by a credit), Q10 (a dishonoured cheque is credited in the bank column),
# Q14 (5,000 - 1,000 + 800 - 500 = 4,300), Q20 (FIFO leaves 15 bags at ₦10 and 60 at ₦11.50,
# ₦840), Q21 (rebuilt), Q35 (goods sent are debited to the branch account), Q36 (invoicing at
# selling price eases control), Q38 (rebuilt; Jakata's share is 3/5) and Q49 (the PTDF is a trust
# fund). Repaired: Q15-16 opening stock 2,000 became 20,000 so the trading figures add up; Q20-21
# the first issue of 85 bags is dated 9/5/07 (two entries were both dated 15/5); Q32 the donations
# received of 6,000 became 60,000 so one option is right; Q37 the net profit became ₦120,000 to
# fit the options; Q43 option D repeated C and became the reverse entry; Q24 option C became
# "creditors control account"; Q7 now says the sale was on credit; Q13 options A and B and Q40
# (Mary brings her own goodwill) were narrowed to one right answer; plain typos fixed ("412,000"
# for ₦12,000, "Purchasers" for purchases). Rebuilt: Q18 (revenue to add was ambiguous), Q19
# ("special assets" became an intangible asset), Q21 (no option matched; it now asks the simple
# average issue price), Q33 (no textbook option), Q34 (garbled departmental table), Q38 (ratio
# options) and Q45 (garbled ratio options). Tables are KaTeX arrays in the stems. No figures.
