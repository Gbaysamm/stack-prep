    corrected: 'the first issue of 85 bags was dated 15/5/07, the same day as the later purchase, and the question asked for stock at 9/5/07; the issue is now dated 9/5/07 and the stem says "after the issue"; "₦10.00k" became ₦10.00 (and the same for the other prices)'

