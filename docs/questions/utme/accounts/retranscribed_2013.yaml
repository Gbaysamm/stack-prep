# UTME 2013 Principles of Accounts, written up by hand from source/past-questions.pdf, pages 35-45.
# Printed paper type U. Q1 (the paper-type question) is left out, so 49 questions are kept; none
# is dropped. Every answer was worked out afresh. Five printed keys did not hold up: Q11 (under
# the imprest system the petty cashier is reimbursed what was spent, so II is false and the
# answer is III and IV), Q24 (₦35,000 + ₦10,000 − ₦2,500 − ₦3,500 = ₦39,000), Q38 (shares at a
# discount: debit discount on shares, credit share capital), Q45 (issued capital is the part
# actually allotted to shareholders) and Q46 (distributable profit is the revenue reserves,
# general reserve and retained profit). Rebuilt: Q44 (the instalments added to ₦1.00 although the
# shares were issued at ₦1.10, so allotment is now 30k, including the 10k premium), Q45 (the
# options did not name issued capital, so they now name authorized, allotted and paid-up capital)
# and Q49 (the local government's assets did not equal its liabilities, so the bank balance is
# now ₦1,893,600 and the statement balances). Repaired: Q3's cut-off stem now says the debit
# side is greater than the credit side; Q47's self-contradictory "issued at par above the nominal
# value" now reads "at a price above its nominal value"; Q38's cut-off option B is completed;
# Q33 option C "premium" (another name for the goodwill payment), Q39 option A "sales" (some
# texts use it) and Q48 option A (loosely true of the Accountant-General's internal auditors)
# were replaced so each question has one right option; Q42's garbled options C and D were
# rewritten; Q15's option "₦86,00" became ₦86,000;
# Q14 says the mattresses are for resale; Q24's date 31/1/2007 became 31/12/2007; the data for
# Q15-16, Q17, Q20-21, Q22, Q24, Q27-28, Q40-41, Q44 and Q49 are set out as KaTeX tables in each
# stem; small faults in wording put right elsewhere. No figures.
