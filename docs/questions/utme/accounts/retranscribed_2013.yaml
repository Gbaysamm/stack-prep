  - number: 11
    stem: 'Consider these statements about the imprest system. I. The amount of the imprest is the same from one organization to another. II. At the end of a fixed period, the petty cashier receives a fixed sum of money. III. At the end of a period, the petty cashier is reimbursed with the amount spent in that period. IV. The system is a method by which a measure of control is kept on petty cash expenses. Which of the statements are correct?'
    options:
      A: 'I, II and III'
      B: 'I, III and IV'
      C: 'II and IV'
      D: 'III and IV'
    answer: D
    printed_key: C
    key_note: 'Under the imprest system the fixed float is given at the start; at the end of each period the cashier is reimbursed only the amount spent, which varies (III), so II is false; the float differs between firms (I false); IV is true.'
    subtopic: ACC.4.c
    level: 3
    level_reason: judge four statements about how the imprest float works
    corrected: 'the statements were introduced in the stem; "received" in II became "receives"'

