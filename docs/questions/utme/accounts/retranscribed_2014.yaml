questions:
  - number: 2
    stem: 'One of the differences between bookkeeping and accounting is that the former'
    options:
      A: 'records data while the latter interprets it'
      B: 'is regarded as the language of business while the latter ascertains its strength'
      C: 'interprets data while the latter records it'
      D: 'summarises information while the latter communicates it'
    answer: A
    printed_key: A
    subtopic: ACC.1.a
    level: 1
    level_reason: recall that bookkeeping records and accounting interprets
    corrected: 'option A "while the latter interprets" became "interprets it"; "the language of the business" became "the language of business"'

  - number: 3
    stem: 'The concept which states that revenue should be recognised at the point when the sale is deemed to have been made is'
    options:
      A: 'matching'
      B: 'consistency'
      C: 'realisation'
      D: 'going concern'
    answer: C
    printed_key: C
    subtopic: ACC.1.d
    level: 1
    level_reason: recall the name of the concept that fixes when revenue is earned
    corrected: '"recognized" and "realization" spelt the British way'

  - number: 4
    stem: 'A cheque of ₦5,000 paid to Sulieman had been correctly entered in the cash book but had not been entered in Sulieman''s account. To correct this error, debit Sulieman''s account and credit'
    options:
      A: 'cash account'
      B: 'bank account'
      C: 'suspense account'
      D: 'purchases account'
    answer: C
    printed_key: B
    key_note: 'The bank credit was already made correctly in the cash book; only the debit to Sulieman was missing, so the trial balance was out by ₦5,000 and the difference sat in suspense. The fix is Dr Sulieman, Cr Suspense. Crediting bank again would pay him twice in the books.'
    subtopic: ACC.2.g
    level: 3
    level_reason: see that a one-sided omission went to suspense, then write the double entry that clears it

