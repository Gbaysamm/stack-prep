# UTME 2014 Principles of Accounts, written up by hand from source/past-questions.pdf, pages 46-56.
# Q1 asks for the paper type (Type S) and is left out, so 49 questions are kept; none is dropped.
# Every answer was worked out afresh. Printed keys that did not hold up: Q4 (the omitted debit
# to Sulieman is balanced through the suspense account, since the bank side was already right),
# Q28 (subscriptions in arrears are owed to the club, a current asset), Q30 and Q31 (both
# subscription balances are at the year end, so the year's income is 38,570 + 18,900 - 16,400 =
# 41,070 and the liability is the 16,400 paid in advance), Q32 (the opening balance is not
# received in the period, so receipts are 13,500), Q35 (no basis means equal shares), Q37
# (100,000 / 1.25 = 80,000), Q38 and Q39 (rebuilt), Q40 (the Partnership Act allows no interest
# on drawings), Q41 (the branch credits its profit to the head office current account), Q42
# (current account balances go to the capital accounts), Q48 (rebuilt), Q49 (the Consolidated
# Revenue Fund) and Q50 (fund accounting). Q7's printed key B listed a classes-of-account mix and
# was narrowed. Rebuilt: Q24 (the cost of goods available for sale is 1,460,500 by any method and
# no option matched, so it now asks for the LIFO closing stock), Q38 and Q39 (an 800,000 invoice
# at 20% on cost gave a cost no option matched, so the mark-up is now 25%, as Q39 already said),
# Q46 (two options were the same and the share figure was ambiguous), Q48 ("book value of issued
# share capital" fitted several options, so it now asks for the nominal value of the shares
# allotted) and Q49 (no option was the Consolidated Revenue Fund). Narrowed to one right option:
# Q6, Q7, Q11, Q13, Q14, Q15 and Q44. Q29's badly laid out trading account, the balance sheet extract
# for Q20-21, the stock records for Q23-24, the subscription figures for Q30-31 and the receipts
# and payments extract for Q32-33 are set out as KaTeX tables in the stem; Q16's fraction
# options are typed as KaTeX. The headings over Q38 and Q39 said "questions 30 and 31".
