    key_note: 'The textbook division of the ledger (Frank Wood) is the sales ledger, the purchases ledger and the general ledger, with the nominal and private ledgers inside the general ledger. As printed, B "personal, general and private" mixed a class of account with two ledgers and was arguable; it is now plainly wrong, so D is the one answer.'
