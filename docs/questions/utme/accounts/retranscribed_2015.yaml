# UTME 2015 Principles of Accounts, written up by hand from source/past-questions.pdf, pages 57-65.
# This paper prints no paper-type question, so Q1 is a real question and all 40 questions are
# kept; none is dropped. Every calculation was worked afresh. Printed keys that did not hold up:
# Q7 (rebuilt; ICAN was established by Act of Parliament No. 15 of 1965, and no printed date
# fitted), Q13 (the objective of financial reports is information about the entity's economic
# resources), Q22 (rebuilt so that only conservatism fits), Q25 (in a manufacturer's trading
# account the cost of goods manufactured takes the place of purchases), Q33 (accounting is a
# product of its environment) and Q39 (bookkeeping records data and accounting interprets it).
# Rebuilt: Q7 (now asks the year of the ICAN Act), Q19 (several options could each be verified
# from some source document, so it now asks what a source document is used for) and Q22.
# Repaired: Q9 and Q10 (the ₦1,000 debit balances were dated Feb. 28; as opening balances they are
# dated Feb. 1, which makes the printed totals work), Q12 (options A and B were both 50%; B is
# now 40%), Q14 (other assets ₦360,800 became ₦36,800, a slipped digit), Q16 (option A ₦12,985
# became ₦2,985, and the stem says the bakery wages go to the trading account), Q17 (option B
# also held two cash-book items, so "debit note" became "uncredited cheques"), Q13 and Q25 (a
# second arguable option was narrowed), Q26 (option C now debits the branch account, the
# entry head office makes), Q20 (option D "equities" could take in liabilities and became
# "expenses"), Q35 (the sale is said to be on credit), and small spelling or wording faults in
# Q1, Q2, Q3, Q6, Q8, Q15, Q23, Q24, Q27, Q28, Q29, Q30, Q32, Q34, Q36, Q38 and Q40. All tables
# are KaTeX arrays in the stem. No figures.
