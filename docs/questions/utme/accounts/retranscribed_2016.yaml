questions:
  - number: 1
    stem: 'Use the information below to answer questions 1 and 2. Ada and Udo are lawyers who went into partnership as Ado and Co. Ada brought cash of ₦12,000, furnishings worth ₦18,000 and a motor vehicle worth ₦70,000. Udo, on the other hand, brought in cash of ₦10,000, his building valued at ₦105,000 and a personal computer worth ₦35,000. What is the capital of Ado and Co.?'
    options:
      A: '₦100,000'
      B: '₦22,000'
      C: '₦250,000'
      D: '₦150,000'
    answer: C
    printed_key: A
    key_note: 'Ada brings 12,000 + 18,000 + 70,000 = ₦100,000 and Udo 10,000 + 105,000 + 35,000 = ₦150,000, so the firm''s capital is ₦250,000; ₦100,000 is Ada''s share alone.'
    subtopic: ACC.15.b
    level: 3
    level_reason: add each partner's contributions in cash and in kind, then add the two
    corrected: '"N10 000" became "cash of ₦10,000"; "Ado & Co." became "Ado and Co."'

