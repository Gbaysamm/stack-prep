# UTME 2016 Principles of Accounts, written up by hand from source/past-questions.pdf, pages 66-74.
# This paper prints no paper-type question, so Q1 is a real question and all 40 questions are
# kept; none is dropped. Every calculation was worked afresh. Printed keys that did not hold up:
# Q1 (the firm's capital is both partners' contributions, ₦250,000), Q3 (the ledger's advantage
# is that it removes the need for a balance sheet after each transaction), Q5 (purchases are
# ₦27,280 once discount and both creditor balances are counted), Q13 (the missing cash balance
# is ₦12,950), Q19 (drawings are ₦9,900), Q25 (a receipts and payments account is a cash
# account), Q26 (a goodwill premium paid in cash is credited to the old partners' capital
# accounts) and Q31 (interest received raises the bank statement balance).
# Rebuilt: Q15 (no option was the ₦120,000 share capital; option A now is) and Q16 (no option
# matched any liability in the list; it now asks for the liabilities to outsiders, the
# creditors of ₦16,050). Repaired: Q13 to Q16 now share the Udo Co. Ltd list of balances, which
# says the cash balance is left out; Q14 (option C ₦333,000 became ₦333,050, a slipped digit);
# Q17 and Q18 (drawings "60% of capital" became 50%, the only rate that lets the trial balance
# agree); Q3 (option C "can be used by any type of business" was also true and became "is kept
# only by limited liability companies"); Q8 (an electronics dealer could buy generators to
# resell, so the stem says they are for its workshop); Q28 (option C "magnetic strip" is part
# of the card itself and became "deposit slip"); Q31 (option A "direct payment" could mean a
# payment into the account and became "a standing order payment", as in 2010); Q32 (the stem
# now asks for the commission, as in 2010); Q34 (option D listed five columns but said six);
# Q19 (the shop and stock are said to be his only capital); Q21 (the stem now asks for the
# order of the procedures); Q30 (the stem repeats the 10% margin it needs); and small spelling
# or wording faults in Q1, Q2, Q4, Q9, Q10, Q11, Q20, Q22, Q23, Q25, Q26, Q27, Q29, Q30, Q32,
# Q35, Q38 and Q39. All tables are KaTeX arrays in the stem;
# the Q39 formula options, printed as pictures, are typed as KaTeX. No figures.
