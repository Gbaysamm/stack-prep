  - number: 3
    stem: 'One major advantage of a ledger is that it'
    options:
      A: 'is a book of original entry'
      B: 'is only accessible to shareholders during liquidation'
      C: 'is kept only by limited liability companies'
      D: 'removes the need for preparing a balance sheet after each transaction'
    answer: D
    printed_key: C
    key_note: 'Recording each transaction in ledger accounts is what spares the trader a new balance sheet after every transaction (Frank Wood); the printed C, "can be used by any type of business", was a general truth rather than the ledger''s advantage and has been replaced by a false statement.'
    subtopic: ACC.2.d
    level: 2
    level_reason: see why transactions are kept in ledger accounts rather than in repeated balance sheets
    corrected: 'option C "can be used by any type of business" was also true, so it became "is kept only by limited liability companies"'

