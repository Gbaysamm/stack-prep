# UTME 2017 Principles of Accounts, written up by hand from source/past-questions.pdf, pages 75-85.
# This paper prints no paper-type question, so Q1 is a real question and all 40 questions are
# kept; none is dropped. Every answer was worked out afresh. Printed keys that did not hold up:
# Q1 (the appropriation account is what a partnership adds), Q2 (goodwill is shown only when it
# has been paid for), Q3 (a ₦20 payment put on the wrong side needs ₦40 to put right), Q9 (quick
# ratio 247,000 ÷ 300,000 = 0.82:1), Q10 (owners' equity includes the share premium and retained
# profit, ₦275,000), Q21 (only the ₦800 increase in the provision is charged), Q30 (simple
# average issues leave ₦17,500), Q32 (a shared vehicle's depreciation is split between the
# manufacturing and profit and loss accounts) and Q39 (₦13,500 was received; the ₦390 b/d was
# already held). Q38's key was blank. Rebuilt: Q4 (no option matched and C and D were the same;
# the profit is now a net profit of ₦1,000, giving purchases of ₦12,000), Q5 and Q6 (the club's
# figures were missing; a small clean data set was written), Q9 and Q10 (the garbled balance
# sheet was set out again with its missing long-term loan of ₦180,000 so that it balances at
# ₦755,000), Q11 (opening raw materials cannot be found without purchases; purchases of ₦320,000
# were added and the options rebuilt), Q12 (raw materials consumed read "300,600", which matched
# no option; it is ₦300,000), Q30 (the stem now says how the simple average is taken) and Q39 and
# Q40 (the extract is a receipts and payments account with a new tool of ₦510, as in 2014 Q32-33).
# Repaired: Q2's garbled option B, Q15-16's trading account set out as a T account, Q17 now asks
# for gross capital employed, Q21 says the debtors are before the write-off, Q26 says capitals are
# fixed, Q28's option C read "57 9000", Q35's receipts from customers read "1600" (₦16,400, as in
# 2012 Q26), Q36's stray option D became ₦45,000 (as in 2012 Q27), and small faults in wording put
# right elsewhere. Tables and accounts are KaTeX arrays in the stems. No figures.
