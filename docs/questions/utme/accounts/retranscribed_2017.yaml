questions:
  - number: 1
    stem: 'The major distinguishing element between the final accounts of a partnership and those of a sole trader is the'
    options:
      A: 'drawings account'
      B: 'creditors account'
      C: 'appropriation account'
      D: 'capital account'
    answer: C
    printed_key: B
    key_note: 'A partnership must share its net profit among the partners (interest on capital, salaries, interest on drawings, residual shares), so its final accounts add a profit and loss appropriation account; drawings, creditors and capital accounts are kept by a sole trader too.'
    subtopic: ACC.15.c
    level: 2
    level_reason: compare the two sets of final accounts and spot the account only a partnership needs
    corrected: '"final account of a partnership and a sole trader" became "final accounts of a partnership and those of a sole trader"; option A "drawing" became "drawings account"'

  - number: 2
    stem: 'Following the prudence concept, goodwill should appear as an asset in the books of a business only if it has been'
    options:
      A: 'raised in connection with the admission of a new partner'
      B: 'purchased, that is, paid for in money or money''s worth'
      C: 'raised to account for the true value of a business on the death of a partner'
      D: 'raised in order to prevent the balance sheet from showing that the business is insolvent'
    answer: B
    printed_key: A
    key_note: 'Frank Wood and the Nigerian texts: goodwill is recorded as an asset only when it has been purchased (paid for); goodwill raised on admission or death is only a valuation used to adjust the partners'' capitals and is normally written off again.'
    subtopic: ACC.15.d
    level: 2
    level_reason: apply the rule that only purchased goodwill is shown as an asset
    corrected: 'option B "purchased at a certain price if it has been raised" was garbled and became "purchased, that is, paid for in money or money''s worth"; the stem names the prudence concept so that only one option fits; "in other to" became "in order to" and "insolent" became "insolvent"'

  - number: 3
    stem: 'A cash payment of ₦20 to John was entered on the receipts side of the cash book in error and credited to John''s account. Which of the following journal entries can be used to put the error right?'
    options:
      A: 'John ₦40 Dr, Cash ₦40 Cr'
      B: 'Cash ₦40 Dr, John ₦40 Cr'
      C: 'Cash ₦20 Dr, John ₦20 Cr'
      D: 'John ₦20 Dr, Cash ₦20 Cr'
    answer: A
    printed_key: D
    key_note: 'The payment should have been Dr John ₦20, Cr Cash ₦20 but was entered Dr Cash ₦20, Cr John ₦20; ₦20 only cancels the wrong entry, a further ₦20 records the payment, so Dr John ₦40, Cr Cash ₦40.'
    subtopic: ACC.2.f
    level: 3
    level_reason: reverse an entry made on the wrong sides and then record it rightly, doubling the amount
    corrected: '"john" became "John"; "correct the error" became "put the error right"'

