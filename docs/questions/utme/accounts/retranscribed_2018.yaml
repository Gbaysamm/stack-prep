  - number: 5
    stem: 'Use the information below to answer questions 5 and 6. Udoh Trading Company, balance sheet as at 31 December 1992: $$\begin{array}{|l|r|l|r|}\hline & \text{₦} & & \text{₦} \\ \hline \text{Capital} & 39{,}000 & \text{Land} & 20{,}000 \\ \text{Long-term loan} & 15{,}000 & \text{Building} & 30{,}000 \\ \text{Creditors} & 9{,}000 & \text{Stock} & 4{,}000 \\ \text{Accrued wages} & 5{,}000 & \text{Debtors} & 6{,}000 \\ & & \text{Cash} & 8{,}000 \\ \hline & 68{,}000 & & 68{,}000 \\ \hline\end{array}$$ What is the working capital?'
    options:
