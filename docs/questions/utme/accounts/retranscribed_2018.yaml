    stem: 'Use the information below to answer questions 11 and 12. Rakiya and Joy are in partnership and have agreed that interest of 5% per annum is to be charged on drawings. Their financial year ends on 31 December. The drawings made by the partners during the year were: $$\begin{array}{|l|l|r|}\hline \text{Partner} & \text{Date} & \text{₦} \\ \hline \text{Rakiya} & \text{31 March} & 200 \\ \text{Rakiya} & \text{30 September} & 300 \\ \text{Joy} & \text{1 April} & 100 \\ \text{Joy} & \text{1 July} & 240 \\ \hline\end{array}$$ Rakiya''s current account had no opening balance, and she was not credited with any income during the year. What is her closing current account balance?'
