  - number: 7
    stem: 'Use the information below to answer questions 7 and 8. Wazobia Enterprises, balance sheet as at 1/1/95: $$\begin{array}{|l|r|l|r|}\hline \text{Liabilities} & \text{₦} & \text{Assets} & \text{₦} \\ \hline \text{Capital} & 40{,}000 & \text{Furnishings} & 10{,}000 \\ & & \text{Ceiling fan} & 1{,}500 \\ & & \text{Cash in hand} & 28{,}500 \\ \hline & 40{,}000 & & 40{,}000 \\ \hline\end{array}$$ During January 1995: (i) rent for the shop, ₦12,000, was paid on 1 January for the whole year; (ii) total purchases were ₦15,000; (iii) total sales were ₦8,200; (iv) the stock of goods left at 31/1/95 was ₦10,000; (v) the sales boy was paid ₦500. All purchases and sales were for cash. What is the new balance sheet total as at 31/1/95?'
    options:
      A: '₦40,000'
      B: '₦41,500'
      C: '₦41,700'
      D: '₦48,500'
    answer: C
    printed_key: D
    key_note: 'January profit: sales 8,200 − cost of sales (15,000 − 10,000) = 3,200 gross; less one month''s rent 1,000 and wages 500 = ₦1,700; capital 41,700. Assets: furnishings 10,000 + fan 1,500 + stock 10,000 + rent prepaid 11,000 + cash 9,200 = ₦41,700.'
    subtopic: ACC.6.c
    level: 5
    level_reason: find the month's profit with a prepayment, then rebuild the balance sheet and check both sides
    corrected: 'the rent is said to be paid on 1 January for the whole year, and all purchases and sales are said to be for cash, which the cash balance needs; the opening balance sheet is set out as a table in the stem'

