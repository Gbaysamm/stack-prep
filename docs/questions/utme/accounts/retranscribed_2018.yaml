# UTME 2018 Principles of Accounts, written up by hand from source/past-questions.pdf, pages 86-95.
# This paper prints no paper-type question, so Q1 is a real question and all 40 questions are
# kept; none is dropped. Every calculation was worked afresh. Printed keys that did not hold up:
# Q1 (with no goodwill recorded, Wamo's equity is one-fifth of ₦210,000, ₦42,000), Q5 (current
# assets ₦18,000 less current liabilities ₦14,000 is ₦4,000), Q6 (₦14,000 over ₦14,000 is 1:1),
# Q7 (the rent prepaid for eleven months is an asset, so the total is ₦41,700), Q11 (rebuilt),
# Q12 (drawings ₦500 and interest ₦11.25 leave a debit of ₦511.25), Q21 (rebuilt), Q29 (goods
# and cash in transit), Q35 (goods sent are debited to the branch account), Q36 (selling price
# makes the branch easiest to check), Q39 (the Partnership Act charges no interest on drawings)
# and Q40 (in the branch books the profit is credited to the head office current account).
# Rebuilt: Q11 (no option was the interest on Joy's drawings, ₦9.75; it keeps the question with
# new options), Q19 ("best carried out at" had no single textbook answer, so it now names the
# cost plus mark-up method), Q21 (remittance in transit "in the branch books" had no single
# entry; it now asks the head office entry for cash sent by the branch) and Q27-28 (the
# departmental trading account was garbled; it is laid out cleanly for departments P and Q,
# which makes both printed answers work). Repaired: Q1 (options A and C were both ₦40,000; C is
# now ₦32,000, and the stem says no goodwill is recorded), Q3 (option C ₦480 Cr became ₦480 Dr,
# the side of a favourable cash book balance), Q7 and Q8 (the rent is paid on 1 January for the
# whole year and all purchases and sales are for cash; "31/a/95" became 31/1/95), Q12 (the year
# ends on 31 December and the current account had no opening balance), Q18 (option C now lists
# the four classes, production, administration, selling and distribution), Q23 (option A now
# reads "performance of each department"), Q29 (the discrepancy is between the two current
# accounts, not the trial balances; option C names goods and cash in transit), Q30 (option A's
# garbled "Khadija 11/3" became 1/3), Q31 (option D "direct" became "direct expenses"), Q37
# (option C "premium" is another name for goodwill and became "salary"), and small spelling or
# wording faults elsewhere, following the same questions in earlier years. All tables are KaTeX
# arrays in the stem. No figures.
