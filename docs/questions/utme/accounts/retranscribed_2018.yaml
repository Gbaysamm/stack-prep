    printed_key: A
    key_note: 'Current assets 4,000 + 6,000 + 8,000 = ₦18,000; current liabilities 9,000 + 5,000 = ₦14,000; working capital ₦4,000.'
    subtopic: ACC.6.b
    level: 4
    level_reason: sort the balance sheet into current items, add each side, then subtract
    corrected: 'the balance sheet is set out as a table in the stem'

