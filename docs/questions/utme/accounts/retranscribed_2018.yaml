  - number: 11
    stem: 'Use the information below to answer questions 11 and 12. Rakiya and Joy are in partnership and have agreed that interest of 5% per annum is to be charged on drawings. Their financial year ends on 31 December. The drawings made by the partners during the year were: $$\begin{array}{|l|l|r|}\hline \text{Partner} & \text{Date} & \text{₦} \\ \hline \text{Rakiya} & \text{31 March} & 200 \\ \text{Rakiya} & \text{30 September} & 300 \\ \text{Joy} & \text{1 April} & 100 \\ \text{Joy} & \text{1 July} & 240 \\ \hline\end{array}$$ What is the interest on Joy''s drawings?'
    options:
      A: '₦17.00'
      B: '₦9.75'
      C: '₦11.25'
      D: '₦7.25'
    answer: B
    printed_key: A
    key_note: 'Joy: 100 × 5% × 9/12 = ₦3.75 and 240 × 5% × 6/12 = ₦6.00, total ₦9.75. The printed ₦511.25 debit is Rakiya''s drawings plus her interest, not Joy''s interest.'
    subtopic: ACC.15.b
    level: 4
    level_reason: count the months from each drawing to the year end, then work and add two interest charges
    corrected: 'rebuilt: no printed option (₦511.25 debit, ₦500.00 credit, ₦349.75 credit, ₦340.00 credit) was the interest on Joy''s drawings, ₦9.75; the options are now amounts of interest, and the stem says the year ends on 31 December; the drawings are set out as a table'

