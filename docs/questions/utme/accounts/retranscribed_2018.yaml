  - number: 21
    stem: 'In reconciling the branch and head office current accounts, cash remitted by the branch but still in transit at the year end is entered in the head office books as a ___ in the branch account.'
    options:
      A: 'debit entry'
      B: 'contra entry'
      C: 'credit entry'
      D: 'reversal entry'
    answer: C
    printed_key: B
    key_note: 'Head office has not yet recorded the cash the branch sent, so it debits cash in transit and credits the branch account, which brings the branch account into line with the head office current account in the branch books. A contra entry is a cash book term.'
    subtopic: ACC.13.e
    level: 3
    level_reason: decide which books lack the entry, then the side of the branch account it goes on
    corrected: 'rebuilt: "remittance in transit in the branch books is treated as a" had no single right entry, since items in transit are adjusted in the books that have not yet recorded them; the stem now asks for the head office entry for cash sent by the branch'

