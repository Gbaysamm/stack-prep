questions:
  - number: 1
    stem: 'Kayode, Akpan and Kachalla are in partnership. Their capital accounts have balances of ₦40,000, ₦50,000 and ₦70,000 respectively. The partners agree to admit Wamo as a new partner with a one-fifth interest in the partnership capital in exchange for ₦50,000 cash. No goodwill is recorded. Wamo''s equity in the resulting partnership is'
    options:
      A: '₦40,000'
      B: '₦50,000'
      C: '₦32,000'
      D: '₦42,000'
    answer: D
    printed_key: B
    key_note: 'With no goodwill recorded, total capital after admission is 160,000 + 50,000 = ₦210,000, and one-fifth of it is ₦42,000; the ₦8,000 Wamo pays above that is a bonus to the old partners. ₦50,000 would need goodwill of ₦40,000 to be recorded.'
    subtopic: ACC.15.e
    level: 4
    level_reason: add the new capital to the old, then take the new partner's fraction of the total
    corrected: 'options A and C were both ₦40,000, so C became ₦32,000 (one-fifth of the old capital); "No goodwill is recorded" was added, since recording goodwill would make Wamo''s equity ₦50,000'

  - number: 2
    stem: 'Under which of the following conditions is a partnership dissolved?'
    options:
      A: 'Admission of a new partner'
      B: 'Change of the partnership''s head office'
      C: 'Purchase of a large quantity of fixed assets'
      D: 'Retirement of a manager who is not a partner'
    answer: A
    printed_key: A
    subtopic: ACC.15.f
    level: 1
    level_reason: recall that a change in the partners ends the old partnership

