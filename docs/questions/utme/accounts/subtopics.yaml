# UTME Principles of Accounts — the topics and subtopics every question is tagged with.
#
# Read from source/syllabus.pdf. The syllabus numbers its 18 topics straight through and letters
# every topic's contents, a, b, ...; a topic here is one numbered topic (ACC.<number>) and a
# subtopic is one lettered content in the syllabus's own lettering. Where a content lists
# numbered items under it (6.c's four adjustments, 15.c's three final accounts, 17.f's four
# officers, 18.c's four technologies), they stay inside that one subtopic.
# database/load_retranscribed_accounts.py builds the curriculum from this file, and every
# retranscribed_YYYY.yaml uses these codes.
format_version: 1
topics:
  ACC.1:
    name: Nature and Significance of Book Keeping and Accounting
    subtopics:
      ACC.1.a: "Development of accounting and its branches"
      ACC.1.b: "Objectives of book keeping and accounting"
      ACC.1.c: "Users and characteristics of accounting information"
      ACC.1.d: "Principles, concepts and conventions of accounting"
      ACC.1.e: "Role of accounting records and information"
      ACC.1.f: "Career opportunities in book keeping and accounting"
  ACC.2:
