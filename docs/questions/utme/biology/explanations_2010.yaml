format_version: 1
exam_year: 2010
subject: BIO
explanations:
  2:
    answer: C
    steps:
      - 'This is about the plant cell and its parts.'
      - 'Every plant cell, young or mature, is surrounded by a cell wall made of cellulose. The wall gives the cell its shape and keeps it from bursting when it takes in water.'
      - 'As a plant cell matures, a large central vacuole forms. It pushes the cytoplasm into a thin layer and the nucleus to one side, against the wall.'
      - 'Think of a cell from a yam tuber or the soft part of a cassava root under the microscope: a firm cellulose wall, a big sap vacuole and the nucleus at the edge.'
      - 'Remember: plants have walls of cellulose, animals have none.'
      - 'The trap is B. In a mature cell the nucleus is pushed to the side, not to the centre.'
    hint: 'Which statement is true of the wall of every plant cell?'
    why:
      A: 'Only a young cell is full of cytoplasm. A mature cell has a large vacuole.'
      B: 'The large vacuole pushes the nucleus to the side of the cell, not the centre.'
      D: 'The nucleus of a mature plant cell is a rounded or flattened body pressed against the wall by the vacuole. Small and irregular is not how it is described.'

  3:
    answer: D
    steps:
      - 'This is about the nucleus, the control centre of the cell.'
      - 'The nucleus holds the chromosomes. The genes on them carry hereditary information from parent to offspring and give the instructions for making proteins.'
      - 'Through those instructions the nucleus controls the life processes of the cell.'
      - 'Energy is released in the mitochondria by respiration, and stored as starch, glycogen or fat in the cytoplasm. The nucleus is not an energy store.'
      - 'Remember: nucleus means information, mitochondria mean energy.'
      - 'The trap is A or C, which look too important to be wrong. They are both true jobs of the nucleus.'
    hint: 'Which part of the cell releases energy? Is it the nucleus?'
    why:
      A: 'This is a true function. The nucleus directs the work of the whole cell.'
      B: 'This is a true function. The genes in the nucleus carry the code for every protein.'
      C: 'This is a true function. The chromosomes carry hereditary information.'

  4:
    answer: C
    steps:
      - 'This is about alternation of generations in the fern.'
      - 'A fern has two generations. The sporophyte is the leafy plant with fronds, roots and a rhizome; it makes spores. The gametophyte is a tiny heart-shaped prothallus that makes gametes.'
      - 'The sporophyte is large, long-lived and independent, so it is the dominant phase.'
      - 'The ferns you see on the trunk of an oil palm or on a damp wall in the rainy season are sporophytes.'
      - 'Remember: in ferns the plant you see is the sporophyte; in mosses the plant you see is the gametophyte.'
      - 'The trap is A. The gametophyte is dominant in mosses, not in ferns.'
    hint: 'The fern you see is the plant that carries spores on its fronds. What is that generation called?'
    why:
      A: 'The gametophyte is the small, short-lived generation in ferns. It dominates in mosses.'
      B: 'The prothallus is the fern gametophyte, a tiny, short-lived plant a few millimetres across, so it is not the dominant phase.'
      D: 'The antheridium is only the male sex organ on the prothallus, not a phase of the life cycle.'

  5:
    answer: D
    steps:
      - 'This is about parental care, the care parents give their young after the eggs are laid or the young are born.'
      - 'Birds build nests, sit on their eggs to keep them warm, and feed and guard the chicks until they can fly.'
      - 'In Nigeria you can watch a hen guard her chicks from a hawk, or weaver birds feed their young in nests hanging from a palm tree.'
      - 'Remember: the fewer eggs an animal lays, the more care it gives each one. Birds lay few eggs and care a lot.'
      - 'The trap is A. Most toads lay many eggs in water and leave them, so the tadpoles fend for themselves.'
    hint: 'Which of these animals sits on its eggs and feeds its young?'
    why:
      A: 'Most toads lay large numbers of eggs in water and leave them.'
      B: 'Snails lay eggs in damp soil and leave them to hatch on their own.'
      C: 'Earthworms leave their eggs in cocoons in the soil and give no care.'

  6:
    answer: B
    steps:
      - 'This is about how the vertebrate classes reproduce.'
      - 'A fish (IV) lays eggs and sheds sperm into water, so fertilisation and growth all happen in water.'
      - 'A toad (III) lives on land but must go back to water to lay its eggs, and its tadpoles live in water.'
      - 'The crocodile (II) is a reptile. It lives in rivers, but it has internal fertilisation and lays shelled eggs in a nest on the bank, so its eggs do not need water. The rabbit (I) has internal fertilisation and the young grow inside the mother, so it needs no water at all.'
      - 'So from most to least dependent: IV, III, II, I. Think of tilapia in a fish pond, toads calling at a puddle in the rainy season, a crocodile laying its eggs in the sand by the River Niger, and a rabbit in a hutch.'
      - 'The trap is D. It starts with the toad, but the fish depends on water even more than the toad. Do not be misled by the crocodile living in water either; it breeds on land.'
    hint: 'Look at the four drawings. Which animal must have water for every stage of breeding? Start there.'
    why:
      A: 'Starts with the rabbit, which needs no water to breed at all.'
      C: 'Starts with the rabbit, which needs no water to breed, and puts the toad last, though it needs water for its eggs and tadpoles.'
      D: 'Puts the toad and the crocodile before the fish. The fish needs water for every stage, the toad only for eggs and tadpoles, and the crocodile lays its eggs on land.'

  7:
    answer: D
    steps:
      - 'This is about the fossil record of the vertebrates.'
      - 'Fish were the first vertebrates. Amphibians came from fish, reptiles from amphibians, and mammals from reptiles.'
      - 'In the drawing, IV is the fish, III the toad (an amphibian), II the crocodile (a reptile) and I the rabbit (a mammal). So the order of appearance is IV, III, II, I, and the fish (IV) is the oldest group.'
      - 'Remember the order with "Fish Are Really Moving Forward": fish, amphibians, reptiles, mammals.'
      - 'The trap is A, the toad. Amphibians are old, but they came from fish.'
    hint: 'Which group of vertebrates lived first, and gave rise to the others?'
    why:
      A: 'Amphibians such as the toad came after fish, from fish ancestors.'
      B: 'Reptiles such as the crocodile came after the amphibians.'
      C: 'Mammals such as the rabbit came last of the four.'

  8:
    answer: B
    steps:
      - 'This is about prokaryotes, the Kingdom Monera.'
      - 'Monera are bacteria and blue-green algae. Their DNA lies free in the cytoplasm, with no nuclear membrane round it, so they have no true nucleus.'
      - 'Algae and fungi are eukaryotes. Their cells have a true nucleus with a nuclear membrane.'
      - 'The bacteria that sour milk into nono, or that live in the root nodules of groundnut, are Monera.'
      - 'Remember: pro means before, karyon means nucleus. Prokaryotes came before the nucleus.'
      - 'The trap is D. Viruses have no nucleus either, but they are not cells at all, so they are not a group of cells.'
    hint: 'The question asks for cells. Which group is made of cells that have no nuclear membrane?'
    why:
      A: 'Algae such as Spirogyra are eukaryotes with a true nucleus. Only the blue-green algae are Monera.'
      C: 'Fungi such as Rhizopus and mushrooms have true nuclei in their hyphae.'
      D: 'Viruses are not cells. They are particles of nucleic acid in a protein coat.'

  9:
    answer: D
    steps:
      - 'This is about feathers and body temperature in birds.'
      - 'Birds are warm-blooded. Feathers trap a layer of still air close to the skin, and still air is a poor conductor of heat, so the body heat stays in.'
      - 'The part labelled I in the drawing is the upper leg of a hawk, covered in feathers. These feathers work the same way as the body feathers. They are covering feathers, not flight feathers.'
      - 'A hen fluffs up its feathers on a cold harmattan morning to trap more air and keep warm.'
      - 'Remember: feathers are a blanket, not a heater.'
      - 'The trap is B. Feathers keep heat in, but they do not make heat. Heat comes from respiration in the body.'
    hint: 'Part I is the feathered upper leg. Feathers trap air. What does trapped air do to heat?'
    why:
      A: 'Feathers do not stop lice and mites; birds remove them by preening and dust bathing.'
      B: 'Feathers make no heat. Heat comes from respiration; feathers only stop it escaping.'
      C: 'Power for flight comes from the breast muscles beating the wings. The feathers on the legs play no part in it.'

  10:
    answer: A
    steps:
      - 'This is about how the beak and feet of a bird suit its food.'
      - 'Look at the bird in the drawing: a short, strongly hooked beak, which tears flesh, and strong feet with sharp curved talons, which grip and kill prey.'
      - 'These are the marks of a bird of prey, such as a hawk or an eagle, which eats meat.'
      - 'A hawk swoops on a farmer''s chicks in the village; it grabs them with its talons and tears them with its beak.'
      - 'Remember: hooked beak and talons mean hunter.'
      - 'The trap is B. Parrots also have hooked beaks for fruit, but their feet are for climbing, not sharp talons for killing.'
    hint: 'What job do sharp talons do? What food needs them?'
    why:
      B: 'Fruit eaters such as parrots have climbing feet, not killing talons.'
      C: 'Seed eaters such as weaver birds have short, thick, cone-shaped beaks for cracking seeds.'
      D: 'Nectar feeders such as sunbirds have long, thin beaks to reach into flowers.'

  11:
    answer: B
    steps:
      - 'This is about the inside of a dicot stem cut across.'
      - 'From outside in: the epidermis, the cortex, then a ring of vascular bundles, then the pith in the centre.'
      - 'In each bundle the phloem faces outwards, the xylem faces inwards towards the pith, and the cambium lies between them.'
      - 'Cut a young stem of a bean or a hibiscus plant and the bundles form a neat ring, like the numbers on a clock face.'
      - 'Remember: "phloem out, xylem in".'
      - 'The trap is C. The cambium lies between xylem and phloem inside each bundle, not between the cortex and the bundles.'
    hint: 'In each bundle, which tissue is closer to the pith?'
    why:
      A: 'The epidermis is the outermost layer; it surrounds the cortex, not the other way round.'
      C: 'The cambium lies between the xylem and the phloem, not outside the bundles.'
      D: 'Scattered bundles are found in a monocot stem, such as maize. A dicot has them in a ring.'

  12:
    answer: A
    steps:
      - 'This is about the two transport tissues of a flowering plant.'
      - 'Xylem carries water and mineral salts one way only, from the roots up the stem to the leaves.'
      - 'Phloem carries manufactured food, mainly sugar, from the leaves to other parts, here down the stem to the roots.'
      - 'In the drawing, III points to the plain inner channel, whose arrowheads point up from the root, along the stem and over into the leaf, so it is xylem. IV points to the shaded outer channel, whose arrow runs from the leaf down towards the roots, so it is phloem.'
      - 'A cassava plant sends sugar from its leaves down through the phloem and stores it as starch in its tuberous roots.'
      - 'Remember: xylem goes up, "phloem flows food".'
    hint: 'Water goes up from the roots. Food is made in the leaf. Which arrows go each way?'
    why:
      B: 'Arrows I and II pass between the leaf and the air; they are gases, not transport inside the plant.'
      C: 'Arrows I and II are gases moving in and out of the leaf, not material in xylem and phloem.'
      D: 'Arrow I is a gas entering the leaf, not movement in the xylem, and III is the upward xylem stream, not the phloem.'

  13:
    answer: D
    steps:
      - 'This is about photosynthesis in the leaf.'
      - 'In photosynthesis the leaf takes in carbon (IV) oxide and water and uses light energy to make glucose: $\ce{6CO2 + 6H2O ->[light][chlorophyll] C6H12O6 + 6O2}$.'
      - 'The oxygen is a by-product. It passes out of the leaf through the stomata into the air, and that is what arrow II shows: an arrow leaving the leaf. Arrow I, going into the leaf, is the carbon (IV) oxide.'
      - 'This is why water weed in a sunny pond or fish tank gives off bubbles of oxygen.'
      - 'Remember: in photosynthesis carbon (IV) oxide goes in and oxygen comes out.'
      - 'The trap is C. Carbon (IV) oxide is given out in respiration, but in photosynthesis it goes into the leaf.'
    hint: 'Arrow II leaves the leaf. Look at the right-hand side of the photosynthesis equation. Which gas is made and given out?'
    why:
      A: 'Mineral salts come into the plant from the soil through the roots; they do not escape from the leaf.'
      B: 'Energy from the sun is absorbed by the leaf, not given out.'
      C: 'Carbon (IV) oxide is taken in during photosynthesis, as arrow I shows; it is released in respiration.'

  14:
    answer: B
    steps:
      - 'This is about kwashiorkor, a deficiency disease.'
      - 'Kwashiorkor is caused by too little protein in the diet. Protein is needed for growth and for making body tissues.'
      - 'The child has a swollen belly and feet from fluid, thin limbs, pale, reddish hair and peeling skin.'
      - 'It is often seen when a child is weaned from breast milk on to pap or cassava alone, with no beans, fish, eggs or milk.'
      - 'Remember: kwashiorkor means a child that lacks protein; beans and fish prevent it.'
      - 'The trap is C. Lack of carbohydrate and all food together causes marasmus, a different disease.'
    hint: 'Which class of food builds the body?'
    why:
      A: 'Lack of vitamins causes diseases such as scurvy, rickets and beriberi.'
      C: 'A general lack of energy food leads to marasmus, a wasting disease without the swelling.'
      D: 'Fats and oils are energy foods. Kwashiorkor comes from too little protein, the body-building food, even when the child gets enough energy food.'

  15:
    answer: C
    steps:
      - 'This is about the types of heterotrophic nutrition.'
      - 'Sundew and bladderwort are green plants, so they make food by photosynthesis. They grow in boggy soil poor in nitrogen.'
      - 'They trap insects, digest them with enzymes and absorb the products. Taking in whole food and digesting it is holozoic nutrition.'
      - 'This is the same way a goat or a person feeds: eat, digest, absorb.'
      - 'Remember: holozoic means feeding like an animal.'
      - 'The trap is A. Their photosynthesis is autotrophic, but the question asks how they get food from the insects.'
    hint: 'The plant digests the whole insect. Which type of feeding does that?'
    why:
      A: 'Autotrophic describes their photosynthesis, not the way they feed on insects.'
      B: 'Saprophytes such as Rhizopus feed on dead matter by secreting enzymes onto it; they do not trap living prey.'
      D: 'Chemosynthesis makes food using energy from inorganic chemicals; it is done by some bacteria.'

  16:
    answer: A
    steps:
      - 'This is the Benedict''s test, a food test.'
      - 'Add Benedict''s solution to the food in a test tube and warm it in a water bath. A reducing sugar turns the blue solution green, yellow, then a brick-red precipitate.'
      - 'Glucose, fructose and maltose are reducing sugars. Ripe banana or pawpaw juice gives a strong brick-red result.'
      - 'Remember: Benedict''s, blue to brick-red, for reducing sugar.'
      - 'The trap is C. Sucrose is a sugar too, but it is not reducing, so it stays blue unless it is first boiled with dilute acid.'
    hint: 'Benedict''s solution is the test for which kind of sugar?'
    why:
      B: 'Fats are tested with Sudan III or the grease-spot test, not Benedict''s solution.'
      C: 'Sucrose is a non-reducing sugar and gives no brick-red colour until it is hydrolysed.'
      D: 'Amino acids do not change Benedict''s solution. Proteins are tested with the biuret test or Millon''s reagent.'

  17:
    answer: D
    steps:
      - 'This is about the mammalian heart.'
      - 'The heart is the pump. Its left ventricle has the thickest muscular wall, because it pumps blood through the aorta to the whole body.'
      - 'The right ventricle pumps only to the nearby lungs, and the auricles only push blood into the ventricles below them.'
      - 'You can feel the left ventricle at work as your pulse at the wrist, after a run up a flight of stairs.'
      - 'Remember: left ventricle, longest journey, thickest wall.'
      - 'The trap is C. Arteries carry blood away from the heart, but they do not pump it.'
    hint: 'Which chamber of the heart has the thickest wall, and why?'
    why:
      A: 'Veins carry blood back to the heart at low pressure; they do not pump.'
      B: 'The right auricle only receives blood from the body and passes it to the right ventricle.'
      C: 'Arteries carry blood pumped by the heart; their elastic walls do not drive the circulation.'

  18:
    answer: B
    steps:
      - 'This is about double circulation in mammals.'
      - 'Blood goes round two circuits. The pulmonary circulation takes blood from the heart to the lungs and back.'
      - 'The systemic circulation takes blood from the left ventricle through the aorta to every other part of the body, then back to the heart through the venae cavae.'
      - 'Remember: systemic means the whole system of the body; pulmonary means the lungs.'
      - 'The trap is D. The pulmonary circulation is the circuit that serves only the lungs.'
    hint: 'One circuit serves the lungs. What is the other one called?'
    why:
      A: 'The pulmonary artery carries blood from the heart to the lungs only.'
      C: 'The lymphatic system drains tissue fluid; it does not carry blood.'
      D: 'The pulmonary circulation serves only the lungs.'

  19:
    answer: A
    steps:
      - 'This is anaerobic respiration in yeast, also called fermentation.'
      - 'Without oxygen, yeast breaks glucose down into ethanol (alcohol) and carbon (IV) oxide, releasing a little energy: $\ce{C6H12O6 -> 2C2H5OH + 2CO2}$.'
      - 'This is how palm wine becomes stronger as it stands, and how the carbon (IV) oxide makes bread dough rise.'
      - 'Remember: yeast makes alcohol, muscles make lactic acid.'
      - 'The trap is B. Lactic acid is made when muscles respire without oxygen, not yeast.'
    hint: 'What makes palm wine strong when it is left to ferment?'
    why:
      B: 'Lactic acid is the product of anaerobic respiration in muscle, not in yeast.'
      C: 'Respiration never gives out oxygen, and anaerobic respiration takes place without it. Oxygen is given out only in photosynthesis.'
      D: 'Water is a product of aerobic respiration, not of fermentation.'

  20:
    answer: A
    steps:
      - 'This is about the breathing system of a mammal.'
      - 'The diaphragm is a dome-shaped sheet of muscle that separates the thorax, which holds the heart and lungs, from the abdomen, which holds the gut.'
      - 'When it contracts it flattens, the chest gets bigger and air rushes into the lungs.'
      - 'If you cut open a goat or a cow at the market, the diaphragm is the sheet of muscle between the lungs and the stomach.'
      - 'Remember: the diaphragm divides.'
      - 'The trap is B. The intercostal muscles also help in breathing, but they lie between the ribs.'
    hint: 'Which muscle forms the floor of the chest?'
    why:
      B: 'Intercostal muscles lie between the ribs, not between the thorax and abdomen.'
      C: 'The pleural membranes line the lungs and the chest wall; they are not muscle.'
      D: 'The pericardium is the membrane round the heart.'

  21:
    answer: B
    steps:
      - 'This is about the glands of mammalian skin.'
      - 'Sebaceous glands open into the hair follicles. They secrete sebum, an oily substance that keeps the hair and skin supple and water-repellent.'
      - 'Sebum is why a goat''s coat sheds rain and why unwashed hair looks oily.'
      - 'Remember: sebaceous, sebum, slippery.'
      - 'The trap is A. Sweat glands secrete sweat, which is watery, not oily.'
    hint: 'Which gland opens into the hair follicle?'
    why:
      A: 'Sweat glands secrete watery sweat for cooling, not oil.'
      C: 'Fat cells under the skin store fat and insulate the body; they secrete nothing onto the hair.'
      D: 'The granular layer is a layer of the epidermis; it secretes no oil.'

  22:
    answer: A
    steps:
      - 'This is about the regions of the mammalian kidney.'
      - 'A kidney cut lengthways shows an outer cortex, an inner medulla made up of pyramids, and the pelvis where urine collects before the ureter.'
      - 'The Bowman''s capsules and glomeruli lie in the cortex, where blood is filtered. Their tubules run into the medulla.'
      - 'A goat''s kidney from the market, cut in half, shows a darker outer cortex and a paler, striped medulla.'
      - 'Remember: capsules in the cortex, collecting in the medulla.'
      - 'The trap is C. The medulla holds the loops of Henle and collecting ducts, not the capsules.'
    hint: 'Which region is the outer layer of the kidney?'
    why:
      B: 'The pelvis is the hollow where urine collects, inside the kidney.'
      C: 'The medulla is the inner region with the loops of Henle and collecting ducts.'
      D: 'The pyramids are part of the medulla, not the outer layer.'

  23:
    answer: A
    steps:
      - 'This is about nastic movements.'
      - 'A nastic movement is a response of a plant part to a stimulus whose direction does not matter. A tropic response grows towards or away from the direction of the stimulus.'
      - 'Touch gives a nastic response in Mimosa pudica, the sensitive plant. Touch its leaflets anywhere and they fold up.'
      - 'You see Mimosa along footpaths and in school compounds all over Nigeria.'
      - 'Remember: nastic is "no direction"; tropic is "towards".'
      - 'The trap is B. Light from one side gives a directional bending, which is phototropism, not a nastic movement.'
    hint: 'Which stimulus makes the leaflets of the sensitive plant fold, whatever side it comes from?'
    why:
      B: 'Light from one side makes shoots bend towards it, a tropic response.'
      C: 'Chemical substances usually act from one direction and give tropic or tactic responses, such as a pollen tube growing towards the ovule.'
      D: 'Gravity acts in one direction and gives geotropism, roots growing down and shoots up.'

  24:
    answer: C
    steps:
      - 'This is about the male reproductive system of a mammal.'
      - 'Sperm are made in the seminiferous tubules of the testis. They then pass into the epididymis, a long coiled tube on the testis, where they are stored and mature.'
      - 'At ejaculation they move along the vas deferens to the urethra.'
      - 'Remember the path as make, store, carry, out: seminiferous tubules, then epididymis, vas deferens, urethra.'
      - 'The trap is D. The seminiferous tubules make the sperm, but they do not store them.'
    hint: 'Sperm are made in one place and kept in another. Where are they kept?'
    why:
      A: 'The vas deferens carries sperm from the epididymis to the urethra; it is a passage, not a store.'
      B: 'The urethra carries urine and semen out of the body.'
      D: 'The seminiferous tubules produce sperm; they pass into the epididymis to be stored.'

  25:
    answer: A
    steps:
      - 'This is about chemosynthesis, a kind of autotrophic nutrition.'
      - 'Chemosynthetic bacteria make food from carbon (IV) oxide and water, as green plants do, but they do it without light.'
      - 'They get the energy by oxidising simple inorganic substances. Nitrosomonas oxidises ammonia to nitrite, and Nitrobacter oxidises nitrite to nitrate.'
      - 'These nitrifying bacteria work in the soil of every farm, turning the ammonia from rotting leaves and dung into nitrate for yam and maize.'
      - 'Remember: photosynthesis uses light, chemosynthesis uses chemical oxidation.'
      - 'The trap is D. ATP is made from the energy released, but the energy itself comes from oxidation.'
    hint: 'Nitrifying bacteria turn ammonia into nitrite. Is that oxidation or reduction?'
    why:
      B: 'Denitrification is the change of nitrates to nitrogen gas by bacteria in waterlogged soil. It is a loss of nitrogen from the soil, not the way chemosynthetic organisms get energy to make food.'
      C: 'The inorganic substances are oxidised, not reduced. Reducing carbon (IV) oxide to sugar uses up energy; it does not supply it.'
      D: 'Phosphorylation only stores the energy as ATP after it has been released by oxidation.'

  26:
    answer: A
    steps:
      - 'This is about the conditions along the human gut.'
      - 'The gastric glands in the stomach wall secrete hydrochloric acid. The acid kills germs in the food and gives the right pH for pepsin to digest protein.'
      - 'In the duodenum, bile and pancreatic juice neutralise the acid, so the rest of the gut is alkaline or neutral.'
      - 'A sour taste in the throat after a heavy meal of pepper soup is stomach acid coming up.'
      - 'Remember: the stomach is sour, the small intestine is not.'
      - 'The trap is B. Acid food enters the duodenum, but bile and pancreatic juice there make it alkaline.'
    hint: 'Where is hydrochloric acid secreted?'
    why:
      B: 'Bile and pancreatic juice in the duodenum are alkaline and neutralise the stomach acid.'
      C: 'The ileum has alkaline intestinal juice.'
      D: 'The colon contents are near neutral; it mainly absorbs water.'

  27:
    answer: D
    steps:
      - 'This is about matching exchange and excretory structures with the organisms that have them.'
      - 'I is wrong. Spirogyra is a filamentous alga in water; it exchanges gases over its whole surface. Stomata are pores on the leaves of land plants.'
      - 'II is wrong. The earthworm breathes through its moist skin. Alveoli are the air sacs in the lungs of mammals.'
      - 'III is wrong. Malpighian tubules are the excretory organs of insects. Mammals use kidneys.'
      - 'IV is right. Protozoa such as Amoeba and Paramecium in fresh water use a contractile vacuole to pump out excess water.'
      - 'Remember: kidney for mammals, Malpighian tubules for insects, nephridia for earthworms, contractile vacuole for protozoa.'
    hint: 'Check each pair. Which organisms actually have a contractile vacuole?'
    why:
      A: 'Malpighian tubules belong to insects such as the cockroach. Mammals have kidneys.'
      B: 'The earthworm breathes through its moist skin. Alveoli are in mammal lungs.'
      C: 'Spirogyra has no stomata. Stomata are found on the leaves of land plants.'

  28:
    answer: C
    steps:
      - 'This is about food chains.'
      - 'A food chain shows who eats whom. It always starts with a producer, a green plant or alga that makes food from sunlight by photosynthesis.'
      - 'The energy then passes to herbivores, the primary consumers, and on to carnivores.'
      - 'A Nigerian chain: grass, then a grasshopper, then a lizard, then a hawk. Grass is the producer.'
      - 'Remember: no plant, no chain.'
      - 'The trap is D. The primary consumer is the second link, the first animal in the chain.'
    hint: 'Where does all the energy in a food chain first come into living things?'
    why:
      A: 'Consumers eat other organisms, so they must come after the producer.'
      B: 'Decomposers break down dead matter from every level; they do not start the chain.'
      D: 'The primary consumer, a herbivore, is the second link. It feeds on the producer.'

  29:
    answer: A
    steps:
      - 'This is about mycorrhiza, a mutualism between a fungus and plant roots.'
      - 'The fungal hyphae wrap round or enter the roots and spread far into the soil. They absorb mineral ions, especially phosphate, and pass them to the plant.'
      - 'In return the plant gives the fungus sugar made in photosynthesis. Both partners gain.'
      - 'Many forest trees, such as the iroko and the pine, grow poorly without their mycorrhizal fungi.'
      - 'Remember: the fungus is an extra root system for minerals.'
      - 'The trap is C. Using atmospheric nitrogen is the work of Rhizobium bacteria in the root nodules of legumes such as groundnut.'
    hint: 'The fungus spreads far into the soil. What does it collect for the plant?'
    why:
      B: 'Some protection may be a side benefit, but the main way mycorrhizae promote growth is by taking up mineral ions.'
      C: 'Fixing atmospheric nitrogen is done by Rhizobium in legume root nodules, not by mycorrhizal fungi.'
      D: 'Growth regulators are plant hormones such as auxin, made by the plant itself.'

  30:
    answer: A
    steps:
      - 'This is about the placenta in pregnancy.'
      - 'In the placenta the blood of the mother and the blood of the foetus come very close, but they never mix. A thin layer of cells separates them.'
      - 'Food and oxygen pass across this barrier to the foetus, and carbon (IV) oxide and urea pass back. Many germs and large molecules are kept out.'
      - 'This is why the mother''s blood group does not have to match the baby''s.'
      - 'Remember: the placenta is a barrier and a bridge.'
