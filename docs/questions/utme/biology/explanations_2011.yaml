format_version: 1
exam_year: 2011
subject: BIO
explanations:
  2:
    answer: C
    steps:
      - 'The bright red or orange head belongs to the adult male agama lizard only. Females and young males are dull brown.'
      - 'This bright colour is a courtship signal. The male bobs his head and shows off the colour to attract a female for mating.'
      - 'You see it on any compound wall in Nigeria: a red-headed male nodding on top of the wall while brown females sit nearby.'
      - 'Remember: "red head, ready to wed". Bright colours in males are usually for winning mates.'
      - 'The trap is B. The male does display to rival males to hold his patch, but the bright colour itself is the breeding colour that draws the females.'
    hint: 'Only the adult males have the red head. What do adult males need to do that females and young males do not?'
    why:
      A: 'A bright red head does the opposite of camouflage; it makes the lizard easy to see.'
      B: 'Rival males are chased off by head-bobbing and chasing; the colour is mainly the signal that attracts females.'
      D: 'Agama lizards are not distasteful, so the colour is not a warning to predators.'

  3:
    answer: C
    steps:
      - 'Biomass is the mass of living matter. Here we compare the mass of one individual of each kind.'
      - 'Agama (lizard), Bufo (toad) and Tilapia (fish) are all vertebrates, each weighing tens or hundreds of grams.'
      - 'Spirogyra is a green alga made of a thin thread of cells. One filament weighs only a tiny fraction of a gram.'
      - 'You can see Spirogyra as slimy green threads floating in a pond or a still stream; you need a lens to make out its cells.'
      - 'Remember: the simplest, thread-like organism is the lightest. So Spirogyra has the smallest biomass per individual.'
    hint: 'Three of these are vertebrates. Which one is a tiny green thread in a pond?'
    why:
      A: 'An agama lizard is a vertebrate weighing many grams, far more than one algal thread.'
      B: 'A toad is a vertebrate with a large body, so its biomass is far greater.'
      D: 'A tilapia fish is a vertebrate of hundreds of grams, far heavier than Spirogyra.'

  4:
    answer: B
    steps:
      - 'Seed plants (spermatophytes) are the plants that reproduce by seeds.'
      - 'They are divided into two groups. Gymnosperms carry naked seeds on cones, like the pine. Angiosperms carry their seeds inside a fruit, like the mango and the orange.'
      - 'Monocotyledons and dicotyledons are only the two classes inside the angiosperms. Maize is a monocot and beans are a dicot.'
      - 'Remember: "gymno" means naked and "angio" means a vessel or box. Naked seeds or boxed seeds.'
      - 'The trap is C. Monocots and dicots are real groups, but they are a lower division, inside the angiosperms only.'
    hint: 'Think of the pine tree and the mango tree. How do their seeds differ?'
    why:
      A: 'Ferns do not make seeds at all, and tracheophytes means all plants with vascular tissue.'
      C: 'Monocots and dicots divide the angiosperms only, not all seed plants.'
      D: 'Thallophytes and bryophytes are non-seed plants (algae and mosses).'

  5:
    answer: D
    steps:
      - 'Parental care means the parents protect and feed their young after birth or hatching.'
      - 'Mammals show the most care. The young grow inside the mother, are born alive, are fed on milk and are guarded for a long time.'
      - 'A goat suckles its kid for months, and human babies are cared for over many years.'
      - 'Birds also care for their young, but for a shorter time. Most reptiles and amphibians lay eggs and leave them.'
      - 'Remember: "milk means most care". Only mammals feed their young on milk.'
    hint: 'Which group feeds its young on milk from the mother''s body?'
    why:
      A: 'Most reptiles lay eggs and leave them, so care is little or none.'
      B: 'Most amphibians, such as the toad, leave their eggs in water with no care.'
      C: 'Birds do brood and feed their chicks, but for a shorter time than mammals care for theirs.'

  6:
    answer: B
    steps:
      - 'An agricultural pest is an organism that damages crops on the farm. Name each drawing first: I is a grasshopper (short wings, long jumping hind legs), II a young cockroach seen from above, III a mosquito pupa and larva in water, and IV a hairy caterpillar on a twig.'
      - 'The grasshopper (I) has biting and chewing mouthparts and eats leaves of maize, millet and grasses. The variegated grasshopper strips cassava leaves in the dry season, and its relative, the locust, can strip whole farms in the savanna.'
      - 'The caterpillar (IV), the larva of a butterfly or moth, also chews leaves. Caterpillars eat cabbage, cowpea and maize leaves.'
      - 'The cockroach (II) is a household pest that spoils stored food in kitchens. The mosquito pupa (III) lives in water and does not feed at all.'
      - 'Remember: crop pests have chewing mouthparts and live on the farm. So the pests are I and IV.'
    hint: 'Which two of these chew the leaves of farm crops?'
    why:
      A: 'The caterpillar is a crop pest, but the cockroach is a household pest, not a farm pest.'
      C: 'The cockroach is a household pest, and the mosquito larva and pupa live in water and never feed on crops.'
      D: 'The grasshopper is a crop pest, but the mosquito larva and pupa live in water and do not touch crops at all.'

  7:
    answer: B
    steps:
      - 'Drawing IV is a caterpillar, the larva of a butterfly or moth: a soft ringed body with bristles, three pairs of true legs behind the head and fleshy prolegs further back.'
      - 'It has strong chewing mouthparts and eats leaves all day, because it must store food before it turns into a pupa.'
      - 'Farmers in Nigeria lose cabbage, cowpea and maize leaves to caterpillars such as the armyworm, which can sweep through a whole maize farm.'
      - 'Remember: a caterpillar is "a stomach on legs". Its job is to eat, and it eats crops.'
      - 'The trap is A. Disease spread through water belongs to insects with water-living young, like the mosquito, not to the caterpillar.'
    hint: 'What does a caterpillar spend all its time doing, and on which plants?'
    why:
      A: 'Caterpillars live on land plants and do not spread water-borne disease.'
      C: 'Caterpillars live on leaves, not near drinking water; it is the housefly that carries filth to food and water.'
      D: 'Caterpillars do not eat mosquito larvae; fish such as Tilapia do.'

  8:
    answer: D
    steps:
      - 'Drawing III shows young mosquitoes in water: a comma-shaped pupa hanging at the surface by its breathing trumpets, and a larva hanging head down by its breathing tube. The adult that comes out of them is a mosquito.'
      - 'The female Culex mosquito carries the tiny worms (filarial worms) that cause elephantiasis. When she sucks blood, the worms enter the person.'
      - 'The worms block the lymph vessels, so a leg or another part swells hugely. The disease is found in many parts of Nigeria.'
      - 'Remember: "Culex carries the worm that makes the leg like an elephant''s".'
      - 'The trap is B. River blindness is also carried by an insect whose young live in water, but that insect is the blackfly, Simulium, not the mosquito.'
    hint: 'The comma-shaped pupa and the larva in the water are young mosquitoes. Which of these diseases does a mosquito carry?'
    why:
      A: 'Sleeping sickness is carried by the tsetse fly of the savanna.'
      B: 'River blindness is carried by the blackfly, whose larvae live in fast-flowing rivers.'
      C: 'Cholera is caught from water or food dirtied with faeces; no insect vector is needed.'

  9:
    answer: A
    steps:
      - 'A termite colony has workers, soldiers and a king and queen. Winged reproductives (alates) are raised in large numbers.'
      - 'At the start of the rains they fly out together. This is the nuptial flight.'
      - 'They spread out, pair up, drop their wings and dig in to start new colonies far from the old mound.'
      - 'In Nigeria these are the flying termites that swarm round lights after the first rain, and that many people gather and fry.'
      - 'Remember: the flight is for spreading the family to new homes. The trap is B; birds do feast on them, but that is not the use of the flight to the termites.'
    hint: 'After the flight, what does each surviving pair go on to do?'
    why:
      B: 'Birds do eat the swarming termites, but that is a loss to the termites, not their gain.'
      C: 'A pair may come from the same colony or from different ones, so the flight does not ensure cross-breeding; its gain is spreading out to found new colonies.'
      D: 'The reproductives leave to found colonies, not to save food for the others.'

  10:
    answer: A
    steps:
      - 'In the drawing, the left tube holds sucrose (sugar) solution and yeast, and the delivery tube carries any gas over into the lime water in the right tube. Yeast is a fungus that respires the sugar.'
      - 'With little air, yeast respires anaerobically: $\ce{C6H12O6 -> 2C2H5OH + 2CO2}$ (glucose gives ethanol and carbon(IV) oxide).'
      - 'The gas passes along the delivery tube and bubbles through lime water, which turns milky. Only carbon(IV) oxide turns lime water milky.'
      - 'This is the same gas that makes palm wine froth and makes bread dough rise.'
      - 'Remember: "milky lime water means $\ce{CO2}$". The trap is C, oxygen, which is given off by photosynthesis, not by respiring yeast.'
    hint: 'Which gas turns lime water milky?'
    why:
      B: 'Yeast does not give off nitrogen, and nitrogen does not change lime water.'
      C: 'Oxygen is used, not made, in respiration, and it does not turn lime water milky.'
      D: 'Carbon(II) oxide comes from incomplete burning of fuel, not from yeast.'

  11:
    answer: C
    steps:
      - 'Yeast in sugar solution, with no air let in, breaks the sugar down without oxygen.'
      - 'This anaerobic respiration in yeast is called fermentation. It gives ethanol, carbon(IV) oxide and a little energy.'
      - 'The milky lime water shows the carbon(IV) oxide coming off.'
      - 'Fermentation is how palm wine, burukutu and pito get their alcohol, and why bread dough rises.'
      - 'Remember: yeast plus sugar, no air, gives alcohol and gas. The trap is B; there is no green plant and no light here.'
    hint: 'What does yeast do to sugar when there is no air?'
    why:
      A: 'Diffusion is the spread of particles from high to low concentration; the set-up is built to collect a gas made by yeast.'
      B: 'Photosynthesis needs a green plant and light; yeast is a fungus with no chlorophyll.'
      D: 'Plasmolysis is the shrinking of a plant cell''s contents in a strong solution; nothing here tests that.'

  12:
    answer: D
    steps:
      - 'Osmosis is the movement of water across a cell membrane from a weaker (dilute) solution to a stronger (concentrated) one.'
      - 'A hypertonic solution is more concentrated than the cell sap or cytoplasm. Water leaves the cell, so the cell shrinks.'
      - 'This is why salt sprinkled on a garden snail or on cut vegetables draws water out and makes them shrivel.'
      - 'Remember: "hyper" means more, more solute outside, so water goes out and the cell shrinks.'
      - 'The trap is A. A hypotonic solution, and deionized water, make water flow in, so the cell swells.'
    hint: 'For water to leave the cell, should the outside be weaker or stronger than the inside?'
    why:
      A: 'In a hypotonic solution water enters the cell, so it swells, not shrinks.'
      B: 'In an isotonic solution there is no net flow of water, so the cell keeps its size.'
      C: 'Deionized water is pure water, so water rushes in and the cell swells.'

  13:
    answer: C
    steps:
      - 'Leucocytes are the white blood cells.'
      - 'They are the largest blood cells and each has a nucleus, often lobed. Red blood cells in mammals have no nucleus.'
      - 'Their work is defence. Phagocytes engulf germs and lymphocytes make antibodies, for example against the malaria parasite.'
      - 'Remember: white cells are "few, big and nucleated". Red cells are many and have no nucleus; platelets clot the blood.'
      - 'The trap is B. Red cells are the most numerous, about 5 million in each cubic millimetre, against only about 7,000 white cells.'
    hint: 'Compare white cells with red cells. Which are bigger, and which have a nucleus?'
    why:
      A: 'The respiratory pigment is haemoglobin, inside the red blood cells.'
      B: 'Red blood cells are far more numerous than white cells.'
      D: 'Blood clotting is started by the platelets, not the white cells.'

  14:
    answer: B
    steps:
      - 'Food is first digested (broken down), then absorbed into the blood.'
      - 'Assimilation is the next step. The body takes the absorbed nutrients into its cells and builds them into its own molecules, for example amino acids built into new proteins.'
      - 'When a goat eats grass, the plant protein ends up as the goat''s own muscle by assimilation.'
      - 'Remember the order: digestion, absorption, assimilation. "Assimilate" means to make part of yourself.'
      - 'The trap is A. Digestion only breaks big food molecules into small ones; it does not build the body''s own molecules.'
    hint: 'After food has been digested and absorbed, what does the body do with it?'
    why:
      A: 'Digestion breaks food down into small molecules; it does not build them into body molecules.'
      C: 'Absorption only takes digested food into the blood.'
      D: 'Inhibition means slowing or stopping a process, such as an enzyme reaction.'

  15:
    answer: B
    steps:
      - 'Irritability (sensitivity) is one of the characteristics of living things.'
      - 'It is the ability to detect a change in the surroundings (a stimulus) and respond to it.'
      - 'When you touch the leaves of Mimosa pudica, the "shame plant" that grows by the roadside, they fold up at once. That is irritability.'
      - 'Remember: "irritate it and it reacts".'
      - 'The trap is D. A taxis is only one kind of response, the movement of a whole organism towards or away from a stimulus.'
    hint: 'Which word names the general ability of all living things to respond to a stimulus?'
    why:
      A: 'Locomotion is movement from place to place, not the general ability to respond.'
      C: 'Growth is a permanent increase in size, not a response to a change.'
      D: 'Taxis is one type of response by moving organisms, not the general ability.'

  16:
    answer: D
    steps:
      - 'Blood stays inside the vessels, but some plasma leaks out of the thin capillaries to bathe the cells. This is tissue fluid.'
      - 'Food, oxygen and other nutrients pass from the tissue fluid into the cells, and wastes such as carbon(IV) oxide and urea pass out into it.'
      - 'This fluid drains into the lymph vessels as lymph and returns to the blood. So lymph and tissue fluid are the go-between for blood and cells.'
      - 'Remember: cells never touch the blood itself; they swim in the fluid that becomes lymph.'
      - 'The trap is A. The lungs exchange only gases with the air, not nutrients and metabolic products.'
    hint: 'Which fluid surrounds the body cells and passes things between them and the blood?'
    why:
      A: 'The lungs exchange oxygen and carbon(IV) oxide with the air, not nutrients.'
      B: 'The oesophagus only carries food down to the stomach.'
      C: 'The trachea only carries air to and from the lungs.'

  17:
    answer: A
    steps:
      - 'An endospermous (albuminous) seed stores its food in an endosperm, a tissue outside the embryo.'
      - 'In a maize grain the endosperm is the large starchy part, and the embryo with its single cotyledon lies at one side.'
      - 'A non-endospermous seed, like the bean or the cashew, stores its food in thick cotyledons instead.'
      - 'Remember: cereals such as maize, rice and sorghum keep their food in the endosperm. That is why we grind them into flour.'
      - 'The trap is D. The bean splits into two fat cotyledons, which are its food store; it has no endosperm.'
    hint: 'Which of these seeds keeps its food outside the embryo, as flour?'
    why:
      B: 'The cashew nut stores food in its two large cotyledons, not an endosperm.'
      C: 'The cotton seed stores most of its food in folded cotyledons, so it is not a typical endospermous seed.'
      D: 'The bean seed stores its food in two thick cotyledons, with no endosperm.'

  18:
    answer: C
    steps:
      - 'Check each pairing in turn.'
      - 'I. Sundew is an insectivorous plant; it makes its own food and traps insects for nitrogen. It is not a parasite. Wrong.'
      - 'II. Amoeba engulfs food particles; it cannot make its own food, so it is not autotrophic. Wrong.'
      - 'III. An alga has chlorophyll and photosynthesises, so it is autotrophic, not saprophytic. Wrong.'
      - 'IV. Agama eats insects; it depends on food made by others, so it is heterotrophic. Right.'
      - 'Remember: "auto" means self-feeding, "hetero" means feeding on others. Only IV is correctly matched.'
    hint: 'Ask for each organism: does it make its own food or not?'
    why:
      A: 'Amoeba cannot make its own food, so it is heterotrophic, not autotrophic.'
      B: 'An alga photosynthesises, so it is autotrophic, not a saprophyte.'
      D: 'Sundew is an insectivorous plant, not a parasite.'

  19:
    answer: B
    steps:
      - 'Cane sugar is sucrose, a disaccharide. Hydrolysis splits it into glucose and fructose.'
      - 'Tube I: water alone does not split sucrose, so no glucose appears.'
      - 'Tube II: dilute acid, when warmed, hydrolyses sucrose, so glucose appears.'
      - 'Tube III: the enzyme sucrase hydrolyses sucrose, so glucose appears.'
      - 'So glucose is found in II and III only. You would show it by boiling with Benedict''s or Fehling''s solution and seeing a brick-red colour.'
      - 'The trap is D. Sucrose is a non-reducing sugar, and water alone cannot break it down.'
    hint: 'Water, acid and enzyme: which of these can actually split sucrose?'
    why:
      A: 'Water alone does not hydrolyse sucrose, so tube I has no glucose.'
      C: 'Tube I has only water, which cannot split sucrose; glucose forms in II and III, not in I.'
      D: 'Tube I has only water, which cannot split sucrose.'

  20:
    answer: C
    steps:
      - 'Enzymes are usually named after their substrate, with "-ase" on the end.'
      - 'Sucrose is split by sucrase (also called invertase) into glucose and fructose.'
      - 'In the body, sucrase is made by the wall of the small intestine and works on the sugar in a cup of sweet tea or a piece of sugar cane.'
      - 'Remember: sucrose goes with sucrase, maltose with maltase.'
      - 'The trap is D. Maltase is the right kind of enzyme, a carbohydrase, but it splits maltose, not cane sugar.'
    hint: 'Name the enzyme after the sugar it works on.'
    why:
      A: 'Rennin curdles milk protein in the stomach of young mammals.'
      B: 'Erepsin breaks peptides into amino acids.'
      D: 'Maltase splits maltose, not sucrose.'

  21:
    answer: C
    steps:
      - 'The inner ear has two jobs. The cochlea is for hearing; the semicircular canals, with the utricle and saccule, are for balance.'
      - 'There are three semicircular canals at right angles to one another, filled with fluid. When the head turns, the fluid moves and bends sensory hairs in a swelling (ampulla) at the base of each canal.'
      - 'The nerves send these messages to the cerebellum, which keeps the body balanced.'
      - 'When you spin round and round at play and then stop, the fluid keeps moving and you feel dizzy.'
      - 'Remember: three canals for three directions of turning. The trap is A, the cochlea, which is also in the inner ear but is for hearing.'
    hint: 'Which part of the inner ear senses turning of the head?'
    why:
      A: 'The cochlea turns sound vibrations into nerve impulses; it is for hearing.'
      B: 'The pinna is the outer ear flap that collects sound.'
      D: 'The ossicles are three small bones that pass sound vibrations across the middle ear.'

  22:
    answer: A
    steps:
      - 'Air enters through the nose and passes down the windpipe, the trachea.'
      - 'The trachea divides into two bronchi, one to each lung.'
      - 'Each bronchus branches again and again into fine bronchioles.'
      - 'The bronchioles end in tiny air sacs, the alveoli, where gas exchange takes place.'
      - 'Remember: it is like a tree turned upside down, trunk, big branches, twigs and then leaves. The trap is C, which puts the twigs before the branches.'
    hint: 'Go from the widest tube to the smallest.'
    why:
      B: 'Air reaches the trachea before the bronchi, and the alveoli are the last stop.'
      C: 'The bronchi come before the much finer bronchioles.'
      D: 'This is the reverse order, the path of air going out.'

  23:
    answer: B
    steps:
      - 'A taxis (tactic movement) is the movement of a whole organism towards or away from a stimulus.'
      - 'Movement towards the stimulus is positive; movement away is negative. Light is the stimulus here, so it is phototaxis.'
      - 'A cockroach runs away from light, so it shows negative phototaxis. Switch on the kitchen light at night and watch the cockroaches dash into dark corners.'
      - 'Remember: tropisms are for plants that grow, taxes are for organisms that move about.'
      - 'The trap is C. A tropism is a growth movement of part of a fixed plant, such as a shoot bending to light.'
    hint: 'Does the whole cockroach move, or does part of it grow?'
    why:
      A: 'Positive phototaxis would be moving towards the light.'
      C: 'Phototropism is a growth response of plant parts, not the movement of a whole animal.'
      D: 'Positive phototropism is a shoot growing towards light; it does not apply to an animal.'

  24:
    answer: A
    steps:
      - 'The vascular tissues of a flowering plant are the xylem and the phloem.'
      - 'Xylem carries water and dissolved mineral salts up from the roots to the leaves.'
      - 'Phloem carries manufactured food, mainly sugar, from the leaves to other parts, such as the tuber of a yam or cassava.'
      - 'Remember: "xylem for water, phloem for food".'
      - 'The trap is C. Transpiration pull is a force that helps to lift water in the xylem; it is not the work of the tissues themselves.'
    hint: 'Name the two vascular tissues and what each one carries.'
    why:
      B: 'Suction pressure is a force that draws water into cells, not the work of vascular tissue.'
      C: 'Transpiration pull is a force that moves water; the tissues are the pipes that carry it.'
      D: 'Gases move mainly by diffusion through stomata and air spaces, not through the vascular tissue.'

  25:
    answer: B
    steps:
      - 'The kidney is the organ of excretion and osmoregulation in mammals.'
      - 'In each nephron, blood is filtered under pressure in the glomerulus. Then the tubule takes back the useful materials the body needs.'
      - 'By controlling how much water, salts and hydrogen ions it takes back, and passing out urea, the kidney keeps the blood steady.'
      - 'In the harmattan or on a hot day when you drink little, your kidneys keep water and you pass less, darker urine.'
      - 'Remember: the kidney is the blood''s cleaner and balancer. The trap is A; the liver makes urea, but the kidney removes it.'
    hint: 'Which organ makes urine?'
    why:
      A: 'The liver makes urea from excess amino acids, but the kidney removes it and balances water and salts.'
      C: 'The bladder only stores urine; it does not regulate the blood.'
      D: 'The colon takes back water from undigested food, not urea and hydrogen ions.'

  26:
    answer: D
    steps:
      - 'A bony fish breathes by passing water over its gills in one direction.'
      - 'It opens its mouth and lowers the floor of the mouth, so water flows in while the operculum (gill cover) stays shut.'
      - 'It then closes its mouth and raises the floor, so water is forced over the gills. Oxygen diffuses into the blood in the gill filaments.'
      - 'The operculum opens and the water flows out. Watch a tilapia in a bowl: mouth and gill covers open in turn.'
      - 'Remember: in at the mouth, over the gills, out under the operculum. The trap is C, which puts the exit before the gills.'
    hint: 'Where does water go in, and where does it come out?'
    why:
      A: 'This is the reverse; water leaves under the operculum, it does not enter there.'
      B: 'Water must enter through the mouth before it reaches the gills.'
      C: 'The operculum is the way out, after the water has passed the gills.'

  27:
    answer: D
    steps:
      - 'Paramecium and Amoeba are both single-celled protists.'
      - 'Both reproduce asexually by binary fission. The nucleus divides into two, then the cytoplasm divides, giving two daughter cells.'
      - 'A pond in the rainy season can be full of these tiny protists, because fission doubles their number again and again.'
      - 'Remember: "fission" means splitting, one cell becomes two.'
      - 'The trap is A. Budding is how yeast and Hydra reproduce, by a small outgrowth, not by splitting in half.'
    hint: 'How does one single cell become two?'
    why:
      A: 'Budding is found in yeast and Hydra, not in Paramecium and Amoeba.'
      B: 'Sporulation, making spores, is used by fungi such as Rhizopus and by Plasmodium.'
      C: 'Fragmentation is breaking into pieces, as in Spirogyra, not division of one cell.'

  28:
    answer: C
    steps:
      - 'Mutualism is a relationship in which both partners benefit.'
      - 'Animals breathe out carbon(IV) oxide, which plants take in for photosynthesis.'
      - 'Plants give off oxygen in photosynthesis, which animals take in for respiration.'
      - 'So each one uses the waste gas of the other, and both gain. This keeps the oxygen and carbon(IV) oxide in the air balanced.'
      - 'The trap is B. Animals feeding on plants benefits only the animals, so it is not mutualism.'
    hint: 'In mutualism, both sides must gain. What does each side get from the other?'
    why:
      A: 'Rivals compete; competition harms both, it is not mutualism.'
      B: 'Animals eating plants benefits only the animals, so it is not a two-way gain.'
      D: 'Living close together does not by itself mean that both benefit.'

  29:
    answer: A
    steps:
      - 'Data: basin = 80.5 g, basin + soil = 101.5 g, after oven drying = 99.0 g, after roasting = 95.5 g.'
      - 'Mass of soil sample = 101.5 − 80.5 = 21.0 g. Drying removes water (101.5 − 99.0 = 2.5 g).'
      - 'Roasting then burns off the humus: mass of humus = 99.0 − 95.5 = 3.5 g.'
      - '% humus = (3.5 ÷ 21.0) × 100 = 16.7%.'
      - 'Check: the humus is a small part of the soil, about one sixth, so 16.7% makes sense.'
      - 'The trap is B, 17.6%, which swaps the last two digits of the right answer.'
    hint: 'Find the mass of the soil first, then the mass lost on roasting.'
    why:
      B: 'The digits are swapped; 3.5 ÷ 21.0 × 100 is 16.7%, not 17.6%.'
      C: 'Too large; that would be 5.6 g of humus out of 21.0 g.'
      D: 'Close, but 3.5 g of humus out of 21.0 g of soil works out to 16.7%, not 16.2%.'

  30:
    answer: C
    steps:
      - 'A filter feeder strains tiny food particles out of the water it takes in.'
      - 'Baleen whales take in huge mouthfuls of sea water and push it out through comb-like baleen plates. Tiny shrimps (krill) and plankton are trapped and swallowed.'
      - 'Many small animals in the Lagos lagoon, such as oysters and mussels, feed the same way by straining water.'
      - 'Remember: the biggest animal feeds on some of the smallest, by sieving.'
      - 'The trap is A. The shark is in the sea too, but most sharks hunt and bite large prey.'
    hint: 'Which of these sieves its food out of the sea?'
    why:
      A: 'Most sharks are predators that catch and bite large prey.'
      B: 'The butterfly sucks nectar with its proboscis; it is a fluid feeder.'
      D: 'The mosquito pierces skin and sucks blood; it is a fluid feeder.'

  31:
    answer: D
    steps:
      - 'A population pyramid shows the numbers of people in each age group, the youngest at the bottom.'
      - 'In a developing country many babies are born (high birth rate), so the base is broad.'
      - 'Many people die at all ages from disease and poor health care (high death rate), so the sides slope in quickly and the top is narrow.'
      - 'Few people reach old age, so the lifespan is short. The pyramid of Nigeria has this broad base and pointed top.'
      - 'Remember: broad base, pointed top, short life. The trap is C; a low death rate belongs to a developed country.'
    hint: 'Picture a pyramid with a broad base and a sharp top. What does the sharp top say about old people?'
    why:
      A: 'A long lifespan gives a wide top, as in developed countries.'
