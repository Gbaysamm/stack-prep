    steps:
      - 'Carrying capacity is the largest population a habitat can support for a long time.'
      - 'A population grows in an S-shaped curve. At first growth is slow, then fast (exponential). As food and space run short, growth slows down. When births equal deaths, the population stops growing and stays steady: that level is the carrying capacity.'
      - 'Goats on a fenced farm increase quickly at first; once the grass can feed no more, their number levels off.'
      - 'Remember: carrying capacity is the flat top of the S.'
      - 'The trap is C. Growth begins to slow down well before carrying capacity, at about half of it. The capacity is reached only when the number stops rising.'
    hint: 'Draw the S-shaped curve. What is the population doing at the very top?'
    why:
      A: 'Slow increase happens at the start of the curve, and again just before the top; while the number is still rising, the carrying capacity has not been reached.'
      B: 'Exponential increase is the steep middle of the curve, when resources are plentiful.'
      C: 'Growth starts to slow at about half the carrying capacity; the capacity itself is reached when the number stops changing.'

