format_version: 1
exam_year: 2012
subject: BIO
explanations:
  2:
    answer: B
    steps:
      - 'Part II is the nucleus, the large round body in the middle of the cell, and it controls heredity.'
      - 'On the diagram the nucleus has a double envelope with pores, dotted chromatin and a dark nucleolus. The chromatin is the chromosomes, and the chromosomes carry the genes (DNA). When a cell divides, copies of them pass into the new cells, so the nucleus carries characters from parent to offspring.'
      - 'A child who has her mother''s dimples got the genes for them from the nuclei of the egg and the sperm that made her.'
      - 'Remember: the nucleus is the cell''s "head office", where the instructions are kept.'
      - 'The trap is III, the mitochondrion. It also holds a little DNA, but its work is respiration, releasing energy. It does not carry the characters of the organism.'
    hint: 'Which part holds the chromosomes? Look for the biggest body in the cell.'
    why:
      A: 'I points to the cell membrane, which controls what enters and leaves the cell; it holds no genes.'
      C: 'III points to a mitochondrion, the site of aerobic respiration, the powerhouse of the cell.'
      D: 'IV points to the endoplasmic reticulum, which carries materials through the cytoplasm; it does not hold the chromosomes.'

  3:
    answer: C
    steps:
      - 'IV points to the group of folded, flattened membrane sacs at the lower left of the cell. That is the endoplasmic reticulum (ER).'
      - 'The ER runs through the cytoplasm like a system of channels. It carries materials from one part of the cell to another. Rough ER is studded with ribosomes, which make proteins; smooth ER has none and makes fats.'
      - 'Think of the ER as the network of roads in Lagos, linking the "factories" (ribosomes) to the rest of the city.'
      - 'Remember: "reticulum" means a little net, and the ER is a net of sacs and tubes.'
      - 'The trap is the mitochondrion, III, which also has folded membranes. But its folds (cristae) are inside a small oval body with a double membrane, not a spread of separate sacs in the cytoplasm.'
    hint: 'Is IV one small closed body, or a set of folded sacs?'
    why:
      A: 'The mitochondrion is III, the small oval body with folded inner membranes, not the sacs at IV.'
      B: 'An animal cell has no cell wall; its outer layer is the thin cell membrane, labelled I.'
      D: 'The nucleus is II, the single large round body holding the chromosomes.'

  4:
    answer: D
    steps:
      - 'The animal phyla can be arranged in an evolutionary trend from simple to complex: flatworms, then annelids, then molluscs, then arthropods.'
      - 'The liver fluke (a flatworm) has no body cavity and no blood system. The earthworm (an annelid) has segments and a closed blood system. The snail (a mollusc) has a soft body in a shell.'
      - 'The cockroach (an arthropod) has a hard jointed exoskeleton, jointed legs, a body in three parts, compound eyes and wings. It has the most specialised body of the four.'
      - 'In a Nigerian kitchen the cockroach runs, flies and hides in cracks; the snail can only creep. Its jointed body lets it do much more.'
      - 'Remember the order with "Flat, Ring, Shell, Joint": flatworm, ringed worm, shelled mollusc, jointed arthropod.'
      - 'The trap is the snail, which is larger. Size does not decide how advanced an animal is; body organisation does.'
    hint: 'Which of these has jointed legs and a hard outer skeleton?'
    why:
      A: 'The liver fluke is a flatworm, the simplest of the four, with no body cavity.'
      B: 'The earthworm is an annelid: segmented, but with no jointed limbs or exoskeleton.'
      C: 'The snail is a mollusc: a soft, unsegmented body with no jointed legs or exoskeleton, so it sits below the arthropods in the trend.'

  5:
    answer: B
    steps:
      - 'Living things are classified in ranks: kingdom, phylum, class, order, family, genus, species.'
      - 'Each rank is a smaller group inside the one above it. The species is the smallest: a group of organisms so alike that they can breed together and produce fertile young.'
      - 'All goats belong to one species; goats and sheep are in the same family but are different species.'
      - 'Remember the order with "King Philip Came Over For Good Soup": Kingdom, Phylum, Class, Order, Family, Genus, Species.'
      - 'The trap is genus, which is just above species. The genus is the first word of a scientific name and the species the second, so species is lower.'
    hint: 'Which rank is the second word of a scientific name, such as Homo sapiens?'
    why:
      A: 'Class is high in the order, above order, family, genus and species.'
      C: 'Family is above genus and species.'
      D: 'Genus is just above species; one genus can hold several species.'

  6:
    answer: D
    steps:
      - 'Secondary growth is growth in thickness (girth) of the stem and root.'
      - 'It is made by a vascular cambium, a ring of dividing cells between the xylem and phloem, together with a cork cambium near the outside. Each year the cambium adds new xylem (wood) and phloem.'
      - 'Dicotyledons have a cambium in their vascular bundles, so woody dicots such as the mango tree and the iroko grow thick trunks.'
      - 'Remember: "Dicots get Dense", their trunks thicken year after year.'
      - 'The trap is the monocotyledons, which include tall plants like the oil palm. Monocots have no cambium, so the oil palm grows tall but its trunk hardly thickens by secondary growth.'
    hint: 'Which group has a cambium between the xylem and phloem?'
    why:
      A: 'Thallophytes such as Spirogyra have no vascular tissue at all, so no cambium.'
      B: 'Pteridophytes (ferns) have vascular tissue but no cambium, so they show no secondary growth.'
      C: 'Monocotyledons such as maize and the oil palm lack a cambium in their scattered vascular bundles.'

  7:
    answer: B
    steps:
      - 'Fungi are eukaryotes that were once grouped with plants.'
      - 'They are set apart because they have no chlorophyll, so they cannot make their own food. They feed as saprophytes or parasites, digesting food outside their bodies and absorbing it.'
      - 'The mushroom on a rotting log and the black Rhizopus mould on old bread feed on dead matter, because they cannot photosynthesise.'
      - 'Remember: no green, no food making, so fungi must feed on others.'
      - 'The trap is spores. Fungi do make spores, but so do ferns and mosses, so spores do not set fungi apart.'
    hint: 'What do green plants have that a mushroom lacks?'
    why:
      A: 'Ferns, mosses and some bacteria also make spores, so spores do not mark out fungi.'
      C: 'Not every fungus forms fruiting bodies; yeast has none at all, so they cannot be what sets all fungi apart.'
      D: 'Very many plants and animals have both asexual and sexual reproduction.'

  8:
    answer: A
    steps:
      - 'Many insects undergo complete metamorphosis: egg, larva, pupa, adult.'
      - 'In the butterfly the larva is the caterpillar. It feeds greedily on leaves to grow, so it is the destructive stage. The adult butterfly only sips nectar.'
      - 'Caterpillars can strip the leaves of citrus and cowpea plants in a Nigerian farm.'
      - 'Remember: the caterpillar chews, the butterfly sips.'
      - 'The trap is the mosquito. It is harmful as an adult, when the female sucks blood and spreads malaria, but its larvae in the water do no damage.'
    hint: 'Which young insect eats leaves before it turns into a pupa?'
    why:
      B: 'Mosquito larvae feed on tiny particles in water; it is the adult female that bites and spreads disease.'
      C: 'Bee larvae are fed in the hive and are useful, not destructive.'
      D: 'The millipede has no caterpillar-like larva; its young look like small adults and feed the same way, mainly on decaying plant matter.'

  9:
    answer: A
    steps:
      - 'This is radial symmetry.'
      - 'In a radially symmetrical animal, the body parts are arranged round a central axis like the spokes of a wheel. Any cut through that axis, in any direction, gives two matching halves.'
      - 'Hydra and the starfish are radially symmetrical; they meet food from every side.'
      - 'Remember: "radial" like the radius of a circle, any direction works.'
      - 'The trap is bilateral symmetry. A goat or a human can be cut into matching halves only in one plane, down the middle from head to tail.'
    hint: 'How many planes give matching halves for a goat? And for a starfish?'
    why:
      B: 'Bilateral symmetry allows only one plane of cut that gives two identical halves.'
      C: 'An asymmetrical body, like Amoeba, has no plane that gives identical halves.'
      D: 'Symmetrical is too general; it does not say that every plane through the axis works.'

  10:
    answer: B
    steps:
      - 'Mammary glands are the milk glands of mammals.'
      - 'Mammals feed their young on milk. They also have hair and give birth to live young.'
      - 'The whale lives in the sea, but it is a mammal: it breathes air with lungs and suckles its calf. A goat or a cow feeding its kid or calf is the same idea.'
      - 'Remember: "mammal" comes from "mamma", the breast.'
      - 'The trap is the dogfish and the shark, which also live in the sea and are large. They are cartilaginous fishes with gills and have no mammary glands.'
    hint: 'Which of these breathes air and suckles its young?'
    why:
      A: 'The dogfish is a cartilaginous fish with gills and no milk glands.'
      C: 'The shark is a cartilaginous fish; it does not feed its young on milk.'
      D: 'The catfish is a bony fish with no mammary glands.'

  11:
    answer: D
    steps:
      - 'Scales link birds to reptiles.'
      - 'Birds evolved from reptile ancestors. They still have horny scales on their legs and feet, like the scales of a lizard or a snake. They also lay shelled eggs, as reptiles do.'
      - 'Look at the legs of a chicken in a Nigerian market: they are covered in scales just like an agama lizard''s skin.'
      - 'Remember: "the bird keeps its reptile socks on", scaly legs.'
      - 'The trap is feathers. Feathers are what make a bird different from a reptile, so they cannot be the link.'
    hint: 'Look at the legs of a fowl. What covers them?'
    why:
      A: 'Feathers are found only in birds, so they separate birds from reptiles.'
      B: 'The beak is a mark of birds; most reptiles have jaws with teeth, so the beak is not the link.'
      C: 'A skeleton is shared by all vertebrates, so it does not link birds to reptiles in particular.'

  12:
    answer: B
    steps:
      - 'Countershading is a kind of camouflage.'
      - 'The animal is dark on its back and pale on its belly. Sunlight from above lights the back and shades the belly, so the two shades cancel out and the body looks flat and hard to see.'
      - 'Many fish in the Lagos lagoon are dark above and silvery below. A bird looking down sees dark water; a fish looking up sees bright sky.'
      - 'Remember: dark top, light bottom, hidden from both.'
      - 'The trap is "warn enemies". That is warning colouration, bright colours that say "I am poisonous", which is the opposite of hiding.'
    hint: 'Is countershading about being seen or about not being seen?'
    why:
      A: 'Colouring does not help an animal fight; countershading helps it avoid being found.'
      C: 'Warning colouration uses bright colours to be noticed; countershading hides the animal.'
      D: 'Bright display colours attract mates; countershading makes the animal hard to see.'

  13:
    answer: C
    steps:
      - 'The cuticle is a waxy, waterproof layer on the epidermis.'
      - 'It cuts down water loss from the parts of the plant in the air: the leaves, stems and the whole shoot.'
      - 'The root grows in damp soil and must take in water. Its epidermis has thin walls and root hairs, with no cuticle, so water can pass in freely.'
      - 'Remember: the cuticle keeps water in above ground; the root must let water in below ground.'
      - 'The trap is the stem. A young stem is green and soft, but it is in the air and does have a cuticle.'
    hint: 'Which part must absorb water, so a waterproof coat would block it?'
    why:
      A: 'The leaf has a thick cuticle to cut down water loss by evaporation.'
      B: 'The young stem is covered by a cuticle on its epidermis.'
      D: 'The shoot is the leaves and stem together, which both have a cuticle.'

  14:
    answer: A
    steps:
      - 'The urethra is the tube that runs from the bladder through the penis to the outside.'
      - 'In the male, urine from the bladder and semen from the testes and glands both leave the body through the urethra, at different times.'
      - 'A ring of muscle closes the bladder during ejaculation, so urine and semen do not mix.'
      - 'Remember: urethra is the exit, ureter is the entry (from kidney to bladder).'
      - 'The trap is the ureter, which sounds alike. The ureters carry urine from the kidneys to the bladder and carry no semen.'
    hint: 'Which tube carries fluid out of the body, and which carries urine into the bladder?'
    why:
      B: 'The ureter carries urine from a kidney to the bladder only.'
      C: 'The bladder stores urine; semen does not pass through it.'
      D: 'The seminal vesicle adds fluid to semen; urine does not pass through it.'

  15:
    answer: A
    steps:
      - 'Plants need mineral elements in two amounts: macronutrients in large amounts and micronutrients (trace elements) in minute amounts.'
      - 'Macronutrients include nitrogen, phosphorus, potassium, calcium, magnesium and sulphur. Micronutrients include copper, zinc, manganese, boron, molybdenum and iron.'
      - 'Copper is needed only in tiny amounts, for some enzymes. Farmers in Nigeria buy NPK fertiliser because N, P and K are needed in large amounts.'
      - 'Remember: NPK is the big bag; copper is a pinch.'
      - 'The trap is phosphorus, which is very important for roots, but it is a macronutrient needed in large amounts.'
    hint: 'Which of these is not in NPK fertiliser and is needed only as a trace?'
    why:
      B: 'Potassium is the K of NPK, a macronutrient needed in large amounts.'
      C: 'Phosphorus is the P of NPK, needed in large amounts.'
      D: 'Sodium is not counted among the elements green plants need for growth; most plants grow without it.'

  16:
    answer: B
    steps:
      - 'Loranthus (the mistletoe) is a partial parasite.'
      - 'It grows on the branches of trees and sends suckers (haustoria) into the host''s xylem to take water and mineral salts. But its leaves are green, so it makes its own food by photosynthesis. It is parasitic and autotrophic at once.'
      - 'Loranthus is often seen as a bushy green clump on the branches of orange, kola and shea trees.'
      - 'Remember: Loranthus "borrows water but cooks its own food".'
      - 'The trap is the sundew. It is green and also catches insects, but it is insectivorous, not parasitic: it lives on its own in the soil and traps insects only for extra nitrogen.'
    hint: 'Which green plant grows on another plant and takes water from it?'
    why:
      A: 'The sundew is not a parasite; it is a green insectivorous plant that traps insects for nitrogen.'
      C: 'Rhizopus is a saprophytic fungus with no chlorophyll, so it is not autotrophic.'
      D: 'The tapeworm is a parasite but cannot make its own food, so it is heterotrophic.'

  17:
    answer: C
    steps:
      - 'The stomach wall secretes hydrochloric acid with the gastric juice.'
      - 'The acid makes the stomach strongly acidic. This stops the action of ptyalin (salivary amylase), which works only in a near-neutral medium. It also gives pepsin the acid it needs and kills many germs in food.'
      - 'When you swallow a mouthful of eba, ptyalin keeps breaking down starch until the acid in the stomach reaches it and stops it.'
      - 'Remember: saliva is the starter, stomach acid is the stopper.'
      - 'The trap is B. Milk protein is coagulated by the enzyme rennin, and fats are emulsified by bile in the duodenum, not by the acid.'
    hint: 'Ptyalin from the mouth works best in a neutral medium. What happens when it meets acid?'
    why:
      A: 'Bile is not in the stomach; it is released into the duodenum, and it is alkaline.'
      B: 'Rennin coagulates milk protein and bile emulsifies fats; the acid does neither.'
      D: 'Food is broken into smaller particles by chewing and the churning of the stomach muscles, not by the acid.'

  18:
    answer: D
    steps:
      - 'A polysaccharide is a large carbohydrate made of many sugar units joined together.'
      - 'Monosaccharides are single units, such as glucose. Disaccharides are two units, such as sucrose and maltose. Polysaccharides are long chains, such as starch, glycogen and cellulose.'
      - 'Cellulose is a chain of thousands of glucose units. It forms plant cell walls, the fibre in vegetables like ugu and okro.'
      - 'Remember: mono is one, di is two, poly is many.'
      - 'The trap is maltose, which comes from starch digestion. But maltose is only two glucose units, a disaccharide.'
    hint: 'Count the sugar units. Which one is a long chain?'
    why:
      A: 'Glucose is a single sugar unit, a monosaccharide.'
      B: 'Sucrose is glucose plus fructose, a disaccharide.'
      C: 'Maltose is two glucose units, a disaccharide.'

  19:
    answer: D
    steps:
      - 'The xylem carries water and mineral salts up from the roots, so it is the arrow IV, which runs up the stem from the roots.'
      - 'Roots absorb water and salts from the soil. The xylem vessels carry them up the stem to the leaves, pulled mainly by transpiration from the leaves.'
      - 'Arrow I, in the other channel, points down: that is the phloem carrying food made in the leaves down to the roots and to other parts.'
      - 'In a cassava plant, water rises from the roots to the leaves in the xylem, while starch made in the leaves moves down in the phloem to be stored in the tubers.'
      - 'Remember: xylem goes up like a borehole pump; phloem carries food down and around.'
      - 'The trap is I. It is also a channel in the stem, but its arrows point down, from the leaves towards the roots, so it is the phloem.'
    hint: 'Water comes in at the roots. Which arrow runs up from them?'
    why:
      A: 'Arrow I points down the stem, from the leaves to the roots; that is translocation of food in the phloem.'
      B: 'Arrow II leaves the leaf for the air; that is a gas given out through the stomata, not xylem transport.'
      C: 'Arrow III enters the leaf from the air; that is a gas, such as carbon(IV) oxide, going in through the stomata.'

  20:
    answer: A
    steps:
      - 'Arrow II comes out of the leaf into the air, so it shows a gas leaving the leaf. In photosynthesis that gas is oxygen.'
      - '$\ce{6CO2 + 6H2O ->[light][chlorophyll] C6H12O6 + 6O2}$. The oxygen made is more than the leaf uses, so it diffuses out through the stomata.'
      - 'Water plants in a sunny pond give off bubbles of oxygen from their leaves.'
      - 'Remember: in daylight, carbon(IV) oxide in (arrow III), oxygen out (arrow II).'
      - 'The trap is B. Carbon(IV) oxide is a gas too, but in daylight it moves into the leaf, which is arrow III, not out of it.'
    hint: 'Arrow II points out of the leaf. Which product of photosynthesis is a gas?'
    why:
      B: 'Carbon(IV) oxide goes into the leaf, as arrow III shows; arrow II comes out.'
      C: 'Photosynthates (sugars) move inside the plant in the phloem, like arrow I; they do not leave the leaf into the air.'
      D: 'Nutrients (mineral salts) move up in the xylem, like arrow IV, not out of the leaf into the air.'

  21:
    answer: B
    steps:
      - 'Ultrafiltration happens in the Bowman''s capsule, with the glomerulus it holds.'
      - 'The glomerulus is a knot of capillaries. Its outgoing vessel is narrower than the incoming one, so blood pressure is high. This forces water, glucose, salts and urea out through the thin walls into the cup of the Bowman''s capsule. Blood cells and proteins are too big and stay behind.'
      - 'It is like pressing palm oil through a sieve: the liquid passes, the fibre stays.'
      - 'Remember: B for Bowman, B for blood is filtered.'
      - 'The trap is the loop of Henle, which is in the nephron too, but its job is to reabsorb water and salts, not to filter blood.'
    hint: 'Where in the nephron does blood under high pressure meet a thin-walled cup?'
    why:
      A: 'The uriniferous tubule is the whole nephron; filtration happens only in one part of it.'
      C: 'The loop of Henle reabsorbs water and salts; it does not filter blood.'
      D: 'The renal tubule reabsorbs useful substances from the filtrate after filtration.'

  22:
    answer: C
    steps:
      - 'Secondary thickening is made by two meristems working together.'
      - 'The vascular cambium divides to add new xylem inside and new phloem outside, so the stem grows thicker. The cork cambium (phellogen) near the outside makes cork, a new protective bark for the wider stem.'
      - 'The thick, rough bark of a mango tree is cork from the cork cambium; the wood inside is xylem from the vascular cambium.'
      - 'Remember: two cambia, wood inside and bark outside.'
      - 'The trap is B. The vascular cambium does most of the thickening, but without the cork cambium the stem would split and have no bark.'
    hint: 'What makes the new wood, and what makes the new bark?'
    why:
      A: 'Collenchyma and xylem are permanent tissues, not cambia; the new xylem, phloem and cork all come from the two cambia.'
      B: 'The vascular cambium alone gives new xylem and phloem but no new cork; both cambia are needed.'
      D: 'Sclerenchyma is a dead supporting tissue that cannot divide; only the cork cambium of this pair is a meristem.'

  23:
    answer: C
    steps:
      - 'A fruit from a single carpel is a monocarpellary fruit.'
      - 'The legume pod comes from one carpel. It has one chamber, and its seeds sit in a row along one edge, the line where the carpel''s edges joined.'
      - 'Open a bean or groundnut pod: one chamber, one row of seeds.'
      - 'Remember: one pod, one carpel.'
      - 'The trap is tomato, which has many seeds. But a tomato cut across shows two or more chambers, so it came from two or more carpels.'
    hint: 'Which fruit is a pod with one chamber?'
    why:
      A: 'Okro has several chambers in a ring, from several fused carpels.'
      B: 'A tomato has two or more chambers, from fused carpels.'
      D: 'An orange has many segments, each from one carpel, so it comes from many carpels.'

  26:
    answer: A
    steps:
      - 'Gibberellins are plant hormones that make stems grow longer.'
      - 'They cause cells in the stem to divide and lengthen, so internodes grow longer. Farmers can spray gibberellin to make plants taller, to break the dormancy of seeds or to make fruits bigger.'
      - 'Gibberellin was first found in a fungus that made rice plants grow very tall and thin.'
      - 'Remember: "Gibberellin makes Giants".'
      - 'The trap is kinin. Kinins (cytokinins) do promote growth, but by cell division, as in tissue culture and leaf growth, not by lengthening the stem.'
    hint: 'Which hormone was first noticed because it made rice plants grow too tall?'
    why:
      B: 'Kinins promote cell division, mainly in roots, buds and tissue culture; they are not the stem-lengthening hormone.'
      C: 'Abscisic acid slows growth and causes dormancy and leaf fall.'
      D: 'Ethylene ripens fruit and slows stem lengthening.'

  27:
    answer: B
    steps:
      - 'The autonomic nervous system controls the involuntary actions of the body.'
      - 'It works without our thinking. Its sympathetic part speeds organs up, and its parasympathetic part slows them down. It controls the heart beat, breathing rate, digestion, sweating and the size of the pupil.'
      - 'When a dog chases you at night, your heart beats faster without your choosing; that is the autonomic system.'
      - 'Remember: autonomic is "automatic".'
      - 'The trap is the tongue. Its taste is sensed by nerves, but moving the tongue to speak or chew is voluntary.'
    hint: 'Which of these works without your choosing it?'
    why:
      A: 'Voluntary muscles are controlled by the somatic (voluntary) nervous system.'
      C: 'The tongue''s movements are voluntary, under conscious control.'
      D: 'Moving the hands is voluntary; we decide to do it.'

  28:
    answer: D
    steps:
      - 'Temperate plants need a cool climate.'
      - 'Temperature falls as height above sea level rises, about 6 °C for every 1000 m. So highland areas in the tropics have a cool, temperate-like climate where crops such as Irish potato, cabbage, carrot, strawberry and tea grow well.'
      - 'The Jos Plateau, the Mambilla Plateau and the Obudu Plateau in Nigeria carry montane forest and grassland, and they grow Irish potatoes and tea.'
      - 'Remember: go up the mountain to find the cold.'
      - 'The trap is the Guinea savanna, the zone around Jos on the map. But Jos grows temperate crops because of its height, the montane climate, not because it is savanna. Lowland Guinea savanna is hot.'
    hint: 'What happens to temperature as you climb a plateau?'
    why:
      A: 'The rain forest is hot and humid all year, too warm for temperate crops.'
      B: 'Lowland Guinea savanna is hot; only its high plateaux, which are montane, are cool enough.'
      C: 'The Sudan savanna is hot and dry, with a long dry season.'

  29:
    answer: B
    steps:
      - 'The water cycle is the continuous movement of water between the earth and the air.'
      - 'Heat from the sun evaporates water from seas, rivers, soil and leaves (transpiration). The water vapour rises, cools and condenses into clouds, and falls as rain. Rain runs back into rivers and the sea, and the cycle repeats.'
      - 'In the rainy season, water evaporating from the Atlantic Ocean condenses into the clouds that bring rain to southern Nigeria.'
      - 'Remember: up by evaporation, down by condensation and rain. A cycle needs both.'
      - 'The trap is A. Evaporation alone only takes water up; without condensation there would be no rain to bring it back.'
    hint: 'A cycle has a way up and a way down. Which option has both?'
    why:
      A: 'Evaporation alone takes water up; without condensation it never returns as rain.'
      C: 'Condensation alone cannot happen without evaporation first putting vapour in the air.'
      D: 'Transpiration adds some vapour and respiration very little; most water moves by evaporation from seas and condensation.'

  30:
    answer: C
    steps:
      - 'An estuary is where a river meets the sea.'
      - 'Fresh water from the river mixes with salt water from the sea. With every tide, and between the rainy and dry seasons, the salt level rises and falls. Estuarine organisms must tolerate these wide changes in salinity.'
      - 'The Lagos lagoon is brackish: its salinity falls in the rainy season when rivers pour in fresh water, and rises in the dry season.'
      - 'Remember: estuary means "mixed water", so salinity keeps changing.'
      - 'The trap is A. Water warms and cools slowly, so the temperature of an estuary changes far less than its salinity.'
    hint: 'What changes most when the tide brings sea water into a river mouth?'
    why:
      A: 'The temperature of a large body of water stays fairly steady; it is salinity that swings.'
      B: 'Estuarine water is not always low in salt; at high tide it can be almost as salty as the sea.'
      D: 'Estuarine animals have many diets, including other animals, not only phytoplankton and detritus.'

  31:
    answer: B
    steps:
      - 'These are the adaptations of mangrove plants in salt-water swamps.'
      - 'Stilt (prop) roots hold the plant up in soft mud. Pneumatophores are breathing roots that grow up out of the airless mud to take in oxygen. Sunken stomata and salt glands help the plant save water and get rid of extra salt.'
      - 'The red mangrove swamps of the Niger Delta and the Lagos coast have roots that stand up out of the mud like pencils.'
      - 'Remember: mud needs props, no air needs snorkels, salt needs glands.'
      - 'The trap is the tropical rainforest, which is also wet and has buttress roots. But its soil is not salty and not waterlogged with tidal mud.'
    hint: 'Where would a plant need both breathing roots and salt glands?'
    why:
      A: 'The rainforest has fresh water and well-drained soil; its trees have buttress roots, not pneumatophores or salt glands.'
      C: 'Grassland plants are adapted to drought and fire, not to salty, airless mud.'
      D: 'Montane forest is cool highland forest with no salt or tidal mud.'

  32:
    answer: B
    steps:
      - 'Desert animals are adapted to live with little or no drinking water.'
      - 'They get water from their food and from metabolic water, the water made when food is broken down in respiration. They also save water by producing very concentrated urine and dry faeces and by staying in burrows in the heat of the day.'
      - 'The kangaroo rat of desert lands may never drink in its whole life; the camel in the far north of Nigeria can go many days without water.'
      - 'Remember: respiration makes water ($\ce{C6H12O6 + 6O2 -> 6CO2 + 6H2O}$), and desert animals rely on it.'
      - 'The trap is the forest dwellers. Forests are humid with plenty of water, so their animals have no need to live on metabolic water alone.'
    hint: 'Where is drinking water hardest to find?'
    why:
