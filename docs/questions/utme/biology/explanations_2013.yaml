    answer: A
    steps:
      - 'Trypanosoma causes sleeping sickness (trypanosomiasis).'
      - 'It is a flagellate protozoan carried by the tsetse fly. When the fly bites, the parasites enter the blood and later the brain, causing fever, swollen glands, then deep drowsiness.'
      - 'The tsetse fly lives in the savanna and river valleys, and it also causes nagana in cattle, which limits cattle rearing in parts of Nigeria.'
      - 'To remember: tsetse, trypanosome, tired.'
      - 'The trap is D, malaria. It is also a protozoan disease, but it is caused by Plasmodium and spread by the Anopheles mosquito.'
