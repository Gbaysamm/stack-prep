      - 'The chameleon you see on a hedge or tree in the bush changes shade to match leaves or bark, which hides it from predators. This is adaptive colouration.'
      - 'To remember: the pigment is melanin; the chromatophore is only its container.'
      - 'The trap is D. Chromatophores are the cells that carry out the change, but the question asks for the pigment.'
