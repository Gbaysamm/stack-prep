    answer: A
    steps:
      - 'The clumping together of red blood cells is agglutination.'
      - 'If blood of the wrong group is given, antibodies in the receiver''s plasma bind to antigens on the donor''s red cells and stick them together in clumps. The clumps can block small vessels and may kill.'
      - 'Before a transfusion at a hospital, the laboratory cross-matches the blood to make sure no agglutination happens.'
      - 'To remember: agglutination, like glue, sticks cells together.'
      - 'The trap is C, transfusion. That is the giving of blood, which can cause clumping if the groups do not match.'
    hint: 'Which word contains the idea of glue?'
    why:
      B: 'Fusion means joining into one, as of gametes, not clumping of red cells.'
      C: 'Transfusion is the giving of blood from one person to another.'
      D: 'Compatibility means bloods can mix without clumping, the opposite.'

  46:
    answer: D
    steps:
      - 'Aestivation is a state of dormancy that some animals enter to survive hot, very dry conditions.'
      - 'The animal becomes inactive, its heartbeat and breathing slow down and its metabolism drops, so it uses little food and loses little water until the rains return.'
      - 'The African lungfish burrows into the mud of a drying pond in the north, makes a mucus cocoon and aestivates for months. Land snails seal their shells in the dry season too.'
      - 'To remember: aestivation is for the summer heat (aestas is Latin for summer), hibernation for the winter cold.'
      - 'The trap is C, hibernation. It is the same kind of sleep, but to survive the cold, not drought.'
    hint: 'One kind of deep rest is for the cold, the other for the heat and dry season.'
    why:
      A: 'Rejuvenation means renewing youth or vigour; it is not a dry-season survival state.'
      B: 'Xeromorphism means the structural features of plants of dry places.'
      C: 'Hibernation is dormancy during a cold winter, not dry conditions.'

