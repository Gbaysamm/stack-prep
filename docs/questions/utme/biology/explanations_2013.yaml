    answer: D
    steps:
      - 'Universal recipients have blood group AB.'
      - 'A person can receive blood if their plasma has no antibodies against the donor''s red cell antigens. Group AB has both A and B antigens, so its plasma has neither anti-A nor anti-B. No donor''s cells are clumped.'
      - 'Group O is the opposite, the universal donor: its cells carry no A or B antigen, so anyone can receive them.'
      - 'To remember: AB accepts all, O offers to all.'
      - 'The trap is C, O. O is the universal donor, not recipient.'
    hint: 'Which group''s plasma has no anti-A and no anti-B?'
    why:
      A: 'Group B plasma has anti-A, so it would clump A and AB cells.'
      B: 'Group A plasma has anti-B, so it would clump B and AB cells.'
      C: 'Group O plasma has both anti-A and anti-B; O is the universal donor.'

