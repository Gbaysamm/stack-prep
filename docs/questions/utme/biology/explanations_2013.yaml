    why:
      B: 'River blindness is caused by the worm Onchocerca, spread by the blackfly Simulium.'
      C: 'Yellow fever is caused by a virus spread by the Aedes mosquito.'
      D: 'Malaria is caused by Plasmodium, spread by the female Anopheles mosquito.'

