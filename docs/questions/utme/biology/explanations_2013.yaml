      - 'The laterite soil of a farm, the rocks of the Olumo Rock at Abeokuta and the sand of a beach are all part of the lithosphere.'
      - 'To remember: litho means stone, as in a lithograph printed from stone.'
      - 'The trap is C, biosphere. It is the living layer, made of parts of all three spheres.'
