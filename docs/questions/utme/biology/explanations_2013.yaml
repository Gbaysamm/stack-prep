format_version: 1
exam_year: 2013
subject: BIO
explanations:
  2:
    answer: B
    steps:
      - 'The process is catabolism: big, complex molecules are broken down into small, simple ones, and energy is usually set free.'
      - 'Metabolism is all the chemical reactions in a living thing. It has two halves. Anabolism builds up (amino acids into proteins), and catabolism breaks down (glucose into carbon dioxide and water in respiration).'
      - 'When you eat garri, the starch is broken down into glucose and the glucose is respired. Both are catabolism.'
      - 'To remember: cata means down, like a cataract of water falling down; ana means up.'
      - 'The trap is C, metabolism. It covers breaking down and building up together, so it is too wide an answer.'
    hint: 'Metabolism has a building-up half and a breaking-down half. Which name goes with breaking down?'
    why:
      A: 'Anabolism is the building up of complex substances from simple ones, the opposite.'
      C: 'Metabolism is all the reactions together, building up as well as breaking down.'
      D: 'A tropism is a growth movement of a plant towards or away from a stimulus.'

  3:
    answer: D
    steps:
      - 'The light-sensitive structure in Euglena is the eyespot (stigma), a small red-orange spot near the base of the flagellum.'
      - 'The eyespot shades a light-sensitive swelling at the base of the flagellum. As Euglena turns, the shading changes, so the cell can tell where the light is and swim towards it.'
      - 'This matters because Euglena has chloroplasts and needs light to photosynthesise. In a sunny pond or a puddle by a Lagos roadside, the water turns green as Euglena gathers near the surface.'
      - 'To remember: the eyespot is the "eye" of Euglena, so it senses light.'
      - 'The trap is C, the chloroplast. It uses light to make food but it is not the part that senses where the light is.'
    hint: 'Which part of Euglena is named after the organ we see with?'
    why:
      A: 'The gullet is the opening at the front through which the flagellum comes out; it does not sense light.'
      B: 'The flagellum moves the cell towards the light, but it is not the part that detects it.'
      C: 'The chloroplast traps light energy for photosynthesis but does not tell the cell where the light is.'

  4:
    answer: D
    steps:
      - 'Respiration happens in the mitochondria, and photosynthesis happens in the chloroplasts.'
      - 'Mitochondria break down glucose with oxygen and store the energy as ATP. Chloroplasts hold chlorophyll, which traps sunlight to make glucose from carbon dioxide and water.'
      - 'A green leaf cell of a cassava plant does both, so it is packed with chloroplasts and also has many mitochondria.'
      - 'To remember: mitochondria are the power house, chloroplasts are the kitchen.'
      - 'The trap is B. Golgi apparatus and endoplasmic reticulum are busy organelles, but they package and carry substances; they do not respire or photosynthesise.'
    hint: 'Name the organelle for each process separately, then look for the pair.'
    why:
      A: 'Lysosomes digest worn-out parts and ribosomes make proteins; neither respires nor photosynthesises.'
      B: 'The Golgi apparatus and endoplasmic reticulum make, package and transport substances.'
      C: 'The nucleus controls the cell and centrioles help in cell division; plant cells usually lack centrioles.'

  5:
    answer: D
    steps:
      - 'Taenia solium is the pork tapeworm. Its adult lives in the human intestine, and its larval stage (the bladder worm or cysticercus) lives in the muscles of the pig.'
      - 'A pig eats food or water soiled by human faeces that carry tapeworm eggs. The larvae settle in its muscle. A person who eats undercooked pork swallows the larvae, which grow into adult worms in the gut.'
      - 'This is why pork from a roadside suya spot must be cooked well through, and why latrines should keep human faeces away from pigs.'
      - 'To remember: S for solium and swine. Its cousin Taenia saginata is the beef tapeworm, whose larva lives in the cow.'
      - 'The trap is A, cow. The cow carries Taenia saginata, a different species.'
    hint: 'What is the common name of Taenia solium?'
    why:
      A: 'The cow is the host of the beef tapeworm, Taenia saginata, not Taenia solium.'
      B: 'The goat is not a host of Taenia solium. Its bladder worm lives in the muscle of the pig, and people catch the adult worm by eating undercooked pork.'
      C: 'The dog carries other tapeworms, such as Echinococcus and Dipylidium, not Taenia solium.'

  6:
    answer: C
    steps:
      - 'The drawing is an earthworm, head to the right and tail (I) to the left. II points to the smooth, swollen band of glandular segments nearer the head end. That band is the clitellum, found only on a mature worm.'
      - 'Its gland cells make mucus that holds two worms together while they swap sperm, and later make the cocoon, the tough band that slips forward off the head with the eggs inside.'
      - 'After rain on a farm in the south, you will see adult earthworms with a pale, smooth "saddle" on the body. That saddle is the clitellum, and only mature worms have it.'
      - 'To remember: the clitellum is the earthworm''s saddle, and it makes the cocoon.'
      - 'The trap is B, cocoon. The cocoon is what the clitellum makes, not the band itself.'
    hint: 'II points to the smooth, swollen band on the earthworm, nearer its head. What is that saddle-like band called?'
    why:
      A: 'Spermathecal pores are tiny openings in the grooves between segments in front of the band, where sperm from another worm is received.'
      B: 'The cocoon is the egg case that the clitellum secretes, not the band itself.'
      D: 'Chaetae are tiny bristles on each segment that grip the soil.'

  7:
    answer: B
    steps:
      - 'The organism in the drawing is an earthworm: a long, ringed body with a swollen band (the clitellum, II). Earthworms live in soils rich in humus, the dark, decayed remains of dead plants and animals.'
      - 'An earthworm swallows soil and digests the organic matter in it. Humus soil is also moist and well aerated, so the worm can breathe through its damp skin.'
      - 'Turn over the soil under a mango tree or in a garden heap of rotting leaves and you will find many earthworms. In dry sand or hard clay you find almost none.'
      - 'To remember: worms want food, and humus is the food in the soil.'
      - 'The trap is C, clay. Clay holds water but is heavy, poorly aerated and poor in decaying matter for the worm to eat.'
    hint: 'The drawing is an earthworm. What does it feed on as it swallows soil?'
    why:
      A: 'Waterlogged mud has little air, and an earthworm in it cannot breathe well through its skin.'
      C: 'Clay is compact and poorly aerated, with little organic matter for the worm to eat.'
      D: 'Sand dries out fast and has little humus, so the worm would dry up and starve.'

  8:
    answer: D
    steps:
      - 'Arthropods have a hard exoskeleton (cuticle) made of chitin covering the body.'
      - 'The other main features are a body divided into segments and many pairs of jointed appendages: legs, antennae and mouthparts. The exoskeleton supports and protects the body and stops it drying out.'
      - 'The exoskeleton cannot stretch, so to grow the animal must moult. The cockroach in your kitchen, the crab in the Lagos lagoon and the spider in the corner are all arthropods with chitin coats.'
      - 'To remember: arthro means joint and pod means foot, jointed feet in a chitin suit.'
      - 'The trap is B. Arthropods have jointed appendages, but many pairs of them, not only one.'
    hint: 'What is the hard outer coat of a cockroach made of?'
    why:
      A: 'The rigid exoskeleton limits growth, so arthropods must moult to grow; growth is not free.'
      B: 'Arthropods have many pairs of jointed appendages, often one pair on each of several segments.'
      C: 'Arthropod bodies are clearly segmented, often grouped into head, thorax and abdomen.'

  9:
    answer: D
    steps:
      - 'A moth has a stout, fat, hairy abdomen, while a butterfly has a slim, slender abdomen. This is a true difference between them.'
      - 'Other differences: a butterfly rests with its wings held upright over its back, a moth rests with its wings spread flat; butterflies fly by day, most moths by night; butterflies have club-tipped antennae, moths have feathery or thread-like ones.'
      - 'The moth that flies round the security light at night is fat-bodied and folds its wings flat. The butterfly on the hibiscus flower in the afternoon is slender and holds its wings together upright.'
      - 'To remember: Butterfly, Bright day, Body slim, wings Back to back. Moth, Midnight, More body.'
      - 'The trap is A. It has the resting positions the wrong way round.'
    hint: 'Picture a moth at the light at night and a butterfly on a flower. Which one looks chunkier?'
    why:
      A: 'This is reversed. A butterfly rests with its wings upright over its back; a moth rests with them flat.'
      B: 'This is not a difference at all, and it is not true either: butterflies fly by day, but most moths are active at night.'
      C: 'Their antennae differ: clubbed in butterflies, feathery or thread-like in moths.'

  10:
    answer: A
    steps:
      - 'The feathers used for flight are the quill feathers, the long, stiff feathers of the wings (remiges) and tail (rectrices).'
      - 'Each has a strong shaft and a firm vane of barbs hooked together, so it pushes against the air. Wing quills give lift and thrust, and tail quills steer and brake.'
      - 'Hold a long wing feather from a fowl or a pigeon: it is stiff and flat. In the past such feathers were cut to make quill pens.'
      - 'To remember: quills fly, coverts cover, down keeps you warm like a duvet.'
      - 'The trap is C, coverts. They lie over the bases of the quills and smooth the wing, but do not do the flying.'
    hint: 'Which feathers are the longest and stiffest on a wing?'
    why:
      B: 'Filoplumes are tiny hair-like feathers that sense the position of other feathers.'
      C: 'Coverts cover the bases of the quills and streamline the body; they do not drive flight.'
      D: 'Down feathers are soft and fluffy and keep the bird warm.'

  11:
    answer: D
    steps:
      - 'Plants of deserts and very dry places are xerophytes.'
      - 'They cut down water loss and store water: thick cuticles, few or sunken stomata, leaves reduced to spines, fleshy stems and deep or wide roots.'
      - 'In the far north of Nigeria, near the Sahara edge, cacti and the date palm grow where little rain falls.'
      - 'To remember: xero means dry, as in a xerox copy made without wet ink.'
      - 'The trap is A, mesophytes. They are the ordinary plants of places with moderate water, like most of our crops.'
    hint: 'xero, hydro, epi, meso: which prefix means dry?'
    why:
      A: 'Mesophytes grow where water is neither scarce nor in excess, like maize and beans.'
      B: 'Hydrophytes grow in or on water, like the water lily.'
      C: 'Epiphytes grow on other plants for support, like orchids on a tree trunk.'

  12:
    answer: C
    steps:
      - 'Of these, Amoeba is the simplest living organism. It is one cell with no fixed shape, no cilia or flagella, and no chloroplasts.'
      - 'It moves and feeds by pushing out pseudopodia (false feet), takes in food by engulfing it, and reproduces by simply splitting into two.'
      - 'Paramecium has cilia, a fixed slipper shape, an oral groove and two kinds of nucleus. Chlamydomonas has flagella, a chloroplast and an eyespot. Both are more complex cells than Amoeba.'
      - 'A virus is not counted as a living organism. It has no cell, cannot feed, respire or grow, and can only reproduce inside a living host cell.'
      - 'To remember: Amoeba is the blob, the plainest cell. The trap is B, virus, which is simpler but not truly living.'
    hint: 'Rule out the one that is not a cell at all, then pick the plainest of the three cells.'
    why:
      A: 'Paramecium has cilia, a fixed shape, a gullet and two nuclei, so it is more complex than Amoeba.'
      B: 'A virus is not a cell and shows life only inside a host cell, so it is not counted as a living organism.'
      D: 'Chlamydomonas has flagella, a chloroplast and an eyespot, so it is more complex than Amoeba.'

  13:
    answer: A
    steps:
      - 'A proboscis is a long, tube-like mouthpart, and it is found mostly in insects.'
      - 'The butterfly coils its proboscis under the head and uncoils it to suck nectar. The housefly uses its spongy proboscis to mop up liquid food, and the mosquito''s piercing proboscis sucks blood.'
      - 'The female Anopheles mosquito pushes its proboscis into the skin to suck blood, and that is how Plasmodium, the malaria parasite, enters the body.'
      - 'To remember: the proboscis is an insect''s drinking straw.'
      - 'The trap is D, molluscs. Some sea snails have a proboscis, but the structure is mostly met in insects.'
    hint: 'Think of how a butterfly drinks nectar.'
    why:
      B: 'Tapeworms have no mouth at all; they absorb digested food through their body surface.'
      C: 'Amphibians such as toads catch food with a sticky tongue, not a proboscis.'
      D: 'A few marine snails have one, but a proboscis is mostly found in insects.'

  14:
    answer: C
    steps:
      - 'A desert plant saves water by having spiny leaves, or leaves reduced to spines.'
      - 'Water evaporates from leaves through the stomata. A spine has a tiny surface and almost no stomata, so very little water is lost; the green stem takes over photosynthesis.'
      - 'The cactus grown as a hedge in northern Nigeria has spines instead of broad leaves, and the spines also keep goats from eating it.'
      - 'To remember: less leaf, less loss.'
      - 'The trap is D, prominent stomata. More open stomata would lose more water, the opposite of what a desert plant needs.'
    hint: 'Which option makes the leaf surface smaller?'
    why:
      A: 'Broad leaves with many stomata lose a lot of water; they suit wet forests.'
      B: 'Spongy mesophyll has many air spaces through which water vapour escapes; it is found in all ordinary leaves.'
      D: 'Prominent stomata would increase water loss; desert plants have few, sunken stomata.'

  15:
    answer: D
    steps:
      - 'Long, sharp, curved claws (talons) on the feet are an adaptation for grasping and holding prey.'
      - 'A bird of prey swoops down, grips the animal with its talons, pierces it and holds it while the hooked beak tears the flesh.'
      - 'The kite that swoops on chicks in a Nigerian compound snatches them with its claws, not its beak.'
      - 'To remember: claws catch, beaks break.'
      - 'The trap is C, tearing flesh. Birds of prey do tear flesh, but with the hooked beak; the claws grasp.'
    hint: 'When a hawk snatches a chick, which part does the holding?'
    why:
      A: 'Seeds are crushed by a short, thick beak, as in the weaver bird, not by the feet.'
      B: 'Mud is scooped by a broad, flat bill, as in the duck.'
      C: 'Tearing is done by the hooked beak; the claws hold the prey still.'

  16:
    answer: A
    steps:
      - 'Anabaena is a blue-green bacterium (cyanobacterium). It has chlorophyll and makes its food by photosynthesis, using energy from the sun.'
      - 'Some organisms make food without light, by chemosynthesis. They take energy from chemical reactions, such as oxidising ammonia, nitrites or hydrogen sulphide.'
      - 'Nitrosomonas turns ammonia into nitrites and Nitrobacter turns nitrites into nitrates in the soil. Colourless sulphur bacteria oxidise hydrogen sulphide. All three are chemosynthetic.'
      - 'Anabaena grows in the water of rice paddies and ponds, where it also fixes nitrogen and so feeds the rice crop.'
      - 'To remember: green bugs use the sun, colourless bugs burn chemicals. The trap is C or D, which are famous from the nitrogen cycle but use chemical energy, not light.'
    hint: 'Which of these is green and has chlorophyll?'
    why:
      B: 'Colourless sulphur bacteria have no chlorophyll; they get energy by oxidising hydrogen sulphide.'
      C: 'Nitrosomonas is chemosynthetic; it gets energy by oxidising ammonia to nitrites.'
      D: 'Nitrobacter is chemosynthetic; it gets energy by oxidising nitrites to nitrates.'

  17:
    answer: B
    steps:
      - 'The movement of dissolved substances, above all manufactured food, from one part of a plant to another is translocation.'
      - 'Sugars made in the leaves travel in the phloem, up or down, to where they are used or stored: growing tips, fruits, roots and tubers. Mineral salts travel up from the roots, mostly in the xylem.'
      - 'The starch you eat in a cassava or yam tuber was made in the leaves and translocated down to the tuber to be stored.'
      - 'To remember: translocation means trans, across, and location, place, so moving substances from place to place.'
      - 'The trap is C, transpiration. That is the loss of water vapour from the leaves, not the moving of food and salts.'
    hint: 'Which word means moving something to another location?'
    why:
      A: 'Osmosis is the movement of water alone across a membrane, from a dilute to a concentrated solution.'
      C: 'Transpiration is the loss of water vapour from the leaves.'
      D: 'Diffusion is the general spreading of particles from high to low concentration, not the name of food transport in a plant.'

  18:
    answer: D
    steps:
      - 'The enzyme in saliva is ptyalin, also called salivary amylase.'
      - 'It works in the slightly alkaline mouth and begins the digestion of cooked starch into maltose.'
      - 'Chew a piece of bread or boiled yam for a while and it starts to taste sweet. That is ptyalin turning starch into sugar.'
      - 'To remember: ptyalin, from the Greek for spit.'
      - 'The trap is C, pepsin. It is a real digestive enzyme but it works on protein in the acid stomach.'
    hint: 'Which enzyme starts on the starch in your food as you chew?'
    why:
      A: 'Rennin is made in the stomach of young mammals and curdles milk.'
      B: 'Lipase digests fats and is made mainly by the pancreas.'
      C: 'Pepsin is made in the stomach and digests proteins in acid.'

  19:
    answer: A
    steps:
      - 'Plants with special devices for trapping and digesting insects are carnivorous (insectivorous) plants.'
      - 'They live in soils poor in nitrogen, such as bogs. They trap insects with sticky hairs, pitchers or snapping leaves, digest them with enzymes and absorb the nitrogen compounds. They still photosynthesise.'
      - 'Examples are the sundew (Drosera), with sticky red hairs, the bladderwort (Utricularia), which floats in ponds, the pitcher plant and the Venus fly trap.'
      - 'To remember: carnivorous means meat-eating, and these plants eat insects.'
      - 'The trap is C, parasitic. A parasite feeds on a living host that it does not trap and digest whole.'
    hint: 'What do we call any living thing that feeds on animals?'
    why:
      B: 'Symbiotic means two organisms living together closely, often both gaining, as in a lichen.'
      C: 'A parasitic plant, like dodder, feeds on a living host without killing and digesting it.'
      D: 'A saprophyte feeds on dead, decaying matter, like a mushroom.'

  20:
    answer: D
    steps:
      - 'Releasing the energy in food (glucose) and storing it in ATP is respiration.'
      - 'In aerobic respiration, glucose is broken down with oxygen in the mitochondria: $\ce{C6H12O6 + 6O2 -> 6CO2 + 6H2O}$ + energy, and the energy is held in ATP.'
      - 'Plants respire all the time, day and night, in every living cell. The sprouting yam in a barn grows using energy released by respiring its stored starch.'
      - 'To remember: photosynthesis makes the fuel, respiration burns it.'
      - 'The trap is B, photosynthesis. It does make ATP, but from light energy, and it stores energy in sugar rather than releasing the energy of fuels.'
    hint: 'Which process breaks down glucose to release its energy?'
    why:
      A: 'Autotropism is a plant organ straightening itself after bending; it has nothing to do with ATP.'
      B: 'Photosynthesis captures light energy to build glucose; it does not release the chemical energy of fuels.'
      C: 'Photolysis is the splitting of water by light during photosynthesis.'

  21:
    answer: B
    steps:
      - 'Fungi are heterotrophs because they lack chlorophyll, so they cannot make their own food.'
      - 'A heterotroph must take in food made by other organisms. Fungi digest dead matter outside their bodies with enzymes and absorb the products (saprophytes), or feed on living hosts (parasites).'
      - 'The mushroom on a rotting log and the black bread mould (Rhizopus) on stale bread are feeding on food that plants made.'
      - 'To remember: no green, no cooking. Hetero means other, troph means feeding.'
      - 'The trap is C, mycelium. It is how a fungus is built, not why it cannot make food.'
    hint: 'What do green plants have that lets them make their own food?'
    why:
      A: 'Being filamentous describes the shape of the body (hyphae), not how it feeds; some green algae are filamentous too.'
      C: 'A mycelium is the mass of hyphae that forms the body; it does not explain heterotrophy.'
      D: 'Lacking roots does not stop food making; algae lack roots yet make their own food.'

  22:
    answer: B
    steps:
      - 'Plasmodium is a parasitic protozoan. It causes malaria.'
      - 'It is carried by the female Anopheles mosquito. When she bites, the parasites enter the blood, grow in the liver and then burst red blood cells, causing the fever and chills.'
      - 'Malaria is one of the biggest killers of children in Nigeria, which is why we sleep under treated mosquito nets and clear stagnant water.'
      - 'To remember: Plasmodium lives in the plasma and blood cells.'
      - 'The trap is C, Euglena. It is a protist, but free-living and green, not a parasite.'
    hint: 'Which of these causes a disease you know well?'
    why:
      A: 'Paramecium is free-living in ponds and feeds on bacteria.'
      C: 'Euglena is free-living and makes its own food with chloroplasts.'
      D: 'Chlamydomonas is a free-living green alga that photosynthesises.'

  23:
    answer: B
    steps:
      - 'Antibodies are made by lymphocytes, white blood cells with a large round nucleus.'
      - 'When a germ enters, lymphocytes recognise its antigens and make antibodies that fit them. The antibodies clump germs, neutralise toxins and mark germs for destruction. Some lymphocytes remember the germ, which is the basis of immunity.'
      - 'A child given the measles vaccine at a Nigerian health centre is immune later because the lymphocytes learned to make antibodies against measles.'
      - 'To remember: lymphocytes make antibodies; phagocytes eat. Phago means eat.'
      - 'The trap is A, phagocytes. They defend the body by engulfing germs, but they make no antibodies.'
    hint: 'Which white cells make the antibodies that a vaccine trains?'
    why:
      A: 'Phagocytes engulf and digest germs; they do not make antibodies.'
      C: 'Erythrocytes are red cells that carry oxygen; they make no antibodies.'
      D: 'Monocytes are phagocytes that become macrophages and engulf germs; they do not make antibodies.'

  24:
    answer: A
    steps:
      - 'The circulatory system is the heart and three kinds of blood vessel: arteries, capillaries and veins.'
      - 'The heart pumps blood into arteries, which carry it away from the heart. Arteries branch into tiny capillaries, where materials pass to and from the cells. Capillaries join into veins, which bring blood back to the heart.'
      - 'When a goat is slaughtered, the thick-walled arteries spurt blood and the thinner veins ooze it; the capillaries are too small to see.'
      - 'To remember: Heart, Arteries, Capillaries, Veins, "Have A Cool Visit", round and back again.'
      - 'The trap is B. The aorta is one artery, so naming it leaves out all the other arteries.'
    hint: 'Name the general kinds of vessel, not single vessels.'
    why:
      B: 'The aorta is just one artery; the system includes all arteries.'
      C: 'It leaves out the capillaries, where exchange with the cells happens, and the aorta is just one artery.'
      D: 'It leaves out the capillaries, and the vena cava is just one vein.'

  25:
    answer: B
    steps:
      - 'Xylem carries water and mineral salts from the roots up to the leaves.'
      - 'Xylem vessels are long, dead, hollow tubes with walls thickened by lignin. Water is pulled up them by the transpiration stream from the leaves.'
      - 'Stand a cut stem of a white flower in water with red ink and the petals turn red. The ink went up in the xylem.'
      - 'To remember: xylem goes up with water, phloem flows with food.'
      - 'The trap is D, phloem. It is the other transport tissue, but it carries manufactured food.'
    hint: 'Which transport tissue is dead and hollow, like a water pipe?'
    why:
      A: 'Cambium is a layer of dividing cells that makes new xylem and phloem; it does not carry water.'
      C: 'The cortex is packing and storage tissue between the epidermis and the vascular tissue.'
      D: 'Phloem carries manufactured food such as sugars, not water and salts.'

  26:
    answer: D
    steps:
      - 'Platelets (thrombocytes) help blood to clot.'
      - 'At a cut, platelets stick to the damaged vessel and release an enzyme, thrombokinase. With calcium ions this turns prothrombin into thrombin, which turns soluble fibrinogen into threads of fibrin. The threads trap blood cells and form a clot.'
      - 'When you cut your finger with a kitchen knife, the bleeding stops after a few minutes because of platelets and fibrin.'
      - 'To remember: platelets plug the leak.'
      - 'The trap is C, plasma. It carries the clotting proteins, but the process is set off by platelets.'
    hint: 'Which small cell fragments gather at a wound?'
    why:
      A: 'Red blood cells carry oxygen; they get trapped in a clot but do not start clotting.'
      B: 'White blood cells fight infection by engulfing germs and making antibodies; they play no part in forming a clot.'
      C: 'Plasma carries fibrinogen, but clotting is started by the platelets.'

  27:
    answer: C
    steps:
      - 'Plasma makes up about 55% of the blood. The cells make up the other 45%.'
      - 'Plasma is a pale yellow liquid, about 90% water, carrying digested food, salts, hormones, urea, carbon dioxide and plasma proteins.'
      - 'Leave blood to stand in a tube at a hospital laboratory and the cells settle at the bottom, with the straw-coloured plasma, a little over half, on top.'
      - 'To remember: plasma is the "more than half" liquid part.'
      - 'The trap is D, erythrocytes. They are the most numerous cells, but all the cells together come to only about 45%.'
    hint: 'Blood is a liquid carrying cells. Which part is the liquid?'
    why:
      A: 'White cells are a tiny fraction of blood volume, well under 1%.'
      B: 'Platelets are tiny fragments and form a very small fraction of the volume.'
      D: 'Red cells make up most of the 45% that is cells, not 55%.'

  28:
    answer: A
    steps:
      - 'The sweat glands are the excretory part of the skin.'
      - 'Each sweat gland is a coiled tube in the dermis. It takes water, salts and a little urea from the blood and passes them out as sweat through a pore.'
      - 'On a hot afternoon in Kano, a farmer''s sweat tastes salty because salts and urea are being removed with it.'
      - 'To remember: sweat out the waste.'
      - 'The trap is C, the sebaceous gland. It also opens on the skin, but it makes oily sebum to keep hair and skin soft, not to remove waste.'
    hint: 'Which part of the skin passes out water, salts and urea?'
    why:
      B: 'The Malpighian layer is the living layer of the epidermis that makes new cells and holds melanin.'
      C: 'Sebaceous glands make oily sebum that waterproofs the skin and hair.'
      D: 'The horny layer is the dead, tough outer layer that protects the skin.'

  29:
    answer: B
    steps:
      - 'Insects excrete their nitrogenous waste as uric acid.'
      - 'The Malpighian tubules take wastes from the blood and pass them into the gut. Uric acid is almost insoluble, so it can be passed out as a dry paste with very little water lost.'
      - 'This lets insects such as locusts and termites live in the dry savanna and even the desert without drying out.'
      - 'To remember: insects save water, so they make solid uric acid.'
      - 'The trap is C, sweat. Only mammals sweat.'
    hint: 'What nitrogen waste can be passed out almost dry?'
    why:
      A: 'Alkaloids such as caffeine and quinine are waste products of plants.'
      C: 'Sweat is made by the sweat glands of mammals; insects do not sweat.'
      D: 'Mucilage is a slimy substance made by plants, as in okra.'

  30:
    answer: A
    steps:
      - 'The skeleton is the main structure that supports and protects the vertebrate body.'
      - 'It gives the body its shape and holds it up, protects soft organs (the skull guards the brain, the ribs the heart and lungs), gives muscles something to pull on, and makes blood cells in the marrow.'
      - 'A cow can stand and walk because its bones bear its weight; its ribs shield its lungs and heart.'
      - 'To remember: the skeleton is the frame of the house.'
      - 'The trap is C, muscle. Muscles move the bones, but they need the skeleton to work.'
    hint: 'Which option is the whole framework, not one part of it?'
    why:
      B: 'A ligament is a tough band that joins bone to bone at a joint.'
      C: 'Muscles cause movement by pulling on the bones; they are soft and need the skeleton as the frame that holds the body up.'
      D: 'A joint is a meeting point of two bones that allows movement.'

  31:
    answer: C
    steps:
      - 'The chitin of a crab''s or crayfish''s exoskeleton is hardened by calcium compounds, mainly calcium carbonate.'
      - 'Calcium carbonate is laid down in the chitin layer. This turns a flexible coat into a hard shell, strong enough to protect the animal in water.'
      - 'Crack the shell of a crab from the Lagos lagoon: it is hard and chalky, quite unlike the bendy wing of a cockroach.'
      - 'To remember: crab shells are like chalk, and chalk is calcium carbonate.'
      - 'The trap is D, organic salts. Calcium carbonate is an inorganic, mineral salt.'
    hint: 'What makes a crab shell chalky?'
    why:
      A: 'Lipids form a thin waxy layer that waterproofs the cuticle; they do not harden it.'
      B: 'Cellulose is the material of plant cell walls; it is not found in the crab''s shell.'
      D: 'Calcium carbonate is an inorganic salt, not an organic one.'

  32:
    answer: C
    steps:
      - 'The transfer of pollen grains from an anther to a stigma is pollination.'
      - 'Pollen is carried by insects, wind, water or birds. If it lands on the stigma of the same flower or plant it is self-pollination; if it lands on another plant of the same kind it is cross-pollination.'
      - 'Bees visiting flowers of pawpaw or orange trees carry pollen on their hairy bodies from flower to flower.'
      - 'To remember: pollination moves the pollen; fertilisation joins the nuclei later.'
      - 'The trap is D, fertilisation. It comes after pollination, when the male nucleus fuses with the egg cell in the ovule.'
    hint: 'Which word is built from the word pollen?'
    why:
      A: 'Propagation is producing new plants, often from cuttings, tubers or seeds.'
      B: 'Placentation is the arrangement of ovules inside the ovary.'
      D: 'Fertilisation is the fusion of a male gamete with an egg cell, after pollination.'

  33:
    answer: B
    steps:
      - 'The male part of a flower is the stamen.'
      - 'Each stamen has a stalk, the filament, holding up an anther. The anther makes pollen grains, which carry the male gametes.'
      - 'Brush the centre of a hibiscus flower and yellow pollen comes off the many stamens on the central column.'
      - 'To remember: STAMEN has "men" in it, so it is male.'
      - 'The trap is A, carpel. It is the female part: stigma, style and ovary.'
    hint: 'Which part makes pollen?'
    why:
      A: 'The carpel (pistil) is the female part, with stigma, style and ovary.'
      C: 'Petals are often coloured to attract insects; they are not reproductive organs.'
      D: 'Sepals protect the flower in bud; they make no pollen or ovules, so they are not reproductive organs.'

  34:
    answer: C
    steps:
      - 'The pituitary gland hangs just below the hypothalamus at the base of the brain.'
      - 'The hypothalamus controls it by nerves and hormones. The pituitary in turn releases hormones that control other glands, such as the thyroid, the adrenal cortex, the ovaries and the testes. That is why it is called the master gland.'
      - 'It is about the size of a groundnut seed but controls growth, milk production and water balance.'
      - 'To remember: the pituitary is the pea under the brain that bosses the other glands.'
      - 'The trap is D, the thyroid. It is controlled by the pituitary, but it sits in the neck.'
    hint: 'Which gland is called the master gland?'
    why:
      A: 'The parathyroids are four tiny glands in the neck, behind the thyroid.'
      B: 'The adrenal glands sit on top of the kidneys.'
      D: 'The thyroid is in the neck, in front of the windpipe.'

  35:
    answer: C
    steps:
      - 'The plant hormone that makes a shoot bend towards light is auxin.'
      - 'Auxin is made in the shoot tip. Light makes it move to the shaded side, where it makes the cells grow longer. The shaded side grows faster, so the shoot curves towards the light. This is positive phototropism.'
      - 'Seedlings of beans on a windowsill all lean towards the window for this reason.'
      - 'To remember: auxin, the growth hormone, made at the tip, gathers in the shade.'
      - 'The trap is D, gibberellin. It also lengthens stems, but it does not cause bending towards light.'
    hint: 'Which hormone gathers on the dark side of a shoot?'
    why:
      A: 'Cytokinins promote cell division and delay ageing of leaves.'
      B: 'Abscisic acid closes stomata and keeps seeds and buds dormant.'
      D: 'Gibberellins lengthen stems and break seed dormancy but do not cause phototropism.'

  36:
    answer: C
    steps:
      - 'Rods are the light-sensitive cells of the retina that respond to dim light.'
      - 'Rods contain the pigment rhodopsin (visual purple), which needs vitamin A to be made. They work in poor light but do not tell colours apart. Cones work in bright light and give colour vision.'
      - 'Walking home at night with no light, you can see shapes but not colours. That is your rods at work.'
      - 'To remember: Rods for dim Rooms, Cones for Colour.'
      - 'The trap is A, cone. Cones are sensory cells too, but they need bright light.'
    hint: 'Which retina cells let you see shapes but not colour at night?'
    why:
      A: 'Cones work in bright light and give colour vision.'
      B: 'The lens focuses light; it is not a sensory cell.'
      D: 'The iris controls how much light enters; it is not a sensory cell.'

  37:
    answer: D
    steps:
      - 'Without anti-diuretic hormone (ADH), dehydration increases.'
      - 'ADH comes from the pituitary when the blood is short of water. It makes the kidney tubules and collecting ducts take water back into the blood. With no ADH, little water is taken back, so a large volume of dilute urine is passed. This is diabetes insipidus.'
      - 'The person passes urine again and again, feels very thirsty and dries out, especially in the harmattan or the hot season.'
      - 'To remember: anti-diuretic means against much urine, so no ADH means much urine and less water in the body.'
      - 'The trap is A or C. Losing the water-saving hormone cannot reduce or remove dehydration; it makes it worse.'
    hint: 'ADH saves water. What happens to the body''s water if it is missing?'
    why:
      A: 'Without ADH more water is lost, so dehydration grows; it does not decrease.'
      B: 'Retention of water is what ADH causes; without it water is lost in urine.'
      C: 'Without ADH dehydration gets worse; it is not eliminated.'

  38:
    answer: A
    steps:
      - 'Oestrogen is made in the ovaries, mainly by the developing follicle.'
      - 'It brings on the female secondary sexual characteristics at puberty and makes the lining of the uterus thicken after each period, ready for a fertilised egg.'
      - 'The changes in a girl''s body around the age of twelve, such as breast growth and the start of periods, are driven by oestrogen from her ovaries.'
      - 'To remember: oestrogen for the ovary, testosterone for the testis.'
      - 'The trap is C, anterior pituitary. It makes FSH, which tells the ovary to make oestrogen, but it does not make oestrogen itself.'
    hint: 'Which female organ makes the female sex hormones?'
    why:
      B: 'The testes make testosterone, the male hormone.'
      C: 'The anterior pituitary makes FSH and LH, which control the ovaries, not oestrogen.'
      D: 'The adrenal cortex makes cortisol and aldosterone, with only small amounts of sex hormones.'

  39:
    answer: C
    steps:
      - 'A cataract is a cloudy area in the lens of the eye.'
      - 'The lens should be clear so light can reach the retina. As it clouds, sight becomes misty and blurred, and in time can be lost. The usual treatment is surgery to replace the cloudy lens with a clear artificial one.'
      - 'Many older people in Nigeria, especially farmers working long years in strong sunlight, develop cataracts and regain their sight at eye camps.'
      - 'To remember: a cataract is like looking through a waterfall, all misty.'
      - 'The trap is B, glaucoma. It is also a serious eye disease, but it is raised pressure in the eyeball, not a cloudy lens.'
    hint: 'Which defect clouds the lens itself?'
    why:
      A: 'Presbyopia is the loss of focusing power with age, as the lens gets stiff.'
      B: 'Glaucoma is high fluid pressure inside the eye that damages the optic nerve.'
      D: 'Astigmatism is blurred sight from an unevenly curved cornea or lens.'

  40:
    answer: D
    steps:
      - 'Sewage is biodegradable: bacteria and fungi can break it down into simple harmless substances.'
      - 'Sewage is mostly organic matter from faeces, urine and kitchen waste. Decomposers feed on it and break it down; in a treatment works this is speeded up.'
      - 'Raw sewage in an open gutter still pollutes, because its decay uses up oxygen and it spreads cholera and typhoid, but in time it is broken down.'
      - 'To remember: bio means life, so biodegradable means living things can break it down.'
      - 'The trap is A, crude oil. Some bacteria act on it very slowly, but spills in the Niger Delta stay for years, so it is treated as non-biodegradable.'
    hint: 'Which pollutant is mostly the remains of living things?'
    why:
      A: 'Crude oil breaks down only very slowly and lingers for years in soil and water.'
      B: 'Heavy metals such as lead and mercury are elements and cannot be broken down at all.'
      C: 'Cellophane here means plastic wrapping film, which decomposers can hardly break down, so it lingers in gutters and soil for years.'

