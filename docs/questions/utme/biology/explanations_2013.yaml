    why:
      B: 'Carotenoids are yellow and orange pigments; they are not the dark pigment that moves to change shade.'
      C: 'Chromatin is the material of chromosomes in the nucleus, not a pigment.'
      D: 'A chromatophore is the pigment-holding cell, not the pigment itself.'

  50:
    answer: A
    steps:
      - 'Social insects show cooperation and division of labour: each member belongs to a caste with its own job.'
      - 'In a termite colony, the queen lays eggs, the king mates with her, workers build, gather food and feed the others, and soldiers with big jaws defend the mound. In a honeybee hive, the queen lays, drones mate and workers do everything else.'
      - 'The tall termite mounds of the Guinea savanna are built by thousands of workers acting together.'
      - 'To remember: social insects are a team, each member with one job.'
      - 'The trap is D, commensalism. That is a link between two different species, where one gains and the other is unharmed.'
    hint: 'How do the termites in one mound share the work?'
    why:
      B: 'Saprophytism is feeding on dead organic matter, a mode of nutrition, not social behaviour.'
      C: 'Parasitism is one organism feeding on a living host of another species.'
      D: 'Commensalism is a link between two species where one gains and the other is unharmed.'
