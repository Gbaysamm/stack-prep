      - 'Antenatal clinics in Nigeria test pregnant women for syphilis so the baby can be protected.'
      - 'To remember: Treponema, pale and twisted, syphilis.'
      - 'The trap is A, gonorrhoea. It is also a sexually transmitted bacterial disease, but its cause is Neisseria gonorrhoeae.'
