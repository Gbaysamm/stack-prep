format_version: 1
exam_year: 2014
subject: BIO
explanations:
  2:
    answer: D
    steps:
      - 'The drawing is Euglena, a one-celled protist of ponds and puddles. Its flagellum comes out of a flask-shaped pocket at the front, the reservoir (I). Part II is the small round bubble just behind the reservoir: the contractile vacuole.'
      - 'Water keeps entering Euglena by osmosis, because its cytoplasm is more concentrated than pond water. The contractile vacuole fills with this extra water and then empties it into the reservoir, so the cell does not burst. This is osmoregulation.'
      - 'Example: a green puddle beside a compound in the rainy season is often full of Euglena, each one pumping water out all day.'
      - 'Remember: contractile means it squeezes. It is the cell''s water pump, and it sits next to the reservoir it empties into.'
      - 'The trap is B, the eyespot. The eyespot is also near the reservoir, but it is the solid dark spot on the other side, not the clear bubble labelled II.'
    hint: 'II is a clear bubble beside the reservoir. Which part keeps a freshwater cell from swelling up with water?'
    why:
      A: 'The nucleus controls the cell and holds its genes. It is not the bubble at II, and it does not pump out water.'
      B: 'The eyespot is the dark spot to the left of the reservoir. It helps the cell find light.'
      C: 'The basal granule is the tiny dot at the root of the flagellum, deep in the reservoir.'

  3:
    answer: A
    steps:
      - 'Photosynthesis happens in chloroplasts, which hold the green pigment chlorophyll. In this Euglena they are the narrow bands arranged like a star in the middle of the cell, labelled III.'
      - 'Chlorophyll traps light, and the cell uses that energy to turn carbon dioxide and water into sugar. Euglena stores the food as paramylum granules, the small grains scattered in the cytoplasm (IV).'
      - 'This is why Euglena makes ponds look green, like the green scum on a stagnant gutter in Lagos.'
      - 'Remember: green part, food factory. In Euglena the food factory is the star.'
      - 'The trap is B. IV marks the paramylum granules, which hold the food made by photosynthesis. They store it; they do not make it.'
    hint: 'Find the part that holds chlorophyll: the star in the middle of the cell.'
    why:
      B: 'IV marks the paramylum granules, which store the food after it is made.'
      C: 'I is the reservoir, the flask-shaped pocket at the base of the flagellum.'
      D: 'II is the contractile vacuole, which pumps out excess water.'

  4:
    answer: B
    steps:
      - 'Living things are built in levels: cell, tissue, organ, system, organism.'
      - 'The cell is the smallest unit that is alive and can carry out life''s processes on its own.'
      - 'Similar cells working together make a tissue, tissues make an organ, and organs make a system.'
      - 'Example: in a goat, muscle cells make muscle tissue, muscle tissue and others make the heart, and the heart and vessels make the circulatory system.'
      - 'Remember the order with "Cats Take Over Small Offices": cell, tissue, organ, system, organism.'
    hint: 'What is the smallest unit that is alive?'
    why:
      A: 'An organ is made of several tissues, so it is a higher level.'
      C: 'A system is a group of organs, a high level.'
      D: 'A tissue is a group of cells, so it sits above the cell.'

  5:
    answer: A
    steps:
      - 'Place each example on the ladder cell, tissue, organ, system.'
      - 'Euglena is a single cell. Hydra, though a whole animal, is built only to the tissue level: two cell layers with no true organs.'
      - 'The heart is an organ: muscle, nerve, connective tissue and blood vessels working together to pump blood.'
      - 'A hair is made of dead, keratin-filled cells, so it is not a working level of organization at all.'
      - 'The organ is the highest level here, so the heart is the most complex. Think of a cow''s heart at the abattoir: you can see several different tissues in one slice.'
      - 'The trap is D. Hydra is a whole organism, so it sounds complex, but its body is at the tissue level.'
    hint: 'Put each one at its level: cell, tissue or organ.'
    why:
      B: 'A hair is a strand of dead keratinised cells, not an organ.'
      C: 'Euglena is one cell, the lowest level.'
      D: 'Hydra is at the tissue level; it has no true organs like a heart.'

  6:
    answer: A
    steps:
      - 'The drawing is the head of a tapeworm, such as Taenia, called the scolex. It lives fixed to the lining of the small intestine of man, pigs and cattle.'
      - 'It holds on in two ways. The crown of curved hooks (II) round the base of the rostellum digs into the gut lining, and four round suckers (III, and the cup in the middle) grip it by suction.'
      - 'The tapeworm must hold on tightly, or the movement of food through the gut by peristalsis would sweep it out.'
      - 'Example: people who eat undercooked pork suya can take in the tapeworm''s larvae, which then hook on inside the gut.'
      - 'Remember: hooks and suckers, the tapeworm''s anchor.'
      - 'The trap is C. I is the rostellum, the knob on top. It only carries the hooks; the hooks themselves are what dig in.'
    hint: 'Which labelled parts dig in, and which suck on?'
    why:
      B: 'III is a sucker, but IV is the young proglottids, which only grow; they do not attach the worm.'
      C: 'II, the hooks, hold on, but I is the rostellum, the knob that carries them.'
      D: 'III, the sucker, holds on, but I is the rostellum, the knob that carries the hooks.'

  7:
    answer: B
    steps:
      - 'A tapeworm''s body is a chain of segments called proglottids. Below the scolex in the drawing comes the neck, which has no segments.'
      - 'New proglottids are budded off from the neck. So the youngest ones are the short, narrow bands at the end of the neck, labelled IV.'
      - 'As they are pushed back they grow and mature, and the oldest ones at the far end are full of eggs and break off in the faeces.'
      - 'This is why eating well-cooked beef and pork and using clean toilets breaks the tapeworm''s life cycle.'
      - 'Remember: young near the head, old at the tail.'
      - 'The trap is A. III is on the scolex, which looks like part of the body, but it is a sucker, not a segment.'
    hint: 'Where are new segments made? Look just below the neck.'
    why:
      A: 'III is a sucker on the scolex, which has no proglottids.'
      C: 'I is the rostellum at the tip of the head, which carries the hooks.'
      D: 'II is the crown of hooks round the rostellum.'

  8:
    answer: B
    steps:
      - 'A multicellular organism is made of many cells.'
      - 'Spirogyra is a green alga made of many cylindrical cells joined end to end in a long filament, each with a spiral chloroplast.'
      - 'Chlamydomonas, Amoeba and Euglena are each a single cell that does everything alone.'
      - 'Example: the slimy green threads floating in a slow stream or a fish pond are often Spirogyra.'
      - 'Remember: Spirogyra, a spiral chloroplast in every cell of a chain.'
    hint: 'Which one is a thread of cells?'
    why:
      A: 'Chlamydomonas is a single cell with two flagella.'
      C: 'Amoeba is a single cell.'
      D: 'Euglena is a single cell.'

  9:
    answer: C
    steps:
      - 'In a moss (a bryophyte) the main green plant you see is the gametophyte, the gamete-making generation.'
      - 'It carries the sex organs: antheridia that make male gametes and archegonia that make the egg.'
      - 'After fertilisation the sporophyte grows out of the gametophyte as a stalk with a capsule, and it makes spores, not gametes.'
      - 'Example: the soft green mosses on a wet wall in the rainy season are gametophytes.'
      - 'Remember: gametophyte makes gametes, sporophyte makes spores.'
      - 'The trap is B. The sporophyte is the capsule on its stalk, which only makes spores.'
    hint: 'Which generation makes gametes?'
    why:
      A: 'The protonema is the green thread that grows from a spore; sex organs form later on the leafy plant.'
      B: 'The sporophyte makes spores in its capsule, not sex organs.'
      D: 'Rhizoids only anchor the moss and absorb water.'

  10:
    answer: C
    steps:
      - 'Seed plants (gymnosperms and flowering plants) cover most of the land.'
      - 'A seed holds an embryo with a food store inside a tough coat, so it can survive drought and be carried far by wind, water or animals.'
      - 'This efficient dispersal lets seed plants reach and colonise new places, and the seed waits until conditions are good.'
      - 'Example: birds carry mango and pawpaw seeds far from the parent tree.'
      - 'The trap is B. Seed plants do photosynthesise, but so do mosses, ferns and algae, so that cannot explain why seed plants dominate.'
    hint: 'What do seed plants have that mosses and ferns lack?'
    why:
      A: 'Motile gametes need water to swim in, which is a weakness of mosses and ferns on land.'
      B: 'All green plants photosynthesise, so it does not set seed plants apart.'
      D: 'Water is not freely available on land, and seed plants are dominant because they need less of it.'

  11:
    answer: D
    steps:
      - 'Arboreal means living in trees.'
      - 'Many birds feed, roost and nest in trees, with feet that grip branches.'
      - 'Example: weaver birds hang their nests from palm and mango trees in Nigerian villages.'
      - 'Remember: arbor is Latin for tree, as in Arbor Day, the tree-planting day.'
      - 'The trap is C. Antelopes live near trees in the savanna, but they live and feed on the ground.'
    hint: 'Arbor means tree. Which one lives in trees?'
    why:
      A: 'Elephants live on the ground.'
      B: 'Fish live in water, an aquatic habitat.'
      C: 'Antelopes live on the ground in grassland and forest.'

  12:
    answer: C
    steps:
      - 'Root hairs are long, thin outgrowths of single cells of the outer layer (the piliferous layer) of a young root.'
      - 'They give the root a huge surface for taking in water by osmosis and mineral salts by active transport.'
      - 'On a cut root they stick out from the outermost edge, outside the cortex.'
      - 'Example: when you pull up a young groundnut seedling gently, the fine white fuzz on the root is root hairs, often holding soil.'
      - 'Remember: hairs on the outside drink, the centre carries.'
      - 'The trap is D. The cortex is the wide band of packing cells just inside the outer layer, not the hairs on the surface.'
    hint: 'Which part sticks out from the outermost layer of a root?'
    why:
      A: 'Xylem is in the centre of the root, as a star of arms.'
      B: 'Phloem lies in the centre too, between the arms of the xylem.'
      D: 'The cortex is the wide band of cells inside the outer layer.'

  13:
    answer: D
    steps:
      - 'Tell root from stem first. A root has root hairs and its xylem and phloem lie in the centre, on different radii. A stem has vascular bundles with xylem and phloem together on the same radius.'
      - 'Then tell dicot from monocot. A dicot root has a few xylem arms, usually two to six, forming a star in the centre, and no pith.'
      - 'A monocot root has many xylem groups, often more than twelve, in a ring round a large pith.'
      - 'Example: a young bean root shows the star-shaped xylem of a dicot; a maize root shows the ring of many xylem groups of a monocot.'
      - 'Remember: a few arms in a star, no pith, means a dicot root.'
      - 'The trap is C. It is a root, but a few xylem arms meeting in the centre with no pith mark a dicot.'
    hint: 'Root hairs say root. How many xylem arms are there, and is there a pith?'
    why:
      A: 'A monocot stem has scattered vascular bundles and no root hairs.'
      B: 'A dicot stem has a ring of vascular bundles round a pith and no root hairs.'
      C: 'A monocot root has many xylem groups round a large pith.'

  14:
    answer: D
    steps:
      - 'A dental formula gives the teeth in one half of the upper jaw over one half of the lower jaw: incisors (i), canines (c), premolars (pm) and molars (m).'
      - 'Here there are no canines at all (c 0 over 0), which leaves a gap called the diastema.'
      - 'There are many premolars and molars (3 over 2 and 3 over 3) with broad ridged surfaces for grinding plant food.'
      - 'This is the formula of a rabbit, a herbivore. A goat or a cow also lacks upper incisors and canines and grinds grass in the same way.'
      - 'Remember: no canines and big grinders mean a plant eater.'
      - 'The trap is A. An omnivore such as man has canines, i 2 over 2, c 1 over 1.'
    hint: 'Look at the canines first. Who has none?'
    why:
      A: 'An omnivore such as man has canines in both jaws.'
      B: 'Detritus feeders, such as earthworms, have no teeth at all.'
      C: 'A carnivore such as a dog has large canines for tearing flesh.'

  15:
    answer: B
    steps:
      - 'A circulatory system carries food, oxygen and wastes to and from every cell.'
      - 'Amoeba is a single tiny cell. Its surface is large compared with its volume, and no part is far from the outside.'
      - 'So simple diffusion through the cell membrane brings in oxygen and lets out carbon dioxide quickly enough.'
      - 'A mammal such as a cow is huge and its inner cells are far from the surface, so diffusion alone would be far too slow. It needs blood and a heart.'
      - 'The trap is C. Lacking blood is a result of not needing transport, not the reason it does not need it.'
    hint: 'How far is any part of Amoeba from the water around it?'
    why:
      A: 'Many animals with a blood system, such as fish, also live in fresh water.'
      C: 'Lacking blood follows from not needing transport; it does not explain it.'
      D: 'Amoeba respires aerobically, and the type of respiration does not decide the need for transport.'

  16:
    answer: D
    steps:
      - 'Phloem is the food-carrying tissue of a plant.'
      - 'It is made of sieve tubes, long cells joined end to end through perforated sieve plates, and companion cells beside them that keep the sieve tubes alive and working.'
      - 'Sugars made in the leaves flow through the sieve tubes to roots, fruits and storage organs. This is translocation.'
      - 'Example: the starch in a cassava tuber arrived there as sugar through the phloem.'
      - 'Remember: phloem for food, xylem for water.'
      - 'The trap is C. Xylem is the other vascular tissue, but it is made of vessels and tracheids, not sieve tubes.'
    hint: 'Which tissue carries food from the leaves?'
    why:
      A: 'Cambium is the layer of dividing cells between phloem and xylem.'
      B: 'The cortex is packing tissue between the epidermis and the vascular bundles.'
      C: 'Xylem is made of vessels and tracheids and carries water.'

  17:
    answer: C
    steps:
      - 'Stomata are tiny pores on leaves through which gases pass in and out: carbon dioxide and oxygen, and water vapour.'
      - 'Insects have spiracles, small openings along the sides of the body that let air into the tracheal tubes.'
      - 'Both are small openings on the surface for gaseous exchange, and both can be closed to save water.'
      - 'Example: look closely at a grasshopper''s abdomen and you can see a row of spiracles.'
      - 'The trap is D. The trachea of a toad is a tube inside the body, not an opening on the surface.'
    hint: 'Look for another small opening on the surface for gases.'
    why:
      A: 'The pharynx is a passage in the throat for food and air, not a surface pore.'
      B: 'Fish scales protect the body and do not exchange gases.'
      D: 'A trachea is an internal air tube, not a pore on the body surface.'

  18:
    answer: B
    steps:
      - 'Cutaneous respiration is gaseous exchange through the skin. Cutis means skin.'
      - 'A frog''s or toad''s skin is thin, moist and full of blood vessels, so oxygen dissolves in the moisture and diffuses into the blood.'
      - 'This is why frogs stay near water, as in the rice fields of Kebbi in the rainy season: if the skin dries, this breathing stops.'
      - 'Remember: cutaneous, like cuticle, comes from the Latin for skin.'
      - 'The trap is C. Buccal respiration happens through the lining of the mouth, not the skin.'
    hint: 'Which word means skin?'
    why:
      A: 'Cellular respiration is the release of energy from food inside cells.'
      C: 'Buccal respiration is through the lining of the mouth cavity.'
      D: 'Pulmonary respiration is through the lungs.'

  19:
    answer: D
    steps:
      - 'Transpiration is the loss of water vapour from a plant, mostly through the stomata of the leaves.'
      - 'Water evaporates from the wet walls of leaf cells into the air spaces, then diffuses out through the stomata.'
      - 'This loss pulls more water up the xylem from the roots, the transpiration pull, and it cools the leaf.'
      - 'Example: during the harmattan a cassava plant may drop leaves to cut down transpiration.'
      - 'The trap is C. Evaporation is one step inside transpiration, but transpiration is the name of the whole process in plants.'
    hint: 'What is the special name for water loss from leaves?'
    why:
      A: 'Diffusion is only one step in it, the vapour moving out through the stomata; the whole process is transpiration.'
      B: 'Osmosis brings water into root cells; it does not remove water vapour.'
      C: 'Evaporation is only one step inside transpiration.'

  20:
    answer: A
    steps:
      - 'Perennation is surviving an unfavourable season, such as the dry season, and growing again when conditions improve.'
      - 'An organ of perennation is a swollen underground stem or root that stores food and has buds: a rhizome, corm, bulb or tuber.'
      - 'A rhizome is an underground stem that grows sideways and sends up new shoots.'
      - 'Example: ginger is a rhizome. It sits in the dry soil, then sprouts with the first rains.'
      - 'The trap is B. A seed also survives the dry season, but it is a new individual from sexual reproduction, not the same plant living on.'
    hint: 'Which one is a food-storing underground stem?'
    why:
      B: 'A seed starts a new plant after sexual reproduction; it is not a perennating organ of the parent.'
      C: 'Petals attract insects and fall off soon after pollination.'
      D: 'The calyx protects the flower bud; it stores no food.'

  21:
    answer: A
    steps:
      - 'Alternation of generations is a life cycle with two generations: a gametophyte that makes gametes and a sporophyte that makes spores.'
      - 'All land plants have it. The question is which generation is the main, free-living plant.'
      - 'In mosses the leafy green plant is the gametophyte, and the sporophyte is only a stalk and capsule growing on it.'
      - 'In grasses and conifers it is the other way round: the big plant is the sporophyte and the gametophyte is tiny, hidden in the flower or cone.'
      - 'Remember: in mosses, the gametophyte is the boss.'
    hint: 'In which plant is the green plant you see the gamete-maker?'
    why:
      B: 'Fungi do not show alternation of generations as plants do.'
      C: 'In grasses the main plant is the sporophyte; the gametophyte is a few cells inside the flower.'
      D: 'In conifers the tree is the sporophyte; the gametophyte is tiny and inside the cone.'

  22:
    answer: D
    steps:
      - 'Plants grow mainly at the tips of roots and shoots, where the apical meristems are. So I is true.'
      - 'Plants keep growing for as long as they live, adding new leaves and branches. So III is true.'
      - 'Plants do not stop at a fixed size and shape. Animals do: a goat grows into a goat shape and then stops. So II describes animals, not plants.'
      - 'Example: a mango tree keeps adding branches year after year.'
      - 'The trap is A. It includes II, the definite shape, which is animal growth.'
    hint: 'Does a tree stop at a fixed shape like a goat does?'
    why:
      A: 'II is false for plants, whose growth is indefinite.'
      B: 'II is false for plants, and I is left out.'
      C: 'II is false for plants, and III is left out.'

  23:
    answer: B
    steps:
      - 'Co-ordination in mammals uses two systems.'
      - 'The nervous system sends fast electrical impulses along nerves for quick responses, such as pulling a hand off a hot pot.'
      - 'The endocrine system sends hormones in the blood for slower, longer-lasting control, such as growth, blood sugar and the menstrual cycle.'
      - 'Example: when a dog chases you, nerves make you run at once and adrenaline in the blood keeps your heart racing.'
      - 'The trap is A. Muscles carry out the response; they do not co-ordinate.'
    hint: 'Which two systems send messages round the body?'
    why:
      A: 'Muscles are effectors that respond; they do not co-ordinate.'
      C: 'Hormones also co-ordinate body activities.'
      D: 'Nerves also co-ordinate body activities, and faster.'

  24:
    answer: B
    steps:
      - 'The cerebellum is the folded part at the back of the brain, under the cerebrum.'
      - 'It co-ordinates muscular activity: it keeps movements smooth and precise and keeps the body balanced.'
      - 'Example: a market woman carrying a heavy load on her head and walking straight is using her cerebellum.'
      - 'Remember: cerebellum for balance.'
      - 'The trap is A. Reflex actions are handled by the spinal cord and the medulla, not the cerebellum.'
    hint: 'Which part of the brain keeps you steady on a bicycle?'
    why:
      A: 'Reflex actions are controlled by the spinal cord and lower brain.'
      C: 'Emotions are linked to the cerebrum and the hypothalamus.'
      D: 'The endocrine system is controlled through the hypothalamus and the pituitary gland.'

  25:
    answer: B
    steps:
      - 'Peristalsis is the wave of muscle contraction that pushes food along the gut.'
      - 'It is an involuntary action: you do not decide to do it.'
      - 'The medulla oblongata, at the base of the brain, controls involuntary actions: heartbeat, breathing, swallowing and peristalsis.'
      - 'Example: after a plate of eba you never think about moving it along your gut, yet it moves.'
      - 'Remember: the medulla runs the automatic jobs.'
      - 'The trap is C. The hypothalamus controls temperature, thirst and hunger, not gut movement.'
    hint: 'Which part runs the body''s automatic actions?'
    why:
      A: 'The olfactory lobe deals with smell.'
      C: 'The hypothalamus controls temperature, thirst and hunger.'
      D: 'The thalamus relays sensory messages to the cerebrum.'

  26:
    answer: D
    steps:
      - 'A barometer measures atmospheric pressure.'
      - 'The weight of air pushes on mercury in a tube or on a sealed metal box, and the reading shows the pressure.'
      - 'Weather stations, such as those at Nigerian airports, use barometers; falling pressure often comes before rain.'
      - 'Remember: baros is Greek for weight, the weight of the air.'
      - 'The trap is B. A hygrometer measures humidity.'
    hint: 'Which instrument name has "weight" in its Greek root?'
    why:
      A: 'A hydrometer measures the density of a liquid.'
      B: 'A hygrometer measures humidity.'
      C: 'A thermometer measures temperature.'

  27:
    answer: A
    steps:
      - 'Edaphic factors are the soil factors in a habitat: soil texture, water, air, pH, humus and minerals.'
      - 'They decide which plants can grow there, and so which animals can live there.'
      - 'Example: rice does well on waterlogged clay soil in the Niger valley, while groundnut prefers sandy soil in the north.'
      - 'Remember: edaphos is Greek for ground.'
      - 'The trap is D. Topographic factors are about the shape of the land, such as slope and altitude.'
    hint: 'Which word is the soil factor?'
    why:
      B: 'Physiographic factors concern the land surface, such as slope and drainage, not the soil itself.'
      C: 'Biotic factors are the effects of living things.'
      D: 'Topographic factors concern the shape of the land, such as altitude and slope.'

  28:
    answer: D
    steps:
      - 'The genotype is the genetic make-up of an organism: the set of genes it carries, such as Tt.'
      - 'The phenotype is what you can see or measure, which comes from the genotype working with the environment.'
      - 'Example: two people with blood group A look the same in a test, but one may be AA and the other AO. Same phenotype, different genotypes.'
      - 'Remember: genotype is the genes, phenotype is the appearance.'
      - 'The trap is C. The phenotype is the result of the genetic make-up, not the make-up itself.'
    hint: 'Which word contains "gene"?'
    why:
      A: 'An allele is one form of a single gene, not the whole make-up.'
      B: 'A chromosome is one thread that carries genes.'
      C: 'The phenotype is the visible character, not the genes.'

  29:
    answer: D
    steps:
      - 'Productivity is the rate at which producers, mostly algae and water plants, make food by photosynthesis.'
      - 'Photosynthesis needs light, and water absorbs light quickly. Below a few metres it is too dark, especially in muddy water.'
      - 'So the amount of sunlight reaching the water is the main thing that limits how much food is made.'
      - 'Example: in the muddy Lagos lagoon the green algae live only near the surface, where light reaches.'
      - 'The trap is A. Food is what productivity produces, not what limits it.'
    hint: 'What do aquatic producers need that runs out with depth?'
    why:
      A: 'Food is the product of productivity, not its limit.'
      B: 'Water temperature changes little from day to day, so it is not the main limit.'
      C: 'There is no shortage of water in an aquatic habitat.'

  30:
    answer: A
    steps:
      - 'In a food chain, green plants are producers: they make food by photosynthesis.'
      - 'Animals that eat green plants directly are primary consumers, the herbivores.'
      - 'Secondary consumers eat the primary consumers.'
      - 'Example: in grass, goat, man, the goat is the primary consumer.'
      - 'The trap is C. Producers are the green plants themselves, not the animals that eat them.'
    hint: 'Who is first to eat the producer?'
    why:
      B: 'Secondary consumers eat animals, the primary consumers.'
      C: 'Producers are the green plants themselves.'
      D: 'Decomposers feed on dead remains.'

  31:
    answer: B
    steps:
      - 'The tropical rainforest has heavy rain, over about 200 cm a year, and high temperatures all year.'
      - 'These good conditions support a huge number of plant species, in layers from tall emergent trees down to the forest floor.'
      - 'Its trees are broad-leaved evergreens.'
      - 'Example: the forests of Cross River and Ondo States hold many kinds of trees, such as iroko, mahogany and obeche.'
      - 'The trap is A. Narrow, needle-like leaves belong to conifers of cold places, not the rainforest.'
    hint: 'What does a lot of rain and warmth do to the number of plant kinds?'
    why:
      A: 'Rainforest trees are broad-leaved.'
      C: 'The rainforest has more plant species than any other biome.'
      D: 'Less than 50 cm of rain a year is found in the Sahel and in deserts; a rainforest gets over 200 cm.'

  32:
    answer: B
    steps:
      - 'Population dynamics is the study of how and why the size of a population changes over time.'
      - 'It looks at births, deaths, immigration and emigration, and at factors such as food, disease and predators.'
      - 'Example: the rise and fall of locust or quelea bird numbers in northern Nigeria from year to year.'
      - 'Remember: dynamic means changing.'
      - 'The trap is C. Population ecology is the wider study of populations and their environment; the study of change in size is its dynamics.'
    hint: 'Which word means changing?'
    why:
      A: 'Population estimation is counting the size at one time.'
      C: 'Population ecology is the wider study of populations and their surroundings.'
      D: 'A population cycle is one pattern of rise and fall, not the study of change.'

  33:
    answer: A
    steps:
      - 'Going north in Nigeria, rainfall falls and the dry season grows longer: rainforest, Guinea savanna, Sudan savanna, then Sahel savanna.'
      - 'The Sahel, in the far north-east near Lake Chad, has under about 50 cm of rain and a dry season of eight months or more.'
      - 'Its plants are short grasses, thorny shrubs and scattered acacias that can survive the drought and the harmattan.'
      - 'Remember: Sahel means shore, the edge of the Sahara desert.'
      - 'The trap is C. Sudan savanna has a long dry season too, but the Sahel, nearer the desert, has the longest and most severe.'
    hint: 'Which biome is closest to the Sahara?'
    why:
      B: 'Mangrove swamps are on the coast, with heavy rain.'
      C: 'Sudan savanna has a long dry season, but a shorter and milder one than the Sahel.'
      D: 'Guinea savanna has a fairly long rainy season.'

  34:
    answer: D
