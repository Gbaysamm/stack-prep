      - 'Light comes from above, so the back is lit and the belly is in shadow. A dark back and a pale belly cancel this out, and the animal looks flat and hard to see.'
      - 'Rats, antelopes in the savanna and many fish, such as tilapia, are countershaded, so predators find them harder to spot.'
      - 'Remember: dark on top, light below, so the shadow does not show.'
      - 'The trap is C, warning colouration. Warning colours are bright patterns on harmful animals, such as wasps; a rat has nothing to warn about.'
