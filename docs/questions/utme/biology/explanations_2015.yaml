    steps:
      - 'Losing a tail in an accident is an acquired character: a change in the body during life.'
      - 'The genes in the dog''s sperm or egg cells are not changed by the accident, so the instructions for a normal tail are still passed on.'
      - 'Both parents carry normal tail genes, so none of the puppies will be born without a tail.'
      - 'In the same way, a goat whose ear was cut for marking gives birth to kids with whole ears.'
      - 'Remember: scars are not in the genes.'
      - 'The trap is B or D. Those fractions come from genetic crosses, but this is not a gene at all, so there is no ratio to work out.'
    hint: 'Does an accident change the genes in the sex cells?'
    why:
      A: 'An acquired character is not inherited, so the puppies will have tails.'
      B: 'A three to one ratio needs a gene difference, and an accident changes no genes.'
      D: 'A one in four ratio needs two carriers of a recessive gene; no gene is involved here.'

