      B: 'A conidiophore is an upright hypha that carries chains of spores in moulds such as Penicillium; it is not made by fusion.'
      C: 'A sporangium is formed asexually at the tip of an upright hypha.'
      D: 'A hypha is a single thread of the mould, not the product of fusion.'

  37:
    answer: D
    steps:
      - 'Paramecium has two kinds of nucleus.'
      - 'The large kidney-shaped macronucleus, II, controls everyday life: feeding, growth and making proteins. The small micronucleus, III, lying in its notch, takes part in reproduction.'
      - 'In conjugation two paramecia lie side by side, their micronuclei divide, and they exchange micronuclei before separating. This mixes their genes.'
      - 'You can see Paramecium in a drop of pond water under the microscope in the school laboratory.'
      - 'Remember: macro for daily life, micro for mating.'
      - 'The trap is C, II, the macronucleus. It is the bigger nucleus, but it breaks down during conjugation; the micronucleus is the one exchanged.'
    hint: 'Of the two nuclei, the big one and the small one, which is exchanged during conjugation?'
    why:
      A: 'IV is a contractile vacuole, which removes excess water; it plays no part in reproduction.'
      B: 'I is a food vacuole, which digests food.'
      C: 'II is the macronucleus, which controls everyday life and breaks down during conjugation.'

  38:
    answer: D
    steps:
      - 'Paramecium lives in fresh water, which is less concentrated than its cytoplasm. Water keeps entering it by osmosis.'
      - 'IV is a contractile vacuole: the star-shaped structure with radiating canals. It collects the extra water through the canals, swells and then contracts, pushing the water out.'
      - 'This keeps the cell from bursting. Controlling the water content of the body is called osmoregulation.'
      - 'Remember: a contractile vacuole is the cell''s water pump.'
      - 'The trap is A, respiration. Gases are exchanged through the whole cell surface, not by the contractile vacuole.'
    hint: 'Water keeps flowing into a freshwater cell. What must it do with the excess?'
    why:
      A: 'Gases diffuse through the whole cell membrane; the contractile vacuole does not respire.'
      B: 'Food is taken in through the oral groove and gullet.'
      C: 'Paramecium moves by beating its cilia.'

  39:
    answer: A
    steps:
      - 'I is the pulmonary artery. On the drawing it rises from the top of the right ventricle, bends to the right under the arch of the aorta and leaves for the lungs.'
      - 'This blood is deoxygenated. It is one of the very few arteries that carry deoxygenated blood, because an artery is named for carrying blood away from the heart, not for how much oxygen it holds.'
      - 'In the lungs the blood takes up oxygen and returns to the left atrium in the pulmonary veins.'
      - 'Remember: pulmonary means lungs; right side to the lungs, left side to the body.'
      - 'The trap is C, the aorta. It is the other great artery, but it leaves the left ventricle and supplies the body.'
    hint: 'Follow I back to the chamber it leaves. Which vessel leaves the right ventricle?'
