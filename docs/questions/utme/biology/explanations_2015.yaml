      - 'When blood sugar rises after a meal, insulin makes the liver and muscles take up glucose and store it as glycogen, so the blood sugar falls back to normal.'
      - 'Example: after a big plate of eba or rice, insulin keeps your blood sugar from staying high. A person with diabetes makes too little insulin, or the body does not respond to it.'
      - 'Remember: pancreas, islets, insulin.'
