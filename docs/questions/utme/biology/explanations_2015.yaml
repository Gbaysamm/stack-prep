    answer: C
    steps:
      - 'Data: G (grey head) is dominant over g. Dogs I, II and IV have grey heads; dog III has a white head.'
      - 'Rule: a recessive trait shows only when both alleles are recessive. Any dog with at least one G has a grey head.'
      - 'Working: a grey dog could be GG or Gg, so we cannot be sure of its genotype from its looks. A white-headed dog has no G at all, so it must be gg.'
      - 'Check: in a cross Gg × Gg the offspring come in the ratio three grey to one white, so one white pup in four fits.'
      - 'Example: in the same way, two black goats that both carry a hidden white allele can have a white kid.'
      - 'Remember: if the recessive trait shows, the genotype is double small.'
      - 'The trap is choosing a grey dog. A grey dog may carry g, but it must also have a G, so it cannot be gg.'
    hint: 'Which dog does not show the dominant grey head?'
    why:
      A: 'Dog I has a grey head, so it has at least one G and cannot be gg.'
      B: 'Dog IV has a grey head, so it is GG or Gg, not gg.'
      D: 'Dog II has a grey head, so it carries the dominant G.'

