    why:
      B: 'I is the pulmonary artery, a vessel carrying deoxygenated blood to the lungs.'
      C: 'II is the right atrium, which receives deoxygenated blood from the body.'
      D: 'III is the right ventricle, which pumps deoxygenated blood to the lungs.'

  41:
    answer: D
    steps:
      - 'Geotropism is a growth movement of a plant part in response to gravity. Roots grow towards gravity, so they are positively geotropic.'
      - 'In the top half of the drawing the klinostat turns the seedling slowly, so gravity acts on every side in turn. It cancels out, and the radicle grows straight.'
      - 'The seedling on the bench feels gravity on one side only, so its radicle bends downwards. Keeping both in the dark rules out light, so gravity is the only cause.'
      - 'This is why a yam or cassava cutting planted on its side still sends its roots down.'
      - 'Remember: geo means earth; roots grow down to the earth.'
      - 'The trap is B, phototropism. It is a famous tropism, but no light from one side is used here.'
    hint: 'What does a turning klinostat cancel out?'
    why:
      A: 'Hydrotropism is growth towards water; both seedlings have the same moisture.'
      B: 'Phototropism needs light from one side, and both seedlings are in the dark.'
      C: 'Thigmotropism is a response to touch, as in tendrils; nothing touches the radicle.'

  42:
    answer: C
    steps:
      - 'Auxin is the plant growth hormone made at the tips of roots and shoots.'
      - 'I marks the bend in the radicle of the still seedling. In a horizontal root, gravity makes auxin gather on the lower side, just behind the tip.'
      - 'In roots, a high concentration of auxin slows down cell growth. So the upper side grows faster than the lower side, and the root bends downwards.'
      - 'Remember: in roots, more auxin means less growth, so the root bends towards the side with more.'
      - 'The trap is B, abscisic acid. It is a growth inhibitor too, but it controls dormancy and closing stomata, not the bending of a root.'
    hint: 'Which hormone gathers on the lower side of a horizontal root and makes it bend at I?'
    why:
      A: 'Ethylene ripens fruits such as plantain; it does not cause the bending.'
      B: 'Abscisic acid controls dormancy, leaf fall and stomata closing.'
      D: 'Ascorbic acid is vitamin C, not a plant growth hormone.'

