    why:
      A: 'Gametogenesis is the making of gametes in an organ, not the fusing of two hyphae.'
      C: 'Spirogyra conjugates through tubes between algal filaments, not by fusing hyphae.'
      D: 'Sporulation is asexual spore formation in a sporangium, with no fusion.'

  36:
    answer: A
    steps:
      - 'I labels the body formed in the last stage, when the two gametangia have fused: a zygote with a thick, dark, rough wall, the zygospore.'
      - 'The thick wall lets it rest through dry or cold conditions. When things improve it germinates and gives a new sporangium.'
      - 'So a zygospore helps bread mould survive between one damp meal and the next.'
      - 'Remember: zygote plus spore, zygospore.'
      - 'The trap is C, the sporangium. It also holds spores, but it forms at the tip of an upright hypha, without any fusion.'
    hint: 'I is what the two gametangia become once they fuse. What is it called?'
