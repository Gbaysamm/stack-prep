format_version: 1
exam_year: 2015
subject: BIO
explanations:
  1:
    answer: A
    steps:
      - 'An insect breathes through a tracheal system: holes called spiracles on its sides open into air tubes (tracheae) that branch into fine tracheoles.'
      - 'Air reaches the tissues straight down these tubes, mainly by diffusion. There is no lung, no gill and no blood carrying oxygen, so it is the simplest system of the four.'
      - 'Fish pump water over gills with a rich blood supply; snails have a vascular lung in the mantle cavity; a mouse has lungs with millions of alveoli, a diaphragm and blood to carry the gases.'
      - 'Think of a grasshopper in the grass near your house: tiny holes along its abdomen are all it needs.'
      - 'Remember: insects pipe air in, the others use blood to carry it.'
      - 'The trap is C, the snail. It is a slow, simple animal, but its lung is a lined, blood-filled chamber, which is more advanced than plain air tubes.'
    hint: 'Which animal sends air straight to its cells without using blood to carry the oxygen?'
    why:
      B: 'Gills with a rich blood supply and a water pump are more advanced than air tubes.'
      C: 'The snail''s mantle cavity works as a lung lined with blood vessels, so it is not the simplest.'
      D: 'A mammal''s lungs, with alveoli and a diaphragm, are the most advanced of the four.'

  2:
    answer: B
    steps:
      - 'Hydrophytes are plants that live in water, such as water lettuce and water lily.'
      - 'Water all round them supports their bodies and gives them water and minerals through their whole surface.'
      - 'So they need little root, little xylem to carry water and little strengthening tissue. Their roots and xylem are poorly developed, and air spaces (aerenchyma) keep them afloat.'
      - 'You can see water lettuce floating on ponds and on the Lagos lagoon, with only short, feathery roots hanging below.'
      - 'Remember: water does the work, so the plant saves on roots and pipes.'
      - 'The trap is A, a waxy cuticle. That saves water, which is what a desert plant (xerophyte) needs, not a water plant.'
    hint: 'If water surrounds a plant on every side, what does it no longer need much of?'
    why:
      A: 'A thick waxy cuticle cuts water loss, which is an adaptation of xerophytes.'
      C: 'Strong roots and support are needed on land; water already supports a hydrophyte.'
      D: 'Leaves reduced to spines cut water loss in desert plants such as cactus.'

  3:
    answer: D
    steps:
      - 'The earthworm has no lungs, gills or air tubes. It exchanges gases through its whole skin.'
      - 'The skin is thin, kept moist by mucus and full of blood capillaries. Oxygen dissolves in the moisture and diffuses into the blood; carbon dioxide diffuses out.'
      - 'This is why earthworms come up after heavy rain in the rainy season: a waterlogged soil has little air, and a dried-out skin cannot exchange gases at all.'
      - 'The grasshopper uses tracheae, the rat uses lungs and the lizard uses lungs.'
      - 'Remember: worm, wet skin, whole body breathes.'
      - 'The trap is A, the grasshopper. Diffusion happens in its tracheoles too, but through air tubes, not across its body surface.'
    hint: 'Which of these animals has no special breathing organ at all?'
    why:
      A: 'The grasshopper breathes through spiracles and tracheae, not through its body surface.'
      B: 'The rat breathes with lungs, ventilated by its ribs and diaphragm.'
      C: 'The lizard has dry, scaly skin and breathes with lungs.'

  4:
    answer: C
    steps:
      - 'Jean-Baptiste Lamarck proposed the theory of use and disuse, with the inheritance of acquired characters.'
      - 'He said that a part used a lot grows bigger, a part not used shrinks, and these changes are passed on to the young.'
      - 'So by his theory a weightlifter''s big muscles would appear in his children. We now know they do not: exercise changes the body, not the genes in the sex cells.'
      - 'Remember: Lamarck, large muscles, the giraffe stretching its neck.'
      - 'The trap is B, Darwin. Darwin explained evolution by natural selection of variations that are already inherited, not by passing on what was gained in life.'
    hint: 'Whose theory says that characters gained during life are inherited?'
    why:
      A: 'Mendel worked out the laws of inheritance with garden peas; he did not propose this theory.'
      B: 'Darwin''s theory is natural selection of variation that is already inherited; it does not say that muscles built up during life are passed on.'
      D: 'Pasteur worked on germs, vaccines and pasteurisation, not evolution.'

  5:
    answer: D
    steps:
      - 'Monera are the prokaryotes: bacteria and blue-green algae (cyanobacteria).'
      - 'A prokaryotic cell has no nuclear membrane, so it has no true nucleus.'
      - 'Its single circular chromosome lies free in the cytoplasm, in a region called the nucleoid.'
      - 'The bacteria that sour milk into nono, and the green scum of cyanobacteria on a pond, are cells like this.'
      - 'Remember: pro means before, karyon means nucleus, so prokaryotes came before the nucleus.'
      - 'The trap is A, nucleoplasm. That is the fluid inside a nucleus, and Monera have no nucleus.'
    hint: 'Do bacteria have a nuclear membrane?'
    why:
      A: 'Nucleoplasm is found only inside a nucleus, which Monera do not have.'
      B: 'Monera are prokaryotes and have no true nucleus.'
      C: 'A nucleolus sits inside a nucleus, and Monera have neither.'

  6:
    answer: C
    steps:
      - 'Mangrove swamps grow where salty sea water mixes with fresh river water, on muddy coasts and in river deltas.'
      - 'In Nigeria that is the coastal belt and the Niger Delta, which lie in the tropical rainforest zone in the south.'
      - 'You can see red mangroves with stilt roots and breathing roots (pneumatophores) around the Lagos lagoon, Warri and Port Harcourt.'
      - 'Remember: mangroves need the sea, and in Nigeria the sea is next to the rainforest.'
      - 'The trap is B, Guinea savanna. It is the zone just north of the forest, but it is far inland, away from salt water.'
    hint: 'Mangroves need brackish water. Which vegetation zone touches the Nigerian coast?'
    why:
      A: 'The Sahel is the dry far north, far from the sea.'
      B: 'The Guinea savanna is inland, with no salt water for mangroves.'
      D: 'The Sudan savanna is dry northern grassland, far from the coast.'

  7:
    answer: A
    steps:
      - 'The pancreas makes pancreatic juice and pours it into the duodenum.'
      - 'The juice holds three main enzymes: amylase for starch (carbohydrate), trypsin for protein and lipase for fat.'
      - 'So when you eat rice (carbohydrate), beans (protein) and palm oil (fat), the pancreas helps digest all three.'
      - 'Remember: A, T, L, amylase, trypsin, lipase, for carbohydrate, protein, fat.'
      - 'The trap is C. It has fats and carbohydrates, but vitamins are absorbed as they are and need no digestion.'
    hint: 'Name the three enzymes in pancreatic juice and what each one works on.'
    why:
      B: 'Vitamins need no digestion, and humans make no enzyme for cellulose.'
      C: 'Vitamins are absorbed unchanged; the missing class is protein.'
      D: 'Cellulose is not digested by human enzymes, and minerals need no digestion.'

  8:
    answer: B
    steps:
      - 'Bird flu (avian influenza) is caused by the influenza A virus, for example the H5N1 strain.'
      - 'It spreads among chickens and other birds through droppings and mucus, and can pass to people who handle sick birds.'
      - 'Nigeria had outbreaks on poultry farms from 2006, and thousands of birds were killed to stop the spread.'
      - 'Remember: flu of any kind is caused by a virus.'
      - 'The trap is C, a bacterium. Bacteria cause diseases such as cholera and typhoid, but influenza is viral, so antibiotics do not cure it.'
    hint: 'What kind of germ causes every type of influenza?'
    why:
      A: 'Protozoa cause diseases such as malaria and sleeping sickness, not influenza.'
      C: 'Bacteria cause cholera and typhoid; influenza is caused by a virus.'
      D: 'Fungi cause ringworm and athlete''s foot, not influenza.'

  9:
    answer: C
    steps:
      - 'In ferns the male gametes (antherozoids) have flagella and must swim to the egg in the archegonium.'
      - 'They can only swim in a film of water, from rain or dew, on the small prothallus.'
      - 'That is why ferns grow in damp, shady places, such as the banks of streams in the rainforest.'
      - 'Conifers and angiosperms carry their male gametes in pollen, and a pollen tube takes them to the egg, so no water is needed.'
      - 'Remember: ferns and mosses swim, seed plants send pollen.'
      - 'The trap is D, fungi. Most fungi fuse hyphae or gametangia directly, without swimming gametes.'
    hint: 'Which of these plants has male gametes that swim?'
    why:
      A: 'Conifers use pollen and a pollen tube, so water is not needed.'
      B: 'Flowering plants use pollen tubes to carry the male nuclei to the egg.'
      D: 'Most fungi reproduce sexually by fusing hyphae, not by swimming gametes.'

  10:
    answer: C
    steps:
      - 'A sex-linked trait is controlled by a gene on the X chromosome, so it is inherited differently in males and females.'
      - 'Red-green colour blindness is such a trait. The faulty gene is recessive and on the X chromosome.'
      - 'A boy (XY) has only one X, so one faulty gene makes him colour blind. A girl (XX) needs two, so she is usually only a carrier. That is why more men than women are colour blind.'
      - 'Remember the two classic sex-linked traits: colour blindness and haemophilia.'
      - 'The trap is A, skin colour. It is controlled by several genes on ordinary chromosomes (autosomes), so it is not sex-linked.'
    hint: 'Which of these is caused by a gene on the X chromosome?'
    why:
      A: 'Skin colour is controlled by several autosomal genes, not by a gene on the X chromosome.'
      B: 'Tongue rolling is usually taught as an autosomal trait, not a sex-linked one.'
      D: 'Growing long hair depends on care and culture; it is not inherited on the X chromosome.'

  11:
    answer: B
    steps:
      - 'Montane vegetation is the forest and grassland of high mountains and plateaus, more than about 1,000 m above sea level.'
      - 'It is cooler there, so the plants differ from those of the lowlands around them.'
      - 'In Nigeria the best-known example is the Jos Plateau in Plateau State, which is cool enough for Irish potatoes and strawberries.'
      - 'Remember: Plateau State is named after its high land.'
      - 'The trap is D, Enugu. It has hills, but they are not high enough for montane vegetation; its natural cover is derived savanna.'
    hint: 'Which state is named after its high land?'
    why:
      A: 'Bauchi lies mostly in the Sudan and Guinea savanna, below the height of montane vegetation.'
      C: 'Lagos is low-lying coastal land with mangrove swamp and rainforest.'
      D: 'The hills around Enugu are too low for montane vegetation.'

  12:
    answer: D
    steps:
      - 'A clone is an organism that is genetically identical to the one it came from.'
      - 'In cloning, one body cell, or just its nucleus, is taken from the original organism and grown into a whole new individual. Dolly the sheep came from one cell of an adult sheep, placed in an egg cell whose own nucleus had been removed.'
      - 'In plants, one cell or a small piece of a cassava or yam plant can be grown in tissue culture into many identical plantlets.'
      - 'So only one cell of the original organism is needed to start the process, and the clone has exactly the same genes.'
      - 'The trap is B. It sounds right because cloning is asexual, but cloning produces a new, separate individual from one cell; it is not a multiplication of the original''s own tissues.'
    hint: 'How many cells of the original sheep were used to make Dolly?'
    why:
      A: 'Cloning, especially of humans, is still strongly debated on ethical and moral grounds.'
      B: 'Cloning grows a new, separate individual from a single cell; it is not a multiplying of the original''s tissues.'
      C: 'A clone has exactly the same genes as the original organism.'

  13:
    answer: A
    steps:
      - 'Ecdysis is moulting: the shedding of the hard exoskeleton of an arthropod.'
      - 'The exoskeleton of chitin cannot stretch, so to grow the animal makes a new soft cuticle underneath, splits the old one and crawls out. It then swells before the new one hardens.'
      - 'You may find the empty, split skins of cockroaches or the old shells of crabs; each one is left after ecdysis.'
      - 'Remember: ecdysis, exit the old skin.'
      - 'The trap is B, instar formation. An instar is the stage between two moults, not the shedding itself.'
    hint: 'What is the name for moulting in insects and crabs?'
    why:
      B: 'An instar is the stage of growth between two moults, not the act of shedding.'
      C: 'Metamorphosis is the change of body form from young to adult, such as larva to pupa to adult.'
      D: 'Osmosis is the movement of water across a membrane, not moulting.'

  14:
    answer: A
    steps:
      - 'Roughage (dietary fibre) is mostly cellulose from plant food. We cannot digest it.'
      - 'It adds bulk to the food in the intestine, holds water and gives the gut muscles something to push on, so peristalsis moves the faeces along.'
      - 'A diet of only refined foods such as white bread and polished rice, with few vegetables, fruits or beans, leads to hard, dry faeces and constipation.'
      - 'Remember: roughage keeps the bowel regular; eat your ugu, okra and fruit.'
      - 'The trap is D, lack of salts. Salts matter for nerves and fluid balance, but the main cause of constipation is too little fibre.'
    hint: 'Which part of food helps the gut push faeces along?'
    why:
      B: 'Lack of vitamin B causes diseases such as beriberi, not constipation.'
      C: 'Lack of vitamin E is rare and is not a cause of constipation.'
      D: 'Lack of salts causes cramps and other problems, but the major cause of constipation is too little roughage.'

  15:
    answer: A
    steps:
      - 'The adrenal glands are two small endocrine glands, one sitting like a cap on top of each kidney.'
      - 'Their name says it: ad means near and renal means kidney.'
      - 'They make adrenaline, the hormone that prepares the body for fight or flight. It is why your heart races if a dog suddenly chases you.'
      - 'Remember: adrenal on the renal, adrenaline for the alarm.'
      - 'The trap is C, the pancreas. It is close by in the abdomen, but it lies below the stomach, beside the duodenum, not on the kidney.'
    hint: 'Break the name: ad plus renal.'
    why:
      B: 'The prostate gland is in the pelvis, around the urethra of a male, below the bladder.'
      C: 'The pancreas lies beside the duodenum, below the stomach, not on top of the kidney.'
      D: 'The thyroid gland is in the neck, in front of the windpipe.'

  16:
    answer: D
    steps:
      - 'DNA analysis (DNA fingerprinting) compares the DNA in a sample, such as semen, blood or hair, with the DNA of a suspect.'
      - 'Apart from identical twins, every person''s DNA pattern is unique, so a match is very strong evidence.'
      - 'Police and courts use it to identify criminals and to settle paternity cases.'
      - 'Remember: DNA is the body''s own identity card.'
      - 'The trap is B, a blood group test. It can rule a suspect out, but millions of people share each blood group, so it cannot identify one person.'
    hint: 'Which test gives a pattern that is unique to each person?'
    why:
      A: 'RNA breaks down quickly and is not used to identify people.'
      B: 'Many people share the same blood group, so it cannot pick out one person.'
      C: 'Behaviour is not a reliable or scientific way to identify a person.'

  17:
    answer: B
    steps:
      - 'Aestivation is a dormant state that helps an animal survive a hot, dry season.'
      - 'The African lungfish (Protopterus) burrows into the mud when its pond dries up, wraps itself in a cocoon of mucus and breathes air with its lungs until the rains return.'
      - 'Lungfish live in the swamps of the Niger and in Lake Chad, where pools dry up in the dry season.'
      - 'Remember: aestivation is summer sleep; hibernation is winter sleep.'
      - 'The trap is D, the catfish. It can breathe some air and wriggle across wet ground, but it does not seal itself in mud for months.'
    hint: 'Which fish can breathe air for months inside a mud cocoon?'
    why:
      A: 'The croaker is a sea fish that does not aestivate.'
      C: 'The shark is a sea fish that swims all year and does not aestivate.'
      D: 'The catfish survives in muddy water but does not aestivate in a cocoon.'

  18:
    answer: B
    steps:
      - 'Each stoma is a pore between two guard cells.'
      - 'In light, the guard cells take in potassium ions and make sugar, so their sap becomes more concentrated. Water enters them from nearby cells by osmosis.'
      - 'The guard cells become turgid, and because their inner walls are thicker they bend apart and open the pore. When they lose water by osmosis, they become flaccid and the pore closes.'
      - 'On a hot harmattan afternoon a plant''s guard cells lose water and close the stomata to save water.'
      - 'Remember: open when swollen with water, shut when limp.'
      - 'The trap is C, diffusion. Gases do diffuse through the open pore, but diffusion does not open or close it.'
    hint: 'Guard cells swell and shrink. What process moves water into and out of them?'
    why:
      A: 'Respiration releases energy in every cell; it does not directly open or close the pore.'
      C: 'Diffusion moves gases through the pore, but the opening and closing is caused by water moving by osmosis.'
      D: 'Transpiration is water loss through the stomata; it is a result of their opening, not the cause.'

  19:
    answer: C
    steps:
      - 'The mosquito, housefly and blackfly are all true flies (order Diptera).'
      - 'All three go through complete metamorphosis: egg, larva, pupa and adult.'
      - 'The housefly''s maggots live in rubbish heaps and dung, not in water, so B fails. The housefly does not feed on blood, so A fails. All flies have only one pair of wings, so D fails.'
      - 'The blackfly, which spreads river blindness along fast rivers in Nigeria, has larvae in water like the mosquito, but the housefly does not.'
      - 'Remember: egg, larva, pupa, adult, four stages for every fly.'
      - 'The trap is B. It is true of the mosquito and blackfly, but not of the housefly.'
    hint: 'Test each statement on the housefly first.'
    why:
      A: 'The housefly is not a parasite; it feeds on rubbish and food, though it spreads germs.'
      B: 'Housefly larvae (maggots) live in dung and rubbish, not in water.'
      D: 'Flies have one pair of wings; the hind pair is reduced to balancers (halteres).'

  20:
    answer: C
    steps:
      - 'Vibrissae are the long, stiff whiskers on the snout of a rat.'
      - 'Each whisker has nerve endings at its root. When it touches the wall of a burrow, the rat feels it at once, so it can find its way in total darkness.'
      - 'The giant African pouched rat, found across Nigeria, lives in burrows and forages at night with its whiskers sweeping the ground.'
      - 'Remember: in the dark, touch guides the rat, not sight.'
      - 'The trap is A, the nostrils. These rats do have a fine sense of smell for finding food, but feeling its way along tunnels is the job of the whiskers.'
    hint: 'Underground it is dark. Which sense is most useful for finding the walls of a tunnel?'
    why:
      A: 'Smell helps a rat find food, but its whiskers guide it along dark tunnels.'
      B: 'Eyes are of little use in the dark of a burrow.'
      D: 'The tail helps with balance, not with finding the way.'

  21:
    answer: C
    steps:
      - 'Data: crucible = 5 g; crucible + fresh soil = 10 g; crucible + dry soil = 8 g. Percentage of water = ?'
      - 'Rule: heating at 100 °C drives off the water, so the loss in mass is the mass of water. Percentage of water = (mass of water ÷ mass of fresh soil) × 100.'
      - 'Mass of fresh soil = 10 − 5 = 5 g. Mass of water = 10 − 8 = 2 g.'
      - 'Percentage of water = 2 ÷ 5 × 100 = 40%.'
      - 'Check: the dry soil is 8 − 5 = 3 g, which is 60%; water and dry soil add up to 100%, as they should.'
      - 'The trap is B, 20%. It divides the 2 g of water by 10 g, which includes the mass of the crucible.'
    hint: 'Take away the crucible first. How much soil was there?'
    why:
      A: '80% is 8 ÷ 10, the final reading over the first, which is not a percentage of water.'
      B: 'Divides by 10 g, which includes the crucible; the soil itself was only 5 g.'
      D: '60% is the dry soil left, not the water lost.'

  22:
    answer: C
    steps:
      - 'Tannins are bitter waste products stored in the bark, leaves and fruits of many plants.'
      - 'Tanners soak raw animal hide in tannin. The tannin binds the proteins of the skin, making it tough, flexible and resistant to rotting, so it becomes leather.'
      - 'In Kano and Sokoto, goat skins have long been tanned with tannin from the pods of the acacia (bagaruwa) tree for the famous leather work.'
      - 'Remember: tannin is for tanning.'
      - 'The trap is A, alkaloids. They are also plant waste products, but they are used as drugs, such as quinine and caffeine, not for leather.'
    hint: 'Which plant product gives the leather trade its name?'
    why:
      A: 'Alkaloids such as quinine, caffeine and nicotine are used as drugs, not for leather.'
      B: 'Resin is used to make varnish and incense, not to tan hide.'
      D: 'Gum, such as gum arabic, is used as glue and in food, not for tanning.'

  23:
    answer: A
    steps:
      - 'Urea is made in the liver and carried to the kidney in the blood. A nephron removes it in order.'
      - 'In the glomerulus, a knot of capillaries, blood is filtered under high pressure, and urea passes into the cup around it, Bowman''s capsule.'
      - 'The filtrate then flows along the proximal convoluted tubule, round the loop of Henle and through the distal convoluted tubule, where water and useful substances are taken back.'
      - 'Last, the urine runs into the collecting tubule, then to the pelvis of the kidney and down the ureter.'
      - 'Remember: knot, cup, coil, loop, collect.'
      - 'The trap is C. It swaps the first two; but the glomerulus is where the blood is filtered, and the capsule only catches the filtrate.'
    hint: 'Where is urea first pushed out of the blood?'
    why:
      B: 'The convoluted tubule comes after filtration in the glomerulus and capsule, not before.'
      C: 'The blood is filtered in the glomerulus first; Bowman''s capsule then collects the filtrate.'
      D: 'Starts in the tubule and ends at the glomerulus, which is backwards.'

  24:
    answer: A
    steps:
      - 'The gular fold is a flap of skin under the throat of a lizard.'
      - 'A male agama lowers it and bobs his head up and down in a display that tells other males to keep away.'
      - 'This defends his territory: the patch with food, basking spots and females that he holds. It is the bright red-headed male agama you see nodding on a wall in any Nigerian town.'
      - 'Remember: nod and flap, this wall is mine.'
      - 'The trap is D. Lizards do catch insects, but they use a quick tongue and jaws, not the throat fold.'
    hint: 'Watch a male agama on a wall when another male comes near. What is the display for?'
    why:
      B: 'The gular fold is a flap of skin, not a pouch for storing food.'
      C: 'Lizards hear through their ear openings, not their throat fold.'
      D: 'Lizards catch insects with their jaws and tongue, not the gular fold.'

  25:
    answer: C
    steps:
      - 'Photosynthetic pigments are the coloured chemicals in a leaf that absorb light energy.'
      - 'The main pigment is chlorophyll, which is green. Carotenoids, which are yellow and orange, absorb other colours and pass the energy to chlorophyll.'
      - 'When a mango or pawpaw leaf turns yellow as it ages, the chlorophyll is breaking down and the carotenoids are showing through.'
      - 'Remember: green chlorophyll, carrot-coloured carotenoids.'
      - 'The trap is A. A chloroplast is the organelle that holds the pigments, not a pigment itself.'
    hint: 'Which pigments trap light in green plants?'
    why:
      A: 'A chloroplast is the organelle that contains the pigments; cytochromes carry electrons.'
      B: 'Melanin colours skin and haemoglobin carries oxygen in blood; neither does photosynthesis.'
      D: 'Carotenoids are photosynthetic, but haemoglobin is the oxygen carrier in blood.'

  26:
    answer: C
    steps:
      - 'Ecological levels go from small to large: organism, population, community, ecosystem, biome, biosphere.'
      - 'A population is all the members of one species in an area. A community is all the populations living together. An ecosystem is a community with its non-living surroundings.'
      - 'The biosphere is the sum of all the ecosystems on Earth: every part of land, water and air where life exists.'
      - 'So the Lagos lagoon is one ecosystem, but the biosphere includes it, the rainforest, the savanna and every ocean.'
      - 'Remember: bio-sphere, the ball of life.'
      - 'The trap is A, the ecosystem. It is a high level, but many ecosystems together make up the biosphere.'
    hint: 'Put the levels in order. What contains all ecosystems?'
    why:
      A: 'An ecosystem is one part of the biosphere, so it is not the highest level.'
      B: 'A niche is the role of a species in its habitat, not a level of organization.'
      D: 'A population is one of the lowest ecological levels, one species in an area.'

  27:
    answer: B
    steps:
      - 'Biotic factors come from living things: competition, predation, parasitism and the activities of people.'
      - 'Abiotic factors are the non-living conditions: light, temperature, pH, water and wind.'
      - 'Competition is biotic. For example, weeds compete with maize for light, water and minerals and cut down its growth in a farm.'
      - 'Remember: bio means life, so biotic factors come from living things.'
      - 'The trap is C, temperature. It strongly affects where organisms live, but it is a physical, abiotic factor.'
    hint: 'Which of these involves other living things?'
    why:
      A: 'pH is a chemical, non-living condition of soil or water, so it is abiotic.'
      C: 'Temperature is a physical condition, so it is abiotic.'
      D: 'Light is a physical condition, so it is abiotic.'

  28:
    answer: A
    steps:
      - 'Astigmatism happens when the cornea (or lens) is not evenly curved: it bends more in one direction than another.'
      - 'Light in one plane is focused at a different point from light in another, so some lines look sharp and others look blurred.'
      - 'It is put right with a cylindrical lens, which bends light more in one direction only.'
      - 'Remember: a stigma is a mark or point; a-stigma means the light does not meet at one point.'
      - 'The trap is B, short-sightedness. That comes from an eyeball that is too long or a lens that is too strong, not from an uneven cornea.'
    hint: 'Which defect comes from an unevenly curved surface?'
    why:
      B: 'Short sight comes from a long eyeball or a strong lens, not an uneven cornea.'
      C: 'Long sight comes from a short eyeball or a weak lens, not an uneven cornea.'
      D: 'Presbyopia is the stiffening of the lens with old age, not an uneven cornea.'

  29:
    answer: B
    steps:
      - 'In parasitism, one organism (the parasite) lives on or in another (the host) and takes food from it, harming the host.'
      - 'Mistletoe grows on the branches of orange and other trees. It sends special roots called haustoria into the host''s xylem and takes water and mineral salts from it.'
      - 'A badly infected orange tree in a farm grows weak and bears less fruit, so the host is harmed.'
      - 'Remember: a parasite gains, the host loses.'
      - 'The trap is D. The egret takes food from the cow, but the ticks it eats are pests, so both gain; that is not parasitism.'
    hint: 'In which case does one organism feed on a living host and harm it?'
    why:
      A: 'The squirrel only uses an empty nest; no living host is harmed, so this is not parasitism.'
      C: 'Fungi on a dead branch feed on dead matter; this is saprophytism.'
      D: 'The egret eats the cow''s ticks and the cow is rid of them, so both benefit.'

  30:
    answer: B
    steps:
      - 'Soil particles are graded by size: clay is the finest, below 0.002 mm; silt is 0.002–0.02 mm; sand is 0.02–2 mm; gravel is above 2 mm.'
      - 'So in increasing size the order is clay, silt, sand, gravel.'
      - 'You can feel it: clay is smooth and sticky, as potters in Ilorin and Abuja use it; silt is like flour; sand is gritty; gravel is small stones.'
      - 'Remember: Clever Students Seek Grades, clay, silt, sand, gravel.'
      - 'The trap is D, which swaps silt and sand. Sand grains are gritty and visible; silt is much finer.'
    hint: 'Which particle is the finest? Start there.'
    why:
      A: 'Clay is the finest particle, so it cannot come after sand.'
      C: 'Clay is finer than silt, so it must come first.'
      D: 'Silt is finer than sand, so silt comes before sand.'

  31:
    answer: B
    steps:
      - 'Competition happens when organisms need the same resource and there is not enough for all of them.'
      - 'A drought cuts the supply of water and, through the plants that die, of food. With less to share, members of the population compete harder for what is left.'
      - 'In a long dry season in the far north, cattle crowd round the few water holes that remain.'
      - 'Remember: scarce resources make competition fierce.'
      - 'The trap is C, mortality. Deaths change population size, but by reducing numbers they ease competition, not cause it.'
    hint: 'Which of these makes a resource scarce?'
    why:
      A: 'Emigration takes individuals away, which reduces competition.'
      C: 'Mortality lowers numbers and so eases competition.'
      D: 'Dispersion spreads individuals out, which reduces competition.'

  32:
    answer: A
    steps:
      - 'Phosphorus is a major mineral element for plants, taken up as phosphate.'
      - 'It is needed to make ATP, nucleic acids and cell membranes, so it is vital for cell division, root growth and ripening.'
      - 'A plant short of phosphorus has stunted growth and poor roots, with dull, dark or purplish leaves. Farmers add NPK or single superphosphate fertiliser to fix it.'
      - 'Remember: P for phosphorus, P for plant roots.'
      - 'The trap is D, iron. Lack of iron causes yellowing between the veins (chlorosis), not mainly poor roots.'
    hint: 'Which element is in ATP and DNA and is known for root growth?'
    why:
      B: 'Lack of calcium weakens new cell walls, so the growing tips die and young leaves curl; stunting with a poor root system and purplish leaves is the sign of phosphorus.'
      C: 'Lack of sulphur mainly turns the leaves yellow, starting with the young ones; it is not known for poor roots.'
      D: 'Lack of iron causes chlorosis, yellow leaves with green veins.'

  33:
    answer: D
    steps:
      - 'The mitochondrion is the organelle of aerobic respiration.'
      - 'Glucose is first split to pyruvate in the cytoplasm. In the mitochondrion the pyruvate is fully oxidised to carbon dioxide and water, releasing most of the energy as ATP.'
      - 'Very active cells, such as the muscle cells of a footballer or a sprinter, are packed with mitochondria.'
      - 'Remember: the mitochondrion is the power house of the cell.'
      - 'The trap is A, the nucleus. It controls the cell, but it does not release energy.'
    hint: 'Which organelle is called the power house of the cell?'
    why:
      A: 'The nucleus controls the cell and holds the genes; it does not respire.'
      B: 'The nucleolus makes ribosomes; it does not release energy.'
      C: 'The endoplasmic reticulum carries and helps make proteins and lipids, not energy.'

  34:
    answer: D
    steps:
      - 'Heredity is the passing of characters from parents to offspring. The units that carry them are genes.'
      - 'Genes are made of DNA, and DNA is carried in the chromatin threads of the nucleus. On the drawing, III points to these threads inside the oval nucleus. When the cell divides, the chromatin coils up into chromosomes.'
      - 'So the chromatin (chromosomes) passes the instructions for a mango''s fruit or a goat''s coat colour to the next generation.'
      - 'Remember: chromosomes carry the genes, genes carry the characters.'
      - 'The trap is C, II, the nuclear membrane. It surrounds the chromatin, but it is only a boundary and carries no genes.'
    hint: 'Which label points to the threads inside the nucleus?'
    why:
      A: 'IV is the dark nucleolus, which makes ribosomes; it does not carry the genes.'
      B: 'I is the cell wall, which supports and protects the cell; it carries no hereditary material.'
      C: 'II is the nuclear membrane, which only encloses the nucleus; the genes are in the chromatin.'

  35:
    answer: B
    steps:
      - 'The drawing shows conjugation, the sexual reproduction of Rhizopus, the black bread mould, in three stages.'
      - 'Two hyphae of different strains, plus and minus, grow towards each other. Their tips swell to form gametangia.'
      - 'The gametangia fuse, and their nuclei join in pairs. In the last stage the fused cell has become a zygospore, the dark, thick, warty-walled body that can survive dry conditions.'
      - 'Rhizopus is the black, fluffy mould that grows on stale bread or on damp yam in the kitchen.'
      - 'Remember: plus and minus meet, make a zygospore.'
      - 'The trap is C, Spirogyra. Spirogyra also conjugates, but it is a green alga with filaments of cells, not a fungus with hyphae and gametangia.'
