      B: 'The bicuspid valve is between the left atrium and left ventricle; it is not a vessel.'
      C: 'The aorta is the vessel that arches over the top; it leaves the left ventricle and carries blood to the body, not the lungs.'
      D: 'The vena cava brings blood from the body into the right atrium.'

  40:
    answer: A
    steps:
      - 'Oxygenated blood comes back from the lungs into the left atrium, then flows into the left ventricle, IV, the chamber on the right of the drawing.'
      - 'The left ventricle contracts and pumps it into the aorta, which branches to supply the whole body.'
      - 'This is the hardest job in the heart, so the left ventricle has the thickest muscle wall. You can see this when a butcher cuts open a cow''s heart.'
      - 'Remember: the left ventricle is the strongest pump, because it has the longest round trip.'
      - 'The trap is B, I, the pulmonary artery. It is a vessel, not a pump, and it carries deoxygenated blood to the lungs.'
