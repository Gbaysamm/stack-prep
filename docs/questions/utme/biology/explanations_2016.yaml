format_version: 1
exam_year: 2016
subject: BIO
explanations:
  1:
    answer: C
    steps:
      - 'The Agama lizard is a reptile, and its body is covered with dry, horny scales.'
      - 'The scaly skin protects it in two ways: it stops the body losing water in the hot sun, and it guards the body against injury.'
      - 'Watch the red-headed Agama basking on a hot wall in the harmattan. Its scales let it stay out in dry air without drying up.'
      - 'Remember: scales are the reptile''s raincoat in reverse. They keep water in, and keep harm out.'
      - 'The trap is A or D. The nuchal crest and the gular fold are used in display, when the male nods his head and puffs his throat to warn rivals and attract females.'
    hint: 'Which structure covers the whole body and shields it?'
    why:
      A: 'The nuchal crest on the neck is used in display, not for protection.'
      B: 'Claws help the lizard grip and climb walls and trees; they are for movement, not a protective covering.'
      D: 'The gular fold on the throat is puffed out in display to rivals and mates.'

  2:
    answer: A
    steps:
      - 'Insects feed with their mouthparts, the jaws and lips around the mouth.'
      - 'The mouthparts are shaped for the food: biting and chewing in the grasshopper and cockroach, piercing and sucking in the mosquito, sucking through a long proboscis in the butterfly.'
      - 'The Anopheles mosquito pierces the skin and sucks blood with needle-like mouthparts, which is how it passes on malaria.'
      - 'Remember: the mouth is for feeding, the antennae are for sensing, the legs are for moving.'
      - 'The trap is D. Jointed appendages belong to every arthropod and are mostly for movement, not for taking in food.'
    hint: 'Which body part actually takes in the food?'
    why:
      B: 'Antennae are sense organs for touch and smell.'
      C: 'A segmented body is a general feature of insects, not a feeding adaptation.'
      D: 'Jointed appendages are mainly legs for walking, a feature of all arthropods.'

  3:
    answer: C
    steps:
      - 'Data: parents Yy × Yy, both heterozygous. Rule: each parent gives one allele to each gamete, Y or y, in equal numbers.'
      - 'Gametes: Y and y from the first parent, Y and y from the second.'
      - 'Working (a Punnett square): Y with Y gives YY; Y with y gives Yy; y with Y gives Yy; y with y gives yy.'
      - 'So the offspring are 1 YY : 2 Yy : 1 yy, a genotype ratio of one to two to one.'
      - 'Check: there are four boxes in the square, and 1 + 2 + 1 = 4. If Y is dominant, three of the four show the dominant trait, the familiar 3 : 1.'
      - 'The trap is D. It puts the 2 on yy, but only one of the four boxes gets y from both parents.'
    hint: 'Draw a two by two Punnett square and count each genotype.'
    why:
      A: 'Leaves out YY, which must appear when both parents give Y.'
      B: 'Puts the 2 on YY; only one box in four is YY.'
      D: 'Puts the 2 on yy; only one box in four is yy.'

  4:
    answer: C
    steps:
      - 'The carbon cycle is the movement of carbon between the air (as carbon(IV) oxide) and living things.'
      - 'Photosynthesis takes carbon(IV) oxide into green plants as organic carbon (sugar and starch). Respiration, decomposition and burning return it to the air.'
      - 'When a mango tree''s leaves fall and rot, decomposers break down their organic carbon and release carbon(IV) oxide back to the air.'
      - 'Nitrate formation (nitrification) moves nitrogen, not carbon. It belongs to the nitrogen cycle.'
      - 'Remember: if the word holds "nitr", it is the nitrogen cycle.'
    hint: 'Which process involves nitrogen rather than carbon?'
    why:
      A: 'Organic carbon in living things is a store in the carbon cycle.'
      B: 'Decomposition returns carbon(IV) oxide to the air.'
      D: 'Photosynthesis takes carbon(IV) oxide out of the air.'

  5:
    answer: A
    steps:
      - 'Living things are built in levels: cell, then tissue, then organ, then system, then organism.'
      - 'An organ is a structure made of several tissues working together for one job.'
      - 'A leaf has epidermis, palisade and spongy mesophyll, xylem and phloem, all tissues working together to make food. So a leaf is an organ, IV.'
      - 'A cassava leaf or a mango leaf is one organ of the plant; the roots, stem and leaves together form its systems.'
      - 'The trap is B, tissue. A tissue is one kind of cell, but a leaf holds many kinds of tissue.'
    hint: 'How many different tissues are in a leaf?'
    why:
      B: 'A tissue is one group of similar cells; a leaf is made of many tissues.'
      C: 'A cell is the smallest level; a leaf has millions of cells of many kinds.'
      D: 'A system is several organs together, such as the shoot system.'

  6:
    answer: D
    steps:
      - 'Cellular respiration breaks down glucose to release energy.'
      - 'That energy is trapped in adenosine triphosphate, ATP, made from ADP and phosphate. When the cell needs energy, ATP gives up a phosphate and becomes ADP again.'
      - 'When you run to catch a danfo, your leg muscles use ATP made in their mitochondria.'
      - 'Remember: ATP is the cell''s money. Tri means three phosphates, and the third one holds the energy.'
      - 'The trap is B, ADP. ADP is the "spent" form left after the energy has been used.'
    hint: 'Which molecule has the most phosphate groups?'
    why:
      A: 'Heat is energy lost from the cell, not stored.'
      B: 'ADP is what is left after ATP has released its energy.'
      C: 'AMP has only one phosphate and holds little usable energy.'

  7:
    answer: D
    steps:
      - 'Autotrophs make their own food by photosynthesis.'
      - 'Photosynthesis needs chlorophyll, light, carbon(IV) oxide and water. The green leaf has all of these: chloroplasts, a broad flat surface for light and stomata for gas.'
      - 'The broad green leaves of cassava and yam are their kitchens; the food made there is stored in the tubers.'
      - 'Remember: green means chlorophyll, and chlorophyll means food making.'
      - 'The trap is A. Root hairs take in water and salts, but they have no chlorophyll and cannot make food.'
    hint: 'Where is most of the chlorophyll in a plant?'
    why:
      A: 'Root hairs absorb water and mineral salts; they make no food.'
      B: 'A growing root has no chlorophyll and cannot photosynthesise.'
      C: 'A mature fruit stores food; it does not make it.'

  8:
    answer: D
    steps:
      - 'Iodine is needed by the thyroid gland to make the hormone thyroxine.'
      - 'Without iodine, the thyroid swells as it tries to make more thyroxine. The swelling in the neck is goitre.'
      - 'Goitre used to be common in parts of Nigeria far from the sea; iodised salt, as printed on the packet, now prevents it.'
      - 'Remember: iodine, thyroid, goitre, all three in the neck.'
      - 'The trap is A, beriberi, which is also a deficiency disease, but of vitamin B1.'
    hint: 'Which gland uses iodine, and where is it?'
    why:
      A: 'Beriberi is caused by lack of vitamin B1.'
      B: 'Scurvy is caused by lack of vitamin C.'
      C: 'Rickets is caused by lack of vitamin D or calcium.'

  9:
    answer: D
    steps:
      - 'Natural selection is the process by which organisms with favourable features survive, breed and become established, while the less fit die out.'
      - 'In each generation more young are born than can survive. Those best suited to the area live longer and pass their features on.'
      - 'In the dry Sudan savanna, grasses with deep roots survive the harmattan and spread, while shallow-rooted ones die.'
      - 'Remember Darwin''s phrase: survival of the fittest.'
      - 'The trap is B. Dispersal only carries organisms to a new area; whether they become established there is decided by selection.'
    hint: 'Which process decides who survives?'
    why:
      A: 'Gene mutation makes new features; it does not decide which ones become established.'
      B: 'Dispersal moves organisms but does not pick out the favoured ones.'
      C: 'Overcrowding causes competition; it is not the process of becoming established.'

  10:
    answer: C
    steps:
      - 'The regular rise and fall of sea level is called the tide.'
      - 'It is caused mainly by the pull of the moon (and the sun) on the oceans. There are about two high tides and two low tides each day.'
      - 'On the Lagos coast, the shore between high and low tide is covered and uncovered each day, and the animals there must survive both.'
      - 'Remember: tide and time, both come and go on schedule.'
      - 'The trap is A. Gravity is the cause of the tide, not its name.'
    hint: 'What do fishermen call the daily rise and fall of the sea?'
    why:
      A: 'Gravity causes the tide; it is not the rise and fall itself.'
      B: 'A pull is a force, not the movement of the water.'
      D: 'A zone is a region of the shore, such as the intertidal zone.'

  11:
    answer: A
    steps:
      - 'A producer is a green organism that makes its own food by photosynthesis. In water, producers are algae and water plants.'
      - 'Nymphaea is the water lily. Its green leaves float on the surface to catch light and make food.'
      - 'Water lilies grow in ponds and slow streams across Nigeria, and fish and snails feed on them.'
      - 'Remember: a producer must be green and must live there. Nymphaea is green and lives in water.'
      - 'The trap is C. The planarian lives in water, but it is a flatworm that eats other animals, so it is a consumer.'
    hint: 'Which one is a green plant that lives in water?'
    why:
      B: 'Dryopteris is a fern, a land plant of damp shady places, so it is not a producer of an aquatic habitat.'
      C: 'The planarian is a flatworm and a consumer.'
      D: 'Simulium is the blackfly; its larvae live in water but are consumers.'

  12:
    answer: B
    steps:
      - 'Commensalism is a relationship in which one partner benefits and the other is neither helped nor harmed.'
      - 'The remora sticks to the shark with a sucker on its head. It gets free transport, protection and scraps of the shark''s food. The shark is not harmed.'
      - 'A similar case nearer home is the cattle egret walking beside cows to catch the insects they disturb.'
      - 'Remember: commensals "share the table". One eats, the host is not hurt.'
      - 'The trap is D. Symbiosis (mutualism) needs both partners to benefit, but the shark gains nothing.'
    hint: 'Does the shark gain or lose anything?'
    why:
      A: 'In parasitism the host is harmed; the shark is not.'
      C: 'Saprophytism is feeding on dead, decaying matter, and neither the shark nor the remora does that.'
      D: 'Symbiosis needs both to benefit; only the remora does.'

  13:
    answer: D
    steps:
      - 'From the simplest to the most complex, the levels are cell, tissue, organ, system.'
      - 'Cells of one kind form a tissue; tissues form an organ; organs working together form a system.'
      - 'In a goat, muscle cells form muscle tissue; tissues form the stomach; the stomach and intestines form the digestive system.'
      - 'In the numbers given, cell is III, tissue is I, organ is IV and system is II, so the order is III-I-IV-II.'
      - 'Remember "CTOS": Cell, Tissue, Organ, System.'
    hint: 'Start from the smallest level. Which number is cell?'
    why:
      A: 'Starts with organ and leaves out tissue.'
      B: 'Puts system before cell and organ.'
      C: 'Starts with organ, which is more complex than cell and tissue.'

  14:
    answer: A
    steps:
      - 'An inheritable disease is passed from parents to children in their genes.'
      - 'Poliomyelitis is caused by the polio virus, spread through food and water dirtied with faeces. It is infectious, not inherited.'
      - 'Polio vaccine drops given to Nigerian children protect them; no vaccine can stop a gene being passed on.'
      - 'Sickle-cell anaemia and haemophilia are carried on genes, and some mental illnesses run in families.'
      - 'Remember: if a germ causes it and a vaccine prevents it, it is not inherited.'
    hint: 'Which one is caused by a virus?'
    why:
      B: 'Sickle-cell anaemia is inherited through the HbS gene.'
      C: 'Some mental illnesses run in families and are partly inherited.'
      D: 'Haemophilia is a sex-linked inherited disease.'

  15:
    answer: D
    steps:
      - 'Fingerprints have three main patterns: loops, whorls and arches.'
      - 'In human populations, loops are the commonest, about 60 to 65 out of every 100 fingerprints. Whorls make up about 30, and arches only about 5.'
      - 'Look at your own ten fingers in class: most of them will probably show loops, lines that curve round and come back out on the same side.'
      - 'Remember the order L W A: Loops lots, Whorls fewer, Arches rare.'
      - 'The trap is B. Whorls are common, but second to loops.'
    hint: 'Which pattern, curving in and back out, is seen on most fingers?'
    why:
      A: 'A double loop is a kind of whorl and is uncommon.'
      B: 'Whorls are the second most common, about 30%.'
      C: 'Arches are the rarest pattern, about 5%.'

  16:
    answer: C
    steps:
      - 'Beriberi is a deficiency disease caused by lack of vitamin B1, thiamine.'
      - 'Thiamine helps cells release energy from carbohydrate. Without it, nerves and muscles weaken, the legs become numb and the heart may fail.'
      - 'It was common where people ate only polished rice, because the vitamin is in the husk. Brown rice, beans and whole grains supply it.'
      - 'Remember: B for beriberi, B for vitamin B.'
      - 'The trap is B. Vitamin E protects cell membranes; its lack does not cause beriberi.'
    hint: 'Beriberi and which vitamin start with the same letter?'
    why:
      A: 'Lack of vitamin A causes night blindness.'
      B: 'Vitamin E deficiency is rare and does not cause beriberi.'
      D: 'Lack of vitamin C causes scurvy.'

  17:
    answer: C
    steps:
      - 'Nitrogen fixation turns nitrogen gas from the air into nitrogen compounds that plants can use.'
      - 'Nitrogen-fixing bacteria such as Rhizobium live in the root nodules of legumes; Azotobacter lives free in the soil.'
      - 'Farmers plant groundnut or cowpea to enrich the soil, because the bacteria in their root nodules add nitrogen.'
      - 'Remember: fixing means taking from the air and putting into the soil.'
      - 'The trap is B. Nitrifying bacteria make nitrates from ammonia already in the soil; they do not take nitrogen from the air.'
    hint: 'Which bacteria take nitrogen gas from the air?'
    why:
      A: 'Putrefying bacteria decay dead matter into ammonia.'
      B: 'Nitrifying bacteria turn ammonia into nitrates; they use nitrogen already in the soil.'
      D: 'Denitrifying bacteria return nitrogen from the soil to the air.'

  18:
    answer: B
    steps:
      - 'The hedgehog''s back is covered with sharp spines, which are stiff, hollow hairs.'
      - 'When it is attacked, it rolls into a tight ball so that only the spines face outward. A predator cannot bite it without getting hurt.'
      - 'The African hedgehog of the Nigerian savanna does this when a dog or snake comes near.'
      - 'Remember: spines and thorns are for defence, on a hedgehog or on a lemon tree.'
      - 'The trap is C. Spines on a cactus save water, but the hedgehog''s spines are hairs used for protection.'
    hint: 'What does a hedgehog do when a dog sniffs at it?'
    why:
      A: 'The spines play no part in courtship.'
      C: 'The hedgehog''s spines are modified hairs, not a way of saving water.'
      D: 'The hedgehog finds insects with its nose; the spines do not catch food.'

  19:
    answer: D
    steps:
      - 'A dental formula shows the teeth in one half of the upper jaw over one half of the lower jaw: incisors (I), canines (C), premolars (pm) and molars (m).'
      - 'A carnivore such as the dog has a full set of incisors for nipping meat, long canines for gripping and stabbing prey, and carnassial cheek teeth for slicing.'
      - 'The dog''s formula is I 3/3, C 1/1, pm 4/4, m 2/3, which is D.'
      - 'Check: one side has 3 + 1 + 4 + 2 = 10 upper and 3 + 1 + 4 + 3 = 11 lower teeth. Doubling 21 gives 42 teeth in all.'
      - 'The trap is A. Its I 0/3 means no upper incisors, as in a goat or cow, which grazes against a horny pad; a dog must have upper incisors.'
    hint: 'Does a dog have front teeth in its upper jaw?'
    why:
      A: 'No upper incisors is a feature of grazers such as the goat, not of carnivores.'
      B: 'It has no upper incisors, which a dog needs for nipping meat, and four lower molars where the dog has three.'
      C: 'It gives two upper canines on each side; every mammal has at most one canine in each half jaw.'

  20:
    answer: A
    steps:
      - 'Temperature is measured with a thermometer.'
      - 'In ecology, a maximum and minimum thermometer records the highest and lowest temperature of a habitat in a day.'
      - 'A school weather station keeps one in a Stevenson screen, which shows how hot afternoons become in the dry season.'
      - 'Remember: thermo means heat, as in a thermos flask.'
      - 'The trap is B. A hygrometer also stands in the weather station, but it measures humidity.'
    hint: 'Which word begins with the Greek word for heat?'
    why:
      B: 'A hygrometer measures relative humidity.'
      C: 'An anemometer measures wind speed.'
      D: 'A hydrometer measures the density of a liquid.'

  21:
    answer: C
    steps:
      - 'The kidneys control the amount of water in the body by changing how much urine they make (osmoregulation).'
      - 'When the kidneys malfunction, they fail to remove excess water and salt. The fluid collects in the tissues, causing puffiness (oedema), often around the eyes and ankles.'
      - 'A doctor seeing swollen feet and a puffy face in a patient will test the kidneys, for example for kidney disease caused by high blood pressure.'
      - 'Remember: kidneys keep the water balance, so failing kidneys mean water stays in.'
      - 'The trap is A. The bladder only stores urine; it does not decide how much water leaves the blood.'
    hint: 'Which organ decides how much water leaves the blood?'
    why:
      A: 'The bladder only stores urine until it is passed out.'
      B: 'Poor digestion causes indigestion or diarrhoea, not water retention.'
      D: 'Obesity is excess body fat, not water held in the tissues.'

  22:
    answer: B
    steps:
      - 'Charles Darwin proposed that all living things descended from common ancestors and changed slowly by natural selection.'
      - 'He showed that related species, such as the finches of the Galapagos Islands, share features because they came from one ancestor.'
      - 'The same idea explains why the arm of a man, the wing of a bat and the flipper of a whale share the same bones.'
      - 'Remember: Darwin, descent with change from a common ancestor.'
      - 'The trap is C. Lamarck also wrote about evolution, but his theory was about use and disuse of organs and the passing on of acquired characters.'
    hint: 'Whose theory spoke of natural selection and common descent?'
    why:
      A: 'Linnaeus built the system of naming and classification.'
      C: 'Lamarck''s theory was use and disuse and inheritance of acquired characters.'
      D: 'Mendel discovered the laws of inheritance, not evolution.'

  23:
    answer: C
    steps:
      - 'Roughage (dietary fibre) is the indigestible part of plant food, mainly cellulose.'
      - 'It adds bulk to the food in the gut, so the gut muscles can grip it and push it along by peristalsis. This eases digestion and prevents constipation.'
      - 'Vegetables, fruits, beans and whole grains, such as ugu leaves and unpolished rice, are good sources.'
      - 'Remember: roughage is the gut''s broom; it sweeps food along.'
      - 'The trap is A. Roughage cannot be digested by humans, so it gives almost no energy.'
    hint: 'What happens in the gut when food has more bulk?'
    why:
      A: 'Humans cannot digest roughage, so it gives us almost no energy; its job is to add bulk.'
      B: 'Roughage does not slow down ageing.'
      D: 'Fibre may lower the risk of some bowel problems, but its main job is bulk for peristalsis; disease is fought mainly by vitamins and the body''s defences.'

  24:
    answer: B
    steps:
      - 'Variation is the difference between individuals of the same kind.'
      - 'Cross-fertilisation joins a male gamete from one parent with a female gamete from another, so each zygote gets a new mix of genes.'
      - 'This is why two children of the same parents, or two seedlings from one maize cob, are not identical.'
      - 'Remember: two parents, new mix, variety.'
      - 'The trap is C. Binary fission splits one parent into two identical copies, so it gives no variation.'
    hint: 'Which way of reproducing mixes genes from two parents?'
    why:
      A: 'Self-pollination uses one parent, so it gives less variation than cross-fertilisation.'
      C: 'Binary fission makes identical copies of one parent.'
      D: 'Reproduction without fertilisation gives offspring identical to the parent.'

  25:
    answer: A
    steps:
      - 'Abiotic factors are the non-living parts of the environment, such as temperature, rainfall, light, wind and soil.'
      - 'Temperature and rainfall matter most, because together they decide which plants can grow in a place. The plants then decide which animals can live there.'
      - 'In Nigeria, heavy rain and warmth in the south give rainforest, while low rain in the north gives the Sudan savanna.'
      - 'Remember: warm plus wet means forest; warm plus dry means grassland.'
      - 'The trap is B. Turbidity, the cloudiness of water, matters only in aquatic habitats.'
    hint: 'Which two factors decide whether a place is forest or grassland?'
    why:
      B: 'Turbidity only affects life in water.'
      C: 'Salinity matters mainly in the sea and lagoons, and relative humidity counts for less than rainfall.'
      D: 'Relative humidity matters, but it largely follows rainfall, and this pair leaves out temperature.'

  26:
    answer: D
    steps:
      - 'Living things are classified in ranks: kingdom, phylum, class, order, family, genus, species.'
      - 'The species is the lowest unit. Its members are so alike that they can breed together and produce fertile young.'
      - 'All goats are one species, Capra hircus; a goat and a sheep are different species.'
      - 'Remember the order with "King Philip Came Over For Good Soup", from the biggest group down to the smallest.'
      - 'The trap is A. Kingdom is at the other end; it is the highest and biggest unit.'
    hint: 'Which rank is the smallest group of very similar organisms?'
    why:
      A: 'Kingdom is the highest unit, the largest group.'
      B: 'Class is a middle rank, above order and below phylum.'
      C: 'Phylum is the second highest rank.'

  27:
    answer: D
    steps:
      - 'Plants take in and move materials by osmosis and diffusion.'
      - 'Osmosis is the movement of water through a selectively permeable membrane from a dilute to a concentrated solution. It brings water into root hairs.'
      - 'Diffusion is the movement of particles from a region of high to low concentration. It moves gases in the leaves and some salts in the root.'
      - 'A wilted ugu leaf put in water becomes firm again as water enters its cells by osmosis.'
      - 'The trap is A. Flaccidity and turgidity are states of a cell, the results of osmosis, not processes of transport.'
    hint: 'Name the two ways substances move across membranes without being pumped.'
    why:
      A: 'Flaccidity and turgidity are conditions of cells, not transport processes.'
      B: 'Plasmolysis is the shrinking of a cell''s contents away from its wall when it loses water; it is a state, not a means of transport.'
      C: 'Capillarity helps water rise a little in the narrow xylem, but plasmolysis is not a means of transport.'

  28:
    answer: B
    steps:
      - 'A food chain is a single series of organisms in which each one feeds on the one before it.'
      - 'Energy is passed along the chain from the producer to the consumers, and some is lost as heat at each step.'
      - 'Example: grass to grasshopper to lizard to hawk. Each arrow means "is eaten by".'
      - 'Remember: a chain is one line; a web is many lines crossing.'
      - 'The trap is D. A food web is many food chains joined together, not one series.'
    hint: 'Is the question about one line of feeding or many linked lines?'
    why:
      A: 'There is no "food cycle"; energy flows one way and is not recycled.'
      C: 'A pyramid of numbers counts the organisms at each level; it is not the series itself.'
      D: 'A food web is many food chains linked, not a single series.'

  29:
    answer: D
    steps:
      - 'The mitochondrion is the organelle of aerobic respiration.'
      - 'Glucose is broken down there with oxygen to release energy, which is stored as ATP. Its inner membrane is folded into cristae to give a large surface for the enzymes.'
      - 'Muscle cells and sperm cells, which use a lot of energy, are packed with mitochondria.'
      - 'Remember: the mitochondrion is the powerhouse of the cell.'
      - 'The trap is C. The endoplasmic reticulum is a network that makes and carries proteins and fats, not energy.'
    hint: 'Which organelle is called the powerhouse of the cell?'
    why:
      A: 'The nucleus controls the cell and holds the chromosomes.'
      B: 'The nucleolus makes ribosomes.'
      C: 'The endoplasmic reticulum makes and transports proteins and lipids.'

  30:
    answer: B
    steps:
      - 'Mangrove swamps are forests of salt-tolerant trees on muddy coasts flooded by tides.'
      - 'Mangroves need brackish water, where river water meets the sea. Their stilt roots hold them in soft mud and their breathing roots (pneumatophores) take in air.'
      - 'Nigeria''s largest mangroves line the creeks of the Niger Delta, in Rivers, Bayelsa and Delta States, and parts of the Lagos coast.'
      - 'Remember: mangroves meet the sea, and the Delta meets the sea.'
      - 'The trap is D. The Mambilla Plateau is high, cool montane grassland, far from the sea.'
    hint: 'Where do Nigerian rivers meet salty sea water?'
    why:
      A: 'The Chad Basin is dry Sudan and Sahel savanna in the far north.'
      C: 'The Benue Valley is Guinea savanna, inland and fresh water.'
      D: 'The Mambilla Plateau is a cool highland grassland.'

  31:
    answer: C
    steps:
      - 'Selective breeding is choosing parents with useful features and mating them, to improve a crop or breed.'
      - 'There are two methods. Inbreeding mates closely related individuals to keep a good feature pure. Outbreeding mates unrelated individuals to combine good features and give hybrid vigour.'
      - 'Crossing the hardy local Muturu cow with a high-milk foreign breed is outbreeding; improved maize varieties are made the same way.'
      - 'Remember: in means related, out means unrelated.'
      - 'The trap is A. Grafting joins a shoot to a rooted stock to propagate a plant. It makes no new combination of genes, so it is not a breeding method.'
    hint: 'If inbreeding is one method, what is its opposite?'
    why:
      A: 'Grafting propagates a plant; it is not a method of breeding.'
      B: '"Hetero-breeding" is not a recognised breeding method.'
      D: 'Self-breeding is only an extreme form of inbreeding, not a second method.'

  32:
    answer: D
    steps:
      - 'Rule: the smaller an organism, the larger its surface area compared with its volume.'
      - 'A tiny cell such as Amoeba has a large surface area to volume ratio, and no part of it is far from the surface. Diffusion through the surface is fast enough to supply every part.'
      - 'A goat is too big for this: its inner cells are far from the surface, so it needs blood and a heart to carry materials.'
      - 'Check: halving the side of a cube doubles the ratio of surface to volume, so small cells really do have more surface for their size.'
      - 'The trap is A, which states the rule backwards. A small ratio is the problem of big organisms.'
    hint: 'Small things have a lot of surface for their size. Large or small ratio?'
    why:
      A: 'A small ratio belongs to large organisms, which is why they need a transport system.'
      B: 'Unicellular organisms have no lungs; gases cross the cell membrane.'
      C: 'Long distances are found in large organisms; in a single cell the distances are short.'

  33:
    answer: C
    steps:
      - 'The spinal cord is the bundle of nerve tissue running down inside the backbone.'
      - 'It carries sensory impulses from the body up to the brain and motor impulses from the brain down to the body. It also works simple reflex actions, such as pulling your hand from a hot pot.'
      - 'When a person injures the spinal cord in a road accident, messages cannot pass between the brain and the legs, and the legs are paralysed.'
      - 'Remember: the spinal cord is the main cable between the brain and the body.'
      - 'The trap is B. Voluntary actions, such as writing, are controlled by the cerebrum of the brain.'
    hint: 'What links the brain to the rest of the body?'
    why:
      A: 'The vertebral column and muscles hold the body erect, not the spinal cord.'
      B: 'Voluntary actions are controlled by the cerebrum.'
