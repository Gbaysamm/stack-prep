format_version: 1
exam_year: 2017
subject: BIO
explanations:
  1:
    answer: B
    steps:
      - 'Piercing and sucking mouthparts form a long, needle-like proboscis that stabs through skin or plant tissue and draws up liquid.'
      - 'The female mosquito pushes her stylets through the skin, finds a capillary and sucks up blood. She needs the blood to make her eggs.'
      - 'This is how the Anopheles mosquito passes on Plasmodium, the malaria parasite, in Nigerian homes at night.'
      - 'Remember: the mosquito is a flying syringe. Grasshoppers, termites and cockroaches chew their food with jaws called mandibles.'
      - 'The trap is the housefly idea. Houseflies sponge up food; only insects like the mosquito pierce.'
    hint: 'Which of these insects feeds on liquid blood rather than solid food?'
    why:
      A: 'A grasshopper has biting and chewing mouthparts for cutting leaves.'
      C: 'Termites chew wood and dead plant matter with strong mandibles.'
      D: 'A cockroach has biting and chewing mouthparts and eats almost anything solid.'

  2:
    answer: B
    steps:
      - 'Plant hormones (growth substances) are made in small amounts and control how a plant grows.'
      - 'Auxins make cells elongate behind the shoot tip and cause bending towards light. Gibberellins make stems lengthen and help seeds germinate.'
      - 'Ethylene ripens fruit and abscisic acid closes stomata and keeps buds and seeds dormant, so these two slow growth rather than promote it.'
      - 'A Nigerian example: unripe plantain kept in a closed bag with a ripe one ripens faster, because the ripe one gives off ethylene.'
      - 'Remember "A and G make it Grow". The trap is C: cytokinins do help cell division, but abscisic acid is an inhibitor.'
    hint: 'Two hormones on the list mostly slow growth down. Leave them out.'
    why:
      A: 'Ethylene ripens fruit and causes leaf fall; it does not promote growth.'
      C: 'Abscisic acid inhibits growth and causes dormancy.'
      D: 'Ethylene is a ripening and ageing hormone, not a growth promoter.'

  3:
    answer: D
    steps:
      - 'Parasitism is an association in which one organism, the parasite, lives on or in another, the host, and feeds on it, harming the host.'
      - 'The tsetse fly sucks the blood of cattle. The cow loses blood and may also be given trypanosomes, which cause sleeping sickness (nagana) in cattle.'
      - 'This is why cattle herders in the Guinea savanna avoid tsetse-infested river valleys.'
      - 'Remember: in parasitism one gains and one loses. Cattle and egret, and shark and remora, are not like that.'
      - 'The trap is B. The egret follows cattle to eat the insects they disturb and does them no harm.'
    hint: 'In which pair does one partner feed on the other and harm it?'
    why:
      A: 'Insect and plant names no one association: a bee pollinating a flower helps both, and a grasshopper eating leaves is a herbivore, not a parasite living on its host.'
      B: 'The cattle egret eats insects stirred up by grazing cattle; the cattle are not harmed.'
      C: 'The remora rides on the shark and eats its scraps, without harming it; this is commensalism.'

  4:
    answer: A
    steps:
      - 'Arid land is very dry and hot, so its animals must save water and stand the heat.'
      - 'The locust has a waterproof cuticle and makes dry uric acid. The camel stores fat in its hump, makes little urine and can lose much water safely. Lizards and snakes have dry scaly skin and excrete uric acid.'
      - 'Such animals are found in the far north of Nigeria, near Lake Chad and the Sahel, where the harmattan dries everything.'
      - 'Remember: dry skin, dry waste and good water saving. Every animal in the group must pass, not just one.'
      - 'The trap is B or C. Each has one desert-type animal, but earthworms and snails need damp places.'
    hint: 'Check every animal in each list. Which list has no animal that needs damp surroundings?'
    why:
      B: 'The earthworm breathes through a moist skin and dies quickly in dry soil.'
      C: 'The snail loses water through its moist body and needs damp places.'
      D: 'The lungfish and the duck depend on water bodies.'

  5:
    answer: C
    steps:
      - 'A suture is an immovable (fixed) joint, where bones are locked together by wavy edges and tough fibres.'
      - 'The bones of the cranium meet at sutures, so the skull forms one strong box that protects the brain.'
      - 'In a newborn baby the sutures are not yet closed; the soft spot on top of the head is where they meet.'
      - 'Remember: a suture is a "stitch", like the stitch line a tailor sews, and the skull is stitched together.'
      - 'The trap is the hip or the elbow. Those are movable synovial joints.'
    hint: 'Which of these places has bones that never move against each other?'
    why:
      A: 'The hip is a ball and socket joint that moves freely.'
      B: 'The ankle joint moves, letting the foot bend up and down.'
      D: 'The elbow is a hinge joint that bends and straightens the arm.'

  6:
    answer: C
    steps:
      - 'Osmoregulation is the control of the water and salt content of the body.'
      - 'Paramecium lives in fresh water, which enters its cytoplasm by osmosis. The contractile vacuole collects the extra water, swells, and then contracts to push it out through the cell membrane.'
      - 'Without it, a Paramecium in a pond or the fresh water of a stream would swell and burst.'
      - 'Remember: contractile vacuole, the cell''s water pump.'
      - 'The trap is A, flame cell, which does a similar job in flatworms, not in single-celled protozoa.'
    hint: 'Paramecium is a single cell. Which option is found inside one cell?'
    why:
      A: 'Flame cells are the excretory cells of flatworms such as Planaria.'
      B: 'Nephridia are the excretory organs of earthworms.'
      D: 'Malpighian tubules are the excretory organs of insects.'

  7:
    answer: C
    steps:
      - 'Drawing III is the nephridium, the excretory organ of the earthworm. There is a pair in almost every segment.'
      - 'Look at its parts in the drawing. A small ciliated funnel at the top opens into the body cavity, a thin tube leads into a coil of long loops where useful substances go back into the blood, and the waste collects in a small bladder that opens through a pore on the body surface.'
      - 'Earthworms in damp garden soil after the rains get rid of a dilute urine this way.'
      - 'Remember: N for nephridium and N for the worm''s "nearly every segment". A funnel and a coiled tube mean a worm.'
      - 'The trap is A. Drawing IV shows thin tubules on a gut, which are the Malpighian tubules of an insect, not of a worm.'
    hint: 'Match each drawing to its animal: flatworm, earthworm, insect, mammal. Which one has a ciliated funnel and a coiled tube?'
    why:
      A: 'IV shows Malpighian tubules, blind tubes joined to the gut of an insect such as the cockroach.'
      B: 'I shows a flame cell, a cell with a beating tuft of cilia, found in flatworms such as Planaria and the tapeworm.'
      D: 'II shows a kidney cut open, the excretory organ of vertebrates such as the goat.'

  8:
    answer: B
    steps:
      - 'Platelets (thrombocytes) are small cell fragments in the blood.'
      - 'At a cut, platelets break and release thrombokinase. This starts a chain that turns prothrombin into thrombin, and thrombin turns soluble fibrinogen into fibrin threads that trap blood cells into a clot.'
      - 'When a child cuts a finger on a broken bottle, the bleeding soon stops because the platelets start a clot.'
      - 'Remember: platelets plug.'
      - 'The trap is A. Red blood cells, with haemoglobin, carry oxygen.'
    hint: 'What must happen first to stop a wound from bleeding?'
    why:
      A: 'Red blood cells carry oxygen, using haemoglobin.'
      C: 'Carbon(IV) oxide is carried mainly by the plasma, as hydrogencarbonate ions.'
      D: 'White blood cells destroy micro-organisms.'

  9:
    answer: D
    steps:
      - 'Vegetation zones are the main kinds of plant cover in a region, such as rainforest, savanna and desert.'
      - 'In the tropics the temperature is warm all year, so the amount of rain and the length of the rainy season decide what can grow.'
      - 'In Nigeria, heavy rain in the south gives rainforest, less rain in the middle gives Guinea savanna, and the dry north gives Sudan and Sahel savanna.'
      - 'Remember: from Lagos to Sokoto, the rain falls and so do the trees.'
      - 'The trap is C. Temperature matters on mountains, but across Nigeria it changes much less than rainfall does.'
    hint: 'Think of the journey from the coast to the far north. What changes most?'
    why:
      A: 'Light is plentiful all over the tropics, so it does not separate the vegetation belts.'
      B: 'Wind affects single plants but does not decide the main vegetation type.'
      C: 'Tropical temperatures are warm all year; rainfall varies far more from zone to zone.'

  10:
    answer: C
    steps:
      - 'The starch test on a leaf has four steps: boil it in water, boil it in alcohol, dip it in hot water, then add iodine solution.'
      - 'Boiling in water kills the cells and breaks their membranes. Boiling in alcohol removes the chlorophyll, but it leaves the leaf hard and brittle.'
      - 'Dipping the decolourised leaf in hot water softens it again, so it can be spread flat and the iodine can soak in.'
      - 'Try it with a cassava or hibiscus leaf in the school laboratory: straight out of the alcohol, the leaf cracks if you bend it.'
      - 'The trap is D. The alcohol removes the chlorophyll, and that has already happened when the leaf is decolourised.'
    hint: 'The leaf is already colourless. What does the alcohol do to its texture?'
    why:
      A: 'Iodine solution detects the starch, turning blue-black.'
      B: 'The leaf is killed by the first boiling in water, before the alcohol.'
      D: 'The chlorophyll was removed by the alcohol, which is why the leaf is decolourised.'

  11:
    answer: D
    steps:
      - 'Commensalism is an association in which one partner gains and the other is neither helped nor harmed.'
      - 'The remora fixes itself to the shark with a sucker on its head. It gets a free ride, protection and scraps from the shark''s meals, while the shark is not affected.'
      - 'A similar case at home is the cattle egret walking beside a grazing cow to catch the insects it disturbs.'
      - 'Remember: commensals "eat at the same table" (com-mensa), sharing the meal without hurting the host.'
      - 'The trap is C. In mutualism both partners must gain, and the shark gains nothing.'
    hint: 'Does the shark gain, lose or stay the same?'
    why:
      A: 'The remora does not feed on the shark or harm it.'
      B: 'In amensalism one partner is harmed and the other unaffected; neither is harmed here.'
      C: 'Mutualism needs both partners to benefit; the shark gets nothing.'

  12:
    answer: C
    steps:
      - 'Fresh water, in rivers, streams, lakes and ponds, has a very low salt content (low salinity).'
      - 'This is what sets it apart from sea water and brackish water, and its organisms must cope with water entering their bodies by osmosis.'
      - 'The River Niger and Kainji Lake are fresh water; the Lagos lagoon is brackish because the sea mixes into it.'
      - 'Remember: fresh means not salty.'
      - 'The trap is A or D. Some fresh waters are muddy or fast, but many are clear or still.'
    hint: 'What does every freshwater habitat have in common, whether it is a pond or a river?'
    why:
      A: 'Turbidity varies; many ponds and lakes are clear.'
      B: 'Sea water, with its dissolved salts, is denser than fresh water.'
      D: 'Ponds and lakes have hardly any current; only rivers and streams flow fast.'

  13:
    answer: C
    steps:
      - 'Cholera is caused by the bacterium Vibrio cholerae, a comma-shaped rod.'
      - 'It spreads in water or food dirtied by the faeces of a sick person. In the gut it gives out a toxin that causes severe watery diarrhoea and fast dehydration.'
      - 'Outbreaks happen in Nigeria when wells and streams are polluted during the rainy season; boiling water and oral rehydration salts save lives.'
      - 'Remember: Vibrio, the vicious comma that empties the gut.'
      - 'The trap is D. Salmonella typhi causes typhoid fever, another water-borne disease.'
    hint: 'Which of these bacteria is comma-shaped?'
    why:
      A: 'Clostridium causes tetanus and botulism.'
      B: 'Shigella causes bacillary dysentery.'
      D: 'Salmonella typhi causes typhoid fever.'

  14:
    answer: D
    steps:
      - 'Photosynthesis has a light stage and a dark (light-independent) stage.'
      - 'In the light stage, light splits water (photolysis), giving oxygen, hydrogen and energy (ATP).'
      - 'In the dark stage, the hydrogen from the light stage is added to carbon(IV) oxide to make sugar. Adding hydrogen is reduction.'
      - 'So the leaves of a mango tree reduce carbon(IV) oxide to sugar, using energy captured in the light stage.'
      - 'Remember: light splits water, dark builds sugar. The trap is B, photolysis, which needs light.'
    hint: 'Which stage needs light? The other stage uses what it produced.'
    why:
      A: 'Water is oxidised to oxygen when light splits it, and that happens in the light stage, not the dark stage.'
      B: 'Photolysis means splitting by light, so it is part of the light stage.'
      C: 'Carbon(IV) oxide gains hydrogen and is reduced, not oxidised.'

  15:
    answer: D
    steps:
      - 'Chlorofluorocarbons (CFCs) are gases made of chlorine, fluorine and carbon.'
      - 'They were used as coolants in refrigerators and air conditioners, and as propellants in aerosol sprays. When they leak they rise and destroy the ozone layer.'
      - 'An old fridge or air conditioner dumped at a scrap yard can leak CFCs into the air.'
      - 'Remember: CFCs keep things Cool, and that is where they come from.'
      - 'The trap is C. Car exhaust gives carbon monoxide and oxides of nitrogen, not CFCs.'
    hint: 'Where would a gas used to keep things cold be found?'
    why:
      A: 'Oil refining gives off sulphur(IV) oxide and hydrocarbons, not CFCs.'
      B: 'Coal mining gives dust and methane, not CFCs.'
      C: 'Exhaust fumes contain carbon monoxide, lead and nitrogen oxides, not CFCs.'

  16:
    answer: D
    steps:
      - 'The levels of organisation are cell, tissue, organ and system. An organ is a structure made of several tissues working together.'
      - 'An onion bulb is a modified shoot of short stem and fleshy leaves. It has epidermis, storage tissue and vascular tissue, so it is an organ.'
      - 'Paramecium is a single cell, Volvox is a colony of similar cells, and Hydra has two layers of tissue but no true organs.'
      - 'Remember the ladder: cell, tissue, organ, system, organism.'
      - 'The trap is C. Hydra is many-celled but stops at the tissue level.'
    hint: 'Which option is made of several different tissues joined into one structure?'
    why:
      A: 'Volvox is a colony of similar cells, at the cell level.'
      B: 'Paramecium is one cell, at the cell level.'
      C: 'Hydra has tissues but no organs, so it is at the tissue level.'

  17:
    answer: D
    steps:
      - 'Binary fission is the splitting of one cell into two equal daughter cells.'
      - 'The nucleus divides, then the cytoplasm divides. No special structure, no partner and no gamete is needed.'
      - 'Amoeba in a pond and bacteria in spoilt food multiply in this way, very fast.'
      - 'Remember: binary means two, one becomes two.'
      - 'The trap is B. Budding is also simple, but the parent must first grow an outgrowth, as in yeast and Hydra.'
    hint: 'Which method needs nothing more than a cell splitting in half?'
    why:
      A: 'Conjugation needs two cells to exchange nuclear material, so it is more complex.'
      B: 'Budding needs an outgrowth that grows and then breaks off.'
      C: 'Spore formation needs a special spore case (sporangium).'

  18:
    answer: A
    steps:
      - 'A wind-pollinated flower does not need to attract insects, so it spends nothing on attraction.'
      - 'It is small and dull, has no scent and no nectar, makes large amounts of light, dry pollen, and has feathery stigmas hanging out to catch it.'
      - 'Maize and guinea grass are wind-pollinated; in the harmattan their pollen blows across the farm.'
      - 'Remember: wind needs no bribe, so no nectar.'
      - 'The trap is B. Bright, conspicuous flowers belong to insect-pollinated plants such as the hibiscus.'
    hint: 'Nectar is a reward. Who would a wind-pollinated flower be rewarding?'
    why:
      B: 'Conspicuous flowers are a sign of insect pollination.'
      C: 'Wind-pollinated flowers have a tiny, dull perianth or none at all, so the stamens and stigmas hang out in the wind; a showy perianth marks an insect-pollinated flower.'
      D: 'Many wind-pollinated plants, such as maize, have separate male and female flowers.'

  19:
    answer: D
    steps:
      - 'Drawing II is the kidney, cut lengthwise. You can see the outer cortex, the striped pyramids of the medulla, the pelvis and the ureter.'
      - 'The loops of Henle are the U-shaped parts of the nephrons, and they dip down into those pyramids. They make the medulla very salty, so as the filtrate passes down the collecting ducts water is drawn out by osmosis and returns to the blood. A concentrated urine is made.'
      - 'This is how a goat or a camel in the dry north saves water during the harmattan.'
      - 'Remember: the longer the loop, the drier the land the animal can live in.'
      - 'The trap is A. Insects save water too, but their Malpighian tubules (IV) and rectum have no loops of Henle.'
    hint: 'Loops of Henle are found inside nephrons. Which drawing shows the organ made of nephrons, with a cortex, a medulla and a ureter?'
    why:
      A: 'IV shows Malpighian tubules, which have no loops of Henle; insects save water by making uric acid and taking water back in the rectum.'
      B: 'I shows a flame cell of a flatworm, which removes water from the body and has no loop of Henle.'
      C: 'III shows the nephridium of the earthworm, which makes a dilute urine and has no loop of Henle.'

  20:
    answer: D
    steps:
      - 'Gametes are made by meiosis, a cell division that halves the number of chromosomes.'
      - 'A human body cell has 46 chromosomes. Meiosis gives sperm and egg cells with 23 each, so at fertilisation the zygote gets back to 46.'
      - 'Meiosis happens in the testes and ovaries of a goat or a cow, and in the anthers and ovules of a flowering plant.'
      - 'Remember: meiosis makes the "me-half" cells.'
      - 'The trap is C. Mitosis gives exact copies with the full number, used for growth and repair.'
    hint: 'A gamete must have half the chromosomes of a body cell. Which division halves them?'
    why:
      A: 'Implantation is the embryo sinking into the uterus wall, after fertilisation.'
      B: 'Fertilisation is the fusing of gametes that are already made.'
      C: 'Mitosis keeps the full chromosome number, so it cannot make gametes.'

  21:
    answer: D
    steps:
      - 'Data: dish = 20 g, dry soil = 7.5 g, dish + soil after burning = 25 g. Percentage of humus = ?'
      - 'Rule: humus is organic matter, and it burns away on heating. Loss in mass ÷ mass of dry soil × 100 gives the percentage of humus.'
      - 'Before burning: 20 + 7.5 = 27.5 g. Loss in mass = 27.5 − 25 = 2.5 g.'
      - '% humus = 2.5 ÷ 7.5 × 100 = 33.3%.'
      - 'Check: 2.5 g is one third of 7.5 g, and one third is 33.3%.'
      - 'The trap is B, 37.5%. It treats the 7.5 g as if it were the humus in 20 g of soil, mixing up the dish and the soil.'
    hint: 'Find the mass of dish and soil before burning. How much was lost?'
    why:
      A: 'Divides the 2.5 g loss by the 27.5 g of dish and soil, instead of by the soil alone.'
      B: 'Divides 7.5 by 20, mixing up the soil and the dish, instead of using the 2.5 g burnt away.'
      C: 'Divides the 2.5 g loss by the 20 g dish instead of by the 7.5 g of soil.'

  22:
    answer: C
    steps:
      - 'Termites and earthworms are soil animals that tunnel through the soil and feed on dead plant matter.'
      - 'Their burrows let air into the soil (aeration) and help rain water drain in.'
      - 'They pull leaves into the soil and break them down, and earthworm casts are rich in minerals, so the soil becomes more fertile.'
      - 'Farmers in Nigeria like to see earthworm casts on a yam or cassava farm because they mark good soil.'
      - 'Remember: tunnels bring air, digestion brings food. The trap is B, which names the effects of the tunnels twice and leaves out fertility.'
    hint: 'One benefit comes from their burrowing; the other comes from their feeding. Which pair covers both?'
    why:
      A: 'Fertility is right and the tunnels do open up the soil, but the gain from the tunnels that matters most to roots is the air they let in, and this pair leaves aeration out.'
      B: 'Porosity and aeration both come from the same tunnels; the pair leaves out the fertility their feeding adds.'
      D: 'Soil animals do not make the soil acidic; earthworm casts are nearly neutral.'

  23:
    answer: D
    steps:
      - 'Data: quadrat = 1.6 m², thrown 50 times, total count = 400 Tridax plants. Density = ?'
      - 'Rule: density = number of organisms ÷ total area sampled.'
      - 'Area sampled = 50 × 1.6 = 80 m².'
      - 'Density = 400 ÷ 80 = 5 Tridax plants per m².'
      - 'Check: there are 8 plants in each throw on average, spread over 1.6 m², which is 5 per m². The 15 m² of the habitat is only needed for the total number, about 5 × 15 = 75 plants.'
      - 'The trap is C, 8. That is plants per quadrat throw, not per square metre.'
    hint: 'Find the total area the 50 throws covered first.'
    why:
      A: '12 does not come from the data; the 400 plants were counted on 50 × 1.6 = 80 m², and 400 ÷ 80 = 5.'
      B: '16 comes from 400 ÷ (15 × 1.6), which mixes the habitat area with the quadrat size; the area sampled is 50 × 1.6 = 80 m², giving 5.'
      C: '8 is the average number per throw of the 1.6 m² quadrat, not per m².'

  24:
    answer: D
    steps:
      - 'A sex-linked character is controlled by a gene carried on the X chromosome.'
      - 'A man has only one X, so one faulty allele shows. A woman has two, so she is usually a carrier. That is why red-green colour blindness is far more common in men.'
      - 'A carrier mother (XᴺXⁿ) can pass colour blindness to half her sons, while their father has normal vision.'
      - 'Remember the famous pair of sex-linked traits: colour blindness and haemophilia.'
      - 'The trap is B. Albinism is inherited, but its gene is on an ordinary chromosome (an autosome), so it is not sex-linked.'
    hint: 'Which trait is far more common in boys than in girls?'
    why:
      A: 'Dwarfism is controlled by genes on autosomes, not on the X chromosome.'
      B: 'Albinism is carried on an autosome and is found equally in males and females.'
      C: 'Tongue rolling is an autosomal trait.'

  25:
    answer: C
    steps:
      - 'The outermost layer of a young (herbaceous) root is the epidermis, also called the piliferous layer.'
      - 'It is one cell thick and many of its cells grow out as root hairs, which take in water and mineral salts from the soil.'
      - 'Pull up a young bean seedling and look with a hand lens: the fine white root hairs come from the epidermis.'
      - 'Remember the root from outside in: epidermis, cortex, endodermis, pericycle, then the vascular tissue.'
      - 'The trap is A. A cuticle is a waxy layer on leaves and stems; a root must absorb water, so it has none.'
    hint: 'A root must take in water. Would a waxy, waterproof layer help it?'
    why:
      A: 'A cuticle covers leaves and stems; roots have no cuticle, because it would stop water getting in.'
      B: 'The pericycle lies deep inside, just inside the endodermis.'
      D: 'The endodermis is the inner boundary of the cortex, far from the surface.'

  26:
    answer: A
    steps:
      - 'Xylem carries water and mineral salts from the roots up to the leaves.'
      - 'Phloem carries manufactured food (sugars) from the leaves to where it is used or stored.'
      - 'The sugar in a cassava tuber or a yam reached it through the phloem.'
      - 'Remember: xylem goes up with water, phloem flows food. Water first, food second, so xylem then phloem.'
      - 'The trap is C. It names the right tissues in the wrong order.'
    hint: 'The question says "respectively". Which tissue carries water?'
    why:
      B: 'Phloem carries food, not water, and tracheids are part of the xylem, so they do not carry food.'
      C: 'The right two tissues, but in the wrong order.'
      D: 'Tracheids are part of the xylem; they carry water, not manufactured food.'

  27:
    answer: A
    steps:
      - 'The savanna has a long dry season with frequent bush fires.'
      - 'Savanna trees such as the shea butter tree have a thick, corky, fissured bark. It insulates the living tissue inside from the heat of grass fires and cuts water loss.'
      - 'Farmers and hunters burn the grass in the Guinea savanna each dry season, yet the trees survive because of their bark.'
      - 'Remember: thick bark is the tree''s fire blanket.'
      - 'The trap is C. Savanna trees are scattered and usually short; tall trees belong to the rainforest.'
    hint: 'What danger comes to the savanna every dry season?'
    why:
      B: 'The savanna is mainly grassland, so grasses are plentiful, not few.'
      C: 'Savanna trees are mostly short and scattered; tall trees are a rainforest feature.'
      D: 'A long lifespan is not an adaptation to fire or drought.'

  28:
    answer: D
    steps:
      - 'This is camouflage (cryptic colouration): an animal''s colour matches its background so it is hard to see.'
      - 'In the rainy season the grass is green, so a green grasshopper is hidden. After a bush fire the ground is black, so a black grasshopper is hidden.'
      - 'Birds such as the cattle egret hunt grasshoppers in the savanna, and they catch the ones that stand out.'
      - 'Remember: blend in, stay alive.'
      - 'The trap is B. Warning colours are bright, such as red and yellow, and they make an animal stand out, not disappear.'
    hint: 'Does the colour make the grasshopper easier or harder to see?'
    why:
      A: 'The colour change does not help it find food; grasshoppers feed on plants whatever their colour.'
      B: 'Warning colouration is bright and makes the animal stand out; these colours match the background instead.'
      C: 'The change follows the background, not the breeding season, so it is not for attracting mates.'

  29:
    answer: B
    steps:
      - 'Plants evolved from simple algae, to mosses and liverworts, to ferns, then to seed plants.'
      - 'Dryopteris is a fern. It has true roots, stems and leaves, and vascular tissue (xylem and phloem), so it can grow larger and live on drier land.'
      - 'Marchantia is a liverwort with no vascular tissue. Chlamydomonas is a one-celled alga and Spirogyra a filamentous alga.'
      - 'Ferns grow on the trunks of oil palms and in shady parts of the rainforest.'
      - 'Remember: algae, then liverworts, then ferns. The trap is A, a land plant that still lacks xylem and phloem.'
    hint: 'Which of the four has vascular tissue?'
    why:
      A: 'Marchantia is a liverwort, a land plant but without vascular tissue or true roots.'
      C: 'Chlamydomonas is a single-celled alga, among the simplest plants.'
      D: 'Spirogyra is a filamentous alga with no tissues or organs.'

  30:
    answer: D
    steps:
      - 'Sandy soil has large particles with big air spaces between them.'
      - 'Water drains through it quickly, and it washes the dissolved mineral salts down with it (leaching). Sand has little clay or humus to hold the nutrients.'
      - 'Sandy soil near the beach at Badagry, or in parts of the north, dries fast and needs much manure.'
      - 'Remember: sand lets everything through, like a sieve.'
      - 'The trap is A. Sandy loam drains well too, but its clay and humus hold some nutrients.'
    hint: 'Which soil has the largest particles and the least clay and humus?'
    why:
      A: 'Sandy loam has some clay and humus, so it holds more nutrients than pure sand.'
      B: 'Clay loam holds water and nutrients well.'
      C: 'Loam has a good mix of sand, clay and humus, and holds nutrients well.'

  31:
    answer: C
    steps:
      - 'The hummingbird feeds on nectar from deep inside tube-shaped flowers.'
      - 'Its beak is long and slender, and slightly curved to fit the flower tube. A long tongue inside the beak laps up the nectar.'
      - 'In Nigeria the sunbird does the same job, visiting hibiscus and other flowers in gardens.'
