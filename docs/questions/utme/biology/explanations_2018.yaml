format_version: 1
exam_year: 2018
subject: BIO
explanations:
  1:
    answer: D
    steps:
      - 'A species is a group of closely related organisms that can interbreed to produce fertile offspring.'
      - 'The test is fertility. Members of one species mate, and their young can also breed when they grow up.'
      - 'Example: every goat in a Nigerian village, whether Red Sokoto or West African Dwarf, belongs to one species, so any two can breed and their kids can breed too.'
      - 'Remember the ladder from biggest to smallest: kingdom, phylum, class, order, family, genus, species. Only the last rung is defined by interbreeding.'
      - 'The trap is C, family. A family holds several genera of related organisms, and members of different genera cannot normally produce fertile young.'
    hint: 'Which group on the classification ladder is defined by producing fertile offspring?'
    why:
      A: 'A kingdom is the largest group, holding millions of organisms that cannot interbreed.'
      B: 'A class holds many orders and families whose members cannot breed with one another.'
      C: 'A family holds several genera; organisms from different genera do not produce fertile young.'

  2:
    answer: A
    steps:
      - 'Euglena is a protist that can feed in two ways. In light it is autotrophic: its chloroplasts make food by photosynthesis.'
      - 'In darkness photosynthesis stops, so Euglena switches to heterotrophic nutrition. It takes in ready-made organic food dissolved in the pond water.'
      - 'This double ability is why Euglena is often placed between plants and animals. It survives two weeks in a dark room because it keeps feeding.'
      - 'Example: a green scum of Euglena on a stagnant pond in the rainy season still lives on at night and in the shade of thick leaves.'
      - 'Remember: Euglena keeps two kitchens, one solar and one ready-made.'
      - 'The trap is B. The pond water has carbon dioxide, but photosynthesis also needs light, and there was none.'
    hint: 'Photosynthesis needs light. How else can Euglena get food?'
    why:
      B: 'Photosynthesis needs light as well as carbon dioxide, and the room was dark.'
      C: 'Euglena is suited to light; it has an eyespot and moves towards light to photosynthesise.'
      D: 'Overcrowding has nothing to do with surviving without light; the question is how it fed.'

  3:
    answer: B
    steps:
      - 'The cytoplasm is the jelly-like material between the cell membrane and the nucleus.'
      - 'It holds and suspends all the organelles, such as mitochondria, ribosomes and chloroplasts, and it is where many of the cell''s chemical reactions take place.'
      - 'Example: think of a bowl of okra soup. The soup is the cytoplasm and the pieces of meat and fish floating in it are the organelles.'
      - 'Remember: cytoplasm is the soup, organelles are what float in it.'
      - 'The trap is A. Energy is released by respiration in the mitochondria; the cytoplasm only holds them.'
    hint: 'What is the jelly that every organelle sits in?'
    why:
      A: 'Most of the cell''s energy is released by respiration in the mitochondria, at a rate set by the cell''s needs; the cytoplasm holds them but does not regulate the energy.'
      C: 'The outermost part of an animal cell is the cell membrane, and of a plant cell the cell wall.'
      D: 'Cell division is directed by the nucleus, which divides first; the cytoplasm only splits in two at the end, in cytokinesis.'

  4:
    answer: A
    steps:
      - 'This is an osmometer. The funnel holds sugar solution, the beaker holds distilled water, and a selectively permeable membrane separates them.'
      - 'Osmosis is the movement of water molecules through a selectively permeable membrane from a dilute solution to a more concentrated one.'
      - 'Distilled water has the most free water molecules, so water moves in through the membrane into the sugar solution. Sugar molecules are too large to move out.'
      - 'The volume inside the funnel grows, so the liquid is pushed up the narrow stem and the level rises.'
      - 'Remember: water chases sugar.'
      - 'The trap is B. Students sometimes think water leaves the funnel, but water moves towards the more concentrated side.'
    hint: 'Which side has more sugar? Water moves towards it.'
    why:
      B: 'The level would fall only if water left the funnel, but water moves into the more concentrated sugar solution.'
      C: 'The level stays the same only if both sides have the same concentration, and here they differ.'
      D: 'Nothing fixes the rise at exactly double; it rises steadily until the pressure of the column balances the inflow.'

  5:
    answer: D
    steps:
      - 'The set-up shows osmosis: a sugar solution and pure water separated by a selectively permeable membrane.'
      - 'Water moves through the membrane into the sugar solution, and the rising level in the stem shows it happening.'
      - 'Example: dried beans soaked overnight for moi moi swell because water enters their cells by osmosis.'
      - 'Remember: osmosis needs a membrane, diffusion does not.'
      - 'The trap is C, diffusion. Osmosis is a special diffusion of water, but this experiment is built around the membrane, so it is osmosis.'
    hint: 'What process needs a selectively permeable membrane and moves only water?'
    why:
      A: 'Transportation is the carrying of materials round a living thing, as in xylem or blood vessels; this set-up shows one particular process, water crossing a membrane.'
      B: 'Water culture is growing plants in mineral solutions to study their nutrient needs.'
      C: 'Diffusion is the spread of any substance with no membrane needed; this set-up shows water crossing a membrane.'

  6:
    answer: C
    steps:
      - 'In the experiment the membrane lets water through but holds back the sugar. It is selectively permeable.'
      - 'In a plant cell the selectively permeable layer is the living cytoplasm with its two membranes, the cell membrane outside and the tonoplast round the vacuole.'
      - 'The cell sap in the vacuole plays the sugar solution, and the cytoplasmic lining controls what passes in and out.'
      - 'Example: when yam slices are soaked in salt water, water leaves the cell sap across this living lining and the slices go soft.'
      - 'The trap is B, the cell wall. It is made of cellulose and is freely permeable, so it lets both water and dissolved substances through.'
    hint: 'Which part of a plant cell lets water through but holds back dissolved sugar?'
    why:
      A: 'The nucleolus is inside the nucleus and makes ribosomes; it plays no part in osmosis.'
      B: 'The cellulose cell wall is freely permeable, so it lets sugar and water through alike.'
      D: 'The mitochondrion releases energy by respiration; it does not control water entry.'

  7:
    answer: C
    steps:
      - 'Haemolysis is the bursting of red blood cells.'
      - 'Distilled water is less concentrated than the cell contents, so water enters the red cells by osmosis. The cells swell and, with no cell wall to hold them, they burst.'
      - 'This is why blood cells must always be kept in a solution as concentrated as the plasma.'
      - 'Remember: haemo means blood and lysis means splitting, so haemolysis is blood cells splitting open.'
      - 'The trap is A, plasmolysis. That happens to plant cells placed in a strong solution, where they lose water and shrink.'
    hint: 'Red cells have no cell wall. What happens when water keeps entering them?'
    why:
      A: 'Plasmolysis is a plant cell losing water in a strong solution and its contents shrinking.'
      B: 'Diffusion is the general spread of particles; it is not the name for cells bursting.'
      D: 'Wilting is a whole plant drooping when its cells lose water.'

  8:
    answer: A
    steps:
      - 'Hydrotropism is a growth curvature of a plant part in response to water.'
      - 'Roots are positively hydrotropic: they grow towards moist soil, where they can absorb water.'
      - 'Example: the roots of a mango tree near a leaking pipe or a well grow towards the water.'
      - 'Remember: hydro means water, as in hydroelectric power at Kainji Dam.'
      - 'The trap is B, geotropism. Roots also grow downwards, but that is a response to gravity, not water.'
    hint: 'Which prefix means water?'
    why:
      B: 'Geotropism is a growth response to gravity.'
      C: 'Phototropism is a growth response to light.'
      D: 'Thigmotropism is a growth response to touch, as in tendrils.'

  9:
    answer: B
    steps:
      - 'Glycolysis is the first stage of respiration. It happens in the cytoplasm and does not need oxygen.'
      - 'One glucose molecule, with six carbons, is split into two molecules of pyruvic acid, $\ce{C3H4O3}$, with three carbons each.'
      - 'Four hydrogen atoms are removed and passed to carriers, and there is a net gain of two ATP.'
      - 'So the summary is $\ce{C6H12O6 -> 2C3H4O3 + 4H + 2ATP}$. Check the carbons: 6 on the left and 2 × 3 = 6 on the right.'
      - 'Remember: one glucose, two pyruvates, two ATP.'
      - 'The trap is D. ADP is the low-energy form that is used up to make ATP; glycolysis produces ATP.'
    hint: 'Count the carbons. How many three-carbon pieces does one glucose make?'
    why:
      A: 'One pyruvic acid has only three carbons; glucose has six, so it must give two.'
      C: 'Glycolysis makes ATP, not ADP, and it makes two of them.'
      D: 'ADP is the starting material that is turned into ATP; the product is 2ATP.'

  10:
    answer: B
    steps:
      - 'The femur is the thigh bone, running from the hip to the knee.'
      - 'It carries the weight of the body when standing, walking and running, so it is the longest and strongest bone.'
      - 'Example: in a cow''s leg sold at the market, the big thigh bone used for pepper soup is the femur.'
      - 'Remember: the femur is the bone of the thigh, the largest limb segment.'
      - 'The trap is A, the humerus. It is the longest bone of the arm, but shorter than the femur.'
    hint: 'Which bone is in the thigh?'
    why:
      A: 'The humerus is the upper arm bone; it is shorter than the femur.'
      C: 'The scapula is the flat shoulder blade, not a long bone.'
      D: 'The tibia is the shin bone, the second longest, below the femur.'

  11:
    answer: D
    steps:
      - 'A skeletal material is a hard or firm substance that gives support and shape: chitin, cartilage and bone.'
      - 'Chitin forms the exoskeleton of insects, cartilage the firm, flexible skeleton of sharks and our ear flaps, and bone the hard endoskeleton of vertebrates.'
      - 'Muscle is a soft tissue. It pulls on the skeleton to cause movement, but it does not form the skeleton.'
      - 'Example: the hard shell of a cockroach is chitin, the gristle at the end of a chicken bone is cartilage, and the leg itself is bone.'
      - 'The trap is A, chitin. It is not in our bodies, but it is the skeleton of every arthropod.'
    hint: 'Which one moves the skeleton rather than forming it?'
    why:
      A: 'Chitin is the skeletal material of the exoskeleton of insects and crabs.'
      B: 'Cartilage is a skeletal material, as in the skeleton of a shark and the ends of our bones.'
      C: 'Bone is the main skeletal material of vertebrates.'

  12:
    answer: D
    steps:
      - 'Capillaries are the tiniest blood vessels, with walls one cell thick, linking arterioles to venules.'
      - 'Blood slows down in them because the total width of all the capillaries together is far greater than that of the artery feeding them.'
      - 'The slow flow gives time for oxygen and food to diffuse out to the cells, and for carbon dioxide and wastes to diffuse in.'
      - 'Example: at a busy Lagos motor park, buses slow down so that passengers have time to get on and off.'
      - 'The trap is A. Thin walls are true of capillaries, and they make exchange easy, but they are not why the flow is slow.'
    hint: 'What happens in capillaries that needs time?'
    why:
      A: 'Thin walls speed up diffusion, but they do not slow the blood; that comes from the large total width of the capillary beds.'
      B: 'Blood pressure falls as blood passes the capillaries, but the purpose of slow flow is exchange, not lowering pressure.'
      C: 'Dizziness depends on blood supply to the brain, not on the speed of flow in capillaries.'

  13:
    answer: A
    steps:
      - 'The kidney is the excretory organ of vertebrates: fishes, amphibians, reptiles, birds and mammals, including man.'
      - 'It filters the blood and removes nitrogenous waste and extra water as urine.'
      - 'Invertebrates use other organs: protozoans a contractile vacuole, flatworms flame cells, annelids nephridia and insects Malpighian tubules.'
      - 'Example: a tilapia, a toad, a chicken and a person all have kidneys; an earthworm and a housefly do not.'
      - 'The trap is C. Fishes, reptiles and birds are right, but a tapeworm is a flatworm and uses flame cells.'
    hint: 'Look for the group made only of vertebrates.'
    why:
      B: 'Annelids use nephridia and insects use Malpighian tubules, not kidneys.'
      C: 'Tapeworms are flatworms and excrete with flame cells.'
      D: 'Protozoans are single cells; they use a contractile vacuole and their cell surface.'

  14:
    answer: A
    steps:
      - 'Arteries carry blood away from the heart under high pressure.'
      - 'They have thick muscular and elastic walls to withstand that pressure, and most carry oxygenated blood; the pulmonary artery is the exception, carrying deoxygenated blood to the lungs.'
      - 'Valves along the length are a feature of veins. Blood in veins is under low pressure, so valves stop it flowing backwards. Arteries need none, because the heartbeat keeps the blood moving forward.'
      - 'Remember: Arteries go Away from the heart; Veins have Valves.'
      - 'The trap is D. The exception about the pulmonary artery makes it look false, but it is a true statement about arteries.'
    hint: 'Which feature belongs to veins, not arteries?'
    why:
      B: 'Thick muscular and elastic walls are a true feature of arteries.'
      C: 'Carrying blood away from the heart is the definition of an artery.'
      D: 'Arteries do carry oxygenated blood, and the pulmonary artery is the one exception, so this statement is true.'

  15:
    answer: B
    steps:
      - 'Read each line. The lizard''s body temperature stays near 62 °F up to an environment of about 68 °F, climbs steeply, then levels off near 110 °F.'
      - 'The bird''s body temperature rises only slowly, from about 94 °F to about 104 °F, over the whole range of environmental temperature.'
      - 'So the bird changes by about 10 °F and the lizard by about 48 °F. The bird varied much less than the lizard.'
      - 'The bird is a homoiotherm. It keeps its body temperature fairly steady by its own heat and by feathers, panting and shivering.'
      - 'The trap is C. The bird is fairly steady, but its line does slope upwards, so its temperature was not exactly constant.'
    hint: 'Compare how far each line climbs from left to right.'
    why:
      A: 'Above an environment of about 93 °F the lizard''s line is above the bird''s, so the bird was not always warmer.'
      C: 'The bird''s line rises from about 94 °F to about 104 °F, so it was not constant.'
      D: 'At an environment of 40 °F the lizard was at about 62 °F, and at 120 °F it was at about 110 °F, so it was not always close.'

  16:
    answer: C
    steps:
      - 'Poikilothermy is the condition of an animal whose body temperature changes with the temperature of its surroundings. Such animals are called cold-blooded.'
      - 'On the graph the lizard''s body temperature rises steeply as the environment warms, so it follows the surroundings.'
      - 'Example: an agama lizard basks on a warm wall in the morning sun to raise its body temperature before it can run fast.'
      - 'Remember: poikilo means changing; homoio means the same.'
      - 'The trap is B, homeothermy. That describes the bird, which keeps a fairly steady body temperature.'
    hint: 'Does the lizard''s body temperature follow its surroundings or stay steady?'
    why:
      A: 'Homeostasis is the general keeping of a steady internal state, which the lizard''s changing temperature does not show.'
      B: 'Homeothermy means a steady body temperature, which is the bird, not the lizard.'
      D: 'Osmoregulation is the control of water and salt in the body, not temperature.'

  17:
    answer: C
    steps:
      - 'A hospital drip is normal saline, a salt solution with the same concentration as blood plasma. It is isotonic with the blood.'
      - 'Because the concentration matches, water does not rush into or out of the blood cells by osmosis, and the salt and water balance of the body fluids is kept.'
      - 'Pure water would be too dilute: water would enter the red cells and burst them by haemolysis.'
      - 'Example: a patient with severe diarrhoea from cholera is given saline by drip, and oral rehydration salts at home, to replace both water and salts.'
      - 'The trap is A. Salt does preserve fish and meat, but that is not why it is used in a drip.'
    hint: 'What would pure water do to red blood cells?'
    why:
      A: 'Salt preserves food, but the drip contains salt to match the concentration of body fluids.'
      B: 'Sterile water would also be free of germs; the salt is there for osmotic balance, not to prevent contamination.'
      D: 'Saline does not make blood cells; new cells are made in the bone marrow.'

  18:
    answer: A
    steps:
      - 'The cochlea is the coiled tube of the inner ear.'
      - 'It is filled with fluid and lined with sensory hair cells. Vibrations passed from the eardrum and ossicles make the fluid move, the hair cells fire, and the auditory nerve carries the message to the brain.'
      - 'Example: when a church bell rings or a danfo horn blares, the cochlea turns the vibration into nerve impulses.'
      - 'Remember: the cochlea is shaped like a snail shell and hears.'
      - 'The trap is B, the ampulla. It also has sensory cells, but they sense head movement for balance, not sound.'
    hint: 'Which coiled part of the inner ear is for hearing?'
    why:
      B: 'The ampulla is in the semicircular canals and senses movement of the head for balance.'
      C: 'The tympanum, or eardrum, vibrates with sound but has no sensory cells for hearing.'
      D: 'The malleus is an ossicle that passes vibrations along; it contains no nerve cells.'

  19:
    answer: A
    steps:
      - 'Long sight is a defect where a person sees distant objects clearly but not near ones.'
      - 'The eyeball is too short, or the lens too weak, so rays from a near object would meet behind the retina.'
      - 'A convex lens converges the rays a little before they enter the eye, so the eye lens can bring them to a focus on the retina.'
      - 'Example: many elderly grandparents wear convex reading glasses to read the newspaper.'
      - 'Remember: long sight, convex lens, converging rays. Short sight is put right with a concave, diverging lens.'
      - 'The trap is B. Diverging the rays is what a concave lens does, for short sight.'
    hint: 'A convex lens is a converging lens.'
    why:
      B: 'Diverging the rays is the work of a concave lens, used for short sight.'
      C: 'A plain clear lens does not change light intensity much; sunglasses do that.'
      D: 'Spectacles do not make light brighter for the eye; a convex lens works by bending the rays inwards so they focus on the retina.'

  20:
    answer: B
    steps:
      - 'A seed is a fertilised ovule that has developed and ripened.'
      - 'After fertilisation the zygote grows into the embryo, the integuments harden into the testa, and the ovule becomes the seed.'
      - 'At the same time the ovary becomes the fruit, which holds the seeds.'
      - 'Example: in an orange, the whole orange is the ripened ovary and each pip inside is a ripened ovule.'
      - 'Remember: ovule to seed, ovary to fruit.'
      - 'The trap is D. A developed ovary is a fruit, not a seed.'
    hint: 'After fertilisation, which part becomes the seed and which becomes the fruit?'
    why:
      A: 'The radicle and plumule are only parts of the embryo inside the seed.'
      C: 'The embryo and endosperm are inside the seed, but the seed also has a testa; the whole is the developed ovule.'
      D: 'A developed ovary is a fruit.'

  21:
    answer: B
    steps:
      - 'Photosynthesis takes carbon dioxide from the atmosphere and builds the carbon into sugar.'
      - '$\ce{6CO2 + 6H2O ->[light][chlorophyll] C6H12O6 + 6O2}$'
      - 'This is how carbon leaves the air and enters living things in the carbon cycle.'
      - 'Example: the trees of the rainforest in Cross River State take in huge amounts of carbon dioxide, which is why cutting them adds to global warming.'
      - 'The trap is D. Burning fuels involves carbon, but it puts carbon dioxide into the air rather than removing it.'
    hint: 'Which process uses carbon dioxide as a raw material?'
    why:
      A: 'Putrefaction, or decay, releases carbon dioxide back into the air.'
      C: 'Volcanic eruptions release carbon dioxide into the air.'
      D: 'Burning fuels releases carbon dioxide into the air.'

  22:
    answer: A
    steps:
      - 'The water cycle is the circulation of water between the land, the sea, living things and the air.'
      - 'Water enters the air by evaporation from seas and rivers and by transpiration from leaves. It condenses into clouds and falls back as precipitation, such as rain.'
      - 'Example: water transpired by the rainforest in the south helps form the clouds that bring the rainy season.'
      - 'Remember: transpiration sends water up, precipitation brings it down.'
      - 'The trap is B, the carbon cycle. It involves plants too, but it moves carbon, not water.'
    hint: 'Precipitation is rain. Which cycle moves water?'
    why:
      B: 'The carbon cycle moves carbon by photosynthesis, respiration, decay and burning.'
      C: 'The nitrogen cycle moves nitrogen by fixation, nitrification and denitrification.'
      D: 'The oxygen cycle moves oxygen by photosynthesis and respiration.'

  23:
    answer: C
    steps:
      - 'The photic zone is the upper layer of a lake or sea where enough light reaches for photosynthesis.'
      - 'Below it there is too little light, so plants cannot make food however much water, carbon dioxide and nutrients there are.'
      - 'A limiting factor is the factor in shortest supply, the one that holds the process back. Below the photic zone it is light.'
      - 'Example: in the muddy Lagos lagoon light reaches only a short way down, so water plants and algae grow only near the surface.'
      - 'The trap is A. Nutrients can limit plant growth near the surface, but in the dark water light runs out first.'
    hint: 'What does the word photic refer to?'
    why:
      A: 'Nutrients are often plentiful in deep water from settling dead matter; the missing factor is light.'
      B: 'Aquatic plants are surrounded by water, so it is never in short supply.'
      D: 'Carbon dioxide is dissolved in the water; without light it cannot be used anyway.'

  24:
    answer: C
    steps:
      - 'A quadrat is a square frame, often 1 m by 1 m, used to count plants in a habitat.'
      - 'It is thrown at random several times, the plants inside are counted each time, and the average is scaled up to the whole area.'
      - 'Example: to estimate the number of spear grass plants on a school field, students place quadrats and count inside them.'
      - 'Remember: plants stand still, so you count them in a square; animals move, so you catch them in traps and nets.'
      - 'The trap is B, the pitfall trap. It is a sampling tool too, but for crawling animals.'
    hint: 'Plants do not run away. Which tool marks out an area to count them?'
    why:
      A: 'A pooter sucks up small insects into a tube.'
      B: 'A pitfall trap catches crawling animals such as beetles and ants.'
      D: 'A sweep net catches flying and grass-dwelling insects.'

  25:
    answer: B
    steps:
      - 'Sandy soil is made mostly of large particles with large air spaces between them.'
      - 'The large spaces let water drain away quickly and let in plenty of air, and the loose grains make the soil light and easy to dig.'
      - 'Example: the sandy soils of the coast at Badagry are easy to dig with a hoe but dry out quickly in the harmattan.'
      - 'Remember: sand is coarse, airy and quick to drain; clay is fine, heavy and waterlogged.'
      - 'The trap is D. Heavy and poorly aerated describes clay, the opposite of sand.'
    hint: 'Sand grains are large. What does that do to the spaces between them?'
    why:
      A: 'Sandy soil has large air spaces, not limited ones.'
      C: 'Sandy soil drains quickly; clay drains slowly.'
      D: 'Heavy and poorly aerated describes clay soil.'

  26:
    answer: B
    steps:
      - 'A primary consumer is an animal that feeds directly on producers, the green plants. It is a herbivore.'
      - 'A sheep eats grass, so it is a primary consumer.'
      - 'Example: the cattle grazing in the Guinea savanna are primary consumers, just like sheep.'
      - 'Remember: producer first, then the plant eater, then the meat eater.'
      - 'The trap is C, grass. Grass is in the chain, but it is the producer, not a consumer.'
    hint: 'Which one eats plants?'
    why:
      A: 'A dog eats meat, so it is a secondary or higher consumer.'
      C: 'Grass makes its own food; it is a producer.'
      D: 'A fungus feeds on dead matter; it is a decomposer.'

  27:
    answer: A
    steps:
      - 'P is the first link of the chain, so it is the producer, a green plant.'
      - 'A producer makes its own food by photosynthesis, trapping energy from sunlight.'
      - 'All the energy that passes along the chain to Q, R, S and T started as sunlight caught by P.'
      - 'Example: a maize plant on a farm in Kaduna traps sunlight, and that energy passes to the grasshopper that eats it.'
      - 'The trap is B. Carbohydrates are the food P makes with that energy, not its source.'
    hint: 'P is the producer. Where does a producer get its energy?'
    why:
      B: 'Carbohydrates are made by P using light energy; they are its product, not its energy source.'
      C: 'P is itself the green plant; green plants do not feed on green plants.'
      D: 'Mineral salts are raw materials for growth, not a source of energy.'

  28:
    answer: D
    steps:
      - 'Count along the chain. P is the producer, Q the primary consumer and R the secondary consumer.'
      - 'R feeds on Q, which ate the producer, so R is at the third trophic level.'
      - 'Example: grass to grasshopper to lizard to snake to hawk. The lizard is the secondary consumer.'
      - 'Remember: the arrow points from the food to the feeder.'
      - 'The trap is A. The arrow from R points to S, which means S eats R, not that R eats S.'
    hint: 'The arrow points to the organism doing the eating. Count from P.'
    why:
      A: 'The arrow R → S means S feeds on R.'
      B: 'The primary consumer is Q, which feeds on P.'
      C: 'Only P is a producer; R cannot make its own food.'

  29:
    answer: B
    steps:
      - 'A hereditary disease is passed from parents to children through their genes.'
      - 'Scabies is an infection of the skin caused by the itch mite, Sarcoptes scabiei. It spreads by close contact and shared clothing, not through genes.'
      - 'Albinism, haemophilia and colour blindness are all carried on genes. Haemophilia and colour blindness are sex-linked.'
      - 'Example: scabies spreads quickly in crowded boarding-school hostels, and is cured with a cream and by washing bedding.'
      - 'The trap is A, albinism. It shows on the skin, like scabies, but it is inherited.'
    hint: 'Which one can you catch from another person?'
    why:
      A: 'Albinism is inherited as a recessive gene.'
      C: 'Haemophilia is inherited on the X chromosome.'
      D: 'Colour blindness is inherited on the X chromosome.'

  30:
    answer: D
    steps:
      - 'In a flowering plant, meiosis happens in the anther and the ovule. Each mother cell divides to give four haploid spores.'
      - 'In the anther these are the microspores. Each microspore then divides by mitosis and develops into a pollen grain, the young male gametophyte.'
      - 'So the immediate product is the spore. The gametophyte comes after, by growth and mitosis.'
      - 'Example: the yellow dust on a maize tassel is pollen grains, formed from microspores made by meiosis in the anthers.'
      - 'Remember: meiosis makes spores, spores make gametophytes, gametophytes make gametes.'
      - 'The trap is B, the gametophyte. It does come from the spores, but one step later.'
    hint: 'Meiosis makes spores. What are the spores in an anther called?'
    why:
      A: 'The sporophyte is the diploid plant itself, which carries out meiosis.'
      B: 'The gametophyte grows from a spore by mitosis, one step after meiosis.'
      C: 'The zygote is formed by fertilisation, not by meiosis.'

  31:
    answer: B
    steps:
      - 'In a eukaryotic cell the DNA is held inside the nucleus, wound into chromosomes.'
      - 'The nucleus controls the cell because its DNA carries the instructions for making proteins.'
      - 'Example: every cell in a cassava leaf has a nucleus whose DNA decides the shape of the leaf.'
      - 'Remember: eukaryote means true nucleus, the home of the DNA.'
      - 'The trap is A, the central vacuole. It is large and obvious in plant cells, but it holds cell sap, not DNA.'
    hint: 'What does eukaryotic mean?'
    why:
      A: 'The central vacuole holds cell sap, a solution of sugars and salts.'
      C: 'A lysosome holds digestive enzymes.'
      D: 'The Golgi body packages and sends out proteins; it holds no DNA.'

  32:
    answer: C
    steps:
      - 'Data: haemophilia is recessive and carried on the X chromosome. Write Xᴴ for normal and Xʰ for haemophilia. Man XᴴY, woman XʰXʰ. Percentage affected = ?'
      - 'Rule: each child gets one X from the mother; a son gets Y from the father and a daughter gets his X.'
