<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1272" width="400" height="353" role="img" aria-label="Diagram of a leafy shoot and its transport channels. A leaf hangs from the top of the stem. A shaded arrow, I, points from the air into the leaf, and a shaded arrow, II, comes out of the leaf, pointing down and away. A long double channel arches over from the leaf and runs down the stem into the soil. Line III points to the plain inner channel, which runs from the root up the stem and over into the leaf, with small arrowheads pointing up. Line IV points to the shaded outer channel, which carries an arrow pointing down from the leaf towards the roots. Soil lies on both sides of the stem">
