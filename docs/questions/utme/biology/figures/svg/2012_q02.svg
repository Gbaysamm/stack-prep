<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1312 812" width="440" height="272" role="img" aria-label="Diagram of an animal cell with four labelled parts. The cell is a rounded, irregular shape bounded by a thin cell membrane, which folds inwards in a small pocket near the top right and near the bottom. Line I points to the cell membrane on the right side. In the middle is a large round nucleus with a double envelope broken by pores, dotted chromatin and a dark nucleolus; line II points to the nucleus. Line III points to a small mitochondrion at the lower right, with its inner membrane folded into cristae. Line IV points to a group of folded, flattened membrane sacs at the lower left, the endoplasmic reticulum. The cytoplasm also holds granules, three small vacuoles, a Golgi body and a second, curved mitochondrion at the upper left. No part is named on the diagram">
