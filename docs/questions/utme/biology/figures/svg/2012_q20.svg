<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1018" width="420" height="297" role="img" aria-label="Diagram of a young flowering plant growing in soil, with arrows showing which way materials move. Two leaves spread from the top of the stem, one to the left and one to the right, with a small bud between them. The stem has two channels. The left channel carries shaded arrows pointing down, towards the roots; line I points to it. The right channel runs up from the roots and carries a shaded arrow pointing up; line IV points to it. An open arrow, II, comes out of the underside of the left leaf into the air. An open arrow, III, points from the air down into the right leaf. The stem branches into a tap root and two side roots in the soil">
