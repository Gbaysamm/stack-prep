<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 536" width="440" height="328" role="img" aria-label="Euglena viridis, a spindle-shaped single cell with its blunt front end at the top and its pointed hind end at the bottom. A long flagellum comes out of a notch at the front, loops up to the right and trails back over to the left. Just inside the notch is the flask-shaped reservoir, labelled I, with the dark eyespot beside it on the left and the contractile vacuole, labelled II, just behind it. In the middle of the cell is a star of narrow chloroplasts radiating from a central pyrenoid, labelled III by two leader lines. Small paramylum food granules lie scattered in the cytoplasm, and the group near the hind end is labelled IV.">
