<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 512" width="420" height="299" role="img" aria-label="The scolex (head) of a pork tapeworm, Taenia solium, seen from the side, front end at the top. On top is the dome-shaped rostellum, labelled I. Round the base of the rostellum is a crown of curved hooks, labelled II. Below it the head bears four suckers: one faces the viewer as a round cup in the middle, and one is seen edge-on at each side; the right-hand one is labelled III. The head narrows into a long unsegmented neck, and at the bottom the first short, narrow young proglottids are budding off, labelled IV.">
