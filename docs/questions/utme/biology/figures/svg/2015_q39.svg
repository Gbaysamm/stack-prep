<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1348 1050" width="400" height="312" role="img" aria-label="Vertical section through the mammalian heart seen from the front, so the heart's right side is on the left of the picture. The superior vena cava enters the right atrium from above and the inferior vena cava from below at the left; the right atrium is labelled II. Through the tricuspid valve, whose two cusps are held by chordae tendineae to papillary muscles, lies the thin-walled right ventricle, labelled III. From the top of the right ventricle the pulmonary artery rises through its semilunar valve, passes in front of the aorta and leaves to the right under the aortic arch towards the lungs; it is labelled I. Two pulmonary veins bring blood from the lungs into the left atrium at the right. Through the bicuspid valve, also with chordae tendineae, lies the left ventricle, labelled IV, whose muscular wall is much thicker than the right ventricle's; a thick septum separates the two ventricles. The aorta rises from the left ventricle through its semilunar valve, arches over the top, giving off two branches with arrows pointing up, and runs down at the right.">
