<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 10 1260 595" width="420" height="198" role="img" aria-label="One gill of a bony fish, curved like a crescent. A white bony bar forms the curve. On its outer, convex edge stand many long, thin, closely packed blades fanning outwards. On its inner, concave edge stands a row of short, stiff, pointed projections. Label I points to the upper end of the bony bar, two lines from label II point to the short projections on the inner edge, and two lines from label III point to the long thin blades on the outer edge">
