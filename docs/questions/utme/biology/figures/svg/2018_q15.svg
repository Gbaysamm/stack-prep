<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" role="img" aria-label="Graph of body temperature against environmental temperature, both in degrees Fahrenheit, from 40 to 130. The lizard's line is flat at about 62 up to an environmental 68, rises steeply to about 110 at an environmental 100, then stays flat at 110. The bird's dashed line rises slowly from about 94 at 40 to about 104 at 130, and the two lines cross near 95.">
  <rect width="440" height="300" fill="#fff"/>
  <g stroke="#d8d8de" stroke-width="1">
    <path d="M144 30 V240 M208 30 V240 M272 30 V240 M336 30 V240"/>
    <path d="M80 200 H400 M80 160 H400 M80 120 H400 M80 80 H400"/>
  </g>
  <path d="M80 30 V240 H400" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">
    <text x="80" y="256" text-anchor="middle">40</text>
    <text x="144" y="256" text-anchor="middle">60</text>
    <text x="208" y="256" text-anchor="middle">80</text>
    <text x="272" y="256" text-anchor="middle">100</text>
    <text x="336" y="256" text-anchor="middle">120</text>
    <text x="74" y="204" text-anchor="end">60</text>
    <text x="74" y="164" text-anchor="end">80</text>
    <text x="74" y="124" text-anchor="end">100</text>
    <text x="74" y="84" text-anchor="end">120</text>
    <text x="240" y="282" text-anchor="middle">Environmental temperature (°F)</text>
    <text transform="translate(28 135) rotate(-90)" text-anchor="middle">Body temperature of animals (°F)</text>
  </g>
  <path d="M80 196 H166 C172 196 175 194 178 191 L266 106 C269 102 271 100 276 100 H362" fill="none" stroke="#1a1a1f" stroke-width="2.4"/>
  <path d="M80 132 L362 112" fill="none" stroke="#3f2fa8" stroke-width="2.4" stroke-dasharray="9 6"/>
  <g font-family="system-ui, sans-serif" font-size="13">
    <text x="368" y="98" fill="#1a1a1f">Lizard</text>
    <text x="368" y="120" fill="#3f2fa8">Bird</text>
  </g>
</svg>
