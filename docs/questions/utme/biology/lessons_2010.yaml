# UTME 2010 Biology, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the Nigerian classroom way: name the structure or
# process, say what it does or how it works in simple steps, give a real Nigerian example, a way
# to remember it, and the answer moment that names the option. Genetic crosses go step by step
# on the board. Where a question has a drawing or a graph, the lesson says what to look at in it.
# traps gives one kind line for each wrong option.
#
#   say:    heard, not read. No symbols the voice would mangle; Latin names said plainly,
#           genetic symbols as letters, ratios in words.
#   write:  the one line written while it is said, with LaTeX between dollar signs.
#   answer: true on the moment that gives the answer.
#
# Keyed on question number, like explanations_2010.yaml. Answers match that file.
format_version: 1
exam_year: 2010
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'A plant cell grows up, and it changes inside. Which of these four statements is really true of a mature plant cell?'
        write: 'Mature plant cell, which statement is true?'
      - section: 'The structure'
        say: 'Every plant cell has a cell wall outside its cell membrane. That wall is made of cellulose.'
        write: 'Plant cell: cell wall made of cellulose'
      - say: 'The wall gives the cell its shape. It also stops the cell from bursting when it takes in water.'
        write: 'Wall: gives shape, stops bursting'
      - section: 'How it changes'
        say: 'As the cell matures, a large central vacuole full of cell sap forms in the middle.'
        write: 'Mature cell: large central sap vacuole'
      - say: 'The vacuole presses the cytoplasm into a thin layer against the wall, and it pushes the nucleus to one side.'
        write: 'Cytoplasm = thin layer, nucleus pushed to the side'
      - section: 'An example'
        say: 'Look at a thin slice of yam or cassava under the microscope. You see firm cellulose walls, big vacuoles, and each nucleus at the edge.'
        write: 'Yam or cassava cells: walls, big vacuoles, nucleus at the edge'
      - section: 'Remember'
        say: 'Remember this. Plants have walls of cellulose, and animals have none.'
        write: 'Plant cells have cellulose walls, animal cells do not'
      - section: 'Answer'
        say: 'So the true statement is that the cell wall is made up of cellulose, which is option C.'
        write: '$\therefore$ the cell wall is made up of cellulose'
        answer: true
    traps:
      A: 'You went for A. Only a young plant cell is full of cytoplasm. In a mature cell a large vacuole fills the middle.'
      B: 'You chose B. The big vacuole takes the centre, so the nucleus is pushed to the side of the cell, not to the centre.'
      D: 'You picked D. The nucleus of a mature plant cell is a rounded or flattened body pressed against the wall. Small and irregular is not how it is described.'
  3:
    moments:
      - section: 'The question'
        say: 'The nucleus is the control centre of the cell. Three of these are its real jobs. Which one is NOT?'
        write: 'Which is NOT a function of the nucleus?'
      - section: 'The structure'
        say: 'The nucleus holds the chromosomes, and the chromosomes carry the genes.'
        write: 'Nucleus holds chromosomes, chromosomes carry genes'
      - section: 'What it does'
        say: 'The genes carry hereditary information from parents to offspring. So C is a true job.'
        write: 'Stores and carries hereditary information  (C true)'
      - say: 'The genes also hold the instructions for making proteins. So B is a true job.'
        write: 'Holds the instructions for making proteins  (B true)'
      - say: 'Through those proteins, the nucleus controls the life processes of the whole cell. So A is a true job too.'
        write: 'Controls the life processes of the cell  (A true)'
      - section: 'Where energy comes from'
        say: 'That leaves D, which calls the nucleus a reservoir, or store, of energy. But energy is released in the mitochondria by respiration. It is stored as starch, glycogen or fat in the cytoplasm, not in the nucleus.'
        write: 'Energy: released in mitochondria, stored as starch, glycogen, fat'
      - section: 'An example'
        say: 'When you eat a plate of yam, the starch gives energy through respiration in your mitochondria. The nucleus only directs the work.'
        write: 'Yam starch ⇒ respiration in mitochondria ⇒ energy'
      - section: 'Remember'
        say: 'Remember this. Nucleus means information, and mitochondria mean energy.'
        write: 'Nucleus = information, mitochondria = energy'
      - section: 'Answer'
        say: 'So the statement that is NOT a function of the nucleus is that it is a reservoir of energy, which is option D.'
        write: '$\therefore$ NOT a function: a reservoir of energy'
        answer: true
    traps:
      A: 'You went for A. It looks too big to be true, but the nucleus really does control the life processes of the cell.'
      B: 'You chose B. The genes in the nucleus do hold the instructions for making every protein, so this is a true function.'
      C: 'You picked C. The chromosomes in the nucleus store and carry hereditary information, so this is a true function.'
  4:
    moments:
      - section: 'The question'
        say: 'A fern has two different plants in its life. Which one is the main one, the one you actually see?'
        write: 'Dominant phase of the fern life cycle $= ?$'
      - section: 'The process'
        say: 'This is alternation of generations. One generation makes spores, and the next makes gametes, and they take turns.'
        write: 'Alternation of generations: spore plant, then gamete plant'
      - section: 'The two generations'
        say: 'The sporophyte is the leafy fern with fronds, roots and a rhizome, which is an underground stem. It carries spores under its fronds.'
        write: 'Sporophyte: fronds, roots, rhizome, makes spores'
      - say: 'The gametophyte is a tiny heart shaped plant called the prothallus. It makes the gametes in its antheridia and archegonia, which are its male and female sex organs.'
        write: 'Gametophyte = prothallus, tiny, makes gametes'
      - section: 'Which one dominates'
        say: 'The sporophyte is large, lives for years and feeds itself. So it is the dominant phase.'
        write: 'Sporophyte: large, long-lived, independent ⇒ dominant'
      - section: 'An example'
        say: 'The ferns growing on the trunk of an oil palm, or on a damp wall in the rainy season, are all sporophytes.'
        write: 'Ferns on oil palm trunks = sporophytes'
      - section: 'Remember'
        say: 'Remember this. In ferns the plant you see is the sporophyte. In mosses the plant you see is the gametophyte.'
        write: 'Fern: sporophyte dominant.  Moss: gametophyte dominant'
      - section: 'Answer'
        say: 'So the dominant phase in the life cycle of a fern is the sporophyte, which is option C.'
        write: '$\therefore$ sporophyte'
        answer: true
    traps:
      A: 'You went for gametophyte. That is the dominant phase in mosses. In ferns the gametophyte is small and short lived.'
      B: 'You chose prothallus. The prothallus is the fern gametophyte, a tiny, short lived plant a few millimetres across, so it is not the dominant phase.'
      D: 'You picked antheridium. That is only the male sex organ on the prothallus, not a phase of the life cycle.'
  5:
    moments:
      - section: 'The question'
        say: 'Some animals lay their eggs and walk away. Others stay and look after their young. Which of these four stays?'
        write: 'Parental care is shown by $?$'
      - section: 'The idea'
        say: 'Parental care is the care parents give their eggs or young, such as warming, feeding and guarding them.'
        write: 'Parental care = warming, feeding, guarding the young'
      - section: 'How birds do it'
        say: 'Birds build nests and sit on their eggs to keep them warm.'
        write: 'Birds: build nests, sit on (incubate) eggs'
      - say: 'After hatching, they feed and guard the chicks until the chicks can fly.'
        write: 'Then feed and guard the chicks'
      - section: 'An example'
        say: 'Watch a mother hen spread her wings over her chicks when a hawk flies over the compound. Or watch weaver birds feeding their young in nests on a palm tree.'
        write: 'Hen guards chicks from a hawk;  weaver birds feed young'
      - section: 'The others'
        say: 'Most toads lay hundreds of eggs in water and leave them. Snails and earthworms leave their eggs in the soil.'
        write: 'Toads, snails, earthworms: lay eggs and leave them'
      - section: 'Remember'
        say: 'Remember this. The fewer eggs an animal lays, the more care it gives each one. Birds lay few eggs and care a lot.'
        write: 'Few eggs ⇒ much care'
      - section: 'Answer'
        say: 'So parental care is shown by birds, which is option D.'
        write: '$\therefore$ birds'
        answer: true
    traps:
      A: 'You went for toads. Most toads lay large numbers of eggs in water and leave them, so the tadpoles fend for themselves.'
      B: 'You chose snails. Snails lay their eggs in damp soil and leave them to hatch on their own.'
      C: 'You picked earthworms. Earthworms leave their eggs in cocoons in the soil and give them no care.'
  6:
    moments:
      - section: 'The question'
        say: 'We have four animals, and we must line them up from the one that needs water most to breed, down to the one that needs it least.'
        write: 'Order by decreasing need for water to reproduce'
      - section: 'The drawing'
        say: 'Look at the four drawings. I, at the top left, is a rabbit with long ears. II, at the top right, is a crocodile with a long snout and a plated body.'
        write: 'I = rabbit,  II = crocodile'
      - say: 'III, at the bottom left, is a squat warty toad. IV, at the bottom right, is a fish with fins and scales.'
        write: 'III = toad,  IV = fish'
      - section: 'How each one breeds'
        say: 'The fish lays eggs and sheds sperm into the water. Fertilisation and growth all happen in water, so it needs water most.'
        write: 'IV fish: everything happens in water'
      - say: 'The toad lives on land, but it must go back to water to lay its eggs, and its tadpoles live in water.'
        write: 'III toad: eggs and tadpoles in water'
      - say: 'The crocodile is a reptile. It lives in rivers, but fertilisation is internal. That means the sperm meets the egg inside the female''s body, so no water is needed to carry the sperm. Then it lays shelled eggs in a nest on the bank.'
        write: 'II crocodile: internal fertilisation, shelled eggs on land'
      - say: 'The rabbit is a mammal. Fertilisation is internal and the young grow inside the mother, so it needs no water at all.'
        write: 'I rabbit: young grow inside the mother'
      - section: 'The order'
        say: 'So from most to least dependent on water, the order is four, three, two, one.'
        write: 'IV → III → II → I'
      - section: 'An example'
        say: 'Think of tilapia in a fish pond, toads calling at a puddle in the rainy season, a crocodile laying eggs in the sand by the River Niger, and a rabbit in a hutch.'
        write: 'Pond tilapia, puddle toads, sandbank crocodile, hutch rabbit'
      - section: 'Remember'
        say: 'Remember this. Do not judge by where the animal lives. Judge by where its eggs and young grow.'
        write: 'Judge by where the eggs and young grow'
      - section: 'Answer'
        say: 'So the order of decreasing dependence on water is four, three, two and one, which is option B.'
        write: '$\therefore$ IV, III, II and I'
        answer: true
    traps:
      A: 'You went for A. It starts with the rabbit, but the rabbit needs no water to breed at all, so it belongs at the end.'
      C: 'You chose C. It starts with the rabbit, which needs no water to breed, and it puts the toad last, though the toad needs water for its eggs and tadpoles.'
      D: 'You picked D. It puts the toad and the crocodile before the fish. But the fish needs water for every stage, the toad only for eggs and tadpoles, and the crocodile lays its eggs on land.'
  7:
    moments:
      - section: 'The question'
        say: 'We have the same four animals. Which group appeared first in the history of life on earth?'
        write: 'Oldest group in evolutionary history $= ?$'
      - section: 'The drawing'
        say: 'Remember the drawing. I is the rabbit, a mammal. II is the crocodile, a reptile. III is the toad, an amphibian. IV is the fish.'
        write: 'I mammal,  II reptile,  III amphibian,  IV fish'
      - section: 'The process'
        say: 'This is about evolution and the fossil record. The oldest rocks with backbones in them hold only fish.'
        write: 'Fossil record: the first vertebrates were fish'
      - section: 'The order'
        say: 'Amphibians came from fish. Reptiles came from amphibians. Mammals came from reptiles.'
        write: 'Fish → amphibians → reptiles → mammals'
      - say: 'So on the drawing the order of appearance is four, three, two, one. The fish came first.'
        write: 'IV → III → II → I,  so IV is the oldest'
      - section: 'An example'
        say: 'The tilapia in the Lagos lagoon belongs to the oldest of these groups. The goat in the market belongs to the youngest.'
        write: 'Tilapia: oldest group.  Goat: youngest group'
      - section: 'Remember'
        say: 'Remember the order with the line Fish Are Really Moving Forward. That is fish, amphibians, reptiles and mammals.'
        write: 'Fish Are Really Moving Forward'
      - section: 'Answer'
        say: 'So the oldest creature in evolutionary history is the fish, IV, which is option D.'
        write: '$\therefore$ IV, the fish'
        answer: true
    traps:
      A: 'You went for the toad. Amphibians are very old, but they came after fish, from fish ancestors.'
      B: 'You chose the crocodile. Reptiles came after the amphibians, so they are younger than the fish.'
      C: 'You picked the rabbit. Mammals came last of the four groups, so the rabbit is the youngest, not the oldest.'
  8:
    moments:
      - section: 'The question'
        say: 'The question asks for a group of cells with no true nucleus. Watch that word cells, because it removes one tempting option.'
        write: 'Group of cells with no true nucleus $= ?$'
      - section: 'The group'
        say: 'Cells with no true nucleus are called prokaryotes. They make up the kingdom Monera, the bacteria and the blue green algae.'
        write: 'No true nucleus = prokaryotes = Monera (bacteria, blue-green algae)'
      - section: 'How they are built'
        say: 'Their DNA lies free in the cytoplasm, with no nuclear membrane around it. That is why their nucleus is not a true one.'
        write: 'DNA free in the cytoplasm, no nuclear membrane'
      - section: 'The others'
        say: 'Algae such as Spirogyra, and fungi such as Rhizopus, have a true nucleus with a membrane. They are eukaryotes.'
        write: 'Algae, fungi: true nucleus ⇒ eukaryotes'
      - say: 'Viruses have no nucleus either, but they are not cells at all. They are nucleic acid inside a protein coat.'
        write: 'Viruses: not cells, nucleic acid in a protein coat'
      - section: 'An example'
        say: 'The bacteria that sour fresh milk into nono, and the bacteria in the root nodules of groundnut, are Monera.'
        write: 'Bacteria in nono and groundnut nodules = Monera'
      - section: 'Remember'
        say: 'Remember this. Pro means before, and karyon means nucleus. Prokaryotes came before the nucleus.'
        write: 'Pro = before,  karyon = nucleus'
      - section: 'Answer'
        say: 'So the group of cells devoid of true nuclei is the Monera, which is option B.'
        write: '$\therefore$ Monera'
        answer: true
    traps:
      A: 'You went for algae. Algae such as Spirogyra have a true nucleus. Only the blue green algae are Monera.'
      C: 'You chose fungi. Fungi such as Rhizopus and mushrooms have true nuclei in their hyphae.'
      D: 'You picked viruses. Viruses have no nucleus, but they are not cells at all. They are particles of nucleic acid in a protein coat.'
  9:
    moments:
      - section: 'The question'
        say: 'Look at the hawk in the drawing. Part I is covered in feathers. What are those feathers mainly for?'
        write: 'Main function of the feathers on part I $= ?$'
      - section: 'The drawing'
        say: 'Follow the leader line from I. It points to the upper part of the leg, which is covered in soft feathers. Below that, the leg is bare and scaly.'
        write: 'I = the feathered upper leg'
      - section: 'The structure'
        say: 'These are covering feathers, not flight feathers. They are the same kind that cover the body.'
        write: 'Covering (contour) feathers, not flight feathers'
      - section: 'How it works'
        say: 'Birds are warm blooded. Feathers trap a layer of still air close to the skin.'
        write: 'Feathers trap still air next to the skin'
      - say: 'Still air is a poor conductor of heat, so the body heat stays in. The feathers are an insulator.'
        write: 'Still air = poor conductor ⇒ insulation ⇒ heat kept in'
      - section: 'An example'
        say: 'On a cold harmattan morning, a hen fluffs up her feathers. She traps more air and keeps warm.'
        write: 'Harmattan morning: hen fluffs up her feathers'
      - section: 'Remember'
        say: 'Remember this. Feathers are a blanket, not a heater.'
        write: 'Feathers = blanket, not heater'
      - section: 'Answer'
        say: 'So the main function of the feathers on part I is to serve as an insulator to maintain body heat, which is option D.'
        write: '$\therefore$ insulator to maintain body heat'
        answer: true
    traps:
      A: 'You went for A. Feathers do not keep lice and mites away. Birds get rid of them by preening and dust bathing.'
      B: 'You chose B. Feathers make no heat. Heat comes from respiration in the body, and the feathers only stop it escaping.'
      C: 'You picked C. Power for flight comes from the breast muscles beating the wings. The feathers on the legs play no part in it.'
  10:
    moments:
      - section: 'The question'
        say: 'Look at the beak and the feet of the same bird. They tell us what it eats.'
        write: 'Beak and feet ⇒ main food $= ?$'
      - section: 'The idea'
        say: 'This is adaptation. The beak and feet of a bird are shaped for the food it eats.'
        write: 'Beak and feet suit the food'
      - section: 'The drawing'
        say: 'Look at the head first. The beak is short and strongly hooked at the tip. A hooked beak tears flesh.'
        write: 'Short, hooked beak ⇒ tears flesh'
      - say: 'Now look at the feet on the branch. They have sharp, curved talons. Talons grip and kill prey.'
        write: 'Sharp curved talons ⇒ grip and kill prey'
      - section: 'The bird'
        say: 'A hooked beak with talons is the mark of a bird of prey, such as a hawk or an eagle. Birds of prey eat meat.'
        write: 'Bird of prey (hawk, eagle) ⇒ eats meat'
      - section: 'An example'
        say: 'In the village a hawk swoops on a farmer''s chicks. It grabs one with its talons and tears it with its beak.'
        write: 'Hawk takes chicks: talons grab, beak tears'
      - section: 'Remember'
        say: 'Remember this. Hooked beak and talons mean hunter.'
        write: 'Hooked beak + talons = hunter'
      - section: 'Answer'
        say: 'So this bird feeds mainly on flesh, which is option A.'
        write: '$\therefore$ flesh'
        answer: true
    traps:
      B: 'You went for fruits. A parrot also has a hooked beak, which it uses to crack nuts and open fruits, but its feet are made for climbing, not sharp talons for killing.'
      C: 'You chose seeds. Seed eaters such as weaver birds have short, thick, cone shaped beaks for cracking seeds.'
      D: 'You picked nectar. Nectar feeders such as sunbirds have long, thin beaks to reach deep into flowers.'
  11:
    moments:
      - section: 'The question'
        say: 'Cut a young dicot stem across and look at it under a lens. Where does each tissue sit?'
        write: 'Transverse section of a dicot stem, which is true?'
      - section: 'The layers'
        say: 'From the outside in, there is the epidermis, then the cortex, then a ring of vascular bundles, then the pith in the centre.'
        write: 'Epidermis → cortex → ring of bundles → pith'
      - section: 'Inside a bundle'
        say: 'In each vascular bundle, the phloem faces outwards, towards the cortex.'
        write: 'Phloem: outer side of the bundle'
      - say: 'The xylem faces inwards, towards the pith. The cambium lies between the xylem and the phloem.'
        write: 'Xylem: inner side.  Cambium: between xylem and phloem'
      - section: 'Dicot or monocot'
        say: 'A dicot is a flowering plant with two seed leaves, such as the bean. In a dicot the bundles form a neat ring. In a monocot such as maize, they are scattered.'
        write: 'Dicot: bundles in a ring.  Monocot (maize): scattered'
      - section: 'An example'
        say: 'Cut a young stem of a bean or hibiscus plant. The bundles sit in a ring, like the numbers on a clock face.'
        write: 'Bean or hibiscus stem: bundles like a clock face'
      - section: 'Remember'
        say: 'Remember this. Phloem out, xylem in.'
        write: 'Phloem out, xylem in'
      - section: 'Answer'
        say: 'So the true statement is that the xylem is more interiorly located than the phloem, which is option B.'
        write: '$\therefore$ xylem lies further in than phloem'
        answer: true
    traps:
      A: 'You went for A. It is the other way round. The epidermis is the outermost layer, and it surrounds the cortex.'
      C: 'You chose C. The cambium lies between the xylem and the phloem inside each bundle, not between the cortex and the bundles.'
      D: 'You picked D. Scattered bundles are found in a monocot stem, such as maize. A dicot stem has them in a ring.'
  12:
    moments:
      - section: 'The question'
        say: 'There are four arrows on one plant. Two of them show what moves inside the xylem and the phloem. Which two, and in which order?'
        write: 'Xylem and phloem movement, which arrows?'
      - section: 'The tissues'
        say: 'Xylem carries water and mineral salts one way only, from the roots up the stem to the leaves.'
        write: 'Xylem: water and minerals, roots → leaves (up)'
      - say: 'Phloem carries food made in the leaves, mainly sugar, to other parts. Here it goes down the stem to the roots.'
        write: 'Phloem: sugar from the leaves, here leaves → roots (down)'
      - section: 'The drawing'
        say: 'Look at the arrows I and II at the leaf. I points into the leaf from the air, and II comes out of it. They are gases, outside the plant.'
        write: 'I and II: gases in and out of the leaf'
      - say: 'Now follow line III. It points to the plain inner channel, whose small arrowheads point up from the root into the leaf. That is the xylem.'
        write: 'III: plain inner channel, upward ⇒ xylem'
      - say: 'Line IV points to the shaded outer channel. Its arrow runs from the leaf down towards the roots. That is the phloem.'
        write: 'IV: shaded outer channel, downward ⇒ phloem'
      - section: 'An example'
        say: 'A cassava plant sends sugar down through its phloem and stores it as starch in its tuberous roots.'
        write: 'Cassava: sugar down the phloem, stored as starch in roots'
      - section: 'Remember'
        say: 'Remember this. Xylem goes up, and phloem flows food.'
        write: 'Xylem up, phloem flows food'
      - section: 'Answer'
        say: 'So the xylem and phloem movements are the arrows three and four respectively, which is option A.'
        write: '$\therefore$ III (xylem) and IV (phloem)'
        answer: true
    traps:
      B: 'You went for two and one. Arrows I and II pass between the leaf and the air. They are gases, not transport inside the plant.'
      C: 'You chose one and two. Those arrows are gases moving in and out of the leaf, not material in the xylem and phloem.'
      D: 'You picked one and three. Arrow I is a gas entering the leaf, not the xylem, and III is the upward xylem stream, not the phloem.'
  13:
    moments:
      - section: 'The question'
        say: 'It is the same plant. During photosynthesis, arrow II leaves the leaf. What is going out?'
        write: 'Photosynthesis: arrow II represents $?$'
      - section: 'The process'
        say: 'In photosynthesis a green leaf takes in carbon four oxide and water. It uses light energy, trapped by chlorophyll, to make glucose.'
        write: '$\ce{6CO2 + 6H2O ->[light][chlorophyll] C6H12O6 + 6O2}$'
      - say: 'Oxygen is made as a by-product. It passes out of the leaf through the stomata into the air.'
        write: 'Oxygen = by-product, leaves through the stomata'
      - section: 'The drawing'
        say: 'Look at the leaf. Arrow I points into the leaf, so it is the carbon four oxide going in.'
        write: 'Arrow I in ⇒ carbon(IV) oxide taken in'
      - say: 'Arrow II points out of the leaf and away. So it is the oxygen going out.'
        write: 'Arrow II out ⇒ oxygen released'
      - section: 'An example'
        say: 'Put water weed in a fish tank in bright sun. Small bubbles rise from the leaves, and those bubbles are oxygen.'
        write: 'Water weed in sunlight: bubbles of oxygen'
      - section: 'Remember'
        say: 'Remember this. In photosynthesis carbon four oxide goes in, and oxygen comes out.'
        write: 'Photosynthesis: $\ce{CO2}$ in, $\ce{O2}$ out'
      - section: 'Answer'
        say: 'So arrow II represents the release of oxygen as a by-product, which is option D.'
        write: '$\therefore$ release of oxygen as a by-product'
        answer: true
    traps:
      A: 'You went for A. Mineral salts come into the plant from the soil through the roots. They do not escape from the leaf.'
      B: 'You chose B. Energy from the sun is absorbed by the leaf, not given out. Arrow II leaves the leaf.'
      C: 'You picked C. Carbon four oxide is taken in during photosynthesis, as arrow I shows. It is released in respiration.'
  14:
    moments:
      - section: 'The question'
        say: 'A child has a swollen belly, thin arms and reddish hair. What is missing from that child''s food?'
        write: 'Kwashiorkor: what is lacking in the diet?'
      - section: 'The disease'
        say: 'Kwashiorkor is a deficiency disease. It is caused by too little protein in the diet.'
        write: 'Kwashiorkor = protein deficiency'
      - section: 'Why protein matters'
        say: 'Protein is the body building food. It is needed for growth and for making and repairing body tissues.'
        write: 'Protein: growth, building and repairing tissues'
      - section: 'The signs'
        say: 'The child has a swollen belly and feet from fluid, thin limbs, pale reddish hair and peeling skin.'
        write: 'Signs: swollen belly and feet, thin limbs, reddish hair'
      - section: 'An example'
        say: 'It is often seen when a baby is weaned from breast milk on to pap or cassava alone, with no beans, fish, eggs or milk.'
        write: 'Weaned on pap or cassava only, no beans or fish'
      - section: 'Remember'
        say: 'Remember this. Kwashiorkor means a child that lacks protein, and beans and fish prevent it.'
        write: 'Kwashiorkor: no protein.  Beans and fish prevent it'
      - section: 'Answer'
        say: 'So the food lacking in the diet of a person with kwashiorkor is proteins, which is option B.'
        write: '$\therefore$ proteins'
        answer: true
    traps:
      A: 'You went for vitamins. A lack of vitamins causes other diseases, such as scurvy, rickets and beriberi.'
      C: 'You chose carbohydrates. A general lack of energy food leads to marasmus, a wasting disease without the swelling.'
      D: 'You picked fats and oils. They are energy foods. Kwashiorkor comes from too little protein, the body building food, even when the child gets enough energy food.'
  15:
    moments:
      - section: 'The question'
        say: 'Sundew and bladderwort are green plants that also catch insects. How do they feed on the insects they catch?'
        write: 'Sundew, bladderwort: mode of feeding on insects $= ?$'
      - section: 'The plants'
