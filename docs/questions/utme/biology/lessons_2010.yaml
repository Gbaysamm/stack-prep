    moments:
      - section: 'The question'
        say: 'Both parents carry one dominant and one recessive allele. What is the chance their child shows the recessive trait?'
        write: 'Both parents heterozygous, P(recessive offspring) $= ?$'
      - section: 'The data'
        say: 'Heterozygous means two different alleles. So each parent is big T small t. We want a child that is small t small t.'
        write: 'Parents: Tt × Tt.   Wanted: tt'
      - section: 'The rule'
        say: 'Each parent passes one allele to each gamete, big T or small t, with equal chance. This is Mendel''s law of segregation.'
        write: 'Law of segregation: each gamete gets one allele'
      - section: 'The gametes'
        say: 'So each parent makes two kinds of gamete, big T and small t.'
        write: 'Gametes: (T, t) × (T, t)'
      - section: 'The cross'
        say: 'Now join every gamete with every gamete. That is big T with big T, big T with small t, small t with big T and small t with small t.'
        write: 'Offspring: TT, Tt, Tt, tt'
      - say: 'That gives one big T big T, two big T small t, and one small t small t.'
        write: '1 TT : 2 Tt : 1 tt'
      - section: 'The probability'
        say: 'Big T is dominant, so it hides small t whenever it is there. So only small t small t shows the recessive trait. That is one out of four, so the probability is one quarter.'
        write: 'P(tt) $= \dfrac{1}{4}$'
      - section: 'Check'
        say: 'Check. Three show the dominant trait and one shows the recessive, which is three to one. Three quarters plus one quarter is one.'
        write: '3 dominant : 1 recessive,  $\dfrac{3}{4} + \dfrac{1}{4} = 1$  ✓'
      - section: 'An example'
        say: 'Two parents who both carry sickle cell, A S and A S, have a one in four chance of an S S child each time.'
        write: 'AS × AS ⇒ P(SS) $= \dfrac{1}{4}$'
      - section: 'Answer'
        say: 'So the probability of a recessive offspring is one quarter, which is option C.'
        write: '$\therefore$ probability $= \dfrac{1}{4}$'
        answer: true
    traps:
      A: 'You went for three quarters. That is the chance of showing the dominant trait, big T big T or big T small t.'
      B: 'You chose one half. That is the chance of a heterozygous child, big T small t.'
      D: 'You picked one. A probability of one would need both parents to be small t small t.'
