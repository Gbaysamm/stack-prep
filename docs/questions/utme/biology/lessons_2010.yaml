      - section: 'The structures'
        say: 'The flipper of a whale has the bones of a five fingered limb inside it, like your arm.'
        write: 'Whale flipper: bones of a five-fingered limb'
      - say: 'The fin of a fish is held up by thin fin rays. It is built in a different way.'
        write: 'Fish fin: thin fin rays'
      - section: 'The name'
        say: 'Structures that do the same job but have different origins are called analogous structures.'
        write: 'Same job, different origin = analogous'
      - section: 'The process'
        say: 'They arise when unrelated groups adapt to the same way of life, and end up looking alike. That is convergent evolution.'
        write: 'Unrelated groups, same way of life ⇒ convergent evolution'
      - section: 'An example'
        say: 'Another example is the wing of a bird, such as the hawk, and the wing of a butterfly. Both fly, but they are built in quite different ways.'
        write: 'Bird wing and butterfly wing: analogous'
      - section: 'Remember'
        say: 'Remember this. Converge means come together. Different starts end up looking alike.'
        write: 'Converge = come together'
      - section: 'Answer'
        say: 'So the flippers of a whale and the fins of a fish are examples of convergent evolution, which is option D.'
        write: '$\therefore$ convergent evolution'
        answer: true
