        write: 'Anaerobic respiration in yeast = fermentation'
      - section: 'How it works'
        say: 'Yeast breaks one glucose molecule into two molecules of ethanol, which is alcohol, and two molecules of carbon four oxide. A little energy is released.'
        write: '$\ce{C6H12O6 -> 2C2H5OH + 2CO2}$ + a little energy'
      - section: 'Muscles are different'
        say: 'Our muscles also respire without oxygen during hard work, but they make lactic acid, not alcohol.'
        write: 'Muscle, anaerobic: glucose → lactic acid'
      - section: 'An example'
        say: 'Palm wine gets stronger as it stands, because yeast turns its sugar into alcohol. The same carbon four oxide makes bread dough rise.'
        write: 'Palm wine gets stronger;  bread dough rises'
      - section: 'Remember'
        say: 'Remember this. Yeast makes alcohol, and muscles make lactic acid.'
        write: 'Yeast → alcohol,  muscle → lactic acid'
      - section: 'Answer'
        say: 'So yeast converts simple sugar into carbon four oxide and alcohol, which is option A.'
        write: '$\therefore$ alcohol'
        answer: true
    traps:
      B: 'You went for acid. Lactic acid is the product of anaerobic respiration in muscle, not in yeast.'
      C: 'You chose oxygen. Respiration never gives out oxygen, and anaerobic respiration takes place without it. Oxygen is given out only in photosynthesis.'
      D: 'You picked water. Water is a product of aerobic respiration, not of fermentation.'
