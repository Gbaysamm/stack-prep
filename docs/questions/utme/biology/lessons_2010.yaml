        write: '$\ce{NH3 -> NO2- -> NO3-}$  (Nitrosomonas, then Nitrobacter)'
      - section: 'What happens to the energy'
        say: 'The energy released by oxidation is first held as A T P, the energy carrier of every cell. Then it is used to build sugar from carbon four oxide.'
        write: 'Oxidation releases energy ⇒ stored as ATP ⇒ used to build sugar'
      - section: 'An example'
        say: 'These nitrifying bacteria work in the soil of every farm. They turn the ammonia from rotting leaves and dung into nitrate for yam and maize.'
        write: 'Farm soil: ammonia from dung → nitrate for yam and maize'
      - section: 'Remember'
        say: 'Remember this. Photosynthesis uses light. Chemosynthesis uses chemical oxidation.'
        write: 'Photo = light,  chemo = chemical oxidation'
      - section: 'Answer'
        say: 'So chemosynthetic organisms get their energy through oxidation, which is option A.'
        write: '$\therefore$ oxidation'
        answer: true
    traps:
      B: 'You went for denitrification. That is the change of nitrates to nitrogen gas by bacteria in waterlogged soil. It is a loss of nitrogen from the soil, not the way these organisms get energy to make food.'
