  17:
    moments:
      - section: 'The question'
        say: 'Which part really pumps blood all round the body of a mammal? Some options carry blood, but only one pumps it.'
        write: 'Main pump of the circulation $= ?$'
      - section: 'The structure'
        say: 'The heart is the pump, and it has four chambers. The two auricles on top receive blood. The two ventricles below pump it out.'
        write: 'Heart: 2 auricles receive, 2 ventricles pump'
      - section: 'How it works'
        say: 'The left ventricle has the thickest muscular wall. It squeezes hard, to push blood through the aorta to the whole body.'
        write: 'Left ventricle: thickest wall ⇒ aorta ⇒ whole body'
      - say: 'The right ventricle pumps blood only to the nearby lungs, so its wall is thinner. The auricles only push blood down into the ventricles below them, so they do not pump blood round the body either.'
        write: 'Right ventricle: lungs only.  Auricles: into ventricles'
      - section: 'The vessels'
        say: 'Arteries and veins are pipes. Arteries carry blood away from the heart, and veins bring it back. They do not pump.'
        write: 'Arteries away, veins back, neither pumps'
      - section: 'An example'
        say: 'Run up a flight of stairs, then feel your pulse at the wrist. Each beat is a squeeze of your left ventricle.'
        write: 'Pulse at the wrist = left ventricle beating'
      - section: 'Remember'
        say: 'Remember this. The left ventricle has the longest journey and the thickest wall.'
        write: 'Left ventricle: longest journey, thickest wall'
      - section: 'Answer'
        say: 'So the main structure that pumps blood round the body is the left ventricle, which is option D.'
        write: '$\therefore$ left ventricle'
        answer: true
    traps:
      A: 'You went for veins. Veins carry blood back to the heart at low pressure. They do not pump.'
      B: 'You chose the right auricle. It only receives blood from the body and passes it to the right ventricle.'
      C: 'You picked arteries. Arteries carry blood pumped by the heart, and their elastic walls do not drive the circulation.'
  18:
    moments:
      - section: 'The question'
        say: 'Blood takes two routes round the body. Which route goes everywhere except the lungs?'
        write: 'Circulation to all parts except the lungs $= ?$'
      - section: 'The process'
        say: 'Mammals have a double circulation. The blood passes through the heart twice in one full trip.'
        write: 'Double circulation: two circuits'
      - section: 'Circuit one'
        say: 'The pulmonary circulation takes blood from the right ventricle to the lungs and back to the heart.'
        write: 'Pulmonary: heart → lungs → heart'
      - section: 'Circuit two'
        say: 'The systemic circulation takes blood from the left ventricle through the aorta to every other part of the body.'
        write: 'Systemic: left ventricle → aorta → whole body'
      - say: 'Then the blood comes back to the heart through the venae cavae.'
        write: 'Back to the heart in the venae cavae'
      - section: 'An example'
        say: 'Blood that feeds your leg muscles when you play football, or your stomach after a meal of eba, travels in the systemic circulation.'
        write: 'Legs, stomach, brain: systemic circulation'
      - section: 'Remember'
        say: 'Remember this. Systemic means the whole system of the body. Pulmonary means the lungs.'
        write: 'Systemic = whole body,  pulmonary = lungs'
      - section: 'Answer'
        say: 'So circulation to all parts except the lungs is the systemic circulation, which is option B.'
        write: '$\therefore$ systemic circulation'
        answer: true
    traps:
      A: 'You went for the pulmonary artery. It is one vessel, and it carries blood from the heart to the lungs only.'
      C: 'You chose the lymphatic system. It drains tissue fluid back to the blood, but it does not carry blood.'
      D: 'You picked the pulmonary circulation. That is the circuit that serves only the lungs.'
  19:
    moments:
