      A: 'You went for divergent evolution. That gives homologous structures, one body plan used for different jobs, such as the whale flipper and the human arm.'
      B: 'You chose coevolution. Coevolution is two species changing together, such as a flower and the insect that pollinates it.'
      C: 'You picked continuous variation. That is a range of values within one species, such as height, not a pattern of evolution.'
