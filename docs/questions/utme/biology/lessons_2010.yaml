        write: 'Insectivorous plants: green, but soil poor in nitrogen'
      - section: 'How they feed'
        say: 'First they trap a whole insect. The sundew uses sticky hairs, and the bladderwort uses tiny bladders under water.'
        write: 'Step 1: trap a whole insect'
