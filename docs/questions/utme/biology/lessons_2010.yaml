        say: 'This is chemosynthesis, a kind of autotrophic nutrition. The bacteria make food from carbon four oxide and water, as green plants do, but without light.'
        write: 'Chemosynthesis: food from $\ce{CO2}$ and water, no light'
      - section: 'Where the energy comes from'
        say: 'They get the energy by oxidising simple inorganic substances, such as ammonia, nitrites or hydrogen sulphide.'
        write: 'Energy from oxidising ammonia, nitrite, hydrogen sulphide'
