        write: 'Man has one X ⇒ one recessive allele shows ⇒ commoner in men'
      - section: 'Answer'
        say: 'So characters from a gene on the X chromosome are sex linked, which is option B.'
        write: '$\therefore$ Sex-linked'
        answer: true
    traps:
