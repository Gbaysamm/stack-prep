  50:
    moments:
      - section: 'The question'
        say: 'We must find what the wings of a bat and of a bird are an example of, as organs of flight.'
        write: 'Bat and bird wings, as organs of flight, show $?$'
      - section: 'The idea'
        say: 'Convergent evolution is when unrelated groups evolve similar structures for the same job, because they live the same way.'
        write: 'Convergent: unrelated groups, similar structures, same job'
      - section: 'Compare the wings'
        say: 'The bat flies on a sheet of skin stretched between very long fingers.'
        write: 'Bat: skin stretched between long fingers'
      - say: 'The bird flies on feathers fixed to its arm and its fused fingers.'
        write: 'Bird: feathers on the arm and fused fingers'
      - say: 'The wings do the same job, but they are built differently and evolved separately. As wings, they are analogous structures.'
        write: 'Same job, different build → analogous → convergent'
      - section: 'The bones beneath'
        say: 'The arm bones underneath are homologous, from a common ancestor. But that ancestor had no wings, so the wings arose twice.'
        write: 'Arm bones homologous;  wings arose separately'
      - section: 'Answer'
        say: 'So the wings of a bat and a bird, as organs of flight, show convergent evolution, which is option A.'
        write: '$\therefore$ Convergent evolution'
        answer: true
    traps:
      B: 'You went for continuous variation. That is the gradual range in a trait such as height within one species.'
      C: 'You chose coevolution. That is two species evolving together, in response to each other, like a flower and its pollinator.'
      D: 'You picked divergent evolution. Divergent evolution makes homologous structures for different jobs. These wings arose separately for the same job.'
