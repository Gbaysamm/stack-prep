        say: 'Inbreeding is the opposite. It mates close relatives, which have similar genes.'
        write: 'Inbreeding: close relatives, similar genes'
      - section: 'Answer'
        say: 'So crossing individuals of one species with different characters is cross breeding, which is option A.'
        write: '$\therefore$ Cross breeding'
        answer: true
    traps:
      B: 'You went for polygenic inheritance. That is a trait controlled by many genes, such as height.'
      C: 'You chose non disjunction. That is the failure of chromosomes to separate during cell division.'
