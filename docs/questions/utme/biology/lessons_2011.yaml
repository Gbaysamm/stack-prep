        write: '1. True ✓'
      - say: 'The second part is the error. Acquired changes are in the body cells, not in the genes of the sex cells, so they are not inherited.'
        write: '2. False ✗, body changes do not reach the genes'
      - section: 'The evidence'
        say: 'A goat whose ear is cut does not have kids with short ears, and a blacksmith''s children are not born with big arms.'
        write: 'Cut-eared goat → normal kids'
      - section: 'Answer'
        say: 'So Lamarck''s fallacy was the idea that acquired traits are heritable, which is option B.'
        write: '$\therefore$ Acquired traits are heritable'
        answer: true
    traps:
      A: 'You went for disuse. Body parts do shrink with disuse. The mistake was thinking this passes to the offspring.'
      C: 'You chose seldom formed. Acquired traits form often, such as muscles from exercise, so that was not his mistake.'
      D: 'You picked use. Body parts do grow with use. The mistake was thinking this passes to the offspring.'
