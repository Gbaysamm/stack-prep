  18:
    moments:
      - section: 'The question'
        say: 'There are four organisms, each matched with a way of feeding. Only one pair is right. Let us test them one by one.'
        write: 'Which pair is correctly matched?'
      - section: 'The words'
        say: 'Auto means self, so an autotroph makes its own food. Hetero means other, so a heterotroph feeds on food made by others.'
        write: 'Autotroph: makes its own food.  Heterotroph: feeds on others'
      - section: 'Test each pair'
        say: 'One, sundew. It is a green plant that traps insects for nitrogen, and it makes its own food. It is not a parasite.'
        write: 'I. Sundew: insectivorous, not a parasite ✗'
      - say: 'Two, Amoeba. It engulfs food particles and cannot make its own food. So it is not autotrophic.'
        write: 'II. Amoeba: engulfs food, not autotrophic ✗'
      - say: 'Three, an alga. It has chlorophyll and makes its own food. So it is autotrophic, not saprophytic.'
        write: 'III. Alga: photosynthesises, not saprophytic ✗'
      - say: 'Four, Agama. It eats insects, which is food made by others. So it is heterotrophic.'
        write: 'IV. Agama: eats insects, heterotrophic ✓'
      - section: 'An example'
        say: 'The agama on your wall snapping up flies is feeding on others, just as you do when you eat yam.'
        write: 'Agama eats flies, you eat yam: both heterotrophs'
      - section: 'Remember'
        say: 'Remember. Auto feeds itself, and hetero feeds on others.'
        write: 'Auto = self-feeding,  hetero = feeding on others'
      - section: 'Answer'
        say: 'So only pair four is correctly matched, which is option C.'
        write: '$\therefore$ IV. Heterotrophism → Agama'
        answer: true
    traps:
      A: 'You went for two. Amoeba cannot make its own food, so it is heterotrophic, not autotrophic.'
      B: 'You chose three. An alga makes its own food by photosynthesis, so it is autotrophic, not a saprophyte.'
      D: 'You picked one. Sundew is a green plant that traps insects. It is insectivorous, not a parasite.'
  19:
    moments:
      - section: 'The question'
        say: 'There are three tubes of cane sugar, one with water, one with dilute acid and one with its enzyme. In which tubes does glucose appear?'
        write: 'I water, II dilute acid, III enzyme. Glucose in $?$'
      - section: 'The sugar'
        say: 'Cane sugar is sucrose, a disaccharide, which means a double sugar. Hydrolysis, splitting with water, breaks it into glucose and fructose.'
        write: 'Sucrose + water → glucose + fructose'
      - say: 'But water alone is far too slow. The splitting needs a helper, either a warm dilute acid or an enzyme.'
        write: 'Needs a helper, acid or enzyme'
      - section: 'Test each tube'
        say: 'Tube one has water alone. Water by itself cannot split sucrose, so no glucose appears.'
        write: 'I. water only → no glucose ✗'
      - say: 'Tube two has dilute acid. When warmed, acid hydrolyses sucrose, so glucose appears.'
        write: 'II. dilute acid, warmed → glucose ✓'
      - say: 'Tube three has the enzyme that breaks down cane sugar. It hydrolyses sucrose too, so glucose appears.'
        write: 'III. enzyme → glucose ✓'
      - section: 'How to show it'
        say: 'To show it, boil each tube with Benedict''s solution. A brick red colour means glucose is there.'
        write: 'Boil with Benedict''s → brick-red ⇒ glucose'
      - section: 'An example'
        say: 'Chew a piece of sugar cane. The sweetness is sucrose, and your gut must split it before your body can use it.'
        write: 'Sugar cane: sucrose, split in the gut'
      - section: 'Remember'
        say: 'Remember. Sucrose needs an acid or an enzyme to break it. Water alone will not do.'
        write: 'Acid or enzyme splits sucrose; water alone does not'
      - section: 'Answer'
        say: 'So glucose is found in tubes two and three only, which is option B.'
        write: '$\therefore$ II and III only'
        answer: true
    traps:
      A: 'You went for one and two. Water alone does not hydrolyse sucrose, so tube one has no glucose. And tube three, with the enzyme, does have glucose.'
      C: 'You chose one only. Tube one has only water, which cannot split sucrose. Glucose forms in tubes two and three.'
      D: 'You picked all three. Tube one has only water, which cannot split sucrose.'
  20:
    moments:
      - section: 'The question'
        say: 'The enzyme in tube three splits cane sugar. What is its name?'
        write: 'Enzyme that hydrolyses cane sugar $= ?$'
      - section: 'The rule'
        say: 'Enzymes are usually named after their substrate, with ase on the end.'
        write: 'Enzyme name = substrate + -ase'
      - section: 'The enzyme'
        say: 'Cane sugar is sucrose, so its enzyme is sucrase, also called invertase.'
        write: 'Sucrose → sucrase (invertase)'
      - say: 'Sucrase splits sucrose into glucose and fructose.'
        write: 'Sucrose → glucose + fructose'
      - section: 'An example'
        say: 'In your body, the wall of the small intestine makes sucrase. It works on the sugar in a cup of sweet tea or a piece of sugar cane.'
        write: 'Small intestine makes sucrase'
      - section: 'The others'
        say: 'The other three enzymes have other jobs. Rennin curdles the protein in milk.'
        write: 'Rennin: curdles milk'
      - say: 'Erepsin breaks peptides, short chains of amino acids, into amino acids.'
        write: 'Erepsin: peptides → amino acids'
      - say: 'Maltase splits maltose, a different sugar, not sucrose.'
        write: 'Maltase: maltose only'
      - section: 'Remember'
        say: 'Remember. Sucrose goes with sucrase, and maltose with maltase.'
        write: 'Sucrose ↔ sucrase,  maltose ↔ maltase'
      - section: 'Answer'
        say: 'So the enzyme that splits cane sugar is sucrase, which is option C.'
        write: '$\therefore$ Sucrase'
        answer: true
    traps:
      A: 'You went for rennin. Rennin curdles milk protein in the stomach of young mammals.'
      B: 'You chose erepsin. Erepsin breaks peptides into amino acids, not sugar.'
      D: 'You picked maltase. It is the right kind of enzyme, but it splits maltose, not cane sugar.'
  21:
    moments:
      - section: 'The question'
        say: 'Spin round and round, then stop, and the room keeps turning. Which part of the ear senses that?'
        write: 'Part of the ear for balance?'
      - section: 'The inner ear'
        say: 'The inner ear has two jobs, hearing and balance. The cochlea, the coiled tube, is for hearing.'
        write: 'Cochlea → hearing'
      - say: 'The semicircular canals, three looped tubes beside it, are for balance.'
        write: 'Semicircular canals → balance'
      - section: 'How it works'
        say: 'There are three semicircular canals at right angles to one another, each filled with fluid.'
        write: '3 canals at right angles, filled with fluid'
      - say: 'When the head turns, the fluid moves and bends sensory hairs in a swelling at the base of each canal, called the ampulla.'
        write: 'Head turns → fluid moves → hairs in the ampulla bend'
      - say: 'Nerves carry these messages to the cerebellum, which keeps the body balanced.'
        write: 'Nerve → cerebellum → balance'
      - section: 'An example'
        say: 'After spinning at play you stop, but the fluid keeps moving, so you feel dizzy.'
        write: 'Spin, stop, fluid still moving → dizzy'
      - section: 'Remember'
        say: 'Remember. There are three canals for three directions of turning.'
        write: 'Three canals, three directions'
      - section: 'Answer'
        say: 'So balance is kept by the semicircular canals, which is option C.'
        write: '$\therefore$ Semicircular canals'
        answer: true
    traps:
      A: 'You went for the cochlea. It is also in the inner ear, but it turns sound into nerve impulses, so it is for hearing.'
      B: 'You chose the pinna. That is the outer ear flap that collects sound.'
      D: 'You picked the ossicles. They are three small bones that pass sound across the middle ear.'
  22:
    moments:
      - section: 'The question'
        say: 'Air goes down into the lungs through tubes that get smaller and smaller. In what order?'
        write: 'Path of air through the lungs?'
      - section: 'The path'
        say: 'Air enters through the nose and goes down the windpipe, the trachea.'
        write: '1. Trachea (windpipe)'
      - say: 'The trachea divides into two bronchi, one to each lung.'
        write: '2. Bronchi, one to each lung'
      - say: 'Each bronchus branches again and again into fine bronchioles.'
        write: '3. Bronchioles, fine branches'
      - say: 'The bronchioles end in tiny air sacs, the alveoli, where gas exchange takes place.'
        write: '4. Alveoli, where gases are exchanged'
      - section: 'A picture'
        say: 'Think of a mango tree turned upside down. First comes the trunk, then the big branches, then the twigs and then the leaves.'
        write: 'Trunk → branches → twigs → leaves'
      - section: 'Remember'
        say: 'Remember. Go from the widest tube to the smallest.'
        write: 'Widest → smallest'
      - section: 'Answer'
        say: 'So air goes from trachea to bronchi to bronchioles to alveoli, which is option A.'
        write: '$\therefore$ trachea → bronchi → bronchioles → alveoli'
        answer: true
    traps:
      B: 'You went for B. Air reaches the trachea before the bronchi, and the alveoli are the last stop.'
      C: 'You chose C. It puts the twigs before the branches. The bronchi come before the much finer bronchioles.'
      D: 'You picked D. That is the reverse order, the path of air going out.'
  23:
    moments:
      - section: 'The question'
        say: 'Switch on the kitchen light at night and the cockroaches dash away. What do we call that response?'
        write: 'Cockroach moves away from light, called $?$'
      - section: 'The word'
        say: 'A taxis is the movement of a whole organism towards or away from a stimulus.'
        write: 'Taxis = whole organism moves to or from a stimulus'
      - section: 'Its sign'
        say: 'Moving towards the stimulus is positive. Moving away from it is negative.'
        write: 'Towards = positive;  away = negative'
      - say: 'Here the stimulus is light, so the response is a phototaxis.'
        write: 'Light ⇒ photo-'
      - say: 'The cockroach runs away from the light, so it shows negative phototaxis.'
        write: 'Away from light ⇒ negative phototaxis'
      - section: 'Not a tropism'
        say: 'A tropism is different. It is a growth movement of part of a fixed plant, like a shoot bending towards light.'
        write: 'Tropism = growth of a plant part'
      - section: 'Remember'
        say: 'Remember. Tropisms are for plants that grow, and taxes are for organisms that move about.'
        write: 'Plants grow (tropism), animals move (taxis)'
      - section: 'Answer'
        say: 'So the cockroach shows negative phototaxis, which is option B.'
        write: '$\therefore$ Negative phototaxis'
        answer: true
    traps:
      A: 'You went for positive phototaxis. That would mean moving towards the light, but the cockroach runs away.'
      C: 'You chose negative phototropism. A tropism is a growth response of a plant part, not the movement of a whole animal.'
      D: 'You picked positive phototropism. That is a shoot growing towards light. It does not apply to an animal.'
  24:
    moments:
      - section: 'The question'
        say: 'The xylem and phloem run through a plant like pipes. What do they carry?'
        write: 'Vascular tissues are for $?$'
      - section: 'The tissues'
        say: 'The vascular tissues of a flowering plant are the xylem and the phloem.'
        write: 'Vascular tissues = xylem + phloem'
      - section: 'What each carries'
        say: 'Xylem carries water and dissolved mineral salts up from the roots to the leaves.'
        write: 'Xylem: water + mineral salts, roots → leaves'
      - say: 'Phloem carries the food the leaves make, mainly sugar, to other parts of the plant.'
        write: 'Phloem: food (sugar), leaves → other parts'
      - section: 'An example'
        say: 'The starch in a cassava root or a yam tuber came down from the leaves as sugar in the phloem.'
        write: 'Cassava root, yam tuber: food brought by phloem'
      - section: 'Pipes, not forces'
        say: 'Transpiration pull and suction pressure are forces that help move water. The tissues are the pipes, not the forces.'
        write: 'Transpiration pull, suction pressure = forces, not tissues'
      - section: 'Remember'
        say: 'Remember. Xylem is for water, and phloem is for food.'
        write: 'Xylem → water,  phloem → food'
      - section: 'Answer'
        say: 'So the vascular tissues carry food and water, which is option A.'
        write: '$\therefore$ The movement of food and water'
        answer: true
    traps:
      B: 'You went for suction pressure. That is a force that draws water into cells, not the work of the vascular tissue.'
      C: 'You chose transpiration pull. It is a force that lifts water in the xylem, but the tissues are the pipes that carry it.'
      D: 'You picked gases and water. Gases move mainly by diffusion through the stomata and air spaces, not through the vascular tissue.'
  25:
    moments:
      - section: 'The question'
        say: 'One organ keeps the water, salts, hydrogen ions and urea in your blood just right. Which one?'
        write: 'Regulates water, salts, $\ce{H+}$ and urea in blood?'
      - section: 'The organ'
        say: 'The kidney is the organ of excretion and osmoregulation in mammals.'
        write: 'Kidney: excretion + osmoregulation'
      - section: 'How it works'
        say: 'Each kidney is made of about a million tiny tubes called nephrons. At the start of each nephron is a knot of capillaries, the glomerulus, where blood is filtered under pressure.'
        write: 'Glomerulus: blood filtered under pressure'
      - say: 'Then the tubule takes back the useful materials the body needs.'
        write: 'Tubule: takes back what the body needs'
      - say: 'It controls how much water, salts and hydrogen ions it takes back, and it passes out urea in the urine.'
        write: 'Controls water, salts, $\ce{H+}$;  removes urea'
      - section: 'An example'
        say: 'In the harmattan, or on a hot day when you drink little, your kidneys hold on to water and you pass less, darker urine.'
        write: 'Harmattan, little water → less, darker urine'
      - section: 'Remember'
        say: 'Remember. The kidney is the blood''s cleaner and balancer.'
        write: 'Kidney = cleaner + balancer of the blood'
      - section: 'Answer'
        say: 'So the organ that regulates these in the blood is the kidney, which is option B.'
        write: '$\therefore$ Kidney'
        answer: true
    traps:
      A: 'You went for the liver. The liver makes urea from extra amino acids, but the kidney removes it and balances the water and salts.'
      C: 'You chose the bladder. It only stores urine. It does not regulate the blood.'
      D: 'You picked the colon. It takes back water from undigested food, not urea or hydrogen ions.'
  26:
    moments:
      - section: 'The question'
        say: 'A tilapia pushes water over its gills in one direction. Where does the water go in, and where does it come out?'
        write: 'One-way path of water in a fish?'
      - section: 'The steps'
        say: 'The fish opens its mouth and lowers the floor of the mouth, so water flows in. The gill cover, the operculum, stays shut.'
        write: '1. Mouth opens, water in, operculum shut'
      - say: 'Then it closes its mouth and raises the floor, so water is forced over the gills.'
        write: '2. Mouth shuts, water forced over the gills'
      - say: 'Oxygen diffuses from the water into the blood in the gill filaments.'
        write: 'Gills: $\ce{O2}$ into the blood'
      - say: 'Then the operculum opens and the water flows out.'
        write: '3. Operculum opens, water out'
      - section: 'An example'
        say: 'Watch a tilapia in a bowl. The mouth and the gill covers open in turn.'
        write: 'Tilapia: mouth and gill covers open in turn'
      - section: 'Remember'
        say: 'Remember. Water goes in at the mouth, over the gills and out under the operculum.'
        write: 'In at the mouth, over the gills, out at the operculum'
      - section: 'Answer'
        say: 'So the sequence is mouth, then gills, then operculum, which is option D.'
        write: '$\therefore$ mouth → gills → operculum'
        answer: true
    traps:
      A: 'You went for A. That is the reverse. Water leaves under the operculum, and it does not enter there.'
      B: 'You chose B. Water must enter through the mouth before it reaches the gills.'
      C: 'You picked C. It puts the way out before the gills. The operculum opens only after the water has passed the gills.'
  27:
    moments:
      - section: 'The question'
        say: 'Paramecium and Amoeba are both single celled. How do they both multiply without sex?'
        write: 'Asexual reproduction in Paramecium and Amoeba?'
      - section: 'The organisms'
        say: 'Paramecium and Amoeba are single celled protists.'
        write: 'Paramecium, Amoeba: single-celled protists'
      - section: 'The process'
        say: 'Both reproduce asexually by binary fission.'
        write: 'Binary fission'
      - say: 'First the nucleus divides into two.'
        write: 'Step 1. Nucleus divides'
      - say: 'Then the cytoplasm divides, giving two daughter cells.'
        write: 'Step 2. Cytoplasm divides → 2 daughter cells'
      - section: 'An example'
        say: 'A pond in the rainy season can fill with these protists, because fission doubles their number again and again.'
        write: '1 → 2 → 4 → 8 → …'
      - section: 'Remember'
        say: 'Remember. Fission means splitting, so one cell becomes two.'
        write: 'Fission = splitting, one cell → two'
      - section: 'Answer'
        say: 'So the asexual reproduction common to both is fission, which is option D.'
        write: '$\therefore$ Fission'
        answer: true
    traps:
      A: 'You went for budding. Budding is how yeast and Hydra reproduce, by a small outgrowth, not by splitting in half.'
      B: 'You chose sporulation. Making spores is the way of fungi such as Rhizopus, and of Plasmodium.'
      C: 'You picked fragmentation. That is breaking into pieces, as in Spirogyra, not one cell dividing.'
  28:
    moments:
      - section: 'The question'
        say: 'Plants and animals help each other all the time. What does each one give the other?'
        write: 'Why are plants and animals in mutualism?'
      - section: 'The word'
        say: 'Mutualism is a relationship in which both partners benefit.'
        write: 'Mutualism = both partners benefit'
      - section: 'The swap'
        say: 'Animals breathe out carbon four oxide, which plants take in for photosynthesis.'
        write: 'Animals → $\ce{CO2}$ → plants'
      - say: 'Plants give off oxygen in photosynthesis, which animals take in for respiration.'
        write: 'Plants → $\ce{O2}$ → animals'
      - say: 'So each one uses the waste gas of the other, and both gain.'
        write: 'Each uses the other''s waste gas ⇒ both gain'
      - section: 'An example'
        say: 'A goat grazing under a mango tree breathes out carbon four oxide that the tree uses, and breathes in oxygen that the tree gave out.'
        write: 'Goat and mango tree swap $\ce{CO2}$ and $\ce{O2}$'
      - section: 'Remember'
        say: 'Remember. In mutualism, both sides must gain.'
        write: 'Both sides gain'
      - section: 'Answer'
        say: 'So plants and animals are in mutualism because they use each other''s waste gases, which is option C.'
        write: '$\therefore$ They use each other''s waste gases'
        answer: true
    traps:
      A: 'You went for rivals. Rivals compete, and competition harms both, so it is not mutualism.'
      B: 'You chose food from plants. Animals eating plants benefits only the animals, so it is not a two way gain.'
      D: 'You picked neighbours. Living close together does not by itself mean that both benefit.'
  29:
    moments:
      - section: 'The question'
        say: 'A soil sample is weighed, dried in an oven, then roasted. From the weights, what percentage of the soil is humus?'
        write: '% humus in the soil $= ?$'
      - section: 'The data'
        say: 'The basin alone is eighty point five grams. The basin with the soil is one hundred and one point five grams.'
        write: 'Basin $= 80.5$ g,  basin + soil $= 101.5$ g'
      - say: 'After drying in the oven it is ninety-nine grams. After roasting it is ninety-five point five grams.'
        write: 'After drying $= 99.0$ g,  after roasting $= 95.5$ g'
      - section: 'The rule'
        say: 'Drying drives off the water. Roasting then burns off the humus, which is the dead organic matter.'
        write: 'Drying removes water;  roasting burns off humus'
      - say: 'The percentage of humus is the mass of humus over the mass of soil, times one hundred.'
        write: '% humus $= \dfrac{\text{mass of humus}}{\text{mass of soil}} \times 100$'
      - section: 'The working'
        say: 'The mass of soil is one hundred and one point five minus eighty point five, which is twenty-one grams.'
        write: 'Soil $= 101.5 - 80.5 = 21.0$ g'
      - say: 'The mass of humus is ninety-nine minus ninety-five point five, which is three point five grams.'
        write: 'Humus $= 99.0 - 95.5 = 3.5$ g'
      - say: 'Now three point five over twenty-one, times one hundred, is sixteen point seven percent.'
        write: '% humus $= \dfrac{3.5}{21.0} \times 100 = 16.7\%$'
      - section: 'Check'
        say: 'Check. Three point five is one sixth of twenty-one, and one sixth is about sixteen point seven percent. Good.'
        write: '$3.5 = \tfrac{1}{6} \times 21$,  $\tfrac{1}{6} \approx 16.7\%$ ✓'
      - section: 'Answer'
        say: 'So the percentage of humus in the soil is sixteen point seven percent, which is option A.'
        write: '$\therefore$ % humus $= 16.7\%$'
        answer: true
    traps:
      B: 'You went for seventeen point six percent. The digits are swapped. Three point five over twenty-one, times one hundred, is sixteen point seven.'
      C: 'You chose twenty-six point seven percent. That would need five point six grams of humus, but only three point five grams burned off.'
      D: 'You picked sixteen point two percent. It is close, but three point five over twenty-one works out to sixteen point seven percent.'
  30:
    moments:
