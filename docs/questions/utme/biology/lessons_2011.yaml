  43:
    moments:
      - section: 'The question'
        say: 'A red flowered plant crossed with a white flowered plant gives a pink flowered plant. We must name this kind of inheritance.'
        write: 'Red × white → pink. Example of $?$'
      - section: 'The rule'
        say: 'In incomplete dominance neither allele is fully dominant. So the heterozygote, an offspring with two different alleles, shows a form in between the two.'
        write: 'Incomplete dominance: heterozygote is in between'
      - section: 'The cross'
        say: 'Let big R stand for red and big W for white. The parents are big R big R and big W big W.'
        write: 'Parents:  RR (red) × WW (white)'
      - say: 'The red parent gives only big R gametes, and the white parent gives only big W.'
        write: 'Gametes:  R  and  W'
      - say: 'Every offspring gets one of each, so all of them are big R big W.'
        write: 'Offspring:  all RW'
      - say: 'Neither allele hides the other, so big R big W is pink, a colour between red and white.'
        write: 'RW = pink (in between)'
      - section: 'Not codominance'
        say: 'In codominance both alleles show fully side by side, like red and white patches on one flower, or the A B blood group.'
        write: 'Codominance: both show fully (patches, group AB)'
      - section: 'Answer'
        say: 'So a pink flower from red and white parents is incomplete dominance, which is option B.'
        write: '$\therefore$ Incomplete dominance'
        answer: true
    traps:
      A: 'You went for codominance. Codominance would show both colours fully, as red and white patches, not a pink blend.'
      C: 'You chose mutation. A mutation is a sudden change in a gene, not the regular result of this cross.'
      D: 'You picked linkage. Linkage is genes passed on together because they sit on one chromosome.'
