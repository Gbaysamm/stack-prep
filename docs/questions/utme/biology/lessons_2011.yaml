      - section: 'The rule'
        say: 'Drying drives off the water. Roasting then burns off the humus, which is the dead organic matter.'
        write: 'Drying removes water;  roasting burns off humus'
      - say: 'The percentage of humus is the mass of humus over the mass of soil, times one hundred.'
        write: '% humus $= \dfrac{\text{mass of humus}}{\text{mass of soil}} \times 100$'
      - section: 'The working'
        say: 'The mass of soil is one hundred and one point five minus eighty point five, which is twenty-one grams.'
        write: 'Soil $= 101.5 - 80.5 = 21.0$ g'
      - say: 'The mass of humus is ninety-nine minus ninety-five point five, which is three point five grams.'
        write: 'Humus $= 99.0 - 95.5 = 3.5$ g'
      - say: 'Now three point five over twenty-one, times one hundred, is sixteen point seven percent.'
        write: '% humus $= \dfrac{3.5}{21.0} \times 100 = 16.7\%$'
      - section: 'Answer'
        say: 'So the percentage of humus in the soil is sixteen point seven percent, which is option A.'
        write: '$\therefore$ % humus $= 16.7\%$'
        answer: true
    traps:
