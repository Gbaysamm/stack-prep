        write: 'Lagos lagoon: oysters, mussels strain water'
      - section: 'The others'
        say: 'The other three are not filter feeders. The shark bites its prey, and the butterfly and the mosquito suck fluids.'
        write: 'Shark bites;  butterfly, mosquito suck fluids'
      - section: 'Remember'
        say: 'Remember. The biggest animal eats the smallest, by sieving.'
        write: 'Biggest eats smallest, by sieving'
      - section: 'Answer'
        say: 'So the filter feeding animal is the whale, which is option C.'
        write: '$\therefore$ Whale'
        answer: true
    traps:
      A: 'You went for the shark. It lives in the sea too, but most sharks hunt and bite large prey.'
      B: 'You chose the butterfly. It sucks nectar through its long proboscis, so it is a fluid feeder.'
      D: 'You picked the mosquito. It pierces the skin and sucks blood, so it is a fluid feeder.'
  31:
    moments:
      - section: 'The question'
        say: 'The population pyramid of a developing country has a broad base and a sharp top. What does that sharp top tell us?'
        write: 'Feature of a developing country''s pyramid?'
      - section: 'The pyramid'
        say: 'A population pyramid shows how many people are in each age group, with the youngest at the bottom.'
        write: 'Youngest at the bottom, oldest at the top'
      - section: 'Reading it'
