        write: '$I^AI^A$ or $I^Ai$ → A;   $I^BI^B$ or $I^Bi$ → B'
      - say: 'Big I A with big I B gives group A B, and small i with small i gives group O.'
        write: '$I^AI^B$ → AB;   $ii$ → O'
      - section: 'Answer'
