# UTME 2011 Biology, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the Nigerian classroom way: name the structure or
# process, say what it does or how it works in simple steps, a real Nigerian example, a way to
# remember it, and the answer moment that names the option. Calculations and crosses go step by
# step on the board. Where a question has a drawing, the voice says what to look at in it.
# traps gives one kind line for each wrong option.
#
#   say:    heard, not read. Formulas written as formulas (the voice reads them letter by letter), units in words.
#   write:  the one line written while it is said, with LaTeX between dollar signs.
#   answer: true on the moment that gives the answer.
#
# Keyed on question number, like explanations_2011.yaml. Answers match that file.
format_version: 1
exam_year: 2011
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'We are told that only the adult male agama lizard has a bright red head. We must find what that red head does for him.'
        write: 'Red head of the male Agama, what is it for?'
      - section: 'The colour'
        say: 'The red head is a breeding colour. Only adult males that are ready to mate wear it.'
        write: 'Red head = breeding colour, adult males only'
      - section: 'How it works'
        say: 'In the breeding season the male climbs to a high spot, bobs his head up and down and shows off his colours.'
        write: 'Male climbs high, bobs his head, shows his colour'
      - say: 'The females see the bright colour and come to him to mate. So the colour is a courtship signal.'
        write: 'Bright colour → attracts females → mating'
      - section: 'Answer'
        say: 'So the red head of the male agama attracts female lizards for mating, which is option C.'
        write: '$\therefore$ It attracts female lizards for mating'
        answer: true
    traps:
      A: 'You went for camouflage. But a bright red head does the opposite of hiding. It makes the lizard easy to see.'
      B: 'You chose scaring other males. The male does chase rivals off with head bobbing and chasing, but the bright colour itself is mainly the signal that draws the females.'
      D: 'You picked a warning to predators. Agama lizards are not bad tasting, so the colour is not a warning. Birds and snakes eat them.'
  3:
    moments:
      - section: 'The question'
        say: 'We are given four organisms, Agama, Bufo, Spirogyra and Tilapia. We must find the one whose single individual has the smallest biomass.'
        write: 'Smallest biomass of one individual?'
      - section: 'The word'
        say: 'Biomass is the mass of living matter. Here we compare the mass of just one individual of each kind.'
        write: 'Biomass = mass of living matter'
      - section: 'Compare them'
        say: 'Agama is a lizard, Bufo is a toad and Tilapia is a fish. All three are vertebrates, each weighing tens or hundreds of grams.'
        write: 'Agama, Bufo, Tilapia: vertebrates, tens to hundreds of grams'
      - say: 'Spirogyra is a green alga. It is a thin thread of cells, and one thread weighs only a tiny fraction of a gram.'
        write: 'Spirogyra: a thread of cells, a tiny fraction of a gram'
      - section: 'Answer'
        say: 'So Spirogyra has the smallest biomass for one individual, which is option C.'
        write: '$\therefore$ Spirogyra sp.'
        answer: true
    traps:
      A: 'You went for Agama. A lizard is a vertebrate weighing many grams, far more than one thin thread of alga.'
      B: 'You chose Bufo, the toad. It is a vertebrate with a large body, so its biomass is far greater.'
      D: 'You picked Tilapia. A tilapia fish can weigh hundreds of grams, far heavier than Spirogyra.'
  4:
    moments:
      - section: 'The question'
        say: 'We must name the two groups into which seed plants are divided.'
        write: 'Seed plants are divided into $?$'
      - section: 'The group'
        say: 'Seed plants, also called spermatophytes, are the plants that reproduce by seeds.'
        write: 'Seed plants (spermatophytes) reproduce by seeds'
      - section: 'The two divisions'
        say: 'The first group, the gymnosperms, carry naked seeds on cones, like the pine tree.'
        write: 'Gymnosperms: naked seeds on cones (pine)'
      - say: 'The second group, the angiosperms, carry their seeds inside a fruit, like the mango and the orange.'
        write: 'Angiosperms: seeds inside a fruit (mango, orange)'
      - section: 'One level down'
        say: 'Monocots and dicots are only the two classes inside the angiosperms. Maize is a monocot and beans are a dicot.'
        write: 'Monocots (maize) and dicots (beans): inside the angiosperms'
      - section: 'The names'
        say: 'Gymno means naked and angio means a container. So gymnosperm seeds are naked, and angiosperm seeds are enclosed in a fruit.'
        write: 'Gymno = naked,  angio = container'
      - section: 'Answer'
        say: 'So seed plants are divided into angiosperms and gymnosperms, which is option B.'
        write: '$\therefore$ Angiosperms and gymnosperms'
        answer: true
    traps:
      A: 'You went for tracheophytes and ferns. Ferns make no seeds at all, and tracheophytes means every plant with vascular tissue.'
      C: 'You chose monocots and dicots. They are real groups, but they divide only the angiosperms, not all seed plants.'
      D: 'You picked thallophytes and bryophytes. These are algae and mosses, which make no seeds.'
  5:
    moments:
      - section: 'The question'
        say: 'We must find the group of vertebrates that shows the most parental care.'
        write: 'Most parental care?'
      - section: 'The idea'
        say: 'Parental care means the parents protect and feed their young after birth or hatching.'
        write: 'Parental care = protecting and feeding the young'
      - section: 'Mammals'
        say: 'Mammals give the most care. The young grow inside the mother and are born alive.'
        write: 'Mammals: young grow inside, born alive'
      - say: 'Then the mother feeds them on milk and guards them for a long time.'
        write: 'Fed on milk, guarded for a long time'
      - section: 'The others'
        say: 'Birds also sit on their eggs and feed their chicks, but only for a few weeks, so their care is shorter.'
        write: 'Birds: care for a shorter time'
      - say: 'Most reptiles and amphibians lay their eggs and leave them, so they give little or no care.'
        write: 'Reptiles, amphibians: little or no care'
      - section: 'Answer'
        say: 'So parental care is shown most by the mammals, which is option D.'
        write: '$\therefore$ Mammalia'
        answer: true
    traps:
      A: 'You went for reptiles. Most reptiles, like the agama, lay eggs and leave them, so there is little or no care.'
      B: 'You chose amphibians. Most toads and frogs leave their eggs in the water with no care at all.'
      C: 'You picked birds. Birds do brood and feed their chicks, but for a shorter time than mammals care for theirs.'
  6:
    moments:
      - section: 'The question'
        say: 'We are given drawings of four small animals, and we must find the two that are agricultural pests.'
        write: 'Which are agricultural pests?'
      - section: 'Look at the drawings'
        say: 'Look at drawing one. It has short wings and long jumping back legs, so it is a grasshopper.'
        write: 'I: long jumping hind legs → grasshopper'
      - say: 'Drawing two is a young cockroach, seen from above.'
        write: 'II: young cockroach'
      - say: 'Drawing three shows a comma shaped pupa and a larva hanging in water, so they are young mosquitoes.'
        write: 'III: mosquito pupa and larva in water'
      - say: 'Drawing four is a soft ringed body with bristles, on a twig. It is a hairy caterpillar.'
        write: 'IV: hairy caterpillar on a twig'
      - section: 'The idea'
        say: 'An agricultural pest is an animal that damages crops on the farm.'
        write: 'Agricultural pest = damages farm crops'
      - section: 'Test each one'
        say: 'The grasshopper has biting and chewing mouthparts. It eats the leaves of maize, millet and cassava.'
        write: 'I chews maize, millet and cassava leaves ✓'
      - say: 'The caterpillar, the larva of a moth or butterfly, also chews leaves, such as cabbage, cowpea and maize.'
        write: 'IV chews cabbage, cowpea and maize leaves ✓'
      - say: 'Now the cockroach. It spoils food in the kitchen, so it is a household pest, not a farm pest.'
        write: 'II: household pest ✗'
      - say: 'And the young mosquitoes live in water, so they never touch a crop.'
        write: 'III: in water, no crops ✗'
      - section: 'Answer'
        say: 'So the agricultural pests are one and four, which is option B.'
        write: '$\therefore$ I and IV'
        answer: true
    traps:
      A: 'You went for two and four. The caterpillar is a crop pest, but the cockroach is a pest of the house and kitchen, not the farm.'
      C: 'You chose two and three. The cockroach is a household pest, and the young mosquitoes live in water and never feed on crops.'
      D: 'You picked one and three. The grasshopper is a crop pest, but the mosquito larva and pupa live in water and do not touch crops at all.'
  7:
    moments:
      - section: 'The question'
        say: 'We must find the economic importance of the animal in drawing four.'
        write: 'Economic importance of IV?'
      - section: 'Look at the drawing'
        say: 'Look at drawing four. It has a soft ringed body with bristles, three pairs of true legs behind the head and fleshy prolegs further back.'
        write: 'IV: ringed body, bristles, true legs + prolegs'
      - section: 'The animal'
        say: 'That is a caterpillar, the larva of a butterfly or a moth.'
        write: 'Caterpillar = larva of a butterfly or moth'
      - section: 'What it does'
        say: 'It has strong chewing mouthparts and eats leaves all day, because it must store food before it becomes a pupa.'
        write: 'Chewing mouthparts, eats leaves all day'
      - section: 'The damage'
        say: 'Nigerian farmers lose cabbage, cowpea and maize to caterpillars. The armyworm can sweep through a whole maize farm.'
        write: 'Armyworm: can destroy a whole maize farm'
      - section: 'Answer'
        say: 'So the economic importance of drawing four is that it destroys farm crops, which is option B.'
        write: '$\therefore$ It is destructive to farm crops'
        answer: true
    traps:
      A: 'You went for water-borne disease. Caterpillars live on land plants and do not spread disease through water. That belongs to insects whose young live in water, like the mosquito.'
      C: 'You chose faeces in drinking water. Caterpillars live on leaves, away from our drinking water. It is the housefly that carries filth to our food and water.'
      D: 'You picked controlling mosquito larvae. Caterpillars eat leaves, not mosquito larvae. Fish such as tilapia do that job.'
  8:
    moments:
      - section: 'The question'
        say: 'We must name the disease carried by the adult form of the animal in drawing three.'
        write: 'The adult of III is a vector of $?$'
      - section: 'Look at the drawing'
        say: 'Look at drawing three. A comma shaped pupa hangs at the surface by its breathing trumpets, and a larva hangs head down by its breathing tube.'
        write: 'III: comma-shaped pupa + larva hanging by a breathing tube'
      - say: 'These are the young of a mosquito, so the adult is a mosquito. A larva hanging from a breathing tube is the kind that Culex has.'
        write: 'Young mosquitoes ⇒ adult is a mosquito (Culex)'
      - section: 'The disease'
        say: 'The female Culex mosquito carries tiny filarial worms. When she sucks blood, the worms pass into the person.'
        write: 'Female Culex carries filarial worms'
      - say: 'The worms block the lymph vessels, so a leg or another part swells hugely. This is elephantiasis.'
        write: 'Worms block lymph vessels → limb swells → elephantiasis'
      - section: 'Answer'
        say: 'So the adult of drawing three is a vector of elephantiasis, which is option D.'
        write: '$\therefore$ Elephantiasis'
        answer: true
    traps:
      A: 'You went for sleeping sickness. That is carried by the tsetse fly of the savanna, not by a mosquito.'
      B: 'You chose river blindness. Its insect also has young in water, but it is the blackfly, Simulium, whose larvae live in fast flowing rivers.'
      C: 'You picked cholera. Cholera is caught from water or food dirtied with faeces, and no insect needs to carry it.'
  9:
    moments:
      - section: 'The question'
        say: 'We must find the adaptive importance of the nuptial flight of termites, that is, how the flight helps the termites.'
        write: 'Nuptial flight of termites, why?'
      - section: 'The colony'
        say: 'A termite colony has workers, soldiers, and a king and queen. It also raises many winged reproductives, called alates.'
        write: 'Workers, soldiers, king, queen + winged reproductives'
      - section: 'The flight'
        say: 'At the start of the rains the winged ones fly out together. This is the nuptial flight.'
        write: 'Start of the rains: winged ones fly out together'
      - say: 'They spread far from the old mound. Then they land, pair up and drop their wings.'
        write: 'Spread out → land → pair up → drop wings'
      - say: 'Each pair digs into the soil and starts a new colony, as a new king and queen.'
        write: 'Each pair digs in → new colony'
      - section: 'Answer'
        say: 'So the nuptial flight disperses the reproductives to set up new colonies, which is option A.'
        write: '$\therefore$ Disperse reproductives to found new colonies'
        answer: true
    traps:
      B: 'You went for food for birds. Birds do feast on the swarm, but that is a loss to the termites, not the reason for their flight.'
      C: 'You chose cross breeding. A pair may come from the same colony or from different ones, so the flight does not ensure cross breeding. Its gain is spreading out to found new colonies.'
      D: 'You picked saving food. The reproductives leave to start new colonies, not to leave more food for the others.'
  10:
    moments:
      - section: 'The question'
        say: 'We are given a drawing of a set up with yeast and sugar solution, and we must name the gas it gives off.'
        write: 'The gas given off $= ?$'
      - section: 'Look at the drawing'
        say: 'Look at the drawing. The left tube holds sugar solution and yeast. A delivery tube carries any gas into lime water in the right tube.'
        write: 'Left: sugar solution + yeast.  Right: lime water'
      - section: 'The process'
        say: 'Yeast is a fungus. With little air, it respires the sugar without oxygen.'
        write: 'Yeast respires sugar without oxygen'
      - say: 'Respiring without oxygen is called anaerobic respiration. In yeast, the glucose breaks down into ethanol, which is alcohol, and carbon four oxide gas.'
        write: 'Glucose → ethanol + carbon(IV) oxide ($\ce{CO2}$)'
      - section: 'The test'
        say: 'The gas bubbles into the lime water and turns it milky. Only carbon four oxide turns lime water milky.'
        write: 'Lime water turns milky ⇒ $\ce{CO2}$'
      - section: 'Answer'
        say: 'So the gas given off is carbon four oxide, which is option A.'
        write: '$\therefore$ Carbon(IV) oxide, $\ce{CO2}$'
        answer: true
    traps:
      B: 'You went for nitrogen. Yeast does not give off nitrogen, and nitrogen does nothing to lime water.'
      C: 'You chose oxygen. Respiring yeast uses oxygen. It does not make it. And oxygen does not turn lime water milky.'
      D: 'You picked carbon two oxide. That comes from fuel burning with too little air, not from yeast.'
  11:
    moments:
      - section: 'The question'
        say: 'We are given the same yeast set up, and we must name the process it demonstrates.'
        write: 'The set-up demonstrates $?$'
      - section: 'Look at the drawing'
        say: 'Look again at the drawing. Yeast sits in sugar solution with no air let in, and its gas runs into lime water.'
        write: 'Yeast + sugar, no air, gas into lime water'
      - section: 'The process'
        say: 'When yeast breaks down sugar without oxygen, the process is called fermentation.'
        write: 'Yeast + sugar, no oxygen = fermentation'
      - say: 'Fermentation gives ethanol, carbon four oxide and a little energy.'
        write: 'Glucose → ethanol + carbon(IV) oxide ($\ce{CO2}$) + a little energy'
      - say: 'The lime water turning milky shows the carbon four oxide coming off.'
        write: 'Milky lime water shows the $\ce{CO2}$'
      - section: 'Answer'
        say: 'So the set up demonstrates fermentation, which is option C.'
        write: '$\therefore$ Fermentation'
        answer: true
    traps:
      A: 'You went for diffusion. Diffusion is the spread of particles from high to low concentration. This set up collects a gas that yeast makes.'
      B: 'You chose photosynthesis. That needs a green plant and light, and yeast is a fungus with no chlorophyll.'
      D: 'You picked plasmolysis. That is a plant cell shrinking away from its wall in a strong solution, and nothing here tests that.'
  12:
    moments:
      - section: 'The question'
        say: 'We must find which of the four can make living cells shrink.'
        write: 'Which solution shrinks living cells?'
      - section: 'The process'
        say: 'This is osmosis. Water moves across a cell membrane from a dilute solution into a more concentrated one.'
        write: 'Osmosis: water moves dilute → concentrated'
      - section: 'How it works'
        say: 'A hypertonic solution is more concentrated than the inside of the cell.'
        write: 'Hypertonic = more concentrated than the cell'
      - say: 'So the inside of the cell is the more dilute side. Water moves from there into the stronger solution outside, and the cell shrinks.'
        write: 'Water out → cell shrinks'
      - say: 'In a hypotonic solution, or in pure water, the flow is the other way. Water goes in and the cell swells.'
        write: 'Hypotonic or pure water: water in → cell swells'
      - section: 'Answer'
        say: 'So a hypertonic solution makes living cells shrink, which is option D.'
        write: '$\therefore$ Hypertonic solution'
        answer: true
    traps:
      A: 'You went for hypotonic. In a hypotonic solution water enters the cell, so it swells, not shrinks.'
      B: 'You chose isotonic. In an isotonic solution there is no net flow of water, so the cell keeps its size.'
      C: 'You picked deionized water. That is pure water, so water rushes into the cell and it swells.'
  13:
    moments:
      - section: 'The question'
        say: 'We must find the statement that is true of leucocytes.'
        write: 'True of leucocytes?'
      - section: 'The cells'
        say: 'Leucocytes are the white blood cells. Leuco means white.'
        write: 'Leucocytes = white blood cells'
      - say: 'They are the largest blood cells, and each one has a nucleus, often lobed. Mammal red cells have no nucleus.'
        write: 'Large, with a nucleus (often lobed)'
      - section: 'Their work'
        say: 'Their work is defence, and there are two main kinds. Phagocytes engulf germs, which means they swallow them up.'
        write: 'Phagocytes engulf germs'
      - say: 'Lymphocytes make antibodies, chemicals that attack germs.'
        write: 'Lymphocytes make antibodies'
      - section: 'How many'
        say: 'They are few. There are about seven thousand in each cubic millimetre of blood, against about five million red cells.'
        write: 'About 7 000 white vs 5 000 000 red per mm³'
      - section: 'Answer'
        say: 'So leucocytes are large and nucleated, which is option C.'
        write: '$\therefore$ Large and nucleated'
        answer: true
    traps:
      A: 'You went for respiratory pigments. The pigment is haemoglobin, and it sits inside the red cells.'
      B: 'You chose most numerous. The red cells are far more numerous, about five million to every seven thousand white cells.'
      D: 'You picked blood clotting. Clotting is started by the platelets, not the white cells.'
  14:
    moments:
      - section: 'The question'
        say: 'Food goes through three steps in the body. We must name the step that turns a nutrient into a molecule of the consumer''s own body.'
        write: 'Nutrient → molecule in the body, called $?$'
      - section: 'The three steps'
        say: 'First, digestion breaks big food molecules into small ones.'
        write: '1. Digestion: big molecules → small'
      - say: 'Second, absorption takes the small molecules into the blood.'
        write: '2. Absorption: into the blood'
      - say: 'Third, assimilation. The cells take in the absorbed nutrients and build them into the body''s own molecules.'
        write: '3. Assimilation: built into the body''s own molecules'
      - say: 'For example, amino acids are built into new proteins inside the cells.'
        write: 'Amino acids → new body proteins'
      - section: 'Answer'
        say: 'So the conversion of a nutrient into a molecule of the body is assimilation, which is option B.'
        write: '$\therefore$ Assimilation'
        answer: true
    traps:
      A: 'You went for digestion. Digestion only breaks food down into small molecules. It does not build them into body molecules.'
      C: 'You chose absorption. Absorption only takes the digested food into the blood.'
      D: 'You picked inhibition. Inhibition means slowing or stopping a process, such as an enzyme reaction.'
  15:
    moments:
      - section: 'The question'
        say: 'We must name the ability of a living thing to detect changes in its surroundings and respond to them.'
        write: 'Detect and respond to change, called $?$'
      - section: 'The word'
        say: 'Irritability, also called sensitivity, is one of the characteristics of all living things.'
        write: 'Irritability (sensitivity): a mark of all living things'
      - section: 'How it works'
        say: 'First the organism detects a change in its surroundings. That change is called a stimulus.'
        write: 'Stimulus = a change in the surroundings'
      - say: 'Then it responds to the stimulus. Detecting and responding together make irritability.'
        write: 'Irritability = detect a stimulus + respond'
      - section: 'A narrower word'
        say: 'Taxis is only one kind of response, the movement of a whole organism towards or away from a stimulus.'
        write: 'Taxis = one kind of response only'
      - section: 'Answer'
        say: 'So the ability to detect and respond to changes is irritability, which is option B.'
        write: '$\therefore$ Irritability'
        answer: true
    traps:
      A: 'You went for locomotion. That is moving from place to place, not the general ability to respond.'
      C: 'You chose growth. Growth is a lasting increase in size, not a response to a change.'
      D: 'You picked taxis. A taxis is one type of response by moving organisms, not the general ability of all living things.'
  16:
    moments:
      - section: 'The question'
        say: 'We must find where, in mammals, nutrients and the products of metabolism are exchanged between the blood and the body cells.'
        write: 'Exchange of nutrients and metabolic products occurs in the $?$'
      - section: 'Tissue fluid'
        say: 'Blood stays inside the vessels. But some plasma leaks out of the thin capillaries to bathe the cells. This is tissue fluid.'
        write: 'Plasma leaks from capillaries → tissue fluid'
      - section: 'The exchange'
        say: 'Food and oxygen pass from the tissue fluid into the cells.'
        write: 'Nutrients, oxygen → into the cells'
      - say: 'Wastes such as carbon four oxide and urea pass out of the cells into it.'
        write: 'Wastes ($\ce{CO2}$, urea) → out of the cells'
      - section: 'Lymph'
        say: 'This fluid drains into the lymph vessels as lymph, and goes back to the blood.'
        write: 'Tissue fluid → lymph vessels → back to the blood'
      - say: 'Tissue fluid and lymph are the same watery fluid, so many textbooks simply call the fluid round the cells lymph.'
        write: 'Tissue fluid and lymph: the same fluid'
      - section: 'Answer'
        say: 'So the exchange of nutrients and metabolic products takes place in the lymph, which is option D.'
        write: '$\therefore$ Lymph'
        answer: true
    traps:
      A: 'You went for the lungs. The lungs exchange only oxygen and carbon four oxide with the air, not nutrients.'
      B: 'You chose the oesophagus. It only carries food down to the stomach.'
      C: 'You picked the trachea. It only carries air to and from the lungs.'
  17:
    moments:
      - section: 'The question'
        say: 'We must pick the seed that is endospermous.'
        write: 'An endospermous seed?'
      - section: 'The word'
        say: 'An endospermous seed stores its food in an endosperm, a tissue outside the embryo.'
        write: 'Endospermous: food stored in the endosperm, outside the embryo'
      - section: 'Maize'
        say: 'In a maize grain, the endosperm is the large starchy part. The embryo, with its one cotyledon, lies at one side.'
        write: 'Maize: large starchy endosperm, embryo at one side'
      - section: 'The others'
        say: 'A non endospermous seed stores its food in thick cotyledons instead. The bean and the cashew are like that.'
        write: 'Non-endospermous: food in the cotyledons (bean, cashew)'
      - section: 'A rule'
        say: 'Cereal grains such as maize, rice and sorghum all store their food in the endosperm.'
        write: 'Cereals (maize, rice, sorghum): food in the endosperm'
      - section: 'Answer'
        say: 'So the endospermous seed here is the maize grain, which is option A.'
        write: '$\therefore$ Maize grain'
        answer: true
    traps:
      B: 'You went for cashew nut. Its food is in its two large cotyledons, not in an endosperm.'
      C: 'You chose cotton seed. It keeps most of its food in folded cotyledons, so it is not a typical endospermous seed.'
      D: 'You picked bean seed. A bean splits into two thick cotyledons, which are its food store. It has no endosperm.'
  18:
    moments:
      - section: 'The question'
        say: 'We are given four organisms, each matched with a mode of nutrition, and we must find the pair that is matched correctly.'
        write: 'Which pair is correctly matched?'
      - section: 'The words'
        say: 'Auto means self, so an autotroph makes its own food. Hetero means other, so a heterotroph feeds on food made by others.'
        write: 'Autotroph: makes its own food.  Heterotroph: feeds on others'
      - section: 'Test each pair'
        say: 'One, sundew. A parasite feeds on a living host and harms it. Sundew is a green plant that makes its own food and traps insects only for extra nitrogen, so it is not a parasite.'
        write: 'I. Sundew: insectivorous, not a parasite ✗'
      - say: 'Two, Amoeba. It engulfs food particles and cannot make its own food. So it is not autotrophic.'
        write: 'II. Amoeba: engulfs food, not autotrophic ✗'
      - say: 'Three, an alga. A saprophyte feeds on dead, decaying matter. An alga has chlorophyll and makes its own food, so it is autotrophic, not saprophytic.'
        write: 'III. Alga: photosynthesises, not saprophytic ✗'
      - say: 'Four, Agama. It eats insects, which is food made by others. So it is heterotrophic.'
        write: 'IV. Agama: eats insects, heterotrophic ✓'
      - section: 'Answer'
        say: 'So only pair four is correctly matched, which is option C.'
        write: '$\therefore$ IV. Heterotrophism → Agama'
        answer: true
    traps:
      A: 'You went for two. Amoeba cannot make its own food, so it is heterotrophic, not autotrophic.'
      B: 'You chose three. An alga makes its own food by photosynthesis, so it is autotrophic, not a saprophyte.'
      D: 'You picked one. Sundew is a green plant that traps insects. It is insectivorous, not a parasite.'
  19:
    moments:
      - section: 'The question'
        say: 'We are given three tubes of cane sugar, one with water, one with dilute acid and one with its enzyme. We must find the tubes in which glucose is found once the sugar is fully split.'
        write: 'I water, II dilute acid, III enzyme. Glucose in $?$'
      - section: 'The sugar'
        say: 'Cane sugar is sucrose, a disaccharide, which means a double sugar. Hydrolysis, splitting with water, breaks it into glucose and fructose.'
