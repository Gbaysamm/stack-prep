  47:
    moments:
      - section: 'The question'
        say: 'In a blood transfusion the red cells may clump together, which is called agglutination. We must find what reacts with what to cause it.'
        write: 'Agglutination in transfusion: reaction between $?$'
      - section: 'Antigens'
        say: 'Red cells carry antigens on their surface. They may carry A, B, both or neither.'
        write: 'Red cells: antigen A, B, both or neither'
      - section: 'Antibodies'
        say: 'The plasma carries antibodies, anti A or anti B, against the antigens that the person does not have.'
        write: 'Plasma: antibodies against the antigens a person lacks'
      - say: 'So a person''s own antigens and antibodies never clash. Group A blood has antigen A and anti B.'
        write: 'Group A: antigen A + anti-B, no clash'
      - section: 'A wrong transfusion'
        say: 'Now give group A blood to a group B person. A group B person lacks antigen A, so their plasma carries anti A. The donor''s antigen A meets this anti A, an antibody from a contrasting group.'
        write: 'Group A blood → group B person:  antigen A meets anti-A'
      - say: 'The red cells clump together. This is agglutination.'
        write: 'Red cells clump = agglutination'
      - section: 'Answer'
        say: 'So agglutination comes from the reaction between contrasting antigens and antibodies, which is option A.'
        write: '$\therefore$ Contrasting antigens and antibodies'
        answer: true
    traps:
      B: 'You went for two different antigens. Antigens do not react with each other. An antigen reacts with an antibody.'
      C: 'You chose two different antibodies. Antibodies do not react with each other.'
      D: 'You picked similar antigens and antibodies. Blood of a similar, matching group brings no antigen that the receiver''s antibodies attack, so no clumping happens.'
  48:
