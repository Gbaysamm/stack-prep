      - section: 'Name it'
        say: 'This is complementary base pairing. The bases on the two strands pair in a fixed way.'
        write: 'Complementary base pairing'
      - section: 'How it works'
        say: 'Adenine always pairs with thymine, joined by two hydrogen bonds.'
        write: 'A ═ T (2 hydrogen bonds)'
      - say: 'Guanine always pairs with cytosine, joined by three hydrogen bonds.'
        write: 'G ≡ C (3 hydrogen bonds)'
      - say: 'A large base, a purine, always pairs with a small base, a pyrimidine. So every rung has the same width all along the ladder.'
        write: 'Purine (A, G) + pyrimidine (T, C) → same width'
      - section: 'Reading the other strand'
        say: 'If one strand reads A T G C, the other strand must read T A C G.'
        write: 'ATGC  ↔  TACG'
      - section: 'Answer'
        say: 'So the correct base pairing is adenine with thymine and guanine with cytosine, which is option A.'
        write: '$\therefore$ A–T and G–C'
        answer: true
    traps:
      B: 'You went for adenine with guanine. They are both purines, the large bases, and two large bases would not fit across the ladder. Nor do thymine and cytosine pair.'
      C: 'You chose adenine with cytosine. Adenine pairs with thymine, not cytosine, and guanine pairs with cytosine, not thymine.'
      D: 'You picked a base with itself. A base never pairs with itself. Each pairs with its own partner on the other strand.'
