        write: 'Food and space run short → growth slows'
      - say: 'When births equal deaths, the population stops growing and stays steady. That level is the carrying capacity.'
        write: 'Births = deaths → steady → carrying capacity'
      - section: 'Answer'
        say: 'So the carrying capacity is reached when the population begins to remain steady, which is option D.'
        write: '$\therefore$ Remain steady'
        answer: true
