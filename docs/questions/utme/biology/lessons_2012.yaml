# UTME 2012 Biology, lessons for the board.
#
# Each lesson is a run of MOMENTS, taught the way a good biology teacher works on the board:
# name the structure or process, say what it does or how it works in simple steps, give a real
# Nigerian example, give a way to remember it, then the answer that names the option. Genetic
# crosses and graph readings go step by step on the board. Where a question has a figure, the
# lesson says in words what to look at in it.
#
#   say:     what the teacher says, heard and not read. Latin names said plainly, genetic
#            symbols as letters, ratios in words, no symbols the voice would stop on.
#   write:   the one line written while it is said, with mhchem for formulae and equations.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2012.yaml. Answers match that file.
format_version: 1
exam_year: 2012
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'Four lines point at four parts of an animal cell. One part holds the instructions that pass from parent to child. Which line points at it?'
        write: 'Organelle for heredity = ?  (I, II, III or IV)'
      - section: 'Look at the diagram'
        say: 'Look at the big round body in the middle of the cell. It has a double envelope with pores, dotted chromatin inside and a dark nucleolus. Line two points at it.'
        write: 'II → large round body: double envelope, chromatin, nucleolus'
      - section: 'Name it'
        say: 'That big round body is the nucleus.'
        write: 'II = nucleus'
      - section: 'How it works'
        say: 'The dotted chromatin is the chromosomes, and the chromosomes carry the genes, which are made of DNA.'
        write: 'Chromatin = chromosomes → genes (DNA)'
      - say: 'When a cell divides, copies of the chromosomes pass into the new cells. So the nucleus carries characters from parent to offspring.'
        write: 'Cell division → copies of chromosomes → offspring'
      - section: 'An example'
        say: 'A girl in Ibadan has her mother''s dimples. She got the genes for them from the nuclei of the egg and the sperm that made her.'
        write: 'Dimples: genes from the egg nucleus and the sperm nucleus'
      - section: 'Remember'
        say: 'Remember, the nucleus is the head office of the cell, where the instructions are kept.'
        write: 'Nucleus = head office of the cell'
      - section: 'Answer'
        say: 'So the organelle responsible for heredity is the nucleus, labelled two, which is option B.'
        write: '$\therefore$ II, the nucleus'
        answer: true
    traps:
      A: 'You went for one. Line one points to the cell membrane, which controls what goes in and out of the cell. It holds no genes.'
      C: 'You chose three, the mitochondrion. It does hold a little DNA, but its work is respiration, releasing energy. It does not carry the characters of the organism.'
      D: 'You picked four, the endoplasmic reticulum. It carries materials through the cytoplasm, but it does not hold the chromosomes.'
  3:
    moments:
      - section: 'The question'
        say: 'Same cell. Now line four points at a group of folded sacs at the lower left. What is that part called?'
        write: 'Part IV = ?'
      - section: 'Look at the diagram'
        say: 'Look at the lower left of the cell. Line four ends on several flat, folded membrane sacs spread out in the cytoplasm, not on one small closed body.'
        write: 'IV → folded, flattened membrane sacs in the cytoplasm'
      - section: 'Name it'
        say: 'A net of folded sacs and tubes running through the cytoplasm is the endoplasmic reticulum, or E R for short.'
        write: 'IV = endoplasmic reticulum (ER)'
      - section: 'How it works'
        say: 'The E R works like a system of channels. It carries materials from one part of the cell to another.'
        write: 'ER: channels that carry materials round the cell'
      - say: 'Rough E R is studded with ribosomes, which make proteins. Smooth E R has no ribosomes and makes fats.'
        write: 'Rough ER (ribosomes) → proteins;  smooth ER → fats'
      - section: 'An example'
        say: 'Think of the E R as the network of roads in Lagos, linking the factories, which are the ribosomes, to the rest of the city.'
        write: 'ER = road network;  ribosomes = factories'
      - section: 'Remember'
        say: 'Reticulum means a little net. The E R is a net of sacs and tubes.'
        write: 'reticulum = little net'
      - section: 'Answer'
        say: 'So the part labelled four is the endoplasmic reticulum, which is option C.'
        write: '$\therefore$ IV, the endoplasmic reticulum'
        answer: true
    traps:
      A: 'You went for the mitochondrion. It also has folded membranes, but they sit inside one small oval body with a double membrane. That is line three, not the spread of sacs at four.'
      B: 'You chose the cell wall. An animal cell has no cell wall. Its outer layer is the thin cell membrane, at line one.'
      D: 'You picked the nucleus. The nucleus is the single big round body at line two, holding the chromosomes.'
  4:
    moments:
      - section: 'The question'
        say: 'Four animals, from a worm in a cow''s liver to a cockroach in the kitchen. Which one is the most advanced? Size will not tell you.'
        write: 'Most advanced in the evolutionary trend = ?'
      - section: 'The trend'
        say: 'Animal groups can be arranged from simple to complex. Flatworms, then annelids, then molluscs, then arthropods.'
        write: 'flatworms → annelids → molluscs → arthropods'
      - section: 'Place each one'
        say: 'The liver fluke is a flatworm. It has no body cavity and no blood system, so it is the simplest.'
        write: 'Liver fluke = flatworm (simplest)'
      - say: 'The earthworm is an annelid, with a segmented body and a closed blood system. The snail is a mollusc, with a soft body in a shell.'
        write: 'Earthworm = annelid;  snail = mollusc'
      - say: 'The cockroach is an arthropod. It has a hard jointed exoskeleton, jointed legs, a body in three parts, compound eyes and wings.'
        write: 'Cockroach = arthropod: exoskeleton, jointed legs, wings'
      - section: 'An example'
        say: 'In a Nigerian kitchen the cockroach runs, flies and hides in cracks, while the snail can only creep. Its jointed body lets it do much more.'
        write: 'Cockroach runs and flies;  snail creeps'
      - section: 'Remember'
        say: 'Remember the order as flat, ring, shell, joint. Flatworm, ringed worm, shelled mollusc, jointed arthropod.'
        write: 'Flat → Ring → Shell → Joint'
      - section: 'Answer'
        say: 'So the most advanced of the four is the cockroach, which is option D.'
        write: '$\therefore$ Cockroach (arthropod)'
        answer: true
    traps:
      A: 'You went for the liver fluke. It is a flatworm with no body cavity, the simplest of the four, so it is the least advanced.'
      B: 'You chose the earthworm. It is segmented, but it has no jointed limbs and no exoskeleton, so it sits below the arthropods.'
      C: 'You picked the snail. It is bigger, but size does not decide how advanced an animal is. The snail is a soft-bodied mollusc with no jointed legs, below the arthropods.'
  5:
    moments:
      - section: 'The question'
        say: 'Living things are sorted into groups inside groups. Which group is the smallest, at the very bottom?'
        write: 'Lowest category of classification = ?'
      - section: 'The ranks'
        say: 'The ranks from the top are kingdom, phylum, class, order, family, genus and species.'
        write: 'Kingdom → Phylum → Class → Order → Family → Genus → Species'
      - section: 'How it works'
        say: 'Each rank is a smaller group inside the one above it. The species is the smallest.'
        write: 'Each rank sits inside the one above'
      - say: 'A species is a group of organisms so alike that they can breed together and produce fertile young.'
        write: 'Species: interbreed → fertile young'
      - section: 'An example'
        say: 'All goats belong to one species. Goats and sheep are in the same family, but they are different species.'
        write: 'goats = one species;  goat and sheep = same family, different species'
      - section: 'Remember'
        say: 'Remember the order with King Philip Came Over For Good Soup. Species is the soup, the last word.'
        write: 'King Philip Came Over For Good Soup'
      - section: 'The trap'
        say: 'Genus is just above species. In a name like Homo sapiens, Homo is the genus and sapiens is the species, so species is lower.'
        write: 'Homo (genus) sapiens (species)'
      - section: 'Answer'
        say: 'So the lowest category of classification is the species, which is option B.'
        write: '$\therefore$ Species'
        answer: true
    traps:
      A: 'You went for class. Class is high up, above order, family, genus and species.'
      C: 'You chose family. Family is above genus and species, so it is not the lowest.'
      D: 'You picked genus. It is close, just above species, and one genus can hold several species.'
  6:
    moments:
      - section: 'The question'
        say: 'Some plants grow thick trunks year after year, and others stay thin. Which group shows this secondary growth?'
        write: 'Secondary growth is found in = ?'
      - section: 'Name it'
        say: 'Secondary growth is growth in thickness, or girth, of the stem and root.'
        write: 'Secondary growth = growth in thickness (girth)'
      - section: 'How it works'
        say: 'It is made by the vascular cambium, a ring of dividing cells between the xylem and the phloem, with a cork cambium near the outside.'
        write: 'Vascular cambium (between xylem and phloem) + cork cambium'
      - say: 'Each year the cambium adds new xylem, which is wood, and new phloem, so the stem gets thicker.'
        write: 'Cambium → new xylem (wood) + new phloem each year'
      - section: 'An example'
        say: 'Dicotyledons have a cambium in their vascular bundles. That is why the mango tree and the iroko grow thick trunks.'
        write: 'Dicots: mango, iroko → thick trunks'
      - section: 'The trap'
        say: 'The oil palm is a monocotyledon. It grows tall, but it has no cambium, so its trunk hardly thickens by secondary growth.'
        write: 'Oil palm (monocot): no cambium, tall but not thicker'
      - section: 'Remember'
        say: 'Remember, dicots get dense. Their trunks thicken year after year.'
        write: 'Dicots get Dense'
      - section: 'Answer'
        say: 'So plants that show secondary growth are usually the dicotyledons, which is option D.'
        write: '$\therefore$ Dicotyledons'
        answer: true
    traps:
      A: 'You went for the thallophytes. Plants like Spirogyra have no vascular tissue at all, so they have no cambium.'
      B: 'You chose the pteridophytes. Ferns have vascular tissue, but no cambium, so they show no secondary growth.'
      C: 'You picked the monocotyledons. Maize and the oil palm have scattered vascular bundles with no cambium, so they do not thicken this way.'
  7:
    moments:
      - section: 'The question'
        say: 'Mushrooms were once grouped with plants. What sets the fungi apart from plants as their own group?'
        write: 'Fungi are distinct mainly because they have = ?'
      - section: 'Name it'
        say: 'Fungi have no chlorophyll.'
        write: 'Fungi: no chlorophyll'
      - section: 'How it works'
        say: 'With no chlorophyll, a fungus cannot make its own food by photosynthesis.'
        write: 'No chlorophyll → no photosynthesis'
      - say: 'So it feeds as a saprophyte or a parasite. It digests food outside its body, then absorbs it.'
        write: 'Saprophyte or parasite: digests outside, absorbs'
      - section: 'An example'
        say: 'The mushroom on a rotting log and the black Rhizopus mould on old bread both feed on dead matter, because they cannot photosynthesise.'
        write: 'Mushroom on a log, Rhizopus on bread → feed on dead matter'
      - section: 'Remember'
        say: 'Remember, no green means no food making, so fungi must feed on others.'
        write: 'No green → no food making → feed on others'
      - section: 'The trap'
        say: 'Fungi do make spores, but so do ferns and mosses. So spores do not set fungi apart.'
        write: 'Spores: ferns and mosses too'
      - section: 'Answer'
        say: 'So fungi are a distinct group mainly because they have no chlorophyll, which is option B.'
        write: '$\therefore$ No chlorophyll'
        answer: true
    traps:
      A: 'You went for spores. Ferns, mosses and some bacteria make spores too, so spores do not mark out the fungi.'
      C: 'You chose fruiting bodies. Not every fungus forms them. Yeast has none at all, so they cannot be what sets all fungi apart.'
      D: 'You picked asexual and sexual reproduction. Very many plants and animals reproduce both ways, so this is not special to fungi.'
  8:
    moments:
      - section: 'The question'
        say: 'Some insects do their damage while they are young, and some only when they are grown. Which one is destructive at an early stage?'
        write: 'Destructive at an early stage of its life cycle = ?'
      - section: 'Name it'
        say: 'Many insects go through complete metamorphosis. Egg, larva, pupa, then adult.'
        write: 'egg → larva → pupa → adult'
      - section: 'How it works'
        say: 'In the butterfly, the larva is the caterpillar. It feeds greedily on leaves to grow, so it is the destructive stage.'
        write: 'Butterfly larva = caterpillar → eats leaves'
      - say: 'The adult butterfly only sips nectar from flowers. It does no damage.'
        write: 'Adult butterfly → sips nectar'
      - section: 'An example'
        say: 'Caterpillars can strip the leaves of orange trees and cowpea plants on a Nigerian farm.'
        write: 'Caterpillars strip citrus and cowpea leaves'
      - section: 'Remember'
        say: 'Remember, the caterpillar chews and the butterfly sips.'
        write: 'Caterpillar chews, butterfly sips'
      - section: 'The trap'
        say: 'The mosquito is harmful, but as an adult. The female sucks blood and spreads malaria. Its larvae in the water do no damage.'
        write: 'Mosquito: harmful as the adult female'
      - section: 'Answer'
        say: 'So the arthropod that is destructive at an early stage is the butterfly, which is option A.'
        write: '$\therefore$ Butterfly (the caterpillar stage)'
        answer: true
    traps:
      B: 'You went for the mosquito. Its larvae only feed on tiny particles in the water. It is the adult female Anopheles that bites and spreads malaria.'
      C: 'You chose the bee. Bee larvae are fed by workers inside the hive. They destroy nothing.'
      D: 'You picked the millipede. It has no caterpillar stage. Its young look like small adults and feed the same way, mainly on rotting plant matter.'
  9:
    moments:
      - section: 'The question'
        say: 'Cut a goat down the middle and you get two matching halves, but only one way. Which body can be cut through its axis in any plane and still give two identical halves?'
        write: 'Any plane through the axis → two identical halves'
      - section: 'Name it'
        say: 'This is radial symmetry.'
        write: 'Radial symmetry'
      - section: 'How it works'
        say: 'In a radially symmetrical animal, the body parts are arranged round a central axis, like the spokes of a wheel.'
        write: 'Parts arranged round a central axis, like spokes'
      - say: 'So any cut through that axis, in any direction, gives two matching halves.'
        write: 'Any cut through the axis → matching halves'
      - section: 'An example'
        say: 'Hydra and the starfish are radially symmetrical. They meet food coming from every side.'
        write: 'Hydra, starfish'
      - section: 'Compare'
        say: 'A goat or a person is bilaterally symmetrical. Only one cut, down the middle from head to tail, gives matching halves.'
        write: 'Goat, human: bilateral, one plane only'
      - section: 'Remember'
        say: 'Remember, radial is like the radius of a circle. Any direction works.'
        write: 'radial ↔ radius, any direction'
      - section: 'Answer'
        say: 'So a body that gives two identical parts in any plane is radially symmetrical, which is option A.'
        write: '$\therefore$ Radially symmetrical'
        answer: true
    traps:
      B: 'You went for bilaterally symmetrical. That allows only one plane of cut that gives two identical halves, not any plane.'
      C: 'You chose asymmetrical. An asymmetrical body, like Amoeba, has no plane at all that gives identical halves.'
      D: 'You picked symmetrical. That is too general. It does not say that every plane through the axis works.'
  10:
    moments:
      - section: 'The question'
        say: 'Four animals that live in water. Only one of them feeds its young on milk. Which one?'
        write: 'Has mammary glands = ?'
      - section: 'Name it'
        say: 'Mammary glands are the milk glands of mammals.'
        write: 'Mammary glands = milk glands of mammals'
      - section: 'How it works'
        say: 'Mammals feed their young on milk. They also have hair, breathe with lungs and give birth to live young.'
        write: 'Mammals: milk, hair, lungs, live young'
      - say: 'The whale lives in the sea, but it is a mammal. It comes up to breathe air and suckles its calf.'
        write: 'Whale: breathes air, suckles its calf → mammal'
      - section: 'An example'
        say: 'It is the same as a goat feeding its kid, or a cow feeding its calf, on a Nigerian farm.'
        write: 'Goat and kid, cow and calf'
      - section: 'Remember'
        say: 'Remember, the word mammal comes from mamma, the breast.'
        write: 'mammal ← mamma (breast)'
      - section: 'The trap'
        say: 'The dogfish and the shark are big sea animals too. But they are cartilaginous fishes with gills, and they have no milk glands.'
        write: 'Dogfish, shark, catfish = fishes, gills, no milk'
      - section: 'Answer'
        say: 'So the animal with mammary glands is the whale, which is option B.'
        write: '$\therefore$ Whale'
        answer: true
    traps:
      A: 'You went for the dogfish. It is a cartilaginous fish that breathes with gills and has no milk glands.'
      C: 'You chose the shark. It is a cartilaginous fish, and it does not feed its young on milk.'
      D: 'You picked the catfish. It is a bony fish with no mammary glands.'
  11:
    moments:
      - section: 'The question'
        say: 'Birds came from reptile ancestors. What do birds still have that shows the link?'
        write: 'Feature linking birds to reptiles = ?'
      - section: 'Name it'
        say: 'The link is scales.'
        write: 'Scales'
      - section: 'How it works'
        say: 'Birds still have horny scales on their legs and feet, like the scales of a lizard or a snake.'
        write: 'Bird legs and feet: horny scales, like a reptile'
      - say: 'Birds also lay shelled eggs, as reptiles do. Both signs point back to a reptile ancestor.'
        write: 'Shelled eggs too → reptile ancestor'
      - section: 'An example'
        say: 'Look at the legs of a chicken in the market. They are covered in scales, just like the skin of an agama lizard.'
        write: 'Chicken legs ≈ agama skin'
      - section: 'Remember'
        say: 'Remember, the bird keeps its reptile socks on. Scaly legs.'
        write: 'Reptile socks = scaly legs'
      - section: 'The trap'
        say: 'Feathers are what make a bird different from a reptile. So feathers cannot be the link.'
        write: 'Feathers: birds only → not a link'
      - section: 'Answer'
        say: 'So the feature that links birds to reptiles is the possession of scales, which is option D.'
        write: '$\therefore$ Scales'
        answer: true
    traps:
      A: 'You went for feathers. Feathers are found only in birds, so they separate birds from reptiles. They do not link them.'
      B: 'You chose beaks. The beak is a mark of birds, and most reptiles have jaws with teeth, so the beak is not the link.'
      C: 'You picked skeletons. Every vertebrate has a skeleton, so it does not link birds to reptiles in particular.'
  12:
    moments:
      - section: 'The question'
        say: 'Many fish are dark on the back and pale on the belly. Why would that colouring help them?'
        write: 'Countershading enables animals to = ?'
      - section: 'Name it'
        say: 'Countershading is a kind of camouflage.'
        write: 'Countershading = camouflage'
      - section: 'How it works'
        say: 'The animal is dark on its back and pale on its belly.'
        write: 'Dark back, pale belly'
      - say: 'Sunlight from above lights up the back and shades the belly. The two shades cancel out, so the body looks flat and is hard to see.'
        write: 'Light from above + dark back, pale belly → looks flat, hard to see'
      - section: 'An example'
        say: 'Many fish in the Lagos lagoon are dark above and silvery below. A bird looking down sees dark water, and a fish looking up sees bright sky.'
        write: 'Lagoon fish: dark from above, bright from below'
      - section: 'Remember'
        say: 'Remember, dark top, light bottom, hidden from both.'
        write: 'Dark top, light bottom → hidden'
      - section: 'The trap'
        say: 'Warning colours are the opposite. They are bright colours that say, I am poisonous, so they are meant to be seen.'
        write: 'Warning colours: meant to be seen'
      - section: 'Answer'
        say: 'So countershading enables animals to remain undetected, which is option B.'
        write: '$\therefore$ Remain undetected'
        answer: true
    traps:
      A: 'You went for fighting enemies. Colouring does not help an animal fight. Countershading helps it avoid being found.'
      C: 'You chose warning enemies. Warning colouration uses bright colours to be noticed, but countershading hides the animal.'
      D: 'You picked attracting mates. Bright display colours attract mates, while countershading makes the animal hard to see.'
  13:
    moments:
      - section: 'The question'
        say: 'Most of a plant wears a waxy raincoat. Which part goes without one, and why?'
        write: 'Lacks a waterproof cuticle = ?'
      - section: 'Name it'
        say: 'The cuticle is a waxy, waterproof layer on the epidermis.'
        write: 'Cuticle = waxy layer on the epidermis'
      - section: 'How it works'
        say: 'It cuts down water loss from the parts of the plant in the air. That is the leaves, the stem and the whole shoot.'
        write: 'Leaves, stem, shoot → cuticle cuts water loss'
      - say: 'The root grows in damp soil and must take water in. Its epidermis has thin walls and root hairs, and no cuticle, so water passes in freely.'
        write: 'Root: thin walls + root hairs, no cuticle → water in'
      - section: 'An example'
        say: 'Pull up a young cassava cutting after the rains. The fine root hairs are soft and wet, with no wax on them.'
        write: 'Cassava root hairs: soft, wet, no wax'
      - section: 'Remember'
        say: 'Remember, above ground the cuticle keeps water in. Below ground the root must let water in.'
        write: 'Above: keep water in.  Below: let water in'
      - section: 'The trap'
        say: 'A young stem is green and soft, but it is up in the air, and it does have a cuticle.'
        write: 'Young stem: soft, but has a cuticle'
      - section: 'Answer'
        say: 'So the plant structure that lacks a waterproof cuticle is the root, which is option C.'
        write: '$\therefore$ Root'
        answer: true
    traps:
      A: 'You went for the leaf. The leaf has a thick cuticle to cut down water loss by evaporation.'
      B: 'You chose the stem. Even a young green stem is covered by a cuticle on its epidermis.'
      D: 'You picked the shoot. The shoot is the leaves and stem together, and both have a cuticle.'
  14:
    moments:
      - section: 'The question'
        say: 'In a man, one tube carries both urine and semen out of the body. Which tube is it? Two names here sound almost the same.'
        write: 'Passage for both urine and semen = ?'
      - section: 'Name it'
        say: 'It is the urethra, the tube that runs from the bladder through the penis to the outside.'
        write: 'Urethra: bladder → penis → outside'
      - section: 'How it works'
        say: 'Urine from the bladder and semen from the testes and glands both leave the body through the urethra, at different times.'
        write: 'Urine and semen both exit by the urethra, at different times'
      - say: 'A ring of muscle closes the neck of the bladder during ejaculation, so urine and semen do not mix.'
        write: 'Bladder neck closes in ejaculation → no mixing'
      - section: 'The look-alike'
        say: 'The ureters are different tubes. They carry urine from the kidneys down to the bladder, and they carry no semen.'
        write: 'Ureter: kidney → bladder, urine only'
      - section: 'Remember'
        say: 'Remember, the urethra is the exit and the ureter is the entry into the bladder.'
        write: 'urethra = exit;  ureter = entry'
      - section: 'An example'
        say: 'A bull or a he goat is built the same way, with one urethra for both jobs.'
        write: 'Bull, he-goat: one urethra, two jobs'
      - section: 'Answer'
        say: 'So the passage for both urine and semen is the urethra, which is option A.'
        write: '$\therefore$ Urethra'
        answer: true
    traps:
      B: 'You went for the ureter. It sounds alike, but the ureter only carries urine from a kidney to the bladder.'
      C: 'You chose the bladder. The bladder stores urine, and semen does not pass through it.'
      D: 'You picked the seminal vesicle. It adds fluid to the semen, but urine never passes through it.'
  15:
    moments:
      - section: 'The question'
        say: 'Plants need some minerals by the bagful and others only by the pinch. Which one here is needed in minute quantities?'
        write: 'Needed in minute quantities = ?'
      - section: 'Name it'
        say: 'Mineral elements come in two sizes of need. Macronutrients are needed in large amounts, and micronutrients, or trace elements, in minute amounts.'
        write: 'Macronutrients (large) vs micronutrients (trace)'
      - section: 'The two lists'
        say: 'Macronutrients include nitrogen, phosphorus, potassium, calcium, magnesium and sulphur.'
        write: 'Macro: N, P, K, Ca, Mg, S'
      - say: 'Micronutrients include copper, zinc, manganese, boron, molybdenum and iron.'
        write: 'Micro: Cu, Zn, Mn, B, Mo, Fe'
      - section: 'How it works'
        say: 'Copper is needed only in tiny amounts, as part of some enzymes.'
        write: 'Copper: tiny amounts, for some enzymes'
      - section: 'An example'
        say: 'Farmers in Nigeria buy N P K fertiliser because nitrogen, phosphorus and potassium are needed in large amounts.'
        write: 'NPK fertiliser = the big three'
      - section: 'Remember'
        say: 'Remember, N P K is the big bag, and copper is a pinch.'
        write: 'NPK = big bag;  copper = a pinch'
      - section: 'Answer'
        say: 'So the element required in minute quantities is copper, which is option A.'
        write: '$\therefore$ Copper'
        answer: true
    traps:
      B: 'You went for potassium. It is the K in N P K, a macronutrient needed in large amounts.'
      C: 'You chose phosphorus. It is very important for roots, but it is the P in N P K, needed in large amounts.'
      D: 'You picked sodium. Sodium is not one of the elements green plants need for growth, and most plants grow well without it.'
  16:
    moments:
      - section: 'The question'
        say: 'A parasite usually steals its food, and an autotroph makes its own. Which organism does both at once?'
        write: 'Both parasitic and autotrophic = ?'
      - section: 'Name it'
        say: 'Loranthus, the mistletoe, is a partial parasite.'
        write: 'Loranthus (mistletoe) = partial parasite'
      - section: 'How it works'
        say: 'It grows on the branches of a tree and sends suckers, called haustoria, into the host''s xylem to take water and mineral salts.'
        write: 'Haustoria → host xylem → water and salts'
      - say: 'But its leaves are green, so it makes its own food by photosynthesis. It is parasitic and autotrophic at the same time.'
        write: 'Green leaves → photosynthesis → autotrophic'
      - section: 'An example'
        say: 'Loranthus is often seen as a bushy green clump on the branches of orange, kola and shea trees.'
        write: 'Clumps on orange, kola, shea trees'
      - section: 'Remember'
        say: 'Remember, Loranthus borrows water but cooks its own food.'
        write: 'Borrows water, cooks its own food'
      - section: 'The trap'
        say: 'The sundew is green and catches insects. But it lives on its own in the soil and traps insects only for extra nitrogen, so it is not a parasite.'
        write: 'Sundew: insectivorous, not parasitic'
      - section: 'Answer'
        say: 'So the organism that is both parasitic and autotrophic is Loranthus, which is option B.'
        write: '$\therefore$ Loranthus'
        answer: true
    traps:
      A: 'You went for the sundew. It is not a parasite. It is a green insectivorous plant that traps insects for nitrogen.'
      C: 'You chose Rhizopus. It is a saprophytic fungus with no chlorophyll, so it cannot be autotrophic.'
      D: 'You picked the tapeworm. It is a parasite, but it cannot make its own food, so it is heterotrophic.'
  17:
    moments:
      - section: 'The question'
        say: 'Your stomach pours out hydrochloric acid onto your food. What is one job of that acid?'
        write: 'A function of HCl in the stomach = ?'
      - section: 'Name it'
        say: 'The stomach wall secretes hydrochloric acid as part of the gastric juice.'
        write: 'Gastric juice contains $\ce{HCl}$'
      - section: 'How it works'
        say: 'The acid makes the stomach strongly acidic. Ptyalin, the salivary amylase, works only in a near neutral medium.'
        write: 'Ptyalin works only near neutral'
      - say: 'So when the acid reaches the food, ptyalin stops working. The acid also gives pepsin the acid it needs, and kills many germs in the food.'
        write: 'Acid → stops ptyalin, helps pepsin, kills germs'
      - section: 'An example'
        say: 'Swallow a mouthful of eba. Ptyalin keeps breaking down its starch until the stomach acid reaches it and stops it.'
        write: 'Eba: ptyalin works until the acid stops it'
      - section: 'Remember'
        say: 'Remember, saliva is the starter and stomach acid is the stopper.'
        write: 'Saliva = starter;  acid = stopper'
      - section: 'The trap'
        say: 'Milk protein is clotted by the enzyme rennin, and fats are emulsified by bile in the duodenum. The acid does neither.'
        write: 'Rennin clots milk;  bile emulsifies fat'
      - section: 'Answer'
        say: 'So a function of the hydrochloric acid is to stop the action of ptyalin, which is option C.'
        write: '$\therefore$ Stops the action of ptyalin'
        answer: true
    traps:
      A: 'You went for neutralising bile. Bile never reaches the stomach. It is released into the duodenum, further along the gut.'
      B: 'You chose B. Rennin is what clots milk protein, and bile is what emulsifies fats. The acid does neither job.'
      D: 'You picked breaking food into smaller particles. That is done by chewing and by the churning of the stomach muscles, not by the acid.'
  18:
    moments:
      - section: 'The question'
        say: 'Four sugars. Three are small, and one is a giant chain. Which is the polysaccharide?'
        write: 'Polysaccharide = ?'
      - section: 'Name it'
        say: 'A polysaccharide is a large carbohydrate made of many sugar units joined together.'
        write: 'Polysaccharide = many sugar units joined'
      - section: 'Count the units'
        say: 'A monosaccharide is a single unit, such as glucose.'
        write: 'Mono (1): glucose'
      - say: 'A disaccharide is two units joined, such as sucrose and maltose.'
        write: 'Di (2): sucrose, maltose'
      - say: 'A polysaccharide is a long chain, such as starch, glycogen and cellulose.'
        write: 'Poly (many): starch, glycogen, cellulose'
      - section: 'An example'
        say: 'Cellulose is a chain of thousands of glucose units. It makes plant cell walls, the fibre in ugu leaves and okro.'
        write: 'Cellulose: cell walls, fibre in ugu and okro'
      - section: 'Remember'
        say: 'Remember, mono is one, di is two, and poly is many.'
        write: 'mono = 1, di = 2, poly = many'
      - section: 'Answer'
        say: 'So the polysaccharide is cellulose, which is option D.'
        write: '$\therefore$ Cellulose'
        answer: true
    traps:
      A: 'You went for glucose. Glucose is a single sugar unit, a monosaccharide.'
      B: 'You chose sucrose. Sucrose is glucose joined to fructose, two units, so it is a disaccharide.'
      C: 'You picked maltose. It comes from starch digestion, but it is only two glucose units, a disaccharide.'
  19:
    moments:
      - section: 'The question'
        say: 'A young plant with four arrows showing where materials move. Which arrow is transport in the xylem?'
        write: 'Xylem transport = arrow ?'
      - section: 'Look at the diagram'
        say: 'Look at the stem. It has two channels. The left channel, line one, has arrows pointing down towards the roots. The right channel, line four, runs up from the roots with an arrow pointing up.'
        write: 'I: left channel, arrows down.  IV: right channel, arrow up'
      - say: 'Arrows two and three are outside the stem. Two comes out of a leaf into the air, and three goes from the air into the other leaf.'
        write: 'II: leaf → air.  III: air → leaf'
      - section: 'Name it'
        say: 'The xylem carries water and mineral salts up from the roots to the leaves.'
        write: 'Xylem: water + mineral salts, roots → leaves (up)'
      - section: 'How it works'
        say: 'Roots absorb water and salts from the soil. The xylem vessels carry them up the stem, pulled mainly by transpiration from the leaves.'
        write: 'Soil → roots → xylem → leaves (pulled by transpiration)'
      - say: 'The phloem does the other job. It carries food made in the leaves down to the roots and other parts. That is the downward channel, line one.'
        write: 'Phloem: food from leaves → down (I)'
      - section: 'An example'
        say: 'In a cassava plant, water rises from the roots to the leaves in the xylem, while starch made in the leaves moves down in the phloem to be stored in the tubers.'
        write: 'Cassava: water up (xylem), food down to tubers (phloem)'
      - section: 'Remember'
        say: 'Remember, the xylem goes up like a borehole pump, and the phloem carries food down and around.'
        write: 'Xylem = up, like a borehole pump'
      - section: 'Answer'
        say: 'So transport in the xylem is the upward arrow from the roots, labelled four, which is option D.'
        write: '$\therefore$ IV'
        answer: true
    traps:
      A: 'You went for one. It is a channel in the stem too, but its arrows point down, from the leaves to the roots. That is food moving in the phloem.'
      B: 'You chose two. Arrow two leaves the leaf for the air. That is a gas given out through the stomata, not transport in the xylem.'
      C: 'You picked three. Arrow three goes from the air into the leaf. That is a gas, such as carbon four oxide, entering through the stomata.'
  20:
    moments:
      - section: 'The question'
        say: 'Same plant. Arrow two comes out of a leaf into the air. What is leaving the leaf?'
        write: 'Arrow II represents = ?'
      - section: 'Look at the diagram'
        say: 'Look at arrow two. It starts at the underside of the left leaf and points out into the air. So something is leaving the leaf as a gas.'
        write: 'II: out of the leaf into the air → a gas leaves'
      - section: 'Name it'
        say: 'In daylight the leaf is doing photosynthesis, and the gas it gives out is oxygen.'
        write: 'Photosynthesis gives out oxygen'
      - section: 'How it works'
        say: 'Carbon four oxide and water, with light and chlorophyll, make glucose and oxygen.'
        write: '$\ce{6CO2 + 6H2O ->[light][chlorophyll] C6H12O6 + 6O2}$'
      - say: 'The leaf makes more oxygen than it uses, so the extra oxygen diffuses out through the stomata.'
        write: 'Extra $\ce{O2}$ diffuses out through the stomata'
      - section: 'An example'
        say: 'Water plants in a sunny pond give off tiny bubbles from their leaves. Those bubbles are oxygen.'
        write: 'Pond weed in sunlight → bubbles of oxygen'
      - section: 'Remember'
        say: 'Remember, in daylight carbon four oxide goes in at arrow three, and oxygen comes out at arrow two.'
        write: 'Daylight: $\ce{CO2}$ in (III),  $\ce{O2}$ out (II)'
      - section: 'Answer'
        say: 'So arrow two represents the release of oxygen, which is option A.'
        write: '$\therefore$ Release of oxygen'
        answer: true
    traps:
      B: 'You went for the intake of carbon four oxide. It is a gas too, but in daylight it moves into the leaf. That is arrow three. Arrow two comes out.'
      C: 'You chose photosynthates. Sugars move inside the plant in the phloem, like arrow one. They never leave the leaf into the air.'
      D: 'You picked nutrients. Mineral salts move up in the xylem, like arrow four, not out of the leaf into the air.'
  21:
    moments:
      - section: 'The question'
        say: 'The kidney filters your blood under pressure. Where in the kidney does this ultrafiltration happen?'
        write: 'Site of ultrafiltration = ?'
      - section: 'Name it'
        say: 'Ultrafiltration happens in the Bowman''s capsule, with the glomerulus it holds.'
        write: 'Bowman''s capsule + glomerulus'
      - section: 'How it works'
        say: 'The glomerulus is a knot of blood capillaries. The vessel leaving it is narrower than the one coming in, so the blood pressure inside is high.'
        write: 'Outgoing vessel narrower → high pressure in the glomerulus'
      - say: 'That pressure forces water, glucose, salts and urea out through the thin walls into the cup of the Bowman''s capsule.'
        write: 'Water, glucose, salts, urea → into the capsule'
      - say: 'Blood cells and proteins are too big to pass, so they stay in the blood.'
        write: 'Blood cells, proteins → stay behind'
      - section: 'An example'
        say: 'It is like pressing palm fruit through a sieve. The oil passes through and the fibre stays behind.'
        write: 'Like a sieve: liquid passes, fibre stays'
      - section: 'Remember'
        say: 'Remember, B for Bowman and B for blood is filtered.'
        write: 'B for Bowman, B for blood filtered'
      - section: 'Answer'
        say: 'So the site of ultrafiltration is the Bowman''s capsule, which is option B.'
        write: '$\therefore$ Bowman''s capsule'
        answer: true
    traps:
      A: 'You went for the uriniferous tubule. That is the whole nephron, and filtration happens only in one part of it, the capsule.'
      C: 'You chose the loop of Henle. It is in the nephron too, but its job is to take back water and salts, not to filter blood.'
      D: 'You picked the renal tubule. It takes back useful substances from the filtrate after filtration has already happened.'
  22:
    moments:
      - section: 'The question'
        say: 'A mango tree gets new wood inside and new bark outside every year. Which tissues together make that happen?'
        write: 'Together bring about secondary thickening = ?'
      - section: 'Name it'
        say: 'Secondary thickening is made by two meristems, which are tissues that keep dividing. They are the vascular cambium and the cork cambium.'
        write: 'Two meristems: vascular cambium + cork cambium'
      - section: 'How it works'
        say: 'The vascular cambium divides to add new xylem on the inside and new phloem on the outside, so the stem grows thicker.'
        write: 'Vascular cambium → xylem inside, phloem outside'
      - say: 'As the stem widens, the old skin would split. So the cork cambium, near the outside, makes cork, a new protective bark.'
        write: 'Cork cambium (phellogen) → cork = new bark'
      - section: 'An example'
        say: 'The thick, rough bark of a mango tree is cork from the cork cambium. The wood inside is xylem from the vascular cambium.'
        write: 'Mango: bark = cork;  wood = xylem'
      - section: 'Remember'
        say: 'Remember, two cambia. Wood inside and bark outside.'
        write: 'Two cambia: wood in, bark out'
      - section: 'The trap'
        say: 'The vascular cambium does most of the thickening. But on its own it makes no new bark, so it needs the cork cambium beside it.'
        write: 'Vascular cambium alone → no new bark'
      - section: 'Answer'
        say: 'So secondary thickening is brought about by the vascular cambium and the cork cambium together, which is option C.'
        write: '$\therefore$ Vascular cambium and cork cambium'
        answer: true
    traps:
      A: 'You went for collenchyma and xylem. These are permanent tissues, not cambia. The new xylem, phloem and cork all come from the two cambia.'
      B: 'You chose the vascular cambium only. It gives new xylem and phloem, but no new cork. Both cambia are needed.'
      D: 'You picked cork cambium and sclerenchyma. Sclerenchyma is a dead supporting tissue that cannot divide, so only one of this pair is a meristem.'
  23:
    moments:
      - section: 'The question'
        say: 'Cut open four fruits and count the chambers. Which one came from a single carpel?'
        write: 'Fruit from a single carpel = ?'
      - section: 'Name it'
        say: 'A fruit from a single carpel is called a monocarpellary fruit. The legume pod is the classic one.'
        write: 'Single carpel = monocarpellary, e.g. a legume pod'
      - section: 'How it works'
        say: 'A carpel is like a leaf folded over with its edges joined. So a fruit from one carpel has one chamber.'
        write: 'One carpel → one chamber'
      - say: 'The seeds sit in one row along one edge, the line where the carpel''s edges joined.'
        write: 'Seeds in one row along the joined edge'
      - section: 'An example'
        say: 'Open a bean pod or a groundnut shell. You see one chamber with one row of seeds.'
        write: 'Bean, groundnut: one chamber, one row'
      - section: 'Compare'
        say: 'Cut a tomato or an okro across and you see several chambers. Each chamber is a carpel, so they came from several carpels fused together.'
        write: 'Tomato, okro: several chambers → several carpels'
      - section: 'Remember'
        say: 'Remember, one pod, one carpel.'
        write: 'One pod, one carpel'
      - section: 'Answer'
        say: 'So the fruit that develops from a single carpel is the bean, which is option C.'
        write: '$\therefore$ Bean'
        answer: true
    traps:
      A: 'You went for okro. Cut it across and you see several chambers in a ring, from several fused carpels.'
      B: 'You chose tomato. It has many seeds, but cut across it shows two or more chambers, so it came from two or more carpels.'
      D: 'You picked orange. Each segment of an orange comes from one carpel, so the whole fruit comes from many carpels.'
  26:
    moments:
      - section: 'The question'
        say: 'A farmer wants his plants to grow taller, with longer stems. Which hormone would he spray?'
        write: 'Stimulates lengthening of the stem = ?'
      - section: 'Name it'
        say: 'Gibberellins are plant hormones that make stems grow longer.'
        write: 'Gibberellin → longer stems'
      - section: 'How it works'
        say: 'They make cells in the stem divide and lengthen, so the internodes, the parts between the leaves, grow longer.'
        write: 'Cells divide and lengthen → longer internodes'
      - say: 'Farmers spray gibberellin to make plants taller, to break the dormancy of seeds, or to make fruits bigger.'
        write: 'Uses: taller plants, break seed dormancy, bigger fruits'
      - section: 'An example'
        say: 'Gibberellin was first found in a fungus that made rice plants grow very tall and thin, the foolish seedling disease.'
        write: 'Discovered: fungus made rice seedlings grow too tall'
      - section: 'Remember'
        say: 'Remember, gibberellin makes giants.'
        write: 'Gibberellin makes Giants'
      - section: 'The trap'
        say: 'Kinins, also called cytokinins, do promote growth, but by cell division, as in tissue culture and leaf growth. They are not the stem lengthening hormone.'
        write: 'Kinin = cell division, not stem lengthening'
      - section: 'Answer'
        say: 'So stem lengthening is stimulated by adding gibberellin, which is option A.'
        write: '$\therefore$ Gibberellin'
        answer: true
    traps:
      B: 'You went for kinin. Kinins promote cell division, mainly in buds and in tissue culture. They are not the hormone that lengthens stems.'
      C: 'You chose abscisic acid. It slows growth and brings on dormancy and leaf fall, the opposite of what we want.'
      D: 'You picked ethylene. Ethylene ripens fruit and actually slows the lengthening of stems.'
  27:
    moments:
      - section: 'The question'
        say: 'Some actions you choose, and some happen all by themselves. Which of these is controlled by the autonomic nervous system?'
        write: 'Autonomic nervous system controls = ?'
      - section: 'Name it'
        say: 'The autonomic nervous system controls the involuntary actions of the body.'
        write: 'Autonomic = involuntary actions'
      - section: 'How it works'
        say: 'It works without our thinking. Its sympathetic part speeds organs up, and its parasympathetic part slows them down.'
        write: 'Sympathetic speeds up;  parasympathetic slows down'
      - say: 'It controls the heart beat, the breathing rate, digestion, sweating and the size of the pupil.'
        write: 'Heart beat, breathing, digestion, sweating, pupil'
      - section: 'An example'
        say: 'When a dog chases you at night, your heart beats faster without your choosing. That is the autonomic system at work.'
        write: 'Chased by a dog → heart races on its own'
      - section: 'Remember'
        say: 'Remember, autonomic sounds like automatic.'
        write: 'autonomic ≈ automatic'
      - section: 'The trap'
        say: 'Your tongue, your hands and your arm muscles move when you decide to move them. Those are voluntary, run by the somatic nervous system.'
        write: 'Tongue, hands, voluntary muscles → somatic (voluntary)'
      - section: 'Answer'
        say: 'So the autonomic nervous system controls the heart beat, which is option B.'
        write: '$\therefore$ Heart beat'
        answer: true
    traps:
      A: 'You went for voluntary muscles. The name gives it away. Voluntary muscles are controlled by the somatic, or voluntary, nervous system.'
      C: 'You chose the tongue. You decide when to move your tongue to speak or chew, so its movements are voluntary.'
      D: 'You picked the hands. Moving the hands is voluntary, because we decide to do it.'
  28:
    moments:
      - section: 'The question'
        say: 'Irish potato and cabbage love a cool climate, yet Nigeria is a hot country. Where in the tropics can these temperate plants grow?'
        write: 'Temperate plants in the tropics grow in = ?'
      - section: 'Name it'
        say: 'Temperate plants need a cool climate, and in the tropics the cool places are the high ones, the montane zones.'
        write: 'Temperate plants need cool → montane zones'
      - section: 'How it works'
        say: 'Temperature falls as you go higher above sea level, by about six degrees Celsius for every thousand metres.'
        write: 'About 6 °C cooler per 1000 m of height'
      - say: 'So highlands in the tropics have a cool climate, like a temperate one. Crops such as Irish potato, cabbage, carrot, strawberry and tea grow well there.'
        write: 'Highlands: Irish potato, cabbage, carrot, tea'
      - section: 'An example'
        say: 'The Jos, Mambilla and Obudu Plateaus carry montane forest and grassland. Jos grows Irish potatoes, and Mambilla grows tea.'
        write: 'Jos (Irish potato), Mambilla (tea), Obudu'
      - section: 'Remember'
        say: 'Remember, go up the mountain to find the cold.'
        write: 'Up the mountain → cold'
      - section: 'The trap'
        say: 'Jos sits inside the Guinea savanna on the map. But it is cool because of its height, which is montane. Lowland Guinea savanna is hot.'
        write: 'Jos is cool from height, not from savanna'
      - section: 'Answer'
        say: 'So temperate plants can be grown in the montane forest zones, which is option D.'
        write: '$\therefore$ Montane forest'
        answer: true
    traps:
      A: 'You went for the rain forest. It is hot and humid all year, too warm for temperate crops.'
      B: 'You chose the Guinea savanna. Lowland Guinea savanna is hot. Only its high plateaux, which are montane, are cool enough.'
      C: 'You picked the Sudan savanna. It is hot and dry, with a long dry season, so it suits no temperate crop.'
  29:
    moments:
      - section: 'The question'
        say: 'Water goes up into the sky and comes back down as rain, again and again. What keeps this cycle going?'
        write: 'The water cycle is maintained mainly by = ?'
      - section: 'Name it'
        say: 'The water cycle is the continuous movement of water between the earth and the air.'
        write: 'Water cycle: earth ⇄ air, without end'
      - section: 'How it works'
        say: 'First, heat from the sun evaporates water from seas, rivers, soil and leaves. That is the way up.'
        write: 'Way up: evaporation (and transpiration from leaves)'
      - say: 'Then the water vapour rises, cools and condenses into clouds, and falls as rain. That is the way down.'
        write: 'Way down: condensation → clouds → rain'
      - say: 'Rain runs back into rivers and the sea, and the cycle starts again.'
        write: 'Rain → rivers → sea → evaporation again'
      - section: 'An example'
        say: 'In the rainy season, water evaporated from the Atlantic Ocean condenses into the clouds that bring rain to southern Nigeria.'
        write: 'Atlantic → clouds → rain in the south'
      - section: 'Remember'
        say: 'Remember, up by evaporation, down by condensation and rain. A cycle needs both ways.'
        write: 'A cycle needs a way up AND a way down'
      - section: 'Answer'
        say: 'So the water cycle is maintained mainly by evaporation and condensation, which is option B.'
        write: '$\therefore$ Evaporation and condensation'
        answer: true
    traps:
      A: 'You went for evaporation alone. It only takes water up. Without condensation it never comes back down as rain.'
      C: 'You chose condensation alone. It cannot happen until evaporation has first put water vapour into the air.'
      D: 'You picked transpiration and respiration. Transpiration adds some vapour and respiration very little. Most of the water moves by evaporation from the seas and by condensation.'
  30:
    moments:
      - section: 'The question'
        say: 'Where a river meets the sea, the water is never quite the same from one day to the next. What must animals living there put up with?'
        write: 'Estuarine organisms are adapted to = ?'
      - section: 'Name it'
        say: 'An estuary is where a river meets the sea.'
        write: 'Estuary = river meets sea'
      - section: 'How it works'
        say: 'Fresh water from the river mixes with salt water from the sea, so the water is brackish.'
        write: 'Fresh + salt → brackish'
      - say: 'With every tide, and between the rainy and the dry season, the salt level rises and falls. So estuarine organisms must tolerate wide changes in salinity.'
        write: 'Tides and seasons → salinity rises and falls'
      - section: 'An example'
        say: 'The Lagos lagoon is brackish. Its salinity falls in the rainy season, when rivers pour in fresh water, and rises in the dry season.'
        write: 'Lagos lagoon: less salty in the rains, saltier in the dry season'
      - section: 'Remember'
        say: 'Remember, estuary means mixed water, so the saltiness keeps changing.'
        write: 'Estuary = mixed water → changing salinity'
      - section: 'The trap'
        say: 'Water warms and cools slowly. So the temperature of an estuary changes far less than its salinity.'
        write: 'Temperature: small change.  Salinity: big change'
      - section: 'Answer'
        say: 'So estuarine organisms are adapted to withstand wide fluctuations in salinity, which is option C.'
        write: '$\therefore$ Wide fluctuations in salinity'
        answer: true
    traps:
      A: 'You went for temperature. A large body of water stays at a fairly steady temperature. It is the salinity that swings widely.'
      B: 'You chose low salinity only. Estuarine water is not always low in salt. At high tide it can be almost as salty as the sea.'
      D: 'You picked a diet of plankton and dead matter only. Estuarine animals have many diets, and many of them eat other animals.'
  31:
    moments:
      - section: 'The question'
        say: 'Props, snorkels and salt pumps on a plant. Where would a plant need all of these at once?'
        write: 'Stilt roots, pneumatophores, sunken stomata, salt glands → habitat = ?'
      - section: 'Name it'
        say: 'These are the adaptations of mangrove plants in salt water swamps.'
        write: 'Mangrove swamp plants'
      - section: 'How it works'
        say: 'Stilt roots, or prop roots, hold the plant up in soft mud.'
        write: 'Stilt roots → support in soft mud'
      - say: 'Pneumatophores are breathing roots. They grow up out of the airless mud to take in oxygen.'
        write: 'Pneumatophores → breathing roots, oxygen from the air'
      - say: 'Sunken stomata and salt glands help the plant save water and get rid of extra salt.'
        write: 'Sunken stomata + salt glands → save water, remove salt'
      - section: 'An example'
        say: 'The red mangrove swamps of the Niger Delta and the Lagos coast have roots that stand up out of the mud like pencils.'
        write: 'Niger Delta mangroves: roots like pencils'
      - section: 'Remember'
        say: 'Remember, mud needs props, no air needs snorkels, and salt needs glands.'
        write: 'Mud → props;  no air → snorkels;  salt → glands'
      - section: 'Answer'
        say: 'So these are adaptive features of plants found in mangrove swamps, which is option B.'
        write: '$\therefore$ Mangrove swamps'
        answer: true
    traps:
      A: 'You went for the tropical rainforest. It is wet, but its soil is fresh and well drained. Its trees have buttress roots, not pneumatophores or salt glands.'
      C: 'You chose grassland. Grassland plants are adapted to drought and fire, not to salty, airless mud.'
      D: 'You picked montane forest. That is cool highland forest, with no salt and no tidal mud.'
  32:
    moments:
      - section: 'The question'
        say: 'Some animals almost never drink. They live on the water in their food and the water their bodies make. Where do such animals live?'
        write: 'Live solely on water from food and metabolism = ?'
      - section: 'Name it'
        say: 'These are desert dwellers, adapted to live with little or no drinking water.'
        write: 'Desert dwellers'
      - section: 'How it works'
        say: 'They get water from their food, and from metabolic water, the water made when food is broken down in respiration.'
        write: 'Water from food + metabolic water'
      - say: 'Glucose and oxygen give carbon four oxide and water. That water stays in the body.'
        write: '$\ce{C6H12O6 + 6O2 -> 6CO2 + 6H2O}$'
      - say: 'They also save water by making very concentrated urine and dry faeces, and by hiding in burrows in the heat of the day.'
        write: 'Concentrated urine, dry faeces, burrows by day'
      - section: 'An example'
        say: 'The kangaroo rat of desert lands may never drink in its whole life. The camel in the far north of Nigeria can go many days without water.'
        write: 'Kangaroo rat, camel'
      - section: 'Remember'
        say: 'Remember, respiration makes water, and desert animals rely on it.'
        write: 'Respiration makes water'
      - section: 'Answer'
        say: 'So the animals that can live solely on water from food and metabolism are desert dwellers, which is option B.'
        write: '$\therefore$ Desert dwellers'
        answer: true
