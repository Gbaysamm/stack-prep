# UTME 2012 Biology, lessons for the board.
#
# Each lesson is a run of MOMENTS, taught the way a good biology teacher works on the board:
# name the structure or process, say what it does or how it works in simple steps, give a real
# Nigerian example, give a way to remember it, then the answer that names the option. Genetic
# crosses and graph readings go step by step on the board. Where a question has a figure, the
# lesson says in words what to look at in it.
#
#   say:     what the teacher says, heard and not read. Latin names said plainly, genetic
#            symbols as letters, ratios in words, no symbols the voice would stop on.
#   write:   the one line written while it is said, with mhchem for formulae and equations.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2012.yaml. Answers match that file.
format_version: 1
exam_year: 2012
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'We are given a diagram of an animal cell with four labelled lines. We must find the line that points at the organelle responsible for heredity, the part that passes characters from parent to offspring.'
        write: 'Organelle for heredity = ?  (I, II, III or IV)'
      - section: 'Look at the diagram'
        say: 'Look at the big round body in the middle of the cell. It has a double envelope with pores, dotted chromatin inside and a dark nucleolus. Line two points at it.'
        write: 'II → large round body: double envelope, chromatin, nucleolus'
      - section: 'Name it'
        say: 'That big round body is the nucleus.'
        write: 'II = nucleus'
      - section: 'How it works'
        say: 'The dotted chromatin is the chromosomes, and the chromosomes carry the genes, which are made of DNA.'
        write: 'Chromatin = chromosomes → genes (DNA)'
      - say: 'When a cell divides, copies of the chromosomes pass into the new cells. So the nucleus carries characters from parent to offspring.'
        write: 'Cell division → copies of chromosomes → offspring'
      - section: 'Answer'
        say: 'So the organelle responsible for heredity is the nucleus, labelled two, which is option B.'
        write: '$\therefore$ II, the nucleus'
        answer: true
    traps:
      A: 'You went for one. Line one points to the cell membrane, which controls what goes in and out of the cell. It holds no genes.'
      C: 'You chose three, the mitochondrion. It does hold a little DNA, but its work is respiration, releasing energy. It does not carry the characters of the organism.'
      D: 'You picked four, the endoplasmic reticulum. It carries materials through the cytoplasm, but it does not hold the chromosomes.'
  3:
    moments:
      - section: 'The question'
        say: 'We are given the same animal cell. We must name the part labelled four.'
        write: 'Part IV = ?'
      - section: 'Look at the diagram'
        say: 'Look at the lower left of the cell. Line four ends on several flat, folded membrane sacs spread out in the cytoplasm, not on one small closed body.'
        write: 'IV → folded, flattened membrane sacs in the cytoplasm'
      - section: 'Name it'
        say: 'A net of folded sacs and tubes running through the cytoplasm is the endoplasmic reticulum, or E R for short.'
        write: 'IV = endoplasmic reticulum (ER)'
      - section: 'How it works'
        say: 'The E R is a system of channels. It carries materials from one part of the cell to another.'
        write: 'ER: channels that carry materials round the cell'
      - say: 'Rough E R is studded with ribosomes, which make proteins. Smooth E R has no ribosomes and makes fats.'
        write: 'Rough ER (ribosomes) → proteins;  smooth ER → fats'
      - section: 'Answer'
        say: 'So the part labelled four is the endoplasmic reticulum, which is option C.'
        write: '$\therefore$ IV, the endoplasmic reticulum'
        answer: true
    traps:
      A: 'You went for the mitochondrion. It also has folded membranes, but they sit inside one small oval body with a double membrane. That is line three, not the spread of sacs at four.'
      B: 'You chose the cell wall. An animal cell has no cell wall. Its outer layer is the thin cell membrane, at line one.'
      D: 'You picked the nucleus. The nucleus is the single big round body at line two, holding the chromosomes.'
  4:
    moments:
      - section: 'The question'
        say: 'We must find which of these four animals is the most advanced in the evolutionary trend of animals.'
        write: 'Most advanced in the evolutionary trend = ?'
      - section: 'The trend'
        say: 'Animal groups can be arranged from simple to complex. The order is flatworms, then annelids, then molluscs and then arthropods.'
        write: 'Flatworms → annelids → molluscs → arthropods'
      - say: 'An animal is more advanced when its body has more organ systems and more specialised parts. Size is not on that list.'
        write: 'More advanced = more organ systems, more specialised parts'
      - section: 'Place each one'
        say: 'The liver fluke is a flatworm. It has no body cavity and no blood system, so it is the simplest.'
        write: 'Liver fluke = flatworm (simplest)'
      - say: 'The earthworm is an annelid, with a segmented body and a closed blood system. So it is a step up from the fluke.'
        write: 'Earthworm = annelid (segments, blood system)'
      - say: 'The snail is a mollusc, with a soft body in a shell and a muscular foot. It comes next.'
        write: 'Snail = mollusc (soft body in a shell)'
      - say: 'The cockroach is an arthropod. It has a hard jointed exoskeleton, jointed legs, a body in three parts, compound eyes and wings.'
        write: 'Cockroach = arthropod: exoskeleton, jointed legs, wings'
      - section: 'Answer'
        say: 'So the most advanced of the four is the cockroach, which is option D.'
        write: '$\therefore$ Cockroach (arthropod)'
        answer: true
    traps:
      A: 'You went for the liver fluke. It is a flatworm with no body cavity, the simplest of the four, so it is the least advanced.'
      B: 'You chose the earthworm. It is segmented, but it has no jointed limbs and no exoskeleton, so it sits below the arthropods.'
      C: 'You picked the snail. It is bigger, but size does not decide how advanced an animal is. The snail is a soft-bodied mollusc with no jointed legs, below the arthropods.'
  5:
    moments:
      - section: 'The question'
        say: 'We must find the lowest category of classification, the smallest group used in sorting living things.'
        write: 'Lowest category of classification = ?'
      - section: 'The ranks'
        say: 'The ranks from the top are kingdom, phylum, class, order, family, genus and species.'
        write: 'Kingdom → Phylum → Class → Order → Family → Genus → Species'
      - section: 'How it works'
        say: 'Each rank is a smaller group inside the one above it. The species is the smallest.'
        write: 'Each rank sits inside the one above'
      - say: 'A species is a group of organisms so alike that they can breed together and produce fertile young.'
        write: 'Species: interbreed → fertile young'
      - section: 'The trap'
        say: 'Genus is just above species. In a name like Homo sapiens, Homo is the genus and sapiens is the species, so species is lower.'
        write: 'Homo (genus) sapiens (species)'
      - section: 'Answer'
        say: 'So the lowest category of classification is the species, which is option B.'
        write: '$\therefore$ Species'
        answer: true
    traps:
      A: 'You went for class. Class is high up, above order, family, genus and species.'
      C: 'You chose family. Family is above genus and species, so it is not the lowest.'
      D: 'You picked genus. It is close, just above species, and one genus can hold several species.'
  6:
    moments:
      - section: 'The question'
        say: 'We must find the group of plants in which secondary growth is usually found.'
        write: 'Secondary growth is found in = ?'
      - section: 'Name it'
        say: 'Secondary growth is growth in thickness, or girth, of the stem and root.'
        write: 'Secondary growth = growth in thickness (girth)'
      - section: 'How it works'
        say: 'It is made by the vascular cambium, a ring of dividing cells between the xylem and the phloem, with a cork cambium near the outside.'
        write: 'Vascular cambium (between xylem and phloem) + cork cambium'
      - say: 'Each year the cambium adds new xylem, which is wood, and new phloem, so the stem gets thicker.'
        write: 'Cambium → new xylem (wood) + new phloem each year'
      - section: 'Dicots'
        say: 'Dicotyledons have a cambium in their vascular bundles. That is why the mango tree and the iroko grow thick trunks.'
        write: 'Dicots: mango, iroko → thick trunks'
      - section: 'The trap'
        say: 'The oil palm is a monocotyledon. It grows tall, but it has no cambium, so its trunk hardly thickens by secondary growth.'
        write: 'Oil palm (monocot): no cambium, tall but not thicker'
      - section: 'Answer'
        say: 'So plants that show secondary growth are usually the dicotyledons, which is option D.'
        write: '$\therefore$ Dicotyledons'
        answer: true
    traps:
      A: 'You went for the thallophytes. Plants like Spirogyra have no vascular tissue at all, so they have no cambium.'
      B: 'You chose the pteridophytes. Ferns have vascular tissue, but no cambium, so they show no secondary growth.'
      C: 'You picked the monocotyledons. Maize and the oil palm have scattered vascular bundles with no cambium, so they do not thicken this way.'
  7:
    moments:
      - section: 'The question'
        say: 'We must find the main feature that makes the fungi a separate group of eukaryotes.'
        write: 'Fungi are distinct mainly because they have = ?'
      - section: 'Name it'
        say: 'Fungi have no chlorophyll.'
        write: 'Fungi: no chlorophyll'
      - section: 'How it works'
        say: 'With no chlorophyll, a fungus cannot make its own food by photosynthesis.'
        write: 'No chlorophyll → no photosynthesis'
      - say: 'So it feeds as a saprophyte or a parasite. It digests food outside its body, then absorbs it.'
        write: 'Saprophyte or parasite: digests outside, absorbs'
      - section: 'The trap'
        say: 'Fungi do make spores, but so do ferns and mosses. So spores do not set fungi apart.'
        write: 'Spores: ferns and mosses too'
      - section: 'Answer'
        say: 'So fungi are a distinct group mainly because they have no chlorophyll, which is option B.'
        write: '$\therefore$ No chlorophyll'
        answer: true
    traps:
      A: 'You went for spores. Ferns, mosses and some bacteria make spores too, so spores do not mark out the fungi.'
      C: 'You chose fruiting bodies. Not every fungus forms them. Yeast has none at all, so they cannot be what sets all fungi apart.'
      D: 'You picked asexual and sexual reproduction. Very many plants and animals reproduce both ways, so this is not special to fungi.'
  8:
    moments:
      - section: 'The question'
        say: 'We must find the arthropod that does its damage at an early stage of its life cycle, while it is young.'
        write: 'Destructive at an early stage of its life cycle = ?'
      - section: 'Name it'
        say: 'Many insects go through complete metamorphosis. The stages are egg, larva, pupa and then adult.'
        write: 'Egg → larva → pupa → adult'
      - section: 'How it works'
        say: 'In the butterfly, the larva is the caterpillar. It feeds greedily on leaves to grow, so it is the destructive stage.'
        write: 'Butterfly larva = caterpillar → eats leaves'
      - say: 'The adult butterfly only sips nectar from flowers. It does no damage.'
        write: 'Adult butterfly → sips nectar'
      - section: 'The trap'
        say: 'The mosquito is harmful, but as an adult. The female sucks blood and spreads malaria. Its larvae in the water do no damage.'
        write: 'Mosquito: harmful as the adult female'
      - section: 'Answer'
        say: 'So the arthropod that is destructive at an early stage is the butterfly, which is option A.'
        write: '$\therefore$ Butterfly (the caterpillar stage)'
        answer: true
    traps:
      B: 'You went for the mosquito. Its larvae only feed on tiny particles in the water. It is the adult female Anopheles that bites and spreads malaria.'
      C: 'You chose the bee. Bee larvae are fed by workers inside the hive. They destroy nothing.'
      D: 'You picked the millipede. It has no caterpillar stage. Its young look like small adults and feed the same way, mainly on rotting plant matter.'
  9:
    moments:
      - section: 'The question'
        say: 'We must name the kind of body that can be cut through its axis in any plane and still give two identical halves.'
        write: 'Any plane through the axis → two identical halves'
      - section: 'Name it'
        say: 'This is radial symmetry.'
        write: 'Radial symmetry'
      - section: 'How it works'
        say: 'In a radially symmetrical animal, the body parts are arranged round a central axis, like the spokes of a wheel.'
        write: 'Parts arranged round a central axis, like spokes'
      - say: 'So any cut through that axis, in any direction, gives two matching halves.'
        write: 'Any cut through the axis → matching halves'
      - section: 'Examples'
        say: 'Hydra and the starfish are radially symmetrical. They meet food coming from every side.'
        write: 'Hydra, starfish'
      - section: 'Compare'
        say: 'A goat or a person is bilaterally symmetrical. Only one cut, down the middle from head to tail, gives matching halves.'
        write: 'Goat, human: bilateral, one plane only'
      - section: 'Answer'
        say: 'So a body that gives two identical parts in any plane is radially symmetrical, which is option A.'
        write: '$\therefore$ Radially symmetrical'
        answer: true
    traps:
      B: 'You went for bilaterally symmetrical. That allows only one plane of cut that gives two identical halves, not any plane.'
      C: 'You chose asymmetrical. An asymmetrical body, like Amoeba, has no plane at all that gives identical halves.'
      D: 'You picked symmetrical. That is too general. It does not say that every plane through the axis works.'
  10:
    moments:
      - section: 'The question'
        say: 'We must find which of these four water animals has mammary glands.'
        write: 'Has mammary glands = ?'
      - section: 'Name it'
        say: 'Mammary glands are the milk glands of mammals.'
        write: 'Mammary glands = milk glands of mammals'
      - section: 'How it works'
        say: 'Mammals feed their young on milk. They also have hair, breathe with lungs and give birth to live young.'
        write: 'Mammals: milk, hair, lungs, live young'
      - say: 'The whale lives in the sea, but it is a mammal. It comes up to breathe air and suckles its calf.'
        write: 'Whale: breathes air, suckles its calf → mammal'
      - section: 'The trap'
        say: 'The dogfish and the shark are big sea animals too. But they are cartilaginous fishes with gills, and they have no milk glands.'
        write: 'Dogfish, shark, catfish = fishes, gills, no milk'
      - section: 'Answer'
        say: 'So the animal with mammary glands is the whale, which is option B.'
        write: '$\therefore$ Whale'
        answer: true
    traps:
      A: 'You went for the dogfish. It is a cartilaginous fish that breathes with gills and has no milk glands.'
      C: 'You chose the shark. It is a cartilaginous fish, and it does not feed its young on milk.'
      D: 'You picked the catfish. It is a bony fish with no mammary glands.'
  11:
    moments:
      - section: 'The question'
        say: 'We must find the feature that birds share with reptiles and that links the two groups in evolution.'
        write: 'Feature linking birds to reptiles = ?'
      - section: 'Name it'
        say: 'The link is scales.'
        write: 'Scales'
      - section: 'How it works'
        say: 'Birds still have horny scales on their legs and feet, like the scales of a lizard or a snake.'
        write: 'Bird legs and feet: horny scales, like a reptile'
      - say: 'Birds also lay shelled eggs, as reptiles do. Both signs point back to a reptile ancestor.'
        write: 'Shelled eggs too → reptile ancestor'
      - section: 'The trap'
        say: 'Feathers are what make a bird different from a reptile. So feathers cannot be the link.'
        write: 'Feathers: birds only → not a link'
      - section: 'Answer'
        say: 'So the feature that links birds to reptiles is the possession of scales, which is option D.'
        write: '$\therefore$ Scales'
        answer: true
    traps:
      A: 'You went for feathers. Feathers are found only in birds, so they separate birds from reptiles. They do not link them.'
      B: 'You chose beaks. The beak is a mark of birds, and most reptiles have jaws with teeth, so the beak is not the link.'
      C: 'You picked skeletons. Every vertebrate has a skeleton, so it does not link birds to reptiles in particular.'
  12:
    moments:
      - section: 'The question'
        say: 'We must find what countershading enables animals to do.'
        write: 'Countershading enables animals to = ?'
      - section: 'Name it'
        say: 'Countershading is a kind of camouflage.'
        write: 'Countershading = camouflage'
      - section: 'How it works'
        say: 'The animal is dark on its back and pale on its belly.'
        write: 'Dark back, pale belly'
      - say: 'Sunlight from above makes the back look brighter and leaves the belly in shadow. Because the back is dark and the belly is pale, the two parts end up looking about the same shade.'
        write: 'Light from above: dark back lit, pale belly shaded → same shade'
      - say: 'So the body shows no shadow to give its shape away. It looks flat and is hard to see.'
        write: 'No shadow → looks flat, hard to see'
      - section: 'The trap'
        say: 'Warning colours are the opposite. They are bright colours that say, I am poisonous, so they are meant to be seen.'
        write: 'Warning colours: meant to be seen'
      - section: 'Answer'
        say: 'So countershading enables animals to remain undetected, which is option B.'
        write: '$\therefore$ Remain undetected'
        answer: true
    traps:
      A: 'You went for fighting enemies. Colouring does not help an animal fight. Countershading helps it avoid being found.'
      C: 'You chose warning enemies. Warning colouration uses bright colours to be noticed, but countershading hides the animal.'
      D: 'You picked attracting mates. Bright display colours attract mates, while countershading makes the animal hard to see.'
  13:
    moments:
      - section: 'The question'
        say: 'We must find the plant structure that has no waterproof cuticle.'
        write: 'Lacks a waterproof cuticle = ?'
      - section: 'Name it'
        say: 'The cuticle is a waxy, waterproof layer on the epidermis.'
        write: 'Cuticle = waxy layer on the epidermis'
      - section: 'How it works'
        say: 'It cuts down water loss from the parts of the plant in the air. That is the leaves, the stem and the whole shoot.'
        write: 'Leaves, stem, shoot → cuticle cuts water loss'
      - say: 'The root grows in damp soil and must take water in. Its epidermis has thin walls and root hairs, and no cuticle, so water passes in freely.'
        write: 'Root: thin walls + root hairs, no cuticle → water in'
      - section: 'The trap'
        say: 'A young stem is green and soft, but it is up in the air, and it does have a cuticle.'
        write: 'Young stem: soft, but has a cuticle'
      - section: 'Answer'
        say: 'So the plant structure that lacks a waterproof cuticle is the root, which is option C.'
        write: '$\therefore$ Root'
        answer: true
    traps:
      A: 'You went for the leaf. The leaf has a thick cuticle to cut down water loss by evaporation.'
      B: 'You chose the stem. Even a young green stem is covered by a cuticle on its epidermis.'
      D: 'You picked the shoot. The shoot is the leaves and stem together, and both have a cuticle.'
  14:
    moments:
      - section: 'The question'
        say: 'We must name the tube in the male that carries both urine and semen out of the body.'
        write: 'Passage for both urine and semen = ?'
      - section: 'Name it'
        say: 'It is the urethra, the tube that runs from the bladder through the penis to the outside.'
        write: 'Urethra: bladder → penis → outside'
      - section: 'How it works'
        say: 'Urine from the bladder and semen from the testes and glands both leave the body through the urethra, at different times.'
        write: 'Urine and semen both exit by the urethra, at different times'
      - say: 'A ring of muscle closes the neck of the bladder during ejaculation, so urine and semen do not mix.'
        write: 'Bladder neck closes in ejaculation → no mixing'
      - section: 'The look-alike'
        say: 'The ureters are different tubes. They carry urine from the kidneys down to the bladder, and they carry no semen.'
        write: 'Ureter: kidney → bladder, urine only'
      - section: 'Exit and entry'
        say: 'The urethra is the way out of the bladder, and the ureters are the way into it.'
        write: 'Urethra = exit;  ureter = entry'
      - section: 'Answer'
        say: 'So the passage for both urine and semen is the urethra, which is option A.'
        write: '$\therefore$ Urethra'
        answer: true
    traps:
      B: 'You went for the ureter. It sounds alike, but the ureter only carries urine from a kidney to the bladder.'
      C: 'You chose the bladder. The bladder stores urine, and semen does not pass through it.'
      D: 'You picked the seminal vesicle. It adds fluid to the semen, but urine never passes through it.'
  15:
    moments:
      - section: 'The question'
        say: 'We must find the element that plants need in only minute quantities for growth.'
        write: 'Needed in minute quantities = ?'
      - section: 'Name it'
        say: 'Mineral elements come in two sizes of need. Macronutrients are needed in large amounts, and micronutrients, or trace elements, in minute amounts.'
        write: 'Macronutrients (large) vs micronutrients (trace)'
      - section: 'The two lists'
        say: 'Macronutrients include nitrogen, phosphorus, potassium, calcium, magnesium and sulphur.'
        write: 'Macro: nitrogen (N), phosphorus (P), potassium (K), calcium (Ca), magnesium (Mg), sulphur (S)'
      - say: 'Micronutrients include copper, zinc, manganese, boron, molybdenum and iron.'
        write: 'Micro: copper (Cu), zinc (Zn), manganese (Mn), boron (B), molybdenum (Mo), iron (Fe)'
      - section: 'How it works'
        say: 'Copper is needed only in tiny amounts, as part of some enzymes.'
        write: 'Copper: tiny amounts, for some enzymes'
      - section: 'N P K'
        say: 'N P K fertiliser supplies nitrogen, phosphorus and potassium, because plants need these three in large amounts.'
        write: 'NPK fertiliser = three macronutrients'
      - section: 'Answer'
        say: 'So the element required in minute quantities is copper, which is option A.'
        write: '$\therefore$ Copper'
        answer: true
    traps:
      B: 'You went for potassium. It is the K in N P K, a macronutrient needed in large amounts.'
      C: 'You chose phosphorus. It is very important for roots, but it is the P in N P K, needed in large amounts.'
      D: 'You picked sodium. Sodium is not one of the elements green plants need for growth, and most plants grow well without it.'
  16:
    moments:
      - section: 'The question'
        say: 'We must find the organism that lives as a parasite and yet makes its own food.'
        write: 'Both parasitic and autotrophic = ?'
      - section: 'Name it'
        say: 'Loranthus, the mistletoe, is a partial parasite.'
        write: 'Loranthus (mistletoe) = partial parasite'
      - section: 'How it works'
        say: 'It grows on the branches of a tree and sends suckers, called haustoria, into the host''s xylem to take water and mineral salts.'
        write: 'Haustoria → host xylem → water and salts'
      - say: 'But its leaves are green, so it makes its own food by photosynthesis. It is parasitic and autotrophic at the same time.'
        write: 'Green leaves → photosynthesis → autotrophic'
      - section: 'The trap'
        say: 'The sundew is green and catches insects. But it lives on its own in the soil and traps insects only for extra nitrogen, so it is not a parasite.'
        write: 'Sundew: insectivorous, not parasitic'
      - section: 'Answer'
        say: 'So the organism that is both parasitic and autotrophic is Loranthus, which is option B.'
        write: '$\therefore$ Loranthus'
        answer: true
    traps:
      A: 'You went for the sundew. It is not a parasite. It is a green insectivorous plant that traps insects for nitrogen.'
      C: 'You chose Rhizopus. It is a saprophytic fungus with no chlorophyll, so it cannot be autotrophic.'
      D: 'You picked the tapeworm. It is a parasite, but it cannot make its own food, so it is heterotrophic.'
  17:
    moments:
      - section: 'The question'
        say: 'We must find one function of the hydrochloric acid made in the stomach during digestion.'
        write: 'A function of HCl in the stomach = ?'
      - section: 'Name it'
        say: 'The stomach wall secretes hydrochloric acid as part of the gastric juice.'
        write: 'Gastric juice contains $\ce{HCl}$'
      - section: 'How it works'
        say: 'The acid makes the stomach strongly acidic. Ptyalin, the salivary amylase, works only in a near neutral medium.'
        write: 'Ptyalin works only near neutral'
      - say: 'So when the acid reaches the food, the medium is no longer neutral, and ptyalin stops working.'
        write: 'Acid reaches the food → ptyalin stops'
      - say: 'The acid has other jobs too. Pepsin, the stomach enzyme that digests protein, works only in an acid medium, and the acid also kills many germs in the food.'
        write: 'Also: acid medium for pepsin, kills germs'
      - section: 'The trap'
        say: 'Milk protein is clotted by the enzyme rennin, and fats are emulsified by bile in the duodenum. The acid does neither.'
        write: 'Rennin clots milk;  bile emulsifies fat'
      - section: 'Answer'
        say: 'So a function of the hydrochloric acid is to stop the action of ptyalin, which is option C.'
        write: '$\therefore$ Stops the action of ptyalin'
        answer: true
    traps:
      A: 'You went for neutralising bile. Bile never reaches the stomach. It is released into the duodenum, further along the gut.'
      B: 'You chose coagulating milk protein and emulsifying fats. Rennin is what clots milk protein, and bile is what emulsifies fats. The acid does neither job.'
      D: 'You picked breaking food into smaller particles. That is done by chewing and by the churning of the stomach muscles, not by the acid.'
  18:
    moments:
      - section: 'The question'
        say: 'We must find which of these four sugars is a polysaccharide.'
        write: 'Polysaccharide = ?'
      - section: 'Name it'
        say: 'A polysaccharide is a large carbohydrate made of many sugar units joined together.'
        write: 'Polysaccharide = many sugar units joined'
      - section: 'Count the units'
        say: 'A monosaccharide is a single unit, such as glucose.'
        write: 'Mono (1): glucose'
      - say: 'A disaccharide is two units joined, such as sucrose and maltose.'
        write: 'Di (2): sucrose, maltose'
      - say: 'A polysaccharide is a long chain, such as starch, glycogen and cellulose.'
        write: 'Poly (many): starch, glycogen, cellulose'
      - section: 'Answer'
        say: 'So the polysaccharide is cellulose, which is option D.'
        write: '$\therefore$ Cellulose'
        answer: true
    traps:
      A: 'You went for glucose. Glucose is a single sugar unit, a monosaccharide.'
      B: 'You chose sucrose. Sucrose is glucose joined to fructose, two units, so it is a disaccharide.'
      C: 'You picked maltose. It comes from starch digestion, but it is only two glucose units, a disaccharide.'
  19:
    moments:
      - section: 'The question'
        say: 'We are given a young plant with four arrows showing how materials move. We must find the arrow that shows transport in the xylem.'
        write: 'Xylem transport = arrow ?'
      - section: 'Look at the diagram'
        say: 'Look at the stem. It has two channels. The left channel, line one, has arrows pointing down towards the roots.'
        write: 'I: left channel, arrows down'
      - say: 'The right channel, line four, runs up from the roots with an arrow pointing up.'
        write: 'IV: right channel, arrow up'
      - say: 'Arrows two and three are outside the stem. Two comes out of a leaf into the air, and three goes from the air into the other leaf.'
        write: 'II: leaf → air.  III: air → leaf'
      - section: 'Name it'
        say: 'The xylem carries water and mineral salts up from the roots to the leaves.'
        write: 'Xylem: water + mineral salts, roots → leaves (up)'
      - section: 'How it works'
        say: 'Roots absorb water and salts from the soil. The xylem vessels carry them up the stem, pulled mainly by transpiration from the leaves.'
        write: 'Soil → roots → xylem → leaves (pulled by transpiration)'
      - say: 'The phloem does the other job. It carries food made in the leaves down to the roots and other parts. That is the downward channel, line one.'
        write: 'Phloem: food from leaves → down (I)'
      - section: 'Answer'
        say: 'So transport in the xylem is the upward arrow from the roots, labelled four, which is option D.'
        write: '$\therefore$ IV'
        answer: true
    traps:
      A: 'You went for one. It is a channel in the stem too, but its arrows point down, from the leaves to the roots. That is food moving in the phloem.'
      B: 'You chose two. Arrow two leaves the leaf for the air. That is a gas given out through the stomata, not transport in the xylem.'
      C: 'You picked three. Arrow three goes from the air into the leaf. That is a gas, such as carbon four oxide, entering through the stomata.'
