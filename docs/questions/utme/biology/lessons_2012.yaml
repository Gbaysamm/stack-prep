        write: 'Water cycle: earth ⇄ air, without end'
      - section: 'How it works'
        say: 'First, heat from the sun evaporates water from seas, rivers, soil and leaves. That is the way up.'
        write: 'Way up: evaporation (and transpiration from leaves)'
