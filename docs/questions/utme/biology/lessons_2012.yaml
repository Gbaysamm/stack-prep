        say: 'The colour blind man is X small c, Y. The carrier woman has one of each, X big N, X small c.'
        write: 'Parents:  $X^{c}Y \times X^{N}X^{c}$'
      - section: 'The gametes'
        say: 'The man gives X small c or Y. The woman gives X big N or X small c.'
        write: 'Gametes:  $X^{c},\ Y$  and  $X^{N},\ X^{c}$'
      - section: 'The offspring'
        say: 'The girls are X big N X small c, a carrier, and X small c X small c, who is colour blind.'
