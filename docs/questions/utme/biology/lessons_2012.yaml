        write: 'Donor antigen + receiver antibody → clumping'
      - section: 'Antigens and antibodies'
        say: 'An antigen sits on the red cells. An antibody floats in the plasma, and anti b means the antibody that clumps cells carrying antigen B.'
        write: 'Antigen on red cells;  antibody in plasma (anti-b clumps B cells)'
      - say: 'Now the groups. Group A has antigen A and anti b. Group B has antigen B and anti a.'
        write: 'A: antigen A, anti-b.   B: antigen B, anti-a'
      - say: 'Group A B has both antigens and no antibodies. Group O has no antigens and both antibodies.'
        write: 'AB: antigens A + B, no antibodies.   O: no antigens, anti-a + anti-b'
      - section: 'Test statement A'
        say: 'Statement A says group A B can donate only to group A B. A B red cells carry both antigens. Group A plasma has anti b, group B plasma has anti a, and group O plasma has both, so each of them clumps A B cells.'
        write: 'AB cells → clumped by A, B and O plasma'
      - say: 'Only A B plasma has no antibodies, so A B blood is safe only in another A B person. Statement A is true.'
        write: 'AB gives to AB only ✓'
      - section: 'Answer'
        say: 'So the true statement is that a person of group A B can donate only to another person of group A B, which is option A.'
        write: '$\therefore$ AB donates only to AB'
        answer: true
    traps:
      B: 'You chose the statement that groups A and B can give blood to each other. Group A plasma has anti b, and group B plasma has anti a, so each clumps the other''s red cells.'
      C: 'You picked the statement that group A B can receive only from group A or B. Group A B has no antibodies, so it can receive from A, B, A B and O. The word only makes it false.'
      D: 'You went for the statement that group O can donate only to group O. Group O red cells have no antigens, so O can give to every group, not only to O.'
  41:
    moments:
      - section: 'The question'
        say: 'Yellow maize crossed with yellow maize gives yellow and white seeds in the ratio three to one. We must say what kind of trait the yellow colour is.'
        write: 'Yellow × yellow → 3 yellow : 1 white.  Yellow is = ?'
      - section: 'The data'
        say: 'Both parents are yellow, but white comes back in one quarter of the offspring. So each parent must carry a hidden factor for white.'
        write: 'Both yellow, but white reappears → each carries white'
      - section: 'The rule'
        say: 'An allele is one form of a gene, here the yellow form or the white form. A heterozygous parent, or hybrid, carries one of each. Mendel showed that when two heterozygous parents are crossed, the dominant and recessive characters appear in the ratio three to one.'
        write: 'Mendel: hybrid × hybrid → 3 dominant : 1 recessive'
      - section: 'The cross'
        say: 'Let big Y stand for yellow and small y for white. Each parent is big Y small y.'
        write: 'Parents:  $Yy \times Yy$'
      - say: 'Each parent gives two kinds of gamete, big Y or small y.'
        write: 'Gametes:  $Y,\ y$  and  $Y,\ y$'
      - say: 'The offspring are big Y big Y, big Y small y, big Y small y, and small y small y.'
        write: 'Offspring:  $YY,\ Yy,\ Yy,\ yy$'
      - say: 'Three have at least one big Y and are yellow. One is small y small y and is white. That is three to one.'
        write: 'Ratio:  3 yellow : 1 white'
      - section: 'What the ratio shows'
        say: 'White shows only when two small y alleles meet, in one seed out of four. So white is recessive and yellow is dominant.'
        write: 'White only as $yy$ → recessive;  yellow → dominant'
      - section: 'Answer'
        say: 'So the yellow seed is said to be a dominant trait, which is option D.'
        write: '$\therefore$ Yellow is dominant'
        answer: true
    traps:
      A: 'You went for non heritable. The colour follows a Mendelian ratio from parents to offspring, so it is clearly passed on.'
      B: 'You chose sex linked. A maize plant is not a male or a female individual, so seed colour cannot ride on sex chromosomes. It is an ordinary gene.'
      C: 'You picked recessive. Yellow is in the larger share, the three. It is white, in the smaller share, that is recessive.'
