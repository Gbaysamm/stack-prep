      - say: 'It sinks into the soft, blood rich lining of the uterus. This is implantation.'
        write: 'Sinks into the lining = implantation'
      - say: 'The placenta forms in the uterine wall, and the embryo grows there until birth, cushioned by the amniotic fluid.'
        write: 'Placenta forms, embryo grows until birth'
      - section: 'Answer'
        say: 'So the developing embryo is usually contained in the uterus, which is option C.'
        write: '$\therefore$ uterus'
        answer: true
    traps:
