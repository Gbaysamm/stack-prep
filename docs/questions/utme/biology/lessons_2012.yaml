      A: 'You went for increasing slowly. A population increases slowly at the start of the curve, and again just before the top. While it is still rising, it has not reached the carrying capacity.'
      B: 'You chose exponential increase. That is the steep middle of the curve, when food and space are plentiful.'
      C: 'You picked slowing down. Growth starts to slow at about half the carrying capacity. The capacity itself is reached only when the number stops rising.'
