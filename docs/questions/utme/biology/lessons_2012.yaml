        write: 'Galapagos finches → Darwin''s evidence from = ?'
      - section: 'Name it'
        say: 'Darwin''s finches gave evidence from comparative anatomy, which means comparing the structure of body parts.'
        write: 'Comparative anatomy = comparing body structure'
      - section: 'How it works'
        say: 'On the islands Darwin found finches that looked alike but had beaks of different shapes and sizes.'
        write: 'Similar finches, different beaks'
      - say: 'Each beak suited a different food, such as seeds, insects or cactus. He compared these structures and concluded the finches came from one ancestor and changed to suit each island.'
        write: 'Beak fits food → one ancestor, adapted to each island'
      - section: 'An example'
        say: 'In the same way, the short thick beak of a weaver bird and the long thin beak of a sunbird show how structure matches food.'
        write: 'Weaver bird vs sunbird: structure matches food'
      - section: 'Remember'
        say: 'Remember, comparing the build of body parts is anatomy, and comparing how they work is physiology.'
        write: 'Build = anatomy;  working = physiology'
      - section: 'Answer'
        say: 'So Darwin derived his theory from comparative anatomy, which is option A.'
        write: '$\therefore$ Comparative anatomy'
        answer: true
