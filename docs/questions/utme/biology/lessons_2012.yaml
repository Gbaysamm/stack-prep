  49:
    moments:
      - section: 'The question'
        say: 'Use it or lose it, and pass on what you gained in your lifetime. Whose theory of evolution is that?'
        write: 'Use and disuse + inheritance of acquired traits = ?'
      - section: 'Name it'
        say: 'These two ideas belong to Lamarck''s theory of evolution.'
        write: 'Lamarck''s theory'
      - section: 'How it works'
        say: 'Use and disuse says organs that are used a lot grow stronger, and organs that are not used grow weak and disappear.'
        write: 'Use and disuse: used → stronger;  unused → disappears'
      - say: 'Inheritance of acquired characters says that changes gained during a lifetime are passed on to the young.'
        write: 'Acquired characters → passed to offspring'
      - section: 'An example'
        say: 'Lamarck said giraffes got long necks by stretching for leaves and passing the longer necks on. But a blacksmith''s strong arms are not passed to his children, which shows the idea is wrong.'
        write: 'Giraffe neck by stretching?  Blacksmith''s arms not inherited ✗'
      - section: 'Remember'
        say: 'Remember, Lamarck means lifetime changes passed on.'
        write: 'Lamarck = Lifetime changes passed on'
      - section: 'The trap'
        say: 'Darwin also explained evolution, but by natural selection of variations that are already present, not by use and disuse.'
        write: 'Darwin = natural selection'
      - section: 'Answer'
        say: 'So use and disuse and the inheritance of acquired traits explain Lamarck''s theory, which is option B.'
        write: '$\therefore$ Lamarck''s theory'
        answer: true
    traps:
      A: 'You went for Darwin''s theory. Darwin''s theory is natural selection, where the fittest survive and pass on variations they were born with.'
      C: 'You chose genetic drift. That is a change in gene frequency by chance, in small populations.'
      D: 'You picked gene flow. That is the movement of genes between populations when individuals migrate.'
