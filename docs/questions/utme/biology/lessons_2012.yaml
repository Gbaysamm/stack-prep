        write: 'Way down: condensation → clouds → rain'
      - say: 'Rain runs back into rivers and the sea, and the cycle starts again.'
        write: 'Rain → rivers → sea → evaporation again'
      - section: 'Both ways'
        say: 'Water goes up by evaporation and comes down by condensation and rain. The cycle needs both.'
        write: 'The cycle needs a way up AND a way down'
