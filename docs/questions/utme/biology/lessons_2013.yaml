# UTME 2013 Biology, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the Biology way: name the structure or process, say
# what it does or how it works in simple steps, a Nigerian example, a way to remember it, and
# the answer moment that names the option. traps gives one kind line for each wrong option.
# Questions 6 and 7 read the earthworm drawing (I the tail tip, II the clitellum, III a segment).
#
#   say:    heard, not read. No symbols the voice would mangle; Latin names said plainly.
#   write:  the one line written while it is said, with LaTeX between dollar signs.
#   answer: true on the moment that gives the answer.
#
# Keyed on question number, like explanations_2013.yaml. Answers match that file.
format_version: 1
exam_year: 2013
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'We must name the process in which complex substances are broken down into simpler ones.'
        write: 'Complex substances broken down to simpler ones $= ?$'
      - section: 'The process'
        say: 'The process is catabolism. Big, complex molecules are broken down into small, simple ones, and energy is usually set free.'
        write: 'Catabolism = breaking down, complex to simple'
      - section: 'How it fits'
        say: 'Metabolism is all the chemical reactions in a living thing, and it has two halves.'
        write: 'Metabolism = all the reactions in the body'
      - say: 'Anabolism is the building-up half. Small, simple molecules are joined into big ones, for example amino acids joining into proteins.'
        write: 'Anabolism = building up, simple to complex'
      - say: 'Catabolism is the breaking-down half. For example, in respiration glucose is broken down into carbon dioxide and water.'
        write: 'Catabolism = breaking down, as in respiration'
      - section: 'The word parts'
        say: 'Cata means down and ana means up. So catabolism breaks substances down, and anabolism builds them up.'
        write: 'Cata = down, ana = up'
      - section: 'Answer'
        say: 'So breaking complex substances down into simpler ones is catabolism, which is option B.'
        write: '$\therefore$ catabolism'
        answer: true
    traps:
      A: 'You went for anabolism. That is the building up of complex substances from simple ones, the very opposite.'
      C: 'You chose metabolism. It covers building up and breaking down together, so it is too wide. Breaking down alone is catabolism.'
      D: 'You picked tropism. That is a plant growing towards or away from a stimulus, like a shoot bending to light. It has nothing to do with breaking molecules down.'
  3:
    moments:
      - section: 'The question'
        say: 'We must name the structure in Euglena that is sensitive to light.'
        write: 'Light-sensitive structure in Euglena $= ?$'
      - section: 'Why light matters'
        say: 'Euglena has chloroplasts and needs light to make its food, so it must find the light and swim towards it.'
        write: 'Euglena needs light to make food'
      - section: 'The structure'
        say: 'The part that senses light is the eyespot, also called the stigma. It is a small red orange spot near the base of the flagellum.'
        write: 'Eyespot (stigma), red-orange, near the flagellum base'
      - section: 'How it works'
        say: 'Beside the eyespot, at the base of the flagellum, is a light-sensitive swelling. When light comes from one side, the eyespot casts a shadow on the swelling, and as Euglena turns, the shading changes.'
        write: 'Eyespot shades the light-sensitive swelling'
      - say: 'So the cell can tell which way the light is coming from, and the flagellum then drives it towards the light.'
        write: 'Senses light direction, then swims to it'
      - section: 'Answer'
        say: 'So the structure that is sensitive to light is the eyespot, which is option D.'
        write: '$\therefore$ the eyespot'
        answer: true
    traps:
      A: 'You went for the gullet. It is the opening at the front through which the flagellum comes out. It does not sense light.'
      B: 'You chose the flagellum. It moves the cell towards the light, but it is the eyespot that detects the light.'
      C: 'You picked the chloroplast. It traps light to make food, but it does not tell the cell where the light is.'
  4:
    moments:
      - section: 'The question'
        say: 'We must name the organelles found in cells that are respiring and photosynthesising.'
        write: 'Organelles for respiration and photosynthesis $= ?$'
      - section: 'Respiration'
        say: 'Respiration happens in the mitochondria. They break down glucose with oxygen and store the energy as A T P, the energy carrier the cell spends on its work.'
        write: 'Respiration, in mitochondria, energy stored as ATP'
      - section: 'Photosynthesis'
        say: 'Photosynthesis happens in the chloroplasts. They hold chlorophyll, which traps sunlight to make glucose from carbon dioxide and water.'
        write: 'Photosynthesis, in chloroplasts, light makes glucose'
      - section: 'Both together'
        say: 'A cell doing both jobs, such as a green leaf cell, must therefore have both mitochondria and chloroplasts.'
        write: 'Both jobs, chloroplasts + mitochondria'
      - section: 'Answer'
        say: 'So a cell that is respiring and photosynthesising has mitochondria and chloroplasts, which is option D.'
        write: '$\therefore$ mitochondria and chloroplasts'
        answer: true
    traps:
      A: 'You went for lysosomes and ribosomes. Lysosomes digest worn out parts and ribosomes make proteins. Neither one respires or photosynthesises.'
      B: 'You chose the Golgi apparatus and endoplasmic reticulum. They make, package and carry substances. They do not respire or photosynthesise.'
      C: 'You picked the nucleus and centrioles. The nucleus controls the cell and centrioles help in cell division, and plant cells usually lack centrioles anyway.'
  5:
    moments:
      - section: 'The question'
        say: 'We must name the animal in which Taenia solium is found.'
        write: 'Taenia solium is found in $?$'
      - section: 'The organism'
        say: 'Taenia solium is the pork tapeworm. The adult lives in the human intestine.'
        write: 'Taenia solium = pork tapeworm, adult in human gut'
      - section: 'The life cycle'
        say: 'A pig eats food or water soiled by human faeces that carry tapeworm eggs. The young worms, the larvae, settle in its muscles inside small fluid-filled sacs called bladder worms.'
        write: 'Eggs in faeces, pig eats them, bladder worms in pig muscle'
      - say: 'A person who eats undercooked pork swallows the bladder worms, and they grow into adult worms in the gut.'
        write: 'Undercooked pork, adult worm in the human gut'
      - section: 'Two tapeworms'
        say: 'Solium goes with the pig. Its cousin Taenia saginata is the beef tapeworm, and its larva lives in the cow.'
        write: 'Solium = pig,  saginata = cow'
      - section: 'Answer'
        say: 'So Taenia solium is found in the pig, which is option D.'
        write: '$\therefore$ the pig'
        answer: true
    traps:
      A: 'You went for the cow. The cow carries the beef tapeworm, Taenia saginata, which is a different species.'
      B: 'You chose the goat. The goat is not a host of Taenia solium. Its bladder worm lives in pig muscle, and people catch the adult by eating undercooked pork.'
      C: 'You picked the dog. Dogs carry other tapeworms, such as Echinococcus and Dipylidium, not Taenia solium.'
  6:
    moments:
      - section: 'The question'
        say: 'We are given a drawing of an earthworm, and we must name the structure labelled two.'
        write: 'Earthworm, structure II $= ?$'
      - section: 'Read the drawing'
        say: 'The head is on the right and the tail, marked I, is on the left. Label III points to an ordinary ringed segment near the head.'
        write: 'Head on the right, I = tail tip, III = a segment'
      - say: 'Now find label II. It points to a thick, smooth, swollen band a third of the way back from the head.'
        write: 'II = the swollen smooth band'
      - section: 'The structure'
        say: 'That band is the clitellum. It is made of glandular segments, and only a mature worm has it.'
        write: 'Clitellum = glandular band of a mature worm'
      - section: 'What it does'
        say: 'Its gland cells make mucus that holds two worms together while they swap sperm.'
        write: 'Mucus holds two worms together at mating'
      - say: 'Later the clitellum makes the cocoon, a tough band that slips forward off the head with the eggs inside. So the cocoon is made by the clitellum, not the band itself.'
        write: 'Then it makes the cocoon for the eggs'
      - section: 'Answer'
        say: 'So the structure labelled two is the clitellum, which is option C.'
        write: '$\therefore$ II is the clitellum'
        answer: true
    traps:
      A: 'You went for the spermathecal pore. Those are tiny openings in the grooves in front of the band, where sperm from another worm is taken in. They are not the band itself.'
      B: 'You chose the cocoon. The cocoon is the egg case that the clitellum makes. Label two points to the band that makes it.'
      D: 'You picked chaetae. Those are tiny bristles on each segment that grip the soil, not a swollen band.'
  7:
    moments:
      - section: 'The question'
        say: 'Using the same drawing, we must say what kind of soil this organism is found in.'
        write: 'Soil the organism is found in $= ?$'
      - section: 'Read the drawing'
        say: 'The long, ringed body and the swollen band marked II tell us this is an earthworm.'
        write: 'Long ringed body + clitellum (II) = earthworm'
      - section: 'The habitat'
        say: 'Earthworms live in soils rich in humus. Humus is the dark, decayed remains of dead plants and animals.'
        write: 'Earthworm habitat = humus-rich soil'
      - section: 'Why humus'
        say: 'An earthworm swallows soil and digests the organic matter in it. Humus is that food.'
        write: 'Swallows soil, digests the humus'
      - say: 'Humus soil is also moist and well aerated, so the worm can breathe through its damp skin.'
        write: 'Moist + airy, breathes through damp skin'
      - section: 'Answer'
        say: 'So the earthworm is found in soils rich in humus, which is option B.'
        write: '$\therefore$ humus'
        answer: true
    traps:
      A: 'You went for mud. Waterlogged mud has little air, and an earthworm in it cannot breathe well through its skin.'
      C: 'You chose clay. Clay holds water but it is compact and poorly aerated, with little decaying matter for the worm to eat.'
      D: 'You picked sand. Sand dries out fast and has little humus, so the worm would dry up and starve.'
  8:
    moments:
      - section: 'The question'
        say: 'We must pick the statement that describes a characteristic of arthropods, the group that includes insects, crabs and spiders.'
        write: 'A characteristic of arthropods $= ?$'
      - section: 'The group'
        say: 'Arthropods have a hard outer coat called an exoskeleton, or cuticle. It is made of chitin.'
        write: 'Exoskeleton (cuticle) made of chitin'
      - section: 'The other features'
        say: 'Their bodies are divided into segments, so the body is built from a row of similar parts.'
        write: 'Segmented body'
      - say: 'They also have many pairs of jointed appendages. Appendages are the parts that stick out from the body, such as legs, antennae and mouthparts.'
        write: 'Many pairs of jointed appendages'
      - section: 'What the coat does'
        say: 'The chitin coat supports and protects the body and stops it drying out. But it cannot stretch, so to grow the animal must moult.'
        write: 'Supports, protects, stops drying, must moult to grow'
      - section: 'Answer'
        say: 'So the characteristic of arthropods is a body covered by chitin, which is option D.'
        write: '$\therefore$ the body is covered by chitin'
        answer: true
    traps:
      A: 'You went for growing freely. The hard exoskeleton does the opposite and limits growth, so arthropods must moult to grow.'
      B: 'You chose one pair of jointed appendages. Arthropods do have jointed appendages, but many pairs of them, not only one.'
      C: 'You picked a body not divided into segments. Arthropod bodies are clearly segmented, often grouped into head, thorax and abdomen.'
  9:
    moments:
      - section: 'The question'
        say: 'We must find the statement that distinguishes a butterfly from a moth.'
        write: 'Butterfly versus moth, a true difference $= ?$'
      - section: 'What distinguishes'
        say: 'To distinguish two things, a statement must name a real way in which they differ. A statement of likeness cannot tell them apart.'
        write: 'A difference distinguishes, a likeness cannot'
      - section: 'The body'
        say: 'A moth has a stout, fat, hairy abdomen. A butterfly has a slim, slender abdomen.'
        write: 'Moth abdomen fat, butterfly abdomen slim'
      - section: 'The wings'
        say: 'A butterfly rests with its wings held upright over its back. A moth rests with its wings spread flat.'
        write: 'Butterfly wings upright at rest, moth wings flat'
      - section: 'Time and antennae'
        say: 'Butterflies fly by day, and most moths fly by night.'
        write: 'Butterfly by day, moth by night'
      - say: 'Their antennae differ too. Butterflies have club-tipped antennae, and moths have feathery or thread-like ones.'
        write: 'Butterfly antennae clubbed, moth antennae feathery'
      - section: 'Answer'
        say: 'So the true difference is that the abdomen of a moth is fatter than that of a butterfly, which is option D.'
        write: '$\therefore$ the moth abdomen is fatter'
        answer: true
    traps:
      A: 'You went for A, but it has the resting positions the wrong way round. A butterfly rests with its wings upright, and a moth rests with them flat.'
      B: 'You chose B, which says both are active during the day. That describes a likeness, so it cannot tell them apart, and it is not true either. Butterflies fly by day, but most moths fly at night.'
      C: 'You picked C. Their antennae are in fact different, clubbed in butterflies and feathery or thread-like in moths. And a likeness cannot tell two things apart.'
  10:
    moments:
      - section: 'The question'
        say: 'We must name the type of feather that birds use for flight.'
        write: 'Feathers used for flight $= ?$'
      - section: 'The feathers'
        say: 'The flight feathers are the quill feathers. They are the long, stiff feathers of the wings and the tail.'
        write: 'Quill feathers = long stiff wing and tail feathers'
      - section: 'How they work'
        say: 'Each quill has a strong central shaft. On each side is a flat, firm vane made of fine branches called barbs, hooked together, so the feather can push against the air.'
        write: 'Strong shaft + hooked barbs, pushes on the air'
      - say: 'The wing quills give lift and push the bird forward. The tail quills steer and brake.'
        write: 'Wing quills lift, tail quills steer'
      - section: 'The other feathers'
        say: 'The other feathers do other jobs. Coverts cover the bases of the quills and smooth the wing.'
        write: 'Coverts cover the quill bases'
      - say: 'Down feathers are soft and fluffy, and they keep the bird warm.'
        write: 'Down keeps the bird warm'
      - say: 'Filoplumes are tiny hair-like feathers that sense the position of the other feathers.'
        write: 'Filoplumes sense the other feathers'
      - section: 'Answer'
        say: 'So the feathers used for flight are the quills, which is option A.'
        write: '$\therefore$ quill feathers'
        answer: true
    traps:
      B: 'You went for filoplumes. They are tiny hair-like feathers that sense the position of the other feathers. They do not fly.'
      C: 'You chose coverts. They lie over the bases of the quills and smooth the wing, but they do not do the flying.'
      D: 'You picked down. Down feathers are soft and fluffy and keep the bird warm.'
  11:
    moments:
      - section: 'The question'
        say: 'We must name the plants that grow in deserts or very dry areas.'
        write: 'Plants of deserts and very dry areas $= ?$'
      - section: 'The plants'
        say: 'Plants of deserts and very dry places are xerophytes.'
        write: 'Xerophytes = plants of dry places'
      - section: 'How they cope'
        say: 'They cut down water loss in several ways. First, their leaves and stems have a thick cuticle, a waxy layer that water cannot pass through easily.'
        write: 'Thick waxy cuticle'
      - say: 'Second, they have few stomata, often sunken in pits, so less water vapour escapes through these pores.'
        write: 'Few, sunken stomata'
      - say: 'Third, in many of them the leaves are reduced to spines, which leaves very little surface to lose water from.'
        write: 'Leaves reduced to spines'
      - say: 'They also store water in fleshy stems and reach for it with deep or wide roots, as the cactus does.'
        write: 'Fleshy stems store water, deep roots'
      - section: 'The word parts'
        say: 'The names come from their first parts. Xero means dry. Hydro means water, epi means upon, and meso means middle.'
        write: 'Xero = dry, hydro = water, epi = upon, meso = middle'
      - section: 'Answer'
        say: 'So plants of deserts or very dry areas are xerophytes, which is option D.'
        write: '$\therefore$ xerophytes'
        answer: true
    traps:
      A: 'You went for mesophytes. They are the ordinary plants of places with moderate water, like maize and beans.'
      B: 'You chose hydrophytes. They grow in or on water, like the water lily.'
      C: 'You picked epiphytes. They grow on other plants for support, like orchids on a tree trunk.'
  12:
    moments:
      - section: 'The question'
        say: 'We must find the simplest living organism among the four.'
        write: 'The simplest living organism $= ?$'
      - section: 'Rule one out'
        say: 'A virus is not counted as a living organism. It has no cell, cannot feed, respire or grow, and reproduces only inside a living host cell.'
        write: 'Virus, no cell, lives only inside a host, not counted'
      - section: 'The organism'
        say: 'Of the three real cells, Amoeba is the simplest. It is one cell with no fixed shape, no cilia or flagella and no chloroplasts.'
        write: 'Amoeba = one cell, no fixed shape, no cilia, no flagella'
      - section: 'How it lives'
        say: 'It moves and feeds by pushing out false feet, called pseudopodia. It engulfs its food, and it reproduces by simply splitting in two.'
        write: 'Pseudopodia, engulfs food, splits in two'
      - section: 'Compare'
        say: 'Now compare the other two. Paramecium has cilia, a fixed slipper shape, an oral groove and two kinds of nucleus, so it has more parts than Amoeba.'
        write: 'Paramecium, cilia, slipper shape, two nuclei'
      - say: 'Chlamydomonas has flagella, a chloroplast and an eyespot, so it too has more parts than Amoeba.'
        write: 'Chlamydomonas, flagella, chloroplast, eyespot'
      - section: 'Answer'
        say: 'So the simplest living organism here is Amoeba, which is option C.'
        write: '$\therefore$ Amoeba'
        answer: true
    traps:
      A: 'You went for Paramecium. It has cilia, a fixed shape, a gullet and two nuclei, so it is more complex than Amoeba.'
      B: 'You chose virus. A virus is simpler, but it is not a cell and shows life only inside a host cell, so it is not counted as a living organism.'
      D: 'You picked Chlamydomonas. It has flagella, a chloroplast and an eyespot, so it is more complex than Amoeba.'
  13:
    moments:
      - section: 'The question'
        say: 'We must name the group of animals in which a proboscis is mostly found.'
        write: 'Proboscis is mostly found in $?$'
      - section: 'The structure'
        say: 'A proboscis is a long, tube-like mouthpart for taking in liquid food. It is found mostly in insects.'
        write: 'Proboscis = long tube-like mouthpart'
      - section: 'How insects use it'
        say: 'For example, a butterfly coils its proboscis under its head and uncoils it to suck nectar from flowers.'
        write: 'Butterfly sucks nectar'
      - say: 'A housefly mops up liquid food with its spongy proboscis.'
        write: 'Housefly mops up liquid food'
      - say: 'A mosquito has a piercing proboscis that sucks blood.'
        write: 'Mosquito pierces and sucks blood'
      - section: 'Answer'
        say: 'So the proboscis is mostly found in insects, which is option A.'
        write: '$\therefore$ insects'
        answer: true
    traps:
      B: 'You went for tapeworms. They have no mouth at all, and they absorb digested food through their body surface.'
      C: 'You chose amphibians. Toads and frogs catch food with a sticky tongue, not a proboscis.'
      D: 'You picked molluscs. A few sea snails do have one, but a proboscis is mostly found in insects.'
  14:
    moments:
      - section: 'The question'
        say: 'We must find the structure of desert plants that helps them conserve water.'
        write: 'Desert plant structure for saving water $= ?$'
      - section: 'The adaptation'
        say: 'A desert plant saves water with spiny leaves, that is, leaves reduced to spines.'
        write: 'Leaves reduced to spines'
      - section: 'How it works'
        say: 'Water evaporates from leaves through the stomata. A spine has a tiny surface and almost no stomata, so very little water is lost.'
        write: 'Tiny surface, few stomata, little water lost'
      - say: 'The green stem then takes over the job of photosynthesis, as in the cactus.'
        write: 'Green stem makes the food'
      - section: 'Answer'
        say: 'So the desert plant adaptation for saving water is spiny leaves, which is option C.'
        write: '$\therefore$ spiny leaves'
        answer: true
    traps:
      A: 'You went for broad leaves with many stomata. They lose a lot of water, so they suit wet forests, not deserts.'
      B: 'You chose spongy mesophyll. It has many air spaces that water vapour escapes through, and it is found in all ordinary leaves.'
      D: 'You picked prominent stomata. More stomata lose more water. Desert plants have few, sunken stomata.'
  15:
    moments:
      - section: 'The question'
        say: 'We must say what the long, sharp, clawed feet of birds are an adaptation for.'
        write: 'Long sharp clawed feet are for $?$'
      - section: 'The structure'
        say: 'Long, sharp, curved claws on the feet are called talons. They are an adaptation for grasping and holding prey.'
        write: 'Talons = long sharp curved claws'
      - section: 'How it works'
        say: 'The bird swoops down, grips the animal with its talons, pierces it and holds it still.'
        write: 'Swoop, grip, pierce, hold'
      - say: 'Then the hooked beak tears the flesh. The feet hold and the beak tears.'
        write: 'Feet hold, beak tears'
      - section: 'Answer'
        say: 'So long, sharp clawed feet are for grasping prey, which is option D.'
        write: '$\therefore$ grasping prey'
        answer: true
    traps:
      A: 'You went for crushing seeds. Seeds are crushed by a short, thick beak, as in the weaver bird, not by the feet.'
      B: 'You chose scooping mud. Mud is scooped by a broad, flat bill, as in the duck.'
      C: 'You picked tearing flesh. Birds of prey do tear flesh, but with the hooked beak. The claws grasp the prey and hold it still.'
  16:
    moments:
      - section: 'The question'
        say: 'We must find the organism that uses energy from the sun when it makes its food.'
        write: 'Organism using energy from the sun to make food $= ?$'
      - section: 'The organism'
        say: 'Anabaena is a blue-green bacterium. It has chlorophyll and makes its food by photosynthesis, using energy from the sun.'
        write: 'Anabaena, blue-green, has chlorophyll, photosynthesis'
      - section: 'The other way'
        say: 'Some organisms make food without light. This is chemosynthesis, and the energy comes from chemical reactions.'
        write: 'Chemosynthesis = energy from chemical reactions'
      - say: 'The other three options all feed this way. Nitrosomonas gets its energy by turning ammonia into nitrites.'
        write: 'Nitrosomonas, ammonia to nitrites'
      - say: 'Nitrobacter gets its energy by turning nitrites into nitrates.'
        write: 'Nitrobacter, nitrites to nitrates'
      - say: 'Colourless sulphur bacteria get their energy by oxidising hydrogen sulphide. So all three are chemosynthetic, and none of them uses light.'
        write: 'Sulphur bacteria, oxidise hydrogen sulphide, no light'
      - section: 'Answer'
        say: 'So the organism that uses energy from the sun is Anabaena, which is option A.'
        write: '$\therefore$ Anabaena'
        answer: true
    traps:
      B: 'You went for colourless sulphur bacteria. They have no chlorophyll, and they get their energy by oxidising hydrogen sulphide.'
      C: 'You chose Nitrosomonas. It is famous from the nitrogen cycle, but it is chemosynthetic and gets its energy by oxidising ammonia to nitrites.'
      D: 'You picked Nitrobacter. It is chemosynthetic too, and gets its energy by oxidising nitrites to nitrates, not from light.'
  17:
    moments:
      - section: 'The question'
        say: 'We must name the movement of dissolved food substances and mineral salts from one part of a plant to another.'
        write: 'Movement of dissolved food and salts in a plant $= ?$'
      - section: 'The process'
        say: 'Moving dissolved substances, above all the food the plant has made, from one part of the plant to another is translocation.'
        write: 'Translocation = moving dissolved food and salts'
      - section: 'How it works'
        say: 'Sugars made in the leaves travel in the phloem, up or down, to where they are used or stored, such as growing tips, fruits, roots and tubers.'
        write: 'Sugars travel in the phloem'
      - say: 'Mineral salts travel up from the roots, mostly in the xylem.'
        write: 'Mineral salts up in the xylem'
      - section: 'Do not confuse'
        say: 'Translocation means moving from place to place. Transpiration sounds alike, but it is the loss of water vapour from the leaves.'
        write: 'Translocation moves food, transpiration loses water vapour'
      - section: 'Answer'
        say: 'So the movement of dissolved food and mineral salts in a plant is translocation, which is option B.'
        write: '$\therefore$ translocation'
        answer: true
    traps:
      A: 'You went for osmosis. That is the movement of water alone across a membrane, from a dilute to a concentrated solution.'
      C: 'You chose transpiration. It sounds close, but it is the loss of water vapour from the leaves, not the moving of food and salts.'
      D: 'You picked diffusion. That is the general spreading of particles from high to low concentration, not the name of food transport in a plant.'
  18:
    moments:
      - section: 'The question'
        say: 'We must name the enzyme that is present in saliva.'
        write: 'The enzyme in saliva $= ?$'
      - section: 'The enzyme'
        say: 'The enzyme in saliva is ptyalin. It is also called salivary amylase.'
        write: 'Ptyalin = salivary amylase'
      - section: 'What it does'
        say: 'Ptyalin begins the digestion of cooked starch in the mouth. It breaks the starch down into maltose, a sugar, which is why starchy food tastes sweeter as you chew it.'
        write: 'Starch to maltose, in the mouth'
      - section: 'Answer'
        say: 'So the enzyme in saliva is ptyalin, which is option D.'
        write: '$\therefore$ ptyalin'
        answer: true
    traps:
      A: 'You went for rennin. It is made in the stomach of young mammals and curdles milk.'
      B: 'You chose lipase. It digests fats and is made mainly by the pancreas.'
      C: 'You picked pepsin. It is a real digestive enzyme, but it is made in the stomach and digests proteins in acid.'
  19:
    moments:
      - section: 'The question'
        say: 'We must name the plants that have special devices for trapping and digesting insects.'
        write: 'Plants that trap and digest insects $= ?$'
      - section: 'The plants'
        say: 'Plants with special devices for trapping and digesting insects are carnivorous, or insectivorous, plants. Carnivorous means meat eating.'
        write: 'Carnivorous (insectivorous) plants'
      - section: 'Why they do it'
        say: 'They grow in soils poor in nitrogen, such as bogs. Insects give them the nitrogen the soil lacks.'
        write: 'Poor soil, insects supply nitrogen'
