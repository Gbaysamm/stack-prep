        write: 'Universal recipients belong to group $?$'
      - section: 'Two words'
        say: 'First, two words. An antigen is a marker on the surface of the red cells. In this system it is A, B, both or neither.'
        write: 'Antigen = marker on the red cells, A or B'
      - say: 'An antibody is a protein in the plasma. Anti A attacks cells with the A marker, and anti B attacks cells with the B marker, making them clump.'
        write: 'Antibody in the plasma, anti-A clumps A cells'
      - section: 'The rule'
        say: 'A person can receive blood if their plasma has no antibodies against the antigens on the donor red cells.'
        write: 'Safe if plasma has no antibody against donor cells'
      - section: 'Find the group'
        say: 'Group A B has both A and B antigens on its cells, so its plasma has neither anti A nor anti B.'
        write: 'Group AB, antigens A + B, plasma has no anti-A, no anti-B'
      - say: 'So no donor cells are clumped in group A B blood. Group A B is the universal recipient.'
        write: 'AB = universal recipient'
      - section: 'The opposite'
        say: 'Group O is the opposite. Its cells carry no A or B antigen, so anyone can receive them. O is the universal donor.'
        write: 'O = universal donor'
      - section: 'Answer'
        say: 'So universal recipients belong to group A B, which is option D.'
        write: '$\therefore$ group AB'
        answer: true
    traps:
      A: 'You went for group B. Group B plasma has anti A, so it would clump A and A B cells.'
      B: 'You chose group A. Group A plasma has anti B, so it would clump B and A B cells.'
      C: 'You picked group O. Its plasma has both anti A and anti B. Group O is the universal donor, not the recipient.'
