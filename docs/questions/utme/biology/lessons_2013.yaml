      - section: 'The question'
        say: 'Thousands of termites build one tall mound together. What do we call the way they behave?'
        write: 'Behaviour of social insects $= ?$'
      - section: 'The behaviour'
        say: 'Social insects show cooperation and division of labour. Each member belongs to a caste with its own job.'
        write: 'Cooperation + division of labour'
      - section: 'Termites'
        say: 'For example, in a termite colony the queen lays eggs, and the king mates with her.'
        write: 'Queen lays eggs, king mates'
      - say: 'The workers build, gather food and feed the others.'
        write: 'Workers build and feed'
      - say: 'The soldiers, with their big jaws, defend the mound.'
        write: 'Soldiers defend'
      - section: 'Honeybees'
        say: 'In a honeybee hive, the queen lays eggs, the drones mate, and the workers do everything else.'
        write: 'Queen, drones, workers'
      - section: 'An example'
        say: 'The tall termite mounds of the Guinea savanna are built by thousands of workers acting together.'
        write: 'Termite mounds of the savanna'
      - section: 'Remember it'
        say: 'Social insects are a team, each member with one job.'
        write: 'A team, one job each'
      - section: 'Answer'
        say: 'So the behaviour of social insects is cooperation and division of labour, which is option A.'
        write: '$\therefore$ cooperation and division of labour'
        answer: true
    traps:
      B: 'You went for saprophytism. That is feeding on dead organic matter, a way of feeding, not social behaviour.'
      C: 'You chose parasitism. That is one organism feeding on a living host of another species.'
      D: 'You picked commensalism. That is a link between two different species, where one gains and the other is unharmed. Social insects are all one species working together.'
