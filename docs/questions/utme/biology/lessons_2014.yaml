# UTME 2014 Biology, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good biology teacher works on the board: the
# question, the structure or process named, how it works in simple steps, a real Nigerian
# example, a way to remember it, and the answer. Where the question has a drawing, the lesson
# says in words where to look in it. Crosses are laid out line by line on the board.
#
#   say:     heard, not read. Latin names said plainly, genetic symbols as letters ("X Y"),
#            ratios in words, no symbols the voice would stop on.
#   write:   the one line written while it is said, with LaTeX and mhchem between dollar signs.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2014.yaml. Answers match that file.
format_version: 1
exam_year: 2014
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'Here is Euglena, a tiny green cell from pond water. Two of its parts sit close together near the front, and only one of them is labelled two. Which is it?'
        write: 'Euglena: the part labelled II $= ?$'
      - section: 'Look at the drawing'
        say: 'Start at the blunt top end. The long whip is the flagellum, and it comes out of a flask shaped pocket called the reservoir, which is label one.'
        write: 'Flagellum → reservoir (I) at the front'
      - say: 'Beside the reservoir, on the left, is a solid dark spot. That is the eyespot.'
        write: 'Solid dark spot, left of the reservoir = eyespot'
      - say: 'Just behind the reservoir is a clear round bubble with tiny droplets around it. That bubble is label two.'
        write: 'II = clear round bubble behind the reservoir'
      - section: 'The structure'
        say: 'This bubble is the contractile vacuole. Contractile means it can squeeze.'
        write: 'II = contractile vacuole'
      - section: 'How it works'
        say: 'Water keeps entering Euglena by osmosis, because the inside of the cell is more concentrated than pond water.'
        write: 'Pond water → into the cell by osmosis'
      - say: 'The vacuole fills with the extra water, then squeezes it out into the reservoir. So the cell does not swell and burst. This is called osmoregulation.'
        write: 'Fills → squeezes into reservoir → no bursting (osmoregulation)'
      - section: 'An example'
        say: 'A green puddle beside a compound in the rainy season is often full of Euglena, each one pumping water out all day.'
        write: 'Green rainy-season puddle: full of Euglena'
      - section: 'Remember'
        say: 'Remember, the contractile vacuole is the water pump of the cell, and it sits next to the reservoir it empties into.'
        write: 'Contractile vacuole = the cell''s water pump'
      - section: 'Answer'
        say: 'So the part labelled two is the contractile vacuole, which is option D.'
        write: '$\therefore$ II = contractile vacuole'
        answer: true
    traps:
      A: 'You went for the nucleus. The nucleus controls the cell and holds its genes, but it is not the clear bubble at label two, and it does not pump out water.'
      B: 'You chose the eyespot. It is close by, but the eyespot is the solid dark spot to the left of the reservoir, and it helps the cell find light. Label two is the clear bubble.'
      C: 'You picked the basal granule. That is the tiny dot at the root of the flagellum, deep inside the reservoir, not the bubble behind it.'
  3:
    moments:
      - section: 'The question'
        say: 'Euglena moves like an animal, yet it can make its own food like a plant. Which label marks the part that does photosynthesis?'
        write: 'Euglena: part for photosynthesis $= ?$'
      - section: 'The rule'
        say: 'Photosynthesis happens in chloroplasts, which hold the green pigment chlorophyll.'
        write: 'Photosynthesis → chloroplasts (chlorophyll)'
      - section: 'Look at the drawing'
        say: 'Look at the middle of the cell. There is a star of narrow bands spreading out from a small round centre. Those bands are the chloroplasts, and two leader lines join them to label three.'
        write: 'Star of narrow bands in the middle = chloroplasts = III'
      - section: 'How it works'
        say: 'Chlorophyll traps light. The cell uses that energy to turn carbon dioxide and water into sugar, and gives out oxygen.'
        write: '$\ce{6CO2 + 6H2O ->[light][chlorophyll] C6H12O6 + 6O2}$'
      - say: 'Euglena stores the food it makes as paramylum, the small grains scattered in the cytoplasm. The group near the pointed end is label four.'
        write: 'Paramylum grains (IV) = food store'
      - section: 'An example'
        say: 'This is why Euglena makes ponds look green, like the green scum on a stagnant gutter in Lagos.'
        write: 'Green scum on a Lagos gutter'
      - section: 'Remember'
        say: 'Remember, the green part is the food factory. In this Euglena the food factory is the star.'
        write: 'Green star = food factory'
      - section: 'Answer'
        say: 'So photosynthesis happens at label three, which is option A.'
        write: '$\therefore$ III, the chloroplasts'
        answer: true
    traps:
      B: 'You went for four. Those are the paramylum grains, which store the food after it is made. They store it, they do not make it.'
      C: 'You chose one. That is the reservoir, the flask shaped pocket at the base of the flagellum. It holds no chlorophyll.'
      D: 'You picked two. That is the contractile vacuole, which pumps out extra water, not the part that makes food.'
  4:
    moments:
      - section: 'The question'
        say: 'A living body is built like a house, from small pieces up. What is the very smallest level?'
        write: 'Lowest level of organization $= ?$'
      - section: 'The rule'
        say: 'Living things are built in levels. The order is cell, then tissue, then organ, then system and then the whole organism.'
        write: 'Cell → tissue → organ → system → organism'
      - say: 'The cell is the smallest unit that is alive and can carry out the processes of life on its own.'
        write: 'Cell = smallest living unit'
      - say: 'Similar cells working together make a tissue. Tissues make an organ, and organs make a system.'
        write: 'Cells → tissue, tissues → organ, organs → system'
      - section: 'An example'
        say: 'Think of a goat. Muscle cells make muscle tissue. Muscle and other tissues make the heart. The heart and the blood vessels make the circulatory system.'
        write: 'Goat: muscle cell → muscle tissue → heart → circulatory system'
      - section: 'Remember'
        say: 'Remember the order with Cats Take Over Small Offices. That is cell, tissue, organ, system and organism.'
        write: 'Cats Take Over Small Offices'
      - section: 'Answer'
        say: 'So the lowest level of organization is the cell, which is option B.'
        write: '$\therefore$ cell'
        answer: true
    traps:
      A: 'You went for organ. An organ is made of several tissues, so it sits high up the ladder.'
      C: 'You chose system. A system is a group of organs, one of the highest levels.'
      D: 'You picked tissue. A tissue is a group of cells, so it sits just above the cell.'
  5:
    moments:
      - section: 'The question'
        say: 'The choices are heart, hair, Euglena and Hydra. Hydra is a whole animal, so many students pick it. But which one is the most complex in how its cells are organized?'
        write: 'Most complex level: heart, hair, Euglena or Hydra?'
      - section: 'The rule'
        say: 'Place each one on the ladder of cell, tissue, organ and system. The higher the level, the more complex.'
        write: 'Cell < tissue < organ < system'
      - section: 'Place each one'
        say: 'Euglena is a single cell. That is the lowest level.'
        write: 'Euglena → cell level'
      - say: 'Hydra is a whole animal, but it is built only to the tissue level. It has two cell layers and no true organs.'
        write: 'Hydra → tissue level (two layers, no true organs)'
      - say: 'A hair is made of dead cells filled with keratin. It is not a working level of organization at all.'
        write: 'Hair → dead keratin-filled cells'
      - say: 'The heart is an organ. Muscle, nerve, connective tissue and blood vessels work together in it to pump blood.'
        write: 'Heart → organ level (many tissues)'
      - section: 'An example'
        say: 'Think of a cow heart at the abattoir. In one slice you can see several different tissues.'
        write: 'Cow heart at the abattoir: many tissues in one slice'
      - section: 'Remember'
        say: 'Remember, a whole small animal is not always complex. Ask what level its body reaches.'
        write: 'Ask: what level does it reach?'
      - section: 'Answer'
        say: 'The organ is the highest level here, so the heart is the most complex, which is option A.'
        write: '$\therefore$ heart (organ level)'
        answer: true
    traps:
      B: 'You went for hair. A hair is a strand of dead keratin cells, not an organ, so it is not complex at all.'
      C: 'You chose Euglena. It is one cell, the lowest level on the ladder.'
      D: 'You picked Hydra. It is a whole animal, so it sounds complex, but its body is at the tissue level, with no true organs like a heart.'
  6:
    moments:
      - section: 'The question'
        say: 'This is the head of a tapeworm, which lives fixed inside the gut. Which two labelled parts hold it on to the gut lining?'
        write: 'Tapeworm scolex: organs of attachment $= ?$'
      - section: 'The structure'
        say: 'The head of a tapeworm, such as Taenia, is called the scolex. It lives fixed to the lining of the small intestine of man, pigs and cattle.'
        write: 'Scolex = head of the tapeworm (Taenia)'
      - section: 'Look at the drawing'
        say: 'Look at the top of the drawing. The dome on top is the rostellum, label one.'
        write: 'I = rostellum, the dome on top'
      - say: 'Round the base of the dome is a crown of small curved hooks. That crown is label two. The hooks dig into the gut lining.'
        write: 'II = crown of hooks → dig in'
      - say: 'Below the hooks are round cups called suckers. One faces you in the middle, and one is seen side on at each edge. The right hand one is label three. Suckers grip by suction.'
        write: 'III = sucker → grips by suction'
      - section: 'Why it holds on'
        say: 'The tapeworm must hold on tightly, or the waves of peristalsis moving food along the gut would sweep it out.'
        write: 'Must hold on, or peristalsis sweeps it away'
      - section: 'An example'
        say: 'People who eat undercooked pork suya can take in the larvae of the tapeworm, which then hook on inside the gut.'
        write: 'Undercooked pork suya → tapeworm larvae'
      - section: 'Remember'
        say: 'Remember, hooks and suckers are the anchor of the tapeworm.'
        write: 'Hooks + suckers = anchor'
      - section: 'Answer'
        say: 'So the organs of attachment are the hooks and the suckers, labels two and three, which is option A.'
        write: '$\therefore$ II (hooks) and III (sucker)'
        answer: true
    traps:
      B: 'You went for three and four. Three is a sucker, but four is the young proglottids, which only grow. They do not attach the worm.'
      C: 'You chose one and two. Two, the hooks, hold on, but one is the rostellum, the knob that carries them. It is the hooks themselves that dig in.'
      D: 'You picked one and three. Three, the sucker, holds on, but one is the rostellum, the knob that carries the hooks.'
  7:
    moments:
      - section: 'The question'
        say: 'The body of a tapeworm is a long chain of segments. Where in this drawing are the youngest ones?'
        write: 'Young proglottid $= ?$'
      - section: 'The structure'
        say: 'Each segment of a tapeworm is called a proglottid. Below the scolex comes the neck, which has no segments.'
        write: 'Body = chain of proglottids, the neck has none'
      - section: 'How it works'
        say: 'New proglottids are budded off from the neck. So the newest ones are the ones nearest the neck.'
        write: 'Neck buds off new proglottids'
      - section: 'Look at the drawing'
        say: 'Look at the bottom of the drawing. At the end of the long neck there are short, narrow bands. That is label four.'
        write: 'IV = short narrow bands at the end of the neck'
      - say: 'As they are pushed back they grow and mature. The oldest ones at the far end fill with eggs and break off in the faeces.'
        write: 'Young (near neck) → mature → old, full of eggs'
      - section: 'An example'
        say: 'This is why eating well cooked beef and pork, and using clean toilets, breaks the life cycle of the tapeworm.'
        write: 'Cook meat well, use clean toilets'
      - section: 'Remember'
        say: 'Remember, the young ones are near the head and the old ones are at the tail.'
        write: 'Young near the head, old at the tail'
      - section: 'Answer'
        say: 'So the young proglottids are at label four, which is option B.'
        write: '$\therefore$ IV'
        answer: true
    traps:
      A: 'You went for three. It is on the scolex, so it can look like part of the body, but it is a sucker, and the scolex has no proglottids.'
      C: 'You chose one. That is the rostellum at the tip of the head, which carries the hooks.'
      D: 'You picked two. That is the crown of hooks round the rostellum, not a segment.'
  8:
    moments:
      - section: 'The question'
        say: 'Here are four small water organisms. Three of them are just one cell each. Which one is made of many cells?'
        write: 'Multicellular organism $= ?$'
      - section: 'The rule'
        say: 'Multicellular means made of many cells. Unicellular means one cell that does everything alone.'
        write: 'Multi = many cells, uni = one cell'
      - section: 'The organism'
        say: 'Spirogyra is a green alga. It is a long thread of cylindrical cells joined end to end.'
        write: 'Spirogyra = filament of many cells'
      - say: 'Each cell of Spirogyra has a chloroplast wound in a spiral, which gives it its name.'
        write: 'Each cell has a spiral chloroplast'
      - say: 'Chlamydomonas, Amoeba and Euglena are each a single cell.'
        write: 'Chlamydomonas, Amoeba, Euglena → one cell each'
      - section: 'An example'
        say: 'The slimy green threads floating in a slow stream or a fish pond are often Spirogyra.'
        write: 'Slimy green threads in a fish pond'
      - section: 'Remember'
        say: 'Remember, Spirogyra has a spiral chloroplast in every cell of a chain.'
        write: 'Spirogyra: a spiral in every cell of the chain'
      - section: 'Answer'
        say: 'So the multicellular organism is Spirogyra, which is option B.'
        write: '$\therefore$ Spirogyra'
        answer: true
    traps:
      A: 'You went for Chlamydomonas. It is green like Spirogyra, but it is a single cell with two flagella.'
      C: 'You chose Amoeba. Amoeba is a single cell that does everything on its own.'
      D: 'You picked Euglena. Euglena is a single cell that swims with its flagellum.'
  9:
    moments:
      - section: 'The question'
        say: 'A moss has two generations in its life. Which one carries the sex organs?'
        write: 'Bryophyte: sex organs are on the $?$'
      - section: 'The structure'
        say: 'A bryophyte is a moss or a liverwort. The leafy green moss plant you see is the gametophyte, the generation that makes gametes.'
        write: 'Leafy moss plant = gametophyte'
      - say: 'It carries the sex organs. Antheridia make the male gametes, and archegonia make the egg.'
        write: 'Antheridia → male gametes, archegonia → egg'
      - section: 'The other generation'
        say: 'After fertilisation, the sporophyte grows out of the gametophyte as a stalk with a capsule. It makes spores, not gametes.'
        write: 'Sporophyte = stalk + capsule → spores'
      - section: 'An example'
        say: 'The soft green mosses on a wet wall in the rainy season are gametophytes.'
        write: 'Moss on a wet wall = gametophyte'
      - section: 'Remember'
        say: 'Remember, the gametophyte makes gametes and the sporophyte makes spores. The names tell you.'
        write: 'Gametophyte → gametes, sporophyte → spores'
      - section: 'Answer'
        say: 'So in bryophytes the sex organs are on the gametophyte, which is option C.'
        write: '$\therefore$ gametophyte'
        answer: true
    traps:
      A: 'You went for protonema. That is the green thread that grows from a spore. The sex organs form later, on the leafy plant.'
      B: 'You chose sporophyte. The sporophyte is the capsule on its stalk, and it makes spores, not sex organs.'
      D: 'You picked rhizoid. Rhizoids only anchor the moss and absorb water.'
  10:
    moments:
      - section: 'The question'
        say: 'Look around any Nigerian town and most of the plants you see make seeds. Why are seed plants the main plants on land?'
        write: 'Why seed plants dominate the land $= ?$'
      - section: 'The structure'
        say: 'Seed plants are the conifers and the flowering plants.'
        write: 'Seed plants = gymnosperms + flowering plants'
      - say: 'A seed holds a baby plant, the embryo, with a food store, inside a tough coat.'
        write: 'Seed = embryo + food store + tough coat'
      - section: 'How it works'
        say: 'So a seed can survive drought, and it can be carried far by wind, water or animals.'
        write: 'Survives drought, carried by wind, water, animals'
      - say: 'This efficient dispersal lets seed plants reach and settle new places. The seed waits until conditions are good, then grows.'
        write: 'Efficient dispersal → colonise new land'
      - section: 'An example'
        say: 'Birds carry mango and pawpaw seeds far from the parent tree, and new trees spring up there.'
        write: 'Birds spread mango and pawpaw seeds'
      - section: 'Remember'
        say: 'Remember, a seed is a packed lunch with a travel bag.'
        write: 'Seed = packed lunch + travel bag'
      - section: 'Answer'
        say: 'So seed plants dominate the land because of efficient seed dispersal, which is option C.'
        write: '$\therefore$ efficient seed dispersal'
        answer: true
    traps:
      A: 'You went for motile gametes. Gametes that swim need water, and that is a weakness of mosses and ferns on land, not a strength.'
      B: 'You chose photosynthesis. Seed plants do photosynthesise, but so do mosses, ferns and algae, so it cannot explain why seed plants dominate.'
      D: 'You picked availability of water. Water is not freely available on land, and seed plants do well because they need less of it.'
  11:
    moments:
      - section: 'The question'
        say: 'Arboreal is a word you meet often in ecology. Which of these four animals is arboreal?'
        write: 'Arboreal organism $= ?$'
      - section: 'The meaning'
        say: 'Arboreal means living in trees.'
        write: 'Arboreal = living in trees'
      - say: 'Many birds feed, roost and nest in trees. Their feet can grip branches.'
        write: 'Birds feed, roost and nest in trees'
      - say: 'Elephants and antelopes live and feed on the ground, and fish live in water.'
        write: 'Elephant, antelope → ground, fish → water'
      - section: 'An example'
        say: 'Weaver birds hang their nests from palm and mango trees in Nigerian villages.'
        write: 'Weaver birds nest in palm and mango trees'
      - section: 'Remember'
        say: 'Remember, arbor is Latin for tree, as in Arbor Day, the tree planting day.'
        write: 'Arbor = tree (Latin)'
      - section: 'Answer'
        say: 'So the arboreal organism is the bird, which is option D.'
        write: '$\therefore$ bird'
        answer: true
    traps:
      A: 'You went for elephant. Elephants live on the ground, and they are far too heavy for trees.'
      B: 'You chose fish. Fish live in water, which is an aquatic habitat.'
      C: 'You picked antelope. Antelopes live near trees in the savanna, but they live and feed on the ground.'
  12:
    moments:
      - section: 'The question'
        say: 'A young root is covered in fine outgrowths that drink in water and salts from the soil. What are they called?'
        write: 'Fine outgrowths of the outer layer, taking in water $= ?$'
      - section: 'Name it'
        say: 'These are the root hairs. Each one is a long, thin outgrowth of a single cell of the outer layer, the piliferous layer.'
        write: 'Root hair = outgrowth of one outer cell'
      - section: 'How it works'
        say: 'Root hairs give the root a huge surface touching the soil.'
        write: 'Huge surface in contact with soil'
      - say: 'Water enters them by osmosis, and mineral salts by active transport. Then it passes in through the cortex to the xylem in the centre.'
        write: 'Water by osmosis, salts by active transport → cortex → xylem'
      - section: 'An example'
        say: 'Pull up a young groundnut seedling gently. The fine white fuzz on the root, often holding soil, is the root hairs.'
        write: 'Groundnut seedling: white fuzz = root hairs'
      - section: 'Remember'
        say: 'Remember, the hairs on the outside drink, and the centre carries.'
        write: 'Hairs drink, centre carries'
      - section: 'Answer'
        say: 'So the outgrowths are the root hairs, which is option C.'
        write: '$\therefore$ root hairs'
        answer: true
    traps:
      A: 'You went for xylem. Xylem carries the water up the plant, but it lies in the centre of the root, not on its surface.'
      B: 'You chose phloem. Phloem carries food, and it lies in the centre too, between the arms of the xylem.'
      D: 'You picked cortex. The cortex is the wide band of packing cells just inside the outer layer, not the hairs on the surface.'
  13:
    moments:
      - section: 'The question'
        say: 'A section shows root hairs, a wide cortex, an endodermis, and a star of xylem with four arms, phloem between the arms and no pith. What organ is it, and is it from a monocot or a dicot?'
        write: 'Root hairs, wide cortex, endodermis, 4-armed xylem star, no pith $\Rightarrow ?$'
      - section: 'Root or stem'
        say: 'Root hairs grow only on roots. A root also has its xylem and phloem on different radii, in the centre.'
        write: 'Root hairs + xylem and phloem on different radii → root'
      - say: 'A stem has vascular bundles, with xylem and phloem together on the same radius.'
        write: 'Stem: xylem and phloem together in bundles'
      - section: 'Dicot or monocot'
        say: 'A dicot root has a few xylem arms, usually two to six, making a star in the centre, and no pith.'
        write: 'Dicot root: 2 to 6 xylem arms, star, no pith'
      - say: 'A monocot root has many xylem groups, often more than twelve, in a ring round a large pith.'
        write: 'Monocot root: many xylem groups round a pith'
      - section: 'An example'
        say: 'A young bean root shows the four armed star of a dicot. A maize root shows the ring of many xylem groups of a monocot.'
        write: 'Bean root: star  |  maize root: ring'
      - section: 'Remember'
        say: 'Remember, a few arms in a star with no pith means a dicot root.'
        write: 'Few arms, star, no pith = dicot root'
      - section: 'Answer'
        say: 'So the section is of a dicotyledonous root, which is option D.'
        write: '$\therefore$ dicotyledonous root'
        answer: true
    traps:
      A: 'You went for a monocot stem. A monocot stem has scattered vascular bundles and no root hairs.'
      B: 'You chose a dicot stem. A dicot stem has a ring of vascular bundles round a pith, and no root hairs.'
      C: 'You picked a monocot root. It is a root, but a monocot root has many xylem groups round a large pith, not a star of four arms.'
  14:
    moments:
      - section: 'The question'
        say: 'Here is a dental formula, the count of the teeth of an animal. Whose teeth are these? Look at the canines first.'
        write: '$i\,\dfrac{2}{1},\ c\,\dfrac{0}{0},\ pm\,\dfrac{3}{2},\ m\,\dfrac{3}{3}$'
      - section: 'How to read it'
        say: 'A dental formula gives the teeth in one half of the upper jaw over the teeth in one half of the lower jaw.'
        write: 'Upper half-jaw over lower half-jaw'
      - say: 'The letters are i for incisors, c for canines, p m for premolars and m for molars.'
        write: 'i = incisors, c = canines, pm = premolars, m = molars'
      - section: 'Read the teeth'
        say: 'The canines are zero over zero. There are no canines at all, and that leaves a gap called the diastema.'
        write: '$c\,\dfrac{0}{0}$ → no canines → a gap (diastema)'
      - say: 'The premolars are three over two and the molars three over three. That is many cheek teeth, with broad ridged surfaces for grinding plant food.'
        write: '$pm\,\dfrac{3}{2},\ m\,\dfrac{3}{3}$ → many grinders'
      - section: 'Count them'
        say: 'The top row is two plus zero plus three plus three, which is eight. The bottom row is one plus zero plus two plus three, which is six.'
        write: 'Upper $2+0+3+3 = 8$, lower $1+0+2+3 = 6$'
      - say: 'That is fourteen teeth on one side, so twenty-eight in all. This is the formula of the rabbit.'
        write: '$(8 + 6) \times 2 = 28$ teeth → rabbit'
      - section: 'An example'
        say: 'A rabbit is a herbivore. A goat or a cow also has no upper canines and no upper incisors, and grinds grass in the same way.'
        write: 'Rabbit, goat, cow: plant eaters'
      - section: 'Remember'
        say: 'Remember, no canines and big grinders mean a plant eater.'
        write: 'No canines + grinders = herbivore'
      - section: 'Answer'
        say: 'So this dental formula belongs to a herbivore, which is option D.'
        write: '$\therefore$ a herbivore'
        answer: true
    traps:
      A: 'You went for omnivore. An omnivore such as man has canines in both jaws, with i two over two and c one over one. This formula has none.'
      B: 'You chose detritus feeder. Detritus feeders such as earthworms have no teeth at all.'
      C: 'You picked carnivore. A carnivore such as a dog has large canines for tearing flesh, and here the canines are zero.'
  15:
    moments:
      - section: 'The question'
        say: 'A cow needs a heart and blood, but Amoeba lives well without them. Why?'
        write: 'Why Amoeba needs no circulatory system $= ?$'
      - section: 'The job of circulation'
        say: 'A circulatory system carries food, oxygen and wastes to and from every cell.'
        write: 'Circulation: carries food, $\ce{O2}$ and wastes'
      - section: 'How Amoeba manages'
        say: 'Amoeba is a single tiny cell. Its surface is large compared with its volume, and no part of it is far from the water outside.'
        write: 'Amoeba: large surface for a tiny volume'
      - say: 'So simple diffusion through the cell membrane brings in oxygen and lets out carbon dioxide fast enough.'
        write: '$\ce{O2}$ in, $\ce{CO2}$ out by diffusion, fast enough'
      - section: 'An example'
        say: 'A cow is huge, and its inner cells are far from the surface. Diffusion alone would be far too slow, so it needs blood and a heart.'
        write: 'Cow: inner cells far from the surface → heart + blood'
      - section: 'Remember'
        say: 'Remember, if it is small and thin, diffusion wins. If it is big and thick, it needs a pump.'
        write: 'Small → diffusion is enough. Big → a pump is needed.'
      - section: 'Answer'
        say: 'So Amoeba needs no circulatory system because diffusion is enough to move materials in it, which is option B.'
