      - section: 'The rule'
        say: 'Adaptive radiation is the spreading out of one ancestral form into many different forms, each suited to a different way of life.'
        write: 'One ancestor → many forms, many jobs'
      - section: 'The example'
        say: 'Insect mouthparts all come from the same basic set of biting parts.'
        write: 'One basic biting set'
      - say: 'They have been changed for different foods. There is biting in the cockroach, piercing and sucking in the mosquito, siphoning in the butterfly and sponging in the housefly.'
        write: 'Bite, pierce and suck, siphon, sponge'
      - say: 'The Anopheles mosquito pierces your skin to suck blood, while a cockroach in the kitchen bites and chews crumbs. They have the same origin but different jobs.'
        write: 'Anopheles pierces, cockroach chews'
      - section: 'The opposite'
        say: 'Bird and bat wings are the opposite pattern. Different origins came to do the same job. That is convergent evolution.'
        write: 'Different origins → same job = convergent'
      - section: 'Remember'
        say: 'Remember, radiation means spreading out from one centre.'
        write: 'Radiation = spreading out from one centre'
      - section: 'Answer'
        say: 'So adaptive radiation is illustrated in modified insect mouthparts, which is option A.'
        write: '$\therefore$ modified insect mouthparts'
        answer: true
    traps:
      B: 'You went for sharks and dolphins. They are distantly related animals, a fish and a mammal, that came to a similar shape. That is convergent evolution.'
      C: 'You chose bird and bat wings. They are analogous structures from convergent evolution, not one structure spreading into many.'
      D: 'You picked the appendix. The appendix is a vestigial organ, a different kind of evidence for evolution.'
