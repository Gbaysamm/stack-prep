# UTME 2015 Biology, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the Nigerian classroom way for Biology: name the
# structure or process, say what it does or how it works in simple steps, give a Nigerian
# example, give a way to remember it, and end on the answer moment that names the option.
# Where a question has a drawing, a moment says what to look at in it. Calculations and
# crosses go step by step on the board. traps gives one kind line for each wrong option.
#
#   say:    heard, not read. No symbols the voice would mangle; Latin names said plainly.
#   write:  the one line written while it is said, with LaTeX between dollar signs.
#   answer: true on the moment that gives the answer.
#
# Keyed on question number, like explanations_2015.yaml. Answers match that file.
format_version: 1
exam_year: 2015
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'Here are four animals with four ways of breathing. Which one has the simplest, most primitive system? Many students pick the slow snail, and that is the trap.'
        write: 'Most primitive respiratory system? insect, fish, snail, mouse'
      - section: 'The structure'
        say: 'An insect breathes through a tracheal system. Small holes called spiracles on the sides of its body open into air tubes called tracheae.'
        write: 'Insect: spiracles → tracheae → tracheoles → cells'
      - section: 'How it works'
        say: 'The tracheae branch into very fine tubes, the tracheoles, that reach right into the tissues. Air travels down the tubes and oxygen diffuses straight into the cells.'
        write: 'Air goes straight to the cells, by diffusion'
      - say: 'There is no lung, no gill and no blood carrying the oxygen. That makes it the simplest system of the four.'
        write: 'No lungs, no gills, no blood to carry O₂ ⇒ simplest'
      - section: 'Compare the others'
        say: 'A fish pumps water over gills full of blood. A snail has a lung in its mantle, lined with blood vessels. A mouse has lungs with millions of air sacs and a diaphragm.'
        write: 'Fish: gills + blood | Snail: mantle lung + blood | Mouse: lungs, alveoli, diaphragm'
      - section: 'An example'
        say: 'Catch a grasshopper in the grass near your house and look along its abdomen. Those tiny holes are its spiracles, and they are all it needs to breathe.'
        write: 'Grasshopper: a row of spiracles along the abdomen'
      - section: 'Remember'
        say: 'Insects pipe air in. The other three use blood to carry it.'
        write: 'Insects pipe air in; the others use blood'
      - section: 'Answer'
        say: 'So the most primitive respiratory system belongs to the insect, which is option A.'
        write: '$\therefore$ insect (tracheal system)'
        answer: true
    traps:
      B: 'You went for the fish. But gills with a rich blood supply and a water pump are more advanced than plain air tubes.'
      C: 'You chose the snail. It is a slow, simple animal, but its mantle cavity works as a lung lined with blood vessels, which is more advanced than air tubes.'
      D: 'You picked the mouse. A mammal has lungs with alveoli and a diaphragm, the most advanced system of the four.'
  2:
    moments:
      - section: 'The question'
        say: 'A plant floating on a pond has water all round it. What does such a plant no longer need much of? That is the clue.'
        write: 'An adaptation of hydrophytes in fresh water?'
      - section: 'The plant'
        say: 'Hydrophytes are plants that live in water, such as water lettuce and the water lily.'
        write: 'Hydrophyte = water plant (water lettuce, water lily)'
      - section: 'How it works'
        say: 'Water all round the plant holds up its body. It also gives the plant water and minerals through its whole surface.'
        write: 'Water supports the plant and supplies water + minerals'
      - say: 'So the plant needs little root, little xylem to carry water and little strengthening tissue. Its roots and xylem are poorly developed.'
        write: 'Little need ⇒ roots and xylem poorly developed'
      - say: 'Air spaces in its tissues, called aerenchyma, keep it afloat instead.'
        write: 'Aerenchyma (air spaces) keep it afloat'
      - section: 'An example'
        say: 'On the Lagos lagoon and on ponds you can see water lettuce floating, with only short, feathery roots hanging below.'
        write: 'Water lettuce on the Lagos lagoon: short, feathery roots'
      - section: 'Remember'
        say: 'Water does the work, so the plant saves on roots and pipes.'
        write: 'Water does the work ⇒ the plant saves on roots and pipes'
      - section: 'Answer'
        say: 'So one adaptation of hydrophytes is the poor development of roots and xylem tissues, which is option B.'
        write: '$\therefore$ poor development of roots and xylem'
        answer: true
    traps:
      A: 'You went for a waxy cuticle. That cuts water loss, which is what a desert plant, a xerophyte, needs, not a plant sitting in water.'
      C: 'You chose well developed roots and support. Those are needed on land. Water already holds up a hydrophyte.'
      D: 'You picked leaves reduced to spines. That cuts water loss in desert plants such as the cactus.'
  3:
    moments:
      - section: 'The question'
        say: 'Here are four animals. Which one breathes through its wet skin, with no special breathing organ at all?'
        write: 'Gas exchange by diffusion through a moist body surface?'
      - section: 'The organism'
        say: 'The earthworm has no lungs, no gills and no air tubes. It exchanges gases through its whole skin.'
        write: 'Earthworm: gas exchange across the whole skin'
      - section: 'How it works'
        say: 'Its skin is thin, kept moist by mucus, and full of blood capillaries.'
        write: 'Thin skin + mucus + capillaries'
      - say: 'Oxygen dissolves in the moisture and diffuses into the blood. Carbon dioxide diffuses out the same way.'
        write: 'O₂ dissolves → diffuses in;  CO₂ diffuses out'
      - section: 'An example'
        say: 'After heavy rain in the rainy season, earthworms come up out of the soil. Waterlogged soil has little air, and a dried out skin could not exchange gases at all.'
        write: 'Rainy season: worms come up from waterlogged soil'
      - section: 'Check the others'
        say: 'The grasshopper uses air tubes called tracheae. The rat and the lizard both use lungs.'
        write: 'Grasshopper: tracheae | Rat: lungs | Lizard: lungs'
      - section: 'Remember'
        say: 'Worm, wet skin, whole body breathes.'
        write: 'Worm, wet skin, whole body breathes'
      - section: 'Answer'
        say: 'So the animal that breathes through its moist body surface is the earthworm, which is option D.'
        write: '$\therefore$ earthworm'
        answer: true
    traps:
      A: 'You went for the grasshopper. Diffusion happens in its tubes too, but it breathes through spiracles and tracheae, not through its body surface.'
      B: 'You chose the rat. A rat breathes with lungs, filled and emptied by its ribs and diaphragm.'
      C: 'You picked the lizard. Its skin is dry and scaly, so it breathes with lungs.'
  4:
    moments:
      - section: 'The question'
        say: 'A weightlifter builds big muscles. Will his children be born with them? One scientist said yes. Who was it?'
        write: 'Acquired muscles passed on to the offspring: whose theory?'
      - section: 'The theory'
        say: 'Jean Baptiste Lamarck proposed the theory of use and disuse, with the inheritance of acquired characters.'
        write: 'Lamarck: use and disuse + inheritance of acquired characters'
      - section: 'How it works'
        say: 'He said a part that is used a lot grows bigger, and a part that is not used shrinks.'
        write: 'Used ⇒ grows;  unused ⇒ shrinks'
      - say: 'Then, he said, these changes are passed on to the young. So the athlete''s big muscles would appear in his children.'
        write: 'Changes passed on ⇒ the athlete''s muscles in his children'
      - section: 'What we know now'
        say: 'We now know this does not happen. Exercise changes the body, not the genes in the sex cells.'
        write: 'Exercise changes the body, not the genes'
      - section: 'An example'
        say: 'Lamarck''s famous example is the giraffe stretching its neck to reach leaves. Think too of a farmer whose arms grow strong from the hoe. His children are not born with strong arms.'
        write: 'Giraffe stretching its neck;  the farmer''s strong arms'
      - section: 'Remember'
        say: 'Remember Lamarck with the large muscles and the giraffe stretching its neck.'
        write: 'Lamarck = large muscles, long neck'
      - section: 'Answer'
        say: 'So the theory was proposed by Lamarck, which is option C.'
        write: '$\therefore$ Lamarck'
        answer: true
    traps:
      A: 'You went for Mendel. He worked out the laws of inheritance with garden peas, and did not propose this theory.'
      B: 'You chose Darwin. His theory is natural selection of variations that are already inherited, not the passing on of muscles built up in life.'
      D: 'You picked Pasteur. He worked on germs, vaccines and pasteurisation, not on evolution.'
  5:
    moments:
      - section: 'The question'
        say: 'Bacteria have chromosomes too. But where are they kept, if a bacterium has no nucleus?'
        write: 'Where are the chromosomes of Monera?'
      - section: 'The kingdom'
        say: 'Monera are the prokaryotes, which are the bacteria and the blue green algae, also called cyanobacteria.'
        write: 'Monera = prokaryotes (bacteria, cyanobacteria)'
      - section: 'The cell'
        say: 'A prokaryotic cell has no nuclear membrane, so it has no true nucleus.'
        write: 'No nuclear membrane ⇒ no true nucleus'
      - say: 'Its single circular chromosome lies free in the cytoplasm, in a region called the nucleoid.'
        write: 'One circular chromosome, free in the cytoplasm (nucleoid)'
      - section: 'An example'
        say: 'The bacteria that sour milk into nono, and the green scum on a pond, are cells like this.'
        write: 'Nono bacteria, green pond scum: no nucleus'
      - section: 'Remember'
        say: 'Pro means before, and karyon means nucleus. Prokaryotes came before the nucleus.'
        write: 'Pro = before, karyon = nucleus'
      - section: 'Answer'
        say: 'So the chromosomes of Monera are within the cytoplasm, which is option D.'
        write: '$\therefore$ cytoplasm'
        answer: true
    traps:
      A: 'You went for the nucleoplasm. That is the fluid inside a nucleus, and Monera have no nucleus.'
      B: 'You chose the nucleus. Monera are prokaryotes, so they have no true nucleus.'
      C: 'You picked the nucleolus. It sits inside a nucleus, and Monera have neither.'
  6:
    moments:
      - section: 'The question'
        say: 'Mangroves need salt water from the sea. So which vegetation zone of Nigeria touches the sea?'
        write: 'Mangrove swamp in Nigeria is found in which zone?'
      - section: 'The vegetation'
        say: 'Mangrove swamps grow where salty sea water mixes with fresh river water, on muddy coasts and in river deltas.'
        write: 'Mangroves: brackish water, muddy coasts, deltas'
      - section: 'Where in Nigeria'
        say: 'In Nigeria that is the coastal belt and the Niger Delta, in the south. That belt lies in the tropical rainforest zone.'
        write: 'Coast + Niger Delta ⇒ rainforest zone'
      - say: 'The savannas lie north of the forest, far inland. First the Guinea, then the Sudan, then the Sahel, getting drier as you go north.'
        write: 'North of the forest: Guinea → Sudan → Sahel (drier)'
      - section: 'An example'
        say: 'Around the Lagos lagoon, Warri and Port Harcourt you can see red mangroves standing on stilt roots, with breathing roots poking out of the mud.'
        write: 'Lagos lagoon, Warri, Port Harcourt: stilt roots, pneumatophores'
      - section: 'Remember'
        say: 'Mangroves need the sea, and in Nigeria the sea is next to the rainforest.'
        write: 'Mangroves need the sea; the sea is by the rainforest'
      - section: 'Answer'
        say: 'So the mangrove swamp is restricted to the tropical rainforest, which is option C.'
        write: '$\therefore$ tropical rainforest'
        answer: true
    traps:
      A: 'You went for the Sahel savanna. That is the dry far north, very far from the sea.'
      B: 'You chose the Guinea savanna. It is the zone just north of the forest, but it is inland, with no salt water for mangroves.'
      D: 'You picked the Sudan savanna. It is dry northern grassland, far from the coast.'
  7:
    moments:
      - section: 'The question'
        say: 'You eat rice, beans and palm oil. Which of these does the pancreas help to digest? Watch out for the vitamins.'
        write: 'Pancreatic enzymes digest which foods?'
      - section: 'The organ'
        say: 'The pancreas makes pancreatic juice and pours it into the duodenum, the first part of the small intestine.'
        write: 'Pancreas → pancreatic juice → duodenum'
      - section: 'The enzymes'
        say: 'The juice holds three main enzymes. Amylase works on starch, which is a carbohydrate.'
        write: 'Amylase: starch (carbohydrate) → maltose'
      - say: 'Trypsin works on protein, and lipase works on fat.'
        write: 'Trypsin: protein;  Lipase: fats → fatty acids + glycerol'
      - section: 'An example'
        say: 'So in a plate of rice, beans and palm oil, the pancreas helps digest the rice, the beans and the oil.'
        write: 'Rice (carbohydrate), beans (protein), palm oil (fat)'
      - section: 'What it does not digest'
        say: 'Vitamins and minerals are absorbed as they are, with no digestion. And no human enzyme can break down cellulose.'
        write: 'Vitamins, minerals: no digestion;  cellulose: no human enzyme'
      - section: 'Remember'
        say: 'A T L stands for amylase, trypsin and lipase, for carbohydrate, protein and fat.'
        write: 'A T L: amylase, trypsin, lipase'
      - section: 'Answer'
        say: 'So the pancreas secretes enzymes for fats, proteins and carbohydrates, which is option A.'
        write: '$\therefore$ fats, proteins and carbohydrates'
        answer: true
    traps:
      B: 'You went for B. Vitamins need no digestion, and humans make no enzyme for cellulose.'
      C: 'You chose C. Fats and carbohydrates are right, but vitamins are absorbed unchanged. The missing class is protein.'
      D: 'You picked D. Cellulose is not digested by human enzymes, and minerals need no digestion.'
  8:
    moments:
      - section: 'The question'
        say: 'Bird flu killed thousands of chickens on Nigerian farms. What kind of germ causes it?'
        write: 'The causative agent of bird flu?'
      - section: 'The disease'
        say: 'Bird flu, or avian influenza, is caused by the influenza A virus. One well known strain is called H5N1.'
        write: 'Bird flu = avian influenza, influenza A virus (H5N1)'
      - section: 'How it spreads'
        say: 'It spreads among chickens and other birds through their droppings and mucus. It can pass to people who handle sick birds.'
        write: 'Spread: droppings, mucus, handling sick birds'
      - section: 'An example'
        say: 'From two thousand and six Nigeria had outbreaks on poultry farms, and thousands of birds were killed to stop the spread.'
        write: 'Nigeria, from 2006: outbreaks on poultry farms'
      - section: 'Why it matters'
        say: 'Because it is a virus, antibiotics do not cure it. Antibiotics only work against bacteria.'
        write: 'Virus ⇒ antibiotics do not work'
      - section: 'Remember'
        say: 'Flu of any kind is caused by a virus.'
        write: 'Any flu ⇒ a virus'
      - section: 'Answer'
        say: 'So the causative agent of bird flu is a virus, which is option B.'
        write: '$\therefore$ a virus'
        answer: true
    traps:
      A: 'You went for a protozoan. Protozoa cause diseases such as malaria and sleeping sickness, not influenza.'
      C: 'You chose a bacterium. Bacteria cause cholera and typhoid, but influenza is caused by a virus.'
      D: 'You picked a fungus. Fungi cause ringworm and athlete''s foot, not influenza.'
  9:
    moments:
      - section: 'The question'
        say: 'For some plants, fertilisation needs a film of water, because the male gamete has to swim. Which plant is it?'
        write: 'A water medium is needed for fertilisation in which group?'
      - section: 'The process'
        say: 'In ferns the male gametes, called antherozoids, have flagella. They must swim to the egg, which sits in a flask called the archegonium.'
        write: 'Fern: antherozoids (flagella) swim → egg in the archegonium'
      - say: 'They can only swim in a film of water, from rain or dew, on the small heart shaped prothallus.'
        write: 'Needs a film of water on the prothallus'
      - section: 'Seed plants'
        say: 'Conifers and flowering plants carry their male gametes in pollen. A pollen tube takes them to the egg, so no water is needed.'
        write: 'Conifers, angiosperms: pollen + pollen tube ⇒ no water'
      - section: 'An example'
        say: 'That is why ferns grow in damp, shady places, such as the banks of streams in the rainforest.'
        write: 'Ferns: damp, shady stream banks'
      - section: 'Remember'
        say: 'Ferns and mosses swim. Seed plants send pollen.'
        write: 'Ferns swim; seed plants send pollen'
      - section: 'Answer'
        say: 'So a water medium is necessary for fertilisation in ferns, which is option C.'
        write: '$\therefore$ ferns'
        answer: true
    traps:
      A: 'You went for conifers. They use pollen and a pollen tube, so water is not needed.'
      B: 'You chose angiosperms. Flowering plants use pollen tubes to carry the male nuclei to the egg.'
      D: 'You picked fungi. Most fungi reproduce sexually by fusing hyphae, not by swimming gametes.'
  10:
    moments:
      - section: 'The question'
        say: 'Some traits show up far more in boys than in girls. Why? Because the gene sits on the X chromosome.'
        write: 'An example of a sex-linked trait?'
      - section: 'The idea'
        say: 'A sex linked trait is controlled by a gene on the X chromosome. So it is inherited differently in males and females.'
        write: 'Sex-linked = gene on the X chromosome'
      - section: 'The example'
        say: 'Red green colour blindness is such a trait. The faulty gene is recessive, and it sits on the X chromosome.'
        write: 'Colour blindness: recessive gene on X'
      - section: 'How it works'
        say: 'Let X big N carry normal vision and X small n carry colour blindness. A boy is XY, with only one X. If it is X small n, he is colour blind.'
        write: 'Boy: $\mathrm{X^{n}Y}$ ⇒ colour blind'
      - say: 'A girl is XX, so she needs two faulty genes to be colour blind. With X big N and X small n she sees normally and is only a carrier.'
        write: 'Girl: $\mathrm{X^{N}X^{n}}$ ⇒ carrier, normal vision'
      - say: 'One faulty X is enough in a boy. That is why more men than women are colour blind.'
        write: 'One faulty X in a boy is enough ⇒ more men colour blind'
      - section: 'An example'
        say: 'In a school eye test, a boy who cannot see the red number hidden among green dots may be colour blind.'
        write: 'Eye test: red number among green dots'
      - section: 'Remember'
        say: 'Remember the two classic sex linked traits, colour blindness and haemophilia.'
        write: 'Sex-linked: colour blindness, haemophilia'
      - section: 'Answer'
        say: 'So the sex linked trait is red green colour blindness in humans, which is option C.'
        write: '$\therefore$ red-green colour blindness'
        answer: true
    traps:
      A: 'You went for skin colour. It is controlled by several genes on ordinary chromosomes, the autosomes, so it is not sex linked.'
      B: 'You chose tongue rolling. It is taught as an autosomal trait, not a sex linked one.'
      D: 'You picked growing long hair. That depends on care and culture, and it is not inherited on the X chromosome.'
  11:
    moments:
      - section: 'The question'
        say: 'Montane vegetation needs high, cool land. Which of these states is named after its high land?'
        write: 'Montane vegetation is found in which state?'
      - section: 'The vegetation'
        say: 'Montane vegetation is the forest and grassland of high mountains and plateaus, more than about one thousand metres above sea level.'
        write: 'Montane: high land, above about 1000 m'
      - section: 'How it works'
        say: 'It is cooler up there, so the plants differ from those of the lowlands around them.'
        write: 'Cooler ⇒ different plants from the lowlands'
      - section: 'An example'
        say: 'In Nigeria the best known example is the Jos Plateau in Plateau State. It is cool enough for Irish potatoes and strawberries.'
        write: 'Jos Plateau, Plateau State: Irish potatoes, strawberries'
      - section: 'Check the others'
        say: 'Lagos is low coastal land. Enugu has hills, but they are too low. Bauchi lies mostly in the savanna.'
        write: 'Lagos: coast | Enugu: low hills | Bauchi: savanna'
      - section: 'Remember'
        say: 'Plateau State is named after its high land.'
        write: 'Plateau State = high land'
      - section: 'Answer'
        say: 'So montane vegetation can be found in Plateau State, which is option B.'
        write: '$\therefore$ Plateau'
        answer: true
    traps:
      A: 'You went for Bauchi. It lies mostly in the Sudan and Guinea savanna, below the height for montane vegetation.'
      C: 'You chose Lagos. It is low lying coastal land, with mangrove swamp and rainforest.'
      D: 'You picked Enugu. It has hills, but they are too low for montane vegetation, and its natural cover is derived savanna.'
  12:
    moments:
      - section: 'The question'
        say: 'Dolly the sheep was a clone. How many cells of the original sheep did it take to make her? That number gives this question away.'
        write: 'Which is true of cloning?'
      - section: 'The idea'
        say: 'A clone is an organism that is genetically identical to the one it came from.'
        write: 'Clone = genetically identical copy'
      - section: 'How it works'
        say: 'One body cell, or just its nucleus, is taken from the original organism. It is placed in an egg cell whose own nucleus has been removed.'
        write: 'Body cell nucleus → egg cell with its nucleus removed'
      - say: 'That egg grows into a whole new individual with exactly the same genes. Dolly came from one cell of an adult sheep.'
        write: 'Grows into a new individual with the same genes (Dolly)'
      - section: 'An example'
        say: 'In plants, one cell or a small piece of a cassava or yam plant can be grown in tissue culture into many identical plantlets.'
        write: 'Cassava, yam: tissue culture → identical plantlets'
      - section: 'Remember'
        say: 'One cell in, one identical copy out.'
        write: 'One cell in ⇒ one identical copy out'
      - section: 'Answer'
        say: 'So only one cell of the original organism is needed to start the process, which is option D.'
        write: '$\therefore$ only one cell is needed'
        answer: true
    traps:
      A: 'You went for A. Cloning, especially of humans, is still strongly debated on ethical and moral grounds, so it is not simply welcomed.'
      B: 'You chose B. It sounds right because cloning is asexual, but cloning grows a new, separate individual from one cell. It does not multiply the original''s own tissues.'
      C: 'You picked C. A clone has exactly the same genes as the original, so it is not just similar.'
  13:
    moments:
      - section: 'The question'
        say: 'A cockroach wears its skeleton on the outside, and that skeleton cannot stretch. So how does it grow?'
        write: 'Shedding the exoskeleton of an arthropod is called?'
      - section: 'The process'
        say: 'Ecdysis is moulting, the shedding of the hard exoskeleton of an arthropod.'
        write: 'Ecdysis = moulting (shedding the exoskeleton)'
      - section: 'How it works'
        say: 'The exoskeleton is made of chitin and cannot stretch. So the animal makes a new soft cuticle underneath it.'
        write: 'Chitin cannot stretch → new soft cuticle beneath'
      - say: 'Then it splits the old one and crawls out. It swells up before the new one hardens, and that is when it grows.'
        write: 'Split the old skin → crawl out → swell → harden'
      - section: 'A word to know'
        say: 'The stage between two moults is called an instar. So a young insect goes instar, moult, instar, moult.'
        write: 'Instar = the stage between two moults'
      - section: 'An example'
        say: 'You may find the empty, split skins of cockroaches, or the old shells of crabs near the lagoon. Each one is left after ecdysis.'
        write: 'Empty cockroach skins, old crab shells'
      - section: 'Remember'
        say: 'Ecdysis means exit the old skin.'
        write: 'Ecdysis = exit the old skin'
      - section: 'Answer'
        say: 'So the shedding of the exoskeleton is called ecdysis, which is option A.'
        write: '$\therefore$ ecdysis'
        answer: true
    traps:
      B: 'You went for instar formation. An instar is the stage of growth between two moults, not the shedding itself.'
      C: 'You chose metamorphosis. That is the change of body form from young to adult, such as larva to pupa to adult.'
      D: 'You picked osmosis. That is the movement of water across a membrane, not moulting.'
  14:
    moments:
      - section: 'The question'
        say: 'Constipation means hard, dry faeces that are difficult to pass. Which part of our food keeps things moving?'
        write: 'A major cause of constipation?'
      - section: 'The food'
        say: 'Roughage, or dietary fibre, is mostly cellulose from plant food. We cannot digest it.'
        write: 'Roughage = fibre (cellulose), not digested'
      - section: 'How it works'
        say: 'It adds bulk to the food in the intestine and holds water, so the faeces stay soft.'
        write: 'Adds bulk + holds water ⇒ soft faeces'
      - say: 'It also gives the gut muscles something to push on, so peristalsis moves the faeces along.'
        write: 'Bulk for peristalsis to push on'
      - section: 'An example'
        say: 'A diet of only white bread and polished rice, with few vegetables, fruits or beans, leads to constipation. Ugu, okra and fruit keep the bowel regular.'
        write: 'Little fibre ⇒ constipation;  eat ugu, okra, fruit'
      - section: 'Remember'
        say: 'Roughage keeps the bowel regular.'
        write: 'Roughage keeps the bowel regular'
      - section: 'Answer'
        say: 'So a major cause of constipation is lack of roughage, which is option A.'
        write: '$\therefore$ lack of roughage'
        answer: true
    traps:
      B: 'You went for lack of vitamin B. That causes diseases such as beriberi, not constipation.'
      C: 'You chose lack of vitamin E. That is rare, and it is not a cause of constipation.'
      D: 'You picked lack of salts. Salts matter for nerves and fluid balance, but the major cause of constipation is too little roughage.'
  15:
    moments:
      - section: 'The question'
        say: 'Something sits like a cap on top of each kidney. The name of the gland tells you where it is.'
        write: 'The organ directly on top of the kidney?'
      - section: 'The gland'
        say: 'The adrenal glands are two small endocrine glands, one on top of each kidney.'
        write: 'Adrenal glands: one on top of each kidney'
      - section: 'The name'
        say: 'Break the name. Ad means near, and renal means kidney.'
        write: 'Ad = near, renal = kidney'
      - section: 'What it does'
        say: 'They make adrenaline, the hormone that gets the body ready for fight or flight.'
        write: 'Adrenaline: fight or flight'
      - section: 'An example'
        say: 'If a dog suddenly chases you down the street, your heart races and you run fast. That is adrenaline at work.'
        write: 'Chased by a dog ⇒ heart races (adrenaline)'
      - section: 'Check the others'
        say: 'The prostate is in the pelvis, the pancreas is beside the duodenum, and the thyroid is in the neck.'
        write: 'Prostate: pelvis | Pancreas: by the duodenum | Thyroid: neck'
      - section: 'Remember'
        say: 'Adrenal on the renal, adrenaline for the alarm.'
        write: 'Adrenal on the renal'
      - section: 'Answer'
        say: 'So the organ directly on top of the kidney is the adrenal gland, which is option A.'
        write: '$\therefore$ adrenal gland'
        answer: true
