  21:
    moments:
      - section: 'The question'
        say: 'A crucible of soil goes into the oven and comes out lighter. The lost mass is the water. The trap is to forget the crucible.'
        write: 'Crucible + soil heated at 100 °C. Percentage of water $= ?$'
      - section: 'The data'
        say: 'The empty crucible is five grams. With fresh soil it is ten grams. After heating and cooling it is eight grams.'
        write: 'Crucible $= 5$ g;  crucible + fresh soil $= 10$ g;  crucible + dry soil $= 8$ g'
      - section: 'The rule'
        say: 'Heating at one hundred degrees Celsius drives off the water, so the loss in mass is the mass of water.'
        write: 'Loss in mass = mass of water'
      - say: 'The percentage of water is the mass of water over the mass of fresh soil, times one hundred.'
        write: '$\%\ \text{water} = \dfrac{\text{mass of water}}{\text{mass of fresh soil}} \times 100$'
      - section: 'The working'
        say: 'First the soil alone. Ten minus five is five grams of fresh soil.'
        write: 'Fresh soil $= 10 - 5 = 5$ g'
      - say: 'Then the water. Ten minus eight is two grams of water lost.'
        write: 'Water $= 10 - 8 = 2$ g'
      - say: 'Now the percentage. Two over five, times one hundred, is forty percent.'
        write: '$\%\ \text{water} = \dfrac{2}{5} \times 100 = 40\%$'
      - section: 'Check'
        say: 'Check. The dry soil left is eight minus five, which is three grams, or sixty percent. Forty plus sixty is one hundred. Good.'
        write: 'Dry soil $= 3$ g $= 60\%$;  $40\% + 60\% = 100\%$ ✓'
      - section: 'Answer'
        say: 'So the percentage of water in the soil is forty percent, which is option C.'
        write: '$\therefore$ 40% water'
        answer: true
    traps:
      A: 'You went for eighty percent. That is eight over ten, the last reading over the first, which is not the water at all.'
      B: 'You chose twenty percent. That divides the two grams of water by ten grams, which includes the crucible. The soil itself was only five grams.'
      D: 'You picked sixty percent. That is the dry soil left behind, not the water lost.'
