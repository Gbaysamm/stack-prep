  39:
    moments:
      - section: 'The question'
        say: 'We are given three symptoms, severe diarrhoea, dehydration and weakness. We must find the disease they point to.'
        write: 'Severe diarrhoea, dehydration, weakness $= ?$'
      - section: 'The disease'
        say: 'This is cholera, a disease of the gut caused by the bacterium Vibrio cholerae. It spreads in water and food dirtied with faeces.'
        write: 'Cholera: Vibrio cholerae, dirty water and food'
      - section: 'How it works'
        say: 'The bacteria make the gut pour out water, so the person has severe watery diarrhoea.'
        write: 'Gut pours out water → watery diarrhoea'
      - say: 'The body quickly loses water and salts. That leads to dehydration and weakness, and without treatment, death. So the treatment is to replace the water and salts.'
        write: 'Loses water and salts → dehydration, weakness'
      - section: 'The others'
        say: 'Chickenpox gives a rash of blisters. Malaria and yellow fever are spread by mosquitoes and give fever. None of them causes severe diarrhoea.'
        write: 'Chickenpox rash,  malaria, yellow fever, fever'
      - section: 'Answer'
        say: 'So severe diarrhoea, dehydration and weakness are symptoms of cholera, which is option A.'
        write: '$\therefore$ cholera'
        answer: true
    traps:
      B: 'You chose chickenpox. Chickenpox gives an itchy rash of blisters and a fever, not severe diarrhoea.'
      C: 'You picked malaria. Malaria, from the Anopheles mosquito, gives fever, chills and headache.'
      D: 'You went for yellow fever. It is spread by the Aedes mosquito and gives fever and yellow eyes, not severe diarrhoea.'
  40:
    moments:
      - section: 'The question'
        say: 'We must find a feature that all crustaceans share.'
        write: 'Common characteristic of crustaceans $= ?$'
      - section: 'The group'
        say: 'Crustaceans, such as crayfish, crabs, prawns and shrimps, are arthropods that mostly live in water.'
        write: 'Crustaceans: crayfish, crabs, prawns, shrimps'
      - section: 'Their mark'
        say: 'Their mark is two pairs of antennae on the head, one long pair and one short pair.'
        write: 'Two pairs of antennae'
      - say: 'They also have a hard shell of chitin and lime, and many pairs of jointed limbs. A crayfish has five pairs of walking legs.'
        write: 'Hard shell, jointed limbs, crayfish 5 pairs of walking legs'
      - section: 'Compare the groups'
        say: 'Insects have one pair of antennae. Spiders have no antennae and four pairs of walking legs. Centipedes have a pair of legs on each segment.'
        write: 'Insects 1 pair,  spiders 4 pairs of legs,  centipedes legs on each segment'
      - section: 'Answer'
        say: 'So a common characteristic of crustaceans is two pairs of antennae, which is option D.'
        write: '$\therefore$ two pairs of antennae'
        answer: true
    traps:
      A: 'You went for one pair of antennae. One pair is the mark of insects, such as the cockroach.'
      B: 'You chose a pair of walking legs on each segment. That describes the centipede. A crayfish has only five pairs of walking legs, and its other limbs are antennae, mouthparts and swimmerets.'
      C: 'You picked four pairs of walking legs on the cephalothorax. That is the mark of arachnids, such as spiders.'
  41:
