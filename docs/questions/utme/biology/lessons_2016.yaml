  35:
    moments:
      - section: 'The question'
        say: 'We are given four pairs of factors. We must find the pair that mostly decides the major biomes of the world.'
        write: 'Factors that mostly determine the major biomes $= ?$'
      - section: 'What a biome is'
        say: 'A biome is a large region with its own climate and its own kind of vegetation, such as rainforest, savanna or desert.'
        write: 'Biome = large region, own climate and vegetation'
      - section: 'How it is set'
        say: 'Climate is mainly temperature and rainfall. Together they decide which plants can grow, and the plants give the biome its character.'
        write: 'Climate = temperature + rainfall → vegetation → biome'
      - say: 'So from Port Harcourt to Sokoto, as the rain falls away, the rainforest gives way to Guinea savanna, then Sudan and Sahel savanna.'
        write: 'Port Harcourt → Sokoto, less rain, forest → savanna'
      - section: 'The others'
        say: 'Wind speed and air pressure vary from place to place, but they do not set the type of vegetation. So every pair with one of them is wrong.'
        write: 'Wind speed, pressure, do not set a biome'
      - section: 'Answer'
        say: 'So the major biomes are mostly determined by temperature and rainfall, which is option D.'
        write: '$\therefore$ temperature and rainfall'
        answer: true
    traps:
      A: 'You went for pressure and wind speed. Neither one decides the vegetation of a region.'
      B: 'You chose temperature and wind speed. Temperature matters, but wind speed does not set a biome.'
      C: 'You picked pressure and rainfall. Rainfall matters, but pressure does not set a biome.'
  36:
    moments:
      - section: 'The question'
        say: 'We are given strong winds, high temperature and dry, porous soil. We must find the group of plants adapted to these conditions.'
        write: 'I strong winds, II high temperature, III dry porous soil.  Plants $= ?$'
      - section: 'The conditions'
        say: 'Wind and heat dry a plant out, and dry porous soil holds little water. All three make water scarce.'
        write: 'All three ⇒ plant loses water, little to take in'
      - section: 'The plants'
        say: 'Xerophytes are plants adapted to dry places. Xero means dry.'
        write: 'Xerophytes = plants of dry places'
      - section: 'How they survive'
        say: 'They have a thick waxy cuticle, a coat on the leaf that water cannot pass through.'
        write: 'Thick waxy cuticle'
      - say: 'They have few stomata, often sunken in pits, so less water escapes through these pores.'
        write: 'Few, sunken stomata'
      - say: 'Many have leaves reduced to spines, so there is little leaf surface to lose water from. The cactus is one.'
        write: 'Leaves reduced to spines'
      - say: 'They also have deep or spreading roots to find what water there is.'
        write: 'Deep or spreading roots'
      - section: 'The others'
        say: 'Mesophytes, from meso meaning middle, grow where water is moderate. Hydrophytes, from hydro meaning water, grow in water. Thallophytes are simple plants such as algae, mostly in damp places.'
        write: 'Meso = middle,  hydro = water,  thallophytes = simple, damp'
      - section: 'Answer'
        say: 'So the plants specially adapted to these conditions are the xerophytes, which is option C.'
        write: '$\therefore$ xerophytes'
        answer: true
    traps:
      A: 'You went for thallophytes. They are simple plants such as algae, mostly in water or damp places, not plants built for hot, dry, windy land.'
      B: 'You chose mesophytes. They live where water is moderate, like most garden plants.'
      D: 'You picked hydrophytes. They are water plants, like the water lily, adapted to too much water, the opposite condition.'
  37:
    moments:
      - section: 'The question'
        say: 'We must name the microscopic plant life of a habitat, too small to see without a microscope.'
        write: 'Microscopic plant life of a habitat $= ?$'
      - section: 'Two words'
        say: 'In ecology, flora means the plant life of a place, and fauna means the animal life.'
        write: 'Flora = plants,  fauna = animals'
      - section: 'Two prefixes'
        say: 'Micro means too small to see with the eye, and macro means large enough to see.'
        write: 'Micro = tiny,  macro = large'
      - section: 'Put them together'
        say: 'Tiny plus plants gives microflora, such as the tiny algae that turn pond water green.'
        write: 'Micro + flora = microflora'
      - say: 'In the same way, microfauna are tiny animals, macroflora are large plants, and macrofauna are large animals.'
        write: 'Microfauna, macroflora, macrofauna'
      - section: 'Answer'
        say: 'So the microscopic plant life of a habitat is its microflora, which is option A.'
        write: '$\therefore$ microflora'
        answer: true
    traps:
      B: 'You went for macrofauna. That means the large animals of a place, such as goats and lizards.'
      C: 'You chose microfauna. It is microscopic too, but it means tiny animals such as Amoeba and Paramecium.'
      D: 'You picked macroflora. That means the large plants you can see with your eye, such as trees and grasses.'
  38:
