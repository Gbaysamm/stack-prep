        say: 'Morphological variation is in how the body looks, such as height, weight, skin colour and fingerprints.'
        write: 'Morphological = how the body looks'
      - say: 'Physiological variation is in how the body works, such as tongue rolling, tasting a bitter chemical called P T C, and blood groups.'
        write: 'Physiological = how the body works'
      - section: 'Sort the options'
        say: 'Fingerprints, appearance, height and weight can all be seen or measured, so they are morphological. Only tongue rolling is something the body does.'
        write: 'A, B, C morphological.  Tongue rolling physiological'
      - section: 'Answer'
        say: 'So physiological variation is shown in the ability to roll the tongue, which is option D.'
        write: '$\therefore$ ability to roll the tongue'
        answer: true
    traps:
      A: 'You went for fingerprints. Fingerprints are a visible pattern, so they show morphological variation.'
      B: 'You chose physical appearance. How a person looks is morphological variation.'
