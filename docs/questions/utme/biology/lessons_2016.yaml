      B: 'You chose inbreeding and hetero breeding. Hetero breeding is not a recognised breeding method.'
      D: 'You picked inbreeding and self breeding. Self breeding is only an extreme form of inbreeding, not a second method.'
  32:
    moments:
      - section: 'The question'
        say: 'A small single celled organism has no heart and no blood. We must find why diffusion alone is enough to move materials in it.'
        write: 'Diffusion is enough in a small unicellular organism because $?$'
      - section: 'The rule'
        say: 'The smaller an object, the larger its surface area compared with its volume. We call this its surface area to volume ratio.'
        write: 'Smaller ⇒ larger surface area : volume'
      - section: 'The rule in numbers'
        say: 'Take a cube of side one centimetre. It has six faces, each one centimetre squared, so its surface is six centimetres squared. Its volume is one times one times one, which is one centimetre cubed. Six divided by one gives a ratio of six.'
        write: 'Side 1 cm, $\dfrac{6}{1} = 6$'
      - say: 'Now a cube of side two centimetres. Each face is two times two, which is four, so six faces give twenty four. Its volume is two times two times two, which is eight. Twenty four divided by eight gives a ratio of only three. So the smaller cube has more surface for its size.'
        write: 'Side 2 cm, $\dfrac{24}{8} = 3$'
      - section: 'The cell'
        say: 'So a tiny cell like Amoeba has a large ratio, and no part of it is far from the surface. Diffusion through the surface is fast enough for every part.'
        write: 'Amoeba: large ratio, short distances → diffusion enough'
      - section: 'A large organism'
        say: 'A large animal has a small ratio. Its inner cells are far from the surface, so it needs blood and a heart to carry materials.'
        write: 'Large animal: small ratio → needs blood and a heart'
      - section: 'Answer'
        say: 'So diffusion is enough because the surface area to volume ratio is large, which is option D.'
        write: '$\therefore$ surface area to volume ratio is large'
        answer: true
    traps:
      A: 'You went for a small ratio. That states the rule backwards. A small ratio belongs to large organisms, which is why they need a transport system.'
      B: 'You chose lungs. Single celled organisms have no lungs. Gases simply cross the cell membrane.'
      C: 'You picked long distances. Long distances are found in large organisms. In a single cell the distances are short.'
  33:
    moments:
