        say: 'Selective breeding means choosing parents with useful features and mating them, to improve a crop or a breed.'
        write: 'Selective breeding: choose the best parents'
      - section: 'The first method'
        say: 'Inbreeding mates closely related individuals. It keeps a good feature pure.'
        write: 'Inbreeding: related parents, keeps a feature pure'
