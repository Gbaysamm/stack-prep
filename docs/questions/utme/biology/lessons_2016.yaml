        say: 'Osmosis is the movement of water through a selectively permeable membrane, from a dilute solution to a concentrated one.'
        write: 'Osmosis: water, dilute → concentrated, across a membrane'
      - say: 'Osmosis brings water from the soil into the root hairs.'
        write: 'Soil water → root hair by osmosis'
