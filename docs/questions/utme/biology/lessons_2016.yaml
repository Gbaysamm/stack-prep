  32:
    moments:
      - section: 'The question'
        say: 'Amoeba has no heart and no blood, yet every part of it gets food and oxygen. How can diffusion alone be enough?'
        write: 'Diffusion is enough in a small unicellular organism because $?$'
      - section: 'The rule'
        say: 'The smaller an object, the larger its surface area compared with its volume. We call this its surface area to volume ratio.'
        write: 'Smaller ⇒ larger surface area : volume'
      - section: 'Check the rule'
        say: 'Take a cube of side one centimetre. Its surface is six centimetres squared and its volume is one centimetre cubed, so the ratio is six.'
        write: 'Side 1 cm, $\dfrac{6}{1} = 6$'
      - say: 'Now a cube of side two centimetres. Its surface is twenty four and its volume is eight, so the ratio is only three. The smaller cube has more surface for its size.'
        write: 'Side 2 cm, $\dfrac{24}{8} = 3$'
      - section: 'The cell'
        say: 'So a tiny cell like Amoeba has a large ratio, and no part of it is far from the surface. Diffusion through the surface is fast enough for every part.'
        write: 'Amoeba: large ratio, short distances → diffusion enough'
      - section: 'An example'
        say: 'A goat is far too big for this. Its inner cells are far from the skin, so it needs blood and a heart to carry materials.'
        write: 'Goat: small ratio → needs blood and a heart'
      - section: 'Remember it'
        say: 'A small body has a big surface for its size and short trips. A big body has a small surface for its size and long trips.'
        write: 'Small ⇒ large ratio,  big ⇒ small ratio'
      - section: 'Answer'
        say: 'So diffusion is enough because the surface area to volume ratio is large, which is option D.'
        write: '$\therefore$ surface area to volume ratio is large'
        answer: true
    traps:
      A: 'You went for a small ratio. That states the rule backwards. A small ratio belongs to large organisms, which is why they need a transport system.'
      B: 'You chose lungs. Single celled organisms have no lungs. Gases simply cross the cell membrane.'
      C: 'You picked long distances. Long distances are found in large organisms. In a single cell the distances are short.'
