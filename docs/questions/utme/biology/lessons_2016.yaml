        write: 'Gases in leaves, some salts in roots'
      - section: 'States, not processes'
        say: 'Turgid means firm, flaccid means limp, and plasmolysed means shrunken. These are states of a cell, the results of osmosis. They do not move materials.'
        write: 'Turgid, flaccid, plasmolysed = states.  osmosis, diffusion = processes'
      - section: 'Answer'
        say: 'So the two important processes are osmosis and diffusion, which is option D.'
        write: '$\therefore$ osmosis and diffusion'
        answer: true
    traps:
      A: 'You went for flaccidity and turgidity. They are states of a cell, the results of osmosis, not ways of moving materials.'
      B: 'You chose diffusion and plasmolysis. Plasmolysis is the shrinking of a cell''s contents away from its wall when it loses water. It is a state, not a means of transport.'
      C: 'You picked plasmolysis and capillarity. Capillarity helps water rise a little in the narrow xylem, but plasmolysis is not a means of transport.'
  28:
