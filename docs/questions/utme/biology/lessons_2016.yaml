        say: 'The amphibians were the first vertebrates to leave the water and live on land. Amphi means both, so their name means a life in both water and land.'
        write: 'Amphibians = first land vertebrates'
      - section: 'How they did it'
        say: 'They came from fishes with fleshy lobed fins. They have lungs and legs, but they still need water to lay their eggs.'
        write: 'From lobe-finned fish.  Lungs and legs, eggs in water'
      - say: 'Their tadpoles live in water and breathe with gills, then grow legs and lungs and come onto land.'
        write: 'Tadpole in water → adult on land'
      - section: 'The order'
        say: 'Fishes, called Pisces, came first in water, then amphibians, then reptiles, and birds, called Aves, came later still.'
        write: 'Pisces → amphibians → reptiles → birds'
      - section: 'Answer'
        say: 'So the first vertebrates to live on land were the amphibians, which is option B.'
        write: '$\therefore$ amphibians'
        answer: true
    traps:
      A: 'You went for Pisces. Pisces are the fishes, and they live in water.'
