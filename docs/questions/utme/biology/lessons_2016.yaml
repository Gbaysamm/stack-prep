        say: 'We must find the group of organisms in which flagella and cilia are found.'
        write: 'Group with flagella and cilia $= ?$'
      - section: 'The structures'
        say: 'A flagellum is a long whip like thread. Cilia are many short hair like threads. Both beat to move the organism.'
        write: 'Flagellum = long whip,  cilia = short hairs'
      - section: 'The group'
        say: 'They are the organs of movement of protists, which are single celled organisms.'
        write: 'Protists: single-celled, move by flagella or cilia'
      - say: 'For example, Euglena swims with a flagellum.'
        write: 'Euglena, flagellum'
      - say: 'Paramecium swims with cilia covering its whole body.'
        write: 'Paramecium, cilia'
      - section: 'The others'
        say: 'The other groups are many celled animals that move with muscles. Annelids also use bristles, coelenterates use tentacles, and arthropods use jointed legs and wings.'
        write: 'Annelids bristles,  coelenterates tentacles,  arthropods legs'
      - section: 'Answer'
        say: 'So flagella and cilia are found in the protists, which is option B.'
        write: '$\therefore$ protists'
        answer: true
