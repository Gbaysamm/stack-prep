        write: 'Two children, two maize seedlings, not identical'
      - section: 'The others'
        say: 'Binary fission splits one parent into two copies, and reproduction without fertilisation gives copies too. Self pollination uses one parent, so it mixes less.'
        write: 'One parent ⇒ copies, little or no variation'
      - section: 'Remember it'
        say: 'Two parents give a new mix, and so variety.'
        write: 'Two parents ⇒ new mix ⇒ variety'
      - section: 'Answer'
        say: 'So variation occurs because zygotes are produced by cross fertilisation, which is option B.'
        write: '$\therefore$ zygotes from cross-fertilisation'
        answer: true
    traps:
      A: 'You went for self pollination. It uses one parent only, so it gives less variation than cross fertilisation.'
      C: 'You chose binary fission. It makes identical copies of one parent, so it gives no variation.'
      D: 'You picked reproduction without fertilisation. It gives offspring identical to the parent.'
