        write: 'Muturu × high-milk breed = outbreeding'
      - section: 'The others'
        say: 'Grafting joins plant parts and makes no new mix of genes, so it is not breeding. Self breeding is only an extreme form of inbreeding, and hetero breeding is not a recognised method.'
        write: 'Grafting, not breeding.  Self breeding = inbreeding'
      - section: 'Answer'
        say: 'So the useful methods of selective breeding are inbreeding and outbreeding, which is option C.'
        write: '$\therefore$ inbreeding and outbreeding'
        answer: true
    traps:
