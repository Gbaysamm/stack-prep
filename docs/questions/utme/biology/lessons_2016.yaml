# UTME 2016 Biology, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the Biology way: name the structure or process, say
# what it does or how it works in simple steps, a Nigerian example, a way to remember it, and
# the answer moment that names the option. traps gives one kind line for each wrong option.
# Questions 44 and 45 read the rice bar chart (55, 50, 60, 40 and 35 cm). Questions 46 and 47
# read the vertebra drawing (a lumbar vertebra seen from the front, I the neural canal).
#
#   say:    heard, not read. No symbols the voice would mangle; Latin names said plainly.
#   write:  the one line written while it is said, with LaTeX between dollar signs.
#   answer: true on the moment that gives the answer.
#
# Keyed on question number, like explanations_2016.yaml. Answers match that file.
format_version: 1
exam_year: 2016
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'The Agama lizard sits on a hot wall all afternoon and does not dry up. Which of its features protects it from its surroundings?'
        write: 'Protective adaptive feature of the Agama lizard $= ?$'
      - section: 'The structure'
        say: 'The Agama is a reptile, and its whole body is covered with dry, horny scales. That covering is its scaly skin.'
        write: 'Reptile, body covered with dry horny scales'
      - section: 'What it does'
        say: 'The scales do two jobs. They stop the body losing water in the hot sun, and they guard the body against cuts and knocks.'
        write: 'Scales keep water in and keep injury out'
      - section: 'The display parts'
        say: 'The crest on the neck and the fold of skin on the throat are for show. The male nods his head and puffs his throat to warn rivals and attract females.'
        write: 'Nuchal crest, gular fold, display to rivals and mates'
      - section: 'An example'
        say: 'Watch the red headed Agama basking on a compound wall in the harmattan. The air is dry, yet its scales let it stay out for hours without drying up.'
        write: 'Agama on a wall in the harmattan, scales save water'
      - section: 'Remember it'
        say: 'Think of the scales as armour that also holds water in. They cover the whole body, so they protect the whole body.'
        write: 'Scales = armour + water seal'
      - section: 'Answer'
        say: 'So the protective adaptive feature of the Agama lizard is its scaly skin, which is option C.'
        write: '$\therefore$ scaly skin'
        answer: true
    traps:
      A: 'You went for the nuchal crest. It is the ridge on the neck that the male raises in display. It does not protect the body.'
      B: 'You chose claws. Claws help the lizard grip and climb walls and trees. They are for movement, not a protective covering.'
      D: 'You picked the gular fold. That is the throat skin the male puffs out to show off to rivals and mates, not a shield.'
  2:
    moments:
      - section: 'The question'
        say: 'A mosquito drinks blood and a grasshopper chews leaves. Which feature lets each insect feed the way it does?'
        write: 'Feature that adapts an insect for feeding $= ?$'
      - section: 'The structure'
        say: 'Insects feed with their mouthparts. These are the jaws and lips around the mouth.'
        write: 'Mouthparts = jaws and lips around the mouth'
      - section: 'How they work'
        say: 'The mouthparts are shaped for the food. The grasshopper and the cockroach have biting and chewing jaws.'
        write: 'Grasshopper, cockroach, biting and chewing'
      - say: 'The mosquito has piercing and sucking mouthparts, and the butterfly sucks nectar through a long coiled tube called the proboscis.'
        write: 'Mosquito, piercing and sucking.  Butterfly, sucking proboscis'
      - section: 'An example'
        say: 'The female Anopheles mosquito pierces your skin at night and sucks blood with needle like mouthparts. That is how she passes on malaria.'
        write: 'Anopheles pierces skin, sucks blood, spreads malaria'
      - section: 'Remember it'
        say: 'The mouth is for feeding, the antennae are for sensing, and the legs are for moving.'
        write: 'Mouth = feed,  antennae = sense,  legs = move'
      - section: 'Answer'
        say: 'So the feature that adapts an insect for feeding is suitable mouthparts, which is option A.'
        write: '$\therefore$ suitable mouthparts'
        answer: true
    traps:
      B: 'You went for paired antennae. Antennae are sense organs for touch and smell. They help find food, but they do not take it in.'
      C: 'You chose a segmented body. Every insect has one, whatever it eats, so it is not a feeding adaptation.'
      D: 'You picked jointed appendages. They are mainly legs for walking, a feature of all arthropods, not the parts that take in food.'
  3:
    moments:
      - section: 'The question'
        say: 'Two parents, both big Y small y, are crossed. What offspring do they give? Three options look alike, so we will work it out on the board.'
        write: 'Cross Yy × Yy, offspring $= ?$'
      - section: 'The data'
        say: 'Each parent has one big Y and one small y. We call such a parent heterozygous, which means its two alleles differ.'
        write: 'Parents: Yy (heterozygous) × Yy (heterozygous)'
      - section: 'The rule'
        say: 'Each gamete gets only one allele. So each parent makes two kinds of gamete, big Y and small y, in equal numbers.'
        write: 'Gametes: Y, y  and  Y, y'
      - section: 'The working'
        say: 'Now fuse every gamete of one parent with every gamete of the other. Big Y with big Y gives big Y big Y.'
        write: 'Y × Y → YY'
      - say: 'Big Y with small y gives big Y small y. And small y with big Y gives big Y small y again.'
        write: 'Y × y → Yy,   y × Y → Yy'
      - say: 'Small y with small y gives small y small y.'
        write: 'y × y → yy'
      - section: 'Count them'
        say: 'So we have one big Y big Y, two big Y small y, and one small y small y. That is a ratio of one to two to one.'
        write: 'Offspring: 1 YY : 2 Yy : 1 yy'
      - section: 'Check'
        say: 'Check. There are four boxes, and one plus two plus one is four. Good. If big Y is dominant, three of the four look the same, the familiar three to one.'
        write: '$1 + 2 + 1 = 4$ ✓   (3 dominant : 1 recessive)'
      - section: 'Remember it'
        say: 'Two mixed parents always give one, two, one. The two always sits in the middle, on the mixed type.'
        write: 'Yy × Yy ⇒ 1 : 2 : 1, the 2 on Yy'
      - section: 'Answer'
        say: 'So the cross gives one big Y big Y, two big Y small y and one small y small y, which is option C.'
        write: '$\therefore$ YY : 2Yy : yy'
        answer: true
    traps:
      A: 'You went for A. It leaves out big Y big Y, but that must appear whenever both parents give big Y.'
      B: 'You chose B. It puts the two on big Y big Y, but only one box in four gets big Y from both parents.'
      D: 'You picked D. It puts the two on small y small y, but only one box in four gets small y from both parents.'
  4:
    moments:
      - section: 'The question'
        say: 'Three of these move carbon around in nature. One of them belongs to a different cycle. Which one?'
        write: 'NOT part of the carbon cycle $= ?$'
      - section: 'The process'
        say: 'The carbon cycle is the movement of carbon between the air, as carbon four oxide, and living things.'
        write: 'Carbon cycle: air ($\ce{CO2}$) ⇄ living things'
      - section: 'How it works'
        say: 'Photosynthesis takes carbon four oxide out of the air and locks it into plants as organic carbon, such as sugar and starch.'
        write: 'Photosynthesis: $\ce{CO2}$ → organic carbon'
      - say: 'Respiration, decomposition and burning then return the carbon to the air as carbon four oxide.'
        write: 'Respiration, decomposition, burning → $\ce{CO2}$'
      - section: 'An example'
        say: 'When the leaves of a mango tree fall and rot, decomposers break down their organic carbon and send carbon four oxide back to the air.'
        write: 'Rotting mango leaves → $\ce{CO2}$ back to the air'
      - section: 'The odd one out'
        say: 'Nitrate formation, also called nitrification, moves nitrogen, not carbon. It belongs to the nitrogen cycle.'
        write: 'Nitrate formation → nitrogen cycle'
      - section: 'Remember it'
        say: 'If the word starts with nitr, it is the nitrogen cycle.'
        write: 'Nitr... ⇒ nitrogen cycle'
      - section: 'Answer'
        say: 'So the one that is not part of the carbon cycle is nitrate formation, which is option C.'
        write: '$\therefore$ nitrate formation'
        answer: true
    traps:
      A: 'You went for organic carbon. The carbon in sugar, starch and every living body is a store in the carbon cycle.'
      B: 'You chose decomposition. When dead things rot, their carbon goes back to the air as carbon four oxide, so it is part of the cycle.'
      D: 'You picked photosynthesis. It is the step that takes carbon four oxide out of the air, so it is very much part of the cycle.'
  5:
    moments:
      - section: 'The question'
        say: 'Pick a leaf from a cassava plant. Is it a cell, a tissue, an organ or a system?'
        write: 'Level of organisation of a leaf $= ?$'
      - section: 'The levels'
        say: 'Living things are built in levels. Cells make tissues, tissues make organs, and organs make systems.'
        write: 'Cell → tissue → organ → system'
      - section: 'What an organ is'
        say: 'An organ is a structure made of several different tissues working together for one job.'
        write: 'Organ = several tissues, one job'
      - section: 'The leaf'
        say: 'A leaf has the epidermis, the palisade and spongy layers, and the xylem and phloem. They are all tissues, and they work together to make food.'
        write: 'Leaf: epidermis, palisade, spongy layer, xylem, phloem'
      - say: 'Many tissues work together for one job. So the leaf is an organ, and organs are number four in the list.'
        write: 'Leaf = organ = IV'
      - section: 'An example'
        say: 'A cassava leaf or a mango leaf is one organ of the plant. The leaves, the stem and the buds together make up its shoot system.'
        write: 'Cassava leaf = organ.  Leaves + stem = shoot system'
      - section: 'Remember it'
        say: 'Ask how many kinds of tissue it holds. Many kinds for one job means an organ.'
        write: 'Many tissues + one job ⇒ organ'
      - section: 'Answer'
        say: 'So the leaf is at the level of the organ, number four, which is option A.'
        write: '$\therefore$ IV, organ'
        answer: true
    traps:
      B: 'You went for tissue. A tissue is one group of similar cells, but a leaf is made of many different tissues.'
      C: 'You chose cell. A cell is the smallest level, and a leaf has millions of cells of many kinds.'
      D: 'You picked system. A system is several organs working together, such as the whole shoot system, and the leaf is just one of them.'
  6:
    moments:
      - section: 'The question'
        say: 'Your cells burn glucose to release energy. But in what form do they keep that energy ready for use?'
        write: 'Energy in cellular respiration is stored as $?$'
      - section: 'The process'
        say: 'Cellular respiration breaks down glucose, and the energy set free is trapped in a molecule called adenosine triphosphate, or A T P.'
        write: 'Glucose → energy → ATP (adenosine triphosphate)'
      - section: 'How it works'
        say: 'A T P is made from A D P, adenosine diphosphate, by adding a third phosphate. Respiration supplies the energy for that.'
        write: '$\text{ADP} + \text{phosphate} + \text{energy} \to \text{ATP}$'
      - say: 'When the cell needs energy, A T P gives up its third phosphate and becomes A D P again, releasing the stored energy.'
        write: '$\text{ATP} \to \text{ADP} + \text{phosphate} + \text{energy}$'
      - section: 'An example'
        say: 'When you run to catch a danfo, your leg muscles spend A T P made in their mitochondria.'
        write: 'Running for a danfo, muscles spend ATP'
      - section: 'Remember it'
        say: 'A T P is the cell''s money. Tri means three phosphates, and the energy is held by the third one.'
        write: 'ATP = energy money,  tri = 3 phosphates'
      - section: 'Answer'
        say: 'So in cellular respiration the energy is stored as adenosine triphosphate, which is option D.'
        write: '$\therefore$ adenosine triphosphate (ATP)'
        answer: true
    traps:
      A: 'You went for heat energy. Heat is energy lost from the cell, not energy kept for use.'
      B: 'You chose adenosine diphosphate. A D P is what is left after A T P has given up its energy, so it is the spent form.'
      C: 'You picked adenosine monophosphate. It has only one phosphate and holds little usable energy.'
  7:
    moments:
      - section: 'The question'
        say: 'A green plant makes its own food. Which part of it is the main food factory?'
        write: 'Principal organ of food making in autotrophs $= ?$'
      - section: 'The process'
        say: 'An autotroph makes its own food by photosynthesis, from carbon four oxide and water, using sunlight.'
        write: 'Autotroph: makes food by photosynthesis'
      - section: 'What it needs'
        say: 'Photosynthesis needs chlorophyll, light, carbon four oxide and water.'
        write: 'Needs chlorophyll, light, $\ce{CO2}$, water'
      - section: 'The organ'
        say: 'The green leaf has them all. It is packed with chloroplasts, it is broad and flat to catch light, and it has stomata to take in gas.'
        write: 'Green leaf: chloroplasts, broad surface, stomata'
      - section: 'An example'
        say: 'The broad green leaves of cassava and yam are their kitchens. The food made there is carried down and stored in the tubers.'
        write: 'Cassava and yam leaves make food, tubers store it'
      - section: 'Remember it'
        say: 'Green means chlorophyll, and chlorophyll means food making.'
        write: 'Green ⇒ chlorophyll ⇒ food'
      - section: 'Answer'
        say: 'So the principal organ for making food in autotrophy is the green leaf, which is option D.'
        write: '$\therefore$ green leaf'
        answer: true
    traps:
      A: 'You went for the root hair. Root hairs take in water and mineral salts, but they have no chlorophyll, so they make no food.'
      B: 'You chose the growing root. It is underground with no chlorophyll, so it cannot photosynthesise.'
      C: 'You picked the mature fruit. A ripe fruit stores food made by the leaves. It does not make it.'
  8:
    moments:
      - section: 'The question'
        say: 'Some people in places far from the sea once had a big swelling in the neck. Which disease comes from too little iodine?'
        write: 'Disease from lack of iodine $= ?$'
      - section: 'What iodine does'
        say: 'The thyroid gland in the neck uses iodine to make the hormone thyroxine.'
        write: 'Thyroid gland + iodine → thyroxine'
      - section: 'How the disease comes'
        say: 'Without enough iodine, the thyroid grows bigger as it tries to make more thyroxine. That swelling in the neck is goitre.'
        write: 'No iodine → thyroid swells → goitre'
      - section: 'An example'
        say: 'Goitre used to be common in parts of Nigeria far from the sea. Today the salt we buy has iodine added, and that prevents it.'
        write: 'Iodised salt prevents goitre'
      - section: 'Remember it'
        say: 'Iodine, thyroid and goitre all meet in the neck.'
        write: 'Iodine, thyroid, goitre, all in the neck'
      - section: 'The others'
        say: 'The other three are deficiency diseases too, but of vitamins. Beriberi is vitamin B one, scurvy is vitamin C, and rickets is vitamin D.'
        write: 'Beriberi B₁,  scurvy C,  rickets D'
      - section: 'Answer'
        say: 'So the disease that results from lack of iodine is goitre, which is option D.'
        write: '$\therefore$ goitre'
        answer: true
    traps:
      A: 'You went for beriberi. It is a deficiency disease, but it comes from lack of vitamin B one, not iodine.'
      B: 'You chose scurvy. Scurvy, with bleeding gums, comes from lack of vitamin C.'
      C: 'You picked rickets. Rickets, with soft bent bones, comes from lack of vitamin D or calcium.'
  9:
    moments:
      - section: 'The question'
        say: 'Some organisms carry features that suit a place, and they take over there. What is the name of that process?'
        write: 'Organisms with favourable features get established $= ?$'
      - section: 'The process'
        say: 'This is natural selection. Organisms with favourable features survive, breed and become established, while the less fit die out.'
        write: 'Natural selection: the fit survive and breed'
      - section: 'How it works'
        say: 'In each generation more young are born than can survive, so they compete.'
        write: 'More young than can survive → competition'
      - say: 'Those best suited to the area live longer, have more young, and pass their features on. Over time the favourable features spread.'
        write: 'Best suited survive → pass features on'
      - section: 'An example'
        say: 'In the dry Sudan savanna, grasses with deep roots survive the harmattan and spread, while shallow rooted ones die out.'
        write: 'Deep-rooted grasses survive the harmattan'
      - section: 'Remember it'
        say: 'Remember Darwin''s phrase, survival of the fittest.'
        write: 'Survival of the fittest'
      - section: 'Answer'
        say: 'So the process by which organisms with favourable features get established is natural selection, which is option D.'
        write: '$\therefore$ natural selection'
        answer: true
    traps:
      A: 'You went for gene mutation. Mutation makes new features, but it does not decide which ones become established.'
      B: 'You chose dispersal. Dispersal carries organisms to a new area, but whether they become established there is decided by selection.'
      C: 'You picked overcrowding. Overcrowding causes competition, but it is not the process by which the favoured ones become established.'
  10:
    moments:
      - section: 'The question'
        say: 'At the beach the water creeps up the sand and then goes back, twice a day. What do we call this rise and fall?'
        write: 'Daily rise and fall of ocean water $= ?$'
      - section: 'The name'
        say: 'The regular rise and fall of sea level is called the tide.'
        write: 'Rise and fall of sea level = tide'
      - section: 'How it works'
        say: 'The tide is caused mainly by the pull of the moon, and a little by the sun, on the oceans.'
        write: 'Cause: pull of the moon (and sun)'
      - say: 'There are about two high tides and two low tides each day.'
        write: 'About 2 high and 2 low tides a day'
      - section: 'An example'
        say: 'On the Lagos coast, the shore between high and low tide is covered and uncovered each day, and the crabs and snails there must survive both.'
        write: 'Lagos shore, covered and uncovered each day'
      - section: 'Remember it'
        say: 'Tide and time come and go on schedule. Gravity is the cause, and the tide is the name.'
        write: 'Gravity = cause,  tide = the name'
      - section: 'Answer'
        say: 'So the rise and fall of ocean water during the day is the tide, which is option C.'
        write: '$\therefore$ tide'
        answer: true
    traps:
      A: 'You went for gravity. Gravity causes the tide, but it is not the name for the rise and fall itself.'
      B: 'You chose a pull. A pull is a force, not the movement of the water.'
      D: 'You picked zone. A zone is a region of the shore, such as the zone between the tides, not the movement of water.'
  11:
    moments:
      - section: 'The question'
        say: 'There are four names, all Latin. Which one makes food in the water and so feeds everything else there?'
        write: 'Producer in an aquatic habitat $= ?$'
      - section: 'What a producer is'
        say: 'A producer is a green organism that makes its own food by photosynthesis. In water, the producers are algae and water plants.'
        write: 'Producer = green, makes its own food'
      - section: 'The organism'
        say: 'Nymphaea is the water lily. Its broad green leaves float on the surface to catch the light and make food.'
        write: 'Nymphaea = water lily, green leaves float'
      - section: 'The others'
        say: 'Dryopteris is a fern, but it lives on land. The planarian is a flatworm, and Simulium is the blackfly. Both are animals, so both are consumers.'
        write: 'Dryopteris land fern,  planarian and Simulium consumers'
      - section: 'An example'
        say: 'Water lilies grow in ponds and slow streams across Nigeria, and fish and snails feed on them.'
        write: 'Water lily in a pond, eaten by fish and snails'
      - section: 'Remember it'
        say: 'A producer for a water habitat must be green and must live in the water. Nymphaea is both.'
        write: 'Green + lives in water ⇒ aquatic producer'
      - section: 'Answer'
        say: 'So the producer in an aquatic habitat is Nymphaea, which is option A.'
        write: '$\therefore$ Nymphaea'
        answer: true
    traps:
      B: 'You chose Dryopteris. It is a green fern, but it grows on land in damp shady places, so it is not a producer of an aquatic habitat.'
      C: 'You picked the planarian. It lives in water, but it is a flatworm that feeds on other animals, so it is a consumer.'
      D: 'You went for Simulium. That is the blackfly. Its larvae live in streams, but they feed on tiny particles, so they are consumers.'
  12:
    moments:
      - section: 'The question'
        say: 'A small fish rides on a big shark, and the shark does not seem to mind. What kind of relationship is that?'
        write: 'Relationship between a shark and a remora $= ?$'
      - section: 'The relationship'
        say: 'This is commensalism. One partner benefits, and the other is neither helped nor harmed.'
        write: 'Commensalism: one gains, other unaffected'
      - section: 'How it works'
        say: 'The remora sticks to the shark with a sucker on top of its head. It gets free transport, protection and scraps of the shark''s food.'
        write: 'Remora gains transport, protection, scraps'
      - say: 'The shark loses nothing and gains nothing. So only one partner benefits.'
        write: 'Shark neither helped nor harmed'
      - section: 'An example'
        say: 'Nearer home, the white cattle egret walks beside cows in the field and catches the insects they disturb. The cow is not affected.'
        write: 'Cattle egret beside cows, commensalism'
      - section: 'Remember it'
        say: 'Commensal means sharing the table. One eats, and the host is not hurt.'
        write: 'Commensal = sharing the table'
      - section: 'Answer'
        say: 'So the relationship between a shark and a remora is commensalism, which is option B.'
        write: '$\therefore$ commensalism'
        answer: true
    traps:
      A: 'You went for parasitism. In parasitism the host is harmed, and the shark is not harmed by the remora.'
      C: 'You picked saprophytism. That is feeding on dead, decaying matter, and neither the shark nor the remora does that.'
      D: 'You chose symbiosis. Symbiosis needs both partners to benefit, but here only the remora gains.'
  13:
    moments:
      - section: 'The question'
        say: 'Four levels are numbered out of order. Can we put them from the simplest to the most complex?'
        write: 'I Tissue, II System, III Cell, IV Organ.  Increasing complexity $= ?$'
      - section: 'The rule'
        say: 'From the simplest to the most complex, the levels go cell, then tissue, then organ, then system.'
        write: 'Cell → tissue → organ → system'
      - section: 'How it builds'
        say: 'Cells of one kind form a tissue. Tissues form an organ. Organs working together form a system.'
        write: 'Cells → tissue → organ → system'
      - section: 'Match the numbers'
        say: 'Now match each level to its number. Cell is three, tissue is one, organ is four and system is two.'
        write: 'Cell III,  tissue I,  organ IV,  system II'
      - say: 'So the order is three, one, four, two.'
        write: 'III → I → IV → II'
      - section: 'An example'
        say: 'In a goat, muscle cells form muscle tissue, tissues form the stomach, and the stomach and intestines form the digestive system.'
        write: 'Goat: muscle cell → muscle tissue → stomach → digestive system'
      - section: 'Remember it'
        say: 'Remember C T O S, which is cell, tissue, organ, system.'
        write: 'C T O S'
      - section: 'Answer'
        say: 'So the order of increasing complexity is three, one, four, two, which is option D.'
        write: '$\therefore$ III–I–IV–II'
        answer: true
    traps:
      A: 'You went for four, two, three. It starts with organ, the wrong end, and it leaves out tissue altogether.'
      B: 'You chose one, two, three, four. That simply counts the numbers, and it puts system before cell and organ.'
      C: 'You picked four, three, one, two. It starts with organ, which is more complex than cell and tissue.'
  14:
    moments:
      - section: 'The question'
        say: 'Three of these can pass from parents to children in the genes. One is caught from outside. Which one?'
        write: 'NOT an inheritable disease $= ?$'
      - section: 'The idea'
        say: 'An inheritable disease is passed from parents to children in their genes.'
        write: 'Inheritable = passed on in the genes'
      - section: 'The odd one out'
        say: 'Poliomyelitis, or polio, is caused by the polio virus. It spreads through food and water dirtied with faeces, so it is infectious, not inherited.'
        write: 'Polio: caused by a virus, infectious'
      - section: 'The others'
        say: 'Sickle cell anaemia and haemophilia are carried on genes. Some mental illnesses also run in families.'
        write: 'Sickle-cell, haemophilia, some mental illness, genes'
      - section: 'An example'
        say: 'Polio vaccine drops given to Nigerian children protect them from the virus. No vaccine can stop a gene being passed on.'
        write: 'Polio drops protect children, a vaccine cannot stop a gene'
      - section: 'Remember it'
        say: 'If a germ causes it and a vaccine prevents it, it is not inherited.'
        write: 'Germ + vaccine ⇒ not inherited'
      - section: 'Answer'
        say: 'So the disease that is not inheritable is poliomyelitis, which is option A.'
        write: '$\therefore$ poliomyelitis'
        answer: true
    traps:
      B: 'You chose sickle cell anaemia. It is inherited through the sickle cell gene, which is why couples check their genotype before marriage.'
      C: 'You picked mental illness. Some mental illnesses run in families and are partly inherited.'
      D: 'You went for haemophilia. It is a sex linked inherited disease, passed on the X chromosome.'
  15:
    moments:
      - section: 'The question'
        say: 'Look at the tips of your fingers. The lines make patterns. Which pattern do most people have?'
        write: 'Commonest fingerprint type $= ?$'
      - section: 'The patterns'
        say: 'Fingerprints have three main patterns, which are loops, whorls and arches.'
        write: 'Loops, whorls, arches'
      - section: 'What each looks like'
        say: 'In a loop, the lines curve round and come back out on the same side. In a whorl they go round in circles. In an arch they rise like a small hill.'
        write: 'Loop curves back,  whorl circles,  arch a hill'
      - section: 'How common'
        say: 'Loops are the commonest, about sixty to sixty five out of every hundred fingerprints. Whorls are about thirty, and arches only about five.'
        write: 'Loops ≈ 60–65%,  whorls ≈ 30%,  arches ≈ 5%'
      - section: 'An example'
        say: 'Check your own ten fingers in class. Most of them will probably show loops.'
        write: 'Your ten fingers, mostly loops'
      - section: 'Remember it'
        say: 'Loops are many, whorls are fewer and arches are rare.'
        write: 'Loops lots, Whorls fewer, Arches rare'
      - section: 'Answer'
        say: 'So the fingerprint type that occurs most often is the loop, which is option D.'
        write: '$\therefore$ loop'
        answer: true
    traps:
