        write: 'Backbone erect,  cerebrum voluntary,  hormones development'
      - section: 'Answer'
        say: 'So the function of the spinal cord is to transmit impulses to the brain, which is option C.'
        write: '$\therefore$ transmit impulses to the brain'
        answer: true
