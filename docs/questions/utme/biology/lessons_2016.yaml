  43:
    moments:
      - section: 'The question'
        say: 'We must find the step of photosynthesis during which oxygen is set free.'
        write: 'In photosynthesis, oxygen is liberated during $?$'
      - section: 'The stages'
        say: 'Photosynthesis has a light stage and a dark stage.'
        write: 'Light stage, then dark stage'
      - section: 'The step'
        say: 'In the light stage, light energy trapped by chlorophyll splits water into hydrogen and oxygen. This splitting is called photolysis, from photo meaning light and lysis meaning splitting.'
        write: '$\ce{2H2O ->[light] 4H + O2}$'
      - section: 'What happens next'
        say: 'The hydrogen is used in the dark stage to make sugar from carbon four oxide. The oxygen is given off.'
        write: 'H → sugar (dark stage),  $\ce{O2}$ given off'
      - section: 'The others'
        say: 'So the oxygen comes from water, not from carbon four oxide. Conversion of energy describes the whole process, and glycolysis is a stage of respiration.'
        write: 'Oxygen from water, not $\ce{CO2}$'
      - section: 'Answer'
        say: 'So in photosynthesis oxygen is liberated during photolysis, which is option B.'
        write: '$\therefore$ photolysis'
        answer: true
    traps:
      A: 'You went for conversion of energy. That describes the whole process, not the step that releases oxygen.'
      C: 'You chose splitting of carbon four oxide. The oxygen given off comes from water. The carbon four oxide goes into the sugar.'
      D: 'You picked glycolysis. Glycolysis is the first stage of respiration, not of photosynthesis.'
  44:
    moments:
      - section: 'The question'
        say: 'The bar chart shows how tall the rice grew in each of five years. We must find the total height over all the years.'
        write: 'Total height of rice over the years $= ?$'
      - section: 'Read the chart'
        say: 'Look at the chart. Height in centimetres goes up the side, with grid lines every five centimetres, and the five years go along the bottom.'
        write: 'Up: height (cm), lines every 5 cm.  Along: years 1 to 5'
      - section: 'The data'
        say: 'Read the top of each bar against the grid. Year one is fifty five, year two is fifty, and year three, the tallest bar, is sixty.'
        write: 'Year 1 = 55 cm,  year 2 = 50 cm,  year 3 = 60 cm'
      - say: 'Year four is forty, and year five, the shortest bar, is thirty five. Every bar ends exactly on a grid line.'
        write: 'Year 4 = 40 cm,  year 5 = 35 cm'
      - section: 'The rule'
        say: 'The total is the sum of all the readings.'
        write: 'Total = sum of the readings'
      - section: 'The working'
        say: 'Fifty five plus fifty is one hundred and five. Add sixty to get one hundred and sixty five.'
        write: '$55 + 50 = 105$,  $105 + 60 = 165$'
      - say: 'Add forty to get two hundred and five. Add thirty five to get two hundred and forty centimetres.'
        write: '$165 + 40 = 205$,  $205 + 35 = 240$ cm'
      - section: 'Answer'
        say: 'So the total height of rice is two hundred and forty centimetres, which is option A.'
        write: '$\therefore$ total $= 240$ cm'
        answer: true
    traps:
      B: 'You chose two hundred and thirty nine. That misreads one bar by a centimetre, but every bar ends exactly on a grid line.'
      C: 'You picked three hundred and forty. That is one hundred too many. Five bars that are all sixty or less cannot pass three hundred.'
      D: 'You went for three hundred and thirty nine. That is one hundred too many and misreads a bar as well.'
  45:
    moments:
      - section: 'The question'
        say: 'This is the same bar chart of rice heights. This time we must find the average height over the five years.'
        write: 'Average height of rice $= ?$'
      - section: 'The data'
        say: 'From the chart the five heights are fifty five, fifty, sixty, forty and thirty five centimetres, and their total is two hundred and forty.'
        write: '55, 50, 60, 40, 35 cm.  Total = 240 cm'
      - section: 'The rule'
        say: 'The average, or mean, is the total divided by the number of readings.'
        write: 'Mean $= \dfrac{\text{total}}{\text{number of readings}}$'
      - section: 'The working'
        say: 'There are five years, so we divide two hundred and forty by five.'
        write: 'Mean $= \dfrac{240}{5}$'
      - say: 'Two hundred and forty divided by five is forty eight centimetres.'
        write: 'Mean $= 48$ cm'
      - section: 'Answer'
        say: 'So the average height of rice is forty eight centimetres, which is option C.'
        write: '$\therefore$ mean $= 48$ cm'
        answer: true
