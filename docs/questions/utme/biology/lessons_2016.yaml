      A: 'You went for sixty eight. That is three hundred and forty divided by five, from a total one hundred too big. It is also taller than the tallest bar, sixty, so it cannot be the average.'
      B: 'You chose forty seven point eight. That comes from a total of two hundred and thirty nine, which misreads one bar.'
      D: 'You picked sixty seven point eight. That is three hundred and thirty nine divided by five, from a wrong total. It is taller than the tallest bar too, so it cannot be the average.'
  46:
    moments:
      - section: 'The question'
        say: 'The diagram shows a single vertebra, a bone of the backbone, seen from the front. We must find which type of vertebra it is.'
        write: 'Type of vertebra in the diagram $= ?$'
      - section: 'Look at the drawing'
        say: 'At the bottom is a broad, rounded block of bone. That is the centrum, big enough to carry heavy weight.'
        write: 'Broad centrum, carries weight'
      - say: 'From each side of the centrum a long process runs downward and outward. These are very long transverse processes.'
        write: 'Very long transverse processes, down and out'
      - say: 'At the top is a tall neural spine, with a knobbed process on each side of it, and a short spine sits under the centrum.'
        write: 'Tall neural spine, knobs beside it, short spine below'
      - section: 'What the parts do'
        say: 'The lower back, called the lumbar region, carries the weight of the whole upper body, and strong back muscles fix onto those long side processes. A big centrum and long transverse processes mark a lumbar vertebra.'
        write: 'Lower back: heavy load, big muscles'
      - section: 'The others'
        say: 'The atlas has no centrum, the axis has a peg pointing forward, and the sacrum is several vertebrae fused into one bone. None of these fits a single vertebra with a big centrum.'
        write: 'Atlas no centrum,  axis peg,  sacrum fused'
      - section: 'Answer'
        say: 'So the vertebra in the diagram is a lumbar vertebra, which is option B.'
        write: '$\therefore$ lumbar vertebra'
        answer: true
    traps:
      A: 'You went for the atlas. The atlas is a ring of bone with no centrum and wide flat wings. This drawing has a big solid centrum.'
      C: 'You chose the axis. The axis has a peg pointing forward and a flat blade like spine, and neither is in this drawing.'
      D: 'You picked the sacrum. Sacral vertebrae are fused together into one bone joined to the hip, but this is a single vertebra.'
  47:
