        write: 'Dog: incisors top and bottom, long canines, slicing cheek teeth'
      - section: 'The dog''s formula'
        say: 'The dog has three over three incisors, one over one canine, four over four premolars and two over three molars.'
        write: '$\text{I}\,\frac{3}{3},\ \text{C}\,\frac{1}{1},\ \text{pm}\,\frac{4}{4},\ \text{m}\,\frac{2}{3}$'
      - section: 'Check'
        say: 'Check. One side has three plus one plus four plus two, which is ten upper teeth, and three plus one plus four plus three, which is eleven lower teeth.'
        write: 'Upper $3+1+4+2 = 10$,  lower $3+1+4+3 = 11$'
      - say: 'Ten plus eleven is twenty one for one side. Doubling gives forty two teeth, the dog''s full set.'
        write: '$2 \times 21 = 42$ teeth ✓'
      - section: 'An example'
        say: 'Look at a goat chewing. It has no top front teeth, only a hard pad. A dog, which bites meat, must have top incisors.'
        write: 'Goat: no upper incisors.  Dog: upper incisors'
      - section: 'Answer'
        say: 'So the dental formula of the dog is three over three, one over one, four over four, two over three, which is option D.'
        write: '$\therefore$ I 3/3, C 1/1, pm 4/4, m 2/3'
        answer: true
    traps:
      A: 'You went for A. Its zero over three means no upper incisors, which is the mark of a grazer like the goat, not a carnivore.'
      B: 'You chose B. It has no upper incisors, which a dog needs for nipping meat, and four lower molars where the dog has three.'
      C: 'You picked C. It gives two canines in each upper half jaw, but a mammal has at most one canine in each half jaw.'
