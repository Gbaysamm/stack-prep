      A: 'You went for annelids. Annelids, such as the earthworm, move with muscles and tiny bristles called chaetae.'
      C: 'You chose coelenterates. Coelenterates, such as Hydra, move with their tentacles and body muscles.'
      D: 'You picked arthropods. Arthropods move with jointed legs and wings, not flagella and cilia.'
  42:
