  24:
    moments:
      - section: 'The question'
        say: 'We must find which of these characters is sex-linked.'
        write: 'A sex-linked character $= ?$'
      - section: 'The idea'
        say: 'A sex-linked character is controlled by a gene carried on the X chromosome.'
        write: 'Sex-linked = gene on the X chromosome'
      - section: 'Boys and girls'
        say: 'A gene comes in different forms called alleles, here a normal one and a faulty one. A man has one X and one Y, and the Y carries no copy of this gene. So one faulty allele on his X shows at once.'
        write: 'Man XY, one faulty X shows'
      - say: 'A woman has two X chromosomes. A normal allele on the other X usually hides the faulty one, so she is a carrier.'
        write: 'Woman XX, usually a carrier'
      - section: 'The cross'
        say: 'Let big N be normal vision and small n colour blindness. Cross a carrier mother, X big N X small n, with a normal father, X big N Y.'
        write: 'XᴺXⁿ × XᴺY'
      - say: 'The mother gives X big N or X small n. The father gives X big N or Y.'
        write: 'Gametes, Xᴺ, Xⁿ  and  Xᴺ, Y'
      - say: 'The children are X big N X big N, X big N X small n, X big N Y and X small n Y.'
        write: 'XᴺXᴺ, XᴺXⁿ, XᴺY, XⁿY'
      - say: 'So no daughter is colour blind, but half the sons are, even though the father sees normally. Colour blindness is sex-linked, and so is haemophilia.'
        write: 'Daughters normal, half the sons colour blind'
      - section: 'The others'
        say: 'Dwarfism is controlled by genes on ordinary chromosomes, called autosomes, not on the X chromosome.'
        write: 'Dwarfism, autosomal'
      - say: 'Albinism is inherited too, but its gene is on an autosome, so it shows equally in boys and girls.'
        write: 'Albinism, autosomal'
      - say: 'Tongue rolling is also an autosomal trait.'
        write: 'Tongue rolling, autosomal'
      - section: 'Answer'
        say: 'So the sex-linked character is colour blindness, which is option D.'
        write: '$\therefore$ colour blindness'
        answer: true
    traps:
      A: 'You went for dwarfism. Dwarfism is controlled by genes on ordinary chromosomes, called autosomes, not on the X chromosome.'
      B: 'You chose albinism. Albinism is inherited, but its gene is on an autosome, so it shows equally in boys and girls.'
      C: 'You picked tongue rolling. Tongue rolling is an autosomal trait, not a sex-linked one.'
  25:
    moments:
