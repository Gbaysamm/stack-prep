        write: 'Structural adaptation = a part built for the job'
      - section: 'The flytrap'
        say: 'The leaf of the Venus flytrap is changed into a trap. It has two hinged lobes, trigger hairs inside, and stiff teeth on the edges.'
        write: 'Leaf = two hinged lobes, trigger hairs, teeth'
      - section: 'How it works'
        say: 'When an insect touches the trigger hairs, the lobes snap shut. Then the leaf digests the insect.'
