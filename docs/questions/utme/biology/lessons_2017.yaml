  17:
    moments:
      - section: 'The question'
        say: 'We must find the simplest form of reproduction.'
        write: 'Simplest form of reproduction $= ?$'
      - section: 'The process'
        say: 'Binary fission is the splitting of one cell into two equal daughter cells.'
        write: 'Binary fission, one cell $\to$ two'
      - section: 'How it works'
        say: 'First the nucleus divides into two. Then the cytoplasm divides, and there are two new cells.'
        write: 'Nucleus divides, then cytoplasm divides'
      - say: 'No partner, no gamete and no special structure is needed. That is why it is the simplest.'
        write: 'No partner, no gamete, no special part'
      - section: 'The others'
        say: 'Conjugation needs two cells to join and swap nuclear material.'
        write: 'Conjugation, two cells join'
      - say: 'In budding the parent must first grow an outgrowth that then breaks off, as in yeast and Hydra.'
        write: 'Budding, an outgrowth breaks off'
      - say: 'Spore formation needs a special spore case called a sporangium, as in Rhizopus.'
        write: 'Spore formation, needs a sporangium'
      - section: 'Answer'
        say: 'So the simplest form of reproduction is binary fission, which is option D.'
        write: '$\therefore$ binary fission'
        answer: true
    traps:
      A: 'You went for conjugation. Conjugation needs two cells to join and swap nuclear material, so it is more complex.'
      B: 'You chose budding. Budding is simple too, but the parent must first grow an outgrowth that then breaks off, as in yeast and Hydra.'
      C: 'You picked spore formation. It needs a special spore case called a sporangium, as in Rhizopus.'
  18:
