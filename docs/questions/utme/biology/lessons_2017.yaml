        write: '$400 \div 50 = 8$ per throw, $8 \div 1.6 = 5$ ✓'
      - say: 'The fifteen square metres of the habitat is not needed for density. It would only give the total number, about five times fifteen, which is seventy-five plants.'
        write: 'Habitat total $\approx 5 \times 15 = 75$ plants'
