# UTME 2017 Biology, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the Biology way: name the structure or process, say
# what it does or how it works in simple steps, a Nigerian example, a way to remember it, and
# the answer moment that names the option. traps gives one kind line for each wrong option.
# Questions 7 and 19 read the four excretory organs (I flame cell, II kidney, III nephridium,
# IV Malpighian tubules). Questions 32 and 37 read the fish gill (I arch, II rakers,
# III filaments). Question 36 reads the four bird heads (a) to (d).
#
#   say:    heard, not read. No symbols the voice would mangle; Latin names said plainly.
#   write:  the one line written while it is said, with LaTeX between dollar signs.
#   answer: true on the moment that gives the answer.
#
# Keyed on question number, like explanations_2017.yaml. Answers match that file.
format_version: 1
exam_year: 2017
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'Here are four insects, but only one of them feeds by stabbing a needle into you at night. Which one has piercing and sucking mouthparts?'
        write: 'Piercing and sucking mouthparts are found in $?$'
      - section: 'The mouthparts'
        say: 'Piercing and sucking mouthparts form a long thin tube called the proboscis. It holds fine needles called stylets.'
        write: 'Proboscis with sharp stylets'
      - section: 'How they work'
        say: 'The female mosquito pushes her stylets through the skin and finds a tiny blood vessel. Then she sucks up the blood like a drink through a straw.'
        write: 'Stylets pierce the skin, then blood is sucked up'
      - say: 'She needs that blood to make her eggs. So it is the female mosquito that bites.'
        write: 'Female needs blood for her eggs'
      - section: 'An example'
        say: 'For example, this is how the Anopheles mosquito passes the malaria parasite, Plasmodium, to people sleeping in Nigerian homes at night. That is why we sleep under treated nets.'
        write: 'Anopheles bite passes Plasmodium, malaria'
      - section: 'The others'
        say: 'Grasshoppers, termites and cockroaches all eat solid food. They bite and chew with strong jaws called mandibles.'
        write: 'Grasshopper, termite, cockroach = biting and chewing'
      - section: 'Remember it'
        say: 'The mosquito is a flying syringe. It pierces and it sucks.'
        write: 'Mosquito = flying syringe'
      - section: 'Answer'
        say: 'So piercing and sucking mouthparts are found in mosquitoes, which is option B.'
        write: '$\therefore$ mosquitoes'
        answer: true
    traps:
      A: 'You went for the grasshopper. It has biting and chewing mouthparts for cutting up leaves, not a needle.'
      C: 'You chose termites. They chew wood and dead plant matter with strong mandibles, so they bite and chew.'
      D: 'You picked the cockroach. It has biting and chewing mouthparts and eats almost anything solid.'
  2:
    moments:
      - section: 'The question'
        say: 'Plants have hormones that speed growth up and others that slow it down. Which pair speeds it up?'
        write: 'Hormones that promote plant growth $= ?$'
      - section: 'Plant hormones'
        say: 'Plant hormones are growth substances. They are made in tiny amounts and control how the plant grows.'
        write: 'Plant hormones control growth'
      - section: 'The growers'
        say: 'Auxins make the cells behind the shoot tip grow longer, and they make the shoot bend towards light.'
        write: 'Auxins, cells lengthen, shoot bends to light'
      - say: 'Gibberellins make stems grow tall and help seeds to germinate.'
        write: 'Gibberellins, tall stems, germination'
      - section: 'The slowers'
        say: 'Now the hormones that slow growth down. Ethylene is a gas that ripens fruit and makes leaves fall.'
        write: 'Ethylene, ripens fruit, leaves fall'
      - say: 'Abscisic acid closes the stomata and keeps buds and seeds asleep, which we call dormant.'
        write: 'Abscisic acid, closes stomata, keeps seeds dormant'
      - say: 'So ethylene and abscisic acid slow growth down. They are not the growers we want.'
        write: 'Ethylene and abscisic acid slow growth'
      - section: 'An example'
        say: 'For example, put unripe plantain in a closed bag with one ripe plantain, and the whole bunch ripens fast. This happens because the ripe one gives off ethylene gas.'
        write: 'Ripe plantain gives off ethylene'
      - section: 'Remember it'
        say: 'A and G make it grow. A for auxins and G for gibberellins.'
        write: 'A + G = Grow'
      - section: 'Answer'
        say: 'So the hormones that promote plant growth are auxins and gibberellins, which is option B.'
        write: '$\therefore$ auxins and gibberellins'
        answer: true
    traps:
      A: 'You went for ethylene and auxins. Auxins do promote growth, but ethylene ripens fruit and makes leaves fall.'
      C: 'You chose cytokinins and abscisic acid. Cytokinins do help cells divide, but abscisic acid holds growth back and keeps seeds dormant.'
      D: 'You picked ethylene and gibberellins. Gibberellins promote growth, but ethylene is a ripening and ageing hormone.'
  3:
    moments:
      - section: 'The question'
        say: 'Four pairs of living things live close together. In only one pair does one partner feed on the other and harm it. Which pair?'
        write: 'Parasitic association $= ?$'
      - section: 'The association'
        say: 'This is parasitism. The parasite lives on or in another living thing, called the host, and feeds on it.'
        write: 'Parasitism, parasite feeds on the host'
      - say: 'The parasite gains, and the host is harmed.'
        write: 'Parasite gains, host loses'
      - section: 'The tsetse fly'
        say: 'The tsetse fly sucks the blood of cattle. The cow loses blood, and the fly may also give it trypanosomes, tiny parasites that cause the cattle sleeping sickness called nagana. So the fly gains and the cow is harmed.'
        write: 'Tsetse fly sucks cattle blood, passes trypanosomes'
      - section: 'An example'
        say: 'For example, Fulani herders in the Guinea savanna keep their cattle away from the shady river valleys where tsetse flies live, because the flies would feed on them and make them sick.'
        write: 'Herders avoid tsetse river valleys'
      - section: 'Remember it'
        say: 'In parasitism one gains and one loses. Ask who is harmed. If nobody is harmed, it is not parasitism.'
        write: 'One gains, one loses'
      - section: 'Answer'
        say: 'So the pair that shows a parasitic association is the tsetse fly and cattle, which is option D.'
        write: '$\therefore$ tsetse fly and cattle'
        answer: true
    traps:
      A: 'You went for insect and plant. That names no one association. A bee pollinating a flower helps both, and a grasshopper eating leaves is a plant eater, not a parasite living on its host.'
      B: 'You chose cattle and egret. The egret eats the insects that grazing cattle stir up, and the cattle are not harmed.'
      C: 'You picked shark and remora. The remora rides on the shark and eats its scraps without harming it. That is commensalism.'
  4:
    moments:
      - section: 'The question'
        say: 'Arid land is hot and very dry. Every animal in the right group must survive there, not just one. Which group passes?'
        write: 'Animals that withstand arid land $= ?$'
      - section: 'Arid land'
        say: 'In arid land there is little water and great heat. So the animals must save water and stand the heat.'
        write: 'Arid = little water, great heat'
      - section: 'Check group A'
        say: 'Let us check group A one animal at a time. The locust has a waterproof, waxy cuticle, so little water evaporates from its body. It passes out uric acid, a nearly dry waste, so little water leaves with its droppings.'
        write: 'Locust, waterproof cuticle, dry uric acid'
      - say: 'The camel makes very little urine, and its body can lose a lot of water safely.'
        write: 'Camel, very little urine'
      - say: 'The lizard and the snake have dry, scaly skin that holds water in, and they also pass out uric acid.'
        write: 'Lizard, snake, dry scales, uric acid'
      - say: 'So all four animals in group A save water and stand the heat. Not one of them needs damp surroundings.'
        write: 'Group A, all four save water ✓'
      - section: 'An example'
        say: 'For example, animals like these live in the far north of Nigeria, near Lake Chad and the Sahel, where the harmattan dries everything.'
        write: 'Far north, Sahel, harmattan'
      - section: 'Remember it'
        say: 'They need dry skin, dry waste and good water saving. One damp lover spoils the whole group.'
        write: 'Dry skin, dry waste, one damp lover fails the group'
      - section: 'Answer'
        say: 'So the group that can withstand arid land is locust, camel, lizard and snake, which is option A.'
        write: '$\therefore$ locust, camel, lizard and snake'
        answer: true
    traps:
      B: 'You went for the group with the earthworm. The earthworm breathes through a moist skin and dies quickly in dry soil.'
      C: 'You chose the group with the snail. The snail loses water through its moist body and needs damp places.'
      D: 'You picked the group with the lungfish and the duck. Both depend on rivers and swamps, so they cannot live in arid land.'
  5:
    moments:
      - section: 'The question'
        say: 'Some joints swing, some turn, and one kind never moves at all. Where is the suture joint?'
        write: 'A suture joint is found in the $?$'
      - section: 'The joint'
        say: 'A suture is an immovable joint, also called a fixed joint. The bones are locked together by wavy edges and tough fibres.'
        write: 'Suture = immovable (fixed) joint'
      - section: 'Where it is'
        say: 'The bones of the cranium meet at sutures. So the skull becomes one strong box that protects the brain.'
        write: 'Cranium bones joined by sutures, box for the brain'
      - section: 'An example'
        say: 'For example, in a newborn baby the sutures are not yet closed. The soft spot on top of the baby''s head is where they meet.'
        write: 'Baby''s soft spot, sutures not yet closed'
      - section: 'The others'
        say: 'The hip, the ankle and the elbow are different. They are movable joints, called synovial joints, so none of them can be a suture.'
        write: 'Hip, ankle, elbow = movable (synovial)'
      - section: 'Remember it'
        say: 'Suture means stitch, like the stitch line a tailor sews. The skull is stitched together.'
        write: 'Suture = stitch, the skull is stitched'
      - section: 'Answer'
        say: 'So a suture joint is found in the skull, which is option C.'
        write: '$\therefore$ the skull'
        answer: true
    traps:
      A: 'You went for the hip. The hip is a ball and socket joint that moves freely in many directions.'
      B: 'You chose the ankle. The ankle moves, letting the foot bend up and down.'
      D: 'You picked the elbow. The elbow is a hinge joint that bends and straightens the arm.'
  6:
    moments:
      - section: 'The question'
        say: 'Paramecium is one tiny cell living in fresh water, and water keeps rushing into it. What stops it from bursting?'
        write: 'Osmoregulation in Paramecium $= ?$'
      - section: 'The process'
        say: 'Osmoregulation is the control of the water and salt content of the body.'
        write: 'Osmoregulation = control of water and salts'
      - section: 'The problem'
        say: 'Osmosis is the movement of water through a membrane, from a weaker solution into a stronger, saltier one.'
        write: 'Osmosis, water moves into the saltier side'
      - say: 'The cytoplasm of Paramecium is saltier than the pond water around it. So water keeps entering the cell by osmosis.'
        write: 'Water enters Paramecium by osmosis'
      - section: 'The organelle'
        say: 'The contractile vacuole collects the extra water and swells. Then it contracts and pushes the water out through the cell membrane.'
        write: 'Contractile vacuole fills, then squeezes water out'
      - section: 'An example'
        say: 'For example, without it, a Paramecium in a pond or a stream would swell up and burst.'
        write: 'No vacuole, the cell bursts'
      - section: 'Remember it'
        say: 'The contractile vacuole is the cell''s water pump. And it is an organelle, so it sits inside one cell.'
        write: 'Contractile vacuole = water pump'
      - section: 'Answer'
        say: 'So the organelle for osmoregulation in Paramecium is the contractile vacuole, which is option C.'
        write: '$\therefore$ the contractile vacuole'
        answer: true
    traps:
      A: 'You went for the flame cell. Flame cells are excretory cells of flatworms such as Planaria, not part of a one celled protozoan.'
      B: 'You chose the nephridium. Nephridia are the excretory organs of earthworms.'
      D: 'You picked the Malpighian tubule. Malpighian tubules are the excretory organs of insects.'
  7:
    moments:
      - section: 'The question'
        say: 'Look at the four drawings, numbered one to four. Each is the excretory organ of a different animal. Which one belongs to the earthworm?'
        write: 'Excretory organ of an earthworm $= ?$'
      - section: 'Read the drawing'
        say: 'Drawing one is a single cell with a tuft of cilia inside, shaped like a candle flame. That is a flame cell.'
        write: 'I = flame cell (flatworm)'
      - say: 'Drawing two is bean shaped, with striped pyramids and a tube at its notch. That is a kidney, found in vertebrates.'
        write: 'II = kidney (vertebrate)'
      - say: 'Drawing four shows thin tubes joined to a gut. Those are Malpighian tubules, found in insects.'
        write: 'IV = Malpighian tubules (insect)'
      - say: 'Now look at drawing three. It has a small funnel fringed with cilia, a long coiled tube, and a little bladder at the end.'
        write: 'III = funnel, coiled tube, bladder'
      - section: 'The organ'
        say: 'That is the nephridium. The earthworm has a pair of them in almost every segment.'
        write: 'Nephridium, a pair in nearly every segment'
      - section: 'How it works'
        say: 'The ciliated funnel draws in fluid from the body cavity. Useful substances go back into the blood along the coiled tube, and the waste leaves through a pore on the skin.'
        write: 'Funnel takes fluid, tube takes back useful parts, pore lets waste out'
      - section: 'An example'
        say: 'For example, earthworms in damp garden soil after the rains get rid of a watery urine this way. They live in wet soil, so they can afford to lose water.'
        write: 'Damp soil, watery urine'
      - section: 'Remember it'
        say: 'N for nephridium and N for nearly every segment. A funnel and a coiled tube mean a worm.'
        write: 'Funnel + coil = worm'
      - section: 'Answer'
        say: 'So the excretory organ of an earthworm is drawing three, which is option C.'
        write: '$\therefore$ III, the nephridium'
        answer: true
    traps:
      A: 'You went for four. Drawing four shows Malpighian tubules, thin blind tubes joined to the gut of an insect such as the cockroach.'
      B: 'You chose one. Drawing one is a flame cell with a beating tuft of cilia, found in flatworms such as Planaria and the tapeworm.'
      D: 'You picked two. Drawing two is a kidney cut open, the excretory organ of vertebrates such as the goat.'
  8:
    moments:
      - section: 'The question'
        say: 'A child cuts a finger, and soon the bleeding stops by itself. Which part of the blood starts that?'
        write: 'Platelets are responsible for $?$'
      - section: 'The structure'
        say: 'Platelets, also called thrombocytes, are tiny pieces of cells floating in the blood.'
        write: 'Platelets (thrombocytes) = cell fragments'
      - section: 'How clotting starts'
        say: 'At a cut, platelets break open and release an enzyme called thrombokinase.'
        write: 'Platelets at the cut release thrombokinase'
      - say: 'Thrombokinase helps turn prothrombin, a protein in the plasma, into thrombin.'
        write: 'Prothrombin $\to$ thrombin'
      - say: 'Thrombin then turns fibrinogen, another plasma protein, into long fibrin threads.'
        write: 'Fibrinogen $\to$ fibrin threads'
      - say: 'The fibrin threads make a net that traps blood cells. That net is the clot.'
        write: 'Fibrin net traps cells = clot'
      - section: 'An example'
        say: 'For example, when a child cuts a finger on a broken bottle, the bleeding soon stops, because the platelets start a clot.'
        write: 'Cut finger, bleeding stops'
      - section: 'Remember it'
        say: 'Platelets plug the leak.'
        write: 'Platelets plug'
      - section: 'Answer'
        say: 'So platelets are responsible for initiating clotting, which is option B.'
        write: '$\therefore$ initiating clotting'
        answer: true
    traps:
      A: 'You went for transporting oxygen. That is the job of the red blood cells, using haemoglobin.'
      C: 'You chose removing carbon four oxide. Most of it is carried in the plasma as hydrogencarbonate ions, not by platelets.'
      D: 'You picked destroying micro-organisms. That is the job of the white blood cells.'
  9:
    moments:
      - section: 'The question'
        say: 'Travel from Lagos to Sokoto and the plants change from thick forest to open grass. What causes that change most?'
        write: 'Main factor deciding vegetation type $= ?$'
      - section: 'Vegetation zones'
        say: 'Vegetation zones are the main kinds of plant cover in a region, such as rainforest, savanna and desert.'
        write: 'Vegetation zones, rainforest, savanna, desert'
      - section: 'What decides them'
        say: 'In the tropics it is warm all year. So what changes from place to place is the amount of rain, and how long the rainy season lasts.'
        write: 'Tropics warm all year, rain varies'
      - section: 'An example'
        say: 'For example, look at Nigeria from south to north. The south has heavy rain, and so it has rainforest.'
        write: 'South, heavy rain, rainforest'
      - say: 'The middle belt has less rain, and so it has Guinea savanna, grassland with scattered trees.'
        write: 'Middle belt, less rain, Guinea savanna'
      - say: 'The dry north has the least rain, and so it has Sudan and Sahel savanna, with short grass and few trees.'
        write: 'North, least rain, Sudan and Sahel savanna'
      - section: 'Remember it'
        say: 'From Lagos to Sokoto, the rain falls and so do the trees.'
        write: 'Less rain, fewer trees'
      - section: 'Answer'
        say: 'So the most important factor that determines vegetation type is rainfall, which is option D.'
        write: '$\therefore$ rainfall'
        answer: true
    traps:
      A: 'You went for light. Light is plentiful all over the tropics, so it does not separate the vegetation belts.'
      B: 'You chose wind. Wind can bend or dry single plants, but it does not decide the main vegetation type.'
      C: 'You picked temperature. Temperature matters on high mountains, but across Nigeria it changes far less than rainfall does.'
  10:
    moments:
      - section: 'The question'
        say: 'The leaf is already white after the alcohol. So why do we still dip it in hot water before adding iodine?'
        write: 'Why dip the decolourised leaf in hot water $?$'
      - section: 'The starch test'
        say: 'The starch test has four steps. Boil the leaf in water, boil it in alcohol, dip it in hot water, then add iodine solution.'
        write: 'Water $\to$ alcohol $\to$ hot water $\to$ iodine'
      - section: 'Step by step'
        say: 'Boiling in water kills the cells and breaks their membranes, so the iodine can get in later.'
        write: '1. Boil in water, kills the cells'
      - say: 'Boiling in alcohol removes the green chlorophyll. But it also takes the water out, and the leaf becomes hard and brittle.'
        write: '2. Alcohol removes chlorophyll, leaf goes brittle'
      - say: 'Dipping it in hot water softens the leaf again. Now it can be spread flat and the iodine can soak in.'
        write: '3. Hot water softens it'
      - say: 'Last, iodine solution is added. It turns blue black where there is starch.'
        write: '4. Iodine, blue black means starch'
      - section: 'An example'
        say: 'For example, try it with a cassava or hibiscus leaf in the school laboratory. Straight out of the alcohol, the leaf cracks if you bend it.'
        write: 'Leaf from the alcohol cracks when bent'
      - section: 'Remember it'
        say: 'Water kills, alcohol bleaches, hot water softens and iodine tests.'
        write: 'Kill, bleach, soften, test'
      - section: 'Answer'
        say: 'So the decolourised leaf is dipped in hot water to soften it, which is option C.'
        write: '$\therefore$ to soften the leaf'
        answer: true
    traps:
      A: 'You went for detect the starch. That is the job of the iodine solution, which turns blue black where starch is.'
      B: 'You chose kill the leaf. The leaf was already killed by the first boiling in water, before the alcohol.'
      D: 'You picked remove the chlorophyll. The alcohol already did that, which is why the leaf is decolourised.'
  11:
    moments:
      - section: 'The question'
        say: 'A small fish rides stuck to a shark. The remora gains a lot, but what does the shark gain or lose? That decides the name.'
        write: 'Remora and shark relationship $= ?$'
      - section: 'The remora'
        say: 'The remora has a sucker on top of its head. It sticks itself to the shark.'
        write: 'Remora sticks on with a head sucker'
      - section: 'Who gains'
        say: 'The remora gets a free ride, protection and scraps from the shark''s meals. The shark is neither helped nor harmed.'
        write: 'Remora gains, shark unaffected'
      - section: 'The association'
        say: 'When one partner gains and the other is not affected, the association is called commensalism.'
        write: 'Commensalism = one gains, other unaffected'
      - section: 'An example'
        say: 'For example, here in Nigeria the cattle egret walks beside a grazing cow and eats the insects it disturbs. The egret gains and the cow is not harmed, so this is commensalism too.'
        write: 'Cattle egret beside a cow'
      - section: 'Remember it'
        say: 'Commensal means eating at the same table. The guest shares the meal without hurting the host.'
        write: 'Com + mensa = same table'
      - section: 'Answer'
        say: 'So the remora and the shark are best described as commensalism, which is option D.'
        write: '$\therefore$ commensalism'
        answer: true
    traps:
      A: 'You went for parasitism. The remora does not feed on the shark or harm it.'
      B: 'You chose amensalism. In amensalism one partner is harmed and the other is unaffected, but nobody is harmed here.'
      C: 'You picked mutualism. Mutualism needs both partners to gain, and the shark gets nothing.'
  12:
    moments:
      - section: 'The question'
        say: 'A pond, a stream and a big lake look very different. What do all freshwater habitats share?'
        write: 'Major feature of a freshwater habitat $= ?$'
      - section: 'The habitat'
        say: 'Fresh water is found in rivers, streams, lakes and ponds. Its salt content, called salinity, is very low.'
        write: 'Fresh water = low salinity'
      - section: 'Why it matters'
        say: 'Low salinity sets it apart from sea water. And because their bodies are saltier than the water around them, its living things must cope with water entering their bodies by osmosis.'
        write: 'Water enters freshwater organisms by osmosis'
      - section: 'An example'
        say: 'For example, the River Niger and Kainji Lake are fresh water, with very little salt.'
        write: 'River Niger, Kainji Lake, fresh'
      - say: 'But the Lagos lagoon is brackish, which means slightly salty, because sea water mixes into it.'
        write: 'Lagos lagoon, brackish (slightly salty)'
      - section: 'Remember it'
        say: 'Fresh means not salty.'
        write: 'Fresh = not salty'
      - section: 'Answer'
        say: 'So the major characteristic of a freshwater habitat is low salinity, which is option C.'
        write: '$\therefore$ low salinity'
        answer: true
    traps:
      A: 'You went for high turbidity. Some rivers are muddy, but many ponds and lakes are clear, so turbidity is not shared by all.'
      B: 'You chose high density. Sea water, with its dissolved salts, is denser than fresh water.'
      D: 'You picked high current. Only rivers and streams flow fast, and ponds and lakes hardly move.'
  13:
    moments:
      - section: 'The question'
        say: 'Here are four bacteria, and each causes a different gut disease. Which one causes cholera?'
        write: 'Causative organism of cholera $= ?$'
      - section: 'The organism'
        say: 'Cholera is caused by the bacterium Vibrio cholerae. It is a small rod bent like a comma.'
        write: 'Vibrio cholerae, comma-shaped'
      - section: 'How it works'
        say: 'It spreads in water or food dirtied by the faeces of a sick person. In the gut it gives out a poison, a toxin.'
        write: 'Faecal water or food, toxin in the gut'
      - say: 'The toxin causes severe watery diarrhoea, and the body loses water very fast.'
        write: 'Watery diarrhoea, fast dehydration'
      - section: 'An example'
        say: 'For example, outbreaks happen in Nigeria when wells and streams are polluted in the rainy season. Boiled water and oral rehydration salts save lives.'
        write: 'Boil water, give O.R.S.'
      - section: 'Remember it'
        say: 'Vibrio is the vicious comma that empties the gut.'
        write: 'Vibrio = vicious comma'
      - section: 'Answer'
        say: 'So the causative organism of cholera is Vibrio, which is option C.'
        write: '$\therefore$ Vibrio'
        answer: true
    traps:
      A: 'You went for Clostridium. Clostridium causes tetanus and botulism, not cholera.'
      B: 'You chose Shigella. Shigella causes bacillary dysentery.'
      D: 'You picked Salmonella typhi. It causes typhoid fever, another disease spread by dirty water, but not cholera.'
  14:
    moments:
      - section: 'The question'
        say: 'Photosynthesis has two stages, a light stage and a dark stage. Which change happens in the dark stage?'
        write: 'Process in the dark stage of photosynthesis $= ?$'
      - section: 'The light stage'
        say: 'In the light stage, light splits water. This is photolysis. It gives oxygen, hydrogen and energy stored as A T P, the energy carrier of the cell.'
        write: 'Light stage, $\ce{H2O}$ split, gives $\ce{O2}$, H and ATP'
      - section: 'The dark stage'
        say: 'In the dark stage, the hydrogen from the light stage is added to carbon four oxide. This builds sugar.'
        write: 'Dark stage, H added to $\ce{CO2}$, makes sugar'
      - section: 'The rule'
        say: 'Adding hydrogen to a substance is reduction. So carbon four oxide is reduced to sugar.'
        write: 'Adding hydrogen = reduction'
      - say: 'Here is the whole change written out as one equation. Carbon four oxide and water go in, and sugar and oxygen come out.'
        write: '$\ce{6CO2 + 6H2O ->[light][chlorophyll] C6H12O6 + 6O2}$'
      - section: 'An example'
        say: 'For example, the leaves of a mango tree reduce carbon four oxide to sugar, using the energy caught in the light stage.'
        write: 'Mango leaf, $\ce{CO2}$ reduced to sugar'
      - section: 'Remember it'
        say: 'Light splits water, and dark builds sugar.'
        write: 'Light splits, dark builds'
      - section: 'Answer'
        say: 'So the process in the dark stage is the reduction of carbon four oxide, which is option D.'
        write: '$\therefore$ reduction of $\ce{CO2}$'
        answer: true
    traps:
      A: 'You went for oxidation of water. Water is oxidised to oxygen when light splits it, and that is the light stage, not the dark stage.'
      B: 'You chose photolysis of water. Photolysis means splitting by light, so it belongs to the light stage.'
      C: 'You picked oxidation of carbon four oxide. Carbon four oxide gains hydrogen, so it is reduced, not oxidised.'
  15:
    moments:
      - section: 'The question'
        say: 'These gases are made to keep things cold, yet they harm the sky above us. Where do chlorofluorocarbons come from?'
        write: 'Chlorofluorocarbons originate from $?$'
      - section: 'The pollutant'
