        say: 'Density is the number of organisms divided by the total area sampled.'
        write: 'Density $= \dfrac{\text{number of organisms}}{\text{total area sampled}}$'
      - section: 'The working'
        say: 'First the area sampled. Fifty throws times one point six square metres is eighty square metres.'
        write: 'Area sampled $= 50 \times 1.6 = 80$ m²'
      - say: 'Now the density. Four hundred plants over eighty square metres is five plants per square metre.'
        write: 'Density $= \dfrac{400}{80} = 5$ per m²'
      - section: 'Check'
