        say: 'A sex-linked character is controlled by a gene carried on the X chromosome.'
        write: 'Sex-linked = gene on the X chromosome'
      - section: 'Boys and girls'
        say: 'A gene comes in different forms called alleles, here a normal one and a faulty one. A man has one X and one Y, and the Y carries no copy of this gene. So one faulty allele on his X shows at once.'
        write: 'Man XY, one faulty X shows'
      - say: 'A woman has two X chromosomes. A normal allele on the other X usually hides the faulty one, so she is a carrier.'
        write: 'Woman XX, usually a carrier'
      - section: 'The cross'
        say: 'Let big N be normal vision and small n colour blindness. Cross a carrier mother, X big N X small n, with a normal father, X big N Y.'
        write: 'XᴺXⁿ × XᴺY'
      - say: 'The mother gives X big N or X small n. The father gives X big N or Y.'
        write: 'Gametes, Xᴺ, Xⁿ  and  Xᴺ, Y'
      - say: 'The children are X big N X big N, X big N X small n, X big N Y and X small n Y.'
        write: 'XᴺXᴺ, XᴺXⁿ, XᴺY, XⁿY'
      - say: 'So no daughter is colour blind, but half the sons are, even though the father sees normally.'
        write: 'Daughters normal, half the sons colour blind'
      - section: 'Remember it'
        say: 'The famous pair of sex-linked traits is colour blindness and haemophilia.'
        write: 'Colour blindness, haemophilia'
      - section: 'Answer'
        say: 'So the sex-linked character is colour blindness, which is option D.'
        write: '$\therefore$ colour blindness'
        answer: true
