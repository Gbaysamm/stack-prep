        say: 'Density is the number of organisms divided by the total area sampled.'
        write: 'Density $= \dfrac{\text{number of organisms}}{\text{total area sampled}}$'
      - section: 'The working'
        say: 'First the area sampled. Fifty throws times one point six square metres is eighty square metres.'
        write: 'Area sampled $= 50 \times 1.6 = 80$ m²'
      - say: 'Now the density. Four hundred plants over eighty square metres is five plants per square metre.'
        write: 'Density $= \dfrac{400}{80} = 5$ per m²'
      - say: 'The fifteen square metres of the habitat is not needed for density. It would only be used to estimate the total number of plants in the whole habitat.'
        write: 'Habitat area, not used for density'
      - section: 'Answer'
        say: 'So the density of Tridax is five per square metre, which is option D.'
        write: '$\therefore$ density $= 5$ per m²'
        answer: true
    traps:
      A: 'You went for twelve. It does not come from the data. The four hundred plants were counted on eighty square metres, and four hundred over eighty is five.'
      B: 'You chose sixteen. That comes from four hundred over fifteen times one point six, which mixes the habitat area with the quadrat size. The area sampled is fifty times one point six, which is eighty square metres.'
