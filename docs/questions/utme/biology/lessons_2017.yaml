        say: 'For example, Tridax is the small daisy-like weed with yellow centres that grows on school fields all over Nigeria.'
        write: 'Tridax, weed of school fields'
      - section: 'Answer'
        say: 'So the density of Tridax is five per square metre, which is option D.'
        write: '$\therefore$ density $= 5$ per m²'
        answer: true
