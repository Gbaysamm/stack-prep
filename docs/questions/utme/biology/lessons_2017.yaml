  40:
    moments:
      - section: 'The question'
        say: 'Group O blood is kept ready in every hospital. Who can it go to, and who can it take from?'
        write: 'Correct statement about blood transfusion $= ?$'
      - section: 'The rule'
        say: 'Red cells carry markers called antigens, A or B. The plasma carries antibodies, anti A or anti B, which make red cells with the matching antigen clump together. So the donor''s red cells must not carry an antigen that the receiver''s plasma has antibodies against.'
        write: 'Donor antigen must not meet receiver antibody'
      - section: 'The groups'
        say: 'Group O red cells carry no A or B antigen.'
        write: 'O cells, no antigen'
      - say: 'Group A B plasma has no antibodies at all.'
        write: 'AB plasma, no antibody'
      - section: 'Group O'
        say: 'So group O blood can be given to A, B, A B and O. That makes O the universal donor.'
        write: 'O $\to$ A, B, AB, O  (universal donor)'
      - say: 'But group O plasma has both anti A and anti B. So a group O person can receive only group O blood.'
        write: 'O receives from O only'
      - section: 'Group AB'
        say: 'Group A B has no antibodies, so it can receive from everyone. That makes it the universal recipient.'
        write: 'AB receives from all  (universal recipient)'
      - section: 'An example'
        say: 'For example, after a road accident on the Lagos to Ibadan expressway, the hospital may give group O blood at once, before there is time to test.'
        write: 'Emergency, group O first'
      - section: 'Remember it'
        say: 'O is the universal donor, and A B is the universal recipient.'
        write: 'O gives to all, AB takes from all'
      - section: 'Answer'
        say: 'So the correct statement is that group O can donate to A, B and A B but cannot receive from them, which is option D.'
        write: '$\therefore$ O gives to A, B, AB, receives from none of them'
        answer: true
    traps:
      A: 'You went for A. Group A B can receive from all groups, including group O.'
      B: 'You chose B. Group O can receive only from group O, not from A, B or A B.'
      C: 'You picked C. Group B can donate to B and also to A B.'
