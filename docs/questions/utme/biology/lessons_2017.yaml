  19:
    moments:
      - section: 'The question'
        say: 'We are given the same four excretory organs. We must find the one that saves water best by means of long loops of Henle.'
        write: 'Organ that conserves water by loops of Henle $= ?$'
      - section: 'Read the drawing'
        say: 'Find drawing two. It is bean shaped and cut down the middle. You can see the outer cortex, the striped pyramids that make up the inner part called the medulla, and the ureter leaving at the notch.'
        write: 'II = kidney, cortex, pyramids, ureter'
      - section: 'The structure'
        say: 'A kidney is made of tiny tubes called nephrons. Each nephron has a U shaped part called the loop of Henle, which dips down into the pyramids.'
        write: 'Nephron, loop of Henle dips into the medulla'
      - section: 'How it works'
        say: 'The loops make the inner part of the kidney very salty.'
        write: 'Loops make the medulla salty'
      - say: 'The urine then passes down the collecting ducts, the tubes that run through that salty part. As it does, water is drawn out by osmosis and goes back to the blood. So the urine becomes concentrated.'
        write: 'Water drawn back by osmosis, concentrated urine'
      - section: 'The others'
        say: 'Drawing four is the Malpighian tubules of an insect. They have no loops of Henle.'
        write: 'IV, Malpighian tubules, no loops'
      - say: 'Drawing one is the flame cell of a flatworm. It removes extra water and has no loop of Henle.'
        write: 'I, flame cell, no loop'
      - say: 'Drawing three is the nephridium of the earthworm. It makes a watery urine and has no loop of Henle.'
        write: 'III, nephridium, no loop'
      - section: 'Answer'
        say: 'So the organ that conserves water by long loops of Henle is drawing two, which is option D.'
        write: '$\therefore$ II, the kidney'
        answer: true
    traps:
      A: 'You went for four. Those are Malpighian tubules, which have no loops of Henle. Insects save water by making uric acid and taking water back in the rectum.'
      B: 'You chose one. That is a flame cell of a flatworm. It removes extra water from the body and has no loop of Henle.'
      C: 'You picked three. That is the nephridium of the earthworm. It makes a watery urine and has no loop of Henle.'
  20:
    moments:
      - section: 'The question'
        say: 'We must find the process needed to form gametes, the sex cells, in sexual reproduction.'
        write: 'Process that forms gametes $= ?$'
      - section: 'The process'
        say: 'Gametes are made by meiosis. Meiosis is a cell division that halves the number of chromosomes.'
        write: 'Meiosis halves the chromosome number'
      - section: 'The numbers'
        say: 'A human body cell has forty-six chromosomes. Meiosis gives a sperm or an egg with twenty-three.'
        write: '46 $\to$ 23 in each gamete'
      - say: 'At fertilisation twenty-three plus twenty-three gives forty-six again in the zygote.'
        write: '23 + 23 = 46 in the zygote'
      - section: 'The others'
        say: 'Mitosis keeps the full chromosome number, so it makes body cells for growth and repair, not gametes.'
        write: 'Mitosis, full number, growth and repair'
      - say: 'Fertilisation is the joining of gametes that are already made.'
        write: 'Fertilisation, gametes join'
      - say: 'Implantation is the embryo sinking into the wall of the uterus, after fertilisation.'
        write: 'Implantation, embryo into the uterus wall'
      - section: 'Answer'
        say: 'So the process required for forming gametes is meiosis, which is option D.'
        write: '$\therefore$ meiosis'
        answer: true
    traps:
      A: 'You went for implantation. That is the embryo sinking into the wall of the uterus, after fertilisation.'
      B: 'You chose fertilisation. That is the joining of gametes that are already made.'
      C: 'You picked mitosis. Mitosis keeps the full chromosome number, so it is for growth and repair, not gametes.'
  21:
    moments:
      - section: 'The question'
        say: 'A soil sample is burnt in a dish. We must find the percentage of humus in the sample.'
        write: 'Percentage of humus in the sample $= ?$'
      - section: 'The data'
        say: 'The dish is twenty grams. The dry soil is seven point five grams. The dish and soil after burning weigh twenty-five grams.'
        write: 'Dish $= 20$ g, dry soil $= 7.5$ g, dish + soil after burning $= 25$ g'
      - section: 'The rule'
        say: 'Humus is organic matter, and it burns away. So the mass lost is the humus.'
        write: 'Mass lost on burning = humus'
      - say: 'Percentage of humus is the loss in mass over the mass of dry soil, times one hundred.'
        write: '$\%\ \text{humus} = \dfrac{\text{loss in mass}}{\text{mass of dry soil}} \times 100$'
      - section: 'The working'
        say: 'Before burning, the dish and soil weighed twenty plus seven point five, which is twenty-seven point five grams.'
        write: 'Before $= 20 + 7.5 = 27.5$ g'
      - say: 'Loss in mass is twenty-seven point five minus twenty-five, which is two point five grams.'
        write: 'Loss $= 27.5 - 25 = 2.5$ g'
      - say: 'Now divide by the soil alone, because the dish lost nothing. Two point five over seven point five, times one hundred, is thirty-three point three percent.'
        write: '$\%\ \text{humus} = \dfrac{2.5}{7.5} \times 100 = 33.3\%$'
      - section: 'Answer'
        say: 'So the percentage of humus in the sample is thirty-three point three percent, which is option D.'
        write: '$\therefore$ 33.3%'
        answer: true
    traps:
      A: 'You went for nine point one percent. You divided the two point five gram loss by twenty-seven point five, the dish and soil together. Divide by the soil alone.'
      B: 'You chose thirty-seven point five percent. That is seven point five over twenty, which mixes up the soil and the dish and never uses the mass burnt away.'
      C: 'You picked twelve point five percent. You divided the loss by the twenty gram dish instead of by the seven point five grams of soil.'
  22:
    moments:
      - section: 'The question'
        say: 'We must find the two things that termites and earthworms promote in the soil.'
        write: 'Termites and earthworms promote $?$'
      - section: 'The animals'
        say: 'Termites and earthworms are soil animals. They tunnel through the soil and feed on dead plant matter.'
        write: 'Soil animals, tunnel and eat dead plants'
      - section: 'The tunnels'
        say: 'Their burrows let air into the soil. This is aeration. Roots need that air to respire.'
        write: 'Burrows $\to$ aeration'
      - section: 'The feeding'
        say: 'They pull dead leaves into the soil and break them down. As they digest it, mineral salts are set free, so earthworm casts are rich in minerals. In this way the soil becomes more fertile.'
        write: 'Feeding $\to$ fertility'
      - section: 'The others'
        say: 'The tunnels also make the soil more porous. But porosity and aeration both come from the tunnels, so a pair with porosity leaves out either the air or the fertility.'
        write: 'Porosity, from the same tunnels'
      - say: 'Soil animals do not make the soil acidic. Earthworm casts are nearly neutral.'
        write: 'Acidity, not caused by them'
      - section: 'Answer'
        say: 'So termites and earthworms promote aeration and fertility, which is option C.'
        write: '$\therefore$ aeration and fertility'
        answer: true
    traps:
      A: 'You went for porosity and fertility. Fertility is right, and tunnels do open the soil, but the gain from the tunnels that matters most to roots is the air they let in, and this pair leaves aeration out.'
      B: 'You chose porosity and aeration. Both come from the same tunnels, and the pair leaves out the fertility their feeding adds.'
      D: 'You picked acidity and aeration. Soil animals do not make the soil acidic, and earthworm casts are nearly neutral.'
  23:
    moments:
