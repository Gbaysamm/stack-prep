      - say: 'This gives the plant nitrogen, which is scarce in the boggy soil where it grows.'
        write: 'Insects give nitrogen, poor boggy soil'
      - section: 'An example'
        say: 'For example, the pitcher plant does the same thing with a leaf turned into a jug that drowns insects.'
        write: 'Pitcher plant, a leaf turned into a jug'
      - section: 'Remember it'
        say: 'A leaf rebuilt into a trap is structure.'
        write: 'Leaf rebuilt = structural'
      - section: 'Answer'
        say: 'So the trapping of insects by the Venus flytrap is a structural adaptation, which is option B.'
        write: '$\therefore$ structural adaptation'
        answer: true
    traps:
