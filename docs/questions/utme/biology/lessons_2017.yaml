        say: 'For example, in any Nigerian classroom you can line pupils up by height, but you need a laboratory test to know their blood groups.'
        write: 'Line up by height, test for blood group'
      - section: 'Check the lists'
        say: 'Now check each list. Every item must be morphological, so one physiological item spoils a list. Weight, fingerprints and body shape can all be seen or measured, so that list passes.'
        write: 'Weight, fingerprints, body shape, all morphological ✓'
      - section: 'Remember it'
        say: 'Morph means form, the shape you can see.'
        write: 'Morph = form'
