        write: 'Whale flippers and fish fins are examples of $= ?$'
      - section: 'The process'
        say: 'Convergent evolution is when unrelated organisms evolve similar features because they live in similar ways.'
        write: 'Convergent evolution = unrelated, similar features, similar lives'
      - section: 'How it works'
        say: 'A whale is a mammal and a fish is not. But both swim, so both evolved flat paddles.'
        write: 'Whale (mammal) and fish both swim → paddles'
      - say: 'Inside, the whale''s flipper has the bones of a mammal''s forelimb, while a fish fin is held up by fin rays. They are built differently.'
        write: 'Flipper: limb bones.  Fin: fin rays'
      - say: 'Structures that do the same job but have different origins are called analogous structures. They are the mark of convergent evolution.'
        write: 'Same job, different origin = analogous → convergent'
      - section: 'An example'
        say: 'The wings of a bat and the wings of a butterfly are another analogous pair. Both fly, but they are built in quite different ways.'
        write: 'Bat wing and butterfly wing: analogous'
      - section: 'Remember'
        say: 'Remember, converge means come together. Different starts end up with similar shapes.'
        write: 'Converge = come together'
      - section: 'Answer'
        say: 'So whale flippers and fish fins are examples of convergent evolution, which is option D.'
        write: '$\therefore$ convergent evolution'
        answer: true
    traps:
      A: 'You went for divergent evolution. That is the reverse, where related animals grow different, giving homologous structures such as a whale''s flipper and a bat''s wing. A whale and a fish are not close relatives.'
      B: 'You chose coevolution. That is two species changing together, as a flower and the insect that pollinates it do.'
      C: 'You picked continuous variation. That is the range of small differences, such as height, within one species.'
