        write: 'In the anther: microspores'
      - say: 'Each microspore then divides by mitosis and develops into a pollen grain, which is the young male gametophyte.'
        write: 'Microspore → (mitosis) → pollen grain'
      - say: 'So the spore comes first. The gametophyte comes one step later.'
        write: 'Meiosis → spore → gametophyte'
      - section: 'Answer'
        say: 'So the immediate product of meiosis is the microspores, which develop into pollen grains, which is option D.'
        write: '$\therefore$ microspores'
        answer: true
    traps:
      A: 'You went for the sporophyte. That is the diploid plant itself, the one that carries out meiosis, not its product.'
      B: 'You chose the gametophyte. It grows from a spore by mitosis, one step after meiosis.'
      C: 'You picked the zygote. The zygote is formed by fertilisation, not by meiosis.'
