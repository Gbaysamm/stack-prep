# UTME 2018 Biology, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good biology teacher works on the board: the
# question, the structure or process named, how it works in simple steps, a real Nigerian
# example, a way to remember it, and the answer. Where the question has a drawing or a graph,
# the lesson says in words where to look in it. The cross in Q32 is laid out line by line.
#
#   say:     heard, not read. Latin names said plainly, genetic symbols as letters ("X big H"),
#            ratios in words, no symbols the voice would stop on.
#   write:   the one line written while it is said, with LaTeX and mhchem between dollar signs.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2018.yaml. Answers match that file. All 40
# questions are kept, so every one has a lesson.
format_version: 1
exam_year: 2018
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'A Red Sokoto goat and a West African Dwarf goat can breed, and their kids can breed too. What do we call a group like that?'
        write: 'Organisms that interbreed to give fertile offspring $= ?$'
      - section: 'The rule'
        say: 'Living things are sorted on a ladder of groups, from the biggest to the smallest.'
        write: 'Kingdom → phylum → class → order → family → genus → species'
      - say: 'The smallest group is the species. A species is a group of closely related organisms that can interbreed to produce fertile offspring.'
        write: 'Species = closely related, interbreed, fertile offspring'
      - section: 'How it works'
        say: 'The test is fertility. The parents mate, and when the young grow up, they can breed too.'
        write: 'Test: can the young breed when grown?'
      - say: 'The higher groups are too wide for this. A family or a class holds many kinds of organisms that cannot breed with one another.'
        write: 'Family, class, kingdom: many kinds that cannot interbreed'
      - section: 'An example'
        say: 'Every goat in a Nigerian village belongs to one species. Any two goats can breed, and their kids can breed when they grow.'
        write: 'Red Sokoto × West African Dwarf → fertile kids, one species'
      - section: 'Remember'
        say: 'Remember, only the last rung of the ladder is defined by breeding. Species means same kind.'
        write: 'Species = same kind, fertile young'
      - section: 'Answer'
        say: 'So these organisms are members of a species, which is option D.'
        write: '$\therefore$ species'
        answer: true
    traps:
      A: 'You went for kingdom. A kingdom is the biggest group of all, holding millions of organisms that cannot interbreed, like a goat and a mango tree.'
      B: 'You chose class. A class holds many orders and families, and most of its members cannot breed with one another.'
      C: 'You picked family. A family holds several genera, and organisms from different genera do not produce fertile young. Only a species does.'
  2:
    moments:
      - section: 'The question'
        say: 'Euglena is a tiny green cell that makes food in light. Shut it in a dark room for two weeks, and it is still alive. How?'
        write: 'Euglena, two weeks in the dark, still alive. Why?'
      - section: 'The structure'
        say: 'Euglena is a protist that can feed in two ways. In light it is autotrophic, which means it makes its own food.'
        write: 'In light: autotrophic (makes its own food)'
      - say: 'Its chloroplasts use light to turn carbon dioxide and water into sugar. That is photosynthesis.'
        write: '$\ce{6CO2 + 6H2O ->[light][chlorophyll] C6H12O6 + 6O2}$'
      - section: 'How it works'
        say: 'In the dark, photosynthesis stops, because there is no light to drive it.'
        write: 'Dark → no light → photosynthesis stops'
      - say: 'So Euglena switches to heterotrophic nutrition. It takes in ready made food dissolved in the pond water.'
        write: 'In dark: heterotrophic (ready-made food from the water)'
      - say: 'Because it keeps feeding, it stays alive for the two weeks.'
        write: 'Keeps feeding → stays alive'
      - section: 'An example'
        say: 'Think of the green scum on a stagnant pond in the rainy season. It lives on at night and in the deep shade of thick leaves.'
        write: 'Green pond scum: alive at night and in shade'
      - section: 'Remember'
        say: 'Remember, Euglena keeps two kitchens, one that runs on sunlight and one that uses ready made food.'
        write: 'Two kitchens: solar and ready-made'
      - section: 'Answer'
        say: 'So the Euglena survived because it could carry out heterotrophic nutrition, which is option A.'
        write: '$\therefore$ heterotrophic nutrition'
        answer: true
    traps:
      B: 'You went for photosynthesis. The pond water does have carbon dioxide, but photosynthesis also needs light, and the room was dark.'
      C: 'You chose better adapted to darkness. Euglena is suited to light. It has an eyespot and swims towards light to make food.'
      D: 'You picked not overcrowded. Crowding has nothing to do with living without light. The question is how it got food.'
  3:
    moments:
      - section: 'The question'
        say: 'Every cell is full of a jelly called the cytoplasm. Why is it so important?'
        write: 'Why is the cytoplasm important?'
      - section: 'The structure'
        say: 'The cytoplasm is the jelly-like material between the cell membrane and the nucleus.'
        write: 'Cytoplasm = jelly between cell membrane and nucleus'
      - section: 'What it does'
        say: 'It holds and suspends all the organelles, such as the mitochondria, the ribosomes and the chloroplasts.'
        write: 'Holds and suspends all organelles'
      - say: 'It is also where many of the cell''s chemical reactions take place, because the organelles and the dissolved substances meet there.'
        write: 'Site of many reactions'
      - section: 'An example'
        say: 'Think of a bowl of okra soup. The soup is the cytoplasm, and the pieces of meat and fish floating in it are the organelles.'
        write: 'Okra soup = cytoplasm, meat and fish = organelles'
      - section: 'Remember'
        say: 'Remember, the cytoplasm is the soup, and the organelles are what float in it.'
        write: 'Cytoplasm = soup, organelles float in it'
      - section: 'Answer'
        say: 'So the cytoplasm is important because it suspends all the cell organelles, which is option B.'
        write: '$\therefore$ it suspends all cell organelles'
        answer: true
    traps:
      A: 'You went for regulating energy. Most of the cell''s energy is released by respiration in the mitochondria, at a rate set by the cell''s needs. The cytoplasm holds them but does not regulate the energy.'
      C: 'You chose the outermost part. The outside of an animal cell is the cell membrane, and of a plant cell the cell wall. The cytoplasm is inside.'
      D: 'You picked cell division. Division is directed by the nucleus, which divides first. The cytoplasm only splits in two at the end, so it is not solely responsible.'
  4:
    moments:
      - section: 'The question'
        say: 'Look at the drawing. A thistle funnel stands upside down in a beaker, and after an hour something happens to the liquid in its stem. Does it rise or fall?'
        write: 'Level of liquid in the thistle funnel after an hour $= ?$'
      - section: 'Look at the drawing'
        say: 'The round bulb of the funnel holds sugar solution. A membrane is tied over its wide mouth at the bottom.'
        write: 'Funnel bulb: sugar solution, membrane tied over the mouth'
      - say: 'The funnel stands in a beaker of distilled water, held up by a clamp. So the membrane separates sugar solution from pure water.'
        write: 'Beaker: distilled water, membrane between the two'
      - section: 'The process'
        say: 'This set up is an osmometer. Osmosis is the movement of water through a selectively permeable membrane, from a dilute solution to a more concentrated one.'
        write: 'Osmosis: water moves dilute → concentrated across a membrane'
      - section: 'How it works'
        say: 'Distilled water has the most free water molecules, so water moves in through the membrane into the sugar solution.'
        write: 'Water: beaker → into the funnel'
      - say: 'The sugar molecules are too big to pass out through the membrane, so they stay inside.'
        write: 'Sugar molecules too big to leave'
      - say: 'The volume inside the funnel grows, so the liquid is pushed up the narrow stem.'
        write: 'More volume inside → liquid pushed up the stem'
      - section: 'Remember'
        say: 'Remember, water chases sugar.'
        write: 'Water chases sugar'
      - section: 'Answer'
        say: 'So after an hour the level of liquid in the funnel will rise, which is option A.'
        write: '$\therefore$ the level rises'
        answer: true
    traps:
      B: 'You went for fall. The level would fall only if water left the funnel, but water moves into the more concentrated sugar solution.'
      C: 'You chose remain the same. That happens only when both sides have the same concentration, and here one side is sugar solution and the other is pure water.'
      D: 'You picked double. Nothing fixes the rise at exactly double. The liquid rises steadily until the weight of the column balances the water coming in.'
  5:
    moments:
      - section: 'The question'
        say: 'We have the same drawing again, with sugar solution in the funnel, distilled water in the beaker and a membrane between them. Which process does this show?'
        write: 'The experiment demonstrates $= ?$'
      - section: 'Look at the drawing'
        say: 'Find the membrane tied over the mouth of the funnel. Everything in this set up is built around it.'
        write: 'Key part: the membrane over the funnel mouth'
      - section: 'The process'
        say: 'Osmosis is the movement of water molecules through a selectively permeable membrane, from a dilute solution to a more concentrated one.'
        write: 'Osmosis = water through a selectively permeable membrane'
      - section: 'How it works'
        say: 'Water from the beaker passes through the membrane into the sugar solution, and the rising level in the stem shows it happening.'
        write: 'Water in → level in the stem rises'
      - section: 'An example'
        say: 'When you soak dried beans overnight for moi moi, they swell, because water enters their cells by osmosis.'
        write: 'Beans soaked for moi moi swell by osmosis'
      - section: 'Remember'
        say: 'Remember, osmosis needs a membrane and moves water. Diffusion needs no membrane and moves any substance.'
        write: 'Osmosis: membrane + water. Diffusion: any substance'
      - section: 'Answer'
        say: 'So the experiment demonstrates osmosis, which is option D.'
        write: '$\therefore$ osmosis'
        answer: true
    traps:
      A: 'You went for transportation. That is the carrying of materials round a living thing, as in xylem or blood vessels. This set up shows one particular process, water crossing a membrane.'
      B: 'You chose water culture. That is growing plants in mineral solutions to study the nutrients they need. There is no plant here.'
      C: 'You picked diffusion. Osmosis is a special kind of diffusion, but diffusion is the spread of any substance with no membrane needed. Here water crosses a membrane, so it is osmosis.'
  6:
    moments:
      - section: 'The question'
        say: 'In the drawing, a membrane lets water into the funnel but keeps the sugar in. Which part of a plant cell does that same job?'
        write: 'In a plant cell, which part plays the membrane?'
      - section: 'Look at the drawing'
        say: 'Look at the membrane tied over the funnel. It lets water through but holds back the sugar. We call it selectively permeable.'
        write: 'Membrane: lets water through, holds sugar back'
      - section: 'The structure'
        say: 'In a plant cell, the selectively permeable layer is the living cytoplasm with its two membranes, the cell membrane outside and the tonoplast around the vacuole.'
        write: 'Cytoplasm + cell membrane + tonoplast = selectively permeable layer'
      - section: 'How it works'
        say: 'The cell sap in the vacuole plays the sugar solution. The lining of cytoplasm around it controls what passes in and out.'
        write: 'Cell sap = sugar solution, cytoplasm = membrane'
      - say: 'The cell wall outside is made of cellulose. It is freely permeable, so it lets water and dissolved sugar through alike.'
        write: 'Cellulose cell wall: freely permeable'
      - section: 'An example'
        say: 'Soak yam slices in salt water and they go soft. Water leaves the cell sap across the living cytoplasm.'
        write: 'Yam slices in salt water go soft'
      - section: 'Remember'
        say: 'Remember, the wall is a fence anything can pass. The living cytoplasm is the gate that chooses.'
        write: 'Wall = open fence, cytoplasm = choosing gate'
      - section: 'Answer'
        say: 'So the role of the membrane is played by the cytoplasm, which is option C.'
        write: '$\therefore$ cytoplasm'
        answer: true
    traps:
      A: 'You went for the nucleolus. It sits inside the nucleus and makes ribosomes. It plays no part in osmosis.'
      B: 'You chose the cell wall. It is made of cellulose and is freely permeable, so it lets sugar and water through alike. It cannot hold the sugar back.'
      D: 'You picked the mitochondrion. It releases energy by respiration. It does not control the water that enters the cell.'
  7:
    moments:
      - section: 'The question'
        say: 'Put red blood cells in distilled water for an hour, and they burst open. What is that called?'
        write: 'Red cells burst in distilled water $= ?$'
      - section: 'The process'
        say: 'The bursting of red blood cells is called haemolysis.'
        write: 'Haemolysis = bursting of red blood cells'
      - section: 'How it works'
        say: 'Distilled water is less concentrated than the inside of the red cell. So water enters the cell by osmosis.'
        write: 'Distilled water dilute → water enters the cell'
      - say: 'The cell swells. A red cell has no cell wall to hold it in, so it bursts.'
        write: 'Cell swells, no wall → bursts'
      - section: 'An example'
        say: 'This is why blood in a hospital is always kept in a solution as concentrated as the plasma, never in plain water.'
        write: 'Blood kept in a solution as strong as plasma'
      - section: 'Remember'
        say: 'Remember, haemo means blood and lysis means splitting. Haemolysis is blood cells splitting open.'
        write: 'Haemo = blood, lysis = splitting'
      - section: 'Answer'
        say: 'So the bursting of the red cells is haemolysis, which is option C.'
        write: '$\therefore$ haemolysis'
        answer: true
    traps:
      A: 'You went for plasmolysis. That happens to plant cells in a strong solution. They lose water and their contents shrink, the opposite of bursting.'
      B: 'You chose diffusion. Diffusion is the general spread of particles. It is not the name for cells bursting.'
      D: 'You picked wilting. Wilting is a whole plant drooping when its cells lose water. These cells gained water.'
  8:
    moments:
      - section: 'The question'
        say: 'A plant root bends towards water in the soil. What is that growth movement called?'
        write: 'Curvature in response to water $= ?$'
      - section: 'The process'
        say: 'A tropism is a growth movement of a plant part towards or away from a stimulus. The name tells you the stimulus.'
        write: 'Tropism = growth curvature to a stimulus'
      - say: 'When the stimulus is water, it is hydrotropism.'
        write: 'Water → hydrotropism'
      - section: 'How it works'
        say: 'Roots are positively hydrotropic. They grow towards moist soil, where they can absorb water.'
        write: 'Roots grow towards moist soil'
      - section: 'An example'
        say: 'The roots of a mango tree near a leaking pipe or a well grow towards the water.'
        write: 'Mango roots grow towards a leaking pipe'
      - section: 'Remember'
        say: 'Remember, hydro means water, as in the hydroelectric power from Kainji Dam. Geo is the earth, photo is light, and thigmo is touch.'
        write: 'Hydro = water, geo = gravity, photo = light, thigmo = touch'
      - section: 'Answer'
        say: 'So the response to water is hydrotropism, which is option A.'
        write: '$\therefore$ hydrotropism'
        answer: true
    traps:
      B: 'You went for geotropism. Roots do grow downwards, but that is a response to gravity, not to water.'
      C: 'You chose phototropism. That is a growth response to light, like a seedling bending towards a window.'
      D: 'You picked thigmotropism. That is a growth response to touch, like a yam tendril coiling round a stake.'
  9:
    moments:
      - section: 'The question'
        say: 'Four equations look almost the same. Which one sums up glycolysis? We will count carbons to find out.'
        write: 'Overall equation for glycolysis $= ?$'
      - section: 'The process'
        say: 'Glycolysis is the first stage of respiration. It happens in the cytoplasm and does not need oxygen.'
        write: 'Glycolysis: first stage of respiration, in cytoplasm, no oxygen'
      - section: 'How it works'
        say: 'One glucose molecule, with six carbons, is split into two molecules of pyruvic acid, each with three carbons.'
        write: '$\ce{C6H12O6}$ → $2\,\ce{C3H4O3}$ (pyruvic acid)'
      - say: 'Count the carbons. Six on the left, and two times three is six on the right. They balance.'
        write: 'C: $6 = 2 \times 3$ ✓'
      - say: 'Now count the hydrogens. Glucose has twelve, and two pyruvic acids have four each, which is eight.'
        write: 'H: $12$ in glucose, $2 \times 4 = 8$ in pyruvic acid'
      - say: 'So four hydrogen atoms are left over. They are removed and passed to carrier molecules in the cell.'
        write: '$12 - 8 = 4$, so $+\ 4\ce{H}$ to carriers'
      - say: 'Next, the energy. A T P is the energy carrier the cell makes, and A D P is what it is made from.'
        write: 'ATP = energy carrier, made from ADP'
      - say: 'Glycolysis uses two A T P to get started and makes four, so there is a net gain of two A T P.'
        write: 'Net gain: $4 - 2 = 2$ ATP'
      - section: 'The equation'
        say: 'Put it together. Glucose gives two pyruvic acid, plus four H, plus two A T P.'
        write: '$\ce{C6H12O6 -> 2C3H4O3 + 4H + 2ATP}$'
      - section: 'An example'
        say: 'When you sprint for a danfo, your leg muscles run glycolysis fast to get A T P quickly.'
        write: 'Sprinting for a danfo: glycolysis in the muscles'
      - section: 'Remember'
        say: 'Remember, one glucose gives two pyruvates and two A T P.'
        write: '1 glucose → 2 pyruvate + 2 ATP'
      - section: 'Answer'
        say: 'So the overall reaction is the equation with two pyruvic acid and two A T P, which is option B.'
        write: '$\therefore \ce{C6H12O6 -> 2C3H4O3 + 4H + 2ATP}$'
        answer: true
    traps:
      A: 'You went for A. It has only one pyruvic acid, which has three carbons. Glucose has six, so it must give two, and the gain is two A T P.'
      C: 'You chose C. Glycolysis makes A T P, not A D P, and it makes two of them.'
      D: 'You picked D. A D P is the starting material that is turned into A T P. The product is two A T P.'
  10:
    moments:
      - section: 'The question'
        say: 'Which is the longest bone in your body? Feel your arm, then your thigh.'
        write: 'Longest bone in the body $= ?$'
      - section: 'The structure'
        say: 'The femur is the thigh bone. It runs from the hip to the knee.'
        write: 'Femur = thigh bone, hip to knee'
      - section: 'What it does'
        say: 'It carries the weight of the body when you stand, walk and run, so it is the longest and strongest bone.'
        write: 'Carries body weight → longest and strongest'
      - say: 'Below it is the tibia, the shin bone, which is the second longest. In the arm, the humerus is shorter than the femur.'
        write: 'Femur > tibia, humerus shorter'
      - section: 'An example'
        say: 'In a cow leg at the market, the big thigh bone used for pepper soup is the femur.'
        write: 'Cow thigh bone for pepper soup = femur'
      - section: 'Remember'
        say: 'Remember, the femur is the bone of the thigh, the biggest part of the leg.'
        write: 'Femur = thigh = longest'
      - section: 'Answer'
        say: 'So the longest bone in the body is the femur, which is option B.'
        write: '$\therefore$ femur'
        answer: true
    traps:
      A: 'You went for the humerus. It is the longest bone of the arm, but it is shorter than the femur.'
      C: 'You chose the scapula. That is the flat shoulder blade, not a long bone at all.'
      D: 'You picked the tibia. It is the shin bone, the second longest, just below the femur.'
  11:
    moments:
      - section: 'The question'
        say: 'Here are chitin, cartilage, bone and muscle. Three of them build skeletons. Which one does not?'
        write: 'Not a skeletal material $= ?$'
      - section: 'The rule'
        say: 'A skeletal material is a hard or firm substance that gives an animal support and shape.'
        write: 'Skeletal material = hard or firm, gives support and shape'
      - section: 'Each one'
        say: 'Chitin forms the hard outer skeleton of insects and crabs.'
        write: 'Chitin → exoskeleton of insects'
      - say: 'Cartilage is the firm, bendy skeleton of sharks, and it is in our ear flaps and the ends of our bones.'
        write: 'Cartilage → shark skeleton, ear flaps'
      - say: 'Bone is the hard inner skeleton of vertebrates.'
        write: 'Bone → endoskeleton of vertebrates'
      - say: 'Muscle is a soft tissue. It pulls on the skeleton to move it, but it does not form the skeleton.'
        write: 'Muscle → soft, moves the skeleton'
      - section: 'An example'
        say: 'The hard shell of a cockroach is chitin, the gristle at the end of a chicken bone is cartilage, and the leg itself is bone. The meat around it is muscle.'
        write: 'Cockroach shell, chicken gristle, chicken bone, chicken meat'
      - section: 'Remember'
        say: 'Remember, the skeleton is the frame, and muscle is the rope that pulls it.'
        write: 'Skeleton = frame, muscle = rope'
      - section: 'Answer'
        say: 'So the one that is not a skeletal material is muscle, which is option D.'
        write: '$\therefore$ muscle'
        answer: true
    traps:
      A: 'You went for chitin. It is not in our bodies, but it is the skeletal material of the exoskeleton of insects and crabs.'
      B: 'You chose cartilage. Cartilage is a skeletal material, as in the whole skeleton of a shark and the ends of our bones.'
      C: 'You picked bone. Bone is the main skeletal material of vertebrates.'
  12:
    moments:
      - section: 'The question'
        say: 'Blood rushes through the arteries, then crawls through the capillaries. Why does it slow down there?'
        write: 'Why is flow in capillaries slow?'
      - section: 'The structure'
        say: 'Capillaries are the tiniest blood vessels. Their walls are one cell thick, and they link arterioles to venules.'
        write: 'Capillaries: walls one cell thick, arteriole → venule'
      - section: 'How it works'
        say: 'One artery branches into thousands of capillaries. Together they are far wider than the artery that feeds them, so the blood spreads out and slows.'
        write: 'Total width of capillaries ≫ artery → blood slows'
      - say: 'The slow flow gives time for oxygen and food to diffuse out to the cells, and for carbon dioxide and wastes to diffuse in.'
        write: 'Slow flow → time for exchange'
      - section: 'An example'
        say: 'At a busy Lagos motor park, the buses slow down so that passengers have time to get on and off.'
        write: 'Motor park: buses slow so passengers can board'
      - section: 'Remember'
        say: 'Remember, capillaries are the motor park of the blood. The blood slows down, swaps and moves on.'
        write: 'Capillaries = motor park'
      - section: 'Answer'
        say: 'So the flow is slow to allow adequate time for exchange of materials, which is option D.'
        write: '$\therefore$ time for exchange of materials'
        answer: true
    traps:
      A: 'You went for thin walls. Thin walls are true of capillaries, and they speed up diffusion, but they do not slow the blood. That comes from the large total width of the capillaries.'
      B: 'You chose avoiding high pressure. Blood pressure does fall as blood passes the capillaries, but the purpose of the slow flow is exchange.'
      C: 'You picked dizziness. Dizziness depends on the blood supply to the brain, not on the speed of flow in capillaries.'
  13:
    moments:
      - section: 'The question'
        say: 'Here are four groups of animals. In only one group does every animal use a kidney to excrete. Which group?'
        write: 'Group with the kidney as excretory organ $= ?$'
      - section: 'The rule'
        say: 'The kidney is the excretory organ of vertebrates, the animals with backbones. That means fishes, amphibians, reptiles, birds and mammals, including man.'
        write: 'Kidney → vertebrates: fishes, amphibians, reptiles, birds, mammals'
      - section: 'What it does'
        say: 'The kidney filters the blood and removes nitrogenous waste and extra water as urine.'
        write: 'Filters blood → urine'
      - section: 'The other organs'
        say: 'Animals without backbones have no kidney. They use other organs, and we will meet them as we check each group.'
        write: 'No backbone → no kidney, another organ'
      - section: 'Check each group'
        say: 'Option A has fishes, amphibians, birds and man. All four are vertebrates, so all four have kidneys.'
        write: 'A: all vertebrates ✓'
      - say: 'Option B has annelids and insects. Annelids, such as the earthworm, excrete with nephridia, and insects excrete with Malpighian tubules.'
        write: 'B: annelids (nephridia), insects (Malpighian tubules) ✗'
      - say: 'Option C has tapeworms. A tapeworm is a flatworm, and flatworms excrete with flame cells.'
        write: 'C: tapeworm (flame cells) ✗'
      - say: 'Option D has protozoans. These are single cells, and they get rid of water with a contractile vacuole.'
        write: 'D: protozoa (contractile vacuole) ✗'
      - section: 'An example'
        say: 'A tilapia, a toad, a chicken and a person all have kidneys. An earthworm and a housefly do not.'
        write: 'Tilapia, toad, chicken, man ✓   earthworm, housefly ✗'
      - section: 'Remember'
        say: 'Remember, backbone means kidney.'
        write: 'Backbone → kidney'
      - section: 'Answer'
        say: 'So the group that has the kidney is fishes, amphibians, birds and man, which is option A.'
        write: '$\therefore$ fishes, amphibians, birds, man'
        answer: true
    traps:
      B: 'You went for B. Fishes and amphibians have kidneys, but annelids use nephridia and insects use Malpighian tubules.'
      C: 'You chose C. Fishes, reptiles and birds are right, but a tapeworm is a flatworm and excretes with flame cells.'
      D: 'You picked D. Protozoans are single cells. They use a contractile vacuole and their cell surface, not a kidney.'
  14:
    moments:
      - section: 'The question'
        say: 'Three of these statements are true of arteries. One belongs to another vessel. Which one?'
        write: 'Not a feature of arteries $= ?$'
      - section: 'The structure'
        say: 'Arteries carry blood away from the heart, under high pressure.'
        write: 'Arteries: away from the heart, high pressure'
      - section: 'How they work'
        say: 'They have thick muscular and elastic walls to stand that pressure.'
        write: 'Thick muscular, elastic walls'
      - say: 'Most carry oxygenated blood. The pulmonary artery is the exception, because it takes deoxygenated blood to the lungs.'
        write: 'Oxygenated blood, except the pulmonary artery'
      - say: 'Valves along the length belong to veins. Blood in veins is under low pressure, so valves stop it flowing backwards.'
        write: 'Valves along the length → veins'
      - say: 'Arteries need no such valves, because each heartbeat pushes the blood forward.'
        write: 'Arteries: heartbeat keeps blood moving, no valves needed'
      - section: 'An example'
        say: 'Feel the pulse at your wrist. That throb is the high pressure in an artery with each beat of the heart.'
        write: 'Pulse at the wrist = artery'
      - section: 'Remember'
        say: 'Remember, Arteries go Away from the heart, and Veins have Valves.'
        write: 'Arteries → Away, Veins → Valves'
      - section: 'Answer'
        say: 'So the one that is not a feature of arteries is valves at intervals, which is option A.'
        write: '$\therefore$ valves at intervals along the length'
        answer: true
