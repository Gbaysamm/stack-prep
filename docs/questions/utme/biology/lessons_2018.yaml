  32:
    moments:
      - section: 'The question'
        say: 'A man with normal clotting marries a woman with haemophilia. We must find the percentage of their children expected to have the disease.'
        write: 'Normal man × haemophiliac woman, % affected $= ?$'
      - section: 'The data'
        say: 'Haemophilia is recessive and carried on the X chromosome. We write X big H for the normal gene and X small h for haemophilia.'
        write: 'Xᴴ = normal, Xʰ = haemophilia (recessive, on X)'
      - say: 'The man has one X and one Y. His X is normal, so he is X big H, Y.'
        write: 'Man: XᴴY'
      - say: 'The woman is homozygous recessive, so both her X chromosomes carry small h. She is X small h, X small h.'
        write: 'Woman: XʰXʰ'
      - section: 'The rule'
        say: 'Each child gets one X from the mother. A son gets the Y from his father, and a daughter gets his X.'
        write: 'Son: X from mother + Y.  Daughter: X from mother + father''s X'
      - section: 'The gametes'
        say: 'The man''s sperm carry either X big H or Y, and the two kinds are made in equal numbers.'
        write: '♂ gametes: Xᴴ or Y, half each'
      - say: 'Both of the woman''s X chromosomes carry small h, so every egg she makes carries X small h.'
        write: '♀ gametes: Xʰ only'
      - section: 'The offspring'
        say: 'X big H from the father with X small h from the mother gives X big H, X small h. That is a daughter with normal clotting, who is a carrier.'
        write: 'Xᴴ + Xʰ → XᴴXʰ, carrier daughter, normal'
      - say: 'Y from the father with X small h from the mother gives X small h, Y. That is a son with haemophilia.'
        write: 'Y + Xʰ → XʰY, haemophiliac son'
      - section: 'The ratio'
        say: 'Because the X big H and Y sperm are equal in number, the two kinds of child come one to one. So one child in two has the disease, which is fifty percent.'
        write: '1 affected in 2 → $\frac{1}{2} \times 100\% = 50\%$'
      - section: 'Answer'
        say: 'So fifty percent of their children would be expected to have the disease, which is option C.'
        write: '$\therefore$ 50%'
        answer: true
    traps:
      A: 'You went for zero percent. Every son must receive X small h from his mother, so some children are certainly affected.'
      B: 'You chose twenty-five percent. That is the result for a carrier mother, X big H, X small h. This mother is affected, so every son is.'
      D: 'You picked seventy-five percent. The daughters receive X big H from their father, so none of them is affected. Only the half that are sons are.'
  33:
    moments:
      - section: 'The question'
        say: 'We must find what cytokinesis ensures at the end of cell division.'
        write: 'Cytokinesis ensures that $= ?$'
      - section: 'The process'
        say: 'Cytokinesis is the division of the cytoplasm at the end of cell division.'
        write: 'Cytokinesis = division of the cytoplasm'
      - section: 'How it works'
        say: 'It comes after the nucleus has divided. In animals a furrow pinches the cell in, and in plants a cell plate forms across the middle.'
        write: 'Animal: furrow.  Plant: cell plate'
      - say: 'In doing so it shares the cytoplasm and its organelles, such as mitochondria and ribosomes, between the two daughter cells. So each one can survive and work.'
        write: 'Shares cytoplasm and organelles → each daughter can work'
      - say: 'The complete set of genes was already shared out earlier, by nuclear division, when the chromatids were pulled to the poles.'
        write: 'Genes shared earlier, by nuclear division'
      - section: 'Remember'
        say: 'Remember, karyo means nucleus and cyto means cell. Karyokinesis shares the genes, and cytokinesis shares the rest.'
        write: 'Karyokinesis → genes,  cytokinesis → the rest'
      - section: 'Answer'
        say: 'So cytokinesis ensures each daughter cell gets the necessary organelles, which is option A.'
        write: '$\therefore$ each daughter cell gets the organelles'
        answer: true
    traps:
      B: 'You went for a complete set of genes. That is what mitosis as a whole achieves, but the genes are shared out by nuclear division, before cytokinesis begins.'
      C: 'You chose new genetic combinations. Mitosis gives daughter cells identical to the parent. New combinations come from meiosis and fertilisation.'
      D: 'You picked removing worn out organelles. Organelles are shared between the daughters, not sorted to throw out old ones.'
