        write: 'Rays now focus on the retina ✓'
      - section: 'Remember'
        say: 'Remember, long sight needs a convex lens, which converges the rays. Short sight is put right with a concave, diverging lens.'
        write: 'Long → convex → converge.  Short → concave → diverge'
      - section: 'Answer'
