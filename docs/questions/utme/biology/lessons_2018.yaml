        write: 'Why saline, not water, in a drip?'
      - section: 'The rule'
        say: 'A hospital drip is normal saline, a salt solution with the same concentration as blood plasma. We say it is isotonic with the blood.'
        write: 'Normal saline = isotonic with blood plasma'
      - section: 'How it works'
        say: 'Because the concentrations match, water does not rush into or out of the blood cells by osmosis.'
        write: 'Same concentration → no osmosis in or out of cells'
      - say: 'So the salt and water balance of the body fluids is kept as it should be.'
        write: 'Composition of body fluids maintained'
      - say: 'Plain water would be too dilute. Water would enter the red cells and burst them, which is haemolysis.'
        write: 'Plain water → red cells burst (haemolysis)'
      - section: 'Answer'
        say: 'So saline is used to maintain the composition of body fluids, which is option C.'
        write: '$\therefore$ to maintain the composition of body fluids'
        answer: true
    traps:
      A: 'You went for salt as a preservative. Salt does preserve fish and meat, but the drip has salt to match the concentration of body fluids.'
      B: 'You chose preventing contamination. Sterile water would also be free of germs. The salt is there for the osmotic balance.'
      D: 'You picked more blood cells. Saline does not make blood cells. New red cells are made in the bone marrow.'
