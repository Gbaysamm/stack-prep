      <svg viewBox="88 14 620 334" width="480" height="259" role="img" aria-label="Four small animals drawn in a 2 by 2 grid, each numbered. I, top left, a short-winged grasshopper seen from the side and facing right, with short thread-like antennae, a large compound eye, a saddle-shaped pronotum, short forewings, a banded abdomen, the long hind leg folded along the body with a herringbone-ridged femur and spiny tibia, and two shorter legs under the head. II, top right, a wingless cockroach nymph seen from above, with long antennae, a broad shield-like pronotum over the head, flat segmented body, six spiny legs and a pair of cerci at the tail. III, bottom left, a box of water; at the surface hangs a comma-shaped mosquito pupa with breathing trumpets touching the surface, an eye, and its segmented abdomen curled beneath it ending in paddles; beside it a mosquito larva hangs head down from the surface by its breathing siphon. The word Water labels the box. IV, bottom right, a hairy caterpillar lying diagonally on a twig, head at the upper left, with three pairs of jointed true legs, fleshy prolegs, body rings with warts and tufts of bristles">
