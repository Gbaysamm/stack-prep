# UTME 2011 Biology, written up by hand from source/past-questions.pdf, pages 12-21.
# Q1 (the paper-type question) is left out; the other 49 questions are kept and none is dropped.
# Every answer was worked out afresh. Thirteen printed keys did not hold up: Q3 (Spirogyra is the
# smallest individual), Q4 (seed plants are angiosperms and gymnosperms), Q6 (the grasshopper and
# the caterpillar are the crop pests), Q13 (leucocytes are large and nucleated), Q14 (assimilation),
# Q21 (balance is kept by the semicircular canals), Q23 (a cockroach shows negative phototaxis),
# Q28 (plants and animals use each other's waste gases), Q31 (short lifespan), Q41 (sex-linked),
# Q42 (disease rate), Q43 (incomplete dominance), Q44 (use and disuse is Lamarck's) and Q45
# (cross breeding), with Q50 now asked about the wings as organs of flight (convergent evolution).
# Q48 had no printed key. Repairs: Q18's option C, a second "II", became IV; Q21's option C
# "perilymph" became "semicircular canals", since no printed option keeps balance; Q27's stem
# "Paramecium and protists" became "Paramecium and Amoeba"; Q28's option C now speaks of waste
# gases rather than respiratory wastes; Q50's stem names flight. Plain typos fixed throughout.
# The four organisms drawn for Q6-8 (I grasshopper, II cockroach nymph, III mosquito pupa and larva
# in water, IV caterpillar) and the fermentation apparatus for Q10-11 are traced over the printed
# figures as figure_svg.
