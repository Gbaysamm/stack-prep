# UTME 2012 Biology, written up by hand from source/past-questions.pdf, pages 22-31.
# Q1, the paper-type question, is left out. Answers were worked out afresh. Nine printed keys did
# not hold up: Q6 (secondary growth is in dicotyledons), Q16 (Loranthus, not the sundew, is a green
# parasite), Q28 (temperate crops grow in the cool montane zone), Q33 (lichens colonise bare rock
# first), Q34 (at carrying capacity the population levels off), Q38 (a bell-shaped spread of
# heights is continuous variation), Q45 (P. aurelia wins the competition), Q47 (agamas bask to warm
# up) and Q50 (the finches' beaks are comparative anatomy). Figures: the animal cell (Q2-3) and the
# young plant with its arrows (Q19-20) are traced over the printed drawings as figure_svg and the
# exam's own questions restored; the two graphs (Q38-39 and Q44-45) are redrawn over the printed
# ones. Q24-25 refer to a diagram the PDF never printed, so both are rebuilt in words (the uterus
# and the ovary). Repairs: Q2 option D
# "I" was IV; Q22 and Q26 stems tightened so one option is clearly best; Q34 stem asks about the
# population size; Q35 option B "space and rainfall" (both abiotic) became "food and rainfall";
# Q45 option C rewritten; Q44-45 graph's rising curve relabelled P. aurelia; typos fixed
# (sexual/asexual, break/beak, Loran thus, flash/flesh, Lamarek).
