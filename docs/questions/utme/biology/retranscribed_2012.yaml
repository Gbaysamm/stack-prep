  - number: 6
    stem: 'Plants that show secondary growth are usually found among the'
    options:
      A: 'thallophytes'
      B: 'pteridophytes'
      C: 'monocotyledons'
      D: 'dicotyledons'
    answer: D
    printed_key: B
    key_note: 'Secondary growth comes from a vascular cambium, which dicotyledons (and gymnosperms) have; ferns and thallophytes have none, and monocots lack a cambium.'
    subtopic: BIO.A2.d
    level: 2
    level_reason: link secondary growth to the plants that have a cambium

