  - number: 4
    stem: 'The lowest level of organization in living organisms is'
    options:
      A: 'organ'
      B: 'cell'
      C: 'system'
      D: 'tissue'
    answer: B
    printed_key: B
    subtopic: BIO.A1.c
    level: 1
    level_reason: recall the levels of organization

  - number: 5
    stem: 'Which of the following is the most complex according to their cellular level of organization?'
    options:
      A: 'Heart'
      B: 'Hair'
      C: 'Euglena'
      D: 'Hydra'
    answer: A
    printed_key: B
    key_note: 'The heart is an organ, made of several tissues; Hydra is at the tissue level, Euglena is one cell and a hair is not even a living cell, so the heart is the most complex'
    subtopic: BIO.A1.c
    level: 3
    level_reason: place each example at its level, then compare the levels

