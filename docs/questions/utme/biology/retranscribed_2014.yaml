# UTME 2014 Biology, written up by hand from source/past-questions.pdf, pages 40-48.
# Printed paper type L. Q1 (the paper-type question) is left out. Q12 and Q13 are held back,
# awaiting a real drawing: the page says "Use the diagram below" but prints none (the printed
# answers point to a transverse section of a dicot root with I on a root hair); their
# explanations are written. Answers were worked out afresh. Eight printed keys did not hold up:
# Q5 (the heart is an organ, the highest level listed), Q16 (sieve tubes are in phloem), Q20 (a
# rhizome is a perennating organ), Q28 (genetic make-up is the genotype), Q29 (light limits
# aquatic productivity), Q34 (Anabaena is the blue-green alga), Q44 (interferon is antiviral)
# and Q50 (wings of birds and bats are convergent, not adaptive radiation). Figures: the
# Euglena (Q2, Q3) and the tapeworm scolex (Q6, Q7) are traced as figure_svg over the printed
# drawings, and those four questions are back in the exam's own words. Repairs: Q21's stem now
# asks where the gametophyte is the dominant generation (all land plants alternate
# generations); Q37 option C, Q45 options A, C and D, Q48 option B, Q49 option D and Q50
# options B and D were replaced so that only one option is right; Q40 printed only three
# options, so D was added; Q14's dental formula typeset; small typing fixes.
