# UTME 2015 Biology, written up by hand from source/past-questions.pdf, pages 49-57.
# This paper prints no paper-type question. It has 49 questions; the key also lists a "50. A" with
# no question, which is ignored. Q45 and Q47 are rebuilt in words: their diagrams (labelled
# endocrine organs, and four dogs) are not in the source. The other diagrams are traced over the printed
# drawings as figure_svg and the exam's own questions kept: the plant cell (Q33-34), Rhizopus
# conjugation (Q35-36), Paramecium (Q37-38), the heart (Q39-40), the klinostat (Q41-42), the toads
# in amplexus (Q43-44) and the rat (Q48-49). Answers were worked out afresh. Printed keys changed:
# Q18 (osmosis, not diffusion), Q24 (options rewritten, territory), Q26 (biosphere), Q27
# (competition), Q40 (IV, the left ventricle), Q41 (geotropism), Q43 (amplexus), Q48
# (countershading), Q49 (tactile). Repairs: Q3 stem and option B, Q10 option C, Q11 option C, Q12
# option D, Q21 options as percentages and 100 °C, Q23 stem and option C, Q24 options B and C, Q30
# option A, Q31 stem, Q33 stem, Q41 stem and option D, Q46 stem, Q48 stem; spelling fixed
# throughout.
