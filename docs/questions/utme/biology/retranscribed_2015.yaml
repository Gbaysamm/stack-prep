  - number: 41
    stem: 'Use the diagram below. Both seedlings are kept in the dark. The experiment demonstrates'
    options:
      A: 'hydrotropism'
      B: 'phototropism'
      C: 'thigmotropism'
      D: 'geotropism'
    answer: D
    printed_key: B
    key_note: 'A slowly turning klinostat cancels the one-sided pull of gravity, so only the still radicle bends down: a response to gravity, geotropism. No one-sided light is involved.'
    subtopic: BIO.B6.a
    level: 3
    level_reason: read an experiment with a control and name the stimulus
    corrected: 'stem: "Both seedlings are kept in the dark." added, so that light from one side is ruled out; option D printed "hydrotropism" twice, so D became "geotropism"; the klinostat experiment redrawn as SVG over the printed figure'
    figure_svg: |
      <svg viewBox="0 0 1440 610" width="480" height="203" role="img" aria-label="Klinostat experiment with two germinating seedlings, each a seed with its radicle pushed sideways into a block of moist cotton wool. Top: the block is fixed to the rotating arm of a klinostat, and the radicle grows straight out horizontally. Bottom: an identical block stands still on the bench, and its radicle, which entered horizontally, has bent downwards near its tip; the bend is labelled I. A label Germinating seedlings points to both seeds">
