  - number: 40
    stem: 'Oxygenated blood is pumped to the entire body from the part labelled'
    options:
      A: 'IV'
      B: 'I'
      C: 'II'
      D: 'III'
    answer: A
    printed_key: B
    key_note: 'Printed B is I, the pulmonary artery (Q39), a vessel that takes deoxygenated blood to the lungs; IV, the thick-walled left ventricle, pumps oxygenated blood into the aorta for the whole body.'
    subtopic: BIO.B3.c
    level: 2
    level_reason: follow oxygenated blood out of the heart
    corrected: 'the heart redrawn as a textbook SVG section in the printed front view and outline: four chambers with the left ventricle''s wall clearly thicker, the septum, the tricuspid and bicuspid valves with chordae tendineae, the semilunar valves, both venae cavae, the pulmonary artery, the pulmonary veins and the aorta, labels I to IV on the same parts as the print'
    figure_svg: |
