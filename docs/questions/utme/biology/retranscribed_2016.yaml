# UTME 2016 Biology, written up by hand from source/past-questions.pdf, pages 58-66.
# This paper prints no paper-type question, so all 47 questions are kept and none is dropped.
# Answers were worked out afresh, and many printed keys did not hold up: Q11, Q15, Q16, Q18,
# Q19, Q20, Q21, Q22, Q23, Q24, Q25, Q26, Q28, Q29, Q30, Q31, Q32, Q33, Q34, Q35, Q36, Q37,
# Q39, Q40, Q41, Q42, Q43, Q44 and Q45 (see each key_note). Repairs: Q3 option B was the same
# ratio as C and became 2YY : Yy : yy; Q19 option D's molars became 2/3 so that it is the dog's
# formula; Q25 "biotic" became "abiotic", since every option is an abiotic factor; Q31 option A
# (cross-breeding is a kind of out-breeding) became "inbreeding and grafting"; Q33 option B
# "involuntary" became "voluntary", since the spinal cord does work reflexes; Q37's
# meaningless stem was rewritten to ask for the microscopic plant life of a habitat. The rice
# bar chart (Q44, Q45) is redrawn as figure_svg, with its fifth bar, printed "4", labelled 5,
# and checked over the printed chart. The vertebra drawing (Q46, Q47) is traced over the
# printed figure as figure_svg, and both questions are asked as printed. Q38 printed no rich
# source of vitamin K, so option A became green leafy vegetables. Spelling and grammar slips
# are put right.
