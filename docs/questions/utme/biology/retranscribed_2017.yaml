# UTME 2017 Biology, written up by hand from source/past-questions.pdf, pages 67-73.
# This paper prints no paper-type question, so all 40 questions are kept and none is dropped.
# Answers were worked out afresh. Five printed keys did not hold up: Q21 (2.5 g lost from 7.5 g
# of soil is 33.3%), Q24 (colour blindness, not albinism, is sex-linked), Q25 (a root has an
# epidermis, not a cuticle), Q27 (a thick fissured bark guards savanna trees against fire) and
# Q29 (the fern Dryopteris has vascular tissue; the other three are algae or a liverwort). Q38
# has no printed key. Repairs: Q19's stem now asks which organ saves water through loops of Henle;
# Q23's cut-off stem now asks for the density per m²; Q28's broken option B became "warn off
# predators"; Q40's option D now says "cannot receive from them"; Q39 options A and D were
# mended ("skin colour", "blood group"); names and spellings put right throughout. The
# drawings are traced over the printed ones: Q7 and Q19 (four excretory organs I-IV, figure_svg),
# Q32 and Q37 (a fish gill, parts I-III, figure_svg) and Q36 (four bird heads (a)-(d), printed
# with no option list, option_figures).
format_version: 1
source:
  file: docs/questions/utme/biology/source/past-questions.pdf
  exam_year: 2017
  paper_label: UTME 2017 Biology (objective)
  paper_code: UTME-2017-BIO
  pages: [67, 68, 69, 70, 71, 72, 73]
  printed_paper_type: null
  transcribed_by: hand
questions:
  - number: 1
    stem: 'Piercing and sucking mouthparts are found in'
    options:
      A: 'grasshoppers'
      B: 'mosquitoes'
      C: 'termites'
      D: 'cockroaches'
    answer: B
    printed_key: B
    subtopic: BIO.A2.e
    level: 1
    level_reason: recall which insect has piercing and sucking mouthparts

  - number: 2
    stem: 'The hormones that promote plant growth are'
    options:
      A: 'ethylene and auxins'
      B: 'auxins and gibberellins'
      C: 'cytokinins and abscisic acid'
      D: 'ethylene and gibberellins'
    answer: B
    printed_key: B
    subtopic: BIO.B9.c
    level: 1
    level_reason: recall the growth-promoting plant hormones
    corrected: 'stem: "regulate" became "promote", since ethylene and abscisic acid also regulate growth (by slowing it); options: "auxin" and "cytokinin" made plural to match'

  - number: 3
    stem: 'Which of the following pairs of organisms shows a parasitic association?'
    options:
      A: 'insect and plant'
      B: 'cattle and egret'
      C: 'shark and remora'
      D: 'tsetse fly and cattle'
    answer: D
    printed_key: D
    subtopic: BIO.C2.a
    level: 2
    level_reason: sort four pairs into kinds of association
    corrected: 'stem: "pair of organisms exhibit" became "pairs of organisms shows"; "tsetse-fly" written as tsetse fly'

  - number: 4
    stem: 'Which of the following groups of animals can withstand the rigours of arid land?'
    options:
      A: 'locust, camel, lizard and snake'
      B: 'monkey, chameleon, earthworm and grasshopper'
      C: 'monkey, grasshopper, snail and snake'
      D: 'lungfish, duck, butterfly and lizard'
    answer: A
    printed_key: A
    subtopic: BIO.C4.d
    level: 2
    level_reason: check every animal in a group against dry conditions
    corrected: 'stem: "group" became "groups" and "rigour" became "rigours"; option nouns made singular throughout so that the lists read alike'

  - number: 5
    stem: 'A suture joint is found in the'
    options:
      A: 'hip'
      B: 'ankle'
      C: 'skull'
      D: 'elbow'
    answer: C
    printed_key: C
    subtopic: BIO.B6.c
    level: 1
    level_reason: recall where an immovable joint is found

  - number: 6
    stem: 'The organelle responsible for osmoregulation in Paramecium is the'
    options:
      A: 'flame cell'
      B: 'nephridium'
      C: 'contractile vacuole'
      D: 'Malpighian tubule'
    answer: C
    printed_key: C
    subtopic: BIO.B5.a
    level: 1
    level_reason: recall the osmoregulatory organelle of a protozoan
    corrected: 'option B: "nephridia" made singular, to match the other options'

  - number: 7
    stem: 'Use the diagram to answer the question that follows. The excretory organ of an earthworm is represented by'
    options:
      A: 'IV'
      B: 'I'
      C: 'III'
      D: 'II'
    answer: C
    printed_key: C
    subtopic: BIO.B5.a
    level: 2
    level_reason: recognise the excretory organ of an annelid from its drawing
    corrected: 'the four excretory organs (I flame cell, II kidney, III nephridium, IV Malpighian tubules) traced over the printed drawing as figure_svg, so the exam''s own stem and options I to IV are restored; "that follow" became "that follows"'
    figure_svg: |
