  - number: 20
    stem: 'The process required for the formation of gametes in sexual reproduction is'
    options:
      A: 'implantation'
      B: 'fertilisation'
      C: 'mitosis'
      D: 'meiosis'
    answer: D
    printed_key: D
    subtopic: BIO.D2.b
    level: 1
    level_reason: recall the cell division that makes gametes
    corrected: 'stem: "formation of gamete" became "the formation of gametes"'

  - number: 21
    stem: 'In an experiment to determine the humus in a soil sample, the following results were obtained. Mass of dish = 20 g; mass of dry soil = 7.5 g; mass of dish + soil after burning = 25 g. The percentage of humus in the sample is'
    options:
      A: '9.1%'
      B: '37.5%'
      C: '12.5%'
      D: '33.3%'
    answer: D
    printed_key: B
    key_note: 'dish + soil before burning is 27.5 g, so 2.5 g of humus burnt off; 2.5 ÷ 7.5 × 100 = 33.3%'
    subtopic: BIO.C6.a
    level: 3
    level_reason: find the loss in mass, then turn it into a percentage
    corrected: 'stem: the results set out with = and units spaced ("20g" as 20 g); options: % added'

  - number: 22
    stem: 'The presence of termites and earthworms in the soil promotes'
    options:
      A: 'porosity and fertility'
      B: 'porosity and aeration'
      C: 'aeration and fertility'
      D: 'acidity and aeration'
    answer: C
    printed_key: C
    subtopic: BIO.C6.b
    level: 2
    level_reason: name the two main benefits soil animals bring
    corrected: 'stem: "in soil promote" became "in the soil promotes"'

  - number: 23
    stem: 'In a 15 m² habitat, the total number of Tridax plants counted using a 1.6 m² quadrat thrown randomly 50 times was 400. What is the density of Tridax per m²?'
    options:
      A: '12'
      B: '16'
      C: '8'
      D: '5'
    answer: D
    printed_key: D
    subtopic: BIO.C5.a
    level: 3
    level_reason: find the total area sampled, then divide the count by it
    corrected: 'stem: the cut-off "What is the Tridax" completed as "What is the density of Tridax per m²?"; "15m2" and "1.6m2" written as 15 m² and 1.6 m²; "quadrant" became quadrat'

  - number: 24
    stem: 'Which of the following is a sex-linked character?'
    options:
      A: 'Dwarfism'
      B: 'Albinism'
      C: 'Tongue rolling'
      D: 'Colour blindness'
    answer: D
    printed_key: B
    key_note: 'colour blindness is carried on the X chromosome; albinism is carried on an autosome'
    subtopic: BIO.D2.e
    level: 1
    level_reason: recall a sex-linked character
    corrected: 'stem: "sex-link" became "sex-linked"'

  - number: 25
    stem: 'The outermost tissue of a herbaceous root is the'
    options:
      A: 'cuticle'
      B: 'pericycle'
      C: 'epidermis'
      D: 'endodermis'
    answer: C
    printed_key: A
    key_note: 'roots have no cuticle; the outermost layer is the epidermis (piliferous layer), which bears the root hairs'
    subtopic: BIO.B1.a
    level: 1
    level_reason: recall the outer layer of a root
    corrected: 'stem: "outer-most tissue of the herbaceous roots" became "outermost tissue of a herbaceous root"'

  - number: 26
    stem: 'The tissues that transport water and manufactured food in plants are, respectively,'
    options:
      A: 'xylem and phloem'
      B: 'phloem and tracheid'
      C: 'phloem and xylem'
      D: 'xylem and tracheid'
    answer: A
    printed_key: A
    subtopic: BIO.B3.c
    level: 1
    level_reason: recall the two transport tissues in order
    corrected: 'stem: "respective" moved to the end as "respectively"'

  - number: 27
    stem: 'An adaptive feature of plants in the savanna is'
    options:
      A: 'fissured bark'
      B: 'few grasses'
      C: 'tall trees'
      D: 'long lifespan'
    answer: A
    printed_key: D
    key_note: 'the thick, fissured, corky bark of savanna trees insulates them against bush fires; a long lifespan is not a savanna adaptation'
    subtopic: BIO.C4.b
    level: 2
    level_reason: link a plant feature to fire and drought in the savanna

  - number: 28
    stem: 'A grasshopper''s cuticle is green during the rainy season and black after a bush fire. The reason for the change is to'
    options:
      A: 'obtain food'
      B: 'warn off predators'
      C: 'secure mates'
      D: 'escape detection'
    answer: D
    printed_key: D
    subtopic: BIO.A3.a
    level: 2
    level_reason: recognise camouflage from a change of colour with the background
    corrected: 'stem: "becomes green during the season and black after fire. The reasons for the change is ---" became "is green during the rainy season and black after a bush fire. The reason for the change is to"; option B: the broken "predators" became "warn off predators"'

  - number: 29
    stem: 'Which of the following is the most advanced plant?'
    options:
      A: 'Marchantia'
      B: 'Dryopteris'
      C: 'Chlamydomonas'
      D: 'Spirogyra'
    answer: B
    printed_key: D
    key_note: 'Dryopteris is a fern, with true roots and vascular tissue; Marchantia is a liverwort and the other two are algae'
    subtopic: BIO.A2.d
    level: 2
    level_reason: rank four plants by their place in plant evolution
    corrected: 'option A: "merchantia" became Marchantia'

  - number: 30
    stem: 'The soil type with the least ability to retain nutrients is'
    options:
