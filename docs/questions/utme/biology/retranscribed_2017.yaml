      B: 'clay loam'
      C: 'loam'
      D: 'sand'
    answer: D
    printed_key: D
    subtopic: BIO.C6.a
    level: 2
    level_reason: link particle size to leaching of nutrients

  - number: 31
    stem: 'A hummingbird is able to feed on nectar because its beak is'
    options:
