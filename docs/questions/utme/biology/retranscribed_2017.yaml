      B: 'short, strong and conical'
      C: 'long, slender and slightly curved'
      D: 'long, wide and slightly curved'
    answer: C
    printed_key: C
    subtopic: BIO.A3.c
    level: 2
    level_reason: match a beak shape to a way of feeding
    corrected: 'stem: "humming bird" written as hummingbird'

