# UTME 2018 Biology, written up by hand from source/past-questions.pdf, pages 74-81.
# This paper prints no paper-type question, so all 40 questions are kept and none is dropped.
# Answers were worked out afresh. Seven printed keys did not hold up: Q6 (the cell wall is
# freely permeable; the cytoplasm with its membranes is the selectively permeable layer), Q15
# (the bird's line rises a little, so it is not constant; it only varies less than the lizard's),
# Q17 (a saline drip is isotonic with the blood, not a preservative), Q33 (cytokinesis shares the
# cytoplasm and organelles; the genes are shared by nuclear division), Q35 (mutation is a source
# of variation, not an evidence of evolution), Q37 (the clasping posture is amplexus) and Q40
# (flippers and fins are analogous, so convergent evolution). Repairs: Q32's "heterozygous man"
# became a man with normal clotting, since a man carries one X and cannot be heterozygous for
# a sex-linked gene; Q9's glycolysis equations were rewritten in full; Q2 option A says
# heterotrophic rather than holozoic; Q30 option D names microspores, the true product of
# meiosis; Q34 option D "homoatomic" became homoiothermic; Q6's stem says which membrane is
# meant; plain typos fixed throughout. Three diagrams are redrawn as figure_svg over the printed
# ones: the osmometer, the lizard and bird graph, and the toads in amplexus for Q36-37.
# The food chain is printed as text, so it is typed in the stem.
