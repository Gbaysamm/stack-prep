  - number: 40
    stem: 'The flippers of a whale and the fins of a fish are examples of'
    options:
      A: 'divergent evolution'
      B: 'coevolution'
      C: 'continuous variation'
      D: 'convergent evolution'
    answer: D
    printed_key: A
    key_note: 'flippers and fins do the same job but are built differently and come from different ancestors, so they are analogous structures, the mark of convergent evolution'
    subtopic: BIO.E2.a
    level: 3
    level_reason: tell analogous from homologous structures, then name the pattern
