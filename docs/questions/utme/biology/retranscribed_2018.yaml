  - number: 37
    stem: 'Use the diagram below. The breeding posture illustrated in the diagram is known as'
    options:
      A: 'mating'
      B: 'amplexus'
      C: 'courtship display'
      D: 'reproductive swimming'
    answer: B
    printed_key: A
    key_note: 'the male clasping the female from behind while she lays is the named posture amplexus; "mating" is only the general word for pairing'
    subtopic: BIO.A2.e
    level: 2
    level_reason: name the breeding posture of toads shown in the drawing
    corrected: 'stem: "question 36 and 37" became "questions 36 and 37"; the toads in amplexus redrawn as a side-view SVG (the male on the female''s back, his forelimbs locked round her chest, egg strings trailing into the water), labels I to IV on the same parts as the print, its lower label "II" read as III'
    figure_svg: |
      <svg viewBox="20 130 1360 885" width="440" height="286" role="img" aria-label="Side view of two toads in amplexus in a pond, below a few lines of the water surface. The larger female lies facing right, her head near the surface. The smaller male lies along her back facing the same way, his head just behind hers; his forelimbs reach down and lock round her chest just behind her forelimbs, with his fingers gripping under her armpit. Both toads have broad blunt heads with raised eyes, an eardrum and a parotoid gland, warty skin, and hind legs folded beside the body, thigh forward, shank back and a webbed foot forward. A double string of eggs in jelly trails back from the female's vent into the water. Labels: I at the male's eye, II at the female's forelimb, III at the female's hind leg, IV at the male's hind foot, and Eggs at the egg strings.">
