      BIO.D2.d: "Applications of heredity"
      BIO.D2.e: "Sex-linked characters"
  BIO.D3:
    name: Biotechnology
    subtopics:
      BIO.D3.a: "Applications of biotechnology"
  BIO.E1:
    name: Theories of Evolution
    subtopics:
      BIO.E1.a: "Lamarck's and Darwin's theories"
  BIO.E2:
    name: Evidence of Evolution
    subtopics:
      BIO.E2.a: "Evidence of evolution"
