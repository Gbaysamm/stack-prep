# UTME Biology — the topics and subtopics every question is tagged with.
#
# Read from source/syllabus.pdf. The syllabus has five sections, A Variety of Organisms,
# B Form and Functions, C Ecology, D Heredity and Variations and E Evolution, each with
# numbered topics. A topic here is one numbered topic (BIO.<section><number>); a subtopic is
# one of its lettered contents, (a), (b), ... in the syllabus's own lettering, and a topic the
# syllabus does not letter has one subtopic, `a`. database/load_retranscribed_biology.py
# builds the curriculum from this file, and every retranscribed_YYYY.yaml uses these codes.
format_version: 1
topics:
  BIO.A1:
    name: Living Organisms
    subtopics:
      BIO.A1.a: "Characteristics of living things"
      BIO.A1.b: "Cell structure and functions of cell components"
      BIO.A1.c: "Levels of organization"
  BIO.A2:
    name: Evolution Among the Kingdoms
    subtopics:
      BIO.A2.a: "Monera (prokaryotes)"
      BIO.A2.b: "Protista"
      BIO.A2.c: "Fungi"
      BIO.A2.d: "Plantae"
      BIO.A2.e: "Animalia"
  BIO.A3:
    name: Structural, Functional and Behavioural Adaptations
    subtopics:
      BIO.A3.a: "Adaptive colouration"
      BIO.A3.b: "Behavioural adaptations in social animals"
      BIO.A3.c: "Structural adaptations in organisms"
  BIO.B1:
    name: Internal Structure of Plants and Mammals
    subtopics:
      BIO.B1.a: "Internal structure of a flowering plant"
      BIO.B1.b: "Internal structure of a mammal"
  BIO.B2:
    name: Nutrition
    subtopics:
      BIO.B2.a: "Modes of nutrition"
      BIO.B2.b: "Types of nutrition"
      BIO.B2.c: "Plant nutrition and photosynthesis"
      BIO.B2.d: "Animal nutrition"
  BIO.B3:
    name: Transport
    subtopics:
      BIO.B3.a: "Need for transportation"
      BIO.B3.b: "Materials for transportation"
      BIO.B3.c: "Channels for transportation"
      BIO.B3.d: "Media and mechanisms of transportation"
  BIO.B4:
    name: Respiration
    subtopics:
      BIO.B4.a: "Respiratory organs and surfaces"
      BIO.B4.b: "Mechanism of gaseous exchange"
      BIO.B4.c: "Aerobic respiration"
      BIO.B4.d: "Anaerobic respiration"
  BIO.B5:
    name: Excretion
    subtopics:
      BIO.B5.a: "Types of excretory structures"
      BIO.B5.b: "Excretory mechanisms"
      BIO.B5.c: "Excretory products of plants"
  BIO.B6:
    name: Support and Movement
    subtopics:
      BIO.B6.a: "Tropic, tactic, nastic and sleep movements"
      BIO.B6.b: "Supporting tissues in animals"
      BIO.B6.c: "Types and functions of the skeleton"
  BIO.B7:
    name: Reproduction
    subtopics:
      BIO.B7.a: "Asexual reproduction"
      BIO.B7.b: "Sexual reproduction in flowering plants"
      BIO.B7.c: "Reproduction in mammals"
  BIO.B8:
    name: Growth
    subtopics:
      BIO.B8.a: "Meaning of growth"
      BIO.B8.b: "Germination of seeds"
  BIO.B9:
    name: Co-ordination and Control
    subtopics:
      BIO.B9.a: "Nervous co-ordination"
      BIO.B9.b: "The sense organs"
      BIO.B9.c: "Hormonal control"
      BIO.B9.d: "Homeostasis"
  BIO.C1:
    name: Factors Affecting the Distribution of Organisms
    subtopics:
      BIO.C1.a: "Abiotic and biotic factors"
  BIO.C2:
    name: Symbiotic Interactions, Energy Flow and Nutrient Cycling
    subtopics:
      BIO.C2.a: "Energy flow, food chains and webs"
      BIO.C2.b: "Nutrient cycling in nature"
  BIO.C3:
    name: Natural Habitats
    subtopics:
      BIO.C3.a: "Aquatic habitats"
      BIO.C3.b: "Terrestrial and arboreal habitats"
  BIO.C4:
    name: Local (Nigerian) Biomes
    subtopics:
      BIO.C4.a: "Tropical rainforest"
      BIO.C4.b: "Guinea savanna"
      BIO.C4.c: "Sudan savanna"
      BIO.C4.d: "Desert"
      BIO.C4.e: "Highlands, montane forests and grasslands"
  BIO.C5:
    name: The Ecology of Populations
    subtopics:
      BIO.C5.a: "Population density and overcrowding"
      BIO.C5.b: "Adaptation for survival"
      BIO.C5.c: "Factors affecting population sizes"
      BIO.C5.d: "Ecological succession"
  BIO.C6:
    name: Soil
    subtopics:
      BIO.C6.a: "Types of soil and their characteristics"
      BIO.C6.b: "Components of the soil"
      BIO.C6.c: "Soil fertility"
  BIO.C7:
    name: Humans and Environment
    subtopics:
      BIO.C7.a: "Diseases"
      BIO.C7.b: "Drug abuse"
      BIO.C7.c: "Pollution and its control"
      BIO.C7.d: "Conservation of natural resources"
      BIO.C7.e: "Game reserves and national parks"
  BIO.D1:
