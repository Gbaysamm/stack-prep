format_version: 1
exam_year: 2010
subject: CHEM
explanations:
  2:
    answer: B
    steps:
      - 'A mixture is two or more substances put together without chemical combination. Its parts keep their own properties and can be separated by physical means, and it has no fixed composition.'
      - 'Blood is plasma (mostly water) carrying red cells, white cells, platelets, dissolved salts, sugar and proteins. Spin it in a centrifuge and these parts separate.'
      - 'Common salt ($\ce{NaCl}$) and washing soda ($\ce{Na2CO3.10H2O}$) are compounds with fixed formulae.'
      - 'Sand is treated as a single substance in this list: it is mainly silicon(IV) oxide, $\ce{SiO2}$, a compound.'
      - 'So blood is the mixture. Memory aid: if it varies from sample to sample and can be separated physically, it is a mixture.'
    hint: 'Which of these has no fixed formula and can be separated by spinning?'
    why:
      A: 'Common salt is the compound sodium chloride, NaCl, with a fixed formula.'
      C: 'Sand is mainly the compound silicon(IV) oxide, SiO2.'
      D: 'Washing soda is the compound sodium trioxocarbonate(IV) decahydrate, with a fixed formula.'

  3:
    answer: C
    steps:
      - 'Percentage by mass of an element = (mass of that element in one mole ÷ molar mass) × 100.'
      - 'Calcium trioxonitrate(V) is $\ce{Ca(NO3)2}$: calcium is +2 and nitrate is −1, so one mole holds two nitrogen atoms.'
      - 'Molar mass = 40 + 2(14 + 3 × 16) = 40 + 2 × 62 = 164 g mol⁻¹.'
      - 'Mass of nitrogen = 2 × 14 = 28 g.'
      - '% N = 28 ÷ 164 × 100 = 17.1%.'
      - 'The trap is B, 13.1%. It writes the formula as $\ce{CaNO3}$ and counts only one nitrogen.'
    hint: 'Write the formula first. How many nitrate groups does Ca²⁺ need?'
    why:
      A: 'Counts one nitrogen and also uses the wrong molar mass.'
      B: 'Counts one nitrogen, as if the formula were CaNO3.'
      D: 'Divides by the wrong molar mass; the whole compound weighs 164 g mol⁻¹.'

  4:
    answer: D
    steps:
      - 'Rule: a vapour condenses when its molecules lose enough kinetic energy for the attractive forces to pull them together into a liquid.'
      - 'The bottle from the refrigerator is colder than the room air around it.'
      - 'Water vapour molecules that hit the cold glass give up some of their energy to it, slow down and condense into droplets on the outside.'
      - 'So the droplets form because the water vapour in the air loses energy to the bottle. They do not come from inside the bottle.'
      - 'The trap is A. Heat always flows from hot to cold, so the cold bottle cannot give energy to the warmer air.'
    hint: 'Which way does heat flow between warm air and a cold bottle?'
    why:
      A: 'Heat flows from the warm air to the cold bottle, not the other way.'
      B: 'The milk warms up after leaving the fridge; it does not lose heat to the room.'
      C: 'That is the condition for boiling, not for condensation on the outside of the bottle.'

  5:
    answer: B
    steps:
      - 'Boyle''s law: at constant temperature, the volume of a fixed mass of gas is inversely proportional to its pressure, so P₁V₁ = P₂V₂.'
      - 'Here P₁ = P mmHg, V₁ = V cm³ and P₂ = P/2 mmHg.'
      - 'V₂ = P₁V₁ ÷ P₂ = (P × V) ÷ (P/2) = 2V cm³.'
      - 'Check: halving the pressure should let the gas spread out, so a larger volume makes sense.'
      - 'The trap is C, V/2. That treats volume as directly proportional to pressure.'
    hint: 'Pressure and volume are inversely proportional. What happens to V if P halves?'
    why:
      A: 'Four times the volume would need the pressure cut to a quarter.'
      C: 'Halving the volume would need the pressure doubled.'
      D: 'The volume must change when the pressure changes at constant temperature.'

  6:
    answer: B
    steps:
      - 'First ionization energy is the energy needed to remove one electron from each atom in a mole of gaseous atoms.'
      - 'Across a period, each element adds one proton to the nucleus, while the new electrons go into the same shell.'
      - 'Electrons in the same shell screen each other poorly, so the screening stays roughly the same while the nuclear charge rises.'
      - 'The outer electrons are pulled in more tightly, the atom gets smaller, and more energy is needed to remove an electron.'
      - 'The trap is C. Screening does not really fall across a period; the extra nuclear charge is what does the work.'
    hint: 'What grows by one with each step across a period?'
    why:
      A: 'Nuclear charge increases, not decreases, across a period.'
      C: 'The number of inner shielding shells stays the same across a period.'
      D: 'More screening would lower, not raise, the ionization energy.'

  7:
    answer: A
    steps:
      - 'Hund''s rule: electrons enter orbitals of the same sub-level singly, with parallel spins, before any pairing happens.'
      - 'Nitrogen has 7 electrons: $1s^2\ 2s^2\ 2p^3$.'
      - 'The 1s and 2s orbitals are full, so their electrons are paired.'
      - 'The three 2p electrons go one each into $2p_x$, $2p_y$ and $2p_z$, so all three are unpaired.'
      - 'The trap is C. Some students put two of the 2p electrons in one orbital, which breaks Hund''s rule.'
    hint: 'Write the configuration, then spread the 2p electrons over the three p orbitals.'
    why:
      B: 'Two unpaired electrons fits carbon or oxygen, not nitrogen.'
      C: 'Pairing two of the 2p electrons goes against Hund''s rule.'
      D: 'Only the 1s and 2s electrons are paired; the 2p electrons are not.'

  8:
    answer: B
    steps:
      - 'Fact: an atom is stable when its outermost shell is full, that is, two electrons (a duplet) for the first shell or eight (an octet) for the others.'
      - 'Helium has a duplet ($1s^2$); neon, argon and the rest have an octet in their outermost shell.'
      - 'With nothing to gain, lose or share, they hardly react. This is why other atoms bond: to reach the same arrangement.'
      - 'The trap is C. Being in group zero is where they sit, not the reason they are stable.'
    hint: 'What do other atoms try to reach when they form bonds?'
    why:
      A: 'Noble gases have full outermost shells, not empty ones.'
      C: 'Group zero is their position in the table, a result of their structure, not the cause of stability.'
      D: 'Volatility is a physical property and does not explain chemical stability.'

  9:
    answer: B
    steps:
      - 'Rule: the maximum number of electrons in a shell is 2n², where n is the shell number.'
      - 'The shells are K (n = 1), L (n = 2), M (n = 3), N (n = 4).'
      - 'For the L shell, 2n² = 2 × 2² = 8.'
      - 'The trap is C, 18. That is the M shell, n = 3.'
    hint: 'L is the second shell. Put n = 2 into 2n².'
    why:
      A: '2 is the capacity of the K shell, n = 1.'
      C: '18 is the capacity of the M shell, n = 3.'
      D: '32 is the capacity of the N shell, n = 4.'

  10:
    answer: A
    steps:
      - 'Fact: the period number tells you how many electron shells an atom has.'
      - 'Sodium (2,8,1) and chlorine (2,8,7) are both in period 3 and both use three shells.'
      - 'Each element has its own atomic number, and properties change steadily across a period.'
      - 'Memory aid: period = rows = shells; group = columns = outer electrons, which decide chemical properties.'
    hint: 'What do sodium and chlorine have in common in their electron arrangements?'
    why:
      B: 'Every element has a different atomic number.'
      C: 'Elements in the same group, not period, have similar chemical properties.'
      D: 'Physical properties change from metal to non-metal across a period.'

  11:
    answer: C
    steps:
      - 'Nuclear fusion is the joining of two light nuclei to form a heavier nucleus, with the release of a large amount of energy.'
      - 'Here deuterium, $\ce{^{2}_{1}H}$, and tritium, $\ce{^{3}_{1}H}$, join to form helium-4 and a neutron.'
      - 'Check the balance: mass numbers 2 + 3 = 4 + 1, and atomic numbers 1 + 1 = 2 + 0.'
      - 'Two small nuclei become one bigger one, so this is fusion, the reaction that powers the sun.'
      - 'The trap is D. Fission is the opposite: a heavy nucleus such as uranium-235 splits into smaller ones.'
    hint: 'Are small nuclei joining together, or a big nucleus breaking up?'
    why:
      A: 'Alpha decay is one unstable nucleus giving out a helium nucleus on its own; here two nuclei combine.'
      B: 'Artificial transmutation bombards a nucleus with a particle to make a new element; this is light nuclei fusing for energy.'
      D: 'Fission splits a heavy nucleus; here two light nuclei join.'

  12:
    answer: D
    steps:
      - 'Fact: neon glows bright orange-red when an electric discharge passes through it at low pressure.'
      - 'Red light is scattered less by water droplets than other colours, so the neon glow carries well through fog and mist.'
      - 'That is why neon is used in aerodrome (airport) beacons and in advertising signs.'
      - 'Memory aid: "neon signs, neon beacons".'
      - 'The trap is A. Krypton is used in some flash lamps and fluorescent tubes, but the classic fog-piercing beacon gas is neon.'
    hint: 'Which noble gas gives the red glow of advertising signs?'
    why:
      A: 'Krypton is used in some photographic flash and high-intensity lamps, not as the classic beacon gas.'
      B: 'Argon is used to fill electric bulbs and for welding.'
      C: 'Helium is used in balloons and airships and in diving gas mixtures.'

  13:
    answer: C
    steps:
      - 'Rule: permanent hardness is caused by dissolved $\ce{CaSO4}$, $\ce{MgSO4}$, $\ce{CaCl2}$ or $\ce{MgCl2}$. Boiling does not remove it, because these salts do not decompose on heating.'
      - 'It is removed by a chemical that turns the Ca²⁺ and Mg²⁺ ions into a precipitate: washing soda, caustic soda, ion exchange, or by distillation.'
      - 'With caustic soda: $\ce{Mg^2+ + 2OH- -> Mg(OH)2 v}$, and calcium is thrown out as the sparingly soluble calcium hydroxide.'
      - 'The ions that caused the hardness are removed as solid, so the water is softened.'
      - 'The trap is D. Boiling removes only temporary hardness, which comes from hydrogentrioxocarbonates(IV).'
    hint: 'Boiling only works on hydrogentrioxocarbonates(IV). What can precipitate Ca²⁺ and Mg²⁺ from sulphates?'
    why:
      A: 'The hardness ions are dissolved, so filtration cannot remove them.'
      B: 'Slaked lime (Clark''s method) removes temporary hardness only.'
      D: 'Boiling removes only temporary hardness.'

  14:
    answer: B
    steps:
      - 'Fact: a hygroscopic substance absorbs water vapour from the air without dissolving in it.'
      - 'That is exactly what a drying agent must do: take water out of a gas or liquid.'
      - 'Examples: concentrated $\ce{H2SO4}$, anhydrous $\ce{CaCl2}$ and quicklime, $\ce{CaO}$.'
      - 'The trap is C. Efflorescent substances do the opposite: they lose water of crystallization to the air.'
      - 'Memory aid: "hygro" means moisture, so hygroscopic means moisture-grabbing.'
    hint: 'A drying agent must take in water. Which word means that?'
    why:
      A: 'Amphoteric describes reacting as both an acid and a base, not drying.'
      C: 'Efflorescent substances give water out to the air instead of taking it in.'
      D: 'Many drying agents, such as quicklime, are basic, not acidic.'

  15:
    answer: B
    steps:
      - 'Solubility in mol dm⁻³ is the number of moles of solute that saturate 1000 g (about 1 dm³) of water at that temperature.'
      - 'Molar mass of $\ce{CuSO4}$ = 64 + 32 + 4 × 16 = 160 g mol⁻¹.'
      - 'Scale up: 40 g in 100 g of water means 40 × 10 = 400 g in 1000 g of water.'
      - 'Moles = 400 g ÷ 160 g mol⁻¹ = 2.50 mol, so the solubility is 2.50 mol dm⁻³.'
      - 'The trap is D, 0.25. That forgets to scale from 100 g up to 1000 g of water.'
    hint: 'Scale the mass to 1000 g of water first, then change grams to moles.'
    why:
      A: 'Uses a molar mass of 100 instead of 160 g mol⁻¹.'
      C: 'Gives the mass ratio 40 ÷ 100 without changing to moles.'
      D: 'Finds the moles in 100 g of water and forgets to scale to 1000 g.'

  16:
    answer: C
    steps:
      - 'Rule: choose the stain remover by what the stain is made of.'
      - 'Tea and coffee stains contain tannins, which are weakly acidic. A warm solution of borax (sodium tetraborate) is mildly alkaline and lifts them out.'
      - 'Kerosene and turpentine dissolve grease, oil and paint; ammonia solution is used on grass, perspiration and some blood stains.'
      - 'So coffee stains come out best with a solution of borax in water.'
      - 'Memory aid: "borax for brews" (tea and coffee).'
    hint: 'Coffee is a water-based drink with tannins, not grease. Which option is a mild alkaline solution?'
    why:
      A: 'Kerosene dissolves grease and oil stains, not water-based coffee.'
      B: 'Turpentine dissolves paint and grease.'
      D: 'Ammonia solution is used for grass, perspiration and some blood stains.'

  17:
    answer: B
    steps:
      - 'Fact: carbon(II) oxide, $\ce{CO}$, combines with haemoglobin in red blood cells to form carboxyhaemoglobin.'
      - 'It binds about 200 times more strongly than oxygen, so the haemoglobin can no longer carry oxygen round the body.'
      - 'The tissues are starved of oxygen, which causes headache, dizziness and, in a closed room, death.'
      - 'This is why running a generator indoors is so dangerous.'
      - 'The trap is C. CO competes with oxygen for haemoglobin, not with carbon(IV) oxide.'
    hint: 'What does haemoglobin normally carry, and what takes its place?'
    why:
      A: 'Nerve damage can follow, but only as a result of oxygen starvation.'
      C: 'CO takes the place of oxygen on haemoglobin, not carbon(IV) oxide.'
      D: 'CO is not known for causing lung cancer; it acts on the blood.'

  18:
    answer: B
    steps:
      - 'Rust is hydrated iron(III) oxide, $\ce{Fe2O3.xH2O}$, a basic oxide.'
      - 'A dilute acid dissolves a basic oxide to form a salt and water: $\ce{Fe2O3 + 6HCl -> 2FeCl3 + 3H2O}$.'
      - 'Dilute hydrochloric acid is used to pickle (clean) steel before it is galvanized or painted, because the chloride formed is soluble and washes away.'
      - 'The trap is D. Tetraoxosulphate(VI) acid can also be used, but hydrochloric acid is the standard rust remover and works quickly at room temperature.'
    hint: 'Rust is a basic oxide. Which acid is used to pickle steel?'
    why:
      A: 'Boric acid is too weak and is used as a mild antiseptic.'
      C: 'Trioxonitrate(V) acid is a strong oxidizing agent and attacks the iron itself.'
      D: 'Not the usual rust remover; hydrochloric acid is preferred for pickling iron.'

  19:
    answer: B
    steps:
      - 'Rule: moles = concentration × volume, and the balanced equation gives the mole ratio.'
      - 'Equation: $\ce{H2SO4 + 2NaOH -> Na2SO4 + 2H2O}$, so 1 mol of acid reacts with 2 mol of alkali.'
      - 'Moles of NaOH = 0.1 mol dm⁻³ × 25/1000 dm³ = 0.0025 mol.'
      - 'Moles of $\ce{H2SO4}$ = 0.0025 ÷ 2 = 0.00125 mol.'
      - 'Volume of acid = 0.00125 mol ÷ 0.5 mol dm⁻³ = 0.0025 dm³ = 2.5 cm³.'
      - 'The trap is A, 5.0 cm³. It forgets that one $\ce{H2SO4}$ neutralizes two NaOH.'
    hint: 'How many moles of NaOH does one mole of H2SO4 need?'
    why:
      A: 'Uses a 1 : 1 mole ratio instead of 1 : 2.'
      C: 'Mixes up the concentrations and volumes in the formula.'
      D: 'Divides the alkali concentration by the volume instead of working through moles.'

  20:
    answer: A
    steps:
      - 'Fact: methyl orange is red in acid, orange near its end point, and yellow in alkali.'
      - 'In an alkaline medium it therefore turns yellow.'
      - 'Memory aid: "Methyl orange: red acid, yellow alkali", the colours of a sunset from top to bottom.'
      - 'The trap is B. Pink is the colour of phenolphthalein in alkali.'
    hint: 'Methyl orange shows red in acid. What colour does it show at the other end?'
    why:
      B: 'Pink is phenolphthalein in alkali.'
      C: 'Orange is its colour at the end point, between acid and alkali.'
      D: 'Red is its colour in acid.'

  21:
    answer: B
    steps:
      - 'Solubility rules: all sodium salts are soluble; chlorides are soluble except silver and lead(II) chloride; sulphates are soluble except barium and lead, with calcium sulphate only slightly soluble.'
      - '$\ce{CaSO4}$ dissolves a little (about 0.2 g per 100 g of water), which is why it causes permanent hardness.'
      - '$\ce{AgCl}$ is practically insoluble and $\ce{PbCl2}$ is insoluble in cold water, though it dissolves in hot water.'
      - '$\ce{Na2CO3}$ is freely soluble.'
      - 'So the slightly soluble salt is calcium tetraoxosulphate(VI).'
    hint: 'Which salt dissolves just enough to make water permanently hard?'
    why:
      A: 'Silver chloride is insoluble; it is the white precipitate in the chloride test.'
      C: 'Sodium salts are all soluble.'
      D: 'Lead(II) chloride is insoluble in cold water and dissolves only in hot water.'

  22:
    answer: C
    steps:
      - 'Rule: the reducing agent is the species that is oxidized, meaning its oxidation number goes up because it loses electrons.'
      - 'Equation: $\ce{6AgNO3 + PH3 + 3H2O -> 6Ag + H3PO3 + 6HNO3}$.'
      - 'Silver: +1 in $\ce{AgNO3}$ to 0 in Ag. It gains electrons, so $\ce{AgNO3}$ is reduced and is the oxidizing agent.'
      - 'Phosphorus: in $\ce{PH3}$, P + 3(+1) = 0, so P = −3. In $\ce{H3PO3}$, 3(+1) + P + 3(−2) = 0, so P = +3. It rises by 6, so $\ce{PH3}$ is oxidized.'
      - 'Check: 6 Ag⁺ each gain 1 electron = 6 electrons, matching the 6 lost by one P.'
      - 'So $\ce{PH3}$ is the reducing agent. The trap is D: $\ce{AgNO3}$ changes too, but it is reduced, so it is the oxidizing agent.'
    hint: 'Find the atom whose oxidation number goes up.'
    why:
      A: 'HNO3 is a product; nitrogen stays at +5 throughout.'
      B: 'In water, H stays +1 and O stays −2, so it is neither oxidized nor reduced.'
      D: 'AgNO3 is reduced (Ag +1 to 0), so it is the oxidizing agent.'

  23:
    answer: A
    steps:
      - 'Rule for a complex salt: name the cation first, then the complex anion. In the anion, give the number and name of the ligands, then the central metal with the ending "-ate" and its oxidation number in Roman numerals.'
      - 'In $\ce{LiAlH4}$ the cation is Li⁺ and the complex anion is $\ce{AlH4-}$, with four hydride ligands (tetrahydrido).'
      - 'Oxidation number of Al: x + 4(−1) = −1, so x = +3.'
      - 'Name: lithium tetrahydridoaluminate(III).'
      - 'The trap is D. "Lithium aluminium hydride" is the common name, not the IUPAC name.'
    hint: 'Name the cation first, then the complex anion ending in "-ate".'
    why:
      B: 'Puts the complex part first and drops the "-ate" ending and oxidation number.'
      C: 'Puts the ligands before the cation; the cation must come first.'
      D: 'This is the common trade name, not the IUPAC name.'

  24:
    answer: D
    steps:
      - 'Rule: coating iron with a more reactive metal gives sacrificial protection. This is galvanizing.'
      - 'Zinc is above iron in the electrochemical series, so if the coating is scratched, zinc corrodes instead of iron: $\ce{Zn -> Zn^2+ + 2e-}$.'
      - 'Gold, silver and copper are below iron. They protect only while the coating is unbroken; once scratched, iron corrodes even faster.'
      - 'So zinc is the coating that keeps protecting the iron. Think of galvanized roofing sheets.'
    hint: 'Which of these metals is more reactive than iron?'
    why:
      A: 'Gold is less reactive than iron and far too expensive for coating iron.'
      B: 'Silver is less reactive than iron, so a scratch speeds up rusting.'
      C: 'Copper is less reactive than iron, so a scratched coating makes the iron corrode faster.'

  25:
    answer: B
    steps:
      - 'Faraday''s first law: Q = I × t, and 1 faraday (96 500 C) is one mole of electrons.'
      - 'Electrode equation: $\ce{Al^3+ + 3e- -> Al}$, so 3 F deposit 1 mol (27 g) of aluminium.'
      - 'Q = 10 A × 1930 s = 19 300 C.'
      - 'Faradays = 19 300 C ÷ 96 500 C mol⁻¹ = 0.2 F.'
      - 'Mass of Al = 0.2 ÷ 3 × 27 g = 1.8 g.'
      - 'The trap is C, 5.4 g. It uses 1 F per mole, forgetting that Al³⁺ needs three electrons.'
    hint: 'How many faradays are needed to deposit one mole of Al³⁺?'
    why:
      A: 'Gives the number of faradays, 0.2, instead of the mass.'
      C: 'Uses 1 F per mole instead of 3 F for Al³⁺.'
      D: 'Does not follow from Q = It and the 3 F per mole ratio.'

  26:
    answer: A
    steps:
      - 'Rule: entropy is a measure of disorder. It increases (ΔS positive) when a solid or liquid forms gas, or when the number of gas particles increases.'
      - 'Thermal dissociation of ammonium chloride: $\ce{NH4Cl(s) -> NH3(g) + HCl(g)}$.'
      - 'One mole of ordered solid becomes two moles of gas, so the disorder rises sharply and ΔS is positive.'
      - 'Condensation is the reverse: free-moving gas molecules become a more ordered liquid, so ΔS is negative.'
      - 'The trap is B. Acid and base ions combining into water molecules gives fewer free particles, not more disorder.'
    hint: 'Look for the change that turns a solid into gases.'
    why:
      B: 'H⁺ and OH⁻ combine into water, so particles become fewer and more ordered.'
      C: 'The acid ions become surrounded by ordered water molecules; there is no large gain in disorder.'
      D: 'Steam turning to water is gas to liquid, so disorder falls.'

  27:
    answer: D
    steps:
      - 'Rule: the change in free energy is ΔG = ΔH − TΔS. A reaction is spontaneous when ΔG is negative.'
      - 'Exothermic means heat is given out, so ΔH is negative.'
      - 'Great disorder means ΔS is large and positive, so −TΔS is large and negative.'
      - 'ΔG = (negative) − (large positive × T) = a large negative value, so the free energy decreases a lot.'
      - 'Such a reaction is spontaneous at every temperature. The trap is C, which gets the sign of ΔG the wrong way round.'
    hint: 'Put the signs of ΔH and ΔS into ΔG = ΔH − TΔS.'
    why:
      A: 'A reaction with a large negative ΔG goes forward readily; it is not static.'
      B: 'At equilibrium ΔG = 0, not large and negative.'
      C: 'Both terms make ΔG negative, so free energy falls, not rises.'

  28:
    answer: D
    steps:
      - 'Rule: a catalyst provides an alternative route for the reaction with a lower activation energy (energy barrier).'
      - 'Equation: $\ce{2KClO3 ->[MnO2][heat] 2KCl + 3O2}$.'
      - 'With a lower barrier, more particles have enough energy to react at a lower temperature, so moderate heat is enough.'
      - '$\ce{MnO2}$ is unchanged in mass and composition at the end.'
      - 'The trap is C. The catalyst does increase the rate, but the question asks how it acts, and it does so by lowering the energy barrier.'
    hint: 'Why does the reaction now need less heat to get started?'
    why:
      A: 'The reaction is of a solid in an open tube; a catalyst does not change the pressure.'
      B: 'Grinding increases surface area; MnO2 works by changing the reaction path.'
      C: 'A faster rate is the result, not the way the catalyst acts.'

  29:
    answer: A
    steps:
      - 'Rule: the smaller the pieces of a solid reactant, the larger its surface area, and the faster the reaction.'
      - 'Equation: $\ce{CaCO3(s) + 2HCl(aq) -> CaCl2(aq) + H2O(l) + CO2(g)}$.'
      - 'In the graph, the only difference between the two curves is powdered marble against marble chips: the same substance in different particle sizes.'
      - 'The powdered curve is steeper and finishes at t₁, sooner than the chips at t₂. Both stop at the same mass of $\ce{CO2}$ because the same amount of marble reacted.'
      - 'So the graph shows the effect of surface area. The trap is B: no catalyst is mentioned on either curve.'
    hint: 'What is different between the two curves on the graph?'
    why:
      B: 'Both curves use only marble and acid; no catalyst is labelled.'
      C: 'Pressure affects gas reactants; here a solid reacts with a solution.'
      D: 'The acid is the same for both; only the size of the marble pieces changes.'

  30:
    answer: C
    steps:
      - 'Rule (Le Chatelier): raising the temperature favours the endothermic direction. The equilibrium constant changes only with temperature.'
      - 'Equation: $\ce{2H2(g) + O2(g) <=> 2H2O(g)}$, with ΔH negative, so the forward reaction is exothermic and the backward reaction is endothermic.'
      - 'Raising the temperature shifts the equilibrium to the left, so there is less $\ce{H2O}$ and more $\ce{H2}$ and $\ce{O2}$.'
      - '$K = \frac{[\ce{H2O}]^2}{[\ce{H2}]^2[\ce{O2}]}$: the top gets smaller and the bottom bigger, so K decreases.'
      - 'The trap is A. Pressure and concentration leave K unchanged, but temperature always changes it.'
    hint: 'Which direction is endothermic, and does heat push the reaction that way?'
    why:
      A: 'K depends on temperature, so it must change.'
      B: 'The equilibrium shifts but does not vanish; K falls, it does not become zero.'
      D: 'K would increase only for an endothermic forward reaction.'

  31:
    answer: D
    steps:
      - 'Fact: the brown-ring test is the test for the trioxonitrate(V) (nitrate) ion, $\ce{NO3-}$.'
      - 'Concentrated $\ce{H2SO4}$ and $\ce{Fe^2+}$ reduce the nitrate to nitrogen(II) oxide, $\ce{NO}$.'
      - 'The NO joins with more iron(II) ions to form $\ce{[Fe(NO)]^2+}$, which shows as a brown ring where the dense acid layer meets the solution.'
      - 'So a brown ring confirms $\ce{NO3-}$.'
    hint: 'Which ion is the brown-ring test named for?'
    why:
      A: 'Carbonate gives effervescence of CO2 with dilute acid, which turns lime water milky.'
      B: 'Chloride gives a white precipitate with acidified silver trioxonitrate(V).'
      C: 'Sulphate gives a white precipitate with acidified barium chloride.'

  32:
    answer: A
    steps:
      - 'Fact: copper with moderately dilute (about 50%) trioxonitrate(V) acid gives nitrogen(II) oxide, NO.'
      - 'Equation: $\ce{3Cu + 8HNO3 -> 3Cu(NO3)2 + 4H2O + 2NO}$.'
      - 'NO is almost insoluble in water, so it can be collected over water, as in the diagram.'
      - 'In air, the colourless NO turns brown as it forms $\ce{NO2}$, but the gas in the jar is NO.'
      - 'The trap is B. Concentrated acid gives $\ce{NO2}$, which dissolves in water and could not be collected this way.'
    hint: 'Is the acid concentrated or dilute, and is the gas collected over water?'
    why:
      B: 'NO2 comes from concentrated acid and dissolves in water, so it is not collected over water.'
      C: 'N2O is made by heating ammonium trioxonitrate(V), not from copper and acid.'
      D: 'N2O4 is the dimer of NO2 and forms on cooling NO2, not here.'

  33:
    answer: A
    steps:
      - 'Fact: a rocket fuel needs an oxidizer to burn the fuel without air.'
