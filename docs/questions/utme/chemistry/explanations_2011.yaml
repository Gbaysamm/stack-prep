format_version: 1
exam_year: 2011
subject: CHEM
explanations:
  2:
    answer: B
    steps:
      - 'Concentration (mol dm⁻³) = number of moles ÷ volume in dm³, and moles = mass ÷ molar mass.'
      - 'Molar mass of $\ce{NaOH}$ = 23 + 16 + 1 = 40 g mol⁻¹.'
      - 'Moles = 2 g ÷ 40 g mol⁻¹ = 0.05 mol.'
      - 'Volume = 100 cm³ = 100 ÷ 1000 = 0.1 dm³.'
      - 'Concentration = 0.05 mol ÷ 0.1 dm³ = 0.50 mol dm⁻³.'
      - 'The trap is C, 0.05 mol dm⁻³. That is the number of moles, not the concentration. You must still divide by the volume in dm³.'
    hint: 'Find the moles first, then change 100 cm³ into dm³.'
    why:
      A: 'Uses a wrong molar mass for NaOH, then scales the volume.'
      C: 'Stops at the number of moles and forgets to divide by 0.1 dm³.'
      D: 'Does not come from any correct use of the mass and the volume.'
  3:
    answer: D
    steps:
      - 'The kinetic theory says particles in a gas have the most energy and move most freely; particles in a solid have the least energy and only vibrate about fixed points.'
      - 'So from solid to liquid to gas, kinetic energy and random motion increase, and orderliness decreases.'
      - 'Going the other way, from gas to liquid to solid, orderliness increases and random motion decreases.'
      - 'Statement D says random motion increases from gas to solid. That is the wrong way round, so D is not correct.'
      - 'Remember: solid, liquid, gas is the order of rising energy and rising disorder.'
    hint: 'In which state do the particles move about most freely?'
    why:
      A: 'True: gas particles have more kinetic energy than solid particles.'
      B: 'True: gas particles move more randomly than liquid particles.'
      C: 'True: a liquid is more ordered than a gas.'
  4:
    answer: A
    steps:
      - 'Chromatography separates the parts of a mixture by how strongly each is held by the stationary phase compared with how well it dissolves in the moving solvent.'
      - 'In a column, the solvent carries each constituent down the column at its own speed.'
      - 'Those held weakly move fast, those held strongly move slowly, so they come out as separate bands.'
      - 'So the principle is that the constituents move at different speeds in the column.'
      - 'The trap is C. The constituents do not react with the solvent; chromatography is a physical separation.'
    hint: 'Why do the coloured bands spread apart as the solvent runs down?'
    why:
      B: 'The constituents do not need to dissolve in each other; they must separate.'
      C: 'Separation is physical; the constituents do not react with the solvent.'
      D: 'If they reacted with each other there would be new substances, not a separation.'
  5:
    answer: B
    steps:
      - 'Boyle''s law: for a fixed mass of an ideal gas at constant temperature, PV = constant.'
      - 'So when PV is plotted against P, an ideal gas gives a straight horizontal line: PV does not change as P changes.'
      - 'Only line N is flat.'
      - 'Lines K, L and M bend or rise because real gases have forces between molecules and molecules of their own volume.'
      - 'The trap is L, a straight line. A straight line is not enough; for an ideal gas the line must also be horizontal.'
    hint: 'If PV is constant, what does a graph of PV against P look like?'
    why:
      A: 'M dips and then rises: a real gas behaving non-ideally.'
      C: 'K curves, so PV changes with pressure: a real gas.'
      D: 'L is straight but slopes upwards, so PV still changes with P.'
  6:
    answer: B
    steps:
      - 'Across a period, each element has one more proton and one more electron than the one before it.'
      - 'The extra electron goes into the same outer shell, so the number of valence electrons rises from 1 to 8 across the period.'
      - 'Elements in the same group have the same number of valence electrons; elements in the same period have the same number of shells.'
      - 'Non-metallic character increases across a period, from sodium (metal) to chlorine (non-metal).'
      - 'The trap is swapping group and period. Remember: group number = valence electrons, period number = shells.'
    hint: 'What changes by one each time you move one step across a period?'
    why:
      A: 'Non-metallic properties increase, not decrease, across a period.'
      C: 'It is the elements in the same period that have the same number of shells.'
      D: 'It is the elements in the same group that have the same number of valence electrons.'
  7:
    answer: A
    steps:
      - 'Relative atomic mass = the sum of (mass number × fraction of each isotope).'
      - 'Lithium-7 makes up 90%, so its fraction is 0.9; lithium-6 makes up 10%, so its fraction is 0.1.'
      - 'Relative atomic mass = (7 × 0.9) + (6 × 0.1) = 6.3 + 0.6 = 6.9.'
      - 'Check: the answer must lie between 6 and 7, and close to 7 because most of the atoms are lithium-7. 6.9 fits.'
      - 'The trap is B, 7.1. An average can never be bigger than the heaviest isotope.'
    hint: 'Multiply each mass number by its fraction, then add.'
    why:
      B: 'Larger than 7, which no average of 6 and 7 can be.'
      C: 'Too close to 6; it gives too much weight to the rarer isotope.'
      D: 'An arithmetic slip; 6.3 + 0.6 is 6.9.'
  8:
    answer: B
    steps:
      - 'The atomic number is the number of protons in the nucleus.'
      - 'The mass number is protons + neutrons.'
      - 'The atomic number is 15, so there are 15 protons.'
      - 'The neutrons are 31 − 15 = 16.'
      - 'The trap is A, 16. That is the number of neutrons, not protons.'
    hint: 'Which number tells you the protons straight away?'
    why:
      A: 'This is the number of neutrons, 31 − 15.'
      C: 'Adds the atomic number to the mass number, which has no meaning.'
      D: 'This is the mass number, protons plus neutrons.'
  9:
    answer: D
    steps:
      - 'Iodine is made of $\ce{I2}$ molecules. Inside each molecule the two atoms share a covalent bond.'
      - 'Between one molecule and the next there are only weak van der Waals forces.'
      - 'These weak forces hold the molecular lattice together, which is why iodine is soft and sublimes easily on warming.'
      - 'The trap is C, hydrogen bond. Hydrogen bonds need H joined to N, O or F, and iodine has no hydrogen.'
    hint: 'What holds one non-polar molecule to the next?'
    why:
      A: 'A dative bond is a covalent bond inside a molecule or ion, not between molecules.'
      B: 'Metallic bonding is found in metals; iodine is a non-metal.'
      C: 'Iodine has no hydrogen, so there can be no hydrogen bonds.'
  10:
    answer: A
    steps:
      - 'The particles in a crystal are spaced about 0.1 nm apart.'
      - 'X-rays have wavelengths of the same size, so a crystal diffracts them.'
      - 'The diffraction pattern shows how the particles are arranged. This is X-ray diffraction.'
      - 'The trap is B, γ-rays. They are also electromagnetic waves, but they are used in radiotherapy and sterilising, not to study crystals.'
    hint: 'Which radiation has a wavelength about the size of the gap between atoms?'
    why:
      B: 'γ-rays are used in medicine and sterilising, not for crystal structure.'
      C: 'α-particles are helium nuclei; they are stopped by thin paper.'
      D: 'β-particles are fast electrons, not the method used for crystal lattices.'
  11:
    answer: B
    steps:
      - 'When a saturated solution is cooled, the mass deposited = solubility at the higher temperature − solubility at the lower temperature, scaled to the volume used.'
      - 'From the graph, the solubility at 55 °C is 7.0 mol dm⁻³ and at 40 °C it is 6.0 mol dm⁻³.'
      - 'Solute deposited from 1 dm³ = 7.0 − 6.0 = 1.0 mol.'
      - '200 cm³ = 0.2 dm³, so solute deposited = 1.0 mol dm⁻³ × 0.2 dm³ = 0.20 mol.'
      - 'The trap is A, 0.10 mole. It halves the answer by misreading the graph or the volume. Read each value carefully and convert 200 cm³ to 0.2 dm³.'
    hint: 'Read both solubilities, subtract, then find what that is for 0.2 dm³.'
    why:
      A: 'Half the right amount; a misreading of the graph or of the volume.'
      C: 'Uses 0.01 dm³ or a wrong reading; 200 cm³ is 0.2 dm³.'
      D: 'Ten times too small; the volume was taken as 0.02 dm³.'
  12:
    answer: A
    steps:
      - 'In water treatment, fine particles of clay and dirt stay suspended because they are too small to settle.'
      - 'Sodium aluminate(III), like alum, forms a jelly-like aluminium hydroxide in water.'
      - 'This jelly traps the fine particles and makes them clump together and settle. That is coagulation.'
      - 'Germs are killed later by chlorination, and fluoride is added to protect teeth.'
      - 'The trap is D. Killing germs is the job of chlorine, not the aluminate.'
    hint: 'Which step in water treatment makes tiny suspended particles settle?'
    why:
      B: 'Lime, not sodium aluminate, is used to correct acidity.'
      C: 'Iodine prevents goitre and fluoride prevents tooth decay.'
      D: 'Germs are killed by chlorine.'
  13:
    answer: A
    steps:
      - 'Write the configurations. Atomic number 12: 2, 8, 2 (magnesium, a metal). Atomic number 17: 2, 8, 7 (chlorine, a non-metal).'
      - 'X loses its two outer electrons to become $\ce{X^2+}$; each Y gains one electron to become $\ce{Y^-}$.'
      - 'The ions are held by strong electrostatic attraction, so the bond is electrovalent (ionic), giving $\ce{XY2}$ like $\ce{MgCl2}$.'
      - 'Rule: a metal with a non-metal usually gives an electrovalent bond.'
      - 'The trap is C, covalent. Covalent bonds form between two non-metals that share electrons.'
    hint: 'Is element 12 a metal or a non-metal? What about element 17?'
    why:
      B: 'Metallic bonding is between atoms of metals only.'
      C: 'Covalent bonds are shared pairs between non-metals.'
      D: 'A dative bond needs one atom to give both electrons of a shared pair.'
  14:
    answer: B
    steps:
      - 'Hard water does not form lather easily with soap because it contains dissolved calcium and magnesium salts.'
      - 'Temporary hardness is caused by calcium (or magnesium) hydrogentrioxocarbonate(IV), $\ce{Ca(HCO3)2}$; it is removed by boiling.'
      - 'Permanent hardness is caused by calcium (or magnesium) tetraoxosulphate(VI), $\ce{CaSO4}$; boiling does not remove it.'
      - 'So the two main causes are the calcium hydrogentrioxocarbonate(IV) and the calcium tetraoxosulphate(VI).'
      - 'The trap is D. Sodium salts never cause hardness; only calcium and magnesium ions do.'
    hint: 'Which metal ions react with soap to form scum?'
    why:
      A: 'The hydroxides are only slightly soluble and are not the usual cause of hardness.'
      C: 'Sodium hydroxide does not make water hard; sodium ions do not form scum.'
      D: 'Sodium chloride does not cause hardness.'
  15:
    answer: B
    steps:
      - 'Rule: like dissolves like. Iodine and naphthalene are non-polar molecular solids, so they dissolve in organic solvents.'
      - 'Carbon(IV) sulphide, ethanol and benzene all dissolve both solids. Tincture of iodine, for example, is iodine in ethanol.'
      - 'The second condition is that the solvent mixes completely with water. Ethanol has an $\ce{-OH}$ group that hydrogen-bonds with water, so it mixes in all proportions.'
      - 'Carbon(IV) sulphide and benzene are non-polar and form a separate layer with water.'
      - 'So the only solvent that meets both conditions is ethanol.'
    hint: 'Which of these solvents has an -OH group that lets it mix with water?'
    why:
      A: 'Dissolves both solids but does not mix with water.'
      C: 'Naphthalene is insoluble in water and iodine dissolves only slightly.'
      D: 'Dissolves both solids but floats on water as a separate layer.'
  16:
    answer: D
    steps:
      - 'Air is about 78% nitrogen, 21% oxygen and about 0.93% argon, with small amounts of carbon(IV) oxide and other noble gases.'
      - 'Argon is by far the most plentiful noble gas in air.'
      - 'Neon, helium and xenon are present only in traces.'
      - 'Way to remember: after nitrogen and oxygen, the third gas in air is argon.'
    hint: 'Which gas makes up almost 1% of air?'
    why:
      A: 'Xenon is present only in tiny traces.'
      B: 'Neon is present only in traces.'
      C: 'Helium is present only in traces; most helium escapes into space.'
  17:
    answer: A
    steps:
      - 'Le Chatelier''s principle: when a condition of a system at equilibrium is changed, the equilibrium shifts to oppose the change.'
      - 'Here $\ce{N2O4(g) <=> 2NO2(g)}$ has $\Delta H$ positive, so the forward reaction is endothermic.'
      - 'Raising the temperature favours the endothermic direction, so the equilibrium shifts to the right and more $\ce{NO2}$ forms.'
      - 'With more product and less reactant, $K = \dfrac{[\ce{NO2}]^2}{[\ce{N2O4}]}$ becomes larger. Temperature is the only factor that changes K.'
      - 'The trap is D. Shifting left would be right for an exothermic forward reaction, but this one is endothermic.'
    hint: 'Is the forward reaction taking in heat or giving it out?'
    why:
      B: 'K falls with temperature only for an exothermic forward reaction.'
      C: 'Heating favours the products here, not the reactant.'
      D: 'The equilibrium moves to the right, the endothermic direction.'
  18:
    answer: A
    steps:
      - 'Brønsted-Lowry: an acid donates a proton ($\ce{H+}$); a base accepts one.'
      - 'In $\ce{CH3COOH + OH^- <=> CH3COO^- + H2O}$, ethanoic acid gives a proton to $\ce{OH^-}$.'
      - 'What is left of the acid after it loses its proton is its conjugate base. So $\ce{CH3COO^-}$ is the conjugate base of $\ce{CH3COOH}$.'
      - '$\ce{H2O}$ is the conjugate acid of $\ce{OH^-}$.'
      - 'The trap is C, a base. It is a base, but the exact name for the species formed from the acid is conjugate base.'
    hint: 'What is left of ethanoic acid after it gives away a proton?'
    why:
      B: '$\ce{CH3COO^-}$ has just lost a proton; it cannot act as the acid here.'
      C: 'Too general; the species formed from an acid is its conjugate base.'
      D: 'The conjugate acid in this equation is $\ce{H2O}$, formed from $\ce{OH^-}$.'
  19:
    answer: D
    steps:
      - 'Potassium aluminium tetraoxosulphate(VI) is potash alum, $\ce{KAl(SO4)2.12H2O}$ (also written $\ce{K2SO4.Al2(SO4)3.24H2O}$).'
      - 'It is a double salt, so in water it gives all its ions: $\ce{KAl(SO4)2 -> K+ + Al^3+ + 2SO4^2-}$.'
      - 'The positive ions (cations) are $\ce{K+}$ and $\ce{Al^3+}$: two different cations.'
      - 'The trap is A, 3. $\ce{SO4^2-}$ is an anion, so it is not counted.'
    hint: 'Write the ions alum gives in water and keep only the positive ones.'
    why:
      A: 'Counts the sulphate ion, which is an anion.'
      B: 'There are only two metals in the formula.'
      C: 'Forgets that a double salt has two different cations.'
  20:
    answer: B
    steps:
      - 'An alkali is a base that dissolves in water to give hydroxide ions, $\ce{OH^-}$.'
      - '$\ce{NaOH}$ is very soluble and $\ce{Ca(OH)2}$ is soluble enough to give lime water, so both are alkalis.'
      - 'Ammonia dissolves very readily: $\ce{NH3 + H2O <=> NH4+ + OH^-}$, so ammonia solution is an alkali.'
      - '$\ce{Mg(OH)2}$ is insoluble in water. It is a base (it neutralises acids, as in milk of magnesia) but not an alkali.'
      - 'Remember: all alkalis are bases, but not all bases are alkalis.'
    hint: 'Which of these hydroxides will not dissolve in water?'
    why:
      A: 'Ammonia dissolves readily in water to give OH⁻ ions, so its solution is an alkali.'
      C: 'Calcium hydroxide dissolves to give lime water, an alkali.'
      D: 'Sodium hydroxide is a soluble strong base, an alkali.'
  21:
    answer: D
    steps:
      - 'Thermal pollution is the release of hot water, for example from power stations and factories, into rivers and lakes.'
      - 'Gases are less soluble in warm water than in cold water.'
      - 'So warm water holds less dissolved oxygen, and fish and other water life suffocate.'
      - 'The trap is A. Heating a river does not noticeably reduce its volume; the harm is the lost oxygen.'
    hint: 'What happens to the solubility of a gas when water gets warmer?'
    why:
      A: 'The volume is hardly affected; the dissolved oxygen is.'
      B: 'Heat is not chemical waste; that is chemical pollution.'
      C: 'Oxides of nitrogen are air pollutants from burning fuel.'
  22:
    answer: B
    steps:
      - 'A deliquescent substance absorbs so much water vapour from the air that it dissolves in it and forms a solution.'
      - 'Anhydrous calcium chloride, $\ce{CaCl2}$, does this, which is why it is used as a drying agent.'
      - '$\ce{Na2CO3.10H2O}$ does the opposite: it is efflorescent and loses water to the air.'
      - 'The trap is D. Washing soda crystals lose water, they do not take it in.'
    hint: 'Which compound turns into a puddle when left in open air?'
    why:
      A: 'Anhydrous sodium trioxocarbonate(IV) is hygroscopic, not deliquescent.'
      C: 'Copper(II) oxide is an insoluble solid and does not absorb water.'
      D: 'Washing soda is efflorescent; it gives water out.'
  23:
    answer: C
    steps:
      - 'When an ionic solid dissolves, energy must be put in to break up the lattice (lattice energy), and energy is given out when the ions become surrounded by water (hydration energy).'
      - 'Heat of solution = energy taken in to break the lattice − energy given out by hydration.'
      - 'If the hydration energy is greater than the lattice energy, more energy is given out than taken in.'
      - 'So $\Delta H$ is negative and the process is exothermic; the solution warms up.'
      - 'The trap is A, spontaneous. Whether a change is spontaneous also depends on entropy, so energies alone cannot decide it.'
    hint: 'Which is bigger, the energy taken in or the energy given out?'
    why:
      A: 'Spontaneity depends on free energy, not on these two energies alone.'
      B: 'Endothermic would need the lattice energy to be the larger.'
      D: 'The energies say nothing about whether the change can be reversed.'
  24:
    answer: C
    steps:
      - 'In a galvanic (Daniell) cell, the more reactive metal is the negative electrode, the anode, where oxidation happens.'
      - 'Zinc is above copper in the electrochemical series, so zinc dissolves: $\ce{Zn -> Zn^2+ + 2e^-}$.'
      - 'The electrons produced flow from zinc through the outer wire to the copper electrode.'
      - 'So zinc produces electrons.'
      - 'The trap is A. Reduction takes place at the copper electrode, not at the zinc.'
    hint: 'Does zinc lose or gain electrons in the cell?'
    why:
      A: 'Zinc is oxidised; reduction happens at the other electrode.'
      B: 'Zinc is the negative electrode.'
      D: 'Electrons are used up at the positive electrode, not at zinc.'
  25:
    answer: D
    steps:
      - 'The reaction of methane with chlorine is a substitution reaction that needs light (ultraviolet or sunlight).'
      - 'Light splits $\ce{Cl2}$ into chlorine atoms (free radicals): $\ce{Cl2 ->[light] 2Cl}$.'
      - 'These atoms start a chain reaction. In the dark there is no reaction; in bright sunlight it can be explosive.'
      - 'So light is the major factor. This is a photochemical reaction.'
      - 'The trap is B, temperature. Warming alone does not start it at room conditions; light does.'
    hint: 'What breaks the chlorine molecule apart to start the reaction?'
    why:
      A: 'No catalyst is used in this reaction.'
      B: 'Light, not heat, starts the reaction.'
      C: 'Concentration matters little; without light there is no reaction.'
  26:
    answer: D
    steps:
      - 'Rusting (corrosion of iron) needs both water and oxygen.'
      - '$\ce{4Fe + 3O2 + 2xH2O -> 2Fe2O3.xH2O}$ (hydrated iron(III) oxide, rust).'
      - 'Iron in dry air does not rust, and iron in boiled water covered with oil (no oxygen) does not rust.'
      - 'Carbon(IV) oxide or salt speeds rusting up, but it is not required.'
      - 'The trap is B. It contains water and oxygen, but carbon(IV) oxide is not a condition that must be present.'
    hint: 'Which two substances appear in the formula of rust?'
    why:
      A: 'Without oxygen there is no rusting.'
      B: 'Carbon(IV) oxide speeds up rusting but is not needed.'
      C: 'Without water there is no rusting.'
  27:
    answer: B
    steps:
      - 'On an energy profile, the enthalpy change, $\Delta H$, is the difference between the energy of the products and the energy of the reactants.'
      - 'X runs from the reactant level down to the product level, so X is $\Delta H$.'
      - 'The products are lower than the reactants, so this reaction is exothermic and $\Delta H$ is negative.'
      - 'The activation energy would be measured from the reactant level up to the top of the hump.'
      - 'The trap is C, activation energy. X does not reach the peak.'
    hint: 'Where do the two ends of X sit, at the hump or at the two flat levels?'
    why:
      A: 'Enthalpy is the energy content of one level; X is a difference between two levels.'
      C: 'Activation energy goes from the reactants up to the top of the hump.'
      D: 'The activated complex sits at the peak; it is a state, not a gap.'
  28:
    answer: A
    steps:
      - 'Collision theory: the rate of a reaction depends on how often reactant particles collide, which depends on their concentration.'
      - 'As a reaction goes on, the reactants are used up, so their concentration falls.'
      - 'Fewer collisions happen each second, so the rate drops steeply at first and then levels off as the reactants run out.'
      - 'The graph shows exactly this fall in rate with time, so it shows the effect of a decrease in concentration.'
      - 'The trap is B, temperature. Temperature is not changing during the reaction shown.'
    hint: 'What gets used up as a reaction goes on?'
    why:
      B: 'The temperature is not falling as the reaction goes on.'
      C: 'A rate-time curve like this comes from reactants being used up, not from a change of surface area.'
      D: 'Pressure is not the variable falling here.'
  29:
    answer: D
    steps:
      - 'In a balanced ionic equation, the atoms and the total charge must be the same on both sides.'
      - 'The products contain $\ce{4H2O}$, which has 4 × 2 = 8 hydrogen atoms. The only source of hydrogen on the left is Y, so Y must be $\ce{8H+}$.'
      - 'Full equation: $\ce{MnO4^- + 8H+ + 5Fe^2+ -> Mn^2+ + 5Fe^3+ + 4H2O}$.'
      - 'Charge check. Left: −1 + 8 + 5(+2) = +17. Right: +2 + 5(+3) = +17. Balanced.'
      - 'The trap is A, $\ce{5H+}$, copied from the 5 in front of the iron ions. Count the hydrogen in the water instead.'
    hint: 'How many hydrogen atoms are in 4H2O?'
    why:
      A: 'Only 5 H atoms; 4H2O needs 8.'
      B: 'Counts the water molecules, not the hydrogen atoms in them.'
      C: 'Too many; it leaves 2 H atoms unbalanced.'
  30:
    answer: B
    steps:
      - 'Faraday''s first law: the mass of a substance deposited is directly proportional to the quantity of electricity passed.'
      - 'So M ∝ Q, and M = EQ, where the constant E is the electrochemical equivalent (the mass deposited by 1 coulomb).'
      - 'Since Q = It, this is also written M = EIt.'
      - 'Check: doubling Q must double M, and only M = EQ does this.'
      - 'The trap is A, $M = \dfrac{E}{Q}$, which would make the mass fall as more electricity is passed.'
    hint: 'If you pass twice as much charge, what happens to the mass deposited?'
    why:
      A: 'Would make M fall as Q rises; M must rise with Q.'
      C: 'Upside down; it divides the charge by the mass per coulomb.'
      D: 'Brings in a factor of 2 and divides by Q, so M would fall as Q rises.'
  31:
    answer: A
    steps:
      - 'Chlorine is made by heating concentrated hydrochloric acid with manganese(IV) oxide: $\ce{MnO2 + 4HCl -> MnCl2 + Cl2 + 2H2O}$.'
      - 'The gas carries over two impurities: hydrogen chloride gas (from the volatile acid) and water vapour.'
      - 'Hydrogen chloride is very soluble in water and chlorine much less so, so bubbling the gas through water removes the hydrogen chloride.'
      - 'The gas is then passed through concentrated $\ce{H2SO4}$ to remove the water vapour.'
      - 'The trap is C. Concentrated $\ce{H2SO4}$ is the drying agent; it removes water vapour, not hydrogen chloride.'
    hint: 'Which liquid dissolves hydrogen chloride far better than chlorine?'
    why:
      B: 'Ammonia reacts with both chlorine and hydrogen chloride.'
      C: 'Concentrated $\ce{H2SO4}$ removes water vapour, the other impurity.'
      D: 'Hydrogen chloride is the impurity, not the cure.'
  32:
    answer: D
    steps:
      - 'Pure iron melts at about 1535 °C.'
      - 'Impurities such as carbon and sulphur break up the regular arrangement of iron atoms, as an impurity does to any solid.'
      - 'Rule: impurities lower the melting point of a solid (and make it melt over a range).'
      - 'That is why cast iron, which contains about 4% carbon, melts at about 1200 °C. The impurities also make it hard and brittle.'
      - 'The trap is B. Impurities make iron brittle, not malleable and ductile.'
    hint: 'What do impurities always do to the melting point of a pure solid?'
    why:
      A: 'Cast iron has low tensile strength; it is brittle.'
      B: 'Impurities make iron brittle; pure wrought iron is the malleable form.'
      C: 'Impurities lower the melting point, not raise it.'
  33:
    answer: D
    steps:
      - 'Concentrated $\ce{HNO3}$ is a strong oxidising agent.'
      - 'Iron(II) ions in solution are pale green. When they are boiled with concentrated $\ce{HNO3}$ they are oxidised: $\ce{Fe^2+ -> Fe^3+ + e^-}$.'
      - 'Iron(III) ions are yellow-brown, so the solution turns brown.'
      - 'So the cation present at the start was $\ce{Fe^2+}$.'
      - 'The trap is C, $\ce{Fe^3+}$. That is the ion formed by the test, not the one that was there before.'
    hint: 'A brown colour appears only after an oxidising agent is added. What was oxidised?'
    why:
      A: 'Lead(II) is not oxidised by HNO3 and its solution stays colourless.'
      B: 'Copper(II) solution is blue and does not turn brown.'
      C: 'Fe3+ is already fully oxidised; it is the product of the test, not the starting ion.'
  34:
    answer: B
    steps:
      - 'Dry chlorine does not bleach. Moist chlorine does.'
      - 'Chlorine reacts with water to form chloric(I) acid: $\ce{Cl2 + H2O -> HCl + HOCl}$.'
      - 'Chloric(I) acid gives up its oxygen to the dye: $\ce{HOCl -> HCl + [O]}$, and the dye + [O] is colourless. Bleaching by chlorine is oxidation.'
      - 'So water must be present.'
      - 'The trap is D, oxygen. The oxygen that bleaches comes from HOCl, not from oxygen gas.'
    hint: 'Why does dry chlorine fail to bleach dry litmus paper?'
    why:
      A: 'Hydrogen chloride is a product and does not bleach.'
      C: 'Air does not take part in the bleaching.'
      D: 'The bleaching oxygen comes from chloric(I) acid made with water, not from oxygen gas.'
  35:
    answer: B
    steps:
      - 'Oxygen is usually collected over water, because it is only slightly soluble in water.'
