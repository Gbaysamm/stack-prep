format_version: 1
exam_year: 2012
subject: CHEM
explanations:
  2:
    answer: B
    steps:
      - 'Rule: distillation separates liquids only when their boiling points are far apart. A liquid that boils close to water will come over with the water.'
      - 'Methanoic acid boils at about 101 °C and water at 100 °C, so distilling the mixture as it is gives water that is still acidic.'
      - 'First neutralise the acid: $\ce{HCOOH + NaOH -> HCOONa + H2O}$. Sodium methanoate is a salt, and salts do not boil off.'
      - 'Now distil. Only water vapour leaves the flask and condenses as pure water. The sand and the salt stay behind, so no separate filtration is needed.'
      - 'The trap is D. Filtration removes the sand, but the distillation that follows still carries methanoic acid over with the water.'
    hint: 'Methanoic acid boils at about 101 °C. Can distillation alone pull it away from water?'
    why:
      A: 'Filtration removes the sand but leaves the dissolved sodium methanoate in the water.'
      C: 'Water and methanoic acid boil too close together to separate cleanly this way.'
      D: 'The methanoic acid distils over with the water, so the water is not pure.'
  3:
    answer: C
    steps:
      - 'Rule: number of moles = mass ÷ molar mass, and number of particles = moles × Avogadro''s constant.'
      - 'Moles of Mg = 6.0 g ÷ 24 g mol⁻¹ = 0.25 mol.'
      - 'Number of atoms = 0.25 mol × $6.02 \times 10^{23}$ mol⁻¹ = $1.505 \times 10^{23}$.'
      - 'This rounds to $1.51 \times 10^{23}$ atoms. It is a quarter of a mole, so a quarter of $6.02 \times 10^{23}$ makes sense.'
      - 'The trap is D, $3.02 \times 10^{23}$, which uses half a mole, as if the molar mass were 12.'
    hint: 'Find the moles of magnesium first.'
    why:
      A: 'Divides by 10 somewhere; 0.25 mol gives far more atoms than this.'
      B: 'Is about a sixth of the right answer; check the moles again.'
      D: 'Uses 0.5 mol instead of 0.25 mol.'
  4:
    answer: D
    steps:
      - 'Rule (Dalton''s law of partial pressures): pressure of the dry gas = total pressure − vapour pressure of water.'
      - 'Dry gas pressure P₁ = 765 − 5 = 760 mmHg. T₁ = 10 + 273 = 283 K, V₁ = 50 cm³.'
      - 'General gas equation: P₁V₁/T₁ = P₂V₂/T₂, with s.t.p. P₂ = 760 mmHg and T₂ = 273 K.'
      - 'V₂ = P₁V₁T₂ ÷ (T₁P₂) = 760 × 50 × 273 ÷ (283 × 760) = 50 × 273 ÷ 283 = 48.23 cm³.'
      - 'The volume shrinks a little because the gas is cooled from 283 K to 273 K, which makes sense.'
      - 'The trap is forgetting to subtract the water vapour. Using 765 mmHg gives 48.55 cm³, option C.'
    hint: 'Some of the 765 mmHg is pushed by water vapour. Take that away first.'
    why:
      A: 'Does not correct the temperature to 273 K properly.'
      B: 'Adds the vapour pressure instead of subtracting it.'
      C: 'Uses 765 mmHg without subtracting the 5 mmHg of water vapour.'
  5:
    answer: B
    steps:
      - 'Rule (Boyle''s law): at constant temperature, the volume of a fixed mass of gas is inversely proportional to its pressure, PV = constant.'
      - 'So when the pressure goes up, the volume must go down.'
      - 'The molecules are pushed closer together, so they collide more often, not less.'
      - 'The trap is A. Higher pressure means more collisions per second, not fewer.'
    hint: 'Boyle''s law: PV = constant at fixed temperature.'
    why:
      A: 'Squeezing the gas makes collisions more frequent.'
      C: 'The molecules move closer together, so the distance between them falls.'
      D: 'Volume falls when pressure rises at constant temperature.'
  6:
    answer: B
    steps:
      - 'Rule (Gay-Lussac''s law): gases react in volumes in a simple ratio, the same as the mole ratio in the balanced equation.'
      - '$\ce{2H2(g) + O2(g) -> 2H2O(g)}$, so 2 volumes of hydrogen react with 1 volume of oxygen.'
      - '300 cm³ of oxygen needs 2 × 300 = 600 cm³ of hydrogen.'
      - 'Hydrogen left over = 1000 − 600 = 400 cm³.'
      - 'The trap is C, 600 cm³. That is the hydrogen used up, not the hydrogen left.'
    hint: 'How much hydrogen does 300 cm³ of oxygen need?'
    why:
      A: 'Takes the ratio the wrong way round or slips in the subtraction.'
      C: 'This is the hydrogen that reacted, not the excess.'
      D: 'Subtracts the oxygen volume, 1000 − 300, ignoring the 2 : 1 ratio.'
  7:
    answer: D
    steps:
      - 'Fact: matter is made of tiny particles in constant motion (the kinetic theory). Any process that only makes sense if particles move about is evidence for it.'
      - 'Evaporation: fast particles escape from the surface of a liquid. Sublimation: particles leave a solid straight into the gas.'
      - 'Diffusion: particles spread out and mix on their own. Brownian motion: pollen or smoke specks jiggle because moving particles hit them.'
      - 'All four, I, II, III and IV, are evidence for the particulate nature of matter.'
      - 'The trap is A, which leaves out Brownian motion, the most direct evidence of all.'
    hint: 'Ask of each one: could it happen if matter were not made of moving particles?'
    why:
      A: 'Leaves out sublimation and Brownian motion, which are also evidence.'
      B: 'Leaves out evaporation and diffusion.'
      C: 'Leaves out Brownian motion, the clearest evidence.'
  8:
    answer: C
    steps:
      - 'Rule: a metal that easily loses electrons and a non-metal that easily gains them form an ionic (electrovalent) bond.'
      - 'X (Z = 11) is 2, 8, 1, sodium. It loses one electron to form X⁺.'
      - 'Y (Z = 17) is 2, 8, 7, chlorine. It gains one electron to form Y⁻.'
      - 'The ions attract to form XY, like $\ce{NaCl}$, an ionic compound.'
      - 'The trap is B. Covalent bonds form when two non-metals share electrons, but X is a metal.'
    hint: 'Write the electron configurations. Which one gives an electron away?'
    why:
      A: 'A dative bond needs one atom to donate a lone pair to share, not to transfer an electron.'
      B: 'Covalent bonding is sharing between non-metals; X is a metal.'
      D: 'Metallic bonding holds atoms of a metal together, not a metal and a non-metal.'
  9:
    answer: A
    steps:
      - 'Fact: the common hydrogen atom, $\ce{^{1}_{1}H}$, has one proton, one electron and no neutron. Mass number 1 = 1 proton + 0 neutrons.'
      - 'Losing its electron gives the ion $\ce{H+}$.'
      - 'What is left is the nucleus alone: one proton and nothing else.'
      - 'That is why chemists often call $\ce{H+}$ simply "a proton".'
      - 'The trap is C. One proton and one neutron is deuterium, $\ce{^{2}_{1}H}$, a rare isotope, not ordinary hydrogen.'
    hint: 'What is the mass number of ordinary hydrogen, and what does it tell you about neutrons?'
    why:
      B: 'A neutron alone is not hydrogen; hydrogen must have one proton.'
      C: 'Ordinary hydrogen has no neutron; one proton and one neutron is deuterium.'
      D: 'The electron has been lost, so it cannot still be there.'
  10:
    answer: C
    steps:
      - 'Rule: a positive ion forms when the atom loses electrons from its outermost shell.'
      - 'Mg (Z = 12): 1s² 2s² 2p⁶ 3s².'
      - '$\ce{Mg^2+}$ has lost the two 3s electrons, leaving 10 electrons: 1s² 2s² 2p⁶.'
      - 'This is the same configuration as neon, a stable octet.'
      - 'The trap is B, which is the neutral magnesium atom, not the ion.'
    hint: 'Write Mg first, then take away two electrons from the outermost shell.'
    why:
      A: 'Has 14 electrons, which is silicon, not Mg²⁺.'
      B: 'This is the neutral Mg atom; the ion has lost the two 3s electrons.'
      D: 'Has only 8 electrons, two too few.'
  11:
    answer: B
    steps:
      - 'Fact: Group VII elements, the halogens, have seven outer electrons and need one more for an octet.'
      - 'They gain electrons readily: $\ce{Cl2 + 2e- -> 2Cl-}$.'
      - 'A substance that gains electrons takes them from something else, so it is an oxidizing agent.'
      - 'Remember: halogens grab electrons, so they oxidize others. Fluorine is the strongest of all.'
      - 'The trap is D. Electron donors are reducing agents, like the Group I metals.'
    hint: 'How many electrons does a halogen need to complete its octet?'
    why:
      A: 'Halogens exist as diatomic molecules, such as Cl₂.'
      C: 'They are highly electronegative, not electropositive.'
      D: 'They accept electrons; donors are metals.'
  12:
    answer: D
    steps:
      - 'Fact: the arrangement of particles in a crystal is found by X-ray diffraction.'
      - 'X-rays have a wavelength about the same as the spacing between particles in a crystal, so the crystal scatters them into a pattern.'
      - 'From that pattern the positions of the particles in the lattice are worked out.'
      - 'The trap is C. Gamma rays are too short in wavelength and are used in radiotherapy and sterilising, not crystal study.'
    hint: 'Which rays have a wavelength close to the distance between ions in a crystal?'
    why:
      A: 'Alpha particles were used to probe the atom''s nucleus, not crystal lattices.'
      B: 'Beta particles are fast electrons from radioactive decay, not used for lattice study.'
      C: 'Gamma rays are not used to map crystal lattices.'
  13:
    answer: A
    steps:
      - 'Rule: a mixture has a variable composition and its parts can be separated by physical means. A compound has a fixed composition.'
      - 'I: the make-up of air changes from place to place, for example more water vapour near the sea. This shows a mixture.'
      - 'II: air is separated into nitrogen and oxygen by fractional distillation of liquid air, a physical method. This shows a mixture.'
      - 'III: containing noble gases does not prove anything. A pure gas can also be unreactive.'
      - 'So the answer is I and II only. The trap is D, which counts III as well.'
    hint: 'Which statements are part of the definition of a mixture?'
    why:
      B: 'III is not evidence of a mixture, and it leaves out I.'
      C: 'III is not evidence of a mixture, and it leaves out II.'
      D: 'III does not show that air is a mixture.'
  14:
    answer: C
    steps:
      - 'Rule: water is hard because it holds dissolved $\ce{Ca^2+}$ and $\ce{Mg^2+}$ ions. To soften it, remove these ions.'
      - 'Add a soluble sodium compound such as washing soda, $\ce{Na2CO3}$.'
      - '$\ce{Ca^2+(aq) + CO3^2-(aq) -> CaCO3(s)}$. The calcium leaves the water as an insoluble precipitate, and only sodium ions stay behind, which do not cause hardness.'
      - 'The sodium compound must be soluble so that its ions can reach the calcium ions.'
      - 'The trap is B. If the calcium and magnesium stayed in solution, the water would still be hard.'
    hint: 'To remove Ca²⁺ from water, what must it turn into?'
    why:
      A: 'An insoluble sodium compound cannot react with the dissolved ions.'
      B: 'Calcium and magnesium ions left in solution keep the water hard.'
      D: 'The precipitates are the result of softening, not the chemicals added.'
  15:
    answer: B
    steps:
      - 'Fact: chlorine is added to town water to kill germs (bacteria) that cause diseases such as cholera and typhoid.'
      - '$\ce{Cl2 + H2O -> HCl + HOCl}$. The chloric(I) acid, HOCl, kills the micro-organisms.'
      - 'Colour, taste and smell are handled by other steps such as coagulation, filtration and aeration.'
      - 'Remember: chlorination is the sterilisation stage.'
    hint: 'What makes untreated water dangerous to drink?'
    why:
      A: 'Colour is removed by coagulation and filtration, not by chlorine.'
      C: 'Chlorine does not improve taste; too much makes it taste worse.'
      D: 'Odour is removed by aeration, not chlorination.'
  16:
    answer: B
    steps:
      - 'Fact: a solubility curve is a graph of solubility (y-axis) against temperature (x-axis).'
      - 'To compare solutes, draw all their curves on the same axes, with the same scales.'
      - 'Then at any temperature you can read off which solute is more soluble, and where the curves cross they are equally soluble.'
      - 'The trap is A. Separate axes make it hard to compare the curves directly.'
    hint: 'How do you compare two graphs most easily?'
    why:
      A: 'Separate axes make direct comparison difficult.'
      C: 'Each curve needs both axes; you cannot plot a curve on one axis.'
      D: 'A curve needs both solubility and temperature, not just the x-axis.'
  17:
    answer: D
    steps:
      - 'Rule: the amount that crystallises out on cooling = solubility at the high temperature − solubility at the low temperature.'
      - 'Moles crystallised from 1 dm³ = 1.5 − 0.5 = 1.0 mol.'
      - 'Molar mass of $\ce{KClO3}$ = 39 + 35.5 + 3 × 16 = 122.5 g mol⁻¹.'
      - 'Mass = 1.0 mol × 122.5 g mol⁻¹ = 122.50 g.'
      - 'The trap is C, 12.25 g, which slips a factor of ten, as if only 0.1 mol came out.'
    hint: 'How many moles stop being dissolved when the solubility falls from 1.5 to 0.5?'
    why:
      A: 'Gives the moles crystallised as if they were grams.'
      B: 'Is not linked to the molar mass of KClO₃.'
      C: 'Is ten times too small; 1.0 mol comes out, not 0.1 mol.'
  18:
    answer: A
    steps:
      - 'Fact: carbon(II) oxide, CO, combines with haemoglobin in the blood far more strongly than oxygen does, forming carboxyhaemoglobin.'
      - 'The blood then carries less oxygen. The brain needs a steady supply of oxygen, so its cells are damaged or die.'
      - 'This is why people who sleep in closed rooms with a running generator can suffer brain damage or death.'
      - 'The trap is B. Radioactive fallout is linked with cancers and genetic damage rather than brain damage.'
    hint: 'Which gas stops the blood from carrying oxygen?'
    why:
      B: 'Radioactive fallout mainly causes cancers, leukaemia and genetic damage.'
      C: 'Biodegradable waste is broken down by microbes; it is not linked with brain damage.'
      D: 'Sulphur(IV) oxide irritates the lungs and causes acid rain.'
  19:
    answer: C
    steps:
      - 'Rule: at the equivalence point the solution holds only the salt. A salt of a strong acid and a weak base hydrolyses to give an acidic solution, pH below 7.'
      - 'In A, B and D, a strong acid ($\ce{HNO3}$ or $\ce{H2SO4}$) meets a strong alkali ($\ce{NaOH}$ or $\ce{KOH}$), so the salt is neutral, pH 7.'
      - 'In C, $\ce{2HCl + Mg(OH)2 -> MgCl2 + 2H2O}$. HCl is strong and $\ce{Mg(OH)2}$ is a weak base.'
      - '$\ce{Mg^2+}$ ions hydrolyse water and release $\ce{H+}$, so the solution is slightly acidic.'
      - 'The trap is B. $\ce{H2SO4}$ is dibasic, but with KOH it still makes a neutral salt, $\ce{K2SO4}$.'
    hint: 'Look for the pair where the base is weak.'
    why:
      A: 'Strong acid and strong alkali give a neutral salt, pH 7.'
      B: 'Strong acid and strong alkali give neutral K₂SO₄, pH 7.'
      D: 'Strong acid and strong alkali give neutral KNO₃, pH 7.'
  20:
    answer: A
    steps:
      - 'Fact: the basicity of an acid is the number of hydroxonium ions, $\ce{H3O+}$, that one molecule of the acid can produce in water.'
      - '$\ce{HCl}$ gives one, so it is monobasic. $\ce{H2SO4}$ gives two, so it is dibasic. $\ce{H3PO4}$ gives three, so it is tribasic.'
      - 'Strength is different. It is about what fraction of the acid molecules ionise, not how many ions each molecule can give.'
      - 'The trap is B. Ethanoic acid is weak, yet it is still monobasic.'
    hint: 'What word describes HCl as mono- and H₂SO₄ as di-?'
    why:
      B: 'Strength is the degree of ionisation, not the number of H₃O⁺ ions per molecule.'
      C: 'pH measures the concentration of H₃O⁺ in a solution, not a count per molecule.'
      D: 'Concentration is the amount of acid per dm³ of solution.'
  21:
    answer: D
    steps:
      - 'Rule: volume of a gas at s.t.p. = number of moles × molar volume (22.4 dm³ mol⁻¹).'
      - 'Volume = 0.05 mol × 22.4 dm³ mol⁻¹.'
      - '= 1.12 dm³.'
      - 'Check: 0.05 is one-twentieth of a mole, and 22.4 ÷ 20 = 1.12.'
      - 'The trap is C, 2.24 dm³, which is the volume of 0.1 mol.'
    hint: 'Multiply the moles by the molar volume.'
    why:
      A: 'Is the volume of a whole mole.'
      B: 'Is the volume of 0.5 mol.'
      C: 'Is the volume of 0.1 mol.'
  22:
    answer: D
    steps:
      - 'Fact: the method for preparing a salt depends first on whether the salt is soluble or insoluble in water.'
      - 'A soluble salt, such as $\ce{CuSO4}$, is made by reacting an acid with a base, metal or carbonate, then crystallising.'
      - 'An insoluble salt, such as $\ce{BaSO4}$ or $\ce{PbCl2}$, is made by precipitation (double decomposition) and filtering.'
      - 'The trap is C. Reactivity with acid matters for one route, but solubility decides the whole method.'
    hint: 'Can you crystallise a salt that will not dissolve?'
    why:
      A: 'Crystalline form does not decide how the salt is made.'
      B: 'Melting point does not decide the method of preparation.'
      C: 'Matters for some routes, but solubility comes first.'
  23:
    answer: D
    steps:
      - 'Rule: in a neutral compound the oxidation numbers add up to zero. In a metal hydride, hydrogen is −1.'
      - 'In $\ce{NaBH4}$: Na = +1, each H = −1, boron = x.'
      - '(+1) + x + 4(−1) = 0, so x − 3 = 0, x = +3.'
      - 'Boron is in Group III, so +3 fits its three valence electrons.'
      - 'The trap is A, −3, which comes from taking hydrogen as +1.'
    hint: 'Is hydrogen +1 or −1 when it is bonded to a metal?'
    why:
      A: 'Takes hydrogen as +1; in a metal hydride it is −1.'
      B: 'Does not balance: +1 − 1 − 4 ≠ 0.'
      C: 'Does not balance: +1 + 1 − 4 ≠ 0.'
  24:
    answer: A
    steps:
      - 'Rule: the substance oxidised is the one in which an element''s oxidation number goes up.'
      - '$\ce{2Na2O2 + 2H2O -> 4NaOH + O2}$. In the peroxide $\ce{Na2O2}$, oxygen is −1.'
      - 'Some of that oxygen goes to $\ce{O2}$, where it is 0: −1 to 0 is an increase, so oxidation.'
      - 'The rest goes to $\ce{NaOH}$, where oxygen is −2: −1 to −2 is reduction. Oxygen in $\ce{H2O}$ stays −2 and hydrogen stays +1.'
      - 'So $\ce{Na2O2}$ is the substance oxidised (it is also reduced; this is disproportionation).'
      - 'The trap is D. $\ce{O2}$ is the product of the oxidation, not the substance that was oxidised.'
    hint: 'What is the oxidation number of oxygen in a peroxide?'
    why:
      B: 'NaOH is a product, not something that is oxidised.'
      C: 'No oxidation number changes in water here.'
      D: 'Oxygen gas is formed by the oxidation; it is the product, not the reactant oxidised.'
  25:
    answer: B
    steps:
      - 'Rule (Faraday''s laws): moles of metal deposited = charge ÷ (n × F), where n is the charge on the ion.'
      - '$\ce{Cu^2+ + 2e- -> Cu}$, so n = 2. One mole of copper needs 2 × 96500 = 193000 C.'
      - 'Moles = 360 C ÷ 193000 C mol⁻¹ = 0.001865 mol.'
      - '= $1.87 \times 10^{-3}$ mole.'
      - 'The trap is D, $3.73 \times 10^{-3}$, which forgets the 2 and divides by 96500 only.'
    hint: 'How many faradays does each Cu²⁺ ion need?'
    why:
      A: 'Is not 360 ÷ 193000; check the arithmetic.'
      C: 'Divides by 4F instead of 2F.'
      D: 'Uses n = 1, forgetting that Cu²⁺ needs two electrons.'
  26:
    answer: B
    steps:
      - 'Rule: a metal higher in the electrochemical series (more electropositive) displaces a lower metal from a solution of its salt.'
      - '$\ce{M + Zn^2+ -> M^{n+} + Zn}$. M gives electrons to the zinc ions.'
      - 'M loses electrons more readily than zinc, so M is more electropositive than zinc.'
      - 'Example: magnesium displaces zinc, $\ce{Mg + ZnCl2 -> MgCl2 + Zn}$.'
      - 'The trap is A. Electrons flow from M to the zinc ions, not the other way.'
    hint: 'Which metal gives up its electrons in a displacement reaction?'
    why:
      A: 'Electrons flow from M to zinc ions.'
      C: 'Electronegative means attracting electrons; M is the one losing them.'
      D: 'This is the reverse; zinc would then displace M.'
  27:
    answer: D
    steps:
      - 'Rule (Hess''s law): ΔH(reaction) = ΣΔHf(products) − ΣΔHf(reactants). ΔHf of an element, such as $\ce{H2}$, is zero.'
      - '$\ce{CO(g) + H2O(g) -> CO2(g) + H2(g)}$.'
      - 'Products: −394 + 0 = −394 kJ mol⁻¹. Reactants: −110 + (−242) = −352 kJ mol⁻¹.'
      - 'ΔH = −394 − (−352) = −394 + 352 = −42 kJ mol⁻¹.'
      - 'The reaction gives out heat, so it is exothermic.'
      - 'The trap is C, +42, from subtracting the wrong way round: reactants minus products.'
    hint: 'Products minus reactants, and hydrogen gas counts as zero.'
    why:
      A: 'Adds instead of subtracting and gets the sign wrong.'
      B: 'Adds 242 and 110 to −394 wrongly, not products minus reactants.'
      C: 'Subtracts products from reactants, which flips the sign.'
  28:
    answer: A
    steps:
      - 'Fact: entropy is the degree of disorder (randomness) of a system.'
      - 'When two gases mix, their molecules spread through a larger space and become more disordered, so entropy rises.'
      - 'Freezing, condensing and solidifying all turn a less ordered state into a more ordered one, so entropy falls.'
      - 'Remember: gas is more disordered than liquid, and liquid more than solid. Mixing always adds disorder.'
    hint: 'Which change makes the particles more spread out and random?'
    why:
      B: 'Liquid to solid makes the particles more ordered.'
      C: 'Gas to liquid makes the particles more ordered.'
      D: 'Liquid wax to solid makes the particles more ordered.'
  29:
    answer: C
    steps:
      - 'Rule: a reaction goes faster when the concentration of a reactant is higher and when a solid has a larger surface area.'
      - '$\ce{CaCO3(s) + 2HCl(aq) -> CaCl2(aq) + CO2(g) + H2O(l)}$.'
      - 'Powdered $\ce{CaCO3}$ has a much larger surface area than a lump, so powder is better.'
      - 'Among the powdered choices, 0.10 mol dm⁻³ HCl is the most concentrated, giving more collisions per second.'
      - 'The trap is A. It uses powder but only half the acid concentration of C.'
    hint: 'Look for the highest concentration and the largest surface area together.'
    why:
      A: 'Powdered, but the acid is less concentrated than in C.'
      B: 'Low concentration and a lump, so the slowest of the first three.'
      D: 'Powdered, but the acid is the most dilute.'
  31:
    answer: D
    steps:
      - 'Rule (Le Chatelier''s principle): raising the pressure favours the side with fewer moles of gas, because that reduces the volume.'
      - '$\ce{2CO(g) + O2(g) <=> 2CO2(g)}$: left side 2 + 1 = 3 moles of gas, right side 2 moles.'
      - 'The forward reaction goes from 3 volumes to 2, a decrease in volume, so high pressure favours it.'
      - 'The trap is C. Being exothermic tells you how temperature acts, not pressure.'
    hint: 'Count the moles of gas on each side.'
    why:
      A: 'High pressure favours fewer gas molecules, not more gas.'
      B: 'Every equilibrium is dynamic; that does not explain the effect of pressure.'
      C: 'The heat change decides the effect of temperature, not pressure.'
  32:
    answer: D
    steps:
      - 'Fact: hydrogen sulphide turns lead(II) ethanoate paper black. This is the standard test for $\ce{H2S}$.'
      - '$\ce{Pb(CH3COO)2 + H2S -> PbS(s) + 2CH3COOH}$.'
      - 'Lead(II) sulphide, PbS, is black.'
      - 'Remember: H₂S smells of rotten eggs and blackens lead paper.'
    hint: 'Which gas can give lead a sulphide?'
    why:
      A: 'Sulphur(IV) oxide turns acidified dichromate(VI) green; it does not blacken lead paper.'
      B: 'Hydrogen chloride gives white fumes with ammonia.'
      C: 'Sulphur(VI) oxide has no sulphide to form black PbS.'
  33:
    answer: D
    steps:
      - 'Fact: ammonia is the only common alkaline gas.'
      - 'It has a sharp, pungent smell and turns damp red litmus blue.'
      - 'With hydrogen chloride it forms dense white fumes of ammonium chloride: $\ce{NH3(g) + HCl(g) -> NH4Cl(s)}$.'
      - 'The trap is C. Chlorine is pungent too, but it bleaches litmus instead of turning it blue.'
    hint: 'Which gas is alkaline?'
    why:
      A: 'Nitrogen has no smell and does not affect litmus.'
      B: 'Dinitrogen(I) oxide is neutral and has a faint sweet smell.'
      C: 'Chlorine is acidic and bleaches litmus.'
  34:
    answer: C
    steps:
      - 'Fact: the two common industrial bleaching agents are chlorine and sulphur(IV) oxide.'
      - 'Chlorine bleaches by oxidation, in the presence of water: $\ce{Cl2 + H2O -> HCl + HOCl}$, and HOCl releases oxygen to the dye.'
      - 'Sulphur(IV) oxide bleaches by reduction; it is used for delicate materials like wool, silk and paper.'
      - 'The trap is A. Ammonia is not a bleach.'
    hint: 'One bleaches by oxidation, the other by reduction.'
    why:
      A: 'Ammonia is not a bleaching agent.'
      B: 'Hydrogen sulphide is not used as a bleach.'
      D: 'Ammonia is not a bleaching agent.'
  35:
    answer: C
    steps:
      - 'Fact: hydrogen peroxide slowly breaks down on standing: $\ce{2H2O2 -> 2H2O + O2}$.'
      - 'The breakdown is speeded up by alkalis, light and traces of metal.'
      - 'A little mineral acid acts as a stabiliser (a negative catalyst), slowing this decomposition so the solution keeps its strength.'
      - 'The trap is B. Acid does the opposite; it slows decomposition.'
    hint: 'Why would a manufacturer want hydrogen peroxide to last on the shelf?'
    why:
      A: 'The acid is not there to oxidise it.'
      B: 'The acid slows decomposition, not speeds it.'
      D: 'Breaking down to water and oxygen is decomposition, which the acid prevents.'
  36:
    answer: C
    steps:
      - 'Fact (flame test): calcium compounds give a brick-red flame.'
      - 'Lithium gives crimson red, sodium golden yellow, and magnesium no characteristic colour.'
      - 'So $\ce{CaCl2}$ burns brick-red.'
      - 'The trap is A. Lithium is also red, but a deep crimson rather than brick-red.'
    hint: 'Remember the flame colours: Li crimson, Na yellow, K lilac, Ca brick-red.'
    why:
      A: 'Lithium gives a crimson flame.'
      B: 'Sodium gives a golden-yellow flame.'
      D: 'Magnesium gives no characteristic flame colour.'
  37:
    answer: B
    steps:
