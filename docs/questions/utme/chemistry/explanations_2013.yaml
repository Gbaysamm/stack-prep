format_version: 1
exam_year: 2013
subject: CHEM
explanations:
  2:
    answer: B
    steps:
      - 'Rule: an impurity lowers the melting point of a substance and makes it melt over a range of temperatures instead of sharply.'
      - 'The foreign particles break up the regular arrangement of particles in the solid, so less energy is needed to pull them apart.'
      - 'This is why a sharp melting point is used as a test of purity, and why salt is spread on icy roads.'
      - 'So the melting point is reduced.'
      - 'The trap is C. Impurities raise the boiling point of a liquid, not the melting point of a solid. Remember: impurities lower melting points and raise boiling points.'
    hint: 'Think of salt on ice. Does the ice melt above or below 0 °C?'
    why:
      A: 'An impurity shifts the melting point a little; it does not make it zero.'
      C: 'Impurities raise boiling points, not melting points.'
      D: 'A pure substance has a steady, sharp melting point; an impure one does not.'
  3:
    answer: B
    steps:
      - 'Gay-Lussac''s law: gases react in volumes that are in simple ratio to one another and to the volume of gaseous product, at the same temperature and pressure.'
      - 'Equation: $\ce{2C(s) + O2(g) -> 2CO(g)}$.'
      - 'Mole ratio of gases: 1 volume of $\ce{O2}$ gives 2 volumes of $\ce{CO}$. Carbon is a solid, so it has no volume to count.'
      - 'Volume of CO = 2 × 10 dm³ = 20 dm³.'
      - 'The trap is D, 10 dm³. That copies the oxygen volume without using the equation. Each $\ce{O2}$ molecule supplies two oxygen atoms, so it makes two CO molecules.'
    hint: 'Balance the equation first. How many CO molecules can one O2 molecule make?'
    why:
      A: 'Halves the volume instead of doubling it.'
      C: 'Uses a 2 : 3 ratio that does not come from the balanced equation.'
      D: 'Assumes one volume of oxygen gives one volume of CO; the ratio is 1 : 2.'
  4:
    answer: B
    steps:
      - 'Boyle''s law: at constant temperature, PV = constant for a fixed mass of an ideal gas.'
      - 'If PV is constant, then a graph of PV against P is a horizontal straight line: PV does not change however much P changes.'
      - 'Line N is the only horizontal line, so N is the ideal gas.'
      - 'Curves K and M dip and then rise. That is how real gases behave: at moderate pressure attractions make PV fall, and at high pressure the size of the molecules makes PV rise.'
      - 'The trap is M. It starts and ends near N, but its dip shows a real gas with strong attractive forces.'
    hint: 'If PV is always the same number, what shape is the graph of PV against P?'
    why:
      A: 'M dips then rises, the shape of a real gas with strong attractions between molecules.'
      C: 'K dips slightly then climbs steeply, a real gas such as hydrogen at high pressure.'
      D: 'L rises steadily, so PV is changing; it is not constant.'
  5:
    answer: D
    steps:
      - 'Graham''s law: the rate of diffusion of a gas is inversely proportional to the square root of its relative molecular mass, so rate of Y ÷ rate of Z = √(M of Z ÷ M of Y).'
      - 'Rate of Y ÷ rate of Z = 1/2, and M of Y = 64.'
      - 'Substitute: 1/2 = √(M of Z ÷ 64). Square both sides: 1/4 = M of Z ÷ 64.'
      - 'M of Z = 64 ÷ 4 = 16.'
      - 'Check: Z is lighter than Y, so it should diffuse faster, which matches.'
      - 'The trap is A, 32. That divides by 2 instead of 4, forgetting to square the rate ratio.'
    hint: 'Graham''s law has a square root in it. What happens to the ratio 1/2 when you square it?'
    why:
      A: 'Divides 64 by 2; the rate ratio must be squared, so divide by 4.'
      B: 'Divides 64 by 16, squaring the ratio twice.'
      C: 'Divides 64 by 8, which has no basis in Graham''s law.'
  6:
    answer: C
    steps:
      - 'Fact: cobalt-60 is the radioisotope used in industrial radiography to find cracks and faults in welds and castings.'
      - 'Reason: it gives out strong gamma rays, which pass through thick metal and darken a photographic film behind it. A crack lets more rays through and shows up on the film.'
      - 'Cobalt-60 is also used in radiotherapy to treat cancer, for the same reason.'
      - 'Way to remember: cobalt for cracks, both start with c.'
      - 'The trap is D, iodine-131. It is a well-known isotope, but it is used to study and treat the thyroid gland.'
    hint: 'Which isotope gives gamma rays strong enough to pass through thick steel?'
    why:
      A: 'Carbon-14 is used for dating old organic remains.'
      B: 'Phosphorus-32 is a beta emitter used as a tracer in plants and in medicine.'
      D: 'Iodine-131 is used for the thyroid gland.'
  7:
    answer: C
    steps:
      - 'Rule: fill orbitals in order (1s, 2s, 2p) and, by Hund''s rule, put one electron in each p-orbital before pairing any.'
      - 'Fluorine has 9 electrons: 1s² 2s² 2p⁵.'
      - 'The three 2p orbitals take 5 electrons as ↑↓, ↑↓, ↑.'
      - 'So only one p-orbital holds a single electron: 1 unpaired electron.'
      - 'This single unpaired electron is why fluorine forms one bond, as in $\ce{F2}$ and $\ce{HF}$.'
      - 'The trap is A, 3. That counts the three p-orbitals, not the unpaired electrons in them.'
    hint: 'Write 2p⁵ in three boxes. How many boxes hold only one arrow?'
    why:
      A: 'Counts the three p-orbitals; three unpaired electrons fits nitrogen (2p³).'
      B: 'Zero unpaired p-electrons fits neon (2p⁶).'
      D: 'Two unpaired p-electrons fits oxygen (2p⁴).'
  8:
    answer: C
    steps:
      - 'Rule: the ionizing power of a radiation goes down as its penetrating power goes up. Order of ionizing power: α > β > γ.'
      - 'Alpha particles are heavy and doubly charged, so they knock electrons off many atoms quickly and are stopped by paper.'
      - 'Gamma rays have no charge and no mass, so they ionize the least and pass through thick lead.'
      - 'So the radioactive emission with the least ionizing power is γ-rays.'
      - 'The trap is B. X-rays are also weakly ionizing, but they are not a radioactive emission from the nucleus.'
    hint: 'The most penetrating radiation is the least ionizing. Which one passes through lead?'
    why:
      A: 'Alpha particles are the most ionizing of all.'
      B: 'X-rays come from electrons outside the nucleus, not from radioactive decay.'
      D: 'Beta particles are charged, so they ionize more than gamma rays.'
  9:
    answer: B
    steps:
      - 'Rule: electron pairs around a central atom spread as far apart as possible.'
      - 'In $\ce{CO2}$, written O=C=O, carbon has two double bonds and no lone pairs, so two regions of electrons.'
      - 'Two regions sit 180° apart, so the molecule is linear.'
      - 'That is also why $\ce{CO2}$ is non-polar: the two C=O dipoles cancel.'
      - 'The trap is C, angular. Water is angular because oxygen has two lone pairs; carbon in $\ce{CO2}$ has none.'
    hint: 'Count the lone pairs on carbon in O=C=O.'
    why:
      A: 'Pyramidal needs three bonds and one lone pair, as in $\ce{NH3}$.'
      C: 'Angular needs lone pairs on the central atom, as in $\ce{H2O}$.'
      D: 'Tetrahedral needs four bond pairs, as in $\ce{CH4}$.'
  10:
    answer: D
    steps:
      - 'Rule: hydrogen bonds form between molecules where hydrogen is joined directly to a very electronegative small atom: fluorine, oxygen or nitrogen.'
      - 'In HF, hydrogen is bonded to fluorine, the most electronegative element, so the H carries a strong partial positive charge.'
      - 'That H is attracted to a lone pair on the F of the next molecule, linking the molecules in zigzag chains.'
      - 'This is why HF boils at about 20 °C while HCl and HBr are gases far below 0 °C.'
      - 'The trap is B, HBr. It has an H bonded to a halogen, but bromine is too large and not electronegative enough.'
    hint: 'Hydrogen bonding needs H joined to F, O or N. Which formula has that?'
    why:
      A: 'Carbon is not electronegative enough; methane has only weak van der Waals forces.'
      B: 'Bromine is too large and not electronegative enough for hydrogen bonding.'
      C: 'Sulphur is too large and not electronegative enough, so $\ce{H2S}$ is a gas with no hydrogen bonding.'
  11:
    answer: D
    steps:
      - 'Rule: a metal that loses electrons easily and a non-metal that gains them easily form an ionic (electrovalent) bond.'
      - '1s² 2s² 2p⁶ 3s² has 12 electrons: magnesium, a Group 2 metal that loses 2 electrons to form $\ce{Mg^2+}$.'
      - '1s² 2s² 2p⁴ has 8 electrons: oxygen, a non-metal that gains 2 electrons to form $\ce{O^2-}$.'
      - 'Electrons transfer from Mg to O, giving $\ce{Mg^2+O^2-}$, magnesium oxide. The bond is ionic.'
      - 'The trap is B, covalent. Covalent bonds form when two non-metals share electrons; here one partner is a metal.'
    hint: 'Count the electrons to name each element. Is each a metal or a non-metal?'
    why:
      A: 'Metallic bonding holds atoms of a metal together, not a metal to a non-metal.'
      B: 'Covalent bonding is sharing between non-metals; magnesium is a metal.'
      C: 'A dative bond needs one atom to donate a lone pair to an empty orbital; here electrons transfer completely.'
  12:
    answer: A
    steps:
      - 'Fact: nitrogen makes up about 78% of air and acts as a diluent.'
      - 'Reason: it is unreactive, so it waters down the oxygen. Without it, burning and rusting in pure oxygen would be far too fast.'
      - 'Way to remember: nitrogen is the water added to strong squash, making the oxygen less fierce.'
      - 'The trap is C, the noble gases. They are unreactive too, but they are less than 1% of air, too little to dilute anything.'
    hint: 'Which unreactive gas makes up most of the air?'
    why:
      B: 'Carbon(IV) oxide is only about 0.03% of air; it is used by plants in photosynthesis.'
      C: 'The noble gases are unreactive but far too small a part of air to dilute it.'
      D: 'Oxygen is the active gas that the diluent is diluting.'
  13:
    answer: C
    steps:
      - 'Fact: anhydrous cobalt(II) chloride is blue, and it turns pink when water is added.'
      - 'Reason: water bonds to the cobalt ions to form the hydrated salt, which is pink: $\ce{CoCl2 + 6H2O -> CoCl2.6H2O}$.'
      - 'This colour change is the chemical test for water. Steam is water, so it gives the same change.'
      - 'Way to remember: blue paper goes pink when it gets wet.'
      - 'The trap is D, white to blue. That is the other water test, using anhydrous copper(II) tetraoxosulphate(VI).'
    hint: 'There are two water tests. This one uses a cobalt salt; what colour is it dry?'
    why:
      A: 'Neither colour fits; the dry salt is blue, not white.'
      B: 'The colour change goes towards pink, not white.'
      D: 'White to blue is the test with anhydrous copper(II) tetraoxosulphate(VI).'
  14:
    answer: A
    steps:
      - 'Definition: a hygroscopic substance absorbs moisture from the air but does not dissolve in it. A deliquescent substance absorbs so much moisture that it dissolves and forms a solution.'
      - 'Copper(II) oxide takes up water from the air and stays a solid, so it is hygroscopic. Other examples are calcium oxide and concentrated $\ce{H2SO4}$ (a liquid that takes in water).'
      - 'Magnesium chloride, calcium chloride and sodium hydroxide pellets left in air turn into a solution, so they are deliquescent.'
      - 'So the hygroscopic substance is $\ce{CuO}$.'
      - 'The trap is C, $\ce{CaCl2}$. It is a well-known drying agent, but it takes in so much water that it dissolves: that is deliquescence.'
    hint: 'Which of these takes in water from the air but stays a solid?'
    why:
      B: 'Magnesium chloride is deliquescent: it dissolves in the water it absorbs.'
      C: 'Calcium chloride is deliquescent: it turns into a solution in moist air.'
      D: 'Sodium hydroxide pellets are deliquescent: they become wet and dissolve.'
  15:
    answer: A
    steps:
      - 'Solubility in g dm⁻³ = mass of solute (g) ÷ volume of solvent (dm³).'
      - 'Water has density 1 g cm⁻³, so 42 g of water = 42 cm³ = 42 ÷ 1000 = 0.042 dm³.'
      - 'Solubility = 24.4 g ÷ 0.042 dm³ = 580.95 g dm⁻³, which is about 581 g dm⁻³.'
      - 'Check: 1 dm³ holds about 24 times as much water as 42 cm³, so about 24 × 24.4 ≈ 586 g, close to 581.'
      - 'The trap is B, 0.581. That divides 24.4 by 42 and then by 1000, getting the cm³ to dm³ change the wrong way round.'
    hint: 'Change 42 g of water to dm³ first. Is 0.042 dm³ more or less than 1 dm³?'
    why:
      B: 'Divides by 42 and then by 1000; it should divide by 0.042.'
      C: 'Slips the decimal point two places; the volume conversion is off by a factor of 100.'
      D: 'Slips the decimal point one place; the volume conversion is off by a factor of 10.'
  16:
    answer: B
    steps:
      - 'Rule: choose a stain remover that reacts with or dissolves the substance in the stain.'
      - 'Grease is a fat or oil. Ammonia solution is a mild alkali: it breaks up and emulsifies grease so that it washes out in water.'
      - 'That is why household ammonia is used as a degreaser in kitchens.'
      - 'Way to remember: ammonia for grease and sweat, oxalic acid for rust and ink, borax for softening water.'
      - 'The trap is C, ethanol. It is an organic solvent, but fats dissolve only slightly in it; it is better for grass and ink stains.'
    hint: 'Grease is a fat. Which solution is a mild alkali that breaks fats up?'
    why:
      A: 'Oxalic acid solution removes rust and ink stains, not grease.'
      C: 'Fats dissolve only slightly in ethanol; it is used for grass and ink stains.'
      D: 'Borax solution softens water and is used in laundry, not as a grease solvent.'
  17:
    answer: C
    steps:
      - 'Fact: sewage is food for bacteria. Too much of it makes the bacterial population grow very fast.'
      - 'The bacteria use dissolved oxygen as they break the sewage down. This is called a high biochemical oxygen demand (BOD).'
      - 'The level of dissolved oxygen falls, and fish and other aquatic animals die.'
      - 'So too much sewage leads to more bacteria and less oxygen.'
      - 'The trap is D. It gets the bacteria part wrong: sewage feeds bacteria, so their number rises, not falls.'
    hint: 'What do bacteria use up while they feed on sewage?'
    why:
      A: 'Sewage does not cool the water; the animals die from lack of oxygen.'
      B: 'Aquatic animals die, they do not increase.'
      D: 'Sewage feeds bacteria, so their number rises and oxygen falls.'
  18:
    answer: A
    steps:
      - 'Dilution rule: the number of moles of solute stays the same, so C₁V₁ = C₂V₂.'
      - 'C₁ = 2.0 mol dm⁻³, V₁ = 2.5 dm³. The final volume V₂ = 2.5 + 10.0 = 12.5 dm³.'
      - 'Moles of HCl = 2.0 × 2.5 = 5.0 mol.'
      - 'C₂ = 5.0 mol ÷ 12.5 dm³ = 0.4 mol dm⁻³.'
      - 'Check: adding water must lower the concentration, and 0.4 is less than 2.0.'
      - 'The trap is D, 0.5. That divides by 10.0 dm³ only, forgetting that the acid''s own 2.5 dm³ is part of the final volume.'
    hint: 'The final volume is the water plus the acid you started with.'
    why:
      B: 'Multiplies instead of dividing; dilution can only lower the concentration.'
      C: 'Ignores the added water altogether.'
      D: 'Uses 10.0 dm³ as the final volume instead of 12.5 dm³.'
  19:
    answer: B
    steps:
      - 'Rule: the lower the pH, the higher the hydrogen ion concentration. Adding acid adds $\ce{H+}$ ions, so the pH falls.'
      - 'The solution starts at pH 6.4, only slightly acidic, so it has very few $\ce{H+}$ ions.'
      - '1.0 mol dm⁻³ HCl is a strong acid. Three drops (about 0.15 cm³) add about 1.5 × 10⁻⁴ mol of $\ce{H+}$, which in 20 cm³ is about 7.5 × 10⁻³ mol dm⁻³, a pH near 2.'
      - 'So the pH of the resulting solution is less than 6.4.'
      - 'The trap is D, unaltered. Three drops sound too few to matter, but a strong acid at this concentration swamps the tiny $\ce{H+}$ content of a pH 6.4 solution.'
    hint: 'Does adding a strong acid raise or lower the pH?'
    why:
      A: 'Pure water has pH 7; adding acid moves the pH away from 7, not towards it.'
      C: 'A higher pH would need a base to be added.'
      D: 'Even a few drops of a strong acid lower the pH of a nearly neutral solution sharply.'
  20:
    answer: A
    steps:
      - 'Definition: a salt is formed when the hydrogen ions of an acid are replaced wholly or partly by a metal ion or ammonium ion.'
      - 'Zinc chloride ($\ce{ZnCl2}$, from HCl), sodium trioxocarbonate(IV) ($\ce{Na2CO3}$, from $\ce{H2CO3}$) and sodium hydrogen trioxosulphate(IV) ($\ce{NaHSO3}$, an acid salt from $\ce{H2SO3}$) all come from acids.'
      - 'Aluminium oxide, $\ce{Al2O3}$, is not formed from an acid. It is an amphoteric oxide, a reactant that makes salts, not a salt itself.'
      - 'So aluminium oxide is not a salt.'
      - 'The trap is B. The word "hydrogen" makes it look like an acid, but it is an acid salt: one H of the acid has been replaced by sodium.'
    hint: 'Which of these is not made by replacing the hydrogen of an acid with a metal?'
    why:
      B: 'An acid salt: one hydrogen of $\ce{H2SO3}$ is replaced by sodium.'
      C: 'A normal salt from trioxocarbonate(IV) acid.'
      D: 'A normal salt from hydrochloric acid.'
  21:
    answer: B
    steps:
      - 'Rule: an insoluble salt is made by double decomposition (precipitation). Mix two soluble salts, each carrying one ion of the wanted salt.'
      - 'Example: $\ce{Pb(NO3)2(aq) + 2NaCl(aq) -> PbCl2(s) + 2NaNO3(aq)}$.'
      - 'The insoluble salt falls out as a precipitate, which is filtered, washed with distilled water and dried.'
      - 'The other three methods all give a soluble salt in solution, which is then crystallised.'
      - 'The trap is C. "Insoluble base" sounds right, but the salt made from it stays dissolved; the base is insoluble, not the salt.'
    hint: 'If the salt is insoluble, how would it appear when two solutions are mixed?'
    why:
      A: 'Acid and trioxocarbonate(IV) make soluble salts; an insoluble product would coat the solid and stop the reaction.'
      C: 'This makes soluble salts; the base is insoluble, not the product.'
      D: 'Metal and acid make soluble salts; an insoluble layer would stop the reaction.'
  22:
    answer: C
    steps:
      - 'Rule: a substance is reduced when its oxidation number goes down (it gains electrons).'
      - 'Equation: $\ce{2H2O(l) + 2F2(g) -> 4HF(aq) + O2(g)}$.'
      - 'Fluorine: 0 in $\ce{F2}$ becomes −1 in HF. The oxidation number falls, so fluorine is reduced.'
      - 'Oxygen: −2 in $\ce{H2O}$ becomes 0 in $\ce{O2}$. It rises, so water is oxidised. Hydrogen stays at +1.'
      - 'So the substance being reduced is $\ce{F2}$.'
      - 'The trap is B. Water is the reducing agent, the one being oxidised, not the one being reduced.'
    hint: 'Find the oxidation number of fluorine before and after.'
    why:
      A: 'Oxygen gas is a product; oxygen went from −2 to 0, which is oxidation.'
      B: 'Water is oxidised: its oxygen goes from −2 to 0.'
      D: 'HF is a product; it is what the fluorine became.'
  23:
    answer: A
    steps:
      - 'Rule: the oxidizing agent is the substance that gains electrons, so it is itself reduced.'
      - 'Ionic equation: $\ce{Zn(s) + Cu^2+(aq) -> Zn^2+(aq) + Cu(s)}$.'
      - '$\ce{Cu^2+}$ gains 2 electrons to become Cu (reduced). Zn loses 2 electrons to become $\ce{Zn^2+}$ (oxidised).'
      - 'The $\ce{Cu^2+}$ ions come from $\ce{CuSO4(aq)}$, so $\ce{CuSO4}$ is the oxidizing agent.'
      - 'The trap is D, zinc. Zinc is oxidised, which makes it the reducing agent, not the oxidizing agent.'
    hint: 'Which reactant takes the electrons from zinc?'
    why:
      B: '$\ce{ZnSO4}$ is a product, formed from the zinc that was oxidised.'
      C: 'Copper metal is a product, formed when $\ce{Cu^2+}$ was reduced.'
      D: 'Zinc gives away electrons, so it is the reducing agent.'
  24:
    answer: D
    steps:
      - 'Fact: in a simple cell, polarization is caused by bubbles of hydrogen gas collecting on the positive electrode (usually copper).'
      - 'The hydrogen layer insulates the electrode and sets up a back e.m.f., so the current falls quickly.'
      - 'It is removed with a depolarizer, an oxidizing agent such as manganese(IV) oxide in the dry Leclanché cell, which turns the hydrogen into water.'
      - 'The trap is C. The acid is the electrolyte in a simple cell; it supplies the $\ce{H+}$ ions, but the gas they form is the cause.'
    hint: 'Which gas bubbles off the copper plate in a simple cell?'
    why:
      A: 'Chlorine is not formed in a simple cell.'
      B: 'Oxygen is not formed at the positive electrode of a simple cell.'
      C: 'The acid is the electrolyte; the hydrogen gas it produces causes polarization.'
  25:
    answer: B
    steps:
      - 'Faraday''s first law: quantity of electricity Q = It, and 96 500 C is one faraday (one mole of electrons).'
      - 'At the anode: $\ce{4OH- -> 2H2O + O2 + 4e-}$, so 4 faradays release 1 mole of $\ce{O2}$.'
      - 'Q = 5 A × 193 s = 965 C. Number of faradays = 965 ÷ 96 500 = 0.01 F.'
      - 'Moles of $\ce{O2}$ = 0.01 ÷ 4 = 0.0025 mol.'
      - 'Volume = 0.0025 mol × 22.4 dm³ mol⁻¹ = 0.056 dm³ (which is 56 cm³).'
      - 'The trap is C, 0.224 dm³. It uses 1 faraday per mole of oxygen instead of 4.'
    hint: 'How many electrons are needed to make one $\ce{O2}$ molecule?'
    why:
      A: 'Uses one electron per $\ce{O2}$ and gives the result in cm³ while labelling it dm³.'
      C: 'Uses one electron per $\ce{O2}$ instead of four.'
      D: 'Gives the answer in cm³ but labels it dm³; 56 cm³ = 0.056 dm³.'
  26:
    answer: C
    steps:
      - 'Rule: ΔG = ΔH − TΔS. A reaction is spontaneous only when ΔG is negative.'
      - 'Endothermic means ΔH is positive. A loss of entropy means ΔS is negative, so −TΔS is positive.'
      - 'ΔG = (positive) + (positive) = positive, at every temperature.'
      - 'So the reaction will not be spontaneous.'
      - 'The trap is A. A reaction is indeterminate when ΔH and ΔS have the same sign, because the temperature then decides; here they work together against the reaction.'
    hint: 'Put the signs into ΔG = ΔH − TΔS. Can ΔG ever be negative?'
    why:
      A: 'Both terms make ΔG positive, so the outcome is certain at every temperature.'
      B: 'Spontaneous needs ΔG negative, which cannot happen here.'
      D: 'Equilibrium needs ΔG = 0, which cannot happen when both terms are positive.'
  27:
    answer: B
    steps:
      - 'Le Chatelier''s principle: when a condition of a system at equilibrium is changed, the equilibrium shifts to oppose the change.'
      - '$\ce{2SO2(g) + O2(g) <=> 2SO3(g)}$ with ΔH negative, so the forward reaction is exothermic.'
      - 'Lowering the temperature makes the system replace the lost heat by favouring the exothermic forward reaction, so more $\ce{SO3}$ forms.'
      - 'Pressure: 3 moles of gas on the left and 2 on the right, so more $\ce{SO3}$ needs higher pressure, not lower.'
      - 'The trap is D, a catalyst. It speeds up both directions equally, so equilibrium is reached sooner but the amount of $\ce{SO3}$ does not change.'
    hint: 'The forward reaction gives out heat. Which way does cooling push it?'
    why:
      A: 'Lower pressure favours the side with more gas molecules, the left.'
      C: 'Higher temperature favours the endothermic backward reaction.'
      D: 'A catalyst does not shift the position of equilibrium.'
  28:
    answer: C
    steps:
      - 'Definition: activation energy is the minimum energy that colliding particles must have for a reaction to take place.'
      - 'Only collisions with at least this energy break the old bonds, so it is the energy barrier between reactants and products.'
      - 'A catalyst works by providing a path with a lower activation energy.'
      - 'The trap is D, kinetic energy. Particles need kinetic energy to collide, but the minimum needed for reaction has its own name: activation energy.'
    hint: 'Think of the energy hill on a reaction profile. What is its height called?'
    why:
      A: 'Lattice energy is the energy change when ions form a crystal lattice.'
      B: 'Ionization energy is the energy to remove an electron from a gaseous atom.'
      D: 'Kinetic energy is energy of motion; the minimum for reaction is the activation energy.'
  29:
    answer: A
    steps:
      - 'Rule: activation energy = energy at the peak of the curve − energy of the reactants.'
      - 'A catalyst lowers the peak, so the catalysed reaction is the lower, dashed curve.'
      - 'Read the graph: the reactants start at 100 kJ and the dashed peak is at 200 kJ.'
      - 'Activation energy of the catalysed reaction = 200 − 100 = 100 kJ.'
      - 'Check: the uncatalysed reaction has 300 − 100 = 200 kJ, so the catalyst has halved the barrier.'
      - 'The trap is D, 200 kJ. That is the height of the dashed peak, read from zero instead of from the reactants.'
    hint: 'Measure the height of the hill from where the reactants start, not from the axis.'
    why:
      B: 'Is the peak of the uncatalysed curve, read from zero.'
      C: 'Does not match any feature of the catalysed curve.'
      D: 'Is the peak of the catalysed curve read from zero; subtract the 100 kJ of the reactants.'
  30:
    answer: C
    steps:
      - 'Rule: K = (concentrations of products, each raised to its coefficient) ÷ (concentrations of reactants, each raised to its coefficient). Pure solids are left out, because their concentration does not change.'
      - 'Equation: $\ce{3Fe(s) + 4H2O(g) <=> Fe3O4(s) + 4H2(g)}$.'
      - 'Leave out $\ce{Fe(s)}$ and $\ce{Fe3O4(s)}$. The gases are $\ce{H2}$ (product, coefficient 4) and $\ce{H2O}$ (reactant, coefficient 4).'
      - 'So $K = \dfrac{[\ce{H2}]^4}{[\ce{H2O}]^4}$.'
      - 'The trap is B. It has the right terms but upside down; products always go on top.'
    hint: 'Which substances are solids? Leave them out, then put products over reactants.'
    why:
      A: 'Includes the solids and leaves out the powers of 4.'
      B: 'Puts the reactant on top; products go in the numerator.'
      D: 'Includes the solids, uses wrong powers and puts reactants on top.'
  31:
    answer: D
    steps:
      - 'Definition: a neutral oxide reacts with neither acids nor alkalis, and does not change the colour of litmus.'
      - 'The neutral oxides to know are carbon(II) oxide (CO), dinitrogen(I) oxide ($\ce{N2O}$), nitrogen(II) oxide (NO) and water.'
      - 'Carbon(IV) oxide, sulphur(IV) oxide and sulphur(VI) oxide all dissolve in water to give acids, so they are acidic oxides.'
      - 'So the neutral oxide is carbon(II) oxide.'
      - 'The trap is A. It is the other oxide of carbon, but $\ce{CO2}$ forms trioxocarbonate(IV) acid with water, so it is acidic.'
    hint: 'Which of these does not make an acid with water?'
    why:
