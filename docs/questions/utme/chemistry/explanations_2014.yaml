format_version: 1
exam_year: 2014
subject: CHEM
explanations:
  2:
    answer: C
    steps:
      - 'A compound is two or more elements chemically combined in a fixed ratio. A mixture is two or more substances only physically mixed, in any ratio.'
      - 'Because the parts of a compound are chemically bound, separating them needs a chemical reaction. The parts of a mixture can be separated by physical means such as filtration or distillation.'
      - 'So the real difference is that the constituents of a compound are chemically bound together while those of a mixture are not.'
      - 'The trap is A. It says the opposite of the truth: a mixture keeps the properties of its parts, while a compound has new properties of its own. Sodium is a reactive metal and chlorine a poisonous gas, but sodium chloride is table salt.'
    hint: 'Ask yourself: are the parts held by chemical bonds, or just mixed together?'
    why:
      A: 'Reversed: a mixture keeps its constituents'' properties, a compound does not.'
      B: 'Mixtures can be heterogeneous (sand and water), and a compound is always uniform.'
      D: 'Reversed: a compound has a fixed formula, a mixture has no fixed composition.'
  3:
    answer: D
    steps:
      - 'Percentage by mass of an element = (mass of the element in one mole ÷ molar mass) × 100.'
      - 'Sulphur(IV) oxide is $\ce{SO2}$: one sulphur and two oxygens.'
      - 'Molar mass = 32 + 2 × 16 = 64 g mol⁻¹.'
      - '% S = 32 ÷ 64 × 100 = 50%.'
      - 'The trap is A, 66%. That is roughly the share of the atoms that are oxygen (2 out of 3), not the share of the mass that is sulphur.'
    hint: 'Write the formula from the oxidation number IV, then find the molar mass.'
    why:
      A: 'Counts atoms (2 of 3 are oxygen) instead of masses.'
      B: 'Would need sulphur to weigh one quarter of the molecule, which it does not.'
      C: 'This is the value for sulphur(VI) oxide, SO3 (32 ÷ 80 = 40%).'
  4:
    answer: A
    steps:
      - 'Graham''s law: the rate of diffusion of a gas is inversely proportional to the square root of its relative molecular mass, so rate of X ÷ rate of Y = √(M of Y ÷ M of X).'
      - 'X diffuses twice as fast, so 2 = √(M of Y ÷ 32).'
      - 'Square both sides: 4 = M of Y ÷ 32.'
      - 'M of Y = 4 × 32 = 128.'
      - 'Check: Y diffuses more slowly, so it must be heavier than X. 128 is heavier. The trap is D, 64, which forgets to square the 2.'
    hint: 'A faster gas is a lighter gas. Square the rate ratio.'
    why:
      B: 'Divides by 4, making Y lighter, but the slower gas must be heavier.'
      C: 'Divides by 2, making Y lighter, but the slower gas must be heavier.'
      D: 'Multiplies by 2 instead of 2² = 4.'
  5:
    answer: C
    steps:
      - 'General gas equation: P₁V₁ ÷ T₁ = P₂V₂ ÷ T₂, with temperatures in kelvin.'
      - 'T₁ = 25 + 273 = 298 K and T₂ = 75 + 273 = 348 K. P₁ = 700 mmHg, V₁ = 200 cm³, V₂ = 350 cm³.'
      - 'P₂ = P₁V₁T₂ ÷ (T₁V₂) = (700 × 200 × 348) ÷ (298 × 350).'
      - 'Top: 700 × 200 × 348 = 48 720 000. Bottom: 298 × 350 = 104 300. P₂ = 48 720 000 ÷ 104 300 = 467.11 mmHg.'
      - 'Check: the volume grew a lot (pressure falls) and the temperature rose a little (pressure rises a bit), so the answer should be a little below 700 × 200 ÷ 350 = 400. The trap is D, 400.00 mmHg, which forgets the temperature change.'
    hint: 'Change both temperatures to kelvin before you substitute.'
    why:
      A: 'Uses the temperatures upside down (T₁ on top), so the pressure falls too far.'
      B: 'Swaps the volumes, as if the gas were compressed.'
      D: 'Uses Boyle''s law only and ignores the rise in temperature.'
  6:
    answer: D
    steps:
      - 'The group of a main-group element is the number of electrons in its outermost shell.'
      - 'The outermost shell here is shell 3: 3s² 3p⁵ holds 2 + 5 = 7 electrons.'
      - 'Seven outer electrons put the element in group VII, the halogens. With 17 electrons in all, X is chlorine.'
      - 'The trap is B. It counts only the 3p electrons (5) and forgets the two 3s electrons in the same shell.'
    hint: 'Add up every electron in the highest shell, s and p together.'
    why:
      A: '3p⁵ is one electron short of a full p sub-shell (p⁶).'
      B: 'The outer shell has 3s² 3p⁵, which is 7 electrons, not 5.'
      C: 'Group II elements end in s², with no p electrons in the outer shell.'
  7:
    answer: D
    steps:
      - 'Rule: some elements in period 2 resemble the element one period down and one group to the right. This is the diagonal relationship.'
      - 'Beryllium is in period 2, group II. Aluminium is in period 3, group III. So aluminium sits diagonally below and to the right of beryllium.'
      - 'Moving right raises the charge density of the ion, and moving down lowers it, so the two effects cancel. Be²⁺ and Al³⁺ end up with similar charge-to-size ratios.'
      - 'That is why both form amphoteric oxides and hydroxides and covalent chlorides.'
      - 'The trap is A. Being metals is true, but most metals are not alike in this way; it does not explain the special likeness.'
    hint: 'Find each element on the periodic table and look at where they sit relative to each other.'
    why:
      A: 'True but too general; it does not explain why these two are so alike.'
      B: 'Be is in group II and Al in group III.'
      C: 'Be is in period 2 and Al in period 3.'
  8:
    answer: D
    steps:
      - 'Rule: the bigger the electronegativity difference between two atoms, the more ionic the bond.'
      - 'A difference of about 0 gives a non-polar covalent bond; up to about 1.7 gives a polar covalent bond; above about 1.7 the bond is ionic.'
      - 'A difference of 3.0 is well above 1.7, so one atom pulls the electron right across: the bond is ionic.'
      - 'For comparison, NaCl has a difference of about 2.1 and is ionic.'
      - 'The trap is B. Covalent bonds form when the difference is small, not large.'
    hint: 'Is 3.0 a small or a large difference on the Pauling scale?'
    why:
      A: 'Metallic bonding is between atoms of metals, with no electronegativity gap involved.'
      B: 'Covalent bonding needs a small difference, below about 1.7.'
      C: 'A dative bond depends on a lone pair being donated, not on a large electronegativity gap.'
  9:
    answer: C
    steps:
      - 'In a nuclide symbol, the top number is the mass number (protons + neutrons) and the bottom number is the atomic number (protons).'
      - 'For $\ce{^{60}_{27}Co}$: protons = 27.'
      - 'Neutrons = mass number − atomic number = 60 − 27 = 33.'
      - 'A neutral atom has as many electrons as protons, so electrons = 27.'
      - 'Answer: 27, 33 and 27. The trap is A, which gives the electrons the neutron number.'
    hint: 'Electrons in a neutral atom match which other particle?'
    why:
      A: 'Electrons equal protons (27), not neutrons.'
      B: 'Swaps protons and neutrons.'
      D: 'Uses the mass number as the proton count.'
  10:
    answer: C
    steps:
      - 'The arrangement of particles in a solid or in a giant molecule is found by X-ray diffraction (X-ray crystallography).'
      - 'X-rays have a wavelength close to the distance between atoms, so the regular layers of atoms scatter them into a pattern that can be measured.'
      - 'This is how the structures of large organic molecules such as DNA and proteins were worked out.'
      - 'The trap is A, gamma rays. Gamma rays are also electromagnetic, but their wavelength is far too short to give a useful diffraction pattern.'
    hint: 'Which radiation gives diffraction patterns from crystals?'
    why:
      A: 'Gamma rays are used to kill microbes and treat cancer, not to map crystal structures.'
      B: 'Alpha particles are stopped within a few centimetres of air and are used in smoke detectors.'
      D: 'Beta particles are used for thickness gauges and tracers, not structure studies.'
  11:
    answer: C
    steps:
      - 'Relative atomic mass = sum of (isotope mass × its fraction) for all the isotopes.'
      - '²⁸Si: 0.92 × 28 = 25.76.'
      - '²⁹Si: 0.05 × 29 = 1.45, and ³⁰Si: 0.03 × 30 = 0.90.'
      - 'Total = 25.76 + 1.45 + 0.90 = 28.11.'
      - 'Check: most of the silicon is mass 28, and a little is heavier, so the answer must be just above 28. The trap is D, 28.00, which ignores the heavier isotopes.'
    hint: 'Weight each mass by its percentage, then add.'
    why:
      A: '14 is the atomic number of silicon, not its relative atomic mass.'
      B: 'Takes a plain average of 28, 29 and 30, ignoring the percentages.'
      D: 'Uses only the main isotope and ignores ²⁹Si and ³⁰Si.'
  12:
    answer: C
    steps:
      - 'Nitrogen made from air is obtained by removing oxygen, carbon(IV) oxide and water vapour. The noble (rare) gases, mainly argon, cannot be removed this way.'
      - 'Argon (Ar = 40) is heavier than nitrogen ($\ce{N2}$ = 28), so a little argon makes the gas slightly denser.'
      - 'Nitrogen made from compounds, for example by heating ammonium nitrite, is pure, so it is lighter.'
      - 'This small density difference led Rayleigh and Ramsay to discover argon. The trap is B: oxygen is removed in the preparation, so it is not left behind.'
    hint: 'Which part of air is unreactive enough to stay with the nitrogen?'
    why:
      A: 'Water vapour is removed by a drying agent during the preparation.'
      B: 'Oxygen is removed by heated copper during the preparation.'
      D: 'Carbon(IV) oxide is removed by caustic soda during the preparation.'
  13:
    answer: A
    steps:
      - 'Temporary hardness is caused by dissolved calcium and magnesium hydrogentrioxocarbonate(IV), $\ce{Ca(HCO3)2}$ and $\ce{Mg(HCO3)2}$.'
      - 'It is called temporary because boiling removes it: $\ce{Ca(HCO3)2 ->[heat] CaCO3 + H2O + CO2}$.'
      - 'Permanent hardness is caused by sulphates and chlorides such as $\ce{CaSO4}$, which boiling does not remove.'
      - 'The trap is D. It includes $\ce{CaSO4}$, which causes permanent hardness. Remember: hydrogencarbonates are temporary, sulphates are permanent.'
    hint: 'Which salts break down when the water is boiled?'
    why:
      B: '$\ce{CaCO3}$ is insoluble in water, so it cannot cause hardness.'
      C: '$\ce{CaSO4}$ causes permanent, not temporary, hardness.'
      D: '$\ce{CaSO4}$ causes permanent, not temporary, hardness.'
  14:
    answer: A
    steps:
      - 'Efflorescence is the loss of water of crystallization by a hydrated salt when it is left in the air.'
      - 'Example: washing soda, $\ce{Na2CO3.10H2O}$, loses water in air and turns to a white powder.'
      - 'Deliquescence and hygroscopy are the opposite: the substance takes in water from the air.'
      - 'Memory aid: efflorescence, "exit" of water; deliquescence, the solid dissolves in water it absorbs.'
    hint: 'Is water leaving the salt or entering it?'
    why:
      B: 'Deliquescence is absorbing so much water that the solid dissolves.'
      C: 'Hygroscopy is absorbing water without dissolving.'
      D: 'Hydrolysis is a reaction with water, not loss of water to the air.'
  15:
    answer: D
    steps:
      - 'Solubility in mol dm⁻³ = moles of solute dissolved in 1 dm³ (1000 cm³) of solvent.'
      - 'Lead(II) trioxonitrate(V) is $\ce{Pb(NO3)2}$. Molar mass = 207 + 2(14 + 3 × 16) = 207 + 124 = 331 g mol⁻¹.'
      - 'Moles dissolved = 16.55 g ÷ 331 g mol⁻¹ = 0.05 mol, in 100 cm³ of water.'
      - 'In 1000 cm³: 0.05 × 1000 ÷ 100 = 0.50 mol dm⁻³.'
      - 'The trap is A, 0.05 mol dm⁻³. That is the moles in 100 cm³; you must scale up to 1 dm³.'
    hint: 'Find the moles first, then ask how many would dissolve in 1000 cm³.'
    why:
      A: 'Stops at the moles in 100 cm³ and does not scale to 1 dm³.'
      B: 'Four times too big; 16.55 ÷ 331 is 0.05 mol, not 0.2 mol.'
      C: 'Twice too big; 0.05 mol in 100 cm³ is 0.5 mol, not 1 mol, per dm³.'
  16:
    answer: A
    steps:
      - 'A colloid is named by what is dispersed in what.'
      - 'Liquid in liquid gives an emulsion, for example milk (fat droplets in water) or oil shaken with water and soap.'
      - 'Liquid in gas is a fog or aerosol; liquid in solid is a gel.'
      - 'The trap is C, a gel. A gel holds liquid inside a solid network, like jelly, so its medium is solid, not liquid.'
    hint: 'Name the colloid where both phases are liquid. Think of milk.'
    why:
      B: 'Fog is liquid droplets dispersed in a gas (air).'
      C: 'A gel is a liquid dispersed in a solid.'
      D: 'An aerosol is a liquid or solid dispersed in a gas.'
  17:
    answer: D
    steps:
      - 'The best way to control pollution is to stop the pollutant at its source, before it reaches air, water or soil.'
      - 'Treating chemical wastes to turn them into harmless substances before release does exactly this. Examples are neutralising acidic effluent and scrubbing sulphur(IV) oxide from chimney gases.'
      - 'Laws and education help, but they only work if they lead to the wastes being treated. On their own they remove no pollutant.'
      - 'The trap is C. Educating people is useful, but it is indirect; the pollutant is still released until it is treated.'
    hint: 'Which choice actually changes the pollutant itself?'
    why:
      A: 'Better machines reduce only combustion pollution, not all chemical wastes.'
      B: 'Laws do not remove any pollutant by themselves; they depend on treatment being done.'
      C: 'Education is indirect; it removes no pollutant on its own.'
  18:
    answer: B
    steps:
      - 'Basicity of an acid = the number of replaceable (ionisable) hydrogen ions in one molecule.'
      - 'In ethanoic acid, $\ce{CH3COOH}$, only the hydrogen of the COOH group ionises: $\ce{CH3COOH <=> CH3COO- + H+}$.'
      - 'The three hydrogens on the $\ce{CH3}$ group are bonded to carbon and do not ionise.'
      - 'So the basicity is 1: ethanoic acid is monobasic. The trap is A, which counts all four hydrogens.'
    hint: 'Which hydrogen is attached to oxygen?'
    why:
      A: 'Counts every hydrogen, but the three on carbon are not replaceable.'
      C: 'Ethanoic acid has only one ionisable hydrogen, unlike a dibasic acid such as H2SO4.'
      D: 'Counts the CH3 hydrogens, which do not ionise.'
  19:
    answer: A
    steps:
      - 'Litmus is red in acid and blue in alkali.'
      - 'In a neutral solution, litmus is in between, so it is purple.'
      - 'Memory aid: red plus blue makes purple.'
      - 'The trap is B, pink. Pink is the colour of phenolphthalein in alkali, a different indicator.'
    hint: 'Mix the acid colour and the alkali colour of litmus.'
    why:
      B: 'Pink is phenolphthalein in alkali, not litmus.'
      C: 'Yellow is methyl orange in alkali.'
      D: 'Orange is methyl orange at about its end point.'
  20:
    answer: B
    steps:
      - 'Rule: pH is the negative logarithm to base 10 of the hydrogen ion (hydroxonium ion) concentration: pH = −log₁₀[H₃O⁺].'
      - 'Since −log x = log(1/x), this is the same as $\log_{10}\dfrac{1}{[\ce{H3O+}]}$.'
      - 'Check: for pure water [H₃O⁺] = 10⁻⁷ mol dm⁻³, and log(1/10⁻⁷) = 7, the neutral pH.'
      - 'The trap is C. It drops the minus sign, which would give pure water a pH of −7.'
    hint: 'pH carries a minus sign. Write it as a log of one over something.'
    why:
      A: 'This relates to pOH, not pH, and even then the minus sign is missing.'
      C: 'Missing the minus sign, so values come out negative.'
      D: 'This is pOH, not pH.'
  21:
    answer: B
    steps:
      - 'A salt that turns blue litmus red must give an acidic solution.'
      - 'An acid salt still has a replaceable hydrogen. Potassium hydrogen tetraoxosulphate(VI), $\ce{KHSO4}$, is one: $\ce{HSO4- <=> H+ + SO4^2-}$.'
      - 'The released $\ce{H+}$ ions make the solution acidic, so blue litmus turns red.'
      - 'The trap is C. Sodium trioxocarbonate(IV), $\ce{Na2CO3}$, hydrolyses to give an alkaline solution, which turns red litmus blue.'
    hint: 'Look for the salt with "hydrogen" in its name.'
    why:
      A: 'A zincate salt is alkaline in solution.'
      C: '$\ce{Na2CO3}$ hydrolyses to an alkaline solution.'
      D: 'This is a basic salt; it contains hydroxide, not replaceable hydrogen.'
  22:
    answer: B
    steps:
      - 'Rule: the reducing agent is the substance that is oxidized, so its oxidation number goes up.'
      - 'Equation: $\ce{Zn(s) + CuSO4(aq) -> ZnSO4(aq) + Cu(s)}$.'
      - 'Zinc is a free element, so its oxidation number is 0. In $\ce{ZnSO4}$ zinc is $\ce{Zn^2+}$, so it is +2.'
      - 'Zinc goes from 0 to +2, losing two electrons; it is the reducing agent. Copper goes from +2 to 0.'
      - 'The trap is A, 0 to +4, which wrongly counts zinc as +4 in the sulphate.'
    hint: 'Free elements are 0. What charge does zinc carry in zinc sulphate?'
    why:
      A: 'Zinc is +2 in ZnSO4, not +4.'
      C: 'Free zinc is 0, not +1.'
      D: 'Free zinc is 0 and zinc never reaches +3 here.'
  23:
    answer: C
    steps:
      - 'Rule: the oxidizing agent gives oxygen (or removes hydrogen, or takes electrons) and is itself reduced.'
      - 'Equation: $\ce{H2O(g) + C(s) -> H2(g) + CO(g)}$.'
      - 'Steam loses its oxygen to carbon and becomes hydrogen: steam is reduced. Hydrogen goes from +1 in water to 0 in $\ce{H2}$.'
      - 'Carbon gains oxygen and becomes CO: carbon is oxidized, so it is the reducing agent.'
      - 'So the oxidizing agent is $\ce{H2O(g)}$. The trap is B: carbon is the one being oxidized, which makes it the reducing agent.'
    hint: 'Which reactant gives away its oxygen?'
    why:
      A: 'CO is a product, not a reactant.'
      B: 'Carbon gains oxygen, so it is oxidized; it is the reducing agent.'
      D: 'H2 is a product, not a reactant.'
  24:
    answer: B
    steps:
      - 'Faraday''s first law: the charge needed = moles of electrons × F.'
      - 'Cathode equation: $\ce{Cu^2+ + 2e- -> Cu}$. So 2 mol of electrons (2 × 96 500 C) deposit 1 mol (64 g) of copper.'
      - 'Moles of copper in 10 g = 10 ÷ 64 = 0.15625 mol.'
      - 'Charge = 0.15625 × 2 × 96 500 = 30 156.25 C, which is 30 156.3 C.'
      - 'The trap is D, about half the right charge. That is what you get if you use one electron per copper ion instead of two.'
    hint: 'How many electrons does each Cu²⁺ ion need?'
    why:
      A: 'Does not match 10 g of copper with two electrons per ion.'
      C: 'About double the right value, as if four electrons were needed per copper.'
      D: 'About half the right value, close to what one electron per copper ion would give.'
  25:
    answer: D
    steps:
      - 'Rule: 1 faraday is the charge of 1 mole of electrons.'
      - 'Cathode equation: $\ce{Cu^2+ + 2e- -> Cu}$. So 1 mol of copper needs 2 F.'
      - '0.25 mol of copper needs 0.25 × 2 = 0.50 F.'
      - 'The trap is C, 0.05 F, which slips a decimal place.'
    hint: 'Each copper ion has a 2+ charge, so how many faradays per mole of copper?'
    why:
      A: 'Uses four faradays per mole of copper.'
      B: 'Far too small; it does not use 2 F per mole.'
      C: 'Slips a decimal place; 0.25 × 2 is 0.50.'
  26:
    answer: A
    steps:
      - 'In an energy profile, the height from the reactants'' level to the products'' level is the heat of reaction, ΔH.'
      - 'Z is drawn between the A + B level and the C + D level, so Z is ΔH.'
      - 'Here C + D is higher than A + B, so the reaction absorbs heat: it is endothermic and ΔH is positive.'
      - 'Activation energy is measured from the reactants up to the peak X. The trap is B, because Y is a vertical arrow too, but Y runs from the products to the peak.'
    hint: 'Look where each end of the Z arrow sits.'
    why:
      B: 'Activation energy runs from the reactants to the peak, not to the products.'
      C: 'Free energy is not read off as a gap on this kind of diagram.'
      D: 'Entropy is a measure of disorder and is not shown on an energy profile.'
  27:
    answer: A
    steps:
      - 'Gibbs equation: ΔG = ΔH − TΔS, so ΔH = ΔG + TΔS.'
      - 'T must be in kelvin: 25 + 273 = 298 K.'
      - 'TΔS = 298 K × 10 J mol⁻¹ K⁻¹ = 2980 J mol⁻¹.'
      - 'ΔH = −899 + 2980 = +2081 J mol⁻¹.'
      - 'The trap is B, −2081. It subtracts TΔS instead of adding it when rearranging.'
    hint: 'Rearrange ΔG = ΔH − TΔS for ΔH, and use 298 K.'
    why:
      B: 'Rearranges wrongly: ΔH = ΔG − TΔS.'
      C: 'Uses 25 instead of 298 K: −899 + 250 = −649.'
      D: 'Uses 25 °C instead of kelvin and also gets the sign wrong.'
  28:
    answer: A
    steps:
      - 'The equilibrium constant K is the ratio of product concentrations to reactant concentrations at equilibrium.'
      - 'A very large K means that, at equilibrium, products far outweigh reactants.'
      - 'So a very large K shows the maximum yield of product.'
      - 'The trap is B. ΔH − TΔS = 0 means ΔG = 0, a balance point, not a large yield.'
    hint: 'K = [products] ÷ [reactants]. When is that ratio biggest?'
    why:
      B: 'ΔG = 0 describes a balance point, not a high yield.'
      C: 'ΔH > TΔS gives a positive ΔG, which favours the reactants.'
      D: 'K is a ratio of concentrations and can never be less than zero.'
  29:
    answer: C
    steps:
      - 'Rate of reaction = change in concentration of a reactant (or product) per unit time.'
      - 'In symbols, rate = Δ[reactant] ÷ Δt, with units such as mol dm⁻³ s⁻¹.'
      - 'This is exactly what the stem describes.'
      - 'The trap is D. Order of reaction tells how the rate depends on concentration; it is not the rate itself.'
    hint: 'Which quantity has "per second" in its unit?'
    why:
      A: 'Entropy measures disorder, not change with time.'
      B: 'Enthalpy of reaction is the heat change, not a rate.'
      D: 'Order describes how rate depends on concentration.'
  30:
    answer: D
    steps:
      - 'Le Chatelier''s principle: if a condition of a system at equilibrium is changed, the equilibrium shifts to oppose the change.'
      - 'Equation: $\ce{Cr2O7^2-(aq) + H2O(l) <=> 2CrO4^2-(aq) + 2H+(aq)}$. $\ce{H+}$ is a product.'
      - 'Adding $\ce{H+}$ is opposed by using it up, so the backward reaction is favoured and the equilibrium shifts to the left.'
      - 'You can see this: adding acid turns yellow chromate back into orange dichromate.'
      - 'The trap is C. Students often think "add something, move right", but $\ce{H+}$ is on the right, so the shift is away from it.'
    hint: 'Which side of the equation is H⁺ on?'
    why:
      A: 'Adding a product shifts the equilibrium back towards the reactants.'
      B: 'The reaction still proceeds; only the position shifts.'
      C: 'Shifting right would make even more H⁺, which is the opposite of opposing the change.'
  31:
    answer: B
    steps:
      - 'Rule: a metal above hydrogen in the activity series displaces hydrogen from dilute acids.'
      - 'Magnesium is high in the series: $\ce{Mg + H2SO4 -> MgSO4 + H2}$.'
      - 'Copper and gold are below hydrogen, so they do not react with dilute acids at all.'
      - 'The trap is A. Lead is just above hydrogen, but with dilute $\ce{H2SO4}$ it forms insoluble $\ce{PbSO4}$, which coats the metal and stops the reaction almost at once.'
    hint: 'Pick the metal well above hydrogen in the activity series.'
    why:
      A: 'An insoluble PbSO4 layer forms and stops the reaction.'
      C: 'Copper is below hydrogen and does not displace it.'
      D: 'Gold is very unreactive and does not displace hydrogen.'
  32:
    answer: B
    steps:
      - 'Concentrated $\ce{H2SO4}$ is a strong drying (dehydrating) agent; it absorbs water vapour.'
      - 'In the diagram, chlorine first bubbles through water, so it picks up water vapour.'
      - 'The next bottle, of concentrated $\ce{H2SO4}$, removes that water vapour, so dry chlorine is collected.'
      - 'The trap is A. "Purify" sounds right, but the impurity (HCl) is removed by the water bottle; the acid bottle is there to dry the gas.'
    hint: 'What did the gas just pick up from the bottle before?'
    why:
      A: 'The HCl impurity is removed by the water; the acid only removes moisture.'
      C: 'Chlorine stays a gas at room temperature; nothing here liquefies it.'
      D: 'Chlorine keeps its smell; the acid does not change it.'
  33:
    answer: C
    steps:
      - 'In the flask, concentrated HCl is oxidized by $\ce{KMnO4}$ to chlorine.'
      - 'Concentrated HCl is volatile, so some hydrogen chloride gas is carried along with the chlorine.'
      - 'Hydrogen chloride is very soluble in water, while chlorine is only moderately soluble. So the water bottle removes the HCl.'
      - 'The trap is A, oxygen. No oxygen is made in this preparation.'
    hint: 'Which reactant in the flask can escape as a gas?'
    why:
      A: 'No oxygen is produced in this preparation.'
      B: 'No sulphur compound is present to make SO2.'
      D: 'No hydrogen is made; HCl is oxidized, not reduced.'
  34:
    answer: D
    steps:
      - 'Fluorine is the most electronegative element and the most reactive non-metal.'
      - 'It reacts with almost everything it meets, so in nature it is always combined, for example in fluorspar, $\ce{CaF2}$.'
      - 'Rule: very reactive elements are found only as compounds; unreactive ones such as gold may be found free.'
      - 'The trap is A. Fluorine is poisonous, but being poisonous does not stop an element existing free.'
    hint: 'Elements found free in nature are unreactive. Is fluorine?'
    why:
      A: 'Toxicity has nothing to do with whether an element is found free.'
      B: 'True, but it does not explain it; the reason is the reactivity of the halogens.'
      C: 'Fluorine is the opposite of inert.'
  35:
    answer: D
    steps:
      - 'In fused NaCl, the ions move to the electrodes: $\ce{Na+}$ to the cathode, $\ce{Cl-}$ to the anode.'
      - 'At the anode: $\ce{2Cl- -> Cl2 + 2e-}$. At the cathode: $\ce{Na+ + e- -> Na}$.'
      - 'Chlorine is very reactive, so the anode must be made of a material that chlorine does not attack. Platinum (or graphite) is inert to chlorine.'
      - 'So the anode is platinum because chlorine does not react with platinum.'
      - 'The trap is C. Sodium does not touch the anode at all; it forms at the cathode.'
    hint: 'First work out which product forms at the anode.'
