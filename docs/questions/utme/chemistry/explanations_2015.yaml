format_version: 1
exam_year: 2015
subject: CHEM
explanations:
  1:
    answer: A
    steps:
      - 'Kinetic theory says the average kinetic energy of gas molecules is directly proportional to the absolute (kelvin) temperature. This is true for every gas, with no other condition.'
      - 'Boyle''s law, $pV = \text{constant}$, holds only at constant temperature, and it says volume falls as pressure rises.'
      - 'Charles''s law, $V \propto T$, holds only at constant pressure.'
      - 'So the only statement that is true as written, with nothing missing, is A.'
      - 'The trap is C. It sounds like Boyle''s law, but without "at constant temperature" it is not true: heat a gas and both its pressure and volume can rise together.'
    hint: 'Which statement needs no "at constant ..." to be true?'
    why:
      B: 'At constant temperature volume decreases as pressure increases, not increases.'
      C: 'Boyle''s law only holds at constant temperature, and the statement leaves that out.'
      D: 'Volume is proportional to absolute temperature only at constant pressure, and the statement leaves that out.'
  2:
    answer: D
    steps:
      - 'An ester $\ce{RCOOR''}$ is named alkyl alkanoate: the alkyl part comes from the alcohol, the alkanoate part from the acid.'
      - 'In $\ce{HCOOCH3}$ the acid part is $\ce{HCOO-}$ (one carbon, methanoate) and the alkyl part is $\ce{CH3}$ (methyl). So it is methyl methanoate.'
      - 'A hydrocarbon with a triple bond ends in "-yne". $\ce{HC#CH}$ has two carbons, so it is ethyne.'
      - 'Methyl methanoate and ethyne is D.'
      - 'The trap is A. Ethene is $\ce{CH2=CH2}$ with a double bond; a triple bond always gives "-yne".'
    hint: 'Count the bonds between the two carbons in the second compound.'
    why:
      A: 'Ethene has a C=C double bond; $\ce{HC#CH}$ has a triple bond.'
      B: 'Methanoic acid is $\ce{HCOOH}$; here the H of the acid is replaced by $\ce{CH3}$, making an ester.'
      C: 'The alkyl group is $\ce{CH3}$, methyl, not ethyl.'
  3:
    answer: B
    steps:
      - 'A white precipitate with $\ce{AgNO3}$ that dissolves in aqueous ammonia is silver chloride, so X contains $\ce{Cl-}$ ions.'
      - '$\ce{Ag+ + Cl- -> AgCl(s)}$, a white solid that dissolves in $\ce{NH3(aq)}$.'
      - 'The only common white chloride that dissolves in hot water is lead(II) chloride: $\ce{Pb^2+ + 2Cl- -> PbCl2(s)}$.'
      - 'PbCl₂ is insoluble in cold water but dissolves on boiling, and comes back as crystals on cooling. So Y contains $\ce{Pb^2+}$.'
      - 'The trap is A. AgCl also forms, but it does not dissolve on boiling; and adding $\ce{Ag+}$ again would just repeat the first test.'
    hint: 'First name the anion in X. Which white chloride dissolves in hot water?'
    why:
      A: 'AgCl is white but stays insoluble when boiled.'
      C: 'Lead in solution is $\ce{Pb^2+}$; $\ce{Pb^4+}$ ions are not found in simple aqueous solution.'
      D: 'Zinc chloride is soluble, so no precipitate forms.'
  4:
    answer: D
    steps:
      - 'Alkanes are saturated hydrocarbons with general formula $\ce{C_nH_{2n+2}}$.'
      - 'Methane, $\ce{CH4}$, fits with n = 1: 2(1) + 2 = 4 hydrogens.'
      - 'It is the first member of the alkanes, followed by ethane and propane.'
      - 'The trap is A. Alkenes need a C=C double bond, so the first alkene has two carbons (ethene); one carbon cannot form one.'
    hint: 'Does methane have any double bond or oxygen atom?'
    why:
      A: 'Alkenes need a C=C bond; methane has only one carbon.'
      B: 'Alcohols contain an OH group; methane has none.'
      C: 'Esters contain a COO group; methane has none.'
  5:
    answer: C
    steps:
      - 'Ammonium chloride is made of $\ce{NH4+}$ and $\ce{Cl-}$ ions, so there is ionic bonding between them.'
      - 'Inside $\ce{NH4+}$, three N-H bonds are ordinary covalent bonds, each atom giving one electron.'
      - 'The fourth N-H bond forms when nitrogen''s lone pair is donated to $\ce{H+}$: $\ce{NH3 + H+ -> NH4+}$. That is a co-ordinate (dative) bond.'
      - 'So $\ce{NH4Cl}$ has ionic, covalent and co-ordinate bonds.'
      - 'The trap is A. It forgets the dative bond that turns $\ce{NH3}$ into $\ce{NH4+}$.'
    hint: 'How does $\ce{NH3}$ pick up a fourth hydrogen?'
    why:
      A: 'Leaves out the co-ordinate bond in $\ce{NH4+}$.'
      B: 'Leaves out the three ordinary covalent N-H bonds.'
      D: 'There are no metal atoms, so there is no metallic bonding, and the ionic bond is missing.'
  6:
    answer: D
    steps:
      - 'The mass lost on heating is the water driven off. Find the moles of hydrate and the moles of water lost, then divide.'
      - 'Mass of $\ce{CuSO4.5H2O}$ = 14.98 − 10.00 = 4.98 g. Mass of water lost = 14.98 − 13.54 = 1.44 g.'
      - 'Molar mass of $\ce{CuSO4.5H2O}$ = 63.5 + 32 + 4(16) + 5(18) = 249.5 g mol⁻¹, so moles = 4.98 ÷ 249.5 = 0.020 mol.'
      - 'Moles of water lost = 1.44 ÷ 18 = 0.080 mol.'
      - 'Water lost per formula unit = 0.080 ÷ 0.020 = 4. At 120 °C copper(II) sulphate keeps one water, $\ce{CuSO4.H2O}$.'
      - 'The trap is C or B: dividing the water mass by the residue mass, or forgetting to subtract the crucible.'
    hint: 'Subtract to find the hydrate mass and the water mass, then turn both into moles.'
    why:
      A: 'One water is what remains at 120 °C, not what is lost.'
      B: 'Comes from a wrong subtraction or a wrong molar mass.'
      C: 'Comes from using the residue mass instead of the hydrate mass.'
  8:
    answer: D
    steps:
      - 'Only the carbonate reacts with the acid: $\ce{K2CO3 + 2HCl -> 2KCl + H2O + CO2}$. So moles of $\ce{K2CO3}$ = ½ × moles of $\ce{HCl}$.'
      - 'Moles of $\ce{HCl}$ = 40.00 ÷ 1000 dm³ × 0.1 mol dm⁻³ = 0.004 mol, so moles of $\ce{K2CO3}$ in 25 cm³ = 0.002 mol.'
      - 'The flask holds 250 cm³, ten times as much: 0.002 × 10 = 0.020 mol of $\ce{K2CO3}$.'
      - 'Molar mass of $\ce{K2CO3}$ = 2(39) + 12 + 3(16) = 138 g mol⁻¹. Mass = 0.020 × 138 = 2.76 g.'
      - '% $\ce{K2CO3}$ = 2.76 ÷ 3.00 × 100 = 92%.'
      - 'The trap is forgetting to multiply by 10 for the whole flask, which gives about 9%, or forgetting the 1:2 ratio.'
    hint: 'Which part of the mixture reacts with the acid, and in what mole ratio?'
    why:
      A: 'Does not follow from the data; check the 1:2 ratio and the scale-up to 250 cm³.'
      B: 'Does not follow from the data; check the molar mass 138 g mol⁻¹.'
      C: 'Does not follow from the data; the carbonate mass is 2.76 g of 3.00 g.'
  9:
    answer: C
    steps:
      - 'Across a period, the nuclear charge rises while electrons go into the same shell, so the nucleus pulls the outer electrons harder.'
      - 'This harder pull makes it harder to remove an electron (ionization energy rises), makes the atom attract bonding electrons more (electronegativity rises) and makes it release more energy on gaining an electron (electron affinity rises).'
      - 'The same pull draws the shell in, so atomic radius decreases across the period.'
      - 'So 1, 3 and 4 increase, and 2 decreases: option C.'
      - 'The trap is any option with 2 in it. Students think "more electrons, bigger atom", but the extra protons pull the shell smaller.'
    hint: 'What does a rising nuclear charge do to the size of the atom?'
    why:
      A: 'Atomic radius decreases across a period.'
      B: 'Atomic radius decreases across a period, and electron affinity is left out.'
      D: 'Atomic radius decreases, so it cannot be in the list.'
  10:
    answer: B
    steps:
      - 'Relative atomic mass = sum of (mass number × fraction) for all the isotopes.'
      - 'RAM = (16 × 90/100) + (18 × 10/100).'
      - '= 14.4 + 1.8 = 16.2.'
      - 'This makes sense: the answer is close to 16 because most of the atoms are $\ce{^{16}_{8}Z}$.'
      - 'The trap is C, 17.0, the plain average of 16 and 18, which ignores how much of each isotope there is.'
    hint: 'Weight each mass by its percentage.'
    why:
      A: 'Ignores the 10% of heavier isotope.'
      C: 'A plain average of 16 and 18 without the percentages.'
      D: 'Swaps the percentages, giving the heavier isotope 90%.'
  11:
    answer: A
    steps:
      - 'Atomic number 17 is chlorine, 2,8,7: seven outer electrons.'
      - 'Gaining one electron completes the octet, giving −1 (as in $\ce{Cl-}$ and $\ce{HCl}$).'
      - 'Using all seven outer electrons in bonding with oxygen gives the highest state, +7 (as in $\ce{HClO4}$, $\ce{Cl2O7}$).'
      - 'So −1 and +7.'
      - 'The trap is D, −2 and +6, which belongs to group 6 (sulphur), one group to the left.'
    hint: 'Write the configuration. How many electrons can it gain, and how many can it use?'
    why:
      B: '+6 is the top state for group 6, not group 7.'
      C: '−3 and +5 belong to group 5, such as nitrogen and phosphorus.'
      D: '−2 and +6 belong to group 6, such as sulphur.'
  12:
    answer: B
    steps:
      - 'Valence electrons are the electrons in the outermost shell. The bottom number is the atomic number, the number of electrons in a neutral atom.'
      - 'Phosphorus has 15 electrons: 2, 8, 5.'
      - 'The outer shell holds 5, so phosphorus has 5 valence electrons (it is in group 5).'
      - 'The trap is C, 15, the total number of electrons, or D, 31, the mass number.'
    hint: 'Arrange 15 electrons as 2, 8, ... and look at the last shell.'
    why:
      A: '3 is the number of shells, not the outer electrons.'
      C: '15 is the total number of electrons, not just the outer ones.'
      D: '31 is the mass number (protons plus neutrons).'
  13:
    answer: C
    steps:
      - 'From the equation, 1 mol of $\ce{PbS}$ comes from 1 mol of $\ce{H2S}$, and 1 mol of gas at s.t.p. takes up 22.4 dm³.'
      - 'Molar mass of $\ce{PbS}$ = 207 + 32 = 239 g mol⁻¹, so moles = 5.02 ÷ 239 = 0.0210 mol.'
      - 'Moles of $\ce{H2S}$ = 0.0210 mol, so its volume = 0.0210 × 22.4 = 0.470 dm³.'
      - '% by volume = 0.470 ÷ 10.0 × 100 = 4.70%.'
      - 'The trap is B, 47.0, which forgets that 10.0 dm³ is the whole sample and divides by 1 dm³.'
    hint: 'Turn the mass of PbS into moles, then use 22.4 dm³ per mole.'
    why:
      A: 'Uses the mass of PbS as if it were a percentage.'
      B: 'Ten times too big; the volume must be divided by 10.0 dm³.'
      D: 'Ten times too small; a decimal place slipped.'
  14:
    answer: D
    steps:
      - 'Alkaline pyrogallol (pyrogallol in KOH or NaOH solution) absorbs oxygen.'
      - 'This is why it is used to find the percentage of oxygen in air: the gas volume shrinks by about 21%.'
      - 'Nitrogen and the noble gases are unreactive and pass straight through.'
      - 'Remember: pyrogallol for oxygen, KOH (or NaOH) for carbon dioxide.'
    hint: 'Which part of air is removed in the experiment to measure oxygen?'
    why:
      A: 'Nitrogen is unreactive and is not absorbed.'
      B: 'Neon is a noble gas and is not absorbed.'
      C: 'Argon is a noble gas and is not absorbed.'
  15:
    answer: B
    steps:
      - 'Chlorine is added to town water as a disinfectant.'
      - 'In water it forms chloric(I) acid, $\ce{Cl2 + H2O -> HCl + HOCl}$, and $\ce{HOCl}$ kills bacteria and other germs.'
      - 'Hardness is removed by boiling or softening, and odour by aeration or charcoal, not by chlorine.'
      - 'The trap is A. Chlorine can remove some smells, but its job in treatment is to kill germs.'
    hint: 'What makes untreated water unsafe to drink?'
    why:
      A: 'Odour is removed by aeration or charcoal; chlorination is for germs.'
      C: 'Temporary hardness is removed by boiling or adding lime.'
      D: 'Permanent hardness is removed by washing soda or ion exchange.'
  16:
    answer: A
    steps:
      - 'Concentration (mol dm⁻³) = moles ÷ volume in dm³.'
      - 'Molar mass of $\ce{NaOH}$ = 23 + 16 + 1 = 40 g mol⁻¹, so moles = 4.0 ÷ 40 = 0.10 mol.'
      - 'Volume = 250 cm³ = 0.250 dm³.'
      - 'Concentration = 0.10 ÷ 0.250 = 0.40 mol dm⁻³.'
      - 'The trap is B, 0.10, which is the number of moles, not the moles per dm³.'
    hint: 'Change 250 cm³ into dm³ before you divide.'
    why:
      B: 'That is the number of moles in the 250 cm³, not per dm³.'
      C: 'Divides by 250 × 10 instead of converting 250 cm³ to 0.250 dm³.'
      D: 'Divides moles by a wrong volume.'
  17:
    answer: A
    steps:
      - 'Oil floats as a thin film on the water surface.'
      - 'The film stops oxygen dissolving, so fish suffocate; it also coats the feathers of sea birds and the gills of fish.'
      - 'Many oil compounds are also poisonous, so plants and animals in the water die.'
      - 'So the major effect is the destruction of marine life.'
      - 'The trap is C. Acid rain from $\ce{SO2}$ makes water acidic; oil is not an acid.'
    hint: 'What happens to fish and birds when oil covers the sea surface?'
    why:
      B: 'Oil does not remove salt from the sea.'
      C: 'Oil is not acidic; acidity comes from gases like $\ce{SO2}$ and $\ce{NO2}$.'
      D: 'Oil makes water more toxic, not less.'
  18:
    answer: D
    steps:
      - 'Le Chatelier''s principle: a system at equilibrium shifts to oppose a change.'
      - 'For most solids, dissolving absorbs heat: solute + water ⇌ solution, $\Delta H$ positive.'
      - 'Raising the temperature is opposed by the endothermic direction, so more solute dissolves.'
      - 'So solubility rises with temperature because most solutes dissolve with absorption of heat.'
      - 'The trap is C. Dissociation into ions happens on dissolving at any temperature; it does not explain why heat helps.'
    hint: 'Is dissolving most solids exothermic or endothermic?'
    why:
      A: 'Solute particles colliding with each other does not make them dissolve.'
      B: 'If dissolving gave out heat, heating would lower the solubility (as with gases).'
      C: 'Dissociation does not explain the effect of temperature on solubility.'
  19:
    answer: D
    steps:
      - 'Boiling point depends on how strongly molecules hold one another.'
      - 'Alkanols contain the $\ce{-OH}$ group. The H on oxygen bonds to the O of a neighbouring molecule: a hydrogen bond.'
      - 'Extra energy is needed to break these hydrogen bonds, so alkanols boil much higher than alkanes of similar mass (ethanol 78 °C, propane −42 °C).'
      - 'The trap is C. Covalent bonds hold atoms inside a molecule; boiling does not break them.'
    hint: 'Which bond forms between the OH groups of neighbouring molecules?'
    why:
      A: 'Alkanols are covalent molecules, not ionic.'
      B: 'Simple alkanols have no benzene ring.'
      C: 'Covalent bonds are inside molecules and are not broken on boiling.'
  20:
    answer: C
    steps:
      - 'Balanced equation: $\ce{H2SO4 + 2NaOH -> Na2SO4 + 2H2O}$, so 1 mol acid reacts with 2 mol base.'
      - 'Moles of $\ce{NaOH}$ = 25.00 ÷ 1000 dm³ × 0.125 mol dm⁻³ = 0.003125 mol.'
      - 'Moles of $\ce{H2SO4}$ = 0.003125 ÷ 2 = 0.0015625 mol.'
      - 'Concentration = 0.0015625 ÷ (15.00 ÷ 1000) = 0.104 mol dm⁻³.'
      - 'The trap is a 1:1 ratio: 0.003125 ÷ 0.015 = 0.208 mol dm⁻³, twice the right value. Always halve the moles of NaOH for a diprotic acid.'
    hint: 'How many moles of NaOH does one mole of H₂SO₄ neutralize?'
    why:
      A: 'Far too large; a decimal place slipped.'
      B: 'Comes from mixing up the volumes instead of using the 1:2 ratio.'
      D: 'Far too small; the acid volume was not converted correctly.'
  21:
    answer: D
    steps:
      - 'Balanced equation: $\ce{Na2CO3 + H2SO4 -> Na2SO4 + H2O + CO2}$, a 1:1 ratio.'
      - 'Molar mass of $\ce{Na2CO3.10H2O}$ = 2(23) + 12 + 3(16) + 10(18) = 106 + 180 = 286 g mol⁻¹.'
      - 'Moles = 2.86 ÷ 286 = 0.0100 mol, so moles of acid = 0.0100 mol.'
      - 'Volume = moles ÷ concentration = 0.0100 ÷ 0.1 = 0.100 dm³ = 100 cm³.'
      - 'The trap is leaving out the 10 waters: 2.86 ÷ 106 = 0.027 mol, which fits no option. The water of crystallization is part of the formula mass.'
    hint: 'Include the ten water molecules in the molar mass.'
    why:
      A: 'Five times too small; the ratio or the molar mass is wrong.'
      B: 'Uses a wrong mole ratio or molar mass.'
      C: 'Uses a wrong mole ratio or molar mass.'
  22:
    answer: C
    steps:
      - 'pH = −log[H⁺]. The more concentrated the acid, the more H⁺ ions per dm³ and the lower the pH.'
      - 'Volume does not matter: 5 cm³ and 1000 cm³ of the same solution have the same pH.'
      - 'Concentrations: M/10 = 0.10, M/5 = 0.20, M/8 = 0.125 mol dm⁻³.'
      - 'M/5 HCl is the most concentrated, so it has the lowest pH (about 0.7).'
      - 'The trap is D, the largest volume. More solution means more acid in total, but not a stronger solution.'
    hint: 'pH depends on concentration. Which fraction of M is biggest?'
    why:
      A: 'M/10 is weaker than M/5, so its pH is higher.'
      B: 'Same concentration as A; the volume does not change the pH.'
      D: 'M/8 = 0.125 mol dm⁻³ is weaker than M/5; the larger volume does not lower pH.'
  23:
    answer: C
    steps:
      - 'Silver halides decompose in light: $\ce{2AgX ->[light] 2Ag + X2}$, and the silver formed darkens.'
      - 'Silver bromide is the most sensitive, which is why it is the light-sensitive coating on photographic film and paper.'
      - 'Silver chloride is less sensitive (it turns violet slowly in sunlight), and silver iodide is the least.'
      - 'So the order is $\ce{AgBr}$ > $\ce{AgCl}$ > $\ce{AgI}$.'
      - 'Memory aid: B for bromide, B for "best for film". The trap is D, which just follows the group order Cl, Br, I.'
    hint: 'Which silver salt is used in photographic film?'
    why:
      A: 'Silver iodide is the least light-sensitive, not the most.'
      B: 'Puts AgI above AgBr, but AgBr is the most sensitive.'
      D: 'Follows the group order; silver bromide, not chloride, is the most sensitive.'
  24:
    answer: C
    steps:
      - 'A metal higher in the electrochemical series displaces a metal lower down from a solution of its salt.'
      - '$\ce{M + Zn^2+ -> M^n+ + Zn}$: M gives its electrons to the zinc ions.'
      - 'Losing electrons more readily means M is more electropositive than zinc.'
      - 'The trap is A. Electronegativity is about attracting electrons; M is doing the opposite, giving them away.'
    hint: 'In displacement, which metal loses electrons?'
    why:
      A: 'M gives away electrons, so it is more electropositive, not more electronegative.'
      B: 'True of zinc, but this experiment does not show it; no hydrogen is involved.'
      D: 'Electrons flow from M to the zinc ions, not from zinc to M.'
  25:
    answer: A
    steps:
      - 'Anhydrous cobalt(II) chloride is blue. It is used to test for water.'
      - 'Water joins it as water of crystallization, forming the pink hydrate $\ce{CoCl2.6H2O}$.'
      - 'So steam (or any water) turns it from blue to pink.'
      - 'Do not mix it up with anhydrous copper(II) sulphate, which goes from white to blue.'
    hint: 'What colour is cobalt chloride paper when dry?'
    why:
      B: 'Anhydrous cobalt(II) chloride is blue, not white.'
      C: 'No test for water gives green; the starting colour is blue.'
      D: 'This is the reverse kind of change, a hydrate losing water.'
  26:
    answer: C
    steps:
      - 'Le Chatelier''s principle: raising the pressure shifts an equilibrium to the side with fewer moles of gas.'
      - 'Count gas moles: A 2 → 3; B 2 → 3; C 3 → 2; D 2 → 2.'
      - 'Only C has fewer gas moles on the right: $\ce{2H2(g) + O2(g) <=> 2H2O(g)}$ goes from 3 to 2.'
      - 'So C shifts to the right.'
      - 'The trap is D. With 2 moles on each side, pressure has no effect on its position.'
    hint: 'Add up the gas moles on each side of each equation.'
    why:
      A: '2 mol of gas form 3, so higher pressure shifts it to the left.'
      B: '2 mol of gas form 3, so higher pressure shifts it to the left.'
      D: 'Equal gas moles on both sides, so pressure has no effect.'
  27:
    answer: B
    steps:
      - 'Hess''s law: $\Delta H$ of reaction = sum of $\Delta H_f$ of products − sum of $\Delta H_f$ of reactants. $\Delta H_f$ of an element such as $\ce{O2}$ is zero.'
      - 'Equation: $\ce{CO(g) + 1/2O2(g) -> CO2(g)}$.'
      - '$\Delta H$ = (−393.0) − (−110.4 + 0) = −393.0 + 110.4.'
      - '$\Delta H = -282.6\ \text{kJ}$ per mole of CO. Negative, so the burning of CO gives out heat, as expected.'
      - 'The trap is A: adding the two values instead of subtracting reactants from products.'
    hint: 'Products minus reactants. What is ΔH of formation of oxygen?'
    why:
      A: 'Adds the two enthalpies instead of taking products minus reactants.'
      C: 'Reactants minus products: the sign is reversed.'
      D: 'Adds the values and also flips the sign.'
  28:
    answer: A
    steps:
      - 'Kinetic theory: in a solid, the particles are held by strong forces of attraction.'
      - 'They can only vibrate about fixed positions, so the solid keeps a definite shape and volume.'
      - 'In liquids the forces are weaker, so particles slide past one another and the shape follows the container.'
      - 'The trap is B. A high melting point is a result of strong forces, not the cause of the shape.'
    hint: 'What stops the particles of a solid moving out of place?'
    why:
      B: 'High melting point is a consequence of strong forces, not what gives shape.'
      C: 'Boiling point relates to the liquid turning to gas.'
      D: 'Weak attraction lets particles move freely, as in gases.'
  29:
    answer: D
    steps:
      - 'A saturated solution holds as much solute as it can at that temperature, so extra solid will not dissolve.'
      - 'An unsaturated solution would dissolve the crystal.'
      - 'A supersaturated solution would crystallize: the added crystal acts as a seed and more solid comes out, so the solution would change.'
      - 'Here the crystal stays and nothing changes, so the solution is saturated.'
      - 'The trap is A. The crystal does not dissolve in a supersaturated solution either, but there extra crystals would form.'
    hint: 'What would a seed crystal do in a supersaturated solution?'
    why:
      A: 'A supersaturated solution would deposit more crystals on the seed.'
      B: 'Concentrated only means a lot of solute; it may still dissolve more.'
      C: 'An unsaturated solution would dissolve the crystal.'
  30:
    answer: C
    steps:
      - 'Hund''s rule: electrons fill each p orbital singly before pairing.'
      - 'There are three 2p orbitals. Five electrons go in as ↑↓, ↑↓, ↑.'
      - 'That leaves one unpaired electron.'
      - 'This is fluorine; one unpaired electron is why it forms one bond, as in $\ce{F2}$.'
      - 'The trap is B, 5, which counts all the 2p electrons, not just the unpaired ones.'
    hint: 'Draw three boxes and put in five arrows.'
    why:
      A: 'Two unpaired would be 2p⁴ (oxygen).'
      B: 'Counts every 2p electron, not the unpaired ones.'
      D: 'Three p orbitals can hold at most three unpaired electrons.'
  31:
    answer: A
    steps:
      - 'Pig iron contains about 4% carbon with sulphur and phosphorus.'
      - 'In steel-making (the basic oxygen process), pure oxygen is blown through the molten iron.'
      - 'It oxidizes the impurities: carbon to $\ce{CO2}$, sulphur to $\ce{SO2}$, and phosphorus to $\ce{P4O10}$, which joins the slag.'
      - 'The trap is D. Hydrogen is a reducing agent; removing these impurities needs oxidation.'
    hint: 'Carbon and sulphur are removed as gaseous oxides.'
    why:
      B: 'Chlorine is not used to refine iron.'
      C: 'Nitrogen is unreactive and would make steel brittle.'
      D: 'Hydrogen reduces; the impurities must be oxidized.'
  32:
    answer: D
    steps:
      - '$\ce{H2S}$ precipitates many metal ions as coloured sulphides, for example $\ce{Cu^2+ + H2S -> CuS(s) + 2H+}$ (black).'
      - 'This is why it is used in qualitative analysis to separate metal ions into groups.'
      - '$\ce{H2S}$ is a reducing agent, not an oxidizing agent: it loses hydrogen and is oxidized to sulphur.'
      - 'The trap is C. Sulphur(IV) oxide bleaches; hydrogen sulphide does not.'
    hint: 'What does H₂S do to copper(II) or lead(II) ions in solution?'
    why:
      A: 'H₂S is a reducing agent; it is oxidized to sulphur.'
      B: 'Dehydrating agents remove water, like concentrated $\ce{H2SO4}$; H₂S does not.'
      C: 'Bleaching is done by $\ce{SO2}$ or chlorine, not $\ce{H2S}$.'
  33:
    answer: A
    steps:
      - 'A rocket fuel burns without air, so it needs its own oxidizer.'
      - 'Concentrated (fuming) trioxonitrate(V) acid, $\ce{HNO3}$, is a strong oxidizing agent and is used as the oxidizer in liquid rocket propellants.'
      - 'It reacts very fast with the fuel, releasing large amounts of hot gas.'
      - 'The trap is C. $\ce{H2SO4}$ is a strong acid and a dehydrating agent, but it is not used in rockets.'
    hint: 'Which of these acids is the strongest oxidizing agent?'
    why:
      B: 'Ethanoic acid is a weak acid with no rocket use.'
      C: 'Tetraoxosulphate(VI) acid is not used as a rocket oxidizer.'
      D: 'Hydrochloric acid is not an oxidizing agent.'
  34:
    answer: B
    steps:
      - 'Dry chlorine does not bleach. It needs water.'
      - '$\ce{Cl2 + H2O -> HCl + HOCl}$. The chloric(I) acid gives up oxygen: $\ce{HOCl -> HCl + [O]}$.'
      - 'This oxygen oxidizes the dye to a colourless substance.'
      - 'Remember: dry litmus stays red in dry chlorine but bleaches in moist chlorine.'
    hint: 'Does dry chlorine bleach dry litmus paper?'
    why:
