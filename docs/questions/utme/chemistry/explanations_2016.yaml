format_version: 1
exam_year: 2016
subject: CHEM
explanations:
  1:
    answer: C
    steps:
      - 'Relative atomic mass is the weighted average of the isotope masses: (mass × share) added up, divided by the total share.'
      - 'The ratio 1 : 3 means 1 part of mass 20 and 3 parts of mass 22, so 4 parts in all.'
      - 'Total mass = (20 × 1) + (22 × 3) = 20 + 66 = 86.'
      - 'Relative atomic mass = 86 ÷ 4 = 21.5.'
      - 'Check: the answer sits closer to 22 than to 20, which makes sense because there is three times as much of the heavier isotope.'
      - 'The trap is B, 21.0. That is the simple average of 20 and 22, which ignores the 1 : 3 ratio.'
    hint: 'Weight each mass number by its share of the 4 parts.'
    why:
      A: 'Weights the lighter isotope more heavily, the wrong way round.'
      B: 'Takes a plain average and ignores the 1 : 3 ratio.'
      D: 'Uses only the heavier isotope.'
  2:
    answer: C
    steps:
      - 'Graham''s law: the rate of diffusion of a gas is inversely proportional to the square root of its molar mass, so rate₁ ÷ rate₂ = √(M₂ ÷ M₁).'
      - 'Molar masses: $\ce{O2}$ = 2 × 16 = 32 g mol⁻¹, $\ce{CH4}$ = 12 + 4 × 1 = 16 g mol⁻¹.'
      - 'Rate of oxygen = 200 cm³ ÷ 50 s = 4 cm³ s⁻¹.'
      - 'Rate of methane = 4 × √(32 ÷ 16) = 4 × √2 = 5.66 cm³ s⁻¹.'
      - 'Time for methane = 80 cm³ ÷ 5.66 cm³ s⁻¹ = 14.1 s, about 14 s.'
      - 'Check: methane is lighter, so it diffuses faster, and it only has 80 cm³ to move, so its time must be well under 50 s.'
      - 'The trap is B, 20 s. It scales the time by the volume (80 ÷ 200 × 50) and forgets that methane is faster than oxygen.'
    hint: 'First find the rate of oxygen in cm³ per second, then use √(32 ÷ 16).'
    why:
      A: 'Treats methane as slower than oxygen, doubling the time instead of shortening it.'
      B: 'Scales by volume only and forgets the difference in molar mass.'
      D: 'Divides by 2 instead of √2.'
  3:
    answer: B
    steps:
      - 'Valence (valency) is the combining power of an atom: the number of bonds it can form, or the number of electrons it gains, loses or shares.'
      - 'Carbon has a valency of 4, so it forms four bonds, as in $\ce{CH4}$.'
      - 'Oxidation number is a charge we assign for bookkeeping, and it can change from compound to compound or even be zero in a bonded element.'
      - 'Remember it as "valency = how many hands an atom has to hold other atoms".'
      - 'The trap is A, oxidation number. It is related, but it is a charge, not a count of bonds.'
    hint: 'Which word means "combining power"?'
    why:
      A: 'Oxidation number is an assigned charge, not the number of bonds.'
      C: 'Atomic number is the number of protons.'
      D: 'Electronegativity is how strongly an atom pulls shared electrons.'
  4:
    answer: A
    steps:
      - 'In a neutral atom, the number of electrons equals the atomic number.'
      - 'Count the electrons shell by shell: 2 on the inner shell, 8 on the middle shell and 2 on the outer shell.'
      - 'Total = 2 + 8 + 2 = 12, so the atomic number is 12.'
      - 'Element 12 is magnesium, with the configuration 2, 8, 2.'
      - 'The trap is D, neon. Neon is 2, 8; it has only two shells, and this atom has a third shell with two more electrons.'
    hint: 'Count every electron on all three shells.'
    why:
      B: 'Helium has only 2 electrons on one shell.'
      C: 'Chlorine is 2, 8, 7, with 7 electrons in the outer shell.'
      D: 'Neon is 2, 8 and has no third shell.'
  5:
    answer: B
    steps:
      - 'Carbon(II) oxide, $\ce{CO}$, comes from the incomplete burning of petrol and diesel in engines.'
      - 'It joins with haemoglobin about 200 times more strongly than oxygen does, forming carboxyhaemoglobin, so the blood can no longer carry oxygen.'
      - 'It has no colour and no smell, so people breathe it without noticing, and a small amount in a closed garage can kill.'
      - 'Remember: "CO is the silent killer".'
      - 'The trap is D, carbon(IV) oxide. $\ce{CO2}$ is a greenhouse gas, but it is not poisonous in the amounts found in exhaust fumes.'
    hint: 'Which gas stops your blood carrying oxygen?'
    why:
      A: 'Hydrogen sulphide is poisonous, but it is not a usual part of car exhaust and its bad-egg smell warns you.'
      C: 'Sulphur(IV) oxide causes acid rain and irritates the lungs, but in exhaust it is less deadly than carbon(II) oxide.'
      D: 'Carbon(IV) oxide is a greenhouse gas, not a poison at these levels.'
  6:
    answer: C
    steps:
      - 'Soft water contains few dissolved calcium or magnesium salts.'
      - 'Hard water lays down a thin coat of calcium carbonate inside pipes, which protects the metal.'
      - 'Soft water forms no such coat, and its dissolved oxygen and carbon dioxide slowly dissolve lead from lead pipes (plumbosolvency).'
      - 'Lead compounds are poisonous, which is why this is a harmful side effect.'
      - 'The trap is B. Precipitating calcium describes hard water forming scale, not soft water.'
    hint: 'Soft water has no protective scale. What can it then reach?'
    why:
      A: 'Soft water tastes flat, not offensive.'
      B: 'Soft water has little calcium to precipitate; scale forms from hard water.'
      D: 'Softness of water does not encourage bacteria.'
  7:
    answer: B
    steps:
      - 'Crude oil is a mixture of hydrocarbons, and some aerobic bacteria can use hydrocarbons as food.'
      - 'These bacteria break the oil down into carbon dioxide and water. Cleaning soil this way is called bioremediation.'
      - 'Fertiliser and air are supplied so the bacteria multiply quickly.'
      - 'Remember it as "let the microbes eat the oil".'
      - 'The trap is A. Acids do not dissolve oil, and they would make the soil too acidic for crops.'
    hint: 'Which option uses living things to digest the oil?'
    why:
      A: 'Acid does not remove hydrocarbons and harms the soil.'
      C: 'Oil does not mix with water, so water only spreads it.'
      D: 'Burning destroys the soil''s organic matter and pollutes the air.'
  8:
    answer: B
    steps:
      - 'Sodium hydrogentrioxocarbonate(IV), $\ce{NaHCO3}$, gives off carbon(IV) oxide with any acid that is stronger than carbonic acid.'
      - 'The carboxyl group, $\ce{-COOH}$, makes a compound an alkanoic acid, which is strong enough.'
      - 'For example, $\ce{CH3COOH + NaHCO3 -> CH3COONa + H2O + CO2}$, and the $\ce{CO2}$ is the bubbles you see.'
      - 'This is the standard test for an alkanoic acid.'
      - 'The trap is C, $\ce{-OH}$. Alkanols contain hydrogen too, but they are far too weakly acidic to react with $\ce{NaHCO3}$.'
    hint: 'Which group makes a compound an acid?'
    why:
      A: 'The amino group is basic, so it gives no gas.'
      C: 'Alkanols are too weakly acidic to release carbon(IV) oxide.'
      D: 'The carbonyl group of alkanals and alkanones is not acidic.'
  9:
    answer: B
    steps:
      - 'In a neutral compound the oxidation numbers add up to zero. K is +1 and O is −2.'
      - 'Let Cr be x. Then 2(+1) + 2x + 7(−2) = 0.'
      - '2 + 2x − 14 = 0, so 2x = 12 and x = +6.'
      - 'Check: dichromate(VI) is the name, and the (VI) agrees.'
      - 'The trap is A, +7. That is the value for manganese in $\ce{KMnO4}$, not chromium here.'
    hint: 'Put the sum 2(+1) + 2x + 7(−2) equal to zero.'
    why:
      A: '+7 belongs to Mn in KMnO4; here it would make the sum +2.'
      C: 'Forgets one of the potassium atoms or miscounts the oxygens.'
      D: 'Divides the oxygen charge wrongly between two chromium atoms.'
  10:
    answer: A
    steps:
      - 'Oxidation is an increase in oxidation number. Find the oxidation number of each element on both sides.'
      - 'In $\ce{Na2O2}$ (a peroxide), Na is +1, so each O is −1. In $\ce{H2O}$ and $\ce{NaOH}$, O is −2. In $\ce{O2}$, O is 0.'
      - 'Some peroxide oxygen goes from −1 up to 0 in $\ce{O2}$: that is oxidation. The rest goes from −1 down to −2 in $\ce{NaOH}$: that is reduction.'
      - 'Na stays +1, and H and the oxygen of water do not change, so the substance oxidized is $\ce{Na2O2}$. It is oxidized and reduced at once (disproportionation).'
      - 'The trap is D, $\ce{O2}$. It is the product of the oxidation, not the substance that was oxidized.'
    hint: 'What is the oxidation number of oxygen in a peroxide?'
    why:
      B: 'Sodium hydroxide is a product, and nothing in it is being oxidized.'
      C: 'Oxygen and hydrogen in water keep the same oxidation numbers.'
      D: 'Oxygen gas is formed by the oxidation; it is a product.'
  11:
    answer: A
    steps:
      - 'On an energy profile, the heat of reaction ($\Delta H$) is the energy of the products minus the energy of the reactants.'
      - 'Z is drawn from the level of A + B up to the level of C + D, so Z is exactly that difference.'
      - 'The products lie above the reactants, so this reaction is endothermic and $\Delta H$ is positive.'
      - 'The gap from the reactants to the peak X would be the activation energy; Y here is the activation energy of the reverse reaction.'
      - 'The trap is B. Activation energy always reaches up to the top of the hump, and Z stops at the product level.'
    hint: 'Z joins which two levels?'
    why:
      B: 'Activation energy is measured from a starting level up to the peak X.'
      C: 'Free energy cannot be read from this simple energy profile.'
      D: 'Entropy is a measure of disorder and is not shown on the diagram.'
  12:
    answer: D
    steps:
      - 'An atom has a small, dense nucleus with electrons moving around it.'
      - 'The nucleus holds the protons (positive) and the neutrons (no charge). Together they are called nucleons.'
      - 'Electrons are found in shells outside the nucleus.'
      - 'Ordinary hydrogen, $\ce{^{1}_{1}H}$, is the one nucleus with no neutron, but every other nucleus has both.'
      - 'The trap is C. Electrons are in the shells, not in the nucleus.'
    hint: 'Mass number counts the particles in the nucleus. Which two are they?'
    why:
      A: 'Leaves out neutrons, which almost every nucleus contains.'
      B: 'Leaves out protons, which give the nucleus its charge.'
      C: 'Electrons move around the nucleus, not inside it.'
  13:
    answer: A
    steps:
      - 'Zinc is above copper in the electrochemical series, so it displaces copper: $\ce{Zn(s) + Cu^2+(aq) -> Zn^2+(aq) + Cu(s)}$.'
      - 'Zinc loses electrons ($\ce{Zn -> Zn^2+ + 2e-}$) and dissolves, so electrons flow away from the zinc to the copper ions.'
      - 'The blue $\ce{Cu^2+}$ ions are used up, so the blue colour fades, and the reaction gives out heat, so the temperature changes.'
      - 'So the thing that does NOT happen is electrons flowing towards the zinc rod.'
      - 'The trap is B. Students forget that dissolving zinc is exactly how zinc gives away its electrons.'
    hint: 'Zinc is oxidized. Does it gain or lose electrons?'
    why:
      B: 'This does happen: zinc goes into solution as Zn²⁺ ions.'
      C: 'This does happen: the displacement is exothermic.'
      D: 'This does happen: blue Cu²⁺ ions are removed as copper metal.'
  14:
    answer: D
    steps:
      - 'Caustic soda solution, $\ce{NaOH(aq)}$, contains $\ce{Na+}$, $\ce{OH-}$ and $\ce{H+}$ ions. Platinum is inert.'
      - 'Cathode: $\ce{H+}$ is discharged before $\ce{Na+}$ because it is lower in the electrochemical series: $\ce{2H2O + 2e- -> H2 + 2OH-}$.'
      - 'Anode: $\ce{OH-}$ is discharged: $\ce{4OH- -> 2H2O + O2 + 4e-}$.'
      - 'Removing $\ce{H+}$ at the cathode leaves extra $\ce{OH-}$ there, so the solution around the cathode becomes more alkaline.'
      - 'The trap is C. Sodium is far too reactive to be deposited from a water solution; hydrogen is released instead.'
    hint: 'Which ion is discharged at the cathode, and what is left behind?'
    why:
      A: 'Oxygen is given off at the anode, not the cathode.'
      B: 'Hydrogen is given off at the cathode, not the anode.'
      C: 'Na⁺ stays in solution; H⁺ is discharged in its place.'
  15:
    answer: D
    steps:
      - 'Calcium carbide with water gives only one alkyne, ethyne: $\ce{CaC2 + 2H2O -> C2H2 + Ca(OH)2}$.'
      - 'The two carbons in the $\ce{C2^2-}$ ion can only make the two-carbon alkyne, so the statement "any alkyne" is incorrect.'
      - 'A is true: butane (gas) boils lowest, then petrol, then kerosene. B is true: ethene, $\ce{H2C=CH2}$, is the monomer of polythene.'
      - 'C is true: both but-1-ene (C=C) and but-1-yne (C≡C) are unsaturated and decolourise bromine.'
      - 'The trap is A. It looks like a tricky order, but small molecules always boil first.'
    hint: 'How many carbon atoms are in the carbide ion?'
    why:
      A: 'This is correct: boiling point rises with chain length, butane < petrol < kerosene.'
      B: 'This is correct: ethene polymerises to polythene.'
      C: 'This is correct: both compounds have multiple bonds that add bromine.'
  16:
    answer: B
    steps:
      - 'Bauxite is mainly $\ce{Al2O3}$ with $\ce{Fe2O3}$ as an impurity.'
      - 'Aluminium oxide is amphoteric, so it dissolves in hot sodium hydroxide: $\ce{Al2O3 + 2NaOH + 3H2O -> 2NaAl(OH)4}$.'
      - 'Iron(III) oxide is basic, so it does not dissolve and is filtered off as "red mud".'
      - 'Pure $\ce{Al2O3}$ is then recovered from the filtrate. This is the Bayer process.'
      - 'The trap is D. Electrolysis comes after purification; iron in the melt would contaminate the aluminium.'
    hint: 'Which of the two oxides is amphoteric?'
    why:
      A: 'Both oxides dissolve in acid, so acid does not separate them.'
      C: 'Neither oxide dissolves in ammonia.'
      D: 'Electrolysis is used on pure alumina, after the iron is removed.'
  17:
    answer: B
    steps:
      - 'Aluminium is high in the reactivity series, so carbon cannot reduce its oxide. It must be extracted by electrolysis.'
      - 'Pure aluminium oxide is dissolved in molten cryolite, $\ce{Na3AlF6}$, which lowers the melting point from about 2050 °C to about 950 °C.'
      - 'Cathode: $\ce{Al^3+ + 3e- -> Al}$. Anode: $\ce{2O^2- -> O2 + 4e-}$, and the oxygen burns the carbon anodes away.'
      - 'Remember: metals above zinc in the series are extracted by electrolysis.'
      - 'The trap is A. Heating with coke works for iron and zinc, not for aluminium.'
    hint: 'Can carbon reduce a very reactive metal''s oxide?'
    why:
      A: 'Carbon is not reactive enough to reduce aluminium oxide.'
      C: 'Cryolite is the solvent for electrolysis, not the ore treated with alkali.'
      D: 'Heating a silicate does not release aluminium metal.'
  18:
    answer: B
    steps:
      - 'On heating, $\ce{ZnCO3 -> ZnO + CO2}$. Zinc oxide is yellow when hot and white when cold, a well-known test for zinc.'
      - 'With aqueous sodium hydroxide, zinc ions give a white gelatinous precipitate: $\ce{Zn^2+ + 2OH- -> Zn(OH)2}$.'
      - 'Zinc hydroxide is amphoteric, so it dissolves in excess sodium hydroxide to form the zincate ion, $\ce{[Zn(OH)4]^2-}$.'
      - 'Both tests point to $\ce{ZnCO3}$.'
      - 'The trap is D. Lead(II) oxide is yellow too, but it stays yellow when cold, so it does not match "white when cold".'
    hint: 'Which metal oxide changes colour as it cools?'
    why:
      A: 'Ammonium carbonate sublimes and decomposes to gases, leaving no residue.'
      C: 'Aluminium sulphate gives a white residue that is never yellow.'
      D: 'Lead(II) oxide is yellow both hot and cold.'
  19:
    answer: A
    steps:
      - 'A metal is oxidized when it loses electrons. The higher it is in the electrochemical series, the more easily it does this.'
      - 'Order of the four, most reactive first: Na > Al > Zn > Cu.'
      - 'Copper is lowest, so it holds on to its electrons best and is the least easily oxidized.'
      - 'This is why copper is used for water pipes and coins: it does not corrode easily.'
      - 'The trap is C, zinc. Zinc is fairly unreactive among these, but it is still above copper and displaces copper from its salts.'
    hint: 'Which of these metals is lowest in the electrochemical series?'
    why:
      B: 'Sodium is the most easily oxidized of the four.'
      C: 'Zinc is above copper in the series, so it is oxidized more easily.'
      D: 'Aluminium is above zinc and copper; its oxide coat only hides how reactive it is.'
  20:
    answer: D
    steps:
      - 'A small cation with a high charge pulls on the anion''s electrons (it has a high polarising power), so the bond becomes more covalent.'
      - 'Compare the cations: $\ce{Al^3+}$ is small with a +3 charge; $\ce{Mg^2+}$ and $\ce{Ca^2+}$ are +2; $\ce{Li+}$ is +1.'
      - '$\ce{Al^3+}$ has the highest charge density, so $\ce{AlCl3}$ is the most covalent and the least ionic.'
      - 'Check: $\ce{AlCl3}$ sublimes at about 180 °C and fumes in moist air, which is covalent behaviour.'
      - 'The trap is C, LiCl. Lithium does polarise strongly for a group 1 ion, but its +1 charge is far below +3.'
    hint: 'Which cation is smallest with the biggest charge?'
    why:
      A: 'Mg²⁺ is +2 and polarises less than Al³⁺.'
      B: 'Ca²⁺ is large and +2, so CaCl2 is strongly ionic.'
      C: 'Li⁺ is only +1, so LiCl is more ionic than AlCl3.'
  21:
    answer: D
    steps:
      - 'Fractional distillation only separates substances that are already in the crude oil; it does not make new ones.'
      - 'Crude oil is a mixture of hydrocarbons, from methane and butane in the gas fraction to bitumen at the bottom.'
      - 'Petroleum ether is a low-boiling fraction of hydrocarbons, so it too comes from the distillation.'
      - 'Hydrogen is an element, not a hydrocarbon. It is made by cracking or reforming, not by distillation.'
      - 'The trap is A, ether. Here it means petroleum ether, a real petroleum fraction.'
    hint: 'Which option is not a hydrocarbon at all?'
    why:
      A: 'Petroleum ether is a light fraction of crude oil.'
      B: 'Methane is in the refinery gas fraction.'
      C: 'Butane is in the refinery gas fraction.'
  22:
    answer: B
    steps:
      - 'Knocking is the early, uneven explosion of the petrol and air mixture in an engine.'
      - 'Lead tetraethyl, $\ce{Pb(C2H5)4}$, was added to petrol to slow this down and raise the octane rating.'
      - 'It has been phased out in most countries because lead from exhausts is poisonous.'
      - 'The trap is D. n-heptane is the reference fuel with octane number 0, so it knocks badly.'
    hint: 'Which compound contains lead?'
    why:
      A: 'Tetramethylsilane is the reference compound in NMR, not a fuel additive.'
      C: 'Glycerol is an alkanetriol used in soaps and foods.'
      D: 'n-heptane knocks badly and defines octane number zero.'
  23:
    answer: C
    steps:
      - 'Equal numbers of moles contain equal numbers of particles (Avogadro''s constant, 6.02 × 10²³ per mole).'
      - 'Moles of Mg atoms = 24 g ÷ 24 g mol⁻¹ = 1 mol.'
      - 'Moles of $\ce{O2}$ in 32 g = 32 ÷ (2 × 16) = 1 mol. This matches.'
      - 'The others: 1 g of $\ce{H2}$ = 1 ÷ 2 = 0.5 mol; 16 g of $\ce{O2}$ = 0.5 mol; 35.5 g of $\ce{Cl2}$ = 35.5 ÷ 71 = 0.5 mol.'
      - 'The trap is A or D. They use the atomic mass of the element, forgetting that hydrogen and chlorine molecules have two atoms each.'
    hint: 'Use the molar mass of the molecule, not of one atom.'
    why:
      A: '1 g of H2 is only 0.5 mol because H2 has a molar mass of 2 g mol⁻¹.'
      B: '16 g of O2 is only 0.5 mol of molecules.'
      D: '35.5 g of Cl2 is only 0.5 mol because Cl2 is 71 g mol⁻¹.'
  24:
    answer: A
    steps:
      - 'Iron rusts because it is oxidized: $\ce{Fe -> Fe^2+ + 2e-}$. Oxidation happens at the anode.'
      - 'In cathodic protection, iron is connected to the negative terminal of a d.c. supply, with an inert anode, so the iron becomes the cathode.'
      - 'Electrons are pushed onto the iron, so it cannot lose electrons and does not rust.'
      - 'This is used for pipelines and ship hulls.'
      - 'The trap is D. Tin plating protects iron, but it is a coating, not an electrolytic set-up.'
    hint: 'At which electrode does oxidation happen? Keep the iron away from it.'
    why:
      B: 'The anode is where oxidation happens, so the iron would corrode faster.'
      C: 'A less electropositive metal makes the iron the anode and speeds up rusting.'
      D: 'Tin plating is a protective coating, not an electrolytic method.'
  25:
    answer: B
    steps:
      - 'Rust is hydrated iron(III) oxide, $\ce{Fe2O3.xH2O}$. Metal oxides are basic.'
      - 'An acid and a base react to form a salt and water: $\ce{Fe2O3 + 3H2SO4 -> Fe2(SO4)3 + 3H2O}$.'
      - 'The salt dissolves and washes away, leaving clean iron. This is called "pickling" the iron.'
      - 'The trap is C. Rust is already fully oxidized iron(III), so it cannot be oxidized further.'
    hint: 'Is iron(III) oxide acidic or basic?'
    why:
      A: 'The iron itself is not hydrolysed; the acid attacks the oxide.'
      C: 'Iron(III) in rust is already in its usual highest oxidation state.'
      D: 'Removing water from the rust would not remove the rust.'
  26:
    answer: C
    steps:
      - 'Natural rubber is soft and sticky, and it gets softer when hot.'
      - 'Vulcanization is heating rubber with sulphur. Sulphur atoms form cross-links between the polymer chains.'
      - 'The cross-links make the rubber harder, stronger and more elastic, good for tyres.'
      - 'Remember: Vulcan was the god of fire, and vulcanizing uses heat and sulphur, as in a volcano.'
      - 'The trap is D. The acid contains sulphur, but it would attack the rubber rather than cross-link it.'
    hint: 'Which element forms bridges between rubber chains?'
    why:
      A: 'Chlorine adds to the double bonds but does not vulcanize rubber.'
      B: 'Hydrogen peroxide is an oxidizing and bleaching agent.'
      D: 'The acid would char and attack rubber.'
  27:
    answer: C
    steps:
      - 'In the first transition series (scandium to zinc), electrons are added to the 3d sub-level.'
      - 'Partly filled d-orbitals give these metals their special properties: variable oxidation states, coloured ions, complex ions and catalytic activity.'
      - 'Group I and II metals fill only s-orbitals in their outer shell, so they lack these properties.'
      - 'Remember: transition metals are the d-block.'
      - 'The trap is A. Group I and II are the s-block, which is exactly what makes them different.'
    hint: 'Which block of the periodic table do transition metals belong to?'
    why:
      A: 'Partly filled s-orbitals belong to groups I and II.'
      B: 'p-orbitals are filled in groups III to VIII.'
      D: 'f-orbitals are filled in the lanthanides and actinides.'
  28:
    answer: B
    steps:
      - 'The number of protons fixes the element: 11 protons means sodium, a metal.'
      - 'A neutral atom has equal protons and electrons. Here there are 11 protons but only 10 electrons, so the charge is +1.'
      - 'The particle is $\ce{Na+}$, a metallic ion. (The 12 neutrons give a mass number of 23.)'
      - 'Metals form positive ions by losing electrons, which agrees.'
      - 'The trap is D. Sodium is a metal, but 11 protons with 10 electrons cannot be neutral.'
    hint: 'Compare the number of protons with the number of electrons.'
    why:
      A: 'Element 11 is a metal, and the particle is charged.'
      C: 'Sodium is a metal, not a non-metal.'
      D: 'One electron is missing, so the particle is not neutral.'
  29:
    answer: C
    steps:
      - 'A catalyst speeds up a reaction without being used up.'
      - 'It provides another route from reactants to products with a lower activation energy.'
      - 'At the same temperature, more particles now have enough energy to react, so the rate rises.'
      - 'A catalyst does not change the temperature, the concentration or $\Delta H$.'
      - 'The trap is B. Heating also speeds up a reaction, but that is a different factor, not what a catalyst does.'
    hint: 'A catalyst makes the energy hill easier to climb.'
    why:
      A: 'A higher activation energy would slow the reaction down.'
      B: 'A catalyst does not change the temperature.'
      D: 'A catalyst does not change the concentration.'
  30:
    answer: B
    steps:
      - 'A metal displaces another metal from a solution of its salt only if it is higher in the electrochemical series (more electropositive).'
      - 'Here $\ce{M + Zn^2+ -> M^{n+} + Zn}$: M gives its electrons to the zinc ions.'
      - 'So M loses electrons more readily than zinc, which means M is more electropositive.'
      - 'The trap is D, which states the opposite, and A, which reverses the direction of electron flow.'
    hint: 'The metal that does the pushing out is the more reactive one.'
    why:
      A: 'Electrons flow from M to the zinc ions, not from zinc to M.'
      C: 'Displacing a metal shows M is more electropositive, not more electronegative.'
      D: 'This is the reverse; zinc could not then be displaced.'
  31:
    answer: B
    steps:
      - 'Faraday''s laws: to deposit 1 mole of a metal with charge n+, you need n faradays, and 1 F = 96 500 C.'
      - 'Equation at the cathode: $\ce{Cu^2+ + 2e- -> Cu}$, so 1 mole of Cu (64 g) needs 2 × 96 500 = 193 000 C.'
      - 'Moles of copper = 10 g ÷ 64 g mol⁻¹ = 0.15625 mol.'
      - 'Charge = 0.15625 mol × 193 000 C mol⁻¹ = 30 156.25 C, about 30 156.3 C.'
      - 'The trap is D, about 15 000 C. That uses only one faraday per mole, as if copper ions were Cu⁺.'
    hint: 'How many electrons does one Cu²⁺ ion need?'
    why:
      A: 'Does not come from 10 g of copper with 2 F per mole.'
      C: 'Uses four faradays per mole, double the right charge.'
      D: 'Uses one faraday per mole instead of two.'
  32:
    answer: B
    steps:
      - 'IUPAC names count the carbons (eth- = 2) and add an ending for the functional group.'
      - '$\ce{CH3COOH}$ has two carbons and a carboxyl group, so it is ethanoic acid.'
      - '$\ce{CH2=CH2}$ has two carbons and a C=C double bond, so it is ethene.'
      - 'The trap is A or C. Acetic acid and ethylene are the old common names, not IUPAC names.'
    hint: 'Count the carbons, then match the ending: -oic acid, -ene.'
    why:
      A: 'Acetic acid is a common name, and ethane has no double bond.'
      C: 'Methanoic acid has one carbon, and ethylene is a common name.'
      D: 'Ethanol is CH3CH2OH, an alkanol, not an acid.'
  33:
    answer: B
    steps:
      - 'To boil a liquid, you must overcome the forces between its molecules. Stronger forces mean a higher boiling point.'
