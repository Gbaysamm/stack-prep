exam_year: 2017
subject: CHEM
explanations:
  1:
    answer: D
    steps:
      - 'To cut metal, a flame must be hot enough to melt steel, about 3000 °C.'
      - 'Ethyne (acetylene) burnt in pure oxygen gives the oxy-acetylene flame: $\ce{2C2H2 + 5O2 -> 4CO2 + 2H2O}$, with a very large heat output.'
      - 'Burning in pure oxygen instead of air means no nitrogen soaks up heat, so the flame reaches about 3000 °C.'
      - 'So welders use the oxy-acetylene flame.'
      - 'The trap is B. Acetylene burnt in air alone gives a smoky, much cooler flame. The pure oxygen is what makes it hot enough.'
    hint: 'What gas is mixed with acetylene in a welder''s torch?'
    why:
      A: 'Butane (camping gas) burns in air at a far lower temperature; it cannot cut steel.'
      B: 'Acetylene burnt in air is sooty and too cool; it needs pure oxygen.'
      C: 'A kerosene flame is a cooler, smoky flame used for lamps and stoves.'
  2:
    answer: A
    steps:
      - 'Read a solubility curve by going up from the temperature to each curve, then across to the solubility axis.'
      - 'Go up from 300 K, just to the left of the 303 K line.'
      - 'Curve Y is at about 38 g per 100 g of water. Curve X is at about 19 g per 100 g of water.'
      - '38 ÷ 19 = 2, so at 300 K, Y is twice as soluble as X.'
      - 'The trap is C. The two curves do cross, but at about 333 K, not at room temperature. At 300 K, Y is still well above X.'
    hint: 'Read both curves at 300 K and divide the larger value by the smaller.'
    why:
      B: 'Swaps the curves; at 300 K, X is the lower one.'
      C: 'X and Y are equal only where the curves cross, near 333 K.'
      D: 'X is the less soluble salt at 300 K, so it cannot be three times Y.'
  3:
    answer: B
    steps:
      - 'Hess''s law: $\Delta H$ of reaction = sum of $\Delta H_f$ of products − sum of $\Delta H_f$ of reactants.'
      - 'Equation: $\ce{SO3(g) + H2O(l) -> H2SO4(l)}$.'
      - 'Products: −811 kJ. Reactants: (−395) + (−286) = −681 kJ.'
      - '$\Delta H$ = −811 − (−681) = −811 + 681 = −130 kJ.'
      - 'The answer is −130 kJ. It is negative, which fits: dissolving $\ce{SO3}$ in water gives out a lot of heat.'
      - 'The trap is C, +130 kJ, from doing reactants minus products. Always do products minus reactants.'
    hint: 'Products minus reactants. Watch the signs.'
    why:
      A: 'Adds the reactant values to the product value instead of subtracting them.'
      C: 'Does reactants minus products, so the sign comes out wrong.'
      D: 'Adds everything and flips the sign.'
  4:
    answer: C
    steps:
      - 'Law of constant composition: a pure compound always contains the same elements combined in the same fixed ratio by mass.'
      - 'In Y: mass of chlorine per gram of X = 0.36 ÷ 0.20 = 1.80 g.'
      - 'In Z: mass of chlorine per gram of X = 0.71 ÷ 0.40 = 1.78 g.'
      - 'The two ratios are the same within experimental error, so Y and Z are the same compound. This shows constant composition.'
      - 'The trap is A. Multiple proportion needs two different compounds, with the masses of chlorine per gram of X in a simple ratio like 1:2. Here the ratio is 1:1.'
    hint: 'Work out grams of chlorine per gram of X in each experiment. Same or different?'
    why:
      A: 'Multiple proportion needs two different ratios in a simple whole-number ratio; here the ratios are the same.'
      B: 'Conservation of mass compares total mass before and after one reaction; no such data is given.'
      D: 'Reciprocal proportion compares two elements each combining with a third element; only two elements appear here.'
  5:
    answer: B
    steps:
      - 'In a nuclear equation, the mass numbers (top) and the atomic numbers (bottom) must add up to the same total on both sides.'
      - 'A neutron is $\ce{^{1}_{0}n}$: mass number 1, atomic number 0.'
      - 'Top: y + 1. Bottom: z + 0 = z.'
      - 'So the product is $\ce{^{y+1}_{z}X}$: $\ce{^{y}_{z}X + ^{1}_{0}n -> ^{y+1}_{z}X}$. The atomic number is unchanged, so it is still element X, a heavier isotope.'
      - 'The trap is C or D, which change the atomic number. A neutron has no charge, so capturing one cannot change z.'
    hint: 'A neutron adds 1 to the mass number. What does it add to the atomic number?'
    why:
      A: 'The mass number goes up on capture, not down, and z cannot change.'
      C: 'Raises the atomic number, but a neutron carries no charge.'
      D: 'Lowers the atomic number, but a neutron carries no charge.'
  6:
    answer: B
    steps:
      - 'Vapour density = mass of a given volume of the gas ÷ mass of the same volume of hydrogen, at the same temperature and pressure.'
      - 'Hydrogen is the lightest gas, so it is the standard.'
      - 'Because $\ce{H2}$ has a relative molecular mass of 2, relative molecular mass = 2 × vapour density.'
      - 'So the gas is compared with an equal volume of hydrogen.'
      - 'The trap is C. Oxygen is a common reference elsewhere, but vapour density always uses hydrogen.'
    hint: 'Which gas is the lightest, and so used as the standard?'
    why:
      A: 'Water vapour is not the reference gas.'
      C: 'Oxygen is not the reference gas for vapour density.'
      D: 'Subtracting a pressure from a mass makes no sense; this is the idea behind correcting for water vapour, not vapour density.'
  7:
    answer: B
    steps:
      - 'Boyle''s law: at constant temperature, $P_1V_1 = P_2V_2$.'
      - '$P_1$ = 10 atm, $V_1$ = 30 dm³, $V_2$ = 20 dm³.'
      - '$P_2 = \dfrac{P_1V_1}{V_2} = \dfrac{10 \times 30}{20}$ = 15.0 atm.'
      - 'The gas is squeezed into a smaller space, so the pressure must go up. 15 atm is more than 10 atm, which makes sense.'
      - 'The trap is A, 6.7 atm, from 10 × 20 ÷ 30. That puts the volumes the wrong way up and gives a pressure drop for a smaller container.'
    hint: 'Smaller volume, so higher or lower pressure?'
    why:
      A: 'Puts the volumes the wrong way up, so the pressure falls instead of rising.'
      C: 'Too large; 10 × 30 ÷ 20 is 15, not 60.'
      D: 'An arithmetic slip; 10 × 30 ÷ 20 is 15.'
  8:
    answer: C
    steps:
      - 'A liquid boils when its saturated vapour pressure equals the external (atmospheric) pressure.'
      - 'At that point bubbles of vapour can form inside the liquid and push out against the air above.'
      - 'This is why water boils below 100 °C on a high mountain, where the air pressure is lower.'
      - 'The trap is B. Molecules escape the surface at any temperature; that is evaporation, not boiling.'
    hint: 'Bubbles form inside the liquid when its vapour can push back against what?'
    why:
      A: 'Vapour pressure equal to that of the solid describes the melting point.'
      B: 'Molecules escaping the surface is evaporation, which happens at all temperatures.'
      D: 'Expansion of the liquid does not make it boil.'
  9:
    answer: C
    steps:
      - 'Write the electron configuration of each and find its group. Metals have 1, 2 or 3 outer electrons and lose them.'
      - 'W (2) is helium, 2: a noble gas. X (6) is carbon, 2,4: a non-metal.'
      - 'Y (16) is sulphur, 2,8,6: a non-metal. Z (20) is calcium, 2,8,8,2: Group 2, a metal.'
      - 'So Z is the metal.'
      - 'The trap is B. Helium has 2 outer electrons, like Group 2, but its shell is full, so it is a noble gas.'
    hint: 'Write 2,8,8,... for each atomic number. Which has only 2 electrons in an outer shell that is not full?'
    why:
      A: 'Carbon (2,4) is a non-metal.'
      B: 'Helium has a full first shell; it is a noble gas.'
      D: 'Sulphur (2,8,6) is a non-metal.'
  10:
    answer: A
    steps:
      - 'Cathode rays are streams of electrons, which carry negative charge.'
      - 'J. J. Thomson showed this: they bend towards the positive plate in an electric field.'
      - 'When the rays fall on the electrometer, the electrons collect on it, so it becomes negatively charged.'
      - 'The trap is B. The rays come from the cathode, but the cathode is the source, not the charge they carry.'
    hint: 'What particles make up cathode rays?'
    why:
      B: 'Electrons carry negative charge, so they cannot make it positive.'
      C: 'Collecting charged particles leaves the instrument charged, not neutral.'
      D: 'One kind of charge is collected, not both.'
  11:
    answer: C
    steps:
      - 'Cracking is the breaking of large hydrocarbon molecules into smaller ones by heat, often with a catalyst.'
      - 'Example: $\ce{C10H22 -> C8H18 + C2H4}$, giving petrol and an alkene.'
      - 'Refineries use it to turn heavy fractions into more useful petrol and gas.'
      - 'The trap is B. Polymerization is the opposite: small molecules joining into large ones.'
    hint: 'Big molecules are "broken" into small ones. What is that called in a refinery?'
    why:
      A: 'Disintegration is a general word, used for radioactive decay, not for petroleum.'
      B: 'Polymerization joins small molecules into large ones, the reverse.'
      D: 'Degradation is a loose term for breakdown, not the name of this process.'
  12:
    answer: C
    steps:
      - 'A dehydrating agent removes the elements of water (hydrogen and oxygen in a 2:1 ratio) from a compound.'
      - 'Sugar is $\ce{C12H22O11}$. Concentrated acid takes out $\ce{H2O}$: $\ce{C12H22O11 -> 12C + 11H2O}$.'
      - 'What is left is black carbon, so the acid is acting as a dehydrating agent.'
      - 'The trap is A. A drying agent only removes water that is already present as moisture; here the water is made from H and O inside the sugar.'
    hint: 'Sugar is a carbohydrate, carbon plus water. What has the acid taken away?'
    why:
      A: 'A drying agent removes free moisture; here water is pulled out of the sugar molecule itself.'
      B: 'Concentrated sulphuric acid can oxidize, but turning sugar to carbon is the removal of water.'
      D: 'Concentrated sulphuric acid is not a reducing agent.'
  13:
    answer: B
    steps:
      - 'A colloid is named by what is spread (the dispersed phase) and what it is spread in (the dispersion medium).'
      - 'Smoke is tiny solid particles (soot, ash) dispersed in a gas (air).'
      - 'Fog and mist are liquid in gas; together these are called aerosols.'
      - 'So smoke is solid particles dispersed in gas.'
      - 'The trap is A. Solid in liquid is a sol, such as paint, not smoke.'
    hint: 'Smoke floats in the air. What is the medium?'
    why:
      A: 'Solid in liquid is a sol, like paint.'
      C: 'Gas in liquid is a foam; liquid in liquid is an emulsion.'
      D: 'Liquid in liquid is an emulsion, like milk.'
  14:
    answer: C
    steps:
      - 'In dilute $\ce{H2SO4}$, the ions present are $\ce{H+}$, $\ce{SO4^2-}$ and $\ce{OH-}$ from water.'
      - 'Cathode: $\ce{H+}$ is discharged: $\ce{2H+ + 2e- -> H2}$.'
      - 'Anode: $\ce{OH-}$ is discharged in preference to $\ce{SO4^2-}$: $\ce{4OH- -> 2H2O + O2 + 4e-}$.'
      - 'So oxygen forms at the anode and hydrogen at the cathode, in the volume ratio 1:2. This is really the electrolysis of water.'
      - 'The trap is B, which swaps the electrodes. Positive ions go to the cathode, so hydrogen is made there.'
    hint: 'Which ion is lower in the series than sulphate and goes to the anode?'
    why:
      A: 'Sulphate ions are not discharged at the anode; hydroxide ions are.'
      B: 'Swaps the electrodes; $\ce{H+}$ goes to the cathode.'
      D: 'Sulphate is not discharged, and hydrogen forms at the cathode.'
  15:
    answer: C
    steps:
      - 'Le Chatelier''s principle: if a change is made to a system at equilibrium, the position of equilibrium shifts to oppose the change.'
      - 'Equation: $\ce{P(g) + Q(g) <=> 3R(s) + S(g)}$, forward reaction exothermic. Gas moles: 2 on the left, 1 on the right.'
      - 'Removing S: the system makes more S to replace it, so equilibrium shifts right and more R forms.'
      - 'A larger vessel lowers the pressure, which favours the side with more gas moles, the left. Raising the temperature favours the endothermic, backward reaction.'
      - 'The trap is D. A catalyst makes equilibrium come faster but does not change the yield.'
    hint: 'Which change pulls the equilibrium to the right? Think about taking a product away.'
    why:
      A: 'Lower pressure favours the left, which has 2 moles of gas against 1.'
      B: 'The forward reaction is exothermic, so heating shifts equilibrium to the left.'
      D: 'A catalyst speeds both directions equally and leaves the yield unchanged.'
  16:
    answer: B
    steps:
      - 'Faraday''s first law: quantity of charge Q = It, and 96 500 C deposits one mole of a singly charged ion.'
      - 'Equation at the cathode: $\ce{Ag+ + e- -> Ag}$, so 1 mol of electrons (96 500 C) gives 108 g of silver.'
      - 'Q = 10 A × 4830 s = 48 300 C.'
      - 'Mass = (48 300 ÷ 96 500) × 108 g = 0.5 × 108 = 54.0 g.'
      - 'The trap is A, 108 g, which assumes a full faraday passed. Only half a faraday went through.'
    hint: 'Find Q = It, then compare it with 96 500 C.'
    why:
      A: 'Assumes a full 96 500 C passed; only 48 300 C did.'
      C: 'Treats silver as if it were $\ce{Ag^2+}$, needing two faradays per mole.'
      D: 'Divides by four; silver needs only one electron per atom.'
  17:
    answer: B
    steps:
      - 'Hess''s law: $\Delta H$ = sum of $\Delta H_f$ of products − sum of $\Delta H_f$ of reactants. Elements such as $\ce{H2}$ have $\Delta H_f$ = 0.'
      - 'Equation: $\ce{CO(g) + H2O(g) -> CO2(g) + H2(g)}$.'
      - 'Products: −394 + 0 = −394 kJ mol⁻¹. Reactants: −110 + (−242) = −352 kJ mol⁻¹.'
      - '$\Delta H$ = −394 − (−352) = −42 kJ mol⁻¹.'
      - 'The trap is C, +42, from doing reactants minus products.'
    hint: 'Hydrogen is an element. What is its enthalpy of formation?'
    why:
      A: 'Leaves out the water term, giving about −284, which is nearer the heat of combustion of CO.'
      C: 'Does reactants minus products, so the sign is wrong.'
      D: 'Adds values with the wrong signs.'
  18:
    answer: C
    steps:
      - 'Hund''s rule: electrons fill each orbital of a subshell singly before any pair up.'
      - 'The 2p subshell has three orbitals. Five electrons go in as ↑↓, ↑↓, ↑.'
      - 'So only one electron is unpaired. (This is fluorine.)'
      - 'The trap is B, 5. That counts all the 2p electrons, but four of them are paired.'
    hint: 'Draw three boxes for 2p and put in five arrows.'
    why:
      A: 'Two unpaired would be 2p⁴ or 2p², not 2p⁵.'
      B: 'Counts every 2p electron, but four of them are in pairs.'
      D: 'Three orbitals cannot hold four unpaired electrons.'
  19:
    answer: C
    steps:
      - 'The fountain experiment works only with a gas that is very soluble in water.'
      - 'When a little water enters the flask, the gas dissolves at once, the pressure inside falls, and the outside air pushes water up as a fountain.'
      - 'Ammonia and hydrogen chloride are both extremely soluble: about 700 and 450 volumes in one volume of water.'
      - 'Nitrogen and nitrogen(I) oxide are only slightly soluble, so they give no fountain.'
      - 'So the answer is (ii) and (iv). The trap is D: ammonia is the classic example, but hydrogen chloride works just as well.'
    hint: 'Which of these gases dissolve hugely in water?'
    why:
      A: 'Nitrogen(I) oxide is only slightly soluble.'
      B: 'Neither nitrogen nor nitrogen(I) oxide is soluble enough.'
      D: 'Leaves out hydrogen chloride, which is also very soluble.'
  20:
    answer: D
    steps:
      - 'Transition metal ions have partly filled 3d orbitals.'
      - 'Electrons jump between d orbitals of slightly different energy by absorbing visible light. The colour we see is the light left over.'
      - 'Ions with an empty or full d subshell, like $\ce{Zn^2+}$ (3d¹⁰), are colourless.'
      - 'The trap is A. f orbitals belong to the lanthanides and actinides, not the first transition series.'
    hint: 'Transition metals are the d-block.'
    why:
      A: 'f orbitals are filled in the lanthanides and actinides.'
      B: 'The s orbital is lost first when the ion forms, and it does not cause colour.'
      C: 'The p orbitals of these ions are full.'
  21:
    answer: C
    steps:
      - 'Fractional distillation separates miscible liquids with close boiling points: ethanol boils at 78 °C, water at 100 °C.'
      - 'Palm wine is only about 5% ethanol. Fractional distillation can raise this only to about 95.6%, because at that point ethanol and water boil off together as a constant boiling mixture.'
      - 'To pass 95%, a dehydrant such as quicklime (CaO) is added to take up the last water, then the ethanol is distilled again.'
      - 'So fractional distillation with a dehydrant gives the purest ethanol.'
      - 'The trap is B. Simple distillation cannot separate liquids whose boiling points are this close, so a dehydrant alone has too much water to remove.'
    hint: 'Which method separates close-boiling liquids, and what removes the final bit of water?'
    why:
      A: 'Stops at about 95.6%, because ethanol and water then distil together.'
      B: 'Simple distillation only works when boiling points are far apart.'
      D: 'Chromatography separates tiny amounts, such as dyes, not bulk liquids.'
  22:
    answer: C
    steps:
      - 'Acid hydrolysis of an ester: ester + water ⇌ alkanoic acid + alkanol.'
      - '$\ce{CH3COOCH2CH2CH3 + H2O <=>[H+] CH3COOH + CH3CH2CH2OH}$.'
      - 'The ester is propyl ethanoate. Water breaks the C−O bond next to the C=O, giving ethanoic acid and propan-1-ol.'
      - 'The HCl is only the catalyst; it does not end up in the products.'
      - 'The trap is A or B, which put chlorine into a product. Hydrolysis means splitting with water, not with HCl.'
    hint: 'An ester was made from an acid and an alcohol. Hydrolysis takes it back.'
    why:
      A: 'Puts Cl into the alkyl part; HCl is only the catalyst.'
      B: 'An acid chloride is not formed; water gives the acid.'
      D: 'The alkyl part comes off as an alkanol, not an alkane, and ethane has only two carbons.'
  23:
    answer: C
    steps:
      - 'Find the change in oxidation number of copper, then multiply moles of electrons by the Avogadro constant.'
      - 'In $\ce{CuO}$, copper is +2. In $\ce{Cu}$, it is 0. So $\ce{Cu^2+ + 2e- -> Cu}$.'
      - 'Each mole of copper needs 2 moles of electrons.'
      - 'Number of electrons = 2 × 6.0 × 10²³ = 1.2 × 10²⁴.'
      - 'The trap is D, 6.0 × 10²⁴, which multiplies by 10 instead of 2. Check: 3 Cu take 6 electrons, and 2 N in $\ce{NH3}$ give 6 (−3 to 0 each), which balances.'
    hint: 'Copper goes from +2 to 0. How many electrons is that per atom?'
    why:
      A: 'A negative power of ten is far too small; a mole of anything is a huge number of particles.'
      B: 'Also far too small; multiply by the Avogadro constant, do not divide.'
      D: 'Uses 10 electrons per copper instead of 2.'
  24:
    answer: C
    steps:
      - 'Hund''s rule: electrons fill each orbital of a subshell singly before pairing.'
      - 'Only the 3p subshell is partly filled. It has three orbitals and three electrons: ↑, ↑, ↑.'
      - 'So there are 3 unpaired electrons. (This is phosphorus.)'
      - 'The trap is A, 5. That counts all outer (3s and 3p) electrons, but the 3s pair is paired.'
    hint: 'Look only at the last subshell. Three boxes, three arrows.'
    why:
      A: 'Counts the paired 3s electrons too.'
      B: 'Only three p orbitals exist in the subshell; four is not possible here.'
      D: 'Three p electrons spread out singly; none pair up.'
  25:
    answer: A
    steps:
      - 'The mole ratio of X to Cu in the equation must match the mole ratio found from the masses.'
      - 'Moles of X = 8.0 g ÷ 24 g mol⁻¹ = 0.333 mol.'
      - 'Moles of Cu = 21.3 g ÷ 64 g mol⁻¹ = 0.333 mol.'
      - 'Ratio X : Cu = 1 : 1, so the equation is $\ce{X(s) + CuSO4(aq) -> Cu(s) + XSO4(aq)}$. X is magnesium, which forms $\ce{X^2+}$ like copper.'
      - 'The trap is D, which fits aluminium. That would need a 2:3 ratio, but the numbers give 1:1.'
    hint: 'Work out the moles of X and the moles of Cu. Compare them.'
    why:
      B: 'Needs a 1:2 ratio of X to Cu; the data give 1:1.'
      C: 'Needs a 2:1 ratio of X to Cu; the data give 1:1.'
      D: 'Needs a 2:3 ratio of X to Cu; the data give 1:1.'
  26:
    answer: D
    steps:
      - 'In the blast furnace, limestone is added to remove the earthy impurity, mainly silica, as slag.'
      - 'The heat first decomposes limestone: $\ce{CaCO3 -> CaO + CO2}$.'
      - 'The basic oxide then reacts with acidic silica: $\ce{CaO + SiO2 -> CaSiO3}$ (slag), which floats on the molten iron.'
      - 'The main reducing agent is carbon monoxide made from the coke: $\ce{Fe2O3 + 3CO -> 2Fe + 3CO2}$.'
      - 'The trap is A. Coke burns to carbon monoxide first, and it is mainly the CO that reduces the ore.'
    hint: 'What happens to limestone in great heat before it meets the sand?'
    why:
      A: 'Coke mostly acts through carbon monoxide, which does the reducing.'
      B: 'The limestone first decomposes to calcium oxide, which is what forms the silicate.'
      C: 'Carbon dissolves in the iron to make brittle pig iron; steel is made by removing carbon.'
  27:
    answer: B
    steps:
      - 'Count the electrons shell by shell. Y has 2, 8, 4: silicon, 4 outer electrons. Z has 2, 8, 7: chlorine, 7 outer electrons.'
      - 'An atom with 4 outer electrons cannot easily lose or gain four, so it shares them.'
      - 'Each Z needs one more electron. One Y shares an electron pair with each of four Z atoms: $\ce{YZ4}$, like $\ce{SiCl4}$.'
      - 'Bonds formed by sharing electron pairs are covalent.'
      - 'The trap is A. Ionic bonds need a metal with 1 to 3 outer electrons to give them away; Y has 4.'
    hint: 'Count the outer electrons of Y. Will it give away four electrons, or share them?'
    why:
      A: 'Y has 4 outer electrons and does not form ions easily.'
      C: 'In a dative bond one atom gives both shared electrons; here each atom gives one.'
      D: 'A metallic bond is between metal atoms; Z is a non-metal.'
  28:
    answer: A
    steps:
      - 'Charles''s law: at constant pressure, $\dfrac{V_1}{T_1} = \dfrac{V_2}{T_2}$, so $\dfrac{T_2}{T_1} = \dfrac{V_2}{V_1}$.'
      - '$\dfrac{T_2}{T_1} = \dfrac{9.75}{3.25}$ = 3.'
      - 'So the ratio of final to initial absolute temperature is 3:1.'
      - 'This fits: the volume trebled, so the kelvin temperature trebled too.'
      - 'The trap is any ratio from °C. Charles''s law works only with kelvin, the absolute temperature.'
    hint: 'Volume and absolute temperature are directly proportional.'
    why:
      B: '9.75 ÷ 3.25 is 3, not 2.5.'
      C: 'Does not come from the volumes given.'
      D: 'Does not come from the volumes given.'
  29:
    answer: A
    steps:
      - 'In water treatment, alum, aluminium tetraoxosulphate(VI), is added to make fine suspended particles clump together.'
      - 'The $\ce{Al^3+}$ ion hydrolyses to form a jelly-like aluminium hydroxide that traps mud and germs.'
      - 'The clumps (flocs) settle and are removed before filtration and chlorination.'
      - 'The trap is B. Copper(II) sulphate kills algae but is poisonous to people, so it is not a coagulant.'
    hint: 'Which salt is called "alum"?'
    why:
      B: 'Copper(II) sulphate is toxic and not used for coagulation.'
      C: 'Sodium sulphate does not form a sticky precipitate.'
      D: 'Calcium sulphate causes permanent hardness and does not coagulate.'
  30:
    answer: C
    steps:
      - 'Like dissolves like: non-polar substances dissolve in non-polar solvents.'
      - 'Fats and oils are non-polar, so they dissolve in non-polar solvents such as kerosene, petrol and turpentine.'
      - 'This is why kerosene removes grease stains from clothes.'
      - 'The trap is B. An alkali can react with fat to make soap, but calcium hydroxide is a barely soluble solid, not a liquid that dissolves fat.'
    hint: 'Fat is non-polar. Which liquid here is also non-polar?'
    why:
      A: 'Hydrochloric acid is a polar, watery solution and does not dissolve fat.'
      B: 'Calcium hydroxide is a sparingly soluble solid, not a fat solvent.'
      D: 'Water is polar; fat floats on it without dissolving.'
  31:
    answer: D
    steps:
      - 'Each absorbent removes particular gases.'
      - 'Alkaline pyrogallol absorbs oxygen. Its alkali also absorbs carbon dioxide.'
      - 'Quicklime, $\ce{CaO}$, absorbs water vapour and any remaining carbon dioxide: $\ce{CaO + H2O -> Ca(OH)2}$ and $\ce{CaO + CO2 -> CaCO3}$.'
      - 'Nitrogen and the rare gases are unreactive, so they pass through.'
      - 'The trap is B. The rare gases are left, but so is nitrogen, which nothing here removes.'
    hint: 'Tick off each gas as it is absorbed. What does nothing remove?'
    why:
      A: 'Carbon dioxide is removed by the alkali and the quicklime.'
      B: 'Leaves out nitrogen, which is not absorbed.'
      C: 'Oxygen is absorbed by alkaline pyrogallol.'
  32:
    answer: B
    steps:
      - 'A mole is the amount of substance containing as many particles as there are atoms in 12 g of carbon-12.'
      - 'That number is the Avogadro number, 6.02 × 10²³.'
      - 'So one mole of atoms holds 6.02 × 10²³ atoms.'
      - 'The trap is A. The atomic number counts protons in one atom, not atoms in a mole.'
    hint: 'What is the special number tied to the mole?'
    why:
      A: 'The atomic number is the number of protons in one atom.'
      C: 'The gas constant R links P, V, n and T; it is not a count.'
      D: 'The number of electrons depends on the element; it is not a fixed count per mole.'
  33:
    answer: B
    steps:
      - 'Valence (valency) is the combining power of an atom: the number of bonds it can form.'
      - 'For example, carbon has valency 4 and forms four bonds in $\ce{CH4}$; oxygen has valency 2.'
      - 'So the term is valence.'
      - 'The trap is A. Oxidation number is a charge-like bookkeeping number and can be negative or change, such as −4 to +4 for carbon.'
    hint: 'Which word means "combining power"?'
    why:
      A: 'Oxidation number is the apparent charge on an atom, not its bond count.'
      C: 'Atomic number is the number of protons.'
      D: 'Electronegativity is how strongly an atom pulls shared electrons.'
  34:
