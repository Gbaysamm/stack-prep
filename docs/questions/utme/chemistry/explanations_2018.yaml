format_version: 1
exam_year: 2018
subject: CHEM
explanations:
  1:
    answer: D
    steps:
      - 'The modern periodic law says the properties of elements are a periodic function of their atomic numbers.'
      - 'Mendeleev first arranged elements by atomic weight, but some pairs came out in the wrong order (argon 40 sits before potassium 39).'
      - 'Moseley showed that ordering by atomic number, the number of protons, removes these problems.'
      - 'So the periodic table is arranged in order of atomic numbers.'
      - 'The trap is A, atomic weights. That was the old basis, not the modern one.'
    hint: 'Which number is the same for every atom of an element and never changes with isotopes?'
    why:
      A: 'Atomic weight was Mendeleev''s basis, and it puts pairs like Ar and K in the wrong order.'
      B: 'Isotopes of one element have different masses but sit in one place, so isotopic weight cannot be the basis.'
      C: 'Molecular weight belongs to compounds and molecules, not to elements in a table.'

  2:
    answer: C
    steps:
      - 'Dilution rule: the moles of acid stay the same, so C₁V₁ = C₂V₂.'
      - 'The final volume is the acid plus the water: V₂ = 1 + 10 = 11 litres.'
      - 'C₂ = C₁V₁ ÷ V₂ = (2.2 mol dm⁻³ × 1 dm³) ÷ 11 dm³ = 0.20 mol dm⁻³.'
      - 'Check: the acid is spread through 11 times its own volume, so it is 11 times weaker. 2.2 ÷ 11 = 0.2.'
      - 'The trap is dividing by 10 instead of 11 and getting 0.22 M. The 1 litre of acid also adds to the total volume.'
    hint: 'What is the total volume in the bucket after the acid is poured in?'
    why:
      A: 'This is the starting concentration; adding water must lower it.'
      B: 'This halves the concentration, as if only an equal volume of water were added.'
      D: 'This divides by 20, which is too much water.'

  3:
    answer: D
    steps:
      - 'On heating, ammonium chloride dissociates: $\ce{NH4Cl(s) <=>[heat] NH3(g) + HCl(g)}$.'
      - 'Graham''s law: the rate of diffusion of a gas is inversely proportional to the square root of its molar mass.'
      - '$\ce{NH3}$ has M = 17 g mol⁻¹ and $\ce{HCl}$ has M = 36.5 g mol⁻¹, so ammonia diffuses through the porous plug faster.'
      - 'Ammonia reaches the damp litmus first. It is alkaline, so the litmus turns blue first (later it turns red when the HCl arrives).'
      - 'The trap is C, turn red. That happens only later, after the slower hydrogen chloride gets through.'
    hint: 'Which of the two gases from the hot NH4Cl is lighter, and so arrives first?'
    why:
      A: 'Neither ammonia nor hydrogen chloride is a bleaching agent.'
      B: 'Litmus has only red and blue colours; it does not turn green.'
      C: 'Red comes only later, once the heavier HCl diffuses through.'

  4:
    answer: A
    steps:
      - 'The electrochemical series lists metals from the most electropositive (the strongest reducing agent) down.'
      - 'The correct start is K, Na, Ca, Mg, Al, Zn, Fe, Pb, H, Cu, Hg, Ag, Au.'
      - 'Magnesium is more reactive than aluminium, so Mg must come before Al.'
      - 'Swapping Al and Mg in the given list makes it correct.'
      - 'A memory line: "Kill Naughty Cats, Mix All Zebras In Paint, Hold Copper Mercury Silver Gold".'
    hint: 'Which is more reactive, magnesium or aluminium?'
    why:
      B: 'Zn is above Fe already, which is the correct order.'
      C: 'Zn is above Pb already, which is correct.'
      D: 'Pb is just above hydrogen, which is correct; lead slowly displaces hydrogen from acid.'

  5:
    answer: C
    steps:
      - 'A body moves in a straight line only when no force acts on it (Newton''s first law).'
      - 'So between collisions, nothing pulls or pushes a gas molecule off its path.'
      - 'That means the forces of attraction and repulsion between gas molecules are negligible.'
      - 'This is why an ideal gas never liquefies: there is no attraction to hold molecules together.'
      - 'The trap is A, elastic collisions. That is a true postulate, but it is about what happens at a collision, not between collisions.'
    hint: 'What would bend a molecule''s path if a force acted on it?'
    why:
      A: 'Elastic collisions are about energy at impact, not the straight path between impacts.'
      B: 'If repulsive forces acted, the path would curve, not stay straight.'
      D: 'Gas collisions are taken as perfectly elastic, and in any case this says nothing about the straight path.'

  6:
    answer: A
    steps:
      - 'The solubility of a gas in a liquid depends on four things: the solvent, the gas itself, the temperature and the pressure.'
      - 'Nature of solute: ammonia and hydrogen chloride dissolve hugely in water, while oxygen and nitrogen dissolve only slightly.'
      - 'Nature of solvent: a gas that reacts with or attracts the solvent dissolves more.'
      - 'Temperature: gases dissolve less as the liquid gets warmer. Pressure: by Henry''s law, more gas dissolves at higher pressure.'
      - 'The trap is D. It leaves out the gas itself, yet different gases have very different solubilities.'
    hint: 'Do ammonia and oxygen dissolve equally well in water at the same temperature and pressure?'
    why:
      B: 'Leaves out temperature and pressure, which both change gas solubility strongly.'
      C: 'The solute is only one of the four factors.'
      D: 'Leaves out the nature of the gas, though ammonia is far more soluble than oxygen.'

  7:
    answer: B
    steps:
      - 'Rule: across a period the number of shells stays the same and the outer electrons increase by one at each step.'
      - 'Period 3: Na has 1 outer electron, Mg 2, Al 3, Si 4, P 5, S 6, Cl 7, Ar 8.'
      - 'So the valence electrons increase progressively across a period. That is statement B.'
      - 'Elements in the same group, not period, share the same number of valence electrons. Elements in the same period, not group, share the same number of shells.'
      - 'The trap is D. Across a period metals give way to non-metals, so non-metallic character increases, not decreases.'
    hint: 'Count the outer electrons of Na, Mg and Al.'
    why:
      A: 'Same number of valence electrons is true of a group, not a period.'
      C: 'Same number of shells is true of a period, not a group.'
      D: 'Non-metallic character increases across a period, from sodium to chlorine.'

  8:
    answer: D
    steps:
      - 'Fats and oils are esters of propane-1,2,3-triol (glycerol) and long-chain fatty acids.'
      - 'Boiling them with caustic soda, NaOH, splits the ester: fat + NaOH → soap (sodium salt of the fatty acid) + glycerol.'
      - 'Making soap this way is called saponification, from the Latin "sapo", soap.'
      - 'The trap is A. Saponification is a kind of alkaline hydrolysis, but its special name is saponification.'
    hint: 'What is made when fat is boiled with caustic soda?'
    why:
      A: 'It is a hydrolysis, but the named process for fat and alkali is saponification.'
      B: 'Esterification makes an ester from an acid and an alcohol, the reverse direction.'
      C: 'Acidification means adding acid; caustic soda is an alkali.'

  9:
    answer: D
    steps:
      - 'An oxide reacts further with oxygen only if the element is not yet in its highest common oxidation state.'
      - '$\ce{2SO2 + O2 <=> 2SO3}$: sulphur goes from +4 to +6.'
      - '$\ce{2NO + O2 -> 2NO2}$: nitrogen goes from +2 to +4, which is why colourless NO turns brown in air.'
      - 'So the pair $\ce{SO2}$ and $\ce{NO}$ both form a higher oxide.'
      - 'The trap is C. $\ce{CO}$ does burn to $\ce{CO2}$, but $\ce{CO2}$ is already the highest oxide of carbon.'
    hint: 'Which oxides still have room for the element''s oxidation number to rise?'
    why:
      A: '$\ce{CO2}$ and $\ce{H2O}$ are both already fully oxidised.'
      B: 'NO reacts, but water does not form a higher oxide on its own.'
      C: '$\ce{CO2}$ is already the highest oxide of carbon.'

  10:
    answer: D
    steps:
      - 'A catalyst provides another reaction path with a lower activation energy.'
      - '$\ce{2KClO3 ->[MnO2][heat] 2KCl + 3O2}$'
      - 'With the energy barrier lowered, more molecules have enough energy to react at a moderate temperature.'
      - 'So $\ce{MnO2}$ lets oxygen come off without strong heating, and it is unchanged at the end.'
      - 'The trap is C. A faster rate is the result, but the way the catalyst works is by lowering the energy barrier.'
    hint: 'What barrier must molecules get over before they react?'
    why:
      A: 'A catalyst does not change the pressure.'
      B: 'Surface area is about grinding solids, not about how a catalyst works.'
      C: 'The rate rises as a result; the question asks how the catalyst acts.'

  11:
    answer: C
    steps:
      - 'Rule: liquids can be separated by distillation only when their boiling points differ clearly.'
      - 'Methanoic acid and water boil at about the same temperature, so distilling the mixture carries both over together.'
      - 'Neutralise first: $\ce{HCOOH + NaOH -> HCOONa + H2O}$. Sodium methanoate is a salt and does not boil off.'
      - 'Now distil: only water vaporises and condenses. The sand and the salt stay behind in the flask.'
      - 'The trap is A. Fractional distillation needs a difference in boiling points, and here there is almost none.'
    hint: 'How can you turn the acid into something that will not boil off with the water?'
    why:
      A: 'Fractional distillation cannot part two liquids with almost the same boiling point.'
      B: 'Filtering removes the sand, but distillation would still carry the acid over with the water.'
      D: 'Filtration cannot remove the dissolved sodium methanoate, so the water is not pure.'

  12:
    answer: D
    steps:
      - 'Faraday''s second law: the same quantity of electricity liberates the same number of moles of electrons at each electrode.'
      - '$\ce{Ag+ + e- -> Ag}$ and $\ce{Al^3+ + 3e- -> Al}$'
      - 'Moles of Ag = 3.6 g ÷ 108 g mol⁻¹ = 1/30 mol, so 1/30 mol of electrons passed.'
      - 'Moles of Al = (1/30) ÷ 3 = 1/90 mol. Mass of Al = 1/90 × 27 g = 0.3 g.'
      - 'The trap is C, 0.9 g. It forgets that each Al³⁺ needs three electrons.'
    hint: 'How many electrons does one aluminium ion need, compared with one silver ion?'
    why:
      A: 'Too big; it is a tenth of a mole of Al and ignores the electrons actually passed.'
      B: 'This does not follow from the charges on the two ions.'
      C: 'Treats Al³⁺ as needing one electron, like Ag⁺.'

  13:
    answer: A
    steps:
      - 'Nitrogen is made in the laboratory by warming ammonium chloride with sodium dioxonitrate(III).'
      - 'They form ammonium dioxonitrate(III): $\ce{NaNO2 + NH4Cl -> NaCl + NH4NO2}$.'
      - 'This decomposes on warming: $\ce{NH4NO2 -> N2 + 2H2O}$.'
      - 'The nitrogen is collected over water.'
      - 'The trap is B. Sodium trioxonitrate(V) has the wrong anion; the reaction needs the dioxonitrate(III), the nitrite.'
    hint: 'Which ammonium salt breaks up into nitrogen and water?'
    why:
      B: 'The trioxonitrate(V) (nitrate) does not give nitrogen with ammonium chloride.'
      C: 'Heated ammonium trioxonitrate(V) gives dinitrogen(I) oxide, not nitrogen.'
      D: 'Sodium chloride plays no part; the safe method makes the unstable ammonium dioxonitrate(III) in the flask from sodium dioxonitrate(III).'

  14:
    answer: D
    steps:
      - 'Fill the shells in order: 2 in the first, 8 in the second, then the rest.'
      - 'Atomic number 14 means 14 electrons: 2, 8, 4.'
      - 'The valence shell is the outermost shell, which holds 4 electrons. The element is silicon, in group 4.'
      - 'The trap is B. 2 is the number in the first shell, not the outer shell.'
    hint: 'Write 14 electrons as 2, 8 and what is left.'
    why:
      A: 'Fits an element of atomic number 11, sodium.'
      B: 'Counts the first shell, not the outermost.'
      C: 'Fits atomic number 13, aluminium.'

  15:
    answer: D
    steps:
      - 'Gay-Lussac''s law: gases react in simple whole-number ratios of volume.'
      - '$\ce{2H2(g) + O2(g) -> 2H2O(l)}$, so 2 volumes of hydrogen use 1 volume of oxygen.'
      - '8 cm³ of hydrogen uses 8 ÷ 2 = 4 cm³ of oxygen.'
      - 'Oxygen left = 20 cm³ − 4 cm³ = 16 cm³.'
      - 'The trap is B, 12 cm³. It subtracts all 8 cm³, as if the ratio were 1 : 1.'
    hint: 'How many volumes of oxygen does each 2 volumes of hydrogen need?'
    why:
      A: 'Halves the oxygen instead of working from the ratio.'
      B: 'Uses a 1 : 1 ratio and takes away 8 cm³.'
      C: 'Takes away 6 cm³, which no ratio in the equation gives.'

  16:
    answer: B
    steps:
      - 'Rule: hydrogen or carbon can reduce the oxide of a metal only if the metal is below them in reactivity (from about zinc downwards, at Bunsen flame temperature).'
      - 'Lead, copper and tin are low in the series: for example, $\ce{CuO + H2 -> Cu + H2O}$.'
      - 'Magnesium is high in the series. It holds oxygen too strongly, so $\ce{MgO}$ is not reduced by hydrogen or carbon at Bunsen temperature.'
      - 'Magnesium is extracted by electrolysis of its molten chloride instead.'
      - 'The trap is D. Tin oxide is reduced by carbon; that is how tin is extracted from cassiterite.'
    hint: 'Which of these metals is the most reactive?'
    why:
      A: 'Lead(II) oxide is reduced by carbon or hydrogen on heating.'
      C: 'Copper(II) oxide is easily reduced by hydrogen, a classic school experiment.'
      D: 'Tin(IV) oxide is reduced by carbon in the extraction of tin.'

  17:
    answer: C
    steps:
      - 'IUPAC rule: find the longest carbon chain, then number from the end nearer the branch.'
      - 'The longest chain is CH₃, CH, CH₂, CH₃: four carbons, so the parent is butane.'
      - 'The other CH₃ is a methyl branch. Numbering from the left puts it on carbon 2; from the right it would be carbon 3.'
      - 'Take the lower number: 2-methylbutane, $\ce{C5H12}$.'
      - 'The trap is B, 3-methylbutane. It numbers from the wrong end.'
    hint: 'Count the longest chain, then number so the branch gets the smallest number.'
    why:
      A: 'There are only five carbons, and a methyl on carbon 1 just lengthens the chain.'
      B: 'Numbers from the wrong end; the lowest locant must be used.'
      D: '2,2-dimethylpropane has a carbon joined to four others, which this structure does not have.'

  18:
    answer: A
    steps:
      - 'Rule: with NaOH, amphoteric hydroxides (Zn, Al, Pb) redissolve in excess. With ammonia, only zinc and copper hydroxides redissolve in excess, forming complex ions.'
      - 'With NaOH: $\ce{Zn^2+ + 2OH- -> Zn(OH)2(s)}$, white, then soluble in excess as zincate.'
      - 'With excess ammonia: $\ce{Zn(OH)2 + 4NH3 -> [Zn(NH3)4]^2+ + 2OH-}$, colourless solution.'
      - 'Only zinc is white and soluble in excess of both reagents.'
      - 'The trap is C. $\ce{Al(OH)3}$ dissolves in excess NaOH but not in excess ammonia.'
    hint: 'Which of these ions forms a soluble ammine complex with ammonia?'
    why:
      B: 'Calcium hydroxide does not dissolve in excess NaOH, and ammonia gives little or no precipitate.'
      C: 'Aluminium hydroxide stays undissolved in excess ammonia.'
      D: 'Lead(II) hydroxide stays undissolved in excess ammonia.'

  19:
    answer: B
    steps:
      - 'Concentration (mol dm⁻³) = moles of solute ÷ volume in dm³.'
      - 'Molar mass of NaOH = 23 + 16 + 1 = 40 g mol⁻¹.'
      - 'Moles = 2 g ÷ 40 g mol⁻¹ = 0.05 mol.'
      - 'Volume = 100 cm³ = 0.1 dm³, so concentration = 0.05 ÷ 0.1 = 0.50 mol dm⁻³.'
      - 'The trap is C, 0.05 mol dm⁻³. That is the moles, not yet divided by the volume in dm³.'
    hint: 'Turn grams into moles, then turn cm³ into dm³.'
    why:
      A: 'Uses the wrong molar mass for NaOH.'
      C: 'Stops at the number of moles and forgets to divide by 0.1 dm³.'
      D: 'Does not follow from 2 g in 100 cm³.'

  20:
    answer: C
    steps:
      - 'Number of atoms = moles × Avogadro constant.'
      - 'Moles of Mg = 6.0 g ÷ 24 g mol⁻¹ = 0.25 mol.'
      - 'Atoms = 0.25 mol × 6.02 × 10²³ mol⁻¹ = 1.505 × 10²³, about 1.51 × 10²³.'
      - 'Check: 6 g is a quarter of a mole, so a quarter of 6.02 × 10²³ makes sense.'
      - 'The trap is D, 3.02 × 10²³. That is half a mole, as if Mg were 12.'
    hint: 'What fraction of a mole is 6 g of magnesium?'
    why:
      A: 'Divides by 50 instead of 4.'
      B: 'Off by a factor of more than six; it does not follow from 0.25 mol.'
      D: 'Uses half a mole instead of a quarter.'

  21:
    answer: C
    steps:
      - 'Industrial radiography uses penetrating gamma rays to photograph the inside of metal parts, like an X-ray.'
      - 'Cobalt-60 is a strong gamma emitter, so its rays pass through welds and castings and show cracks and gaps on film.'
      - 'Cobalt-60 is also used in cancer radiotherapy for the same reason.'
      - 'The trap is D. Iodine-131 is a tracer for the thyroid gland, not an industrial gamma source.'
    hint: 'Which isotope gives strong gamma rays that pass through metal?'
    why:
      A: 'Carbon-14 is a weak beta emitter used in radiocarbon dating.'
      B: 'Phosphorus-32 is a beta emitter used as a tracer in plant studies and some cancer treatment.'
      D: 'Iodine-131 is used to study and treat the thyroid gland.'

  22:
    answer: D
    steps:
      - 'Diagonal relationship: an element in period 2 often resembles the element one group to the right in period 3.'
      - 'Be is in group 2, period 2; Al is in group 3, period 3. They sit diagonally to each other.'
      - 'Their ions have a similar charge-to-size ratio, so both form amphoteric oxides and covalent chlorides.'
      - 'Other pairs are Li and Mg, and B and Si.'
      - 'The trap is A. Many metals exist, and being metals does not explain why these two are so alike.'
    hint: 'Locate Be and Al on the periodic table. How are they placed?'
    why:
      A: 'All metals are metals; that does not explain this special likeness.'
      B: 'Be is in group 2 and Al in group 3.'
      C: 'Be is in period 2 and Al in period 3.'

  23:
    answer: C
    steps:
      - 'Equilibrium law: K = product of the concentrations of products ÷ product of the concentrations of reactants, each raised to the power of its coefficient.'
      - 'For $m\mathrm{E} + n\mathrm{F} \rightleftharpoons p\mathrm{G} + q\mathrm{H}$, the products are G and H, the reactants E and F.'
      - 'So $K = \dfrac{[\mathrm{G}]^p[\mathrm{H}]^q}{[\mathrm{E}]^m[\mathrm{F}]^n}$.'
      - 'Remember: products on top, reactants below, coefficients become powers.'
      - 'The trap is A. It turns the expression upside down, putting reactants on top.'
    hint: 'Which side of the equation goes on top of K?'
    why:
      A: 'Upside down: reactants are on top.'
      B: 'Upside down and missing the powers.'
      D: 'Right way up but missing the powers from the coefficients.'

  24:
    answer: C
    steps:
      - 'A reducing agent loses electrons, so its oxidation number goes up.'
      - 'In every equation nitrogen goes from −3 in $\ce{NH3}$ to 0 in $\ce{N2}$, so ammonia is oxidised.'
      - 'In (i) it reduces CuO to Cu; in (ii) it reduces $\ce{Cl2}$ to $\ce{HCl}$ (0 to −1); in (iii) it reduces $\ce{O2}$ to $\ce{H2O}$ (0 to −2).'
      - 'Something that is itself oxidised while reducing another substance is a reducing agent.'
      - 'The trap is A. Ammonia is basic, but none of these reactions is acid with base.'
    hint: 'Follow the oxidation number of nitrogen from NH3 to N2.'
    why:
      A: 'No acid is neutralised here; these are redox reactions.'
      B: 'Ammonia does not act as an acid here; it gives up no protons to a base.'
      D: 'Ammonia is oxidised, so it is the reducing agent, not the oxidising agent.'

  25:
    answer: B
    steps:
      - 'Rule: a trioxosulphate(IV) (sulphite) reacts with dilute acid to give sulphur(IV) oxide.'
      - '$\ce{Na2SO3 + 2HCl -> 2NaCl + H2O + SO2}$'
      - '$\ce{SO2}$ has a choking, pungent smell and is a reducing agent: it turns acidified purple $\ce{KMnO4}$ colourless.'
      - 'So the salt is $\ce{Na2SO3}$.'
      - 'The trap is C. $\ce{Na2S}$ gives $\ce{H2S}$, which also reduces $\ce{KMnO4}$, but $\ce{H2S}$ smells of rotten eggs and leaves a yellow deposit of sulphur.'
    hint: 'Which gas is choking and turns purple permanganate colourless?'
    why:
      A: 'Sodium tetraoxosulphate(VI) gives no gas with dilute HCl.'
      C: 'Gives hydrogen sulphide, with a rotten-egg smell, not a pungent choking gas.'
      D: 'Gives carbon(IV) oxide, which is odourless and does not reduce permanganate.'

  26:
    answer: A
    steps:
      - 'Soft drinks are made by dissolving carbon(IV) oxide, $\ce{CO2}$, in them under pressure.'
      - 'Some of it forms weak carbonic acid: $\ce{CO2 + H2O <=> H2CO3}$, which gives the sharp, fresh taste.'
      - 'When the bottle is opened the pressure falls and the gas fizzes out.'
      - 'The trap is C. "Soda" is in the name, but soda water is simply carbonated water.'
    hint: 'What makes a soft drink fizz when you open it?'
    why:
      B: 'Carbon(II) oxide is poisonous and is never put in drinks.'
      C: 'Soda is sodium carbonate, which is not what gives the fizzy taste.'
      D: 'Glucose gives sweetness, not the refreshing fizzy bite.'

  27:
    answer: A
    steps:
      - 'A mixture has two or more substances not chemically combined, in no fixed ratio. A compound has a fixed formula.'
      - 'Petroleum is a mixture of many hydrocarbons, separated by fractional distillation.'
      - 'Rubber latex is rubber particles dispersed in water. Vulcanizer''s solution is rubber dissolved in a solvent.'
      - 'Carbon(IV) sulphide, $\ce{CS2}$, is a single compound with a fixed formula.'
      - 'So the mixtures are i, ii and iii. The trap is B, which wrongly counts $\ce{CS2}$ as a mixture.'
    hint: 'Which one has a definite chemical formula?'
    why:
      B: 'Carbon(IV) sulphide is a compound, and vulcanizer''s solution is left out.'
      C: 'Leaves out vulcanizer''s solution, which is a solution and so a mixture.'
      D: 'Counts the compound CS₂ and leaves out two mixtures.'

  28:
    answer: A
    steps:
      - 'Law of conservation of mass: matter is neither created nor destroyed in a chemical reaction.'
      - 'Balancing an equation makes the number of each kind of atom equal on both sides, for example $\ce{2H2 + O2 -> 2H2O}$ has 4 H and 2 O on each side.'
      - 'Equal atoms on each side means equal mass on each side.'
      - 'The trap is B. Definite proportions is about a compound always having the same composition, not about balancing.'
    hint: 'Why must the atoms on each side be the same in number?'
    why:
      B: 'Definite proportions is about the fixed composition of one compound.'
      C: 'Multiple proportions is about two elements forming more than one compound.'
      D: 'Balancing counts atoms, which is about mass, not energy.'

  29:
    answer: A
    steps:
      - 'General gas law: P₁V₁/T₁ = P₂V₂/T₂. Convert to s.t.p. (1 atm, 273 K), then divide by 22.4 dm³.'
      - 'T₁ = 273 + 273 = 546 K, P₁ = 4 atm, V₁ = 10.0 dm³.'
      - 'V₂ = P₁V₁T₂ ÷ (P₂T₁) = (4 × 10.0 × 273) ÷ (1 × 546) = 20.0 dm³ at s.t.p.'
      - 'Moles = 20.0 dm³ ÷ 22.4 dm³ mol⁻¹ = 0.89 mol.'
      - 'The trap is forgetting to change 273 °C to 546 K. Then the volume is not halved and the answer comes out about twice too big.'
    hint: 'Change 273 °C to kelvin first, then bring the volume to s.t.p.'
    why:
      B: 'About twice too big, near what you get by leaving the temperature as 273 K.'
      C: 'About four times too big; the volume has not been brought to s.t.p. properly.'
      D: 'Far too big; no correct use of the gas law gives this.'

  30:
    answer: C
    steps:
      - 'Charles'' law: at constant pressure, V is proportional to the absolute temperature, V ∝ T.'
      - 'When the graph of volume against temperature is extended backwards, V reaches zero at 0 K.'
      - '0 K = −273 °C, the absolute zero of temperature.'
      - 'The trap is A, 0 °C. That is only the freezing point of water, and gases still have volume there.'
    hint: 'What is 0 K in degrees Celsius?'
    why:
      A: 'At 0 °C (273 K) a gas still has its full volume at s.t.p.'
      B: 'This is not a special point; the volume is still well above zero.'
      D: 'This is below absolute zero, which cannot be reached.'

  31:
    answer: A
    steps:
      - 'Ethene, $\ce{C2H4}$, is a natural plant hormone that speeds up the ripening of fruit.'
      - 'Ripe fruits give off ethene themselves, which is why one ripe fruit in a bag ripens the others; fruit stores use ethene gas to ripen green bananas evenly.'
      - 'Remember: "ethene for eating", it gets fruit ready to eat.'
      - 'The trap is C. Methane is a fuel gas and has no effect on ripening.'
    hint: 'Which simple alkene do ripe fruits give off themselves?'
    why:
      B: 'Propane is a fuel (cooking gas), not a ripening agent.'
      C: 'Methane is natural gas, a fuel.'
      D: 'Butane is a fuel in lighters and cooking gas.'

  32:
    answer: B
    steps:
      - 'Rule: very insoluble sulphides such as CuS and PbS do not dissolve in dilute acid; more soluble ones such as FeS and ZnS do.'
      - 'FeS and ZnS react: $\ce{FeS + 2HCl -> FeCl2 + H2S}$, which is how hydrogen sulphide is made in the laboratory.'
      - 'CuS is so insoluble that it is even precipitated by passing $\ce{H2S}$ into an acidified copper(II) solution.'
      - 'So CuS is the sulphide that stays undissolved in dilute HCl.'
      - 'The trap is D. $\ce{Na2S}$ is soluble in water and reacts at once with acid to give $\ce{H2S}$.'
    hint: 'Which of these sulphides is used to make H2S, and which is precipitated in acid solution?'
    why:
      A: 'FeS dissolves in dilute HCl, giving H₂S; it is the usual laboratory source of the gas.'
      C: 'ZnS dissolves in dilute HCl, giving H₂S.'
      D: 'Na₂S is soluble in water and reacts readily with acid.'

  33:
    answer: D
    steps:
      - 'For a base: pOH = −log[OH⁻], and pH + pOH = 14.'
      - 'NaOH is a strong base, fully ionised: $\ce{NaOH -> Na+ + OH-}$, so [OH⁻] = 0.001 = 10⁻³ mol dm⁻³.'
      - 'pOH = −log 10⁻³ = 3.'
      - 'pH = 14 − 3 = 11.'
      - 'The trap is to stop at 3, or treat it as an acid. A base must have pH above 7.'
