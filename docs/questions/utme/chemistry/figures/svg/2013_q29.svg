<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" width="360" height="270" role="img"
     aria-label="A graph of energy in kilojoules against time in minutes, on a grid with lines every 25 kilojoules. Both curves start at 100 kilojoules. The solid curve, without a catalyst, rises to a peak of 300 kilojoules. The dashed curve, with a catalyst, rises to a peak of 200 kilojoules. Both curves then fall and level off at 60 kilojoules.">
