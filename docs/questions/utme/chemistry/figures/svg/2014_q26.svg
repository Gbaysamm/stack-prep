    <path d="M50 225 V40"/><path d="M50 225 H340"/>
  </g>
  <g fill="#1a1a1f"><path d="M50 34 L45.5 44 H54.5 Z"/><path d="M346 225 L336 220.5 V229.5 Z"/></g>
  <g fill="none" stroke="#1a1a1f" stroke-width="1.2" stroke-dasharray="6 4">
    <path d="M55 195 H270"/><path d="M140 130 H335"/>
  </g>
  <path d="M60 195 C125 195 165 55 205 55 C240 55 245 130 290 130 H300" fill="none" stroke="#1a1a1f" stroke-width="2.2"/>
  <path d="M208 55 H238" fill="none" stroke="#1a1a1f" stroke-width="1.2"/>
  <g fill="none" stroke="#1a1a1f" stroke-width="1.3">
    <path d="M205 63 V122"/><path d="M165 138 V187"/>
  </g>
  <g fill="#1a1a1f">
    <path d="M205 56 L201 64 H209 Z"/><path d="M205 129 L201 121 H209 Z"/>
    <path d="M165 131 L161 139 H169 Z"/><path d="M165 194 L161 186 H169 Z"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="14" fill="#1a1a1f">
    <text x="242" y="60">X</text><text x="212" y="96">Y</text><text x="172" y="167">Z</text>
    <text x="62" y="213">A + B</text><text x="292" y="122">C + D</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#1a1a1f">
    <text x="12" y="14">Energy</text><text x="12" y="29">(kJ mol⁻¹)</text>
    <text x="340" y="245" text-anchor="end">Reaction coordinate</text>
  </g>
</svg>
