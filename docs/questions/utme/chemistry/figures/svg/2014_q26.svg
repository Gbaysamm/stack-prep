<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" width="360" height="250" role="img"
     aria-label="An energy profile of energy in kilojoules per mole against reaction coordinate. The reactants A plus B start low on the left. The curve rises to a peak marked X and falls to the products C plus D on the right, which sit higher than A plus B. Y is a double arrow from the peak down to the level of C plus D. Z is a double arrow between the level of A plus B and the level of C plus D.">
