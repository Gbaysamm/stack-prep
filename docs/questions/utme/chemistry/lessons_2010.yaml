  25:
    moments:
      - section: 'The question'
        say: 'A current of ten amperes flows for one thousand nine hundred and thirty seconds through an aluminium salt. How many grams of aluminium come out? Watch the charge on the aluminium ion.'
        write: '$I = 10$ A, $t = 1930$ s, Al = 27, F = 96 500 C mol⁻¹. Mass of Al $= ?$'
      - section: 'The rule'
        say: 'Charge equals current times time. One faraday, ninety-six thousand five hundred coulombs, is one mole of electrons.'
        write: '$Q = It$,  1 F $=$ 96 500 C $=$ 1 mol of electrons'
      - section: 'The equation'
        say: 'Each aluminium ion carries three positive charges, so it needs three electrons. Three faradays deposit one mole, which is twenty-seven grams.'
        write: '$\ce{Al^3+ + 3e- -> Al}$,  3 F $\rightarrow$ 27 g'
      - section: 'The working'
        say: 'Charge is ten amperes times one thousand nine hundred and thirty seconds, which is nineteen thousand three hundred coulombs.'
        write: '$Q = 10 \times 1930 = 19\,300$ C'
      - say: 'Change coulombs to faradays. Nineteen thousand three hundred over ninety-six thousand five hundred is zero point two faradays.'
        write: '$\dfrac{19\,300}{96\,500} = 0.2$ F'
      - say: 'Three faradays give twenty-seven grams, so one faraday gives nine grams. Zero point two faradays give zero point two times nine.'
        write: 'Mass $= \dfrac{0.2}{3} \times 27 = 0.2 \times 9$'
      - say: 'Zero point two times nine is one point eight grams.'
        write: '$= 1.8$ g'
      - section: 'Check'
        say: 'Zero point two faradays is less than a tenth of the three faradays needed for a full mole. A tenth of twenty-seven is two point seven, so a bit less, one point eight, makes sense.'
        write: '$1.8 < 2.7$ ✓'
      - section: 'Answer'
        say: 'So the mass of aluminium deposited is one point eight grams, which is option B.'
        write: '$\therefore$ mass of Al $= 1.8$ g'
        answer: true
    traps:
      A: 'You went for zero point two grams. That is the number of faradays, not the mass. Turn faradays into grams using three faradays for twenty-seven grams.'
      C: 'You went for five point four grams. That uses one faraday per mole. The aluminium ion carries three charges, so it needs three faradays per mole.'
      D: 'You went for fourteen point two grams. That does not follow from charge equals current times time and three faradays per mole.'

  26:
    moments:
      - section: 'The question'
        say: 'Entropy is disorder. In which of these changes does the disorder go up? Look at what happens to the particles.'
        write: 'Which change has a positive $\Delta S$?'
      - section: 'The rule'
        say: 'Entropy increases when a solid or liquid forms a gas, or when the number of gas particles increases.'
        write: '$\Delta S > 0$: solid or liquid $\rightarrow$ gas, more gas particles'
      - section: 'The equation'
        say: 'When ammonium chloride is heated, the solid splits into two gases, ammonia and hydrogen chloride.'
        write: '$\ce{NH4Cl(s) -> NH3(g) + HCl(g)}$'
      - section: 'The working'
        say: 'One mole of ordered solid becomes two moles of gas moving freely everywhere. The disorder rises sharply.'
        write: '1 mol solid $\rightarrow$ 2 mol gas, $\Delta S > 0$'
      - section: 'The others'
        say: 'An acid and a base join their ions into water, so the particles become fewer and the disorder falls.'
        write: '$\ce{H+ + OH- -> H2O}$, fewer particles'
      - say: 'Condensation turns free gas into a more ordered liquid, so the disorder falls there too.'
        write: 'Steam $\rightarrow$ water, more order'
      - section: 'Check'
        say: 'Think of a crowd leaving a packed hall into an open field. Solid to gas is the biggest jump in disorder there is.'
        write: 'Solid $\rightarrow$ gas: biggest rise in disorder ✓'
      - section: 'Answer'
        say: 'So the entropy change is positive in the thermal dissociation of ammonium chloride, which is option A.'
        write: '$\therefore$ thermal dissociation of $\ce{NH4Cl}$'
        answer: true
    traps:
      B: 'You went for acid and base. The H⁺ and OH⁻ ions join into water molecules, so the particles become fewer and more ordered.'
      C: 'You went for acid added to water. The acid ions become surrounded by ordered water molecules, so there is no large gain in disorder.'
      D: 'You went for condensation. Steam to water is gas to liquid, so the particles become more ordered and the entropy falls.'

  27:
    moments:
      - section: 'The question'
        say: 'A reaction gives out heat and becomes much more disordered. What happens to its free energy? Get one sign wrong and you land on the opposite option.'
        write: 'Exothermic and great disorder. Free energy $?$'
      - section: 'The rule'
        say: 'The change in free energy, delta G, equals delta H minus T delta S. A reaction goes on its own when delta G is negative.'
        write: '$\Delta G = \Delta H - T\Delta S$'
      - section: 'The signs'
        say: 'Exothermic means heat is given out, so delta H is negative.'
        write: 'Exothermic: $\Delta H < 0$'
      - say: 'Great disorder means delta S is large and positive. So minus T delta S is large and negative.'
        write: 'Great disorder: $\Delta S > 0 \Rightarrow -T\Delta S < 0$'
      - section: 'The working'
        say: 'Delta G is a negative number plus another large negative number. That gives a large negative value.'
        write: '$\Delta G = (\text{negative}) + (\text{large negative}) = \text{large negative}$'
      - say: 'A large negative delta G means the free energy falls a lot.'
        write: '$\Delta G \ll 0$, free energy decreases'
      - section: 'Check'
        say: 'Both changes push the same way, so such a reaction goes forward on its own at every temperature, like fuel burning.'
        write: 'Spontaneous at all temperatures ✓'
      - section: 'Answer'
        say: 'So there will be a large decrease in free energy, which is option D.'
        write: '$\therefore$ large decrease in free energy'
        answer: true
    traps:
      A: 'You went for static. A reaction with a large negative delta G goes forward readily, so it is far from static.'
      B: 'You went for equilibrium. At equilibrium delta G is zero, not large and negative.'
      C: 'You went for a large increase. Both delta H and minus T delta S are negative, so delta G is negative and the free energy falls.'

  28:
    moments:
      - section: 'The question'
        say: 'Heat KClO₃ on its own and you need a lot of heat. Add a pinch of manganese four oxide and gentle heat is enough. How does the catalyst do that?'
        write: '$\ce{KClO3}$ with $\ce{MnO2}$ needs only moderate heat. Why?'
