# UTME 2010 Chemistry, lessons for the board.
#
# Each lesson is a run of MOMENTS, taught the way a good chemistry teacher works on the board:
# the question, the rule in words then written, the balanced equation, the working with units
# one step per moment, the check, and the answer.
#
#   say:     what the teacher says, heard and not read. Formulas written as formulas
#            ("H₂SO₄"), the voice reads them letter by letter; units in words, no symbols the voice would stop on.
#   write:   the one line written while it is said, with mhchem for formulae and equations.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2010.yaml. Answers match that file.
format_version: 1
exam_year: 2010
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'We have four everyday things, and only one of them is a mixture. The tricky part is that every one of them looks like a single substance to the eye.'
        write: 'Which is a mixture? common salt, blood, sand, washing soda'
      - section: 'The rule'
        say: 'A mixture is two or more substances put together without chemical combination. Each part keeps its own properties, and we can separate the parts by physical means.'
        write: 'Mixture: not chemically combined, no fixed composition, separated physically'
      - say: 'A compound is different. Its elements are joined chemically in a fixed ratio, so it has a fixed formula.'
        write: 'Compound: chemically joined, fixed formula'
      - section: 'Test each one'
        say: 'Common salt is sodium chloride, NaCl. It always has one sodium for every chlorine, a fixed formula, so it is a compound.'
        write: 'Common salt, sodium chloride $\ce{NaCl}$, compound'
      - say: 'Washing soda is sodium trioxocarbonate four, Na₂CO₃, with ten molecules of water held in each crystal. That too is a fixed formula, so washing soda is a compound.'
        write: 'Washing soda $\ce{Na2CO3.10H2O}$, compound'
      - say: 'Sand, in this list, is silicon four oxide, SiO₂. That is a compound too.'
        write: 'Sand, mainly $\ce{SiO2}$, compound'
      - say: 'Blood is plasma, which is mostly water, carrying red cells, white cells, platelets, salts and sugar. In a hospital laboratory, a centrifuge spins it and the parts separate.'
        write: 'Blood = plasma + cells + salts + sugar, separated by a centrifuge'
      - section: 'Check'
        say: 'Blood from two people is never exactly the same, so it has no fixed composition. That is the mark of a mixture.'
        write: 'No fixed composition, separated physically ✓'
      - section: 'Answer'
        say: 'So blood is the mixture, which is option B. Remember, if it varies from sample to sample and can be separated physically, it is a mixture.'
        write: '$\therefore$ blood is a mixture'
        answer: true
    traps:
      A: 'You went for common salt. It is the compound sodium chloride, NaCl, with a fixed formula, so it is not a mixture.'
      C: 'You went for sand. Here it stands for silicon four oxide, SiO₂, which is a compound with a fixed formula.'
      D: 'You went for washing soda. It is sodium trioxocarbonate four with ten waters of crystallisation, a compound with a fixed formula.'

  3:
    moments:
      - section: 'The question'
        say: 'We want the percentage by mass of nitrogen in calcium trioxonitrate five. Most mistakes here happen before any sum, when the formula is written.'
        write: '% N in calcium trioxonitrate(V) $= ?$  [Ca = 40, N = 14, O = 16]'
      - section: 'The formula'
        say: 'Calcium is plus two and the trioxonitrate five ion is minus one, so we need two nitrate groups to balance the charge. The small 2 outside the bracket means two whole NO₃ groups.'
        write: '$\ce{Ca^2+}$ and $\ce{NO3-}$ give $\ce{Ca(NO3)2}$'
      - section: 'The rule'
        say: 'Percentage by mass of an element is the mass of that element in one mole, divided by the molar mass, times one hundred.'
        write: '% element $= \dfrac{\text{mass of element in 1 mol}}{\text{molar mass}} \times 100$'
      - section: 'The working'
        say: 'Molar mass first. One nitrate group is fourteen plus three times sixteen, which is sixty-two grams per mole.'
        write: '$\ce{NO3}$: $14 + 3 \times 16 = 62$'
      - say: 'Two nitrate groups make one hundred and twenty-four. Add the calcium, forty, and the molar mass is one hundred and sixty-four grams per mole.'
        write: '$\ce{Ca(NO3)2}$: $40 + 2 \times 62 = 164$ g mol⁻¹'
      - say: 'There are two nitrogen atoms in one mole, so the mass of nitrogen is two times fourteen, which is twenty-eight grams.'
        write: 'Mass of N $= 2 \times 14 = 28$ g'
      - say: 'Now divide. Twenty-eight over one hundred and sixty-four, times one hundred, gives seventeen point one percent.'
        write: '% N $= \dfrac{28}{164} \times 100 = 17.1\%$'
      - section: 'Check'
        say: 'Nitrogen is a small part of a heavy compound, so a number under a fifth makes sense.'
        write: '$17.1\% < 20\%$ ✓'
      - section: 'Answer'
        say: 'So the percentage of nitrogen is seventeen point one percent, which is option C.'
        write: '$\therefore$ % N $= 17.1\%$'
        answer: true
    traps:
      A: 'You went for eight point five percent. That counts only one nitrogen and also uses the wrong molar mass. The formula has two nitrate groups, so there are two nitrogens in one hundred and sixty-four grams.'
      B: 'You went for thirteen point one percent. That counts one nitrogen, as if the formula were CaNO₃. Calcium is plus two, so it needs two nitrate groups.'
      D: 'You went for twenty-seven point six percent. That divides by the wrong molar mass. The whole compound weighs one hundred and sixty-four grams per mole.'

  4:
    moments:
      - section: 'The question'
        say: 'A cold bottle of milk comes out of the fridge, and soon its outside is wet. Where does that water come from, and why?'
        write: 'Cold bottle from the fridge, droplets on the outside. Why?'
      - section: 'The rule'
        say: 'A vapour condenses when its molecules lose enough kinetic energy for the attractive forces to pull them together into a liquid.'
        write: 'Vapour loses energy $\rightarrow$ liquid (condensation)'
      - say: 'And heat always flows from the hotter body to the colder one, never the other way.'
        write: 'Heat flows hot $\rightarrow$ cold'
      - section: 'The working'
        say: 'The bottle is colder than the warm room air around it. So heat flows from the air into the bottle.'
        write: 'Warm air $\xrightarrow{\text{heat}}$ cold bottle'
      - say: 'Water vapour molecules that hit the cold glass give up some of their energy to it, slow down, and condense into droplets.'
        write: '$\ce{H2O(g) -> H2O(l)}$ on the cold glass'
      - section: 'Check'
        say: 'The droplets sit on the outside of a closed bottle, so they cannot come from the milk. They come from the air, just like the wet outside of a cold bottle of malt at a party.'
        write: 'Water from the air, not from the milk ✓'
      - section: 'Answer'
        say: 'So the water vapour in the air loses some of its energy to the bottle, which is option D.'
        write: '$\therefore$ the vapour loses energy to the bottle'
        answer: true
    traps:
      A: 'You went for the vapour gaining energy. Heat flows from hot to cold, so the cold bottle cannot give energy to the warmer air. The vapour loses energy and condenses.'
      B: 'You went for the milk losing heat. Out of the fridge, the milk is the cold one, so it gains heat from the room. The droplets come from the air outside.'
      C: 'You went for vapour pressure equal to atmospheric pressure. That is the condition for boiling, not for water forming on a cold surface.'

  5:
    moments:
      - section: 'The question'
        say: 'A gas fills V centimetres cubed at a pressure of P. We cut the pressure in half and keep the temperature fixed. Does the gas shrink or spread out?'
        write: '$V_1 = V$ cm³, $P_1 = P$ mmHg, $P_2 = \dfrac{P}{2}$, $V_2 = ?$'
      - section: 'The rule'
        say: 'Boyle''s law says that at constant temperature, the volume of a fixed mass of gas is inversely proportional to its pressure.'
        write: 'Boyle''s law: $P_1V_1 = P_2V_2$ at constant temperature'
      - section: 'The working'
        say: 'Make V two the subject by dividing both sides by P two.'
        write: '$V_2 = \dfrac{P_1V_1}{P_2}$'
      - say: 'Now put in the values. P one is P, V one is V, and P two is P over two.'
        write: '$V_2 = \dfrac{P \times V}{P/2}$'
      - say: 'Dividing by a half is the same as multiplying by two. The P on top and bottom cancels.'
        write: '$V_2 = PV \times \dfrac{2}{P} = 2V$ cm³'
      - section: 'Check'
        say: 'Less pressure squeezing the gas lets it spread out, so the volume should grow. Two V is bigger than V, so it makes sense.'
        write: 'Pressure halves, volume doubles ✓'
      - section: 'Answer'
        say: 'So the new volume is two V centimetres cubed, which is option B.'
        write: '$\therefore V_2 = 2V$ cm³'
        answer: true
    traps:
      A: 'You went for four V. That needs the pressure cut to a quarter. Halving the pressure only doubles the volume.'
      C: 'You went for V over two. That treats volume as rising and falling with pressure. In Boyle''s law they go opposite ways, so half the pressure gives double the volume.'
      D: 'You went for V. At constant temperature the volume must change when the pressure changes. Here it doubles.'

  6:
    moments:
      - section: 'The question'
        say: 'From sodium to argon, it gets harder and harder to pull an electron off. Two options talk about nuclear charge and two about screening. Which one really does the work?'
        write: 'Across a period, first ionisation energy rises. Why?'
      - section: 'The rule'
        say: 'First ionisation energy is the energy needed to remove one electron from each atom in a mole of gaseous atoms.'
        write: '$\ce{X(g) -> X+(g) + e-}$'
      - section: 'The reasoning'
        say: 'Across a period, each element has one more proton than the one before it. So the nuclear charge goes up by one each step.'
        write: 'Na 11 protons $\rightarrow$ Ar 18 protons'
      - say: 'The new electrons go into the same outer shell. Electrons in the same shell screen each other poorly, so the screening stays about the same.'
        write: 'Same shell, screening roughly constant'
      - say: 'More pull from the nucleus with the same screening means the outer electrons are held more tightly, and the atom gets smaller.'
        write: 'More nuclear charge $\rightarrow$ smaller atom, tighter hold'
      - section: 'Check'
        say: 'Sodium gives up its electron easily, which is why it reacts so fast with water. Argon holds its electrons tightly. That fits a rising pull.'
        write: 'Na loses $e^-$ easily, Ar does not ✓'
      - section: 'Answer'
        say: 'So the rise is due to the increase in nuclear charge, which is option B.'
        write: '$\therefore$ increase in nuclear charge'
        answer: true
    traps:
      A: 'You went for a decrease in nuclear charge. Each step across a period adds a proton, so the nuclear charge goes up, not down.'
      C: 'You went for a decrease in screening. The inner shells stay the same across a period, so screening hardly changes. The rising nuclear charge is what does the work.'
      D: 'You went for an increase in screening. More screening would make the electron easier to remove, so it would lower the ionisation energy, not raise it.'

  7:
    moments:
      - section: 'The question'
        say: 'How many unpaired electrons does a nitrogen atom have? Many students pair them up too early. Let us fill the boxes properly.'
        write: 'Nitrogen, $Z = 7$. Unpaired electrons $= ?$'
      - section: 'The rule'
        say: 'Hund''s rule says electrons enter orbitals of the same sub level singly, with parallel spins, before any pairing happens.'
        write: 'Hund''s rule: fill singly first, then pair'
      - section: 'The working'
        say: 'Nitrogen has seven electrons. Two go into one s, two into two s, and three into two p.'
        write: '$\ce{N}$: $1s^2\ 2s^2\ 2p^3$'
      - say: 'The one s and two s orbitals are full, so those four electrons are paired.'
        write: '$1s$ ↑↓   $2s$ ↑↓'
      - say: 'Two p has three orbitals, two p x, two p y and two p z. By Hund''s rule the three electrons go one into each.'
        write: '$2p_x^1\ 2p_y^1\ 2p_z^1$   ↑ ↑ ↑'
      - section: 'Check'
        say: 'Count them. Three single arrows in the two p orbitals, and nothing else single. That is also why nitrogen forms three bonds in ammonia, NH₃.'
        write: 'Three single electrons, three bonds in $\ce{NH3}$ ✓'
      - section: 'Answer'
        say: 'So nitrogen has three unpaired electrons, which is option A.'
        write: '$\therefore$ 3 unpaired electrons'
        answer: true
    traps:
      B: 'You went for two. Two unpaired electrons belong to carbon or oxygen. Nitrogen has three two p electrons, one in each orbital.'
      C: 'You went for one. That pairs two of the two p electrons in one orbital, which breaks Hund''s rule. They go in singly first.'
      D: 'You went for none. Only the one s and two s electrons are paired. The three two p electrons are all single.'

  8:
    moments:
      - section: 'The question'
        say: 'Helium, neon and argon hardly react with anything. What is the real reason?'
        write: 'Why are the noble gases stable?'
      - section: 'The fact'
        say: 'An atom is stable when its outermost shell is full. That is two electrons, a duplet, for the first shell, or eight, an octet, for the others.'
        write: 'Stable: duplet (2) or octet (8) in the outer shell'
      - section: 'The reason'
        say: 'Helium has a duplet. Neon, argon and the rest have an octet in their outermost shell.'
        write: 'He 2,  Ne 2,8,  Ar 2,8,8'
      - say: 'With a full shell they have nothing to gain, lose or share, so they hardly react.'
        write: 'Full shell, nothing to gain, lose or share'
      - say: 'Other atoms react so as to reach this same arrangement. For example, sodium loses one electron to look like neon, and chlorine gains one electron to look like argon.'
        write: 'Na loses 1 $e^-$ to look like Ne; Cl gains 1 $e^-$ to look like Ar'
      - section: 'Example'
        say: 'Argon is so unreactive that it fills electric bulbs, so the hot filament does not burn away.'
        write: 'Argon in electric bulbs, it will not react'
      - section: 'Answer'
        say: 'So their stability is due to the duplet or octet configuration, which is option B.'
        write: '$\therefore$ duplet or octet configuration'
        answer: true
    traps:
      A: 'You went for no outer electrons. Noble gases have full outer shells, not empty ones.'
      C: 'You went for group zero. That is where they sit in the table, which follows from their structure. It is not the reason they are stable.'
      D: 'You went for volatile. Volatility is a physical property and does not explain why they do not react.'

  9:
    moments:
      - section: 'The question'
        say: 'The shells around a nucleus have letters, K, L, M and N. How many electrons can the L shell hold at most?'
        write: 'Maximum electrons in the L shell $= ?$'
      - section: 'The rule'
        say: 'The maximum number of electrons in a shell is two n squared, where n is the shell number.'
        write: 'Maximum $= 2n^2$'
      - section: 'The working'
        say: 'K is the first shell, L the second, M the third and N the fourth. So for L, n is two.'
        write: 'K $n=1$, L $n=2$, M $n=3$, N $n=4$'
      - say: 'Put n equals two into the rule. Two squared is four, and two times four is eight.'
        write: '$2n^2 = 2 \times 2^2 = 2 \times 4 = 8$'
      - section: 'Check'
        say: 'Neon is two, eight. Its L shell is full with eight, and that is why it is a noble gas.'
        write: 'Ne: 2,8, L shell full with 8 ✓'
      - section: 'Answer'
        say: 'So the L shell holds at most eight electrons, which is option B.'
        write: '$\therefore$ L shell holds 8'
        answer: true
    traps:
      A: 'You went for two. That is the K shell, where n is one.'
      C: 'You went for eighteen. That is the M shell, where n is three. L is the second shell, so it holds eight.'
      D: 'You went for thirty-two. That is the N shell, where n is four.'

  10:
    moments:
      - section: 'The question'
        say: 'Sodium and chlorine sit in the same row of the periodic table. One is a soft metal and the other a poisonous gas. So what do they share?'
        write: 'Elements in the same period have the same $?$'
      - section: 'The fact'
        say: 'A period is a row. The period number tells you how many electron shells an atom has.'
        write: 'Period = row = number of shells'
      - section: 'Example'
        say: 'Sodium is two, eight, one and chlorine is two, eight, seven. Both use three shells, so both are in period three.'
        write: 'Na 2,8,1  and  Cl 2,8,7: three shells, period 3'
      - section: 'The other choices'
        say: 'Each element has its own atomic number, and properties change steadily from metal to non metal across a row.'
        write: 'Atomic number and properties change across a period'
      - say: 'A group is a column. Elements in a group share the same number of outer electrons, which is why they have similar chemical properties.'
        write: 'Group = column = outer electrons = similar chemistry'
      - section: 'Answer'
        say: 'So elements in the same period have the same number of shells, which is option A. Remember, rows are shells and columns are outer electrons.'
        write: '$\therefore$ same number of shells'
        answer: true
    traps:
      B: 'You went for atomic number. Every element has its own different atomic number, so no two share one.'
      C: 'You went for chemical properties. Elements in the same group, not the same period, have similar chemical properties.'
      D: 'You went for physical properties. Across a period they change from metal to non metal, so they are not the same.'

  11:
    moments:
      - section: 'The question'
        say: 'Deuterium and tritium go in, and helium and a neutron come out, with energy. Are small nuclei joining, or is a big one breaking up?'
        write: '$\ce{^{2}_{1}D + ^{3}_{1}T -> ^{4}_{2}He + ^{1}_{0}n}$ + energy'
      - section: 'The rule'
        say: 'Nuclear fusion is the joining of two light nuclei to form a heavier nucleus, with a large release of energy.'
        write: 'Fusion: light + light $\rightarrow$ heavier + energy'
      - say: 'Fission is the opposite. A heavy nucleus such as uranium two three five splits into smaller ones.'
        write: 'Fission: heavy $\rightarrow$ lighter + lighter + energy'
      - section: 'Check the balance'
        say: 'Mass numbers first. Two plus three is five, and four plus one is five. They balance.'
        write: 'Mass: $2 + 3 = 4 + 1 = 5$ ✓'
      - say: 'Atomic numbers next. One plus one is two, and two plus zero is two. They balance too.'
        write: 'Atomic: $1 + 1 = 2 + 0 = 2$ ✓'
      - section: 'Read it'
        say: 'Two isotopes of hydrogen, the lightest element, join into one helium nucleus. That is the reaction that powers the sun.'
        write: 'Two light nuclei $\rightarrow$ one heavier nucleus'
      - section: 'Answer'
        say: 'So the reaction illustrates nuclear fusion, which is option C.'
        write: '$\therefore$ nuclear fusion'
        answer: true
    traps:
      A: 'You went for alpha decay. In alpha decay one unstable nucleus gives out a helium nucleus on its own. Here two nuclei combine.'
      B: 'You went for artificial transmutation. That bombards a nucleus with a particle to make a new element. Here two light nuclei fuse and release energy.'
      D: 'You went for fission. Fission splits a heavy nucleus. Here two light nuclei join, which is fusion.'

  12:
    moments:
      - section: 'The question'
        say: 'A pilot is landing in thick fog. Which noble gas glows in the beacon that guides the plane in?'
        write: 'Noble gas in aerodrome beacons, good fog penetration $= ?$'
      - section: 'The fact'
        say: 'Neon glows a bright orange red when an electric discharge passes through it at low pressure.'
        write: 'Neon + electric discharge $\rightarrow$ orange-red glow'
      - section: 'The reason'
        say: 'Red light is scattered less by tiny water droplets than other colours, so the neon glow carries well through fog and mist.'
        write: 'Red light passes through fog best'
      - section: 'Uses'
        say: 'That is why neon is used in aerodrome beacons, which are airport lights, and in the glowing advertising signs on shops.'
        write: 'Neon: airport beacons, advertising signs'
      - section: 'The others'
        say: 'Argon fills electric bulbs, helium fills balloons, and krypton goes into some flash lamps.'
        write: 'Ar bulbs, He balloons, Kr flash lamps'
      - section: 'Answer'
        say: 'So the beacon gas is neon, which is option D. Remember, neon signs and neon beacons.'
        write: '$\therefore$ neon'
        answer: true
    traps:
      A: 'You went for krypton. Krypton is used in some photographic flash and bright lamps, but the classic fog piercing beacon gas is neon, with its red glow.'
      B: 'You went for argon. Argon is used to fill electric bulbs and to protect metals during welding.'
      C: 'You went for helium. Helium is light, so it fills balloons and airships, and it is used in diving gas.'

  13:
    moments:
      - section: 'The question'
        say: 'Your borehole water will not lather with soap, even after boiling. That is permanent hardness. What removes it?'
        write: 'Permanent hardness is removed by $?$'
      - section: 'The rule'
        say: 'Permanent hardness comes from dissolved calcium and magnesium sulphates and chlorides, such as CaSO₄ and MgSO₄.'
        write: 'Permanent hardness: $\ce{CaSO4}$, $\ce{MgSO4}$, $\ce{CaCl2}$, $\ce{MgCl2}$'
      - say: 'These salts do not break down on heating, so boiling cannot remove them. Boiling only removes temporary hardness, from the hydrogentrioxocarbonates.'
        write: 'Boiling removes only temporary hardness, $\ce{Ca(HCO3)2}$'
      - section: 'The equation'
        say: 'Caustic soda is sodium hydroxide. Its hydroxide ions turn the magnesium ions into a solid that settles out.'
        write: '$\ce{Mg^2+(aq) + 2OH-(aq) -> Mg(OH)2(s)}$'
      - say: 'Calcium is partly thrown out the same way, as calcium hydroxide. That is only sparingly soluble, so a little calcium stays behind, but the water is much softer and lathers again.'
        write: 'Hardness ions removed as solid, water softened'
      - section: 'Check'
        say: 'Washing soda does this job more completely, throwing calcium out as calcium trioxocarbonate four. Ion exchange also takes the calcium and magnesium ions out of solution.'
        write: 'Also: washing soda, ion exchange, distillation ✓'
      - section: 'Answer'
        say: 'So permanent hardness is removed by adding caustic soda, which is option C.'
        write: '$\therefore$ adding caustic soda'
        answer: true
    traps:
      A: 'You went for filtration. The hardness ions are dissolved in the water, so they pass straight through a filter.'
      B: 'You went for slaked lime. That is Clark''s method, and it removes temporary hardness only.'
      D: 'You went for boiling. Boiling removes only temporary hardness. The sulphates and chlorides of permanent hardness stay dissolved.'

  14:
    moments:
      - section: 'The question'
        say: 'A drying agent must pull water out of a gas or a liquid. Which word describes a substance that does that?'
        write: 'Drying agents are usually $?$'
      - section: 'The fact'
        say: 'A hygroscopic substance absorbs water vapour from the air without dissolving in it.'
        write: 'Hygroscopic: absorbs moisture from the air'
      - section: 'The reason'
        say: 'That is exactly the job of a drying agent. It takes water in and holds it.'
        write: 'Drying agent: takes water in'
      - section: 'Examples'
        say: 'Concentrated H₂SO₄, anhydrous calcium chloride and quicklime, CaO, are all used to dry gases.'
        write: 'conc. $\ce{H2SO4}$, anhydrous $\ce{CaCl2}$, $\ce{CaO}$'
      - section: 'The opposite'
        say: 'Efflorescent substances do the opposite. Washing soda crystals lose their water to the air and crumble into powder.'
        write: 'Efflorescent: gives water out to the air'
      - section: 'Answer'
        say: 'So drying agents are usually hygroscopic, which is option B. Hygro means moisture, so hygroscopic means moisture grabbing.'
        write: '$\therefore$ hygroscopic'
        answer: true
    traps:
      A: 'You went for amphoteric. That means reacting as both an acid and a base, like zinc oxide. It has nothing to do with drying.'
      C: 'You went for efflorescent. Efflorescent substances give water out to the air, the opposite of what a drying agent does.'
      D: 'You went for acidic. Many drying agents, such as quicklime, are basic, so being acidic is not what makes them dry.'

  15:
    moments:
      - section: 'The question'
        say: 'Forty grams of CuSO₄ dissolve in one hundred grams of water at sixty degrees Celsius. We want the solubility in moles per decimetre cubed. Watch the hundred grams.'
        write: '40 g $\ce{CuSO4}$ in 100 g water at 60 °C. Solubility in mol dm⁻³ $= ?$'
      - section: 'The rule'
        say: 'Solubility in moles per decimetre cubed is the number of moles of solute that saturate one thousand grams of water. One gram of water takes up about one centimetre cubed, so one thousand grams is about one decimetre cubed.'
        write: 'Solubility $=$ moles of solute per 1000 g (1 dm³) of water'
      - section: 'Molar mass'
        say: 'Copper is sixty-four, sulphur is thirty-two, and four oxygens are sixty-four. Together that is one hundred and sixty grams per mole.'
        write: '$\ce{CuSO4}$: $64 + 32 + 4 \times 16 = 160$ g mol⁻¹'
      - section: 'Scale up'
        say: 'Forty grams dissolve in one hundred grams of water. One thousand grams is ten times as much water, so ten times forty, which is four hundred grams, dissolve.'
        write: '40 g per 100 g $\rightarrow$ $40 \times 10 = 400$ g per 1000 g'
      - section: 'Grams to moles'
        say: 'Moles equal mass over molar mass. Four hundred grams over one hundred and sixty grams per mole is two point five moles.'
        write: 'Moles $= \dfrac{400\ \text{g}}{160\ \text{g mol}^{-1}} = 2.50$ mol'
      - say: 'Those two point five moles are in one decimetre cubed of water, so the solubility is two point five zero moles per decimetre cubed.'
        write: 'Solubility $= 2.50$ mol dm⁻³'
      - section: 'Check'
        say: 'Forty over one hundred and sixty is a quarter mole in the small amount of water. Ten times that is two point five. It agrees.'
        write: '$\dfrac{40}{160} = 0.25$, and $0.25 \times 10 = 2.50$ ✓'
      - section: 'Answer'
        say: 'So the solubility is two point five zero moles per decimetre cubed, which is option B.'
        write: '$\therefore$ solubility $= 2.50$ mol dm⁻³'
        answer: true
    traps:
      A: 'You went for four. That divides four hundred grams by one hundred instead of by the molar mass, one hundred and sixty.'
      C: 'You went for zero point four. That is forty over one hundred, a mass ratio, with no change to moles.'
      D: 'You went for zero point two five. That is the moles in one hundred grams of water. Scale up to one thousand grams by multiplying by ten.'

  16:
    moments:
      - section: 'The question'
        say: 'You spill coffee on your white school shirt. Which one lifts the stain, kerosene, turpentine, borax or ammonia?'
        write: 'Coffee stains are best removed by $?$'
      - section: 'The rule'
        say: 'Choose a stain remover by what the stain is made of. Grease needs a grease solvent, and a water based stain needs a water based remover.'
        write: 'Match the remover to the stain'
      - section: 'The reason'
