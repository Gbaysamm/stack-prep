  30:
    moments:
      - section: 'The question'
        say: 'Hydrogen burns in oxygen to give steam, and heat is given out. We warm the system up. Does the equilibrium constant rise, fall or stay?'
        write: '$\ce{2H2(g) + O2(g) <=> 2H2O(g)}$, $\Delta H$ negative. Temperature up, $K$ $?$'
      - section: 'The rule'
        say: 'Le Chatelier''s principle says that raising the temperature favours the endothermic direction, the one that takes heat in.'
        write: 'Heat up $\rightarrow$ favours the endothermic direction'
      - say: 'K, the equilibrium constant, changes only when the temperature changes. Pressure and concentration leave it alone.'
        write: '$K$ changes only with temperature'
      - section: 'Directions'
        say: 'Delta H is negative, so the forward reaction is exothermic. That makes the backward reaction endothermic.'
        write: 'Forward exothermic, backward endothermic'
      - section: 'The working'
        say: 'Raising the temperature pushes the equilibrium to the left. There is less steam and more hydrogen and oxygen.'
        write: 'Shifts left: less $\ce{H2O}$, more $\ce{H2}$ and $\ce{O2}$'
      - say: 'K is the steam concentration squared on top, over hydrogen squared times oxygen below.'
        write: '$K = \dfrac{[\ce{H2O}]^2}{[\ce{H2}]^2[\ce{O2}]}$'
      - say: 'The top gets smaller and the bottom gets bigger, so K gets smaller.'
        write: 'Top $\downarrow$, bottom $\uparrow$ $\Rightarrow K \downarrow$'
      - section: 'Check'
        say: 'For any exothermic forward reaction, heating lowers K. For an endothermic one, heating raises it.'
        write: 'Exothermic forward: higher $T$, smaller $K$ ✓'
      - section: 'Answer'
        say: 'So the equilibrium constant decreases, which is option C.'
        write: '$\therefore K$ decreases'
        answer: true
    traps:
      A: 'You went for unaffected. Pressure and concentration leave K unchanged, but temperature always changes it.'
      B: 'You went for zero. The equilibrium shifts left, but it does not vanish. K falls but never becomes zero.'
      D: 'You went for increases. K rises with temperature only when the forward reaction is endothermic. Here it is exothermic.'

