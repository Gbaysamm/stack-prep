        write: 'Faster rate is the result; lower barrier is the cause ✓'
      - section: 'Answer'
        say: 'So the catalyst acts by lowering the energy barrier of the reaction, which is option D.'
        write: '$\therefore$ lowers the energy barrier'
        answer: true
    traps:
      A: 'You went for lowering the pressure. A solid is heated in an open tube, and a catalyst does not change the pressure.'
      B: 'You went for surface area. Grinding a solid increases surface area. Manganese four oxide works by giving the reaction a new, lower energy path.'
      C: 'You went for increasing the rate. The rate does go up, but that is the result. The catalyst acts by lowering the energy barrier.'

