      - section: 'The equation'
        say: 'For ethene, bromine adds across the double bond to give one two dibromoethane, which is colourless.'
        write: '$\ce{CH2=CH2 + Br2 -> CH2BrCH2Br}$'
      - section: 'Sort them'
        say: 'Alkenes, cycloalkenes and alkynes all have a double or triple bond. They decolourise bromine water, so X is one of them.'
        write: 'Alkenes, cycloalkenes, alkynes: unsaturated, X'
      - say: 'Alkanes are saturated, with only single bonds. Nothing can add on, so the colour stays. Y is an alkane.'
        write: 'Alkanes: single bonds only, Y'
      - section: 'Check'
        say: 'A ring does not save a cycloalkene. Its double bond still takes up bromine.'
        write: 'Cycloalkene still has C=C ✓'
      - section: 'Answer'
        say: 'So Y belongs to the alkanes, which is option D.'
        write: '$\therefore$ Y is an alkane'
        answer: true
