        write: '$\ce{2KClO3 ->[MnO2][heat] 2KCl + 3O2}$'
      - section: 'The rule'
        say: 'A catalyst provides another route for the reaction, with a lower activation energy. Activation energy is the energy barrier the particles must climb.'
        write: 'Catalyst: new route, lower activation energy $E_a$'
      - section: 'The reasoning'
        say: 'With a lower barrier, more particles have enough energy to react at a lower temperature. So moderate heat is enough.'
        write: 'Lower $E_a$ $\rightarrow$ more particles react at lower temperature'
      - say: 'At the end, the manganese four oxide is unchanged in mass and composition. It is not used up.'
        write: '$\ce{MnO2}$ unchanged at the end'
      - section: 'Check'
