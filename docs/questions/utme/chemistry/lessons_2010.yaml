        write: '4 hydrogens, 4 steps, $\ce{CCl4}$ ✓'
      - section: 'Answer'
        say: 'So the final product with HCl is tetrachloromethane, which is option C.'
        write: '$\therefore$ tetrachloromethane, $\ce{CCl4}$'
        answer: true
