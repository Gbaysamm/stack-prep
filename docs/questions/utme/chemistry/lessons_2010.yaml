  19:
    moments:
      - section: 'The question'
        say: 'Twenty-five centimetres cubed of zero point one molar sodium hydroxide is neutralised by zero point five molar H₂SO₄. How much acid? The trap is in the equation.'
        write: '$\ce{NaOH}$: 25 cm³, 0.1 mol dm⁻³.  $\ce{H2SO4}$: 0.5 mol dm⁻³, $V = ?$'
      - section: 'The rule'
        say: 'Moles equal concentration times volume, with the volume in decimetres cubed. The balanced equation gives the mole ratio.'
        write: '$n = C \times V$'
      - section: 'The equation'
        say: 'H₂SO₄ has two hydrogens to give, so one mole of acid needs two moles of sodium hydroxide.'
        write: '$\ce{H2SO4 + 2NaOH -> Na2SO4 + 2H2O}$'
      - section: 'Units'
        say: 'Change twenty-five centimetres cubed to decimetres cubed by dividing by one thousand.'
        write: '25 cm³ $= \dfrac{25}{1000}$ dm³ $= 0.025$ dm³'
      - section: 'The working'
        say: 'Moles of sodium hydroxide are zero point one times zero point zero two five, which is zero point zero zero two five moles.'
        write: '$n(\ce{NaOH}) = 0.1 \times 0.025 = 0.0025$ mol'
      - say: 'The acid is half that, because of the one to two ratio. That is zero point zero zero one two five moles.'
        write: '$n(\ce{H2SO4}) = \dfrac{0.0025}{2} = 0.00125$ mol'
      - say: 'Volume equals moles over concentration. Zero point zero zero one two five over zero point five is zero point zero zero two five decimetres cubed.'
        write: '$V = \dfrac{0.00125}{0.5} = 0.0025$ dm³'
      - say: 'Multiply by one thousand to get back to centimetres cubed. That is two point five centimetres cubed.'
        write: '$0.0025 \times 1000 = 2.5$ cm³'
      - section: 'Check'
        say: 'The acid is five times stronger and gives two hydrogens, so it is ten times as strong in hydrogen ions. A tenth of twenty-five is two point five. It agrees.'
        write: '$25 \div 10 = 2.5$ cm³ ✓'
      - section: 'Answer'
        say: 'So the volume of acid is two point five centimetres cubed, which is option B.'
        write: '$\therefore V(\ce{H2SO4}) = 2.5$ cm³'
        answer: true
    traps:
      A: 'You went for five centimetres cubed. That uses a one to one ratio. One H₂SO₄ neutralises two sodium hydroxide, so the acid volume is halved to two point five.'
      C: 'You went for zero point four. That mixes up the concentrations and volumes. Work through the moles of alkali, then halve for the acid.'
      D: 'You went for zero point one. That divides numbers without going through moles. Find the moles of alkali first, then use the one to two ratio.'

