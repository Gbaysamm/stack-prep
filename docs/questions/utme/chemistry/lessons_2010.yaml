  22:
    moments:
      - section: 'The question'
        say: 'Silver nitrate, phosphine and water react. Which one is the reducing agent? Two of them change, so we must follow the oxidation numbers.'
        write: '$\ce{6AgNO3 + PH3 + 3H2O -> 6Ag + H3PO3 + 6HNO3}$'
      - section: 'The rule'
        say: 'The reducing agent is the species that is oxidised. It loses electrons, so its oxidation number goes up.'
        write: 'Reducing agent: oxidised, oxidation number rises'
      - section: 'Silver'
        say: 'Silver is plus one in AgNO₃ and zero in silver metal. It gains an electron, so silver nitrate is reduced.'
        write: '$\ce{Ag}$: $+1 \rightarrow 0$, reduced, so $\ce{AgNO3}$ is the oxidising agent'
      - section: 'Phosphorus'
        say: 'In PH₃, each hydrogen is plus one. P plus three equals zero, so phosphorus is minus three.'
        write: '$\ce{PH3}$: $x + 3(+1) = 0 \Rightarrow x = -3$'
      - say: 'In H₃PO₃, three hydrogens give plus three. Each oxygen is minus two, so three oxygens give minus six. The total must be zero, so phosphorus is plus three.'
        write: '$\ce{H3PO3}$: $3(+1) + x + 3(-2) = 0 \Rightarrow x = +3$'
      - say: 'Phosphorus goes from minus three to plus three, a rise of six. So PH₃ is oxidised.'
        write: '$\ce{P}$: $-3 \rightarrow +3$, rises by 6, oxidised'
      - section: 'Check'
        say: 'Six silver ions each gain one electron, which is six electrons. One phosphorus loses six. The electrons balance.'
        write: 'Gained $6 \times 1 = 6$, lost $6$ ✓'
      - section: 'Answer'
        say: 'So the reducing agent is PH₃, which is option C.'
        write: '$\therefore$ reducing agent $= \ce{PH3(g)}$'
        answer: true
    traps:
      A: 'You went for HNO₃. It is a product, and nitrogen stays at plus five all through, so it is not oxidised.'
      B: 'You went for water. Hydrogen stays plus one and oxygen stays minus two, so water is neither oxidised nor reduced.'
      D: 'You went for AgNO₃. Silver does change, but it goes from plus one to zero. It is reduced, so silver nitrate is the oxidising agent.'

