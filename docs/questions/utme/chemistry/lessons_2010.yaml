        write: 'Longest chain, then lowest numbers for branches'
      - section: 'The three arms'
        say: 'The CH carbon has three arms. CH₃ with CH₂ three times has four carbons, a butyl arm. The C₂H₅ arm, ethyl, has two carbons, and the C₃H₇ arm, propyl, has three.'
        write: 'Butyl arm 4 C,  ethyl arm 2 C,  propyl arm 3 C'
      - section: 'Longest chain'
        say: 'Go through the butyl arm and the propyl arm. Four, plus the CH carbon, plus three, makes eight carbons. That is octane.'
        write: '$4 + 1 + 3 = 8$ carbons $\rightarrow$ octane'
      - say: 'Written out straight, the chain looks like this, with the ethyl group hanging from one carbon.'
        write: '$\ce{CH3CH2CH2CH2-CH(C2H5)-CH2CH2CH3}$'
      - section: 'Number it'
        say: 'From the propyl end, the branched carbon is carbon four. From the butyl end, it is carbon five. The lower number wins.'
        write: 'From propyl end: C4;  from butyl end: C5;  use 4'
      - section: 'Check'
        say: 'Try the chain through the ethyl arm instead. Four plus one plus two is only seven, so it is not the longest.'
        write: 'Through ethyl: $4 + 1 + 2 = 7 < 8$ ✓'
      - section: 'Answer'
        say: 'So the name is four ethyloctane, which is option A.'
        write: '$\therefore$ 4-ethyloctane'
        answer: true
    traps:
      B: 'You went for five ethyloctane. The chain is right, but it is numbered from the wrong end. Four is lower than five.'
      C: 'You went for five propylheptane. That uses a seven carbon chain. The longest chain has eight carbons.'
      D: 'You went for three propylheptane. That runs the chain through the ethyl group and stops at seven carbons. The path through the propyl arm gives eight.'

