      A: 'You went for three. One of your three drawings must be butane again. Moving the branch to the end just gives the straight chain.'
      B: 'You went for four. Only two different skeletons are possible with four carbons.'
      C: 'You went for one. That forgets the branched isomer, two methylpropane.'
  46:
    moments:
      - section: 'The question'
        say: 'On the chain, the second carbon carries an OH, and the fourth carbon carries two chlorine atoms. Let us name what we see.'
        write: '4-carbon chain: $\ce{-OH}$ on C2, two $\ce{Cl}$ on C4. Functional groups = ?'
