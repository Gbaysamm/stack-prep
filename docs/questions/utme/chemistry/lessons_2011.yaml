        write: '$\ce{CH3COOH + C2H5OH ->[conc. H2SO4] CH3COOC2H5 + H2O}$'
      - section: 'The rule'
        say: 'An alkanoic acid reacts with an alkanol to form an ester and water. That reaction is called esterification.'
        write: 'Alkanoic acid + alkanol $\rightarrow$ ester + water'
      - section: 'Name the product'
        say: 'The product is ethyl ethanoate. The ethyl part comes from ethanol and the ethanoate part comes from ethanoic acid.'
        write: '$\ce{CH3COOC2H5}$ = ethyl ethanoate, an ester'
      - section: 'The acid'
        say: 'Concentrated H₂SO₄ is the catalyst, and it also takes up the water formed.'
        write: 'conc. $\ce{H2SO4}$: catalyst, removes water'
      - section: 'Check'
        say: 'Water is lost when the two join, so it is a kind of condensation. But the exact name for making an ester is esterification.'
        write: 'Check: ester formed $\Rightarrow$ esterification ✓'
      - section: 'Remember it'
        say: 'Esters give many fruits and perfumes their sweet smell. Acid plus alcohol makes an ester.'
        write: 'Acid + alcohol $\rightarrow$ ester (fruity smell)'
      - section: 'Answer'
        say: 'So the reaction is best described as esterification, which is option A.'
        write: '$\therefore$ esterification'
        answer: true
