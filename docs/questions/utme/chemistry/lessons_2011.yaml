      - section: 'Answer'
        say: 'So dried oxygen is collected over mercury, which is option B.'
        write: '$\therefore$ mercury'
        answer: true
    traps:
      A: 'You went for hydrochloric acid. It is mostly water, so it would make the oxygen wet again.'
      C: 'You went for calcium chloride. It is a solid drying agent. It dries the gas but is not a liquid to collect it over.'
