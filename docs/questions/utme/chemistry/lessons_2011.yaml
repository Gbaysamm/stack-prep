        say: 'Yeast plus sugar gives ethanol plus carbon four oxide. The bubbles you see in fresh palm wine are the carbon four oxide.'
        write: 'Sugar + yeast $\rightarrow$ ethanol + $\ce{CO2}$'
      - section: 'Answer'
        say: 'So the reaction is used in the production of ethanol, which is option D.'
        write: '$\therefore$ ethanol'
        answer: true
    traps:
      A: 'You went for propanol. Propanol has three carbons, and the product here has two.'
      B: 'You went for butanol. Butanol has four carbons, and the product here has two.'
      C: 'You went for methanol. Methanol has only one carbon. The product here, C₂H₅OH, has two.'
  45:
    moments:
      - section: 'The question'
        say: 'C₄H₁₀ has four carbons and ten hydrogens. How many different molecules can we build from them? Most students guess too many.'
