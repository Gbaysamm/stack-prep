        say: 'Concentrated H₂SO₄ boils at about three hundred and thirty-eight degrees Celsius. HNO₃ boils at about eighty-three degrees.'
        write: '$\ce{H2SO4}$ $\approx$ 338 °C;  $\ce{HNO3}$ $\approx$ 83 °C'
      - say: 'So on heating, the nitric acid boils off and is collected, while the H₂SO₄ stays behind in the flask.'
        write: '$\ce{HNO3}$ distils off;  $\ce{H2SO4}$ stays behind'
      - section: 'Check'
        say: 'No element changes its oxidation number in this equation, so H₂SO₄ is not acting as an oxidising agent here.'
        write: 'Check: no change of oxidation number, not redox ✓'
      - section: 'Answer'
        say: 'So the property that matters is its high boiling point, which is option A.'
        write: '$\therefore$ high boiling point'
        answer: true
    traps:
      B: 'You went for density. Density has nothing to do with driving the nitric acid out of the flask.'
