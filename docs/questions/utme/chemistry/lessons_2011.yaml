  38:
    moments:
      - section: 'The question'
        say: 'Your mother mixes baking powder into the dough for chin chin or cake, and in the oven it puffs up. Which compound in the powder does that?'
        write: 'The constituent of baking powder that makes dough rise = ?'
      - section: 'The fact'
        say: 'Baking powder contains sodium hydrogen trioxocarbonate four, NaHCO₃, mixed with a weak acid.'
        write: 'Baking powder: $\ce{NaHCO3}$ + a weak acid'
      - section: 'The equation'
        say: 'When it is heated, NaHCO₃ breaks down and gives off carbon four oxide.'
        write: '$\ce{2NaHCO3 ->[heat] Na2CO3 + H2O + CO2}$'
      - say: 'When it is wetted, the weak acid also reacts with it and gives off more carbon four oxide.'
        write: '$\ce{HCO3^- + H+ -> H2O + CO2}$'
      - section: 'Why the dough rises'
        say: 'The bubbles of carbon four oxide are trapped inside the soft dough, and they make it swell and rise.'
        write: '$\ce{CO2}$ bubbles trapped $\rightarrow$ dough rises'
      - section: 'Check'
        say: 'Na₂CO₃ does not break down at oven temperatures, so it could not give the gas.'
        write: 'Check: $\ce{Na2CO3}$ stable in the oven ✓'
      - section: 'Answer'
        say: 'So the constituent that makes the dough rise is NaHCO₃, which is option A.'
        write: '$\therefore$ $\ce{NaHCO3}$'
        answer: true
    traps:
      B: 'You went for NaOH. Sodium hydroxide is caustic and gives off no gas. It would never go into food.'
      C: 'You went for Na₂CO₃. It does not break down in the oven, so it gives no carbon four oxide.'
      D: 'You went for NaCl. Common salt only adds taste. It gives off no gas.'
  39:
    moments:
      - section: 'The question'
        say: 'Think of the gas cylinder in your kitchen. Four structures are on the board, and only one is the main fuel inside that cylinder.'
        write: 'Which compound is used as a gaseous fuel in cooking gas?'
      - section: 'The fact'
        say: 'Cooking gas is liquefied petroleum gas, L P G. It is mainly butane, with some propane.'
        write: 'Cooking gas (LPG) = mainly butane'
      - section: 'Find butane'
        say: 'Butane is four carbons in a straight chain, all joined by single bonds.'
        write: 'Butane: $\ce{CH3-CH2-CH2-CH3}$, $\ce{C4H10}$'
      - section: 'Why butane'
        say: 'Butane is a gas at room temperature, but a little pressure turns it into a liquid. So a lot of it fits in one cylinder.'
        write: 'Gas at room temperature, liquefies under pressure'
      - section: 'It burns cleanly'
        say: 'With enough air it burns with a clean blue flame to carbon four oxide and water.'
        write: '$\ce{2C4H10 + 13O2 -> 8CO2 + 10H2O}$'
      - section: 'The others'
        say: 'The others are not in cooking gas. One is propyne, one is propan two ol, a liquid alcohol, and one is butanoic acid, a liquid acid.'
        write: 'A propyne;  B propan-2-ol (liquid);  C butanoic acid (liquid)'
      - section: 'Answer'
        say: 'So the fuel in cooking gas is butane, which is option D.'
        write: '$\therefore$ $\ce{CH3-CH2-CH2-CH3}$, butane'
        answer: true
    traps:
      A: 'You went for propyne. It is a gas, but it is not part of cooking gas. Cooking gas is mainly butane.'
      B: 'You went for propan two ol. It is a liquid alcohol, not a gaseous fuel.'
      C: 'You went for butanoic acid. It is a liquid acid with a bad smell, and it is not burned as a fuel gas.'
  40:
    moments:
      - section: 'The question'
        say: 'There are millions of carbon compounds, far more than for any other element. The reason is one special ability of carbon. What is it called?'
        write: 'The ability of carbon to form long chains is called ...'
      - section: 'The fact'
        say: 'Catenation is the ability of atoms of an element to join to one another to form long chains and rings.'
        write: 'Catenation = atoms of one element joining into chains and rings'
      - section: 'The reason'
        say: 'Carbon is very good at it, because the bond between two carbon atoms is strong.'
        write: '$\ce{C-C}$ bond is strong'
