        write: 'Alkanes: $\ce{C_nH_{2n+2}}$'
      - say: 'With n equal to four, two n plus two is ten. Both fit, so both are alkanes, in the same homologous series.'
        write: '$n = 4$: $2(4) + 2 = 10$ ✓ both alkanes'
      - section: 'Test the others'
