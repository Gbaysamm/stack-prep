# UTME 2011 Chemistry, lessons for the board.
#
# Each lesson is a run of MOMENTS, taught the way a good chemistry teacher works on the board:
# the question, the rule in words and then written, the balanced equation, the working with units
# one step per moment, the check, and the answer. Keyed on question number, like
# explanations_2011.yaml. Answers match that file.
#
#   say:    what the teacher says, heard and not read. Formulas written as formulas (the voice reads them letter by letter), units in words.
#   write:  the one line written while it is said, with mhchem for formulae.
#   answer: true on the moment that gives the answer.
#   traps:  said to a student who chose that wrong option, kindly.
format_version: 1
exam_year: 2011
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'Two grams of NaOH are dissolved to make one hundred centimetres cubed of solution. Many students stop at the moles, so today we go all the way to the concentration.'
        write: 'Mass of $\ce{NaOH}$ = 2 g, volume = 100 cm³, concentration = ?  [Na = 23, O = 16, H = 1]'
      - section: 'The rule'
        say: 'Concentration in mol per decimetre cubed is the number of moles divided by the volume in decimetres cubed.'
        write: 'Concentration $= \dfrac{\text{moles}}{\text{volume in dm}^3}$'
      - say: 'And the number of moles is the mass divided by the molar mass.'
        write: 'Moles $= \dfrac{\text{mass}}{\text{molar mass}}$'
      - section: 'The molar mass'
        say: 'Add up the atoms in NaOH. Twenty-three plus sixteen plus one gives forty grams per mole.'
        write: '$M(\ce{NaOH}) = 23 + 16 + 1 = 40$ g mol⁻¹'
      - section: 'The moles'
        say: 'Two grams divided by forty grams per mole gives zero point zero five mole.'
        write: 'Moles $= \dfrac{2}{40} = 0.05$ mol'
      - section: 'Change the volume'
        say: 'One decimetre cubed is one thousand centimetres cubed. So one hundred centimetres cubed is zero point one decimetre cubed.'
        write: '100 cm³ $= \dfrac{100}{1000} = 0.1$ dm³'
      - section: 'The concentration'
        say: 'Now divide the moles by the volume. Zero point zero five divided by zero point one is zero point five.'
        write: 'Concentration $= \dfrac{0.05}{0.1} = 0.50$ mol dm⁻³'
      - section: 'Check'
        say: 'Check it another way. A full decimetre cubed of this solution would hold ten times as much, which is twenty grams, and twenty over forty is half a mole. It agrees.'
        write: 'Check: 20 g in 1 dm³ $= \dfrac{20}{40} = 0.5$ mol ✓'
      - section: 'Answer'
        say: 'So the concentration is zero point five zero mol per decimetre cubed, which is option B.'
        write: '$\therefore$ concentration $= 0.50$ mol dm⁻³'
        answer: true
    traps:
      A: 'You went for zero point four zero. That comes from a wrong molar mass. NaOH is forty grams per mole, so two grams is zero point zero five mole, and in zero point one decimetre cubed that is zero point five zero.'
      C: 'You went for zero point zero five. That is the number of moles, not the concentration. You still have to divide by the volume, which is zero point one decimetre cubed.'
      D: 'You went for zero point three zero. No correct use of the mass and the volume gives this. Find the moles, change the volume to decimetres cubed, then divide.'
  3:
    moments:
      - section: 'The question'
        say: 'Three of these statements about solid, liquid and gas are true, and one has its direction backwards. We are hunting for the one that is not correct.'
        write: 'Which statement about the states of matter is NOT correct?'
      - section: 'The rule'
        say: 'The kinetic theory says gas particles have the most energy and move about freely. Solid particles have the least energy and only vibrate in fixed places.'
        write: 'Kinetic theory: solid $\rightarrow$ liquid $\rightarrow$ gas'
      - say: 'So going from solid to liquid to gas, the kinetic energy and the random motion go up, and the order goes down.'
        write: 'Solid $\rightarrow$ gas: kinetic energy ↑, random motion ↑, order ↓'
      - say: 'Going the other way, from gas to liquid to solid, the order goes up and the random motion goes down.'
        write: 'Gas $\rightarrow$ solid: order ↑, random motion ↓'
      - section: 'Test each statement'
        say: 'Statement A says kinetic energy increases from solid to gas. That is true. Statement B says random motion increases from liquid to gas. That is also true.'
        write: 'A ✓   B ✓'
      - say: 'Statement C says orderliness increases from gas to liquid. A liquid is more ordered than a gas, so that is true too.'
        write: 'C ✓'
      - say: 'Statement D says random motion increases from gas to solid. That is backwards, because solid particles only vibrate in place.'
        write: 'D ✗  random motion decreases from gas to solid'
      - section: 'Remember it'
        say: 'Think of ice in a cup of zobo. The ice keeps its shape, the water flows, and the steam from the pot spreads all over the kitchen.'
        write: 'Ice (fixed) $\rightarrow$ water (flows) $\rightarrow$ steam (spreads)'
      - section: 'Answer'
        say: 'So the statement that is not correct is option D.'
        write: '$\therefore$ D is NOT correct'
        answer: true
    traps:
      A: 'You went for A, but that statement is true. Gas particles move faster and have more kinetic energy than solid particles.'
      B: 'You went for B, but that statement is true. Gas particles move more randomly than liquid particles.'
      C: 'You went for C, but that statement is true. A liquid is more ordered than a gas, so order does increase from gas to liquid.'
  4:
    moments:
      - section: 'The question'
        say: 'Pour a coloured mixture into a column and watch. The colours split into bands as the solvent runs down. Why do they separate?'
        write: 'Column chromatography works because the constituents ...'
      - section: 'The rule'
        say: 'Chromatography separates a mixture by how strongly each part is held by the solid in the column, compared with how well it dissolves in the moving solvent.'
        write: 'Stationary phase holds, mobile phase (solvent) carries'
      - say: 'The solvent carries every constituent down the column, but each one at its own speed.'
        write: 'Each constituent moves at its own speed'
      - say: 'A part that is held weakly moves fast. A part that is held strongly moves slowly. So they come out as separate bands.'
        write: 'Held weakly $\rightarrow$ fast,  held strongly $\rightarrow$ slow'
      - section: 'A real example'
        say: 'You have seen this with a drop of ink on wet filter paper. The ink spreads into rings of different colours, because each dye travels at a different speed.'
        write: 'Ink on wet paper $\rightarrow$ coloured rings'
      - section: 'Check'
        say: 'Nothing new is made in the column. It is a physical separation, so no reaction is involved.'
        write: 'Physical separation, no reaction'
      - section: 'Answer'
        say: 'So the principle is that the constituents move at different speeds in the column, which is option A.'
        write: '$\therefore$ the constituents move at different speeds'
        answer: true
    traps:
      B: 'You went for dissolving in each other. The parts do not need to mix with each other. The point is that they separate.'
      C: 'You went for reacting with the solvent. Chromatography is a physical separation, so nothing reacts with the solvent.'
      D: 'You went for reacting with each other. If they reacted, we would get new substances, not a separation.'
  5:
    moments:
      - section: 'The question'
        say: 'We have four gases, K, L, M and N, and a graph of P V against P. One line belongs to an ideal gas. Let us find it from Boyle''s law.'
        write: 'Graph of $PV$ against $P$ at constant temperature. Which line is an ideal gas?'
      - section: 'The rule'
        say: 'Boyle''s law says that for a fixed mass of an ideal gas at constant temperature, P times V stays constant.'
        write: 'Boyle''s law: $PV = \text{constant}$ (constant temperature)'
      - section: 'What the graph must look like'
        say: 'If P V never changes, then however big P gets, P V stays at the same height on the graph.'
        write: 'As $P$ increases, $PV$ stays the same'
      - say: 'A quantity that stays the same gives a flat line. So an ideal gas gives a straight horizontal line.'
        write: 'Ideal gas $\rightarrow$ horizontal straight line'
      - section: 'Read the graph'
        say: 'K and L rise as P increases, and M dips and then rises. Only N stays flat.'
        write: 'K, L rise;  M dips then rises;  N flat'
      - section: 'Check'
        say: 'Why do the others bend? Real gases have forces between their molecules, and the molecules take up space of their own, so P V changes with pressure.'
        write: 'Real gases: attractions and molecular volume $\Rightarrow PV$ changes'
      - section: 'Answer'
        say: 'So the ideal gas is N, which is option B.'
        write: '$\therefore$ ideal gas $=$ N'
        answer: true
    traps:
      A: 'You went for M. That line dips and then rises, which is a real gas whose molecules attract each other at first.'
      C: 'You went for K. That line curves upwards, so P V changes with pressure. It is a real gas.'
      D: 'You went for L. It is a straight line, but it slopes upwards, so P V still changes. For an ideal gas the line must be flat.'
  6:
    moments:
      - section: 'The question'
        say: 'Four statements about the periodic table, and students often mix up group and period. Let us sort them out first.'
        write: 'Which statement about the periodic table is correct?'
      - section: 'The rule'
        say: 'Across a period, each element has one more proton and one more electron than the one before it.'
        write: 'Across a period: $+1$ proton, $+1$ electron each step'
      - say: 'The extra electron goes into the same outer shell. So the valence electrons rise from one to eight across the period.'
        write: 'Valence electrons: 1, 2, 3, ... 8 across the period'
      - section: 'Group and period'
        say: 'Here is how to remember it. The group number tells you the valence electrons, and the period number tells you the shells.'
        write: 'Group number = valence electrons;  period number = shells'
      - say: 'So elements in the same group share the same number of valence electrons, and elements in the same period share the same number of shells.'
        write: 'Same group $\rightarrow$ same valence electrons;  same period $\rightarrow$ same shells'
      - section: 'Non-metallic character'
        say: 'Across period three we go from sodium, a metal, to chlorine, a non-metal. So non-metallic character increases across a period.'
        write: 'Na (metal) $\rightarrow$ ... $\rightarrow$ Cl (non-metal)'
      - section: 'Answer'
        say: 'So the correct statement is that valence electrons increase progressively across the period, which is option B.'
        write: '$\therefore$ valence electrons increase across a period'
        answer: true
    traps:
      A: 'You went for A. Non-metallic properties increase across a period, from sodium the metal to chlorine the non-metal. They do not decrease.'
      C: 'You went for C. That swaps group and period. It is elements in the same period that have the same number of shells.'
      D: 'You went for D. That swaps them the other way. It is elements in the same group that have the same number of valence electrons.'
  7:
    moments:
      - section: 'The question'
        say: 'Lithium is ninety percent lithium seven and ten percent lithium six. The average must sit somewhere between six and seven. But where exactly?'
        write: '90% $\ce{^{7}_{3}Li}$, 10% $\ce{^{6}_{3}Li}$, relative atomic mass = ?'
      - section: 'The rule'
        say: 'The relative atomic mass is the sum of each mass number times its fraction.'
        write: '$A_r = \sum (\text{mass number} \times \text{fraction})$'
      - section: 'The fractions'
        say: 'Ninety percent is zero point nine, and ten percent is zero point one.'
        write: '90% $= 0.9$,  10% $= 0.1$'
      - section: 'The working'
        say: 'Seven times zero point nine is six point three.'
        write: '$7 \times 0.9 = 6.3$'
      - say: 'Six times zero point one is zero point six.'
        write: '$6 \times 0.1 = 0.6$'
      - say: 'Add them. Six point three plus zero point six is six point nine.'
        write: '$A_r = 6.3 + 0.6 = 6.9$'
      - section: 'Check'
        say: 'The answer lies between six and seven, and close to seven, because most of the atoms are lithium seven. Six point nine fits.'
        write: 'Check: $6 < 6.9 < 7$, close to 7 ✓'
      - section: 'Answer'
        say: 'So the relative atomic mass of lithium is six point nine, which is option A.'
        write: '$\therefore A_r(\ce{Li}) = 6.9$'
        answer: true
    traps:
      B: 'You went for seven point one. An average of six and seven can never be bigger than seven, the heaviest isotope.'
      C: 'You went for six point two. That is too close to six, as if most atoms were lithium six. Ninety percent are lithium seven.'
      D: 'You went for six point eight. That is a slip in the adding. Six point three plus zero point six is six point nine.'
  8:
    moments:
      - section: 'The question'
        say: 'We have an atom with atomic number fifteen and mass number thirty-one. Two numbers are given, and only one of them counts the protons. Which one?'
        write: 'Atomic number = 15, mass number = 31, protons = ?'
      - section: 'The rule'
        say: 'The atomic number is the number of protons in the nucleus.'
        write: 'Atomic number $Z$ = number of protons'
      - say: 'The mass number is the protons plus the neutrons together.'
        write: 'Mass number $A$ = protons + neutrons'
      - section: 'The working'
        say: 'The atomic number is fifteen, so there are fifteen protons.'
        write: 'Protons $= Z = 15$'
      - say: 'For completeness, the neutrons are thirty-one minus fifteen, which is sixteen.'
        write: 'Neutrons $= 31 - 15 = 16$'
      - section: 'Check'
        say: 'Fifteen protons plus sixteen neutrons gives thirty-one, the mass number. This atom is phosphorus.'
        write: 'Check: $15 + 16 = 31$ ✓  ($\ce{^{31}_{15}P}$)'
      - section: 'Answer'
        say: 'So the atom contains fifteen protons, which is option B.'
        write: '$\therefore$ protons $= 15$'
        answer: true
    traps:
      A: 'You went for sixteen. That is the number of neutrons, thirty-one minus fifteen, not the protons.'
      C: 'You went for forty-six. That adds the atomic number to the mass number, which has no meaning.'
      D: 'You went for thirty-one. That is the mass number, the protons and neutrons together.'
  9:
    moments:
      - section: 'The question'
        say: 'Iodine crystals are soft, and when you warm them they turn straight into a purple vapour. That tells us the forces holding the crystal are weak. Which forces?'
        write: 'The molecular lattice of iodine is held together by ...'
      - section: 'Inside the molecule'
        say: 'Iodine is made of I₂ molecules. Inside each molecule, the two atoms share a pair of electrons in a strong covalent bond.'
        write: '$\ce{I-I}$  covalent bond inside each molecule'
      - section: 'Between the molecules'
        say: 'Between one molecule and the next, there are only weak van der Waals forces.'
        write: '$\ce{I2}$ ··· $\ce{I2}$  weak van der Waals forces between molecules'
      - section: 'The rule'
        say: 'In a molecular crystal, the lattice is held by the forces between the molecules, not by the bonds inside them.'
        write: 'Molecular lattice = molecules held by van der Waals forces'
      - section: 'Check'
        say: 'Weak forces explain what we see. Iodine is soft and sublimes easily on gentle warming.'
        write: 'Weak forces $\Rightarrow$ soft, sublimes ✓'
      - section: 'Answer'
        say: 'So the molecular lattice of iodine is held together by van der Waals forces, which is option D.'
        write: '$\therefore$ van der Waals forces'
        answer: true
    traps:
      A: 'You went for dative bond. A dative bond is a covalent bond inside a molecule or ion, not a force between molecules.'
      B: 'You went for metallic bond. Metallic bonding is found in metals, and iodine is a non-metal.'
      C: 'You went for hydrogen bond. A hydrogen bond needs hydrogen joined to nitrogen, oxygen or fluorine, and iodine has no hydrogen at all.'
  10:
    moments:
      - section: 'The question'
        say: 'Particles in a crystal are far too small to see, even with a microscope. So how do scientists find out how they are arranged?'
        write: 'The arrangement of particles in crystal lattices is studied using ...'
      - section: 'The size'
        say: 'The particles in a crystal are about zero point one nanometre apart.'
        write: 'Gap between particles $\approx 0.1$ nm'
      - section: 'The rule'
        say: 'A wave is diffracted, or spread out, by gaps of about the same size as its wavelength.'
        write: 'Diffraction needs wavelength $\approx$ gap size'
      - say: 'X-rays have wavelengths of about that size, so a crystal diffracts them.'
        write: 'X-rays: wavelength $\approx 0.1$ nm'
      - say: 'The diffraction pattern on the film shows how the particles are arranged. This is called X-ray diffraction.'
        write: 'X-ray diffraction $\rightarrow$ pattern $\rightarrow$ crystal structure'
      - section: 'Check'
        say: 'The other rays have other jobs. Gamma rays are used to treat cancer and sterilise equipment, and alpha and beta are particles from radioactive atoms.'
        write: 'γ: radiotherapy;  α, β: particles from radioactivity'
      - section: 'Answer'
        say: 'So crystal lattices are studied using X-rays, which is option A.'
        write: '$\therefore$ X-rays'
        answer: true
    traps:
      B: 'You went for gamma rays. They are waves too, but they are used for radiotherapy and sterilising, not for studying crystals.'
      C: 'You went for alpha rays. Alpha particles are helium nuclei and are stopped by a sheet of paper. They are not used for crystal structure.'
      D: 'You went for beta rays. Beta particles are fast electrons, and they are not the method used to study crystal lattices.'
  11:
    moments:
      - section: 'The question'
        say: 'A saturated solution is cooled from fifty-five to forty degrees Celsius, so some solute must come out of solution. How much comes out of two hundred centimetres cubed?'
        write: '200 cm³ saturated solution cooled from 55 °C to 40 °C, solute deposited = ?'
      - section: 'The rule'
        say: 'A cold solution holds less solute. The amount deposited is the solubility at the higher temperature minus the solubility at the lower temperature, scaled to the volume used.'
        write: 'Deposited = (solubility at 55 °C $-$ solubility at 40 °C) $\times$ volume'
      - section: 'Read the graph'
        say: 'Read the graph at fifty-five degrees. The solubility is seven mol per decimetre cubed.'
        write: 'At 55 °C, solubility = 7.0 mol dm⁻³'
      - say: 'Now read it at forty degrees. The solubility is six mol per decimetre cubed.'
        write: 'At 40 °C, solubility = 6.0 mol dm⁻³'
      - section: 'The working'
        say: 'So one decimetre cubed of solution deposits seven minus six, which is one mole.'
        write: 'From 1 dm³: $7.0 - 6.0 = 1.0$ mol'
      - section: 'Change the volume'
        say: 'Two hundred centimetres cubed divided by one thousand is zero point two decimetre cubed.'
        write: '200 cm³ $= \dfrac{200}{1000} = 0.2$ dm³'
      - say: 'So the solute deposited is one mol per decimetre cubed times zero point two decimetre cubed, which is zero point two mole.'
        write: 'Deposited $= 1.0 \times 0.2 = 0.20$ mol'
      - section: 'Check'
        say: 'Two hundred centimetres cubed is a fifth of a decimetre cubed, and a fifth of one mole is zero point two. It agrees.'
        write: 'Check: $\tfrac{1}{5}$ of 1 mol $= 0.2$ mol ✓'
      - section: 'Answer'
        say: 'So zero point two zero mole of solute is deposited, which is option B.'
        write: '$\therefore$ solute deposited $= 0.20$ mole'
        answer: true
    traps:
      A: 'You went for zero point one zero. That is half the right amount, from a misreading of the graph or the volume. The drop is one mole per decimetre cubed, and the volume is zero point two decimetre cubed.'
      C: 'You went for zero point zero one. That uses a far too small volume or a wrong reading. Two hundred centimetres cubed is zero point two decimetre cubed.'
      D: 'You went for zero point zero two. That is ten times too small, as if the volume were zero point zero two decimetre cubed. It is zero point two.'
  12:
    moments:
      - section: 'The question'
        say: 'Water from a river near your town is brown and cloudy. Before it reaches the tap, the waterworks adds sodium aluminate three. What is it there for?'
        write: 'Sodium aluminate(III) in water treatment is used to ...'
      - section: 'The problem'
        say: 'Fine particles of clay and dirt stay floating in the water, because they are too small to settle by themselves.'
        write: 'Fine clay particles stay suspended'
      - section: 'The fact'
        say: 'Sodium aluminate, like alum, forms a jelly of aluminium hydroxide in the water.'
        write: 'Aluminate $\rightarrow$ jelly-like $\ce{Al(OH)3}$'
      - say: 'This jelly traps the fine particles and makes them clump together and sink. That clumping is called coagulation.'
        write: 'Particles clump and settle = coagulation'
      - section: 'The other steps'
        say: 'The other jobs are done by other chemicals. Chlorine kills germs, and fluoride is added to protect teeth.'
        write: 'Chlorine: kills germs;  fluoride: protects teeth'
      - section: 'Remember it'
        say: 'Think of alum stirred into a bucket of muddy borehole water. Leave it for an hour and the mud sits at the bottom. That is coagulation.'
        write: 'Alum in muddy water $\rightarrow$ mud settles'
      - section: 'Answer'
        say: 'So sodium aluminate three is used to cause coagulation, which is option A.'
        write: '$\therefore$ it causes coagulation'
        answer: true
    traps:
      B: 'You went for neutralising acidity. That is the job of lime, not sodium aluminate.'
      C: 'You went for preventing goitre and tooth decay. Iodine prevents goitre and fluoride protects teeth. The aluminate makes particles settle.'
      D: 'You went for killing germs. Germs are killed later by chlorine. The aluminate makes the dirt clump and settle.'
  13:
    moments:
      - section: 'The question'
        say: 'Element X has atomic number twelve and element Y has atomic number seventeen. Before we can name the bond, we need to know who they are.'
        write: 'X: atomic number 12,  Y: atomic number 17,  bond = ?'
      - section: 'The configurations'
        say: 'Twelve electrons go two, eight, two. Two outer electrons make X a metal, which is magnesium.'
        write: 'X: 2, 8, 2  (metal, magnesium)'
      - say: 'Seventeen electrons go two, eight, seven. Seven outer electrons make Y a non-metal, which is chlorine.'
        write: 'Y: 2, 8, 7  (non-metal, chlorine)'
      - section: 'The rule'
        say: 'A metal joined to a non-metal usually gives an electrovalent, or ionic, bond, because the metal gives electrons to the non-metal.'
        write: 'Metal + non-metal $\rightarrow$ electrovalent bond'
      - section: 'The transfer'
        say: 'X loses its two outer electrons to become X²⁺. Each Y gains one electron to become Y⁻.'
        write: '$\ce{X -> X^2+ + 2e-}$,  $\ce{Y + e- -> Y-}$'
      - say: 'So one X needs two Y. The ions are held by strong attraction, giving XY₂, just like MgCl₂.'
        write: '$\ce{X^2+}$ + $2\ce{Y-}$ $\rightarrow$ $\ce{XY2}$  (like $\ce{MgCl2}$)'
      - section: 'Check'
        say: 'Magnesium chloride is a white solid with a high melting point that conducts when molten. That is how an ionic compound behaves.'
        write: 'High melting point, conducts when molten ✓'
      - section: 'Answer'
        say: 'So the bond between X and Y is electrovalent, which is option A.'
        write: '$\therefore$ electrovalent bond'
        answer: true
    traps:
      B: 'You went for metallic. Metallic bonding holds atoms of metals together, and Y is a non-metal.'
      C: 'You went for covalent. Covalent bonds form when two non-metals share electrons. Here a metal gives electrons to a non-metal.'
      D: 'You went for dative. A dative bond needs one atom to give both electrons of a shared pair. Here electrons are transferred.'
  14:
    moments:
      - section: 'The question'
        say: 'Wash your hands with soap in some borehole water and you get scum instead of lather. That water is hard. What causes it?'
        write: 'Hardness of water is mainly due to ...'
      - section: 'The fact'
        say: 'Hard water contains dissolved calcium and magnesium ions. These ions react with soap to form scum.'
        write: '$\ce{Ca^2+}$, $\ce{Mg^2+}$ + soap $\rightarrow$ scum'
      - section: 'Temporary hardness'
        say: 'Temporary hardness comes from calcium hydrogen trioxocarbonate four, Ca(HCO₃)₂. Boiling removes it.'
        write: 'Temporary: $\ce{Ca(HCO3)2}$, removed by boiling'
      - say: 'On boiling, it breaks down into calcium trioxocarbonate four, which is the fur you see inside a kettle.'
        write: '$\ce{Ca(HCO3)2 ->[heat] CaCO3 + H2O + CO2}$'
      - section: 'Permanent hardness'
        say: 'Permanent hardness comes from calcium tetraoxosulphate six, CaSO₄. Boiling does not remove it.'
        write: 'Permanent: $\ce{CaSO4}$, not removed by boiling'
      - section: 'Check'
        say: 'Sodium salts never cause hardness, because sodium ions do not form scum with soap.'
        write: '$\ce{Na+}$ does not cause hardness'
      - section: 'Answer'
        say: 'So hardness is mainly due to calcium hydrogen trioxocarbonate four or calcium tetraoxosulphate six, which is option B.'
        write: '$\therefore$ $\ce{Ca(HCO3)2}$ or $\ce{CaSO4}$'
        answer: true
    traps:
      A: 'You went for the hydroxides. Calcium and magnesium hydroxides are only slightly soluble and are not the usual cause of hardness.'
      C: 'You went for sodium hydroxide. Sodium ions do not form scum with soap, so they do not make water hard.'
      D: 'You went for the chlorides with sodium chloride. Sodium chloride does not make water hard. Only calcium and magnesium ions do.'
  15:
    moments:
      - section: 'The question'
        say: 'We want one solvent that does two jobs. It must dissolve iodine and naphthalene, and it must also mix completely with water.'
        write: 'Solvent for iodine and naphthalene that also mixes completely with water = ?'
      - section: 'The rule'
        say: 'Like dissolves like. Iodine and naphthalene are non-polar molecular solids, so they dissolve in organic solvents.'
        write: 'Like dissolves like'
      - section: 'First condition'
        say: 'Carbon four sulphide, ethanol and benzene all dissolve both solids. Tincture of iodine from the chemist is iodine dissolved in ethanol.'
        write: '$\ce{CS2}$ ✓, ethanol ✓, benzene ✓, water ✗'
      - section: 'Second condition'
        say: 'Now which one mixes with water? Ethanol has an OH group that forms hydrogen bonds with water, so it mixes in all proportions.'
        write: '$\ce{C2H5OH}$: $\ce{-OH}$ hydrogen-bonds with water $\Rightarrow$ mixes completely'
      - say: 'Carbon four sulphide and benzene are non-polar. Shake them with water and they form a separate layer.'
        write: '$\ce{CS2}$, benzene: separate layer with water'
      - section: 'Check'
        say: 'Ethanol passes both tests. That is why palm wine, which is mostly water, can hold its alcohol without separating.'
        write: 'Ethanol: dissolves both solids ✓, mixes with water ✓'
      - section: 'Answer'
        say: 'So the suitable solvent is ethanol, which is option B.'
        write: '$\therefore$ ethanol'
        answer: true
    traps:
      A: 'You went for carbon four sulphide. It dissolves both solids, but it does not mix with water. It forms a separate layer.'
      C: 'You went for water. Naphthalene does not dissolve in water, and iodine dissolves only a little.'
      D: 'You went for benzene. It dissolves both solids, but it floats on water as a separate layer.'
  16:
    moments:
      - section: 'The question'
        say: 'Every breath you take holds a little noble gas. Which noble gas is common in the air around us?'
        write: 'Which noble gas is commonly found in the atmosphere?'
      - section: 'The fact'
        say: 'Air is about seventy-eight percent nitrogen and twenty-one percent oxygen.'
        write: 'Air: $\ce{N2}$ 78%,  $\ce{O2}$ 21%'
      - say: 'Almost all of the last one percent is argon, about zero point nine three percent.'
        write: 'Argon $\approx$ 0.93%'
      - say: 'Neon, helium and xenon are there only in tiny traces.'
        write: 'Ne, He, Xe: traces only'
      - section: 'A real use'
        say: 'Because there is so much of it, argon is cheap to get from liquid air. It is used to fill ordinary light bulbs.'
        write: 'Argon from liquid air $\rightarrow$ light bulbs'
      - section: 'Remember it'
        say: 'After nitrogen and oxygen, the third gas in air is argon.'
        write: 'Nitrogen, oxygen, then argon'
      - section: 'Answer'
        say: 'So the noble gas commonly found in the atmosphere is argon, which is option D.'
        write: '$\therefore$ argon'
        answer: true
    traps:
      A: 'You went for xenon. Xenon is in the air only in tiny traces.'
      B: 'You went for neon. Neon is used in bright signs, but it is in the air only in traces.'
      C: 'You went for helium. Helium is in the air only in traces, because most of it escapes into space.'
  17:
    moments:
      - section: 'The question'
        say: 'N₂O₄ splits into two NO₂, and delta H is positive. We heat it up. What happens to the equilibrium and to its constant?'
        write: '$\ce{N2O4(g) <=> 2NO2(g)}$,  $\Delta H$ positive,  temperature increased'
      - section: 'The rule'
        say: 'Le Chatelier''s principle says that when a condition of a system at equilibrium is changed, the equilibrium shifts to oppose the change.'
        write: 'Le Chatelier: equilibrium shifts to oppose the change'
      - section: 'Read the sign'
        say: 'Delta H is positive, so the forward reaction takes in heat. It is endothermic.'
        write: '$\Delta H > 0$ $\Rightarrow$ forward reaction is endothermic'
      - section: 'Apply it'
        say: 'Raising the temperature favours the direction that uses up heat, which is the forward direction.'
        write: 'Heat favours the endothermic direction $\rightarrow$ right'
      - say: 'So the equilibrium moves to the right, and more NO₂ forms while N₂O₄ is used up.'
        write: 'More $\ce{NO2}$, less $\ce{N2O4}$'
      - section: 'The constant'
        say: 'The equilibrium constant is the concentration of NO₂ squared over the concentration of N₂O₄.'
        write: '$K = \dfrac{[\ce{NO2}]^2}{[\ce{N2O4}]}$'
      - say: 'The top gets bigger and the bottom gets smaller, so K gets bigger. Temperature is the only change that alters K.'
        write: 'Top ↑, bottom ↓ $\Rightarrow K$ ↑'
      - section: 'Check'
        say: 'You can see it in the lab. Warm a sealed tube of this gas and the brown colour of NO₂ gets darker.'
        write: 'Check: warm tube turns darker brown ✓'
      - section: 'Answer'
        say: 'So increasing the temperature increases the value of the equilibrium constant, which is option A.'
        write: '$\therefore$ $K$ increases'
        answer: true
    traps:
      B: 'You went for decreasing K. K falls on heating only when the forward reaction is exothermic. Here delta H is positive.'
      C: 'You went for more reactant. Heating favours the endothermic forward reaction, so we get more product, not reactant.'
      D: 'You went for a shift to the left. That would be right for an exothermic reaction. This one is endothermic, so it shifts to the right.'
  18:
    moments:
      - section: 'The question'
        say: 'Ethanoic acid meets hydroxide ions. On the right we get CH₃COO⁻. What should we call it?'
        write: '$\ce{CH3COOH(aq) + OH^-(aq) <=> CH3COO^-(aq) + H2O(l)}$'
      - section: 'The rule'
        say: 'Brønsted and Lowry say an acid gives away a proton, H⁺, and a base accepts one.'
        write: 'Acid = proton donor,  base = proton acceptor'
      - section: 'Follow the proton'
        say: 'Ethanoic acid gives its proton to the OH⁻. So ethanoic acid is the acid, and OH⁻ is the base.'
        write: '$\ce{CH3COOH}$ gives $\ce{H+}$ to $\ce{OH^-}$'
      - say: 'What is left of the acid after it loses its proton is called its conjugate base.'
        write: 'Acid $-$ $\ce{H+}$ = conjugate base'
      - say: 'So CH₃COO⁻ is the conjugate base of CH₃COOH.'
        write: '$\ce{CH3COOH}$ $\rightarrow$ $\ce{CH3COO^-}$  (conjugate base)'
      - section: 'The other pair'
        say: 'On the other side, OH⁻ gained a proton to become water. So water is the conjugate acid.'
        write: '$\ce{OH^-}$ $\rightarrow$ $\ce{H2O}$  (conjugate acid)'
      - section: 'Answer'
        say: 'So CH₃COO⁻ is a conjugate base, which is option A.'
        write: '$\therefore$ $\ce{CH3COO^-}$ is a conjugate base'
        answer: true
    traps:
      B: 'You went for an acid. CH₃COO⁻ has just lost its proton, so it is not the acid here.'
      C: 'You went for a base. It can accept a proton, but the exact name for the species formed from an acid is its conjugate base.'
      D: 'You went for a conjugate acid. The conjugate acid in this equation is water, formed from OH⁻.'
  19:
    moments:
      - section: 'The question'
        say: 'Potassium aluminium tetraoxosulphate six dissolves in water. Its name holds a clue, because two metals are named in it. How many different positive ions come out?'
        write: 'Potassium aluminium tetraoxosulphate(VI) in water, number of different cations = ?'
      - section: 'The formula'
        say: 'This is potash alum, the alum sold in the market. Its formula is KAl(SO₄)₂, with twelve waters of crystallisation.'
        write: '$\ce{KAl(SO4)2.12H2O}$'
      - section: 'The rule'
        say: 'Alum is a double salt. In water, a double salt breaks up completely into all its separate ions.'
        write: 'Double salt $\rightarrow$ all its ions in water'
      - section: 'The equation'
        say: 'So it gives one K⁺, one Al³⁺ and two SO₄²⁻ ions.'
        write: '$\ce{KAl(SO4)2 -> K+ + Al^3+ + 2SO4^2-}$'
      - section: 'Pick the cations'
        say: 'Cations are the positive ions. They are K⁺ and Al³⁺.'
        write: 'Cations: $\ce{K+}$, $\ce{Al^3+}$'
      - section: 'Check'
        say: 'SO₄²⁻ is negative, so it is an anion and is not counted. That leaves two kinds of cation.'
        write: '$\ce{SO4^2-}$ is an anion, not counted ✓'
      - section: 'Answer'
        say: 'So two different cations are produced, which is option D.'
        write: '$\therefore$ 2 cations'
        answer: true
    traps:
      A: 'You went for three. That counts the sulphate ion too, but sulphate is negative, so it is an anion.'
      B: 'You went for four. There are only two metals in the formula, so only two kinds of positive ion.'
      C: 'You went for one. A double salt has two different cations, here potassium and aluminium.'
  20:
    moments:
      - section: 'The question'
        say: 'All four of these are bases. But one of them is not an alkali. What is the difference?'
        write: 'Which is NOT an alkali?  $\ce{NH3}$, $\ce{Mg(OH)2}$, $\ce{Ca(OH)2}$, $\ce{NaOH}$'
      - section: 'The rule'
        say: 'An alkali is a base that dissolves in water to give hydroxide ions, OH⁻.'
        write: 'Alkali = base that dissolves in water to give $\ce{OH^-}$'
      - section: 'Test each one'
        say: 'NaOH is very soluble, so it is an alkali.'
        write: '$\ce{NaOH}$: very soluble, alkali ✓'
      - say: 'Ca(OH)₂ dissolves enough to make lime water, so it is an alkali too.'
        write: '$\ce{Ca(OH)2}$: lime water, alkali ✓'
      - say: 'Ammonia dissolves very readily, and in water it forms NH₄⁺ and OH⁻ ions. So ammonia solution is an alkali.'
        write: '$\ce{NH3 + H2O <=> NH4+ + OH^-}$, alkali ✓'
      - say: 'Mg(OH)₂ does not dissolve in water. It still neutralises acids, as milk of magnesia does in the stomach, so it is a base but not an alkali.'
        write: '$\ce{Mg(OH)2}$: insoluble, base but NOT an alkali'
      - section: 'Remember it'
        say: 'All alkalis are bases, but not all bases are alkalis.'
        write: 'All alkalis are bases; not all bases are alkalis'
      - section: 'Answer'
        say: 'So the one that is not an alkali is Mg(OH)₂, which is option B.'
        write: '$\therefore$ $\ce{Mg(OH)2}$'
        answer: true
    traps:
      A: 'You went for ammonia. Ammonia dissolves very readily in water and gives OH⁻ ions, so its solution is an alkali.'
      C: 'You went for calcium hydroxide. It dissolves enough to make lime water, which is an alkali.'
      D: 'You went for sodium hydroxide. It is a very soluble strong base, the most common alkali in the laboratory.'
  21:
    moments:
      - section: 'The question'
        say: 'A factory pours its hot cooling water into a river, and a week later dead fish float on the surface. No poison was added. So what killed them?'
        write: 'An effect of thermal pollution on water bodies is that the ...'
      - section: 'The meaning'
        say: 'Thermal pollution is the release of hot water from power stations and factories into rivers and lakes.'
        write: 'Thermal pollution = hot water released into rivers and lakes'
      - section: 'The rule'
        say: 'Gases are less soluble in warm water than in cold water.'
        write: 'Temperature ↑ $\Rightarrow$ solubility of a gas ↓'
      - section: 'Apply it'
        say: 'So the warm river holds less dissolved oxygen.'
        write: 'Warm water $\rightarrow$ less dissolved $\ce{O2}$'
      - say: 'Fish and other water life need that dissolved oxygen, so they suffocate.'
        write: 'Less $\ce{O2}$ $\rightarrow$ fish suffocate'
      - section: 'Check'
        say: 'You see the same thing when you open a warm bottle of soft drink. It fizzes more, because warm liquid cannot hold its gas.'
        write: 'Warm soft drink fizzes more ✓'
      - section: 'Answer'
        say: 'So thermal pollution makes the level of oxygen reduce, which is option D.'
        write: '$\therefore$ the level of oxygen reduces'
        answer: true
    traps:
      A: 'You went for the volume reducing. Warm water does not noticeably shrink a river. The harm is the oxygen that is lost.'
      B: 'You went for more chemical waste. Heat is not a chemical. That would be chemical pollution, not thermal pollution.'
      C: 'You went for oxides of nitrogen. Those are air pollutants from burning fuel, not an effect of hot water.'
  22:
    moments:
      - section: 'The question'
        say: 'Leave some crystals in an open dish during the rainy season, and by the next morning one of them has become a puddle. Which compound does that?'
        write: 'Which is a deliquescent compound?'
      - section: 'The meaning'
        say: 'A deliquescent substance absorbs so much water vapour from the air that it dissolves in it and forms a solution.'
        write: 'Deliquescent = absorbs water from air until it dissolves'
      - section: 'The fact'
        say: 'Anhydrous calcium chloride, CaCl₂, does exactly this.'
        write: '$\ce{CaCl2}$ is deliquescent'
      - say: 'That is why calcium chloride is used as a drying agent. It pulls water out of the air around it.'
        write: '$\ce{CaCl2}$ used as a drying agent'
      - section: 'The others'
        say: 'Washing soda crystals, Na₂CO₃ with ten waters, do the opposite. They lose water to the air. That is called efflorescence.'
        write: '$\ce{Na2CO3.10H2O}$ is efflorescent (loses water)'
      - say: 'Anhydrous Na₂CO₃ only takes in a little water without dissolving, so it is hygroscopic. CuO does not take in water at all.'
        write: '$\ce{Na2CO3}$ hygroscopic;  $\ce{CuO}$ neither'
      - section: 'Answer'
        say: 'So the deliquescent compound is CaCl₂, which is option B.'
        write: '$\therefore$ $\ce{CaCl2}$'
        answer: true
    traps:
      A: 'You went for anhydrous sodium trioxocarbonate four. It takes in some water but does not dissolve in it, so it is hygroscopic, not deliquescent.'
      C: 'You went for copper two oxide. It is an insoluble solid and does not absorb water from the air.'
      D: 'You went for washing soda crystals. They lose water to the air, which is efflorescence, the opposite of deliquescence.'
  23:
    moments:
      - section: 'The question'
        say: 'When an ionic solid dissolves, energy goes in and energy comes out. Here the hydration energy is bigger than the lattice energy. What kind of change is that?'
        write: 'Hydration energy > lattice energy  $\Rightarrow$ ?'
      - section: 'The two energies'
        say: 'To break up the crystal lattice, energy must be taken in. That is the lattice energy.'
        write: 'Break the lattice: energy taken in (lattice energy)'
      - say: 'When the free ions are surrounded by water molecules, energy is given out. That is the hydration energy.'
        write: 'Ions surrounded by water: energy given out (hydration energy)'
      - section: 'The rule'
        say: 'The heat of solution is the energy taken in minus the energy given out.'
        write: '$\Delta H_{\text{soln}}$ = lattice energy $-$ hydration energy'
      - section: 'Apply it'
        say: 'The hydration energy is bigger, so more energy is given out than is taken in.'
        write: 'Given out > taken in'
      - say: 'So delta H is negative, and heat is given out to the surroundings. The change is exothermic.'
        write: '$\Delta H < 0$ $\Rightarrow$ exothermic'
      - section: 'Check'
        say: 'Dissolve some calcium chloride in water and the test tube feels warm in your hand. That is this kind of change.'
        write: 'Check: $\ce{CaCl2}$ in water feels warm ✓'
      - section: 'Answer'
        say: 'So the change is an exothermic reaction, which is option C.'
        write: '$\therefore$ exothermic'
        answer: true
    traps:
      A: 'You went for spontaneous. Whether a change is spontaneous also depends on entropy, so these two energies alone cannot decide it.'
      B: 'You went for endothermic. That would need the lattice energy to be the bigger one. Here hydration gives out more.'
      D: 'You went for reversible. These energies tell us about heat, not about whether the change can go backwards.'
  24:
    moments:
      - section: 'The question'
        say: 'A zinc rod stands in zinc sulphate and a copper rod in copper sulphate. They are joined by a wire, and a bulb lights up. What is the zinc doing?'
        write: 'Role of the zinc electrode in a galvanic cell = ?'
      - section: 'The rule'
        say: 'In a galvanic cell, the more reactive metal is the negative electrode. It is the anode, where oxidation happens.'
        write: 'More reactive metal = negative electrode (anode), oxidation'
      - section: 'Which is more reactive'
        say: 'Zinc is above copper in the electrochemical series, so zinc is the more reactive metal.'
        write: '$\ce{Zn}$ above $\ce{Cu}$ in the electrochemical series'
      - section: 'The half equation'
        say: 'So zinc atoms dissolve as Zn²⁺ ions, and each one leaves two electrons behind on the rod.'
        write: '$\ce{Zn -> Zn^2+ + 2e^-}$'
      - section: 'Follow the electrons'
        say: 'Those electrons flow from the zinc through the wire to the copper, where copper ions use them up.'
        write: 'Electrons: $\ce{Zn}$ $\rightarrow$ wire $\rightarrow$ $\ce{Cu}$;  $\ce{Cu^2+ + 2e^- -> Cu}$'
      - section: 'Check'
        say: 'Leave the cell working for a day and the zinc rod gets thinner, because it is being eaten away as it gives out electrons.'
        write: 'Check: zinc rod gets thinner ✓'
      - section: 'Answer'
        say: 'So the zinc electrode produces electrons, which is option C.'
        write: '$\therefore$ zinc produces electrons'
        answer: true
    traps:
      A: 'You went for reduction. Zinc is oxidised. Reduction happens at the copper electrode.'
      B: 'You went for the positive electrode. Zinc is the negative electrode, because it gives out electrons.'
      D: 'You went for using up electrons. Electrons are used up at the copper electrode, not at the zinc.'
  25:
    moments:
      - section: 'The question'
        say: 'Mix methane and chlorine in a dark cupboard and nothing happens for days. Carry the jar into bright sunlight and it can explode. So what controls this reaction?'
        write: '$\ce{CH4(g) + Cl2(g) -> CH3Cl(g) + HCl(g)}$,  major factor = ?'
      - section: 'The kind of reaction'
        say: 'This is a substitution reaction. A chlorine atom takes the place of one hydrogen atom in methane.'
        write: 'Substitution: one H replaced by Cl'
      - section: 'The rule'
        say: 'The reaction needs light to start. Light splits each chlorine molecule into two chlorine atoms.'
        write: '$\ce{Cl2 ->[light] 2Cl}$'
      - say: 'These chlorine atoms, called free radicals, start a chain reaction with the methane.'
        write: '$\ce{Cl + CH4 -> HCl + CH3}$, and the chain goes on'
      - section: 'Check'
        say: 'With no light there is no reaction. In bright light the reaction is fast. Warming in the dark does not start it.'
        write: 'Dark: no reaction;  sunlight: fast ✓'
      - section: 'Remember it'
        say: 'A reaction that needs light is called a photochemical reaction, just like photosynthesis in a green leaf.'
        write: 'Light-driven = photochemical reaction'
      - section: 'Answer'
        say: 'So the major factor is light, which is option D.'
        write: '$\therefore$ light'
        answer: true
    traps:
      A: 'You went for catalyst. No catalyst is used in this reaction. Light starts it.'
      B: 'You went for temperature. Warming alone in the dark does not start it. Light is what splits the chlorine molecules.'
      C: 'You went for concentration. Without light there is no reaction at all, whatever the concentration.'
  26:
    moments:
      - section: 'The question'
        say: 'Leave a cutlass outside in the rainy season and it turns brown with rust. What exactly must be present for this to happen?'
        write: 'Conditions required for corrosion (rusting) = ?'
      - section: 'The rule'
        say: 'Rusting of iron needs both water and oxygen.'
        write: 'Rusting needs water AND oxygen'
      - section: 'The equation'
        say: 'Iron, oxygen and water combine to form hydrated iron three oxide, which is rust.'
        write: '$\ce{4Fe + 3O2 + 2xH2O -> 2Fe2O3.xH2O}$'
      - section: 'The evidence'
        say: 'A nail in dry air, kept with anhydrous calcium chloride, does not rust. So water is needed.'
        write: 'Dry air only $\rightarrow$ no rust'
      - say: 'A nail in boiled water covered with a layer of oil has no oxygen, and it does not rust either. So oxygen is needed too.'
        write: 'Water without oxygen $\rightarrow$ no rust'
      - section: 'Check'
        say: 'Carbon four oxide and salt only speed rusting up, which is why cars rust faster near the sea in Lagos. They are not required.'
        write: '$\ce{CO2}$, salt: speed it up, not required'
      - section: 'Answer'
        say: 'So corrosion needs water and oxygen, which is option D.'
        write: '$\therefore$ water and oxygen'
        answer: true
    traps:
      A: 'You went for water and carbon four oxide. Without oxygen there is no rusting at all.'
      B: 'You went for water, carbon four oxide and oxygen. Water and oxygen are right, but carbon four oxide only speeds it up. It is not required.'
      C: 'You went for oxygen and carbon four oxide. Without water there is no rusting.'
  27:
    moments:
      - section: 'The question'
        say: 'Look at the energy profile. The reactants start high, climb over a hump, and end lower as products. X is the gap between the two flat levels. What is X?'
        write: 'Energy profile: X runs from the reactant level to the product level'
      - section: 'The rule'
        say: 'The enthalpy change, delta H, is the energy of the products minus the energy of the reactants.'
        write: '$\Delta H = H_{\text{products}} - H_{\text{reactants}}$'
      - section: 'Read the diagram'
        say: 'X starts at the reactant level and ends at the product level. It is the difference between them, so X is delta H.'
        write: 'X = gap between reactants and products = $\Delta H$'
      - say: 'The products are lower than the reactants, so energy was given out. This reaction is exothermic and delta H is negative.'
        write: 'Products lower $\Rightarrow \Delta H < 0$, exothermic'
      - section: 'The other parts'
        say: 'The activation energy is measured from the reactants up to the top of the hump. The activated complex sits right at the top.'
        write: 'Reactants to peak = activation energy;  peak = activated complex'
      - section: 'Check'
        say: 'X never touches the hump. It only joins the two flat levels, so it cannot be the activation energy.'
        write: 'Check: X does not reach the peak ✓'
      - section: 'Answer'
        say: 'So X is the enthalpy change, which is option B.'
        write: '$\therefore$ X $= \Delta H$, the enthalpy change'
        answer: true
    traps:
      A: 'You went for enthalpy. Enthalpy is the energy of one level. X is the difference between two levels, so it is the enthalpy change.'
      C: 'You went for activation energy. That runs from the reactants up to the top of the hump, and X does not reach the peak.'
      D: 'You went for activated complex. The activated complex is the state at the very top of the hump, not a gap between levels.'
  28:
    moments:
      - section: 'The question'
        say: 'The rate starts high, falls steeply, and then flattens out near zero as time goes on. What is decreasing to make this happen?'
        write: 'Rate against time: falls steeply, then levels off. Effect of a decrease in ...?'
      - section: 'The rule'
        say: 'Collision theory says the rate depends on how often reactant particles collide, and that depends on their concentration.'
        write: 'Rate $\propto$ collisions per second $\propto$ concentration'
      - section: 'During the reaction'
        say: 'As the reaction goes on, the reactants are used up, so their concentration falls.'
        write: 'Reactants used up $\Rightarrow$ concentration ↓'
      - say: 'Fewer particles means fewer collisions each second, so the rate drops.'
        write: 'Concentration ↓ $\Rightarrow$ collisions ↓ $\Rightarrow$ rate ↓'
      - say: 'At the start the drop is steep. As the reactants run out, the rate levels off near zero.'
        write: 'Steep at first, then levels off'
      - section: 'Check'
        say: 'Nothing else on the list changes by itself during a reaction. The temperature stays the same, but the reactants are always being used up.'
        write: 'Check: only the concentration falls on its own ✓'
      - section: 'Answer'
        say: 'So the graph shows the effect of a decrease in concentration, which is option A.'
        write: '$\therefore$ decrease in concentration'
        answer: true
    traps:
      B: 'You went for temperature. The temperature is not falling as this reaction goes on. The reactants are being used up.'
      C: 'You went for surface area. A curve like this comes from the reactants being used up, not from a change of surface area.'
      D: 'You went for pressure. Pressure is not the thing falling here. The concentration of the reactants is.'
  29:
    moments:
      - section: 'The question'
        say: 'Manganate seven meets iron two ions, and something called Y is missing from the left. Many students copy the five from the iron. Let us count properly.'
        write: '$\ce{MnO4^-(aq) + Y + 5Fe^2+(aq) -> Mn^2+(aq) + 5Fe^3+(aq) + 4H2O(l)}$'
      - section: 'The rule'
        say: 'In a balanced ionic equation, the atoms and the total charge must be the same on both sides.'
        write: 'Atoms balance and charges balance'
      - section: 'Count the hydrogen'
        say: 'On the right there are four waters, and each has two hydrogen atoms. Four times two is eight.'
        write: '$\ce{4H2O}$: $4 \times 2 = 8$ H atoms'
      - say: 'The only place hydrogen can come from on the left is Y. So Y must be eight H⁺.'
        write: 'Y $= \ce{8H+(aq)}$'
      - section: 'The full equation'
        say: 'Now write the equation in full.'
        write: '$\ce{MnO4^- + 8H+ + 5Fe^2+ -> Mn^2+ + 5Fe^3+ + 4H2O}$'
      - section: 'Check the charge'
        say: 'On the left side we have minus one, plus eight, plus five times two, which is ten. That gives plus seventeen.'
        write: 'Left: $-1 + 8 + 5(+2) = +17$'
      - say: 'On the right side we have plus two, plus five times three, which is fifteen. That also gives plus seventeen. It balances.'
        write: 'Right: $+2 + 5(+3) = +17$ ✓'
      - section: 'Answer'
        say: 'So Y is eight H⁺, which is option D.'
        write: '$\therefore$ Y $= \ce{8H+(aq)}$'
        answer: true
    traps:
      A: 'You went for five H⁺, copying the five from the iron ions. Four waters hold eight hydrogen atoms, so we need eight.'
      B: 'You went for four H⁺. That counts the water molecules, not the hydrogen atoms inside them. Four waters hold eight hydrogens.'
      C: 'You went for ten H⁺. That is too many. Only eight hydrogen atoms appear on the right, in the four waters.'
  30:
    moments:
      - section: 'The question'
        say: 'M is the mass deposited, Q is the quantity of electricity, and E is the electrochemical equivalent. Which equation is Faraday''s first law?'
        write: '$M$ = mass deposited,  $Q$ = quantity of electricity,  $E$ = electrochemical equivalent'
      - section: 'The rule'
        say: 'Faraday''s first law says the mass of a substance deposited is directly proportional to the quantity of electricity passed.'
        write: '$M \propto Q$'
      - section: 'Make it an equation'
        say: 'To turn proportional into equals, we put in a constant. That constant is E, the electrochemical equivalent.'
        write: '$M = EQ$'
      - section: 'What E means'
        say: 'E is the mass deposited by one coulomb. So Q coulombs deposit E times Q grams.'
        write: '$E$ = mass deposited by 1 C'
      - say: 'Since Q is the current times the time, the law is also written M equals E I t.'
        write: '$Q = It \Rightarrow M = EIt$'
      - section: 'Check'
        say: 'Double the charge and the mass must double. Only M equals E Q does that.'
        write: 'Check: $Q \times 2 \Rightarrow M \times 2$ ✓'
      - section: 'Answer'
        say: 'So Faraday''s first law is M equals E Q, which is option B.'
        write: '$\therefore M = EQ$'
        answer: true
    traps:
      A: 'You went for E over Q. That would make the mass fall as more electricity is passed. The mass must rise with Q.'
      C: 'You went for Q over E. That is upside down. E is the mass per coulomb, so we multiply by Q.'
      D: 'You went for E over two Q. That brings in a two from nowhere and divides by Q, so the mass would fall as Q rises.'
  31:
    moments:
      - section: 'The question'
        say: 'Chlorine made in the lab comes out with some hydrogen chloride gas mixed in. What do we bubble it through to remove the hydrogen chloride?'
        write: 'Remove HCl gas from chlorine by passing it through ...'
      - section: 'The equation'
        say: 'Chlorine is made by heating concentrated hydrochloric acid with manganese four oxide.'
        write: '$\ce{MnO2 + 4HCl -> MnCl2 + Cl2 + 2H2O}$'
      - section: 'The impurities'
        say: 'The gas carries over two impurities, hydrogen chloride from the volatile acid and water vapour.'
        write: 'Impurities: $\ce{HCl}$ gas and water vapour'
      - section: 'The rule'
        say: 'Hydrogen chloride is very soluble in water, and chlorine is much less soluble.'
        write: '$\ce{HCl}$ very soluble in water;  $\ce{Cl2}$ much less'
      - say: 'So bubbling the gas through water dissolves out the hydrogen chloride and lets most of the chlorine pass on.'
        write: 'First wash bottle: water removes $\ce{HCl}$'
      - section: 'Then dry it'
        say: 'Next the gas goes through concentrated H₂SO₄, which removes the water vapour.'
        write: 'Second wash bottle: conc. $\ce{H2SO4}$ removes water vapour'
      - section: 'Answer'
        say: 'So the hydrogen chloride is removed by passing the gas through water, which is option A.'
        write: '$\therefore$ $\ce{H2O}$'
        answer: true
    traps:
      B: 'You went for ammonia. Ammonia reacts with both chlorine and hydrogen chloride, so it would destroy the gas we want.'
