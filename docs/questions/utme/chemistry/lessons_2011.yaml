        say: 'Two times forty-five is ninety grams per mole.'
        write: 'Molar mass $= 2 \times 45 = 90$ g mol⁻¹'
      - section: 'The empirical formula mass'
        say: 'CH₂O weighs twelve plus two plus sixteen, which is thirty.'
        write: '$\ce{CH2O}$: $12 + 2(1) + 16 = 30$'
      - section: 'How many units'
        say: 'Ninety divided by thirty is three. So the molecule holds three CH₂O units.'
        write: '$n = \dfrac{90}{30} = 3$'
      - say: 'Multiply every number in the formula by three. That gives C₃H₆O₃.'
        write: '$(\ce{CH2O})_3 = \ce{C3H6O3}$'
      - section: 'Check'
        say: 'We have three times twelve, plus six, plus three times sixteen. That is thirty-six plus six plus forty-eight, which is ninety. It agrees.'
        write: 'Check: $36 + 6 + 48 = 90$ ✓'
      - section: 'Answer'
        say: 'So the molecular formula is C₃H₆O₃, which is option C.'
        write: '$\therefore$ $\ce{C3H6O3}$'
        answer: true
    traps:
      A: 'You went for C₃H₇OH. Its atoms are not in the ratio of CH₂O, so it cannot have this empirical formula.'
      B: 'You went for C₂H₅OH. Its atoms are not in the ratio of CH₂O either.'
      D: 'You went for C₂H₄O₂. It fits CH₂O, but its molar mass is sixty. You need ninety, which is two times the vapour density.'
  44:
    moments:
      - section: 'The question'
        say: 'Glucose meets an enzyme called zymase, and out come C₂H₅OH and carbon four oxide. You have smelled this happening in a calabash of palm wine. What is it used to make?'
