  43:
    moments:
      - section: 'The question'
        say: 'The empirical formula is CH₂O and the vapour density is forty-five. Many students forget to double the vapour density. Let us not.'
        write: 'Empirical formula $\ce{CH2O}$, vapour density = 45, molecular formula = ?  [C = 12, H = 1, O = 16]'
      - section: 'The rule'
        say: 'The molar mass of a gas is two times its vapour density.'
        write: 'Molar mass $= 2 \times$ vapour density'
