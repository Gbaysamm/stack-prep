        say: 'The word catena means chain in Latin. Catenation is chain making.'
        write: 'Catena = chain'
      - section: 'The other words'
        say: 'Alkylation adds an alkyl group, acylation adds an acyl group, and carbonation dissolves carbon four oxide, as in soft drinks.'
        write: 'Alkylation, acylation, carbonation: other processes'
      - section: 'Answer'
        say: 'So the ability of carbon to form long chains is catenation, which is option C.'
