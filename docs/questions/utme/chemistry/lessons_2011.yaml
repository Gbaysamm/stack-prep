  37:
    moments:
      - section: 'The question'
        say: 'Medals are handled, dropped and worn for years. Why make them from bronze instead of pure copper?'
        write: 'Bronze is preferred to copper for medals because it ...'
      - section: 'The fact'
        say: 'Bronze is an alloy of copper and tin.'
        write: 'Bronze = copper + tin'
      - section: 'The reason'
        say: 'In pure copper, layers of atoms slide over each other easily, so the metal bends and dents.'
        write: 'Pure copper: layers slide easily $\rightarrow$ soft'
      - say: 'The bigger tin atoms get in the way, so the layers cannot slide. That makes bronze harder and stronger than copper.'
        write: 'Tin atoms block sliding $\rightarrow$ harder, stronger'
      - section: 'The rule'
        say: 'Alloys are made to be harder, stronger, or better at resisting corrosion than the pure metal.'
        write: 'Alloys: harder, stronger, resist corrosion'
      - section: 'Check'
        say: 'Bronze also resists corrosion, so a medal keeps its shape and its shine for many years.'
        write: 'Check: medals keep shape and shine ✓'
      - section: 'Answer'
        say: 'So bronze is preferred because it is stronger, which is option A.'
        write: '$\therefore$ bronze is stronger'
        answer: true
    traps:
      B: 'You went for low temperature. Copper copes with cold just as well, so that is not the reason.'
      C: 'You went for lighter. Bronze is about as dense as copper, so weight is not the reason.'
