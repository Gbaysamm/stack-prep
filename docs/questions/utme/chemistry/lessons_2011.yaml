      D: 'You went for HCl. Hydrogen chloride is the impurity itself, so it cannot remove itself.'
  32:
    moments:
      - section: 'The question'
        say: 'Pure iron melts at about one thousand five hundred and thirty-five degrees Celsius. Add some carbon and sulphur. What changes?'
        write: 'Effect of impurities such as C and S on iron = ?'
      - section: 'The rule'
        say: 'Impurities lower the melting point of a solid, and make it melt over a range instead of at one sharp temperature.'
        write: 'Impurities lower the melting point'
      - section: 'The reason'
        say: 'In pure iron the atoms sit in a neat, regular pattern. Carbon and sulphur atoms break up that pattern, so less energy is needed to pull the atoms apart.'
        write: 'Regular pattern disturbed $\Rightarrow$ less energy to melt'
      - section: 'A real example'
        say: 'Cast iron has about four percent carbon, and it melts at about one thousand two hundred degrees Celsius, well below pure iron.'
        write: 'Pure iron $\approx$ 1535 °C;  cast iron (4% C) $\approx$ 1200 °C'
      - say: 'The impurities also make cast iron hard and brittle. Drop a cast iron pot and it can crack.'
        write: 'Cast iron: hard and brittle'
      - section: 'Check'
        say: 'It is the same reason salt is spread on icy roads abroad. The impurity lowers the melting point of the ice.'
        write: 'Check: salt lowers the melting point of ice ✓'
      - section: 'Answer'
        say: 'So impurities lower the melting point of iron, which is option D.'
        write: '$\therefore$ they lower its melting point'
        answer: true
    traps:
      A: 'You went for high tensile strength. Impure cast iron is brittle and has low tensile strength.'
      B: 'You went for malleable and ductile. Impurities make iron brittle. It is the pure wrought iron that is malleable.'
      C: 'You went for raising the melting point. Impurities always lower the melting point of a solid, not raise it.'
  33:
    moments:
