      - say: 'So the central carbon is chiral. This compound is two hydroxypropanoic acid, lactic acid, found in sour milk.'
        write: '2-hydroxypropanoic acid (lactic acid)'
      - section: 'What it means'
        say: 'It exists as two forms that are mirror images, like your left and right hands. They cannot be laid exactly on top of each other.'
        write: 'Two mirror-image forms, like left and right hands'
      - say: 'The two forms turn plane polarised light in opposite directions. That is why it is called optical.'
        write: 'Rotate plane-polarised light in opposite directions'
