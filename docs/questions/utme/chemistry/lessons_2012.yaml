        write: '$\ce{C6H12O6}$ = $\ce{C6(H2O)6}$, x = y = 6'
      - say: 'Maltose and sucrose are both C₁₂H₂₂O₁₁. That is C₁₂(H₂O)₁₁, so x is twelve and y is eleven.'
        write: '$\ce{C12H22O11}$ = $\ce{C12(H2O)11}$, x = 12, y = 11'
      - say: 'Starch is C₆H₁₀O₅, many times over. That is six n carbons and five n water units, so x is not equal to y.'
        write: '$\ce{(C6H10O5)_{n}}$ = $\ce{C_{6n}(H2O)_{5n}}$, x ≠ y'
      - section: 'Test each pair'
        say: 'Glucose with starch fails, because glucose has x equal to y. Sucrose with fructose fails too, because of fructose.'
        write: 'A ✗ (glucose), C ✗ (fructose), D ✗ (both)'
      - say: 'Maltose and starch both have x not equal to y.'
        write: 'Maltose ✓, starch ✓'
      - section: 'Check'
        say: 'Check. Maltose is twelve to eleven and starch is six to five. Neither pair of numbers is equal.'
        write: '12 ≠ 11 and 6n ≠ 5n ✓'
      - section: 'Answer'
        say: 'So the pair with x not equal to y is maltose and starch, which is option B.'
        write: '$\therefore$ maltose and starch'
        answer: true
    traps:
      A: 'You went for glucose and starch. Starch qualifies, but glucose is C₆(H₂O)₆, where x equals y.'
      C: 'You went for sucrose and fructose. Sucrose qualifies, but fructose is C₆(H₂O)₆, where x equals y.'
      D: 'You went for glucose and fructose. Both are C₆(H₂O)₆, so x equals y for both.'
  44:
    moments:
      - section: 'The question'
        say: 'A compound has forty percent carbon, six point seven percent hydrogen, fifty-three point three percent oxygen and a molecular mass of one hundred and eighty. What is the molecular formula? The empirical formula is only halfway.'
        write: 'C = 40.0%, H = 6.7%, O = 53.3%, $M_r$ = 180  [C = 12, H = 1, O = 16]'
      - section: 'The rule'
        say: 'To find the empirical formula, divide each percentage by its relative atomic mass, then divide by the smallest answer.'
        write: 'Empirical formula, % ÷ $A_r$, then ÷ smallest'
      - section: 'The working'
        say: 'For carbon, forty divided by twelve is three point three three. For hydrogen, six point seven divided by one is six point seven. For oxygen, fifty-three point three divided by sixteen is three point three three.'
        write: 'C = $\tfrac{40.0}{12}$ = 3.33, H = $\tfrac{6.7}{1}$ = 6.7, O = $\tfrac{53.3}{16}$ = 3.33'
      - say: 'Divide each by the smallest, three point three three. That gives carbon one, hydrogen two and oxygen one.'
        write: 'C = 1, H = 2, O = 1'
      - say: 'So the empirical formula is CH₂O.'
        write: 'Empirical formula = $\ce{CH2O}$'
      - section: 'Scale up'
        say: 'The empirical formula mass is twelve plus two plus sixteen, which is thirty.'
        write: '$\ce{CH2O}$ = 12 + 2 + 16 = 30'
      - say: 'n is the molecular mass divided by the empirical mass. One hundred and eighty divided by thirty is six.'
        write: 'n = $\tfrac{180}{30}$ = 6'
      - say: 'So the molecular formula is CH₂O six times over, which is C₆H₁₂O₆.'
        write: '$\ce{(CH2O)6}$ = $\ce{C6H12O6}$'
      - section: 'Check'
        say: 'Check. Six times twelve plus twelve plus six times sixteen is seventy-two plus twelve plus ninety-six, which is one hundred and eighty. That is glucose.'
        write: '72 + 12 + 96 = 180 ✓'
      - section: 'Answer'
        say: 'So the molecular formula is C₆H₁₂O₆, which is option D.'
        write: '$\therefore$ molecular formula = $\ce{C6H12O6}$'
        answer: true
    traps:
      A: 'You went for CH₂O. That is only the empirical formula, with mass thirty. The molecule has mass one hundred and eighty, six times bigger.'
      B: 'You went for C₃H₆O₃. Its mass is ninety, only half of one hundred and eighty.'
      C: 'You went for C₆H₆O₃. Its carbon to hydrogen ratio is wrong, and its mass is only one hundred and twenty-six.'
  45:
    moments:
      - section: 'The question'
        say: 'Here are four alkynes, all with six or seven carbons. Only one gives a white precipitate with ammoniacal silver nitrate. Look for a hydrogen on a triple bond carbon.'
        write: 'Which alkyne gives a white precipitate with ammoniacal $\ce{AgNO3}$?'
      - section: 'The rule'
        say: 'Only a terminal alkyne, one with the triple bond at the very end of the chain, gives this white precipitate.'
        write: 'Terminal alkyne, $\ce{R-C#C-H}$, gives the precipitate'
      - section: 'The reason'
        say: 'The hydrogen on the end triple bond carbon is slightly acidic. Silver takes its place and forms a silver alkynide, which does not dissolve.'
        write: '$\ce{R-C#CH ->[Ag(NH3)2+] R-C#CAg(s)}$ (white)'
      - section: 'Test each one'
        say: 'In C, the chain ends with C triple bond CH. The triple bond is at the end and carries a hydrogen. That is hex one yne.'
        write: 'C, $\ce{CH3CH2CH2CH2C#CH}$ (hex-1-yne) ✓'
      - say: 'In A, B and D the triple bond is inside the chain, so neither triple bond carbon has a hydrogen.'
        write: 'A, B, D, triple bond inside the chain ✗'
      - say: 'B is the closest, but its triple bond starts at carbon two, so a methyl group sits on the end, not a hydrogen.'
        write: 'B, $\ce{CH3C#C...}$, no H on the triple bond ✗'
      - section: 'Check'
        say: 'Check. Only C has a hydrogen that silver can replace.'
        write: 'Only C has $\ce{#C-H}$ ✓'
      - section: 'Answer'
        say: 'So the alkyne that gives the white precipitate is CH₃CH₂CH₂CH₂C triple bond CH, which is option C.'
        write: '$\therefore$ $\ce{CH3CH2CH2CH2C#CH}$'
        answer: true
    traps:
      A: 'You went for the alkyne with the triple bond in the middle. Neither triple bond carbon carries a hydrogen, so silver has nothing to replace.'
      B: 'You went for the one with the triple bond near the end. It starts at carbon two, so a methyl group, not a hydrogen, sits on the triple bond.'
      D: 'You went for the seven-carbon alkyne. Its triple bond is inside the chain, so there is no hydrogen on it for silver to replace.'
  46:
    moments:
      - section: 'The question'
        say: 'Soap is made by boiling palm oil with caustic soda. What type of reaction is that? Ask whether the ester is being made or broken.'
        write: 'Saponification of an alkanoate involves …?'
      - section: 'The fact'
        say: 'Saponification is the alkaline hydrolysis of an ester, which we call an alkanoate. Fats and oils are esters.'
        write: 'Saponification = alkaline hydrolysis of an ester'
      - section: 'The equation'
        say: 'Fat plus sodium hydroxide gives soap plus propane one two three triol, which is glycerol.'
        write: 'Fat + NaOH $\to$ soap + propane-1,2,3-triol'
      - say: 'For a simple ester, ethyl ethanoate with NaOH gives sodium ethanoate and ethanol.'
        write: '$\ce{CH3COOC2H5 + NaOH -> CH3COONa + C2H5OH}$'
      - section: 'The reason'
        say: 'Water, from the alkali solution, splits the ester bond in two. Splitting a bond with water is hydrolysis.'
        write: 'Water splits the ester bond, so hydrolysis'
      - say: 'This is exactly what happens in local soap making, when palm oil is boiled with potash from ash.'
        write: 'Palm oil + alkali $\to$ local soap'
      - section: 'Check'
        say: 'Check. Esterification is the reverse, making an ester. Here the ester is broken, so it is hydrolysis.'
        write: 'Ester broken, not made ✓'
      - section: 'Answer'
        say: 'So saponification involves hydrolysis, which is option C.'
        write: '$\therefore$ hydrolysis'
        answer: true
    traps:
      A: 'You went for dehydration. Dehydration removes water, but saponification uses water to split the ester.'
      B: 'You went for esterification. That makes an ester. Saponification breaks the ester apart.'
      D: 'You went for oxidation. No oxygen is added and no hydrogen removed. The ester is simply split by water.'
  47:
    moments:
      - section: 'The question'
        say: 'Two methylpropan two ol. Is it primary, secondary or tertiary? Many students see the two in the name and say secondary. Draw it first.'
        write: '2-methylpropan-2-ol is a … alkanol?'
      - section: 'The rule'
        say: 'Count the carbon atoms joined to the carbon that holds the OH. One is primary, two is secondary, three is tertiary.'
        write: 'C atoms on the C–OH carbon, 1 primary, 2 secondary, 3 tertiary'
      - section: 'Draw it'
        say: 'Propan two ol has three carbons with the OH on the middle one.'
        write: 'Propan-2-ol, $\ce{CH3CH(OH)CH3}$'
      - say: 'Two methyl puts an extra methyl group on that same middle carbon, in place of its hydrogen.'
        write: '2-methylpropan-2-ol, $\ce{(CH3)3COH}$'
      - section: 'Count'
        say: 'Now the carbon holding the OH is joined to three methyl groups. That is three carbons.'
        write: 'C–OH carbon joined to 3 carbons'
      - say: 'Three carbons means tertiary.'
        write: '3 carbons, so tertiary'
      - section: 'Check'
        say: 'Check. A quaternary carbon would have four carbons on it, leaving no room for the OH. So there is no quaternary alkanol.'
        write: 'C has only 4 bonds, so no quaternary alkanol ✓'
      - section: 'Answer'
        say: 'So two methylpropan two ol is a tertiary alkanol, which is option C.'
        write: '$\therefore$ tertiary alkanol'
        answer: true
    traps:
      A: 'You went for primary. A primary alkanol has only one carbon on the carbon that holds the OH. Here there are three.'
      B: 'You went for secondary. The two in the name tells you where the OH is, not how many carbons it touches. Count them and you find three.'
      D: 'You went for quaternary. A carbon with four other carbons on it has no bond left for the OH, so no quaternary alkanol exists.'
  48:
    moments:
      - section: 'The question'
        say: 'Keep oxidising a primary alkanol, or an alkanal. Where does it stop? Follow ethanol down the road.'
        write: 'Final oxidation product of a primary alkanol or alkanal = ?'
      - section: 'The rule'
        say: 'A primary alkanol is oxidised first to an alkanal, and then the alkanal is oxidised to an alkanoic acid.'
        write: 'Primary alkanol $\to$ alkanal $\to$ alkanoic acid'
      - section: 'The equation'
        say: 'Ethanol is oxidised to ethanal, and ethanal is oxidised to ethanoic acid.'
        write: '$\ce{CH3CH2OH ->[[O]] CH3CHO ->[[O]] CH3COOH}$'
      - section: 'The reason'
        say: 'Oxidising agents like acidified potassium dichromate six do this. The alkanoic acid is the end of the line.'
        write: 'Acidified $\ce{K2Cr2O7}$ or $\ce{KMnO4}$, stops at the acid'
      - say: 'This is why palm wine left open for days turns sour. Its ethanol is oxidised to ethanoic acid.'
        write: 'Sour palm wine = ethanol $\to$ ethanoic acid'
      - section: 'Check'
        say: 'Check. Alkanoates, alkanoyl halides and alkanamides are all made from the acid by other reactions, not by oxidation.'
        write: 'The others come from the acid, not by oxidation ✓'
      - section: 'Answer'
        say: 'So the final oxidation product is an alkanoic acid, which is option A.'
        write: '$\therefore$ alkanoic acid'
        answer: true
    traps:
      B: 'You went for alkanoyl halide. That is made from the acid with reagents like phosphorus five chloride, not by oxidation.'
      C: 'You went for alkanoate. An alkanoate is a salt or ester made by neutralising or esterifying the acid, not by oxidising further.'
      D: 'You went for alkanamide. Amides need ammonia, not an oxidising agent.'
  49:
    moments:
      - section: 'The question'
        say: 'Ethanol is heated with concentrated H₂SO₄ above one hundred and seventy degrees Celsius. What comes off? Ask what the acid takes away.'
        write: 'Ethanol + conc. $\ce{H2SO4}$, above 170 °C $\to$ ?'
      - section: 'The rule'
        say: 'Concentrated H₂SO₄ is a dehydrating agent. It pulls water out of other substances.'
        write: 'conc. $\ce{H2SO4}$ = dehydrating agent'
      - say: 'At about one hundred and seventy degrees Celsius, with the acid in excess, it removes one molecule of water from each ethanol molecule.'
        write: 'About 170 °C, acid in excess, removes $\ce{H2O}$'
      - section: 'The equation'
        say: 'C₂H₅OH loses H₂O and becomes C₂H₄.'
        write: '$\ce{C2H5OH ->[conc. H2SO4][170 ^\circ C] C2H4 + H2O}$'
      - say: 'C₂H₄ is ethene, the gas collected over water in the laboratory.'
        write: '$\ce{C2H4}$ = ethene, $\ce{CH2=CH2}$'
      - section: 'Check'
        say: 'Check. Ethanal comes from oxidising ethanol, not dehydrating it. And ethyne is made from calcium carbide and water.'
        write: 'Ethanal, oxidation. ethyne, $\ce{CaC2 + H2O}$ ✓'
      - section: 'Answer'
        say: 'So ethanol with concentrated acid above one hundred and seventy degrees gives ethene, which is option B.'
        write: '$\therefore$ ethene'
        answer: true
    traps:
      A: 'You went for ethanone. There is no such compound. A ketone needs at least three carbons.'
      C: 'You went for ethyne. Ethyne is made from calcium carbide and water, not from ethanol.'
      D: 'You went for ethanal. Ethanal comes from oxidising ethanol. Concentrated acid at this temperature dehydrates it to ethene.'
  50:
    moments:
      - section: 'The question'
        say: 'Enzymes are named after their jobs. Which one carries out oxidation and reduction? Listen to the name.'
        write: 'An oxidation-reduction enzyme is …?'
      - section: 'The fact'
        say: 'Dehydrogenases are enzymes that remove hydrogen from one substance and pass it to another.'
        write: 'Dehydrogenase removes hydrogen'
      - section: 'The reason'
        say: 'Removing hydrogen from a substance oxidises it. The carrier that takes the hydrogen is reduced.'
        write: 'Loss of H = oxidation, gain of H = reduction'
      - say: 'So a dehydrogenase carries out oxidation and reduction together.'
        write: 'Dehydrogenase = redox enzyme'
      - section: 'The others'
        say: 'Amylase, protease and lipase are hydrolases. They break down starch, proteins and fats by adding water.'
        write: 'Amylase, protease, lipase = hydrolysis'
      - section: 'Remember'
        say: 'Remember, the name tells you the job. De hydrogen ase takes hydrogen away.'
        write: 'De-hydrogen-ase = takes hydrogen away ✓'
      - section: 'Answer'
        say: 'So the oxidation and reduction enzyme is dehydrogenase, which is option D.'
        write: '$\therefore$ dehydrogenase'
        answer: true
    traps:
      A: 'You went for amylase. It breaks down starch into sugars by adding water, which is hydrolysis.'
      B: 'You went for protease. It breaks down proteins by adding water, which is hydrolysis.'
      C: 'You went for lipase. It breaks down fats by adding water, which is hydrolysis.'
