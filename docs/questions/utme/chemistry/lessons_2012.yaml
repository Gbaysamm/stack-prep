  23:
    moments:
      - section: 'The question'
        say: 'What is the oxidation number of boron in NaBH₄? It all depends on whether hydrogen here is plus one or minus one.'
        write: 'Oxidation number of B in $\ce{NaBH4}$ = ?'
      - section: 'The rule'
        say: 'In a neutral compound, the oxidation numbers add up to zero.'
        write: 'Sum of oxidation numbers = 0'
      - say: 'Hydrogen is usually plus one, but in a metal hydride, hydrogen is minus one.'
        write: 'H in a metal hydride = −1'
      - section: 'The working'
        say: 'Sodium is plus one, each hydrogen is minus one, and we call boron x.'
        write: 'Na = +1, H = −1, B = x'
      - say: 'Plus one, plus x, plus four times minus one, equals zero.'
        write: '(+1) + x + 4(−1) = 0'
      - say: 'That is x minus three equals zero.'
        write: 'x − 3 = 0'
      - say: 'Add three to both sides, so x is plus three.'
        write: 'x = +3'
      - section: 'Check'
        say: 'Check. Boron is in Group three, with three valence electrons, so plus three fits. And one plus three minus four is zero.'
        write: '+1 + 3 − 4 = 0 ✓'
      - section: 'Answer'
        say: 'So the oxidation number of boron is plus three, which is option D.'
        write: '$\therefore$ oxidation number of B = +3'
        answer: true
    traps:
      A: 'You went for minus three. That takes hydrogen as plus one. In a metal hydride like this, hydrogen is minus one, which makes boron plus three.'
      B: 'You went for minus one. Then one minus one minus four is minus four, not zero. It does not balance.'
      C: 'You went for plus one. Then one plus one minus four is minus two, not zero. It does not balance.'
  24:
    moments:
      - section: 'The question'
        say: 'Sodium peroxide meets water and oxygen gas bubbles off. Which substance was oxidised? The trick is the oxygen in a peroxide.'
        write: '$\ce{2Na2O2(s) + 2H2O(l) -> 4NaOH(s) + O2(g)}$'
      - section: 'The rule'
        say: 'The substance oxidised is the one in which an element''s oxidation number goes up.'
        write: 'Oxidation = increase in oxidation number'
      - section: 'The working'
        say: 'In a peroxide like Na₂O₂, oxygen is minus one, not the usual minus two.'
        write: 'In $\ce{Na2O2}$, O = −1'
      - say: 'Some of that oxygen ends up in O₂ gas, where it is zero. Minus one to zero is an increase, so that is oxidation.'
        write: 'O in $\ce{Na2O2}$ (−1) $\to$ O in $\ce{O2}$ (0), oxidation'
      - say: 'The rest ends up in NaOH, where oxygen is minus two. Minus one to minus two is reduction.'
        write: 'O in $\ce{Na2O2}$ (−1) $\to$ O in $\ce{NaOH}$ (−2), reduction'
      - say: 'In water, hydrogen stays plus one and oxygen stays minus two, so water is neither oxidised nor reduced.'
        write: '$\ce{H2O}$, H = +1 and O = −2, no change'
      - say: 'So Na₂O₂ is the substance oxidised. It is reduced too, which we call disproportionation.'
        write: '$\ce{Na2O2}$ oxidised and reduced (disproportionation)'
      - section: 'Check'
        say: 'Check. O₂ is what the oxidation makes. It is a product, not the substance that was oxidised.'
        write: '$\ce{O2}$ = product of oxidation ✓'
      - section: 'Answer'
        say: 'So the substance oxidised is sodium peroxide, which is option A.'
        write: '$\therefore$ $\ce{Na2O2(s)}$'
        answer: true
    traps:
      B: 'You went for NaOH. It is a product, so it cannot be the substance that gets oxidised in this reaction.'
      C: 'You went for water. In water, hydrogen stays plus one and oxygen stays minus two, so nothing in it changes.'
      D: 'You went for O₂. It is formed by the oxidation. The substance oxidised is the reactant whose oxygen went from minus one to zero.'
  25:
    moments:
      - section: 'The question'
        say: 'Three hundred and sixty coulombs pass through a copper two solution. How many moles of copper are deposited? One option forgets that copper carries two charges.'
        write: 'Q = 360 C, F = 96500 C mol⁻¹, moles of Cu = ?'
      - section: 'The rule'
        say: 'We use Faraday''s law. Moles of metal deposited is the charge divided by n times F, where n is the charge on the ion.'
        write: 'Moles = $\dfrac{Q}{nF}$'
      - section: 'The equation'
        say: 'Cu²⁺ takes two electrons to become copper metal, so n is two.'
        write: '$\ce{Cu^2+ + 2e- -> Cu}$, so n = 2'
      - say: 'So one mole of copper needs two faradays, which is two times ninety-six thousand five hundred, or one hundred and ninety-three thousand coulombs.'
        write: '2F = 2 × 96500 = 193000 C'
      - section: 'The working'
        say: 'Moles of copper is three hundred and sixty coulombs divided by one hundred and ninety-three thousand coulombs per mole.'
        write: 'Moles = $\dfrac{360}{193000}$'
      - say: 'That is zero point zero zero one eight six five mole.'
        write: '= 0.001865 mol'
      - say: 'In standard form, that is one point eight seven times ten to the minus three mole.'
        write: '≈ $1.87 \times 10^{-3}$ mol'
      - section: 'Check'
        say: 'Check. Three hundred and sixty coulombs is a tiny fraction of a faraday, so a tiny amount of copper makes sense.'
        write: '360 C ≪ 193000 C, so a small amount ✓'
      - section: 'Answer'
        say: 'So the copper deposited is one point eight seven times ten to the minus three mole, which is option B.'
        write: '$\therefore$ moles of Cu = $1.87 \times 10^{-3}$'
        answer: true
    traps:
      A: 'You went for five point three six times ten to the minus four. That is not three hundred and sixty divided by one hundred and ninety-three thousand. Check the division.'
      C: 'You went for nine point three five times ten to the minus four. That divides by four faradays. Cu²⁺ needs only two electrons.'
      D: 'You went for three point seven three times ten to the minus three. That divides by one faraday only. Each copper ion needs two electrons, so divide by two F.'
  26:
    moments:
      - section: 'The question'
        say: 'A metal M pushes zinc out of zinc chloride solution. What does that tell us about M? Think of who gives up electrons.'
        write: 'M displaces Zn from $\ce{ZnCl2}$ solution, so …?'
      - section: 'The rule'
        say: 'A metal higher in the electrochemical series, which means more electropositive, displaces a lower metal from a solution of its salt.'
        write: 'Higher (more electropositive) metal displaces a lower one'
      - section: 'The equation'
        say: 'M gives its electrons to the zinc ions, and zinc metal comes out.'
        write: '$\ce{M + Zn^2+ -> M^{n+} + Zn}$'
      - section: 'The working'
        say: 'M loses electrons more readily than zinc does. Losing electrons easily is what electropositive means.'
        write: 'M loses e⁻ more readily than Zn'
      - say: 'So M is more electropositive than zinc.'
        write: 'M is more electropositive than Zn'
      - section: 'Example'
        say: 'Magnesium does exactly this. Mg plus ZnCl₂ gives MgCl₂ and zinc.'
        write: '$\ce{Mg + ZnCl2 -> MgCl2 + Zn}$'
      - section: 'Check'
        say: 'Check. Electrons flow from M to the zinc ions, not the other way, so M is the giver.'
        write: 'Electrons flow M $\to$ $\ce{Zn^2+}$ ✓'
      - section: 'Answer'
        say: 'So M is more electropositive than zinc, which is option B.'
        write: '$\therefore$ M is more electropositive than zinc'
        answer: true
    traps:
      A: 'You went for electrons flowing from zinc to M. It is the other way. M gives its electrons to the zinc ions.'
      C: 'You went for M being more electronegative. Electronegative means pulling electrons in, but M is the one giving electrons away.'
      D: 'You went for zinc being more electropositive. If that were true, zinc would push M out, not the other way round.'
  27:
    moments:
      - section: 'The question'
        say: 'We have the heats of formation of carbon four oxide, steam and carbon two oxide. What is the heat change of the reaction? Two options differ only in sign, so the order of subtraction matters.'
        write: '$\ce{CO(g) + H2O(g) -> CO2(g) + H2(g)}$'
      - say: 'The values are minus three hundred and ninety-four, minus two hundred and forty-two and minus one hundred and ten kilojoules per mole.'
        write: '$\Delta H_f$: $\ce{CO2}$ = −394, $\ce{H2O}$ = −242, $\ce{CO}$ = −110 kJ mol⁻¹'
      - section: 'The rule'
        say: 'We use Hess''s law. Delta H of reaction is the sum of the heats of formation of the products, minus the sum for the reactants.'
        write: '$\Delta H = \sum \Delta H_f(\text{products}) - \sum \Delta H_f(\text{reactants})$'
      - say: 'The heat of formation of an element, like hydrogen gas, is zero.'
        write: '$\Delta H_f(\ce{H2}) = 0$'
      - section: 'The working'
        say: 'For the products, minus three hundred and ninety-four plus zero is minus three hundred and ninety-four kilojoules per mole.'
        write: 'Products = −394 + 0 = −394 kJ mol⁻¹'
      - say: 'For the reactants, minus one hundred and ten plus minus two hundred and forty-two is minus three hundred and fifty-two kilojoules per mole.'
        write: 'Reactants = −110 + (−242) = −352 kJ mol⁻¹'
      - say: 'Products minus reactants is minus three hundred and ninety-four minus minus three hundred and fifty-two.'
        write: '$\Delta H$ = −394 − (−352)'
      - say: 'Minus minus becomes plus, so minus three hundred and ninety-four plus three hundred and fifty-two is minus forty-two kilojoules per mole.'
        write: '= −394 + 352 = −42 kJ mol⁻¹'
      - section: 'Check'
        say: 'Check. The products sit lower in energy than the reactants, so heat is given out. A negative delta H means exothermic, which fits.'
        write: '−394 < −352, so heat is given out, exothermic ✓'
      - section: 'Answer'
        say: 'So the standard heat change is minus forty-two kilojoules per mole, which is option D.'
        write: '$\therefore \Delta H = -42$ kJ mol⁻¹'
        answer: true
    traps:
      A: 'You went for plus two hundred and sixty-two. That adds numbers that should be subtracted. Take products minus reactants, which is minus three hundred and ninety-four minus minus three hundred and fifty-two.'
      B: 'You went for minus two hundred and sixty-two. That does not follow products minus reactants. The products total minus three hundred and ninety-four and the reactants minus three hundred and fifty-two.'
      C: 'You went for plus forty-two. That subtracts the wrong way, reactants minus products, which flips the sign. Always take products minus reactants.'
  28:
    moments:
      - section: 'The question'
        say: 'Entropy goes up in one of these changes. Which one? Ask which change makes the particles more spread out and more random.'
        write: 'Which change shows an increase in entropy?'
      - section: 'The fact'
        say: 'Entropy is the degree of disorder, or randomness, of a system.'
        write: 'Entropy = degree of disorder'
      - say: 'Gas is more disordered than liquid, and liquid is more disordered than solid.'
        write: 'Disorder, gas > liquid > solid'
      - section: 'Test each one'
        say: 'Mixing gases. Open a bottle of perfume in a room and it spreads everywhere. The molecules fill a bigger space and become more random, so entropy rises.'
        write: 'Mixing gases, more disorder, entropy up ✓'
      - say: 'Freezing water turns a liquid into an ordered solid, so entropy falls.'
        write: 'Freezing, liquid $\to$ solid, entropy down'
      - say: 'Condensation turns vapour into liquid, and solidifying wax turns liquid into solid. Both make the particles more ordered.'
        write: 'Condensing and solidifying, more order, entropy down'
      - section: 'Check'
        say: 'Check. Only mixing makes things more random. The other three all lock particles into place.'
        write: 'Only mixing increases disorder ✓'
      - section: 'Answer'
