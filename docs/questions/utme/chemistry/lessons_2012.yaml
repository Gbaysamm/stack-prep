        write: 'Strong acid + weak base $\to$ acidic salt, pH < 7'
      - say: 'The salt of a strong acid and a strong alkali is neutral, pH seven.'
        write: 'Strong acid + strong alkali $\to$ neutral salt, pH = 7'
