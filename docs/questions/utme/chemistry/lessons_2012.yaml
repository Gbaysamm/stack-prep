      - say: 'On the right there are two moles of CO₂.'
        write: 'Right = 2 mol of gas'
      - say: 'So the forward reaction goes from three volumes to two volumes. That is a decrease in volume.'
        write: '3 volumes $\to$ 2 volumes, volume decreases'
      - say: 'High pressure is relieved by shrinking the volume, so it favours the forward reaction.'
        write: 'High pressure favours the forward reaction'
      - section: 'Check'
        say: 'Check. Being exothermic tells us what temperature does, not pressure. Pressure only cares about moles of gas.'
        write: 'Pressure, count gas moles. temperature, heat change ✓'
      - section: 'Answer'
        say: 'So high pressure favours the forward reaction because it occurs with a decrease in volume, which is option D.'
        write: '$\therefore$ the process occurs with a decrease in volume'
        answer: true
    traps:
      A: 'You went for high pressure favouring gas formation. It is the opposite. High pressure favours the side with fewer gas molecules.'
      B: 'You went for dynamic equilibrium. Every equilibrium is dynamic, so that does not explain why pressure pushes this one forward.'
      C: 'You went for exothermic. The heat change decides what temperature does. Pressure works through the number of gas moles.'
