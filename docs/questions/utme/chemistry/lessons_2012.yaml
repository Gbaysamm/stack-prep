        write: '$\ce{H2SO4}$ dibasic, $\ce{H3PO4}$ tribasic'
      - section: 'Not strength'
        say: 'Strength is different. It is about what fraction of the acid molecules ionise, not how many ions each one can give.'
        write: 'Strength = how far the acid ionises'
      - say: 'Ethanoic acid, the acid in vinegar, is weak, yet it is still monobasic.'
        write: '$\ce{CH3COOH}$, weak but monobasic'
      - section: 'Check'
        say: 'Check. The question counts ions per molecule, which is exactly what basicity counts.'
        write: 'Ions per molecule = basicity ✓'
      - section: 'Answer'
        say: 'So the number of hydroxonium ions from one molecule is its basicity, which is option A.'
        write: '$\therefore$ basicity'
        answer: true
    traps:
      B: 'You went for acid strength. Strength is how far the acid ionises. Weak ethanoic acid and strong HCl both give one ion per molecule, so both are monobasic.'
      C: 'You went for pH. pH measures the concentration of H₃O⁺ in a whole solution, not the count from one molecule.'
      D: 'You went for concentration. Concentration is how much acid is in each decimetre cubed of solution, not ions per molecule.'
  21:
