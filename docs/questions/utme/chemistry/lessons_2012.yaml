      - section: 'Answer'
        say: 'So the gas rises with the acid added, then stays constant once all the calcium carbonate has reacted, which is option A.'
        write: '$\therefore$ rises, then constant when $\ce{CaCO3}$ is used up'
        answer: true
    traps:
