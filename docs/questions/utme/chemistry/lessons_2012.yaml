      D: 'You went for HNO₃ and KOH. Both are strong, so the salt, potassium trioxonitrate five, is neutral at pH seven.'
  20:
    moments:
      - section: 'The question'
        say: 'One molecule of acid goes into water and gives out hydroxonium ions. What do we call the number it gives? Many students mix this up with strength.'
        write: 'Number of $\ce{H3O+}$ ions from one molecule of acid = ?'
      - section: 'The fact'
        say: 'The basicity of an acid is the number of hydroxonium ions, H₃O⁺, that one molecule of the acid can produce in water.'
        write: 'Basicity = number of $\ce{H3O+}$ per molecule of acid'
      - section: 'Examples'
        say: 'HCl gives one, so it is monobasic.'
        write: '$\ce{HCl + H2O -> H3O+ + Cl-}$, monobasic'
