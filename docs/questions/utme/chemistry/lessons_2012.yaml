# UTME 2012 Chemistry, lessons for the board (voice + board), one per kept question.
#
# Each lesson is a run of moments, taught the Nigerian classroom way: the question, the rule in
# words then written, the balanced equation, the working with units one step at a time, the
# check, and the answer moment naming the option. `traps` speaks to a student who chose a wrong
# option. Spoken lines (say, traps) write formulas as formulas (the voice reads them letter by
# letter) and say units in words. Answers match explanations_2012.yaml. Q30 is not taught (left out of the paper).
format_version: 1
exam_year: 2012
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'Sand, water and methanoic acid are all in one beaker, and we want pure water out. Most students reach for filtration then distillation, but something sneaks through.'
        write: 'Sand + water + methanoic acid $\to$ pure water?'
      - section: 'The rule'
        say: 'Distillation separates two liquids only when their boiling points are far apart. A liquid that boils close to water comes over with the water.'
        write: 'Distillation needs boiling points far apart'
      - say: 'Water boils at one hundred degrees Celsius, and methanoic acid at about one hundred and one. That is far too close.'
        write: 'b.p. of $\ce{H2O}$ = 100 °C, b.p. of $\ce{HCOOH}$ ≈ 101 °C'
      - section: 'The equation'
        say: 'So first we neutralise the acid. HCOOH plus NaOH gives sodium methanoate and water.'
        write: '$\ce{HCOOH + NaOH -> HCOONa + H2O}$'
      - say: 'Sodium methanoate is a salt, and salts do not boil off. The acid is now locked in the flask.'
        write: '$\ce{HCOONa}$ is a salt, so it is not volatile'
      - section: 'The working'
        say: 'Now we distil. Only water vapour leaves the flask, and it condenses as pure water.'
        write: 'Distil, so only $\ce{H2O}$ vapour leaves and condenses'
      - say: 'The sand and the salt stay behind in the flask, so we do not even need a separate filtration.'
        write: 'Left in the flask = sand + $\ce{HCOONa}$'
      - section: 'Check'
        say: 'Check. Is anything left in the flask that can boil off with the water? No, so what collects is pure water.'
        write: 'Distillate = pure $\ce{H2O}$ ✓'
      - section: 'Answer'
        say: 'So we neutralise with NaOH and then distil, which is option B.'
        write: '$\therefore$ neutralise with NaOH, then distil'
        answer: true
    traps:
      A: 'You went for neutralisation then filtration. Filtering takes out the sand, but the sodium methanoate is dissolved and passes straight through the filter paper with the water.'
      C: 'You went for fractional distillation. Water and methanoic acid boil only about one degree apart, so the acid keeps coming over with the water.'
      D: 'You went for filtration then distillation. The sand goes, but the methanoic acid boils with the water and ends up in the distillate. Neutralise it first.'
  3:
    moments:
      - section: 'The question'
        say: 'We have six grams of magnesium. How many atoms is that? Two options here differ only by a factor of two, so count the moles carefully.'
        write: 'Mass of Mg = 6.0 g, Mg = 24, $N_A = 6.02 \times 10^{23}$ mol⁻¹, atoms = ?'
      - section: 'The rule'
        say: 'Number of moles is mass divided by molar mass.'
        write: 'Moles = $\dfrac{\text{mass}}{\text{molar mass}}$'
      - say: 'And the number of particles is the number of moles times Avogadro''s constant.'
        write: 'Number of particles = moles × $N_A$'
      - section: 'The working'
        say: 'Moles of magnesium is six grams divided by twenty-four grams per mole, which is zero point two five mole.'
        write: 'Moles of Mg = $\dfrac{6.0}{24}$ = 0.25 mol'
      - say: 'Now multiply zero point two five mole by six point zero two times ten to the twenty-three per mole.'
        write: 'Atoms = 0.25 × $6.02 \times 10^{23}$'
      - say: 'That gives one point five zero five times ten to the twenty-three atoms.'
        write: '= $1.505 \times 10^{23}$'
      - say: 'To three significant figures, that is one point five one times ten to the twenty-three.'
        write: '≈ $1.51 \times 10^{23}$ atoms'
      - section: 'Check'
        say: 'Check. Six grams is a quarter of twenty-four grams, so we expect a quarter of Avogadro''s number. A quarter of six point zero two is about one point five. It agrees.'
        write: '$\tfrac{1}{4} \times 6.02 \times 10^{23} \approx 1.51 \times 10^{23}$ ✓'
      - section: 'Answer'
        say: 'So six grams of magnesium holds one point five one times ten to the twenty-three atoms, which is option C.'
        write: '$\therefore$ number of atoms = $1.51 \times 10^{23}$'
        answer: true
    traps:
      A: 'You went for one point two zero times ten to the twenty-two. That is far too few. A quarter of a mole is one point five one times ten to the twenty-three atoms.'
      B: 'You went for two point four one times ten to the twenty-two. That is about a sixth of the right number. Work out the moles again. Six divided by twenty-four is zero point two five.'
      D: 'You went for three point zero two times ten to the twenty-three. That is half a mole, as if magnesium were twelve. Six divided by twenty-four is a quarter of a mole.'
  4:
    moments:
      - section: 'The question'
        say: 'A gas was collected over water, so it is not alone in the jar. Water vapour is pushing too, and most students forget to take it away.'
        write: 'V₁ = 50 cm³, T₁ = 10 °C, total P = 765 mmHg, s.v.p. = 5 mmHg, V₂ at s.t.p. = ?'
      - section: 'The rule'
        say: 'We use Dalton''s law of partial pressures. The pressure of the dry gas is the total pressure minus the vapour pressure of water.'
        write: 'P(dry gas) = P(total) − s.v.p. of water'
      - section: 'The working'
        say: 'So the dry gas pressure is seven hundred and sixty-five minus five, which is seven hundred and sixty millimetres of mercury.'
        write: 'P₁ = 765 − 5 = 760 mmHg'
      - say: 'Now change the temperature to kelvin. Ten plus two hundred and seventy-three is two hundred and eighty-three kelvin.'
        write: 'T₁ = 10 + 273 = 283 K'
      - say: 'At S T P, the pressure is seven hundred and sixty millimetres of mercury and the temperature is two hundred and seventy-three kelvin.'
        write: 'P₂ = 760 mmHg, T₂ = 273 K'
      - section: 'The gas equation'
        say: 'The general gas equation says P one V one over T one equals P two V two over T two.'
        write: '$\dfrac{P_1V_1}{T_1} = \dfrac{P_2V_2}{T_2}$'
      - say: 'Make V two the subject. V two is P one times V one times T two, all over T one times P two.'
        write: '$V_2 = \dfrac{P_1V_1T_2}{T_1P_2}$'
      - say: 'Put in the numbers. The seven hundred and sixties cancel, so we have fifty times two hundred and seventy-three over two hundred and eighty-three.'
        write: '$V_2 = \dfrac{760 \times 50 \times 273}{283 \times 760} = \dfrac{50 \times 273}{283}$'
      - say: 'Fifty times two hundred and seventy-three is thirteen thousand six hundred and fifty. Divide by two hundred and eighty-three to get forty-eight point two three centimetres cubed.'
        write: '$V_2 = \dfrac{13650}{283} = 48.23$ cm³'
      - section: 'Check'
        say: 'Check. The gas was cooled from two hundred and eighty-three kelvin to two hundred and seventy-three kelvin, so it should shrink a little below fifty. It does.'
        write: '48.23 cm³ < 50 cm³ ✓'
      - section: 'Answer'
        say: 'So the volume at S T P is forty-eight point two three centimetres cubed, which is option D.'
        write: '$\therefore V_2 = 48.23$ cm³'
        answer: true
    traps:
      A: 'You went for forty-nine point one nine centimetres cubed. That is too big. Take away the water vapour and cool to two hundred and seventy-three kelvin, and the volume falls to forty-eight point two three.'
      B: 'You went for forty-eight point eight seven. That adds the five millimetres of water vapour instead of taking it away. The dry gas pushes only seven hundred and sixty.'
      C: 'You went for forty-eight point five five. That uses the whole seven hundred and sixty-five millimetres. Five of those come from water vapour, so the dry gas pushes only seven hundred and sixty.'
  5:
    moments:
      - section: 'The question'
        say: 'Squeeze a gas harder while its temperature stays the same. What happens to it? Think of pressing a bicycle pump with your thumb over the end.'
        write: 'P increases, T constant, so what happens?'
      - section: 'The rule'
        say: 'This is Boyle''s law. At constant temperature, the volume of a fixed mass of gas is inversely proportional to its pressure.'
        write: "Boyle's law: $V \\propto \\dfrac{1}{P}$, so $PV$ = constant"
      - section: 'The working'
        say: 'P times V stays the same. So if P goes up, V must come down to keep the product fixed.'
        write: '$P \uparrow \Rightarrow V \downarrow$'
      - say: 'For example, double the pressure and the volume is halved.'
        write: '$2P \times \tfrac{1}{2}V = PV$'
      - say: 'The molecules are pushed closer together, so the distance between them gets smaller.'
        write: 'Molecules closer, so intermolecular distance falls'
      - say: 'Closer molecules hit each other and the walls more often, so collisions increase, not decrease.'
        write: 'Collisions per second increase'
      - section: 'Check'
        say: 'Check with the pump. Push the handle in, and the air inside takes up less room. It agrees.'
        write: 'Pump pushed in, so air volume smaller ✓'
      - section: 'Answer'
        say: 'So higher pressure at constant temperature gives a decrease in volume, which is option B.'
        write: '$\therefore$ a decrease in volume'
        answer: true
    traps:
      A: 'You went for fewer effective collisions. Squeezing the gas packs the molecules closer, so they collide more often, not less.'
      C: 'You went for a bigger intermolecular distance. Higher pressure pushes the molecules closer together, so the distance shrinks.'
      D: 'You went for an increase in volume. That is the opposite of Boyle''s law. When pressure goes up at constant temperature, volume goes down.'
  6:
    moments:
      - section: 'The question'
        say: 'Three hundred centimetres cubed of oxygen and a thousand of hydrogen are exploded together. Not all the hydrogen can react. How much is left over?'
        write: 'V($\ce{O2}$) = 300 cm³, V($\ce{H2}$) = 1000 cm³, $\ce{H2}$ left = ?'
      - section: 'The rule'
        say: 'This is Gay-Lussac''s law. Gases react in volumes that are in a simple ratio, the same as the mole ratio in the balanced equation.'
        write: "Gay-Lussac's law: volume ratio = mole ratio"
      - section: 'The equation'
        say: 'Two H₂ plus O₂ gives two H₂O.'
        write: '$\ce{2H2(g) + O2(g) -> 2H2O(g)}$'
      - say: 'So two volumes of hydrogen react with one volume of oxygen.'
        write: '$\ce{H2}$ to $\ce{O2}$ = 2 to 1'
      - section: 'The working'
        say: 'Three hundred centimetres cubed of oxygen needs two times three hundred, which is six hundred centimetres cubed of hydrogen.'
        write: '$\ce{H2}$ used = 2 × 300 = 600 cm³'
      - say: 'We had one thousand. One thousand minus six hundred is four hundred centimetres cubed left over.'
        write: '$\ce{H2}$ left = 1000 − 600 = 400 cm³'
      - section: 'Check'
        say: 'Check. Six hundred used plus four hundred left makes one thousand, and six hundred to three hundred is two to one. It agrees.'
        write: '600 + 400 = 1000, and 600 to 300 = 2 to 1 ✓'
      - section: 'Answer'
        say: 'So four hundred centimetres cubed of hydrogen is left over, which is option B.'
        write: '$\therefore$ $\ce{H2}$ left over = 400 cm³'
        answer: true
    traps:
      A: 'You went for two hundred. Check the ratio. Each volume of oxygen takes two of hydrogen, so six hundred is used and four hundred is left.'
      C: 'You went for six hundred. That is the hydrogen that reacted. The question asks what is left over, and one thousand minus six hundred is four hundred.'
      D: 'You went for seven hundred. That is one thousand minus three hundred, as if the gases reacted one to one. The equation says two of hydrogen to one of oxygen.'
  7:
    moments:
      - section: 'The question'
        say: 'Here are four everyday happenings. Which of them show that matter is made of tiny moving particles? Ask of each one, could it happen if matter were not made of particles?'
        write: 'I evaporation, II sublimation, III diffusion, IV Brownian motion'
      - section: 'The rule'
        say: 'The kinetic theory says matter is made of tiny particles that are always moving. Anything that only makes sense with moving particles is evidence for it.'
        write: 'Kinetic theory: matter = tiny particles in constant motion'
      - section: 'Test each one'
        say: 'Evaporation. Wet clothes on the line dry because fast water particles escape from the surface. That is evidence.'
        write: 'I evaporation, particles escape the surface ✓'
      - say: 'Sublimation. Camphor balls in a wardrobe shrink because particles leave the solid straight into the air. That is evidence.'
        write: 'II sublimation, solid particles go straight to gas ✓'
      - say: 'Diffusion. Fry akara in the kitchen and someone in the parlour smells it, because the particles spread out by themselves. That is evidence.'
        write: 'III diffusion, particles spread and mix ✓'
      - say: 'Brownian motion. Specks of smoke or pollen jiggle about because invisible moving particles keep hitting them. That is the most direct evidence of all.'
        write: 'IV Brownian motion, specks pushed by moving particles ✓'
      - section: 'Check'
        say: 'Check. Not one of the four could happen if matter were a continuous lump with no moving particles.'
        write: 'All four need moving particles ✓'
      - section: 'Answer'
        say: 'So one, two, three and four are all evidence, which is option D.'
        write: '$\therefore$ I, II, III and IV'
        answer: true
    traps:
      A: 'You went for one and three only. Those are evidence, but so are sublimation and Brownian motion. All four need moving particles.'
      B: 'You went for two and four only. You left out evaporation and diffusion, which also need particles that move on their own.'
      C: 'You went for one, two and three only. Brownian motion is the clearest evidence of all, so it belongs in the list too.'
  8:
    moments:
      - section: 'The question'
        say: 'X has atomic number eleven and Y has seventeen. What bond do they form? Write their electrons first and the answer jumps out.'
        write: 'X: Z = 11, Y: Z = 17, type of bond = ?'
      - section: 'The rule'
        say: 'A metal that easily loses electrons and a non-metal that easily gains them form an ionic bond, also called an electrovalent bond.'
        write: 'Metal loses e⁻ + non-metal gains e⁻ $\Rightarrow$ ionic bond'
      - section: 'The electrons'
        say: 'Eleven electrons go two, eight, one. That is sodium, with one electron in its outer shell to give away.'
        write: 'X = 2, 8, 1 (sodium), $\ce{X -> X+ + e-}$'
      - say: 'Seventeen electrons go two, eight, seven. That is chlorine, one short of an octet, so it takes an electron.'
        write: 'Y = 2, 8, 7 (chlorine), $\ce{Y + e- -> Y-}$'
      - section: 'The bond'
        say: 'X gives one electron to Y. Now X⁺ and Y⁻ attract each other strongly.'
        write: '$\ce{X+ + Y- -> XY}$'
      - say: 'That is just like NaCl, common salt, which is an ionic compound.'
        write: 'XY is like $\ce{NaCl}$, an ionic compound'
      - section: 'Check'
        say: 'Check. Both ions now have the stable two, eight, eight or two, eight arrangement, which is why the transfer happens.'
        write: '$\ce{X+}$ = 2, 8 and $\ce{Y-}$ = 2, 8, 8 ✓'
      - section: 'Answer'
        say: 'So X and Y form an ionic bond, which is option C.'
        write: '$\therefore$ ionic bond'
        answer: true
    traps:
      A: 'You went for dative. A dative bond is a shared pair that comes from one atom only. Here an electron is transferred, not shared.'
      B: 'You went for covalent. In a covalent bond two non-metals share electrons, but X is sodium, a metal that gives its electron away.'
      D: 'You went for metallic. Metallic bonding holds the atoms of a metal together. Here a metal meets a non-metal, so the bond is ionic.'
  9:
    moments:
      - section: 'The question'
        say: 'Take a hydrogen atom and pull off its electron. What is left? Many students forget that ordinary hydrogen has no neutron at all.'
        write: '$\ce{H}$ loses an electron. What is left?'
      - section: 'The fact'
        say: 'The common hydrogen atom, hydrogen one, has one proton, one electron and no neutron.'
        write: '$\ce{^{1}_{1}H}$ = 1 proton, 1 electron, 0 neutrons'
      - say: 'We can see this from its mass number. Mass number one is one proton plus zero neutrons.'
        write: 'Mass number = protons + neutrons, so 1 = 1 + 0'
      - section: 'The working'
        say: 'Losing its only electron turns the atom into the ion H⁺.'
        write: '$\ce{H -> H+ + e-}$'
      - say: 'What is left is the nucleus alone, which is one proton and nothing else.'
        write: '$\ce{H+}$ = 1 proton only'
      - say: 'That is why chemists often call H⁺ simply a proton.'
        write: '$\ce{H+}$ = a proton'
      - section: 'Check'
        say: 'Check. One proton and one neutron would be deuterium, hydrogen two, a rare isotope. Ordinary hydrogen is hydrogen one.'
        write: '$\ce{^{2}_{1}H}$ (deuterium) is the one with a neutron ✓'
      - section: 'Answer'
        say: 'So a hydrogen atom that has lost its electron contains one proton only, which is option A.'
        write: '$\therefore$ one proton only'
        answer: true
    traps:
      B: 'You went for one neutron only. Hydrogen must always keep its one proton, because the proton is what makes it hydrogen.'
      C: 'You went for one proton and one neutron. That is deuterium, a rare isotope. Ordinary hydrogen has mass number one, so it has no neutron.'
      D: 'You went for proton, electron and neutron. The question says the electron has been lost, and ordinary hydrogen has no neutron.'
  10:
    moments:
      - section: 'The question'
        say: 'We want the electron arrangement of the magnesium ion, Mg²⁺. One option is a trap because it is the atom, not the ion.'
        write: 'Electronic configuration of $\ce{Mg^2+}$ = ?'
      - section: 'The rule'
        say: 'A positive ion forms when an atom loses electrons from its outermost shell.'
        write: 'Positive ion = atom − outer electrons'
      - section: 'The working'
        say: 'Magnesium has atomic number twelve, so the atom has twelve electrons.'
        write: 'Mg: Z = 12, so 12 electrons'
      - say: 'Fill them in order to get one s two, two s two, two p six and three s two.'
        write: 'Mg = 1s² 2s² 2p⁶ 3s²'
      - say: 'Two plus means two electrons are lost. They come from the outermost shell, the three s.'
        write: '$\ce{Mg -> Mg^2+ + 2e-}$'
      - say: 'Twelve minus two leaves ten electrons, which is one s two, two s two and two p six.'
        write: '$\ce{Mg^2+}$ = 1s² 2s² 2p⁶'
      - section: 'Check'
        say: 'Check. Count them. Two plus two plus six is ten, the same arrangement as neon, a stable octet.'
        write: '2 + 2 + 6 = 10, like neon ✓'
      - section: 'Answer'
        say: 'So Mg²⁺ is one s two, two s two and two p six, which is option C.'
        write: '$\therefore$ $\ce{Mg^2+}$ = 1s² 2s² 2p⁶'
        answer: true
    traps:
      A: 'You went for the one ending in three p two. That has fourteen electrons, which is silicon, not the magnesium ion.'
      B: 'You went for the one ending in three s two. That is the neutral magnesium atom. The ion has lost those two three s electrons.'
      D: 'You went for the one ending in two p four. That has only eight electrons. The magnesium ion has ten.'
  11:
    moments:
      - section: 'The question'
        say: 'Group seven is the halogens, such as chlorine, bromine and iodine. What do they all do well? Count their outer electrons and you will see.'
        write: 'Group VII elements are …?'
      - section: 'The fact'
        say: 'Halogens have seven electrons in their outer shell. They need just one more to complete an octet.'
        write: 'Group VII: 7 outer electrons, needs 1 more'
      - section: 'The equation'
        say: 'So they gain electrons readily. Cl₂ plus two electrons gives two Cl⁻.'
        write: '$\ce{Cl2 + 2e- -> 2Cl-}$'
      - section: 'The reason'
        say: 'To gain electrons, a halogen must take them from something else. Whatever loses electrons is oxidised.'
        write: 'Halogen takes e⁻, so the other substance is oxidised'
      - say: 'A substance that oxidises others is an oxidising agent. So halogens are good oxidising agents.'
        write: 'Electron acceptor = oxidising agent'
      - say: 'Think of the chlorine in the town water supply. It kills germs by oxidising them.'
        write: 'e.g. chlorine in water treatment oxidises germs'
      - section: 'Check'
        say: 'Check. They are not electron donors, because donors are reducing agents like sodium. Halogens are the opposite.'
        write: 'Donors = Group I metals, acceptors = Group VII ✓'
      - section: 'Answer'
        say: 'So Group seven elements are good oxidising agents, which is option B.'
        write: '$\therefore$ good oxidizing agents'
        answer: true
    traps:
      A: 'You went for monoatomic. Halogens go about in pairs, as diatomic molecules like Cl₂.'
      C: 'You went for highly electropositive. Halogens pull electrons in, so they are highly electronegative, the opposite.'
      D: 'You went for electron donors. Halogens accept electrons. Donors are metals like sodium, which are reducing agents.'
  12:
    moments:
      - section: 'The question'
        say: 'How do scientists see how particles are packed in a crystal, like the cubes of salt in your kitchen? We need a ray that matches the spacing.'
        write: 'Which radiation studies the arrangement of particles in a crystal?'
      - section: 'The fact'
        say: 'The arrangement of particles in a crystal is found by X-ray diffraction.'
        write: 'Crystal lattice studied by X-ray diffraction'
      - section: 'The reason'
        say: 'X-rays have a wavelength about the same size as the spacing between particles in a crystal.'
        write: 'Wavelength of X-rays ≈ spacing of particles'
      - say: 'So the crystal scatters the X-rays into a pattern of spots.'
        write: 'Crystal scatters X-rays into a pattern'
      - say: 'From that pattern, the positions of the particles in the lattice are worked out.'
        write: 'Pattern $\to$ positions of particles'
      - section: 'Check'
        say: 'Check the others. Alpha particles probed the nucleus, beta particles are fast electrons, and gamma rays are used to sterilise and treat cancer.'
        write: 'Alpha, nucleus. beta, electrons. gamma, sterilising ✓'
      - section: 'Answer'
        say: 'So crystal lattices are studied with X-rays, which is option D.'
        write: '$\therefore$ X-rays'
        answer: true
    traps:
      A: 'You went for alpha particles. Rutherford used them to find the nucleus of the atom, not to map crystals.'
      B: 'You went for beta particles. They are fast electrons from radioactive decay, and they are not used to study crystal lattices.'
      C: 'You went for gamma rays. Their wavelength is far too short to match the spacing in a crystal. They are used for sterilising and cancer treatment.'
  13:
    moments:
      - section: 'The question'
        say: 'Three statements about air. Which of them prove that air is a mixture and not a compound? One of them is true but proves nothing.'
        write: 'I varies from place to place, II separated physically, III has noble gases'
      - section: 'The rule'
        say: 'A mixture has a composition that can vary, and its parts can be separated by physical means. A compound has a fixed composition.'
        write: 'Mixture = variable composition + physical separation'
      - section: 'Test each one'
        say: 'Statement one. Air by the sea in Lagos holds more water vapour than air in Kano. Its make-up changes, so this shows a mixture.'
        write: 'I variable composition ✓'
      - say: 'Statement two. Liquid air is separated into nitrogen and oxygen by fractional distillation, a physical method. This shows a mixture.'
        write: 'II physical separation ✓'
      - say: 'Statement three. Air does contain noble gases, but a single pure gas can also be unreactive. This proves nothing about a mixture.'
        write: 'III true, but not proof of a mixture ✗'
      - section: 'Check'
        say: 'Check. Only one and two come from the definition of a mixture.'
        write: 'I and II match the definition ✓'
      - section: 'Answer'
        say: 'So the statements that show air is a mixture are one and two only, which is option A.'
        write: '$\therefore$ I and II only'
        answer: true
    traps:
      B: 'You went for two and three. Three is true, but it does not prove a mixture, and you left out one, the changing composition.'
      C: 'You went for one and three. Three proves nothing about a mixture, and you left out two, the physical separation.'
      D: 'You went for all three. Containing noble gases is true of air, but it is not part of what makes something a mixture.'
  14:
    moments:
      - section: 'The question'
        say: 'Hard water will not lather with soap. What do we add to soften it, and what happens to the calcium and magnesium ions?'
        write: 'Chemicals to soften hard water involve adding …?'
      - section: 'The rule'
        say: 'Water is hard because it holds dissolved calcium ions and magnesium ions. To soften it, we must take these ions out of the water.'
        write: 'Hardness =$\ce{Ca^2+}$ and $\ce{Mg^2+}$ in solution'
      - section: 'The chemical'
        say: 'We add a soluble sodium compound, like washing soda, Na₂CO₃. It must dissolve so its ions can reach the calcium ions.'
        write: 'Add soluble $\ce{Na2CO3}$ (washing soda)'
      - section: 'The equation'
        say: 'Ca²⁺ meets CO₃²⁻, and they form CaCO₃, which does not dissolve.'
        write: '$\ce{Ca^2+(aq) + CO3^2-(aq) -> CaCO3(s)}$'
      - say: 'Magnesium does the same, forming insoluble magnesium carbonate.'
        write: '$\ce{Mg^2+(aq) + CO3^2-(aq) -> MgCO3(s)}$'
      - section: 'The working'
        say: 'The calcium and magnesium leave the water as an insoluble precipitate. Only sodium ions stay behind, and they do not cause hardness.'
        write: 'Precipitate removed, $\ce{Na+}$ stays, water is soft'
      - section: 'Check'
        say: 'Check. If the calcium stayed dissolved, the water would still be hard. So the precipitate must be insoluble.'
        write: 'Soluble sodium compound, insoluble precipitate ✓'
      - section: 'Answer'
        say: 'So we add soluble sodium compounds which form insoluble precipitates of calcium and magnesium, which is option C.'
        write: '$\therefore$ soluble Na compounds $\to$ insoluble Ca and Mg precipitates'
        answer: true
    traps:
      A: 'You went for insoluble sodium compounds. A compound that will not dissolve cannot reach the calcium ions in the water. It must be soluble.'
      B: 'You went for soluble solutions of calcium and magnesium. If those ions stayed dissolved, the water would still be hard. They must come out as a precipitate.'
      D: 'You went for insoluble precipitates alone. The precipitates are what we get after softening. What we add is a soluble sodium compound.'
  15:
    moments:
      - section: 'The question'
        say: 'Why does the waterworks put chlorine into the town water before it reaches your tap? Ask what makes untreated water dangerous.'
        write: 'Chlorination of town water is carried out to …?'
      - section: 'The fact'
        say: 'Chlorine is added to town water to kill germs, the bacteria that cause diseases like cholera and typhoid.'
