      - section: 'The equation'
        say: 'In C, two HCl plus Mg(OH)₂ gives MgCl₂ and two H₂O.'
        write: '$\ce{2HCl + Mg(OH)2 -> MgCl2 + 2H2O}$'
      - say: 'HCl is a strong acid, but magnesium hydroxide is a weak base. It hardly dissolves.'
        write: '$\ce{HCl}$ strong, $\ce{Mg(OH)2}$ weak'
      - section: 'The reason'
        say: 'The Mg²⁺ ions react a little with water and release H⁺ ions, so the solution is slightly acidic.'
        write: '$\ce{Mg^2+ + 2H2O <=> Mg(OH)2 + 2H+}$'
