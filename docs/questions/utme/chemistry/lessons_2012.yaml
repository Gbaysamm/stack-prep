        say: 'CaCO₃ plus two HCl gives CaCl₂, CO₂ and water.'
        write: '$\ce{CaCO3(s) + 2HCl(aq) -> CaCl2(aq) + CO2(g) + H2O(l)}$'
      - section: 'The rule'
        say: 'The amount of product is fixed by the reactant that runs out first. We call it the limiting reagent.'
        write: 'Product is fixed by the limiting reagent'
      - section: 'Stage one'
        say: 'At the start there is plenty of calcium carbonate, so the acid is used up each time. Two moles of acid always give one mole of gas.'
        write: '2 mol HCl $\to$ 1 mol $\ce{CO2}$ while $\ce{CaCO3}$ is left'
      - say: 'So every equal portion of acid adds the same volume of gas. The total rises in a straight line.'
        write: 'More acid, more $\ce{CO2}$, rising steadily'
      - section: 'Stage two'
        say: 'Soon all the calcium carbonate has reacted. Now the extra acid has nothing to react with.'
        write: 'All $\ce{CaCO3}$ used, acid now in excess'
      - say: 'No more gas forms, so the total stays the same. The curve goes flat.'
        write: 'Total $\ce{CO2}$ constant, curve levels off'
      - section: 'Check'
        say: 'Check. Gas that has already been made cannot vanish, so the total never falls. Think of fizzing chalk in a bottle of vinegar. Once the chalk is gone, the fizzing stops.'
