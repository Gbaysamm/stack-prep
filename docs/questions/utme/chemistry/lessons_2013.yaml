        write: 'Filter $\to$ wash $\to$ dry'
      - section: 'The other methods'
        say: 'The other three methods make a soluble salt, which stays in solution and is then crystallised.'
        write: 'Acid + metal, base or trioxocarbonate(IV) $\to$ soluble salts'
      - section: 'Answer'
        say: 'So an insoluble salt is prepared by double decomposition, which is option B.'
        write: '$\therefore$ double decomposition'
        answer: true
