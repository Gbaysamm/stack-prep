  17:
    moments:
      - section: 'The question'
        say: 'A town pours too much sewage into a river. Soon dead fish float on the water. Why?'
        write: 'Too much sewage in a water body leads to ?'
      - section: 'The fact'
        say: 'Sewage is food for bacteria. With too much of it, the bacteria multiply very fast.'
        write: 'Sewage = food for bacteria $\Rightarrow$ bacteria increase'
      - say: 'As the bacteria break the sewage down, they use up the oxygen dissolved in the water.'
        write: 'Bacteria use dissolved $\ce{O2}$'
      - say: 'This demand for oxygen by the bacteria is called the biochemical oxygen demand, or B O D.'
        write: 'High B.O.D. (biochemical oxygen demand)'
      - section: 'The result'
        say: 'The level of oxygen falls, and fish and other aquatic animals suffocate.'
        write: 'Dissolved $\ce{O2}$ falls $\Rightarrow$ aquatic animals die'
      - say: 'So the chain is more sewage, more bacteria and less oxygen.'
        write: 'More sewage $\to$ more bacteria $\to$ less oxygen'
      - section: 'Answer'
        say: 'So too much sewage leads to more bacteria, which reduce the oxygen in the water, which is option C.'
        write: '$\therefore$ bacteria increase, oxygen falls'
        answer: true
    traps:
      A: 'You went for a fall in temperature. Sewage does not cool the water. The animals die from lack of oxygen.'
      B: 'You went for more aquatic animals. They die, they do not increase, because the oxygen runs out.'
      D: 'You went for fewer bacteria. Sewage feeds bacteria, so their number rises and the oxygen falls.'
  18:
    moments:
      - section: 'The question'
        say: 'Ten decimetres cubed of water is added to two point five decimetres cubed of two mol per decimetre cubed hydrochloric acid. What is the new concentration?'
        write: 'Add 10.0 dm³ water to 2.5 dm³ of 2.0 mol dm⁻³ $\ce{HCl}$; $C_2 = ?$'
      - section: 'The rule'
        say: 'When we dilute, the number of moles of acid stays the same, because water adds no acid. So C one times V one equals C two times V two.'
        write: 'Dilution: $C_1V_1 = C_2V_2$'
      - say: 'C one and V one are the concentration and volume before dilution. C two and V two are the concentration and volume after it.'
        write: '1 = before, 2 = after'
      - section: 'The working'
        say: 'The final volume is the acid plus the water. Two point five plus ten is twelve point five decimetres cubed.'
        write: '$V_2 = 2.5 + 10.0 = 12.5$ dm³'
      - say: 'Moles are concentration times volume. So the moles of HCl are two point zero mol per decimetre cubed times two point five decimetres cubed, which is five moles.'
        write: 'Moles of $\ce{HCl}$ $= 2.0 \times 2.5 = 5.0$ mol'
      - say: 'The same five moles now sit in twelve point five decimetres cubed. Five divided by twelve point five is zero point four.'
        write: '$C_2 = \dfrac{5.0}{12.5} = 0.4$ mol dm⁻³'
      - section: 'The check'
        say: 'Check. Adding water must lower the concentration, and zero point four is less than two point zero.'
        write: 'Check: 0.4 < 2.0 ✓'
      - section: 'Answer'
        say: 'So the final concentration is zero point four mol per decimetre cubed, which is option A.'
        write: '$\therefore C_2 = 0.4$ mol dm⁻³'
        answer: true
    traps:
      B: 'You went for eight point zero. That multiplies where it should divide. Adding water can only lower the concentration.'
      C: 'You went for two point zero. That ignores the added water altogether.'
      D: 'You went for zero point five. That divides by ten only. The acid''s own two point five decimetres cubed is part of the final volume too.'
  19:
    moments:
      - section: 'The question'
        say: 'Three drops of strong acid go into a solution of pH six point four. Does the pH go up, down, or stay the same?'
        write: '3 drops of 1.0 mol dm⁻³ $\ce{HCl}$ + 20 cm³ of pH 6.4 solution; new pH = ?'
      - section: 'The rule'
        say: 'The rule is that the lower the pH, the more hydrogen ions there are. Adding acid adds hydrogen ions, so the pH falls.'
        write: 'More $\ce{H+}$ $\Rightarrow$ lower pH'
      - say: 'A pH of six point four is only slightly acidic. Its hydrogen ion concentration is ten to the minus six point four, which is about four times ten to the minus seven mol per decimetre cubed. That is very few hydrogen ions.'
        write: 'pH 6.4: $[\ce{H+}] \approx 4 \times 10^{-7}$ mol dm⁻³'
      - section: 'The equation'
        say: 'Hydrochloric acid is a strong acid, fully ionised. It hands all its hydrogen ions to the solution.'
        write: '$\ce{HCl(aq) -> H+(aq) + Cl-(aq)}$'
      - section: 'The working'
        say: 'One drop is about zero point zero five centimetres cubed, so three drops is about zero point one five centimetres cubed of acid.'
        write: '3 drops ≈ 3 × 0.05 = 0.15 cm³'
      - say: 'Moles are concentration times volume. One point zero mol per decimetre cubed times zero point one five over one thousand decimetres cubed is one point five times ten to the minus four moles of hydrogen ions.'
        write: 'Moles of $\ce{H+}$ $= 1.0 \times \dfrac{0.15}{1000} = 1.5 \times 10^{-4}$ mol'
      - say: 'These moles spread through about twenty centimetres cubed, which is zero point zero two decimetres cubed. Dividing gives about seven point five times ten to the minus three mol per decimetre cubed, and that is a pH of about two.'
        write: '$[\ce{H+}] \approx \dfrac{1.5 \times 10^{-4}}{0.020} = 7.5 \times 10^{-3}$ mol dm⁻³ $\Rightarrow$ pH ≈ 2'
      - section: 'The check'
        say: 'That is thousands of times more hydrogen ions than before, so the pH drops a lot.'
        write: 'pH falls well below 6.4'
      - section: 'Answer'
        say: 'So the pH of the resulting solution will be less than six point four, which is option B.'
        write: '$\therefore$ pH < 6.4'
        answer: true
    traps:
      A: 'You went for close to pure water. Pure water has a pH of seven, and adding acid moves the pH away from seven, not towards it.'
      C: 'You went for greater than six point four. A higher pH would need a base to be added, not an acid.'
      D: 'You went for unaltered. Three drops sound too few to matter, but a strong acid swamps the tiny hydrogen ion content of a nearly neutral solution.'
  20:
    moments:
      - section: 'The question'
        say: 'Three of these come from an acid, and one does not. Which is not a salt?'
