      D: 'You went for metals with an acid. That makes soluble salts. An insoluble layer would cover the metal and stop the reaction.'
  22:
    moments:
      - section: 'The question'
        say: 'Fluorine gas meets water and oxygen gas comes off. Which substance is being reduced?'
        write: '$\ce{2H2O(l) + 2F2(g) -> 4HF(aq) + O2(g)}$; reduced = ?'
      - section: 'The rule'
        say: 'The rule is that a substance is reduced when its oxidation number goes down, because it gains electrons.'
        write: 'Reduction: oxidation number decreases (gain of electrons)'
      - section: 'Follow fluorine'
        say: 'Fluorine starts as F₂, an element, so its oxidation number is zero.'
        write: 'F in $\ce{F2}$: 0'
      - say: 'In a compound the oxidation numbers add up to zero. In HF, hydrogen is plus one, so fluorine must be minus one.'
        write: 'F in $\ce{HF}$: −1'
      - say: 'Zero to minus one is a fall, so fluorine is reduced.'
        write: 'F: 0 $\to$ −1, a decrease $\Rightarrow$ $\ce{F2}$ is reduced'
      - section: 'The check'
        say: 'Oxygen goes from minus two in water to zero in O₂. That is a rise, so water is oxidised. Hydrogen stays at plus one.'
        write: 'O: −2 $\to$ 0, an increase $\Rightarrow$ $\ce{H2O}$ is oxidised'
      - section: 'Answer'
        say: 'So the substance being reduced is F₂, which is option C.'
        write: '$\therefore$ $\ce{F2(g)}$ is reduced'
        answer: true
    traps:
      A: 'You went for O₂. Oxygen gas is a product, and its oxygen went from minus two to zero, which is oxidation.'
      B: 'You went for water. Water is oxidised, because its oxygen goes from minus two to zero. It is the reducing agent.'
      D: 'You went for HF. HF is a product. It is what the fluorine became after it was reduced.'
  23:
    moments:
