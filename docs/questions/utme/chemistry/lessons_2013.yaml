  25:
    moments:
      - section: 'The question'
        say: 'Five amperes flow through acidified water for one hundred and ninety-three seconds. What volume of oxygen comes off at s t p?'
        write: '$I = 5$ A, $t = 193$ s; volume of $\ce{O2}$ at s.t.p. = ?'
      - section: 'The rule'
        say: 'This is Faraday''s first law. The quantity of electricity is current times time, and ninety-six thousand five hundred coulombs is one faraday, which is one mole of electrons.'
        write: '$Q = It$; 1 F = 96 500 C = 1 mol of electrons'
      - section: 'The equation'
        say: 'At the anode, hydroxide ions give up electrons and oxygen comes off. Four electrons make one oxygen molecule.'
        write: '$\ce{4OH- -> 2H2O + O2 + 4e-}$'
      - say: 'One faraday is one mole of electrons, so four moles of electrons, which is four faradays, release one mole of oxygen.'
        write: '4 F $\to$ 1 mol $\ce{O2}$'
      - section: 'The working'
        say: 'Charge is five amperes times one hundred and ninety-three seconds, which is nine hundred and sixty-five coulombs.'
        write: '$Q = 5 \times 193 = 965$ C'
      - say: 'Divide by ninety-six thousand five hundred to get faradays. That is zero point zero one faraday.'
        write: '$\dfrac{965}{96\,500} = 0.01$ F'
      - say: 'Four faradays give one mole of oxygen, so zero point zero one faraday gives zero point zero one divided by four, which is zero point zero zero two five mole.'
        write: 'Moles of $\ce{O2}$ $= \dfrac{0.01}{4} = 0.0025$ mol'
      - say: 'Each mole of gas at s t p takes twenty-two point four decimetres cubed. So the volume is zero point zero zero two five times twenty-two point four, which is zero point zero five six decimetres cubed.'
        write: 'Volume $= 0.0025 \times 22.4 = 0.056$ dm³'
      - section: 'The check'
        say: 'Check. That is fifty-six centimetres cubed, a small tube of gas after about three minutes. That size makes sense.'
        write: 'Check: 0.056 dm³ = 56 cm³ ✓'
      - section: 'Answer'
        say: 'So the volume of oxygen is zero point zero five six decimetres cubed, which is option B.'
        write: '$\therefore$ volume of $\ce{O2}$ = 0.056 dm³'
        answer: true
    traps:
      A: 'You went for two hundred and twenty-four decimetres cubed. That uses one electron per oxygen molecule, which gives two hundred and twenty-four centimetres cubed, and then calls it decimetres cubed. Four electrons are needed for each O₂, and the answer stays in decimetres cubed.'
      C: 'You went for zero point two two four decimetres cubed. That uses one faraday per mole of oxygen. Four electrons are needed for each O₂.'
      D: 'You went for fifty-six decimetres cubed. Fifty-six is the answer in centimetres cubed. In decimetres cubed it is zero point zero five six.'
  26:
    moments:
      - section: 'The question'
        say: 'A reaction takes in heat and also loses entropy. Can it ever happen on its own?'
        write: 'Endothermic ($\Delta H > 0$) and entropy loss ($\Delta S < 0$): spontaneous?'
      - section: 'The rule'
        say: 'The rule is the free energy equation. Delta G equals delta H minus T delta S, and a reaction is spontaneous only when delta G is negative.'
        write: '$\Delta G = \Delta H - T\Delta S$; spontaneous only if $\Delta G < 0$'
      - section: 'The signs'
        say: 'Endothermic means heat is taken in, so delta H is positive.'
        write: '$\Delta H$ is positive'
      - say: 'A loss of entropy means delta S is negative. Then minus T delta S is positive, because T is always positive.'
        write: '$\Delta S < 0 \Rightarrow -T\Delta S > 0$'
      - say: 'So delta G is a positive plus a positive, which is positive at every temperature.'
        write: '$\Delta G = (+) + (+) > 0$'
      - section: 'The check'
        say: 'A positive delta G means the reaction cannot go on its own, at any temperature.'
        write: '$\Delta G > 0$ $\Rightarrow$ not spontaneous'
      - section: 'Answer'
        say: 'So the reaction will not be spontaneous, which is option C.'
        write: '$\therefore$ not spontaneous'
        answer: true
    traps:
      A: 'You went for indeterminate. That happens when delta H and delta S have the same sign, so temperature decides. Here both terms push delta G the same way, so the result is certain.'
      B: 'You went for spontaneous. That needs delta G to be negative, which cannot happen here.'
      D: 'You went for equilibrium. That needs delta G to equal zero, which cannot happen when both terms are positive.'
  27:
    moments:
      - section: 'The question'
        say: 'In the Contact process, how do we push this equilibrium to make more SO₃?'
        write: '$\ce{2SO2(g) + O2(g) <=> 2SO3(g)}$, $\Delta H = -395.7\ \text{kJ mol}^{-1}$'
      - section: 'The rule'
        say: 'Le Chatelier''s principle says that when a condition of a system at equilibrium is changed, the equilibrium shifts to oppose the change.'
        write: 'Le Chatelier: the equilibrium shifts to oppose the change'
      - section: 'Temperature'
        say: 'Delta H is negative, so the forward reaction gives out heat. It is exothermic.'
        write: '$\Delta H < 0$ $\Rightarrow$ forward reaction exothermic'
      - say: 'If we lower the temperature, the system replaces the lost heat by running the exothermic forward reaction. More SO₃ forms.'
        write: 'Temperature $\downarrow$ $\Rightarrow$ shifts right $\Rightarrow$ more $\ce{SO3}$'
      - section: 'Pressure and catalyst'
        say: 'Count gas molecules. There are two SO₂ and one O₂ on the left, which is three, and two SO₃ on the right. Higher pressure favours the side with fewer gas molecules, so more SO₃ needs higher pressure, not lower.'
        write: 'Gas moles: 3 $\to$ 2, so pressure $\uparrow$ favours $\ce{SO3}$'
      - say: 'A catalyst speeds up both directions equally. It brings equilibrium sooner but does not change the amount of SO₃.'
        write: 'Catalyst: no shift in position'
      - section: 'Answer'
        say: 'So the concentration of SO₃ is increased by decreasing the temperature, which is option B.'
        write: '$\therefore$ decrease the temperature'
        answer: true
    traps:
      A: 'You went for decreasing the pressure. Lower pressure favours the side with more gas molecules, which is the left side.'
      C: 'You went for increasing the temperature. Heat favours the endothermic backward reaction, so SO₃ breaks down.'
      D: 'You went for a catalyst. A catalyst does not shift the position of equilibrium. It only gets there faster.'
  28:
    moments:
      - section: 'The question'
        say: 'A match will not light until you strike it. That push of energy has a name.'
        write: 'Minimum energy for a reaction to take place = ?'
      - section: 'The definition'
        say: 'Activation energy is the minimum energy that colliding particles must have for a reaction to take place.'
        write: 'Activation energy, $E_a$: minimum energy for a reaction'
      - section: 'The reason'
        say: 'Only collisions with at least this energy can break the old bonds. Weaker collisions just bounce off.'
        write: 'Collision energy $\geq E_a$ $\Rightarrow$ reaction'
      - say: 'On an energy profile, it is the height of the hill from the reactants up to the peak.'
        write: '$E_a$ = peak energy $-$ reactant energy'
      - say: 'Striking the match gives the head enough energy to get over this hill. After that, the heat of burning keeps it going.'
        write: 'Striking a match supplies $E_a$'
      - say: 'A catalyst works by giving a path with a lower activation energy.'
        write: 'Catalyst lowers $E_a$'
      - section: 'Answer'
        say: 'So the minimum energy required for a reaction is the activation energy, which is option C.'
        write: '$\therefore$ activation energy'
        answer: true
    traps:
      A: 'You went for lattice energy. That is the energy change when ions come together to form a crystal lattice.'
      B: 'You went for ionization energy. That is the energy to remove an electron from a gaseous atom.'
      D: 'You went for kinetic energy. Particles need kinetic energy to collide, but the minimum needed for reaction is called the activation energy.'
  29:
    moments:
      - section: 'The question'
        say: 'There are two hills on one energy graph, one with a catalyst and one without. How high is the catalysed hill?'
        write: 'Activation energy of the catalysed reaction = ?'
      - section: 'The rule'
        say: 'Activation energy is the energy at the peak of the curve minus the energy of the reactants.'
        write: '$E_a$ = peak energy $-$ reactant energy'
      - section: 'Read the graph'
        say: 'A catalyst lowers the peak, so the catalysed reaction is the lower, dashed curve.'
        write: 'Catalysed = lower (dashed) curve'
      - say: 'The reactants start at one hundred kilojoules, and the dashed peak is at two hundred kilojoules.'
        write: 'Reactants: 100 kJ; dashed peak: 200 kJ'
      - section: 'The working'
        say: 'Two hundred minus one hundred is one hundred kilojoules.'
        write: '$E_a = 200 - 100 = 100$ kJ'
      - section: 'The check'
        say: 'Check with the other curve. Without a catalyst it is three hundred minus one hundred, which is two hundred kilojoules. The catalyst has lowered the hill, which makes sense.'
        write: 'Uncatalysed: $300 - 100 = 200$ kJ > 100 kJ ✓'
      - section: 'Answer'
        say: 'So the activation energy of the catalysed reaction is one hundred kilojoules, which is option A.'
        write: '$\therefore E_a = 100$ kJ'
        answer: true
    traps:
      B: 'You went for three hundred kilojoules. That is the peak of the uncatalysed curve, read from zero.'
      C: 'You went for two hundred and fifty kilojoules. No part of the catalysed curve gives that value.'
      D: 'You went for two hundred kilojoules. That is the dashed peak read from zero. Measure the hill from where the reactants start, at one hundred.'
  30:
    moments:
      - section: 'The question'
        say: 'Iron and steam reach equilibrium. Two of the four substances are solids. Which expression is K?'
        write: '$\ce{3Fe(s) + 4H2O(g) <=> Fe3O4(s) + 4H2(g)}$; $K = ?$'
      - section: 'The rule'
        say: 'The equilibrium law says K is the concentrations of the products over those of the reactants, each raised to the power of its coefficient.'
        write: '$K = \dfrac{[\text{products}]^{\text{coefficients}}}{[\text{reactants}]^{\text{coefficients}}}$'
      - say: 'Pure solids are left out, because their concentration does not change.'
        write: 'Leave out the solids: $\ce{Fe(s)}$ and $\ce{Fe3O4(s)}$'
      - section: 'The working'
        say: 'That leaves two gases. Hydrogen is the product with a coefficient of four, and steam is the reactant with a coefficient of four.'
