        write: 'Layer of $\ce{H2}$ on Cu $\Rightarrow$ current falls (polarization)'
      - say: 'A depolarizer cures it. In the dry Leclanché cell, manganese four oxide oxidises the hydrogen to water.'
        write: 'Depolarizer: $\ce{MnO2}$ turns $\ce{H2}$ into $\ce{H2O}$'
      - section: 'Remember'
        say: 'To remember it, hydrogen bubbles hug the plate and block the flow.'
        write: '$\ce{H2}$ bubbles block the plate'
      - section: 'Answer'
        say: 'So polarization is caused by hydrogen, which is option D.'
        write: '$\therefore$ hydrogen'
        answer: true
    traps:
      A: 'You went for chlorine. Chlorine is not formed in a simple cell.'
      B: 'You went for oxygen. Oxygen is not formed at the positive plate of a simple cell.'
