# UTME 2013 Chemistry, lessons for the board.
#
# Each lesson is a run of moments, taught the Nigerian classroom way: the question, the rule in
# words and then written, the equation, the working one step at a time, the check, and the
# answer moment that names the option. traps gives one kind line for each wrong option.
#
#   say:    what the voice says. Formulas written as formulas; the voice reads them letter by letter.
#   write:  the one line written while it is said, with mhchem for formulae.
#   answer: true on the moment that gives the answer.
#
# Keyed on question number, like explanations_2013.yaml. Answers match that file.
format_version: 1
exam_year: 2013
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'A pure solid melts sharply at one temperature. What happens to that melting point when an impurity gets in?'
        write: 'Impurity in a substance: melting point $\to$ ?'
      - section: 'The rule'
        say: 'The rule is that an impurity lowers the melting point, and the solid melts over a range of temperatures instead of sharply.'
        write: 'Rule: impurity $\Rightarrow$ melting point falls, melts over a range'
      - section: 'The reason'
        say: 'The foreign particles break up the neat, regular arrangement of particles in the solid. So less energy is needed to pull them apart.'
        write: 'Foreign particles disturb the regular lattice $\Rightarrow$ less energy to melt'
      - say: 'For example, pure ice melts at zero degrees Celsius. Salt is an impurity in ice, so salty ice melts below zero, which is why salt is spread on icy roads.'
        write: 'Pure ice melts at 0 °C; salty ice melts below 0 °C'
      - say: 'This is why chemists use a sharp melting point as a test of purity.'
        write: 'Sharp melting point $\Rightarrow$ pure substance'
      - section: 'Remember'
        say: 'To remember it, impurities lower melting points and raise boiling points.'
        write: 'Impurities: m.p. $\downarrow$, b.p. $\uparrow$'
      - section: 'Answer'
        say: 'So an impurity will cause the melting point to reduce, which is option B.'
        write: '$\therefore$ the melting point is reduced'
        answer: true
    traps:
      A: 'You went for be zero. An impurity shifts the melting point only a little. It does not drop it all the way to zero.'
      C: 'You went for increase. Impurities raise the boiling point of a liquid, but they lower the melting point of a solid.'
      D: 'You went for be stable. A steady, sharp melting point is the sign of a pure substance. An impure one melts over a range.'
  3:
    moments:
      - section: 'The question'
        say: 'Excess carbon burns in ten decimetres cubed of oxygen to give carbon two oxide. What volume of carbon two oxide forms?'
        write: 'Excess C + 10 dm³ $\ce{O2}$ $\to$ ? dm³ $\ce{CO}$'
      - section: 'The rule'
        say: 'Gay-Lussac''s law says gases react in volumes that are in a simple ratio, the same as the mole ratio in the balanced equation.'
        write: 'Gay-Lussac''s law: volumes of gases are in the mole ratio (same T and P)'
      - section: 'The equation'
        say: 'Carbon joins with oxygen to give CO. One O₂ molecule has two oxygen atoms, so it makes two CO molecules.'
        write: '$\ce{2C(s) + O2(g) -> 2CO(g)}$'
      - say: 'Carbon is a solid, so it has no gas volume to count. Among the gases, the equation has one O₂ and two CO, so one volume of oxygen gives two volumes of CO.'
        write: '$\ce{O2}$ : $\ce{CO}$ = 1 : 2'
      - say: 'Carbon is in excess, which means there is more than enough of it. So all ten decimetres cubed of oxygen gets used up, and the oxygen decides how much CO forms.'
        write: 'C in excess $\Rightarrow$ all 10 dm³ of $\ce{O2}$ reacts'
      - section: 'The working'
        say: 'So ten decimetres cubed of oxygen gives two times ten, which is twenty decimetres cubed of CO.'
        write: 'Volume of $\ce{CO}$ = 2 × 10 dm³ = 20 dm³'
      - section: 'The check'
        say: 'Check. The CO volume should be bigger than the oxygen volume, because each oxygen molecule makes two CO molecules. Twenty is bigger than ten.'
        write: 'Check: 20 dm³ > 10 dm³ ✓'
      - section: 'Answer'
        say: 'So twenty decimetres cubed of carbon two oxide is produced, which is option B.'
        write: '$\therefore$ volume of $\ce{CO}$ = 20 dm³'
        answer: true
    traps:
      A: 'You went for five decimetres cubed. That halves the volume. One volume of oxygen gives two volumes of CO, so we double it.'
      C: 'You went for fifteen decimetres cubed. That uses a two to three ratio, which is not in the balanced equation. The ratio is one to two.'
      D: 'You went for ten decimetres cubed. That copies the oxygen volume. Each O₂ molecule makes two CO molecules, so the volume doubles.'
  4:
    moments:
      - section: 'The question'
        say: 'There are four lines on a graph of P V against P, and only one of them is an ideal gas. Which one?'
        write: 'Graph of $PV$ against $P$: which line is an ideal gas?'
      - section: 'The rule'
        say: 'Boyle''s law says that at constant temperature, pressure times volume stays constant for a fixed mass of an ideal gas.'
        write: 'Boyle''s law: $PV = \text{constant}$ (fixed T)'
      - say: 'If P V never changes, then whatever pressure we choose, P V gives the same number.'
        write: '$P$ changes, but $PV$ stays the same'
      - section: 'The shape'
        say: 'A graph of something that never changes is a flat, horizontal straight line.'
        write: 'Ideal gas: horizontal line on a $PV$ against $P$ graph'
      - say: 'Look at the four lines. Only N is horizontal.'
        write: 'N is flat; K, L and M are not'
      - say: 'K and M dip and then rise. That is how real gases behave, because their molecules attract one another and take up space.'
        write: 'K and M dip then rise $\Rightarrow$ real gases'
      - section: 'Answer'
        say: 'So the ideal gas is the horizontal line N, which is option B.'
        write: '$\therefore$ ideal gas = N'
        answer: true
    traps:
      A: 'You went for M. It starts and ends close to N, but its deep dip shows a real gas with strong attractions between its molecules.'
      C: 'You went for K. It dips a little and then climbs steeply, the way a real gas like hydrogen behaves at high pressure.'
      D: 'You went for L. It rises steadily, so P V is changing. For an ideal gas P V stays constant.'
  5:
    moments:
      - section: 'The question'
        say: 'Gas Y diffuses at half the rate of gas Z, and Y has a relative molecular mass of sixty-four. What is the relative molecular mass of Z?'
        write: 'Rate of Y $= \tfrac{1}{2}$ rate of Z; $M_Y = 64$; $M_Z = ?$'
      - section: 'The rule'
        say: 'Graham''s law says the rate of diffusion of a gas is inversely proportional to the square root of its relative molecular mass.'
        write: 'Graham''s law: $R \propto \dfrac{1}{\sqrt{M}}$'
      - say: 'For two gases, rate of Y over rate of Z equals the square root of M of Z over M of Y. The masses are turned upside down because a heavier gas moves more slowly.'
        write: '$\dfrac{R_Y}{R_Z} = \sqrt{\dfrac{M_Z}{M_Y}}$'
      - section: 'The working'
        say: 'Rate of Y over rate of Z is one half, and M of Y is sixty-four. Put them in.'
        write: '$\dfrac{1}{2} = \sqrt{\dfrac{M_Z}{64}}$'
      - say: 'Square both sides to remove the square root. One half squared is one quarter.'
        write: '$\dfrac{1}{4} = \dfrac{M_Z}{64}$'
      - say: 'Multiply both sides by sixty-four. Sixty-four divided by four is sixteen.'
        write: '$M_Z = \dfrac{64}{4} = 16$'
      - section: 'The check'
        say: 'Check. Z is lighter than Y, so Z should diffuse faster. It does, at twice the rate of Y.'
        write: 'Check: $\sqrt{\dfrac{16}{64}} = \dfrac{1}{2}$ ✓'
      - section: 'Answer'
        say: 'So the relative molecular mass of Z is sixteen, which is option D.'
        write: '$\therefore M_Z = 16$'
        answer: true
    traps:
      A: 'You went for thirty-two. That divides sixty-four by two and forgets to square the half. One half squared is one quarter, so we divide by four.'
      B: 'You went for four. That divides sixty-four by sixteen, as if the ratio were squared twice. Square it once, to get one quarter.'
      C: 'You went for eight. Dividing sixty-four by eight does not come from Graham''s law. Squaring one half gives one quarter, and sixty-four over four is sixteen.'
  6:
    moments:
      - section: 'The question'
        say: 'A welder in Apapa wants to see a hidden crack inside a thick steel joint without cutting it open. Which radioisotope helps?'
        write: 'Radioisotope for checking faults in welds and castings = ?'
      - section: 'The fact'
        say: 'The fact is that cobalt sixty is used in industrial radiography, to find faults in welds and castings.'
        write: '$\ce{^{60}_{27}Co}$ (cobalt-60): industrial radiography'
      - section: 'The reason'
        say: 'Cobalt sixty gives out strong gamma rays, which pass through thick metal and darken a photographic film behind it.'
        write: 'Strong $\gamma$-rays pass through thick metal onto film'
      - say: 'A crack lets more rays through, so it shows up as a dark line on the film.'
        write: 'Crack $\Rightarrow$ more rays through $\Rightarrow$ dark line on film'
      - say: 'The same gamma rays are used in radiotherapy, to treat cancer in hospitals.'
        write: 'Cobalt-60 is also used in radiotherapy'
      - section: 'Remember'
        say: 'To remember it, cobalt for cracks, and both start with C.'
        write: 'Cobalt for cracks'
      - section: 'Answer'
        say: 'So the radioisotope used for checking welds and castings is cobalt sixty, which is option C.'
        write: '$\therefore$ cobalt-60'
        answer: true
    traps:
      A: 'You went for carbon fourteen. Carbon fourteen is used to find the age of old wood and bones, not to check welds.'
      B: 'You went for phosphorus thirty-two. It gives out beta particles and is used as a tracer in plants and in medicine.'
      D: 'You went for iodine one three one. It is a famous isotope, but it is used to study and treat the thyroid gland.'
  7:
    moments:
      - section: 'The question'
        say: 'Fluorine has nine electrons. How many of its p electrons are left without a partner?'
        write: 'Unpaired electrons in the p-orbitals of F = ?'
      - say: 'Fluorine has atomic number nine, so it has nine electrons to place.'
        write: 'F: $Z = 9$'
      - section: 'The rule'
        say: 'Electrons fill the levels in order. We fill one s first, then two s, then two p.'
        write: 'Order: 1s, 2s, 2p'
      - say: 'Each orbital is a box that holds at most two electrons. An s level has one box, and a p level has three boxes.'
        write: 's: 1 box, p: 3 boxes; each box holds 2 electrons'
      - say: 'Hund''s rule says put one electron in each p box before pairing any.'
        write: 'Hund''s rule: fill singly, then pair'
      - section: 'The working'
        say: 'Two go into one s, two into two s, and five are left for two p. The small raised number after each level is the number of electrons in it.'
        write: 'F: 1s² 2s² 2p⁵'
      - say: 'Put the five p electrons in the three boxes. One goes in each box first, which makes three, and then the last two pair up with the first two.'
        write: '2p: [↑↓] [↑↓] [↑]'
      - say: 'Only one box holds a single arrow, so there is one unpaired electron.'
        write: 'Unpaired p electrons = 1'
      - section: 'The check'
        say: 'Check. That one unpaired electron is why fluorine forms just one bond, as in F₂ and HF.'
        write: 'One bond: $\ce{F-F}$, $\ce{H-F}$ ✓'
      - section: 'Answer'
        say: 'So a fluorine atom has one unpaired p electron, which is option C.'
        write: '$\therefore$ 1 unpaired electron'
        answer: true
    traps:
      A: 'You went for three. That counts the three p orbitals, not the single electrons in them. Three unpaired electrons fits nitrogen.'
      B: 'You went for zero. That fits neon, with six p electrons all paired. Fluorine has five, so one is left single.'
      D: 'You went for two. That fits oxygen, with four p electrons. Fluorine has five, which leaves only one single.'
  8:
    moments:
      - section: 'The question'
        say: 'Alpha, beta and gamma all come from a radioactive nucleus. Which one ionizes the least?'
        write: 'Radioactive emission with the least ionizing power = ?'
      - section: 'The rule'
        say: 'The rule is that ionizing power goes down as penetrating power goes up.'
        write: 'More penetrating $\Rightarrow$ less ionizing'
      - section: 'The three emissions'
        say: 'Alpha particles are heavy and carry a charge of plus two. They knock electrons off many atoms and are stopped by a sheet of paper.'
        write: '$\alpha$: heavy, charge +2, stopped by paper, most ionizing'
      - say: 'Beta particles are fast electrons with a charge of minus one. They ionize less and are stopped by a thin sheet of aluminium.'
        write: '$\beta$: light, charge −1, stopped by aluminium'
      - say: 'Gamma rays have no charge and no mass. They ionize the least and pass through thick lead.'
        write: '$\gamma$: no charge, no mass, least ionizing'
      - say: 'So the order of ionizing power is alpha, then beta, then gamma.'
        write: 'Ionizing power: $\alpha > \beta > \gamma$'
      - section: 'Answer'
        say: 'So the emission with the least ionizing power is gamma rays, which is option C.'
        write: '$\therefore$ $\gamma$-rays'
        answer: true
    traps:
      A: 'You went for alpha particles. They are the most ionizing of all, because they are heavy and doubly charged.'
      B: 'You went for X rays. They are weakly ionizing, but they are not emitted by a radioactive nucleus.'
      D: 'You went for beta particles. They carry a charge, so they ionize more than gamma rays.'
  9:
    moments:
      - section: 'The question'
        say: 'Carbon four oxide is the gas we breathe out. What shape is its molecule?'
        write: 'Shape of $\ce{CO2}$ = ?'
      - section: 'The rule'
        say: 'The rule is that electron pairs around a central atom push each other as far apart as possible.'
        write: 'Electron pairs repel and spread out as far as possible'
      - section: 'The structure'
        say: 'In CO₂, carbon sits in the middle with a double bond to each oxygen.'
        write: '$\ce{O=C=O}$'
      - say: 'Carbon uses all four of its outer electrons in the two double bonds, so it has no lone pairs. A double bond points one way, so it counts as one region. That is two regions of electrons.'
        write: 'Carbon: 2 double bonds, 0 lone pairs $\Rightarrow$ 2 regions'
      - say: 'Two regions get furthest apart on opposite sides, at one hundred and eighty degrees.'
        write: 'Bond angle = 180° $\Rightarrow$ linear'
      - section: 'The check'
        say: 'Compare water. Oxygen in water has two lone pairs, which bend the molecule. Carbon here has none.'
        write: '$\ce{H2O}$: 2 lone pairs, angular; $\ce{CO2}$: none, linear'
      - section: 'Answer'
        say: 'So carbon four oxide is a linear molecule, which is option B.'
        write: '$\therefore$ $\ce{CO2}$ is linear'
        answer: true
    traps:
      A: 'You went for pyramidal. That needs three bonds and one lone pair on the central atom, as in ammonia, NH₃.'
      C: 'You went for angular. That needs lone pairs on the central atom, as in water. Carbon in CO₂ has none.'
      D: 'You went for tetrahedral. That needs four bond pairs, as in methane, CH₄.'
  10:
    moments:
      - section: 'The question'
        say: 'Here are four molecules, each with hydrogen in it. Only one of them is held together by hydrogen bonds. Which one?'
        write: 'Hydrogen bonding: $\ce{CH4}$, $\ce{HBr}$, $\ce{H2S}$ or $\ce{HF}$?'
      - section: 'The rule'
        say: 'The rule is that a hydrogen bond forms only when hydrogen is joined to a small, very electronegative atom, which is fluorine, oxygen or nitrogen.'
        write: 'Hydrogen bond needs H joined to F, O or N'
      - section: 'Test each one'
        say: 'In methane, CH₄, hydrogen is joined to carbon, which is not on the list.'
        write: '$\ce{CH4}$: H on C ✗'
      - say: 'In HBr, hydrogen is joined to bromine, which is not on the list either.'
        write: '$\ce{HBr}$: H on Br ✗'
      - say: 'In H₂S, hydrogen is joined to sulphur, which is also not on the list.'
        write: '$\ce{H2S}$: H on S ✗'
      - say: 'Only in HF is hydrogen joined to fluorine, the most electronegative element of all.'
        write: '$\ce{H-F}$: H on F ✓'
      - section: 'Why it works'
        say: 'Fluorine pulls the shared electrons hard, leaving the hydrogen slightly positive. That hydrogen is drawn to a lone pair on the next fluorine.'
        write: '$\text{H}^{\delta+}\!-\!\text{F}^{\delta-} \cdots \text{H}^{\delta+}\!-\!\text{F}^{\delta-}$'
      - section: 'The check'
        say: 'This is why HF boils at about twenty degrees Celsius, while HBr is a gas far below zero.'
        write: 'b.p. of $\ce{HF}$ ≈ 20 °C; b.p. of $\ce{HBr}$ ≈ −67 °C'
      - section: 'Answer'
        say: 'So the molecule held together by hydrogen bonds is HF, which is option D.'
        write: '$\therefore$ $\ce{HF}$'
        answer: true
    traps:
      A: 'You went for CH₄. Carbon is not electronegative enough, so methane has only weak van der Waals forces.'
      B: 'You went for HBr. Hydrogen is joined to a halogen, but bromine is too large and not electronegative enough.'
      C: 'You went for H₂S. Sulphur is too large and not electronegative enough, so H₂S has no hydrogen bonding and is a gas.'
  11:
    moments:
      - section: 'The question'
        say: 'Two electron configurations, and we must name the bond between the two elements. First, let us find out who they are.'
        write: 'Bond between 1s² 2s² 2p⁶ 3s² and 1s² 2s² 2p⁴ = ?'
      - section: 'Name the elements'
        say: 'The small raised numbers count the electrons, so add them up. In the first, two plus two plus six plus two is twelve electrons. An atom with twelve electrons has atomic number twelve, so it is magnesium.'
        write: '2 + 2 + 6 + 2 = 12 $\Rightarrow$ Mg'
      - say: 'The second has two plus two plus four, which is eight electrons, so it is oxygen.'
        write: '2 + 2 + 4 = 8 $\Rightarrow$ O'
      - section: 'The rule'
        say: 'The rule is that a metal which loses electrons easily and a non-metal which gains them easily form an ionic bond.'
        write: 'Metal + non-metal $\Rightarrow$ electron transfer $\Rightarrow$ ionic bond'
      - section: 'The transfer'
        say: 'Magnesium is a group two metal. It loses its two outer electrons to become Mg²⁺.'
        write: '$\ce{Mg -> Mg^2+ + 2e-}$'
      - say: 'Oxygen is a non-metal with six outer electrons. It gains those two electrons to become O²⁻.'
        write: '$\ce{O + 2e- -> O^2-}$'
      - say: 'The two ions attract each other strongly, giving magnesium oxide.'
        write: '$\ce{Mg^2+O^2-}$, magnesium oxide'
      - section: 'Answer'
        say: 'So the bond is ionic, which is option D.'
        write: '$\therefore$ ionic bond'
        answer: true
    traps:
      A: 'You went for metallic. Metallic bonding holds atoms of a metal together. Here a metal is bonded to a non-metal.'
      B: 'You went for covalent. Covalent bonds form when two non-metals share electrons, but magnesium is a metal.'
      C: 'You went for dative. A dative bond needs one atom to donate a lone pair. Here electrons are fully transferred.'
  12:
    moments:
      - section: 'The question'
        say: 'Air is a mixture of gases. Which one waters down the air, the way water waters down concentrated zobo?'
        write: 'Constituent of air that acts as a diluent = ?'
      - section: 'The meaning'
        say: 'A diluent is something that makes a mixture less strong by spreading it out.'
        write: 'Diluent: makes a mixture less concentrated'
      - say: 'Air is about seventy-eight percent nitrogen and twenty-one percent oxygen. The rest is less than one percent.'
        write: 'Air: $\ce{N2}$ ≈ 78%, $\ce{O2}$ ≈ 21%, others < 1%'
      - section: 'The fact'
        say: 'Nitrogen is unreactive and there is a lot of it, so it dilutes the oxygen.'
        write: '$\ce{N2}$: unreactive and plentiful $\Rightarrow$ diluent'
      - section: 'The reason'
        say: 'Without it, burning and rusting would be far too fast. A kerosene stove would flare dangerously.'
        write: 'Pure $\ce{O2}$ $\Rightarrow$ fierce burning'
      - section: 'Remember'
        say: 'To remember it, nitrogen is the water in the zobo, making the oxygen less fierce.'
        write: 'Nitrogen waters down oxygen'
      - section: 'Answer'
        say: 'So the diluent in air is nitrogen, which is option A.'
        write: '$\therefore$ nitrogen'
        answer: true
    traps:
      B: 'You went for carbon four oxide. It is only about zero point zero three percent of air, far too little to dilute anything.'
      C: 'You went for the noble gases. They are unreactive too, but they make up less than one percent of air.'
      D: 'You went for oxygen. Oxygen is the active gas, the one being diluted, not the diluent.'
  13:
    moments:
      - section: 'The question'
        say: 'Steam touches dry cobalt two chloride. What colour change do we see?'
        write: 'Anhydrous $\ce{CoCl2}$ + steam: colour from ? to ?'
      - section: 'The fact'
        say: 'The fact is that anhydrous cobalt two chloride is blue, and it turns pink when water is added.'
        write: 'Anhydrous $\ce{CoCl2}$: blue $\to$ pink with water'
      - section: 'The equation'
        say: 'Water joins the cobalt salt to form the hydrated salt, which is pink. The dot in the formula means six water molecules are held in each unit of the crystal.'
        write: '$\ce{CoCl2 + 6H2O -> CoCl2.6H2O}$'
      - say: 'Steam is just water as a gas, so it gives the same change.'
        write: 'Steam is water $\Rightarrow$ same change'
      - say: 'This colour change is a chemical test for water.'
        write: 'Blue $\to$ pink: test for water'
      - say: 'Do not mix it up with the other water test. Anhydrous copper two tetraoxosulphate six goes from white to blue.'
        write: 'Anhydrous $\ce{CuSO4}$: white $\to$ blue'
      - section: 'Remember'
        say: 'To remember it, cobalt paper is blue when dry and blushes pink when wet.'
        write: 'Cobalt: blue dry, pink wet'
      - section: 'Answer'
        say: 'So steam changes anhydrous cobalt two chloride from blue to pink, which is option C.'
        write: '$\therefore$ blue to pink'
        answer: true
    traps:
      A: 'You went for white to red. Neither colour fits. Dry cobalt two chloride is blue, and it turns pink.'
      B: 'You went for blue to white. The start is right, but water turns it pink, not white.'
      D: 'You went for white to blue. That is the other water test, with anhydrous copper two tetraoxosulphate six.'
  14:
    moments:
      - section: 'The question'
        say: 'Some solids take water from the air and stay solid. Others take so much that they dissolve. Which of these only takes water and stays solid?'
        write: 'Hygroscopic: $\ce{CuO}$, $\ce{MgCl2}$, $\ce{CaCl2}$ or $\ce{NaOH}$?'
      - section: 'The definitions'
        say: 'A hygroscopic substance absorbs moisture from the air but does not dissolve in it.'
        write: 'Hygroscopic: absorbs moisture, stays solid'
      - say: 'A deliquescent substance absorbs so much moisture that it dissolves and forms a solution.'
        write: 'Deliquescent: absorbs moisture, dissolves into a solution'
      - section: 'Test each one'
        say: 'For example, leave sodium hydroxide pellets open in a humid Lagos laboratory, and by morning they are a wet puddle. So sodium hydroxide is deliquescent.'
        write: '$\ce{NaOH}$ becomes a solution: deliquescent'
      - say: 'Calcium chloride and magnesium chloride do the same, so they are deliquescent too.'
        write: '$\ce{CaCl2}$, $\ce{MgCl2}$ become solutions: deliquescent'
      - say: 'Copper two oxide takes up water from the air but stays a solid powder. So it is hygroscopic.'
        write: '$\ce{CuO}$ absorbs moisture, stays solid: hygroscopic'
      - section: 'Remember'
        say: 'To remember it, deliquescent has the word liquid hiding inside it, because it ends up as a liquid.'
        write: 'De-LIQU-escent $\to$ ends as a liquid'
      - section: 'Answer'
        say: 'So the hygroscopic substance is copper two oxide, which is option A.'
        write: '$\therefore$ $\ce{CuO(s)}$'
        answer: true
    traps:
      B: 'You went for MgCl₂. Magnesium chloride is deliquescent, because it dissolves in the water it absorbs.'
      C: 'You went for CaCl₂. It is a well-known drying agent, but it takes in so much water that it dissolves, which is deliquescence.'
      D: 'You went for NaOH. Sodium hydroxide pellets become wet and dissolve in air, so they are deliquescent.'
  15:
    moments:
      - section: 'The question'
        say: 'Twenty-four point four grams of lead two trioxonitrate five dissolves in forty-two grams of water. What is its solubility in grams per decimetre cubed?'
        write: '24.4 g solute in 42 g water at 20 °C; solubility in g dm⁻³ = ?'
      - section: 'The rule'
        say: 'Solubility in grams per decimetre cubed is the mass of solute divided by the volume of solvent in decimetres cubed.'
        write: 'Solubility $= \dfrac{\text{mass of solute (g)}}{\text{volume of solvent (dm}^3)}$'
      - section: 'Convert the units'
        say: 'Water has a density of one gram per centimetre cubed, so forty-two grams of water is forty-two centimetres cubed.'
        write: '42 g water = 42 cm³'
      - say: 'There are one thousand centimetres cubed in a decimetre cubed. So forty-two centimetres cubed is zero point zero four two decimetres cubed.'
        write: '42 cm³ $= \dfrac{42}{1000}$ dm³ $= 0.042$ dm³'
      - section: 'The working'
        say: 'Now divide twenty-four point four grams by zero point zero four two decimetres cubed.'
        write: 'Solubility $= \dfrac{24.4}{0.042}$ g dm⁻³'
      - say: 'That comes to about five hundred and eighty-one grams per decimetre cubed.'
        write: '$= 580.95 \approx 581$ g dm⁻³'
      - section: 'The check'
        say: 'Check. A decimetre cubed is about twenty-four times forty-two centimetres cubed, so it holds about twenty-four times twenty-four point four grams. That is close to five hundred and eighty.'
        write: 'Check: $1000 \div 42 \approx 24$, and $24 \times 24.4 \approx 586$ ✓'
      - section: 'Answer'
        say: 'So the solubility is five hundred and eighty-one grams per decimetre cubed, which is option A.'
        write: '$\therefore$ solubility = 581 g dm⁻³'
        answer: true
    traps:
      B: 'You went for zero point five eight one. That divides by forty-two and then by a thousand, turning the volume change the wrong way round. Divide by zero point zero four two instead.'
      C: 'You went for five point eight one. The decimal point has slipped two places. Forty-two centimetres cubed is zero point zero four two decimetres cubed.'
      D: 'You went for fifty-eight point one. The decimal point has slipped one place. A decimetre cubed of water would hold far more, so the answer is in the hundreds.'
  16:
    moments:
