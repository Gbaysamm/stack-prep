      - section: 'The rule'
        say: 'The IUPAC rule is to take the longest chain that contains the double bond, and number it from the end that gives the double bond the lowest number.'
        write: 'Longest chain with the C=C; lowest number for the C=C'
      - section: 'Name it'
        say: 'The chain has five carbons and a double bond, so it is a pentene.'
        write: '5 carbons + C=C $\Rightarrow$ pentene'
      - say: 'Start at the right, at the CH₂ of the double bond. The double bond is between carbon one and carbon two.'
        write: 'Number from the right: C=C between C-1 and C-2 $\Rightarrow$ pent-1-ene'
      - say: 'Counting on, the carbon with the methyl branch is carbon four.'
        write: 'Methyl on C-4'
      - say: 'Put the branch first. The name is four methylpent one ene.'
        write: '4-methylpent-1-ene'
      - section: 'The check'
        say: 'Check from the other end. That would give the double bond the number four, which is higher, so the right end is correct.'
        write: 'Check: from the left the C=C would be at 4, higher than 1 ✓'
      - section: 'Answer'
        say: 'So the IUPAC name is four methylpent one ene, which is option A.'
        write: '$\therefore$ 4-methylpent-1-ene'
        answer: true
    traps:
      B: 'You went for three methylpent two ene. That moves the double bond and the branch to places they are not.'
      C: 'You went for two methylpent one ene. That puts the methyl on a carbon of the double bond, but here the branch is far from it.'
      D: 'You went for two methylpent four ene. That numbers from the wrong end. The double bond must get the lowest number.'
  50:
    moments:
      - section: 'The question'
        say: 'A compound has sixty percent carbon, thirteen point three percent hydrogen and twenty-six point seven percent oxygen. What is the simplest formula?'
        write: 'C 60%, H 13.3%, O 26.7%  [C = 12, H = 1, O = 16]; empirical formula = ?'
      - section: 'The rule'
        say: 'Divide each percentage by its relative atomic mass to get moles. Then divide by the smallest to get the simplest whole number ratio.'
        write: 'Moles = % ÷ $A_r$, then divide by the smallest'
      - section: 'The working'
        say: 'Carbon is sixty divided by twelve, which is five.'
        write: 'C: $60 \div 12 = 5.0$'
      - say: 'Hydrogen is thirteen point three divided by one, which is thirteen point three.'
        write: 'H: $13.3 \div 1 = 13.3$'
      - say: 'Oxygen is twenty-six point seven divided by sixteen, which is one point six seven.'
        write: 'O: $26.7 \div 16 = 1.67$'
      - say: 'The smallest is one point six seven, so we divide each one by it. Carbon is five divided by one point six seven, which is three.'
        write: 'C: $5.0 \div 1.67 = 3$'
      - say: 'Hydrogen is thirteen point three divided by one point six seven, which is eight.'
        write: 'H: $13.3 \div 1.67 = 8$'
      - say: 'Oxygen is one point six seven divided by itself, which is one.'
        write: 'O: $1.67 \div 1.67 = 1$'
      - say: 'The ratio is three to eight to one, so the empirical formula is C₃H₈O.'
        write: 'C : H : O = 3 : 8 : 1 $\Rightarrow$ $\ce{C3H8O}$'
      - section: 'The check'
        say: 'Check. Its mass is thirty-six plus eight plus sixteen, which is sixty, and thirty-six over sixty is sixty percent carbon, as given.'
        write: 'Check: $36 + 8 + 16 = 60$; $\dfrac{36}{60} \times 100 = 60\%$ ✓'
      - section: 'Answer'
        say: 'So the empirical formula is C₃H₈O, which is option B.'
        write: '$\therefore$ empirical formula = $\ce{C3H8O}$'
        answer: true
    traps:
      A: 'You went for C₅H₁₂O. That uses the mole numbers five and thirteen before dividing by the smallest.'
      C: 'You went for C₆H₁₃O₂. That ratio gives only about eleven percent hydrogen, not thirteen point three.'
      D: 'You went for C₄H₉O. That ratio gives about sixty-six percent carbon, not sixty.'
