      - section: 'Answer'
        say: 'So p H is log to base ten of one over the hydroxonium ion concentration, which is option B.'
        write: '$\therefore$ pH $= \log_{10}\dfrac{1}{[\ce{H3O+}]}$'
        answer: true
    traps:
      A: 'You went for A. That uses the hydroxide ion, which belongs to p O H, and it even loses the minus sign.'
