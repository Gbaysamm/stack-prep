        write: '$\therefore Q \approx 30\,156.3$ C'
        answer: true
    traps:
      A: 'You went for thirty-two thousand three hundred and ninety-five point five. That does not fit ten grams of copper with two electrons per ion. Ten over sixty-four, times two, times ninety-six thousand five hundred gives thirty thousand one hundred and fifty-six point three.'
      C: 'You chose sixty thousand seven hundred and eighty-four point five. That is about double the right charge, as if each copper ion needed four electrons.'
      D: 'You picked fifteen thousand one hundred and ninety-six point five. That is about half the right charge, close to using one electron per copper ion. Copper two needs two.'
