        write: 'pH $= \log_{10}\dfrac{1}{[\ce{H3O+}]}$'
      - section: 'Check'
        say: 'Check with pure water. Its hydrogen ion concentration is ten to the minus seven moles per decimetre cubed.'
        write: '$[\ce{H3O+}] = 10^{-7}$ mol dm⁻³'
      - say: 'Log of one over ten to the minus seven is log of ten to the seven, which is seven. That is the neutral p H, so it works.'
