  27:
    moments:
      - section: 'The question'
        say: 'We know the free energy change and the entropy change, and we want the enthalpy change. One small step catches many students, and that is the temperature.'
        write: '$\Delta G = -899$ J mol⁻¹, $\Delta S = 10$ J mol⁻¹ K⁻¹, 25 °C;  $\Delta H = ?$'
      - section: 'The rule'
        say: 'The Gibbs equation says delta G equals delta H minus T delta S.'
