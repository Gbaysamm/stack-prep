        write: '$Q = n(\ce{e-}) \times F$'
      - section: 'The equation'
        say: 'At the cathode, each copper two ion takes two electrons.'
        write: '$\ce{Cu^2+ + 2e- -> Cu}$'
      - say: 'So two moles of electrons deposit one mole of copper, which is sixty-four grams.'
        write: '2 mol of electrons (2 × 96 500 C) → 1 mol Cu (64 g)'
      - section: 'The working'
        say: 'The moles of copper in ten grams is ten over sixty-four, which is zero point one five six two five moles.'
        write: '$n(\ce{Cu}) = \dfrac{10}{64} = 0.15625$ mol'
      - say: 'The moles of electrons is twice that, which is zero point three one two five moles.'
        write: '$n(\ce{e-}) = 2 \times 0.15625 = 0.3125$ mol'
      - say: 'Multiply by ninety-six thousand five hundred. That gives thirty thousand, one hundred and fifty-six point two five coulombs.'
        write: '$Q = 0.3125 \times 96\,500 = 30\,156.25$ C'
      - section: 'Check'
        say: 'Check. A whole mole of copper would need one hundred and ninety-three thousand coulombs. Ten grams is about one sixth of a mole, and thirty thousand is about one sixth of that charge.'
        write: '$\dfrac{30\,156}{193\,000} \approx 0.156 = \dfrac{10}{64}$ ✓'
      - section: 'Answer'
