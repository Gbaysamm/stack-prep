# UTME 2014 Chemistry, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the Nigerian classroom way: the question, the rule in
# words then written, the balanced equation, the working one step per moment, the check, and the
# answer moment that names the option. traps gives one kind line for each wrong option.
#
#   say:    heard, not read. No symbols the voice would mangle; formulae spelled out, units in words.
#   write:  the one line written while it is said, with mhchem for formulae.
#   answer: true on the moment that gives the answer.
#
# Keyed on question number, like explanations_2014.yaml. Answers match that file.
format_version: 1
exam_year: 2014
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'A mixture and a compound can hold the very same elements. So what really makes them different? Let us find out.'
        write: 'Mixture or compound, what is the difference?'
      - section: 'The definitions'
        say: 'A compound is two or more elements chemically combined in a fixed ratio.'
        write: 'Compound = elements chemically combined, fixed ratio, e.g. $\ce{NaCl}$'
      - say: 'A mixture is two or more substances only mixed together, in any ratio, with no new bonds.'
        write: 'Mixture = substances physically mixed, any ratio, e.g. sand and water'
      - section: 'The reason'
        say: 'Because the parts of a compound are bonded, only a chemical reaction can pull them apart. A mixture can be separated by filtering or distilling.'
        write: 'Compound → chemical reaction to separate;  mixture → physical methods'
      - section: 'An example'
        say: 'Garri and sugar in water stay garri and sugar, you can taste both. But sodium, a fierce metal, and chlorine, a poisonous gas, combine into the salt we cook with.'
        write: '$\ce{2Na + Cl2 -> 2NaCl}$  (new properties)'
      - section: 'Remember'
        say: 'So remember it this way. Compound means bonded, mixture means just mixed.'
        write: 'Compound = bonded;  mixture = just mixed'
      - section: 'Answer'
        say: 'The constituents of a compound are chemically bound together, while those of a mixture are not. That is option C.'
        write: '$\therefore$ constituents of a compound are chemically bound'
        answer: true
    traps:
      A: 'You went for A, but it is the other way round. A mixture keeps the properties of its parts, while a compound has new properties of its own, like salt from sodium and chlorine.'
      B: 'You chose B. A mixture is not always the same all through. Sand in water is a mixture you can see is uneven, while a compound is always uniform.'
      D: 'You picked D, which is reversed. A compound has a fixed formula like N a C l, while a mixture has no fixed composition.'
  3:
    moments:
      - section: 'The question'
        say: 'Sulphur four oxide is the gas from burning sulphur. What share of its mass is sulphur? Many students count atoms here, and that is the trap.'
        write: '% S in sulphur(IV) oxide $= ?$  [S = 32, O = 16]'
      - section: 'The formula'
        say: 'The four in the name tells us sulphur is plus four. Oxygen is minus two, so we need two oxygens, and the formula is S O two.'
        write: 'S(+4), O(−2) → $\ce{SO2}$'
      - section: 'The rule'
        say: 'Percentage by mass of an element is the mass of that element in one mole, divided by the molar mass, times one hundred.'
        write: '% element $= \dfrac{\text{mass of element}}{\text{molar mass}} \times 100$'
      - section: 'The working'
        say: 'The molar mass of S O two is thirty-two plus two times sixteen, which is sixty-four grams per mole.'
        write: '$M(\ce{SO2}) = 32 + 2(16) = 64\ \text{g mol}^{-1}$'
      - say: 'Sulphur gives thirty-two grams of that. So the percentage is thirty-two over sixty-four, times one hundred.'
        write: '% S $= \dfrac{32}{64} \times 100$'
      - say: 'Thirty-two over sixty-four is one half, and half of one hundred is fifty.'
        write: '$= 50\%$'
      - section: 'Check'
        say: 'Check. Sulphur weighs thirty-two, and the two oxygens together also weigh thirty-two. Equal masses, so half each. It agrees.'
        write: 'S = 32, O₂ = 32 → half each ✓'
      - section: 'Answer'
        say: 'So sulphur is fifty percent of the mass of sulphur four oxide, which is option D.'
        write: '$\therefore$ % S $= 50\%$'
        answer: true
    traps:
      A: 'You went for sixty-six percent. That is two out of three atoms, the oxygens, counted by number. Percentage by mass uses masses, and sulphur is half the mass.'
      B: 'You chose twenty-five percent. That would make sulphur one quarter of the mass, but thirty-two out of sixty-four is one half.'
      C: 'You picked forty percent. That is the value for sulphur six oxide, S O three, where thirty-two over eighty is forty percent. Sulphur four oxide is S O two.'
  4:
    moments:
      - section: 'The question'
        say: 'Gas X runs twice as fast as gas Y, and X has a relative molecular mass of thirty-two. Is Y heavier or lighter? That decides everything.'
        write: 'rate of X $= 2 \times$ rate of Y;  $M_X = 32$;  $M_Y = ?$'
      - section: 'The rule'
        say: 'Graham''s law of diffusion says the rate of diffusion of a gas is inversely proportional to the square root of its relative molecular mass.'
        write: 'Graham''s law: rate $\propto \dfrac{1}{\sqrt{M}}$'
      - say: 'For two gases, the rate of X over the rate of Y equals the square root of M of Y over M of X.'
        write: '$\dfrac{r_X}{r_Y} = \sqrt{\dfrac{M_Y}{M_X}}$'
      - section: 'Substitute'
        say: 'The ratio of the rates is two, and M of X is thirty-two.'
        write: '$2 = \sqrt{\dfrac{M_Y}{32}}$'
      - say: 'Square both sides to remove the square root. Two squared is four.'
        write: '$4 = \dfrac{M_Y}{32}$'
      - say: 'Multiply both sides by thirty-two. Four times thirty-two is one hundred and twenty-eight.'
        write: '$M_Y = 4 \times 32 = 128$'
      - section: 'Check'
        say: 'Check. Y is the slower gas, so it must be the heavier one. One hundred and twenty-eight is heavier than thirty-two. Good.'
        write: 'slower gas ⇒ heavier gas, $128 > 32$ ✓'
      - section: 'Answer'
        say: 'So the relative molecular mass of Y is one hundred and twenty-eight, which is option A.'
        write: '$\therefore M_Y = 128$'
        answer: true
    traps:
      B: 'You went for eight. That divides thirty-two by four and makes Y lighter. But Y is the slower gas, so it must be heavier.'
      C: 'You chose sixteen. That halves thirty-two and makes Y lighter, but the slower gas is always the heavier one.'
      D: 'You picked sixty-four. That multiplies by two and forgets to square it. The rate goes with the square root of the mass, so the mass grows by two squared, which is four.'
  5:
    moments:
      - section: 'The question'
        say: 'A gas grows from two hundred to three hundred and fifty centimetres cubed, and warms up at the same time. Both changes act on the pressure, so we need the general gas equation.'
        write: 'V₁ = 200 cm³, T₁ = 25 °C, P₁ = 700 mmHg;  V₂ = 350 cm³, T₂ = 75 °C, P₂ = ?'
      - section: 'The rule'
        say: 'The general gas equation says P one V one over T one equals P two V two over T two, with temperatures in kelvin.'
        write: '$\dfrac{P_1V_1}{T_1} = \dfrac{P_2V_2}{T_2}$'
      - section: 'Convert to kelvin'
        say: 'Add two hundred and seventy-three to each temperature. Twenty-five degrees Celsius becomes two hundred and ninety-eight kelvin.'
        write: 'T₁ = 25 + 273 = 298 K'
      - say: 'And seventy-five degrees Celsius becomes three hundred and forty-eight kelvin.'
        write: 'T₂ = 75 + 273 = 348 K'
      - section: 'Rearrange'
        say: 'Make P two the subject. P two equals P one V one T two, over T one V two.'
        write: '$P_2 = \dfrac{P_1V_1T_2}{T_1V_2}$'
      - section: 'Substitute'
        say: 'Put in the numbers. Seven hundred times two hundred times three hundred and forty-eight, over two hundred and ninety-eight times three hundred and fifty.'
        write: '$P_2 = \dfrac{700 \times 200 \times 348}{298 \times 350}$ mmHg'
      - say: 'Seven hundred over three hundred and fifty is two. So the top becomes two times two hundred times three hundred and forty-eight, which is one hundred and thirty-nine thousand two hundred.'
        write: '$= \dfrac{2 \times 200 \times 348}{298} = \dfrac{139\,200}{298}$'
      - say: 'Divide by two hundred and ninety-eight. That gives four hundred and sixty-seven point one one millimetres of mercury.'
        write: '$= 467.11$ mmHg'
      - section: 'Check'
        say: 'Check. The bigger volume alone would drop the pressure to four hundred. The warmer gas pushes it up a little, so a little above four hundred makes sense.'
        write: 'volume change only: 700 × 200 ÷ 350 = 400;  warmer ⇒ a bit more ✓'
      - section: 'Answer'
        say: 'So the new pressure is four hundred and sixty-seven point one one millimetres of mercury, which is option C.'
        write: '$\therefore P_2 = 467.11$ mmHg'
        answer: true
    traps:
      A: 'You went for three hundred and forty-two point five three. That puts the temperatures upside down, with T one on top. A warmer gas pushes harder, so the pressure must end above four hundred.'
      B: 'You chose one thousand four hundred and thirty point five four. That swaps the volumes, as if the gas were squeezed. The gas grew bigger, so the pressure falls.'
      D: 'You picked four hundred. That is Boyle''s law alone and forgets the gas warmed from twenty-five to seventy-five degrees. The warming lifts the pressure to four hundred and sixty-seven point one one.'
  6:
    moments:
      - section: 'The question'
        say: 'Here is an electron configuration ending in three p five. Count carefully, because one option counts only part of the outer shell.'
        write: 'X: 1s² 2s² 2p⁶ 3s² 3p⁵'
      - section: 'The rule'
        say: 'For a main group element, the group number is the number of electrons in the outermost shell.'
        write: 'Group number = electrons in the outermost shell'
      - section: 'The working'
        say: 'The outermost shell is shell three. It holds the three s two electrons and the three p five electrons.'
        write: 'Shell 3: 3s² 3p⁵'
      - say: 'Two plus five is seven electrons in the outer shell.'
        write: '2 + 5 = 7 outer electrons'
      - say: 'Seven outer electrons means group seven, the halogens. All the electrons add up to seventeen, so X is chlorine.'
        write: 'Group VII (halogens);  2 + 8 + 7 = 17 → X is $\ce{Cl}$'
      - section: 'Check'
        say: 'Check. Chlorine needs just one more electron to fill its p sub-shell. That is why halogens form ions with a charge of minus one.'
        write: '3p⁵ + 1 electron → 3p⁶, $\ce{Cl-}$ ✓'
      - section: 'Answer'
        say: 'So element X is a halogen, which is option D.'
        write: '$\therefore$ X is a halogen'
        answer: true
    traps:
      A: 'You went for A. Three p five is one electron short of a full p sub-shell, which needs six.'
      B: 'You chose five outer electrons. That counts only the three p electrons and forgets the two three s electrons in the same shell. The outer shell holds seven.'
      C: 'You picked group two. Group two elements end in s two, with no p electrons in the outer shell. This one has seven outer electrons.'
  7:
    moments:
      - section: 'The question'
        say: 'Beryllium and aluminium are in different groups and different periods, yet they behave like twins. Why?'
        write: 'Why are $\ce{Be}$ and $\ce{Al}$ so alike?'
      - section: 'Where they sit'
        say: 'Beryllium is in period two, group two. Aluminium is in period three, group three.'
        write: '$\ce{Be}$: period 2, group II;  $\ce{Al}$: period 3, group III'
      - say: 'So aluminium is one step down and one step to the right of beryllium. They sit on a diagonal.'
        write: 'Be ↘ Al  (diagonal)'
      - section: 'The rule'
        say: 'This is the diagonal relationship. Some period two elements resemble the element just below and to the right of them.'
        write: 'Diagonal relationship: Li and Mg, Be and Al, B and Si'
      - section: 'The reason'
        say: 'Moving right makes the ion smaller and more charged, and moving down makes it bigger. The two effects cancel, so B e two plus and A l three plus have similar charge to size ratios.'
        write: '$\ce{Be^2+}$ and $\ce{Al^3+}$: similar charge ÷ size'
      - say: 'That is why both form amphoteric oxides and covalent chlorides. Like two cousins, they share the family look.'
        write: 'Both: amphoteric oxides, covalent chlorides'
      - section: 'Answer'
        say: 'So beryllium and aluminium are alike because they are positioned diagonally to each other, which is option D.'
        write: '$\therefore$ diagonal relationship'
        answer: true
    traps:
      A: 'You went for A. Both are metals, which is true, but most metals are not alike in this special way. Being metals does not explain why these two match so closely.'
      B: 'You chose same group. Beryllium is in group two and aluminium is in group three.'
      C: 'You picked same period. Beryllium is in period two and aluminium is in period three.'
  8:
    moments:
      - section: 'The question'
        say: 'Two elements differ in electronegativity by three point zero. Is that a small gap or a huge one? That tells us the bond.'
        write: 'Electronegativity difference of P and Q = 3.0'
      - section: 'The rule'
        say: 'Electronegativity is the pull of an atom on shared electrons. The bigger the difference between two atoms, the more ionic the bond.'
        write: 'Bigger difference ⇒ more ionic'
      - say: 'A difference near zero gives a covalent bond. Above about one point seven, the bond is ionic.'
        write: 'about 0 → covalent;  up to 1.7 → polar covalent;  above 1.7 → ionic'
      - section: 'The working'
        say: 'Three point zero is far above one point seven. The stronger atom pulls the electron right across, and the atoms become ions.'
        write: '3.0 > 1.7 ⇒ electron transfer ⇒ ions'
      - section: 'An example'
        say: 'Common salt is a good comparison. Sodium and chlorine differ by about two point one, and N a C l is ionic.'
        write: '$\ce{NaCl}$: difference ≈ 2.1, ionic ✓'
      - say: 'Think of a tug of war where one side is far stronger. The rope is not shared, it is simply taken.'
        write: 'Big gap: electrons taken, not shared'
      - section: 'Answer'
        say: 'So the bond between P and Q is ionic, which is option D.'
        write: '$\therefore$ ionic bond'
        answer: true
    traps:
      A: 'You went for metallic. Metallic bonding holds metal atoms together in a sea of electrons, with no electronegativity gap involved.'
      B: 'You chose covalent. Covalent bonds form when the difference is small, below about one point seven. Three point zero is large.'
      C: 'You picked co-ordinate. A dative bond comes from one atom donating a lone pair, not from a large electronegativity gap.'
  9:
    moments:
      - section: 'The question'
        say: 'Cobalt sixty has two numbers on its symbol. One option gives the electrons the wrong count, so read each number carefully.'
        write: '$\ce{^{60}_{27}Co}$: protons, neutrons, electrons $= ?$'
      - section: 'The rule'
        say: 'The top number is the mass number, which is protons plus neutrons. The bottom number is the atomic number, which is protons.'
        write: 'Mass number = protons + neutrons;  atomic number = protons'
      - section: 'The working'
        say: 'The bottom number is twenty-seven, so cobalt has twenty-seven protons.'
        write: 'protons = 27'
      - say: 'Neutrons are the mass number minus the atomic number. Sixty minus twenty-seven is thirty-three.'
        write: 'neutrons = 60 − 27 = 33'
      - say: 'A neutral atom has as many electrons as protons. So there are twenty-seven electrons.'
        write: 'electrons = protons = 27'
      - section: 'Check'
        say: 'Check. Twenty-seven protons plus thirty-three neutrons is sixty, the mass number. It agrees.'
        write: '27 + 33 = 60 ✓'
      - section: 'Answer'
        say: 'So cobalt sixty has twenty-seven protons, thirty-three neutrons and twenty-seven electrons, which is option C.'
        write: '$\therefore$ 27, 33 and 27'
        answer: true
    traps:
      A: 'You went for twenty-seven, thirty-three and thirty-three. That gives the electrons the neutron number. Electrons match the protons, twenty-seven.'
      B: 'You chose thirty-three, twenty-seven and twenty-seven. That swaps the protons and neutrons. The bottom number, twenty-seven, is the protons.'
      D: 'You picked sixty for the protons. Sixty is the mass number, protons and neutrons together. The protons are only twenty-seven.'
  10:
    moments:
      - section: 'The question'
        say: 'How do scientists see how atoms are arranged inside a huge molecule like D N A? No microscope can show it. They use a special radiation.'
        write: 'Radiation for studying particles in giant molecules $= ?$'
      - section: 'The fact'
        say: 'The method is called X-ray diffraction, or X-ray crystallography.'
        write: 'X-ray diffraction (X-ray crystallography)'
      - section: 'The reason'
        say: 'X-rays have a wavelength close to the distance between atoms. So the regular layers of atoms scatter them into a pattern of spots.'
        write: 'X-ray wavelength ≈ distance between atoms'
      - say: 'Scientists measure that pattern and work backwards to find where each atom sits.'
        write: 'pattern of spots → positions of atoms'
      - section: 'An example'
        say: 'This is how the double helix of D N A and the shapes of proteins were found.'
        write: 'e.g. DNA double helix, proteins'
      - section: 'Remember'
        say: 'Remember it this way. X marks the spot, and X-rays map the spots where atoms sit.'
        write: 'X-rays map the atoms'
      - section: 'Answer'
        say: 'So the radiation used is X-rays, which is option C.'
        write: '$\therefore$ X-rays'
        answer: true
    traps:
      A: 'You went for gamma rays. They are also electromagnetic, but their wavelength is far too short for a useful pattern. Gamma rays are used to kill germs and treat cancer.'
      B: 'You chose alpha particles. They are stopped by a few centimetres of air and are used in smoke detectors, not for mapping molecules.'
      D: 'You picked beta particles. They are used in thickness gauges and as tracers, not for studying how atoms are arranged.'
  11:
    moments:
      - section: 'The question'
        say: 'Silicon comes as three isotopes, mostly silicon twenty-eight. So the answer must be a little above twenty-eight. Let us see how much.'
        write: '$\ce{^{28}Si}$ 92%, $\ce{^{29}Si}$ 5%, $\ce{^{30}Si}$ 3%;  relative atomic mass $= ?$'
      - section: 'The rule'
        say: 'Relative atomic mass is the average mass of the isotopes, each one weighted by how much of it there is.'
        write: 'R.A.M. $= \sum$ (isotope mass × fraction)'
      - section: 'The working'
        say: 'Ninety-two percent is zero point nine two. Zero point nine two times twenty-eight is twenty-five point seven six.'
        write: '$0.92 \times 28 = 25.76$'
      - say: 'Zero point zero five times twenty-nine is one point four five.'
        write: '$0.05 \times 29 = 1.45$'
      - say: 'Zero point zero three times thirty is zero point nine.'
        write: '$0.03 \times 30 = 0.90$'
      - say: 'Add them up. Twenty-five point seven six plus one point four five plus zero point nine is twenty-eight point one one.'
        write: '$25.76 + 1.45 + 0.90 = 28.11$'
      - section: 'Check'
        say: 'Check. Most atoms weigh twenty-eight and a few are heavier, so the average is just above twenty-eight. Twenty-eight point one one fits.'
        write: '$28 < 28.11 < 30$ ✓'
      - section: 'Answer'
        say: 'So the relative atomic mass of silicon is twenty-eight point one one, which is option C.'
        write: '$\therefore$ R.A.M. $= 28.11$'
        answer: true
    traps:
      A: 'You went for fourteen. That is the atomic number of silicon, its number of protons, not its relative atomic mass.'
      B: 'You chose twenty-nine. That is a plain average of twenty-eight, twenty-nine and thirty, which ignores the percentages. Most silicon is mass twenty-eight.'
      D: 'You picked twenty-eight. That uses only the main isotope and ignores silicon twenty-nine and thirty, which pull the average a little higher.'
  12:
    moments:
      - section: 'The question'
        say: 'Nitrogen from air is slightly heavier than nitrogen made from compounds. Something sneaks into the nitrogen from air. What is it?'
        write: 'Density of $\ce{N2}$ from air > density of $\ce{N2}$ from compounds. Why?'
      - section: 'How it is made'
        say: 'To get nitrogen from air, we remove oxygen with hot copper, carbon four oxide with caustic soda, and water vapour with a drying agent.'
        write: 'air, minus $\ce{O2}$, $\ce{CO2}$ and $\ce{H2O}$ → "nitrogen"'
      - say: 'But the rare gases, mainly argon, react with nothing. They stay behind with the nitrogen.'
        write: 'rare gases (mainly $\ce{Ar}$) remain'
      - section: 'The reason'
        say: 'Argon has a relative atomic mass of forty, while N two is only twenty-eight. A little argon makes the gas a little denser.'
        write: '$\ce{Ar}$ = 40 > $\ce{N2}$ = 28'
      - say: 'Nitrogen made by heating ammonium nitrite, N H four N O two, is pure, so it is lighter.'
        write: '$\ce{NH4NO2 ->[heat] N2 + 2H2O}$'
      - section: 'A piece of history'
        say: 'This tiny difference in density is how Rayleigh and Ramsay discovered argon.'
        write: 'Rayleigh and Ramsay → argon discovered'
      - section: 'Answer'
        say: 'So nitrogen from air is contaminated with rare gases, which is option C.'
        write: '$\therefore$ rare gases'
        answer: true
    traps:
      A: 'You went for water vapour. It is removed by a drying agent during the preparation, so it is not left behind.'
      B: 'You chose oxygen. Oxygen is removed by passing the air over heated copper, so it is gone before the nitrogen is collected.'
      D: 'You picked carbon four oxide. It is removed by caustic soda during the preparation, so it does not stay with the nitrogen.'
  13:
    moments:
      - section: 'The question'
        say: 'Some borehole water leaves a white crust in the kettle and will not lather with soap. Which salts cause hardness that boiling can remove?'
        write: 'Temporary hardness is caused by $= ?$'
      - section: 'The fact'
        say: 'Temporary hardness comes from dissolved calcium hydrogen trioxocarbonate four and magnesium hydrogen trioxocarbonate four.'
        write: '$\ce{Ca(HCO3)2}$ and $\ce{Mg(HCO3)2}$'
      - section: 'The reason'
        say: 'It is called temporary because boiling breaks these salts down. The calcium comes out as C a C O three, which is insoluble.'
        write: '$\ce{Ca(HCO3)2 ->[heat] CaCO3 + H2O + CO2}$'
      - say: 'That white crust inside your kettle is the C a C O three that came out when the water boiled.'
        write: 'kettle crust = $\ce{CaCO3}$'
      - section: 'Permanent hardness'
        say: 'Permanent hardness comes from sulphates and chlorides, like C a S O four. Boiling does not remove them.'
        write: 'Permanent: $\ce{CaSO4}$, $\ce{MgSO4}$, $\ce{CaCl2}$'
      - section: 'Remember'
        say: 'Remember it this way. Hydrogen carbonates are temporary, sulphates are permanent.'
        write: '$\ce{HCO3-}$ → temporary;  $\ce{SO4^2-}$ → permanent'
      - section: 'Answer'
        say: 'So temporary hardness comes from calcium and magnesium hydrogen carbonates, which is option A.'
        write: '$\therefore$ $\ce{Ca(HCO3)2}$ and $\ce{Mg(HCO3)2}$'
        answer: true
    traps:
      B: 'You went for B. C a C O three is insoluble in water, so it cannot dissolve to make water hard. It is what boiling leaves behind.'
      C: 'You chose C. It includes C a S O four, which causes permanent hardness, not temporary.'
      D: 'You picked D. C a S O four causes permanent hardness, because boiling does not remove it.'
  14:
    moments:
      - section: 'The question'
        say: 'Leave washing soda crystals open on a table and they slowly crumble into white powder. What is that change called?'
        write: 'Hydrated salt loses its water of crystallization in air $= ?$'
      - section: 'The fact'
        say: 'This is efflorescence. A hydrated salt gives up its water of crystallization to the air and becomes anhydrous.'
        write: 'Efflorescence: hydrated salt → anhydrous salt + water to the air'
      - section: 'The equation'
        say: 'Washing soda, N a two C O three with ten waters, loses most of its water this way.'
        write: '$\ce{Na2CO3.10H2O -> Na2CO3.H2O + 9H2O}$'
      - section: 'The reason'
        say: 'It happens when the vapour pressure of the crystals is higher than that of the water vapour in the air. So the water escapes.'
        write: 'vapour pressure of crystals > vapour pressure of water in air'
      - section: 'The opposite'
        say: 'Deliquescence and hygroscopy are the opposite. There, the substance takes water in from the air.'
        write: 'deliquescent, hygroscopic → absorb water'
      - section: 'Remember'
        say: 'Remember it this way. Efflorescence, the water exits. Deliquescence, the solid dissolves in the water it drinks.'
        write: 'Efflorescence = water exits'
      - section: 'Answer'
        say: 'So the change is efflorescence, which is option A.'
        write: '$\therefore$ efflorescence'
        answer: true
    traps:
      B: 'You went for deliquescence. That is the opposite, a solid taking in so much water from the air that it dissolves, like caustic soda pellets.'
      C: 'You chose hygroscopy. A hygroscopic substance absorbs water from the air without dissolving, so water comes in, not out.'
      D: 'You picked hydrolysis. That is a reaction with water, not a loss of water to the air.'
  15:
    moments:
      - section: 'The question'
        say: 'Sixteen point five five grams of lead two nitrate dissolve in one hundred centimetres cubed of water. We want moles per decimetre cubed, so do not stop too early.'
        write: '16.55 g of $\ce{Pb(NO3)2}$ in 100 cm³;  solubility in mol dm⁻³ $= ?$  [Pb = 207, N = 14, O = 16]'
      - section: 'The rule'
        say: 'Solubility in moles per decimetre cubed is the number of moles that dissolve in one decimetre cubed, which is one thousand centimetres cubed.'
        write: 'Solubility $= \dfrac{\text{moles}}{\text{volume in dm}^3}$'
      - section: 'The formula'
        say: 'Lead is plus two and nitrate is minus one, so lead two trioxonitrate five is P b, N O three, in bracket two.'
        write: '$\ce{Pb^2+}$ and $\ce{NO3-}$ → $\ce{Pb(NO3)2}$'
      - section: 'Moles'
        say: 'The molar mass is two hundred and seven plus two times sixty-two, which is three hundred and thirty-one grams per mole.'
        write: '$M = 207 + 2(14 + 3 \times 16) = 207 + 124 = 331\ \text{g mol}^{-1}$'
      - say: 'Moles equal mass over molar mass. Sixteen point five five over three hundred and thirty-one is zero point zero five moles.'
        write: 'moles $= \dfrac{16.55}{331} = 0.05$ mol'
      - section: 'Convert the volume'
        say: 'Now the volume. One hundred centimetres cubed is zero point one decimetres cubed.'
        write: '100 cm³ $= \dfrac{100}{1000} = 0.1$ dm³'
      - section: 'Solubility'
