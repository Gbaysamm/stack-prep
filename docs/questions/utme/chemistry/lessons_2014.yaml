        say: 'The reactants, A plus B, start low on the left. The energy climbs to a peak at X, then drops to the products, C plus D, on the right.'
        write: 'A + B (low) → peak X → C + D (higher)'
      - section: 'The rule'
        say: 'The heat of reaction, delta H, is the gap between the energy of the reactants and the energy of the products.'
        write: '$\Delta H = H_{\text{products}} - H_{\text{reactants}}$'
      - say: 'Z runs from the level of A plus B to the level of C plus D. So Z is exactly that gap, delta H.'
        write: 'Z: from level of A + B to level of C + D ⇒ Z = $\Delta H$'
      - say: 'Here the products sit higher than the reactants, so heat was taken in. The reaction is endothermic and delta H is positive.'
        write: 'C + D above A + B ⇒ endothermic, $\Delta H > 0$'
      - section: 'Not to be confused'
        say: 'Activation energy is different. It is measured from the reactants up to the peak, not to the products.'
        write: '$E_a$: from A + B up to peak X'
      - section: 'Answer'
        say: 'So Z represents the heat of reaction, which is option A.'
        write: '$\therefore$ Z = heat of reaction'
        answer: true
    traps:
      B: 'You went for activation energy. That runs from the reactants up to the peak. Z stops at the level of the products, not the peak.'
