        write: 'T = 25 + 273 = 298 K'
      - section: 'The working'
        say: 'T delta S is two hundred and ninety-eight kelvin times ten joules per mole per kelvin. The kelvins cancel, leaving two thousand nine hundred and eighty joules per mole.'
        write: '$T\Delta S = 298 \times 10 = 2980$ J mol⁻¹'
      - say: 'Now delta H is minus eight hundred and ninety-nine plus two thousand nine hundred and eighty, which is plus two thousand and eighty-one joules per mole.'
        write: '$\Delta H = -899 + 2980 = +2081$ J mol⁻¹'
      - section: 'Check'
        say: 'Check. Two thousand and eighty-one minus two thousand nine hundred and eighty gives minus eight hundred and ninety-nine, the delta G we were given.'
        write: '$2081 - 2980 = -899$ ✓'
      - section: 'Answer'
        say: 'So the enthalpy change is plus two thousand and eighty-one joules per mole, which is option A.'
        write: '$\therefore \Delta H = +2081$ J mol⁻¹'
        answer: true
    traps:
      B: 'You went for minus two thousand and eighty-one. That subtracts T delta S when rearranging. Delta H equals delta G plus T delta S.'
      C: 'You chose minus six hundred and forty-nine. That uses twenty-five instead of two hundred and ninety-eight kelvin. The temperature in this equation must be in kelvin.'
      D: 'You picked plus six hundred and forty-nine. That uses twenty-five degrees instead of kelvin, and it also gets the sign wrong.'
  28:
