  39:
    moments:
      - section: 'The question'
        say: 'Endo means in. Hold on to that word, and this question answers itself.'
        write: 'Endothermic: heat is ____, symbol ____'
      - section: 'The rule'
        say: 'In an endothermic reaction, heat is absorbed from the surroundings.'
        write: 'Endothermic: heat absorbed'
      - say: 'So the products hold more energy than the reactants.'
        write: '$H_{\text{products}} > H_{\text{reactants}}$'
      - say: 'Delta H is the energy of the products minus the energy of the reactants, so it is positive.'
        write: '$\Delta H = H_{\text{products}} - H_{\text{reactants}} > 0$'
      - section: 'An example'
        say: 'Dissolving ammonium chloride in water is endothermic. The test tube feels cold in your hand.'
        write: 'Example: $\ce{NH4Cl}$ dissolving, the tube feels cold'
      - section: 'Check'
        say: 'Check. Exothermic is the opposite, with heat liberated and delta H negative.'
        write: 'Exothermic: liberated, $-\Delta H$ ✓'
      - section: 'Answer'
        say: 'So heat is absorbed and the symbol is plus delta H, which is option D.'
        write: '$\therefore$ absorbed, $+\Delta H$'
        answer: true
    traps:
      A: 'You went for A. Liberated heat and negative delta H describe an exothermic reaction, the opposite.'
      B: 'You went for B. Heat is absorbed in an endothermic reaction, not liberated.'
      C: 'You went for C. Absorbed is right, but absorbed heat makes delta H positive, not negative.'
  40:
    moments:
      - section: 'The question'
        say: 'The contact process, cooled from eight hundred to five hundred degrees. What happens to the S O two?'
        write: '$\ce{2SO2(g) + O2(g) <=> 2SO3(g)}$, exothermic; 800 °C to 500 °C'
      - section: 'The rule'
        say: 'Le Chatelier''s principle says lowering the temperature favours the direction that gives out heat.'
        write: 'Temperature ↓: favours the exothermic direction'
      - section: 'Apply it'
        say: 'The forward reaction is exothermic, so cooling shifts the equilibrium to the right.'
        write: 'Forward is exothermic, so the equilibrium shifts right'
      - say: 'Shifting right uses up more S O two and O two to make more S O three.'
        write: 'More $\ce{SO2}$ used, more $\ce{SO3}$ made'
      - say: 'So the concentration of S O two decreases.'
        write: 'Concentration of $\ce{SO2}$ ↓'
      - section: 'Check'
        say: 'Check the rate. At a lower temperature the molecules have less energy, so the reaction gets slower, not faster. But S O two still reacts.'
        write: 'Rate ↓ when cooled, but $\ce{SO2}$ still reacts ✓'
      - section: 'Answer'
        say: 'So the concentration of S O two decreases, which is option B.'
        write: '$\therefore$ the concentration of $\ce{SO2}$ decreases'
        answer: true
    traps:
      A: 'You went for A. A lower temperature gives the molecules less energy, so the rate decreases.'
      C: 'You went for C. That would happen if the temperature were raised. Cooling shifts this equilibrium forward.'
      D: 'You went for D. S O two still reacts at five hundred degrees. It just reacts more slowly.'
