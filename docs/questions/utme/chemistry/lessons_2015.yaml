# UTME 2015 Chemistry, lessons for the board.
#
# Each lesson is a run of MOMENTS, taught the way a good chemistry teacher works on the board:
# the question, the rule in words and then written, the balanced equation, the working with units
# one step per moment, the check, and the answer. Keyed on question number, like
# explanations_2015.yaml. Answers match that file. Q7 is not kept, so it has no lesson.
#
#   say:    what the teacher says, heard and not read. Formulae and units in words.
#   write:  the one line written while it is said, with mhchem for formulae.
#   answer: true on the moment that gives the answer.
#   traps:  said to a student who chose that wrong option, kindly.
format_version: 1
exam_year: 2015
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'Four statements about gases, and three of them sound like gas laws. The trick is to find the one that is true with no condition missing.'
        write: 'Which statement about a gas is always true?'
      - section: 'Kinetic theory'
        say: 'The kinetic theory tells us the average kinetic energy of gas molecules is directly proportional to the absolute temperature, which is the temperature in kelvin.'
        write: 'Kinetic theory: average K.E. $\propto T$ (in K)'
      - say: 'This needs no other condition. Heat any gas and its molecules move faster.'
        write: 'Statement A: true for every gas ✓'
      - section: 'Boyle''s law'
        say: 'Boyle''s law says the volume of a fixed mass of gas is inversely proportional to its pressure, but only at constant temperature.'
        write: 'Boyle''s law: $pV = \text{constant}$ at constant $T$'
      - say: 'So at constant temperature the volume falls as the pressure rises. Statement B says it rises, so B is false.'
        write: 'B: $p \uparrow$ gives $V \downarrow$, not $V \uparrow$ ✗'
      - say: 'Statement C is Boyle''s law with the condition left out. Without constant temperature, it is not always true.'
        write: 'C: needs "at constant temperature" ✗'
      - section: 'Charles''s law'
        say: 'Charles''s law says volume is directly proportional to absolute temperature, but only at constant pressure. Statement D leaves that out.'
        write: 'Charles''s law: $V \propto T$ at constant $p$, so D ✗'
      - section: 'Check'
        say: 'Check. Only A stands on its own, with no at constant something attached.'
        write: 'Only A needs no condition ✓'
      - section: 'Answer'
        say: 'So the true statement is that average kinetic energy is directly proportional to absolute temperature, which is option A.'
        write: '$\therefore$ average K.E. $\propto$ absolute temperature'
        answer: true
    traps:
      B: 'You went for B. At constant temperature, squeezing a gas makes its volume smaller, not bigger. Pressure up means volume down.'
      C: 'You went for C. It sounds like Boyle''s law, but Boyle''s law only holds at constant temperature, and the statement leaves that out.'
      D: 'You went for D. Volume follows absolute temperature only at constant pressure, and the statement leaves that out.'
  2:
    moments:
      - section: 'The question'
        say: 'Two formulae to name. The first has two parts joined by C O O, and the second has a triple bond between its carbons.'
        write: 'Name $\ce{HCOOCH3}$ and $\ce{HC#CH}$'
      - section: 'The rule for esters'
        say: 'An ester is named alkyl alkanoate. The alkyl part comes from the alcohol, and the alkanoate part comes from the acid.'
        write: 'Ester: alkyl (from the alcohol) + alkanoate (from the acid)'
      - say: 'In H C O O C H three, the acid part is H C O O, which has one carbon. So it is methanoate.'
        write: '$\ce{HCOO}$ part: 1 carbon, so methanoate'
      - say: 'The alkyl part is C H three, which has one carbon. So it is methyl, and the name is methyl methanoate.'
        write: '$\ce{CH3}$ part: methyl, so $\ce{HCOOCH3}$ = methyl methanoate'
      - section: 'The second compound'
        say: 'A hydrocarbon with a triple bond between carbons has a name ending in yne. One with a double bond ends in ene.'
        write: '$\ce{C#C}$ gives -yne; $\ce{C=C}$ gives -ene'
      - say: 'H C triple bond C H has two carbons and a triple bond, so it is ethyne.'
        write: '$\ce{HC#CH}$: 2 carbons, triple bond, so ethyne'
      - section: 'Check'
        say: 'Check. Methanoic acid and methanol, one carbon each, join to give exactly H C O O C H three.'
        write: '$\ce{HCOOH + CH3OH -> HCOOCH3 + H2O}$ ✓'
      - section: 'Answer'
        say: 'So the names are methyl methanoate and ethyne, which is option D.'
        write: '$\therefore$ methyl methanoate and ethyne'
        answer: true
    traps:
      A: 'You went for A. Methyl methanoate is right, but ethene has a double bond. A triple bond always gives a name ending in yne.'
      B: 'You went for B. Methanoic acid is H C O O H. Here the H of the acid has been replaced by C H three, which makes an ester.'
      C: 'You went for C. The alkyl part is C H three, with one carbon, so it is methyl, not ethyl.'
  3:
    moments:
      - section: 'The question'
        say: 'Two tests on solution X. First we find the ion in X, then we find what Y must contain.'
        write: 'X + $\ce{AgNO3}$: white ppt, soluble in $\ce{NH3(aq)}$. X + Y: white ppt, soluble on boiling'
      - section: 'Test one'
        say: 'A white precipitate with silver trioxonitrate five that dissolves in ammonia solution is silver chloride.'
        write: '$\ce{Ag+(aq) + Cl-(aq) -> AgCl(s)}$ (white)'
      - say: 'So X contains C l minus, the chloride ion.'
        write: 'X contains $\ce{Cl-}$'
      - section: 'Test two'
        say: 'Now Y gives a white chloride that dissolves when we boil it. The only common white chloride that dissolves in hot water is lead two chloride.'
        write: '$\ce{PbCl2}$: insoluble in cold water, soluble in hot water'
      - say: 'So Y brings P b two plus ions, and they meet the chloride ions in X.'
        write: '$\ce{Pb^2+(aq) + 2Cl-(aq) -> PbCl2(s)}$'
      - section: 'Check'
        say: 'Check. Let the hot solution cool, and white needles of lead two chloride come back. That is the classic test for lead.'
        write: 'On cooling, $\ce{PbCl2}$ crystals return ✓'
      - section: 'Answer'
        say: 'So solution Y contains the lead two ion, which is option B.'
        write: '$\therefore$ Y contains $\ce{Pb^2+}$'
        answer: true
    traps:
      A: 'You went for A. Silver ions would give silver chloride again, but silver chloride does not dissolve on boiling. Only lead two chloride does.'
      C: 'You went for C. Lead in solution is found as P b two plus. P b four plus ions are not found in simple solutions in water.'
      D: 'You went for D. Zinc chloride is soluble in water, so adding zinc ions to X gives no precipitate at all.'
  4:
    moments:
      - section: 'The question'
        say: 'Methane is the main gas flared in the Niger Delta oil fields. Which family of compounds does it belong to?'
        write: 'Methane, $\ce{CH4}$: which homologous series?'
      - section: 'The rule'
        say: 'A homologous series is a family of compounds with the same general formula. Each member differs from the next by C H two.'
        write: 'Homologous series: same general formula, members differ by $\ce{CH2}$'
      - say: 'Alkanes are saturated hydrocarbons, with only single bonds. Their general formula is C n H two n plus two.'
        write: 'Alkanes: $\ce{C_nH_{2n+2}}$'
      - section: 'Test methane'
        say: 'Put n equals one. Two times one plus two is four hydrogens, so we get C H four.'
        write: '$n = 1$: H atoms $= 2(1) + 2 = 4$, so $\ce{CH4}$ ✓'
      - say: 'Methane is the first alkane. Then come ethane, C two H six, and propane, C three H eight.'
        write: '$\ce{CH4}$, $\ce{C2H6}$, $\ce{C3H8}$, and so on'
      - section: 'Check'
        say: 'Check. Methane has no double bond, no O H group and no C O O group, so it can only be an alkane.'
        write: 'No double bond, no –OH, no –COO– ✓'
      - section: 'Answer'
        say: 'So methane belongs to the alkanes, which is option D.'
        write: '$\therefore$ methane is an alkane'
        answer: true
    traps:
      A: 'You went for alkenes. Alkenes need a carbon to carbon double bond, so the smallest alkene, ethene, has two carbons. Methane has only one.'
      B: 'You went for alcohols. Alcohols contain an O H group, and methane has no oxygen at all.'
      C: 'You went for esters. Esters contain the C O O group, and methane has no oxygen at all.'
  5:
    moments:
      - section: 'The question'
        say: 'Ammonium chloride hides three kinds of bond in one small crystal. Let us find all of them.'
        write: 'Bonds in $\ce{NH4Cl}$ = ?'
      - section: 'Between the ions'
        say: 'The crystal is made of ammonium ions and chloride ions. Opposite charges attract, so there is ionic bonding.'
        write: '$\ce{NH4+}$ and $\ce{Cl-}$: ionic bond'
      - section: 'Inside the ammonium ion'
        say: 'Ammonia, N H three, has three ordinary covalent bonds. Nitrogen and each hydrogen give one electron each to the shared pair.'
        write: '$\ce{NH3}$: three N–H covalent bonds'
      - say: 'A co-ordinate bond, also called a dative bond, is a shared pair where both electrons come from one atom.'
        write: 'Co-ordinate (dative) bond: both shared electrons from one atom'
      - say: 'Nitrogen in ammonia has a lone pair. It gives that pair to an H plus ion to make N H four plus.'
        write: '$\ce{NH3 + H+ -> NH4+}$ (lone pair donated)'
      - say: 'So the fourth N H bond is a co-ordinate bond.'
        write: 'Fourth N–H bond: co-ordinate'
      - section: 'Check'
        say: 'Check. Ionic between the ions, covalent and co-ordinate inside the ion. There is no metal, so there is no metallic bond.'
        write: 'ionic ✓ covalent ✓ co-ordinate ✓ metallic ✗'
      - section: 'Answer'
        say: 'So crystalline ammonium chloride has ionic, covalent and co-ordinate bonds, which is option C.'
        write: '$\therefore$ ionic, covalent and co-ordinate'
        answer: true
    traps:
      A: 'You went for A. That forgets the dative bond formed when ammonia gives its lone pair to H plus.'
      B: 'You went for B. That forgets the three ordinary covalent bonds inside the ammonium ion.'
      D: 'You went for D. There is no metal in ammonium chloride, so there is no metallic bond, and it leaves out the ionic bond.'
  6:
    moments:
      - section: 'The question'
        say: 'Blue copper two tetraoxosulphate six crystals were heated, and some of their water left. How many water molecules did each unit lose?'
        write: 'Crucible 10.00 g; + $\ce{CuSO4.5H2O}$ 14.98 g; + residue 13.54 g'
      - section: 'The plan'
        say: 'The mass lost on heating is the water driven off. We turn the hydrate and the water into moles, then divide.'
        write: 'Water lost per unit $= \dfrac{\text{mol of water lost}}{\text{mol of hydrate}}$'
      - section: 'Masses by difference'
        say: 'The mass of the hydrate is fourteen point nine eight minus ten point zero zero, which is four point nine eight grams.'
        write: 'Mass of hydrate $= 14.98 - 10.00 = 4.98$ g'
      - say: 'The mass of water lost is fourteen point nine eight minus thirteen point five four, which is one point four four grams.'
        write: 'Mass of water lost $= 14.98 - 13.54 = 1.44$ g'
      - section: 'Molar mass'
        say: 'The molar mass of C u S O four, five H two O, is sixty-three point five plus thirty-two plus sixty-four plus ninety, which is two hundred and forty-nine point five grams per mole.'
        write: '$M(\ce{CuSO4.5H2O}) = 63.5 + 32 + 4(16) + 5(18) = 249.5$ g mol⁻¹'
      - section: 'Moles'
        say: 'Moles of hydrate is four point nine eight divided by two hundred and forty-nine point five, which is zero point zero two mole.'
        write: 'mol of hydrate $= \dfrac{4.98}{249.5} = 0.020$ mol'
      - say: 'Water is eighteen grams per mole. One point four four divided by eighteen is zero point zero eight mole.'
        write: 'mol of water $= \dfrac{1.44}{18} = 0.080$ mol'
      - section: 'The ratio'
        say: 'Zero point zero eight divided by zero point zero two is four.'
        write: 'Water lost per unit $= \dfrac{0.080}{0.020} = 4$'
      - say: 'So four of the five waters left, and one stayed behind in the crucible.'
        write: '$\ce{CuSO4.5H2O ->[heat] CuSO4.H2O + 4H2O}$ at 120 °C'
      - section: 'Check'
        say: 'Check. One mole of C u S O four, H two O, is one hundred and seventy-seven point five grams. Zero point zero two mole of it is about three point five five grams, close to the three point five four grams left.'
        write: 'Check: $0.020 \times 177.5 \approx 3.55$ g; residue $= 13.54 - 10.00 = 3.54$ g ✓'
      - section: 'Answer'
        say: 'So four molecules of water of crystallization were lost, which is option D.'
        write: '$\therefore$ water molecules lost $= 4$'
        answer: true
    traps:
      A: 'You went for one. One water is what stays behind at one hundred and twenty degrees, not what is lost. Four of the five waters leave.'
      B: 'You went for two. Check the subtractions. The water lost is one point four four grams, which is zero point zero eight mole, four times the zero point zero two mole of hydrate.'
      C: 'You went for three. Divide by the moles of hydrate you started with, zero point zero two mole, not by anything from the residue. That gives four.'
  7:
    moments:
      - section: 'The question'
        say: 'A fixed mass of gas is kept at one temperature. We plot its volume against its pressure. What shape do we get?'
        write: 'Fixed mass, constant T. Graph of V against p $= ?$'
      - section: 'The rule'
        say: 'Boyle''s law. At constant temperature, the volume of a fixed mass of gas is inversely proportional to its pressure.'
        write: '$pV = k$, so $V = \dfrac{k}{p}$'
      - section: 'The direction'
        say: 'Double the pressure and the volume halves. So as p goes up, V comes down. The graph slopes downwards.'
        write: '$p \uparrow \Rightarrow V \downarrow$'
      - section: 'A few points'
        say: 'Take k as twelve. At p equals one, V is twelve. At p equals two, V is six. At p equals three, V is four.'
        write: '$p = 1, 2, 3, 4, 6 \quad V = 12, 6, 4, 3, 2$'
      - say: 'The first step drops V by six, but later steps drop it by only one. So the curve is steep at first, then flatter.'
        write: 'steep at first, then gentle'
      - section: 'The ends'
        say: 'V gets small but never reaches zero, and p never reaches zero either. The curve never touches the axes. We call it a hyperbola.'
        write: 'never touches either axis, a hyperbola'
      - section: 'Check'
        say: 'Check. Pump up a bicycle tyre and squeeze the pump harder. The air takes less and less space, but it never vanishes.'
        write: '$V \times p$ the same at every point ✓'
      - section: 'Answer'
        say: 'So the graph is a curve that falls steeply at first and then more gently, never touching either axis, which is option C.'
        write: '$\therefore$ falling curve, $V = \dfrac{k}{p}$'
        answer: true
    traps:
      A: 'You went for a rising straight line. That is volume against absolute temperature, or volume against one over p. Against p itself, the volume falls.'
      B: 'You went for a flat line. That would mean pressure has no effect on volume, but squeezing a gas makes it smaller.'
      D: 'You went for a rising curve. Volume goes down when pressure goes up, so the curve must fall.'
  8:
    moments:
      - section: 'The question'
        say: 'A mixture of two potassium salts, but only one of them reacts with the acid. That is the whole secret of this question.'
        write: '3.00 g of $\ce{K2CO3}$ + $\ce{KCl}$ in 250 cm³; 25.0 cm³ needs 40.00 cm³ of 0.1 mol dm⁻³ $\ce{HCl}$'
      - section: 'Which salt reacts'
        say: 'Potassium chloride does not react with hydrochloric acid. Only potassium trioxocarbonate four does.'
        write: 'Only $\ce{K2CO3}$ reacts with $\ce{HCl}$'
      - section: 'The equation'
        say: 'K two C O three plus two H C l gives two K C l plus water plus carbon dioxide.'
        write: '$\ce{K2CO3 + 2HCl -> 2KCl + H2O + CO2}$'
      - say: 'So one mole of carbonate reacts with two moles of acid.'
        write: 'Mole ratio $\ce{K2CO3}$ to $\ce{HCl}$ = 1 : 2'
      - section: 'Change the volume'
        say: 'Change forty centimetres cubed into decimetres cubed by dividing by one thousand.'
        write: '40.00 cm³ $= \dfrac{40.00}{1000} = 0.0400$ dm³'
      - section: 'Moles'
        say: 'Moles of acid is volume times concentration. Zero point zero four times zero point one is zero point zero zero four mole.'
        write: 'mol of $\ce{HCl}$ $= 0.0400 \times 0.1 = 0.004$ mol'
      - say: 'Half of that is the carbonate, so there is zero point zero zero two mole in twenty-five centimetres cubed.'
        write: 'mol of $\ce{K2CO3}$ in 25 cm³ $= \dfrac{0.004}{2} = 0.002$ mol'
      - section: 'The whole flask'
        say: 'The flask holds two hundred and fifty centimetres cubed, ten times as much. So it holds zero point zero two mole.'
        write: 'In 250 cm³: $0.002 \times 10 = 0.020$ mol'
      - section: 'Mass'
        say: 'The molar mass of K two C O three is seventy-eight plus twelve plus forty-eight, which is one hundred and thirty-eight grams per mole.'
        write: '$M(\ce{K2CO3}) = 2(39) + 12 + 3(16) = 138$ g mol⁻¹'
      - say: 'Mass is moles times molar mass. Zero point zero two times one hundred and thirty-eight is two point seven six grams.'
        write: 'Mass of $\ce{K2CO3}$ $= 0.020 \times 138 = 2.76$ g'
      - section: 'Percentage'
        say: 'Percentage by mass is two point seven six over three, times one hundred, which is ninety-two percent.'
        write: '% $\ce{K2CO3}$ $= \dfrac{2.76}{3.00} \times 100 = 92\%$'
      - section: 'Check'
        say: 'Check. The carbonate is two point seven six grams, so the chloride is zero point two four grams. Together they make the three grams we started with.'
        write: 'Check: $2.76 + 0.24 = 3.00$ g ✓'
      - section: 'Answer'
        say: 'So the mixture is ninety-two percent potassium trioxocarbonate four by mass, which is option D.'
        write: '$\therefore$ % $\ce{K2CO3}$ $= 92$'
        answer: true
    traps:
      A: 'You went for sixty. Follow the steps again. Halve the moles of acid, multiply by ten for the whole flask, then use one hundred and thirty-eight grams per mole. That gives two point seven six grams out of three.'
      B: 'You went for seventy-two. Check the molar mass. K two C O three is two times thirty-nine plus twelve plus forty-eight, which is one hundred and thirty-eight.'
      C: 'You went for eighty-two. The carbonate mass is two point seven six grams out of three grams, and that is ninety-two percent.'
  9:
    moments:
      - section: 'The question'
        say: 'Four properties across a period. Three go up and one goes down. Which one is the odd one out?'
        write: 'Across a period, which increase? 1 I.E., 2 atomic radius, 3 electronegativity, 4 electron affinity'
      - section: 'The reason'
        say: 'Across a period the nuclear charge rises, but the new electrons go into the same shell. So the nucleus pulls the outer electrons harder.'
        write: 'Nuclear charge ↑, same shell, so pull on outer electrons ↑'
      - section: 'What rises'
        say: 'A harder pull makes an electron harder to remove, so ionization energy increases.'
        write: '1. Ionization energy ↑'
      - say: 'The same pull attracts bonding electrons more strongly, so electronegativity increases.'
        write: '3. Electronegativity ↑'
      - say: 'The atom also gives out more energy when it gains an electron, so electron affinity increases.'
        write: '4. Electron affinity ↑'
      - section: 'The odd one out'
        say: 'The same pull draws the shell in closer, so the atomic radius decreases.'
        write: '2. Atomic radius ↓'
      - section: 'Check'
        say: 'Check with period three. Sodium is a big atom and chlorine a small one, yet chlorine holds its electrons far more tightly.'
        write: 'Na: big, low I.E.; Cl: small, high I.E. ✓'
      - section: 'Answer'
        say: 'So the properties that increase are one, three and four, which is option C.'
        write: '$\therefore$ 1, 3 and 4'
        answer: true
    traps:
      A: 'You went for A. Ionization energy rises, but atomic radius falls across a period, because the extra protons pull the shell in.'
      B: 'You went for B. Atomic radius falls across a period, and electron affinity, which rises, has been left out.'
      D: 'You went for D. Atomic radius falls across a period, so it cannot be in the list.'
  10:
    moments:
      - section: 'The question'
        say: 'Nine out of every ten atoms have mass sixteen, and one in ten has mass eighteen. Should the average be near sixteen or near seventeen?'
        write: '90% of $\ce{^{16}_{8}Z}$, 10% of $\ce{^{18}_{8}Z}$; R.A.M. $= ?$'
      - section: 'The rule'
        say: 'The relative atomic mass is the average of the isotope masses, each weighted by how much of it there is.'
        write: 'R.A.M. $= \sum (\text{mass number} \times \text{fraction})$'
      - section: 'Substitute'
        say: 'So we take sixteen times ninety over one hundred, plus eighteen times ten over one hundred.'
        write: 'R.A.M. $= \left(16 \times \dfrac{90}{100}\right) + \left(18 \times \dfrac{10}{100}\right)$'
      - say: 'Sixteen times zero point nine is fourteen point four.'
        write: '$16 \times 0.9 = 14.4$'
      - say: 'Eighteen times zero point one is one point eight.'
        write: '$18 \times 0.1 = 1.8$'
      - say: 'Fourteen point four plus one point eight is sixteen point two.'
        write: 'R.A.M. $= 14.4 + 1.8 = 16.2$'
      - section: 'Check'
        say: 'Check. The answer is close to sixteen because most of the atoms are the lighter isotope. That makes sense.'
        write: '16.2 is near 16, the common isotope ✓'
      - section: 'Answer'
        say: 'So the relative atomic mass of Z is sixteen point two, which is option B.'
        write: '$\therefore$ R.A.M. $= 16.2$'
        answer: true
    traps:
      A: 'You went for sixteen. That ignores the ten percent of heavier atoms, which push the average a little above sixteen.'
      C: 'You went for seventeen. That is the plain average of sixteen and eighteen. It forgets that nine in ten atoms have mass sixteen.'
      D: 'You went for seventeen point eight. That swaps the percentages and gives the heavier isotope ninety percent.'
  11:
    moments:
      - section: 'The question'
        say: 'Atomic number seventeen. Can one element have both a negative and a positive oxidation number? Yes, and here is how.'
        write: 'Atomic number 17: possible oxidation numbers?'
      - section: 'The configuration'
        say: 'Seventeen electrons arrange as two, eight, seven. This is chlorine, with seven outer electrons.'
        write: '17 electrons: 2, 8, 7 (chlorine)'
      - section: 'The rule'
        say: 'An atom can gain electrons to complete its octet, or use its outer electrons in bonding with a more electronegative atom like oxygen.'
        write: 'Lowest state: gain electrons to make 8. Highest: use all outer electrons'
      - section: 'Lowest state'
        say: 'Chlorine needs one more electron to make eight. Gaining one electron gives minus one, as in H C l.'
        write: 'Gain 1: $-1$, as in $\ce{Cl-}$ and $\ce{HCl}$'
      - section: 'Highest state'
        say: 'With oxygen, chlorine can use all seven outer electrons, giving plus seven, as in H C l O four.'
        write: 'Use all 7: $+7$, as in $\ce{HClO4}$ and $\ce{Cl2O7}$'
      - section: 'Check'
        say: 'Check. Seven minus eight is minus one, and the group number, seven, is the top state. Both fit group seven.'
        write: 'Lowest $= 7 - 8 = -1$; highest $= +7$ ✓'
      - section: 'Answer'
        say: 'So the possible oxidation numbers are minus one and plus seven, which is option A.'
        write: '$\therefore$ $-1$ and $+7$'
        answer: true
    traps:
      B: 'You went for B. Plus six is the top state for group six. Chlorine has seven outer electrons, so its top state is plus seven.'
      C: 'You went for C. Minus three and plus five belong to group five, like nitrogen and phosphorus.'
      D: 'You went for D. Minus two and plus six belong to group six, like sulphur, which sits just before chlorine.'
  12:
    moments:
      - section: 'The question'
        say: 'Two numbers on the symbol, thirty-one and fifteen. Neither of them is the answer by itself.'
        write: 'Valence electrons in $\ce{^{31}_{15}P}$ = ?'
      - section: 'The rule'
        say: 'Valence electrons are the electrons in the outermost shell.'
        write: 'Valence electrons = electrons in the outermost shell'
      - section: 'Count the electrons'
        say: 'The bottom number is the atomic number. A neutral atom has that many electrons, so phosphorus has fifteen.'
        write: 'Atomic number 15, so 15 electrons'
      - say: 'Fill the shells. Two go in the first, eight in the second, and five are left for the third.'
        write: '15 = 2, 8, 5'
      - say: 'The outermost shell holds five electrons.'
        write: 'Outermost shell: 5 electrons'
      - section: 'Check'
        say: 'Check. Phosphorus is in group five, like nitrogen, and the group number gives the valence electrons.'
        write: 'P is in group 5 ✓'
      - section: 'Answer'
        say: 'So phosphorus has five valence electrons, which is option B.'
        write: '$\therefore$ 5 valence electrons'
        answer: true
    traps:
      A: 'You went for three. Three is the number of shells, which tells you the period. The outer shell holds five.'
      C: 'You went for fifteen. That is all the electrons. Only the five in the outer shell are valence electrons.'
      D: 'You went for thirty-one. That is the mass number, protons plus neutrons, not electrons.'
  13:
    moments:
      - section: 'The question'
        say: 'Ten decimetres cubed of air, and somewhere in it is some H two S. The lead sulphide it makes tells us exactly how much.'
        write: '10.0 dm³ of air; $\ce{PbS}$ = 5.02 g; % by volume of $\ce{H2S}$ = ?'
      - section: 'The equation'
        say: 'The equation shows that one mole of H two S gives one mole of P b S.'
        write: '$\ce{Pb(NO3)2 + H2S -> PbS + 2HNO3}$'
      - section: 'The rule'
        say: 'One mole of any gas at s t p takes up twenty-two point four decimetres cubed. This is the molar volume.'
        write: '1 mol of gas at s.t.p. = 22.4 dm³'
      - section: 'Moles of lead sulphide'
        say: 'The molar mass of P b S is two hundred and seven plus thirty-two, which is two hundred and thirty-nine grams per mole.'
        write: '$M(\ce{PbS}) = 207 + 32 = 239$ g mol⁻¹'
      - say: 'Five point zero two divided by two hundred and thirty-nine is zero point zero two one mole.'
