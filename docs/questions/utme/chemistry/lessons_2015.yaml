        say: 'The product gives minus three hundred and ninety-three. The reactants give minus one hundred and ten point four plus zero.'
        write: '$\Delta H = (-393.0) - (-110.4 + 0)$'
      - say: 'Minus a minus becomes plus.'
        write: '$= -393.0 + 110.4$'
      - say: 'Minus three hundred and ninety-three plus one hundred and ten point four is minus two hundred and eighty-two point six kilojoules.'
        write: '$= -282.6$ kJ'
      - section: 'Check'
        say: 'Check. The sign is negative, so burning carbon monoxide gives out heat, as burning should.'
        write: 'Negative, so exothermic, as for burning ✓'
      - section: 'Answer'
        say: 'So the energy change is minus two hundred and eighty-two point six kilojoules, which is option B.'
        write: '$\therefore$ $\Delta H = -282.6$ kJ'
        answer: true
    traps:
      A: 'You went for minus five hundred and three point seven. That adds the two enthalpies. Hess''s law takes the products minus the reactants.'
      C: 'You went for plus two hundred and eighty-two point six. That is reactants minus products, so the sign is reversed. Burning gives out heat.'
      D: 'You went for plus five hundred and three point seven. That adds the values and flips the sign as well.'
  28:
    moments:
      - section: 'The question'
        say: 'A block of ice keeps its shape, but pour water and it takes the shape of the cup. What makes the difference?'
        write: 'What gives a solid its definite shape?'
      - section: 'The rule'
        say: 'The kinetic theory says matter is made of particles that are always moving and that attract one another.'
        write: 'Kinetic theory: particles in motion, attracting one another'
      - section: 'In a solid'
        say: 'In a solid, the attraction between the particles is strong.'
        write: 'Solid: strong intermolecular attraction'
      - say: 'So the particles can only vibrate about fixed positions. That keeps a definite shape and volume.'
        write: 'Particles vibrate about fixed positions, so the shape is fixed'
      - section: 'In a liquid'
        say: 'In a liquid the forces are weaker, so the particles slide past one another and take the shape of the container.'
        write: 'Liquid: weaker forces, particles slide, shape of the container'
      - section: 'Check'
        say: 'Check. A high melting point also comes from strong forces, but it is a result, not what holds the shape.'
        write: 'High m.p. is a result of strong forces, not the cause of shape ✓'
      - section: 'Answer'
        say: 'So strong intermolecular attraction gives a solid its definite shape, which is option A.'
        write: '$\therefore$ strong intermolecular attraction'
        answer: true
    traps:
      B: 'You went for high melting point. That is a result of strong forces between particles, not what gives the shape.'
      C: 'You went for high boiling point. Boiling is about a liquid turning to gas, not about the shape of a solid.'
      D: 'You went for weak intermolecular attraction. Weak forces let particles move freely, as in liquids and gases.'
  29:
    moments:
      - section: 'The question'
        say: 'A crystal drops into a clear salt solution and just sits there. Nothing dissolves and nothing grows. What does that tell us?'
        write: 'Crystal added: does not dissolve, solution unchanged'
      - section: 'The rule'
        say: 'A saturated solution holds as much solute as it can at that temperature. Extra solid will not dissolve.'
        write: 'Saturated: holds the most solute it can at that temperature'
      - section: 'The other kinds'
        say: 'An unsaturated solution can take more, so it would dissolve the crystal.'
        write: 'Unsaturated: crystal dissolves ✗'
      - say: 'A supersaturated solution holds more than it should. The crystal acts as a seed, and more solid comes out.'
        write: 'Supersaturated: more crystals form on the seed ✗'
      - say: 'Concentrated only means there is a lot of solute. A concentrated solution may still dissolve more.'
        write: 'Concentrated: a lot of solute, may still dissolve more'
      - section: 'Check'
        say: 'Check. Here the crystal stays the same and the solution stays the same. Only a saturated solution behaves like that.'
        write: 'No dissolving, no new crystals: saturated ✓'
      - section: 'Answer'
        say: 'So the solution was saturated, which is option D.'
        write: '$\therefore$ saturated'
        answer: true
    traps:
      A: 'You went for supersaturated. The crystal would not dissolve there either, but new crystals would grow on it and the solution would change.'
      B: 'You went for concentrated. Concentrated only means there is a lot of solute. It does not tell us whether more can dissolve.'
      C: 'You went for unsaturated. An unsaturated solution would dissolve the crystal.'
  30:
    moments:
      - section: 'The question'
        say: 'Five electrons in the two p sublevel. Five sounds like the answer, but most of them are paired.'
        write: '1s² 2s² 2p⁵: unpaired electrons = ?'
      - section: 'The full orbitals'
        say: 'The one s and two s orbitals are full, with two electrons each, so those are paired.'
        write: '1s², 2s²: all paired'
      - section: 'The rule'
        say: 'Hund''s rule says electrons go into each orbital of a sublevel singly before any pairing.'
        write: 'Hund''s rule: fill singly first, then pair'
      - section: 'Fill the 2p boxes'
        say: 'The two p sublevel has three orbitals. The first three electrons go in one each.'
        write: '2p: ↑ ↑ ↑ (3 electrons)'
      - say: 'The fourth and fifth electrons pair up in the first two orbitals.'
        write: '2p⁵: ↑↓ ↑↓ ↑'
      - say: 'That leaves one unpaired electron.'
        write: 'Unpaired electrons = 1'
      - section: 'Check'
        say: 'Check. This is fluorine, and its one unpaired electron is why it forms just one bond, as in F two.'
        write: 'Fluorine forms one bond, $\ce{F-F}$ ✓'
      - section: 'Answer'
        say: 'So there is one unpaired electron, which is option C.'
        write: '$\therefore$ 1 unpaired electron'
        answer: true
    traps:
      A: 'You went for two. Two unpaired electrons would be two p four, which is oxygen. With five electrons, only one is unpaired.'
      B: 'You went for five. That counts every two p electron. Four of them are paired, so only one is unpaired.'
      D: 'You went for four. Three p orbitals can hold at most three unpaired electrons, and with five electrons only one is unpaired.'
  31:
    moments:
      - section: 'The question'
        say: 'Pig iron from the blast furnace is brittle because of its impurities. What do steel makers blow through it?'
        write: 'Removes C, S and P from pig iron in steel-making?'
      - section: 'The fact'
        say: 'Pig iron contains about four percent carbon, with some sulphur and phosphorus.'
        write: 'Pig iron: about 4% C, plus S and P'
      - say: 'In the basic oxygen process, pure oxygen is blown through the molten iron.'
        write: 'Basic oxygen process: $\ce{O2}$ blown through molten iron'
      - section: 'The equations'
        say: 'Oxygen oxidizes carbon to carbon dioxide, and sulphur to sulphur four oxide. Both escape as gases.'
        write: '$\ce{C + O2 -> CO2}$, $\ce{S + O2 -> SO2}$'
      - say: 'Phosphorus becomes its oxide, which joins the slag.'
        write: '$\ce{4P + 5O2 -> P4O10}$ (into the slag)'
      - section: 'Remember'
        say: 'To remember, removing these impurities is oxidation, so the gas must be oxygen.'
        write: 'Removing impurities = oxidation, so oxygen'
      - section: 'Answer'
        say: 'So the substance used is oxygen, which is option A.'
        write: '$\therefore$ oxygen'
        answer: true
    traps:
      B: 'You went for chlorine. Chlorine is not used to refine iron, and it would attack the metal.'
      C: 'You went for nitrogen. Nitrogen is unreactive and does not remove the impurities. It also makes steel brittle.'
      D: 'You went for hydrogen. Hydrogen is a reducing agent, but these impurities must be oxidized.'
  32:
    moments:
      - section: 'The question'
        say: 'H two S smells like rotten eggs, but in the laboratory it has a very useful job. What can it act as?'
        write: '$\ce{H2S}$ can act as ?'
      - section: 'The fact'
        say: 'Hydrogen sulphide precipitates many metal ions as sulphides, which are often coloured.'
        write: '$\ce{H2S}$ + metal ions gives insoluble sulphides'
      - section: 'The equations'
        say: 'With copper two ions, it gives black copper two sulphide.'
        write: '$\ce{Cu^2+ + H2S -> CuS(s) + 2H+}$ (black)'
      - say: 'With lead two ions, it gives black lead two sulphide.'
        write: '$\ce{Pb^2+ + H2S -> PbS(s) + 2H+}$ (black)'
      - say: 'That is why it is used in qualitative analysis, to separate metal ions into groups.'
        write: 'Use: precipitating agent in qualitative analysis'
      - section: 'Check'
        say: 'Check the other choices. H two S is a reducing agent, not an oxidizing agent, and it neither dehydrates nor bleaches.'
        write: 'Reducing, not oxidizing; does not dehydrate or bleach ✓'
      - section: 'Answer'
        say: 'So hydrogen sulphide can act as a precipitating agent, which is option D.'
        write: '$\therefore$ a precipitating agent'
        answer: true
    traps:
      A: 'You went for oxidizing agent. H two S is a reducing agent. It gives up its hydrogen and is oxidized to sulphur.'
      B: 'You went for dehydrating agent. That is concentrated H two S O four, which removes water. H two S does not.'
      C: 'You went for bleaching agent. S O two and chlorine bleach, but hydrogen sulphide does not.'
  33:
    moments:
      - section: 'The question'
        say: 'A rocket flies where there is little air, so it must carry its own oxidizer. Which acid does that job?'
        write: 'Oxidizer in rocket fuel?'
      - section: 'The rule'
        say: 'Burning needs a fuel and an oxidizer. High up there is almost no air, so the rocket carries its oxidizer.'
        write: 'Burning: fuel + oxidizer'
      - section: 'The fact'
        say: 'Concentrated trioxonitrate five acid is a very strong oxidizing agent.'
        write: '$\ce{HNO3}$: strong oxidizing agent'
      - say: 'Fuming H N O three gives up oxygen readily, so it is used as the oxidizer in liquid rocket propellants.'
        write: 'Fuming $\ce{HNO3}$: oxidizer in liquid rocket fuel'
      - say: 'It reacts very fast with the fuel, releasing a large volume of hot gas that pushes the rocket up.'
        write: 'Fast reaction, hot gases, thrust'
      - section: 'Check'
        say: 'Check the others. Ethanoic acid is weak, hydrochloric acid is not an oxidizer, and H two S O four is not used in rockets.'
        write: '$\ce{CH3COOH}$ weak; $\ce{HCl}$ not oxidizing; $\ce{H2SO4}$ not used ✓'
      - section: 'Answer'
        say: 'So the oxidizer in rocket fuel is trioxonitrate five acid, which is option A.'
        write: '$\therefore$ $\ce{HNO3}$'
        answer: true
    traps:
      B: 'You went for ethanoic acid. It is a weak acid, the acid in vinegar, with no use in rockets.'
      C: 'You went for H two S O four. It is a strong acid and a dehydrating agent, but it is not used as a rocket oxidizer.'
      D: 'You went for H C l. Hydrochloric acid is not an oxidizing agent, so it cannot help a fuel burn.'
  34:
    moments:
      - section: 'The question'
        say: 'Put a damp red flower into chlorine and its colour fades. A dry flower keeps its colour. Why?'
        write: 'Chlorine bleaches only in the presence of ?'
      - section: 'The fact'
        say: 'Dry chlorine does not bleach. It needs water.'
        write: 'Dry $\ce{Cl2}$: no bleaching'
      - section: 'The equations'
        say: 'With water, chlorine forms hydrochloric acid and chloric one acid.'
        write: '$\ce{Cl2 + H2O -> HCl + HOCl}$'
      - say: 'The chloric one acid gives up oxygen.'
        write: '$\ce{HOCl -> HCl + [O]}$'
      - say: 'This oxygen oxidizes the dye to a colourless substance.'
        write: 'dye + [O] gives a colourless substance'
      - section: 'Remember'
        say: 'To remember, damp litmus is bleached by chlorine, but dry litmus is not.'
        write: 'Damp litmus bleached; dry litmus unchanged'
      - section: 'Answer'
        say: 'So chlorine bleaches because of the presence of water, which is option B.'
        write: '$\therefore$ water'
        answer: true
    traps:
      A: 'You went for hydrogen chloride. It is a product of the reaction, but it does not bleach.'
      C: 'You went for air. Air is not needed. The oxygen that bleaches comes from H O C l.'
      D: 'You went for oxygen. Oxygen gas does not bleach. It is the oxygen released by H O C l in water that acts.'
  35:
    moments:
      - section: 'The question'
        say: 'A bottle of hydrogen peroxide from the chemist slowly loses its strength. What does a little acid do for it?'
        write: 'Why add mineral acid to commercial $\ce{H2O2}$?'
      - section: 'The fact'
        say: 'Hydrogen peroxide slowly decomposes into water and oxygen.'
        write: '$\ce{2H2O2 -> 2H2O + O2}$'
      - say: 'Alkalis and traces of metal ions speed up this decomposition.'
        write: 'Alkali and metal ions speed up decomposition'
      - section: 'The reason'
        say: 'A little mineral acid neutralizes any alkali and slows the breakdown. It acts as a stabilizer, a negative catalyst.'
        write: 'Acid: stabilizer (negative catalyst)'
      - say: 'So the solution keeps its strength longer on the shelf.'
        write: 'Longer shelf life'
      - section: 'Remember'
        say: 'To remember, acid keeps peroxide, and alkali breaks peroxide.'
        write: 'Acid keeps $\ce{H2O2}$; alkali breaks it'
      - section: 'Answer'
        say: 'So mineral acids are added to minimize its decomposition, which is option C.'
        write: '$\therefore$ to minimize its decomposition'
        answer: true
    traps:
      A: 'You went for oxidize it. Acids do not oxidize hydrogen peroxide. They are added to keep it stable.'
      B: 'You went for decompose it. The acid slows the decomposition. It does not cause it.'
      D: 'You went for D. Water and oxygen are what decomposition makes, and the acid is there to slow that down.'
  36:
    moments:
      - section: 'The question'
        say: 'Aluminium dissolves in dilute acids, yet tankers of concentrated trioxonitrate five acid are made of aluminium. How?'
        write: 'Why aluminium containers for concentrated $\ce{HNO3}$?'
      - section: 'The fact'
        say: 'Concentrated trioxonitrate five acid is a strong oxidizing agent.'
        write: 'Concentrated $\ce{HNO3}$: strong oxidizing agent'
      - section: 'The equation'
        say: 'It oxidizes the surface of the aluminium to a thin, tough layer of aluminium oxide.'
        write: '$\ce{4Al + 3O2 -> 2Al2O3}$ (surface layer)'
      - say: 'This layer makes aluminium passive. The acid cannot reach the metal underneath.'
        write: 'Oxide layer: aluminium becomes passive'
      - say: 'So the aluminium does not react with the acid any further.'
        write: 'No further reaction with the acid'
      - section: 'Check'
        say: 'Check. Low density helps in transport, but a light container that dissolved in the acid would be useless. What matters is that there is no reaction.'
        write: 'Light weight helps, but no reaction is what matters ✓'
      - section: 'Answer'
        say: 'So aluminium is used because it does not react with the concentrated acid, which is option B.'
        write: '$\therefore$ aluminium does not react with the acid'
        answer: true
    traps:
      A: 'You went for low density. Light weight is useful, but it is not why the acid can be stored safely.'
      C: 'You went for does not corrode. Aluminium can corrode in many conditions. Here it is passive to this one acid.'
      D: 'You went for silvery white appearance. How a metal looks has nothing to do with resisting acid.'
  37:
    moments:
      - section: 'The question'
        say: 'Three small ethyne molecules go into a hot tube, and one ring comes out. Which compound is it?'
        write: 'Ethyne over a hot organo-nickel catalyst gives ?'
      - section: 'The fact'
        say: 'Over a hot catalyst, three ethyne molecules join into a ring. This is called trimerization.'
        write: 'Trimerization: 3 molecules join into a ring'
      - section: 'The equation'
        say: 'Three C two H two give C six H six.'
        write: '$\ce{3C2H2 ->[catalyst] C6H6}$'
      - say: 'C six H six, with a ring of six carbons, is benzene.'
        write: '$\ce{C6H6}$ = benzene'
      - section: 'Check'
        say: 'Check the atoms. Three times two is six carbons, and three times two is six hydrogens. It balances.'
        write: 'C: $3 \times 2 = 6$; H: $3 \times 2 = 6$ ✓'
      - say: 'Check the others. Polythene is made from ethene, and ethanol from ethene and steam.'
        write: 'Polythene from ethene; ethanol from ethene + steam'
      - section: 'Answer'
        say: 'So ethyne gives benzene, which is option D.'
        write: '$\therefore$ benzene'
        answer: true
    traps:
      A: 'You went for isoprene. Isoprene, C five H eight, is the building block of natural rubber. It is not made from ethyne this way.'
      B: 'You went for polythene. Polythene is made by joining ethene molecules, not ethyne.'
      C: 'You went for ethanol. Ethanol comes from ethene and steam, or from fermenting sugar.'
