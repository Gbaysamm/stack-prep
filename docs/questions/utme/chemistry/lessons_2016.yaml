# UTME 2016 Chemistry, lessons for the board (voice + board), one per kept question.
#
# Each lesson is a run of moments, taught the Nigerian classroom way: the question, the rule in
# words then written, the balanced equation, the working with units one step at a time, the
# check, and the answer moment naming the option. `traps` speaks to a student who chose a wrong
# option. Spoken lines (say, traps) write formulas as formulas (the voice reads them letter by
# letter) and say units in words. Answers match explanations_2016.yaml. All 40 questions are kept.
format_version: 1
exam_year: 2016
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'Element X comes in two kinds, mass twenty and mass twenty-two. Many students simply split the difference and say twenty-one, but the ratio says otherwise.'
        write: '$\ce{^{20}_{10}X}$ : $\ce{^{22}_{10}X}$ = 1 : 3, relative atomic mass = ?'
      - section: 'The symbols'
        say: 'In each symbol, the top number is the mass number, twenty or twenty-two. The bottom number, ten, is the atomic number, the same for both, because these are isotopes of one element.'
        write: 'Top number = mass number; bottom number = atomic number'
      - section: 'The rule'
        say: 'Relative atomic mass is a weighted average. We multiply each isotope mass by its share, add them up, and divide by the total number of shares.'
        write: 'R.A.M. = $\dfrac{\text{sum of (mass} \times \text{share)}}{\text{total shares}}$'
      - section: 'The working'
        say: 'The ratio one to three means one part of mass twenty and three parts of mass twenty-two. That is four parts in all.'
        write: 'Shares = 1 + 3 = 4'
      - say: 'Twenty times one is twenty, and twenty-two times three is sixty-six.'
        write: '$(20 \times 1) + (22 \times 3) = 20 + 66$'
      - say: 'Twenty plus sixty-six gives a total of eighty-six.'
        write: '$= 86$'
      - say: 'Now divide eighty-six by the four parts. That gives twenty-one point five.'
        write: 'R.A.M. $= \dfrac{86}{4} = 21.5$'
      - section: 'Check'
        say: 'Check. There is three times as much of the heavier isotope, so the average should sit closer to twenty-two than to twenty. Twenty-one point five does.'
        write: '20 < 21.5 < 22, nearer 22 ✓'
      - section: 'Answer'
        say: 'So the relative atomic mass of X is twenty-one point five, which is option C.'
        write: '$\therefore$ R.A.M. of X $= 21.5$'
        answer: true
    traps:
      A: 'You went for twenty point five. That leans towards the lighter isotope, the wrong way round. There is three times as much of the mass twenty-two kind.'
      B: 'You went for twenty-one. That is the plain average of twenty and twenty-two, which ignores the one to three ratio.'
      D: 'You went for twenty-two. That uses only the heavier isotope. The lighter one still counts for one part in four.'
  2:
    moments:
      - section: 'The question'
        say: 'Oxygen and methane race through the same porous plug. Methane is lighter, so it should win, but by how much?'
        write: '200 cm³ $\ce{O2}$ in 50 s, 80 cm³ $\ce{CH4}$ in $t$ = ?'
      - section: 'The rule'
        say: 'We use Graham''s law. The rate of diffusion of a gas is inversely proportional to the square root of its molar mass.'
        write: 'Graham''s law: $\dfrac{R_1}{R_2} = \sqrt{\dfrac{M_2}{M_1}}$'
      - section: 'Molar masses'
        say: 'O₂ is two times sixteen, which is thirty-two grams per mole. CH₄ is twelve plus four, which is sixteen grams per mole.'
        write: '$M(\ce{O2}) = 32$ g mol⁻¹, $M(\ce{CH4}) = 12 + 4 = 16$ g mol⁻¹'
      - section: 'The working'
        say: 'First the rate of oxygen. Rate is volume divided by time, so two hundred centimetres cubed in fifty seconds is four centimetres cubed per second.'
        write: '$R(\ce{O2}) = \dfrac{200}{50} = 4$ cm³ s⁻¹'
      - say: 'Now Graham''s law. The rate of methane over the rate of oxygen is the square root of the molar mass of oxygen over the molar mass of methane. That is the square root of thirty-two over sixteen, which is the square root of two.'
        write: '$\dfrac{R(\ce{CH4})}{R(\ce{O2})} = \sqrt{\dfrac{32}{16}} = \sqrt{2}$'
      - say: 'The square root of two is about one point four one four, so methane diffuses one point four one four times as fast as oxygen.'
        write: '$\sqrt{2} \approx 1.414$'
      - say: 'So the rate of methane is four times one point four one four, which is five point six six centimetres cubed per second.'
        write: '$R(\ce{CH4}) = 4 \times 1.414 = 5.66$ cm³ s⁻¹'
      - say: 'Time is volume divided by rate. Methane has eighty centimetres cubed to pass, and eighty divided by five point six six is about fourteen seconds.'
        write: '$t = \dfrac{80}{5.66} = 14.1$ s $\approx 14$ s'
      - section: 'Check'
        say: 'Check. Methane is lighter and has less gas to move, so its time must be well under fifty seconds. Fourteen seconds fits.'
        write: '14 s < 50 s ✓'
      - section: 'Answer'
        say: 'So methane takes about fourteen seconds, which is option C.'
        write: '$\therefore t \approx 14$ s'
        answer: true
    traps:
      A: 'You went for forty seconds. That treats methane as slower than oxygen. Methane is the lighter gas, so it diffuses faster.'
      B: 'You went for twenty seconds. That scales the time by the volume only and forgets that methane moves faster than oxygen.'
      D: 'You went for seven seconds. That divides by two instead of by the square root of two.'
  3:
    moments:
      - section: 'The question'
        say: 'Carbon holds four hands and oxygen holds two. What word do chemists use for that number of bonds?'
        write: 'Number of bonds an atom can form = ?'
      - section: 'The fact'
        say: 'Valence, or valency, is the combining power of an atom. It is the number of bonds the atom can form.'
        write: 'Valency = combining power = number of bonds formed'
      - section: 'Example'
        say: 'Carbon has a valency of four, so in methane, CH₄, it forms four bonds, one to each hydrogen.'
        write: '$\ce{CH4}$, carbon forms 4 bonds, valency 4'
      - say: 'Oxygen has a valency of two, so in water, H₂O, it forms two bonds.'
        write: '$\ce{H2O}$, oxygen forms 2 bonds, valency 2'
      - section: 'Not to confuse'
        say: 'Oxidation number is different. It is a charge we assign for bookkeeping, and it can even be zero for an element.'
        write: 'Oxidation number = assigned charge, not a count of bonds'
      - section: 'Remember'
        say: 'Remember it this way. Valency is how many hands an atom has to hold other atoms.'
        write: 'Valency = number of hands'
      - section: 'Answer'
        say: 'So the number of bonds an atom can form is its valence, which is option B.'
        write: '$\therefore$ valence'
        answer: true
    traps:
      A: 'You went for oxidation number. It is related, but it is a charge we assign, not a count of bonds.'
      C: 'You went for atomic number. That is the number of protons in the nucleus.'
      D: 'You went for electronegativity. That is how strongly an atom pulls shared electrons towards itself.'
  4:
    moments:
      - section: 'The question'
        say: 'The diagram shows three rings of electrons around a nucleus. Count them carefully, because one wrong count lands you on neon.'
        write: 'Shells: 2, 8, 2, element = ?'
      - section: 'The rule'
        say: 'In a neutral atom, the number of electrons equals the atomic number.'
        write: 'Electrons = protons = atomic number'
      - section: 'The working'
        say: 'Count shell by shell. There are two on the inner shell, eight on the middle shell and two on the outer shell.'
        write: '2 + 8 + 2'
      - say: 'Two plus eight plus two is twelve, so the atomic number is twelve.'
        write: '$= 12$, so atomic number = 12'
      - say: 'Element number twelve is magnesium, with the configuration two, eight, two.'
        write: 'Z = 12 is Mg (2, 8, 2)'
      - section: 'Check'
        say: 'Check. Magnesium is in group two and period three. Two outer electrons and three shells match the diagram.'
        write: '2 outer electrons, group II; 3 shells, period 3 ✓'
      - section: 'Answer'
        say: 'So the diagram shows an atom of magnesium, which is option A.'
        write: '$\therefore$ magnesium'
        answer: true
    traps:
      B: 'You went for helium. Helium has only two electrons on a single shell. This atom has twelve.'
      C: 'You went for chlorine. Chlorine is two, eight, seven, with seven electrons in its outer shell, not two.'
      D: 'You went for neon. Neon is two, eight, with only two shells. This atom has a third shell holding two more electrons.'
  5:
    moments:
      - section: 'The question'
        say: 'A car is left running in a closed garage, and the people inside fall asleep and never wake. Which exhaust gas did that?'
        write: 'Most dangerous gas in car exhaust = ?'
      - section: 'The fact'
        say: 'Carbon two oxide, CO, comes from the incomplete burning of petrol and diesel in the engine.'
        write: '$\ce{2C + O2 -> 2CO}$ (not enough air)'
      - section: 'The reason'
        say: 'Haemoglobin is the red substance in blood that carries oxygen. Carbon two oxide joins with haemoglobin about two hundred times more strongly than oxygen does.'
        write: '$\ce{CO}$ + haemoglobin gives carboxyhaemoglobin'
      - say: 'So the blood can no longer carry oxygen to the body, and the person suffocates from the inside.'
        write: 'Blood cannot carry $\ce{O2}$'
      - say: 'It has no colour and no smell, so people breathe it without noticing.'
        write: 'Colourless, odourless'
      - section: 'Remember'
        say: 'Remember it as the silent killer. That is why we never run a generator inside a closed room.'
        write: '$\ce{CO}$ = the silent killer'
      - section: 'Answer'
        say: 'So the most dangerous pollutant in exhaust fumes is carbon two oxide, which is option B.'
        write: '$\therefore$ carbon(II) oxide, $\ce{CO}$'
        answer: true
    traps:
      A: 'You went for hydrogen sulphide. It is poisonous, but it is not a usual part of car exhaust, and its bad egg smell warns you.'
      C: 'You went for sulphur four oxide. It causes acid rain and irritates the lungs, but in exhaust it is far less deadly than carbon two oxide.'
      D: 'You went for carbon four oxide. CO₂ is a greenhouse gas, but it is not a poison at the levels found in exhaust fumes.'
  6:
    moments:
      - section: 'The question'
        say: 'Soft water sounds harmless, even good. So what bad side effect could it have?'
        write: 'Side effect of soft water = ?'
      - section: 'The fact'
        say: 'Soft water contains very few dissolved calcium or magnesium salts.'
        write: 'Soft water has few $\ce{Ca^2+}$ or $\ce{Mg^2+}$ ions'
      - section: 'The reason'
        say: 'Hard water lays down a thin coat of calcium carbonate inside pipes, and that coat protects the metal.'
        write: 'Hard water gives a $\ce{CaCO3}$ coat inside pipes'
      - say: 'Soft water forms no such coat. Its dissolved oxygen and carbon four oxide slowly dissolve lead from lead pipes.'
        write: 'Soft water + lead pipe gives dissolved lead'
      - say: 'Lead compounds are poisonous, so this is a harmful side effect. It is called plumbosolvency.'
        write: 'Lead is poisonous (plumbosolvency)'
      - section: 'Remember'
        say: 'Remember it this way. Hard water wears a coat of armour on the pipe, while soft water has nothing to stop it.'
        write: 'No scale, so soft water reaches the lead'
      - section: 'Answer'
        say: 'So soft water attacks lead contained in pipes, which is option C.'
        write: '$\therefore$ it attacks lead in pipes'
        answer: true
    traps:
      A: 'You went for an offensive taste. Soft water tastes flat, not offensive.'
      B: 'You went for excess calcium being precipitated. That describes hard water forming scale. Soft water has little calcium to precipitate.'
      D: 'You went for the growth of bacteria. Whether water is soft or hard does not decide whether bacteria grow.'
  7:
    moments:
      - section: 'The question'
        say: 'Oil has spilled on a farm in the Niger Delta. How do we make the soil good for crops again?'
        write: 'Clean farmland after crude oil spill = ?'
      - section: 'The fact'
        say: 'Crude oil is a mixture of hydrocarbons, and some aerobic bacteria can use hydrocarbons as food. Aerobic means they need oxygen to live.'
        write: 'Crude oil = hydrocarbons, food for aerobic bacteria'
      - section: 'The reason'
        say: 'These bacteria use oxygen from the air to break the oil down into carbon four oxide and water.'
        write: 'Hydrocarbon + $\ce{O2}$ (bacteria) gives $\ce{CO2 + H2O}$'
      - say: 'Cleaning soil with living things this way is called bioremediation.'
        write: 'Bioremediation'
      - say: 'Fertiliser and air are supplied so that the bacteria multiply quickly and eat the oil faster.'
        write: 'Add fertiliser + air, more bacteria'
      - section: 'Remember'
        say: 'Remember it as let the microbes eat the oil.'
        write: 'Let the microbes eat the oil'
      - section: 'Answer'
        say: 'So the farmland is decontaminated by using aerobic bacteria, which is option B.'
        write: '$\therefore$ aerobic bacteria'
        answer: true
    traps:
      A: 'You went for adding acid. Acid does not dissolve oil, and it would make the soil too acidic for crops.'
      C: 'You went for pouring water. Oil does not mix with water, so the water only spreads the oil further.'
      D: 'You went for burning off the oil. Burning destroys the living matter in the soil and fills the air with smoke.'
  8:
    moments:
      - section: 'The question'
        say: 'Drop a substance into baking soda solution and it fizzes. Which functional group is doing that?'
        write: 'Functional group + $\ce{NaHCO3}$ gives gas bubbles?'
      - section: 'The rule'
        say: 'Sodium hydrogen trioxocarbonate four, NaHCO₃, gives off carbon four oxide with any acid stronger than carbonic acid.'
        write: 'Acid + $\ce{NaHCO3}$ gives salt + $\ce{H2O}$ + $\ce{CO2}$'
      - section: 'The group'
        say: 'The carboxyl group, COOH, makes a compound an alkanoic acid, and that is strong enough.'
        write: '$\ce{-COOH}$ = carboxyl group, alkanoic acid'
      - section: 'The equation'
        say: 'For example, ethanoic acid, CH₃COOH, reacts with NaHCO₃.'
        write: '$\ce{CH3COOH + NaHCO3 -> CH3COONa + H2O + CO2}$'
      - say: 'The carbon four oxide is the gas you see bubbling out. This is the standard test for an alkanoic acid.'
        write: '$\ce{CO2}$ bubbles, test for $\ce{-COOH}$'
      - section: 'Check'
        say: 'Now check the others. The amino group, NH₂, is basic, so it gives no gas.'
        write: '$\ce{-NH2}$ basic ✗'
      - say: 'The OH group in an alkanol is far too weakly acidic to release carbon four oxide.'
        write: '$\ce{-OH}$ too weak ✗'
      - say: 'The carbonyl group, C double bond O, is not acidic at all.'
        write: '$\ce{>C=O}$ not acidic ✗'
      - section: 'Answer'
        say: 'So the carboxyl group gives the bubbles, which is option B.'
        write: '$\therefore$ $\ce{-COOH}$'
        answer: true
    traps:
      A: 'You went for the amino group. NH₂ is basic, so it gives no gas with a hydrogen carbonate.'
      C: 'You went for the OH group. Alkanols contain hydrogen, but they are far too weakly acidic to release carbon four oxide.'
      D: 'You went for the carbonyl group. The C double bond O of alkanals and alkanones is not acidic.'
  9:
    moments:
      - section: 'The question'
        say: 'Potassium dichromate forms the orange crystals in the school lab. What is the oxidation state of chromium in it?'
        write: 'Oxidation state of Cr in $\ce{K2Cr2O7}$ = ?'
      - section: 'The rule'
        say: 'In a neutral compound, the oxidation numbers add up to zero. Potassium is plus one and oxygen is minus two.'
        write: 'Sum = 0, K = +1, O = −2'
      - section: 'The working'
        say: 'Let the oxidation number of chromium be x. There are two potassiums, two chromiums and seven oxygens.'
        write: '$2(+1) + 2x + 7(-2) = 0$'
      - say: 'Two minus fourteen is minus twelve, so we have two x minus twelve equals zero.'
        write: '$2 + 2x - 14 = 0$, so $2x - 12 = 0$'
      - say: 'Add twelve to both sides. Two x equals twelve.'
        write: '$2x = 12$'
      - say: 'Divide both sides by two. X equals plus six.'
        write: '$x = +6$'
      - section: 'Check'
        say: 'Check. Its full name is potassium heptaoxodichromate six, and the six agrees.'
        write: 'Heptaoxodichromate(VI) ✓'
      - section: 'Answer'
        say: 'So chromium is in the plus six state, which is option B.'
        write: '$\therefore$ Cr = +6'
        answer: true
    traps:
      A: 'You went for plus seven. That is manganese in KMnO₄. Here plus seven would make the sum plus two, not zero.'
      C: 'You went for plus five. Count again. There are two potassiums at plus one and seven oxygens at minus two.'
      D: 'You went for plus four. The minus fourteen from oxygen is shared by two chromiums after the potassiums take two.'
  10:
    moments:
      - section: 'The question'
        say: 'Sodium peroxide meets water and oxygen gas bubbles out. Something was oxidized. But which substance?'
        write: '$\ce{2Na2O2(s) + 2H2O(l) -> 4NaOH(aq) + O2(g)}$, oxidized = ?'
      - section: 'The rule'
        say: 'Oxidation is an increase in oxidation number. So we find the oxidation number of each element on both sides.'
        write: 'Oxidation = increase in oxidation number'
      - section: 'The working'
        say: 'In Na₂O₂, a peroxide, sodium is plus one. So each oxygen is minus one, not the usual minus two.'
        write: '$\ce{Na2O2}$, Na = +1, so O = −1'
      - say: 'In water and in NaOH, oxygen has its usual value of minus two.'
        write: '$\ce{H2O}$, $\ce{NaOH}$, O = −2'
      - say: 'In O₂ gas, oxygen is an element on its own, and every free element has oxidation number zero.'
        write: '$\ce{O2}$, O = 0'
      - say: 'Some peroxide oxygen goes from minus one up to zero in O₂. That is oxidation.'
        write: 'O, −1 to 0, oxidation'
      - say: 'The rest goes from minus one down to minus two in NaOH. That is reduction.'
        write: 'O, −1 to −2, reduction'
      - say: 'Sodium stays plus one, and the hydrogen and oxygen of water do not change. So the peroxide is both oxidized and reduced at once, and this is called disproportionation.'
        write: 'Na, H and water''s O unchanged, so $\ce{Na2O2}$ disproportionates'
      - section: 'Check'
        say: 'Check. O₂ is what the oxidation makes, a product, so it cannot be the substance that was oxidized.'
        write: '$\ce{O2}$ = product of oxidation ✓'
      - section: 'Answer'
        say: 'So the substance oxidized is Na₂O₂, which is option A.'
        write: '$\therefore$ $\ce{Na2O2(s)}$'
        answer: true
    traps:
      B: 'You went for NaOH. It is a product, and nothing in it is being oxidized.'
      C: 'You went for water. The oxygen and hydrogen in water keep the same oxidation numbers.'
      D: 'You went for O₂. It is formed by the oxidation, so it is the product, not the substance oxidized.'
  11:
    moments:
      - section: 'The question'
        say: 'Here is an energy profile with three gaps marked X, Y and Z. Z does not reach the top of the hump. So what is it?'
        write: 'Z on the energy profile = ?'
      - section: 'The rule'
        say: 'The heat of reaction, delta H, is the energy of the products minus the energy of the reactants.'
        write: '$\Delta H = H_{\text{products}} - H_{\text{reactants}}$'
      - section: 'Reading the diagram'
        say: 'Look where Z starts and stops. It runs from the level of A plus B up to the level of C plus D.'
        write: 'Z joins A + B to C + D'
      - say: 'That gap is exactly products minus reactants, so Z is the heat of reaction.'
        write: 'Z = $\Delta H$'
      - say: 'The products sit above the reactants, so this reaction is endothermic and delta H is positive.'
        write: 'Products higher, so endothermic, $\Delta H > 0$'
      - section: 'Check'
        say: 'Check. An activation energy always reaches up to the peak X. Z stops at the product level, so it is not an activation energy.'
        write: 'Activation energy reaches the peak X; Z does not ✓'
      - section: 'Answer'
        say: 'So Z represents the heat of reaction, which is option A.'
        write: '$\therefore$ Z = heat of reaction'
        answer: true
    traps:
      B: 'You went for activation energy. Activation energy is measured from a starting level up to the peak X. Z stops at the products.'
      C: 'You went for free energy. Free energy cannot be read from this simple energy profile.'
      D: 'You went for entropy. Entropy is a measure of disorder, and it is not shown on this diagram.'
  12:
    moments:
      - section: 'The question'
        say: 'The atom is mostly empty space with a tiny heavy centre. What is packed into that centre?'
        write: 'Nucleus contains = ?'
      - section: 'The fact'
        say: 'An atom has a small dense nucleus with electrons moving around it.'
        write: 'Atom = nucleus + electrons around it'
      - say: 'The nucleus holds the protons, which are positive, and the neutrons, which have no charge.'
        write: 'Nucleus = protons (+) + neutrons (0)'
      - say: 'Together, protons and neutrons are called nucleons. Their total is the mass number.'
        write: 'Mass number = protons + neutrons'
      - say: 'The electrons are not in the nucleus. They are in shells outside it.'
        write: 'Electrons, in shells outside'
      - section: 'Check'
        say: 'Ordinary hydrogen is the one nucleus with no neutron, but every other nucleus has both protons and neutrons.'
        write: '$\ce{^{1}_{1}H}$ has no neutron; all others have both ✓'
      - section: 'Answer'
        say: 'So the nucleus contains protons and neutrons, which is option D.'
        write: '$\therefore$ protons and neutrons'
        answer: true
    traps:
      A: 'You went for protons only. That leaves out the neutrons, which almost every nucleus contains.'
      B: 'You went for neutrons only. That leaves out the protons, which give the nucleus its charge.'
      C: 'You went for protons and electrons. The electrons move in shells around the nucleus, not inside it.'
  13:
    moments:
      - section: 'The question'
        say: 'A zinc rod goes into blue copper sulphate solution. Three of these things happen. We want the one that does not.'
        write: 'Zn rod in $\ce{CuSO4(aq)}$, what does NOT happen?'
      - section: 'The rule'
        say: 'A metal higher in the electrochemical series displaces a metal below it from its salt. Zinc is above copper.'
        write: 'Zn above Cu, so Zn displaces Cu'
      - section: 'The equation'
        say: 'Zinc plus copper two ions gives zinc ions and copper metal.'
        write: '$\ce{Zn(s) + Cu^2+(aq) -> Zn^2+(aq) + Cu(s)}$'
      - section: 'The working'
        say: 'Zinc loses two electrons and goes into solution as zinc ions. So the zinc rod dissolves.'
        write: '$\ce{Zn -> Zn^2+ + 2e-}$, rod dissolves'
      - say: 'Those electrons flow away from the zinc to the copper ions. They do not flow towards the zinc.'
        write: 'Electrons flow from Zn to $\ce{Cu^2+}$'
      - say: 'The blue copper two ions are used up, so the blue colour fades.'
        write: 'Blue $\ce{Cu^2+}$ used up, colour fades'
      - say: 'The reaction gives out heat, so the temperature of the solution changes.'
        write: 'Exothermic, temperature changes'
      - section: 'Check'
        say: 'Check. Dissolving, fading blue and a change of temperature all happen. Only electrons flowing towards the zinc is wrong.'
        write: 'B, C, D happen; A does not ✓'
      - section: 'Answer'
        say: 'So what does not happen is electrons flowing towards the zinc rod, which is option A.'
        write: '$\therefore$ electrons do not flow towards the zinc rod'
        answer: true
    traps:
      B: 'You went for the zinc rod dissolving. That does happen. Dissolving is exactly how zinc gives away its electrons.'
      C: 'You went for the temperature changing. That does happen, because the displacement gives out heat.'
      D: 'You went for the blue colour fading. That does happen, because the blue copper two ions are turned into copper metal.'
  14:
    moments:
      - section: 'The question'
        say: 'We pass electricity through caustic soda solution with platinum electrodes. Which statement about it is true?'
        write: 'Electrolysis of $\ce{NaOH(aq)}$, Pt electrodes'
      - section: 'The ions'
        say: 'Caustic soda is sodium hydroxide, NaOH. Its solution contains Na⁺, OH⁻ and a little H⁺ from the water. Platinum is inert, so it does not react.'
        write: 'Ions: $\ce{Na+}$, $\ce{H+}$, $\ce{OH-}$'
      - section: 'The rule'
        say: 'At each electrode, the ion lower in the electrochemical series is discharged first.'
        write: 'Lower in the series, discharged first'
      - section: 'At the cathode'
        say: 'At the cathode, hydrogen is discharged before sodium. Water gains electrons to give hydrogen gas and hydroxide ions.'
        write: '$\ce{2H2O + 2e- -> H2 + 2OH-}$'
      - section: 'At the anode'
        say: 'At the anode, hydroxide ions lose electrons to give water and oxygen gas.'
        write: '$\ce{4OH- -> 2H2O + O2 + 4e-}$'
      - section: 'The working'
        say: 'Look at the cathode again. Hydrogen leaves as gas, but extra hydroxide ions are left behind there.'
        write: 'Cathode, extra $\ce{OH-}$ left behind'
      - say: 'More hydroxide ions means the solution around the cathode becomes more alkaline.'
        write: 'Alkalinity at the cathode increases'
      - section: 'Check'
        say: 'Now check the others. Oxygen comes off at the anode and hydrogen at the cathode, not the other way round.'
        write: '$\ce{O2}$ at anode, $\ce{H2}$ at cathode ✓'
      - say: 'Sodium is far too reactive to be deposited from water, so no sodium forms.'
        write: 'No Na deposited ✓'
      - section: 'Answer'
        say: 'So the correct statement is that alkalinity at the cathode increases, which is option D.'
        write: '$\therefore$ alkalinity at the cathode increases'
        answer: true
    traps:
      A: 'You went for oxygen at the cathode. Oxygen is given off at the anode, where hydroxide ions lose electrons.'
      B: 'You went for hydrogen at the anode. Hydrogen is given off at the cathode, where it gains electrons.'
      C: 'You went for sodium at the cathode. Sodium is far too reactive to be deposited from a water solution, so hydrogen comes off instead.'
  15:
    moments:
      - section: 'The question'
        say: 'Here are four statements about hydrocarbons, and only one is false. Watch the small word any.'
        write: 'Which statement is INCORRECT?'
      - section: 'Statement D'
        say: 'Calcium carbide with water gives only one alkyne, which is ethyne.'
        write: '$\ce{CaC2 + 2H2O -> C2H2 + Ca(OH)2}$'
      - say: 'The carbide ion holds just two carbon atoms, so it can only make the two carbon alkyne. Saying any alkyne is false.'
        write: '$\ce{C2^2-}$ has 2 C, so only ethyne'
      - section: 'Statement A'
