      A: 'You went for molecular formula. The molecular formula shows the actual atoms in one molecule, which is C₂H₄O₂.'
      B: 'You went for general formula. The general formula of alkanoic acids is CₙH₂ₙ₊₁COOH.'
      D: 'You went for structural formula. A structural formula shows how the atoms are joined, as in CH₃COOH.'
