    moments:
      - section: 'The question'
        say: 'Ethanoic acid has two carbons, yet here it is written as CH₂O with only one. What kind of formula is that?'
        write: '$\ce{CH2O}$ for ethanoic acid is its ?'
      - section: 'The rule'
        say: 'The empirical formula is the simplest whole number ratio of atoms in a compound.'
        write: 'Empirical formula = simplest whole-number ratio'
      - section: 'The working'
        say: 'Ethanoic acid is CH₃COOH. Count the atoms. There are two carbons, four hydrogens and two oxygens.'
