      - say: 'Every number divides by two. Two, four and two become one, two and one.'
        write: '$\ce{C2H4O2}$ ÷ 2 = $\ce{CH2O}$'
      - say: 'So CH₂O is the simplest ratio, which is the empirical formula.'
        write: '$\ce{CH2O}$ = empirical formula'
      - section: 'Check'
        say: 'Check. Glucose, C₆H₁₂O₆, also reduces to CH₂O. Different compounds can share one empirical formula.'
        write: '$\ce{C6H12O6}$ ÷ 6 = $\ce{CH2O}$ ✓'
      - section: 'Answer'
        say: 'So CH₂O is regarded as the empirical formula of ethanoic acid, which is option C.'
        write: '$\therefore$ empirical formula'
        answer: true
