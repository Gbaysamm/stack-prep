  34:
    moments:
      - section: 'The question'
        say: 'Fire neutrons at element X. What does X become? Two numbers must balance, the top and the bottom.'
        write: '$\ce{^{y}_{Z}X}$ + neutron, product = ?'
      - section: 'The rule'
        say: 'In a nuclear equation, the mass numbers on top and the atomic numbers below must balance on both sides.'
        write: 'Top numbers balance; bottom numbers balance'
      - section: 'The neutron'
        say: 'A neutron has mass number one and atomic number zero, because it has no charge.'
        write: 'Neutron = $\ce{^{1}_{0}n}$'
      - section: 'The working'
        say: 'Top numbers. The left side has y plus one, so the product has mass number y plus one.'
        write: 'Mass, $y + 1 = y + 1$'
      - say: 'Bottom numbers. The left side has Z plus zero, so the product keeps atomic number Z.'
        write: 'Atomic number, $Z + 0 = Z$'
      - section: 'The equation'
        say: 'So X captures the neutron and becomes X with mass y plus one and atomic number Z.'
        write: '$\ce{^{y}_{Z}X + ^{1}_{0}n -> ^{y+1}_{Z}X}$'
      - section: 'Check'
        say: 'Check. Z has not changed, so it is still the same element, just a heavier isotope. That makes sense for a neutron.'
        write: 'Same Z, heavier isotope ✓'
      - section: 'Answer'
        say: 'So the nuclear equation is X with mass y plus one and atomic number Z, which is option B.'
        write: '$\therefore$ $\ce{^{y+1}_{Z}X}$'
        answer: true
    traps:
      A: 'You went for the first equation. It swaps the mass and atomic numbers of X, and nothing balances.'
      C: 'You went for atomic number Z plus one. A neutron has no charge, so it cannot raise the atomic number, and the top numbers do not balance.'
      D: 'You went for atomic number Z minus one. Adding a neutron with charge zero cannot lower the atomic number.'
  35:
    moments:
      - section: 'The question'
        say: 'There are five changes, and we must pick the ones that make a reaction go faster. One of them only makes more product, not faster product.'
        write: 'Which of 1 to 5 increase the rate?'
      - section: 'The rule'
        say: 'The rate rises when more particles collide each second with enough energy to react.'
        write: 'Rate ∝ successful collisions per second'
      - section: 'The working'
        say: 'One. Lowering the activation energy, with a catalyst, lets more collisions succeed. True.'
        write: '1. lower $E_a$ ✓'
      - say: 'Three. Raising the temperature gives particles more energy and more collisions. True.'
        write: '3. higher temperature ✓'
      - say: 'Five. Powdering a solid gives a bigger surface area, so more collisions happen. True.'
        write: '5. powder the solid, more surface ✓'
      - say: 'Two. Being a gas is not a rule for speeding a reaction up. It is not a change we can count on.'
        write: '2. gaseous state ✗'
      - say: 'Four. Removing products shifts an equilibrium to give more product. It raises the yield, not the speed.'
        write: '4. remove products, yield not rate ✗'
      - section: 'Check'
        say: 'Check. One, three and five each give more successful collisions per second. That is the set.'
        write: '1, 3, 5 ✓'
      - section: 'Answer'
        say: 'So the combination is one, three and five, which is option B.'
        write: '$\therefore$ 1, 3 and 5'
        answer: true
    traps:
      A: 'You went for one, two and three. It includes two, which is not a rule for increasing the rate, and leaves out powdering.'
      C: 'You went for two, three and five. It includes two and leaves out lowering the activation energy.'
      D: 'You went for three and four. Removing products affects the yield at equilibrium, not the rate.'
  36:
    moments:
      - section: 'The question'
        say: 'Take element number twelve. Will it give its electrons away or share them, and how many?'
        write: 'Z = 12, bonding and valency = ?'
      - section: 'The rule'
        say: 'Atoms bond to reach a stable outer shell of eight. An atom with only one, two or three outer electrons, such as a metal, loses them, and bonding by losing and gaining electrons is electrovalent bonding.'
        write: 'Lose electrons, electrovalent (ionic)'
      - section: 'The working'
        say: 'Twelve electrons fill the shells as two, eight, two. This is magnesium in group two.'
        write: 'Z = 12, 2, 8, 2, Mg, group II'
      - say: 'It loses its two outer electrons to become Mg²⁺, with the stable two, eight arrangement.'
        write: '$\ce{Mg -> Mg^2+ + 2e-}$'
      - say: 'Bonding by electron transfer is electrovalent, and losing two electrons means a valency of two.'
        write: 'Electrovalent, valency 2'
      - section: 'Example'
        say: 'For example, magnesium burns in chlorine to give the ionic solid MgCl₂.'
        write: '$\ce{Mg + Cl2 -> MgCl2}$'
      - section: 'Answer'
        say: 'So the element is electrovalent with a valency of two, which is option B.'
        write: '$\therefore$ electrovalent, valency 2'
        answer: true
    traps:
      A: 'You went for a valency of one. Magnesium has two outer electrons, so its valency is two.'
      C: 'You went for covalent with valency two. The two is right, but a metal like magnesium bonds by transfer, not by sharing.'
      D: 'You went for covalent with valency four. That fits carbon, not magnesium.'
