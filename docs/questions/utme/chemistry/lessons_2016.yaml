        say: 'Across a period, the nuclear charge rises by one at each step, while the electrons go into the same shell.'
        write: 'Across a period, more protons, same shell'
      - section: 'The working'
        say: 'The stronger pull draws the electrons in closer, so the atomic radius decreases.'
