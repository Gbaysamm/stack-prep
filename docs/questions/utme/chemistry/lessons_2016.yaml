  38:
    moments:
      - section: 'The question'
        say: 'A gas is warm and at slightly low pressure. Bring it to s t p. Will it grow or shrink?'
        write: 'V₁ = 146 cm³, T₁ = 18 °C, P₁ = 0.971 atm, V₂ at s.t.p. = ?'
      - section: 'The rule'
        say: 'We use the general gas equation. P one V one over T one equals P two V two over T two, with temperatures in kelvin.'
        write: '$\dfrac{P_1V_1}{T_1} = \dfrac{P_2V_2}{T_2}$'
      - section: 'Units'
        say: 'Change the temperature to kelvin. Eighteen plus two hundred and seventy-three is two hundred and ninety-one kelvin.'
        write: 'T₁ = 18 + 273 = 291 K'
      - say: 'At s t p, the pressure is one atmosphere and the temperature is two hundred and seventy-three kelvin.'
        write: 'P₂ = 1 atm, T₂ = 273 K'
      - section: 'The working'
        say: 'Make V two the subject. V two is P one times V one times T two, all over T one times P two.'
        write: '$V_2 = \dfrac{P_1V_1T_2}{T_1P_2}$'
      - say: 'Put in the numbers. P one is zero point nine seven one, V one is one hundred and forty-six, T two is two hundred and seventy-three, T one is two hundred and ninety-one and P two is one.'
        write: '$V_2 = \dfrac{0.971 \times 146 \times 273}{291 \times 1}$'
      - say: 'Zero point nine seven one times one hundred and forty-six is one hundred and forty-one point seven seven.'
        write: '$0.971 \times 146 = 141.77$'
      - say: 'Multiplying by two hundred and seventy-three and dividing by two hundred and ninety-one gives one hundred and thirty-three centimetres cubed.'
        write: '$V_2 = \dfrac{141.77 \times 273}{291} = 133$ cm³'
      - section: 'Check'
        say: 'Check. Cooling shrinks the gas, and the small rise in pressure squeezes it a little more. So it must come out below one hundred and forty-six. It does.'
        write: '133 cm³ < 146 cm³ ✓'
      - section: 'Answer'
        say: 'So the volume at s t p is one hundred and thirty-three centimetres cubed, which is option A.'
        write: '$\therefore V_2 = 133$ cm³'
        answer: true
    traps:
      B: 'You went for one hundred and forty-six. That leaves the volume unchanged and ignores the change of temperature and pressure.'
      C: 'You went for two hundred and sixty-six. That makes the gas grow, but cooling to two hundred and seventy-three kelvin and raising the pressure both shrink it.'
      D: 'You went for two hundred and ninety-two. That doubles the volume, which no change here can do.'
