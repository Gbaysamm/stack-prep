        say: 'Faraday''s laws. To deposit one mole of a metal whose ion carries n positive charges, we need n faradays. One faraday is ninety-six thousand five hundred coulombs.'
        write: '1 mol of $\ce{M^{n+}}$ needs $n$ F, 1 F = 96 500 C'
      - section: 'The equation'
        say: 'At the cathode, each copper two ion gains two electrons.'
        write: '$\ce{Cu^2+ + 2e- -> Cu}$'
      - say: 'So one mole of copper, sixty-four grams, needs two faradays. That is one hundred and ninety-three thousand coulombs.'
        write: '64 g Cu needs 2 × 96 500 = 193 000 C'
      - section: 'The working'
        say: 'Moles of copper is ten grams divided by sixty-four grams per mole, which is zero point one five six two five mole.'
        write: 'Moles of Cu $= \dfrac{10}{64} = 0.15625$ mol'
      - say: 'Charge is zero point one five six two five mole times one hundred and ninety-three thousand coulombs per mole.'
        write: '$Q = 0.15625 \times 193\,000$'
      - say: 'That gives thirty thousand one hundred and fifty-six point two five coulombs, about thirty thousand one hundred and fifty-six point three.'
        write: '$Q = 30\,156.25$ C ≈ 30 156.3 C'
      - section: 'Check'
        say: 'Check. Ten grams is a bit less than a sixth of sixty-four grams, and a sixth of one hundred and ninety-three thousand is about thirty-two thousand. Our answer is a little under that.'
        write: '$\tfrac{1}{6} \times 193\,000 \approx 32\,000$, so ≈ 30 000 ✓'
      - section: 'Answer'
        say: 'So the quantity of electricity is thirty thousand one hundred and fifty-six point three coulombs, which is option B.'
        write: '$\therefore Q = 30\,156.3$ C'
        answer: true
    traps:
      A: 'You went for thirty-two thousand three hundred and ninety-five point five. That does not come from ten grams of copper with two faradays per mole.'
      C: 'You went for about sixty thousand. That is about twice the charge needed, as if each copper ion took four electrons.'
      D: 'You went for about fifteen thousand. That uses only one faraday per mole, as if the ion were Cu⁺. Copper two needs two.'
  32:
