        say: 'First the oxygen in the air. Twenty percent of one hundred and fifty centimetres cubed is thirty centimetres cubed.'
        write: '$\ce{O2} = \dfrac{20}{100} \times 150 = 30$ cm³'
      - say: 'Fifty centimetres cubed of carbon two oxide needs half as much oxygen, which is twenty-five centimetres cubed.'
        write: '$\ce{O2}$ needed $= \dfrac{50}{2} = 25$ cm³'
      - say: 'We have thirty, and we need only twenty-five. So five centimetres cubed of oxygen is left over.'
        write: '$\ce{O2}$ left $= 30 - 25 = 5$ cm³'
      - section: 'Check'
        say: 'Check. All fifty centimetres cubed of carbon two oxide is used up, so it cannot be the one in excess.'
        write: 'All $\ce{CO}$ used, $\ce{O2}$ in excess ✓'
