        write: 'Electron affinity, electronegativity increase'
      - section: 'Remember'
        say: 'Remember. Across a period, size goes down, and everything that pulls goes up.'
        write: 'Size down, pull up'
      - section: 'Answer'
        say: 'So the property that decreases across a period is atomic radius, which is option D.'
        write: '$\therefore$ atomic radius'
        answer: true
    traps:
