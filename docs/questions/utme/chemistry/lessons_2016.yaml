        write: '$\ce{H2O}$, two O−H; $\ce{CH3OH}$, one O−H'
      - say: 'So water forms more hydrogen bonds per molecule, and its intermolecular forces are stronger.'
        write: 'More hydrogen bonds in water, stronger forces'
      - section: 'Check'
        say: 'Check. Water boils at one hundred degrees Celsius and methanol at about sixty-five. The stronger forces win.'
        write: '100 °C > 65 °C ✓'
      - section: 'Answer'
        say: 'So the intermolecular forces in water are stronger than those in methanol, which is option B.'
        write: '$\therefore$ stronger intermolecular forces in water'
        answer: true
    traps:
