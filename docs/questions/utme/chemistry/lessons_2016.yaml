    moments:
      - section: 'The question'
        say: 'Fifty centimetres cubed of carbon two oxide meets one hundred and fifty centimetres cubed of air. But only part of that air is oxygen.'
        write: '50 cm³ $\ce{CO}$ + 150 cm³ air (20% $\ce{O2}$), excess = ?'
      - section: 'The rule'
        say: 'We use Gay-Lussac''s law. Gases react in simple whole number ratios by volume, the same as the mole ratio in the equation.'
        write: 'Volume ratio = mole ratio'
      - section: 'The equation'
        say: 'Two CO plus O₂ gives two CO₂. So two volumes of carbon two oxide need one volume of oxygen.'
        write: '$\ce{2CO + O2 -> 2CO2}$, 2 vol : 1 vol'
