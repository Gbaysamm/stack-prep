        say: 'At the cathode, Ag⁺ plus one electron gives Ag. So one mole of electrons, ninety-six thousand five hundred coulombs, deposits one hundred and eight grams of silver.'
        write: '$\ce{Ag+ + e- -> Ag}$, 96 500 C deposits 108 g'
      - section: 'The working'
        say: 'Charge passed is ten amperes times four thousand eight hundred and thirty seconds, which is forty-eight thousand three hundred coulombs.'
        write: 'Q = 10 A × 4830 s = 48 300 C'
      - say: 'Compare with one faraday. Forty-eight thousand three hundred divided by ninety-six thousand five hundred is about zero point five.'
        write: '$\dfrac{48\,300}{96\,500}$ ≈ 0.5 mol of electrons'
      - say: 'Each mole of electrons gives one mole of silver, so we get zero point five mole of silver.'
        write: 'Moles of Ag = 0.5 mol'
      - say: 'Mass is moles times molar mass. Zero point five times one hundred and eight grams per mole is fifty-four grams.'
        write: 'Mass = 0.5 × 108 = 54.0 g'
      - section: 'Check'
        say: 'Check. Only about half a faraday passed, so we expect half of one hundred and eight grams. Fifty-four is half.'
        write: '½ × 108 = 54 ✓'
      - section: 'Answer'
        say: 'So fifty-four grams of silver is deposited, which is option B.'
        write: '$\therefore$ mass of Ag = 54.0 g'
        answer: true
    traps:
      A: 'You went for one hundred and eight grams. That assumes a full ninety-six thousand five hundred coulombs passed. Only forty-eight thousand three hundred did, about half.'
      C: 'You went for twenty-seven grams. That treats silver as Ag²⁺, needing two electrons per atom. Silver needs only one.'
      D: 'You went for thirteen point five grams. That divides by four. The silver ion takes only one electron per atom.'
  17:
    moments:
      - section: 'The question'
        say: 'CO plus steam gives CO₂ plus hydrogen. We have three heats of formation, but there are four substances. What do we use for the fourth?'
        write: '$\Delta H_f$: $\ce{CO2}$ = −394, $\ce{H2O(g)}$ = −242, $\ce{CO}$ = −110 kJ mol⁻¹'
      - section: 'The rule'
        say: 'We use Hess''s law. The enthalpy change is the sum of the heats of formation of the products minus the sum for the reactants.'
        write: '$\Delta H = \sum \Delta H_f(\text{products}) - \sum \Delta H_f(\text{reactants})$'
      - say: 'An element in its normal state has a heat of formation of zero. So hydrogen gas is zero.'
        write: '$\Delta H_f(\ce{H2}) = 0$'
      - section: 'The equation'
        say: 'The equation is CO gas plus H₂O gas gives CO₂ gas plus H₂ gas.'
        write: '$\ce{CO(g) + H2O(g) -> CO2(g) + H2(g)}$'
      - section: 'The working'
        say: 'For the products, minus three hundred and ninety-four plus zero is minus three hundred and ninety-four kilojoules per mole.'
        write: 'Products = −394 + 0 = −394 kJ mol⁻¹'
      - say: 'For the reactants, minus one hundred and ten plus minus two hundred and forty-two is minus three hundred and fifty-two kilojoules per mole.'
        write: 'Reactants =(−110) + (−242) = −352 kJ mol⁻¹'
      - say: 'Products minus reactants is minus three hundred and ninety-four minus minus three hundred and fifty-two.'
        write: '$\Delta H$ = −394 − (−352)'
      - say: 'That is minus three hundred and ninety-four plus three hundred and fifty-two, which is minus forty-two kilojoules per mole.'
        write: '= −394 + 352 = −42 kJ mol⁻¹'
      - section: 'Check'
        say: 'Check. The products sit lower in energy than the reactants, so heat is given out, and the sign is negative.'
        write: '−394 below −352, exothermic ✓'
      - section: 'Answer'
        say: 'So the standard heat change is minus forty-two kilojoules per mole, which is option B.'
        write: '$\therefore \Delta H = -42$ kJ mol⁻¹'
        answer: true
    traps:
      A: 'You went for minus two hundred and eighty-two. That leaves out the water term. Steam is a reactant, so its minus two hundred and forty-two must be counted.'
      C: 'You went for plus forty-two. The size is right, but you did reactants minus products. Always do products minus reactants.'
      D: 'You went for plus two hundred and sixty-two. That adds the values with the wrong signs. Products minus reactants gives minus forty-two.'
