      - section: 'The question'
        say: 'A gas grows from three point two five to nine point seven five decimetres cubed at constant pressure. How many times hotter did it get, in kelvin?'
        write: '$V_1$ = 3.25 dm³, $V_2$ = 9.75 dm³, P constant, $T_2$ to $T_1$ = ?'
      - section: 'The rule'
        say: 'We use Charles''s law. At constant pressure, volume is directly proportional to absolute temperature.'
        write: 'Charles''s law: $\dfrac{V_1}{T_1} = \dfrac{V_2}{T_2}$'
      - section: 'The working'
        say: 'Rearrange to get the temperature ratio. T two over T one equals V two over V one.'
        write: '$\dfrac{T_2}{T_1} = \dfrac{V_2}{V_1}$'
      - say: 'Put in the volumes. That gives nine point seven five over three point two five.'
        write: '$\dfrac{T_2}{T_1} = \dfrac{9.75}{3.25}$'
      - say: 'Three point two five times three is nine point seven five. So the ratio is three.'
        write: '$\dfrac{T_2}{T_1} = 3$'
      - say: 'So the final temperature to the initial temperature is three to one.'
        write: '$T_2$ to $T_1$ = 3 to 1'
      - section: 'Check'
        say: 'Check. The volume trebled, so the kelvin temperature must treble too. That is what direct proportion means.'
        write: 'V × 3, so T × 3 ✓'
      - section: 'Answer'
        say: 'So the ratio is three to one, which is option A.'
        write: '$\therefore$ 3 : 1'
        answer: true
    traps:
      B: 'You went for five to two. Nine point seven five divided by three point two five is three, not two point five.'
      C: 'You went for five to four. That does not come from the volumes. Nine point seven five over three point two five is three.'
      D: 'You went for eight to three. That does not come from the volumes. The volume trebled, so the temperature trebled.'
