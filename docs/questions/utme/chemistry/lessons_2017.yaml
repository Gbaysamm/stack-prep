        write: 'Number of bonds an atom can form = ?'
      - section: 'The definition'
        say: 'Valence, or valency, is the combining power of an atom. It is the number of bonds the atom can form.'
        write: 'Valency = combining power = number of bonds'
      - section: 'Examples'
        say: 'Carbon has a valency of four, so it forms four bonds in methane, CH₄.'
        write: 'C, valency 4, $\ce{CH4}$'
      - say: 'Oxygen has a valency of two, so it forms two bonds in water, H₂O.'
        write: 'O, valency 2, $\ce{H2O}$'
      - say: 'Hydrogen has a valency of one, so it forms one bond.'
        write: 'H, valency 1'
      - section: 'Check'
        say: 'Check. Oxidation number can change. Carbon goes from minus four in methane to plus four in CO₂. But carbon still forms four bonds in both. That is valency.'
        write: 'C: oxidation number −4 to +4, valency 4 ✓'
      - section: 'Answer'
        say: 'So the term is valence, which is option B.'
        write: '$\therefore$ valence'
        answer: true
    traps:
      A: 'You went for oxidation number. That is the apparent charge on an atom, and it can change sign. It is not the number of bonds.'
      C: 'You went for atomic number. That is the number of protons in the nucleus.'
      D: 'You went for electronegativity. That is how strongly an atom pulls shared electrons, not how many bonds it forms.'
