      A: 'You went for four times ten to the minus twenty-three. A negative power of ten is far too small. A mole of anything is a huge number of particles.'
      B: 'You went for three times ten to the minus twenty-three. That is also far too small. Multiply by Avogadro''s constant, do not divide by it.'
      D: 'You went for six times ten to the twenty-four. That is ten electrons per copper. Copper goes from plus two to zero, so it takes only two.'
