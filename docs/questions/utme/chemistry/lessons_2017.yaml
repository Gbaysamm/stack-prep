# UTME 2017 Chemistry, lessons for the board (voice + board), one per kept question.
#
# Each lesson is a run of moments, taught the Nigerian classroom way: the question, the rule in
# words then written, the balanced equation, the working with units one step at a time, the
# check, and the answer moment naming the option. `traps` speaks to a student who chose a wrong
# option. Spoken lines (say, traps) write formulas as formulas (the voice reads them letter by
# letter) and say units in words. Answers match explanations_2017.yaml. All 40 questions are taught.
format_version: 1
exam_year: 2017
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'A welder cuts through a thick steel gate with a flame. Which flame is hot enough to do that? Two options here both say acetylene, so look closely.'
        write: 'Flame used by welders to cut metals = ?'
      - section: 'The fact'
        say: 'To cut steel, the flame must melt it. That needs about three thousand degrees Celsius.'
        write: 'Cutting steel needs about 3000 °C'
      - say: 'Acetylene is the old name for ethyne, C₂H₂. It burns with a very large heat output.'
        write: 'Acetylene = ethyne, $\ce{C2H2}$'
      - section: 'The equation'
        say: 'Two C₂H₂ plus five O₂ gives four CO₂ plus two H₂O, and a lot of heat.'
        write: '$\ce{2C2H2 + 5O2 -> 4CO2 + 2H2O}$'
      - section: 'The reason'
        say: 'In the welder''s torch, the ethyne burns in pure oxygen, not in air. Air is mostly nitrogen, and nitrogen soaks up heat.'
        write: 'Pure $\ce{O2}$, no $\ce{N2}$ to absorb heat'
      - say: 'With pure oxygen the flame reaches about three thousand degrees. That is the oxy-acetylene flame.'
        write: 'Oxy-acetylene flame ≈ 3000 °C'
      - section: 'Check'
        say: 'Check. Think of the roadside welder in Lagos with two cylinders on his trolley. One is acetylene and the other is oxygen.'
        write: 'Two cylinders, acetylene + oxygen ✓'
      - section: 'Answer'
        say: 'So welders cut metals with the oxy-acetylene flame, which is option D.'
        write: '$\therefore$ oxy-acetylene flame'
        answer: true
    traps:
      A: 'You went for the butane gas flame. That is the cooking gas in your kitchen. It burns in air at a far lower temperature and cannot cut steel.'
      B: 'You went for the acetylene flame. You are close, but acetylene burnt in air alone is smoky and too cool. The pure oxygen is what makes it hot enough.'
      C: 'You went for the kerosene flame. That is the cooler, smoky flame of a lantern or a stove. It cannot melt steel.'
  2:
    moments:
      - section: 'The question'
        say: 'We have two salts, X and Y, and their solubility curves. At room temperature, three hundred kelvin, how do they compare? Many students look where the curves cross, but that is not room temperature.'
        write: 'Fig. 1, compare X and Y at 300 K'
      - section: 'The rule'
        say: 'To read a solubility curve, go up from the temperature to the curve, then go across to the solubility axis.'
        write: 'Temperature $\uparrow$ to curve, then $\leftarrow$ to solubility'
      - section: 'The working'
        say: 'Find three hundred kelvin on the temperature axis. It is just to the left of the three hundred and three kelvin line.'
        write: 'T = 300 K'
      - say: 'Go up to curve Y and across. Y is at about thirty-eight grams per hundred grams of water.'
        write: 'Y ≈ 38 g per 100 g water'
      - say: 'Now go up to curve X and across. X is lower, at about nineteen grams per hundred grams of water.'
        write: 'X ≈ 19 g per 100 g water'
      - say: 'Compare them. Thirty-eight divided by nineteen is two.'
        write: '$\dfrac{38}{19} = 2$'
      - say: 'So at room temperature, Y dissolves twice as much as X.'
        write: 'Y = 2 × X at 300 K'
      - section: 'Check'
        say: 'Check. The curves cross only at about three hundred and thirty-three kelvin, much hotter than the room. At three hundred kelvin, Y is clearly the higher curve.'
        write: 'Curves cross near 333 K, not 300 K ✓'
      - section: 'Answer'
        say: 'So Y is twice as soluble as X at three hundred kelvin, which is option A.'
        write: '$\therefore$ Y is twice as soluble as X'
        answer: true
    traps:
      B: 'You went for X twice as soluble as Y. That swaps the curves. At three hundred kelvin, X is the lower one.'
      C: 'You went for the same solubility. The curves are equal only where they cross, near three hundred and thirty-three kelvin. At room temperature Y is still well above X.'
      D: 'You went for X three times as soluble as Y. At three hundred kelvin X is the less soluble salt, so it cannot be three times Y.'
  3:
    moments:
      - section: 'The question'
        say: 'SO₃ meets water and gives H₂SO₄. We have three heats of formation. What is the enthalpy change? Watch the signs, because one option is the right number with the wrong sign.'
        write: '$\Delta H_f$: $\ce{SO3(g)}$ = −395, $\ce{H2O(l)}$ = −286, $\ce{H2SO4(l)}$ = −811 kJ mol⁻¹'
      - section: 'The rule'
        say: 'We use Hess''s law. The enthalpy change of a reaction is the sum of the heats of formation of the products minus the sum for the reactants.'
        write: '$\Delta H = \sum \Delta H_f(\text{products}) - \sum \Delta H_f(\text{reactants})$'
      - section: 'The equation'
        say: 'The equation is SO₃ gas plus H₂O liquid gives H₂SO₄ liquid.'
        write: '$\ce{SO3(g) + H2O(l) -> H2SO4(l)}$'
      - section: 'The working'
        say: 'The product side has only H₂SO₄, so the products add up to minus eight hundred and eleven kilojoules.'
        write: 'Products = −811 kJ'
      - say: 'The reactants are minus three hundred and ninety-five plus minus two hundred and eighty-six, which is minus six hundred and eighty-one kilojoules.'
        write: 'Reactants = (−395) + (−286) = −681 kJ'
      - say: 'Now take products minus reactants. That is minus eight hundred and eleven minus minus six hundred and eighty-one.'
        write: '$\Delta H$ = −811 − (−681)'
      - say: 'Minus a minus becomes a plus, so it is minus eight hundred and eleven plus six hundred and eighty-one.'
        write: '= −811 + 681'
      - say: 'That gives minus one hundred and thirty kilojoules.'
        write: '= −130 kJ'
      - section: 'Check'
        say: 'Check. The answer is negative, so heat is given out. That fits, because SO₃ reacts with water very violently and gets hot.'
        write: '$\Delta H < 0$, exothermic ✓'
      - section: 'Answer'
        say: 'So the enthalpy change is minus one hundred and thirty kilojoules, which is option B.'
        write: '$\therefore \Delta H = -130$ kJ'
        answer: true
    traps:
      A: 'You went for minus one thousand and thirty-two kilojoules. That adds the reactant values to the product value. Hess''s law takes them away.'
      C: 'You went for plus one hundred and thirty. The number is right but the sign is wrong, because you did reactants minus products. Always do products minus reactants.'
      D: 'You went for plus one thousand and thirty-two. That adds everything and flips the sign. Take the reactants away from the products.'
  4:
    moments:
      - section: 'The question'
        say: 'Chlorine combines with a metal X twice, giving Y and then Z. Which law do the masses show? The trick is to compare the two ratios.'
        write: 'Y: 0.36 g Cl + 0.20 g X,  Z: 0.71 g Cl + 0.40 g X'
      - section: 'The rule'
        say: 'The law of constant composition says a pure compound always has the same elements joined in the same fixed ratio by mass, however it is made.'
        write: 'Constant composition, same compound = same mass ratio'
      - section: 'The working'
        say: 'In Y, divide the chlorine by the X. Zero point three six grams divided by zero point two zero grams is one point eight zero.'
        write: 'Y: $\dfrac{0.36}{0.20}$ = 1.80 g Cl per g X'
      - say: 'In Z, zero point seven one grams divided by zero point four zero grams is one point seven eight.'
        write: 'Z: $\dfrac{0.71}{0.40}$ = 1.78 g Cl per g X'
      - say: 'One point eight zero and one point seven eight are the same within experimental error.'
        write: '1.80 ≈ 1.78'
      - say: 'So Y and Z are really the same compound, with the same fixed ratio of chlorine to X.'
        write: 'Y and Z are the same compound'
      - section: 'Check'
        say: 'Check. If the law were multiple proportion, the two ratios would differ in a simple ratio like one to two. Here they are one to one.'
        write: '1.80 to 1.78 ≈ 1 to 1, not 1 to 2 ✓'
      - section: 'Answer'
        say: 'So the data show the law of constant composition, which is option C.'
        write: '$\therefore$ law of constant composition'
        answer: true
    traps:
      A: 'You went for multiple proportion. That needs two different compounds whose ratios stand in a simple ratio like one to two. Here the ratios are the same.'
      B: 'You went for conservation of mass. That compares total mass before and after one reaction, and we are not given that.'
      D: 'You went for reciprocal proportion. That compares two elements each joining a third element. Only two elements appear here.'
  5:
    moments:
      - section: 'The question'
        say: 'Element X, mass number y and atomic number z, is hit by neutrons. Which nuclear equation is right? Think about what a neutron carries.'
        write: '$\ce{^{y}_{z}X + ^{1}_{0}n -> ?}$'
      - section: 'The rule'
        say: 'In a nuclear equation, the mass numbers on top must add up to the same total on both sides. So must the atomic numbers at the bottom.'
        write: 'Top totals equal, bottom totals equal'
      - say: 'A neutron has mass number one and atomic number zero, because it has no charge.'
        write: 'Neutron = $\ce{^{1}_{0}n}$'
      - section: 'The working'
        say: 'Add the tops. y plus one gives y plus one.'
        write: 'Top: y + 1'
      - say: 'Add the bottoms. z plus zero is just z.'
        write: 'Bottom: z + 0 = z'
      - section: 'The equation'
        say: 'So the product has mass number y plus one and atomic number z.'
        write: '$\ce{^{y}_{z}X + ^{1}_{0}n -> ^{y+1}_{z}X}$'
      - section: 'Check'
        say: 'Check. The atomic number has not changed, so it is still element X. It is just a heavier isotope.'
        write: 'Same z, so same element, heavier isotope ✓'
      - section: 'Answer'
        say: 'So the product is X with mass number y plus one and atomic number z, which is option B.'
        write: '$\therefore \ce{^{y+1}_{z}X}$'
        answer: true
    traps:
      A: 'You went for y minus one on top and z plus one below. Capturing a neutron makes the nucleus heavier, not lighter, and z cannot change.'
      C: 'You went for z plus one. That raises the atomic number, but a neutron carries no charge, so z stays the same.'
      D: 'You went for z minus one. That lowers the atomic number, but a neutron carries no charge, so z stays the same.'
  6:
    moments:
      - section: 'The question'
        say: 'Vapour density compares a gas with another gas. But which one? There are four options and four reference gases.'
        write: 'Vapour density = mass of gas compared with an equal volume of ?'
      - section: 'The definition'
        say: 'Vapour density is the mass of a volume of the gas divided by the mass of the same volume of hydrogen, at the same temperature and pressure.'
        write: 'V.D. = $\dfrac{\text{mass of a volume of gas}}{\text{mass of the same volume of } \ce{H2}}$'
      - section: 'The reason'
        say: 'Hydrogen is used because it is the lightest gas of all. It makes a natural standard.'
        write: '$\ce{H2}$ is the lightest gas'
      - say: 'A hydrogen molecule has a relative molecular mass of two.'
        write: '$M_r(\ce{H2}) = 2$'
      - say: 'So the relative molecular mass of any gas is two times its vapour density.'
        write: '$M_r = 2 \times$ V.D.'
      - section: 'Check'
        say: 'Check with oxygen. Its relative molecular mass is thirty-two, so its vapour density is sixteen. It is sixteen times as heavy as hydrogen.'
        write: '$\ce{O2}$: V.D. = 32 ÷ 2 = 16 ✓'
      - section: 'Answer'
        say: 'So the gas is compared with an equal volume of hydrogen, which is option B.'
        write: '$\therefore$ compared with an equal volume of hydrogen'
        answer: true
    traps:
      A: 'You went for water vapour. Water vapour is not the reference gas. Vapour density always uses hydrogen.'
      C: 'You went for oxygen. Oxygen is a reference in some other places, but for vapour density the standard is hydrogen, the lightest gas.'
      D: 'You went for mass minus vapour pressure. You cannot take a pressure away from a mass. That idea belongs to collecting a gas over water.'
  7:
    moments:
      - section: 'The question'
        say: 'Thirty decimetres cubed of oxygen at ten atmospheres is squeezed into a twenty decimetre cubed container. Before any working, will the pressure go up or down?'
        write: '$V_1$ = 30 dm³, $P_1$ = 10 atm, $V_2$ = 20 dm³, $P_2$ = ?'
      - section: 'The rule'
        say: 'We use Boyle''s law. At constant temperature, pressure times volume stays the same for a fixed mass of gas.'
        write: "Boyle's law: $P_1V_1 = P_2V_2$"
      - section: 'The working'
        say: 'We want P two, so divide both sides by V two.'
        write: '$P_2 = \dfrac{P_1V_1}{V_2}$'
      - say: 'Put in the numbers. That is ten atmospheres times thirty decimetres cubed, over twenty decimetres cubed.'
        write: '$P_2 = \dfrac{10 \times 30}{20}$'
      - say: 'Ten times thirty is three hundred.'
        write: '$P_2 = \dfrac{300}{20}$'
      - say: 'Three hundred divided by twenty is fifteen. The decimetres cubed cancel, so the unit is atmospheres.'
        write: '$P_2$ = 15.0 atm'
      - section: 'Check'
        say: 'Check. The gas was squeezed into a smaller space, so the pressure should rise. Fifteen is more than ten, so it makes sense.'
        write: '15 atm > 10 atm ✓'
      - section: 'Answer'
        say: 'So the new pressure is fifteen point zero atmospheres, which is option B.'
        write: '$\therefore P_2$ = 15.0 atm'
        answer: true
    traps:
      A: 'You went for six point seven atmospheres. That puts the volumes the wrong way up, ten times twenty over thirty, and makes the pressure fall in a smaller container.'
      C: 'You went for sixty atmospheres. That is far too large. Ten times thirty over twenty is fifteen.'
      D: 'You went for sixty-six atmospheres. That is an arithmetic slip. Ten times thirty over twenty is fifteen.'
  8:
    moments:
      - section: 'The question'
        say: 'Water is in a pot on the fire. At what exact point does it start to boil? One option describes evaporation, and that is the trap.'
        write: 'A liquid boils when …?'
      - section: 'The fact'
        say: 'A liquid boils when its saturated vapour pressure equals the atmospheric pressure above it.'
        write: 'Boiling: s.v.p. = atmospheric pressure'
      - section: 'The reason'
        say: 'As the liquid heats up, its vapour pressure rises. When it matches the air pressure, bubbles of vapour can form inside the liquid and push their way out.'
        write: 's.v.p. rises with temperature'
      - say: 'At sea level, the air pressure is seven hundred and sixty millimetres of mercury, and water reaches that vapour pressure at one hundred degrees Celsius.'
        write: '$\ce{H2O}$: s.v.p. = 760 mmHg at 100 °C'
      - section: 'An example'
        say: 'On a high mountain like the Obudu plateau, the air pressure is lower. So water boils there below one hundred degrees.'
        write: 'Lower air pressure, lower boiling point'
      - section: 'Check'
        say: 'Check. Molecules leave the surface even at room temperature, which is why wet clothes dry. That is evaporation, not boiling.'
        write: 'Escaping the surface = evaporation ✓'
      - section: 'Answer'
        say: 'So a liquid boils when its vapour pressure equals the atmospheric pressure, which is option C.'
        write: '$\therefore$ s.v.p. = atmospheric pressure'
        answer: true
    traps:
      A: 'You went for vapour pressure equal to that of its solid. That describes the melting point, where solid and liquid meet.'
      B: 'You went for molecules escaping the surface. That is evaporation, and it happens at every temperature, like clothes drying on a line.'
      D: 'You went for a slight increase in volume. Liquids do expand a little when heated, but that does not make them boil.'
  9:
    moments:
      - section: 'The question'
        say: 'We have four elements with atomic numbers two, six, sixteen and twenty. Which one is a metal? One of them has two outer electrons but is no metal at all.'
        write: 'W = 2, X = 6, Y = 16, Z = 20. Metal = ?'
      - section: 'The rule'
        say: 'Metals have one, two or three electrons in an outer shell that is not full. They lose them to form positive ions.'
        write: 'Metal: 1, 2 or 3 outer electrons, lost easily'
      - section: 'The working'
        say: 'W has two electrons. That is helium, and its only shell is full. It is a noble gas.'
        write: 'W (2) = 2, helium, noble gas'
      - say: 'X has six electrons, arranged two, four. That is carbon, a non-metal.'
        write: 'X (6) = 2, 4, carbon, non-metal'
      - say: 'Y has sixteen, arranged two, eight, six. That is sulphur, a non-metal.'
        write: 'Y (16) = 2, 8, 6, sulphur, non-metal'
      - say: 'Z has twenty, arranged two, eight, eight, two. That is calcium, in group two. It is a metal.'
        write: 'Z (20) = 2, 8, 8, 2, calcium, metal'
      - section: 'Check'
        say: 'Check. Calcium is the metal in limestone and in the chalk your teacher writes with. It loses two electrons to form Ca²⁺.'
        write: '$\ce{Ca -> Ca^2+ + 2e-}$ ✓'
      - section: 'Answer'
        say: 'So Z is the metal, which is option C.'
        write: '$\therefore$ Z is the metal'
        answer: true
    traps:
      A: 'You went for X. With two, four electrons, X is carbon, a non-metal.'
      B: 'You went for W. It has two electrons like group two, but those two fill its only shell. W is helium, a noble gas.'
      D: 'You went for Y. With two, eight, six electrons, Y is sulphur, a non-metal that gains electrons.'
  10:
    moments:
      - section: 'The question'
        say: 'Cathode rays land on an electrometer. What charge does it pick up? It all depends on what cathode rays are made of.'
        write: 'Cathode rays $\to$ electrometer, charge = ?'
      - section: 'The fact'
        say: 'Cathode rays are streams of electrons.'
        write: 'Cathode rays = electrons, $\ce{e-}$'
      - say: 'Electrons carry a negative charge.'
        write: 'Charge on $\ce{e-}$ is negative'
      - section: 'The evidence'
        say: 'J J Thomson showed this. In an electric field, cathode rays bend towards the positive plate, so they must be negative.'
        write: 'Bend towards + plate, so negative'
      - section: 'The working'
        say: 'When the rays fall on the electrometer, the electrons collect on it.'
        write: 'Electrons collect on the electrometer'
      - say: 'Extra electrons mean extra negative charge.'
        write: 'Electrometer becomes negative'
      - section: 'Check'
        say: 'Check. The rays start at the cathode, the negative electrode. Negative particles leave a negative electrode, so it all agrees.'
        write: 'From cathode (−), carrying − charge ✓'
      - section: 'Answer'
        say: 'So the electrometer becomes negatively charged, which is option A.'
        write: '$\therefore$ negatively charged'
        answer: true
    traps:
      B: 'You went for positively charged. Electrons carry negative charge, so collecting them cannot make the instrument positive.'
      C: 'You went for neutral. Collecting charged particles leaves the instrument charged, not neutral.'
      D: 'You went for bipolar. Only one kind of charge arrives, the negative charge of electrons.'
  11:
    moments:
      - section: 'The question'
        say: 'Big hydrocarbon molecules are heated with a catalyst and come out as smaller ones. What is that process called at a refinery like Warri?'
        write: 'Large hydrocarbons + heat + catalyst $\to$ smaller molecules'
      - section: 'The fact'
        say: 'Cracking is the breaking of large hydrocarbon molecules into smaller ones by heat, usually with a catalyst.'
        write: 'Cracking = breaking big hydrocarbons into small ones'
      - section: 'The equation'
        say: 'For example, C₁₀H₂₂ cracks into C₈H₁₈, which is in petrol, and C₂H₄, which is ethene.'
        write: '$\ce{C10H22 -> C8H18 + C2H4}$'
      - say: 'Check the balance. Ten carbons on the left, eight plus two on the right. Twenty-two hydrogens on the left, eighteen plus four on the right.'
        write: 'C: 10 = 8 + 2, H: 22 = 18 + 4'
      - section: 'The reason'
        say: 'Crude oil has too much heavy fraction and not enough petrol. Cracking turns the heavy part into the petrol and gas people need.'
        write: 'Heavy fractions $\to$ petrol + alkenes'
      - section: 'Check'
        say: 'Check. Polymerization runs the other way, small molecules joining into large ones. Cracking splits.'
        write: 'Cracking splits, polymerization joins ✓'
      - section: 'Answer'
        say: 'So the process is cracking, which is option C.'
        write: '$\therefore$ cracking'
        answer: true
    traps:
      A: 'You went for disintegration. That is a general word, used for radioactive decay. In the refinery the process is called cracking.'
      B: 'You went for polymerization. That joins small molecules into large ones, the reverse of what happens here.'
      D: 'You went for degradation. That is a loose word for breaking down, not the name of this process.'
  12:
    moments:
      - section: 'The question'
        say: 'Concentrated H₂SO₄ is added to white sugar. It turns brown, then black. What job is the acid doing? Drying and dehydrating sound alike, so be careful.'
        write: 'Sugar + conc. $\ce{H2SO4}$ $\to$ black carbon. Role of acid = ?'
      - section: 'The rule'
        say: 'A dehydrating agent removes the elements of water, hydrogen and oxygen in a two to one ratio, from inside a compound.'
        write: 'Dehydrating agent removes H and O as $\ce{H2O}$'
      - section: 'The equation'
        say: 'Sugar is sucrose, C₁₂H₂₂O₁₁. The acid pulls out eleven water molecules.'
        write: '$\ce{C12H22O11 ->[conc. H2SO4] 12C + 11H2O}$'
      - say: 'Check the balance. Twelve carbons go to twelve C. Twenty-two hydrogens and eleven oxygens make eleven H₂O.'
        write: 'H: 22 = 11 × 2, O: 11 = 11 × 1'
      - section: 'The working'
        say: 'Once the water is pulled out, only carbon is left. That is the black mass.'
        write: 'What is left = carbon, black'
      - section: 'Check'
        say: 'Check. The sugar was dry to start with. The water did not exist as moisture. It was made from H and O inside the sugar molecule.'
        write: 'No free water in dry sugar ✓'
      - section: 'Answer'
        say: 'So the acid acts as a dehydrating agent, which is option C.'
        write: '$\therefore$ dehydrating agent'
        answer: true
    traps:
      A: 'You went for a drying agent. A drying agent removes water that is already there as moisture. Here the water is pulled out of the sugar molecule itself.'
      B: 'You went for an oxidizing agent. Concentrated H₂SO₄ can oxidize, but turning sugar into carbon is the removal of water.'
      D: 'You went for a reducing agent. Concentrated H₂SO₄ is not a reducing agent.'
  13:
    moments:
      - section: 'The question'
        say: 'Think of smoke from a bush burning in the harmattan. What is it, chemically? It is a colloid, so we name its two parts.'
        write: 'Smoke = ? dispersed in ?'
      - section: 'The rule'
        say: 'A colloid is named by what is spread out, called the dispersed phase, and what it is spread in, called the dispersion medium.'
        write: 'Colloid = dispersed phase in dispersion medium'
      - section: 'The working'
        say: 'In smoke, the dispersed phase is tiny solid particles of soot and ash.'
        write: 'Dispersed phase = solid particles'
      - say: 'They float in air, so the dispersion medium is a gas.'
        write: 'Dispersion medium = gas, air'
      - say: 'Fog and mist are liquid droplets in a gas. Smoke, fog and mist are all called aerosols.'
        write: 'Aerosol = solid or liquid in gas'
      - section: 'Check'
        say: 'Check. Smoke rises and drifts in the wind, so it must be in air, not in a liquid.'
        write: 'Smoke drifts in air ✓'
      - section: 'Answer'
        say: 'So smoke is solid or liquid particles dispersed in gas, which is option B.'
        write: '$\therefore$ solid or liquid particles dispersed in gas'
        answer: true
    traps:
      A: 'You went for solid in liquid. That is a sol, like paint, not smoke.'
      C: 'You went for gas or liquid in liquid. Gas in liquid is a foam and liquid in liquid is an emulsion. Smoke is in air.'
      D: 'You went for liquid in liquid. That is an emulsion, like milk.'
  14:
    moments:
      - section: 'The question'
        say: 'Dilute H₂SO₄ is electrolysed with platinum electrodes. What comes off at the anode, and what at the cathode? The order of the answer matters.'
        write: 'Electrolysis of dil. $\ce{H2SO4}$, Pt electrodes. Anode, cathode = ?'
      - section: 'The ions'
        say: 'The solution holds H⁺ and SO₄²⁻ from the acid, and OH⁻ from the water.'
        write: '$\ce{H+}$, $\ce{SO4^2-}$, $\ce{OH-}$'
      - section: 'The rule'
        say: 'Positive ions go to the cathode. Negative ions go to the anode, and the one lower in the series is discharged first.'
        write: 'Cations $\to$ cathode, anions $\to$ anode'
      - section: 'The equation'
        say: 'At the cathode, two H⁺ plus two electrons gives H₂, which is hydrogen gas.'
        write: 'Cathode: $\ce{2H+ + 2e- -> H2}$'
      - say: 'At the anode, OH⁻ is discharged in preference to SO₄²⁻. Four OH⁻ gives two H₂O plus O₂ plus four electrons.'
        write: 'Anode: $\ce{4OH- -> 2H2O + O2 + 4e-}$'
      - section: 'The working'
        say: 'So oxygen comes off at the anode and hydrogen at the cathode, one volume to two volumes.'
        write: 'Anode $\ce{O2}$, cathode $\ce{H2}$, volumes 1 to 2'
      - section: 'Check'
        say: 'Check. Overall, only water is used up. That is why this is called the electrolysis of acidified water.'
        write: 'Overall $\ce{2H2O -> 2H2 + O2}$ ✓'
      - section: 'Answer'
        say: 'So the products at the anode and cathode are oxygen and hydrogen, which is option C.'
        write: '$\therefore$ anode = oxygen, cathode = hydrogen'
        answer: true
    traps:
      A: 'You went for sulphur and hydrogen. Sulphate ions are not discharged at the anode. Hydroxide ions are, giving oxygen.'
      B: 'You went for hydrogen and oxygen. Those are the right gases in the wrong order. Hydrogen ions are positive, so hydrogen forms at the cathode.'
      D: 'You went for hydrogen and sulphate ions. Sulphate is not discharged, and hydrogen forms at the cathode, not the anode.'
  15:
    moments:
      - section: 'The question'
        say: 'P plus Q gives three R plus S, and the forward reaction gives out heat. Which change gives us more R? One option is very popular and does nothing to yield.'
        write: '$\ce{P(g) + Q(g) <=> 3R(s) + S(g)}$, $\Delta H < 0$'
      - section: 'The rule'
        say: 'We use Le Chatelier''s principle. When a system at equilibrium is disturbed, the equilibrium shifts to oppose the change.'
        write: 'Equilibrium shifts to oppose the change'
      - section: 'The working'
        say: 'First count the gas moles. There are two on the left, P and Q, and only one on the right, S, because R is a solid.'
        write: 'Gas moles: left 2, right 1'
      - say: 'Remove some S. The system makes more S to replace it, so it shifts to the right, and more R forms with it.'
        write: 'Remove S $\Rightarrow$ shift right $\Rightarrow$ more R'
      - say: 'A larger vessel lowers the pressure. The system favours the side with more gas moles, which is the left, so less R forms.'
        write: 'Larger vessel, lower P $\Rightarrow$ shift left'
      - say: 'Heating favours the endothermic direction. The forward reaction is exothermic, so heating pushes it left, and less R forms.'
        write: 'Raise T $\Rightarrow$ favours backward reaction'
      - say: 'A catalyst speeds up both directions equally. Equilibrium comes sooner, but the yield stays the same.'
        write: 'Catalyst $\Rightarrow$ no change in yield'
      - section: 'Check'
        say: 'Check. Taking away a product is like selling bread from a bakery shelf. The baker keeps baking more to fill the gap.'
        write: 'Remove a product, more is made ✓'
      - section: 'Answer'
        say: 'So removing some S increases the yield of R, which is option C.'
        write: '$\therefore$ remove some S'
        answer: true
    traps:
      A: 'You went for a larger vessel. That lowers the pressure, which favours the left side with two moles of gas against one. Less R forms.'
      B: 'You went for raising the temperature. The forward reaction gives out heat, so heating pushes the equilibrium to the left.'
      D: 'You went for a catalyst. A catalyst speeds up both directions equally, so equilibrium comes faster but the yield does not change.'
  16:
    moments:
