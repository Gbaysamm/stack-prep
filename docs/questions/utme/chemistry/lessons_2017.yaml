  32:
    moments:
      - section: 'The question'
        say: 'Take one mole of a substance. How many atoms is that? There is a special name for that number.'
        write: 'Atoms in one mole = ?'
      - section: 'The definition'
        say: 'A mole is the amount of substance with as many particles as there are atoms in twelve grams of carbon twelve.'
        write: '1 mole = number of atoms in 12 g of carbon-12'
      - section: 'The number'
        say: 'That number is the Avogadro number, six point zero two times ten to the twenty-three.'
        write: '$N_A = 6.02 \times 10^{23}$'
      - section: 'An example'
        say: 'So twelve grams of carbon, one mole, holds six point zero two times ten to the twenty-three carbon atoms.'
        write: '12 g C = 1 mol = $6.02 \times 10^{23}$ atoms'
      - say: 'Think of a dozen. A dozen eggs is always twelve eggs. A mole of atoms is always the Avogadro number of atoms.'
        write: 'Dozen = 12, mole = $6.02 \times 10^{23}$'
      - section: 'Check'
        say: 'Check. The number is the same for every substance. A mole of iron and a mole of sulphur hold the same number of atoms.'
        write: 'Same count for every substance ✓'
      - section: 'Answer'
        say: 'So the number of atoms in one mole is the Avogadro number, which is option B.'
        write: '$\therefore$ the Avogadro number'
        answer: true
    traps:
      A: 'You went for the atomic number. That counts the protons in one atom, not the atoms in a mole.'
      C: 'You went for the gas constant. R links pressure, volume, moles and temperature. It is not a count of particles.'
      D: 'You went for the number of electrons. That depends on the element. The count in a mole is the same for every substance.'
  33:
    moments:
