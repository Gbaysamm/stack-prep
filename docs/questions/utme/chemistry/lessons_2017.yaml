        say: 'Sodium thiosulphate reacts with hydrochloric acid. Which change makes this reaction go fastest? Look at the state symbols before you choose.'
        write: '$\ce{Na2S2O3(aq) + 2HCl(aq) -> 2NaCl(aq) + H2O(l) + SO2(g) + S(s)}$'
      - section: 'The rule'
        say: 'Raising the temperature makes particles move faster, so more of them collide with enough energy to react.'
        write: 'T $\uparrow$ $\Rightarrow$ rate $\uparrow$'
      - say: 'Raising the concentration puts more particles in the same space, so they collide more often.'
        write: 'Concentration $\uparrow$ $\Rightarrow$ rate $\uparrow$'
      - section: 'The working'
        say: 'The reactants are both aqueous, in solution. Pressure only matters for reactants that are gases.'
        write: 'Reactants (aq), so pressure has no effect'
      - say: 'So the biggest increase comes from raising both temperature and concentration together.'
        write: 'T $\uparrow$ and concentration $\uparrow$'
      - section: 'Check'
        say: 'Check. In the classic experiment, the cross under the flask disappears fastest with hot, strong solutions.'
        write: 'Hot + concentrated = fastest ✓'
      - section: 'Answer'
        say: 'So an increase in temperature and in concentration gives the greatest rate, which is option D.'
        write: '$\therefore$ increase T and increase concentration'
        answer: true
    traps:
      A: 'You went for higher temperature with lower concentration. The lower concentration slows the reaction and works against the heating.'
      B: 'You went for less volume and more pressure. The reactants are in solution, so pressure makes no real difference.'
      C: 'You went for lower temperature with higher concentration. The cooling slows the reaction and works against the stronger solution.'
  39:
    moments:
      - section: 'The question'
        say: 'We have four compounds. Which has the lowest vapour density? Two of them tie, so work out every one.'
        write: 'Lowest V.D.? [O = 16, Cl = 35.5, H = 1, C = 12]'
      - section: 'The rule'
        say: 'Vapour density is the relative molecular mass divided by two. So the lowest molecular mass gives the lowest vapour density.'
        write: 'V.D. = $\dfrac{M_r}{2}$'
      - section: 'The working'
        say: 'Ethanoic acid, CH₃COOH, has two carbons, four hydrogens and two oxygens. Twenty-four plus four plus thirty-two is sixty.'
        write: '$\ce{CH3COOH}$ = 2(12) + 4(1) + 2(16) = 60'
      - say: 'Propanol, C₃H₇OH, has three carbons, eight hydrogens and one oxygen. Thirty-six plus eight plus sixteen is sixty.'
        write: '$\ce{C3H7OH}$ = 3(12) + 8(1) + 16 = 60'
      - say: 'For dichloromethane, CH₂Cl₂, twelve plus two plus seventy-one is eighty-five.'
        write: '$\ce{CH2Cl2}$ = 12 + 2 + 2(35.5) = 85'
      - say: 'Ethanal, CH₃CHO, has two carbons, four hydrogens and one oxygen. Twenty-four plus four plus sixteen is forty-four.'
        write: '$\ce{CH3CHO}$ = 2(12) + 4(1) + 16 = 44'
      - say: 'The smallest is forty-four, ethanal. Its vapour density is forty-four divided by two, which is twenty-two.'
        write: 'V.D. of ethanal = 44 ÷ 2 = 22'
      - section: 'Check'
        say: 'Check. Ethanal has the fewest heavy atoms, just one oxygen and no chlorine. It should be the lightest, and it is.'
        write: '44 < 60 = 60 < 85 ✓'
      - section: 'Answer'
        say: 'So ethanal has the lowest vapour density, which is option D.'
        write: '$\therefore$ ethanal'
        answer: true
    traps:
      A: 'You went for ethanoic acid. Its molecular mass is sixty, so its vapour density is thirty. Ethanal is lighter.'
      B: 'You went for propanol. Its molecular mass is also sixty, a tie with ethanoic acid. Ethanal at forty-four is lighter.'
      C: 'You went for dichloromethane. The two chlorines make it the heaviest, eighty-five, so its vapour density is the highest.'
  40:
    moments:
      - section: 'The question'
        say: 'A pure solid melts at a sharp temperature. Add an impurity, and what happens to the melting point? Melting and boiling go opposite ways here.'
        write: 'Impurity $\Rightarrow$ melting point ?'
      - section: 'The fact'
        say: 'An impurity lowers the melting point of a solid and makes it melt over a range of temperatures instead of sharply.'
        write: 'Impurity lowers the m.p. and widens the range'
      - section: 'The reason'
        say: 'The impurity breaks up the regular pattern of particles in the crystal. A broken pattern needs less energy to collapse.'
        write: 'Crystal pattern disrupted, less energy to melt'
      - section: 'An example'
        say: 'This is why salt is spread on icy roads in cold countries. Salty ice melts below zero degrees Celsius.'
        write: 'Salt + ice, melts below 0 °C'
      - section: 'A way to remember'
        say: 'Impurities pull the melting point down and push the boiling point up.'
        write: 'm.p. $\downarrow$, b.p. $\uparrow$'
      - section: 'Check'
        say: 'Check. That is how chemists test purity. A sharp melting point at the expected value shows a pure substance.'
        write: 'Sharp m.p. = pure ✓'
      - section: 'Answer'
        say: 'So an impurity makes the melting point reduce, which is option B.'
        write: '$\therefore$ reduce'
        answer: true
    traps:
      A: 'You went for zero. An impurity lowers the melting point a little. It does not make it zero.'
      C: 'You went for increase. Raising is what impurities do to the boiling point, not the melting point.'
      D: 'You went for stable. A sharp, steady melting point is the sign of a pure substance, not an impure one.'
