        write: 'Cu in $\ce{Cu}$ = 0'
      - section: 'The equation'
        say: 'Going from plus two to zero means each copper ion gains two electrons.'
        write: '$\ce{Cu^2+ + 2e- -> Cu}$'
      - say: 'So one mole of copper needs two moles of electrons.'
        write: '1 mol Cu needs 2 mol $\ce{e-}$'
      - say: 'The number of electrons is two times six point zero times ten to the twenty-three.'
        write: '2 × $6.0 \times 10^{23}$'
      - say: 'Two times six is twelve, so that is twelve times ten to the twenty-three, which is one point two times ten to the twenty-four.'
        write: '= $12 \times 10^{23}$ = $1.2 \times 10^{24}$'
