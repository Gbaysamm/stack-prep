        write: '2p: [ ] [ ] [ ]'
      - say: 'Put in the first three electrons, one in each box.'
        write: '2p: [↑] [↑] [↑]'
      - say: 'Electrons four and five must now pair up in the first two boxes.'
        write: '2p: [↑↓] [↑↓] [↑]'
      - say: 'Only the last box has a lone electron. So there is one unpaired electron.'
        write: 'Unpaired = 1'
