  23:
    moments:
      - section: 'The question'
        say: 'We need the equilibrium constant for a general equation. Two traps wait here, turning it upside down and forgetting the powers.'
        write: '$m\mathrm{E} + n\mathrm{F} \rightleftharpoons p\mathrm{G} + q\mathrm{H}$, K = ?'
      - section: 'The rule'
        say: 'The equilibrium law. K is the product of the concentrations of the products, divided by the product of the concentrations of the reactants.'
        write: 'K = $\dfrac{\text{products}}{\text{reactants}}$'
      - say: 'Each concentration is raised to the power of its coefficient in the balanced equation.'
        write: 'Coefficients become powers'
      - section: 'The working'
        say: 'The products are G and H, on the right. Square brackets mean concentration, so they go on top as the concentration of G to the power p and the concentration of H to the power q.'
        write: 'Top: $[\mathrm{G}]^p[\mathrm{H}]^q$'
      - say: 'The reactants are E and F, on the left. They go below, E to the power m and F to the power n.'
        write: 'Bottom: $[\mathrm{E}]^m[\mathrm{F}]^n$'
      - say: 'Put them together.'
        write: '$K = \dfrac{[\mathrm{G}]^p[\mathrm{H}]^q}{[\mathrm{E}]^m[\mathrm{F}]^n}$'
      - section: 'Check'
        say: 'Check. Products on top, reactants below, and every coefficient is now a power. All three are right.'
        write: 'Products on top ✓, powers ✓'
      - section: 'Answer'
        say: 'So the equilibrium constant is G to the p times H to the q over E to the m times F to the n, which is option C.'
        write: '$\therefore$ $K = \dfrac{[\mathrm{G}]^p[\mathrm{H}]^q}{[\mathrm{E}]^m[\mathrm{F}]^n}$'
        answer: true
    traps:
      A: 'You went for reactants over products. That turns K upside down. Products always go on top.'
      B: 'You went for reactants over products with no powers. It is upside down, and the coefficients must become powers.'
      D: 'You went for products over reactants with no powers. The right way up, but the coefficients m, n, p and q must become powers.'
