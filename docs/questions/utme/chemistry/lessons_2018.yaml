        write: '$\ce{2H2 + O2 -> 2H2O}$'
      - section: 'The working'
        say: 'On the left there are four hydrogen atoms and two oxygen atoms.'
        write: 'Left: 4 H, 2 O'
      - say: 'On the right there are also four hydrogen atoms and two oxygen atoms.'
        write: 'Right: 4 H, 2 O'
      - say: 'The same atoms on each side means the same mass on each side. No atom is lost or made.'
        write: 'Same atoms $\Rightarrow$ same mass'
      - section: 'Check'
        say: 'Check with the masses. Two moles of H₂ weigh four grams and one mole of O₂ weighs thirty-two grams. Together they give two moles of water, which weigh thirty-six grams.'
        write: '4 g + 32 g = 36 g ✓'
      - section: 'Answer'
        say: 'So a balanced equation obeys the law of conservation of mass, which is option A.'
        write: '$\therefore$ conservation of mass'
        answer: true
    traps:
      B: 'You went for definite proportions. That law says one compound always has the same make up. It is not about balancing an equation.'
      C: 'You went for multiple proportions. That is about two elements forming more than one compound, like CO and CO₂.'
      D: 'You went for conservation of energy. Balancing counts atoms, and atoms carry mass, not energy.'
  29:
    moments:
      - section: 'The question'
        say: 'A gas is hot and squeezed. To count its moles with twenty-two point four, we must first bring it to S T P.'
        write: 'V₁ = 10.0 dm³, P₁ = 4 atm, T₁ = 273 °C, moles = ?'
      - section: 'The rule'
        say: 'The general gas law. P one V one over T one equals P two V two over T two, where one is the gas now and two is the gas at S T P. S T P means standard temperature and pressure, and there one mole of any gas takes twenty-two point four decimetres cubed.'
        write: '$\dfrac{P_1V_1}{T_1} = \dfrac{P_2V_2}{T_2}$, 1 mol = 22.4 dm³ at s.t.p.'
      - section: 'The units'
        say: 'Gas laws need the temperature in kelvin, so we add two hundred and seventy-three to the Celsius value. Two hundred and seventy-three plus two hundred and seventy-three is five hundred and forty-six kelvin.'
        write: 'T₁ = 273 + 273 = 546 K'
      - say: 'At S T P, the pressure is one atmosphere and the temperature is two hundred and seventy-three kelvin.'
        write: 'P₂ = 1 atm, T₂ = 273 K'
      - section: 'The working'
        say: 'Make V two the subject. V two is P one times V one times T two, over P two times T one.'
        write: '$V_2 = \dfrac{P_1V_1T_2}{P_2T_1}$'
      - say: 'Put in the numbers. Four times ten times two hundred and seventy-three, over one times five hundred and forty-six.'
        write: '$V_2 = \dfrac{4 \times 10.0 \times 273}{1 \times 546}$'
      - say: 'Two hundred and seventy-three over five hundred and forty-six is a half. So V two is forty times a half, which is twenty decimetres cubed.'
        write: '$V_2 = 40 \times \tfrac{1}{2} = 20.0$ dm³'
      - say: 'One mole takes twenty-two point four decimetres cubed at S T P, so moles is twenty divided by twenty-two point four, which is zero point eight nine mole.'
        write: 'Moles = $\dfrac{20.0}{22.4}$ = 0.89 mol'
      - section: 'Check'
        say: 'Check. Four times the pressure makes the volume four times bigger at one atmosphere, and halving the kelvin temperature halves it. So twenty, which is a little less than one mole.'
        write: '10 × 4 ÷ 2 = 20 dm³, under 22.4 ✓'
      - section: 'Answer'
        say: 'So the gas holds zero point eight nine mole, which is option A.'
        write: '$\therefore$ 0.89 mol'
        answer: true
    traps:
      B: 'You went for one point nine zero. That is about twice too big, which is what you get if two hundred and seventy-three degrees Celsius is not changed to five hundred and forty-six kelvin.'
      C: 'You went for three point eight zero. That is about four times too big. The volume has not been brought to S T P properly.'
      D: 'You went for five point seven zero. That is far too big. No correct use of the gas law gives it.'
  30:
    moments:
      - section: 'The question'
        say: 'Cool a gas and it shrinks. Keep cooling, and at some temperature its volume would reach zero. Which temperature is that?'
        write: 'Charles'' law: V = 0 at ?'
      - section: 'The rule'
        say: 'Charles'' law. At constant pressure, the volume of a gas is directly proportional to its absolute temperature.'
        write: '$V \propto T$ (T in kelvin)'
      - section: 'The working'
        say: 'If V is proportional to T, then V is zero when T is zero kelvin.'
        write: 'V = 0 when T = 0 K'
      - say: 'Draw volume against temperature and extend the straight line backwards. It meets zero volume at absolute zero.'
        write: 'Graph of V against T meets V = 0 at 0 K'
      - say: 'Now change zero kelvin to degrees Celsius. To go from kelvin to Celsius we take away two hundred and seventy-three, so zero minus two hundred and seventy-three is minus two hundred and seventy-three.'
        write: '0 K = 0 − 273 = −273 °C'
      - section: 'Check'
        say: 'Check. At zero degrees Celsius gases clearly still have volume. The air around us does. So zero volume must be far colder.'
        write: 'At 0 °C, gases still have volume ✓'
      - section: 'Answer'
        say: 'So the volume becomes zero at minus two hundred and seventy-three degrees Celsius, which is option C.'
        write: '$\therefore$ −273 °C'
        answer: true
    traps:
      A: 'You went for zero degrees Celsius. That is only the freezing point of water. A gas at zero degrees Celsius still has its full volume.'
      B: 'You went for minus one hundred degrees Celsius. That is cold, but not special. The volume is still well above zero there.'
      D: 'You went for minus three hundred and seventy-three degrees Celsius. That is below absolute zero, and nothing can be colder than absolute zero.'
  31:
    moments:
      - section: 'The question'
        say: 'Traders at the market ripen green bananas and plantain quickly. Which gas does the job?'
        write: 'Ripening agent for fruits = ?'
      - section: 'The fact'
        say: 'Ethene, C₂H₄, is a natural plant hormone. It speeds up the ripening of fruit.'
        write: 'Ethene, $\ce{C2H4}$, is a plant hormone'
      - section: 'The reason'
        say: 'Ripe fruits give off ethene themselves. That is why one ripe fruit in a bag ripens the others.'
        write: 'Ripe fruit gives off $\ce{C2H4}$'
      - say: 'Wrapping unripe fruit in a sack or leaves traps the ethene, so the fruit ripens faster. Fruit stores use ethene gas to ripen green bananas evenly.'
        write: 'Trapped $\ce{C2H4}$ $\to$ faster ripening'
      - section: 'Compare'
        say: 'Methane, propane and butane are alkanes used as fuels. They do nothing to fruit.'
        write: '$\ce{CH4}$, $\ce{C3H8}$, $\ce{C4H10}$ = fuels'
      - section: 'Remember'
        say: 'To remember it, think of ethene for eating. It gets fruit ready to eat.'
        write: 'Ethene for eating'
      - section: 'Answer'
        say: 'So the ripening agent is ethene, which is option A.'
        write: '$\therefore$ ethene'
        answer: true
    traps:
      B: 'You went for propane. Propane is a fuel in cooking gas, not a ripening agent.'
      C: 'You went for methane. Methane is natural gas, a fuel. It has no effect on ripening.'
      D: 'You went for butane. Butane is a fuel in lighters and cooking gas cylinders.'
  32:
    moments:
      - section: 'The question'
        say: 'Four sulphides meet dilute hydrochloric acid. Three of them give way. One stays put. Which one?'
        write: 'Which sulphide is insoluble in dil. HCl?'
      - section: 'The rule'
        say: 'Very insoluble sulphides, such as copper sulphide and lead sulphide, do not dissolve in dilute acid. More soluble ones, such as iron sulphide and zinc sulphide, do.'
        write: 'CuS, PbS stay. FeS, ZnS dissolve'
      - section: 'The equation'
        say: 'Iron two sulphide reacts with the acid and gives hydrogen sulphide. That is how we make H₂S in the laboratory.'
        write: '$\ce{FeS + 2HCl -> FeCl2 + H2S}$'
      - say: 'Zinc sulphide reacts the same way, also giving hydrogen sulphide.'
        write: '$\ce{ZnS + 2HCl -> ZnCl2 + H2S}$'
      - say: 'Sodium sulphide is soluble in water and reacts with acid at once.'
        write: '$\ce{Na2S + 2HCl -> 2NaCl + H2S}$'
      - section: 'The working'
        say: 'Copper sulphide is so insoluble that it even forms as a black precipitate when H₂S is bubbled into an acidified copper solution.'
        write: '$\ce{Cu^2+ + H2S -> CuS(s) + 2H+}$'
      - section: 'Check'
        say: 'Check. If copper sulphide can form inside an acid, then acid cannot dissolve it.'
        write: 'CuS forms in acid, so it is insoluble in acid ✓'
      - section: 'Answer'
        say: 'So the sulphide that is insoluble in dilute hydrochloric acid is CuS, which is option B.'
        write: '$\therefore$ $\ce{CuS}$'
        answer: true
    traps:
      A: 'You went for FeS. Iron sulphide dissolves in dilute hydrochloric acid and gives hydrogen sulphide. It is the usual laboratory source of the gas.'
      C: 'You went for ZnS. Zinc sulphide dissolves in dilute hydrochloric acid and gives hydrogen sulphide.'
      D: 'You went for Na₂S. Sodium sulphide dissolves even in plain water, and it reacts readily with acid.'
  33:
    moments:
      - section: 'The question'
        say: 'Sodium hydroxide is a base, so its pH must be above seven. Many students find pOH and stop there. Let us go one step further.'
        write: '[NaOH] = 0.001 mol dm⁻³, pH = ?'
      - section: 'The rule'
        say: 'For a base, pOH is minus the log of the hydroxide ion concentration. And pH plus pOH equals fourteen.'
        write: 'pOH = $-\log[\ce{OH-}]$, pH + pOH = 14'
      - section: 'The equation'
        say: 'NaOH is a strong base. It ionises fully, so the hydroxide concentration equals the concentration of the base.'
        write: '$\ce{NaOH -> Na+ + OH-}$'
      - section: 'The working'
        say: 'So the hydroxide concentration is zero point zero zero one, which is ten to the minus three moles per decimetre cubed.'
        write: '$[\ce{OH-}] = 0.001 = 10^{-3}$ mol dm⁻³'
      - say: 'The log of ten to the minus three is minus three, so pOH is minus minus three, which is three.'
        write: 'pOH = $-\log 10^{-3}$ = 3'
      - say: 'Because pH plus pOH equals fourteen, pH is fourteen minus three, which is eleven.'
        write: 'pH = 14 − 3 = 11'
      - section: 'Check'
        say: 'Check. Eleven is above seven, so the solution is alkaline, as a sodium hydroxide solution should be.'
        write: '11 > 7, alkaline ✓'
      - section: 'Answer'
        say: 'So the pH is eleven, which is option D.'
        write: '$\therefore$ pH = 11'
        answer: true
    traps:
      A: 'You went for fourteen. That needs a hydroxide concentration of one mole per decimetre cubed, a thousand times stronger.'
      B: 'You went for thirteen. That needs zero point one mole per decimetre cubed of hydroxide.'
      C: 'You went for twelve. That needs zero point zero one mole per decimetre cubed of hydroxide.'
  34:
    moments:
      - section: 'The question'
        say: 'Copper ions in ammonia make a deep blue solution. What kind of bond holds the ammonia to the copper?'
        write: 'Bonding in $\ce{[Cu(NH3)4]^2+}$ = ?'
      - section: 'The rule'
        say: 'A coordinate bond, also called a dative bond, forms when one atom supplies both electrons of the shared pair.'
        write: 'Coordinate bond: both electrons from one atom'
      - section: 'The working'
        say: 'The nitrogen in NH₃ has a lone pair of electrons that is not used in bonding.'
        write: '$\ce{NH3}$ has a lone pair on N'
      - say: 'The copper ion, Cu²⁺, has empty orbitals that can accept a pair.'
        write: '$\ce{Cu^2+}$ accepts electron pairs'
      - say: 'Each nitrogen gives its lone pair to the copper. Four ammonias give four such bonds.'
        write: '4 × (N $\to$ Cu) dative bonds'
      - say: 'The result is the deep blue tetraamminecopper two ion.'
        write: '$\ce{Cu^2+ + 4NH3 -> [Cu(NH3)4]^2+}$'
      - section: 'Check'
        say: 'Check. The copper gave no electrons to the bond at all. Both came from nitrogen, so it is coordinate.'
        write: 'Both electrons from N ✓'
      - section: 'Answer'
        say: 'So the bonding in the complex ion is coordinate, which is option A.'
        write: '$\therefore$ coordinate (dative) bonding'
        answer: true
    traps:
      B: 'You went for electrovalent. No electron is transferred to make ions between copper and ammonia here. A pair is shared.'
      C: 'You went for metallic. Metallic bonding holds a solid metal together. It is not found in a complex ion.'
      D: 'You went for covalent. A dative bond is a kind of covalent bond, but when one atom gives both electrons, the right name is coordinate.'
  35:
    moments:
      - section: 'The question'
        say: 'Here are four everyday changes. Only one of them makes a brand new substance. Which one?'
        write: 'Which is a chemical change?'
      - section: 'The rule'
        say: 'A chemical change makes a new substance and is not easily reversed. We are looking for the one change that does this.'
        write: 'Chemical change: new substance, hard to reverse'
      - section: 'The equation'
        say: 'Rusting. Iron reacts with oxygen and water to form hydrated iron three oxide, which is rust.'
        write: '$\ce{4Fe + 3O2 + 2xH2O -> 2Fe2O3.xH2O}$'
      - section: 'The working'
        say: 'Rust is a brown, flaky new substance. Think of an old zinc roof or a car left in the rain. You cannot simply turn the rust back into iron.'
        write: 'Rust = new substance ✓'
      - say: 'Dissolving salt, melting ice and distilling are physical changes. A physical change makes no new substance and can be reversed.'
        write: 'Dissolving, melting, distilling = physical'
      - section: 'Check'
        say: 'Check the salt. Boil off the water and the same salt is left behind. Nothing new was made.'
        write: 'Evaporate $\to$ salt returns ✓'
      - section: 'Answer'
        say: 'So the chemical change is the rusting of iron, which is option B.'
        write: '$\therefore$ rusting of iron'
        answer: true
    traps:
      A: 'You went for dissolving salt. The salt only seems to disappear. Evaporate the water and the same salt comes back, so it is physical.'
      C: 'You went for melting ice. Ice and water are the same substance, and freezing reverses it.'
      D: 'You went for distillation. It only separates substances. It makes nothing new.'
  36:
    moments:
      - section: 'The question'
        say: 'We want to double a gas''s volume and also double its pressure. Each doubling needs more heat. How hot must it get?'
        write: 'T₁ = 273 K, V₂ = 2V₁, P₂ = 2P₁, T₂ = ?'
      - section: 'The rule'
        say: 'The general gas law. P one V one over T one equals P two V two over T two.'
        write: '$\dfrac{P_1V_1}{T_1} = \dfrac{P_2V_2}{T_2}$'
      - section: 'The working'
        say: 'Make T two the subject. T two is T one times P two V two over P one V one.'
        write: '$T_2 = T_1 \times \dfrac{P_2V_2}{P_1V_1}$'
      - say: 'The pressure is doubled, so P two is two P one. The volume is doubled, so V two is two V one. Put these in.'
        write: '$T_2 = T_1 \times \dfrac{2P_1 \times 2V_1}{P_1V_1}$'
      - say: 'The P one and V one cancel, leaving two times two, which is four. So T two is four times T one.'
        write: '$T_2 = 4T_1$'
      - say: 'Four times two hundred and seventy-three kelvin is one thousand and ninety-two kelvin.'
        write: '$T_2 = 4 \times 273 = 1092$ K'
      - section: 'Check'
        say: 'Check. Doubling the volume alone doubles the temperature. Doubling the pressure too doubles it again. Two times two is four.'
        write: '× 2 × 2 = × 4 ✓'
      - section: 'Answer'
        say: 'So the gas must be heated to one thousand and ninety-two kelvin, which is option D.'
        write: '$\therefore$ T₂ = 1092 K'
        answer: true
    traps:
      A: 'You went for two hundred and ninety-eight kelvin. That is just room temperature, far too small a change to double anything.'
      B: 'You went for five hundred and forty-six kelvin. That doubles only one of them. Doubling both means four times the temperature.'
      C: 'You went for eight hundred and nineteen kelvin. That triples the temperature, which matches no pair of changes here.'
  37:
    moments:
      - section: 'The question'
        say: 'Heat a pot of water on the stove. What happens to the energy of its particles as the temperature rises?'
        write: 'T rises, kinetic energy of particles ?'
      - section: 'The rule'
        say: 'The kinetic theory says the average kinetic energy of particles is directly proportional to the absolute temperature.'
        write: 'Average K.E. $\propto T$ (in kelvin)'
      - section: 'The working'
        say: 'If the temperature goes up, the kinetic energy goes up in step with it.'
        write: 'T up $\Rightarrow$ K.E. up'
      - say: 'The particles move faster. That is why a gas expands and spreads faster when it is warm.'
        write: 'Faster particles, faster diffusion'
      - say: 'It is also why the smell of fried plantain spreads across the house quickly while the oil is hot.'
        write: 'Hot food smells spread quickly'
      - section: 'Check'
        say: 'Check the other way round. Cool the particles and they slow down. In the kinetic theory, they would stop moving only at absolute zero.'
        write: 'T down $\Rightarrow$ K.E. down ✓'
      - section: 'Answer'
        say: 'So an increase in temperature makes the kinetic energy increase, which is option B.'
        write: '$\therefore$ kinetic energy increases'
        answer: true
    traps:
      A: 'You went for decrease. Kinetic energy falls only when the temperature falls.'
      C: 'You went for zero. In the kinetic theory, particles would come to rest only at absolute zero, the coldest possible temperature. Heating does the opposite and speeds them up.'
      D: 'You went for remain constant. Kinetic energy stays the same only if the temperature stays the same.'
  38:
    moments:
      - section: 'The question'
        say: 'Strike a match and you smell a sharp smell as it lights. Which element in the match head gives that?'
        write: 'Element used in making matches = ?'
      - section: 'The fact'
        say: 'Sulphur catches fire easily and burns with a blue flame. So it is used in match heads.'
        write: 'Sulphur burns easily, blue flame'
      - section: 'The equation'
        say: 'Sulphur burns in oxygen to give sulphur four oxide. That is the sharp smell when a match lights.'
        write: '$\ce{S + O2 -> SO2}$'
      - section: 'The reason'
        say: 'The match head holds sulphur, or a sulphur compound, with an oxidising agent, potassium chlorate. The red phosphorus on the side of the box gives the first spark.'
        write: 'Match head = S + $\ce{KClO3}$, box = red phosphorus'
      - section: 'Remember'
        say: 'Other uses of sulphur are making tetraoxosulphate six acid, vulcanising rubber and making fungicides.'
        write: 'S: $\ce{H2SO4}$, vulcanising, fungicides'
      - say: 'To remember it, picture a yellow solid in a match, burning blue.'
        write: 'Yellow solid, blue flame'
      - section: 'Answer'
        say: 'So the element used in matches is sulphur, which is option D.'
        write: '$\therefore$ sulphur'
        answer: true
    traps:
      A: 'You went for nitrogen. Nitrogen is very unreactive and does not burn, so it is no use in a match.'
      B: 'You went for aluminium. Aluminium powder burns brightly in fireworks, but it is not a match ingredient.'
      C: 'You went for copper. Copper is a good conductor used in wires. It does not go into matches.'
  39:
    moments:
      - section: 'The question'
        say: 'Concentrated sulphuric acid soaks up water, so it dries many gases. But one gas would be eaten up along with the water. Which one?'
        write: 'Which gas may not be dried with conc. $\ce{H2SO4}$?'
      - section: 'The rule'
        say: 'A drying agent must not react with the gas being dried. Concentrated H₂SO₄ is an acid, so it cannot dry a basic gas.'
        write: 'Acidic drying agent $\Rightarrow$ no basic gases'
      - section: 'The working'
        say: 'The four gases are hydrogen chloride, ammonia, chlorine and sulphur four oxide. Ammonia is the only basic gas among them.'
        write: '$\ce{NH3}$ is basic'
      - section: 'The equation'
        say: 'Two NH₃ plus H₂SO₄ gives ammonium sulphate. The ammonia is used up, not dried.'
        write: '$\ce{2NH3 + H2SO4 -> (NH4)2SO4}$'
      - say: 'So ammonia is dried with quicklime, CaO, which is a base and does not react with it.'
        write: 'Dry $\ce{NH3}$ with CaO'
      - section: 'Check'
        say: 'Check the others. HCl, chlorine and SO₂ are acidic, so they pass through the acid untouched and come out dry.'
        write: '$\ce{HCl}$, $\ce{Cl2}$, $\ce{SO2}$ dried by conc. $\ce{H2SO4}$ ✓'
      - section: 'Answer'
        say: 'So the gas that may not be dried with concentrated sulphuric acid is ammonia, which is option B.'
        write: '$\therefore$ $\ce{NH3}$'
        answer: true
    traps:
      A: 'You went for hydrogen chloride. It is an acidic gas and does not react with sulphuric acid, so the acid dries it well.'
      C: 'You went for chlorine. Chlorine is dried with concentrated sulphuric acid in the laboratory.'
      D: 'You went for SO₂. It is a reducing gas, but it is acidic and does not react with the drying acid.'
  40:
    moments:
      - section: 'The question'
        say: 'Take methane, ethane and propane. Each one is a step up from the one before. What exactly is that step?'
        write: 'Consecutive alkanes differ by ?'
      - section: 'The rule'
        say: 'A homologous series is a family of compounds with one general formula. For alkanes it is CₙH₂ₙ₊₂, where n is the number of carbon atoms.'
        write: 'Alkanes: $\ce{C_nH_{2n+2}}$'
      - section: 'The working'
        say: 'The first three alkanes are CH₄, C₂H₆ and C₃H₈.'
        write: '$\ce{CH4}$, $\ce{C2H6}$, $\ce{C3H8}$'
      - say: 'Ethane minus methane. Two carbons minus one carbon is one carbon. Six hydrogens minus four hydrogens is two hydrogens.'
        write: '$\ce{C2H6}$ − $\ce{CH4}$ = 1 C and 2 H'
      - say: 'One carbon and two hydrogens is CH₂.'
        write: '= $\ce{CH2}$'
      - section: 'Check'
        say: 'Check with propane minus ethane. Again one carbon and two hydrogens. The step is always CH₂, fourteen grams per mole.'
        write: '$\ce{C3H8}$ − $\ce{C2H6}$ = $\ce{CH2}$, 14 g mol⁻¹ ✓'
      - section: 'Answer'
        say: 'So consecutive alkanes differ by CH₂, which is option B.'
        write: '$\therefore$ $\ce{CH2}$'
        answer: true
    traps:
      A: 'You went for CH. That is one carbon and one hydrogen. Ethane minus methane is one carbon and two hydrogens.'
      C: 'You went for CH₃. That is the methyl group, a branch, not the step between members.'
      D: 'You went for CₙHₙ. That is not a fixed unit at all. The step is always CH₂.'
