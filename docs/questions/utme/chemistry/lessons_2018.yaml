# UTME 2018 Chemistry, lessons for the board (voice + board), one per kept question.
#
# Each lesson is a run of moments, taught the Nigerian classroom way: the question, the rule in
# words then written, the balanced equation, the working with units one step at a time, the
# check, and the answer moment naming the option. `traps` speaks to a student who chose a wrong
# option. Spoken lines (say, traps) write formulas as formulas (the voice reads them letter by
# letter) and say units in words. Answers match explanations_2018.yaml. All 40 questions are taught.
format_version: 1
exam_year: 2018
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'The periodic table puts the elements in a fixed order. But in order of what? The first man who tried it chose a number that let him down.'
        write: 'Periodic table: elements arranged in order of ?'
      - section: 'The history'
        say: 'Mendeleev first lined the elements up by their atomic weights, the masses of their atoms.'
        write: 'Mendeleev, 1869: order of atomic weight'
      - say: 'But some pairs came out the wrong way round. Argon has mass forty and potassium has mass thirty-nine, yet argon must come first, because argon is an unreactive gas like neon, and potassium is a reactive metal like sodium.'
        write: 'Ar = 40 sits before K = 39 ✗ by mass'
      - section: 'The rule'
        say: 'Moseley fixed this. He ordered the elements by atomic number, which is the number of protons in the nucleus.'
        write: 'Moseley: order of atomic number (number of protons)'
      - say: 'This is the modern periodic law. The properties of elements are a periodic function of their atomic numbers.'
        write: 'Modern periodic law: properties repeat with atomic number'
      - section: 'Check'
        say: 'Check with argon and potassium. Argon has eighteen protons and potassium has nineteen, so argon comes first. It works.'
        write: 'Ar: Z = 18, K: Z = 19, so Ar before K ✓'
      - section: 'Answer'
        say: 'So the periodic table is arranged in order of atomic numbers, which is option D.'
        write: '$\therefore$ in order of atomic numbers'
        answer: true
    traps:
      A: 'You went for atomic weights. That was the old way, and it put argon and potassium in the wrong order. The modern table uses atomic number.'
      B: 'You went for isotopic weights. Isotopes of one element have different masses, yet they all sit in the same box, so mass cannot be the order.'
      C: 'You went for molecular weights. Molecular weight belongs to compounds and molecules, not to single elements in a table.'
  2:
    moments:
      - section: 'The question'
        say: 'One litre of acid goes into a bucket that already holds ten litres of water. How much water is the acid really spread through? That is where most people slip.'
        write: 'C₁ = 2.2 M, V₁ = 1 L, water added = 10 L, C₂ = ?'
      - section: 'The rule'
        say: 'When we dilute, the moles of acid do not change, because water adds no acid. Moles are concentration times volume, so C one times V one, before, equals C two times V two, after.'
        write: '$C_1V_1 = C_2V_2$'
      - section: 'The working'
        say: 'First the final volume. The one litre of acid adds to the ten litres of water, so V two is eleven litres.'
        write: 'V₂ = 1 + 10 = 11 L'
      - say: 'Make C two the subject. C two is C one times V one, divided by V two.'
        write: '$C_2 = \dfrac{C_1V_1}{V_2}$'
      - say: 'Put in the numbers. The M in two point two M means moles per decimetre cubed, and one litre is one decimetre cubed. So it is two point two moles per decimetre cubed times one decimetre cubed, divided by eleven decimetres cubed.'
        write: '$C_2 = \dfrac{2.2 \times 1}{11}$'
      - say: 'Two point two divided by eleven is zero point two. So the new concentration is zero point two zero M.'
        write: 'C₂ = 0.20 mol dm⁻³'
      - section: 'Check'
        say: 'Check. The acid is now in eleven times its own volume, so it should be eleven times weaker. Two point two over eleven is zero point two. It agrees.'
        write: '2.2 ÷ 11 = 0.20 ✓'
      - section: 'Answer'
        say: 'So the acid ends up at zero point two zero M, which is option C.'
        write: '$\therefore$ C₂ = 0.20 M'
        answer: true
    traps:
      A: 'You went for two point two M. That is the strength before any water went in. Adding water must make it weaker.'
      B: 'You went for one point one M. That only halves it, as if one litre of water were added. Here ten litres went in.'
      D: 'You went for zero point one one M. That divides by twenty. The total volume is only eleven litres.'
  3:
    moments:
      - section: 'The question'
        say: 'Heat ammonium chloride and two gases come off, one acid and one alkali. Both race towards the damp litmus. Which one wins the race?'
        write: 'Heat $\ce{NH4Cl}$, gases pass a porous plug, damp litmus turns ?'
      - section: 'The equation'
        say: 'On heating, NH₄Cl splits into ammonia gas and hydrogen chloride gas.'
        write: '$\ce{NH4Cl(s) <=>[heat] NH3(g) + HCl(g)}$'
      - section: 'The rule'
        say: 'Graham''s law. The rate of diffusion of a gas is inversely proportional to the square root of its molar mass. Light gases travel faster.'
        write: 'Rate $\propto \dfrac{1}{\sqrt{M}}$'
      - section: 'The working'
        say: 'Ammonia, NH₃, has one nitrogen of fourteen and three hydrogens of one each. So its molar mass is seventeen grams per mole.'
        write: '$\ce{NH3}$: M = 14 + 3 = 17 g mol⁻¹'
      - say: 'Hydrogen chloride, HCl, has one hydrogen of one and one chlorine of thirty-five point five. So its molar mass is thirty-six point five grams per mole.'
        write: '$\ce{HCl}$: M = 1 + 35.5 = 36.5 g mol⁻¹'
      - say: 'Ammonia is lighter, so it gets through the plug first and reaches the litmus first.'
        write: '17 < 36.5, so $\ce{NH3}$ arrives first'
      - say: 'Ammonia is an alkaline gas, and an alkali turns litmus blue.'
        write: '$\ce{NH3}$ is alkaline, so litmus turns blue'
      - section: 'Check'
        say: 'Check. Later the slower hydrogen chloride arrives and the litmus turns red. But the question asks what happens first.'
        write: 'First blue ($\ce{NH3}$), later red ($\ce{HCl}$) ✓'
      - section: 'Answer'
        say: 'So the litmus paper will first turn blue, which is option D.'
        write: '$\therefore$ the litmus turns blue first'
        answer: true
    traps:
      A: 'You went for bleached. Neither ammonia nor hydrogen chloride is a bleaching agent, so the litmus keeps its colour.'
      B: 'You went for green. Litmus has only two colours, red and blue. It never turns green.'
      C: 'You went for red. Red does come, but only later, when the heavier hydrogen chloride gets through. Ammonia wins the race.'
  4:
    moments:
      - section: 'The question'
        say: 'Here is a list of metals that is almost the electrochemical series, but two of them have swapped places. Let us find them.'
        write: 'K, Na, Ca, Al, Mg, Zn, Fe, Pb, H, Cu, Hg, Ag, Au'
      - section: 'The rule'
        say: 'The electrochemical series lists the elements from the most electropositive down. Electropositive means ready to lose electrons and form positive ions, so the most reactive metal comes first.'
        write: 'Most reactive at the top, least reactive at the bottom'
      - say: 'Here is the correct order to learn by heart.'
        write: 'K, Na, Ca, Mg, Al, Zn, Fe, Pb, H, Cu, Hg, Ag, Au'
      - say: 'A memory line helps. Kill Naughty Cats, Mix All Zebras In Paint, Hold Copper Mercury Silver Gold.'
        write: 'Kill Naughty Cats, Mix All Zebras In Paint, Hold Cu Hg Ag Au'
      - section: 'The working'
        say: 'Compare the two lists. In the question, aluminium comes before magnesium.'
        write: 'Given: … Ca, Al, Mg, Zn …'
      - say: 'But magnesium is more reactive than aluminium, so magnesium must come first.'
        write: 'Mg is more reactive than Al, so Mg before Al'
      - section: 'Check'
        say: 'Check the rest. Zinc before iron, iron before lead, lead before hydrogen. All of them are already right.'
        write: 'Zn, Fe, Pb, H in the right order ✓'
      - section: 'Answer'
        say: 'So we interchange aluminium and magnesium, which is option A.'
        write: '$\therefore$ swap Al and Mg'
        answer: true
    traps:
      B: 'You went for zinc and iron. Zinc is more reactive than iron and already sits above it. That is how galvanising protects iron.'
      C: 'You went for zinc and lead. Zinc is already above lead, which is the right order.'
      D: 'You went for lead and hydrogen. Lead is just above hydrogen, which is correct. It slowly pushes hydrogen out of acid.'
  5:
    moments:
      - section: 'The question'
        say: 'Gas molecules fly in straight lines between collisions. What does that tell us about the forces between them?'
        write: 'Gas molecules move in straight lines between collisions, so ?'
      - section: 'The rule'
        say: 'Newton''s first law. A body keeps moving in a straight line unless a force acts on it.'
        write: 'No force $\Rightarrow$ straight line'
      - say: 'For example, a football rolling on a smooth floor keeps a straight path while nothing pushes or pulls it. A force acting on it is the only thing that bends its path.'
        write: 'Force acts $\Rightarrow$ path bends'
      - section: 'The working'
        say: 'So between collisions, nothing pulls or pushes a gas molecule off its path.'
        write: 'Between collisions, no force on the molecule'
      - say: 'That means the forces of attraction and repulsion between the molecules are negligible.'
        write: 'Attraction and repulsion ≈ 0'
      - section: 'Check'
        say: 'Check. This is also why an ideal gas would never turn into a liquid. There is no attraction to hold the molecules together.'
        write: 'No attraction, so an ideal gas never liquefies ✓'
      - section: 'Answer'
        say: 'So the forces of attraction and repulsion between the molecules are negligible, which is option C.'
        write: '$\therefore$ intermolecular forces are negligible'
        answer: true
    traps:
      A: 'You went for perfectly elastic collisions. That is a true postulate, but it is about what happens at a collision, not about the straight path between collisions.'
      B: 'You went for forces of repulsion. If a repulsive force acted, it would bend the path. A straight path means no force.'
      D: 'You went for inelastic collisions. Gas collisions are taken as perfectly elastic, and in any case this says nothing about the straight path.'
  6:
    moments:
      - section: 'The question'
        say: 'Which things decide how much of a gas dissolves in a liquid? There are four candidates. Let us test each one.'
        write: 'I solvent, II solute, III temperature, IV pressure'
      - section: 'The rule'
        say: 'The solubility of a gas depends on the solvent, on the gas itself, on the temperature and on the pressure.'
        write: 'Gas solubility depends on solvent, solute, T and P'
      - section: 'The working'
        say: 'The nature of the solute, which is the gas. Ammonia dissolves hugely in water, while oxygen dissolves only a little. So the gas matters.'
        write: 'II ✓ $\ce{NH3}$ very soluble, $\ce{O2}$ slightly soluble'
      - say: 'The nature of the solvent. A gas that reacts with or is attracted to the solvent dissolves more.'
        write: 'I ✓ the solvent matters'
      - say: 'Temperature. Gases dissolve less as the liquid gets warmer. That is why a warm soft drink goes flat quickly.'
        write: 'III ✓ warmer liquid, less gas dissolved'
      - say: 'Pressure. By Henry''s law, more gas dissolves at higher pressure. That is how the fizz is forced into a sealed bottle.'
        write: 'IV ✓ higher pressure, more gas dissolved'
      - section: 'Check'
        say: 'Check. Every one of the four changes how much gas dissolves, so none can be left out.'
        write: 'I, II, III, IV all apply ✓'
      - section: 'Answer'
        say: 'So the solubility depends on all four, which is option A.'
        write: '$\therefore$ I, II, III and IV'
        answer: true
    traps:
      B: 'You went for one and two only. That leaves out temperature and pressure, which both change gas solubility strongly. Think of a warm soft drink going flat.'
      C: 'You went for two only. The gas itself is just one of the four factors.'
      D: 'You went for one, three and four. That leaves out the gas itself, yet ammonia dissolves far better than oxygen in the same water.'
  7:
    moments:
      - section: 'The question'
        say: 'Four statements about the periodic table, and only one is true. Students mix up periods and groups here, so let us keep them apart.'
        write: 'Which statement about the periodic table is correct?'
      - section: 'The rule'
        say: 'A period is a row across. Across a period, the number of shells stays the same and the outer electrons go up by one at each step.'
        write: 'Period (row): same shells, valence electrons rise by 1'
      - say: 'A group is a column down. Down a group, the outer electrons stay the same and the shells increase.'
        write: 'Group (column): same valence electrons, more shells'
      - section: 'The working'
        say: 'Look at period three. Sodium has one outer electron, magnesium two, aluminium three, and so on up to chlorine with seven.'
        write: 'Na 1, Mg 2, Al 3, Si 4, P 5, S 6, Cl 7'
      - say: 'So the valence electrons increase steadily across a period. That is statement B.'
        write: 'Valence electrons increase across a period ✓'
      - say: 'Across the same period, we go from metals like sodium to non-metals like chlorine. So non-metallic character increases, and statement D, which says it decreases, is false.'
        write: 'Na metal $\to$ Cl non-metal, non-metallic character increases'
      - section: 'Check'
        say: 'Check A and C. They swap the words period and group, so both are false.'
        write: 'A and C mix up period and group ✗'
      - section: 'Answer'
        say: 'So the valence electrons increase progressively across the period, which is option B.'
        write: '$\therefore$ valence electrons increase across a period'
        answer: true
    traps:
      A: 'You went for the same number of valence electrons in a period. That is true of a group, a column, not a period.'
      C: 'You went for the same number of shells in a group. That is true of a period, a row. Down a group the shells increase.'
      D: 'You went for non-metallic properties decreasing. Across a period we move from sodium, a metal, to chlorine, a non-metal, so non-metallic character increases.'
  8:
    moments:
      - section: 'The question'
        say: 'Boil fat with caustic soda and you get something every Nigerian home uses daily. What is the process called?'
        write: 'Fat + caustic soda (NaOH), boiled = ?'
      - section: 'The fact'
        say: 'Fats and oils are esters. They are made from glycerol and long chain fatty acids.'
        write: 'Fat = ester of glycerol and fatty acids'
      - section: 'The equation'
        say: 'Boiling the fat with NaOH splits the ester. It gives soap, which is the sodium salt of the fatty acid, and glycerol.'
        write: 'Fat + NaOH $\to$ soap + glycerol'
      - section: 'The rule'
        say: 'Making soap from fat and alkali has a special name. It is called saponification.'
        write: 'Fat + alkali $\to$ soap is saponification'
      - say: 'The local black soap, ose dudu, is made the same way, from palm oil and the alkali in plantain peel ash.'
        write: 'Black soap = palm oil + ash (alkali)'
      - section: 'Remember'
        say: 'To remember it, sapo is the Latin word for soap. Saponification means soap making.'
        write: 'Sapo = soap'
      - section: 'Answer'
        say: 'So boiling fat with caustic soda is saponification, which is option D.'
        write: '$\therefore$ saponification'
        answer: true
    traps:
      A: 'You went for hydrolysis. It is a kind of alkaline hydrolysis, but the special name for fat and alkali making soap is saponification.'
      B: 'You went for esterification. That makes an ester from an acid and an alcohol, which is the opposite direction.'
      C: 'You went for acidification. That means adding an acid, but caustic soda is an alkali.'
  9:
    moments:
      - section: 'The question'
        say: 'Some oxides are already full of oxygen. Others still have room for more. We want the pair where both can take more oxygen.'
        write: 'Which pair reacts further with $\ce{O2}$ to form a higher oxide?'
      - section: 'The rule'
        say: 'An oxide reacts further with oxygen only if the element is not yet in its highest common oxidation state.'
        write: 'Oxidation number can still rise $\Rightarrow$ higher oxide forms'
      - section: 'The equations'
        say: 'Sulphur dioxide first. SO₂ reacts with oxygen to give SO₃. Each oxygen counts as minus two, so sulphur is plus four in SO₂ and plus six in SO₃. Its oxidation number has gone up.'
        write: '$\ce{2SO2 + O2 <=> 2SO3}$, S: +4 $\to$ +6'
      - say: 'Nitrogen monoxide. NO reacts with oxygen to give NO₂. With one oxygen, nitrogen is plus two, and with two oxygens it is plus four.'
        write: '$\ce{2NO + O2 -> 2NO2}$, N: +2 $\to$ +4'
      - say: 'That is why colourless NO turns brown the moment it meets the air.'
        write: 'Colourless $\ce{NO}$ $\to$ brown $\ce{NO2}$ in air'
      - section: 'The working'
        say: 'Now the others. CO₂ and H₂O are already fully oxidised, because carbon is at plus four, its highest, and hydrogen is at plus one, its highest.'
        write: '$\ce{CO2}$ (C = +4) and $\ce{H2O}$ (H = +1) are fully oxidised'
      - section: 'Check'
        say: 'Check. SO₂ and NO both still have room to go up, and both are in one pair.'
        write: '$\ce{SO2}$ ✓ and $\ce{NO}$ ✓'
      - section: 'Answer'
        say: 'So the pair is SO₂ and NO, which is option D.'
        write: '$\therefore$ $\ce{SO2}$ and $\ce{NO}$'
        answer: true
    traps:
      A: 'You went for CO₂ and water. Both are already fully oxidised, so neither forms a higher oxide.'
      B: 'You went for NO and water. NO does react, but water does not form a higher oxide on its own, so the pair fails.'
      C: 'You went for CO and CO₂. CO does burn to CO₂, but CO₂ is already the highest oxide of carbon.'
  10:
    moments:
      - section: 'The question'
        say: 'Potassium chlorate gives oxygen when heated, but with manganese dioxide added, only gentle heat is needed. How does the catalyst do it?'
        write: '$\ce{KClO3}$ + $\ce{MnO2}$, moderate heat, why?'
      - section: 'The equation'
        say: 'Two KClO₃, with MnO₂, gives two KCl and three O₂.'
        write: '$\ce{2KClO3 ->[MnO2][heat] 2KCl + 3O2}$'
      - section: 'The rule'
        say: 'Molecules must climb an energy barrier, called the activation energy, before they can react.'
        write: 'Activation energy = the energy barrier'
      - say: 'A catalyst gives the reaction another path with a lower energy barrier.'
        write: 'Catalyst $\Rightarrow$ lower activation energy'
      - section: 'The working'
        say: 'With a lower barrier, many more molecules have enough energy to react, even at a moderate temperature.'
        write: 'Lower barrier, more molecules can react at low heat'
      - say: 'So oxygen comes off without strong heating. MnO₂ is unchanged at the end, as a catalyst always is.'
        write: '$\ce{MnO2}$ is unchanged at the end'
      - section: 'Check'
        say: 'Check. A faster rate is the result. But the question asks how the catalyst acts, and it acts by lowering the barrier.'
        write: 'How it acts = lower barrier, the result = faster rate ✓'
      - section: 'Answer'
        say: 'So the catalyst acts by lowering the energy barrier of the reaction, which is option D.'
        write: '$\therefore$ lowers the energy barrier'
        answer: true
    traps:
      A: 'You went for lowering the pressure. A catalyst does not change the pressure at all.'
      B: 'You went for increasing the surface area. That comes from grinding a solid finely. It is not how a catalyst works.'
      C: 'You went for increasing the rate. The rate does rise, but that is the result. The catalyst works by lowering the energy barrier.'
  11:
    moments:
      - section: 'The question'
        say: 'Sand, water and methanoic acid are all in one beaker, and we want pure water out. The acid boils at almost the same temperature as water, so something sneaks through.'
        write: 'Sand + water + methanoic acid $\to$ pure water?'
      - section: 'The rule'
        say: 'Distillation separates two liquids only when their boiling points are clearly apart. A liquid that boils close to water comes over with the water.'
        write: 'Distillation needs boiling points far apart'
      - say: 'Water and methanoic acid boil at about the same temperature. That is far too close.'
        write: 'b.p. of $\ce{H2O}$ ≈ b.p. of $\ce{HCOOH}$'
      - section: 'The equation'
        say: 'So first we neutralise the acid. HCOOH plus NaOH gives sodium methanoate and water.'
        write: '$\ce{HCOOH + NaOH -> HCOONa + H2O}$'
      - say: 'Sodium methanoate is a salt, and salts do not boil off. The acid is now locked in the flask.'
        write: '$\ce{HCOONa}$ is a salt, so it is not volatile'
      - section: 'The working'
        say: 'Now we distil. Only water vapour leaves the flask, and it condenses as pure water.'
        write: 'Distil, so only $\ce{H2O}$ vapour leaves and condenses'
      - say: 'The sand and the salt stay behind in the flask, so we do not even need a separate filtration.'
        write: 'Left in the flask = sand + $\ce{HCOONa}$'
      - section: 'Check'
        say: 'Check. Is anything left in the flask that can boil off with the water? No, so what collects is pure water.'
        write: 'Distillate = pure $\ce{H2O}$ ✓'
      - section: 'Answer'
        say: 'So we neutralise with sodium hydroxide and then distil, which is option C.'
        write: '$\therefore$ neutralise with NaOH, then distil'
        answer: true
    traps:
      A: 'You went for fractional distillation. Water and methanoic acid boil at about the same temperature, so the acid keeps coming over with the water.'
      B: 'You went for filtration then distillation. The sand goes, but the methanoic acid boils with the water and ends up in the distillate. Neutralise it first.'
      D: 'You went for neutralisation then filtration. Filtering takes out the sand, but the sodium methanoate is dissolved and passes straight through the filter paper with the water.'
  12:
    moments:
      - section: 'The question'
        say: 'The same current flows through a silver salt and an aluminium salt. Silver gives three point six grams. How much aluminium? The charge on each ion decides it.'
        write: 'Ag liberated = 3.6 g, Al liberated = ?  [Al = 27, Ag = 108]'
      - section: 'The rule'
        say: 'Faraday''s second law. The same current passes through both salts, so the same quantity of electricity flows, and the same number of moles of electrons reaches each electrode.'
        write: 'Same charge $\Rightarrow$ same moles of electrons'
      - section: 'The equations'
        say: 'A silver ion needs one electron. An aluminium ion, Al³⁺, needs three electrons.'
        write: '$\ce{Ag+ + e- -> Ag}$ and $\ce{Al^3+ + 3e- -> Al}$'
      - section: 'The working'
        say: 'Moles of silver is three point six grams divided by one hundred and eight grams per mole, which is one thirtieth of a mole.'
        write: 'Moles of Ag = $\dfrac{3.6}{108} = \dfrac{1}{30}$ mol'
      - say: 'There is one electron for each silver atom, so one thirtieth of a mole of electrons passed.'
        write: 'Moles of $\ce{e-}$ = $\dfrac{1}{30}$ mol'
      - say: 'Each aluminium atom needs three electrons, so divide by three. That is one ninetieth of a mole of aluminium.'
        write: 'Moles of Al = $\dfrac{1}{30} \div 3 = \dfrac{1}{90}$ mol'
      - say: 'Mass of aluminium is one ninetieth of a mole times twenty-seven grams per mole, which is zero point three grams.'
        write: 'Mass of Al = $\dfrac{1}{90} \times 27 = 0.3$ g'
      - section: 'Check'
        say: 'Check. Aluminium atoms are lighter and each needs three electrons, so we expect far less aluminium than silver. Zero point three grams fits.'
        write: '0.3 g ≪ 3.6 g ✓'
      - section: 'Answer'
        say: 'So zero point three grams of aluminium is liberated, which is option D.'
        write: '$\therefore$ mass of Al = 0.3 g'
        answer: true
    traps:
      A: 'You went for two point seven grams. That is a tenth of a mole of aluminium, far more than the electrons that passed can make.'
      B: 'You went for one point two grams. That does not follow from the charges on the two ions. Count the electrons, one for silver and three for aluminium.'
      C: 'You went for zero point nine grams. That treats Al³⁺ as if it needed one electron, like silver. It needs three, so divide by three again.'
  13:
    moments:
      - section: 'The question'
        say: 'Which two chemicals are warmed together in the laboratory to give nitrogen gas? Two of the options have names that look very alike.'
        write: 'Laboratory preparation of $\ce{N2}$, reagents = ?'
      - section: 'The fact'
        say: 'Nitrogen is made by warming ammonium chloride with sodium dioxonitrate three, which is sodium nitrite.'
        write: '$\ce{NH4Cl}$ + $\ce{NaNO2}$, warmed'
      - section: 'The equations'
        say: 'First they swap partners and form ammonium dioxonitrate three in the flask.'
        write: '$\ce{NaNO2 + NH4Cl -> NaCl + NH4NO2}$'
      - say: 'Ammonium dioxonitrate three is unstable. On warming it breaks up into nitrogen and water.'
        write: '$\ce{NH4NO2 -> N2 + 2H2O}$'
      - section: 'The reason'
        say: 'Ammonium dioxonitrate three is too unstable to keep in a bottle. So we make it in the flask from these two safe, stable salts.'
        write: 'Make $\ce{NH4NO2}$ in the flask'
      - say: 'The nitrogen is then collected over water.'
        write: '$\ce{N2}$ collected over water'
      - section: 'Remember'
        say: 'To remember it, dioxonitrate three has two oxygens, and the nitrogen gas comes from the two nitrogens, one in each salt.'
        write: '$\ce{NH4+}$ + $\ce{NO2-}$ $\to$ $\ce{N2}$ + $\ce{2H2O}$'
      - section: 'Answer'
        say: 'So the reagents are sodium dioxonitrate three and ammonium chloride, which is option A.'
        write: '$\therefore$ $\ce{NaNO2}$ and $\ce{NH4Cl}$'
        answer: true
    traps:
      B: 'You went for sodium trioxonitrate five. That is the nitrate, with three oxygens. It does not give nitrogen with ammonium chloride. We need the dioxonitrate three.'
      C: 'You went for sodium chloride and ammonium trioxonitrate five. Heating ammonium trioxonitrate five gives dinitrogen one oxide, not nitrogen.'
      D: 'You went for sodium chloride and ammonium dioxonitrate three. Ammonium dioxonitrate three is too unstable to keep, and sodium chloride plays no part. We make it in the flask from sodium dioxonitrate three.'
  14:
    moments:
      - section: 'The question'
        say: 'An element has atomic number fourteen. How many electrons are in its outermost shell?'
        write: 'Z = 14, valence electrons = ?'
      - section: 'The rule'
        say: 'Atomic number tells us the number of electrons in a neutral atom. We fill the shells in order, two in the first, eight in the second, then the rest.'
        write: 'Shells hold 2, then 8, then 8'
      - section: 'The working'
        say: 'There are fourteen electrons. Two go in the first shell, leaving twelve.'
        write: '14 − 2 = 12'
      - say: 'Eight go in the second shell, leaving four.'
        write: '12 − 8 = 4'
      - say: 'So the configuration is two, eight, four.'
        write: 'Configuration = 2, 8, 4'
      - say: 'The valence shell is the outermost one, and it holds four electrons.'
        write: 'Valence shell has 4 electrons'
      - section: 'Check'
        say: 'Check. Atomic number fourteen is silicon, which sits in group four, with four outer electrons. It agrees.'
        write: 'Si, group 4 ✓'
