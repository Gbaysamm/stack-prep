      B: 'increasing the surface area of the reactant'
      C: 'increasing the rate of the reaction'
      D: 'lowering the energy barrier of the reaction'
    answer: D
    printed_key: D
    subtopic: CHEM.12.c
    level: 2
    level_reason: link a catalyst to activation energy
    corrected: 'option C "increase" changed to "increasing"'

