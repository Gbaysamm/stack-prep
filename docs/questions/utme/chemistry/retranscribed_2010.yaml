    printed_key: B
    subtopic: CHEM.6.a
    level: 3
    level_reason: scale to 1000 g of water, then convert grams to moles
    corrected: 'stem: temperature 120 °C (above the boiling point of water) changed to 60 °C, where about 40 g of CuSO4 does dissolve in 100 g of water; the arithmetic is unchanged'

  - number: 16
    stem: 'Coffee stains can best be removed by'
    options:
      A: 'kerosene'
      B: 'turpentine'
      C: 'a solution of borax in water'
      D: 'ammonia solution'
    answer: C
    printed_key: D
    key_note: 'Tea and coffee stains are removed with warm borax solution; ammonia solution is the usual choice for grass, perspiration and some paint or blood stains.'
    subtopic: CHEM.6.b
    level: 1
    level_reason: recall the solvent for a stain

  - number: 17
    stem: 'Carbon(II) oxide is considered dangerous if inhaled mainly because it'
