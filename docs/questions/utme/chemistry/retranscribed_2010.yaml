  - number: 11
    stem: '$\ce{^{2}_{1}D + ^{3}_{1}T -> ^{4}_{2}He + ^{1}_{0}n}$ + energy. The reaction above illustrates'
    options:
      A: 'alpha decay'
      B: 'artificial transmutation'
      C: 'nuclear fusion'
      D: 'nuclear fission'
