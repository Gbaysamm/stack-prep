    corrected: '"Substance" changed to "Substances"; option B "hydroscopic" changed to "hygroscopic"'

  - number: 15
    stem: 'Calculate the solubility in mol dm⁻³ of 40 g of $\ce{CuSO4}$ dissolved in 100 g of water at 60 °C. [Cu = 64, S = 32, O = 16]'
    options:
