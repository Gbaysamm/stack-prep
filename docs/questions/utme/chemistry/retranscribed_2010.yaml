  - number: 25
    stem: 'What quantity of aluminium is deposited when a current of 10 A is passed through a solution of an aluminium salt for 1930 s? [Al = 27, F = 96500 C mol⁻¹]'
    options:
      A: '0.2 g'
      B: '1.8 g'
      C: '5.4 g'
      D: '14.2 g'
    answer: B
    printed_key: B
    subtopic: CHEM.10.a
    level: 4
    level_reason: charge, faradays, mole ratio from Al³⁺, then mass

  - number: 26
    stem: 'In which of the following is the entropy change positive?'
    options:
      A: 'Thermal dissociation of ammonium chloride'
      B: 'Reaction between an acid and a base'
      C: 'Addition of concentrated acid to water'
      D: 'Condensation of steam to water'
    answer: A
    printed_key: A
    subtopic: CHEM.11.b
    level: 2
    level_reason: judge the change in disorder from the states
    corrected: 'option D "Dissolution of sodium metal in water" replaced by "Condensation of steam to water", because sodium in water gives off hydrogen gas and so also has a positive entropy change'

  - number: 27
    stem: 'If a reaction is exothermic and there is a great disorder, it means that'
    options:
      A: 'the reaction is static'
      B: 'the reaction is in a state of equilibrium'
      C: 'there will be a large increase in free energy'
      D: 'there will be a large decrease in free energy'
    answer: D
    printed_key: C
    key_note: 'Exothermic means ΔH < 0 and great disorder means ΔS > 0, so ΔG = ΔH − TΔS is large and negative: free energy decreases and the reaction is spontaneous.'
    subtopic: CHEM.11.c
    level: 3
    level_reason: combine the signs of ΔH and ΔS in ΔG = ΔH − TΔS

  - number: 28
    stem: 'In the preparation of oxygen by heating $\ce{KClO3}$ in the presence of $\ce{MnO2}$, only moderate heat is needed because the catalyst acts by'
