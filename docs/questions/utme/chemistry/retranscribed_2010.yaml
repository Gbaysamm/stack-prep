  - number: 12
    stem: 'A noble gas with a high power of fog penetration used in aerodrome beacons is'
    options:
      A: 'krypton'
      B: 'argon'
      C: 'helium'
      D: 'neon'
    answer: D
    printed_key: A
    key_note: 'Neon''s red glow penetrates fog and is the textbook gas for aerodrome (airport) beacons and advertising signs; krypton is used in photographic flash and some high-intensity lamps.'
    subtopic: CHEM.7.a
    level: 1
    level_reason: recall a use of a noble gas

  - number: 13
    stem: 'Permanent hardness of water can be removed by'
    options:
      A: 'filtration'
      B: 'adding slaked lime'
      C: 'adding caustic soda'
      D: 'boiling'
    answer: C
    printed_key: C
    subtopic: CHEM.14.c
    level: 2
    level_reason: tell apart methods for temporary and permanent hardness

  - number: 14
    stem: 'Substances employed as drying agents are usually'
    options:
      A: 'amphoteric'
      B: 'hygroscopic'
      C: 'efflorescent'
      D: 'acidic'
    answer: B
    printed_key: B
    subtopic: CHEM.14.c
    level: 1
