# UTME 2013 Chemistry, written up by hand from source/past-questions-2010-2018.pdf, pages 32-40.
# The paper-type question (Q1) is left out; the other 49 are kept. Five printed keys were wrong
# (Q4, Q36, Q38, Q39, Q47). Q5 had its two gases the wrong way round for every option, so the stem
# was turned round. Q10 and Q16 each had two defensible options, so one distractor was replaced.
# Q34's intended option named a salt where the acid forms; Q38 now says concentrated acid; Q25's
# unit clash and the IUPAC names in Q20 were fixed. Q44 and Q45 had their options printed as
# pictures; they are written out as condensed formulae here.
