# UTME 2015 Chemistry, written up by hand from source/past-questions-2010-2018.pdf, pages 51-58.
# The paper has 40 questions and no paper-type question. Q7 is rebuilt in words: its figure (curves
# against temperature) did not match its stem (volume against pressure). Repaired: Q1 (typo,
# "absolute" temperature), Q8 (mass of mixture 12.0 g to 3.00 g so the data fit), Q9 (option C
# lists all three rising properties), Q13 (atomic masses and molar volume added), Q27 (equation
# written per mole of CO), Q33 (asks for the rocket-propellant oxidiser), Q36 ("concentrated"
# acid). Keys changed: Q17 (A), Q18 (D), Q22 (C), Q23 (C), Q40 (B).
