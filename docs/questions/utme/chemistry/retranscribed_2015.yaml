    stem: 'Which of the following statements is correct?'
    options:
      A: 'The average kinetic energy of a gas is directly proportional to its absolute temperature.'
      B: 'At constant temperature, the volume of a gas increases as the pressure increases.'
      C: 'The pressure of a gas is inversely proportional to its volume.'
      D: 'The temperature of a gas is directly proportional to its volume.'
    answer: A
    printed_key: A
    corrected: 'Option A: "kinetic enemy" read as "kinetic energy", and "temperature" made "absolute temperature" so the statement is exactly true.'
