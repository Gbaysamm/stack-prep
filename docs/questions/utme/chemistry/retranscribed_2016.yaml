# UTME 2016 Chemistry, written up by hand from source/past-questions-2010-2018.pdf, pages 59-66.
# No paper-type question was printed, so all 40 questions are kept and none is dropped. Six printed
# keys were wrong and are fixed: Q5 (carbon monoxide), Q7 (aerobic bacteria), Q19 (copper), Q24
# (iron made the cathode), Q25 (acid with base) and Q31 (2F per mole of Cu²⁺). Stems repaired:
# Q5 (exhaust fumes, so carbon monoxide is clearly the most dangerous), Q18 (residue yellow hot,
# white cold, so only ZnCO3 fits), Q23 (number of particles), Q31 (copper(II)), Q35 (what the
# combination is for). Typos fixed in Q6, Q8, Q10, Q13 and Q15. Q8's carboxyl option was printed
# as a picture and is written in mhchem here.
