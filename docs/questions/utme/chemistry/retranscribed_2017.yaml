  - number: 3
    stem: 'Tetraoxosulphate(VI) acid is prepared using the chemical reaction $\ce{SO3(g) + H2O(l) -> H2SO4(l)}$. Given the heats of formation for $\ce{SO3(g)}$, $\ce{H2O(l)}$ and $\ce{H2SO4(l)}$ as −395 kJ mol⁻¹, −286 kJ mol⁻¹ and −811 kJ mol⁻¹ respectively, the enthalpy change accompanying this reaction is'
    options:
      A: '−1032 kJ'
      B: '−130 kJ'
      C: '+130 kJ'
      D: '+1032 kJ'
    answer: B
    printed_key: B
    corrected: 'Water in the equation is a liquid, $\ce{H2O(l)}$, not $\ce{H2O(s)}$, to match the heat of formation given.'
    subtopic: CHEM.11.a
    level: 3
    level_reason: one Hess's law sum from heats of formation
  - number: 4
    stem: 'In two separate experiments, 0.36 g and 0.71 g of chlorine combined with a metal X to give Y and Z. An analysis showed that Y and Z contain 0.20 g and 0.40 g of X respectively. The data above represent the law of'
    options:
      A: 'multiple proportion'
      B: 'conservation of mass'
      C: 'constant composition'
      D: 'reciprocal proportion'
    answer: C
    printed_key: C
    subtopic: CHEM.2.a
    level: 3
    level_reason: work out two mass ratios and match them to a law
  - number: 5
    stem: 'If an element X of atomic number z and mass number y is irradiated by an intense concentration of neutrons, the relevant nuclear equation is'
    options:
      A: '$\ce{^{y}_{z}X + ^{1}_{0}n -> ^{y-1}_{z+1}X}$'
      B: '$\ce{^{y}_{z}X + ^{1}_{0}n -> ^{y+1}_{z}X}$'
      C: '$\ce{^{y}_{z}X + ^{1}_{0}n -> ^{y}_{z+1}X}$'
      D: '$\ce{^{y}_{z}X + ^{1}_{0}n -> ^{y+1}_{z-1}X}$'
    answer: B
    printed_key: B
    corrected: 'Mass number written as lower-case y throughout (options B to D printed a capital Y) and the element as X.'
    subtopic: CHEM.5.a
    level: 2
    level_reason: balance mass and atomic numbers for neutron capture
