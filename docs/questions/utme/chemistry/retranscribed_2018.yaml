  - number: 4
    stem: 'A correct electrochemical series can be obtained from K, Na, Ca, Al, Mg, Zn, Fe, Pb, H, Cu, Hg, Ag, Au by interchanging'
    options:
      A: 'Al and Mg'
      B: 'Zn and Fe'
      C: 'Zn and Pb'
