  - number: 5
    stem: 'A basic postulate of the kinetic theory of gases is that the molecules of a gas move in straight lines between collisions. This implies that'
    options:
      A: 'collisions are perfectly elastic'
      B: 'forces of repulsion exist'
      C: 'forces of attraction and repulsion between the molecules are negligible'
      D: 'collisions are inelastic'
    answer: C
    printed_key: B
    key_note: 'A molecule keeps a straight line only when no force acts on it between collisions, so intermolecular attraction and repulsion must be negligible; B says the opposite.'
    corrected: 'Option C printed "forces of repulsion and attraction are in equilibrium"; reworded to "forces of attraction and repulsion between the molecules are negligible", the standard postulate the stem points to.'
    subtopic: CHEM.3.a
    level: 2
    level_reason: link one postulate to its meaning

  - number: 6
    stem: 'On which of the following is the solubility of a gaseous substance dependent? I. Nature of solvent  II. Nature of solute  III. Temperature  IV. Pressure'
    options:
      A: 'I, II, III and IV'
      B: 'I and II only'
      C: 'II only'
      D: 'I, III and IV only'
    answer: A
    printed_key: D
    key_note: 'Gas solubility depends on the gas itself as well as the solvent, temperature and pressure (ammonia is far more soluble in water than oxygen under the same conditions), so all four apply.'
    subtopic: CHEM.6.a
    level: 2
    level_reason: recall the factors that affect solubility of a gas

  - number: 7
    stem: 'Which of the following statements is correct about the periodic table?'
    options:
      A: 'Elements in the same period have the same number of valence electrons'
      B: 'The valence electrons of the elements in the same period increase progressively across the period'
      C: 'Elements in the same group have the same number of electron shells'
      D: 'The non-metallic properties of the elements tend to decrease across each period'
    answer: B
    printed_key: D
    key_note: 'Across a period the outer electrons rise one at a time (Na 1 to Cl 7) and non-metallic character increases, not decreases; so B is correct and D is false.'
    subtopic: CHEM.4.b
    level: 2
    level_reason: apply the period and group trends to four statements

