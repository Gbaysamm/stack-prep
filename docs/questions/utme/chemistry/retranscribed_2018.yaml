  - number: 2
    stem: 'If 1 litre of 2.2 M sulphuric acid is poured into a bucket containing 10 litres of water, and the resulting solution mixed thoroughly, the resulting sulphuric acid concentration will be'
    options:
      A: '2.2 M'
      B: '1.1 M'
      C: '0.20 M'
      D: '0.11 M'
    answer: C
    printed_key: C
    corrected: 'Option C printed 0.22 M, which is the result for a final volume of 10 litres; 1 litre added to 10 litres of water gives 11 litres, so 2.2 ÷ 11 = 0.20 M. Option C changed to 0.20 M.'
    subtopic: CHEM.2.a
    level: 3
    level_reason: one dilution calculation with a total-volume step

