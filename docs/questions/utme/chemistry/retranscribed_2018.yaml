  - number: 11
    stem: 'Methanoic acid mixes with water in all proportions and has about the same boiling point as water. Which of the following methods would you adopt to obtain pure water from a mixture of sand, water and methanoic acid?'
    options:
      A: 'Fractional distillation'
      B: 'Filtration followed by distillation'
      C: 'Neutralization with sodium hydroxide followed by distillation'
      D: 'Neutralization with sodium hydroxide followed by filtration'
    answer: C
    printed_key: A
    key_note: 'Liquids with about the same boiling point cannot be separated by fractional distillation; neutralising turns the acid into non-volatile sodium methanoate, so distillation then gives pure water.'
    subtopic: CHEM.1.e
    level: 4
    level_reason: choose a separation by combining boiling points with a chemical change

