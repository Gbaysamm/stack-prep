# UTME Chemistry — the topics and subtopics every question is tagged with.
#
# Read from source/syllabus.pdf. A topic is one of the syllabus's 18 numbered topics; a
# subtopic is one of its lettered contents, (a), (b), ... in the syllabus's own lettering.
# The five topics the syllabus does not letter (2, 5, 13, 17, 18) have one subtopic, `a`.
# Codes: CHEM.<topic> and CHEM.<topic>.<letter>. database/load_retranscribed_chemistry.py builds
# the curriculum from this file, and every retranscribed_YYYY.yaml uses exactly these codes.
format_version: 1
topics:
  CHEM.1:
    name: Separation of Mixtures and Purification of Chemical Substances
    subtopics:
      CHEM.1.a: Elements, compounds and mixtures
      CHEM.1.b: Chemical and physical changes
      CHEM.1.c: Pure and impure substances
      CHEM.1.d: Boiling, density, freezing and melting points
      CHEM.1.e: Separation processes
  CHEM.2:
    name: Chemical Combination
    subtopics:
      CHEM.2.a: Laws of chemical combination, formulae, equations and the mole
  CHEM.3:
    name: Kinetic Theory of Matter and Gas Laws
    subtopics:
      CHEM.3.a: Kinetic theory and changes of state
      CHEM.3.b: The gas laws
  CHEM.4:
    name: Atomic Structure and Bonding
    subtopics:
      CHEM.4.a: Atoms, molecules, ions and electron configuration
      CHEM.4.b: The periodic table and periodicity
      CHEM.4.c: Chemical bonding
      CHEM.4.d: Shapes of simple molecules
  CHEM.5:
    name: Nuclear Chemistry
    subtopics:
      CHEM.5.a: Radioactivity, nuclear reactions and their uses
  CHEM.6:
    name: Solubility
    subtopics:
      CHEM.6.a: Unsaturated, saturated and supersaturated solutions, solubility curves
      CHEM.6.b: Solvents for fats, oil, perspiration and stains
      CHEM.6.c: True and false solutions (suspensions and colloids)
  CHEM.7:
    name: Environmental Pollution
    subtopics:
      CHEM.7.a: Air and its constituents
      CHEM.7.b: Air pollution
      CHEM.7.c: Water pollution
      CHEM.7.d: Soil pollution
  CHEM.8:
    name: Acids, Bases and Salts
    subtopics:
      CHEM.8.a: Properties, preparation and uses of acids, bases and salts
      CHEM.8.b: Strength of acids and bases, conductance
      CHEM.8.c: pH and pOH
      CHEM.8.d: Acid/base titrations and indicators
      CHEM.8.e: Hydrolysis of salts
  CHEM.9:
    name: Oxidation and Reduction
    subtopics:
      CHEM.9.a: Oxidation as addition of oxygen
      CHEM.9.b: Reduction as removal of oxygen or addition of hydrogen
      CHEM.9.c: Oxidation and reduction as electron transfer
      CHEM.9.d: Oxidation numbers
      CHEM.9.e: IUPAC nomenclature of inorganic compounds
      CHEM.9.f: Tests for oxidizing and reducing agents
  CHEM.10:
    name: Electrolysis
    subtopics:
      CHEM.10.a: Electrolytes and non-electrolytes, Faraday's laws
      CHEM.10.b: Electrolysis of solutions and the factors that decide products
      CHEM.10.c: Uses of electrolysis
      CHEM.10.d: Electrochemical cells and the electrochemical series
      CHEM.10.e: Corrosion and its prevention
  CHEM.11:
    name: Energy Changes
    subtopics:
      CHEM.11.a: Enthalpy changes
      CHEM.11.b: Entropy
      CHEM.11.c: Spontaneity and free energy
  CHEM.12:
    name: Rates of Chemical Reaction
    subtopics:
      CHEM.12.a: Factors that change the rate of a reaction
      CHEM.12.b: Reaction rate curves
      CHEM.12.c: Activation energy
  CHEM.13:
    name: Chemical Equilibria
    subtopics:
      CHEM.13.a: Reversible reactions, Le Chatelier's principle and equilibrium constants
  CHEM.14:
    name: Non-metals and their Compounds
    subtopics:
      CHEM.14.a: Hydrogen
      CHEM.14.b: Halogens
      CHEM.14.c: Oxygen and sulphur
      CHEM.14.d: Nitrogen
      CHEM.14.e: Carbon
  CHEM.15:
    name: Metals and their Compounds
    subtopics:
      CHEM.15.a: General properties of metals
      CHEM.15.b: Alkali metals
      CHEM.15.c: Alkaline-earth metals
      CHEM.15.d: Aluminium
      CHEM.15.e: Tin
      CHEM.15.f: Metals of the first transition series
      CHEM.15.g: Iron
      CHEM.15.h: Copper
      CHEM.15.i: Alloys
  CHEM.16:
    name: Organic Compounds
    subtopics:
      CHEM.16.a: Aliphatic hydrocarbons (alkanes, alkenes, alkynes)
      CHEM.16.b: Aromatic hydrocarbons
      CHEM.16.c: Alkanols
      CHEM.16.d: Alkanals and alkanones
      CHEM.16.e: Alkanoic acids
      CHEM.16.f: Alkanoates, fats and soaps
      CHEM.16.g: Amines
      CHEM.16.h: Carbohydrates
      CHEM.16.i: Proteins
      CHEM.16.j: Polymers
  CHEM.17:
    name: Chemistry and Industry
    subtopics:
      CHEM.17.a: Chemical industries, raw materials and biotechnology
  CHEM.18:
    name: Astronomical Chemistry
    subtopics:
      CHEM.18.a: The solar system and the composition of the earth
