format_version: 1
exam_year: 2010
subject: COM
explanations:
  2:
    answer: B
    steps:
      - 'This is the importance of commerce to a nation.'
      - 'Commerce is all the activities of trade and the aids to trade (banking, transport, insurance, communication, warehousing and advertising) that carry goods from producers to consumers.'
      - 'The more goods a country produces and moves through trade, the more incomes, jobs, taxes and foreign exchange it earns. So a nation''s wealth grows with the volume of its commercial activities as a whole, not with one narrow part of them.'
      - 'Every bag of rice that moves from a mill in Kano, by lorry, to a wholesaler in Onitsha and a retailer in Aba creates income at each step for transporters, bankers, insurers and traders.'
      - 'Remember: more trade and aids to trade, more wealth.'
      - 'The trap is D, the stock market. It is only one institution inside commerce; it cannot by itself carry the wealth of a nation.'
    hint: 'Which option covers all of trade and the aids to trade, not just one part?'
    why:
      A: 'Bilateral trade is only trade between two countries, one small part of commerce.'
      C: 'Multilateral trade is only foreign trade among many countries, again one part of commerce.'
      D: 'The stock market is one institution of commerce, not the whole of it.'

  3:
    answer: A
    steps:
      - 'This is labour, the human factor of production, which is either skilled or unskilled.'
      - 'Skilled labour has special knowledge got through education and training; unskilled labour needs little or no training.'
      - 'A worker becomes skilled by schooling, an apprenticeship or professional training. That training is what separates a surgeon or an engineer from a labourer who carries loads.'
      - 'A trained electrician who wires a house in Ibadan is skilled labour; the man who helps him carry the ladder is unskilled labour.'
      - 'Remember: skill comes from schooling and training.'
      - 'The trap is D, salaries and wages. Skilled workers often earn more, but pay is a result of skill, not what makes a worker skilled.'
    hint: 'What does a skilled worker have that an unskilled worker does not?'
    why:
      B: 'Available resources describe the firm, not the worker''s skill.'
      C: 'An unskilled worker can be very committed; commitment does not make skill.'
      D: 'Pay follows skill; it is a result, not what tells skilled from unskilled labour.'

  4:
    answer: B
    steps:
      - 'This is service occupation, which is either direct or indirect.'
      - 'A direct service worker renders personal services straight to the person who pays for them. An indirect service worker serves the public and is paid by the government or an employer, not by the person served.'
      - 'In his official duty at a government hospital, the doctor is paid by government. When he treats patients at home after work, they pay him directly for a personal service, so in that work he is a direct service worker.'
      - 'A doctor in a Lagos general hospital who visits a sick neighbour at home in the evening and charges a fee is rendering a direct service.'
      - 'Remember: direct service is paid for directly by the person served.'
      - 'The trap is D. The question is about the home visits only, and in those the patient pays him directly.'
    hint: 'Who pays the doctor for the home visit?'
    why:
      A: 'A community development worker serves a whole community for an agency, not individual patients.'
      C: 'His official duty may be indirect service, but the home visits are paid for by the patient.'
      D: 'The question asks only about the home visits, which are direct service.'

  5:
    answer: C
    steps:
      - 'These are the three types of production: primary, secondary and tertiary.'
      - 'Secondary production turns raw materials into finished goods (manufacturing) or builds structures (construction).'
      - 'Primary production takes raw materials from nature (farming, mining, fishing). Secondary production processes them. Tertiary production is commerce and services, which bring the goods to consumers.'
      - 'Dangote Cement turning limestone into cement is manufacturing, and Julius Berger building a bridge with that cement is construction. Both are secondary production.'
      - 'Remember: first take from nature, second make and build, third trade and serve.'
      - 'The trap is A, primary production. That is only extraction from nature, before anything is made.'
    hint: 'Which stage of production makes and builds?'
    why:
      A: 'Primary production extracts raw materials from nature; it does not manufacture or build.'
      B: 'Tertiary production is commerce and services, not making goods.'
      D: 'Direct service is personal service such as a doctor''s or a barber''s, not production of goods.'

  6:
    answer: C
    steps:
      - 'These are the four factors of production and their rewards.'
      - 'Land earns rent, labour earns wages, capital earns interest, and the entrepreneur earns profit.'
      - 'Match the rewards in the order given: rents to land, wages to labour, interests to capital, profits to the entrepreneur. So the factors run land, labour, capital and entrepreneur.'
      - 'A trader in Onitsha pays rent for her shop (land), wages to her sales girl (labour), interest on her bank loan (capital), and keeps the profit for herself (entrepreneur).'
      - 'Remember the order: Land, Labour, Capital, Entrepreneur earn Rent, Wages, Interest, Profit.'
      - 'The trap is A. It puts capital first, but interest, not rent, is the reward for capital.'
    hint: 'Pair each reward with its factor in the same order.'
    why:
      A: 'Rent is the reward for land, not capital, and wages go to labour, not land.'
      B: 'Wages go to labour, not the entrepreneur, and profit goes to the entrepreneur, not capital.'
      D: 'Rent is earned by land, not labour, and interest by capital, not land.'

  7:
    answer: A
    steps:
      - 'This is capital, the man-made factor of production.'
      - 'Depreciation is the loss in value of an asset through wear and tear, age or going out of date.'
      - 'Machines, buildings and vehicles wear out as they are used, so their value falls each year. Land is a free gift of nature that does not wear out in this way.'
      - 'A grinding machine bought for ₦200,000 by a garri processor in Ogun State is worth less after five years of use. That fall is depreciation.'
      - 'Remember: capital is man-made, so it wears out.'
      - 'The trap is B, land. Land can lose fertility, but it is not used up like a machine, and it is not depreciated.'
    hint: 'Which factor is made by man and wears out with use?'
    why:
      B: 'Land is a gift of nature and does not wear out like machines.'
      C: 'Labour can tire or age, but depreciation is the wear of man-made assets.'
      D: 'The entrepreneur is a person who takes risks; he does not depreciate.'

  8:
    answer: C
    steps:
      - 'This is division of labour.'
      - 'Division of labour is breaking a job into stages, with each worker doing one stage.'
      - 'A worker who does the same stage every day becomes expert at it. In the end each worker, firm or region concentrates on what it does best, which is specialization.'
      - 'In a Kano shoe workshop one person cuts leather, another stitches, a third fixes soles. Each becomes a specialist at one stage.'
      - 'Remember: divide the work, and each worker specializes.'
      - 'The trap is D, repetition. Workers do repeat tasks, but repetition is a feature along the way, while specialization is the end result.'
    hint: 'When each worker does one stage only, what does each become?'
    why:
      A: 'Conservation is about saving resources, not about dividing work.'
      B: 'Integration is the joining of firms, not the result of dividing a job.'
      D: 'Repetition is a feature, often a drawback, of division of labour, not its end result.'

  9:
    answer: D
    steps:
      - 'This is an industrial occupation, one that turns raw materials into finished goods.'
      - 'Industrial occupations are extractive (taking from nature), manufacturing (processing raw materials into goods) and constructive (building).'
      - 'Paddy rice from the farm is cleaned, parboiled, milled and bagged. That changes the form of a raw material into a finished good, which is manufacturing.'
      - 'A worker at a rice mill in Abakaliki or Kano that turns paddy into bagged rice is in manufacturing.'
      - 'Remember: if it changes the form of the raw material, it is manufacturing.'
      - 'The trap is C, extractive activity. The farmer who grows the paddy is extractive; the miller who processes it is manufacturing.'
    hint: 'Is the worker growing the rice, building something, selling it, or changing its form?'
    why:
      A: 'Constructive activity is building roads, bridges and houses.'
      B: 'Commercial activity is buying, selling and the aids to trade, not processing.'
      C: 'Extractive activity takes raw materials from nature, such as growing the paddy.'

  10:
    answer: A
    steps:
      - 'This is after-sales service, a function of the retailer to the consumer.'
      - 'After-sales service is help given to a buyer after the sale: delivery, installation, repairs and servicing.'
      - 'The retailer is the last link with the consumer, so the buyer comes back to the shop for help. This builds goodwill and keeps the customer loyal.'
      - 'A shop in Ikeja that sells you a refrigerator, delivers it and repairs it under warranty is giving after-sales service.'
      - 'Remember: the retailer meets the consumer, so the retailer serves after the sale.'
      - 'The trap is B, a wholesaler. The wholesaler sells to retailers, not to the final consumer who needs the service.'
    hint: 'Who sells directly to the final consumer?'
    why:
      B: 'A wholesaler sells in bulk to retailers, not to final consumers.'
      C: 'An agent arranges sales for a principal; he does not usually service goods afterwards.'
      D: 'Entrepreneur is a general name for a risk-taker in any business, not the seller who serves the buyer.'

  11:
    answer: C
    steps:
      - 'This is self-service, a modern trend in retailing.'
      - 'In self-service, goods are displayed on open shelves, customers pick what they want themselves, and pay at a checkout.'
      - 'There are no attendants between the buyer and the goods, so customers can see, compare and choose freely. It saves staff costs and encourages impulse buying.'
      - 'In a Shoprite or SPAR supermarket you push a trolley, take the noodles and soap you want, and pay at the till.'
      - 'Remember: self-service means you serve yourself from open shelves.'
      - 'The trap is D, the vending machine. It sells only a few items from behind glass, so the buyer has no free access to the goods.'
    hint: 'In which kind of shop do you take goods from the shelf yourself?'
    why:
      A: 'After-sales service is help after the sale, not free access to goods.'
      B: 'Branding gives products names; it does not let shoppers handle them freely.'
      D: 'A vending machine sells a few items behind glass; the buyer cannot handle them.'

  12:
    answer: B
    steps:
      - 'This is wholesaling, the trade between the producer and the retailer.'
      - 'A wholesaler buys goods in large quantities from manufacturers and sells them in smaller quantities to retailers. This is called breaking bulk.'
      - 'The manufacturer saves the trouble of selling to thousands of small shops, and the retailer can buy only what he can sell. The wholesaler also stores goods and gives credit to retailers.'
      - 'A wholesaler at Idumota market buys a trailer-load of Indomie cartons from the factory and sells ten cartons at a time to small shop owners.'
      - 'Remember: wholesalers buy in bulk and break bulk for retailers.'
      - 'The trap is C, retailing. The retailer also breaks bulk, but sells to the final consumer, not to retailers.'
    hint: 'Who sells to retailers, rather than to the final consumer?'
    why:
      A: 'Assembling is putting parts together in production, not buying and selling.'
      C: 'Retailing sells to final consumers, not to retailers.'
      D: 'Merchandising is planning and displaying goods for sale, not buying in bulk for retailers.'

  13:
    answer: A
    steps:
      - 'This is the balance of payments.'
      - 'The balance of payments is the record of all of a country''s receipts from and payments to other countries in a period, for visible goods and invisible services, in money terms.'
      - 'Visible items are goods you can see, like crude oil and cocoa. Invisible items are services, like shipping, insurance, tourism and banking. When both are counted together, the account is the balance of payments.'
      - 'Nigeria''s crude oil exports are visible; the freight it pays foreign shipping lines and the fees of Nigerian students abroad are invisible. All of them go into the balance of payments.'
      - 'Remember: balance of trade is goods only; balance of payments is goods plus services.'
      - 'The trap is C, the balance of trade. It compares visible exports and imports only, without the invisibles.'
    hint: 'Which account includes the invisibles as well as the visibles?'
    why:
      B: 'Terms of trade is the rate at which export prices exchange for import prices, not a record of all payments.'
      C: 'Balance of trade covers visible goods only, not invisible services.'
      D: 'Terms of payment are the conditions on which a buyer pays, such as cash or credit.'

  14:
    answer: C
    steps:
      - 'This is the indent, the order an importer sends to an agent abroad.'
      - 'An open indent leaves the agent free to buy the goods from any manufacturer. A closed (specific) indent names the manufacturer the agent must buy from.'
      - 'The importer sends the indent to an indent house or commission agent abroad. With an open indent, the agent shops around for the best price and quality; with a closed indent he has no choice.'
      - 'An importer in Aba who sends an open indent for 500 generators lets his agent in China buy from any good factory; if he names one factory, it is a closed indent.'
      - 'Remember: open indent, open choice; closed indent, choice closed.'
      - 'The trap is B, a closed indent. That names one supplier, so it gives no free hand.'
    hint: 'Which indent leaves the choice of supplier open?'
    why:
      A: 'A consular invoice is a certified invoice for customs abroad, not an order to buy.'
      B: 'A closed indent names one manufacturer; it gives no free hand.'
      D: 'A freight note is the shipowner''s bill for carriage, not an order for goods.'

  15:
    answer: C
    steps:
      - 'This is entrepot trade, one of the types of foreign trade.'
      - 'Entrepot trade is importing goods into a country in order to re-export them to another country.'
      - 'The goods may be repacked or sorted, but are not used in the importing country. That country earns from handling, storage and port charges.'
      - 'Goods landed at Lomé or Cotonou and then sent on to Nigeria are entrepot trade for Togo and Benin. Singapore and Hong Kong are famous entrepot ports.'
      - 'Remember: entrepot means in, then out again.'
      - 'The trap is D. Exporting goods to be re-imported is the reverse, and is not entrepot trade.'
    hint: 'Goods come in, but where do they finally go?'
    why:
      A: 'Exchanging goods within a nation is home trade.'
      B: 'Exchanging goods among countries is foreign trade in general, not entrepot in particular.'
      D: 'Entrepot is importing to re-export, not exporting to re-import.'

  16:
    answer: D
    steps:
      - 'This is the dock warrant, a document of the port and warehouse.'
      - 'A dock warrant is issued by the port or dock authority to the owner of goods stored in its warehouse. It is proof of ownership of the goods.'
      - 'The owner can collect the goods with the warrant, or sell them by endorsing and handing the warrant to the buyer, without moving the goods at all.'
      - 'An importer whose goods are stored in a port warehouse at Apapa holds a dock warrant, and can sell the goods by passing it on.'
      - 'Remember: goods in the dock warehouse, warrant in the owner''s hand.'
      - 'The trap is C, the bill of lading. It is issued by the shipping company for goods loaded on a ship, not by the port for goods stored.'
    hint: 'Which document comes from the port when goods are stored in its warehouse?'
    why:
      A: 'A mate''s receipt is given by the ship''s officer when goods are loaded on board.'
      B: 'A bill of sight is given to customs when the importer cannot fully describe the goods.'
      C: 'A bill of lading is issued by the shipping company for goods carried by sea.'

  17:
    answer: B
    steps:
      - 'This is the indent, the importer''s order.'
      - 'An indent is the order an importer sends to a supplier or agent abroad. It sets out the goods required: their description, quantity, quality, price and how they are to be packed and shipped.'
      - 'The buyer writes the indent; the seller replies with an invoice that states the goods sent and the amount due. So the buyer''s requirements are in the indent, and the seller''s bill is the invoice.'
      - 'A trader in Onitsha who wants 200 bales of fabric from India writes an indent with the colours, sizes and quantity he wants.'
      - 'Remember: the buyer indents, the seller invoices.'
      - 'The trap is C, an invoice. It also lists goods, but it is sent by the seller to bill the buyer, not by the buyer to say what he wants.'
    hint: 'Which document does the buyer write to say what he wants?'
    why:
      A: 'A consular invoice is a seller''s invoice certified by the consul for customs.'
      C: 'An invoice is sent by the seller to bill the buyer for goods supplied.'
      D: 'A certificate of origin states the country where goods were made.'

  18:
    answer: A
    steps:
      - 'This is dumping, an unfair practice in foreign trade.'
      - 'Dumping is selling goods in a foreign market at a price below their cost of production, or below the price at home.'
      - 'A country or firm with surplus goods sells them cheaply abroad to get rid of them or to drive out local producers. Local industries in the importing country cannot compete and may close.'
      - 'Cheap imported textiles sold in Nigeria below cost have hurt local textile mills in Kaduna and Kano, which is why governments restrict such imports.'
      - 'Remember: dumping means selling abroad below cost.'
      - 'The trap is D, discounting. A discount is a price reduction offered to buyers, not selling abroad below cost.'
    hint: 'What do you call getting rid of goods abroad below cost?'
    why:
      B: 'Depreciation is a fall in the value of an asset or a currency.'
      C: 'Devaluation is a deliberate cut in the official value of a currency.'
      D: 'Discounting is a price reduction to buyers, not selling abroad below cost.'

  19:
    answer: C
    steps:
      - 'This is advertising, one of the aids to trade.'
      - 'Advertising is giving information about a product through the mass media in order to persuade people to buy it.'
      - 'It tells more people that the product exists and why they should buy it, so demand grows and the market widens. It also introduces new products and reminds old customers.'
      - 'When Peak Milk runs adverts on television and on billboards in Lagos, more families learn of it and buy it, so its market grows.'
      - 'Remember: advertise to make it known and widen the market.'
      - 'The trap is D, repositioning. It changes how a product is seen or who it is aimed at, but the persuasive messages themselves are advertising.'
    hint: 'What are persuasive messages about a product called?'
    why:
      A: 'Consumerism is a movement that protects buyers, not messages that sell products.'
      B: 'Warehousing stores goods; it does not make them known.'
      D: 'Repositioning changes a product''s image or target group; the messages used are advertising.'

  20:
    answer: C
    steps:
      - 'This is television as a medium of advertising.'
      - 'Television combines sight, sound, colour and movement, so it appeals to more of the senses than any other medium.'
      - 'A viewer sees the product used, hears the jingle and remembers it. That makes a television advert more vivid and persuasive than print or radio.'
      - 'A Maggi advert on NTA or Channels shows a pot of stew cooking and a family enjoying it, with a catchy song.'
      - 'Remember: television is see, hear and feel.'
      - 'The trap is D, more network coverage. Radio reaches more people, even in villages without power, so coverage is radio''s strength.'
    hint: 'What can a viewer do with a television advert that a reader or listener cannot?'
    why:
      A: 'Being open to censorship is a limit on television, not a merit.'
      B: 'Television is one of the most expensive media, not a cheap one.'
      D: 'Radio has the widest coverage; television needs power and a set.'

  21:
    answer: B
    steps:
      - 'This is registered mail (registered post), a special postal service.'
      - 'Registered mail is used to send money, documents or other valuables. Each item is recorded, kept apart, signed for at each stage and at delivery, and the sender gets compensation if it is lost.'
      - 'Because the item is tracked and signed for all the way, it is the safest way to make sure a valuable item reaches the named address.'
      - 'A trader in Kaduna posting certificates to Lagos would send them by registered mail at the NIPOST office.'
      - 'Remember: register the valuable to be safe.'
      - 'The trap is A, recorded delivery. It records that a letter was delivered, but it is meant for papers of little value and has no special security on the way.'
    hint: 'Which service is meant for valuables and pays compensation if they are lost?'
    why:
      A: 'Recorded delivery proves delivery but is for items of little value, with no special care on the way.'
      C: 'A certificate of posting only proves that an item was posted, not that it arrived.'
      D: 'Express mail is about speed, not the safety of valuables.'

  22:
    answer: D
    steps:
      - 'This is hull insurance, a type of marine insurance.'
      - 'Hull insurance covers the ship itself, its body, engines and equipment, against loss or damage at sea.'
      - 'Marine insurance has three main parts: hull insurance for the ship, cargo insurance for the goods on it, and freight insurance for the money paid for carrying the goods. A shipowner takes out hull insurance so that if the ship is damaged by storm, fire or collision, the insurer pays for the repairs or the loss.'
      - 'A Nigerian shipping company whose vessel is damaged in a storm off the coast of Lagos claims the cost of repairs under its hull policy.'
      - 'Remember: hull is the ship, cargo is the goods, freight is the fare.'
      - 'The trap is A, damage to the cargo. That is cargo insurance, taken out by the owner of the goods.'
    hint: 'What is the hull of a ship?'
    why:
      A: 'Damage to the goods carried is covered by cargo insurance.'
      B: 'Injured crew are covered by accident or employers'' liability insurance, not hull insurance.'
      C: 'The money for carrying goods is covered by freight insurance.'

  23:
    answer: D
    steps:
      - 'This is a broker, a kind of mercantile agent.'
      - 'A broker brings buyers and sellers into contact and arranges deals between them for a commission called brokerage. He does not hold the goods or sell in his own name.'
      - 'The broker finds a customer, introduces him to the principal, and the two parties make the contract themselves. A factor, by contrast, has the goods in his possession and sells in his own name.'
      - 'An insurance broker in Lagos finds a client and links him with an insurance company, and a stockbroker links investors with the stock market.'
      - 'Remember: a broker brings the parties together.'
      - 'The trap is C, a factor. A factor holds the goods and sells them himself, so he does more than bring parties into contact.'
    hint: 'Which agent only introduces the two parties?'
    why:
      A: 'A del credere agent sells for the principal and also guarantees that the buyer will pay.'
      B: 'An auctioneer sells goods publicly to the highest bidder.'
      C: 'A factor holds the goods and sells them in his own name.'

  24:
    answer: B
    steps:
      - 'This is tourism, and the challenges it faces in Nigeria.'
      - 'Tourism is travel for leisure, business or culture, and it grows only where visitors can reach a site easily, stay in comfort and feel safe.'
      - 'Bad roads, poor power and water, few good hotels and the fear of kidnapping or attacks keep tourists away. So poor infrastructure and insecurity are the major hindrances to tourism in Nigeria.'
      - 'Nigeria has fine attractions such as Yankari Game Reserve, Obudu Mountain Resort and the Osun-Osogbo Grove, but bad roads and insecurity keep many visitors away.'
      - 'Remember: tourists need to get there, stay well and feel safe.'
      - 'The trap is A, a shortage of natural attractions. Nigeria has many attractions; the problem is reaching them and staying in safety.'
    hint: 'What do tourists need besides something to see?'
    why:
      A: 'Nigeria has many natural attractions; their number is not the problem.'
      C: 'Nigeria receives too few foreign tourists, not too many.'
      D: 'Obeying immigration laws keeps travel orderly; it is not a hindrance.'

  25:
    answer: B
    steps:
      - 'These are the types of warehouse: private, public and bonded.'
      - 'A public warehouse is owned by the government or its agencies and is open to any trader who pays to store goods there.'
      - 'Private warehouses belong to manufacturers, wholesalers or retailers for their own goods. Public warehouses serve everyone for a fee, and include those at seaports and airports.'
      - 'Warehouses at the Apapa and Tin Can ports in Lagos, where any importer can store goods for a fee, are public warehouses.'
      - 'Remember: public warehouse, owned for the public, open to the public.'
      - 'The trap is D, the manufacturers'' warehouse. It is private, kept by the manufacturer for its own goods.'
    hint: 'Which warehouse serves everyone, not one firm?'
    why:
      A: 'A wholesalers'' warehouse is private, owned by the wholesaler.'
      C: 'A retailers'' warehouse is private, owned by the retailer.'
      D: 'A manufacturers'' warehouse is private, owned by the manufacturer.'

  26:
    answer: B
    steps:
      - 'This is the partnership, a form of business unit.'
      - 'A partnership is a business owned by 2 to 20 people who share capital, work and profit. It has no corporate existence, which means it is not a legal person separate from its partners.'
      - 'Because the firm is not separate from its owners, the partners are personally liable for its debts, and the death or withdrawal of a partner can end the firm. A company, by contrast, is a separate legal person.'
      - 'Three accountants in Enugu who form a firm cannot sue in the firm''s own name as a company can; the partners themselves stand behind it.'
      - 'Remember: partnership means partners and firm are one in law.'
      - 'The trap is A, limited liability. Ordinary partners have unlimited liability; limited liability is the mark of a company.'
    hint: 'Is a partnership a legal person separate from its owners?'
    why:
      A: 'Partners in an ordinary partnership have unlimited liability.'
      C: 'Membership is limited, usually 2 to 20 partners.'
      D: 'Partnership rests on mutual trust (good faith) among partners, not a lack of it.'

  27:
    answer: D
    steps:
      - 'This is a cartel, a form of business combination.'
      - 'A cartel is an agreement among independent firms in the same industry to share the market by quotas, or to fix prices, while each firm keeps its own identity.'
      - 'Each member is given a quota of output or a share of the market, so they stop competing with one another and can keep prices high.'
      - 'OPEC, of which Nigeria is a member, works like a cartel: each oil-producing country is given a production quota.'
      - 'Remember: cartel means cutting the market into quotas.'
      - 'The trap is A, a trust. In a trust the firms give up their independence to one board, so they are no longer independent.'
    hint: 'Which combination keeps firms independent but gives each a quota?'
    why:
      A: 'In a trust the firms hand control to one board of trustees and lose their independence.'
      B: 'Integration is the joining of firms into one, not quota sharing.'
      C: 'A syndicate is a cartel that sells through one common selling agency.'

  28:
    answer: A
    steps:
      - 'This is a ring, or price ring.'
      - 'A ring is a secret agreement among manufacturers or dealers to fix the price or conditions of sale of a product, so that buyers cannot benefit from competition.'
      - 'Because it removes competition and cheats consumers, a price ring is against the law in most countries, including Nigeria.'
      - 'If all the cement makers in a region secretly agreed to sell at one high price, that would be a price ring, which today the Federal Competition and Consumer Protection Commission can punish.'
      - 'Remember: a ring closes around the buyer and fixes the price.'
      - 'The trap is C, a consortium. A consortium is a lawful grouping of firms for one large project, such as building a bridge.'
    hint: 'Which arrangement fixes prices in secret and is illegal?'
    why:
      B: 'Factoring is selling debts to a factor for cash, not fixing prices.'
      C: 'A consortium is a lawful grouping of firms for one big project.'
      D: 'A merger joins firms into one company; it is lawful when approved.'

  29:
    answer: C
    steps:
      - 'This is issued capital, the part of authorized capital that a company has actually offered to shareholders.'
      - 'Issued capital = number of shares issued × price per share: $\text{Issued capital} = \text{Number of shares} \times \text{Price per share}$.'
      - 'Data: 36,000 shares at 150k. Change kobo to naira: 150k = ₦1.50. Then $36{,}000 \times 1.50 = 54{,}000$, so issued capital is ₦54,000.'
      - 'Check: ₦54,000 is less than the authorized capital of ₦60,000, as it must be, because a company cannot issue more than it is authorized to.'
      - 'A company like Dangote Cement is authorized to raise a set amount, and issues shares up to that limit as it needs funds.'
      - 'The trap is A, ₦60,000. That is the authorized capital, the most the company may raise, not what it has issued. B forgets to multiply by the price, and D uses ₦2.50 a share.'
    hint: 'Change 150k into naira, then multiply by the number of shares.'
    why:
      A: '₦60,000 is the authorized capital, the most the company may raise.'
      B: '₦36,000 counts each share as ₦1 and ignores the price of 150k.'
      D: '₦90,000 prices each share at ₦2.50 and is more than the authorized capital.'

  30:
    answer: C
    steps:
      - 'This is NACCIMA, the Nigerian Association of Chambers of Commerce, Industry, Mines and Agriculture.'
      - 'NACCIMA is the national body that unites the chambers of commerce in Nigeria. It promotes trade and keeps its members informed.'
      - 'It gathers news on tariffs, import rules, trade fairs and government policy, and passes it to members, and it speaks for business to government. Wages and labour relations are handled by the employers'' association, the Nigeria Employers'' Consultative Association (NECA).'
      - 'When customs duties on imported goods change, NACCIMA and the Lagos Chamber of Commerce brief their members on the new tariffs.'
      - 'Remember: chambers of commerce inform and speak for traders; NECA deals with labour.'
      - 'The trap is D, labour matters and industrial relations. That is the work of NECA, not NACCIMA.'
    hint: 'Is NACCIMA an employers'' body for labour matters, or a trade body that informs members?'
    why:
      A: 'Negotiating wages with labour unions is the work of employers'' associations such as NECA.'
      B: 'Pooling members'' funds for investment is the work of an investment company, not a chamber of commerce.'
      D: 'Labour matters and industrial relations belong to NECA, the employers'' association.'

  31:
    answer: D
    steps:
      - 'These are the qualities (characteristics) of good money.'
      - 'Relative scarcity means money must be limited in supply. If it were too plentiful, it would lose its value.'
      - 'When too much money chases the same goods, prices rise and each naira buys less. Keeping money scarce, by controlling how much is issued, keeps its value.'
      - 'The Central Bank of Nigeria controls how much naira is printed. If it printed far too much, prices in the market would rise and the naira would buy less.'
      - 'Remember: scarce money keeps its value.'
      - 'The trap is C, divisibility. It lets money be broken into small units for small purchases, but it does not protect its value.'
    hint: 'What happens to the value of anything that becomes too plentiful?'
    why:
      A: 'Homogeneity means every unit is the same, so they can be exchanged equally.'
      B: 'Portability means money is easy to carry.'
      C: 'Divisibility lets money be split for small purchases; it does not keep its value.'

  32:
    answer: C
    steps:
      - 'This is the capital market, the market for long-term funds.'
      - 'The capital market deals in long-term securities such as stocks, shares, bonds and debentures. The money market deals in short-term instruments such as treasury bills, bills of exchange and commercial papers.'
      - 'A company raises long-term capital by selling stock to investors, and the stock is then bought and sold on the stock exchange. Short-term instruments, which mature within a year, belong to the money market.'
      - 'When an investor in Lagos buys shares of Dangote Cement through a stockbroker, that is a capital market deal.'
      - 'Remember: capital market for years, money market for months.'
      - 'The trap is A, treasury bills. They are government borrowing for 91 to 364 days, so they belong to the money market.'
    hint: 'Which option is long-term, and which are short-term?'
    why:
      A: 'Treasury bills are short-term government borrowing, a money market instrument.'
      B: 'A bill of exchange usually runs for a few months, a money market instrument.'
      D: 'Commercial paper is short-term company borrowing, a money market instrument.'

  33:
    answer: D
    steps:
      - 'This is the Second-Tier Securities Market (SSM) of the Nigerian Stock Exchange.'
      - 'The SSM was opened in 1985 so that small and medium-sized companies, which could not meet the strict rules of the main (first-tier) market, could raise long-term funds.'
      - 'Its requirements were lighter. A company needed to offer only 10% of its equity shares to the public, against 25% for the first-tier market, and fewer shareholders and a shorter trading record were accepted.'
      - 'A growing family company in Ibadan could join the SSM by selling 10% of its shares to the public. Today the SSM has been replaced by the Alternative Securities Market (2013), and the exchange is now Nigerian Exchange Limited.'
      - 'Remember: second tier, lighter rules, ten per cent to the public.'
      - 'The trap is A, 20%. The second tier asked for less than that, so that small firms could qualify.'
    hint: 'The second tier is for small firms. Would it ask for a large or a small share of equity to be offered?'
    why:
      A: '20% is more than the second tier required; it asked for only 10%.'
      B: 'A company did not need a foreign listing to join a Nigerian market.'
      C: '100 shareholders was a minimum, not a maximum; more shareholders were always welcome.'

  34:
    answer: D
    steps:
      - 'This is staffing, one of the functions of management.'
      - 'Staffing means finding, choosing and placing the right people in the right jobs. Its three parts are recruitment, selection and placement.'
      - 'Recruitment attracts applicants (adverts, agencies). Selection chooses the best of them (tests, interviews). Placement puts the chosen person in the job that fits him. Interviews and tests are tools of selection, not separate parts.'
      - 'A bank in Abuja advertises for graduates (recruitment), tests and interviews them (selection), then posts each new staff member to a branch (placement).'
      - 'Remember: recruit, select, place.'
      - 'The trap is C. Appointment is only the offer letter inside selection; the last stage is placement in the job.'
    hint: 'After choosing a worker, what must the firm do with him?'
    why:
      A: 'An interview is a tool of selection, and appointment is part of selection, not placement.'
      B: 'A test is a tool of selection, not one of the three parts of staffing.'
      C: 'Appointment is part of selection; the third part is placement.'

  35:
    answer: C
    steps:
      - 'This is delegation of authority, a principle of management.'
      - 'Delegation is a superior giving part of his authority to a subordinate to carry out a task, while he stays responsible for it.'
      - 'How much to delegate, and to whom, is left to the superior''s own judgement and trust in his staff. The other options are fixed rules of organisation, not personal choices.'
      - 'A branch manager in Port Harcourt may let his deputy approve small loans while he is away. It is his choice how much to hand over.'
      - 'Remember: delegation depends on the boss''s trust.'
      - 'The trap is B, span of control. It is set by the size and structure of the organisation, not by the superior''s personal liking.'
    hint: 'Which of these does a boss decide by his own trust in his staff?'
    why:
      A: 'Unity of command is a fixed rule that each worker has only one boss.'
      B: 'Span of control is set by the structure of the organisation, not personal preference.'
      D: 'Unity of direction is a fixed rule that one plan and one head guide a group of activities.'

  36:
    answer: A
    steps:
      - 'This is utility, the satisfaction a good gives, and production creates it.'
      - 'Form utility is created when raw materials are changed into a more useful form, as finished goods.'
      - 'Production creates utility in different ways: form utility by manufacturing, place utility by transport, time utility by warehousing, and possession utility by trade, when ownership passes to the user.'
      - 'Cotton turned into cloth at a textile mill in Kaduna has form utility; the cloth is more useful than raw cotton.'
      - 'Remember: change the form, create form utility.'
      - 'The trap is D, place utility. That comes from moving goods to where they are needed, which is transport, not manufacturing.'
    hint: 'What changes when raw materials become finished goods?'
    why:
      B: '"Product utility" is not one of the kinds of utility; the change of form gives form utility.'
      C: 'Possession utility is created by trade, when ownership passes to the buyer.'
      D: 'Place utility is created by transport, which moves goods to where they are wanted.'

  37:
    answer: B
    steps:
      - 'This is the marketing concept.'
      - 'The marketing concept says a business should first find out what consumers need and want, and then produce and sell goods that satisfy those needs, at a profit.'
      - 'The older selling idea was to make goods first and then push them on buyers. The marketing concept starts with the consumer, so goods sell more easily and customers come back.'
      - 'A noodle maker in Lagos that surveys students, learns they want quick, cheap meals, and makes small affordable packs is using the marketing concept.'
      - 'Remember: find the need, then fill it.'
      - 'The trap is C, increase sales. Pushing sales is the selling concept; the marketing concept starts from needs, not from sales.'
    hint: 'Does the marketing concept start from the factory or from the consumer?'
    why:
      A: 'Reducing retail outlets is not the aim of marketing; it usually wants goods widely available.'
      C: 'Increasing sales first is the selling idea; the marketing concept starts from needs.'
      D: 'Division of labour is about production, not marketing.'

  38:
    answer: C
    steps:
      - 'This is pricing strategy, part of the marketing mix.'
      - 'Variable pricing means changing the price of a product with the season or the level of demand.'
      - 'Warm clothing sells mainly in the cold season, so the maker charges more when demand is high and cuts prices to clear stock when the season ends.'
      - 'Sweaters and jackets sell fast in Jos and Kano during the harmattan, and are cheaper in the rainy season.'
      - 'Remember: seasonal goods, seasonal prices.'
      - 'The trap is D, product line pricing. It sets different price levels for related products in one range, not prices that change with the season.'
    hint: 'Demand for warm clothing rises and falls with the season. Which strategy follows demand?'
    why:
      A: 'Target return pricing sets price to earn a fixed return on investment, whatever the season.'
      B: 'Bid pricing is used when firms compete for contracts by tender.'
      D: 'Product line pricing sets price steps across a range of products, not across seasons.'

  39:
    answer: A
    steps:
      - 'This is public relations (PR).'
      - 'Public relations is the deliberate, planned and sustained effort to build and keep goodwill and understanding between an organization and its public.'
      - 'PR uses press releases, sponsorships, open days and community projects to give the firm a good image over a long time. Advertising sells a product; PR builds goodwill for the organization.'
      - 'When a bank sponsors a football tournament or a breast cancer walk in Lagos, it is doing public relations.'
      - 'Remember: PR builds goodwill, advertising builds sales.'
      - 'The trap is B, advertising. It is paid persuasion to sell a product, not the sustained building of goodwill.'
    hint: 'Which activity is about goodwill and image rather than direct sales?'
    why:
      B: 'Advertising is paid persuasion to sell a product, not sustained goodwill building.'
      C: 'Sales promotion is a short-term push such as free gifts or discounts.'
      D: 'Rebranding changes a product''s name or image once; it is not sustained goodwill effort.'

  40:
    answer: A
    steps:
      - 'This is a trademark.'
      - 'A trademark is a name, word, symbol or design registered by a manufacturer so that no one else may use it on similar goods.'
      - 'Registration gives the owner the sole right to the mark, so buyers can recognise genuine goods and copiers can be sued.'
      - 'Pampers diapers, Peak milk and Indomie noodles carry registered trademarks; a fake maker may not use those names.'
      - 'Remember: trademark is the registered mark of the maker.'
      - 'The trap is D, patent right. A patent protects an invention, not the name on the product.'
    hint: 'What is a registered product name that others may not copy?'
    why:
      B: 'Grading sorts goods into classes by quality, not names them.'
      C: 'Packaging is the container and wrapping, not the registered name.'
      D: 'A patent protects an invention, not a product''s name.'

  41:
    answer: C
    steps:
      - 'This is a voidable contract.'
      - 'A voidable contract is valid and binding until one of the parties, the one who was wronged, chooses to reject (avoid) it.'
      - 'It arises where consent was not freely given, for example through misrepresentation, undue influence or duress. The innocent party may keep it or set it aside, as he wishes.'
      - 'If a car dealer in Ibadan lies about a car''s mileage to sell it, the buyer can choose to cancel the sale or keep the car.'
      - 'Remember: voidable means it can be made void by one party''s choice.'
      - 'The trap is A, a valid contract. A valid contract binds both parties; neither may reject it at will.'
    hint: 'Which contract stands until one party chooses to set it aside?'
    why:
      A: 'A valid contract binds both parties; neither may reject it at will.'
      B: 'A quasi contract is an obligation the law imposes where there is no agreement at all.'
      D: 'A conditional contract depends on an event happening, not on a party''s choice to reject it.'

  42:
    answer: D
    steps:
      - 'This is agency, a contract in business law.'
      - 'Agency is the relationship in which one person, the agent, is authorized to act for another, the principal, in dealings with third parties.'
      - 'The contract of agency itself is between the principal and the agent. The agent then makes contracts with third parties on the principal''s behalf, and those contracts bind the principal.'
      - 'A clearing agent at Apapa is hired by an importer (the principal) to clear goods through customs; the importer and the clearing agent are the two parties to the agency contract.'
      - 'Remember: agency needs a principal and an agent; third parties come later.'
      - 'The trap is C, a principal and a third party. The third party deals through the agent but is not a party to the agency contract itself.'
    hint: 'Who are the two parties who agree that one will act for the other?'
    why:
      A: 'A consumer may buy from the agent, but is not a party to the agency contract.'
      B: 'A producer is not needed; the principal may be any person or firm.'
      C: 'The third party deals through the agent but is outside the agency contract.'

  43:
    answer: C
    steps:
      - 'These are trademarks and patents, forms of protection of business property.'
      - 'A patent is a right granted by government that gives an inventor the sole right to make, use and sell his invention for a fixed number of years. A trademark protects only the name or symbol on goods.'
      - 'So the patent gives its owner a monopoly over the invention itself: no one else may produce it without his permission until the patent expires.'
      - 'If a Nigerian engineer invents a new cassava peeling machine and patents it, other firms cannot make and sell that machine without his permission.'
      - 'Remember: patent protects the invention, trademark protects the name.'
      - 'The trap is B. Both patents and trademarks are registered by government, so that does not tell them apart.'
    hint: 'What does a patent protect that a trademark does not?'
    why:
      A: 'An exclusive right to import is a licence, not a patent.'
      B: 'Both patents and trademarks are granted by government, so this is no difference.'
      D: 'The exclusive right to publish literary works is copyright.'

  44:
    answer: A
    steps:
      - 'This is consumerism, the consumer movement.'
      - 'Consumerism is the organized effort of consumers and government to protect the rights and interests of buyers against unfair practices of sellers.'
      - 'It fights fake and dangerous goods, false adverts, short measures and overcharging, and teaches consumers their rights to safety, information, choice and redress.'
      - 'In 2010 the Consumer Protection Council and NAFDAC worked to protect Nigerian buyers from fake drugs and unsafe goods. Since the Federal Competition and Consumer Protection Act 2018, the council is the Federal Competition and Consumer Protection Commission.'
      - 'Remember: consumerism protects the consumer.'
      - 'The trap is B, providing consumers'' choice. Choice is one of the rights it protects, but the sellers provide the goods; consumerism protects rights.'
    hint: 'Is consumerism about supplying goods or about protecting buyers?'
    why:
      B: 'Choice is provided by producers and sellers; consumerism protects the right to it.'
      C: 'Satisfying consumers'' needs is the job of producers, not of consumerism.'
      D: 'Consumerism fights unfair prices, but it cannot make profiteering impossible.'

  45:
    answer: D
    steps:
      - 'This is computer output: hard copy and soft copy.'
      - 'A hard copy is information printed on paper from a computer. A soft copy is the same information held on screen or in electronic storage.'
      - 'You can hold, read and file a hard copy without a computer. A soft copy needs a device to view it.'
      - 'A bank statement printed for a customer at a GTBank branch is a hard copy; the same statement sent to his email is a soft copy.'
      - 'Remember: hard copy is hard paper in your hand.'
      - 'The trap is A, soft copy. That is the electronic version, not the printed one.'
    hint: 'Can you hold it in your hand?'
    why:
      A: 'A soft copy is the electronic version on a screen or disk.'
      B: 'A file copy is a duplicate kept for records, not the name for computer printout.'
      C: 'A scanned copy turns paper into an electronic image, the opposite direction.'

  46:
    answer: C
    steps:
      - 'This is the central processing unit (CPU), the brain of the computer.'
      - 'The CPU is the part of a computer that carries out instructions and processes data.'
      - 'Data goes in through input devices such as the keyboard, is processed in the CPU (in its control unit and arithmetic and logic unit), is kept on storage such as the hard drive, and comes out through output devices such as the monitor.'
      - 'When a cashier at a supermarket in Abuja scans goods, the CPU in the till adds the prices and works out the total.'
      - 'Remember: input, process (CPU), output.'
      - 'The trap is B, the monitor. It only shows the result of processing; it does no processing itself.'
    hint: 'Which part does the processing, rather than input, output or storage?'
    why:
      A: 'The keyboard is an input device; it sends data in but does not process it.'
      B: 'The monitor is an output device that only displays results.'
      D: 'The hard drive stores data and programs; it does not process them.'

  47:
    answer: C
    steps:
      - 'This is the cyber cafe, a business that sells internet access and computer services by the hour.'
      - 'Operating costs are the day-to-day costs of running a business: power, fuel, rent, staff and internet subscription.'
      - 'In Nigeria public power supply was poor, so cafes ran generators on costly diesel or petrol, and also paid high fees for internet bandwidth. These high operating costs ate up profits and closed many cafes.'
      - 'A cafe in Yaba around 2010 might spend much of its takings on diesel for the generator and the monthly bandwidth bill. Today most people browse on smartphones with mobile data, so few cyber cafes remain.'
      - 'Remember: cafe costs come from fuel and bandwidth.'
      - 'The trap is D, copyright violations. Some clients may copy material, but that is not what threatens the cafe''s business.'
    hint: 'What must a cafe keep paying for every day to stay open?'
    why:
      A: 'The number of computer makers does not trouble cafes; more makers mean cheaper machines.'
      B: 'Demand for internet access was high; that was why cafes opened.'
      D: 'Copyright breaches by clients are a minor issue, not the major business problem.'

  48:
    answer: C
    steps:
      - 'This is the modem, a communication device.'
      - 'A modem (modulator-demodulator) converts signals so that a computer can send and receive data over a telephone, cable or wireless network, and so connect to the internet.'
      - 'Without a modem or a similar connection device, a computer cannot reach the internet to download anything. Floppy drives and compact disks only store data already on hand.'
      - 'Around 2010 many Nigerians used USB internet modems from MTN or Glo. Today the same job is often done by a phone''s data connection or a MiFi router.'
      - 'Remember: modem means the computer can talk to the internet.'
      - 'The trap is D, Bluetooth. It links devices close to each other, such as a phone and a headset, but does not connect to the internet.'
    hint: 'Which device connects a computer to the internet?'
    why:
      A: 'A floppy drive reads small storage disks, now out of use; it does not connect to the internet.'
      B: 'A compact disk stores data; it cannot fetch anything from the internet.'
      D: 'Bluetooth links nearby devices, not a computer to the internet.'

  49:
    answer: D
    steps:
      - 'This is the ATM, a tool of electronic banking.'
      - 'ATM stands for Automated Teller Machine, a machine that lets a customer withdraw cash, check his balance and transfer money without a bank teller.'
      - 'The customer inserts a debit card, types a secret PIN, and the machine carries out the transaction at any hour.'
      - 'A First Bank customer in Ibadan can draw cash from an ATM at night or at the weekend, when the branch is closed.'
      - 'Remember: A T M, the Automated Teller Machine does the teller''s job.'
      - 'The trap is A, Authentic Teller Machine. The word is automated, because the machine works by itself.'
    hint: 'The machine works by itself without a human teller. What is that called?'
    why:
      A: 'Authentic means genuine; the A stands for automated.'
      B: 'Account Transfer Machine is not what the letters stand for.'
      C: 'All-purpose Teller Machine is not what the letters stand for.'

  50:
    answer: D
    steps:
      - 'This is social responsibility, the duty of a business to the society around it.'
      - 'Social responsibility means a business gives back to the community where it operates, beyond making profit for itself.'
      - 'It does this by projects that benefit the public, such as health centres, schools, roads, boreholes and scholarships for local students. Benefits for its own staff or executives are welfare, not service to the community.'
      - 'Oil and telecoms companies in Nigeria have built clinics and classrooms in the communities where they operate.'
      - 'Remember: social responsibility serves the community, not just the company.'
      - 'The trap is C, scholarships for staff children. That helps the firm''s own workers, not the wider community.'
    hint: 'Which option benefits the public, not just the firm''s own people?'
    why:
      A: 'Meeting customers is customer relations, which serves the firm''s business.'
      B: 'Houses for executives are a staff benefit, not a service to the community.'
      C: 'Scholarships for staff children help the firm''s own workers, not the wider community.'
