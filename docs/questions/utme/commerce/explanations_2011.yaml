format_version: 1
exam_year: 2011
subject: COM
explanations:
  2:
    answer: C
    steps:
      - 'This is the function of commerce.'
      - 'Commerce is all the activities that help goods and services pass from producers to consumers. Its central job is to make exchange possible.'
      - 'Trade does the buying and selling, and the aids to trade (banking, insurance, transport, communication, warehousing, advertising) remove the problems that stand in the way of that exchange. Every other benefit of commerce comes from this one.'
      - 'A rice farmer in Kebbi and a family in Port Harcourt never meet, yet the rice reaches the family through traders, lorries, banks and shops. That is commerce making exchange possible.'
      - 'Remember: commerce exists so that people can exchange.'
      - 'The trap is D, assisting trade through banking and insurance. That is the work of only two aids to trade, a part of commerce, not its main function.'
    hint: 'What single job do trade and all the aids to trade serve together?'
    why:
      A: 'Better business relationships follow from exchange; they are not the main function.'
      B: 'Profit is a reward to the businessman, not the main function of commerce.'
      D: 'Banking and insurance are only two of the aids to trade, a part of commerce.'

  3:
    answer: D
    steps:
      - 'This is the classification of occupation.'
      - 'An occupation is the work a person does to earn a living. The three main classes are industrial occupation, commercial occupation and services.'
      - 'Industry makes or extracts goods (extractive, manufacturing and constructive). Commerce distributes them (trade and the aids to trade). Services are personal work for others, direct like a doctor or indirect like a policeman.'
      - 'A tin miner in Jos is in industry, a cement dealer in Onitsha is in commerce, and a nurse at a Lagos hospital renders a service.'
      - 'Remember: I C S, industry, commerce, services.'
      - 'The trap is B, manufacturing, industry and services. Manufacturing is only a branch of industry, so it cannot sit beside industry as a separate class.'
    hint: 'Which option has three classes that do not overlap?'
    why:
      A: 'Construction is a branch of industry and trade a branch of commerce; they are not main classes.'
      B: 'Manufacturing is part of industry, so the list repeats itself and leaves out commerce.'
      C: 'Farming, banking and trading are single examples, not the three main classes.'

  4:
    answer: C
    steps:
      - 'This is extractive occupation, a branch of industrial occupation.'
      - 'Extractive occupation takes natural resources from the land, the sea or below the ground: farming, fishing, mining, lumbering and oil drilling.'
      - 'An oil exploration company searches for crude oil and draws it out of the earth. It does not change the oil into new products; it extracts it.'
      - 'Companies drilling for crude in the Niger Delta, such as the wells around Bonny and Escravos, are in extractive occupation.'
      - 'Remember: extract means pull out, so anything pulled from nature is extractive.'
      - 'The trap is D, secondary production. That is the refining of the oil into petrol and kerosene, the next stage after extraction.'
    hint: 'Is the company pulling oil out of nature or changing it into a new product?'
    why:
      A: 'Tertiary production is commerce and services, not taking resources from nature.'
      B: 'Constructive occupation puts up buildings, roads and bridges.'
      D: 'Secondary production turns raw materials into finished goods, as a refinery does.'

  5:
    answer: B
    steps:
      - 'This is indirect services, one of the two kinds of services.'
      - 'Direct services are rendered to one person who pays for them, like a doctor, lawyer or barber. Indirect services are rendered to the public as a whole and are paid for by the government.'
      - 'Civil servants, the police, soldiers and teachers in public schools serve everybody at once, and their salaries come from taxes rather than from each person they serve.'
      - 'A clerk at a Federal ministry in Abuja or a police officer at a checkpoint in Ibadan renders an indirect service to all Nigerians.'
      - 'Remember: indirect services are paid indirectly, through taxes, by the government.'
      - 'The trap is C, professionals. Doctors and lawyers in private practice render direct services to the client who pays them.'
    hint: 'Who is paid by the government to serve everybody at once?'
    why:
      A: 'Traders are in commerce, buying and selling goods; they do not render indirect services.'
      C: 'Professionals such as doctors and lawyers render direct services to individual clients.'
      D: 'Domestic servants serve one household directly, so theirs is a direct service.'

  6:
    answer: C
    steps:
      - 'This is production.'
      - 'Production is the creation of goods and services to satisfy human wants. It is complete only when the goods reach the consumer.'
      - 'It covers every stage: getting raw materials (primary), turning them into goods (secondary), and the commerce and services that bring them to people (tertiary).'
      - 'The cocoa farmer in Ondo, the factory that makes the chocolate drink, and the trader who sells it in a Kano market are all producers.'
      - 'Remember: production means creating anything that satisfies a want.'
      - 'The trap is A, manufacturing. Manufacturing makes goods only, which is just one part of production; services are produced too.'
    hint: 'Which word covers both goods and services, at every stage?'
    why:
      A: 'Manufacturing is only one part of production and makes goods, not services.'
      B: 'Commercialization means running something for profit, not creating goods and services.'
      D: 'Entrepreneurship is the factor that organizes production, not production itself.'

  7:
    answer: B
    steps:
      - 'This is division of labour and its limitations.'
      - 'Division of labour is breaking a job into small tasks, each done by a different worker. It raises output, but it has drawbacks.'
      - 'A worker who does the same small task all day, every day, soon finds the work dull and boring. This monotony lowers interest and can cause careless mistakes. Other limitations are loss of craftsmanship and the risk of unemployment.'
      - 'A worker at a bottling plant in Ikeja who only fixes caps on bottles for eight hours a day feels this monotony.'
      - 'Remember: the same small task again and again means monotony.'
      - 'The trap is C, reduction in output. Division of labour raises output; that is its main advantage.'
    hint: 'How does a worker feel doing one tiny task all day?'
    why:
      A: 'Saving of time is an advantage of division of labour, not a limitation.'
      C: 'Division of labour increases output; it does not reduce it.'
      D: 'Improvement in skill through repetition is an advantage, not a limitation.'

  8:
    answer: D
    steps:
      - 'This is secondary production.'
      - 'Secondary production turns raw materials from the extractive (primary) stage into finished or semi-finished goods. It covers manufacturing and construction.'
      - 'The raw material is taken from nature first, then a factory changes its form so that it can be used. That change of form is secondary production.'
      - 'Limestone dug from Obajana is turned into cement by Dangote''s factory, and crude oil becomes petrol at the Port Harcourt refinery.'
      - 'Remember: primary takes it out, secondary makes it up, tertiary moves it on.'
      - 'The trap is A, primary production. That is the extraction itself, not the change into finished goods.'
    hint: 'What stage comes after taking materials out of nature?'
    why:
      A: 'Primary production is extraction itself, before the materials are transformed.'
      B: 'Tertiary production is commerce and services, which distribute goods.'
      C: 'Direct production is producing for one''s own use, not transforming raw materials.'

  9:
    answer: A
    steps:
      - 'This is the scope of commerce.'
      - 'Commerce has two branches: trade (buying and selling) and aids to trade (the services that make trade easy).'
      - 'In the tree, Commerce splits into Trade and I, so I is aids to trade. Trade splits into II and Foreign, so II is home trade, which in turn splits into retail and wholesale.'
      - 'A trader in Balogun market does trade; the bank that keeps her money, the lorry that brings her stock and the insurer of her shop are aids to trade.'
      - 'Remember: commerce = trade + aids to trade.'
      - 'The trap is C, home trade. Home trade is box II, under trade, not box I beside it.'
    hint: 'What sits beside trade as the second branch of commerce?'
    why:
      B: 'Publicity is a form of promotion, not a branch of commerce.'
      C: 'Home trade is box II, a branch of trade, divided into retail and wholesale.'
      D: 'Advertising is one aid to trade, not the whole branch.'

  10:
    answer: B
    steps:
      - 'This is the wholesaler.'
      - 'A wholesaler buys goods in large quantities from producers and sells them in smaller quantities to retailers.'
      - 'The chain of distribution runs producer, wholesaler, retailer, consumer. The wholesaler sits between the producer and the retailer and links the two.'
      - 'A wholesaler at Idumota buys whole lorry loads of soap from the factory and sells cartons to shop owners from all over Lagos.'
      - 'Remember: producer, wholesaler, retailer, consumer. W comes before R.'
      - 'The trap is A, an agent. An agent acts for a principal for a commission and does not buy the goods; the wholesaler owns the stock he sells.'
    hint: 'Who stands between the producer and the retailer in the chain of distribution?'
    why:
      A: 'An agent acts for a principal on commission and does not own the goods.'
      C: 'An entrepreneur organizes production; the word does not name a link in distribution.'
      D: 'A principal is the person an agent acts for.'

  11:
    answer: D
    steps:
      - 'This is the retailer.'
      - 'A retailer is the last link in the chain of distribution, who buys from the wholesaler and sells to the final consumer.'
      - 'He buys in cartons and sells in single units the customer can afford, such as one tin or one sachet. This is breaking bulk. He also stocks a variety, gives information and may give credit to regular customers.'
      - 'A provision shop in Surulere buys a carton of 48 tins of milk and sells them one tin at a time.'
      - 'Remember: the retailer breaks the carton for the customer.'
      - 'The trap is A, financing production. That is a function of the wholesaler, who may pay producers in advance.'
    hint: 'What does a retailer do with a carton before customers buy?'
    why:
      A: 'Financing production is a function of the wholesaler, not the retailer.'
      B: 'A retailer may give credit to customers, not to his relations.'
      C: 'A retailer does not provide jobs for his customers.'

  12:
    answer: D
    steps:
      - 'This is direct selling by manufacturers.'
      - 'Direct selling means the manufacturer sells to consumers without the wholesaler and the retailer, through its own shops, vans or website.'
      - 'Each middleman adds his own profit to the price. When the manufacturer cuts them out, it keeps that profit for itself, so its profit margin on each unit is larger. That is the main business reason, though it must now bear the costs of storage and delivery.'
      - 'A bakery in Ibadan that sells bread from its own vans at the roadside keeps the margin a distributor would have taken.'
      - 'Remember: cut out the middleman, keep his margin.'
      - 'The trap is A, reduce transportation cost. Selling direct usually raises the manufacturer''s transport cost, because it must now carry goods to many small buyers.'
    hint: 'Where does the middleman''s profit go when the middleman is cut out?'
    why:
      A: 'Selling direct usually raises the maker''s transport cost, since it delivers to many buyers.'
      B: 'Direct selling means dealing with individual consumers, not avoiding them.'
      C: 'Direct selling removes middlemen; it does not encourage them.'

  13:
    answer: B
    steps:
      - 'This is a balance of payments problem, also called a deficit.'
      - 'The balance of payments records all the money a country receives from other countries and all it pays to them. A problem arises when payments out are more than receipts in.'
      - 'When a country imports more than it exports, it pays out more foreign currency than it earns. Its reserves fall and it must borrow or cut imports.'
      - 'When oil prices fall, Nigeria earns fewer dollars from crude exports, but still pays for imported rice, cars and machines, so a deficit opens.'
      - 'Remember: more going out than coming in means trouble.'
      - 'The trap is C, a devalued currency. Devaluation is a remedy used to cure a deficit by making exports cheaper and imports dearer; it is not the cause.'
    hint: 'Which way must the money flow for a country to run short of foreign currency?'
    why:
      A: 'Exports above imports bring in more than goes out, which is a surplus.'
      C: 'Devaluation is a remedy for a deficit, not the cause of one.'
      D: 'Invisible exports earn money too, so more of them does not cause a deficit.'

  14:
    answer: A
    steps:
      - 'These are the components of the balance of payments.'
      - 'The balance of payments has three accounts: the current account, the capital account and the monetary movement account.'
      - 'The current account records visible trade (goods) and invisible trade (services such as shipping, insurance and tourism). The capital account records investment and loans in and out. The monetary movement account shows how the overall balance is settled, through changes in reserves.'
      - 'Nigeria''s crude oil exports go in the current account, a foreign company building a factory in Ogun goes in the capital account, and a fall in the CBN''s reserves shows in the monetary movement account.'
      - 'Remember: current, capital, monetary movement.'
      - 'The trap is C. Sales and profit and loss accounts belong to a single firm''s books, not to a country.'
    hint: 'Which option has only national accounts, not a firm''s books?'
    why:
      B: 'A business record is a firm''s document, not part of a country''s balance of payments.'
      C: 'Sales and profit and loss accounts are a firm''s accounts.'
      D: 'A sales ledger is a firm''s book of account.'

  15:
    answer: D
    steps:
      - 'This is a negotiable instrument.'
      - 'A negotiable instrument is a written document promising or ordering payment of money, which can be passed from one person to another by delivery, or by endorsement and delivery.'
      - 'The holder signs on the back (endorses it) and hands it over, and the new holder can claim the money. Cheques, bills of exchange and promissory notes are all negotiable instruments.'
      - 'A trader in Aba endorses a customer''s First Bank cheque and gives it to his supplier, who then cashes it.'
      - 'Remember: negotiable means it can be passed on and still paid.'
      - 'The trap is B, credit note. A credit note only tells a buyer that his account has been reduced; it cannot be passed on for payment.'
    hint: 'What general name covers cheques and bills of exchange?'
    why:
      A: 'A delivery note goes with goods to list them; it carries no promise to pay.'
      B: 'A credit note reduces what a buyer owes; it is not passed on for payment.'
      C: 'Documentary evidence is a general term for proof, not a transferable payment document.'

  16:
    answer: B
    steps:
      - 'This is the mate''s receipt.'
      - 'A mate''s receipt is issued by the ship''s mate (an officer) when the goods are loaded on board, showing that the ship has received them.'
      - 'The exporter takes the mate''s receipt to the shipping company and exchanges it for the bill of lading, which is the document of title to the goods.'
      - 'A cocoa exporter loading bags at Apapa port gets a mate''s receipt and swaps it at the shipping office for the bill of lading.'
      - 'Remember: the mate receives, then the company issues the bill.'
      - 'The trap is A, freight note. A freight note is the shipping company''s bill for the cost of carriage, not the receipt swapped for the bill of lading.'
    hint: 'What does the ship''s officer give the exporter when the goods are loaded?'
    why:
      A: 'A freight note is the bill for the cost of shipping.'
      C: 'An export invoice is the exporter''s bill to the foreign buyer.'
      D: 'A ship report is the captain''s report to customs on arrival.'

  17:
    answer: B
    steps:
      - 'This is a franco price.'
      - 'A franco (or "free") price includes every cost of delivery up to the buyer''s premises: freight, insurance, duties and handling.'
      - 'The seller pays all these costs and adds them to the price, so the buyer pays one sum and the goods arrive at his warehouse.'
      - 'A Kano importer quoted a franco price for machines pays nothing more once the machines reach his warehouse.'
      - 'Remember: franco means free to your door.'
      - 'The trap is C, Free on Board. FOB covers costs only until the goods are loaded on the ship; the buyer pays freight and insurance after that.'
    hint: 'Which term carries the goods all the way to the buyer''s warehouse?'
    why:
      A: 'Free Alongside Ship covers costs only until the goods are beside the ship.'
      C: 'Free on Board covers costs only until the goods are loaded on the ship.'
      D: 'Free on Rail covers costs only until the goods are loaded on the train.'

  18:
    answer: A
    steps:
      - 'This is cash with order (CWO).'
      - 'Under cash with order, the buyer sends the payment together with the order, before the goods are delivered.'
      - 'Sellers use it with new customers whose credit is unknown, and for mail orders. The seller bears no risk of bad debt.'
      - 'A customer who pays by bank transfer at the same time as placing an online order for a phone is buying on cash with order.'
      - 'Remember: CWO, the cash goes with the order.'
      - 'The trap is B, payment on delivery. That is cash on delivery (COD), where the money is paid when the goods arrive.'
    hint: 'What do the letters CWO stand for?'
    why:
      B: 'Payment on delivery is cash on delivery (COD), not cash with order.'
      C: 'Payment within a few days is a short credit term.'
      D: 'Cash paid on the spot is spot cash, at the moment of sale.'

  19:
    answer: B
    steps:
      - 'This is television as a medium of advertising.'
      - 'An advertising medium is the channel that carries the message. Television carries sound, sight and movement together.'
      - 'Because viewers see the product in use and hear about it, television is the most effective medium. But it is limited: airtime is costly, many homes have no set, and power cuts stop people watching.'
      - 'A noodles advert on NTA or Channels shows children eating the product, which persuades strongly, but villagers without electricity never see it.'
      - 'Remember: TV gives the strongest message with the shortest reach.'
      - 'The trap is D, radio. Radio reaches more Nigerians, even on batteries, so it is not limited in reach; but it has sound only.'
    hint: 'Which medium has both sight and sound but needs power and money?'
    why:
      A: 'A billboard is seen only by people passing that spot and carries a short message.'
      C: 'A newspaper reaches only those who can read and buy it, and has no sound or movement.'
      D: 'Radio reaches widely, even on batteries, but carries sound only, so it is less effective.'

  20:
    answer: A
    steps:
      - 'This is a stale cheque.'
      - 'A cheque is valid for six months from the date written on it. After that it becomes stale and the bank will not pay it.'
      - 'If the cheque is presented within six months, the bank honours it as long as there is money in the account. After six months the drawer must write a fresh cheque.'
      - 'A cheque dated 2 January must be paid in at the bank before 2 July, or it becomes stale.'
      - 'Remember: six months, then stale.'
      - 'The trap is D, after six months. That is exactly when the cheque becomes stale and is refused.'
    hint: 'How long is a cheque valid before it goes stale?'
    why:
      B: 'After nine months the cheque has long been stale.'
      C: 'Between six and nine months the cheque is already stale.'
      D: 'After six months the cheque is stale and is refused.'

  21:
    answer: C
    steps:
      - 'This is the income of a commercial bank.'
      - 'A commercial bank earns most of its income as interest: the difference between the interest it charges borrowers and the lower interest it pays depositors.'
      - 'The bank takes in deposits, lends them out as loans and overdrafts, and charges interest on them. Loans and overdrafts are the services; interest is the income they bring. Commissions and charges add a smaller amount.'
      - 'GTBank may pay a saver 4 per cent a year and lend the same money to a trader at 20 per cent; the gap is its main earning.'
      - 'Remember: banks sell money, and the price of money is interest.'
      - 'The trap is A, loans. A loan is money the bank gives out; the income is the interest charged on it.'
    hint: 'What does the bank charge for the money it lends?'
    why:
      A: 'A loan is money paid out by the bank; the income is the interest on it.'
      B: 'Deposits are customers'' money the bank must repay, not income.'
      D: 'An overdraft is a kind of lending; the income is the interest charged on it.'

  22:
    answer: C
    steps:
      - 'This is communication as an aid to trade.'
      - 'Communication is the passing of messages and information from one person or place to another, by telephone, post, e-mail, text message and the internet.'
      - 'Before goods move, buyer and seller must agree on what is wanted, the price and delivery. Communication lets them send enquiries, quotations and orders without travelling to meet.'
      - 'A trader in Onitsha calls or sends a WhatsApp message to a supplier in Aba to order shoes and agree a price, then the goods are sent.'
      - 'Remember: communication moves messages, transport moves goods.'
      - 'The trap is D, transportation. Transport moves the goods and people themselves, not the information about orders and prices.'
    hint: 'Which aid to trade carries messages rather than goods?'
    why:
      A: 'Tourism is travel for leisure; it does not carry trade information.'
      B: 'Banking keeps money and makes payments; it does not carry orders and prices.'
      D: 'Transportation moves goods and people, not messages.'

  23:
    answer: D
    steps:
      - 'This is the rule that an insurance policy covers only the risk insured against.'
      - 'An insurance contract states the risk covered. The insurer pays only when the loss comes from that risk, which is the proximate (nearest) cause of the loss.'
      - 'Mr. Lawal paid premiums for burglary cover. The loss came from fire, a risk he never insured, so the insurer owes him nothing and he bears the loss himself.'
      - 'A shop owner at Alaba market who wants cover for both theft and fire must take a policy that names both risks.'
      - 'Remember: no premium for the risk, no payment for the loss.'
      - 'The trap is A, the insurer bears the loss. The insurer is bound only for the risk named in the policy, which was burglary.'
    hint: 'Which risk did Mr. Lawal pay premiums for, and what caused the loss?'
    why:
      A: 'The insurer pays only for the risk insured, which was burglary, not fire.'
      B: 'There is no rule that splits an uninsured loss in half.'
      C: 'An insurer does not owe any payment for a risk outside the policy.'

  24:
    answer: A
    steps:
      - 'This is reinsurance.'
      - 'Reinsurance is when an insurance company insures part of a big risk it has accepted with another insurance company.'
      - 'If one insurer took the whole risk of a large ship or factory, a single loss could ruin it. It keeps part of the risk and passes the rest to other insurers, who share the premium and any loss.'
      - 'A Nigerian insurer covering a ₦50 billion refinery passes part of the risk to reinsurers such as Nigerian Reinsurance Corporation and Continental Reinsurance.'
      - 'Remember: reinsurance is insurance for insurers.'
      - 'The trap is C, underwriting. Underwriting is accepting a risk in return for a premium; it is not the sharing of risk among insurers.'
    hint: 'What do insurers call insuring a risk again with another insurer?'
    why:
      B: 'Life insurance covers a person''s life; it is not an arrangement among insurers.'
      C: 'Underwriting is accepting a risk for a premium, not spreading it among insurers.'
      D: 'Marine insurance covers ships and cargo at sea; it is a class of insurance, not risk sharing.'

  25:
    answer: C
    steps:
      - 'This is inbound tourism.'
      - 'Inbound tourism is travel into a country by people who do not live there.'
      - 'Tourism has three forms: domestic (residents travelling within their own country), outbound (residents travelling abroad) and inbound (non-residents visiting the country). Inbound tourists bring in foreign currency.'
      - 'A visitor from Ghana who comes to see the Calabar Carnival or the Olumo Rock is an inbound tourist to Nigeria.'
      - 'Remember: inbound means coming in from outside.'
      - 'The trap is D, residents travelling within their country. That is domestic tourism.'
    hint: 'Who is coming in, and from where?'
    why:
      A: 'Non-residents travelling to other countries are not visiting this country at all.'
      B: 'Residents travelling abroad is outbound tourism.'
      D: 'Residents travelling within their own country is domestic tourism.'

  26:
    answer: A
    steps:
      - 'This is pipeline transportation and its disadvantages.'
      - 'A pipeline carries liquids and gases, such as crude oil, petrol, gas and water, through pipes over long distances.'
      - 'Once built it moves large volumes cheaply and steadily, but laying the pipes, pumps and stations costs a great deal of money at the start. It also carries only liquids and gases, cannot change route and can be vandalized.'
      - 'The pipelines that carry petroleum products from the refineries to depots across Nigeria cost billions of naira to lay.'
      - 'Remember: dear to build, cheap to run.'
      - 'The trap is D, high maintenance cost. Pipelines are cheap to run and maintain once laid; it is the building that is dear.'
    hint: 'Is a pipeline expensive to build or expensive to run?'
    why:
      B: 'Pipelines carry large volumes continuously, so their capacity is high.'
      C: 'Pipelines run underground or in all weather; climate hardly affects them.'
      D: 'Pipelines are cheap to run and maintain once they are built.'

  27:
    answer: B
    steps:
      - 'This is the sole proprietorship.'
      - 'A sole proprietorship is a business owned and controlled by one person, who takes all the profit and bears all the risk.'
      - 'The owner both manages the daily work and controls the business, so decisions are quick and there is no gap between owners and managers. In a company the shareholders own it but directors and managers run it.'
      - 'A woman who owns a provision shop in Ibadan decides alone what to buy, what to charge and when to open.'
      - 'Remember: one owner, one boss, one decision.'
      - 'The trap is C, a public limited company. There ownership by thousands of shareholders is separated from management by the directors.'
    hint: 'In which business is the owner also the manager?'
    why:
      A: 'In a private company, directors and managers may differ from the owners.'
      C: 'In a public company, ownership by shareholders is separate from management.'
      D: 'A co-operative society is run by an elected committee for many members.'

  28:
    answer: D
    steps:
      - 'This is a consortium.'
      - 'A consortium is a temporary association of two or more firms to carry out a project too big for any one of them.'
      - 'Each firm keeps its own identity and contributes money, staff or skills. When the project is finished, the consortium ends.'
      - 'Several construction and engineering firms may join as a consortium to build a large bridge, such as a new bridge across the Niger.'
      - 'Remember: a consortium comes together for one big job, then splits.'
      - 'The trap is C, a merger. In a merger the firms join permanently into one firm.'
    hint: 'Which combination is formed only for one large project?'
    why:
      A: 'An amalgamation forms a new firm from two or more, permanently.'
      B: 'A cartel is an agreement to fix prices or output, not to carry out a project.'
      C: 'A merger joins firms permanently into one firm.'

  29:
    answer: B
    steps:
      - 'This is a creditors'' voluntary liquidation.'
      - 'Liquidation (winding up) ends a company. A voluntary liquidation is started by the company itself, not by the court. When the company cannot pay its debts in full, it is a creditors'' voluntary liquidation.'
      - 'Because the creditors stand to lose money, they meet and appoint the liquidator, who sells the assets and pays the creditors as far as the money goes. In a members'' voluntary liquidation, where all debts can be paid, the shareholders appoint him instead.'
      - 'If a Lagos trading company owes its suppliers more than it can pay, the suppliers, as creditors, choose the liquidator.'
      - 'Remember: whose money is at risk, they choose.'
      - 'The trap is D, the court. The court appoints a liquidator in a compulsory winding up, not a voluntary one.'
    hint: 'In this kind of winding up, whose money is most at risk?'
    why:
      A: 'Directors do not appoint the liquidator; their powers end at liquidation.'
      C: 'Promoters form a company; they play no part in winding it up.'
      D: 'The court appoints the liquidator only in a compulsory liquidation.'

  30:
    answer: B
    steps:
      - 'This is a mortgage.'
      - 'A mortgage is a loan secured by pledging a specific asset, usually land or a building, to the lender.'
      - 'The borrower keeps using the property, but if he fails to repay, the lender can sell it to recover the money. When the loan is repaid, the pledge ends.'
      - 'A hotel owner in Enugu pledges the title deeds of his building to a bank to borrow money for expansion.'
      - 'Remember: mortgage means a loan with a named property behind it.'
      - 'The trap is D, loan. An ordinary loan may be unsecured; the word does not tell us that a specific asset is pledged.'
    hint: 'Which borrowing is always tied to a named property?'
    why:
      A: 'A bond is a long-term security sold to investors, not a pledge of one named asset.'
      C: 'A debenture is a company''s long-term borrowing from the public, usually secured on its assets in general.'
      D: 'A loan may be unsecured; it does not by itself mean a specific asset is pledged.'

  31:
    answer: A
    steps:
      - 'This is a trade association.'
      - 'A trade association is a body formed by businesses (owners or employers) in the same line of trade to protect and promote their common interests.'
      - 'It speaks to government for its members, sets standards, shares information and settles disputes. It is different from a trade union, which is formed by workers to fight for their pay and conditions.'
      - 'NARTO, the Nigerian Association of Road Transport Owners, brings together the owners of haulage businesses. The drivers they employ belong to unions such as the NURTW.'
      - 'Remember: association of owners, union of workers.'
