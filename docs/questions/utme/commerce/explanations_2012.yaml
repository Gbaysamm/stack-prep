format_version: 1
exam_year: 2012
subject: COM
explanations:
  2:
    answer: B
    steps:
      - 'This is a function of commerce, looked at from the government''s side.'
      - 'Commerce is all the activities of trade and aids to trade that bring goods from producers to consumers.'
      - 'Every sale, import and business gives government a share as revenue: company income tax, value added tax, import and excise duties, and licence fees. Government uses that revenue to build roads, schools and hospitals, which is growth and development.'
      - 'When an importer clears goods at Apapa, the customs duty paid goes to government, and VAT is charged on goods sold in Shoprite or a Balogun shop.'
      - 'Remember: trade pays tax, and tax builds the country.'
      - 'The trap is A, improve the standard of living. That is a benefit of commerce to consumers, not a benefit to government itself.'
    hint: 'What does government collect every time goods are traded?'
    why:
      A: 'A higher standard of living is a benefit to the people who buy the goods, not to government.'
      C: 'Commerce links private buyers and sellers; it is not about co-operation among public bodies.'
      D: 'Sociocultural values come from society and culture, not from the revenue commerce gives government.'

  3:
    answer: B
    steps:
      - 'This is the construction industry, one branch of industrial occupation.'
      - 'Industrial occupation has three branches: extractive (taking things from nature), manufacturing (turning raw materials into goods) and construction (putting up buildings, roads, bridges and dams).'
      - 'A bricklayer lays blocks to build walls, so his work puts up structures. That is construction.'
      - 'The bricklayers and masons building houses in Lekki or a new estate in Abuja are in the construction industry.'
      - 'Remember: if it stays where it is built, it is construction.'
      - 'The trap is C, car assembling. Putting parts together into a finished car is manufacturing, as at the Innoson plant in Nnewi.'
    hint: 'Which of these jobs puts up a building that stays where it is made?'
    why:
      A: 'A blacksmith turns metal into tools, which is manufacturing.'
      C: 'Assembling cars turns parts into a finished good, which is manufacturing.'
      D: 'A shoemaker turns leather into shoes, which is manufacturing.'

  4:
    answer: C
    steps:
      - 'These are the factors of production and their rewards.'
      - 'There are four factors: land earns rent, labour earns wages and salaries, capital earns interest, and the entrepreneur earns profit.'
      - 'Remuneration means pay for work done, that is wages and salaries. A worker gives more effort when the pay is good, so labour is the factor that pay motivates.'
      - 'A factory worker in Ikeja works overtime when the overtime pay is attractive.'
      - 'Remember: labour works for wages; remuneration means wages.'
      - 'The trap is B, entrepreneur. The entrepreneur is a person, but his reward is profit, which is what is left after everyone else is paid, not a fixed remuneration.'
    hint: 'Which factor is paid wages and salaries?'
    why:
      A: 'Capital is a man-made thing; it earns interest and cannot be motivated.'
      B: 'The entrepreneur is rewarded with profit, a leftover, not with remuneration.'
      D: 'Land is a gift of nature; it earns rent and cannot be motivated.'

  5:
    answer: C
    steps:
      - 'This is division of labour.'
      - 'Division of labour is breaking a production process into separate tasks and giving each task to the worker with the skill for it.'
      - 'Each worker repeats one task, so he becomes quick and skilled at it, time is saved, and output rises.'
      - 'In a Lagos bakery, one worker mixes the dough, another shapes the loaves, another runs the oven and another packs the bread.'
      - 'Remember: divide the work, multiply the output.'
      - 'The trap is D, delegation of responsibility. That is a manager passing authority for a job to a junior, not splitting a production process into tasks.'
    hint: 'What is it called when each worker does only one part of the job?'
    why:
      A: 'Production technique is the method used, such as labour-intensive or capital-intensive.'
      B: 'A production function is the link between inputs and output.'
      D: 'Delegation is a manager handing authority to a subordinate, a management idea.'

  6:
    answer: B
    steps:
      - 'This is the vending machine, a modern form of retailing.'
      - 'A vending machine is an automatic retail machine that takes money from the buyer and gives out the goods without a shop attendant.'
      - 'The buyer puts in coins, notes or a card, presses a button for the item, and the machine releases it.'
      - 'Vending machines for soft drinks and snacks are found in some Lagos offices, airports and hospitals.'
      - 'Remember: vend means sell, so a vending machine is a selling machine.'
      - 'The trap is A, an automated teller machine. An ATM gives out cash from a bank account; it does not sell goods.'
    hint: 'Which machine takes your money and gives you a drink?'
    why:
      A: 'An ATM pays out cash to bank customers; it does not sell goods.'
      C: 'A counting machine counts notes or items; it does not sell anything.'
      D: 'A branding machine marks names on products; it does not sell them.'

  7:
    answer: A
    steps:
      - 'This is branding, part of the product element of the marketing mix.'
      - 'Branding is giving a product a name, symbol or design that marks it out from rival products.'
      - 'The brand gives the product its own identity, so buyers can recognise it and ask for it by name again and again.'
      - 'People ask for Indomie, Peak milk or Golden Penny by name; the brand tells them apart from other noodles, milk and semovita.'
      - 'Remember: a brand is a product''s name tag.'
      - 'The trap is D, increase sales volume. Branding may help sales, but that is a result; its main purpose is to give the product an identity.'
    hint: 'What does a brand name let a buyer do in a shop full of similar goods?'
    why:
      B: 'Attractive looks come from packaging and design; that is not the main purpose of branding.'
      C: 'Product awareness is the work of advertising.'
      D: 'More sales may follow, but that is an effect, not the main purpose.'

  8:
    answer: D
    steps:
      - 'This is the principle of comparative advantage, the basis of foreign trade.'
      - 'Comparative advantage says a country should specialise in the goods it can produce at a lower opportunity cost than others, and trade for the rest.'
      - 'Even if one country is better at making everything, both countries gain when each produces what it is relatively best at and they exchange.'
      - 'Nigeria exports crude oil and cocoa, which it produces cheaply, and imports machines that other countries make more cheaply.'
      - 'Remember: do what you do best, compared with the rest.'
      - 'The trap is A, absolute advantage. It explains trade only when each country is better at something outright; comparative advantage explains all trade.'
    hint: 'Which principle says both countries gain even when one is better at everything?'
    why:
      A: 'Absolute advantage covers only the case where each country is outright better at one good.'
      B: 'Globalization is the growing link between economies, not the principle on which trade rests.'
      C: 'Deregulation is removing government controls, a policy, not the basis of trade.'

  9:
    answer: D
    steps:
      - 'These are the problems of international (foreign) trade.'
      - 'Foreign trade is trade between countries. Its problems include different currencies, distance, language and culture, and trade restrictions.'
      - 'The problem every foreign deal meets is currency. The buyer must change his naira into the seller''s currency, such as dollars or pounds, and the rate can change before payment is made.'
      - 'A Nigerian importer of machines from China must buy dollars or yuan at the bank or bureau de change before he can pay his supplier.'
      - 'Remember: home trade uses one money; foreign trade must change money.'
      - 'The trap is A, distance. Distance also exists within a country, and transport handles it; the problem peculiar to foreign trade is the difference in currency.'
    hint: 'What must a Nigerian importer change before he can pay a supplier abroad?'
    why:
      A: 'Distance also exists in home trade and is overcome by transport.'
      B: 'Culture differs even within Nigeria; it is a smaller problem than currency.'
      C: 'Politics affects some trade deals, but not every one as currency does.'

  10:
    answer: D
    steps:
      - 'This is the delivery note, a document in the purchase and sale of goods.'
      - 'A delivery note is a list of the goods sent, which goes with the goods to the buyer.'
      - 'The driver hands it over with the goods. The buyer checks the goods against it, signs a copy, and the signed copy goes back to the seller as proof of delivery.'
      - 'A Kano wholesaler sends cartons of noodles to a retailer in Jos by lorry; the retailer signs the delivery note when the cartons arrive.'
      - 'Remember: the delivery note travels with the goods.'
      - 'The trap is C, an advice note. The advice note is sent ahead to tell the buyer that goods are on the way; it does not go with them.'
    hint: 'Which document does the driver ask the buyer to sign?'
    why:
      A: 'A bill of lading is used for goods carried by sea.'
      B: 'An invoice is the bill asking the buyer to pay; it does not prove delivery.'
      C: 'An advice note is sent ahead to say the goods are coming; it does not go with them.'

  11:
    answer: B
    steps:
      - 'This is the indent, a document in import trade.'
      - 'An indent is an order sent by an importer, usually through an agent called an indent house, giving the details of the goods he wants to buy from abroad.'
      - 'It states the goods, quantity, quality and price. An open indent leaves the agent to choose the maker; a closed indent names the maker.'
      - 'A Lagos dealer in generators sends an indent to an agent to buy two hundred generators of a stated model from a maker in China.'
      - 'Remember: an indent is an importer''s order.'
      - 'The trap is C, a bill of lading. It is a shipping document for goods already sent by sea, not an order.'
    hint: 'What does an importer send to say what goods he wants?'
    why:
      A: 'A freight note is the shipping company''s bill for carrying the goods.'
      C: 'A bill of lading is a shipping document and title to goods already sent.'
      D: 'A waybill lists goods carried by road, rail or air; it is not an order.'

  12:
    answer: A
    steps:
      - 'This is a cash discount term, one of the terms of trade on an invoice.'
      - 'A cash discount term is written as the discount per cent over the days within which it applies, then "net" and the full credit period.'
      - 'Here the discount is 3% if the buyer pays within 9 days, so the first part is 3/9. If he pays later, he pays the full (net) price within 30 days, so it reads 3/9, net 30.'
      - 'An Onitsha wholesaler who prints "3/9, net 30" on an invoice for ₦100,000 accepts ₦97,000 if paid within nine days, and ₦100,000 by day thirty.'
      - 'Remember: per cent first, then days, then net.'
      - 'The trap is D, 9/30, net 3. It puts the days first and the per cent last, which turns the term inside out.'
    hint: 'Which comes first in the term, the per cent or the days?'
    why:
      B: 'It writes 9/27, which is neither the 3% nor the nine days in the right order.'
      C: 'It puts the credit period first and the discount last, in the wrong order.'
      D: 'It puts the days before the per cent, and gives a net period of 3 days.'

  13:
    answer: B
    steps:
      - 'This is the bearer cheque, one kind of cheque.'
      - 'A bearer cheque is made payable to "bearer", so the bank pays whoever presents it at the counter.'
      - 'The drawer writes the payee''s name followed by "or bearer", or leaves the word "bearer" standing. Anyone holding the cheque can cash it, which is convenient but risky if it is lost.'
      - 'A trader in Aba gives his shop boy a bearer cheque to collect cash from the bank counter for him.'
      - 'Remember: the bearer is the one who bears (carries) the cheque.'
      - 'The trap is D, payable only into the payee''s account. That describes a crossed "account payee" cheque, the opposite of a bearer cheque.'
    hint: 'What does the word "bearer" mean?'
    why:
      A: 'Transverse lines make a cheque crossed, so it must go through a bank account.'
      C: 'A cheque dated for a later day is a post-dated cheque.'
      D: 'Payment only into the payee''s account describes an account payee crossed cheque.'

  14:
    answer: C
    steps:
      - 'This is discounting a bill of exchange.'
      - 'A bill of exchange is an order to pay a stated sum on a future date. Discounting means selling it to a bank before that date for less than its face value.'
      - 'The holder gets cash now. The bank keeps the difference, the discount, as its reward for waiting until the bill is due.'
      - 'An exporter holding a ₦500,000 bill due in three months can discount it at First Bank today and receive, say, ₦480,000.'
      - 'Remember: cash early costs a discount.'
      - 'The trap is A, accepted. A bill is accepted when the drawee signs it, agreeing to pay; that happens before any discounting.'
    hint: 'What do you call getting less than face value in exchange for getting cash early?'
    why:
      A: 'Accepting is the drawee signing the bill to agree to pay it.'
      B: 'A rejected bill is one refused, not one cashed early.'
      D: 'A bill is dishonoured when it is not paid on its due date.'

  15:
    answer: D
    steps:
      - 'This is competitive advertising, one type of advertising.'
      - 'Competitive advertising tries to persuade buyers that one brand is better than rival brands of the same product.'
      - 'Branded goods, such as soaps, drinks and noodles, have many close rivals, so the maker must keep showing why his brand is the one to buy.'
      - 'Adverts for Peak milk against Three Crowns, or for one telephone network against another, are competitive advertising.'
      - 'Remember: brand against brand is competitive advertising.'
      - 'The trap is C, informative advertising. It tells people about a new product or service; branded goods already known need persuasion against rivals.'
    hint: 'Branded goods face many rival brands. Which advertising fights those rivals?'
    why:
      A: 'Mass advertising only means reaching a large audience; it is not a type aimed at brands.'
      B: 'Institutional advertising builds the image of a whole firm, not one brand.'
      C: 'Informative advertising introduces new products and gives facts about them.'

  16:
    answer: C
    steps:
      - 'This is commission on turnover (COT), the charge on a current account.'
      - 'Commission on turnover is the fee a bank charges a current account holder on the money that passes through the account.'
      - 'A current account earns no interest, but the bank offers cheque books and pays cheques. It covers this cost by charging a small commission on the amount withdrawn.'
      - 'A trader with a GTBank current account in 2012 saw COT deducted on his withdrawals each month. The Central Bank of Nigeria later phased COT out, and banks now charge an account maintenance fee instead.'
      - 'Remember: current account, commission on turnover.'
      - 'The trap is B, interest rates. A current account holder neither pays nor earns interest on his deposits; he pays commission.'
    hint: 'What does the bank charge on the money passing through a current account?'
    why:
      A: 'Dividends are paid to shareholders out of profit, not by a customer to the bank.'
      B: 'Interest is paid on loans or earned on savings, not charged for running a current account.'
      D: 'The minimum lending rate is the central bank''s base rate for loans, not a fee on an account.'

  17:
    answer: A
    steps:
      - 'This is the telegram, an older postal means of communication.'
      - 'A telegram is a short written message sent by wire (telegraph) from one post office to another, then printed on a form and delivered by hand to the receiver.'
      - 'The sender writes the message at the post office and pays by the word. The receiving post office prints it and a messenger delivers it the same day.'
      - 'In the past, Nigerians sent telegrams through the post office for urgent news, such as a death in the family. Telegrams are no longer in everyday use; SMS and email do that job now.'
      - 'Remember: telegram, post office to post office, then by hand.'
      - 'The trap is C, telex. A telex is typed on a teleprinter and printed out directly on the receiver''s own machine, not handed over by the post office.'
    hint: 'Which message goes through the post office and is delivered by a messenger?'
    why:
      B: 'An SMS is a text message sent from one mobile phone to another.'
      C: 'A telex prints straight out on the receiver''s own teleprinter.'
      D: 'An MMS is a mobile phone message with pictures or sound.'

  18:
    answer: B
    steps:
      - 'This is the importance of communication to business.'
      - 'Communication is passing messages and information from one person to another.'
      - 'With a telephone call, email or letter, a trader can order goods, check prices and settle deals without travelling, so he saves transport costs and avoids the risks of the road.'
      - 'A shop owner in Ibadan phones his supplier in Lagos to order goods instead of making the journey, and the goods are sent to him.'
      - 'Remember: call, do not travel.'
      - 'The trap is D, enhances delivery of goods and services. Moving the goods themselves is the work of transport, not communication.'
    hint: 'What does a phone call save a trader who would otherwise travel?'
    why:
      A: 'Communication helps business but does not by itself create wealth.'
      C: 'Goods still have to be carried; communication cannot replace transport.'
      D: 'Delivering goods is the work of transport.'

  19:
    answer: D
    steps:
      - 'This is subrogation, a principle of insurance.'
      - 'Subrogation means that once the insurer has paid the insured for a loss, it takes over the insured''s right to recover from the third party who caused the loss.'
      - 'The insured cannot be paid twice, once by the insurer and again by the person at fault. So the insurer pays first and then stands in the insured''s place to claim from that person.'
      - 'If a danfo hits Ade''s insured car and his insurer pays for the repairs, the insurer can then claim the cost from the danfo owner or the danfo''s insurer.'
      - 'Remember: subrogation, substitution; the insurer substitutes for the insured.'
      - 'The trap is C, contribution. Contribution shares a loss among several insurers of the same property; it is not about claiming from a third party.'
    hint: 'Which principle lets the insurer step into the insured''s shoes?'
    why:
      A: 'Proximate cause is about finding the main cause of a loss.'
      B: 'Insurable interest means the insured must lose money if the loss happens.'
      C: 'Contribution shares a loss among two or more insurers of the same risk.'

  20:
    answer: D
    steps:
      - 'This is the difference between assurance and insurance.'
      - 'Assurance covers an event that is certain to happen, such as death, though the time is not known. Insurance covers a risk that may or may not happen, such as fire or theft.'
      - 'Because the event is certain, an assurance policy is sure to pay out one day, either at death or when the policy matures. An insurance policy pays only if the loss happens.'
      - 'A father in Enugu takes life assurance so his family is paid when he dies; he insures his shop against fire, which may never happen.'
      - 'Remember: assurance, sure to happen.'
      - 'The trap is B, possibility. An event that is only possible is what insurance covers, not assurance.'
    hint: 'Is death a possible event or a certain one?'
    why:
      A: 'Probability, the likelihood of a loss, is the basis of insurance.'
      B: 'A possible event is what insurance covers.'
      C: 'Risk, a loss that may happen, is the basis of insurance.'

  21:
    answer: C
    steps:
      - 'These are the parties to a life assurance policy.'
      - 'The assurer is the company that gives the cover; the assured is the person who takes out the policy and pays the premiums.'
      - 'The assured pays premiums to the assurer. On death or at maturity, the assurer pays the sum assured, which may go to a beneficiary named by the assured.'
      - 'When Mr Okafor takes out life assurance with an insurance company in Lagos and pays monthly premiums, Mr Okafor is the assured.'
      - 'Remember: the assurer gives the cover, the assured takes it out.'
      - 'The trap is B, assurer. The word ending in "-er" is the company that gives the cover, not the person who buys it.'
    hint: 'Which word names the buyer of the policy, not the company?'
    why:
      A: 'The insurer is the company that gives cover.'
      B: 'The assurer is the company that gives life assurance.'
      D: 'The beneficiary receives the money, but need not be the one who took out the policy.'

  22:
    answer: A
    steps:
      - 'This is tourism and its importance.'
      - 'Tourism is travelling to places away from home for leisure, culture, business or study, and the services that look after such travellers.'
      - 'When people visit other places and countries, they meet other cultures, learn their ways and make friends. This builds understanding and peaceful relations between peoples, and the visitors also bring in money and jobs.'
      - 'Visitors from Ghana and Europe who come to the Calabar Carnival or the Osun-Osogbo festival learn about Nigerian culture and take good stories home.'
      - 'Remember: tourists carry culture both ways.'
      - 'The trap is C, granting citizenship to foreign visitors. Tourists come and go home; citizenship is a matter for immigration law, not tourism.'
    hint: 'What do visitors and their hosts learn about each other?'
    why:
      B: 'Tourists return home; leaving a country for good is emigration, not tourism.'
      C: 'Granting citizenship (naturalization) is a legal process, not a purpose of tourism.'
      D: 'Tourism brings foreign exchange in; it does not discourage it.'

  23:
    answer: C
    steps:
      - 'These are airmail letters, one of the postal services.'
      - 'Airmail letters are letters sent to other countries by aeroplane, so they arrive in days rather than the weeks taken by sea.'
      - 'The sender pays a higher airmail postage and the letter is marked "By Air Mail" so the post office sends it on a flight.'
      - 'A student in Ibadan posting a letter to a relative in London sends it by airmail through NIPOST. Today email and courier firms carry much of this work.'
      - 'Remember: air for abroad, inland for at home.'
      - 'The trap is D, express letters. Express service is about special fast delivery by a messenger on arrival; it does not by itself mean sent abroad by air.'
    hint: 'What are letters sent abroad by plane called?'
    why:
      A: 'Inland letters are sent within the country.'
      B: 'Registered letters are recorded and insured, for valuable contents.'
      D: 'Express letters are delivered quickly by special messenger on arrival.'

  24:
    answer: D
    steps:
      - 'This is the co-operative society, a form of business unit.'
      - 'A co-operative is a business owned and run by its members, who pool their resources for mutual help rather than mainly for profit.'
      - 'It works on self-help: what one member has, such as money, skill or land, makes up for what another lacks, so all members are stronger together. Each member has one vote however many shares he holds.'
      - 'A co-operative of cocoa farmers in Ondo pools money to buy fertilizer and a lorry that no single farmer could afford alone.'
      - 'Remember: co-operative, "each for all and all for each".'
      - 'The trap is A, a joint venture. A joint venture is two or more firms coming together for a particular project and profit, not members helping one another.'
    hint: 'Which business unit is built on members helping one another?'
    why:
      A: 'A joint venture joins firms for a particular project and profit, not for mutual help.'
      B: 'Partners pool capital to make profit, not to help one another as a society.'
      C: 'A nominal partner only lends his name to a firm and takes no part in it.'

  25:
    answer: C
    steps:
      - 'This is the marketing concept, which shapes the main objective of a business.'
      - 'The marketing concept says a business succeeds by finding out what consumers want and satisfying them better than its rivals.'
      - 'Satisfied customers come back and tell others, so sales and profit follow. Quality products, investment and a niche are all ways of reaching that main aim.'
      - 'A bukka in Yaba that cooks the food its customers like, at a price they can pay, keeps a queue every lunch time.'
      - 'Remember: the customer is king.'
      - 'The trap is B, provide quality products. Quality is one way to satisfy customers; the objective it serves is customer satisfaction.'
    hint: 'Which aim do quality, investment and a niche all serve?'
    why:
      A: 'Investment is a means of growing the business, not its main objective.'
      B: 'Quality products are one way of satisfying consumers, not the objective itself.'
      D: 'Carving a niche is a strategy for reaching some consumers, not the main objective.'

  26:
    answer: D
    steps:
      - 'This is the order of payment when a company is liquidated (wound up).'
      - 'In liquidation the assets are sold and the cash is paid out in a fixed order: creditors first, then shareholders.'
      - 'Debenture holders have lent money to the company, so they are creditors and are paid first, usually out of the assets that secure their loan. Preference shareholders come next, and ordinary shareholders last.'
      - 'If a quoted company in Lagos is wound up, the banks and debenture holders it owes are paid before any shareholder gets a kobo.'
      - 'Remember: lenders first, owners last.'
      - 'The trap is B, preference shareholders. They come before ordinary shareholders, but they are still owners, so they wait until the creditors are paid.'
    hint: 'Are debenture holders owners of the company or lenders to it?'
    why:
      A: 'Ordinary shareholders are paid last of all.'
      B: 'Preference shareholders are owners and are paid after the creditors.'
      C: 'Cumulative preference shareholders are still owners and are paid after the creditors.'

  27:
    answer: A
    steps:
      - 'These are the features of limited liability companies.'
      - 'A limited liability company, public or private, is a separate legal person from its owners.'
      - 'Because the company is a legal person in its own right, it can own property, enter contracts, sue and be sued in its own name. This is true of both kinds of company.'
      - 'Dangote Cement Plc, a public company, and a small private company such as a Lagos bakery Ltd can each go to court in their own names.'
      - 'Remember: a company is a person in law.'
      - 'The trap is C, the transfer of shares is not restricted. That is true only of public companies; a private company restricts the transfer of its shares.'
    hint: 'What does being a separate legal person allow every company to do?'
    why:
      B: 'Neither needs five members; the Companies and Allied Matters Act set two as the minimum, and since 2020 one person can form a private company.'
      C: 'Only a public company''s shares are freely transferable; a private company restricts them.'
      D: 'Only a public company must publish its accounts for the public.'

  28:
    answer: B
    steps:
      - 'These are sources of long-term finance.'
      - 'Long-term finance is money a business can use for many years, to buy land, buildings and machines.'
      - 'By selling shares, a company raises capital that it never has to repay; the shareholders become owners and share in the profit.'
      - 'Dangote Cement raised capital by selling its shares to the public on the Nigerian Stock Exchange.'
      - 'Remember: shares last as long as the company does.'
      - 'The trap is A, bank overdraft. An overdraft is short-term credit on a current account, repayable on demand.'
    hint: 'Which source of finance never has to be paid back?'
    why:
      A: 'An overdraft is short-term and repayable on demand.'
      C: 'Credit purchases are short-term trade credit, usually for weeks or months.'
      D: 'A bureau de change buys and sells foreign currency; it does not finance businesses.'

  29:
    answer: B
    steps:
      - 'This is issued capital, one type of share capital.'
      - 'Issued capital is the part of the authorized capital that the company actually offers to the public for subscription.'
      - 'Authorized capital is the most the company may raise. It issues some of it now and keeps the rest for later. Of the issued part, called-up capital is what has been asked for, and paid-up capital is what has been paid.'
      - 'A company in Lagos authorized to raise ₦50 million may issue only ₦30 million worth of shares to the public now.'
      - 'Remember: authorized, then issued, then called up, then paid up.'
      - 'The trap is C, paid-up capital. That is only the part of the issued capital that shareholders have already paid for.'
    hint: 'Which capital is offered to the public to buy?'
    why:
      A: 'Called-up capital is the part of issued capital the company has asked shareholders to pay.'
      C: 'Paid-up capital is the part actually paid by shareholders.'
      D: 'Reserve capital is the part of uncalled capital kept to be called only on winding up.'

  30:
    answer: D
    steps:
      - 'This is the split of authorized capital into issued and unissued capital.'
      - 'Authorized capital is the most a company may issue. Whatever part of it has not been offered to the public is unissued capital.'
      - 'Authorized 40 million shares minus 32 million issued leaves 40 − 32 = 8 million shares that have not been issued. The company may issue them later.'
      - 'A Lagos company allowed to issue 40 million ₦1 shares has sold 32 million; the other 8 million wait for a later share offer.'
      - 'Remember: not offered means not issued.'
      - 'The trap is A, issued but not paid-up. The stem says all 32 million issued shares are fully paid, so the 8 million were never issued at all.'
    hint: 'Were the 8 million shares ever offered to the public?'
    why:
      A: 'All issued shares are fully paid, so the 8 million were never issued.'
      B: 'Nothing in the stem says anyone applied for them.'
      C: 'Only issued shares can be called up, and these were never issued.'

  31:
    answer: B
    steps:
      - 'This is the rate of turnover (rate of stock turn).'
      - 'Rate of turnover is the number of times the average stock is sold in a period: $\text{Rate of turnover} = \dfrac{\text{Cost of goods sold}}{\text{Average stock}}$.'
