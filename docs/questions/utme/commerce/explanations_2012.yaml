      - 'A provision store in Onitsha that keeps about ₦49,600 of goods on its shelves and sells through that stock four times a year has a turnover of ₦198,400.'
      - 'Remember: turnover = rate × average stock.'
      - 'The trap is D, ₦99,200. That is only 2 × ₦49,600, as if the stock were sold twice instead of four times.'
    hint: 'Multiply the average stock by the number of times it was sold.'
