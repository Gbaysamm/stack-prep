format_version: 1
exam_year: 2013
subject: COM
explanations:
  2:
    answer: A
    steps:
      - 'This is unskilled labour, one of the grades of labour as a factor of production.'
      - 'Unskilled labour is work that needs little or no training or education and depends mainly on physical strength and effort.'
      - 'Labour is graded by the training it needs: skilled labour (trained experts), semi-skilled labour (some training) and unskilled labour (mostly muscle). The less training a job needs, the more it depends on bodily effort.'
      - 'The labourers who carry bags of cement and mix concrete on a building site in Abuja, or the porters who carry loads in Balogun market, are unskilled labour.'
      - 'Remember: unskilled labour uses the hands and back more than the head.'
      - 'The trap is B, skilled labour. A skilled worker such as an electrician also uses his hands, but what marks his labour is the training and know-how behind it, not the physical effort.'
    hint: 'Which grade of labour needs the least training and relies on strength?'
    why:
      B: 'Skilled labour is marked by training and expertise, not by physical effort.'
      C: 'Professional labour, such as a doctor''s or a lawyer''s, relies on long study and mental effort.'
      D: 'A white-collar job is office work that relies on mental effort.'

  3:
    answer: C
    steps:
      - 'This is construction, one branch of secondary production.'
      - 'Construction is the assembling of manufactured products, such as cement, iron rods, roofing sheets and pipes, into usable forms such as houses, roads and bridges.'
      - 'Secondary production has two main branches. Manufacturing turns raw materials into finished goods; construction takes those finished goods and puts them together, on site, into a structure people can use.'
      - 'When Julius Berger builds a bridge, it does not make the cement or steel; it assembles them into the bridge. That is construction.'
      - 'Remember: manufacturing makes the parts, construction puts the parts together.'
      - 'The trap is B, manufacturing. Manufacturing changes raw materials into new goods, as Dangote turns limestone into cement; it does not assemble finished products on site.'
    hint: 'Which branch of secondary production puts already-made materials together into a building or road?'
    why:
      A: '"Creation" is not a branch of production; every branch of production creates utility.'
      B: 'Manufacturing changes raw materials into finished goods; it does not assemble them into usable structures.'
      D: '"Formation" is not a recognised type of production.'

  4:
    answer: C
    steps:
      - 'This is the chain of distribution, the route goods take from the producer to the user.'
      - 'The chain runs producer, wholesaler, retailer, consumer. The consumer is the final link, because the goods are used up there and travel no further.'
      - 'Each link passes the goods on, except the last. The wholesaler sells to retailers, the retailer sells to consumers, and the consumer buys to use, not to sell again. That is why production is only complete when the goods reach the consumer.'
      - 'A carton of Indomie noodles leaves the factory, goes to a wholesaler in Onitsha, then to a kiosk in Enugu, and is finally cooked by a student. The student, the consumer, is the last link.'
      - 'Remember: the chain ends where the goods are eaten, worn or used.'
      - 'The trap is A, middlemen. Wholesalers and retailers are middlemen, and they sit in the middle of the chain, not at its end.'
    hint: 'Who buys the goods to use them, not to sell them again?'
    why:
      A: 'Middlemen stand between the producer and the consumer, in the middle of the chain.'
      B: 'The wholesaler is the second link, buying from the producer.'
      D: 'The producer is the first link, where the chain begins.'

  5:
    answer: D
    steps:
      - 'This is the balance of trade, part of a country''s foreign trade record.'
      - 'The balance of trade is the difference between the value of a country''s visible exports and its visible imports. It is unfavourable (a deficit) when visible imports are greater than visible exports.'
      - 'Visible items are physical goods that can be seen and recorded at the ports. If a country spends more buying goods from abroad than it earns selling goods abroad, its balance of trade is in deficit.'
      - 'If in a year Nigeria imports cars, rice and machines worth more than all the crude oil, cocoa and sesame it exports, it has an unfavourable balance of trade.'
      - 'Remember: more visible goods coming in than going out is unfavourable.'
      - 'The trap is B. Visible exports greater than visible imports is a favourable balance of trade, the opposite case.'
    hint: 'Is the deficit when goods coming in are worth more, or less, than goods going out?'
    why:
      A: 'Exports greater than imports is a favourable position, not an unfavourable one.'
      B: 'Visible exports greater than visible imports is a favourable balance of trade.'
      C: 'Equal imports and exports means the balance of trade is in balance.'

  6:
    answer: C
    steps:
      - 'This is the balance of trade.'
      - 'The balance of trade shows a country''s trading position in goods: the value of its visible exports set against the value of its visible imports over a period, usually a year.'
      - 'If exports are greater, the position is favourable (a surplus); if imports are greater, it is unfavourable (a deficit). So one figure tells you how the country stands in its trade in goods with the rest of the world.'
      - 'When the National Bureau of Statistics reports that Nigeria''s exports of crude oil and other goods were worth more than its imports in a quarter, it is reporting a trade surplus, Nigeria''s trading position.'
      - 'Remember: position means balance, exports set against imports.'
      - 'The trap is D, terms of trade. The terms of trade compare export prices with import prices; they say how much a unit of exports buys, not the overall position.'
    hint: 'Which record sets the value of visible exports against visible imports?'
    why:
      A: 'A desire to trade with many countries is an attitude, not a measure of trading position.'
      B: 'Granting credit to foreigners is a trade practice, not a measure of the trading position.'
      D: 'The terms of trade compare export prices with import prices, not the total value of trade.'

  7:
    answer: C
    steps:
      - 'This is the Customs and Excise authority, in Nigeria the Nigeria Customs Service.'
      - 'Its main role is to control the flow of goods into and out of the country: it collects import and export duties and excise duties, and it stops prohibited goods and smuggling.'
      - 'Every container that lands at a port is examined and its duty assessed before it is released; goods leaving the country are also checked. That is how the government controls what crosses the border.'
      - 'An importer clearing goods at Apapa must pay duty to the Nigeria Customs Service, and customs officers at Seme border seize smuggled rice.'
      - 'Remember: customs guard the gates of the country for goods.'
      - 'The trap is B, security at the port. Customs officers are uniformed, but general port security is the work of the police and port authority; customs control the goods.'
    hint: 'What do customs officers check and charge duty on at the ports and borders?'
    why:
      A: 'Roads and railways are provided by the government''s transport ministries, not by customs.'
      B: 'General security at the ports is the job of the police and the ports authority, not customs.'
      D: 'Dockyards for ship repairs are provided by the ports authority and private firms, not customs.'

  8:
    answer: C
    steps:
      - 'This is the ship''s manifest.'
      - 'A ship''s manifest is a list of all the cargo on board a ship, with its marks, the shippers and the consignees. The master must lodge it with the customs before the ship is cleared to leave the port.'
      - 'Customs compare the manifest with the export entries for each consignment. Only when they agree is the ship given clearance outward, so it may sail.'
      - 'Before a vessel carrying cocoa leaves Apapa port for Rotterdam, its master lodges the manifest listing every bag of cocoa on board with the Nigeria Customs Service.'
      - 'Remember: the manifest makes the cargo manifest (plain) to customs.'
      - 'The trap is A, shipping note. A shipping note goes with the goods to the dock company so they are received for loading; it is not the document that clears the ship.'
    hint: 'Which document lists all the cargo a ship is carrying?'
    why:
      A: 'A shipping note goes to the dock company with the goods for loading, not to customs to clear the ship.'
      B: 'A ship''s report is made to customs when a ship arrives, not before it leaves.'
      D: 'A dock warrant is a receipt for goods stored in a dock warehouse.'

  9:
    answer: A
    steps:
      - 'This is the consular invoice, a document of foreign trade.'
      - 'A consular invoice is an invoice signed (endorsed) by the consul of the importing country who is stationed in the exporting country, before the goods are shipped.'
      - 'The consul checks the stated value and origin of the goods, so the importing country''s customs can charge the right duty and no false prices are declared.'
      - 'A Nigerian firm shipping sesame seeds to the United States would take its invoice to the American consulate in Lagos for endorsement before shipment.'
      - 'Remember: consular invoice, signed by the consul.'
      - 'The trap is B, certificate of origin. It states where the goods were made and is usually issued by a chamber of commerce in the exporting country, not endorsed by the importing country''s consul.'
    hint: 'Which document carries the name of the official who signs it?'
    why:
      B: 'A certificate of origin is issued by a chamber of commerce in the exporting country.'
      C: 'A bill of lading is signed by the shipping company as a receipt for the goods.'
      D: 'A closed indent is an order to a commission agent, telling him which maker to buy from.'

  10:
    answer: C
    steps:
      - 'These are the terms of trade.'
      - 'The terms of trade are the ratio of a country''s export prices to its import prices: $\text{Terms of trade} = \dfrac{\text{Index of export prices}}{\text{Index of import prices}} \times 100$.'
      - 'If the ratio rises, each unit of exports pays for more imports, so the terms of trade improve (become favourable). If it falls, they worsen.'
      - 'If the price of crude oil rises while the price of imported machines stays the same, Nigeria can buy more machines with each barrel. Its terms of trade improve.'
      - 'Remember: export prices up against import prices means terms up.'
      - 'The trap is A. A falling ratio means exports buy fewer imports, so the terms of trade worsen.'
    hint: 'If export prices rise faster than import prices, does each export buy more or fewer imports?'
    why:
      A: 'A falling ratio means the terms of trade worsen.'
      B: 'A constant ratio means the terms of trade are unchanged.'
      D: 'A ratio of one only says export and import price indices are equal; it says nothing about improvement.'

  11:
    answer: B
    steps:
      - 'This is print media advertising.'
      - 'Print media advertising uses newspapers, magazines, posters, handbills and journals. The message is written, so only people who can read can understand it.'
      - 'Radio, television and cinema carry the message in sound and pictures, so they reach people who cannot read as well. Print reaches only the literate.'
      - 'An advertisement for a bank account in The Punch or The Guardian newspaper reaches only those who can read it.'
      - 'Remember: print needs reading, so print is for the literate.'
      - 'The trap is C, television. Television shows words on screen, but its pictures and sound carry the message to people who cannot read.'
    hint: 'Which medium must be read to be understood?'
    why:
      A: 'Radio speaks to listeners, so people who cannot read can follow it.'
      C: 'Television uses sound and moving pictures, which reach people who cannot read.'
      D: 'Cinema uses sound and pictures, which do not need reading.'

  12:
    answer: B
    steps:
      - 'These are the two main forms of communication, verbal and non-verbal.'
      - 'Verbal communication uses words, spoken or written. Non-verbal communication uses no words: signs, gestures, pictures, colours, facial expressions and signals.'
      - 'Every message falls into one of the two. A letter, a phone call or a meeting uses words, so it is verbal. A traffic light, a nod or a company logo passes its message without words, so it is non-verbal.'
      - 'A market woman in Oshodi who calls out her prices is using verbal communication; the conductor of a danfo who waves to say there is space is using non-verbal communication.'
      - 'Remember: with words, verbal; without words, non-verbal.'
      - 'The trap is C, e-mail and fax. These are means (channels) of sending messages, not the forms that all communication falls into.'
    hint: 'Does the message use words or not?'
    why:
      A: 'Letters and the telephone are means of sending messages, not the main forms of communication.'
      C: 'E-mail and fax are modern means of communication, not its main forms.'
      D: 'Traditional and modern media are channels for messages, not the two forms of communication.'

  13:
    answer: D
    steps:
      - 'This is a courier service.'
      - 'A courier service is a private company that collects documents and parcels and delivers them by hand, quickly, to the person named, with a receipt and tracking.'
      - 'The courier picks up the item from the sender, moves it by the fastest route and has the receiver sign for it. The sender can track it all the way, so it is both fast and reliable.'
      - 'A Lagos firm sending signed contracts to a client in Kano the next day uses DHL or a Nigerian courier company, not the ordinary post.'
      - 'Remember: urgent and important, send it by courier.'
      - 'The trap is C, registered letters. Registered post is safe and recorded, but it moves at the speed of ordinary mail, so it is not the best for urgent documents.'
    hint: 'Which service delivers by hand, quickly, with tracking?'
    why:
      A: 'A postal order is a way of sending money by post, not a means of conveying documents.'
      B: 'Ordinary letters are cheap but slow, and they are not tracked or signed for.'
      C: 'Registered letters are recorded and safe, but too slow for urgent documents.'

  14:
    answer: B
    steps:
      - 'This is fidelity guarantee.'
      - 'Fidelity guarantee is an undertaking that assures an employer of the honesty (integrity) of a person, usually an employee, and covers the employer against loss if that person steals or commits fraud.'
      - 'The employer insures against the dishonesty of staff who handle money or goods. If a cashier steals, the insurer pays the employer for the loss.'
      - 'A bank in Lagos takes fidelity guarantee cover on its cashiers, so if one runs away with ₦2 million, the bank is paid back.'
      - 'Remember: fidelity means faithfulness, so fidelity guarantee guarantees a faithful, honest person.'
      - 'The trap is D, insurable interest. Insurable interest is the financial stake the insured must have in the thing insured; it is not a promise about anyone''s honesty.'
    hint: 'Which term comes from a word meaning faithfulness?'
    why:
      A: 'Proximate cause is the main, direct cause of a loss.'
      C: 'Subrogation is the insurer''s right to step into the insured''s place after paying a claim.'
      D: 'Insurable interest is the insured''s financial stake in what is insured.'

  15:
    answer: B
    steps:
      - 'This is the average clause in fire insurance, which deals with under-insurance.'
      - 'When property is insured for less than its actual value, the insured is treated as his own insurer for the uninsured part and receives only a share of the loss: $\text{Compensation} = \dfrac{\text{Sum insured}}{\text{Actual value}} \times \text{Actual loss}$.'
      - 'For Mr N: sum insured ₦25,000, actual value ₦100,000, loss ₦30,000. Compensation $= \dfrac{25{,}000}{100{,}000} \times 30{,}000 = \dfrac{1}{4} \times 30{,}000 = 7{,}500$, so ₦7,500. Check: he insured a quarter of the value, so he gets a quarter of the loss.'
      - 'A shop owner in Onitsha whose ₦100,000 stock is insured for only ₦25,000 is paid a quarter of any fire loss.'
      - 'Remember: insure a part, get paid a part.'
      - 'The trap is A, ₦5,000, which is the loss minus the sum insured. The average clause pays a share of the loss, the sum insured over the actual value, not the gap between two figures.'
    hint: 'What fraction of his property''s value did Mr N insure?'
    why:
      A: '₦5,000 is the loss minus the sum insured (₦30,000 − ₦25,000), not a share of the loss.'
      C: '₦70,000 is the uninsured part of the value (₦100,000 − ₦30,000), not his compensation.'
      D: '₦75,000 is the uninsured value (₦100,000 − ₦25,000), not his compensation.'

  16:
    answer: C
    steps:
      - 'This is uberrimae fidei, the principle of utmost good faith.'
      - 'Utmost good faith means both parties to an insurance contract must tell the whole truth and disclose every material fact, such as the true value of the property, when the contract is made.'
      - 'The insurer fixes the premium and the risk from what the proposal form says. If Mr P overstates the value of his property, he has given false information, so the insurer may refuse his claim or cancel the policy.'
      - 'A trader in Aba who claims on his proposal form that his ₦150,000 shop is worth ₦400,000 has broken utmost good faith.'
      - 'Remember: uberrimae fidei, tell the truth, the whole truth.'
      - 'The trap is A, indemnity. Indemnity is about how much is paid after a loss; the false statement on the proposal form breaks the duty of truthfulness, which is utmost good faith.'
    hint: 'Which principle requires full and true disclosure when the policy is taken?'
    why:
      A: 'Indemnity concerns paying back the actual loss after it happens, not truthful disclosure.'
      B: 'Mr P owns the property, so he has insurable interest; that principle is not broken.'
      D: 'Subrogation is the insurer''s right after paying a claim, not a duty of the insured.'

  17:
    answer: D
    steps:
      - 'This is non-indemnity insurance, such as life assurance and personal accident insurance.'
      - 'Indemnity insurance restores the insured to the position he was in before the loss. Non-indemnity insurance cannot do that, because a life or a limb has no money value; it pays an agreed sum as a consolation.'
      - 'When a car is damaged, the insurer pays the cost of repair (indemnity). When a person dies or loses an arm, no money can restore him, so the policy pays the fixed sum agreed at the start.'
      - 'If a Lagos civil servant with a ₦5 million life policy dies, his family receives the ₦5 million as consolation, not as the value of his life.'
      - 'Remember: property can be replaced (indemnity); a life can only be consoled for (non-indemnity).'
      - 'The trap is C. Compensation equal to the exact loss is indemnity itself, the kind non-indemnity insurance cannot give.'
    hint: 'Can money put back a lost life or limb exactly as before?'
    why:
      A: 'Cover for exporters is a kind of marine or credit insurance, not what marks non-indemnity insurance.'
      B: 'Cover for importers is a kind of marine insurance, not what marks non-indemnity insurance.'
      C: 'Paying the exact loss is indemnity, the opposite of non-indemnity insurance.'

  18:
    answer: D
    steps:
      - 'This is warehousing, an aid to trade.'
      - 'A warehouse stores goods until they are needed, and while they are there it is also used to prepare them for sale: breaking bulk, grading, blending, branding and repackaging.'
      - 'Goods arrive in bulk, such as large sacks or drums. In the warehouse they are broken down and repacked into smaller packs that retailers and consumers can buy.'
      - 'Rice imported in 50 kg bags is repackaged in a Kano warehouse into 5 kg and 10 kg bags for retailers.'
      - 'Remember: a warehouse stores, sorts and repacks.'
      - 'The trap is B, transportation. Transport moves goods to the warehouse and away from it; the warehouse holds and prepares them, it does not move them.'
    hint: 'Which of these is actually done to goods inside a warehouse?'
    why:
      A: 'Advertising is done through the media, not in a warehouse.'
      B: 'Transport moves goods; a warehouse holds them still.'
      C: 'Consumption happens when the final user uses the goods, after they leave the warehouse.'

  19:
    answer: D
    steps:
      - 'This is ploughing back profit, a source of owned (internal) capital.'
      - 'A sole trader''s owned capital is the money he himself has in the business. He increases it by putting in more of his own money or by keeping profits in the business instead of drawing them out.'
      - 'Each year the profit belongs to the owner. If he takes less of it out for personal use, the part he leaves in adds to his capital. A loan or credit raises the funds used, but it is borrowed, and owed to someone else.'
      - 'A provision seller in Ibadan who makes ₦300,000 profit and takes out only ₦100,000 adds ₦200,000 to her own capital.'
      - 'Remember: draw less, own more.'
      - 'The trap is A, a bank loan. A loan adds to the money in the business, but it is borrowed capital that must be repaid, not capital owned.'
    hint: 'Which choice adds the owner''s own money, not borrowed money?'
    why:
      A: 'A bank loan is borrowed capital, owed to the bank.'
      B: 'A sole trader cannot issue debentures; only companies do, and debentures are loans too.'
      C: 'Buying on credit creates a debt to the supplier, not owned capital.'

  20:
    answer: D
    steps:
      - 'This is the dormant (sleeping) partner.'
      - 'A dormant partner contributes capital and shares in the profits and losses, but takes no part in the management of the firm.'
      - 'The active partners run the business day to day. The dormant partner simply invests, so the firm gets money without another person in the management.'
      - 'A retired civil servant in Enugu who puts ₦2 million into her nephew''s pharmacy partnership but never comes to the shop is a dormant partner.'
      - 'Remember: a dormant partner is asleep at work but awake at sharing profit.'
      - 'The trap is B, nominal partner. A nominal partner lends only his name and reputation; he does not usually provide capital.'
    hint: 'Which partner puts in money but sleeps through the management?'
    why:
      A: 'A general partner takes part in management and has unlimited liability.'
      B: 'A nominal partner lends his name, not capital.'
      C: 'A secret partner takes part in running the firm but is not known to the public as a partner.'

  21:
    answer: B
    steps:
      - 'This is the Memorandum of Association, the document that sets out a company''s relationship with the outside world.'
      - 'Its clauses are the name clause, the registered office clause, the object clause, the liability clause, the capital clause and the association clause. The rights of shareholders are not among them.'
      - 'The internal rules of the company, such as shareholders'' voting rights, the transfer of shares and the conduct of meetings, are in the Articles of Association.'
      - 'When a company is registered with the Corporate Affairs Commission in Abuja, its memorandum states its name, office and objects; its articles state how its members'' rights work.'
      - 'Remember: the memorandum faces outside, the articles govern inside.'
      - 'The trap is C, the object clause. It is one of the main clauses of the memorandum, because it says what the company may do.'
    hint: 'Which item is an internal rule of the company?'
    why:
      A: 'The name clause is a compulsory clause of the memorandum.'
      C: 'The object clause states what the company is formed to do, and it is in the memorandum.'
      D: 'The registered office is stated in the memorandum.'

  22:
    answer: A
    steps:
      - 'This is issued share capital, one of the kinds of company capital.'
      - 'Authorized (nominal or registered) capital is the most a company is allowed to raise by its memorandum. Issued capital is the part of it actually offered to and taken up (subscribed) by shareholders.'
      - 'A company need not issue all its authorized capital at once. It issues some shares now and keeps the rest to issue later. Only the shares people have subscribed for count as issued capital.'
      - 'If a company in Lagos is authorized to raise ₦50 million but sells shares worth ₦30 million to investors, its issued capital is ₦30 million.'
      - 'Remember: authorized is the ceiling, issued is what shareholders actually took.'
      - 'The trap is B, authorized share capital. That is the whole limit set in the memorandum, including shares no one has yet subscribed for.'
    hint: 'Is the whole limit the same as the part shareholders have bought?'
    why:
      B: 'Authorized capital is the maximum the company may raise, not the part subscribed.'
      C: 'Owner''s equity is total assets minus liabilities, which includes reserves and profits.'
      D: 'Working capital is current assets minus current liabilities.'

  23:
    answer: C
    steps:
      - 'This is the rate of turnover (rate of stock turn), the number of times a firm sells its average stock in a year.'
      - 'The formula is $\text{Rate of turnover} = \dfrac{\text{Cost of goods sold}}{\text{Average stock}}$, so the turnover (cost of goods sold) $= \text{Rate of turnover} \times \text{Average stock}$.'
      - 'Data: rate of turnover = 5 times, average stock = ₦12,500, turnover = ? Working: $5 \times 12{,}500 = 62{,}500$, so the turnover is ₦62,500. Check: $62{,}500 \div 12{,}500 = 5$ times.'
      - 'A shop in Balogun market that keeps about ₦12,500 of stock on its shelves and sells it out five times in the year has turned over goods costing ₦62,500.'
      - 'Remember: rate times average stock gives turnover.'
      - 'The trap is D, ₦65,000. It comes from a slip in multiplying; five times ₦12,500 is exactly ₦62,500.'
    hint: 'Turn the formula round: turnover = rate × average stock.'
    why:
      A: '₦24,000 does not come from 5 × ₦12,500.'
      B: '₦46,500 does not come from 5 × ₦12,500.'
      D: '₦65,000 is a slip in multiplying; 5 × ₦12,500 = ₦62,500.'

  24:
    answer: B
    steps:
      - 'This is the discipline of members by a professional association, here the Nigerian Bar Association for lawyers.'
      - 'A professional association sets a code of conduct for its members and punishes those who break it, so that the public can trust the profession.'
      - 'If a lawyer who cheats his client were left to practise, people would lose faith in all lawyers. Removing him from practice shows the public that the profession will not protect dishonest members.'
      - 'Like the Medical and Dental Council for doctors, the legal profession in Nigeria can stop a fraudulent lawyer from practising, to keep the public''s trust.'
      - 'Remember: one bad lawyer is removed to keep the good name of all.'
      - 'The trap is C, compensating the client. Disrobing punishes the lawyer; it does not pay the client, who must sue the lawyer for his money.'
    hint: 'Whose good name does the association guard when it punishes a dishonest member?'
    why:
      A: 'The aim is the reputation of the whole profession, not shielding other lawyers.'
      C: 'Disrobing does not pay the client anything; he must recover his loss in court.'
      D: 'The client''s claim is against the lawyer, and disrobing does not stop him from suing.'

  25:
    answer: D
    steps:
      - 'This is consumer protection, here the Telecom Consumer Parliament held by the Nigerian Communications Commission (NCC).'
      - 'The NCC regulates the telecommunications industry. Its consumer parliament is a public meeting where subscribers raise complaints and the network operators must answer them.'
      - 'Callers complain about dropped calls, unasked-for charges and poor service. The operators answer in public and the NCC directs them to put things right, so subscribers are protected.'
      - 'At such a parliament, subscribers of MTN, Glo, Airtel and 9mobile can complain about airtime deducted for services they did not ask for.'
      - 'Remember: the consumer parliament is a forum for the consumer.'
      - 'The trap is A, increasing the profit of service providers. The parliament puts the operators on the spot about their service; protecting their profit is not its purpose.'
    hint: 'Whose complaints are heard at the parliament?'
    why:
      A: 'The parliament holds operators to account; it is not organised to raise their profit.'
      B: 'It protects subscribers, not the government''s interest.'
      C: 'Bringing new firms into the industry is done through licensing, not the consumer parliament.'

  26:
    answer: D
    steps:
      - 'This is the trade fair, organised in Nigeria by the Chambers of Commerce.'
      - 'A Chamber of Commerce is an association of businessmen in a city or state that promotes trade and industry. Organising trade fairs is one of its main functions.'
      - 'At a trade fair, producers display their goods, meet buyers and agents from home and abroad and sign orders. The chamber rents out stands and runs the fair.'
      - 'The Lagos International Trade Fair is organised by the Lagos Chamber of Commerce and Industry, and the Kaduna International Trade Fair by the Kaduna chamber.'
      - 'Remember: chamber, fair; the businessmen''s club runs the show.'
      - 'The trap is A, the Federal Government. Government supports trade fairs and may open them, but the chambers organise them.'
    hint: 'Which body of businessmen runs the Lagos International Trade Fair?'
    why:
      A: 'The Federal Government supports and opens fairs but does not organise them.'
      B: 'The Manufacturers Association of Nigeria takes part in fairs but does not organise the major ones.'
      C: 'The ministry regulates trade policy; it does not usually run the trade fairs.'

  27:
    answer: A
    steps:
      - 'This is legal tender, the legal backing of money.'
      - 'Money is generally accepted because the law declares it legal tender: it must be accepted in payment of debts within the country.'
      - 'A naira note is only paper, but the law that makes it legal tender gives everyone confidence that others will accept it, so it passes freely from hand to hand.'
      - 'The Central Bank of Nigeria Act makes naira notes and coins issued by the CBN legal tender in Nigeria, so a trader in Kano must accept them.'
      - 'Remember: money is accepted because the law says so.'
      - 'The trap is D, the Governor''s signature. The signature shows the note was issued by the CBN, but it is the law of legal tender that makes it acceptable.'
    hint: 'What makes everyone bound to accept the naira in payment?'
    why:
      B: 'The rule of law is a general principle of government, not the reason money is accepted.'
      C: 'The naira is not widely accepted in the global market, yet it is accepted at home.'
      D: 'The signature marks the issuer; the law of legal tender is what gives acceptance.'

  28:
    answer: B
    steps:
      - 'This is scarcity, one of the qualities of good money.'
      - 'The qualities of good money include acceptability, portability, durability, divisibility, homogeneity, stability of value, recognisability and relative scarcity.'
      - 'Money must be relatively scarce. If anyone could make or find it freely, there would be too much of it, prices would rise and it would lose its value.'
      - 'If the naira were printed without limit, a bag of rice would cost more and more naira, as happens in high inflation; controlled supply keeps it valuable.'
      - 'Remember: plenty of money, little value; scarce money keeps its worth.'
      - 'The trap is D, convertibility. It describes whether a currency can be changed into other currencies, not one of the qualities of good money.'
    hint: 'What happens to the value of money if it becomes as common as sand?'
    why:
      A: 'Money must be durable, so perishability is the opposite of a quality of money.'
      C: 'Money must be divisible into small units; indivisibility is a defect.'
      D: 'Convertibility describes exchanging one currency for another, not a listed quality of money.'

  29:
    answer: A
    steps:
      - 'This is money as a measure of value (a unit of account), one of the functions of money.'
      - 'As a measure of value, money gives every good and service a price in the same unit, so their values can be compared.'
      - 'Without money, a trader would have to say a goat is worth so many bags of rice and so many yams. With money, each has one price in naira, and comparing them is easy.'
      - 'In Onitsha market a bag of rice priced at ₦60,000 and a goat at ₦90,000 can be compared at a glance: the goat is worth one and a half bags of rice.'
      - 'Remember: price tags in naira show money measuring value.'
      - 'The trap is C, means of settlement. Money settles a debt when it is paid over; here nothing is paid yet, the goods are only being priced.'
    hint: 'Is the trader paying, or only stating prices?'
    why:
      B: 'A standard of deferred payment is money used to settle debts in the future.'
      C: 'A means of settlement is money paid over to clear a debt, not used to price goods.'
      D: 'Money is not mainly a durable asset for business; pricing goods is a function, not an asset.'

  30:
    answer: C
    steps:
      - 'These are gilt-edged securities.'
      - 'Gilt-edged securities are government securities, such as government bonds and development stocks. They are called gilt-edged because they are as safe as gold: the government is sure to pay the interest and repay the loan.'
      - 'The government borrows from the public by selling these securities, pays a fixed interest and repays at maturity. Because the risk is very low, the interest is usually lower than on company shares.'
      - 'Federal Government of Nigeria bonds sold through the Debt Management Office are gilt-edged securities.'
      - 'Remember: gilt means gold, and the government is the safest borrower.'
      - 'The trap is D, multinational companies. Companies issue shares and debentures, but these carry more risk than government securities.'
    hint: 'Which borrower is the safest of all?'
    why:
      A: 'Individuals do not issue securities on the stock exchange.'
      B: 'Non-governmental organisations do not issue gilt-edged securities.'
      D: 'Companies issue shares and debentures, which are not gilt-edged.'

  31:
    answer: C
    steps:
      - 'This is planning, the first function of management.'
      - 'Planning means deciding in advance what is to be done, how, when and by whom. It sets the goals of the firm.'
      - 'The functions of management follow in order: planning, organising, staffing, directing, coordinating and controlling. Every other function works to carry out the plan, so planning must come first.'
      - 'Before a manager opens a new branch of a supermarket in Port Harcourt, she first plans the budget, staff and opening date; only then does she organise and direct.'
      - 'Remember: plan first, then do.'
      - 'The trap is B, coordinating. Coordinating keeps the departments working together on a plan, so it comes after planning.'
    hint: 'What must a manager do before any other function can begin?'
    why:
      A: 'Setting up the organisation (organising) comes after the plan is made.'
      B: 'Coordinating brings activities together to carry out a plan already made.'
      D: 'A welfare package is a staff benefit, not a function of management.'

  32:
    answer: A
    steps:
      - 'This is the line structure (line organisation), the simplest organisational structure.'
      - 'In a line structure, authority flows in a straight line from the owner or manager at the top down to the workers below. Each person takes orders from one boss only.'
      - 'It needs no specialist staff or committees, decisions are quick, and everyone knows who is in charge. These suit a small or medium-sized firm with few workers and few departments.'
      - 'A bakery in Ibadan where the owner gives orders to two supervisors, who direct the bakers and sales girls, uses a line structure.'
      - 'Remember: small firm, straight line.'
      - 'The trap is D, functional structure. It places specialists over each function and suits large firms; a small firm cannot afford many specialists.'
    hint: 'Which structure is the simplest, with orders flowing straight down?'
    why:
      B: 'A staff structure adds specialist advisers, which a small firm rarely needs or can afford.'
      C: 'A committee structure is slow and suits large organisations with many interests to balance.'
      D: 'A functional structure needs specialists for each function and suits large firms.'

  33:
    answer: B
    steps:
      - 'This is staff authority, as against line authority.'
      - 'Staff authority is the authority of specialists (such as legal, accounting or personnel officers) to advise other departments. Their opinion is advice; they cannot give orders outside their own department.'
      - 'The line manager who receives the advice decides whether to use it. Orders, commands and directives belong to line authority.'
      - 'In a Lagos manufacturing company, the legal adviser tells the sales manager a contract is risky. That is advice; the sales manager makes the decision.'
      - 'Remember: staff advise, line decide.'
      - 'The trap is A, a directive. A directive is an order from a line superior, which a staff specialist cannot give to another department.'
    hint: 'Can a staff specialist give orders to another department?'
    why:
      A: 'A directive is an order, which comes through line authority.'
      C: 'A command is an order from a line superior, not staff advice.'
      D: 'Delegation is passing authority down to a subordinate, not giving an opinion.'

  34:
    answer: D
    steps:
      - 'This is management, the work of running a business.'
      - 'Management is the process of planning, organising, directing and controlling the resources of a business (men, money, materials and machines) to produce goods and services that satisfy human needs.'
      - 'Every idea a manager develops, a new product, a cheaper method, a better plant layout, is aimed at producing goods and services that customers want and will pay for. Distribution, transport and transfer of ownership are parts of that larger aim.'
      - 'The managers of Dangote Group develop ideas on how to produce more cement, sugar and salt at lower cost to meet the needs of Nigerians.'
      - 'Remember: management manages production to meet needs.'
      - 'The trap is A, distribution. Distribution is one activity of a business, part of commerce; management covers the whole business of producing to satisfy needs.'
    hint: 'Which option covers the whole aim of a business, not just one activity?'
    why:
      A: 'Distribution is only one part of what a business does.'
      B: 'Transport is only one aid to trade, not the whole aim of management.'
      C: 'Transfer of ownership describes trade (buying and selling), not management.'

  35:
    answer: D
    steps:
      - 'This is market skimming (price skimming), a pricing policy.'
      - 'Market skimming means setting a high price when a new product is launched, to earn high profit from customers who are keen to have it first, and then lowering the price over time.'
      - 'Early buyers will pay more for something new. Once they have bought, the price is cut to reach more ordinary buyers. Other pricing policies include penetration pricing and cost-plus pricing.'
      - 'When a new smartphone model reaches shops in Computer Village, Ikeja, it is sold at a high price, which falls a few months later.'
      - 'Remember: skim the cream first, then sell to the rest.'
      - 'The trap is A, packaging. Packaging belongs to the product element of the marketing mix, not to pricing.'
    hint: 'Which of these is about setting a price?'
    why:
      A: 'Packaging is part of the product, not a pricing policy.'
      B: 'Market selection is choosing target customers, not setting prices.'
      C: 'Labelling gives information on the product, not a price policy.'

  36:
    answer: C
    steps:
      - 'This is the core benefit, the first level of a product.'
      - 'The core benefit is the basic need or utility the buyer gets from using the product. The actual product (brand, design, packaging) and the augmented product (warranty, delivery, after-sales service) are built around it.'
      - 'A buyer does not want the drill itself, he wants the hole. That basic satisfaction is the core benefit.'
      - 'The core benefit of a bag of Dangote cement is strong building material; the brand name and free delivery are added layers.'
      - 'Remember: core is the centre, the reason you buy.'
      - 'The trap is A, augmented benefit. Augmented benefits are the extras added around the product, not its essential use.'
    hint: 'What is the most basic reason a buyer wants the product?'
    why:
      A: 'Augmented benefits are extras like warranty and delivery, not the essential use.'
      B: 'Branding belongs to the actual product, around the core.'
      D: 'The formal (actual) product is the brand, design and package, not the essential utility.'

  37:
    answer: B
    steps:
      - 'This is market segmentation.'
      - 'Market segmentation is dividing a whole market into separate groups (segments) of buyers who share similar needs or features, such as age, income, location or lifestyle.'
      - 'A firm then chooses the segments it wants and designs a product, price and advertisement for each one.'
      - 'A noodle company sells big family packs to households and small single packs to students, treating them as two segments.'
      - 'Remember: segment means cut into pieces.'
      - 'The trap is A, differentiation. Differentiation is making a product look different from rivals'' products; it does not divide the market.'
    hint: 'Which word means cutting a whole into parts?'
    why:
      A: 'Differentiation makes a product distinct from competitors; it does not divide the market.'
      C: 'Skimming is a pricing policy.'
      D: 'Penetration is entering a market with a low price.'

  38:
    answer: C
    steps:
      - 'This is a contract of record.'
      - 'A contract of record is an obligation entered on the record of a court of law, such as a judgment of the court or a recognizance (a promise made before the court).'
      - 'It is a formal contract whose force comes from the court''s record itself, so it cannot be denied later. The other kind of formal contract is the specialty contract, made under seal.'
      - 'When a court in Abuja gives judgment that a trader must pay a supplier ₦500,000, that judgment is a contract of record.'
      - 'Remember: recorded before the court, a contract of record.'
      - 'The trap is D, specialty contract. A specialty contract is made by deed under seal, signed and delivered, not before a court.'
    hint: 'Which contract takes its name from the court''s record?'
    why:
      A: 'An informal contract is a simple contract made without special form.'
      B: 'A simple contract is made orally, in writing or by conduct, not before a court.'
      D: 'A specialty contract is made by deed under seal, not acknowledged in court.'

  39:
    answer: C
    steps:
      - 'This is a factor, a kind of mercantile agent.'
      - 'A factor is an agent who is given possession of the principal''s goods to sell, often in his own name, and is paid by commission.'
      - 'The principal hands over the goods. The factor stores, sells and collects payment for them, then pays the principal after taking his commission.'
      - 'A cocoa farmer in Ondo who hands his bags to an agent in Lagos to sell for him is using a factor.'
      - 'Remember: the factor holds the goods.'
      - 'The trap is B, del credere agent. A del credere agent is marked by guaranteeing that the buyers he finds will pay, for an extra commission; holding the goods is what marks a factor.'
    hint: 'Which agent has the principal''s goods in his possession?'
    why:
      A: 'A special agent is appointed for one particular transaction.'
      B: 'A del credere agent guarantees buyers will pay; holding the goods is not what defines him.'
      D: 'A universal agent has unlimited authority to act in all matters for the principal.'

  40:
    answer: D
    steps:
      - 'This is discharge of a contract by breach.'
      - 'A breach of contract occurs when one party fails to do what he promised in the contract, or does it in a way the contract does not allow.'
      - 'The dealer promised to deliver the car to Mr X on the agreed date. By delivering it to Mr Y instead, he has failed his duty to Mr X. The contract is broken, and Mr X may sue for damages.'
      - 'If a car dealer in Lagos sells the Toyota already promised to a customer to another buyer who offers more, he is in breach.'
      - 'Remember: a broken promise is a breach.'
      - 'The trap is A, performance. A contract is discharged by performance only when each party does exactly what it promised; delivering to the wrong person is not performance.'
    hint: 'Did the dealer do what he promised Mr X?'
    why:
      A: 'Performance means doing exactly what was promised, which the dealer did not do.'
      B: 'Frustration is when an outside event makes the contract impossible; here the dealer chose to deliver elsewhere.'
      C: 'Discharge by agreement needs both parties to agree to end the contract.'

  41:
    answer: C
    steps:
      - 'This is frustration, one of the ways a contract is discharged (ended).'
      - 'A contract is frustrated when, after it is made, an event that neither party caused makes it impossible to perform, such as the destruction of the subject matter, death or a change in the law.'
      - 'The parties are then released from the contract. The other ways of discharge are performance, agreement and breach.'
      - 'If a hall in Ibadan booked for a wedding burns down before the day, the contract to hire it is frustrated.'
      - 'Remember: frustration is when fate, not the parties, ends the contract.'
      - 'The trap is D, consultation. Talking it over ends nothing; only an agreement by both parties to end it discharges a contract.'
    hint: 'Which is a recognised legal way of ending a contract?'
    why:
      A: 'Fighting is not a lawful way to end a contract.'
      B: 'Family intervention has no legal effect on a contract.'
      D: 'Consultation alone does not end a contract; the parties must agree to end it.'

  42:
    answer: D
    steps:
      - 'This is a lien, a right of the unpaid seller under the Sale of Goods Act.'
      - 'A lien is the right to keep possession of goods belonging to another until a debt owed on them, such as the price, is paid.'
      - 'If the buyer has not paid, the seller who still holds the goods may refuse to hand them over until he is paid. The lien is lost once he gives up the goods.'
      - 'A tailor in Aba who keeps a finished suit until the customer pays the sewing charge is exercising a lien.'
      - 'Remember: lien, keep it in until paid.'
      - 'The trap is A, a promise. A promise is only an undertaking to do something; it gives no right to hold the goods.'
    hint: 'What right lets an unpaid seller hold on to the goods?'
    why:
      A: 'A promise is an undertaking, not a right to retain goods.'
      B: 'Ultra vires means acting beyond one''s legal powers.'
      C: 'A breach is failing to keep a contract, not a right.'

  43:
    answer: B
    steps:
      - 'This is copyright.'
      - 'Copyright is the exclusive legal right of an author, artist or musician to reproduce, publish and sell his work, so others may not copy it without permission.'
      - 'The author owns the right as soon as the work is created, and anyone who prints copies without permission can be sued. It lets the author earn from his work.'
      - 'In Nigeria the Copyright Act protects authors such as Chinua Achebe, and the Nigerian Copyright Commission acts against pirated books and music.'
      - 'Remember: copyright is the right to copy.'
      - 'The trap is C, patent right. A patent protects a new invention, not a book.'
    hint: 'Which right protects written and artistic works?'
    why:
      A: 'A trademark protects a brand name or symbol, not a book.'
      C: 'A patent protects an invention.'
      D: 'A bookmark is a marker for a page, not a legal right.'

  44:
    answer: A
    steps:
      - 'This is downloading.'
      - 'Downloading is copying data, such as a file, a song or a document, from another computer, usually a server on the Internet, to your own computer or phone.'
      - 'You request the file, the other computer sends it over the network, and a copy is saved on your device. Sending a file the other way, from your computer up to another, is uploading.'
      - 'A student who saves a past-question booklet from a website onto his phone is downloading it.'
      - 'Remember: down to me is downloading, up from me is uploading.'
      - 'The trap is C, browsing. Browsing is viewing web pages; it does not keep a copy of the data on your computer.'
    hint: 'What do you call bringing a file from the Internet onto your own device?'
    why:
      B: 'Faxing sends a copy of a paper document over a telephone line.'
      C: 'Browsing is viewing pages on the Internet, not copying data to your computer.'
      D: 'Decoding is converting coded signals back into readable form.'

  45:
    answer: B
    steps:
      - 'This is hardware.'
      - 'Hardware is the general name for all the physical parts of a computer system, the parts you can see and touch: the monitor, keyboard, mouse, system unit, hard disk and printer.'
      - 'A computer system has two parts: hardware, the machines, and software, the programs that tell them what to do. Neither works without the other.'
      - 'In a cyber café in Zaria, the computers, printers and scanners are the hardware; the Windows and Word programs are the software.'
      - 'Remember: hardware is hard, you can touch it.'
      - 'The trap is C, hard disk. A hard disk is one piece of hardware, not the name for all the physical parts.'
    hint: 'Which word names all the parts you can touch?'
    why:
      A: 'Software is the programs, which cannot be touched.'
      C: 'A hard disk is only one piece of hardware.'
      D: 'A floppy disk is only one storage device, one piece of hardware.'

  46:
    answer: D
    steps:
      - 'This is the floppy disk, a removable storage device.'
      - 'A floppy disk is a thin, flexible magnetic disk in a plastic case that is put into the computer''s drive to store information and later retrieve (read) it.'
      - 'Data is written on to the disk, the disk is taken out and carried away, and the information is retrieved by putting it back into a drive. Today floppy disks are no longer in everyday use; USB flash drives, memory cards and cloud storage do the same job.'
      - 'An office in Lagos once kept copies of its invoices on floppy disks; today the same office saves them on a flash drive or online.'
      - 'Remember: store it, carry it, retrieve it.'
      - 'The trap is B, input device. An input device such as a keyboard puts information into the computer; it does not store it for later.'
    hint: 'Which item is used to keep information and bring it back later?'
    why:
      A: 'A UPS keeps power flowing when there is a power cut; it stores no information.'
      B: 'An input device enters information; it does not store or retrieve it.'
      C: 'The control unit directs operations inside the processor; it is not a removable accessory.'

  47:
    answer: C
    steps:
      - 'This is database software.'
      - 'A database is software that stores and organises large amounts of information so that it can be searched, sorted and reported quickly. Managers use it for the information they need to make decisions.'
      - 'Records of customers, stock, staff and sales are kept in tables. The manager can ask for a report, such as all items below reorder level, at once.'
      - 'A supermarket chain in Lagos keeps its stock and sales records in a database, and its managers draw reports from it each week.'
      - 'Remember: data base, the home of information for managers.'
      - 'The trap is D, WordPerfect. It is a word processor for typing letters and reports, not for storing and managing information.'
    hint: 'Which kind of software stores and sorts records?'
    why:
      A: 'CorelDRAW is graphics software for drawing and design.'
      B: 'AutoCAD is software for engineering and architectural drawings.'
      D: 'WordPerfect is a word processor for typing documents.'

  48:
    answer: C
    steps:
      - 'This is the password.'
      - 'A password is a secret word or code that a user must enter to prove who he is before the computer allows access to data.'
      - 'The system checks the password against the one stored for that user. Only if they match is access granted, so people without the password are kept out.'
      - 'A GTBank customer must enter a password or PIN before using internet banking.'
      - 'Remember: pass word, the word that lets you pass.'
      - 'The trap is A, an e-mail address. An e-mail address identifies where messages go; it is often public, so it cannot secure data.'
    hint: 'What secret do you type to prove it is really you?'
    why:
      A: 'An e-mail address is an address for messages, not a security code.'
      B: 'A Yahoo address is just one kind of e-mail address.'
      D: 'A modem connects a computer to a network; it does not secure access.'

  49:
    answer: A
    steps:
      - 'This is technology, a factor of the business environment.'
      - 'The business environment is made up of outside factors that affect how a firm operates: economic, political, legal, social and technological.'
      - 'New technology changes how goods are made, sold and paid for. Firms that adopt it cut costs and reach more customers; those that do not are left behind.'
      - 'Mobile money and point-of-sale (POS) machines have changed how shops across Nigeria take payment, and online stores such as Jumia have changed retail.'
      - 'Remember: technology is the force that changes how business is done.'
      - 'The trap is C, product. A product is what a firm itself makes and sells, decided inside the business, not an outside factor of the environment.'
    hint: 'Which option is an outside force that changes how every firm works?'
    why:
      B: 'Supply is an output decision of the firm, not a factor of the business environment.'
      C: 'The product is chosen by the firm itself, not an outside factor.'
      D: 'Branding is a marketing decision of the firm, not a factor of the environment.'

  50:
    answer: C
    steps:
      - 'This is air pollution, one type of pollution.'
      - 'Air pollution is the release of harmful gases, smoke and dust into the air from factories, vehicles, generators and burning.'
      - 'Air moves freely, carried by the wind across towns and borders, so the pollution spreads and cannot be fenced in or cleaned up in one place. Land and water pollution stay more local and can be cleared or treated.'
      - 'Soot from gas flaring and illegal refining in the Niger Delta spreads over Port Harcourt and settles on homes far from where it began.'
      - 'Remember: you can clean a field or a river, but you cannot catch the wind.'
      - 'The trap is B, water pollution. Polluted water can spread, but it flows in channels and can be treated, while air spreads everywhere.'
    hint: 'Which kind of pollution moves freely with the wind?'
    why:
      A: 'Land pollution stays in one place and can be cleared up.'
      B: 'Water pollution flows in channels and can be treated, so it is easier to control than air.'
      D: 'Political unrest is not a type of pollution.'
