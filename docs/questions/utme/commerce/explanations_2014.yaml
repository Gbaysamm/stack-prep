format_version: 1
exam_year: 2014
subject: COM
explanations:
  2:
    answer: B
    steps:
      - 'This is one of the functions of commerce, linking nations through trade.'
      - 'Commerce is all the activities that move goods and services from producers to consumers, including trade and the aids to trade such as transport, banking and insurance.'
      - 'No country produces everything it needs. International trade makes each country depend on others for what it lacks, and countries that depend on one another have every reason to stay friendly and cooperate.'
      - 'Nigeria sells crude oil and cocoa abroad and buys machines, wheat and medicines. Because of this trade, Nigeria and its trading partners keep good relations and sign trade agreements through ECOWAS and the World Trade Organization.'
      - 'Remember: trade ties nations together, so commerce makes friends.'
      - 'The trap is A, tourism. Tourism brings people together, but it is only one part of commerce; the interdependence between nations comes from trade as a whole.'
    hint: 'What makes one country need the goods of another?'
    why:
      A: 'Tourism is a small part of commerce; interdependence between nations comes mainly from trade.'
      C: 'Agriculture is a form of production; it does not by itself link nations.'
      D: 'Socio-cultural activities bring people together but do not create economic interdependence.'

  3:
    answer: B
    steps:
      - 'This is extractive industry, a branch of primary production.'
      - 'An extractive industry takes natural resources directly from the land, the sea or under the ground: mining, fishing, farming, hunting and lumbering.'
      - 'Its products are raw materials in their natural state. They are then passed on to manufacturing industries, which turn them into finished goods.'
      - 'Iron ore is mined at Itakpe in Kogi State for the steel industry.'
      - 'Remember: extractive means taken out of nature, unchanged.'
      - 'The trap is D, a textile material. Cloth is made in a factory from cotton, so it is a product of manufacturing, not extraction.'
    hint: 'Which of these comes straight out of the ground?'
    why:
      A: 'An airplane is assembled in a factory, so it comes from manufacturing.'
      C: 'A shoe is made from leather in a factory, a manufactured good.'
      D: 'Textile material is woven from cotton in a factory, a manufactured good.'

  4:
    answer: D
    steps:
      - 'This is a direct service, one kind of service occupation.'
      - 'Direct services are rendered personally to individuals who need them, such as doctors, lawyers, barbers, tailors and private teachers. Indirect services are rendered to the public as a whole, by civil servants, soldiers and the police.'
      - 'Because a direct service is given to one person, that person pays the fee. Indirect services are paid for by the government out of taxes.'
      - 'When you have your hair cut at a barbing salon in Ibadan, you pay the barber yourself; the police officer at the junction is paid by the government.'
      - 'Remember: direct service, direct payment by the person served.'
      - 'The trap is C, government. The government pays for indirect services such as the police and the civil service, not for direct ones.'
    hint: 'Who pays the barber after a haircut?'
    why:
      A: 'Local authorities pay for indirect services to the public, such as sanitation.'
      B: 'A community may fund a shared project, but a direct service is paid for by the person served.'
      C: 'Government pays for indirect services, such as the police and the civil service.'

  5:
    answer: C
    steps:
      - 'This is land, one of the four factors of production.'
      - 'Land means all the free gifts of nature: the soil, minerals, rivers, forests and the sea. Its reward is rent.'
      - 'Its features are that it is fixed in supply, passive (it produces nothing until labour works on it), immobile, subject to diminishing returns, and heterogeneous, which means no two pieces of land are the same in fertility, location or mineral wealth.'
      - 'A plot in Ikoyi and a plot in a village in Ekiti are both land, but they differ hugely in location and value; farmland in Benue is far more fertile than land in the dry far north.'
      - 'Remember FPIH: Fixed, Passive, Immobile, Heterogeneous.'
      - 'The trap is B, an active factor. Labour and the entrepreneur are the active factors; land is passive, because it does nothing by itself.'
    hint: 'Are any two plots of land exactly alike?'
    why:
      A: 'Land is fixed in supply; its supply is inelastic, not elastic.'
      B: 'Land is a passive factor; it yields nothing until labour works on it.'
      D: 'Land is immobile; it cannot be moved from one place to another.'

  6:
    answer: A
    steps:
      - 'This is the volume, or scale, of production.'
      - 'A producer makes as much as it can sell. So the size of the market, meaning the number of buyers and how much they can buy, sets how much is produced.'
      - 'A large market lets a firm produce on a large scale, divide labour finely and cut its cost per unit. A small market keeps production small, because extra goods would not be sold.'
      - 'A noodles factory in Lagos that sells across West Africa produces millions of packs a day; a bakery that serves one village bakes a few hundred loaves.'
      - 'Remember: the market decides how much you make.'
      - 'The trap is B, the availability of banks. Banks help to finance production, but a firm with plenty of loans still cannot produce more than it can sell.'
    hint: 'Why would a firm stop producing more?'
    why:
      B: 'Banks help with finance, but finance cannot make up for having too few buyers.'
      C: 'The ratio of men to women in a population does not decide how much a firm produces.'
      D: 'Where the head office stands has no real bearing on how much is produced.'

  7:
    answer: D
    steps:
      - 'This is extractive occupation, part of industrial occupation.'
      - 'Extractive occupations take resources directly from nature: fishing, crabbing, farming, mining, hunting and lumbering.'
      - 'Mrs. Jones takes crabs and fish straight out of the creeks; she does not process them in a factory, so her job is extractive.'
      - 'Fishermen and crab catchers in the creeks around Bonny and Andoni in Rivers State are in extractive occupation.'
      - 'Remember: if it comes straight out of nature, it is extractive.'
      - 'The trap is A, commercial. Selling the fish would be commerce, but catching them is extraction.'
    hint: 'Where do the crabs and fish come from?'
    why:
      A: 'Commercial occupation is trade and the aids to trade; catching fish is not trading.'
      B: 'Manufacturing changes raw materials into finished goods; fishing does not.'
      C: 'Service occupations give personal or public services, such as teaching or nursing.'

  8:
    answer: B
    steps:
      - 'This is the consumer co-operative society, a type of retail outlet.'
      - 'A consumer co-operative is a retail shop owned by its customers. Members contribute capital, buy goods in bulk directly from manufacturers or wholesalers and sell to themselves.'
      - 'By buying direct, the society cuts out middlemen and their profits. Any surplus is shared among members as a dividend in proportion to their purchases.'
      - 'Staff of a university in Nsukka may run a consumer co-operative shop that buys rice and soap straight from the makers and sells to members at fair prices.'
      - 'Remember: consumers own the shop, so the middleman''s profit comes back to them.'
      - 'The trap is C, multiple shop. A multiple shop also buys direct from manufacturers, but it is owned by a company for profit, not set up by consumers to share gains among themselves.'
    hint: 'Which outlet is owned by the people who shop in it?'
    why:
      A: 'A producer co-operative is formed by producers to make or market their output, not as a consumers'' shop.'
      C: 'A multiple shop is a chain owned by a company for profit, not by its customers.'
      D: 'A departmental store is a large shop owned by a company, not a consumers'' society.'

  9:
    answer: D
    steps:
      - 'This is the warehouse warrant, also called the dock warrant.'
      - 'A warehouse warrant is the receipt a port authority or warehouse keeper gives the owner for goods deposited in its warehouse.'
      - 'It is a document of title: whoever holds it can collect the goods. So the owner can sell the goods, or use them as security for a bank loan, simply by endorsing and handing over the warrant.'
      - 'An importer whose goods wait in a warehouse at Apapa port is given a warrant; she can sell the goods to a trader in Idumota by passing on the warrant.'
      - 'Remember: warrant for goods in the warehouse.'
      - 'The trap is A, bill of lading. That is issued by the shipping company for goods loaded on a ship, not by the port for goods deposited.'
    hint: 'Which document is a receipt for goods kept in store?'
    why:
      A: 'A bill of lading is issued by a shipping company for goods carried on a ship.'
      B: 'A bill of sight is given to customs by an importer who lacks full details of the goods.'
      C: 'A consular invoice is certified by the importing country''s consul in the exporting country.'

  10:
    answer: A
    steps:
      - 'This is the bill of sight, an import document.'
      - 'A bill of sight is a document an importer gives to customs when he cannot describe the imported goods fully, for example because the shipping documents have not arrived.'
      - 'It allows him to examine the goods in the presence of customs officers. Once he knows exactly what they are, he completes a full bill of entry and pays the duty.'
      - 'A trader clearing a container of mixed spare parts at Tin Can Island whose invoice is delayed can lodge a bill of sight to inspect the goods first.'
      - 'Remember: bill of sight, so you can see the goods first.'
      - 'The trap is D, bill of entry. That is the full declaration made when the importer already knows the details; the bill of sight comes before it.'
    hint: 'Which document lets the importer look at the goods before declaring them?'
    why:
      B: 'An invoice is the seller''s bill for goods sold, not a customs document for missing details.'
      C: 'An indent is an order for goods sent to an agent abroad.'
      D: 'A bill of entry is the full declaration, made when the goods can be described in full.'

  11:
    answer: A
    steps:
      - 'This is the customs and excise authority, in Nigeria the Nigeria Customs Service.'
      - 'It controls goods entering and leaving the country: it collects import, export and excise duties, and stops smuggling and banned goods.'
      - 'Every import is declared, examined and charged duty before release, and exports are checked before they leave. In this way customs regulates the flow of goods across the border.'
      - 'Customs officers at the Seme border and at Apapa port check goods and collect duty before release.'
      - 'Remember: customs guard the gate for goods.'
      - 'The trap is D, transport. Customs checks goods; it does not run ships, trucks or railways.'
    hint: 'What does a customs officer at the border do with goods?'
    why:
      B: 'Customs does not control the other security agencies, such as the police or the army.'
      C: 'Dockyards are provided by port and shipping bodies, not by customs.'
      D: 'Transport for trade is provided by transport firms and port authorities, not customs.'

  12:
    answer: A
    steps:
      - 'This is the statement of account, a document in buying and selling.'
      - 'A statement of account is sent by a seller to a credit customer, usually monthly. It lists the invoices, credit notes, debit notes and payments for the period and shows the balance owed.'
      - 'The customer checks it against his own records and pays the balance. It reminds him what he owes and settles any difference before payment.'
      - 'A Kano wholesaler who supplies a retailer on credit all month sends a statement at the month end showing, say, ₦450,000 still owing.'
      - 'Remember: a statement states the balance.'
      - 'The trap is C, proforma invoice. That is sent before a sale, to quote the price; it records no past transactions.'
    hint: 'Which document sums up a month of dealings and shows what is owed?'
    why:
      B: 'A consular invoice is an export document certified by the consul of the importing country.'
      C: 'A proforma invoice is sent before a sale, as a quotation or a request for payment in advance.'
      D: 'A statement of affairs lists a business''s assets and liabilities, not its dealings with one customer.'

  13:
    answer: C
    steps:
      - 'This is the quotation, the second step in buying and selling.'
      - 'The steps are enquiry, quotation, order, invoice and payment. A buyer sends an enquiry to ask about goods, prices and terms, and the seller replies with a quotation.'
      - 'The quotation gives the price, the terms of trade (discounts, delivery, payment) and the goods available. If the buyer likes it, he sends an order.'
      - 'A supermarket in Abuja asks a wholesaler in Onitsha about the price of 100 cartons of soap; the wholesaler replies with a quotation, a catalogue and a price list.'
      - 'Remember: enquiry asks, quotation answers, order buys.'
      - 'The trap is B, an order. The order comes from the buyer after he has seen the quotation, not from the seller.'
    hint: 'What does a seller send to answer the question "How much does it cost?"'
    why:
      A: 'A consignment note goes with goods sent by rail or road, after the sale.'
      B: 'An order is sent by the buyer, not the seller, after the quotation.'
      D: 'An advice note tells the buyer the goods have been sent, after the order.'

  14:
    answer: D
    steps:
      - 'This is the debit note, used to put right an undercharge on an invoice.'
      - 'If the seller charges too little, he sends a debit note for the difference, which raises what the buyer owes. If he charges too much, he sends a credit note, which lowers it.'
      - 'Undercharge = true value less amount invoiced: $2{,}000 - 200 = 1{,}800$, so ₦1,800. Check: ₦200 already invoiced plus ₦1,800 on the debit note gives ₦2,000, the true value.'
      - 'A noodles distributor in Aba who billed a shop ₦200 for a ₦2,000 carton sends a debit note for ₦1,800 to recover the rest.'
      - 'Remember: Debit raises the Debt; credit cuts it.'
      - 'The trap is C, a credit note for ₦1,800. The amount is right, but a credit note reduces what the buyer owes, and here the buyer owes more.'
    hint: 'Was the buyer charged too much or too little?'
    why:
      A: 'A new invoice for ₦200 repeats the undercharge and leaves ₦1,800 unbilled.'
      B: 'A debit note for ₦2,000 would charge the buyer ₦2,200 in all.'
      C: 'A credit note lowers what the buyer owes; here the bill must go up.'

  15:
    answer: A
    steps:
      - 'This is poste restante, a postal service.'
      - 'Poste restante means "mail remaining". Letters are addressed to a person, care of a named post office, and are kept there until he calls to collect them.'
      - 'The person shows proof of identity at the counter and collects the letter. It suits travellers who have no fixed address in a town.'
      - 'A tourist visiting the Obudu Mountain Resort could have letters sent to "Poste Restante, Obudu Post Office" and collect them there. Today email and mobile phones have taken over most of this work.'
      - 'Remember: poste restante, the post rests at the office until you come.'
      - 'The trap is C, private mail bag. A private mail bag is rented by a firm with a fixed address, not used by travellers.'
    hint: 'Where can mail wait for someone who has no address in town?'
    why:
      B: 'Parcel post carries parcels; it does not hold letters for travellers.'
      C: 'A private mail bag is rented by a business or person with a fixed base.'
      D: 'Recorded delivery gets a signature on delivery to an address.'

  16:
    answer: D
    steps:
      - 'This is the endowment policy, a kind of life assurance.'
      - 'Life assurance covers human life. In an endowment policy, the insured pays premiums for a fixed period, and the sum assured is paid at the end of the period or at death, whichever comes first.'
      - 'It is assurance because the event is certain to happen in one form or the other, so it is a form of saving as well as protection.'
      - 'A civil servant in Enugu takes a twenty-year endowment policy to pay for her children''s university fees.'
      - 'Remember: endowment ends with a payment, so it is life assurance.'
      - 'The trap is B, fidelity guarantee. That covers an employer against dishonest staff; it has nothing to do with life.'
    hint: 'Is an endowment policy about property, staff or a life?'
    why:
      A: 'Accident insurance covers injury from accidents for a year at a time, not a savings sum.'
      B: 'Fidelity guarantee covers an employer against theft or fraud by employees.'
      C: 'Motor vehicle insurance covers vehicles and third parties.'

  17:
    answer: A
    steps:
      - 'This is indemnity insurance.'
      - 'Indemnity means restoring the insured to the same financial position he was in just before the loss. It applies to property and goods, whose loss can be valued in money.'
      - 'If burglars steal goods worth ₦300,000, the insurer pays ₦300,000, not more, so the insured makes no profit. Life and personal accident policies are non-indemnity, because a life cannot be valued.'
      - 'A phone shop at Computer Village, Ikeja, insured against burglary, is paid the value of the stolen phones.'
      - 'Remember: property can be priced, so property insurance is indemnity.'
      - 'The trap is B, fidelity guarantee. That covers theft by one''s own employees; burglary is breaking in by outsiders.'
    hint: 'Can the goods stolen in a burglary be valued in naira?'
    why:
      B: 'Fidelity guarantee covers dishonesty by employees, not break-ins by outsiders.'
      C: 'Burglary is a risk that can be measured and is insured every day.'
      D: 'Non-indemnity insurance covers life and personal accident, where loss cannot be priced.'

  18:
    answer: C
    steps:
      - 'This is uberrimae fidei, the principle of utmost good faith.'
      - 'Both parties to an insurance contract must disclose all material facts, meaning facts that would affect the decision to insure or the premium.'
      - 'The proposer must tell the insurer about the risk, and the insurer must tell the proposer the full terms and conditions of the cover. If either hides a material fact, the contract can be set aside.'
      - 'An insurer in Lagos that sells fire cover to a trader must explain what the policy excludes, and the trader must say that he stores petrol in the shop.'
      - 'Remember: uberrimae fidei, utmost good faith, tell everything.'
      - 'The trap is D, contribution. Contribution shares a loss between insurers; it says nothing about disclosure.'
    hint: 'Which principle is about telling the whole truth?'
    why:
      A: 'Subrogation passes the insured''s rights to the insurer after compensation.'
      B: 'Proximate cause links the loss to the risk insured.'
      D: 'Contribution shares a loss among several insurers of the same risk.'

  19:
    answer: D
    steps:
      - 'This is subrogation, a principle of insurance.'
      - 'Subrogation means that once the insurer has compensated the insured, it takes over the insured''s rights against anyone who caused the loss.'
      - 'The insurer can then sue the wrongdoer or take whatever is left of the damaged property. This stops the insured from being paid twice and so supports indemnity.'
      - 'If a lorry crashes into an insured bus in Ibadan, the insurer pays the bus owner and then claims from the lorry owner.'
      - 'Remember: subrogation, the insurer steps into your shoes.'
      - 'The trap is A, indemnity. Indemnity is about putting the insured back where he was; taking over his rights afterwards is subrogation.'
    hint: 'Which principle lets the insurer step into the shoes of the insured?'
    why:
      A: 'Indemnity restores the insured to his former position; it does not pass rights to the insurer.'
      B: 'Proximate cause finds the main cause of a loss.'
      C: 'Utmost good faith requires full disclosure of material facts.'

  20:
    answer: A
    steps:
      - 'This is insurance, an aid to trade that removes the hindrance of risk.'
      - 'Insurance pools the premiums of many people so that the few who suffer a loss can be compensated.'
      - 'A trader who has a fire insurance policy and pays his premiums is paid the value of his loss, which restores him to his position before the fire, in line with the principle of indemnity.'
      - 'When a fire swept through a section of a market in Onitsha, traders with fire policies were paid by their insurers and restocked their shops.'
      - 'Remember: risk is the hindrance, insurance the cure.'
      - 'The trap is B, a trade association. It speaks for its members and may give some help, but it does not compensate members for losses.'
    hint: 'Which aid to trade exists to compensate losses?'
    why:
      B: 'A trade association protects members'' interests but does not pay for their losses.'
      C: 'A bank may lend money, but a loan must be repaid; it does not restore the loss.'
      D: 'An advertising agency promotes goods; it has nothing to do with losses.'

  21:
    answer: B
    steps:
      - 'This is the transport of petroleum products.'
      - 'Petroleum products such as petrol, diesel and kerosene are bulky liquids that must reach filling stations in every town.'
      - 'Bulk products move from refineries and ports to depots partly by pipeline, but from the depots to filling stations across the country they go almost entirely by road tanker, because roads reach every town.'
      - 'Tankers from the depots in Apapa and at Kaduna carry petrol to filling stations throughout Nigeria.'
      - 'Remember: tankers on the road bring the fuel to the pump.'
      - 'The trap is D, air. Air transport is fast but very costly and carries small loads, so it is never used to move fuel to filling stations.'
    hint: 'How does petrol reach your nearest filling station?'
    why:
      A: 'Rail could carry fuel, but Nigeria''s rail network reaches few towns, so little fuel moves by rail.'
      C: 'Sea transport brings imported fuel to the ports, but it cannot reach inland towns.'
      D: 'Air transport is too costly for bulky goods such as fuel.'

  22:
    answer: D
    steps:
      - 'This is jettison, a term in marine insurance.'
      - 'Jettison is the deliberate throwing overboard of part of a ship''s cargo to lighten the vessel and save the ship and the rest of the cargo in an emergency.'
      - 'It is a general average loss: because the sacrifice saved everyone''s property, the shipowner and all the cargo owners share the cost of the goods thrown away in proportion to their interests.'
      - 'If a ship bound for Apapa is caught in a storm and the captain orders some containers thrown overboard to keep it afloat, that is jettison.'
      - 'Remember: jettison, throw it out to stay afloat.'
      - 'The trap is C, demurrage. Demurrage is a charge for keeping a ship or goods beyond the agreed time; it has nothing to do with throwing cargo away.'
    hint: 'What is it called when cargo is thrown into the sea to save a ship?'
    why:
      A: 'Caveat emptor means "let the buyer beware", a rule of buying and selling.'
      B: 'Uberrimae fidei is utmost good faith, the duty to disclose all material facts.'
      C: 'Demurrage is a charge for delay in loading, unloading or collecting goods.'

  23:
    answer: B
    steps:
      - 'This is the public corporation, a business unit owned by government.'
      - 'A public corporation is set up by an Act of the legislature, owned by the government and run by a board, to provide a service the public needs.'
      - 'Its main aim is to provide essential services such as power, water, rail transport and broadcasting at reasonable cost, services that private firms might not provide well or cheaply enough. Profit is not its first aim.'
      - 'The Nigerian Railway Corporation and the Nigerian Television Authority are public corporations set up to give essential services.'
      - 'Remember: public corporation, public service first.'
      - 'The trap is C, employment. Public corporations do employ many people, but jobs are a result of their work, not the main reason they are set up.'
    hint: 'Why would government run the railway rather than leave it to private firms?'
    why:
      A: 'Many public corporations are monopolies, but the monopoly is a means of providing the service, not the aim.'
      C: 'Jobs are created as a result, but providing services is the main aim.'
      D: 'Encouraging specialization is not the reason a public corporation is set up.'

  24:
    answer: C
    steps:
      - 'This is forward integration, a form of business combination.'
      - 'Vertical integration joins firms at different stages of production of the same good. Forward integration joins a firm with a later stage, closer to the consumer; backward integration joins it with an earlier stage, closer to the raw materials.'
      - 'A manufacturer that joins with the firm that markets its products moves forward, towards the customer, so it is forward integration.'
      - 'A Nigerian flour miller that takes over a chain of bakeries and shops that sell its bread is integrating forward.'
      - 'Remember: forward to the customer, backward to the raw material.'
      - 'The trap is A, backward integration. That would be the manufacturer joining a supplier of its raw materials.'
    hint: 'Is the marketing firm before or after the manufacturer in the chain?'
    why:
      A: 'Backward integration joins a firm with its suppliers of raw materials.'
      B: 'A consortium is a group of firms that join for one large project.'
      D: 'A syndicate is a group of firms that sell through a common agency.'

  25:
    answer: C
    steps:
      - 'This is the cartel, a loose form of business combination.'
      - 'A cartel is an association of independent firms producing the same product that agree on the prices to charge or the output each will produce, while every member remains independent.'
      - 'By fixing prices or sharing out the market, members avoid price wars and act almost like a monopoly. Each still sells its own goods in its own name.'
      - 'OPEC, which Nigeria belongs to, is a cartel of oil-producing countries that agree on how much oil each will produce.'
      - 'Remember: cartel members agree on price but keep their own shops.'
      - 'The trap is A, syndicate. In a syndicate, members sell through one central selling agency, not on their own.'
    hint: 'Which combination fixes prices while members keep selling separately?'
    why:
      A: 'In a syndicate, members sell through one common selling agency.'
      B: 'In a merger, the firms lose their separate identities and become one.'
      D: 'A consortium joins firms to carry out one large project, not to fix prices.'

  26:
    answer: A
    steps:
      - 'This is the prospectus, a document of a public company.'
      - 'A prospectus is issued by a public limited company inviting the public to buy its shares or debentures.'
      - 'It describes the company and its directors, the types and number of shares offered, their price and how to apply, so investors can decide whether to buy.'
      - 'When a bank in Nigeria offers new shares to the public, it publishes a prospectus in the newspapers and through stockbrokers.'
      - 'Remember: a prospectus is for prospective shareholders.'
      - 'The trap is C, an open indent. An indent is an order for goods from abroad, not an offer of shares.'
    hint: 'What does a company publish when it invites the public to buy its shares?'
    why:
      B: 'An invoice is a bill for goods sold.'
      C: 'An open indent is an order for goods abroad that leaves the agent to choose the supplier.'
      D: 'A closed indent is an order for goods abroad that names the supplier.'

  27:
    answer: D
    steps:
      - 'This is the irredeemable bond, a type of government security.'
      - 'A bond is a loan to a government or company on which interest is paid. A redeemable bond is repaid on a fixed date; an irredeemable bond has no repayment date.'
      - 'The holder of an irredeemable bond is paid interest for as long as he holds it, but the capital is never repaid by the borrower. To get his money back, he must sell the bond to someone else on the stock exchange.'
      - 'A pension fund in Lagos that buys an irredeemable bond receives interest every year, and sells the bond on the exchange if it needs the cash.'
      - 'Remember: irredeemable means never redeemed, interest for ever.'
      - 'The trap is C, a redeemable bond. That is repaid on a fixed date, so its capital is paid back.'
    hint: 'Which bond is never repaid?'
    why:
      A: 'A long-term loan is repaid at the end of its term.'
      B: 'A development bond is repaid on a fixed date.'
      C: 'A redeemable bond is repaid on its redemption date.'

  28:
    answer: A
    steps:
      - 'This is the overdraft, a bank service.'
      - 'An overdraft is a facility that lets a current account holder withdraw more than he has in the account, up to an agreed limit.'
      - 'The account goes into debit (a negative balance), and interest is charged only on the amount overdrawn and only for as long as it is overdrawn.'
      - 'A trader in Balogun market with a current account at First Bank is allowed to overdraw up to ₦500,000 to buy stock before the festive season.'
      - 'Remember: overdraft, draw over what you have.'
      - 'The trap is B, advance. A loan or advance is paid into a separate loan account and interest is charged on the whole sum; the current account does not go into debit.'
    hint: 'What is it called when a current account goes below zero by agreement?'
    why:
      B: 'A loan or advance is a fixed sum in a separate account, with interest on the whole sum.'
      C: 'Interest is the charge on a loan, not a type of loan.'
      D: 'Commission is a charge for a service, not a loan.'

  29:
    answer: D
    steps:
      - 'This is called-up capital, one type of share capital.'
      - 'Authorized capital is the most a company may issue. Issued capital is the part offered and allotted to shareholders. Called-up capital is the part of issued capital that the company has asked shareholders to pay so far.'
      - 'Companies often ask for the price of shares in instalments: on application, on allotment and on later calls. The amounts asked for up to now form the called-up capital; the rest is uncalled capital.'
      - 'If a company issues 1,000,000 shares at ₦2 and asks for ₦1.50 on each so far, its called-up capital is ₦1,500,000.'
      - 'Remember: called up is what has been called for.'
      - 'The trap is C, issued capital. Issued capital is the full value of shares allotted; the part payments asked for are called-up capital.'
    hint: 'What name is given to the part of the share price that has been asked for so far?'
    why:
      A: 'Subscribed capital is the full value of shares taken up by subscribers.'
      B: 'Authorized capital is the most a company may issue, in its memorandum.'
      C: 'Issued capital is the full value of shares allotted, not the part payments.'

  30:
    answer: A
    steps:
