    answer: D
    steps:
      - 'This is the transport of petroleum products, a matter of choosing the right mode of transport.'
      - 'Petrol, diesel and kerosene are bulky liquids needed in every town every day, so they need a mode that can carry bulk cheaply to every place.'
      - 'From the refineries and import jetties the products go to depots, partly by pipeline and coastal vessel. From the depots, road tankers carry them to filling stations all over the country. Road reaches every town; air is far too costly for bulk fuel.'
      - 'The long queues of petrol tankers on the roads out of the depots at Apapa in Lagos show how most fuel reaches filling stations in Nigeria.'
      - 'Remember: fuel to the pump goes by tanker on the road.'
      - 'The trap is C, sea. Ships bring imported fuel to the coast, but they cannot take it to inland filling stations.'
    hint: 'How does petrol reach the filling station in your town?'
    why:
      A: 'A bank pays for the fuel; it does not carry it.'
      B: 'Air transport is too costly for bulky fuel and cannot reach every town.'
      C: 'Ships bring fuel to coastal depots, but road tankers carry it inland.'

