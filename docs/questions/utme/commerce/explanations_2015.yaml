    answer: A
    steps:
      - 'This is the marketing concept, a business philosophy.'
      - 'The marketing concept says a business succeeds by first finding out exactly what consumers want and then producing goods of the quality that meets those wants, at a profit.'
      - 'The firm studies its market through research, designs the product around the customer and checks satisfaction afterwards. It starts with the consumer, not with the factory.'
      - 'A Nigerian drinks maker that learns from research that customers want smaller, cheaper sachets and then makes them is using the marketing concept.'
      - 'Remember: find out what they want, then make it.'
      - 'The trap is C, product orientation. A product-oriented firm also cares about quality, but it decides quality by itself and assumes buyers will come, without first finding out what consumers desire.'
    hint: 'Which approach starts by finding out what consumers want?'
    why:
      B: 'The promotion mix is the blend of advertising, personal selling, sales promotion and publicity.'
      C: 'Product orientation focuses on the product the firm thinks is good, not on what consumers desire.'
      D: 'The product mix is the full range of products a firm sells.'

