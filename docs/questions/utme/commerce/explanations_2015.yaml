      - 'This is the floating policy, a type of marine insurance policy.'
      - 'A floating policy covers several shipments of goods by sea under one policy, for an agreed total sum insured.'
      - 'The trader declares each shipment as it is made, and its value is taken off the total until the sum is used up. This saves him taking out a new policy for every shipment.'
      - 'An exporter at Apapa who sends cocoa to Europe in many shipments a year can take one floating policy instead of a separate policy each time.'
      - 'Remember: the policy floats along with each ship.'
      - 'The trap is C, fire insurance. Fire policies cover buildings and stock on land; the floating policy belongs to marine insurance.'
    hint: 'Which class of insurance covers goods shipped by sea?'
    why:
      B: 'Motor insurance covers vehicles on the road, not shipments of goods.'
      C: 'Fire insurance covers property on land against fire.'
      D: 'Life assurance covers a person''s life, not cargoes.'

