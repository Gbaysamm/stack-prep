format_version: 1
exam_year: 2015
subject: COM
explanations:
  1:
    answer: A
    steps:
      - 'This is the pro-forma invoice, one of the documents used in buying and selling.'
      - 'A pro-forma invoice is an invoice sent before the goods are sold. It looks like a real invoice, but it does not ask the buyer to settle a debt; it shows what the goods would cost.'
      - 'A seller sends one as a formal quotation, when goods go out on approval or on consignment, and when the buyer must pay before the goods are sent (cash with order). With a regular customer the price and terms are already agreed, so the seller simply sends the goods with an ordinary invoice.'
      - 'A Kano importer asks a foreign supplier for a pro-forma invoice so that his bank can open a letter of credit. A Balogun trader who buys from the same wholesaler every week just gets an ordinary invoice with each delivery.'
      - 'Remember: pro-forma means "for the sake of form", a paper sent before the real deal.'
      - 'The trap is C, goods sent on approval. Those goods are not yet sold, so the buyer gets a pro-forma invoice, not an ordinary one.'
    hint: 'When does a seller already know the buyer well enough to skip the advance paper?'
    why:
      B: 'A pro-forma invoice is often used as a formal quotation, so it is needed here.'
      C: 'Goods on approval are not yet sold, so they go with a pro-forma invoice.'
      D: 'When payment is wanted before delivery, the pro-forma invoice tells the buyer how much to pay.'

  2:
    answer: B
    steps:
      - 'This is the limited liability company, a business unit owned by shareholders.'
      - 'Its distinguishing feature is that it is a separate legal person, apart from its owners. This is called corporate personality.'
      - 'Because it is a legal person, it can own property, sign contracts, and sue and be sued in its own name. If it owes money, the creditor sues the company, not the shareholders.'
      - 'If a customer takes Dangote Cement Plc to court, the case is against the company itself, not against each of its many shareholders.'
      - 'Remember: a company has its own name in court.'
      - 'The trap is D, limited resources. Limited liability means the owners'' risk is limited to what they put into their shares; it does not mean the company is short of money. Companies are usually the best-funded businesses.'
    hint: 'What can a company do in its own name that a sole trader cannot?'
    why:
      A: 'Sole proprietors run their own separate businesses; a company is owned by shareholders.'
      C: 'A partnership has no separate legal personality; a company does.'
      D: 'Limited liability limits the owners'' risk, not the company''s resources; companies usually raise the most capital.'

  3:
    answer: C
    steps:
      - 'This is construction, a branch of industrial occupation.'
      - 'Construction means building and putting up structures: houses, roads, bridges and dams.'
      - 'Industrial occupations split into extractive (taking from nature), manufacturing (making goods from raw materials) and construction (building). Bricklaying raises the walls of a building, so it is construction.'
      - 'On a building site in Abuja the bricklayer raises the walls while road workers lay the tarmac outside; both are doing construction.'
      - 'Remember: if it puts up a structure, it is construction.'
      - 'The trap is D, car assembling. It is industrial work, but it makes a product in a factory, so it is manufacturing, not construction.'
    hint: 'Which of these puts up a structure, like a house or a road?'
    why:
      A: 'Shoe-making turns leather into a product, so it is manufacturing.'
      B: 'Blacksmithing shapes metal into tools, so it is manufacturing.'
      D: 'Car assembling puts parts together into a product in a factory, so it is manufacturing.'

  4:
    answer: B
    steps:
      - 'This is the Articles of Association, one of the two main documents filed to register a company.'
      - 'The Memorandum of Association governs the company''s dealings with the outside world. The Articles of Association are its internal rules.'
      - 'The Articles set out the rights and duties of directors, how they are appointed and removed, the voting rights of shareholders, how meetings are held and how shares are transferred. The name, objects, share capital and limited liability clauses are in the Memorandum.'
      - 'A new company registering with the Corporate Affairs Commission files both documents; its Articles might say that a third of the directors retire every year.'
      - 'Remember: the Memorandum faces outside, the Articles run the inside.'
      - 'The trap is A, the objectives of the company. The objects clause is a main part of the Memorandum, not the Articles.'
    hint: 'Which document holds the internal rules of the company?'
    why:
      A: 'The objects clause is in the Memorandum of Association.'
      C: 'The share capital is stated in the Memorandum of Association.'
      D: 'The limited liability clause is in the Memorandum of Association.'

  5:
    answer: D
    steps:
      - 'This is the growth of commercial activity in Nigeria, from barter to modern trade.'
      - 'Commerce grew as the hindrances to exchange were removed: money replaced barter, transport overcame distance, and banks gave safe payment and credit.'
      - 'Currencies, from cowries to the naira, made buying and selling easy. Roads, railways and ports carried goods. Banks kept money safe and lent to traders. Traders'' unions grew up later to protect their members; they did little to create trade itself.'
      - 'The railway from Lagos to Kano opened up the groundnut and cotton trade of the North, and banks such as First Bank gave traders credit.'
      - 'Remember: money, movement and banks built commerce; the unions came after it.'
      - 'The trap is A, development of banks. Banks gave credit and safe payment, which were vital to the growth of trade.'
    hint: 'Which of these came after trade had grown, rather than helping it to grow?'
    why:
      A: 'Banks gave traders credit and a safe way to pay, so they did much for commerce.'
      B: 'Transport carried goods across the country and to the ports, opening up trade.'
      C: 'Money ended the problems of barter and made exchange easy.'

  6:
    answer: A
    steps:
      - 'These are the factors that determine the choice of occupation.'
      - 'A person''s choice of job depends on things about the person and the job: skill and ability, training, interest, capital, pay and environment.'
      - 'Skill is critical because a job can only be done by someone able to do it. A surgeon needs surgical skill and a tailor needs sewing skill; without it a person cannot take the job however much he wants it.'
      - 'A young man in Aba who has learnt shoe-making as an apprentice can set up as a shoemaker; one who has not learnt the skill cannot.'
      - 'Remember: you can only choose the jobs you can do.'
      - 'The trap is B, the exchange rate of the naira. It affects prices and trade across the whole economy, not which job a person chooses.'
    hint: 'Which of these is about the person and what he can do?'
    why:
      B: 'The exchange rate affects import prices, not a person''s choice of job.'
      C: 'The national budget is government spending; it does not decide which job a person chooses.'
      D: 'Public holidays are the same for most jobs, so they do not decide the choice.'

  7:
    answer: A
    steps:
      - 'This is poste restante, a postal service.'
      - 'Poste restante (French for "letters remaining") means the post office keeps letters for a person with no fixed address until he comes to collect them.'
      - 'The sender addresses the letter to the person, "Poste Restante", at a named post office. The person calls there and shows proof of identity to collect it.'
      - 'A tourist spending a few weeks in Calabar could have letters sent to "Poste Restante, Head Post Office, Calabar" and collect them there.'
      - 'Today travellers mostly keep in touch by mobile phone and e-mail, so poste restante is little used, but the term still means the same thing.'
      - 'Remember: poste restante, the letter rests at the post office.'
      - 'The trap is B, recorded delivery. That gets a signature when a letter is delivered to an address; it does not help someone with no address.'
    hint: 'Which service lets the post office hold letters until the person comes to collect them?'
    why:
      B: 'Recorded delivery gets a signature at an address; it needs an address to deliver to.'
      C: 'The postmaster runs the post office; he is not a service for receiving letters.'
      D: 'Parcel post sends packages to an address, not letters for people with no address.'

  8:
    answer: D
    steps:
      - 'This is liquidation, the winding up of a company.'
      - 'When a company is wound up, its assets are sold and the money is paid out in a fixed order. The residual owners are those who take whatever is left at the end.'
      - 'First the costs of winding up and the preferential debts, such as taxes and wages, are paid, then secured creditors such as debenture holders, then unsecured creditors, then preference shareholders. Ordinary shareholders come last and take what remains.'
      - 'If a Lagos company is wound up with ₦10 million left after all creditors and preference shareholders are paid, that ₦10 million goes to the ordinary shareholders.'
      - 'Remember: ordinary shareholders are first for risk and last for repayment.'
      - 'The trap is C, preference shareholders. They are paid before ordinary shareholders, so they are not the residual owners.'
    hint: 'Who is paid last, after everybody else, when a company is wound up?'
    why:
      A: 'Debenture holders are creditors, often secured on the assets, and are paid early.'
      B: 'Creditors are paid before any shareholder gets anything.'
      C: 'Preference shareholders are paid before ordinary shareholders.'

  9:
    answer: A
    steps:
      - 'These are the aids to trade, the services that make merchandising, the buying and selling of goods, possible.'
      - 'Aids to trade remove the hindrances to trade: banking removes the hindrance of payment, insurance of risk, transport of place, warehousing of time, and advertising and communication of knowledge.'
      - 'Banking, insurance and transportation are all aids to trade, so this whole set helps goods to be bought and sold.'
      - 'A trader in Onitsha pays a Lagos supplier through his bank, insures the goods in transit and has them brought by lorry. Without these three the deal would hardly happen.'
      - 'Remember: banks for payment, insurance for risk, transport for place.'
      - 'The trap is C. Communication and banking are aids to trade, but manufacturing is production, not an aid to trade.'
    hint: 'Which set is made only of aids to trade?'
    why:
      B: 'Management runs a business; it is not an aid to trade.'
      C: 'Manufacturing is production, not an aid to trade.'
      D: 'Trading and production are not aids to trade; trading is what the aids serve.'

  10:
    answer: D
    steps:
      - 'This is trade, the heart of commerce.'
      - 'Commerce is made up of trade and the aids to trade. Trade is the buying and selling of goods and services.'
      - 'Every aid to trade, from banking to transport, exists to help trade happen. Take trade away and the aids have nothing to serve, so trade is the pivot around which all of commerce turns.'
      - 'Around Onitsha main market the banks, lorries, warehouses and insurers are all there because of the buying and selling inside it.'
      - 'Remember: trade is the hub, the aids are the spokes.'
      - 'The trap is C, price. Price guides each sale, but it is part of trade, not the centre of commerce.'
    hint: 'Commerce is made up of which two parts, and which one do the others serve?'
    why:
      A: 'A tariff is a tax on imports; it affects trade but is not its centre.'
      B: 'Taxation raises government revenue; it is not the centre of commerce.'
      C: 'Price is part of each sale, but trade itself is the centre of commerce.'

  11:
    answer: B
    steps:
      - 'This is the procedure in the purchase and sale of goods in home trade.'
      - 'The buyer and seller exchange documents in a fixed order: enquiry, quotation, order, then invoice (followed by delivery and payment).'
      - 'The buyer sends an enquiry asking about goods, prices and terms. The seller replies with a quotation (or a price list or catalogue). The buyer then places an order, and the seller sends the goods with an invoice showing what is owed.'
      - 'A supermarket in Ibadan sends an enquiry to a biscuit maker, gets a quotation, places an order for 500 cartons and receives an invoice with the delivery.'
      - 'Remember: ask, quote, order, bill. Enquiry, quotation, order, invoice.'
      - 'The trap is A, order, sale and invoice. "Sale" is the whole deal, not a document; the seller''s reply to an enquiry is the quotation.'
    hint: 'What does the seller send back after an enquiry?'
    why:
      A: '"Sale" is not a step or document; the reply to an enquiry is a quotation.'
      C: '"Placement" is not a document in the procedure; the seller replies with a quotation.'
      D: 'Bargaining is not a formal step; the seller''s reply to an enquiry is a quotation.'

  12:
    answer: D
    steps:
      - 'This is hire purchase, a way of buying on credit.'
      - 'Under hire purchase the buyer pays a deposit, takes the goods, and pays the rest in instalments. The goods remain the seller''s until the last instalment is paid.'
      - 'The great advantage to the customer is that he enjoys the goods now and pays over time. The seller gains more sales and profit, and the maker gains from larger production, but those are not the customer''s gains.'
      - 'A teacher in Enugu pays a deposit on a refrigerator and takes it home the same day, paying the rest monthly from her salary.'
      - 'Remember: hire purchase is use now, pay later.'
      - 'The trap is A, a low interest rate. Hire purchase prices include a high interest charge, so the customer pays more than the cash price.'
    hint: 'What does the customer get before he has finished paying?'
    why:
      A: 'Hire purchase charges a high rate of interest, so this is not an advantage.'
      B: 'More turnover and profit is the seller''s advantage, not the customer''s.'
      C: 'Economies of scale benefit the manufacturer, not the customer directly.'

  13:
    answer: B
    steps:
      - 'This is the Standards Organisation of Nigeria (SON), a regulatory agency.'
      - 'SON sets the standards that products made or sold in Nigeria must meet, and checks that they meet them.'
      - 'It writes the Nigerian Industrial Standards, tests products, certifies those that pass with the MANCAP mark for local goods, and checks imported goods against the standards.'
      - 'A Nigerian paint maker must meet SON''s standard for paint before its tins carry the quality mark.'
      - 'Remember: SON, Standards Organisation, sets the standard.'
      - 'The trap is D, the Manufacturers Association of Nigeria. MAN speaks for manufacturers; it does not enforce government quality standards.'
    hint: 'Which body has "standards" in its name?'
    why:
      A: 'A consumers'' association speaks for buyers but cannot enforce government standards.'
      C: 'A chamber of commerce promotes trade among its members; it does not set quality standards.'
      D: 'MAN represents manufacturers; it does not enforce quality specifications.'

  14:
    answer: D
    steps:
      - 'This is FORTRAN, a high-level computer language.'
      - 'FORTRAN stands for FORmula TRANslation. It was designed in the 1950s for scientific and engineering calculations.'
      - 'It handles long mathematical formulae quickly, so scientists and engineers used it for problems in physics, engineering and weather forecasting. COBOL was built for business records and BASIC for beginners.'
      - 'Today many scientists also use newer languages such as Python, but FORTRAN is still used for heavy scientific calculations.'
      - 'A university engineering department working out the loads on a bridge would, in the past, have written its program in FORTRAN.'
      - 'Remember: FORTRAN is FORmula TRANslation, the language of formulae.'
      - 'The trap is A, COBOL. COBOL means Common Business Oriented Language, so it is for business, not science.'
    hint: 'Which language''s name means formula translation?'
    why:
      A: 'COBOL is the Common Business Oriented Language, built for business data.'
      B: 'ADA was built mainly for defence and other large, safety-critical systems.'
      C: 'BASIC was designed as a simple language for beginners.'

  15:
    answer: B
    steps:
      - 'These are the sources of finance for a business, such as owners'' capital, bank loans, trade credit, shares and debentures.'
      - 'To choose between them, a business evaluates each source by what it costs and how hard it is to repay.'
      - 'Each source has a cost: interest on a loan, dividends on shares. Each has repayment terms: a short overdraft must be repaid soon, a long debenture later, and owners'' capital never. The business picks the source whose cost and repayment it can bear.'
      - 'A Kaduna bakery comparing a bank loan at a high interest rate with credit from a cooperative at a lower rate, repaid over two years, chooses by cost and repayment.'
      - 'Remember: count the cost and the payback before you borrow.'
      - 'The trap is D, the decree establishing the business. Only a public corporation is set up by decree, and the decree does not compare one source of funds with another.'
    hint: 'What would you compare first between a loan and a share issue?'
    why:
      A: 'Where the lender''s head office is does not change the cost or terms of the funds.'
      C: 'The lender''s number of branches does not affect the cost of the funds or how they are repaid.'
      D: 'Most businesses are not set up by decree, and a decree does not compare sources of funds.'

  16:
    answer: C
    steps:
      - 'This is the primary market, the part of the capital market where new shares are sold for the first time.'
      - 'A company raises new capital in the primary market by issuing shares through an issuing house, by one of the standard methods.'
      - 'The methods are a public issue by prospectus (the company offers shares to the public directly), an offer for sale (an issuing house buys the shares and sells them to the public), placing (the shares are sold privately to chosen investors), a rights issue to existing shareholders, and an issue by tender.'
      - 'When a Nigerian bank raises new capital, it publishes a prospectus, and an issuing house may also place some shares with pension funds.'
      - 'Remember: prospectus, offer for sale and placing sell new shares; a bill of exchange only pays for goods.'
      - 'The trap is D. It has prospectus and offer for sale, but a bill of exchange is a means of payment in trade, not a way to issue shares.'
    hint: 'Which set has no item that belongs to payment or general promotion?'
    why:
      A: 'Personal selling, publicity and advertising are promotion methods, not methods of issuing shares.'
      B: 'A bill of exchange is a means of payment, not a method of issuing shares.'
      D: 'A bill of exchange is a means of payment, not a method of issuing shares.'

  17:
    answer: B
    steps:
      - 'This is commercialization of public enterprises.'
      - 'Commercialization means a government-owned enterprise stays in public hands but is run like a business, aiming to cover its costs and make a profit without relying on government grants.'
      - 'Its managers are given freedom to set prices, control costs and serve customers, and they are judged on results. The enterprise becomes more efficient and stops draining the government purse.'
      - 'Under Nigeria''s privatization and commercialization programme, some government enterprises were left in public hands but told to run on business lines, paying their way from what they charge customers.'
      - 'Remember: commercialize means run it like a business, but the government still owns it.'
      - 'The trap is D. Commercialization reduces the government''s burden of running businesses; it does not push the government to set up more of them.'
    hint: 'When a government enterprise is told to run like a business, what should improve?'
    why:
      A: 'Commercialization aims at efficiency and profit; it does not promise higher salaries.'
      C: 'On-the-job training happens in any organization; it is not an advantage of commercialization.'
      D: 'Commercialization reduces government''s role in running businesses rather than adding to it.'

  18:
    answer: A
    steps:
      - 'This is the rate of turnover (rate of stock turn), the number of times a trader sells his average stock in a period.'
      - 'Rule: $\text{Rate of turnover} = \dfrac{\text{Cost of goods sold}}{\text{Average stock}}$, with $\text{Cost of goods sold} = \text{Opening stock} + \text{Purchases} - \text{Closing stock}$ and $\text{Average stock} = \dfrac{\text{Opening stock} + \text{Closing stock}}{2}$.'
      - 'Cost of goods sold = ₦5,600 + ₦9,700 − ₦4,400 = ₦10,900.'
      - 'Average stock = (₦5,600 + ₦4,400) ÷ 2 = ₦10,000 ÷ 2 = ₦5,000.'
      - 'Rate of turnover = ₦10,900 ÷ ₦5,000 = 2.18 times. Check: sales ₦15,000 − cost of goods sold ₦10,900 = ₦4,100, which is the gross profit given.'
      - 'A provisions dealer in Mile 12 market who turns his stock over 2.18 times a year sells his average stock about twice in the year; a higher figure means goods move faster.'
      - 'Remember: cost of sales over average stock, both at cost price.'
      - 'The trap is C, 3.00 times. That divides sales (at selling price) by average stock (at cost price), mixing two different prices.'
    hint: 'Work out the cost of goods sold first, then the average stock.'
    why:
      B: '3.50 does not follow from the formula; cost of goods sold over average stock gives 2.18.'
      C: 'Dividing sales by average stock mixes selling price with cost price.'
      D: 'Using ₦10,000 (opening plus closing stock) as cost of goods sold gives 2.00; the cost of goods sold is ₦10,900.'

  19:
    answer: A
    steps:
      - 'This is the consular invoice, a document in foreign trade.'
      - 'A consular invoice is an invoice certified by the consul (embassy official) of the importing country who is stationed in the exporting country.'
      - 'The consul checks and signs that the value and origin of the goods are correctly stated. The customs officers of the importing country then use it to confirm that the import duty charged on the goods is accurate, since duty is worked out on value.'
      - 'For goods shipped from Germany to Apapa, the Nigerian consular official in Germany would certify the invoice, and Nigerian Customs would use it to check the duty.'
      - 'Remember: the consul certifies the value, customs checks the duty.'
      - 'The trap is D, the bill of lading. It is the receipt and document of title for goods shipped by sea; it does not confirm the duty.'
    hint: 'Which document is signed by an official of the importing country to confirm the value of the goods?'
    why:
      B: 'An indent is an importer''s order to an agent to buy goods abroad; it does not confirm duty.'
      C: 'A shipping note tells the port which goods are to be loaded on a ship; it does not confirm duty.'
      D: 'A bill of lading is the shipping receipt and document of title, not proof of the duty.'

  20:
    answer: A
    steps:
      - 'This is downward communication, a direction of communication in an organization.'
      - 'Downward communication flows from a superior to a subordinate, down the chain of command.'
      - 'Managers use it to give instructions, set targets, explain policies and give feedback. Messages from subordinates to superiors flow upward, and messages between people of the same rank flow horizontally (laterally).'
      - 'When a bank''s branch manager issues a memo telling the cashiers the new opening hours, that is downward communication.'
      - 'Remember: superior to subordinate, the message goes down.'
      - 'The trap is D, upward communication. That flows the other way, from subordinate to superior, such as a report or complaint.'
    hint: 'Draw the organization chart. Which way does the message move?'
    why:
      B: 'Horizontal communication is between people on the same level.'
      C: 'Lateral communication is another name for communication between equals.'
      D: 'Upward communication goes from subordinate to superior, the opposite way.'

  21:
    answer: C
    steps:
      - 'This is social responsibility of business.'
      - 'Social responsibility is the duty a business owes to the society it works in, beyond making profit for its owners.'
      - 'The first part of that duty is to give customers safe, good-quality products that do what they promise. Others are fair prices, a clean environment, and help to the community. Government agencies set rules and check them, but the duty to make safe products rests on the business that makes them.'
      - 'A noodle maker in Lagos that tests every batch and prints true ingredients and a NAFDAC number on the pack is carrying out its social responsibility.'
      - 'Remember: the maker answers for what it makes.'
      - 'The trap is D, the Standards Organisation of Nigeria. SON sets and enforces standards as a regulator; that is its legal function, not a social responsibility.'
    hint: 'Social responsibility is a duty owed by whom to society?'
    why:
      A: 'MAN speaks for manufacturers as a group; each business answers for its own products.'
      B: 'The Corporate Affairs Commission registers companies; it does not make or check products.'
      D: 'SON enforces standards as a regulator; that is a legal function, not the social responsibility of a business.'

  22:
    answer: A
    steps:
      - 'This is ECOWAS, the Economic Community of West African States.'
      - 'ECOWAS is a regional economic union of West African countries, set up by the Treaty of Lagos in 1975 to promote trade and cooperation among its members. Its headquarters is in Abuja.'
      - 'In 2015 it had fifteen members: Benin, Burkina Faso, Cape Verde, Côte d''Ivoire, The Gambia, Ghana, Guinea, Guinea-Bissau, Liberia, Mali, Niger, Nigeria, Senegal, Sierra Leone and Togo. Mauritania had left in 2000, and Cameroon, Chad and Gabon are in Central Africa, not ECOWAS.'
      - 'Togo, Nigeria and Ghana are all members, which is why a Ghanaian trader can bring goods to Lagos along the Abidjan to Lagos corridor under the ECOWAS trade scheme.'
      - 'Since then Burkina Faso, Mali and Niger have left ECOWAS (in January 2025), but Togo, Nigeria and Ghana are still members.'
      - 'Remember: check every country in a list; one outsider makes the whole list wrong.'
      - 'The trap is B. Burkina Faso, Nigeria and Niger were members in 2015, but Mauritania had already left.'
    hint: 'Check each country. Is any of them in Central Africa, or no longer a member?'
    why:
      B: 'Mauritania left ECOWAS in 2000.'
      C: 'Cameroon is in Central Africa and is not a member of ECOWAS.'
      D: 'Chad and Gabon are in Central Africa and are not members of ECOWAS.'

  23:
    answer: D
    steps:
      - 'This is the Nigerian Ports Authority (NPA), the agency that runs the country''s seaports.'
      - 'The NPA provides and manages the port facilities through which goods enter and leave Nigeria by sea.'
      - 'It provides berths, cranes, pilotage, tugboats and storage space so that ships can be loaded and offloaded quickly and safely. Faster cargo handling cuts the time ships wait and the cost of trade.'
      - 'At Apapa and Tin Can Island ports in Lagos, cranes on the quay offload containers of imported goods onto trucks and load exports such as cocoa onto ships.'
      - 'Remember: N P A, the ports, the cranes, the cargo.'
      - 'The trap is A. Getting goods to their final destinations is the work of transporters and freight forwarders, not the ports authority.'
    hint: 'What happens to cargo at a seaport?'
    why:
      A: 'Moving goods to their final destinations is done by transporters and clearing agents, not the NPA.'
      B: 'Courier services are run by NIPOST and private courier firms, not the NPA.'
      C: 'Giving shelter to cargo operators is not a function of the ports authority.'

  24:
    answer: B
    steps:
      - 'This is the prospectus, a document used when a company sells shares to the public.'
      - 'A prospectus is a document that invites the public to buy a company''s shares and gives the facts they need to decide.'
      - 'It describes the company''s history, directors, business, past profits, the number and price of the shares on offer, and how to apply. It must be approved by the Securities and Exchange Commission before it is published.'
      - 'When a Nigerian bank raises new capital, its prospectus is published in newspapers and online so investors can study it and apply for shares.'
      - 'Remember: a prospectus is the prospect''s guide to the shares.'
      - 'The trap is C, a dividend warrant. That is the cheque-like document that pays dividends to shareholders after they own shares.'
    hint: 'Which document invites the public to buy shares?'
    why:
      A: 'A deed is a formal signed legal document, such as a partnership deed, not an advertisement for shares.'
      C: 'A dividend warrant pays dividends to existing shareholders.'
      D: 'A memorandum of satisfaction records that a charge or debt has been paid off.'

  25:
    answer: D
    steps:
      - 'This is NACCIMA, the Nigerian Association of Chambers of Commerce, Industry, Mines and Agriculture.'
      - 'A chamber of commerce is an association of businesses in a city or state that promotes their interests. NACCIMA is the national umbrella body to which the chambers are affiliated.'
      - 'It speaks for business to government, gathers trade information, organizes trade fairs and links Nigerian business with chambers abroad.'
      - 'The Lagos Chamber of Commerce and Industry, which organizes the Lagos International Trade Fair, is one of the chambers affiliated to NACCIMA.'
      - 'Remember: NACCIMA spells out the four sectors: Commerce, Industry, Mines and Agriculture.'
      - 'The trap is A. It sounds right but is not the body''s name; the national body is NACCIMA.'
    hint: 'The national body''s name covers commerce, industry, mines and agriculture.'
    why:
      A: 'This is not the name of the national body; it is NACCIMA.'
      B: 'The Nigeria Labour Congress is the umbrella body of trade unions of workers, not chambers of commerce.'
      C: 'The stock exchange is a market for securities, not an association of chambers.'

  26:
    answer: C
    steps:
      - 'This is transportation, an aid to trade.'
      - 'Transportation is the movement of goods and people from one place to another.'
      - 'Goods are made in one place and wanted in another. Transport carries them from the producer to the wholesaler, retailer and consumer, so it removes the hindrance of place and makes distribution possible.'
      - 'Tomatoes grown in Kano reach Lagos markets by lorry; without transport they would rot where they grew.'
      - 'Remember: no transport, no distribution.'
      - 'The trap is A, advertising. It tells buyers about goods, but it does not move them.'
    hint: 'Which aid to trade physically moves goods to buyers?'
    why:
      A: 'Advertising informs buyers about goods but does not move them.'
      B: 'Branding gives a product an identity; it does not distribute it.'
      D: 'Trading is the buying and selling itself, not the aid that moves the goods.'

  27:
    answer: A
    steps:
      - 'This is industrial arbitration, a way of settling trade disputes.'
      - 'Arbitration means an independent body hears both sides of a dispute and gives a decision.'
      - 'When the employer and the workers'' union cannot settle a dispute by talks, mediation or conciliation, the Minister of Labour refers it to the Industrial Arbitration Panel, which hears both sides and makes an award. A party who objects can go on to the National Industrial Court.'
      - 'If a union of factory workers in Ikeja and their employer deadlock over a pay rise, the dispute can go to the Industrial Arbitration Panel.'
      - 'Remember: when talks fail, arbitration decides.'
      - 'The trap is D, the personnel unit. It handles disputes inside the firm first, but it belongs to the employer, so it cannot settle a dispute the two sides have failed to resolve.'
    hint: 'Where does a dispute go when the two sides cannot agree on their own?'
    why:
      B: 'A disciplinary committee deals with offences by staff, not disputes between employer and union.'
      C: 'The Code of Conduct Bureau deals with the conduct of public officers, such as asset declaration.'
      D: 'The personnel unit is part of the employer, so it cannot judge an unresolved dispute between the two sides.'

  28:
    answer: C
    steps:
      - 'This is the chain store, a form of large-scale retailing.'
      - 'A chain store is a department store that is run in many branches in different towns, under one owner and one name.'
      - 'Like a multiple shop it has many branches, central buying and the same look everywhere. Like a departmental store each branch sells many kinds of goods in separate departments under one roof.'
      - 'In Nigeria, stores such as Kingsway, UTC and Leventis once had large department stores in many cities; today Shoprite runs branches across the country.'
      - 'Remember: chain store = branches of a multiple shop + departments of a department store.'
      - 'The trap is B. A hypermarket is one very large self-service store, usually out of town; a chain store is built from the multiple shop and the department store.'
    hint: 'A chain store has many branches, and each branch has many departments. Which two forms is that?'
    why:
      A: 'Stalls are small market units, nothing like a chain store.'
      B: 'A hypermarket is one huge self-service store, not a department store run in branches.'
      D: 'Mail order sells by post without shops, so it is not part of a chain store.'

  29:
    answer: A
    steps:
      - 'This is delegation of authority, a principle of management.'
      - 'Delegation means a superior gives a subordinate the authority to carry out a task on his behalf, while he remains responsible for it.'
      - 'How much a manager delegates, and to whom, is his own choice. It depends on his trust in the subordinate and his style. Unity of command, unity of direction and span of control are rules built into the organization''s structure, not personal choices.'
      - 'A branch manager of a First Bank branch may choose to let her assistant approve small withdrawals while she is away; another manager may keep that power to himself.'
      - 'Remember: you may choose to delegate authority, but you can never delegate responsibility.'
      - 'The trap is C, span of control. It is the number of subordinates a manager can supervise well, fixed by the organization''s design, not by preference.'
    hint: 'Which of these does a manager decide to do, or not, at his own discretion?'
    why:
      B: 'Unity of direction is a rule that one plan and one head guide each group of activities.'
      C: 'Span of control is set by the organization''s structure, not by the manager''s preference.'
      D: 'Unity of command is a rule that each worker has one boss; it is not a matter of choice.'

  30:
    answer: D
    steps:
      - 'This is secondary production, one of the three types of production.'
      - 'Primary production takes resources from nature (farming, mining, fishing). Secondary production turns raw materials into finished goods or puts up structures. Tertiary production gives services.'
      - 'Manufacturing changes the form of raw materials, and construction puts up buildings and roads, so both are secondary production.'
      - 'A factory in Ota that turns cement and sand into blocks, and the builders who use the blocks to put up houses, are both in secondary production.'
      - 'Remember: primary takes, secondary makes, tertiary serves.'
      - 'The trap is B, primary production. That is only taking from nature, such as mining or farming, before anything is made.'
    hint: 'Take, make or serve: which one is manufacturing?'
    why:
      A: 'Direct services are personal services such as those of doctors and lawyers, not making or building.'
      B: 'Primary production only takes resources from nature.'
      C: 'Tertiary production gives services such as trade, banking and transport.'

  31:
    answer: C
    steps:
      - 'This is the scope of commerce, shown as a tree.'
      - 'Commerce is made up of two main branches: trade (buying and selling) and aids to trade (the services that help trade).'
      - 'In the tree, Commerce splits into Trade and I. Trade then splits into II (with Retailer and Wholesaler under it, so II is home trade) and Foreign (export and import). The other main branch of commerce, beside trade, must be aids to trade: banking, insurance, transport, communication, advertising, warehousing and tourism.'
      - 'An Onitsha trader selling cloth is in trade; the bank, lorry and insurer that help him are the aids to trade.'
      - 'Remember: commerce = trade + aids to trade.'
      - 'The trap is B, home trade. Home trade is box II, under Trade, made up of retail and wholesale; I is beside Trade, not under it.'
    hint: 'Commerce has two main branches. One is trade. What is the other?'
    why:
      A: 'Publicity is one kind of promotion, not a main branch of commerce.'
      B: 'Home trade is box II under Trade, not box I beside it.'
      D: 'Advertising is one of the aids to trade, not the whole branch.'

  32:
    answer: A
    steps:
      - 'These are the classes of occupation.'
      - 'Occupations are grouped into three: industrial, commercial and services (direct and indirect).'
      - 'Industrial occupations produce goods (extractive, manufacturing and construction). Commercial occupations distribute goods (trade and aids to trade). Services are given by people such as doctors, teachers, the police and civil servants.'
      - 'In one Nigerian family the father farms cocoa (industry), the mother sells provisions in the market (commerce) and the daughter is a nurse (services).'
      - 'Remember: make it, move it, serve people: industry, commerce, services.'
      - 'The trap is D. Construction is only one part of industry, and trade is only one part of commerce, so they are not the three main classes.'
    hint: 'Which set gives a broad class for making, distributing and serving?'
    why:
      B: 'Manufacturing is part of industry, so the list repeats one class and leaves out services.'
      C: 'Farming, banking and trading are individual occupations, not the three main classes.'
      D: 'Construction is part of industry and trade is part of commerce, so these are not the main classes.'

  33:
    answer: D
    steps:
      - 'This is life assurance and the names of its parties.'
      - 'Assurance covers an event that is certain to happen, such as death; insurance covers an event that may or may not happen, such as fire. In assurance the company is the assurer and the person who takes out the policy is the assured.'
      - 'The assured pays premiums to the assurer. On his death, or when the policy matures, the assurer pays the agreed sum to him or his beneficiaries.'
      - 'A teacher in Ilorin who takes out a life policy with an insurance company and pays monthly premiums is the assured.'
      - 'Remember: assurance has assurer and assured; insurance has insurer and insured.'
      - 'The trap is C, insured. That is the name for the policyholder in general insurance, such as fire or motor insurance, not in life assurance.'
    hint: 'Life assurance uses the "assure" family of words. Which one is the policyholder?'
    why:
      A: 'The assurer is the company that gives the life cover, not the person who takes it out.'
      B: 'The insurer is the company in general insurance.'
      C: 'The insured is the policyholder in general insurance, not life assurance.'

  34:
    answer: B
    steps:
      - 'This is the social responsibility of business.'
      - 'A business must consider how all its actions affect the society it works in: its customers, workers, neighbours and the environment.'
      - 'It needs society''s goodwill to survive. Pollution, unsafe goods or unfair treatment of workers harm society and, in the end, the business itself. So a good firm weighs the effects of its decisions on society, not only on its profit.'
      - 'An oil company in the Niger Delta must consider how spills affect the farmers and fishermen around it, not only how much oil it sells.'
      - 'Remember: business lives in society, so it must care for society.'
      - 'The trap is A, profit. Profit is the aim of the business, but the overall effect of its actions falls on society.'
    hint: 'Who feels the overall effects of what a business does?'
    why:
      A: 'Profit is what the business aims at; society is what its actions affect.'
      C: 'The product is what the business makes, not the thing its actions affect overall.'
      D: 'Competitors are one small group; the overall effect is on society as a whole.'

  35:
    answer: D
    steps:
      - 'This is fidelity guarantee, a kind of insurance.'
      - 'Fidelity guarantee is an undertaking that protects an employer against loss caused by the dishonesty of an employee, such as theft or fraud.'
      - 'The guarantor (usually an insurance company) promises to make good any loss caused by the employee''s dishonesty. It is in effect a guarantee of the employee''s integrity.'
      - 'A bank in Port Harcourt takes out fidelity guarantee cover on its cashiers, so that if one steals cash, the insurer pays the loss.'
      - 'Remember: fidelity means faithfulness, so the guarantee covers faithfulness.'
      - 'The trap is A, subrogation. That is the insurer''s right, after paying a claim, to take over the insured''s rights against a third party; it has nothing to do with integrity.'
    hint: 'Which term contains a word that means faithfulness?'
    why:
      A: 'Subrogation is the insurer''s right to take over the insured''s claims after paying.'
      B: 'Insurable interest is a financial stake in the thing insured, needed to take out a policy.'
      C: 'Proximate cause is the nearest, direct cause of a loss, used to decide a claim.'

  36:
    answer: A
    steps:
      - 'These are the qualities of good money.'
      - 'Good money must be acceptable, durable, portable, divisible, homogeneous, recognisable, stable in value and relatively scarce.'
      - 'Scarcity means the supply of money is limited. If money could be had in unlimited amounts, as leaves on a tree, it would lose its value and nobody would accept it. That is why the Central Bank of Nigeria controls how much naira is issued.'
      - 'When too many naira notes chase the same goods, prices rise and each note buys less, which shows why money must stay scarce.'
      - 'Remember: money must be scarce to be worth something.'
      - 'The trap is B, unlimited supply. Plenty of money sounds good, but unlimited money would be worthless.'
    hint: 'What would happen to the value of money if anyone could have as much as he wanted?'
    why:
      B: 'Money in unlimited supply would lose its value.'
      C: 'Good money must be durable; perishable money would rot or wear away.'
      D: 'Good money must be divisible into small units for small purchases.'

