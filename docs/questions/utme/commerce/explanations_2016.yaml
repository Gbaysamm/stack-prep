format_version: 1
exam_year: 2016
subject: COM
explanations:
  1:
    answer: A
    steps:
      - 'This is compulsory dissolution, one of the two ways a business is brought to an end.'
      - 'Dissolution can be voluntary, when the owners themselves decide to end the business, or compulsory, when the law forces it to end. Compulsory dissolution comes by an order or declaration of a court.'
      - 'A creditor who is owed money, or a partner who has a dispute, petitions the court. If the court finds that the business cannot pay its debts, or that a partner is insane or guilty of misconduct, it declares the business dissolved and a liquidator sells its assets to pay the creditors.'
      - 'If a Lagos company owes its suppliers ₦50 million and cannot pay, the suppliers can ask the Federal High Court to wind it up. The court''s order, not the owners'' wish, ends the company.'
      - 'Remember: compulsory means the court compels it; voluntary means the owners volunteer it.'
      - 'The trap is C, an unfavourable economic climate. Hard times may make a business fail, but they do not dissolve it by themselves; a court order is still needed for a compulsory ending.'
    hint: 'Who can force a business to close against its owners'' wishes?'
    why:
      B: 'An agreement by the owners ends the business voluntarily, not compulsorily.'
      C: 'A bad economy may cause losses, but only a court declaration makes the dissolution compulsory.'
      D: 'When the period fixed for the business runs out, it ends by its own agreement, which is voluntary.'

  2:
    answer: D
    steps:
      - 'This is the pro-forma invoice, one of the documents used in buying and selling.'
      - 'A pro-forma invoice is an invoice sent before the goods are sold. It looks like a real invoice, but it does not ask the buyer to settle a debt; it shows what the goods would cost.'
      - 'A seller sends one as a formal quotation, when goods go out on approval or on consignment, and when the buyer must pay before the goods are sent (cash with order). With a regular customer the price and terms are already agreed, so the seller simply sends the goods with an ordinary invoice.'
      - 'A Kano importer asks a foreign supplier for a pro-forma invoice so that his bank can open a letter of credit. A Balogun trader who buys from the same wholesaler every week just gets an ordinary invoice with each delivery.'
      - 'Remember: pro-forma means "for the sake of form", a paper sent before the real deal.'
      - 'The trap is A, goods sent on approval. Those goods are not yet sold, so the buyer gets a pro-forma invoice, not an ordinary one.'
    hint: 'When does a seller already know the buyer well enough to skip the advance paper?'
    why:
      A: 'Goods on approval are not yet sold, so they go with a pro-forma invoice.'
      B: 'A pro-forma invoice is often used as a formal quotation, so it is needed here.'
      C: 'When payment is wanted before delivery, the pro-forma invoice tells the buyer how much to pay.'

  3:
    answer: C
    steps:
      - 'This is the cost of goods sold, the cost of the stock a trader actually sold in the period.'
      - 'Rule: $\text{Cost of goods sold} = \text{Opening stock} + \text{Purchases} - \text{Closing stock}$. Sales are not used; they come in only later, when gross profit is found.'
      - 'Goods available for sale = ₦40,000 + ₦115,000 = ₦155,000. Take away what is still on the shelf: ₦155,000 − ₦60,000 = ₦95,000.'
      - 'Check: gross profit would be ₦250,000 − ₦95,000 = ₦155,000, a sensible positive figure, and ₦95,000 lies between the stock held and the goods available.'
      - 'An Onitsha provisions dealer starts the year with ₦40,000 of goods, buys ₦115,000 more and has ₦60,000 left at the end. She has sold goods that cost her ₦95,000.'
      - 'Remember: what you had, plus what you bought, minus what is left, is what you sold.'
      - 'The trap is D, ₦155,000. That is the goods available for sale; the closing stock has not yet been taken away.'
    hint: 'Start with opening stock plus purchases. What must you then take away?'
    why:
      A: '₦50,000 is too small; ₦40,000 + ₦115,000 − ₦60,000 is ₦95,000.'
      B: '₦30,000 is far too small; the goods sold cost ₦155,000 − ₦60,000 = ₦95,000.'
      D: '₦155,000 is the goods available for sale, before the closing stock is taken away.'

  4:
    answer: B
    steps:
      - 'This is the channel of distribution and its middlemen.'
      - 'The channel of distribution is the route goods take from the producer to the consumer. Middlemen are the traders and agents who stand between the two: wholesalers, retailers and agents.'
      - 'The manufacturer starts the chain and the consumer ends it, so neither is a middleman. A set made up entirely of middlemen must leave both of them out.'
      - 'Cartons of Indomie leave the factory, pass through a distributor''s agent and a wholesaler at Idumota, and reach a shop in Surulere before a student buys them. The agent, the wholesaler and the shop are the middlemen.'
      - 'Remember: middlemen are in the middle, never at the two ends.'
      - 'The trap is D, wholesalers, agents and consumers. Two of them are middlemen, but the consumer is the last link, where the goods come to rest.'
    hint: 'Who starts the chain and who ends it? Leave both out.'
    why:
      A: 'Manufacturers start the chain and consumers end it; only retailers are middlemen.'
      C: 'Manufacturers are producers at the start of the chain, not middlemen.'
      D: 'Consumers are the last link in the chain, not middlemen.'

  5:
    answer: C
    steps:
      - 'This is the current ratio, also called the working capital ratio.'
      - 'It compares what the business can turn into cash within a year with what it must pay within a year: $\text{Current ratio} = \dfrac{\text{Current assets}}{\text{Current liabilities}}$.'
      - 'Current assets are stock ₦1,250, debtors ₦480, bank ₦3,000 and cash ₦20, so $1{,}250 + 480 + 3{,}000 + 20 = ₦4{,}750$. Plant and machinery and the motor van are fixed assets and are left out.'
      - 'Current liabilities are creditors ₦1,000 and accruals ₦187.50, so $1{,}000 + 187.50 = ₦1{,}187.50$. Capital, net profit and drawings belong to the owner and are not liabilities to outsiders.'
      - 'Current ratio $= \dfrac{4{,}750}{1{,}187.50} = 4$, written 4:1. Check: $1{,}187.50 \times 4 = 4{,}750$. SONU Enterprises has ₦4 of current assets for every ₦1 it owes in the short term, which is comfortable.'
      - 'Remember: current over current; the textbook guide is about 2:1.'
      - 'The trap is D, 4.5:1. It comes from leaving the accruals out of current liabilities; accrued expenses are bills already owed, so they must be counted.'
    hint: 'List only the current assets and only the current liabilities, then divide.'
    why:
      A: '5:1 would need current liabilities of only ₦950; creditors and accruals together are ₦1,187.50.'
      B: '25.5:1 is far too large; it does not come from current assets over current liabilities.'
      D: '4.5:1 leaves the accruals out of current liabilities.'

  6:
    answer: D
    steps:
      - 'This is the acid-test ratio, also called the quick ratio or liquid ratio.'
      - 'It is the current ratio with stock taken out, because stock may take time to sell: $\text{Acid-test ratio} = \dfrac{\text{Current assets} - \text{Stock}}{\text{Current liabilities}}$.'
      - 'Current assets are ₦4,750 (stock ₦1,250, debtors ₦480, bank ₦3,000, cash ₦20). Quick assets $= 4{,}750 - 1{,}250 = ₦3{,}500$. Current liabilities are creditors plus accruals, ₦1,187.50.'
      - 'Acid-test ratio $= \dfrac{3{,}500}{1{,}187.50} = 2.947\ldots \approx 2.95$, written 2.95:1. Check: it must be smaller than the current ratio of 4:1, because stock has been removed, and it is.'
      - 'A Balogun fabric seller may hold a store full of lace, but if a supplier demands payment tomorrow, only her cash, bank balance and money owed by customers can pay quickly. That is what the acid test measures.'
      - 'Remember: the acid test burns off the stock.'
      - 'The trap is B, 4.75:1. That is ₦4,750 divided by ₦1,000: it keeps the stock in and leaves the accruals out.'
    hint: 'Take stock away from the current assets first, then divide by the current liabilities.'
    why:
      A: '5.55:1 is larger than the current ratio, which a ratio with stock removed can never be.'
      B: '4.75:1 keeps stock in the assets and leaves accruals out of the liabilities.'
      C: '4.25:1 is still larger than the current ratio; removing stock must give a smaller figure.'

  7:
    answer: A
    steps:
      - 'This is form utility, one of the kinds of utility that production creates.'
      - 'Utility is the power of a good to satisfy a want. Form utility is added when raw materials are changed into a shape that people can use.'
      - 'Raw cotton cannot be worn, but when it is spun, woven and sewn it becomes a shirt. The change of form has made it useful. Transport adds place utility and storage adds time utility.'
      - 'At the Dangote refinery crude oil is turned into petrol, and in a Kano tannery hides are turned into leather. Each change of form creates form utility.'
      - 'Remember: change the form, create form utility.'
      - 'The trap is D, place utility. That comes from moving goods to where they are wanted, not from changing what they are made into.'
    hint: 'What changes when cotton becomes a shirt: its place, its time or its form?'
    why:
      B: 'Marginal utility is the extra satisfaction from one more unit consumed, not something production creates.'
      C: 'Time utility comes from storing goods until they are needed, as warehousing does.'
      D: 'Place utility comes from moving goods to where they are needed, as transport does.'

  8:
    answer: A
    steps:
      - 'This is one of the functions of commerce, what it makes possible for society.'
      - 'Commerce covers trade and the aids to trade: banking, transport, insurance, communication, warehousing and advertising. Because of it, people can specialize and still get everything else they need.'
      - 'Without commerce each family would have to grow, make and build everything for itself. With commerce millions of specialists, from farmers to doctors, are linked by buying and selling, so a large, complex and well-organized society can work.'
      - 'A banker in Victoria Island eats rice grown in Kebbi, wears cloth woven in Aba and drives a car made in Japan, all because commerce links them.'
      - 'Remember: commerce turns many separate specialists into one organized society.'
      - 'The trap is B, a simple and organized society. A simple society, where people produce for themselves, is what existed before commerce grew.'
    hint: 'Is life with banks, ports and markets simpler or more complex than life on a family farm?'
    why:
      B: 'A simple society, where each family meets its own needs, is the stage before commerce.'
      C: 'Subsistence means producing only for your own needs, which commerce moves people away from.'
      D: 'Self-sufficiency is the opposite of what commerce brings; commerce makes people rely on one another.'

  9:
    answer: C
    steps:
      - 'This is uberrimae fidei, the principle of utmost good faith.'
      - 'It requires both parties to an insurance contract, especially the insured, to disclose every material fact that could affect the insurer''s decision to accept the risk or fix the premium.'
      - 'The insured knows the risk better than the insurer, so the insurer relies on the proposal form. If a material fact is hidden or misstated, the insurer can refuse to pay a claim and treat the policy as void.'
      - 'A Port Harcourt man who insures his life but does not say he has had two heart attacks breaks utmost good faith, and his family may lose the claim.'
      - 'Remember: uberrimae fidei, utmost faith, tell the whole truth.'
      - 'The trap is A, caveat emptor. That means "let the buyer beware", the rule in ordinary sales; insurance runs on the opposite rule of full disclosure.'
    hint: 'Which principle is about telling the insurer everything?'
    why:
      A: 'Caveat emptor, "let the buyer beware", is the rule of ordinary sales, not of insurance disclosure.'
      B: 'Subrogation gives the insurer the insured''s rights against a third party after paying a claim.'
      D: 'Indemnity restores the insured to the position he was in before the loss, no better.'

  10:
    answer: A
    steps:
      - 'This is the meaning of production in Commerce.'
      - 'Production is the creation of goods and services to satisfy human wants. In Commerce it is not complete until the goods reach the final consumer.'
      - 'So production has two parts: changing the form of goods (industry) and making them available where and when they are needed (commerce and direct services). Both create utility.'
      - 'Garri processed in an Ogun village is only half produced until a trader carries it to a Lagos market and a buyer takes it home.'
      - 'Remember: production ends in the consumer''s hand, not at the factory gate.'
      - 'The trap is D, the manufacturing of goods only. That stops production at the factory and leaves out distribution and services.'
    hint: 'Is production complete when goods leave the factory?'
    why:
      B: 'Making goods available is only the commercial part; production also changes their form.'
      C: 'Assembling parts is only one stage of manufacturing, not the whole of production.'
      D: 'Manufacturing alone leaves out distribution and services, which are also production.'

  11:
    answer: B
    steps:
      - 'This is the merchant wholesaler, the most common kind of wholesaler.'
      - 'A merchant wholesaler buys goods from producers with his own money, takes ownership (title) of them, stores them and resells them at a profit. He bears the risk if they do not sell.'
      - 'Agent middlemen are different: a factor, a broker or a del credere agent sells goods for a principal and earns a commission, but never owns the goods.'
      - 'A trader at Onitsha Main Market who buys a trailer-load of Peak milk from the makers, stores it and sells cartons to retailers from across the South-East is a merchant wholesaler.'
      - 'Remember: the merchant owns the goods; the agent only sells them for someone else.'
      - 'The trap is D, a del credere agent. He guarantees that the buyers he finds will pay, which makes him sound like a big trader, but he is still an agent who never takes ownership.'
    hint: 'Which of these people actually owns the goods he sells?'
    why:
      A: 'A factor holds and sells goods in his own name for a principal, but the goods are not his.'
      C: 'A broker only brings buyer and seller together for a commission; he does not own or hold the goods.'
      D: 'A del credere agent guarantees payment by the buyers for an extra commission, but he is still an agent, not an owner.'

  12:
    answer: A
    steps:
      - 'This is the pro-forma invoice.'
      - 'A pro-forma invoice is an advance invoice that tells a buyer what goods will cost before they are sent or sold.'
      - 'It sets out the price of each item, discounts and charges, so the buyer knows how much to pay or to arrange through the bank. It works like a formal quotation.'
      - 'An importer in Apapa takes a pro-forma invoice from his Chinese supplier to his bank, which uses the prices on it to open a letter of credit.'
      - 'Remember: pro-forma says "this is what it will cost".'
      - 'The trap is B, quantity of goods. The pro-forma lists quantities too, but its purpose is to tell the buyer the price before payment or sale.'
    hint: 'What does a buyer most need to know before he pays in advance?'
    why:
      B: 'Quantities are listed, but the purpose of a pro-forma invoice is to state the price.'
      C: 'Quality is shown by samples, catalogues or specifications, not by a pro-forma invoice.'
      D: 'The description of goods appears on many documents; the pro-forma invoice is sent to state the price.'

  13:
    answer: D
    steps:
      - 'This is capital, one of the four factors of production.'
      - 'Capital is man-made wealth used to produce more goods and services: machines, tools, buildings, vehicles and raw materials. Its reward is interest.'
      - 'Capital is not consumed for its own sake. A machine is wanted because it helps make other goods, which is why capital is called a produced means of production.'
      - 'A bakery in Ibadan uses its ovens, mixers and delivery van to make and sell bread. Those are its capital.'
      - 'Remember: capital is goods that make other goods.'
      - 'The trap is B, money regarded as assets. Money is often called capital in business, but in production capital means the real goods, like machines, that money buys.'
    hint: 'Is a factory machine wanted for itself, or for what it helps to make?'
    why:
      A: 'Goods bought for final consumption are consumer goods, used up to satisfy wants, not capital.'
      B: 'Money is only a claim on resources; as a factor of production capital means real man-made goods.'
      C: 'Services that give satisfaction are consumed directly; they are not capital.'

  14:
    answer: A
    steps:
      - 'This is the Bureau of Public Enterprises (BPE).'
      - 'Privatization is selling all or part of a government-owned enterprise to private owners. Commercialization is making a public enterprise run on business lines, covering its costs and earning a profit.'
      - 'The BPE is the agency that carries out both. It prepares the enterprises, finds buyers and oversees the sale, under the Public Enterprises (Privatisation and Commercialisation) Act of 1999, with the National Council on Privatisation making the policy.'
      - 'The BPE handled the sale of the old PHCN power companies in 2013, and of many other public firms.'
      - 'Remember: B P E, the Bureau that Privatizes Enterprises.'
      - 'The trap is C, the Technical Committee on Privatization and Commercialization. That was the first body for the job, set up in 1988, but the BPE replaced it and has done the work since.'
    hint: 'Which body is still in charge today, not the one that started the work?'
    why:
      B: 'The stock exchange is the market where shares of privatized firms are traded; it does not run privatization. It is now Nigerian Exchange Limited.'
      C: 'The Technical Committee was the first privatization body, but the BPE replaced it.'
      D: 'The Securities and Exchange Commission regulates the capital market, not the privatization process.'

  15:
    answer: A
    steps:
      - 'This is the premium.'
      - 'A premium is the amount the insured pays to the insurer, usually monthly or yearly, in return for cover under the policy.'
      - 'The insurer pools the premiums of many people and uses the pool to pay the few who suffer losses. The bigger the risk, the bigger the premium.'
      - 'A Lagos car owner pays a premium to his insurance company each year to keep his motor policy in force.'
      - 'Remember: premium is the price of cover.'
      - 'The trap is D, commission. Commission is what the insurance broker or agent earns for bringing the business, not what the insured pays for cover.'
    hint: 'What is the regular price of insurance cover called?'
    why:
      B: 'The surrender value is what the insured receives if he ends a life policy early, not what he pays.'
      C: 'A bond is a loan security or a guarantee, not the regular payment for insurance.'
      D: 'Commission is earned by the agent or broker, not paid by the insured for cover.'

  16:
    answer: C
    steps:
      - 'This is NIPOST, the Nigerian Postal Service.'
      - 'NIPOST is the public postal service. Its main service is collecting, sorting and delivering letters and parcels across Nigeria and abroad.'
      - 'Mail posted at a post office goes to a sorting centre, then by road or air to the town it is addressed to, and is delivered to a house, a P.O. Box or a private bag. NIPOST also sells stamps, rents P.O. Boxes and runs EMS courier.'
      - 'A student in Jos who posts his school certificate to a university in Nsukka uses NIPOST mail delivery.'
      - 'Remember: NIPOST carries the post.'
      - 'The trap is D, telephone. Telephone services were run by NITEL and are now run by mobile networks such as MTN and Glo, not by NIPOST.'
    hint: 'What does a post office carry?'
    why:
      A: 'Railway transport is run by the Nigerian Railway Corporation, not by NIPOST.'
      B: 'Electronic mail is sent over the internet through email providers, not delivered by NIPOST.'
      D: 'Telephone services were run by NITEL and now by mobile networks, not by NIPOST.'

  17:
    answer: C
    steps:
      - 'This is the ocean liner, a type of ship used in sea transport.'
      - 'Liners are ships that run on fixed routes, on a published timetable, whether they are full or not. Ocean liners do this across the oceans; coastal liners do it along a coast.'
      - 'Tramp steamers are the opposite: they have no fixed route or timetable and go wherever a cargo is offered, under a charter.'
      - 'A container line whose ships call at Apapa from Europe on fixed days, week after week, is running ocean liners.'
      - 'Remember: a liner keeps to its line and its timetable, like a scheduled bus.'
      - 'The trap is A, coastal liners. They do keep a timetable, but they sail along the coast, not across the ocean.'
    hint: 'Which ships keep a timetable and cross whole oceans?'
    why:
      A: 'Coastal liners keep a timetable but sail along the coast, not across the ocean.'
      B: 'Tramp steamers have no fixed route or timetable; they go wherever cargo is found.'
      D: 'Ferries carry people and vehicles across short stretches of water, such as a lagoon or river.'

  18:
    answer: D
    steps:
      - 'These are non-insurable risks.'
      - 'A risk is insurable when the chance of loss can be worked out from past records and the loss is accidental, so many people can share it through premiums. Non-insurable risks cannot be measured or are taken on purpose.'
      - 'Gambling is a loss a person chooses to risk in hope of gain. No insurer will cover it, because the insured controls the risk and the loss is not accidental. Trading losses and changes in fashion are non-insurable too, because they cannot be measured.'
      - 'A man who loses ₦100,000 betting on a football match cannot claim it from any insurance company, but if his shop burns down he can claim under a fire policy.'
      - 'Remember: you can insure against bad luck, not against a bet.'
      - 'The trap is A, death. Death is certain, but its timing can be worked out from mortality tables, so life assurance covers it.'
    hint: 'Which of these is a loss a person chooses to risk?'
    why:
      A: 'Death is covered by life assurance; its timing can be measured from mortality tables.'
      B: 'Marine risks are covered by marine insurance on hulls, cargo and freight.'
      C: 'Damage to property is covered by fire and other property insurance.'

  19:
    answer: A
    steps:
      - 'This is the contract of employment, and the rights it gives an employee.'
      - 'A contract of employment binds the employer and employee to duties. The employer''s duties are the employee''s rights: to be paid the agreed wages, to be given safe working conditions and the tools and facilities to do the work, and to be repaid expenses incurred on the job.'
      - 'An employee cannot do his duties without a safe place and the right tools, so the law expects the employer to provide them. Profits, promotion and the choice of directors are not rights of an employee.'
      - 'A factory in Ikeja must give its machine operators safety boots, guards on machines and working equipment. A worker injured because of unsafe machines can claim compensation.'
      - 'Remember: the employer''s duty is the employee''s right.'
      - 'The trap is B, a share of the profits. Profits belong to the owners; an employee is paid wages whether the firm makes a profit or not.'
    hint: 'What must an employer give a worker so that he can do his job safely?'
    why:
      B: 'Profits belong to the owners; an employee earns wages, not a share of profit, unless a bonus is agreed.'
      C: 'Promotion depends on merit and vacancies; no contract makes it a yearly right.'
      D: 'Directors are chosen by the shareholders, not by the employees.'

  20:
    answer: A
    steps:
      - 'This is pollution, and which kind does the most harm.'
      - 'Pollution is the release of harmful substances or energy into the environment. Air, water, soil and noise pollution all harm people, but air pollution reaches the most people and is the hardest to avoid.'
      - 'Everybody must breathe the air around them all the time. Smoke, fumes and dust cause lung and heart diseases, and the wind carries them far from where they started. The World Health Organization names air pollution as the greatest environmental danger to health.'
      - 'Gas flaring in the Niger Delta, generator fumes in Lagos homes and the black soot that hung over Port Harcourt are all air pollution that people cannot escape.'
      - 'Remember: you can choose what you drink, but not what you breathe.'
      - 'The trap is B, water pollution. It is very dangerous too, but water can be boiled, filtered or bought clean, while polluted air cannot be avoided.'
    hint: 'Which one does every person take in, every minute, wherever they are?'
    why:
      B: 'Water pollution is serious, but water can be treated or replaced; polluted air cannot be avoided.'
      C: 'Soil pollution harms crops and land, but it reaches people less directly than air pollution.'
      D: 'Noise pollution disturbs and can damage hearing, but it is far less deadly than air pollution.'

  21:
    answer: B
    steps:
      - 'This is tourism in foreign trade, and the difference between visible and invisible trade.'
      - 'Visible trade is trade in goods that can be seen and touched. Invisible trade is trade in services, such as tourism, shipping, banking and insurance. An export brings money into the country; an import sends money out.'
      - 'When foreign tourists come to Nigeria, they pay for hotels, transport, food and guides here. Nigeria has sold them a service, and foreign money comes in, so it is an invisible export.'
      - 'Visitors from abroad who come to the Argungu Fishing Festival or the Calabar Carnival and spend dollars in Nigerian hotels give Nigeria invisible export earnings.'
      - 'Remember: money comes in, it is an export; no goods cross the border, it is invisible.'
      - 'The trap is D, intangible imports. That would be Nigerians spending money on holidays abroad, where the money goes out.'
    hint: 'Does the money come into Nigeria or go out, and are any goods shipped?'
    why:
      A: 'Visible exports are goods such as crude oil and cocoa; tourism sells a service, so it is invisible.'
      C: 'Tangible imports are goods bought from abroad; foreign tourists bring money in, not goods.'
      D: 'An invisible import would be Nigerians spending on holidays abroad; here foreigners spend in Nigeria.'

  22:
    answer: B
    steps:
      - 'This is computer hardware.'
      - 'Hardware is the physical parts of a computer, the parts you can touch. Software is the programs that tell the hardware what to do.'
      - 'Every computer has three basic hardware units: input units (keyboard, mouse) to put data in, the central processing unit to work on it, and output units (screen, printer) to give out the results.'
      - 'A cashier''s computer at a Shoprite till takes in prices through a barcode scanner, works out the total in its CPU and prints the receipt. Each of those is hardware.'
      - 'Remember: hardware is hard, you can touch it; software is the instructions inside.'
      - 'The trap is C, memory. Memory is one part of the hardware, not the whole that input, output and processing units make up.'
    hint: 'Can you touch the input, output and processing units?'
    why:
      A: 'Software is the programs, which cannot be touched; input, output and processing units are physical.'
      C: 'Memory is one part of the hardware, not what the three units together make up.'
      D: 'A printer is only one output device, not the whole set of components.'

  23:
    answer: A
    steps:
      - 'This is consumer protection.'
      - 'Consumer protection is the set of laws, agencies and actions that guard consumers against exploitation by sellers: fake or harmful goods, short measures, false advertising and unfair prices.'
      - 'Its aim is that consumers get value for their money, which means safe products of good quality. Agencies set standards and check products, and consumer education and the law are the means of reaching that aim.'
      - 'NAFDAC registers food and drugs, and SON sets standards for goods, so that the noodles and paracetamol sold in Nigerian shops are safe and of good quality.'
      - 'Remember: protect the consumer, protect the quality.'
      - 'The trap is C, adequate consumer awareness. Awareness is a means of protection, through consumer education, not the end it aims at.'
    hint: 'What does a cheated consumer most need to be sure of?'
    why:
      B: 'Increasing aggregate demand is an aim of government economic policy, not of consumer protection.'
      C: 'Consumer awareness is a means of protection, not its main aim.'
      D: 'Product variety comes from competition; protection is about safe, quality products.'

  24:
    answer: C
    steps:
      - 'This is the demographic environment of business.'
      - 'The demographic environment is the make-up of the population a business serves: its size, age distribution, sex, ethnic mix, education and where people live.'
      - 'These facts tell a business who its customers are and what they will buy. A young population wants different goods from an old one, and the level of education affects how a firm advertises.'
      - 'Nigeria has a very young population, so mobile networks and fast-food chains aim much of their advertising at young people in the cities.'
      - 'Remember: demographic is about the people, demos means people.'
      - 'The trap is A, cultural environment. Culture is about beliefs, values and customs; the age, ethnic mix and education of consumers are population facts, which are demographic.'
    hint: 'Which environment studies the population itself?'
    why:
      A: 'The cultural environment is about beliefs, values and customs, not the age and size of the population.'
      B: 'The natural environment is land, climate and natural resources.'
      D: 'The economic environment is incomes, prices, interest rates and the state of the economy.'

  25:
    answer: B
    steps:
      - 'This is extraction, a branch of industrial occupation.'
      - 'Extraction, or the extractive occupation, is taking raw materials directly from nature: from the land, the sea and under the ground.'
      - 'It includes mining, quarrying, drilling for oil, fishing and lumbering. The raw materials it gets are then used by manufacturing, the next stage of production.'
      - 'Fishermen in the creeks of Bayelsa, tin miners on the Jos Plateau and oil companies drilling offshore in the Niger Delta are all in extraction.'
      - 'Remember: extract means draw out, from land and sea.'
      - 'The trap is A, manufacturing. Manufacturing changes raw materials into finished goods; it does not take them from land and sea.'
    hint: 'Which activity draws raw materials out of nature?'
    why:
      A: 'Manufacturing changes raw materials into finished goods; it does not take them from nature.'
      C: 'Construction builds houses, roads and bridges from materials already obtained.'
      D: 'Distribution moves finished goods to consumers; it is commerce, not extraction.'

  26:
    answer: A
    steps:
      - 'This is secondary occupation, also called secondary production.'
      - 'Occupations are grouped into primary (taking from nature, such as farming and mining), secondary (turning raw materials into finished goods, manufacturing and construction) and tertiary (commerce and services).'
      - 'Soap-making takes raw materials such as palm oil and caustic soda and turns them into bars of soap. That is manufacturing, so it is a secondary occupation.'
      - 'Women in Abeokuta making black soap (ose dudu) from palm kernel oil and cocoa pod ash, and the big soap factories in Lagos, are both in secondary occupation.'
      - 'Remember: primary takes, secondary makes, tertiary serves.'
      - 'The trap is B, primary occupation. Palm oil comes from a primary activity, but turning it into soap is manufacturing, which is secondary.'
    hint: 'Does soap-making take from nature, make something new, or serve people?'
    why:
      B: 'Primary occupation takes materials from nature; soap-making turns them into a product.'
      C: 'Construction builds structures such as houses and roads, not consumer goods like soap.'
      D: 'Tertiary occupation is commerce and services, not making goods.'

  27:
    answer: B
    steps:
      - 'This is the central focus of commerce.'
      - 'Commerce is all the activities involved in the distribution of goods and services from producers to consumers: trade (buying and selling) and the aids to trade.'
      - 'Marketing is exactly that work: finding out what consumers want and getting goods to them through buying and selling. Pricing and advertising are only two parts of marketing, and the aids to trade exist to support it.'
      - 'A rice mill in Kebbi sells only when its bags are priced, advertised, transported, financed and stocked in shops in Lagos. All of that is marketing, and all of it is commerce.'
      - 'Remember: commerce is about selling what has been made, and selling is marketing.'
      - 'The trap is C, advertising. It is an aid to trade and one tool of marketing, not the centre of all commercial activity.'
    hint: 'Pricing and advertising are both parts of what bigger activity?'
    why:
      A: 'Pricing is only one element of the marketing mix, not the centre of commerce.'
      C: 'Advertising is one aid to trade and one tool of marketing, not the whole focus.'
      D: 'Farming is production from the land, an industrial activity, not commerce.'

  28:
    answer: D
    steps:
      - 'These are the aids to trade, and the one closest to communication.'
      - 'Communication is the passing of messages and information from one place to another. Transportation is the movement of goods and people from one place to another.'
      - 'Both overcome the barrier of distance, and both carry something from sender to receiver. For centuries messages travelled by transport, by runners, ships, trains and postal vans, so the two are always taught together as "transport and communication".'
      - 'A Kano trader phones an order to a Lagos importer, and the goods then come north by trailer. The phone call is communication and the trailer is transportation; trade needs both.'
      - 'Remember: communication moves the message, transportation moves the goods.'
      - 'The trap is C, banking. Banks use communication for transfers, but banking removes the barrier of finance, not of distance.'
    hint: 'Which aid, like communication, carries things across distance?'
    why:
      A: 'Insurance removes the barrier of risk, not of distance.'
      B: 'Warehousing removes the barrier of time by storing goods until they are needed.'
      C: 'Banking removes the barrier of finance; it is not the aid linked with moving things across distance.'

  29:
    answer: B
    steps:
      - 'This is skilled and unskilled labour, two kinds of labour as a factor of production.'
      - 'Skilled labour has special knowledge gained through education and training, such as doctors, engineers and electricians. Unskilled labour needs little or no training and mainly uses physical effort.'
      - 'What separates the two is how much education and training the worker has had. Higher pay usually follows from the training, but the pay is a result, not the test.'
      - 'A trained electrician in Ibadan who wires a house is skilled labour; a labourer who carries blocks on the same site is unskilled labour.'
      - 'Remember: training turns labour into skilled labour.'
      - 'The trap is C, salaries and wages. Skilled workers often earn more, but pay is a result of skill, and it varies with many other things.'
    hint: 'What does a skilled worker have that an unskilled one does not?'
    why:
      A: 'Available resources describe the firm, not the worker''s skill.'
      C: 'Pay follows from skill and varies with other things; it does not define skill.'
      D: 'Skilled and unskilled workers can be equally committed; commitment is not skill.'

  30:
    answer: C
    steps:
      - 'These are direct services, a kind of service occupation.'
      - 'Direct services are personal services rendered straight to the person who pays for them, such as a doctor, lawyer, barber or tailor. Indirect services serve the public as a whole and are paid for by the government.'
      - 'In his hospital job a government doctor is paid from public funds. When he treats patients at home after work, each patient pays him directly for a personal service, so there he is a direct service worker.'
      - 'A doctor at a General Hospital in Enugu who sees patients in his house in the evening and collects a fee from each one is giving direct service.'
      - 'Remember: direct service, direct payment from the person served.'
      - 'The trap is A, a direct and an indirect service worker. That describes the doctor across his whole day, but the question asks only about his work at home, which is direct.'
    hint: 'Who pays the doctor for the treatment at home?'
    why:
      A: 'The question is about his home work only, and there he serves and is paid by each patient directly.'
      B: 'Indirect services are rendered to the public and paid by government, not by each patient at home.'
      D: 'A community developer works on projects for a whole community, not on private patients.'

  31:
    answer: A
    steps:
      - 'This is extractive occupation, a branch of industrial occupation.'
      - 'Extractive occupation takes natural resources directly out of the earth, the sea or the air: mining, quarrying, oil drilling, fishing and lumbering.'
      - 'An oil exploration company searches for crude oil under the ground or seabed and drills it out. It takes the resource from nature, so it is extractive. Refining that crude into petrol would be manufacturing.'
      - 'The companies that drill for crude oil in the Niger Delta and offshore in the Gulf of Guinea are engaged in extractive occupation.'
      - 'Remember: drill it, dig it, catch it, cut it, it is extraction.'
      - 'The trap is C, secondary production. That would be refining the oil into petrol or diesel, not finding and drilling it.'
    hint: 'Is the company taking oil out of nature or turning it into something new?'
    why:
      B: 'Constructive occupation builds structures such as roads and houses; it does not take resources from nature.'
      C: 'Secondary production turns raw materials into finished goods, as a refinery does, not drilling.'
      D: 'Tertiary production is commerce and services, not taking oil from the ground.'

  32:
    answer: D
    steps:
      - 'These are indirect services, one of the two kinds of services.'
      - 'Direct services are rendered to one person who pays for them, like a doctor, lawyer or barber. Indirect services are rendered to the public as a whole and are paid for by the government.'
      - 'Civil servants, the police, soldiers and teachers in public schools serve everybody at once, and their salaries come from taxes rather than from each person they serve.'
      - 'A clerk at a Federal ministry in Abuja or a police officer at a checkpoint in Ibadan renders an indirect service to all Nigerians.'
      - 'Remember: indirect services are paid indirectly, through taxes, by the government.'
      - 'The trap is C, professionals. Doctors and lawyers in private practice render direct services to the client who pays them.'
    hint: 'Who is paid by the government to serve everybody at once?'
    why:
      A: 'Traders are in commerce, buying and selling goods; they do not render indirect services.'
      B: 'Domestic servants such as cooks and drivers serve one household directly.'
      C: 'Professionals such as doctors and lawyers render direct services to individual clients.'

  33:
    answer: D
    steps:
      - 'This is a cash discount, one of the terms of trade.'
      - 'A cash discount is an amount taken off the invoice price to encourage the buyer to pay quickly. It is written as discount/days, net credit period.'
      - 'Here the discount is 3% and the days are 9, so the first part is 3/9. If the buyer does not pay within nine days, the full (net) amount is due within the normal credit period, usually 30 days. So the term is 3/9, net 30.'
      - 'A wholesaler in Aba invoices a retailer for ₦200,000 on terms 3/9, net 30. If the retailer pays within nine days she pays ₦194,000; otherwise she pays the full ₦200,000 within thirty days.'
      - 'Remember: per cent first, days second, then net and the full credit period.'
      - 'The trap is B, 9/30, net 3. It puts the days before the per cent and swaps the credit period for the discount.'
    hint: 'Which number comes first in cash-discount terms, the per cent or the days?'
    why:
      A: '"30, net 9/3" mixes the parts up; the discount and its days must come first.'
      B: '9/30, net 3 puts the days first and the discount last, the wrong way round.'
      C: '9/27, net 30 puts the days first and shows no 3% discount.'

  34:
    answer: A
    steps:
      - 'This is the bearer cheque.'
      - 'A bearer cheque is a cheque made payable to "bearer", so whoever holds and presents it at the bank can be paid in cash.'
      - 'Because anyone holding it can cash it, a bearer cheque is convenient but risky: if it is lost or stolen, the finder can collect the money. An order cheque is safer, since only the named payee can cash it.'
      - 'A trader who writes a First Bank cheque "Pay Bearer ₦20,000" and gives it to his shop boy can send the boy to cash it at the counter.'
      - 'Remember: bearer means whoever bears it.'
      - 'The trap is C, only payable into the payee''s account. That is a crossed cheque marked "account payee", the opposite of a bearer cheque.'
    hint: 'Who can cash a cheque made out to "bearer"?'
    why:
      B: 'Transverse lines make a crossed cheque, which must be paid into a bank account.'
      C: 'Payment only into the payee''s account is a crossed, "account payee" cheque.'
      D: 'A cheque bearing a later date is a post-dated cheque.'

  35:
    answer: D
    steps:
      - 'This is the balance of trade.'
      - 'The balance of trade is the difference between the value of a country''s visible exports and its visible imports in a period.'
      - 'If visible exports are greater, the balance is favourable (a surplus). If visible imports are greater, the balance is unfavourable (a deficit), because more money leaves the country for goods than comes in.'
      - 'In a year when oil prices fall, Nigeria earns less from crude oil exports. If it still imports more cars, rice and machines than it sells abroad, its balance of trade is unfavourable.'
      - 'Remember: balance of trade is goods only; more goods in than out is bad.'
      - 'The trap is B, visible exports exceed visible imports. That is a favourable balance, the opposite.'
    hint: 'Which way does the money flow when a country buys more goods than it sells?'
    why:
      A: 'Exports greater than imports gives a favourable balance, not an unfavourable one.'
      B: 'Visible exports above visible imports is a favourable balance of trade.'
      C: 'Equal imports and exports is a balanced position, neither favourable nor unfavourable.'

  36:
    answer: B
    steps:
      - 'This is unskilled labour.'
      - 'Unskilled labour is work that needs little or no training and relies mainly on physical strength, such as carrying, digging and loading.'
      - 'Skilled and professional labour depend on knowledge gained by training. White-collar jobs are office jobs that use the mind, not the body.'
      - 'The labourers who carry bags of cement at a building site in Abuja, or the alabarus who carry loads at Oyingbo market, are unskilled labour.'
      - 'Remember: unskilled labour uses the hands and back, skilled labour uses training.'
      - 'The trap is A, skilled labour. Some skilled work is physical too, but what marks it out is training, not physical effort.'
    hint: 'Which kind of labour needs strength rather than training?'
    why:
      A: 'Skilled labour is marked by training and special knowledge, not by physical effort.'
      C: 'A white-collar job is office work that uses the mind, not physical effort.'
      D: 'Professional labour depends on long training and knowledge, as with doctors and lawyers.'

  37:
    answer: D
    steps:
      - 'This is one of the functions of commerce between nations.'
      - 'No country can produce everything it needs, so countries specialize and trade. Commerce, especially foreign trade, makes nations depend on one another.'
      - 'When nations rely on each other for goods, they have a reason to stay friendly and to cooperate. Trade agreements, the ECOWAS free trade area and joint chambers of commerce all come from that interdependence.'
      - 'Nigeria sells crude oil to India and buys machines from China and wheat from abroad; that trade keeps the countries talking and cooperating.'
      - 'Remember: nations that trade together stay friends together.'
      - 'The trap is C, tourism. Tourism brings people together, but it is only one service within commerce; the interdependence between nations comes from commerce as a whole.'
    hint: 'What makes countries need one another for the goods they lack?'
    why:
      A: 'Agriculture is one kind of production; it does not by itself make nations depend on one another.'
      B: 'Socio-cultural activities bring people together but do not create economic interdependence.'
      C: 'Tourism is only one part of commerce; interdependence comes from trade as a whole.'

  38:
    answer: C
    steps:
      - 'This is the extractive industry.'
      - 'An extractive industry takes raw materials directly from nature: mining, quarrying, oil drilling, fishing and lumbering. Its products are raw materials, not finished goods.'
      - 'Iron ore is rock dug from the earth. It has not been changed in form, so it is a product of extraction. Shoes, cloth and aeroplanes are made in factories, so they are products of manufacturing.'
      - 'Iron ore mined at Itakpe in Kogi State was meant to feed the steel mill at Ajaokuta.'
      - 'Remember: if it comes out of the ground as it is, it is extractive.'
      - 'The trap is B, a textile material. Cotton is grown, but cloth is woven in a factory, which makes it manufacturing.'
    hint: 'Which of these comes out of the ground without being made?'
    why:
      A: 'A shoe is made from leather in a factory, so it is a manufactured product.'
      B: 'Textile material is woven from fibres in a factory, a manufactured product.'
      D: 'An aeroplane is assembled from many manufactured parts.'

  39:
    answer: D
    steps:
      - 'This is land, one of the four factors of production.'
      - 'Land means all natural resources: the surface of the earth, the soil, minerals, water and forests. Its reward is rent.'
      - 'Land is a gift of nature, fixed in supply, immobile and passive (it produces nothing until labour and capital work on it). It is heterogeneous: no two pieces are the same in fertility, minerals or location.'
      - 'A plot in Ikoyi and a plot of the same size in a village in Kogi are both land, but they differ greatly in value and use. Farmland in Benue is more fertile than land in the dry far north.'
      - 'Remember: land is fixed, still, passive and never the same twice.'
      - 'The trap is A, an active factor of production. Land is passive; labour is the active factor that works on it.'
    hint: 'Are any two pieces of land exactly the same?'
    why:
      A: 'Land is passive; labour is the active factor that works on it.'
      B: 'The supply of land is fixed; it cannot be increased like other goods.'
      C: 'Land cannot be moved from one place to another; it is geographically immobile.'

  40:
    answer: B
    steps:
      - 'These are the determinants of the volume of production.'
      - 'The volume of production is how much a firm produces. A firm produces only what it can sell, so the size of the market is a major determinant, together with capital, labour and technology.'
      - 'A large market, with many buyers who can pay, lets a firm produce on a large scale and enjoy economies of scale. A small market limits output, however good the machines.'
      - 'Nigeria''s very large population gives a very large market, so companies such as Dangote and Nestle produce cement and seasoning in huge quantities.'
      - 'Remember: produce only what the market can take.'
      - 'The trap is A, the availability of banks. Banks can help with finance, but having banks nearby does not decide how much the market will buy.'
    hint: 'Why would a firm make more goods than people will buy?'
    why:
      A: 'Banks help with finance, but the amount produced depends on how much can be sold.'
      C: 'Where the head office is has little to do with how much is produced.'
      D: 'The ratio of men to women affects the kind of goods demanded, not mainly the volume of production.'
