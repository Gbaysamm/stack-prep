format_version: 1
exam_year: 2017
subject: COM
explanations:
  1:
    answer: B
    steps:
      - 'This is the terms of trade, a measure used in foreign trade.'
      - 'The terms of trade is the rate at which a country''s exports exchange for its imports, worked out from their prices: $\text{Terms of trade} = \dfrac{\text{Index of export prices}}{\text{Index of import prices}} \times 100$.'
      - 'If export prices rise faster than import prices, each unit of exports buys more imports, so the terms of trade improve. If export prices fall, the same exports buy fewer imports and the terms of trade worsen.'
      - 'When the price of crude oil falls on the world market, each barrel Nigeria sells buys fewer imported cars and machines, so Nigeria''s terms of trade worsen.'
      - 'Remember: terms of trade is a rate (prices); balance of trade is an amount (values).'
      - 'The trap is D, balance of trade. That is the difference between the value of visible exports and visible imports, an amount in naira, not the rate at which one exchanges for the other.'
    hint: 'Which term compares export prices with import prices as a ratio?'
    why:
      A: 'Terms of payment are the conditions on which a buyer pays, such as cash or credit.'
      C: 'Balance of payments is the full record of a country''s dealings with the rest of the world, visible and invisible.'
      D: 'Balance of trade is the gap between the values of visible exports and imports, not a rate of exchange.'

  2:
    answer: C
    steps:
      - 'This is automatic vending, selling goods through coin-operated machines.'
      - 'Retailing is selling goods in small quantities to the final consumer. A vending machine does exactly that.'
      - 'The customer puts money into the machine, presses a button and the machine releases one item, such as a can of drink or a snack. The machine does the work of a shop attendant, so it is a modern form of retail trade.'
      - 'Vending machines selling soft drinks and snacks stand in some Lagos offices, airports and hospitals, and many now take cards as well as coins.'
      - 'Remember: one item, to the final user, so it is retail.'
      - 'The trap is A, mail-order selling. Mail order is also retailing without a shop attendant, but the goods are ordered from a catalogue and sent by post, not dropped from a machine.'
    hint: 'Who buys from the machine, and in what quantity?'
    why:
      A: 'Mail-order selling uses catalogues and the post, not coin machines.'
      B: 'Personal selling needs a salesperson face to face with the buyer.'
      D: 'Wholesaling is selling in bulk to retailers, not single items to consumers.'

  3:
    answer: D
    steps:
      - 'This is the marine policy with particular average (WPA).'
      - 'In marine insurance a particular average is a partial loss suffered by one party. A policy with particular average pays for partial loss as well as total loss, so it gives the fullest cover.'
      - 'A policy free of particular average (FPA) pays only when the goods are totally lost, so partial damage is not covered. A voyage policy and a freight policy are named by what they cover, one journey or the freight charge, not by how full the cover is.'
      - 'An importer bringing machine parts into Apapa takes a WPA policy so that if seawater spoils half the cargo, the insurer still pays for that half.'
      - 'Remember: With Particular Average means With partial loss covered.'
      - 'The trap is A, a voyage policy. It covers the goods for one named journey, but it can be written WPA or FPA, so its name says nothing about full cover.'
    hint: 'Which policy pays even when only part of the cargo is damaged?'
    why:
      A: 'A voyage policy only fixes the cover to one journey; it does not mean partial losses are paid.'
      B: 'A freight policy covers the freight charge at risk, not the fullest cover on the goods.'
      C: 'A policy free of particular average pays only for total loss, so it gives the least cover.'

  4:
    answer: D
    steps:
      - 'This is reinsurance.'
      - 'Reinsurance is the insurance of an insurance company. An insurer that accepts a risk too large for it passes part of that risk to other insurers.'
      - 'The first insurer issues the whole policy and collects the premium, then pays part of the premium to the reinsurers. If a loss happens, each pays its share, so no single company is ruined by one big claim.'
      - 'A Nigerian insurer that covers a ₦50 billion refinery keeps only part of the risk and reinsures the rest with other companies at home and abroad.'
      - 'Remember: reinsurance is insurance for the insurer.'
      - 'The trap is A, contribution. Contribution shares a loss among insurers that the insured himself took policies with; in reinsurance the insurer chooses to share its own risk.'
    hint: 'What does an insurer do when one risk is too big for it alone?'
    why:
      A: 'Contribution is when insurers who each covered the same property share the loss; it is not one insurer passing on its risk.'
      B: 'Indemnity is restoring the insured to his position before the loss.'
      C: 'Subrogation is the insurer taking over the insured''s rights after paying a claim.'

  5:
    answer: A
    steps:
      - 'This is the vending machine, a trend in retailing.'
      - 'A vending machine is an automatic machine that sells goods without a sales attendant.'
      - 'The buyer puts in coins, notes or a card and chooses an item; the machine checks the payment and releases the goods. It can sell all day and night without wages for staff.'
      - 'A student at an airport in Abuja buys a bottle of water from a vending machine with no one at the counter.'
      - 'Remember: vend means sell, so a vending machine is a selling machine.'
      - 'The trap is B, computer machine. Computers help shops keep records and sell online, but a computer on its own does not take money and hand over goods.'
    hint: 'Which machine takes payment and drops out the goods by itself?'
    why:
      B: 'A computer processes information; it does not by itself sell and deliver goods.'
      C: 'A fax machine sends copies of documents over the telephone line.'
      D: 'A telex machine sent typed messages between offices; it sold nothing.'

  6:
    answer: A
    steps:
      - 'This is the consular invoice, a document in import and export trade.'
      - 'An ad valorem duty is a duty charged as a percentage of the value of the goods. Customs therefore needs a document that states that value truthfully.'
      - 'A consular invoice is prepared by the exporter and certified by the consul of the importing country in the exporting country. It confirms the value and origin of the goods, so customs in the importing country can work out the ad valorem duty. If the duty is 20% and the goods are worth ₦1,000,000, the duty is $\dfrac{20}{100} \times 1{,}000{,}000 = 200{,}000$, so ₦200,000.'
      - 'An exporter in a foreign country sending goods to Apapa gets the invoice stamped at the Nigerian consulate so that the Nigeria Customs Service accepts the value on it.'
      - 'Remember: ad valorem means by value, and the consul certifies the value.'
      - 'The trap is C, a shipping note. It only asks the port to receive the goods for loading onto a ship; it does not certify their value.'
    hint: 'Which document has the value of the goods certified by an official of the importing country?'
    why:
      B: 'A bill of lading is the receipt and document of title for goods on a ship, not a certificate of value.'
      C: 'A shipping note asks the port to receive goods for loading; it says nothing official about their value.'
      D: 'A mail transfer is a way of sending money through a bank, not a customs document.'

  7:
    answer: D
    steps:
      - 'This is the thrift and credit society, a kind of co-operative.'
      - 'In a thrift and credit society the members are the owners. They save small sums regularly into a common fund, and they borrow from that fund.'
      - 'Because members know one another, a loan is granted on the borrower''s personal goodwill, his good name and steady savings record, instead of on land or other collateral that a bank would demand.'
      - 'Market women in Onitsha who save every week in their society can borrow to restock their stalls, with the other members standing as their guarantee.'
      - 'Remember: thrift means saving, credit means borrowing, and trust is the security.'
      - 'The trap is A, community bank. Community banks lent to people in a community, but as banks they wanted security, and the borrowers were customers, not the owners. Community banks were later turned into microfinance banks.'
    hint: 'In which business are the borrowers also the owners, lending to one another on trust?'
    why:
      A: 'A community bank is a bank that lends to customers against security, not to its owners on personal goodwill.'
      B: 'A consumers'' co-operative sells goods to its members and shares out a dividend on purchases; it does not lend.'
      C: 'A commercial bank lends to customers who give collateral; its owners are shareholders.'

  8:
    answer: B
    steps:
      - 'This is the sources of finance for a public limited liability company.'
      - 'A Plc raises money from its owners and from lenders: by selling shares, by borrowing from banks, by issuing debentures and by ploughing back its own profits.'
      - 'Government grants are given for public purposes, such as to government agencies or to support a policy, not as a regular source of capital for a private business owned by shareholders. A company cannot count on them.'
      - 'Dangote Cement Plc raises money by selling shares on the stock exchange, by bank loans and by keeping back part of its profits, not by government grants.'
      - 'Remember: a Plc gets money from owners (shares), lenders (loans) and itself (profits).'
      - 'The trap is D, internally generated funds. These are retained profits, the cheapest source of finance a company has.'
    hint: 'Which source does not come from the owners, from lenders or from the company''s own profits?'
    why:
      A: 'Bank loans and overdrafts are a common source of funds for companies.'
      C: 'Selling shares to the public is the main way a Plc raises capital.'
      D: 'Internally generated funds, profits ploughed back, are a major source of company finance.'

  9:
    answer: A
    steps:
      - 'This is the public limited company, marked by the letters Plc.'
      - 'Plc stands for public limited company. Its shares may be offered to the general public, while a private company (Ltd) may not invite the public to buy its shares.'
      - 'A Plc sells new shares to anyone who applies, by a prospectus. Most Plcs also list their shares on the stock exchange, so the public can buy and sell them freely through stockbrokers.'
      - 'Anyone in Nigeria can buy shares of Dangote Cement Plc or Nestlé Nigeria Plc through a stockbroker; a family firm named "Okafor and Sons Ltd" cannot sell shares to the public.'
      - 'Remember: P for public, so the public can buy.'
      - 'The trap is C, privately to members and their friends. That describes a private limited company (Ltd), whose shares cannot be offered to the public.'
    hint: 'What does the P in Plc stand for?'
    why:
      B: 'A Plc''s shares are bought through stockbrokers and issuing houses, not only through commercial banks.'
      C: 'Restricting shares to members and friends is the mark of a private company, not a Plc.'
      D: 'A Plc offers shares to everyone, not only to its staff.'

  10:
    answer: B
    steps:
      - 'This is the partnership, a business owned by 2 to 20 people.'
      - 'A merit is an advantage and a demerit is a disadvantage. Here we need the feature that works both ways.'
      - 'The number of partners is a merit because more partners bring more capital, more skills and more ideas. It is also a demerit because the number is limited to 20, which caps the capital, and more partners mean more disagreements and slower decisions.'
      - 'Three friends who open a pharmacy in Ibadan together raise more money than one could, but they may quarrel over decisions, and they cannot take in a 21st partner to raise more.'
      - 'Remember: more partners, more money, more arguments.'
      - 'The trap is C, the withdrawal of a major partner. That can end the partnership and take away capital, so it is only a demerit.'
    hint: 'Which feature brings both more capital and more quarrels?'
    why:
      A: 'Pooling partners'' skills is only a merit; it helps the business.'
      C: 'The withdrawal of a major partner only harms the business, so it is a demerit.'
      D: 'A partnership is easy to form, with no registration of a company, so this is only a merit.'

  11:
    answer: C
    steps:
      - 'This is the siting of a warehouse.'
      - 'A warehouse is a building where goods are stored until they are needed. It should be sited near the people who will need the goods, near good transport, and where the goods are safe.'
      - 'A distributor''s warehouse holds goods on their way to the market. Siting it near consumers and retailers cuts delivery time and transport cost, so shops can be restocked quickly when demand rises.'
      - 'Large distributors of drinks and noodles keep warehouses near busy markets in Lagos, Kano and Onitsha, so retailers can collect fresh stock the same day.'
      - 'Remember: store the goods near where they will be sold.'
      - 'The trap is A, labour. A warehouse needs a few workers, but labour can travel to it; the reason for siting it is to reach the market fast.'
    hint: 'Where are the goods in a warehouse going next?'
    why:
      A: 'A warehouse needs only a few workers, so labour does not decide where it is sited.'
      B: 'Capital is money for the business; it can be moved anywhere and does not decide the site.'
      D: 'A warehouse serves the market, not the managers, so it need not be near the head office.'

  12:
    answer: B
    steps:
      - 'This is the pooling of risk, the idea on which all insurance rests.'
      - 'Pooling of risk means that many people facing the same risk each pay a small premium into one common fund, and the few who suffer a loss are compensated out of that fund.'
      - 'Not everyone''s shop burns down in a year. So the premiums of the many are enough to pay the losses of the few, and the burden of one loss is spread over all who contributed.'
      - 'If 1,000 traders in Balogun each pay ₦5,000 a year, the fund holds $1{,}000 \times 5{,}000 = 5{,}000{,}000$, so ₦5,000,000, enough to pay the two or three who suffer a fire.'
      - 'Remember: the many pay a little so the few are not ruined.'
      - 'The trap is A, two people pool their risks. Pooling needs a large number of people paying into a common fund, not two people joining their risks.'
    hint: 'Where does the money paid to a person who suffers a loss come from?'
    why:
      A: 'Pooling involves many insured persons paying into one fund, not two people joining their risks.'
      C: 'Insurance protects against risk; it does not encourage people to take risks.'
      D: 'Insurers buying policies is not pooling; pooling is the fund made by the premiums of many insured.'

  13:
    answer: C
    steps:
      - 'This is the Lake Chad Basin Commission (LCBC), one of the regional bodies Nigeria belongs to.'
      - 'The Lake Chad Basin Commission was set up by the countries whose borders meet around Lake Chad, Nigeria, Niger, Chad and Cameroon, to manage the lake''s water and develop the basin together.'
      - 'It works on shared use of the water for farming, fishing and trade, and on development and security around the lake. Central African Republic and Libya joined later.'
      - 'Farmers and fishermen in Borno State share the lake with people from Niger, Chad and Cameroon, so the four countries plan its use together through the commission.'
      - 'Remember: the countries that touch the lake, Nigeria, Niger, Chad and Cameroon.'
      - 'The trap is A, Benin and Nigeria. Nigeria is a member, but Benin lies to the west on the coast, far from Lake Chad.'
    hint: 'Which countries border Lake Chad?'
    why:
      A: 'Nigeria is a member but Benin is not; it lies far from Lake Chad.'
      B: 'Nigeria is a member but Mali is not; Mali is in the Niger basin, not the Lake Chad basin.'
      D: 'Chad is a member but Benin is not.'

  14:
    answer: D
    steps:
      - 'This is the core investor in privatization.'
      - 'Privatization is the sale of government-owned enterprises to private buyers. A core investor is the buyer who acquires a controlling share of the enterprise and brings the technical and managerial know-how to run it well.'
      - 'The government sells the controlling block of shares to the core investor, who then takes over management. The rest of the shares may be sold to the public or kept by government. The aim is to make the enterprise efficient and profitable.'
      - 'Under the programme run by the Bureau of Public Enterprises (BPE), core investors bought controlling shares in the power distribution companies formed from the old PHCN and took over running them.'
      - 'Remember: a core investor brings both money for control and skill to manage.'
      - 'The trap is C, at the core of the enterprise. It plays on the word "core" but says nothing about owning control or bringing know-how.'
    hint: 'What two things must a buyer bring to take over and run a privatized enterprise?'
    why:
      A: 'Long service as a worker does not make someone a core investor; control and know-how do.'
      B: 'Raising foreign currency alone is not the test; the core investor must take control and run the enterprise well.'
      C: 'It only repeats the word "core" and does not say what a core investor is.'

  15:
    answer: A
    steps:
      - 'This is organizing, one of the functions of management.'
      - 'Organizing is arranging the work of a business: dividing tasks into jobs, grouping jobs into departments, and giving people the authority to carry them out.'
      - 'After planning sets the goals, organizing sets up the structure. Each person knows his job, his department and who he reports to, and authority is delegated down the line.'
      - 'A new supermarket in Abuja creates the sales, stores and accounts departments, and gives each manager authority over his section. That is organizing.'
      - 'Remember: organizing builds the structure; staffing fills it with people.'
      - 'The trap is B, staffing. Staffing recruits and trains people for the jobs after the jobs have been created by organizing.'
    hint: 'Which function creates the jobs and departments before anyone is hired?'
    why:
      B: 'Staffing is recruiting, selecting and training people to fill the jobs already created.'
      C: 'Leading is guiding and motivating people to work towards the goals.'
      D: 'Directing is giving instructions and supervising work as it is done.'

  16:
    answer: B
    steps:
      - 'This is the communication process.'
      - 'Communication is passing a message from a sender to a receiver through a channel, so that it is understood.'
      - 'The sender has an idea and encodes it into words or signs. The message travels through a channel, such as a letter, a phone call or an e-mail, to the receiver, who decodes it. The receiver then sends feedback to show it was understood.'
      - 'A Kano wholesaler sends a text message to a retailer in Kaduna that new stock has arrived. The retailer is the receiver, and his reply ordering ten cartons is the feedback.'
      - 'Remember: sender, message, channel, receiver, feedback.'
      - 'The trap is D, sender. The sender starts the message; it is transmitted to the receiver at the other end.'
    hint: 'Who is at the far end of the channel?'
    why:
      A: 'The encoder is the sender who puts the idea into words or signs; the message starts there.'
      C: 'Feedback is the receiver''s response that travels back to the sender.'
      D: 'The sender is where the message starts, not where it is sent to.'

  17:
    answer: C
    steps:
      - 'This is agency by necessity, one of the ways an agency is created.'
      - 'Agency by necessity arises when, in an emergency, a person in charge of another''s goods must act to save them, cannot get the owner''s instructions in time, and acts in good faith in the owner''s interest.'
      - 'A transporter whose lorry breaks down for days cannot reach the owner of the perishable goods he carries. If he waits, they rot, so he sells them. The law treats him as the owner''s agent for that sale.'
      - 'A driver carrying tomatoes from Kano to Lagos who is stuck at a broken bridge sells them in Ilorin before they spoil, and hands the money to the owner.'
      - 'Remember: emergency plus no contact plus good faith gives agency by necessity.'
      - 'The trap is D, ratification. Ratification is when the owner approves an act after it is done; here the agency arises from the emergency itself.'
    hint: 'What forced the transporter to act without permission?'
    why:
      A: 'Agency by estoppel arises when a principal lets others believe someone is his agent, not from an emergency.'
      B: 'Agency by conduct arises from the way the parties have behaved towards each other over time.'
      D: 'Ratification is the principal approving an act afterwards; the emergency creates this agency at once.'

  18:
    answer: A
    steps:
      - 'This is pollution, a harmful effect of business and human activity on the environment.'
      - 'Land pollution is the fouling of the soil and surface; water pollution is the fouling of rivers, seas and underground water.'
      - 'Poor sewage disposal fouls drains, streams and the soil. Oil spills cover farmland and creeks with crude oil. Refuse dumped anywhere fouls the land and is washed into rivers when it rains. All three end up on land and in water.'
      - 'In the Niger Delta, oil spills have killed fish in the creeks and spoiled farmland, and refuse dumped in Lagos drains causes flooding and dirty water.'
      - 'Remember: sewage, oil and refuse fall on land and flow into water.'
      - 'The trap is B, air and water pollution. Air pollution comes from smoke, exhaust fumes and gas flaring; the three activities named mainly foul land and water.'
    hint: 'Where do sewage, spilt oil and dumped refuse end up?'
    why:
      B: 'Air pollution comes from smoke, fumes and gas flaring; these three mainly foul land and water.'
      C: 'Land is fouled, but sewage and oil spills also foul rivers and creeks, so land alone is incomplete.'
      D: 'Water is fouled, but oil spills and refuse also foul the land, so water alone is incomplete.'

  19:
    answer: A
    steps:
      - 'This is the chamber of commerce.'
      - 'A chamber of commerce is an association of businesses of all kinds in a city or country, set up to promote and protect trade and commerce in general.'
      - 'It promotes both home trade and foreign trade: it organizes trade fairs, gives members information on markets at home and abroad, issues certificates of origin for exports, and speaks to government for business.'
      - 'The Lagos Chamber of Commerce and Industry organizes the Lagos International Trade Fair, where Nigerian and foreign firms meet buyers.'
      - 'Remember: a chamber covers all commerce, home and foreign; a trade association covers one industry.'
      - 'The trap is D, promoting trade in a particular industry. That is the work of a trade association, such as one for cement or textile makers.'
    hint: 'Does a chamber of commerce serve one industry or all businesses?'
    why:
      B: 'Increasing productivity is the job of each firm''s management, not the main function of a chamber.'
      C: 'Maximizing profit is the aim of individual firms, not of a chamber of commerce.'
      D: 'Promoting one particular industry is the function of a trade association.'

  20:
    answer: D
    steps:
      - 'This is the merchant wholesaler, a merchant middleman.'
      - 'Middlemen are of two kinds. Merchant middlemen buy the goods, so they own them (have title) and take the risk. Agent middlemen only arrange the sale for a commission and never own the goods.'
      - 'A merchant wholesaler buys in bulk from the producer, pays for the goods, stores them and resells them to retailers at a profit. If prices fall or the goods spoil, the loss is his, because the goods are his.'
      - 'A wholesaler in Onitsha main market who buys trailer loads of rice from a mill and resells by the bag owns the rice he sells. A broker who only links a buyer to the mill for a fee never owns it.'
      - 'Remember: merchant means owner; agent means arranger.'
      - 'The trap is C, the commission agent. He sells goods on behalf of his principal and earns a commission, but the goods remain the principal''s.'
    hint: 'Which of these middlemen pays for the goods and owns them?'
    why:
      A: 'A broker brings buyer and seller together for a fee and never owns the goods.'
      B: 'An auctioneer sells goods for their owner to the highest bidder; he does not own them.'
      C: 'A commission agent sells on behalf of his principal, who keeps ownership of the goods.'

  21:
    answer: C
    steps:
      - 'This is customer service, part of a firm''s dealings with its customers.'
      - 'Customer service is all the help a seller gives customers before, during and after a sale, such as prompt attention, advice, delivery, repairs and handling complaints, so that they are satisfied and keep coming back.'
      - 'Good service attracts new buyers, who hear about it from others, and it retains old ones, because satisfied customers become loyal. Patronage means the steady custom of buyers.'
      - 'A phone shop in Computer Village, Ikeja that greets buyers well, explains each phone, delivers and fixes faults quickly keeps the same customers for years.'
      - 'Remember: serve them well and they stay.'
      - 'The trap is B, sales promotion. Free gifts and price cuts attract buyers for a short time, but they do not by themselves keep customers once the offer ends.'
    hint: 'What makes a customer come back again and again?'
    why:
      A: 'Pre-sales service helps before a sale only; it does not keep the customer afterwards.'
      B: 'Sales promotion draws buyers for a short time, but it does not retain them once the offer ends.'
      D: 'Raising prices drives buyers away rather than attracting them.'

  22:
    answer: B
    steps:
      - 'This is the irredeemable bond, a type of security.'
      - 'A bond is a loan to a government or company on which interest is paid. An irredeemable bond is one whose capital is never repaid: the holder receives only interest, year after year.'
      - 'A redeemable bond is repaid on a set date, so the holder gets interest and then his capital back. An irredeemable bond has no repayment date; a holder who wants his money back must sell the bond to someone else on the stock exchange.'
      - 'If a government issues ₦1,000,000 of irredeemable bonds at 10%, it pays $\dfrac{10}{100} \times 1{,}000{,}000 = 100{,}000$, so ₦100,000 in interest every year, but never repays the ₦1,000,000.'
      - 'Remember: ir-redeemable means not redeemed, never paid back.'
      - 'The trap is A, a redeemable bond. "Redeem" means to pay back, so a redeemable bond does repay its capital.'
    hint: 'What does "redeem" mean, and what does "ir-" do to it?'
    why:
      A: 'A redeemable bond is repaid on a fixed date, so the capital is paid.'
      C: 'A long-term loan must be repaid in the end, with interest.'
      D: 'A development bond raises money for projects and is repaid at maturity.'

  23:
    answer: D
    steps:
      - 'This is the offer, the first element of a valid contract.'
      - 'An offer is a definite statement by one person (the offeror) that he is willing to enter into a contract on stated terms, made to another person (the offeree).'
      - 'A contract begins with an offer. When the offeree agrees to all its terms without change, that is acceptance, and with consideration and the intention to create legal relations a binding contract is formed.'
      - 'A trader in Aba who tells a buyer, "I will sell you ten bales of cloth for ₦500,000," has made an offer. When the buyer says, "I agree," that is acceptance.'
      - 'Remember: offer first, acceptance second.'
      - 'The trap is B, an acceptance. Acceptance is the reply that agrees to an offer; the first announcement of willingness is the offer itself.'
    hint: 'What comes first in making a contract?'
    why:
      A: 'Consideration is the price or value each party gives in return for the other''s promise.'
      B: 'Acceptance is the agreement to an offer already made, not the first announcement.'
      C: 'A proxy is a person appointed to vote for another, as at a company meeting.'

  24:
    answer: A
    steps:
      - 'This is the business environment, the forces around a business.'
      - 'The business environment has internal factors, inside the firm and under its control, and external factors, outside the firm and beyond its control. Macro-environmental forces are the external factors.'
      - 'External factors include economic forces (inflation, exchange rates), political and legal forces (government policy, laws), social forces, technological change and competition. A firm cannot change them; it must adjust to them, so they constrain its operations.'
      - 'When the naira falls and the price of imported raw materials rises, a Lagos bakery must raise its bread prices. The exchange rate is an external factor it cannot control.'
      - 'Remember: macro means big and outside; the firm cannot control it.'
      - 'The trap is B, internal factors. These are inside the firm, such as its staff, money and management, and the firm can control them.'
    hint: 'Are macro-environmental forces inside or outside the firm?'
    why:
      B: 'Internal factors are inside the firm and under its control, not macro-environmental forces.'
      C: 'Controllable factors are those the firm itself manages; macro forces are beyond its control.'
      D: 'Management factors lie inside the firm, so they are internal, not macro-environmental.'

  25:
    answer: D
    steps:
      - 'This is the registration of a company.'
      - 'A company is registered by the Corporate Affairs Commission (CAC) under the Companies and Allied Matters Act. The promoters must first get the proposed name approved, and a name identical with, or too like, that of an existing company is refused.'
      - 'If two firms had the same name, customers, suppliers and banks would confuse them, and one could trade on the other''s goodwill. So the CAC checks every proposed name against its register before it accepts the documents.'
      - 'Promoters in Lagos who try to register "Dangote Cement Ltd" for a new firm will have the name refused, because it conflicts with an existing company.'
      - 'Remember: one name, one company.'
      - 'The trap is B, no assets of its own. A proposed company has not started yet, so it is not expected to own assets before it is registered.'
    hint: 'What does the registrar check first in a proposed company''s application?'
    why:
      A: 'A proposed company has not traded, so no one expects it to have made a profit.'
      B: 'A company acquires assets after it is formed; it need not own them before registration.'
      C: 'A company cannot trade until it is registered, so not having started trading is normal.'

  26:
    answer: C
    steps:
      - 'This is the cartel, a form of business combination.'
      - 'A cartel is an association of independent producers of the same product who agree to control output and prices, often by giving each member a quota, while each member keeps its own identity.'
      - 'By limiting how much each member produces, the cartel keeps supply low and the price high, so all members earn more than they would by competing.'
