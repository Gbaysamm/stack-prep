      - 'For Mr N: sum insured ₦25,000, actual value ₦100,000, loss ₦30,000. Compensation $= \dfrac{25{,}000}{100{,}000} \times 30{,}000 = \dfrac{1}{4} \times 30{,}000 = 7{,}500$, so ₦7,500. Check: he insured a quarter of the value, so he gets a quarter of the loss.'
