format_version: 1
exam_year: 2018
subject: COM
explanations:
  1:
    answer: A
    steps:
      - 'This is the Securities and Exchange Commission (SEC), the regulator of the capital market.'
      - 'SEC is the apex body that regulates and develops the Nigerian capital market. It registers securities, brokers and dealers, and makes and enforces the rules the exchange works under.'
      - 'Before a company''s shares can be offered to the public and listed, SEC must register the issue. SEC also watches trading on the exchange and can punish brokers who break the rules, so the exchange works under its control.'
      - 'When Dangote Cement or MTN Nigeria offers new shares, SEC approves the offer first. In 2021 the Nigerian Stock Exchange became Nigerian Exchange Limited, part of Nigerian Exchange Group, and SEC still regulates it.'
      - 'Remember: S E C, Securities and Exchange Commission, the exchange''s referee.'
      - 'The trap is C, CBN. The Central Bank regulates banks and the money supply, not the stock exchange.'
    hint: 'Which body has "securities" and "exchange" in its very name?'
    why:
      B: 'The Bureau of Public Enterprises handles privatization of government companies; it does not regulate the exchange.'
      C: 'The Central Bank of Nigeria regulates banks and monetary policy, not the stock exchange.'
      D: 'The Nigeria Deposit Insurance Corporation insures bank deposits; it has no control over the stock exchange.'

  2:
    answer: A
    steps:
      - 'This is backwardation, a charge in stock exchange dealings.'
      - 'Backwardation is the fee a bear (a speculator who has sold shares he does not yet have) pays to the buyer for putting off delivery of the shares to a later date.'
      - 'The bear sold expecting the price to fall so he could buy cheaply and deliver. If the price has not fallen by settlement day, he asks the buyer to wait and pays him backwardation for the delay.'
      - 'A bear who sold 10,000 shares of a bank on the Lagos floor, hoping to buy them back cheaper, pays the buyer backwardation when he cannot deliver on time.'
      - 'Remember: Bear pays Backwardation, two Bs together. The bull pays contango.'
      - 'The trap is D, contango. Contango is paid by a bull who cannot pay for shares he bought; it is the buyer''s charge, not the seller''s.'
    hint: 'The speculator here cannot deliver, so he is a seller. Which charge does a seller pay?'
    why:
      B: 'Franco is a price quotation that includes all delivery charges to the buyer''s door; it is not a stock exchange charge.'
      C: 'Arbitrage is buying in one market and selling in another to gain from a price difference.'
      D: 'Contango is paid by a bull who cannot pay for shares on the agreed date, not by a seller.'

  3:
    answer: C
    steps:
      - 'This is called-up capital, one kind of share capital.'
      - 'Called-up capital is the part of the issued capital that the company has asked (called on) its shareholders to pay so far.'
      - 'A company may let subscribers pay for shares in instalments: so much on application, so much on allotment and the rest on later calls. The total of the payments asked for up to now is the called-up capital.'
      - 'If a Lagos company allots 1,000,000 shares of ₦1 each and asks for 60 kobo on each so far, its called-up capital is ₦600,000.'
      - 'Remember: called-up is what the company has called for.'
      - 'The trap is A, issued capital. Issued capital is the full value of the shares given out, whether paid for yet or not.'
    hint: 'If shareholders pay in parts, what is the name for the parts asked for so far?'
    why:
      A: 'Issued capital is the full nominal value of the shares allotted, not the part payments.'
      B: 'Subscribed capital is the full value of the shares the public has applied for.'
      D: 'Authorized capital is the most the company may issue, as stated in its memorandum.'

  4:
    answer: B
    steps:
      - 'This is the overdraft, a bank lending service.'
      - 'An overdraft lets a current (cheque) account holder withdraw more than he has in the account, up to an agreed limit, so the account goes into debit.'
      - 'The customer pays interest only on the amount actually overdrawn and only for the days it is overdrawn. It is short-term and repayable on demand.'
      - 'A Balogun trader with a ₦200,000 overdraft limit at First Bank can write cheques to his supplier even when his balance is nil, and pay back when sales come in.'
      - 'Remember: over-draw, overdraft; you draw over what you have.'
      - 'The trap is A, advance. A loan or advance is paid into a separate loan account as a lump sum, and interest runs on the whole amount; it is not drawing past a cheque balance.'
    hint: 'What do we call drawing more than you have from a current account?'
    why:
      A: 'An advance or loan is a fixed sum given in a loan account, with interest on the whole sum.'
      C: 'Commission is the fee a bank charges for a service; it is not a loan.'
      D: 'Interest is the price paid for borrowed money, not the loan itself.'

  5:
    answer: C
    steps:
      - 'This is acceptability, the main quality of money.'
      - 'Money is generally accepted because the law backs it: the government declares it legal tender, which must be accepted in settlement of debts.'
      - 'A seller cannot lawfully refuse legal tender in payment of a debt. Because everyone knows this, everyone accepts the naira, and trust in it rests on that legal backing.'
      - 'The law makes the naira the legal tender in Nigeria, so a trader in Onitsha market must take naira notes.'
      - 'Remember: money is money because the law says so.'
      - 'The trap is D, the Governor''s signature. The signature shows who issued the note, but it is the law behind the note, not the signature, that makes people accept it.'
    hint: 'What makes it unlawful to refuse naira notes in payment of a debt?'
    why:
      A: 'The rule of law is a general principle of government, not what makes a currency acceptable.'
      B: 'Many currencies, the naira among them, are not widely accepted abroad, yet they are accepted at home.'
      D: 'The signature only shows who issued the note; the legal backing makes it acceptable.'

  6:
    answer: B
    steps:
      - 'This is the chamber of commerce, an association of the businesses in a city or state.'
      - 'A chamber of commerce promotes and protects the trade, industry and agriculture of its area, and one of its main functions is organizing trade fairs.'
      - 'At a trade fair, firms show their goods to buyers from home and abroad in one place, so new markets and contacts are made.'
      - 'The Lagos International Trade Fair is organized by the Lagos Chamber of Commerce and Industry, and other chambers run fairs in Kaduna, Enugu and Kano.'
      - 'Remember: chambers organize fairs.'
      - 'The trap is A, the Ministry of Commerce and Industry. The ministry makes trade policy and supports fairs, but the chambers of commerce organize them.'
    hint: 'Which body brings together the businesses of a city to promote their trade?'
    why:
      A: 'The ministry makes trade policy; the chambers of commerce organize the fairs.'
      C: 'The Federal Government supports trade fairs, but does not organize them itself.'
      D: 'The Manufacturers Association of Nigeria speaks for manufacturers and takes part in fairs, but the chambers organize them.'

  7:
    answer: C
    steps:
      - 'This is the channel of distribution.'
      - 'A channel of distribution is the route goods take from the producer to the final consumer, through wholesalers, retailers and other middlemen.'
      - 'The usual channel is producer, wholesaler, retailer, consumer. Shorter channels cut out the wholesaler, or the producer sells direct.'
      - 'Noodles go from the factory to wholesalers in Onitsha and Kano, then to shop owners, and then to families.'
      - 'Remember: the channel is the road goods travel to reach you.'
      - 'The trap is B, sales promotion. Sales promotion makes people want to buy, but it does not move the goods to them.'
    hint: 'What is the name for the route goods follow from the factory to the buyer?'
    why:
      A: 'An advertising agency makes goods known; it does not bring them to consumers.'
      B: 'Sales promotion encourages buying; it does not carry the goods to the consumer.'
      D: 'A market research unit studies what consumers want; it does not deliver goods.'

  8:
    answer: A
    steps:
      - 'This is the marketing concept.'
      - 'The marketing concept says a firm should find out what consumers need and want, and satisfy them better than its rivals, so as to make its profit.'
      - 'The firm starts from the customer: it researches needs first, then designs, prices, places and promotes the product to meet them.'
      - 'A Nigerian drinks maker that studies what young buyers want before making a new flavour is practising the marketing concept.'
      - 'Remember: the marketing concept starts with the customer.'
      - 'The trap is B, the selling concept. The selling concept starts with the product and pushes it hard, whatever the customer needs.'
    hint: 'Which concept begins with the customer instead of the product?'
    why:
      B: 'The selling concept focuses on pushing the firm''s products, not on satisfying consumers.'
      C: 'Consumerism is the movement by consumers to protect their own rights, not a business practice.'
      D: 'Market segmentation divides a market into groups; it is a tool, not the idea of putting consumer satisfaction first.'

  9:
    answer: B
    steps:
      - 'This is pipeline transport, a mode of transport for liquids and gases.'
      - 'Its major disadvantage is the high cost of construction: laying pipes over long distances, with pumping stations, needs huge capital at the start.'
      - 'Once laid, a pipeline carries large quantities cheaply, day and night, with little labour, so the running cost is low. The heavy outlay comes at the beginning.'
      - 'The pipelines that carry crude oil and petroleum products across Nigeria, from the Niger Delta to the refinery in Kaduna, cost very large sums to build.'
      - 'Remember: dear to build, cheap to run.'
      - 'The trap is A, high maintenance cost. Pipelines need little upkeep compared with roads, trucks or ships; it is the building that is costly.'
    hint: 'Is a pipeline costly mainly to build or to run?'
    why:
      A: 'Pipelines are cheap to maintain and run; their great cost is in building them.'
      C: 'Pipelines carry very large volumes continuously, so their capacity is high, not low.'
      D: 'Pipelines are buried or protected, so weather hardly affects them.'

  10:
    answer: D
    steps:
      - 'This is the link between ownership (control) and management in a business unit.'
      - 'A sole proprietorship is owned by one person who also runs it, so control and management are in the same hands.'
      - 'The sole trader takes every decision himself and acts quickly. In companies, the shareholders own the business but directors and hired managers run it, so control and management are separated. In a co-operative, members elect a committee to manage.'
      - 'A woman who owns and runs a provision shop in Ibadan decides her prices, stock and opening hours herself.'
      - 'Remember: one owner, one manager, one person.'
      - 'The trap is C, a private limited company. Its owners are few, but they are still separate from the directors and managers, who may be hired.'
    hint: 'In which business is the owner always the one who runs it?'
    why:
      A: 'In a co-operative, members own it but elect a committee to manage it.'
      B: 'In a public company, thousands of shareholders own it while directors and managers run it.'
      C: 'In a private company, shareholders may appoint directors and managers, so control and management can be apart.'

  11:
    answer: A
    steps:
      - 'This is the cartel, a form of business combination.'
      - 'A cartel is an agreement among independent firms making the same product to control output, prices or markets, while each firm keeps its own identity.'
      - 'The members fix a quota for each firm, the share of the market or the amount it may produce, so they avoid price wars and keep prices up.'
      - 'OPEC is the best-known cartel: Nigeria and the other member countries each agree a quota of crude oil to pump.'
      - 'Remember: cartel, quota; each firm gets its slice.'
      - 'The trap is C, a trust. In a trust the firms give up their independence and are run as one by trustees; in a cartel they stay independent.'
    hint: 'In which combination do the firms stay separate but share out the market by quota?'
    why:
      B: 'A syndicate is a group that joins to carry out one particular venture, such as underwriting a share issue.'
      C: 'In a trust the firms lose their independence and are controlled as one; a cartel''s members stay independent.'
      D: 'Integration is the merging of firms into one, not an agreement to share a market.'

  12:
    answer: C
    steps:
      - 'This is the public warehouse, one type of warehouse.'
      - 'A public warehouse is owned and controlled by the government or its agencies, and any member of the public may store goods in it for a fee.'
      - 'Importers and traders who have no stores of their own rent space in it. The bonded warehouses at the ports, where imported goods wait until duty is paid, are an example.'
      - 'Warehouses run by the Nigerian Ports Authority at Apapa hold imported goods until the importer clears them.'
      - 'Remember: public owner, public use.'
      - 'The trap is D, manufacturers'' warehouse. That belongs to a private producer and holds its own raw materials and finished goods.'
    hint: 'Who owns a warehouse that any trader can rent space in?'
    why:
      A: 'A retailers'' warehouse is owned by a retailer to hold its own stock.'
      B: 'A wholesalers'' warehouse is owned by a wholesaler for the goods it buys in bulk.'
      D: 'A manufacturers'' warehouse is owned by a producer for its own goods.'

  13:
    answer: D
    steps:
      - 'This is the board of directors of a public limited liability company.'
      - 'The shareholders own the company but are too many to run it, so they elect a board of directors to plan and make policy on their behalf.'
      - 'The board sets the company''s goals and plans, and appoints managers to carry them out. Employees do the work; shareholders vote at the annual general meeting.'
      - 'At a bank such as GTBank, the board approves the yearly plan and budget, and the managing director and staff carry it out.'
      - 'Remember: the board plans, the managers carry out, the shareholders own.'
      - 'The trap is C, shareholders. They own the company and elect the board, but they do not do its planning.'
    hint: 'Whom do the shareholders elect to plan and make policy for them?'
    why:
      A: 'Employees carry out the plans; they do not make them.'
      B: 'The company secretary keeps records and handles legal returns; he does not plan the company''s policy.'
      C: 'Shareholders own the company and elect the board, but leave planning to the directors.'

  14:
    answer: A
    steps:
      - 'This is the sole proprietorship, a business owned by one person.'
      - 'Its major problem is limited capital: the owner must find all the funds himself.'
      - 'He has only his savings, help from family and small loans, since banks are slow to lend to a one-man business with little security. So the business finds it hard to grow.'
      - 'A tailor in Aba who wants a second machine must save for months, because the bank asks for collateral he does not have.'
      - 'Remember: one owner, one purse.'
      - 'The trap is B, labour. A sole trader can easily hire apprentices or workers; money is the problem.'
    hint: 'What is hard to raise when only one person owns the business?'
    why:
      B: 'Labour is easy to hire; a sole trader often uses apprentices and family.'
      C: 'Raw materials can be bought once funds are available; finance is the root problem.'
      D: 'Machinery is bought with funds; the real problem is raising those funds.'

  15:
    answer: C
    steps:
      - 'This is the current account of the balance of payments.'
      - 'The balance of payments has a current account, a capital account and monetary movements. The current account records visible items (goods) and invisible items (services).'
      - 'Visible trade is exports and imports of goods, and its balance is the balance of trade. Invisible trade is services such as shipping, insurance, banking and tourism. Loans and investments go in the capital account.'
      - 'Nigeria''s crude oil and cocoa exports are visible items; the freight and insurance paid to foreign firms are invisible items.'
      - 'Remember: current account = visibles + invisibles.'
      - 'The trap is D, visible and capital items. Capital items, loans and investments, belong to the capital account, not the current account.'
    hint: 'Goods are visible items. What are services called?'
    why:
      A: '"Currency" is not an account item, and capital items belong to the capital account.'
      B: '"Current items" is the current account itself, so visible items are counted twice and services are left out.'
      D: 'Capital items belong to the capital account, not the current account.'

  16:
    answer: D
    steps:
      - 'This is the marketing mix, called the four Ps.'
      - 'The four Ps are product, price, place and promotion: the four things a firm controls to satisfy its customers.'
      - 'Product is what is sold; price is what it costs; place is how it gets to the buyer; promotion is how buyers are told and persuaded.'
      - 'A noodles maker decides the pack size (product), the ₦200 price (price), the shops that stock it (place) and its television adverts (promotion).'
      - 'Remember: Product, Price, Place, Promotion.'
      - 'The trap is B, which swaps price for process. Process is part of making the goods, not of the marketing mix.'
    hint: 'Name what is sold, what it costs, where it is sold and how it is advertised.'
    why:
      A: 'Property is not one of the four Ps; promotion is missing.'
      B: 'Process is not one of the four Ps; price is missing.'
      C: 'Production and property are not among the four Ps; product and promotion are missing.'

  17:
    answer: A
    steps:
      - 'This is the internet, a modern means of communication.'
      - 'The internet is a worldwide network of computers linked by telecommunications, used for sending electronic messages and sharing information.'
      - 'A message typed on one computer or phone is sent as electronic signals over the network and reaches the other person almost at once, anywhere in the world. E-mail is the best-known use.'
      - 'A Lagos importer sends an e-mail order to a supplier in China and gets a reply the same hour.'
      - 'Remember: internet, inter-connected computers, electronic messages.'
      - 'The trap is B, printed messages between teleprinters. That is telex, an older system that the internet has replaced; telex is no longer in everyday use.'
    hint: 'What kind of messages do linked computers send?'
    why:
      B: 'Sending printed messages between teleprinters is telex, which is no longer in everyday use.'
      C: 'Delivering letters and parcels by hand is the work of the postal service.'
      D: 'Telegrams were sent through the post office by telegraph, not over the internet, and are no longer in everyday use.'

  18:
    answer: B
    steps:
      - 'This is the insurance premium, the price paid for cover.'
      - 'The premium is fixed by the size of the risk: the greater the chance of loss, the higher the premium.'
      - 'For fire insurance, the risk depends mainly on the type and structure of the property: what it is built of, what it is used for and what is stored in it.'
      - 'A concrete house in Abuja pays a lower fire premium than a wooden shop full of fuel in a crowded market.'
      - 'Remember: more risk, more premium.'
      - 'The trap is A, usefulness to the owner. How useful the property is does not change the chance of a fire.'
    hint: 'What makes one building more likely to catch fire than another?'
    why:
      A: 'Usefulness to the owner does not change the chance of fire.'
      C: '"Fixed damage" cannot be known in advance; insurers judge the risk from the property itself.'
      D: 'Who owns the property does not decide how likely it is to burn.'

  19:
    answer: C
    steps:
      - 'This is capital in the books of a business.'
      - 'By the business entity concept, the business is separate from its owner, so the money the owner puts in is owed by the business back to him. Capital is therefore a liability of the business.'
      - 'In the balance sheet, assets = capital + liabilities. Capital sits on the same side as the debts, because it is a claim on the assets.'
      - 'If a trader puts ₦500,000 into his Onitsha shop, the shop owes him ₦500,000, and that is shown as capital.'
      - 'Remember: the business owes its capital to the owner.'
      - 'The trap is A, an asset. The capital buys assets, such as stock and shelves, but the capital itself is the owner''s claim on them.'
    hint: 'Does the business own its capital, or owe it to someone?'
    why:
      A: 'Capital buys the assets, but in the books it is the owner''s claim, a liability.'
      B: 'A project is a planned piece of work, not an accounting term for capital.'
      D: 'An expense is money used up in running the business, such as rent; capital is not used up.'

  20:
    answer: A
    steps:
      - 'This is the choice of occupation.'
      - 'A person''s choice of occupation depends on factors such as skill, interest, aptitude, training and education, capital and the demand for the work.'
      - 'Skill is critical, because a person can only do work he is able to do well. Without the skill, the job cannot be done, whatever else is in place.'
      - 'A young man in Nnewi who has learnt to repair motorcycles becomes a mechanic because he has that skill.'
      - 'Remember: you can only do the work your hands and head can do.'
      - 'The trap is B, the exchange rate. It affects the economy, but it does not decide the work a person chooses.'
    hint: 'Which option is about the person, not the economy or the calendar?'
    why:
      B: 'The exchange rate affects the economy as a whole, not a person''s choice of work.'
      C: 'The national budget does not decide which occupation a person chooses.'
      D: 'The number of public holidays has nothing to do with choosing an occupation.'

  21:
    answer: B
    steps:
      - 'This is raising capital in a partnership.'
      - 'A partnership gets its capital from the partners themselves, so it can raise more by the partners putting in more, by borrowing, or by admitting new partners who bring in fresh capital.'
      - 'A new partner pays in his share of capital when he joins. An ordinary partnership may have up to twenty partners, so there is room to admit more.'
      - 'Three friends running a pharmacy in Benin City admit a fourth partner, who brings in ₦2,000,000 to open a second branch.'
      - 'Remember: new partner, new capital.'
      - 'The trap is A, sale of shares to the public. Only a public limited company can sell shares to the public; a partnership has no shares.'
    hint: 'A partnership has no shares. How can it bring in more owners with money?'
    why:
      A: 'Only a public company can sell shares to the public; a partnership has no shares.'
      C: 'Discharging a mortgage means paying off a loan, which uses money; it does not raise it.'
      D: 'The government does not give grants to private partnerships as a usual source of capital.'

  22:
    answer: D
    steps:
      - 'This is the registration of trade associations.'
      - 'Trade associations are bodies formed by firms in the same line of trade to protect their common interest, and the ministry in charge of commerce registers and oversees them.'
      - 'Because these associations deal with trade, the ministry responsible for trade and commerce keeps their records and works with them on trade policy.'
      - 'Associations of traders in markets and of importers deal with the commerce ministry. Today Nigeria''s commerce affairs are handled by the Federal Ministry of Industry, Trade and Investment.'
      - 'Remember: trade associations go to the trade ministry.'
      - 'The trap is B, Finance. The finance ministry handles government revenue and spending, not trade associations.'
    hint: 'Which ministry looks after trade?'
    why:
      A: 'The ministry of culture and tourism looks after the arts and tourism.'
      B: 'The ministry of finance handles government money, not trade associations.'
      C: 'The ministry of education runs schools and education policy.'

  23:
    answer: A
    steps:
      - 'This is quoted shares.'
      - 'Quoted (listed) shares are shares of a company that has been admitted to the official list of the stock exchange, so they can be bought and sold there.'
      - 'The company meets the exchange''s rules for listing, and its share price is then quoted every trading day for buyers and sellers.'
      - 'Shares of Dangote Cement, Zenith Bank and Nestle Nigeria are quoted on the Nigerian stock exchange.'
      - 'Remember: quoted means its price is quoted on the exchange.'
      - 'The trap is B, issued shares. Every company issues shares, but only listed ones are quoted on the exchange.'
    hint: 'What do we call shares whose price is listed on the exchange every day?'
    why:
      B: 'Issued shares are shares given out by any company, listed or not.'
      C: 'Deferred shares are founders'' shares paid after other shareholders; the name is not about listing.'
      D: 'Registered shares are shares recorded in the company''s register of members; listing is a different matter.'

  24:
    answer: B
    steps:
      - 'This is the bank rate.'
      - 'The bank rate is the rate of interest the central bank charges commercial banks when it lends to them as the lender of last resort.'
      - 'When the central bank raises the bank rate, banks borrow at a higher cost and raise their own lending rates, so credit falls. Lowering it does the opposite. This is how the central bank controls credit.'
      - 'When a Nigerian bank runs short of cash, it borrows from the Central Bank of Nigeria and pays the bank rate. Today the Central Bank calls its main rate the Monetary Policy Rate.'
      - 'Remember: banks pay the bank rate to the banks'' bank.'
      - 'The trap is D, interest rates. That is the general name for the price of borrowing; the special rate between the central bank and the banks is the bank rate.'
    hint: 'What is the name of the rate the bankers'' bank charges?'
    why:
      A: '"Credit charges" is not the name of the central bank''s lending rate.'
      C: 'Bank charges are fees a commercial bank takes from its own customers.'
      D: '"Interest rates" is the general term; the central bank''s rate to banks is the bank rate.'

  25:
    answer: A
    steps:
      - 'This is agency.'
      - 'Agency is the relationship in which one person, the principal, authorizes another, the agent, to make contracts with third parties on his behalf.'
      - 'The contracts the agent makes within his authority bind the principal, as if the principal had made them himself.'
      - 'A Kano cotton farmer appoints a buying agent in Lagos to sign sale contracts with exporters for him.'
      - 'Remember: an agent acts for a principal.'
      - 'The trap is D, sale of goods. That is a contract to transfer goods for money, not one person acting for another.'
    hint: 'What is the person who acts for another called?'
    why:
      B: 'A bilateral agreement is a contract between two parties, not one acting for the other.'
      C: '"Business" is a general word for trading activity, not this relationship.'
      D: 'Sale of goods is a contract to pass goods for money, not the authority to act for someone.'

  26:
    answer: D
    steps:
      - 'This is social responsibility.'
      - 'Social responsibility is the duty of a business to contribute to sustaining and developing the community it works in, beyond making profit.'
      - 'A firm meets it by protecting the environment, providing safe goods, building schools and clinics, giving scholarships and helping the needy.'
      - 'Oil companies in the Niger Delta build roads, health centres and water schemes for their host communities.'
      - 'Remember: social responsibility means giving back to society.'
      - 'The trap is A, making as much profit as possible. That is the firm''s economic aim; social responsibility looks beyond profit to the community.'
    hint: 'Which option is about the community, not about profit or sales?'
    why:
      A: 'Making profit for shareholders is the firm''s economic responsibility.'
      B: 'Paying tax is a legal duty every firm must meet, not social responsibility.'
      C: 'Selling more than competitors is a marketing aim.'

  27:
    answer: B
    steps:
      - 'This is copyright.'
      - 'Copyright is the exclusive legal right of an author or creator to copy, publish and sell his work, whether published or not.'
      - 'No one may reproduce the work without the author''s permission. In Nigeria the Copyright Act protects it, and the Nigerian Copyright Commission enforces it.'
      - 'A Nigerian novelist holds the copyright in her book, so a printer in Onitsha cannot copy and sell it without her consent.'
      - 'Remember: copyright is the right to copy.'
      - 'The trap is D, patent right. A patent protects an invention, not a written work.'
    hint: 'Which right controls who may copy a book?'
    why:
      A: 'Constitutional rights are basic rights of every citizen, not rights over a work.'
      C: 'A trademark protects a brand name or logo, not a written work.'
      D: 'A patent protects an invention, not an author''s work.'

  28:
    answer: A
    steps:
      - 'This is social responsibility.'
      - 'Social responsibility is a business''s duty to contribute to the welfare and development of the society it works in.'
      - 'Scholarships help young people get an education, and sponsoring sports develops youth and talent. The firm gives back to society out of its profit.'
      - 'Nigerian banks and telecom firms award university scholarships and sponsor football leagues and athletes.'
      - 'Remember: scholarships and sports, giving back.'
      - 'The trap is D, economic responsibility. That is the duty to make profit; scholarships and sports give part of the profit back.'
    hint: 'When a firm gives back to its community, what is it carrying out?'
    why:
      B: 'A pricing policy is how a firm sets prices, not giving to the community.'
      C: 'Production planning is about making goods, not about scholarships or sports.'
      D: 'Economic responsibility is the duty to make profit; these are acts of giving back.'

  29:
    answer: D
    steps:
      - 'This is indigenization.'
      - 'Indigenization is a policy that requires foreign-owned businesses to sell a share of their ownership to citizens of the country.'
      - 'When Nigerians own a large part of a firm, a large part of its profits stays in the country, so less capital is sent (repatriated) abroad.'
      - 'Under the Nigerian Enterprises Promotion Decrees of the 1970s, foreign firms had to sell shares to Nigerians.'
      - 'Remember: indigenization, indigenes own; profits stay home.'
      - 'The trap is A, divestiture. That is government selling its own shares in businesses; it does not stop foreigners sending profits home.'
    hint: 'Which policy hands part of foreign firms to Nigerians?'
    why:
      A: 'Divestiture is government selling its own holdings; it does not cut repatriation of capital.'
      B: 'Naturalization makes a foreigner a citizen; it is not a policy for keeping capital at home.'
      C: 'Commercialization makes a public enterprise run for profit; it does not deal with foreign capital.'

  30:
    answer: B
    steps:
      - 'This is the public limited liability company.'
      - 'A public company has no upper limit on the number of its shareholders.'
      - 'It sells shares to the public, often on the stock exchange, so anyone can buy them. Its minimum number of members is set by law, but there is no maximum.'
      - 'Banks such as Access Bank have hundreds of thousands of shareholders across Nigeria.'
      - 'Remember: public company, unlimited public.'
      - 'The trap is C, fifty. Fifty is the upper limit of members for a private company, not a public one.'
    hint: 'Can anyone buy shares in a public company?'
    why:
      A: 'One hundred is not a legal limit for a public company; there is no maximum.'
      C: 'Fifty is the upper limit of members for a private company, not a public one.'
      D: 'Twenty is the usual upper limit for an ordinary partnership.'

  31:
    answer: A
    steps:
      - 'This is the bank overdraft as a source of funds.'
      - 'A current liability is a debt a business must pay within one year. An overdraft is repayable on demand and is used for a short time, so it is a current liability.'
      - 'In the balance sheet, the overdraft is listed with creditors and other short-term debts, not with long-term loans or with capital.'
      - 'A Kano wholesaler who uses a ₦1,000,000 overdraft from Access Bank to buy stock for Sallah shows it under current liabilities.'
      - 'Remember: short-term debt, current liability.'
      - 'The trap is D, repayable after more than a year. Debts repayable after a year are long-term liabilities; an overdraft is repayable on demand.'
    hint: 'Is an overdraft a short-term or a long-term debt?'
    why:
      B: 'An overdraft is money owed to the bank, not part of the owner''s capital.'
      C: 'Banks grant overdrafts to trusted current account holders, not to every newly opened account.'
      D: 'An overdraft is repayable on demand; debts due after a year are long-term liabilities.'

  32:
    answer: A
    steps:
      - 'This is the marketing mix, shown as a chart.'
      - 'The marketing mix is the set of four elements a firm controls to satisfy its customers: product, price, place and promotion, the four Ps.'
      - 'In the chart all four Ps point at the customer, because each is planned around what the customer wants. Together they make up the marketing mix.'
      - 'A soft drink maker chooses the bottle and flavour (product), the price, the kiosks that sell it (place) and its billboards (promotion), all aimed at the buyer.'
      - 'Remember: four Ps pointing at the customer make the marketing mix.'
      - 'The trap is D, the promotion mix. That is only one of the four Ps, made up of advertising, personal selling, sales promotion and publicity.'
    hint: 'Product, price, place and promotion together are called what?'
    why:
      B: 'The product mix is the range of products a firm sells, only one of the four Ps.'
      C: 'Advertising is one part of promotion, not all four Ps.'
      D: 'The promotion mix is only the promotion P, not the whole chart.'

  33:
    answer: C
    steps:
      - 'This is the set of shipping documents in foreign trade.'
      - 'After shipping the goods, the exporter sends the importer the documents he needs to pay for, insure and clear the goods: the bill of lading, the invoice, the insurance policy, the consular invoice, the certificate of origin and the bill of exchange.'
      - 'The indent goes the other way: it is the importer''s order sent to the exporter. A freight note is sent by the shipping company to the exporter for the freight charge.'
      - 'A Lagos importer of machines from Germany gets the bill of lading, invoice, insurance policy and certificate of origin through his bank, so he can clear the goods at Apapa.'
      - 'Remember: the indent goes out from the importer; the shipping documents come back to him.'
      - 'The trap is B, which looks complete but includes the indent. The importer sends the indent; he does not receive it.'
    hint: 'Which list leaves out the indent, the importer''s own order?'
    why:
      A: 'The indent is sent by the importer, not to him.'
      B: 'The indent is the importer''s order to the exporter, so it does not belong in this list.'
      D: 'The indent comes from the importer, and the freight note goes from the shipowner to the exporter.'

  34:
    answer: D
    steps:
      - 'This is the promissory note.'
      - 'A promissory note is an unconditional written promise by one person to pay a stated sum of money to another on demand or on a fixed future date.'
      - 'The maker gets the goods now and pays later, but the note binds him: on the due date he must pay (redeem) it in cash. If he does not, he can be sued.'
      - 'A Port Harcourt company buys office furniture and gives the seller a promissory note to pay ₦3,000,000 in ninety days.'
      - 'Remember: a promise on paper is a debt in law.'
      - 'The trap is C, refusing to pay since it is only a promise. The promise is written and unconditional, so it is legally binding.'
    hint: 'Is a written, signed promise to pay binding in law?'
    why:
      A: 'Renewal is not the issue; the maker must pay on the due date.'
      B: 'The goods have been bought; the note is the debt for them and must be paid.'
      C: 'A promissory note is an unconditional promise and is legally binding.'

  35:
    answer: D
    steps:
      - 'This is the principle of indemnity in insurance.'
      - 'Indemnity means the insured is restored to the same financial position he was in just before the loss, no better and no worse.'
      - 'He is paid the actual value of the loss, up to the sum insured, so he cannot make a profit from insurance.'
      - 'If a trader in Onitsha insures his shop goods for ₦5,000,000 and a fire destroys goods worth ₦2,000,000, he is paid ₦2,000,000, not ₦5,000,000.'
      - 'Remember: indemnity puts you back, it does not push you ahead.'
      - 'The trap is C, the premiums paid. The claim is based on the loss suffered, not on how much premium was paid.'
    hint: 'After the claim, should the insured be richer, poorer or the same as before the loss?'
    why:
      A: 'Double the loss would let the insured profit from the loss, which indemnity forbids.'
      B: 'Half the loss leaves the insured worse off; indemnity makes good the full loss.'
      C: 'The amount collected depends on the loss suffered, not on the premiums paid.'

