      - 'Nationalization is the transfer of ownership of a private business or industry to the government.'
      - 'The government takes over the firm, paying compensation to the former owners, and runs it as a public enterprise on behalf of the nation.'
      - 'In 1979 the Federal Government nationalized the assets of the oil company BP in Nigeria, so they became government property.'
