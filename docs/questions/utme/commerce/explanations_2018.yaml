    answer: D
    steps:
      - 'This is breach of contract and its remedies.'
      - 'When one party fails to do what a contract requires, the other party may claim damages, a sum of money to make good the loss caused by the breach.'
      - 'Damages are the usual remedy. A court will not order specific performance of a contract for personal work, such as sewing a dress, because it cannot supervise that work and money makes good the loss.'
      - 'If a tailor in Surulere fails to deliver a wedding dress on the agreed day, the customer can sue her for damages to cover the cost of getting another dress made.'
      - 'Remember: broken contract, pay damages.'
      - 'The trap is C, specific performance. It is granted only where money cannot make good the loss, such as for land or a rare item, and never to force personal work.'
    hint: 'Will a court force a tailor to sew, or order her to pay?'
    why:
      A: 'Seizing goods is taking the law into one''s own hands; a remedy must come through the court.'
      B: 'Breach of contract is a civil matter, not a crime for the police.'
      C: 'Courts do not order specific performance of contracts for personal work; damages are the remedy.'

