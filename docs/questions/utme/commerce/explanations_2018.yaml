      - 'Marine losses fall into two main groups: total loss and partial loss.'
      - 'A total loss is when the ship or cargo is completely lost or not worth saving. A partial loss is when only part is lost or damaged; it covers particular average and general average.'
      - 'If a ship bringing rice to Apapa sinks, it is a total loss; if some bags are soaked by sea water, it is a partial loss.'
      - 'Remember: all of it, or part of it.'
      - 'The trap is C. Particular average and general average are both kinds of partial loss, so they are not the two main groups.'
    hint: 'Was all of it lost, or only part?'
    why:
      B: 'Voyage and time policies are kinds of marine policy, not kinds of loss.'
      C: 'Particular and general average are both kinds of partial loss.'
      D: '"Actual loss" and "general loss" are not the two main classes of marine loss.'

