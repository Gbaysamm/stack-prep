  29:
    moments:
      - section: 'The question'
        say: 'A company may raise up to sixty thousand naira, but it issues only some shares. How much has it actually issued?'
        write: 'Authorized ₦60,000;  36,000 shares at 150k;  issued capital = ?'
      - section: 'Name it'
        say: 'This is issued capital, the part of authorized capital actually offered to shareholders.'
        write: 'Issued capital ≤ authorized capital'
      - section: 'The data'
        say: 'We have thirty six thousand shares, at one hundred and fifty kobo each.'
        write: 'Shares $= 36{,}000$,  price $= 150\text{k}$'
      - section: 'The formula'
        say: 'Issued capital equals the number of shares issued times the price per share.'
        write: '$\text{Issued capital} = \text{Number of shares} \times \text{Price per share}$'
      - section: 'Convert'
        say: 'First change kobo to naira. One hundred kobo make one naira, so one hundred and fifty kobo is one naira fifty kobo.'
        write: '$150\text{k} = ₦1.50$'
      - section: 'Working'
        say: 'Now multiply thirty six thousand by one naira fifty kobo.'
        write: '$36{,}000 \times 1.50$'
      - say: 'Thirty six thousand times one is thirty six thousand, and thirty six thousand times a half is eighteen thousand. Together that is fifty four thousand naira.'
        write: '$= 36{,}000 + 18{,}000 = 54{,}000$'
      - section: 'Check'
        say: 'Fifty four thousand naira is less than the authorized sixty thousand naira, as it must be.'
        write: '₦54,000 < ₦60,000 ✓'
      - section: 'Remember'
        say: 'Remember, authorized is the most you may raise, and issued is what you have actually offered.'
        write: 'Authorized = limit;  issued = shares × price'
      - section: 'Answer'
        say: 'So the issued capital is fifty four thousand naira, which is option C.'
        write: '$\therefore$ Issued capital $= ₦54{,}000$'
        answer: true
    traps:
      A: 'You chose sixty thousand naira. That is the authorized capital, the most the company may raise, not what it issued.'
      B: 'You went for thirty six thousand naira. That counts each share as one naira and forgets the price of one hundred and fifty kobo.'
      D: 'You picked ninety thousand naira. That prices each share at two naira fifty kobo, and it is more than the authorized capital.'
