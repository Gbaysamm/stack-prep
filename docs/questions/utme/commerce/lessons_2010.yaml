# UTME 2010 Commerce, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Nigerian Commerce teacher works on the
# board: the question, the term named, the definition or rule, how it works in a real
# transaction (or the calculation with data, formula, working and check), a Nigerian example, a
# way to remember it, and the answer moment that names the option.
#
#   say:     heard, not read. Abbreviations read as letters, money in words, percentages as
#            "per cent", no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2010.yaml. Answers match that file. Q1, the
# paper-type question, is left out, so 49 questions have a lesson.
format_version: 1
exam_year: 2010
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'What makes a nation rich? Is it one market, or something much bigger? Let us see.'
        write: 'The wealth of a nation depends on the volume of its ?'
      - section: 'Name it'
        say: 'This is the importance of commerce to a nation.'
        write: 'Commerce and national wealth'
      - section: 'The rule'
        say: 'Commerce is all of trade, together with the aids to trade, which are banking, transport, insurance, communication, warehousing and advertising.'
        write: 'Commerce = trade + aids to trade'
      - section: 'How it works'
        say: 'Every time goods move from producer to consumer, someone earns income, the government earns tax, and jobs are created.'
        write: 'More trade ⇒ more incomes, jobs and taxes'
      - say: 'So the more commercial activity a country has, the richer it becomes.'
        write: 'Volume of commerce ⇑ ⇒ wealth ⇑'
      - section: 'In Nigeria'
        say: 'A bag of rice moves from a mill in Kano, by lorry, to a wholesaler in Onitsha and a retailer in Aba. Each step creates income.'
        write: 'Kano mill → lorry → Onitsha wholesaler → Aba retailer'
      - section: 'Remember'
        say: 'Remember, more trade and aids to trade means more wealth.'
        write: 'More commerce, more wealth'
      - section: 'Answer'
        say: 'So the wealth of a nation depends on the volume of its commercial activities, which is option B.'
        write: '$\therefore$ commercial activities'
        answer: true
    traps:
      A: 'You went for bilateral trade. That is trade between two countries only, just one small part of commerce.'
      C: 'You chose multilateral trade. That is foreign trade among many countries, still only one part of commerce.'
      D: 'You picked the stock market. It is one institution inside commerce, not the whole of it.'
  3:
    moments:
      - section: 'The question'
        say: 'A surgeon and a load carrier both work hard. So what makes one skilled and the other unskilled?'
        write: 'Skilled vs unskilled labour, told apart by ?'
      - section: 'Name it'
        say: 'This is labour, the human factor of production.'
        write: 'Labour = human effort in production'
      - section: 'The rule'
        say: 'Skilled labour has special knowledge that comes from education and training. Unskilled labour needs little or no training.'
        write: 'Skilled = educated and trained'
      - section: 'How it works'
        say: 'A worker becomes skilled through schooling, apprenticeship or professional training.'
        write: 'School, apprenticeship, professional course ⇒ skill'
      - section: 'In Nigeria'
        say: 'A trained electrician wiring a house in Ibadan is skilled labour. The man who helps him carry the ladder is unskilled labour.'
        write: 'Electrician = skilled;  helper = unskilled'
      - section: 'Remember'
        say: 'Remember, skill comes from schooling and training.'
        write: 'Skill ⇐ schooling + training'
      - section: 'Answer'
        say: 'So skilled and unskilled labour are told apart by education and training, which is option A.'
        write: '$\therefore$ education and training'
        answer: true
    traps:
      B: 'You chose available resources. Those describe the firm, not the skill of the worker.'
      C: 'You went for level of commitment. An unskilled worker can be very committed, so commitment does not make skill.'
      D: 'You picked salaries and wages. Skilled workers often earn more, but pay is the result of skill, not what makes it.'
  4:
    moments:
      - section: 'The question'
        say: 'A doctor finishes his hospital shift, then visits patients at home in the evening. What kind of service worker is he then?'
        write: 'Doctor treating patients at home after official duty = ?'
      - section: 'Name it'
        say: 'This is service occupation, which is either direct or indirect.'
        write: 'Services = direct or indirect'
      - section: 'The rule'
        say: 'A direct service worker gives personal service to the person who pays him. An indirect service worker serves the public and is paid by government or an employer.'
        write: 'Direct = paid by the person served'
      - section: 'How it works'
        say: 'At the government hospital, the doctor is paid by government. At the home visits, the patients pay him themselves.'
        write: 'Home visit ⇒ patient pays doctor directly'
      - section: 'In Nigeria'
        say: 'A Lagos hospital doctor who treats a sick neighbour at home in the evening and charges a fee is giving a direct service.'
        write: 'Evening home visit, fee paid ⇒ direct service'
      - section: 'Remember'
        say: 'Remember, direct service is paid for directly by the person served.'
        write: 'Direct service = direct payment'
      - section: 'Answer'
        say: 'So the doctor visiting patients at home is a direct service worker, which is option B.'
        write: '$\therefore$ a direct service worker'
        answer: true
    traps:
      A: 'You chose a community development worker. That person serves a whole community for an agency, not private patients.'
      C: 'You went for an indirect service worker. His hospital duty may be indirect, but the home visits are paid by the patients.'
      D: 'You picked both. The question asks only about the home visits, and those are direct service.'
  5:
    moments:
      - section: 'The question'
        say: 'A factory makes cement, and a builder uses it to build a bridge. Which stage of production are they in?'
        write: 'Manufacturing and construction come under ?'
      - section: 'Name it'
        say: 'These are the three types of production, which are primary, secondary and tertiary.'
        write: 'Primary, secondary, tertiary'
      - section: 'The rule'
        say: 'Primary production takes raw materials from nature. Secondary production makes goods and builds. Tertiary production is commerce and services.'
        write: 'Primary = extract;  secondary = make, build;  tertiary = trade, serve'
      - section: 'How it works'
        say: 'Manufacturing changes raw materials into goods, and construction builds structures. Both come after extraction, so both are secondary.'
        write: 'Manufacturing + construction ⇒ secondary'
      - section: 'In Nigeria'
        say: 'Dangote Cement turning limestone into cement is manufacturing. A firm building a bridge with that cement is construction.'
        write: 'Limestone → cement → bridge'
      - section: 'Remember'
        say: 'Remember, first take from nature, second make and build, third trade and serve.'
        write: '1st take, 2nd make, 3rd serve'
      - section: 'Answer'
        say: 'So manufacturing and construction are secondary production, which is option C.'
        write: '$\therefore$ secondary production'
        answer: true
    traps:
      A: 'You went for primary production. That only takes raw materials from nature, before anything is made.'
      B: 'You chose tertiary production. That is commerce and services, not making goods.'
      D: 'You picked direct service. That is personal service, like a barber, not production of goods.'
  6:
    moments:
      - section: 'The question'
        say: 'Four rewards, rent, wages, interest and profit. Which factor earns each one, in that order?'
        write: 'Rent, wages, interest, profit accrue from ?'
      - section: 'Name it'
        say: 'These are the four factors of production and their rewards.'
        write: 'Factors of production and rewards'
      - section: 'The rule'
        say: 'Land earns rent. Labour earns wages. Capital earns interest. The entrepreneur earns profit.'
        write: 'Land → rent,  labour → wages,  capital → interest,  entrepreneur → profit'
      - section: 'How it works'
        say: 'Now match them in the order the question gives, rent first, then wages, then interest, then profit.'
        write: 'Rent, wages, interest, profit ⇒ land, labour, capital, entrepreneur'
      - section: 'In Nigeria'
        say: 'A trader in Onitsha pays rent for her shop, wages to her sales girl, interest on her bank loan, and keeps the profit herself.'
        write: 'Shop rent, sales girl wages, loan interest, her profit'
      - section: 'Remember'
        say: 'Remember the order, land, labour, capital, entrepreneur, earning rent, wages, interest, profit.'
        write: 'L L C E  ↔  R W I P'
      - section: 'Answer'
        say: 'So the rewards accrue from land, labour, capital and entrepreneur respectively, which is option C.'
        write: '$\therefore$ land, labour, capital and entrepreneur'
        answer: true
    traps:
      A: 'You went for capital first. But rent is the reward for land, and interest is the reward for capital.'
      B: 'You chose B. Wages go to labour, not the entrepreneur, and profit goes to the entrepreneur, not capital.'
      D: 'You picked D. Rent is earned by land, not labour, and interest by capital, not land.'
  7:
    moments:
      - section: 'The question'
        say: 'Which factor of production wears out and loses value year after year?'
        write: 'Factor subject to depreciation = ?'
      - section: 'Name it'
        say: 'This is capital, the man made factor of production.'
        write: 'Capital = man-made aids to production'
      - section: 'The rule'
        say: 'Depreciation is the loss in value of an asset through wear and tear, age, or going out of date.'
        write: 'Depreciation = loss of value by wear and tear'
      - section: 'How it works'
        say: 'Machines, buildings and vehicles wear out as they are used. Land is a gift of nature and does not wear out in this way.'
        write: 'Machines wear out;  land does not'
      - section: 'In Nigeria'
        say: 'A grinding machine bought for two hundred thousand naira by a garri processor in Ogun State is worth less after five years of use.'
        write: 'Machine ₦200,000 → worth less after 5 years'
      - section: 'Remember'
        say: 'Remember, capital is man made, so it wears out.'
        write: 'Man-made ⇒ wears out'
      - section: 'Answer'
        say: 'So the factor subject to depreciation is capital, which is option A.'
        write: '$\therefore$ capital'
        answer: true
    traps:
      B: 'You chose land. Land is a gift of nature and is not used up like a machine.'
      C: 'You went for labour. Workers tire and age, but depreciation is the wear of man made assets.'
      D: 'You picked the entrepreneur. He is a person who takes risks, and he is not depreciated.'
  8:
    moments:
      - section: 'The question'
        say: 'Break a job into small stages, give each worker one stage. What does that lead to in the end?'
        write: 'Division of labour ultimately leads to ?'
      - section: 'Name it'
        say: 'This is division of labour.'
        write: 'Division of labour'
      - section: 'The rule'
        say: 'Division of labour is breaking a job into stages, with each worker doing one stage.'
        write: 'One job → many stages → one worker per stage'
      - section: 'How it works'
        say: 'A worker who does the same stage every day becomes expert at it. In the end each one concentrates on what he does best, and that is specialization.'
        write: 'Same stage daily ⇒ expert ⇒ specialization'
      - section: 'In Nigeria'
        say: 'In a Kano shoe workshop, one person cuts the leather, another stitches, and a third fixes the soles.'
        write: 'Cut → stitch → fix soles'
      - section: 'Remember'
        say: 'Remember, divide the work and each worker specializes.'
        write: 'Divide ⇒ specialize'
      - section: 'Answer'
        say: 'So division of labour ultimately leads to specialization, which is option C.'
        write: '$\therefore$ specialization'
        answer: true
    traps:
      A: 'You chose conservation. That is about saving resources, not dividing work.'
      B: 'You went for integration. That is the joining of firms, not the result of dividing a job.'
      D: 'You picked repetition. Workers do repeat tasks, but that is a feature along the way. The end result is specialization.'
  9:
    moments:
      - section: 'The question'
        say: 'A worker takes paddy rice and turns it into clean bagged rice. What kind of activity is that?'
        write: 'A worker who processes rice is engaged in ?'
      - section: 'Name it'
        say: 'This is an industrial occupation.'
        write: 'Industrial occupation'
      - section: 'The rule'
        say: 'Industrial occupations are extractive, which takes from nature, manufacturing, which changes raw materials into goods, and constructive, which builds.'
        write: 'Extractive, manufacturing, constructive'
      - section: 'How it works'
        say: 'Paddy is cleaned, parboiled, milled and bagged. The form of the raw material changes, so this is manufacturing.'
        write: 'Paddy → clean → parboil → mill → bag'
      - section: 'In Nigeria'
        say: 'A worker at a rice mill in Abakaliki that turns paddy into bagged rice is in manufacturing.'
        write: 'Abakaliki rice mill ⇒ manufacturing'
      - section: 'Remember'
        say: 'Remember, if it changes the form of the raw material, it is manufacturing.'
        write: 'Change of form ⇒ manufacturing'
      - section: 'Answer'
        say: 'So a worker who processes rice is engaged in manufacturing activity, which is option D.'
        write: '$\therefore$ manufacturing activity'
        answer: true
    traps:
      A: 'You chose constructive activity. That is building roads, bridges and houses.'
      B: 'You went for commercial activity. That is buying, selling and the aids to trade, not processing.'
      C: 'You picked extractive activity. The farmer who grows the paddy is extractive, but the miller processes it.'
  10:
    moments:
      - section: 'The question'
        say: 'You buy a fridge, and the shop delivers it and fixes it under warranty. Who usually gives that service?'
        write: 'After-sales service is usually rendered by ?'
      - section: 'Name it'
        say: 'This is after sales service, a function of the retailer to the consumer.'
        write: 'After-sales service'
      - section: 'The rule'
        say: 'After sales service is help given to the buyer after the sale, such as delivery, installation and repairs.'
        write: 'Delivery, installation, repairs'
      - section: 'How it works'
        say: 'The retailer is the last link with the consumer, so the buyer comes back to the shop for help. This keeps the customer loyal.'
        write: 'Retailer = last link to consumer'
      - section: 'In Nigeria'
        say: 'A shop in Ikeja sells you a fridge, delivers it to your house, and repairs it under warranty.'
        write: 'Ikeja shop: sell, deliver, repair'
      - section: 'Remember'
        say: 'Remember, the retailer meets the consumer, so the retailer serves after the sale.'
        write: 'Retailer serves after the sale'
      - section: 'Answer'
        say: 'So after sales service is usually rendered by a retailer, which is option A.'
        write: '$\therefore$ a retailer'
        answer: true
    traps:
      B: 'You chose a wholesaler. The wholesaler sells to retailers, not to the final consumer who needs the service.'
      C: 'You went for an agent. An agent arranges sales for a principal, but does not usually service the goods.'
      D: 'You picked an entrepreneur. That is a general name for any risk taker, not the seller who serves the buyer.'
  11:
    moments:
      - section: 'The question'
        say: 'In some shops you pick goods from the shelf yourself, with nobody standing in the way. What is that trend called?'
        write: 'Retail trend giving free access to products = ?'
      - section: 'Name it'
        say: 'This is self service, a modern trend in retailing.'
        write: 'Self-service'
      - section: 'The rule'
        say: 'In self service, goods are on open shelves, customers choose for themselves, and pay at a checkout.'
        write: 'Open shelves → choose → pay at checkout'
      - section: 'How it works'
        say: 'No attendant stands between buyer and goods, so customers can see and compare freely. It saves staff costs too.'
        write: 'Free access, fewer staff'
      - section: 'In Nigeria'
        say: 'In a Shoprite supermarket you push a trolley, take the noodles and soap you want, and pay at the till.'
        write: 'Shoprite: trolley → shelves → till'
      - section: 'Remember'
        say: 'Remember, self service means you serve yourself.'
        write: 'Serve yourself'
      - section: 'Answer'
        say: 'So the trend that gives free access to products is self service, which is option C.'
        write: '$\therefore$ self-service'
        answer: true
    traps:
      A: 'You chose after sales service. That is help after buying, not free access to goods.'
      B: 'You went for branding. That gives products names, but does not let shoppers handle them.'
      D: 'You picked the vending machine. It sells a few items behind glass, so you cannot handle the goods.'
  12:
    moments:
      - section: 'The question'
        say: 'Someone buys a whole trailer of goods from the factory and sells them in smaller lots to shops. What is that activity?'
        write: 'Buy in bulk, sell in small lots to retailers = ?'
      - section: 'Name it'
        say: 'This is wholesaling, the trade between the producer and the retailer.'
        write: 'Producer → wholesaler → retailer'
      - section: 'The rule'
        say: 'A wholesaler buys in large quantities from manufacturers and sells in smaller quantities to retailers. This is called breaking bulk.'
        write: 'Wholesaler breaks bulk for retailers'
      - section: 'How it works'
        say: 'The manufacturer avoids selling to thousands of small shops, and the retailer buys only what he can sell.'
        write: 'Saves the maker work;  retailer buys small'
      - section: 'In Nigeria'
        say: 'A wholesaler at Idumota market buys a trailer of noodle cartons and sells ten cartons at a time to shop owners.'
        write: 'Idumota: trailer in, 10 cartons out'
      - section: 'Remember'
        say: 'Remember, wholesalers buy in bulk and break bulk for retailers.'
        write: 'Bulk in, small lots out'
      - section: 'Answer'
        say: 'So buying in bulk and selling in small lots to retailers is wholesaling, which is option B.'
        write: '$\therefore$ wholesaling'
        answer: true
    traps:
      A: 'You chose assembling. That is putting parts together in a factory, not buying and selling.'
      C: 'You went for retailing. The retailer sells to final consumers, not to retailers.'
      D: 'You picked merchandising. That is planning and displaying goods for sale, not buying in bulk for shops.'
  13:
    moments:
      - section: 'The question'
        say: 'The question counts visible and invisible items together. Many students stop at visible goods, and that is the trap.'
        write: 'Visible + invisible exports and imports compared = ?'
      - section: 'Name it'
        say: 'This is the balance of payments.'
        write: 'Balance of payments'
      - section: 'The rule'
        say: 'The balance of payments records all of a country''s receipts from and payments to other countries, for goods and services, in money terms.'
        write: 'All receipts and payments, goods + services'
      - section: 'How it works'
        say: 'Visible items are goods you can see, like crude oil. Invisible items are services, like shipping, insurance and tourism.'
        write: 'Visible = goods;  invisible = services'
      - say: 'The balance of trade counts only the visible goods. Add the invisibles, and you have the balance of payments.'
        write: 'Balance of trade + invisibles = balance of payments'
      - section: 'In Nigeria'
        say: 'Nigeria''s crude oil exports are visible. The freight paid to foreign shipping lines is invisible. Both go into the balance of payments.'
        write: 'Crude oil (visible) + freight (invisible)'
      - section: 'Remember'
        say: 'Remember, balance of trade is goods only, balance of payments is goods plus services.'
        write: 'Trade = goods;  payments = goods + services'
      - section: 'Answer'
        say: 'So the comparison of visible and invisible exports and imports is the balance of payments, which is option A.'
        write: '$\therefore$ balance of payments'
        answer: true
    traps:
      B: 'You chose terms of trade. That is the rate at which export prices exchange for import prices.'
      C: 'You went for balance of trade. It counts visible goods only, without the invisible services.'
      D: 'You picked terms of payment. Those are the conditions on which a buyer pays, such as cash or credit.'
  14:
    moments:
      - section: 'The question'
        say: 'An importer tells his agent abroad, buy from any factory you like. Which document does that?'
        write: 'Document giving the agent a free hand to buy from any maker = ?'
      - section: 'Name it'
        say: 'This is the indent, the order an importer sends to an agent abroad.'
        write: 'Indent = importer''s order to agent abroad'
      - section: 'The rule'
        say: 'An open indent leaves the agent free to buy from any manufacturer. A closed indent names the one manufacturer he must use.'
        write: 'Open = any maker;  closed = named maker'
      - section: 'How it works'
        say: 'With an open indent, the agent shops around for the best price and quality.'
        write: 'Open indent ⇒ agent shops around'
      - section: 'In Nigeria'
        say: 'An importer in Aba sends an open indent for five hundred generators, so his agent in China may buy from any good factory.'
        write: 'Aba importer, 500 generators, any factory'
      - section: 'Remember'
        say: 'Remember, open indent, open choice. Closed indent, choice closed.'
        write: 'Open indent = open choice'
      - section: 'Answer'
        say: 'So the document that gives a free hand to buy from any manufacturer is an open indent, which is option C.'
        write: '$\therefore$ an open indent'
        answer: true
    traps:
      A: 'You chose a consular invoice. That is a certified invoice for customs, not an order to buy.'
      B: 'You went for a closed indent. That names one manufacturer, so it gives no free hand.'
      D: 'You picked a freight note. That is the shipowner''s bill for carrying goods.'
  15:
    moments:
      - section: 'The question'
        say: 'Goods arrive at a port, and then leave again for another country. What kind of trade is that?'
        write: 'Entrepot trade usually involves ?'
      - section: 'Name it'
        say: 'This is entrepot trade, one of the types of foreign trade.'
        write: 'Entrepot trade'
      - section: 'The rule'
        say: 'Entrepot trade is importing goods into a country in order to re export them to another country.'
        write: 'Import → re-export'
      - section: 'How it works'
        say: 'The goods may be sorted or repacked, but they are not used in the country that handles them. That country earns port and storage charges.'
        write: 'Handled, not used ⇒ earns port charges'
      - section: 'In Nigeria'
        say: 'Goods landed at Cotonou and then sent on to Nigeria are entrepot trade for the Republic of Benin.'
        write: 'Cotonou port → Nigeria'
      - section: 'Remember'
        say: 'Remember, entrepot means in, then out again.'
        write: 'In, then out again'
      - section: 'Answer'
        say: 'So entrepot trade involves importing goods to be re exported, which is option C.'
        write: '$\therefore$ importing goods to be re-exported'
        answer: true
    traps:
      A: 'You chose exchanging goods within a nation. That is home trade.'
      B: 'You went for exchanging goods among countries. That is foreign trade in general, not entrepot in particular.'
      D: 'You picked exporting to re import. That is the reverse. Entrepot imports in order to re export.'
  16:
    moments:
      - section: 'The question'
        say: 'Your goods sit in the port warehouse. What paper does the port give you to show they are yours?'
        write: 'Document from the port to the owner of goods in its warehouse = ?'
      - section: 'Name it'
        say: 'This is the dock warrant.'
        write: 'Dock warrant'
      - section: 'The rule'
        say: 'A dock warrant is issued by the port authority to the owner of goods stored in its warehouse. It proves who owns the goods.'
        write: 'Issued by port ⇒ proof of ownership'
      - section: 'How it works'
        say: 'The owner can collect the goods with it, or sell them by signing the warrant over to a buyer, without moving the goods.'
        write: 'Endorse the warrant ⇒ goods sold'
      - section: 'In Nigeria'
        say: 'An importer whose goods are in a port warehouse at Apapa holds a dock warrant, and can sell the goods by passing it on.'
        write: 'Apapa warehouse, warrant passed on'
      - section: 'Remember'
        say: 'Remember, goods in the dock warehouse, warrant in the owner''s hand.'
        write: 'Goods in dock, warrant in hand'
      - section: 'Answer'
        say: 'So the document issued by the port to the owner of stored goods is a dock warrant, which is option D.'
        write: '$\therefore$ dock warrant'
        answer: true
    traps:
      A: 'You chose a mate''s receipt. That is given by the ship''s officer when goods are loaded on board.'
      B: 'You went for a bill of sight. That goes to customs when the importer cannot fully describe his goods.'
      C: 'You picked a bill of lading. That comes from the shipping company for goods carried by sea, not from the port for goods stored.'
  17:
    moments:
      - section: 'The question'
        say: 'A buyer writes down exactly what goods he wants. Many students say invoice, and that is the trap.'
        write: 'Details of goods required by the purchaser are in ?'
      - section: 'Name it'
        say: 'This is the indent, the importer''s order.'
        write: 'Indent = buyer''s order'
      - section: 'The rule'
        say: 'An indent sets out the goods required, with their description, quantity, quality and price, and how they are to be shipped.'
        write: 'Description, quantity, quality, price, shipping'
      - section: 'How it works'
        say: 'The buyer writes the indent. The seller answers with an invoice that bills him for the goods sent.'
        write: 'Buyer → indent;  seller → invoice'
      - section: 'In Nigeria'
        say: 'A trader in Onitsha who wants two hundred bales of fabric from India writes an indent with the colours and sizes he wants.'
        write: 'Onitsha trader: 200 bales, colours, sizes'
      - section: 'Remember'
        say: 'Remember, the buyer indents and the seller invoices.'
        write: 'Buyer indents, seller invoices'
      - section: 'Answer'
        say: 'So the details of goods required by the purchaser are outlined in an indent, which is option B.'
        write: '$\therefore$ an indent'
        answer: true
    traps:
      A: 'You chose a consular invoice. That is the seller''s invoice certified by a consul for customs.'
      C: 'You went for an invoice. It lists goods too, but it is sent by the seller to bill the buyer.'
      D: 'You picked a certificate of origin. That states the country where the goods were made.'
  18:
    moments:
      - section: 'The question'
        say: 'A foreign firm sells its goods here cheaper than it costs to make them. What is that called?'
        write: 'Selling abroad below cost = ?'
      - section: 'Name it'
        say: 'This is dumping, an unfair practice in foreign trade.'
        write: 'Dumping'
      - section: 'The rule'
        say: 'Dumping is selling goods in a foreign market below their cost of production, or below the home price.'
        write: 'Price abroad < cost of production'
      - section: 'How it works'
        say: 'A firm with surplus goods sells them cheaply abroad. Local makers in the importing country cannot compete, and some close down.'
        write: 'Cheap imports ⇒ local firms suffer'
      - section: 'In Nigeria'
        say: 'Cheap imported textiles sold below cost have hurt textile mills in Kaduna and Kano.'
        write: 'Cheap imported cloth ⇒ Kaduna mills hurt'
      - section: 'Remember'
        say: 'Remember, dumping means selling abroad below cost.'
        write: 'Dump = below cost abroad'
      - section: 'Answer'
        say: 'So selling goods abroad below their cost is dumping, which is option A.'
        write: '$\therefore$ dumping'
        answer: true
    traps:
      B: 'You chose depreciation. That is a fall in the value of an asset or a currency.'
      C: 'You went for devaluation. That is a deliberate cut in the official value of a currency.'
      D: 'You picked discounting. That is a price cut for buyers, not selling abroad below cost.'
  19:
    moments:
