# UTME 2011 Commerce, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Nigerian Commerce teacher works on the
# board: the question, the term named, its definition or rule, how it works in a real
# transaction, a Nigerian example, a way to remember it, and the answer moment that names the
# option.
#
#   say:     heard, not read. Abbreviations read as letters ("N A F D A C"), money in words,
#            percentages as "per cent", no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2011.yaml. Answers match that file. Q1, the
# paper-type question, is left out, so 49 questions have a lesson.
format_version: 1
exam_year: 2011
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'Commerce does many useful things. But which one is the most important, the job that all the others serve?'
        write: 'The most important function of commerce is ?'
      - section: 'Name it'
        say: 'This is the function of commerce.'
        write: 'Function of commerce'
      - section: 'The rule'
        say: 'Commerce is all the activities that help goods and services pass from producers to consumers. Its central job is to make exchange possible.'
        write: 'Commerce = activities that make exchange possible'
      - section: 'How it works'
        say: 'Trade does the buying and selling. Banking, insurance, transport and the other aids to trade clear the problems that stand in the way.'
        write: 'Trade + aids to trade ⇒ exchange happens'
      - say: 'Every other benefit, like profit or good business relationships, comes from this one job.'
        write: 'Profit, relationships ⇐ come from exchange'
      - section: 'In Nigeria'
        say: 'A rice farmer in Kebbi and a family in Port Harcourt never meet, yet the rice reaches the family through traders, lorries, banks and shops.'
        write: 'Kebbi farmer → traders, lorries, banks → Port Harcourt family'
      - section: 'Remember'
        say: 'Remember, commerce exists so that people can exchange.'
        write: 'Commerce exists for exchange'
      - section: 'Answer'
        say: 'So the most important function of commerce is facilitating exchange among individuals and firms, which is option C.'
        write: '$\therefore$ facilitating exchange among individuals and firms'
        answer: true
    traps:
      A: 'You went for business relationships. Those grow out of exchange, so they are a result, not the main function.'
      B: 'You chose helping people improve their profits. Profit is the reward of the businessman, not the main function of commerce.'
      D: 'You picked banking and insurance. They are only two of the aids to trade, a part of commerce, not its main job.'
  3:
    moments:
      - section: 'The question'
        say: 'Every job in Nigeria falls into one of three big groups. Which three?'
        write: 'Three main classes of occupation = ?'
      - section: 'Name it'
        say: 'This is the classification of occupation. An occupation is the work a person does to earn a living.'
        write: 'Occupation = work done to earn a living'
      - section: 'The rule'
        say: 'The three main classes are industrial occupation, commercial occupation and services.'
        write: 'Industry, commerce, services'
      - section: 'How it works'
        say: 'Industry makes or extracts goods. Commerce distributes them. Services are personal work done for other people.'
        write: 'Industry makes · Commerce distributes · Services serve'
      - section: 'In Nigeria'
        say: 'A tin miner in Jos is in industry, a cement dealer in Onitsha is in commerce, and a nurse in a Lagos hospital gives a service.'
        write: 'Miner (industry), dealer (commerce), nurse (service)'
      - section: 'Remember'
        say: 'Remember the letters I C S, industry, commerce, services.'
        write: 'I C S'
      - section: 'Answer'
        say: 'So the three main classifications are industry, commerce and services, which is option D.'
        write: '$\therefore$ industry, commerce and services'
        answer: true
    traps:
      A: 'You went for construction, trade and services. Construction is a branch of industry and trade is a branch of commerce, so they are too small to be main classes.'
      B: 'You chose manufacturing, industry and services. Manufacturing is already part of industry, and commerce is missing.'
      C: 'You picked farming, banking and trading. Those are single examples of jobs, not the three main classes.'
  4:
    moments:
      - section: 'The question'
        say: 'A company drills deep into the ground looking for crude oil. What kind of work is that?'
        write: 'Oil exploration company is engaged in ?'
      - section: 'Name it'
        say: 'This is extractive occupation, a branch of industrial occupation.'
        write: 'Industry → extractive, manufacturing, constructive'
      - section: 'The rule'
        say: 'Extractive occupation takes natural resources out of the land, the sea or from under the ground.'
        write: 'Extractive = taking resources from nature'
      - section: 'How it works'
        say: 'The oil company finds crude oil and draws it out of the earth. It does not change the oil into a new product.'
        write: 'Crude drawn out, not changed'
      - section: 'In Nigeria'
        say: 'Companies drilling for crude around Bonny and Escravos in the Niger Delta are in extractive occupation. So are farmers, fishermen and miners.'
        write: 'Niger Delta wells, farming, fishing, mining'
      - section: 'Remember'
        say: 'Remember, extract means pull out. Anything pulled out of nature is extractive.'
        write: 'Extract = pull out'
      - section: 'Answer'
        say: 'So an oil exploration company is engaged in extractive occupation, which is option C.'
        write: '$\therefore$ extractive occupation'
        answer: true
    traps:
      A: 'You went for tertiary production. That is commerce and services, not taking oil out of the ground.'
      B: 'You chose constructive occupation. That is building houses, roads and bridges.'
      D: 'You picked secondary production. That comes next, when a refinery turns the crude into petrol and kerosene.'
  5:
    moments:
      - section: 'The question'
        say: 'A policeman directs traffic for everybody, yet nobody pays him on the spot. What kind of service is that, and who gives it?'
        write: 'Indirect services are provided by ?'
      - section: 'Name it'
        say: 'This is indirect services, one of the two kinds of services.'
        write: 'Services → direct and indirect'
      - section: 'The rule'
        say: 'Direct services are given to one person who pays for them. Indirect services are given to the public as a whole and paid for by the government.'
        write: 'Direct = one client pays.  Indirect = public, paid by government'
      - section: 'How it works'
        say: 'Civil servants, the police and soldiers serve everybody at once, and their salaries come from taxes.'
        write: 'Civil servants, police, soldiers ⇐ paid from taxes'
      - section: 'In Nigeria'
        say: 'A clerk at a federal ministry in Abuja serves all Nigerians, not one customer.'
        write: 'Ministry clerk, Abuja ⇒ indirect service'
      - section: 'Remember'
        say: 'Remember, indirect services are paid indirectly, through taxes, by the government.'
        write: 'Indirect service, indirect pay'
      - section: 'Answer'
        say: 'So indirect services are provided by civil servants, which is option B.'
        write: '$\therefore$ civil servants'
        answer: true
    traps:
      A: 'You went for traders. Traders buy and sell goods, which is commerce, not a service to the public.'
      C: 'You chose professionals. Doctors and lawyers in practice serve one client who pays them, which is a direct service.'
      D: 'You picked domestic servants. They serve one household directly, so theirs is a direct service.'
  6:
    moments:
      - section: 'The question'
        say: 'The farmer, the factory and the shopkeeper all do something in common. What is it called?'
        write: 'Creating goods and services to satisfy wants = ?'
      - section: 'Name it'
        say: 'This is production.'
        write: 'Production'
      - section: 'The rule'
        say: 'Production is the creation of goods and services to satisfy human wants. It is complete only when the goods reach the consumer.'
        write: 'Production = creating goods and services for human wants'
      - section: 'How it works'
        say: 'It covers getting raw materials, turning them into goods, and the commerce and services that bring them to people.'
        write: 'Primary → secondary → tertiary'
      - section: 'In Nigeria'
        say: 'The cocoa farmer in Ondo, the factory that makes the chocolate drink, and the trader in a Kano market are all producers.'
        write: 'Ondo farmer, factory, Kano trader = producers'
      - section: 'Remember'
        say: 'Remember, production means creating anything that satisfies a want.'
        write: 'Anything that satisfies a want'
      - section: 'Answer'
        say: 'So the creation of goods and services to satisfy human wants is production, which is option C.'
        write: '$\therefore$ production'
        answer: true
    traps:
      A: 'You went for manufacturing. That makes goods only, which is just one part of production.'
      B: 'You chose commercialization. That means running something for profit, not creating goods and services.'
      D: 'You picked entrepreneurship. That is the factor that organizes production, not production itself.'
  7:
    moments:
      - section: 'The question'
        say: 'Division of labour makes a factory faster. But it has a cost to the worker. Which option is that cost?'
        write: 'A limitation of division of labour is ?'
      - section: 'Name it'
        say: 'This is division of labour and its limitations.'
        write: 'Division of labour'
      - section: 'The rule'
        say: 'Division of labour is breaking a job into small tasks, each done by a different worker. It raises output, but it has drawbacks.'
        write: 'Job split into small tasks ⇒ output rises'
      - section: 'How it works'
        say: 'A worker who does the same small task all day soon finds the work dull and boring. That is monotony.'
        write: 'Same task all day ⇒ monotony'
      - say: 'Monotony lowers interest and can cause careless mistakes. Loss of craftsmanship and unemployment are other drawbacks.'
        write: 'Monotony ⇒ less interest, more mistakes'
      - section: 'In Nigeria'
        say: 'Think of a worker at a bottling plant in Ikeja who only fixes caps on bottles for eight hours a day.'
        write: 'Ikeja bottling plant: caps, caps, caps'
      - section: 'Remember'
        say: 'Remember, the same small task again and again means monotony.'
        write: 'Again and again = monotony'
      - section: 'Answer'
        say: 'So a limitation of division of labour is monotony of work, which is option B.'
        write: '$\therefore$ monotony of work'
        answer: true
    traps:
      A: 'You went for saving of time. That is an advantage of division of labour, not a limitation.'
      C: 'You chose reduction in output. Division of labour raises output, which is its main advantage.'
      D: 'You picked improvement in skill. Repeating a task improves skill, so that is an advantage too.'
  8:
    moments:
      - section: 'The question'
        say: 'Limestone comes out of the ground and becomes cement in a factory. Which stage of production is the factory part?'
        write: 'Extracted resources turned into finished goods = ?'
      - section: 'Name it'
        say: 'This is secondary production.'
        write: 'Secondary production'
      - section: 'The rule'
        say: 'Secondary production turns raw materials from the extractive stage into finished goods. It covers manufacturing and construction.'
        write: 'Raw materials → finished goods'
      - section: 'How it works'
        say: 'First the material is taken from nature, which is primary. Then a factory changes its form so that we can use it, which is secondary.'
        write: 'Primary takes out → secondary changes form'
      - section: 'In Nigeria'
        say: 'Limestone dug at Obajana becomes Dangote cement, and crude oil becomes petrol at the Port Harcourt refinery.'
        write: 'Limestone → cement.  Crude → petrol'
      - section: 'Remember'
        say: 'Remember, primary takes it out, secondary makes it up, tertiary moves it on.'
        write: 'Takes out · makes up · moves on'
      - section: 'Answer'
        say: 'So resources from the extractive sector turned into finished products are secondary production, which is option D.'
        write: '$\therefore$ secondary production'
        answer: true
    traps:
      A: 'You went for primary production. That is the digging out itself, before anything is turned into finished goods.'
      B: 'You chose tertiary production. That is commerce and services, which move goods to people.'
      C: 'You picked direct production. That is producing for your own use, not changing raw materials in a factory.'
  9:
    moments:
      - section: 'The question'
        say: 'Look at the tree. Commerce splits into two boxes, Trade and a box marked one. What belongs in box one?'
        write: 'In the tree, I = ?'
      - section: 'Name it'
        say: 'This is the scope of commerce, the two branches it is made of.'
        write: 'Scope of commerce'
      - section: 'The rule'
        say: 'Commerce has two branches. Trade is the buying and selling. Aids to trade are the services that make trade easy.'
        write: 'Commerce = trade + aids to trade'
      - section: 'Read the tree'
        say: 'Commerce splits into Trade and box one, so box one must be aids to trade.'
        write: 'Commerce → Trade and I ⇒ I = aids to trade'
      - say: 'Trade splits into box two and Foreign, so box two is home trade, which splits into retail and wholesale.'
        write: 'II = home trade → retail, wholesale'
      - section: 'In Nigeria'
        say: 'A trader in Balogun market does trade. Her bank, the lorry that brings her stock and the insurer of her shop are aids to trade.'
        write: 'Balogun trader + bank, lorry, insurer'
      - section: 'Remember'
        say: 'Remember, commerce is trade plus aids to trade.'
        write: 'Trade + aids to trade'
      - section: 'Answer'
        say: 'So box one stands for aids to trade, which is option A.'
        write: '$\therefore$ I = aids to trade'
        answer: true
    traps:
      B: 'You went for publicity. That is a form of promotion, not a whole branch of commerce.'
      C: 'You chose home trade. Home trade is box two, under Trade, not box one beside it.'
      D: 'You picked advertising. That is only one aid to trade, not the whole branch.'
  10:
    moments:
      - section: 'The question'
        say: 'Between the factory and the shop, someone stands in the middle. Who is that?'
        write: 'Links the producer with the retailer = ?'
      - section: 'Name it'
        say: 'This is the wholesaler.'
        write: 'Wholesaler'
      - section: 'The rule'
        say: 'A wholesaler buys goods in large quantities from producers and sells them in smaller quantities to retailers.'
        write: 'Buys in bulk from producers, sells to retailers'
      - section: 'How it works'
        say: 'The chain of distribution runs producer, wholesaler, retailer, consumer. The wholesaler is the link between the producer and the retailer.'
        write: 'Producer → wholesaler → retailer → consumer'
      - section: 'In Nigeria'
        say: 'A wholesaler at Idumota buys whole lorry loads of soap from the factory and sells cartons to shop owners from all over Lagos.'
        write: 'Idumota: lorry loads in, cartons out'
      - section: 'Remember'
        say: 'Remember, W comes before R. Wholesaler, then retailer.'
        write: 'W before R'
      - section: 'Answer'
        say: 'So the person who links the producer with the retailer is a wholesaler, which is option B.'
        write: '$\therefore$ a wholesaler'
        answer: true
    traps:
      A: 'You went for an agent. An agent acts for someone else for a commission and does not own the goods.'
      C: 'You chose an entrepreneur. That is the person who organizes production, not a link in distribution.'
      D: 'You picked a principal. A principal is the person an agent works for.'
  11:
    moments:
      - section: 'The question'
        say: 'The shopkeeper on your street does many things for you. Which of these is truly a function of a retailer?'
        write: 'A function of a retailer is ?'
      - section: 'Name it'
        say: 'This is the retailer, the last link in the chain of distribution.'
        write: 'Retailer = last link before the consumer'
      - section: 'The rule'
        say: 'A retailer buys from the wholesaler and sells to the final consumer in small quantities.'
        write: 'Buys from wholesaler, sells to consumer'
      - section: 'How it works'
        say: 'He buys in cartons and sells one tin or one sachet at a time, the size a customer can afford. That is breaking bulk.'
        write: 'Carton → single units = breaking bulk'
      - section: 'In Nigeria'
        say: 'A provision shop in Surulere buys a carton of forty eight tins of milk and sells them one tin at a time.'
        write: 'Carton of 48 tins → one tin at a time'
      - section: 'Remember'
        say: 'Remember, the retailer breaks the carton for the customer.'
        write: 'Retailer breaks the carton'
      - section: 'Answer'
        say: 'So one function of a retailer is breaking of bulk, which is option D.'
        write: '$\therefore$ breaking of bulk'
        answer: true
    traps:
      A: 'You went for financing production. That is a function of the wholesaler, who may pay producers in advance.'
      B: 'You chose credit to relations. A retailer may give credit to regular customers, not to his relations.'
      C: 'You picked jobs for customers. A retailer sells to customers, he does not employ them.'
  12:
    moments:
      - section: 'The question'
        say: 'Some manufacturers skip the wholesaler and the retailer and sell straight to you. What are they mainly after?'
        write: 'Main aim of manufacturers selling direct to consumers = ?'
      - section: 'Name it'
        say: 'This is direct selling by manufacturers.'
        write: 'Direct selling'
      - section: 'The rule'
        say: 'Direct selling means the manufacturer sells to consumers without middlemen, through its own shops, vans or website.'
        write: 'Manufacturer → consumer, no middlemen'
      - section: 'How it works'
        say: 'Each middleman adds his own profit to the price. When the manufacturer cuts him out, it keeps that profit for itself.'
        write: 'Middleman''s profit ⇒ kept by the manufacturer'
      - say: 'So the profit margin on each unit grows, even though the manufacturer now pays for storage and delivery.'
        write: 'Larger profit margin per unit'
      - section: 'In Nigeria'
        say: 'A bakery in Ibadan that sells bread from its own vans keeps the margin a distributor would have taken.'
        write: 'Ibadan bakery vans keep the margin'
      - section: 'Remember'
        say: 'Remember, cut out the middleman, keep his margin.'
        write: 'Cut him out, keep his margin'
      - section: 'Answer'
        say: 'So the main aim of selling directly to consumers is to maximize profit margin, which is option D.'
        write: '$\therefore$ maximize profit margin'
        answer: true
    traps:
      A: 'You went for reducing transport cost. Selling direct usually raises transport cost, because the maker now delivers to many small buyers.'
      B: 'You chose avoiding individual consumers. Direct selling means dealing with them, not avoiding them.'
      C: 'You picked encouraging middlemen. Direct selling removes the middlemen.'
  13:
    moments:
      - section: 'The question'
        say: 'When does a country run into trouble with its balance of payments?'
        write: 'Balance of payments problems arise when ?'
      - section: 'Name it'
        say: 'This is a balance of payments problem, which is called a deficit.'
        write: 'Balance of payments deficit'
      - section: 'The rule'
        say: 'The balance of payments records all the money a country receives from abroad and all it pays abroad. Trouble starts when more goes out than comes in.'
        write: 'Payments out > receipts in ⇒ deficit'
      - section: 'How it works'
        say: 'If a country imports more than it exports, it pays out more foreign currency than it earns. Its reserves fall and it must borrow.'
        write: 'Imports > exports ⇒ reserves fall'
      - section: 'In Nigeria'
        say: 'When oil prices fall, Nigeria earns fewer dollars from crude, but still pays for imported rice, cars and machines.'
        write: 'Fewer oil dollars in, imports still paid out'
      - section: 'Remember'
        say: 'Remember, more going out than coming in means trouble.'
        write: 'Out > in = trouble'
      - section: 'Answer'
        say: 'So balance of payments problems arise if a country imports more than it exports, which is option B.'
        write: '$\therefore$ imports are more than exports'
        answer: true
    traps:
      A: 'You went for exports more than imports. That brings in more than goes out, which is a surplus, not a problem.'
      C: 'You chose a devalued currency. Devaluation is a remedy used to cure a deficit, not its cause.'
      D: 'You picked more invisible exports. Invisible exports earn money too, so more of them helps.'
  14:
    moments:
      - section: 'The question'
        say: 'A country keeps accounts too, just like a firm. What are the three parts of a country''s balance of payments?'
        write: 'Three components of the balance of payments = ?'
      - section: 'Name it'
        say: 'These are the components of the balance of payments.'
        write: 'Balance of payments accounts'
      - section: 'The rule'
        say: 'There are three accounts. The current account, the capital account and the monetary movement account.'
        write: 'Current · capital · monetary movement'
      - section: 'How it works'
        say: 'The current account records trade in goods and services. The capital account records investment and loans in and out.'
        write: 'Current = goods, services.  Capital = investment, loans'
      - say: 'The monetary movement account shows how the overall balance is settled, through changes in the reserves.'
        write: 'Monetary movement = settling through reserves'
      - section: 'In Nigeria'
        say: 'Crude oil exports go in the current account, and a foreign firm building a factory in Ogun goes in the capital account.'
        write: 'Crude exports (current), Ogun factory (capital)'
      - section: 'Remember'
        say: 'Remember, current, capital, monetary movement. None of them is a firm''s own book.'
        write: 'National accounts, not a firm''s books'
      - section: 'Answer'
        say: 'So the three components are the current account, the capital account and the monetary movement account, which is option A.'
        write: '$\therefore$ current, capital and monetary movement accounts'
        answer: true
    traps:
      B: 'You went for a list with a business record. That is a firm''s document, not part of a country''s accounts.'
      C: 'You chose sales and profit and loss accounts. Those are a firm''s accounts.'
      D: 'You picked a list with a sales ledger. A sales ledger is a firm''s book.'
  15:
    moments:
      - section: 'The question'
        say: 'A cheque can be signed on the back and handed to someone else, who can then collect the money. What is the general name for such documents?'
        write: 'Cheques and bills of exchange are called ?'
      - section: 'Name it'
        say: 'This is a negotiable instrument.'
        write: 'Negotiable instrument'
      - section: 'The rule'
        say: 'A negotiable instrument is a written document for payment of money that can be passed from one person to another by endorsement and delivery.'
        write: 'Passed on by endorsement and delivery'
      - section: 'How it works'
        say: 'The holder signs on the back, which is endorsing it, and hands it over. The new holder can then claim the money.'
        write: 'Sign on the back + hand over ⇒ new holder paid'
      - section: 'In Nigeria'
        say: 'A trader in Aba endorses a customer''s First Bank cheque and gives it to his supplier, who then cashes it.'
        write: 'Aba trader endorses cheque → supplier cashes it'
      - section: 'Remember'
        say: 'Remember, negotiable means it can be passed on and still be paid.'
        write: 'Passed on, still paid'
      - section: 'Answer'
        say: 'So the general name is a negotiable instrument, which is option D.'
        write: '$\therefore$ negotiable instrument'
        answer: true
    traps:
      A: 'You went for a delivery note. It lists goods sent and carries no promise to pay.'
      B: 'You chose a credit note. It only reduces what a buyer owes and cannot be passed on for payment.'
      C: 'You picked documentary evidence. That is a general word for proof, not a payment document.'
  16:
    moments:
      - section: 'The question'
        say: 'Cocoa is loaded on a ship at Apapa. The exporter gets a paper, and later swaps it for the bill of lading. What is that paper?'
        write: 'Exchanged for a bill of lading = ?'
      - section: 'Name it'
        say: 'This is the mate''s receipt.'
        write: 'Mate''s receipt'
      - section: 'The rule'
        say: 'A mate''s receipt is given by the ship''s mate, an officer, when goods are loaded on board, to show the ship has received them.'
        write: 'Issued by the ship''s mate on loading'
      - section: 'How it works'
        say: 'The exporter takes the mate''s receipt to the shipping company and exchanges it for the bill of lading, the document of title to the goods.'
        write: 'Mate''s receipt → bill of lading'
      - section: 'In Nigeria'
        say: 'A cocoa exporter at Apapa port gets the mate''s receipt on the quay and swaps it at the shipping office.'
        write: 'Apapa quay → shipping office'
      - section: 'Remember'
        say: 'Remember, the mate receives, then the company issues the bill.'
        write: 'Mate receives, company issues'
      - section: 'Answer'
        say: 'So the document exchanged for a bill of lading is the mate''s receipt, which is option B.'
        write: '$\therefore$ mate''s receipt'
        answer: true
    traps:
      A: 'You went for the freight note. That is the bill for the cost of shipping.'
      C: 'You chose the export invoice. That is the exporter''s bill to the foreign buyer.'
      D: 'You picked the ship report. That is the captain''s report to customs when the ship arrives.'
  17:
    moments:
      - section: 'The question'
        say: 'An importer wants one price that covers everything until the goods reach his own warehouse. What is that price called?'
        write: 'Price including all costs to the importer''s warehouse = ?'
      - section: 'Name it'
        say: 'This is a franco price.'
        write: 'Franco'
      - section: 'The rule'
        say: 'A franco price includes every cost of delivery up to the buyer''s premises, which is freight, insurance, duties and handling.'
        write: 'Franco = all costs to the buyer''s door'
      - section: 'How it works'
        say: 'The seller pays all these costs and adds them to the price, so the buyer pays one sum.'
        write: 'Seller pays all, buyer pays one sum'
      - section: 'Compare'
        say: 'Free on rail, free alongside ship and free on board all stop much earlier, at the train or the ship.'
        write: 'F O R, F A S, F O B stop at the train or ship'
      - section: 'In Nigeria'
        say: 'A Kano importer quoted a franco price for machines pays nothing more when the machines reach his warehouse.'
        write: 'Kano importer pays nothing more'
      - section: 'Remember'
        say: 'Remember, franco means free to your door.'
        write: 'Franco = free to your door'
      - section: 'Answer'
        say: 'So the price that includes everything to the importer''s warehouse is franco, which is option B.'
        write: '$\therefore$ Franco'
        answer: true
    traps:
      A: 'You went for free alongside ship. That covers costs only until the goods are beside the ship.'
      C: 'You chose free on board. That covers costs only until the goods are loaded on the ship.'
      D: 'You picked free on rail. That covers costs only until the goods are on the train.'
  18:
    moments:
      - section: 'The question'
        say: 'A seller says he sells only on C W O terms. What must the buyer do?'
        write: 'C W O means ?'
      - section: 'Name it'
        say: 'This is cash with order.'
        write: 'C W O = cash with order'
      - section: 'The rule'
        say: 'Under cash with order, the buyer sends the payment together with the order, before the goods are delivered.'
        write: 'Payment goes with the order'
      - section: 'How it works'
        say: 'Sellers use it for new customers whose credit they do not know, and for mail orders. The seller runs no risk of bad debt.'
        write: 'New customers, mail orders, no bad debt'
      - section: 'In Nigeria'
        say: 'When you pay by bank transfer at the same moment you place an online order for a phone, you are buying cash with order.'
        write: 'Pay online with the order'
      - section: 'Remember'
        say: 'Remember, the cash goes with the order.'
        write: 'Cash goes with the order'
      - section: 'Answer'
        say: 'So under C W O, money must be enclosed when ordering, which is option A.'
