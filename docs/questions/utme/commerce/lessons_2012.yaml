# UTME 2012 Commerce, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Nigerian Commerce teacher works on the
# board: the question, the term named, the definition or rule, how it works in a real
# transaction (or the calculation with data, formula, working and check), a Nigerian example,
# a way to remember it, and the answer moment that names the option.
#
#   say:     heard, not read. Abbreviations as letters ("N A F D A C"), money in words,
#            percentages as "per cent", no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2012.yaml. Answers match that file. Q1, the
# paper-type question, is left out, so 49 questions have a lesson.
format_version: 1
exam_year: 2012
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'Commerce helps buyers and sellers. But what does government get out of it? Let us see.'
        write: 'Benefit of commerce to government = ?'
      - section: 'Name it'
        say: 'This is a function of commerce, seen from the government side.'
        write: 'Functions of commerce (to government)'
      - section: 'The rule'
        say: 'Commerce is all the trade and aids to trade that bring goods from producers to consumers.'
        write: 'Commerce = trade + aids to trade'
      - section: 'How it works'
        say: 'Every sale and every import gives government a share as revenue, through company tax, V A T, customs duty and licence fees.'
        write: 'Trade ⇒ taxes, duties, fees ⇒ revenue'
      - say: 'Government spends that revenue on roads, schools and hospitals, and that is growth and development.'
        write: 'Revenue ⇒ roads, schools, hospitals'
      - section: 'In Nigeria'
        say: 'When an importer clears goods at Apapa, the customs duty he pays goes to government.'
        write: 'Apapa import ⇒ customs duty to government'
      - section: 'Remember'
        say: 'Remember, trade pays tax, and tax builds the country.'
        write: 'Trade pays tax, tax builds the country'
      - section: 'Answer'
        say: 'So the major benefit of commerce to government is to generate revenue for growth and development, which is option B.'
        write: '$\therefore$ generate revenue for growth and development'
        answer: true
    traps:
      A: 'You chose improving the standard of living. That is a benefit to the people who buy the goods, not to government itself.'
      C: 'You went for cooperation among public organisations. Commerce links private buyers and sellers, not public bodies.'
      D: 'You picked sociocultural values. Those come from society and culture, not from what commerce pays government.'
  3:
    moments:
      - section: 'The question'
        say: 'Four trades, and only one of them builds something that stays where it is made. Which one?'
        write: 'Activity in the construction industry = ?'
      - section: 'Name it'
        say: 'This is the construction industry, one branch of industrial occupation.'
        write: 'Industrial occupation'
      - section: 'The rule'
        say: 'Industrial occupation has three branches. Extractive takes things from nature, manufacturing turns raw materials into goods, and construction puts up buildings, roads and bridges.'
        write: 'Extractive, manufacturing, construction'
      - section: 'How it works'
        say: 'A bricklayer lays blocks to build walls, so his work puts up a structure. That is construction.'
        write: 'Bricklaying ⇒ walls, buildings ⇒ construction'
      - say: 'A blacksmith, a car assembler and a shoemaker all turn materials into goods, so they are in manufacturing.'
        write: 'Blacksmith, car assembly, shoemaking ⇒ manufacturing'
      - section: 'In Nigeria'
        say: 'The bricklayers building new houses in Lekki or Abuja are in the construction industry.'
        write: 'Houses in Lekki ⇒ construction'
      - section: 'Remember'
        say: 'Remember, if it stays where it is built, it is construction.'
        write: 'Stays where it is built ⇒ construction'
      - section: 'Answer'
        say: 'So bricklaying is the construction activity, which is option B.'
        write: '$\therefore$ bricklaying'
        answer: true
    traps:
      A: 'You chose blacksmithing. A blacksmith turns metal into tools, which is manufacturing.'
      C: 'You went for car assembling. Putting parts together into a car is manufacturing, not construction.'
      D: 'You picked shoemaking. Turning leather into shoes is manufacturing.'
  4:
    moments:
      - section: 'The question'
        say: 'Good pay makes people work harder. But which factor of production is paid wages?'
        write: 'Input motivated by remuneration = ?'
      - section: 'Name it'
        say: 'These are the factors of production and their rewards.'
        write: 'Factors of production and rewards'
      - section: 'The rule'
        say: 'Land earns rent, labour earns wages, capital earns interest, and the entrepreneur earns profit.'
        write: 'Land, rent. Labour, wages. Capital, interest. Entrepreneur, profit.'
      - section: 'How it works'
        say: 'Remuneration means pay for work done, that is wages and salaries.'
        write: 'Remuneration = wages and salaries'
      - say: 'A worker gives more effort when the pay is good, so labour is the factor that pay motivates.'
        write: 'Good pay ⇒ more effort ⇒ labour'
      - section: 'In Nigeria'
        say: 'A factory worker in Ikeja stays for overtime when the overtime pay is good.'
        write: 'Overtime pay in Ikeja ⇒ more work'
      - section: 'Remember'
        say: 'Remember, labour works for wages.'
        write: 'Labour works for wages'
      - section: 'Answer'
        say: 'So the input motivated by remuneration is labour, which is option C.'
        write: '$\therefore$ labour'
        answer: true
    traps:
      A: 'You chose capital. Capital is a man made thing that earns interest. It cannot be motivated.'
      B: 'You went for the entrepreneur. His reward is profit, which is what is left over, not a remuneration.'
      D: 'You picked land. Land is a gift of nature that earns rent. It cannot be motivated.'
  5:
    moments:
      - section: 'The question'
        say: 'In a busy bakery, one worker mixes, one bakes and one packs. What do we call that?'
        write: 'Allocation of tasks to different skills = ?'
      - section: 'Name it'
        say: 'This is division of labour.'
        write: 'Division of labour'
      - section: 'The rule'
        say: 'Division of labour is breaking a production process into separate tasks and giving each task to the worker with the skill for it.'
        write: 'Process ⇒ separate tasks ⇒ each to a skilled worker'
      - section: 'How it works'
        say: 'Each worker repeats one task, so he becomes quick and skilled at it, and output rises.'
        write: 'Repetition ⇒ skill and speed ⇒ more output'
      - section: 'In Nigeria'
        say: 'In a Lagos bakery, one worker mixes the dough, another shapes the loaves, another runs the oven and another packs the bread.'
        write: 'Mix, shape, bake, pack'
      - section: 'Remember'
        say: 'Remember, divide the work, multiply the output.'
        write: 'Divide the work, multiply the output'
      - section: 'Answer'
        say: 'So the allocation of tasks to different skills is division of labour, which is option C.'
        write: '$\therefore$ division of labour'
        answer: true
    traps:
      A: 'You chose production technique. That is the method used, such as using many workers or many machines.'
      B: 'You went for production function. That is the link between inputs and output.'
      D: 'You picked delegation. That is a manager handing authority to a junior, not splitting a process into tasks.'
  6:
    moments:
      - section: 'The question'
        say: 'You put money in, press a button, and a cold drink drops out. What is selling to you?'
        write: 'Medium that accepts money and delivers items = ?'
      - section: 'Name it'
        say: 'This is the vending machine, a modern form of retailing.'
        write: 'Vending machine (retailing)'
      - section: 'The rule'
        say: 'A vending machine is an automatic machine that takes the buyer''s money and gives out the goods, with no shop attendant.'
        write: 'Money in ⇒ goods out, no attendant'
      - section: 'How it works'
        say: 'The buyer puts in coins, notes or a card, chooses the item, and the machine releases it.'
        write: 'Pay, choose, collect'
      - section: 'In Nigeria'
        say: 'Vending machines for drinks and snacks stand in some Lagos offices, airports and hospitals.'
        write: 'Drinks machine at the airport'
      - section: 'Remember'
        say: 'Remember, vend means sell, so a vending machine is a selling machine.'
        write: 'Vend = sell'
      - section: 'Answer'
        say: 'So the medium that accepts money and delivers the goods is a vending machine, which is option B.'
        write: '$\therefore$ a vending machine'
        answer: true
    traps:
      A: 'You chose the A T M. It pays out cash from a bank account. It does not sell goods.'
      C: 'You went for a counting machine. It counts notes or items. It does not sell anything.'
      D: 'You picked a branding machine. It marks names on products. It does not sell them.'
  7:
    moments:
      - section: 'The question'
        say: 'A shop shelf is full of noodles. How do you find the one you want? That is what a brand is for.'
        write: 'Main purpose of branding = ?'
      - section: 'Name it'
        say: 'This is branding, part of the product in the marketing mix.'
        write: 'Branding (product)'
      - section: 'The rule'
        say: 'Branding is giving a product a name, symbol or design that marks it out from rival products.'
        write: 'Brand = name, symbol, design'
      - section: 'How it works'
        say: 'The brand gives the product its own identity, so buyers can recognise it and ask for it by name again and again.'
        write: 'Brand ⇒ identity ⇒ recognised and asked for'
      - section: 'In Nigeria'
        say: 'People ask for Indomie, Peak milk or Golden Penny by name. The brand tells them apart from other noodles, milk and semovita.'
        write: 'Indomie, Peak, Golden Penny'
      - section: 'Remember'
        say: 'Remember, a brand is a product''s name tag.'
        write: 'Brand = name tag'
      - section: 'Answer'
        say: 'So the main purpose of branding is to create identity for a product, which is option A.'
        write: '$\therefore$ create identity for a product'
        answer: true
    traps:
      B: 'You chose making a product look attractive. That is the work of packaging and design.'
      C: 'You went for product awareness. That is the work of advertising.'
      D: 'You picked increasing sales. More sales may follow, but that is a result, not the main purpose.'
  8:
    moments:
      - section: 'The question'
        say: 'Why does Nigeria sell oil and buy machines, instead of making everything itself?'
        write: 'Basis for international trade = ?'
      - section: 'Name it'
        say: 'This is the principle of comparative advantage.'
        write: 'Comparative advantage'
      - section: 'The rule'
        say: 'A country should specialise in the goods it can produce at a lower opportunity cost than others, and trade for the rest.'
        write: 'Specialise in lowest opportunity cost, trade for the rest'
      - section: 'How it works'
        say: 'Even if one country is better at making everything, both gain when each makes what it is relatively best at and they exchange.'
        write: 'Both countries gain from exchange'
      - section: 'In Nigeria'
        say: 'Nigeria exports crude oil and cocoa, which it produces cheaply, and imports machines that others make more cheaply.'
        write: 'Export oil and cocoa, import machines'
      - section: 'Remember'
        say: 'Remember, do what you do best, compared with the rest.'
        write: 'Do what you do best, compared with the rest'
      - section: 'Answer'
        say: 'So the basis of international trade is comparative advantage, which is option D.'
        write: '$\therefore$ comparative advantage'
        answer: true
    traps:
      A: 'You chose absolute advantage. It explains only the case where each country is outright better at one good.'
      B: 'You went for globalization. That is the growing link between economies, not the principle trade rests on.'
      C: 'You picked deregulation. That is removing government controls, a policy, not the basis of trade.'
  9:
    moments:
      - section: 'The question'
        say: 'A Nigerian buys machines from China. Before he can pay, what must he do first?'
        write: 'Major problem in international trade = ?'
      - section: 'Name it'
        say: 'These are the problems of foreign trade.'
        write: 'Problems of foreign trade'
      - section: 'The rule'
        say: 'Foreign trade is trade between countries. Its problems include different currencies, distance, language and culture, and trade restrictions.'
        write: 'Currency, distance, language, restrictions'
      - section: 'How it works'
        say: 'Every foreign deal meets currency. The buyer must change his naira into the seller''s currency, and the rate can change before he pays.'
        write: 'Naira ⇒ dollars or yuan, at a changing rate'
      - section: 'In Nigeria'
        say: 'An importer in Lagos must buy dollars at his bank before he can pay his supplier abroad.'
        write: 'Buy dollars before paying abroad'
      - section: 'Remember'
        say: 'Remember, home trade uses one money, foreign trade must change money.'
        write: 'Home trade, one money. Foreign trade, change money.'
      - section: 'Answer'
        say: 'So the major problem in international trade is differences in currency, which is option D.'
        write: '$\therefore$ differences in currency'
        answer: true
    traps:
      A: 'You chose distance. Distance exists in home trade too, and transport handles it.'
      B: 'You went for culture. Culture differs even within Nigeria, and it is a smaller problem than currency.'
      C: 'You picked politics. It affects some deals, but not every one, as currency does.'
  10:
    moments:
      - section: 'The question'
        say: 'A lorry arrives with your goods. The driver hands you a paper to sign. What is it?'
        write: 'Document sent with goods, signed on receipt = ?'
      - section: 'Name it'
        say: 'This is the delivery note, a document in the sale of goods.'
        write: 'Delivery note'
      - section: 'The rule'
        say: 'A delivery note is a list of the goods sent, and it travels with the goods to the buyer.'
        write: 'Delivery note travels with the goods'
      - section: 'How it works'
        say: 'The buyer checks the goods against it and signs a copy. The signed copy goes back to the seller as proof of delivery.'
        write: 'Check, sign, return ⇒ proof of delivery'
      - section: 'In Nigeria'
        say: 'A Kano wholesaler sends cartons of noodles to a retailer in Jos by lorry, and the retailer signs the delivery note when they arrive.'
        write: 'Kano to Jos by lorry, signed on arrival'
      - section: 'Remember'
        say: 'Remember, the delivery note rides with the goods.'
        write: 'Delivery note rides with the goods'
      - section: 'Answer'
        say: 'So the document sent with the goods and signed on receipt is a delivery note, which is option D.'
        write: '$\therefore$ a delivery note'
        answer: true
    traps:
      A: 'You chose the bill of lading. It is used for goods carried by sea.'
      B: 'You went for the invoice. That is the bill asking for payment. It does not prove delivery.'
      C: 'You picked the advice note. It is sent ahead to say the goods are coming. It does not travel with them.'
  11:
    moments:
      - section: 'The question'
        say: 'An importer wants two hundred generators from abroad. What document carries his order?'
        write: 'Order with details of goods required = ?'
      - section: 'Name it'
        say: 'This is the indent, a document in import trade.'
        write: 'Indent (import trade)'
      - section: 'The rule'
        say: 'An indent is an order from an importer, usually sent through an agent, giving the details of the goods he wants.'
        write: 'Indent = importer''s order'
      - section: 'How it works'
        say: 'It states the goods, quantity, quality and price. An open indent lets the agent choose the maker, and a closed indent names the maker.'
        write: 'Open indent, agent chooses. Closed indent, maker named.'
      - section: 'In Nigeria'
        say: 'A Lagos dealer sends an indent to an agent to buy two hundred generators of a stated model from China.'
        write: '200 generators, stated model'
      - section: 'Remember'
        say: 'Remember, an indent is an importer''s order.'
        write: 'Indent = order'
      - section: 'Answer'
        say: 'So the document that serves as an order is an indent, which is option B.'
        write: '$\therefore$ an indent'
        answer: true
    traps:
      A: 'You chose the freight note. That is the shipping company''s bill for carrying the goods.'
      C: 'You went for the bill of lading. It is a shipping document for goods already sent.'
      D: 'You picked the waybill. It lists goods being carried by road, rail or air. It is not an order.'
  12:
    moments:
      - section: 'The question'
        say: 'Three per cent off if you pay within nine days. How do we write that on an invoice? Many students mix up the order.'
        write: '3% off within 9 days, else net in 30 days = ?'
      - section: 'Name it'
        say: 'This is a cash discount term, one of the terms of trade.'
        write: 'Cash discount term'
      - section: 'The rule'
        say: 'We write the discount per cent first, then the number of days, then net and the full credit period.'
        write: 'per cent / days, net credit period'
      - section: 'Put it together'
        say: 'The discount is three per cent and the days are nine, so the first part is three slash nine.'
        write: '3 / 9'
      - say: 'If the buyer pays later, he pays the full net price within thirty days, so we add net thirty.'
        write: '3/9, net 30'
      - section: 'In Nigeria'
        say: 'On an invoice for one hundred thousand naira, the buyer pays ninety seven thousand naira within nine days, or the full amount by day thirty.'
        write: '₦100,000 ⇒ ₦97,000 within 9 days'
      - section: 'Remember'
        say: 'Remember, per cent first, then days, then net.'
        write: 'Per cent, days, net'
      - section: 'Answer'
        say: 'So the term is three slash nine, net thirty, which is option A.'
        write: '$\therefore$ 3/9, net 30'
        answer: true
    traps:
      B: 'You chose nine slash twenty seven. Neither the three per cent nor the nine days is in its right place.'
      C: 'You went for thirty first. The credit period comes last, after the discount.'
      D: 'You picked nine slash thirty, net three. That puts the days before the per cent and turns the term inside out.'
  13:
    moments:
      - section: 'The question'
        say: 'You find a cheque on the floor. If it is a bearer cheque, can you cash it? Let us see why that matters.'
        write: 'Characteristic of a bearer cheque = ?'
      - section: 'Name it'
        say: 'This is the bearer cheque, one kind of cheque.'
        write: 'Bearer cheque'
      - section: 'The rule'
        say: 'A bearer cheque is payable to bearer, so the bank pays whoever presents it at the counter.'
        write: 'Pay bearer ⇒ whoever presents it'
      - section: 'How it works'
        say: 'Anyone holding the cheque can cash it. That is handy, but risky if the cheque is lost.'
        write: 'Convenient, but risky if lost'
      - section: 'In Nigeria'
        say: 'A trader in Aba gives his shop boy a bearer cheque to collect cash from the bank for him.'
        write: 'Shop boy cashes it at the counter'
      - section: 'Remember'
        say: 'Remember, the bearer is the one who carries the cheque.'
        write: 'Bearer = the one who carries it'
      - section: 'Answer'
        say: 'So a bearer cheque is payable to whoever presents it, which is option B.'
        write: '$\therefore$ payable to whoever presents it'
        answer: true
    traps:
      A: 'You chose transverse lines. Those lines make a cheque crossed, so it must go into a bank account.'
      C: 'You went for a later date. A cheque dated for a later day is a post dated cheque.'
      D: 'You picked payable only into the payee''s account. That is an account payee crossed cheque, the opposite of a bearer cheque.'
  14:
    moments:
      - section: 'The question'
        say: 'You hold a bill worth five hundred thousand naira, but it is not due for three months. Can you get cash now?'
        write: 'Bill paid early at less than face value = ?'
      - section: 'Name it'
        say: 'This is discounting a bill of exchange.'
        write: 'Discounting a bill of exchange'
      - section: 'The rule'
        say: 'Discounting means selling the bill to a bank before its due date, for less than its face value.'
        write: 'Sell before due date, for less than face value'
      - section: 'How it works'
        say: 'The holder gets cash now. The bank keeps the difference, the discount, as its reward for waiting.'
        write: 'Holder gets cash, bank keeps the discount'
      - section: 'In Nigeria'
        say: 'An exporter discounts a five hundred thousand naira bill at First Bank and receives, say, four hundred and eighty thousand naira today.'
        write: '₦500,000 bill ⇒ ₦480,000 now'
      - section: 'Remember'
        say: 'Remember, cash early costs a discount.'
        write: 'Cash early costs a discount'
      - section: 'Answer'
        say: 'So the bill is said to have been discounted, which is option C.'
        write: '$\therefore$ discounted'
        answer: true
    traps:
      A: 'You chose accepted. A bill is accepted when the drawee signs it to agree to pay.'
      B: 'You went for rejected. A rejected bill is refused, not cashed early.'
      D: 'You picked dishonoured. A bill is dishonoured when it is not paid on its due date.'
  15:
    moments:
      - section: 'The question'
        say: 'Peak or Three Crowns? Every brand wants you to pick it. Which advertising does that job?'
        write: 'Most effective advertising for branded products = ?'
      - section: 'Name it'
        say: 'This is competitive advertising, one type of advertising.'
        write: 'Competitive advertising'
      - section: 'The rule'
        say: 'Competitive advertising tries to persuade buyers that one brand is better than rival brands of the same product.'
        write: 'Our brand is better than rival brands'
      - section: 'How it works'
        say: 'Branded goods such as soap, drinks and noodles have many close rivals, so the maker must keep showing why his brand is the one to buy.'
        write: 'Many rivals ⇒ brand against brand'
      - section: 'In Nigeria'
        say: 'Adverts for one milk brand against another, or one phone network against another, are competitive advertising.'
        write: 'Milk against milk, network against network'
      - section: 'Remember'
        say: 'Remember, brand against brand is competitive advertising.'
        write: 'Brand against brand'
      - section: 'Answer'
        say: 'So the most effective advertising for branded products is competitive advertising, which is option D.'
        write: '$\therefore$ competitive advertising'
        answer: true
    traps:
      A: 'You chose mass advertising. That only means reaching a large audience. It is not aimed at brands.'
      B: 'You went for institutional advertising. That builds the image of a whole firm, not one brand.'
      C: 'You picked informative advertising. That introduces new products. Branded goods already known need persuasion against rivals.'
  16:
    moments:
      - section: 'The question'
        say: 'A current account pays you no interest. So how does the bank earn from running it?'
        write: 'Fee paid by a current account holder = ?'
      - section: 'Name it'
        say: 'This is commission on turnover, C O T for short.'
        write: 'Commission on turnover (COT)'
      - section: 'The rule'
        say: 'Commission on turnover is a fee the bank charges on the money that passes out of a current account.'
        write: 'COT = fee on money withdrawn'
      - section: 'How it works'
        say: 'The bank gives cheque books and pays cheques. It covers that cost with a small commission on the amount withdrawn.'
        write: 'Cheque services ⇒ commission on withdrawals'
      - section: 'In Nigeria'
        say: 'A trader with a G T Bank current account in twenty twelve saw C O T deducted on his withdrawals.'
        write: 'COT deducted on withdrawals'
      - section: 'Today'
        say: 'The Central Bank of Nigeria later phased C O T out, and banks now charge an account maintenance fee instead.'
        write: 'Today: account maintenance fee'
      - section: 'Remember'
        say: 'Remember, current account, commission on turnover.'
        write: 'Current account ⇒ COT'
      - section: 'Answer'
        say: 'So the current account holder pays commission on turnover, which is option C.'
        write: '$\therefore$ commission on turnover'
        answer: true
    traps:
      A: 'You chose dividends. Dividends are paid to shareholders out of profit, not by a customer to the bank.'
      B: 'You went for interest. A current account holder neither pays nor earns interest on his deposits.'
      D: 'You picked the minimum lending rate. That is the central bank''s base rate for loans, not a fee on an account.'
  17:
    moments:
      - section: 'The question'
        say: 'Before phones were everywhere, how did urgent news reach a village? Through the post office, as a printed form.'
        write: 'Message by wire, handed over as a printed form = ?'
      - section: 'Name it'
        say: 'This is the telegram, an older postal means of communication.'
        write: 'Telegram'
      - section: 'The rule'
        say: 'A telegram is a short message sent by wire from one post office to another, printed on a form and delivered by hand.'
        write: 'Post office ⇒ wire ⇒ post office ⇒ by hand'
      - section: 'How it works'
        say: 'The sender writes the message at the post office and pays by the word. The receiving office prints it and a messenger delivers it.'
        write: 'Pay by the word, delivered by messenger'
      - section: 'In Nigeria'
        say: 'Nigerians once sent telegrams for urgent news, such as a death in the family.'
        write: 'Urgent family news by telegram'
      - section: 'Today'
        say: 'Telegrams are no longer in everyday use. S M S and email do that job now.'
        write: 'Today: SMS and email'
      - section: 'Remember'
        say: 'Remember, telegram, post office to post office, then by hand.'
        write: 'Post office to post office, then by hand'
      - section: 'Answer'
        say: 'So the message is a telegram, which is option A.'
        write: '$\therefore$ telegram'
        answer: true
    traps:
      B: 'You chose S M S. That is a text sent from one mobile phone to another.'
      C: 'You went for telex. A telex prints straight out on the receiver''s own machine. The post office does not hand it over.'
      D: 'You picked M M S. That is a phone message with pictures or sound.'
  18:
    moments:
      - section: 'The question'
        say: 'A trader in Ibadan needs goods from Lagos. Must he make the journey? Let us see why communication matters.'
        write: 'Why communication matters to business = ?'
      - section: 'Name it'
        say: 'This is the importance of communication to business.'
        write: 'Importance of communication'
      - section: 'The rule'
        say: 'Communication is passing messages and information from one person to another.'
        write: 'Communication = passing messages'
      - section: 'How it works'
        say: 'With a call, an email or a letter, a trader can order goods and settle deals without travelling.'
        write: 'Call or email instead of travel'
      - say: 'So he saves the cost of the journey and avoids the risks of the road.'
        write: 'Saves cost, avoids risk'
      - section: 'In Nigeria'
        say: 'The Ibadan shop owner phones his supplier in Lagos, and the goods are sent to him.'
        write: 'Ibadan phones Lagos, goods sent'
      - section: 'Remember'
        say: 'Remember, call, do not travel.'
        write: 'Call, do not travel'
      - section: 'Answer'
        say: 'So communication reduces the cost and risk of travelling, which is option B.'
        write: '$\therefore$ reduces the cost and risk of travelling'
        answer: true
    traps:
      A: 'You chose creating wealth. Communication helps business, but it does not create wealth by itself.'
      C: 'You went for removing the need to transport goods. The goods still have to be carried.'
      D: 'You picked delivery of goods. Moving the goods is the work of transport, not communication.'
  19:
    moments:
