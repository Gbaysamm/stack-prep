      - section: 'Name it'
        say: 'This is the rate of turnover, the number of times a firm sells its average stock in a year.'
        write: 'Rate of turnover (rate of stock turn)'
      - section: 'The rule'
        say: 'Rate of turnover equals cost of goods sold divided by average stock.'
        write: '$\text{Rate of turnover} = \dfrac{\text{Cost of goods sold}}{\text{Average stock}}$'
      - section: 'Rearrange'
        say: 'We want the turnover, the cost of goods sold, so we multiply both sides by the average stock.'
        write: '$\text{Turnover} = \text{Rate of turnover} \times \text{Average stock}$'
      - section: 'The working'
        say: 'We put in five times and twelve thousand, five hundred naira.'
        write: '$= 5 \times 12{,}500$'
      - say: 'Five times twelve thousand, five hundred is sixty-two thousand, five hundred naira.'
        write: '$= 62{,}500$, so ₦62,500'
      - section: 'Check'
        say: 'Sixty-two thousand, five hundred divided by twelve thousand, five hundred gives five times. That fits.'
        write: '$62{,}500 \div 12{,}500 = 5$ ✓'
      - section: 'In Nigeria'
        say: 'A shop in Balogun market that keeps about twelve thousand, five hundred naira of stock and sells it out five times a year turns over sixty-two thousand, five hundred naira.'
        write: 'Shelf of ₦12,500 sold out 5 times'
      - section: 'Remember'
        say: 'Remember, rate times average stock gives turnover.'
        write: 'Rate × average stock = turnover'
      - section: 'Answer'
        say: 'So the turnover of the firm is sixty-two thousand, five hundred naira, which is option C.'
        write: '$\therefore$ turnover $=$ ₦62,500'
        answer: true
    traps:
      A: 'You went for twenty-four thousand naira. That does not come from five times twelve thousand, five hundred naira.'
      B: 'You chose forty-six thousand, five hundred naira. That does not come from five times the average stock.'
      D: 'You picked sixty-five thousand naira. That is a slip in multiplying. Five times twelve thousand, five hundred is sixty-two thousand, five hundred.'
