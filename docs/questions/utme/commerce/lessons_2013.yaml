# UTME 2013 Commerce, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Nigerian Commerce teacher works on the
# board: the question, the term or institution named, the rule or definition, how it works in a
# real transaction (or the calculation with data, formula, working and check), a Nigerian
# example, a way to remember it, and the answer moment that names the option.
#
#   say:     heard, not read. Abbreviations read as letters ("N C C"), money in words,
#            percentages as "per cent", no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2013.yaml. Answers match that file. Q1, the
# paper-type question, is left out, so 49 questions have a lesson.
format_version: 1
exam_year: 2013
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'Some workers are paid for their brains, and some for their muscles. Which type of labour runs on physical effort?'
        write: 'Labour that uses physical effort = ?'
      - section: 'Name it'
        say: 'Labour is graded by how much training it needs. There is skilled, semi skilled and unskilled labour.'
        write: 'Skilled, semi-skilled, unskilled labour'
      - section: 'The rule'
        say: 'Unskilled labour needs little or no training, so it depends mainly on physical strength.'
        write: 'Unskilled labour = little training, mainly physical effort'
      - section: 'How it works'
        say: 'The less training a job needs, the more it leans on the body instead of know how.'
        write: 'Less training ⇒ more physical effort'
      - section: 'In Nigeria'
        say: 'The labourers who carry cement on a building site in Abuja, and the porters in Balogun market, give unskilled labour.'
        write: 'Site labourers, market porters ⇒ unskilled'
      - section: 'Remember'
        say: 'Remember, unskilled labour uses the hands and back more than the head.'
        write: 'Hands and back, not head ⇒ unskilled'
      - section: 'Answer'
        say: 'So the labour that uses physical effort is unskilled labour, which is option A.'
        write: '$\therefore$ unskilled labour'
        answer: true
    traps:
      B: 'You went for skilled labour. A skilled worker like an electrician uses his hands too, but what marks his labour is training, not muscle.'
      C: 'You chose professional labour. Doctors and lawyers rely on long study and mental effort, not physical effort.'
      D: 'You picked a white collar job. That is office work, which uses the mind more than the body.'
  3:
    moments:
      - section: 'The question'
        say: 'A builder does not make cement or iron rods, yet he gives us a house. What do we call putting finished products together like that?'
        write: 'Assembling products into usable forms = ?'
      - section: 'Name it'
        say: 'This is construction, a branch of secondary production.'
        write: 'Secondary production ⇒ manufacturing and construction'
      - section: 'The rule'
        say: 'Construction is assembling manufactured products into usable forms, such as houses, roads and bridges.'
        write: 'Construction = assembling products into houses, roads, bridges'
      - section: 'How it works'
        say: 'Manufacturing turns raw materials into goods. Construction then takes those goods and puts them together on site.'
        write: 'Raw materials → manufacturing → goods → construction → structure'
      - section: 'In Nigeria'
        say: 'When Julius Berger builds a bridge, it does not make the steel or the cement. It assembles them into the bridge.'
        write: 'Cement + steel assembled ⇒ bridge'
      - section: 'Remember'
        say: 'Remember, manufacturing makes the parts, and construction puts the parts together.'
        write: 'Makes the parts vs puts them together'
      - section: 'Answer'
        say: 'So assembling products into usable forms is construction, which is option C.'
        write: '$\therefore$ construction'
        answer: true
    traps:
      A: 'You went for creation. That is not a branch of production, since every kind of production creates something useful.'
      B: 'You chose manufacturing. Manufacturing changes raw materials into goods, but it does not assemble them into structures on site.'
      D: 'You picked formation. That is not a recognised type of production.'
  4:
    moments:
      - section: 'The question'
        say: 'Goods travel from the factory through many hands. Where does the journey finally stop?'
        write: 'Final link in the chain of distribution = ?'
      - section: 'Name it'
        say: 'This is the chain of distribution, the route goods take from the producer to the user.'
        write: 'Chain of distribution'
      - section: 'The chain'
        say: 'The chain runs from producer to wholesaler, then to retailer, and finally to the consumer.'
        write: 'Producer → wholesaler → retailer → consumer'
      - section: 'The rule'
        say: 'Every link sells the goods on, except the consumer, who buys to use them. So the consumer is the final link.'
        write: 'Consumer buys to use, not to resell ⇒ final link'
      - section: 'In Nigeria'
        say: 'A carton of noodles goes from the factory to a wholesaler in Onitsha, then to a kiosk in Enugu, and is finally cooked by a student.'
        write: 'Factory → Onitsha wholesaler → Enugu kiosk → student'
      - section: 'Remember'
        say: 'Remember, the chain ends where the goods are eaten, worn or used.'
        write: 'Chain ends where goods are used'
      - section: 'Answer'
        say: 'So the final link in the chain of distribution is the consumer, which is option C.'
        write: '$\therefore$ the consumer'
        answer: true
    traps:
      A: 'You went for middlemen. Wholesalers and retailers are middlemen, and they stand in the middle of the chain, not at its end.'
      B: 'You chose the wholesaler. The wholesaler is the second link, buying straight from the producer.'
      D: 'You picked the producer. The producer is where the chain begins, not where it ends.'
  5:
    moments:
      - section: 'The question'
        say: 'When is a country losing out in its trade in goods? Let us see which side has to be bigger.'
        write: 'Unfavourable balance of trade when ?'
      - section: 'Name it'
        say: 'This is the balance of trade, which deals with visible items, the goods we can see.'
        write: 'Balance of trade = visible exports − visible imports'
      - section: 'The rule'
        say: 'The balance of trade is unfavourable when visible imports are greater than visible exports.'
        write: 'Visible imports > visible exports ⇒ unfavourable'
      - section: 'How it works'
        say: 'The country spends more buying goods from abroad than it earns selling goods abroad, so it has a deficit.'
        write: 'Spend more on imports than earned on exports ⇒ deficit'
      - section: 'In Nigeria'
        say: 'If Nigeria imports cars and rice worth more than all its crude oil and cocoa exports in a year, the balance of trade is unfavourable.'
        write: 'Imports of cars, rice > exports of oil, cocoa'
      - section: 'Remember'
        say: 'Remember, more goods coming in than going out is unfavourable.'
        write: 'More in than out ⇒ unfavourable'
      - section: 'Answer'
        say: 'So the balance of trade is unfavourable when visible imports exceed visible exports, which is option D.'
        write: '$\therefore$ visible imports exceed visible exports'
        answer: true
    traps:
      A: 'You went for exports exceeding imports. That is a favourable position, the opposite of what we want.'
      B: 'You chose visible exports exceeding visible imports. That is a favourable balance of trade, a surplus.'
      C: 'You picked equal imports and exports. Then the balance of trade is in balance, neither favourable nor unfavourable.'
  6:
    moments:
      - section: 'The question'
        say: 'How do we know where Nigeria stands in its trade in goods with the world? One figure tells us.'
        write: 'Trading position in visible goods shown by ?'
      - section: 'Name it'
        say: 'This is the balance of trade.'
        write: 'Balance of trade'
      - section: 'The rule'
        say: 'The balance of trade sets the value of visible exports against the value of visible imports over a period.'
        write: 'Visible exports − visible imports, over a year'
      - section: 'How it works'
        say: 'If exports are bigger, the position is a surplus. If imports are bigger, it is a deficit.'
        write: 'Exports bigger ⇒ surplus. Imports bigger ⇒ deficit.'
      - section: 'In Nigeria'
        say: 'When the National Bureau of Statistics reports that Nigeria sold more goods abroad than it bought in a quarter, it is reporting a trade surplus.'
        write: 'N B S report: trade surplus ⇒ trading position'
      - section: 'Remember'
        say: 'Remember, position means balance, exports set against imports.'
        write: 'Position = balance'
      - section: 'Answer'
        say: 'So Nigeria''s trading position in visible goods is shown by her balance of trade, which is option C.'
        write: '$\therefore$ balance of trade'
        answer: true
    traps:
      A: 'You went for the desire to trade with many countries. A desire is an attitude, not a measure of where the country stands.'
      B: 'You chose willingness to grant credit. That is a trade practice, not a measure of the trading position.'
      D: 'You picked terms of trade. They compare export prices with import prices, not the total value of trade.'
  7:
    moments:
      - section: 'The question'
        say: 'Who checks what enters and leaves Nigeria at the ports and borders? Let us name their real job.'
        write: 'Role of customs and excise = ?'
      - section: 'Name it'
        say: 'This is the customs and excise authority. In Nigeria it is the Nigeria Customs Service.'
        write: 'Nigeria Customs Service'
      - section: 'The rule'
        say: 'Its main role is to control the flow of goods into and out of the country.'
        write: 'Control flow of goods in and out'
      - section: 'How it works'
        say: 'It examines goods, collects import, export and excise duties, and stops prohibited goods and smuggling.'
        write: 'Examine goods, collect duties, stop smuggling'
      - section: 'In Nigeria'
        say: 'An importer clearing goods at Apapa pays duty to customs, and customs officers at Seme border seize smuggled rice.'
        write: 'Apapa duty, Seme border seizures'
      - section: 'Remember'
        say: 'Remember, customs guard the gates of the country for goods.'
        write: 'Customs = gatekeepers for goods'
      - section: 'Answer'
        say: 'So a role of customs and excise is control of the flow of goods in and out of the country, which is option C.'
        write: '$\therefore$ control of the flow of goods'
        answer: true
    traps:
      A: 'You went for a good transport system. Roads and railways are built by the transport ministries, not by customs.'
      B: 'You chose security at the port. General port security belongs to the police and the ports authority. Customs control the goods.'
      D: 'You picked dockyards for ship repairs. These are provided by the ports authority and private firms, not customs.'
  8:
    moments:
      - section: 'The question'
        say: 'A ship is loaded and ready to sail. What paper must reach customs before it can leave?'
        write: 'Document lodged with customs before a ship leaves = ?'
      - section: 'Name it'
        say: 'This is the ship''s manifest.'
        write: 'Ship''s manifest'
      - section: 'The rule'
        say: 'The manifest is a list of all the cargo on board, with the shippers and the consignees.'
        write: 'Manifest = list of all cargo on board'
      - section: 'How it works'
        say: 'The master lodges it with customs, who compare it with the export entries. Only then is the ship cleared to sail.'
        write: 'Manifest checked ⇒ clearance outward'
      - section: 'In Nigeria'
        say: 'Before a vessel carrying cocoa leaves Apapa for Europe, its master lodges the manifest with the Nigeria Customs Service.'
        write: 'Cocoa ship at Apapa ⇒ manifest to customs'
      - section: 'Remember'
        say: 'Remember, the manifest makes the cargo plain to customs.'
        write: 'Manifest = cargo made plain'
      - section: 'Answer'
        say: 'So the document lodged with customs before a ship leaves is the ship manifest, which is option C.'
        write: '$\therefore$ ship manifest'
        answer: true
    traps:
      A: 'You went for the shipping note. It goes with the goods to the dock company for loading, not to customs to clear the ship.'
      B: 'You chose the ship report. That is made to customs when a ship arrives, not when it leaves.'
      D: 'You picked the dock warrant. That is a receipt for goods stored in a dock warehouse.'
  9:
    moments:
      - section: 'The question'
        say: 'One export document must be signed by an official of the buyer''s country before the goods sail. Its name gives it away.'
        write: 'Document endorsed by the consul of the destination country = ?'
      - section: 'Name it'
        say: 'This is the consular invoice.'
        write: 'Consular invoice'
      - section: 'The rule'
        say: 'A consular invoice is signed by the consul of the importing country who is stationed in the exporting country.'
        write: 'Signed by the importing country''s consul'
      - section: 'How it works'
        say: 'The consul checks the value and origin of the goods, so the importing country charges the right duty.'
        write: 'Consul checks value ⇒ right duty charged'
      - section: 'In Nigeria'
        say: 'A Nigerian firm shipping sesame seeds to America takes its invoice to the American consulate in Lagos to be endorsed.'
        write: 'Sesame to the U S ⇒ U S consulate, Lagos'
      - section: 'Remember'
        say: 'Remember, a consular invoice is signed by the consul.'
        write: 'Consular ⇒ consul'
      - section: 'Answer'
        say: 'So the document endorsed by the consul of the destination country is the consular invoice, which is option A.'
        write: '$\therefore$ consular invoice'
        answer: true
    traps:
      B: 'You went for the certificate of origin. It states where the goods were made and is issued by a chamber of commerce in the exporting country.'
      C: 'You chose the bill of lading. That is signed by the shipping company as a receipt for the goods.'
      D: 'You picked the closed indent. That is an order to a commission agent naming the maker to buy from.'
  10:
    moments:
      - section: 'The question'
        say: 'When do a country''s terms of trade get better? Watch what happens to the ratio.'
        write: 'Terms of trade improve when the ratio ?'
      - section: 'Name it'
        say: 'These are the terms of trade, the ratio of export prices to import prices.'
        write: '$\text{Terms of trade} = \dfrac{\text{Export price index}}{\text{Import price index}} \times 100$'
      - section: 'How it works'
        say: 'If the ratio rises, each unit of exports pays for more imports.'
        write: 'Ratio rises ⇒ exports buy more imports'
      - say: 'That means the terms of trade have improved. If the ratio falls, they have worsened.'
        write: 'Rises ⇒ improve. Falls ⇒ worsen.'
      - section: 'In Nigeria'
        say: 'If crude oil prices rise while machine prices stay the same, each barrel buys more machines for Nigeria.'
        write: 'Oil price up, machine price same ⇒ improve'
      - section: 'Remember'
        say: 'Remember, export prices up against import prices means terms up.'
        write: 'Export prices up ⇒ terms up'
      - section: 'Answer'
        say: 'So the terms of trade improve when the ratio increases, which is option C.'
        write: '$\therefore$ the ratio increases'
        answer: true
    traps:
      A: 'You went for a decrease. A falling ratio means each export buys fewer imports, so the terms of trade worsen.'
      B: 'You chose remaining constant. Then the terms of trade are unchanged, not improved.'
      D: 'You picked equal to one. That only says the two price indices are equal. It does not show an improvement.'
  11:
    moments:
      - section: 'The question'
        say: 'Some adverts reach everyone, but one kind only reaches people who can read. Which one?'
        write: 'Advertising medium for the literate only = ?'
      - section: 'Name it'
        say: 'This is print media advertising.'
        write: 'Print media advertising'
      - section: 'The rule'
        say: 'Print media uses newspapers, magazines, posters and handbills. The message is written, so it must be read.'
        write: 'Written message ⇒ must be read'
      - section: 'How it works'
        say: 'Radio, television and cinema use sound and pictures, so they reach people who cannot read as well.'
        write: 'Radio, T V, cinema ⇒ sound and pictures'
      - section: 'In Nigeria'
        say: 'A bank advert in The Punch newspaper reaches only those who can read it.'
        write: 'Newspaper advert ⇒ readers only'
      - section: 'Remember'
        say: 'Remember, print needs reading, so print is for the literate.'
        write: 'Print ⇒ literate'
      - section: 'Answer'
        say: 'So the medium that appeals only to the literate is print media advertising, which is option B.'
        write: '$\therefore$ print media advertising'
        answer: true
    traps:
      A: 'You went for radio. Radio speaks to its listeners, so people who cannot read can follow it.'
      C: 'You chose television. It shows some words, but its pictures and sound reach people who cannot read.'
      D: 'You picked cinema. It uses sound and pictures, which do not need reading.'
  12:
    moments:
      - section: 'The question'
        say: 'A nod, a letter, a traffic light and a phone call all pass messages. Into which two big forms do they all fall?'
        write: 'Two main forms of communication = ?'
      - section: 'Name it'
        say: 'The two main forms are verbal and non verbal communication.'
        write: 'Verbal and non-verbal'
      - section: 'The rule'
        say: 'Verbal communication uses words, spoken or written.'
        write: 'Verbal = with words, spoken or written'
      - say: 'Non verbal communication uses no words, only signs, gestures, pictures and signals.'
        write: 'Non-verbal = without words'
      - section: 'In Nigeria'
        say: 'A market woman in Oshodi calling out her prices is verbal. A danfo conductor waving to say there is space is non verbal.'
        write: 'Calling prices ⇒ verbal. Waving ⇒ non-verbal.'
      - section: 'Remember'
        say: 'Remember, with words is verbal, and without words is non verbal.'
        write: 'Words? yes ⇒ verbal, no ⇒ non-verbal'
      - section: 'Answer'
        say: 'So the two main forms of communication are verbal and non verbal, which is option B.'
        write: '$\therefore$ verbal and non-verbal'
        answer: true
    traps:
      A: 'You went for letters and telephone. These are means of sending messages, not the two main forms.'
      C: 'You chose e-mail and fax. These are modern means of communication, not its main forms.'
      D: 'You picked traditional and modern media. These are channels for messages, not the two forms.'
  13:
    moments:
      - section: 'The question'
        say: 'A signed contract must reach Kano by tomorrow, safely. How do you send it?'
        write: 'Most reliable means for urgent documents = ?'
      - section: 'Name it'
        say: 'This is a courier service.'
        write: 'Courier service'
      - section: 'The rule'
        say: 'A courier company collects documents and delivers them by hand, quickly, to the named person.'
        write: 'Collected, delivered by hand, fast'
      - section: 'How it works'
        say: 'The sender can track the item all the way, and the receiver signs for it. So it is both fast and reliable.'
        write: 'Tracked + signed for ⇒ reliable'
      - section: 'In Nigeria'
        say: 'A Lagos firm sending contracts to a client in Kano by the next day uses a courier company, not the ordinary post.'
        write: 'Lagos to Kano by next day ⇒ courier'
      - section: 'Remember'
        say: 'Remember, urgent and important, send it by courier.'
        write: 'Urgent ⇒ courier'
      - section: 'Answer'
        say: 'So the most reliable and efficient way to send urgent documents is through courier services, which is option D.'
        write: '$\therefore$ courier services'
        answer: true
    traps:
      A: 'You went for postal order. That is a way of sending money by post, not of sending documents.'
      B: 'You chose ordinary letters. They are cheap but slow, and they are not tracked.'
      C: 'You picked registered letters. They are safe and recorded, but they move at the speed of ordinary mail.'
  14:
    moments:
      - section: 'The question'
        say: 'An employer wants a promise that his cashier is honest. What is that undertaking called?'
        write: 'Undertaking assuring a person''s integrity = ?'
      - section: 'Name it'
        say: 'This is fidelity guarantee.'
        write: 'Fidelity guarantee'
      - section: 'The rule'
        say: 'Fidelity guarantee assures an employer of a person''s honesty, and covers him against loss if that person steals.'
        write: 'Covers loss from an employee''s dishonesty'
      - section: 'How it works'
        say: 'If a cashier runs away with money, the insurer pays the employer for the loss.'
        write: 'Cashier steals ⇒ insurer pays employer'
      - section: 'In Nigeria'
        say: 'A bank in Lagos takes fidelity guarantee on its cashiers, so if one disappears with two million naira, the bank is paid back.'
        write: '₦2 million stolen ⇒ bank paid back'
      - section: 'Remember'
        say: 'Remember, fidelity means faithfulness, so it guarantees a faithful, honest person.'
        write: 'Fidelity = faithfulness'
      - section: 'Answer'
        say: 'So an undertaking assuring a person''s integrity is fidelity guarantee, which is option B.'
        write: '$\therefore$ fidelity guarantee'
        answer: true
    traps:
      A: 'You went for proximate cause. That is the main, direct cause of a loss.'
      C: 'You chose subrogation. That is the insurer''s right to step into the insured''s place after paying a claim.'
      D: 'You picked insurable interest. That is the financial stake the insured must have, not a promise of honesty.'
  15:
    moments:
      - section: 'The question'
        say: 'Mr N lost thirty thousand naira in a fire. Will the insurer pay all of it? The average clause says no. Let us see why.'
        write: 'Mr N: sum insured ₦25,000, value ₦100,000, loss ₦30,000. Compensation = ?'
      - section: 'Name it'
        say: 'This is the average clause, which deals with under insurance.'
        write: 'Average clause ⇒ under-insurance'
      - section: 'The rule'
        say: 'If property is insured for less than its value, the insured gets only that share of his loss.'
        write: '$\text{Compensation} = \dfrac{\text{Sum insured}}{\text{Actual value}} \times \text{Actual loss}$'
      - section: 'The working'
        say: 'Mr N insured twenty five thousand naira of property worth one hundred thousand naira.'
        write: '$= \dfrac{25{,}000}{100{,}000} \times 30{,}000$'
      - say: 'Twenty five thousand over one hundred thousand is one quarter.'
        write: '$= \dfrac{1}{4} \times 30{,}000$'
      - say: 'One quarter of thirty thousand naira is seven thousand, five hundred naira.'
        write: '$= 7{,}500$, so ₦7,500'
      - section: 'Check'
        say: 'He insured a quarter of the value, so he gets a quarter of the loss. That fits.'
        write: 'Quarter insured ⇒ quarter of loss paid'
      - section: 'In Nigeria'
        say: 'A shop owner in Onitsha who insures one hundred thousand naira of stock for only twenty five thousand naira gets a quarter of any fire loss.'
        write: 'Insure a part ⇒ paid a part'
      - section: 'Remember'
        say: 'Remember, insure a part, get paid a part.'
        write: 'Part insured, part paid'
      - section: 'Answer'
        say: 'So Mr N''s compensation is seven thousand, five hundred naira, which is option B.'
        write: '$\therefore$ compensation $=$ ₦7,500'
        answer: true
    traps:
      A: 'You went for five thousand naira. That is the loss minus the sum insured. The average clause pays a share of the loss, not the gap between two figures.'
      C: 'You chose seventy thousand naira. That is the value minus the loss, not his compensation.'
      D: 'You picked seventy five thousand naira. That is the uninsured part of the value, not what he is paid.'
  16:
    moments:
      - section: 'The question'
        say: 'Mr P writes a bigger value for his property than it is worth on his proposal form. Which principle has he broken?'
        write: 'Mr P overstates value on the proposal form ⇒ principle broken = ?'
      - section: 'Name it'
        say: 'This is uberrimae fidei, the principle of utmost good faith.'
        write: 'Uberrimae fidei = utmost good faith'
      - section: 'The rule'
        say: 'Both parties must tell the whole truth and disclose every material fact when the contract is made.'
        write: 'Disclose all material facts truthfully'
      - section: 'How it works'
        say: 'The insurer fixes the premium from what the form says. False information lets the insurer refuse the claim or cancel the policy.'
        write: 'False statement ⇒ claim refused, policy void'
      - section: 'In Nigeria'
        say: 'A trader in Aba who writes that his shop is worth far more than it really is has broken utmost good faith.'
        write: 'Value inflated on form ⇒ bad faith'
      - section: 'Remember'
        say: 'Remember, uberrimae fidei means tell the truth, the whole truth.'
        write: 'Tell the whole truth'
      - section: 'Answer'
        say: 'So Mr P has broken uberrimae fidei, which is option C.'
        write: '$\therefore$ uberrimae fidei'
        answer: true
    traps:
      A: 'You went for indemnity. Indemnity is about how much is paid after a loss. A false statement on the form breaks the duty of truth.'
      B: 'You chose insurable interest. Mr P owns the property, so he has insurable interest. That principle is not broken.'
      D: 'You picked subrogation. That is the insurer''s right after paying a claim, not a duty of the insured.'
  17:
    moments:
      - section: 'The question'
        say: 'A damaged car can be repaired, but a lost life cannot be given back. So what does life assurance really pay?'
        write: 'Non-indemnity insurance provides ?'
      - section: 'Name it'
        say: 'This is non indemnity insurance, such as life assurance and personal accident insurance.'
        write: 'Non-indemnity = life, personal accident'
      - section: 'The rule'
        say: 'Indemnity insurance puts the insured back where he was before the loss.'
        write: 'Indemnity = restore to the old position'
      - say: 'A life or a limb has no money value, so non indemnity insurance pays an agreed sum as a consolation.'
        write: 'Non-indemnity = agreed sum as consolation'
      - section: 'In Nigeria'
        say: 'If a civil servant in Lagos with a five million naira life policy dies, his family receives five million naira as consolation.'
        write: '₦5 million life policy ⇒ consolation to family'
      - section: 'Remember'
        say: 'Remember, property can be replaced, but a life can only be consoled for.'
        write: 'Replace property, console for life'
      - section: 'Answer'
        say: 'So non indemnity insurance provides a consolation payment to the insured, which is option D.'
        write: '$\therefore$ consolation payment'
        answer: true
    traps:
      A: 'You went for cover for exporters. That is marine or credit insurance, not what marks non indemnity insurance.'
      B: 'You chose cover for importers. That is marine insurance, not what marks non indemnity insurance.'
      C: 'You picked compensation equal to the exact loss. That is indemnity itself, the very thing non indemnity cannot give.'
  18:
    moments:
      - section: 'The question'
        say: 'Goods do more than sit in a warehouse. What work is done on them there?'
        write: 'An importance of warehousing is in the ?'
      - section: 'Name it'
        say: 'This is warehousing, an aid to trade.'
        write: 'Warehousing'
      - section: 'The rule'
        say: 'A warehouse stores goods, and also prepares them for sale by breaking bulk, grading, blending and repackaging.'
        write: 'Store + break bulk, grade, blend, repackage'
      - section: 'How it works'
        say: 'Goods come in big sacks or drums. In the warehouse they are repacked into smaller packs that shops can sell.'
        write: 'Big sacks in ⇒ small packs out'
      - section: 'In Nigeria'
        say: 'Rice that arrives in fifty kilogram bags is repackaged in a Kano warehouse into five and ten kilogram bags.'
        write: '50 kg bags ⇒ 5 kg and 10 kg bags'
      - section: 'Remember'
