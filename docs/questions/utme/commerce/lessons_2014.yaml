# UTME 2014 Commerce, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Nigerian Commerce teacher works on the
# board: the question, the term named, the definition or rule, how it works in a real
# transaction (or the calculation with data, formula, working and check), a Nigerian example,
# a way to remember it, and the answer moment that names the option.
#
#   say:     heard, not read. Abbreviations read as letters ("S E C"), money in words,
#            percentages as "per cent", no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2014.yaml. Answers match that file. Q1, the
# paper-type question, is left out, so 49 questions have a lesson.
format_version: 1
exam_year: 2014
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'Why do countries that trade with each other usually stay friends? Let us find the activity that ties them together.'
        write: 'Interdependence among nations is necessitated by ?'
      - section: 'Name it'
        say: 'This is a function of commerce, which links nations through trade.'
        write: 'Commerce links nations'
      - section: 'The rule'
        say: 'Commerce is all the activities that move goods and services from producers to consumers, that is, trade and the aids to trade.'
        write: 'Commerce = trade + aids to trade'
      - section: 'How it works'
        say: 'No country produces everything it needs, so each one depends on others for what it lacks.'
        write: 'No country is self-sufficient ⇒ interdependence'
      - say: 'Each country gets what it lacks by trading, selling what it has plenty of and buying what it lacks, and trade is the heart of commerce.'
        write: 'Each country trades to get what it lacks'
      - say: 'So countries that depend on one another have every reason to stay friendly and work together.'
        write: 'Interdependence ⇒ cooperation and friendliness'
      - section: 'In Nigeria'
        say: 'Nigeria sells crude oil and cocoa abroad and buys machines and medicines, so it keeps good relations with its trading partners.'
        write: 'Nigeria sells oil, cocoa; buys machines, medicines'
      - section: 'Remember'
        say: 'Remember, trade ties nations together, so commerce makes friends.'
        write: 'Trade ties nations together'
      - section: 'Answer'
        say: 'So the interdependence that builds friendship among nations comes from commerce, which is option B.'
        write: '$\therefore$ commerce'
        answer: true
    traps:
      A: 'You went for tourism. Tourism brings people together, but it is only a small part of commerce. The interdependence comes from trade as a whole.'
      C: 'You chose agriculture. Agriculture is a form of production. By itself it does not link nations.'
      D: 'You picked socio-cultural activities. They bring people together, but they do not make countries depend on each other economically.'
  3:
    moments:
      - section: 'The question'
        say: 'There are four products, and only one comes straight out of the ground. Which one?'
        write: 'A product of an extractive industry is ?'
      - section: 'Name it'
        say: 'This is extractive industry, a branch of primary production.'
        write: 'Extractive industry (primary production)'
      - section: 'The rule'
        say: 'An extractive industry takes resources directly from nature, from the land, the rivers, the sea and the forest.'
        write: 'Extractive = taken directly from nature'
      - say: 'For example, mining, fishing, farming, hunting and lumbering are all extractive industries.'
        write: 'Mining, fishing, farming, hunting, lumbering'
      - section: 'How it works'
        say: 'So its products are raw materials in their natural state. Factories later turn them into finished goods.'
        write: 'Raw material ⇒ factory ⇒ finished good'
      - say: 'Now look at the options. An airplane, a shoe and cloth are all made in factories, but iron ore is dug straight out of the ground.'
        write: 'Iron ore dug from the ground, the rest made in factories'
      - section: 'In Nigeria'
        say: 'Iron ore is mined at Itakpe in Kogi State for the steel industry.'
        write: 'Iron ore, Itakpe, Kogi State'
      - section: 'Remember'
        say: 'Remember, extractive means taken out of nature, unchanged.'
        write: 'Extractive = out of nature, unchanged'
      - section: 'Answer'
        say: 'So the product of an extractive industry is iron ore, which is option B.'
        write: '$\therefore$ iron ore'
        answer: true
    traps:
      A: 'You went for an airplane. An airplane is assembled in a factory, so it is a manufactured good.'
      C: 'You chose a shoe. A shoe is made from leather in a factory, so it comes from manufacturing.'
      D: 'You picked a textile material. Cloth is woven from cotton in a factory, so it is manufactured, not extracted.'
  4:
    moments:
      - section: 'The question'
        say: 'After a haircut, who pays the barber? That simple picture answers this question.'
        write: 'Payment for a direct service is made by ?'
      - section: 'Name it'
        say: 'This is a direct service, one kind of service occupation.'
        write: 'Services = direct + indirect'
      - section: 'The rule'
        say: 'Direct services are given personally to individuals, by doctors, lawyers, barbers and tailors.'
        write: 'Direct service = given to one person'
      - say: 'Indirect services are given to the public as a whole, by civil servants, soldiers and the police.'
        write: 'Indirect service = given to the public'
      - section: 'How it works'
        say: 'The person who receives a direct service pays the fee, because the service was given to him alone.'
        write: 'Direct ⇒ the person served pays'
      - say: 'Indirect services serve everyone, so government pays for them out of the taxes we all pay.'
        write: 'Indirect ⇒ government pays, from taxes'
      - section: 'In Nigeria'
        say: 'At a barbing salon in Ibadan you pay the barber yourself, but the police officer at the junction is paid by government.'
        write: 'Barber ⇒ you pay.  Police ⇒ government pays'
      - section: 'Remember'
        say: 'Remember, direct service means direct payment by the person served.'
        write: 'Direct service, direct payment'
      - section: 'Answer'
        say: 'So a direct service is usually paid for by the individual, which is option D.'
        write: '$\therefore$ the individual'
        answer: true
    traps:
      A: 'You went for the local authority. Local authorities pay for indirect services to the public, such as sanitation.'
      B: 'You chose the community. A community may fund a shared project, but a direct service is paid for by the person served.'
      C: 'You picked government. Government pays for indirect services like the police, not for a haircut or a lawyer.'
  5:
    moments:
      - section: 'The question'
        say: 'Is a plot in Ikoyi the same as a plot in a village? Hold that thought, because it is the answer.'
        write: 'An important feature of land is that it ?'
      - section: 'Name it'
        say: 'This is land, one of the four factors of production. Its reward is rent.'
        write: 'Land, reward = rent'
      - section: 'The rule'
        say: 'Land means all the free gifts of nature, the soil, minerals, rivers, forests and the sea.'
        write: 'Land = free gifts of nature'
      - section: 'Its features'
        say: 'Land has four main features. It is fixed in supply, passive, immobile and heterogeneous.'
        write: 'Fixed, Passive, Immobile, Heterogeneous'
      - say: 'Fixed in supply means the total amount of land cannot be increased, however high its price rises.'
        write: 'Fixed = total cannot be increased'
      - say: 'Passive means land produces nothing by itself until labour and capital work on it.'
        write: 'Passive = needs labour to produce'
      - say: 'Immobile means land cannot be moved from one place to another.'
        write: 'Immobile = cannot be moved'
      - say: 'Heterogeneous means no two pieces of land are the same, in fertility, location or minerals.'
        write: 'Heterogeneous = no two plots alike'
      - section: 'In Nigeria'
        say: 'A plot in Ikoyi and a plot in a village in Ekiti differ hugely in value, and Benue farmland is more fertile than land in the dry far north.'
        write: 'Ikoyi plot ≠ Ekiti village plot'
      - section: 'Remember'
        say: 'Remember F P I H, which stands for fixed, passive, immobile and heterogeneous.'
        write: 'FPIH'
      - section: 'Answer'
        say: 'So an important feature of land is that it is heterogeneous in nature, which is option C.'
        write: '$\therefore$ heterogeneous in nature'
        answer: true
    traps:
      A: 'You went for elastic supply. Land is fixed in supply, so its supply is inelastic.'
      B: 'You chose an active factor. Land is passive. It yields nothing until labour works on it.'
      D: 'You picked geographically mobile. Land cannot be moved from one place to another, so it is immobile.'
  6:
    moments:
      - section: 'The question'
        say: 'Why does one bakery make millions of loaves and another only a few hundred? Let us find out.'
        write: 'A major determinant of the volume of production is ?'
      - section: 'Name it'
        say: 'This is the volume, or scale, of production.'
        write: 'Volume of production'
      - section: 'The rule'
        say: 'The market means all the buyers of a product, wherever they are.'
        write: 'Market = all the buyers of a product'
      - say: 'A producer makes only as much as it can sell, so the size of the market sets how much is produced.'
        write: 'Size of market ⇒ volume of production'
      - section: 'How it works'
        say: 'A large market allows large scale production, with each worker doing one small task, so the cost of each unit falls.'
        write: 'Large market ⇒ large scale, lower unit cost'
      - say: 'A small market keeps production small, because extra goods would not be sold.'
        write: 'Small market ⇒ small output'
      - section: 'In Nigeria'
        say: 'A noodles factory in Lagos that sells across West Africa makes millions of packs a day. A village bakery bakes a few hundred loaves.'
        write: 'Noodles for West Africa ≫ village bakery'
      - section: 'Remember'
        say: 'Remember, the market decides how much you make.'
        write: 'The market decides how much'
      - section: 'Answer'
        say: 'So a major determinant of the volume of production is the market size, which is option A.'
        write: '$\therefore$ the market size'
        answer: true
    traps:
      B: 'You went for the availability of banks. Banks help with finance, but a firm still cannot produce more than it can sell.'
      C: 'You chose sex distribution. The number of men and women in a population does not decide how much a firm produces.'
      D: 'You picked the location of the head office. Where the head office stands has no real bearing on output.'
  7:
    moments:
      - section: 'The question'
        say: 'Mrs Jones catches crabs and fish in the creeks of Rivers State. What type of occupation is that?'
        write: 'Crabbing and fishing is which occupation?'
      - section: 'Name it'
        say: 'This is extractive occupation. Industrial occupation is the work of producing goods, and extraction is its first branch.'
        write: 'Industrial occupation ⇒ extractive'
      - section: 'The rule'
        say: 'Extractive occupations take resources directly from nature, such as fishing, farming, mining and hunting.'
        write: 'Extractive = taken directly from nature'
      - section: 'How it works'
        say: 'Mrs Jones takes the crabs and fish straight out of the water. She does not process them in a factory.'
        write: 'Crabs and fish straight from the creek'
      - section: 'In Nigeria'
        say: 'Fishermen in the creeks around Bonny and Andoni in Rivers State are in extractive occupation.'
        write: 'Bonny, Andoni fishermen'
      - section: 'Remember'
        say: 'Remember, if it comes straight out of nature, it is extractive.'
        write: 'Straight out of nature = extractive'
      - section: 'Answer'
        say: 'So Mrs Jones is in an extractive occupation, which is option D.'
        write: '$\therefore$ extractive'
        answer: true
    traps:
      A: 'You went for commercial. Selling the fish would be commerce, but catching them is extraction.'
      B: 'You chose manufacturing. Manufacturing changes raw materials into finished goods, and fishing does not.'
      C: 'You picked service. Services are things like teaching or nursing, given to people.'
  8:
    moments:
      - section: 'The question'
        say: 'Imagine the shoppers owning the shop. Which retail outlet is that?'
        write: 'Consumers set up an outlet to eliminate middlemen ?'
      - section: 'Name it'
        say: 'This is the consumer co-operative society.'
        write: 'Consumer co-operative society'
      - section: 'The rule'
        say: 'A consumer co-operative is a retail shop owned by its own customers, who contribute the capital.'
        write: 'Owned by its customers'
      - section: 'How it works'
        say: 'Middlemen are the wholesalers and retailers who stand between the maker and the consumer, and each one adds his own profit to the price.'
        write: 'Middlemen = wholesalers, retailers, each adds profit'
      - say: 'So the society buys in bulk straight from manufacturers, so the middlemen and their profits are cut out.'
        write: 'Buys direct from makers ⇒ no middlemen'
      - say: 'Any surplus is shared among members as a dividend, according to what each one bought.'
        write: 'Surplus shared as dividend on purchases'
      - section: 'In Nigeria'
        say: 'University staff in Nsukka may run a co-operative shop that buys rice and soap straight from the makers.'
        write: 'Staff co-operative shop, Nsukka'
      - section: 'Remember'
        say: 'Remember, consumers own the shop, so the middleman''s profit comes back to them.'
        write: 'Consumers own it, profit comes back'
      - section: 'Answer'
        say: 'So the outlet consumers set up to eliminate middlemen is the consumer co-operative, which is option B.'
        write: '$\therefore$ consumer co-operative'
        answer: true
    traps:
      A: 'You went for a producer co-operative. That is formed by producers to make or market their output, not as a shop for consumers.'
      C: 'You chose a multiple shop. It buys direct too, but it is owned by a company for profit, not by its customers.'
      D: 'You picked a departmental store. It is a large shop owned by a company, not by the people who shop there.'
  9:
    moments:
      - section: 'The question'
        say: 'Goods are left in a warehouse at the port. What paper does the owner get to prove they are his?'
        write: 'Document issued by a port authority for goods deposited ?'
      - section: 'Name it'
        say: 'This is the warehouse warrant, also called the dock warrant.'
        write: 'Warehouse warrant (dock warrant)'
      - section: 'The rule'
        say: 'It is the receipt a port authority or warehouse keeper gives for goods deposited in its warehouse.'
        write: 'Receipt for goods deposited'
      - section: 'How it works'
        say: 'It is a document of title, which means it stands for ownership of the goods, so whoever holds it can collect them.'
        write: 'Document of title'
      - say: 'So the owner can sell the goods, or use them as security for a loan, just by endorsing the warrant, which means signing it over on the back, and handing it over.'
        write: 'Endorse warrant ⇒ goods change hands'
      - section: 'In Nigeria'
        say: 'An importer whose goods wait at Apapa port can sell them to a trader in Idumota by passing on the warrant.'
        write: 'Apapa warehouse ⇒ trader in Idumota'
      - section: 'Remember'
        say: 'Remember, a warrant is for goods in the warehouse.'
        write: 'Warrant ⇔ warehouse'
      - section: 'Answer'
        say: 'So the document a port authority issues for goods deposited is a warehouse warrant, which is option D.'
        write: '$\therefore$ warehouse warrant'
        answer: true
    traps:
      A: 'You went for a bill of lading. That is issued by the shipping company for goods loaded on a ship.'
      B: 'You chose a bill of sight. An importer gives that to customs when he lacks full details of his goods.'
      C: 'You picked a consular invoice. That is certified by the consul of the importing country.'
  10:
    moments:
      - section: 'The question'
        say: 'An importer cannot describe his goods fully because the papers are late. How does he deal with customs?'
        write: 'Document given to customs when full description is not provided ?'
      - section: 'Name it'
        say: 'This is the bill of sight, an import document.'
        write: 'Bill of sight'
      - section: 'The rule'
        say: 'A bill of sight is given to customs when the importer cannot describe the goods fully.'
        write: 'Bill of sight = goods not fully described'
      - section: 'How it works'
        say: 'It lets him examine the goods in front of customs officers.'
        write: 'Examine goods with customs present'
      - say: 'Once he knows exactly what they are, he completes a full bill of entry, the complete customs declaration, and pays the duty, which is the tax on imports.'
        write: 'Then ⇒ full bill of entry + duty'
      - section: 'In Nigeria'
        say: 'A trader clearing a container of spare parts at Tin Can Island, whose invoice is late, lodges a bill of sight to look at the goods first.'
        write: 'Tin Can Island, invoice delayed'
      - section: 'Remember'
        say: 'Remember, a bill of sight lets you see the goods first.'
        write: 'Sight ⇒ see the goods first'
      - section: 'Answer'
        say: 'So the document submitted when a full description is not provided is a bill of sight, which is option A.'
        write: '$\therefore$ a bill of sight'
        answer: true
    traps:
      B: 'You went for an invoice. That is the seller''s bill for goods, not a customs document for missing details.'
      C: 'You chose an indent. An indent is an order for goods sent to an agent abroad.'
      D: 'You picked a bill of entry. That is the full declaration, made once the goods can be described in full.'
  11:
    moments:
      - section: 'The question'
        say: 'Picture a customs officer at the border. What is his job with the goods passing through?'
        write: 'The role of customs and excise includes ?'
      - section: 'Name it'
        say: 'This is the customs and excise authority, which in Nigeria is the Nigeria Customs Service.'
        write: 'Nigeria Customs Service'
      - section: 'The rule'
        say: 'It controls goods coming into and going out of the country.'
        write: 'Controls goods in and out'
      - section: 'How it works'
        say: 'Every import is declared, examined and charged import duty, which is a tax on goods brought in, before it is released.'
        write: 'Declare ⇒ examine ⇒ pay duty ⇒ release'
      - say: 'It also collects excise duty, a tax on some goods made inside the country, and it stops smuggling and banned goods.'
        write: 'Excise duty, stop smuggling'
      - section: 'In Nigeria'
        say: 'Customs officers at the Seme border and at Apapa port check goods and collect duty.'
        write: 'Seme border, Apapa port'
      - section: 'Remember'
        say: 'Remember, customs guard the gate for goods.'
        write: 'Customs guard the gate'
      - section: 'Answer'
        say: 'So customs controls the flow of goods in and out of the country, which is option A.'
        write: '$\therefore$ control of the flow of goods'
        answer: true
    traps:
      B: 'You went for control of security agents. Customs does not control the police or the army.'
      C: 'You chose dockyards for ship repairs. Those are provided by port and shipping bodies.'
      D: 'You picked a transport system. Transport is run by transport firms, not by customs.'
  12:
    moments:
      - section: 'The question'
        say: 'A customer buys on credit all month. At the end, what paper tells him how much he owes?'
        write: 'Document showing a period''s dealings and the balance owed ?'
      - section: 'Name it'
        say: 'This is the statement of account.'
        write: 'Statement of account'
      - section: 'The rule'
        say: 'A seller sends it to a credit customer, usually every month.'
        write: 'Sent monthly to a credit customer'
      - section: 'How it works'
        say: 'It lists the invoices, debit notes, credit notes and payments for the period.'
        write: 'Invoices, debit notes, credit notes, payments'
      - say: 'Invoices and debit notes add to what the customer owes, while credit notes and payments reduce it, so what is left is the balance owed.'
        write: 'Invoices + debit notes − credit notes − payments = balance'
      - say: 'The customer checks it against his own records and then pays the balance.'
        write: 'Check, then pay the balance'
      - section: 'In Nigeria'
        say: 'A Kano wholesaler who supplies a retailer on credit sends a statement at the month end showing four hundred and fifty thousand naira still owing.'
        write: 'Balance owing ₦450,000'
      - section: 'Remember'
        say: 'Remember, a statement states the balance.'
        write: 'Statement states the balance'
      - section: 'Answer'
        say: 'So the document that records a period''s dealings and shows the indebtedness is a statement of account, which is option A.'
        write: '$\therefore$ statement of account'
        answer: true
    traps:
      B: 'You went for a consular invoice. That is an export document certified by a consul, not a record of a customer''s dealings.'
      C: 'You chose a proforma invoice. It is sent before a sale, as a quotation, and records no past dealings.'
      D: 'You picked a statement of affairs. That lists a whole business''s assets and liabilities, not its dealings with one customer.'
  13:
    moments:
      - section: 'The question'
        say: 'A customer writes to ask, how much are your goods? What does the wholesaler send back?'
        write: 'Reply to an inquiry ?'
      - section: 'The steps'
        say: 'Buying and selling follows the steps of enquiry, quotation, order, invoice and payment.'
        write: 'Enquiry ⇒ quotation ⇒ order ⇒ invoice ⇒ payment'
      - section: 'Name it'
        say: 'The enquiry comes first, from the buyer. The reply to an enquiry is the quotation, from the seller.'
        write: 'Enquiry answered by a quotation'
      - section: 'How it works'
        say: 'The quotation gives the price, the discounts, the delivery terms and the terms of payment.'
        write: 'Price, discounts, delivery, payment terms'
      - say: 'If the buyer likes what he sees, he then sends an order.'
        write: 'Then buyer sends an order'
      - section: 'In Nigeria'
        say: 'A supermarket in Abuja asks an Onitsha wholesaler about a hundred cartons of soap, and the wholesaler replies with a quotation and a price list.'
        write: 'Abuja supermarket ⇒ Onitsha wholesaler'
      - section: 'Remember'
        say: 'Remember, enquiry asks, quotation answers and order buys.'
        write: 'Asks, answers, buys'
      - section: 'Answer'
        say: 'So the wholesaler sends back a quotation, which is option C.'
        write: '$\therefore$ a quotation'
        answer: true
    traps:
      A: 'You went for a consignment note. That goes with goods sent by rail or road, after the sale.'
      B: 'You chose an order. The order comes from the buyer, after he has seen the quotation.'
      D: 'You picked an advice note. It tells the buyer that goods have been sent, which is after the order.'
  14:
    moments:
      - section: 'The question'
        say: 'A carton worth two thousand naira was billed at only two hundred naira. How does the seller put it right?'
        write: 'Value ₦2,000, invoiced ₦200. Which document?'
      - section: 'Name it'
        say: 'This is the debit note, used when a buyer has been charged too little.'
        write: 'Undercharge ⇒ debit note'
      - section: 'The rule'
        say: 'A debit note raises what the buyer owes. A credit note lowers it.'
        write: 'Debit note raises the bill.  Credit note lowers it.'
      - section: 'The working'
        say: 'We are given the true value, two thousand naira, and the amount invoiced, two hundred naira. We must find how much more the buyer should be charged.'
        write: 'Given ₦2,000 and ₦200. Find the amount still owed'
      - say: 'That amount is the undercharge, and the undercharge is the true value less the amount invoiced.'
        write: 'Undercharge = true value − amount invoiced'
      - say: 'Two thousand naira less two hundred naira gives one thousand, eight hundred naira. This tells us the buyer still owes one thousand, eight hundred naira, so the debit note must be for that amount.'
        write: '$2{,}000 - 200 = 1{,}800$, so ₦1,800'
      - section: 'The check'
        say: 'Two hundred naira already billed plus one thousand, eight hundred naira on the debit note gives two thousand naira, the true value.'
        write: '₦200 + ₦1,800 = ₦2,000 ✓'
      - section: 'In Nigeria'
        say: 'A noodles distributor in Aba who undercharged a shop sends a debit note to recover the rest.'
        write: 'Aba distributor sends a debit note'
      - section: 'Remember'
        say: 'Remember, debit raises the debt and credit cuts it.'
        write: 'Debit raises the Debt'
      - section: 'Answer'
        say: 'So the seller issues a debit note for one thousand, eight hundred naira, which is option D.'
        write: '$\therefore$ a debit note for ₦1,800'
        answer: true
    traps:
      A: 'You went for an invoice for two hundred naira. That repeats the undercharge and leaves one thousand, eight hundred naira unbilled.'
      B: 'You chose a debit note for two thousand naira. That would charge the buyer two thousand, two hundred naira in all.'
      C: 'You picked a credit note. The amount is right, but a credit note lowers what the buyer owes, and here he owes more.'
  15:
    moments:
      - section: 'The question'
        say: 'A tourist has no address in town. How can letters still reach her?'
        write: 'Letters for tourists with no fixed address ?'
      - section: 'Name it'
        say: 'This is poste restante, a postal service.'
        write: 'Poste restante'
      - section: 'The rule'
        say: 'Poste restante means mail remaining. Letters are kept at a named post office until the person calls for them.'
        write: 'Mail kept at the post office until collected'
      - section: 'How it works'
        say: 'The letter is addressed to her, care of the post office, and she collects it by showing proof of who she is.'
        write: 'Name, Poste Restante, town post office'
      - section: 'In Nigeria'
        say: 'A tourist at the Obudu Mountain Resort could collect letters at Obudu Post Office. Today email and mobile phones do most of this work.'
        write: 'Obudu Post Office (now email, phones)'
      - section: 'Remember'
        say: 'Remember, poste restante means the post rests at the office until you come.'
        write: 'The post rests at the office'
      - section: 'Answer'
        say: 'So tourists with no fixed address receive letters through poste restante, which is option A.'
        write: '$\therefore$ poste restante'
        answer: true
    traps:
      B: 'You went for parcel post. That carries parcels. It does not hold letters for travellers.'
      C: 'You chose a private mail bag. That is rented by a business or person with a fixed base.'
      D: 'You picked recorded delivery. That gets a signature when a letter is delivered to an address.'
  16:
    moments:
      - section: 'The question'
        say: 'An endowment policy pays out at the end of a period or at death. So which class of cover is it?'
        write: 'Endowment policy is an aspect of ?'
      - section: 'Name it'
        say: 'This is life assurance.'
        write: 'Life assurance'
      - section: 'The rule'
        say: 'In an endowment policy, the insured pays premiums, which are regular payments to the insurer, for a fixed period such as twenty years.'
        write: 'Premiums for a fixed period'
      - section: 'How it works'
        say: 'The sum assured, which is the amount the policy promises, is paid at the end of the period, or at death if that comes first.'
        write: 'Paid at end of period or at death'
      - say: 'So the policy is tied to a human life, and that is why it is life assurance.'
        write: 'Tied to a life ⇒ life assurance'
      - say: 'And because payment is certain, it is a form of saving as well as protection.'
        write: 'Saving + protection'
      - section: 'In Nigeria'
        say: 'A civil servant in Enugu takes a twenty year endowment policy to pay for her children''s university fees.'
        write: 'Enugu civil servant, 20-year policy'
      - section: 'Remember'
        say: 'Remember, endowment ends with a payment, so it is life assurance.'
        write: 'Endowment ⇒ life assurance'
      - section: 'Answer'
        say: 'So an endowment policy is an aspect of life assurance, which is option D.'
