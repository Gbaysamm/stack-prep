# UTME 2015 Commerce, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Nigerian Commerce teacher works on the
# board: the question, the term named, its definition or rule, how it works in a real
# transaction (or the calculation with data, formula, working and check), a Nigerian example, a
# way to remember it, and the answer moment that names the option.
#
#   say:     heard, not read. Abbreviations as letters ("S O N"), money in words, percentages
#            as "per cent", no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2015.yaml. Answers match that file. This paper
# has no paper-type question, so all 40 questions have a lesson.
format_version: 1
exam_year: 2015
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'Some invoices are sent before anything is sold. When does a seller not need one? Let us find out.'
        write: 'A pro-forma invoice is not required when ?'
      - section: 'Name it'
        say: 'This is the pro-forma invoice, a document in buying and selling.'
        write: 'Pro-forma invoice'
      - section: 'The rule'
        say: 'A pro-forma invoice looks like an invoice, but it is sent before a sale. It shows what the goods would cost, and it does not ask the buyer to settle a debt.'
        write: 'Pro-forma invoice = invoice sent before the sale'
      - section: 'How it works'
        say: 'A seller sends one as a formal quotation, when goods go out on approval, and when the buyer must pay before the goods are sent.'
        write: 'Uses: quotation, goods on approval, payment before delivery'
      - say: 'With a regular customer the price and terms are already agreed, so the seller just sends the goods with an ordinary invoice.'
        write: 'Regular customer ⇒ ordinary invoice, no pro-forma'
      - section: 'In Nigeria'
        say: 'A Balogun trader who buys from the same wholesaler every week gets an ordinary invoice with each delivery. No pro-forma is needed.'
        write: 'Weekly buyer at Balogun ⇒ ordinary invoice'
      - section: 'Remember'
        say: 'Remember, pro-forma means for the sake of form. It is a paper sent before the real deal.'
        write: 'Pro-forma = before the real deal'
      - section: 'Answer'
        say: 'So a pro-forma invoice is not required when dealing regularly with a customer, which is option A.'
        write: '$\therefore$ dealing regularly with a customer'
        answer: true
    traps:
      B: 'You chose quoting for the supply of goods. A pro-forma invoice is often used as a formal quotation, so it is needed there.'
      C: 'You went for goods sent on approval. Those goods are not yet sold, so they go with a pro-forma invoice.'
      D: 'You picked payment before delivery. The pro-forma invoice is exactly what tells the buyer how much to pay first.'
  2:
    moments:
      - section: 'The question'
        say: 'Can a business go to court in its own name, apart from its owners? One kind can. Let us see which feature makes a company different.'
        write: 'A limited liability company is different because it ?'
      - section: 'Name it'
        say: 'This is the limited liability company, owned by shareholders.'
        write: 'Limited liability company'
      - section: 'The rule'
        say: 'A company is a separate legal person, apart from the people who own it.'
        write: 'Company = separate legal person'
      - section: 'How it works'
        say: 'Because it is a legal person, it can own property, sign contracts, and sue and be sued in its own name.'
        write: 'Owns property, signs contracts, sues and is sued'
      - say: 'If the company owes money, the creditor sues the company, not each shareholder.'
        write: 'Debt ⇒ creditor sues the company'
      - section: 'In Nigeria'
        say: 'If a customer takes Dangote Cement to court, the case is against the company itself, not against its many shareholders.'
        write: 'Customer v. Dangote Cement Plc'
      - section: 'Remember'
        say: 'Remember, a company has its own name in court.'
        write: 'Own name in court'
      - section: 'Answer'
        say: 'So a distinguishing feature of a limited liability company is that it can sue and be sued, which is option B.'
        write: '$\therefore$ it can sue and be sued'
        answer: true
    traps:
      A: 'You chose a collection of sole proprietors. Sole traders run their own businesses. A company is owned by shareholders.'
      C: 'You went for a multiple partnership. A partnership is not a separate legal person, but a company is.'
      D: 'You picked limited resources. Limited liability limits the owners risk, not the company money. Companies usually raise the most capital.'
  3:
    moments:
      - section: 'The question'
        say: 'Houses and roads are built. Which other job here is building work?'
        write: 'Construction includes houses, roads and ?'
      - section: 'Name it'
        say: 'This is construction, a branch of industrial occupation.'
        write: 'Industry = extractive + manufacturing + construction'
      - section: 'The rule'
        say: 'Construction means putting up structures, such as houses, roads, bridges and dams.'
        write: 'Construction = putting up structures'
      - section: 'How it works'
        say: 'Manufacturing makes a product from raw materials in a workshop or factory. Construction builds something that stands where it is put.'
        write: 'Manufacturing makes products, construction builds structures'
      - say: 'Bricklaying raises the walls of a building, so it belongs with construction.'
        write: 'Bricklaying raises walls ⇒ construction'
      - section: 'In Nigeria'
        say: 'On a building site in Abuja, the bricklayer raises the walls while road workers lay the tarmac outside. Both are doing construction.'
        write: 'Abuja site: bricklayer + road workers'
      - section: 'Remember'
        say: 'Remember, if it puts up a structure, it is construction.'
        write: 'Puts up a structure ⇒ construction'
      - section: 'Answer'
        say: 'So construction includes bricklaying, which is option C.'
        write: '$\therefore$ bricklaying'
        answer: true
    traps:
      A: 'You chose shoe-making. It turns leather into a product, so it is manufacturing.'
      B: 'You went for blacksmithing. It shapes metal into tools, so it is manufacturing.'
      D: 'You picked car assembling. It puts parts together in a factory, which is manufacturing, not building.'
  4:
    moments:
      - section: 'The question'
        say: 'A company files two founding documents. Which facts go in the Articles, and which in the Memorandum?'
        write: 'Articles of Association contain ?'
      - section: 'Name it'
        say: 'This is the Articles of Association, filed to register a company.'
        write: 'Memorandum of Association + Articles of Association'
      - section: 'The rule'
        say: 'The Memorandum governs the company in its dealings with the outside world. The Articles are its internal rules.'
        write: 'Memorandum = outside.  Articles = inside rules'
      - section: 'How it works'
        say: 'The Memorandum holds the name, the objects, the share capital and the limited liability clause.'
        write: 'Memorandum: name, objects, share capital, limited liability'
      - say: 'The Articles hold the rights and duties of directors, voting rights, meetings and how shares are transferred.'
        write: 'Articles: directors'' rights and duties, meetings, voting, transfers'
      - section: 'In Nigeria'
        say: 'A new company registering with the C A C files both documents. Its Articles might say a third of the directors retire every year.'
        write: 'C A C registration: both documents filed'
      - section: 'Remember'
        say: 'Remember, the Memorandum faces outside, and the Articles run the inside.'
        write: 'Memorandum faces out, Articles run inside'
      - section: 'Answer'
        say: 'So the Articles contain the rights and obligations of directors, which is option B.'
        write: '$\therefore$ rights and obligations of directors'
        answer: true
    traps:
      A: 'You chose the objectives of the company. The objects clause is in the Memorandum, not the Articles.'
      C: 'You went for the share capital. That is stated in the Memorandum.'
      D: 'You picked limitation of liability. The limited liability clause is in the Memorandum.'
  5:
    moments:
      - section: 'The question'
        say: 'Four things grew up alongside trade in Nigeria. Which one did the least to help trade grow?'
        write: 'Contributed least to the growth of commerce ?'
      - section: 'Name it'
        say: 'This is the growth of commercial activity in Nigeria, from barter to modern trade.'
        write: 'Barter ⇒ modern commerce'
      - section: 'The rule'
        say: 'Commerce grew as the hindrances to exchange were removed.'
        write: 'Remove the hindrances ⇒ trade grows'
      - section: 'How it works'
        say: 'Money ended the problems of barter. Transport carried goods over long distances. Banks gave safe payment and credit.'
        write: 'Money, transport, banks ⇒ trade grows'
      - say: 'Traders unions came later, to protect their members. They did little to create trade itself.'
        write: 'Traders'' unions came after trade'
      - section: 'In Nigeria'
        say: 'The railway from Lagos to Kano opened up the groundnut trade of the North, and banks such as First Bank gave traders credit.'
        write: 'Lagos to Kano railway, First Bank credit'
      - section: 'Remember'
        say: 'Remember, money, movement and banks built commerce, and the unions came after it.'
        write: 'Money, movement, banks built it'
      - section: 'Answer'
        say: 'So the development of traders unions contributed least, which is option D.'
        write: '$\therefore$ development of traders'' unions'
        answer: true
    traps:
      A: 'You chose banks. Banks gave credit and a safe way to pay, so they did a great deal for trade.'
      B: 'You went for transport. Transport carried goods across the country, which opened up trade.'
      C: 'You picked currencies. Money ended barter and made exchange easy.'
  6:
    moments:
      - section: 'The question'
        say: 'Why does one person become a tailor and another a pilot? Only one of these four things really decides it.'
        write: 'A factor that determines the choice of occupation ?'
      - section: 'Name it'
        say: 'These are the factors that determine the choice of occupation.'
        write: 'Choice of occupation'
      - section: 'The rule'
        say: 'The choice depends on the person and the job, such as skill, training, interest, capital and pay.'
        write: 'Skill, training, interest, capital, pay'
      - section: 'How it works'
        say: 'Skill is critical, because a person can only take a job he is able to do.'
        write: 'No skill ⇒ cannot do the job'
      - say: 'A surgeon needs surgical skill and a tailor needs sewing skill. Wanting the job is not enough.'
        write: 'Surgeon, tailor, each needs the skill'
      - section: 'In Nigeria'
        say: 'A young man in Aba who has learnt shoe-making as an apprentice can set up as a shoemaker. One who has not learnt it cannot.'
        write: 'Aba apprentice shoemaker'
      - section: 'Remember'
        say: 'Remember, you can only choose the jobs you can do.'
        write: 'Choose what you can do'
      - section: 'Answer'
        say: 'So a factor that critically determines the choice of occupation is skill, which is option A.'
        write: '$\therefore$ skill'
        answer: true
    traps:
      B: 'You chose the exchange rate. It affects import prices, not which job a person chooses.'
      C: 'You went for the national budget. That is government spending, and it does not decide a person''s job.'
      D: 'You picked public holidays. They are the same for most jobs, so they do not decide the choice.'
  7:
    moments:
      - section: 'The question'
        say: 'A tourist has no address in town. So how does the post office get his letters to him?'
        write: 'Letters for a tourist with no fixed address ?'
      - section: 'Name it'
        say: 'This is poste restante, a postal service.'
        write: 'Poste restante'
      - section: 'The rule'
        say: 'Poste restante means the post office keeps letters for a person with no fixed address until he comes for them.'
        write: 'Post office holds the letter until collected'
      - section: 'How it works'
        say: 'The sender writes the person''s name, then poste restante, then the name of the post office.'
        write: 'Name, Poste Restante, named post office'
      - say: 'The person calls at that post office and shows proof of identity to collect the letter.'
        write: 'Call in + show identity ⇒ collect'
      - section: 'In Nigeria'
        say: 'A tourist spending a few weeks in Calabar could collect his letters at the head post office there. Today most travellers use phones and email, so the service is little used.'
        write: 'Calabar head post office'
      - section: 'Remember'
        say: 'Remember, poste restante, the letter rests at the post office.'
        write: 'The letter rests at the post office'
      - section: 'Answer'
        say: 'So the tourist receives letters through poste restante, which is option A.'
        write: '$\therefore$ poste restante'
        answer: true
    traps:
      B: 'You chose recorded delivery. It gets a signature at an address, so it needs an address to deliver to.'
      C: 'You went for the postmaster. He runs the post office, but he is not a service for receiving letters.'
      D: 'You picked parcel post. It sends packages to an address, not letters for people with no address.'
  8:
    moments:
      - section: 'The question'
        say: 'A company is wound up and its assets are sold. Who takes whatever is left at the very end?'
        write: 'On liquidation, the residual owners are ?'
      - section: 'Name it'
        say: 'This is liquidation, the winding up of a company.'
        write: 'Liquidation = winding up'
      - section: 'The rule'
        say: 'The money is paid out in a fixed order. The residual owners take what is left at the end.'
        write: 'Fixed order of payment'
      - section: 'How it works'
        say: 'First come the costs of winding up and debts such as taxes and wages, then debenture holders and other creditors.'
        write: '1. costs, taxes, wages  2. debenture holders, creditors'
      - say: 'Next come preference shareholders. Ordinary shareholders come last and take whatever remains.'
        write: '3. preference shareholders  4. ordinary shareholders'
      - section: 'In Nigeria'
        say: 'If a Lagos company has ten million naira left after everyone else is paid, that ten million naira goes to the ordinary shareholders.'
        write: '₦10 million left ⇒ ordinary shareholders'
      - section: 'Remember'
        say: 'Remember, ordinary shareholders are first for risk and last for repayment.'
        write: 'First for risk, last for repayment'
      - section: 'Answer'
        say: 'So the residual owners are the ordinary shareholders, which is option D.'
        write: '$\therefore$ ordinary shareholders'
        answer: true
    traps:
      A: 'You chose debenture holders. They are creditors, often secured, so they are paid early.'
      B: 'You went for creditors. Creditors are paid before any shareholder gets anything.'
      C: 'You picked preference shareholders. They are paid before ordinary shareholders, so they are not last.'
  9:
    moments:
      - section: 'The question'
        say: 'Buying and selling goods needs help. Which set of three is made only of the helpers?'
        write: 'Major factors that facilitate merchandising ?'
      - section: 'Name it'
        say: 'These are the aids to trade. Merchandising means buying and selling goods.'
        write: 'Aids to trade'
      - section: 'The rule'
        say: 'Aids to trade remove the hindrances to trade.'
        write: 'Aids to trade remove hindrances'
      - section: 'How it works'
        say: 'Banking removes the hindrance of payment, insurance removes risk, and transport removes the hindrance of place.'
        write: 'Banking, payment.  Insurance, risk.  Transport, place.'
      - say: 'Manufacturing, management and production are not aids to trade. They make or run things.'
        write: 'Manufacturing, management, production are not aids'
      - section: 'In Nigeria'
        say: 'An Onitsha trader pays his Lagos supplier through the bank, insures the goods and has them brought by lorry.'
        write: 'Onitsha trader: bank, insurance, lorry'
      - section: 'Remember'
        say: 'Remember, banks for payment, insurance for risk, transport for place.'
        write: 'Payment, risk, place'
      - section: 'Answer'
        say: 'So the major factors are banking, insurance and transportation, which is option A.'
        write: '$\therefore$ banking, insurance and transportation'
        answer: true
    traps:
      B: 'You chose the set with management. Management runs a business, but it is not an aid to trade.'
      C: 'You went for the set with manufacturing. Manufacturing is production, not an aid to trade.'
      D: 'You picked trading, warehousing and production. Trading and production are not aids to trade.'
  10:
    moments:
      - section: 'The question'
        say: 'A wheel turns around its pivot. What sits at the very centre of commerce?'
        write: 'The pivot of commerce ?'
      - section: 'Name it'
        say: 'This is trade, the heart of commerce.'
        write: 'Trade'
      - section: 'The rule'
        say: 'Commerce is made up of trade and the aids to trade. Trade is the buying and selling of goods and services.'
        write: 'Commerce = trade + aids to trade'
      - section: 'How it works'
        say: 'Every aid to trade, from banking to transport, exists to help trade happen.'
        write: 'Aids serve trade'
      - say: 'Take away trade and the aids have nothing to serve. So trade is the pivot that commerce turns on.'
        write: 'No trade ⇒ no commerce'
      - section: 'In Nigeria'
        say: 'Around Onitsha main market, the banks, lorries and warehouses are all there because of the buying and selling inside it.'
        write: 'Onitsha market: banks, lorries, warehouses'
      - section: 'Remember'
        say: 'Remember, trade is the hub and the aids are the spokes.'
        write: 'Trade = hub, aids = spokes'
      - section: 'Answer'
        say: 'So the pivot on which commerce turns is trade, which is option D.'
        write: '$\therefore$ trade'
        answer: true
    traps:
      A: 'You chose tariff. A tariff is a tax on imports. It affects trade, but it is not the centre.'
      B: 'You went for taxation. Taxes raise government revenue, but they are not the centre of commerce.'
      C: 'You picked price. Price is part of each sale, but trade itself is the centre.'
  11:
    moments:
      - section: 'The question'
        say: 'A buyer sends an enquiry. What comes back, and what follows?'
        write: 'Enquiry, then ?'
      - section: 'Name it'
        say: 'This is the procedure in the purchase and sale of goods.'
        write: 'Purchase and sale procedure'
      - section: 'The rule'
        say: 'The documents follow a fixed order, which is enquiry, quotation, order, then invoice.'
        write: 'Enquiry ⇒ quotation ⇒ order ⇒ invoice'
      - section: 'How it works'
        say: 'The buyer asks about goods and prices in an enquiry. The seller replies with a quotation.'
        write: 'Buyer asks, seller quotes'
      - say: 'The buyer then places an order, and the seller sends the goods with an invoice showing what is owed.'
        write: 'Buyer orders, seller invoices'
      - section: 'In Nigeria'
        say: 'A supermarket in Ibadan sends an enquiry to a biscuit maker, gets a quotation, orders five hundred cartons and receives an invoice with them.'
        write: 'Ibadan supermarket, 500 cartons'
      - section: 'Remember'
        say: 'Remember, ask, quote, order, bill.'
        write: 'Ask, quote, order, bill'
      - section: 'Answer'
        say: 'So after the enquiry come quotation, order and invoice, which is option B.'
        write: '$\therefore$ quotation, order and invoice'
        answer: true
    traps:
      A: 'You chose order, sale and invoice. A sale is the whole deal, not a document. The reply to an enquiry is a quotation.'
      C: 'You went for placement. That is not a document in the procedure. The seller replies with a quotation.'
      D: 'You picked bargain. Bargaining is not a formal step. The seller replies with a quotation.'
  12:
    moments:
      - section: 'The question'
        say: 'Hire purchase helps the buyer, the seller and the maker. But which advantage belongs to the customer?'
        write: 'Advantage of hire purchase to the customer ?'
      - section: 'Name it'
        say: 'This is hire purchase, a way of buying on credit.'
        write: 'Hire purchase = buying on credit'
      - section: 'The rule'
        say: 'The buyer pays a deposit, takes the goods, and pays the rest in instalments.'
        write: 'Deposit + instalments'
      - section: 'How it works'
        say: 'The goods stay the seller''s until the last instalment, but the customer uses them from the first day.'
        write: 'Customer uses goods from day one'
      - say: 'More sales help the seller, and bigger output helps the maker. Those are not the customer''s gains.'
        write: 'Seller gains turnover, maker gains scale'
      - section: 'In Nigeria'
        say: 'A teacher in Enugu pays a deposit on a fridge and takes it home the same day, paying the rest every month.'
        write: 'Enugu teacher, fridge on deposit'
      - section: 'Remember'
        say: 'Remember, hire purchase is use now and pay later.'
        write: 'Use now, pay later'
      - section: 'Answer'
        say: 'So the advantage to the customer is possession of goods before payment, which is option D.'
        write: '$\therefore$ possession of goods before payment'
        answer: true
    traps:
      A: 'You chose low interest. Hire purchase carries a high interest charge, so the customer pays more than the cash price.'
      B: 'You went for more turnover and profits. That is the seller''s gain, not the customer''s.'
      C: 'You picked economies of scale. Those help the manufacturer, not the customer directly.'
  13:
    moments:
      - section: 'The question'
        say: 'Who makes sure a product meets government quality standards? Watch the names closely.'
        write: 'Agency for quality specifications ?'
      - section: 'Name it'
        say: 'This is the Standards Organisation of Nigeria, S O N.'
        write: 'Standards Organisation of Nigeria (SON)'
      - section: 'The rule'
        say: 'S O N sets the standards products must meet in Nigeria, and checks that they meet them.'
        write: 'SON sets and enforces standards'
      - section: 'How it works'
        say: 'It writes the Nigerian Industrial Standards, tests products, and certifies those that pass.'
        write: 'Write standards, test, certify'
      - say: 'It also checks imported goods against the same standards.'
        write: 'Imports checked too'
      - section: 'In Nigeria'
        say: 'A Nigerian paint maker must meet the S O N standard for paint before its tins carry the quality mark.'
        write: 'Paint tins carry the SON mark'
      - section: 'Remember'
        say: 'Remember, Standards Organisation sets the standard.'
        write: 'SON sets the standard'
      - section: 'Answer'
        say: 'So the agency is the Standards Organisation of Nigeria, which is option B.'
        write: '$\therefore$ Standards Organisation of Nigeria'
        answer: true
    traps:
      A: 'You chose the consumers association. It speaks for buyers but cannot enforce government standards.'
      C: 'You went for the chamber of commerce. It promotes trade for its members, but it does not set quality standards.'
      D: 'You picked the Manufacturers Association. It speaks for manufacturers, but it does not enforce standards.'
  14:
    moments:
      - section: 'The question'
        say: 'Four computer languages, each built for a different job. Which one was made for science?'
        write: 'Language designed for science problems ?'
      - section: 'Name it'
        say: 'This is FORTRAN, a high level computer language.'
        write: 'FORTRAN'
      - section: 'The rule'
        say: 'FORTRAN stands for formula translation. It was designed for scientific and engineering calculations.'
        write: 'FORTRAN = FORmula TRANslation'
      - section: 'How it works'
        say: 'It handles long mathematical formulae quickly, so scientists used it for physics, engineering and weather work.'
        write: 'Long formulae ⇒ science and engineering'
      - say: 'COBOL was built for business records, and BASIC for beginners.'
        write: 'COBOL, business.  BASIC, beginners.'
      - section: 'In Nigeria'
        say: 'An engineering department working out the loads on a bridge would once have written its program in FORTRAN. Today many scientists also use newer languages such as Python.'
        write: 'Bridge loads ⇒ FORTRAN'
      - section: 'Remember'
        say: 'Remember, FORTRAN is the language of formulae.'
        write: 'FORTRAN = formulae'
      - section: 'Answer'
        say: 'So the language designed for science problems is FORTRAN, which is option D.'
        write: '$\therefore$ FORTRAN'
        answer: true
    traps:
      A: 'You chose COBOL. COBOL means common business oriented language, so it is for business, not science.'
      B: 'You went for ADA. It was built mainly for defence and other large systems.'
      C: 'You picked BASIC. It was designed as a simple language for beginners.'
  15:
    moments:
      - section: 'The question'
        say: 'A business can borrow from a bank, sell shares, or take credit from suppliers. How does it judge which source is best?'
        write: 'Essential factor for evaluating sources of funds ?'
      - section: 'Name it'
        say: 'These are the sources of finance for a business.'
        write: 'Sources of finance'
      - section: 'The rule'
        say: 'Each source is judged by what it costs and how hard it is to repay.'
        write: 'Judge by cost and repayment'
      - section: 'How it works'
        say: 'A loan costs interest and shares cost dividends. That is the cost.'
        write: 'Cost = interest or dividends'
      - say: 'An overdraft must be repaid soon, a debenture later, and owners capital never. That is the repayment burden.'
        write: 'Repayment: soon, later, or never'
      - section: 'In Nigeria'
        say: 'A Kaduna bakery compares a bank loan at high interest with cheaper credit from a cooperative, repaid over two years. It chooses by cost and repayment.'
        write: 'Kaduna bakery: bank loan v. cooperative'
      - section: 'Remember'
        say: 'Remember, count the cost and the payback before you borrow.'
        write: 'Count the cost and the payback'
      - section: 'Answer'
        say: 'So the essential factor is the burden of cost and repayment, which is option B.'
        write: '$\therefore$ burden of cost and repayment'
        answer: true
    traps:
      A: 'You chose the lender''s head office. Where it is does not change the cost or terms of the money.'
      C: 'You went for the lender''s branches. They do not affect the cost of the funds or how they are repaid.'
      D: 'You picked the decree. Most businesses are not set up by decree, and a decree does not compare sources of funds.'
  16:
    moments:
      - section: 'The question'
        say: 'Two of these lists look almost the same. One small item spoils the wrong one. Let us find it.'
        write: 'New shares in the primary market are issued through ?'
      - section: 'Name it'
        say: 'This is the primary market, where new shares are sold for the first time.'
        write: 'Primary market = new issues'
      - section: 'The rule'
        say: 'A company issues new shares by prospectus, by offer for sale, by placing, by rights issue, or by tender.'
        write: 'Prospectus, offer for sale, placing, rights, tender'
      - section: 'How it works'
        say: 'With a prospectus, the company offers shares straight to the public. With an offer for sale, an issuing house buys them and sells them on.'
        write: 'Prospectus, direct.  Offer for sale, through an issuing house'
      - say: 'With placing, the shares are sold privately to chosen investors.'
        write: 'Placing = private sale to chosen investors'
      - say: 'A bill of exchange is a way to pay for goods. It does not issue shares.'
        write: 'Bill of exchange = payment, not a share issue'
      - section: 'In Nigeria'
        say: 'When a Nigerian bank raises new capital, it publishes a prospectus, and an issuing house may place some shares with pension funds.'
        write: 'Bank: prospectus + placing'
      - section: 'Remember'
        say: 'Remember, prospectus, offer for sale and placing sell new shares, and a bill only pays for goods.'
        write: 'Bills pay, they do not issue'
      - section: 'Answer'
        say: 'So new shares are issued through a prospectus, an offer for sale and placing, which is option C.'
        write: '$\therefore$ prospectus, offer for sale and placing'
        answer: true
    traps:
      A: 'You chose personal selling, publicity and advertising. Those are ways to promote goods, not ways to issue shares.'
      B: 'You went for the list with a bill of exchange. A bill is a way of paying, not of issuing shares.'
