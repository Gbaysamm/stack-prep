    moments:
      - section: 'The question'
        say: 'Six figures are given, but we need only some of them. Many students divide sales by stock and fall into the trap. Let us be careful.'
        write: 'Sales ₦15,000, opening stock ₦5,600, purchases ₦9,700, closing stock ₦4,400'
      - section: 'Name it'
        say: 'This is the rate of turnover, the number of times a trader sells his average stock in a period.'
        write: 'Rate of turnover (rate of stock turn)'
      - section: 'The rule'
        say: 'Rate of turnover equals cost of goods sold divided by average stock.'
        write: '$\text{Rate of turnover} = \dfrac{\text{Cost of goods sold}}{\text{Average stock}}$'
      - section: 'Cost of goods sold'
        say: 'Cost of goods sold equals opening stock plus purchases minus closing stock.'
        write: '$\text{COGS} = \text{Opening stock} + \text{Purchases} - \text{Closing stock}$'
      - say: 'That is five thousand six hundred naira plus nine thousand seven hundred naira minus four thousand four hundred naira, which is ten thousand nine hundred naira.'
        write: '₦5,600 + ₦9,700 − ₦4,400 = ₦10,900'
      - section: 'Average stock'
        say: 'Average stock is opening stock plus closing stock, divided by two.'
        write: '$\text{Average stock} = \dfrac{5{,}600 + 4{,}400}{2}$'
      - say: 'That is ten thousand naira divided by two, which is five thousand naira.'
        write: '= ₦10,000 ÷ 2 = ₦5,000'
      - section: 'Divide'
        say: 'Now divide ten thousand nine hundred naira by five thousand naira.'
        write: '$\dfrac{10{,}900}{5{,}000} = 2.18$'
      - section: 'Check'
        say: 'Sales of fifteen thousand naira minus ten thousand nine hundred naira gives four thousand one hundred naira, which is the gross profit given. So our cost of goods sold is right.'
        write: '₦15,000 − ₦10,900 = ₦4,100 = gross profit ✓'
      - section: 'In Nigeria'
        say: 'A provisions dealer in Mile Twelve market with this figure sells his average stock about twice in the period.'
        write: 'Stock sold about twice'
      - section: 'Remember'
        say: 'Remember, cost of sales over average stock, both at cost price.'
        write: 'Both figures at cost price'
      - section: 'Answer'
        say: 'So the rate of turnover is two point one eight times, which is option A.'
        write: '$\therefore$ 2.18 times'
        answer: true
    traps:
      B: 'You chose three point five times. That does not come from the formula. Cost of goods sold over average stock gives two point one eight.'
      C: 'You went for three times. That divides sales by average stock, which mixes selling price with cost price.'
      D: 'You picked two times. That uses ten thousand naira as the cost of goods sold, but it is ten thousand nine hundred naira.'
