# UTME 2016 Commerce, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Nigerian Commerce teacher works on the
# board: the question, the term named, its definition or rule, how it works in a real
# transaction (or the calculation with data, formula, working and check), a Nigerian example, a
# way to remember it, and the answer moment that names the option.
#
#   say:     heard, not read. Abbreviations as letters ("N I P O S T"), money in words,
#            percentages as "per cent", no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2016.yaml. Answers match that file. This paper
# has no paper-type question, so all 40 questions have a lesson.
format_version: 1
exam_year: 2016
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'A business can end because its owners want it to, or because it is forced to. Who does the forcing? Let us find out.'
        write: 'Compulsory dissolution can arise from ?'
      - section: 'Name it'
        say: 'This is compulsory dissolution, one of the two ways a business is brought to an end.'
        write: 'Dissolution = voluntary or compulsory'
      - section: 'The rule'
        say: 'Voluntary dissolution is when the owners decide to end the business. Compulsory dissolution is when the law forces it to end, by an order of a court.'
        write: 'Compulsory dissolution = by order of a court'
      - section: 'How it works'
        say: 'A creditor who is owed money, or an unhappy partner, petitions the court, which means he asks the court in writing to end the business. If the court finds the business cannot pay its debts, it declares it dissolved.'
        write: 'Creditor petitions ⇒ court declares ⇒ business dissolved'
      - say: 'A liquidator then sells the assets and pays the creditors from the money.'
        write: 'Liquidator sells assets, pays creditors'
      - section: 'In Nigeria'
        say: 'If a Lagos company owes its suppliers fifty million naira and cannot pay, they can ask the Federal High Court to wind it up. The court order, not the owners, ends the company.'
        write: '₦50 million unpaid ⇒ Federal High Court winds it up'
      - section: 'Remember'
        say: 'Remember, compulsory means the court compels it, and voluntary means the owners volunteer it.'
        write: 'Compulsory = court compels.  Voluntary = owners volunteer.'
      - section: 'Answer'
        say: 'So compulsory dissolution arises from a declaration by a court, which is option A.'
        write: '$\therefore$ a declaration by a court'
        answer: true
    traps:
      B: 'You chose an agreement by the owners. When the owners agree to end the business, that is voluntary dissolution, not compulsory.'
      C: 'You went for an unfavourable economic climate. Hard times can make a business fail, but a court order is still what makes the ending compulsory.'
      D: 'You picked the end of the period fixed for its life. That ending was agreed by the owners from the start, so it is voluntary.'
  2:
    moments:
      - section: 'The question'
        say: 'Some invoices are sent before anything is sold. When does a seller not need one? Let us find out.'
        write: 'A pro-forma invoice is not required when ?'
      - section: 'Name it'
        say: 'This is the pro-forma invoice, a document in buying and selling.'
        write: 'Pro-forma invoice'
      - section: 'The rule'
        say: 'A pro-forma invoice looks like an invoice, but it is sent before a sale. It shows what the goods would cost, and it does not ask the buyer to settle a debt.'
        write: 'Pro-forma invoice = invoice sent before the sale'
      - section: 'How it works'
        say: 'A seller sends a pro-forma invoice in three cases. First, as a formal quotation, to tell a buyer the price before he orders.'
        write: '1. As a formal quotation'
      - say: 'Second, when goods are sent on approval, because they are not yet sold, so an ordinary invoice cannot be sent.'
        write: '2. Goods sent on approval'
      - say: 'Third, when the buyer must pay before the goods are sent, because he needs to know how much to pay.'
        write: '3. Payment before delivery'
      - say: 'But with a regular customer the price and terms are already agreed, so the seller just sends the goods with an ordinary invoice.'
        write: 'Regular customer ⇒ ordinary invoice, no pro-forma'
      - section: 'In Nigeria'
        say: 'A Balogun trader who buys from the same wholesaler every week gets an ordinary invoice with each delivery. No pro-forma is needed.'
        write: 'Weekly buyer at Balogun ⇒ ordinary invoice'
      - section: 'Remember'
        say: 'Remember, pro-forma means for the sake of form. It is a paper sent before the real deal.'
        write: 'Pro-forma = before the real deal'
      - section: 'Answer'
        say: 'So a pro-forma invoice is not required when dealing regularly with a customer, which is option D.'
        write: '$\therefore$ dealing regularly with a customer'
        answer: true
    traps:
      A: 'You went for goods sent on approval. Those goods are not yet sold, so they go with a pro-forma invoice.'
      B: 'You chose quoting for the supply of goods. A pro-forma invoice is often used as a formal quotation, so it is needed there.'
      C: 'You picked payment before delivery. The pro-forma invoice is exactly what tells the buyer how much to pay first.'
  3:
    moments:
      - section: 'The question'
        say: 'Four figures are given, and one of them is not needed at all. Can you spot which one before we start?'
        write: 'Opening stock ₦40,000, purchases ₦115,000, closing stock ₦60,000, sales ₦250,000'
      - section: 'Name it'
        say: 'We want the cost of goods sold, which is the cost of the stock the trader actually sold.'
        write: 'Cost of goods sold = ?'
      - section: 'The rule'
        say: 'Cost of goods sold equals opening stock plus purchases minus closing stock. Sales are not used here, because sales are counted at selling price, and we want the cost.'
        write: '$\text{Cost of goods sold} = \text{Opening stock} + \text{Purchases} - \text{Closing stock}$'
      - section: 'Goods available'
        say: 'First add opening stock and purchases. Forty thousand naira plus one hundred and fifteen thousand naira is one hundred and fifty five thousand naira.'
        write: '₦40,000 + ₦115,000 = ₦155,000'
      - say: 'That is everything the trader had to sell during the period.'
        write: 'Goods available for sale = ₦155,000'
      - section: 'Take away what is left'
        say: 'Now take away the closing stock, which is still on the shelf. One hundred and fifty five thousand naira minus sixty thousand naira is ninety five thousand naira.'
        write: '₦155,000 − ₦60,000 = ₦95,000'
      - section: 'Check'
        say: 'Gross profit would be two hundred and fifty thousand naira minus ninety five thousand naira, which is one hundred and fifty five thousand naira. That is a sensible profit, so our figure holds.'
        write: '₦250,000 − ₦95,000 = ₦155,000 gross profit ✓'
      - section: 'In Nigeria'
        say: 'An Onitsha provisions dealer who starts with forty thousand naira of goods, buys more, and ends with sixty thousand naira left, has sold goods that cost her ninety five thousand naira.'
        write: 'Had + bought − left = sold'
      - section: 'Remember'
        say: 'Remember, what you had, plus what you bought, minus what is left, is what you sold.'
        write: 'Had + bought − left'
      - section: 'Answer'
        say: 'So the cost of goods sold is ninety five thousand naira, which is option C.'
        write: '$\therefore$ Cost of goods sold $=$ ₦95,000'
        answer: true
    traps:
      A: 'You went for fifty thousand naira. That is too small. Forty thousand plus one hundred and fifteen thousand, minus sixty thousand, gives ninety five thousand naira.'
      B: 'You chose thirty thousand naira. That is far too small. The goods sold cost ninety five thousand naira.'
      D: 'You picked one hundred and fifty five thousand naira. That is the goods available for sale. You still have to take away the closing stock.'
  4:
    moments:
      - section: 'The question'
        say: 'Goods travel from the factory to your hands. Who stands in the middle? Let us pick out the set that is all middlemen.'
        write: 'Which set is entirely middlemen?'
      - section: 'Name it'
        say: 'This is the channel of distribution, the route goods take from the producer to the consumer.'
        write: 'Producer ⟶ middlemen ⟶ consumer'
      - section: 'The rule'
        say: 'Middlemen are the traders and agents who stand between the producer and the consumer. They are wholesalers, retailers and agents.'
        write: 'Middlemen = wholesalers, retailers, agents'
      - section: 'How it works'
        say: 'The manufacturer starts the chain and the consumer ends it, so neither of them is a middleman.'
        write: 'Manufacturer = start.  Consumer = end.'
      - say: 'So a set made up entirely of middlemen must leave out both the manufacturer and the consumer.'
        write: 'Leave out both ends'
      - section: 'In Nigeria'
        say: 'Cartons of noodles leave the factory, pass through an agent and a wholesaler at Idumota, and reach a shop in Surulere before a student buys them.'
        write: 'Factory ⟶ agent ⟶ Idumota wholesaler ⟶ Surulere shop ⟶ student'
      - section: 'Remember'
        say: 'Remember, middlemen are in the middle, never at the two ends.'
        write: 'Middlemen = the middle, not the ends'
      - section: 'Answer'
        say: 'So the set made up entirely of middlemen is wholesalers, retailers and agents, which is option B.'
        write: '$\therefore$ wholesalers, retailers and agents'
        answer: true
    traps:
      A: 'You chose manufacturers, consumers and retailers. Manufacturers start the chain and consumers end it, so only retailers are middlemen.'
      C: 'You went for retailers, manufacturers and wholesalers. Manufacturers are producers at the start, not middlemen.'
      D: 'You picked wholesalers, agents and consumers. The consumer is the last link, where the goods come to rest, not a middleman.'
  5:
    moments:
      - section: 'The question'
        say: 'SONU Enterprises has a balance sheet full of figures. Can it pay its short term debts? The current ratio tells us.'
        write: 'SONU Enterprises, current ratio $= ?$'
      - section: 'Name it'
        say: 'This is the current ratio, also called the working capital ratio.'
        write: 'Current ratio (working capital ratio)'
      - section: 'The rule'
        say: 'Current ratio equals current assets divided by current liabilities.'
        write: '$\text{Current ratio} = \dfrac{\text{Current assets}}{\text{Current liabilities}}$'
      - section: 'Current assets'
        say: 'Current assets are things the business owns that will turn into cash within a year. On this balance sheet they are stock, debtors, bank and cash.'
        write: 'Current assets = stock, debtors, bank, cash'
      - say: 'Plant and machinery and the motor van are fixed assets, kept for years to run the business, so we leave them out.'
        write: 'Plant, motor van = fixed assets, left out'
      - say: 'Now we add the current assets. One thousand two hundred and fifty, plus four hundred and eighty, plus three thousand, plus twenty, gives four thousand seven hundred and fifty naira.'
        write: '$1{,}250 + 480 + 3{,}000 + 20 = 4{,}750$'
      - section: 'Current liabilities'
        say: 'Current liabilities are debts the business must pay within a year. Here they are creditors, the suppliers it owes, and accruals, which are expenses already owed but not yet paid.'
        write: 'Current liabilities = creditors + accruals'
      - say: 'Capital, net profit and drawings are not debts to outsiders. They belong to the owner, so we leave them out.'
        write: 'Capital, profit, drawings = owner''s, left out'
      - say: 'Now we add the current liabilities. One thousand plus one hundred and eighty seven naira fifty kobo gives one thousand one hundred and eighty seven naira fifty kobo.'
        write: '$1{,}000 + 187.50 = 1{,}187.50$'
      - section: 'Divide'
        say: 'Now we use the rule and divide current assets by current liabilities, four thousand seven hundred and fifty by one thousand one hundred and eighty seven point five. The answer is exactly four.'
        write: '$\dfrac{4{,}750}{1{,}187.50} = 4$'
      - section: 'Check'
        say: 'One thousand one hundred and eighty seven point five times four is four thousand seven hundred and fifty. So the ratio is four to one.'
        write: '$1{,}187.50 \times 4 = 4{,}750$ ✓'
      - section: 'In Nigeria'
        say: 'So SONU has four naira of current assets for every one naira it owes in the short term. Its suppliers in the market can rest easy.'
        write: '₦4 of current assets for every ₦1 owed'
      - section: 'Remember'
        say: 'Remember, current over current, and a ratio of about two to one is the usual guide.'
        write: 'Current over current'
      - section: 'Answer'
        say: 'So the current ratio is four to one, which is option C.'
        write: '$\therefore$ Current ratio $= 4:1$'
        answer: true
    traps:
      A: 'You went for five to one. That would need current liabilities of only nine hundred and fifty naira. Creditors and accruals together are one thousand one hundred and eighty seven naira fifty kobo.'
      B: 'You chose twenty five point five to one. That is far too large, and it does not come from current assets over current liabilities.'
      D: 'You picked four point five to one. That leaves the accruals out. Accrued expenses are bills already owed, so they count as current liabilities.'
  6:
    moments:
      - section: 'The question'
        say: 'SONU Enterprises has plenty of current assets. But what if its stock will not sell quickly? The acid test asks exactly that.'
        write: 'SONU Enterprises, acid-test ratio $= ?$'
      - section: 'Name it'
        say: 'This is the acid test ratio, also called the quick ratio.'
        write: 'Acid-test ratio (quick ratio)'
      - section: 'The rule'
        say: 'Acid test ratio equals current assets minus stock, divided by current liabilities. Stock is taken out because it may take time to sell.'
        write: '$\text{Acid-test ratio} = \dfrac{\text{Current assets} - \text{Stock}}{\text{Current liabilities}}$'
      - section: 'Quick assets'
        say: 'First we need the current assets, the things that will turn into cash within a year. They are stock, debtors, bank and cash, so one thousand two hundred and fifty, plus four hundred and eighty, plus three thousand, plus twenty, gives four thousand seven hundred and fifty naira.'
        write: '$1{,}250 + 480 + 3{,}000 + 20 = 4{,}750$'
      - say: 'Now take away the stock of one thousand two hundred and fifty naira.'
        write: '$4{,}750 - 1{,}250$'
      - say: 'That leaves three thousand five hundred naira of quick assets, which is debtors, bank and cash.'
        write: '$= 3{,}500$ (debtors + bank + cash)'
      - section: 'Current liabilities'
        say: 'Current liabilities are the debts due within a year. Here they are creditors and accruals, which are expenses owed but not yet paid. One thousand plus one hundred and eighty seven naira fifty kobo gives one thousand one hundred and eighty seven naira fifty kobo.'
        write: '$1{,}000 + 187.50 = 1{,}187.50$'
      - section: 'Divide'
        say: 'Now we divide the quick assets by the current liabilities. Three thousand five hundred divided by one thousand one hundred and eighty seven point five is two point nine four seven.'
        write: '$\dfrac{3{,}500}{1{,}187.50} = 2.947\ldots$'
      - say: 'The options give two decimal places. The third decimal is seven, which is five or more, so the four rounds up to five, and we get two point nine five.'
        write: '$2.947\ldots \approx 2.95$'
      - section: 'Check'
        say: 'With the stock left in, the current ratio is four thousand seven hundred and fifty over one thousand one hundred and eighty seven point five, which is four. Taking stock out must make the ratio smaller than four. Two point nine five is smaller, so it makes sense.'
        write: '$2.95 < 4$ ✓'
      - section: 'In Nigeria'
        say: 'A Balogun fabric seller may have a store full of lace, but if a supplier wants payment tomorrow, only her cash, bank money and debtors can pay quickly.'
        write: 'Lace in the store cannot pay tomorrow''s bill'
      - section: 'Remember'
        say: 'Remember, the acid test burns off the stock.'
        write: 'Acid test = no stock'
      - section: 'Answer'
        say: 'So the acid test ratio is two point nine five to one, which is option D.'
        write: '$\therefore$ Acid-test ratio $= 2.95:1$'
        answer: true
    traps:
      A: 'You went for five point five five to one. That is bigger than the current ratio, and a ratio with stock removed can never be bigger.'
      B: 'You chose four point seven five to one. That keeps the stock in and leaves the accruals out. Take stock away first, and count both liabilities.'
      C: 'You picked four point two five to one. That is still bigger than the current ratio. Removing stock must give a smaller figure.'
  7:
    moments:
      - section: 'The question'
        say: 'Raw cotton cannot be worn. A shirt can. What has the factory added? Let us name it.'
        write: 'Raw materials ⟶ finished products creates ?'
      - section: 'Name it'
        say: 'This is form utility, one of the kinds of utility that production creates.'
        write: 'Form utility'
      - section: 'The rule'
        say: 'Utility is the power of a good to satisfy a want. Form utility is added when raw materials are changed into a shape people can use.'
        write: 'Change of form ⇒ form utility'
      - section: 'How it works'
        say: 'Cotton is spun, woven and sewn, and it becomes a shirt. Changing its form has made it useful.'
        write: 'Cotton ⟶ thread ⟶ cloth ⟶ shirt'
      - say: 'Other kinds of utility come from other work. For example, moving goods to where they are wanted adds place utility.'
        write: 'Move ⇒ place utility'
      - say: 'And storing goods until they are needed adds time utility. Only changing their form adds form utility.'
        write: 'Store ⇒ time utility'
      - section: 'In Nigeria'
        say: 'In a Kano tannery, raw hides are turned into leather. That change of form creates form utility.'
        write: 'Hides ⟶ leather in Kano'
      - section: 'Remember'
        say: 'Remember, change the form, create form utility.'
        write: 'Change the form ⇒ form utility'
      - section: 'Answer'
        say: 'So turning raw materials into finished products creates form utility, which is option A.'
        write: '$\therefore$ form utility'
        answer: true
    traps:
      B: 'You chose marginal utility. That is the extra satisfaction from one more unit consumed, not something a factory creates.'
      C: 'You went for time utility. That comes from storing goods until they are needed.'
      D: 'You picked place utility. That comes from moving goods to where they are wanted, not from changing what they are.'
  8:
    moments:
      - section: 'The question'
        say: 'Imagine a world where every family grows, makes and builds everything for itself. Now imagine a world with banks, ports and markets. Which one does commerce give us?'
        write: 'Commerce makes it possible for man to live in a ?'
      - section: 'Name it'
        say: 'This is one of the functions of commerce, what it makes possible for society.'
        write: 'Functions of commerce'
      - section: 'The rule'
        say: 'Commerce is trade and the aids to trade, such as banking, transport and insurance. Because of it people can specialize, which means each person does one kind of work, and still get everything else they need.'
        write: 'Commerce = trade + aids to trade'
      - section: 'How it works'
        say: 'Without commerce each family must provide everything for itself, which is a simple life.'
        write: 'No commerce ⇒ simple, self-sufficient life'
      - say: 'With commerce millions of specialists are linked by buying and selling, so a large, complex and well organized society can work.'
        write: 'Commerce ⇒ complex, organized society'
      - section: 'In Nigeria'
        say: 'A banker in Victoria Island eats rice grown in Kebbi and wears cloth woven in Aba, all because commerce links them.'
        write: 'Rice from Kebbi, cloth from Aba, banker in Lagos'
      - section: 'Remember'
        say: 'Remember, commerce turns many separate specialists into one organized society.'
        write: 'Many specialists ⟶ one organized society'
      - section: 'Answer'
        say: 'So commerce makes it possible for man to live in a complex and organized society, which is option A.'
        write: '$\therefore$ a complex and organized society'
        answer: true
    traps:
      B: 'You chose a simple and organized society. A simple society, where families meet their own needs, is what came before commerce.'
      C: 'You went for subsistence. Subsistence means producing only for your own needs, and commerce moves people away from that.'
      D: 'You picked self-sufficiency. That is the opposite of what commerce brings. Commerce makes people rely on one another.'
  9:
    moments:
      - section: 'The question'
        say: 'Before an insurer accepts a risk, it must know the whole truth about it. Which principle demands that?'
        write: 'Principle of full disclosure of all material facts = ?'
      - section: 'Name it'
        say: 'This is uberrimae fidei, which means utmost good faith.'
        write: 'Uberrimae fidei = utmost good faith'
      - section: 'The rule'
        say: 'The insured must disclose every material fact that could affect the insurer''s decision to accept the risk or fix the premium.'
        write: 'Disclose every material fact'
      - section: 'How it works'
        say: 'The insured knows the risk better than the insurer, so the insurer relies on the proposal form, the form the insured fills in when he asks for cover.'
        write: 'Insurer relies on the proposal form'
      - say: 'If a material fact is hidden, the insurer can refuse to pay a claim and treat the policy as void.'
        write: 'Fact hidden ⇒ claim refused, policy void'
      - section: 'In Nigeria'
        say: 'A Port Harcourt man who insures his life but hides two heart attacks breaks utmost good faith, and his family may lose the claim.'
        write: 'Hidden heart attacks ⇒ claim lost'
      - section: 'Remember'
        say: 'Remember, uberrimae fidei means utmost faith, so tell the whole truth.'
        write: 'Utmost faith = the whole truth'
      - section: 'Answer'
        say: 'So the principle of full disclosure is uberrimae fidei, which is option C.'
        write: '$\therefore$ uberrimae fidei'
        answer: true
    traps:
      A: 'You went for caveat emptor. That means let the buyer beware, the rule of ordinary sales. Insurance runs on full disclosure instead.'
      B: 'You chose subrogation. That gives the insurer the insured''s rights against a third party after it has paid a claim.'
      D: 'You picked indemnity. That puts the insured back where he was before the loss, no better.'
  10:
    moments:
      - section: 'The question'
        say: 'Is a bag of garri fully produced when it leaves the village, or only when it reaches your kitchen? That is the question here.'
        write: 'Production involves ?'
      - section: 'Name it'
        say: 'This is the meaning of production in Commerce.'
        write: 'Production'
      - section: 'The rule'
        say: 'Production is the creation of goods and services to satisfy human wants. It is not complete until the goods reach the final consumer.'
        write: 'Production complete only at the consumer'
      - section: 'How it works'
        say: 'So production has two parts. First, changing the form of goods, which is industry.'
        write: '1. Change the form (industry)'
      - say: 'Second, making the goods available where and when they are needed, which is commerce and services.'
        write: '2. Make available where and when needed (commerce)'
      - section: 'In Nigeria'
        say: 'Garri processed in an Ogun village is only half produced until a trader carries it to a Lagos market and a buyer takes it home.'
        write: 'Ogun village ⟶ Lagos market ⟶ home'
      - section: 'Remember'
        say: 'Remember, production ends in the consumer''s hand, not at the factory gate.'
        write: 'Ends in the consumer''s hand'
      - section: 'Answer'
        say: 'So production involves changing the form of goods and making them available where and when they are needed, which is option A.'
        write: '$\therefore$ change the form and make available'
        answer: true
    traps:
      B: 'You chose making goods available. That is only the commercial part. Production also changes the form of goods.'
      C: 'You went for assembling parts. That is only one stage of manufacturing, not the whole of production.'
      D: 'You picked manufacturing of goods only. That stops production at the factory and leaves out distribution and services.'
  11:
    moments:
      - section: 'The question'
        say: 'Some middlemen own the goods they sell. Others only sell for somebody else. Which one is the merchant wholesaler?'
        write: 'Buys, owns and resells on his own account = ?'
      - section: 'Name it'
        say: 'This is the merchant wholesaler, the most common kind of wholesaler.'
        write: 'Merchant wholesaler'
      - section: 'The rule'
        say: 'A merchant wholesaler buys goods with his own money, takes ownership of them, stores them and resells them at a profit.'
        write: 'Buys ⟶ owns ⟶ stores ⟶ resells'
      - section: 'How it works'
        say: 'Because he owns the goods, he bears the risk if they do not sell, and he keeps the profit if they do.'
        write: 'Owner bears the risk, keeps the profit'
      - say: 'A factor, a broker and a del credere agent are different. They sell for a principal, the owner of the goods, and earn a commission, but they never own the goods.'
        write: 'Factor, broker, del credere agent = agents, earn commission'
      - section: 'In Nigeria'
        say: 'A trader at Onitsha Main Market who buys a trailer load of tinned milk from the makers, stores it and sells cartons to retailers is a merchant wholesaler.'
        write: 'Onitsha trader buys a trailer load, sells cartons'
      - section: 'Remember'
        say: 'Remember, the merchant owns the goods, and the agent only sells them for someone else.'
        write: 'Merchant owns.  Agent sells for others.'
      - section: 'Answer'
        say: 'So a wholesaler who buys, owns and resells goods on his own account is a merchant wholesaler, which is option B.'
        write: '$\therefore$ a merchant wholesaler'
        answer: true
    traps:
      A: 'You chose a factor. A factor holds and sells goods in his own name, but for a principal. The goods are not his.'
      C: 'You went for a broker. A broker only brings buyer and seller together for a commission. He never owns the goods.'
      D: 'You picked a del credere agent. He guarantees that his buyers will pay, but he is still an agent who never owns the goods.'
  12:
    moments:
      - section: 'The question'
        say: 'A buyer wants to pay before the goods are sent. What does he need to know first? The pro-forma invoice tells him.'
        write: 'A pro-forma invoice informs the buyer about the ?'
      - section: 'Name it'
        say: 'This is the pro-forma invoice.'
        write: 'Pro-forma invoice'
      - section: 'The rule'
        say: 'A pro-forma invoice is an advance invoice that tells a buyer what the goods will cost before they are sent or sold.'
        write: 'Pro-forma invoice = what the goods will cost'
      - section: 'How it works'
        say: 'It sets out the price of each item, with discounts and charges, so the buyer knows how much to pay.'
        write: 'Price of each item, discounts, charges'
      - say: 'It works like a formal quotation, and banks use it to arrange payment for imports.'
        write: 'Like a formal quotation'
      - section: 'In Nigeria'
        say: 'An importer in Apapa takes a pro-forma invoice from his supplier abroad to his bank, which uses the prices on it to open a letter of credit.'
        write: 'Apapa importer ⟶ bank ⟶ letter of credit'
      - section: 'Remember'
        say: 'Remember, the pro-forma says this is what it will cost.'
        write: 'Pro-forma = this is what it will cost'
      - section: 'Answer'
        say: 'So a pro-forma invoice informs the buyer about the prices of goods, which is option A.'
        write: '$\therefore$ prices of goods'
        answer: true
    traps:
      B: 'You chose quantity of goods. Quantities are listed, but the purpose of the pro-forma is to state the price.'
      C: 'You went for quality of goods. Quality is shown by samples or specifications, not by a pro-forma invoice.'
      D: 'You picked designation of goods. The description appears on many documents, but the pro-forma is sent to state the price.'
  13:
    moments:
      - section: 'The question'
        say: 'Is capital the money in your bank, or the oven in your bakery? Commerce has a clear answer.'
        write: 'Capital as a factor of production refers to ?'
      - section: 'Name it'
