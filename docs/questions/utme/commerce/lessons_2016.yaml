  33:
    moments:
      - section: 'The question'
        say: 'Pay within nine days and get three per cent off. How does a seller write that on an invoice? The order of the numbers is the whole trick.'
        write: '3% off if paid within 9 days, written as ?'
      - section: 'Name it'
        say: 'This is a cash discount, one of the terms of trade.'
        write: 'Cash discount'
      - section: 'The rule'
        say: 'A cash discount is an amount taken off the invoice price to make the buyer pay quickly.'
        write: 'Cash discount = reward for paying quickly'
      - say: 'It is written as the discount, over the days, then the word net and the credit period.'
        write: 'Discount / days, net credit period'
      - say: 'Net means the full amount, with no discount. So net thirty means the full amount must be paid within thirty days.'
        write: 'Net 30 = full amount within 30 days'
      - section: 'Fill it in'
        say: 'The discount is three per cent and the days are nine, so the first part is three over nine.'
        write: '3/9'
      - say: 'If the buyer pays later, the full amount is due within the normal credit period, usually thirty days, which is the period the options use. So we add net thirty.'
        write: '3/9, net 30'
      - section: 'In Nigeria'
        say: 'A wholesaler in Aba invoices a retailer for two hundred thousand naira on terms three over nine, net thirty. If she pays within nine days, she takes off three per cent, which is six thousand naira, so she pays one hundred and ninety four thousand naira.'
        write: '₦200,000 − 3% = ₦194,000 within 9 days'
      - section: 'Remember'
        say: 'Remember, per cent first, days second, then net and the full credit period.'
        write: 'Per cent / days, net period'
      - section: 'Answer'
        say: 'So three per cent off within nine days is written three over nine, net thirty, which is option D.'
        write: '$\therefore$ 3/9, net 30'
        answer: true
    traps:
      A: 'You chose thirty, net nine over three. That mixes the parts up. The discount and its days must come first.'
      B: 'You went for nine over thirty, net three. That puts the days first and the discount last, the wrong way round.'
      C: 'You picked nine over twenty seven, net thirty. That puts the days first and shows no three per cent discount at all.'
