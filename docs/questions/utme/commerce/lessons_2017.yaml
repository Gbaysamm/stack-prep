        say: 'This is uberrimae fidei, the principle of utmost good faith.'
        write: 'Uberrimae fidei = utmost good faith'
      - section: 'The rule'
        say: 'Both parties must tell the whole truth and disclose every material fact when the contract is made. A material fact is any fact that would change the insurer''s decision to accept the risk, or the premium it charges, and the value of the property is one of them.'
        write: 'Disclose all material facts truthfully'
      - section: 'How it works'
        say: 'The insurer fixes the premium from what the form says. False information lets the insurer refuse the claim or cancel the policy.'
        write: 'False statement ⇒ claim refused, policy void'
      - section: 'In Nigeria'
        say: 'A trader in Aba who writes that his shop is worth far more than it really is has broken utmost good faith.'
        write: 'Value inflated on form ⇒ bad faith'
      - section: 'Remember'
        say: 'Remember, uberrimae fidei means tell the truth, the whole truth.'
        write: 'Tell the whole truth'
      - section: 'Answer'
        say: 'So Mr R has broken uberrimae fidei, which is option A.'
        write: '$\therefore$ uberrimae fidei'
        answer: true
    traps:
      B: 'You picked subrogation. That is the insurer''s right after paying a claim, not a duty of the insured.'
      C: 'You went for indemnity. Indemnity is about how much is paid after a loss. A false statement on the form breaks the duty of truth.'
      D: 'You chose insurable interest. Mr R owns the property, so he has insurable interest. That principle is not broken.'
