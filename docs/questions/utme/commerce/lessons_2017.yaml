  35:
    moments:
      - section: 'The question'
        say: 'Mr N lost thirty thousand naira in a fire. Will the insurer pay all of it? The average clause says no. Let us see why.'
        write: 'Mr N: sum insured ₦25,000, value ₦100,000, loss ₦30,000. Compensation = ?'
      - section: 'Name it'
        say: 'This is the average clause, which deals with under insurance. Under insurance means insuring property for less than it is worth.'
        write: 'Average clause ⇒ under-insurance'
      - section: 'The rule'
        say: 'If property is insured for less than its value, the insured gets only that share of his loss. So compensation is the sum insured over the actual value, multiplied by the actual loss.'
        write: '$\text{Compensation} = \dfrac{\text{Sum insured}}{\text{Actual value}} \times \text{Actual loss}$'
      - section: 'The working'
        say: 'We are given the sum insured, twenty five thousand naira, the actual value, one hundred thousand naira, and the loss, thirty thousand naira. We put them into the formula.'
        write: '$= \dfrac{25{,}000}{100{,}000} \times 30{,}000$'
      - say: 'Twenty five thousand over one hundred thousand is one quarter.'
        write: '$= \dfrac{1}{4} \times 30{,}000$'
      - say: 'One quarter of thirty thousand naira is seven thousand, five hundred naira.'
        write: '$= 7{,}500$, so ₦7,500'
      - section: 'Check'
        say: 'He insured a quarter of the value, so he gets a quarter of the loss. That fits.'
        write: 'Quarter insured ⇒ quarter of loss paid'
      - section: 'In Nigeria'
        say: 'A shop owner in Onitsha who insures one hundred thousand naira of stock for only twenty five thousand naira gets a quarter of any fire loss.'
        write: 'Insure a part ⇒ paid a part'
      - section: 'Remember'
        say: 'Remember, insure a part, get paid a part.'
        write: 'Part insured, part paid'
      - section: 'Answer'
        say: 'So Mr N''s compensation is seven thousand, five hundred naira, which is option D.'
        write: '$\therefore$ compensation $=$ ₦7,500'
        answer: true
    traps:
      A: 'You chose seventy thousand naira. That is the value minus the loss, not his compensation.'
      B: 'You went for seventy five thousand naira. That is the uninsured part of the value, not what he is paid.'
      C: 'You picked five thousand naira. That is the loss minus the sum insured. The average clause pays a share of the loss, not the gap between two figures.'
  36:
    moments:
