# UTME 2017 Commerce, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Nigerian Commerce teacher works on the
# board: the question, the term named, its definition or rule, how it works in a real
# transaction (or the calculation with data, formula, working and check), a Nigerian example, a
# way to remember it, and the answer moment that names the option.
#
#   say:     heard, not read. Abbreviations as letters ("O P E C"), money in words, percentages
#            as "per cent", no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2017.yaml. Answers match that file. This paper
# has no paper-type question, so all 40 questions have a lesson.
format_version: 1
exam_year: 2017
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'Nigeria sells oil and buys machines. At what rate do our exports swap for our imports? That rate has a name.'
        write: 'Rate at which exports exchange for imports = ?'
      - section: 'Name it'
        say: 'This is the terms of trade, a measure used in foreign trade.'
        write: 'Terms of trade'
      - section: 'The rule'
        say: 'The terms of trade compares the prices of a country''s exports with the prices of its imports. A price index is a number that shows how prices have changed since a base year, so we divide the index of export prices by the index of import prices, and multiply by one hundred.'
        write: '$\text{Terms of trade} = \dfrac{\text{Index of export prices}}{\text{Index of import prices}} \times 100$'
      - section: 'How it works'
        say: 'If export prices rise faster than import prices, each unit of exports buys more imports. The terms of trade improve.'
        write: 'Export prices up ⇒ terms of trade improve'
      - say: 'If export prices fall, the same exports buy fewer imports. The terms of trade worsen.'
        write: 'Export prices down ⇒ terms of trade worsen'
      - section: 'In Nigeria'
        say: 'When the price of crude oil falls, each barrel Nigeria sells buys fewer imported cars and machines. Our terms of trade worsen.'
        write: 'Oil price falls ⇒ fewer imports per barrel'
      - section: 'Remember'
        say: 'Remember, terms of trade is a rate of prices. Balance of trade is an amount of money.'
        write: 'Terms = rate; balance = amount'
      - section: 'Answer'
        say: 'So the rate at which exports exchange for imports is the terms of trade, which is option B.'
        write: '$\therefore$ terms of trade'
        answer: true
    traps:
      A: 'You chose terms of payment. Those are the conditions on which a buyer pays, such as cash or credit.'
      C: 'You went for balance of payments. That is the full record of all dealings with other countries, not a rate of exchange.'
      D: 'You picked balance of trade. That is the gap between the values of visible exports and imports, an amount in naira, not a rate.'
  2:
    moments:
      - section: 'The question'
        say: 'You drop coins into a machine and a cold drink rolls out. What kind of trade is that?'
        write: 'Coin-operated machines selling goods are a form of ?'
      - section: 'Name it'
        say: 'This is automatic vending, selling goods through coin operated machines.'
        write: 'Automatic vending'
      - section: 'The rule'
        say: 'Retailing is selling goods in small quantities to the final consumer.'
        write: 'Retailing = small quantities to the final consumer'
      - section: 'How it works'
        say: 'The customer puts in money and presses a button, and the machine releases one item.'
        write: 'Money in ⇒ one item out'
      - say: 'The machine does the work of a shop attendant, so it is a modern form of retail trade.'
        write: 'Machine replaces the shop attendant'
      - section: 'In Nigeria'
        say: 'Vending machines selling soft drinks and snacks stand in some Lagos offices, airports and hospitals.'
        write: 'Drinks machine at the airport'
      - section: 'Remember'
        say: 'Remember, one item to the final user means retail.'
        write: 'One item, final user ⇒ retail'
      - section: 'Answer'
        say: 'So selling through coin operated machines is a form of retailing, which is option C.'
        write: '$\therefore$ retailing'
        answer: true
    traps:
      A: 'You went for mail order selling. That uses catalogues and the post, not coin machines.'
      B: 'You chose personal selling. That needs a salesperson face to face with the buyer.'
      D: 'You picked wholesaling. That is selling in bulk to retailers, not single items to consumers.'
  3:
    moments:
      - section: 'The question'
        say: 'Seawater spoils half of a cargo. Which marine policy still pays for that half? It is the one with the fullest cover.'
        write: 'Marine policy covering total and partial loss = ?'
      - section: 'Name it'
        say: 'This is the policy with particular average, called W P A.'
        write: 'With particular average (WPA)'
      - section: 'The rule'
        say: 'In marine insurance, a particular average is a partial loss.'
        write: 'Particular average = partial loss'
      - say: 'A policy with particular average pays for partial loss as well as total loss, so it gives the fullest cover.'
        write: 'WPA pays partial + total loss'
      - section: 'How it works'
        say: 'A policy free of particular average, F P A, pays only when the goods are totally lost.'
        write: 'FPA pays total loss only'
      - say: 'A voyage policy and a freight policy are named by what they cover, one journey or the freight charge, not by how full the cover is.'
        write: 'Voyage, freight = what is covered, not how fully'
      - section: 'In Nigeria'
        say: 'An importer bringing machine parts into Apapa takes a W P A policy. If seawater spoils half the cargo, the insurer still pays for that half.'
        write: 'Half the cargo spoilt ⇒ WPA still pays'
      - section: 'Remember'
        say: 'Remember, with particular average means with partial loss covered.'
        write: 'With PA = with partial loss covered'
      - section: 'Answer'
        say: 'So the fullest marine cover is a policy with particular average, which is option D.'
        write: '$\therefore$ policy with particular average'
        answer: true
    traps:
      A: 'You chose a voyage policy. It covers one named journey, but it says nothing about paying for partial loss.'
      B: 'You went for a freight policy. That covers the freight charge at risk, not the fullest cover on the goods.'
      C: 'You picked free of particular average. That pays only for total loss, so it gives the least cover.'
  4:
    moments:
      - section: 'The question'
        say: 'One insurer is asked to cover a whole refinery. The risk is too big for it alone. What does it do?'
        write: 'Insurer accepts a huge risk, then shares it with other insurers = ?'
      - section: 'Name it'
        say: 'This is reinsurance.'
        write: 'Reinsurance'
      - section: 'The rule'
        say: 'Reinsurance is the insurance of an insurance company.'
        write: 'Reinsurance = insurance for the insurer'
      - section: 'How it works'
        say: 'The first insurer issues the whole policy and collects the premium. Then it passes part of the risk and part of the premium to other insurers.'
        write: 'Part of risk + part of premium ⇒ other insurers'
      - say: 'If a loss happens, each pays its share, so no single company is ruined by one big claim.'
        write: 'Loss shared ⇒ no insurer ruined'
      - section: 'In Nigeria'
        say: 'A Nigerian insurer that covers a fifty billion naira refinery keeps only part of the risk and reinsures the rest at home and abroad.'
        write: '₦50 billion refinery ⇒ reinsured'
      - section: 'Remember'
        say: 'Remember, reinsurance is insurance for the insurer.'
        write: 'Insurer insures itself'
      - section: 'Answer'
        say: 'So sharing a very large risk with other insurers is called reinsurance, which is option D.'
        write: '$\therefore$ reinsurance'
        answer: true
    traps:
      A: 'You chose contribution. That is when insurers who each covered the same property share a loss. It is not one insurer passing on its own risk.'
      B: 'You went for indemnity. That is restoring the insured to where he was before the loss.'
      C: 'You picked subrogation. That is the insurer taking over the insured''s rights after paying a claim.'
  5:
    moments:
      - section: 'The question'
        say: 'No shop attendant, yet goods are sold. Which machine makes that possible?'
        write: 'Machine that sells without a sales attendant = ?'
      - section: 'Name it'
        say: 'This is the vending machine, a trend in retailing.'
        write: 'Vending machine'
      - section: 'The rule'
        say: 'A vending machine is an automatic machine that sells goods without a sales attendant.'
        write: 'Vending machine = automatic seller'
      - section: 'How it works'
        say: 'The buyer puts in coins, notes or a card and chooses an item. The machine checks the payment and releases the goods.'
        write: 'Pay ⇒ choose ⇒ goods released'
      - say: 'It sells all day and all night, with no wages to pay.'
        write: 'Sells 24 hours, no wages'
      - section: 'In Nigeria'
        say: 'A traveller at an airport in Abuja buys a bottle of water from a vending machine, with no one at the counter.'
        write: 'Water from a machine at the airport'
      - section: 'Remember'
        say: 'Remember, vend means sell. A vending machine is a selling machine.'
        write: 'Vend = sell'
      - section: 'Answer'
        say: 'So the machine that sells without an attendant is a vending machine, which is option A.'
        write: '$\therefore$ vending machine'
        answer: true
    traps:
      B: 'You chose a computer. Computers help shops keep records, but a computer alone does not take money and hand over goods.'
      C: 'You went for a fax machine. That sends copies of documents over the telephone line.'
      D: 'You picked a telex machine. That sent typed messages between offices. It sold nothing.'
  6:
    moments:
      - section: 'The question'
        say: 'Customs charges a duty on the value of the goods. So which document tells customs that value?'
        write: 'Document needed for ad valorem import duty = ?'
      - section: 'Name it'
        say: 'This is the consular invoice, a document in foreign trade.'
        write: 'Consular invoice'
      - section: 'The rule'
        say: 'Ad valorem means by value. An ad valorem duty is a percentage of the value of the goods.'
        write: 'Ad valorem duty = % of value'
      - say: 'A consular invoice is certified by the consul of the importing country. It confirms the value and origin of the goods.'
        write: 'Consul certifies value and origin'
      - section: 'The working'
        say: 'Suppose the duty is twenty per cent and the goods are worth one million naira.'
        write: 'Duty 20%, value ₦1,000,000'
      - say: 'To find the duty, we take twenty per cent of the value. Twenty per cent of one million naira is two hundred thousand naira. Customs trusts the value of one million naira because it comes from the consular invoice, which the consul has certified.'
        write: '$\dfrac{20}{100} \times 1{,}000{,}000 = 200{,}000$, so ₦200,000'
      - section: 'In Nigeria'
        say: 'An exporter abroad sending goods to Apapa gets the invoice stamped at the Nigerian consulate, so Nigeria Customs accepts the value on it.'
        write: 'Stamped at the Nigerian consulate ⇒ value accepted at Apapa'
      - section: 'Remember'
        say: 'Remember, ad valorem means by value, and the consul certifies the value.'
        write: 'By value ⇒ consul'
      - section: 'Answer'
        say: 'So ad valorem duties need a consular invoice, which is option A.'
        write: '$\therefore$ consular invoice'
        answer: true
    traps:
      B: 'You chose a bill of lading. That is the receipt and document of title for goods on a ship, not a certificate of value.'
      C: 'You went for a shipping note. That only asks the port to receive goods for loading. It certifies no value.'
      D: 'You picked a mail transfer. That is a way of sending money through a bank, not a customs document.'
  7:
    moments:
      - section: 'The question'
        say: 'Some people borrow without any land as security, only their good name. Which business lends to its own owners like that?'
        write: 'Owners get loans on personal goodwill = ?'
      - section: 'Name it'
        say: 'This is the thrift and credit society, a kind of co-operative.'
        write: 'Thrift and credit society'
      - section: 'The rule'
        say: 'In a thrift and credit society, the members are the owners. They save small sums into a common fund and borrow from it.'
        write: 'Members save ⇒ members borrow'
      - section: 'How it works'
        say: 'Members know one another, so a loan is given on the borrower''s good name and steady savings.'
        write: 'Security = good name + savings record'
      - say: 'A bank would ask for land or other collateral instead.'
        write: 'Bank ⇒ collateral'
      - section: 'In Nigeria'
        say: 'Market women in Onitsha who save every week in their society borrow to restock their stalls, with the other members as their guarantee.'
        write: 'Onitsha market women borrow from their society'
      - section: 'Remember'
        say: 'Remember, thrift means saving, credit means borrowing, and trust is the security.'
        write: 'Thrift + credit + trust'
      - section: 'Answer'
        say: 'So the business whose owners borrow on personal goodwill is a thrift and credit society, which is option D.'
        write: '$\therefore$ thrift and credit society'
        answer: true
    traps:
      A: 'You chose a community bank. It lent to customers against security, and the borrowers were not its owners. Community banks later became microfinance banks.'
      B: 'You went for a consumers'' co-operative. It sells goods to its members and shares out a dividend on purchases. It does not lend.'
      C: 'You picked a commercial bank. It lends to customers who give collateral, and its owners are shareholders.'
  8:
    moments:
      - section: 'The question'
        say: 'A public company needs money. Which of these four sources can it not count on?'
        write: 'Not a veritable source of funds to a Plc = ?'
      - section: 'Name it'
        say: 'These are the sources of finance for a public limited liability company. Veritable means real and dependable, so we want the source a public company cannot depend on.'
        write: 'Sources of finance for a Plc'
      - section: 'The rule'
        say: 'A P L C raises money from its owners, from lenders and from its own profits.'
        write: 'Owners + lenders + own profits'
      - section: 'How it works'
        say: 'It sells shares to owners, borrows from banks, and ploughs back part of its profits.'
        write: 'Shares, bank loans, retained profits'
      - say: 'Government grants are given for public purposes. A company owned by shareholders cannot count on them.'
        write: 'Government grants ⇒ not a regular source'
      - section: 'In Nigeria'
        say: 'Dangote Cement raises money by selling shares, by bank loans and by keeping back profits, not by government grants.'
        write: 'Dangote Cement Plc: shares, loans, profits'
      - section: 'Remember'
        say: 'Remember, a P L C gets money from owners, lenders and itself.'
        write: 'Owners, lenders, itself'
      - section: 'Answer'
        say: 'So the source that is not veritable is government financial grants, which is option B.'
        write: '$\therefore$ government financial grants'
        answer: true
    traps:
      A: 'You chose bank loans. Banks lend to companies all the time, so that is a real source.'
      C: 'You went for selling shares. That is the main way a public company raises capital.'
      D: 'You picked internally generated funds. Profits ploughed back are a major and cheap source of company money.'
  9:
    moments:
      - section: 'The question'
        say: 'Some companies have three letters after their name, P L C. What do they tell you about its shares?'
        write: 'Plc ⇒ shares available to ?'
      - section: 'Name it'
        say: 'This is the public limited company.'
        write: 'Plc = public limited company'
      - section: 'The rule'
        say: 'A public company may offer its shares to the general public. A private company, marked L T D, may not.'
        write: 'Plc ⇒ public may buy; Ltd ⇒ public may not'
      - section: 'How it works'
        say: 'A P L C sells new shares to anyone who applies. It invites them with a prospectus, a document that describes the shares on offer.'
        write: 'New shares by prospectus'
      - say: 'Most also list their shares on the stock exchange, so the public can buy and sell them through stockbrokers.'
        write: 'Listed ⇒ bought and sold through stockbrokers'
      - section: 'In Nigeria'
        say: 'Anyone can buy shares of Dangote Cement through a stockbroker. A family firm called Okafor and Sons Limited cannot sell shares to the public.'
        write: 'Dangote Cement Plc vs Okafor and Sons Ltd'
      - section: 'Remember'
        say: 'Remember, P for public, so the public can buy.'
        write: 'P = public'
      - section: 'Answer'
        say: 'So P L C means the shares are available to the general public, which is option A.'
        write: '$\therefore$ to the general public'
        answer: true
    traps:
      B: 'You chose only through commercial banks. Shares are bought through stockbrokers and issuing houses too.'
      C: 'You went for privately to members and friends. That is the mark of a private company, not a P L C.'
      D: 'You picked only the company''s own staff. A P L C offers shares to everyone.'
  10:
    moments:
      - section: 'The question'
        say: 'Some features of a partnership help it, some hurt it. One feature does both. Which one?'
        write: 'Both a merit and a demerit of a partnership = ?'
      - section: 'Name it'
        say: 'This is the partnership, a business owned by two to twenty people.'
        write: 'Partnership: 2 to 20 partners'
      - section: 'The rule'
        say: 'A merit is an advantage. A demerit is a disadvantage. We want the feature that is both.'
        write: 'Merit = advantage; demerit = disadvantage'
      - section: 'How it works'
        say: 'The number of partners is a merit, because more partners bring more capital, more skills and more ideas.'
        write: 'More partners ⇒ more capital and skill (merit)'
      - say: 'It is also a demerit, because the number stops at twenty, which caps the capital, and more partners mean more quarrels.'
        write: 'Limit of 20, more quarrels (demerit)'
      - section: 'In Nigeria'
        say: 'Three friends who open a pharmacy in Ibadan raise more money than one could. But they may quarrel, and they cannot take in a twenty first partner.'
        write: 'Ibadan pharmacy: more money, more arguments'
      - section: 'Remember'
        say: 'Remember, more partners bring more money and more arguments.'
        write: 'More partners, more money, more arguments'
      - section: 'Answer'
        say: 'So the feature that is both a merit and a demerit is the number of partners, which is option B.'
        write: '$\therefore$ the number of partners'
        answer: true
    traps:
      A: 'You chose pooling partners'' skills. That only helps the business, so it is a merit only.'
      C: 'You went for the withdrawal of a major partner. That only harms the business, so it is a demerit only.'
      D: 'You picked ease of formation. A partnership is easy to set up, and that is a merit only.'
  11:
    moments:
      - section: 'The question'
        say: 'A distributor is building a new warehouse. Where should it stand? Let us think about where the goods go next.'
        write: 'A warehouse should be sited near ?'
      - section: 'Name it'
        say: 'This is the siting of a warehouse.'
        write: 'Siting a warehouse'
      - section: 'The rule'
        say: 'A warehouse stores goods until they are needed. It should be near the people who need the goods, near good roads, and safe.'
        write: 'Near the market, near transport, secure'
      - section: 'How it works'
        say: 'Goods in a distributor''s warehouse are on their way to the market.'
        write: 'Warehouse ⇒ market'
      - say: 'Near the consumers, delivery is quick and cheap, so shops are restocked fast when demand rises.'
        write: 'Near consumers ⇒ fast, cheap delivery'
      - section: 'In Nigeria'
        say: 'Distributors of drinks and noodles keep warehouses near busy markets in Lagos, Kano and Onitsha, so retailers collect stock the same day.'
        write: 'Warehouses beside big markets'
      - section: 'Remember'
        say: 'Remember, store the goods near where they will be sold.'
        write: 'Store near the sale'
      - section: 'Answer'
        say: 'So a warehouse should be sited near consumers, which is option C.'
        write: '$\therefore$ nearness to consumers'
        answer: true
    traps:
      A: 'You chose labour. A warehouse needs only a few workers, and they can travel to it.'
      B: 'You went for capital. Capital is money, and money can be moved anywhere. It does not decide the site.'
      D: 'You picked the head office. A warehouse serves the market, not the managers.'
  12:
    moments:
      - section: 'The question'
        say: 'One trader''s shop burns down. Where does the money to pay him come from? That is the idea of pooling.'
        write: 'Pooling of risk means ?'
      - section: 'Name it'
        say: 'This is the pooling of risk, the idea on which all insurance rests.'
        write: 'Pooling of risk'
      - section: 'The rule'
        say: 'Many people facing the same risk each pay a small premium into one common fund.'
        write: 'Many premiums ⇒ one common fund'
      - say: 'The few who suffer a loss are paid out of that fund.'
        write: 'Losses paid from the fund'
      - section: 'The working'
        say: 'Suppose one thousand traders each pay five thousand naira a year.'
        write: '1,000 traders × ₦5,000'
      - say: 'One thousand times five thousand is five million naira, and that is the common fund. Now if two traders each lose two million naira in a fire, the fund pays both, four million naira in all, yet each trader has paid only five thousand naira.'
        write: '$1{,}000 \times 5{,}000 = 5{,}000{,}000$, so ₦5,000,000'
      - section: 'In Nigeria'
        say: 'Traders in Balogun market who insure their shops are all paying into such a fund.'
        write: 'Balogun traders share the fund'
      - section: 'Remember'
        say: 'Remember, the many pay a little so the few are not ruined.'
        write: 'Many pay a little, few are saved'
      - section: 'Answer'
        say: 'So pooling of risk means compensation is paid out of a common fund, which is option B.'
        write: '$\therefore$ paid out of a common fund'
        answer: true
    traps:
      A: 'You chose two people pooling their risks. Pooling needs many people paying into one fund, not just two.'
      C: 'You went for encouraging risk taking. Insurance protects against risk. It does not encourage it.'
      D: 'You picked insurers buying two policies. That is not pooling. Pooling is the fund made by many people''s premiums.'
  13:
    moments:
      - section: 'The question'
        say: 'Lake Chad touches several countries. Which pair here both belong to the commission that manages it?'
        write: 'Members of the Lake Chad Basin Commission = ?'
      - section: 'Name it'
        say: 'This is the Lake Chad Basin Commission, L C B C.'
        write: 'Lake Chad Basin Commission (LCBC)'
      - section: 'The rule'
        say: 'It was set up by the countries whose borders meet around Lake Chad. They are Nigeria, Niger, Chad and Cameroon.'
        write: 'Nigeria, Niger, Chad, Cameroon'
      - section: 'How it works'
        say: 'Together they manage the lake''s water for farming, fishing and trade, and develop the basin.'
        write: 'Shared water, farming, fishing, trade'
      - say: 'Later, the Central African Republic and Libya joined as well.'
        write: 'Later: Central African Republic, Libya'
      - section: 'In Nigeria'
        say: 'Fishermen in Borno State share the lake with people from Niger, Chad and Cameroon.'
        write: 'Borno shares the lake'
      - section: 'Remember'
        say: 'Remember, the countries that touch the lake are the members.'
        write: 'Touch the lake ⇒ member'
      - section: 'Answer'
        say: 'So the pair that are both members is Niger and Cameroon, which is option C.'
        write: '$\therefore$ Niger and Cameroon'
        answer: true
    traps:
      A: 'You chose Benin and Nigeria. Nigeria is a member, but Benin lies on the coast, far from Lake Chad.'
      B: 'You went for Nigeria and Mali. Mali is not a member. It is far to the west.'
      D: 'You picked Chad and Benin. Chad is a member, but Benin is not.'
  14:
    moments:
      - section: 'The question'
        say: 'Government sells an enterprise. One buyer is called the core investor. What makes a buyer that?'
        write: 'A core investor in privatization is one who ?'
      - section: 'Name it'
        say: 'This is the core investor in privatization.'
        write: 'Core investor'
      - section: 'The rule'
        say: 'Privatization is the sale of government owned enterprises to private buyers.'
        write: 'Privatization = sale of public enterprises'
      - say: 'A core investor buys a controlling share and brings the technical know how to run the enterprise.'
        write: 'Core investor = control + know-how'
      - section: 'How it works'
        say: 'The core investor takes over management, and the aim is to make the enterprise efficient and profitable.'
        write: 'Takes over management ⇒ efficiency'
      - section: 'In Nigeria'
        say: 'For example, under the programme of the B P E, the Bureau of Public Enterprises, core investors bought controlling shares in the power distribution companies formed from the old P H C N, the Power Holding Company of Nigeria, and took over running them.'
        write: 'BPE: power distribution companies sold to core investors'
      - section: 'Remember'
        say: 'Remember, a core investor brings money for control and skill to manage.'
        write: 'Money + skill'
      - section: 'Answer'
        say: 'So a core investor can buy a controlling share and has the know how to run it, which is option D.'
        write: '$\therefore$ controlling share + technical know-how'
        answer: true
    traps:
      A: 'You chose a long serving worker. Long service does not make someone a core investor. Control and know how do.'
      B: 'You went for raising foreign currency. Money alone is not the test. The core investor must take control and run it well.'
      C: 'You picked at the core of the enterprise. That only repeats the word core and says nothing about control or skill.'
  15:
    moments:
      - section: 'The question'
        say: 'Before anyone is hired, someone decides what jobs and departments there will be. Which function of management is that?'
        write: 'Dividing tasks into jobs and departments, delegating authority = ?'
      - section: 'Name it'
        say: 'This is organizing, a function of management.'
        write: 'Organizing'
      - section: 'The rule'
        say: 'Organizing is dividing tasks into jobs, grouping jobs into departments, and giving people the authority to do them.'
        write: 'Jobs ⇒ departments ⇒ authority'
      - section: 'How it works'
        say: 'Planning sets the goals. Organizing sets up the structure.'
        write: 'Planning ⇒ organizing'
      - say: 'Each person knows his job, his department and who he reports to.'
        write: 'Clear job, department, boss'
      - section: 'In Nigeria'
        say: 'A new supermarket in Abuja creates sales, stores and accounts departments, and gives each manager authority over his section.'
        write: 'Sales, stores, accounts'
      - section: 'Remember'
        say: 'Remember, organizing builds the structure, and staffing fills it with people.'
        write: 'Organizing builds; staffing fills'
      - section: 'Answer'
        say: 'So dividing tasks into jobs and departments is organizing, which is option A.'
        write: '$\therefore$ organizing'
        answer: true
    traps:
      B: 'You chose staffing. Staffing hires and trains people for the jobs that organizing has already created.'
      C: 'You went for leading. Leading is guiding and motivating people towards the goals.'
      D: 'You picked directing. Directing is giving instructions and supervising work as it is done.'
  16:
    moments:
      - section: 'The question'
        say: 'A message leaves the sender and travels down a channel. Who is waiting at the other end?'
        write: 'Message sent over a channel to the ?'
      - section: 'Name it'
        say: 'This is the communication process.'
        write: 'Communication process'
      - section: 'The rule'
        say: 'Communication is passing a message from a sender to a receiver through a channel, so that it is understood.'
