# UTME 2018 Commerce, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Nigerian Commerce teacher works on the
# board: the question, the term named, its definition or rule, how it works in a real
# transaction, a Nigerian example, a way to remember it, and the answer moment that names the
# option.
#
#   say:     heard, not read. Abbreviations as letters ("S E C"), money in words, percentages
#            as "per cent", no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2018.yaml. Answers match that file. This paper
# has no paper-type question, so all 40 questions have a lesson.
format_version: 1
exam_year: 2018
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'Every football match needs a referee. Who is the referee of the stock exchange? Let us find out.'
        write: 'Who regulates the Nigerian Stock Exchange?'
      - section: 'Name it'
        say: 'This is the Securities and Exchange Commission, which we call S E C.'
        write: 'SEC = Securities and Exchange Commission'
      - section: 'The rule'
        say: 'S E C is the top body that regulates and develops the capital market in Nigeria.'
        write: 'SEC regulates the capital market'
      - section: 'How it works'
        say: 'Before a company can offer its shares to the public, S E C must register the issue. It also registers brokers and punishes those who break the rules.'
        write: 'Registers share issues and brokers, enforces the rules'
      - section: 'In Nigeria'
        say: 'When Dangote Cement offers new shares, S E C approves the offer first.'
        write: 'New share offer ⇒ SEC approves first'
      - section: 'Today'
        say: 'In twenty twenty one the Nigerian Stock Exchange became Nigerian Exchange Limited, and S E C still regulates it.'
        write: '2021: Nigerian Exchange Limited, still under SEC'
      - section: 'Remember'
        say: 'Remember, securities and exchange are right there in its name. S E C is the referee of the exchange.'
        write: 'SEC = the exchange''s referee'
      - section: 'Answer'
        say: 'So the body that regulates the stock exchange is S E C, which is option A.'
        write: '$\therefore$ SEC'
        answer: true
    traps:
      B: 'You chose B P E. The Bureau of Public Enterprises sells government companies to private owners. It does not regulate the exchange.'
      C: 'You went for C B N. The Central Bank looks after banks and the money supply, not the stock exchange.'
      D: 'You picked N D I C. It insures bank deposits. It has no control over the stock exchange.'
  2:
    moments:
      - section: 'The question'
        say: 'A speculator sold shares he did not have, and now he cannot deliver them on time. What does he pay the buyer?'
        write: 'Speculator cannot deliver on the agreed date, he pays ?'
      - section: 'Name it'
        say: 'A speculator who sells, hoping prices will fall, is called a bear.'
        write: 'Seller who expects a fall = bear'
      - section: 'The rule'
        say: 'Backwardation is the fee a bear pays the buyer for putting off delivery of the shares to a later date.'
        write: 'Backwardation = fee paid by a bear to delay delivery'
      - section: 'How it works'
        say: 'The bear hoped to buy the shares cheaply later and deliver them. The price has not fallen yet, so he asks the buyer to wait, and pays him for waiting.'
        write: 'Price not fallen ⇒ bear delays and pays'
      - section: 'In Nigeria'
        say: 'A bear who sold ten thousand bank shares in Lagos, but cannot deliver on settlement day, pays the buyer backwardation.'
        write: '10,000 shares not delivered ⇒ backwardation'
      - section: 'Remember'
        say: 'Remember, bear pays backwardation, two B''s together. The bull pays contango.'
        write: 'Bear ⇒ Backwardation.  Bull ⇒ Contango'
      - section: 'Answer'
        say: 'So the payment is backwardation, which is option A.'
        write: '$\therefore$ backwardation'
        answer: true
    traps:
      B: 'You chose franco. Franco is a price that covers every delivery charge to the buyer''s door. It is not a stock exchange fee.'
      C: 'You went for arbitrage. That is buying in one market and selling in another to profit from a price gap.'
      D: 'You picked contango. Contango is paid by a bull who cannot pay for shares he bought. Our speculator is a seller.'
  3:
    moments:
      - section: 'The question'
        say: 'Shareholders can pay for their shares bit by bit. What do we call the parts the company has asked for so far?'
        write: 'Part payments on allotted shares = ?'
      - section: 'Name it'
        say: 'This is called up capital, one kind of share capital.'
        write: 'Called-up capital'
      - section: 'The rule'
        say: 'Called up capital is the part of the issued capital the company has called on shareholders to pay so far.'
        write: 'Called-up = amount asked for so far'
      - section: 'How it works'
        say: 'A company may ask for so much on application, so much on allotment, and the rest in later calls. What it has asked for up to now is the called up capital.'
        write: 'Application + allotment + calls so far'
      - section: 'In Nigeria'
        say: 'A Lagos company allots one million shares of one naira each and asks for sixty kobo on each. Its called up capital is six hundred thousand naira.'
        write: '1,000,000 × ₦0.60 = ₦600,000'
      - section: 'Remember'
        say: 'Remember, called up is what the company has called for.'
        write: 'Called-up = called for'
      - section: 'Answer'
        say: 'So part payments asked for on allotted shares make up the called up capital, which is option C.'
        write: '$\therefore$ called-up capital'
        answer: true
    traps:
      A: 'You chose issued capital. That is the full value of the shares given out, paid or not.'
      B: 'You went for subscribed capital. That is the full value of the shares the public applied for.'
      D: 'You picked authorized capital. That is the most a company may issue, as its memorandum allows.'
  4:
    moments:
      - section: 'The question'
        say: 'Your current account is empty, yet the bank still pays your cheque. What is the bank giving you?'
        write: 'Account allowed to go into debit = ?'
      - section: 'Name it'
        say: 'This is the overdraft, a bank lending service.'
        write: 'Overdraft'
      - section: 'The rule'
        say: 'An overdraft lets a current account holder draw more than he has, up to an agreed limit.'
        write: 'Draw more than the balance, up to a limit'
      - section: 'How it works'
        say: 'Interest is charged only on the amount overdrawn, and only for the days it is overdrawn. It is short term and repayable on demand.'
        write: 'Interest only on the amount overdrawn'
      - section: 'In Nigeria'
        say: 'A Balogun trader with a two hundred thousand naira overdraft limit can pay his supplier by cheque even when his balance is nil.'
        write: '₦200,000 limit, balance nil, cheque still paid'
      - section: 'Remember'
        say: 'Remember, you overdraw, so it is an overdraft. You draw over what you have.'
        write: 'Over-draw ⇒ overdraft'
      - section: 'Answer'
        say: 'So the loan that lets a cheque account go into debit is an overdraft, which is option B.'
        write: '$\therefore$ overdraft'
        answer: true
    traps:
      A: 'You chose advance. A loan or advance is a lump sum paid into a loan account, with interest on the whole sum.'
      C: 'You went for commission. That is a fee the bank charges for a service, not a loan.'
      D: 'You picked interest. Interest is the price of the loan, not the loan itself.'
  5:
    moments:
      - section: 'The question'
        say: 'A naira note is only paper. So why does every trader accept it? Let us see.'
        write: 'Money is generally acceptable due to ?'
      - section: 'Name it'
        say: 'This is acceptability, the most important quality of money.'
        write: 'Quality of money: acceptability'
      - section: 'The rule'
        say: 'Money is accepted because the law backs it. The government declares it legal tender.'
        write: 'Legal tender = backed by law'
      - section: 'How it works'
        say: 'Legal tender must be accepted in payment of a debt. Everyone knows this, so everyone accepts it.'
        write: 'Law ⇒ must accept ⇒ everyone accepts'
      - section: 'In Nigeria'
        say: 'The naira is legal tender in Nigeria, so a trader in Onitsha market must take naira notes.'
        write: 'Naira = legal tender in Nigeria'
      - section: 'Remember'
        say: 'Remember, money is money because the law says so.'
        write: 'Money because the law says so'
      - section: 'Answer'
        say: 'So money is generally acceptable because of the legal backing, which is option C.'
        write: '$\therefore$ the legal backing'
        answer: true
    traps:
      A: 'You chose the rule of law. That is a principle of government, not what makes a currency acceptable.'
      B: 'You went for global acceptance. The naira is not widely taken abroad, yet everyone at home accepts it.'
      D: 'You picked the Governor''s signature. It shows who issued the note, but it is the law behind the note that makes people accept it.'
  6:
    moments:
      - section: 'The question'
        say: 'Every year, firms gather to show their goods at the Lagos International Trade Fair. Who organizes it?'
        write: 'Trade fairs in Nigeria are organized by ?'
      - section: 'Name it'
        say: 'This is the chamber of commerce, an association of the businesses in a city or state.'
        write: 'Chamber of commerce'
      - section: 'The rule'
        say: 'A chamber of commerce promotes the trade, industry and farming of its area, and one of its main jobs is organizing trade fairs.'
        write: 'Function: promote trade, organize trade fairs'
      - section: 'How it works'
        say: 'At a trade fair, firms show their goods to buyers from home and abroad in one place, so new markets are found.'
        write: 'Show goods ⇒ meet buyers ⇒ new markets'
      - section: 'In Nigeria'
        say: 'The Lagos International Trade Fair is run by the Lagos Chamber of Commerce and Industry. Other chambers run fairs in Kaduna, Enugu and Kano.'
        write: 'Lagos Chamber of Commerce and Industry ⇒ Lagos fair'
      - section: 'Remember'
        say: 'Remember, chambers organize fairs.'
        write: 'Chambers ⇒ fairs'
      - section: 'Answer'
        say: 'So trade fairs in Nigeria are organized by chambers of commerce, which is option B.'
        write: '$\therefore$ Chambers of Commerce'
        answer: true
    traps:
      A: 'You chose the ministry. The ministry makes trade policy and supports fairs, but the chambers organize them.'
      C: 'You went for the Federal Government. It supports trade fairs, but the chambers organize them.'
      D: 'You picked the Manufacturers Association of Nigeria. It speaks for manufacturers and takes part in fairs, but it does not organize them.'
  7:
    moments:
      - section: 'The question'
        say: 'Noodles are made in a factory far away, yet you buy them on your street. How do they get to you?'
        write: 'Goods reach consumers through ?'
      - section: 'Name it'
        say: 'This is the channel of distribution.'
        write: 'Channel of distribution'
      - section: 'The rule'
        say: 'A channel of distribution is the route goods take from the producer to the final consumer.'
        write: 'Producer → … → consumer'
      - section: 'How it works'
        say: 'The usual route is producer, then wholesaler, then retailer, then consumer. Shorter channels skip the wholesaler.'
        write: 'Producer → wholesaler → retailer → consumer'
      - section: 'In Nigeria'
        say: 'Noodles go from the factory to wholesalers in Onitsha and Kano, then to shop owners, then to families.'
        write: 'Factory → Onitsha wholesaler → shop → family'
      - section: 'Remember'
        say: 'Remember, the channel is the road goods travel to reach you.'
        write: 'Channel = the road goods travel'
      - section: 'Answer'
        say: 'So goods and services reach consumers through the channel of distribution, which is option C.'
        write: '$\therefore$ the channel of distribution'
        answer: true
    traps:
      A: 'You chose the advertising agency. It makes goods known, but it does not bring them to you.'
      B: 'You went for sales promotion. It makes people want to buy, but it does not move the goods.'
      D: 'You picked the market research unit. It studies what buyers want. It does not deliver goods.'
  8:
    moments:
      - section: 'The question'
        say: 'Some firms start with the product, others start with the customer. Which idea puts the customer first?'
        write: 'Focus on consumer satisfaction = ?'
      - section: 'Name it'
        say: 'This is the marketing concept.'
        write: 'Marketing concept'
      - section: 'The rule'
        say: 'The marketing concept says find out what consumers want, and satisfy them better than rivals, so as to make profit.'
        write: 'Find needs ⇒ satisfy them ⇒ profit'
      - section: 'How it works'
        say: 'The firm researches needs first, then designs, prices, places and promotes its product to meet them.'
        write: 'Research first, then the product'
      - section: 'In Nigeria'
        say: 'A drinks maker that asks young buyers what flavour they want before making a new drink is using the marketing concept.'
        write: 'Ask buyers first, then make the drink'
      - section: 'Remember'
        say: 'Remember, the marketing concept starts with the customer.'
        write: 'Start with the customer'
      - section: 'Answer'
        say: 'So a firm that focuses on consumer satisfaction is practising the marketing concept, which is option A.'
        write: '$\therefore$ marketing concept'
        answer: true
    traps:
      B: 'You chose the selling concept. It starts with the product and pushes it hard, whatever the customer needs.'
      C: 'You went for consumerism. That is consumers fighting for their own rights, not a business idea.'
      D: 'You picked market segmentation. It divides a market into groups. It is a tool, not the idea of putting the customer first.'
  9:
    moments:
      - section: 'The question'
        say: 'A pipeline carries oil day and night with hardly any workers. So what is its big weakness?'
        write: 'Major disadvantage of pipelines = ?'
      - section: 'Name it'
        say: 'This is pipeline transport, used for liquids and gases.'
        write: 'Pipeline transport'
      - section: 'The rule'
        say: 'Its major disadvantage is the high cost of construction.'
        write: 'Disadvantage: high cost of construction'
      - section: 'How it works'
        say: 'Laying pipes over hundreds of kilometres, with pumping stations, needs huge capital at the start.'
        write: 'Pipes + pumping stations ⇒ huge first cost'
      - say: 'Once laid, it runs cheaply with little labour, so the running cost is low.'
        write: 'After that, cheap to run'
      - section: 'In Nigeria'
        say: 'The pipelines that carry oil from the Niger Delta to the refinery in Kaduna cost very large sums to build.'
        write: 'Niger Delta → Kaduna pipeline'
      - section: 'Remember'
        say: 'Remember, a pipeline is dear to build and cheap to run.'
        write: 'Dear to build, cheap to run'
      - section: 'Answer'
        say: 'So a major disadvantage of pipelines is the high cost of construction, which is option B.'
        write: '$\therefore$ high cost of construction'
        answer: true
    traps:
      A: 'You chose high maintenance cost. Pipelines need little upkeep. It is building them that is costly.'
      C: 'You went for low carrying capacity. Pipelines carry huge volumes without stopping, so their capacity is high.'
      D: 'You picked weather. Pipes are buried or protected, so the weather hardly affects them.'
  10:
    moments:
      - section: 'The question'
        say: 'In which business is the owner always the person who runs it?'
        write: 'Best at combining management with control = ?'
      - section: 'Name it'
        say: 'Control means ownership, and management means running the business day to day.'
        write: 'Control = owning.  Management = running'
      - section: 'The rule'
        say: 'In a sole proprietorship, one person owns the business and also runs it.'
        write: 'Sole proprietor: owner = manager'
      - section: 'How it works'
        say: 'In companies, shareholders own the business but directors and managers run it, so the two are apart. In a co-operative, members elect a committee to manage.'
        write: 'Company: owners ≠ managers'
      - section: 'In Nigeria'
        say: 'A woman who owns a provision shop in Ibadan decides her own prices, stock and opening hours.'
        write: 'Ibadan shop owner decides everything herself'
      - section: 'Remember'
        say: 'Remember, one owner, one manager, one person.'
        write: 'One owner = one manager'
      - section: 'Answer'
        say: 'So the business that best combines management with control is the sole proprietorship, which is option D.'
        write: '$\therefore$ a sole proprietorship'
        answer: true
    traps:
      A: 'You chose the co-operative. Its members own it, but they elect a committee to manage it.'
      B: 'You went for the public company. Thousands of shareholders own it, while directors and managers run it.'
      C: 'You picked the private company. Its owners are few, but they may hire directors and managers to run it.'
  11:
    moments:
      - section: 'The question'
        say: 'Rival firms stay separate, but agree how much of the market each one may take. What do we call that?'
        write: 'Independent firms share the market by quota = ?'
      - section: 'Name it'
        say: 'This is the cartel, a form of business combination.'
        write: 'Cartel'
      - section: 'The rule'
        say: 'A cartel is an agreement among independent firms to control output, prices or markets, while each firm keeps its own identity.'
        write: 'Cartel = independent firms + agreement'
      - section: 'How it works'
        say: 'Each member gets a quota, its share of the market or of output. So they avoid price wars and keep prices up.'
        write: 'Each firm gets a quota ⇒ no price war'
      - section: 'In Nigeria'
        say: 'O P E C is the best known cartel. Nigeria and the other members each agree a quota of crude oil to pump.'
        write: 'OPEC: each country has an oil quota'
      - section: 'Remember'
        say: 'Remember, cartel means quota. Each firm gets its slice.'
        write: 'Cartel = quota'
      - section: 'Answer'
        say: 'So sharing the market on a quota basis is a cartel, which is option A.'
        write: '$\therefore$ a cartel'
        answer: true
    traps:
      B: 'You chose a syndicate. That is a group formed for one venture, such as underwriting a share issue.'
      C: 'You went for a trust. In a trust the firms lose their independence and are run as one.'
      D: 'You picked integration. That is firms merging into one, not an agreement to share a market.'
  12:
    moments:
      - section: 'The question'
        say: 'An importer has no store of his own. Where can he keep his goods? In a warehouse owned by the government.'
        write: 'Warehouse owned and controlled by government = ?'
      - section: 'Name it'
        say: 'This is the public warehouse.'
        write: 'Public warehouse'
      - section: 'The rule'
        say: 'A public warehouse is owned by the government or its agencies, and any member of the public may store goods in it for a fee.'
        write: 'Government owns it, anyone can rent space'
      - section: 'How it works'
        say: 'Traders without stores rent space in it. Bonded warehouses at the ports hold imports until the duty is paid.'
        write: 'Bonded warehouse: goods wait till duty is paid'
      - section: 'In Nigeria'
        say: 'Warehouses run by the Nigerian Ports Authority at Apapa hold imported goods until they are cleared.'
        write: 'N.P.A. warehouses at Apapa'
      - section: 'Remember'
        say: 'Remember, public owner, public use.'
        write: 'Public owner, public use'
      - section: 'Answer'
        say: 'So the warehouse owned and controlled by the government is a public warehouse, which is option C.'
        write: '$\therefore$ public warehouse'
        answer: true
    traps:
      A: 'You chose the retailers warehouse. A retailer owns it to hold his own stock.'
      B: 'You went for the wholesalers warehouse. A wholesaler owns it for the goods he buys in bulk.'
      D: 'You picked the manufacturers warehouse. A producer owns it for his own goods.'
  13:
    moments:
      - section: 'The question'
        say: 'A public company has thousands of owners. They cannot all sit together to plan. So who does the planning?'
        write: 'In a plc, planning is done by ?'
      - section: 'Name it'
        say: 'This is the board of directors of a public limited liability company.'
        write: 'Board of directors'
      - section: 'The rule'
        say: 'The shareholders elect a board of directors to plan and make policy for them.'
        write: 'Shareholders elect ⇒ board plans'
      - section: 'How it works'
        say: 'The board sets goals and plans, and appoints managers to carry them out. Employees do the work, and shareholders vote at the annual general meeting.'
        write: 'Board plans → managers carry out → staff work'
      - section: 'In Nigeria'
        say: 'At a bank such as G T Bank, the board approves the yearly plan and budget, and the managing director and staff carry it out.'
        write: 'Bank board approves the yearly plan'
      - section: 'Remember'
        say: 'Remember, the board plans, the managers carry out, and the shareholders own.'
        write: 'Board plans.  Managers act.  Shareholders own.'
      - section: 'Answer'
        say: 'So in a public company, planning is carried out by the board of directors, which is option D.'
        write: '$\therefore$ the board of directors'
        answer: true
    traps:
      A: 'You chose employees. They carry out the plans. They do not make them.'
      B: 'You went for the company secretary. He keeps records and files legal returns. He does not plan the company''s policy.'
      C: 'You picked shareholders. They own the company and elect the board, but they leave the planning to the directors.'
  14:
    moments:
      - section: 'The question'
        say: 'One person owns the whole business. What does he find hardest to get?'
        write: 'Major problem of a sole proprietor = sourcing for ?'
      - section: 'Name it'
        say: 'This is the sole proprietorship, a business owned by one person.'
        write: 'Sole proprietorship'
      - section: 'The rule'
        say: 'Its major problem is limited capital. The owner must find all the money himself.'
        write: 'Problem: limited funds'
      - section: 'How it works'
        say: 'He has only his savings and help from family, and banks are slow to lend to a one man business with little security.'
        write: 'Savings + family, banks want collateral'
      - section: 'In Nigeria'
        say: 'A tailor in Aba who wants a second machine must save for months, because the bank asks for collateral he does not have.'
        write: 'Aba tailor saves for months'
      - section: 'Remember'
        say: 'Remember, one owner, one purse.'
        write: 'One owner, one purse'
      - section: 'Answer'
        say: 'So a major problem of a sole proprietor is sourcing for funds, which is option A.'
        write: '$\therefore$ funds'
        answer: true
    traps:
      B: 'You chose labour. A sole trader can easily take on apprentices or family. Money is the problem.'
      C: 'You went for raw materials. They can be bought once the money is there. Funds are the root problem.'
      D: 'You picked machinery. Machines are bought with funds, and raising the funds is the real problem.'
  15:
    moments:
      - section: 'The question'
        say: 'Nigeria sells oil abroad and pays foreign ships to carry goods. Where are both of these recorded?'
        write: 'Current account of the balance of payments = ?'
      - section: 'Name it'
        say: 'This is the current account, one part of the balance of payments.'
        write: 'Balance of payments = current + capital + monetary'
      - section: 'The rule'
        say: 'The current account records visible items, which are goods, and invisible items, which are services.'
        write: 'Current account = visibles + invisibles'
      - section: 'How it works'
        say: 'Exports and imports of goods are visible trade. Shipping, insurance, banking and tourism are invisible trade. Loans and investments go in the capital account.'
        write: 'Goods = visible.  Services = invisible.  Loans = capital account'
      - section: 'In Nigeria'
        say: 'Our crude oil and cocoa exports are visible items. The freight and insurance we pay foreign firms are invisible items.'
        write: 'Oil, cocoa = visible.  Freight, insurance = invisible'
      - section: 'Remember'
        say: 'Remember, you can see goods but not services. Both go in the current account.'
        write: 'Seen + unseen = current account'
      - section: 'Answer'
        say: 'So the current account is made up of visible and invisible items, which is option C.'
        write: '$\therefore$ visible and invisible items'
        answer: true
    traps:
      A: 'You chose currency and capital items. Currency is not an item of the account, and capital items go in the capital account.'
      B: 'You went for visible and current items. Current is the account itself, so services are left out.'
      D: 'You picked visible and capital items. Capital items, loans and investments, belong in the capital account.'
  16:
    moments:
      - section: 'The question'
        say: 'Marketers talk about the four P''s. Can you name all four without a mix up?'
        write: 'The four Ps of marketing = ?'
      - section: 'Name it'
        say: 'This is the marketing mix.'
        write: 'Marketing mix = four Ps'
      - section: 'The rule'
        say: 'The four P''s are product, price, place and promotion, the four things a firm controls to satisfy its customers.'
        write: 'Product, Price, Place, Promotion'
      - section: 'How it works'
        say: 'Product is what is sold. Price is what it costs. Place is how it reaches the buyer. Promotion is how buyers are told and persuaded.'
        write: 'What, how much, where, how told'
      - section: 'In Nigeria'
        say: 'A noodles maker chooses the pack size, a two hundred naira price, the shops that stock it, and its television adverts.'
        write: 'Pack, ₦200, shops, TV adverts'
      - section: 'Remember'
        say: 'Remember, what, how much, where, and how told.'
        write: 'What, how much, where, how told'
      - section: 'Answer'
        say: 'So the four P''s are price, product, place and promotion, which is option D.'
        write: '$\therefore$ price, product, place and promotion'
        answer: true
    traps:
      A: 'You chose the list with property. Property is not one of the four P''s, and promotion is missing.'
      B: 'You went for the list with process. Process is not one of the four P''s, and price is missing.'
      C: 'You picked the list with production and property. Neither is a P of marketing.'
  17:
    moments:
      - section: 'The question'
        say: 'You type a message in Lagos and it lands in China in seconds. What system carries it?'
        write: 'The internet is used for ?'
      - section: 'Name it'
        say: 'This is the internet, a modern means of communication.'
        write: 'Internet'
      - section: 'The rule'
        say: 'The internet is a worldwide network of linked computers, used for sending electronic messages and sharing information.'
        write: 'Internet = worldwide network of computers'
      - section: 'How it works'
        say: 'A message is sent as electronic signals across the network and arrives almost at once. E mail is the best known use.'
        write: 'Type → send → arrives at once (e-mail)'
      - section: 'In Nigeria'
        say: 'A Lagos importer sends an e mail order to a supplier in China and gets a reply the same hour.'
        write: 'Lagos → China e-mail, reply in an hour'
      - section: 'Today'
        say: 'Older systems like telex and telegrams are no longer in everyday use. The internet has taken their place.'
        write: 'Telex, telegrams ⇒ replaced by the internet'
      - section: 'Remember'
        say: 'Remember, internet means interconnected computers sending electronic messages.'
        write: 'Inter-connected ⇒ electronic messages'
      - section: 'Answer'
        say: 'So the internet is used for sending electronic messages, which is option A.'
        write: '$\therefore$ sending electronic messages'
        answer: true
    traps:
      B: 'You chose printed messages between teleprinters. That was telex, which is no longer in everyday use.'
      C: 'You went for delivering letters and parcels. That is the work of the postal service.'
