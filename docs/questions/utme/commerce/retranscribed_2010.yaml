# UTME 2010 Commerce, written up by hand from source/past-questions.pdf, pages 2-10.
# Q1 (the paper-type question, paper type B) is left out, so 49 questions are kept; none is
# dropped. Answers were worked out afresh. Seven printed keys did not hold up: Q13 (visible and
# invisible items together make the balance of payments), Q17 (the indent sets out the goods
# the buyer wants), Q22 (hull insurance covers the ship itself), Q28 (a ring is the illegal
# price-fixing arrangement), Q30 (NACCIMA informs members on tariffs; labour matters belong to
# employers' associations), Q38 (seasonal warm clothing suits variable pricing) and Q46 (rebuilt;
# the CPU is the central working unit). Rebuilt: Q19 (marketing was as right as advertising),
# Q24 (several hindrances were defensible), Q46 (no option named the CPU) and Q47 (several
# problems were defensible). Narrowed to one right option: Q16, Q21, Q25, Q32, Q33, Q40 and
# Q49. Q29's stem now asks for the issued capital (₦54,000), and Q41's stem now says one of the
# parties, not a third party. Other small repairs of wording are recorded in each corrected field.
