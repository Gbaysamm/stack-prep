# UTME 2011 Commerce, written up by hand from source/past-questions.pdf, pages 11-19.
# Q1 (the paper-type question) is left out, so 49 questions are kept; none is dropped. This
# source prints no answer key for the 2011 paper (the key on page 10 belongs to 2010 and the
# one on page 28 to 2012), so printed_key is null throughout and every answer was worked out
# from the standard Commerce texts. Rebuilt or narrowed to one right answer: Q5 (now asks who
# provides indirect services), Q7 and Q26 (two true disadvantages each; one distractor
# replaced), Q12 (two defensible aims; two distractors replaced), Q15 (a bill of exchange and
# a bill of lading are both transferable, so the stem now asks for the general name), Q22
# (communication and transport both link suppliers and consumers; the stem now asks about
# information), Q29 (now a creditors' voluntary liquidation), Q31 (no option was a trade
# association; ALGON replaced by NARTO) and Q42 (option D was also arguably an obligation).
# Small faults in wording are put right in Q2, Q3, Q16, Q18, Q19, Q25, Q27, Q35, Q38, Q47,
# Q48 and Q49. Q9's tree of commerce is drawn as figure_svg.
format_version: 1
