# UTME 2012 Commerce, written up by hand from source/past-questions.pdf, pages 20-28.
# Q1 (the paper-type question, Purple) is left out, so 49 questions are kept; none is dropped.
# Answers were worked out afresh. Thirteen printed keys did not hold up: Q3 (bricklaying is
# construction), Q12 (3% within 9 days is written 3/9, net 30), Q15 (competitive advertising is
# for branded goods), Q16 (a current account holder pays commission on turnover), Q19
# (subrogation), Q20 (assurance rests on certainty), Q21 (the person who takes out life
# assurance is the assured), Q22 (tourism builds cross-cultural understanding), Q36 (bonds pay
# coupons), Q37 (motivation falls under directing), Q38 (esprit de corps), Q49 (safe products
# are social responsibility) and Q50 (the society). Rebuilt: Q17's stem now describes the
# telegram alone; Q20's option D "uncertainty" became "certainty"; Q23's stem and garbled
# option C were rebuilt around airmail letters; Q24's stem now describes the co-operative's
# mutual help; Q33's option D now names the members' common interests. Where a second option
# could be defended, the weaker distractor was replaced: Q13 C, Q15 B, Q16 A, Q18 C, Q21 D,
# Q22 B, C and D, Q30 C, Q33 B, Q34 B and Q41 D; Q19's non-existent "insurance priority"
# became contribution; Q10 and Q44 have a sharper stem. Q31 and Q32 put
# their figures in a KaTeX table. Small fixes: "bill of landing" to "bill of lading" (Q10,
# Q11), "espirit" to "esprit" (Q38), and other spelling.
