# UTME 2013 Commerce, written up by hand from source/past-questions.pdf, pages 29-37.
# Q1 (the paper-type question) is left out, so 49 questions are kept; none is dropped. Answers
# were worked out afresh from the recommended texts. Eleven printed keys did not hold up: Q6
# (trading position is the balance of trade), Q9 (the consular invoice is endorsed by the
# importing country's consul), Q18 (repackaging is done in a warehouse), Q21 (shareholders'
# rights are in the Articles), Q22 (subscribed capital is issued capital), Q28 (scarcity is a
# quality of money), Q31 (planning comes first), Q38 (a contract of record), Q39 (a factor),
# Q41 (frustration) and Q42 (a lien). Repairs: Q29 was rebuilt around a trader pricing goods in
# naira (money as a measure of value), since "measure of value" and "standard of value" said the
# same thing; Q2, Q4, Q12, Q17, Q18, Q28, Q38, Q46 and Q49 had a second defensible option
# replaced by a clear distractor; Q6, Q16, Q23, Q44 and Q45 had their stems tightened; Q7, Q9,
# Q10, Q11, Q15, Q19, Q20, Q24, Q26, Q32, Q33, Q34, Q40 and Q47 had small faults of wording put
# right. The insurance table shared by Q15
# and Q16 is a KaTeX array in each stem.
