# UTME 2014 Commerce, written up by hand from source/past-questions.pdf, pages 38-46.
# Q1 asks which paper type was given (Type L) and is left out, so 49 questions are kept; none is
# dropped. Answers were worked out afresh. Twelve printed keys did not hold up: Q5 (land is
# heterogeneous, not active), Q8 (consumer co-operative), Q10 (bill of sight), Q20 (insurance
# company), Q21 (road), Q22 (jettison), Q23 (essential services), Q27 (irredeemable bond),
# Q34 (ex div leaves the dividend with the seller), Q40 (rebuilt; the product), Q43
# (frustration) and Q46 (void contract). Rebuilt or narrowed to one right answer: Q5, Q6, Q8,
# Q25, Q40, Q44, Q48 and Q50. Small faults in wording put right: Q7, Q10, Q11 ("exercise"),
# Q12, Q14 (option B "₦2,00"), Q19, Q21, Q30, Q33, Q34, Q35, Q37, Q39, Q41, Q42, Q45 and Q47
# ("FOTRAN"). The paper has no tables or diagrams.
