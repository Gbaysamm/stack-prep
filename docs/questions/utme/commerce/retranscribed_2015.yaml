# UTME 2015 Commerce, written up by hand from source/past-questions.pdf, pages 47-54.
# This paper prints no paper-type question, so Q1 is a real question and all 40 questions are
# kept; none is dropped. Answers were worked out afresh. Nine printed keys did not hold up:
# Q15 (the cost and repayment burden is what sources of funds are judged on), Q16 (new shares
# are issued by prospectus, offer for sale and placing; a bill of exchange is not a share issue),
# Q21 (safe, good-quality products are a social responsibility of the business itself), Q33 (the
# person who takes out life assurance is the assured), Q34 (social responsibility is to
# society), Q37 (petroleum products reach filling stations mainly by road tanker), Q39 (a
# floating policy is marine insurance), Q40 (soap making is manufacturing, a secondary
# occupation) and Q36 (rebuilt; scarcity is the quality of money). Repairs: Q19 printed only
# three options, so a fourth (bill of lading) was added; Q18's gross profit (₦4,500) did not
# agree with its own figures, so it is ₦4,100, and option A "218 times" is 2.18 times; Q1, Q6,
# Q9 and Q15 had more than one defensible option and were narrowed to one; Q17 had no clearly
# right option and its option B was rebuilt; Q36 had two defensible qualities and was rebuilt;
# Q14's "most widely used" became "designed mainly for", which stays true today; Q33 and Q37
# had stems made precise; Q3, Q4, Q5, Q7, Q9, Q12, Q13, Q21, Q25, Q26, Q27, Q30, Q35 and Q39
# had small faults in spelling or wording put right. Q31's tree of commerce is drawn as
# figure_svg; Q18's trading figures are a KaTeX array in the stem.
