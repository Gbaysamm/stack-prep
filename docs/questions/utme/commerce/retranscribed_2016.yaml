# UTME 2016 Commerce, written up by hand from source/past-questions.pdf, pages 55-61.
# This paper prints no paper-type question, so Q1 is a real question and all 40 questions are
# kept; none is dropped. Answers were worked out afresh. Seven printed keys did not hold up:
# Q5 (current assets ₦4,750 over current liabilities ₦1,187.50 is 4:1), Q8 (commerce makes a
# complex and organized society possible), Q11 (rebuilt; a wholesaler who takes ownership of
# the goods is a merchant wholesaler), Q27 (marketing is the centre of commercial activity),
# Q33 (3% off within nine days is written 3/9, net 30), Q35 (visible imports above visible
# exports is an unfavourable balance of trade) and Q39 (land is heterogeneous; it is a passive
# factor). Rebuilt: Q11 ("a merchant wholesaler is referred to as" fitted no option, since the
# factor, broker and del credere agent are agents and a rack jobber is only one kind of merchant
# wholesaler) and Q19 (several of "job security, annual leave, working facilities" could be the
# "most important right", so it now asks for a right of an employee with one right option).
# Repaired: Q2, Q8, Q10, Q13, Q16, Q25, Q32, Q34, Q36, Q39 and Q40 had more than one
# defensible option and were narrowed to one, following the same questions in earlier years;
# Q21's stem now says the tourists are foreigners in Nigeria; Q5 and Q6 both carry the SONU
# Enterprises balance sheet, and Q3 the trading figures, as KaTeX arrays in the stem; Q1, Q7,
# Q9, Q10, Q12, Q13, Q14, Q17, Q20, Q22, Q24, Q28, Q30, Q33, Q36, Q37, Q38, Q39 and Q40 had
# small faults in spelling or wording put right. No figures.
