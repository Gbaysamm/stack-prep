# UTME 2017 Commerce, written up by hand from source/past-questions.pdf, pages 62-68.
# This paper prints no paper-type question, so Q1 is a real question and all 40 questions are
# kept; none is dropped. Answers were worked out afresh. Four printed keys did not hold up: Q3
# (the policy with particular average gives the fullest marine cover), Q6 (the consular invoice
# is the document used for ad valorem duties), Q18 (sewage, oil spills and refuse pollute land
# and water) and Q40 (an irredeemable bond pays only interest and is never repaid). Rebuilt or
# narrowed to one right answer: Q3, Q7, Q9, Q10, Q11, Q14, Q16, Q20, Q21, Q24, Q25, Q33, Q34
# and Q36 (Q33, Q34 and Q36 are rebuilt the same way as 2012 Q23, 2012 Q24 and 2013 Q16).
# Small faults in spelling or wording put right: Q1, Q2, Q4, Q6, Q8, Q12, Q13, Q18, Q19, Q27,
# Q29, Q30, Q31, Q35 (option D "7,500" had lost its naira sign) and Q40. The insurance table
# shared by Q35 and Q36 is a KaTeX array in each stem. The paper has no diagrams.
