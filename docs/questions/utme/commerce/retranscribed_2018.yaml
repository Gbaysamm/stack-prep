# UTME 2018 Commerce, written up by hand from source/past-questions.pdf, pages 69-76.
# This paper prints no paper-type question, so Q1 is a real question and all 40 questions are
# kept; none is dropped. Answers were worked out afresh. Seven printed keys did not hold up:
# Q9 (high cost of construction is the major disadvantage of pipelines), Q10 (only in a sole
# proprietorship is the owner also the manager), Q19 (in the books, capital is a liability owed
# to the owner), Q20 (rebuilt as in 2015 Q6; skill is the factor), Q35 (indemnity restores the
# insured to the position before the loss), Q37 (damages, not specific performance, for a dress
# not made on time) and Q38 (personal selling is costly). Q13's printed letter D pointed at a
# stray option ("manufacturers' warehouse"), which became "the board of directors". Repairs:
# Q20 and Q26 had several right options and were rebuilt with new distractors; Q35 printed only
# three options, so a fourth (the indemnity answer) was added; Q31's garbled option C became
# "granted to every newly opened account"; Q17's "inter for" is read as "the internet", and
# options B and C, which the internet also does, became telex and the post; Q15's stem now
# names the current account, which visible and invisible items make up; Q39's "Food and Drugs
# Department" became NAFDAC, which took over its work; Q7, Q9, Q12, Q13, Q21, Q22, Q27, Q28,
# Q29, Q31, Q37 and Q38 had more than one defensible option and were narrowed to one; Q1, Q4,
# Q5, Q6, Q10, Q11, Q14, Q16, Q19, Q23, Q24, Q25, Q30, Q33, Q34, Q36 and Q40 had small faults in
# spelling or wording put right. Q32's marketing-mix chart is drawn as figure_svg.
