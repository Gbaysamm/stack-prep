# UTME Commerce — the topics and subtopics every question is tagged with.
#
# Read from source/syllabus.pdf. The syllabus numbers its 16 topics straight through. A topic
# here is one numbered topic (COM.<number>); a subtopic is one of its contents, (i), (ii), ...
# lettered a, b, ... in order. Topic 6 already letters its aids to trade a to g, and those
# letters are kept. Topic 4 letters only Home Trade and Foreign Trade, so here retail and
# wholesale trade are COM.4.a and COM.4.b and its seven foreign-trade contents are grouped into
# COM.4.c to COM.4.e. Topic 15's six short contents are grouped in pairs.
# database/load_retranscribed_commerce.py builds the curriculum from this file, and every
# retranscribed_YYYY.yaml uses these codes.
format_version: 1
topics:
  COM.1:
    name: Commerce
    subtopics:
      COM.1.a: "Meaning and functions of e-commerce and e-business"
      COM.1.b: "Meaning and scope of Commerce, and how it differs from related subjects"
      COM.1.c: "Characteristics of Commerce"
      COM.1.d: "Functions of Commerce"
  COM.2:
    name: Occupation
    subtopics:
      COM.2.a: "Meaning and importance of occupation"
      COM.2.b: "Types of occupation: industrial, commercial and services"
      COM.2.c: "Factors that determine the choice of occupation"
  COM.3:
    name: Production
    subtopics:
      COM.3.a: "Factors of production, their characteristics and rewards"
      COM.3.b: "Division of labour and specialization"
      COM.3.c: "Types of production: primary, secondary and tertiary"
      COM.3.d: "Production, specialization and exchange"
  COM.4:
    name: Trade
    subtopics:
      COM.4.a: "Retail trade: types, functions, setting up, trends, success and failure"
      COM.4.b: "Wholesale trade: types of wholesaler, channels of distribution, functions"
      COM.4.c: "Foreign trade: types, balance of trade, balance of payments, counter trade"
      COM.4.d: "Procedures and documents in export, import and entrepot trade"
      COM.4.e: "Barriers, tariffs, trade restriction, export promotion and the trade agencies"
  COM.5:
    name: Purchase and Sale of Goods
    subtopics:
      COM.5.a: "Procedure and documents: enquiry, quotation, order, invoice and others"
      COM.5.b: "Terms of trade: discounts, warranties, C.O.D., C.I.F., F.O.B., E.O.E."
      COM.5.c: "Terms of payment: cash and credit"
      COM.5.d: "Means of payment: legal tender, cheques, drafts, bills, transfers, e-payment"
  COM.6:
    name: Aids to Trade
    subtopics:
      COM.6.a: "Advertising: meaning, roles, types, media, merits and demerits"
      COM.6.b: "Banking: types of bank, services, challenges and e-banking"
      COM.6.c: "Communication: process, types, trends, merits and barriers"
      COM.6.d: "Insurance: types, principles, terms, importance and types of risk"
      COM.6.e: "Tourism: meaning, forms, importance, agencies, challenges and centres"
      COM.6.f: "Transportation: modes, importance, merits and demerits"
      COM.6.g: "Warehousing: importance, types, functions and siting"
  COM.7:
    name: Business Units
    subtopics:
      COM.7.a: "Forms and features of business units"
      COM.7.b: "Registration of businesses"
      COM.7.c: "Choosing a business unit"
      COM.7.d: "Dissolution and liquidation"
      COM.7.e: "Merits and demerits of business units"
      COM.7.f: "Reasons for government ownership of public enterprises"
  COM.8:
    name: Financing Business
    subtopics:
      COM.8.a: "Sources of finance"
      COM.8.b: "Types of capital"
      COM.8.c: "Calculating capital, gross and net profit, and turnover"
      COM.8.d: "Problems of sourcing finance"
      COM.8.e: "The role of the bureau de change"
  COM.9:
    name: Trade Associations
    subtopics:
      COM.9.a: "Trade and manufacturers' associations: objectives and functions"
      COM.9.b: "Chambers of Commerce: objectives and functions"
      COM.9.c: "Forms of business combination and merger"
  COM.10:
    name: Money
    subtopics:
      COM.10.a: "Evolution of money"
      COM.10.b: "Forms and qualities of money"
      COM.10.c: "Functions of money"
  COM.11:
    name: Stock Exchange
    subtopics:
      COM.11.a: "Importance and functions of the Stock Exchange"
      COM.11.b: "Types of securities: stocks, shares, bonds, debentures"
      COM.11.c: "Procedure of transactions and speculation"
      COM.11.d: "The Second-Tier Securities Market"
  COM.12:
    name: Elements of Business Management
    subtopics:
      COM.12.a: "Functions of management"
      COM.12.b: "Principles of management"
      COM.12.c: "Organizational structure"
      COM.12.d: "Functional areas of business"
      COM.12.e: "Business resources"
  COM.13:
    name: Elements of Marketing
    subtopics:
      COM.13.a: "Importance and functions of marketing"
      COM.13.b: "The marketing concept"
      COM.13.c: "The marketing mix: product, price, place and promotion"
      COM.13.d: "Market segmentation"
      COM.13.e: "Public relations and customer service"
      COM.13.f: "E-marketing"
  COM.14:
    name: Legal Aspects of Business
    subtopics:
      COM.14.a: "Meaning and validity of a simple contract"
      COM.14.b: "Agency, the Sale of Goods Act and the Hire Purchase Act"
      COM.14.c: "Contract of employment"
      COM.14.d: "Government regulation of business: registration, patents, trademarks, copyright"
      COM.14.e: "Consumer protection"
      COM.14.f: "Regulatory agencies"
  COM.15:
    name: Commodity Exchange
    subtopics:
      COM.15.a: "Meaning of commodity exchange and the commodities traded"
      COM.15.b: "Requirements and methods of trading"
      COM.15.c: "Benefits of and constraints to commodity trading"
  COM.16:
    name: Business Environment and Social Responsibility
    subtopics:
      COM.16.a: "Types of business environment"
      COM.16.b: "Social responsibility: safe products, philanthropy and society"
      COM.16.c: "Types and implications of pollution"
