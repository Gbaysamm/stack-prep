format_version: 1
exam_year: 2010
subject: ECO
explanations:
  2:
    answer: A
    steps:
      - 'This is the definition of economics, built on scarcity and choice.'
      - 'Economics studies how people use scarce resources, which have other uses, to satisfy wants that have no end. In short, it is about allocating resources efficiently.'
      - 'Because resources are limited and wants are not, every person, firm and government must choose how to share out what it has, and economics studies those choices.'
      - 'Example: a Kano family with ₦50,000 a month must choose between school fees, food and transport. How it shares that money is an economic decision.'
      - 'Remember: scarce means, unlimited wants, so we must choose.'
      - 'The trap is B, production of goods. Production is only one part of economics; distribution, exchange and consumption are studied too.'
    hint: 'What does every economic decision have to deal with, given that resources are scarce?'
    why:
      B: 'Production is only one branch of economics, not the whole subject.'
      C: 'How companies run is business management, a narrower field.'
      D: 'Income is studied, but only as part of how resources are allocated.'

  3:
    answer: B
    steps:
      - 'This is the invisible hand, Adam Smith''s name for the price mechanism.'
      - 'In a free market no one fixes prices. Prices move up and down on their own as buyers and sellers act in their own interest, and this guides resources as if an invisible hand were at work.'
      - 'When many investors want to sell shares and few want to buy, supply exceeds demand on the stock market and share prices fall with no one ordering it. That is the invisible hand at work.'
      - 'Example: on the Nigerian Stock Exchange in Lagos (now the Nigerian Exchange), bank share prices fell sharply in 2008 and 2009 as investors rushed to sell. No official set those prices; demand and supply did.'
      - 'Remember: no hand you can see sets the price, so the hand is invisible.'
      - 'The trap is A, efficient allocation of resources. That is what the invisible hand aims to achieve, but a price crash shows the mechanism at work, not that allocation is efficient.'
    hint: 'Who set the share prices when they fell? Think of Adam Smith''s phrase.'
    why:
      A: 'Efficient allocation is the hoped-for result of the market, not the force that moved the prices.'
      C: 'The fall came from the free play of demand and supply, not from government control.'
      D: 'Consumer rationality is an assumption about buyers, not the mechanism that sets market prices.'

  4:
    answer: A
    steps:
      - 'This is the arithmetic mean of a frequency distribution.'
      - 'The mean is the sum of all the values divided by how many there are: $\bar{x} = \dfrac{\Sigma fx}{N}$, where $N = \Sigma f$.'
      - 'Data: $\bar{x} = 6$, $N = 6$, $\Sigma fx = ?$ Rearranging gives $\Sigma fx = \bar{x} \times N = 6 \times 6 = 36$.'
      - 'Check: $36 \div 6 = 6$, which is the mean we were given.'
      - 'Example: if six market women sell an average of 6 tubers of yam each, together they sold 36 tubers.'
      - 'The trap is B, 12. It adds 6 and 6 instead of multiplying them.'
    hint: 'Write the formula for the mean, then make $\Sigma fx$ the subject.'
    why:
      B: 'Adds the mean and N instead of multiplying them.'
      C: 'Divides the mean by N; the total must be bigger than the mean.'
      D: 'Doubles the right total; 72 ÷ 6 = 12, not 6.'

  5:
    answer: D
    steps:
      - 'This is the standard deviation, a measure of dispersion.'
      - 'Dispersion is how spread out the values are. The standard deviation is the square root of the average squared distance of each value from the mean: $\sigma = \sqrt{\dfrac{\Sigma f(x - \bar{x})^2}{\Sigma f}}$.'
      - 'A small standard deviation means the values sit close to the mean; a large one means they are widely spread.'
      - 'Example: if tomato prices in two Ibadan markets have the same mean but one market''s prices swing much more, that market has the larger standard deviation.'
      - 'Remember: averages tell you the middle; deviation tells you the spread.'
      - 'The trap is B. The standard deviation is not an average at all, and it is measured from the mean, not the mode or median.'
    hint: 'Is the standard deviation about the middle of the data or about its spread?'
    why:
      A: 'The standard deviation is measured from the mean, not the mode.'
      B: 'It is not an average; it measures spread around the mean.'
      C: 'It is measured from the mean, not the median.'

  6:
    answer: C
    steps:
      - 'This is about the arithmetic mean as a measure of central tendency.'
      - 'The mean is found by adding every value and dividing by the number of values, so it uses all the data.'
      - 'Because it uses every value, the mean is the balancing point of the data: the distances of the values above it exactly balance the distances below it. That is why it is the most widely used average and can be used in further calculations.'
      - 'Example: the marks 40, 50 and 60 balance at 50. The 10 marks above it balance the 10 marks below it, like a seesaw at a playground.'
      - 'Remember: the mean is the seesaw''s pivot; the median is the middle seat.'
      - 'The trap is B. The midpoint value of an ordered array is the median, not the mean.'
    hint: 'Which average uses every value and balances them on both sides?'
    why:
      A: 'The opposite is true: the mean is pulled by extreme values.'
      B: 'The middle value of an ordered array is the median.'
      D: 'The mean needs every value, so it cannot be found from incomplete data.'

  7:
    answer: C
    steps:
      - 'This is the mode.'
      - 'The mode is the value that occurs most often in a set of data.'
      - 'A shoe size is "popular" because it is bought more often than any other, so the most popular size is the most frequent one, which is the mode. A trader stocks more of it.'
      - 'Example: a shoe seller at Balogun market notices that size 42 sells most often, so she orders more size 42 than any other size.'
      - 'Remember: MOde means MOst often.'
      - 'The trap is B, the mean. An average size like 41.6 may not even exist on the shelf; the mode is a real size that people buy most.'
    hint: 'Which average is the value that turns up most often?'
    why:
      A: 'The range is a measure of spread, not of the most common size.'
      B: 'The mean can be a size no one buys, such as 41.6.'
      D: 'The median is the middle size, not the most bought one.'

  8:
    answer: B
    steps:
      - 'This is tax incidence, the question of who bears the burden of a tax.'
      - 'The rule: the side of the market that is less elastic bears more of the tax.'
      - 'If demand is more elastic than supply, buyers can easily cut back or switch when the price rises, so the seller cannot pass much of the tax on. Supply is the less elastic side, so producers bear more of the burden.'
      - 'Example: if a tax is put on one brand of bottled water and buyers simply switch to sachet water, the producer must absorb most of the tax to keep customers.'
      - 'Remember: the one who cannot run away pays the tax.'
      - 'The trap is C, more by consumers. That is true only when demand is less elastic than supply.'
    hint: 'Which side can escape a price rise more easily, and who is left to pay?'
    why:
      A: 'The burden is shared equally only when the two elasticities are the same.'
      C: 'Consumers bear more when demand is the less elastic side.'
      D: 'Retailers are not a separate side here; the split is between consumers and producers.'

  9:
    answer: D
    steps:
      - 'This is the link between price elasticity of demand and total revenue.'
      - 'Total revenue is price times quantity, $TR = P \times Q$. Demand is elastic when the percentage change in quantity demanded is greater than the percentage change in price.'
      - 'If price rises, quantity falls by a bigger percentage, so the fall in Q outweighs the rise in P and total revenue falls. Worked: price ₦100 to ₦110 (up 10%), quantity 100 to 80 (down 20%); TR goes from ₦10,000 to ₦8,800.'
      - 'Example: if one suya seller raises his price while others nearby do not, his customers walk to the next stand and his takings fall.'
      - 'Remember: elastic demand, price and revenue move in opposite directions.'
      - 'The trap is B, increase. Revenue rises after a price increase only when demand is inelastic.'
    hint: 'With elastic demand, which falls by more in percentage terms, or rises: price or quantity?'
    why:
      A: 'Nothing in elastic demand doubles revenue; it falls.'
      B: 'Revenue rises with a price increase only when demand is inelastic.'
      C: 'Revenue stays constant only when demand is unitary elastic.'

  10:
    answer: B
    steps:
      - 'This is excess demand, a shortage in the market.'
      - 'Excess demand exists when quantity demanded is greater than quantity supplied at the ruling price.'
      - 'If the price of beans falls below the equilibrium price, more people want to buy beans and sellers offer fewer, so quantity demanded exceeds quantity supplied.'
      - 'Example: if a price of beans per mudu were fixed far below the market price in Kaduna, buyers would queue and many would go home without beans.'
      - 'Remember: price too low, shelves too empty.'
      - 'The trap is A. A price above equilibrium gives the opposite, an excess supply.'
    hint: 'Is the price below or above equilibrium when buyers want more than sellers offer?'
    why:
      A: 'A price above equilibrium gives excess supply, not excess demand.'
      C: 'More supply at the same price reduces a shortage; it does not create one.'
      D: 'Less demand at the same price leaves beans unsold, an excess supply.'

  11:
    answer: A
    steps:
      - 'This is consumer surplus.'
      - 'Consumer surplus is the difference between what a consumer is willing to pay for a good and what he actually pays. On a graph it is the area under the demand curve and above the price.'
      - 'When demand is inelastic, the demand curve is steep: buyers would pay far more than the market price rather than go without. So the gap between willingness to pay and price, and the surplus, is large. When demand is perfectly elastic the curve is flat at the price and the surplus is zero.'
      - 'Example: a diabetic would pay much more than the pharmacy price for insulin, so he enjoys a big consumer surplus on it.'
      - 'Remember: the more you need it, the bigger the bargain at the ruling price.'
      - 'The trap is C, elastic. With elastic demand buyers value the good close to its price, so the surplus is small.'
    hint: 'Picture a steep demand curve and a flat one. Which leaves a bigger triangle above the price?'
    why:
      B: 'A flat demand curve sits at the price, so there is no surplus at all.'
      C: 'Elastic demand means buyers value the good near its price, so the surplus is small.'
      D: 'Unitary elasticity gives a middling surplus, not a high one.'

  12:
    answer: B
    steps:
      - 'This is the ordinal utility approach, the indifference curve theory.'
      - 'Ordinal theory says satisfaction cannot be measured in numbers, but a consumer can rank bundles of goods in order of preference: first, second, third.'
      - 'From this ranking come indifference curves. The theory also assumes choices are consistent: if A is preferred to B and B to C, then A is preferred to C.'
      - 'Example: a student cannot say jollof rice gives her 20 units of satisfaction, but she can say she prefers jollof to amala and amala to eba.'
      - 'Remember: ordinal is about order, first, second, third, like ordinal numbers.'
      - 'The trap is D. Measurable satisfaction is the cardinal assumption, the opposite theory.'
    hint: 'Ordinal numbers are first, second, third. What can a consumer do with satisfaction under this theory?'
    why:
      A: 'Ordinal theory assumes choice is consistent (transitive), not inconsistent.'
      C: 'Utility depends on the quantity consumed, not on price.'
      D: 'Measurable satisfaction belongs to the cardinal theory.'

  13:
    answer: A
    steps:
      - 'This is the law of diminishing marginal utility.'
      - 'As a consumer takes more units of a good, the extra satisfaction from each additional unit falls.'
      - 'Because each extra unit is worth less to him, a consumer will buy more only if the price falls. So quantity demanded rises as price falls, and the normal demand curve slopes downwards, which is a negative slope.'
      - 'Example: the first sachet of cold water on a hot afternoon in Maiduguri is worth a lot; the fourth is worth little, so you would buy the fourth only if it were cheap.'
      - 'Remember: less joy from each extra unit, so a lower price for each extra unit.'
      - 'The trap is B. Upward-sloping abnormal demand comes from exceptions such as Giffen goods, not from diminishing marginal utility.'
    hint: 'If each extra unit gives less satisfaction, what must happen to the price before you buy more?'
    why:
      B: 'Abnormal demand curves come from exceptions like Giffen and prestige goods.'
      C: 'A normal demand curve slopes downwards, so its slope is negative, not positive.'
      D: 'Consumption of inferior goods falls as income rises, and that is an income effect anyway.'

  14:
    answer: B
    steps:
      - 'This is consumer surplus worked out in money.'
      - 'Consumer surplus = what the consumer is willing to pay − what he actually pays.'
      - 'Data: willing to pay 120k, actually pays 80k. Surplus = 120k − 80k = 40k.'
      - 'Change to naira: 100k = ₦1, so 40k = ₦0.40. Check: ₦1.20 − ₦0.80 = ₦0.40.'
      - 'Example: a buyer at Oja Oba was ready to pay ₦1.20 for four oranges, haggled, and paid ₦0.80. The 40 kobo she kept is her consumer surplus.'
      - 'The trap is C, ₦1.00. It does not come from the data; and ₦1.50 is 120 ÷ 80, a ratio, not a surplus.'
    hint: 'Take what she pays away from what she was willing to pay, then turn kobo into naira.'
    why:
      A: '₦1.50 is 120 ÷ 80, a ratio, not a difference in money.'
      C: 'Surplus is the difference, 40k, which is ₦0.40, not ₦1.00.'
      D: '₦2.00 adds the two amounts, 120k + 80k, instead of subtracting.'

  15:
    answer: B
    steps:
      - 'These are the determinants of supply that shift the supply curve.'
      - 'A change in the good''s own price causes a movement along the supply curve. A change in anything else that affects supply shifts the whole curve.'
      - 'Better technology and lower costs of production let firms supply more at every price, so the curve shifts right; bad weather cuts farm output, so the curve shifts left.'
      - 'Example: a good rainy season in Benue raises the yam harvest, and more yams reach the market at every price.'
      - 'Remember: own price moves you along the curve; everything else moves the curve.'
      - 'The trap is A. Weather and technology do shift supply, but price only moves along the curve.'
    hint: 'Which option leaves out the good''s own price?'
    why:
      A: 'Price causes a movement along the supply curve, not a shift.'
      C: 'Price moves along the curve, and taste shifts demand, not supply.'
      D: 'Population and taste shift demand, and price moves along the curve.'

  16:
    answer: D
    steps:
      - 'This is price elasticity of supply.'
      - '$E_s = \dfrac{\%\,\Delta Q_s}{\%\,\Delta P}$. If $E_s > 1$, supply is fairly (relatively) elastic; if $E_s < 1$, fairly inelastic; $E_s = 1$ is unitary; $E_s = 0$ is perfectly inelastic; an infinite $E_s$ is perfectly elastic.'
      - 'A coefficient above one means quantity supplied changes by a bigger percentage than price. Example: price up 10%, quantity supplied up 25%, so $E_s = 25 \div 10 = 2.5$.'
      - 'Example: when the price of sachet water rises, producers in Lagos can quickly run their machines longer, so supply responds strongly.'
      - 'Remember: more than one, more than proportionate, fairly elastic.'
      - 'The trap is A, perfectly elastic. That needs an infinite coefficient, not just one above one.'
    hint: 'Above one means quantity responds by more than price. What is that called, short of infinite?'
    why:
      A: 'Perfectly elastic supply has an infinite coefficient.'
      B: 'Fairly inelastic supply has a coefficient between 0 and 1.'
      C: 'There is no "infinitely inelastic"; perfectly inelastic supply has a coefficient of 0.'

  17:
    answer: C
    steps:
      - 'This is joint supply.'
      - 'Goods are in joint supply when producing one automatically produces the other; one is a by-product of the other.'
      - 'If more of Y is produced, more of X comes out with it, so their supplies rise and fall together.'
      - 'Example: refining crude oil at Port Harcourt gives petrol and also kerosene and diesel; slaughtering a cow at the abattoir gives beef and also hide (kpomo).'
      - 'Remember: joint supply, joined at birth.'
      - 'The trap is A, competitive supply. That is when making more of one means making less of the other, such as a farm choosing between maize and cassava.'
    hint: 'If making Y automatically makes X too, are they produced together or against each other?'
    why:
      A: 'Competitive supply means producing more of one leaves less for the other.'
      B: 'Composite supply means several sources supply the same want, like gas, kerosene and firewood for cooking.'
      D: 'Excess supply is a surplus at a price, not a link between two goods.'

  18:
    answer: D
    steps:
      - 'This is price determination in perfect competition.'
      - 'In perfect competition there are very many buyers and sellers of an identical product, and no one is big enough to affect the price.'
      - 'The price is set by the market, that is, by the total demand and total supply of the whole industry. Each firm and each buyer then accepts that price; they are price-takers.'
      - 'Example: one tomato seller at Mile 12 market cannot charge more than the going price, because buyers would walk to the next stall.'
      - 'Remember: perfect competition, the market makes the price and everyone takes it.'
      - 'The trap is B, sellers. No single seller can set the price; only all sellers and buyers together, through the market.'
    hint: 'Can any single buyer or seller change the price in perfect competition?'
    why:
      A: 'Government does not set prices in a perfectly competitive market.'
      B: 'Each seller is a price-taker and cannot set the price.'
      C: 'Each buyer is too small to change the price.'

  19:
    answer: A
    steps:
      - 'This is a maximum price, also called a price ceiling.'
      - 'A maximum price is a legal price set by government, below the equilibrium price, above which a good may not be sold.'
      - 'It keeps the price lower than the market would set it, so consumers can afford essential goods. It can cause shortages and black markets, which the government must then manage.'
      - 'Example: the fixed pump price of petrol in Nigeria for many years was a maximum price meant to protect consumers.'
      - 'Remember: maximum price, the ceiling protects the buyer; minimum price, the floor protects the seller.'
      - 'The trap is C, minimum prices. A price floor keeps prices up to protect producers, which makes consumers'' hardship worse.'
    hint: 'Does a ceiling or a floor keep the price down?'
    why:
      B: 'Commodity boards bought export crops from farmers; they did not lower consumer prices.'
      C: 'A minimum price keeps prices up to protect producers.'
      D: 'Higher import duties raise the price of imported goods.'

  20:
    answer: B
    steps:
      - 'This is the link between average product (AP) and marginal product (MP) of a variable factor.'
      - '$AP = \dfrac{TP}{L}$ and $MP = \dfrac{\Delta TP}{\Delta L}$. When MP is above AP, AP rises; when MP is below AP, AP falls; MP cuts AP at its maximum.'
      - 'So AP is less than MP while AP is still rising, which is the stage of increasing returns to the variable factor. Worked: TP 10, 30, 60 with 1, 2, 3 workers gives MP 10, 20, 30 and AP 10, 15, 20, so MP stays above AP.'
      - 'Example: on a Kebbi rice farm, the second and third workers can share tasks, so each new worker adds more than the average, and the average rises.'
      - 'Remember: the new student''s mark is above the class average, so the average goes up.'
      - 'The trap is D. When AP is falling, MP is below AP, the opposite of what is asked.'
    hint: 'If the extra worker adds more than the average, what happens to the average?'
    why:
      A: 'At the maximum of AP, MP equals AP.'
      C: 'Negative MP is far below AP.'
      D: 'When AP falls, MP is below AP.'

  21:
    answer: A
    steps:
      - 'This is economies of scale.'
      - 'Economies of scale are the cost advantages a firm gains as it grows: its average cost of production falls as output increases.'
      - 'A bigger firm can buy raw materials in bulk, use large machines fully, borrow more cheaply and divide work among specialists, so each unit costs less to make.'
      - 'Example: Dangote Cement produces millions of tonnes a year, so its cost per bag is lower than that of a small block-making yard.'
      - 'Remember: economies of scale, bigger and cheaper per unit.'
      - 'The trap is B. Benefits from other firms in the area are external economies; the phrase in the question describes the firm''s own falling cost.'
    hint: 'What happens to cost per unit as a firm grows and gains from size?'
    why:
      B: 'That describes external economies, gained from other firms, not the firm''s own economies of scale.'
      C: 'Profit maximization is a separate condition (MC = MR), not the meaning of economies of scale.'
      D: 'An upward-sloping average cost curve means diseconomies of scale.'

  22:
    answer: C
    steps:
      - 'This is the long-run average cost (LRAC) curve and diseconomies of scale.'
      - 'The LRAC curve is U-shaped. Its falling part shows economies of scale; its rising part shows diseconomies of scale, when average cost rises as the firm keeps growing.'
      - 'Past a certain size, a firm becomes hard to manage: messages get lost, workers are poorly supervised and decisions are slow, so cost per unit rises.'
      - 'Example: a fast-food chain that opens branches too fast across Nigeria may find that supervision, waste and transport costs push up its cost per meal.'
      - 'Remember: down the U is economies, up the U is diseconomies.'
      - 'The trap is B. Economies of scale are the falling part of the curve, not the rising part.'
    hint: 'On the U-shaped LRAC, which part shows cost per unit rising with size?'
    why:
      A: 'Rising average cost shows falling efficiency, not increasing efficiency.'
      B: 'Economies of scale are shown by the falling part of the curve.'
      D: 'Increasing returns lower average cost; the rising part shows the opposite.'

  23:
    answer: C
    steps:
      - 'This is elasticity of supply and its determinants.'
      - 'Supply is elastic when firms can raise output quickly and by a lot when price rises.'
      - 'Firms working below capacity have idle machines and workers, so they can increase output at once without new factories. Firms at full capacity cannot.'
      - 'Example: a Kano textile mill running one shift out of three can add shifts when cloth prices rise, so its supply responds strongly.'
      - 'Remember: spare capacity, stretchy supply.'
      - 'The trap is B. Full capacity makes supply inelastic, because output cannot rise until new capacity is built.'
    hint: 'Which firms can increase output fastest when the price rises?'
    why:
      A: 'A shortage of raw materials holds output back, making supply less elastic.'
      B: 'At full capacity output cannot rise quickly, so supply is inelastic.'
      D: 'Maximizing profit does not tell us how easily output can expand.'

  24:
    answer: B
    steps:
      - 'This is monopolistic competition.'
      - 'Monopolistic competition is a market with many sellers selling similar but differentiated products, with free entry and exit.'
      - 'Because there are many sellers, each has only a small share, so no single seller dominates the market. Because each product is a little different (brand, packaging, location), each firm has some control over its own price.'
      - 'Example: hairdressing salons in a Lagos street all offer hair-making, but each has its own style and loyal customers; none controls the market.'
      - 'Remember: many sellers like perfect competition, but each with its own brand like a small monopoly.'
      - 'The trap is C. Price-taking belongs to perfect competition; in monopolistic competition each firm sets its own price.'
    hint: 'How many sellers are there, and can any one of them control the whole market?'
    why:
      A: 'Products are differentiated in monopolistic competition, not identical.'
      C: 'Each firm sets its own price; price-takers are in perfect competition.'
      D: 'Perfect knowledge is an assumption of perfect competition.'

  25:
    answer: C
    steps:
      - 'This is the demand for factors of production, a derived demand.'
      - 'A firm demands a factor because of what the factor produces. It hires a factor up to the point where the factor''s marginal revenue product equals its price.'
      - 'Because of diminishing returns, each extra unit of a factor adds less output, so its marginal revenue product falls. The firm will hire more only if the factor''s price falls, so the factor demand curve slopes downwards.'
      - 'Example: a block-making firm will hire a fifth labourer only if the daily wage is low enough to match the few extra blocks he adds.'
      - 'Remember: the factor demand curve is the falling MRP curve.'
      - 'The trap is B. An upward slope belongs to the supply of factors, such as more workers offering themselves at higher wages.'
    hint: 'What happens to the extra output of each additional worker, and so to the wage a firm will pay?'
    why:
      A: 'A perfectly elastic curve would mean any amount is hired at one price, which ignores falling MRP.'
      B: 'Upward slopes belong to factor supply, not factor demand.'
      D: 'A perfectly inelastic curve would mean the amount hired never changes with price.'

  26:
    answer: A
    steps:
      - 'This is a cartel.'
      - 'A cartel is a formal agreement among independent firms in an industry to fix prices, limit output or share out markets among themselves.'
      - 'By acting together, the firms behave like one monopoly, raising price and profit above what competition would give.'
      - 'Example: OPEC, of which Nigeria is a member, is a cartel of oil-producing countries that agree on output quotas to influence the oil price.'
      - 'Remember: cartel, the firms sign up and carve up the market.'
      - 'The trap is B, collusion. Collusion is the act of firms secretly working together; the formal agreement or organization they form is the cartel.'
    hint: 'What is the name of the group or agreement, such as OPEC, that fixes price and shares markets?'
    why:
      B: 'Collusion is the act of cooperating; the formal agreement is a cartel.'
      C: 'Haggling is bargaining over price between a buyer and a seller.'
      D: 'Specialization is concentrating on one task or product.'

  27:
    answer: A
    steps:
      - 'This is the tax function in national income analysis.'
      - 'In the income model, tax is a function of income: $T = tY$, where $t$ is the tax rate and $Y$ is national income.'
      - 'As national income rises, people and firms earn more, so more tax is collected; as income falls, tax falls. Worked: with $t = 0.2$, $Y$ = ₦100 billion gives $T$ = ₦20 billion.'
      - 'Example: when Nigerians earn more, PAYE income tax collected by the states rises with them.'
      - 'Remember: tax follows income, $T = tY$.'
      - 'The trap is B, consumption. VAT is charged on spending, but in national income accounting the tax function is written on income.'
    hint: 'In $T = tY$, what does $Y$ stand for?'
    why:
      B: 'In the model, tax is written as a function of income, not consumption.'
      C: 'Investment is treated as given (autonomous), not the base of tax.'
      D: 'Savings depend on income; they do not determine tax.'

  28:
    answer: D
    steps:
      - 'This is aggregate spending (aggregate demand) and the business cycle.'
      - 'Aggregate spending is total spending in the economy: $C + I + G + (X - M)$. National income settles where output equals this spending.'
      - 'If spending falls, firms cannot sell all they produce, so they cut output and lay off workers. Incomes fall, spending falls again, and the economy slides into a recession, a fall in national output with rising unemployment.'
      - 'Example: in 2016, when oil earnings and government spending in Nigeria fell, the economy went into recession and many firms laid off staff.'
      - 'Remember: less spending, less selling, less producing, recession.'
      - 'The trap is B, inflation. Inflation comes from too much spending chasing too few goods, the opposite case.'
    hint: 'If people and government spend less, what do firms do with output and workers?'
    why:
      A: 'A boom comes from rising, not falling, spending.'
      B: 'Inflation is caused by excess spending, not a fall in it.'
      C: 'Falling spending causes unemployment, not full employment.'

  29:
    answer: D
    steps:
      - 'This is the government expenditure multiplier.'
      - 'The multiplier tells how many times national income rises for each naira of new spending: $k = \dfrac{1}{1 - \text{MPC}}$, and $\Delta Y = k \times \Delta G$.'
      - 'Data: MPC = 0.7, $\Delta G$ = ₦150 million. $k = \dfrac{1}{1 - 0.7} = \dfrac{1}{0.3} = \dfrac{10}{3}$.'
      - '$\Delta Y = \dfrac{10}{3} \times 150 = 500$, so national income rises by ₦500 million. Check: $500 \times 0.3 = 150$, the new spending, as it should.'
      - 'Example: when government pays contractors to build a road in Enugu, the workers spend on food and transport, the sellers spend in turn, and total income rises by more than the first spending.'
      - 'The trap is B, ₦45 million. It multiplies 150 by 0.3 instead of dividing by it.'
    hint: 'Find the multiplier from the MPC first, then multiply it by the new spending.'
    why:
      A: '₦214 million divides 150 by the MPC, 0.7, instead of by 1 − MPC.'
      B: '₦45 million multiplies 150 by 0.3 instead of dividing by it.'
      C: '₦105 million is only 0.7 × 150, the first round of spending.'

  30:
    answer: C
    steps:
      - 'This is money as a medium of exchange.'
      - 'A medium of exchange is anything generally accepted in payment for goods and services.'
      - 'Under barter, a person who made only one thing would need a double coincidence of wants to get everything else. Money removes this, so a person can specialize in one job, sell his output for money, and buy all he needs. That is what makes division of labour possible.'
      - 'Example: a tailor in Aba sews only clothes, is paid in naira, and uses the naira to buy rice, fuel and textbooks.'
      - 'Remember: money is the go-between that lets each person do one job.'
      - 'The trap is A, unit of account. Measuring value helps compare prices, but it is exchange that lets specialists get what they need.'
    hint: 'Which function removes the need for a double coincidence of wants?'
    why:
      A: 'A unit of account measures value; it does not by itself let a specialist trade.'
      B: 'Store of value lets people save, which is not what makes specialization possible.'
      D: 'Deferred payment allows credit and debt, not specialization.'

  31:
    answer: A
    steps:
      - 'This is open market operations, a tool of monetary policy.'
      - 'In open market operations the Central Bank buys or sells government securities, such as treasury bills, to change the money supply.'
      - 'When the CBN buys treasury bills from banks and the public, it pays them money. Banks'' reserves rise, they can lend more, and money supply in the economy increases. Selling bills does the opposite.'
      - 'Example: during a slowdown, the CBN can buy back treasury bills so that banks have more cash to lend to businesses.'
      - 'Remember: CBN buys, money flows out to the people; CBN sells, money flows back in.'
      - 'The trap is C. Reducing money supply comes from selling treasury bills, not buying them.'
    hint: 'When the CBN buys something, does money leave the CBN or come into it?'
    why:
      B: 'The cash reserve ratio is a separate tool, changed by directive, not by buying bills.'
      C: 'Money supply falls when the CBN sells treasury bills.'
      D: 'Capital base is raised by recapitalization rules, not by open market purchases.'

  32:
    answer: C
    steps:
      - 'This is the velocity of circulation of money, from the quantity theory of money.'
      - 'Velocity is the number of times a naira changes hands in a year. Fisher''s equation of exchange is $MV = PY$ (or $MV = PT$).'
      - 'Make $V$ the subject: $V = \dfrac{PY}{M}$. Price level times real output, $PY$, is nominal GDP, so $V = \dfrac{\text{Nominal GDP}}{\text{Money supply}}$. Worked: nominal GDP ₦100 trillion and money supply ₦25 trillion give $V = 4$.'
      - 'Example: the same ₦1,000 note may pay a bus fare, then buy bread, then pay a barber in one week, so it does the work of ₦3,000.'
      - 'Remember: MV = PY, so V = PY over M.'
      - 'The trap is B. Real GDP leaves out the price level, but money is spent at current prices, so velocity uses nominal GDP.'
    hint: 'Start from $MV = PY$ and make $V$ the subject.'
    why:
      A: 'This is the reverse of velocity, and uses real instead of nominal GDP.'
      B: 'Money pays for output at current prices, so nominal, not real, GDP is needed.'
      D: 'This ratio does not contain money at all; it is related to the price level.'

  33:
    answer: C
    steps:
      - 'This is a function of commercial banks, now called deposit money banks in Nigeria.'
      - 'Commercial banks accept deposits from the public and lend money to customers, earning interest.'
      - 'Granting loans and overdrafts is the main way commercial banks earn their profit and create credit. Stable prices, monetary policy and issuing currency belong to the Central Bank of Nigeria.'
      - 'Example: a trader in Onitsha takes a loan from her bank to stock her shop before the Christmas rush.'
      - 'Remember: the CBN is the banks'' bank; commercial banks are the people''s bank.'
      - 'The trap is D. Only the CBN issues naira notes and coins in Nigeria.'
    hint: 'Which of these does your local bank branch do for a customer?'
    why:
      A: 'Price stability is an aim of the Central Bank.'
      B: 'The Central Bank regulates monetary policy.'
      D: 'Only the CBN issues currency in Nigeria.'

  34:
    answer: C
    steps:
      - 'This is expansionary fiscal policy as a cure for unemployment.'
      - 'Fiscal policy is the use of government spending and taxes to influence the economy. To curb unemployment, government raises spending and cuts taxes.'
      - 'Higher spending on roads, schools and hospitals creates jobs directly. Lower taxes leave people and firms more to spend, so demand rises and firms hire more workers.'
      - 'Example: a federal road project in Kogi employs hundreds of labourers, and their wages are spent at food stalls and shops nearby.'
      - 'Remember: to fight unemployment, spend more and tax less.'
      - 'The trap is D. Spreading jobs evenly shares out the jobs that exist but does not create any new ones.'
    hint: 'Which mix of spending and taxes adds to demand and so to jobs?'
    why:
      A: '"Stabilization policy" is too vague; it does not say how jobs are created.'
      B: 'More tax and less spending cut demand and raise unemployment.'
      D: 'Sharing out existing jobs does not create new ones.'

  35:
    answer: B
    steps:
      - 'This is deficit budgeting.'
      - 'A deficit budget is one in which planned government expenditure is greater than expected revenue; the gap is met by borrowing.'
      - 'In a recession, private spending is weak. By spending more than it collects, government pumps extra demand into the economy, firms sell more and hire more workers.'
      - 'Example: Nigerian federal budgets have usually been deficit budgets, with the gap borrowed, to fund roads, power and jobs programmes.'
      - 'Remember: deficit to stimulate, surplus to cool down.'
      - 'The trap is C, surplus budgeting. A surplus takes more in taxes than government spends, which reduces demand and jobs.'
    hint: 'Which budget puts more money into the economy than it takes out?'
    why:
      A: 'A balanced budget adds no extra demand to the economy.'
      C: 'A surplus budget withdraws demand and is used to fight inflation.'
      D: 'Zero-based budgeting is a method of planning each item from scratch, not a way to stimulate jobs.'

  36:
    answer: C
    steps:
      - 'This is the failure of development planning in Nigeria.'
      - 'A development plan sets out the projects and targets a government means to achieve over a period. Nigeria has had several, from the First National Development Plan (1962–1968) to later rolling plans and visions.'
      - 'The main reason plans fail is poor implementation: projects are abandoned when governments change, money is diverted by corruption, supervision is weak and targets are not monitored. Funds were often voted, but the work was not carried out.'
      - 'Example: across Nigeria there are abandoned roads, dams and buildings started under one plan and never finished.'
      - 'Remember: a plan is only as good as its implementation.'
      - 'The trap is B, inadequate funding. Funding was a problem, but money was often available and still badly spent.'
    hint: 'Is the main problem in writing the plans or in carrying them out?'
    why:
      A: 'Nigeria''s plans relied mainly on domestic oil revenue, not foreign aid.'
      B: 'Funding gaps were real but secondary; funds that were available were often misused.'
      D: 'Skill shortages hurt some projects but are not the main cause of failure.'

  37:
    answer: A
    steps:
      - 'This is the aim of agricultural policy in Nigeria.'
      - 'Food sufficiency means a country produces enough food to feed its own people without depending on imports.'
      - 'Every major programme, from Operation Feed the Nation (1976) and the Green Revolution (1980) to the Agricultural Transformation Agenda (2011) and the Anchor Borrowers Programme (2015), aimed first at growing enough food at home.'
      - 'Example: the push to grow more rice in Kebbi and Ebonyi was meant to cut rice imports and feed Nigerians from Nigerian farms.'
      - 'Remember: "Feed the Nation" says the aim in its own name.'
      - 'The trap is C, full employment. Farming does create jobs, but that is a side benefit, not the ultimate aim of farm policy.'
    hint: 'Think of the name "Operation Feed the Nation". What was it meant to achieve?'
    why:
      B: 'Industrialization is the aim of industrial policy.'
      C: 'Jobs are a side benefit; the main aim is enough food.'
      D: 'Capacity utilization concerns factories, not farm policy.'

  38:
    answer: C
    steps:
      - 'This is input subsidy as a tool to raise farm output.'
      - 'A subsidy on farm inputs means government pays part of the cost of fertilizer, improved seeds, tractors and chemicals, so farmers buy them cheaply.'
      - 'Cheaper inputs lower farmers'' costs and raise yields per hectare, so farmers can produce more. It acts directly on production.'
      - 'Example: subsidised fertilizer sold to farmers in Kaduna and Niger States helps them get bigger maize harvests from the same land.'
      - 'Remember: help the farmer with the inputs, and the output follows.'
      - 'The trap is B. An embargo on food imports raises food prices but does nothing directly to help farmers produce more; it often encourages smuggling instead.'
    hint: 'Which policy lowers the cost of growing food on the farm itself?'
    why:
      A: 'Buffer stocks steady prices and incomes; they do not raise output directly.'
      B: 'An import ban protects the market but does not by itself make farmers more productive.'
      D: 'A monthly income for farmers would be costly and does not raise productivity.'

  39:
    answer: C
    steps:
      - 'This is localization of industry.'
      - 'Localization is the concentration of firms of one industry in a particular area.'
      - 'Firms cluster where they share advantages: nearness to raw materials, skilled labour, ancillary firms and a reputation for that trade. These are external economies.'
      - 'Example: shoe and leather makers are concentrated in Aba; auto spare parts dealers cluster at Nnewi; and many textile mills grew up in Kano and Kaduna.'
      - 'Remember: localization, one industry, one locality.'
      - 'The trap is D. Siting firms that make different products is location of industry in general, not localization of one industry.'
    hint: 'Is it about where one industry''s firms gather together, or about where any firm is sited?'
    why:
      A: 'Spreading firms of different products is dispersal, the opposite of localization.'
      B: 'Siting near the market is a reason for location, not the meaning of localization.'
      D: 'Siting firms that make different products is location of industry, not localization.'

  40:
    answer: A
    steps:
      - 'This is government policy on the location of industry.'
      - 'In developing countries, industries tend to crowd into a few big cities. Governments use incentives, industrial estates and their own factories to steer industries to other regions.'
      - 'This spreads development: new jobs, roads, power and services reach backward areas, and pressure on overcrowded cities falls.'
      - 'Example: Nigeria sited steel at Ajaokuta in Kogi, a refinery at Kaduna and paper mills at Iwopin and Oku-Iboku, partly to spread industry beyond Lagos.'
      - 'Remember: government moves industry to move development.'
      - 'The trap is B, redistribute wealth. That may follow, but the stated aim of location policy is balanced development across regions.'
    hint: 'Why would a government want factories outside Lagos and other big cities?'
    why:
      B: 'Wealth may spread as a result, but balanced regional development is the aim.'
      C: 'Encouraging entrepreneurs is the aim of incentives in general, not of location policy.'
      D: 'Government location policy often makes firms accept lower profits, not higher ones.'

  41:
    answer: C
    steps:
      - 'This is the cost of depending on imported refined petroleum products.'
      - 'For many years Nigeria exported crude oil but imported most of its petrol, kerosene and diesel, because its own refineries worked far below capacity.'
      - 'Imports depend on ships, foreign exchange, foreign refiners and payments to importers. Any delay in these breaks the supply, so supply is unstable and fuel queues and scarcity follow.'
      - 'Example: long queues at filling stations in Abuja and Lagos at festive seasons came when imported cargoes were delayed. The Dangote refinery, commissioned in 2023, is meant to end this dependence.'
      - 'Remember: import your fuel and you import uncertain supply.'
      - 'The trap is D. Poor refinery maintenance is a cause of the import dependence, not a disadvantage that results from it.'
    hint: 'What happens at the filling station when an imported cargo is late?'
    why:
      A: 'Demand for fuel is steady; the instability is in supply.'
      B: 'Multinationals dominate crude production, which is a separate issue from importing refined products.'
      D: 'Poor maintenance is a cause of imports, not a result of them.'

  42:
    answer: D
    steps:
      - 'This is the public limited liability company.'
      - 'A public limited company sells its shares to the general public, and its members have limited liability.'
      - 'Because anyone may buy its shares on the stock exchange, there is no legal maximum number of shareholders. A private limited company, by contrast, may have no more than fifty members under the Companies and Allied Matters Act.'
      - 'Example: Dangote Cement Plc has many thousands of shareholders across Nigeria and abroad. CAMA 2020 still sets no maximum for public companies.'
      - 'Remember: "Plc" means public, and the public has no limit.'
      - 'The trap is C, seven. Seven was the old minimum number of members for a public company, not a maximum.'
    hint: 'Can anyone buy shares of a public company on the stock exchange?'
    why:
      A: 'Twenty was an old maximum for a partnership, not a public company.'
      B: 'Five has no meaning as a limit for a public company.'
      C: 'Seven was the old minimum for a public company, not the maximum.'

  43:
    answer: B
    steps:
      - 'This is the aim of production.'
      - 'Production is the creation of goods and services to satisfy human wants.'
      - 'A farmer, a firm and the government produce for different motives, profit for the firm, welfare for the government, but in every case the goods and services exist to satisfy someone''s wants. That is the ultimate purpose of all production.'
      - 'Example: a government hospital in Ilorin earns no profit, but it produces health care because people want to be well.'
      - 'Remember: wants are the reason anything is produced.'
      - 'The trap is A, make profit. Profit drives private firms, but government and non-profit producers produce without it.'
    hint: 'What do a profit-making firm and a free government hospital have in common?'
    why:
      A: 'Profit is the motive of private firms only, not of all production.'
      C: 'Redistributing wealth is a government aim, not the purpose of production.'
      D: 'Putting inputs into use is how production happens, not why.'

  44:
    answer: C
    steps:
      - 'This is the population growth rate, read from a table.'
      - 'Growth rate = (this year''s population − last year''s population) ÷ last year''s population × 100%.'
      - 'Data: 2002 is 40 thousand and 2003 is 50 thousand. Growth = $\dfrac{50 - 40}{40} \times 100\% = \dfrac{10}{40} \times 100\% = 25\%$.'
      - 'Check: 25% of 40 thousand is 10 thousand, and 40 + 10 = 50 thousand.'
      - 'Example: Nigeria''s population grows at about 2.5% a year, so a town of 40,000 adds about 1,000 people a year; this table''s town grows far faster.'
      - 'The trap is B, 20.0%. It divides the increase by the new population, 50, instead of the old one, 40.'
    hint: 'Growth is always measured against the starting figure. Which year is the start?'
    why:
      A: '33.3% has no basis in the table for 2003.'
      B: '20% divides by the new figure, 50, instead of the old figure, 40.'
      D: '50% does not follow from the change of 10 thousand on 40 thousand.'

  45:
    answer: D
    steps:
      - 'This is the working population as a share of total population.'
      - 'Percentage of working population = working population ÷ total population × 100%.'
      - 'Data for 2002: working population 32 thousand, total population 40 thousand. $\dfrac{32}{40} \times 100\% = 80\%$.'
      - 'Check: 80% of 40 thousand is 32 thousand, which matches the table.'
      - 'Example: a high share of workers means fewer dependants for each worker to feed, which helps a family in Osogbo save and invest.'
      - 'The trap is C, 8%. It drops a zero; 32 out of 40 is most of the population, not a small part.'
    hint: 'Take the 2002 row only, and divide working population by total population.'
    why:
      A: '50% would need 20 thousand workers, not 32 thousand.'
      B: '25% is the growth rate in 2003, not the working share in 2002.'
      C: '8% loses a zero; 32 out of 40 is 80%.'

  46:
    answer: D
    steps:
      - 'This is the free trade area, the first stage of economic integration.'
      - 'A free trade area is a group of countries that remove tariffs and quotas on trade among themselves, while each member keeps its own trade policy towards non-members.'
      - 'The stages go further step by step: a customs union adds a common external tariff; a common market adds free movement of labour and capital; an economic union adds common policies and often a common currency.'
      - 'Example: the African Continental Free Trade Area (AfCFTA), which Nigeria signed in 2019, removes tariffs on most trade among African countries.'
      - 'Remember: area, union, market, economic union; each stage adds one thing.'
      - 'The trap is A. A common tariff against non-members is what turns a free trade area into a customs union.'
    hint: 'At the first stage of integration, what do members agree only among themselves?'
    why:
      A: 'A common external tariff marks a customs union.'
      B: 'A common currency belongs to a monetary or economic union.'
      C: 'Free factor mobility marks a common market.'

  47:
    answer: B
    steps:
      - 'This is how trade is recorded in the balance of payments.'
      - 'In a balance of payments, anything that brings foreign money into a country is a credit, and anything that sends money out is a debit.'
      - 'When Nigeria imports vehicles from Japan, Japan exports them and earns money, so it is a credit on Japan''s balance of payments. For Nigeria the import is a debit, because money flows out.'
      - 'Example: when a Lagos dealer pays for Toyota cars, naira is changed into yen and leaves Nigeria; Japan''s account records the receipt.'
      - 'Remember: exports earn, so credit; imports pay, so debit.'
      - 'The trap is C. For Nigeria the import is a debit on its balance of trade, not a credit.'
    hint: 'Which country receives money when the vehicles are sold?'
    why:
      A: 'Japan earns from the export, so it is a credit for Japan, not a debit.'
      C: 'Nigeria pays for the import, so it is a debit for Nigeria.'
      D: 'An import is a debit on Nigeria''s balance of payments.'

  48:
    answer: C
    steps:
      - 'This is the African Development Bank (ADB, now usually written AfDB).'
      - 'The ADB was founded in 1964, with its headquarters in Abidjan. Its objective is to promote the economic and social development of its African member countries.'
      - 'It does this mainly by giving long-term loans and grants for projects such as roads, power, water and agriculture, and by giving technical advice.'
      - 'Example: the ADB has funded road, power and water projects in Nigeria, and Nigeria is one of its largest shareholders. Its president from 2015 to 2025, Akinwumi Adesina, is Nigerian.'
      - 'Remember: African Development Bank, for African development.'
      - 'The trap is B. Short-term loans for balance of payments problems are the work of the IMF; the ADB lends long-term for development.'
    hint: 'The bank''s name says what it is for.'
    why:
      A: 'The ADB does not subsidise imports for members.'
      B: 'Short-term balance of payments loans are the IMF''s role.'
      D: 'Its help is for all regional members, not only the poorest.'

  49:
    answer: A
    steps:
      - 'This is the economic problem of how to produce.'
      - 'Every economy must decide what to produce, how to produce it and for whom. "How" means the method: by hand or by machine, labour-intensive or capital-intensive.'
      - 'The method an economy can use depends on its level of technical know-how. An economy with advanced technology uses machines and automation; one with simple technology uses hand tools and much labour.'
      - 'Example: a mechanised rice farm in Kebbi uses tractors and combine harvesters, while a smallholder in Ebonyi still plants and harvests by hand.'
      - 'Remember: what you know decides how you produce.'
      - 'The trap is C. Natural resources decide mainly what an economy produces, such as oil or cocoa, rather than the method used to produce it.'
    hint: 'Of the three economic questions, this one is "how". What decides whether you use a hoe or a tractor?'
    why:
      B: 'Population growth affects how many people want goods, not the method of producing them.'
      C: 'Natural resources decide mainly what is produced, not how.'
      D: 'Income level affects demand for goods, not the technique of production.'

  50:
    answer: C
    steps:
      - 'This is the marginal productivity theory of wages.'
      - 'A firm hires labour up to the point where the marginal revenue product of the last worker equals the wage.'
      - 'If an extra worker adds more to revenue than he costs, the firm hires him; if he adds less, it does not. So the marginal productivity of labour decides how many workers are hired.'
      - 'Example: a bakery in Jos pays ₦5,000 a day. A new baker who adds ₦7,000 worth of bread a day is hired; a fifth baker who would add only ₦3,000 is not.'
      - 'Remember: hire while the worker adds more than he costs.'
      - 'The trap is A. The number of skilled workers available affects labour supply, not how many a firm decides to hire.'
    hint: 'What does the last worker add to the firm''s revenue, compared with his wage?'
    why:
      A: 'The number available is labour supply, not the firm''s decision to hire.'
      B: 'Skill matters only through how much the worker produces, which is his marginal productivity.'
      D: 'The price of inputs in general is too broad; hiring depends on labour''s own productivity against its wage.'
