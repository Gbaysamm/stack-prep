format_version: 1
exam_year: 2011
subject: ECO
explanations:
  2:
    answer: A
    steps:
      - 'This is about the control of inflation, a persistent rise in the general price level.'
      - 'Inflation is often described as too much money chasing too few goods. A lasting cure must deal with the "too few goods" side as well as the money side.'
      - 'When productivity rises, each worker and each machine turns out more, so the supply of goods grows. More goods at the same level of spending pull prices down, and the cost of each unit falls too, so both demand-pull and cost-push pressure ease.'
      - 'If Nigerian farmers raise their yields of rice and tomatoes, the market prices of these foods fall, and food is the biggest item in Nigeria''s inflation basket.'
      - 'Remember: more goods, steadier prices.'
      - 'The trap is C, rationing. It can hold prices down for a while, but it does not add a single extra bag of rice, and it breeds queues and black markets.'
    hint: 'Inflation is too much money chasing too few goods. Which option deals with the "too few goods"?'
    why:
      B: 'Cutting income tax leaves people more to spend, which raises demand and pushes prices up.'
      C: 'Rationing only suppresses prices for a while, adds no output and breeds black markets.'
      D: 'Imports can ease shortages, but they drain foreign exchange and do nothing for home output in the long run.'

  3:
    answer: A
    steps:
      - 'This is the production possibility curve (PPC), and the assumptions it is drawn on.'
      - 'A PPC shows the combinations of two goods an economy can produce when it uses all its resources fully and efficiently, with a given amount of resources and a given state of technology.'
      - 'Because technology is held fixed, the curve is a snapshot. It cannot show what happens when new methods are invented; that needs a whole new curve, shifted outwards. So the fixed-technology assumption means the PPC gives no indication of technological development.'
      - 'If Nigerian farmers switched from hoes to tractors, they could grow more yams and more maize at once, but one PPC drawn for the hoe era could never show that.'
      - 'Remember: one curve, one level of technology. New technology means a new curve.'
      - 'The trap is B. The PPC does measure opportunity cost: its slope shows how much of one good is given up to get one more unit of the other.'
    hint: 'If technology is held fixed while the curve is drawn, what can the curve never show?'
    why:
      B: 'The slope of the PPC is exactly the opportunity cost of one good in terms of the other, so the PPC does measure it.'
      C: 'Points on the PPC are technically efficient; inefficiency is shown by points inside the curve.'
      D: 'The PPC assumes resources are scarce and fixed, which is why it has a boundary at all.'

  4:
    answer: D
    steps:
      - 'This is the arithmetic mean, the average found by adding all the values and dividing by how many there are.'
      - 'Because it uses every value, one very large or very small value pulls the mean towards itself. Its main disadvantage is that it is affected by extreme values.'
      - 'For five scores 10, 12, 11, 13 and 54, the mean is (10 + 12 + 11 + 13 + 54) ÷ 5 = 100 ÷ 5 = 20, even though four of the five scores are 13 or below. The median, 12, describes the group better.'
      - 'If one man in a village of farmers is a millionaire oil contractor, the "average income" of the village looks high, though most people there are poor.'
      - 'Remember: the mean is pulled by the extremes; the median stands firm.'
      - 'The trap is B. The mean is the most useful average for further work, such as the variance and the standard deviation, so it is not unsuitable for analysis.'
    hint: 'What happens to the mean if one value is much bigger than all the others?'
    why:
      A: 'The mean works well for large sets of data; computers find it in an instant.'
      B: 'The mean is the basis of further analysis, such as the variance and the standard deviation.'
      C: 'The mean is easy to calculate: add the values and divide by their number.'

  5:
    answer: B
    steps:
      - 'This is consumer sovereignty.'
      - 'Consumer sovereignty means the consumer is "king": in a market economy, what consumers choose to buy decides what is produced.'
      - 'Each naira a consumer spends is like a vote for a good. Goods that get many votes earn profits, so producers make more of them; goods nobody buys make losses and stop being made. In this way the market sets demand patterns.'
      - 'When more Nigerians began to buy sachet water, firms rushed to set up sachet water factories in every town.'
      - 'Remember: the customer votes with money.'
      - 'The trap is A, scale of preference. Each person has one, but it is the market power of consumers as a whole, consumer sovereignty, that shapes what is produced.'
    hint: 'In a market economy, whose choices decide what gets produced?'
    why:
      A: 'A scale of preference is one person''s private list of wants; it does not on its own direct the market.'
      C: 'Rationality is an assumption about how consumers behave, not the power that sets demand patterns.'
      D: 'Price signals the pattern of demand, but price itself responds to what consumers choose.'

  6:
    answer: D
    steps:
      - 'This is consumer surplus.'
      - 'Consumer surplus is the difference between what a consumer is willing to pay for a commodity and what he actually pays. For each unit, it is the excess of its marginal utility (in money) over the price.'
      - 'By diminishing marginal utility, the first units are worth more to the buyer than later ones, but the market charges one price for every unit. So every unit before the last gives the buyer an extra gain, and adding these gains gives the consumer surplus.'
      - 'Bisi is ready to pay ₦500 for a plate of jollof rice at a mama put, but the price is ₦300. Her consumer surplus on that plate is ₦500 − ₦300 = ₦200.'
      - 'Remember: consumer surplus = what you would pay − what you do pay.'
      - 'The trap is B. It turns the idea upside down: consumer surplus is the excess of utility over expenditure, not expenditure over utility.'
    hint: 'Compare what the buyer is willing to pay with what he actually pays.'
    why:
      A: 'A cheap commodity can still give little surplus; the surplus is measured against what the buyer is willing to pay.'
      B: 'This is the wrong way round; consumer surplus is utility in excess of expenditure.'
      C: 'Marginal cost belongs to the producer; consumer surplus compares utility with price.'

  7:
    answer: B
    steps:
      - 'This is competitive demand.'
      - 'Competitive demand is the demand for goods that are substitutes, so that buying one excludes buying the other.'
      - 'Because either good satisfies the same want, a consumer who buys one does not need the other. A rise in the price of one makes people switch to the other.'
      - 'A traveller from Lagos to Ibadan takes either a bus or a train; choosing one excludes the other. Tea and coffee at breakfast are another pair.'
      - 'Remember: competitive goods compete for the same want.'
      - 'The trap is A, complementary demand. Complements are bought together, like a car and petrol, which is the opposite of excluding each other.'
    hint: 'If buying one good means you do not buy the other, what is their relationship?'
    why:
      A: 'Complementary goods are bought together (car and petrol), not instead of each other.'
      C: 'Composite demand is one good wanted for several uses, like palm oil for cooking and for soap.'
      D: 'Derived demand is demand for a thing because of the demand for what it helps produce, like labour.'

  8:
    answer: C
    steps:
      - 'This is about the shape of a demand curve drawn from a demand schedule.'
      - 'By the law of demand, a normal demand curve slopes downward: as price rises, quantity demanded falls. A curve that slopes upward, with quantity demanded rising as price rises, is an abnormal (exceptional) demand curve.'
      - 'Read the table: as price rises from ₦1 to ₦5, quantity demanded rises from 100 kg to 120, 150, 180 and 200 kg. Quantity moves the same way as price, so the graph slopes upward from left to right.'
      - 'Abnormal demand happens with goods of ostentation (Veblen goods), Giffen goods, or when buyers expect prices to rise further. In Nigeria, when people hear that petrol prices will go up next week, they buy more today even as the price climbs.'
      - 'Remember: normal demand goes down the hill; abnormal demand climbs it.'
      - 'The trap is B. A normal demand curve needs quantity to fall as price rises, and this table shows the opposite.'
    hint: 'As the price goes up in the table, does quantity demanded go up or down?'
    why:
      A: 'A kinked demand curve belongs to oligopoly and has a bend in it; this schedule rises smoothly.'
      B: 'A normal demand curve slopes downward, but here quantity demanded rises with price.'
      D: 'A diminishing marginal utility curve plots utility against units consumed, not price against quantity.'

  9:
    answer: A
    steps:
      - 'This is the median, a measure of central tendency.'
      - 'The median is the middle value of a set of data after the values have been arranged in order of size.'
      - 'In an odd-numbered set there is exactly one middle value. For n values it is the $\dfrac{n+1}{2}$th value. For the scores 4, 7, 9, 12, 15 (n = 5), the median is the 3rd value, 9.'
      - 'Line up the heights of the eleven players in a football team from shortest to tallest; the 6th player stands at the median height.'
      - 'Remember: median, middle.'
      - 'The trap is C, the arithmetic mean. The mean is a different average, found by adding and dividing, and it is usually not the same as the median.'
    hint: 'Arrange the scores in order. Which one sits exactly in the middle?'
    why:
      B: 'The highest value is the maximum, which is used in finding the range.'
      C: 'The arithmetic mean is found by adding and dividing; it is a different average.'
      D: 'The most frequently occurring score is the mode.'

  10:
    answer: D
    steps:
      - 'This is the effect of a change in demand on equilibrium.'
      - 'An increase in demand shifts the whole demand curve to the right. With supply unchanged, the new curve cuts the supply curve higher up and further to the right.'
      - 'At the old price there is now excess demand, so buyers bid the price up. The higher price draws out more supply along the supply curve, so both the equilibrium price and the equilibrium quantity rise.'
      - 'At Christmas the demand for chickens in Nigerian markets jumps. Sellers'' stocks do not change overnight, so the price of a chicken goes up and more chickens are sold.'
      - 'Remember: demand up, price up, quantity up.'
      - 'The trap is B. Curves shift; equilibrium price and quantity rise or fall. And an increase in demand pushes things outward, not inward.'
    hint: 'Shift the demand curve to the right along a fixed supply curve. Where is the new crossing point?'
    why:
      A: 'Equilibrium changes whenever demand changes and supply does not.'
      B: 'Price and quantity rise or fall; it is curves that shift, and an increase in demand moves outward.'
      C: 'A fall in price and quantity follows a decrease in demand, not an increase.'

  11:
    answer: A
    steps:
      - 'This is the law of variable proportions, through total product (TP) and marginal product (MP).'
      - 'Marginal product is the extra output from one more unit of the variable factor: $\text{MP} = \dfrac{\Delta \text{TP}}{\Delta L}$.'
      - 'While MP is positive, each extra worker adds to TP, so TP is still rising. When MP falls to zero, the next worker adds nothing and TP stops rising: that is its peak. After that MP is negative and TP falls.'
      - 'On a cassava farm, adding labourers raises output until the farm is so crowded that one more labourer adds nothing; at that point output is at its maximum.'
      - 'Remember: TP is at the top when MP hits zero.'
      - 'The trap is B. While MP is greater than zero, TP is still climbing, so it has not yet reached its maximum.'
    hint: 'If one more worker adds nothing at all to output, what has total output reached?'
    why:
      B: 'While MP is positive, TP is still rising, so it is not yet at its maximum.'
      C: 'AP is zero only when there is no output at all.'
      D: 'AP is positive whenever there is any output; it says nothing about the peak of TP.'

  12:
    answer: C
    steps:
      - 'This is the price elasticity of supply (PES).'
      - 'PES measures how strongly quantity supplied responds to a change in price: $\text{PES} = \dfrac{\%\,\Delta Q_s}{\%\,\Delta P}$.'
      - 'Data: $P_1 = 1$, $P_2 = 2$; $Q_1 = 60$, $Q_2 = 120$. Percentage change in quantity $= \dfrac{120 - 60}{60} \times 100 = 100\%$. Percentage change in price $= \dfrac{2 - 1}{1} \times 100 = 100\%$.'
      - '$\text{PES} = \dfrac{100\%}{100\%} = 1$. Check: price doubled and quantity supplied doubled, so the response is exactly in proportion: unitary elasticity.'
      - 'If a poultry farmer in Ogun doubles the trays of eggs he supplies when the price per tray doubles, his supply has unit elasticity.'
      - 'The trap is D, 2. That is the new price, or the ratio of the quantities, not the ratio of the percentage changes.'
    hint: 'Find the percentage change in quantity and the percentage change in price, then divide.'
    why:
      A: 'There is no ratio here that gives 4; it would need quantity to rise four times as fast as price.'
      B: '25 does not come from the percentage changes; both are 100%.'
      D: '2 is the new price, or 120 ÷ 60; elasticity divides the percentage changes, which are equal.'

  13:
    answer: C
    steps:
      - 'This is consumer equilibrium in indifference curve analysis.'
      - 'The marginal rate of substitution of X for Y ($\text{MRS}_{xy}$) is the amount of Y the consumer will give up for one more unit of X while staying equally satisfied. It is the slope of the indifference curve.'
      - 'The consumer is in equilibrium where the budget line just touches the highest indifference curve he can reach. At that point the two slopes are equal, so $\text{MRS}_{xy} = \dfrac{P_x}{P_y}$, the ratio of the two prices.'
      - 'If a plate of rice costs ₦400 and a bottle of malt costs ₦200, the price ratio is 2. Ada is in equilibrium only when she would give up exactly 2 bottles of malt for one more plate of rice.'
      - 'Remember: at equilibrium, the rate you will swap equals the rate the market swaps.'
      - 'The trap is A. Adding the prices has no meaning here; it is the ratio, the slope of the budget line, that matters.'
    hint: 'At equilibrium the indifference curve touches the budget line. What is the slope of the budget line?'
    why:
      A: 'The sum of prices is not the slope of the budget line; the ratio is.'
      B: 'The product of the prices has no part in the equilibrium condition.'
      D: 'The difference between the prices is not the slope of the budget line.'

  14:
    answer: C
    steps:
      - 'This is minimum price legislation, a price floor.'
      - 'A minimum price is a price set by law below which a good must not be sold. To have any effect it is fixed above the equilibrium price, usually to protect producers such as farmers.'
      - 'At the higher price, buyers move up the demand curve and buy less, while sellers move up the supply curve and offer more. Quantity supplied is now greater than quantity demanded, and the difference is a surplus.'
      - 'If the government fixed a minimum price for maize well above the market price, farmers in the North would grow more maize than buyers want, and the surplus would pile up in stores unless the government bought it.'
      - 'Remember: floor above, surplus below.'
      - 'The trap is B. More is offered at the higher price, but that is a movement along the supply curve, not an increase in supply (a shift).'
    hint: 'At a price above equilibrium, compare how much buyers want with how much sellers offer.'
    why:
      A: 'Sellers offer more, not less, at a higher price.'
      B: 'More is offered, but by moving along the supply curve; supply itself does not increase.'
      D: 'A higher price reduces the quantity demanded and creates a surplus, not scarcity.'

  15:
    answer: B
    steps:
      - 'This is ordinal utility.'
      - 'Ordinal utility says satisfaction cannot be measured in units; a consumer can only rank goods in order of preference: first, second, third.'
      - 'Instead of saying "this orange gives me 10 utils", the consumer says "I prefer the orange to the banana". This ranking is the basis of indifference curve analysis.'
      - 'A student choosing what to buy at the school tuck shop ranks meat pie first, puff-puff second and chin-chin third, without giving each a number.'
      - 'Remember: ordinal, order; cardinal, counting.'
      - 'The trap is C, cardinal utility. Cardinal utility measures satisfaction in numbers (utils), not by ranking.'
    hint: 'Which approach only puts goods in order, first, second, third?'
    why:
      A: 'Marginal utility is the extra satisfaction from one more unit, measured in the cardinal approach.'
      C: 'Cardinal utility measures satisfaction in numbers, not by ranking.'
      D: 'Total utility is the sum of satisfaction, measured in the cardinal approach.'

  16:
    answer: C
    steps:
      - 'This is elastic supply.'
      - 'Supply is elastic when the price elasticity of supply is greater than 1: $\dfrac{\%\,\Delta Q_s}{\%\,\Delta P} > 1$.'
      - 'So when the price rises, quantity supplied rises by a bigger percentage than the price did. For example, a 10% price rise with a PES of 2 makes quantity supplied rise by 20%.'
      - 'A sachet water factory with spare machines can quickly raise output when the price per bag goes up, so its supply is elastic.'
      - 'Remember: elastic means stretchy; the response is bigger than the push.'
      - 'The trap is D. A response equal to the price change is unitary elasticity, not elastic supply.'
    hint: 'Elastic supply means PES is greater than 1. Compare the change in quantity with the change in price.'
    why:
      A: 'A smaller response than the price change is inelastic supply.'
      B: 'Quantity supplied rises with price on a normal supply curve, whether elastic or not.'
      D: 'An equal percentage change is unitary elasticity, PES = 1.'

  17:
    answer: A
    steps:
      - 'This is the optimum output of a firm.'
      - 'The optimum output is the level of output at which average (total) cost is at its lowest, so each unit is produced as cheaply as possible.'
      - 'Average cost falls at first as fixed costs are spread over more units, then rises as diminishing returns set in. Its lowest point is where marginal cost cuts it. In the long run a perfectly competitive firm is pushed to produce exactly there, where price = minimum AC.'
      - 'A bakery in Aba whose cost per loaf is lowest at 2,000 loaves a day is at its optimum output when it bakes 2,000 loaves.'
      - 'Remember: optimum output, lowest average cost.'
      - 'The trap is B. The lowest point of AVC is the shut-down point, the least price at which the firm will stay open in the short run, not the optimum output.'
    hint: 'At what output is the cost of each unit as low as it can be?'
    why:
      B: 'Lowest AVC is the shut-down point, not the optimum output.'
      C: 'MC rises over a wide range of output, both before and after the lowest point of AC.'
      D: 'While MC is falling the firm is far below its lowest-cost output.'

  18:
    answer: A
    steps:
      - 'This is diseconomies of scale.'
      - 'Diseconomies of scale are the disadvantages that make average cost rise when a firm grows beyond its best size.'
      - 'As a firm grows, managers have more people, departments and branches to control. Communication slows, decisions are delayed, and workers feel less involved, so coordinating production becomes hard and each unit costs more.'
      - 'A very large government parastatal with offices across all 36 states can find that a simple decision passes through so many desks that work is delayed and costs rise.'
      - 'Remember: too big to manage, so cost per unit rises.'
      - 'The trap is C. A small market limits how far a firm can enjoy economies of scale, but it does not cause diseconomies; diseconomies come from being too large.'
    hint: 'What goes wrong inside a firm that has grown too large?'
    why:
      B: 'A shortage of labour affects any firm of any size; it is not what defines diseconomies of scale.'
      C: 'A small market limits economies of scale; diseconomies come from the firm being too big.'
      D: 'A general rise in raw material prices raises costs for all firms, whatever their size.'

  19:
    answer: D
    steps:
      - 'This is the law of variable proportions (the law of diminishing returns).'
      - 'The law states that as more units of a variable factor are added to a fixed factor, the marginal product of the variable factor will eventually fall.'
      - 'The law needs at least one fixed factor, such as land or a factory building. A factor is fixed only in the short run; in the long run all factors can be changed, and then we speak of returns to scale instead.'
      - 'A farmer in Benue with a fixed two hectares keeps adding labourers. After a point each extra labourer adds less yam than the one before.'
      - 'Remember: a fixed factor means the short run.'
      - 'The trap is A, the long run. In the long run no factor is fixed, so the law cannot apply.'
    hint: 'The law needs a fixed factor. In which period does a fixed factor exist?'
    why:
      A: 'In the long run all factors are variable, so there is no fixed factor for the law to work on.'
      B: 'The law applies to firms of every size, large or small.'
      C: 'The law applies to firms of every size, small or large.'

  20:
    answer: D
    steps:
      - 'This is producer equilibrium, the least-cost combination of factors, shown with isoquants and an isocost line.'
      - 'An isoquant joins all the combinations of capital and labour that give the same output; higher isoquants mean more output. The isocost line shows all the combinations the firm can buy with its budget.'
      - 'The optimal point is where the isocost line just touches (is tangent to) the highest isoquant it can reach. In the diagram that is S, on isoquant II. U and T are on the same budget line but on isoquant I, a lower output. R is on isoquant III, which the budget cannot reach.'
      - 'A block maker in Ibadan with ₦500,000 to spend on labourers and moulding machines chooses the mix that gives the most blocks for that money: that mix is the point of tangency.'
      - 'Remember: tangency, the highest output for the money.'
      - 'The trap is A, R. It gives more output, but it lies beyond the isocost line, so the firm cannot afford it.'
    hint: 'Look along the isocost line. At which point does it reach the highest isoquant?'
    why:
      A: 'R lies on isoquant III, above the isocost line, so the firm cannot afford it.'
      B: 'T is affordable but lies on isoquant I, a lower output than S gives for the same cost.'
      C: 'U is affordable but lies on isoquant I, a lower output than S gives for the same cost.'

  21:
    answer: B
    steps:
      - 'This is the difference between real income and nominal (money) income.'
      - 'Nominal income is the amount of money received. Real income is what that money can buy, its purchasing power.'
      - 'Real income = nominal income ÷ price level. If nominal income stays the same and real income rises, the price level must have fallen, so each naira buys more.'
      - 'If a teacher still earns ₦70,000 a month but the prices of garri, rice and transport fall, she can buy more with the same salary: her real income has risen.'
      - 'Remember: same money, lower prices, more goods.'
      - 'The trap is D. Rising prices would cut real income, not raise it.'
    hint: 'The money stayed the same, yet it buys more. What must have happened to prices?'
    why:
      A: 'Unemployment changes how many people earn, not what the same income can buy.'
      C: 'Employment changes how many people earn, not the purchasing power of a fixed income.'
      D: 'Rising prices would reduce real income, not increase it.'

  22:
    answer: A
    steps:
      - 'This is oligopoly, a market structure.'
      - 'Oligopoly is a market with a few sellers (large firms) selling identical or differentiated products.'
      - 'Because there are only a few sellers, each one watches the others closely; a price cut by one draws a reply from the rest. This interdependence is why oligopolists often compete with advertising rather than price.'
      - 'The Nigerian mobile phone market, served by a few networks such as MTN, Glo, Airtel and 9mobile, is an oligopoly.'
      - 'Remember: oligo means few, so few sellers.'
      - 'The trap is B. A market with a few buyers is an oligopsony, not an oligopoly.'
    hint: 'The Greek word "oligo" means few. Few what, in oligopoly?'
    why:
      B: 'A few buyers is oligopsony.'
      C: 'Many sellers is perfect competition or monopolistic competition.'
      D: 'A single seller is monopoly.'

  23:
    answer: D
    steps:
      - 'This is reading average total cost (ATC) from a cost diagram.'
      - 'ATC is total cost per unit of output: $\text{ATC} = \dfrac{\text{TC}}{Q} = \text{AVC} + \text{AFC}$. On the diagram it is the U-shaped curve labelled ATC.'
      - 'Go up from 20 units on the output axis to the ATC curve, then across to the cost axis. The dashed line meets it at ₦15. This is also where MC cuts ATC, at its lowest point, as MC always does.'
      - 'If a pure water factory''s cost per bag is lowest at ₦15 when it makes 20 bags, that ₦15 is its ATC at that output.'
      - 'Remember: up from the quantity, across to the cost, on the right curve.'
      - 'The trap is A, ₦20. That is the output, 20 units, read as if it were a cost.'
    hint: 'Go up from 20 units to the ATC curve and across to the cost axis.'
    why:
      A: '20 is the number of units on the output axis, not a cost.'
      B: 'No curve on the diagram is at ₦23 at 20 units.'
      C: 'No curve on the diagram is at ₦13 at 20 units; ATC there is ₦15.'

  24:
    answer: B
    steps:
      - 'This is total cost (TC), found from average total cost.'
      - 'Total cost is average total cost times output: $\text{TC} = \text{ATC} \times Q$.'
      - 'Data: Q = 20 units; from the diagram, ATC at 20 units = ₦15. Working: TC = ₦15 × 20 = ₦300.'
      - 'Check: ₦300 shared over 20 units gives ₦15 each, the ATC we read from the graph.'
      - 'A tailor whose cost averages ₦15 per button-hole on 20 button-holes has spent ₦300 in all.'
      - 'The trap is A, ₦360. It multiplies 20 by ₦18, the ATC at 10 units, not at 20 units.'
    hint: 'Read ATC at 20 units, then multiply by the 20 units.'
    why:
      A: 'Uses ₦18, the ATC at 10 units: 18 × 20 = 360.'
      C: 'Would need an ATC of ₦23 at 20 units, which the diagram does not show.'
      D: 'Would need an ATC of ₦20 at 20 units; 20 is the output, not the cost.'

  25:
    answer: C
    steps:
      - 'This is the profit of a monopolist, and when it disappears.'
      - 'Profit per unit = price − average cost (AC). Total profit = (P − AC) × Q.'
      - 'If price is above AC, every unit earns a profit. If price is brought down until it equals AC, profit per unit is zero, so the abnormal (supernormal) profit is eliminated and only normal profit, which is part of AC, remains.'
      - 'If a regulator made a sole electricity distributor charge a tariff just equal to its average cost of supply, it would earn no abnormal profit.'
      - 'Remember: P = AC, no profit, no loss.'
      - 'The trap is B, MC. Setting price equal to MC makes the monopolist produce the efficient output, but if AC is below that price it still makes a profit.'
    hint: 'Profit per unit is price minus average cost. When is that zero?'
    why:
      A: 'AFC is only part of cost; at P = AFC the firm cannot even cover its variable costs.'
      B: 'P = MC gives efficient output, but profit stays if price is still above AC.'
      D: 'At P = AVC the firm covers only variable costs and makes a loss equal to its fixed costs.'

  26:
    answer: A
    steps:
      - 'This is the bank consolidation policy in Nigeria.'
      - 'In July 2004 the Central Bank of Nigeria (CBN) ordered every bank to raise its minimum paid-up capital from ₦2 billion to ₦25 billion by the end of 2005.'
      - 'Banks that could not raise the money alone merged or were taken over. The number of banks fell from 89 to 25, but each was bigger and stronger, better able to fund large projects and to survive shocks. The aim was to increase the capital base of banks.'
      - 'Later rounds followed the same idea; in 2024 the CBN announced a new recapitalization, raising the minimum capital for banks with international licences to ₦500 billion.'
      - 'Remember: consolidation is about capital. ₦2 billion became ₦25 billion.'
      - 'The trap is D. Branches grew in some banks after mergers, but that was a result, not the aim; many branches were in fact closed after banks merged.'
    hint: 'What did the CBN order every bank to raise to ₦25 billion?'
    why:
      B: 'Many jobs were in fact lost when banks merged; employment was not the aim.'
      C: 'Banks sold shares to raise capital, but more shareholders was a means, not the aim.'
      D: 'More branches was not the aim, and many branches closed after mergers.'

  27:
    answer: C
    steps:
      - 'This is inflation, as explained by the quantity theory of money.'
      - 'Inflation is a persistent rise in the general price level. The quantity theory says $MV = PQ$: if the money supply M rises while output Q stays the same, the price level P must rise.'
      - 'More money in people''s hands raises spending, but the same amount of goods is available. Sellers raise prices to ration the goods: too much money chasing too few goods.'
      - 'When a government prints money to pay its bills and the farms and factories produce no more, prices in Nigerian markets climb.'
      - 'Remember: more money, same goods, higher prices.'
      - 'The trap is D, deflation. Deflation is a fall in the price level, caused by too little money or demand, the opposite of this case.'
    hint: 'More money is spent on the same quantity of goods. What happens to prices?'
    why:
      A: 'Money incomes may rise, but real incomes do not, because prices rise as fast.'
      B: 'Stagflation is inflation together with stagnant output and high unemployment; the question only gives extra money.'
      D: 'Deflation is a fall in prices, the opposite of what extra money does.'

  28:
    answer: A
    steps:
      - 'This is government spending in the national income accounts (the G in C + I + G + (X − M)).'
      - 'Only government spending on goods and services counts. Transfer payments, money given without any goods or services in return, are left out.'
      - 'Salaries and wages pay civil servants, teachers and soldiers for services they give now, so they count. Pensions, scholarships and welfare payments only move income from taxpayers to others; counting them would be double counting.'
      - 'The salary of a teacher in a federal government college counts in G; the pension of a retired teacher does not.'
      - 'Remember: pay for work counts; gifts of money do not.'
      - 'The trap is D. Social welfare payments are spent by the government, but they are transfer payments, so they are not part of G.'
    hint: 'Which payment is made in return for a service given now?'
    why:
      B: 'Pensions are transfer payments for past service, not for current output.'
      C: 'Scholarships are transfer payments; no output is given in return.'
      D: 'Welfare payments are transfer payments and are left out to avoid double counting.'

  29:
    answer: D
    steps:
      - 'This is the equilibrium level of national income.'
      - 'National income is in equilibrium when aggregate demand (planned spending) equals total output.'
      - 'If aggregate demand is lower than output, firms cannot sell all they make, and unsold stocks pile up. Firms cut production and lay off workers, so output, incomes and national income fall until spending and output are equal again.'
      - 'If a Kano textile mill finds its warehouse full of unsold cloth, it cuts its shifts, and its workers'' incomes fall.'
      - 'Remember: spending below output, stocks pile up, income falls.'
      - 'The trap is B. Equilibrium needs aggregate demand equal to output; here demand is lower.'
    hint: 'If firms cannot sell all they produce, what do they do next?'
    why:
      A: 'Income cannot stay constant while unsold stocks keep piling up.'
      B: 'Equilibrium needs aggregate demand equal to output, not lower.'
      C: 'National income rises only when aggregate demand is greater than output.'

  30:
    answer: D
    steps:
      - 'This is commodity money, the earliest form of money.'
      - 'Commodity money is a useful good, accepted by everyone in exchange, that also serves as money.'
      - 'Barter, the direct exchange of goods for goods, needs a double coincidence of wants. To get round this, people began to use goods that everybody wanted, such as cattle, salt or cloth. Precious metals, coins and notes came much later.'
      - 'In old West Africa, cowries, manillas, salt and cloth were used as money.'
      - 'Remember: first goods, then gold, then coins, then notes.'
      - 'The trap is B, precious metals. Gold and silver came later than the commodities first used in the barter era.'
    hint: 'Before metals and paper, what did people use to pay for things?'
    why:
      A: 'Paper notes came last of all, long after barter.'
      B: 'Precious metals came after the early commodities such as cowries and cattle.'
      C: 'Coins came after precious metals were weighed out in bars.'

  31:
    answer: C
    steps:
      - 'This is economic development.'
      - 'Economic development is a sustained increase in per capita income (income per head) that comes with better living standards: better health, education and housing, and less poverty.'
      - 'Per capita income = national income ÷ population. When it rises steadily over many years, and not just for one good harvest or one oil boom, the average person can afford more and the economy is developing.'
      - 'Nigeria''s oil boom of the 1970s raised income for a few years, but development needs the rise to last and to reach ordinary people.'
      - 'Remember: development is sustained, and per head.'
      - 'The trap is B. Using more of existing capacity raises output for a time, but it is not a sustained rise in income per head.'
    hint: 'Look for the option that is both lasting and measured per person.'
    why:
      A: 'Military spending can rise without any rise in living standards.'
      B: 'Better capacity utilization raises output for a time, but it is not lasting growth in income per head.'
      D: 'An even distribution matters, but on its own it does not mean the economy is producing more.'

  32:
    answer: C
    steps:
      - 'This is economic growth and how it is measured.'
      - 'Economic growth is an increase in the real output of goods and services over time. It is measured by real GDP, GDP at constant prices.'
      - 'GDP at current prices rises when prices rise even if output does not. Valuing each year''s output at the prices of one base year removes the effect of inflation: real GDP = nominal GDP ÷ GDP deflator × 100. Only then does a rise mean more goods.'
      - 'The National Bureau of Statistics reports Nigeria''s growth rate from real GDP at constant prices, valuing every year''s output at the prices of one base year.'
      - 'Remember: real growth needs constant prices.'
      - 'The trap is D. The GDP deflator is a price index; it is used to turn nominal GDP into real GDP, but it measures prices, not growth.'
    hint: 'To see if output has really grown, which prices must every year''s output be valued at?'
    why:
      A: 'The GDP gap is the difference between actual and potential output, not a measure of growth over time.'
      B: 'GDP at factor cost is still measured in current prices, so it rises with inflation.'
      D: 'The GDP deflator measures the price level, not the growth of output.'

  33:
    answer: D
    steps:
      - 'This is deficit financing, a tool of fiscal policy.'
      - 'Deficit financing means the government spends more than its revenue and covers the gap by borrowing or by creating money.'
      - 'The extra government spending raises aggregate demand. Firms see more sales, so they invest and hire more workers; through the multiplier, national income rises. It is used to lift an economy out of depression and to stimulate investment.'
      - 'Nigeria''s federal budgets usually run deficits, borrowed to build roads, rail and power that encourage private investment.'
      - 'Remember: spend more than you earn to get the economy moving.'
      - 'The trap is C. Deficit financing adds to demand, so it tends to cause inflation, not curb it.'
    hint: 'Spending more than revenue adds to demand. What is that meant to encourage?'
    why:
      A: 'Deficit financing spends beyond revenue; it does not raise revenue.'
      B: 'Extra government spending raises aggregate demand, not reduces it.'
      C: 'Added demand tends to cause inflation, not curb it.'

  34:
    answer: A
    steps:
      - 'This is the deflationary gap.'
      - 'A deflationary (recessionary) gap is the amount by which aggregate demand falls short of the 45° line (aggregate supply) at the full-employment level of income, $Y_f$.'
      - 'Look at $Y_f$ on the diagram. The 45° line shows the output at full employment. AD₁ lies below it there, so spending is too low to buy full-employment output; equilibrium falls back to E₁, below $Y_f$, with unemployment. The vertical distance X, from AD₁ up to the 45° line, is the deflationary gap.'
      - 'In a slump, when Nigerian households and firms cut spending, factories run below capacity and graduates cannot find jobs: the economy has a deflationary gap.'
      - 'Remember: deflationary, demand is deficient, the gap is below the line.'
      - 'The trap is B, K. K is where AD₂ rises above the 45° line, the opposite case, an inflationary gap.'
    hint: 'At full-employment income, which AD line is below the 45° line?'
    why:
      B: 'K is the excess of AD₂ over the 45° line at full employment, an inflationary gap.'
      C: 'X + K is the distance between the two AD lines, not a gap measured from the 45° line.'
      D: 'X − K has no meaning on this diagram.'

  35:
    answer: C
    steps:
      - 'This is the inflationary gap.'
      - 'An inflationary gap is the amount by which aggregate demand is greater than the 45° line (aggregate supply) at the full-employment level of income, $Y_f$.'
      - 'At $Y_f$ all resources are already employed, so output cannot rise. AD₂ lies above the 45° line there; the extra spending, K, cannot buy more goods, so it pulls prices up. Equilibrium E₂ lies beyond $Y_f$ only in money terms.'
      - 'When government spending in Nigeria surged during the oil boom of the 1970s, demand ran ahead of what the economy could produce, and prices rose sharply.'
      - 'Remember: inflationary, demand is in excess, the gap is above the line.'
      - 'The trap is D. The deflationary gap is X, below the 45° line; K is above it.'
    hint: 'At full-employment income, is AD₂ above or below the 45° line?'
    why:
      A: 'A recessionary gap is a deflationary gap, which is X below the 45° line, not K.'
      B: 'A GNP gap compares actual and potential output; K shows excess demand.'
      D: 'The deflationary gap is X, where AD₁ is below the 45° line.'

  36:
    answer: A
    steps:
      - 'This is the import-substitution strategy of industrialization.'
      - 'Import substitution means producing at home the goods that the country used to import.'
      - 'The government protects new local industries with tariffs and import bans, so that home factories can take over the market that imports once served. This saves foreign exchange, creates jobs and builds local skills.'
      - 'Nigeria followed this strategy after independence, with local assembly of cars and the production of cement, beer, soap and textiles to replace imported ones.'
      - 'Remember: substitute imports with home production.'
      - 'The trap is B. Some import-substituting firms were large, but the strategy is about where goods are made, not the scale of production.'
    hint: 'To substitute for imports, where must the goods now be made?'
    why:
      B: 'The strategy is about producing at home, whatever the scale of the firm.'
      C: 'Import substitution aims to reduce importation, not encourage it.'
      D: 'Encouraging exports is a different strategy, export promotion.'

  37:
    answer: C
    steps:
      - 'This is the upstream sector of the oil industry.'
      - 'The upstream sector covers finding and producing crude oil: exploration, drilling and production.'
      - 'The oil industry is a chain. Upstream comes first, getting the crude out of the ground. Downstream comes after: refining the crude, then distributing and marketing the products such as petrol and kerosene.'
      - 'Oil companies drilling wells in the Niger Delta are upstream; the refinery at Port Harcourt and the filling stations in your town are downstream.'
      - 'Remember: upstream is up at the source; downstream flows out to the customer.'
      - 'The trap is D, refining. Refining turns crude into products, which is downstream.'
    hint: 'Upstream is at the source. Which activity happens first in the oil chain?'
    why:
      A: 'Managing pollution is a concern of every stage, not the definition of upstream.'
      B: 'Marketing refined products is a downstream activity.'
      D: 'Refining crude oil is a downstream activity.'

  38:
    answer: C
    steps:
      - 'This is a problem of agriculture in Nigeria.'
      - 'Agricultural production in Nigeria is held back by poor implementation of policies: good programmes are announced but not carried through.'
      - 'Programmes such as Operation Feed the Nation, the Green Revolution and the Agricultural Transformation Agenda were launched with promise, but inputs arrived late, funds were diverted, and many programmes ended when governments changed. Farmers could not plan on them.'
      - 'A farmer in Niger State may wait for subsidized fertilizer that reaches the market only after the planting season is over.'
      - 'Remember: good plans on paper, poor results on the farm.'
      - 'The trap is B. Demand for food in Nigeria is large and growing; the problem is on the supply side.'
    hint: 'Nigeria has had many farm programmes. What went wrong with them?'
    why:
      A: 'Stabilization measures concern prices and incomes, not the main constraint on output.'
      B: 'Demand for food in Nigeria is high and growing; it is not inadequate.'
      D: 'A balance of payments deficit is a result of weak exports, not a constraint on farming itself.'

  39:
    answer: A
    steps:
      - 'This is the Nigerian National Petroleum Corporation (NNPC).'
      - 'The NNPC was set up in 1977 to oversee the development of Nigeria''s oil and gas industry on behalf of the government.'
      - 'It holds the government''s share in joint ventures with foreign oil companies, takes part in exploration and production, runs the refineries and pipelines, and markets Nigeria''s crude. Through all these, it oversees the development of the oil sector.'
      - 'Since 2022 it has been NNPC Limited, a company under the Petroleum Industry Act, but it is still the national oil company.'
      - 'Remember: NNPC is the government''s hand in the oil industry.'
      - 'The trap is B. Developing the oil-producing areas was given to other bodies, such as OMPADEC and later the NDDC.'
    hint: 'NNPC is the national oil company. What does it do for the whole oil sector?'
    why:
      B: 'Developing the oil-producing areas is the work of bodies like the NDDC.'
      C: 'Fixing product prices was done by regulators such as the PPPRA, not the NNPC''s main role.'
      D: 'Supplying products is one task, but the main function covers the whole oil sector.'

  40:
    answer: A
    steps:
      - 'This is the role of agriculture in economic development.'
      - 'The first and most direct contribution of agriculture is food for the population.'
      - 'Heavy investment in machines, irrigation, improved seeds, fertilizer and storage raises yields per hectare. More output from the farms means enough food for the people, lower food prices and less spending on food imports.'
      - 'Irrigation schemes along the rivers in Kebbi and Sokoto let farmers grow rice twice a year, raising Nigeria''s rice output.'
      - 'Remember: invest in the farm, fill the plate.'
      - 'The trap is B. A busier commodity market may follow, but the direct result of more farm output is more food.'
    hint: 'What do farms produce first of all?'
    why:
      B: 'A vibrant commodity market may follow, but it is not the direct result.'
      C: 'Capital inflow is money coming into the country, not a result of investing at home.'
      D: 'Export prices are set on world markets, not by how much one country invests.'

  41:
    answer: C
    steps:
      - 'This is how to encourage industrial development.'
      - 'Infrastructure means the basic services every firm needs: electricity, roads, rail, water and telecommunications.'
      - 'Good infrastructure lowers the costs of every firm at once. Without steady power, firms must run generators, which raises their costs and makes their goods dearer than imports. Efficient infrastructure attracts new firms and helps existing ones grow.'
      - 'Many Nigerian manufacturers say diesel for generators is one of their biggest costs; reliable electricity would cut their costs more than any subsidy.'
      - 'Remember: power, roads and water first, then factories follow.'
      - 'The trap is B. Subsidies help only the firms that receive them, for as long as the budget can pay, while infrastructure helps all firms for many years.'
    hint: 'Which option lowers the costs of every factory at once, year after year?'
    why:
      A: 'Signing the WTO treaty opens markets to foreign goods; it does not by itself build local industry.'
      B: 'Subsidies help only the firms that get them and strain the budget.'
      D: 'Direct government participation has often led to inefficient public enterprises.'

  42:
    answer: B
    steps:
      - 'This is the balance of payments (BOP).'
      - 'The balance of payments is a systematic record of all the economic transactions between the residents of a country and the rest of the world over a period, usually a year.'
      - 'It has several accounts: the current account (visible trade, services, income and transfers), the capital account and the financial account. The balance of trade is only the visible part of the current account.'
      - 'Nigeria''s balance of payments records crude oil exports, imports of machinery and rice, money sent home by Nigerians abroad, and foreign investment coming in.'
      - 'Remember: the BOP records everything; the balance of trade records only goods.'
      - 'The trap is D. The balance of trade covers only goods (visible items), not all of a country''s transactions.'
    hint: 'Which record covers all transactions, not just goods or just one account?'
    why:
      A: 'The capital account is only one part of the balance of payments.'
      C: 'The current account is only one part of the balance of payments.'
      D: 'The balance of trade covers only visible goods.'

  43:
    answer: D
    steps:
      - 'This is privatization.'
      - 'Privatization is the transfer of the government''s shares (ownership) in public corporations to private individuals and firms.'
      - 'The government sells its shares because many public enterprises were inefficient and loss-making. Private owners, risking their own money, are expected to run them for profit and so more efficiently.'
      - 'In 2013 the Power Holding Company of Nigeria (PHCN) was broken up and its generation and distribution companies were sold to private investors.'
      - 'Remember: privatize, make it private.'
      - 'The trap is C, commercialization. In commercialization the government keeps ownership but runs the enterprise to make a profit.'
    hint: 'If the government sells its shares to private owners, what is that called?'
    why:
      A: 'A concession grants a firm the right to run an asset for a period, without transferring its shares.'
      B: 'Incorporation is registering a business as a company.'
      C: 'Commercialization keeps government ownership while running the enterprise for profit.'

  44:
    answer: A
    steps:
      - 'This is the dual exchange rate system.'
      - 'A dual exchange rate system is one in which two exchange rates exist side by side: an official rate set by the central bank, and an autonomous (market) rate.'
      - 'The official rate is used for some transactions, such as government imports or debt payments, while the market rate, set by demand and supply, is used for the rest.'
      - 'In 1986 Nigeria ran the Second-tier Foreign Exchange Market beside the official first-tier rate, a dual exchange rate system. Since 2023 the CBN has worked to unify the rates into one.'
      - 'Remember: dual means two.'
      - 'The trap is D. A multiple exchange rate system has many rates for different kinds of transactions, not just the two named here.'
    hint: 'How many rates are named in the question?'
    why:
      B: 'A managed float is a single rate set by the market with central bank intervention.'
      C: 'A market-determined system has one rate set by demand and supply alone.'
      D: 'A multiple system has several rates for different transactions, not exactly two.'

  45:
    answer: B
    steps:
      - 'This is the Malthusian theory of population.'
      - 'Thomas Malthus (1798) said population grows in a geometric progression (2, 4, 8, 16) while food grows in an arithmetic progression (1, 2, 3, 4), so population would outrun food, and famine, war and disease would follow.'
      - 'In modern economies this has not happened, mainly because of technical progress. Better seeds, fertilizer, irrigation and machines have raised food output far faster than Malthus thought possible.'
      - 'High-yield maize and rice varieties have let Nigerian farmers grow far more per hectare than their grandparents did.'
      - 'Remember: Malthus did not see the tractor coming.'
      - 'The trap is A. Birth control has slowed population growth, which also weakens the theory, but the main reason is that technical progress raised food supply.'
    hint: 'Malthus said food could not keep up with population. What made food grow faster than he expected?'
    why:
      A: 'Birth control slowed population growth, but the main failure of the theory is on the food side.'
      C: 'Government policies have had a smaller effect than technical progress in farming.'
      D: 'Natural disasters are among the positive checks Malthus predicted, so they support his theory.'

  46:
    answer: B
    steps:
      - 'This is optimum population.'
      - 'Optimum population is the size of population which, working with the country''s resources and technology, gives the highest income per head.'
      - 'With too few people, resources lie idle and income per head is below its peak (under-population). With too many, each person has too little land and capital, and income per head falls (over-population). The optimum is the point between, where income per head is greatest.'
      - 'A village farm with too few hands leaves land unused, and one with too many has more workers than land; somewhere between, each person''s share of the harvest is biggest.'
      - 'Remember: optimum population, maximum income per head.'
      - 'The trap is D. Development is a wider idea; optimum population is defined by income per head.'
    hint: 'Optimum population is defined by one measure. Which one?'
    why:
      A: 'Industrial development is not the measure used to define optimum population.'
      C: 'Government revenue is not the measure used to define optimum population.'
      D: 'Economic development is broader; optimum population is defined by income per head.'

  47:
    answer: B
    steps:
      - 'This is horizontal mobility of labour, a kind of occupational mobility.'
      - 'Occupational mobility is the ease with which labour moves from one job or industry to another. It is horizontal when the move is at the same level, and vertical when it is up or down the grades.'
      - 'A worker who leaves one industry for another at about the same level of job has moved sideways, so it is horizontal mobility.'
      - 'A driver who leaves a bottling company to drive for a bank, at the same grade, has shown horizontal mobility.'
      - 'Remember: horizontal is sideways, vertical is up or down.'
      - 'The trap is D. Vertical mobility is a promotion or demotion, a change of rank, not a sideways move.'
    hint: 'Is the worker moving sideways or up the ladder?'
    why:
      A: 'Geographical mobility is moving from one place to another.'
      C: 'Professional advancement is a promotion, which is vertical mobility.'
      D: 'Vertical mobility is moving up or down the grades, not sideways.'

  48:
    answer: B
    steps:
      - 'This is the wage rate.'
      - 'The wage rate is the payment for labour per unit of time, such as per hour or per day.'
      - 'Wages are usually paid to workers by the hour, the day or the week, while a salary is a fixed amount paid monthly or yearly. Total wages = wage rate × hours worked.'
      - 'A bricklayer paid ₦1,500 an hour on a building site in Abuja has a wage rate of ₦1,500 per hour; working 8 hours, he earns ₦12,000.'
      - 'Remember: rate means per unit of time.'
      - 'The trap is A, salary. A salary is a fixed monthly or yearly payment, not a payment per hour.'
    hint: 'What is the name for pay per unit of time?'
    why:
      A: 'A salary is a fixed monthly or yearly payment.'
      C: 'Cost is the general term for what is spent on any input.'
      D: 'A bonus is an extra payment on top of normal pay.'

  49:
    answer: D
    steps:
      - 'This is the law of comparative advantage (comparative cost).'
      - 'A country has a comparative advantage in a good if it can produce it at a lower opportunity cost than another country.'
      - 'If each country specializes in the good it produces at the lower opportunity cost and trades for the rest, total world output rises and both countries gain. This is why international trade takes place, even when one country is better at producing everything.'
      - 'Nigeria grows cocoa at low cost in Ondo and Ogun, and Japan makes cars and electronics at low cost. Each specializes and trades, and both are better off.'
      - 'Remember: do what you do relatively best, and trade for the rest.'
      - 'The trap is C. Opportunity cost is the measure used to find comparative advantage, but the reason for trade is the difference in costs, comparative advantage.'
    hint: 'Each country specializes in the good it produces at the lowest opportunity cost. What is that principle called?'
    why:
      A: 'Marginal utility explains a consumer''s choices, not why countries trade.'
      B: 'Trade rests on efficiency in specialization, not on inefficiency.'
      C: 'Opportunity cost is the measure; the principle that explains trade is comparative advantage.'

  50:
    answer: D
    steps:
      - 'This is the World Trade Organization (WTO).'
      - 'The WTO was set up in 1995, taking over from the General Agreement on Tariffs and Trade (GATT), to promote free trade among nations.'
      - 'It sets rules for world trade, holds negotiations to lower tariffs and quotas, and settles trade disputes between members. In all this it works to minimize obstacles to international trade and investment.'
      - 'Nigeria joined the WTO in 1995 as a founding member.'
      - 'Remember: WTO, World Trade Opened up.'
      - 'The trap is A. Stabilizing oil prices is the work of OPEC, not the WTO.'
    hint: 'What does the WTO try to remove from world trade?'
    why:
      A: 'Stabilizing oil prices is the work of OPEC.'
      B: 'The WTO lowers barriers to trade; it cannot ensure equal participation of all countries.'
      C: 'Modernising economies is the aim of development bodies like the World Bank.'
