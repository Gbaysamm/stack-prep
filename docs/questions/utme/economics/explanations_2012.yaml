format_version: 1
exam_year: 2012
subject: ECO
explanations:
  2:
    answer: B
    steps:
      - 'This is about the socialist, or centrally planned, economy and its weaknesses.'
      - 'In a socialist economy the state owns the means of production and a central planning body decides what to produce, how to produce it and for whom.'
      - 'Because the planners, not the buyers, decide what is made, consumers cannot direct production with their spending. Consumer sovereignty, the power of buyers to decide what is produced, is lost, and people often face queues and shortages of what they want.'
      - 'In a Nigerian market, if more people want tomatoes, the price rises and farmers grow more. Under full central planning the quota for tomatoes would be set in an office, whatever buyers wanted.'
      - 'Remember: in a free market the consumer is king; in a planned economy the planner is king.'
      - 'The trap is A, corruption. It can happen in any system, so it is not a feature of socialism as such.'
    hint: 'Who decides what is produced in a socialist economy, the buyers or the state?'
    why:
      A: 'Corruption can occur under any economic system, so it is not the textbook drawback of socialism.'
      C: 'Socialism aims to reduce income inequality; entrenched inequality is a criticism of capitalism.'
      D: 'Planned economies usually give everyone a job, so high unemployment is not their typical problem.'

  3:
    answer: D
    steps:
      - 'This is about positive and normative statements in economics.'
      - 'A positive statement says what is, was or will be, and it can be tested against the facts. A normative statement says what ought to be, so it carries a value judgement such as "should" or "ought".'
      - 'The statement "privatization will lead to efficient management of resources" makes a prediction. We can check it by looking at how firms perform after they are privatized, so it is positive.'
      - 'In Nigeria, the claim that privatizing the power companies in 2013 would improve electricity supply can be checked against the number of hours of light people actually get.'
      - 'Remember: positive can be proved or disproved; normative is a matter of opinion.'
      - 'The trap is A, normative. "Efficient" sounds like praise, but the sentence has no "should"; it only predicts a result that can be measured.'
    hint: 'Can the statement be checked against facts, or is it someone''s opinion of what ought to be?'
    why:
      A: 'Normative statements say what ought to be; this one predicts an outcome that can be tested.'
      B: 'Inductive reasoning draws a general rule from many observed cases; the statement reports no cases.'
      C: 'Deductive reasoning draws a conclusion from a stated general premise; no premise is given here.'

  4:
    answer: B
    steps:
      - 'This is about the slope of a graph as a tool of economic analysis.'
      - 'The slope of a line is the change in the vertical variable divided by the change in the horizontal variable. Its sign is plus or minus.'
      - 'A positive slope means the two variables move in the same direction, a direct relationship, like price and quantity supplied. A negative slope means they move in opposite directions, an inverse relationship, like price and quantity demanded.'
      - 'When the price of garri rises, traders bring more to the market (positive slope of supply), but buyers buy less (negative slope of demand).'
      - 'Remember: the sign tells the direction of the relationship; the size of the slope tells how strong it is.'
      - 'The trap is C. The magnitude of the change comes from the size of the slope, not its sign.'
    hint: 'What does a plus sign tell you that a minus sign does not?'
    why:
      A: 'Whether a good is normal or inferior depends on how demand reacts to income, not on the sign of any graph''s slope.'
      C: 'The magnitude comes from the size of the slope; the sign only gives the direction.'
      D: 'Units of measurement are chosen before drawing; the slope cannot decide them.'

  5:
    answer: C
    steps:
      - 'This is reading a pie chart. The whole circle, 360°, stands for the whole GDP.'
      - 'Rule: a sector''s percentage share = its angle ÷ 360° × 100.'
      - 'Data: oil 160°, agriculture 90°, mining 30°, manufacturing unmarked. Manufacturing angle = 360° − (160° + 90° + 30°) = 360° − 280° = 80°.'
      - 'Percentage = $\dfrac{80}{360} \times 100 = 22.2\%$. Check: oil is 44.4%, agriculture 25%, mining 8.3% and manufacturing 22.2%; together they make 100%.'
      - 'Think of a mama put stall sharing a pot of rice: a slice of 80° out of the full 360° is a little under a quarter of the pot.'
      - 'The trap is D, 25.0%. That is the agriculture slice, 90° out of 360°, not manufacturing.'
    hint: 'The angles round the centre add up to 360°. What is left for manufacturing?'
    why:
      A: '67.5% does not come from any slice; manufacturing''s 80° is far less than half of 360°.'
      B: '40.0% would need an angle of 144°; manufacturing has only 80°.'
      D: '25.0% is agriculture''s share, 90° out of 360°.'

  6:
    answer: B
    steps:
      - 'This is valuing slices of a pie chart when the total is known.'
      - 'Rule: a sector''s value = its angle ÷ 360° × the total GDP.'
      - 'Data: GDP ₦60 billion, oil 160°, manufacturing 360° − (160° + 90° + 30°) = 80°.'
      - 'Oil = $\dfrac{160}{360} \times 60 = 26.7$ billion naira. Manufacturing = $\dfrac{80}{360} \times 60 = 13.3$ billion naira.'
      - 'Difference = ₦26.7 billion − ₦13.3 billion = ₦13.3 billion. Check: the gap in angle is 160° − 80° = 80°, and $\dfrac{80}{360} \times 60 = 13.3$ too.'
      - 'In Nigeria the oil sector''s share of exports is far bigger than its share of GDP, so reading these charts carefully matters.'
      - 'The trap is D, ₦26.6 billion. That is roughly the oil sector''s own contribution, before the manufacturing part is taken away.'
    hint: 'Work out the manufacturing angle first, then value each slice out of ₦60 billion.'
    why:
      A: 'Does not match any slice; the difference in angle is 80°, which is ₦13.3 billion.'
      C: '₦21.7 billion does not come from the chart; 160° and 80° give ₦26.7 billion and ₦13.3 billion.'
      D: 'This is about the size of the oil sector alone, not the difference.'

  7:
    answer: D
    steps:
      - 'This is the difference between a change in quantity demanded and a change in demand.'
      - 'A change in quantity demanded is caused only by a change in the good''s own price. It is a movement along the same demand curve. A change in demand is caused by other factors (income, tastes, prices of other goods) and shifts the whole curve.'
      - 'Here buyers take less rice, 200 tonnes instead of 250, because the price of rice itself rose. Nothing else changed, so they move up along the demand curve.'
      - 'When the price of a bag of rice in the market goes up, the same families buy fewer bags. Their demand schedule has not changed; they have just moved to a higher price on it.'
      - 'Remember: own price moves you along the curve; anything else shifts the curve.'
      - 'The trap is B, demand. A fall in demand would mean less is bought at the same price, which is not what happened.'
    hint: 'What caused the fall, the price of rice itself or something else?'
    why:
      A: 'Income did not change; the fall came from the rise in the rice price.'
      B: 'A change in demand shifts the curve and comes from factors other than the good''s own price.'
      C: 'Nothing says tastes changed; the price change alone explains the fall.'

  8:
    answer: C
    steps:
      - 'This is income as a determinant of demand.'
      - 'Demand depends on more than price. When a factor other than price changes, the whole demand curve shifts. For a normal good, a rise in income raises demand.'
      - 'With more income, buyers want more of a normal good at every price, so the demand curve shifts to the right. Ceteris paribus means "other things being equal", so only income has changed.'
      - 'When civil servants receive a salary increase, more of them buy meat and fish at the same market prices, so the demand for meat shifts right.'
      - 'Remember: more income, more demand, curve moves right (for a normal good).'
      - 'The trap is A. A movement along the curve comes only from a change in the good''s own price, and here it is income that changed.'
    hint: 'Income is not the good''s own price. Does a change in it move you along the curve or shift the curve?'
    why:
      A: 'A movement along the curve comes from a change in the good''s own price, not income.'
      B: 'A leftward shift happens for an inferior good when income rises; this is a normal good.'
      D: 'Income is a determinant of demand, so a change in it does move the demand curve.'

  9:
    answer: D
    steps:
      - 'This is price elasticity of demand (PED).'
      - 'PED measures how much quantity demanded responds to a change in price: $\text{PED} = \dfrac{\%\,\Delta Q_d}{\%\,\Delta P}$, taken without its minus sign.'
      - 'Data: price rises from ₦50 to ₦70, a change of ₦20. Quantity falls from 500 kg to 400 kg, a change of 100 kg.'
      - '$\%\,\Delta Q_d = \dfrac{100}{500} \times 100 = 20\%$ and $\%\,\Delta P = \dfrac{20}{50} \times 100 = 40\%$. So $\text{PED} = \dfrac{20}{40} = 0.5$.'
      - 'Check: price went up by a big 40% but quantity fell by only 20%, so demand is inelastic and the answer must be below 1. A trader selling beans at ₦70 instead of ₦50 still sells most of her stock.'
      - 'Remember: quantity on top, price at the bottom, "Q over P".'
      - 'The trap is B, 2.0. It turns the fraction upside down, putting the price change on top.'
    hint: 'Find the percentage change in quantity and in price, each from its starting value.'
    why:
      A: '5.0 uses the raw changes 100 ÷ 20, not percentage changes.'
      B: 'Puts the percentage change in price over the change in quantity; the formula is the other way up.'
      C: '1.0 would need equal percentage changes; quantity changed by 20% and price by 40%.'

  10:
    answer: B
    steps:
      - 'This is classifying price elasticity of demand.'
      - 'Demand is inelastic when the percentage change in quantity demanded is smaller than the percentage change in price, so PED is less than 1 (but more than 0).'
      - 'Quantity falls from 1500 to 1492, a fall of 8 units: $\%\,\Delta Q_d = \dfrac{8}{1500} \times 100 \approx 0.53\%$. Price rose by 8%.'
      - '$\text{PED} = \dfrac{0.53}{8} \approx 0.07$, which is less than 1, so demand is inelastic. It is not zero, because quantity did fall a little.'
      - 'Salt and petrol behave like this in Nigeria: even when their prices rise, people buy almost as much as before.'
      - 'Remember: inelastic means buyers hardly react; elastic means they react strongly.'
      - 'The trap is D, perfectly inelastic. That would need no change at all in quantity, but quantity fell by 8 units.'
    hint: 'Turn the fall from 1500 to 1492 into a percentage and compare it with 8%.'
    why:
      A: 'Perfectly elastic demand means an infinite response; here buyers barely reacted.'
      C: 'Elastic demand needs a bigger percentage change in quantity than in price; 0.53% is far smaller than 8%.'
      D: 'Perfectly inelastic means quantity does not change at all, but it fell by 8 units.'

  11:
    answer: C
    steps:
      - 'This is the measurement of utility.'
      - 'Utility is the satisfaction a person gets from consuming a good. It is a feeling in the person''s own mind, so it is subjective.'
      - 'Because each person feels satisfaction in their own way, we cannot say that a plate of jollof rice gives Ade more satisfaction than it gives Ngozi. There is no common yardstick between two minds.'
      - 'Two students may both buy a bottle of malt at the same price, yet one enjoys it far more; no one can measure the difference.'
      - 'Remember: utility lives in the mind, so it cannot be carried from one mind to another and compared.'
      - 'The trap is A. Utils are only an imaginary unit used to describe one person''s choices; they do not let us compare two people.'
    hint: 'Where does satisfaction exist, and can anyone else measure it?'
    why:
      A: 'Utils are an imaginary unit for one person''s choices, so they cannot make comparison between people possible.'
      B: 'Total utility is no more observable than marginal utility; the real reason is that all utility is subjective.'
      D: 'Different incomes affect what people can buy, not whether their satisfactions can be compared.'

  12:
    answer: B
    steps:
      - 'This is the link between total utility (TU) and marginal utility (MU), and the law of diminishing marginal utility.'
      - 'Marginal utility is the extra satisfaction from one more unit; it is the slope of the total utility curve.'
      - 'When the slope of TU is declining, each extra unit adds less than the one before, so MU falls as consumption increases. Going the other way, if the consumer reduces the quantity he consumes, MU rises again.'
      - 'The first sachet of pure water on a hot afternoon gives great satisfaction, the fifth very little. Drink fewer sachets and the last one you drink is worth more to you.'
      - 'Remember: more units, lower MU; fewer units, higher MU.'
      - 'The trap is C. Increasing the quantity consumed is exactly what makes MU fall when TU''s slope is declining.'
    hint: 'MU is the slope of TU. If the slope falls as you consume more, what happens when you consume less?'
    why:
      A: 'Stopping leaves MU where it is; it does not make MU rise.'
      C: 'Consuming more is what makes MU fall when the slope of TU is declining.'
      D: 'Consuming another good does not change the MU of this one in the standard theory.'

  13:
    answer: D
    steps:
      - 'This is consumer equilibrium with indifference curves.'
      - 'A consumer is in equilibrium where the budget line just touches (is tangent to) the highest indifference curve he can reach. There the rate at which he will swap the goods equals the rate at which the market swaps them.'
      - 'In the diagram, N and M lie on the budget line, so they are affordable, but they are on the lower curve IC₁. Moving along the line towards K takes him onto a higher curve. K is where the budget line touches IC₂, the highest curve he can reach, so K is the best point.'
      - 'A student sharing ₦1,000 between bread and eggs tries different mixes until no other mix she can afford makes her happier; that mix is her K.'
      - 'Remember: equilibrium is where the line kisses the highest curve.'
      - 'The trap is A, N. It is on the budget line, but there the line cuts through IC₁, so a better mix is still affordable.'
    hint: 'Look for the point where the budget line touches a curve without cutting it.'
    why:
      A: 'N is affordable, but the budget line cuts IC₁ there, so moving along the line reaches a higher curve.'
      B: 'P is inside the budget line, so the consumer is not spending all his income.'
      C: 'M is affordable, but it lies on the lower curve IC₁, where the line cuts the curve.'

  14:
    answer: D
    steps:
      - 'This is moving along a budget line between two bundles of goods.'
      - 'Along a budget line income and prices are fixed, so buying more of one good means buying less of the other.'
      - 'In the diagram, M is low and to the right: much X, little Y. K is higher and to the left: more Y, less X. So going from M to K the consumer increases his consumption of Y and reduces his consumption of X.'
      - 'With a fixed ₦2,000 pocket money, a student who wants more suya must buy fewer soft drinks.'
      - 'Remember: up the line means more Y; left along the line means less X.'
      - 'The trap is C. Moving left means less X, so spending on X falls, not rises.'
    hint: 'Compare the positions of M and K: which one is higher, and which one is further right?'
    why:
      A: 'This is the move from K to M, the opposite direction.'
      B: 'On one budget line total spending is fixed, so spending on both goods cannot rise together.'
      C: 'Going from M to K, X falls, so spending on X falls.'

  15:
    answer: A
    steps:
      - 'This is the determinants of supply, applied to an agricultural product.'
      - 'Supply is the quantity producers are willing and able to offer for sale at each price. Besides price, it depends on things like weather and season, costs of production and technology.'
      - 'Cocoa is a tree crop, and its harvest depends on rainfall and the season. A good rainy season gives a big crop and a dry year a poor one, so seasonal conditions shift the supply of cocoa.'
      - 'Cocoa farmers in Ondo bring in their main crop from about October; a poor rainy season means fewer bags for the buying agents.'
      - 'Remember: supply comes from the farm, demand comes from the buyers.'
      - 'The trap is C. The demand for beverages affects how much buyers want cocoa, which is the demand side, not the supply side.'
    hint: 'Which option acts on the farmer''s harvest, not on the buyer''s wants?'
    why:
      B: 'The incomes of cocoa drinkers affect how much cocoa is demanded, not how much farmers can produce.'
      C: 'The demand for beverages is a demand factor for cocoa, not a supply factor.'
      D: 'Close substitutes affect the demand for a good, not its supply.'

  16:
    answer: D
    steps:
      - 'This is elasticity of supply.'
      - 'Elasticity of supply = $\dfrac{\%\,\Delta Q_s}{\%\,\Delta P}$. If the quantity supplied does not change at all, the top is 0, so the elasticity is 0.'
      - 'An elasticity of 0 is called perfectly inelastic supply. The supply curve is a vertical line: whatever the price, the same quantity is offered.'
      - 'The number of seats in the National Stadium in Abuja is fixed. However high ticket prices go for a big match, no more seats can be supplied that day.'
      - 'Remember: zero response, zero elasticity, a vertical line.'
      - 'The trap is B, infinity. That is perfectly elastic supply, the opposite case, a horizontal line.'
    hint: 'If quantity does not change at all, what number is on top of the elasticity fraction?'
    why:
      A: 'Unitary elasticity means quantity changes by the same percentage as price; here it does not change at all.'
      B: 'Infinite elasticity is perfectly elastic supply, a horizontal line, the opposite case.'
      C: 'Fairly elastic supply means quantity responds a lot to price; here it does not respond at all.'

  17:
    answer: B
    steps:
      - 'This is elasticity of supply.'
      - 'Elasticity of supply measures how much the quantity supplied responds to a change in the price of the good: $E_s = \dfrac{\%\,\Delta Q_s}{\%\,\Delta P}$.'
      - 'If a 10% rise in price makes sellers offer 20% more, $E_s = 2$ and supply is elastic. If they offer only 5% more, $E_s = 0.5$ and supply is inelastic.'
      - 'When the price of tomatoes rises in the dry season, farmers cannot bring more at once, because tomatoes take months to grow, so their supply is inelastic in the short run.'
      - 'Remember: every price elasticity puts the change in quantity on top and the change in price at the bottom.'
      - 'The trap is C. That describes the multiplier, which links investment to national income, not elasticity of supply.'
    hint: 'Elasticity of supply compares two changes. Which two?'
    why:
      A: 'Profit and cost are not what elasticity of supply compares; it compares quantity supplied with price.'
      C: 'The response of national income to investment is measured by the multiplier.'
      D: 'The link between money supply and prices belongs to the quantity theory of money.'

  18:
    answer: B
    steps:
      - 'This is Adam Smith''s "invisible hand", from The Wealth of Nations of 1776.'
      - 'The invisible hand is the price mechanism of a free market. Each person pursues their own interest, yet the market guides them to serve the interest of society as a whole.'
      - 'A baker bakes bread to make a profit, not out of kindness. But to make that profit he must bake the bread people want at a price they will pay, so the whole community is fed.'
      - 'Bread sellers in Lagos rise before dawn to earn money for themselves, and in doing so they feed the city, with no government telling them to.'
      - 'Remember: self-interest, guided by prices, ends up serving society.'
      - 'The trap is D, producers. Producers chase their own profit, but Smith''s point is that the result benefits society, not just them.'
    hint: 'Smith said self-interest leads, as if by an unseen hand, to the good of whom?'
    why:
      A: 'Consumers gain, but Smith''s point is the good of the whole society, of which they are one part.'
      C: 'The invisible hand works without the government; it is the market, not the state, that guides.'
      D: 'Producers act for their own profit; the invisible hand turns that into a benefit for society.'

  19:
    answer: B
    steps:
      - 'This is price legislation: a minimum price, or price floor.'
      - 'A minimum price fixed above the equilibrium price is a price floor. Sellers may not charge less than it.'
      - 'At the higher price, producers move up their supply curve and offer more: quantity supplied increases. Buyers move up their demand curve and buy less, so a surplus appears.'
      - 'If government fixed a guaranteed price for maize above the market price, farmers would grow more maize and the extra would pile up in stores.'
      - 'Remember: price up, quantity supplied up, quantity demanded down, surplus.'
      - 'The trap is C. An increase in supply is a shift of the whole supply curve. A change in the good''s own price only moves sellers along the curve.'
    hint: 'A higher price moves sellers along their supply curve. In which direction?'
    why:
      A: 'Quantities do change: quantity supplied rises and quantity demanded falls.'
      C: 'A change in the good''s own price causes a movement along the supply curve, not a shift in supply.'
      D: 'A higher price makes sellers offer more, not less.'

  20:
    answer: C
    steps:
      - 'This is the functions of the price system.'
      - 'In a market economy, prices are signals. They tell producers what people want most and where resources will earn the highest return.'
      - 'When a good''s price rises, producing it becomes more profitable, so labour, land and capital move into it. When the price falls, resources move out. In this way prices allocate resources to their most productive uses.'
      - 'When the price of poultry feed soared, many Nigerian farmers moved their land and money from poultry into crops that paid better.'
      - 'Remember: prices are the traffic lights that send resources where they are most wanted.'
      - 'The trap is B. The price system does not guarantee full employment; markets can leave resources idle in a slump.'
    hint: 'What do price signals tell producers to do with their land, labour and capital?'
    why:
      A: 'Prices also fall and squeeze profits; the price system does not keep them high.'
      B: 'Markets can leave resources unemployed; the price system gives no guarantee of full employment.'
      D: 'The price system serves buyers and sellers in the market, not the interests of the government.'

  21:
    answer: B
    steps:
      - 'This is returns to scale, which apply in the long run when all factors are variable.'
      - 'Returns to scale compare the percentage change in output with the percentage change in all inputs together. If output rises by a bigger percentage than inputs, there are increasing returns to scale.'
      - 'Data: all inputs rise by 10%, output rises by 15%. Since 15% is more than 10%, returns to scale are increasing.'
      - 'A block-making firm in Ibadan that doubles its workers, moulds and cement and finds it makes more than twice as many blocks enjoys increasing returns, perhaps from better division of labour.'
      - 'Remember: output grows faster than inputs, increasing; at the same pace, constant; slower, decreasing.'
      - 'The trap is C. Diminishing returns belong to the short run, when at least one factor is fixed, but here all factors are variable.'
    hint: 'Compare the 15% rise in output with the 10% rise in all inputs.'
    why:
      A: 'Decreasing returns need output to rise by less than 10%; it rose by 15%.'
      C: 'Diminishing returns describe the short run with a fixed factor, not a change in all inputs.'
      D: 'Constant returns need output to rise by exactly 10%, the same as the inputs.'

  22:
    answer: C
    steps:
      - 'This is producer equilibrium, using isoquants and isocosts.'
      - 'An isoquant joins all the combinations of labour and capital that give the same output. An isocost line joins all the combinations the firm can buy with a given budget.'
      - 'The firm is at equilibrium, its least-cost combination, where the isoquant just touches the isocost line, that is, where the two are tangent. Any other point on the isocost line gives a lower output.'
      - 'A Kano textile firm choosing between more machines and more workers will pick the mix where no other affordable mix gives more cloth.'
      - 'Remember: it is the same idea as the consumer''s equilibrium, a curve just touching a straight line.'
      - 'The trap is B. Curves and lines are not "less than" or "greater than" each other; the condition is that they touch.'
    hint: 'This is the producer''s version of the consumer touching the highest indifference curve.'
    why:
      A: 'An isoquant beyond the isocost line cannot be afforded.'
      B: 'An isoquant inside the isocost line leaves part of the budget unused or misses a higher output.'
      D: 'An isoquant shows output; it cannot be greater than itself, so this has no meaning.'

  23:
    answer: C
    steps:
      - 'This is the long-run average cost curve (LRAC), the "envelope" curve.'
      - 'In the long run the firm can choose any plant size. Each plant size has its own short-run average cost curve (SRAC). The LRAC joins the lowest cost of producing each output, so it wraps round all the SRACs and touches each one once.'
      - 'While the LRAC is falling, it touches each SRAC on that curve''s falling part. While the LRAC is rising, it touches each SRAC on its rising part. Only at the bottom of the LRAC does it touch an SRAC at that SRAC''s own minimum point: the optimum plant.'
      - 'A bakery in Enugu could choose a small, medium or large oven; only one of those sizes gives the very lowest possible cost per loaf.'
      - 'Remember: the envelope touches every SRAC, but only one at its lowest point.'
      - 'The trap is A. It sounds natural, but the LRAC touches the minimum points of all SRACs only in the special case of constant costs.'
    hint: 'If the LRAC is falling where it meets an SRAC, can it touch that SRAC at its lowest point?'
    why:
      A: 'The LRAC touches each SRAC at its minimum only in the special case of constant costs; in general only one.'
      B: 'It touches falling parts only while the LRAC itself is falling, not for all SRACs.'
      D: 'It touches rising parts only after the LRAC''s own minimum, not for all SRACs.'

  24:
    answer: D
    steps:
      - 'This is returns to scale in the long run.'
      - 'Returns to scale compare the change in output with a change in all inputs in the same proportion. If output rises by a smaller proportion than the inputs, there are decreasing returns to scale.'
      - 'All inputs double (a 100% rise), but output rises by less than 100%, so returns to scale are decreasing. The cause is usually that a very big firm becomes hard to manage.'
      - 'A farm in Benue that doubles its land, workers and tractors but harvests only one and a half times as much yam has decreasing returns to scale.'
      - 'Remember: inputs double, output less than doubles, decreasing.'
      - 'The trap is A. Diminishing returns happen in the short run when only one factor is increased and another is fixed; here every input doubles.'
    hint: 'All inputs doubled. Did output keep pace?'
    why:
      A: 'Diminishing returns come from adding one variable factor to a fixed factor, a short-run idea.'
      B: 'Constant returns need output to exactly double.'
      C: 'Increasing returns need output to more than double.'

  25:
    answer: D
    steps:
      - 'This is barriers to entry in monopoly.'
      - 'A patent gives an inventor the sole legal right to make and sell an invention for a number of years. A copyright gives an author or musician the same right over their work.'
      - 'Because the law forbids others to copy the product, new firms cannot enter the market, and the holder keeps a monopoly. This is a legal barrier to entry.'
      - 'A Nollywood producer holds the copyright on her film, so pirates selling copies at Alaba market are breaking the law.'
      - 'Remember: patents and copyrights are legal fences round the market.'
      - 'The trap is C. Patents actually publish the details of an invention; what they stop is other firms using it to enter the market.'
    hint: 'What does the law stop other firms from doing when a product is patented?'
    why:
      A: 'Any firm can choose its quality; that power does not come from a patent.'
      B: 'The scale of output is a business choice, not something a patent gives.'
      C: 'A patent publishes how the invention works; it restricts use, not information.'

  26:
    answer: B
    steps:
      - 'This is price discrimination by a monopolist.'
      - 'A discriminatory monopolist sells the same product at different prices in different markets, for reasons not linked to cost.'
      - 'It pays only if the elasticity of demand differs between the markets. The monopolist charges a higher price where demand is less elastic, and a lower price where it is more elastic. If the elasticities were the same, the best price would be the same in both markets.'
      - 'Airlines in Nigeria charge business travellers who book at the last minute far more than students who book weeks ahead for the same Lagos to Abuja flight.'
      - 'Remember: different elasticities, different prices.'
      - 'The trap is A. With a common elasticity there is nothing to gain from charging different prices.'
    hint: 'Why would a monopolist charge one market more than another for the same good?'
    why:
      A: 'With the same elasticity everywhere, the profit-maximizing price would be the same, so there is no discrimination.'
      C: 'A finite elasticity in all markets says nothing about whether they differ, which is the real condition.'
      D: 'Zero elasticity in every market would still be a common elasticity, so it gives no reason to discriminate.'

  27:
    answer: D
    steps:
      - 'This is Net National Product (NNP).'
      - 'NNP = GNP − depreciation. Depreciation (capital consumption) is the value of machines, buildings and equipment worn out in producing the year''s output.'
      - 'GNP counts all the output of a country''s citizens, but part of it only replaces worn-out capital. Taking away depreciation gives the net value of new output.'
      - 'A Lagos transport company that earns money with its buses must set aside some of it to replace them as they wear out; only what is left is real new income.'
      - 'Remember: Gross minus wear and tear equals Net.'
      - 'The trap is C. Taking indirect taxes away moves from market prices to factor cost, which is a different adjustment.'
    hint: 'What is the difference between "gross" and "net"?'
    why:
      A: 'Net exports are part of GNP itself; subtracting them does not give NNP.'
      B: 'Subsidies are added when moving from market prices to factor cost; they have nothing to do with NNP.'
      C: 'Subtracting indirect taxes converts market prices to factor cost; it does not give NNP.'

  28:
    answer: D
    steps:
      - 'This is the investment multiplier.'
      - 'The multiplier $k = \dfrac{1}{1 - \text{MPC}}$ tells us how many times a change in investment changes national income: $\Delta Y = k \times \Delta I$.'
      - 'Data: $\Delta I$ = ₦2 million, MPC = 0.75. Then $k = \dfrac{1}{1 - 0.75} = \dfrac{1}{0.25} = 4$.'
      - '$\Delta Y = 4 \times 2 = 8$, so income changes by ₦8.0 million. Check: the new spending goes round again and again as people spend 75 kobo of each extra naira, so income must rise by more than ₦2 million.'
      - 'When government builds a road, the contractor pays workers, the workers buy food, the food sellers buy cloth, and the first ₦2 million keeps creating income.'
      - 'Remember: multiplier first, then times the injection.'
      - 'The trap is B, ₦1.5 million. That is only 0.75 × ₦2 million, the first round of spending, not the full change in income.'
    hint: 'Find the multiplier from the MPC, then multiply it by the change in investment.'
    why:
      A: '₦0.5 million is 0.25 × ₦2 million, the first round of saving, not the change in income.'
      B: '₦1.5 million is only the first round of new consumption, 0.75 × ₦2 million.'
      C: '₦2.6 million does not follow from the multiplier of 4; the change in income is 4 × ₦2 million.'

  29:
    answer: B
    steps:
      - 'This is the multiplier.'
      - 'The multiplier is $k = \dfrac{1}{1 - \text{MPC}}$, which is the same as $\dfrac{1}{\text{MPS}}$.'
      - 'Data: MPC = 0.75. $k = \dfrac{1}{1 - 0.75} = \dfrac{1}{0.25} = 4$.'
      - 'Check: with MPS = 0.25, a quarter of each extra naira leaks out as saving, and one over a quarter is 4.'
      - 'If a Nigerian household spends ₦75 of every extra ₦100 it earns, each new naira of investment creates ₦4 of income in total.'
      - 'Remember: the bigger the MPC, the bigger the multiplier.'
      - 'The trap is A, 8. That is the change in income, not the multiplier.'
    hint: 'One minus the MPC gives the MPS. The multiplier is one over that.'
    why:
      A: '8 is the change in income in millions of naira, not the multiplier.'
      C: '3 would need an MPC of about 0.67.'
      D: '2 would need an MPC of 0.5.'

  30:
    answer: C
    steps:
      - 'This is the kinds of money and how their values compare.'
      - 'Commodity money is a good that is valuable in its own right and is also used as money: gold and silver coins, cowries, salt. Its market value as a commodity can be equal to, or even higher than, its face value as money.'
      - 'If the price of gold rises, a gold coin becomes worth more as metal than its face value says, and people melt it down or hoard it. Fiat and paper money work the other way: the paper is worth almost nothing, and only the law gives it its face value.'
      - 'Before colonial times, cowries were used as money in Nigeria; they were useful goods in their own right.'
      - 'Remember: commodity money is valuable in itself; fiat money is valuable only by law.'
      - 'The trap is D, fiat money. Its face value is far above the worth of the paper it is printed on, the opposite of what the question describes.'
    hint: 'Which kind of money is a valuable good in its own right?'
    why:
      A: 'Paper money is worth far more as money than as paper.'
      B: 'Standard money is defined so that its face value equals the value of its metal, not more.'
      D: 'Fiat money has a face value far above its value as material; it is money only by law.'

  31:
    answer: B
    steps:
      - 'This is a simple price index.'
      - 'Price index = $\dfrac{\text{cost in the current year}}{\text{cost in the base year}} \times 100$. The base year is always 100.'
      - 'Data: base year cost ₦120, current year cost ₦240. Index = $\dfrac{240}{120} \times 100 = 2 \times 100 = 200$.'
      - 'Check: the basket costs twice as much, so prices have doubled and the index is twice the base of 100.'
      - 'The National Bureau of Statistics uses the same idea in the consumer price index, which tracks the cost of a basket of goods Nigerian households buy.'
      - 'Remember: current over base, times 100.'
      - 'The trap is C, 240. That is the current cost in naira, not the index.'
    hint: 'Divide this year''s cost by the base year''s cost, then multiply by 100.'
    why:
      A: '100 is the base year index, which would mean no change in prices.'
      C: '240 is the current cost of the basket, not the index number.'
      D: '300 would need the basket to cost three times as much, ₦360.'

  32:
    answer: B
    steps:
      - 'This is the cash reserve ratio, a tool of monetary policy.'
      - 'The cash reserve ratio (CRR) is the percentage of a commercial bank''s deposits that it must keep as cash with the central bank.'
      - 'By raising the CRR, the central bank leaves banks less money to lend, which reduces the money supply. Lowering it does the opposite.'
      - 'In Nigeria the Central Bank of Nigeria (CBN) sets the CRR and changes it from time to time to control the money supply.'
      - 'Remember: cash reserve means cash kept in reserve at the central bank.'
      - 'The trap is A, the liquidity ratio. That is the share of deposits a bank must hold in liquid assets of its own, not money deposited with the central bank.'
    hint: 'Which ratio is about cash kept with the central bank?'
    why:
      A: 'The liquidity ratio covers liquid assets a bank holds itself, such as treasury bills, not deposits at the central bank.'
      C: 'The minimum lending rate is an interest rate, not an amount deposited.'
      D: 'An aggregate credit ceiling limits how much banks may lend, not what they deposit.'

  33:
    answer: B
    steps:
      - 'This is the money market.'
      - 'The money market is the market for short-term funds, lent and borrowed for periods of up to about a year.'
      - 'Government, banks and firms raise short-term money there through instruments such as treasury bills, call money and commercial papers. Long-term funds belong to the capital market instead.'
      - 'In Nigeria the federal government sells treasury bills through the CBN to borrow for 91, 182 or 364 days.'
      - 'Remember: money market, short term; capital market, long term.'
      - 'The trap is A. Long-term financing is the work of the capital market, such as the Nigerian Exchange in Lagos.'
    hint: 'Treasury bills and call money are short or long term?'
    why:
      A: 'Long-term funds come from the capital market, not the money market.'
      C: 'Keeping the naira stable is a job of the central bank, not the main function of the money market.'
      D: 'Price stability is an aim of monetary policy, not the money market''s main function.'

  34:
    answer: D
    steps:
      - 'This is the ad valorem tax.'
      - 'Ad valorem is Latin for "according to value". An ad valorem tax is charged as a percentage of the value (price) of a commodity.'
      - 'The dearer the item, the more tax is paid on it. A specific tax, by contrast, is a fixed amount per unit, whatever the price.'
      - 'Value Added Tax in Nigeria is ad valorem: it was 5% of the price until 2020, when it rose to 7.5%.'
      - 'Remember: ad valorem, per cent of value; specific, per unit.'
      - 'The trap is C, imports. Import duties can be ad valorem, but the idea of ad valorem is the basis of the tax, the value, not the kind of goods.'
    hint: 'What does "valorem" sound like?'
    why:
      A: 'An ad valorem tax can fall on any commodity, not only special ones.'
      B: 'Exports may be taxed ad valorem, but ad valorem describes how the tax is worked out, not what it falls on.'
      C: 'Imports may be taxed ad valorem, but the defining feature is that it is a percentage of value.'

  35:
    answer: B
    steps:
      - 'This is national debt and the reserves of a nation.'
      - 'National debt is what a government owes, at home and abroad. A country''s reserves (gold and foreign currency) are what it can draw on to pay its bills.'
      - 'A government borrows heavily when its own revenue and reserves cannot cover its spending and its foreign payments. So a huge debt is a sign that the reserves have been run down, that is, they have decreased.'
      - 'In the 1980s, when oil earnings fell, Nigeria''s foreign reserves fell sharply and its external debt grew until it was cleared in a debt relief deal in 2005 and 2006.'
      - 'Remember: reserves go down, borrowing goes up.'
      - 'The trap is C, depreciated. Depreciation is a fall in a currency''s exchange value, not the running down of reserves.'
    hint: 'When would a country need to borrow a lot, when its reserves are high or low?'
    why:
      A: 'Rising reserves would reduce the need to borrow, not create a huge debt.'
      C: 'Depreciation describes a fall in a currency''s value, not a fall in the amount of reserves.'
      D: 'Stagnant reserves would not by themselves force a huge rise in borrowing.'

  36:
    answer: D
    steps:
      - 'This is economic diversification as a path to development.'
      - 'Diversification means spreading production and exports over many sectors instead of depending on one.'
      - 'Nigeria depends on crude oil for most of its export earnings and much of government revenue. When world oil prices fall, the whole economy suffers. Building up agriculture, manufacturing, solid minerals and services makes growth steadier and creates more jobs.'
      - 'The oil price crash of 2014 to 2016 pushed Nigeria into recession in 2016, which showed the danger of a one-product economy.'
      - 'Remember: do not put all your eggs in one basket.'
      - 'The trap is B. Agriculture matters, but concentrating on any one sector repeats the same mistake; diversification includes agriculture and tourism and more.'
    hint: 'Which option avoids depending on any one sector?'
    why:
      A: 'Dependence on oil is the very problem that keeps Nigeria''s growth unstable.'
      B: 'Agriculture is one part of diversification, but concentrating on one sector is not enough.'
      C: 'Tourism is one part of diversification, too small on its own to drive rapid development.'

  37:
    answer: D
    steps:
      - 'This is the aim of economic growth.'
      - 'Economic growth is a sustained rise in a country''s real output (real GDP), usually measured per head.'
      - 'More goods and services per person means people can eat better, live in better houses and buy more. So the main reason for wanting growth is to raise the standard of living. Lower poverty usually follows as a result.'
      - 'When Nigeria''s real GDP grows faster than its population, the average Nigerian can afford more food, school fees and transport.'
      - 'Remember: growth means a bigger cake, so everyone can have a bigger slice.'
      - 'The trap is B. Reducing poverty is one result of a higher standard of living, but growth does not reach the poor automatically; the overall aim is a higher standard of living.'
    hint: 'What does more output per head do for people''s lives in general?'
    why:
      A: 'Controlling inflation is a separate aim of policy; growth can even add to inflation.'
      B: 'Lower poverty is one benefit, but growth alone does not ensure it; the main aim is a higher standard of living.'
      C: 'Redistributing income is done by taxes and spending, not by growth itself.'

  38:
    answer: A
    steps:
      - 'This is Nigeria''s agricultural exports, traditional and emerging.'
      - 'Traditional export crops are those Nigeria has exported for a long time: cocoa, groundnut, cotton, palm produce and rubber. Emerging export crops are newer ones growing in importance.'
      - 'Cassava was long grown only for food at home. Since the 2000s, government has pushed cassava for export as chips, starch and flour, so it is an emerging export crop.'
      - 'Nigeria is the world''s largest producer of cassava, and the Presidential Initiative on Cassava of the early 2000s aimed to turn this into export earnings.'
      - 'Remember: cocoa, groundnut and cotton are the old guard; cassava is the newcomer.'
      - 'The trap is C, cocoa. It is Nigeria''s best-known agricultural export, but it is traditional, not emerging.'
    hint: 'Which crop was mostly eaten at home until recently, but is now being exported?'
    why:
      B: 'Cotton was a traditional export crop of the North in colonial times.'
      C: 'Cocoa has been a major export since colonial times, so it is traditional.'
      D: 'Groundnut was a leading export in the 1950s and 1960s, famous for the Kano groundnut pyramids.'

  39:
    answer: B
    steps:
      - 'This is agricultural policy in Nigeria.'
      - 'A good agricultural strategy raises output so that the country can feed itself and stop spending scarce foreign exchange on food imports. This goal is food self-sufficiency.'
      - 'Programmes such as Operation Feed the Nation (1976), the Green Revolution (1980) and later the Anchor Borrowers'' Programme all aimed to raise farm output towards self-sufficiency in food.'
      - 'When Nigerian rice farms grow enough to fill local markets, money that once went on imported rice stays with farmers at home.'
      - 'Remember: improving agriculture means growing enough to feed ourselves.'
      - 'The trap is D. The commodity boards paid farmers low prices and were abolished in 1986, so they discouraged farming.'
    hint: 'Which option would make farmers produce more and the country import less food?'
    why:
      A: 'Controlling farm prices usually keeps them low, which discourages farmers from producing more.'
      C: 'Reducing exports cuts farmers'' earnings and foreign exchange; it does not improve agriculture.'
      D: 'The commodity boards paid farmers below world prices and were scrapped in 1986.'

  40:
    answer: B
    steps:
      - 'This is the location of industry.'
      - 'An industry whose raw material is bulky, perishable or loses much weight in processing is best located near the source of that raw material.'
      - 'Sugar cane is heavy and spoils quickly after cutting, and most of its weight is lost when the sugar is extracted. Carrying cane far would be costly, so sugar factories are built beside the cane fields.'
      - 'Nigeria''s sugar factories, such as Bacita in Kwara State and Savannah Sugar at Numan in Adamawa State, sit in the middle of their own cane plantations.'
      - 'Remember: heavy, weight-losing raw material, build at the farm.'
      - 'The trap is A, labour. Labour can travel to the factory far more cheaply than tonnes of cane.'
    hint: 'Is it cheaper to carry tonnes of cane to the factory, or to build the factory near the cane?'
    why:
      A: 'Workers can move to the factory more cheaply than bulky, perishable cane can.'
      C: 'Power can be brought by cable or generated on site; it is not the deciding factor here.'
      D: 'Capital is mobile and can be brought to any site.'

  41:
    answer: D
    steps:
      - 'This is the role of small-scale industries in Nigeria''s development.'
      - 'Small-scale industries are small firms with few workers and little capital, such as tailoring, furniture making, block making and food processing.'
      - 'They use simple tools and many hands, so they are labour-intensive. They are spread across towns and villages, and they need little capital to start, so their biggest contribution is employment.'
      - 'Think of the many workshops in Aba or the furniture makers by the roadside in Lagos, each giving jobs to apprentices and workers.'
      - 'Remember: small firms, many jobs.'
      - 'The trap is B. Small firms mostly sell at home, so their foreign exchange earnings are small.'
    hint: 'Small firms use little capital. What do they use a lot of instead?'
    why:
      A: 'Small firms use simple, traditional technology; major technological development comes from bigger firms and research.'
      B: 'Small firms mostly sell in local markets and earn little foreign exchange.'
      C: 'Some small firms process raw materials, but their most important contribution overall is jobs.'

  42:
    answer: D
    steps:
      - 'This is the downstream oil sector and the effect of petrol prices.'
      - 'Petrol (PMS) is the main fuel for cars, buses, okadas and lorries, so it is a direct cost of road transport.'
      - 'When the pump price of petrol changes, transporters change their fares at once. Prices of other goods change later and indirectly, because moving them to market costs more.'
      - 'After fuel subsidy was removed in May 2023 and the pump price jumped, danfo and okada fares in Lagos rose within days.'
      - 'Remember: petrol price first hits the fare; then the fare hits everything else.'
      - 'The trap is A. Prices of consumer goods do rise, but indirectly, through the higher cost of transport.'
    hint: 'What is petrol used for directly, before it affects anything else?'
    why:
      A: 'Consumer goods prices change only indirectly, after transport costs rise.'
      B: 'Prices of essential goods also change indirectly, through transport and production costs.'
      C: 'Raw material costs change indirectly, through the cost of moving them.'

  43:
    answer: D
    steps:
      - 'This is the capital market.'
      - 'The capital market is the market for long-term funds, lent or invested for more than a year, through shares, bonds and long-term loans.'
      - 'Firms and governments that want money for factories, roads and other investment projects raise it by selling shares or bonds there.'
      - 'In Nigeria the Nigerian Exchange (formerly the Nigerian Stock Exchange) in Lagos is the heart of the capital market, overseen by the Securities and Exchange Commission.'
      - 'Remember: capital market, long term; money market, short term.'
      - 'The trap is A, the money market. It provides short-term funds only.'
    hint: 'Shares and bonds are traded in which market?'
    why:
      A: 'The money market provides short-term funds, not long-term ones.'
      B: 'A commodity market trades goods such as cocoa and oil, not long-term funds.'
      C: 'The foreign exchange market trades currencies, not long-term investment funds.'

  44:
    answer: B
    steps:
      - 'This is globalization and the policies that open an economy.'
      - 'Globalization is the growing integration of a country''s economy with the rest of the world through trade, investment and the movement of money.'
      - 'Deregulation removes government controls on prices, trade, interest rates and foreign exchange, so goods and capital can flow more freely in and out. That links the economy more closely to world markets.'
      - 'Nigeria''s Structural Adjustment Programme of 1986 deregulated the foreign exchange market and trade, opening the economy to the world.'
      - 'Remember: deregulation opens the doors; indigenization and import bans close them.'
      - 'The trap is C. Commercialization makes public enterprises run on business lines, but it does not by itself open the economy to the world.'
    hint: 'Which policy removes the barriers between Nigeria and world markets?'
    why:
      A: 'Indigenization put businesses in Nigerian hands and kept foreigners out, the opposite of globalization.'
      C: 'Commercialization changes how public firms are run, not how open the economy is.'
      D: 'Banning imports closes the economy to world trade.'

  45:
    answer: C
    steps:
      - 'This is the Malthusian theory of population, set out by Thomas Malthus in 1798.'
      - 'Malthus said population tends to grow geometrically (2, 4, 8, 16), while food from the land, a natural resource, grows only arithmetically (1, 2, 3, 4).'
      - 'So population growth would outrun the means of subsistence, until famine, disease and war (positive checks) or late marriage and restraint (preventive checks) brought it back.'
      - 'Worries today about whether Nigeria''s fast-growing population can be fed from its farmland are Malthusian worries.'
      - 'Remember: Malthus, mouths against food.'
      - 'The trap is B. Population density and income are studied in optimum population theory, not by Malthus.'
    hint: 'Malthus compared the growth of population with the growth of what?'
    why:
      A: 'Malthus did not compare rich and poor nations; he compared population with food supply.'
      B: 'Population and income per head belong to optimum population theory.'
      D: 'Age distribution is about the structure of a population, not Malthus''s theory.'

  46:
    answer: C
    steps:
      - 'This is how the size of a population changes.'
      - 'Population at the end = population at the start + births + immigrants − deaths − emigrants.'
      - 'Data: start 50, immigrants 10, deaths 25, emigrants 5, no births given. End population = 50 + 10 − 25 − 5 = 30.'
      - 'Check: 10 people came in and 30 left, by death or emigration, so the village lost 20 people, and 50 − 20 = 30.'
      - 'A village in Ekiti that loses young people to Lagos (emigration) and gains a few traders from outside (immigration) changes size in exactly this way.'
      - 'Remember: immigrants come in, emigrants exit.'
      - 'The trap is B, 20. That is the net loss of people, not the population that remains.'
    hint: 'Add those who came in and take away those who left or died.'
    why:
      A: '10 is only the number who immigrated.'
      B: '20 is the net loss of people, not the population left.'
      D: '50 is the starting population, before any change.'

  47:
    answer: B
    steps:
      - 'This is the balance of payments (BOP).'
      - 'The balance of payments records all of a country''s transactions with the rest of the world. Its main parts are the current account (goods, services, income and transfers) and the capital account (investment and loans).'
      - 'The overall balance is found by subtracting total debits (payments out) from total credits (receipts in) on the current and capital accounts together. If debits are bigger, the balance of payments is in deficit.'
      - 'If Nigeria pays more for imports and loan repayments than it earns from oil exports and foreign investment, the CBN must draw on its reserves to fill the gap.'
      - 'Remember: current plus capital gives the overall balance.'
      - 'The trap is A. The current account alone gives the current account balance, which is only part of the balance of payments.'
    hint: 'The overall balance takes in both the trade side and the investment side.'
    why:
      A: 'The current account alone gives only the current account balance, not the whole balance of payments.'
      C: 'An escrow account is a held deposit, not a part of the balance of payments.'
      D: 'An escrow account is not part of the balance of payments, and the current account is left out.'

  48:
    answer: A
    steps:
      - 'This is the Economic Community of West African States (ECOWAS).'
      - 'ECOWAS was set up by the Treaty of Lagos on 28 May 1975 to promote economic co-operation and integration among West African states.'
      - 'Its functions include free movement of people and goods, and funding development projects. Through its fund, now the ECOWAS Bank for Investment and Development, it finances roads, power, telecommunications and other infrastructure in member states.'
      - 'The planned Lagos to Abidjan coastal highway is an ECOWAS infrastructure project.'
      - 'Remember: ECOWAS links West Africa, and links need roads and power.'
      - 'The trap is D. ECOWAS allows citizens to move and work freely in member states, but it does not itself provide them with jobs.'
    hint: 'Which option is something a regional development fund would do?'
    why:
      B: 'Export prices are set by world markets, not by ECOWAS.'
      C: 'Redistributing income among citizens is a job for each national government''s taxes and spending.'
      D: 'ECOWAS lets citizens move and seek work freely, but it does not provide the jobs.'

  49:
    answer: B
    steps:
      - 'This is the rewards of the factors of production.'
      - 'There are four factors, each with its reward: land earns rent, labour earns wages, capital earns interest, and the entrepreneur earns profit.'
      - 'Machinery and equipment are man-made goods used to produce other goods, so they are capital. The reward for capital is interest.'
      - 'A garri processor in Ogun who buys a grating machine with a bank loan pays interest on the loan, which is the reward to the capital she uses.'
      - 'Remember: Land, Labour, Capital, Entrepreneur go with Rent, Wages, Interest, Profit.'
      - 'The trap is D, wages. Wages are the reward for labour, the human effort, not for machines.'
    hint: 'Machinery is which factor of production?'
    why:
      A: 'Profit is the reward of the entrepreneur.'
      C: 'Rent is the reward for land.'
      D: 'Wages are the reward for labour.'

  50:
    answer: B
    steps:
      - 'This is a minimum wage, a price floor in the labour market.'
      - 'The wage is the price of labour. A minimum wage set above the equilibrium wage at E means no employer may pay less than OW.'
      - 'In the diagram, at OW the dashed line meets the demand curve DD on the left and the supply curve SS further right. At this higher wage more people want to work (along SS) but firms hire fewer (along DD). The gap between the two points is people willing to work who cannot find jobs, which is unemployment.'
      - 'When Nigeria raised the national minimum wage (₦18,000 in 2011, ₦30,000 in 2019, ₦70,000 in 2024), some small employers said they would have to hire fewer workers.'
      - 'Remember: wage floor above equilibrium, surplus of labour, unemployment.'
      - 'The trap is D. Full employment happens at the equilibrium wage, not above it.'
    hint: 'At wage W, compare how much labour is supplied with how much is demanded.'
    why:
      A: 'Above the equilibrium wage, fewer workers are hired, so resources are not fully employed.'
      C: 'The diagram shows the labour market only; it shows a surplus of labour, not a rise in the general price level.'
      D: 'Full employment of labour would be at the equilibrium E, not at a wage above it.'
