format_version: 1
exam_year: 2013
subject: ECO
explanations:
  2:
    answer: D
    steps:
      - 'This is the mixed economy, one of the three main economic systems.'
      - 'A mixed economy is one in which both the government (the public sector) and private individuals and firms (the private sector) own resources and take part in production.'
      - 'The government provides goods the market leaves out, such as roads, defence and power, while private firms produce most consumer goods for profit. Both sectors together drive growth.'
      - 'Nigeria is a mixed economy: the government owns the NNPC and builds federal roads, while private firms such as Dangote Cement and the traders of Onitsha market run most of production and trade.'
      - 'Remember: mixed means both hands are on the wheel, the government''s and the private sector''s.'
      - 'The trap is B, capitalist economy. Capitalism leaves production almost wholly to the private sector, so it is not the system in which both sectors share the work.'
    hint: 'Which system has room for both the government and private firms?'
    why:
      A: 'A feudal economy rests on lords who own the land and serfs who work it; it is not a public and private partnership.'
      B: 'A capitalist economy leaves production mainly to private owners, with little role for the state.'
      C: 'A socialist economy puts the main resources in the hands of the state, with little private enterprise.'

  3:
    answer: B
    steps:
      - 'This is the link between the standard deviation and the variance, two measures of dispersion.'
      - 'The variance is the mean of the squared deviations from the mean, and the standard deviation is its square root. So variance = (standard deviation)².'
      - 'Data: standard deviation = 53. Formula: $\sigma^2 = 53^2$. Working: $53 \times 53 = 2{,}809$. Check: $\sqrt{2{,}809} = 53$, so the variance is 2,809.'
      - 'A trader at Mile 12 who records daily tomato sales can find how spread out the sales are with either measure; the variance is simply the standard deviation squared.'
      - 'Remember: SD is the root, variance is the square.'
      - 'The trap is C, 2,808. It is one less than the true square, a slip in the last digit; 3 × 3 ends in 9, so 53² must end in 9.'
    hint: 'The standard deviation is the square root of the variance. Undo the square root.'
    why:
      A: '2,082 is not the square of 53; it comes from muddling the digits of 2,809.'
      C: '2,808 is one short of 53², which must end in 9 because 3 × 3 = 9.'
      D: '2,209 is 47², not 53².'

  4:
    answer: C
    steps:
      - 'This is about which measures of central tendency and dispersion serve for further analysis.'
      - 'A measure is useful for further statistical work when it uses every value in the data and can be handled algebraically, put into formulae for other measures.'
      - 'The mean uses every value and is the base for the variance, the standard deviation, correlation and regression. The standard deviation uses every value too, and is used in sampling, testing and comparing spreads. The mode and the median depend only on position or frequency, so they cannot be worked with algebraically.'
      - 'The National Bureau of Statistics reports the mean household income and its standard deviation so that economists can compare states and build further models on them.'
      - 'Remember: the mean and the SD are the pair that does algebra.'
      - 'The trap is B, the mean and mode. The mean is right, but the mode is not used in further calculation, since it only tells the most frequent value.'
    hint: 'Which measures use every value in the data and go into other formulae?'
    why:
      A: 'The standard deviation fits, but the median depends only on the middle position and is not used in further algebra.'
      B: 'The mean fits, but the mode is just the most frequent value and cannot be treated algebraically.'
      D: 'Neither the mode nor the median lends itself to further algebraic treatment.'

  5:
    answer: A
    steps:
      - 'This is the range, the simplest measure of dispersion.'
      - 'The range is the highest value minus the lowest value in a set of data.'
      - 'Because it needs only two numbers and one subtraction, it is simple to calculate and easy to understand. That is its main advantage. Its weaknesses come from the same fact: it ignores all the values in between and is thrown off by one extreme value.'
      - 'If the price of a paint bucket of garri in a week runs from ₦1,200 to ₦1,800, the range is ₦1,800 − ₦1,200 = ₦600, which anyone in the market can work out at once.'
      - 'Remember: the range is quick, but it only sees the two ends.'
      - 'The trap is C, not affected by extreme values. The range is made of the two extreme values, so one unusual value changes it completely.'
    hint: 'How many values does the range use, and what does that make it easy or hard to do?'
    why:
      B: 'The range uses only the highest and the lowest values, not all the values.'
      C: 'The range is built from the two extreme values, so extremes affect it more than any other measure.'
      D: 'The range is not used in further statistical calculation; the standard deviation is.'

  6:
    answer: D
    steps:
      - 'This is the median, a measure of central tendency.'
      - 'The median is the middle value when the data are arranged in order of size. For n values, it is the $\dfrac{n+1}{2}$th value.'
      - 'Data in order: 10, 14, 15, 18, 22, 28, 30, 35, 38. There are n = 9 values, so the median is the $\dfrac{9+1}{2} = 5$th value, which is 22. Check: four values lie below 22 and four above it.'
      - 'If nine traders at Bodija market sell yams at these prices in hundreds of naira, the median price is the one with as many traders below as above.'
      - 'Remember: line them up first, then pick the middle.'
      - 'The trap is A, 10, or B, 38. These are the smallest and largest values; others take the middle of the list as printed without sorting it first.'
    hint: 'Arrange the nine numbers from smallest to largest before you look for the middle.'
    why:
      A: '10 is the smallest value, not the middle one.'
      B: '38 is the largest value, not the middle one.'
      C: '35 is the eighth value in order, far above the middle.'

  7:
    answer: B
    steps:
      - 'This is the effect of a change in demand on equilibrium.'
      - 'An increase in demand shifts the demand curve to the right. If supply does not change, the new equilibrium is further up the same supply curve.'
      - 'At the old price, buyers now want more than sellers offer, so there is a shortage. The shortage pushes the price up, and the higher price draws out a larger quantity supplied. Both the equilibrium price and the equilibrium quantity rise.'
      - 'When school resumes in September, demand for exercise books in Nigerian markets rises, and the books sell both at a higher price and in larger numbers.'
      - 'Remember: demand up, price up and quantity up.'
      - 'The trap is D, price up and quantity down. That is what happens when supply falls, not when demand rises.'
    hint: 'Shift the demand curve right and see where it meets the same supply curve.'
    why:
      A: 'A fall in price with a rise in quantity comes from an increase in supply, not demand.'
      C: 'A fall in both price and quantity comes from a decrease in demand.'
      D: 'A rise in price with a fall in quantity comes from a decrease in supply.'

  8:
    answer: A
    steps:
      - 'This is the law of demand.'
      - 'The law of demand says that, other things being equal, the higher the price of a good, the smaller the quantity demanded, and the lower the price, the larger the quantity demanded.'
      - 'A change in the good''s own price moves the buyer along the same demand curve; this is a change in quantity demanded. A change in demand itself, a shift of the whole curve, comes only from other things such as income or tastes.'
      - 'When the pump price of petrol rose in Nigeria, many motorists bought fewer litres and some left their cars at home: a fall in quantity demanded.'
      - 'Remember: own price moves you along the curve; anything else shifts the curve.'
      - 'The trap is D, a decrease in demand. The quantity bought does fall, but a change in the good''s own price is a movement along the curve, not a decrease in demand.'
    hint: 'Does a change in the good''s own price move you along the curve or shift the curve?'
    why:
      B: 'A rise in price does not raise demand; the quantity demanded falls.'
      C: 'Quantity demanded falls, not rises, when price rises.'
      D: 'A decrease in demand is a shift of the curve caused by other factors, not by the good''s own price.'

  9:
    answer: D
    steps:
      - 'This is price elasticity of demand (PED), how strongly quantity demanded responds to price.'
      - 'PED = percentage change in quantity demanded ÷ percentage change in price: $\text{PED} = \dfrac{\%\,\Delta Q_d}{\%\,\Delta P}$, using the original values as the base.'
      - 'Data: $P_1 = 120$, $P_2 = 80$, $Q_1 = 300$, $Q_2 = 500$. $\%\,\Delta Q_d = \dfrac{500 - 300}{300} \times 100 = 66.7\%$. $\%\,\Delta P = \dfrac{80 - 120}{120} \times 100 = -33.3\%$.'
      - '$\text{PED} = \dfrac{66.7}{33.3} = 2.0$ (ignoring the minus sign). Check: the quantity changed by twice as large a share as the price, so demand is elastic and PED is greater than 1.'
      - 'A bicycle seller in Kano who cuts the price from ₦120 to ₦80 and sees sales jump from 300 to 500 has met elastic demand, so his total revenue rises from ₦36,000 to ₦40,000.'
      - 'Remember: quantity on top, price below.'
      - 'The trap is A, 66.7. That is only the percentage change in quantity; it still has to be divided by the percentage change in price.'
    hint: 'Find the two percentage changes from the original values, then divide quantity by price.'
    why:
      A: '66.7 is the percentage change in quantity alone, not divided by the change in price.'
      B: '0.5 turns the formula upside down, dividing the price change by the quantity change.'
      C: '1.5 mixes bases, taking the change in quantity over the average quantity, 400, but the change in price over the original price.'

  10:
    answer: C
    steps:
      - 'This is perfectly inelastic demand.'
      - 'Demand is perfectly inelastic when the quantity demanded does not change at all as price changes, so PED = 0.'
      - 'On the graph, the demand curve D is a vertical line at quantity Q. Whatever the price, the same quantity OQ is bought, so the percentage change in quantity is zero and PED = 0 ÷ (any change in price) = 0.'
      - 'A diabetic patient in Lagos needs the same dose of insulin each day; if the price rises, the dose bought stays the same. Table salt is close to this too.'
      - 'Remember: vertical, like a wall, does not budge; horizontal flies off to infinity.'
      - 'The trap is B, perfectly elastic. That curve is horizontal, not vertical.'
    hint: 'Look at the line D. Does the quantity change when the price changes?'
    why:
      A: 'Unitary elasticity is a curve shaped like a rectangular hyperbola, along which spending stays the same; it is not a straight vertical line.'
      B: 'A perfectly elastic demand curve is horizontal, with PED equal to infinity.'
      D: 'A fairly inelastic curve is steep but still slopes down; a vertical line shows no response at all.'

  11:
    answer: C
    steps:
      - 'This is the cardinal utility approach (Marshall) to consumer behaviour.'
      - 'The cardinalists assume that utility can be measured in numbers (utils), that marginal utility diminishes, that the marginal utility of money is constant, and that total utility depends on the quantities of the commodities consumed.'
      - 'Because utility is measurable and additive, the total utility from a basket of goods is the sum of the utilities of the quantities consumed; more of a good adds to it, but by smaller and smaller amounts.'
      - 'A student eating plates of jollof rice can, on this view, score each plate in utils, and her total utility depends on how many plates she eats.'
      - 'Remember: cardinal means counting, one, two, three utils; ordinal means ranking, first, second, third.'
      - 'The trap is A, diminishing marginal rate of substitution. That belongs to the ordinal (indifference curve) approach, not the cardinal one.'
    hint: 'Which option treats utility as an amount that depends on how much is consumed?'
    why:
      A: 'A diminishing marginal rate of substitution is an assumption of the ordinal indifference curve approach.'
      B: 'Consistency and transitivity of choice are ordinal assumptions about ranking preferences.'
      D: 'The cardinalists assume the marginal utility of money is constant, not unstable.'

  12:
    answer: B
    steps:
      - 'This is utility.'
      - 'Utility is the satisfaction a consumer gets from using or consuming a good or service.'
      - 'Goods are wanted because using them satisfies a want; the satisfaction comes at the point of consumption, not when the good is made, sold or merely wanted.'
      - 'The satisfaction you feel when you drink a cold sachet of water on a hot afternoon in Kaduna is utility.'
      - 'Remember: utility comes from use.'
      - 'The trap is C, demand. Demand is the desire to buy backed by ability to pay; the satisfaction comes only when the good is used.'
    hint: 'When does a consumer actually feel satisfied by a good?'
    why:
      A: 'Distribution moves goods to consumers; it gives no satisfaction until the goods are used.'
      C: 'Demand is the desire backed by ability to pay, not the satisfaction itself.'
      D: 'Production creates utility in goods, but the satisfaction is felt when they are used.'

  13:
    answer: B
    steps:
      - 'This is the indifference map, a set of indifference curves.'
      - 'An indifference curve joins combinations of two goods that give the consumer the same satisfaction. A curve further from the origin gives more satisfaction, because it has more of at least one good.'
      - 'On the graph, I₃ is the highest curve, then I₂, then I₁. S lies on I₃; M and N lie on I₂; F lies between I₁ and I₂, and K lies below I₁. So S gives the most satisfaction, and the rational consumer prefers it.'
      - 'A student sharing her pocket money between bread and akara prefers any mix that gives more of both, so she will always choose the combination on the highest curve.'
      - 'Remember: the further out, the better off.'
      - 'The trap is C, M. M sits high up on the graph, but it is on I₂, a lower curve than the one S is on.'
    hint: 'Which point lies on the indifference curve furthest from the origin?'
    why:
      A: 'F lies between I₁ and I₂, below the curve that S is on, so it gives less satisfaction.'
      C: 'M is on I₂, which is a lower curve than I₃.'
      D: 'K lies below I₁, the lowest curve, so it gives the least satisfaction of all.'

  14:
    answer: C
    steps:
      - 'This is a determinant of supply, the cost of production.'
      - 'Supply depends on the price of the good, the cost of production, technology, the prices of other goods, the weather and government policy. A change in the cost of production shifts the whole supply curve.'
      - 'The cost of storage is part of the cost of production and distribution. When it rises, each unit costs more to bring to market, so sellers supply less at every price; when it falls, supply rises.'
      - 'When cold-room charges in Lagos markets rise, fish and tomato sellers bring less to market at every price, and supply falls.'
      - 'Remember: cost up, supply down.'
      - 'The trap is B, availability of storage facilities. It touches supply, but it is the cost of storage, a cost of production, that is the economic determinant.'
    hint: 'Which option is a cost the seller must pay before the goods reach the buyer?'
    why:
      A: 'Market discrimination is about selling at different prices to different buyers, not a determinant of supply.'
      B: 'Having storage matters, but it is the cost of storage, a cost of production, that shifts supply.'
      D: 'Incentives to workers are a matter of management and motivation, not a major determinant of market supply.'

  15:
    answer: C
    steps:
      - 'This is a linear supply equation, which gives price in terms of quantity supplied.'
      - 'To find the quantity supplied at a price, put the price into the equation and solve for $Q_s$.'
      - 'Data: $P = 14$. Equation: $14 = \dfrac{1}{4}(Q_s + 10)$. Multiply both sides by 4: $56 = Q_s + 10$. Subtract 10: $Q_s = 46$.'
      - 'Check: $\dfrac{1}{4}(46 + 10) = \dfrac{56}{4} = 14$, which is the given price.'
      - 'A poultry farmer in Ogun who prices eggs this way would supply 46 crates when the price is ₦14 a unit.'
      - 'Remember: clear the fraction first, then move the number across.'
      - 'The trap is B, 60. It adds 10 to 4 × 14 = 56 instead of taking 10 away.'
    hint: 'Put P = 14 into the equation and multiply both sides by 4 first.'
    why:
      A: '14 is the price itself, not the quantity supplied.'
      B: '60 adds 10 to 56 when 10 should be subtracted.'
      D: '32 does not fit the equation, since ¼(32 + 10) = 10.5, not 14.'

  16:
    answer: B
    steps:
      - 'This is elasticity of supply and the law of supply.'
      - 'The law of supply says that quantity supplied moves in the same direction as price. Supply is elastic when quantity supplied changes by a larger percentage than price (PES greater than 1).'
      - 'So a small fall in price brings a fall in quantity supplied, and because supply is elastic, the fall in quantity is proportionally larger than the fall in price.'
      - 'If the price of sachet water falls a little, many small producers in Abuja switch to other work at once, and the quantity supplied drops sharply.'
      - 'Remember: supply follows price; elastic means it follows strongly.'
      - 'The trap is C, increase the quantity supplied. That reverses the law of supply; sellers offer less, not more, when the price falls.'
    hint: 'Which way does quantity supplied move when price falls?'
    why:
      A: 'A fall in the price of the product does not lower the cost of making it.'
      C: 'Quantity supplied falls, not rises, when price falls.'
      D: 'No change would mean perfectly inelastic supply, the opposite of elastic.'

  17:
    answer: C
    steps:
      - 'This is composite supply.'
      - 'Composite supply is the supply of a commodity, or of goods that satisfy the same want, from several different sources.'
      - 'In a monopolistically competitive market, many firms each sell their own brand of a similar product. Together their brands make up the supply that meets one want, here the want for a hot or cold drink.'
      - 'In Nigeria, beverages come from several firms at once: Milo from Nestlé, Bournvita from Cadbury and Lipton tea from Unilever. All of them supply the same breakfast drink want.'
      - 'Remember: composite means made of many parts, many sources meeting one want.'
      - 'The trap is B, competitive supply. Competitive supply means resources used for one good cannot be used for another, like land used for cocoa or rubber; it is not many firms supplying one want.'
    hint: 'Many firms, many brands, one want: which type of supply is that?'
    why:
      A: 'Derived demand is demand for a factor because of the good it helps to make; it is not supply.'
      B: 'Competitive supply is when resources used for one product cannot be used for another.'
      D: 'Joint demand is demand for goods used together, like cars and petrol; it is not supply.'

  18:
    answer: A
    steps:
      - 'This is a maximum price, a price ceiling set below equilibrium.'
      - 'At the equilibrium price, the quantity demanded equals the quantity supplied. Below it, buyers want more and sellers offer less.'
      - 'So at a price fixed below equilibrium, quantity demanded is greater than quantity supplied, and the gap is excess demand, a shortage. It often brings queues, rationing and black markets.'
      - 'When the pump price of petrol was held below the market level, Nigerians saw long queues at filling stations and black-market sellers by the roadside.'
      - 'Remember: ceiling below equilibrium means shortage.'
      - 'The trap is D, excess supply. That comes from a price fixed above equilibrium, a price floor.'
    hint: 'Below the equilibrium price, who wants more: buyers or sellers?'
    why:
      B: 'The price is held fixed by law, so it does not keep falling; the result is a shortage.'
      C: 'A legal ceiling stops the price rising, at least in the open market.'
      D: 'Excess supply comes from a price fixed above equilibrium.'

  19:
    answer: C
    steps:
      - 'This is the price mechanism, the market system in which prices decide what, how and for whom to produce.'
      - 'Its merits include consumer sovereignty, freedom of choice and efficiency. Its main criticism is that it distributes goods by ability to pay, so it widens the gap between rich and poor.'
      - 'Those with high incomes can bid for whatever they want, while the poor cannot pay for even basic goods. Over time, income and wealth become more unequal.'
      - 'Under a pure price system in Nigeria, private hospitals would serve those who can pay, while poorer families in rural areas would go without care.'
      - 'Remember: the market listens to money, not to need.'
      - 'The trap is D, consumers are sovereign. That is a merit of the price mechanism, not a criticism of it.'
    hint: 'Which option is a fault of the price system, and which ones are its merits?'
    why:
      A: 'Under the price mechanism consumers, not producers, are said to be sovereign; this is not the standard criticism.'
      B: 'The price system gives a high degree of freedom of choice; that is one of its merits.'
      D: 'Consumer sovereignty is a merit of the price mechanism, not a criticism.'

  20:
    answer: D
    steps:
      - 'This is rent control, a maximum price or price ceiling.'
      - 'A maximum price is a legal price set below the equilibrium price to make a good cheaper for buyers.'
      - 'Only a ceiling below equilibrium lowers what tenants pay. A rent at or above equilibrium leaves the market rent where it is or higher, so it would not reduce the cost.'
      - 'Governments use rent control to help tenants; Lagos State''s Tenancy Law of 2011, for example, limits how much rent a landlord may demand in advance.'
      - 'Remember: to make it cheaper, put the ceiling below.'
      - 'The trap is C, above the equilibrium price. A rent fixed above equilibrium would make accommodation dearer, not cheaper, and leave houses empty.'
    hint: 'Where must the fixed rent be to make tenants pay less than the market rent?'
    why:
      A: 'Fixing rent at the prevailing rate changes nothing for tenants.'
      B: 'At the equilibrium price the rent is what the market already charges, so the cost does not fall.'
      C: 'Rent fixed above equilibrium is a minimum price; it raises the cost and leaves rooms empty.'

  21:
    answer: A
    steps:
      - 'This is economies of scale, here the internal purchasing and transport economies.'
      - 'Economies of scale are the falls in average cost that a firm enjoys as it grows larger.'
      - 'A large firm buys inputs in bulk and gets discounts, and it moves them in large loads, so the cost per unit falls.'
      - 'The Dangote Refinery in Lekki buys crude oil by the shipload and moves it through its own pipeline, so each barrel costs it less to buy and transport.'
      - 'Remember: bigger and bulkier means cheaper per unit.'
      - 'The trap is D, diseconomies of scale. Those are rises in average cost when a firm grows too big; here cost falls.'
    hint: 'Does the cost per unit rise or fall when the refinery buys in bulk?'
    why:
      B: 'Specialization is concentrating on one task or product, not cutting cost through bulk buying.'
      C: 'Division of labour splits work into small tasks among workers; it is not bulk purchase.'
      D: 'Diseconomies of scale raise average cost; bulk buying lowers it.'

  22:
    answer: A
    steps:
      - 'This is the isoquant map.'
      - 'An isoquant is a curve joining the combinations of two inputs, such as labour and capital, that give the same level of output.'
      - 'An isoquant above and to the right of another uses more of at least one input with no less of the other, so it stands for a higher level of output.'
      - 'A cassava processor in Benue with more workers and more grinding machines produces more garri, so her new combinations lie on a higher isoquant.'
      - 'Remember: further out, more output.'
      - 'The trap is D, a lower output level. That would be an isoquant below and to the left, closer to the origin.'
    hint: 'If both inputs increase, what happens to output?'
    why:
      B: 'Constant returns to scale is about how output grows when all inputs grow together, not about where one isoquant lies.'
      C: 'Over-capacity utilization is not shown by the position of an isoquant.'
      D: 'A lower output level is shown by an isoquant closer to the origin.'

  23:
    answer: B
    steps:
      - 'This is the short-run cost curves: fixed, variable and total cost.'
      - 'Total cost is fixed cost plus variable cost: TC = TFC + TVC. Fixed cost does not change with output, and variable cost is zero when output is zero.'
      - 'On the graph, T is a horizontal line, so it is fixed cost. M starts at the origin and rises with output, so it is variable cost. R starts on the cost axis at the height of T and keeps the shape of M above it, so R = T + M, total cost.'
      - 'A pure water factory in Ibadan pays its rent (fixed) even when it produces nothing, and pays for nylon and power (variable) only as it produces. Its total cost is both together.'
      - 'Remember: total cost starts where fixed cost is and climbs like variable cost.'
      - 'The trap is C, variable cost. Variable cost starts at zero output with zero cost, which is curve M; R starts above zero.'
    hint: 'Where does each curve start when output is zero?'
    why:
      A: 'Marginal cost is usually drawn U-shaped, not starting at the fixed cost and rising like this.'
      C: 'Variable cost is zero at zero output, which is curve M, not R.'
      D: 'Fixed cost is the horizontal line T.'

  24:
    answer: B
    steps:
      - 'This is the equilibrium of a monopolist, the output at which profit is greatest.'
      - 'Every firm maximizes profit where marginal cost equals marginal revenue (MC = MR), with MC cutting MR from below.'
      - 'On the graph, MC cuts MR at point C. Read straight down from C to the output axis: the output is OB.'
      - 'A sole cement maker in a region would raise output only while each extra bag adds more to revenue than to cost; it stops at the bag where the two are equal.'
      - 'Remember: profit is greatest where MC meets MR.'
      - 'The trap is C, OS. OS is the output at the lowest average cost, but a monopolist does not produce there; it stops short at OB, where MC = MR.'
    hint: 'Find where MC meets MR, then read down to the output axis.'
    why:
      A: 'BC is a vertical distance, a cost or revenue level, not a quantity of output.'
      C: 'OS is the output at minimum average cost, not where MC = MR.'
      D: 'BS is the gap between two outputs, the excess capacity, not the output produced.'

  25:
    answer: D
    steps:
      - 'This is total revenue on a cost and revenue graph.'
      - 'Total revenue = price × quantity sold: TR = P × Q. On a graph it is the rectangle under the demand curve at the chosen output.'
      - 'The firm produces OB, and the demand curve at B gives the price BG, which equals OH on the price axis. So TR = OH × OB, the rectangle with corners O, H, G and B, that is, GHOB.'
      - 'If a monopoly power company sells 1,000 units at ₦50 each, its total revenue is ₦50,000, a rectangle of height ₦50 and width 1,000.'
      - 'Remember: revenue reaches up to the demand curve; cost reaches up to the AC curve.'
      - 'The trap is A, GHEF. That rectangle is price minus average cost times output, which is the supernormal profit, not total revenue.'
    hint: 'Total revenue is price times quantity. Which rectangle has height OH and width OB?'
    why:
      A: 'GHEF is (price minus average cost) × output, the supernormal profit.'
      B: 'GHJC uses the MC = MR level, J, which is neither the price nor the average cost.'
      C: 'EFJC lies between average cost and the MC = MR level, and has no meaning as revenue.'

  26:
    answer: D
    steps:
      - 'This is per capita income.'
      - 'Per capita income is national income divided by the population: per capita income = national income ÷ population.'
      - 'Countries differ greatly in size, so total national income does not show how well off the average person is. Dividing by the population puts every country on a per head basis, which can be compared.'
      - 'Nigeria''s GDP is among the largest in Africa, but with over 200 million people its income per head is lower than that of smaller countries such as Botswana.'
      - 'Remember: per capita means per head.'
      - 'The trap is B, gross domestic product. GDP is total output; a big country can have a large GDP and still a low standard of living.'
    hint: 'Which measure takes account of how many people share the income?'
    why:
      A: 'Net national product is a total for the whole country, not adjusted for population.'
      B: 'GDP is total output, so large countries look richer than they are per person.'
      C: 'GNP is also a total, not shared out per head of population.'

  27:
    answer: A
    steps:
      - 'This is the speculative motive for holding money (Keynes''s liquidity preference).'
      - 'People hold money for speculation so that they can buy bonds when bond prices are low. Bond prices and interest rates move in opposite directions.'
      - 'When the interest rate is high, holding cash loses a lot of interest, and bond prices are low, so people buy bonds and hold less money. When the interest rate is low, they hold more money. So the speculative demand for money is inversely related to the interest rate.'
      - 'When the interest rate on Nigerian treasury bills is high, investors put their idle cash into them instead of keeping it in current accounts.'
      - 'Remember: interest up, idle money down.'
      - 'The trap is B, level of income. Income drives the transactions and precautionary demands, not the speculative demand.'
    hint: 'What do you give up by keeping money idle instead of buying bonds?'
    why:
      B: 'Income mainly drives the transactions and precautionary demands, and it moves with them, not against them.'
      C: 'The exchange rate is not the price that the speculative demand for money responds to in Keynes''s theory.'
      D: 'The inflation rate is not the variable Keynes linked to the speculative motive.'

  28:
    answer: A
    steps:
      - 'This is the transactions motive for holding money.'
      - 'The transactions demand for money is money held to pay for day-to-day purchases, such as food, rent and transport.'
      - 'Mr K borrows ₦50,000 to buy household needs, so he holds the money to make payments. He is not holding it against an emergency (precautionary) or to profit from changes in bond prices (speculative).'
      - 'A civil servant in Enugu who borrows to buy rice, kerosene and school uniforms is holding money for transactions.'
      - 'Remember: transactions are for today''s spending, precaution for tomorrow''s trouble, speculation for profit.'
      - 'The trap is D, transactional and speculative. Spending on household needs has no speculative part, since nothing is held to gain from bond prices.'
    hint: 'What will Mr K do with the money: spend it, save it for an emergency or buy bonds?'
    why:
      B: 'Speculative demand is money held to buy bonds when their prices fall, not to buy household needs.'
      C: 'Mr K is not holding the money against an emergency or to speculate; he is spending it.'
      D: 'Household spending is transactions demand only; nothing is held for speculation.'

  29:
    answer: D
    steps:
      - 'This is monetary policy, and its instrument, the discount rate.'
      - 'The discount rate (bank rate) is the rate at which the central bank lends to commercial banks. It is a monetary policy tool of the Central Bank of Nigeria.'
      - 'To fight inflation, the CBN raises the discount rate. Banks then charge more for loans, people and firms borrow and spend less, and the rise in prices slows down.'
      - 'The CBN''s discount rate was called the Minimum Rediscount Rate, and since 2006 it has been the Monetary Policy Rate. The CBN raises it when inflation climbs.'
      - 'Remember: the CBN works through money and interest; the government works through tax and spending.'
      - 'The trap is B, tax rate. Taxes are a fiscal tool set by the government through the budget, not by the CBN.'
    hint: 'Which option is a monetary tool that the central bank itself controls?'
    why:
      A: 'Tariffs on imports are a fiscal and trade tool of the government, not of the CBN.'
      B: 'Tax rates are a fiscal policy tool of the government.'
      C: 'The exchange rate is a price the CBN manages, but the classic tool for controlling inflation is the discount rate.'

  30:
    answer: B
    steps:
      - 'This is the price of money, the interest rate.'
      - 'The interest rate is set by the demand for and the supply of money. If the supply of money falls while demand stays the same, money becomes scarcer and its price rises.'
      - 'When the CBN reduces the money supply, banks have less to lend. Borrowers compete for the smaller pool of loans, and the interest rate rises.'
      - 'When the CBN tightens money through a higher cash reserve ratio, Nigerian banks raise their lending rates to customers.'
      - 'Remember: less money, dearer money.'
      - 'The trap is C, fall. A fall in the interest rate comes from more money, not less.'
    hint: 'If money becomes scarcer, what happens to its price?'
    why:
      A: 'The direction is clear, so the rate does not merely fluctuate; it rises.'
      C: 'The interest rate falls when the money supply is increased.'
      D: 'A change in money supply does change the interest rate, unless demand changes in step.'

  31:
    answer: A
    steps:
      - 'This is expansionary fiscal policy.'
      - 'Fiscal policy uses government spending and taxation. Expansionary fiscal policy raises total demand by cutting taxes or raising spending.'
      - 'A cut in the corporate profit tax rate leaves firms with more after-tax profit to invest and expand, so total demand and output rise. It is a fiscal action because it changes a tax.'
      - 'The Nigerian government has cut company income tax for small companies to help them grow and hire more workers.'
      - 'Remember: fiscal is the budget (tax and spending); monetary is money and banks.'
      - 'The trap is C, purchase of government securities. That is expansionary too, but it is an open market operation of the central bank, a monetary policy.'
    hint: 'First sort out which options are fiscal; then which one expands demand.'
    why:
      B: 'A cut in welfare payments reduces spending, so it is contractionary.'
      C: 'Buying government securities is an open market operation, a monetary tool.'
      D: 'A cut in the bank rate is a monetary policy action of the central bank.'

  32:
    answer: C
    steps:
      - 'This is tax incidence, who finally bears a tax.'
      - 'The burden of a tax falls more on the side of the market that is less elastic. If supply is perfectly inelastic, the whole tax falls on the sellers.'
      - 'The supply of land is fixed: a tax cannot make less land exist. Owners cannot cut supply to push the rent up, so the rent stays where demand sets it and the tax comes out of the owners'' income.'
      - 'A landowner in Lekki who must pay land use charge cannot pass it on in higher rent, because tenants pay only what the market will bear.'
      - 'Remember: fixed supply, owner pays.'
      - 'The trap is D, partly on users and owners. That happens when supply can respond, but land supply cannot.'
    hint: 'Can the amount of land be reduced when it is taxed?'
    why:
      A: 'Agents do not bear the tax, and users cannot be made to pay more for land of fixed supply.'
      B: 'Users pay only what demand sets; the owner cannot pass the tax to them.'
      D: 'Sharing happens when supply is elastic, but land is in fixed supply.'

  33:
    answer: C
    steps:
      - 'This is development planning.'
      - 'A development plan is a government''s programme of goals and projects for a set period to develop the economy.'
      - 'Growth of output, jobs, roads and power are the means; the final aim is a higher standard of living for the citizens.'
      - 'Nigeria''s plans, from the First National Development Plan (1962 to 1968) to Vision 20:2020 and the Economic Recovery and Growth Plan (2017 to 2020), all aimed to raise the welfare of Nigerians.'
      - 'Remember: plans aim at people''s welfare.'
      - 'The trap is B, improve GDP. Raising GDP is a means to that end, not the final goal.'
    hint: 'What is all the growth in a plan meant to do for ordinary Nigerians?'
    why:
      A: 'Plans aim at national welfare, not at the profits of multinational firms.'
      B: 'Raising GDP is a means; a higher standard of living is the goal.'
      D: 'Deregulation is one possible policy, not the goal of development plans.'

  34:
    answer: A
    steps:
      - 'This is the role of life insurance companies as financial institutions.'
      - 'Life insurers collect premiums over many years and pay out only on death or at the end of a policy. Their liabilities are long-term.'
      - 'So they can lend their funds for the long term, buying government bonds, company shares and mortgages. This long-term finance pays for factories, roads and houses, which drives development.'
      - 'Nigerian life insurers hold Federal Government bonds and shares on the Nigerian Exchange, which help fund infrastructure and companies.'
      - 'Remember: long-term promises, long-term investments.'
      - 'The trap is C, cash and near money. Insurers keep some cash for claims, but cash finances nothing; the long-term investments do.'
    hint: 'How long do life insurers usually wait before paying out?'
    why:
      B: 'Money market instruments are short-term and finance trade more than development.'
      C: 'Cash and near money are kept for claims; they do not finance projects.'
      D: 'Short-term instruments do not suit the long-term funds of life insurers.'

  35:
    answer: B
    steps:
      - 'This is value addition.'
      - 'Value is added when a raw product is changed into a form that is worth more, through processing or manufacturing.'
      - 'Processing turns cheap raw produce into finished goods that fetch higher prices, earn more foreign exchange and create jobs in factories.'
      - 'Cocoa from Ondo is worth far more as chocolate or cocoa butter, and cassava as starch, flour or ethanol, than as raw beans or tubers.'
      - 'Remember: process to add value.'
      - 'The trap is D, advertise them in European markets. Advertising may sell more, but it sells the same raw produce; nothing is added to it.'
    hint: 'Which option turns the raw produce into something worth more?'
    why:
      A: 'Hybrid crops raise the quantity grown, not the value added to each unit of produce.'
      C: 'Modern storage cuts losses, but the produce stays raw.'
      D: 'Advertising sells the produce without changing it into anything of higher value.'

  36:
    answer: D
    steps:
      - 'This is a problem of agriculture in West Africa.'
      - 'Low output in farming comes mainly from low productivity: farmers work with simple tools and little capital.'
      - 'With hoes and cutlasses a farmer can clear and tend only a small plot, so output per worker and per hectare stays low. Mechanization would let each farmer do far more.'
      - 'Most smallholders in Nigeria still farm with hoes and cutlasses, and few use tractors, so yields of yam, maize and sorghum stay low.'
      - 'Remember: crude tools, low yields.'
      - 'The trap is C, over dependence on agriculture for subsistence. Subsistence farming keeps farms small, but the main cause of low output is the crude tools they use.'
    hint: 'What do most West African farmers use to till their land?'
    why:
      A: 'Large agro-allied industries would raise demand for farm output and help farming, not lower it.'
      B: 'A high dependency ratio affects household welfare, but it is not the main cause of low farm output.'
      C: 'Subsistence farming is a feature of small farms, but crude tools are the main cause of low output.'

  37:
    answer: D
    steps:
      - 'This is the location of industry.'
      - 'An industry whose raw materials are bulky, heavy or lose weight in processing locates near the raw materials, to save transport cost.'
      - 'Bricks need large amounts of clay, which is heavy and bulky, and the clay loses water and weight when it is fired. Moving the clay to a distant market would cost more than moving the bricks, so brick works are sited at the clay pits.'
      - 'Brick works in Nigeria are sited beside the clay pits, and the cement works at Ewekoro and Obajana stand on their limestone deposits for the same reason.'
      - 'Remember: bulky input, build at the source.'
      - 'The trap is A, market. Market location suits goods that gain weight or perish in making, like bread or soft drinks, not bricks.'
    hint: 'Which input does a brick factory use in the largest and heaviest amounts?'
    why:
      A: 'Market location suits weight-gaining or perishable goods, not a bulky-raw-material industry like bricks.'
      B: 'Power is needed, but it can be brought to the site; it is not the deciding factor.'
      C: 'Water is used in brick-making, but in small amounts compared with clay.'

  38:
    answer: C
    steps:
      - 'This is privatization.'
      - 'Privatization is the transfer of the ownership of public enterprises, wholly or partly, to private owners.'
      - 'Private owners run firms for profit, so they cut waste, reward performance and avoid political appointments. This raises efficiency.'
      - 'Through the Bureau of Public Enterprises (BPE), Nigeria privatized many hotels, cement companies and, in 2013, the power distribution companies, to make them more efficient.'
      - 'Remember: profit motive, efficient firm.'
      - 'The trap is D, nationalization. That is the opposite, taking firms into government ownership, which the question shows to be inefficient.'
    hint: 'Which option hands the corporation to owners who must make a profit?'
    why:
      A: 'A public offer is a way of selling shares, not in itself a way to make public corporations efficient.'
      B: 'Indigenization transferred ownership from foreigners to Nigerians, not from government to private hands.'
      D: 'Nationalization takes firms into public ownership, the cause of the inefficiency, not the cure.'

  39:
    answer: B
    steps:
      - 'This is government participation in the Nigerian oil industry.'
      - 'In 1968 OPEC (the Organization of the Petroleum Exporting Countries) resolved that member countries should take a share in the ownership of the oil companies operating in their lands.'
      - 'When Nigeria joined OPEC in 1971, it set up the Nigerian National Oil Corporation (NNOC) and began to take equity stakes in the foreign oil firms, rising to 55% and then 60% by 1979.'
      - 'The NNOC merged with the Ministry of Petroleum Resources to form the NNPC in 1977, and the NNPC became NNPC Limited in 2022.'
      - 'Remember: OPEC in, government in.'
      - 'The trap is D, huge investment outlay. A huge cost is a reason for leaving oil to the big foreign firms, which is why the government went into joint ventures with them, not the reason it took part.'
    hint: 'Which organization did Nigeria join in 1971, and what did it ask its members to do?'
    why:
      A: 'Rising production alone did not require the government to take ownership.'
      C: 'High demand for crude oil raised revenue, but it did not require government participation.'
      D: 'The huge cost is why the government partnered with foreign firms, not why it entered the industry.'

  40:
    answer: A
    steps:
      - 'This is deregulation.'
      - 'Deregulation is the removal of government controls on prices, entry and distribution, so that market forces decide them.'
      - 'When prices are set by supply and demand and many firms may import, refine and sell, competition pushes them to price efficiently and to distribute products where they are needed, and the shortages caused by fixed prices disappear.'
      - 'After the downstream sector was opened up, independent marketers and private depots joined NNPC in distributing petrol, and the Petroleum Industry Act of 2021 aimed for full deregulation.'
      - 'Remember: deregulate, and the market sets the price and the flow.'
      - 'The trap is B, an end to the importation of fuel. Deregulation lets anyone import, so it does not end importation by itself.'
    hint: 'What happens when the government stops fixing the price and lets firms compete?'
    why:
      B: 'Deregulation does not by itself end fuel imports; it lets more firms import.'
      C: 'Opening up the market may let in more foreign firms, not end their role.'
      D: 'Fixing production quotas is a control, the opposite of deregulation.'

  41:
    answer: B
    steps:
      - 'This is the consumer co-operative society.'
      - 'A consumer co-operative is a business owned by its members, who are also its customers. They buy goods in bulk and sell to themselves at fair prices.'
      - 'Members contribute the capital, each has one vote, and surplus is shared in proportion to what each member bought, so ownership and use go together.'
      - 'Staff co-operative shops in Nigerian universities and ministries are owned by the staff, who are the members and who buy from them.'
      - 'Remember: in a consumer co-op, the customers own the shop.'
      - 'The trap is C, members are the workers. That describes a producer or workers'' co-operative, not a consumer one.'
    hint: 'Who owns a consumer co-operative shop, and who buys from it?'
    why:
      A: 'A limit of 20 members belongs to an ordinary partnership, not a co-operative.'
      C: 'Members who are the workers form a producer co-operative.'
      D: 'A minimum of five is not what distinguishes a consumer co-operative.'

  42:
    answer: B
    steps:
      - 'This is the partnership, a form of business organization.'
      - 'A partnership is a business owned by two to twenty people who share capital, management, profits and losses under an agreement.'
      - 'Because each partner can bind the firm and all take part in decisions, disagreement and distrust among partners can slow decisions and even break up the business. This is a major disadvantage.'
      - 'Many partnerships in Nigeria, such as two friends running a printing press, break up when the partners quarrel over money or decisions.'
      - 'Remember: partners share everything, including their quarrels.'
      - 'The trap is A, the sharing of risks among the partners. Sharing risks is an advantage of a partnership, not a disadvantage.'
    hint: 'Which option can make the partners unable to work together?'
    why:
      A: 'Sharing risks among the partners is an advantage of a partnership.'
      C: 'Ordinary partners have unlimited liability; limited liability would not be a disadvantage anyway.'
      D: 'A partnership needs less capital than a company; large capital outlay is not its problem.'

  43:
    answer: D
    steps:
      - 'This is the quality (efficiency) of labour.'
      - 'The quality of labour is the skill, knowledge and health of the workers, which decide how much each one can produce.'
      - 'Training raises skill and productivity directly. Skills acquisition centres teach practical trades, so the same workers become more productive.'
      - 'Government skills centres and schemes such as the NDE''s vocational training teach young Nigerians trades like welding, tailoring and ICT.'
      - 'Remember: quality comes from training; quantity comes from numbers.'
      - 'The trap is B, creating sufficient job opportunities. More jobs employ more people, but they do not by themselves make each worker more skilled.'
    hint: 'Which option makes each worker more skilled?'
    why:
      A: 'Raising the retirement age keeps workers longer, which changes the quantity of labour, not its quality.'
      B: 'More jobs raise employment, not the skill of each worker.'
      C: 'Rural-urban migration moves workers from one place to another; it does not train them.'

  44:
    answer: A
    steps:
      - 'This is emigration, a factor in population change.'
      - 'Emigration is the movement of people out of their country to live in another. It is the opposite of immigration.'
      - 'Population grows with births and immigration and falls with deaths and emigration. When people leave, the population of the home country falls.'
      - 'The many young Nigerian doctors and nurses who have left for the UK and Canada, often called the japa wave, reduce Nigeria''s population.'
      - 'Remember: emigrate means exit.'
      - 'The trap is C, increase in population. That is the effect of immigration, people coming in.'
    hint: 'Are people coming in or going out?'
    why:
      B: 'People leaving may free jobs for those who stay; emigration does not reduce job openings directly.'
      C: 'Population rises with immigration, not emigration.'
      D: 'Emigrants are mostly working-age people, but the direct effect asked for is on the size of the population.'

  45:
    answer: D
    steps:
      - 'This is the external value of the naira, its exchange rate.'
      - 'Like any price, the exchange rate is set by demand and supply. If demand for the naira rises or its supply falls, its value rises.'
      - 'When the government (through the CBN) uses its foreign reserves to buy naira, it raises demand for the naira and takes naira out of the market, so the naira''s value is held up.'
      - 'The CBN sells dollars from its reserves to banks and bureaux de change, buying naira in return, to defend the naira.'
      - 'Remember: to keep a currency up, buy it.'
      - 'The trap is B, sell its own currency. Selling naira adds to its supply, which pushes its value down.'
    hint: 'To keep a price up, should you add to the supply or add to the demand?'
    why:
      A: 'Spending the reserves on goods drains them without supporting the naira.'
      B: 'Selling naira increases its supply and lowers its value.'
      C: 'A lower interest rate drives funds out of the country and weakens the naira.'

  46:
    answer: C
    steps:
      - 'This is fiscal policy and its instruments.'
      - 'Fiscal policy is the use of government revenue (taxes) and spending to influence the economy. Monetary policy uses the money supply and interest rates.'
      - 'Income tax takes part of people''s income; raising it cuts their spending power, and cutting it raises spending. So it influences the level and pattern of demand.'
      - 'A rise in Nigeria''s Personal Income Tax reduces what workers have left to spend, and demand for goods falls.'
      - 'Remember: fiscal is tax and spending.'
      - 'The trap is B, interest rate. It does influence demand, but it is a monetary tool of the CBN, not a fiscal one.'
    hint: 'Which option is a tax or a government expenditure?'
    why:
      A: 'Open market operations are a monetary tool of the central bank.'
      B: 'The interest rate is a monetary policy tool.'
      D: 'The cash reserve ratio is a monetary tool of the central bank.'

  47:
    answer: B
    steps:
      - 'This is the Economic Commission for Africa (ECA), a United Nations body set up in 1958 with its headquarters in Addis Ababa.'
      - 'The ECA promotes the economic and social development of Africa through research, advice and regional projects.'
      - 'Among its achievements are the Trans-African Highway network and the Pan-African telecommunications network, and it helped set up the African Development Bank in 1964.'
      - 'Nigeria benefits from the Trans-African Highway routes, such as the Lagos to Mombasa route.'
      - 'Remember: the ECA plans and connects; it does not make trade law.'
      - 'The trap is A, eliminating trade restrictions among states. The ECA has no power to remove trade barriers; that is the aim of trade blocs such as ECOWAS.'
    hint: 'Which option is the kind of regional project an advisory UN commission could promote?'
    why:
      A: 'Removing trade restrictions is the work of trade blocs like ECOWAS, not the ECA.'
      C: 'The ECA does not guarantee investment flows into Africa.'
      D: 'The machinery for collaboration on monetary issues is the purpose of the IMF.'

  48:
    answer: C
    steps:
      - 'This is the rate of interest on loans.'
      - 'The interest rate a bank charges is the price of a loan. It includes a reward for the risk that the borrower will not repay.'
      - 'The greater the risk of default, the higher the rate the lender charges to cover possible losses. Safe borrowers with good security get lower rates.'
      - 'A Nigerian bank charges a big firm with collateral a lower rate than a new trader with no security, because the trader''s loan is riskier.'
      - 'Remember: more risk, more interest.'
      - 'The trap is B, marginal efficiency of capital. MEC shapes the demand for investment funds, but the rate a lender charges on a given loan depends largely on the risk.'
    hint: 'Why do two borrowers at the same bank pay different rates?'
    why:
      A: 'The exchange rate does not decide the interest charged on a loan.'
      B: 'MEC decides how much firms want to borrow, not the rate the lender charges a particular borrower.'
      D: 'The tax rate is not the main factor in the interest charged on loans.'

  49:
    answer: A
    steps:
      - 'This is the marginal productivity theory of wages.'
      - 'Wages tend to equal the marginal revenue product of labour, the extra output a worker adds, valued at the market price.'
      - 'When productivity rises, each worker adds more output, so employers can pay more in real terms and still gain. So real wages grow with productivity.'
      - 'A rice farm in Kebbi that gives its workers tractors and better seed gets more rice from each worker, and can pay each of them more.'
      - 'Remember: real wages follow productivity.'
      - 'The trap is D, an increase in the quantity of labour. More workers add to supply, which tends to push wages down, not up.'
    hint: 'What must happen to each worker''s output for real wages to rise?'
    why:
      B: 'A rising cost of capital lowers investment and productivity, so it does not raise real wages.'
      C: 'A fall in employment does not explain a rise in real wages.'
      D: 'More labour supply tends to lower wages, not raise them.'

  50:
    answer: B
    steps:
      - 'This is frictional unemployment.'
      - 'Frictional unemployment is short-term unemployment while people move between jobs or search for a suitable one.'
      - 'Mr X has the same skills as before and his kind of job still exists; he only needs time to find a matching opening. That search time is frictional unemployment.'
      - 'A sales clerk in Port Harcourt who loses her job and spends months finding a similar post at another shop is frictionally unemployed.'
      - 'Remember: friction is the time it takes to slide from one job to the next.'
      - 'The trap is A, structurally unemployed. Structural unemployment means the skill is no longer wanted; Mr X found a similar job, so his skill was still in demand.'
    hint: 'Was Mr X''s kind of job still available, and did he find one in the end?'
    why:
      A: 'Structural unemployment comes from a lasting fall in demand for a skill; Mr X found a similar job.'
      C: 'Seasonal unemployment follows the seasons, as in farming; a clerk''s job is not seasonal.'
      D: 'Cyclical unemployment comes from a general slump in the economy, which the question does not describe.'
