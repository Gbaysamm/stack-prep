format_version: 1
exam_year: 2014
subject: ECO
explanations:
  2:
    answer: A
    steps:
      - 'This is the "how to produce" problem in a command (centrally planned) economy.'
      - 'In a command economy the state owns the means of production, and a central planning authority decides what to produce, how to produce it and for whom.'
      - 'So the choice of methods, such as which machines, how much labour and which factories, is made by the government through its plans, not by prices in a market.'
      - 'Nigeria is a mixed economy, but where the state ran an industry itself, as with the old NEPA or the Ajaokuta steel plant, government officials chose the methods used.'
      - 'Remember: command means the government gives the commands.'
      - 'The trap is B, consumers. Consumers guide production in a free market, not in a command economy.'
    hint: 'Who owns the factories in a command economy?'
    why:
      B: 'Consumers steer production through their spending in a free market, not under central planning.'
      C: 'Private industrialists hardly exist in a command economy; state planners run the industries.'
      D: 'Labour unions bargain over pay and conditions; they do not choose production methods.'

  3:
    answer: D
    steps:
      - 'This is consumer sovereignty, the idea that consumers are "king" in a capitalist economy.'
      - 'In a free market, firms produce what they can sell at a profit, and what sells is decided by what households choose to spend their money on.'
      - 'Each naira spent is like a vote. Goods that get many votes earn profits and are made in larger amounts; goods that nobody buys make losses and are dropped.'
      - 'When more Lagos households started buying sachet water, more firms set up to produce it. The spending came first and the output followed.'
      - 'Remember: firms propose, but households dispose, with their naira votes.'
      - 'The trap is C, output decisions of firms. Firms make the output decisions, but they make them to match household spending, so the final answer lies with households.'
    hint: 'Why does a firm in a free market choose to make one good and not another?'
    why:
      A: 'Income limits how much households can buy, but it is how they spend it that tells firms which goods to make.'
      B: 'Technical skills affect how goods are produced, not which goods are wanted.'
      C: 'Firms decide output only in answer to household spending, so they are not the final judges.'

  4:
    answer: A
    steps:
      - 'This is the range, the simplest measure of dispersion.'
      - 'Dispersion tells us how spread out the values are. The range is the highest value minus the lowest value.'
      - 'If the tallest tree is 30 m and the shortest is 4 m, the range is 30 − 4 = 26 m. Only those two trees are used.'
      - 'Variance, standard deviation and mean deviation all use every tree, measured from the mean, so they cannot be found from two trees alone.'
      - 'A trader at Bodija market who says her tomato baskets sell for between ₦3,000 and ₦9,000 is giving a range of ₦6,000.'
      - 'Remember: range uses only the two ends, top and bottom.'
      - 'The trap is B, variance. It is a measure of dispersion too, but it needs every value and the mean.'
    hint: 'Which measure needs only the largest and the smallest value?'
    why:
      B: 'Variance averages the squared distances of every tree from the mean, so it needs all the trees.'
      C: 'Standard deviation is the square root of the variance, so it also needs every tree.'
      D: 'Mean deviation averages how far every tree is from the mean, so it needs all the trees.'

  5:
    answer: A
    steps:
      - 'This is reading a pie chart, where the whole circle, 360°, stands for the whole national income.'
      - 'The share of a sector is its angle over 360°, times 100%.'
      - 'Data: Agric 72°, Manufacturing 108°, Mining 126°. Services angle = 360° − (72° + 108° + 126°) = 360° − 306° = 54°.'
      - 'Percentage for services = $\dfrac{54}{360} \times 100\% = 15\%$.'
      - 'Check: Agric 20%, Manufacturing 30%, Mining 35% and Services 15% add up to 100%. A Nigerian GDP chart drawn by the National Bureau of Statistics is read the same way.'
      - 'Remember: angle over three hundred and sixty, then times a hundred.'
      - 'The trap is C, 54%. That is the angle in degrees, not the percentage.'
    hint: 'First find the missing angle. What do all the angles of a circle add up to?'
    why:
      B: '10% would be an angle of 36°, but the services angle is 54°.'
      C: '54 is the angle in degrees; it must still be divided by 360 and multiplied by 100.'
      D: '24% would be an angle of about 86°, but the services angle is 54°.'

  6:
    answer: C
    steps:
      - 'This is reading a pie chart to find the value of one sector.'
      - 'The value of a sector = $\dfrac{\text{its angle}}{360°} \times$ the total.'
      - 'Data: manufacturing angle = 108°, national income = ₦360 million.'
      - 'Manufacturing = $\dfrac{108}{360} \times 360 = 108$, so ₦108 million.'
      - 'Check: 108° is 30% of the circle, and 30% of ₦360 million is ₦108 million. Because the total is ₦360 million, each degree here is worth exactly ₦1 million.'
      - 'Remember: angle over three hundred and sixty, times the total.'
      - 'The trap is A, ₦126 million. That is the mining sector, the largest slice, not manufacturing.'
    hint: 'With a total of ₦360 million, how much is one degree of the circle worth?'
    why:
      A: '₦126 million is the mining sector, with 126°.'
      B: '₦72 million is the agricultural sector, with 72°.'
      D: '₦54 million is the services sector, with 54°.'

  7:
    answer: C
    steps:
      - 'This is a shift of the demand curve, an increase in demand from D₀D₀ to D₁D₁.'
      - 'The demand curve shifts only when a factor other than the good''s own price changes: income, population, tastes, prices of related goods or expectations.'
      - 'On the graph the whole curve moves to the right, so at every price more is demanded, and the new equilibrium has a higher price, P₁, and a larger quantity, Q₁.'
      - 'A rise in consumers'' income lets each buyer buy more, and a larger population adds more buyers. Both push demand to the right.'
      - 'When salaries are paid at the end of the month and more people move into Abuja, demand for food at the mama put stalls rises at every price.'
      - 'Remember: own price moves you along the curve; anything else moves the curve.'
      - 'The trap is D. Taste does shift demand, but a change in the good''s own price only moves along the curve.'
    hint: 'Which factors are not the good''s own price, and act on buyers rather than sellers?'
    why:
      A: 'A change in technology shifts the supply curve, not the demand curve.'
      B: 'A change in the good''s own price moves along the demand curve; it does not shift it.'
      D: 'Taste shifts demand, but a change in the good''s own price only causes a movement along the curve.'

  8:
    answer: A
    steps:
      - 'This is market equilibrium from linear demand and supply equations.'
      - 'At equilibrium, quantity demanded equals quantity supplied: $Q_d = Q_s$.'
      - 'Data: $Q_d = 40 - 2P$, $Q_s = 6P + 24$. Set them equal: $40 - 2P = 6P + 24$.'
      - 'Collect terms: $40 - 24 = 6P + 2P$, so $16 = 8P$ and $P = 2$. The equilibrium price is ₦2.'
      - 'Check: $Q_d = 40 - 4 = 36$ and $Q_s = 12 + 24 = 36$. They match.'
      - 'Think of a seller of pure water sachets: at ₦2 a sachet, buyers want exactly as many as sellers bring.'
      - 'The trap is D, ₦16. That is 8P, the step before dividing by 8. ₦36 is the equilibrium quantity, not the price.'
    hint: 'Put the two equations equal to each other, then get P on its own.'
    why:
      B: '₦32 does not solve the equation; at P = 32 demand would be negative.'
      C: '36 is the equilibrium quantity, not the price.'
      D: '16 is 8P; dividing by 8 gives the price, ₦2.'

  9:
    answer: B
    steps:
      - 'This is a change in demand, as against a change in quantity demanded.'
      - 'A change in demand means buyers want a different amount at every price, so the whole demand curve shifts, to the right for an increase and to the left for a decrease.'
      - 'A change in quantity demanded is caused only by a change in the good''s own price, and it is a movement along the same curve.'
      - 'If incomes rise, Nigerians buy more rice at every price, so the demand curve for rice shifts right.'
      - 'Remember: demand changes, curve shifts; price changes, you slide along.'
      - 'The trap is C, movement along a given demand curve. That is a change in quantity demanded, caused by the good''s own price.'
    hint: 'Does a change in demand move you along the curve, or move the curve itself?'
    why:
      A: 'That is a change in quantity demanded, caused by the good''s own price.'
      C: 'A movement along the curve is a change in quantity demanded, not in demand.'
      D: 'Elasticity measures how strongly buyers respond; a change in demand need not change it.'

  10:
    answer: C
    steps:
      - 'This is the price elasticity of demand (PED).'
      - 'PED measures how strongly quantity demanded responds to price: $\text{PED} = \dfrac{\%\,\Delta Q_d}{\%\,\Delta P}$. If it is below 1, demand is inelastic; if above 1, elastic; if exactly 1, unitary.'
      - 'Data: $\%\,\Delta P = 10\%$, $\%\,\Delta Q_d = 5\%$. So $\text{PED} = \dfrac{5}{10} = 0.5$.'
      - 'Check: 0.5 is less than 1 but more than 0, so quantity responds, but less than price does. That is inelastic demand.'
      - 'Salt and kerosene in Nigeria have inelastic demand: when the price rises, people still buy nearly as much.'
      - 'Remember: less than one, less response, inelastic.'
      - 'The trap is A, unitary elastic. That needs the two percentages to be equal, but 5% is only half of 10%.'
    hint: 'Divide the percentage change in quantity by the percentage change in price. Is the answer above or below 1?'
    why:
      A: 'Unitary demand needs equal percentage changes; here 5% is half of 10%.'
      B: 'Perfectly inelastic demand means quantity does not change at all, but it fell by 5%.'
      D: 'Elastic demand needs a value above 1; this is 0.5.'

  11:
    answer: B
    steps:
      - 'This is consumer equilibrium with indifference curves and a budget line.'
      - 'The consumer is in equilibrium where the budget line just touches (is tangent to) the highest indifference curve it can reach.'
      - 'When the price of X falls, the same income buys more X, so the budget line swings out from the same point on the Y axis, from I to II.'
      - 'On the new line II, the highest curve it touches is U₂, at K. M is also on line II, but it lies on the lower curve U₁, so the consumer can do better. L is on U₃, which line II cannot reach. J was the old equilibrium on line I.'
      - 'When the price of garri falls, a student on the same allowance moves to a new best mix with more garri, just as the consumer moves from J to K.'
      - 'Remember: the best point is where the line kisses the curve, not where it cuts it.'
      - 'The trap is A, J. It was the equilibrium before the price fell, but it is not on the new budget line.'
    hint: 'Look along budget line II. Which point is on the highest curve that line can just touch?'
    why:
      A: 'J was the equilibrium on the old budget line I, before the price of X fell.'
      C: 'L is on U₃, which lies beyond what the consumer can afford on either budget line.'
      D: 'M is on line II, but it is on the lower curve U₁; moving along the line to K reaches a higher curve.'

  12:
    answer: C
    steps:
      - 'This is a shift of the budget line.'
      - 'The budget line shows every mix of two goods a consumer can buy with a given income at given prices. It moves when income or prices change.'
      - 'If a commodity becomes relatively cheaper, the same income buys more of it, so the budget line moves out to the right along that good''s axis. A rise in income moves it right too.'
      - 'If the price of a bag of rice falls while a worker''s salary in Kano stays the same, the worker can now buy more rice, so the budget line moves outwards.'
      - 'Remember: cheaper goods or more money push the line out; dearer goods or less money pull it in.'
      - 'The trap is D. A rise in price means less can be bought, so the line moves to the left, not the right.'
    hint: 'If something becomes cheaper, can you afford more or less of it with the same money?'
    why:
      A: 'A fall in income lets the consumer buy less, so the line shifts to the left.'
      B: 'Tastes change the indifference curves, not the budget line.'
      D: 'A rise in price lets the consumer buy less, so the line moves to the left.'

  13:
    answer: D
    steps:
      - 'This is solving a linear supply function for quantity supplied.'
      - 'Substitute the given price into the function and solve for $Q_s$.'
      - 'Data: $P = \tfrac{1}{4}(Q_s + 10)$, $P = 10$. So $10 = \tfrac{1}{4}(Q_s + 10)$.'
      - 'Multiply both sides by 4: $40 = Q_s + 10$. Subtract 10: $Q_s = 30$.'
      - 'Check: $\tfrac{1}{4}(30 + 10) = \tfrac{40}{4} = 10$. It works.'
      - 'A palm oil seller whose supply rule is this one would bring 30 tins when the price is ₦10 a unit.'
      - 'The trap is A, 20. That comes from 10 + 10, forgetting to multiply by 4 first.'
    hint: 'Put P = 10 in, then clear the quarter by multiplying both sides by 4.'
    why:
      A: '20 comes from adding 10 and 10 without first multiplying the price by 4.'
      B: '15 does not fit: $\tfrac{1}{4}(15 + 10) = 6.25$, not 10.'
      C: '50 comes from multiplying 10 by 4 and then adding 10 instead of taking it away.'

  14:
    answer: B
    steps:
      - 'This is the price elasticity of supply (PES).'
      - '$\text{PES} = \dfrac{\%\,\Delta Q_s}{\%\,\Delta P}$, each change measured from the starting value.'
      - 'Data: price 8 → 10, quantity 20 → 24. $\%\,\Delta Q_s = \dfrac{4}{20} \times 100 = 20\%$; $\%\,\Delta P = \dfrac{2}{8} \times 100 = 25\%$.'
      - '$\text{PES} = \dfrac{20}{25} = 0.8$.'
      - 'Check: 0.8 is less than 1, so supply is inelastic. Quantity rose by a smaller percentage than price, which fits.'
      - 'Tomato farmers in Kano cannot double their crop overnight when the price rises, so their supply is inelastic in the short run.'
      - 'The trap is D, 1.25. That divides the price change by the quantity change, the formula upside down.'
    hint: 'Work out each percentage change from the first row, then put quantity on top.'
    why:
      A: '0.50 divides the change in price, 2, by the change in quantity, 4, without turning them into percentages.'
      C: '2.00 divides the change in quantity, 4, by the change in price, 2, without turning them into percentages.'
      D: '1.25 is the formula upside down: price change over quantity change.'

  15:
    answer: C
    steps:
      - 'This is a price set below equilibrium, a maximum price or price ceiling.'
      - 'By the law of supply, sellers offer less at a lower price, and by the law of demand, buyers want more.'
      - 'So at a price below equilibrium, quantity supplied falls and quantity demanded rises, and the gap between them is a shortage.'
      - 'When petrol is sold below its market price, filling stations get less supply, and long queues and black markets follow.'
      - 'Remember: price ceiling, supply sinks, queues grow.'
      - 'The trap is D, a fall in price. The lower price is the cause the government sets, not the result.'
    hint: 'What does the law of supply say sellers do when the price is lower?'
    why:
      A: 'A lower price makes sellers offer less, not more.'
      B: 'The fixed price stops the market from reaching equilibrium; a shortage remains.'
      D: 'The lower price is what was set; the question asks what it leads to.'

  16:
    answer: B
    steps:
      - 'This is the price mechanism, also called the market system.'
      - 'The price mechanism is the free interaction of buyers and sellers, the forces of demand and supply, which fixes prices without anyone in charge.'
      - 'If demand for a good rises, its price rises, and producers are drawn to make more; if demand falls, its price falls and producers make less.'
      - 'The price of a basket of tomatoes in Mile 12 market rises in the dry season, when supply is low, and falls at harvest time, with no government order.'
      - 'Remember: price mechanism equals market forces.'
      - 'The trap is D, government legislation. Prices fixed by law are price control, the opposite of the price mechanism.'
    hint: 'What two forces meet in every market?'
    why:
      A: 'Auctioning is one way of selling, but it is not how the whole price system works.'
      C: 'Treasury bills are a government borrowing tool, not how goods are priced.'
      D: 'Prices set by law are price control, not the price mechanism.'

  17:
    answer: A
    steps:
      - 'This is total, average and marginal product.'
      - 'Average product $\text{AP} = \dfrac{\text{TP}}{L}$, so $\text{TP} = \text{AP} \times L$. Marginal product $\text{MP} = \text{TP}_n - \text{TP}_{n-1}$.'
      - 'E is TP at 3 units of labour: $E = 9 \times 3 = 27$.'
      - 'F is MP of the 4th unit: $F = 28 - 27 = 1$.'
      - 'Check: MP of the 3rd unit is $27 - 20 = 7$, as the table shows. And AP at 4 is $28 \div 4 = 7$, which also fits.'
      - 'On a cassava farm, if three workers together lift 27 bags, the fourth worker who raises it to 28 adds just 1 bag.'
      - 'The trap is C, 28 and 5. It copies the TP of the next row instead of working out E from the average product.'
    hint: 'Average product times the number of workers gives total product.'
    why:
      B: '68 and 12 do not fit: 68 ÷ 3 is not 9.'
      C: '28 is the TP of 4 workers, not 3; E must be 9 × 3 = 27.'
      D: '12 and 19 do not fit: 12 ÷ 3 is 4, not 9.'

  18:
    answer: C
    steps:
      - 'These are internal economies of scale.'
      - 'Internal economies of scale are savings in cost per unit that a firm enjoys because of its own growth in size.'
      - 'A large firm can buy in bulk at a discount, use big machines, borrow more cheaply and divide work among specialists, so each unit costs less.'
      - 'Dangote Cement buys fuel and bags in huge amounts and runs very large kilns, so its cost per bag is lower than that of a small producer.'
      - 'Remember: internal is inside the firm, from its own size; external comes from the whole industry.'
      - 'The trap is A, external economies. Those come from the growth of the whole industry in an area, not from the firm''s own size.'
    hint: 'The saving comes from the firm''s own size. Is that inside or outside the firm?'
    why:
      A: 'External economies come from the growth of the whole industry, not from the firm''s own size.'
      B: 'External diseconomies are extra costs from the industry''s growth, such as congestion.'
      D: 'Internal diseconomies would raise the large firm''s cost per unit, not lower it.'

  19:
    answer: B
    steps:
      - 'This is division of labour.'
      - 'Division of labour means breaking the production of a good into separate stages or processes, with each worker or group doing one stage.'
      - 'Because each worker repeats one stage, skill and speed grow and output rises. The workers become specialists as a result.'
      - 'In a Nigerian bakery, one person mixes the dough, another shapes it, another bakes, and another wraps the bread.'
      - 'Remember: divide the work into stages.'
      - 'The trap is A, by specialists. Workers become specialists because the work is divided; the requirement is the stages.'
    hint: 'What must happen to the job before each worker can do one part?'
    why:
      A: 'Specialists are the result of dividing the work into stages, not the requirement.'
      C: 'If all workers did every task, there would be no division of labour.'
      D: 'Division of labour can use skilled or unskilled workers; it does not require unskilled ones.'

  20:
    answer: B
    steps:
      - 'This is average cost (average total cost).'
      - 'Average cost = total cost divided by output: $\text{AC} = \dfrac{\text{TC}}{Q}$, and $\text{TC} = \text{FC} + \text{VC}$.'
      - 'Data: FC = ₦500, VC = ₦1,500, Q = 50. TC = 500 + 1,500 = ₦2,000.'
      - '$\text{AC} = \dfrac{2000}{50} = 40$, so ₦40.'
      - 'Check: 50 units at ₦40 each make ₦2,000, the total cost.'
      - 'A shoemaker in Aba with a ₦500 stall fee and ₦1,500 of leather for 50 pairs spends ₦40 a pair.'
      - 'The trap is D, ₦20. That leaves out part of the cost; average cost uses all of it, fixed and variable together.'
    hint: 'Add the fixed and variable costs first, then share them over the 50 units.'
    why:
      A: '₦30 is average variable cost, 1,500 ÷ 50; it leaves out the fixed cost.'
      C: '₦10 is average fixed cost, 500 ÷ 50; it leaves out the variable cost.'
      D: '₦20 does not use the whole cost of ₦2,000.'

  21:
    answer: C
    steps:
      - 'These are fixed costs.'
      - 'Fixed costs are costs that do not change with output in the short run; they must be paid even if nothing is produced.'
      - 'Rent is the same whether the firm makes 10 units or 1,000, and administrative salaries are paid every month whatever is sold.'
      - 'A tailor in Onitsha pays the same shop rent each year whether she sews five dresses or fifty.'
      - 'Remember: fixed is fixed whatever the output.'
      - 'The trap is D, variable costs. Variable costs, such as cloth and thread, rise with output; rent does not.'
    hint: 'Does rent go up if the firm produces more?'
    why:
      A: 'Average fixed cost is fixed cost divided by output; rent itself is a total fixed cost.'
      B: 'Rent is not variable, and an average is not an example of a cost item.'
      D: 'Variable costs change with output; rent and administration do not.'

  22:
    answer: C
    steps:
      - 'This is the profit-maximizing rule for a firm.'
      - 'A firm makes the most profit where marginal cost equals marginal revenue (MC = MR). Below that point, each extra unit adds more to revenue than to cost.'
      - 'So while MC < MR, every extra unit raises profit, and the firm keeps expanding. Once MC > MR, an extra unit would cut profit, so it stops.'
      - 'A garri seller in a perfectly competitive market gets the same price for each extra bag. She keeps producing while an extra bag costs her less than that price.'
      - 'Remember: as long as the next unit costs less than it brings in, make it.'
      - 'The trap is B, MR = AR. That is always true for a perfect competitor, because price is constant, so it does not tell the firm when to stop.'
    hint: 'If an extra unit brings in more than it costs, should the firm make it?'
    why:
      A: 'When TC > TR the firm is making a loss; that is no reason to expand.'
      B: 'MR = AR holds at every output for a perfect competitor, so it cannot tell the firm when to expand.'
      D: 'When MC > MR an extra unit cuts profit, so the firm would reduce output.'

  23:
    answer: D
    steps:
      - 'This is a characteristic of a monopolist: he is a price maker, but not all-powerful.'
      - 'A monopolist is the only seller, so his demand curve is the whole market demand curve, which slopes downwards.'
      - 'He can fix the price, and buyers then decide how much to buy; or he can fix the quantity, and buyers then decide the price. He cannot fix both at once.'
      - 'Before the power sector was opened up, NEPA was the only seller of electricity in Nigeria. It could set the tariff, but it could not force people to use more power at that tariff.'
      - 'Remember: price OR quantity, never both.'
      - 'The trap is C, both price and quantity. The demand curve decides one once he chooses the other.'
    hint: 'If a monopolist raises his price, can he also make buyers buy the same amount?'
    why:
      A: 'A monopolist has no rivals whose output he could control.'
      B: 'There are no other producers in the market whose prices he could set.'
      C: 'The demand curve ties price and quantity together, so he can fix only one of them.'

  24:
    answer: B
    steps:
      - 'This is price discrimination by a monopolist.'
      - 'Price discrimination is charging different prices for the same product to different groups of buyers, when the markets can be kept apart and their demand elasticities differ.'
      - 'The monopolist charges a higher price where demand is inelastic and a lower price where it is elastic. The same output then earns more revenue than at one single price.'
      - 'A private hospital in Lagos may charge corporate patients more than ordinary patients for the same treatment, and the two groups cannot swap.'
      - 'Remember: same product, separate markets, separate prices.'
      - 'The trap is C. Raising price when demand is elastic makes quantity fall by a bigger percentage, so revenue falls.'
    hint: 'How can a seller get more money for the same goods without changing how much he makes?'
    why:
      A: 'Along a downward-sloping demand curve he cannot raise both price and the amount sold at once.'
      C: 'When demand is elastic, a price rise makes quantity fall by more, so revenue falls.'
      D: 'When demand is inelastic, a price cut raises sales only a little, so revenue falls.'

  25:
    answer: D
    steps:
      - 'This is the expenditure method of measuring national income in an open economy.'
      - 'An open economy trades with other countries. GDP = C + I + G + (X − M): consumption, investment, government spending, and net exports.'
      - 'Exports (X) are spending by foreigners on goods made at home, so they are added. Imports (M) are spending on goods made abroad, so they are taken away.'
      - 'Nigeria''s exports of crude oil add to its GDP, while its imports of cars and rice are subtracted because they were produced elsewhere.'
      - 'Remember: add what you sell abroad, take away what you buy from abroad.'
      - 'The trap is C, C + I + G. That is the formula for a closed economy, with no foreign trade.'
    hint: 'An open economy trades. Do imports add to or take away from home output?'
    why:
      A: 'Imports are produced abroad, so they are subtracted, not added.'
      B: 'It adds exports but forgets to take away imports.'
      C: 'C + I + G leaves out foreign trade, so it fits a closed economy only.'

  26:
    answer: D
    steps:
      - 'This is the investment multiplier.'
      - 'The multiplier $k = \dfrac{1}{1 - \text{MPC}}$, and national income $Y = k \times$ autonomous spending.'
      - 'Data: MPC = $\tfrac{2}{3}$, I = ₦100 million. $k = \dfrac{1}{1 - \frac{2}{3}} = \dfrac{1}{\frac{1}{3}} = 3$.'
      - '$Y = 3 \times 100 = 300$, so ₦300 million.'
      - 'Check: households spend two-thirds of each round of income, so ₦100 million becomes 100 + 66.7 + 44.4 + ... which adds up to ₦300 million.'
      - 'When government money is spent on a new road in Enugu, the contractors pay workers, who spend at the market, and the traders spend again, so income grows several times over.'
      - 'The trap is A, ₦100 million. That is only the first round of spending, before the multiplier works.'
    hint: 'Find the multiplier from the MPC first.'
    why:
      A: '₦100 million is only the first round of spending, before the multiplier works.'
      B: '₦10 million divides by the multiplier instead of multiplying.'
      C: '₦303 million adds 3 to 300 by mistake; the multiplier is exactly 3.'

  27:
    answer: C
    steps:
      - 'This is the precautionary motive for holding money, one of Keynes'' three motives.'
      - 'People hold some money for emergencies and unexpected spending, such as illness or accidents.'
      - 'The richer a person is, the more he can and does keep aside for such needs, so precautionary demand rises with the level of income.'
      - 'A trader in Onitsha keeps some cash at home in case a child falls sick; a well-paid manager keeps a bigger sum aside.'
      - 'Remember: transactions and precaution follow income; speculation follows the interest rate.'
      - 'The trap is A, the rate of interest. That governs the speculative demand for money, not the precautionary one.'
    hint: 'Who keeps more money aside for emergencies, a rich person or a poor one?'
    why:
      A: 'The rate of interest governs speculative demand, not precautionary demand.'
      B: 'Savings are income not spent; they are not what decides how much cash is held for emergencies.'
      D: 'The price level affects all money holdings, but the precautionary motive is tied to income.'

  28:
    answer: B
    steps:
      - 'This is stagflation.'
      - 'Stagflation is a situation where inflation (rising prices) and stagnation (high unemployment and low growth) happen at the same time.'
      - 'It usually comes from a supply shock, such as a big rise in fuel or import costs, which raises prices while firms cut output and lay off workers.'
      - 'Nigeria in 2016 saw prices rising fast while the economy shrank and unemployment rose, a case of stagflation.'
      - 'Remember: stag for stagnation plus flation for inflation.'
      - 'The trap is A, hyperinflation. That is very rapid inflation, but it says nothing about unemployment.'
    hint: 'Split the word: stagnation plus inflation.'
    why:
      A: 'Hyperinflation means very fast price rises; it does not name the unemployment.'
      C: 'Demand-pull inflation comes from too much spending, which usually goes with low unemployment.'
      D: 'Cost-push explains a cause of inflation; the name for inflation with high unemployment is stagflation.'

  29:
    answer: A
    steps:
      - 'This is a challenge facing banks in Nigeria.'
      - 'A challenge is a problem that makes a bank''s work harder, not a service the bank provides.'
      - 'Electronic banking, ATMs and mobile apps expose banks to hacking, card fraud and cyber attacks, so keeping their technology secure is a constant challenge.'
      - 'Nigerian banks and the CBN brought in the Bank Verification Number (BVN) in 2014 to fight fraud on accounts.'
      - 'Remember: functions are what banks do; challenges are what get in their way.'
      - 'The trap is C. Providing loans for investment is a normal function of banks, not a challenge.'
    hint: 'Which option is a problem banks face, rather than a job banks do?'
    why:
      B: 'Banks do employ people, but providing jobs is a benefit, not a challenge they face.'
      C: 'Giving loans is a normal function of banks.'
      D: 'Creating money through deposits and loans is a function of banks, not a challenge.'

  30:
    answer: C
    steps:
      - 'This is the money market.'
      - 'The money market is the market for short-term funds, usually lent for less than a year, through instruments such as treasury bills and call money.'
      - 'Firms that need money for a few months, for stock or wages, borrow there; long-term funds for buildings and machines come from the capital market.'
      - 'In Nigeria, deposit money banks, discount houses and the CBN deal in the money market, while the Nigerian Exchange (formerly the Nigerian Stock Exchange) is part of the capital market.'
      - 'Remember: money market for short loans, capital market for long ones.'
      - 'The trap is D, the capital market. It deals in long-term funds, such as shares and bonds.'
    hint: 'Which market deals in loans of less than a year?'
    why:
      A: 'The stock market trades shares, which are long-term finance.'
      B: 'Development banks give long-term loans for projects such as industry and agriculture.'
      D: 'The capital market deals in long-term funds.'

  31:
    answer: A
    steps:
      - 'This is a price index and the cost of living.'
      - 'A price index compares prices in a given year with a base year set at 100. An index above 100 means prices have risen.'
      - 'Data: base year = 100, next year = 175. Rise in prices = 175 − 100 = 75, so the cost of living rises by 75%.'
      - 'The value of money moves the other way: ₦1 now buys $\dfrac{100}{175} \approx 0.57$ of what it bought before, so money has lost about 43% of its value, not 75%.'
      - 'If a mudu of beans cost ₦100 in the base year, it costs ₦175 a year later, and the same ₦100 now buys only about four-sevenths of a mudu.'
      - 'Remember: index up, cost of living up, value of money down.'
      - 'The trap is D. The value of money does fall, but by about 43%, not 75%.'
    hint: 'How far above 100 is 175? What does that say about prices?'
    why:
      B: 'The index rose from 100 to 175, so the cost of living changed.'
      C: 'When prices rise, the value of money falls, not rises.'
      D: 'Money loses about 43% of its value, since 100 ÷ 175 ≈ 0.57; 75% is the rise in prices.'

  32:
    answer: B
    steps:
      - 'This is a wage freeze, part of an incomes policy.'
      - 'A wage freeze is a government order that wages and salaries must not be raised for a period.'
      - 'Rising wages raise firms'' costs, which push prices up (cost-push inflation), and also give people more to spend (demand-pull). Freezing wages slows both.'
      - 'Nigerian governments have at times held back public salary rises during periods of high inflation to slow price increases.'
      - 'Remember: freeze the wages to cool the prices.'
      - 'The trap is D, curbing deflation. Deflation is falling prices; holding down wages would make it worse, not cure it.'
    hint: 'If wages keep rising, what happens to firms'' costs and prices?'
    why:
      A: 'A wage freeze is not aimed at investors; it controls pay and prices.'
      C: 'It may hold back living standards, but its aim is to curb inflation.'
      D: 'Deflation is falling prices; holding wages down would deepen it.'

  33:
    answer: C
    steps:
      - 'This is the problem of a mono-product economy: over-dependence on oil.'
      - 'Nigeria earns most of its export income and a large share of government revenue from crude oil.'
      - 'When world oil prices fall, foreign exchange and government revenue fall with them, so plans are abandoned and the economy is thrown off course. Other sectors, such as agriculture, were neglected after the oil boom.'
      - 'When the oil price fell sharply in 2014 to 2016, the naira lost value, states could not pay salaries and Nigeria went into recession in 2016.'
      - 'Remember: one basket, all the eggs; when oil falls, Nigeria falls.'
      - 'The trap is A, low capital formation. It is a real problem in every developing economy, but over-dependence on oil is the obstacle that marks out Nigeria, and it feeds the other problems.'
    hint: 'Which single product carries most of Nigeria''s exports and revenue?'
    why:
      A: 'Low capital formation affects all developing economies; the obstacle peculiar to Nigeria is over-dependence on oil.'
      B: 'Rural-urban migration is a problem, but a result of neglected agriculture rather than the main obstacle.'
      D: 'Poor policies have hurt Nigeria, but the main structural obstacle is the dependence on oil.'

  34:
    answer: C
    steps:
      - 'This is a feature of an underdeveloped economy.'
      - 'An underdeveloped economy has low income per head, so most people have a low standard of living: poor housing, poor health care and poor education.'
      - 'Low income means low savings, low investment and low productivity, which keep income low again: the vicious circle of poverty.'
      - 'Many rural Nigerian communities still lack clean water and electricity, a sign of a low standard of living.'
      - 'Remember: underdeveloped means low income and low standard of living.'
      - 'The trap is A. Underdeveloped economies have excess capacity, but it comes with under-utilization, not full use.'
    hint: 'What is life like for most people in a poor country?'
    why:
      A: 'Underdeveloped economies usually under-use their capacity, not use it to excess.'
      B: 'Underdeveloped economies usually have high, not low, population growth.'
      D: 'Unemployment and underemployment are usually high in underdeveloped economies.'

  35:
    answer: D
    steps:
      - 'This is the role of agriculture in economic development.'
      - 'Agriculture provides food, raw materials for industry, foreign exchange from exports, a market for industrial goods and employment.'
      - 'In Nigeria it is the largest single employer, because most rural families farm for a living.'
      - 'Cocoa farmers in Ondo, yam farmers in Benue and rice farmers in Kebbi are among the millions who earn their living from the land.'
      - 'Remember: agriculture is Nigeria''s biggest employer.'
      - 'The trap is A. Agriculture supplies raw materials; processing them is the work of industry.'
    hint: 'Which sector gives work to most Nigerians?'
    why:
      A: 'Agriculture supplies raw materials; processing them is done by industry.'
      B: 'The price system is regulated by market forces and government, not by agriculture.'
      C: 'Infrastructure such as roads and power is provided by government, not by agriculture.'

  36:
    answer: A
    steps:
      - 'This is the advantage of large-scale (commercial) farming over peasant farming.'
      - 'Large-scale farms cover large areas, use machines and modern methods, and have the money to carry out or apply research.'
      - 'Because they are big, they also hire many workers, so they provide research and employment on a scale a peasant family farm cannot.'
      - 'Large commercial farms near Ilorin and in Kaduna employ hundreds of workers and use improved seeds from research institutes.'
      - 'Remember: big farm, big research, big workforce.'
      - 'The trap is C. Traditional tools such as the hoe and cutlass belong to peasant farming, not to large-scale farming.'
    hint: 'What can a big, well-funded farm do that a family plot cannot?'
    why:
      B: 'Redistributing income between regions is a job of government, not of a farm.'
      C: 'Traditional implements are a feature of peasant farming; large farms use machines.'
      D: 'Urban-rural migration is not an aim or advantage of large-scale farming.'

  37:
    answer: A
    steps:
      - 'This is localization of industry, when many firms in one industry gather in one area.'
      - 'Localization brings skilled labour and services together, but it makes the area depend on one industry.'
      - 'If that industry declines, because of a change in demand or technology, the whole area loses jobs at once. That is structural unemployment.'
      - 'When textile mills in Kaduna closed, thousands of workers in the same city lost their jobs together.'
      - 'Remember: all eggs in one industry basket.'
      - 'The trap is D. Under-utilization of capacity comes from poor power or demand, not from firms gathering in one place.'
    hint: 'What happens to a town''s workers if its one big industry collapses?'
    why:
      B: 'Localization does not cause over-use of installed capacity.'
      C: 'Seasonal unemployment comes from the seasons, as in farming, not from localization.'
      D: 'Under-utilization of capacity has other causes, such as poor power supply and weak demand.'

  38:
    answer: B
    steps:
      - 'This is the location of industry.'
      - 'Firms choose a site that keeps their costs low: near raw materials, near the market, or near power, labour and transport.'
      - 'Firms whose products are bulky, fragile or perishable, such as bread, soft drinks and building blocks, locate close to the market they sell to.'
      - 'Bottling plants are built in or near big cities like Lagos, Ibadan and Kano, where most of the buyers live.'
      - 'Remember: bulky or perishable, build near the buyers.'
      - 'The trap is A, tax exemption. It can attract a firm, but it is a government incentive, not one of the main location factors.'
    hint: 'Where must a bread or soft drink factory be, to sell fresh products cheaply?'
    why:
      A: 'A tax exemption is a government incentive that may help, but it is not a main location factor.'
      C: 'The capital base decides how big a firm can be, not where it is sited.'
      D: 'Social responsibility is how a firm treats its community, not where it chooses to locate.'

  39:
    answer: C
    steps:
      - 'This is OPEC, the Organization of the Petroleum Exporting Countries, which Nigeria joined in 1971.'
      - 'OPEC coordinates the oil policies of its members, mainly by agreeing how much each produces.'
      - 'By controlling supply through production quotas, OPEC aims to keep world oil prices stable and fair to its members.'
      - 'Stable oil prices matter to Nigeria because oil earns most of its foreign exchange and federal revenue.'
      - 'Remember: OPEC controls output to steady the price.'
      - 'The trap is B. Subsidies on petrol are paid by the Nigerian government, not by OPEC.'
    hint: 'What does OPEC try to control by agreeing on production quotas?'
    why:
      A: 'Social infrastructure is provided by governments, not by OPEC.'
      B: 'Fuel subsidies are paid by the Nigerian government, not by OPEC.'
      D: 'Refineries are built by NNPC and private firms, not by OPEC.'

  40:
    answer: C
    steps:
      - 'This is the upstream sector of the oil industry.'
      - 'The upstream sector covers exploration, drilling, production of crude oil and its export. The downstream sector covers refining, distribution and marketing of petroleum products.'
      - 'Loading crude oil onto tankers at the export terminal is part of getting the crude out of the ground and sold abroad, so it is upstream.'
      - 'Crude from the Niger Delta is loaded at terminals such as Bonny and Forcados for export; that is upstream, while petrol sold at a filling station is downstream.'
      - 'Remember: up is crude, down is products.'
      - 'The trap is B. The activity deals only with crude oil, so it belongs to one sector, upstream, and not to both.'
    hint: 'Is the oil being loaded crude oil or a refined product?'
    why:
      A: 'Downstream covers refined products such as petrol and kerosene, not crude exports.'
      B: 'Loading crude belongs only to upstream; downstream starts with refining.'
      D: 'The petrochemical industry makes plastics and fertilizers from oil and gas, not crude exports.'

  41:
    answer: C
    steps:
      - 'This is short-run average variable cost (AVC).'
      - 'AVC = total variable cost divided by output. Variable costs change with output, like labour paid by the hour and raw materials.'
      - 'In the short run, ordinary labour is a variable cost, so a rise in wages raises total variable cost and therefore AVC.'
      - 'If bakers in Ibadan pay their workers higher daily wages, the variable cost of each loaf goes up.'
      - 'Remember: variable cost goes up when the inputs that vary get dearer.'
      - 'The trap is D. Directors'' salaries are paid whatever the output, so they are fixed costs.'
    hint: 'Which of these costs changes with the amount the firm produces?'
    why:
      A: 'Factory space is a fixed cost and cannot change in the short run.'
      B: 'A new warehouse is a fixed (capital) cost, not a variable cost.'
      D: 'Directors'' salaries are fixed costs, paid whatever the output.'

  42:
    answer: A
    steps:
      - 'This is vertical integration.'
      - 'Vertical integration joins firms at different stages of the same production chain: backward towards raw materials, or forward towards the buyers.'
      - 'Firms do it to be sure of their raw materials and of outlets for their products, and to cut out middlemen''s costs.'
      - 'A Nigerian flour miller that buys wheat farms (backward) and opens its own bakeries (forward) is vertically integrated.'
      - 'Remember: vertical is up and down one chain, from farm to shop.'
      - 'The trap is D. Producing many unrelated goods is lateral, or conglomerate, integration, not vertical.'
    hint: 'Vertical integration links stages of the same chain. What does a firm gain by owning the stage before and after it?'
    why:
      B: 'Keeping out rivals is a monopoly motive, not the aim of joining the stages of a chain.'
      C: 'Cutting advertising and management costs is a gain from merging rivals at the same stage, which is horizontal.'
      D: 'Making unrelated goods is lateral or conglomerate integration.'

  43:
    answer: C
    steps:
      - 'This is the democratic control of a co-operative society.'
      - 'A co-operative is owned and run by its members, and each member has one vote, no matter how many shares or how much money he has put in.'
      - 'This keeps rich members from controlling the society, so it serves all members equally.'
      - 'In a farmers'' co-operative in Benue, the member with one share and the member with fifty shares each cast one vote at the general meeting.'
      - 'Remember: one member, one vote.'
      - 'The trap is D. In a company, votes follow shares, but in a co-operative they do not.'
    hint: 'In a co-operative, does a bigger contribution buy more votes?'
    why:
      A: 'Management is elected by the members and answers to them.'
      B: 'Every member votes, whether or not he has a loan.'
      D: 'Votes follow shares in a company, not in a co-operative.'

  44:
    answer: D
    steps:
      - 'This is the use of census figures in planning.'
      - 'A census counts the population and records its age, sex and location. Planners use it to share resources where they are needed.'
      - 'Accurate figures show how many schools, hospitals, roads and jobs each area needs, and how revenue should be shared between states and local governments.'
      - 'Nigeria shares federal revenue between states partly by population, so the census figures decide how much money each state gets.'
      - 'Remember: count the people, then share the resources.'
      - 'The trap is C. Social amenities are one thing census figures help plan, but allocating resources covers amenities and every other use.'
    hint: 'Which option covers all the things planners decide using population figures?'
    why:
      A: 'A census does not create jobs; it only helps plan for them.'
      B: 'Siting industries is one use, but it is part of allocating resources.'
      C: 'Social amenities are only one of the resources planners allocate.'

  45:
    answer: C
    steps:
      - 'This is per capita income and the census.'
      - 'Per capita income = national income divided by population, the average income per person.'
      - 'If the population figure is wrong, per capita income is wrong too, and comparisons of living standards become misleading.'
      - 'If Nigeria''s national income is shared among an undercounted population, income per head looks higher than it really is.'
      - 'Remember: per capita means per head, so you must count the heads.'
      - 'The trap is A. A census counts people; it does not grow food.'
    hint: 'Which figure in the options is found by dividing by the population?'
    why:
      A: 'A census counts people; producing food is the work of farmers.'
      B: 'A census does not create jobs; it only gives figures for planning.'
      D: 'Industrial development needs investment, not just a head count.'

  46:
    answer: D
    steps:
      - 'This is a floating (flexible) exchange rate.'
      - 'A floating exchange rate is fixed by the market forces of demand for and supply of a currency, not by the government.'
      - 'If demand for dollars rises, for imports or school fees abroad, the naira price of the dollar rises and the naira depreciates; if dollar supply rises, from oil exports, the naira appreciates.'
      - 'When oil prices fell in 2015 to 2016, fewer dollars came into Nigeria, and the naira lost value against the dollar.'
      - 'Remember: floating floats on demand and supply.'
      - 'The trap is B. An Act of Parliament would fix the rate, which is a fixed exchange rate, not a floating one.'
    hint: 'Who sets the price of a currency when the government does not?'
    why:
      A: 'The largest note in circulation does not set the exchange rate.'
      B: 'A rate set by law is a fixed rate, not a floating one.'
      C: 'The system of government does not set the exchange rate day to day.'

  47:
    answer: C
    steps:
      - 'This is an import quota.'
      - 'A quota is a limit on the physical quantity or value of a good that may be imported in a given period.'
      - 'Once the quota is filled, no more of the good can come in, whatever its price, so home producers are protected.'
      - 'Nigeria has at times limited the amount of rice that importers were allowed to bring in, to protect local rice farmers.'
      - 'Remember: quota means quantity.'
      - 'The trap is A, excise duties. Those are taxes on goods made and sold at home, not limits on imports.'
    hint: 'Which measure limits the amount, rather than taxing the price?'
    why:
      A: 'Excise duties are taxes on goods produced at home, not limits on imports.'
      B: 'Import duties tax imports but do not set a fixed quantity.'
      D: 'A tariff is a tax on imports, not a limit on quantity.'

  48:
    answer: B
    steps:
      - 'This is the World Trade Organization (WTO), set up in 1995 to replace GATT.'
      - 'The WTO aims to make world trade freer, mainly by getting members to cut tariffs and other barriers, and by settling trade disputes.'
      - 'It provides the rules and the rounds of talks through which countries agree to lower their tariffs.'
      - 'Nigeria joined the WTO in 1995, so its import tariffs are discussed under WTO rules.'
      - 'Remember: WTO, World Trade, free trade.'
      - 'The trap is D. Helping developing countries with projects is the work of the World Bank.'
    hint: 'The WTO is about trade. What is the main barrier to trade it works to remove?'
    why:
      A: 'Protecting infant industries means keeping barriers up, which is the opposite of the WTO''s aim.'
      C: 'Help with balance of payments problems is the work of the IMF.'
      D: 'Lending for development projects is the work of the World Bank.'

  49:
    answer: A
    steps:
      - 'This is aggregate (total) expenditure and the level of output.'
      - 'In Keynesian theory, firms produce what they expect to sell, so total spending (C + I + G + X − M) decides total output and national income.'
      - 'If total spending rises, firms sell more, hire more and produce more; if it falls, they cut output and lay off workers.'
      - 'During the 2016 recession, Nigerians spent less, factories cut back output, and national output fell.'
      - 'Remember: spending drives output.'
      - 'The trap is D, the size of the labour force. It limits how much could be produced, but output only reaches that limit if there is enough spending.'
    hint: 'Why would firms produce more if no one buys it?'
    why:
      B: 'The mix of consumer spending changes which goods are made, not the total amount.'
      C: 'Farmers are only one part of the economy.'
      D: 'The labour force sets what could be produced, but total spending decides what is produced.'

  50:
    answer: A
    steps:
      - 'This is the labour force (working population).'
      - 'The labour force is the people of working age, usually 15 to 64, who are able and willing to work, whether employed or not.'
      - 'So its size depends on how many people are in the working ages, which is the age structure of the population. A population with many children or many old people has a smaller labour force for its size.'
      - 'Nigeria has a very young population, so a large share of its people are still children under 15 and not yet in the labour force.'
      - 'Remember: count the working ages to count the labour force.'
      - 'The trap is B. Where people live changes where the workers are, not how many there are.'
    hint: 'Which feature of a population tells you how many people are old enough to work?'
    why:
      B: 'Geographical distribution shows where people live, not how many are of working age.'
      C: 'Women and men both work, so the sex ratio does not decide the size of the labour force.'
      D: 'The labour force also includes the unemployed who are seeking work, not only those in paid jobs.'
