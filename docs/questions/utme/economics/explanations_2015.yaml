      - 'Because resources are scarce, a society cannot produce everything it wants. It must choose which goods to produce and in what quantities.'
      - 'That choice is limited by the resources available: a country can produce only what its land, labour, capital and skills allow.'
      - 'Nigeria can grow cocoa in the south-west and groundnuts in the north because it has the land and climate for them.'
      - 'Remember: what to produce depends on what you have.'
      - 'The trap is D, technological know-how. Technology decides how to produce, the method, not what to produce.'
    hint: 'Can a country produce what it lacks the resources for?'
    why:
      A: 'Labour is only one of the resources; the question of what to produce depends on all of them.'
      B: 'The means of distribution relate to for whom to produce.'
      D: 'Technology decides how to produce.'

  36:
    answer: C
    steps:
      - 'This is cost-push inflation and the general price level.'
      - 'The general price level is the average of the prices of all goods and services in a country.'
      - 'Petrol drives transport, generators and machines. When its supply falls, its price rises, so the cost of moving and making almost everything rises, and sellers pass this on in higher prices.'
      - 'During petrol queues in Nigeria, bus fares go up, then the prices of foodstuffs brought to the cities by lorry follow.'
      - 'Remember: petrol touches every price.'
      - 'The trap is D, the exchange rate. The naira''s rate is set mainly by foreign exchange demand and supply, not directly by petrol at the pump.'
    hint: 'What happens to transport fares, and then to the prices of goods carried by lorry?'
    why:
      A: 'Imports in general do not depend directly on domestic petrol supply.'
      B: 'Exports are mainly crude oil, which is not cut by a shortage at the pumps.'
      D: 'The exchange rate depends on the foreign exchange market, not directly on petrol supply.'

  37:
    answer: C
    steps:
      - 'This is the short-run equilibrium of a perfectly competitive firm.'
      - 'Every firm, in any market, maximizes profit where marginal cost equals marginal revenue, $\text{MC} = \text{MR}$, with MC rising.'
      - 'Below that output, one more unit adds more to revenue than to cost, so it pays to expand; above it, one more unit adds more to cost, so it pays to cut back. Equilibrium is where they are equal.'
      - 'A poultry farmer in Ogun keeps adding crates of eggs until the cost of one more crate equals what it sells for.'
      - 'Remember: MC equals MR, every time.'
      - 'The trap is A, total revenue equal to total cost. That is break-even; a firm in short-run equilibrium may make a profit or a loss.'
    hint: 'What rule tells any firm when to stop producing more?'
    why:
      A: 'Total revenue equal to total cost is the break-even point, not the equilibrium rule.'
      B: 'The demand curve is not tangent to the marginal cost curve at equilibrium.'
      D: 'Average fixed cost is not part of the equilibrium condition.'

  38:
    answer: D
    steps:
      - 'This is a maximum price, also called a price ceiling or price control.'
      - 'A maximum price is a legal price above which a commodity may not be sold. It is set below the market price.'
      - 'It protects consumers from paying too much for essential goods; its side effects are shortages, queues and black markets.'
      - 'The pump price of petrol was fixed by government for many years to protect Nigerian consumers.'
      - 'Remember: maximum price protects buyers; minimum price protects sellers.'
      - 'The trap is C, price floor. A floor keeps prices up, which protects producers, not consumers.'
    hint: 'To stop prices going too high, would you set a ceiling or a floor?'
    why:
      A: 'A minimum price keeps prices up and protects producers.'
      B: 'Price differentiation charges different buyers different prices; it does not protect consumers.'
      C: 'A price floor is a minimum price, which protects producers.'

