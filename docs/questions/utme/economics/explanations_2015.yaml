      - 'Read the bars: 20 marks has 5 students, 40 has 10, 60 has 20, 80 has 10, 100 has 15. The tallest bar, 20 students, is at 60 marks.'
      - 'So the modal score is 60. In a class in Jos, if more students scored 60 than any other mark, 60 is the mode.'
