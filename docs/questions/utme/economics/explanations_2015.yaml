      - 'Range $= 65.5 - 15.5 = 50$. Check: there are five steps of 10 between the first and last classes, $5 \times 10 = 50$.'
      - 'If these were ages of workers in a factory in Kaduna, the spread from youngest group to oldest group would be about 50 years. Remember: biggest minus smallest.'
