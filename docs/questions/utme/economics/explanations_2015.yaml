    answer: B
    steps:
      - 'This is profit and loss in the short run, judged by price against average cost.'
      - 'Average cost is the cost of each unit. If the price received for each unit is below what each unit costs, every unit sold loses money.'
      - 'Profit per unit = price minus average cost. Price below AC gives a negative figure, a loss. A monopolist can make losses in the short run if demand is weak.'
      - 'A sole electricity supplier in a town who must sell at ₦50 a unit while each unit costs ₦60 makes a loss of ₦10 on each.'
      - 'Remember: price over AC, profit; price under AC, loss.'
      - 'The trap is D, supernormal profit. That needs price above average cost, the opposite.'
    hint: 'Compare what each unit sells for with what each unit costs.'
    why:
      A: 'An economic profit needs price above average cost.'
      C: 'Any profit needs price at least equal to average cost.'
      D: 'Supernormal profit needs price above average cost.'

