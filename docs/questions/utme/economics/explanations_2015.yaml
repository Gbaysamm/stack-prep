    why:
      A: '"Intermediate workers" is not a recognised group that trains farmers.'
      B: 'Middlemen buy and resell farm produce.'
      D: 'Creditors lend money; they do not train.'

  34:
    answer: D
    steps:
      - 'This is the price mechanism in a free market economy.'
      - 'In a free market, no government or single person fixes prices. Prices are set where the quantity buyers want equals the quantity sellers offer.'
      - 'If demand rises, price rises; if supply rises, price falls. Prices move until the market clears.'
      - 'At Mile 12 market in Lagos, the price of a basket of pepper changes from day to day with how much arrives and how many buyers come.'
      - 'Remember: free market, free price, set by demand and supply.'
      - 'The trap is A, consumers. Consumers decide demand, but they are only one of the two forces.'
    hint: 'Which option includes both buyers and sellers?'
    why:
      A: 'Consumers form only the demand side.'
      B: 'Producers form only the supply side.'
      C: 'Prices fixed by the central government belong to a planned economy.'

