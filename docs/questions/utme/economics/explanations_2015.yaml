format_version: 1
exam_year: 2015
subject: ECO
explanations:
  1:
    answer: B
    steps:
      - 'This is the dependency ratio, a feature of the structure of a population.'
      - 'The dependency ratio compares the dependants (children under 15 and the old over 64) with the working population (15 to 64) who must feed them.'
      - 'When the ratio is high, each worker supports many people. Most income goes on food, school fees and care, so saving is low. Low saving means low investment, low investment means low output and income, and low income brings low saving again. That loop is the vicious cycle of poverty.'
      - 'A trader in Kano feeding eight children and two aged parents has nothing left to save or to expand her stall, so her income stays low.'
      - 'Remember: many mouths, little saving, little investment, little income, and round again.'
      - 'The trap is A, high capital formation. Capital formation needs saving, and a high dependency ratio cuts saving, so it gives low, not high, capital formation.'
    hint: 'If each worker feeds many people, how much can he save?'
    why:
      A: 'High dependency lowers saving, so capital formation falls, not rises.'
      C: 'More dependants push up demand for food and services, which tends to raise, not lower, the cost of living.'
      D: 'Income shared among many dependants lowers income per head and the standard of living.'

  2:
    answer: D
    steps:
      - 'This is a problem of agriculture in Nigeria: the use of crude tools.'
      - 'Most Nigerian farmers still use the hoe and the cutlass instead of tractors, harvesters and processing machines. Output per farmer stays low.'
      - 'Tractor-hiring and mechanization schemes put modern machines within reach of small farmers, so they attack exactly this problem: inadequate modern farm implements.'
      - 'A rice farmer in Kebbi who hires a tractor can plough in one day what took his family two weeks by hoe.'
      - 'Remember: machines solve the problem of no machines.'
      - 'The trap is A, low literacy. It is a real problem, but it is tackled by adult education and extension workers, not by tractors.'
    hint: 'What do tractors and mechanization supply to a farmer?'
    why:
      A: 'Low literacy is solved by education and extension services, not by tractor-hiring.'
      B: 'Small farms are tackled by land reform and co-operative farming, not by hiring machines.'
      C: 'Pest attack is tackled by pesticides and resistant seeds, not by tractors.'

  3:
    answer: D
    steps:
      - 'This is a co-operative society, a business owned by its members for their common benefit.'
      - 'Its features include open and voluntary membership with no upper limit, democratic control (one member, one vote, however many shares a member holds), and a common interest among members.'
      - 'Because membership is open, anyone who shares the common bond can join. Unlike a partnership or a private company, there is no maximum number of members, so the size of membership is unlimited.'
      - 'A farmers'' co-operative in Ondo can keep admitting cocoa farmers as long as they accept its rules and buy a share.'
      - 'Remember: co-operative means open door, one vote each, shared interest.'
      - 'The trap is C, voting by shares. That is how a joint-stock company votes; a co-operative gives each member one vote.'
    hint: 'Is there a maximum number of people who can join a co-operative?'
    why:
      A: 'Members share a common interest; that is why they come together.'
      B: 'A registered co-operative gives its members limited liability, not unlimited.'
      C: 'A co-operative votes one member, one vote; voting by shares is the rule in a company.'

  4:
    answer: A
    steps:
      - 'This is the marginal propensity to save, M P S.'
      - 'It is the fraction of each extra naira of income that is saved: $\text{MPS} = \dfrac{\Delta S}{\Delta Y}$.'
      - 'If income rises by ₦1,000 and saving rises by ₦200, then $\text{MPS} = \dfrac{200}{1000} = 0.2$. Since every extra naira is either spent or saved, $\text{MPC} + \text{MPS} = 1$.'
      - 'A civil servant in Abuja whose salary rises by ₦10,000 and who puts ₦3,000 into his thrift group has an M P S of 0.3.'
      - 'Remember: marginal means extra, so M P S is extra saving over extra income.'
      - 'The trap is C. That ratio of a change in consumption to a change in income is the M P C, the partner of the M P S.'
    hint: 'Marginal means the change. Change in what, over change in what?'
    why:
      B: 'The M P S is about saving and income, not supply.'
      C: 'A change in consumption over a change in income is the marginal propensity to consume.'
      D: 'The average propensity to consume is total consumption over total income, a different measure.'

  5:
    answer: A
    steps:
      - 'This is structural unemployment.'
      - 'It is unemployment caused by a lasting change in the structure of the economy: in what people buy, in technology, or in which industries grow and which die.'
      - 'When the pattern of consumption changes, demand for some products falls for good. Workers in those industries lose their jobs, and their skills do not fit the new industries.'
      - 'When Nigerians moved from typewriters to computers, typists and typewriter repairers lost their work for good.'
      - 'Remember: structural means the structure of demand has changed for good.'
      - 'The trap is B, the business cycle. That causes cyclical unemployment, which ends when the boom returns.'
    hint: 'Which option describes a lasting change in what people buy?'
    why:
      B: 'Changes in the business cycle cause cyclical unemployment.'
      C: 'A general fall in output during a slump is cyclical, not structural.'
      D: 'Seasonal variation causes seasonal unemployment, such as farm workers idle in the dry season.'

  6:
    answer: A
    steps:
      - 'This is a problem of census taking in Nigeria: a shortage of skilled staff.'
      - 'A census needs hundreds of thousands of enumerators who can read maps, fill forms correctly and count every household once.'
      - 'Where such people are lacking, households are missed or counted twice. Training enumerators before the count is meant to give the census the skilled personnel it needs.'
      - 'Before a national census, the National Population Commission trains enumerators in every local government area.'
      - 'Remember: training makes skilled staff.'
      - 'The trap is C, distortion of figures. It is a real problem, but it is political, and training enumerators does not stop leaders who inflate figures for revenue and seats.'
    hint: 'What does training give a person that he did not have before?'
    why:
      B: 'A high dependency ratio is a feature of the population, not a problem of counting it.'
      C: 'Distortion comes from political interest in the figures; training enumerators does not remove it.'
      D: 'Training adds to the cost of a census; it does not reduce it.'

  7:
    answer: C
    steps:
      - 'This is the effect of public expenditure on the price level, part of fiscal policy.'
      - 'Government spending is part of aggregate demand. Less government spending means less total demand in the economy.'
      - 'With less money chasing the same goods, sellers cut prices to sell, so the general price level falls. This is why cutting spending is used to fight inflation.'
      - 'When government delays salaries and contracts, traders in Onitsha main market complain of low sales and cut their prices.'
      - 'Remember: spend less, demand less, prices fall.'
      - 'The trap is D, rise. That is what happens when government spending increases.'
    hint: 'Government spending is part of total demand. What happens to prices when demand falls?'
    why:
      A: 'Prices do not stay put when total demand changes.'
      B: 'The effect has a clear direction, downwards, not up and down.'
      D: 'A rise follows an increase in government spending, not a decrease.'

  8:
    answer: B
    steps:
      - 'This is total, average and marginal product.'
      - 'Average product is total product divided by units of labour, $\text{AP} = \dfrac{\text{TP}}{L}$. Marginal product is the change in total product from one more worker, $\text{MP}_n = \text{TP}_n - \text{TP}_{n-1}$.'
      - 'K: with 3 workers AP = 9, so $\text{TP} = \text{AP} \times L = 9 \times 3 = 27$. So K = 27.'
      - 'F: $\text{MP}_4 = \text{TP}_4 - \text{TP}_3 = 40 - 27 = 13$. So F = 13.'
      - 'Check: the third worker''s MP is $27 - 14 = 13$, which matches the table. A poultry farm in Ogun adding a fourth attendant can find output rising from 27 to 40 crates.'
      - 'Remember: AP times L gives TP; TP minus the TP before gives MP. The trap is A, which swaps the order: K comes first, and K is the TP.'
    hint: 'Multiply AP by the number of workers to get TP.'
    why:
      A: 'Gives the two values the wrong way round; K is 27 and F is 13.'
      C: 'Uses the AP of 10 for F; F is a marginal product, 40 minus 27.'
      D: 'K is right, but F is the MP of the fourth worker, 13, not the AP of 10.'

  9:
    answer: C
    steps:
      - 'This is total utility and marginal utility.'
      - 'Marginal utility is the extra satisfaction from one more unit. Total utility is the whole satisfaction from all the units consumed.'
      - 'Total utility is built up one unit at a time, so adding the marginal utility of every unit gives total utility: $\text{TU} = \text{MU}_1 + \text{MU}_2 + \dots + \text{MU}_n$.'
      - 'If the first sachet of water on a hot day gives 10 units of satisfaction, the second 6 and the third 2, total utility is $10 + 6 + 2 = 18$.'
      - 'Remember: the marginals add up to the total.'
      - 'The trap is D. Diminishing marginal utility is the law that each extra unit adds less; it is a pattern, not a sum.'
    hint: 'What do you get when you add up the extra satisfaction from every unit?'
    why:
      A: 'Average utility is total utility divided by the number of units, not a sum.'
      B: 'The initial marginal utility is only the first unit''s satisfaction.'
      D: 'Diminishing marginal utility is the law that each extra unit adds less, not a total.'

  10:
    answer: D
    steps:
      - 'This is capitalism, the free enterprise or market economy.'
      - 'In a pure capitalist economy, land, factories and other means of production are owned and controlled by private individuals and firms.'
      - 'They decide what to produce in search of profit, guided by prices, and government plays no part in ownership.'
      - 'A private bakery in Ibadan, owned by its founder, decides alone how much bread to bake and at what price.'
      - 'Remember: capitalism means private capital.'
      - 'The trap is A, public and private sectors. Both together describe a mixed economy, such as Nigeria''s.'
    hint: 'In capitalism, who owns the capital?'
    why:
      A: 'Shared public and private ownership describes a mixed economy.'
      B: 'Feudal lords belong to feudalism, an older system.'
      C: 'Public ownership of the means of production describes socialism.'

  11:
    answer: D
    steps:
      - 'This is a transfer payment.'
      - 'A transfer payment is money paid to a person without any good or service given in return, such as pensions, unemployment benefits and student grants.'
      - 'It only moves income from taxpayers to the receiver. No new output is produced, so it is left out of national income, unlike factor rewards such as wages, rent, interest and profit.'
      - 'The monthly pension a retired teacher in Enugu receives is a transfer payment; the salary she earned while teaching was a factor reward.'
      - 'Remember: transfer means money moves, nothing is made.'
      - 'The trap is C, economic rent. That is a factor earning above what keeps a factor in its present use, so it is paid for a service.'
    hint: 'Does the unemployed person give any service for the benefit?'
    why:
      A: 'Interest is the reward for capital, paid for the use of money.'
      B: 'A rate is a local tax on property, not a payment to the unemployed.'
      C: 'Economic rent is a surplus earned by a factor in use; an unemployed person is not supplying a factor.'

  12:
    answer: B
    steps:
      - 'This is excess supply, which happens when price is held above equilibrium.'
      - 'At any price, the demand curve shows how much buyers want and the supply curve shows how much sellers offer. At equilibrium E the two are equal.'
      - 'At P₁, above Pe, the horizontal line meets the demand curve first at F and the supply curve further right at G. Sellers offer the quantity at G but buyers take only the quantity at F, so FG is the amount supplied in excess of the amount demanded.'
      - 'When a minimum price keeps maize above the market price, maize piles up unsold in the stores of Kaduna farmers.'
      - 'Remember: price above equilibrium gives a surplus; price below gives a shortage.'
      - 'The trap is D, excess demand. That gap appears only when the price is below equilibrium.'
    hint: 'At P₁, which curve is further to the right, demand or supply?'
    why:
      A: 'Equilibrium quantity is read at E, where demand and supply meet, not at P₁.'
      C: 'Equilibrium quantity supplied is also read at E, not along FG.'
      D: 'Excess demand appears when the price is below equilibrium; P₁ is above it.'

  13:
    answer: D
    steps:
      - 'This is the demand for money, also called liquidity preference.'
      - 'It is the desire of people to hold their wealth as cash, in liquid form, rather than lending it out or buying assets that earn income.'
      - 'Keynes gave three motives: the transactions motive (daily spending), the precautionary motive (emergencies) and the speculative motive (waiting for a better chance to invest).'
      - 'A market woman in Aba who keeps cash at home for her daily stock and for a sick child is demanding money.'
      - 'Remember: demand for money means keeping money as money.'
      - 'The trap is C, the need for money to invest. Investing means giving up liquid money for assets, the opposite of holding it.'
    hint: 'Does demanding money mean holding cash or spending it on assets?'
    why:
      A: 'A fixed deposit is tied up and earns interest; it is a form of investment, not the demand for liquid money.'
      B: 'Holding tangible assets means giving up money, not holding it.'
      C: 'Investing means parting with liquid money.'

  14:
    answer: D
    steps:
      - 'This is producer equilibrium, the least-cost combination of factors.'
      - 'An isoquant joins combinations of labour and capital that give the same output. An isocost line joins combinations the producer can buy with the same total cost.'
      - 'The producer is at equilibrium where the isocost line just touches (is tangent to) the highest isoquant he can reach. There he gets the most output for his money; at that point the ratio of factor prices equals the ratio of their marginal products.'
      - 'A block maker in Ibadan chooses how many workers and how many moulding machines to use so that his budget gives the most blocks.'
      - 'Remember: isoquant touches isocost.'
      - 'The trap is C. Marginal revenue belongs to the output market, not to choosing factors.'
    hint: 'Where does the budget line just touch the output curve?'
    why:
      A: 'If the isocost lies above the isoquant, the same output could be made more cheaply.'
      B: 'An isoquant below the isocost means a higher output could be reached with the same cost.'
      C: 'Marginal revenue is not part of the isoquant and isocost diagram.'

  15:
    answer: B
    steps:
      - 'This is the balance of trade.'
      - 'The balance of trade is the difference between the value of a country''s visible exports and visible imports, that is, goods you can see and touch.'
      - 'If exports of goods are worth more than imports of goods, the balance of trade is favourable (a surplus); if less, it is unfavourable (a deficit).'
      - 'Nigeria''s visible exports are mainly crude oil, cocoa and sesame; its visible imports include refined petrol, machinery and rice.'
      - 'Remember: trade in things you can see.'
      - 'The trap is D. Invisible items such as shipping, insurance and tourism go into the balance of payments, not the balance of trade.'
    hint: 'Is the balance of trade about goods or services?'
    why:
      A: 'Internal trade is not part of any international balance.'
      C: 'Deficits and surpluses are results of the balance, not what it compares.'
      D: 'Invisible imports and exports belong to the current account, outside the balance of trade.'

  16:
    answer: D
    steps:
      - 'This is credit creation by commercial banks, using the money (credit) multiplier.'
      - 'Total deposits created $= \dfrac{\text{initial deposit}}{\text{cash reserve ratio}}$, because banks keep the reserve and lend out the rest again and again.'
      - 'Data: initial deposit = ₦20 million, cash reserve ratio = 30% = 0.3.'
      - 'Working: $\dfrac{20}{0.3} = 66.67$, so about ₦66.7 million.'
      - 'Check: the multiplier is $\dfrac{1}{0.3} \approx 3.33$, and $20 \times 3.33 \approx 66.7$. A deposit in a bank in Lagos grows this way as each loan is spent and redeposited in another bank.'
      - 'Remember: divide the deposit by the reserve ratio. The trap is B, close to the ₦46.7 million of new loans only; the money supply counts the whole ₦66.7 million of deposits.'
    hint: 'Divide the deposit by the reserve ratio as a decimal.'
    why:
      A: 'Does not follow from dividing ₦20 million by 0.3.'
      B: 'Close to the new loans alone (₦46.7m), but not the full increase in deposits.'
      C: 'Does not follow from dividing ₦20 million by 0.3.'

  17:
    answer: B
    steps:
      - 'This is ostentatious demand, or goods of conspicuous consumption, a type of abnormal demand.'
      - 'Ostentatious goods are bought to show off wealth: expensive cars, jewellery, designer clothes. Their high price is part of their appeal.'
      - 'When their price falls, they no longer show that the owner is rich, so the rich buy fewer. The quantity demanded falls as price falls: a movement along an upward-sloping demand curve.'
      - 'If a famous brand of lace sold at Balogun market fell sharply in price, the wealthy would stop wearing it to owambe parties.'
      - 'Remember: cheap does not impress, so less is bought.'
      - 'The trap is C, decrease demand. A change in price moves along the curve and changes quantity demanded; demand itself changes only when something other than price changes.'
    hint: 'Does a change in its own price change demand or quantity demanded?'
    why:
      A: 'An increase in quantity demanded when price falls is normal demand, not ostentatious goods.'
      C: 'A price change alters quantity demanded, not demand.'
      D: 'A price change alters quantity demanded, and here it falls.'

  18:
    answer: B
    steps:
      - 'This is debt servicing.'
      - 'Debt servicing is paying the interest on a loan and repaying the principal (capital sum) as they fall due.'
      - 'A heavy debt service burden takes money that could have gone to schools, roads and hospitals.'
      - 'Each year a large part of Nigeria''s federal budget is set aside to service the country''s domestic and foreign debts.'
      - 'Remember: servicing a debt means keeping it paid up, like servicing a car keeps it running.'
      - 'The trap is C, debt relief. Relief means creditors cancel or reduce a debt, as with Nigeria''s Paris Club deal of 2005.'
    hint: 'What word means keeping up the payments on a loan?'
    why:
      A: 'The balance of a debt is the amount still owed, not the payments.'
      C: 'Debt relief is the cancelling or reducing of a debt.'
      D: 'Debt retaking is not a recognised economic term.'

  19:
    answer: D
    steps:
      - 'This is the mode, a measure of central tendency.'
      - 'The mode is the value that occurs most often. In grouped data it is found in the modal class, the class with the highest frequency.'
      - 'Measures of central tendency are the mean, the median and the mode. Range and variance measure dispersion, how spread out the data are.'
      - 'If more traders in a Kano market earn ₦5,000 to ₦10,000 a day than any other band, that band is the modal class.'
      - 'Remember: mode means most.'
      - 'The trap is C, the mean. It uses every class and the totals, $\dfrac{\sum fx}{\sum f}$, not just the class with the highest frequency.'
    hint: 'Which measure means the most frequent value?'
    why:
      A: 'The range measures spread, not central tendency.'
      B: 'The variance measures spread, not central tendency.'
      C: 'The mean uses all classes, $\dfrac{\sum fx}{\sum f}$, not only the highest frequency.'

  20:
    answer: D
    steps:
      - 'This is localization of industry: firms in the same industry gathering in one area.'
      - 'Industries localize near the things that cut their costs: raw materials, power, markets and skilled labour. Access to raw materials is the main reason, especially for industries using bulky, weight-losing materials.'
      - 'Being near the raw materials cuts transport costs, so firms in that industry gather where the materials are found.'
      - 'Cement factories cluster near limestone at Ewekoro and Obajana, and refineries near crude oil in Port Harcourt and Warri.'
      - 'Remember: industries go where the raw materials grow.'
      - 'The trap is C, division of labour. It is a way of organising work inside a firm, not a reason for choosing a place.'
    hint: 'Why are cement factories built near limestone?'
    why:
      A: 'Diseconomies of scale push firms apart; they are a result of too much localization, not its cause.'
      B: 'Population growth affects market size, but it is not the main reason industries gather in one place.'
      C: 'Division of labour is about splitting tasks within a firm, not location.'

  21:
    answer: C
    steps:
      - 'This is the geographical distribution of population: how people are spread over a country.'
      - 'People settle where they can earn a living. Fertile land, water, a good climate, jobs and security draw people; deserts, swamps and conflict keep them away.'
      - 'Where agricultural land is available and fertile, farming supports many people, so the population is dense.'
      - 'The fertile farmlands of the south-east and of the Kano close-settled zone are densely populated, while the dry far north and the swamps of the Niger Delta have fewer people per square kilometre.'
      - 'Remember: where the land feeds, the people settle.'
      - 'The trap is D, high birth rate. Birth rate changes how many people there are, not where they live.'
    hint: 'Which option decides where people choose to live, not how many are born?'
    why:
      A: 'Birth rates affect the size of the population, not its spread.'
      B: 'Skilled manpower is a feature of the population, not a cause of where it lives.'
      D: 'Birth rates affect the size of the population, not its spread.'

  22:
    answer: D
    steps:
      - 'This is the incidence of a tax: who bears its burden.'
      - 'The burden falls more on the side of the market that is less elastic. Buyers'' share $= \dfrac{E_s}{E_d + E_s}$ and sellers'' share $= \dfrac{E_d}{E_d + E_s}$.'
      - 'Data: $E_s = 1$. For equal shares we need $E_d = E_s$. With $E_d = 1$: buyers'' share $= \dfrac{1}{1 + 1} = \dfrac{1}{2}$, so each side bears half.'
      - 'Check: if demand were less elastic, buyers would bear more; if more elastic, sellers would bear more. A ₦10 tax on a bag of sachet water would then raise its price by ₦5, with sellers bearing the other ₦5.'
      - 'Remember: equal elasticities, equal shares.'
      - 'The trap is B, perfectly inelastic. Then buyers cannot cut back at all and bear the whole tax.'
    hint: 'Supply has elasticity 1. What must the elasticity of demand be for the shares to match?'
    why:
      A: 'Fairly elastic demand (more than 1) shifts more of the tax onto sellers.'
      B: 'Perfectly inelastic demand puts the whole tax on buyers.'
      C: 'Fairly inelastic demand (less than 1) puts more of the tax on buyers.'

  23:
    answer: A
    steps:
      - 'This is demand-pull inflation and its control by fiscal policy.'
      - 'Demand-pull inflation is a rise in prices caused by too much money chasing too few goods, that is, total demand running ahead of supply.'
      - 'Higher income taxes leave people with less disposable income, so they spend less. Total demand falls, and the pull on prices eases.'
      - 'If PAYE deductions on Lagos salaries rose, workers would cut back on shopping, and prices in the markets would rise more slowly.'
      - 'Remember: tax more, spend less, demand pulls less.'
      - 'The trap is C, cost-push inflation. That comes from rising costs of production, which higher income taxes on households do not cut.'
    hint: 'Higher income taxes cut spending. Which kind of inflation is caused by too much spending?'
    why:
      B: 'Interest rates are set by monetary policy, not by income taxes.'
      C: 'Cost-push inflation comes from rising production costs, which income taxes do not reduce.'
      D: 'Hyperinflation needs drastic monetary reform; income tax alone is the tool for demand-pull pressure.'

  24:
    answer: D
    steps:
      - 'This is an increase in supply, a rightward shift of the supply curve, against an unchanged demand curve.'
      - 'When supply increases, sellers offer more at every price. With demand unchanged, the new equilibrium is lower down the demand curve.'
      - 'On the graph, S₀S₀ meets DD at price P₀ and quantity Q₀. S₁S₁ lies to the right and meets DD at P₁, which is lower than P₀, and Q₁, which is greater than Q₀. So price falls and quantity rises.'
      - 'A bumper tomato harvest in the north floods the markets in Lagos: tomatoes become cheap and more baskets are sold.'
      - 'Remember: supply right, price down, quantity up.'
      - 'The trap is A, a decrease in both. That is what a leftward shift of demand would do.'
    hint: 'Compare P₁ with P₀ and Q₁ with Q₀ on the graph.'
    why:
      A: 'Quantity rises from Q₀ to Q₁; it does not fall.'
      B: 'The new equilibrium is at a different price and quantity.'
      C: 'Price falls from P₀ to P₁; it does not rise.'

  25:
    answer: D
    steps:
      - 'This is the indifference map.'
      - 'An indifference curve joins combinations of two goods that give a consumer the same satisfaction. An indifference map is a set of such curves, one for each level of satisfaction.'
      - 'Curves further from the origin give higher satisfaction, because they hold more of both goods.'
      - 'A student choosing between bottles of Coke and packs of biscuits has one curve for each level of satisfaction, and together they make his indifference map.'
      - 'Remember: a map is many curves.'
      - 'The trap is C, budget lines. A budget line shows what the consumer can afford; it is drawn on top of the map, not part of it.'
    hint: 'A map is made of many of which curve?'
    why:
      A: 'Total utility is a single amount, not a set of curves.'
      B: 'Consumer surplus is the gap between what a buyer would pay and what he pays.'
      C: 'Budget lines show what can be afforded and are drawn over the map.'

  26:
    answer: D
    steps:
      - 'This is bank recapitalization, a policy of the Central Bank of Nigeria.'
      - 'Recapitalization is raising the minimum capital that a bank must hold, so that it is big and strong enough to absorb losses and lend to large projects.'
      - 'Banks raise new capital from shareholders or merge, so each bank ends up with a strong capital base and depositors are safer. In 2005 the CBN raised the minimum capital to ₦25 billion, and the number of banks fell from 89 to 25.'
      - 'In 2024 the CBN began a new round, raising the minimum for banks with international licences to ₦500 billion.'
      - 'Remember: recapitalize means more capital.'
      - 'The trap is B, more branches. A bank may open more branches later, but the policy itself is about capital.'
    hint: 'What does the word "capital" in recapitalization point to?'
    why:
      A: 'Hiring more qualified workers is a possible side effect, not the aim.'
      B: 'Opening branches is a business choice, not what recapitalization ensures.'
      C: 'Interest rates depend mainly on monetary policy, not on bank capital.'

  27:
    answer: B
    steps:
      - 'This is a private limited company.'
      - 'Under the Companies and Allied Matters Act of 1990, in force when this paper was set, a private company needed at least two and at most fifty members.'
      - 'Its shares are not sold to the public, which is why its membership is kept small. A public company needs at least seven members (under the old rule) and has no upper limit.'
      - 'Since the Companies and Allied Matters Act of 2020, one person can form a private company, and the maximum is still fifty members. A family business in Onitsha registered as "Ltd" is a private company.'
      - 'Remember: private, small, two to fifty.'
      - 'The trap is A, ten to twenty. Up to twenty is the limit for an ordinary partnership.'
    hint: 'What is the smallest and largest number of members a "Ltd" company could have?'
    why:
      A: 'Twenty is the upper limit for an ordinary partnership.'
      C: 'Seven was the minimum for a public company.'
      D: 'These are not the limits for any form of business organization.'

  28:
    answer: D
    steps:
      - 'This is the International Monetary Fund (IMF), set up at Bretton Woods in 1944.'
      - 'Its main aim is to keep exchange rates stable and help members with balance of payments problems.'
      - 'It lends short-term to member governments facing balance of payments deficits, and advises them on policy, so that they do not resort to sudden devaluations.'
      - 'Nigeria has held talks with the IMF over its balance of payments, for example in the 1980s during the Structural Adjustment Programme.'
      - 'Remember: IMF for money and exchange; World Bank for building.'
      - 'The trap is B, long-term loans for infrastructure. That is the work of the World Bank.'
    hint: 'Which body deals with exchange rates and the balance of payments?'
    why:
      A: 'The IMF lends to member governments, not to industries.'
      B: 'Long-term loans for infrastructure come from the World Bank.'
      C: 'Agricultural development is the work of the FAO and the World Bank.'

  29:
    answer: D
    steps:
      - 'This is the upstream sector of the petroleum industry.'
      - 'Upstream covers finding and getting crude oil out of the ground: exploration, drilling and production. Downstream covers refining, transporting and marketing the products.'
      - 'Exploration comes first, so it is upstream. Refining and marketing come after the oil is out, so they are downstream.'
      - 'Oil companies exploring and drilling in the Niger Delta, and more recently in the Kolmani field in Bauchi and Gombe, are working upstream. The NNPC, which became NNPC Limited in 2022, works in both.'
      - 'Remember: upstream is up at the source; downstream is down at the pump.'
      - 'The trap is B, refining. It is the first step of the downstream sector.'
    hint: 'Which activity comes before the oil reaches a refinery?'
    why:
      A: 'Transporting finished products is downstream.'
      B: 'Refining is downstream.'
      C: 'Marketing refined petrol is downstream.'

  30:
    answer: A
    steps:
      - 'This is the law of supply.'
      - 'The law of supply states that, other things being equal, the higher the price of a commodity, the higher the quantity supplied, and the lower the price, the lower the quantity supplied.'
      - 'A higher price makes production more profitable, so producers offer more. The supply curve slopes upward from left to right.'
      - 'When the price of garri rises, cassava farmers in Benue process more of their harvest into garri for sale.'
      - 'Remember: price up, supply up.'
      - 'The trap is D. That inverse relationship is the law of demand, not supply.'
    hint: 'If you could sell at a higher price, would you offer more or less?'
    why:
      B: 'Supply equals demand only at equilibrium; it is not the law of supply.'
      C: 'Supply falls, not rises, as price falls.'
      D: 'A fall in quantity as price rises is the law of demand.'

  31:
    answer: C
    steps:
      - 'This is perfect competition.'
      - 'Its assumptions are: many buyers and sellers, a homogeneous product, free entry and exit, perfect knowledge, perfect mobility of factors and no transport costs.'
      - 'With no transport costs and perfect knowledge, the same product sells at one price everywhere in the market, and every firm is a price taker.'
      - 'Tomato sellers in a large market come closest: many sellers, the same tomatoes, and buyers who know every price.'
      - 'Remember: perfect means no barriers, no differences and no transport costs.'
      - 'The trap is B, price discrimination. Charging different prices needs market power, which only a monopolist has.'
    hint: 'Which option would make one price hold everywhere in the market?'
    why:
      A: 'Perfect competition has free entry and exit, not restrictions.'
      B: 'Price discrimination needs market power; it belongs to monopoly.'
      D: 'Product differentiation belongs to monopolistic competition; perfect competition has identical products.'

