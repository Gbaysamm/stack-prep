      - 'Its estimates show whether the economy is growing, how its living standards compare with other countries, and how its sectors are doing. So they measure overall performance.'
      - 'The National Bureau of Statistics publishes Nigeria''s GDP every quarter, and a rise or fall in it tells us how the whole economy is doing.'
