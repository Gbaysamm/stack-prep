      - 'Each specializes in what its resources suit and exchanges the surplus for what others make better.'
      - 'Nigeria has crude oil and cocoa; Japan has the technology to make cars. Nigeria exports oil and imports cars.'
      - 'Remember: different resources, different costs, so trade.'
      - 'The trap is D, the economic system. Capitalist and socialist countries trade with each other; the system is not why they trade.'
    hint: 'Why can Nigeria produce cocoa but not cheap cars?'
    why:
      B: 'Population size affects the size of the market, not the reason for trade.'
      C: 'Interest rates on loans have nothing to do with why countries exchange goods.'
      D: 'Countries with different economic systems still trade, so it is not the basis.'

  33:
    answer: C
    steps:
      - 'This is agricultural extension service.'
      - 'Extension workers are trained officers who take new farming knowledge from research institutes to farmers.'
      - 'They teach better seeds, fertilizer use, pest control and storage, so that farmers raise their output.'
      - 'Officers of the Agricultural Development Programmes (ADPs) visit farmers in their villages to demonstrate improved cassava and maize varieties.'
      - 'Remember: extension extends knowledge from the laboratory to the farm.'
      - 'The trap is B, middlemen. They buy and sell farm produce; they do not train farmers.'
