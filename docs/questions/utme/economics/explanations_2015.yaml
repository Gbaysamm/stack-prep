    answer: D
    steps:
      - 'This is complementary goods, or joint demand.'
      - 'Complements are goods used together, so demand for one is tied to the other.'
      - 'When K becomes cheaper, people buy more K, and so they need more Y to use with it. Demand for Y rises.'
      - 'When the price of cars falls, more cars are bought and the demand for petrol rises. The same holds for bread and butter.'
      - 'Remember: complements go together, so they rise together.'
      - 'The trap is C, substitutes. If K and Y were substitutes, a cheaper K would take buyers away from Y and its demand would fall.'
    hint: 'If K gets cheaper and people want more Y, are K and Y used together or instead of each other?'
    why:
      A: 'Composite demand is one good wanted for several uses.'
      B: 'Derived demand is demand for a factor because of demand for what it produces.'
      C: 'With substitutes, a cheaper K would lower the demand for Y.'

