      - 'Rule: arrange the data in order. For $n$ values, the median is the $\dfrac{n+1}{2}$th value; if $n$ is even, it is the average of the two middle values.'
      - 'In order: 4, 5, 6, 10, 12, 18, 20, 20. Here $n = 8$, so the median is the $\dfrac{8+1}{2} = 4.5$th value, half-way between the 4th (10) and the 5th (12).'
      - 'Median $= \dfrac{10 + 12}{2} = \dfrac{22}{2} = 11$. Check: four values lie below 11 and four above.'
      - 'If eight traders in Ibadan sold these numbers of bags of rice, 11 bags is the middle sale. Remember: line them up, then find the middle.'
