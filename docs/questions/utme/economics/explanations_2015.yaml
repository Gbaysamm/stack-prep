      - 'A factor input, such as labour, land or capital, has a price like any other commodity: wages, rent or interest.'
      - 'That price is set where the demand for the factor (derived from the demand for what it produces, and based on its marginal productivity) meets its supply.'
      - 'Wages of welders in Lagos rise when many construction firms want welders and few are available.'
      - 'Remember: factors have prices too, set by demand and supply.'
      - 'The trap is C, a large market. A large market raises demand for the product, which can raise demand for the factor, but it is only one influence on one side.'
    hint: 'How is the price of anything in a free market set?'
    why:
      A: 'Exchange rates are the price of currencies, not of factor inputs in general.'
      C: 'A large market affects only the demand side, and indirectly.'
      D: 'Interest rates are the price of only one factor, capital.'

