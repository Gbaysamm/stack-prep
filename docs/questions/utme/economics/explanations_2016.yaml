format_version: 1
exam_year: 2016
subject: ECO
explanations:
  1:
    answer: C
    steps:
      - 'This is deficit financing, a tool of fiscal policy.'
      - 'Deficit financing means the government deliberately spends more than its revenue and covers the gap by borrowing or by creating money.'
      - 'The extra spending on roads, power and other projects puts money in people''s hands and raises aggregate demand. Firms see more sales ahead, so they invest more and take on more workers. It is used to pull an economy out of a slump.'
      - 'In 2016, during the recession, the Federal Government ran a large deficit budget to fund capital projects and get businesses investing again.'
      - 'Remember: spend more than you earn, to wake the economy up.'
      - 'The trap is B, increase revenue. A deficit is a shortfall of revenue; borrowing fills the gap but is not revenue, and it must be repaid.'
    hint: 'Does a deficit budget push aggregate demand up or down?'
    why:
      A: 'Spending more than revenue raises aggregate demand; it does not reduce it.'
      B: 'A deficit means revenue falls short of spending; borrowing is not revenue.'
      D: 'Extra spending adds to demand and can feed inflation; a surplus budget curbs inflation.'

  2:
    answer: C
    steps:
      - 'This is the money market, one of the two financial markets.'
      - 'The money market is the market for short-term funds, loans and securities that run for a year or less.'
      - 'Firms use it to borrow for working capital, such as paying wages or buying stock, through treasury bills, commercial papers, call money and bank overdrafts. Long-term funds come from the capital market instead.'
      - 'A Lagos supermarket that needs ₦20 million for three months to stock up before Christmas borrows in the money market, not by issuing shares.'
      - 'Remember: money market for months, capital market for years.'
      - 'The trap is D, long-term funds. That is the capital market, where shares and bonds are sold on the stock exchange.'
    hint: 'How long do loans in the money market usually run?'
    why:
      A: 'Goods and services are bought in product markets, not in the money market.'
      B: 'Capital equipment is a long-term asset, financed through the capital market.'
      D: 'Long-term funds are raised in the capital market.'

  3:
    answer: D
    steps:
      - 'This is the equilibrium (profit-maximizing) output of a monopolist.'
      - 'Every firm makes the most profit where marginal revenue equals marginal cost: $MR = MC$.'
      - 'Below that output, one more unit adds more to revenue than to cost, so profit rises if the firm makes more. Above it, one more unit adds more to cost than to revenue, so profit falls. Profit peaks where the two are equal. The monopolist then charges the price the demand curve allows at that output, which is above MC.'
      - 'If the only cement maker in a region finds that the 1,000th bag adds ₦2,500 to revenue and ₦2,500 to cost, that is where it stops.'
      - 'Remember: stop where the last unit just pays for itself, MR = MC.'
      - 'The trap is C, P = MC. That is the rule for perfect competition, where price equals MR. For a monopolist price is above MR, so P = MC is the wrong rule.'
    hint: 'What rule gives the most profit for any firm?'
    why:
      A: 'At the highest price the monopolist sells almost nothing; profit is not greatest there.'
      B: 'P = AC is the break-even point, where profit is zero.'
      C: 'P = MC holds in perfect competition, where P = MR; a monopolist''s price is above MR.'

  4:
    answer: C
    steps:
      - 'This is the demographic transition theory, which describes how a population changes as a country develops.'
      - 'It has four stages. Stage 1: high birth rate and high death rate, so slow growth. Stage 2: high birth rate but a falling death rate, so fast growth. Stage 3: the birth rate falls too. Stage 4: low birth and death rates.'
      - 'Better medicine, vaccines and clean water have cut death rates in most of Africa, but families are still large, so births stay high. That is exactly stage 2.'
      - 'In Nigeria fewer children die of measles and malaria than fifty years ago, but many families still have five or six children, so the population grows fast.'
      - 'Remember: stage 2 is when death falls first and birth has not caught up.'
      - 'The trap is A, 2 and 3. Stage 3 needs the birth rate to be falling clearly, which has not yet happened in most of Africa.'
    hint: 'Which stage has births still high while deaths are falling?'
    why:
      A: 'Stage 3 needs a clearly falling birth rate, which most of Africa has not yet reached.'
      B: 'Stage 3 alone needs falling births; births are still high.'
      D: 'Stage 1 has high death rates, but death rates in Africa are falling.'

  5:
    answer: C
    steps:
      - 'This is economic integration.'
      - 'Economic integration is the coming together of countries to remove barriers to trade and movement among themselves, for their common growth.'
      - 'ECOWAS, set up in Lagos in 1975, joins West African states so that goods, people and services move freely among them. It aims to build a customs union and, in time, a full economic union, but it is a step on that road.'
      - 'With an ECOWAS passport, a Nigerian trader can travel to Ghana or Benin without a visa and sell her goods there.'
      - 'Remember: ECOWAS brings West African economies together, which is integration.'
      - 'The trap is D, economic union. That is the last and fullest stage of integration, with common policies, which ECOWAS has not reached.'
    hint: 'What do we call countries joining their economies together?'
    why:
      A: 'Globalization is worldwide; ECOWAS is a regional grouping.'
      B: 'A marketing board buys and sells farm produce; ECOWAS is not one.'
      D: 'An economic union is the final stage of integration, with common policies, which ECOWAS has not reached.'

  6:
    answer: C
    steps:
      - 'This is the mode, a measure of central tendency.'
      - 'The mode is the value that occurs most often in a set of data.'
      - 'Count each value: 32 appears twice; 18, 24, 17, 16, 28, 68, 71 and 15 each appear once.'
      - 'So the mode is 32. Check: no other value appears more than once.'
      - 'If a Mama Put sells rice to 32 customers on two days and different numbers on the other days, 32 is the modal number of customers.'
      - 'Remember: mode means most.'
      - 'The trap is B, 56. That is the range, 71 − 15, not the mode.'
    hint: 'Which number appears more than once?'
    why:
      A: '71 is the largest value, not the most frequent.'
      B: '56 is the range, 71 − 15.'
      D: '15 is the smallest value, not the most frequent.'

  7:
    answer: D
    steps:
      - 'This is income elasticity of demand.'
      - 'Income elasticity of demand measures how much the quantity demanded changes when the consumer''s income changes: $\dfrac{\%\,\Delta Q_d}{\%\,\Delta Y}$.'
      - 'It is the response to income, so the level of the consumer''s income is what settles it. At low incomes a rise is spent on basic food; at high incomes it goes to cars and travel.'
      - 'When a civil servant''s salary rises, her demand for imported rice and fish rises, but her demand for garri may fall.'
      - 'Remember: income elasticity, income decides.'
      - 'The trap is B, substitutes. Substitutes decide price elasticity, not income elasticity.'
    hint: 'Income elasticity measures the response to a change in what?'
    why:
      A: 'Government policy is not what income elasticity measures a response to.'
      B: 'Availability of substitutes is the main determinant of price elasticity.'
      C: 'The good''s own price determines price elasticity, not income elasticity.'

  8:
    answer: B
    steps:
      - 'This is the mean deviation, a measure of dispersion.'
      - 'Mean deviation = $\dfrac{\Sigma |x - \bar{x}|}{n}$, the average distance of the values from their mean, ignoring signs.'
      - 'Mean: $\bar{x} = \dfrac{2 + 4 + 6 + 8 + 4 + 6}{6} = \dfrac{30}{6} = 5$.'
      - 'Deviations ignoring signs: |2 − 5| = 3, |4 − 5| = 1, |6 − 5| = 1, |8 − 5| = 3, |4 − 5| = 1, |6 − 5| = 1. Their sum is 10.'
      - 'Mean deviation = $\dfrac{10}{6} = 1.67$. Check: the values lie 1 or 3 away from 5, so an average near 1.7 makes sense.'
      - 'Think of six market women''s daily sales in thousands of naira; the mean deviation tells you how far a typical day is from the average day.'
      - 'The trap is D, 0.60. It divides 6 by 10 instead of 10 by 6.'
    hint: 'Find the mean first, then the distance of each value from it.'
    why:
      A: '6 is the number of values, not the mean deviation.'
      C: '30 is the sum of the values, used to find the mean.'
      D: 'Divides 6 by 10 instead of the sum of deviations, 10, by 6.'

  9:
    answer: D
    steps:
      - 'This is the precautionary motive for holding money, one of Keynes''s three motives.'
      - 'The precautionary demand for money is money kept for emergencies and unexpected spending, such as illness or a sudden journey.'
      - 'The richer a person is, the more he spends and the more he can set aside for emergencies. So the precautionary demand rises with income, just like the transactions demand. The speculative demand is the one that depends on the rate of interest.'
      - 'A trader in Onitsha earning ₦500,000 a month can keep ₦50,000 at home for emergencies; a labourer earning ₦30,000 can keep far less.'
      - 'Remember: transactions and precautionary depend on income; speculative depends on interest.'
      - 'The trap is B, the rate of interest. That drives the speculative motive, not the precautionary one.'
    hint: 'Who can keep more money aside for emergencies, a rich man or a poor man?'
    why:
      A: 'Savings is what is left over; the amount held for emergencies depends on income.'
      B: 'The interest rate determines the speculative demand for money.'
      C: 'The price level affects all money demand in money terms, but the motive itself is set by income.'

  10:
    answer: D
    steps:
      - 'This is economies of scale.'
      - 'Economies of scale are the cost savings a firm enjoys as it grows larger.'
      - 'As output grows, the firm buys raw materials in bulk at a discount, uses bigger and better machines, divides labour more finely and borrows more cheaply. Each unit then costs less to make, so average cost falls.'
      - 'A large bakery in Ibadan buying flour by the trailer pays less per bag than a small baker buying one bag at a time, so each loaf costs it less.'
      - 'Remember: economies of scale, bigger and cheaper per unit.'
      - 'The trap is A, at minimum. Average cost is lowest only where economies of scale run out; while they are still being enjoyed, AC is still falling.'
    hint: 'What happens to cost per unit when a firm enjoys economies of scale?'
    why:
      A: 'AC reaches its minimum only when economies of scale are used up.'
      B: 'AC rises with diseconomies of scale, not economies.'
      C: 'Average cost has no maximum point in this sense; it falls with economies of scale.'

  11:
    answer: B
    steps:
      - 'This is the law of demand and the slope of the demand curve.'
      - 'The law of demand says that, other things equal, the lower the price, the more is bought. So the demand curve slopes down from left to right.'
      - 'A fall in price draws consumers to buy more: the good is now cheaper than its substitutes (substitution effect), the buyer''s money goes further (income effect), and by diminishing marginal utility people buy extra units only at lower prices.'
      - 'When the price of a mudu of rice in the market falls from ₦1,500 to ₦1,200, families buy more of it.'
      - 'Remember: cheaper price, more buyers.'
      - 'The trap is A. A price incentive to producers works the other way, a higher price drawing out more supply; that explains the upward supply curve.'
    hint: 'Whose behaviour does the demand curve show, buyers or sellers?'
    why:
      A: 'Producers respond to a higher price by selling more; that explains the supply curve.'
      C: 'Demand does not always exceed supply; at equilibrium they are equal.'
      D: 'On a demand curve price and quantity move in opposite directions.'

  12:
    answer: C
    steps:
      - 'This is average total cost, read from a cost diagram.'
      - 'Average total cost is total cost per unit, $ATC = \dfrac{TC}{Q} = AFC + AVC$. On the diagram it is the U-shaped curve labelled ATC, above the AVC curve.'
      - 'The MC curve always cuts ATC at its lowest point. On the diagram MC cuts ATC at 20 units, and the dashed line from that point goes across to ₦15. So ATC at 20 units is ₦15.'
      - 'Check: total cost at 20 units = 20 × ₦15 = ₦300, made of fixed cost ₦80 and variable cost 20 × ₦11 = ₦220. ₦80 + ₦220 = ₦300.'
      - 'A sachet water maker who spends ₦300 to make 20 bags is spending ₦15 a bag on average.'
      - 'Remember: MC cuts the U at the bottom.'
      - 'The trap is B, ₦18. That is ATC at 10 units, not at 20.'
    hint: 'Go up from 20 units to the ATC curve, then across to the cost axis.'
    why:
      A: '₦10 is the lowest point of AVC, at 10 units.'
      B: '₦18 is ATC at 10 units.'
      D: '₦5 is not on the diagram at 20 units; it is the gap between ATC at 20 units and AVC at its lowest, two different outputs.'

  13:
    answer: B
    steps:
      - 'This is the role of multinational oil companies in Nigeria.'
      - 'Multinationals are large foreign firms working in many countries. In Nigeria''s oil industry they work in both the upstream (prospecting, drilling, producing crude) and the downstream (marketing products).'
      - 'Shell, Chevron, ExxonMobil, Total and Agip explore and produce most of Nigeria''s crude in joint ventures with the NNPC. Some also run filling stations, which is marketing.'
      - 'Total and Mobil filling stations in Lagos sell petrol, while their parent firms drill for crude in the Niger Delta.'
      - 'Remember: multinationals find the oil and also sell it.'
      - 'The trap is D, prospecting only. They do prospect, but they also market products, so "only" is wrong.'
    hint: 'Do the multinationals only drill, or also sell?'
    why:
      A: 'They also prospect for and produce crude oil, their biggest role.'
      C: 'Nigeria''s main refineries were built and owned by the government through the NNPC.'
      D: 'They also market petroleum products, so "only" is wrong.'

  14:
    answer: A
    steps:
      - 'This is the role of insurance companies in economic development.'
      - 'Life insurance companies collect premiums for many years before they pay out, so they hold large long-term funds.'
      - 'They invest these funds in long-term instruments such as government bonds, shares and mortgages. That money finances roads, factories and houses, which helps the economy grow.'
      - 'A Nigerian life insurer that buys Federal Government bonds helps pay for a new highway.'
      - 'Remember: long-term policies, long-term investments.'
      - 'The trap is D, money-market instruments. Those are short-term; they suit banks better than life insurers, whose liabilities run for decades.'
    hint: 'Life policies run for many years. What kind of investment suits them?'
    why:
      B: 'Insurers are financial firms; they invest in securities, not in equipment.'
      C: 'Cash and near money earn little and do not finance long-term development.'
      D: 'Money-market instruments are short-term; life funds are invested long term.'

  15:
    answer: A
    steps:
      - 'This is the marginal productivity theory of wages.'
      - 'It says that a worker is paid according to his marginal productivity, the extra output he adds to the firm.'
      - 'A firm keeps hiring workers as long as the last worker adds at least as much to revenue as his wage costs. So the wage settles at the value of the marginal product of labour.'
      - 'If one more tailor in a shop in Aba adds ₦60,000 of output a month, the owner will not pay him more than ₦60,000.'
      - 'Remember: you are paid what the last worker adds.'
      - 'The trap is B, average productivity. Firms decide on the last worker, so the margin, not the average, matters.'
    hint: 'Does the employer look at the last worker or the average worker?'
    why:
      B: 'Hiring is decided at the margin, not on the average.'
      C: 'Marginal efficiency of investment relates to the rate of interest and capital.'
      D: 'Total product does not tell the employer what one more worker is worth.'

  16:
    answer: B
    steps:
      - 'This is a command (centrally planned) economy.'
      - 'In a command economy the government owns the means of production and makes the main economic decisions.'
      - 'A central planning body decides what to produce, how to produce it (which methods, which factories) and for whom. Prices and consumers'' choices play little part.'
      - 'In the old Soviet Union, the state planning office told each factory which machines to use and how much steel to make.'
      - 'Remember: command economy, the government gives the commands.'
      - 'The trap is A, consumers. They decide in a free market economy, through prices.'
    hint: 'Who gives the commands in a command economy?'
    why:
      A: 'Consumers decide through prices in a free market economy.'
      C: 'Industries carry out the plan; they do not choose it.'
      D: 'Labour unions bargain over wages; they do not decide methods of production.'

  17:
    answer: B
    steps:
      - 'This is price elasticity of supply.'
      - 'It measures how much the quantity supplied responds to a change in the price of the good.'
      - 'Formula: $\text{PES} = \dfrac{\%\ \text{change in quantity supplied}}{\%\ \text{change in price}}$.'
      - 'If the price of tomatoes rises by 10% and farmers bring 20% more to market, PES = 20 ÷ 10 = 2.'
      - 'Remember: elasticity of supply uses quantity supplied over price.'
      - 'The trap is A. "Change in supply" means the whole curve shifting; elasticity uses quantity supplied, a movement along the curve.'
    hint: 'Elasticity of supply measures the response of quantity supplied to what?'
    why:
      A: 'Uses "supply", the whole curve, instead of quantity supplied.'
      C: 'Income is not a determinant of the price elasticity of supply.'
      D: 'That is income elasticity of demand.'

  18:
    answer: B
    steps:
      - 'This is a change (shift) in supply, as against a change in quantity supplied.'
      - 'A change in supply shifts the whole supply curve. It is caused by anything except the good''s own price: cost of production, technology, weather, taxes, prices of other products.'
      - 'If cost of production falls, each unit is cheaper to make, so firms offer more at every price and the curve shifts right. If it rises, the curve shifts left.'
      - 'When diesel became dearer, bakers in Kaduna offered less bread at every price, because running their ovens and generators cost more.'
      - 'Remember: own price moves you along the curve; anything else shifts it.'
      - 'The trap is A. A change in the good''s own price causes a movement along the curve, a change in quantity supplied, not in supply.'
    hint: 'Which option shifts the curve rather than moving along it?'
    why:
      A: 'The good''s own price causes a change in quantity supplied, a movement along the curve.'
      C: 'Consumers'' income shifts demand, not supply.'
      D: 'Population growth shifts demand, not supply.'

  19:
    answer: C
    steps:
      - 'This is risk-bearing in a limited liability company.'
      - 'Ordinary shareholders are the true owners. They are paid dividends last, after debenture interest and preference dividends, and if the company is wound up they get their capital back last.'
      - 'So they bear the greatest risk. In return they get the largest rewards when profits are high, and they vote at the general meeting.'
      - 'If a bank in Lagos fails, its depositors and debenture holders are paid first; ordinary shareholders often lose everything.'
      - 'Remember: ordinary shareholders are last in line, so first in risk.'
      - 'The trap is A, preference shareholders. They come before ordinary shareholders for dividends and capital, so they carry less risk.'
    hint: 'Who is paid last when the company makes a profit or closes down?'
    why:
      A: 'Preference shareholders are paid before ordinary shareholders, so they bear less risk.'
      B: 'Debenture holders are creditors, paid interest first whether or not there is profit.'
      D: 'Directors manage the company; they do not, as directors, own its risk capital.'

  20:
    answer: A
    steps:
      - 'This is monopoly.'
      - 'A monopoly is a market with a single seller of a good that has no close substitute.'
      - 'Because buyers cannot switch to a close substitute, the monopolist can choose its price or its output. Barriers such as patents, licences or control of raw materials keep rivals out.'
      - 'For many years the old NEPA was the only seller of public electricity in Nigeria; homes had no close substitute apart from costly generators.'
      - 'Remember: mono means one; one seller, no close substitute.'
      - 'The trap is D, monopolistic competition. There the products are close substitutes, only slightly different, such as different brands of soap.'
    hint: 'Which market has only one seller?'
    why:
      B: 'An oligopoly has a few sellers, often of close substitutes.'
      C: 'In perfect competition all products are identical, perfect substitutes.'
      D: 'In monopolistic competition products are close but differentiated substitutes.'

  21:
    answer: C
    steps:
      - 'This is stagflation.'
      - 'Stagflation is inflation together with stagnant output and high unemployment.'
      - 'It usually comes from a supply shock: costs rise sharply, firms cut output and lay off workers, yet prices keep rising. So both inflation and unemployment are high at the same time.'
      - 'In 2016 Nigeria had inflation above 18 per cent while the economy was in recession and many lost their jobs.'
      - 'Remember: stagnation plus inflation makes stagflation.'
      - 'The trap is B, cost-push inflation. It can cause stagflation, but the name for inflation with high unemployment is stagflation.'
    hint: 'Join the words "stagnation" and "inflation".'
    why:
      A: 'Hyperinflation means extremely rapid inflation, whatever the level of unemployment.'
      B: 'Cost-push names a cause of inflation, not inflation with high unemployment.'
      D: 'Demand-pull inflation comes with high demand and usually low unemployment.'

  22:
    answer: B
    steps:
      - 'This is a problem of small and medium scale enterprises (SMEs) in Nigeria.'
      - 'SMEs need money to start, buy machines and expand. Their chief problem is poor access to credit.'
      - 'Banks see small firms as risky, ask for collateral they do not have, and charge high interest. Without funds, the firm cannot grow.'
      - 'A young tailor in Aba who wants ₦2 million for industrial machines is asked for land papers as collateral and is refused.'
      - 'Remember: small firms are small because they cannot borrow.'
      - 'The trap is C, poor management. It is a real problem, but credit is the one most often named first, and it is why schemes such as the Bank of Industry loans were set up.'
    hint: 'What does a small firm most often lack in order to grow?'
    why:
      A: 'Regulation is a problem, but less important than finance for most small firms.'
      C: 'Poor management is a real problem but not the chief one.'
      D: 'Nigeria''s large population gives a large market, not a small one.'

  23:
    answer: C
    steps:
      - 'These are the determinants of demand.'
      - 'Demand depends on the price of the good, prices of related goods, income, tastes, population and expectations.'
      - 'A bigger population means more buyers, so more of every good is demanded at each price, and the demand curve shifts right.'
      - 'Lagos''s fast-growing population keeps the demand for housing, food and transport rising.'
      - 'Remember: more people, more demand.'
      - 'The trap is D, cost of production. That decides supply, not demand.'
    hint: 'Which option is about buyers, not producers?'
    why:
      A: 'Incentives to workers affect production, not demand.'
      B: 'Technology is a determinant of supply.'
      D: 'Cost of production is a determinant of supply.'

  24:
    answer: A
    steps:
      - 'This is Gross National Product (GNP) by the expenditure method.'
      - 'GDP by expenditure is $C + I + G + (X - M)$: consumption, investment, government spending and net exports. GNP adds net factor income from abroad, what citizens earn abroad minus what foreigners earn here.'
      - 'So $\text{GNP} = C + I + G + (X - M) + \text{net factor income from abroad}$.'
      - 'For Nigeria, money sent home by Nigerians working abroad adds to GNP, while profits that Shell sends out of Nigeria are taken away. Nigeria''s GNP is usually below its GDP.'
      - 'Remember: GDP is the domestic product; GNP adds the nationals'' income from abroad.'
      - 'The trap is B. $C + I + G + (X - M)$ is GDP; it leaves out net factor income from abroad.'
    hint: 'What must you add to GDP to get GNP?'
    why:
      B: 'That is GDP; GNP also needs net factor income from abroad.'
      C: 'Adds exports but forgets to subtract imports, and leaves out net factor income.'
      D: 'Leaves out net exports and net factor income; it is domestic spending only.'

  25:
    answer: B
    steps:
      - 'This is the median, a measure of central tendency.'
      - 'The median is the middle value when the data are arranged in order.'
      - 'Arrange: 10, 14, 15, 18, 22, 28, 30, 35, 38. There are 9 values, so the middle one is the $\dfrac{9 + 1}{2} = 5$th.'
      - 'The 5th value is 22. Check: four values lie below 22 and four above.'
      - 'If nine traders'' daily sales are lined up from smallest to largest, the median is the sale of the trader standing in the middle.'
      - 'Remember: median, the middle, like the median strip in the middle of the road.'
      - 'The trap is A, 10. That is the first value once arranged, not the middle one.'
    hint: 'Arrange the numbers in order first.'
    why:
      A: '10 is the smallest value.'
      C: '38 is the largest value.'
      D: '35 is the first value as printed, not the middle of the ordered list.'

  26:
    answer: C
    steps:
      - 'This is average product, from the theory of production.'
      - 'Average product = total product ÷ units of the variable factor: $AP = \dfrac{TP}{n}$.'
      - 'At 5 units of capital, TP = 353 kg.'
      - '$AP = \dfrac{353}{5} = 70.6$ kg. Check: 70.6 × 5 = 353.'
      - 'If five grinding machines in a Kano mill produce 353 kg of flour a day, each machine produces 70.6 kg on average.'
      - 'Remember: average means share it out equally.'
      - 'The trap is B, 176.5. It divides 353 by 2 instead of by 5.'
    hint: 'Divide total product by the number of units of capital.'
    why:
      A: 'Far too large; at 5 units AP is 353 ÷ 5 = 70.6.'
      B: 'Divides 353 by 2 instead of by 5.'
      D: 'Too small; 353 ÷ 5 = 70.6, not 62.'

  27:
    answer: A
    steps:
      - 'This is the economic problem of what to produce.'
      - 'Every society must decide what to produce, how to produce and for whom to produce.'
      - 'What to produce is settled by what people want to consume. Goods that consumers buy a lot of are produced; goods they do not want are not. So the consumption pattern decides.'
      - 'As more Nigerians bought mobile phones and data, firms produced more phone services and fewer landlines.'
      - 'Remember: what to produce follows what people consume; how follows technology; for whom follows distribution.'
      - 'The trap is C, state of technology. That answers how to produce.'
    hint: 'Which option tells producers what people want?'
    why:
      B: 'The distribution pattern answers for whom to produce.'
      C: 'The state of technology answers how to produce.'
      D: 'The volume of production is a result, not what decides what to make.'

  28:
    answer: B
    steps:
      - 'This is the Nigerian National Petroleum Corporation (NNPC).'
      - 'The NNPC was set up in 1977 as the state oil corporation to oversee and take part in the development of Nigeria''s oil and gas sector on behalf of the government.'
      - 'It holds the government''s share in joint ventures with the multinationals, runs the refineries and pipelines, and supervises exploration, production and marketing.'
      - 'In 2022 it became NNPC Limited, a company owned by the government, under the Petroleum Industry Act.'
      - 'Remember: NNPC is the government''s hand on the whole oil sector.'
      - 'The trap is D. Pump prices were fixed by the Petroleum Products Pricing Regulatory Agency (PPPRA), not by the NNPC.'
    hint: 'What is the NNPC''s overall job in the oil industry?'
    why:
      A: 'Developing the oil areas was the work of the NDDC and OMPADEC.'
      C: 'Supply of products is one task, but its main function is the whole sector.'
      D: 'Prices were fixed by the PPPRA, now replaced by a new regulator.'

  29:
    answer: D
    steps:
      - 'These are the features of an underdeveloped economy.'
      - 'An underdeveloped economy has low income per head, low saving and investment, poor infrastructure, high population growth, high unemployment and a low standard of living.'
      - 'Low incomes mean people cannot afford good food, housing, health care or education, so the standard of living is low.'
      - 'Many rural families in Nigeria live without pipe-borne water or steady electricity.'
      - 'Remember: underdeveloped means poorly fed, poorly housed, poorly paid.'
      - 'The trap is A. Underdeveloped economies usually have a high, not low, rate of population growth.'
    hint: 'Which option describes how poor people live?'
    why:
      A: 'Underdeveloped economies usually have high population growth.'
      B: 'They suffer from under-used capacity, not excess use.'
      C: 'They usually have high unemployment.'

  30:
    answer: C
    steps:
      - 'This is the incidence of a tax: who finally bears it.'
