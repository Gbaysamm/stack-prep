      - 'The law states that as a consumer takes more units of a good, the extra satisfaction from each additional unit falls.'
      - 'In the table, marginal utility falls from 10 to 5, 2, 1 and then 0, while total utility rises more and more slowly to 18. That is diminishing marginal utility.'
      - 'The first plate of jollof rice at a party is very satisfying; the fourth plate adds almost nothing.'
      - 'Remember: each extra unit gives less extra joy.'
      - 'The trap is D, diminishing marginal productivity. That is about output from extra workers, but the table is about utility from consumption.'
    hint: 'Look at the marginal utility column. What happens to it as consumption rises?'
    why:
      A: 'Returns to scale are about production when all inputs grow, not about satisfaction.'
      B: 'The table shows utility, not demand and supply in a market.'
      D: 'Marginal productivity is about output from inputs, not utility from consumption.'

