    answer: A
    steps:
      - 'These are internal economies of scale.'
      - 'Internal economies of scale are the cost savings a firm enjoys from its own growth, such as bulk buying, better machines, specialization of staff and easier borrowing.'
      - 'They are internal because they come from inside the firm and are enjoyed by that firm alone. External economies come from the growth of the whole industry and are shared by all firms in it.'
      - 'Dangote Cement buys fuel in very large amounts at a lower price per unit than a small factory could.'
      - 'Remember: internal, in the firm; external, in the industry.'
      - 'The trap is D, external economies of scale. Those are shared by all firms in an area or industry, not achieved by one firm on its own.'
    hint: 'Savings a firm makes on its own come from inside or outside the firm?'
    why:
      B: 'Diseconomies of scale are rises in cost from growing too large, not savings.'
      C: 'External diseconomies are cost rises from the growth of the industry.'
      D: 'External economies come from the industry as a whole, not from the firm alone.'

  39:
    answer: A
    steps:
      - 'This is exchange control as a remedy for a balance of payments deficit.'
      - 'A balance of payments deficit means payments to foreigners, largely for imports, exceed receipts, largely from exports.'
      - 'Under exchange control, all foreign currency earned from exports is surrendered to the central bank, which rations it. Importers can get only what is available, so imports are held to the value of exports and the deficit closes.'
      - 'When dollars are scarce, the CBN allocates them only for essential imports, so total imports cannot exceed what exports earn.'
      - 'Remember: you cannot spend more dollars than you earn.'
      - 'The trap is B, limiting exports. Cutting exports would reduce foreign earnings and make the deficit worse.'
    hint: 'A deficit means too much is going out. Which flow does rationing foreign currency cut?'
    why:
      B: 'Limiting exports cuts foreign earnings and worsens the deficit.'
      C: 'Overvaluing the currency makes imports cheaper and exports dearer, widening the deficit.'
      D: 'Lowering the domestic price level is deflation, a different remedy from exchange control.'

