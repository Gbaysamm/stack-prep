format_version: 1
exam_year: 2017
subject: ECO
explanations:
  1:
    answer: B
    steps:
      - 'This is the arithmetic mean, a measure of central tendency.'
      - 'The mean is the sum of the values divided by how many values there are: $\bar{x} = \dfrac{\Sigma x}{n}$. So the sum is the mean times the number of values: $\Sigma x = \bar{x} \times n$.'
      - 'Data: seven values, mean 7. Sum $= 7 \times 7 = 49$. The six known values add to $2 + 3 + 5 + 8 + 10 + 12 = 40$. So $Z = 49 - 40 = 9$.'
      - 'Check: $(2 + 3 + 5 + 8 + 9 + 10 + 12) \div 7 = 49 \div 7 = 7$. It works.'
      - 'A tomato seller in Mile 12 who averages ₦7,000 a day over seven days has taken ₦49,000 in all; if six days add to ₦40,000, the missing day was ₦9,000.'
      - 'Remember: mean times number gives the total, and the total minus what you know gives the missing value.'
      - 'The trap is D, 7. The missing value is not simply equal to the mean; it must make the total come to 49.'
    hint: 'Turn the mean back into a total first. What must all seven numbers add up to?'
    why:
      A: 'With Z = 8 the total is 48, and 48 ÷ 7 is about 6.86, not 7.'
      C: 'With Z = 10 the total is 50, and 50 ÷ 7 is about 7.14, not 7.'
      D: 'With Z = 7 the total is 47, and 47 ÷ 7 is about 6.71; the missing value need not equal the mean.'

  2:
    answer: A
    steps:
      - 'This is the role of agriculture in economic development.'
      - 'Agriculture supplies food, raw materials for industry, foreign exchange from exports, employment and a market for industrial goods. Of these, the first and most basic is food.'
      - 'A nation that cannot feed itself must spend scarce foreign exchange on imported food, and hungry workers cannot be productive. Food security comes before every other role.'
      - 'The yam, cassava, rice and beans grown by Nigerian farmers feed more than two hundred million people; when harvests fail, food prices in every market rise.'
      - 'Remember: first feed the nation, then build the nation.'
      - 'The trap is D, industrial development. Agriculture helps industry by supplying raw materials, but that is a later, supporting role, not its most important one.'
    hint: 'What must every person get every day before anything else can happen?'
    why:
      B: 'Technical skills come mainly from education and training, not from agriculture.'
      C: 'Technology is developed by research and industry; agriculture mostly uses it.'
      D: 'Agriculture supports industry with raw materials, but feeding the people comes first.'

  3:
    answer: C
    steps:
      - 'This is market equilibrium from linear demand and supply equations.'
      - 'At equilibrium, quantity demanded equals quantity supplied: $Q_d = Q_s$.'
      - 'Data: $Q_d = 15 - 2P$, $Q_s = 5 + 3P$. Set them equal: $15 - 2P = 5 + 3P$, so $15 - 5 = 3P + 2P$, which gives $10 = 5P$ and $P = 2$. The equilibrium price is ₦2.00.'
      - 'Check: $Q_d = 15 - 4 = 11$ and $Q_s = 5 + 6 = 11$. Both equal 11, so the market clears.'
      - 'In a Bodija market, the price of a measure of garri settles where the amount buyers want just matches what sellers bring.'
      - 'Remember: equilibrium means demand equals supply, so put the two equations equal.'
      - 'The trap is A, ₦3.00. At ₦3 buyers want 9 but sellers offer 14, a surplus, so the price must fall.'
    hint: 'At equilibrium, what is true of Q d and Q s? Put them equal and solve for P.'
    why:
      A: 'At ₦3, quantity demanded is 9 and quantity supplied is 14, a surplus.'
      B: 'At ₦5, quantity demanded is 5 and quantity supplied is 20, a large surplus.'
      D: 'At ₦6, quantity demanded is 3 and quantity supplied is 23, so the market does not clear.'

  4:
    answer: D
    steps:
      - 'This is the scale of preference, one of the basic concepts of economics.'
      - 'The scale of preference is a list of a person''s wants arranged in order of importance, from the most pressing to the least.'
      - 'Because wants are many and means are scarce, a person ranks his wants and satisfies them from the top of the list down. The want left unsatisfied is the opportunity cost.'
      - 'A student with ₦2,000 lists textbook, transport fare, then shawarma. He buys the textbook first because it is at the top of his scale.'
      - 'Remember: a scale is a ladder, so wants are ranked from top to bottom.'
      - 'The trap is A, choices consumers make. Choice comes after the ranking; the scale itself is the ordered list of wants.'
    hint: 'A scale puts things in order. In order of what?'
    why:
      A: 'Choice is made using the scale; the scale itself is the ranked list of wants.'
      B: 'A plain array of needs is not ranked, and ranking is the whole point of a scale of preference.'
      C: 'The scale covers all wants, not only luxuries.'

  5:
    answer: B
    steps:
      - 'This is monopoly, a market with a single seller of a product that has no close substitute.'
      - 'Because the monopolist is the only seller, it is a price maker: it can fix the price or the quantity it sells, but not both, since the demand curve decides the other.'
      - 'If it sets a high price, buyers take a smaller quantity; if it chooses a large output, it must accept a lower price.'
      - 'Before mobile phone competition, NITEL was the only telephone company in Nigeria and could set line charges as it liked.'
      - 'Remember: mono means one, so one seller makes the price.'
      - 'The trap is D, a large number of buyers and sellers. That describes perfect competition, the very opposite of monopoly.'
    hint: 'If you are the only seller, who decides the price?'
    why:
      A: 'Perfect information is an assumption of perfect competition, not monopoly.'
      C: 'Perfect mobility of factors is an assumption of perfect competition.'
      D: 'Many buyers and sellers is perfect competition; a monopoly has one seller.'

  6:
    answer: C
    steps:
      - 'These are two kinds of joint-stock company: public and private limited liability companies.'
      - 'Both have limited liability, a separate legal entity and perpetual existence. The difference is in the shares: a public company (Plc) sells shares to the public and they are traded freely on the stock exchange; a private company (Ltd) restricts the transfer of its shares.'
      - 'Because Plc shares can be bought and sold easily, the company can raise large capital from many investors, and an investor can sell out at any time.'
      - 'A trader can buy Dangote Cement Plc shares on the stock exchange today and sell them next week; shares in a family Ltd company cannot be sold without the other members'' consent.'
      - 'Remember: Plc is public, so its shares move freely in public.'
      - 'The trap is A, limited liability. It is an advantage, but a private limited company has it too, so it is not an advantage over it.'
    hint: 'Which feature does a Plc have that a private limited company does not?'
    why:
      A: 'Limited liability is shared by both kinds of company.'
      B: 'Both kinds of company are separate legal entities.'
      D: 'Both kinds of company enjoy perpetual existence.'

  7:
    answer: C
    steps:
      - 'This is the upstream sector of the oil industry.'
      - 'The oil industry is split into upstream (exploration and production, that is, finding and extracting crude oil) and downstream (refining, distribution and marketing of products).'
      - 'Upstream work happens at the oil fields: drilling wells and bringing crude oil out of the ground or the sea bed.'
      - 'Oil companies drilling in the Niger Delta and offshore at Bonga are in the upstream sector; the Warri refinery and filling stations are downstream.'
      - 'Remember: upstream is up at the source, where the oil comes out of the ground.'
      - 'The trap is D, refining. Refining turns crude into petrol and kerosene, and that is downstream.'
    hint: 'Upstream is at the source of the oil. What happens at the source?'
    why:
      A: 'Marketing of petroleum products is a downstream activity.'
      B: 'Distribution of products by pipelines and tankers is downstream.'
      D: 'Refining crude oil is downstream.'

  8:
    answer: D
    steps:
      - 'This is the natural growth (natural increase) of population.'
      - 'Natural growth is the difference between the birth rate and the death rate: natural growth = birth rate − death rate. Migration is left out.'
      - 'If more people are born than die, the population grows; if deaths exceed births, it shrinks.'
      - 'If a state has a birth rate of 40 per thousand and a death rate of 12 per thousand, its natural growth is 28 per thousand.'
      - 'Remember: births add, deaths take away.'
      - 'The trap is C, death rate − birth rate. That reverses the order and gives a negative number whenever the population is growing.'
    hint: 'Births add people, deaths remove them. Which do you subtract from which?'
    why:
      A: 'Adding deaths to births makes no sense; deaths reduce the population.'
      B: 'Labour force plus dependants is the whole population, not its growth.'
      C: 'This reverses the order and shows a growing population as negative.'

  9:
    answer: D
    steps:
      - 'This is the age structure (age distribution) of a population.'
      - 'The age structure groups people into the young (under 15), the working age (15 to 64) and the old (65 and above).'
      - 'The working-age group is the labour force, so the age structure tells government how many workers it has and how many dependants they must support. That guides plans for jobs, schools and pensions.'
      - 'Nigeria''s large under-15 group tells planners that many young people will soon need jobs, so the future labour force will be big.'
      - 'Remember: count the ages, and you count the workers.'
      - 'The trap is C, the cost of living. Prices of goods show the cost of living; age groups do not.'
    hint: 'Which age group works? What does counting it tell the government?'
    why:
      A: 'Exchange rates are set by the market for currencies and by the CBN, not by age groups.'
      B: 'Interest rates come from the money market and monetary policy, not from population ages.'
      C: 'The cost of living is measured by price indices, not by age structure.'

  10:
    answer: C
    steps:
      - 'This is composite demand, one of the types of demand.'
      - 'Composite demand is the demand for one commodity that has several different uses.'
      - 'Palm oil is wanted by soap makers and by households for cooking. The total demand for palm oil is made up of these separate demands, so a rise in one use leaves less for the other.'
      - 'In Nigeria, palm oil from Imo and Cross River goes into soap factories and also into every pot of egusi soup.'
      - 'Remember: composite means made of parts, one good, many uses.'
      - 'The trap is D, derived demand. Derived demand is demand for a thing because of the good it helps to make, like labour; here the point is one good with several uses.'
    hint: 'One good, several uses. What is that type of demand called?'
    why:
      A: 'Competitive demand is for substitutes, such as two brands of soap.'
      B: 'Complementary (joint) demand is for goods used together, such as a car and petrol.'
      D: 'Derived demand is demand for a factor because of the product it makes, not one good with many uses.'

  11:
    answer: C
    steps:
      - 'This is the institution that promotes Nigeria''s exports.'
      - 'The Nigerian Export Promotion Council (NEPC) is the government agency set up to promote and develop exports, especially non-oil exports, through export incentives, trade fairs and export information.'
      - 'Nigerian Export-Import Bank and the Bank of Industry are banks: they lend money. Import substitution is a strategy of industrialization, not an institution at all.'
      - 'NEPC helps sesame, cashew and shea butter exporters find buyers abroad and pays export incentives.'
      - 'Remember: NEPC, the P is for promotion.'
      - 'The trap is A, the Nigerian Export-Import Bank. It finances exporters, but it is a bank, and the question asks for the promotion agency.'
    hint: 'Which name contains the word "promotion" and is not a bank?'
    why:
      A: 'The Nigerian Export-Import Bank is a bank that lends to exporters, not the promotion agency.'
      B: 'Import substitution is a strategy of producing at home what was imported, not an institution.'
      D: 'The Bank of Industry is a bank that lends to manufacturers.'

  12:
    answer: B
    steps:
      - 'This is reading a pie chart.'
      - 'A full circle is 360°, so the percentage share of a sector is $\dfrac{\text{sector angle}}{360°} \times 100\%$.'
      - 'Data: the entrepreneur''s sector is 120°. Percentage $= \dfrac{120}{360} \times 100\% = \dfrac{1}{3} \times 100\% = 33.33\%$.'
      - 'Check: the four angles $110 + 70 + 60 + 120 = 360$, so the chart is complete, and 120° is one third of the circle.'
      - 'If a Lagos bakery shares its earnings like this pie, the owner who takes the risks gets one third of every naira.'
      - 'Remember: angle over 360, times 100.'
      - 'The trap is D, 3.33%. It slips the decimal point in 33.33%; a sector that is one third of the circle must be one third of 100%.'
    hint: 'What fraction of 360° is 120°?'
    why:
      A: '2.77% is about 1/36, far too small for a sector that is one third of the circle.'
      C: '27.70% is close to 100 ÷ 360 as a percentage; it does not use the 120° angle.'
      D: '3.33% has the decimal point in the wrong place; 120 ÷ 360 × 100 is 33.33%.'

  13:
    answer: D
    steps:
      - 'This is economic growth, as distinct from economic development.'
      - 'Economic growth is a sustained increase in a country''s real output of goods and services, and so in its per capita income, over time. It is about quantity.'
      - 'Economic development is wider: growth together with better welfare, less poverty, more education and health, and changes in the structure of the economy. It is about quality of life.'
      - 'When Nigeria''s GDP rises year after year, that is growth; development is seen when that output also brings more jobs, better roads, schools and hospitals.'
      - 'Remember: growth is more, development is better.'
      - 'The trap is C, economic development. Development includes growth, but the question describes only more output and income, which is growth.'
    hint: 'The question speaks only of more income and more output. Is that a change in quantity or in quality of life?'
    why:
      A: 'Economies of scale are cost savings of a firm as it grows, not a rise in national income.'
      B: 'Economic efficiency is the best use of resources, not a rise in output and income over time.'
      C: 'Development needs better welfare and structural change as well, not only more output and income.'

  14:
    answer: A
    steps:
      - 'These are the rewards of the factors of production.'
      - 'Each factor earns its own reward: land earns rent, labour earns wages, capital earns interest and the entrepreneur earns profit.'
      - 'The owner of capital gives up the use of his money or machines, and interest is the payment for that use.'
      - 'A Nigerian who deposits savings in a bank or buys a government bond is supplying capital and earns interest.'
      - 'Remember: Land Rent, Labour Wages, Capital Interest, Entrepreneur Profit.'
      - 'The trap is C, profit. Profit rewards the entrepreneur for bearing risk, not the owner of capital.'
    hint: 'What does a bank pay you for the use of your money?'
    why:
      B: 'Rent is the reward for land.'
      C: 'Profit is the reward for the entrepreneur.'
      D: 'Wages are the reward for labour.'

  15:
    answer: C
    steps:
      - 'This is demand-pull inflation.'
      - 'Demand-pull inflation is a persistent rise in the general price level caused by aggregate demand being greater than aggregate supply: too much money chasing too few goods.'
      - 'When buyers want more than producers can supply, sellers raise prices. The excess demand pulls prices up.'
      - 'In December, when many Nigerians have bonuses and buy for Christmas, the price of chicken and rice in the market shoots up.'
      - 'Remember: demand pulls prices up, costs push prices up.'
      - 'The trap is B, cost-push. That comes from rising costs of production such as wages and fuel, not from excess demand.'
    hint: 'Which name has the word "demand" in it?'
    why:
      A: 'Galloping inflation describes how fast prices rise, not why.'
      B: 'Cost-push inflation comes from rising production costs, not excess demand.'
      D: 'Imported inflation comes from rising prices of imported goods.'

  16:
    answer: B
    steps:
      - 'This is the problem of measuring national income.'
      - 'National income is measured in money, but money changes in value. Inflation raises prices and deflation lowers them, so the money value of output changes even when the real output does not.'
      - 'To compare years, statisticians must remove the price change with a price index, turning nominal income into real income, and this is never exact.'
      - 'If Nigeria''s GDP in naira doubles in a year when prices also double, real output has not grown at all.'
      - 'Remember: changing prices make a changing ruler.'
      - 'The trap is D, population growth. It affects income per head, but it does not make output harder to measure.'
    hint: 'National income is measured in naira. What makes the value of the naira change?'
    why:
      A: 'A high interest rate affects investment, not the measuring of national income.'
      C: 'Overpopulation lowers income per head but is not a problem of measurement.'
      D: 'Population growth affects per capita income, not how output is measured.'

  17:
    answer: C
    steps:
      - 'This is capitalism, the free enterprise economy.'
      - 'Under capitalism, resources are privately owned and people are free to choose what to consume and what to produce, guided by the price mechanism.'
      - 'Consumer sovereignty decides what is produced, and firms produce whatever earns profit.'
      - 'A trader in Onitsha can choose to sell phones or fabrics, and a buyer can choose what to buy, with no government order.'
      - 'Remember: capitalism, free choice for buyers and sellers.'
      - 'The trap is A, socialism. Under socialism the state owns resources and plans what is produced.'
    hint: 'In which system does the price mechanism, not the state, decide?'
    why:
      A: 'Socialism has state ownership and central planning of production.'
      B: 'Under feudalism the lords controlled land and the serfs had little freedom.'
      D: 'Communism has collective ownership and no freedom of private production.'

  18:
    answer: B
    steps:
      - 'This is variable cost, one of the short-run costs of a firm.'
      - 'A variable cost changes with the level of output: the more you produce, the more you pay. A fixed cost stays the same whatever the output.'
      - 'Raw materials are used up in each unit of output, so their cost rises as output rises and is zero when nothing is produced.'
      - 'A bakery in Aba buys more flour and sugar when it bakes more bread; its rent stays the same.'
      - 'Remember: variable varies with output.'
      - 'The trap is D, fixed cost. Rent and salaries of permanent staff are fixed; raw materials change with output.'
    hint: 'If the firm doubles its output, what happens to its spending on raw materials?'
    why:
      A: 'Marginal cost is the extra cost of one more unit, not a type of input cost.'
      C: 'Total cost is fixed cost plus variable cost; raw materials are only one part of it.'
      D: 'Fixed costs, such as rent, do not change with output; raw material costs do.'

  19:
    answer: B
    steps:
      - 'This is foreign exchange control, a tool for managing the balance of payments.'
      - 'Exchange control is the rationing of foreign currency by the monetary authority. In Nigeria, the monetary authority is the Central Bank of Nigeria (CBN).'
      - 'The CBN decides who may buy foreign exchange, for what purposes and how much, and sells dollars to the banks.'
      - 'In 2015 the CBN listed 41 items whose importers could not buy foreign exchange at the official window.'
      - 'Remember: the CBN keeps the nation''s foreign reserves, so it controls who gets them.'
      - 'The trap is A, money deposit banks. They sell foreign exchange to customers, but only under the CBN''s rules.'
    hint: 'Which body holds Nigeria''s foreign reserves and sets the rules for the banks?'
    why:
      A: 'Deposit money banks only carry out the CBN''s foreign exchange rules.'
      C: 'Discount houses dealt in short-term government securities, not foreign exchange control.'
      D: 'The Securities and Exchange Commission regulates the capital market.'

  20:
    answer: B
    steps:
      - 'This is reading a pie chart to find a share of a total.'
      - 'A sector''s value is $\dfrac{\text{sector angle}}{360°} \times \text{total}$.'
      - 'Data: capital''s sector is 60°, total ₦855 million. Capital $= \dfrac{60}{360} \times 855 = \dfrac{1}{6} \times 855 = 142.5$, so ₦142.50 million.'
      - 'Check: 60° is one sixth of the circle, and $142.5 \times 6 = 855$.'
      - 'If a Kano textile firm earns ₦855 million and shares it like this chart, the owners of its machines and buildings get ₦142.50 million.'
      - 'Remember: angle over 360, times the total.'
      - 'The trap is C, ₦50 million. That would be one sixth of ₦300 million, not of ₦855 million.'
    hint: 'What fraction of the circle is capital''s 60° sector?'
    why:
      A: '₦12.50 million is one sixth of ₦75 million, not of ₦855 million.'
      C: '₦50 million is one sixth of ₦300 million, not of ₦855 million.'
      D: '₦7.50 million is far too small; one sixth of ₦855 million is over ₦100 million.'

  21:
    answer: D
    steps:
      - 'This is the level of output and productivity.'
      - 'Output comes from combining the factors of production: land, labour, capital and the entrepreneur. How much is produced depends on the quantity of these factors and on how efficiently they are used.'
      - 'Efficient use, through good management, skills, technology and specialization, gets more output from the same inputs.'
      - 'Two cassava farms of the same size in Benue: the one using improved stems, fertilizer and good planning harvests far more.'
      - 'Remember: output = factors × efficiency.'
      - 'The trap is B, the standard of living. A high standard of living is a result of high output, not its cause.'
    hint: 'Output is made by the factors of production. What decides how much they make?'
    why:
      A: 'The exchange rate affects trade and prices, not directly the volume of output.'
      B: 'The standard of living results from output; it does not determine it.'
      C: 'Population density alone does not decide output; how the factors are used does.'

  22:
    answer: A
    steps:
      - 'This is market equilibrium from linear equations, asking for the quantity.'
      - 'At equilibrium, $Q_d = Q_s$. Solve for the price first, then put it back to find the quantity.'
      - 'Data: $Q_d = 30 - 3P$, $Q_s = 9P - 18$. Set equal: $30 - 3P = 9P - 18$, so $30 + 18 = 9P + 3P$, giving $48 = 12P$ and $P = 4$.'
      - 'Quantity: $Q_d = 30 - 3(4) = 30 - 12 = 18$. Check: $Q_s = 9(4) - 18 = 36 - 18 = 18$. Both give 18.'
      - 'A rice seller in Abakaliki finds that at ₦4 a cup, buyers want exactly the 18 bags farmers bring.'
      - 'Remember: find P first, then put P back in either equation.'
      - 'The trap is D, 27. It comes from stopping at a wrong price; always put the price back and check both equations agree.'
    hint: 'Find the equilibrium price first. Then substitute it into Q d.'
    why:
      B: '20 does not come from either equation at the equilibrium price of 4.'
      C: '25 would need a price of about 1.67 in the demand equation, where supply would be negative.'
      D: '27 would need a price of 1 in the demand equation, where supply is −9.'

  23:
    answer: C
    steps:
      - 'This is how to promote industrialization in Nigeria.'
      - 'Industries need infrastructure: steady electricity, good roads, rail, water and communication. Without them, costs of production are high.'
      - 'When government provides efficient infrastructure, firms spend less on generators and transport, costs fall, output rises and new firms are attracted.'
      - 'Many factories in Lagos and Kano spend a large part of their costs on diesel for generators because power supply is poor.'
      - 'Remember: power and roads first, factories follow.'
      - 'The trap is D, raising interest rates. Higher interest makes loans dearer, so firms borrow and invest less.'
    hint: 'What do all factories need from government to cut their costs?'
    why:
      A: 'Fixing prices of manufactures does not lower costs or expand capacity.'
      B: 'Many industries need imported machines and inputs, so cutting such spending can slow them.'
      D: 'A higher interest rate makes borrowing dearer and discourages industrial investment.'

  24:
    answer: C
    steps:
      - 'This is the investment multiplier.'
      - 'The multiplier tells how many times national income rises for each naira of new investment: $k = \dfrac{1}{1 - \text{MPC}} = \dfrac{1}{\text{MPS}}$.'
      - 'Data: $\text{MPC} = 0.8$, so $\text{MPS} = 1 - 0.8 = 0.2$. Then $k = \dfrac{1}{0.2} = 5$.'
      - 'Check: an investment of ₦1 million raises income by ₦5 million. Out of each round of new income 80% is spent again, so the rounds add up to five times the start.'
      - 'If government spends ₦10 billion building a road in Ogun, the workers spend their wages at mama put stalls and shops, and the total income created can reach ₦50 billion.'
      - 'Remember: the multiplier is one over the M P S.'
      - 'The trap is B, 1.25. That is $\dfrac{1}{0.8}$, one over the M P C instead of one over the M P S.'
    hint: 'Find the M P S first. The multiplier is one over it.'
    why:
      A: '0.2 is the M P S, not the multiplier.'
      B: '1.25 is one over the M P C; the multiplier is one over the M P S.'
      D: '8 is ten times the M P C; it does not come from the multiplier formula.'

  25:
    answer: D
    steps:
      - 'This is capital gains tax, a type of direct tax.'
      - 'A direct tax is paid by the person who earns the income or gain, and it falls on that person. Taxes on income, profits and gains are direct.'
      - 'Capital gains tax is levied on the gain made when an asset such as land or shares is sold above its cost. Such a gain is a form of income, so the tax belongs with income tax.'
      - 'A man who buys land in Lekki for ₦10 million and sells it for ₦30 million pays capital gains tax on the ₦20 million gain.'
      - 'Remember: a gain is income, so its tax is a tax on income.'
      - 'The trap is A, Value Added Tax. VAT is an indirect tax on goods and services, paid by the buyer through the price.'
    hint: 'Is a capital gain something you spend, or something you earn?'
    why:
      A: 'VAT is an indirect tax on spending on goods and services.'
      B: 'Purchase tax is an indirect tax charged on the buying of goods.'
      C: 'Sales tax is an indirect tax charged at the point of sale.'

  26:
    answer: C
    steps:
      - 'These are the sources of government revenue.'
      - 'Government earns from taxes, fees, licences and fines; from interest, dividends and profits of its enterprises and investments; and from grants, aids and borrowing.'
      - 'Personal income, disposable income and transfer earnings are incomes of households and factor owners. They are not paid to government, though government may tax part of them.'
      - 'Nigeria''s government earns from oil royalties, company tax, VAT and loans; your take-home pay is your disposable income, not government revenue.'
      - 'Remember: revenue is what flows into the treasury.'
      - 'The trap is D, grants, aids and borrowing. Borrowed money must be repaid, but it is still money that comes into government''s hands to spend.'
    hint: 'Which group describes the income of individuals rather than money paid to government?'
    why:
      A: 'Taxes, fees, licences and fines are the main sources of government revenue.'
      B: 'Government earns interest, dividends and profits from its investments and enterprises.'
      D: 'Grants, aids and borrowing all bring money into government''s hands.'

  27:
    answer: C
    steps:
      - 'These are the qualities (characteristics) of good money.'
      - 'Good money should be generally acceptable, durable, portable, divisible, scarce, stable in value and homogeneous.'
      - 'Homogeneity means every unit of the same denomination is identical, so a ₦500 note is worth exactly the same as any other ₦500 note and nobody needs to inspect it.'
      - 'A trader in Balogun accepts any ₦1,000 note without checking its quality, because all such notes are the same.'
      - 'Remember: same note, same value.'
      - 'The trap is B, easy availability. Money must be scarce; if it were easy to get, it would lose its value.'
    hint: 'Should two notes of the same value be alike or different?'
    why:
      A: 'Heterogeneity means the units differ, which would make money hard to accept.'
      B: 'Money must be relatively scarce; easy availability destroys its value.'
      D: 'Money should be stable in value, not flexible.'

  28:
    answer: C
    steps:
      - 'This is a change in quantity supplied, a movement along one supply curve.'
      - 'When the price of the good itself changes, the quantity supplied changes along the same curve. A change in any other factor shifts the whole curve, which is a change in supply.'
      - 'In the graph there is only one curve, SS. As price rises from P₁ to P₂, the quantity supplied rises from Q₁ to Q₂, a movement up the curve. That is an increase in quantity supplied.'
      - 'When the price of tomatoes rises in the dry season, farmers in Kano bring more baskets to market.'
      - 'Remember: one curve, a move along it; a new curve, a shift.'
      - 'The trap is B, an increase in supply. That would need a second supply curve to the right of the first; this graph has only one.'
    hint: 'Count the supply curves. Does the curve move, or does the point move along it?'
    why:
      A: 'Quantity supplied rises from Q₁ to Q₂, it does not fall.'
      B: 'An increase in supply is a shift of the whole curve to the right; here there is one curve.'
      D: 'A decrease in supply is a leftward shift of the curve, which the graph does not show.'

  29:
    answer: A
    steps:
      - 'This is the circular flow of income between households and firms.'
      - 'Real flows and money flows go in opposite directions. Households supply productive services to firms, and firms pay them factor payments. Firms supply goods and services to households, and households pay for them.'
      - 'In the diagram, goods and services flow from firms to households. The arrow M runs the other way, from households to firms, under it. So M is the money households pay for those goods and services, their consumption spending.'
      - 'When a family in Enugu buys bread and pays the baker, the bread goes one way and the naira go the other.'
      - 'Remember: every real flow has a money flow running back against it.'
      - 'The trap is B, payments to factors. Those go from firms to households, the top arrow, not M.'
    hint: 'M runs from households to firms. What do households pay firms for?'
    why:
      B: 'Factor payments go from firms to households, the top arrow, the opposite way to M.'
      C: 'Capital goods flow between firms, not from households to firms as consumer spending.'
      D: 'Economic rent is a surplus earned by a factor, paid to households, not by them.'

  30:
    answer: B
    steps:
      - 'This is a change in quantity supplied.'
      - 'The law of supply: the higher the price of a good, the more of it is supplied. A change in the good''s own price causes a change in quantity supplied, a movement along the curve.'
      - 'Changes in other things, such as technology or the prices of other goods, change supply and shift the whole curve.'
      - 'When the price of a crate of eggs in Ibadan rises, poultry farmers sell more of their eggs instead of keeping them.'
      - 'Remember: own price moves you along; anything else shifts the curve.'
      - 'The trap is D, technological know-how. Better technology shifts the supply curve; it is a change in supply, not in quantity supplied.'
    hint: 'A movement along the supply curve is caused by a change in which price?'
    why:
      A: 'The price of substitutes affects demand, or shifts supply, not the quantity supplied along the curve.'
      C: 'Consumers'' tastes affect demand, not supply.'
      D: 'Technology shifts the supply curve, a change in supply.'

  31:
    answer: B
    steps:
      - 'This is price elasticity of demand (PED), the response of quantity demanded to a change in price.'
      - 'Formula: $\text{PED} = \dfrac{\%\,\Delta Q_d}{\%\,\Delta P} = \dfrac{\Delta Q / Q}{\Delta P / P}$, using the starting values.'
      - 'Data: $P$ falls from ₦6 to ₦5, so $\Delta P = 1$ and $\dfrac{\Delta P}{P} = \dfrac{1}{6}$. $Q$ rises from 20 to 21, so $\Delta Q = 1$ and $\dfrac{\Delta Q}{Q} = \dfrac{1}{20}$.'
      - 'Working: $\text{PED} = \dfrac{1}{20} \div \dfrac{1}{6} = \dfrac{1}{20} \times 6 = \dfrac{6}{20} = 0.30$. Check: 0.30 is less than 1, so demand is inelastic; a 16.7% price cut brings only a 5% rise in quantity.'
      - 'Salt is like this in a Nigerian kitchen: cut its price and people buy only a little more.'
      - 'Remember: percentage change in quantity on top, percentage change in price below.'
      - 'The trap is C, 0.33. It looks like one third, but with the starting quantity of 20 and the starting price of ₦6 the answer is exactly 0.30.'
    hint: 'Find the proportional change in quantity and in price, then divide quantity by price.'
    why:
      A: '0.03 is ten times too small; it leaves out the price base of 6.'
      C: '0.33 is not the result; with the starting values the working gives 6 ÷ 20 = 0.30.'
      D: '0.04 does not come from the formula; it mixes up the two proportional changes.'

