      - 'A poultry farmer in Ogun takes a bank loan to build a second pen and doubles his output.'
      - 'Remember: commercial banks lend; the central bank controls.'
      - 'The trap is A, banker to the government. That is a function of the Central Bank of Nigeria, not of deposit money banks.'
    hint: 'Which option is something an ordinary bank does for its customers?'
    why:
      A: 'Banker to the government is a function of the central bank.'
      C: 'Formulating monetary policy is the job of the central bank.'
      D: 'Only the central bank issues currency notes.'

  33:
    answer: C
    steps:
      - 'These are the arguments against monopoly.'
      - 'A monopolist has no rival, so it can charge high prices, restrict output and offer poor quality. This is exploitation of consumers.'
      - 'Since buyers have no other seller to go to, they must accept the monopolist''s terms.'
      - 'Nigerians long complained of poor service and estimated bills from the single state power company, which they could not leave.'
      - 'Remember: one seller, no escape, so exploitation.'
      - 'The trap is B, competition. A monopoly has no competition; that absence is the problem, not an argument against it.'
    hint: 'If there is only one seller, what can it do to buyers?'
    why:
      A: 'Merging of producers is one way a monopoly forms, not an argument against it.'
      B: 'A monopoly has no competition; competition is what it lacks.'
      D: 'Private ownership is not in itself a case against monopoly.'

  34:
    answer: C
    steps:
      - 'This is the basis for international trade.'
      - 'Countries are endowed with different natural resources, climates, skills and capital. So each can produce some goods more cheaply than others, which is the basis of comparative advantage.'
      - 'Each country specializes in what it produces best and trades for the rest, so all gain.'
      - 'Nigeria has crude oil and cocoa; it exports them and imports machinery it cannot make as cheaply.'
      - 'Remember: different gifts, so trade.'
      - 'The trap is A, high profit. Traders do seek profit, but trade between nations exists because resources differ.'
    hint: 'Why can one country make a good more cheaply than another?'
    why:
      A: 'Profit is a motive of traders, but unequal resources are the reason countries trade.'
      B: 'Capital-intensive methods are a way of producing, not the reason for trade.'
      D: 'Population structure does not explain why countries exchange goods.'

  35:
    answer: A
    steps:
      - 'This is total utility and marginal utility.'
      - 'Marginal utility (MU) is the extra satisfaction from one more unit, so total utility rises by the MU each time: $\text{TU}_n = \text{TU}_{n-1} + \text{MU}_n$.'
      - 'Data: TU after 3 cups is 29, and the MU of the 4th cup is 3. So $X = 29 + 3 = 32$.'
      - 'Check: $\text{TU}_5 = 32 + 2 = 34$, which matches the table.'
      - 'A thirsty student enjoys the first cup of milk most; each later cup adds less, but total satisfaction still grows until MU is zero.'
      - 'Remember: total = previous total + marginal.'
      - 'The trap is C, 34. That is the total after 5 cups, not after 4.'
    hint: 'Start from the total after 3 cups and add the marginal utility of the 4th.'
    why:
      B: '35 is the total utility after 6 or 7 cups.'
      C: '34 is the total utility after 5 cups.'
      D: '30 would make the marginal utility of the 4th cup 1, not 3.'

