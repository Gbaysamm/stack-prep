      - 'Utility is the satisfaction a consumer gets from consuming a good or service.'
      - 'A good has utility because it satisfies a want when it is used up or enjoyed. The more a want is satisfied, the more utility the consumer gets, though each extra unit adds less.'
      - 'A hungry student who eats a plate of jollof rice gets great utility from it; the third plate gives far less.'
      - 'Remember: utility is the joy of using, the satisfaction from consumption.'
