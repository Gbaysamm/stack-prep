      - 'A formula is used so that each tier gets a fair, agreed share to carry out its duties, and disputes over money are reduced.'
      - 'In Nigeria the Federation Account Allocation Committee shares the revenue each month; the federal government has taken about 52 per cent, the states about 27 per cent and the local governments about 21 per cent.'
