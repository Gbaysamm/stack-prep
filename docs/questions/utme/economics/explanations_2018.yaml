    answer: C
    steps:
      - 'This is the efficiency of labour, the output a worker produces in a given time.'
      - 'It depends on the quality of the worker and of the setting: education and training, health, attitude to work, working conditions, the tools used and the management.'
      - 'The total population decides how many workers there are, not how well each one works. A large population can have low efficiency and a small one high efficiency.'
      - 'A trained welder in Nnewi with good tools produces far more in a day than an untrained one, whatever the size of Nigeria''s population.'
      - 'Remember: efficiency is about how well, population is about how many.'
      - 'The trap is A, social attitude to work. A people who value hard work and punctuality are more productive, so attitude does affect efficiency.'
    hint: 'Which option is about the number of people, not the quality of their work?'
    why:
      A: 'A good attitude to work raises output per worker, so it does affect efficiency.'
      B: 'Education and training raise skills, so they affect efficiency.'
      D: 'Good working conditions raise output per worker, so they affect efficiency.'

  31:
    answer: B
    steps:
      - 'This is the law of diminishing returns, read from a total product curve.'
      - 'The law says that as more units of a variable factor are added to a fixed factor, the marginal product, the extra output from each extra unit, at first rises but eventually falls. Diminishing returns set in at the point where marginal product starts to fall.'
      - 'On a total product curve, marginal product is the slope. From O through R the curve gets steeper and steeper, so marginal product is rising. At S the curve stops getting steeper; after S it still rises but more and more gently. So S, the point of inflexion, is where marginal product starts to fall.'
      - 'T is the peak of total product, where marginal product has fallen to zero. After T, on the way to V, total product falls, so marginal product is negative.'
      - 'A cassava farmer in Oyo adds workers to one hectare. The first few add more and more output; after a point each new worker adds less; at last extra workers crowd the plot and output falls.'
      - 'The trap is C, T. T is the top of the curve, where marginal product is zero; diminishing returns began earlier, at S.'
    hint: 'Marginal product is the slope of the curve. Where does the curve stop getting steeper?'
    why:
      A: 'At R the curve is still getting steeper, so marginal product is still rising.'
      C: 'T is the peak of total product, where marginal product is zero; diminishing returns set in before it.'
      D: 'At V total product is falling, which is negative returns, long after diminishing returns began.'

  32:
    answer: D
    steps:
      - 'This is fiscal policy.'
      - 'Fiscal policy is the use of government revenue, mainly taxes, and government expenditure to influence the level of economic activity.'
      - 'To fight inflation, government can raise taxes and cut spending, which reduces demand. To fight a slump, it can cut taxes and spend more, which raises demand and jobs.'
      - 'The Federal Government''s annual budget, with its VAT rate and its spending on roads and salaries, is fiscal policy in action.'
      - 'Remember: fiscal means the government purse, money in through taxes and out through spending.'
      - 'The trap is B, tax policy. Tax policy covers only the taxes, but the question names both taxes and spending.'
    hint: 'Which policy uses both the government''s income and its spending?'
    why:
      A: 'Monetary policy uses the money supply and interest rates, controlled by the central bank.'
      B: 'Tax policy covers only taxes, not government spending.'
      C: 'Economic policy is too general; it covers every kind of policy.'

