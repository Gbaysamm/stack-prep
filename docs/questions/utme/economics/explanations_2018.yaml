      - 'Dumping is selling a good abroad at a price below its cost of production, or below its price in the home market.'
      - 'Firms do it to get rid of surplus output or to drive foreign rivals out of a market. The importing country''s own producers cannot compete with the low price and may close down.'
      - 'Cheap imported textiles sold in Nigerian markets below their cost of production helped close textile mills in Kaduna.'
      - 'Remember: dump the surplus abroad, below cost.'
      - 'The trap is B, counter trade. Counter trade is exchanging goods for goods between countries, like barter, not selling below cost.'
    hint: 'What is it called when goods are sold abroad more cheaply than they cost to make?'
    why:
      B: 'Counter trade is exchange of goods for goods, a form of barter.'
      C: 'Bilateral trade is trade between two countries.'
      D: 'Trade liberalization is the removal of trade barriers.'

