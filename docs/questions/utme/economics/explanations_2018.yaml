format_version: 1
exam_year: 2018
subject: ECO
explanations:
  1:
    answer: A
    steps:
      - 'This is the occupational distribution of the population: how the working population is shared among farming, industry and services.'
      - 'The distribution follows the level of economic development. A poor, little-developed economy keeps most of its workers in farming; as an economy develops, workers move into manufacturing and then into services.'
      - 'Economic factors such as income per head, the amount of capital, the growth of industry and the resources found in a place decide which jobs exist and pay. People take the jobs that exist and pay, so economic factors shape the distribution most.'
      - 'In Nigeria most rural workers still farm, while in Lagos, where industry, banking and trade are concentrated, most workers are in services and manufacturing.'
      - 'Remember: people go where the jobs and the money are.'
      - 'The trap is C, geographical factors. Climate and land do matter for farming, but they work through the economy: they decide what can be produced and sold.'
    hint: 'What decides which jobs exist and pay in a country?'
    why:
      B: 'Religion may affect a few jobs, but it does not decide how a whole working population is shared out.'
      C: 'Geography matters only through what it lets the economy produce; it is not the main influence.'
      D: 'Social factors such as status play a smaller part than the jobs the economy offers.'

  2:
    answer: A
    steps:
      - 'This is the reward of a factor of production.'
      - 'Each factor earns its own reward: land earns rent, labour earns wages, capital earns interest and the entrepreneur earns profit.'
      - 'Capital is man-made wealth used to produce more goods, such as machines and money lent for business. Whoever supplies it gives up its use for a time and is paid interest for that.'
      - 'A bank that lends ₦2 million to a garri processor in Ogun charges interest on the loan; that interest is the reward for the capital it supplied.'
      - 'Remember: Land, Labour, Capital, Entrepreneur earn Rent, Wages, Interest, Profit.'
      - 'The trap is B, rent. Rent is the reward for land, not capital.'
    hint: 'List the four factors and their four rewards. Which one goes with capital?'
    why:
      B: 'Rent is the reward for land.'
      C: 'Risk is something the entrepreneur bears, not a reward.'
      D: 'A premium is a payment for insurance, not the reward of a factor.'

  3:
    answer: C
    steps:
      - 'This is devaluation.'
      - 'Devaluation is a deliberate cut, by the government or central bank, in the value of the home currency against foreign currencies.'
      - 'After devaluation each unit of the home currency buys less foreign currency. Exports become cheaper to foreigners and imports dearer at home, which is meant to help the balance of payments.'
      - 'In 2016 the CBN let the naira fall from about ₦197 to about ₦305 to the dollar, so a dollar import cost more naira than before.'
      - 'Remember: de-value means take value down, against other currencies.'
      - 'The trap is A, deflation. Deflation is a fall in the general price level at home, not in the external value of the currency.'
    hint: 'Which word describes cutting the value of the naira against the dollar?'
    why:
      A: 'Deflation is a fall in the general price level inside the country.'
      B: 'Inflation is a rise in the general price level inside the country.'
      D: 'Revaluation is the opposite: a rise in the currency''s value against others.'

  4:
    answer: D
    steps:
      - 'This is a mortgage bank, a specialised financial institution.'
      - 'A mortgage bank gives long-term loans for buying, building or improving houses, and holds the property as security until the loan is repaid.'
      - 'Because houses cost far more than most people earn in a year, the loan is spread over many years, often 15 to 30. If the borrower fails to pay, the bank can sell the house.'
      - 'The Federal Mortgage Bank of Nigeria lends to workers through the National Housing Fund so they can build or buy a home.'
      - 'Remember: mortgage means a house loan, with the house as the guarantee.'
      - 'The trap is A, finance agriculture. Farm loans are the work of an agricultural bank such as the Bank of Agriculture.'
    hint: 'What does a mortgage usually pay for?'
    why:
      A: 'Financing agriculture is the work of an agricultural bank.'
      B: 'Banks are not set up with mortgage loans; their capital comes from shareholders.'
      C: 'Loans for machinery come from development and industrial banks, such as the Bank of Industry.'

  5:
    answer: B
    steps:
      - 'This is the capitalist, or free enterprise, economy.'
      - 'In a capitalist economy the factors of production, land, capital and businesses, are owned and controlled by private individuals, not by the state.'
      - 'Each owner decides what to produce in order to make a profit, and prices set by demand and supply guide the decisions.'
      - 'A private farmer in Benue owns her yam farm and decides alone how much to plant and where to sell it. That is private ownership at work.'
      - 'Remember: capitalist means private hands and the profit motive.'
      - 'The trap is C, government. State ownership of the factors is the mark of a socialist, centrally planned economy.'
    hint: 'Who owns the farms and factories when the state stays out?'
    why:
      A: 'Ownership by local communities is communal, not capitalist.'
      C: 'Government ownership marks a socialist, centrally planned economy.'
      D: 'Foreign ownership is not what defines capitalism; owners are private individuals, local or foreign.'

  6:
    answer: B
    steps:
      - 'This is rural-urban migration: people moving from villages to towns.'
      - 'People leave rural areas mainly to look for paid jobs and better amenities, which are found in towns.'
      - 'If industries are set up in rural areas, jobs and incomes come to the villages. People no longer need to move to the towns to find work, so the flow from village to town falls.'
      - 'A cassava-processing factory in a village near Ogoja gives young people jobs at home, so fewer of them leave for Calabar or Lagos.'
      - 'Remember: bring the jobs to the village and the village stays.'
      - 'The trap is A, urban-rural migration. That is movement from town to village, and rural industries would if anything encourage it, not reduce it.'
    hint: 'Why do young people leave the village in the first place?'
    why:
      A: 'Urban-rural migration is movement to the villages; rural industries would encourage it, not reduce it.'
      C: 'Movement from one village to another is not the problem rural industries are meant to solve.'
      D: 'Movement between towns is not reduced by building industries in villages.'

  7:
    answer: D
    steps:
      - 'This is the principle of comparative cost advantage.'
      - 'It says a country should specialise in the goods it can produce at a lower opportunity cost than other countries, and trade for the rest.'
      - 'When each country specialises where its opportunity cost is lowest, total world output rises, and trade lets every country enjoy more than it could produce alone. International trade is this principle in action.'
      - 'Nigeria exports crude oil and cocoa, which it produces cheaply, and imports machines that other countries make at lower cost.'
      - 'Remember: do what you give up least to do, and trade for the rest.'
      - 'The trap is B, mass production. Mass production is about large-scale output inside a firm, not the reason countries trade.'
    hint: 'Which principle explains why countries specialise and trade?'
    why:
      A: 'Industrial production is a kind of production, not the principle behind trade.'
      B: 'Mass production is large-scale output in a firm, not the basis of trade.'
      C: 'Regional production describes where goods are made, not why countries trade.'

  8:
    answer: B
    steps:
      - 'This is the working population, also called the labour force.'
      - 'The working population is the number of people of working age who are able and willing to work, whether they have jobs or are looking for jobs.'
      - 'It leaves out children, the aged and people who choose not to work. Those counted are both qualified and offering themselves for employment.'
      - 'A graduate in Enugu who is job-hunting is part of the working population; her retired grandfather is not.'
      - 'Remember: able, willing and offering, that is the working population.'
      - 'The trap is D, mobility of labour. Mobility is how easily workers move between jobs or places, not how many workers there are.'
    hint: 'What do we call all the people who are able and willing to work?'
    why:
      A: 'Migrant labour is workers who move from place to place for work.'
      C: 'Labour turnover is the rate at which workers leave a firm and are replaced.'
      D: 'Mobility of labour is the ease with which workers change jobs or places.'

  9:
    answer: A
    steps:
      - 'This is the localization of industry: many firms in the same industry gathered in one area.'
      - 'Localization brings external economies of scale, savings every firm in the area enjoys because the industry is concentrated there.'
      - 'One such economy is the growth of subsidiary firms, smaller firms that supply parts, repair machines or use the by-products of the main industry. The main firms get supplies and services close by and cheaply.'
      - 'Around the textile mills of Kano grew dyers, spare-parts dealers and transport firms that served the mills.'
      - 'Remember: where one industry gathers, helpers grow around it.'
      - 'The trap is D, attraction of foreign capital. Foreign capital may come, but it is not a standard advantage of localization; subsidiary firms are.'
    hint: 'When many firms gather in one place, what kinds of smaller firms spring up around them?'
    why:
      B: 'Parallel markets arise from price controls and shortages, not from localization.'
      C: 'Slums are a disadvantage of localization, caused by crowding.'
      D: 'Foreign capital is not a standard advantage of localization.'

  10:
    answer: C
    steps:
      - 'This is ECOWAS, the Economic Community of West African States, set up in 1975 to promote economic integration in West Africa.'
      - 'Its progress has been slowed by several problems, and the main one in the textbooks is political instability in member states.'
      - 'Coups, civil wars and frequent changes of government interrupt the meetings, payments and agreements that integration needs. A country at war cannot open its borders or pay its dues.'
      - 'The civil wars in Liberia and Sierra Leone in the 1990s forced ECOWAS to spend its efforts on peacekeeping through ECOMOG instead of trade.'
      - 'Remember: no peace, no progress.'
      - 'The trap is D, inadequate international support. ECOWAS is a regional body run by its members; its main problems come from within.'
    hint: 'What kept many West African countries from working steadily together?'
    why:
      A: 'Multinationals are not named in the textbooks as the main brake on ECOWAS.'
      B: 'Staffing at the secretariat is a minor problem compared with political instability.'
      D: 'ECOWAS depends on its own members, so its main problems are within the region, not a lack of outside support.'

  11:
    answer: C
    steps:
      - 'This is a joint venture.'
      - 'A joint venture is a business owned and run jointly by the government and private investors, who share the capital, the control and the profit.'
      - 'Government brings licences, land or the resource; private investors bring capital, technology and management. Each owns an agreed share.'
      - 'In Nigeria''s oil industry, NNPC holds about 55 to 60 per cent of joint ventures with private oil companies such as Shell, which hold the rest.'
      - 'Remember: joint venture means government and private partners together.'
      - 'The trap is D, multinationals and individuals. A multinational can be one partner, but the defining mix is government with private investors.'
    hint: 'Whose money and control come together in a joint venture?'
    why:
      A: 'A joint venture is not defined by the wealth of its partners.'
      B: 'Employers and workers bargain over wages; they do not form joint ventures.'
      D: 'Multinationals may take part, but the joint venture is defined by government and private ownership together.'

  12:
    answer: A
    steps:
      - 'This is the co-operative society, and in particular the consumer co-operative.'
      - 'A consumer co-operative is formed by people who buy its goods. They contribute the capital, own the society and are its main customers.'
      - 'Members buy goods in bulk at wholesale prices, sell them to themselves at fair prices, and share any surplus as a dividend on what they bought.'
      - 'Staff of a university in Ibadan run a consumer co-operative shop where the members are also the buyers of the rice and beans it sells.'
      - 'Remember: in a co-operative the owners and the customers are the same people.'
      - 'The trap is D, public corporations. They are owned by government on behalf of the public, not by their customers.'
    hint: 'In which business do people come together to buy what they themselves need?'
    why:
      B: 'Shareholders of a company are owners, but most of its customers are not shareholders.'
      C: 'Partners own a partnership, but they sell to outside customers.'
      D: 'A public corporation is owned by government, not by its customers.'

  13:
    answer: C
    steps:
      - 'This is the commodity terms of trade.'
      - 'The terms of trade measure the rate at which a country''s exports exchange for its imports, and are worked out as an index: $\text{TOT} = \dfrac{\text{index of export prices}}{\text{index of import prices}} \times 100$.'
      - 'If export prices rise faster than import prices, the index goes above 100 and the terms of trade are favourable: each unit of exports buys more imports. Below 100 they are unfavourable.'
      - 'If the price of Nigerian crude oil rises while the price of imported machines stays the same, the index rises and each barrel buys more machines.'
      - 'Remember: export prices on top, import prices below, times 100.'
      - 'The trap is A, volume of trade. The formula uses prices, not quantities, so it cannot measure volume.'
    hint: 'The formula divides export prices by import prices. What does that ratio tell a country?'
    why:
      A: 'Volume of trade is measured with quantities, not price indices.'
      B: 'The direction of trade is about which countries a nation trades with.'
      D: 'The volume of imports is a quantity, not a ratio of prices.'

  14:
    answer: D
    steps:
      - 'This is specialization by absolute and comparative advantage.'
      - 'A country should specialise in the good it produces more of with the same resources, or at a lower opportunity cost, and trade for the other.'
      - 'Coffee: Ghana 8 tonnes, Sierra Leone 2 tonnes, so Ghana has the advantage. Cocoa: Sierra Leone 9 tonnes, Ghana 7 tonnes, so Sierra Leone has the advantage.'
      - 'Check with opportunity cost: one tonne of coffee costs Ghana $\dfrac{7}{8}$ tonne of cocoa but costs Sierra Leone $\dfrac{9}{2} = 4.5$ tonnes. Coffee is cheaper for Ghana, so cocoa is cheaper for Sierra Leone. Both tests give Ghana coffee and Sierra Leone cocoa.'
      - 'In the same way Nigeria and Ghana each do better selling what they make most cheaply and buying the rest from each other.'
      - 'The trap is B, Ghana producing cocoa only. Ghana makes 7 tonnes of cocoa against Sierra Leone''s 9, so cocoa is where Ghana is weaker.'
    hint: 'For each product, which country produces more with the same resources?'
    why:
      A: 'If Ghana produced both goods there would be no specialization and no gain from trade.'
      B: 'Ghana produces less cocoa than Sierra Leone, so cocoa is not its advantage.'
      C: 'Sierra Leone has the advantage in cocoa, so it should produce cocoa.'

  15:
    answer: D
    steps:
      - 'This is an invisible item in the balance of payments.'
      - 'Visible items are physical goods that can be seen and touched as they cross the border. Invisible items are services, such as banking, insurance, shipping and tourism.'
      - 'Banking services are sold across borders without any good being shipped, so they are an invisible item.'
      - 'When a Nigerian importer pays a London bank for a letter of credit, Nigeria imports a banking service, an invisible import.'
      - 'Remember: if you can load it on a ship it is visible; if it is a service it is invisible.'
      - 'The trap is A, petroleum products. Petrol and diesel are physical goods shipped in tankers, so they are visible.'
    hint: 'Which of these is a service and not a good?'
    why:
      A: 'Petroleum products are physical goods, so they are visible items.'
      B: 'Processed rice is a physical good, a visible item.'
      C: 'Processed milk is a physical good, a visible item.'

  16:
    answer: D
    steps:
      - 'This is OPEC, the oil exporters'' organisation.'
      - 'OPEC stands for the Organization of the Petroleum Exporting Countries. It was founded in Baghdad in 1960 and has its headquarters in Vienna.'
      - 'Its members agree production quotas so as to keep oil prices stable and earn fair revenue from their oil.'
      - 'Nigeria joined OPEC in 1971, and its crude output is limited by the quota OPEC sets.'
      - 'Remember: O for Organization, P for Petroleum, E for Exporting, C for Countries.'
      - 'The trap is C, Petrol. OPEC is about petroleum, the crude oil, not petrol, which is one refined product.'
    hint: 'Spell it out: what does the O stand for, and is the P petrol or petroleum?'
    why:
      A: 'The O stands for Organization, not Oil.'
      B: 'The O stands for Organization, not Original.'
      C: 'The P stands for Petroleum, not Petrol.'

  17:
    answer: D
    steps:
      - 'This is the subject matter of economics.'
      - 'Economics studies how people allocate scarce resources among competing uses to satisfy their wants as well as possible.'
      - 'Wants are unlimited but resources are scarce, so choices must be made. The economist''s concern is to allocate the resources so that as many wants as possible are met.'
      - 'A family in Aba with ₦50,000 a month must decide how much goes to food, rent and school fees. That allocation is economics in miniature.'
      - 'Remember: scarce means, many wants, so allocate.'
      - 'The trap is C, satisfy all human wants. Because resources are scarce, all wants can never be satisfied.'
    hint: 'If resources are scarce, can all wants be met?'
    why:
      A: 'Controlling population is a policy aim, not the main concern of economics.'
      B: 'Redistribution of income is one policy question, not the core concern.'
      C: 'All wants can never be satisfied because resources are scarce.'

  18:
    answer: B
    steps:
      - 'These are the factors of production.'
      - 'The resources used to produce goods and services are called factors of production: land, labour, capital and the entrepreneur.'
      - 'Nothing can be produced without combining them. Each factor is paid a reward for its part in production.'
      - 'A bakery in Jos uses land for its shop, labour of its bakers, capital in its ovens and the entrepreneur who organises them all.'
      - 'Remember: L, L, C, E, Land, Labour, Capital, Entrepreneur.'
      - 'The trap is D, labour and material resources. Those are only parts of the list; the general name is factors of production.'
    hint: 'What is the general name for land, labour, capital and the entrepreneur?'
    why:
      A: 'Principles of production are rules, not resources.'
      C: 'Items of production is not the term economists use.'
      D: 'Labour and materials are only some of the resources, not their general name.'

  19:
    answer: B
    steps:
      - 'This is scarcity, the basic economic problem.'
      - 'Scarcity means the resources available are limited compared with human wants.'
      - 'Because resources are scarce, people and nations must choose which wants to satisfy and how to use what they have. Economics exists to study those choices; without scarcity there would be nothing to choose.'
      - 'There is only so much land in Lagos, so the state must choose between using a plot for houses, a market or a road.'
      - 'Remember: no scarcity, no economics.'
      - 'The trap is C, opportunity cost. Opportunity cost arises because of scarcity; it is a result of the problem, not its cause.'
    hint: 'What single problem forces every choice in economics?'
    why:
      A: 'A small population would still face scarcity; the size of population is not the reason.'
      C: 'Opportunity cost is a result of scarcity, not the reason economics is needed.'
      D: 'Satisfying every desire is impossible; that is exactly why choices must be studied.'

  20:
    answer: B
    steps:
      - 'This is complementary demand, also called joint demand.'
      - 'Goods are complements when they are used together to satisfy one want, so the demand for one goes with the demand for the other.'
      - 'A torchlight is useless without batteries. If the price of torchlights falls, more are bought, so the demand for batteries rises too.'
      - 'During NEPA blackouts in Ibadan, shops sell more torchlights and, with them, more batteries.'
      - 'Remember: complements complete each other.'
      - 'The trap is A, competitive demand. Competitive goods are substitutes, used instead of each other, like tea and coffee.'
    hint: 'Is a torchlight used instead of a battery, or together with it?'
    why:
      A: 'Competitive demand is for substitutes, goods used in place of each other.'
      C: 'Composite demand is for one good wanted for several uses, like sugar for tea and for baking.'
      D: 'Independent demand is for goods not related to each other.'

  21:
    answer: D
    steps:
      - 'This is population density.'
      - 'Population density is the number of people per unit of land: $\text{density} = \dfrac{\text{population}}{\text{land area}}$.'
      - 'Data: population = 100 million = 100,000,000; land area = 50 km². Working: $\dfrac{100{,}000{,}000}{50} = 2{,}000{,}000$, which is 2 million people per square kilometre. Check: 2 million × 50 = 100 million.'
      - 'Lagos State, with a little over 3,500 km² of land and many millions of people, is Nigeria''s most densely populated state for the same reason: many people on little land.'
      - 'Remember: people on top, land below.'
      - 'The trap is C, 0.5 million. It comes from dividing the land by the population, 50 ÷ 100, the wrong way up.'
    hint: 'Density is people per square kilometre. Which number goes on top?'
    why:
      A: '50,000 is far too small; 100 million shared over 50 km² gives 2 million each.'
      B: '0.2 million comes from dividing 10 by 50, which drops a zero from the population.'
      C: '0.5 million comes from dividing the land by the population, the wrong way up.'

  22:
    answer: C
    steps:
      - 'This is the arithmetic mean of a frequency distribution.'
      - 'For grouped values, $\bar{x} = \dfrac{\sum fx}{\sum f}$: multiply each value by its frequency, add, and divide by the total frequency.'
      - 'Working: $fx$ is $2 \times 2 = 4$, $3 \times 5 = 15$, $4 \times 2 = 8$ and $5 \times 1 = 5$, so $\sum fx = 32$. $\sum f = 2 + 5 + 2 + 1 = 10$. Then $\bar{x} = \dfrac{32}{10} = 3.2$. Check: 3.2 lies between the smallest value 2 and the largest 5, and close to 3, the most common value.'
      - 'A mama put seller who counts how many plates each customer buys in a day finds the average plates per customer this same way.'
      - 'Remember: multiply, add, divide by the total frequency.'
      - 'The trap is B, 2.5. That is $\dfrac{10}{4}$, the total frequency divided by the number of values, which ignores the values themselves.'
    hint: 'Find the sum of f times x first, then divide by the sum of f.'
    why:
      A: '2.2 does not come from Σfx ÷ Σf; the correct sum of fx is 32.'
      B: '2.5 divides the total frequency 10 by the number of values 4, ignoring the values.'
      D: '4.5 is not the mean; it is close to the largest values only.'

  23:
    answer: C
    steps:
      - 'This is the median of a frequency distribution.'
      - 'The median is the middle value when all the values are put in order. For $n$ values its position is $\dfrac{n+1}{2}$; when $n$ is even, it is the average of the two middle values.'
      - 'Here $n = 10$, so the median lies between the 5th and 6th values. Cumulative frequencies: value 2 covers the 1st and 2nd, value 3 covers the 3rd to the 7th, value 4 the 8th and 9th, value 5 the 10th.'
      - 'The 5th and 6th values are both 3, so the median is $\dfrac{3 + 3}{2} = 3$. Check: there are 2 values below 3 and 3 values above it, with 3 in the middle.'
      - 'Line up ten students outside a Kaduna classroom by their scores; the median is the score of the students standing in the middle of the line.'
      - 'The trap is B, 4. Four sits in the middle of the list of values 2, 3, 4, 5, but the median must count each value as often as it occurs.'
    hint: 'Write the ten values out in order. Which values are in the 5th and 6th places?'
    why:
      A: '5 is the largest value, not the middle one.'
      B: '4 is the middle of the list of different values, which ignores the frequencies.'
      D: '2 is the smallest value, not the middle one.'

  24:
    answer: D
    steps:
      - 'This is the basic economic problem of unlimited wants and scarce means.'
      - 'Human wants are unlimited: as soon as one want is met, another appears. The means to satisfy them, the resources, are limited.'
      - 'Because the means can never catch up with the wants, wants can never all be satisfied. That is what insatiable means.'
      - 'A student who buys a phone soon wants a better one, then data, then a laptop; her allowance never covers them all.'
      - 'Remember: wants go on and on, means run out.'
      - 'The trap is B. If means were also unlimited, every want could be met and there would be no economic problem.'
    hint: 'Are wants limited or unlimited? Are means plentiful or scarce?'
    why:
      A: 'Wants are unlimited, not limited.'
      B: 'Means are scarce; if they were unlimited every want could be met.'
      C: 'Wants are unlimited, so they cannot be limited.'

  25:
    answer: A
    steps:
      - 'This is reading a pie chart, where each sector''s angle is its share of 360°.'
      - 'The rule: $\text{amount} = \dfrac{\text{angle}}{360^\circ} \times \text{total}$.'
      - 'Look at the chart: Education has 120°. Check the angles total 360°: 100 + 60 + 80 + 120 = 360.'
      - 'Working: $\dfrac{120}{360} \times 7200 = \dfrac{1}{3} \times 7200 = 2400$. So education gets ₦2,400.00. Check: ₦2,400 is one third of ₦7,200, and 120° is one third of 360°.'
      - 'A state budget shown on the news as a pie chart is read the same way: the bigger the slice, the bigger the share of the naira.'
      - 'The trap is B, ₦2,000. That is the share of Government Administration, 100°, not Education.'
    hint: 'What fraction of 360° is Education''s slice?'
    why:
      B: '₦2,000 is the share of the 100° slice, Government Administration.'
      C: '₦200 is far too small; it is 7,200 ÷ 36, not 120 ÷ 360 of it.'
      D: '₦1,000 does not match any slice; 120° gives one third of ₦7,200.'

  26:
    answer: B
    steps:
      - 'This is a ratio read from a pie chart.'
      - 'In a pie chart each sector''s spending is in proportion to its angle, so the ratio of two amounts equals the ratio of their angles.'
      - 'Look at the chart: Health has 60° and Agriculture has 80°. Ratio = 60 : 80. Divide both by 20: 3 : 4.'
      - 'Check: 60 ÷ 80 = 0.75 and 3 ÷ 4 = 0.75. Health comes first in the question, so it comes first in the ratio.'
      - 'If a government spends ₦3 on clinics for every ₦4 on farm support, the ratio of health to agriculture spending is 3 : 4.'
      - 'The trap is C, 4 : 3. That puts agriculture first, the wrong way round.'
    hint: 'Read the two angles, put health first, then simplify.'
    why:
      A: '2 : 3 would need angles such as 60° and 90°; agriculture has 80°.'
      C: '4 : 3 puts agriculture first; the question asks health to agriculture.'
      D: '5 : 4 does not come from 60° and 80°.'

  27:
    answer: D
    steps:
      - 'This is circulating capital, as against fixed capital.'
      - 'Circulating, or working, capital is used up in one round of production, or changes form as it is used: raw materials, fuel, money for wages. Fixed capital is used again and again over many years: machines, buildings, vehicles.'
      - 'Raw materials become the product, fuel is burnt, and money is spent and comes back as sales. A machine stays and works for years, so it is fixed capital.'
      - 'In a bread factory in Onitsha the flour and diesel are used up every day, but the oven stays for years.'
      - 'Remember: circulating capital goes round and is used up; fixed capital stays put.'
      - 'The trap is B, money. Money used to buy materials and pay wages is spent and returns as sales, so it is circulating capital.'
    hint: 'Which item is used again and again for years, not used up in one round?'
    why:
      A: 'Raw materials are used up in production, so they are circulating capital.'
      B: 'Money for running costs goes round and returns as sales, so it is circulating capital.'
      C: 'Fuel is burnt up in production, so it is circulating capital.'

  28:
    answer: A
    steps:
      - 'This is the theory of comparative cost advantage.'
      - 'It says countries gain from trade by specialising in the goods they produce at a lower opportunity cost, even if one country is better at producing everything.'
      - 'David Ricardo set out the theory in 1817 in his book The Principles of Political Economy and Taxation, using the example of England and Portugal trading cloth and wine.'
      - 'The theory explains why Nigeria gains from exporting oil and cocoa and importing machines.'
      - 'Remember: Ricardo, Comparative, the two R and C names that go together.'
      - 'The trap is D, Adam Smith. Smith gave the earlier theory of absolute advantage; Ricardo built comparative advantage on it.'
    hint: 'Who used England, Portugal, cloth and wine to explain comparative cost?'
    why:
      B: 'Alfred Marshall is known for demand and supply analysis and elasticity.'
      C: 'J. S. Mill developed reciprocal demand, the terms of trade, after Ricardo.'
      D: 'Adam Smith gave absolute advantage, not comparative advantage.'

  29:
    answer: C
    steps:
      - 'This is the terms of trade.'
      - 'The terms of trade are the rate at which a country''s exports exchange for its imports, measured as $\dfrac{\text{index of export prices}}{\text{index of import prices}} \times 100$.'
      - 'If export prices rise compared with import prices, each unit of exports buys more imports: the terms of trade improve. If they fall, they worsen.'
      - 'When crude oil prices fell in 2015, each barrel Nigeria sold bought fewer imported goods, so its terms of trade worsened.'
      - 'Remember: terms of trade means how much you get for what you give.'
      - 'The trap is A, trade balance. The balance of trade is the difference between the value of visible exports and imports, not a rate of exchange.'
    hint: 'Which term is a rate, exports for imports, rather than a difference in value?'
    why:
      A: 'The balance of trade is the value of visible exports minus visible imports, not a rate.'
      B: 'The balance of payments is the full record of a country''s dealings with the rest of the world.'
      D: 'The current account records trade in goods, services and transfers; it is not a rate of exchange.'

