<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300" role="img"
     aria-label="Pie chart of a country's GDP by sector: oil sector 160 degrees, agriculture sector 90 degrees, mining sector 30 degrees, and the manufacturing sector the remaining slice, whose angle is not marked">
  <circle cx="170" cy="150" r="120" fill="#fff" stroke="#1a1a1f" stroke-width="1.8"/>
  <g fill="none" stroke="#1a1a1f" stroke-width="1.6"><path d="M170 150 L278.8 99.3"/><path d="M170 150 L50.5 160.5"/><path d="M170 150 L180.5 269.5"/><path d="M170 150 L238.8 248.3"/></g>
  <g fill="none" stroke="#3f2fa8" stroke-width="1.3"><path d="M184.5 143.2 A16 16 0 0 0 154.1 151.4"/><path d="M148.1 151.9 A22 22 0 0 0 171.9 171.9"/><path d="M172.6 179.9 A30 30 0 0 0 187.2 174.6"/></g>
  <text x="151.4" y="84.5" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1a1a1f" text-anchor="middle">Oil sector</text><text x="121.8" y="211.5" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1f" text-anchor="middle">Agriculture</text><text x="199.1" y="233.9" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1f" text-anchor="middle">Mining</text><text x="245.3" y="174.2" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1f" text-anchor="middle" transform="rotate(-75 245.3 170.2)">Manufacturing</text><text x="162.2" y="125.0" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#1a1a1f" text-anchor="middle">160°</text><text x="146.9" y="181.6" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#1a1a1f" text-anchor="middle">90°</text><text x="185.0" y="195.3" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="middle">30°</text>
</svg>
