<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" width="400" height="310" role="img"
     aria-label="Labour market diagram. Wage rate on the vertical axis, quantity of labour on the horizontal axis. The demand for labour curve D D slopes down and the supply of labour curve S S slopes up; they cross at E, the equilibrium wage. A dashed horizontal line marks the minimum wage O W, set above the equilibrium wage. At W it meets D D on the left and S S further to the right.">
  <g fill="none" stroke="#1a1a1f" stroke-width="1.6">
    <path d="M60 260 V20"/><path d="M56 28 L60 20 L64 28"/>
    <path d="M60 260 H380"/><path d="M372 256 L380 260 L372 264"/>
  </g>
  <path d="M73.0 48.8 L346.0 233.6" stroke="#1a1a1f" stroke-width="2" fill="none"/>
  <path d="M73.0 230.3 L346.0 68.6" stroke="#1a1a1f" stroke-width="2" fill="none"/>
  <path d="M60 145.6 H216.0" stroke="#1a1a1f" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
  <path d="M60 92.8 H360" stroke="#3f2fa8" stroke-width="2" stroke-dasharray="7 5" fill="none"/>
  <g fill="#1a1a1f"><circle cx="216.0" cy="145.6" r="3.4"/></g>
  <g fill="#3f2fa8"><circle cx="138.0" cy="92.8" r="3.4"/><circle cx="305.1" cy="92.8" r="3.4"/></g>
  <g font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">
    <text x="79.0" y="44.8">D</text><text x="352.0" y="237.6">D</text>
    <text x="69.0" y="248.3">S</text><text x="352.0" y="72.6">S</text>
    <text x="212.0" y="165.6">E</text>
  </g>
  <text x="40" y="97.8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#3f2fa8">W</text>
  <text x="165" y="84.8" font-family="system-ui, sans-serif" font-size="11" fill="#3f2fa8">minimum wage</text>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#1a1a1f">
    <text x="42" y="276">O</text>
    <text x="370" y="282" text-anchor="end">Quantity of labour</text>
    <text x="48" y="14">Wage rate</text>
  </g>
</svg>
