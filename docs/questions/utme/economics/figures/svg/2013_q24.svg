<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img"
     aria-label="Cost and revenue curves of a monopolist. The demand curve D, which is average revenue, and the marginal revenue curve MR slope down from the same point on the vertical axis, MR twice as steeply. The U-shaped marginal cost curve MC cuts MR at point C above output B, and passes through the lowest point of the U-shaped average cost curve AC above output S, to the right of B. A vertical line at B meets the demand curve at G, AC at F and MR and MC at C. Dashed lines join G to H, F to E and C to J on the vertical axis, with H highest and J lowest">
