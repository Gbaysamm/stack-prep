<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="400" height="340" role="img" aria-label="Pie chart of the contributions of the four factors of production. Labour has a sector of 110 degrees at the top, land 70 degrees on the right, capital 60 degrees at the bottom right and entrepreneur 120 degrees on the left. The four angles add up to 360 degrees.">
  <rect width="400" height="340" fill="#fff"/>
  <circle cx="200" cy="170" r="135" stroke="#1a1a1f" stroke-width="1.8" fill="none"/>
  <path d="M200 170 L89.4 92.6" stroke="#1a1a1f" stroke-width="1.6"/>
  <path d="M200 170 L310.6 92.6" stroke="#1a1a1f" stroke-width="1.6"/>
  <path d="M200 170 L310.6 247.4" stroke="#1a1a1f" stroke-width="1.6"/>
  <path d="M200 170 L188.2 304.5" stroke="#1a1a1f" stroke-width="1.6"/>
  <text x="200.0" y="91.3" font-family="system-ui, sans-serif" font-size="14" fill="#1a1a1f" text-anchor="middle">Labour</text>
  <text x="200.0" y="138.6" font-family="system-ui, sans-serif" font-size="13" fill="#3f2fa8" text-anchor="middle">110°</text>
  <text x="283.7" y="175.0" font-family="system-ui, sans-serif" font-size="14" fill="#1a1a1f" text-anchor="middle">Land</text>
  <text x="236.4" y="175.0" font-family="system-ui, sans-serif" font-size="13" fill="#3f2fa8" text-anchor="middle">70°</text>
  <text x="235.4" y="250.9" font-family="system-ui, sans-serif" font-size="14" fill="#1a1a1f" text-anchor="middle">Capital</text>
  <text x="215.4" y="208.0" font-family="system-ui, sans-serif" font-size="13" fill="#3f2fa8" text-anchor="middle">60°</text>
  <text x="124.1" y="210.4" font-family="system-ui, sans-serif" font-size="14" fill="#1a1a1f" text-anchor="middle">Entrepreneur</text>
  <text x="167.0" y="190.4" font-family="system-ui, sans-serif" font-size="13" fill="#3f2fa8" text-anchor="middle">120°</text>
</svg>
