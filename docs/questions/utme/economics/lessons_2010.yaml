        write: '$\therefore$ reducing average cost as production increases'
        answer: true
    traps:
      B: 'You went for benefiting from other firms. That describes external economies, not the firm''s own falling cost.'
      C: 'You chose maximizing profits. Profit is maximized where marginal cost equals marginal revenue, which is a different idea.'
