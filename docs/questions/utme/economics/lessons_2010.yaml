# UTME 2010 Economics, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Nigerian Economics teacher works on the
# board: the question, the concept named, the rule or definition, how it works (cause and
# effect, or the calculation with data, formula, working and check), a Nigerian example, a way
# to remember it, and the answer moment that names the option.
#
#   say:     heard, not read. Symbols read as words ("M P C", "sigma f x"), money in words,
#            percentages as "per cent", no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2010.yaml. Answers match that file. Q1, the
# paper type, is not a question, so 49 questions have a lesson.
format_version: 1
exam_year: 2010
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'Economics studies human behaviour. But behaviour about what, exactly? Let us find the heart of the subject.'
        write: 'Economics studies human behaviour as it relates to ?'
      - section: 'Name it'
        say: 'This is the definition of economics, and it is built on two words, scarcity and choice.'
        write: 'Definition of economics: scarcity and choice'
      - section: 'The rule'
        say: 'Our wants have no end, but the resources to satisfy them are limited, and they have other uses.'
        write: 'Unlimited wants, scarce resources with other uses'
      - say: 'So we must choose how to share out what we have. Economics studies how people allocate scarce resources efficiently.'
        write: 'Economics = efficient allocation of scarce resources'
      - section: 'In Nigeria'
        say: 'A family in Kano with fifty thousand naira a month must choose between school fees, food and transport. How they share it is an economic decision.'
        write: '₦50,000: fees? food? transport? Choose.'
      - section: 'Remember'
        say: 'Remember, our means are scarce and our wants are unlimited, so we must choose.'
        write: 'Scarce means + unlimited wants ⇒ choice'
      - section: 'Answer'
        say: 'So economics is about the efficient allocation of resources, which is option A.'
        write: '$\therefore$ efficient allocation of resources'
        answer: true
    traps:
      B: 'You went for production of goods. Production is only one part of economics. Distribution, exchange and consumption are studied too.'
      C: 'You chose the operation of companies. That is business management, a much narrower field than economics.'
      D: 'You picked generation of income. Income is studied, but only as one part of how resources are allocated.'
  3:
    moments:
      - section: 'The question'
        say: 'Share prices on the stock market fall, and nobody ordered them to fall. What does that show us?'
        write: 'Share prices fall by the free play of demand and supply. This shows ?'
      - section: 'Name it'
        say: 'This is the invisible hand, Adam Smith''s name for the price mechanism.'
        write: 'The invisible hand = the price mechanism (Adam Smith)'
      - section: 'The rule'
        say: 'In a free market, no one fixes prices. Prices rise and fall on their own as buyers and sellers each follow their own interest.'
        write: 'Free market: prices set by demand and supply, not by anyone'
      - section: 'How it works'
        say: 'When many investors want to sell shares and few want to buy, supply is greater than demand, so the price falls by itself.'
        write: 'Sellers > buyers ⇒ share price falls'
      - section: 'In Nigeria'
        say: 'In two thousand and eight and two thousand and nine, bank shares on the Nigerian Stock Exchange in Lagos fell sharply as investors rushed to sell. Demand and supply set those prices, not an official.'
        write: 'Lagos, 2008 to 2009: bank shares fall as investors sell'
      - section: 'Remember'
        say: 'Remember, no hand you can see sets the price, so the hand is invisible.'
        write: 'No visible hand sets the price ⇒ invisible hand'
      - section: 'Answer'
        say: 'So the fall in share prices is a highlight of the invisible hand, which is option B.'
        write: '$\therefore$ the invisible hand'
        answer: true
    traps:
      A: 'You went for efficient allocation of resources. That is what the market hopes to achieve, but the price fall shows the mechanism at work, not the result.'
      C: 'You chose government price control. The fall came from the free play of demand and supply, with no government order.'
      D: 'You picked consumer rationality. That is an assumption about buyers, not the force that moves market prices.'
  4:
    moments:
      - section: 'The question'
        say: 'We are told the mean is six and the number of items is six. We must find the total of the values. Can we get it from these two? Yes, in one step.'
        write: '$\bar{x} = 6$, $N = 6$, $\Sigma fx = ?$'
      - section: 'Name it'
        say: 'This is the arithmetic mean of a frequency distribution.'
        write: 'The arithmetic mean'
      - section: 'The rule'
        say: 'Sigma, the Greek letter written like a sideways M, means add up. So sigma f x is the total of all the values, each value x times how often it occurs, f. The mean, x bar, equals sigma f x divided by N, the number of items.'
        write: '$\bar{x} = \dfrac{\Sigma fx}{N}$'
      - section: 'Rearrange'
        say: 'We want sigma f x, so we multiply both sides by N. Sigma f x equals x bar times N.'
        write: '$\Sigma fx = \bar{x} \times N$'
      - section: 'Substitute'
        say: 'Put in six and six. Six times six is thirty six.'
        write: '$\Sigma fx = 6 \times 6 = 36$'
      - section: 'Check'
        say: 'Check. Thirty six divided by six is six, which is the mean we were given. Good.'
        write: '$36 \div 6 = 6$ ✓'
      - section: 'In Nigeria'
        say: 'Six market women sell an average of six tubers of yam each, so together they sold thirty six tubers.'
        write: '6 women × 6 tubers = 36 tubers'
      - section: 'Answer'
        say: 'So sigma f x is thirty six, which is option A.'
        write: '$\therefore \Sigma fx = 36$'
        answer: true
    traps:
      B: 'You went for twelve. That adds six and six. The total is the mean times the number of items, so we multiply.'
      C: 'You chose one. That divides six by six. The total must be bigger than the mean, not smaller.'
      D: 'You picked seventy two. That is double the total. Seventy two divided by six is twelve, not six.'
  5:
    moments:
      - section: 'The question'
        say: 'Standard deviation sounds like an average. Is it? Let us see what it really measures.'
        write: 'The standard deviation of a set of data is ?'
      - section: 'Name it'
        say: 'The standard deviation is a measure of dispersion.'
        write: 'Standard deviation: a measure of dispersion'
      - section: 'The rule'
        say: 'Dispersion means how spread out the values are around the middle.'
        write: 'Dispersion = how spread out the values are'
      - say: 'Now the standard deviation itself. We take each value''s distance from the mean, square it, find the average of those squares, and take the square root. We write it with the small Greek letter sigma.'
        write: '$\sigma = \sqrt{\dfrac{\Sigma f(x - \bar{x})^2}{\Sigma f}}$'
      - section: 'How it works'
        say: 'A small standard deviation means the values sit close to the mean. A large one means they are widely spread.'
        write: 'Small σ ⇒ close together; large σ ⇒ spread out'
      - section: 'In Nigeria'
        say: 'Two markets in Ibadan may have the same mean price for tomatoes, but if prices in one swing much more, that market has the larger standard deviation.'
        write: 'Same mean price, bigger swings ⇒ bigger σ'
      - section: 'Remember'
        say: 'Remember, averages tell you the middle, and deviation tells you the spread.'
        write: 'Average = middle; deviation = spread'
      - section: 'Answer'
        say: 'So the standard deviation is a measure of dispersion, which is option D.'
        write: '$\therefore$ a measure of dispersion'
        answer: true
    traps:
      A: 'You went for measured from the mode. The standard deviation is measured from the mean, not the mode.'
      B: 'You chose the most representative of averages. The standard deviation is not an average at all. It measures spread.'
      C: 'You picked measured from the median. The deviations are taken from the mean, not the median.'
  6:
    moments:
      - section: 'The question'
        say: 'Why is the mean called the best measure of central tendency? One of these reasons is true, and one belongs to a different average.'
        write: 'The mean is the best average because ?'
      - section: 'Name it'
        say: 'This is the arithmetic mean.'
        write: 'The arithmetic mean'
      - section: 'The rule'
        say: 'We find the mean by adding every value and dividing by the number of values. So it uses all the data.'
        write: '$\bar{x} = \dfrac{\Sigma x}{n}$, every value used'
      - section: 'How it works'
        say: 'Because it uses every value, the mean is the balancing point. The distances above it exactly balance the distances below it.'
        write: 'Distances above $\bar{x}$ = distances below $\bar{x}$'
      - say: 'Take forty, fifty and sixty. The mean is fifty. Ten above balances ten below.'
        write: '40, 50, 60: mean 50, +10 balances −10'
      - section: 'Remember'
        say: 'Remember, the mean is the pivot of a seesaw, and the median is just the middle seat.'
        write: 'Mean = pivot of the seesaw; median = middle seat'
      - section: 'Answer'
        say: 'So the mean is the best measure because it is the balancing point of the data, which is option C.'
        write: '$\therefore$ the balancing point of a set of data'
        answer: true
    traps:
      A: 'You went for not affected by extreme values. It is the opposite. The mean is pulled by very large or very small values.'
      B: 'You chose the midpoint of an array. The middle value of ordered data is the median, not the mean.'
      D: 'You picked calculated from incomplete data. The mean needs every value, so it cannot be found if some are missing.'
  7:
    moments:
      - section: 'The question'
        say: 'Shops stock more of some shoe sizes than others. Which average tells them the most popular size?'
        write: 'The most popular sizes of dresses and shoes are found by ?'
      - section: 'Name it'
        say: 'This is the mode.'
        write: 'The mode'
      - section: 'The rule'
        say: 'The mode is the value that occurs most often in a set of data.'
        write: 'Mode = the most frequent value'
      - section: 'How it works'
        say: 'A size is popular because it is bought more often than any other. So the most popular size is the most frequent size, which is the mode.'
        write: 'Most popular = bought most often = mode'
      - section: 'In Nigeria'
        say: 'A shoe seller at Balogun market sees that size forty two sells most often, so she orders more of it than any other size.'
        write: 'Balogun: size 42 sells most ⇒ mode = 42'
      - section: 'Remember'
        say: 'Remember, mode and most both begin with m o. The mode is the most often.'
        write: 'MOde = MOst often'
      - section: 'Answer'
        say: 'So the most popular sizes are found by the mode, which is option C.'
        write: '$\therefore$ mode'
        answer: true
    traps:
      A: 'You went for the range. The range measures how spread out the sizes are, not which size is most popular.'
      B: 'You chose the mean. The mean size could be forty one point six, a size nobody can buy.'
      D: 'You picked the median. The median is the middle size, not the size bought most often.'
  8:
    moments:
      - section: 'The question'
        say: 'Government puts a tax on a good. Buyers can easily switch away, but sellers cannot. Who ends up paying more of the tax?'
        write: 'Demand more elastic than supply. Who bears more of a tax?'
      - section: 'Name it'
        say: 'This is tax incidence, which means who really bears the burden of a tax.'
        write: 'Tax incidence = who bears the burden'
      - section: 'The rule'
        say: 'The rule is this. The side of the market that is less elastic bears more of the tax.'
        write: 'The less elastic side bears more of the tax'
      - section: 'How it works'
        say: 'Here demand is more elastic, so buyers cut back or switch when the price rises. The seller cannot pass much of the tax on.'
        write: 'Elastic demand ⇒ seller cannot raise price much'
      - say: 'Supply is the less elastic side, so producers absorb most of the tax.'
        write: 'Supply less elastic ⇒ producers bear more'
      - section: 'In Nigeria'
        say: 'If one brand of bottled water is taxed and buyers simply switch to sachet water, the producer must swallow most of the tax to keep customers.'
        write: 'Taxed bottled water, buyers switch to sachet ⇒ producer pays'
      - section: 'Remember'
        say: 'Remember, the one who cannot run away pays the tax.'
        write: 'Who cannot escape, pays'
      - section: 'Answer'
        say: 'So the tax burden is borne more by producers, which is option B.'
        write: '$\therefore$ more by producers'
        answer: true
    traps:
      A: 'You went for equally. The burden is shared equally only when demand and supply are equally elastic.'
      C: 'You chose more by consumers. That happens when demand is the less elastic side. Here demand is the more elastic one.'
      D: 'You picked retailers and producers. The split is between the two sides of the market, consumers and producers.'
  9:
    moments:
      - section: 'The question'
        say: 'A seller with elastic demand raises his price. Does he earn more or less? Many students say more, and that is the trap.'
        write: 'Elastic demand, price rises. Total revenue ?'
      - section: 'Name it'
        say: 'This is the link between price elasticity of demand and total revenue.'
        write: 'Elasticity of demand and total revenue'
      - section: 'The rule'
        say: 'Total revenue is price times quantity. Demand is elastic when quantity changes by a bigger percentage than price.'
        write: '$TR = P \times Q$; elastic ⇒ $\%\,\Delta Q > \%\,\Delta P$'
      - section: 'Worked example'
        say: 'Say the price goes from one hundred naira to one hundred and ten, up ten per cent. Quantity falls from one hundred to eighty, down twenty per cent.'
        write: '$P$: ₦100 → ₦110 (+10%), $Q$: 100 → 80 (−20%)'
      - say: 'Before the rise, revenue is one hundred naira times one hundred, which is ten thousand naira.'
        write: 'Before: $100 \times 100 =$ ₦10,000'
      - say: 'After the rise, revenue is one hundred and ten naira times eighty, which is eight thousand eight hundred naira. So revenue has fallen, because quantity fell by a bigger percentage than price rose.'
        write: 'After: $110 \times 80 =$ ₦8,800, so $TR$ falls'
      - section: 'In Nigeria'
        say: 'If one suya seller raises his price while the others nearby do not, his customers walk to the next stand and his takings fall.'
        write: 'Suya seller raises price, customers leave ⇒ $TR$ falls'
      - section: 'Remember'
        say: 'Remember, with elastic demand, price and revenue move in opposite directions.'
        write: 'Elastic: $P \uparrow \Rightarrow TR \downarrow$'
      - section: 'Answer'
        say: 'So the producer''s revenue will decrease, which is option D.'
        write: '$\therefore$ revenue decreases'
        answer: true
    traps:
      A: 'You went for double. Nothing about elastic demand doubles revenue. The quantity lost outweighs the higher price.'
      B: 'You chose increase. Revenue rises with a price increase only when demand is inelastic.'
      C: 'You picked constant. Revenue stays the same only when demand is unitary elastic.'
  10:
    moments:
      - section: 'The question'
        say: 'Buyers want more beans than sellers are offering. What causes that shortage?'
        write: 'Excess demand for beans results from ?'
      - section: 'Name it'
        say: 'This is excess demand, which is a shortage.'
        write: 'Excess demand = shortage'
      - section: 'The rule'
        say: 'Excess demand exists when quantity demanded is greater than quantity supplied at the ruling price.'
        write: 'Excess demand: $Q_d > Q_s$ at the ruling price'
      - section: 'How it works'
        say: 'If the price of beans falls below the equilibrium price, more people want to buy, and sellers offer less.'
        write: '$P$ below equilibrium ⇒ $Q_d \uparrow$, $Q_s \downarrow$'
      - say: 'So quantity demanded is greater than quantity supplied, and there is excess demand.'
        write: '$Q_d > Q_s$ ⇒ excess demand'
      - section: 'In Nigeria'
        say: 'If the price of a mudu of beans in Kaduna were fixed far below the market price, buyers would queue and many would go home with nothing.'
        write: 'Price fixed too low ⇒ queues, empty sacks'
      - section: 'Remember'
        say: 'Remember, when the price is too low, the shelves go empty.'
        write: 'Price too low ⇒ shortage'
      - section: 'Answer'
        say: 'So excess demand results from a decrease in the price of beans, which is option B.'
        write: '$\therefore$ a decrease in the price of beans'
        answer: true
    traps:
      A: 'You went for a price increase. A price above equilibrium gives the opposite, an excess supply.'
      C: 'You chose an increase in supply. More beans at the same price reduces a shortage. It does not create one.'
      D: 'You picked a decrease in demand. Fewer buyers at the same price leaves beans unsold, which is excess supply.'
  11:
    moments:
      - section: 'The question'
        say: 'When do buyers get the biggest bargain at the market price? It depends on how badly they need the good.'
        write: 'Consumer surplus is higher when demand is ?'
      - section: 'Name it'
        say: 'This is consumer surplus.'
        write: 'Consumer surplus'
      - section: 'The rule'
        say: 'Consumer surplus is the difference between what a buyer is willing to pay and what he actually pays.'
        write: 'Surplus = willing to pay − actually paid'
      - section: 'How it works'
        say: 'With inelastic demand the demand curve is steep. Buyers would pay far more than the market price rather than go without, so the surplus is large.'
        write: 'Inelastic, steep curve ⇒ big gap above price'
      - say: 'With perfectly elastic demand the curve is flat at the price, so there is no surplus at all.'
        write: 'Perfectly elastic, flat curve ⇒ no surplus'
      - section: 'In Nigeria'
        say: 'A diabetic would pay much more than the pharmacy price for insulin, so he enjoys a big consumer surplus on it.'
        write: 'Insulin: willing to pay ≫ price ⇒ big surplus'
      - section: 'Remember'
        say: 'Remember, the more you need it, the bigger the bargain at the ruling price.'
        write: 'More need ⇒ bigger surplus'
      - section: 'Answer'
        say: 'So consumer surplus tends to be higher when demand is inelastic, which is option A.'
        write: '$\therefore$ inelastic'
        answer: true
    traps:
      B: 'You went for perfectly elastic. Then the demand curve lies flat at the price, and the surplus is zero.'
      C: 'You chose elastic. Buyers then value the good close to its price, so their surplus is small.'
      D: 'You picked unitarily elastic. That gives a middling surplus, not a high one.'
  12:
    moments:
      - section: 'The question'
        say: 'Two theories of utility disagree on one thing. Can satisfaction be measured, or only ranked?'
        write: 'An assumption of ordinal utility theory is ?'
      - section: 'Name it'
        say: 'This is the ordinal utility approach, the theory behind indifference curves.'
        write: 'Ordinal utility (indifference curve) theory'
      - section: 'The rule'
        say: 'Ordinal theory says satisfaction cannot be measured in numbers, but a consumer can rank bundles in order, first, second and third.'
        write: 'Utility ranked, not measured'
      - section: 'How it works'
        say: 'It also assumes choices are consistent. If A is preferred to B, and B to C, then A is preferred to C. On the board, this curved sign means is preferred to.'
        write: 'A ≻ B and B ≻ C ⇒ A ≻ C'
      - section: 'In Nigeria'
        say: 'A student cannot say jollof rice gives her twenty units of satisfaction. But she can say she prefers jollof to amala, and amala to eba.'
        write: 'Jollof ≻ amala ≻ eba'
      - section: 'Remember'
        say: 'Remember, ordinal is about order, like the ordinal numbers first, second, third.'
        write: 'Ordinal = order (1st, 2nd, 3rd)'
      - section: 'Answer'
        say: 'So an assumption of ordinal utility theory is that utility can be ranked, which is option B.'
        write: '$\therefore$ utility can be ranked'
        answer: true
    traps:
      A: 'You went for choice is not consistent. Ordinal theory assumes the opposite, that choices are consistent.'
      C: 'You chose total utility is a function of price. Utility depends on the quantity consumed, not on the price.'
      D: 'You picked satisfaction is measurable. That is the cardinal theory, the one ordinal theory replaced.'
  13:
    moments:
      - section: 'The question'
        say: 'Why does a demand curve slope down from left to right? A law about satisfaction explains it.'
        write: 'The law of diminishing marginal utility explains ?'
      - section: 'Name it'
        say: 'This is the law of diminishing marginal utility.'
        write: 'Law of diminishing marginal utility'
      - section: 'The rule'
        say: 'As a consumer takes more units of a good, the extra satisfaction from each additional unit falls.'
        write: 'More units ⇒ less extra satisfaction (MU falls)'
      - section: 'How it works'
        say: 'Because each extra unit is worth less to him, he will buy more only if the price falls.'
        write: 'Lower MU ⇒ buys more only at a lower price'
      - say: 'So quantity demanded rises as price falls, and the normal demand curve has a negative slope.'
        write: '$P \downarrow \Rightarrow Q_d \uparrow$ ⇒ slope negative'
      - section: 'In Nigeria'
        say: 'On a hot afternoon in Maiduguri, the first sachet of cold water is worth a lot. The fourth is worth little, so you buy it only if it is cheap.'
        write: '1st sachet: great; 4th sachet: only if cheap'
      - section: 'Remember'
        say: 'Remember, less joy from each extra unit means a lower price for each extra unit.'
        write: 'Less joy ⇒ lower price'
      - section: 'Answer'
        say: 'So the law explains why the slope of a normal demand curve is negative, which is option A.'
        write: '$\therefore$ the slope of a normal demand curve is negative'
        answer: true
    traps:
      B: 'You went for the abnormal demand curve. Upward slopes come from exceptions like Giffen goods, not from this law.'
      C: 'You chose a positive slope. A normal demand curve slopes downwards, so its slope is negative.'
      D: 'You picked inferior goods. Consumption of inferior goods falls as income rises, and that is about income, not this law.'
  14:
    moments:
      - section: 'The question'
        say: 'A buyer was ready to pay one hundred and twenty kobo for four oranges but paid only eighty kobo. How much did she gain?'
        write: 'Willing to pay 120k, pays 80k. Consumer surplus $= ?$'
      - section: 'Name it'
        say: 'This is consumer surplus, worked out in money.'
        write: 'Consumer surplus'
      - section: 'The rule'
        say: 'Consumer surplus equals what the buyer is willing to pay minus what she actually pays.'
        write: 'Surplus = willing to pay − amount paid'
      - section: 'Substitute'
        say: 'One hundred and twenty kobo minus eighty kobo is forty kobo.'
        write: '$120\text{k} - 80\text{k} = 40\text{k}$'
      - section: 'Change to naira'
        say: 'One hundred kobo make one naira, so forty kobo is zero point four zero naira.'
        write: '100k = ₦1, so 40k = ₦0.40'
      - section: 'Check'
        say: 'Check in naira. One naira twenty minus eighty kobo is forty kobo. Good.'
        write: '₦1.20 − ₦0.80 = ₦0.40 ✓'
      - section: 'In Nigeria'
        say: 'At Oja Oba market she haggled the oranges down and kept forty kobo in her purse. That is her consumer surplus.'
        write: 'Haggled at Oja Oba, kept 40k'
      - section: 'Answer'
        say: 'So her consumer surplus is zero point four zero naira, which is option B.'
        write: '$\therefore$ consumer surplus = ₦0.40'
        answer: true
    traps:
      A: 'You went for one naira fifty. That divides one hundred and twenty by eighty. Surplus is a difference, not a ratio.'
      C: 'You chose one naira. The difference is forty kobo, which is zero point four zero naira.'
      D: 'You picked two naira. That adds the two amounts. Surplus takes the price paid away from the price she was willing to pay.'
  15:
    moments:
      - section: 'The question'
        say: 'Some changes move us along the supply curve, and some shift the whole curve. Which set shifts it?'
        write: 'Factors that shift the supply curve ?'
      - section: 'Name it'
        say: 'These are the determinants of supply other than the good''s own price.'
        write: 'Determinants of supply'
      - section: 'The rule'
        say: 'A change in the good''s own price moves us along the supply curve. A change in anything else shifts the whole curve.'
        write: 'Own price ⇒ movement along; other factors ⇒ shift'
      - section: 'How it works'
        say: 'Better technology and lower costs of production let firms supply more at every price, so the curve shifts right.'
        write: 'Better technology, lower cost ⇒ shift right'
      - say: 'Bad weather cuts farm output, so the supply curve shifts left.'
        write: 'Bad weather ⇒ shift left'
      - section: 'In Nigeria'
        say: 'A good rainy season in Benue raises the yam harvest, so more yams reach the market at every price.'
        write: 'Good rains in Benue ⇒ more yams at every price'
      - section: 'Remember'
        say: 'Remember, own price moves you along the curve, and everything else moves the curve.'
        write: 'Price: along. Others: shift.'
      - section: 'Answer'
        say: 'So technology, weather and cost of production shift the supply curve, which is option B.'
        write: '$\therefore$ technology, weather and cost of production'
        answer: true
    traps:
      A: 'You went for weather, price and technology. Weather and technology do shift supply, but price only moves along the curve.'
      C: 'You chose technology, price and taste. Price moves along the curve, and taste shifts demand, not supply.'
      D: 'You picked population, price and taste. Population and taste shift demand, and price moves along the curve.'
  16:
    moments:
      - section: 'The question'
        say: 'The coefficient of elasticity of supply is more than one. What do we call that supply?'
        write: '$E_s > 1$. Supply is ?'
      - section: 'Name it'
        say: 'This is price elasticity of supply.'
        write: 'Price elasticity of supply'
      - section: 'The rule'
        say: 'Its coefficient, which we call E s, is a number that measures how strongly supply responds to price. E s equals the percentage change in quantity supplied over the percentage change in price.'
        write: '$E_s = \dfrac{\%\,\Delta Q_s}{\%\,\Delta P}$'
      - section: 'The scale'
        say: 'Now we read the coefficient on a scale. A coefficient of zero is perfectly inelastic, and between zero and one is fairly inelastic, because quantity changes by a smaller percentage than price.'
        write: '0 perfectly inelastic; between 0 and 1 fairly inelastic'
      - say: 'Exactly one is unitary, because quantity and price change by the same percentage.'
        write: '1 unitary'
      - say: 'Above one is fairly elastic, because quantity changes by a bigger percentage than price. And infinity is perfectly elastic.'
        write: 'Above 1 fairly elastic; ∞ perfectly elastic'
      - section: 'Worked example'
        say: 'For example, if price rises ten per cent and quantity supplied rises twenty five per cent, E s is twenty five over ten, which is two point five. That is more than one.'
        write: '$E_s = \dfrac{25}{10} = 2.5 > 1$'
      - section: 'In Nigeria'
        say: 'When the price of sachet water rises, producers in Lagos can run their machines longer, so supply responds strongly.'
        write: 'Sachet water: machines run longer ⇒ supply responds'
      - section: 'Remember'
        say: 'Remember, more than one means more than proportionate, so fairly elastic.'
        write: '$E_s > 1$ ⇒ more than proportionate'
      - section: 'Answer'
        say: 'So supply with a coefficient greater than one is fairly elastic, which is option D.'
        write: '$\therefore$ fairly elastic'
        answer: true
    traps:
