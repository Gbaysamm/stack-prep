        say: 'This is the link between average product and marginal product of a variable factor, like labour.'
        write: 'AP and MP of the variable factor'
      - section: 'The rule'
        say: 'Average product is total product over the number of workers. Marginal product is the extra output from one more worker.'
        write: '$AP = \dfrac{TP}{L}$, $MP = \dfrac{\Delta TP}{\Delta L}$'
      - say: 'When M P is above A P, A P rises. When M P is below A P, A P falls.'
        write: '$MP > AP \Rightarrow AP \uparrow$; $MP < AP \Rightarrow AP \downarrow$'
      - section: 'Worked example'
        say: 'For example, total product is ten, thirty and sixty with one, two and three workers. The first worker adds ten. The second adds thirty minus ten, which is twenty. The third adds sixty minus thirty, which is thirty. So marginal product is ten, twenty and thirty.'
        write: '$TP$: 10, 30, 60 ⇒ $MP$: 10, 20, 30'
      - say: 'Average product is ten over one, thirty over two and sixty over three, which is ten, fifteen and twenty. M P stays above A P, and A P keeps rising.'
        write: '$AP$: 10, 15, 20, rising, with $MP > AP$'
      - say: 'Each new worker adds more than the one before. This stage, when output grows faster than the workers we add, is called increasing returns to the variable factor.'
        write: 'Each worker adds more ⇒ increasing returns'
      - section: 'In Nigeria'
        say: 'On a rice farm in Kebbi, the second and third workers can share tasks, so each new worker adds more than the average.'
        write: 'Kebbi rice farm: new worker adds above the average'
      - section: 'Remember'
        say: 'Remember, a new student who scores above the class average pulls the average up.'
        write: 'New mark above average ⇒ average rises'
      - section: 'Answer'
        say: 'So A P is less than M P when there are increasing returns to the variable factor, which is option B.'
        write: '$\therefore$ increasing returns to the variable factor'
        answer: true
    traps:
      A: 'You went for A P at its maximum. At that point M P equals A P. It is not above it.'
      C: 'You chose M P negative. A negative M P is far below A P.'
      D: 'You picked A P falling. A P falls only when M P is below it, the opposite case.'
  21:
    moments:
      - section: 'The question'
