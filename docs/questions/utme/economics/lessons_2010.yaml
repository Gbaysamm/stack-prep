        write: 'Aggregate spending and the business cycle'
      - section: 'The rule'
        say: 'Aggregate spending, A E, is consumption C, plus investment I, plus government spending G, plus net exports, which is exports X minus imports M.'
        write: '$AE = C + I + G + (X - M)$'
      - section: 'How it works'
        say: 'If spending falls, firms cannot sell all they make. They cut output and lay off workers.'
