  32:
    moments:
      - section: 'The question'
        say: 'How many times does a naira change hands in a year? Which fraction measures it?'
        write: 'Velocity of money = ?'
      - section: 'Name it'
        say: 'This is the velocity of circulation of money, from the quantity theory of money.'
        write: 'Velocity of circulation (V)'
      - section: 'The rule'
        say: 'Fisher''s equation of exchange says M times V equals P times Y. Money supply times velocity equals the price level times real output.'
        write: '$MV = PY$'
      - section: 'Rearrange'
        say: 'Divide both sides by M. V equals P Y over M.'
        write: '$V = \dfrac{PY}{M}$'
      - say: 'P times Y, the price level times real output, is nominal G D P. Nominal means measured at today''s prices.'
