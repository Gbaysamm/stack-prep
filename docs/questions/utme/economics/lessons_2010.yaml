  29:
    moments:
      - section: 'The question'
        say: 'Government spends one hundred and fifty million naira more, and the M P C is zero point seven. Does national income rise by just that much, or by more? Let us use the multiplier.'
        write: 'MPC $= 0.7$, $\Delta G =$ ₦150 million, $\Delta Y = ?$'
      - section: 'Name it'
        say: 'This is the government expenditure multiplier.'
        write: 'The multiplier'
      - say: 'First, the M P C, the marginal propensity to consume, is the part of each extra naira of income that people spend. So zero point seven means people spend seventy kobo of every extra naira, and that spending becomes someone else''s income.'
        write: 'MPC $= 0.7$: 70k of each extra ₦1 is spent'
      - section: 'The formula'
        say: 'The multiplier k equals one over one minus the M P C. The rise in income, delta Y, equals k times delta G.'
        write: '$k = \dfrac{1}{1 - \text{MPC}}$, $\Delta Y = k \times \Delta G$'
      - section: 'Find k'
        say: 'One minus zero point seven is zero point three. So k is one over zero point three, which is ten over three.'
        write: '$k = \dfrac{1}{1 - 0.7} = \dfrac{1}{0.3} = \dfrac{10}{3}$'
      - section: 'Find delta Y'
        say: 'Delta Y is ten over three times one hundred and fifty. One hundred and fifty divided by three is fifty, and fifty times ten is five hundred.'
        write: '$\Delta Y = \dfrac{10}{3} \times 150 = 500$'
      - say: 'So national income rises by five hundred million naira.'
        write: '$\Delta Y =$ ₦500 million'
      - section: 'Check'
        say: 'Check by working back. The rise in income times one minus the M P C should give the new spending. Five hundred times zero point three is one hundred and fifty. Good.'
        write: '$500 \times 0.3 = 150$ ✓'
      - section: 'In Nigeria'
        say: 'When government pays contractors to build a road in Enugu, the workers spend on food and transport, and the sellers spend in turn. Income grows by more than the first spending.'
        write: 'Road in Enugu: spending passes from hand to hand'
      - section: 'Answer'
        say: 'So equilibrium national income rises by five hundred million naira, which is option D.'
        write: '$\therefore \Delta Y =$ ₦500 million'
        answer: true
    traps:
      A: 'You went for two hundred and fourteen million. That divides by the M P C, zero point seven. The multiplier divides by one minus the M P C.'
      B: 'You chose forty five million. That multiplies one hundred and fifty by zero point three instead of dividing by it.'
      C: 'You picked one hundred and five million. That is only the first round of spending, zero point seven times one hundred and fifty.'
