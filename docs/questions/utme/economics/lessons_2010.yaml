    moments:
      - section: 'The question'
        say: 'One farm uses a tractor, another a hoe. What decides the method of production?'
        write: 'The choice of method of production is determined by ?'
      - section: 'Name it'
        say: 'This is the economic problem of how to produce.'
        write: 'The "how to produce" problem'
      - section: 'The rule'
        say: 'Every economy must decide what to produce, how to produce it and for whom. How means the method, by hand or by machine.'
        write: 'What? How? For whom?'
      - section: 'How it works'
        say: 'The method an economy can use depends on its level of technical know-how. Advanced technology uses machines, and simple technology uses hand tools and much labour.'
        write: 'Technical know-how ⇒ method of production'
      - section: 'In Nigeria'
        say: 'A mechanised rice farm in Kebbi uses tractors and harvesters, while a smallholder in Ebonyi still plants and harvests by hand.'
        write: 'Kebbi: tractors. Ebonyi: hand tools.'
      - section: 'Remember'
        say: 'Remember, what you know decides how you produce.'
        write: 'Know-how ⇒ how'
      - section: 'Answer'
        say: 'So the method of production is determined by the level of technical know-how, which is option A.'
        write: '$\therefore$ level of technical know-how'
        answer: true
    traps:
      B: 'You went for population growth. That affects how many people want goods, not the method of producing them.'
      C: 'You chose natural resources. They decide mainly what an economy produces, like oil or cocoa, rather than how.'
      D: 'You picked the level of income. Income affects demand for goods, not the technique used to make them.'
  50:
    moments:
      - section: 'The question'
        say: 'A firm is deciding whether to hire one more worker. What should it look at?'
        write: 'The amount of labour hired depends on ?'
      - section: 'Name it'
        say: 'This is the marginal productivity theory of wages.'
        write: 'Marginal productivity theory'
      - section: 'The rule'
        say: 'The marginal revenue product of labour, M R P, is the extra revenue that one more worker brings in. A firm hires labour up to the point where the M R P of the last worker equals the wage.'
        write: 'Hire until MRP of labour = wage'
      - section: 'How it works'
        say: 'If an extra worker adds more to revenue than he costs, the firm hires him. If he adds less, it does not.'
        write: 'MRP > wage ⇒ hire; MRP < wage ⇒ do not hire'
      - section: 'Worked example'
        say: 'For example, a bakery in Jos pays five thousand naira a day. A baker who adds seven thousand naira of bread brings in more than he costs, so he is hired.'
        write: 'Wage ₦5,000: adds ₦7,000 ⇒ hire'
      - say: 'But a baker who adds only three thousand naira of bread costs more than he brings in, so he is not hired.'
        write: 'Wage ₦5,000: adds ₦3,000 ⇒ do not hire'
      - section: 'Remember'
        say: 'Remember, hire while the worker adds more than he costs.'
        write: 'Hire while MRP ≥ wage'
      - section: 'Answer'
        say: 'So the amount of labour hired depends on the marginal productivity of labour, which is option C.'
        write: '$\therefore$ marginal productivity of labour'
        answer: true
    traps:
      A: 'You went for the number of skilled workers available. That is the supply of labour, not the firm''s decision to hire.'
      B: 'You chose the skill of labour. Skill matters only through how much the worker produces, which is his marginal productivity.'
      D: 'You picked the price of inputs. That is too broad. Hiring depends on what labour produces compared with its wage.'
