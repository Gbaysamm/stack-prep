      D: 'You picked four hundred. That would need an A T C of twenty naira. Twenty is the output, not the cost.'
  25:
    moments:
      - section: 'The question'
        say: 'A monopolist is making a big profit. If a regulator wanted to wipe that profit out, what should the price equal?'
        write: 'Monopoly profit eliminated where $P = ?$'
      - section: 'Name it'
        say: 'This is the profit of a monopolist.'
        write: 'Monopoly profit'
      - section: 'The rule'
        say: 'Profit per unit is price minus average cost, A C, the cost of each unit.'
        write: 'Profit per unit $= P - \text{AC}$'
      - section: 'How it works'
        say: 'If price is above A C, every unit earns a profit.'
        write: '$P > \text{AC}$ ⇒ profit'
      - say: 'If price comes down to equal A C, profit per unit is zero. Normal profit, the least reward that keeps the owner in business, is already counted inside A C, so only that remains, and the abnormal profit is gone.'
        write: '$P = \text{AC}$ ⇒ no abnormal profit'
      - section: 'In Nigeria'
        say: 'If a sole electricity distributor had to charge a tariff equal to its average cost of supply, it would earn no abnormal profit.'
        write: 'Tariff = average cost ⇒ no abnormal profit'
      - section: 'Remember'
        say: 'Remember, price equal to A C means no profit and no loss.'
        write: '$P = \text{AC}$: no profit, no loss'
      - section: 'Answer'
        say: 'So the monopolist''s profit is eliminated where price equals A C, which is option C.'
        write: '$\therefore P = \text{AC}$'
        answer: true
    traps:
      A: 'You went for A F C. That is only part of cost. At that price the firm cannot even cover its variable costs.'
      B: 'You chose M C. Price equal to M C gives the efficient output, but if price is still above A C there is still a profit.'
      D: 'You picked A V C. At that price the firm covers only its variable costs and loses its fixed costs.'
