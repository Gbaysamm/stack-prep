        write: 'Average total cost (ATC)'
      - section: 'The rule'
        say: 'A T C is total cost per unit. It equals total cost over output. It also equals average variable cost, A V C, plus average fixed cost, A F C.'
        write: '$\text{ATC} = \dfrac{\text{TC}}{Q} = \text{AVC} + \text{AFC}$'
      - section: 'Read the diagram'
        say: 'First find the right curve. A T C is the U shaped curve labelled A T C, above the A V C curve.'
        write: 'Find the curve labelled ATC'
      - say: 'Now go up from twenty units on the output axis until you meet the A T C curve.'
        write: 'Up from $Q = 20$ to ATC'
      - say: 'Then go across to the cost axis. The dashed line meets it at fifteen naira.'
        write: 'Across to the cost axis: ₦15'
      - section: 'Check'
        say: 'Check. The marginal cost curve, M C, cuts A T C at exactly this point. M C always cuts A T C at its lowest point, so this is the bottom of the U.'
        write: 'MC cuts ATC at its minimum ✓'
      - section: 'Remember'
        say: 'Remember, go up from the quantity and across to the cost, on the right curve.'
        write: 'Up from $Q$, across to cost'
      - section: 'Answer'
        say: 'So the average total cost at twenty units is fifteen naira, which is option D.'
        write: '$\therefore \text{ATC} = ₦15.00$'
        answer: true
