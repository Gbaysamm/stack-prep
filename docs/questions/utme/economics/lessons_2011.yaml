        write: '$\therefore$ difficulties in coordinating production'
        answer: true
    traps:
      B: 'You went for a shortage of labour. That can hit a firm of any size. It is not what defines diseconomies of scale.'
      C: 'You chose a small market. A small market limits economies of scale, but diseconomies come from the firm being too big.'
      D: 'You picked dearer raw materials. A general rise in input prices hits every firm, whatever its size.'
  19:
    moments:
      - section: 'The question'
        say: 'Diminishing returns need something to stay fixed. In which period can anything stay fixed?'
        write: 'Law of variable proportions applies only?'
      - section: 'Name it'
        say: 'This is the law of variable proportions, also called the law of diminishing returns.'
        write: 'Law of variable proportions'
      - section: 'The rule'
        say: 'As more units of a variable factor are added to a fixed factor, the marginal product of the variable factor will eventually fall.'
        write: 'Variable factor + fixed factor ⇒ MP eventually falls'
      - section: 'How it works'
        say: 'The law needs at least one fixed factor, such as land or a factory building.'
        write: 'Needs a fixed factor'
      - say: 'A factor is fixed only in the short run. In the long run every factor can change, and we speak of returns to scale instead.'
        write: 'Fixed factor ⇒ short run only'
      - section: 'In Nigeria'
        say: 'A farmer in Benue with a fixed two hectares keeps adding labourers. After a point each new labourer adds less yam than the one before.'
        write: '2 hectares fixed, labourers added ⇒ MP falls'
      - section: 'Remember'
        say: 'Remember, a fixed factor means the short run.'
        write: 'Fixed factor = short run'
      - section: 'Answer'
        say: 'So the law of variable proportions applies only in the short run period, which is option D.'
        write: '$\therefore$ in the short-run period'
        answer: true
    traps:
      A: 'You went for the long run. In the long run no factor is fixed, so the law has nothing to work on.'
      B: 'You chose large firms. The law applies to firms of every size.'
      C: 'You picked small firms. The law applies to small and large firms alike.'
  20:
    moments:
      - section: 'The question'
        say: 'Look at the diagram. A firm has a fixed budget and wants the most output for it. Which point should it choose?'
        write: 'Optimal point of production: R, T, U or S?'
      - section: 'Name it'
        say: 'This is producer equilibrium, the least cost combination of capital and labour.'
        write: 'Producer equilibrium'
      - section: 'The rule'
        say: 'Each curve is an isoquant, joining all the mixes of capital and labour that give the same output. Higher curves mean more output.'
        write: 'Isoquant: same output; III > II > I'
      - say: 'The straight line is the isocost line. It shows every mix the firm can buy with its budget.'
        write: 'Isocost line: every mix the budget can buy'
      - section: 'Read the diagram'
        say: 'Look at U and T. They are on the isocost line, so the firm can afford them, but they sit on isoquant one, the lowest output.'
        write: 'U, T: affordable, but on isoquant I'
      - say: 'Now look at R on isoquant three. It is above the isocost line, so the budget cannot reach it.'
        write: 'R: on III, beyond the budget'
      - say: 'Now look at S. There the isocost line just touches isoquant two, the highest output the budget can reach.'
        write: 'S: isocost tangent to isoquant II'
      - section: 'In Nigeria'
        say: 'A block maker in Ibadan with five hundred thousand naira picks the mix of labourers and moulding machines that gives the most blocks for that money.'
        write: '₦500,000 ⇒ the mix that gives the most blocks'
      - section: 'Remember'
        say: 'Remember, the point of tangency gives the highest output for the money.'
        write: 'Tangency = most output for the money'
      - section: 'Answer'
        say: 'So the optimal point of production is S, which is option D.'
        write: '$\therefore$ S'
        answer: true
    traps:
      A: 'You went for R. It gives more output, but it lies beyond the isocost line, so the firm cannot afford it.'
      B: 'You chose T. It is affordable, but it is on isoquant one. S gives more output for the same cost.'
      C: 'You picked U. It is affordable, but it is on isoquant one. S gives more output for the same cost.'
  21:
    moments:
      - section: 'The question'
        say: 'A teacher earns the same salary as last year, yet she can buy more with it. What has happened?'
