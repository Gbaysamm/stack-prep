      - section: 'Name it'
        say: 'This is real income compared with nominal income.'
        write: 'Real income and nominal income'
      - section: 'The rule'
        say: 'Nominal income is the money received. Real income is what that money can buy.'
        write: 'Real income = purchasing power'
      - section: 'How it works'
        say: 'Real income is nominal income divided by the price level.'
        write: 'Real income $= \dfrac{\text{nominal income}}{\text{price level}}$'
      - say: 'Here nominal income, the top of the fraction, stays the same, yet real income gets bigger. That can only happen if the bottom, the price level, has fallen.'
        write: 'Same top, bigger answer ⇒ price level fell'
