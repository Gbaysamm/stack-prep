        say: 'The teacher still earns seventy thousand naira a month, but garri, rice and transport are cheaper, so she can buy more.'
        write: '₦70,000 buys more when prices fall'
      - section: 'Remember'
        say: 'Remember, the same money at lower prices buys more goods.'
        write: 'Same money, lower prices, more goods'
      - section: 'Answer'
        say: 'So we can infer that general prices have fallen, which is option B.'
        write: '$\therefore$ general prices have fallen'
        answer: true
    traps:
