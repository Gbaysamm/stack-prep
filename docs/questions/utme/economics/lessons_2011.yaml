# UTME 2011 Economics, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Economics teacher works on the board:
# the question, the concept named, the rule or definition, how it works as cause and effect (or
# the calculation with data, formula, working and check), a Nigerian example, a way to remember
# it, and the answer.
#
#   say:     heard, not read. Money and numbers in words, symbols read as words ("M C", "A T C",
#            "P E S"), no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2011.yaml. Answers match that file. No question
# is dropped, so all 49 have a lesson.
format_version: 1
exam_year: 2011
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'Prices keep rising in a mixed economy. Several things can slow them for a while, but which one cures inflation for good?'
        write: 'Most effective long-term control of inflation?'
      - section: 'Name it'
        say: 'This is about controlling inflation, a persistent rise in the general price level.'
        write: 'Inflation = persistent rise in the general price level'
      - section: 'The rule'
        say: 'Inflation is often described as too much money chasing too few goods. A lasting cure must deal with the too few goods side.'
        write: 'Too much money chasing too few goods'
      - section: 'How it works'
        say: 'Productivity is the output of each worker or each machine. When productivity rises, each one turns out more, so the supply of goods grows.'
        write: 'Productivity up ⇒ more goods'
      - say: 'More goods for the same spending pull prices down, and the cost of each unit falls too.'
        write: 'More goods + lower unit cost ⇒ prices steady'
      - section: 'In Nigeria'
        say: 'If our farmers raise their yields of rice and tomatoes, food prices in the market fall, and food is the biggest item in Nigeria''s inflation basket.'
        write: 'Higher rice and tomato yields ⇒ cheaper food'
      - section: 'Remember'
        say: 'Remember, more goods mean steadier prices.'
        write: 'More goods, steadier prices'
      - section: 'Answer'
        say: 'So the most effective long term way to control inflation is to increase productivity, which is option A.'
        write: '$\therefore$ increase productivity'
        answer: true
    traps:
      B: 'You went for cutting income tax. That leaves people more money to spend, which pushes prices up, not down.'
      C: 'You chose rationing. It holds prices down for a while, but it adds no extra goods, and it breeds queues and black markets.'
      D: 'You picked more imports. They can ease a shortage, but they drain foreign exchange and do nothing for home output in the long run.'
  3:
    moments:
      - section: 'The question'
        say: 'The production possibility curve is drawn with technology held fixed. What can such a curve never show us?'
        write: 'PPC with fixed technology, a limitation?'
      - section: 'Name it'
        say: 'This is the production possibility curve, or P P C, and the assumptions it is drawn on.'
        write: 'Production possibility curve (PPC)'
      - section: 'The rule'
        say: 'A P P C shows the combinations of two goods an economy can make when it uses all its resources fully, with given resources and a given state of technology.'
        write: 'Assumes full use of fixed resources and fixed technology'
      - section: 'How it works'
        say: 'With technology held fixed, the curve is a snapshot. A new invention needs a whole new curve, shifted outwards.'
        write: 'New technology ⇒ a new curve, shifted out'
      - say: 'So one P P C gives no indication of technological development.'
        write: 'One PPC ⇒ no sign of technological change'
      - section: 'In Nigeria'
        say: 'If farmers moved from hoes to tractors, they could grow more yam and more maize at once. A curve drawn for the hoe era could never show that.'
        write: 'Hoe to tractor: needs a new PPC'
      - section: 'Remember'
        say: 'Remember, one curve shows one level of technology.'
        write: 'One curve, one level of technology'
      - section: 'Answer'
        say: 'So the limitation is that there is no indication of technological development, which is option A.'
        write: '$\therefore$ no indication of technological development'
        answer: true
    traps:
      B: 'You went for no measure of opportunity cost. But the slope of the P P C is exactly the opportunity cost of one good in terms of the other.'
      C: 'You chose technical inefficiency. Points on the curve are efficient. Inefficiency shows as a point inside the curve.'
      D: 'You picked abundant resources. The P P C assumes resources are scarce and fixed, which is why it has a boundary at all.'
  4:
    moments:
      - section: 'The question'
        say: 'Four friends score around twelve, and one scores fifty four. What does that one score do to their average?'
        write: 'Major disadvantage of the arithmetic mean?'
      - section: 'Name it'
        say: 'This is the arithmetic mean. We add all the values, written sigma x, and divide by n, the number of values.'
        write: 'Mean $= \dfrac{\Sigma x}{n}$'
      - section: 'The rule'
        say: 'Because the mean uses every value, one very large or very small value pulls it towards itself.'
        write: 'The mean is affected by extreme values'
      - section: 'Work it'
        say: 'Take ten, twelve, eleven, thirteen and fifty four. They add up to one hundred, and one hundred divided by five is twenty.'
        write: '$\dfrac{10 + 12 + 11 + 13 + 54}{5} = \dfrac{100}{5} = 20$'
      - say: 'In order, the scores are ten, eleven, twelve, thirteen and fifty four, so the middle one, the median, is twelve. Four of the five scores are thirteen or below, yet the mean of twenty is above all four, because the one extreme score, fifty four, has pulled it up. So the median describes the group better.'
        write: 'In order 10, 11, 12, 13, 54 ⇒ median $= 12$'
      - section: 'In Nigeria'
        say: 'Put one millionaire oil contractor in a village of poor farmers, and the average income of the village looks high.'
        write: 'One millionaire raises the village average'
      - section: 'Remember'
        say: 'Remember, the mean is pulled by the extremes, and the median stands firm.'
        write: 'Mean pulled by extremes; median stands firm'
      - section: 'Answer'
        say: 'So the major disadvantage of the arithmetic mean is that it is affected by extreme values, which is option D.'
        write: '$\therefore$ affected by extreme values'
        answer: true
    traps:
      A: 'You went for not useful for large data. The mean works well with large data, and a computer finds it in an instant.'
      B: 'You chose not suitable for further analysis. In fact the mean is the base for further work, like the standard deviation.'
      C: 'You picked cumbersome to find. The mean is easy. Add the values and divide by how many there are.'
  5:
    moments:
      - section: 'The question'
        say: 'In a market economy, nobody gives orders about what to produce. So who decides the pattern of demand?'
        write: 'Demand patterns are set by the market on the basis of?'
      - section: 'Name it'
        say: 'This is consumer sovereignty.'
        write: 'Consumer sovereignty'
      - section: 'The rule'
        say: 'Consumer sovereignty means the consumer is king. What consumers choose to buy decides what is produced.'
        write: 'The consumer is king'
      - section: 'How it works'
        say: 'Each naira spent is like a vote for a good. Goods with many votes earn profits, so producers make more of them.'
        write: 'Naira spent = a vote ⇒ profit ⇒ more produced'
      - say: 'Goods nobody buys make losses, and producers stop making them.'
        write: 'No votes ⇒ losses ⇒ production stops'
      - section: 'In Nigeria'
        say: 'When more Nigerians began to buy sachet water, firms rushed to set up sachet water factories in every town.'
        write: 'Sachet water demand ⇒ factories everywhere'
      - section: 'Remember'
        say: 'Remember, the customer votes with money.'
        write: 'The customer votes with money'
      - section: 'Answer'
        say: 'So demand patterns are set on the basis of consumer sovereignty, which is option B.'
        write: '$\therefore$ consumer sovereignty'
        answer: true
    traps:
      A: 'You went for scale of preference. That is one person''s private list of wants. It is the power of all consumers together that shapes the market.'
      C: 'You chose consumer rationality. That is an assumption about how buyers behave, not the power that sets demand patterns.'
      D: 'You picked price. Price signals demand, but price itself responds to what consumers choose.'
  6:
    moments:
      - section: 'The question'
        say: 'Bisi would happily pay five hundred naira for a plate of jollof rice, but it costs three hundred. What do we call the gain she keeps?'
        write: 'Consumer surplus measures the?'
      - section: 'Name it'
        say: 'This is consumer surplus.'
        write: 'Consumer surplus'
      - section: 'The rule'
        say: 'Consumer surplus is what a buyer is willing to pay minus what she actually pays.'
        write: 'Consumer surplus = willing to pay − actually paid'
      - section: 'How it works'
        say: 'Marginal utility, M U, is the extra satisfaction from one more unit, and what she will pay for a unit measures it. M U falls as she has more, so the first units are worth more to her than the later ones. But the market charges one price for every unit.'
        write: 'MU falls, price stays the same'
      - say: 'Surplus on each unit is its M U minus the price. On every unit before the last, M U is above the price, so that excess is her gain, and adding these gains gives the consumer surplus.'
        write: 'Surplus on each unit $= \text{MU} - P$'
      - section: 'In Nigeria'
        say: 'At the mama put, Bisi would pay five hundred naira but pays three hundred. Her consumer surplus is two hundred naira.'
        write: '₦500 − ₦300 = ₦200'
      - section: 'Remember'
        say: 'Remember, it is what you would pay minus what you do pay.'
        write: 'Would pay − do pay'
      - section: 'Answer'
        say: 'So consumer surplus measures the excess of marginal utility over price, which is option D.'
        write: '$\therefore$ excess of marginal utility over price'
        answer: true
    traps:
      A: 'You went for the benefit of a cheap commodity. A cheap good can still give little surplus. The surplus is measured against what the buyer is willing to pay.'
      B: 'You chose expenditure over utility. That is upside down. Consumer surplus is utility over expenditure.'
      C: 'You picked marginal utility minus marginal cost. Marginal cost belongs to the producer. Consumer surplus compares utility with price.'
  7:
    moments:
      - section: 'The question'
        say: 'You travel from Lagos to Ibadan by bus or by train, but not both. What kind of demand is that?'
        write: 'Demand for one good excludes another'
      - section: 'Name it'
        say: 'This is competitive demand.'
        write: 'Competitive demand'
      - section: 'The rule'
        say: 'Competitive demand is the demand for substitutes, where buying one good excludes buying the other.'
        write: 'Substitutes, one excludes the other'
      - section: 'How it works'
        say: 'Both goods satisfy the same want, so once you buy one you do not need the other.'
        write: 'Same want ⇒ choose one'
      - say: 'If the price of one rises, people switch to the other.'
        write: 'Price of one up ⇒ demand for the other up'
      - section: 'In Nigeria'
        say: 'The bus and the train to Ibadan compete. So do tea and coffee at breakfast.'
        write: 'Bus or train; tea or coffee'
      - section: 'Remember'
        say: 'Remember, competitive goods compete for the same want.'
        write: 'Competitive goods compete for one want'
      - section: 'Answer'
        say: 'So demand where one good excludes another is competitive demand, which is option B.'
        write: '$\therefore$ competitive demand'
        answer: true
    traps:
      A: 'You went for complementary demand. Complements are bought together, like a car and petrol. They do not exclude each other.'
      C: 'You chose composite demand. That is one good wanted for many uses, like palm oil for cooking and for soap.'
      D: 'You picked derived demand. That is demand for something because of what it helps to make, like the demand for labour.'
  8:
    moments:
      - section: 'The question'
        say: 'Look at the table. As the price goes up, does the quantity demanded go up or down? That decides the shape of the curve.'
        write: 'Price ₦1 to ₦5, quantity 100 kg to 200 kg'
      - section: 'Name it'
        say: 'This is about the shape of a demand curve drawn from a demand schedule.'
        write: 'Demand schedule ⇒ demand curve'
      - section: 'The rule'
        say: 'By the law of demand, a normal demand curve slopes downward. As price rises, quantity demanded falls.'
        write: 'Normal: $P \uparrow \Rightarrow Q_d \downarrow$'
      - say: 'A curve where quantity demanded rises as price rises slopes upward. It is an abnormal demand curve.'
        write: 'Abnormal: $P \uparrow \Rightarrow Q_d \uparrow$'
      - section: 'Read the table'
        say: 'Price goes from one naira to five naira, and quantity demanded goes from one hundred to two hundred kilograms.'
        write: '$P$: 1 → 5,  $Q_d$: 100 → 200'
      - say: 'Both rise together, so the graph slopes upward from left to right.'
        write: 'Both rise ⇒ upward slope'
      - section: 'In Nigeria'
        say: 'When people hear that petrol prices will go up next week, they buy more today, even as the price climbs.'
        write: 'Expected price rise ⇒ buy more now'
      - section: 'Remember'
        say: 'Remember, normal demand goes down the hill, and abnormal demand climbs it.'
        write: 'Normal down the hill; abnormal climbs it'
      - section: 'Answer'
        say: 'So the graph of this schedule is an abnormal demand curve, which is option C.'
        write: '$\therefore$ an abnormal demand curve'
        answer: true
    traps:
      A: 'You went for a kinked demand curve. That belongs to oligopoly and has a bend in it. This schedule rises smoothly.'
      B: 'You chose a normal demand curve. A normal curve needs quantity to fall as price rises, and this table shows the opposite.'
      D: 'You picked a diminishing marginal utility curve. That plots utility against units consumed, not price against quantity.'
  9:
    moments:
      - section: 'The question'
        say: 'Eleven footballers stand in a line from shortest to tallest. Whose height is the median?'
        write: 'Median of an odd-numbered set?'
      - section: 'Name it'
        say: 'This is the median, a measure of central tendency.'
        write: 'Median'
      - section: 'The rule'
        say: 'The median is the middle value after the values are arranged in order of size.'
        write: 'Arrange in order, take the middle value'
      - section: 'Work it'
        say: 'Let n be the number of values. When n is odd, the median is the value in position n plus one over two.'
        write: 'Position $= \dfrac{n+1}{2}$'
      - say: 'For example, take four, seven, nine, twelve and fifteen, already in order. Here n is five, and five plus one over two is three, so the median is the third value, nine.'
        write: '4, 7, $\boxed{9}$, 12, 15'
      - section: 'In Nigeria'
        say: 'For the eleven players, eleven plus one over two is six, so the sixth one in the line stands at the median height.'
        write: '11 players ⇒ the 6th is the median'
      - section: 'Remember'
        say: 'Remember, median means middle.'
        write: 'Median = middle'
      - section: 'Answer'
        say: 'So the median of an odd set is the middle value when the scores are in order, which is option A.'
        write: '$\therefore$ the middle value, in order'
        answer: true
    traps:
      B: 'You went for the highest value. That is the maximum, used for the range, not the median.'
      C: 'You chose the mean. The mean is found by adding and dividing, and it is a different average.'
      D: 'You picked the most frequent score. That is the mode.'
  10:
    moments:
      - section: 'The question'
        say: 'At Christmas everyone wants chicken, but the number of chickens in the market has not changed. What happens to price and quantity?'
        write: 'Demand up, supply unchanged'
      - section: 'Name it'
        say: 'This is the effect of a change in demand on equilibrium.'
        write: 'Change in demand and equilibrium'
      - section: 'The rule'
        say: 'An increase in demand shifts the whole demand curve to the right.'
        write: '$D_1 \to D_2$, shift to the right'
      - section: 'How it works'
        say: 'At the old price, buyers now want more chickens than sellers offer. This excess demand makes buyers bid the price up.'
        write: 'Excess demand ⇒ price rises'
      - say: 'The higher price draws out more supply along the supply curve, so quantity rises too.'
        write: 'Higher price ⇒ more supplied'
      - section: 'In Nigeria'
        say: 'So at Christmas the price of a chicken goes up, and more chickens are sold.'
        write: 'Christmas: chicken price up, more sold'
      - section: 'Remember'
        say: 'Remember, when demand goes up, price and quantity go up.'
        write: 'Demand ↑ ⇒ $P$ ↑ and $Q$ ↑'
      - section: 'Answer'
        say: 'So equilibrium price and quantity will rise, which is option D.'
        write: '$\therefore$ rise'
        answer: true
    traps:
      A: 'You went for unchanged. The equilibrium changes whenever demand changes and supply does not.'
      B: 'You chose shift inward. Curves shift, but price and quantity rise or fall, and more demand pushes things outward.'
      C: 'You picked fall. Price and quantity fall when demand decreases, not when it increases.'
  11:
    moments:
      - section: 'The question'
        say: 'A farmer keeps adding workers to the same farm. At what point is total output at its very top?'
        write: 'Total output is at a maximum when?'
      - section: 'Name it'
        say: 'This is the law of variable proportions, seen through total product and marginal product.'
        write: 'TP and MP'
      - section: 'The rule'
        say: 'Marginal product, M P, is the extra output from one more unit of the variable factor, such as one more worker. We write it as the change in total product, T P, over the change in labour, L.'
        write: '$\text{MP} = \dfrac{\Delta \text{TP}}{\Delta L}$'
      - section: 'How it works'
        say: 'While M P is positive, each extra worker adds to output, so T P is still rising.'
        write: '$\text{MP} > 0 \Rightarrow$ TP rising'
      - say: 'When M P falls to zero, the next worker adds nothing, so T P has stopped rising. That is its peak.'
        write: '$\text{MP} = 0 \Rightarrow$ TP at its peak'
      - say: 'After that M P is negative, and T P falls.'
        write: '$\text{MP} < 0 \Rightarrow$ TP falling'
      - section: 'In Nigeria'
        say: 'On a cassava farm, at some point the farm is so crowded that one more labourer adds nothing. Output is then at its maximum.'
        write: 'Crowded cassava farm: extra labourer adds 0'
      - section: 'Remember'
        say: 'Remember, T P is at the top when M P hits zero.'
        write: 'TP at the top when MP = 0'
      - section: 'Answer'
        say: 'So total output is at a maximum when M P equals zero, which is option A.'
        write: '$\therefore \text{MP} = 0$'
        answer: true
    traps:
      B: 'You went for M P greater than zero. While M P is positive, T P is still climbing, so it has not reached its top.'
      C: 'You chose A P equals zero. A P, average product, is output per worker, so it is zero only when there is no output at all.'
      D: 'You picked A P greater than zero. That is true whenever there is any output, so it does not mark the peak.'
  12:
    moments:
      - section: 'The question'
        say: 'The price doubles from one naira to two naira, and the bags supplied go from sixty to one hundred and twenty. How elastic is supply?'
        write: 'P: ₦1 → ₦2;  $Q_s$: 60 → 120 bags'
      - section: 'The data'
        say: 'P one is one naira and P two is two naira. Q one is sixty bags and Q two is one hundred and twenty bags.'
        write: '$P_1 = 1$, $P_2 = 2$, $Q_1 = 60$, $Q_2 = 120$, PES $= ?$'
      - section: 'The rule'
        say: 'Price elasticity of supply, P E S, is the percentage change in quantity supplied divided by the percentage change in price.'
        write: '$\text{PES} = \dfrac{\%\,\Delta Q_s}{\%\,\Delta P}$'
      - section: 'Working'
        say: 'For a percentage change, we divide the change by the starting value and multiply by one hundred. Quantity rose by sixty, from a start of sixty. That is a one hundred per cent change.'
        write: '$\%\,\Delta Q_s = \dfrac{120 - 60}{60} \times 100 = 100\%$'
      - say: 'Price rose by one naira, from a start of one naira. That is also a one hundred per cent change.'
        write: '$\%\,\Delta P = \dfrac{2 - 1}{1} \times 100 = 100\%$'
      - say: 'One hundred per cent divided by one hundred per cent is one.'
        write: '$\text{PES} = \dfrac{100\%}{100\%} = 1$'
      - section: 'Check'
        say: 'Price doubled and quantity doubled, so the response is exactly in proportion. That is unitary elasticity.'
        write: 'Both doubled ⇒ unitary elasticity ✓'
      - section: 'In Nigeria'
        say: 'A poultry farmer in Ogun who doubles his trays of eggs when the price per tray doubles has supply with unit elasticity.'
        write: 'Egg price × 2, trays × 2 ⇒ PES = 1'
      - section: 'Answer'
        say: 'So the price elasticity of supply is one, which is option C.'
        write: '$\therefore \text{PES} = 1$'
        answer: true
    traps:
      A: 'You went for four. Nothing here gives four. That would need quantity to rise four times as fast as price.'
      B: 'You chose twenty five. That does not come from the percentage changes, which are both one hundred per cent.'
      D: 'You picked two. That is the new price, or one hundred and twenty over sixty. Elasticity divides the percentage changes, and they are equal.'
  13:
    moments:
      - section: 'The question'
        say: 'Ada splits her money between rice and malt. When she is perfectly satisfied with her choice, what does her swap rate equal?'
        write: 'At consumer equilibrium, $\text{MRS}_{xy} = ?$'
      - section: 'Name it'
        say: 'This is consumer equilibrium, in indifference curve analysis. An indifference curve, I C, joins all the mixes of two goods that give her the same satisfaction, and a higher curve means more satisfaction.'
        write: 'Consumer equilibrium (indifference curves)'
      - section: 'The rule'
        say: 'The marginal rate of substitution of X for Y is how much Y she will give up for one more X and stay equally happy. It is the slope of the indifference curve.'
        write: '$\text{MRS}_{xy}$ = slope of the indifference curve'
      - section: 'How it works'
        say: 'Her budget line shows every mix of the two goods she can afford with her money. She is in equilibrium where the budget line just touches the highest indifference curve she can reach.'
        write: 'Budget line tangent to the highest IC'
      - say: 'There the two slopes are equal. The slope of the budget line is the price of X over the price of Y.'
        write: '$\text{MRS}_{xy} = \dfrac{P_x}{P_y}$'
      - section: 'In Nigeria'
        say: 'Rice is four hundred naira a plate and malt is two hundred naira a bottle, so the price ratio is two. Ada is in equilibrium when she would swap exactly two malts for one more plate of rice.'
        write: '$\dfrac{400}{200} = 2$ ⇒ $\text{MRS}_{xy} = 2$'
      - section: 'Remember'
        say: 'Remember, the rate you will swap equals the rate the market swaps.'
        write: 'Your swap rate = the market''s price ratio'
      - section: 'Answer'
        say: 'So at equilibrium the M R S equals the ratio of the two prices, which is option C.'
        write: '$\therefore$ the ratio of the two prices'
        answer: true
    traps:
      A: 'You went for the sum of the prices. Adding prices has no meaning here. It is the ratio, the slope of the budget line, that matters.'
      B: 'You chose the product of the prices. Multiplying the prices plays no part in the equilibrium condition.'
      D: 'You picked the difference of the prices. The slope of the budget line is a ratio, not a difference.'
  14:
    moments:
      - section: 'The question'
        say: 'The government says maize must not sell below a price that is higher than the market price. What happens in the market?'
        write: 'Minimum price above equilibrium, the effect?'
      - section: 'Name it'
        say: 'This is minimum price legislation, also called a price floor.'
        write: 'Minimum price = price floor'
      - section: 'The rule'
        say: 'A minimum price is a legal price below which a good must not be sold. It is fixed above equilibrium to protect producers.'
        write: 'Floor set above the equilibrium price'
      - section: 'How it works'
        say: 'At the higher price, buyers move up the demand curve and buy less.'
        write: 'Higher $P$ ⇒ quantity demanded falls'
      - say: 'Sellers move up the supply curve and offer more.'
        write: 'Higher $P$ ⇒ quantity supplied rises'
      - say: 'Quantity supplied is now bigger than quantity demanded. The difference is a surplus.'
        write: '$Q_s > Q_d$ ⇒ surplus'
      - section: 'In Nigeria'
        say: 'With a high minimum price for maize, farmers in the North grow more than buyers want, and the surplus piles up in stores.'
        write: 'Maize floor ⇒ unsold maize in stores'
      - section: 'Remember'
        say: 'Remember, a floor above equilibrium gives a surplus.'
        write: 'Floor above ⇒ surplus'
      - section: 'Answer'
        say: 'So a minimum price will reduce quantity demanded and create a surplus, which is option C.'
        write: '$\therefore$ reduce quantity demanded, create a surplus'
        answer: true
    traps:
      A: 'You went for reduce supply. Sellers offer more, not less, at the higher price.'
      B: 'You chose increase supply. More is offered, but that is a movement along the supply curve, not a shift of supply itself.'
      D: 'You picked increase demand and scarcity. A higher price cuts the quantity demanded and leaves a surplus, not scarcity.'
  15:
    moments:
      - section: 'The question'
        say: 'At the tuck shop you put meat pie first, puff puff second and chin chin third. Which kind of utility is that?'
        write: 'Ranking measures which utility?'
      - section: 'Name it'
        say: 'This is ordinal utility.'
        write: 'Ordinal utility'
      - section: 'The rule'
        say: 'Ordinal utility says satisfaction cannot be measured in units. We can only rank goods in order of preference.'
        write: 'Rank in order, first, second, third'
      - section: 'How it works'
        say: 'Instead of saying this orange gives me ten utils, the consumer says I prefer the orange to the banana.'
        write: '"I prefer A to B", not "A gives 10 utils"'
      - say: 'This ranking is the base of indifference curve analysis.'
        write: 'Ordinal ⇒ indifference curves'
      - section: 'In Nigeria'
        say: 'The student at the tuck shop ranks meat pie, puff puff and chin chin without giving any of them a number.'
        write: 'Meat pie 1st, puff-puff 2nd, chin-chin 3rd'
      - section: 'Remember'
        say: 'Remember, ordinal goes with order, and cardinal goes with counting.'
        write: 'Ordinal = order; cardinal = counting'
      - section: 'Answer'
        say: 'So ranking is the method used to measure ordinal utility, which is option B.'
        write: '$\therefore$ ordinal utility'
        answer: true
    traps:
      A: 'You went for marginal utility. That is the extra satisfaction from one more unit, measured in numbers in the cardinal approach.'
      C: 'You chose cardinal utility. Cardinal utility counts satisfaction in units called utils. It does not rank.'
      D: 'You picked total utility. That is the sum of satisfaction, counted in the cardinal approach.'
  16:
    moments:
      - section: 'The question'
        say: 'A firm has spare machines and can raise output quickly. When its price rises by ten per cent, how far does its supply jump?'
        write: 'Elastic supply: price rises, quantity supplied?'
      - section: 'Name it'
        say: 'This is elastic supply.'
        write: 'Elastic supply'
      - section: 'The rule'
        say: 'Supply is elastic when the price elasticity of supply is greater than one.'
        write: '$\text{PES} = \dfrac{\%\,\Delta Q_s}{\%\,\Delta P} > 1$'
      - section: 'How it works'
        say: 'A P E S above one means the percentage change in quantity is bigger than the percentage change in price.'
        write: '$\%\,\Delta Q_s > \%\,\Delta P$'
      - say: 'For example, a ten per cent price rise with a P E S of two makes quantity supplied rise by twenty per cent.'
        write: '$10\% \times 2 = 20\%$'
      - section: 'In Nigeria'
        say: 'A sachet water factory with idle machines can quickly fill more bags when the price per bag goes up. Its supply is elastic.'
        write: 'Sachet water factory with spare machines'
      - section: 'Remember'
        say: 'Remember, elastic means stretchy. The response is bigger than the push.'
        write: 'Elastic: response bigger than the push'
      - section: 'Answer'
        say: 'So quantity supplied will increase by more than the percentage increase in price, which is option C.'
        write: '$\therefore$ rises by more than the % rise in price'
        answer: true
    traps:
      A: 'You went for a smaller rise than the price. That is inelastic supply, with P E S less than one.'
      B: 'You chose a fall. On a normal supply curve, quantity supplied rises when price rises.'
      D: 'You picked the same percentage. That is unitary elasticity, P E S equal to one, not elastic supply.'
  17:
    moments:
      - section: 'The question'
        say: 'A bakery can bake a few loaves or thousands. At what output is it at its best size?'
        write: 'Optimum output of a competitive firm?'
      - section: 'Name it'
        say: 'This is the optimum output of a firm.'
        write: 'Optimum output'
      - section: 'The rule'
        say: 'The optimum output is the output at which average cost, A C, the cost of each unit, is at its lowest.'
        write: 'Optimum output: AC at its minimum'
      - section: 'How it works'
        say: 'Average cost falls at first, as fixed costs are spread over more loaves.'
        write: 'More output ⇒ fixed cost spread ⇒ AC falls'
      - say: 'Then it rises, as diminishing returns set in. Its lowest point is where marginal cost, M C, the cost of one more unit, cuts it, because M C below A C pulls the average down and M C above it pulls the average up.'
        write: 'Lowest AC where MC = AC'
      - say: 'In the long run a perfectly competitive firm is pushed to produce right there, where price equals minimum A C.'
        write: 'Long run: $P = $ minimum AC'
      - section: 'In Nigeria'
        say: 'If a bakery in Aba has its lowest cost per loaf at two thousand loaves a day, that is its optimum output.'
        write: 'Lowest cost per loaf at 2,000 loaves'
      - section: 'Remember'
        say: 'Remember, optimum output means lowest average cost.'
        write: 'Optimum = lowest AC'
      - section: 'Answer'
        say: 'So the optimum output is where A C is lowest, which is option A.'
        write: '$\therefore$ AC is lowest'
        answer: true
    traps:
      B: 'You went for lowest average variable cost, A V C. That is the shut down point, the least price at which the firm stays open in the short run.'
      C: 'You chose M C rising. M C rises over a wide range of output, both before and after the lowest point of A C.'
      D: 'You picked M C falling. While M C is falling, the firm is still far below its lowest cost output.'
  18:
