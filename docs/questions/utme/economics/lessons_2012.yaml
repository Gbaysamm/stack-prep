  49:
    moments:
      - section: 'The question'
        say: 'Land earns rent and labour earns wages. What do machines and equipment earn?'
        write: 'Reward on machinery and equipment?'
      - section: 'Name it'
        say: 'This is the factors of production and their rewards.'
        write: 'Factors of production and rewards'
      - section: 'The rule'
        say: 'Land earns rent, labour earns wages, capital earns interest, and the entrepreneur earns profit.'
        write: 'Land: rent. Labour: wages. Capital: interest. Entrepreneur: profit'
      - section: 'Apply it'
        say: 'Machinery and equipment are man made goods used to make other goods. So they are capital, and capital earns interest.'
        write: 'Machinery = capital ⇒ interest'
      - section: 'In Nigeria'
        say: 'A garri processor in Ogun buys a grating machine with a bank loan. The interest she pays is the reward to the capital she uses.'
        write: 'Grating machine on a loan ⇒ interest'
      - section: 'Remember'
        say: 'Land, labour, capital, entrepreneur go with rent, wages, interest, profit.'
        write: 'Rent, Wages, Interest, Profit'
      - section: 'Answer'
        say: 'So the reward on machinery and equipment is interest, which is option B.'
        write: '$\therefore$ interest'
        answer: true
    traps:
      A: 'You went for profit. That is the reward of the entrepreneur.'
      C: 'You chose rent. That is the reward for land.'
      D: 'You picked wages. That is the reward for labour, the human effort, not for machines.'
  50:
    moments:
      - section: 'The question'
        say: 'Look at the diagram. Government sets a minimum wage, W, above the market wage. What happens to jobs?'
        write: 'Minimum wage OW above equilibrium ⇒ ?'
      - section: 'The diagram'
        say: 'The wage rate is on the up axis and the quantity of labour on the across axis. D D is the demand for labour, from firms, and S S is the supply of labour, from workers.'
        write: 'DD = demand for labour; SS = supply of labour'
      - say: 'They cross at E, the equilibrium wage. The dashed line at W is the minimum wage, above E.'
        write: 'E = equilibrium; W above E'
      - section: 'The rule'
        say: 'A minimum wage above equilibrium is a price floor in the labour market.'
        write: 'Minimum wage = price floor for labour'
      - section: 'Read it'
        say: 'Follow the dashed line. It meets D D on the left. That is how many workers firms will hire at W.'
        write: 'W meets DD ⇒ labour demanded'
      - say: 'It meets S S further right. That is how many people want to work at W.'
        write: 'W meets SS ⇒ labour supplied'
      - say: 'More people want work than firms will hire. The gap between the two points is unemployment.'
        write: 'Supplied $>$ demanded ⇒ unemployment'
      - section: 'In Nigeria'
        say: 'When the national minimum wage rose, to thirty thousand naira in twenty nineteen and seventy thousand naira in twenty twenty-four, some small employers said they would hire fewer workers.'
        write: 'Minimum wage ₦30,000 (2019), ₦70,000 (2024)'
      - section: 'Remember'
        say: 'Wage floor above equilibrium, surplus of labour, unemployment.'
        write: 'Floor above E ⇒ surplus labour ⇒ unemployment'
      - section: 'Answer'
        say: 'So the minimum wage at W leads to unemployment, which is option B.'
        write: '$\therefore$ unemployment'
        answer: true
    traps:
      A: 'You went for full employment of resources. Above the equilibrium wage firms hire fewer workers, so resources are not fully employed.'
      C: 'You chose inflation. The diagram shows only the labour market, and it shows a surplus of labour, not rising prices.'
      D: 'You picked full employment of factors. Full employment of labour would be at E, not at a wage above it.'
