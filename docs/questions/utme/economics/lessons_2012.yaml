# UTME 2012 Economics, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Economics teacher works on the board:
# the question, the concept named, the definition or rule, how it works (or the calculation:
# data, formula, working, check), a Nigerian example, a way to remember it, and the answer.
#
#   say:     heard, not read. Money and percentages in words, symbols read as words
#            ("M P C", "P E D"), no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2012.yaml. Answers match that file. No question
# is dropped, so all 49 have a lesson.
format_version: 1
exam_year: 2012
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'Every economic system has a weak spot. What is the big weakness of a socialist economy?'
        write: 'Major disadvantage of a socialist economy?'
      - section: 'Name it'
        say: 'This is the socialist, or centrally planned, economy.'
        write: 'Socialist economy = centrally planned economy'
      - section: 'The rule'
        say: 'In a socialist economy the state owns the means of production, and a planning body decides what to produce, how, and for whom.'
        write: 'State owns resources; planners decide what, how, for whom'
      - section: 'How it works'
        say: 'Because planners decide what is made, buyers cannot steer production with their money. So consumer sovereignty, the power of buyers to decide what is produced, is lost.'
        write: 'Planners decide ⇒ consumer sovereignty lost'
      - say: 'That is why planned economies often have queues and shortages of the things people really want.'
        write: 'Result: queues and shortages'
      - section: 'In Nigeria'
        say: 'In our markets, if more people want tomatoes, the price rises and farmers grow more. Under full planning, the tomato quota would be fixed in an office.'
        write: 'Market: buyers steer output. Plan: an office does'
      - section: 'Remember'
        say: 'In a free market the consumer is king. In a planned economy the planner is king.'
        write: 'Free market: consumer is king. Plan: planner is king'
      - section: 'Answer'
        say: 'So the major disadvantage is that consumer sovereignty is lost, which is option B.'
        write: '$\therefore$ consumers'' sovereignty is lost'
        answer: true
    traps:
      A: 'You went for corruption. It can happen under any system, so it is not the special weakness of socialism.'
      C: 'You chose income inequality. Socialism tries to reduce inequality, so that is a criticism of capitalism instead.'
      D: 'You picked unemployment. Planned economies usually give everyone a job, so that is not their typical problem.'
  3:
    moments:
      - section: 'The question'
        say: 'Privatization will lead to efficient management of resources. Is that a fact we can test, or an opinion about what ought to be?'
        write: '"Privatization will lead to efficient management" is ___ reasoning'
      - section: 'Name it'
        say: 'This is about positive and normative statements.'
        write: 'Positive or normative?'
      - section: 'The rule'
        say: 'A positive statement says what is, was or will be, and we can check it against the facts.'
        write: 'Positive = what is, was or will be. Can be tested'
      - say: 'A normative statement says what ought to be. It carries a value judgement, with words like should or ought.'
        write: 'Normative = what ought to be. Opinion, "should"'
      - section: 'Test it'
        say: 'Our statement predicts a result. We can look at firms after privatization and see whether they are better run. There is no should in it.'
        write: 'A prediction, no "should" ⇒ testable ⇒ positive'
      - section: 'In Nigeria'
        say: 'The claim that privatizing the power companies would improve electricity can be checked by counting the hours of light people get.'
        write: 'Power privatization: count the hours of light'
      - section: 'Remember'
        say: 'Positive can be proved or disproved. Normative is a matter of opinion.'
        write: 'Positive: provable. Normative: opinion'
      - section: 'Answer'
        say: 'So the statement is positive reasoning, which is option D.'
        write: '$\therefore$ positive reasoning'
        answer: true
    traps:
      A: 'You went for normative. The word efficient sounds like praise, but there is no should here. It only predicts a result we can measure.'
      B: 'You chose inductive reasoning. That builds a general rule from many observed cases, and no cases are given here.'
      C: 'You picked deductive reasoning. That draws a conclusion from a general premise, and no premise is stated here.'
  4:
    moments:
      - section: 'The question'
        say: 'A line on a graph can slope up or slope down. Why does that sign matter to an economist?'
        write: 'Why does the sign of a slope matter?'
      - section: 'Name it'
        say: 'This is the slope of a graph, a basic tool of economic analysis.'
        write: 'Slope $= \dfrac{\text{change in } y}{\text{change in } x}$'
      - section: 'The rule'
        say: 'A positive slope means the two variables move in the same direction. That is a direct relationship.'
        write: 'Positive slope ⇒ same direction ⇒ direct relationship'
      - say: 'A negative slope means they move in opposite directions. That is an inverse relationship.'
        write: 'Negative slope ⇒ opposite directions ⇒ inverse relationship'
      - section: 'In Nigeria'
        say: 'When the price of garri rises, traders bring more to market, so supply slopes up. Buyers buy less, so demand slopes down.'
        write: 'Garri: supply slopes up, demand slopes down'
      - section: 'Remember'
        say: 'The sign tells the direction of the relationship. The size of the slope tells how strong it is.'
        write: 'Sign = direction; size = strength'
      - section: 'Answer'
        say: 'So the sign of the slope shows the relationship between the variables, which is option B.'
        write: '$\therefore$ it shows the relationship between variables'
        answer: true
    traps:
      A: 'You went for normal or inferior goods. That depends on how demand reacts to income, not on the sign of a slope.'
      C: 'You chose magnitude. The size of the slope shows how big the change is. The sign only shows its direction.'
      D: 'You picked units of measurement. Units are chosen before we draw. The slope cannot decide them.'
  5:
    moments:
      - section: 'The question'
        say: 'Look at the pie chart. Oil, agriculture and mining have their angles marked, but manufacturing does not. What percentage of GDP is manufacturing?'
        write: 'Manufacturing share of GDP $= ?$'
      - section: 'The chart'
        say: 'Look at the centre of the circle. Oil is one hundred and sixty degrees, agriculture ninety degrees, and mining thirty degrees.'
        write: 'Oil 160°, agriculture 90°, mining 30°, manufacturing ?'
      - section: 'The rule'
        say: 'The whole circle is three hundred and sixty degrees, and it stands for the whole GDP. A sector''s percentage is its angle over three hundred and sixty, times one hundred.'
        write: 'Share $= \dfrac{\text{angle}}{360^{\circ}} \times 100$'
      - section: 'The angle'
        say: 'First, the missing angle. Add the three marked angles. One hundred and sixty plus ninety plus thirty is two hundred and eighty degrees.'
        write: '$160^{\circ} + 90^{\circ} + 30^{\circ} = 280^{\circ}$'
      - say: 'Take that from three hundred and sixty. Manufacturing has eighty degrees.'
        write: 'Manufacturing $= 360^{\circ} - 280^{\circ} = 80^{\circ}$'
      - section: 'The percentage'
        say: 'Now eighty over three hundred and sixty, times one hundred.'
        write: '$\dfrac{80}{360} \times 100$'
      - say: 'That gives twenty-two point two per cent.'
        write: '$= 22.2\%$'
      - section: 'Check'
        say: 'Check. Oil is forty-four point four, agriculture twenty-five, mining eight point three, and manufacturing twenty-two point two. Together they make one hundred per cent.'
        write: '$44.4 + 25 + 8.3 + 22.2 \approx 100$ ✓'
      - section: 'Remember'
        say: 'Find the missing slice first, then divide by three hundred and sixty.'
        write: 'Missing angle first, then $\div 360 \times 100$'
      - section: 'Answer'
        say: 'So manufacturing contributes twenty-two point two per cent, which is option C.'
        write: '$\therefore$ 22.2%'
        answer: true
    traps:
      A: 'You went for sixty-seven point five per cent. No slice gives that, and eighty degrees is far less than half the circle.'
      B: 'You chose forty per cent. That needs an angle of one hundred and forty-four degrees, but manufacturing has eighty.'
      D: 'You picked twenty-five per cent. That is the agriculture slice, ninety out of three hundred and sixty, not manufacturing.'
  6:
    moments:
      - section: 'The question'
        say: 'The same pie chart, and now the GDP is sixty billion naira. How much bigger is the oil sector than manufacturing?'
        write: 'GDP $=$ ₦60 billion. Oil $-$ manufacturing $= ?$'
      - section: 'The chart'
        say: 'Look at the chart again. Oil is one hundred and sixty degrees. Manufacturing is what is left after oil, agriculture and mining.'
        write: 'Oil 160°, agriculture 90°, mining 30°'
      - say: 'Three hundred and sixty minus two hundred and eighty leaves eighty degrees for manufacturing.'
        write: 'Manufacturing $= 360^{\circ} - 280^{\circ} = 80^{\circ}$'
      - section: 'The rule'
        say: 'A sector''s value is its angle over three hundred and sixty, times the total GDP.'
        write: 'Value $= \dfrac{\text{angle}}{360} \times \text{GDP}$'
      - section: 'Oil'
        say: 'Oil is one hundred and sixty over three hundred and sixty, times sixty. That is about twenty-six point seven billion naira.'
        write: 'Oil $= \dfrac{160}{360} \times 60 = 26.7$ billion naira'
      - section: 'Manufacturing'
        say: 'Manufacturing is eighty over three hundred and sixty, times sixty. That is about thirteen point three billion naira.'
        write: 'Manufacturing $= \dfrac{80}{360} \times 60 = 13.3$ billion naira'
      - section: 'The difference'
        say: 'Twenty-six point seven minus thirteen point three is thirteen point three billion naira.'
        write: '$26.7 - 13.3 = 13.3$ billion naira'
      - section: 'Check'
        say: 'Check another way. The gap in angle is eighty degrees, and eighty over three hundred and sixty times sixty is also thirteen point three.'
        write: '$\dfrac{160 - 80}{360} \times 60 = 13.3$ ✓'
      - section: 'Remember'
        say: 'You can subtract the angles first, then value the gap in one step.'
        write: 'Subtract angles, then value the gap'
      - section: 'Answer'
        say: 'So the difference is thirteen point three billion naira, which is option B.'
        write: '$\therefore$ ₦13.3 billion'
        answer: true
    traps:
      A: 'You went for eleven point seven billion naira. That does not match the chart. The gap of eighty degrees is worth thirteen point three billion.'
      C: 'You chose twenty-one point seven billion naira. That does not come from the chart. Oil is twenty-six point seven and manufacturing thirteen point three.'
      D: 'You picked about twenty-six point six billion naira. That is roughly the oil sector by itself. You still need to take away manufacturing.'
  7:
    moments:
      - section: 'The question'
        say: 'The price of rice goes up and people buy less rice. Is that a change in demand, or something else?'
        write: 'Rice: 250 t to 200 t after a 2% price rise. A change in ?'
      - section: 'Name it'
        say: 'This is the difference between a change in quantity demanded and a change in demand.'
        write: 'Quantity demanded vs demand'
      - section: 'The rule'
        say: 'A change in the good''s own price causes a change in quantity demanded. We move along the same demand curve.'
        write: 'Own price changes ⇒ movement along the curve ⇒ quantity demanded'
      - say: 'A change in anything else, like income or tastes, causes a change in demand. The whole curve shifts.'
        write: 'Other factors change ⇒ shift of the curve ⇒ demand'
      - section: 'Apply it'
        say: 'Here only the price of rice changed. So buyers moved up along their demand curve, from two hundred and fifty tonnes to two hundred tonnes.'
        write: 'Only the price of rice changed ⇒ movement along'
      - section: 'In Nigeria'
        say: 'When a bag of rice costs more in the market, the same families buy fewer bags. Their demand has not changed, they have only moved to a higher price on it.'
        write: 'Dearer bag of rice ⇒ fewer bags bought'
      - section: 'Remember'
        say: 'Own price moves you along the curve. Anything else shifts the curve.'
        write: 'Own price: along. Anything else: shift'
      - section: 'Answer'
        say: 'So this is a change in quantity demanded, which is option D.'
        write: '$\therefore$ a change in quantity demanded'
        answer: true
    traps:
      A: 'You went for consumers'' income. Income did not change here. The price of rice did.'
      B: 'You chose demand. A change in demand shifts the curve and comes from factors other than the good''s own price.'
      C: 'You picked tastes. Nothing says tastes changed. The price rise alone explains the fall.'
  8:
    moments:
      - section: 'The question'
        say: 'People get a pay rise, and nothing else changes. What happens to the demand curve for a normal good?'
        write: 'Income rises, ceteris paribus, normal good. Demand curve?'
      - section: 'Name it'
        say: 'This is income as a determinant of demand.'
        write: 'Determinant of demand: income'
      - section: 'The rule'
        say: 'When a factor other than the good''s own price changes, the whole demand curve shifts.'
        write: 'Not own price ⇒ the curve shifts'
      - say: 'For a normal good, more income means more is demanded at every price. So the curve shifts to the right.'
        write: 'Normal good: income up ⇒ demand up ⇒ shift right'
      - section: 'The words'
        say: 'Ceteris paribus means other things being equal. So income is the only thing that changed.'
        write: 'Ceteris paribus = other things equal'
      - section: 'In Nigeria'
        say: 'When civil servants get a salary increase, more of them buy meat and fish at the same market prices. The demand for meat shifts right.'
        write: 'Salary increase ⇒ more meat bought at each price'
      - section: 'Remember'
        say: 'More income, more demand, the curve moves right.'
        write: 'Income up, curve right'
      - section: 'Answer'
        say: 'So a rise in income brings a rightward shift of the demand curve, which is option C.'
        write: '$\therefore$ a rightward shift of the demand curve'
        answer: true
    traps:
      A: 'You went for a movement along the curve. That comes only from a change in the good''s own price, and here it is income that changed.'
      B: 'You chose a leftward shift. That happens to an inferior good when income rises, but this is a normal good.'
      D: 'You picked no effect. Income is a determinant of demand, so changing it does move the curve.'
  9:
    moments:
      - section: 'The question'
        say: 'The price goes from fifty naira to seventy naira, and the quantity falls from five hundred to four hundred kilograms. How responsive are buyers?'
        write: 'Price ₦50 to ₦70, quantity 500 kg to 400 kg. PED $= ?$'
      - section: 'The data'
        say: 'The price rose by twenty naira from fifty. The quantity fell by one hundred kilograms from five hundred.'
        write: '$\Delta P = 20$ from 50, $\quad \Delta Q = 100$ from 500'
      - section: 'The rule'
        say: 'Price elasticity of demand, P E D, is the percentage change in quantity demanded over the percentage change in price.'
        write: '$\text{PED} = \dfrac{\%\,\Delta Q_d}{\%\,\Delta P}$'
      - section: 'Quantity'
        say: 'The percentage change in quantity is one hundred over five hundred, times one hundred. That is twenty per cent.'
        write: '$\%\,\Delta Q_d = \dfrac{100}{500} \times 100 = 20\%$'
      - section: 'Price'
        say: 'The percentage change in price is twenty over fifty, times one hundred. That is forty per cent.'
        write: '$\%\,\Delta P = \dfrac{20}{50} \times 100 = 40\%$'
      - section: 'Divide'
        say: 'Now twenty over forty. That is zero point five.'
        write: '$\text{PED} = \dfrac{20}{40} = 0.5$'
      - section: 'Check'
        say: 'Check. Price rose a lot, forty per cent, but quantity fell only twenty per cent. So demand is inelastic, and the answer must be below one. It is.'
        write: '$0.5 < 1$ ⇒ inelastic ✓'
      - section: 'In Nigeria'
        say: 'A trader selling beans at seventy naira instead of fifty still sells most of her stock. That is inelastic demand.'
        write: 'Beans at ₦70 still sell well'
      - section: 'Remember'
        say: 'Quantity on top, price at the bottom. Q over P.'
        write: 'Q over P'
      - section: 'Answer'
        say: 'So the price elasticity of demand is zero point five, which is option D.'
        write: '$\therefore \text{PED} = 0.5$'
        answer: true
    traps:
      A: 'You went for five. That divides the raw changes, one hundred over twenty, instead of the percentage changes.'
      B: 'You chose two. That puts the price change on top. The quantity change goes on top.'
      C: 'You picked one. That needs equal percentage changes, but quantity changed by twenty per cent and price by forty.'
  10:
    moments:
      - section: 'The question'
        say: 'The price rises by eight per cent, and quantity hardly moves, from fifteen hundred to fourteen ninety-two. What kind of demand is this?'
        write: 'Price up 8%, quantity 1500 to 1492. Demand is ?'
      - section: 'The rule'
        say: 'Demand is inelastic when the percentage change in quantity is smaller than the percentage change in price. Then P E D is less than one.'
        write: 'Inelastic: $\%\,\Delta Q_d < \%\,\Delta P$, so $0 < \text{PED} < 1$'
      - section: 'Quantity'
        say: 'Quantity fell by eight units out of fifteen hundred.'
        write: '$\Delta Q = 1500 - 1492 = 8$'
      - say: 'Eight over fifteen hundred, times one hundred, is about zero point five three per cent.'
        write: '$\%\,\Delta Q_d = \dfrac{8}{1500} \times 100 \approx 0.53\%$'
      - section: 'Divide'
        say: 'P E D is zero point five three over eight, which is about zero point zero seven.'
        write: '$\text{PED} = \dfrac{0.53}{8} \approx 0.07$'
      - section: 'Check'
        say: 'Zero point zero seven is less than one, so demand is inelastic. It is not zero, because quantity did fall a little.'
        write: '$0 < 0.07 < 1$ ⇒ inelastic ✓'
      - section: 'In Nigeria'
        say: 'Salt behaves like this. Even when its price rises, people buy almost as much as before.'
        write: 'Salt: price up, almost the same bought'
      - section: 'Remember'
        say: 'Inelastic means buyers hardly react. Elastic means they react strongly.'
        write: 'Inelastic: hardly react. Elastic: react strongly'
      - section: 'Answer'
        say: 'So the demand is inelastic, which is option B.'
        write: '$\therefore$ inelastic'
        answer: true
    traps:
      A: 'You went for perfectly elastic. That would mean an enormous response, but these buyers barely reacted.'
      C: 'You chose elastic. That needs a bigger percentage change in quantity than in price, and zero point five three is far below eight.'
      D: 'You picked perfectly inelastic. That needs no change at all in quantity, but it fell by eight units.'
  11:
    moments:
      - section: 'The question'
        say: 'Can we say a plate of jollof rice gives Ade more satisfaction than it gives Ngozi? Why not?'
        write: 'Why can''t we compare utility between people?'
      - section: 'Name it'
        say: 'This is utility and how it is measured.'
        write: 'Utility = satisfaction from consuming a good'
      - section: 'The rule'
        say: 'Utility is a feeling in a person''s own mind. So it is subjective.'
        write: 'Utility is subjective, in each person''s mind'
      - section: 'How it works'
        say: 'Each person feels satisfaction in their own way. There is no common yardstick that can measure two minds against each other.'
        write: 'No common yardstick between two minds'
      - section: 'In Nigeria'
        say: 'Two students buy the same bottle of malt at the same price. One enjoys it far more, but nobody can measure the difference.'
        write: 'Same malt, different satisfaction'
      - section: 'Remember'
        say: 'Utility lives in the mind, so it cannot be taken out and compared.'
        write: 'Utility lives in the mind'
      - section: 'Answer'
        say: 'So the comparison is impossible because utility is subjectively determined, which is option C.'
        write: '$\therefore$ utility is subjectively determined'
        answer: true
    traps:
      A: 'You went for utils. Utils are only an imaginary unit for one person''s choices, so they cannot make comparison between people possible.'
      B: 'You chose that marginal utility is not observable. Total utility is not observable either. The real reason is that all utility is subjective.'
      D: 'You picked different incomes. Income changes what people can buy, not whether their satisfaction can be compared.'
  12:
    moments:
      - section: 'The question'
        say: 'The total utility curve is getting flatter. How can the consumer make his marginal utility go up?'
        write: 'Slope of TU declining. MU rises if he ?'
      - section: 'Name it'
        say: 'This is the link between total utility and marginal utility, and the law of diminishing marginal utility.'
        write: 'TU, MU and diminishing marginal utility'
      - section: 'The rule'
        say: 'Marginal utility is the extra satisfaction from one more unit. It is the slope of the total utility curve.'
        write: 'MU $=$ slope of TU'
      - section: 'How it works'
        say: 'When the slope of total utility is declining, each extra unit adds less than the one before. So M U falls as he consumes more.'
        write: 'Slope falling ⇒ more units, lower MU'
      - say: 'Turn that round. If he consumes fewer units, the last unit is worth more to him, so M U rises.'
        write: 'Fewer units ⇒ higher MU'
      - section: 'In Nigeria'
        say: 'On a hot afternoon the first sachet of pure water is wonderful, and the fifth is worth very little. Drink fewer, and the last one is worth more.'
        write: 'Pure water: first sachet great, fifth hardly worth it'
      - section: 'Remember'
        say: 'More units, lower M U. Fewer units, higher M U.'
        write: 'More units, lower MU. Fewer units, higher MU'
      - section: 'Answer'
        say: 'So marginal utility rises if he reduces the quantity consumed, which is option B.'
        write: '$\therefore$ he reduces the quantity consumed'
        answer: true
    traps:
      A: 'You went for stopping. Stopping leaves marginal utility where it is. It does not make it rise.'
      C: 'You chose consuming more. That is exactly what makes marginal utility fall when the slope of total utility is declining.'
      D: 'You picked another commodity. In this theory, buying another good does not change the marginal utility of this one.'
  13:
    moments:
      - section: 'The question'
        say: 'Look at the diagram. A straight budget line, two indifference curves, and four points, N, P, K and M. Where is the consumer happiest?'
        write: 'Consumer equilibrium at which point?'
      - section: 'The diagram'
        say: 'The straight line is the budget line. Every point on it costs exactly his income. The lower curve is I C one and the higher curve is I C two.'
        write: 'Budget line, IC₁ (lower), IC₂ (higher)'
      - section: 'The rule'
        say: 'A consumer is at equilibrium where the budget line just touches the highest indifference curve he can reach. The line is tangent to the curve there.'
        write: 'Equilibrium: budget line tangent to the highest IC'
      - section: 'Look at the points'
        say: 'N and M are on the budget line, so he can afford them. But they are on the lower curve, I C one, where the line cuts through it.'
        write: 'N, M: affordable, but on IC₁'
      - say: 'P is inside the budget line, so he would be leaving money unspent.'
        write: 'P: inside the line, money unspent'
      - say: 'At K the budget line just touches I C two, the highest curve he can reach. No affordable point does better.'
        write: 'K: line touches IC₂, the highest he can reach'
      - section: 'In Nigeria'
        say: 'A student sharing one thousand naira between bread and eggs tries different mixes until no other mix she can afford makes her happier. That mix is her K.'
        write: '₦1,000 on bread and eggs: the best affordable mix'
      - section: 'Remember'
        say: 'Equilibrium is where the line kisses the highest curve.'
        write: 'The line kisses the highest curve'
      - section: 'Answer'
        say: 'So the consumer is at equilibrium at point K, which is option D.'
        write: '$\therefore$ K'
        answer: true
    traps:
      A: 'You went for N. He can afford it, but the line cuts I C one there, so moving along the line takes him to a higher curve.'
      B: 'You chose P. It is inside the budget line, so he is not spending all his income.'
      C: 'You picked M. He can afford it, but it is on the lower curve, I C one.'
  14:
    moments:
      - section: 'The question'
        say: 'Look at the diagram again. The consumer moves from M to K along his budget line. What must he change?'
        write: 'From M to K, he must increase ?'
      - section: 'The diagram'
        say: 'Y is on the up axis and X is on the across axis. M is low and to the right. K is higher and to the left.'
        write: 'M: low, right. K: higher, left'
      - section: 'The rule'
        say: 'Along one budget line, income and prices are fixed. So buying more of one good means buying less of the other.'
        write: 'Same budget line ⇒ more of one, less of the other'
      - section: 'Read it'
        say: 'Going up from M to K means more Y.'
        write: 'Up ⇒ more Y'
      - say: 'Going left from M to K means less X.'
        write: 'Left ⇒ less X'
      - section: 'In Nigeria'
        say: 'With fixed pocket money of two thousand naira, a student who wants more suya must buy fewer soft drinks.'
        write: 'Fixed ₦2,000: more suya, fewer drinks'
      - section: 'Remember'
        say: 'Up the line means more Y. Left along the line means less X.'
        write: 'Up: more Y. Left: less X'
      - section: 'Answer'
        say: 'So he increases his consumption of Y and reduces his consumption of X, which is option D.'
        write: '$\therefore$ more Y, less X'
        answer: true
    traps:
      A: 'You went for more X and less Y. That is the move from K to M, the opposite direction.'
      B: 'You chose more spending on both. On one budget line total spending is fixed, so both cannot rise together.'
      C: 'You picked more spending on X. Moving left means less X, so spending on X falls.'
  15:
    moments:
      - section: 'The question'
        say: 'Four things that touch cocoa. Which one acts on the supply of cocoa, the farmer''s side?'
        write: 'The supply of cocoa is influenced by ?'
      - section: 'Name it'
        say: 'This is the determinants of supply.'
        write: 'Determinants of supply'
      - section: 'The rule'
        say: 'Supply is the quantity producers are willing and able to offer at each price. Besides price, it depends on weather and season, costs and technology.'
        write: 'Supply depends on: weather and season, costs, technology'
      - section: 'How it works'
        say: 'Cocoa is a tree crop. A good rainy season gives a big harvest, and a dry year gives a poor one. So seasonal conditions shift the supply of cocoa.'
        write: 'Good season ⇒ big harvest. Poor season ⇒ small harvest'
      - section: 'Sort them'
        say: 'The incomes of cocoa drinkers, the demand for beverages and close substitutes all act on buyers. They are demand factors.'
        write: 'Incomes, beverages, substitutes ⇒ demand side'
      - section: 'In Nigeria'
        say: 'Cocoa farmers in Ondo bring in their main crop from about October. A poor rainy season means fewer bags for the buying agents.'
        write: 'Ondo cocoa: poor rains, fewer bags'
      - section: 'Remember'
        say: 'Supply comes from the farm. Demand comes from the buyers.'
        write: 'Supply: the farm. Demand: the buyers'
      - section: 'Answer'
        say: 'So the supply of cocoa is influenced by seasonal conditions, which is option A.'
        write: '$\therefore$ seasonal conditions'
        answer: true
    traps:
