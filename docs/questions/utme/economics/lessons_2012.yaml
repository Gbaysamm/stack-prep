      - say: 'While the L R A C is rising, it touches each S R A C on its rising part.'
        write: 'LRAC rising ⇒ touches rising parts'
      - say: 'Only at the very bottom of the L R A C does it touch an S R A C at that curve''s own minimum. That is the optimum plant.'
        write: 'Lowest point: one SRAC touched at its minimum'
      - section: 'In Nigeria'
