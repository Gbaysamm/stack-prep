        say: 'When government builds a road, the contractor pays workers, the workers buy food, and the food sellers buy cloth. The first two million keeps creating income.'
        write: 'Road project ⇒ wages ⇒ food ⇒ cloth ⇒ ...'
      - section: 'Remember'
        say: 'Multiplier first, then times the injection.'
        write: 'Find $k$, then $k \times \Delta I$'
      - section: 'Answer'
        say: 'So the change in income is eight million naira, which is option D.'
        write: '$\therefore \Delta Y =$ ₦8.0 million'
        answer: true
    traps:
      A: 'You went for zero point five million. That is only the first round of saving, a quarter of two million.'
      B: 'You chose one point five million. That is only the first round of spending, zero point seven five times two million.'
      C: 'You picked two point six million. That does not come from the multiplier. Four times two million is eight million.'
