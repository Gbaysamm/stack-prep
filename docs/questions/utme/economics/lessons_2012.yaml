        say: 'Now four times two million naira is eight million naira.'
        write: '$\Delta Y = 4 \times 2 = 8$ million naira'
      - section: 'Check'
        say: 'Check. People spend seventy-five kobo of every extra naira, so the new spending goes round again and again. Income must rise by more than two million, and it does.'
        write: '$8 > 2$ ✓'
