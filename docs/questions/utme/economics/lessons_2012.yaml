      - section: 'Name it'
        say: 'This is the investment multiplier.'
        write: 'The multiplier, $k$'
      - section: 'The rule'
        say: 'The multiplier k equals one over one minus the M P C. The change in income is k times the change in investment.'
        write: '$k = \dfrac{1}{1 - \text{MPC}}, \quad \Delta Y = k \times \Delta I$'
