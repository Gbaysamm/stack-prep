# UTME 2013 Economics, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Economics teacher works on the board:
# the question, the concept named, the rule or definition, how it works as cause and effect (or
# the calculation, with data, formula, working and check), a Nigerian example, a way to remember
# it, and the answer. Where a question has a graph, the lesson says what to look at in it.
#
#   say:     heard, not read. Symbols read as words, money in words, no symbols the voice
#            would stop on.
#   write:   the one line written while it is said.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2013.yaml. Answers match that file. No question
# is dropped, so all 49 have a lesson.
format_version: 1
exam_year: 2013
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'Some economies leave everything to private firms, and some leave everything to the state. What do we call one where both work together?'
        write: 'Public + private sectors together = ?'
      - section: 'Name it'
        say: 'This is the mixed economy, one of the three main economic systems.'
        write: 'Mixed economy'
      - section: 'The rule'
        say: 'In a mixed economy, both the government and private individuals own resources and take part in production.'
        write: 'Public sector + private sector both produce'
      - section: 'How it works'
        say: 'The government provides things the market leaves out, like roads, defence and power. Private firms produce most goods for profit.'
        write: 'Government → roads, defence, power;  private firms → most goods'
      - section: 'In Nigeria'
        say: 'Nigeria is a mixed economy. The government owns the N N P C and builds federal roads, while private firms and market traders run most of production.'
        write: 'Nigeria: NNPC, federal roads + Dangote, Onitsha traders'
      - section: 'Remember'
        say: 'Remember, mixed means both hands on the wheel, the government and the private sector.'
        write: 'Mixed = both hands on the wheel'
      - section: 'Answer'
        say: 'So an economy where both sectors drive growth is a mixed economy, which is option D.'
        write: '$\therefore$ mixed economy'
        answer: true
    traps:
      A: 'You went for feudal. A feudal economy rests on lords and serfs working the land, not on a public and private partnership.'
      B: 'You chose capitalist. Capitalism leaves production mainly to private owners, with little role for the state.'
      C: 'You picked socialist. Socialism puts the main resources in the hands of the state, with little private enterprise.'
  3:
    moments:
      - section: 'The question'
        say: 'We know the standard deviation is fifty-three. How do we get the variance from it?'
        write: 'S.D. $= 53$, variance $= ?$'
      - section: 'Name it'
        say: 'The variance and the standard deviation are both measures of dispersion, how spread out data are.'
        write: 'Measures of dispersion'
      - section: 'The rule'
        say: 'The standard deviation is the square root of the variance. So the variance is the standard deviation squared.'
        write: 'Variance $= (\text{S.D.})^2$'
      - section: 'The working'
        say: 'Put in fifty-three. The variance is fifty-three squared.'
        write: '$\sigma^2 = 53^2$'
      - say: 'Fifty-three times fifty-three is two thousand, eight hundred and nine.'
        write: '$53 \times 53 = 2{,}809$'
      - section: 'Check'
        say: 'Check. Three times three is nine, so fifty-three squared must end in nine. And the square root of two thousand, eight hundred and nine is fifty-three. Good.'
        write: '$\sqrt{2{,}809} = 53$ ✓'
      - section: 'Remember'
        say: 'Remember, the S D is the root and the variance is the square.'
        write: 'S.D. = root, variance = square'
      - section: 'Answer'
        say: 'So the variance is two thousand, eight hundred and nine, which is option B.'
        write: '$\therefore$ variance $= 2{,}809$'
        answer: true
    traps:
      A: 'You went for two thousand and eighty-two. That is not fifty-three squared. Multiply it out and you get two thousand, eight hundred and nine.'
      C: 'You chose two thousand, eight hundred and eight. That is one short. Three times three is nine, so the square must end in nine.'
      D: 'You picked two thousand, two hundred and nine. That is forty-seven squared, not fifty-three squared.'
  4:
    moments:
      - section: 'The question'
        say: 'Some averages and spreads are just for describing data. Which pair can we build further work on?'
        write: 'Tools for further analysis?'
      - section: 'Name it'
        say: 'This is about measures of central tendency and dispersion.'
        write: 'Central tendency and dispersion'
      - section: 'The rule'
        say: 'A measure is good for further work when it uses every value and can be put into other formulae.'
        write: 'Uses every value + works in formulae'
      - section: 'How it works'
        say: 'The mean uses every value, and it is the base for the variance, correlation and regression.'
        write: 'Mean → variance, correlation, regression'
      - say: 'The standard deviation also uses every value, and it is used in sampling and in comparing spreads. The mode and the median only look at frequency or position.'
        write: 'S.D. uses every value;  mode, median do not'
      - section: 'In Nigeria'
        say: 'The National Bureau of Statistics reports mean incomes with their standard deviations, so economists can compare states and build models.'
        write: 'NBS: mean income ± S.D.'
      - section: 'Remember'
        say: 'Remember, the mean and the S D are the pair that does algebra.'
        write: 'Mean + S.D. = the algebra pair'
      - section: 'Answer'
        say: 'So the tools for further economic analysis are the mean and the standard deviation, which is option C.'
        write: '$\therefore$ mean and standard deviation'
        answer: true
    traps:
      A: 'You went for the median and standard deviation. The standard deviation fits, but the median only depends on the middle position.'
      B: 'You chose the mean and mode. The mean fits, but the mode is only the most frequent value and cannot be used in further algebra.'
      D: 'You picked the mode and median. Neither of them uses every value, so neither is used in further calculation.'
  5:
    moments:
      - section: 'The question'
        say: 'The range is the simplest way to measure spread. So what is good about it?'
        write: 'Advantage of the range?'
      - section: 'Name it'
        say: 'The range is a measure of dispersion.'
        write: 'Range, a measure of dispersion'
      - section: 'The rule'
        say: 'The range is the highest value minus the lowest value.'
        write: 'Range = highest − lowest'
      - section: 'How it works'
        say: 'It needs only two numbers and one subtraction, so it is simple to calculate and easy to understand.'
        write: '2 numbers, 1 subtraction → quick and easy'
      - say: 'But the same fact is its weakness. It ignores every value in between, and one extreme value changes it completely.'
        write: 'Weakness: ignores the middle, upset by extremes'
      - section: 'In Nigeria'
        say: 'If a paint bucket of garri sells from one thousand two hundred naira to one thousand eight hundred naira in a week, the range is six hundred naira.'
        write: '₦1,800 − ₦1,200 = ₦600'
      - section: 'Remember'
        say: 'Remember, the range is quick, but it only sees the two ends.'
        write: 'Quick, but sees only the ends'
      - section: 'Answer'
        say: 'So the advantage of the range is that it is simple to calculate and easy to understand, which is option A.'
        write: '$\therefore$ simple to calculate and understand'
        answer: true
    traps:
      B: 'You chose makes use of all values. The range uses only two values, the highest and the lowest.'
      C: 'You picked not affected by extreme values. The range is made from the two extreme values, so they affect it most of all.'
      D: 'You went for useful for further calculation. That is the standard deviation, not the range.'
  6:
    moments:
      - section: 'The question'
        say: 'Here are nine numbers in a jumble. Which one sits in the middle? Many students pick the middle of the list as printed, and that is the trap.'
        write: '35, 10, 14, 38, 15, 18, 22, 30, 28.  Median $= ?$'
      - section: 'The rule'
        say: 'The median is the middle value when the data are arranged in order of size.'
        write: 'Median = middle value in order'
      - section: 'Arrange'
        say: 'First, arrange them from smallest to largest.'
        write: '10, 14, 15, 18, 22, 28, 30, 35, 38'
      - section: 'Count'
        say: 'There are nine values, so n is nine.'
        write: '$n = 9$'
      - section: 'The position'
        say: 'The median is the n plus one over two th value. Nine plus one is ten, and ten over two is five. So we want the fifth value.'
        write: 'Position $= \dfrac{n+1}{2} = \dfrac{9+1}{2} = 5$th'
      - say: 'Count along to the fifth value. Ten, fourteen, fifteen, eighteen, twenty-two.'
        write: '5th value $= 22$'
      - section: 'Check'
        say: 'Check. Four values lie below twenty-two and four lie above it. Good.'
        write: '4 below, 4 above ✓'
      - section: 'Remember'
        say: 'Remember, line them up first, then pick the middle.'
        write: 'Order first, then the middle'
      - section: 'Answer'
        say: 'So the median is twenty-two, which is option D.'
        write: '$\therefore$ median $= 22$'
        answer: true
    traps:
      A: 'You went for ten. That is the smallest value, not the middle one.'
      B: 'You chose thirty-eight. That is the largest value, at the very end of the list.'
      C: 'You picked thirty-five. In order it is the eighth value, well above the middle.'
  7:
    moments:
      - section: 'The question'
        say: 'Buyers suddenly want more, but sellers have not changed. What happens to the price and the quantity?'
        write: 'Demand ↑, supply unchanged → price? quantity?'
      - section: 'Name it'
        say: 'This is the effect of a change in demand on equilibrium.'
        write: 'Change in demand and equilibrium'
      - section: 'The rule'
        say: 'An increase in demand shifts the demand curve to the right, along the same supply curve.'
        write: 'D shifts right, S stays'
      - section: 'How it works'
        say: 'At the old price, buyers now want more than sellers offer. That shortage pushes the price up.'
        write: 'Old price → shortage → price ↑'
      - say: 'The higher price draws out a larger quantity from sellers. So the quantity traded rises too.'
        write: 'Price ↑ → quantity supplied ↑'
      - section: 'In Nigeria'
        say: 'When schools resume in September, demand for exercise books rises, and they sell at higher prices and in larger numbers.'
        write: 'September: exercise books, price ↑ and quantity ↑'
      - section: 'Remember'
        say: 'Remember, demand up, price up and quantity up.'
        write: 'D ↑ ⇒ P ↑, Q ↑'
      - section: 'Answer'
        say: 'So an increase in demand raises both the equilibrium price and quantity, which is option B.'
        write: '$\therefore$ price ↑ and quantity ↑'
        answer: true
    traps:
      A: 'You went for price down and quantity up. That comes from an increase in supply, not demand.'
      C: 'You chose both falling. That is what a decrease in demand does.'
      D: 'You picked price up and quantity down. That comes from a fall in supply.'
  8:
    moments:
      - section: 'The question'
        say: 'The price of a good goes up. Does demand change, or something else? The words matter here.'
        write: 'Price ↑ → ?'
      - section: 'Name it'
        say: 'This is the law of demand.'
        write: 'Law of demand'
      - section: 'The rule'
        say: 'Other things being equal, the higher the price, the smaller the quantity demanded.'
        write: 'Price ↑ ⇒ quantity demanded ↓ (ceteris paribus)'
      - section: 'How it works'
        say: 'A change in the good''s own price moves the buyer along the same demand curve. We call that a change in quantity demanded.'
        write: 'Own price → movement along the curve'
      - say: 'A change in demand itself is a shift of the whole curve, and it comes from other things like income or tastes.'
        write: 'Income, tastes → shift of the curve'
      - section: 'In Nigeria'
        say: 'When the pump price of petrol rose, many motorists bought fewer litres. That is a fall in quantity demanded.'
        write: 'Petrol price ↑ → fewer litres bought'
      - section: 'Remember'
        say: 'Remember, own price moves you along the curve, and anything else shifts the curve.'
        write: 'Own price = along;  others = shift'
      - section: 'Answer'
        say: 'So a rise in price causes a decrease in the quantity demanded, which is option A.'
        write: '$\therefore$ quantity demanded ↓'
        answer: true
    traps:
      B: 'You went for an increase in demand. A higher price does not raise demand. Buyers take less.'
      C: 'You chose an increase in quantity demanded. It is the other way round. A higher price means less is bought.'
      D: 'You picked a decrease in demand. Less is bought, yes, but the good''s own price moves you along the curve. A decrease in demand is a shift caused by other things.'
  9:
    moments:
      - section: 'The question'
        say: 'The price of a bicycle falls, and people buy a lot more. How strongly did they respond?'
        write: '₦120 → ₦80;  300 → 500 units;  PED $= ?$'
      - section: 'The data'
        say: 'The old price P one is one hundred and twenty naira and the new price P two is eighty naira. The old quantity Q one is three hundred and the new quantity Q two is five hundred.'
        write: '$P_1 = 120,\ P_2 = 80,\ Q_1 = 300,\ Q_2 = 500$'
      - section: 'The rule'
        say: 'Price elasticity of demand, P E D, is the percentage change in quantity demanded over the percentage change in price.'
        write: '$\text{PED} = \dfrac{\%\,\Delta Q_d}{\%\,\Delta P}$'
      - section: 'Quantity'
        say: 'Quantity rose by two hundred, out of three hundred. Two hundred over three hundred times one hundred is sixty-six point seven per cent.'
        write: '$\%\,\Delta Q_d = \dfrac{500 - 300}{300} \times 100 = 66.7\%$'
      - section: 'Price'
        say: 'Price fell by forty, out of one hundred and twenty. Forty over one hundred and twenty times one hundred is thirty-three point three per cent.'
        write: '$\%\,\Delta P = \dfrac{80 - 120}{120} \times 100 = -33.3\%$'
      - section: 'Divide'
        say: 'Now divide. Sixty-six point seven over thirty-three point three is two. We ignore the minus sign.'
        write: '$\text{PED} = \dfrac{66.7}{33.3} = 2.0$'
      - section: 'Check'
        say: 'Check. The quantity changed by twice as large a share as the price, so demand is elastic and P E D is more than one. Good.'
        write: '$2.0 > 1$, elastic ✓'
      - section: 'In Nigeria'
        say: 'The seller''s revenue went from thirty-six thousand naira to forty thousand naira. With elastic demand, a price cut raises revenue.'
        write: '$120 \times 300 = 36{,}000 \to 80 \times 500 = 40{,}000$'
      - section: 'Remember'
        say: 'Remember, quantity on top and price below.'
        write: 'Q on top, P below'
      - section: 'Answer'
        say: 'So the elasticity of demand for bicycles is two point zero, which is option D.'
        write: '$\therefore$ PED $= 2.0$'
        answer: true
    traps:
      A: 'You went for sixty-six point seven. That is only the percentage change in quantity. It still has to be divided by the change in price.'
      B: 'You chose zero point five. That turns the formula upside down. Quantity goes on top.'
      C: 'You picked one point five. That mixes bases. Use the original quantity and the original price for both changes.'
  10:
    moments:
      - section: 'The question'
        say: 'Look at the graph. The demand curve D stands straight up at quantity Q. What does that tell us about elasticity?'
        write: 'Vertical demand curve D at Q.  PED $= ?$'
      - section: 'Look at the graph'
        say: 'Follow the line D from top to bottom. Whatever the price, the quantity stays at O Q.'
        write: 'Any price → same quantity OQ'
      - section: 'Name it'
        say: 'This is perfectly inelastic demand.'
        write: 'Perfectly inelastic demand'
      - section: 'The rule'
        say: 'Demand is perfectly inelastic when quantity demanded does not change at all as price changes. Then P E D is zero.'
        write: 'PED $= 0$'
      - section: 'How it works'
        say: 'The percentage change in quantity is zero. Zero divided by any change in price is still zero.'
        write: '$\text{PED} = \dfrac{0}{\%\,\Delta P} = 0$'
      - section: 'In Nigeria'
        say: 'A diabetic patient in Lagos needs the same dose of insulin every day. If the price goes up, the dose bought stays the same.'
        write: 'Insulin: same dose at any price'
      - section: 'Remember'
        say: 'Remember, vertical is like a wall that does not budge. Horizontal flies off to infinity.'
        write: 'Vertical = 0;  horizontal = ∞'
      - section: 'Answer'
        say: 'So a vertical demand curve is perfectly inelastic, which is option C.'
        write: '$\therefore$ perfectly inelastic'
        answer: true
    traps:
      A: 'You went for unitary elasticity. That curve bends like a rectangular hyperbola. It is not a straight vertical line.'
      B: 'You chose perfectly elastic. That demand curve is horizontal, the opposite of this one.'
      D: 'You picked fairly inelastic. That curve is steep but still slopes down. A vertical line shows no response at all.'
  11:
    moments:
      - section: 'The question'
        say: 'There are two ways to study utility, by counting it or by ranking it. Which option belongs to the counting way?'
        write: 'An assumption of the cardinalist approach?'
      - section: 'Name it'
        say: 'This is the cardinal utility approach, linked to Alfred Marshall.'
        write: 'Cardinal utility (Marshall)'
      - section: 'The rule'
        say: 'The cardinalists assume utility can be measured in units called utils, and that marginal utility diminishes.'
        write: 'Utility measurable in utils;  MU diminishes'
      - say: 'They also assume the marginal utility of money is constant, and that total utility depends on the quantities consumed.'
        write: 'MU of money constant;  TU depends on quantities'
      - section: 'How it works'
        say: 'Because utility can be counted and added, the more of a good you consume, the more total utility you get, but by smaller and smaller amounts.'
        write: 'TU = sum of the utils from each unit'
      - section: 'In Nigeria'
        say: 'A student eating plates of jollof rice could score each plate in utils. Her total utility depends on how many plates she eats.'
        write: 'Jollof rice: TU depends on plates eaten'
      - section: 'Remember'
        say: 'Remember, cardinal means counting, one, two, three. Ordinal means ranking, first, second, third.'
        write: 'Cardinal = count;  ordinal = rank'
      - section: 'Answer'
        say: 'So the cardinalist assumption here is that total utility depends on the quantity of the commodities consumed, which is option C.'
        write: '$\therefore$ TU depends on quantity consumed'
        answer: true
    traps:
      A: 'You went for diminishing marginal rate of substitution. That belongs to the ordinal, indifference curve approach.'
      B: 'You chose consistency and transitivity of choice. Those are ordinal assumptions about ranking.'
      D: 'You picked unstable marginal utility of money. The cardinalists assume it is constant.'
  12:
    moments:
      - section: 'The question'
        say: 'You buy a cold drink on a hot day. When exactly do you feel satisfied?'
        write: 'Utility = satisfaction from the ... ?'
      - section: 'Name it'
        say: 'This is utility.'
        write: 'Utility'
      - section: 'The rule'
        say: 'Utility is the satisfaction a consumer gets from using or consuming goods and services.'
        write: 'Utility = satisfaction from use'
      - section: 'How it works'
        say: 'We want goods because using them satisfies a want. The satisfaction comes when the good is used, not when it is made or sold.'
        write: 'Want → use → satisfaction'
      - section: 'In Nigeria'
        say: 'The relief you feel when you drink a cold sachet of water on a hot afternoon in Kaduna is utility.'
        write: 'Cold sachet water in Kaduna heat'
      - section: 'Remember'
        say: 'Remember, utility comes from use.'
        write: 'Utility ← use'
      - section: 'Answer'
        say: 'So utility is the satisfaction derived from the use of goods and services, which is option B.'
        write: '$\therefore$ use of goods and services'
        answer: true
    traps:
      A: 'You went for distribution. Moving goods to buyers gives no satisfaction until they are used.'
      C: 'You chose demand. Demand is the desire backed by ability to pay. The satisfaction comes later, when you use the good.'
      D: 'You picked production. Production creates utility in goods, but the satisfaction is felt when they are used.'
  13:
    moments:
      - section: 'The question'
        say: 'Look at the graph. There are three curves and five points. Which point would a consumer choose?'
        write: 'Points F, S, M, K on curves I₁, I₂, I₃.  Best?'
      - section: 'Name it'
        say: 'These are indifference curves, and together they make an indifference map.'
        write: 'Indifference map'
      - section: 'The rule'
        say: 'Each indifference curve joins combinations that give the same satisfaction. A curve further from the origin gives more satisfaction.'
        write: 'Further from 0 ⇒ more satisfaction'
      - section: 'Look at the graph'
        say: 'Find the highest curve. I three is furthest from the origin, then I two, then I one.'
        write: 'I₃ > I₂ > I₁'
      - say: 'Now place the points. S is on I three. M and N are on I two. F is between I one and I two, and K is below I one.'
        write: 'S on I₃;  M, N on I₂;  F between;  K below I₁'
      - section: 'In Nigeria'
        say: 'A student sharing her pocket money between bread and akara will always choose the mix on the highest curve, because it gives her the most.'
        write: 'Bread and akara: choose the highest curve'
      - section: 'Remember'
        say: 'Remember, the further out, the better off.'
        write: 'Further out = better off'
      - section: 'Answer'
        say: 'So the consumer prefers combination S, on the highest curve, which is option B.'
        write: '$\therefore$ S'
        answer: true
    traps:
      A: 'You went for F. F lies between I one and I two, below the curve that S is on.'
      C: 'You chose M. It sits high on the page, but it is on I two, a lower curve than I three.'
      D: 'You picked K. K is below I one, the lowest curve of all.'
  14:
    moments:
      - section: 'The question'
        say: 'Sellers bring more or less to market for many reasons. Which of these is a real cause of a change in supply?'
        write: 'A factor that changes supply?'
      - section: 'Name it'
        say: 'This is a determinant of supply, the cost of production.'
        write: 'Determinants of supply: cost of production'
      - section: 'The rule'
        say: 'Supply depends on price, the cost of production, technology, other prices, the weather and government policy.'
        write: 'Price, cost, technology, other prices, weather, policy'
      - section: 'How it works'
        say: 'The cost of storage is part of the cost of production. When it rises, each unit costs more, so sellers supply less at every price.'
        write: 'Storage cost ↑ → cost of production ↑ → supply ↓'
      - section: 'In Nigeria'
        say: 'When cold room charges rise in Lagos markets, fish and tomato sellers bring less to market at every price.'
        write: 'Cold room charges ↑ → less fish, tomatoes'
      - section: 'Remember'
        say: 'Remember, cost up, supply down.'
        write: 'Cost ↑, supply ↓'
      - section: 'Answer'
        say: 'So a major factor that changes supply is the cost of storage, which is option C.'
        write: '$\therefore$ the cost of storage'
        answer: true
    traps:
      A: 'You went for market discrimination. That is about charging buyers different prices, not a cause of changes in supply.'
      B: 'You chose availability of storage. It matters, but it is the cost of storage, a cost of production, that shifts supply.'
      D: 'You picked incentives to workers. That is about managing staff, not a major factor in market supply.'
  15:
    moments:
      - section: 'The question'
        say: 'We have a supply equation and a price of fourteen naira. How many units will be supplied?'
        write: '$P = \dfrac{1}{4}(Q_s + 10)$,  $P = 14$,  $Q_s = ?$'
      - section: 'The rule'
        say: 'To find quantity supplied at a price, put the price into the equation and solve for Q s.'
        write: 'Substitute $P$, solve for $Q_s$'
      - section: 'Substitute'
        say: 'Put fourteen in place of P. Fourteen equals one quarter of Q s plus ten.'
        write: '$14 = \dfrac{1}{4}(Q_s + 10)$'
      - section: 'Clear the fraction'
        say: 'Multiply both sides by four, because we want to get rid of the quarter. Fourteen times four is fifty-six.'
        write: '$56 = Q_s + 10$'
      - section: 'Solve'
        say: 'Subtract ten from both sides, because we want Q s by itself. Fifty-six minus ten is forty-six.'
        write: '$Q_s = 56 - 10 = 46$'
      - section: 'Check'
        say: 'Check. Forty-six plus ten is fifty-six, and a quarter of fifty-six is fourteen. That is our price. Good.'
        write: '$\dfrac{1}{4}(46 + 10) = \dfrac{56}{4} = 14$ ✓'
      - section: 'Remember'
        say: 'Remember, clear the fraction first, then move the number across.'
        write: 'Clear the fraction, then move the number'
      - section: 'Answer'
        say: 'So the quantity supplied at fourteen naira is forty-six, which is option C.'
        write: '$\therefore Q_s = 46$'
        answer: true
    traps:
      A: 'You went for fourteen. That is the price, not the quantity supplied.'
      B: 'You chose sixty. That adds ten to fifty-six. The ten must be taken away.'
      D: 'You picked thirty-two. Put it back in and a quarter of forty-two is ten point five, not fourteen.'
  16:
    moments:
      - section: 'The question'
        say: 'Supply is elastic, and the price falls a little. What do sellers do?'
        write: 'Elastic supply, price falls a little → ?'
      - section: 'Name it'
        say: 'This is the law of supply and elasticity of supply.'
        write: 'Law of supply;  elasticity of supply'
      - section: 'The rule'
        say: 'Quantity supplied moves in the same direction as price. Elastic supply means it changes by a larger percentage than the price.'
        write: 'P ↓ ⇒ Qs ↓;  elastic ⇒ PES $> 1$'
      - section: 'How it works'
        say: 'So a small fall in price leads to a fall in quantity supplied, and because supply is elastic, the fall is large.'
        write: 'Small P ↓ → large Qs ↓'
      - section: 'In Nigeria'
        say: 'If the price of sachet water falls a little, many small producers in Abuja switch to other work, and supply drops sharply.'
        write: 'Sachet water price ↓ → producers leave'
      - section: 'Remember'
        say: 'Remember, supply follows price, and elastic means it follows strongly.'
        write: 'Supply follows price'
      - section: 'Answer'
        say: 'So a small fall in price will reduce the quantity supplied, which is option B.'
        write: '$\therefore$ quantity supplied falls'
        answer: true
    traps:
      A: 'You went for reduce the cost of production. A lower selling price does not make the good cheaper to make.'
      C: 'You chose increase the quantity supplied. That reverses the law of supply. Sellers offer less when price falls.'
      D: 'You picked no change. That would be perfectly inelastic supply, the opposite of elastic.'
  17:
    moments:
      - section: 'The question'
        say: 'Many firms sell beverages, each with its own brand. What kind of supply is that?'
        write: 'Beverages from many firms = ? supply'
      - section: 'Name it'
