      - section: 'In Nigeria'
        say: 'A private hospital in Lagos may charge corporate patients more than ordinary patients for the same treatment, and the two groups cannot swap.'
        write: 'Hospital: corporate rate, ordinary rate'
      - section: 'Remember'
        say: 'Remember, same product, separate markets, separate prices.'
        write: 'Same product, separate prices'
      - section: 'Answer'
        say: 'So a monopolist raises revenue from the same output by charging different prices in markets kept apart, which is option B.'
        write: '$\therefore$ price discrimination'
        answer: true
    traps:
      A: 'You went for raising price and output together. Along a downward sloping demand curve he cannot sell more at a higher price.'
      C: 'You chose raising price when demand is elastic. Then quantity falls by a bigger percentage, so revenue falls.'
      D: 'You picked cutting price when demand is inelastic. Then sales rise only a little, so revenue falls.'
  25:
    moments:
