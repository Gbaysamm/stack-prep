        say: 'So a monopolist can influence price or quantity, which is option D.'
        write: '$\therefore$ price or quantity'
        answer: true
    traps:
      A: 'You went for the output of other producers. A monopolist has no rivals whose output he could control.'
      B: 'You chose prices of other producers. There are no other producers in his market.'
      C: 'You picked both price and quantity. The demand curve ties them together, so he can fix only one.'
  24:
    moments:
