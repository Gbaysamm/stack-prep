        say: 'On a cassava farm, if three workers lift twenty-seven bags, a fourth worker who brings it to twenty-eight adds just one bag.'
        write: 'Fourth worker adds 1 bag'
      - section: 'Answer'
        say: 'So E is twenty-seven and F is one, which is option A.'
        write: '$\therefore E = 27$, $F = 1$'
        answer: true
    traps:
      B: 'You went for sixty-eight and twelve. Sixty-eight over three is not nine, so it cannot be E.'
      C: 'You chose twenty-eight and five. Twenty-eight is the total for four workers. For three it is nine times three, twenty-seven.'
      D: 'You picked twelve and nineteen. Twelve over three is four, not the average product of nine.'
  18:
    moments:
