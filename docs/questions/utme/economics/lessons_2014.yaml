      - say: 'Marginal product is the extra total product from one more unit of labour.'
        write: '$\text{MP}_n = \text{TP}_n - \text{TP}_{n-1}$'
      - section: 'Find E'
        say: 'Look at the row for three units of labour. Average product is nine. So E is nine times three, which is twenty-seven.'
        write: '$E = 9 \times 3 = 27$'
      - section: 'Find F'
        say: 'Now the row for four units. Total product is twenty-eight. F is twenty-eight minus twenty-seven, which is one.'
        write: '$F = 28 - 27 = 1$'
      - section: 'Check'
