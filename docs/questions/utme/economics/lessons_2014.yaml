        say: 'Nigeria''s crude oil exports add to its G D P. Its imported cars and rice are taken away, because they were made elsewhere.'
        write: 'Oil exports $+$, imported cars $-$'
      - section: 'Remember'
        say: 'Remember, add what you sell abroad and take away what you buy from abroad.'
        write: 'Net exports $= X - M$'
      - section: 'Answer'
        say: 'So G D P in an open economy is C plus I plus G plus X minus M, which is option D.'
        write: '$\therefore C + I + G + (X - M)$'
        answer: true
    traps:
      A: 'You went for X plus M. Imports are made abroad, so they must be taken away, not added.'
      B: 'You chose C plus I plus G plus X. It adds exports but forgets to take away imports.'
      C: 'You picked C plus I plus G. That leaves out foreign trade, so it fits only a closed economy.'
  26:
    moments:
      - section: 'The question'
        say: 'Investment of one hundred million naira is spent, and people spend two thirds of every extra naira. How big does national income grow?'
        write: 'MPC $= \tfrac{2}{3}$, $I$ = ₦100 million, $Y = ?$'
      - section: 'Name it'
        say: 'This is the investment multiplier.'
        write: 'The multiplier'
      - section: 'The rule'
        say: 'The multiplier k equals one over one minus the marginal propensity to consume. National income is k times the investment.'
        write: '$k = \dfrac{1}{1 - \text{MPC}}$, $Y = k \times I$'
      - section: 'The multiplier'
        say: 'One minus two thirds is one third. One over one third is three. So k is three.'
        write: '$k = \dfrac{1}{1 - \frac{2}{3}} = \dfrac{1}{\frac{1}{3}} = 3$'
      - section: 'National income'
        say: 'Now three times one hundred million naira is three hundred million naira.'
        write: '$Y = 3 \times 100 = ₦300$ million'
      - section: 'Check'
        say: 'Check. The first round is one hundred million, then sixty-six point seven, then forty-four point four, and so on. These add up towards three hundred million.'
        write: '$100 + 66.7 + 44.4 + \dots \to 300$ ✓'
      - section: 'In Nigeria'
        say: 'When money is spent on a new road in Enugu, the contractors pay workers, who spend at the market, and the traders spend again. Income grows many times over.'
        write: 'Road in Enugu: spending passes from hand to hand'
      - section: 'Answer'
        say: 'So national income is three hundred million naira, which is option D.'
        write: '$\therefore Y = ₦300$ million'
        answer: true
    traps:
      A: 'You went for one hundred million. That is only the first round of spending, before the multiplier works.'
      B: 'You chose ten million. That divides by the multiplier instead of multiplying by it.'
      C: 'You picked three hundred and three million. The multiplier is exactly three, so the answer is exactly three hundred million.'
