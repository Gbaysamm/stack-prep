# UTME 2014 Economics, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Economics teacher works on the board:
# the question, the concept named, the rule in plain words, how it works (or the calculation,
# with data, formula, working and check), a Nigerian example, a way to remember it, and the
# answer moment that names the option. traps gives one kind line for each wrong option.
#
#   say:    heard, not read. Symbols read as words, money and percentages in words, no symbols
#           the voice would stop on.
#   write:  the one line written while it is said, with KaTeX between dollar signs.
#   answer: true on the moment that gives the answer.
#
# Keyed on question number, like explanations_2014.yaml. Answers match that file. No question
# is dropped, so all 49 kept questions have a lesson.
format_version: 1
exam_year: 2014
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'In a command economy, someone must decide how goods are made. Who is it?'
        write: 'Command economy: who decides how to produce?'
      - section: 'Name it'
        say: 'This is the how to produce problem, in a command economy, which is also called a centrally planned economy.'
        write: 'How to produce, under central planning'
      - section: 'The rule'
        say: 'In a command economy the state owns the factories and the land. A central planning authority decides what to make, how to make it and for whom.'
        write: 'State owns the means of production; planners decide'
      - section: 'How it works'
        say: 'So the choice of machines, workers and methods is written into the government plan. Prices in a market do not decide it.'
        write: 'Methods are set by the plan, not by prices'
      - section: 'In Nigeria'
        say: 'Nigeria is a mixed economy. But where the state ran an industry itself, like the old NEPA, government officials chose the methods.'
        write: 'Old NEPA: methods chosen by government'
      - section: 'Remember'
        say: 'Remember, a command economy is where the government gives the commands.'
        write: 'Command = government commands'
      - section: 'Answer'
        say: 'So the choice of how to produce is made by the government, which is option A.'
        write: '$\therefore$ government'
        answer: true
    traps:
      B: 'You went for consumers. Consumers guide production in a free market, but in a command economy the planners decide.'
      C: 'You chose industrialists. In a command economy the state runs the industries, so private industrialists do not decide.'
      D: 'You picked labour unions. Unions bargain over pay, but they do not choose how goods are produced.'
  3:
    moments:
      - section: 'The question'
        say: 'In a capitalist economy, who really decides which goods get made? Firms make the goods, but is that the whole story?'
        write: 'Capitalism: who ultimately answers what to produce?'
      - section: 'Name it'
        say: 'This is consumer sovereignty, the idea that the consumer is king in a free market.'
        write: 'Consumer sovereignty'
      - section: 'The rule'
        say: 'Firms produce what they can sell at a profit. And what sells is decided by what households choose to spend their money on.'
        write: 'Firms make what households buy'
      - section: 'How it works'
        say: 'Every naira a household spends is like a vote. Goods with many votes make profits and are made more. Goods nobody buys make losses and are dropped.'
        write: 'Each naira spent = a vote for that good'
      - section: 'In Nigeria'
        say: 'When more Lagos households began buying sachet water, more firms set up to make it. The spending came first, and the output followed.'
        write: 'Sachet water: spending first, output after'
      - section: 'Remember'
        say: 'Remember, firms propose, but households decide with their naira votes.'
        write: 'Firms propose, households decide'
      - section: 'Answer'
        say: 'So what to produce is ultimately answered by the spending decisions of households, which is option D.'
        write: '$\therefore$ spending decisions of households'
        answer: true
    traps:
      A: 'You went for income. Income limits what households can buy, but it is how they spend it that tells firms what to make.'
      B: 'You chose technical skills. Skills affect how goods are made, not which goods people want.'
      C: 'You picked output decisions of firms. Firms do decide output, but only to match what households spend on, so households have the final say.'
  4:
    moments:
      - section: 'The question'
        say: 'We measure only the tallest tree and the shortest tree in a forest. Which measure of spread can we work out from just those two?'
        write: 'Tallest and shortest tree only: which measure?'
      - section: 'Name it'
        say: 'This is the range, the simplest measure of dispersion.'
        write: 'Range'
      - section: 'The rule'
        say: 'Dispersion tells us how spread out values are. The range is the highest value minus the lowest value.'
        write: 'Range = highest value $-$ lowest value'
      - section: 'Example'
        say: 'If the tallest tree is thirty metres and the shortest is four metres, the range is thirty minus four, which is twenty-six metres.'
        write: '$30 - 4 = 26$ m'
      - section: 'The others'
        say: 'Variance, standard deviation and mean deviation all use every tree, measured from the mean. Two trees are not enough for them.'
        write: 'Variance, SD, mean deviation need every value'
      - section: 'In Nigeria'
        say: 'A trader at Bodija market who says her tomato baskets sell for between three thousand and nine thousand naira is giving a range of six thousand naira.'
        write: '₦9,000 $-$ ₦3,000 = ₦6,000'
      - section: 'Remember'
        say: 'Remember, the range uses only the two ends, the top and the bottom.'
        write: 'Range = the two ends'
      - section: 'Answer'
        say: 'So the measure worked out from the tallest and shortest trees is the range, which is option A.'
        write: '$\therefore$ range'
        answer: true
    traps:
      B: 'You went for variance. It measures spread too, but it needs every tree and the mean, not just two trees.'
      C: 'You chose standard deviation. It is the square root of the variance, so it also needs every tree.'
      D: 'You picked mean deviation. It averages how far every tree is from the mean, so it needs all of them.'
  5:
    moments:
      - section: 'The question'
        say: 'Look at the pie chart. Three slices have their angles marked, but services does not. What share of national income is services?'
        write: 'Services: percentage of national income $= ?$'
      - section: 'Look at the chart'
        say: 'Read the marked angles. Agric is seventy-two degrees, manufacturing is one hundred and eight degrees, and mining is one hundred and twenty-six degrees.'
        write: 'Agric 72°, Manufacturing 108°, Mining 126°, Services ?'
      - section: 'The rule'
        say: 'The whole circle is three hundred and sixty degrees, and it stands for all the national income. A sector''s share is its angle over three hundred and sixty, times one hundred per cent.'
        write: 'Share $= \dfrac{\text{angle}}{360°} \times 100\%$'
      - section: 'Find the angle'
        say: 'First add the three marked angles. Seventy-two plus one hundred and eight plus one hundred and twenty-six is three hundred and six degrees.'
        write: '$72 + 108 + 126 = 306°$'
      - say: 'So services take three hundred and sixty minus three hundred and six, which is fifty-four degrees.'
        write: 'Services $= 360 - 306 = 54°$'
      - section: 'The percentage'
        say: 'Now fifty-four over three hundred and sixty, times one hundred. That is fifteen per cent.'
        write: '$\dfrac{54}{360} \times 100\% = 15\%$'
      - section: 'Check'
        say: 'Check. Agric is twenty per cent, manufacturing thirty, mining thirty-five and services fifteen. Together they make one hundred per cent. Good.'
        write: '$20 + 30 + 35 + 15 = 100\%$ ✓'
      - section: 'Remember'
        say: 'Remember, angle over three hundred and sixty, then times a hundred.'
        write: 'angle ÷ 360 × 100'
      - section: 'Answer'
        say: 'So services contribute fifteen per cent of national income, which is option A.'
        write: '$\therefore$ 15%'
        answer: true
    traps:
      B: 'You went for ten per cent. That would be a slice of thirty-six degrees, but services take fifty-four degrees.'
      C: 'You chose fifty-four per cent. Fifty-four is the angle in degrees. Divide it by three hundred and sixty and multiply by a hundred to get fifteen per cent.'
      D: 'You picked twenty-four per cent. That would be a slice of about eighty-six degrees, but services take only fifty-four.'
  6:
    moments:
      - section: 'The question'
        say: 'The same pie chart again. If national income is three hundred and sixty million naira, how much comes from manufacturing?'
        write: 'Total ₦360 million. Manufacturing $= ?$'
      - section: 'Look at the chart'
        say: 'Find the manufacturing slice on the right of the chart. Its angle is one hundred and eight degrees.'
        write: 'Manufacturing $= 108°$'
      - section: 'The rule'
        say: 'The value of a sector is its angle over three hundred and sixty, times the total.'
        write: 'Value $= \dfrac{\text{angle}}{360°} \times \text{total}$'
      - section: 'Substitute'
        say: 'So manufacturing is one hundred and eight over three hundred and sixty, times three hundred and sixty million naira.'
        write: '$\dfrac{108}{360} \times 360$ million'
      - say: 'The three hundred and sixties cancel, which leaves one hundred and eight million naira.'
        write: '$= ₦108$ million'
      - section: 'Check'
        say: 'Check. One hundred and eight degrees is thirty per cent of the circle, and thirty per cent of three hundred and sixty million is one hundred and eight million. Good.'
        write: '$30\%$ of ₦360 million $= ₦108$ million ✓'
      - section: 'A shortcut'
        say: 'Because the total is three hundred and sixty million, each degree here is worth exactly one million naira.'
        write: '1° = ₦1 million here'
      - section: 'Answer'
        say: 'So the manufacturing sector contributes one hundred and eight million naira, which is option C.'
        write: '$\therefore$ ₦108 million'
        answer: true
    traps:
      A: 'You went for one hundred and twenty-six million. That is the mining slice, the biggest one, not manufacturing.'
      B: 'You chose seventy-two million. That is the agric slice, at the top of the chart.'
      D: 'You picked fifty-four million. That is the services slice, at the bottom of the chart.'
  7:
    moments:
      - section: 'The question'
        say: 'On the graph the demand curve moves from D nought D nought to D one D one. Which pair of factors could cause that?'
        write: 'Shift from $D_0D_0$ to $D_1D_1$: which factors?'
      - section: 'Look at the graph'
        say: 'Look at the two demand curves. D one D one lies wholly to the right of D nought D nought, so the whole curve has moved, and the arrow shows the shift.'
        write: '$D_1D_1$ is to the right: an increase in demand'
      - say: 'Where the new curve meets the supply curve, price rises from P nought to P one and quantity from Q nought to Q one.'
        write: '$P_0 \to P_1$, $Q_0 \to Q_1$'
      - section: 'The rule'
        say: 'A demand curve shifts only when something other than the good''s own price changes. Income, population, tastes, prices of related goods and expectations are such things.'
        write: 'Shift: income, population, taste, related prices'
      - say: 'A change in the good''s own price does not shift the curve. It only moves us along it.'
        write: 'Own price: movement along the curve'
      - section: 'How it works'
        say: 'Higher income lets each buyer buy more, and a bigger population adds more buyers. Both push demand to the right.'
        write: 'More income + more people $\Rightarrow$ demand shifts right'
      - section: 'In Nigeria'
        say: 'At the end of the month, when salaries are paid, and as more people move into Abuja, the mama put stalls sell more food at every price.'
        write: 'Payday + more people $\Rightarrow$ more demand'
      - section: 'Remember'
        say: 'Remember, own price moves you along the curve, and anything else moves the curve.'
        write: 'Own price = along; other factors = shift'
      - section: 'Answer'
        say: 'So the factors that shift demand to the right are consumers'' income and population size, which is option C.'
        write: '$\therefore$ income and population size'
        answer: true
    traps:
      A: 'You went for income and technology. Income shifts demand, but technology shifts the supply curve, not demand.'
      B: 'You chose price and weather. The good''s own price only moves us along the demand curve, it does not shift it.'
      D: 'You picked taste and price. Taste shifts demand, but a change in price only moves along the curve.'
  8:
    moments:
      - section: 'The question'
        say: 'We have a demand equation and a supply equation. At what price does the market clear?'
        write: '$Q_d = 40 - 2P$, $Q_s = 6P + 24$, equilibrium $P = ?$'
      - section: 'The rule'
        say: 'At equilibrium, quantity demanded equals quantity supplied. So we set Q d equal to Q s.'
        write: 'Equilibrium: $Q_d = Q_s$'
      - section: 'Set them equal'
        say: 'Forty minus two P equals six P plus twenty-four.'
        write: '$40 - 2P = 6P + 24$'
      - section: 'Solve'
        say: 'Take twenty-four from both sides, and add two P to both sides. That gives sixteen equals eight P.'
        write: '$40 - 24 = 6P + 2P \Rightarrow 16 = 8P$'
      - say: 'Now divide both sides by eight, because we want P by itself. P equals two.'
        write: '$P = \dfrac{16}{8} = 2$'
      - section: 'Check'
        say: 'Check. At two naira, Q d is forty minus four, which is thirty-six. Q s is twelve plus twenty-four, also thirty-six. They match.'
        write: '$Q_d = 36$, $Q_s = 36$ ✓'
      - section: 'In Nigeria'
        say: 'Think of pure water sachets. At two naira, buyers want exactly as many sachets as sellers bring, so there is no queue and no pile left over.'
        write: 'No shortage, no surplus at ₦2'
      - section: 'Answer'
        say: 'So the equilibrium price is two naira, which is option A.'
        write: '$\therefore P = ₦2$'
        answer: true
    traps:
      B: 'You went for thirty-two naira. At that price demand would be negative, so it cannot be the equilibrium.'
      C: 'You chose thirty-six. Thirty-six is the equilibrium quantity, not the price.'
      D: 'You picked sixteen. Sixteen is eight P, the step before dividing by eight. Divide and you get two naira.'
  9:
    moments:
      - section: 'The question'
        say: 'Economists use two phrases that sound alike, a change in demand and a change in quantity demanded. What does a change in demand mean?'
        write: 'Change in demand $\Rightarrow$ ?'
      - section: 'Name it'
        say: 'This is a change in demand, as against a change in quantity demanded.'
        write: 'Change in demand vs change in quantity demanded'
      - section: 'The rule'
        say: 'A change in demand means buyers want a different amount at every price. So the whole demand curve shifts, right for an increase and left for a decrease.'
        write: 'Change in demand = the curve shifts'
      - say: 'A change in quantity demanded comes only from a change in the good''s own price. That is a movement along the same curve.'
        write: 'Change in quantity demanded = movement along'
      - section: 'In Nigeria'
        say: 'If incomes rise, families buy more rice at every price. The demand curve for rice shifts to the right.'
        write: 'Higher income $\Rightarrow$ rice demand shifts right'
      - section: 'Remember'
        say: 'Remember, when demand changes the curve shifts, and when price changes you slide along.'
        write: 'Demand changes, curve shifts'
      - section: 'Answer'
        say: 'So a change in demand means a shift in the demand curve, which is option B.'
        write: '$\therefore$ shift in the demand curve'
        answer: true
    traps:
      A: 'You went for A. A change in quantity demanded as price changes is a movement along the curve, not a change in demand.'
      C: 'You chose movement along the curve. That is a change in quantity demanded, caused by the good''s own price.'
      D: 'You picked a change in elasticity. Elasticity measures how strongly buyers respond, and a change in demand need not change it.'
  10:
    moments:
      - section: 'The question'
        say: 'Price rises by ten per cent, and quantity demanded falls by five per cent. What kind of demand is this?'
        write: '$\%\,\Delta P = 10\%$, $\%\,\Delta Q_d = 5\%$. Type of demand?'
      - section: 'Name it'
        say: 'This is the price elasticity of demand, P E D for short.'
        write: 'Price elasticity of demand (PED)'
      - section: 'The rule'
        say: 'P E D is the percentage change in quantity demanded divided by the percentage change in price.'
        write: '$\text{PED} = \dfrac{\%\,\Delta Q_d}{\%\,\Delta P}$'
      - say: 'If it is less than one, demand is inelastic. If it is more than one, demand is elastic. If it is exactly one, it is unitary.'
        write: '$<1$ inelastic, $>1$ elastic, $=1$ unitary'
      - section: 'Substitute'
        say: 'So P E D is five over ten, which is zero point five.'
        write: '$\text{PED} = \dfrac{5}{10} = 0.5$'
      - section: 'Check'
        say: 'Zero point five is less than one but more than zero. Quantity does respond, but by less than price does. That is inelastic demand.'
        write: '$0 < 0.5 < 1$ ⇒ inelastic'
      - section: 'In Nigeria'
        say: 'Salt and kerosene are like this in Nigeria. When their prices rise, people still buy nearly as much.'
        write: 'Salt, kerosene: inelastic'
      - section: 'Remember'
        say: 'Remember, less than one means less response, which is inelastic.'
        write: 'Less than one, inelastic'
      - section: 'Answer'
        say: 'So the demand is inelastic, which is option C.'
        write: '$\therefore$ inelastic'
        answer: true
    traps:
      A: 'You went for unitary. That needs the two percentages to be equal, but five is only half of ten.'
      B: 'You chose perfectly inelastic. That means quantity does not change at all, but here it fell by five per cent.'
      D: 'You picked elastic. Elastic demand needs a value above one, and this is only zero point five.'
  11:
    moments:
      - section: 'The question'
        say: 'The price of good X falls, and the budget line swings out from I to II. Where is the consumer''s new best point?'
        write: 'Price of X falls: budget line I $\to$ II. New equilibrium?'
      - section: 'Look at the graph'
        say: 'Look at the two budget lines. Both start at the same point on the Y axis. Line II reaches further along the X axis, because X is now cheaper.'
        write: 'Same Y intercept, line II reaches further along X'
      - say: 'Now find the four points. J is on line I. K and M are on line II. L is on the highest curve, U three.'
        write: 'J on I; K and M on II; L on $U_3$'
      - section: 'The rule'
        say: 'A consumer is in equilibrium where the budget line just touches, which means is tangent to, the highest indifference curve it can reach.'
        write: 'Equilibrium: budget line tangent to highest curve'
      - section: 'Test the points'
        say: 'L is on U three, but no budget line reaches U three. The consumer cannot afford it.'
        write: 'L: on $U_3$, out of reach'
      - say: 'M is on line II, but it lies on the lower curve U one, where the line cuts across the curve. Moving along the line, the consumer can do better.'
        write: 'M: line II cuts $U_1$, not the best'
      - say: 'K is where line II just touches U two. That is the highest curve the new line can reach.'
        write: 'K: line II tangent to $U_2$ ✓'
      - say: 'J was the best point on the old line I. After the price fall, it is no longer the equilibrium.'
        write: 'J: old equilibrium on line I'
      - section: 'In Nigeria'
        say: 'When garri gets cheaper, a student on the same allowance moves to a new best mix with more garri, just as the consumer moves from J to K.'
        write: 'Cheaper garri $\Rightarrow$ new best mix'
      - section: 'Remember'
        say: 'Remember, the best point is where the line kisses the curve, not where it cuts it.'
        write: 'Touch, not cut'
      - section: 'Answer'
        say: 'So the consumer''s new equilibrium is at point K, which is option B.'
        write: '$\therefore$ K'
        answer: true
    traps:
      A: 'You went for J. J was the equilibrium before the price of X fell, but it is not on the new budget line.'
      C: 'You chose L. L is on U three, which the consumer cannot afford on either budget line.'
      D: 'You picked M. M is on the new line, but it is on the lower curve U one. Sliding along the line to K reaches a higher curve.'
  12:
    moments:
      - section: 'The question'
        say: 'What can push a budget line out to the right? Think about what a consumer can afford.'
        write: 'Budget line shifts right: cause?'
      - section: 'Name it'
        say: 'This is a shift of the budget line.'
        write: 'Shift of the budget line'
      - section: 'The rule'
        say: 'The budget line shows every mix of two goods a consumer can buy with a given income at given prices. It moves when income or prices change.'
        write: 'Budget line depends on income and prices'
      - section: 'How it works'
        say: 'If a commodity becomes relatively cheaper, the same income buys more of it. So the line moves out to the right.'
        write: 'Cheaper good $\Rightarrow$ more affordable $\Rightarrow$ line moves right'
      - say: 'If the price rises, the same income buys less, so the line moves in to the left.'
        write: 'Dearer good $\Rightarrow$ line moves left'
      - section: 'In Nigeria'
        say: 'If the price of a bag of rice falls while a worker''s salary in Kano stays the same, the worker can now buy more rice.'
        write: 'Rice cheaper, same salary $\Rightarrow$ more rice'
      - section: 'Remember'
        say: 'Remember, cheaper goods or more money push the line out. Dearer goods or less money pull it in.'
        write: 'Cheaper or richer = out'
      - section: 'Answer'
        say: 'So a rightward shift is caused by a fall in the commodity''s relative price, which is option C.'
        write: '$\therefore$ fall in relative price'
        answer: true
    traps:
      A: 'You went for a fall in income. Less income buys less, so the line moves left, not right.'
      B: 'You chose a change in taste. Taste changes the indifference curves, not the budget line.'
      D: 'You picked a rise in price. A dearer good means less can be bought, so the line moves left.'
  13:
    moments:
      - section: 'The question'
        say: 'We have a supply function, and the price is ten naira. How much is supplied?'
        write: '$P = \tfrac{1}{4}(Q_s + 10)$, $P = 10$, $Q_s = ?$'
      - section: 'The rule'
        say: 'To find quantity supplied, put the price into the supply function and solve for Q s.'
        write: 'Substitute $P$, solve for $Q_s$'
      - section: 'Substitute'
        say: 'Ten equals one quarter of Q s plus ten.'
        write: '$10 = \tfrac{1}{4}(Q_s + 10)$'
      - section: 'Solve'
        say: 'Multiply both sides by four, to clear the quarter. Forty equals Q s plus ten.'
        write: '$40 = Q_s + 10$'
      - say: 'Now take ten from both sides. Q s equals thirty.'
        write: '$Q_s = 40 - 10 = 30$'
      - section: 'Check'
        say: 'Check. Thirty plus ten is forty, and a quarter of forty is ten. That is our price. Good.'
        write: '$\tfrac{1}{4}(30 + 10) = 10$ ✓'
      - section: 'In Nigeria'
        say: 'A palm oil seller following this rule would bring thirty tins to the market when the price is ten naira a unit.'
        write: '₦10 $\Rightarrow$ 30 units'
      - section: 'Answer'
        say: 'So the quantity supplied is thirty, which is option D.'
        write: '$\therefore Q_s = 30$'
        answer: true
    traps:
      A: 'You went for twenty. That adds ten and ten without first multiplying the price by four.'
      B: 'You chose fifteen. A quarter of fifteen plus ten is only six point two five, not ten.'
      C: 'You picked fifty. That multiplies ten by four and then adds ten instead of taking it away.'
  14:
    moments:
      - section: 'The question'
        say: 'Price rises from eight naira to ten naira, and quantity supplied rises from twenty to twenty-four. What is the elasticity of supply?'
        write: 'P: 8 $\to$ 10, $Q_s$: 20 $\to$ 24. PES $= ?$'
      - section: 'The rule'
        say: 'Price elasticity of supply, P E S, is the percentage change in quantity supplied over the percentage change in price.'
        write: '$\text{PES} = \dfrac{\%\,\Delta Q_s}{\%\,\Delta P}$'
      - section: 'Quantity'
        say: 'Quantity rose by four, from twenty. Four over twenty times one hundred is twenty per cent.'
        write: '$\%\,\Delta Q_s = \dfrac{4}{20} \times 100 = 20\%$'
      - section: 'Price'
        say: 'Price rose by two, from eight. Two over eight times one hundred is twenty-five per cent.'
        write: '$\%\,\Delta P = \dfrac{2}{8} \times 100 = 25\%$'
      - section: 'Divide'
        say: 'Now P E S is twenty over twenty-five, which is zero point eight.'
        write: '$\text{PES} = \dfrac{20}{25} = 0.8$'
      - section: 'Check'
        say: 'Check. Quantity rose by a smaller percentage than price, so the answer must be below one. Zero point eight fits, and supply is inelastic.'
        write: '$0.8 < 1$, inelastic ✓'
      - section: 'In Nigeria'
        say: 'Tomato farmers in Kano cannot double their crop overnight when prices rise, so their supply is inelastic in the short run.'
        write: 'Tomato farmers: inelastic supply'
      - section: 'Answer'
        say: 'So the price elasticity of supply is zero point eight, which is option B.'
        write: '$\therefore \text{PES} = 0.80$'
        answer: true
    traps:
      A: 'You went for zero point five. That divides the change in price by the change in quantity, without turning them into percentages.'
      C: 'You chose two. That divides four by two without turning the changes into percentages.'
      D: 'You picked one point two five. That is the formula upside down, price change over quantity change.'
  15:
    moments:
      - section: 'The question'
        say: 'The government sets a price below the market equilibrium. What happens next?'
        write: 'Price set below equilibrium $\Rightarrow$ ?'
      - section: 'Name it'
        say: 'This is a maximum price, also called a price ceiling.'
        write: 'Maximum price (price ceiling)'
      - section: 'The rule'
        say: 'By the law of supply, sellers offer less at a lower price. By the law of demand, buyers want more.'
        write: 'Lower price: $Q_s$ falls, $Q_d$ rises'
      - section: 'How it works'
        say: 'So quantity supplied falls while quantity demanded rises. The gap between them is a shortage.'
        write: '$Q_d > Q_s$ $\Rightarrow$ shortage'
      - section: 'In Nigeria'
        say: 'When petrol is sold below its market price, filling stations get less supply, and long queues and black markets follow.'
        write: 'Petrol below market price $\Rightarrow$ queues'
      - section: 'Remember'
        say: 'Remember, price ceiling, supply sinks, queues grow.'
        write: 'Ceiling $\Rightarrow$ supply sinks'
      - section: 'Answer'
        say: 'So a price below equilibrium leads to a decrease in the quantity supplied, which is option C.'
        write: '$\therefore$ quantity supplied decreases'
        answer: true
    traps:
      A: 'You went for an increase in quantity supplied. Sellers offer less at a lower price, not more.'
      B: 'You chose a new equilibrium. The fixed price stops the market from clearing, so a shortage remains.'
      D: 'You picked a fall in price. The lower price is what was set, and the question asks what it leads to.'
  16:
    moments:
      - section: 'The question'
        say: 'In a free market nobody announces the price of tomatoes. So how does the price mechanism set prices?'
        write: 'Price mechanism sets prices through $?$'
      - section: 'Name it'
        say: 'This is the price mechanism, also called the market system.'
        write: 'Price mechanism'
