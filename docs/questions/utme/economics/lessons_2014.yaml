  22:
    moments:
      - section: 'The question'
        say: 'A perfect competitor is deciding whether to make one more unit. When should it keep expanding?'
        write: 'Expand output as long as $?$'
      - section: 'Name it'
        say: 'This is the profit maximizing rule, using marginal cost, M C, and marginal revenue, M R.'
        write: 'MC = marginal cost, MR = marginal revenue'
      - section: 'The rule'
        say: 'A firm makes the most profit where M C equals M R. Before that point, each extra unit adds more to revenue than to cost.'
        write: 'Profit is greatest where MC = MR'
      - section: 'How it works'
        say: 'So while M C is less than M R, every extra unit raises profit, and the firm keeps expanding.'
        write: 'MC < MR $\Rightarrow$ extra unit adds profit $\Rightarrow$ expand'
      - say: 'Once M C is greater than M R, an extra unit would cut profit, so the firm stops.'
        write: 'MC > MR $\Rightarrow$ stop'
      - section: 'In Nigeria'
        say: 'A garri seller in a perfectly competitive market gets the same price for each bag. She keeps producing while an extra bag costs her less than that price.'
        write: 'Garri seller: produce while extra bag costs less than price'
      - section: 'Remember'
        say: 'Remember, as long as the next unit costs less than it brings in, make it.'
        write: 'Next unit cheaper than its revenue? Make it'
      - section: 'Answer'
        say: 'So a perfect competitor keeps expanding as long as M C is less than M R, which is option C.'
        write: '$\therefore$ MC < MR'
        answer: true
    traps:
      A: 'You went for total cost greater than total revenue. That means a loss, which is no reason to expand.'
      B: 'You chose M R equals A R. That is true at every output for a perfect competitor, so it cannot tell the firm when to expand.'
      D: 'You picked M C greater than M R. Then an extra unit cuts profit, so the firm would cut output.'
  23:
    moments:
      - section: 'The question'
        say: 'A monopolist is the only seller. Does that mean he controls everything about his market?'
