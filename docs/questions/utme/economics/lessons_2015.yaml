# UTME 2015 Economics, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Economics teacher works on the board:
# the question, the concept named, the rule or definition in plain words, how it works as cause
# and effect (or the calculation with data, formula, working and check), a Nigerian example, a
# way to remember it, and the answer moment that names the option.
#
#   say:     heard, not read. Symbols read as words (M P C, Q d), money and percentages in words,
#            no symbols the voice would stop on.
#   write:   the one line written while it is said, with LaTeX between dollar signs.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2015.yaml. Answers match that file. No question
# is dropped, so all 50 have a lesson.
format_version: 1
exam_year: 2015
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'Imagine one worker feeding ten people. What does that do to a whole economy? That is what this question asks.'
        write: 'High dependency ratio, major effect $= ?$'
      - section: 'Name it'
        say: 'This is the dependency ratio, a feature of the structure of a population.'
        write: 'Dependency ratio'
      - section: 'The rule'
        say: 'It compares the dependants, children under fifteen and the old over sixty-four, with the workers aged fifteen to sixty-four who feed them.'
        write: 'Dependency ratio $= \dfrac{\text{dependants}}{\text{working population}}$'
      - section: 'How it works'
        say: 'When the ratio is high, each worker supports many people, so most income goes on food and school fees and little is saved.'
        write: 'High ratio ⇒ low saving'
      - say: 'Low saving means low investment, low investment means low income, and low income brings low saving again. That loop is the vicious cycle of poverty.'
        write: 'Low saving → low investment → low income → low saving'
      - section: 'In Nigeria'
        say: 'Think of a trader in Kano feeding eight children and two aged parents. Nothing is left to save or to grow her stall.'
        write: 'Many mouths, nothing left to save'
      - section: 'Remember'
        say: 'Remember, many mouths mean little saving, little investment and little income, and round it goes again.'
        write: 'Many mouths ⇒ the cycle goes round'
      - section: 'Answer'
        say: 'So the major effect of a high dependency ratio is the vicious cycle of poverty, which is option B.'
        write: '$\therefore$ vicious cycle of poverty'
        answer: true
    traps:
      A: 'You went for high capital formation. Capital formation needs saving, and many dependants cut saving, so it falls.'
      C: 'You chose low cost of living. More dependants push up demand for food, so living costs tend to rise.'
      D: 'You picked high standard of living. Income shared among many people lowers income per head.'
  2:
    moments:
      - section: 'The question'
        say: 'Government hires out tractors to farmers. Which problem of farming is that meant to fix?'
        write: 'Tractor-hiring schemes solve which problem?'
      - section: 'Name it'
        say: 'This is a problem of agriculture in Nigeria, the use of crude tools.'
        write: 'Problems of agriculture, crude tools'
      - section: 'The fact'
        say: 'Most Nigerian farmers still use the hoe and the cutlass instead of tractors and harvesters, so output per farmer stays low.'
        write: 'Hoe and cutlass ⇒ low output'
      - section: 'How it works'
        say: 'Tractor hiring and mechanization put modern machines within reach of small farmers. So they attack the shortage of modern implements.'
        write: 'Mechanization supplies modern implements'
      - section: 'In Nigeria'
        say: 'A rice farmer in Kebbi who hires a tractor can plough in one day what took his family two weeks by hoe.'
        write: 'Kebbi rice farm, one day by tractor'
      - section: 'Remember'
        say: 'Remember, machines solve the problem of no machines.'
        write: 'Machines fix "no machines"'
      - section: 'Answer'
        say: 'So the problem these schemes solve is inadequate modern farm implements, which is option D.'
        write: '$\therefore$ inadequate modern farm implements'
        answer: true
    traps:
      A: 'You went for low literacy. It is a real problem, but adult education and extension workers tackle it, not tractors.'
      B: 'You chose small farms. Land reform and co-operative farming tackle that, not hiring machines.'
      C: 'You picked pest attack. Pesticides and resistant seeds tackle pests, not tractors.'
  3:
    moments:
      - section: 'The question'
        say: 'Farmers join together to buy fertilizer cheaply. What marks out the society they form?'
        write: 'A feature of a co-operative society $= ?$'
      - section: 'Name it'
        say: 'This is a co-operative society, a business owned by its members for their common benefit.'
        write: 'Co-operative society'
      - section: 'The rule'
        say: 'Its features are open and voluntary membership, one member one vote, and a common interest among members.'
        write: 'Open membership, one member one vote, common interest'
      - section: 'How it works'
        say: 'Because membership is open, anyone who shares the common bond can join. There is no maximum, unlike a partnership or a private company.'
        write: 'No upper limit ⇒ unlimited size of membership'
      - section: 'In Nigeria'
        say: 'A cocoa farmers'' co-operative in Ondo keeps admitting new farmers as long as they buy a share and keep its rules.'
        write: 'Ondo cocoa co-operative, open door'
      - section: 'Remember'
        say: 'Remember, a co-operative has an open door, one vote each and a shared interest.'
        write: 'Open door, one vote each'
      - section: 'Answer'
        say: 'So a co-operative is marked by unlimited size of membership, which is option D.'
        write: '$\therefore$ unlimited size of membership'
        answer: true
    traps:
      A: 'You went for divergent interests. Members join because they share a common interest.'
      B: 'You chose unlimited liability. A registered co-operative gives its members limited liability.'
      C: 'You picked voting by shares. That is how a company votes. A co-operative gives one vote to each member.'
  4:
    moments:
      - section: 'The question'
        say: 'Your income goes up. How much of the extra do you save? That share has a name.'
        write: 'The M P S measures $= ?$'
      - section: 'Name it'
        say: 'This is the marginal propensity to save, M P S.'
        write: 'Marginal propensity to save (MPS)'
      - section: 'The rule'
        say: 'Marginal means extra. The M P S is the change in saving divided by the change in income.'
        write: '$\text{MPS} = \dfrac{\Delta S}{\Delta Y}$'
      - section: 'How it works'
        say: 'If income rises by one thousand naira and saving rises by two hundred naira, the M P S is two hundred over one thousand, which is zero point two.'
        write: '$\text{MPS} = \dfrac{200}{1000} = 0.2$'
      - say: 'Every extra naira is either spent or saved, so the M P C plus the M P S equals one.'
        write: '$\text{MPC} + \text{MPS} = 1$'
      - section: 'In Nigeria'
        say: 'A civil servant in Abuja gets ten thousand naira more and puts three thousand naira into his thrift group. His M P S is zero point three.'
        write: '$\dfrac{3000}{10000} = 0.3$'
      - section: 'Remember'
        say: 'Remember, the M P S is extra saving over extra income.'
        write: 'Extra saving ÷ extra income'
      - section: 'Answer'
        say: 'So the M P S measures the ratio of a change in saving to a change in income, which is option A.'
        write: '$\therefore$ change in saving ÷ change in income'
        answer: true
    traps:
      B: 'You went for supply. The M P S is about saving and income, not supply.'
      C: 'You chose the change in consumption over the change in income. That is the M P C, the partner of the M P S.'
      D: 'You picked the average propensity to consume. That is total consumption over total income, a different measure.'
  5:
    moments:
      - section: 'The question'
        say: 'Some workers lose their jobs and never get them back, even when times are good. Why?'
        write: 'Structural unemployment is caused by $= ?$'
      - section: 'Name it'
        say: 'This is structural unemployment.'
        write: 'Structural unemployment'
      - section: 'The rule'
        say: 'It comes from a lasting change in the structure of the economy, in what people buy or in how things are made.'
        write: 'Lasting change in the pattern of demand'
      - section: 'How it works'
        say: 'When consumption patterns change, demand for some products falls for good. Their workers lose jobs, and their skills do not fit the new industries.'
        write: 'Demand falls for good ⇒ skills no longer wanted'
      - section: 'In Nigeria'
        say: 'When offices moved from typewriters to computers, typists and typewriter repairers lost their work for good.'
        write: 'Typewriters to computers'
      - section: 'Remember'
        say: 'Remember, structural means the structure of demand has changed for good.'
        write: 'Structural = changed for good'
      - section: 'Answer'
        say: 'So structural unemployment is caused mainly by a change in the consumption pattern, which is option A.'
        write: '$\therefore$ a change in the consumption pattern'
        answer: true
    traps:
      B: 'You went for the business cycle. That causes cyclical unemployment, which ends when the boom returns.'
      C: 'You chose a fall in output. A general slump in output is cyclical, not structural.'
      D: 'You picked seasonal variation. That causes seasonal unemployment, like farm hands idle in the dry season.'
  6:
    moments:
      - section: 'The question'
        say: 'Before every census, thousands of young people are trained. Which problem is that training meant to fix?'
        write: 'Training enumerators solves which census problem?'
      - section: 'Name it'
        say: 'This is a problem of census taking in Nigeria, a shortage of skilled staff.'
        write: 'Census problems, skilled personnel'
      - section: 'The fact'
        say: 'A census needs a huge army of enumerators who can read maps, fill forms well and count each household once.'
        write: 'Enumerators must read maps and fill forms'
      - section: 'How it works'
        say: 'Without such people, households are missed or counted twice. Training gives the census the skilled personnel it lacks.'
        write: 'Training ⇒ skilled personnel'
      - section: 'In Nigeria'
        say: 'The National Population Commission trains enumerators in every local government area before a count.'
        write: 'NPC trains enumerators in every LGA'
      - section: 'Remember'
        say: 'Remember, training makes skilled staff.'
        write: 'Training ⇒ skill'
      - section: 'Answer'
        say: 'So the problem training solves is inadequate skilled personnel, which is option A.'
        write: '$\therefore$ inadequate skilled personnel'
        answer: true
    traps:
      B: 'You went for high dependency ratio. That is a feature of the population, not a problem of counting it.'
      C: 'You chose distortion of figures. That comes from politics, and training enumerators does not stop it.'
      D: 'You picked high cost. Training adds to the cost of a census and does not lower it.'
  7:
    moments:
      - section: 'The question'
        say: 'Government cuts its spending. What happens to prices in the market?'
        write: 'Government spending falls, price level $= ?$'
      - section: 'Name it'
        say: 'This is the effect of public spending on the price level, a part of fiscal policy.'
        write: 'Public expenditure and the price level'
      - section: 'The rule'
        say: 'Government spending is part of total demand in the economy.'
        write: 'Aggregate demand includes government spending'
      - section: 'How it works'
        say: 'Less government spending means less total demand. With less money chasing the same goods, sellers cut their prices to sell.'
        write: 'G falls ⇒ demand falls ⇒ prices fall'
      - section: 'In Nigeria'
        say: 'When salaries and contracts are delayed, traders in Onitsha main market complain of low sales and cut their prices.'
        write: 'Onitsha market, low sales, lower prices'
      - section: 'Remember'
        say: 'Remember, when government spends less, demand falls and prices fall.'
        write: 'Spend less ⇒ prices fall'
      - section: 'Answer'
        say: 'So a decrease in government spending makes the general price level fall, which is option C.'
        write: '$\therefore$ fall'
        answer: true
    traps:
      A: 'You went for remain constant. Prices do not stay put when total demand changes.'
      B: 'You chose fluctuate. The change has a clear direction, which is down.'
      D: 'You picked rise. Prices rise when government spending increases, not when it falls.'
  8:
    moments:
      - section: 'The question'
        say: 'The table hides two numbers, K and F. We will find them with two simple rules.'
        write: 'Find K (TP at 3 workers) and F (MP at 4 workers)'
      - section: 'Name it'
        say: 'These are total product, average product and marginal product. Look at the row for three workers and the row for four.'
        write: 'TP, AP and MP'
      - section: 'The rule'
        say: 'Average product is total product divided by the number of workers. So total product is average product times the number of workers.'
        write: '$\text{AP} = \dfrac{\text{TP}}{L}$, so $\text{TP} = \text{AP} \times L$'
      - say: 'Marginal product is the change in total product when one more worker is added.'
        write: '$\text{MP}_n = \text{TP}_n - \text{TP}_{n-1}$'
      - section: 'Find K'
        say: 'With three workers the average product is nine. Nine times three is twenty-seven, so K is twenty-seven.'
        write: '$K = 9 \times 3 = 27$'
      - section: 'Find F'
        say: 'With four workers total product is forty. Forty minus twenty-seven is thirteen, so F is thirteen.'
        write: '$F = 40 - 27 = 13$'
      - section: 'Check'
        say: 'Check with the third worker. Twenty-seven minus fourteen is thirteen, and the table shows thirteen. Good.'
        write: '$\text{MP}_3 = 27 - 14 = 13$ ✓'
      - section: 'In Nigeria'
        say: 'Think of a poultry farm in Ogun. Adding a fourth attendant lifts output from twenty-seven crates to forty.'
        write: '27 crates → 40 crates'
      - section: 'Answer'
        say: 'So K is twenty-seven and F is thirteen, which is option B.'
        write: '$\therefore K = 27,\ F = 13$'
        answer: true
    traps:
      A: 'You went for thirteen and twenty-seven. Those are the right numbers in the wrong order. K comes first, and K is twenty-seven.'
      C: 'You chose ten and twenty-seven. K is the total product at three workers, which is nine times three, twenty-seven.'
      D: 'You picked twenty-seven and ten. K is right, but F is a marginal product, forty minus twenty-seven, which is thirteen.'
  9:
    moments:
      - section: 'The question'
        say: 'You drink one sachet of water, then a second, then a third. Add up the extra satisfaction from each one. What do you get?'
        write: 'Sum of all marginal utilities $= ?$'
      - section: 'Name it'
        say: 'These are total utility and marginal utility.'
        write: 'Total utility and marginal utility'
      - section: 'The rule'
        say: 'Marginal utility is the extra satisfaction from one more unit. Total utility is the satisfaction from all the units together.'
        write: 'MU = extra satisfaction, TU = whole satisfaction'
      - section: 'How it works'
        say: 'Total utility is built up one unit at a time, so adding every marginal utility gives the total.'
        write: '$\text{TU} = \text{MU}_1 + \text{MU}_2 + \dots + \text{MU}_n$'
      - section: 'In Nigeria'
        say: 'On a hot day in Maiduguri, the first sachet gives ten units, the second six and the third two. Ten plus six plus two is eighteen.'
        write: '$10 + 6 + 2 = 18$'
      - section: 'Remember'
        say: 'Remember, the marginals add up to the total.'
        write: 'Add the MUs ⇒ TU'
      - section: 'Answer'
        say: 'So the sum of all marginal utilities is total utility, which is option C.'
        write: '$\therefore$ total utility'
        answer: true
    traps:
      A: 'You went for average utility. That is total utility divided by the number of units, not a sum.'
      B: 'You chose the initial marginal utility. That is only the first unit.'
      D: 'You picked diminishing marginal utility. That is the law that each extra unit adds less. It is a pattern, not a total.'
  10:
    moments:
      - section: 'The question'
        say: 'In a pure capitalist country, who owns the factories and the land?'
        write: 'Pure capitalism, owners of production $= ?$'
      - section: 'Name it'
        say: 'This is capitalism, also called the free enterprise or market economy.'
        write: 'Capitalism (free enterprise)'
      - section: 'The rule'
        say: 'In pure capitalism, the means of production are owned and controlled by private individuals and firms.'
        write: 'Means of production owned privately'
      - section: 'How it works'
        say: 'They decide what to produce in search of profit, guided by prices. Government owns nothing in production.'
        write: 'Profit motive, price system'
      - section: 'In Nigeria'
        say: 'A private bakery in Ibadan decides alone how much bread to bake and at what price.'
        write: 'Private bakery decides for itself'
      - section: 'Remember'
        say: 'Remember, capitalism means private capital.'
        write: 'Capitalism = private capital'
      - section: 'Answer'
        say: 'So in a pure capitalist economy production is owned by the private sector, which is option D.'
        write: '$\therefore$ private sector'
        answer: true
    traps:
      A: 'You went for public and private sectors together. That describes a mixed economy like Nigeria.'
      B: 'You chose feudal lords. They belong to feudalism, an older system.'
      C: 'You picked the public sector. Public ownership of production describes socialism.'
  11:
    moments:
      - section: 'The question'
        say: 'Government pays an unemployed man every month, and he gives no work in return. What do we call that payment?'
        write: 'Unemployment benefit is a $?$'
      - section: 'Name it'
        say: 'This is a transfer payment.'
        write: 'Transfer payment'
      - section: 'The rule'
        say: 'A transfer payment is money paid without any good or service in return, like pensions, unemployment benefits and student grants.'
        write: 'Paid with no service in return'
      - section: 'How it works'
        say: 'It only moves income from taxpayers to the receiver. Nothing new is produced, so it is left out of national income.'
        write: 'No output ⇒ not in national income'
      - section: 'In Nigeria'
        say: 'A retired teacher in Enugu receives a pension. That is a transfer payment. Her salary while teaching was a factor reward.'
        write: 'Pension = transfer, salary = factor reward'
      - section: 'Remember'
        say: 'Remember, transfer means money moves but nothing is made.'
        write: 'Money moves, nothing made'
      - section: 'Answer'
        say: 'So an unemployment benefit is a transfer payment, which is option D.'
        write: '$\therefore$ transfer payment'
        answer: true
    traps:
      A: 'You went for interest. Interest is the reward for capital, paid for the use of money.'
      B: 'You chose direct rate. A rate is a local tax on property, not a payment to the unemployed.'
      C: 'You picked economic rent. That is a surplus earned by a factor at work, and the unemployed man is not supplying a factor.'
  12:
    moments:
      - section: 'The question'
        say: 'The price is held at P one, above the market price. What does the gap F G show?'
        write: 'At $P_1$, FG indicates $?$'
      - section: 'Name it'
        say: 'This is about a price held above equilibrium, and the gap it creates.'
        write: 'Price above equilibrium'
      - section: 'Look at the graph'
        say: 'Look at the graph. Demand slopes down, supply slopes up, and they cross at E, the equilibrium.'
        write: 'D and S cross at E (price Pe)'
      - say: 'Now follow the line at P one. It meets the demand curve first at F, then the supply curve further right at G.'
        write: 'At $P_1$: F on D, G on S'
      - section: 'How it works'
        say: 'At P one, buyers want only the quantity at F, but sellers offer the quantity at G. Sellers offer more than buyers take.'
        write: 'Quantity supplied > quantity demanded'
      - say: 'So F G is the amount supplied that buyers do not take. That is excess supply, a surplus.'
        write: 'FG = excess supply'
      - section: 'In Nigeria'
        say: 'When a minimum price keeps maize above the market price, bags of maize pile up unsold in Kaduna stores.'
        write: 'Maize piles up unsold'
      - section: 'Remember'
        say: 'Remember, price above equilibrium gives a surplus, and price below gives a shortage.'
        write: 'Above ⇒ surplus, below ⇒ shortage'
      - section: 'Answer'
        say: 'So F G indicates excess supply, which is option B.'
        write: '$\therefore$ excess supply'
        answer: true
    traps:
      A: 'You went for equilibrium quantity demanded. Equilibrium is read at E, where the curves meet, not along F G.'
      C: 'You chose equilibrium quantity supplied. That is also read at E, not along F G.'
      D: 'You picked excess demand. That gap appears only when the price is below equilibrium, and P one is above it.'
  13:
    moments:
      - section: 'The question'
        say: 'Why do people keep cash in their pockets instead of putting it all to work? That wish has a name.'
        write: 'The demand for money is $?$'
      - section: 'Name it'
        say: 'This is the demand for money, also called liquidity preference.'
        write: 'Demand for money (liquidity preference)'
      - section: 'The rule'
        say: 'It is the desire to hold wealth as cash, in liquid form, rather than lend it or buy assets.'
        write: 'Desire to hold money in liquid form'
      - section: 'How it works'
        say: 'Keynes gave three motives. People hold money for daily spending, for emergencies and to wait for a better chance to invest.'
        write: 'Transactions, precautionary, speculative motives'
      - section: 'In Nigeria'
        say: 'A market woman in Aba keeps cash at home for her daily stock and in case a child falls sick. She is demanding money.'
        write: 'Cash at home for stock and emergencies'
      - section: 'Remember'
        say: 'Remember, demand for money means keeping money as money.'
        write: 'Keep money as money'
      - section: 'Answer'
        say: 'So the demand for money is the desire to hold money in liquid form rather than invest it, which is option D.'
        write: '$\therefore$ desire to hold money in liquid form'
        answer: true
    traps:
      A: 'You went for money in fixed deposit. That money is tied up and earns interest, so it is not liquid.'
      B: 'You chose tangible assets. Buying assets means giving up money, not holding it.'
      C: 'You picked money to invest. Investing means parting with liquid money.'
  14:
    moments:
      - section: 'The question'
        say: 'A producer has a fixed budget for workers and machines. Where does he get the most output for it?'
        write: 'Producer equilibrium is where $?$'
      - section: 'Name it'
        say: 'This is producer equilibrium, the least cost combination of factors.'
        write: 'Producer equilibrium'
      - section: 'The rule'
        say: 'An isoquant joins mixes of labour and capital that give the same output. An isocost line joins mixes that cost the same.'
        write: 'Isoquant = same output, isocost = same cost'
      - section: 'How it works'
        say: 'The producer is at equilibrium where his isocost line just touches the highest isoquant he can reach. There he gets the most output for his money.'
        write: 'Isoquant tangent to isocost'
      - section: 'In Nigeria'
        say: 'A block maker in Ibadan picks the mix of workers and moulding machines that gives the most blocks for his budget.'
        write: 'Most blocks for the budget'
      - section: 'Remember'
        say: 'Remember, the isoquant touches the isocost.'
        write: 'Isoquant touches isocost'
      - section: 'Answer'
        say: 'So the producer is at equilibrium where the isoquant is tangent to the isocost curve, which is option D.'
        write: '$\therefore$ isoquant tangent to isocost'
        answer: true
    traps:
      A: 'You went for isocost above the isoquant. Then the same output could be made more cheaply.'
      B: 'You chose isoquant below the isocost. Then a higher output could be reached for the same cost.'
      C: 'You picked marginal revenue. That belongs to the output market, not to choosing factors.'
  15:
    moments:
      - section: 'The question'
        say: 'Nigeria sells crude oil abroad and buys machines. Which balance compares the two?'
        write: 'Balance of trade compares $?$'
      - section: 'Name it'
        say: 'This is the balance of trade.'
        write: 'Balance of trade'
      - section: 'The rule'
        say: 'It is the difference between the value of visible exports and visible imports, goods you can see and touch.'
        write: 'Visible exports minus visible imports'
      - section: 'How it works'
        say: 'If exports of goods are worth more than imports of goods, the balance is a surplus. If less, it is a deficit.'
        write: 'Exports > imports ⇒ surplus'
      - section: 'In Nigeria'
        say: 'Nigeria exports crude oil, cocoa and sesame, and imports refined petrol, machinery and rice.'
        write: 'Oil, cocoa out; petrol, machines in'
      - section: 'Remember'
        say: 'Remember, the balance of trade is trade in things you can see.'
        write: 'Things you can see'
      - section: 'Answer'
        say: 'So the balance of trade compares the total value of visible imports and exports, which is option B.'
        write: '$\therefore$ visible imports and exports'
        answer: true
    traps:
      A: 'You went for internal and external trade. Internal trade is not part of any international balance.'
      C: 'You chose deficit and surplus. Those are results of the balance, not what it compares.'
      D: 'You picked invisible items. Shipping, insurance and tourism belong to the wider balance of payments.'
  16:
    moments:
      - section: 'The question'
        say: 'Twenty million naira is deposited in a bank. By how much can the money supply grow? It is more than you think.'
        write: 'Deposit ₦20 million, CRR 30%, increase $= ?$'
      - section: 'Name it'
        say: 'This is credit creation by commercial banks.'
        write: 'Credit creation'
      - section: 'The data'
        say: 'The new deposit is twenty million naira. The cash reserve ratio is thirty per cent, which is zero point three.'
        write: 'Deposit = ₦20 million, $r = 30\% = 0.3$'
      - section: 'The rule'
        say: 'Banks keep the reserve and lend out the rest again and again. Total deposits equal the deposit divided by the reserve ratio.'
        write: 'Total deposits $= \dfrac{\text{deposit}}{r}$'
      - section: 'Working'
        say: 'So we divide twenty million by zero point three.'
        write: '$\dfrac{20}{0.3}$'
      - say: 'Twenty divided by zero point three is sixty-six point six seven. That is about sixty-six point seven million naira.'
        write: '$= 66.7$, so ₦66.7 million'
      - section: 'Check'
        say: 'Check. The multiplier is one over zero point three, about three point three three. Twenty times three point three three is about sixty-six point seven. Good.'
        write: '$20 \times 3.33 \approx 66.7$ ✓'
      - section: 'In Nigeria'
        say: 'A deposit in a Lagos bank is lent to a trader, who pays a supplier, who deposits it in another bank, and so the money grows.'
        write: 'Lend, spend, redeposit, again'
      - section: 'Answer'
        say: 'So the money supply rises by sixty-six point seven million naira, which is option D.'
        write: '$\therefore$ ₦66.7 million'
        answer: true
    traps:
      A: 'You went for fifty-seven point eight million. That does not come from dividing twenty million by zero point three.'
      B: 'You chose forty-seven point nine million. That is close to the new loans alone, but the money supply counts all the deposits, sixty-six point seven million.'
      C: 'You picked sixty-nine point seven eight million. Twenty divided by zero point three gives sixty-six point seven, not that.'
  17:
    moments:
      - section: 'The question'
        say: 'A famous lace becomes cheap. Will the rich buy more of it, or less? This is a trap for many students.'
        write: 'Price of ostentatious goods falls, then $?$'
      - section: 'Name it'
