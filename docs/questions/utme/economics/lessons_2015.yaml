  22:
    moments:
      - section: 'The question'
        say: 'A tax is put on a good. Buyers pay some, sellers pay some. When do they pay exactly half each?'
        write: '$E_s = 1$, equal shares when demand is $?$'
      - section: 'Name it'
        say: 'This is tax incidence, who bears the burden of a tax.'
        write: 'Tax incidence'
      - section: 'The rule'
        say: 'The side that is less elastic bears more. The buyers'' share is the elasticity of supply over the sum of both elasticities.'
        write: 'Buyers'' share $= \dfrac{E_s}{E_d + E_s}$'
      - section: 'The data'
        say: 'The elasticity of supply is one. For half each, the elasticity of demand must equal it, so it must also be one.'
        write: '$E_s = 1$, need $E_d = E_s = 1$'
      - section: 'Working'
        say: 'Put in one and one. The buyers'' share is one over one plus one, which is a half.'
        write: 'Buyers'' share $= \dfrac{1}{1 + 1} = \dfrac{1}{2}$'
      - section: 'Check'
        say: 'Check. Less elastic demand would load more on buyers, and more elastic demand would load more on sellers. Only equal elasticities give half each.'
        write: 'Equal elasticities ⇒ equal shares ✓'
      - section: 'In Nigeria'
        say: 'A ten naira tax on a bag of sachet water would raise its price by five naira, and sellers would bear the other five.'
        write: '₦10 tax ⇒ buyers ₦5, sellers ₦5'
      - section: 'Remember'
        say: 'Remember, equal elasticities give equal shares.'
        write: 'Equal elasticities, equal shares'
      - section: 'Answer'
        say: 'So the tax is shared equally if demand is unitary elastic, which is option D.'
        write: '$\therefore$ unitary elastic'
        answer: true
    traps:
      A: 'You went for fairly elastic. Demand more elastic than supply pushes more of the tax onto sellers.'
      B: 'You chose perfectly inelastic. Then buyers cannot cut back at all and bear the whole tax.'
      C: 'You picked fairly inelastic. Demand less elastic than supply puts more of the tax on buyers.'
