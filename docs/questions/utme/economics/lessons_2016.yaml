        say: 'This is average product, from the theory of production.'
        write: 'Average product (AP)'
      - section: 'The rule'
        say: 'Average product is total product divided by the number of units of the factor.'
        write: '$AP = \dfrac{TP}{n}$'
      - section: 'Read the table'
        say: 'Look at the table. Go down the units of capital column to five, then across. Total product is three hundred and fifty three kilograms.'
        write: '$n = 5$, $TP = 353$ kg'
      - section: 'Work it out'
        say: 'Put them in. A P equals three hundred and fifty three over five.'
        write: '$AP = \dfrac{353}{5}$'
      - say: 'Three hundred and fifty three divided by five is seventy point six kilograms.'
        write: '$AP = 70.6$ kg'
      - section: 'Check'
        say: 'Check. Seventy point six times five is three hundred and fifty three. Good.'
        write: '$70.6 \times 5 = 353$ ✓'
      - section: 'In Nigeria'
        say: 'If five grinding machines in a Kano mill produce three hundred and fifty three kilograms of flour, each produces seventy point six kilograms on average.'
        write: '5 machines, 353 kg ⇒ 70.6 kg each'
      - section: 'Answer'
        say: 'So the average product of the fifth unit is seventy point six kilograms, which is option C.'
        write: '$\therefore AP = 70.6$ kg'
        answer: true
    traps:
