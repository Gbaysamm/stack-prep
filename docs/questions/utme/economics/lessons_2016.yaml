# UTME 2016 Economics, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Nigerian Economics teacher works on the
# board: the question, the concept named, the rule or definition, how it works (cause and
# effect, or the calculation with data, formula, working and check), a Nigerian example, a way
# to remember it, and the answer moment that names the option.
#
#   say:     heard, not read. Symbols read as words ("M R", "Q d"), money in words,
#            percentages as "per cent", no symbols the voice would stop on.
#   write:   the one line written while it is said, with KaTeX between dollar signs.
#   answer:  true on the moment that gives the answer.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2016.yaml. Answers match that file. This paper
# has no paper-type question, so all 50 questions have a lesson.
format_version: 1
exam_year: 2016
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'A government chooses to spend more than it earns. Why would anyone do that on purpose? Let us find out.'
        write: 'Deficit financing is used in order to ?'
      - section: 'Name it'
        say: 'This is deficit financing, a tool of fiscal policy.'
        write: 'Deficit financing (fiscal policy)'
      - section: 'The rule'
        say: 'Deficit financing means the government spends more than its revenue, and fills the gap by borrowing or by creating money.'
        write: 'Spending > revenue, gap filled by borrowing'
      - section: 'How it works'
        say: 'The extra spending on roads and power puts money in people''s hands, so aggregate demand rises.'
        write: 'More spending ⇒ aggregate demand rises'
      - say: 'Firms see more sales ahead, so they invest more and hire more workers. That is how it lifts an economy out of a slump.'
        write: 'More sales expected ⇒ firms invest more'
      - section: 'In Nigeria'
        say: 'In the twenty sixteen recession, the Federal Government ran a big deficit budget to fund capital projects and get businesses investing again.'
        write: '2016 recession: deficit budget for capital projects'
      - section: 'Remember'
        say: 'Remember, spend more than you earn, to wake the economy up.'
        write: 'Deficit ⇒ wake the economy up'
      - section: 'Answer'
        say: 'So a country embarks on deficit financing to stimulate investment, which is option C.'
        write: '$\therefore$ to stimulate investment'
        answer: true
    traps:
      A: 'You went for reducing aggregate demand. Spending more than revenue raises demand, it does not reduce it.'
      B: 'You chose increasing revenue. A deficit means revenue is short. Borrowed money fills the gap, but it is a loan, not revenue.'
      D: 'You picked curbing inflation. Extra spending adds to demand and can push prices up. A surplus budget is what curbs inflation.'
  2:
    moments:
      - section: 'The question'
        say: 'A firm needs money for three months, not thirty years. Which market does it go to?'
        write: 'The money market lets firms ?'
      - section: 'Name it'
        say: 'This is the money market, one of the two financial markets.'
        write: 'Financial markets = money market + capital market'
      - section: 'The rule'
        say: 'The money market is the market for short term funds, loans that run for a year or less.'
        write: 'Money market = short-term funds (up to 1 year)'
      - section: 'How it works'
        say: 'Firms borrow there for working capital, such as wages or stock, through treasury bills, commercial papers, call money and overdrafts.'
        write: 'Treasury bills, commercial papers, call money, overdrafts'
      - say: 'Long term funds, for factories and machines, come from the capital market instead, through shares and bonds.'
        write: 'Long-term funds ⇒ capital market'
      - section: 'In Nigeria'
        say: 'A Lagos supermarket that needs twenty million naira for three months to stock up before Christmas borrows in the money market.'
        write: '₦20 million for 3 months ⇒ money market'
      - section: 'Remember'
        say: 'Remember, the money market is for months and the capital market is for years.'
        write: 'Money market: months.  Capital market: years.'
      - section: 'Answer'
        say: 'So the money market lets firms obtain short term funds, which is option C.'
        write: '$\therefore$ obtain short-term funds'
        answer: true
    traps:
      A: 'You went for buying goods and services. That happens in product markets, not in the money market.'
      B: 'You chose buying capital equipment. Machines are long term assets, financed through the capital market.'
      D: 'You picked long term funds. Those are raised in the capital market, through shares and bonds.'
  3:
    moments:
      - section: 'The question'
        say: 'A monopolist can charge any price it likes. So does it just charge the highest price? Many students think so, and that is the trap.'
        write: 'Pure monopolist, best output where ?'
      - section: 'Name it'
        say: 'This is the profit maximizing output of a firm, and the monopolist follows the same rule as every firm.'
        write: 'Profit-maximizing output'
      - section: 'The rule'
        say: 'Every firm makes the most profit where marginal revenue equals marginal cost, M R equals M C.'
        write: '$MR = MC$'
      - section: 'How it works'
        say: 'Before that point, one more unit adds more to revenue than to cost, so making it raises profit.'
        write: '$MR > MC$ ⇒ make more, profit rises'
      - say: 'After that point, one more unit adds more to cost than to revenue, so profit falls.'
        write: '$MR < MC$ ⇒ make less, profit falls'
      - say: 'So profit is greatest exactly where the two are equal. The monopolist then charges the price buyers will pay for that output.'
        write: 'Profit peaks at $MR = MC$; price read from demand curve'
      - section: 'In Nigeria'
        say: 'If the only cement maker in a region finds that one more bag adds two thousand five hundred naira to revenue and the same to cost, it stops there.'
        write: 'Extra bag: +₦2,500 revenue, +₦2,500 cost ⇒ stop'
      - section: 'Remember'
        say: 'Remember, stop where the last unit just pays for itself.'
        write: 'Last unit just pays for itself ⇒ $MR = MC$'
      - section: 'Answer'
        say: 'So the optimum output for a pure monopolist is where M R equals M C, which is option D.'
        write: '$\therefore MR = MC$'
        answer: true
    traps:
      A: 'You went for the highest price. At the highest price the monopolist sells almost nothing, so profit is not greatest there.'
      B: 'You chose price equal to average cost. That is break even, where profit is zero.'
      C: 'You picked price equal to marginal cost. That is the rule in perfect competition, where price equals marginal revenue. A monopolist''s price is above marginal revenue.'
  4:
    moments:
      - section: 'The question'
        say: 'Births are still high in most of Africa, but deaths are falling. Which stage of the demographic transition is that?'
        write: 'High birth rate, falling death rate ⇒ stage ?'
      - section: 'Name it'
        say: 'This is the demographic transition theory. It shows how a population changes as a country develops.'
        write: 'Demographic transition theory'
      - section: 'The four stages'
        say: 'Stage one has a high birth rate and a high death rate, so the population grows slowly.'
        write: 'Stage 1: high births, high deaths'
      - say: 'Stage two has a high birth rate but a falling death rate, so the population grows fast.'
        write: 'Stage 2: high births, falling deaths'
      - say: 'In stage three the birth rate falls too. In stage four both rates are low.'
        write: 'Stage 3: births falling.  Stage 4: both low'
      - section: 'How it fits'
        say: 'Vaccines, better medicine and clean water have cut deaths in most of Africa. But families are still large, so births stay high. That is stage two.'
        write: 'Deaths falling, births still high ⇒ stage 2'
      - section: 'In Nigeria'
        say: 'Fewer Nigerian children die of measles than fifty years ago, but many families still have five or six children. So the population grows fast.'
        write: 'Nigeria: fewer child deaths, still large families'
      - section: 'Remember'
        say: 'Remember, in stage two death falls first and birth has not caught up.'
        write: 'Stage 2: death falls first'
      - section: 'Answer'
        say: 'So most of Africa is at stage two only, which is option C.'
        write: '$\therefore$ stage 2 only'
        answer: true
    traps:
      A: 'You went for stages two and three. Stage three needs a clearly falling birth rate, and most of Africa has not reached it yet.'
      B: 'You chose stage three only. That needs falling births, but births are still high.'
      D: 'You picked stages one and three. Stage one has high death rates, but death rates in Africa are falling.'
  5:
    moments:
      - section: 'The question'
        say: 'Fifteen West African countries agree to trade freely with each other. What do we call that?'
        write: 'ECOWAS is an example of ?'
      - section: 'Name it'
        say: 'This is economic integration.'
        write: 'Economic integration'
      - section: 'The rule'
        say: 'Economic integration is the coming together of countries to remove barriers to trade and movement among themselves.'
        write: 'Countries remove trade barriers among themselves'
      - section: 'How it works'
        say: 'ECOWAS was set up in Lagos in nineteen seventy five, so that goods, people and services move freely in West Africa.'
        write: 'ECOWAS: Lagos, 1975, free movement in West Africa'
      - say: 'It aims at a customs union and, in time, a full economic union. But it is still on that road.'
        write: 'Aim: customs union ⇒ economic union (not yet)'
      - section: 'In Nigeria'
        say: 'With an ECOWAS passport, a Nigerian trader can travel to Ghana or Benin without a visa and sell her goods there.'
        write: 'No visa to Ghana or Benin for ECOWAS citizens'
      - section: 'Remember'
        say: 'Remember, ECOWAS brings West African economies together, and together means integration.'
        write: 'Together ⇒ integration'
      - section: 'Answer'
        say: 'So ECOWAS is an example of economic integration, which is option C.'
        write: '$\therefore$ economic integration'
        answer: true
    traps:
      A: 'You went for globalization. That is worldwide. ECOWAS is a regional group of West African countries.'
      B: 'You chose a regional marketing board. A marketing board buys and sells farm produce, which ECOWAS does not do.'
      D: 'You picked economic union. That is the final and fullest stage of integration, with common policies, and ECOWAS has not reached it.'
  6:
    moments:
      - section: 'The question'
        say: 'We have ten numbers, and one of them turns up twice. Which one is the mode?'
        write: '32, 18, 24, 17, 16, 32, 28, 68, 71, 15. Mode $= ?$'
      - section: 'Name it'
        say: 'This is the mode, a measure of central tendency.'
        write: 'Mode (measure of central tendency)'
      - section: 'The rule'
        say: 'The mode is the value that occurs most often.'
        write: 'Mode = value that occurs most often'
      - section: 'Count'
        say: 'Count each value. Thirty two appears twice.'
        write: '32 appears 2 times'
      - say: 'Every other value appears only once.'
        write: '18, 24, 17, 16, 28, 68, 71, 15: once each'
      - section: 'Check'
        say: 'Check. No other value appears more than once, so thirty two is the mode.'
        write: 'Highest frequency = 2, for 32 ✓'
      - section: 'Remember'
        say: 'Remember, mode means most, like the size of shoe a market seller sells most often.'
        write: 'Mode = most'
      - section: 'Answer'
        say: 'So the mode is thirty two, which is option C.'
        write: '$\therefore$ mode = 32'
        answer: true
    traps:
      A: 'You went for seventy one. That is the largest value, not the most frequent.'
      B: 'You chose fifty six. That is the range, seventy one minus fifteen, not the mode.'
      D: 'You picked fifteen. That is the smallest value, and it appears only once.'
  7:
    moments:
      - section: 'The question'
        say: 'The question asks about income elasticity of demand, and the answer is hiding in its name.'
        write: 'Main determinant of income elasticity of demand?'
      - section: 'Name it'
        say: 'This is income elasticity of demand.'
        write: 'Income elasticity of demand'
      - section: 'The rule'
        say: 'It measures how much quantity demanded changes when the consumer''s income changes.'
        write: '$\text{YED} = \dfrac{\%\,\Delta Q_d}{\%\,\Delta Y}$'
      - section: 'How it works'
        say: 'Because it is a response to income, the level of the consumer''s income is what settles it.'
        write: 'Response to income ⇒ income decides'
      - say: 'At low incomes, a rise goes on basic food. At high incomes, it goes on cars and travel.'
        write: 'Low income: food.  High income: cars, travel'
      - section: 'In Nigeria'
        say: 'When a civil servant''s salary rises, she buys more imported rice and fish, and maybe less garri.'
        write: 'Salary up ⇒ more rice and fish, less garri'
      - section: 'Remember'
        say: 'Remember, for income elasticity, income decides.'
        write: 'Income elasticity ⇒ income'
      - section: 'Answer'
        say: 'So the major determinant is the level of the consumer''s income, which is option D.'
        write: '$\therefore$ the level of the consumer''s income'
        answer: true
    traps:
      A: 'You went for government policy. Income elasticity measures a response to income, not to policy.'
      B: 'You chose availability of substitutes. That is the main determinant of price elasticity, not income elasticity.'
      C: 'You picked the price of the good. The good''s own price belongs to price elasticity.'
  8:
    moments:
      - section: 'The question'
        say: 'We have six numbers. On average, how far is each one from the mean? That is the mean deviation.'
        write: '2, 4, 6, 8, 4, 6. Mean deviation $= ?$'
      - section: 'The rule'
        say: 'Mean deviation is the sum of the distances from the mean, ignoring signs, divided by the number of values.'
        write: 'M.D. $= \dfrac{\Sigma |x - \bar{x}|}{n}$'
      - section: 'The mean'
        say: 'First the mean. Two plus four plus six plus eight plus four plus six is thirty.'
        write: '$\Sigma x = 2 + 4 + 6 + 8 + 4 + 6 = 30$'
      - say: 'Thirty divided by six is five. So the mean is five.'
        write: '$\bar{x} = \dfrac{30}{6} = 5$'
      - section: 'The deviations'
        say: 'Now find each distance from five, ignoring signs. They are three, one, one, three, one and one.'
        write: '$|x - 5|$: 3, 1, 1, 3, 1, 1'
      - say: 'Add them up. Three plus one plus one plus three plus one plus one is ten.'
        write: '$\Sigma |x - \bar{x}| = 10$'
      - section: 'Divide'
        say: 'Ten divided by six is one point six seven.'
        write: 'M.D. $= \dfrac{10}{6} = 1.67$'
      - section: 'Check'
        say: 'Check. Every value is one or three away from five, so an average distance near one point seven makes sense.'
        write: 'Distances 1 and 3 ⇒ about 1.7 ✓'
      - section: 'Answer'
        say: 'So the mean deviation is one point six seven, which is option B.'
        write: '$\therefore$ M.D. $= 1.67$'
        answer: true
    traps:
      A: 'You went for six. That is the number of values, not the mean deviation.'
      C: 'You chose thirty. That is the sum of the values, which we used to find the mean.'
      D: 'You picked zero point six. That divides six by ten. It should be ten divided by six.'
  9:
    moments:
      - section: 'The question'
        say: 'You keep some money aside in case you fall sick. What decides how much you can keep?'
        write: 'Precautionary demand for money is determined by ?'
      - section: 'Name it'
        say: 'This is the precautionary motive, one of Keynes''s three motives for holding money.'
        write: 'Keynes: transactions, precautionary, speculative'
      - section: 'The rule'
        say: 'Precautionary demand is money kept for emergencies, such as illness or a sudden journey.'
        write: 'Precautionary = money for emergencies'
      - section: 'How it works'
        say: 'The higher your income, the more you can set aside for emergencies. So it rises with income.'
        write: 'Income up ⇒ precautionary demand up'
      - say: 'The transactions motive also depends on income. Only the speculative motive depends on the rate of interest.'
        write: 'Transactions, precautionary ⇒ income.  Speculative ⇒ interest'
      - section: 'In Nigeria'
        say: 'A trader in Onitsha earning five hundred thousand naira a month can keep fifty thousand for emergencies. A labourer earning thirty thousand can keep far less.'
        write: '₦500,000 income vs ₦30,000 income'
      - section: 'Remember'
        say: 'Remember, two motives follow income, and one follows interest.'
        write: 'Two follow income, one follows interest'
      - section: 'Answer'
        say: 'So the precautionary demand for money is determined by the level of income, which is option D.'
        write: '$\therefore$ the level of income'
        answer: true
    traps:
      A: 'You went for the level of savings. Savings is what is left over. The amount kept for emergencies depends on income.'
      B: 'You chose the rate of interest. That drives the speculative motive, not the precautionary one.'
      C: 'You picked the price level. It changes all money demand in naira terms, but the motive itself is set by income.'
  10:
    moments:
      - section: 'The question'
        say: 'A firm grows bigger and enjoys economies of scale. What happens to its cost per unit?'
        write: 'Economies of scale, output rises, average cost ?'
      - section: 'Name it'
        say: 'This is economies of scale.'
        write: 'Economies of scale'
      - section: 'The rule'
        say: 'Economies of scale are the savings in cost a firm enjoys as it grows larger.'
        write: 'Savings in cost from growing larger'
      - section: 'How it works'
        say: 'A bigger firm buys raw materials in bulk at a discount, uses better machines and borrows more cheaply.'
        write: 'Bulk buying, better machines, cheaper loans'
      - say: 'So each unit costs less to make, and average cost falls.'
        write: 'Cost per unit falls ⇒ AC falls'
      - section: 'In Nigeria'
        say: 'A big bakery in Ibadan buying flour by the trailer pays less per bag than a small baker buying one bag. So each loaf costs it less.'
        write: 'Flour by the trailer ⇒ cheaper loaf'
      - section: 'Remember'
        say: 'Remember, economies of scale make you bigger and cheaper per unit.'
        write: 'Bigger ⇒ cheaper per unit'
      - section: 'Answer'
        say: 'So the average cost would fall, which is option D.'
        write: '$\therefore$ AC falls'
        answer: true
    traps:
      A: 'You went for minimum. Average cost reaches its minimum only when economies of scale are used up. While they last, it is still falling.'
      B: 'You chose rise. Average cost rises with diseconomies of scale, not economies.'
      C: 'You picked maximum. Economies of scale push average cost down, not up to a peak.'
  11:
    moments:
      - section: 'The question'
        say: 'Why does the demand curve slope downwards? Look at whose behaviour it shows.'
        write: 'Why is the demand curve negatively sloped?'
      - section: 'Name it'
        say: 'This is the law of demand.'
        write: 'The law of demand'
      - section: 'The rule'
        say: 'Other things equal, the lower the price, the more is bought. So the curve falls from left to right.'
        write: 'Price down ⇒ quantity demanded up'
      - section: 'How it works'
        say: 'When the price falls, the good is cheaper than its substitutes, so buyers switch to it. That is the substitution effect.'
        write: 'Substitution effect: cheaper than substitutes'
      - say: 'The buyer''s money also goes further, so he can buy more. That is the income effect.'
        write: 'Income effect: money goes further'
      - say: 'So a fall in price is an incentive to consumers to buy more.'
        write: 'Fall in price = incentive to consumers'
      - section: 'In Nigeria'
        say: 'When a mudu of rice falls from one thousand five hundred naira to one thousand two hundred naira, families buy more of it.'
        write: 'Rice ₦1,500 ⇒ ₦1,200, more bought'
      - section: 'Remember'
        say: 'Remember, a cheaper price brings more buyers.'
        write: 'Cheaper ⇒ more buyers'
      - section: 'Answer'
        say: 'So the demand curve slopes down because a fall in price is an incentive to consumers to buy more, which is option B.'
        write: '$\therefore$ a fall in price is an incentive to consumers'
        answer: true
    traps:
      A: 'You went for producers. Producers respond to a higher price by selling more, and that explains the supply curve, not the demand curve.'
      C: 'You chose demand always exceeds supply. That is not true, because at equilibrium the two are equal.'
      D: 'You picked price and quantity moving the same way. On a demand curve they move in opposite directions.'
  12:
    moments:
      - section: 'The question'
        say: 'There are three cost curves on one diagram. Can you find the right one and read it at twenty units?'
        write: 'ATC at 20 units $= ?$'
      - section: 'Name it'
        say: 'This is average total cost, the total cost of each unit.'
        write: '$ATC = \dfrac{TC}{Q} = AFC + AVC$'
      - section: 'Look at the diagram'
        say: 'Look at the diagram. The purple curve is M C. The higher U shaped black curve is A T C, and the lower one is A V C.'
        write: 'MC (purple), ATC (upper U), AVC (lower U)'
      - section: 'The rule'
        say: 'The M C curve always cuts the A T C curve at its lowest point.'
        write: 'MC cuts ATC at its minimum'
      - section: 'Read it'
        say: 'Find twenty on the output axis and go straight up to where M C cuts A T C.'
        write: 'Output 20 ⇒ up to ATC'
      - say: 'Now go across along the dashed line to the cost axis. It reaches fifteen naira.'
        write: 'Across to cost axis ⇒ ₦15'
      - section: 'Check'
        say: 'Check. Total cost is twenty times fifteen, which is three hundred naira. That is eighty naira fixed cost plus twenty times eleven naira variable cost.'
        write: '$TC = 20 \times 15 = 300 = 80 + 20 \times 11$ ✓'
      - section: 'In Nigeria'
        say: 'A sachet water maker who spends three hundred naira to make twenty bags spends fifteen naira a bag on average.'
        write: '₦300 for 20 bags ⇒ ₦15 a bag'
      - section: 'Remember'
        say: 'Remember, M C cuts the U at the bottom.'
        write: 'MC cuts the U at the bottom'
      - section: 'Answer'
        say: 'So the average total cost at twenty units is fifteen naira, which is option C.'
        write: '$\therefore ATC = ₦15$'
        answer: true
    traps:
      A: 'You went for ten naira. That is the lowest point of A V C, at ten units.'
      B: 'You chose eighteen naira. That is A T C at ten units. Read it at twenty units instead.'
      D: 'You picked five naira. That is not on the diagram at twenty units. A T C there reads fifteen naira.'
  13:
    moments:
      - section: 'The question'
        say: 'Think of Shell, Chevron and Total. Do they only drill for oil, or do they also sell it?'
        write: 'Major role of multinationals in Nigerian oil ?'
      - section: 'Name it'
        say: 'These are multinational companies, large foreign firms that work in many countries.'
        write: 'Multinationals: Shell, Chevron, ExxonMobil, Total, Agip'
      - section: 'The rule'
        say: 'In Nigeria''s oil industry they work in the upstream, which is prospecting and producing crude.'
        write: 'Upstream: prospecting, drilling, producing'
      - say: 'Some also work in the downstream, marketing petroleum products.'
        write: 'Downstream: marketing products'
      - section: 'In Nigeria'
        say: 'Total and Mobil filling stations in Lagos sell petrol, while their parent firms drill for crude in the Niger Delta.'
        write: 'Total, Mobil: filling stations + drilling'
      - section: 'Remember'
        say: 'Remember, multinationals find the oil and also sell it.'
        write: 'Find it and sell it'
      - section: 'Answer'
        say: 'So their major role is oil marketing and prospecting, which is option B.'
        write: '$\therefore$ oil marketing and prospecting'
        answer: true
    traps:
      A: 'You went for marketing only. They also prospect for and produce crude, which is their biggest role.'
      C: 'You chose refineries. Nigeria''s main refineries were built and owned by the government through the N N P C.'
      D: 'You picked prospecting only. They do prospect, but they also market products, so the word only makes it wrong.'
  14:
    moments:
      - section: 'The question'
        say: 'A life insurance policy runs for twenty or thirty years. So where does the insurer keep the money meanwhile?'
        write: 'Life insurers hold assets in ?'
      - section: 'Name it'
        say: 'This is the role of insurance companies in economic development.'
        write: 'Insurance companies and development'
      - section: 'The rule'
        say: 'Life insurers collect premiums for many years before they pay out, so they hold large long term funds.'
        write: 'Premiums for years ⇒ long-term funds'
      - section: 'How it works'
        say: 'They invest these funds in long term instruments, such as government bonds, shares and mortgages.'
        write: 'Bonds, shares, mortgages'
      - say: 'That money pays for roads, factories and houses, which helps the economy grow.'
        write: 'Finances roads, factories, houses'
      - section: 'In Nigeria'
        say: 'A Nigerian life insurer that buys Federal Government bonds helps pay for a new highway.'
        write: 'FGN bonds ⇒ new highway'
      - section: 'Remember'
        say: 'Remember, long term policies mean long term investments.'
        write: 'Long-term policies ⇒ long-term investments'
      - section: 'Answer'
        say: 'So life insurers contribute by holding long term financial instruments, which is option A.'
        write: '$\therefore$ long-term financial instruments'
        answer: true
    traps:
      B: 'You went for equipment. Insurers are financial firms. They invest in securities, not machines.'
      C: 'You chose cash and near money. That earns little and does not finance long term development.'
      D: 'You picked money market instruments. Those are short term, but life funds are invested for the long term.'
  15:
    moments:
      - section: 'The question'
        say: 'Why is one worker paid more than another? Look at what the last worker adds.'
        write: 'The wage rate is mostly related to ?'
      - section: 'Name it'
        say: 'This is the marginal productivity theory of wages.'
        write: 'Marginal productivity theory of wages'
      - section: 'The rule'
        say: 'It says a worker is paid according to his marginal productivity, the extra output he adds.'
        write: 'Wage = value of marginal product of labour'
      - section: 'How it works'
        say: 'A firm keeps hiring while the last worker adds at least as much to revenue as his wage costs.'
        write: 'Hire while extra revenue ≥ wage'
      - say: 'So the wage settles at the value of the marginal product of labour.'
        write: 'Wage settles at the margin'
      - section: 'In Nigeria'
        say: 'If one more tailor in an Aba shop adds sixty thousand naira of output a month, the owner will not pay him more than that.'
        write: 'Extra tailor adds ₦60,000 ⇒ wage ≤ ₦60,000'
      - section: 'Remember'
        say: 'Remember, you are paid what the last worker adds.'
        write: 'Paid what the last worker adds'
      - section: 'Answer'
        say: 'So the wage rate is mostly related to the marginal productivity of labour, which is option A.'
        write: '$\therefore$ marginal productivity of labour'
        answer: true
    traps:
      B: 'You went for average productivity. Hiring is decided on the last worker, so the margin matters, not the average.'
      C: 'You chose the marginal efficiency of investment. That is about capital and the rate of interest, not wages.'
      D: 'You picked total productivity. The total does not tell the employer what one more worker is worth.'
  16:
    moments:
      - section: 'The question'
        say: 'In a command economy, who gives the commands?'
