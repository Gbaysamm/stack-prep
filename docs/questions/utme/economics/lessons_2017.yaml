# UTME 2017 Economics, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Economics teacher works on the board:
# the question, the concept named, the rule or definition in plain words, how it works as cause
# and effect (or the calculation with data, formula, working and check), a Nigerian example, a
# way to remember it, and the answer moment that names the option.
#
#   say:     heard, not read. Symbols read as words (M P C, Q d), money and percentages in words,
#            no symbols the voice would stop on.
#   write:   the one line written while it is said, with LaTeX between dollar signs.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2017.yaml. Answers match that file. No question
# is dropped, so all 40 have a lesson.
format_version: 1
exam_year: 2017
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'Seven numbers have a mean of seven, but one of them is hidden. Can we find it?'
        write: '2, 3, 5, 8, Z, 10, 12 and mean $= 7$. Find Z.'
      - section: 'Name it'
        say: 'This is the arithmetic mean, a measure of central tendency.'
        write: 'Arithmetic mean'
      - section: 'The rule'
        say: 'The mean is the sum of the values divided by the number of values.'
        write: '$\bar{x} = \dfrac{\Sigma x}{n}$'
      - say: 'Turn it round, and the sum is the mean times the number of values.'
        write: '$\Sigma x = \bar{x} \times n$'
      - section: 'The working'
        say: 'There are seven values and the mean is seven, so the sum must be seven times seven, which is forty-nine.'
        write: '$\Sigma x = 7 \times 7 = 49$'
      - say: 'Now add the six numbers we know. Two plus three plus five plus eight plus ten plus twelve is forty.'
        write: '$2 + 3 + 5 + 8 + 10 + 12 = 40$'
      - say: 'The hidden number is what is left, forty-nine minus forty, which is nine.'
        write: '$Z = 49 - 40 = 9$'
      - section: 'Check'
        say: 'Put nine back. The seven numbers now add to forty-nine, and forty-nine divided by seven is seven.'
        write: '$49 \div 7 = 7$ ✓'
      - section: 'Remember'
        say: 'Remember, mean times number gives the total, and the total minus what you know gives the missing value.'
        write: 'Total $-$ known $=$ missing'
      - section: 'Answer'
        say: 'So Z is nine, which is option B.'
        write: '$\therefore Z = 9$'
        answer: true
    traps:
      A: 'You went for eight. Then the total is forty-eight, and forty-eight divided by seven is not seven.'
      C: 'You chose ten. Then the total is fifty, a little too big for a mean of seven.'
      D: 'You picked seven, the mean itself. The missing value must make the total forty-nine, and that needs nine.'
  2:
    moments:
      - section: 'The question'
        say: 'Agriculture does many jobs for Nigeria. Which one matters most?'
        write: 'Most important function of agriculture $= ?$'
      - section: 'Name it'
        say: 'This is the role of agriculture in economic development.'
        write: 'Role of agriculture'
      - section: 'The fact'
        say: 'Agriculture gives food, raw materials, exports, jobs and a market for industry. The first and most basic is food.'
        write: 'Food, raw materials, exports, jobs, market'
      - section: 'How it works'
        say: 'A nation that cannot feed itself spends scarce foreign exchange on imported food, and hungry workers cannot produce. So food security comes first.'
        write: 'No food ⇒ costly imports, weak workers'
      - section: 'In Nigeria'
        say: 'The yam, cassava, rice and beans grown by our farmers feed the whole country. When harvests fail, prices rise in every market.'
        write: 'Farms feed the nation'
      - section: 'Remember'
        say: 'Remember, first feed the nation, then build the nation.'
        write: 'Feed first, build next'
      - section: 'Answer'
        say: 'So the most important function is the guarantee of food security, which is option A.'
        write: '$\therefore$ food security'
        answer: true
    traps:
      B: 'You went for technical skills. Those come mainly from education and training.'
      C: 'You chose technological development. Research and industry develop technology, and agriculture mostly uses it.'
      D: 'You picked industrial development. Agriculture supports industry with raw materials, but feeding people comes first.'
  3:
    moments:
      - section: 'The question'
        say: 'We have a demand equation and a supply equation. Where do they meet?'
        write: '$Q_d = 15 - 2P$, $Q_s = 5 + 3P$, equilibrium $P = ?$'
      - section: 'The rule'
        say: 'At equilibrium, quantity demanded equals quantity supplied, so we put Q d equal to Q s.'
        write: '$Q_d = Q_s$'
      - section: 'The working'
        say: 'Fifteen minus two P equals five plus three P.'
        write: '$15 - 2P = 5 + 3P$'
      - say: 'Move the numbers to one side and the P terms to the other. Fifteen minus five equals three P plus two P.'
        write: '$15 - 5 = 3P + 2P$'
      - say: 'That gives ten equals five P.'
        write: '$10 = 5P$'
      - say: 'Divide both sides by five, because we want P by itself. P is two.'
        write: '$P = 2$'
      - section: 'Check'
        say: 'At two naira, demand is fifteen minus four, which is eleven, and supply is five plus six, which is also eleven. The market clears.'
        write: '$Q_d = 11$, $Q_s = 11$ ✓'
      - section: 'In Nigeria'
        say: 'In Bodija market, the price of garri settles where what buyers want just matches what sellers bring.'
        write: 'Garri price settles where $Q_d = Q_s$'
      - section: 'Answer'
        say: 'So the equilibrium price is two naira, which is option C.'
        write: '$\therefore P = ₦2.00$'
        answer: true
    traps:
      A: 'You went for three naira. There buyers want nine but sellers offer fourteen, a surplus.'
      B: 'You chose five naira. Supply would be twenty and demand only five, a big surplus.'
      D: 'You picked six naira. Demand is three and supply twenty-three, so the market does not clear.'
  4:
    moments:
      - section: 'The question'
        say: 'You have many wants and little money. How do you decide which to meet first?'
        write: 'Scale of preference $= ?$'
      - section: 'Name it'
        say: 'This is the scale of preference, a basic concept of economics.'
        write: 'Scale of preference'
      - section: 'The rule'
        say: 'It is a list of wants arranged in order of importance, from the most pressing to the least.'
        write: 'Wants ranked in order of priority'
      - section: 'How it works'
        say: 'Wants are many and means are scarce, so you meet your wants from the top of the list down. The want you give up is the opportunity cost.'
        write: 'Top of list first, next want forgone'
      - section: 'In Nigeria'
        say: 'A student with two thousand naira lists textbook, transport fare and then shawarma. He buys the textbook first.'
        write: '1. textbook  2. fare  3. shawarma'
      - section: 'Remember'
        say: 'Remember, a scale is a ladder, so wants are ranked from top to bottom.'
        write: 'Scale = ladder of wants'
      - section: 'Answer'
        say: 'So the scale of preference is consumer wants in order of priority, which is option D.'
        write: '$\therefore$ wants in order of priority'
        answer: true
    traps:
      A: 'You went for the choices consumers make. Choice comes after the ranking, and the scale is the ranked list itself.'
      B: 'You chose an array of needs. A plain list is not ranked, and ranking is the whole point.'
      C: 'You picked a preference for luxuries. The scale covers all wants, not only luxuries.'
  5:
    moments:
      - section: 'The question'
        say: 'Imagine you are the only seller of a product. What power do you have?'
        write: 'An assumption of monopoly $= ?$'
      - section: 'Name it'
        say: 'This is monopoly, a market with a single seller of a product that has no close substitute.'
        write: 'Monopoly, one seller, no close substitute'
      - section: 'The rule'
        say: 'The monopolist is a price maker. It can fix the price or the output, but not both.'
        write: 'Fix price OR output'
      - section: 'How it works'
        say: 'If it sets a high price, buyers take less. If it chooses a large output, it must accept a lower price. The demand curve decides the other one.'
        write: 'High price ⇒ less sold'
      - section: 'In Nigeria'
        say: 'Before mobile phones came, NITEL was the only telephone company, and it set line charges as it liked.'
        write: 'NITEL, one seller of phone lines'
      - section: 'Remember'
        say: 'Remember, mono means one, so one seller makes the price.'
        write: 'Mono = one ⇒ price maker'
      - section: 'Answer'
        say: 'So one assumption of monopoly is the ability to control either price or output, which is option B.'
        write: '$\therefore$ controls price or output'
        answer: true
    traps:
      A: 'You went for perfect information. That is an assumption of perfect competition.'
      C: 'You chose perfect mobility of factors. That also belongs to perfect competition.'
      D: 'You picked many buyers and sellers. That is perfect competition, the opposite of monopoly.'
  6:
    moments:
      - section: 'The question'
        say: 'A public company and a private company are cousins. What does the public one have that the private one lacks?'
        write: 'Plc over Ltd, major advantage $= ?$'
      - section: 'Name it'
        say: 'These are joint stock companies, public limited and private limited.'
        write: 'Public limited (Plc) and private limited (Ltd)'
      - section: 'The rule'
        say: 'Both have limited liability, a separate legal entity and perpetual existence. So those cannot be the difference.'
        write: 'Both: limited liability, legal entity, perpetual'
      - section: 'How it works'
        say: 'A public company sells shares to the public, and they are bought and sold freely on the stock exchange. A private company restricts the transfer of its shares.'
        write: 'Plc shares move freely, Ltd shares restricted'
      - say: 'Because its shares move easily, a public company can raise large capital from many investors.'
        write: 'Easy transfer ⇒ large capital'
      - section: 'In Nigeria'
        say: 'You can buy Dangote Cement shares on the stock exchange today and sell them next week.'
        write: 'Dangote Cement Plc shares, bought and sold'
      - section: 'Remember'
        say: 'Remember, P L C is public, so its shares move freely in public.'
        write: 'Public ⇒ shares move freely'
      - section: 'Answer'
        say: 'So the major advantage is easy transferability of shares, which is option C.'
        write: '$\therefore$ easy transferability of shares'
        answer: true
    traps:
      A: 'You went for limited liability. A private limited company has it too, so it is not an advantage over it.'
      B: 'You chose separate legal entity. Both kinds of company are separate legal entities.'
      D: 'You picked perpetual existence. Both kinds of company have it.'
  7:
    moments:
      - section: 'The question'
        say: 'The oil industry flows like a river from source to the filling station. What happens upstream?'
        write: 'Main upstream activity $= ?$'
      - section: 'Name it'
        say: 'This is the upstream sector of the oil industry.'
        write: 'Upstream sector'
      - section: 'The rule'
        say: 'Upstream is exploration and production, which means finding and extracting crude oil. Downstream is refining, distribution and marketing.'
        write: 'Upstream = find and extract, Downstream = refine, sell'
      - section: 'How it works'
        say: 'Upstream work happens at the oil fields, drilling wells and bringing crude oil out of the ground or the sea bed.'
        write: 'Oil field ⇒ crude oil out'
      - section: 'In Nigeria'
        say: 'Drilling in the Niger Delta and offshore is upstream. The Warri refinery and the filling stations are downstream.'
        write: 'Niger Delta wells upstream, Warri refinery downstream'
      - section: 'Remember'
        say: 'Remember, upstream is up at the source, where the oil comes out.'
        write: 'Upstream = at the source'
      - section: 'Answer'
        say: 'So the main upstream activity is extraction of crude oil, which is option C.'
        write: '$\therefore$ extraction of crude oil'
        answer: true
    traps:
      A: 'You went for marketing. Selling petroleum products is downstream.'
      B: 'You chose distribution. Moving products by pipeline and tanker is downstream.'
      D: 'You picked refining. Refining turns crude into petrol, and that is downstream.'
  8:
    moments:
      - section: 'The question'
        say: 'Babies are born and people die. How do we measure the growth that is left?'
        write: 'Natural growth of population $= ?$'
      - section: 'Name it'
        say: 'This is the natural growth, or natural increase, of population.'
        write: 'Natural growth'
      - section: 'The rule'
        say: 'Natural growth is the birth rate minus the death rate. Migration is left out.'
        write: 'Natural growth = birth rate $-$ death rate'
      - section: 'How it works'
        say: 'Births add people and deaths take people away. If births are more than deaths, the population grows.'
        write: 'Births $>$ deaths ⇒ growth'
      - section: 'In Nigeria'
        say: 'Suppose a state has forty births and twelve deaths per thousand people. Forty minus twelve is twenty-eight per thousand.'
        write: '$40 - 12 = 28$ per thousand'
      - section: 'Remember'
        say: 'Remember, births add and deaths take away.'
        write: 'Births add, deaths subtract'
      - section: 'Answer'
        say: 'So natural growth is birth rate minus death rate, which is option D.'
        write: '$\therefore$ birth rate $-$ death rate'
        answer: true
    traps:
      A: 'You went for birth rate plus death rate. Deaths reduce a population, so they cannot be added.'
      B: 'You chose labour force plus dependants. That is the whole population, not its growth.'
      C: 'You picked death rate minus birth rate. That is the right pair the wrong way round, so a growing population looks negative.'
  9:
    moments:
      - section: 'The question'
        say: 'Why would a government sort its people by age?'
        write: 'Age structure is important because $= ?$'
      - section: 'Name it'
        say: 'This is the age structure, or age distribution, of a population.'
        write: 'Age structure'
      - section: 'The rule'
        say: 'It groups people into the young under fifteen, the working age from fifteen to sixty-four, and the old.'
        write: 'Under 15, 15 to 64, 65 and above'
      - section: 'How it works'
        say: 'The working age group is the labour force. So the age structure tells government how many workers it has, and how many dependants they support.'
        write: '15 to 64 ⇒ size of labour force'
      - section: 'In Nigeria'
        say: 'Nigeria has a very large group under fifteen. That tells planners many young people will soon need jobs.'
        write: 'Many under 15 ⇒ big future labour force'
      - section: 'Remember'
        say: 'Remember, count the ages and you count the workers.'
        write: 'Count ages, count workers'
      - section: 'Answer'
        say: 'So it provides government with statistics on the present size of the labour force, which is option D.'
        write: '$\therefore$ size of the labour force'
        answer: true
    traps:
      A: 'You went for the exchange rate. That is set in the currency market and by the C B N, not by age groups.'
      B: 'You chose the interest rate. That comes from the money market, not from population ages.'
      C: 'You picked the cost of living. Price indices show that, not age groups.'
  10:
    moments:
      - section: 'The question'
        say: 'The soap maker wants palm oil, and so does the woman cooking egusi soup. What kind of demand is that?'
        write: 'Palm oil for soap and cooking, demand is $= ?$'
      - section: 'Name it'
        say: 'This is composite demand, one of the types of demand.'
        write: 'Composite demand'
      - section: 'The rule'
        say: 'Composite demand is the demand for one commodity that has several different uses.'
        write: 'One good, several uses'
      - section: 'How it works'
        say: 'The total demand for palm oil is made up of separate demands for soap and for cooking. More for one use leaves less for the other.'
        write: 'Total demand = soap + cooking'
      - section: 'In Nigeria'
        say: 'Palm oil from Imo goes into soap factories and also into every pot of egusi soup.'
        write: 'Soap factory and soup pot'
      - section: 'Remember'
        say: 'Remember, composite means made of parts, so one good with many uses.'
        write: 'Composite = one good, many uses'
      - section: 'Answer'
        say: 'So the demand for palm oil here is composite, which is option C.'
        write: '$\therefore$ composite demand'
        answer: true
    traps:
      A: 'You went for competitive demand. That is demand for substitutes, like two brands of soap.'
      B: 'You chose complementary demand. That is for goods used together, like a car and petrol.'
      D: 'You picked derived demand. That is demand for a factor because of what it helps to make, not one good with many uses.'
  11:
    moments:
      - section: 'The question'
        say: 'Several bodies help exporters, but only one is the agency that promotes exports. Which one?'
        write: 'Agency, not a bank, that promotes exports $= ?$'
      - section: 'Name it'
        say: 'This is the institution that promotes Nigeria''s exports.'
        write: 'Export promotion'
      - section: 'The fact'
        say: 'The Nigerian Export Promotion Council is the government agency set up to promote and develop exports, especially non oil exports.'
        write: 'NEPC promotes exports'
      - section: 'How it works'
        say: 'It runs export incentives, trade fairs and export information. The Export Import Bank and the Bank of Industry are banks that lend money.'
        write: 'NEPC promotes, NEXIM and BOI lend'
      - section: 'In Nigeria'
        say: 'The council helps sesame, cashew and shea butter exporters find buyers abroad.'
        write: 'Sesame, cashew, shea butter abroad'
      - section: 'Remember'
        say: 'Remember, N E P C, and the P is for promotion.'
        write: 'NEPC, P for promotion'
      - section: 'Answer'
        say: 'So the agency is the Nigerian Export Promotion Council, which is option C.'
        write: '$\therefore$ Nigerian Export Promotion Council'
        answer: true
    traps:
      A: 'You went for the Export Import Bank. It lends to exporters, but it is a bank, not the promotion agency.'
      B: 'You chose import substitution. That is a strategy of making at home what we import, not an institution.'
      D: 'You picked the Bank of Industry. It is a bank that lends to manufacturers.'
  12:
    moments:
      - section: 'The question'
        say: 'Look at the pie chart. It shares a firm''s output among the four factors of production. What percentage goes to the entrepreneur?'
        write: 'Entrepreneur''s share $= ?\%$'
      - section: 'Read the chart'
        say: 'Find the entrepreneur''s sector on the left of the circle. Its angle is one hundred and twenty degrees.'
        write: 'Entrepreneur $= 120°$'
      - section: 'The rule'
        say: 'A full circle is three hundred and sixty degrees. A sector''s percentage is its angle over three hundred and sixty, times one hundred.'
        write: '$\% = \dfrac{\text{angle}}{360°} \times 100\%$'
      - section: 'The working'
        say: 'Put in the angle. That is one hundred and twenty over three hundred and sixty, times one hundred.'
        write: '$\dfrac{120}{360} \times 100\%$'
      - say: 'One hundred and twenty over three hundred and sixty is one third.'
        write: '$= \dfrac{1}{3} \times 100\%$'
      - say: 'One third of one hundred per cent is thirty-three point three three per cent.'
        write: '$= 33.33\%$'
      - section: 'Check'
        say: 'Check the chart adds up. One hundred and ten plus seventy plus sixty plus one hundred and twenty is three hundred and sixty.'
        write: '$110 + 70 + 60 + 120 = 360$ ✓'
      - section: 'Remember'
        say: 'Remember, it is the angle over three hundred and sixty, times one hundred.'
        write: 'Angle ÷ 360 × 100'
      - section: 'Answer'
        say: 'So the entrepreneur contributes thirty-three point three three per cent, which is option B.'
        write: '$\therefore 33.33\%$'
        answer: true
    traps:
      A: 'You went for two point seven seven per cent. That is far too small for a sector that is one third of the circle.'
      C: 'You chose twenty-seven point seven per cent. That uses one hundred over three hundred and sixty, not the angle of one hundred and twenty.'
      D: 'You picked three point three three per cent. The decimal point slipped, since one third is thirty-three point three three per cent.'
  13:
    moments:
      - section: 'The question'
        say: 'Income per head keeps rising and output keeps rising. What do we call that?'
        write: 'Rising per capita income and output $= ?$'
      - section: 'Name it'
        say: 'This is economic growth, and we must tell it apart from economic development.'
        write: 'Growth vs development'
      - section: 'The rule'
        say: 'Economic growth is a sustained increase in real output, and so in per capita income, over time. It is about quantity.'
        write: 'Growth = more output and income'
      - section: 'How it works'
        say: 'Development is wider. It is growth together with better welfare, less poverty, more education and health, and changes in the structure of the economy.'
        write: 'Development = growth + better lives'
      - section: 'In Nigeria'
        say: 'When Nigeria''s G D P rises year after year, that is growth. Development shows when that output also brings jobs, roads, schools and hospitals.'
        write: 'GDP up = growth, better lives = development'
      - section: 'Remember'
        say: 'Remember, growth is more and development is better.'
        write: 'Growth = more, development = better'
      - section: 'Answer'
        say: 'The question speaks only of more income and more output, so it is economic growth, which is option D.'
        write: '$\therefore$ economic growth'
        answer: true
    traps:
      A: 'You went for economies of scale. Those are cost savings of a growing firm, not a rise in national income.'
      B: 'You chose economic efficiency. That is the best use of resources, not a rise in output over time.'
      C: 'You picked economic development. Development needs better welfare as well, and the question mentions only more output and income.'
  14:
    moments:
      - section: 'The question'
        say: 'Every factor of production earns a reward. What does capital earn?'
        write: 'Reward for capital $= ?$'
      - section: 'Name it'
        say: 'These are the rewards of the factors of production.'
        write: 'Factor rewards'
      - section: 'The rule'
        say: 'Land earns rent, labour earns wages, capital earns interest, and the entrepreneur earns profit.'
        write: 'Land rent, Labour wages, Capital interest, Entrepreneur profit'
      - section: 'How it works'
        say: 'The owner of capital gives up the use of his money or machines, and interest is the payment for that use.'
        write: 'Use of capital ⇒ interest'
      - section: 'In Nigeria'
        say: 'When you save in a bank or buy a government bond, you supply capital, and you earn interest.'
        write: 'Bank savings earn interest'
      - section: 'Remember'
        say: 'Remember the pairs. Land goes with rent, labour with wages, capital with interest and the entrepreneur with profit.'
        write: 'Capital ⇒ interest'
      - section: 'Answer'
        say: 'So the reward for capital is interest, which is option A.'
        write: '$\therefore$ interest'
        answer: true
    traps:
      B: 'You went for rent. Rent is the reward for land.'
      C: 'You chose profit. Profit rewards the entrepreneur for bearing risk.'
      D: 'You picked wages. Wages are the reward for labour.'
  15:
    moments:
      - section: 'The question'
        say: 'Buyers want more than sellers can supply. What kind of inflation follows?'
        write: 'Inflation from excess demand $= ?$'
      - section: 'Name it'
        say: 'This is demand pull inflation.'
        write: 'Demand-pull inflation'
      - section: 'The rule'
        say: 'It is a persistent rise in the general price level caused by aggregate demand being greater than aggregate supply. Too much money chases too few goods.'
        write: 'AD $>$ AS ⇒ prices rise'
      - section: 'How it works'
        say: 'When buyers want more than producers can make, sellers raise prices. The excess demand pulls prices up.'
        write: 'Excess demand pulls prices up'
      - section: 'In Nigeria'
        say: 'In December, when people buy for Christmas, the price of chicken and rice in the market shoots up.'
        write: 'December, chicken and rice prices jump'
      - section: 'Remember'
        say: 'Remember, demand pulls prices up, and costs push prices up.'
        write: 'Demand pulls, costs push'
      - section: 'Answer'
        say: 'So inflation from excess demand is demand pull inflation, which is option C.'
        write: '$\therefore$ demand-pull inflation'
        answer: true
    traps:
      A: 'You went for galloping inflation. That describes how fast prices rise, not why.'
      B: 'You chose cost push. That comes from rising costs such as wages and fuel, not from excess demand.'
      D: 'You picked imported inflation. That comes from rising prices of goods we import.'
  16:
    moments:
      - section: 'The question'
        say: 'We measure a nation''s output in naira. What goes wrong when the naira itself changes value?'
        write: 'A problem of measuring national income $= ?$'
      - section: 'Name it'
        say: 'This is a problem of national income measurement.'
        write: 'Measuring national income'
      - section: 'The rule'
        say: 'National income is measured in money, but the value of money changes. Inflation raises prices and deflation lowers them.'
        write: 'Money value changes with prices'
      - section: 'How it works'
        say: 'So the money value of output can change even when real output does not. Statisticians must remove the price change with a price index, and that is never exact.'
        write: 'Nominal income ÷ price index = real income'
      - section: 'In Nigeria'
        say: 'If Nigeria''s G D P in naira doubles in a year when prices also double, real output has not grown at all.'
        write: 'GDP ×2, prices ×2 ⇒ no real growth'
      - section: 'Remember'
        say: 'Remember, changing prices make a changing ruler.'
        write: 'Changing prices, changing ruler'
      - section: 'Answer'
        say: 'So the problem is inflation and deflation, which is option B.'
        write: '$\therefore$ inflation and deflation'
        answer: true
    traps:
      A: 'You went for a high interest rate. That affects investment, not how we measure income.'
      C: 'You chose overpopulation. It lowers income per head but does not make output harder to measure.'
      D: 'You picked population growth. It changes per capita income, not the measuring of output.'
  17:
    moments:
      - section: 'The question'
        say: 'In which system can you buy what you like and produce what you like?'
        write: 'Freedom of consumption and production $= ?$'
      - section: 'Name it'
        say: 'This is capitalism, the free enterprise economy.'
        write: 'Capitalism'
      - section: 'The rule'
        say: 'Under capitalism, resources are privately owned, and people are free to choose what to consume and what to produce.'
        write: 'Private ownership, free choice'
      - section: 'How it works'
        say: 'The price mechanism guides them. Consumers decide what is made, and firms produce whatever earns profit.'
        write: 'Price mechanism decides'
      - section: 'In Nigeria'
        say: 'A trader in Onitsha chooses to sell phones or fabrics, and a buyer chooses what to buy, with no order from government.'
        write: 'Onitsha trader chooses freely'
      - section: 'Remember'
        say: 'Remember, capitalism means free choice for buyers and sellers.'
        write: 'Capitalism = free choice'
      - section: 'Answer'
        say: 'So freedom of consumption and production marks capitalism, which is option C.'
        write: '$\therefore$ capitalism'
        answer: true
    traps:
      A: 'You went for socialism. There the state owns resources and plans production.'
      B: 'You chose feudalism. There lords controlled the land and the serfs had little freedom.'
      D: 'You picked communism. It has collective ownership and no freedom of private production.'
