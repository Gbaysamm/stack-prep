  21:
    moments:
      - section: 'The question'
        say: 'A town has fifty square kilometres of land and one hundred million people. How crowded is it?'
        write: 'Land $= 50$ km², population $= 100$ million, density $= ?$'
      - section: 'Name it'
        say: 'This is population density.'
        write: 'Population density'
      - section: 'The rule'
        say: 'Population density is the population divided by the land area, so people go on top and land goes below.'
        write: '$\text{density} = \dfrac{\text{population}}{\text{land area}}$'
      - section: 'The data'
        say: 'One hundred million is one followed by eight zeros.'
        write: '$100 \text{ million} = 100{,}000{,}000$'
      - section: 'The working'
        say: 'Divide one hundred million by fifty. That gives two million.'
        write: '$\dfrac{100{,}000{,}000}{50} = 2{,}000{,}000$'
      - say: 'So the density is two million people per square kilometre.'
        write: '$= 2$ million people per km²'
      - section: 'Check'
        say: 'Check it back. Two million times fifty is one hundred million, the population we started with.'
        write: '$2{,}000{,}000 \times 50 = 100{,}000{,}000$ ✓'
      - section: 'In Nigeria'
        say: 'Lagos is Nigeria''s most crowded state for the same reason, many people on little land.'
        write: 'Lagos, many people, little land'
      - section: 'Answer'
        say: 'So the population density is two million people per square kilometre, which is option D.'
        write: '$\therefore$ 2 million people per km²'
        answer: true
    traps:
      A: 'You chose fifty thousand. That is far too small, because one hundred million shared over fifty square kilometres is two million each.'
      B: 'You went for zero point two million. That divides ten by fifty and drops a zero from the population.'
      C: 'You picked zero point five million. That divides the land by the people, fifty over one hundred, the wrong way up.'
  22:
    moments:
      - section: 'The question'
        say: 'Ten values sit in a frequency table. What is their mean?'
        write: '$x$: 2, 3, 4, 5 and $f$: 2, 5, 2, 1, mean $= ?$'
      - section: 'Name it'
        say: 'This is the arithmetic mean of a frequency distribution.'
        write: 'Mean of a frequency distribution'
      - section: 'The rule'
        say: 'Multiply each value by its frequency, add them up, and divide by the total frequency.'
        write: '$\bar{x} = \dfrac{\sum fx}{\sum f}$'
      - section: 'The working'
        say: 'Two times two is four, three times five is fifteen, four times two is eight, and five times one is five.'
        write: '$fx$: $4,\ 15,\ 8,\ 5$'
      - say: 'Add them. Four plus fifteen plus eight plus five is thirty-two.'
        write: '$\sum fx = 32$'
      - say: 'Now add the frequencies. Two plus five plus two plus one is ten.'
        write: '$\sum f = 10$'
      - say: 'Divide thirty-two by ten, which gives three point two.'
        write: '$\bar{x} = \dfrac{32}{10} = 3.2$'
      - section: 'Check'
        say: 'Check it. Three point two lies between two and five, and close to three, the most common value. It makes sense.'
        write: '$2 < 3.2 < 5$ ✓'
      - section: 'Answer'
        say: 'So the mean of the distribution is three point two, which is option C.'
        write: '$\therefore \bar{x} = 3.2$'
        answer: true
    traps:
      A: 'You chose two point two. The sum of f times x is thirty-two, and thirty-two over ten is three point two.'
      B: 'You went for two point five. That is ten over four, the total frequency divided by the number of values, which ignores the values.'
      D: 'You picked four point five. That sits near the biggest values only, not the middle of all ten.'
  23:
    moments:
      - section: 'The question'
        say: 'Same table, ten values. Which one sits in the middle?'
        write: '$x$: 2, 3, 4, 5 and $f$: 2, 5, 2, 1, median $= ?$'
      - section: 'Name it'
        say: 'This is the median, the middle value when all the values are in order.'
        write: 'Median'
      - section: 'The rule'
        say: 'For n values the middle position is n plus one over two. When n is even, take the average of the two middle values.'
        write: 'Position $= \dfrac{n+1}{2}$'
      - section: 'The working'
        say: 'Here n is ten, so the middle position is eleven over two, which is five point five. The median lies between the fifth and sixth values.'
        write: '$\dfrac{10+1}{2} = 5.5$, between the 5th and 6th'
      - say: 'Write the values out in order. Two appears twice, three five times, four twice and five once.'
        write: '2, 2, 3, 3, 3, 3, 3, 4, 4, 5'
      - say: 'The fifth value is three and the sixth value is three.'
        write: '5th $= 3$, 6th $= 3$'
      - say: 'The average of three and three is three.'
        write: 'Median $= \dfrac{3+3}{2} = 3$'
      - section: 'Check'
        say: 'Check it. Two values are below three and three are above, with three filling the middle.'
        write: '2 below, 3 above ✓'
      - section: 'Answer'
        say: 'So the median of the distribution is three, which is option C.'
        write: '$\therefore$ median $= 3$'
        answer: true
    traps:
      A: 'You chose five. Five is the largest value, not the middle one.'
      B: 'You went for four. Four is the middle of the list two, three, four, five, but the median must count each value as often as it occurs.'
      D: 'You picked two. Two is the smallest value, not the middle one.'
