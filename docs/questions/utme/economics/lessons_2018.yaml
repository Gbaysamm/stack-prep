      - say: 'Look from O through R. The curve gets steeper and steeper, so marginal product is rising.'
        write: 'O to S, steeper ⇒ MP rising'
      - say: 'Now look at S. Here the curve stops getting steeper, and after S it rises more and more gently. That bend is the point of inflexion.'
        write: 'At S, point of inflexion ⇒ MP starts to fall'
      - say: 'At T the curve is flat at its peak, so marginal product is zero. After T, towards V, total product falls and marginal product is negative.'
        write: 'T, MP = 0; after T, MP < 0'
