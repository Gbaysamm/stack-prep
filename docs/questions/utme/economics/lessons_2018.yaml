# UTME 2018 Economics, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Economics teacher works on the board:
# the question, the concept named, the rule or definition in plain words, how it works as cause
# and effect (or the calculation with data, formula, working and check), a Nigerian example, a
# way to remember it, and the answer moment that names the option.
#
#   say:     heard, not read. Symbols read as words (M P C, Q d), money and percentages in words,
#            no symbols the voice would stop on.
#   write:   the one line written while it is said, with LaTeX between dollar signs.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2018.yaml. Answers match that file. No question
# is dropped, so all 40 have a lesson.
format_version: 1
exam_year: 2018
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'Why do most people in one country farm, while most people in another work in offices and factories? That is what this question asks.'
        write: 'Occupational distribution is mainly influenced by $?$'
      - section: 'Name it'
        say: 'This is the occupational distribution of the population, which means how workers are shared among farming, industry and services.'
        write: 'Occupational distribution of population'
      - section: 'The rule'
        say: 'The share follows the level of economic development. A poor economy keeps most workers on farms, and a developed one moves them into industry and services.'
        write: 'Low development ⇒ farming; high development ⇒ industry and services'
      - section: 'How it works'
        say: 'Income, capital and the growth of industry decide which jobs exist and pay. People take the jobs that exist, so economic factors shape the distribution most.'
        write: 'Jobs that exist and pay ⇒ where people work'
      - section: 'In Nigeria'
        say: 'In the villages most workers farm, but in Lagos, where banks, trade and factories gather, most work in services and industry.'
        write: 'Village farming, Lagos services'
      - section: 'Remember'
        say: 'Remember, people go where the jobs and the money are.'
        write: 'People follow the jobs and the money'
      - section: 'Answer'
        say: 'So the occupational distribution is mainly influenced by economic factors, which is option A.'
        write: '$\therefore$ economic factors'
        answer: true
    traps:
      B: 'You chose religious factors. Religion touches a few jobs, but it does not decide how a whole workforce is shared out.'
      C: 'You went for geographical factors. Climate and land matter only through what the economy can produce and sell.'
      D: 'You picked social factors. Status plays a smaller part than the jobs the economy actually offers.'
  2:
    moments:
      - section: 'The question'
        say: 'Every factor of production gets paid. What does capital earn?'
        write: 'Reward for capital $= ?$'
      - section: 'Name it'
        say: 'This is the reward of a factor of production.'
        write: 'Factors and their rewards'
      - section: 'The rule'
        say: 'Land earns rent, labour earns wages, capital earns interest, and the entrepreneur earns profit.'
        write: 'Land → rent, Labour → wages, Capital → interest, Entrepreneur → profit'
      - section: 'How it works'
        say: 'Capital is man made wealth used to produce more, like machines and money lent to business. Whoever supplies it gives up its use for a time, and is paid interest.'
        write: 'Give up the use of capital ⇒ earn interest'
      - section: 'In Nigeria'
        say: 'A bank lends two million naira to a garri processor in Ogun and charges interest. That interest is the reward for the capital.'
        write: '₦2 million loan ⇒ interest to the bank'
      - section: 'Remember'
        say: 'Remember the pairs, rent, wages, interest, profit, for land, labour, capital and the entrepreneur.'
        write: 'R W I P'
      - section: 'Answer'
        say: 'So the reward for capital is interest, which is option A.'
        write: '$\therefore$ interest'
        answer: true
    traps:
      B: 'You went for rent. Rent is the reward for land, not for capital.'
      C: 'You chose risk. Risk is something the entrepreneur bears, not a reward.'
      D: 'You picked premium. A premium is paid for insurance, not earned by a factor.'
  3:
    moments:
      - section: 'The question'
        say: 'Government decides the naira will buy fewer dollars than before. What is that called?'
        write: 'Cut in the value of a currency against others $= ?$'
      - section: 'Name it'
        say: 'This is devaluation.'
        write: 'Devaluation'
      - section: 'The rule'
        say: 'Devaluation is a deliberate cut, by the government or the central bank, in the value of the home currency against foreign currencies.'
        write: 'Deliberate cut in external value'
      - section: 'How it works'
        say: 'After devaluation each naira buys less foreign money. Exports become cheaper to foreigners and imports dearer at home.'
        write: 'Exports cheaper abroad, imports dearer at home'
      - section: 'In Nigeria'
        say: 'In twenty sixteen the naira fell from about one hundred and ninety-seven to about three hundred and five to the dollar, so every dollar import cost more naira.'
        write: '₦197 → about ₦305 to one US dollar'
      - section: 'Remember'
        say: 'Remember, de value means take the value down, against other currencies.'
        write: 'De-value = value down'
      - section: 'Answer'
        say: 'So a cut in the value of a currency against others is devaluation, which is option C.'
        write: '$\therefore$ devaluation'
        answer: true
    traps:
      A: 'You chose deflation. Deflation is a fall in prices inside the country, not in the value of the currency abroad.'
      B: 'You went for inflation. Inflation is a rise in prices inside the country.'
      D: 'You picked revaluation. That is the opposite, a rise in the currency against others.'
  4:
    moments:
      - section: 'The question'
        say: 'A mortgage bank gives long loans. What are they for?'
        write: 'Mortgage banks lend long-term to $?$'
      - section: 'Name it'
        say: 'This is a mortgage bank, a specialised financial institution.'
        write: 'Mortgage bank'
      - section: 'The rule'
        say: 'A mortgage bank gives long term loans to buy, build or improve houses, and holds the house as security.'
        write: 'Long-term loan for housing, house as security'
      - section: 'How it works'
        say: 'A house costs far more than a year of income, so the loan is spread over fifteen to thirty years. If the borrower fails to pay, the bank can sell the house.'
        write: 'Repay over 15 to 30 years'
      - section: 'In Nigeria'
        say: 'The Federal Mortgage Bank of Nigeria lends to workers through the National Housing Fund so they can build or buy a home.'
        write: 'Federal Mortgage Bank, National Housing Fund'
      - section: 'Remember'
        say: 'Remember, mortgage means a house loan, with the house as the guarantee.'
        write: 'Mortgage = house loan'
      - section: 'Answer'
        say: 'So mortgage banks lend long term to build houses, which is option D.'
        write: '$\therefore$ build houses'
        answer: true
    traps:
      A: 'You chose finance agriculture. Farm loans come from an agricultural bank, like the Bank of Agriculture.'
      B: 'You went for establish banks. Banks raise their capital from shareholders, not mortgage loans.'
      C: 'You picked acquire machinery. Loans for machines come from industrial banks, like the Bank of Industry.'
  5:
    moments:
      - section: 'The question'
        say: 'In a capitalist economy, who owns the farms, factories and shops?'
        write: 'Capitalism, factors owned and controlled by $?$'
      - section: 'Name it'
        say: 'This is the capitalist economy, also called free enterprise.'
        write: 'Capitalist (free enterprise) economy'
      - section: 'The rule'
        say: 'Under capitalism the factors of production are owned and controlled by private individuals, not by the state.'
        write: 'Private ownership of the factors'
      - section: 'How it works'
        say: 'Each owner decides what to produce in order to make a profit, and prices set by demand and supply guide the decisions.'
        write: 'Profit motive + price system'
      - section: 'In Nigeria'
        say: 'A yam farmer in Benue owns her farm and decides alone how much to plant and where to sell. That is private ownership at work.'
        write: 'Benue yam farm, privately owned'
      - section: 'Remember'
        say: 'Remember, capitalist means private hands and the profit motive.'
        write: 'Capitalism = private hands'
      - section: 'Answer'
        say: 'So in a capitalist economy the factors are owned and controlled by private individuals, which is option B.'
        write: '$\therefore$ private individuals'
        answer: true
    traps:
      A: 'You chose local communities. Community ownership is communal, not capitalist.'
      C: 'You went for government. State ownership marks a socialist, planned economy.'
      D: 'You picked foreigners. Capitalism is about private owners, whether local or foreign.'
  6:
    moments:
      - section: 'The question'
        say: 'Young people keep leaving the village for the city. What happens if factories are built in the village?'
        write: 'Rural industries reduce $?$'
      - section: 'Name it'
        say: 'This is rural urban migration, which means people moving from villages to towns.'
        write: 'Rural-urban migration'
      - section: 'The cause'
        say: 'People leave the villages mainly to find paid jobs and better amenities in the towns.'
        write: 'Village → town, to find jobs'
      - section: 'How it works'
        say: 'Industries in rural areas bring jobs and incomes to the villages. People no longer need to move, so the flow to the towns falls.'
        write: 'Jobs at home ⇒ fewer leave'
      - section: 'In Nigeria'
        say: 'A cassava factory near Ogoja gives young people jobs at home, so fewer leave for Calabar or Lagos.'
        write: 'Ogoja cassava factory keeps the youth'
      - section: 'Remember'
        say: 'Remember, bring the jobs to the village and the village stays.'
        write: 'Jobs to the village'
      - section: 'Answer'
        say: 'So rural industries help to reduce rural urban migration, which is option B.'
        write: '$\therefore$ rural-urban migration'
        answer: true
    traps:
      A: 'You chose urban rural migration. That is movement to the villages, and rural jobs would encourage it, not cut it.'
      C: 'You went for rural rural migration. Moving between villages is not the problem these industries solve.'
      D: 'You picked urban urban migration. Building village factories does not change movement between towns.'
  7:
    moments:
      - section: 'The question'
        say: 'Why do countries buy from and sell to each other? Which principle is at work?'
        write: 'International trade applies the principle of $?$'
      - section: 'Name it'
        say: 'This is the principle of comparative cost advantage.'
        write: 'Comparative cost advantage'
      - section: 'The rule'
        say: 'A country should specialise in what it produces at a lower opportunity cost than others, and trade for the rest.'
        write: 'Specialise where opportunity cost is lowest'
      - section: 'How it works'
        say: 'When every country specialises like that, world output rises, and trade lets each country enjoy more than it could make alone.'
        write: 'Specialise + trade ⇒ more for all'
      - section: 'In Nigeria'
        say: 'Nigeria exports crude oil and cocoa, which it produces cheaply, and imports machines that others make at lower cost.'
        write: 'Export oil and cocoa, import machines'
      - section: 'Remember'
        say: 'Remember, do what you give up least to do, and trade for the rest.'
        write: 'Lowest opportunity cost wins'
      - section: 'Answer'
        say: 'So international trade applies the principle of comparative cost advantage, which is option D.'
        write: '$\therefore$ comparative cost advantage'
        answer: true
    traps:
      A: 'You chose industrial production. That is a kind of production, not the reason countries trade.'
      B: 'You went for mass production. That is large scale output in a firm, not the basis of trade.'
      C: 'You picked regional production. That says where goods are made, not why countries trade.'
  8:
    moments:
      - section: 'The question'
        say: 'Count everyone who is able to work and is offering to work. What is that group called?'
        write: 'Qualified and offering to work $= ?$'
      - section: 'Name it'
        say: 'This is the working population, also called the labour force.'
        write: 'Working population (labour force)'
      - section: 'The rule'
        say: 'It is the number of people of working age who are able and willing to work, whether they have jobs or are looking for one.'
        write: 'Able + willing + of working age'
      - section: 'How it works'
        say: 'Children, the aged and those who choose not to work are left out. Only those who offer themselves for work are counted.'
        write: 'Leave out children, the aged, non-seekers'
      - section: 'In Nigeria'
        say: 'A graduate in Enugu who is job hunting is in the working population, but her retired grandfather is not.'
        write: 'Job-hunting graduate counts'
      - section: 'Remember'
        say: 'Remember, able, willing and offering, that is the working population.'
        write: 'Able, willing, offering'
      - section: 'Answer'
        say: 'So the people qualified and offering to work are the working population, which is option B.'
        write: '$\therefore$ working population'
        answer: true
    traps:
      A: 'You chose migrant labour. That means workers who move from place to place for work.'
      C: 'You went for labour turnover. That is how fast workers leave a firm and are replaced.'
      D: 'You picked mobility of labour. That is how easily workers change jobs or places.'
  9:
    moments:
      - section: 'The question'
        say: 'Many firms of one industry gather in one town. What good comes from that?'
        write: 'An advantage of localization $= ?$'
      - section: 'Name it'
        say: 'This is localization of industry, which means many firms of one industry concentrated in one area.'
        write: 'Localization of industry'
      - section: 'The rule'
        say: 'Localization brings external economies, savings every firm enjoys because the industry is gathered there.'
        write: 'External economies of scale'
      - section: 'How it works'
        say: 'Subsidiary firms grow up around the main industry, supplying parts, repairing machines and using by products. The main firms get services close by and cheaply.'
        write: 'Subsidiary firms grow around the industry'
      - section: 'In Nigeria'
        say: 'Around the textile mills of Kano grew dyers, spare parts dealers and transport firms that served the mills.'
        write: 'Kano mills, helpers around them'
      - section: 'Remember'
        say: 'Remember, where one industry gathers, helpers grow around it.'
        write: 'Industry gathers ⇒ helpers grow'
      - section: 'Answer'
        say: 'So an advantage of localization is the development of subsidiary firms, which is option A.'
        write: '$\therefore$ development of subsidiary firms'
        answer: true
    traps:
      B: 'You chose parallel markets. Those come from price controls and shortages, not localization.'
      C: 'You went for slums. Slums are a disadvantage of localization, caused by crowding.'
      D: 'You picked foreign capital. That is not a standard advantage of localization, but subsidiary firms are.'
  10:
    moments:
      - section: 'The question'
        say: 'ECOWAS was set up to bring West Africa together. Why has it moved so slowly?'
        write: 'ECOWAS is slow because of $?$'
      - section: 'Name it'
        say: 'This is ECOWAS, the Economic Community of West African States, set up in nineteen seventy-five.'
        write: 'ECOWAS, 1975'
      - section: 'The fact'
        say: 'It has several problems, and the main one in the textbooks is political instability in member states.'
        write: 'Main problem, political instability'
      - section: 'How it works'
        say: 'Coups, civil wars and sudden changes of government stop the meetings, payments and agreements that integration needs.'
        write: 'Coups and wars ⇒ agreements stall'
      - section: 'In Nigeria'
        say: 'In the nineteen nineties the wars in Liberia and Sierra Leone made ECOWAS spend its effort on peacekeeping through ECOMOG instead of trade.'
        write: 'Liberia, Sierra Leone, ECOMOG'
      - section: 'Remember'
        say: 'Remember, no peace, no progress.'
        write: 'No peace, no progress'
      - section: 'Answer'
        say: 'So ECOWAS has been slow because of political instability, which is option C.'
        write: '$\therefore$ political instability'
        answer: true
    traps:
      A: 'You chose the activities of multinationals. They are not the main brake the textbooks name.'
      B: 'You went for staff at the secretariat. That is a small problem next to political instability.'
      D: 'You picked international support. ECOWAS rests on its own members, so its main problems come from within.'
  11:
    moments:
      - section: 'The question'
        say: 'Two partners own a business together. In a joint venture, who are they?'
        write: 'Joint ventures involve $?$'
      - section: 'Name it'
        say: 'This is a joint venture.'
        write: 'Joint venture'
      - section: 'The rule'
        say: 'A joint venture is owned and run jointly by government and private investors, who share the capital, the control and the profit.'
        write: 'Government + private investors'
      - section: 'How it works'
        say: 'Government brings licences, land or the resource. Private investors bring capital, technology and management. Each owns an agreed share.'
        write: 'Each partner owns an agreed share'
      - section: 'In Nigeria'
        say: 'In the oil industry, N N P C holds about fifty-five to sixty per cent of joint ventures with companies like Shell, which hold the rest.'
        write: 'NNPC about 55 to 60%, Shell the rest'
      - section: 'Remember'
        say: 'Remember, joint venture means government and private partners together.'
        write: 'Public + private together'
      - section: 'Answer'
        say: 'So joint ventures are partnerships of government and private investors, which is option C.'
        write: '$\therefore$ government and private investors'
        answer: true
    traps:
      A: 'You chose the poor and the rich. A joint venture is not defined by how wealthy its partners are.'
      B: 'You went for employers and workers. They bargain over pay, they do not form joint ventures.'
      D: 'You picked multinationals and individuals. A multinational can be one partner, but the mark is government with private investors.'
  12:
    moments:
      - section: 'The question'
        say: 'In one kind of business, the people who buy the goods are the same people who own the shop. Which one?'
        write: 'Owners mostly the customers $= ?$'
      - section: 'Name it'
        say: 'This is the co-operative society, and in particular the consumer co-operative.'
        write: 'Consumer co-operative'
      - section: 'The rule'
        say: 'Members put in the capital, own the society and are its main customers.'
        write: 'Members = owners = customers'
      - section: 'How it works'
        say: 'They buy in bulk at wholesale prices, sell to themselves at fair prices, and share any surplus as a dividend on what they bought.'
        write: 'Bulk buying, fair prices, dividend on purchases'
      - section: 'In Nigeria'
        say: 'University staff in Ibadan run a co-operative shop where the members are also the buyers of the rice and beans.'
        write: 'Ibadan staff co-operative shop'
      - section: 'Remember'
        say: 'Remember, in a co-operative the owners and the customers are the same people.'
        write: 'Owners = customers'
      - section: 'Answer'
        say: 'So the business whose owners are mostly its customers is the co-operative, which is option A.'
        write: '$\therefore$ co-operatives'
        answer: true
    traps:
      B: 'You chose limited liability companies. Their shareholders own them, but most customers are not shareholders.'
      C: 'You went for partnerships. Partners own the firm but sell to outside customers.'
      D: 'You picked public corporations. Government owns them, not their customers.'
  13:
    moments:
      - section: 'The question'
        say: 'Export prices on top, import prices below, times one hundred. What does that formula measure?'
        write: '$\dfrac{\text{index of export prices}}{\text{index of import prices}} \times 100$ measures $?$'
      - section: 'Name it'
        say: 'This is the commodity terms of trade.'
        write: 'Commodity terms of trade'
      - section: 'The rule'
        say: 'The terms of trade measure the rate at which a country''s exports exchange for its imports.'
        write: 'TOT = rate exports exchange for imports'
      - section: 'How it works'
        say: 'If export prices rise faster than import prices, the index goes above one hundred, and each unit of exports buys more imports. That is favourable.'
        write: 'Above 100 ⇒ favourable, below 100 ⇒ unfavourable'
      - section: 'In Nigeria'
        say: 'If crude oil prices rise while the price of imported machines stays the same, each barrel buys more machines.'
        write: 'Oil price up ⇒ more machines per barrel'
      - section: 'Remember'
        say: 'Remember, export prices on top, import prices below, times one hundred.'
        write: 'Exports over imports × 100'
      - section: 'Answer'
        say: 'So the formula measures the commodity terms of trade, which is option C.'
        write: '$\therefore$ commodity terms of trade'
        answer: true
    traps:
      A: 'You chose volume of trade. The formula uses prices, not quantities, so it cannot measure volume.'
      B: 'You went for direction of trade. That is about which countries we trade with.'
      D: 'You picked volume of imports. That is a quantity, not a ratio of prices.'
  14:
    moments:
      - section: 'The question'
        say: 'Ghana and Sierra Leone each use the same resources to grow coffee and cocoa. Who should grow what?'
        write: 'Ghana: coffee 8 t, cocoa 7 t;  Sierra Leone: coffee 2 t, cocoa 9 t'
      - section: 'Name it'
        say: 'This is specialization by advantage, comparing what each country gets from the same resources.'
        write: 'Absolute and comparative advantage'
      - section: 'The rule'
        say: 'A country should produce the good it makes more of, or gives up less to make, and trade for the other.'
        write: 'Specialise where output is higher, or opportunity cost lower'
      - section: 'Coffee'
        say: 'Look at the coffee row. Ghana makes eight tonnes and Sierra Leone only two, so Ghana has the advantage in coffee.'
        write: 'Coffee, $8 > 2$ ⇒ Ghana'
      - section: 'Cocoa'
        say: 'Now the cocoa row. Sierra Leone makes nine tonnes and Ghana seven, so Sierra Leone has the advantage in cocoa.'
        write: 'Cocoa, $9 > 7$ ⇒ Sierra Leone'
      - section: 'Check'
        say: 'Check with opportunity cost. One tonne of coffee costs Ghana seven eighths of a tonne of cocoa, but costs Sierra Leone four and a half tonnes. So coffee is cheaper for Ghana.'
        write: 'Coffee costs Ghana $\dfrac{7}{8}$ t cocoa; Sierra Leone $\dfrac{9}{2} = 4.5$ t'
      - section: 'In Nigeria'
        say: 'Nigeria and Ghana also do better selling what each makes most cheaply and buying the rest from each other.'
        write: 'Sell your best, buy the rest'
      - section: 'Answer'
        say: 'So Sierra Leone should produce cocoa and Ghana coffee, which is option D.'
        write: '$\therefore$ Sierra Leone cocoa, Ghana coffee'
        answer: true
    traps:
      A: 'You chose Ghana producing both. Then nobody specialises and there is no gain from trade.'
      B: 'You went for Ghana producing cocoa only. Ghana makes seven tonnes of cocoa against nine, so cocoa is where Ghana is weaker.'
      C: 'You picked Sierra Leone producing nothing. Sierra Leone has the advantage in cocoa, so it should grow cocoa.'
  15:
    moments:
      - section: 'The question'
        say: 'Some things a country sells abroad you can see on a ship, and some you cannot. Which of these cannot be seen?'
        write: 'An invisible item $= ?$'
      - section: 'Name it'
        say: 'This is an invisible item in the balance of payments.'
        write: 'Visible and invisible items'
      - section: 'The rule'
        say: 'Visible items are goods you can see and touch. Invisible items are services, like banking, insurance, shipping and tourism.'
        write: 'Visible = goods, invisible = services'
      - section: 'How it works'
        say: 'Banking services cross borders with no goods shipped at all, so they are invisible.'
        write: 'Banking service ⇒ invisible'
      - section: 'In Nigeria'
        say: 'When a Nigerian importer pays a London bank for a letter of credit, Nigeria imports a banking service, an invisible import.'
        write: 'Letter of credit from London = invisible import'
      - section: 'Remember'
        say: 'Remember, if you can load it on a ship it is visible, and if it is a service it is invisible.'
        write: 'Ship it ⇒ visible; serve it ⇒ invisible'
      - section: 'Answer'
        say: 'So the invisible item is banking services, which is option D.'
        write: '$\therefore$ banking services'
        answer: true
    traps:
      A: 'You chose petroleum products. Petrol and diesel are goods shipped in tankers, so they are visible.'
      B: 'You went for processed rice. Rice is a good you can see, so it is visible.'
      C: 'You picked processed milk. Milk is a good you can see, so it is visible.'
  16:
    moments:
      - section: 'The question'
        say: 'Nigeria belongs to OPEC. What do those four letters stand for?'
        write: 'OPEC $= ?$'
      - section: 'Name it'
        say: 'This is OPEC, the oil exporters organisation.'
        write: 'OPEC'
      - section: 'The fact'
        say: 'OPEC stands for the Organization of the Petroleum Exporting Countries, founded in Baghdad in nineteen sixty, with its headquarters in Vienna.'
        write: 'Organization of the Petroleum Exporting Countries, 1960'
      - section: 'How it works'
        say: 'Its members agree production quotas to keep oil prices stable and earn fair revenue.'
        write: 'Quotas ⇒ stable oil prices'
      - section: 'In Nigeria'
        say: 'Nigeria joined OPEC in nineteen seventy-one, and its crude output is limited by the quota OPEC sets.'
        write: 'Nigeria joined 1971'
      - section: 'Remember'
        say: 'Remember, O for Organization, P for Petroleum, E for Exporting, C for Countries.'
        write: 'O-P-E-C'
      - section: 'Answer'
        say: 'So OPEC means the Organisation of Petroleum Exporting Countries, which is option D.'
        write: '$\therefore$ Organisation of Petroleum Exporting Countries'
        answer: true
    traps:
      A: 'You chose Oil and Petroleum. The O stands for Organization, not Oil.'
      B: 'You went for Original. The O stands for Organization.'
      C: 'You picked Petrol. The P is Petroleum, the crude oil, and petrol is only one product from it.'
  17:
    moments:
      - section: 'The question'
        say: 'What do economists spend their time worrying about?'
        write: 'Main concern of economists $= ?$'
      - section: 'Name it'
        say: 'This is the subject matter of economics.'
        write: 'Subject matter of economics'
      - section: 'The rule'
        say: 'Economics studies how scarce resources are allocated among competing uses to satisfy human wants as well as possible.'
        write: 'Allocate scarce resources among wants'
      - section: 'How it works'
        say: 'Wants are unlimited and resources are scarce, so choices must be made. The economist wants as many wants met as possible.'
        write: 'Unlimited wants, scarce means ⇒ choice'
      - section: 'In Nigeria'
        say: 'A family in Aba with fifty thousand naira a month must share it among food, rent and school fees. That is economics in miniature.'
        write: '₦50,000 shared among food, rent, fees'
      - section: 'Remember'
        say: 'Remember, scarce means, many wants, so allocate.'
        write: 'Scarce means ⇒ allocate'
      - section: 'Answer'
        say: 'So the main concern of economists is to allocate scarce resources to satisfy human wants, which is option D.'
        write: '$\therefore$ allocate scarce resources to satisfy wants'
        answer: true
    traps:
      A: 'You chose controlling population. That is a policy aim, not the main concern of economics.'
      B: 'You went for redistributing income. That is one policy question, not the core of the subject.'
      C: 'You picked satisfying all wants. Resources are scarce, so all wants can never be met.'
  18:
    moments:
      - section: 'The question'
        say: 'Land, labour, capital and the entrepreneur. What is the group name for these productive resources?'
        write: 'Productive resources are also called $?$'
      - section: 'Name it'
        say: 'These are the factors of production.'
        write: 'Factors of production'
      - section: 'The rule'
        say: 'The resources used to produce goods and services are land, labour, capital and the entrepreneur.'
        write: 'Land, Labour, Capital, Entrepreneur'
      - section: 'How it works'
        say: 'Nothing can be produced without combining them, and each one is paid a reward for its part.'
