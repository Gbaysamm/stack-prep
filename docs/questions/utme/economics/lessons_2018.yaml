        write: 'Utility = satisfaction from consumption'
      - section: 'How it works'
        say: 'A good gives utility when it is used up or enjoyed, because it satisfies a want. Each extra unit adds less than the one before.'
        write: 'Each extra unit adds less'
      - section: 'In Nigeria'
        say: 'The first plate of jollof rice gives great satisfaction, but the third plate gives far less.'
        write: 'First plate ≫ third plate'
      - section: 'Remember'
