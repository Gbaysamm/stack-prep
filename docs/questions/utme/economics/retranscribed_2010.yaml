# UTME 2010 Economics, written up by hand from source/past-questions.pdf, pages 2-10.
# Q1 (the paper type, C) is left out; the other 49 questions keep their printed numbers and
# none is dropped. The paper prints no graph; its one table (Q44-45) is typed in the stem as a
# KaTeX array. Answers were worked out afresh, and 33 printed keys did not hold up (each has a
# key_note). Repairs: Q29's stem asks for the increase in national income; Q35's broken stem is
# rebuilt as a question on the budget that creates jobs; Q44 had no right option, so 11.0%
# became 25.0%; Q20 is rebuilt on AP and MP in place of returns to scale; and an option that
# made a second right answer was replaced in Q3, Q10, Q15, Q19, Q23, Q24, Q28, Q43 (stem) and
# Q46. Small wording fixes in Q6, Q14, Q25, Q39 and Q42.
