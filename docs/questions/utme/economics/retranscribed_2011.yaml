# UTME 2011 Economics, written up by hand from source/past-questions.pdf, pages 11-19.
# Q1 (the paper type, B) is left out; the other 49 questions keep their printed numbers and
# none is dropped. Answers were worked out afresh, and 17 printed keys did not hold up (each has
# a key_note): Q3, Q8, Q10, Q13, Q17, Q18, Q19, Q22, Q25, Q27, Q28, Q33, Q35, Q36, Q41, Q44 and
# Q47, with Q35 also rebuilt. Rebuilt: Q34 and Q35, whose figure showed the gaps
# as angles and offered "recessionary gap" beside "deflationary gap", now use a redrawn
# 45-degree-line diagram with two AD lines and full-employment income, where X is the
# deflationary gap and K the inflationary gap; Q16's garbled stem ("its revenue will be supplied
# at a higher price") now asks how quantity supplied responds on an elastic supply curve; Q3
# names the fixed-technology assumption and loses a second right option. Repairs: Q2, Q41 and
# Q45 ask for the most effective or main answer; Q8's "Quality" is quantity demanded; Q14
# names a floor above equilibrium; Q17 asks for the optimum output; Q32 option C is GDP at
# constant prices; Q20's axes are capital and labour, with the curves named as isoquants. Three
# figures (Q20, Q23-24, Q34-35) are drawn as figure_svg; the two tables (Q8, Q12) are KaTeX
# arrays in the stem.
format_version: 1
source:
  file: docs/questions/utme/economics/source/past-questions.pdf
  exam_year: 2011
  paper_label: UTME 2011 Economics (objective)
  paper_code: UTME-2011-ECO
  pages: [11, 12, 13, 14, 15, 16, 17, 18, 19]
  printed_paper_type: B
  transcribed_by: hand
questions:
  - number: 2
    stem: 'The most effective long-term way of controlling inflation in a mixed economy is to'
    options:
      A: 'increase productivity'
      B: 'reduce income tax'
      C: 'ration available output'
      D: 'increase imports'
    answer: A
    printed_key: A
    subtopic: ECO.12.e
    level: 2
    level_reason: link the cause of inflation (too little output) to its lasting cure
    corrected: 'stem: "An effective way" became "The most effective long-term way", since rationing and imports can also hold prices down for a while'

  - number: 3
    stem: 'The production possibility curve (PPC) is drawn on the assumption that the state of technology does not change. One limitation of the PPC that comes from this assumption is that there is'
    options:
      A: 'no indication of technological development'
      B: 'no measure of the opportunity cost of one good in terms of the other'
      C: 'technical inefficiency at every point on the curve'
      D: 'an abundance of resources'
    answer: A
    printed_key: B
    subtopic: ECO.1.c
    level: 2
    level_reason: connect one assumption of the PPC to the limitation it causes
    corrected: 'rebuilt: "One of the limitations PPC assumption is that there is" was garbled and both A and B (no sign of which goods a country prefers) were limitations of the PPC; the stem now names the fixed-technology assumption, B became "no measure of the opportunity cost", which the slope of the PPC does show, and C and D were reworded'
    key_note: 'Fixing technology means the PPC cannot show technological development; the printed B (no recognition of preferred goods) is a limitation but does not come from an assumption, and in the rebuilt question B is false because the slope of the PPC measures opportunity cost'

  - number: 4
    stem: 'A major disadvantage of the arithmetic mean is that it is'
    options:
      A: 'not useful for large data'
      B: 'not suitable for further statistical analysis'
      C: 'cumbersome to determine the actual value'
      D: 'affected by extreme values'
    answer: D
    printed_key: D
    subtopic: ECO.3.b
    level: 1
    level_reason: recall the main weakness of the mean
    corrected: 'stem: "arithmetic means" became "arithmetic mean"; option D: "extreme data" became "extreme values"'

  - number: 5
    stem: 'Demand patterns are determined by the market on the basis of'
    options:
      A: 'scale of preference'
      B: 'consumer sovereignty'
      C: 'consumer rationality'
      D: 'price of the commodity'
    answer: B
    printed_key: B
    subtopic: ECO.2.a
    level: 1
    level_reason: recall who directs production in a market economy

  - number: 6
    stem: 'Consumer surplus measures the'
    options:
      A: 'benefits derived from consuming a cheap commodity'
      B: 'excess of total expenditure over total utility'
      C: 'difference between marginal utility and marginal cost'
      D: 'excess of marginal utility over price'
    answer: D
    printed_key: D
    subtopic: ECO.5.e
    level: 2
    level_reason: recognise the definition of consumer surplus among close wordings
    corrected: 'stem: "A consumer surplus" became "Consumer surplus"'

  - number: 7
    stem: 'If the demand for one commodity excludes another, it is said to be'
    options:
      A: 'complementary demand'
      B: 'competitive demand'
      C: 'composite demand'
      D: 'derived demand'
    answer: B
    printed_key: B
    subtopic: ECO.4.b
    level: 1
    level_reason: recall a type of demand

  - number: 8
    stem: '$$\begin{array}{|c|c|}\hline \text{Price (₦)} & \text{Quantity demanded (kg)} \\ \hline 1 & 100 \\ \hline 2 & 120 \\ \hline 3 & 150 \\ \hline 4 & 180 \\ \hline 5 & 200 \\ \hline\end{array}$$ The graph of the demand schedule above will depict'
    options:
      A: 'a kinked demand curve'
      B: 'a normal demand curve'
      C: 'an abnormal demand curve'
      D: 'a diminishing marginal utility curve'
    answer: C
    printed_key: B
    subtopic: ECO.4.a
    level: 3
    level_reason: read the direction of the schedule, then name the curve it gives
    corrected: 'table: "Quality (Kg)" became "Quantity demanded (kg)"; stem: "the schedule" became "the demand schedule"'
    key_note: 'Quantity demanded rises as price rises, so the curve slopes upward from left to right; that is an abnormal (exceptional) demand curve, not a normal one'

  - number: 9
    stem: 'The median of an odd-numbered set of scores is the'
    options:
      A: 'middle value when the scores are arranged in order'
      B: 'highest value in the set'
      C: 'arithmetic mean of the set'
      D: 'most frequently occurring score'
    answer: A
    printed_key: A
    subtopic: ECO.3.b
    level: 1
    level_reason: recall the definition of the median
    corrected: 'option A: "Middle value in the set" became "middle value when the scores are arranged in order"; C: "Arithmetic means" became "arithmetic mean"; D: "Most frequent occurring" became "most frequently occurring"'

  - number: 10
    stem: 'If demand increases without a change in supply, equilibrium price and quantity will'
    options:
      A: 'remain unchanged'
      B: 'shift inward'
      C: 'fall'
      D: 'rise'
    answer: D
    printed_key: B
    subtopic: ECO.7.d
    level: 2
    level_reason: shift the demand curve and read the new equilibrium
    key_note: 'A rightward shift of demand along an unchanged supply curve raises both equilibrium price and quantity; prices and quantities do not "shift inward", curves do'

  - number: 11
    stem: 'In the process of production, total output is at a maximum when'
    options:
      A: 'MP = 0'
      B: 'MP > 0'
      C: 'AP = 0'
      D: 'AP > 0'
    answer: A
    printed_key: A
    subtopic: ECO.8.b
    level: 2
    level_reason: link the peak of TP to marginal product
    corrected: 'stem: "at maximum" became "at a maximum"'

  - number: 12
    stem: '$$\begin{array}{|c|c|}\hline \text{Price (₦)} & \text{Quantity supplied (bags)} \\ \hline 1 & 60 \\ \hline 2 & 120 \\ \hline\end{array}$$ From the table above, the price elasticity of supply is'
    options:
      A: '4'
      B: '25'
      C: '1'
      D: '2'
    answer: C
    printed_key: C
    subtopic: ECO.6.c
    level: 3
    level_reason: two percentage changes, then one division
    corrected: 'table: "Qty./ (bags)" became "Quantity supplied (bags)"; stem: "that table" became "the table"'

  - number: 13
    stem: 'When a consumer is at equilibrium, the marginal rate of substitution of X for Y ($\text{MRS}_{xy}$) is equal to the'
    options:
      A: 'sum of the two prices'
      B: 'product of the two prices'
      C: 'ratio of the two prices'
      D: 'difference between the two prices'
    answer: C
    printed_key: A
    subtopic: ECO.5.c
    level: 2
    level_reason: recall the tangency condition of consumer equilibrium
    corrected: '"MRSxy" written out and typeset; options A and D reworded to match B and C'
    key_note: 'At equilibrium the indifference curve touches the budget line, so MRSxy = Px/Py, the ratio of the prices; adding prices has no meaning here'

  - number: 14
    stem: 'Minimum price legislation, fixing a price above the equilibrium price, will'
    options:
      A: 'reduce supply'
      B: 'increase supply'
      C: 'reduce quantity demanded and create a surplus'
      D: 'increase demand and create scarcity'
    answer: C
    printed_key: C
    subtopic: ECO.7.c
    level: 2
    level_reason: apply a price floor to the demand and supply diagram
    corrected: 'stem: "fixing a price above the equilibrium price" added; option C: "reduce demand and create surplus" became "reduce quantity demanded and create a surplus"'

  - number: 15
    stem: 'Ranking is the method used in measuring'
    options:
      A: 'marginal utility'
      B: 'ordinal utility'
      C: 'cardinal utility'
      D: 'total utility'
    answer: B
    printed_key: B
    subtopic: ECO.5.a
    level: 1
    level_reason: recall the ordinal approach to utility
    corrected: 'stem: "method use" became "method used"'

  - number: 16
    stem: 'If a firm faces an elastic supply curve, then when the price of its product rises, the quantity it supplies will'
    options:
      A: 'rise by a smaller percentage than the price'
      B: 'fall as the price rises'
      C: 'increase by more than the percentage increase in price'
      D: 'change by the same percentage as the price'
    answer: C
    printed_key: C
    subtopic: ECO.6.c
    level: 2
    level_reason: apply the meaning of elastic supply to a price rise
    corrected: 'rebuilt: "its revenue will" with options "be supplied at a higher price" and "double at a higher price" did not make sense; the stem now asks how the quantity supplied responds, C and D are kept in meaning, and A and B were rewritten as inelastic supply and a backward response'

  - number: 17
    stem: 'The optimum output of a perfectly competitive firm is the output at which'
    options:
      A: 'AC is lowest'
      B: 'AVC is lowest'
      C: 'MC is rising'
      D: 'MC is falling'
    answer: A
    printed_key: B
    subtopic: ECO.9.a
    level: 2
    level_reason: recall the definition of optimum output
    corrected: 'stem: "The optimal range of output for a perfectly competitive firm is" became "The optimum output of a perfectly competitive firm is the output at which"'
    key_note: 'Optimum output is where average (total) cost is lowest, which is also where a competitive firm produces in the long run; lowest AVC is the shut-down point'

  - number: 18
    stem: 'A firm will experience diseconomies of scale when'
    options:
      A: 'there are difficulties in coordinating production'
      B: 'there is a shortage in labour supply'
      C: 'the size of the market is small'
      D: 'there is an increase in the price of raw materials'
    answer: A
    printed_key: C
    subtopic: ECO.8.d
    level: 1
    level_reason: recall the main cause of diseconomies of scale
    corrected: 'option B: "shortage in labour supply" became "a shortage in labour supply"'
    key_note: 'Diseconomies of scale come from the firm growing too big to manage: coordination and control become hard and average cost rises; a small market only limits economies of scale'

  - number: 19
    stem: 'The law of variable proportions is applicable only'
    options:
      A: 'in the long-run period'
      B: 'to large-scale enterprises'
      C: 'to small-scale enterprises'
      D: 'in the short-run period'
    answer: D
    printed_key: A
    subtopic: ECO.8.b
    level: 1
    level_reason: recall that the law needs a fixed factor
    key_note: 'The law needs at least one fixed factor, and a fixed factor exists only in the short run; in the long run all factors vary and returns to scale apply instead'

  - number: 20
    stem: 'In the diagram, I, II and III are isoquants and the straight line is the firm''s isocost line. From the diagram, the optimal point of production is'
    options:
      A: 'R'
      B: 'T'
      C: 'U'
      D: 'S'
    answer: D
    printed_key: D
    subtopic: ECO.8.f
    level: 3
    level_reason: read the diagram and apply the tangency rule for least cost
    figure_svg: |
