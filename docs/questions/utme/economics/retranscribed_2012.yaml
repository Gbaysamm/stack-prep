  - number: 6
    stem: 'Use the pie chart below, which shows how the sectors of an economy contribute to its GDP. If the GDP is ₦60 billion, what is the difference between the contributions of the oil and manufacturing sectors?'
    options:
      A: '₦11.7 billion'
      B: '₦13.3 billion'
      C: '₦21.7 billion'
      D: '₦26.6 billion'
    answer: B
    printed_key: D
    key_note: 'Oil is 160/360 × ₦60 billion = ₦26.7 billion and manufacturing 80/360 × ₦60 billion = ₦13.3 billion, a difference of ₦13.3 billion; D is the oil sector alone.'
    subtopic: ECO.3.b
    level: 4
    level_reason: find the missing angle, value two sectors from the chart, then subtract
    corrected: '"N" written as ₦; the shared instruction added to the stem'
    figure_svg: |
      <svg viewBox="0 0 340 300" width="340" height="300" role="img"
           aria-label="Pie chart of a country's GDP by sector: oil sector 160 degrees, agriculture sector 90 degrees, mining sector 30 degrees, and the manufacturing sector the remaining slice, whose angle is not marked">
