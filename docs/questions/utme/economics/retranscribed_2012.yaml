  - number: 7
    stem: 'If the quantity of rice bought decreases from 250 tonnes to 200 tonnes owing to a 2% rise in price, it shows that there is a change in'
    options:
      A: "consumers' income"
      B: 'demand'
      C: "consumers' tastes"
      D: 'quantity demanded'
    answer: D
    printed_key: B
    key_note: 'A change in the good''s own price moves the buyer along the demand curve, which is a change in quantity demanded, not in demand.'
    subtopic: ECO.4.a
    level: 2
    level_reason: tell a movement along the curve from a shift of it

  - number: 8
    stem: 'A rise in income will, ceteris paribus, bring about, for a normal good,'
    options:
      A: 'a movement along the demand curve'
      B: 'a leftward shift of the demand curve'
      C: 'a rightward shift of the demand curve'
      D: 'no effect on the demand curve'
    answer: C
    printed_key: B
    key_note: 'For a normal good, more income means more is demanded at every price, so the whole demand curve shifts to the right.'
    subtopic: ECO.4.a
    level: 2
    level_reason: apply one determinant of demand to the curve
    corrected: 'stem: "for a normal good" added, because for an inferior good a rise in income shifts demand to the left and B would also be right'

  - number: 9
    stem: 'Use the table below to answer the question. $$\begin{array}{|c|c|}\hline \text{Price (₦)} & \text{Quantity (kg)} \\ \hline 50 & 500 \\ \hline 70 & 400 \\ \hline\end{array}$$ From the table, calculate the price elasticity of demand.'
    options:
      A: '5.0'
      B: '2.0'
      C: '1.0'
      D: '0.5'
    answer: D
    printed_key: A
    key_note: 'Quantity falls by 100/500 = 20% while price rises by 20/50 = 40%, so PED = 20 ÷ 40 = 0.5.'
    subtopic: ECO.4.c
    level: 3
    level_reason: two percentage changes, then one division
    corrected: 'table heading "Quality (Kg)" became Quantity (kg); the table is typed as a KaTeX array'

  - number: 10
    stem: 'If the price of an item increases by 8% while the quantity demanded falls from 1500 units to 1492 units, the demand is said to be'
    options:
      A: 'perfectly elastic'
      B: 'inelastic'
      C: 'elastic'
      D: 'perfectly inelastic'
    answer: B
    printed_key: B
    subtopic: ECO.4.c
    level: 3
    level_reason: work out the percentage change in quantity, then compare it with the price change

  - number: 11
    stem: 'Comparison of interpersonal utility is impossible because'
    options:
      A: 'utility is measured in utils'
      B: 'marginal utility is not observable'
      C: 'utility is subjectively determined'
      D: 'individual incomes differ'
    answer: C
    printed_key: A
    key_note: 'Utility is a personal, subjective feeling, so one person''s satisfaction cannot be set against another''s; utils are only an imaginary unit used within one person''s choices.'
    subtopic: ECO.5.a
    level: 2
    level_reason: recall why utility cannot be compared between people
    corrected: 'option A "measured in utility" became "measured in utils"; option D "individual income differ" became "individual incomes differ"'

  - number: 12
    stem: 'When the slope of the total utility curve is declining, the marginal utility of a consumer will be increasing if he'
    options:
      A: 'stops consuming more of the commodity'
      B: 'reduces the quantity consumed'
      C: 'increases the quantity consumed'
      D: 'consumes more of another commodity'
    answer: B
    printed_key: C
    key_note: 'Marginal utility is the slope of total utility; when that slope is declining, MU falls as more is consumed, so MU rises only if the consumer goes back to fewer units.'
    subtopic: ECO.5.b
    level: 3
    level_reason: link the slope of total utility to marginal utility, then reverse the direction

