    stem: 'Use the diagram below, in which a consumer''s budget line is drawn with two of his indifference curves, IC₁ and IC₂. To move from point M to K, the consumer has to increase the'
    options:
      A: 'consumption of X and reduce the consumption of Y'
      B: 'expenditure on both X and Y'
      C: 'expenditure on X'
      D: 'consumption of Y and reduce the consumption of X'
    answer: D
    printed_key: C
    key_note: 'K lies above and to the left of M on the same budget line, so the consumer buys more Y and less X.'
    subtopic: ECO.5.c
    level: 3
    level_reason: read the change in both goods between two points on the diagram
    corrected: 'option B "expenditure on Y" was also true (buying more Y means spending more on Y), so it became "expenditure on both X and Y", which cannot happen along one budget line; the shared instruction added to the stem'
