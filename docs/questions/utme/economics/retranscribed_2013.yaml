  - number: 19
    stem: 'One of the criticisms of the price mechanism is that'
    options:
      A: 'producers are sovereign'
      B: 'it provides low degree of freedom'
      C: 'it widens the inequitable gap'
      D: 'consumers are sovereign'
    answer: C
    printed_key: D
    key_note: 'Consumer sovereignty is a merit of the price system; its standard criticism is that it widens the gap between rich and poor'
    subtopic: ECO.7.b
    level: 2
    level_reason: tell a merit of the price system from a criticism

  - number: 20
    stem: 'In Nigeria, government can reduce the cost of accommodation by fixing rent'
    options:
      A: 'at the prevailing rate'
      B: 'at the equilibrium price'
      C: 'above the equilibrium price'
      D: 'below the equilibrium price'
