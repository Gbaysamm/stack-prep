  - number: 14
    stem: 'One of the major factors that brings about changes in supply is'
    options:
      A: 'market discrimination'
      B: 'availability of storage facilities'
      C: 'the cost of storage'
      D: 'incentives granted to workers'
    answer: C
    printed_key: C
    subtopic: ECO.6.a
    level: 2
    level_reason: see storage cost as part of the cost of production

  - number: 15
    stem: 'If $P = \dfrac{1}{4}(Q_s + 10)$, what is the quantity supplied at a price of ₦14?'
    options:
      A: '14'
      B: '60'
      C: '46'
      D: '32'
    answer: C
    printed_key: C
    subtopic: ECO.7.e
    level: 3
