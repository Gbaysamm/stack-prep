# UTME 2013 Economics, written up by hand from source/past-questions.pdf, pages 30-39.
# Q1 asks for the paper type (Type U) and is left out, so 49 questions are kept; none is dropped.
# Answers were worked out afresh. Twelve printed keys did not hold up: Q4 (the mean and the
# standard deviation are the tools that lend themselves to further analysis), Q16 (elastic supply
# falls sharply when price falls), Q19 (unequal incomes are the criticism; consumer sovereignty is
# a merit), Q20 (rent control is a ceiling below equilibrium), Q23 (R starts at the fixed cost and
# keeps the shape of M, so it is total cost), Q28 (a loan for household needs is transactions
# demand), Q29 (the discount rate is the CBN's tool; tax is fiscal), Q34 (life funds are long-term
# money), Q35 (processing adds value), Q37 (bricks use bulky clay, so they locate at the raw
# material), Q45 (buying the naira with reserves holds its value up), Q47 (the ECA's work on
# transport and communications; free trade among states is not an ECA achievement). Rebuilt so
# that one option is right: Q5 (no printed option was an advantage of the range; A is now "is
# simple to calculate and easy to understand" and C, a near copy of B, is now the false claim that
# extreme values do not affect it), Q42 (A, difficulty in transferring shares, is also a real
# disadvantage, so A is now an advantage), Q43 (three printed options improve the quality of
# labour; A and C now change only its quantity or place), Q46 (three printed options were fiscal
# instruments; A and D are now monetary tools). Q24 and Q25: the graph is redrawn with the price
# level labelled H, average cost at B labelled E and MC = MR labelled J, so that GHOB is total
# revenue; Q24 now asks for the profit-maximizing output. Small repairs: Q2, Q17, Q22, Q28, Q35,
# Q36, Q48 and Q50 stems; ₦ for "N" throughout. Four graphs are drawn as figure_svg (Q10, Q13,
# Q23, and Q24-25 sharing one).
