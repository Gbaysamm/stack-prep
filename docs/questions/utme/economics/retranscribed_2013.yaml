    corrected: 'stem: "If P = ¼(Qs + 10). What is" became one sentence; "at N14" became "at a price of ₦14"'

  - number: 16
    stem: 'If the supply of a product is elastic, a small reduction in price will'
    options:
      A: 'reduce the cost of production'
      B: 'reduce the quantity supplied'
      C: 'increase the quantity supplied'
      D: 'lead to no change in the quantity supplied'
    answer: B
    printed_key: C
    key_note: 'Price and quantity supplied move in the same direction; with elastic supply a small fall in price brings a larger fall in quantity supplied'
    subtopic: ECO.6.c
    level: 2
    level_reason: apply the law of supply with elastic supply

