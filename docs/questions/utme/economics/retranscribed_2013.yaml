questions:
  - number: 2
    stem: 'An economy in which both the public and private sectors contribute to economic growth is known as'
    options:
      A: 'feudal economy'
      B: 'capitalist economy'
      C: 'socialist economy'
      D: 'mixed economy'
    answer: D
    printed_key: D
    subtopic: ECO.2.a
    level: 1
    level_reason: recall the name of the system that combines both sectors
    corrected: 'stem: "is as" became "is known as"'

  - number: 3
    stem: 'If the standard deviation of a given data is 53, what is the variance?'
    options:
      A: '2,082'
      B: '2,809'
      C: '2,808'
      D: '2,209'
    answer: B
    printed_key: B
    subtopic: ECO.3.b
    level: 2
    level_reason: square the standard deviation in one step

  - number: 4
    stem: 'Which of the following sets of statistical tools is used for further economic analysis?'
    options:
      A: 'the median and standard deviation'
      B: 'the mean and mode'
      C: 'the mean and standard deviation'
      D: 'the mode and median'
    answer: C
    printed_key: B
    key_note: 'The mean and the standard deviation use every value and can be handled algebraically, so they feed further analysis; the mode cannot'
    subtopic: ECO.3.b
    level: 2
    level_reason: know which measures can be used in further calculation
    corrected: 'stem: "set of statistical tools" became "sets of statistical tools"'

  - number: 5
    stem: 'An advantage of the range as a measure of dispersion is that it'
    options:
      A: 'is simple to calculate and easy to understand'
      B: 'makes use of all values of observations in a distribution'
      C: 'is not affected by extreme values'
      D: 'is useful for further statistical calculation'
    answer: A
    printed_key: A
    subtopic: ECO.3.b
    level: 2
    level_reason: know the strength and the weaknesses of the range
    corrected: 'rebuilt: no printed option was an advantage of the range. A "can be used to calculate open-ended distribution" (the range cannot be found for an open-ended class) became "is simple to calculate and easy to understand"; C "takes all values into consideration", a near copy of B, became "is not affected by extreme values"; B "make use" became "makes use"'

  - number: 6
    stem: 'Find the median of the following set of data: 35, 10, 14, 38, 15, 18, 22, 30 and 28.'
    options:
