questions:
  - number: 2
    stem: 'The choice of how to produce in a command economy is determined by'
    options:
      A: 'government'
      B: 'consumers'
      C: 'industrialists'
      D: 'labour unions'
    answer: A
    printed_key: A
    subtopic: ECO.2.b
    level: 1
    level_reason: recall who decides in a centrally planned economy
    corrected: 'option B: "consumer" became "consumers"'

  - number: 3
    stem: 'In capitalist economies, questions about what to produce are ultimately answered by'
    options:
      A: 'income level of households'
      B: 'available technical skills in the economy'
      C: 'output decisions of firms'
      D: 'spending decisions of households'
    answer: D
    printed_key: C
    key_note: 'Consumer sovereignty: firms decide output only in answer to what households spend on, so the final answer to "what to produce" lies with household spending.'
    subtopic: ECO.2.b
    level: 2
    level_reason: apply consumer sovereignty to the "what to produce" problem
    corrected: 'option D: "holding decision of households" became "spending decisions of households", the phrase the option was meant to carry'

  - number: 4
    stem: 'The measure of dispersion that is worked out from the heights of only the tallest and the shortest trees in a forest is the'
    options:
      A: 'range'
      B: 'variance'
      C: 'standard deviation'
      D: 'mean deviation'
    answer: A
    printed_key: B
    key_note: 'The range is highest value minus lowest value, so it is the only measure built from the tallest and shortest alone; variance uses every tree.'
    subtopic: ECO.3.b
    level: 2
    level_reason: match the measure of dispersion to the data it uses
    corrected: 'stem: "The best measure of dispersion to determine the tallest tree in a forest is" no measure of dispersion finds a single tallest tree; it now asks for the measure worked out from the tallest and shortest trees'

