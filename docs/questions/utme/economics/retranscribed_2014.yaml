  - number: 8
    stem: 'Given that $Q_d = 40 - 2P$ and $Q_s = 6P + 24$, calculate the equilibrium price.'
    options:
      A: '₦2'
      B: '₦32'
      C: '₦36'
      D: '₦16'
    answer: A
    printed_key: D
    key_note: '40 − 2P = 6P + 24 gives 8P = 16, so P = ₦2; 16 is 8P, and 36 is the equilibrium quantity.'
    subtopic: ECO.7.e
    level: 3
    level_reason: set demand equal to supply and solve one linear equation
    corrected: 'rebuilt: no printed option (₦34, ₦32, ₦36, ₦16) was the equilibrium price; option A ₦34 became ₦2'

  - number: 9
    stem: 'A change in demand for a normal good implies that there is a'
    options:
      A: 'change in the quantity demanded as price changes'
      B: 'shift in the demand curve'
      C: 'movement along a given demand curve'
      D: 'change in the price elasticity of demand'
    answer: B
    printed_key: D
    key_note: 'A change in demand means the whole curve shifts; a change in quantity demanded is a movement along it.'
    subtopic: ECO.4.a
    level: 2
    level_reason: tell a change in demand from a change in quantity demanded
    corrected: 'stem: "a normal goods" became "a normal good"'

