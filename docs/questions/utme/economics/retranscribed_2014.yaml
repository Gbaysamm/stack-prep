# UTME 2014 Economics, written up by hand from source/past-questions.pdf, pages 40-49.
# Q1 (the paper-type question, Type L) is left out, so 49 questions are kept and none is dropped.
# Answers were worked out afresh, and many printed keys did not hold up (Q4, Q5, Q7, Q8, Q9, Q12,
# Q13, Q15, Q17, Q20, Q21, Q23, Q25, Q27, Q28, Q29, Q30, Q37, Q40, Q42, Q44, Q45, Q47, Q48, Q50;
# see each key_note). Rebuilt: Q6 (no option was the manufacturing share; new options are the
# four sector values), Q7 (option B ran two options together and D was lost; split back into
# four), Q8 (no option was the equilibrium price of ₦2; option A is now ₦2), Q10 (options C and D
# were lost; four elasticity types given), Q11 (two points were equilibria; the stem now says the
# price of X falls and asks for the new equilibrium, and point M is drawn), Q24 (several options
# could raise revenue; now about price discrimination) and Q42 (several options fitted any
# merger; option A is now the textbook aim of vertical integration and D is lateral). Repairs:
# Q3 option D "holding" became "spending"; Q4, Q18, Q22, Q25, Q26 and Q31 stems made sound;
# Q40 option D, Q43 option C and Q50 option D rewritten so one option is right; Q31 option A
# rewritten; typos fixed ("forest of demand", "in other to"). The pie chart (Q5, Q6), the demand
# shift (Q7) and the indifference map (Q11) are drawn as figure_svg; the two tables are KaTeX.
