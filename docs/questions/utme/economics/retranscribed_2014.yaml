  - number: 7
    stem: 'Use the graph below to answer this question. A combination of factors responsible for a shift of the demand curve from D₀D₀ to D₁D₁ is'
    options:
      A: 'consumers'' income and a change in technology'
      B: 'the price of the commodity and weather conditions'
      C: 'consumers'' income and population size'
      D: 'consumers'' taste and a change in price'
    answer: C
    printed_key: D
    key_note: 'A change in the good''s own price moves along the curve; only non-price factors such as income and population shift it, and technology shifts supply.'
    subtopic: ECO.4.a
    level: 3
    level_reason: read the shift on the graph and sort price from non-price determinants
    corrected: 'rebuilt: option B ran two options together and one option was lost; split back into four options; "D0D0to D1D1 are" became "from D₀D₀ to D₁D₁ is"; the graph is redrawn as figure_svg with P₀ and Q₀ for the first equilibrium'
