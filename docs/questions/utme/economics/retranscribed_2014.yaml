      A: 'unitary elastic'
      B: 'perfectly inelastic'
      C: 'inelastic'
      D: 'elastic'
    answer: C
    printed_key: C
    subtopic: ECO.4.c
    level: 3
    level_reason: compute PED and classify it
    corrected: 'rebuilt: only option A was printed, and B was blank; options B to D now name the other types of elasticity; "the elasticity demand is" became "the demand is"'

