  - number: 1
    stem: 'The major implication of a high dependency ratio on an economy is'
    options:
      A: 'high capital formation'
      B: 'vicious cycle of poverty'
      C: 'low cost of living'
      D: 'high standard of living'
    answer: B
    printed_key: B
    subtopic: ECO.20.d
    level: 2
    level_reason: link many dependants to low saving and then to poverty
    corrected: 'stem: "of high dependency ratio" became "of a high dependency ratio"'

  - number: 2
    stem: 'One of the major problems of the agricultural sector in Nigeria, which tractor-hiring and mechanization schemes are meant to solve, is'
    options:
      A: 'low literacy level of farmers'
      B: 'small size of farms'
      C: 'pest attack on crops'
      D: 'inadequate modern farm implements'
    answer: D
    printed_key: D
    subtopic: ECO.16.c
    level: 2
    level_reason: match a problem of agriculture to the policy aimed at it
    corrected: 'stem: all four options are real problems of Nigerian agriculture, so the stem now names the remedy (tractor-hiring and mechanization schemes) to leave one right answer; option D "modem" became "modern"'

