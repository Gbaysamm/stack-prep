# UTME 2015 Economics, written up by hand from source/past-questions.pdf, pages 50-58.
# This paper prints no paper-type question, so Q1 is a real question and all 50 questions are
# kept; none is dropped. Answers were worked out afresh. Five printed keys did not hold up: Q9
# (the sum of marginal utilities is total utility), Q19 (rebuilt; the class with the highest
# frequency gives the mode), Q31 (perfect competition assumes no transport cost; price
# discrimination belongs to monopoly), Q40 (a factor price is set by the demand for and supply
# of the factor) and Q47 (poor infrastructure, above all power, is the main cause of industrial
# failure). Repairs: Q11's options ran into Q21 across the page and were put back; Q12's graph is
# missing and is drawn to fit the options; Q2, Q3, Q6, Q37, Q47 had several right options and
# were narrowed to one; Q4 option A, Q37 option A and Q21 option D were completed; Q22, Q42 and
# Q46 had stems that did not work and were repaired the smallest way; Q19 was rebuilt. Q12, Q24
# and Q41 are drawn as figure_svg; the tables of Q8 and Q46 are KaTeX arrays.
