# UTME 2016 Economics, written up by hand from source/past-questions.pdf, pages 59-67.
# This paper prints no paper-type question, so Q1 is a real question and all 50 questions are
# kept; none is dropped. Answers were worked out afresh. Nine printed keys did not hold up: Q3
# (a monopolist's best output is where MR = MC), Q4 (most of Africa is at the second stage of
# the demographic transition), Q9 (precautionary demand depends on income), Q12 (rebuilt; ATC
# at 20 units is ₦15), Q24 (repaired; GNP adds net factor income from abroad to GDP), Q30 (a
# land tax falls entirely on owners), Q41 (the range is 71 − 15 = 56), Q42 (equilibrium is the
# tangency point M) and Q43 (P = 18 gives Qs = 42). Repairs: Q12's options (₦45.30kg and so on)
# fitted nothing on the graph, so the graph is redrawn from consistent cost schedules and the
# options rebuilt around it; Q4's stem now describes the stage; Q18, Q32, Q37 and Q47 had more
# than one right option and were narrowed to one; Q24's garbled option A was rebuilt; Q11,
# Q19, Q26, Q38, Q40, Q44 and Q46 had small faults in wording put right. Q12 and Q42 are drawn
# as figure_svg; the table shared by Q26 and Q40 is a KaTeX array in each stem.
format_version: 1
source:
  file: docs/questions/utme/economics/source/past-questions.pdf
  exam_year: 2016
  paper_label: UTME 2016 Economics (objective)
  paper_code: UTME-2016-ECO
  pages: [59, 60, 61, 62, 63, 64, 65, 66, 67]
  printed_paper_type: null
