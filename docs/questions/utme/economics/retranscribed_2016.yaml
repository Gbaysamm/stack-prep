questions:
  - number: 1
    stem: 'A country embarks on deficit financing in order to'
    options:
      A: 'reduce aggregate demand'
      B: 'increase revenue'
      C: 'stimulate investment'
      D: 'curb inflation'
    answer: C
    printed_key: C
    subtopic: ECO.14.g
    level: 2
    level_reason: link spending above revenue to a boost in economic activity

  - number: 2
    stem: 'The money market provides business firms with the avenue to'
    options:
      A: 'purchase goods and services'
      B: 'purchase capital equipment'
      C: 'obtain short-term funds'
      D: 'obtain long-term funds'
    answer: C
    printed_key: C
    subtopic: ECO.13.c
    level: 1
    level_reason: recall what the money market deals in
    corrected: 'option B "capital equipment''s" became "capital equipment"'

  - number: 3
    stem: 'The optimum level of output for a pure monopolist occurs where'
    options:
      A: 'P is highest'
      B: '$P = AC$'
      C: '$P = MC$'
      D: '$MR = MC$'
    answer: D
    printed_key: A
    key_note: 'Every profit-maximizing firm, a monopolist included, produces where MR = MC; the highest price sells almost nothing.'
    subtopic: ECO.10.b
    level: 2
    level_reason: apply the profit-maximizing rule to a monopolist
    corrected: 'stem: "for pure monopolist" became "for a pure monopolist"'

  - number: 4
    stem: 'According to the demographic transition theory, most African countries, where the birth rate is still high but the death rate is falling, can be said to be at stage'
    options:
      A: '2 and 3'
      B: '3 only'
      C: '2 only'
      D: '1 and 3'
    answer: C
    printed_key: D
    key_note: 'High birth rate with a falling death rate is stage 2 (early expanding); stage 1 has high death rates and stage 3 a falling birth rate.'
    subtopic: ECO.20.a
    level: 2
    level_reason: match a pattern of birth and death rates to a stage of the theory
    corrected: 'stem: "Africa can be said to be at stage" gave no way to choose between the options, so it now describes the stage (high birth rate, falling death rate)'

  - number: 5
    stem: 'The Economic Community of West African States (ECOWAS) is an example of'
    options:
      A: 'globalization'
      B: 'a regional marketing board'
      C: 'economic integration'
      D: 'an economic union'
    answer: C
    printed_key: C
    subtopic: ECO.22.a
    level: 1
    level_reason: recall what kind of body ECOWAS is

  - number: 6
    stem: 'Given: 32, 18, 24, 17, 16, 32, 28, 68, 71 and 15, the mode of the distribution is'
    options:
      A: '71'
      B: '56'
      C: '32'
      D: '15'
    answer: C
    printed_key: C
    subtopic: ECO.3.b
    level: 2
    level_reason: find the value that occurs most often

  - number: 7
    stem: 'The major determinant of income elasticity of demand is'
    options:
      A: 'government policy'
      B: 'the availability of substitutes'
      C: 'the price of the good'
      D: 'the level of the consumer''s income'
    answer: D
    printed_key: D
    subtopic: ECO.4.c
    level: 1
    level_reason: recall what income elasticity responds to

  - number: 8
    stem: 'Given: 2, 4, 6, 8, 4 and 6, the mean deviation is'
    options:
      A: '6.00'
      B: '1.67'
      C: '30.00'
      D: '0.60'
    answer: B
    printed_key: B
    subtopic: ECO.3.b
    level: 3
    level_reason: find the mean, then average the absolute deviations
    corrected: 'stem: "absolute mean deviation" became "mean deviation", the usual name for the mean of the absolute deviations'

  - number: 9
    stem: 'The precautionary demand for money is determined by'
    options:
      A: 'the level of savings'
      B: 'the rate of interest'
      C: 'the general price level'
      D: 'the level of income'
    answer: D
    printed_key: A
    key_note: 'Keynes: the transactions and precautionary motives depend on income; savings is not the determinant, and the interest rate drives the speculative motive.'
    subtopic: ECO.12.b
    level: 1
    level_reason: recall what the precautionary motive depends on

  - number: 10
    stem: 'If the output of a firm experiencing economies of scale increases, the average cost would'
    options:
      A: 'be at minimum'
      B: 'rise'
      C: 'be at maximum'
      D: 'fall'
    answer: D
    printed_key: D
    subtopic: ECO.8.d
    level: 1
    level_reason: recall the effect of economies of scale on average cost

  - number: 11
    stem: 'The demand curve for a normal good is negatively sloped because'
    options:
      A: 'a fall in price is an incentive to producers to sell more'
      B: 'a fall in price is an incentive to consumers to buy more'
      C: 'demand always exceeds supply'
      D: 'price and quantity move in the same direction'
    answer: B
    printed_key: B
    subtopic: ECO.4.a
    level: 2
    level_reason: explain the slope of the demand curve
    corrected: 'options A and B "price is an incentive to producers/consumers" completed as "a fall in price is an incentive to producers to sell more / consumers to buy more"'

