# UTME 2017 Economics, written up by hand from source/past-questions.pdf, pages 68-75.
# This paper prints no paper-type question, so Q1 is a real question. It prints Q1 to Q40 but
# no Q24 at all (the options of Q23 run straight on into Q25), so Q24 is rebuilt as a new
# question on the multiplier; nothing is dropped and all 40 numbers are kept. Answers were
# worked out afresh. Two printed keys did not hold up: Q13 (a rise in per capita income with a
# rise in output is economic growth) and Q31 (after the table was repaired, the elasticity is
# 0.30). Repairs: Q20 lost the total it needs, so ₦855 million was put back; Q31's table showed
# quantity falling with price, which is not demand, so 16 became 21; Q11 had two right answers
# (NEXIM also serves exporters) and the stem now asks for the agency rather than a bank; Q28
# and Q27 carried stray words from the next figure; small typos in Q6, Q9, Q14, Q28, Q29, Q32
# and Q38. The pie chart (Q12, Q20), the supply graph (Q28) and the circular flow (Q29) are
# drawn as figure_svg; the tables of Q31, Q35 and Q36 are KaTeX arrays.
