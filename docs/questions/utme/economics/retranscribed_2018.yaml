# UTME 2018 Economics, written up by hand from source/past-questions.pdf, pages 76-83.
# This paper prints no paper-type question, so Q1 is a real question and all 40 questions are
# kept; none is dropped. Answers were worked out afresh. Seven printed keys did not hold up: Q22
# (the mean is 32 ÷ 10 = 3.2), Q23 (the median of ten values is the average of the 5th and 6th,
# both 3), Q29 (the rate at which exports exchange for imports is the terms of trade), Q31 (on
# the redrawn curve diminishing returns set in at the point of inflexion S), Q32 (taxes and
# government spending are the tools of fiscal policy), Q36 (40 and over is 100 + 40 + 20 = 160)
# and Q39 (a union of workers with one skill is a craft union). Repairs: Q21 had no right option
# (100 million ÷ 50 = 2 million) and option D was put right; Q5 and Q15 each had two right
# options and were narrowed to one; Q14's stem now says the outputs come from equal resources;
# Q25's dollar amounts are in naira; Q31's curve is redrawn with a clear point of inflexion so
# that one point marks diminishing returns; Q36's histogram classes, printed 40-49 then 60-69
# and 70-100, are made continuous. Q25-26 (pie chart), Q31 (total product curve) and Q36-37
# (histogram) are drawn as figure_svg; the tables of Q14 and Q22-23 are KaTeX arrays.
