# UTME Economics — the topics and subtopics every question is tagged with.
#
# Read from source/syllabus.pdf. The syllabus numbers its 23 topics straight through. A topic
# here is one numbered topic (ECO.<number>); a subtopic is one of its lettered contents, (a),
# (b), ... in the syllabus's own lettering, and a topic the syllabus does not letter has one
# subtopic, `a`. Topic 1 prints its economic problems as b.(i) and the production possibility
# frontier as b.(ii); here they are ECO.1.b and ECO.1.c. database/load_retranscribed_economics.py
# builds the curriculum from this file, and every retranscribed_YYYY.yaml uses these codes.
format_version: 1
topics:
  ECO.1:
    name: Economics as a Science
    subtopics:
      ECO.1.a: "Basic concepts: wants, scarcity, choice, scale of preference, opportunity cost"
      ECO.1.b: "Economic problems of what, how and for whom to produce"
      ECO.1.c: "The production possibility frontier"
  ECO.2:
    name: Economic Systems
    subtopics:
      ECO.2.a: "Free enterprise, centrally planned and mixed economies"
      ECO.2.b: "Solutions to economic problems under different systems"
      ECO.2.c: "Contemporary issues in economic systems"
  ECO.3:
    name: Methods and Tools of Economic Analysis
    subtopics:
      ECO.3.a: "Inductive, deductive, positive and normative reasoning"
      ECO.3.b: "Tables, charts, graphs, central tendency and dispersion"
  ECO.4:
    name: The Theory of Demand
    subtopics:
      ECO.4.a: "Meaning and determinants of demand, schedules and curves"
      ECO.4.b: "Types of demand"
      ECO.4.c: "Elasticity of demand: types and measurement"
      ECO.4.d: "Importance of elasticity of demand"
  ECO.5:
    name: The Theory of Consumer Behaviour
    subtopics:
      ECO.5.a: "Utility, indifference curves and the budget line"
      ECO.5.b: "Diminishing marginal utility and the law of demand"
      ECO.5.c: "Consumer equilibrium"
      ECO.5.d: "Shifts in the budget line and the indifference curve"
      ECO.5.e: "Consumer surplus"
  ECO.6:
    name: The Theory of Supply
    subtopics:
      ECO.6.a: "Meaning and determinants of supply, schedules and curves"
      ECO.6.b: "Types of supply"
      ECO.6.c: "Elasticity of supply"
  ECO.7:
    name: The Theory of Price Determination
    subtopics:
      ECO.7.a: "Market and price"
      ECO.7.b: "Functions of the price system"
      ECO.7.c: "Equilibrium price and quantity, and price legislation"
      ECO.7.d: "Effects of changes in demand and supply on equilibrium"
      ECO.7.e: "Simple linear equations of demand and supply"
  ECO.8:
    name: The Theory of Production
    subtopics:
      ECO.8.a: "Meaning and types of production"
      ECO.8.b: "TP, AP, MP and the law of variable proportions"
      ECO.8.c: "Division of labour and specialization"
      ECO.8.d: "Internal and external economies of scale"
      ECO.8.e: "Production functions and returns to scale"
      ECO.8.f: "Producer equilibrium: isoquant and isocost"
      ECO.8.g: "Factors affecting productivity"
  ECO.9:
    name: Theory of Costs and Revenue
    subtopics:
      ECO.9.a: "Fixed, variable, total, average and marginal cost"
      ECO.9.b: "Total, average and marginal revenue"
      ECO.9.c: "Accountants' and economists' notions of cost"
      ECO.9.d: "Short-run and long-run costs"
      ECO.9.e: "Marginal cost and the supply curve of the firm"
  ECO.10:
    name: Market Structures
    subtopics:
      ECO.10.a: "Perfect competition"
      ECO.10.b: "Monopoly, discriminatory monopoly and monopolistic competition"
      ECO.10.c: "Break-even and shut-down analysis"
  ECO.11:
    name: National Income
    subtopics:
      ECO.11.a: "GNP, GDP, NI and NNP"
      ECO.11.b: "Measuring national income and its problems"
      ECO.11.c: "Uses and limitations of national income estimates"
      ECO.11.d: "The circular flow of income"
      ECO.11.e: "Consumption, investment and savings"
      ECO.11.f: "The multiplier"
      ECO.11.g: "Income determination and equilibrium national income"
  ECO.12:
    name: Money and Inflation
    subtopics:
      ECO.12.a: "Types, characteristics and functions of money"
      ECO.12.b: "Demand for and supply of money"
      ECO.12.c: "The quantity theory of money"
      ECO.12.d: "The value of money and the price level"
      ECO.12.e: "Inflation"
      ECO.12.f: "Deflation"
  ECO.13:
    name: Financial Institutions
    subtopics:
      ECO.13.a: "Types and functions of financial institutions"
      ECO.13.b: "Financial institutions and economic development"
      ECO.13.c: "Money and capital markets"
      ECO.13.d: "Financial sector regulation"
      ECO.13.e: "Deposit money banks and money creation"
      ECO.13.f: "Monetary policy and its instruments"
      ECO.13.g: "Challenges facing financial institutions in Nigeria"
  ECO.14:
    name: Public Finance
    subtopics:
      ECO.14.a: "Meaning and objectives of public finance"
      ECO.14.b: "Fiscal policy and its instruments"
      ECO.14.c: "Sources of government revenue"
      ECO.14.d: "Principles of taxation"
      ECO.14.e: "Tax incidence and its effects"
      ECO.14.f: "Effects of public expenditure"
      ECO.14.g: "Government budget and public debt"
      ECO.14.h: "Revenue allocation and resource control in Nigeria"
  ECO.15:
    name: Economic Growth and Development
    subtopics:
      ECO.15.a: "Meaning and scope"
      ECO.15.b: "Indicators of growth and development"
      ECO.15.c: "Factors affecting growth and development"
      ECO.15.d: "Problems of development in Nigeria"
      ECO.15.e: "Development planning in Nigeria"
  ECO.16:
    name: Agriculture in Nigeria
    subtopics:
      ECO.16.a: "Types and features of agriculture"
      ECO.16.b: "Agriculture and economic development"
      ECO.16.c: "Problems of agriculture"
      ECO.16.d: "Agricultural policies and their effects"
      ECO.16.e: "Instability in agricultural incomes"
  ECO.17:
    name: Industry and Industrialization
    subtopics:
      ECO.17.a: "Location and localization of industry"
      ECO.17.b: "Strategies of industrialization in Nigeria"
      ECO.17.c: "Industrialization and economic development"
      ECO.17.d: "Funding and management of business organizations"
      ECO.17.e: "Factors determining the size of firms"
  ECO.18:
    name: Natural Resources and the Nigerian Economy
    subtopics:
      ECO.18.a: "Development of major natural resources"
      ECO.18.b: "Oil and non-oil sectors"
      ECO.18.c: "Linkage effects"
      ECO.18.d: "Upstream and downstream of the oil sector"
      ECO.18.e: "NNPC and OPEC in the oil sector"
      ECO.18.f: "Challenges of natural resource exploitation"
  ECO.19:
    name: Business Organizations
    subtopics:
      ECO.19.a: "Sole proprietorship, partnership, companies and co-operatives"
      ECO.19.b: "Problems of private enterprises"
      ECO.19.c: "Public enterprises and their problems"
      ECO.19.d: "Funding and management of business organizations"
      ECO.19.e: "Factors determining the size of firms"
      ECO.19.f: "Privatization and commercialization"
  ECO.20:
    name: Population
    subtopics:
      ECO.20.a: "Meaning and theories of population"
      ECO.20.b: "Census: importance and problems"
      ECO.20.c: "Over-, under- and optimum population"
      ECO.20.d: "Structure and distribution of population"
      ECO.20.e: "Population policy and economic development"
  ECO.21:
    name: International Trade
    subtopics:
      ECO.21.a: "Basis for international trade: absolute and comparative cost"
      ECO.21.b: "Balance of trade and balance of payments"
      ECO.21.c: "Composition and direction of Nigeria's foreign trade"
      ECO.21.d: "Exchange rates"
  ECO.22:
    name: International Economic Organizations
    subtopics:
      ECO.22.a: "ECOWAS, AU, EU, ECA, IMF, World Bank, WTO, ADB, UNCTAD and Nigeria"
  ECO.23:
    name: Factors of Production and their Theories
    subtopics:
      ECO.23.a: "Types, features and rewards of the factors of production"
      ECO.23.b: "Determination of wages, interest and profits"
      ECO.23.c: "Marginal productivity and liquidity preference theories"
      ECO.23.d: "Factor mobility and efficiency"
      ECO.23.e: "Unemployment and its solutions"
