<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="The moon waxing from a thin crescent to full, then waning back to a thin crescent"><g data-part="wax"><path d="M22 38Q34 50 22 62Q40 60 40 50Q40 40 22 38Z" fill="#fde047" fill-opacity="0.55" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 72Q38 72 48 72" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M43.6 69.7L48 72L43.6 74.3" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="94" font-family="Caveat, cursive" font-size="17" font-weight="700" fill="#1d1b3a" text-anchor="middle">wax</text><text x="30" y="110" font-family="Caveat, cursive" font-size="14" fill="#1d1b3a" text-anchor="middle">grows</text></g><g data-part="full"><g data-anim="pulse" data-origin="60 50"><circle cx="60" cy="50" r="13" fill="#fde047" fill-opacity="0.6" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g data-part="wane"><path d="M98 38Q86 50 98 62Q80 60 80 50Q80 40 98 38Z" fill="#fde047" fill-opacity="0.55" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M72 72Q82 72 92 72" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M87.6 69.7L92 72L87.6 74.3" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="94" font-family="Caveat, cursive" font-size="17" font-weight="700" fill="#1d1b3a" text-anchor="middle">wane</text><text x="90" y="110" font-family="Caveat, cursive" font-size="14" fill="#1d1b3a" text-anchor="middle">shrinks</text></g></svg>
