# UTME 2010 Use of English — worked explanations. Answers worked out from the passages and stems,
# not copied from the printed key; key_disagrees marks every place the printed key differs.
# Item 1 (paper type) has no explanation: it is not a test item.
format_version: 1
exam_year: 2010
subject: ENGLISH
explanations:
  2:
    answer: A
    key_disagrees: 'D'
    steps:
      - 'Look for what the writer singles out as special about Spaceship Earth: “Now there is one outstanding important fact regarding Spaceship Earth, and this is that no instruction book came with it.”'
      - 'He even says “it is very significant that there is no instruction book”. So the striking thing is that it has no instruction manual.'
      - 'D (easy to operate) and B (not difficult to maintain) are never said; the passage suggests the opposite, since man had to learn by trial. C is not what the passage says either: it compares the ship with an automobile, it does not call it “peculiar to” one.'
    hint: 'Find the sentence where the writer calls something “one outstanding important fact”.'
  3:
    answer: C
    steps:
      - 'The passage says the missing manual “forced us to find out” which mangoes were safe, and “forced man to discover retrospectively just what his most important capabilities are”.'
      - 'Being forced to find out and discover is having your curiosity (inquisitiveness) challenged. So C fits.'
      - 'A and D sound likely but are not what the writer says: man is helpless at birth for other reasons, and the writer says we are learning how to survive, not that operation became impossible. B (travelling in spacecraft) takes “Spaceship Earth” literally.'
    hint: 'What did the missing manual “force” man to do?'
  4:
    answer: D
    steps:
      - 'The writer says man “is meant to discover some of the physical principles inherent in the universe … which will further multiply his knowledge”, and that this is “part of ‘invention’”, that is, part of his design.'
      - 'So by his very nature man keeps searching for knowledge: option D.'
      - 'A is tempting because of the “experimental procedures”, but the passage never mentions education; the whole point is that no instruction was given. B is wrong because the discovery was deliberate, and C is never said.'
    hint: 'The writer says man is “meant to” do something. What?'
  5:
    answer: C
    key_disagrees: 'A'
    steps:
      - 'Mood is the feeling behind the writing. The writer treats the missing manual as “deliberate and purposeful”, says a “big safety factor” was designed in, and ends with man learning to “generalize fundamental principles”.'
      - '“We are learning how we can safely survive on the planet” is a hopeful line. That is optimism (C).'
      - 'Non-committal (A) means refusing to take a side, but the writer clearly takes a view. Pessimism (B) and frustration (D) do not match his cheerful tone.'
    hint: 'Does the writer sound hopeful or gloomy about man’s chances?'
  6:
    answer: D
    key_disagrees: 'A'
    steps:
      - 'To “relate to” something is to recognise it from your own life. “An issue everyone can relate to” from experience means everyone has met it.'
      - 'The line before backs this up: stress causes most visits to doctors and is “the problem that every doctor shares with patients”. So: everybody encounters it (D).'
      - 'A adds a comparison (“better understood”) that the sentence does not make. B and C are not in the sentence at all.'
    hint: 'If “everyone can relate to” a problem, what has happened to everyone?'
    # Reviewer: the passage prints "experimentally" (surely "experientially"). A is arguable; D is the plainer paraphrase.
  7:
    answer: A
    key_disagrees: 'B'
    steps:
      - 'The passage says: “most of the stress people experience is self-generated”, and “we create the majority of our upset”.'
      - 'Self-generated means it comes from inside us, so stress is mostly caused by internal factors (A).'
      - 'B is wrong: relaxation reverses stress, but nowhere is it the “only” way to avoid it. D contradicts the effort the passage describes, and C is not stated.'
    hint: 'Find the word “self-generated”.'
  8:
    answer: A
    steps:
      - 'The “basic premise about stress reduction” is: “figure out what you are doing that is contributing to your problem and change it.”'
      - 'Those changes are in “behaviour, thinking, lifestyle choices”, which is changing your attitude to the things that stress you (A).'
      - 'D is tempting because exercise “drains off” stress energy, but that is a way of releasing stress, not the major step of getting to the root cause.'
    hint: 'Look for the phrase “basic premise about stress reduction”.'
  9:
    answer: D
    steps:
      - 'The experts say: “because we cause most of our own stress, we can do something about it.”'
      - 'We cause it ourselves, so it is individually initiated (D). That is the reason we can control it.'
      - 'A and B are general claims the passage does not make; C is close but the passage talks about what we cause, not how much outside factors contribute.'
    hint: 'The sentence begins “because we cause …”.'
  10:
    answer: B
    steps:
      - 'The passage stresses again and again that we make our own stress: “most of the stress people experience is self-generated”, “we create the majority of our upset”.'
      - 'So the deduction is that stress is a problem the individual brings on himself: individually induced (B).'
      - 'A is wrong: hormones carry the stress response, but stress is not called a disorder. D is tempting because the body reacts to things like a demanding boss, but the writer says those are only triggers and most stress comes from within.'
    hint: 'Where does the writer say most stress comes from?'
    # Reviewer: D can be argued from "stress is actually the body reaction to factors such as these"; B follows the passage's main argument.
  11:
    answer: D
    key_disagrees: 'A'
    steps:
      - 'The passage defines it: “Corruption occurs when a public official expects to be induced to perform an act which that public official is ordinarily required to do by law.”'
      - 'So what sets corruption off is the public officer’s expectation of a bribe: public officers (D).'
      - 'A is tempting because “affluent living habit” is mentioned first, but the writer calls that an indicator, a sign we use to measure corruption, not its trigger.'
    hint: 'Find the sentence that begins “Corruption occurs when …”.'
  12:
    answer: C
    steps:
      - 'The passage says: “Corruption can slow down development”, and “Corruption impoverishes countries”.'
      - 'To impede is to hold back, so “it impedes the progress of a nation” (C) says the same thing.'
      - 'A, B and D describe corruption as useful, which the passage never does; it says money is “wasted on white elephant projects”.'
    hint: 'What does corruption do to development, according to the passage?'
  13:
    answer: C
    steps:
      - 'The measures the writer names are government measures: “redesigning political and regulatory structures will reduce corruption”, and fighting corruption means “making government work better”.'
      - 'So the writer puts the job of preventing corruption on the government (C).'
      - 'D is tempting because the passage mentions “the involvement of the society at large”, but that is support for the measures, not who carries them out. B, corrupt officers, are the problem, and lawyers and police (A) are not mentioned.'
    hint: 'Who redesigns “political and regulatory structures”?'
    # Reviewer: D (the people) is arguable from "broad-based preventive measures, and the involvement of the society at large".
  14:
    answer: C
    steps:
      - 'The passage links a raised “ethical standard of governance” with good governance and the political, social and economic development of the people.'
      - 'Of the options, only democratic governance (C) is a form of good governance itself.'
      - 'B (instability) and D (bloated expenditure) are what corruption causes. A, human rights, is a good thing but it is a right people have, not a standard of how a country is governed.'
    hint: 'Which option is itself a kind of good government?'
  15:
    answer: B
    steps:
      - 'The passage joins the two ideas: “Fighting corruption and promoting governance is therefore crucial …”, and corruption “deprives their citizens of good governance”.'
      - 'So the point of fighting corruption is to promote good governance (B).'
      - 'C (punishing politicians) and A (jailing the corrupt) are never mentioned; D (making people richer) is too narrow and not stated.'
    hint: 'Which phrase is paired with “fighting corruption” in the passage?'
  16:
    answer: B
    steps:
      - 'The gap refers back to drought: “the ___ is usually accompanied by a number of unpleasant developments.”'
      - 'Drought is a natural event, and a natural event that happens is a phenomenon (B).'
      - 'An ideology (A) is a set of beliefs and an idea (C) is a thought; neither brings unpleasant developments. A component (D) is a part of something.'
    hint: 'What kind of thing is a drought: a belief, a thought, a part, or an event?'
  17:
    answer: C
    steps:
      - 'The sentence says the developments “have ___ for all citizens, starting from the peasant farmers to the … governments”.'
      - 'The usual phrase is “have implications for”, meaning they affect or have consequences for people (C).'
      - 'Results and outcomes (B, D) are things that come from the developments, but we do not say developments “have outcomes for” citizens. Feedback (A) is a response to something.'
    hint: 'Which noun goes naturally in “have ___ for all citizens”?'
  18:
    answer: A
    steps:
      - 'The situations are “emergency and crises situations which, if not successfully ___ could result in social unrest.”'
      - 'You manage a crisis, meaning you handle it and keep it under control. “Successfully managed” fits (A).'
      - 'Examining, witnessing or studying a crisis (B, C, D) does not stop social unrest; you can look at a crisis without doing anything about it. Only handling it does.'
    hint: 'What do you have to do to a crisis to stop it causing unrest?'
  19:
    answer: B
    steps:
      - 'The sentence says the timing and spread of the rains “have become ___ of considerable anxiety”.'
      - 'The fixed phrase is “a subject of anxiety” (something people worry about), so B.'
      - '“Issues of anxiety” and “topics of anxiety” (C, D) are not the usual collocation, and “objects of anxiety” (A) is less natural here.'
    hint: 'Complete the fixed phrase “a ___ of concern” or “a ___ of anxiety”.'
  20:
    answer: A
    key_disagrees: 'B'
    steps:
      - 'The sentence says: “periodic reduction in normal ___ of rainfall in the country is not new.”'
      - 'We measure rainfall by its amount, so “a reduction in the normal amount of rainfall” (A) is the natural phrase.'
      - 'Supply (B) is used for things provided, like water supply or food supply, not for rain. Size (C) does not describe rain, and a flood (D) is the opposite of a drought.'
    hint: 'How do weather reports describe rainfall: its size, its supply, or its amount?'
  21:
    answer: D
    steps:
      - 'The sentence gives a cause: “Since large areas of the country are drought prone, the consequences are ___.”'
      - 'If an area is prone to drought, drought will keep coming, so its consequences cannot be avoided: they are inevitable (D).'
      - 'B (disastrous) is tempting, but “since … drought prone” is about how certain the consequences are, not how bad. A (effective) and C (evident) do not follow from “since”.'
    hint: 'What does being “prone” to something tell you about whether it will happen?'
  22:
    answer: A
    steps:
      - 'The sentence contrasts two kinds of measures: “One has to do with emergency measures and the other with ___ measures.”'
      - 'The opposite of emergency (sudden, one-off) is routine (regular, everyday). So A.'
      - 'Urgent (C) means the same as emergency, so it is no contrast. Organized (B) and delayed (D) are not the opposite of emergency.'
    hint: 'What is the opposite of an emergency measure?'
  23:
    answer: D
    steps:
      - 'The sentence: “there are bound to be other lasting and ___ consequences such as distress, sales of cattle …”.'
      - 'These consequences happen alongside the famine. Parallel means happening alongside, at the same time and in a similar way (D).'
      - 'Longitudinal (A) is a word for studies carried out over time, not for consequences. Objective (B) makes no sense here, and simultaneous (C) would need no “other … and” before it.'
    hint: 'Which word describes consequences that run alongside the main one?'
  24:
    answer: C
    steps:
      - 'The sentence: farmers should have easy access to inputs “under the relief ___.”'
      - 'A government programme that gives out help is a scheme, and “relief scheme” is the usual phrase (C).'
      - 'Action, process and plan (A, B, D) can describe what the government does, but you get inputs “under a scheme”, not under an action or a process.'
    hint: 'What do we call an organised government programme that people benefit “under”?'
  25:
    answer: D
    steps:
      - 'The sentence: “Emergency measures will be much more ___ if a mechanism is established to ensure adequate preparedness”.'
      - 'Being prepared makes measures work better, that is, more effective (D).'
      - 'Normal (A), correct (B) and idealistic (C) do not describe how well measures work.'
    hint: 'What does good preparation do to how well a measure works?'
  26:
    answer: B
    steps:
      - 'To view someone “with a jaundiced eye” is an idiom: to see them with suspicion or dislike, with an unfavourable view.'
      - 'So Mr. Iro takes an unfavourable position concerning his members (B).'
      - 'C takes “jaundiced” literally (jaundice is a sickness). A and D (forceful, hazy) do not carry the idea of dislike.'
    hint: 'A “jaundiced eye” is an idiom about how you judge people.'
  27:
    answer: B
    steps:
      - 'The sentence says the people have no interest in who their ruler is.'
      - 'B says exactly this: people are not concerned about who rules them.'
      - 'A, C and D change who is doing what: C and D make the rulers the ones not interested, and A says something about getting leaders they want.'
    hint: 'Keep “people” as the ones who are not interested.'
  28:
    answer: B
    steps:
      - 'To “steer a middle course” means to avoid going to either extreme.'
      - 'That is acting with moderation (B).'
      - 'A takes “middle” literally (getting midway). C and D (moving away, working very hard) have nothing to do with avoiding extremes.'
    hint: 'A “middle course” avoids what?'
  29:
    answer: A
    steps:
      - 'To “have an axe to grind with” someone is to have a grievance, a private quarrel or grudge against them.'
      - 'So “no axe to grind with his brothers” means he had no hatred or grudge against them (A).'
      - 'B and C take the axe literally. D (vested interest) is close to another sense of the idiom, but “with his brothers” points to a quarrel with them.'
    hint: 'This is an idiom, not a real axe. What does a person with “an axe to grind” with you feel?'
  30:
    answer: C
    steps:
      - 'To go “with your tail between your legs” is to go away ashamed after being beaten, like a dog that has lost a fight.'
      - 'So the footballers were ashamed because they had been defeated (C).'
      - 'A is the opposite. B brings in being despised, which is not in the idiom. D just repeats the words without explaining them.'
    hint: 'Think of how a beaten dog walks away.'
  31:
    answer: C
    steps:
      - 'To “talk your way out of” something is to use words to avoid doing it.'
      - 'The headmaster did not give the speech: he got himself out of a situation he did not want (C).'
      - 'A and B say he gave the speech, which is the opposite. D takes “way” literally.'
    hint: 'Did the headmaster give the speech or not?'
  32:
    answer: B
    steps:
      - 'To “cross the Rubicon” is to take a step that cannot be undone (from Julius Caesar crossing the river Rubicon).'
      - 'So we are irrevocably committed: there is no going back (B).'
      - 'D (perfectly committed) misses the key idea of no return. A and C have nothing to do with the idiom.'
    hint: 'Can you go back once you have crossed the Rubicon?'
  33:
    answer: A
    steps:
      - 'Someone “full of himself” thinks too highly of himself and talks about himself all the time.'
      - 'That is being conceited (A).'
      - 'B takes “full” literally; C and D (rich, careful) are unrelated.'
    hint: 'If someone is full of himself, what does he think of himself?'
  34:
    answer: A
    steps:
      - 'Debutants are people doing something for the first time. “Were up … by three goals to nil” means they were leading, winning by three goals.'
      - 'A says both things: first time in the tournament, and they won three–nil.'
      - 'B (weakest side), C (without regulars) and D (best attackers) add information the sentence does not give.'
    hint: 'What is a “debutant”?'
  35:
    answer: A
    key_disagrees: 'C'
    steps:
      - '“Dead drunk” is an idiom meaning extremely, completely drunk. The husband was not dead.'
      - 'So she was sad because her husband was absolutely drunk (A).'
      - 'C adds “always”, which the sentence does not say. D takes “dead” literally, and B invents a worry about the future.'
    hint: 'Does “dead drunk” mean he died?'
  36:
    answer: D
    steps:
      - 'A mind-bending exercise is one so hard that it strains your mind: very difficult.'
      - 'The opposite is an easy one (D).'
      - 'A difficult (C) is the same meaning. Enervating and debilitating (A, B) mean weakening or tiring, which is close to the same side, not the opposite.'
    hint: 'Is a mind-bending exercise hard or simple?'
  37:
    answer: C
    steps:
      - 'A cut-throat rush is fierce and intense, with everyone struggling hard to get the goods.'
      - 'The opposite of fierce and intense is dull and without energy: lacklustre (C).'
      - 'Worrisome, strange and mad (A, B, D) do not mean dull or half-hearted.'
    hint: 'What is the opposite of a fierce, lively scramble?'
  38:
    answer: C
    steps:
      - 'Redundant details are ones that are not needed, extra.'
      - 'The exact opposite is necessary (C).'
      - 'Useful (D) is close but weaker: something can be useful without being needed. Unexplained and strange (A, B) are unrelated.'
    hint: 'Redundant means “not needed”. What is its opposite?'
  39:
    answer: B
    steps:
      - 'A myriad means a very great number, countless.'
      - 'The opposite is few (B).'
      - 'Many (D) is the same meaning; most and all (A, C) are also about large numbers.'
    hint: 'Myriad is about numbers. Large or small?'
  40:
    answer: C
    key_disagrees: 'D'
    steps:
      - 'Ingenuous means innocent, simple and without cunning: an open, trusting smile.'
      - 'The opposite is clever in the sense of crafty or cunning (C).'
      - 'Naïve (B) is a synonym. Arrogant (D) means proud, which is not the opposite of innocent. Witty (A) means amusing.'
    hint: 'Do not confuse ingenuous (innocent) with ingenious (clever).'
  41:
    answer: D
    steps:
      - 'Flawless means without any flaw, perfect.'
      - 'The opposite is imperfect (D).'
      - 'B (careless) describes the speaker’s attitude, not the speech having faults. A and C (wonderful, interesting) are on the same side as flawless.'
    hint: 'Flaw + less = without faults. What is the opposite?'
  42:
    answer: D
    key_disagrees: 'A'
    steps:
      - 'A gruff exterior is a rough, harsh, unfriendly manner. The sentence says underneath it he is kind.'
      - 'The opposite of gruff is gentle (D).'
      - 'Harsh and rough (B, C) mean the same as gruff. Nice (A) is a pleasant word but vague; gentle is the true opposite of a gruff manner or voice.'
    hint: 'Harsh and rough are the same as gruff. Which remaining word is its direct opposite?'
  43:
    answer: C
    steps:
      - 'To debase something is to lower its quality or value.'
      - 'The opposite is to raise it: elevated (C).'
      - 'Perverted (B) is close to the same meaning. Overvalued (D) is about price, and localized (A) is unrelated.'
    hint: 'Debase has “base” (low) in it. What is the opposite of lowering?'
  44:
    answer: A
    steps:
      - 'Straightforward means simple and easy to understand or do.'
      - 'The opposite is complicated (A).'
      - 'Troublesome and irksome (B, D) mean annoying; untoward (C) means unexpected and unfortunate. None is the opposite of simple.'
    hint: 'Straightforward means simple. What is its opposite?'
  45:
    answer: D
    steps:
      - 'Receptive means willing to listen to and accept new ideas.'
      - 'The opposite is hostile, strongly against them (D).'
      - 'Repellent (B) describes something that drives people away, not people who refuse ideas. Disobedient (A) is about orders; alert (C) is unrelated.'
    hint: 'How would a crowd behave if it rejected the suggestion?'
  46:
    answer: A
    steps:
      - 'Acquiescence means quietly accepting something without protest.'
      - 'The opposite is resistance (A).'
      - 'Agreement (D) is close to the same meaning. Compromise (C) and discrepancy (B) are not opposites of accepting.'
    hint: 'Acquiescence is quiet acceptance. What is the opposite of accepting?'
  47:
    answer: A
    steps:
      - 'Ambivalent means having mixed feelings, unable to decide.'
      - 'The opposite is decisive, sure of what one wants (A).'
      - 'Anxious (B) is a feeling, not the opposite of uncertain. Ambitious (C) sounds similar but means eager to succeed.'
    hint: 'Ambi- means “both ways”. What is the opposite of being pulled both ways?'
  48:
    answer: A
    steps:
      - 'A plethora is too much of something, a large excess.'
      - 'The opposite is a shortage (A).'
      - 'Multitude (C) is a synonym. Simplicity (B) and spectrum (D) are not about quantity.'
    hint: 'Plethora means “too many”. What is its opposite?'
  49:
    answer: B
    steps:
      - 'Heavy and sultry weather is hot, humid and oppressive, uncomfortable to be in.'
      - 'The opposite is cold (not hot) and friendly (pleasant, not oppressive): B.'
      - 'D is a synonym. C (cloudy and thundery) often goes with sultry weather. A (wintry and shadowy) is cold, but shadowy is not the opposite of oppressive.'
    hint: 'Take each half: what is the opposite of hot, and what is the opposite of oppressive?'
  50:
    answer: D
    steps:
      - 'Superfluous means more than is needed, unnecessary.'
      - 'The opposite is not enough: scanty (D).'
      - 'Redundant and unnecessary (A, C) are synonyms. Spurious (B) means false.'
    hint: 'Superfluous means “more than enough”. What means “not enough”?'
  51:
    answer: B
    key_disagrees: 'C'
    steps:
      - 'The word in italics is merrymaking: having fun and celebrating together.'
      - 'The nearest option is party (B), a celebration.'
      - 'Gridlock (C) means the same as impasse, the other hard word in the sentence, but impasse is not the word in italics. Manifesto and rally (A, D) are political words with a different meaning.'
    hint: 'Check which word is in italics before you choose.'
    # Reviewer: the printed key C matches "Impasse" (capitalised on the paper); the paper italicises "merrymaking", so B.
  52:
    answer: C
    key_disagrees: 'B'
    steps:
      - 'Enthusiastic means full of eager excitement and interest.'
      - 'Of the options, elated (very happy and excited) is closest (C).'
      - 'Agitated and nervous (B, D) are excited in a worried way; enthusiasm is a happy excitement. Bemused (A) means puzzled.'
    hint: 'Is enthusiasm a happy or a worried kind of excitement?'
  53:
    answer: D
    steps:
      - 'Absurd means silly and unreasonable, laughable.'
      - 'The nearest is ridiculous (D).'
      - 'Smart and sensible (B, C) are nearly opposites. Dirty (A) is unrelated.'
    hint: 'Absurd things make people laugh at them.'
  54:
    answer: B
    steps:
      - 'Tardy means late, slow to act.'
      - 'The nearest is slow (B).'
      - 'Quick (A) is the opposite. Exclusive and generous (C, D) are unrelated.'
    hint: 'A tardy student comes late.'
  55:
    answer: A
    steps:
      - 'A sumptuous meal is rich, splendid and costly.'
      - 'The nearest is expensive (A).'
      - 'Cheap and insipid (tasteless) (D, C) are opposites; foreign (B) is unrelated.'
    hint: 'Think of a grand wedding feast.'
  56:
    answer: D
    steps:
      - 'To crouch is to bend your body low, with knees bent.'
      - 'Crouched over the paper means bent over it (D).'
      - 'Wrote on, stood on and walked over (A, B, C) do not describe bending.'
    hint: 'Crouching is a position of the body.'
  57:
    answer: A
    steps:
      - 'A panacea is a remedy for every problem, a cure-all.'
      - 'The nearest is cure (A).'
      - 'Hope and foresight (B, C) are helpful but are not remedies. Trouble (D) is the opposite.'
    hint: 'A panacea solves the problem.'
  58:
    answer: A
    steps:
      - 'Retrenchment is cutting costs by laying off workers: workers lose their jobs.'
      - 'Victims of retrenchment are people thrown into unemployment (A).'
      - 'B plays on the letters “trench”. Suffering and penury (C, D) may follow, but they are not the meaning of the word.'
    hint: 'What happens to workers when a company retrenches?'
  59:
    answer: D
    key_disagrees: 'A'
    steps:
      - 'To speak offhand is to speak without preparation, on the spot.'
      - 'So he gave his speech unprepared (D).'
      - 'Calmly (A) describes his manner, not the lack of preparation. Unconcerned (C) is another sense of offhand (casual) but it describes a person, and here the word describes how the speech was given.'
    hint: 'An offhand answer is one given without thinking it over first.'
    # Reviewer: the printed key A (calmly) does not match any dictionary sense of "offhand".
  60:
    answer: D
    steps:
      - 'An assortment is a mixed collection of different kinds of things.'
      - 'The nearest is melange, a mixture (D).'
      - 'Homogeneity and sameness (B, C) are opposites. An avalanche (A) is a sudden large fall of snow.'
    hint: 'An assortment is a mix.'
  61:
    answer: D
    steps:
      - 'Astounded means extremely surprised, shocked.'
      - 'The nearest is astonished (D).'
      - 'Overwhelmed (B) is about being overcome by feeling, not surprise. Collected (A) means calm, the opposite. Embarrassed (C) is shame.'
    hint: 'Astounded is a strong kind of surprise.'
  62:
    answer: A
    steps:
      - 'Apposite means suitable, fitting, relevant to the matter.'
      - 'The nearest is appropriate (A).'
      - 'Adequate (D) means enough. Inconsequential (B) means unimportant, near the opposite. Emphatic (C) means forceful.'
    hint: 'Do not confuse apposite with opposite: apposite means fitting.'
  63:
    answer: C
    steps:
      - 'A blemish is a mark or flaw that spoils something.'
      - 'The nearest is fault (C).'
      - 'Problem (B) is wider and vaguer. Blessing (D) is unrelated, and struggle (A) is effort.'
    hint: 'A reputation without a blemish has no mark or flaw on it.'
  64:
    answer: C
    steps:
      - 'Eligible means meeting the conditions, allowed to be chosen.'
      - 'The nearest is qualified (C).'
      - 'Nominated and invited (A, B) are what happens after; you can be eligible without being nominated. Intelligent (D) is unrelated.'
    hint: 'Eligible describes whether you meet the requirements.'
  65:
    answer: D
    steps:
      - 'An abridged version of a book has been cut down to a shorter form.'
      - 'The nearest is a shortened version (D).'
      - 'An enlarged version (B) is the opposite. Outdated and illustrated (A, C) are unrelated.'
    hint: 'Abridged books are for reading quickly.'
  66:
    answer: C
    steps:
