    steps:
      - 'The writer says: “We lead, inspire and motivate people to strive and succeed. It is also important that we paint the full and true picture of life so that we can discourage vain pursuits.”'
      - 'The purpose stated is to “discourage vain pursuits”. Vain means empty or useless; a pursuit is a search. So: to prevent empty search — option D.'
      - 'Nothing in the passage mentions projecting individual contribution (A), selfless service (B) or making the world a home (C).'
    hint: 'Look for the words “so that we can…” near the lines about leading and motivating.'
