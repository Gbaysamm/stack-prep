# UTME 2011 Use of English — worked explanations, keyed on question number.
#
# Every answer was worked out from the passage or sentence, not copied from the key printed with
# the paper. All 100 are answered. The printed key is disagreed with on 13 items (2, 11, 12, 14,
# 15, 18, 33, 42, 65, 71, 85, 87, 88); each carries key_disagrees and says why in its steps.
# Items a reviewer should look at twice are marked with a comment.
format_version: 1
exam_year: 2011
subject: ENGLISH
explanations:
  1:
    answer: D
    steps:
