    hint: 'Look at the heading printed at the very top of the paper.'
  2:
    answer: C
    # Reviewer: printed key says B (contentious). The writer backs the claim with a chain of
    # evidence, which is what "logical" means; nothing in the passage presents it as disputed.
    key_disagrees: 'B'
    steps:
      - '“Posture” here means the writer’s stance: how he presents the claim that electricity from living cells is no new idea.'
      - 'Straight after the claim he gives proof in order: the shock from fish, Franklin and lightning, Galvani and animal muscles, the catfish and the eel.'
      - 'A claim supported step by step with evidence is logical. It is not contentious (arguable, controversial): the writer treats it as settled fact.'
      - 'Ineffectual (weak, useless) and unguarded (careless) do not fit such a careful, well-supported statement.'
    hint: 'Read what comes right after the statement. Does the writer argue about it, or prove it?'
  3:
    answer: B
    steps:
      - 'Test each option against the passage. The deciding line is: “Early bio cells were powered with sugar.”'
      - '“Early” means “at the beginning”, so B — bio cells at the beginning got their energy from sugar — is true.'
      - 'A is false: scientists felt the bio cell would produce power cheaply. C wrongly adds “fuel” as a separate early source. D is not what the passage says.'
    hint: 'Find the sentence that begins with “Early bio cells…”.'
  4:
    answer: B
    steps:
      - 'Look for the reason given for the bio cell’s value: “it will one day produce power cheaply … and … use materials that would otherwise be considered a waste.”'
      - '“Cheaply”, using waste materials, means energy without much spending — option B.'
      - 'C and D exaggerate with “all”: the passage mentions radio, signals to guide ships and lighting, not all machines or all ships. A reverses the idea: the cell changes fuel into electricity.'
    hint: 'Which word in the passage talks about cost?'
  5:
    answer: D
    steps:
      - 'The question is about the earliest experience of electricity in the passage.'
      - 'The passage says: “Man experienced the strange shock produced by some fish even before electricity was really discovered.”'
      - 'So the first encounter was with fish. Lightning (Franklin) and animal muscles (Galvani) came “then in time”, later; heart and brain came last of all.'
    hint: 'Look for the phrase “even before electricity was really discovered”.'
  6:
    answer: A
    steps:
      - 'The whole passage says bad thoughts will come, but we must not welcome them.'
      - 'Key line: “Vain thought will knock at the door but we must not open to them.” And at the end: “bad thought must fly out as swiftly as they moved in.”'
      - 'That is option A: evil thoughts may come, but it is good (a virtue) to keep them out.'
      - 'C says we can do nothing about them — the opposite of the writer’s view. B and D twist the images of vipers and birds.'
    hint: 'What does the writer say we must do when bad thoughts “knock at the door”?'
  7:
    answer: C
    steps:
      - 'The first paragraph says: “if they turn to be our enemies, they will be too many for us and will drag us down to ruin.”'
      - '“Too many” and “drag us down to ruin” (fatal consequences) are exactly the words of option C.'
      - 'A narrows it to “the evil man”, but the writer is warning everyone. B misuses the pendulum: the pendulum only shows how fast the mind moves.'
    hint: 'Find the words “too many” in the first paragraph.'
  8:
    answer: D
    steps:
      - 'The second paragraph asks about people who cannot help bad thoughts: “do they hate them or not?”'
      - 'The point is that bad thoughts rule only those who do not hate them — those who keep them and keep thinking about them.'
      - '“Treasure them and ruminate on them” (value them and keep chewing them over) is D.'
      - 'A contradicts the passage; B and C bring in laziness and thieves, which the paragraph does not discuss.'
    hint: 'The paragraph ends with a question: “do they hate them or not?” Who would not hate them?'
  9:
    answer: C
    steps:
      - 'Read the whole sentence: “Think of the devil, and he will appear, turn your thought toward evil and your hands will soon follow.”'
      - 'The second half explains the first: thinking about evil leads to doing evil. Thoughts left unchecked become deeds.'
      - 'That is C. D reads the proverb literally, about the devil himself; B says evil thoughts stay in the mind, which is the opposite of the point.'
    hint: 'Read on to the end of the sentence: what do “your hands” do?'
  10:
    answer: B
    steps:
      - 'This paragraph is about thinking evil over and over: “he who meditates upon evil, loves it, and is ripe to commit it.”'
      - 'The more we dwell on evil, the closer we come to doing it — that is, the more vile we become. Option B.'
      - 'A turns the image of “mire and dirt” into a real road. C is about people, not thoughts. D says no one can keep evil thoughts out, which the writer denies.'
    hint: 'What happens, says the writer, to a person who keeps meditating on evil?'
