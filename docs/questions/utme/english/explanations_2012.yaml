# UTME 2012 Use of English — worked explanations, one per question, answers worked out by hand.
# Where the printed key disagrees, `key_disagrees` holds the printed letter and the steps say why.
format_version: 1
exam_year: 2012
subject: ENGLISH
explanations:
  1:
    answer: D
    steps:
      - 'This item only checks that you know which paper you are writing. The heading of this paper says PAPER TYPE: YELLOW.'
      - 'So the paper type is Type Yellow. In the real exam, always read the type printed on your own paper and shade that one.'
    hint: 'Look at the heading printed at the very top of the paper.'
  2:
    answer: A
    steps:
      - 'The passage says: “Each ethnic group has its own religious traditions … Yet the various traditional religions have much in common.”'
      - 'So the religions are different (each group has its own), but they share features (a high god, lesser gods, spirits, ancestors). That is option A.'
      - 'B says “completely different”, and C and D say “the same” — the passage says neither.'
    hint: 'Find the sentence that begins with “Yet”. It tells you two things at once.'
  3:
    # Printed key C. The first paragraph as printed only says the unseen world exists "apart from the
    # natural world we see around us"; the judging and appeasing come in the second paragraph. Reviewer: check.
    answer: A
    key_disagrees: 'C'
    steps:
      - 'The first paragraph says Nigerians believe “there is an unseen supernatural world, apart from the natural world we see around us.”'
      - 'Two worlds existing side by side is what “co-exist” means, so A is the answer.'
      - 'The idea that the unseen beings watch and judge us (which makes C tempting) comes in the second paragraph, not the first. The question limits you to the first.'
    hint: 'Read only the first paragraph. What does it say about the two worlds?'
  4:
    answer: D
    steps:
      - 'Two things weakened traditional religion: in Hausa land it “has largely gone underground owing to the influence of Islam”, and in Igboland the oracles’ influence waned “with the coming of Christianity”.'
      - 'Islam and Christianity are both non-traditional religions, so D covers both.'
      - 'A and B each name only one of the two, and C (loss of interest) is not a cause the passage gives.'
    hint: 'The passage names two religions that weakened traditional religion. Which option covers both?'
  5:
    # Printed key B. Rituals (D) are mentioned, but for religion in general; divination is the element
    # the passage names as part of traditional religion. Mildly arguable.
    answer: B
    steps:
      - 'The passage says: “Divination … is an important element of traditional religion.” That is a statement about traditional religion as a whole.'
      - 'A and C are ruled out by the word “only”: the passage mentions prayers and sacrifices together.'
      - 'Rituals are mentioned early on, but for Nigerian religion in general, not as the common factor of traditional religions. So B is best.'
    hint: 'Look for the sentence that says “is an important element of traditional religion”.'
  6:
    answer: D
    steps:
      - 'The passage says “the few Nigerians that read concentrate on foreign books than indigenous productions”, and bookshops stock foreign books “because of higher demands for them”.'
      - 'So we can infer that Nigerians read mostly foreign books: D.'
      - 'A goes too far (“only”), and C says “alike”, which the passage contradicts.'
    hint: 'What do the few Nigerians who read concentrate on?'
  7:
    answer: B
    steps:
      - 'The bookshop manager said the shops “preferred to stock foreign books because of higher demands for them.”'
      - '“Higher demand” means more people want to buy them, so foreign books attract more buyers: B.'
      - 'Poor quality (D) is mentioned later about publishers, but it is not the reason the bookshop gives.'
    hint: 'Find what the general manager of the bookstore said.'
  8:
    answer: A
    steps:
      - 'Something “gripping” holds your attention tightly, the way a hand grips. “Profoundly” means deeply.'
      - 'So the book is deeply interesting and holds the reader’s attention: A.'
      - 'The other options talk about who reads it or acknowledges it, not what “gripping” means.'
    hint: 'Think of what your hand does when it grips something.'
  9:
    answer: B
    steps:
      - 'The lecturer says the library “stopped buying new books when the local currency devalued.”'
      - 'When a currency is devalued, money buys less. That is low purchasing power: B.'
      - 'Nothing is said about teaching aids, the quality of books or lack of time.'
    hint: 'Why did the library stop buying new books?'
  10:
    answer: C
    steps:
      - 'The passage opens: Nigerians hardly have time to read; “the reading culture in Nigeria is now at a low ebb.”'
      - 'Everything after — foreign books preferred, poor publishing, students living on handouts — supports that point. So C is the best title.'
      - 'A, B and D each name only one part of the passage.'
    hint: 'A title should cover the whole passage. What is the first big idea?'
  11:
    answer: B
    steps:
      - 'The writer argues against the saying “experience is the best teacher”, ending: “the saying … may not be justifiable after all.”'
      - 'A writer who examines an idea and finds fault with it is being critical: B.'
      - 'He is not neutral (objective, non-committal); he takes a clear side. And he argues with reasons, not feelings, so not emotional.'
    hint: 'Does the writer agree with the old saying, or find fault with it?'
  12:
    answer: D
    steps:
      - 'The writer says learning “through wisdom may even be a better and more convenient way” and “we should give more premium to learning by wisdom than by experience.”'
      - 'So wise thoughts are more desirable than experience: D.'
      - 'B and C say the opposite of the writer’s view.'
    hint: 'Which does the writer prefer: wisdom or experience?'
  13:
    answer: B
    steps:
      - 'The passage says: “Our life now is the sum total of our decisions and our future will be determined by our decision of today.”'
      - '“Sum total” = totality; our decisions come from our judgement. So B matches.'
      - 'A and C contradict the passage; D talks of past mistakes, but the passage says today’s decisions decide the future.'
    hint: 'Find the phrase “sum total”. What is our life the sum of?'
  14:
    # Printed key C. C twists "taking advantage of every learning opportunity" (said of discipline in the
    # next paragraph) into "choose the opportunity"; the sentence that uses "be disciplined to" gives D.
    answer: D
    key_disagrees: 'C'
    steps:
      - 'The passage uses the exact words: “We must therefore be disciplined to remain with our resolve to make a clean break with experience as our best teacher.”'
      - 'To make a clean break with experience as our teacher is to decide against making experience our teacher: D.'
      - 'C is close to a later line, but that line says we must take advantage of every opportunity, not choose one.'
    hint: 'Find the sentence that says “be disciplined to”. What must we remain with?'
  15:
    answer: A
    steps:
      - '“Wholehearted” means with all your heart, holding nothing back; “devotion” is steady commitment.'
      - 'Committing with all your heart means acting without doubt or hesitation: A.'
      - 'B, C and D bring in tension, pain and ease, which the phrase does not mention.'
    hint: 'What does it mean to do something “wholeheartedly”?'
  16:
    answer: B
    steps:
      - 'The paragraph tells us miscarriage is loss of a pregnancy before twenty-four weeks, and most happen early.'
      - '“In the first twelve weeks” is the natural phrase: B.'
      - '“Penultimate” means second to last, which makes no sense with “twelve weeks”, and “around” or “for” do not fit the grammar.'
    hint: 'Which phrase sounds right before “twelve weeks of pregnancy”?'
  17:
    answer: D
    steps:
      - 'The sentence goes on to describe vaginal bleeding, blood clots and pain — things a woman notices.'
      - 'A sign you notice of a condition is a symptom: D.'
      - 'Bleeding is not the cause of miscarriage, nor a type or a period of it.'
    hint: 'Is bleeding the reason for the miscarriage, or a sign of it?'
  18:
    answer: A
    steps:
      - 'The tissues are “not ___ identifiable” — you cannot easily tell what they are.'
      - '“Not clearly identifiable” means hard to recognise: A.'
      - '“Medically identifiable” is tempting, but the sentence is about what you may see yourself.'
    hint: 'Which word describes how easily you can recognise something?'
  19:
    answer: B
    steps:
      - 'In pregnancy, a woman has to pass urine more often than usual.'
      - '“More often” = more frequently: B.'
      - '“More painfully” or “more gradually” describe how, not how often.'
    hint: 'The word should describe how often.'
  20:
    answer: C
    steps:
      - 'There were no signs, so nobody knew about the miscarriage until the scan.'
      - 'A scan finds things out, so the miscarriage is only discovered in a routine scan: C.'
      - 'A scan cannot prevent, manage or stop anything.'
    hint: 'What does a scan do?'
  21:
    answer: D
    steps:
      - 'The egg and sperm combine at fertilization — the moment the father’s and mother’s genetic material join.'
      - 'So D. “Mating” is the act of the parents, and “incubation” is keeping something warm to develop.'
    hint: 'What is the name for the moment egg and sperm join?'
  22:
    answer: A
    steps:
      - '“Why this has ___” refers back to the problem that caused the miscarriage.'
      - 'A problem that has happened “has occurred”: A.'
    hint: 'Which verb means “happened”?'
  23:
    answer: D
    steps:
      - 'The body’s defence against disease is called the immune system.'
      - 'So D. “Immune response” is a real phrase too, but it is an action; “problems in the immune system” names the body system.'
    hint: 'Complete the fixed phrase “the immune ___” that names a body system.'
  24:
    answer: A
    steps:
      - 'The reason given is “because the quality of eggs deteriorates” with age — it gets worse.'
      - 'Worse eggs mean more risk, so the risk increases with age: A.'
    hint: 'If the eggs get worse with age, what happens to the risk?'
  25:
    answer: C
    steps:
      - 'The example given is “such as twins”.'
      - 'Twins are two babies in one pregnancy — a multiple pregnancy: C.'
    hint: 'What kind of pregnancy is a pregnancy with twins?'
  26:
    answer: C
    steps:
      - 'To “have a finger in every pie” means to be involved in everything around you.'
      - 'So hardworking students must not be involved in every activity. C (they do not take part in all activities) carries this.'
      - 'A goes too far: “no role in most activities” is not the idea — they just should not be in all of them.'
    hint: 'A pie is one activity. What does it mean to have a finger in every one?'
  27:
    answer: A
    steps:
      - 'The crest is the top of a wave. “Riding the crest” means enjoying great success or popularity.'
      - 'So the vice chancellor is enjoying the success of his administration: A.'
    hint: 'Picture a surfer on top of a wave.'
  28:
    answer: D
    steps:
      - '“Absolved” means declared free from blame or guilt.'
      - 'So the court declared her free from the charge: D. A (convicted) is the opposite.'
    hint: 'Absolve is the opposite of convict.'
  29:
    answer: C
    steps:
      - '“Throw your weight about” is an idiom: to behave in a bossy way, ordering people around.'
      - 'So the landlord gives orders to people: C. It has nothing to do with body weight (B) or exercise (A).'
    hint: 'This is an idiom — it is not about body weight.'
  30:
    answer: D
    steps:
      - '“Ought to have issued” means it was the right thing to do, but it was not done.'
      - 'So the company did not issue the one billion shares: D.'
    hint: '“I ought to have come” means I did not come.'
  31:
    answer: A
    steps:
      - '“He needn’t have played” means he did play, but it was not necessary.'
      - 'So he took part in the game in a position that was not needed or usual for him: A.'
      - 'D brings in someone’s wish; “need not have” is about necessity, not what someone wanted.'
    hint: '“You needn’t have bought it” — did the person buy it or not?'
  32:
    answer: C
    steps:
      - '“I wouldn’t have responded, if I were you” is advice given after the event: the listener did respond.'
      - 'So the respondent replied, although he ought not to have done so: C.'
    hint: 'Did the person respond or not? The speaker is commenting on something already done.'
  33:
    # Printed key D. "Feet of clay" means a hidden weakness or flaw; B (weak) carries it, D (shy) does not.
    answer: B
    key_disagrees: 'D'
    steps:
      - '“Feet of clay” is an idiom for a hidden weakness in a person who seems strong — like a statue with clay feet that can crumble.'
      - 'He could not speak out because of that weakness, so B (weak and cowardly) is closest.'
      - 'D (shy and timid) describes a personality, not a weakness that stops him standing up; A takes the words literally.'
    hint: 'What happens to a strong statue whose feet are made of clay?'
  34:
    answer: B
    steps:
      - 'A “golden opportunity” is an excellent chance. “Wasted” it means he did not use it.'
      - 'In a penalty shoot-out, that means he did not score: B. Nothing here is about a gold cup.'
    hint: '“Golden” here means excellent, not made of gold.'
  35:
    # Printed key B. "As far as Abu is concerned" means "in Abu's opinion"; B reads it as "all Abu is
    # concerned with", which changes the meaning. C keeps both parts.
    answer: C
    key_disagrees: 'B'
    steps:
      - '“As far as Abu is concerned” means “in Abu’s opinion”. “At the most” means not more than.'
      - 'C keeps both: in Abu’s estimation, Mero merits not more than fifty naira.'
      - 'B changes the first part into “all Abu is concerned with”, which means something else. A and D say “more”, the opposite of “at the most”.'
    hint: 'What does “as far as X is concerned” mean?'
  36:
    answer: D
    steps:
      - 'A boy who is “weak in class” does poorly in his studies.'
      - 'The opposite is a very bright pupil: a genius. D.'
      - 'A dunce is a synonym, and “expert” is about a skill, not class ability.'
    hint: 'What do we call a pupil who is extremely good in class?'
  37:
    answer: C
    steps:
      - '“Shocked” means deeply upset and surprised.'
      - 'The opposite is not bothered at all: unconcerned. C.'
      - 'Astonished, disconcerted and surprised are all close in meaning to shocked.'
    hint: 'Three options mean nearly the same as “shocked”. Find the odd one out.'
  38:
    answer: D
    steps:
      - '“Flexible” means willing to change or bend.'
      - 'The opposite is rigid: unwilling to bend. D.'
    hint: 'What is the opposite of something that bends easily?'
  39:
    answer: A
    steps:
      - '“Sober” here means calm and serious.'
      - 'The opposite of calm and serious is excited: A. “Serious” (B) is a synonym.'
    hint: '“Sober” describes a calm, serious look. What is the opposite of calm?'
  40:
    answer: B
    steps:
      - '“Efficiency” means doing work well, without waste.'
      - 'The opposite is incompetence: not being able to do the work well. B.'
    hint: 'What quality would get someone sacked instead of promoted?'
  41:
    answer: D
    steps:
      - '“Reticent” means quiet, not willing to say much.'
      - 'The opposite is “loquacious”: talking a lot. D.'
    hint: 'Reticent people keep their thoughts to themselves. What are people who talk a lot called?'
  42:
    answer: A
    steps:
      - '“Volatile” means likely to change suddenly and become violent or unstable.'
      - 'The opposite is calm: A.'
    hint: 'Volatile situations can explode at any time. What is the opposite?'
  43:
    answer: A
    steps:
      - '“Abrasive” means rough and rude in manner, like sandpaper.'
      - 'The opposite is gentle: A. “Rude” (B) is a synonym.'
    hint: 'Sandpaper is abrasive. What is the opposite of rough?'
  44:
    answer: B
    steps:
      - 'An “ad hoc” committee is set up for one purpose only, informally, and does not last.'
      - 'The opposite is a formal, standing arrangement: B. “Improvised” and “temporary” are close in meaning to ad hoc.'
    hint: '“Ad hoc” is an informal arrangement for one job. What is its opposite?'
  45:
    answer: A
    steps:
      - '“Infinitesimal” means extremely small.'
      - 'The opposite is large: A. “Small” (B) is a synonym.'
    hint: 'Infinitesimal means so small you can hardly see it.'
  46:
    answer: D
    steps:
      - '“Adduced” means put forward as evidence or reasons.'
      - 'The opposite of putting reasons forward is proving them wrong: refuted. D.'
      - '“Affirmed” and “mentioned” are close to adduced.'
    hint: 'Adduce means to give as evidence. What do you do when you prove evidence false?'
  47:
    # Printed key D. Neither C nor D is a neat opposite of "antidote" (remedy); D fits the sentence
    # "an obstacle to" (a hindrance to a solution), so D is the best available.
    answer: D
    steps:
      - 'An “antidote” is a remedy: something that cures or solves a problem.'
      - 'The opposite is something that blocks a solution: an obstacle. D.'
      - 'An answer (A) and a reply (B) are close to “solution”. An injury (C) is harm, but “an injury to ailments” makes no sense in the sentence.'
    hint: 'An antidote helps solve a problem. What stands in the way of a solution?'
  48:
    answer: B
    steps:
      - '“Callous” means unkind, not caring about other people’s feelings.'
      - 'The opposite is compassionate: caring and kind. B. “Wicked” (C) is close to callous.'
    hint: 'A callous person does not care about others’ pain.'
  49:
    answer: A
    steps:
      - '“Temporal” power is worldly power — political or civil, belonging to this life.'
      - 'The opposite is spiritual power: A. “Mundane” (B) means worldly, a synonym.'
    hint: 'Temporal power belongs to the world; which power belongs to the soul?'
  50:
    answer: A
    steps:
      - '“Hit-and-miss” means done carelessly, without a plan — sometimes it works, sometimes not.'
      - 'The opposite is systematic: done with a careful plan. A.'
    hint: 'Hit-and-miss means unplanned. What is the opposite?'
  51:
    answer: B
    steps:
      - 'To give someone “a taste of their own medicine” is to treat them as badly as they treated others.'
      - 'That is paying them back — being revenged on them: B.'
      - 'Placated means calmed down, and recompensed means rewarded — both the reverse.'
    hint: 'It means doing to them what they did to others.'
  52:
    answer: B
    steps:
      - 'A “derogatory” remark is insulting and disrespectful.'
      - '“Unsavoury” means unpleasant or offensive: B. “Complimentary” (A) is the opposite.'
    hint: 'A derogatory remark puts someone down.'
  53:
    answer: A
    steps:
      - '“Sovereignty” is the power to govern yourself without outside control.'
      - 'That is autonomy: self-rule. A.'
      - '“Kingdom” is tempting because a sovereign is a king, but the word here means independence.'
    hint: 'Sovereignty is about who controls you.'
  54:
    answer: B
    steps:
      - '“Virtuous” means morally good.'
      - 'The closest is “upright”: honest and moral. B. Devilish (C) is the opposite.'
    hint: 'Virtue is about goodness, not cleverness.'
  55:
    answer: B
    steps:
      - '“Typical of” means showing the usual qualities of someone.'
      - 'So the response is characteristic of a lazy teacher: B.'
      - '“Symptomatic” means “a sign of” a problem; it does not mean “usual for”.'
    hint: 'Typical behaviour is the behaviour you expect from that person.'
  56:
    answer: D
    steps:
      - '“Inveterate” describes a habit that has lasted a long time and is unlikely to change.'
      - 'That is a long-time and incorrigible (cannot be corrected) gambler: D.'
    hint: 'Inveterate is about a habit that is old and hard to break.'
  57:
    answer: A
    steps:
      - '“Petrified” means so frightened that you cannot move — as if turned to stone.'
      - 'So he was frightened: A. “Agitated” means restless, not terrified.'
    hint: 'Petr- means stone. Why would fear make someone stone-still?'
  58:
    answer: C
    steps:
      - '“Shimmers” means shines with a soft, wavering light — as a hot road does.'
      - 'So the road shines: C. “Beams” means shines strongly in rays, like a torch.'
    hint: 'Picture a tarred road on a hot afternoon.'
  59:
    answer: A
    steps:
      - '“Vulnerable to” means open to being harmed by something.'
      - 'The closest is “liable to”: likely to suffer from. A. Immune (C) is the opposite.'
    hint: 'Vulnerable to disease means likely to catch it.'
  60:
    answer: D
    steps:
      - '“Furtive” means secretive, as if trying not to be noticed.'
      - 'The closest is “sly”: secretive and cunning. D.'
    hint: 'A furtive glance is a quick, secret one.'
  61:
    # Printed key A. "Out of hand" means out of control or dismissed without thought; "off the cuff"
    # is the standard gloss of "extempore".
    answer: B
    key_disagrees: 'A'
    steps:
      - '“Extempore” means spoken without preparation.'
      - '“Off the cuff” means the same: said on the spot, unprepared. B.'
      - '“Out of hand” means out of control, or rejected at once without thinking — a different idea.'
    hint: 'Extempore means without preparation. Which idiom means that?'
  62:
    answer: A
    steps:
      - 'An “inkling” is a slight idea or a hint of something.'
      - 'The closest is “a possible idea”: A. A summary (C) is a full account, and “the right view” is too sure.'
    hint: 'An inkling is only a small hint of the truth.'
  63:
    # Printed key D. "Espouse" means to adopt or support a cause; "outline" is only to describe it.
    answer: C
    key_disagrees: 'D'
    steps:
      - 'To “espouse” a policy or cause is to adopt it and support it.'
      - 'So the ruling party supported the policies: C.'
      - '“Outlined” (D) only means described in brief — you can outline a policy you do not support.'
    hint: 'If a party espouses a policy, is it for it or against it?'
  64:
    answer: A
    steps:
      - '“Foreclose” means to rule out or shut off a possibility in advance.'
      - 'So we must not exclude reconciliation as the purpose: A.'
    hint: 'To foreclose a possibility is to close the door on it.'
  65:
    answer: B
    steps:
      - 'To “explode” a belief is to show that it is false.'
      - '“Debunked” means exposed as false: B. “Challenged” (A) is weaker — you can challenge a belief without proving it wrong.'
    hint: 'Exploding a belief destroys it completely.'
  66:
    answer: C
    steps:
      - 'To name the role in which someone is better, we use “as”: better as a singer.'
      - '“Like a singer” would mean he resembles a singer, and “as if” needs a clause after it. So C.'
    hint: 'Which word introduces a role: “He works ___ a teacher”?'
  67:
    answer: D
    steps:
      - 'Companies make vacancies known to the public by an advertisement.'
      - 'D. “Bulletin” would need “a” before it, and publicity is not the usual word for job notices.'
    hint: 'How do companies usually announce job vacancies?'
  68:
    # Printed key A. "Coast" is the precise verb for a vehicle moving without engine power, usually downhill.
    answer: B
    key_disagrees: 'A'
    steps:
      - 'The engine was off, and the car went down the hills on its own momentum.'
      - 'For a vehicle moving without engine power, the English verb is “coast”: he coasted down the hills. B.'
      - '“Glided” is used of birds and aircraft floating in the air. “Taxied” is what aeroplanes do on the ground.'
    hint: 'Which verb is used for a car moving downhill with the engine off?'
  69:
    answer: D
    steps:
      - 'The correct spelling is a-u-x-i-l-i-a-r-y: auxiliary, meaning helping or supporting.'
      - 'D. The others double the l or drop an i.'
    hint: 'One l, and an i before the -ary.'
  70:
    answer: A
    steps:
      - 'The sentence has only one idea: his success came with challenges. “Indeed” adds emphasis: his success, indeed, did not come without challenges. A.'
      - '“But” and “however” need an earlier idea to contrast with, and there is none. “In spite of it all” makes no sense here.'
    hint: 'You need a word that adds emphasis, not contrast.'
  71:
    # Printed key D. With the impersonal "one", English keeps "one" throughout, including in the tag.
    answer: A
    key_disagrees: 'D'
    steps:
      - 'When a sentence starts with the impersonal “one”, we keep using “one”: one should be careful how one behaves.'
      - 'The question tag also repeats the subject: shouldn’t one? So A (one/one).'
      - 'D mixes “one” with “he”; that switch is not standard.'
    hint: 'Once you start with “one”, stick with it.'
  72:
    answer: D
    steps:
      - 'The phrase is “first and foremost”, meaning most importantly. Fore- means in front, as in forehead.'
      - 'D is the only correct spelling.'
    hint: 'Think of “forehead”: the front.'
  73:
    answer: C
    steps:
      - '“About three times” means roughly three times.'
      - 'C. “Like three times” is slang, and “for about” wrongly adds “for” before a number of times.'
    hint: 'Which word means “roughly”?'
  74:
    # Printed key A. The idiom is "on the verge of".
    answer: B
    key_disagrees: 'A'
    steps:
      - 'The fixed expression is “on the verge of”, meaning very close to.'
      - 'So she was on the verge of tears: B. “At the verge” is not used.'
    hint: 'It is a fixed phrase: ___ the verge of, ___ the brink of.'
  75:
    answer: C
    steps:
      - 'The first half says everyone makes mistakes. So nobody is free from mistakes.'
      - '“Infallible” means never making mistakes: C.'
      - '“Imperfect” (B) is the reverse: everyone IS imperfect.'
    hint: 'Which word means “never wrong”?'
  76:
    answer: B
    steps:
      - 'Adjectives before a noun follow an order: opinion/condition, then colour, then material.'
      - 'Discarded (condition), black (colour), earthen (material), then pot: B.'
    hint: 'Colour comes before material: a black wooden chair.'
  77:
    answer: B
    steps:
      - 'The main clause is “We stood up” — past tense, positive, subject “we”.'
      - 'The tag uses the helper “did”, made negative, with the same subject: didn’t we? B.'
    hint: 'Positive statement, negative tag, same subject and tense.'
  78:
    answer: D
    steps:
      - 'The correct spelling is “veterinary” (animal medicine).'
      - 'In British spelling, used in Nigeria, the l is doubled before -ed: unravelled. So D.'
    hint: 'Check both words: vet-er-in-ary, and double l in British spelling.'
  79:
    answer: A
    steps:
      - '“Clothes” are garments you wear: shirts, gowns, trousers. We say “some clothes”.'
