# UTME 2014 Use of English — worked explanations, written against retranscribed_2014.yaml.
#
# Every answer was worked out from the passage or sentence, not copied from the printed key.
# key_disagrees records the printed key wherever it differs. Reviewer notes are YAML comments.
# 21-35 are on the set novels and rest on the books themselves; see the comments there.
format_version: 1
exam_year: 2014
subject: ENGLISH
explanations:
  1:
    answer: C
    steps:
      - 'This is not a test of English: it checks you know which version of the paper you are holding.'
      - 'The top of this paper says PAPER TYPE: L, so the answer is Type L.'
    hint: 'Look at the top of the first page of the paper.'
  # 2: the printed key says C (invaluable). The passage says change "can either be positive or
  # negative", which rules out calling it invaluable; inevitable is the best-supported option.
  2:
    answer: D
    key_disagrees: 'C'
    steps:
      - 'The passage shows change happening everywhere: “the world is witnessing political and social changes” and they are “a collective response to the need to change”.'
      - '*Inevitable* means bound to happen, which is what the passage describes. *Invaluable* (extremely useful) cannot be right, because the passage says change “can either be positive or negative”.'
      - '*Inimitable* (impossible to copy) and *inestimable* (too great to measure) are never said about change at all.'
    hint: 'The passage says change can be good or bad. Which option does not claim change is always good?'
  3:
    answer: A
    steps:
      - 'The passage says political and social changes “may appear to be distinct phenomena” but “they are analytically inseparable”.'
      - 'Inseparable means bound together, which is *intertwined*. *Independent* is the exact opposite, and *antithetical* (opposed to each other) is not said either.'
    hint: 'Find the word the writer uses after “they are analytically …”.'
  4:
    answer: D
    steps:
      - 'A title must cover the whole passage. It is about both social and political change: what they are, why they happen, and how power changes hands.'
      - 'Only D names both social change and political power. A covers only the paragraph on reasons, B only the struggle for power, and C is just the title of the book it was taken from.'
    hint: 'The passage keeps pairing two kinds of change. Which title mentions both?'
  5:
    answer: C
    steps:
      - '*Alteration* means a change to something. The passage pairs it with “transformations”.'
      - 'A *modification* is a change, so C fits. Multiplication, recognition and complication are not kinds of change.'
    hint: 'Think of what a tailor does when he alters a dress.'
  6:
    answer: A
    steps:
      - 'The passage says there are “over two thousand five hundred species belonging to more than ten families” living everywhere from burrows to the ocean.'
      - '*Heterogeneous* means made up of many different kinds, so snakes are heterogeneous creatures. *Homogeneous* means all the same, the opposite.'
      - 'B and C are not supported: eating a cow is “uncommon”, and insects are never mentioned.'
    hint: 'Two thousand five hundred species in ten families: are they all alike or all different?'
  # 7: the printed key says A (abound in Gombe and Plateau). That is one detail in the last
  # sentence; most of the passage is about how rarely but how hugely snakes eat. C is the
  # best-supported answer.
  7:
    answer: C
    key_disagrees: 'A'
    steps:
      - 'The first two paragraphs are about how snakes eat: some “wait for months between successive meals” and a few eat “a large meal just once or twice a year”, swallowing prey “far larger than their own heads”.'
      - 'That is eating big but seldom, so C. Gombe and Plateau are mentioned once, at the very end, as a passing detail.'
      - 'B is a trap: the passage calls snakes versatile in where they live, not in reproduction.'
    hint: 'Which idea takes up most of the passage, not just one line?'
  8:
    answer: A
    steps:
      - 'The passage says “the only places without snakes are parts of the Polar Regions”. Of the four options, A is the only one the passage supports.'
      - 'B is false because they are found “on every continent except Antarctica”. D is false because snakes are not found there at all, not seldom. C is false because Ireland has no snakes.'
    hint: 'Check each option against the last paragraph.'
  # 9: the printed key says B. Nothing in the passage supports any option: it never mentions
  # ears, organs or measurement. B is false (snakes have no limbs, and organs are not visible);
  # D is contradicted ("uncommon"). A is the only option true of snakes. Flag for a person.
  9:
    answer: A
    key_disagrees: 'B'
    steps:
      - 'Test each option. D is contradicted: eating an antelope is called “uncommon”. B makes no sense: snakes have no legs, and internal organs are not visible. C is not a real idea.'
      - 'A is the only statement that is true of snakes: they have no outer ears, which is why they sense vibrations through the ground instead. It is the best of the four.'
    hint: 'Throw out every option that is false about snakes or that the passage contradicts.'
  10:
    answer: B
    steps:
      - 'The passage covers several features of snakes: cold blood, diet, jaws, number of species, and where they live.'
      - 'So the title that covers it all is “Some characteristics of snakes”. A covers only feeding, D only species and places, and C talks about legs, which the passage never mentions.'
    hint: 'Choose the title wide enough to cover every paragraph.'
  11:
    answer: C
    steps:
      - 'The gap is the person who “has to employ a lot of people”, and everyone else then works “with him”.'
      - 'The *proprietor* is the owner of the newspaper, who does the employing. A sub-editor and a lithographer are among the people he employs.'
    hint: 'Who owns a business and so hires its workers?'
  12:
    answer: B
    steps:
      - 'The words after the gap define it: people “who go out and collect stories and items of news”.'
      - 'That is what *reporters* do. Vendors sell the paper and agents handle business; neither gathers news.'
    hint: 'Read the clause after the gap: who collects news?'
  13:
    answer: A
    steps:
      - 'The gap is defined by “who specialize in one kind of topic”.'
      - 'A *correspondent* covers one area, such as a sports correspondent or a political correspondent. Newscasters read news on radio or TV, and listeners and distributors do not write at all.'
    hint: 'Think of the title given to a journalist who covers only sport or only politics.'
  14:
    answer: B
    steps:
      - 'The gap works closely with the editor-in-chief and “has to choose the most important stories”.'
      - 'That is the *news editor*. A proofreader checks spelling, a reporter gathers news, and an announcer belongs to radio.'
    hint: 'Who decides which news goes first?'
  15:
    answer: A
    steps:
      - 'The gap “go through stories sent to make necessary adjustments”: they correct and trim stories that others wrote.'
      - 'That is the job of *subeditors*. Writers produce stories in the first place, and producers belong to broadcasting.'
    hint: 'The verb is “go through”, not “write”. Who edits other people’s stories?'
  16:
    answer: C
    steps:
      - 'The sentence talks about a journalist who writes “daily or weekly in a particular column”.'
      - 'A journalist who writes a regular column is a *columnist*. A freelancer is someone not employed full time by one paper, which the sentence does not say.'
    hint: 'The word “column” is in the sentence. Build the answer from it.'
  17:
    answer: B
    steps:
      - '*Editorials* are the newspaper’s own opinion articles.'
      - 'They are coordinated by an *editorial board*, the group of senior editors. Readers and agents do not write editorials.'
    hint: 'Editorials are handled by a group with a name that matches.'
  18:
    answer: C
    steps:
      - 'The publisher establishes something that “would be on sale weekly, fortnightly or monthly”.'
      - 'A *magazine* comes out weekly or monthly and is sold on its own. An article and a column are parts of a paper, not things put on sale.'
    hint: 'What publication is sold every week or every month?'
  # 19: the printed key says A (a contrast from). The idiom is "a contrast to" (or "in contrast to").
  19:
    answer: C
    key_disagrees: 'A'
    steps:
      - 'The magazine is set against the daily papers’ “screaming headlines”, so the gap needs a contrast phrase.'
      - 'The correct preposition with contrast is *to*: “a contrast to” (or “in contrast to”). We never say “a contrast from”, “a contrast for”, or “a contrast in” something in this sense.'
    hint: 'Say it aloud: “as a contrast ___ the headlines”. Which small word sounds right?'
  20:
    answer: D
    steps:
      - 'The newspapers are “on sale everyday from the ___”: the gap names the people who sell them.'
      - '*Salesmen* (newspaper vendors) sell them. Readers buy them, pressmen print them, and distributors deliver them to the sellers.'
    hint: 'You buy a paper from someone. Who?'
