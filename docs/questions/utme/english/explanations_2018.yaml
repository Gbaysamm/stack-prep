  2:
    answer: B
    steps:
      - 'The master''s three questions were about the mosquito (deadly here, harmless in Britain), snakes (deadly here, none poisonous in Britain) and sickle cell (only in black people).'
      - 'A, C and D are those three arguments.'
      - 'B says there is malaria in Britain too, which is the opposite of his argument, so he never used it.'
    hint: 'List the master''s three questions. Which option is not one of them?'
  3:
    answer: B
    steps:
      - 'To “rock the boat” is to disturb a calm situation. The boy did not rock a real boat.'
      - 'Describing one thing as if it were another, without “like” or “as”, is a metaphor: B.'
      - 'A simile needs “like” or “as”; personification gives human qualities to things; hyperbole is exaggeration.'
    hint: 'Is there a “like” or “as” in the phrase?'
  4:
    answer: D
    steps:
      - 'The boy answered each point: sickle cell (white people have it), the mosquito (deadly elsewhere too), snakes (deadly in America too).'
      - 'Then he added something new: “I know many white men ... who would prefer our brilliant sunshine to their horribly cold winter.”'
      - 'That extra point is D. B is one of his counter-arguments, not the extra one; A and C are not said.'
    hint: 'What did the boy say last, just before he sat down?'
  5:
    answer: A
    steps:
      - 'The master answered only with “a burning look”, then walked out “without as much as saying a single word”.'
      - 'And “never again did he dwell on the issue”. He had no reply because the boy''s points were valid: A.'
      - 'B contradicts his silence; C is not what he did; D does not explain why he stopped talking about it afterwards.'
    hint: 'What happened to the master''s theory after that day?'
  6:
    answer: A
    steps:
      - '“... the poor boy, who had no answer to this new battle.” The clause begins with “who” and describes “the poor boy”.'
      - 'A clause beginning with who/which that describes a noun is a relative clause; the comma before it shows it only adds extra information, so it is non-defining: A.'
      - 'It is also a kind of subordinate clause (C), but “relative clause” names it exactly. It does not tell how, when or why (B), and it cannot stand alone (D).'
    hint: 'Which word does the clause describe, and which word introduces it?'
  7:
    answer: B
    steps:
      - '“Many virus and ___ diseases” — the gap pairs with “virus”, another cause of disease.'
      - 'Diseases are caused by viruses and bacteria. So “virus and bacterial diseases”: B. (Tuberculosis is a bacterial disease.)'
      - '“Germ diseases” is not a term; dirty and mosquito do not name a type of germ in this pairing.'
    hint: 'Viruses and ___ are the two common germs that cause disease.'
  8:
    answer: A
    # Reviewer: medically the common cold is coryza; "catarrh" is the everyday Nigerian name for it, and the key agrees.
    steps:
      - 'The disease meant is “known also as the common cold”.'
      - 'In everyday speech, catarrh is the name for a cold: blocked nose, mucus. A.'
      - 'A runny nose and a headache are symptoms, not diseases; influenza is the flu, a different, more serious illness.'
    hint: 'Which option is a disease people call “a cold”, not just a symptom of it?'
  9:
    answer: A
    key_disagrees: 'B'
    steps:
      - 'The fixed name of the illness is “the common cold”.'
      - 'Common = found everywhere, ordinary. A.'
      - 'Sporadic means happening now and then; universal and regular are not part of the name.'
    hint: 'What do we call an ordinary cold that everyone gets?'
  10:
    answer: C
    steps:
      - '“Some ___ like measles and whooping cough still pose a great danger.” Measles and whooping cough are diseases passed from person to person.'
      - 'Such diseases are infections, and the plural verb “pose” needs a plural noun: C.'
      - 'Measles and whooping cough are not pains or traces, and whooping cough is not a fever.'
    hint: 'What general word covers diseases you catch from other people?'
  11:
    answer: A
    # Reviewer: D (signs) is close; "symptoms" is the usual word for what a disease shows.
    steps:
      - '“The ___ of measles are more easily diagnosed.” Doctors recognise a disease from what it shows in the patient.'
      - 'Those are its symptoms: A.'
      - 'Appearance and feels do not fit; “signs” is close, but the standard phrase is “the symptoms of measles”.'
    hint: 'What do we call the rash, fever and cough that tell a doctor which disease you have?'
  12:
    answer: A
    steps:
