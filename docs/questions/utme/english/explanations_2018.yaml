      - 'Recognising a disease from its symptoms = diagnosing it: A.'
      - 'Symptoms are not “treated”, “dealt with” or “handled” more easily; the disease is. We diagnose from symptoms.'
    hint: 'What does a doctor do with symptoms to name the disease?'
  13:
    answer: A
