# UTME 2010 Use of English — lessons for the board.
#
# Each lesson is a run of moments: what the teacher says, and the line written while it is said.
# Answers match explanations_2010.yaml. Item 1 (paper type) has no lesson: it is not a test item.
format_version: 1
exam_year: 2010
lessons:
  2:
    moments:
      - say: 'We want the exciting thing about Spaceship Earth, according to the writer.'
        write: 'Exciting thing about Spaceship Earth = ?'
      - say: 'Look for where the writer points at one special fact. He says there is “one outstanding important fact”.'
        write: '“one outstanding important fact regarding Spaceship Earth”'
        point:
          - {passage: true, kind: label, target: 'one outstanding important fact regarding Spaceship Earth', text: 'he points at ONE special fact'}
      - say: 'And the fact is this: no instruction book came with it.'
        write: '“no instruction book came with it”'
        point:
          - {line: 2, kind: highlight, text: 'the clue'}
          - {passage: true, kind: underline, target: 'no instruction book came with it', text: 'this is the fact → option A'}
      - say: 'He even adds that this is “very significant”. So that is what excites him.'
        write: '“it is very significant that there is no instruction book”'
        point:
          - {passage: true, kind: highlight, target: 'I think it is very significant', text: '“significant” = this is what excites him'}
      - say: 'Easy to operate or easy to maintain are never said. If anything, man had to learn the hard way.'
        write: 'easy to operate / maintain: not in the passage'
        point:
          - {line: 4, kind: strike, at: 'easy to operate / maintain'}
          - {passage: true, kind: label, target: 'So we were forced', text: 'forced to experiment: not easy → B, D invented'}
          - {passage: true, kind: strike, target: 'just as an automobile', text: 'only a comparison → C misreads it'}
      - say: 'So the answer is that it has no instruction manual, which is answer choice A.'
        write: 'A · has no instruction manual'
        point:
          - {line: 2, kind: arrow, text: 'the clue'}
          - {passage: true, kind: circle, target: 'an instruction book was omitted', text: 'omitted = has no manual → A'}
        answer: true
    traps:
      B: 'You went for “not difficult to maintain”. The writer compares the ship to a car you must look after, but he never says looking after it is easy.'
      C: 'You went for “peculiar to other automobiles”. The writer compares Spaceship Earth with a car, but the special fact he picks out is the missing instruction book.'
      D: 'You went for “relatively easy to operate”. Nothing in the passage says this. Man had to experiment to survive, which is not easy at all.'

  3:
    moments:
      - say: 'What did the missing instruction manual do to man?'
        write: 'No manual → ?'
      - say: 'The passage says the lack of instruction “forced us to find out” which mangoes were safe.'
        write: '“Lack of instruction has forces us to find out …”'
        doodle: {name: 'custom:2010_q03_a', caption: 'which mango is safe? find out!'}
        point:
          - {line: 1, kind: highlight, at: 'forces us to find out', text: 'the clue'}
          - {passage: true, kind: label, target: 'two kinds of mangoes', text: 'man had to find out which mango is safe'}
      - say: 'And later: it “forced man to discover” his own capabilities.'
        write: '“forced man to discover retrospectively …”'
        point:
          - {passage: true, kind: label, target: 'forced man to discover retrospectively', text: 'second place: forced to discover'}
      - say: 'Being forced to find out and discover means your curiosity is being tested. Curiosity is inquisitiveness.'
        write: 'find out, discover = inquisitiveness challenged'
        point:
          - {line: 3, kind: underline, at: 'inquisitiveness challenged'}
          - {passage: true, kind: circle, target: 'devise scientific experimental procedures', text: 'experimenting = curiosity at work'}
      - say: 'The writer does not say the ship became hard to run, or that man became helpless because of it.'
        write: 'difficult? helpless? not caused by the missing manual'
        point:
          - {passage: true, kind: strike, target: 'all living being are utterly helpless at the moment of birth', text: 'helpless from birth, not from the manual → D'}
          - {passage: true, kind: label, target: 'we are learning how we can safely survive', text: 'the ship still works → A wrong'}
      - say: 'So the missing manual challenged man’s inquisitiveness, which is answer choice C.'
        write: 'C · challenged man’s inquisitiveness'
        answer: true
        point:
          - {line: 5, kind: highlight, at: 'challenged man’s inquisitiveness', to: {passage: true, target: 'forces us to find out'}}
    traps:
      A: 'You went for “made the operation difficult”. That sounds sensible, but the writer’s point is that man learned how to survive, not that the ship stopped working.'
      B: 'You went for “other means of travelling in spacecraft”. Spaceship Earth is our planet; it is a picture, not a real spacecraft.'
      D: 'You went for “made man helpless”. The passage says all living beings are helpless at birth, which has nothing to do with the manual.'

  4:
    moments:
      - say: 'We have to deduce something about man from the whole passage.'
        write: 'Man, by deduction = ?'
      - say: 'The writer says man “is meant to discover” the principles of the universe, which “will further multiply his knowledge”.'
        write: '“he is meant to discover … multiply his knowledge”'
        point:
          - {line: 1, kind: highlight, at: 'meant to discover', text: 'the clue'}
          - {passage: true, kind: label, target: 'which will further multiply his knowledge', text: 'his knowledge keeps growing'}
      - say: 'And it is “part of invention”, part of how man was designed. So this is his nature.'
        write: '“part of ‘invention’” = part of his nature'
        point:
          - {passage: true, kind: label, target: 'part of ‘invention’', text: 'built into man = his nature'}
      - say: 'Man keeps discovering, keeps learning. That is a constant search for knowledge.'
        write: 'always discovering = constant search for knowledge'
        point:
          - {line: 3, kind: box, at: 'constant search for knowledge'}
          - {passage: true, kind: underline, target: 'he is meant to discover', text: 'always discovering → constant search'}
      - say: 'Experiment is in the passage, but education is not: nobody gave man instructions.'
        write: 'education? no instruction was given'
        point:
          - {passage: true, kind: circle, target: 'experimental procedures', text: 'experiment: yes'}
          - {passage: true, kind: label, target: 'It must be taken as deliberate and purposeful', text: 'on purpose, not by chance → B wrong'}
          - {passage: true, kind: label, target: 'no instruction book came with it', text: 'no book, no teacher → no “education” (A)'}
      - say: 'So man by his nature is in constant search of knowledge, which is answer choice D.'
        write: 'D · by his nature … in constant search of knowledge'
        answer: true
        point:
          - {line: 5, kind: highlight, at: 'constant search of knowledge', to: {passage: true, target: 'meant to discover'}}
    traps:
      A: 'You went for “experiment and education”. Experiment is right, but education is not in the passage. The point is that there was no instruction book.'
      B: 'You went for “by chance and accidentally”. The writer says man is “meant to” discover, so it is by design, not by accident.'
      C: 'You went for “incapable of solving all his problems”. The passage never says this; it shows man learning to solve them.'

  5:
    moments:
      - say: 'Mood means the feeling behind the writing. Is the writer hopeful, gloomy, or neither?'
        write: 'Mood = the writer’s feeling'
      - say: 'He calls the missing manual “deliberate and purposeful”, not a disaster.'
        write: '“deliberate and purposeful”'
        point:
          - {line: 1, kind: highlight, text: 'hopeful'}
          - {passage: true, kind: label, target: 'deliberate and purposeful', text: 'calm: he sees a purpose, not a disaster'}
      - say: 'He says a “big safety factor” was designed into the earth.'
        write: '“a big safety factor”'
        point:
          - {passage: true, kind: label, target: 'a big safety factor', text: 'safety built in = hopeful'}
      - say: 'And he says we are learning how we can safely survive. That is a hopeful line.'
        write: '“we are learning how we can safely survive”'
        point:
          - {line: 3, kind: highlight, at: 'safely survive', text: 'hopeful'}
          - {passage: true, kind: underline, target: 'we are learning how we can safely survive', text: 'a hopeful ending to the story'}
      - say: 'Hopeful is the meaning of optimism.'
        write: 'hopeful = optimism'
        doodle: {name: 'custom:2010_q05_a', caption: 'hopeful = optimism'}
        point:
          - {passage: true, kind: label, target: 'going to be in trouble and fail to function', text: 'a warning about cars, not gloom → not B, D'}
      - say: 'So the writer’s mood is optimism, which is answer choice C.'
        write: 'C · optimism'
        answer: true
        point:
          - {passage: true, kind: circle, target: 'safely survive', text: 'hopeful → optimism (C)'}
    traps:
      A: 'You went for “non-committal”. Non-committal means not taking a side, but this writer clearly has a view: he thinks man will be fine.'
      B: 'You went for “pessimism”. A pessimist expects the worst, but this writer talks of safety and learning to survive.'
      D: 'You went for “frustration”. The writer is not annoyed about the missing manual; he sees purpose in it.'

  6:
    moments:
      - say: 'We need the meaning of “stress is an issue everybody can relate to”.'
        write: '“an issue everybody can relate to”'
        point:
          - {line: 0, kind: underline, at: 'relate to'}
          - {passage: true, kind: underline, target: 'stress is an issue everyone can relate to experimentally', text: 'the expression we are asked about'}
      - say: 'To relate to something is to recognise it from your own life.'
        write: 'relate to = know it from your own life'
        point:
          - {passage: true, kind: circle, target: 'relate to', text: 'relate to = you have met it yourself'}
      - say: 'The line before tells us stress is behind most visits to doctors, a problem “every doctor shares with patients”.'
        write: '“the problem that every doctor shares with patients”'
        point:
          - {passage: true, kind: label, target: 'every doctor shares with patients', text: 'even doctors have it → everyone'}
      - say: 'So everybody has met stress. Everybody encounters it.'
        write: 'everybody relates to it = everybody encounters it'
        point:
          - {line: 0, kind: arrow, text: 'meaning'}
          - {passage: true, kind: highlight, target: 'by far the most common cause of ill health', text: 'so common that everybody meets it'}
      - say: 'Nothing here says it is better understood one way than another.'
        write: '“better understood”? no comparison in the sentence'
        point:
          - {passage: true, kind: circle, target: 'experimentally', text: 'from experience; no “better” here → A adds a comparison'}
          - {passage: true, kind: label, target: 'we can derive personal as well as professional benefits', text: 'nothing about solving it → B invented'}
      - say: 'So the expression means everybody encounters it, which is answer choice D.'
        write: 'D · everybody encounters it'
        answer: true
        point:
          - {passage: true, kind: circle, target: 'everyone', text: 'everyone → everybody encounters it (D)'}
    traps:
      A: 'You went for “better understood when experienced”. It is close, but the sentence makes no comparison; it only says everyone has met stress.'
      B: 'You went for “its problem can be solved by everybody”. Relating to a problem is not the same as solving it.'
      C: 'You went for “everybody avoids it”. Relating to something means you have met it, not avoided it.'

  7:
    moments:
      - say: 'Which statement does the passage support? Let us test the one about causes first.'
        write: 'True according to the passage?'
      - say: 'The passage says: most of the stress people experience is self-generated.'
        write: '“most of the stress people experience is self-generated”'
        point:
          - {line: 1, kind: highlight, at: 'self-generated', text: 'the clue'}
          - {passage: true, kind: underline, target: 'most of the stress people experience is self-generated', text: 'this sentence answers it'}
      - say: 'Self-generated means it comes from inside us. Inside means internal.'
        write: 'self-generated = internal'
        doodle: {name: 'custom:2010_q07_a', caption: 'stress starts inside us'}
        point:
          - {line: 1, kind: arrow, text: 'meaning'}
          - {passage: true, kind: label, target: 'we create the majority of our upset', text: 'we make it ourselves = internal'}
      - say: 'Relaxation reverses stress, but the passage never says it is the only way.'
        write: '“only … during relaxation”? not said'
        point:
          - {line: 3, kind: strike, at: 'only during relaxation'}
          - {passage: true, kind: label, target: 'all the physiologic events in the stress reaction are reversed', text: 'relaxation reverses it; never “only” → B'}
      - say: 'And “no effort”? The passage says you must figure out what you do and change it. That is effort.'
        write: '“no effort”? you must change your behaviour'
        point:
          - {passage: true, kind: label, target: 'you have to figure out what you are doing', text: 'this takes effort → D wrong'}
          - {passage: true, kind: strike, target: 'should learn to handle his/hers first', text: 'handle yours first ≠ “better by the individual” → C'}
      - say: 'So stress is mostly caused by internal factors, which is answer choice A.'
        write: 'A · mostly caused by internal factors'
        answer: true
        point:
          - {passage: true, kind: circle, target: 'self-generated', text: 'self = inside = internal → A'}
    traps:
      B: 'You went for “only avoided during relaxation”. The relaxation response reverses stress, but the word “only” is not in the passage; exercise and changing behaviour help too.'
      C: 'You went for “better handled by the individual”. It sounds right, but the passage does not compare the individual with anyone else.'
      D: 'You went for “solved with no effort”. The passage says you must change your behaviour and thinking, which takes effort.'

  8:
    moments:
      - say: 'What is the major step in controlling stress? Look for the “basic premise about stress reduction”.'
        write: '“a basic premise about stress reduction”'
        point:
          - {passage: true, kind: label, target: 'This also leads to a basic premise about stress reduction', text: 'signpost: the main step comes next'}
      - say: 'Here it is: figure out what you are doing that adds to your problem, and change it.'
        write: '“figure out what you are doing … and change it”'
        point:
          - {line: 1, kind: highlight, text: 'the clue'}
          - {passage: true, kind: underline, target: 'figure out what you are doing that is contributing to your problem and change it', text: 'the major step'}
      - say: 'The changes are in behaviour, thinking and lifestyle. That is your attitude.'
        write: 'behaviour, thinking, lifestyle = attitude'
        point:
          - {passage: true, kind: circle, target: 'behaviour, thinking, lifestyle choices', text: 'these together = your attitude'}
      - say: 'Exercise helps drain off stress energy, but that is not the root.'
        write: 'exercise = drains energy, not the root cause'
        point:
          - {line: 3, kind: strike, at: 'exercise'}
          - {passage: true, kind: strike, target: 'nothing beats aerobic exercise', text: 'drains energy only, not the root → D'}
          - {passage: true, kind: label, target: 'visits to family doctors', text: 'a statistic, not a step → C'}
      - say: 'Getting to the root cause is the main step.'
        write: '“By getting to the root cause … prevent recurrences”'
        point:
          - {passage: true, kind: label, target: 'root cause', text: 'fix the cause = change your ways'}
      - say: 'So the major step is changing one’s attitude to stressors, which is answer choice A.'
        write: 'A · changing one’s attitude to stressors'
        answer: true
        point:
          - {line: 5, kind: highlight, at: 'changing one’s attitude to stressors', to: {passage: true, target: 'and change it'}}
    traps:
      B: 'You went for “understanding the history of disease”. The passage talks about the causes of stress, not the history of disease.'
      C: 'You went for “visiting family doctors”. Doctors are mentioned at the start, but only to show how common stress is.'
      D: 'You went for “constant exercise”. Exercise drains off stress energy, but the basic premise is to find what you are doing wrong and change it.'

  9:
    moments:
      - say: 'Why do the experts think we can control our stress? Look for the word “because”.'
        write: 'We can control stress because … ?'
      - say: 'Here: because we cause most of our own stress, we can do something about it.'
        write: '“because we cause most of our own stress”'
        point:
          - {line: 1, kind: highlight, at: 'we cause most of our own stress', text: 'the clue'}
          - {passage: true, kind: underline, target: 'we can do something about it', text: 'the result: we can control it'}
      - say: 'We cause it ourselves, each person on their own. That is individually initiated.'
        write: 'we cause it = individually initiated'
        point:
          - {line: 1, kind: arrow, text: 'meaning'}
          - {passage: true, kind: label, target: 'most of the stress people experience is self-generated', text: 'self-generated = individually initiated'}
      - say: 'The other options are not the reason the experts give.'
        write: 'understandable? easy? less external? not the reason'
        point:
          - {passage: true, kind: label, target: 'External stressors', text: 'outside causes exist, but not the reason → C'}
          - {passage: true, kind: strike, target: 'In studying and better understanding about stress', text: 'brings benefits; not the reason → A'}
      - say: 'So one can control stress because it is individually initiated, which is answer choice D.'
        write: 'D · it is individually initiated'
        answer: true
        point:
          - {passage: true, kind: circle, target: 'we cause most of our own stress', text: 'we start it ourselves → D'}
    traps:
      A: 'You went for “its causes are understandable”. The experts do not say this; they say we cause it ourselves.'
      B: 'You went for “it is not difficult to control”. The passage never says controlling stress is easy.'
      C: 'You went for “external factors contribute less stress”. Close, but the reason given is about what we cause, not about outside factors.'

  10:
    moments:
      - say: 'We have to deduce what stress is, from the whole passage.'
        write: 'Stress, by deduction = ?'
      - say: 'The writer says most stress is self-generated.'
        write: '“most of the stress people experience is self-generated”'
        point:
          - {line: 1, kind: highlight, at: 'self-generated', text: 'the clue'}
          - {passage: true, kind: underline, target: 'self-generated', text: 'clue 1: it comes from inside us'}
      - say: 'And again: we create the majority of our upset.'
        write: '“we create the majority of our upset”'
        point:
          - {passage: true, kind: label, target: 'we create the majority of our upset', text: 'clue 2: we make it'}
      - say: 'The boss and the traffic are only triggers. The stress itself comes from us.'
        write: 'boss, traffic = triggers only'
        point:
          - {passage: true, kind: strike, target: 'pressure at work, a demanding boss, a sick child or rush-hour traffic', text: 'only triggers → not D'}
          - {passage: true, kind: label, target: 'These may be triggers', text: 'outside things only set it off'}
      - say: 'Something we bring on ourselves is individually induced.'
        write: 'self-generated = individually induced'
        point:
          - {line: 1, kind: arrow, text: 'meaning'}
          - {line: 4, kind: highlight, at: 'self-generated = individually induced', to: {passage: true, target: 'self-generated'}}
      - say: 'So stress is individually induced problems, which is answer choice B.'
        write: 'B · individually induced problems'
        answer: true
        point:
          - {passage: true, kind: label, target: 'mediated be adrenaline and other stress hormones', text: 'hormones carry it; not a “disorder” → A'}
    traps:
      A: 'You went for “hormonal disorder”. Hormones carry the stress response, but the passage never calls stress a disorder.'
      C: 'You went for “bodily reaction to internal factors”. The passage’s example triggers are outside things, so this mixes two ideas.'
      D: 'You went for “bodily reaction to external factors”. The body does react to a boss or traffic, but the writer calls those triggers and says most stress comes from within.'

  11:
    moments:
      - say: 'What triggers corruption? Look for the sentence that says when corruption happens.'
        write: 'Corruption is triggered by … ?'
      - say: '“Corruption occurs when a public official expects to be induced” to do his duty.'
        write: '“Corruption occurs when a public official expects …”'
        point:
          - {line: 1, kind: highlight, at: 'a public official expects', text: 'the clue'}
          - {passage: true, kind: underline, target: 'Corruption occurs when a public official expects to be induced', text: '“occurs when” = what sets it off'}
      - say: 'Expecting to be induced means expecting a bribe for what he should do anyway.'
        write: 'induced = paid a bribe'
        point:
          - {passage: true, kind: circle, target: 'induced', text: 'induced = offered a bribe'}
      - say: 'So the one who sets it off is the public officer.'
        write: 'trigger = public officers'
        point:
          - {passage: true, kind: label, target: 'a public official', text: 'the one who starts it → public officer'}
      - say: 'Affluence is mentioned too, but as an indicator: a sign we use to measure corruption.'
        write: 'affluent living = indicator (a sign), not a trigger'
        point:
          - {line: 4, kind: strike, at: 'affluent living'}
          - {passage: true, kind: strike, target: 'affluent living habit of the public official', text: 'an indicator (a sign), not a trigger → A'}
          - {passage: true, kind: label, target: 'There are many indicators', text: 'indicators = ways to measure'}
      - say: 'So corruption is triggered off by public officers, which is answer choice D.'
        write: 'D · public officers'
        answer: true
        point:
          - {line: 5, kind: highlight, at: 'public officers', to: {passage: true, target: 'a public official expects'}}
    traps:
      A: 'You went for “unnecessary affluence”. The affluent living habit is named first, but as an indicator, a way to spot corruption, not what starts it.'
      B: 'You went for “selfish interest”. That may be true in life, but the passage does not say it.'
      C: 'You went for “private officials”. The passage speaks only of public officials.'

  12:
    moments:
      - say: 'What is one consequence of corruption, according to the passage?'
        write: 'Consequence of corruption = ?'
      - say: 'The passage says: corruption can slow down development.'
        write: '“Corruption can slow down development”'
        point:
          - {line: 1, kind: highlight, at: 'slow down development', text: 'the clue'}
          - {passage: true, kind: underline, target: 'Corruption can slow down development', text: 'a consequence, stated plainly'}
      - say: 'It also impoverishes countries and destabilizes economies.'
        write: '“Corruption impoverishes countries”'
        point:
          - {passage: true, kind: label, target: 'deprives their citizens of good governance', text: 'more harm, same direction'}
      - say: 'To impede is to hold back. Slowing down a nation’s development is impeding its progress.'
        write: 'impede = slow down, hold back'
        doodle: {name: 'custom:2010_q12_a', caption: 'impede = hold back'}
        point:
          - {line: 1, kind: arrow, text: 'same idea'}
          - {passage: true, kind: circle, target: 'slow down', text: 'slow down = impede'}
      - say: 'The other options make corruption sound useful. The passage never does that.'
        write: 'large projects? money to spend? not good results'
        point:
          - {passage: true, kind: strike, target: 'white elephant projects', text: 'wasted projects, not good ones → A'}
          - {passage: true, kind: label, target: 'Corruption impoverishes countries', text: 'makes people poorer → B, D wrong'}
      - say: 'So corruption impedes the progress of a nation, which is answer choice C.'
        write: 'C · it impedes the progress of a nation'
        answer: true
        point:
          - {line: 5, kind: highlight, at: 'it impedes the progress of a nation', to: {passage: true, target: 'Corruption can slow down development'}}
    traps:
      A: 'You went for “large projects are executed”. The passage says money is wasted on white elephant projects, useless ones; that is a loss, not a gain.'
      B: 'You went for “beneficial to wealthy people”. The passage never presents corruption as a benefit to anyone.'
      D: 'You went for “people get what they want”. The passage says corruption reduces the people’s quality of life.'

  13:
    moments:
      - say: 'Who should prevent corruption? Look at the measures the writer names.'
        write: 'Who should prevent corruption?'
      - say: 'He says: redesigning political and regulatory structures will reduce corruption.'
        write: '“redesigning political and regulatory structures”'
        point:
          - {line: 1, kind: highlight, text: 'the clue'}
          - {passage: true, kind: underline, target: 'redesigning political and regulatory structures will reduce corruption', text: 'the measure that stops it'}
      - say: 'Who redesigns a country’s political and regulatory structures? The government.'
        write: 'structures, regulation → the government'
        point:
          - {line: 1, kind: arrow, text: 'who does it'}
          - {passage: true, kind: label, target: 'political and regulatory structures', text: 'only government can redesign these'}
      - say: 'He also talks about making government work better.'
        write: '“making government work better”'
        point:
          - {passage: true, kind: label, target: 'improving the economy', text: 'the government’s job again'}
      - say: 'Society is to be involved, but the measures come from the government.'
        write: 'society = involved; government = acts'
        point:
          - {passage: true, kind: label, target: 'the involvement of the society at large', text: 'society helps, government acts → not D'}
          - {passage: true, kind: strike, target: 'Bribery, for example, is universally regarded as a crime', text: 'a crime, but no police or lawyers named → A'}
      - say: 'So the government should prevent corruption, which is answer choice C.'
        write: 'C · The government'
        answer: true
        point:
          - {line: 5, kind: highlight, at: 'The government', to: {passage: true, target: 'making government work better'}}
    traps:
      A: 'You went for “lawyers and police”. They are not mentioned in the passage at all.'
      B: 'You went for “corrupt public officers”. They are the cause of the problem, not the ones to stop it.'
      D: 'You went for “the people”. The passage wants society involved, but the measures it names, like redesigning structures, are the government’s work.'

  14:
    moments:
      - say: 'Which option shows an ethical standard of governance, a good and honest way of governing?'
        write: 'ethical governance = good, honest government'
      - say: 'The passage says raising this standard brings economic, political and social development.'
        write: '“Raising the ethical standard of governance …”'
        point:
          - {passage: true, kind: underline, target: 'Raising the ethical standard of governance can lead to many benefits', text: 'what ethical governance brings'}
      - say: 'And it links fighting corruption with good governance.'
        write: '“deprives their citizens of good governance”'
        point:
          - {passage: true, kind: circle, target: 'good governance', text: 'ethical governance = good governance'}
      - say: 'Instability and bloated spending are what corruption brings. Cross them out.'
        write: 'instability, bloated expenditure = corruption'
        point:
          - {line: 3, kind: strike, at: 'instability, bloated expenditure'}
