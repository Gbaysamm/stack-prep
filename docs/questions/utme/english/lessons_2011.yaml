# UTME 2011 Use of English — lessons for the board.
#
# Each lesson is a run of moments: what the teacher says, and the one short line written while
# it is said. Same shape as the Mathematics lessons, in plain text (no LaTeX). Answers match
# explanations_2011.yaml.
format_version: 1
exam_year: 2011
lessons:
  1:
    moments:
      - say: 'This first question is not about the passage. It asks which paper type you have been given.'
        write: 'Which paper type is yours?'
      - say: 'In JAMB, different candidates get different types, so the answer is on your own booklet, not in your head.'
        write: 'Look at your own booklet'
      - say: 'At the very top of this paper, the heading says Paper Type D.'
        write: 'Heading: PAPER TYPE: D'
        point:
          - {line: 2, kind: highlight, at: 'PAPER TYPE: D', text: 'the clue'}
      - say: 'So we choose the option that matches the heading, which is Type D.'
        write: 'Match the heading to an option'
      - say: 'The paper type here is Type D, which is answer choice D.'
        write: 'D · Type D'
        point:
          - {line: 2, kind: arrow, text: 'matches'}
        answer: true
    traps:
      A: 'You went for Type A. Many people pick A by habit, but the booklet heading says Type D. Always copy your own heading.'
      B: 'You went for Type B. Your neighbour may have Type B, but this booklet is headed Type D.'
      C: 'You went for Type C. Check the top of the paper: it says PAPER TYPE: D.'
  2:
    moments:
      - say: 'We are asked about the writer’s posture, that is his stance, when he says electricity from living cells is no new idea.'
        write: '“Electricity from living cells is no new idea”'
        point:
          - {passage: true, kind: label, target: 'Electricity from living cells is no new idea', text: 'the claim'}
      - say: 'To judge a stance, look at what the writer does right after the claim.'
        write: 'What follows the claim?'
      - say: 'He gives proof, one step after another. Man felt the shock of fish, Franklin found lightning was electricity, and Galvani found it in animal muscles.'
        write: 'fish shock → Franklin → Galvani → catfish, eel'
        point:
          - {passage: true, kind: label, target: 'the strange shock produce by some fish', text: 'proof 1'}
          - {passage: true, kind: label, target: 'Benjamin Franklin found that lightening in the sky was electricity', text: 'proof 2'}
          - {passage: true, kind: label, target: 'Luigi Galvani found some electricity', text: 'proof 3'}
      - say: 'A claim backed up step by step with evidence is a logical one.'
        write: 'claim + evidence = logical'
        point:
          - {line: 3, kind: box, text: 'the key'}
          - {passage: true, kind: label, target: 'Research works also discovered', text: 'more proof: claim backed step by step'}
          - {line: 3, kind: highlight, at: 'claim + evidence = logical'}
      - say: 'Contentious means likely to cause argument. The writer does not argue, because he proves it and moves on.'
        write: 'contentious = controversial (not here)'
        point:
          - {line: 4, kind: strike, at: 'contentious'}
          - {passage: true, kind: label, target: 'Then in time, there were other discoveries', text: 'a calm history, no quarrel → not contentious (B)'}
      - say: 'So the writer’s posture is logical, which is answer choice C.'
        write: 'C · logical'
        answer: true
        point:
          - {line: 5, kind: highlight, at: 'logical', to: {passage: true, target: 'Electricity from living cells is no new idea'}}
    traps:
      A: 'You went for ineffectual, which means weak or useless. The writer’s point is well supported with examples, so it is not ineffectual.'
      B: 'You went for contentious. That would mean the claim is disputed, but the writer treats it as settled and backs it with evidence.'
      D: 'You went for unguarded, which means careless or unplanned. The statement is careful and followed by proof.'
  3:
    moments:
      - say: 'Which statement is true according to the passage? Let’s test each option against the text.'
        write: 'Find the line that proves one option'
      - say: 'The passage says that early bio cells were powered with sugar.'
        write: '“Early bio cells were powered with sugar”'
        point:
          - {line: 1, kind: highlight, at: 'powered with sugar', text: 'the clue'}
          - {passage: true, kind: underline, target: 'Early bio cells were powered with sugar', text: 'this sentence answers it'}
      - say: 'Early means at the beginning. So at the beginning, bio cells got their energy from sugar.'
        write: 'early = at the beginning'
        point:
          - {passage: true, kind: circle, target: 'Early', text: 'early = at the beginning'}
          - {line: 2, kind: highlight, at: 'at the beginning'}
      - say: 'Option A says costly energy, but the passage says the bio cell will produce power cheaply.'
        write: 'A ✗ — passage says “cheaply”'
        point:
          - {line: 3, kind: strike}
          - {passage: true, kind: label, target: 'it will one day produce power cheaply', text: 'cheaply, not costly → A wrong'}
      - say: 'Option C adds fuel as a second early source. The passage names only sugar.'
        write: 'C ✗ — only sugar at first'
        point:
          - {passage: true, kind: circle, target: 'sugar', text: 'only sugar at first'}
          - {passage: true, kind: label, target: 'but a wide range of fuel can be used', text: 'other fuels came later → C wrong'}
      - say: 'So bio cells, at the beginning, derived their energy from sugar, which is answer choice B.'
        write: 'B · energy from sugar at the beginning'
        point:
          - {line: 1, kind: arrow}
        answer: true
    traps:
      A: 'You went for costly energy. The passage says the opposite: the bio cell will one day produce power cheaply.'
      C: 'You went for sugar and fuel. The passage says early bio cells used sugar; the wide range of fuels came later.'
      D: 'You went for “forms of power used by the scientists”. That is too vague and is not what the passage states.'
  4:
    moments:
      - say: 'Why is the bio cell worth having? Find the sentence about its future.'
        write: 'Why is the bio cell needed?'
      - say: 'The passage says it will one day produce power cheaply.'
        write: '“produce power cheaply”'
        point:
          - {line: 1, kind: highlight, text: 'the clue'}
          - {passage: true, kind: underline, target: 'produce power cheaply', text: 'reason 1: cheap'}
      - say: 'And it will use materials that would otherwise be considered a waste, so it is waste in, light out.'
        write: '“use materials … otherwise … a waste”'
        point:
          - {passage: true, kind: underline, target: 'use materials that would otherwise be consider a waste', text: 'reason 2: uses waste'}
      - say: 'Cheap power from waste means energy without much spending.'
        write: 'cheap + waste = little spending'
        point:
          - {line: 3, kind: highlight, at: 'cheap + waste = little spending', to: {passage: true, target: 'produce power cheaply'}}
          - {line: 3, kind: highlight, at: 'little spending'}
      - say: 'Be careful with options C and D, because the passage mentions some uses, not all machines or all ships.'
        write: 'C, D ✗ — “all” is too much'
        point:
          - {line: 4, kind: strike}
          - {passage: true, kind: strike, target: 'for radio, for signal to guide ship, for lighting and other uses', text: 'some uses, not “all” → C, D'}
          - {passage: true, kind: label, target: 'changed the fuel directly into electric energy', text: 'fuel → electricity; A turns it round'}
      - say: 'So it would yield a source of energy without much spending, which is answer choice B.'
        write: 'B · energy without much spending'
        point:
          - {line: 3, kind: arrow}
        answer: true
    traps:
      A: 'You went for changing bio cells into fuel. It is the other way round: the bio cell changes fuel into electricity.'
      C: 'You went for all types of machines. The passage lists radio, signals and lighting — not all machines.'
      D: 'You went for guiding all ships. Signals for ships are one use among several, and “all” is not in the passage.'
  5:
    moments:
      - say: 'Where did people first meet electricity, according to the passage?'
        write: 'Where was electricity first met?'
      - say: 'The key words are “even before electricity was really discovered”.'
        write: '“even before electricity was really discovered”'
        point:
          - {line: 1, kind: highlight, at: 'even before', text: 'the clue'}
          - {passage: true, kind: label, target: 'even before electricity was really discovered', text: 'this came first in time'}
      - say: 'Before that, man experienced the strange shock produced by some fish, which came first of all.'
        write: 'first: shock from fish'
        point:
          - {passage: true, kind: underline, target: 'Man experience the strange shock produce by some fish', text: 'first: fish'}
          - {line: 2, kind: highlight, at: 'shock from fish'}
      - say: 'Franklin’s lightning and Galvani’s animal muscles came later, which the passage calls “then in time”.'
        write: 'later: lightning, animal muscles'
        point:
          - {passage: true, kind: circle, target: 'Then in time', text: 'time words: these came after'}
          - {passage: true, kind: strike, target: 'Benjamin Franklin found that lightening in the sky was electricity', text: 'later → not C'}
          - {passage: true, kind: strike, target: 'Luigi Galvani found some electricity in the muscles and nerves of animals', text: 'later → not B'}
      - say: 'Heart and brain come at the very end of the passage.'
        write: 'last: heart and brain'
        point:
          - {passage: true, kind: strike, target: 'Our heart produces a very small amount', text: 'last of all → not A'}
      - say: 'So electricity was first discovered in fish, which is answer choice D.'
        write: 'D · fish'
        point:
          - {line: 2, kind: arrow, text: 'first'}
          - {passage: true, kind: circle, target: 'some fish', text: 'fish came first → D'}
        answer: true
    traps:
      A: 'You went for heart and brains. The passage mentions them last, as a recent research finding.'
      B: 'You went for muscles of animals. That was Galvani, who came “then in time”, after the fish.'
      C: 'You went for lightning. Franklin’s discovery was one of the later ones; the fish came first.'
  6:
    moments:
      - say: 'We want the writer’s main view in the whole passage about bad thoughts.'
        write: 'Writer’s view on evil thoughts?'
      - say: 'He admits bad thoughts will come, so vain thought will knock at the door.'
        write: '“Vain thought will knock at the door”'
        point:
          - {passage: true, kind: label, target: 'Vain thought will knock at the door', text: 'they WILL come'}
      - say: 'But he says we must not open to them. The door must stay shut.'
        write: '“but we must not open to them”'
        point:
          - {line: 2, kind: highlight, at: 'must not open', text: 'the clue'}
          - {passage: true, kind: underline, target: 'but we must not open to them', text: '“but”: keep them out'}
      - say: 'At the end, bad thought must fly out as swiftly as they moved in.'
        write: '“bad thought must fly out”'
        point:
          - {line: 3, kind: highlight, at: 'must fly out'}
          - {passage: true, kind: underline, target: 'bad thought must fly out as swiftly as they moved in', text: 'same view at the end'}
      - say: 'They are like birds over your head. They may come, but it is good to keep them out, and never let them nest.'
        write: 'they come + keep them out'
        point:
          - {passage: true, kind: label, target: 'they must not be allowed to reign', text: 'third time: they come, but must not rule'}
          - {line: 4, kind: highlight, at: 'keep them out'}
      - say: 'Evil thoughts may come but there is virtue in keeping them out, which is answer choice A.'
        write: 'A · may come, but keep them out'
        point:
          - {line: 4, kind: arrow}
          - {passage: true, kind: label, target: 'they sting like vipers', text: 'a picture of bad thoughts; no enemies → B'}
          - {passage: true, kind: strike, target: 'Like a clock with the pendulum in full swing', text: 'the pendulum is the mind’s speed → C misreads it'}
        answer: true
    traps:
      B: 'You went for vipers and enemies. The vipers are just a picture of how bad thoughts sting; the writer never ties them to enemies.'
      C: 'You went for “no matter what we do”. The writer says the opposite: we can refuse to open the door.'
      D: 'You went for birds flying without perching. The writer uses birds to say we can stop them from nesting — we have control.'
  7:
    moments:
      - say: 'Now just the first paragraph. What does it warn us about?'
        write: 'Paragraph 1 only'
      - say: 'It says that if our thoughts turn to be our enemies, they will be too many for us.'
        write: '“they will be too many for us”'
        point:
          - {line: 1, kind: highlight, at: 'too many for us', text: 'the clue'}
          - {passage: true, kind: label, target: 'if they turn to be our enemies', text: 'if thoughts go bad …'}
      - say: 'And they will drag us down to ruin, so they multiply and pull him down.'
        write: '“drag us down to ruin”'
        point:
          - {line: 2, kind: highlight, at: 'ruin'}
          - {passage: true, kind: underline, target: 'will drag us down to ruin', text: '… they ruin us'}
      - say: 'Ruin is a fatal consequence. Too many plus ruin gives us option C.'
        write: 'too many + ruin = fatal consequences'
        point:
          - {passage: true, kind: label, target: 'they will be too many for us', text: 'too many + ruin → C'}
          - {line: 3, kind: highlight, at: 'fatal consequences'}
      - say: 'Option A limits it to the evil man, but the warning is for everyone.'
        write: 'A ✗ — the warning is for all of us'
        point:
          - {line: 4, kind: strike}
          - {passage: true, kind: label, target: 'we ought to mind our thoughts', text: '“we” = all of us, not “the evil man” → A'}
          - {passage: true, kind: strike, target: 'Like a clock with the pendulum in full swing', text: 'only the mind’s speed; no stopping it → B'}
      - say: 'So too many evil thoughts leave fatal consequences, which is answer choice C.'
        write: 'C · too many → fatal consequences'
        answer: true
        point:
          - {line: 5, kind: highlight, at: 'too many → fatal consequences', to: {passage: true, target: 'drag us down to ruin'}}
    traps:
      A: 'You went for “ruin the evil man”. The paragraph warns all of us, not only an evil man.'
      B: 'You went for stopping the pendulum. The pendulum only shows how fast the mind moves; nobody is told to stop it.'
      D: 'You went for deciding what controls our thoughts. The first paragraph warns about danger; it does not discuss this.'
  8:
    moments:
      - say: 'The second paragraph asks about people who say they cannot help bad thoughts.'
        write: 'Paragraph 2'
        point:
          - {passage: true, kind: label, target: 'they cannot help having bad thought', text: 'the excuse people give'}
      - say: 'The writer’s question is, do they hate them or not?'
        write: '“do they hate them or not?”'
        point:
          - {line: 1, kind: highlight, at: 'do they hate them', text: 'the clue'}
          - {passage: true, kind: underline, target: 'do they hate them or not?', text: 'the test: hate them or keep them?'}
      - say: 'So bad thoughts rule the people who do not hate them, who hug and keep them.'
        write: 'ruled by bad thoughts = those who keep them'
        point:
          - {passage: true, kind: label, target: 'if we open our doors to them and receive them joyfully', text: 'welcoming them = treasuring them'}
      - say: 'To treasure is to value, and to ruminate is to keep chewing something over in the mind.'
        write: 'treasure = value · ruminate = think over and over'
        point:
          - {passage: true, kind: label, target: 'He who turns a morsel over and over', text: 'ruminate = turn it over and over'}
          - {line: 3, kind: highlight, at: 'ruminate'}
      - say: 'The other options bring in laziness and thieves, which this paragraph does not discuss.'
        write: 'B, C ✗ — not in paragraph 2'
        point:
          - {line: 4, kind: strike}
          - {passage: true, kind: strike, target: 'We cannot keep thieves from looking in at our window', text: 'thieves are a picture, not the people → C'}
      - say: 'So evil thoughts control people who treasure them and ruminate on them, which is answer choice D.'
        write: 'D · treasure and ruminate on them'
        point:
          - {line: 2, kind: arrow}
        answer: true
    traps:
      A: 'You went for “helpless because they fly out”. If thoughts fly out, they do not control you; that is what the writer wants.'
      B: 'You went for idle and slothful ways. Laziness is not the subject of this paragraph.'
      C: 'You went for thieves. Thieves come in a later picture about the window; the paragraph is about people who do not hate their bad thoughts.'
  9:
    moments:
      - say: 'Read the full sentence the expression comes from.'
        write: '“Think of the devil, and he will appear”'
        point:
          - {passage: true, kind: underline, target: 'Think of the devil, and he will appear', text: 'the expression'}
      - say: 'It goes on to say, turn your thought toward evil and your hands will soon follow.'
        write: '“… your hands will soon follow”'
        doodle: {name: 'custom:2011_q09_a', id: devil, caption: 'think of the devil…'}
        point:
          - {line: 1, kind: highlight, at: 'your hands will soon follow', text: 'the clue'}
          - {passage: true, kind: label, target: 'turn your thought toward evil and your hands will soon follow', text: 'the same sentence explains it'}
      - say: 'The second half explains the first. Thinking about evil, the thought, leads to doing evil, the hand.'
        write: 'evil thought → evil deed'
        doodle_do: [{id: devil, op: stage, stage: 'custom:2011_q09_a2'}, {id: devil, op: arrow, part: thought, to_part: hand}]
        point:
          - {passage: true, kind: label, target: 'he who meditate upon evil, love it, and is ripe to commit it', text: 'thinking evil → doing evil'}
          - {line: 2, kind: highlight, at: 'evil deed', to: {doodle: devil, part: hand}}
      - say: 'So if we do not control evil thoughts, they may lead to evil deeds.'
        write: 'uncontrolled thoughts → deeds'
        point:
          - {passage: true, kind: circle, target: 'your hands', text: 'hands = deeds'}
      - say: 'Option D reads it literally, about the devil himself. The writer is talking about our thoughts.'
        write: 'D ✗ — too literal'
        point:
          - {line: 4, kind: strike}
          - {passage: true, kind: strike, target: 'Think of the devil', text: 'not about the real devil → D'}
          - {passage: true, kind: label, target: 'they must not be allowed to reign', text: 'true, but not what this saying means → A'}
      - say: 'So uncontrolled evil thoughts may lead to evil deeds, which is answer choice C.'
        write: 'C · uncontrolled thoughts → evil deeds'
        doodle_do: [{id: devil, op: circle, part: hand}]
        point:
          - {line: 2, kind: arrow}
        answer: true
    traps:
      A: 'You went for “evil thoughts must not reign”. That is true elsewhere in the passage, but it is not what this expression means.'
      B: 'You went for fantasies that exist only in the mind. The writer says the opposite: the hands follow the thought.'
      D: 'You went for the devil giving thoughts to those who invite him. That takes the saying literally; it is about thought leading to action.'
  10:
    moments:
      - say: 'We want a summary of the paragraph about dwelling on evil.'
        write: 'Summarize the paragraph'
      - say: 'It says that he who meditates upon evil, loves it, and is ripe to commit it.'
        write: '“meditates upon evil … ripe to commit it”'
        point:
          - {line: 1, kind: highlight, at: 'ripe to commit it', text: 'the clue'}
          - {passage: true, kind: underline, target: 'he who meditate upon evil, love it, and is ripe to commit it', text: 'think → love → do'}
      - say: 'Like turning a morsel over and over in the mouth, the more you think evil, the more you like it.'
        write: 'more thinking → more liking → doing'
        point:
          - {passage: true, kind: label, target: 'He who turns a morsel over and over in his mouth', text: 'a picture: tasting it again and again'}
      - say: 'Vile means wicked. The more evil we think, the more vile we become.'
        write: 'vile = wicked'
        point:
          - {passage: true, kind: circle, target: 'vile imagination', text: 'vile = wicked'}
          - {line: 3, kind: highlight, at: 'vile'}
      - say: 'Option A turns the mire and dirt into a real road, but it is only a picture.'
        write: 'A ✗ — the road is only an image'
        point:
          - {line: 4, kind: strike}
          - {passage: true, kind: strike, target: 'much traffic of bad thinking, there will be much mire and dirt', text: 'traffic of THINKING, not a road → A'}
          - {passage: true, kind: label, target: 'gets the key of our minds', text: 'a key to the mind, not “no one can keep them out” → D'}
      - say: 'So the more evil we think, the more vile we are likely to become, which is answer choice B.'
        write: 'B · more evil thinking → more vile'
        point:
          - {line: 2, kind: arrow}
        answer: true
    traps:
      A: 'You went for a miry, dirty road. The mire and dirt are an image for bad thinking, not a real road.'
      C: 'You went for evil people as guests. The guests in the passage are thoughts, not people.'
      D: 'You went for “no one can keep them out”. The writer insists we can and must keep them out.'
  11:
    moments:
      - say: 'Why do people lead and motivate others? Find the lines about leading.'
        write: 'Why lead and motivate?'
      - say: 'The passage says that we lead, inspire and motivate people to strive and succeed.'
        write: '“We lead, inspire and motivate people …”'
        point:
          - {passage: true, kind: underline, target: 'We lead, inspire and motivate people to strive and succeed', text: 'what we do'}
      - say: 'Then it says we paint the true picture of life so that we can discourage vain pursuits.'
        write: '“so that we can discourage vain pursuits”'
        point:
          - {line: 2, kind: highlight, at: 'discourage vain pursuits', text: 'the clue'}
          - {passage: true, kind: label, target: 'so that we can discourage vain pursuits', text: '“so that” gives the purpose'}
      - say: 'Vain means empty. A pursuit is a search. Discourage means try to prevent.'
        write: 'vain = empty · pursuit = search'
        point:
          - {passage: true, kind: circle, target: 'vain pursuits', text: 'vain = empty; pursuit = search'}
      - say: 'So the aim is to stop people chasing that empty chest, which means to prevent empty search.'
        write: 'discourage vain pursuits = prevent empty search'
        point:
          - {line: 4, kind: highlight, at: 'prevent empty search', to: {passage: true, target: 'discourage vain pursuits'}}
          - {line: 4, kind: highlight, at: 'prevent empty search'}
      - say: 'None of the other options is mentioned in the passage at all.'
        write: 'A, B, C — not in the passage'
        point:
          - {line: 5, kind: strike}
          - {passage: true, kind: label, target: '‘the top’ is not a place that all must ascend', text: 'no “selfless service” or “home” here → A, B, C'}
      - say: 'So they want to prevent empty search, which is answer choice D.'
        write: 'D · prevent empty search'
        point:
          - {line: 4, kind: arrow}
        answer: true
    traps:
      A: 'You went for projecting individual contribution. The passage never talks about showing off individual contributions.'
      B: 'You went for selfless service. It sounds noble, but the passage does not mention it.'
      C: 'You went for making the world a home. The passage talks about life as a mansion, but not about making the world a home.'
  12:
    moments:
      - say: 'Why must balance be enthroned? Look for the word balance.'
        write: 'Why must balance be enthroned?'
      - say: 'The passage says that balance must be enthroned as a critical component of truth.'
        write: '“a critical component of truth”'
        point:
          - {line: 1, kind: highlight, at: 'critical component of truth', text: 'the clue'}
          - {passage: true, kind: underline, target: 'Balance must be enthroned as a critical component of truth', text: 'the reason is given here'}
      - say: 'Component means part. Fidelity means faithfulness to the truth.'
        write: 'component = part · fidelity = truthfulness'
        point:
          - {passage: true, kind: circle, target: 'component', text: 'component = part'}
      - say: 'So “a critical component of truth” is “a critical part of fidelity”.'
        write: 'critical part of truth = critical part of fidelity'
        point:
          - {passage: true, kind: circle, target: 'truth', text: 'faithful to truth = fidelity'}
          - {line: 3, kind: highlight, at: 'critical part of fidelity'}
      - say: 'Option D talks about success, but the passage links balance to truth, and says the top is not for everyone.'
        write: 'D ✗ — balance is tied to truth, not success'
        point:
          - {line: 4, kind: strike}
          - {passage: true, kind: label, target: '‘the top’ is not a place that all must ascend', text: 'not everyone reaches the top → not success (D)'}
      - say: 'So balance is a critical part of fidelity, which is answer choice C.'
        write: 'C · a critical part of fidelity'
        point:
          - {line: 3, kind: arrow}
        answer: true
    traps:
      A: 'You went for an interdependent function. “Critical” is in the passage, but “interdependent function” is not.'
      B: 'You went for help for conscience. Conscience is not mentioned; the passage links balance to truth.'
      D: 'You went for ensuring success. The passage ties balance to truth — and even says “the top” is not for all.'
  13:
    moments:
      - say: 'Find the word inclinations in the passage.'
        write: '“natural gifts and inclinations to be school teacher”'
        point:
          - {line: 0, kind: underline, at: 'inclinations'}
          - {passage: true, kind: circle, target: 'inclinations', text: 'the word tested'}
      - say: 'If you are inclined to do something, you lean towards it, like this person towards the board.'
        write: 'inclined = leaning towards'
        doodle: {name: 'custom:2011_q13_a', id: pic, caption: 'inclined = leaning towards'}
        point:
          - {passage: true, kind: label, target: 'natural gifts and inclinations', text: 'paired with “natural gifts” → a natural leaning'}
      - say: 'A natural leaning is a tendency.'
        write: 'inclination = tendency'
        doodle_do: [{id: pic, op: stage, stage: 'custom:2011_q13_a2'}]
        point:
          - {line: 0, kind: arrow, text: 'meaning'}
          - {line: 2, kind: highlight, at: 'tendency', to: {doodle: pic, part: ans}}
      - say: 'Inhibitions are the opposite, things that hold you back.'
        write: 'inhibitions = what holds you back ✗'
