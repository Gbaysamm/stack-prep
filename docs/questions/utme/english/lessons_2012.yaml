# UTME 2012 Use of English — lessons for the board (voice + board), one per question.
format_version: 1
exam_year: 2012
lessons:
  1:
    moments:
      - say: 'This first question is not about the passage. It checks that you know which paper you are writing.'
        write: 'Which paper type is given to you?'
      - say: 'Every JAMB paper prints its type at the very top. Look at the heading of this paper.'
        write: 'Heading: PAPER TYPE: YELLOW'
        point:
          - {line: 1, kind: highlight, at: 'YELLOW', text: 'the clue'}
      - say: 'The heading says yellow. Green, purple and red are other versions of the paper.'
        write: 'Green, Purple, Red = other versions'
        point:
          - {line: 2, kind: strike, at: 'Green, Purple, Red'}
      - say: 'In the hall, always copy the type printed on your own paper.'
        write: 'Rule: shade the type on YOUR paper'
      - say: 'So the paper type is yellow, which is answer choice D.'
        write: 'D · Type Yellow'
        answer: true
    traps:
      A: 'You went for Type Green. The heading of this paper says yellow, so green is a different version.'
      B: 'You went for Type Purple. Always read the type printed at the top; here it says yellow.'
      C: 'You went for Type Red. Red is another version of the paper; this one is headed yellow.'
  2:
    moments:
      - say: 'The question asks what we can say about all the ethnic groups and their religions.'
        write: 'All ethnic groups have …?'
      - say: 'Go to the paragraph on traditional religion. It says each ethnic group, like these three, has its own traditions and shrines.'
        write: '“Each ethnic group has its own religious traditions”'
        doodle: {name: 'custom:2012_q02_a', id: groups, caption: 'each group, its own traditions', size: scene}
        point:
          - {passage: true, kind: label, target: 'Each ethnic group has its own religious traditions', text: 'side 1: each is different'}
      - say: 'But the next sentence begins with “Yet”, and says they have much in common: the high god above all of them.'
        write: '“Yet … have much in common”'
        doodle_do: [{id: groups, op: circle, part: common}]
        point:
          - {line: 2, kind: highlight, at: 'have much in common', text: 'the clue'}
          - {passage: true, kind: circle, target: 'Yet', text: '“Yet” turns: now the likeness'}
          - {passage: true, kind: underline, target: 'the various traditional religions have much in common', text: 'side 2: much is shared'}
      - say: 'So there are two ideas: the religions differ, and they also share things, like a high god and ancestors.'
        write: 'different + some similarities'
        doodle_do: [{id: groups, op: label, part: igbo, text: 'different + some similar'}]
        point:
          - {passage: true, kind: label, target: 'a remote but benevolent high god', text: 'shared: a high god'}
          - {passage: true, kind: label, target: 'the spirits of the ancestors', text: 'shared: ancestors'}
          - {line: 3, kind: highlight, at: 'different + some similarities', to: {doodle: groups, part: common}}
      - say: 'Options B, C and D each keep only one side: completely different, or exactly the same.'
        write: 'B = all different; C, D = all the same'
        point:
          - {line: 4, kind: strike}
          - {passage: true, kind: label, target: 'In Igbo Traditional religion, there were fewer gods', text: 'differences too → not C, D'}
      - say: 'So the groups have different religions with some similarities, which is answer choice A.'
        write: 'A · different, with some similarities'
        doodle_do: [{id: groups, op: pulse, part: common}]
        answer: true
        point:
          - {line: 5, kind: highlight, at: 'different, with some similarities', to: {passage: true, target: 'have much in common'}}
    traps:
      B: 'You went for completely different practices. The passage says they “have much in common”, so they are not completely different.'
      C: 'You went for the same religion. Each ethnic group “has its own religious traditions”, so they are not the same.'
      D: 'You went for the same manifestations and deities. The deities differ: Olorun for the Yoruba, Ala for the Igbo.'
  3:
    moments:
      - say: 'The question says: according to the first paragraph. So we read only that paragraph.'
        write: 'First paragraph only'
        point:
          - {passage: true, kind: label, target: 'Religion in its various forms is very strong in Nigeria', text: 'paragraph 1 starts here'}
      - say: 'It says most Nigerians believe in an unseen supernatural world, apart from the natural world around us.'
        write: '“an unseen supernatural world, apart from the natural world”'
        doodle: {name: 'custom:2012_q03_a', id: worlds, caption: 'seen and unseen, side by side'}
        point:
          - {line: 1, kind: highlight, at: 'apart from the natural world', text: 'the clue'}
          - {passage: true, kind: underline, target: 'there is an unseen supernatural world, apart from the natural world we see around us', text: 'two worlds, side by side'}
      - say: 'Two worlds, side by side: the one we see, and the unseen one beside it. There is a word for things that exist together.'
        write: 'two worlds side by side'
        doodle_do: [{id: worlds, op: stage, stage: 'custom:2012_q03_a2'}]
        point:
          - {passage: true, kind: circle, target: 'apart from', text: 'besides = both exist together'}
      - say: 'Co-exist means to exist together at the same time.'
        write: 'co-exist = exist together'
        doodle_do: [{id: worlds, op: label, part: unseen, text: 'co-exist'}]
        point:
          - {line: 3, kind: highlight, at: 'exist together', to: {doodle: worlds, part: unseen}}
      - say: 'Controlling, fighting or exploiting are not mentioned in the first paragraph. The judging comes in the second.'
        write: 'control / judge → paragraph 2, not 1'
        point:
          - {line: 4, kind: strike, at: 'control / judge'}
          - {passage: true, kind: label, target: 'They watch and judge us', text: 'paragraph 2, not 1 → B, C, D'}
      - say: 'So the two worlds co-exist, which is answer choice A.'
        write: 'A · supernatural and natural co-exist'
        answer: true
        point:
          - {line: 5, kind: highlight, at: 'supernatural and natural co-exist', to: {passage: true, target: 'apart from the natural world'}}
    traps:
      B: 'You went for antagonistic. That means hostile to each other, and the first paragraph says nothing about the worlds fighting.'
      C: 'You went for controls. The beings who watch and judge us appear in the second paragraph. The question limits you to the first.'
      D: 'You went for exploits. Nothing in the passage says the unseen world takes advantage of ours.'
  4:
    moments:
      - say: 'We need the reason traditional religion has waned. Waned means grown weaker.'
        write: 'waned = grown weaker'
        doodle: {name: 'custom:2012_q04_a', id: moon, caption: 'waned = grown weaker'}
      - say: 'In Hausa land, it has gone underground because of Islam.'
        write: 'Hausa land: “owing to the influence of Islam”'
        doodle_do: [{id: moon, op: shrink, part: trad, by: 0.8}]
        point:
          - {line: 1, kind: highlight, at: 'influence of Islam', text: 'the clue'}
          - {passage: true, kind: underline, target: 'traditional religion has largely gone underground owing to the influence of Islam', text: 'weakened by Islam'}
      - say: 'In Igboland, the oracles lost influence with the coming of Christianity. Watch it wane again, like a moon.'
        write: 'Igboland: “with the coming of Christianity”'
        doodle_do: [{id: moon, op: shrink, part: trad, by: 0.8}]
        point:
          - {line: 2, kind: highlight, at: 'coming of Christianity', text: 'the clue'}
          - {passage: true, kind: underline, target: 'With the coming of Christianity, their influence has however waned', text: 'weakened by Christianity'}
      - say: 'So two religions caused it. Both Islam and Christianity came from outside traditional religion.'
        write: 'Islam + Christianity = non-traditional religions'
        doodle_do: [{id: moon, op: stage, stage: 'custom:2012_q04_a2'}]
        point:
          - {passage: true, kind: circle, target: 'waned', text: 'waned = grew weaker'}
          - {passage: true, kind: label, target: 'Traditional religion, Islam and Christianity', text: 'the two from outside traditional religion'}
          - {line: 3, kind: highlight, at: 'non-traditional religions', to: {doodle: moon, part: new}}
      - say: 'Options A and B each name only one of the two.'
        write: 'A = Islam only; B = Christianity only'
        point:
          - {line: 4, kind: strike}
          - {passage: true, kind: label, target: 'continues to exert a strong influence', text: 'interest is still strong → C wrong'}
      - say: 'So the cause is the influence of non-traditional religions, which is answer choice D.'
        write: 'D · influence of non-traditional religions'
        answer: true
    traps:
      A: 'You went for Islam over Bori spirits. That explains Hausa land only; Christianity also weakened the oracles in Igboland.'
      B: 'You went for Christianity over oracles. That covers Igboland only; Islam did the same in Hausa land.'
      C: 'You went for declining interest. The passage gives other religions as the cause, not people simply losing interest.'
  5:
    moments:
      - say: 'We want a factor common to all traditional religions, as the passage mentions it.'
        write: 'Common to ALL traditional religions?'
      - say: 'First, options A and C say only. The passage names prayers and sacrifices together, so neither is only.'
        write: '“prayers and sacrifices” → not “only”'
        point:
          - {passage: true, kind: label, target: 'appeased with prayers and sacrifices', text: 'prayers AND sacrifices → never “only” (A, C)'}
      - say: 'Now look near the end. Divination is described as part of traditional religion as a whole.'
        write: '“Divination … is an important element of traditional religion”'
        doodle: {name: 'custom:2012_q05_a', id: divine, caption: 'divination'}
        point:
          - {line: 2, kind: highlight, at: 'important element of traditional religion', text: 'the clue'}
          - {passage: true, kind: underline, target: 'is an important element of traditional religion', text: 'traditional religion as a whole'}
      - say: 'Divination means finding out hidden or future things by supernatural means.'
        write: 'divination = discovering the unknown'
        doodle_do: [{id: divine, op: label, part: unknown, text: 'discover the unknown'}]
        point:
          - {passage: true, kind: circle, target: 'the discovery of what is unknown', text: 'divination defined here'}
          - {line: 3, kind: highlight, at: 'discovering the unknown', to: {doodle: divine, part: unknown}}
      - say: 'Rituals are mentioned early on, but for Nigerian religion in general.'
        write: 'rituals → religion in general'
        point:
          - {passage: true, kind: label, target: 'These individuals lay down ceremonies or rituals', text: 'rituals: religion in general → D'}
      - say: 'So the common factor is divination, which is answer choice B.'
        write: 'B · Divination'
        doodle_do: [{id: divine, op: circle, part: diviner}]
        point:
          - {line: 2, kind: arrow, at: 'Divination'}
        answer: true
    traps:
      A: 'You went for prayer only. The passage pairs prayers with sacrifices, so “only” is wrong.'
      C: 'You went for sacrifice only. Sacrifices come with prayers in the passage, so “only” rules it out.'
      D: 'You went for rituals. They are mentioned for Nigerian religion in general; the element named for traditional religion is divination.'
  6:
    moments:
      - say: 'Here we must infer: work out something the passage suggests.'
        write: 'Infer = work out from clues'
      - say: 'The passage says the few Nigerians who read concentrate on foreign books.'
        write: '“concentrate on foreign books than indigenous”'
        doodle: {name: 'custom:2012_q06_a', id: shelf, caption: 'what Nigerians read'}
        point:
          - {line: 1, kind: highlight, at: 'concentrate on foreign books', text: 'the clue'}
          - {passage: true, kind: underline, target: 'the few Nigerians that read concentrate on foreign books than indigenous productions', text: 'clue 1: they read foreign'}
      - say: 'It also says bookshops stock foreign books because of higher demand for them.'
        write: '“higher demands for them”'
        point:
          - {line: 2, kind: highlight, text: 'the clue'}
          - {passage: true, kind: label, target: 'because of higher demands for them', text: 'clue 2: people buy foreign'}
      - say: 'Both clues point one way: the shelf is mostly foreign books. Nigerians read mostly foreign books.'
        write: 'mostly foreign'
        doodle_do: [{id: shelf, op: circle, part: foreign}]
        point:
          - {passage: true, kind: label, target: 'none of the books mentioned had been published in Nigeria', text: 'even the prize winners are published abroad'}
          - {line: 3, kind: highlight, at: 'mostly foreign', to: {doodle: shelf, part: foreign}}
      - say: 'Option A says only, which goes too far. C says alike, which is the opposite.'
        write: 'A = “only” (too strong); C = “alike” (wrong)'
        doodle_do: [{id: shelf, op: label, part: local, text: 'some: not “only”'}]
        point:
          - {line: 4, kind: strike}
          - {passage: true, kind: label, target: 'most renowned bookshops in Nigeria hardly sell books written by indigenous authors', text: '“hardly” ≠ never → “only” (A) too strong'}
          - {passage: true, kind: strike, target: 'students in tertiary institutions depend on dictations', text: 'handouts, but “do not read” goes too far → B'}
      - say: 'So we can infer that Nigerians read mostly foreign books, which is answer choice D.'
        write: 'D · Nigerians read mostly foreign books'
        answer: true
        point:
          - {passage: true, kind: circle, target: 'concentrate on', text: 'concentrate on = mostly → D'}
    traps:
      A: 'You went for foreign books only. The passage says they concentrate on foreign books, not that they cannot get Nigerian ones.'
      B: 'You went for undergraduates not reading textbooks. They rely on handouts because the library has no books, not because they refuse to read.'
      C: 'You went for alike. The passage says they prefer foreign books, so they do not read both equally.'
  7:
    moments:
      - say: 'We want the reason renowned bookshops lack indigenous books, according to the passage.'
        write: 'Why few Nigerian books in bookshops?'
      - say: 'The general manager of a bookstore gives the reason directly.'
        write: '“preferred to stock foreign books because of higher demands for them”'
        doodle: {name: 'custom:2012_q07_a', id: shop, caption: 'the bookshop', size: scene}
        point:
          - {line: 1, kind: highlight, at: 'because of higher demands for them', text: 'the clue'}
          - {passage: true, kind: label, target: 'the general manager of a popular bookstore', text: 'the shop’s own reason'}
      - say: 'Higher demand means more people want to buy them: see the crowd at the foreign shelf.'
        write: 'higher demand = more buyers'
        doodle_do: [{id: shop, op: circle, part: buyers}]
        point:
          - {passage: true, kind: circle, target: 'higher demands', text: 'demand = buyers want them'}
          - {line: 2, kind: highlight, at: 'more buyers', to: {doodle: shop, part: buyers}}
      - say: 'The poor quality of Nigerian books is mentioned later, but about publishers, not as the shops’ reason.'
        write: 'low quality → about publishers'
        doodle_do: [{id: shop, op: label, part: local, text: 'quality: about publishers'}]
        point:
          - {line: 3, kind: strike, at: 'low quality'}
          - {passage: true, kind: strike, target: 'Most of the books are not properly edited', text: 'about publishers, not the shops’ reason → D'}
      - say: 'So the reason is that foreign books attract more buyers, which is answer choice B.'
        write: 'B · foreign books attract more buyers'
        doodle_do: [{id: shop, op: pulse, part: buyers}]
        answer: true
        point:
          - {line: 4, kind: highlight, at: 'foreign books attract more buyers', to: {passage: true, target: 'because of higher demands for them'}}
    traps:
      A: 'You went for Nigerians preferring foreign books. That is close, but the shop’s stated reason is demand: the books sell more.'
      C: 'You went for books not being available. The passage never says Nigerian books are unavailable; the shops choose not to stock them.'
      D: 'You went for low quality. That point is made about publishers later, not given as the bookshops’ reason.'
  8:
    moments:
      - say: 'We need the meaning of profoundly gripping, said of Adichie’s novel.'
        write: 'profoundly gripping = ?'
        point:
          - {line: 0, kind: underline, at: 'profoundly gripping'}
          - {passage: true, kind: underline, target: 'was profoundly gripping', text: 'the expression'}
      - say: 'Think of what your hand does when it grips: it holds tight.'
        write: 'grip = hold tightly'
        doodle: {name: 'custom:2012_q08_a', id: idiom, caption: 'gripping: holds you tight'}
      - say: 'A gripping book holds your attention tightly, like this reader. You cannot put it down.'
        write: 'gripping = holds your attention'
        doodle_do: [{id: idiom, op: stage, stage: 'custom:2012_q08_a2'}]
        point:
          - {passage: true, kind: label, target: 'intensely evocative and immensely absorbing', text: 'absorbing = it holds your attention'}
          - {line: 2, kind: highlight, at: 'holds your attention', to: {doodle: idiom, part: reader}}
      - say: 'Profoundly means deeply.'
        write: 'profoundly = deeply'
        point:
          - {passage: true, kind: circle, target: 'profoundly', text: 'profoundly = deeply'}
      - say: 'The other options are about who reads it or praises it, not about holding attention.'
        write: 'B, C, D → not about attention'
        point:
          - {line: 4, kind: strike, at: 'B, C, D'}
          - {passage: true, kind: label, target: 'According to the reviewer', text: 'one reviewer, not “many authors” → D'}
      - say: 'So the book is highly interesting and captures attention, which is answer choice A.'
        write: 'A · highly interesting, captures attention'
        doodle_do: [{id: idiom, op: circle, part: reader}]
        answer: true
        point:
          - {line: 5, kind: highlight, at: 'captures attention', to: {passage: true, target: 'immensely absorbing'}}
    traps:
      B: 'You went for high quality to the writer. Gripping describes the reader’s experience, not what the writer thinks.'
      C: 'You went for many readers. A gripping book may attract readers, but the word itself means it holds attention.'
      D: 'You went for acknowledged by authors. That is about praise from others, not what gripping means.'
  9:
    moments:
      - say: 'We want the lecturer’s reason for giving notes and handouts.'
        write: 'Why handouts?'
      - say: 'He says students had no textbooks, because the library stopped buying new books.'
        write: '“stopped buying new books when the local currency devalued”'
        point:
          - {line: 1, kind: highlight, at: 'local currency devalued', text: 'the clue'}
          - {passage: true, kind: underline, target: 'in the absence of textbooks', text: 'no textbooks → he dictates'}
      - say: 'When a currency is devalued, the same money buys less than before. This note used to buy three books…'
        write: 'devalued currency → money buys less'
        doodle: {name: 'custom:2012_q09_a', id: money, caption: 'same money, buys less'}
        point:
          - {passage: true, kind: circle, target: 'devalued', text: 'devalued = money buys less'}
      - say: '…now it buys one. Money buying less is called low purchasing power.'
        write: 'low purchasing power'
        doodle_do: [{id: money, op: stage, stage: 'custom:2012_q09_a2'}]
        point:
          - {passage: true, kind: label, target: 'stopped buying new books', text: 'could not afford them = low purchasing power'}
          - {line: 3, kind: highlight, at: 'low purchasing power', to: {doodle: money, part: less}}
      - say: 'He says nothing about teaching aids, quality or time.'
        write: 'A, C, D → not mentioned'
        point:
          - {passage: true, kind: label, target: 'But what other alternative does one have?', text: 'no other choice: money, not time → D'}
          - {passage: true, kind: label, target: 'students who hung on every word', text: 'eager students; no talk of teaching aids → A'}
      - say: 'So the reason is low purchasing power, which is answer choice B.'
        write: 'B · low purchasing power'
        doodle_do: [{id: money, op: circle, part: less}]
        point:
          - {line: 3, kind: arrow, at: 'low purchasing power'}
        answer: true
    traps:
      A: 'You went for teaching aids. The lecturer talks about textbooks the library could not buy, not about teaching aids.'
      C: 'You went for low quality of books. That point is about publishers; the lecturer says there were no books at all.'
      D: 'You went for lack of time. He says he dictated slowly, so time was not his problem; money was.'
  10:
    moments:
      - say: 'A good title covers the whole passage, not just one paragraph.'
        write: 'Title = the whole passage'
      - say: 'The passage opens with its main point: Nigerians hardly read.'
        write: '“the reading culture in Nigeria is now at a low ebb”'
        doodle: {name: 'custom:2012_q10_a', id: tide, caption: 'low ebb: the tide at its lowest'}
        doodle_do: [{id: tide, op: fill, to: 0.8}]
        point:
          - {line: 1, kind: highlight, at: 'at a low ebb', text: 'main point'}
          - {passage: true, kind: underline, target: 'the reading culture in Nigeria is now at a low ebb', text: 'main idea, first paragraph'}
      - say: 'At a low ebb means at a low point, like the tide gone right out.'
        write: 'low ebb = low point'
        doodle_do: [{id: tide, op: fill, to: 0.1}]
        point:
          - {passage: true, kind: circle, target: 'low ebb', text: 'low ebb = low point'}
          - {line: 2, kind: highlight, at: 'low point', to: {doodle: tide, part: tide}}
      - say: 'Everything else supports it: foreign books preferred, poor publishing, and students living on handouts.'
        write: 'foreign books · poor publishing · handouts'
        doodle: {name: 'student-small', id: students, caption: 'students on handouts', repeat: 8, layout: grid}
        point:
          - {passage: true, kind: label, target: 'concentrate on foreign books', text: 'support 1'}
          - {passage: true, kind: label, target: 'The extent to which book publishing standard has fallen', text: 'support 2'}
          - {passage: true, kind: label, target: 'depend on dictations from their lecturers and/or handouts', text: 'support 3'}
      - say: 'Writers, awards and handouts are each only one part.'
        write: 'A, B, D = one part only'
        point:
          - {line: 4, kind: strike, at: 'A, B, D'}
          - {passage: true, kind: label, target: 'Chinua Achebe', text: 'writers and awards: one part only → A, B'}
      - say: 'So the best title is Poor Reading Culture in Nigeria, which is answer choice C.'
        write: 'C · Poor Reading Culture in Nigeria'
        doodle_do: [{id: tide, op: pulse, part: low}]
        answer: true
    traps:
      A: 'You went for Nigerian Literary Writers. The writers appear, but the passage is about how little Nigerians read.'
      B: 'You went for Publishers and International Awards. The awards are only one paragraph; the main point is the poor reading culture.'
      D: 'You went for lecturers selling handouts. That comes only at the end, as one more example of the reading problem.'
  11:
    moments:
      - say: 'Attitude means the writer’s feeling or stance towards the topic.'
        write: 'attitude = the writer’s stance'
      - say: 'The topic is the saying, experience is the best teacher. Does the writer agree?'
        write: '“experience is the best teacher”?'
        doodle: {name: 'custom:2012_q11_a', id: saying, caption: 'the saying'}
        point:
          - {passage: true, kind: label, target: 'It is said that experience is the best teacher', text: 'the saying he examines'}
      - say: 'No. He examines it closely, and ends by saying it may not be justifiable after all.'
        write: '“may not be justifiable after all”'
        doodle_do: [{id: saying, op: stage, stage: 'custom:2012_q11_a2'}]
        point:
          - {line: 2, kind: highlight, at: 'may not be justifiable', text: 'the clue'}
          - {passage: true, kind: underline, target: 'may not be justifiable after all', text: 'his verdict at the end'}
      - say: 'Someone who examines an idea and finds fault with it is being critical.'
        write: 'finds fault = critical'
        doodle_do: [{id: saying, op: circle, part: critic}]
        point:
          - {line: 2, kind: arrow, at: 'may not be justifiable'}
          - {passage: true, kind: label, target: 'This is a tough, costly and inconvenient way to learn', text: 'finds fault with it → critical'}
          - {line: 3, kind: highlight, at: 'critical', to: {doodle: saying, part: critic}}
      - say: 'He takes a clear side, so he is not objective or non-committal. He argues with reasons, not emotion.'
        write: 'takes a side → not A, not C; reasons → not D'
        point:
          - {passage: true, kind: label, target: 'Consider the child who grasps a burning coal', text: 'argues with an example, not feelings → not D'}
      - say: 'So the attitude is critical, which is answer choice B.'
        write: 'B · critical'
        answer: true
    traps:
      A: 'You went for objective. An objective writer stays neutral; this writer argues firmly against the saying.'
      C: 'You went for non-committal. That means refusing to take a side, but this writer clearly takes one.'
      D: 'You went for emotional. The writer uses reasons and examples, like the burnt child, not strong feelings.'
  12:
    moments:
      - say: 'We must deduce: find what the passage leads us to conclude.'
        write: 'deduce = conclude from the passage'
      - say: 'The writer compares learning by experience with learning by wisdom.'
        write: 'experience vs wisdom'
        doodle: {name: 'custom:2012_q12_a', id: scale, caption: 'experience vs wisdom'}
        point:
          - {passage: true, kind: label, target: 'to learn consciously through wisdom may even be a better', text: 'the comparison begins'}
      - say: 'He says we should give more premium to wisdom. More premium means more value.'
        write: '“give more premium to learning by wisdom”'
        point:
          - {line: 2, kind: highlight, at: 'more premium', text: 'the clue'}
          - {passage: true, kind: underline, target: 'We should give more premium to learning by wisdom than by experience', text: 'the conclusion'}
      - say: 'So wisdom is preferred to experience: it weighs more on his scale.'
        write: 'wisdom > experience'
        doodle_do: [{id: scale, op: circle, part: wisdom}]
        point:
          - {line: 3, kind: box}
          - {passage: true, kind: label, target: 'It is much easier and cheaper to learn consciously by wisdom', text: 'wisdom wins again'}
          - {line: 3, kind: highlight, at: 'wisdom > experience', to: {doodle: scale, part: wisdom}}
      - say: 'Options B and C say the opposite, learning the painful way like the child with the coal, and A goes against the whole passage.'
