# UTME 2013 Use of English — lessons for the board.
# Each lesson is a run of moments: what the teacher says, and the line written while it is said.
# Answers match explanations_2013.yaml. No lesson for 1, 67, 85, 97 (unrecoverable).
format_version: 1
exam_year: 2013
lessons:
  2:
    moments:
      - say: 'We want the one statement the passage really supports.'
        write: 'Which is TRUE by the passage?'
      - say: 'The passage ends by saying why the wheel is used. Let me write that line.'
        write: '“made more quickly and accurately”'
        point:
          - {line: 1, kind: highlight, at: 'quickly and accurately', text: 'the clue'}
          - {passage: true, kind: underline, target: 'In this way, a small and medium-sized pot can be made more quickly and accurately'}
          - {passage: true, kind: label, target: 'In this way', text: 'sums up the whole wheel process'}
      - say: 'Accurately means correctly. So the passage says pots are made quickly and correctly.'
        write: 'accurately = correctly'
        point:
          - {line: 1, kind: underline, at: 'accurately'}
          - {passage: true, kind: label, target: 'accurately', text: 'accurately = correctly → B'}
          - {line: 2, kind: highlight, at: 'correctly', to: {passage: true, target: 'more quickly and accurately'}}
      - say: 'Now test the others. Training, breaking, hard work: none of these is mentioned.'
        write: 'A training? C breaking? D hard work? not said'
        point:
          - {line: 3, kind: strike, at: 'A training? C breaking? D hard work?'}
          - {passage: true, kind: label, target: 'The first work is to force the lump to the centre', text: 'skilled steps: never called easy (D)'}
      - say: 'So the answer is pots can be made quickly and correctly, which is answer choice B.'
        write: 'B · quickly and correctly'
        answer: true
        point:
          - {line: 1, kind: arrow}
    traps:
      A: 'You went for “anyone, with almost no training”. The passage never talks about training; it describes a skilled potter.'
      C: 'You went for “less likely to break”. That may sound sensible, but the passage says nothing about pots breaking.'
      D: 'You went for “does not have to work hard”. The passage lists step after step of careful work; it never says the wheel makes it easy.'
  3:
    moments:
      - say: 'How does the potter get pots of almost the same size? Look for “same size” in the passage.'
        write: 'same size → how?'
      - say: 'Here it is: the lumps of clay are weighed out so that each pot will be roughly the same size.'
        write: '“weighed out so that each pot ... same size”'
        point:
          - {line: 1, kind: highlight, at: 'weighed out', text: 'the clue', to: {passage: true, target: 'They are weighed out so that each pot will be roughly the same size'}}
          - {passage: true, kind: circle, target: 'weighed out', text: 'the step that fixes the size'}
      - say: 'Picture the scale: same weight of clay, same size of pot. The example is one and a half kilogrammes for a pint jug.'
        write: 'same weight of clay → same size pot'
        doodle: {name: 'custom:2013_q03_a', caption: 'same weight of clay → same size pot'}
        point:
          - {passage: true, kind: label, target: 'one and a half kilogrammes', text: 'the example: same weight every time'}
          - {line: 2, kind: highlight, at: 'same weight of clay', to: {passage: true, target: 'the lumps of clay will be one and a half kilogrammes'}}
      - say: 'Tools and experience help, but the passage gives weighing as the reason.'
        write: 'tools, experience → not the reason given'
        point:
          - {line: 3, kind: strike, at: 'tools, experience'}
          - {passage: true, kind: label, target: 'He has a bowl of water, a loofah', text: 'tools are for shaping, not size (C)'}
      - say: 'So he weighs the lumps of clay, which is answer choice B.'
        write: 'B · weighing the lumps'
        answer: true
        point:
          - {line: 1, kind: arrow}
    traps:
      A: 'You went for “knowledge of different pots”. The passage gives a practical step, weighing, not knowledge.'
      C: 'You went for “the right tools”. The tools are listed, but they are for shaping, not for making sizes match.'
      D: 'You went for experience. Experience matters, but the passage says plainly that the clay is weighed for this purpose.'
  4:
    moments:
      - say: 'We need the meaning of “trims off any waste clay”.'
        write: 'trims off any waste clay = ?'
        point:
          - {line: 0, kind: underline, at: 'trims off any waste clay'}
          - {passage: true, kind: underline, target: 'He trims off any waste clay'}
      - say: 'To trim is to cut off small unwanted bits, like a barber trimming hair.'
        write: 'trim = cut off small unwanted bits'
        doodle: {name: 'custom:2013_q04_a', caption: 'trim = cut off the extra bits'}
        point:
          - {line: 1, kind: circle, at: 'trim'}
          - {passage: true, kind: label, target: 'trims off', text: 'trim = cut off small unwanted bits'}
      - say: 'Waste clay is extra clay the pot does not need.'
        write: 'waste clay = clay not needed'
        point:
          - {passage: true, kind: label, target: 'Then he shapes the belly and shoulder of the pot', text: 'pot shaped first; extra clay is left'}
          - {line: 2, kind: highlight, at: 'waste clay', to: {passage: true, target: 'waste clay'}}
      - say: 'Put them together: cut away what is not needed.'
        write: 'cut away unnecessary parts'
      - say: 'Forcing clay to the centre was an earlier step, so it is not this.'
        write: 'centre = earlier step'
        point:
          - {line: 4, kind: strike, at: 'centre'}
          - {passage: true, kind: strike, target: 'force the lump to the centre'}
          - {passage: true, kind: label, target: 'The first work', text: 'first step, not the trimming (B)'}
      - say: 'So it means to cut away unnecessary parts, which is answer choice A.'
        write: 'A · cut away unnecessary parts'
        answer: true
        point:
          - {line: 3, kind: arrow}
    traps:
      B: 'You went for “force the clay to the centre”. That is the first step on the wheel, not trimming.'
      C: 'You went for “divide the clay into two”. Trimming takes off small bits; it does not split the lump.'
      D: 'You went for “wash away different colours”. Nothing is washed; trimming is cutting.'
  5:
    moments:
      - say: 'Find congenial in the passage. Learners “can find a congenial temporary home”.'
        write: '“a congenial temporary home”'
        point:
          - {line: 0, kind: underline, at: 'congenial'}
          - {passage: true, kind: circle, target: 'congenial', text: 'the word'}
          - {passage: true, kind: underline, target: 'learners from many different parts can find a congenial temporary home'}
      - say: 'Why would learners come from far away? Because the home is pleasant and friendly.'
        write: 'congenial = pleasant, friendly'
        point:
          - {line: 0, kind: arrow}
          - {passage: true, kind: label, target: 'learners from many different parts', text: 'they come from far to live here'}
          - {line: 1, kind: highlight, at: 'pleasant, friendly', to: {passage: true, target: 'a congenial temporary home'}}
      - say: 'Test the options. Congested means overcrowded: not a draw for learners.'
        write: 'congested = overcrowded ✗'
        point:
          - {line: 2, kind: strike, at: 'congested'}
          - {passage: true, kind: label, target: 'the Emir and his Council are actively interested', text: 'welcoming hosts, not crowded (A)'}
      - say: 'Precise and similar have nothing to do with a welcoming home.'
        write: 'precise, similar ✗'
        point:
          - {line: 3, kind: strike, at: 'precise, similar'}
      - say: 'Nice is the nearest to pleasant. So the answer is nice, which is answer choice D.'
        write: 'D · nice'
        answer: true
    traps:
      A: 'You went for congested. It starts with con- like congenial, but it means overcrowded, the opposite of a welcoming home.'
      B: 'You went for precise. Precise means exact; it cannot describe a home.'
      C: 'You went for similar. Congenial can mean like-minded, but “a similar home” makes no sense here; the home is pleasant.'
  6:
    moments:
      - say: 'Which statement does Passage II support? Let us collect the clues about feelings.'
        write: 'Which is TRUE?'
      - say: 'First clue: our response to music is rooted in deep feelings.'
        write: '“rooted in deep feelings”'
        point:
          - {passage: true, kind: label, target: 'rooted in deep feelings', text: 'music reaches our feelings'}
      - say: 'Second clue: music can be a barely perceived background, or a totally absorbing experience.'
        write: 'background (film) ↔ absorbing (concert)'
        point:
          - {line: 2, kind: highlight, at: 'background (film)', to: {passage: true, target: 'a barely perceived background as in a film'}}
          - {line: 2, kind: highlight, at: 'absorbing (concert)', to: {passage: true, target: 'a totally absorbing experience as in a concert'}}
          - {passage: true, kind: label, target: 'People listen to music in many different ways', text: 'different ways = different levels'}
      - say: 'So music reaches our feelings lightly at times and deeply at others: different levels.'
        write: 'feelings at different levels'
        point:
          - {line: 2, kind: highlight, at: 'background', text: 'the clue'}
          - {passage: true, kind: label, target: 'barely perceived', text: 'level 1: hardly noticed'}
          - {passage: true, kind: label, target: 'totally absorbing', text: 'level 2: fills our whole attention'}
      - say: 'Check C: the passage says our response is subjective, not objective.'
        write: 'C objective ✗ (passage: subjective)'
        point:
          - {line: 4, kind: strike, at: 'C objective'}
          - {passage: true, kind: circle, target: 'subjective', text: 'subjective, not objective (C)'}
          - {passage: true, kind: label, target: 'Even professional critics can differ strongly', text: 'even experts feel it differently'}
      - say: 'So the answer is music influences feelings at different levels, which is answer choice D.'
        write: 'D · feelings at different levels'
        answer: true
    traps:
      A: 'You went for “music can enhance evaluation performance”. The passage says we evaluate performances; it never says music improves evaluation.'
      B: 'You went for “all listeners are music makers”. Listeners take part by feeling, but the passage never says they make music.'
      C: 'You went for “objective”. The passage says the opposite: our response is subjective, and even critics differ.'
  7:
    moments:
      - say: 'Where does “stage and hall” appear? Feelings are exchanged between stage and hall.'
        write: '“exchanged between stage and hall”'
        point:
          - {line: 0, kind: underline, at: 'stage and hall'}
          - {passage: true, kind: underline, target: 'feelings are exchanged between stage and hall'}
      - say: 'Picture a concert. Who is on the stage? The artiste who performs.'
        write: 'stage → artiste'
        doodle: {name: 'custom:2013_q07_a', caption: 'stage → artiste, hall → audience'}
        point:
          - {passage: true, kind: circle, target: 'stage', text: 'who is here? the artiste'}
          - {passage: true, kind: label, target: 'In a live performance artistes put themselves on the line', text: 'the artistes perform on the stage'}
      - say: 'Who is in the hall? The listeners, the audience.'
        write: 'hall → audience'
        point:
          - {passage: true, kind: circle, target: 'hall', text: 'who is here? the listeners', nth: 2}
          - {passage: true, kind: label, target: 'the listeners are actively involved', text: 'the listeners sit in the hall'}
      - say: 'No producer or director is mentioned anywhere.'
        write: 'producer, director → not in passage'
        point:
          - {line: 3, kind: strike, at: 'producer, director'}
          - {passage: true, kind: label, target: 'What is performed', text: 'no producer or director named (C, D)'}
      - say: 'So stage and hall means the artiste and the audience, which is answer choice B.'
        write: 'B · artiste and the audience'
        answer: true
    traps:
      A: 'You went for “artiste and his music”. The music is what passes between them; the hall is the people listening.'
      C: 'You went for “producer and the director”. Neither is mentioned in the passage.'
      D: 'You went for “director and the audience”. The audience is right, but the stage holds the artiste, not a director.'
  8:
    moments:
      - say: 'A deduction must follow from what is written. Look at the last paragraph.'
        write: 'Deduce: music is ...'
      - say: 'Music can be a barely perceived background, as in a film.'
        write: 'film → barely perceived'
        point:
          - {line: 1, kind: highlight, at: 'barely perceived', to: {passage: true, target: 'a barely perceived background as in a film'}}
          - {passage: true, kind: label, target: 'as in a film', text: 'setting 1: film → background'}
      - say: 'Or a totally absorbing experience, as in a concert.'
        write: 'concert → totally absorbing'
        point:
          - {line: 2, kind: highlight, at: 'totally absorbing', to: {passage: true, target: 'a totally absorbing experience as in a concert'}}
          - {passage: true, kind: label, target: 'as in a concert', text: 'setting 2: concert → full attention'}
      - say: 'Picture the two settings: quiet background in a film, all-absorbing at a concert. The setting decides how we take it in. The environment dictates.'
        write: 'setting decides → environment dictates'
        doodle: {name: 'custom:2013_q08_a', caption: 'the setting decides how we listen'}
        point:
          - {line: 3, kind: highlight, at: 'setting decides', text: 'the clue'}
          - {passage: true, kind: underline, target: 'People listen to music in many different ways'}
          - {passage: true, kind: label, target: 'many different ways', text: 'the way depends on the setting'}
      - say: 'Crowds, happiness and critics are not what the passage links to this.'
        write: 'crowd? happy? critics? ✗'
        point:
          - {line: 4, kind: strike, at: 'crowd? happy? critics?'}
          - {passage: true, kind: label, target: 'Even professional critics can differ strongly', text: 'critics differ: not “better” (D)'}
      - say: 'So music is appreciated as the environment dictates, which is answer choice A.'
        write: 'A · as the environment dictates'
        answer: true
        point:
          - {line: 3, kind: arrow}
    traps:
      B: 'You went for “better appreciated in a crowd”. A concert has a crowd, but the passage’s point is the setting, and it never says crowds are better.'
      C: 'You went for “when we are happy”. The passage talks of deep feelings, not of happiness in particular.'
      D: 'You went for “professional critics”. The passage says critics differ strongly, not that they appreciate it better.'
  9:
    moments:
      - say: 'Why are live performances exciting? Find the live performance paragraph.'
        write: 'live performance → special excitement'
        point:
          - {passage: true, kind: label, target: 'Live performances provide a special excitement', text: 'the question''s own words'}
      - say: 'The artiste must make sure the listeners are actively involved.'
        write: '“listeners are actively involved”'
        point:
          - {line: 1, kind: highlight, at: 'actively involved', text: 'the clue'}
          - {passage: true, kind: circle, target: 'actively involved', text: 'listeners take part'}
      - say: 'And feelings are exchanged between stage and hall: a two-way exchange.'
        write: '“feelings are exchanged”'
        point:
          - {line: 2, kind: highlight, at: 'exchanged'}
          - {passage: true, kind: label, target: 'between stage and hall', text: 'performer ↔ listeners, both ways'}
      - say: 'Two sides acting on each other: that is interaction.'
        write: 'two-way = interactive'
        point:
          - {line: 3, kind: highlight, at: 'two-way', to: {passage: true, target: 'feelings are exchanged between stage and hall'}}
          - {passage: true, kind: label, target: 'technical difficulties are avoided', text: 'an aim, not why it excites (C)'}
      - say: 'So live performances are interactive, which is answer choice B.'
        write: 'B · interactive'
        answer: true
        point:
          - {line: 3, kind: arrow}
    traps:
      A: 'You went for stage-managed. The passage never uses the idea; its point is the exchange with the audience.'
      C: 'You went for error-free and original. Avoiding errors is what the artiste trains for, not what makes it exciting.'
      D: 'You went for educative. Nothing in the paragraph is about teaching.'
  10:
    moments:
      - say: 'Why does music play a vital role? The answer comes straight after that opening sentence.'
        write: 'vital role because ...?'
        point:
          - {passage: true, kind: underline, target: 'Music plays a vital role in human society'}
          - {passage: true, kind: label, target: 'vital role', text: 'the claim: the reason comes next'}
      - say: 'Good music provides entertainment and emotional release.'
        write: '“entertainment and emotional release”'
        point:
          - {line: 1, kind: highlight, at: 'entertainment and emotional release', text: 'the clue'}
          - {passage: true, kind: circle, target: 'Good music provides', text: 'the reason, right after the claim'}
      - say: 'Entertainment is enjoyment. Emotional release is relief.'
        write: 'entertainment = enjoyment; release = relief'
        point:
          - {line: 1, kind: arrow}
          - {line: 2, kind: highlight, at: 'enjoyment', to: {passage: true, target: 'entertainment'}}
          - {line: 2, kind: highlight, at: 'relief', to: {passage: true, target: 'emotional release'}}
      - say: 'The CD, MP3 and DVD come later, as a way of hearing music, not the reason it matters.'
        write: 'D technology = how, not why'
        point:
          - {line: 3, kind: strike, at: 'D technology'}
          - {passage: true, kind: label, target: 'Thanks to modern technology', text: 'how we hear it, not why it matters'}
      - say: 'So music provides enjoyment and relief, which is answer choice A.'
        write: 'A · enjoyment and relief'
        answer: true
    traps:
      B: 'You went for “easy to appreciate”. The passage says the opposite: we must work to evaluate music.'
      C: 'You went for stage performance. The passage never says it is the most popular.'
      D: 'You went for the CD, MP3 and DVD. They explain how we hear music everywhere, not why music is vital.'
  11:
    moments:
      - say: 'The bomb is just another atmospheric disturbance. It is classed with rare natural gap 11, such as volcanic ...'
        write: 'rare natural ___(11)___, such as volcanic ...'
        point:
          - {line: 0, kind: highlight, at: 'such as volcanic', text: 'the clue'}
          - {passage: true, kind: label, target: 'simply another atmospheric disturbance', text: 'the bomb = one more disturbance'}
          - {passage: true, kind: circle, target: 'rare natural', text: 'clue: things that happen in nature'}
      - say: 'A volcanic eruption is an event that happens in nature.'
        write: 'volcano → a natural event'
        point:
          - {passage: true, kind: label, target: 'such as volcanic', text: 'an example of the gap: an event'}
          - {line: 1, kind: highlight, at: 'volcano', to: {passage: true, target: 'volcanic'}}
      - say: 'Another word for an event is an occurrence.'
        write: 'event = occurrence'
      - say: 'Resources and laws are not disturbances. Programmes are planned by people.'
        write: 'resources, laws, programmes ✗'
        point:
          - {line: 3, kind: strike, at: 'resources, laws, programmes'}
          - {passage: true, kind: label, target: 'It should therefore be classified with', text: 'classed with disturbances: events'}
      - say: 'So the gap is occurrences, which is answer choice B.'
        write: 'B · occurrences'
        answer: true
    traps:
      A: 'You went for programmes. A programme is planned; volcanoes are natural events.'
      C: 'You went for resources. Natural resources is a common phrase, but a resource is useful material, not a disturbance.'
      D: 'You went for laws. Natural laws are rules of nature, not events like an eruption.'
  12:
    moments:
      - say: 'Gap 12 comes after the word volcanic.'
        write: 'volcanic ___(12)___'
        point:
          - {line: 0, kind: highlight, at: 'volcanic', text: 'the clue'}
          - {passage: true, kind: circle, target: 'volcanic', text: 'clue: what does a volcano do?'}
      - say: 'Picture a volcano. What does it do? It erupts.'
        write: 'volcano erupts'
        doodle: {name: 'custom:2013_q12_a', caption: 'a volcano erupts'}
        point:
          - {line: 1, kind: circle, at: 'erupts'}
          - {passage: true, kind: label, target: 'rare natural', text: 'a natural event → eruption'}
      - say: 'So the event is a volcanic eruption.'
        write: 'volcanic eruption'
      - say: 'Insurrection is a revolt; expulsion is being thrown out.'
        write: 'insurrection = revolt; expulsion = thrown out'
        point:
          - {line: 3, kind: strike, at: 'insurrection'}
          - {line: 3, kind: strike, at: 'expulsion'}
          - {passage: true, kind: label, target: 'simply another atmospheric disturbance', text: 'nature bursts; people revolt (A)'}
      - say: 'So the gap is eruption, which is answer choice C.'
        write: 'C · eruption'
        answer: true
    traps:
      A: 'You went for insurrection. It sounds grand, but it is a rising up of people against rulers.'
      B: 'You went for exhaustion. That means tiredness or being used up, not what a volcano does.'
      D: 'You went for expulsion. That is being forced out of a school or group; volcanoes erupt.'
  13:
    moments:
      - say: 'Read the sentence: as with all events on this gap 13, it is impossible to describe in detail.'
        write: 'all events on this ___(13)___'
        point:
          - {line: 0, kind: highlight, at: 'events on this', text: 'the clue'}
          - {passage: true, kind: label, target: 'As with all events on this', text: '“on this ___” = of this size'}
      - say: 'Why impossible? Because the explosion is so huge.'
        write: 'huge event → hard to describe'
        point:
          - {line: 1, kind: highlight, at: 'hard to describe', to: {passage: true, target: 'it is impossible to describe what happens in details'}}
          - {passage: true, kind: label, target: 'impossible to describe', text: 'so huge it cannot be fully described'}
      - say: 'We say an event on a large scale. On this scale means of this size.'
        write: 'on this scale = of this size'
        point:
          - {line: 2, kind: box, at: 'on this scale = of this size'}
          - {passage: true, kind: circle, target: 'the explosion of hydrogen bomb', text: 'an event on a huge scale'}
      - say: 'Scanner, skate and snow make no sense here.'
        write: 'scanner, skate, snow ✗'
        point:
          - {line: 3, kind: strike, at: 'scanner, skate, snow'}
      - say: 'So the gap is scale, which is answer choice D.'
        write: 'D · scale'
        answer: true
    traps:
      A: 'You went for scanner. A scanner is a machine; “events on this scanner” means nothing.'
      B: 'You went for skate. It looks a bit like scale, but a skate is a boot on wheels or blades.'
      C: 'You went for snow. Snow is weather; the sentence is about size.'
  14:
    moments:
      - say: 'The most impressive effect of the explosion arises from gap 14. All four options start with pressure.'
        write: 'arises from pressure ___(14)___'
        point:
          - {passage: true, kind: label, target: 'the most impressive of these arises from', text: 'clue: the main effect of the blast'}
      - say: 'Now look at the rest of the passage. What keeps coming up?'
        write: 'shock waves ... blast wave ... gravity waves'
        point:
          - {line: 1, kind: highlight, at: 'shock waves ... blast wave ... gravity waves', text: 'the clue'}
          - {passage: true, kind: circle, target: 'blast wave', text: 'a wave'}
          - {passage: true, kind: circle, target: 'Another kind of wave', text: '“another”: the first was a wave too'}
      - say: 'Waves, again and again. The effect arises from pressure waves.'
        write: 'pressure waves'
        point:
          - {passage: true, kind: label, target: 'The gravity waves', text: 'waves again: the effect is waves'}
      - say: 'Pressure volume and pressure air are not real expressions.'
        write: 'pressure volume / air ✗'
        point:
          - {line: 3, kind: strike, at: 'pressure volume / air'}
      - say: 'A pressure gauge only measures pressure; it causes nothing.'
        write: 'gauge = measuring tool ✗'
        point:
          - {line: 4, kind: strike, at: 'gauge'}
      - say: 'So the gap is pressure waves, which is answer choice A.'
        write: 'A · pressure waves'
        answer: true
    traps:
      B: 'You went for pressure volume. It is not a phrase used in English, and the passage goes on to talk about waves.'
      C: 'You went for pressure air. That is not a real expression; we would say air pressure.'
      D: 'You went for pressure gauge. A gauge is the dial that measures pressure; it cannot be the source of the effects.'
  15:
    moments:
      - say: 'The immediate result of gap 15 is that the air around the bomb gets very hot.'
        write: 'the immediate result of the ___(15)___'
        point:
          - {line: 0, kind: highlight, at: 'immediate result', text: 'the clue'}
          - {passage: true, kind: label, target: 'The immediate result of the', text: 'the first thing that happens'}
      - say: 'What happens to a bomb first? It is set off. It explodes.'
        write: 'bomb is set off'
        point:
          - {line: 1, kind: highlight, at: 'bomb is set off', to: {passage: true, target: 'the explosion of hydrogen bomb'}}
          - {passage: true, kind: label, target: 'the explosion of hydrogen bomb', text: 'what a bomb does: it explodes'}
      - say: 'To detonate means to set off. The noun is detonation.'
        write: 'detonate = set off → detonation'
        point:
          - {line: 2, kind: circle, at: 'detonation', text: 'noun'}
      - say: 'Distortion is bending out of shape; reduction is making smaller.'
        write: 'distortion, reduction ✗'
        point:
          - {line: 3, kind: strike, at: 'distortion, reduction'}
          - {passage: true, kind: label, target: 'raised very rapidly', text: 'a violent blast: nothing gets smaller'}
      - say: 'So the gap is detonation, which is answer choice C.'
        write: 'C · detonation'
        answer: true
    traps:
      A: 'You went for reduction. Nothing is being made smaller; the air is being heated.'
      B: 'You went for commotion. A commotion is noisy confusion among people, not what heats the air.'
      D: 'You went for distortion. That means twisting out of shape; it is the explosion itself that heats the air.'
  16:
    moments:
      - say: 'The air is raised very rapidly to an enormously high gap 16.'
        write: 'raised ... to an enormously high ___(16)___'
        point:
