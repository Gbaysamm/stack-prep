# UTME 2014 Use of English — lessons for the board.
#
# Each lesson is a run of moments: what the coach says, and the short line written while it is
# said. Answers match explanations_2014.yaml.
format_version: 1
exam_year: 2014
lessons:
  1:
    moments:
      - say: 'This first question is not about English at all. It asks which version of the paper you have.'
        write: 'Which paper type is this?'
      - say: 'JAMB prints the paper type at the very top of the first page. Always look there first.'
        write: 'Look at the top of page 1'
      - say: 'On this paper, the top line reads PAPER TYPE: L.'
        write: 'PAPER TYPE: L'
        point:
          - {line: 2, kind: highlight, at: 'TYPE: L', text: 'our paper'}
      - say: 'So we match that letter with the options. F, E and S are other versions, not ours.'
        write: 'F, E, S = other versions'
        point:
          - {line: 3, kind: strike, at: 'F, E, S'}
      - say: 'So the answer is Type L, which is answer choice C.'
        write: 'C · Type L'
        answer: true
    traps:
      A: 'You went for Type F. That is a different version of the paper; this one says Type L at the top.'
      B: 'You went for Type E. Always copy the type printed at the top of your own paper, which here is L.'
      D: 'You went for Type S. That is another version. The top of this paper says Type L.'

  2:
    moments:
      - say: 'We want the statement about change that the passage supports.'
        write: 'What does the passage say about change?'
        point:
          - {passage: true, kind: label, target: 'radically altered the course of human civilization', text: 'change runs through all history'}
      - say: 'First clue: change is happening all over the world, and people feel a need for it.'
        write: '“the world is witnessing political and social changes”'
        point:
          - {passage: true, kind: circle, target: 'all over the globe', text: 'everywhere, right now'}
      - say: 'Second clue: the writer says change can be good or bad.'
        write: '“change can either be positive or negative”'
        point:
          - {line: 2, kind: highlight, at: 'positive or negative', text: 'the clue'}
          - {passage: true, kind: label, target: 'positive or negative', text: 'so not always “invaluable” (C)'}
      - say: 'Let us know the four words. Inimitable means cannot be copied. Inestimable means too great to measure.'
        write: 'inimitable = cannot be copied; inestimable = too great to measure'
      - say: 'Invaluable means extremely useful, always good. But the passage says change can be negative.'
        write: 'invaluable = very useful ✗ (change can be negative)'
        point:
          - {line: 4, kind: strike, at: 'invaluable = very useful'}
      - say: 'Inevitable means bound to happen. That matches change happening everywhere, driven by the need to change.'
        write: 'inevitable = bound to happen ✓'
        point:
          - {line: 1, kind: highlight, at: 'the world is witnessing political and social changes', text: 'the clue'}
          - {line: 5, kind: box, at: 'inevitable'}
          - {passage: true, kind: label, target: 'a collective response to the need to change', text: 'a need → change keeps coming'}
      - say: 'So the answer is change is inevitable, which is answer choice D.'
        write: 'D · Change is inevitable'
        answer: true
    traps:
      A: 'You went for inimitable, which means impossible to copy. The passage never says change cannot be copied.'
      B: 'You went for inestimable, too great to measure. The passage says nothing about measuring change.'
      C: 'You went for invaluable. It sounds like praise for change, but the passage says change can be negative, so it is not always valuable.'

  3:
    moments:
      - say: 'We must deduce how political and social changes are related.'
        write: 'Political change ↔ social change: related how?'
      - say: 'The third paragraph answers it directly.'
        write: '“they are analytically inseparable”'
        point:
          - {line: 1, kind: underline, at: 'inseparable', text: 'the clue'}
          - {passage: true, kind: label, target: 'may appear to be distinct phenomena', text: '“while”: looks separate, but ...'}
          - {passage: true, kind: circle, target: 'inseparable', text: 'cannot be pulled apart'}
      - say: 'Inseparable means they cannot be pulled apart. They are bound together.'
        write: 'inseparable = bound together'
        point:
          - {line: 2, kind: highlight, at: 'bound together', to: {passage: true, target: 'analytically inseparable'}}
      - say: 'The word for things wound together is intertwined.'
        write: 'intertwined = twisted together ✓'
        doodle: {name: 'custom:2014_q03_a', caption: 'intertwined = twisted together'}
        point:
          - {line: 1, kind: arrow, at: 'inseparable'}
          - {passage: true, kind: label, target: 'Political and social changes refer to alteration', text: 'one definition covers both'}
      - say: 'Independent is the opposite, and antithetical means opposed to each other.'
        write: 'independent, antithetical = opposite idea ✗'
        point:
          - {line: 4, kind: strike, at: 'independent, antithetical'}
          - {passage: true, kind: strike, target: 'distinct phenomena', text: 'only appears so (B, C)'}
      - say: 'So the answer is intertwined, which is answer choice A.'
        write: 'A · Intertwined'
        answer: true
    traps:
      B: 'You went for antithetical, which means opposed to each other. The passage says the two are inseparable, not opposed.'
      C: 'You went for independent. That is the opposite of inseparable. The writer says they only appear distinct.'
      D: 'You went for repulsive, meaning pushing each other away. Nothing in the passage says that.'

  4:
    moments:
      - say: 'A good title covers the whole passage, not one paragraph.'
        write: 'Title = covers the whole passage'
      - say: 'What does the passage talk about? Social change and political change, all the way through.'
        write: 'Topic: social change + political change'
        point:
          - {line: 1, kind: highlight, at: 'social change + political change', text: 'whole passage'}
          - {passage: true, kind: label, target: 'Political change and social transformation', text: 'para 1: both kinds of change'}
          - {passage: true, kind: label, target: 'While political and social changes', text: 'para 3: both again'}
      - say: 'It also ends on who holds and wields power.'
        write: '“the group … which controls and wields state power”'
        point:
          - {line: 2, kind: highlight, at: 'controls and wields state power', to: {passage: true, target: 'which controls and wields state power'}}
          - {passage: true, kind: label, target: 'capture political power', text: 'power → “political empowerment”'}
      - say: 'Option A covers only the paragraph on reasons. Option B covers only the struggle for power.'
        write: 'A, B = only one part ✗'
        point:
          - {line: 3, kind: strike, at: 'A, B'}
          - {passage: true, kind: label, target: 'caused by certain factors or reasons', text: 'reasons: one paragraph only (A)'}
      - say: 'Option C is just the name of the book it was adapted from.'
        write: 'C = the source book ✗'
        point:
          - {line: 4, kind: strike, at: 'C'}
          - {passage: true, kind: strike, target: 'Element of politics', text: 'the source book, not a title (C)'}
      - say: 'Only D brings in both social change and political power.'
        write: 'D = social + political ✓'
      - say: 'So the best title is Social change and political empowerment, which is answer choice D.'
        write: 'D · Social change and political empowerment'
        answer: true
    traps:
      A: 'You went for reasons for political change. The passage does give reasons, but only in part of it, and it also covers social change.'
      B: 'You went for the struggle for political power. That is one idea near the end, not the whole passage.'
      C: 'You went for Elements of politics. That is the name of the book the passage came from, not a title for what it says.'

  5:
    moments:
      - say: 'We want the meaning of alteration as used in the passage.'
        write: 'alteration = ?'
      - say: 'Look at the sentence. Alteration is paired with transformations.'
        write: '“alteration or transformations in human behaviour”'
        point:
          - {line: 1, kind: underline, at: 'alteration'}
          - {line: 1, kind: highlight, at: 'transformations', text: 'the clue'}
          - {passage: true, kind: circle, target: 'alteration or transformations', text: 'paired with a word for change'}
      - say: 'To alter something is to change it, like a tailor altering a dress.'
        write: 'alter = change'
        point:
          - {line: 2, kind: highlight, at: 'alter', to: {passage: true, target: 'alteration or transformations'}}
      - say: 'Modification also means a change to something.'
        write: 'modification = a change ✓'
        point:
          - {line: 2, kind: arrow, at: 'change'}
          - {passage: true, kind: label, target: 'alteration in the form of power', text: 'used again: a change in power'}
      - say: 'So the answer is modification, which is answer choice C.'
        write: 'C · Modification'
        answer: true
    traps:
      A: 'You went for multiplication. That means increasing in number, not changing.'
      B: 'You went for recognition. The word appears nearby in the passage, but it means noticing, not changing.'
      D: 'You went for complication, making something more difficult. An alteration is simply a change.'

  6:
    moments:
      - say: 'We need to infer what kind of creatures snakes are.'
        write: 'Snakes are … ?'
      - say: 'Here is the key line about their variety.'
        write: '“over two thousand five hundred species … more than ten families”'
        point:
          - {line: 1, kind: highlight, at: 'two thousand five hundred species', text: 'the clue', to: {passage: true, target: 'over two thousand five hundred species belonging to more than ten families'}}
          - {passage: true, kind: label, target: 'more than ten families', text: 'many different kinds'}
      - say: 'And they live everywhere, from burrows to treetops to the ocean.'
        write: 'burrows → treetops → ocean depths'
        point:
          - {line: 2, kind: highlight, at: 'burrows → treetops → ocean depths', to: {passage: true, target: 'snakes occupy habitat ranging from underground burrows to the top of the tree'}}
          - {passage: true, kind: label, target: 'their versatility', text: 'versatile: many kinds of places'}
      - say: 'Heterogeneous means made of many different kinds. Homogeneous means all the same.'
        write: 'heterogeneous = many kinds; homogeneous = all alike'
        doodle: {name: 'custom:2014_q06_a', caption: 'many kinds ↔ all alike'}
      - say: 'So many species in so many places are heterogeneous.'
        write: 'many species → heterogeneous ✓'
        point:
          - {line: 3, kind: strike, at: 'homogeneous = all alike'}
          - {line: 1, kind: arrow, at: 'two thousand five hundred species'}
          - {passage: true, kind: label, target: 'every continent except Antarctica', text: 'spread across the world'}
      - say: 'So the answer is heterogeneous creatures, which is answer choice A.'
        write: 'A · Heterogeneous creatures'
        answer: true
    traps:
      B: 'You went for voracious cow eaters. The passage says eating a cow is “uncommon”, and most snakes eat very little.'
      C: 'You went for great insect eaters. Insects are never mentioned in the passage.'
      D: 'You went for homogeneous, all the same. With 2,500 species in ten families, they are the opposite.'

  7:
    moments:
      - say: 'We want the most notable thing, the idea the passage spends most time on.'
        write: 'Most notable = the main idea'
      - say: 'The first paragraph is about eating. Some wait months between meals.'
        write: '“wait for months between successive meals”'
        point:
          - {passage: true, kind: label, target: 'can survive on an extremely meagre diet', text: 'meagre = very little food'}
      - say: 'A few eat just once or twice a year, and they swallow prey whole.'
        write: '“a large meal just once or twice a year”'
        point:
          - {line: 2, kind: highlight, at: 'once or twice a year', text: 'seldom'}
          - {passage: true, kind: circle, target: 'once or twice a year', text: 'seldom'}
      - say: 'The second paragraph goes on: they swallow animals larger than their heads.'
        write: '“animals that are far larger than their own heads”'
        point:
          - {line: 3, kind: highlight, at: 'far larger', text: 'big'}
          - {passage: true, kind: circle, target: 'far larger than their own heads', text: 'big'}
          - {passage: true, kind: label, target: 'swallow their prey whole', text: 'whole prey = big meals'}
      - say: 'Put together: they eat big, but not often. That is eat big but seldom.'
        write: 'big meals + rare meals = eat big but seldom ✓'
        doodle: {name: 'custom:2014_q07_a', caption: 'eat big, but seldom'}
        point:
          - {passage: true, kind: underline, target: 'Because they do not rely on energy from food to generate body heat'}
          - {passage: true, kind: label, target: 'cold-blooded', text: 'why they can eat so rarely'}
      - say: 'Gombe and Plateau come up once, in the last line. That is a detail, not the main point.'
        write: 'Gombe, Plateau = one detail ✗'
        point:
          - {line: 5, kind: strike, at: 'Gombe, Plateau'}
          - {passage: true, kind: strike, target: 'Plateau and Gombe states', text: 'one detail at the end (A)'}
      - say: 'So the answer is eat big but seldom, which is answer choice C.'
        write: 'C · Eat big but seldom'
        answer: true
    traps:
      A: 'You went for Gombe and Plateau. It is true that the passage mentions them, but only once at the very end. It is not the most notable thing about snakes.'
      B: 'You went for versatile in reproduction. The passage calls snakes versatile in where they live, and never talks about reproduction.'
      D: 'You went for exist in families. That is mentioned only to count the species; it is not what makes snakes notable.'

  8:
    moments:
      - say: 'We check each statement against the passage.'
        write: 'Which is true?'
      - say: 'The last paragraph says where there are no snakes.'
        write: '“The only places without snakes are parts of the Polar Regions”'
        point:
          - {line: 1, kind: highlight, at: 'without snakes are parts of the Polar Regions', text: 'the clue'}
          - {passage: true, kind: underline, target: 'The only places without snakes are parts of the Polar Regions'}
      - say: 'So snakes are not in the polar regions. That matches A.'
        write: 'A: not in the polar region ✓'
        point:
          - {line: 1, kind: arrow, at: 'Polar Regions'}
          - {passage: true, kind: label, target: 'parts of the Polar Regions', text: 'no snakes here → A is true'}
      - say: 'B says every continent, but the passage says every continent except Antarctica.'
        write: 'B: “every continent except Antarctica” ✗'
        point:
          - {line: 3, kind: underline, at: 'except Antarctica'}
          - {passage: true, kind: circle, target: 'except Antarctica', text: 'not EVERY continent (B)'}
      - say: 'C says Ireland has countless snakes, but Ireland is named as a place without them.'
        write: 'C: Ireland has none ✗'
        point:
          - {passage: true, kind: strike, target: 'the republic of Ireland', text: 'no snakes in Ireland (C)'}
      - say: 'D says seldom seen in Antarctica. In fact they are not found there at all.'
        write: 'D: not found at all, not “seldom” ✗'
        point:
          - {passage: true, kind: label, target: 'Antarctica', text: 'none at all, not “seldom” (D)'}
      - say: 'So the true statement is answer choice A.'
        write: 'A · Snakes are not in the polar region'
        answer: true
    traps:
      B: 'You went for every continent. Read to the end of the sentence: “every continent except Antarctica”.'
      C: 'You went for Ireland. The passage names Ireland as one of the places without snakes.'
      D: 'You went for seldom seen in Antarctica. Seldom means rarely, but the passage says they are not there at all.'

  9:
    moments:
      - say: 'We must pick what we can say about snakes. Let us test each option.'
        write: 'Snakes have … ?'
      - say: 'D says a large appetite for antelopes. But the passage calls that uncommon.'
        write: 'D: “Although uncommon” ✗'
        point:
          - {line: 1, kind: highlight, at: 'Although uncommon', text: 'the clue'}
          - {passage: true, kind: label, target: 'as large as an antelope or a small cow', text: 'rare, not a large appetite (D)'}
      - say: 'B says visible internal locomotive organs. Snakes have no legs, and inside organs are never visible.'
        write: 'B: no legs; organs not visible ✗'
        point:
          - {passage: true, kind: label, target: 'Many snakes have specialized jaws', text: 'only jaws: no talk of organs (B)'}
      - say: 'C, no visual sense of measurement, is not an idea the passage or biology supports.'
        write: 'C: not supported ✗'
      - say: 'A says no external auditory organ. That means no outer ears, and it is true of snakes.'
        write: 'auditory organ = ear; snakes have no outer ears ✓'
        doodle: {name: 'custom:2014_q09_a', caption: 'no outer ears: they feel vibrations'}
        point:
          - {line: 4, kind: underline, at: 'auditory organ = ear'}
          - {passage: true, kind: label, target: 'Like all reptiles, snakes', text: 'A: general knowledge about snakes'}
      - say: 'They feel vibrations through the ground instead of hearing through ears.'
        write: 'they sense vibrations instead'
      - say: 'So the best answer is no external auditory organ, which is answer choice A.'
        write: 'A · No external auditory organ'
        answer: true
    traps:
      B: 'You went for visible internal locomotive organs. Snakes have no legs, and internal organs are hidden inside the body.'
      C: 'You went for no visual sense of measurement. Nothing in the passage is about how snakes judge size by sight.'
      D: 'You went for a large appetite for antelopes. The passage says eating an antelope is uncommon, and most snakes eat very little.'

  10:
    moments:
      - say: 'A title must fit the whole passage.'
        write: 'Title = covers every paragraph'
      - say: 'Let us list what the passage covers: cold blood, diet, jaws, species, habitat.'
        write: 'cold blood · diet · jaws · species · where they live'
        point:
          - {line: 1, kind: highlight, at: 'cold blood', to: {passage: true, target: 'snakes are cold-blooded'}}
          - {line: 1, kind: highlight, at: 'jaws', to: {passage: true, target: 'specialized jaws'}}
          - {line: 1, kind: highlight, at: 'species', to: {passage: true, target: 'two thousand five hundred species'}}
      - say: 'These are many features of snakes. The word for features is characteristics.'
        write: 'many features = characteristics'
        point:
          - {line: 2, kind: box, at: 'characteristics'}
          - {passage: true, kind: label, target: 'snakes occupy habitat', text: 'another feature: where they live'}
      - say: 'Option A covers only feeding. Option D covers only species and places.'
        write: 'A, D = only one part ✗'
        point:
          - {line: 3, kind: strike, at: 'A, D'}
          - {passage: true, kind: label, target: 'extremely meagre diet', text: 'feeding: paragraph 1 only (A)'}
      - say: 'Option C mentions legs, which the passage never talks about.'
        write: 'C = “legless” not in passage ✗'
        point:
          - {line: 4, kind: strike, at: 'legless'}
          - {passage: true, kind: label, target: 'cold-blooded', text: '“legless” is never said (C)'}
      - say: 'So the best title is Some characteristics of snakes, which is answer choice B.'
        write: 'B · Some characteristics of snakes'
        answer: true
    traps:
      A: 'You went for feeding habits. Feeding is only the first part; the passage also covers species and where snakes live.'
      C: 'You went for legless, cold-blooded reptiles. Cold blood is mentioned, but legs never are, and it misses most of the passage.'
      D: 'You went for species in Nigeria and other lands. That is the last paragraph only.'

  11:
    moments:
      - say: 'Gap 11 is the person who sets up the newspaper and hires everyone.'
        write: 'The ___ has to employ a lot of people.'
        point:
          - {passage: true, kind: circle, target: 'has to employ a lot of people', text: 'clue: he hires everyone'}
          - {passage: true, kind: label, target: 'Setting up a newspaper', text: 'he sets it up: the owner'}
      - say: 'The next line says the others work with him. So he is the boss.'
        write: '“Other people working with him …”'
        point:
          - {line: 0, kind: highlight, at: 'has to employ a lot of people', text: 'the clue'}
          - {line: 1, kind: highlight, at: 'Other people working with him', to: {passage: true, target: 'Other people working with him'}}
          - {passage: true, kind: label, target: 'editors, typesetters', text: 'these are his employees'}
      - say: 'The person who owns a business and hires its workers is the proprietor.'
        write: 'proprietor = owner ✓'
      - say: 'A sub-editor and a lithographer are workers he would employ, not the employer.'
        write: 'sub-editor, lithographer = employees ✗'
        point:
          - {line: 3, kind: strike, at: 'sub-editor, lithographer'}
      - say: 'So gap 11 is proprietor, which is answer choice C.'
        write: 'C · proprietor'
        answer: true
    traps:
      A: 'You went for processor. That is not a job title in a newspaper, and it does not employ anyone.'
      B: 'You went for lithographer, a printer. He would be one of the people employed, not the one employing.'
      D: 'You went for sub-editor. A sub-editor is employed by the paper; the gap needs the owner who does the hiring.'

  12:
    moments:
      - say: 'Gap 12 is defined by the words straight after it.'
        write: '___ who go out and collect stories and items of news'
        point:
          - {line: 0, kind: highlight, at: 'who go out and collect stories', text: 'the clue'}
          - {passage: true, kind: circle, target: 'who go out and collect stories and items of news', text: 'clue: defines the gap'}
      - say: 'Who goes out to collect news? Reporters.'
        write: 'collect news = reporters ✓'
        point:
          - {line: 0, kind: arrow, at: 'collect stories'}
          - {line: 1, kind: highlight, at: 'collect news', to: {passage: true, target: 'collect stories and items of news'}}
      - say: 'Vendors sell papers. Agents handle business. Analysts study data.'
        write: 'vendors sell · agents do business · analysts study'
        point:
          - {passage: true, kind: label, target: 'go out', text: 'out in the field = reporters'}
      - say: 'Only reporters gather news.'
        write: 'only reporters gather news'
      - say: 'So gap 12 is reporters, which is answer choice B.'
        write: 'B · reporters'
        answer: true
    traps:
      A: 'You went for agents. Agents deal with sales and business, not with collecting news.'
      C: 'You went for analysts. Analysts comment on news; they do not go out to collect it.'
      D: 'You went for vendors. Vendors sell the paper on the street; they do not gather stories.'

  13:
    moments:
      - say: 'Gap 13 is defined by the clause after it.'
        write: '___, who specialize in one kind of topic'
        point:
          - {line: 0, kind: highlight, at: 'specialize in one kind of topic', text: 'the clue'}
          - {passage: true, kind: circle, target: 'specialize in one kind of topic', text: 'clue: “who” defines the gap'}
      - say: 'A journalist who covers just one area is a correspondent, like a sports correspondent.'
        write: 'sports correspondent, political correspondent'
        point:
          - {passage: true, kind: label, target: 'one kind of topic', text: 'e.g. sports or politics'}
      - say: 'So specializing in one topic points to correspondents.'
        write: 'one topic = correspondents ✓'
        point:
          - {line: 0, kind: arrow, at: 'one kind of topic'}
          - {line: 2, kind: highlight, at: 'one topic', to: {passage: true, target: 'specialize in one kind of topic'}}
      - say: 'Newscasters read news on air. Listeners and distributors do not write stories at all.'
        write: 'newscasters read on air · listeners, distributors ✗'
        point:
          - {line: 3, kind: strike, at: 'listeners, distributors'}
          - {passage: true, kind: label, target: 'collect stories and items of news', text: 'news gatherers: not listeners (C)'}
      - say: 'So gap 13 is correspondents, which is answer choice A.'
        write: 'A · correspondents'
        answer: true
    traps:
      B: 'You went for distributors. They move copies of the paper to sellers; they do not write on any topic.'
      C: 'You went for listeners. Listeners belong to radio, and they receive news rather than produce it.'
      D: 'You went for newscasters. They read news on radio or TV, and they do not specialize in one topic for a newspaper.'

  14:
    moments:
      - say: 'Gap 14 works closely with the editor-in-chief. Two clues follow.'
        write: 'works with the editor-in-chief'
        point:
          - {line: 0, kind: highlight, at: 'works with the editor-in-chief', to: {passage: true, target: 'works closely with the editor-in-chief'}}
          - {passage: true, kind: label, target: 'Another important person', text: 'a senior staff member'}
      - say: 'The key clue: this person chooses the most important stories.'
        write: '“has to choose the most important stories”'
        point:
          - {line: 1, kind: highlight, at: 'choose the most important stories', text: 'the clue'}
          - {passage: true, kind: circle, target: 'choose the most important stories', text: 'clue: picks the top news'}
      - say: 'Deciding which news matters most is the job of the news editor.'
        write: 'choose top stories = news editor ✓'
        point:
          - {line: 1, kind: arrow, at: 'choose the most important stories'}
      - say: 'A proofreader checks spelling. A reporter gathers news. An announcer speaks on radio.'
        write: 'proofreader checks · reporter gathers · announcer = radio'
        point:
          - {passage: true, kind: label, target: 'who go out and collect stories', text: 'the reporter (D) is gap 12'}
      - say: 'So gap 14 is news editor, which is answer choice B.'
        write: 'B · news editor'
        answer: true
    traps:
      A: 'You went for announcer. Announcers work in radio and television, not beside a newspaper’s editor-in-chief.'
      C: 'You went for proofreader. A proofreader corrects errors; he does not choose which stories are most important.'
      D: 'You went for reporter. Reporters collect stories; someone else decides which ones matter most.'

  15:
    moments:
      - say: 'Gap 15 is the people who work on stories after they come in.'
        write: '___ go through stories sent to make necessary adjustments'
        point:
          - {line: 0, kind: highlight, at: 'go through stories sent to make necessary adjustments', text: 'the clue'}
          - {passage: true, kind: circle, target: 'go through stories sent', text: 'clue: they check others'' stories'}
          - {passage: true, kind: label, target: 'make necessary adjustments', text: 'adjust = edit'}
      - say: 'Going through other people’s stories and adjusting them is editing.'
