# UTME 2015 Use of English — lessons for the board.
#
# Each lesson is a run of moments: what the teacher says, and the one line written while it
# is said. Answers match explanations_2015.yaml. Unrecoverable items (7-10, 20, 21-35, 71) have none.
format_version: 1
exam_year: 2015
lessons:
  1:
    moments:
      - say: 'We want the meaning of the expression third party, as the passage uses it.'
        write: 'third party = ?'
      - say: 'Find it. The passage names two ways of managing a conflict: negotiation and mediation.'
        write: 'negotiation vs mediation'
        point:
          - {line: 1, kind: highlight, at: 'negotiation', to: {passage: true, target: '''negotiation'', that is, direct bargaining'}}
          - {line: 1, kind: highlight, at: 'mediation', to: {passage: true, target: '''mediation'', that is with the help of a third party'}}
      - say: 'Negotiation is direct bargaining by the parties themselves: just the two sides, face to face.'
        write: 'negotiation = the two sides bargain directly'
        doodle: {name: 'custom:2015_q01_a', id: talks, caption: 'two sides in a conflict'}
        point:
          - {passage: true, kind: circle, target: 'direct bargaining by the parties involved', text: 'the two sides alone'}
      - say: 'Mediation is done, and here is our phrase, with the help of a third party: someone steps in between.'
        write: '"mediation ... with the help of a third party"'
        doodle_do:
          - {id: talks, op: stage, stage: 'custom:2015_q01_a2'}
        point:
          - {line: 3, kind: highlight, at: 'with the help of a third party', text: 'the clue'}
          - {passage: true, kind: circle, target: 'third party', text: 'someone outside the two sides', nth: 2}
      - say: 'So a third party is an outsider who steps in, like the calm figure in the middle, to help the two sides settle. That is a mediator.'
        write: 'third party = outsider who helps settle = mediator'
        doodle_do:
          - {id: talks, op: label, part: mediator, text: mediator}
        point:
          - {line: -1, kind: arrow}
          - {passage: true, kind: label, target: 'a party to a conflict or third party', text: 'third party: not one of the sides'}
          - {passage: true, kind: label, target: 'with the help of', text: 'helps, not intrudes (B)'}
      - say: 'So the answer is mediator, which is answer choice D.'
        write: 'D · mediator'
        answer: true
        point:
          - {line: 4, kind: highlight, at: mediator, to: {doodle: talks, part: mediator}}
    traps:
      A: 'You went for politician. A politician may get involved in conflicts, but the passage uses third party for anyone outside the quarrel who helps settle it, not for a job.'
      B: 'You went for intruder. An intruder is an outsider too, but an unwelcome one who pushes in. The third party here is invited to help.'
      C: 'You went for conformist. A conformist is someone who goes along with the crowd; it has nothing to do with settling a conflict.'
  2:
    moments:
      - say: 'We are asked what can be deduced from the passage. A deduction must rest on something the passage says.'
        write: 'Deduce: what does the passage support?'
      - say: 'Look at what the passage says physical force can do: create a situation in which talks can happen. Here is the key line.'
        write: '"create a situation in which diplomatic negotiations can occur"'
        doodle: {name: 'custom:2015_q02_a', id: war, caption: 'force first'}
        point:
          - {line: 1, kind: highlight, at: 'create a situation in which diplomatic negotiations can occur', text: 'the clue'}
          - {passage: true, kind: label, target: 'The use of physical force', text: 'force can lead to talks'}
      - say: 'So force changes the situation until talking becomes possible: the fighters end up at the table.'
        write: 'circumstances → push a warring side to talk peace'
        doodle_do:
          - {id: war, op: stage, stage: 'custom:2015_q02_a2'}
        point:
          - {line: 2, kind: highlight, at: 'push a warring side to talk peace', to: {passage: true, target: 'create a situation in which diplomatic negotiations can occur'}}
          - {line: 2, kind: highlight, at: 'push a warring side to talk peace', to: {doodle: war, part: table}}
      - say: 'Now test A and B. Both say all nations do one thing. But the passage says each approach suits particular circumstances.'
        write: 'A, B: "all nations" — passage says it depends'
        point:
          - {line: 3, kind: underline, at: 'all nations', text: 'too strong'}
          - {passage: true, kind: underline, target: 'each of which may have utility in particular circumstances'}
          - {passage: true, kind: label, target: 'particular circumstances', text: 'it depends: not “all nations” (A, B)'}
      - say: 'D says conflicts are known for creating opportunities. The passage never says that.'
        write: 'D: not in the passage'
        point:
          - {passage: true, kind: label, target: 'impose a settlement', text: 'opportunities? never said (D)'}
      - say: 'Only C matches: prevailing circumstances push a warring nation to sue for peace. That is answer choice C.'
        write: 'C · circumstances push a nation to sue for peace'
        doodle_do:
          - {id: war, op: pulse, part: table}
        answer: true
    traps:
      A: 'You went for all nations adopt the peaceful approach. The word all is the problem: the passage says different approaches suit different circumstances.'
      B: 'You went for all nations prefer the military option. Again all is too strong, and the passage does not say anyone prefers force.'
      D: 'You went for conflicts are noted for facilitating opportunities. It sounds wise, but the passage never says it. It says force can make negotiation possible, which is option C.'
  3:
    moments:
      - say: 'Which statement can be inferred? Start with the very first sentence of the passage.'
        write: '"each of which may have utility in particular circumstances"'
        point:
          - {line: 0, kind: highlight, at: 'particular circumstances', text: 'the clue'}
          - {passage: true, kind: label, target: 'may have utility', text: 'utility = usefulness'}
      - say: 'Utility means usefulness. So each approach is useful in some circumstances, not all, like each tool for its own job.'
        write: 'each approach suits its own situation'
        doodle: {name: 'custom:2015_q03_a', id: tools, caption: 'each tool suits its own job'}
        point:
          - {line: 1, kind: highlight, at: 'each approach suits its own situation', to: {passage: true, target: 'each of which may have utility in particular circumstances'}}
      - say: 'The next sentence agrees: scholars study in what situations each works best.'
        write: '"in what situations ... applied most effectively"'
        point:
          - {line: 2, kind: highlight, at: 'applied most effectively', to: {passage: true, target: 'in what situations different approaches can be applied most effectively'}}
          - {passage: true, kind: circle, target: 'in what situations', text: 'it depends on the situation'}
      - say: 'So the approach to use depends on the situation, the job in hand: the state of affairs.'
        write: 'approach depends on the state of affairs'
        doodle_do:
          - {id: tools, op: circle, part: nail}
          - {id: tools, op: circle, part: lock}
        point:
          - {line: 3, kind: highlight, at: 'depends on the state of affairs', to: {doodle: tools, part: lock}}
      - say: 'B says only one approach fits all situations, and C says all approaches fit all situations. Both clash with the first sentence.'
        write: 'B, C: contradict "particular circumstances"'
        doodle_do:
          - {id: tools, op: label, part: nail, text: 'one tool for every job? no'}
        point:
          - {line: 0, kind: arrow}
          - {passage: true, kind: label, target: 'many different approaches', text: 'many, not “only one” (B)'}
      - say: 'So the answer is that the approach depends on the state of affairs, which is answer choice A.'
        write: 'A · depends on the state of affairs'
        answer: true
    traps:
      B: 'You went for only one approach in all situations. The passage says the opposite: there are many approaches, each useful in particular circumstances.'
      C: 'You went for all approaches in all situations. That ignores the word particular: each approach is useful in some situations, not every one.'
      D: 'You went for general disagreement among scholars. The passage says much scholarship has been devoted to the topic, but it never mentions scholars disagreeing.'
  4:
    moments:
      - say: 'How does the passage describe the different approaches to conflict management?'
        write: 'approaches are ... ?'
      - say: 'It says each may have utility, and that a great deal of scholarship has been devoted to them.'
        write: '"utility" + "a great deal of scholarship"'
        point:
          - {line: 1, kind: highlight, text: 'the clue'}
          - {passage: true, kind: circle, target: 'utility', text: 'useful'}
          - {passage: true, kind: circle, target: 'A great deal of scholarship', text: 'studied a lot: important'}
      - say: 'So the writer treats them as useful and important, like the foundation a building stands on. That rules out the negative words.'
        write: 'useful, important → not negative'
        doodle: {name: 'custom:2015_q04_a', id: base, caption: 'useful and important'}
      - say: 'Pernicious means harmful, and misleading means giving a wrong idea. Both are negative.'
        write: 'pernicious = harmful, misleading = false: out'
        point:
          - {line: 3, kind: strike, at: 'pernicious'}
          - {line: 3, kind: strike, at: 'misleading'}
      - say: 'Uniform means all the same, but the passage stresses how different they are.'
        write: 'uniform = all alike: out ("many different approaches")'
        point:
          - {passage: true, kind: strike, target: 'many different approaches', text: 'different, so not uniform (B)'}
      - say: 'Fundamental means basic and important: the foundation stones. So the answer is fundamental, which is answer choice D.'
        write: 'D · fundamental'
        doodle_do:
          - {id: base, op: label, part: base, text: 'fundamental = basic'}
        answer: true
        point:
          - {passage: true, kind: label, target: 'two broad categories', text: 'basic ways to manage conflict'}
          - {line: 5, kind: highlight, at: fundamental, to: {doodle: base, part: base}}
    traps:
      A: 'You went for pernicious. That means harmful, and the passage never suggests the approaches do harm; it says they have utility.'
      B: 'You went for uniform. Uniform means all the same, but the passage opens with many different approaches.'
      C: 'You went for misleading. Nothing in the passage says the approaches mislead anyone; the tone is positive.'
  5:
    moments:
      - say: 'What does utility mean in the passage? Find the word first.'
        write: '"each of which may have utility in particular circumstances"'
        point:
          - {line: 0, kind: underline, at: 'utility', text: 'the word'}
          - {passage: true, kind: circle, target: 'utility', text: 'the word'}
      - say: 'Utility is the noun from use. It means usefulness, like a handy tool.'
        write: 'utility = usefulness'
        doodle: {name: 'custom:2015_q05_a', id: tool, caption: 'utility = usefulness'}
        point:
          - {line: -1, kind: arrow}
          - {passage: true, kind: label, target: 'in particular circumstances', text: 'useful in some cases'}
      - say: 'Put it back in: each approach may have usefulness in particular circumstances. That reads well.'
        write: 'each approach may be useful in some cases ✓'
        doodle_do:
          - {id: tool, op: pulse, part: tick}
        point:
          - {line: 2, kind: highlight, at: 'each approach may be useful in some cases', to: {passage: true, target: 'each of which may have utility in particular circumstances'}}
      - say: 'Try difficulty or attitude in the same place: the sentence stops making sense. Management just repeats the topic.'
        write: 'difficulty, attitude, management: do not fit'
        point:
          - {passage: true, kind: label, target: 'can be applied most effectively', text: 'works well = useful, not difficult'}
      - say: 'So the answer is usefulness, which is answer choice C.'
        write: 'C · usefulness'
        answer: true
    traps:
      A: 'You went for difficulty. The passage is saying the approaches help in some situations, not that they are hard.'
      B: 'You went for attitude. An approach may reflect an attitude, but utility is about being useful.'
      D: 'You went for management. It is in the topic, conflict management, which makes it tempting, but it is not what utility means.'
  6:
    moments:
      - say: 'We need the meaning of couched. Start with a plain idea.'
        write: 'couched = ?'
        doodle: {name: 'custom:2015_q06_a', id: idea, caption: 'an idea'}
        point:
          - {passage: true, kind: label, target: 'with the help of a third party', text: 'text stops here: no “couched”'}
      - say: 'We use couch for words: a message couched in polite language is a message put into polite words, wrapped like this.'
        write: '"a request couched in polite language"'
        doodle_do:
          - {id: idea, op: stage, stage: 'custom:2015_q06_a2'}
        point:
          - {line: 1, kind: underline, at: 'couched in polite language'}
      - say: 'So to couch an idea is to express it in a certain way.'
        write: 'couched = put into words = expressed'
        doodle_do:
          - {id: idea, op: label, part: words, text: expressed}
        point:
          - {line: -1, kind: arrow}
          - {line: 2, kind: highlight, at: expressed, to: {doodle: idea, part: words}}
      - say: 'Arranged and itemized are about putting things in order or in a list. Modified means changed.'
        write: 'arranged, itemized = ordered; modified = changed'
        point:
          - {line: 3, kind: strike}
      - say: 'So the answer is expressed, which is answer choice B.'
        write: 'B · expressed'
        answer: true
    traps:
      A: 'You went for arranged. Couched is about the words chosen, not the order things are put in.'
      C: 'You went for modified. Couching an idea is expressing it, not changing it.'
      D: 'You went for itemized. That means listed item by item, which is not what couched means.'
  11:
    moments:
      - say: 'Gap 11. The parents had pre-conceived notions of certain professions and ignored their children''s interest.'
        write: '"pre-conceived notions of ___ professions"'
        point:
          - {passage: true, kind: circle, target: 'pre-conceived notions', text: 'fixed ideas about jobs'}
          - {passage: true, kind: label, target: 'the insistence of parents', text: 'parents pushed their choice'}
      - say: 'These parents pushed their children into careers they admired. Nobody pushes a child into a career they look down on.'
        write: 'parents push children towards admired jobs'
        doodles:
          - {name: 'custom:2015_q11_a', id: jobs, caption: 'the careers parents admired'}
          - {name: student-small, id: kids, caption: 'their children', repeat: 6, layout: row}
        point:
          - {line: 1, kind: highlight, at: 'parents push children', to: {passage: true, target: 'through the insistence of parents'}}
          - {passage: true, kind: label, target: 'gave little consideration to their children''s interest', text: 'ignored what the child wanted'}
      - say: 'The passage later names the careers: engineering, medicine, the sciences and law. Respected jobs, all with stars.'
        write: '"engineering, medicine, the sciences and law"'
        doodle_do:
          - {id: jobs, op: circle, part: careers}
        point:
          - {line: 2, kind: highlight, text: 'the clue'}
          - {passage: true, kind: circle, target: 'engineering, medicine, the sciences and law', text: 'respected careers'}
      - say: 'Prestigious means highly respected. That fits.'
        write: 'prestigious = highly respected ✓'
        doodle_do:
          - {id: jobs, op: label, part: stars, text: prestigious}
        point:
          - {line: 3, kind: highlight, at: prestigious, to: {doodle: jobs, part: stars}}
      - say: 'Insignificant, inferior and debased all mean low or worthless. They point the wrong way.'
        write: 'insignificant, inferior, debased = low: ✗'
        point:
          - {line: 4, kind: strike, at: 'insignificant, inferior, debased'}
      - say: 'So the answer is prestigious, which is answer choice B.'
        write: 'B · prestigious'
        doodle_do:
          - {id: kids, op: group, n: 6, text: 'pushed towards them'}
        answer: true
    traps:
      A: 'You went for insignificant. That means unimportant, but parents insisted on these professions, which they would only do for jobs they thought important.'
      C: 'You went for inferior. Parents would not force their children towards careers they thought were lower than others.'
      D: 'You went for debased. Debased means lowered in value, the opposite of the admired careers the passage lists.'
  12:
    moments:
      - say: 'Gap 12. Students'' career decisions were also something by the type of schools they attended.'
        write: '"career decisions were also ___ by the type of schools"'
        point:
          - {line: 0, kind: highlight, at: 'by the type of schools', to: {passage: true, target: 'by the type of secondary schools they attended'}}
      - say: 'Also links this to the parents. The parents shaped the choices; now the schools steer them too.'
        write: '"also" → like the parents, the schools shaped choices'
        doodle: {name: 'custom:2015_q12_a', id: school, caption: 'schools shaped choices too'}
        point:
          - {line: 1, kind: highlight, at: 'also', text: 'the clue'}
          - {passage: true, kind: circle, target: 'also', text: '“also”: a second influence'}
          - {passage: true, kind: label, target: 'the insistence of parents', text: 'first influence: the parents'}
      - say: 'Influenced means shaped or affected. That is the idea.'
        write: 'influenced = shaped ✓'
        doodle_do:
          - {id: school, op: label, part: arrows, text: 'influenced = shaped'}
        point:
          - {line: 2, kind: highlight, at: influenced, to: {doodle: school, part: arrows}}
      - say: 'The next paragraph shows schools pushing students into careers, not holding them back. So hampered and subdued do not fit.'
        write: 'hampered = held back; subdued = quietened: ✗'
        point:
          - {line: 3, kind: strike}
          - {passage: true, kind: label, target: 'students often ended up in engineering', text: 'schools steered choices, not blocked'}
      - say: 'Rejected makes no sense: schools did not reject decisions.'
        write: 'rejected: ✗'
      - say: 'So the answer is influenced, which is answer choice A.'
        write: 'A · influenced'
        answer: true
    traps:
      B: 'You went for hampered. That means held back, but the schools pushed students towards careers; they did not stop them choosing.'
      C: 'You went for subdued. Subdued means brought under control or made quieter. It does not describe how a school shapes a career choice.'
      D: 'You went for rejected. The schools did not throw out students'' decisions; they shaped them.'
  13:
    moments:
      - say: 'Gap 13. Competition was something among these schools. Read the next sentence for the clue.'
        write: '"competition was ___ among these schools"'
        point:
          - {passage: true, kind: circle, target: 'competition was', text: 'clue: how strong?'}
      - say: 'Each school strived to excel in sports or academics, trophy against trophy.'
        write: '"Each strived to ... excel"'
        doodle: {name: 'custom:2015_q13_a', id: rivals, caption: 'schools striving against each other'}
        point:
          - {line: 1, kind: highlight, at: 'strived to excel', text: 'the clue'}
          - {passage: true, kind: circle, target: 'Each strived to carve', text: 'every school fought to lead'}
      - say: 'And later the writer calls it a spirit of rivalry.'
        write: '"This spirit of rivalry ..."'
        point:
          - {line: 2, kind: highlight, at: 'spirit of rivalry', text: 'the clue'}
          - {passage: true, kind: circle, target: 'spirit of rivalry', text: 'rivalry = strong competition'}
      - say: 'Schools striving against one another: the rivalry meter shoots up. The competition was high.'
        write: 'strived + rivalry → high competition'
        doodle_do:
          - {id: rivals, op: fill, to: 0.9}
          - {id: rivals, op: label, part: meter, text: high}
        point:
          - {passage: true, kind: label, target: 'privately owned', text: 'many private schools competing'}
          - {line: 3, kind: highlight, at: 'high competition', to: {doodle: rivals, part: meter}}
      - say: 'Minimal, low and moderate all make it weak, which clashes with the rivalry.'
        write: 'minimal, low, moderate: ✗'
        point:
          - {line: 4, kind: strike}
      - say: 'So the answer is high, which is answer choice A.'
        write: 'A · high'
        answer: true
    traps:
      B: 'You went for minimal. That means very little, but the schools were striving and full of rivalry.'
      C: 'You went for low. The passage describes a strong spirit of rivalry, not low competition.'
      D: 'You went for moderate. Moderate is in-between, but each school strived hard to excel, so the competition was high.'
  14:
    moments:
      - say: 'Gap 14. Each school strived to carve an something for herself by excelling in sports or academics.'
        write: '"carve an ___ for herself by excelling"'
        point:
          - {passage: true, kind: circle, target: 'carve an', text: '“an” needs a vowel word'}
      - say: 'What do you win by excelling? A good name, a reputation, shining on the school''s front.'
        write: 'excelling → a good name'
        doodle: {name: 'custom:2015_q14_a', id: school, caption: 'what excelling wins'}
        point:
          - {line: 0, kind: highlight, at: 'by excelling', text: 'the clue'}
          - {passage: true, kind: label, target: 'by excelling in sports or academics', text: 'excelling earns a good name'}
      - say: 'To carve an image for yourself is to build a reputation. Image also starts with a vowel, so it fits an.'
        write: 'carve an image = build a reputation ✓'
        doodle_do:
          - {id: school, op: label, part: badge, text: 'image = reputation'}
        point:
          - {line: 2, kind: highlight, at: 'build a reputation', to: {passage: true, target: 'carve an'}}
          - {line: 2, kind: highlight, at: 'carve an image', to: {doodle: school, part: badge}}
      - say: 'You do not win an attitude or an effort by excelling. The effort is how you excel, not what you gain.'
        write: 'attitude, effort: not what excelling earns'
        point:
          - {line: 3, kind: strike, at: 'attitude, effort'}
      - say: 'Avenue means a way or route; carving an avenue by excelling does not make sense here.'
        write: 'avenue = a way: ✗'
      - say: 'So the answer is image, which is answer choice B.'
        write: 'B · image'
        answer: true
    traps:
      A: 'You went for attitude. It starts with a vowel, so it fits the an, but excelling in sports earns a school a reputation, not an attitude.'
      C: 'You went for effort. Excelling takes effort, but effort is what you put in, not what you carve out for yourself.'
      D: 'You went for avenue. An avenue is a way or opportunity; the sentence is about the name a school makes for itself.'
  15:
    moments:
      - say: 'Gap 15. Junior students tried to do something to the career choices of their seniors.'
        write: '"Junior students tried to ___ the career choices of their seniors"'
        point:
          - {passage: true, kind: circle, target: 'Junior students', text: 'juniors look up to seniors'}
          - {passage: true, kind: label, target: 'the career choices of their seniors', text: 'they followed the seniors'' paths'}
      - say: 'In a school full of rivalry and pride, juniors look up to their seniors, like this proud one.'
        write: 'juniors look up to seniors'
        doodle: {name: 'custom:2015_q15_a', id: copy, caption: 'juniors look up to seniors'}
        point:
          - {line: 1, kind: highlight, at: 'look up to', text: 'the clue'}
          - {line: 1, kind: highlight, at: 'juniors look up to seniors', to: {passage: true, target: 'Junior students tried to'}}
      - say: 'Emulate means to copy someone you admire: the junior strikes the very same pose.'
        write: 'emulate = copy someone you admire ✓'
        doodle_do:
          - {id: copy, op: stage, stage: 'custom:2015_q15_a2'}
        point:
          - {line: -1, kind: arrow}
          - {line: 2, kind: highlight, at: emulate, to: {doodle: copy, part: junior}}
      - say: 'Appreciate means value or admire, but it does not mean follow. The juniors went further: they copied.'
        write: 'appreciate = value (not follow)'
      - say: 'Reject and denounce go against the admiring tone.'
        write: 'reject, denounce: ✗'
        point:
          - {line: 4, kind: strike}
          - {passage: true, kind: label, target: 'This spirit of rivalry', text: 'pride, not rejection (C, D)'}
      - say: 'So the answer is emulate, which is answer choice B.'
        write: 'B · emulate'
        answer: true
    traps:
      A: 'You went for appreciate. Juniors did admire their seniors, but the sentence is about what they did with their seniors'' choices: they copied them.'
      C: 'You went for reject. That clashes with the admiration in the paragraph; students followed their seniors into the same careers.'
      D: 'You went for denounce. To denounce is to criticise publicly, the opposite of what the juniors did.'
  16:
    moments:
      - say: 'Gap 16. One problem is the something shortage of career development officers.'
        write: '"the ___ shortage of ... officers"'
        point:
          - {passage: true, kind: circle, target: 'shortage', text: 'clue: how bad a shortage?'}
      - say: 'The writer calls it a problem, and then says these few officers: one officer, and a long queue of students.'
        write: '"One such problem" + "These few officers"'
        doodles:
          - {name: 'custom:2015_q16_a', id: officer, caption: 'these few officers'}
          - {name: student-small, id: queue, caption: 'students waiting', repeat: 14, layout: row}
        point:
          - {line: 1, kind: highlight, at: 'One such problem', text: 'the clue'}
          - {passage: true, kind: label, target: 'beset with many problems', text: 'a list of problems follows'}
      - say: 'Acute means severe. We often say an acute shortage: far too few officers for all these students.'
        write: 'acute = severe ✓'
        doodle_do:
          - {id: queue, op: group, n: 14, text: 'far too many for one'}
          - {id: officer, op: label, part: one, text: 'acute = severe'}
        point:
          - {passage: true, kind: label, target: 'These few officers', text: '“few”: a serious shortage'}
      - say: 'Mild and average would make the problem small. Slow does not describe a shortage at all.'
        write: 'mild, average = small; slow: ✗'
        doodle_do:
          - {id: officer, op: pulse, part: officer}
        point:
          - {line: 3, kind: strike}
      - say: 'So the answer is acute, which is answer choice B.'
        write: 'B · acute'
        answer: true
    traps:
      A: 'You went for mild. A mild shortage is hardly a problem, but the writer lists it as one.'
      C: 'You went for slow. A shortage is not fast or slow; it is small or severe.'
      D: 'You went for average. The writer stresses the problem; an average shortage does not do that.'
