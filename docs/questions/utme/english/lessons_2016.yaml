# UTME 2016 Use of English — lessons for the board.
#
# Each lesson is a run of moments: what the teacher says, and the one line written while it
# is said. Answers match explanations_2016.yaml. Unrecoverable items (21-35) have none.
format_version: 1
exam_year: 2016
lessons:
  1:
    moments:
      - say: 'We want the writer''s view in the last paragraph. Let us go straight there.'
        write: 'Last paragraph: writer''s view = ?'
        point:
          - {passage: true, kind: label, target: 'Strict observance of these moral rules', text: 'the last paragraph starts here'}
      - say: 'Here is the key line, near the end, about alcohol consumers and cigarette smokers.'
        write: '"there seems to be a growing number of ... consumers and smokers"'
        doodle: {name: 'custom:2016_q01_a', id: trend, caption: 'drinkers and smokers'}
        point:
          - {line: 1, kind: highlight, at: 'seems to be a growing number', text: 'the clue'}
          - {passage: true, kind: underline, target: 'there seems to be a growing number of alcohol consumers and cigarette smokers', text: 'the writer''s view'}
          - {passage: true, kind: circle, target: 'seems', text: 'careful word: not certain'}
      - say: 'Notice the word seems. The writer is careful, not certain.'
        write: 'seems = appears (not certainly)'
        point:
          - {line: 2, kind: highlight, at: 'seems = appears', to: {passage: true, target: 'seems'}}
      - say: 'Growing number means more people are taking up these habits, more and more of them.'
        write: 'growing number = more people drinking and smoking'
        doodle_do:
          - {id: trend, op: stage, stage: 'custom:2016_q01_a2'}
        point:
          - {line: 3, kind: highlight, at: 'more people drinking and smoking', to: {passage: true, target: 'a growing number'}}
          - {line: 3, kind: highlight, at: 'more people', to: {doodle: trend, part: people}}
      - say: 'Option A says certainly. That is stronger than seems, so A goes. The arrow only seems to rise.'
        write: 'A: "certainly" ✗   C: sales ✗   D: abstain ✗'
        doodle_do:
          - {id: trend, op: label, part: more, text: 'seems: not certainly'}
        point:
          - {line: 4, kind: strike, at: 'certainly'}
          - {passage: true, kind: strike, target: 'abstain from alcohol and smoking', text: 'D: a religious rule, not the trend'}
          - {passage: true, kind: label, target: 'cripple the breweries', text: 'C: no sales figures anywhere'}
      - say: 'So the answer is more people appear to take to drinking and smoking, which is answer choice B.'
        write: 'B · more people appear to take to drinking and smoking'
        point:
          - {line: 1, kind: arrow, text: 'the clue'}
        answer: true
    traps:
      A: 'You went for the number is certainly increasing. Close, but the writer only says it seems to be growing. Certainly is too strong.'
      C: 'You went for sales have improved tremendously. The paragraph talks about the number of drinkers and smokers, not sales figures.'
      D: 'You went for more people now abstain. The paragraph says the opposite: the number of drinkers and smokers is growing.'
  2:
    moments:
      - say: 'We are asked how morality, religion and economy are related in the passage. Morals and religion first.'
        write: 'morality + religion + economy = ?'
        doodle: {name: 'custom:2016_q02_a', id: links, caption: 'how are they related?'}
        point:
          - {passage: true, kind: label, target: 'associated with religion', text: 'morality + religion together'}
      - say: 'Find the sentence that joins them, which says moral rules from religion tend to lead on to economic problems. Now economy joins too.'
        write: '"moral principles ... religion tend to lead on to economic problems"'
        doodle_do:
          - {id: links, op: stage, stage: 'custom:2016_q02_a2'}
        point:
          - {line: 1, kind: highlight, at: 'tend to lead on to', text: 'the link'}
          - {passage: true, kind: underline, target: 'tend to lead on to economic problems', text: 'and the economy joins in'}
      - say: 'So they are linked. That rules out different and unrelated.'
        write: 'linked → C, D ✗'
        point:
          - {passage: true, kind: label, target: 'the breweries, the cigarette factories', text: 'religious rules hurt business'}
      - say: 'Now look at the soft words on those links, some and tend to. Later the writer says could and seems.'
        write: 'some · tend to · could · seems = careful, partial'
        doodle_do:
          - {id: links, op: label, part: link2, text: 'soft links: some, tend to'}
        point:
          - {line: 3, kind: underline, at: 'some · tend to · could · seems', text: 'soft words'}
          - {passage: true, kind: circle, target: 'Some moral', text: 'soft: only some'}
          - {passage: true, kind: circle, target: 'could cripple', text: 'soft: could, not will'}
      - say: 'A link described so carefully is a partial link, which means somewhat, not clearly.'
        write: 'somewhat (partly) > clearly (strongly)'
        doodle_do:
          - {id: links, op: pulse, part: link2}
        point:
          - {line: 4, kind: highlight, at: 'somewhat (partly)', to: {passage: true, target: 'there seems to be'}}
          - {line: 4, kind: highlight, at: 'somewhat (partly)', to: {doodle: links, part: link2}}
      - say: 'So the answer is somewhat interconnected, which is answer choice A.'
        write: 'A · somewhat interconnected'
        answer: true
    traps:
      B: 'You went for clearly interconnected. They are connected, but the writer uses soft words like some and tend to, so clearly is stronger than he claims.'
      C: 'You went for certainly different. The passage links them: religious rules lead on to economic problems.'
      D: 'You went for certainly unrelated. The whole last part of the passage shows how religion and morals affect the economy.'
  3:
    moments:
      - say: 'We want the moralist''s idea. The very first sentence gives it.'
        write: 'moralist idea = ?'
        point:
          - {passage: true, kind: label, target: 'The African moralist has always regarded', text: 'the moralist''s view opens it'}
      - say: 'Here it is, from the moralist himself.'
        write: '"regarded smoking as an indication of moral degradation"'
        doodle: {name: 'custom:2016_q03_a', id: moralist, caption: 'the African moralist'}
        point:
          - {line: 1, kind: highlight, at: 'moral degradation', text: 'the clue'}
          - {passage: true, kind: circle, target: 'moral degradation', text: 'a fall into bad behaviour'}
      - say: 'Moral degradation is a fall into bad behaviour.'
        write: 'moral degradation = sinking into bad behaviour'
      - say: 'So to the moralist, smoking is bad and not acceptable, which is why it is crossed out, a fall downwards.'
        write: 'smoking = bad, unacceptable'
        doodle_do:
          - {id: moralist, op: stage, stage: 'custom:2016_q03_a2'}
        point:
          - {passage: true, kind: label, target: 'accepted the moralist idea on smoking', text: 'the idea is about smoking'}
      - say: 'D says a little alcohol is fine. But the moralist calls alcohol a sign of wretchedness.'
        write: 'D ✗ alcohol = "a sign of wretchedness"'
        doodle_do:
          - {id: moralist, op: label, part: moralist, text: 'no alcohol either'}
        point:
          - {passage: true, kind: underline, target: 'anybody who forms the habit of consuming alcohol', text: 'no alcohol allowed: D fails'}
          - {passage: true, kind: label, target: 'have continued to smoke', text: 'B fails: many Africans do smoke'}
      - say: 'So the answer is the smoking of cigarettes is bad and unacceptable, which is answer choice A.'
        write: 'A · smoking is bad and unacceptable'
        point:
          - {line: 1, kind: arrow, text: 'the clue'}
        answer: true
    traps:
      B: 'You went for it is typically African not to smoke. The passage speaks of the African moralist, but never says Africans do not smoke.'
      C: 'You went for accept a view only when convinced. That sounds wise, but the passage never says it.'
      D: 'You went for a little alcohol may be permitted. The moralist is against alcohol too, calling it a sign of wretchedness.'
  4:
    moments:
      - say: 'Which statement is true? We test each against the passage.'
        write: 'True according to the passage?'
      - say: 'The economist''s paragraph says these habits create business, like this factory.'
        write: '"generate supply of and demand for tobacco and alcohol"'
        doodle: {name: 'custom:2016_q04_a', id: trade, caption: 'the economist''s angle'}
        point:
          - {line: 1, kind: highlight, at: 'supply of and demand for', text: 'the clue'}
          - {passage: true, kind: label, target: 'the economist is primarily interested', text: 'the economist''s angle'}
          - {passage: true, kind: label, target: 'generate supply of and demand', text: 'trade for factories = economy'}
      - say: 'Supply and demand keep factories and breweries going, the coins keep flowing. That helps the economy.'
        write: 'supply + demand → good for the economy'
        doodle_do:
          - {id: trade, op: label, part: money, text: 'good for the economy'}
        point:
          - {passage: true, kind: label, target: 'could cripple the breweries', text: 'no drinkers, no breweries'}
          - {line: 2, kind: highlight, at: 'good for the economy', to: {doodle: trade, part: money}}
      - say: 'A says abstinence is a religious duty for all. Only some religions require it.'
        write: 'A: only "certain religions" ✗'
        point:
          - {passage: true, kind: strike, target: 'Followers of certain religions', text: 'A: only certain religions'}
          - {passage: true, kind: label, target: 'on the other hand', text: 'other groups follow other rules'}
      - say: 'C says everyone ignores the moralist, but many people accept his idea. Cancer, in D, is never mentioned.'
        write: 'C: "a number of people have accepted" ✗   D ✗'
        point:
          - {passage: true, kind: underline, target: 'A number of people have accepted the moralist idea', text: 'C fails: many accept it'}
      - say: 'So the answer is smoking and drinking may have positive effects on the economy, which is answer choice B.'
        write: 'B · positive effects on the economy'
        point:
          - {line: 2, kind: arrow, text: 'the clue'}
        answer: true
    traps:
      A: 'You went for total abstinence is a religious obligation. The passage says only certain religions expect it; others allow some things.'
      C: 'You went for everyone ignores the moralist. The passage says a number of people have accepted the moralist idea.'
      D: 'You went for they surely die of cancer. Cancer is never mentioned in the passage.'
  5:
    moments:
      - say: 'We compare the moralist and the economist.'
        write: 'moralist vs economist'
      - say: 'The moralist says smoking and drinking are moral failure. Cross them out.'
        write: 'moralist: bad habits, moral degradation'
        doodle: {name: 'custom:2016_q05_a', id: views, caption: 'view 1: a moral failing'}
        point:
          - {passage: true, kind: label, target: 'regarded smoking as an indication of moral degradation', text: 'view 1: a moral failing'}
      - say: 'The economist says they create supply and demand, which is money. Notice his paragraph opens with However.'
        write: 'economist: supply and demand   ("However" = contrast)'
        doodle_do:
          - {id: views, op: stage, stage: 'custom:2016_q05_a2'}
        point:
          - {line: 2, kind: highlight, at: 'However', text: 'contrast'}
          - {passage: true, kind: circle, target: 'However, the economist', text: '"However" = contrast'}
          - {passage: true, kind: label, target: 'generate supply of and demand', text: 'view 2: good for business'}
      - say: 'Two opposing positions, clashing like this, are at variance, in disagreement.'
        write: 'at variance = in disagreement'
        doodle_do:
          - {id: views, op: stage, stage: 'custom:2016_q05_a3'}
        point:
          - {line: 3, kind: underline, at: 'at variance'}
          - {line: 3, kind: highlight, at: 'at variance', to: {doodle: views, part: clash}}
      - say: 'So the answer is at variance, which is answer choice D.'
        write: 'D · at variance'
        answer: true
    traps:
      A: 'You went for quite indifferent. Neither is indifferent: the moralist cares about morals, the economist about the economy.'
      B: 'You went for very agreeable. Their views clash; However marks the contrast.'
      C: 'You went for very passionate. The passage describes what they think, not how strongly they feel.'
  6:
    moments:
      - say: 'We need the meaning of one sentence. Split it into two parts. Here are us, now.'
        write: '"There will be twice as many of us / before most of us are dead"'
        doodle: {name: 'custom:2016_q06_a', id: pop, caption: 'the people now'}
        point:
          - {line: 0, kind: underline, at: 'twice as many of us', text: 'part 1'}
          - {line: 0, kind: underline, at: 'before most of us are dead', text: 'part 2'}
          - {passage: true, kind: label, target: 'The human population explosion', text: 'context: people multiplying'}
      - say: 'Twice as many of us means the number of people will double, so two become four.'
        write: 'twice as many = the population doubles'
        doodle_do:
          - {id: pop, op: stage, stage: 'custom:2016_q06_a2'}
        point:
          - {passage: true, kind: underline, target: 'twice as many of us', text: 'the number doubles'}
          - {line: 1, kind: highlight, at: 'population doubles', to: {doodle: pop, part: double}}
      - say: 'Before most of us are dead means within our lifetime, before the sand runs out.'
        write: 'before most of us are dead = in our lifetime'
        doodle_do:
          - {id: pop, op: stage, stage: 'custom:2016_q06_a3'}
        point:
          - {passage: true, kind: underline, target: 'before most of us are dead', text: 'a time: within our lifetime'}
          - {line: 2, kind: highlight, at: 'in our lifetime', to: {doodle: pop, part: hourglass}}
      - say: 'Put together, the population will double before we die.'
        write: 'doubles + before our death'
      - say: 'B is the sentence before this one. D talks of dying from overpopulation, which is not said.'
        write: 'B: previous sentence ✗   D: not said ✗'
        point:
          - {line: 4, kind: strike, at: 'D: not said'}
          - {passage: true, kind: strike, target: 'spreads mankind across the land surfaces', text: 'B: that is the sentence before'}
      - say: 'So the answer is the population growth rate will double before our death, which is answer choice C.'
        write: 'C · double before our death'
        answer: true
    traps:
      A: 'You went for some increase in human and animal population. The sentence is about humans only, and it says double, not some increase.'
      B: 'You went for mankind is fast spreading. That is true in the passage, but it is the sentence before; this one is about doubling.'
      D: 'You went for many will die from population explosion. The sentence says nothing about dying because of it; before most of us are dead is just a time.'
  7:
    moments:
      - say: 'Which statement is true? Look for who causes the danger to animals.'
        write: 'Who threatens the animals?'
        point:
          - {passage: true, kind: label, target: 'in danger of extinction', text: 'the danger: animals dying out'}
      - say: 'Most animals are disappearing because their home is disappearing. Here is how. It is at the hands of man.'
        write: '"disappearing at the hands of man"'
        doodle: {name: 'custom:2016_q07_a', id: man, caption: 'at the hands of man', size: scene}
        point:
          - {line: 1, kind: highlight, at: 'at the hands of man', text: 'the clue'}
          - {passage: true, kind: underline, target: 'is itself disappearing at the hands of man', text: 'man destroys their home'}
      - say: 'Man also kills turtles for soup, leopards for skins, crocodiles for bags. Every arrow starts from him.'
        write: 'turtles, leopards, crocodiles → killed by man'
        doodle_do:
          - {id: man, op: stage, stage: 'custom:2016_q07_a2'}
        point:
          - {passage: true, kind: circle, target: 'the demand for turtle soup', text: 'man again'}
          - {passage: true, kind: circle, target: 'the fashion for their skins', text: 'man again'}
          - {passage: true, kind: circle, target: 'the fashion in crocodile skin', text: 'man again'}
      - say: 'In every case, man is the danger. He is the greatest threat to nature.'
        write: 'man = the greatest threat'
        doodle_do:
          - {id: man, op: circle, part: man}
          - {id: man, op: label, part: man, text: 'the greatest threat'}
        point:
          - {line: 3, kind: highlight, at: 'the greatest threat', to: {doodle: man, part: man}}
      - say: 'B is wrong, because man ate only one group of animals. A and C are not said.'
        write: 'B: only "those which he ate" ✗   A, C ✗'
        point:
          - {passage: true, kind: label, target: 'those which he ate when he got the chance', text: 'B: he ate only this group'}
          - {passage: true, kind: label, target: 'those which ate him', text: 'C: nothing about sparing them'}
      - say: 'So the answer is man poses the greatest threat to nature, which is answer choice D.'
        write: 'D · man poses the greatest threat to nature'
        point:
          - {line: 1, kind: arrow, text: 'the clue'}
        answer: true
    traps:
      A: 'You went for man kills only when he can afford to. The passage never talks about man affording to kill.'
      B: 'You went for man eats all categories of animals. The passage splits animals into groups; man ate only one of them.'
      C: 'You went for man cannot spare animals that eat his kind. The passage does not say this.'
  8:
    moments:
      - say: 'We want the causes of animals disappearing. Find the sentence that names them.'
        write: 'causes of elimination = ?'
        point:
          - {passage: true, kind: label, target: 'in danger of extinction', text: 'elimination = extinction'}
      - say: 'Here it is. Killing, like the turtle taken for soup.'
        write: '"reduced ... by extensive killing"'
        doodle: {name: 'custom:2016_q08_a', id: causes, caption: 'cause 1: killing'}
        point:
          - {line: 1, kind: highlight, at: 'extensive killing', text: 'cause 1'}
          - {passage: true, kind: underline, target: 'by extensive killing', text: 'cause 1: killing'}
          - {line: 1, kind: highlight, at: 'extensive killing', to: {doodle: causes, part: killing}}
      - say: 'That is cause one. The same sentence gives cause two, that the land they live in is disappearing.'
        write: '"the country they need ... is itself disappearing"'
        doodle_do:
          - {id: causes, op: stage, stage: 'custom:2016_q08_a2'}
        point:
          - {line: 2, kind: highlight, at: 'is itself disappearing', text: 'cause 2'}
          - {passage: true, kind: underline, target: 'the particular kind of country they need for existence', text: 'cause 2: their home goes'}
          - {line: 2, kind: highlight, at: 'is itself disappearing', to: {doodle: causes, part: habitat}}
      - say: 'The country an animal needs, the forest here, is its habitat, its home.'
        write: 'country they need = habitat'
        doodle_do:
          - {id: causes, op: label, part: habitat, text: 'habitat = their home'}
        point:
          - {line: 3, kind: highlight, at: 'habitat', to: {passage: true, target: 'kind of country they need'}}
      - say: 'So we have extensive killing, and the loss of their habitat.'
        write: 'killing + loss of habitat'
        point:
          - {passage: true, kind: label, target: 'as often as not by mistake', text: 'A fails: not a deliberate battle'}
          - {passage: true, kind: label, target: 'Those who live in cities', text: 'B fails: city people protect nature'}
      - say: 'So the answer is extensive killing and the fast disappearance of their habitats, which is answer choice D.'
        write: 'D · extensive killing + disappearing habitats'
        answer: true
    traps:
      A: 'You went for a deliberate battle against nature. The passage says habitats disappear as often as not by mistake, and the battle belongs to primitive times.'
      B: 'You went for living in cities and large farm lands. City people are actually most actively for nature, and farm lands are never mentioned.'
      C: 'You went for a penchant for meat and hides. Only turtle soup is about food; the passage names killing and habitat loss.'
  9:
    moments:
      - say: 'We want the meaning of when man evolved a conscience.'
        write: 'evolved a conscience = ?'
        point:
          - {passage: true, kind: underline, target: 'When man evolved a conscience', text: 'the phrase we must explain'}
      - say: 'A conscience is the voice inside that tells right from wrong, a tick or a cross.'
        write: 'conscience = sense of right and wrong'
        doodle: {name: 'custom:2016_q09_a', id: mind, caption: 'the voice inside: right or wrong?'}
        point:
          - {line: 1, kind: highlight, at: 'conscience', to: {passage: true, target: 'conscience crept in'}}
      - say: 'The passage explains it for us.'
        write: '"the awareness of responsibility ... produced feelings of guilt"'
        point:
          - {line: 2, kind: highlight, at: 'feelings of guilt', text: 'the clue'}
          - {passage: true, kind: label, target: 'the awareness of responsibility', text: 'conscience explained'}
      - say: 'Guilt comes from knowing you did wrong, that cross. So man became aware of right and wrong.'
        write: 'guilt → knows right from wrong'
        doodle_do:
          - {id: mind, op: circle, part: wrong}
          - {id: mind, op: label, part: wrong, text: 'guilt: I did wrong'}
        point:
          - {line: 3, kind: highlight, at: 'guilt', to: {passage: true, target: 'feelings of guilt'}}
          - {passage: true, kind: label, target: 'his basic relationship with the other animals began to change', text: 'he now feels responsible'}
      - say: 'Intellect in A is cleverness, not conscience.'
        write: 'A: intellect = cleverness ✗'
        point:
          - {line: 4, kind: strike, at: 'intellect'}
      - say: 'So the answer is man developed an awareness of right and wrong, which is answer choice C.'
        write: 'C · awareness of right and wrong'
        answer: true
    traps:
      A: 'You went for man''s intellect improved. Intellect is cleverness; a conscience is about right and wrong.'
      B: 'You went for man became a critical creature. Being critical is judging things; the passage is about guilt and responsibility.'
      D: 'You went for man acquired new habits. A conscience is not a habit; it is a sense of right and wrong.'
  10:
    moments:
      - say: 'We want the writer''s attitude. The ending of a passage often shows it.'
        write: 'attitude = ?  (read the ending)'
        point:
          - {passage: true, kind: label, target: 'Does this mean no room for wild animals?', text: 'the ending: read it closely'}
      - say: 'He lists many dangers, yes. But here is how he ends.'
        write: '"Does this mean no room for wild animals? Of course not."'
        doodle: {name: 'custom:2016_q10_a', id: hope, caption: 'how does he end?'}
        point:
          - {line: 1, kind: highlight, at: 'Of course not', text: 'the clue'}
          - {passage: true, kind: label, target: 'are now dwindling alarmingly', text: 'the dangers are real, yes...'}
          - {passage: true, kind: circle, target: 'Of course not', text: '...but he is sure: hope'}
      - say: 'Of course not, because he is sure there is still room for wild animals. The sun is coming up.'
        write: 'of course not → there is still hope'
        doodle_do:
          - {id: hope, op: stage, stage: 'custom:2016_q10_a2'}
      - say: 'He also says city people are now most actively for nature.'
        write: '"most actively for nature"'
        point:
          - {passage: true, kind: label, target: 'most actively for nature', text: 'people now protect nature'}
      - say: 'Someone who expects things can still go well, like this face watching the sunrise, is optimistic. Pessimistic is the opposite.'
        write: 'optimistic = hopeful   pessimistic = expects the worst'
        doodle_do:
          - {id: hope, op: label, part: face, text: 'optimistic = hopeful'}
        point:
          - {line: 4, kind: strike, at: 'pessimistic = expects the worst'}
      - say: 'So the answer is optimistic, which is answer choice C.'
        write: 'C · optimistic'
        point:
          - {line: 1, kind: arrow, text: 'the clue'}
        answer: true
    traps:
      A: 'You went for indifferent. The writer cares a lot about the animals; he is not indifferent.'
      B: 'You went for partial. Partial means taking one side unfairly; the writer gives facts and ends with hope.'
      D: 'You went for pessimistic. The dangers are real, but the writer ends by saying of course there is still room for wild animals. That is hope.'
  11:
    moments:
      - say: 'Gap 11 names a kind of speech delivery. Read what it is.'
        write: '___ delivery = speech "written out word for word and ... read"'
        point:
          - {line: 0, kind: highlight, at: 'written out word for word', text: 'the clue'}
          - {passage: true, kind: label, target: 'A prepared speech', text: 'topic: prepared, written speeches'}
          - {passage: true, kind: underline, target: 'written out word for word', text: 'the clue: a full script'}
      - say: 'The written copy a speaker reads from has a name.'
        write: 'written copy of a speech = manuscript'
        point:
          - {passage: true, kind: label, target: 'is read to', text: 'read aloud from the page'}
      - say: 'So reading from the written copy, these pages, is manuscript delivery.'
        write: 'manuscript delivery = reading the written speech'
        doodle: {name: 'custom:2016_q11_a', id: speech, caption: 'reading from the written copy'}
        doodle_do:
          - {id: speech, op: label, part: pages, text: 'the manuscript'}
      - say: 'Free delivery would mean speaking without a script, without these pages, and that is the opposite.'
        write: 'free = no script ✗'
        doodle_do:
          - {id: speech, op: circle, part: pages}
        point:
          - {line: 3, kind: strike, at: 'free'}
      - say: 'So the answer is manuscript, which is answer choice D.'
        write: 'D · manuscript'
        answer: true
    traps:
      A: 'You went for quantum. Quantum means an amount; it does not name a kind of speech.'
      B: 'You went for document. A speech is written, but the special word for a speech''s written copy is manuscript.'
      C: 'You went for free. Free delivery would mean speaking without a written text, the opposite of reading word for word.'
  12:
    moments:
      - say: 'In gap 12, the speech is read to whom?'
        write: 'read to ___'
        point:
          - {passage: true, kind: underline, target: 'is read to', text: 'read to whom? listeners'}
