# UTME 2016 Use of English — lessons for the board.
#
# Each lesson is a run of moments: what the teacher says, and the one line written while it
# is said. Answers match explanations_2016.yaml. Unrecoverable items (21-35) have none.
format_version: 1
exam_year: 2016
lessons:
  1:
    moments:
      - say: 'We want the writer''s view in the last paragraph. Let us go straight there.'
        write: 'Last paragraph: writer''s view = ?'
      - say: 'Here is the key line, near the end.'
        write: '"there seems to be a growing number of ... consumers and smokers"'
      - say: 'Notice the word seems. The writer is careful, not certain.'
        write: 'seems = appears (not certainly)'
      - say: 'Growing number means more people are taking up these habits.'
        write: 'growing number = more people drinking and smoking'
      - say: 'Option A says certainly. That is stronger than seems, so A goes.'
        write: 'A: "certainly" ✗   C: sales ✗   D: abstain ✗'
      - say: 'So the answer is more people appear to take to drinking and smoking, which is answer choice B.'
        write: 'B · more people appear to take to drinking and smoking'
        answer: true
    traps:
      A: 'You went for the number is certainly increasing. Close, but the writer only says it seems to be growing. Certainly is too strong.'
      C: 'You went for sales have improved tremendously. The paragraph talks about the number of drinkers and smokers, not sales figures.'
      D: 'You went for more people now abstain. The paragraph says the opposite: the number of drinkers and smokers is growing.'
  2:
    moments:
      - say: 'We are asked how morality, religion and economy are related in the passage.'
        write: 'morality + religion + economy = ?'
      - say: 'Find the sentence that joins them.'
        write: '"moral principles ... religion tend to lead on to economic problems"'
      - say: 'So they are linked. That rules out different and unrelated.'
        write: 'linked → C, D ✗'
      - say: 'Now look at the soft words: some, tend to. Later the writer says could and seems.'
        write: 'some · tend to · could · seems = careful, partial'
      - say: 'A link described so carefully is a partial link: somewhat, not clearly.'
        write: 'somewhat (partly) > clearly (strongly)'
      - say: 'So the answer is somewhat interconnected, which is answer choice A.'
        write: 'A · somewhat interconnected'
        answer: true
    traps:
      B: 'You went for clearly interconnected. They are connected, but the writer uses soft words like some and tend to, so clearly is stronger than he claims.'
      C: 'You went for certainly different. The passage links them: religious rules lead on to economic problems.'
      D: 'You went for certainly unrelated. The whole last part of the passage shows how religion and morals affect the economy.'
  3:
    moments:
      - say: 'We want the moralist''s idea. The very first sentence gives it.'
        write: 'moralist idea = ?'
      - say: 'Here it is.'
        write: '"regarded smoking as an indication of moral degradation"'
      - say: 'Moral degradation is a fall into bad behaviour.'
        write: 'moral degradation = sinking into bad behaviour'
      - say: 'So to the moralist, smoking is bad and not acceptable.'
        write: 'smoking = bad, unacceptable'
      - say: 'D says a little alcohol is fine. But the moralist calls alcohol a sign of wretchedness.'
        write: 'D ✗ alcohol = "a sign of wretchedness"'
      - say: 'So the answer is the smoking of cigarettes is bad and unacceptable, which is answer choice A.'
        write: 'A · smoking is bad and unacceptable'
        answer: true
    traps:
      B: 'You went for it is typically African not to smoke. The passage speaks of the African moralist, but never says Africans do not smoke.'
      C: 'You went for accept a view only when convinced. That sounds wise, but the passage never says it.'
      D: 'You went for a little alcohol may be permitted. The moralist is against alcohol too, calling it a sign of wretchedness.'
  4:
    moments:
      - say: 'Which statement is true? We test each against the passage.'
        write: 'True according to the passage?'
      - say: 'The economist''s paragraph says these habits create business.'
        write: '"generate supply of and demand for tobacco and alcohol"'
      - say: 'Supply and demand keep factories and breweries going. That helps the economy.'
        write: 'supply + demand → good for the economy'
      - say: 'A says abstinence is a religious duty for all. Only some religions require it.'
        write: 'A: only "certain religions" ✗'
      - say: 'C says everyone ignores the moralist, but many people accept his idea. Cancer, in D, is never mentioned.'
        write: 'C: "a number of people have accepted" ✗   D ✗'
      - say: 'So the answer is smoking and drinking may have positive effects on the economy, which is answer choice B.'
        write: 'B · positive effects on the economy'
        answer: true
    traps:
      A: 'You went for total abstinence is a religious obligation. The passage says only certain religions expect it; others allow some things.'
      C: 'You went for everyone ignores the moralist. The passage says a number of people have accepted the moralist idea.'
      D: 'You went for they surely die of cancer. Cancer is never mentioned in the passage.'
  5:
    moments:
      - say: 'We compare the moralist and the economist.'
        write: 'moralist vs economist'
      - say: 'The moralist: smoking and drinking are moral failure.'
        write: 'moralist: bad habits, moral degradation'
      - say: 'The economist: they create supply and demand. Notice his paragraph opens with However.'
        write: 'economist: supply and demand   ("However" = contrast)'
      - say: 'Two opposing positions are at variance, in disagreement.'
        write: 'at variance = in disagreement'
      - say: 'So the answer is at variance, which is answer choice D.'
        write: 'D · at variance'
        answer: true
    traps:
      A: 'You went for quite indifferent. Neither is indifferent: the moralist cares about morals, the economist about the economy.'
      B: 'You went for very agreeable. Their views clash; However marks the contrast.'
      C: 'You went for very passionate. The passage describes what they think, not how strongly they feel.'
  6:
    moments:
      - say: 'We need the meaning of one sentence. Split it into two parts.'
        write: '"There will be twice as many of us / before most of us are dead"'
      - say: 'Twice as many of us means the number of people will double.'
        write: 'twice as many = the population doubles'
      - say: 'Before most of us are dead means within our lifetime.'
        write: 'before most of us are dead = in our lifetime'
      - say: 'Put together: the population will double before we die.'
        write: 'doubles + before our death'
      - say: 'B is the sentence before this one. D talks of dying from overpopulation, which is not said.'
        write: 'B: previous sentence ✗   D: not said ✗'
      - say: 'So the answer is the population growth rate will double before our death, which is answer choice C.'
        write: 'C · double before our death'
        answer: true
    traps:
      A: 'You went for some increase in human and animal population. The sentence is about humans only, and it says double, not some increase.'
      B: 'You went for mankind is fast spreading. That is true in the passage, but it is the sentence before; this one is about doubling.'
      D: 'You went for many will die from population explosion. The sentence says nothing about dying because of it; before most of us are dead is just a time.'
  7:
    moments:
      - say: 'Which statement is true? Look for who causes the danger to animals.'
        write: 'Who threatens the animals?'
      - say: 'Most animals are disappearing because their home is disappearing, and here is how.'
        write: '"disappearing at the hands of man"'
      - say: 'Man also kills turtles for soup, leopards for skins, crocodiles for bags.'
        write: 'turtles, leopards, crocodiles → killed by man'
      - say: 'In every case man is the danger. He is the greatest threat to nature.'
        write: 'man = the greatest threat'
      - say: 'B is wrong: man ate only one group of animals. A and C are not said.'
        write: 'B: only "those which he ate" ✗   A, C ✗'
      - say: 'So the answer is man poses the greatest threat to nature, which is answer choice D.'
        write: 'D · man poses the greatest threat to nature'
        answer: true
    traps:
      A: 'You went for man kills only when he can afford to. The passage never talks about man affording to kill.'
      B: 'You went for man eats all categories of animals. The passage splits animals into groups; man ate only one of them.'
      C: 'You went for man cannot spare animals that eat his kind. The passage does not say this.'
  8:
    moments:
      - say: 'We want the causes of animals disappearing. Find the sentence that names them.'
        write: 'causes of elimination = ?'
      - say: 'Here it is.'
        write: '"reduced ... by extensive killing"'
      - say: 'That is cause one. The same sentence gives cause two.'
        write: '"the country they need ... is itself disappearing"'
      - say: 'The country an animal needs is its habitat, its home.'
        write: 'country they need = habitat'
      - say: 'So: extensive killing, and the loss of their habitat.'
        write: 'killing + loss of habitat'
      - say: 'So the answer is extensive killing and the fast disappearance of their habitats, which is answer choice D.'
        write: 'D · extensive killing + disappearing habitats'
        answer: true
    traps:
      A: 'You went for a deliberate battle against nature. The passage says habitats disappear as often as not by mistake, and the battle belongs to primitive times.'
      B: 'You went for living in cities and large farm lands. City people are actually most actively for nature, and farm lands are never mentioned.'
      C: 'You went for a penchant for meat and hides. Only turtle soup is about food; the passage names killing and habitat loss.'
  9:
    moments:
      - say: 'We want the meaning of when man evolved a conscience.'
        write: 'evolved a conscience = ?'
      - say: 'A conscience is the voice inside that tells right from wrong.'
        write: 'conscience = sense of right and wrong'
      - say: 'The passage explains it for us.'
        write: '"the awareness of responsibility ... produced feelings of guilt"'
      - say: 'Guilt comes from knowing you did wrong. So man became aware of right and wrong.'
        write: 'guilt → knows right from wrong'
      - say: 'Intellect in A is cleverness, not conscience.'
        write: 'A: intellect = cleverness ✗'
      - say: 'So the answer is man developed an awareness of right and wrong, which is answer choice C.'
        write: 'C · awareness of right and wrong'
        answer: true
    traps:
      A: 'You went for man''s intellect improved. Intellect is cleverness; a conscience is about right and wrong.'
      B: 'You went for man became a critical creature. Being critical is judging things; the passage is about guilt and responsibility.'
      D: 'You went for man acquired new habits. A conscience is not a habit; it is a sense of right and wrong.'
  10:
    moments:
      - say: 'We want the writer''s attitude. The ending of a passage often shows it.'
        write: 'attitude = ?  (read the ending)'
      - say: 'He lists many dangers, yes. But here is how he ends.'
        write: '"Does this mean no room for wild animals? Of course not."'
      - say: 'Of course not: he is sure there is still room for wild animals.'
        write: 'of course not → there is still hope'
      - say: 'He also says city people are now most actively for nature.'
        write: '"most actively for nature"'
      - say: 'Someone who expects things can still go well is optimistic. Pessimistic is the opposite.'
        write: 'optimistic = hopeful   pessimistic = expects the worst'
      - say: 'So the answer is optimistic, which is answer choice C.'
        write: 'C · optimistic'
        answer: true
    traps:
      A: 'You went for indifferent. The writer cares a lot about the animals; he is not indifferent.'
      B: 'You went for partial. Partial means taking one side unfairly; the writer gives facts and ends with hope.'
      D: 'You went for pessimistic. The dangers are real, but the writer ends by saying of course there is still room for wild animals. That is hope.'
  11:
    moments:
      - say: 'Gap 11 names a kind of speech delivery. Read what it is.'
        write: '___ delivery = speech "written out word for word and ... read"'
      - say: 'The written copy a speaker reads from has a name.'
        write: 'written copy of a speech = manuscript'
      - say: 'So reading from it is manuscript delivery.'
        write: 'manuscript delivery = reading the written speech'
      - say: 'Free delivery would mean speaking without a script, the opposite.'
        write: 'free = no script ✗'
      - say: 'So the answer is manuscript, which is answer choice D.'
        write: 'D · manuscript'
        answer: true
    traps:
      A: 'You went for quantum. Quantum means an amount; it does not name a kind of speech.'
      B: 'You went for document. A speech is written, but the special word for a speech''s written copy is manuscript.'
      C: 'You went for free. Free delivery would mean speaking without a written text, the opposite of reading word for word.'
  12:
    moments:
      - say: 'Gap 12: the speech is read to whom?'
        write: 'read to ___'
      - say: 'Any speech is heard by listeners.'
        write: 'listeners = audience'
      - say: 'A congregation is at worship; a conference is a meeting.'
        write: 'congregation = church · conference = meeting'
      - say: 'Audience fits every speech.'
        write: 'read to an audience ✓'
      - say: 'So the answer is an audience, which is answer choice A.'
        write: 'A · an audience'
        answer: true
    traps:
      B: 'You went for a congregation. That is people gathered for worship; a speech is read to any audience.'
      C: 'You went for a gathering. People gather, but the word for listeners to a speech is audience.'
      D: 'You went for a conference. A conference is a meeting for discussion, not the listeners themselves.'
  13:
    moments:
      - say: 'Gap 13 describes the occasions. Look at the examples that follow.'
        write: 'very ___ occasions'
      - say: 'The examples are big official speeches.'
        write: 'State of the Union Address · United Nations'
      - say: 'Those are serious, official, formal events.'
        write: 'official, serious = formal'
      - say: 'Impromptu means unplanned, the opposite of a written-out speech.'
        write: 'impromptu = unplanned ✗'
      - say: 'So the answer is formal, which is answer choice D.'
        write: 'D · formal'
        answer: true
    traps:
      A: 'You went for genuine. Genuine means real; it does not describe the kind of occasion.'
      B: 'You went for impromptu. Impromptu means without preparation, the opposite of a fully written speech.'
      C: 'You went for guaranteed. Guaranteed means promised; occasions are not described that way.'
  14:
    moments:
      - say: 'Gap 14: on these occasions, exact wording is what?'
        write: 'exact wording is ___'
      - say: 'At the United Nations, one wrong word can cause trouble. Every word matters.'
        write: 'every word matters'
      - say: 'When something matters very much, we call it critical.'
        write: 'critical = very important'
      - say: 'Conclusive means settling something finally. Reportive does not fit.'
        write: 'conclusive = final ✗   reportive ✗'
      - say: 'So the answer is critical, which is answer choice C.'
        write: 'C · critical'
        answer: true
    traps:
      A: 'You went for reportive. It is about reporting, but the sentence needs a word for how important the wording is.'
      B: 'You went for conclusive. Conclusive means settling a question; the idea here is that the wording is very important.'
  15:
    moments:
      - say: 'Gap 15 finishes a name: the United Nations General …'
        write: 'United Nations General ___'
      - say: 'The meeting of all UN member nations has a proper name.'
        write: 'all member nations meet = General Assembly'
      - say: 'Organisation and negotiation do not make a name here.'
        write: 'B, C ✗'
      - say: 'An assembly is a gathering of people for a purpose.'
        write: 'assembly = meeting of many members'
      - say: 'So the answer is assembly, which is answer choice A.'
        write: 'A · assembly'
        answer: true
    traps:
      B: 'You went for organisation. The United Nations is an organisation, but the name here is the General Assembly.'
      C: 'You went for negotiation. Negotiation happens there, but it is not the name of the body.'
  16:
    moments:
      - say: 'Gap 16: the advantage of a written speech.'
        write: 'speech may be highly ___'
      - say: 'Read on: in terms of what?'
        write: '"word choice, turns of phrase and development of ideas"'
      - say: 'Writing it out gives time to refine every word.'
        write: 'refined, smooth wording'
      - say: 'Refined writing is called polished.'
        write: 'polished = refined, smooth'
      - say: 'So the answer is polished, which is answer choice D.'
        write: 'D · polished'
        answer: true
    traps:
      A: 'You went for advanced. Advanced means ahead or difficult; the point is that the wording is refined.'
      B: 'You went for analogue. That is a technical word, about clocks and signals, not speeches.'
      C: 'You went for discreet. Discreet means careful to keep secrets. It is also easily confused with discrete.'
  17:
    moments:
      - say: 'Gap 17 goes before inflection.'
        write: 'meaningful ___ inflection'
      - say: 'Inflection is the rise and fall of the voice.'
        write: 'inflection = rise and fall of the voice'
      - say: 'The word that means of the voice is vocal.'
        write: 'vocal = of the voice'
      - say: 'Bifocal is about spectacles; profuse means plentiful.'
        write: 'bifocal, anticipatory, profuse ✗'
      - say: 'So the answer is vocal, which is answer choice A.'
        write: 'A · vocal'
        answer: true
    traps:
      B: 'You went for bifocal. Bifocal describes glasses with two lenses; it has nothing to do with the voice.'
      C: 'You went for anticipatory. Anticipatory means expecting something; it does not describe inflection.'
      D: 'You went for profuse. Profuse means plentiful, like profuse sweating; it does not go with inflection.'
  18:
    moments:
      - say: 'Gap 18: what effects does poor delivery spoil?'
        write: 'poor delivery could negate the ___ effects'
      - say: 'Negate means cancel. The effects come from carefully chosen words.'
        write: 'negate = cancel'
      - say: 'Careful words have good effects. Poor delivery cancels the good.'
        write: 'good effects = positive effects'
      - say: 'Interactive means two-way; that does not describe these effects.'
        write: 'interactive = two-way ✗'
      - say: 'So the answer is positive, which is answer choice B.'
        write: 'B · positive'
        answer: true
    traps:
      A: 'You went for decisive. Decisive effects settle something; the sentence is about the good effects of careful words.'
      C: 'You went for interactive. A read speech is one-way; interactive means two-way exchange.'
      D: 'You went for restrictive. Poor delivery cancels good effects, not restrictive ones.'
  19:
    moments:
      - say: 'Gap 19: the carefully chosen what?'
        write: 'the carefully chosen ___'
      - say: 'Earlier the passage praised the written speech for its word choice.'
        write: '"word choice, turns of phrase"'
      - say: 'Chosen words together are the language of the speech.'
        write: 'chosen words = language'
      - say: 'A formal speech is not written in slang or a dialect.'
        write: 'slang = informal · dialect = local form ✗'
      - say: 'So the answer is language, which is answer choice D.'
        write: 'D · language'
        answer: true
    traps:
      A: 'You went for dialect. A dialect is a local variety of a language; formal speeches at the UN are not written in one.'
      C: 'You went for slang. Slang is very informal; the passage is about formal, polished speeches.'
  20:
    moments:
      - say: 'Gap 20: lack of familiarity with the what?'
        write: 'lack of familiarity with the ___'
      - say: 'The passage already said what the speaker must know well.'
        write: '"very familiar with the text"'
      - say: 'If you do not know the text, you keep looking down at the page. No eye contact.'
        write: 'eyes on the page → no eye contact'
      - say: 'Context means the situation around it. That would not stop eye contact.'
        write: 'context = situation ✗'
      - say: 'So the answer is text, which is answer choice A.'
        write: 'A · text'
        answer: true
    traps:
      B: 'You went for context. Context is the situation around the speech; the speaker keeps looking down because he does not know the text.'
      C: 'You went for exchange. A read speech is not an exchange; it is a text read aloud.'
      D: 'You went for note. The whole speech is written out, so the speaker reads a full text, not a note.'
  36:
    moments:
      - say: 'We need the meaning of in no uncertain terms.'
        write: 'in no uncertain terms = ?'
      - say: 'No uncertain means certain. Her words left no doubt.'
        write: 'no uncertain = certain, no doubt'
      - say: 'Words that leave no doubt are clear and strong.'
        write: '= clearly and strongly'
      - say: 'Feebly, quietly and secretly are all the opposite.'
        write: 'feebly, quietly, secretly ✗'
      - say: 'So the answer is she expressed it clearly and strongly, which is answer choice D.'
        write: 'D · clearly and strongly'
        answer: true
    traps:
      A: 'You went for feebly and sickly. Feeble words leave doubt; in no uncertain terms means strong and clear.'
      B: 'You went for quietly and cautiously. Cautious words hold back; this idiom means she held nothing back.'
      C: 'You went for secretly and courageously. Courage fits a little, but secretly does not; she spoke openly and clearly.'
  37:
    moments:
      - say: 'Get his act together is an idiom. Do not read it like a stage play.'
        write: 'get your act together = ?'
      - say: 'It means stop being disorganised and get things in order.'
        write: '= organise yourself'
      - say: 'Usman must organise himself to pass.'
        write: 'Usman must organise himself'
      - say: 'A takes act as a stage act. B and D are exam tips, not the meaning.'
        write: 'A: stage ✗   B, D: tips ✗'
      - say: 'So the answer is he needs to organise himself, which is answer choice C.'
        write: 'C · he needs to organise himself'
        answer: true
    traps:
      A: 'You went for put on his stage costume. That reads act as a stage act; the idiom means organise yourself.'
      B: 'You went for be fast when writing. Speed may help, but the idiom is about getting organised.'
      D: 'You went for put all points down. That is exam advice, not the meaning of the idiom.'
  38:
    moments:
      - say: 'Keep your shirt on is an idiom.'
        write: 'keep your shirt on = ?'
      - say: 'Men once took off their shirts to fight. Keeping it on means do not fight, calm down.'
        write: 'shirt off = ready to fight'
      - say: 'So it means stay calm, do not lose your temper.'
        write: 'keep your shirt on = stay calm'
      - say: 'D reads the words literally.'
        write: 'D: literal ✗'
      - say: 'So the answer is she was advised to stay calm, which is answer choice A.'
        write: 'A · stay calm'
        answer: true
    traps:
      B: 'You went for commit herself. The idiom is about calming down, not committing.'
      C: 'You went for join the club. That is a different idiom; this one means stay calm.'
      D: 'You went for wear her shirt. That is the literal reading; idioms do not mean their words.'
  39:
    moments:
      - say: 'The sentence already tells us the performance was poor.'
        write: '"poor performance"'
      - say: 'To plumb the depths is to reach the very bottom.'
        write: 'plumbed the depths = reached the lowest point'
      - say: 'So it was as bad as it could be, full of disappointment.'
        write: '= terrible, full of disappointment'
      - say: 'Rewarded, next round and enjoyed are all good results.'
        write: 'A, B, C = good ✗'
      - say: 'So the answer is the team''s performance was full of disappointment, which is answer choice D.'
        write: 'D · full of disappointment'
        answer: true
    traps:
      A: 'You went for the performance was rewarded. A poor performance that reached the depths is not rewarded.'
      B: 'You went for it took them to the next round. The sentence calls it poor and horrible; that does not win.'
      C: 'You went for enjoyed by all. Horror is the opposite of enjoyment.'
  40:
    moments:
      - say: 'We want the meaning of a clinging child.'
        write: 'clinging child = ?'
      - say: 'To cling is to hold on tightly and not let go.'
        write: 'cling = hold on tight'
      - say: 'A clinging child holds on to people and wants them close, all to himself.'
        write: 'wants people close, all to himself'
      - say: 'Wanting to keep someone to yourself is being possessive.'
        write: 'possessive = wants to keep people to himself'
      - say: 'B uses cling literally and adds a sister who is not there.'
        write: 'B: literal + extra sister ✗'
      - say: 'So the answer is he is possessive, which is answer choice C.'
        write: 'C · he is possessive'
        answer: true
    traps:
      A: 'You went for a bully. A bully hurts others; a clinging child holds on to them.'
      B: 'You went for he likes to cling with his sister. It repeats the word cling, but the sentence says nothing about a sister.'
      D: 'You went for a handsome young man. The sentence says child and is about behaviour, not looks.'
  41:
    moments:
      - say: 'Brush up on is a phrasal verb.'
        write: 'brush up on = ?'
      - say: 'It means practise again to make a skill better.'
        write: 'brush up on = refresh, improve'
      - say: 'So you need to improve your Spanish.'
        write: 'improve your Spanish'
      - say: 'A takes brush literally. B and C are about Spain, not your skill.'
        write: 'A: literal ✗   B, C: Spain ✗'
      - say: 'So the answer is you need to improve your skills, which is answer choice D.'
        write: 'D · improve your skills'
        answer: true
    traps:
      A: 'You went for a brush from Spain. That is the literal word brush; brush up on means improve.'
      B: 'You went for study the history of Spain. Spanish here is the language, and the idea is improving it.'
      C: 'You went for play with a Spaniard. The phrase is about improving a skill, not playing.'
  42:
    moments:
      - say: 'Live in each other''s pockets is an idiom.'
        write: 'live in each other''s pockets = ?'
      - say: 'Picture living in someone''s pocket: you are never apart.'
        write: 'always together'
      - say: 'So the two are very close.'
        write: '= very close'
      - say: 'C and D think of money in pockets. That is the wrong track.'
        write: 'C, D: money ✗'
      - say: 'So the answer is they are very close to each other, which is answer choice B.'
        write: 'B · very close to each other'
        answer: true
    traps:
      A: 'You went for business partners. The idiom is about being always together, not about business.'
      C: 'You went for blackmail. Pockets suggest money, but the idiom means very close.'
      D: 'You went for steal from each other. Again pockets suggest money, but the idiom is about closeness.'
  43:
    moments:
      - say: 'Look closely: not unfavourable.'
        write: 'not unfavourable'
      - say: 'There are two negatives: not and un-.'
        write: 'not + un- = two negatives'
      - say: 'Two negatives cancel out. Not unfavourable means favourable.'
        write: 'not unfavourable = favourable = good'
      - say: 'A good result means she did well.'
        write: 'good result → successful'
      - say: 'So the answer is she was successful in the examination, which is answer choice C.'
        write: 'C · successful'
        answer: true
    traps:
      A: 'You went for she failed. You read only the un-; the not in front cancels it.'
      B: 'You went for could not earn her admission. Not unfavourable is positive, so her result was good.'
  44:
