# UTME 2017 Use of English — lessons for the board.
#
# Each lesson is a run of moments: what the teacher says, and the one line written while it
# is said. Answers match explanations_2017.yaml. Unrecoverable items (16-25) have none.
format_version: 1
exam_year: 2017
lessons:
  1:
    moments:
      - say: 'We are asked what happened to the advantages men usually enjoyed. Let''s find them in the passage.'
        write: 'Advantages enjoyed by men began to ... ?'
      - say: 'The passage calls these advantages privileges, like a crown only men wore. Here is the sentence.'
        write: '"special privileges traditionally enjoyed by men"'
        point:
          - {passage: true, kind: label, target: 'special privileges', text: '"privileges" = the advantages'}
      - say: 'It says that with the advancement of civilization, these privileges began to be eroded one after another.'
        write: '"with the advancement of civilization ... began to be eroded"'
        point:
          - {line: 2, kind: highlight, at: 'advancement of civilization', text: 'the clue'}
          - {passage: true, kind: circle, target: 'with the advancement of civilization', text: 'the cause'}
      - say: 'Eroded means worn away little by little. Things that are worn away are dwindling.'
        write: 'eroded = worn away = dwindled'
        point:
          - {line: 2, kind: underline, at: 'eroded'}
          - {passage: true, kind: circle, target: 'eroded', text: 'worn away bit by bit'}
      - say: 'So we need dwindle, and the cause, the advancement of civilization. Only one option has both.'
        write: 'dwindle + advancement of civilization'
        point:
          - {line: 4, kind: highlight, at: 'dwindle', to: {passage: true, target: 'one after another'}}
          - {passage: true, kind: label, target: 'achieving women''s emancipation', text: 'B: emancipation comes later'}
          - {line: 4, kind: highlight, at: 'advancement of civilization'}
      - say: 'So the answer is dwindle with the advancement of civilization, which is answer choice C.'
        write: 'C · dwindle with the advancement of civilization'
        answer: true
    traps:
      A: 'You went for weaken through gender sensitivity. The passage never mentions gender sensitivity; it names the advancement of civilization as the cause.'
      B: 'You went for diminish through women emancipation. Emancipation comes up later, but the sentence about privileges being eroded gives civilization as the cause.'
      D: 'You went for fade with wide self-realization. Self-realization is not in the passage at all. Stick to what the text says.'
  2:
    moments:
      - say: 'We want the two masters that women are struggling to serve. The phrase comes near the end.'
        write: '"no one can serve two masters"'
        point:
          - {passage: true, kind: label, target: 'serve two masters', text: 'two demands pulling at once'}
      - say: 'Look at what comes before it. Women take up paid employment, so the office pulls one way.'
        write: 'Master 1: paid employment = the office'
        point:
          - {line: 1, kind: highlight, at: 'paid employment', text: 'master 1'}
          - {passage: true, kind: circle, target: 'paid employment', text: 'master 1: the job'}
          - {line: 1, kind: highlight, at: 'the office'}
      - say: 'And because of that job, they find it hard to care for their children at home, so the home pulls the other way.'
        write: 'Master 2: care of children at home = the home'
        point:
          - {line: 2, kind: highlight, at: 'care of children at home', text: 'master 2'}
          - {passage: true, kind: underline, target: 'take adequate care of their children at home', text: 'master 2: the home'}
          - {line: 2, kind: highlight, at: 'the home'}
      - say: 'So the two things pulling at the working mother are her job and her home.'
        write: 'office  vs  home'
        point:
          - {passage: true, kind: label, target: 'no longer restricted to the home', text: 'home and work, both at once'}
      - say: 'So the answer is the office and the home, which is answer choice D.'
        write: 'D · the office and the home'
        answer: true
        point:
          - {passage: true, kind: strike, target: 'the health and education of the children', text: 'A: these suffer; not masters'}
    traps:
      A: 'You went for the health and education of their children. Those are what suffer because of the two masters, not the masters themselves.'
      B: 'You went for the husband and the children. The passage never mentions husbands; the struggle is between the job and the home.'
      C: 'You went for the office and the husband. The office is right, but the husband is never mentioned. The other master is the home.'
  3:
    moments:
      - say: 'Why were ancient, or primitive, societies secure? Let''s start with the first sentence.'
        write: 'Why were primitive societies stable?'
        point:
          - {passage: true, kind: label, target: 'for a society to remain stable', text: 'the rule for stability'}
      - say: 'It says a society stays stable when the roles of men and women are properly differentiated and well defined.'
        write: '"roles ... properly differentiated and well defined"'
        point:
          - {line: 1, kind: highlight, at: 'well defined', text: 'the clue'}
          - {passage: true, kind: underline, target: 'properly differentiated and well defined', text: 'roles clearly set out'}
      - say: 'Then it gives the roles, and the society splits neatly. Men hunt, fish and fight, and women keep house and mind the children.'
        write: 'men: hunt, fish, fight · women: house, children'
        point:
          - {line: 2, kind: highlight, at: 'men: hunt, fish, fight', to: {passage: true, target: 'hunt, fish and fight off'}}
          - {line: 2, kind: highlight, at: 'women: house, children', to: {passage: true, target: 'the women did the housekeeping'}}
      - say: 'And then it says, consequently, primitive societies enjoyed great stability. Clear roles for the whole group, so stability.'
        write: 'clear roles → "Consequently ... great stability"'
        point:
          - {passage: true, kind: label, target: 'There was no controversy', text: 'no dispute: roles were clear'}
          - {passage: true, kind: circle, target: 'Consequently', text: 'so: the result of clear roles'}
      - say: 'Outlined means clearly set out. That matches well defined.'
        write: 'well defined = outlined'
        point:
          - {line: 1, kind: arrow, at: 'well defined'}
          - {passage: true, kind: label, target: 'believed to be superior', text: 'A: superiority is not the reason'}
      - say: 'So the answer is the tasks of women and men were outlined, which is answer choice B.'
        write: 'B · the tasks of women and men were outlined'
        answer: true
    traps:
      A: 'You went for men were assigned superior roles. The passage says men were believed stronger, but stability came from the roles being clear, not from men being superior.'
      C: 'You went for women accepted inferior roles. The passage never calls women''s roles inferior. The point is that everyone''s role was clearly defined.'
      D: 'You went for the roles of women were commonly interpreted. The passage talks about the roles of both sexes being defined, not how women''s roles were interpreted.'
  4:
    moments:
      - say: 'We must infer what women''s emancipation leads to. Look at the problems the last paragraph lists.'
        write: 'Emancipation results in ... ?'
        point:
          - {passage: true, kind: label, target: 'the problems created in the process', text: 'the problems of emancipation'}
      - say: 'Mothers take up paid jobs, and find it hard to care for their children at home.'
        write: '"difficult ... to take adequate care of their children at home"'
        point:
          - {passage: true, kind: label, target: 'take up paid employment', text: 'mothers now work outside'}
      - say: 'And the result is that the health and education of the children suffer tremendously.'
        write: '"health and education of the children suffer"'
        point:
          - {line: 2, kind: highlight, at: 'children suffer', text: 'the clue'}
          - {passage: true, kind: underline, target: 'suffer tremendously', text: 'the harm lands at home'}
      - say: 'When children are neglected and suffer, the home cracks. That is a crisis at home.'
        write: 'children suffer → trouble in the home = crises at home'
        point:
          - {line: 3, kind: highlight, at: 'trouble in the home', to: {passage: true, target: 'their children at home'}}
          - {line: 3, kind: highlight, at: 'trouble in the home'}
      - say: 'The other options talk about ambition, resentment or careless men. None of those is in the passage.'
        write: 'ambition? resentment? nonchalant men? — not in the text'
        point:
          - {line: 4, kind: strike, at: 'ambition? resentment? nonchalant men'}
      - say: 'So the answer is crises at home, which is answer choice C.'
        write: 'C · crises at home'
        answer: true
    traps:
      A: 'You went for women becoming covertly ambitious. Covertly means secretly, and the passage never says women hide their ambitions. The problem it names is at home.'
      B: 'You went for resentment of men by women. Nothing in the passage says women resent men. The harm it describes falls on the children and the home.'
      D: 'You went for men becoming nonchalant, which means unconcerned. The passage does not describe how men behave. It points to problems in the home.'
  5:
    moments:
      - say: 'What does suffer tremendously mean here? Here is the sentence.'
        write: '"the health and education of the children suffer tremendously"'
        point:
          - {line: 0, kind: underline, at: 'suffer tremendously'}
          - {passage: true, kind: label, target: 'Since no one can serve two masters', text: 'why they suffer: two masters'}
      - say: 'Tremendously means very much, badly, so see those big arrows going down.'
        write: 'tremendously = very much, badly'
        doodle: {name: 'custom:2017_q05_a', id: kids, caption: 'health and education'}
        point:
          - {passage: true, kind: circle, target: 'tremendously', text: 'very much, badly'}
      - say: 'To suffer here means to be harmed, to be affected for the worse.'
        write: 'suffer = be harmed, be affected'
        point:
          - {passage: true, kind: circle, target: 'suffer', text: 'be harmed'}
      - say: 'Put them together, and the health and education of the children, the heart and the book, are badly affected. That reads smoothly.'
        write: 'health and education ... are badly affected ✓'
        doodle_do:
          - {id: kids, op: circle, part: health}
          - {id: kids, op: circle, part: education}
        point:
          - {passage: true, kind: label, target: 'the health and education of the children', text: 'these are what get affected'}
      - say: 'So the answer is badly affected, which is answer choice D.'
        write: 'D · badly affected'
        answer: true
    traps:
      A: 'You went for greatly disadvantaged. The idea is close, but health and education are not disadvantaged; they are affected. D fits the sentence.'
      B: 'You went for to become worse. That drops the idea of tremendously, how much they suffer, and it does not fit the grammar of the phrase.'
      C: 'You went for badly unpleased. Health and education cannot be pleased or unpleased, and unpleased is not a standard word.'
  6:
    moments:
      - say: 'In gap 6, realistic planning efforts go with infrastructural blank.'
        write: 'planning efforts go with infrastructural ___'
        point:
          - {passage: true, kind: label, target: 'realistic planning efforts go with', text: 'what goes with planning?'}
      - say: 'Look ahead in the passage. The same word appears later, where infrastructural development should be made to take precedence.'
        write: '"infrastructural development should be made to take ..."'
        point:
          - {line: 1, kind: highlight, at: 'infrastructural development', text: 'the clue'}
          - {passage: true, kind: label, target: 'infrastructural development should be made', text: 'the same pair later on'}
          - {passage: true, kind: circle, target: 'the development of infrastructure', text: 'said again here'}
      - say: 'So the passage is about infrastructural development, which means building roads, power and water.'
        write: 'infrastructural + development'
      - say: 'Projected is an adjective, arrangement does not fit, and a tenet is a belief. We are building these things, so the word is development.'
        write: 'projected ✗ · arrangement ✗ · tenet = belief ✗'
        point:
          - {line: 3, kind: strike}
      - say: 'So the answer is development, which is answer choice A.'
        write: 'A · development'
        answer: true
    traps:
      B: 'You went for projected. Projected is an adjective, like planned, so infrastructural projected makes no sense. The gap needs a noun.'
      C: 'You went for arrangement. Infrastructural arrangement is not a phrase the passage uses. It keeps talking about infrastructural development.'
      D: 'You went for tenet. A tenet is a belief or principle, which has nothing to do with building infrastructure.'
  7:
    moments:
      - say: 'Gap 7 says it makes the planning blank. It means infrastructure being included.'
        write: 'Including infrastructure makes planning ___'
        point:
          - {passage: true, kind: circle, target: 'It makes the planning', text: '"It" = including infrastructure'}
      - say: 'Infrastructure touches every part of the economy. Including it makes the planning complete, covering the whole.'
        write: 'covers every part = complete'
        point:
          - {line: 1, kind: highlight, at: 'covers every part', text: 'the clue'}
          - {passage: true, kind: label, target: 'the immense importance of infrastructure', text: 'infrastructure touches everything'}
          - {passage: true, kind: label, target: 'national development and integration', text: 'integration: all parts joined'}
      - say: 'The word for dealing with the whole of something, the whole pie, is holistic.'
        write: 'holistic = dealing with the whole'
        point:
          - {line: 2, kind: highlight, at: 'the whole'}
      - say: 'A partial, only a slice, says the opposite. Abnormal and curative, which means healing, do not fit.'
        write: 'a partial ✗ · abnormal ✗ · curative = healing ✗'
        point:
          - {line: 3, kind: strike}
          - {passage: true, kind: label, target: 'realistic planning efforts', text: '"a partial" clashes with realistic'}
      - say: 'So the answer is holistic, which is answer choice A.'
        write: 'A · holistic'
        answer: true
    traps:
      B: 'You went for a partial. The passage praises including infrastructure, so it makes planning complete, not partial.'
      C: 'You went for abnormal. Nothing suggests infrastructure makes planning strange; the point is that it makes it complete.'
      D: 'You went for curative, which means healing. Planning is not being cured of anything here.'
  8:
    moments:
      - say: 'Gap 8 reads, when blank provisions are made. What kind of provisions?'
        write: 'When ___ provisions are made'
      - say: 'Provisions here means money set aside for something.'
        write: 'provisions = money set aside'
        point:
          - {passage: true, kind: label, target: 'provisions are made', text: 'provisions = money set aside'}
      - say: 'Money set aside by a government is set aside in the budget. So budgetary provisions.'
        write: 'budgetary provisions = money in the budget'
        point:
          - {line: 2, kind: underline, at: 'budgetary provisions'}
          - {passage: true, kind: label, target: 'realistic planning efforts', text: 'plans need money: a budget'}
          - {line: 2, kind: highlight, at: 'budgetary provisions'}
      - say: 'Check the next words, which say infrastructural estimates should be embedded. Estimates of cost go into a budget. It fits.'
        write: 'estimates go into the budget ✓'
        point:
          - {line: 3, kind: highlight, at: 'estimates go into the budget', text: 'the clue'}
          - {passage: true, kind: underline, target: 'should be embedded', text: 'costs built into a budget'}
      - say: 'So the answer is budgetary, which is answer choice B.'
        write: 'B · budgetary'
        answer: true
    traps:
      A: 'You went for planning. Planning provisions is not a usual phrase, and the sentence is about money, which is set aside in a budget.'
      C: 'You went for projected. Projected provisions is not natural English, and it says nothing about where the money is set aside.'
      D: 'You went for national. National provisions is vague; the next clause talks about cost estimates, which belong in a budget.'
  9:
    moments:
      - say: 'In gap 9, when budgetary provisions are made, infrastructural blank should be embedded.'
        write: 'infrastructural ___ should be embedded'
        point:
          - {passage: true, kind: underline, target: 'should be embedded', text: 'built in where? the budget'}
      - say: 'Embedded means built into. What gets built into a budget? Figures, the costs beside each row.'
        write: 'embedded in a budget = costs, figures'
        point:
          - {line: 1, kind: highlight, at: 'embedded in a budget', text: 'the clue'}
          - {line: 1, kind: highlight, at: 'embedded in a budget', to: {passage: true, target: 'provisions are made'}}
      - say: 'Calculated costs, the figures in a budget, are called estimates.'
        write: 'estimates = calculated costs'
        point:
          - {passage: true, kind: label, target: 'Where these are glaringly', text: '"these" = the cost figures'}
      - say: 'Prompt is not a noun here, and processes are actions, not figures in a budget.'
        write: 'prompt ✗ · processes ✗'
        point:
          - {line: 3, kind: strike}
      - say: 'So the answer is estimates, which is answer choice A.'
        write: 'A · estimates'
        answer: true
    traps:
      B: 'You went for prompt. Prompt means quick, or a reminder; neither goes into a budget. The budget needs cost figures, estimates.'
      C: 'You went for prompt. Prompt means quick, or a reminder; neither goes into a budget. The budget needs cost figures, estimates.'
      D: 'You went for processes. Processes are ways of doing things. A budget holds figures, so the cost estimates are what get embedded.'
  10:
    moments:
      - say: 'Gap 10 reads, where these are glaringly blank. These are the infrastructure estimates that should be in the budget.'
        write: 'Where these (estimates) are glaringly ___'
        point:
          - {line: 0, kind: highlight, at: 'glaringly', text: 'the clue'}
          - {passage: true, kind: label, target: 'Where these are', text: '"these" = the estimates'}
          - {passage: true, kind: circle, target: 'glaringly', text: 'very obviously'}
      - say: 'Glaringly means very obviously. What obvious mistake can happen to a cost that should be in the budget?'
        write: 'glaringly = very obviously'
      - say: 'It can be left out, an empty space in the budget. Left out is omitted.'
        write: 'should be included ↔ omitted = left out'
        point:
          - {line: 2, kind: highlight, at: 'should be included', to: {passage: true, target: 'should be embedded'}}
          - {line: 2, kind: highlight, at: omitted}
      - say: 'Check the result, which says then national development can be greatly impaired. Leaving the costs out would do that.'
        write: 'omitted → development impaired ✓'
        point:
          - {passage: true, kind: underline, target: 'national development and integration can be greatly', text: 'the harm that follows'}
      - say: 'Altered only means changed, which need not do harm. Shortened and cleared do not fit.'
        write: 'altered = changed ✗ · shortened ✗ · cleared ✗'
        point:
          - {line: 4, kind: strike}
      - say: 'So the answer is omitted, which is answer choice C.'
        write: 'C · omitted'
        answer: true
    traps:
      A: 'You went for shortened. Estimates are not shortened; the danger the sentence points to is that they are left out altogether.'
      B: 'You went for cleared. Cleared estimates would be approved, which would help development, not harm it.'
      D: 'You went for altered. Changing the estimates is not a glaring failure. The opposite of including them in the budget is omitting them.'
  11:
    moments:
      - say: 'In gap 11, national development and integration can be greatly blank.'
        write: 'development and integration can be greatly ___'
        point:
          - {line: 0, kind: highlight, at: 'greatly', text: 'the clue'}
          - {passage: true, kind: label, target: 'Where these are glaringly', text: 'cause: costs left out'}
          - {passage: true, kind: circle, target: 'greatly', text: 'greatly + a harm word'}
      - say: 'This is the bad result of leaving infrastructure out of the budget. We need a word meaning damaged or weakened, like a crack in a bridge.'
        write: 'need: damaged, weakened'
        point:
          - {passage: true, kind: underline, target: 'national development and integration', text: 'what gets damaged'}
      - say: 'Impaired means weakened or damaged, like a cracked bridge. It goes well with greatly.'
        write: 'impaired = weakened, damaged'
        point:
          - {line: 2, kind: highlight, at: 'weakened, damaged'}
      - say: 'Degraded is used for land or quality, reduced does not fit integration, and denied is the wrong idea.'
        write: 'degraded ✗ · reduced ✗ · denied ✗'
        point:
          - {line: 3, kind: strike}
      - say: 'So the answer is impaired, which is answer choice A.'
        write: 'A · impaired'
        answer: true
    traps:
      B: 'You went for degraded. We speak of degraded land or degraded quality. For development being weakened, impaired is the right word.'
      C: 'You went for reduced. Development might be reduced, but integration cannot really be reduced. Impaired covers both.'
      D: 'You went for denied. Development is not refused to anyone here; it is damaged. That is impaired.'
  12:
    moments:
      - say: 'Gap 12 says developing countries place other blank interests far above infrastructure.'
        write: 'place other ___ interests far above infrastructure'
        point:
          - {passage: true, kind: label, target: 'place other', text: 'other what interests?'}
      - say: 'Look at what the passage compares infrastructure with. It says take precedence over other sectors.'
        write: '"take precedence over other sectors"'
        point:
          - {line: 1, kind: highlight, at: 'other sectors', text: 'the clue'}
          - {passage: true, kind: label, target: 'over other sectors', text: 'the answer: other sectors'}
      - say: 'So the other interests belong to other sectors of the economy, its other parts.'
        write: 'interests of other sectors'
        point:
          - {line: 2, kind: highlight, at: 'interests of other sectors', to: {passage: true, target: 'interests far above'}}
          - {line: 2, kind: highlight, at: 'other sectors'}
      - say: 'The adjective from sector is sectorial, or sectoral. Each part is a sector.'
        write: 'sector → sectorial'
      - say: 'Sectional means belonging to a group of people. Selectional and palliative do not fit.'
        write: 'sectional = of a group of people ✗'
        point:
          - {line: 4, kind: strike, at: 'sectional'}
      - say: 'So the answer is sectorial, which is answer choice B.'
        write: 'B · sectorial'
        answer: true
    traps:
      A: 'You went for sectional. It looks similar, but sectional interests belong to groups of people. The passage compares infrastructure with other sectors, so sectorial.'
      C: 'You went for selectional. That is not a word that goes with interests here. The passage talks about sectors.'
      D: 'You went for palliative, which means easing pain for a while. It does not describe interests that compete with infrastructure.'
  13:
    moments:
      - say: 'In gap 13, a nation that neglects infrastructure may continue to experience blank.'
        write: 'may continue to experience ___'
        point:
          - {passage: true, kind: label, target: 'this erroneous position', text: 'wrong: neglecting infrastructure'}
      - say: 'The whole passage is about national development and growth. So the harm is to the economy.'
        write: 'theme: development, growth'
        point:
          - {passage: true, kind: circle, target: 'national development', text: 'theme: development'}
      - say: 'Without roads, power and water, the economy stops growing and stays flat. That is stagnation.'
        write: 'stagnation = standing still, no growth'
        point:
          - {passage: true, kind: label, target: 'importance of infrastructure to national', text: 'infrastructure drives growth'}
      - say: 'Continue to experience suits a lasting state like stagnation, where growth stays flat when it should climb. A recession is a short fall.'
        write: 'continue → lasting state → economic stagnation'
        point:
          - {line: 3, kind: highlight, at: 'continue', text: 'the clue'}
          - {passage: true, kind: circle, target: 'continue to experience', text: 'a lasting state'}
      - say: 'Social decay moves away from the economy, and management is not a problem at all.'
        write: 'social decay ✗ · management ✗'
        point:
          - {line: 4, kind: strike}
      - say: 'So the answer is economic stagnation, which is answer choice A.'
        write: 'A · economic stagnation'
        answer: true
    traps:
      B: 'You went for recession. A recession is a temporary fall. Continue to experience points to a lasting state, and the passage is about growth, so stagnation.'
      C: 'You went for social decay. The passage talks about development and growth, which are economic ideas. Economic stagnation stays with its argument.'
      D: 'You went for management. Management is not something bad that a nation suffers. The gap needs a harmful result.'
  14:
    moments:
      - say: 'Gap 14 says infrastructural development should be made to take blank over other sectors.'
        write: 'take ___ over other sectors'
        point:
          - {passage: true, kind: underline, target: 'should be made to take', text: 'take ___ over: a fixed phrase'}
      - say: 'Take blank over is a fixed phrase. Right now infrastructure is at the back of the queue. The passage wants it to come first.'
        write: 'meaning: come first, be more important'
        point:
          - {passage: true, kind: label, target: 'far above the development of infrastructure', text: 'now it is placed below others'}
      - say: 'The fixed phrase is take precedence over, so roads move to the front, before the others.'
        write: 'take precedence over = come before'
        point:
          - {line: 2, kind: box, at: 'take precedence over', text: 'fixed phrase'}
          - {passage: true, kind: label, target: 'the immense importance of infrastructure', text: 'why it must come first'}
      - say: 'Antecedent is something that came before, but we never say take antecedent. Control and advantage are not the idea.'
        write: 'antecedent ✗ · control ✗ · advantage ✗'
        point:
          - {line: 3, kind: strike}
      - say: 'So the answer is precedence, which is answer choice B.'
        write: 'B · precedence'
        answer: true
    traps:
      A: 'You went for antecedent. It is related to coming before, but English does not say take antecedent over. The phrase is take precedence over.'
      C: 'You went for control. The passage does not want infrastructure to control other sectors, only to come first.'
      D: 'You went for advantage. We take advantage of something, not over it. The phrase that means come first is take precedence over.'
  15:
    moments:
      - say: 'Gap 15 reads, the immense importance of infrastructure to national blank.'
        write: 'importance of infrastructure to national ___'
        point:
          - {line: 0, kind: highlight, at: 'infrastructure to national', text: 'the clue'}
          - {passage: true, kind: circle, target: 'immense importance', text: 'infrastructure matters hugely'}
      - say: 'What does infrastructure, such as a road, do for a nation? It helps the economy grow.'
        write: 'infrastructure → the nation grows'
        point:
          - {passage: true, kind: label, target: 'national development and integration', text: 'the theme: the nation develops'}
      - say: 'National growth fits the passage''s theme of development.'
        write: 'national growth ✓'
        point:
          - {line: 2, kind: highlight, at: 'national growth', to: {passage: true, target: 'infrastructure to national'}}
          - {line: 2, kind: highlight, at: 'national growth'}
      - say: 'Awareness, orientation and policy are not built by roads and power.'
        write: 'awareness ✗ · orientation ✗ · policy ✗'
        point:
          - {line: 3, kind: strike}
      - say: 'So the answer is growth, which is answer choice D.'
        write: 'D · growth'
        answer: true
