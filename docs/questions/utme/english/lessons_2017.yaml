      - say: 'Listen closely. The shop closes AT 4 p.m. The stress is on the small word at, so I say it loudest.'
        write: 'The shop closes AT 4 p.m.'
        mouth: {id: mouth, word: 'AT', caption: 'AT: said loudest'}
      - say: 'Emphatic stress corrects the wrong word in the question. So the question used a different word in place of AT.'
        write: 'question had a different word for "at"'
        point:
          - {line: 0, kind: underline, at: 'AT', text: 'stressed'}
      - say: 'Option A asks, does the shop close by 4 p.m.? The answer is no, AT 4 p.m., exactly when the clock says four.'
        write: 'by 4 p.m.? → No, AT 4 p.m. ✓'
        doodle_do:
          - {id: mouth, op: say, word: 'AT', 'on': 'AT'}
        point:
          - {line: 2, kind: highlight, at: 'by 4 p.m.', text: 'wrong word'}
      - say: 'Open would stress CLOSES. A stall would stress SHOP. A shop would stress THE.'
        write: 'B closes · C shop · D the'
        doodle_do:
          - {id: mouth, op: say, word: 'CLOSES', 'on': 'CLOSES'}
          - {id: mouth, op: say, word: 'SHOP', 'on': 'SHOP'}
          - {id: mouth, op: say, word: 'THE', 'on': 'THE'}
        point:
          - {line: 3, kind: strike}
      - say: 'So the answer is does the shop close by 4 p.m., which is answer choice A.'
        write: 'A · Does the shop close by 4 p.m.?'
        answer: true
    traps:
      B: 'You went for does the shop open at 4 p.m.? The answer would stress CLOSES: the shop CLOSES at 4 p.m.'
      C: 'You went for does the stall close at 4 p.m.? The answer would stress SHOP: the SHOP closes at 4 p.m.'
      D: 'You went for does a shop close at 4 p.m.? The answer would stress THE, not AT.'
