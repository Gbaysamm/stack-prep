      A: 'You went for anxious. Anxious is about worry, not health. Indisposed means unwell, so its opposite is healthy.'
      B: 'You went for fragile. Fragile is weak and easily hurt, which is close to unwell, not opposite.'
      D: 'You went for cautious. Being careful has nothing to do with being unwell.'
  35:
    moments:
      - say: 'We want the opposite of conscientious, as in a conscientious student.'
        write: 'conscientious = ?'
      - say: 'A conscientious person is careful to do their duty well and thoroughly.'
        write: 'conscientious = careful, dutiful'
      - say: 'The opposite is someone who does not take their duties seriously: irresponsible.'
        write: 'opposite: irresponsible'
      - say: 'Persistent, busy and active are close to hard-working, not opposite.'
        write: 'persistent ✗ · busy ✗ · active ✗'
      - say: 'So the answer is an irresponsible, which is answer choice A.'
        write: 'A · an irresponsible'
        answer: true
    traps:
      B: 'You went for a persistent. A persistent student keeps trying, which is close to conscientious, not opposite.'
      C: 'You went for a busy. Busy is on the same side as conscientious. We need the opposite, irresponsible.'
      D: 'You went for an active. Active is close in spirit to conscientious. The opposite is irresponsible.'
  36:
    moments:
      - say: 'We want the meaning of sixth sense, in the poem appealed to my sixth sense.'
        write: 'sixth sense = ?'
