  34:
    moments:
      - say: 'We want the opposite of indisposed. Nosa is indisposed.'
        write: 'indisposed = ?'
      - say: 'Indisposed means slightly ill, unwell.'
        write: 'indisposed = unwell'
      - say: 'The opposite of unwell is healthy.'
        write: 'opposite: healthy'
      - say: 'Anxious, fragile and cautious do not mean well.'
        write: 'anxious ✗ · fragile ✗ · cautious ✗'
      - say: 'So the answer is healthy, which is answer choice C.'
        write: 'C · healthy'
        answer: true
