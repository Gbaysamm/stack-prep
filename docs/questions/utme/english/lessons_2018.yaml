# UTME 2018 Use of English — lessons for the board.
#
# Each lesson is a run of moments: what the teacher says, and the one line written while it
# is said. Answers match explanations_2018.yaml. Item 60 is unrecoverable and has none.
format_version: 1
exam_year: 2018
lessons:
  1:
    moments:
      - say: 'What point of view is the Geography master fond of advancing? Here he is, ready to lecture. Look for his theory in the first paragraph.'
        write: 'The master''s theory = ?'
        doodle: {name: 'custom:2018_q01_a', id: master, caption: 'the master''s favourite theory', size: scene}
        point:
          - {passage: true, kind: label, target: 'He would forever stick to his theory', text: 'his favourite view is coming'}
      - say: 'He sticks to his theory of Africans suffering from a curse, inflicted by the Almighty God. There is the cloud of the curse over them.'
        write: '"Africans suffering from a curse ... by the Almighty God"'
        doodle_do:
          - {id: master, op: stage, stage: 'custom:2018_q01_a2'}
        point:
          - {line: 1, kind: highlight, at: 'suffering from a curse', text: 'the clue'}
          - {passage: true, kind: underline, target: 'inflicted on them by the Almighty God', text: 'God sent the curse'}
      - say: 'And why? For some heinous sins committed centuries ago, which is that old scroll of sins. Heinous means very wicked.'
        write: '"for some heinous sins committed centuries ago"'
        doodle_do:
          - {id: master, op: stage, stage: 'custom:2018_q01_a3'}
        point:
          - {line: 2, kind: highlight, at: 'heinous sins', text: 'why'}
          - {passage: true, kind: circle, target: 'heinous', text: 'heinous = very wicked'}
      - say: 'So his view, the whole picture, is that God is punishing Africans for old sins.'
        write: 'God punishing Africans for sins long ago'
        doodle_do:
          - {id: master, op: circle, part: cloud}
        point:
          - {line: 3, kind: highlight, at: 'sins long ago', to: {passage: true, target: 'committed centuries ago'}}
          - {line: 3, kind: highlight, at: 'God punishing Africans', to: {doodle: master, part: cloud}}
      - say: 'The mosquitoes and snakes are only his examples. The theory in his bubble is the curse.'
        write: 'mosquitoes, snakes = examples only'
        doodle_do:
          - {id: master, op: label, part: bubble, text: 'mosquitoes, snakes: only examples'}
        point:
          - {passage: true, kind: label, target: 'in support of this theory', text: 'the questions only support it'}
      - say: 'So the answer is the Almighty God is punishing Africans for sins they committed long ago, which is answer choice C.'
        write: 'C · God is punishing Africans for sins long ago'
        answer: true
    traps:
      A: 'You went for Africans are infested with all kinds of problems. His examples show problems, but his point of view is why: a curse from God for old sins.'
      B: 'You went for only white men are free from deadly diseases. That is part of one example, not the theory he keeps advancing.'
      D: 'You went for God did not curse the white people. He never says that. His theory is about Africans being punished.'
  2:
    moments:
      - say: 'Which argument did the master not use? First, list the ones he did use. He asked three questions.'
        write: 'His three questions:'
        point:
          - {passage: true, kind: label, target: 'in support of this theory, ask listeners', text: 'his three questions follow'}
      - say: 'One is the mosquito. Why does our mosquito give deadly malaria, while the British mosquito does not bite?'
        write: '1. mosquito: deadly here, harmless in Britain (A)'
        doodle: {name: 'custom:2018_q02_a', id: three, caption: 'his three questions', size: scene}
        point:
          - {line: 1, kind: highlight, at: 'mosquito: deadly here, harmless in Britain', to: {passage: true, target: 'the British mosquito does not bite'}}
          - {line: 1, kind: highlight, at: mosquito, to: {doodle: three, part: mosquito}}
      - say: 'Two is the snake. Why are there no poisonous snakes in Britain, while here most snakes are deadly?'
        write: '2. snakes: deadly here, harmless in Britain (C)'
        doodle_do:
          - {id: three, op: stage, stage: 'custom:2018_q02_a2'}
        point:
          - {line: 2, kind: highlight, at: 'snakes: deadly here, harmless in Britain', to: {passage: true, target: 'poisonous snakes in Britain'}}
          - {line: 2, kind: highlight, at: snakes, to: {doodle: three, part: snake}}
      - say: 'Three is the sickle cell. Why is sickle cell disease peculiar to the black race?'
        write: '3. sickle cell only in black people (D)'
        doodle_do:
          - {id: three, op: stage, stage: 'custom:2018_q02_a3'}
        point:
          - {line: 3, kind: highlight, at: 'sickle cell only in black people', to: {passage: true, target: 'peculiar to the black race'}}
          - {line: 3, kind: highlight, at: 'sickle cell', to: {doodle: three, part: sickle}}
      - say: 'Option B says there is malaria in Britain too. That goes against his theory, so cross it out, because he never used it.'
        write: 'B: malaria in Britain too — against his view'
        doodle_do:
          - {id: three, op: stage, stage: 'custom:2018_q02_a4'}
          - {id: three, op: cross, part: option-b}
        point:
          - {line: 4, kind: highlight, at: 'malaria in Britain too', text: 'never used'}
          - {passage: true, kind: label, target: 'Why would our mosquito inflict deadly malaria on us', text: 'B: he says malaria is ours alone'}
      - say: 'So the answer is there is malaria both in Britain and in African countries, which is answer choice B.'
        write: 'B · There is malaria both in Britain and in Africa'
        answer: true
    traps:
      A: 'You went for the mosquito argument. That is his first question: our mosquito gives malaria, the British one does not bite. He did use it.'
      C: 'You went for the snakes argument. That is his second question, so he did use it.'
      D: 'You went for the sickle cell argument. That is his third question. We want the one he never used.'
  3:
    moments:
      - say: 'What figure of speech is rock the boat? Picture a calm boat. First, what does it mean in the passage?'
        write: '"... rock the boat"'
        doodle: {name: 'custom:2018_q03_a', id: boat, caption: 'a calm class, a calm boat'}
      - say: 'The new boy did not rock a real boat. He stood up and disturbed a calm situation in class, like this.'
        write: 'rock the boat = disturb a calm situation'
        doodle_do:
          - {id: boat, op: stage, stage: 'custom:2018_q03_a2'}
        point:
          - {line: 0, kind: underline, at: 'rock the boat'}
          - {passage: true, kind: label, target: 'the litany we were used to', text: 'the calm the boy disturbed'}
          - {passage: true, kind: label, target: 'without taking the time to sound the water', text: 'boat picture goes on: water'}
      - say: 'So one thing is described as if it were another, with no like or as.'
        write: 'one thing described as another, no like / as'
      - say: 'The class is spoken of as a boat. That is a metaphor. A simile would need like or as.'
        write: 'metaphor ✓ · simile needs like / as'
        doodle_do:
          - {id: boat, op: label, part: boat, text: 'the class = a boat'}
        point:
          - {line: 3, kind: box, at: 'metaphor'}
          - {passage: true, kind: circle, target: 'rock the boat', text: 'no "like" or "as": metaphor'}
      - say: 'Personification gives human qualities to things, and hyperbole is exaggeration. Neither fits.'
        write: 'personification ✗ · hyperbole ✗'
        point:
          - {line: 4, kind: strike}
      - say: 'So the answer is metaphor, which is answer choice B.'
        write: 'B · Metaphor'
        answer: true
    traps:
      A: 'You went for simile. A simile compares using like or as, like brave as a lion. Rock the boat has neither.'
      C: 'You went for personification. That gives human qualities to a thing. Here a person''s action is described as rocking a boat.'
      D: 'You went for hyperbole, which is exaggeration. Rock the boat is not an exaggeration; it is a picture standing for disturbing the peace.'
  4:
    moments:
      - say: 'What extra argument did the new boy add after answering each of the master''s points? First, his answers.'
        write: 'Boy''s answers:'
        point:
          - {passage: true, kind: label, target: 'The new boy calmly said', text: 'his answers start here'}
      - say: 'For sickle cell, some white men have it. The mosquito is deadly in India and South America. Snakes are deadly in America too.'
        write: 'sickle cell ✓ · mosquito ✓ · snakes ✓'
        point:
          - {line: 1, kind: highlight, at: 'sickle cell', to: {passage: true, target: 'a few white men who suffer from the sickle cell disease'}}
          - {line: 1, kind: highlight, at: 'mosquito', to: {passage: true, target: 'The mosquito is equally deadly'}}
          - {line: 1, kind: highlight, at: 'snakes', to: {passage: true, target: 'have their deadly snakes'}}
      - say: 'Then he added something new, just before he sat down.'
        write: 'Then, extra:'
        point:
          - {passage: true, kind: circle, target: 'And, Sir, I know', text: 'an extra point'}
      - say: 'Many white men would prefer our brilliant sunshine to their horribly cold winter. First, their winter, a shivering snowman.'
        write: '"would prefer our brilliant sunshine to their ... cold winter"'
        doodle: {name: 'custom:2018_q04_a', id: weather, caption: 'their horribly cold winter'}
        point:
          - {line: 3, kind: highlight, at: 'would prefer our brilliant sunshine', text: 'the clue'}
      - say: 'And our sunshine beside it. That is about the climate. Many white men prefer the African climate.'
        write: 'sunshine vs cold winter = climate'
        doodle_do:
          - {id: weather, op: stage, stage: 'custom:2018_q04_a2'}
          - {id: weather, op: label, part: sun, text: 'sun or snow = climate'}
        point:
          - {line: 3, kind: arrow, at: 'brilliant sunshine'}
          - {passage: true, kind: label, target: 'their horribly cold winter', text: 'weather = climate'}
          - {line: 4, kind: highlight, at: climate, to: {doodle: weather, part: sun}}
      - say: 'So the answer is many white men prefer the African climate to their own, which is answer choice D.'
        write: 'D · Many white men prefer the African climate'
        answer: true
    traps:
      A: 'You went for there are problems especially in Africa. The boy argued the opposite: the same problems exist elsewhere.'
      B: 'You went for deadly snakes in America and Africa. That was one of his answers to the master''s points, not the extra argument.'
      C: 'You went for harmless snakes in Britain. The boy never said that. His extra point was about the climate.'
  5:
    moments:
      - say: 'Why did the master fight back with a look and not with more argument? Look at the classroom. What did he do?'
        write: 'He answered with a look, then left'
        doodle: {name: 'custom:2018_q05_a', id: room, caption: 'a burning look, and not a word', size: scene}
        point:
          - {passage: true, kind: label, target: 'consumed with anger', text: 'angry, but no answer'}
          - {passage: true, kind: circle, target: 'burning look', text: 'a look, not words'}
      - say: 'He directed a burning look at the boy, and walked out of the door without saying a single word.'
        write: '"Without as much as saying a single word"'
        doodle_do:
          - {id: room, op: pulse, part: look}
          - {id: room, op: move, part: master, path: out}
        point:
          - {line: 1, kind: highlight, at: 'saying a single word', text: 'the clue'}
          - {passage: true, kind: label, target: 'the master stalked out of the classroom', text: 'he left instead of arguing'}
          - {line: 1, kind: highlight, at: 'saying a single word', to: {doodle: room, part: master}}
      - say: 'And look at the end, where never again did he dwell on the issue of Africans being cursed. His theory is left behind, crossed out.'
        write: '"never again did he dwell on the issue"'
        doodle_do:
          - {id: room, op: cross, part: theory}
        point:
          - {line: 2, kind: highlight, at: 'never again', text: 'the clue'}
          - {passage: true, kind: label, target: 'something rather unusual thereafter', text: 'a change: he dropped the theory'}
      - say: 'If he had answers, he would have argued. He dropped the theory. So he knew the boy was right.'
        write: 'no reply + dropped the theory → boy was right'
        doodle_do:
          - {id: room, op: label, part: boy, text: 'his points were valid'}
        point:
          - {passage: true, kind: label, target: 'he met his match', text: 'someone beat his argument'}
      - say: 'So the answer is he knew that the boy''s points were valid, which is answer choice A.'
        write: 'A · He knew the boy''s points were valid'
        answer: true
    traps:
      B: 'You went for he had answers. If he had, he would have given them. He said nothing, and never raised the topic again.'
      C: 'You went for he went out to search for answers. Nothing says so, and he never came back to the topic.'
      D: 'You went for he had already made up his mind. Then why did he never mention it again? He dropped it because the boy was right.'
  6:
    moments:
      - say: 'What grammatical name do we give to who had no answer to this new battle? Look at it in its sentence.'
        write: '"the poor boy, who had no answer to this new battle"'
        point:
          - {passage: true, kind: circle, target: 'the poor boy', text: 'the noun it describes'}
      - say: 'It begins with who, and it describes the noun before it, the poor boy. It hangs on him like a tag.'
        write: 'who ... → describes "the poor boy"'
        doodle: {name: 'custom:2018_q06_a', id: boy, caption: 'the clause hangs on the noun'}
        point:
          - {line: 0, kind: underline, at: 'who had no answer to this new battle', text: 'clause'}
          - {line: 0, kind: circle, at: 'boy', text: 'noun'}
          - {passage: true, kind: underline, target: 'who had no answer to this new battle', text: 'the clause: begins with "who"'}
      - say: 'A clause that starts with who or which and describes a noun is a relative clause.'
        write: 'who / which + describes a noun = relative clause'
        point:
          - {line: 2, kind: box, text: 'the rule'}
      - say: 'There is a comma before it, see the comma on the tag. It only adds extra information. That makes it non-defining.'
        write: 'comma + extra information = non-defining'
        doodle_do:
          - {id: boy, op: circle, part: comma}
          - {id: boy, op: label, part: tag, text: 'extra information'}
      - say: 'It is also subordinate, but relative clause names it exactly. It cannot stand alone, so it is not a main clause.'
        write: 'subordinate = too general · main ✗ · adverbial ✗'
        point:
          - {line: 4, kind: strike, at: 'main ✗ · adverbial'}
          - {passage: true, kind: label, target: 'He directed a burning look', text: 'the main clause is this part'}
      - say: 'So the answer is non-defining relative clause, which is answer choice A.'
        write: 'A · (non-defining) relative clause'
        answer: true
    traps:
      B: 'You went for adverbial clause. An adverbial clause tells how, when, where or why. This one describes a noun, the boy.'
      C: 'You went for subordinate clause. That is true but too general. The exact name for a who-clause describing a noun is relative clause.'
      D: 'You went for main clause. A main clause can stand alone. Who had no answer to this new battle cannot.'
  7:
    moments:
      - say: 'Gap 7 reads, many virus and blank diseases such as measles and tuberculosis. One germ is named, which is the virus.'
        write: 'many virus and ___ diseases'
        doodle: {name: 'custom:2018_q07_a', id: germs, caption: 'one germ named: virus'}
        point:
          - {passage: true, kind: circle, target: 'many virus', text: 'one germ named: virus'}
      - say: 'The gap is paired with virus. So it names another kind of germ that causes disease.'
        write: 'virus + another germ'
        doodle_do:
          - {id: germs, op: pulse, part: virus}
        point:
          - {line: 0, kind: highlight, at: 'virus and', text: 'the clue'}
          - {passage: true, kind: label, target: 'such as measles', text: 'examples of the diseases'}
      - say: 'The two common disease germs are viruses and bacteria, the rod-shaped ones. Tuberculosis is caused by bacteria.'
        write: 'viruses and bacteria · TB = bacterial'
        doodle_do:
          - {id: germs, op: stage, stage: 'custom:2018_q07_a2'}
          - {id: germs, op: label, part: bacteria, text: 'TB is caused by these'}
        point:
          - {passage: true, kind: circle, target: 'tuberculosis', text: 'TB: caused by bacteria'}
          - {line: 2, kind: highlight, at: bacteria, to: {doodle: germs, part: bacteria}}
      - say: 'Germ diseases is not a term. Dirty and mosquito do not name a germ.'
        write: 'germ ✗ · dirty ✗ · mosquito ✗'
        point:
          - {line: 3, kind: strike}
      - say: 'So the answer is bacterial, which is answer choice B.'
        write: 'B · bacterial'
        answer: true
    traps:
      A: 'You went for germ. Viruses are germs too, so virus and germ diseases does not split them into kinds. Bacterial does.'
      C: 'You went for dirty. Diseases are not named dirty diseases. The pair is virus and bacterial.'
      D: 'You went for mosquito. Mosquitoes carry some diseases, but they are not a germ like a virus. The pair is virus and bacterial.'
  8:
    moments:
      - say: 'In gap 8, many others including blank, known also as the common cold.'
        write: 'including ___, known also as the common cold'
        point:
          - {passage: true, kind: label, target: 'many others including', text: 'the gap names a disease'}
      - say: 'So we want the illness whose other name is the common cold.'
        write: 'need: the illness = the common cold'
        point:
          - {line: 0, kind: highlight, at: 'known also as the common cold', text: 'the clue'}
          - {passage: true, kind: underline, target: 'known also as the', text: 'its other name: common cold'}
      - say: 'In everyday speech, catarrh is what we call a cold, with a blocked nose and mucus, like this.'
        write: 'catarrh = a cold ✓'
        doodle: {name: 'custom:2018_q08_a', id: cold, caption: 'catarrh: a cold'}
        point:
          - {passage: true, kind: circle, target: 'cold', text: '"a cold" in everyday speech'}
      - say: 'The runny nose is only a symptom, and so is a headache. Influenza is the flu, a different, more serious illness.'
        write: 'runny nose, headache = symptoms · influenza = flu'
        doodle_do:
          - {id: cold, op: circle, part: drip}
          - {id: cold, op: label, part: drip, text: 'runny nose: only a symptom'}
        point:
          - {line: 3, kind: strike}
      - say: 'So the answer is catarrh, which is answer choice A.'
        write: 'A · catarrh'
        answer: true
    traps:
      B: 'You went for runny nose. That is a symptom of a cold, not an illness known as the common cold.'
      C: 'You went for headache. That is a symptom, and not one that is called the common cold.'
      D: 'You went for influenza. Influenza is the flu, a separate and more serious illness, not the common cold.'
  9:
    moments:
      - say: 'Gap 9 says, known also as the blank cold.'
        write: 'known also as the ___ cold'
        point:
          - {passage: true, kind: label, target: 'many others including', text: 'a well-known illness is named'}
      - say: 'This is a fixed name. The ordinary cold everyone catches is the common cold.'
        write: 'the common cold'
        point:
          - {line: 1, kind: box, text: 'fixed name'}
          - {passage: true, kind: underline, target: 'known also as the', text: 'a set name follows'}
          - {passage: true, kind: circle, target: 'cold', text: 'the ___ cold: a fixed name'}
      - say: 'Common means found everywhere, ordinary. Picture a crowd where everyone in it catches a cold.'
        write: 'common = ordinary, found everywhere'
        doodle: {name: person-small, id: crowd, caption: 'the common cold: everyone gets it', repeat: 12, layout: grid}
        doodle_do:
          - {id: crowd, op: group, n: 12, text: 'everyone catches it'}
      - say: 'Sporadic means happening now and then. Universal and regular are not part of the name.'
        write: 'sporadic ✗ · universal ✗ · regular ✗'
        point:
          - {line: 3, kind: strike}
      - say: 'So the answer is common, which is answer choice A.'
        write: 'A · common'
        answer: true
    traps:
      B: 'You went for sporadic, which means happening now and then. The illness''s fixed name is the common cold.'
      C: 'You went for universal. It means everywhere, but it is not part of the name. We always say the common cold.'
      D: 'You went for regular. A regular cold is not the name. The fixed phrase is the common cold.'
  10:
    moments:
      - say: 'In gap 10, some blank like measles and whooping cough still pose a great danger.'
        write: 'Some ___ like measles and whooping cough still pose'
        point:
          - {passage: true, kind: label, target: 'Outbreaks of many of these diseases', text: 'topic: diseases that spread'}
      - say: 'Measles and whooping cough are diseases passed from person to person. Watch the germ jump along.'
        write: 'measles, whooping cough = caught from others'
        doodle: {name: 'custom:2018_q10_a', id: spread, caption: 'caught from others'}
        doodle_do:
          - {id: spread, op: move, part: germ, path: spread}
        point:
          - {line: 0, kind: highlight, at: 'measles and whooping cough', text: 'the clue'}
          - {passage: true, kind: underline, target: 'like measles and whooping cough', text: 'examples of the gap word'}
      - say: 'The general word for such diseases, caught from others, is infections.'
        write: 'infections ✓'
        doodle_do:
          - {id: spread, op: label, part: germ, text: infection}
      - say: 'The verb is pose, plural, so the noun must be plural too, and we get some infections pose.'
        write: 'some infections ... pose (plural)'
        point:
          - {line: 3, kind: circle, at: 'pose', text: 'plural'}
          - {passage: true, kind: circle, target: 'still pose', text: 'plural verb: plural noun'}
      - say: 'They are not pains or traces, and whooping cough is not a fever.'
        write: 'pains ✗ · traces ✗ · fevers ✗'
        point:
          - {line: 4, kind: strike}
      - say: 'So the answer is infections, which is answer choice C.'
        write: 'C · infections'
        answer: true
    traps:
      A: 'You went for pains. Measles and whooping cough are diseases, not pains. They are infections.'
      B: 'You went for fevers. Measles brings a fever, but whooping cough is a cough. The word that covers both is infections.'
      D: 'You went for traces. Traces are small signs left behind, not diseases.'
  11:
    moments:
      - say: 'Gap 11 reads, the blank of measles are more easily diagnosed.'
        write: 'The ___ of measles are more easily diagnosed'
        point:
          - {passage: true, kind: circle, target: 'of measles are', text: 'plural "are": plural noun'}
      - say: 'A doctor recognises measles from what it shows, which is the rash, the fever, the cough. All three are drawn here.'
        write: 'rash, fever, cough → tell the doctor'
        doodle: {name: 'custom:2018_q11_a', id: sick, caption: 'what measles shows'}
        point:
          - {line: 0, kind: highlight, at: 'are more easily diagnosed', text: 'the clue'}
          - {passage: true, kind: label, target: 'more easily', text: 'easier to recognise', nth: 1}
          - {passage: true, kind: circle, target: 'those of whooping cough', text: '"those" = its symptoms'}
      - say: 'What a disease shows in a patient, the rash and the fever, is called its symptoms.'
        write: 'symptoms ✓'
        doodle_do:
          - {id: sick, op: label, part: rash, text: symptoms}
          - {id: sick, op: pulse, part: fever}
      - say: 'Appearance and feels do not fit. Signs is close, but the usual phrase is the symptoms of measles.'
        write: 'appearance ✗ · feels ✗ · signs (close)'
        point:
          - {line: 3, kind: strike, at: 'appearance ✗ · feels'}
      - say: 'So the answer is symptoms, which is answer choice A.'
        write: 'A · symptoms'
        answer: true
    traps:
      B: 'You went for appearance. It is singular, and the verb are needs a plural. The word is symptoms.'
      C: 'You went for feels. That is not a noun used for disease. We speak of the symptoms of measles.'
      D: 'You went for signs. It is close, but the standard word for what a disease shows is symptoms.'
  12:
    moments:
      - say: 'In gap 12, the symptoms of measles are more easily blank than those of whooping cough.'
        write: 'symptoms ... more easily ___'
        point:
          - {passage: true, kind: circle, target: 'more easily', text: 'easier to what? to identify', nth: 1}
      - say: 'What do doctors do with symptoms? They use them to name the disease.'
        write: 'symptoms → name the disease'
        point:
          - {line: 0, kind: highlight, at: 'symptoms', text: 'the clue'}
          - {passage: true, kind: label, target: 'of measles are', text: 'symptoms of measles (gap 11)'}
      - say: 'Naming a disease from its symptoms is diagnosing it.'
        write: 'diagnose = identify a disease ✓'
        point:
          - {passage: true, kind: label, target: 'than those of whooping cough', text: 'which disease is it? compare'}
      - say: 'We treat or handle a disease, not its symptoms, in this comparison.'
        write: 'treated ✗ · dealt with ✗ · handled ✗'
        point:
          - {line: 3, kind: strike}
      - say: 'So the answer is diagnosed, which is answer choice A.'
        write: 'A · diagnosed'
        answer: true
    traps:
      B: 'You went for treated. The sentence compares how easily the symptoms are recognised. That is diagnosis.'
      C: 'You went for dealt with. It is vague. Symptoms are used to diagnose a disease.'
      D: 'You went for handled. Again vague. The word that goes with symptoms is diagnosed.'
  13:
    moments:
      - say: 'Gap 13 says the virus of measles more easily remains blank for hundreds of years.'
        write: 'the virus ... remains ___ for hundreds of years'
        point:
