# UTME 2018 Use of English — lessons for the board.
#
# Each lesson is a run of moments: what the teacher says, and the one line written while it
# is said. Answers match explanations_2018.yaml. Item 60 is unrecoverable and has none.
format_version: 1
exam_year: 2018
lessons:
  1:
    moments:
      - say: 'What point of view is the Geography master fond of advancing? Look for his theory in the first paragraph.'
        write: 'The master''s theory = ?'
      - say: 'He sticks to his theory of Africans suffering from a curse, inflicted by the Almighty God.'
        write: '"Africans suffering from a curse ... by the Almighty God"'
        point:
          - {line: 1, kind: highlight, at: 'suffering from a curse', text: 'the clue'}
      - say: 'And why? For some heinous sins committed centuries ago. Heinous means very wicked.'
        write: '"for some heinous sins committed centuries ago"'
        point:
          - {line: 2, kind: highlight, at: 'heinous sins', text: 'why'}
      - say: 'So his view: God is punishing Africans for old sins.'
        write: 'God punishing Africans for sins long ago'
      - say: 'The mosquitoes and snakes are only his examples. The theory is the curse.'
        write: 'mosquitoes, snakes = examples only'
      - say: 'So the answer is the Almighty God is punishing Africans for sins they committed long ago, which is answer choice C.'
        write: 'C · God is punishing Africans for sins long ago'
        answer: true
    traps:
      A: 'You went for Africans are infested with all kinds of problems. His examples show problems, but his point of view is why: a curse from God for old sins.'
      B: 'You went for only white men are free from deadly diseases. That is part of one example, not the theory he keeps advancing.'
      D: 'You went for God did not curse the white people. He never says that. His theory is about Africans being punished.'
  2:
    moments:
      - say: 'Which argument did the master not use? First, list the ones he did use. He asked three questions.'
        write: 'His three questions:'
      - say: 'One: why does our mosquito give deadly malaria, while the British mosquito does not bite?'
        write: '1. mosquito: deadly here, harmless in Britain (A)'
      - say: 'Two: why are there no poisonous snakes in Britain, while here most snakes are deadly?'
        write: '2. snakes: deadly here, harmless in Britain (C)'
      - say: 'Three: why is sickle cell disease peculiar to the black race?'
        write: '3. sickle cell only in black people (D)'
      - say: 'Option B says there is malaria in Britain too. That goes against his theory, so he never used it.'
        write: 'B: malaria in Britain too — against his view'
        point:
          - {line: 4, kind: highlight, at: 'malaria in Britain too', text: 'never used'}
      - say: 'So the answer is there is malaria both in Britain and in African countries, which is answer choice B.'
        write: 'B · There is malaria both in Britain and in Africa'
        answer: true
    traps:
      A: 'You went for the mosquito argument. That is his first question: our mosquito gives malaria, the British one does not bite. He did use it.'
      C: 'You went for the snakes argument. That is his second question, so he did use it.'
      D: 'You went for the sickle cell argument. That is his third question. We want the one he never used.'
  3:
    moments:
      - say: 'What figure of speech is rock the boat? First, what does it mean in the passage?'
        write: '"... rock the boat"'
      - say: 'The new boy did not rock a real boat. He disturbed a calm situation in class.'
        write: 'rock the boat = disturb a calm situation'
        point:
          - {line: 0, kind: underline, at: 'rock the boat'}
      - say: 'So one thing is described as if it were another, with no like or as.'
        write: 'one thing described as another, no like / as'
      - say: 'That is a metaphor. A simile would need like or as.'
        write: 'metaphor ✓ · simile needs like / as'
        point:
          - {line: 3, kind: box, at: 'metaphor'}
      - say: 'Personification gives human qualities to things; hyperbole is exaggeration. Neither fits.'
        write: 'personification ✗ · hyperbole ✗'
        point:
          - {line: 4, kind: strike}
      - say: 'So the answer is metaphor, which is answer choice B.'
        write: 'B · Metaphor'
        answer: true
    traps:
      A: 'You went for simile. A simile compares using like or as, like brave as a lion. Rock the boat has neither.'
      C: 'You went for personification. That gives human qualities to a thing. Here a person''s action is described as rocking a boat.'
      D: 'You went for hyperbole, which is exaggeration. Rock the boat is not an exaggeration; it is a picture standing for disturbing the peace.'
  4:
    moments:
      - say: 'What extra argument did the new boy add after answering each of the master''s points? First, his answers.'
        write: 'Boy''s answers:'
      - say: 'Sickle cell: some white men have it. Mosquito: deadly in India and South America. Snakes: deadly in America too.'
        write: 'sickle cell ✓ · mosquito ✓ · snakes ✓'
      - say: 'Then he added something new, just before he sat down.'
        write: 'Then, extra:'
      - say: 'Many white men would prefer our brilliant sunshine to their horribly cold winter.'
        write: '"would prefer our brilliant sunshine to their ... cold winter"'
        point:
          - {line: 3, kind: highlight, at: 'would prefer our brilliant sunshine', text: 'the clue'}
      - say: 'That is about the climate. Many white men prefer the African climate.'
        write: 'sunshine vs cold winter = climate'
        point:
          - {line: 3, kind: arrow, at: 'brilliant sunshine'}
      - say: 'So the answer is many white men prefer the African climate to their own, which is answer choice D.'
        write: 'D · Many white men prefer the African climate'
        answer: true
    traps:
      A: 'You went for there are problems especially in Africa. The boy argued the opposite: the same problems exist elsewhere.'
      B: 'You went for deadly snakes in America and Africa. That was one of his answers to the master''s points, not the extra argument.'
      C: 'You went for harmless snakes in Britain. The boy never said that. His extra point was about the climate.'
  5:
    moments:
      - say: 'Why did the master fight back with a look and not with more argument? What did he do?'
        write: 'He answered with a look, then left'
      - say: 'He directed a burning look at the boy, and left without saying a single word.'
        write: '"Without as much as saying a single word"'
        point:
          - {line: 1, kind: highlight, at: 'saying a single word', text: 'the clue'}
      - say: 'And look at the end: never again did he dwell on the issue of Africans being cursed.'
        write: '"never again did he dwell on the issue"'
        point:
          - {line: 2, kind: highlight, at: 'never again', text: 'the clue'}
      - say: 'If he had answers, he would have argued. He dropped the theory. So he knew the boy was right.'
        write: 'no reply + dropped the theory → boy was right'
      - say: 'So the answer is he knew that the boy''s points were valid, which is answer choice A.'
        write: 'A · He knew the boy''s points were valid'
        answer: true
    traps:
      B: 'You went for he had answers. If he had, he would have given them. He said nothing, and never raised the topic again.'
      C: 'You went for he went out to search for answers. Nothing says so, and he never came back to the topic.'
      D: 'You went for he had already made up his mind. Then why did he never mention it again? He dropped it because the boy was right.'
  6:
    moments:
      - say: 'What grammatical name do we give to who had no answer to this new battle? Look at it in its sentence.'
        write: '"the poor boy, who had no answer to this new battle"'
      - say: 'It begins with who, and it describes the noun before it, the poor boy.'
        write: 'who ... → describes "the poor boy"'
        point:
          - {line: 0, kind: underline, at: 'who had no answer to this new battle', text: 'clause'}
          - {line: 0, kind: circle, at: 'boy', text: 'noun'}
      - say: 'A clause that starts with who or which and describes a noun is a relative clause.'
        write: 'who / which + describes a noun = relative clause'
        point:
          - {line: 2, kind: box, text: 'the rule'}
      - say: 'There is a comma before it. It only adds extra information. That makes it non-defining.'
        write: 'comma + extra information = non-defining'
      - say: 'It is also subordinate, but relative clause names it exactly. It cannot stand alone, so it is not a main clause.'
        write: 'subordinate = too general · main ✗ · adverbial ✗'
        point:
          - {line: 4, kind: strike, at: 'main ✗ · adverbial'}
      - say: 'So the answer is non-defining relative clause, which is answer choice A.'
        write: 'A · (non-defining) relative clause'
        answer: true
    traps:
      B: 'You went for adverbial clause. An adverbial clause tells how, when, where or why. This one describes a noun, the boy.'
      C: 'You went for subordinate clause. That is true but too general. The exact name for a who-clause describing a noun is relative clause.'
      D: 'You went for main clause. A main clause can stand alone. Who had no answer to this new battle cannot.'
  7:
    moments:
      - say: 'Gap 7: many virus and blank diseases such as measles and tuberculosis.'
        write: 'many virus and ___ diseases'
      - say: 'The gap is paired with virus. So it names another kind of germ that causes disease.'
        write: 'virus + another germ'
        point:
          - {line: 0, kind: highlight, at: 'virus and', text: 'the clue'}
      - say: 'The two common disease germs are viruses and bacteria. Tuberculosis is caused by bacteria.'
        write: 'viruses and bacteria · TB = bacterial'
      - say: 'Germ diseases is not a term. Dirty and mosquito do not name a germ.'
        write: 'germ ✗ · dirty ✗ · mosquito ✗'
        point:
          - {line: 3, kind: strike}
      - say: 'So the answer is bacterial, which is answer choice B.'
        write: 'B · bacterial'
        answer: true
    traps:
      A: 'You went for germ. Viruses are germs too, so virus and germ diseases does not split them into kinds. Bacterial does.'
      C: 'You went for dirty. Diseases are not named dirty diseases. The pair is virus and bacterial.'
      D: 'You went for mosquito. Mosquitoes carry some diseases, but they are not a germ like a virus. The pair is virus and bacterial.'
  8:
    moments:
      - say: 'Gap 8: many others including blank, known also as the common cold.'
        write: 'including ___, known also as the common cold'
      - say: 'So we want the illness whose other name is the common cold.'
        write: 'need: the illness = the common cold'
        point:
          - {line: 0, kind: highlight, at: 'known also as the common cold', text: 'the clue'}
      - say: 'In everyday speech, catarrh is what we call a cold: blocked nose and mucus.'
        write: 'catarrh = a cold ✓'
      - say: 'A runny nose and a headache are only symptoms. Influenza is the flu, a different, more serious illness.'
        write: 'runny nose, headache = symptoms · influenza = flu'
        point:
          - {line: 3, kind: strike}
      - say: 'So the answer is catarrh, which is answer choice A.'
        write: 'A · catarrh'
        answer: true
    traps:
      B: 'You went for runny nose. That is a symptom of a cold, not an illness known as the common cold.'
      C: 'You went for headache. That is a symptom, and not one that is called the common cold.'
      D: 'You went for influenza. Influenza is the flu, a separate and more serious illness, not the common cold.'
  9:
    moments:
      - say: 'Gap 9: known also as the blank cold.'
        write: 'known also as the ___ cold'
      - say: 'This is a fixed name. The ordinary cold everyone catches is the common cold.'
        write: 'the common cold'
        point:
          - {line: 1, kind: box, text: 'fixed name'}
      - say: 'Common means found everywhere, ordinary.'
        write: 'common = ordinary, found everywhere'
      - say: 'Sporadic means happening now and then. Universal and regular are not part of the name.'
        write: 'sporadic ✗ · universal ✗ · regular ✗'
        point:
          - {line: 3, kind: strike}
      - say: 'So the answer is common, which is answer choice A.'
        write: 'A · common'
        answer: true
    traps:
      B: 'You went for sporadic, which means happening now and then. The illness''s fixed name is the common cold.'
      C: 'You went for universal. It means everywhere, but it is not part of the name. We always say the common cold.'
      D: 'You went for regular. A regular cold is not the name. The fixed phrase is the common cold.'
  10:
    moments:
      - say: 'Gap 10: some blank like measles and whooping cough still pose a great danger.'
        write: 'Some ___ like measles and whooping cough still pose'
      - say: 'Measles and whooping cough are diseases passed from person to person.'
        write: 'measles, whooping cough = caught from others'
        point:
          - {line: 0, kind: highlight, at: 'measles and whooping cough', text: 'the clue'}
      - say: 'The general word for such diseases is infections.'
        write: 'infections ✓'
      - say: 'The verb is pose, plural, so the noun must be plural too: some infections pose.'
        write: 'some infections ... pose (plural)'
        point:
          - {line: 3, kind: circle, at: 'pose', text: 'plural'}
      - say: 'They are not pains or traces, and whooping cough is not a fever.'
        write: 'pains ✗ · traces ✗ · fevers ✗'
        point:
          - {line: 4, kind: strike}
      - say: 'So the answer is infections, which is answer choice C.'
        write: 'C · infections'
        answer: true
    traps:
      A: 'You went for pains. Measles and whooping cough are diseases, not pains. They are infections.'
      B: 'You went for fevers. Measles brings a fever, but whooping cough is a cough. The word that covers both is infections.'
      D: 'You went for traces. Traces are small signs left behind, not diseases.'
  11:
    moments:
      - say: 'Gap 11: the blank of measles are more easily diagnosed.'
        write: 'The ___ of measles are more easily diagnosed'
      - say: 'A doctor recognises measles from what it shows: the rash, the fever, the cough.'
        write: 'rash, fever, cough → tell the doctor'
        point:
          - {line: 0, kind: highlight, at: 'are more easily diagnosed', text: 'the clue'}
      - say: 'What a disease shows in a patient is called its symptoms.'
        write: 'symptoms ✓'
      - say: 'Appearance and feels do not fit. Signs is close, but the usual phrase is the symptoms of measles.'
        write: 'appearance ✗ · feels ✗ · signs (close)'
        point:
          - {line: 3, kind: strike, at: 'appearance ✗ · feels'}
      - say: 'So the answer is symptoms, which is answer choice A.'
        write: 'A · symptoms'
        answer: true
    traps:
      B: 'You went for appearance. It is singular, and the verb are needs a plural. The word is symptoms.'
      C: 'You went for feels. That is not a noun used for disease. We speak of the symptoms of measles.'
      D: 'You went for signs. It is close, but the standard word for what a disease shows is symptoms.'
  12:
    moments:
      - say: 'Gap 12: the symptoms of measles are more easily blank than those of whooping cough.'
        write: 'symptoms ... more easily ___'
      - say: 'What do doctors do with symptoms? They use them to name the disease.'
        write: 'symptoms → name the disease'
        point:
          - {line: 0, kind: highlight, at: 'symptoms', text: 'the clue'}
      - say: 'Naming a disease from its symptoms is diagnosing it.'
        write: 'diagnose = identify a disease ✓'
      - say: 'We treat or handle a disease, not its symptoms, in this comparison.'
        write: 'treated ✗ · dealt with ✗ · handled ✗'
        point:
          - {line: 3, kind: strike}
      - say: 'So the answer is diagnosed, which is answer choice A.'
        write: 'A · diagnosed'
        answer: true
    traps:
      B: 'You went for treated. The sentence compares how easily the symptoms are recognised. That is diagnosis.'
      C: 'You went for dealt with. It is vague. Symptoms are used to diagnose a disease.'
      D: 'You went for handled. Again vague. The word that goes with symptoms is diagnosed.'
  13:
    moments:
      - say: 'Gap 13: the virus of measles more easily remains blank for hundreds of years.'
        write: 'the virus ... remains ___ for hundreds of years'
      - say: 'Read on. Once you have had measles, you develop an immunity that is long lasting.'
        write: 'next sentence: one attack → long-lasting immunity'
        point:
          - {line: 1, kind: highlight, at: 'long-lasting immunity', text: 'the clue'}
      - say: 'Why would one attack protect you for life? Only if the virus stays the same.'
        write: 'lasting protection → virus stays the same'
      - say: 'Stays the same is unchanged. Unlike that of many others, like the flu, which keeps changing.'
        write: 'unchanged ✓'
      - say: 'Undiscovered makes no sense: it has just been described. Erratic is the opposite.'
        write: 'undiscovered ✗ · erratic ✗ · constant (not the word)'
        point:
          - {line: 4, kind: strike, at: 'undiscovered ✗ · erratic'}
      - say: 'So the answer is unchanged, which is answer choice A.'
        write: 'A · unchanged'
        answer: true
    traps:
      B: 'You went for constant. It is close, but we say a virus remains unchanged. Constant is used for things like temperature.'
      C: 'You went for undiscovered. The passage has just named and described the measles virus, so it is not undiscovered.'
      D: 'You went for erratic, which means changing unpredictably. That is the opposite of what makes lifelong immunity possible.'
  14:
    moments:
      - say: 'Gap 14: once you have had an blank of this dreadful disease.'
        write: 'once you have had an ___ of this disease'
      - say: 'One bout of an illness in one person is called an attack.'
        write: 'an attack of measles = one bout ✓'
        point:
          - {line: 0, kind: highlight, at: 'once you have had an', text: 'one person'}
      - say: 'An epidemic affects a whole population, not one person.'
        write: 'epidemic = whole population ✗'
        point:
          - {line: 2, kind: strike, at: 'epidemic'}
      - say: 'Encounter and indisposition do not go with a disease this way.'
        write: 'encounter ✗ · indisposition ✗'
        point:
          - {line: 3, kind: strike}
      - say: 'So the answer is attack, which is answer choice C.'
        write: 'C · attack'
        answer: true
    traps:
      A: 'You went for epidemic. An epidemic is a disease spreading through a whole community. One person has an attack.'
      B: 'You went for encounter. We do not say an encounter of measles. We say an attack of measles.'
      D: 'You went for indisposition. It means being unwell, but we do not say an indisposition of measles.'
  15:
    moments:
      - say: 'Gap 15: after the attack, you develop an blank which is almost complete and long lasting.'
        write: 'you develop an ___ ... almost complete and long lasting'
      - say: 'After recovering, your body protects you from catching it again.'
        write: 'protection from catching it again'
        point:
          - {line: 0, kind: highlight, at: 'almost complete and long lasting', text: 'the clue'}
      - say: 'That protection is called immunity.'
        write: 'immunity ✓'
      - say: 'Armour is only a picture word. Impurity and ability do not fit.'
        write: 'armour ✗ · impurity ✗ · ability ✗'
        point:
          - {line: 3, kind: strike}
      - say: 'So the answer is immunity, which is answer choice C.'
        write: 'C · immunity'
        answer: true
    traps:
      A: 'You went for impurity. That means dirt or contamination. The body develops protection, which is immunity.'
      B: 'You went for armour. It is a nice picture, but the real word for the body''s protection is immunity.'
      D: 'You went for ability. Ability to do what? The word for protection against disease is immunity.'
  16:
    moments:
      - say: 'Gap 16: modern science has made available blank to prevent many childhood diseases.'
        write: 'made available ___ to prevent childhood diseases'
      - say: 'The key word is prevent. Before the child is sick.'
        write: 'prevent = before illness'
        point:
          - {line: 0, kind: highlight, at: 'to prevent', text: 'the clue'}
      - say: 'What prevents a disease before it starts is a vaccine.'
        write: 'vaccines ✓'
      - say: 'Injections, medicine and tablets usually treat illness after it starts.'
        write: 'injections, medicine, tablets = treat'
        point:
          - {line: 3, kind: strike, at: 'injections, medicine, tablets'}
      - say: 'So the answer is vaccines, which is answer choice D.'
        write: 'D · vaccines'
        answer: true
    traps:
      A: 'You went for injections. Some vaccines are injected, but injections in general treat illness. Prevention is by vaccines.'
      B: 'You went for medicine. Medicine usually cures. The passage says prevent, which is what vaccines do.'
      C: 'You went for tablets. Tablets treat illness. Vaccines prevent it.'
  17:
    moments:
      - say: 'Gap 17: this is the only guarantee of blank from these scourges.'
        write: 'the only guarantee of ___ from these scourges'
      - say: 'A scourge is a terrible disease. Vaccines keep children safe from them.'
        write: 'scourge = terrible disease · vaccines keep safe'
        point:
          - {line: 0, kind: highlight, at: 'from these scourges', text: 'the clue'}
      - say: 'Being kept safe from something is protection from it.'
        write: 'protection from ✓'
      - say: 'Cure comes after illness. Discharge is leaving hospital.'
        write: 'cure = after ✗ · discharge ✗'
        point:
          - {line: 3, kind: strike}
      - say: 'So the answer is protection, which is answer choice D.'
        write: 'D · protection'
        answer: true
    traps:
      A: 'You went for freedom. Freedom from is English, but what vaccines give is protection, and the passage later says drugs give protection.'
      B: 'You went for discharge. Discharge is being sent home from hospital. It does not fit guarantee of ___ from scourges.'
      C: 'You went for cure. A cure comes after you are sick. Vaccines work before, giving protection.'
  18:
    moments:
      - say: 'Gap 18: using penicillin and other blank.'
        write: 'using penicillin and other ___'
      - say: 'Other means more of the same kind. So what kind of drug is penicillin?'
        write: 'other = same kind as penicillin'
        point:
          - {line: 0, kind: highlight, at: 'penicillin and other', text: 'the clue'}
      - say: 'Penicillin is an antibiotic. It kills bacteria.'
        write: 'penicillin = an antibiotic ✓'
      - say: 'Relievers, treatments and pills are too general.'
        write: 'relievers ✗ · treatments ✗ · pills ✗'
        point:
          - {line: 3, kind: strike}
      - say: 'So the answer is antibiotics, which is answer choice C.'
        write: 'C · antibiotics'
        answer: true
    traps:
      A: 'You went for relievers. Pain relievers ease pain; penicillin fights bacteria. Other needs the same kind: antibiotics.'
      B: 'You went for treatments. That is too general. Penicillin belongs to the antibiotics.'
      D: 'You went for pills. Penicillin is not always a pill, and pills is too general. The group is antibiotics.'
  19:
    moments:
      - say: 'Gap 19: has also helped to reduce the blank rate among children.'
        write: 'reduce the ___ rate among children'
      - say: 'Better treatment means fewer children die. So this is the death rate.'
        write: 'fewer deaths → death rate'
        point:
          - {line: 0, kind: highlight, at: 'reduce the', text: 'the clue'}
      - say: 'The formal word for the death rate is the mortality rate.'
        write: 'mortality rate = death rate ✓'
      - say: 'The high rate, the killing rate and the dangerous rate are not phrases.'
        write: 'high ✗ · killing ✗ · dangerous ✗'
        point:
          - {line: 3, kind: strike}
      - say: 'So the answer is mortality, which is answer choice B.'
        write: 'B · mortality'
        answer: true
    traps:
      A: 'You went for high. Reduce the high rate does not say what rate. The phrase is the mortality rate.'
      C: 'You went for killing. Killing rate is not used. The death rate is the mortality rate.'
      D: 'You went for dangerous. A rate is not dangerous. The phrase is the mortality rate.'
  20:
    moments:
      - say: 'Gap 20: it is universally accepted that good blank is the right of every human being.'
        write: 'good ___ is the right of every human being'
      - say: 'The whole passage is about diseases. The opposite of disease is health.'
        write: 'topic: disease → health'
        point:
          - {line: 1, kind: highlight, at: 'disease', text: 'the clue'}
      - say: 'Good health is a human right.'
        write: 'good health ✓'
      - say: 'Good body, good sense and good development do not match the topic.'
        write: 'body ✗ · sense ✗ · development ✗'
        point:
          - {line: 3, kind: strike}
      - say: 'So the answer is health, which is answer choice A.'
        write: 'A · health'
        answer: true
    traps:
      B: 'You went for body. We do not say good body is a right. The passage is about disease, so good health.'
      C: 'You went for sense. Good sense is wisdom, not the topic of disease.'
      D: 'You went for development. It is a nice word, but the passage is about disease, and its opposite is health.'
  21:
    moments:
      - say: 'Gap 21: diseases which wiped out whole blank in the Middle Ages.'
        write: 'wiped out whole ___ in the Middle Ages'
      - say: 'A disease kills people. So the gap names a group of people.'
        write: 'wiped out = killed everyone → group of people'
        point:
          - {line: 0, kind: highlight, at: 'wiped out whole', text: 'the clue'}
      - say: 'Plagues killed everyone in whole towns and villages: whole communities.'
        write: 'communities = people living together ✓'
      - say: 'Countries and states are too big; areas are places, not people.'
        write: 'countries ✗ · states ✗ · areas ✗'
        point:
          - {line: 3, kind: strike}
      - say: 'So the answer is communities, which is answer choice C.'
        write: 'C · communities'
        answer: true
    traps:
      A: 'You went for countries. Diseases in the Middle Ages killed many, but they wiped out towns and villages, not whole countries.'
      B: 'You went for areas. An area is a place. A disease wipes out people, so communities.'
      D: 'You went for states. Like countries, too large. Whole communities were wiped out.'
  22:
    moments:
      - say: 'Gap 22: we have today blank drugs which give protection.'
        write: 'We have today ___ drugs which give protection'
      - say: 'The adjective should say how well the drugs work.'
        write: 'need: how well they work'
        point:
          - {line: 0, kind: highlight, at: 'which give protection', text: 'the clue'}
      - say: 'Potent means powerful and effective.'
        write: 'potent = powerful ✓'
      - say: 'Bitter is taste. Lovely and marvellous are vague praise.'
        write: 'bitter = taste ✗ · lovely ✗ · marvellous ✗'
        point:
          - {line: 3, kind: strike}
      - say: 'So the answer is potent, which is answer choice C.'
        write: 'C · potent'
        answer: true
    traps:
      A: 'You went for bitter. Many drugs are bitter, but taste has nothing to do with giving protection.'
