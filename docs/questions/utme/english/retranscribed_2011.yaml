# UTME 2011 Use of English — re-transcribed by hand from JAMB-USE-OF-ENGLISH-PAST-QUESTIONS.pdf, pages 24-45.
#
# All 100 questions. The extractor kept 90: it dropped Q13 (inclinations), all of the cloze
# gaps 18-25 and Q93 (match). All ten are restored from the page. The cloze passage is rebuilt
# with ___(n)___ gaps and the inline option lists moved onto the questions; the stray
# "ENGLISH QUESTIONS" header is gone from Passage I, and the italicised target words that the
# extractor shuffled to the end of the sentence (36-65) are back in place, marked *like this*.
#
# The passages keep the paper's own wording, non-standard grammar included ("a team of
# scientists produce", "Snails leaves"), since the questions are asked of that text. Only
# "0.760c" is written as 0.76°C. Option spellings are mended only where the misprint would
# mislead (each one noted under `corrected`).
#
# For a person to check: Q70 prints its options as two identical pairs ("ferreted" twice,
# "ferreted about" twice) — kept as printed; C is taken as the answer. Q96-97 print the stress
# options with the capitals lost in places; repaired from the evident intention (see notes).
