# UTME 2012 Use of English — re-transcribed by hand from JAMB-USE-OF-ENGLISH-PAST-QUESTIONS.pdf, pages 46-67.
# 100 questions, all recovered. The extractor had dropped nine (25, 35, 66, 69, 70, 74, 76, 77, 85);
# they are restored here from the page. Passage I lost a page header and two scrambled sentences
# (Bori, divination) — rebuilt from the page. The cloze passage was cut at gap 24 — completed, with the
# inline option lists removed. Italicised target words (36-65) and underlined letters (86-91) are
# marked with *asterisks*. Items 95-97 are stress items, not cloze gaps. Cloze text: "conformed
# pregnancies" on the page is written "confirmed"; "twelve week" is written "twelve weeks".
# Small slips in the passages were also mended (Passage I "focus in on" → "is on", "world-priest" →
# "world – priests"; Passage II "literally research" → "literary", "concentrates"/"depends" → plural,
# "Nigerian" (the country) → "Nigeria", the scrambled Achebe sentence; Passage III "you chosen" →
# "your", "need not to be" → "need not be"). "In order words" is left as printed.
# A person should check: 8 (the stem prints a blank where the quoted expression should be) and
# 51 (only "medicine" is italicised, but the options gloss the whole idiom).
