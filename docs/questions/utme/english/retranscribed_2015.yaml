passages:
  - id: passage_2015_passage_i
    label: Passage I
    instructions: 'Read the passage carefully and answer the questions that follow.'
    text: >-
      There are many different approaches to conflict management, each of which may have utility in
      particular circumstances. A great deal of scholarship has been devoted to analysing how and in what
      situations different approaches can be applied most effectively. Conflict management approaches can
      be classified into two broad categories.


      Firstly, on the basis of the level of escalation which the particular conflict is being managed. In
      this sense, one can distinguish between the peaceful and the 'military' approaches. The trademarks of
      the peaceful approach are negotiation, verbal persuasion, use of inducements, denial of privileges, and
      subtle manipulation short of the use of physical forces, while those of the military approach relate
      to the use of physical coercion. The use of physical force could be by a party to a conflict or third
      party, to promote one side's interest, impose a settlement, or create a situation in which diplomatic
      negotiations can occur.


      Secondly, conflict management approaches can also be classified according to the status of the
      participants in the bargaining process. For example, a conflict could be managed through
      'negotiation', that is, direct bargaining by the parties involved in the conflict; or through
      'mediation', that is with the help of a third party.
  - id: passage_2015_native_language
    label: Passage IA
    instructions: 'Read the passage carefully and answer the questions that follow.'
    text: >-
      Language is far more than a means of passing messages from one person to another. A people's
      language and its culture are woven together like the threads of one cloth. The proverbs, songs,
      greetings and names of a community live in its language, and when the language dies, much of the
      culture dies with it.


      It is through our native language that we first come to know the world around us. The child who
      learns the names of plants, of relatives and of the seasons in her mother tongue is also learning how
      her people see and order that world.


      A native language also has a symbolic function. It is a badge of identity which marks a society out
      from its neighbours and tells its members who they are.


      For these reasons, many educationists hold that children learn best when they are taught in the
      language they first spoke. Yet in much of the developing world, schooling is still conducted in a
      foreign language, and pupils must first struggle with a strange tongue before they can grasp the
      lesson itself.
  - id: passage_2015_passage_ii
    label: Passage II (cloze)
    instructions: 'The passage below has numbered gaps. For each gap, four options are provided. Choose the most appropriate.'
    text: >-
      Before now, students bumped unto career by chance or through the insistence of parents. These parents
      had pre-conceived notions of ___(11)___ professions and gave little consideration to their children's
      interest, aptitude, knowledge and skills. Students' career decisions were also ___(12)___ by the type
      of secondary schools they attended.


      Before government take-over of schools in 1971, over 80% of elementary and secondary schools were
      privately owned and competition was ___(13)___ among these schools. Each strived to carve an ___(14)___
      for herself by excelling in sports or academics, and students often ended up in engineering, medicine,
      the sciences and law. Junior students tried to ___(15)___ the career choices of their seniors. This
      spirit of rivalry among mission and private schools waned with government take-over of schools.


      Government involvement in career development is beset with many problems. One such problem is the
      ___(16)___ shortage of professional career development officers. These few officers are ___(17)___
      given the opportunity to practise.


      If the government of Nigeria has ___(18)___ a guidance and counselling policy, it must be pointed out
      that emphasis is still at the secondary level of education. This situation ___(19)___ the current
      view that career development should start at the pre-primary level and continue till adulthood.
