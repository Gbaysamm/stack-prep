# UTME 2016 Use of English — re-transcribed by hand from JAMB-USE-OF-ENGLISH-PAST-QUESTIONS.pdf, pages 126-145.
# 100 numbers kept. 85 are answerable; 15 are marked unrecoverable:
#   21-35 set on the prescribed novel, A. H. Mohammed's The First Days at Forcados High School — the
#         answers cannot be worked out from the paper (see reading_texts.md: these are retired).
# Repaired: the cloze passage (the extractor kept only gaps 16-18 and 20, cut it mid-sentence, and pasted
# every section direction into a duplicate "Passage III"; the duplicate is dropped and the novel items no
# longer point at it); gaps 11-15 and 19 added; questions 43 and 74 (dropped by the extractor) added; the
# "ENGLISH QUESTIONS" page header removed from Passage I; italicised target words restored with *asterisks*;
# 44's quotation put back together; 65 moved to the synonym run it is printed in; 56 set as a meaning item.
# Words restored in the cloze so it reads as prose (the paper drops them): "every" read as "very" (13);
# "The main advantage" read as "The main disadvantage" (it contrasts with "The primary advantage");
# "requires the" (after 17), "negate the" (before 18) and "prevent the" (after 20) supplied. In Passage II
# "and all the hands of man" is read as "at the hands of man".
# A person should check: gaps 14 and 15 and question 43 print only options A-C; gap 19 prints A, C, D
# (no B); 71 and 74 print the gap in the wrong place and it has been moved (see `corrected`); 83's option B
# prints "as a patient a teacher" and is read as "as patient a teacher"; the underlining on 89-91 does not
# show in the source, so the underlined letters there are assumed (ph, ch, ph); 89 (physics/phew) and 93
# (able/Mabel) each have two options that fit.
