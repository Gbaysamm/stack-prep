# UTME 2017 Use of English — re-transcribed by hand from JAMB-USE-OF-ENGLISH-PAST-QUESTIONS.pdf, pages 146-156.
# 60 numbers kept. 50 are answerable; 10 are marked unrecoverable:
#   16-25 set on the prescribed novel, S. I. Manyika's "Independence" (In Dependence) — the answers cannot
#         be worked out from the paper (see reading_texts.md: these are retired).
# Repaired: the extractor dropped 14 (cloze) and 36 (sixth sense); both are restored. Cloze passage rebuilt
# with ___(n)___ gaps and the inline option lists removed; page-header junk and the run of section
# directions pasted after the cloze removed; italicised target words (31-40) put back and marked *like this*;
# underlined letters (51-56) marked the same way; garbled options in 3, 4, 41, 58 repaired (see `corrected`).
# Passage I prints "There was a controversy in these societies" directly before "Consequently, primitive
# societies enjoyed great stability"; the sense (and the source text) needs "no controversy", so it is restored.
# The cloze prints "realistic planning efforts its go with" and "shot lid be embedded"; read as "efforts go
# with" and "should be embedded".
# Sections: 31-35 answer as opposites, but 36-40 only work as meaning (synonym) items — their keys and options
# are synonyms — so the synonym heading the paper lost is restored for 36-40. 57-58 (word stress) and 59-60
# (emphatic stress) are printed under the "same sound" heading; they are given their proper directions.
# A person should check: 14 (option B printed "procedure", read as "precedence"); 31 (no option is a clean
# opposite of "relegated"); 37 (two options are near-synonyms); 58 (irrevocable has two dictionary stresses).
