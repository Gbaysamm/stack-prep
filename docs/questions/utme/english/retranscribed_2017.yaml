passages:
  - id: passage_2017_passage_i
    label: Passage I
    instructions: 'Read the passage carefully and answer each question that follows.'
    text: >-
      Anthropologists tell us that for a society to remain stable, the roles of men and women must be
      properly differentiated and well defined. In primitive societies, the men were assigned the roles of
      going out to hunt, fish and fight off the hostile tribe next door while the women did the housekeeping
      and minded the children. The men were believed to be superior to the women in physical strength and
      capability. There was no controversy in these societies as to what the roles of the sexes should be.


      Consequently, primitive societies enjoyed great stability. However, with the advancement of
      civilization, many of the special privileges traditionally enjoyed by men began to be eroded one after
      another. There is hardly any sphere of human endeavour in which women have not gained a firm foothold:
      there are women doctors, engineers, pilots, prime ministers, judges, bankers and so on.


      Today, the women's spheres of operation are no longer restricted to the home; she is successfully
      competing with her counterpart in every area of human activity. But has this development been an
      unqualified blessing to the society?


      To answer this question, let us examine some of the problems created in the process of achieving
      women's emancipation. First, a large number of women including the married ones and mothers now take
      up paid employment. The conditions attached to such employment make it extremely difficult if not
      impossible for them to take adequate care of their children at home. Since no one can serve two
      masters, the health and education of the children suffer tremendously.


      Adapted from Ukwuegbe C., et al (2006) CATCH-Up English Language for SSCE/UME, Ibadan: Heinemann
      Educational Books (Nigeria) PLC.
  - id: cloze_2017
    label: Passage II (cloze)
    instructions: 'The passage below has gaps. Immediately following each gap, four options are provided. Choose the most appropriate option for each gap.'
    text: >-
      In truth, realistic planning efforts go with infrastructural ___(6)___. It makes the planning
      ___(7)___. When ___(8)___ provisions are made, infrastructural ___(9)___ should be embedded. Where
      these are glaringly ___(10)___, then national development and integration can be greatly ___(11)___.


      However, the case with most developing countries is to place other ___(12)___ interests far above
      the development of infrastructure. A nation inclined to this erroneous position may continue to
      experience ___(13)___. This implies that infrastructural development should be made to take
      ___(14)___ over other sectors. This is because of the immense importance of infrastructure to national
      ___(15)___.
