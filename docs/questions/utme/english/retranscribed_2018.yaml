passages:
  - id: passage_2018_passage_a
    label: Passage A
    instructions: 'Read the following passage and answer the questions that follow.'
    text: >-
      Returning home after a decade and half abroad, our Geography master remained incurably addicted to
      foreign ways and ideas for years after landing here. He would forever stick to his theory of Africans
      suffering from a curse inflicted on them by the Almighty God for some heinous sins committed centuries
      ago. He would, in support of this theory, ask listeners: "Why would our mosquito inflict deadly malaria
      on us whereas the British mosquito does not bite? Why aren't there poisonous snakes in Britain whereas
      here most snakes are deadly? Why should the deadly sickle cell disease be peculiar to the black race?"


      Of course, he hardly waits for answers to these and similar questions before jumping to the same
      inevitable conclusion. However, he met his match one day when a new student joined the class and heard
      the litany we were used to. The new boy calmly said, "Sir, I happen to know a few white men who suffer
      from the sickle cell disease; some are Italians and some are Spanish. The mosquito is equally deadly in
      India, South-east Asian countries and South America. The United States and some other South American
      countries have their deadly snakes. And, Sir, I know many white men, some of them British, who would
      prefer our brilliant sunshine to their horribly cold winter." And he sat down.


      I had never, before that day, seen our master so consumed with anger. He directed a burning look at
      the poor boy, who had no answer to this new battle. Without as much as saying a single word, the master
      stalked out of the classroom. Needless to say, our anger was turned on the new boy, who had decided to
      rock the boat without taking the time to sound the water. A delegation was sent to the master to
      apologise to him.


      He was appeased. But we all noticed something rather unusual thereafter: never again did he dwell on
      the issue of Africans being the cursed people.
  - id: cloze_2018
    label: Passage B (cloze)
    instructions: 'The passage below has gaps. Immediately following each gap, four options are provided. Choose the most appropriate option for each gap.'
    text: >-
      Mankind has been ravaged by many virus and ___(7)___ diseases such as measles, tuberculosis, diarrhoea
      and many others including ___(8)___, known also as the ___(9)___ cold.


      Outbreaks of many of these diseases have been brought under control in the last fifty years. Some
      ___(10)___ like measles and whooping cough still pose a great danger to younger children. The
      ___(11)___ of measles are more easily ___(12)___ than those of whooping cough. Unlike that of many
      others, the virus of measles more easily remains ___(13)___ for hundreds of years. However, once you
      have had an ___(14)___ of this dreadful disease, you develop an ___(15)___ which is almost complete and
      long lasting. Modern science has made available ___(16)___ to prevent many childhood diseases and this
      is the only guarantee of ___(17)___ from these scourges. More effective treatment of complications
      arising from these childhood diseases using penicillin and other ___(18)___ has also helped to reduce
      the ___(19)___ rate among children.


      It is universally accepted that good ___(20)___ is the right of every human being and children. You do
      not have to die from these diseases which wiped out whole ___(21)___ in the Middle Ages. We have today
      ___(22)___ drugs which give protection against most childhood diseases.
