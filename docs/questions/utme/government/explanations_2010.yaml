format_version: 1
exam_year: 2010
subject: GOV
explanations:
  2:
    answer: B
    steps:
      - 'The idea here is the nation-state.'
      - 'A nation-state is a state whose people see themselves as one nation, with a defined territory, a population, a government and sovereignty.'
      - 'Sovereignty is the supreme power to make and enforce laws within a territory, free from outside control. It is what turns a nation, which is only a people, into a state, so a nation-state is above all a sovereign state.'
      - 'Nigeria became a sovereign state on 1 October 1960. From then its laws were made by its own parliament, not by Britain.'
      - 'Remember: no sovereignty, no state.'
      - 'The trap is D, nationalism. Nationalism is the feeling that drives a people to seek a state of its own; it can lead to a nation-state, but it is not the state itself.'
    hint: 'What power must a nation have before it counts as a state?'
    why:
      A: 'Self-actualization is a personal goal of fulfilling one''s potential; it says nothing about statehood.'
      C: 'Liberation is the act of freeing a people from foreign rule; it can come before statehood, but it is an event, not the state.'
      D: 'Nationalism is the sentiment that seeks a state; the nation-state is defined by the sovereignty it then holds.'

  3:
    answer: A
    steps:
      - 'The idea here is political culture.'
      - 'Political culture is the set of beliefs, attitudes and values that the people of a society hold about government and politics.'
      - 'These shared social values, such as respect for authority, trust in leaders or love of freedom, shape how people vote, obey laws and take part in politics. So social values are a basic part of it.'
      - 'In Nigeria, respect for elders and traditional rulers is a social value that shows in politics, as when candidates visit emirs, obas and obis to seek their blessing before elections.'
      - 'Remember: political culture is what a whole society values about power.'
      - 'The trap is B, family values. They are part of a society''s values, but they belong to one family, not to the whole political community.'
    hint: 'Political culture belongs to a whole society. Which values does a whole society share?'
    why:
      B: 'Family values are narrower; they guide one household, while political culture is shared by the whole society.'
      C: 'Community structure is the way a community is organised, not the beliefs and values that make up a culture.'
      D: 'Economic values concern wealth and trade; they are one strand of social values, not the core of political culture.'

  4:
    answer: A
    steps:
      - 'The idea here is aristocracy.'
      - 'An oligarchy is rule by a few. Aristocracy is the form of it in which the few are the best or most gifted, from the Greek aristos, best, and kratos, rule.'
      - 'The ruling few are chosen for their talent, wisdom or noble birth, on the belief that the most able should govern.'
      - 'In old Oyo the Oyomesi were titled chiefs drawn from leading lineages, a council of nobles that checked the Alaafin, much like an aristocracy.'
      - 'Remember: aristo means best, so aristocracy is rule by the best.'
      - 'The trap is C, plutocracy. It is also rule by a few, but the few are the wealthy, not the gifted.'
    hint: 'Which word comes from the Greek for the best?'
    why:
      B: 'Theocracy is rule by priests or in the name of God, not by the gifted.'
      C: 'Plutocracy is rule by the rich; wealth, not talent, gives them power.'
      D: 'Gerontocracy is rule by the old; age, not gift, gives them power.'

  5:
    answer: C
    steps:
      - 'The idea here is a republic.'
      - 'A republic is a state whose head is an ordinary citizen elected for a fixed term, not a hereditary king or queen.'
      - 'Because the head is elected, power comes from the people and can be taken back at the next election.'
      - 'Nigeria became a republic on 1 October 1963, when an elected President replaced the Queen of England as head of state.'
      - 'Remember: a monarch is born to the throne, a republican head is voted in.'
      - 'The trap is A, a monarchy. A monarch inherits the throne for life and is not elected.'
    hint: 'Is the head of state born to the post or voted in?'
    why:
      A: 'A monarchy is headed by a king or queen who inherits the throne, not an elected citizen.'
      B: 'A plutocracy is rule by the rich; it does not depend on election.'
      D: 'An empire is a large state ruling over many conquered peoples under an emperor, who is not elected.'

  6:
    answer: A
    steps:
      - 'The idea here is modern representative democracy.'
      - 'In the old Greek city of Athens, citizens met and ruled directly. A modern state has millions of people, so they elect representatives who make laws and govern on their behalf.'
      - 'This is why modern democracy is called representative or indirect democracy: the people rule through those they elect, and can remove them at the next election.'
      - 'In Nigeria, voters elect 109 senators and 360 members of the House of Representatives to the National Assembly, and a President, to govern for them.'
      - 'Remember: modern democracy is government by the people''s chosen representatives.'
      - 'The trap is B, the majority of the people rule. That is direct democracy, which works only in a small community.'
    hint: 'Can millions of citizens sit and make laws themselves? Who does it for them?'
    why:
      B: 'The majority ruling directly is direct democracy, possible only in a small city-state like ancient Athens.'
      C: 'Voting alone is not enough; a sham election can be held under any system. What matters is that the elected representatives actually rule.'
      D: 'Rule by an elite is an oligarchy, the opposite of democracy.'

  7:
    answer: C
    steps:
      - 'The idea here is the vote of no confidence in a parliamentary system.'
      - 'In a parliamentary system the Prime Minister and cabinet sit in parliament and stay in office only while they keep the support of its majority.'
      - 'When parliament passes a vote of no confidence, the government has lost that support, so by collective responsibility the Prime Minister and cabinet must resign, or ask the head of state to dissolve parliament for a fresh election.'
      - 'Nigeria used this system in the First Republic (1960 to 1966), when Prime Minister Tafawa Balewa and his ministers answered to the House of Representatives.'
      - 'Remember: lose the House, lose the government.'
      - 'The trap is B. The legislature does stop trusting the executive, but that is the reason for the vote; what it means in practice is that the executive must go.'
    hint: 'What must a cabinet do when it no longer has the support of the House?'
    why:
      A: 'There is no suspension; a government that loses the confidence of parliament leaves office.'
      B: 'Loss of trust is the reason for the vote; the consequence the system attaches to it is resignation.'
      D: 'A vote of no confidence is political, not a court case; no legal proceedings follow.'

  8:
    answer: C
    steps:
      - 'The institution here is the United States Congress.'
      - 'The legislature of the United States is called Congress. It has two chambers, the Senate and the House of Representatives.'
      - 'It makes federal laws, approves the budget and checks the President, as the American constitution of 1787 separates it from the executive.'
      - 'Nigeria''s National Assembly, with its Senate and House of Representatives, was modelled on Congress when Nigeria took up the presidential system in 1979.'
      - 'Remember: Washington has Congress, Abuja has the National Assembly, London has Parliament.'
      - 'The trap is B, National Assembly. That is Nigeria''s name for its legislature, not America''s.'
    hint: 'What is the American legislature called in Washington?'
    why:
      A: 'Parliament is the name of the legislature in Britain and in many Commonwealth countries.'
      B: 'National Assembly is the name of Nigeria''s legislature, not the American one.'
      D: 'Council is not the name of the American legislature; councils make laws in local governments and cities.'

  9:
    answer: A
    steps:
      - 'The idea here is unicameralism.'
      - 'A unicameral legislature has one chamber; a bicameral legislature has two. Israel''s legislature, the Knesset, has a single chamber of 120 members.'
      - 'Small or unitary states often use one chamber because there are no federating units that need equal representation in a second house.'
      - 'Nigeria is bicameral. Its National Assembly has the Senate and the House of Representatives, because a federation needs a house where the states are equal.'
      - 'Remember: uni means one, bi means two.'
      - 'The trap is C, the United Kingdom. It has one Parliament, but that Parliament has two houses, the House of Commons and the House of Lords.'
    hint: 'Uni means one. Which of these legislatures has only one chamber?'
    why:
      B: 'The United States Congress has two chambers, the Senate and the House of Representatives.'
      C: 'The British Parliament has two chambers, the House of Commons and the House of Lords.'
      D: 'Nigeria''s National Assembly has two chambers, the Senate and the House of Representatives.'

  10:
    answer: A
    steps:
      - 'The institution here is the upper house, or Senate, of a federation.'
      - 'In most federal systems the lower house is filled by population, while the upper house gives every federating unit the same number of seats.'
      - 'This protects small units from being outvoted by big ones, so the federal principle of equal partners is kept in the law-making process.'
      - 'Nigeria''s Senate has three senators for each of the 36 states, whatever its size, and one for the Federal Capital Territory, 109 in all; the House of Representatives seats are shared by population.'
      - 'Remember: the lower house counts people, the upper house counts states.'
      - 'The trap is B. Checking the executive is a job of the whole legislature, both houses, not the reason a federation creates an upper house.'
    hint: 'In Nigeria''s Senate, does Lagos have more senators than Bayelsa?'
    why:
      B: 'Both houses check the executive; that is not what is special about the upper house.'
      C: 'The two houses are partners in making laws, not a supervisor and a junior.'
      D: 'Some upper houses do draw on elders, but in a federation the purpose is equal representation of the units.'

  11:
    answer: D
    steps:
      - 'The idea here is confederation.'
      - 'A confederation is a loose union of sovereign states in which the member states keep most power and the central government has only the powers they give it.'
      - 'The centre is weak because the units joined as independent states and can leave; it often cannot tax or act on citizens directly.'
      - 'Nigeria is federal, not confederal. The 1999 Constitution puts 68 subjects, such as defence and currency, on the Exclusive Legislative List for the centre alone, so the centre is stronger than the states.'
      - 'Remember: unitary, power at the centre; federal, power shared; confederal, power at the units.'
      - 'The trap is B, federal. Power is shared in a federation, and the centre usually holds the more important powers.'
    hint: 'In which system can the members walk away because they kept their sovereignty?'
    why:
      A: 'Monarchical describes who heads the state, a king or queen, not how power is shared between centre and units.'
      B: 'In a federation power is shared, and the central government usually holds the greater powers.'
      C: 'In a unitary system all power lies with the central government.'

  12:
    answer: A
    steps:
      - 'The idea here is fascism.'
      - 'Fascism is a totalitarian ideology, first practised in Italy under Benito Mussolini from 1922, which glorifies the nation and the all-powerful leader.'
      - 'Because the leader is held to embody the will of the nation, he stands above the constitution and the law, and opposition is not allowed.'
      - 'Nigeria''s 1999 Constitution says the opposite in section 1: the constitution is supreme and binds all authorities and persons, including the President.'
      - 'Remember: under fascism the leader is above the law; under constitutionalism the law is above the leader.'
      - 'The trap is C. Being subordinate to the laws of the state is the rule of law, which fascism rejects.'
    hint: 'In fascist Italy, could the constitution limit Mussolini?'
    why:
      B: 'A leader weak relative to the constitution describes constitutional government, the opposite of fascism.'
      C: 'Subordination to the law is the rule of law, which fascism rejects.'
      D: 'Fascism makes society serve the leader and the state, not the leader serve society''s norms.'

  13:
    answer: A
    steps:
      - 'The idea here is the cabinet, or parliamentary, system.'
      - 'In a cabinet system the head of state, often a monarch or ceremonial president, has little real power. Executive power is exercised by the head of government, the Prime Minister, with the cabinet.'
      - 'The Prime Minister is the leader of the majority in parliament, so he heads the cabinet that makes and carries out policy and answers to parliament.'
      - 'In Nigeria''s First Republic, Prime Minister Tafawa Balewa held executive power, while Nnamdi Azikiwe as Governor-General, and from 1963 as President, was the ceremonial head of state.'
      - 'Remember: in a cabinet system the head of state reigns, the head of government rules.'
      - 'The trap is B, the monarch. In Britain the Queen is head of state, but she acts on the advice of the Prime Minister and holds little real power.'
    hint: 'In Britain, who really runs the government, the Queen or the Prime Minister?'
    why:
      B: 'A monarch in a cabinet system is a ceremonial head of state who acts on the advice of ministers.'
      C: 'A president in a cabinet system, as in Nigeria in 1963, is ceremonial; an executive president belongs to the presidential system.'
      D: 'The dominant party supplies the government, but executive power is exercised by the head of government and cabinet.'

  14:
    answer: A
    steps:
      - 'The idea here is separation of powers.'
      - 'Separation of powers, taught by Montesquieu, means that the legislature, executive and judiciary are kept apart, with different people and different functions.'
      - 'In a presidential system the President and ministers are not members of the legislature, and each arm is elected or appointed separately, so the arms are clearly separate.'
      - 'Sections 4, 5 and 6 of Nigeria''s 1999 Constitution give legislative power to the National Assembly, executive power to the President and judicial power to the courts, and a minister must leave the National Assembly before taking office.'
      - 'Remember: presidential, separate; parliamentary, fused.'
      - 'The trap is B, parliamentary. There the ministers sit in parliament, so the executive and legislature are fused.'
    hint: 'In which system can a minister not also sit in the legislature?'
    why:
      B: 'In a parliamentary system the cabinet is drawn from parliament, so executive and legislature are fused.'
      C: 'An absolute monarch combines all three powers in one person.'
      D: 'In feudalism the lord made the rules, enforced them and judged his vassals himself.'

  15:
    answer: D
    steps:
      - 'The idea here is delegated legislation.'
      - 'Delegated legislation is law made by a body other than the legislature, using power that the legislature has passed down to it by an enabling law.'
      - 'The legislature has no time for every local detail, so it lets local councils, ministers and agencies make rules within limits it sets. A bye-law is the classic example.'
      - 'In Nigeria, a local government council makes bye-laws on markets, motor parks and sanitation, under powers given by the state House of Assembly.'
      - 'Remember: a bye-law is a by-the-way law made by a body below the legislature.'
      - 'The trap is A, an act. An act is made by the legislature itself, so it is primary, not delegated, legislation.'
    hint: 'Which of these laws is made by a body that is not the legislature itself?'
    why:
      A: 'An act is passed by the legislature itself, such as the National Assembly; it is primary legislation.'
      B: 'A bill is only a proposed law before the legislature; it is not law yet.'
      C: 'A decree is made by a military government that has taken over law-making itself, not by a body using delegated power.'

  16:
    answer: C
    steps:
      - 'The idea here is the loss of citizens'' rights by due process of law.'
      - 'A citizen''s rights, such as liberty and the right to vote, are protected, but the state may withdraw them when a court convicts the person of a serious crime.'
      - 'This is so because the rights are protected by law, so only the law, through a fair trial and a court''s sentence, can take them away.'
      - 'Section 35 of Nigeria''s 1999 Constitution allows a person''s liberty to be taken in execution of a court''s sentence after conviction.'
      - 'Remember: rights are lost in a court, not on the street.'
      - 'The trap is A. Violent opposition is a crime, but rights are withdrawn only after the person is tried and convicted, which is what C says.'
    hint: 'What must happen in court before the state can take a citizen''s rights?'
    why:
      A: 'Opposing the government violently is a crime, but rights are lost only after trial and conviction, not for the act alone.'
      B: 'Leaving the country does not take away a citizen''s rights; a Nigerian abroad is still a Nigerian.'
      D: 'A dead person no longer holds rights at all, so nothing is withdrawn by the state.'

  17:
    answer: A
    steps:
      - 'The idea here is the primary election.'
      - 'A primary election is an election held inside a political party, in which party members choose who will be the party''s candidate for an office.'
      - 'It comes before the general election, so that each party enters the main contest with one candidate for each post.'
      - 'In Nigeria, parties hold primaries before every general election, and I N E C, the Independent National Electoral Commission, monitors them.'
      - 'Remember: primary comes first, inside the party.'
      - 'The trap is D, general election. That is the main contest between the parties'' candidates, open to all voters, not just party members.'
    hint: 'Which election happens inside the party before the main contest?'
    why:
      B: 'An electoral college is a body of electors who choose a leader on behalf of voters, as in the American presidential election.'
      C: 'A bye-election fills a seat that becomes vacant between general elections.'
      D: 'A general election is open to all registered voters and chooses between the parties'' candidates.'

  18:
    answer: B
    steps:
      - 'The idea here is the one-party system.'
      - 'A one-party system is one in which only one political party is allowed to exist or to hold power, as in Tanzania under Julius Nyerere.'
      - 'Its supporters argue that in a new state of many ethnic groups, rival parties deepen ethnic division, while a single party brings everyone together and builds national unity.'
      - 'Nigeria''s First Republic parties, the NPC, NCNC and AG, each drew support mainly from one region, the kind of division the one-party argument aims to cure.'
      - 'Remember: one party, one nation, in theory.'
      - 'The trap is A. A single party does not end internal conflict; the struggles simply move inside the one party.'
    hint: 'Why might a new country of many ethnic groups want only one party?'
    why:
      A: 'Conflict does not disappear; rival groups compete inside the one party instead.'
      C: 'Mass participation is limited, because voters cannot choose between parties.'
      D: 'A one-party system cannot guarantee social justice; with no opposition, it can easily become oppressive.'

  19:
    answer: D
    steps:
      - 'The idea here is how pressure groups work.'
      - 'A pressure group is an organised group that tries to influence government policy without seeking to form the government. Its main tactic is lobbying.'
      - 'Lobbying means meeting legislators and officials in person to persuade them to make or change a policy. It works because it reaches the people who decide.'
      - 'In Nigeria, the Nigeria Labour Congress and the Nigerian Bar Association lobby members of the National Assembly over bills such as the minimum wage.'
      - 'Remember: pressure groups lobby; political parties campaign.'
      - 'The trap is B, electioneering campaign. Campaigning for votes is what political parties do, because they seek to win power.'
    hint: 'Which method works on law-makers directly, in their offices and lobbies?'
    why:
      A: 'A memorandum is a written document that a group may submit; it is a tool, while lobbying is the tactic.'
      B: 'Electioneering campaigns are run by political parties seeking power, not by pressure groups.'
      C: 'Propaganda is one-sided persuasion of the public, used mostly by governments and parties; lobbying is the recognised pressure-group tactic.'

  20:
    answer: B
    steps:
      - 'The idea here is the measurement of public opinion.'
      - 'Public opinion is the views held by a large part of the people on a public issue. It can be measured by referendums, opinion polls, elections and the mass media.'
      - 'In a referendum every voter answers yes or no on a single issue, so the result shows exactly what the people think about it.'
      - 'In February 1961 the United Nations held a plebiscite, a referendum on a territory, in which the Northern Cameroons voted to join Nigeria and the Southern Cameroons voted to join Cameroon.'
      - 'Remember: a referendum counts the people''s yes and no.'
      - 'The trap is C, strike action. A strike expresses the views of workers, but it does not measure the opinion of the whole public.'
    hint: 'Which of these lets every voter answer yes or no on one issue?'
    why:
      A: 'Negotiation is bargaining between parties; it settles disputes but measures nothing.'
      C: 'A strike expresses one group''s grievance; it does not measure what the whole public thinks.'
      D: 'A rumour is unverified talk; it cannot be counted or trusted.'

  21:
    answer: A
    steps:
      - 'The institution here is the civil service.'
      - 'The civil service is the body of permanent, paid officials who work in the government ministries and departments.'
      - 'Its main function is to carry out, or implement, the policies made by the government of the day, and to advise ministers as they make them. It is meant to be neutral, serving every government equally.'
      - 'In Nigeria, the federal civil service is headed by the Head of the Civil Service of the Federation, and its officers are appointed by the Federal Civil Service Commission.'
      - 'Remember: politicians make policy, civil servants carry it out.'
      - 'The trap is C. Supporting the party in power breaks the rule of neutrality; civil servants serve whichever government is in office.'
    hint: 'Ministers decide policy. Who then puts it into action?'
    why:
      B: 'Sharing revenue among the federating units is done by law through the Federation Account, not as the civil service''s main function.'
      C: 'The civil service must be politically neutral, so supporting a party is forbidden, not a function.'
      D: 'Mobilizing grassroots support is the work of parties and politicians, not of neutral civil servants.'

  22:
    answer: D
    steps:
      - 'The institution here is the Alaafin of Oyo.'
      - 'The Alaafin was the king and political head of the Old Oyo Empire. He was regarded as sacred, and his palace was the centre of government.'
      - 'He ruled with the Oyomesi, a council of seven kingmakers led by the Bashorun, who could check his power and even ask him to commit suicide; the Ogboni society in turn checked the Oyomesi.'
      - 'The title survives today; the Alaafin of Oyo is a leading traditional ruler in Oyo State.'
      - 'Remember: the Alaafin rules, the Oyomesi check, the Ogboni balance.'
      - 'The trap is A, Bashorun. The Bashorun was powerful as head of the Oyomesi, but he was a chief, not the head of the empire.'
    hint: 'Whose title means owner of the palace?'
    why:
      A: 'The Bashorun headed the Oyomesi and checked the king; he was not the head of the empire.'
      B: 'The Oyomesi were the council of kingmakers; they checked the head but were not the head.'
      C: 'The Aremo was the crown prince, the Alaafin''s eldest son, not the ruler.'

  23:
    answer: B
    steps:
      - 'The institution here is the Umunna.'
      - 'The pre-colonial Igbo system was acephalous, or segmentary: there was no king, and each village governed itself. Its basic unit was the Umunna, the patrilineage of families descended from one male ancestor.'
      - 'The eldest man of the Umunna held the ofo, the staff of authority, and the heads of the Umunna met as the council of elders. Every adult could speak at the village assembly, so power flowed up from the lineages.'
      - 'This village democracy is why many Igbo communities still settle land and family disputes in Umunna meetings today, in states such as Anambra and Imo.'
      - 'Remember: no king, so the lineage rules.'
      - 'The trap is A, age grades. Age grades carried out the decisions of the elders, such as clearing roads and keeping order, but the system was built on the Umunna.'
    hint: 'With no king, which kinship group sent its elder to the village council?'
    why:
      A: 'Age grades were the executive arm that carried out the elders'' decisions; they did not form the base of the system.'
      C: 'Family ties are too loose a term; the political unit was the Umunna, the lineage with its elder and its ofo.'
      D: 'The Umuada, the daughters of the lineage, helped settle disputes, but they were one institution among several, not the base.'

  24:
    answer: A
    steps:
      - 'The institution here is the Aro system.'
      - 'The Aro system was centred on the Ibini Ukpabi oracle, called the Long Juju, at Arochukwu, which people from across Igboland and beyond consulted.'
      - 'The oracle acted as the final court of appeal: disputes that villages could not settle were taken to it, and its word was obeyed because it was believed to speak for the gods. So the system was a religious organization at heart.'
      - 'The British destroyed the oracle in the Aro Expedition of 1901 to 1902, because its religious authority was a rival to colonial rule in south-eastern Nigeria.'
      - 'Remember: the Aro power came from a shrine.'
      - 'The trap is C, a commercial organization. Aro agents did trade widely, but their influence rested on the religious authority of the oracle.'
    hint: 'Where did people go at Arochukwu, and why did they obey it?'
    why:
      B: 'The Aro had no state or ruler over Igboland; their influence was religious, through the oracle.'
      C: 'Aro trade spread along with the oracle''s fame, but the system''s authority was religious.'
      D: 'The Aro did not conquer or rule an empire; they had no army or administration over other peoples.'

  25:
    answer: C
    steps:
      - 'The policy here is French assimilation.'
      - 'Assimilation was the French colonial policy of turning Africans into Frenchmen in language, culture, religion, law and dress.'
      - 'France believed its civilisation was superior, so it aimed to change the Africans'' way of life, and an assimilated African could become a French citizen, as in the Four Communes of Senegal.'
      - 'Nigeria was a British colony, ruled by indirect rule through the emirs and chiefs, which left local customs largely in place, the opposite of assimilation.'
      - 'Remember: assimilate means to make similar.'
      - 'The trap is B. French schools were part of the policy, but education was a tool for changing the African way of life, not the main aim.'
    hint: 'Assimilate means to make similar. Similar to whom?'
    why:
      A: 'France did not aim to train Africans to lead; leadership stayed with French officials.'
      B: 'Education was one tool of assimilation, used to change the African way of life; it was not the aim itself.'
      D: 'Ending some customs followed from the policy, but its purpose was a wholesale change of culture.'

  26:
    answer: A
    steps:
      - 'The company here is the Royal Niger Company.'
      - 'Led by George Goldie, it received a royal charter in 1886, which gave it power to trade and govern along the Niger and Benue.'
      - 'It signed treaties with local rulers, kept out French and German rivals and ran its own administration, so it laid the base of British control of the Niger area.'
      - 'Its charter was revoked, and on 1 January 1900 its territories became the Protectorates of Northern and Southern Nigeria under the British Crown.'
      - 'Remember: the Royal Niger Company held the Niger before Britain did.'
      - 'The trap is B. Goldie''s earlier United African Company of 1879 was merged into the National African Company and then became the Royal Niger Company, the name under which it led trade on the coast.'
    hint: 'Which company was given a royal charter to govern along the Niger?'
    why:
      B: 'The United African Company was Goldie''s 1879 merger, an early stage of what became the Royal Niger Company.'
      C: 'Lever Brothers was a soap maker that bought palm oil; it did not lead the British acquisition of the Niger.'
      D: 'John Holt and Sons was a Liverpool trading firm, smaller and without a charter to govern.'

  27:
    answer: C
    steps:
      - 'The ruler here is Oba Ovonramwen Nogbaisi of Benin.'
      - 'Ovonramwen resisted British control of Benin trade. After the killing of a British party in January 1897, the British sent the Benin Expedition and took Benin City in February 1897.'
      - 'Ovonramwen was tried and deported to Calabar, so that he could not rally his people; he died there in 1914.'
      - 'Calabar, in today''s Cross River State, was then the headquarters of the British Niger Coast Protectorate.'
      - 'Remember: Ovonramwen to Calabar; Jaja to the West Indies.'
      - 'The trap is D, King Jaja. Jaja of Opobo also resisted, but in 1887 he was deported to Accra and then to the West Indies, not to Calabar.'
    hint: 'Which ruler lost his throne in the Benin Expedition of 1897?'
    why:
      A: 'Kosoko of Lagos was driven out by the British in 1851 and went to Epe; he was not deported to Calabar.'
      B: 'Dosunmu signed the 1861 treaty that ceded Lagos to Britain; he was not deported.'
      D: 'Jaja of Opobo was deported in 1887 to Accra and then to the West Indies.'

  28:
    answer: C
    steps:
      - 'The scholar here is James S. Coleman.'
      - 'James S. Coleman was an American political scientist who wrote Nigeria: Background to Nationalism, published in 1958.'
      - 'He traced Nigerian nationalism in two phases: an early phase of protest and resistance to British rule, and a later phase of organised nationalist movements and parties seeking self-government.'
      - 'The later phase is the one of Herbert Macaulay''s NNDP of 1923, the Nigerian Youth Movement and Nnamdi Azikiwe''s NCNC, which led to independence in 1960.'
      - 'Remember: Coleman wrote the background to Nigerian nationalism.'
      - 'The trap is B, Edward Wilmot Blyden. Blyden was a nineteenth-century pan-Africanist writer who inspired nationalists, not the scholar who divided Nigerian nationalism into phases.'
    hint: 'Which of these men wrote a book on the background to Nigerian nationalism?'
    why:
      A: 'John Payne Jackson was a Lagos journalist, editor of the Lagos Weekly Record, who spread nationalist ideas.'
      B: 'Edward Wilmot Blyden was a pan-Africanist thinker of the nineteenth century, not the historian of Nigerian nationalism.'
      D: 'David Ricardo was an English economist of the early nineteenth century.'

  29:
    answer: A
    steps:
      - 'The constitution here is the Independence Constitution of 1960.'
      - 'It came into force on 1 October 1960. Under it the British Queen remained Nigeria''s head of state, represented by a Governor-General, and the Judicial Committee of the Privy Council in London was the final court of appeal.'
      - 'Because the head of state and the highest court were still British, Nigeria did not yet have full sovereignty, even though it governed itself.'
      - 'The 1963 Republican Constitution ended this on 1 October 1963: Nnamdi Azikiwe became President and the Supreme Court of Nigeria became the final court of appeal.'
      - 'Remember: 1960, independence; 1963, full sovereignty.'
      - 'The trap is D. Britain did not continue to rule; Nigerians governed themselves, only the symbols of sovereignty stayed British.'
    hint: 'Who was head of state, and where was the final court, under the 1960 constitution?'
    why:
      B: 'Granting independence was the strength of the constitution, not its weakness, and it fell short of total sovereignty.'
      C: 'The Supreme Court was not supreme; appeals still went to the Privy Council in London.'
      D: 'Nigerians ran their own government after 1960; Britain kept only the Queen as head of state and the Privy Council.'

  30:
    answer: A
    steps:
      - 'The institution here is the Nigerian Council.'
      - 'After the amalgamation of the Northern and Southern Protectorates in 1914, Lord Lugard set up the Nigerian Council in the same year, made up of officials and some appointed unofficial members.'
      - 'It was the first central council for the whole country, but it could only discuss and advise; real law-making power stayed with the Governor-General.'
      - 'It was replaced by the Legislative Council under the Clifford Constitution of 1922, which brought the first elected Nigerian members.'
      - 'Remember: 1914, Nigerian Council; 1922, Legislative Council.'
      - 'The trap is C, the Legislative Council. One existed for the Colony of Lagos before 1914, but the new council for amalgamated Nigeria was the Nigerian Council; the Legislative Council came in 1922.'
    hint: 'What council did Lugard create in the year of amalgamation?'
    why:
      B: 'The National Assembly is the legislature of the 1979 and 1999 constitutions, long after amalgamation.'
      C: 'The Legislative Council for Nigeria came with the Clifford Constitution in 1922, after the Nigerian Council.'
      D: 'Regional Assemblies came with the Richards Constitution of 1946.'

  31:
    answer: D
    steps:
      - 'The reform here is the 1988 civil service reform based on the Dotun Phillips report.'
      - 'In 1985 a study group headed by Professor Dotun Phillips reviewed the federal civil service. Its proposals led to the Civil Service Reforms of 1988.'
      - 'The reforms made each minister the chief executive and accounting officer of his ministry, and renamed the Permanent Secretary the Director-General, so that the political head controlled policy and spending directly.'
      - 'Before this, the Udoji Commission of 1972 to 1974 had reviewed the public service and its salaries, and the Adebo Commission of 1970 to 1971 had dealt with wages.'
      - 'Remember: Phillips put the minister in charge of the purse.'
      - 'The trap is A, Jerome Udoji. Udoji''s review was the famous one of the 1970s, but it is known for salary awards and grading, not for making ministers accounting officers.'
    hint: 'Which review led to the 1988 civil service reforms?'
    why:
      A: 'The Udoji Commission of 1972 to 1974 is known for new salary scales and grading, not for this change.'
      B: 'S. J. Cookey chaired the Political Bureau of 1986 on Nigeria''s future political system, not the civil service.'
      C: 'Simeon Adebo chaired the wages and salaries commission of 1970 to 1971.'

  32:
    answer: D
    steps:
      - 'The institution here is the Ombudsman.'
      - 'An Ombudsman is an official who receives complaints from citizens against injustice by public officials and investigates them. The office began in Sweden in 1809.'
      - 'The Ombudsman can investigate and recommend, but it cannot force anyone to obey, because it has no executive power to enforce its decisions. That is its major weakness.'
      - 'Nigeria''s Ombudsman is the Public Complaints Commission, set up in 1975. It can only recommend action to the authority concerned.'
      - 'Remember: the Ombudsman can bark, but it cannot bite.'
      - 'The trap is A. Lack of resources is a real problem, but it can be fixed with money; the built-in weakness is that it cannot enforce its decisions.'
    hint: 'After the Ombudsman finds a complaint is true, can it force the officer to act?'
    why:
      A: 'Shortage of resources affects many bodies and can be remedied; it is not the defining weakness of the office.'
      B: 'The mandate is clear: to investigate complaints against public officials.'
      C: 'It can expose and discourage bureaucratic excesses; its trouble is that it cannot enforce its findings.'

  33:
    answer: B
    steps:
      - 'The idea here is the multiparty system of the Fourth Republic.'
      - 'A multiparty system has more than two parties with a real chance to compete for power. Nigeria''s Fourth Republic began on 29 May 1999 with this system.'
      - 'With many parties, more groups and opinions find a party to join or vote for, so more citizens take part in politics.'
      - 'From three registered parties in 1999, I N E C, the Independent National Electoral Commission, registered dozens more in the 2000s, giving voters a wide choice.'
      - 'Remember: more parties, more people taking part.'
      - 'The trap is A. A bicameral legislature is a strength of the constitution, not of the multiparty system; a one-party state could also have two houses.'
    hint: 'What happens to participation when people have many parties to choose from?'
    why:
      A: 'The bicameral National Assembly is part of the constitution, not something the party system provides.'
      C: 'Government interference in party affairs would be a weakness, not a strength.'
      D: 'An anti-democracy campaign would harm democracy, so it cannot be a strong point.'

  34:
    answer: A
    steps:
      - 'The idea here is the fusion of ceremonial and executive powers.'
      - 'In a presidential system one person, the President, is both head of state, with ceremonial duties, and head of government, with executive power.'
      - 'This is because the President is elected to lead the whole executive, so there is no separate ceremonial figure like a monarch or Governor-General.'
      - 'Section 130 of Nigeria''s 1999 Constitution makes the President the head of state, the chief executive of the federation and the commander-in-chief of the armed forces.'
      - 'Remember: one president, two hats.'
      - 'The trap is B, parliamentary. There the two roles are split, with a ceremonial head of state and a Prime Minister who holds executive power.'
    hint: 'In which system does one person receive ambassadors and also run the government?'
    why:
      B: 'The parliamentary system splits the roles between a ceremonial head of state and a Prime Minister.'
      C: 'Federal describes how power is shared between the centre and the units, not who holds the ceremonial and executive roles.'
      D: 'Unitary describes where power lies territorially, not whether the two roles are joined.'

  35:
    answer: D
    steps:
      - 'The issue here is revenue allocation.'
      - 'Revenue allocation is the sharing of the nation''s revenue between the federal, state and local governments, and among the states.'
      - 'It is contentious because the states differ greatly in population and in the oil wealth found in them, so every formula, by population, need, equality or derivation, leaves some side unhappy.'
      - 'Nigeria has had many revenue commissions since Phillipson in 1946, and the 1999 Constitution gives the oil-producing states not less than 13 percent by derivation.'
      - 'Remember: who gets what share of the oil money is the oldest quarrel of Nigerian federalism.'
      - 'The trap is A, poverty. Poverty is a serious national problem, but it is not a quarrel between the tiers of government.'
    hint: 'Which issue sets the federal government and the states against each other over money?'
    why:
      A: 'Poverty is a national problem, but not a dispute about how the federation is arranged.'
      B: 'Education is a shared responsibility of all tiers, not the main federal quarrel.'
      C: 'Health care is also shared between the tiers; it is not the main contentious federal issue.'

  36:
    answer: B
    steps:
      - 'The institution here is the public enterprise, or public corporation.'
      - 'A public enterprise is a body set up by law, owned and controlled by government, to run a service or business for the public.'
      - 'Government sets them up mainly to provide essential services that private firms might not provide, or might provide at too high a price, such as power, water and rail transport.'
      - 'In Nigeria, the Nigerian Railway Corporation and the former National Electric Power Authority, NEPA, were set up to provide such services.'
      - 'Remember: public enterprises put service before profit.'
      - 'The trap is A. Some enterprises do earn revenue, but profit is not their main purpose; service is.'
    hint: 'Why would government run trains and power, which private firms might not?'
    why:
      A: 'Revenue may come, but public enterprises exist mainly to serve the public, not to make money.'
      C: 'Enriching a few people is an abuse, not a purpose.'
      D: 'Government sets them up where the private sector cannot or will not serve, not to compete with it.'

  37:
    answer: D
    steps:
      - 'The institution here is the parastatal.'
      - 'A parastatal is a government agency, set up by law and partly independent of the ministries, to carry out a public function.'
      - 'Parastatals are created to render social services that the public needs, such as health, education, regulation and welfare, more flexibly than a ministry could.'
      - 'In Nigeria, NAFDAC, the National Agency for Food and Drug Administration and Control, protects the public from fake drugs, and the NYSC organises national service for graduates.'
      - 'Remember: a parastatal serves the public, not the purse.'
      - 'The trap is B. Maximizing profit is the aim of private business, not of a government parastatal.'
    hint: 'Do parastatals exist mainly to make money or to serve?'
    why:
      A: 'Training entrepreneurs is not the purpose of parastatals; a few may do it, but most render services.'
      B: 'Maximizing profit is the aim of private firms; parastatals put service first.'
      C: 'Expanding business is the work of the private sector, not of service agencies.'

  38:
    answer: A
    steps:
      - 'The institution here is the General Purposes Committee of a local government.'
      - 'Under the 1976 Local Government Reform, the council chairman and the supervisory councillors, with the secretary, formed the General Purposes Committee.'
      - 'It ran the day-to-day executive work of the council, made policy proposals and supervised the departments, so it acted as the cabinet of the local government.'
      - 'Today a local government chairman in Nigeria still governs with supervisory councillors, the local version of ministers in a cabinet.'
      - 'Remember: the President has the Federal Executive Council; the local government had the General Purposes Committee.'
      - 'The trap is C. Supervising self-help projects was one task of the council, but the committee''s role was the whole executive, as a cabinet.'
    hint: 'Who sat on the committee, and what does a group of a leader and his supervisors form?'
    why:
      B: 'A public relations unit is a department of the council, not its executive committee.'
      C: 'Self-help projects were one area of work, not the committee''s defining role as the council''s cabinet.'
      D: 'Awarding contracts was handled through the tenders process; it is one function, not the committee''s role as cabinet.'

  39:
    answer: C
    steps:
      - 'The institution here is the Armed Forces Ruling Council, the A F R C.'
      - 'General Ibrahim Babangida took power on 27 August 1985 and ruled until August 1993. His highest ruling body was the Armed Forces Ruling Council.'
      - 'Under military rule the constitution was suspended and the ruling council made decrees, so it was the highest organ of the state, above the Council of Ministers.'
      - 'Each regime named its council: the Supreme Military Council under Gowon, Murtala Muhammed, Obasanjo and Buhari, and the Provisional Ruling Council under Abacha and Abdulsalami Abubakar.'
      - 'Remember: Babangida, Armed Forces; Abacha, Provisional.'
      - 'The trap is A, the Provisional Ruling Council. That was Abacha''s ruling body from 1993, not Babangida''s.'
    hint: 'Which council did the 1985 regime set up in place of the Supreme Military Council?'
    why:
      A: 'The Provisional Ruling Council was the ruling body under Abacha and Abubakar, from 1993 to 1999.'
      B: 'The Supreme Military Council was the ruling body before 1985, from Gowon to Buhari.'
      D: 'The Federal Executive Council is the cabinet of ministers, below the ruling council under military rule.'

  40:
    answer: B
    steps:
      - 'The law here is the Unification Decree, Decree No. 34 of 1966.'
      - 'It was made by the regime of Major-General Aguiyi-Ironsi on 24 May 1966.'
      - 'It abolished the regions, renamed the country the Republic of Nigeria and unified the regional civil services, so Nigeria became a unitary state. Many saw this as abolishing the federal system, and protests followed.'
      - 'After the July 1966 coup, Yakubu Gowon''s government restored the federal system, and in 1967 it created twelve states.'
      - 'Remember: Decree 34 unified Nigeria, and that is what made it unpopular.'
      - 'The trap is C. Every military decree was made without consultation, so that cannot explain why this one in particular was resisted.'
    hint: 'What did Decree No. 34 do to the regions?'
    why:
      A: 'The decree changed the structure of government, not the economy; it was not about impoverishment.'
      C: 'All military decrees were made without consultation; what made this one unacceptable was the end of federalism.'
      D: 'Unitary government was not alien; Nigeria itself had been governed as a unitary colony before 1954.'

  41:
    answer: A
    steps:
      - 'The event here is France''s atomic tests in the Sahara.'
      - 'From February 1960, France tested atomic bombs at Reggane, in the Sahara Desert of Algeria, which was then French territory.'
      - 'Nigeria feared radioactive fallout drifting over West Africa and saw the tests as a disregard for African lives, so it broke diplomatic relations with France in January 1961.'
      - 'The decision was taken by the government of Prime Minister Tafawa Balewa, which ordered the French ambassador to leave Lagos.'
      - 'Remember: bombs in the Sahara, break with Paris.'
      - 'The trap is C. Nigeria''s relations with its Francophone neighbours were not the cause; the protest was against the nuclear tests.'
    hint: 'What did France do in the Sahara in 1960?'
    why:
      B: 'There was no quarrel over de Gaulle''s personal attitude; the break was a protest at the tests.'
      C: 'Relations with the Francophone states did not cause the break; the atomic tests did.'
      D: 'Nigeria itself had relations with Israel at the time, so that could not be the reason.'

  42:
    answer: A
    steps:
      - 'The idea here is non-alignment.'
      - 'Non-alignment is the policy of not joining either side of the Cold War, the West led by the United States or the East led by the Soviet Union. The Non-Aligned Movement was founded at Belgrade in 1961.'
      - 'Most of its members are developing countries, newly independent from colonial rule, with economies that depend on primary products. This shared economic state is what they have in common.'
      - 'Nigeria, a member of the Non-Aligned Movement, is a developing economy that depends heavily on the export of crude oil.'
      - 'Remember: the non-aligned are mostly the developing.'
      - 'The trap is C. Nigeria''s large population is unusual; most non-aligned countries are small.'
    hint: 'What do most of the newly independent non-aligned countries have in common?'
    why:
      B: 'Many states have mixed populations, but heterogeneity is not what non-aligned countries share as a group.'
      C: 'Most non-aligned countries have small populations; Nigeria''s large one sets it apart.'
      D: 'Most non-aligned countries are small in area; Nigeria''s size is unusual among them.'

  43:
    answer: B
    steps:
      - 'The event here is the formation of ECOWAS, the Economic Community of West African States.'
      - 'ECOWAS was formed by the Treaty of Lagos, signed by fifteen West African states on 28 May 1975.'
      - 'Nigeria''s head of state then, General Yakubu Gowon, worked with President Gnassingbe Eyadema of Togo to bring the states together, so Nigeria spearheaded its formation.'
      - 'Gowon was removed in a coup on 29 July 1975, only two months later, and Murtala Muhammed took over.'
      - 'Remember: May 1975, Lagos, Gowon.'
      - 'The trap is C, Murtala Muhammed. He came to power in July 1975, after the treaty had been signed.'
    hint: 'Who was Nigeria''s head of state in May 1975?'
    why:
      A: 'Obasanjo became head of state in February 1976, after ECOWAS was formed.'
      C: 'Murtala Muhammed took power in July 1975, two months after the Treaty of Lagos.'
      D: 'Babangida came to power in 1985, ten years after ECOWAS was formed.'

  44:
    answer: B
    steps:
      - 'The idea here is Nigeria as a frontline state.'
      - 'The frontline states were the countries that bordered white-minority-ruled Southern Africa and supported the liberation struggles there.'
      - 'Nigeria was far away, but it gave so much money, diplomatic support and help to the liberation movements in Angola, Mozambique, Zimbabwe, Namibia and South Africa that it was counted as a frontline state.'
      - 'In 1979 Nigeria nationalised the assets of British Petroleum in Nigeria to press Britain over Zimbabwe''s independence.'
      - 'Remember: front line for freedom, though far from the border.'
      - 'The trap is A. Nigeria''s peacekeeping in the Congo in the 1960s was for the UN; it had nothing to do with the frontline states.'
    hint: 'Which struggle gave the frontline states their name?'
    why:
      A: 'Peacekeeping in the Congo in the 1960s was a UN mission, not the struggle in Southern Africa.'
      C: 'Nigeria helped form the OAU in 1963, but that did not make it a frontline state.'
      D: 'Nigeria''s peace efforts in Liberia came in 1990, long after it was called a frontline state.'

  45:
    answer: A
    steps:
      - 'The body here is the UN Security Council, which keeps international peace and security.'
      - 'It has fifteen members: five permanent members named in the UN Charter (the United States, Britain, France, the Soviet Union, whose seat Russia now holds, and China), and ten non-permanent members elected by the General Assembly for two years at a time.'
      - 'Nigeria''s active work at the UN in the 1970s, above all against apartheid and colonial rule in Southern Africa, won it the votes of the General Assembly, so it was elected to a non-permanent seat for 1978 and 1979.'
      - 'It was Nigeria''s second term on the Council; the first was 1966-67, and it has been elected again since, for example for 2010-11 and 2014-15.'
      - 'Remember: Nigeria is elected to the Council; the five are there for good.'
      - 'The trap is B, a permanent seat. No country has gained a permanent seat since 1945, because changing the five needs an amendment of the Charter.'
    hint: 'Which Security Council seats can a country win by election?'
    why:
      B: 'The five permanent seats are fixed by the UN Charter of 1945, and Nigeria is not one of the five.'
      C: 'Only the five permanent members hold the veto; an elected member votes but cannot block a decision alone.'
      D: 'No Nigerian has been Secretary-General; the two Africans to hold the post were from Egypt and Ghana.'

  46:
    answer: A
    steps:
      - 'The office here is the high commissioner.'
      - 'A high commissioner is the head of a diplomatic mission that one Commonwealth country sends to another Commonwealth country.'
      - 'Commonwealth members see one another as a family rather than as foreign states, so the head of mission is a high commissioner, and the mission is a high commission, not an embassy.'
      - 'Nigeria joined the Commonwealth at independence in 1960, so it has a High Commission in London and in Accra, but an Embassy in Washington and in Paris.'
      - 'Remember: Commonwealth, high commissioner; other countries, ambassador.'
      - 'The trap is C, ambassador. An ambassador heads a mission in a country outside the Commonwealth.'
    hint: 'What is Nigeria''s mission in London called, an embassy or a high commission?'
    why:
      B: 'A chargé d''affaires stands in for the head of mission when he is absent, or heads a lower-level mission.'
      C: 'An ambassador heads a mission in a non-Commonwealth country, such as the United States or France.'
      D: 'An attaché is a junior or specialist officer of a mission, such as a military or press attaché.'

  47:
    answer: B
    steps:
      - 'The institution here is the Authority of Heads of State and Government of ECOWAS.'
      - 'The Authority is the supreme organ of ECOWAS. It gives the community its general direction and makes its most important decisions.'
      - 'One of these is appointing the chief officer of the Secretariat, the Executive Secretary, because the Authority controls the whole community.'
      - 'Nigeria has hosted the ECOWAS headquarters, now in Abuja, and Nigerian leaders have chaired the Authority many times.'
      - 'Since 2007 the Secretariat has been the ECOWAS Commission, and the Executive Secretary has become the President of the ECOWAS Commission, still appointed by the Authority.'
      - 'Remember: the heads of state pick the head of the Secretariat.'
      - 'The trap is C. The staff of the Secretariat are appointed under the Executive Secretary, not by the heads of state themselves.'
    hint: 'Who appoints the head of the Secretariat, the heads of state or the Secretariat itself?'
    why:
      A: 'Organizing conferences is administrative work of the Secretariat, not a function of the Authority.'
      C: 'Secretariat staff are appointed under the Executive Secretary, not by the Authority.'
      D: 'The budget is prepared by the Secretariat and considered by the Council of Ministers.'

  48:
    answer: B
    steps:
      - 'The institution here is the United Nations Security Council.'
      - 'The Security Council has 15 members: 5 permanent members, the United States, Britain, France, Russia and China, and 10 non-permanent members.'
      - 'The non-permanent members are elected by the General Assembly for a term of two years, and five are replaced each year, so that many countries take turns.'
      - 'Nigeria has served two-year terms as a non-permanent member, for example in 1966 to 1967 and 1978 to 1979, and it began another in 2010.'
      - 'Remember: five permanent forever, ten elected for two.'
      - 'The trap is A, 5 years. Five is the number of permanent members, not the length of the term.'
    hint: 'How many years does an elected member sit on the Security Council?'
    why:
      A: 'Five is the number of permanent members, not the length of a term.'
      C: 'The term is two years; four years would let too few countries serve.'
      D: 'Six years is not a term on the Security Council.'

  49:
    answer: B
    steps:
      - 'The office here is the Secretary-General of the United Nations, the chief administrative officer.'
      - 'Under Article 97 of the United Nations Charter, the Secretary-General is appointed by the General Assembly upon the recommendation of the Security Council.'
      - 'The Security Council recommends first, so the five permanent members can block a candidate with a veto; then the whole General Assembly appoints, so every member state has a say.'
      - 'Nigeria takes part in that appointment as a member of the General Assembly, the body over which a Nigerian, Major-General Joseph Garba, presided in 1989.'
      - 'Remember: the Council recommends, the Assembly appoints.'
      - 'The trap is C. It swaps the roles: the Assembly does not recommend to the permanent members.'
    hint: 'Which organ recommends, and which organ appoints?'
    why:
      A: 'The Security Council only recommends; it cannot appoint alone.'
      C: 'It reverses the roles; the Security Council recommends and the General Assembly appoints.'
      D: 'The General Assembly cannot appoint without a recommendation from the Security Council.'

  50:
    answer: D
    steps:
      - 'The institution here is the Authority of Heads of State and Government of ECOWAS.'
      - 'The Authority is the highest decision-making organ of ECOWAS. It approves the community''s treaties, protocols and agreements.'
      - 'Treaties bind the member states, so they must be approved at the highest level, by the heads of state and government themselves.'
      - 'The Treaty of Lagos of 1975 and the Revised Treaty signed at Cotonou in 1993 were both signed by the heads of state, Nigeria''s among them.'
      - 'Remember: heads of state sign treaties.'
      - 'The trap is C, the Council of Ministers. It advises the Authority and prepares decisions, but it does not give final approval.'
    hint: 'Who in ECOWAS has the last word on treaties?'
    why:
      A: 'The Secretariat carries out decisions and runs the community''s administration; it does not approve treaties.'
      B: 'The ECOWAS Tribunal, now the Community Court of Justice, interprets the treaty; it does not approve it.'
      C: 'The Council of Ministers makes recommendations to the Authority; it does not have the final say on treaties.'
