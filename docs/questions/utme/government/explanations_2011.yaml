format_version: 1
exam_year: 2011
subject: GOV
explanations:
  2:
    answer: B
    steps:
      - 'This is political socialization.'
      - 'Political socialization is the process by which a person develops attitudes, beliefs and values about the political system.'
      - 'It happens through agents of socialization: the family, the school, peer groups, religious bodies, the mass media and political parties. Each one passes on ideas about power, government and duty.'
      - 'Nigerian link: a pupil who recites the National Pledge every morning, or a youth corps member who learns about other states during NYSC, is being politically socialized.'
      - 'Remember: socialization is the process; the attitudes are its product.'
      - 'The trap is D, political orientation. Orientation is the attitude a person ends up with, not the process by which it develops.'
    hint: 'Which word names the process of learning about politics from family, school and the media?'
    why:
      A: 'Political emancipation means freeing a people from political control, such as winning independence.'
      C: 'Political participation is taking part in politics, such as voting or campaigning, not forming beliefs.'
      D: 'Political orientation is the attitude a person ends up holding, not the process by which it develops.'

  3:
    answer: D
    steps:
      - 'This is political culture.'
      - 'Political culture is the set of shared attitudes, beliefs, values and feelings that the people of a country hold about politics and government.'
      - 'These shared values decide how people behave in politics: whether they vote, obey laws, trust leaders or protest. So political culture governs political behaviour.'
      - 'Nigerian link: where people believe their vote counts, turnout at INEC elections rises; where they distrust the process, many stay at home on election day.'
      - 'Remember: socialization teaches the culture, and the culture steers the behaviour.'
      - 'The trap is A, political socialization. Socialization is how a person learns the culture; it is the culture itself that guides behaviour.'
    hint: 'What do we call the shared values and beliefs of a people about politics?'
    why:
      A: 'Socialization is the process of learning political values; it passes on the culture rather than governing behaviour itself.'
      B: 'An ideology is a set of ideas about how society should be organised, such as socialism; it is held by some groups, not shared by the whole people.'
      C: 'Political economy studies how politics and the economy affect each other; it is a field of study, not what guides behaviour.'

  4:
    answer: D
    steps:
      - 'This is sovereignty, the supreme power of a state to make and enforce laws.'
      - 'Sovereignty has two sides. Legal sovereignty lies with the body that makes the law, such as parliament. Political sovereignty lies with the people who choose that body, the electorate.'
      - 'In a democracy the electorate gives power to leaders through elections and can take it back at the next one, so ultimate political power rests with the voters.'
      - 'Nigerian link: every four years registered voters elect the President, the National Assembly and state Houses of Assembly. Those leaders hold power only because the electorate gave it.'
      - 'Remember: the law-maker is legally sovereign; the voter is politically sovereign.'
      - 'The trap is B, the state. The state possesses sovereignty in law, but in a democracy political sovereignty rests with the electorate.'
    hint: 'In a democracy, who chooses the leaders and can remove them at the next election?'
    why:
      A: 'A community is a group of people living together; it is not the legal body of voters that holds political power.'
      B: 'The state possesses legal sovereignty, but political sovereignty in a democracy rests with the electorate.'
      C: 'The elite are a small group with influence; giving them supreme power describes an oligarchy, not democracy.'

  5:
    answer: D
    steps:
      - 'This is democracy, government of the people, by the people and for the people.'
      - 'A core feature of democracy is popular consultation: the people are asked for their views and consent through periodic elections, referendums and public hearings.'
      - 'Because leaders get their authority from the people, they must consult them regularly. Without consultation there is no consent, and without consent there is no democracy.'
      - 'Nigerian link: INEC conducts general elections every four years, and National Assembly committees hold public hearings on bills.'
      - 'Remember: democracy asks the people.'
      - 'The trap is B. Every government, democratic or not, has responsibilities to society, so it is not a feature that marks out democracy.'
    hint: 'Which option shows the people being asked for their consent?'
    why:
      A: 'Interdependence of states is about relations between countries, not how a country is governed.'
      B: 'Every kind of government has duties to society, so this does not mark out democracy.'
      C: 'Democracy is rule by the majority with protection for minorities; power is not vested in minority parties.'

  6:
    answer: C
    steps:
      - 'This is capitalism.'
      - 'Capitalism is an economic and political system in which the means of production, such as land, factories and capital, are owned privately and run for profit.'
      - 'Prices are set by market forces of demand and supply, and the profit motive drives private owners to produce.'
      - 'Nigerian link: privately owned banks, factories and markets operate in Nigeria today, and the policy of privatization moved many former government enterprises into private hands.'
      - 'Remember: capitalism, capital in private hands.'
      - 'The trap is A, fascism. Fascism allowed private ownership but put the economy under the total control of the state; private ownership is not its central idea.'
    hint: 'Which ideology is built on private ownership and profit?'
    why:
      A: 'Fascism centres on a totalitarian state and extreme nationalism, with business controlled by the state.'
      B: 'Feudalism centres on land held from a lord in return for service, not private ownership of capital.'
      D: 'Communism abolishes private ownership; the means of production are owned in common.'

  7:
    answer: A
    steps:
      - 'This is feudalism.'
      - 'Feudalism was the system of medieval Europe in which the king granted land to lords, the lords granted land to vassals, and serfs worked the land in return for protection.'
      - 'Each rank held land from the one above and owed it loyalty and service, so the whole society was a hierarchy built on land ownership.'
      - 'Nigerian link: pre-colonial Hausa-Fulani emirates had a similar pattern, with fiefs held by title holders under the Emir, and textbooks often describe them as feudal.'
      - 'Remember: feudal, from fief, a piece of land held from a lord.'
      - 'The trap is C, communism. Communism abolishes private land ownership altogether, so it has no ladder of landholders.'
    hint: 'Which system is a ladder of king, lords, vassals and serfs on the land?'
    why:
      B: 'Totalitarianism is total state control of all life; it is defined by power, not by a ladder of land holding.'
      C: 'Communism abolishes private ownership of land, so it has no hierarchy of landholders.'
      D: 'Fascism is a totalitarian, nationalist ideology; it is not built on ranks of land ownership.'

  8:
    answer: C
    steps:
      - 'This is the quasi-legislative function of the civil service. Quasi means "as if" or "partly".'
      - 'The civil service is not a legislature, but it does law-like work: civil servants draft bills for ministers and make detailed rules and regulations under powers delegated by the legislature.'
      - 'Laws passed by the legislature are often broad, so the civil service fills in the details, and those rules bind the public like law.'
      - 'Nigerian link: federal ministries draft the bills that ministers send to the National Assembly, and agencies issue regulations under Acts of the National Assembly.'
      - 'Remember: the civil service is quasi-legislative when it writes rules and quasi-judicial when it settles disputes in administrative tribunals.'
      - 'The trap is A, the judiciary. The judiciary interprets laws and settles disputes; its main function is judicial, not legislative.'
    hint: 'Which body drafts bills and writes regulations without being a law-making house?'
    why:
      A: 'The judiciary interprets laws and settles disputes; that is its full judicial function, not a partial legislative one.'
      B: 'Traditional institutions have advisory and customary roles today; they do not draft bills or regulations for the state.'
      D: 'The executive is a full arm of government that implements laws; the textbook quasi-legislative body is the civil service that serves it.'

  9:
    answer: B
    steps:
      - 'This is a confederation, a union of sovereign states with a weak central authority.'
      - 'In a confederation the member states keep their sovereignty and give the centre only limited powers, and each member is free to withdraw.'
      - 'Because the centre is weak and loyalty stays with the member states, any serious disagreement can lead a member to pull out, so the union tends to break up.'
      - 'Nigerian link: the Aburi meeting of January 1967 discussed a loose, confederal arrangement for Nigeria, and the crisis ended in an attempted secession and civil war.'
      - 'Remember: in a confederation the door is always open, so states walk out.'
      - 'The trap is A. Over-concentration of authority is a weakness of a unitary state, the opposite of a confederation.'
    hint: 'If every member keeps its sovereignty, what can a member do when it disagrees?'
    why:
      A: 'Over-concentration of power at the centre is a weakness of a unitary state, not a confederation.'
      C: 'Members of a confederation keep full independence; lack of local independence is the opposite problem.'
      D: 'A confederation can share a common currency, and lacking one is not its major weakness.'

  10:
    answer: A
    steps:
      - 'This is representation in a legislature.'
      - 'Each member of parliament is elected by the voters of a constituency, a defined area, to represent them.'
      - 'Because the member speaks for the constituency, he must report back to its people on what the house did, so they can judge his work at the next election.'
      - 'Nigerian link: members of the House of Representatives each represent a federal constituency and hold town hall meetings to report to their constituents.'
      - 'Remember: elected by the constituency, answerable to the constituency.'
      - 'The trap is D, political parties. A member belongs to a party, but the people he represents and reports to are his constituents.'
    hint: 'Who elected the member and will judge him at the next election?'
    why:
      B: 'Local government chairmen run councils; legislators do not report to them.'
      C: 'Traditional rulers are custodians of culture; they are not the people a legislator represents.'
      D: 'A member is loyal to his party, but he represents and reports to the voters of his constituency.'

  11:
    answer: D
    steps:
      - 'This is a unitary state.'
      - 'A unitary state has one central government that holds all power; any regional or local bodies get their powers from the centre and can have them withdrawn.'
      - 'In a federal state, the constitution divides power between the centre and the states, so neither can take the other''s powers away. Ghana''s constitution creates one central government, so Ghana is unitary.'
      - 'Nigerian link: Nigeria has been federal since the 1954 Lyttleton Constitution, except for Decree No. 34 of 1966, which briefly made it unitary.'
      - 'Remember: unitary, one centre; federal, shared power.'
      - 'The trap is B, India. India has states with their own constitutional powers, so it is a federation.'
    hint: 'Which of these countries has no states with powers of their own?'
    why:
      A: 'Nigeria is a federation of thirty-six states and the Federal Capital Territory.'
      B: 'India is a federation; its constitution divides power between the Union and the states.'
      C: 'The United States is the classic federation, with fifty states.'

  12:
    answer: B
    steps:
      - 'This is prorogation.'
      - 'Prorogation is the formal ending of a session of parliament by proclamation of the head of state, in Britain the monarch. Parliament still exists and meets again in a new session.'
      - 'Prorogation ends a session; adjournment is a short break within a session, decided by the house itself; dissolution ends the life of the parliament so that a new one can be elected.'
      - 'Nigerian link: under the 1960 and 1963 constitutions the Governor-General, and later the President, could prorogue the Federal Parliament.'
      - 'Remember: adjourn is a pause, prorogue ends the session, dissolve ends the parliament.'
      - 'The trap is D, dissolution. Dissolution is also done by proclamation, but it ends the parliament itself and leads to a general election.'
    hint: 'Which word means a session ends but the same parliament will meet again?'
    why:
      A: 'Parliament expires when its fixed term runs out, not by proclamation ending one session.'
      C: 'Adjournment is a break within a session, decided by the house itself.'
      D: 'Dissolution ends the whole parliament and leads to a fresh election, not just one session.'

  13:
    answer: D
    steps:
      - 'This is the parliamentary system of government.'
      - 'In a parliamentary system the prime minister and the cabinet are members of the legislature, chosen from the party with a majority of seats.'
      - 'Because the executive sits in and depends on parliament, the two arms are fused. This fusion of powers is the main feature of the system, and the cabinet must keep the confidence of parliament to stay in office.'
      - 'Nigerian link: in the First Republic, Sir Abubakar Tafawa Balewa was Prime Minister and a member of the House of Representatives.'
      - 'Remember: parliamentary system, ministers sit in parliament.'
      - 'The trap is A. The executive is a small cabinet of ministers, not all the members of the party.'
    hint: 'Where does a prime minister in a parliamentary system come from?'
    why:
      A: 'The executive is a small cabinet, not every member of the ruling party.'
      B: 'Judges are independent and are not drawn from any party.'
      C: 'Electoral commissioners leaving office at the end of their tenure happens in any system.'

  14:
    answer: C
    steps:
      - 'This is socialism.'
      - 'Socialism is a system in which the state owns and controls the major means of production, such as large industries, banks and land, for the benefit of all.'
      - 'Private property and private enterprise are allowed only on a small scale, so a person can own some wealth, but its accumulation is limited to stop the rise of a rich class.'
      - 'Nigerian link: the 1979 Constitution and the 1999 Constitution both direct the state to prevent the concentration of wealth in the hands of a few, a socialist idea in Nigeria''s Fundamental Objectives.'
      - 'Remember: capitalism encourages private wealth, socialism limits it, communism abolishes it.'
      - 'The trap is A, prohibited. Prohibiting private wealth describes the classless communist ideal, not socialism.'
    hint: 'Socialism sits between capitalism and communism. What happens to private wealth in the middle?'
    why:
      A: 'Prohibiting private wealth is the communist ideal; socialism allows some private property.'
      B: 'Every economy regulates wealth through tax and law; socialism goes further and limits it.'
      D: 'Encouraging private accumulation of wealth is the mark of capitalism.'

  15:
    answer: A
    steps:
      - 'This is the classification of constitutions.'
      - 'Aristotle, the Greek philosopher of the fourth century BC, studied the constitutions of about one hundred and fifty-eight Greek city-states and classified them.'
      - 'He grouped them by who rules, one, few or many, and whether they rule for the common good, giving monarchy, aristocracy and polity, and their bad forms tyranny, oligarchy and democracy.'
      - 'Nigerian link: modern writers still classify constitutions, for example the 1999 Constitution of Nigeria is written, rigid and federal.'
      - 'Remember: Aristotle is the father of political science and the first to sort constitutions.'
      - 'The trap is D, Plato. Plato was Aristotle''s teacher and wrote about the ideal state, but the systematic study and classification of real constitutions was Aristotle''s work.'
    hint: 'Which Greek thinker studied over a hundred city-state constitutions?'
    why:
      B: 'Rousseau wrote The Social Contract in the eighteenth century, long after the first classification.'
      C: 'K.C. Wheare wrote on modern federal government and constitutions in the twentieth century.'
      D: 'Plato described an ideal state; the classification of actual constitutions was done by his student Aristotle.'

  16:
    answer: D
    steps:
      - 'This is constitutionalism.'
      - 'Constitutionalism is the principle that government must act within the limits set by the constitution, keeping strictly to its provisions.'
      - 'It limits power: leaders cannot act as they please, citizens'' rights are protected, and courts can strike down actions that go beyond the constitution.'
      - 'Nigerian link: Section 1 of the 1999 Constitution declares the Constitution supreme and binding on all authorities and persons in Nigeria.'
      - 'Remember: constitutionalism, the constitution rules the rulers.'
      - 'The trap is C. Operating a constitution is simply using it; constitutionalism means keeping strictly to its limits.'
    hint: 'Which option is about obeying the constitution, not making or changing it?'
    why:
      A: 'Drafting a constitution is constitution-making, done before constitutionalism can operate.'
      B: 'Amendment is changing a constitution, not keeping to it.'
      C: 'Operating a constitution can still be done badly; constitutionalism requires strict adherence to it.'

  18:
    answer: C
    steps:
      - 'This is the duty of a citizen.'
      - 'A duty is something a citizen must do for the state. Duties include paying taxes, obeying the law, voting, defending the country and respecting the flag and anthem.'
      - 'The state needs revenue to provide services such as roads, schools and security, so paying tax is an essential legal duty, enforced by law.'
      - 'Nigerian link: Section 24 of the 1999 Constitution lists the duties of every citizen, including to declare income honestly and pay taxes promptly.'
      - 'Remember: rights from the state, duties to the state, and tax pays for both.'
      - 'The trap is A. Citizens are free to support or oppose the government in power; that is a political choice, not a duty.'
    hint: 'Which option is required of every citizen by law?'
    why:
      A: 'Supporting the government in power is a choice; citizens may lawfully oppose it.'
      B: 'Reciting the pledge shows loyalty, but it is not as essential as the legal duty to pay tax.'
      D: 'Encouraging other citizens is vague and is not a duty owed to the state.'

  19:
    answer: A
    steps:
      - 'This is franchise, also called suffrage.'
      - 'Franchise is the right to vote in elections.'
      - 'Universal adult suffrage gives the vote to every adult citizen, while restricted franchise limits it by sex, property, income or education.'
      - 'Nigerian link: the Clifford Constitution of 1922 gave the vote only to adult men in Lagos and Calabar with an income of at least one hundred pounds a year. Today every citizen aged eighteen and above can vote.'
      - 'Remember: franchise, freedom to vote.'
      - 'The trap is D. Rights and duties of a citizen is citizenship as a whole; franchise is one right within it.'
    hint: 'Franchise has another name, suffrage. What right is it?'
    why:
      B: 'Ownership of the means of production is about the economy, not elections.'
      C: 'Sovereignty is the supreme power of a state, not an electoral right.'
      D: 'Rights and duties of a citizen is the whole of citizenship; franchise is only the right to vote.'

  20:
    answer: D
    steps:
      - 'This is a party system.'
      - 'A party system is classified by the number of political parties that compete for power: one-party, two-party or multi-party.'
      - 'The number of parties decides how power is won and shared. In a two-party system one party usually forms the government; in a multi-party system coalitions are common.'
      - 'Nigerian link: Nigeria had a two-party system in the Third Republic, the SDP and the NRC, and has had a multi-party system in the Fourth Republic.'
      - 'Remember: count the parties to name the system.'
      - 'The trap is B. Parties in every system have structures, so structure does not tell one system from another.'
    hint: 'One-party, two-party, multi-party. What changes between them?'
    why:
      A: 'The relationship between parties and the electorate varies within any system; it does not name the type.'
      B: 'Every party has a structure, so structure cannot tell one party system from another.'
      C: 'How parties operate differs from party to party, but party systems are named by the number of parties.'

  21:
    answer: D
    steps:
      - 'This is interest aggregation.'
      - 'Interest aggregation is bringing many separate individual demands together into one common position or set of demands.'
      - 'A pressure group gathers people with similar concerns, harmonizes their different demands into one voice, and then presents it to government, which gives it more weight than scattered individuals.'
      - 'Nigerian link: the Nigeria Labour Congress gathers the demands of many unions and workers into one demand, such as a national minimum wage.'
      - 'Remember: aggregate means add together.'
      - 'The trap is C, mobilisation. Mobilising is rallying members to act; harmonizing their different concerns into one is aggregation.'
    hint: 'Which word means putting many demands together into one?'
    why:
      A: 'Formulation is drawing up a policy or demand; it does not bring different concerns together.'
      B: 'Manipulation means controlling people unfairly; it is not a function of pressure groups.'
      C: 'Mobilisation rallies members into action; harmonizing their concerns is aggregation.'

  22:
    answer: D
    steps:
      - 'This is an opinion poll, a way of measuring public opinion.'
      - 'An opinion poll asks a sample of people questions to find out what the public feels and thinks about particular issues, policies and candidates.'
      - 'Because the sample is chosen to represent the whole population, the results show government and parties how people feel, so they can adjust their policies.'
      - 'Nigerian link: before general elections, research groups poll voters on candidates and on issues such as fuel prices and security.'
      - 'Remember: a poll takes the pulse of the people on issues and policies.'
      - 'The trap is B. Polls do test views on a single policy, but they cover issues and policies in general, so B is too narrow.'
    hint: 'Which option covers both issues and policies?'
    why:
      A: 'Benefits from government are measured by data on services, not by asking for opinions.'
      B: 'A poll on one government policy is only one use; polls measure feelings about issues and policies in general.'
      C: 'Expectations are part of opinion, but polls measure people''s feelings on issues and policies more broadly.'

  23:
    answer: B
    steps:
      - 'This is the acephalous political system of pre-colonial Igboland.'
      - 'Acephalous means "without a head". Igbo villages had no king or central ruler; power was shared by the council of elders, the Ofo title holders, age grades, the village assembly and title societies such as Ozo.'
      - 'Because authority was spread among many bodies and decisions were made by consensus in the village assembly, no single person could gather enough power to rule as an autocrat.'
      - 'Nigerian link: this is why the British, using indirect rule, had to appoint warrant chiefs in the East, which led to the Aba Women''s Riot of 1929.'
      - 'Remember: no head, no tyrant.'
      - 'The trap is A. Fear of dethronement checked kings such as the Alaafin of Oyo, but the Igbo had no throne to lose.'
    hint: 'Did Igbo villages have a single ruler at the top?'
    why:
      A: 'Dethronement checked kings in centralised states like Oyo; the Igbo had no king to dethrone.'
      C: 'Age grades did real work in Igbo society, but they were one of many bodies; the root reason was the absence of a central authority.'
      D: 'Cult societies were one influence among many; they did not themselves rule out autocracy.'

  24:
    answer: C
    steps:
      - 'This is the Yoruba traditional system, best known from the Oyo Empire.'
      - 'The Oyo Empire was ruled by a king, the Alaafin, so the system was monarchical. It was a constitutional monarchy because the Alaafin''s power was checked.'
      - 'The Oyomesi, a council of seven chiefs led by the Bashorun, advised the Alaafin and could ask him to commit suicide if he ruled badly; the Ogboni society in turn checked the Oyomesi.'
      - 'Nigerian link: Yoruba towns today still have Obas, such as the Alaafin of Oyo and the Ooni of Ife, as traditional rulers.'
      - 'Remember: Yoruba, a king with checks, a constitutional monarchy.'
      - 'The trap is A, republican. A republic has no king, which describes the Igbo, not the Yoruba.'
    hint: 'Was the Alaafin a king?'
    why:
      A: 'A republic has no hereditary king; the Yoruba had the Alaafin and other Obas.'
      B: 'The system had checks, but power was held by the Alaafin and chiefs, not by the people as in a democracy.'
      D: 'Egalitarian describes the Igbo, where no one ruled over the rest; the Yoruba had a clear hierarchy.'

  25:
    answer: D
    steps:
      - 'This is the Waziri, in the Sokoto Caliphate and the Hausa-Fulani emirates.'
      - 'The Waziri was the chief adviser and head of the administration, and ranked next to the Sultan or the Emir.'
      - 'Because the Sultan or Emir held both religious and political power, he needed a chief minister to run the daily work of government and to advise him, and that was the Waziri.'
      - 'Nigerian link: emirate councils in northern Nigeria still have a Waziri among their title holders.'
      - 'Remember: Waziri is the prime minister, second only to the Sultan.'
      - 'The trap is B, the Galadima. The Galadima administered the capital city, an important post but below the Waziri.'
    hint: 'Which title is often called the prime minister of the emirate?'
    why:
      A: 'The Alkali was the judge of the Sharia court, not the head of administration.'
      B: 'The Galadima administered the capital, a post below the Waziri.'
      C: 'The Madaki was the commander of the army, below the Waziri.'

  26:
    answer: C
    steps:
      - 'This is an acephalous society.'
      - 'Acephalous means "without a head". An acephalous society has no king or central ruler; authority is shared by elders, age grades and village assemblies.'
      - 'The Igbo lived in small, independent villages governed by consensus, so they are the classic acephalous society in Nigeria.'
      - 'Nigerian link: Benin was ruled by the Oba, Oyo by the Alaafin, and Nupe by the Etsu Nupe, so all three were centralised states.'
      - 'Remember: no head, the Igbo; a king, the others.'
      - 'The trap is A, Benin. Benin had one of the strongest kings in West Africa, the Oba, so it was centralised.'
    hint: 'Which of these peoples had no king?'
    why:
      A: 'Benin was a centralised kingdom ruled by the Oba.'
      B: 'Oyo was a centralised empire under the Alaafin.'
      D: 'Nupe was a centralised kingdom under the Etsu Nupe.'

  27:
    answer: B
    steps:
      - 'This is indirect rule, the British method of ruling through traditional rulers.'
      - 'Under indirect rule the British governed through emirs, Obas and appointed warrant chiefs, backed by colonial power and the native courts.'
      - 'Because the rulers were now backed by British force rather than checked by their own people, many became autocratic, imposed taxes and forced labour, and exploited and oppressed the people.'
      - 'Nigerian link: in the East the warrant chiefs were so oppressive that their abuses helped spark the Aba Women''s Riot of 1929.'
      - 'Remember: backed by the British, unchecked by the people.'
      - 'The trap is D. Indirect rule kept the educated elite out of power, but it slowed nationalism, especially in the North, rather than encouraging it.'
    hint: 'What happens when a ruler is backed by a colonial power instead of checked by his people?'
    why:
      A: 'Indirect rule ruled each group through its own rulers, which kept groups apart rather than integrating them.'
      C: 'Separate administration for each people encouraged division, not cooperation between communities.'
      D: 'By shutting out the educated elite and protecting traditional rulers, indirect rule slowed nationalism, especially in the North.'

  28:
    answer: C
    steps:
      - 'This is the achievement of the Nigerian nationalists.'
      - 'The main goal of the nationalists was to end British rule and win self-government, which is political liberation.'
      - 'Through parties, the press, constitutional conferences and the demand for self-rule, they won independence for Nigeria on the first of October 1960.'
      - 'Nigerian link: leaders such as Herbert Macaulay, Nnamdi Azikiwe, Obafemi Awolowo and Ahmadu Bello led this struggle.'
      - 'Remember: the nationalists won the flag, the political freedom.'
      - 'The trap is D. Building the nation is the work that continues after independence; the nationalists'' main achievement was winning that independence.'
    hint: 'What did Nigeria gain on the first of October 1960?'
    why:
      A: 'Registering parties was a means in the struggle, not its main achievement.'
      B: 'Economic liberation was not won at independence; the economy stayed tied to foreign interests.'
      D: 'Nation-building is a continuing task after independence, not the nationalists'' main achievement.'

  29:
    answer: C
    steps:
      - 'This is the Second World War, from 1939 to 1945.'
      - 'The Second World War was fought to defend freedom against Nazi Germany and its allies. Nigerian soldiers fought for Britain in Burma and East Africa.'
      - 'The returning soldiers had seen that white men were not superior and had fought for freedom abroad, so they demanded it at home. The war also weakened Britain and led to the Atlantic Charter, which promised self-determination.'
      - 'Nigerian link: nationalist pressure grew quickly after the war, leading to the Richards Constitution of 1946 and the general strike of 1945.'
      - 'Remember: soldiers who fought for freedom came home asking for it.'
      - 'The trap is A, Pan-Africanism. Pan-Africanism inspired the nationalists, but the war was the major external shock that sped up the demand for independence.'
    hint: 'Which world event sent Nigerian soldiers abroad and weakened Britain?'
    why:
      A: 'Pan-Africanism inspired nationalists, but the Second World War was the major external factor.'
      B: 'The Yom Kippur War was in 1973, well after Nigeria''s independence.'
      D: 'The anti-apartheid movement grew mainly after Nigeria''s independence.'

  30:
    answer: D
    steps:
      - 'This is the presidential system of government.'
      - 'In a presidential system the President is both head of state and head of government, elected directly by the people, and the executive is separate from the legislature.'
      - 'Nigeria replaced the parliamentary system of the First Republic with this system in the 1979 Constitution, because the drafters wanted one clear executive leader instead of a split between a ceremonial President and a Prime Minister.'
      - 'Nigerian link: Alhaji Shehu Shagari became Nigeria''s first executive President on the first of October 1979, under the 1979 Constitution.'
      - 'Remember: nineteen seventy-nine, Second Republic, first executive President.'
      - 'The trap is B, 1999. The 1999 Constitution also uses the presidential system, but it continued it rather than introducing it.'
    hint: 'When did Nigeria get its first executive President?'
    why:
      A: 'The 1989 Constitution was presidential but was never fully put into effect; the system was already introduced in 1979.'
      B: 'The 1999 Constitution continued the presidential system that began in 1979.'
