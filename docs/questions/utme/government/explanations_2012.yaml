format_version: 1
exam_year: 2012
subject: GOV
explanations:
  2:
    answer: C
    steps:
      - 'The idea here is Max Weber''s definition of the state.'
      - 'Weber (1919) said the state is the body that successfully claims the monopoly of the legitimate use of physical force, which the question calls violence, within its territory.'
      - 'Many groups have power or control, but only the state may lawfully arrest, punish, imprison or use armed force. Any other group that does so breaks the law.'
      - 'In Nigeria only the Police, the armed forces and other lawful agencies may use force. A vigilante group or a cult that punishes people on its own is committing a crime.'
      - 'Remember: the state alone holds the lawful stick.'
      - 'The trap is B, power. Power is held by many people and groups, such as parties, unions and rich individuals, so it does not mark the state out.'
    hint: 'Which thing may only the state use lawfully, and nobody else?'
    why:
      A: 'Control is exercised by many bodies, such as parents, employers and churches, so it is not unique to the state.'
      B: 'Power is shared by parties, pressure groups and individuals; only the lawful use of force belongs to the state alone.'
      D: 'Justice is an aim the state pursues, and traditional and religious bodies also settle disputes, so the state has no monopoly of it.'

  3:
    answer: A
    steps:
      - 'The concept is the state as a political entity.'
      - 'A state is a group of people organised under a government within a definite territory, with sovereignty. Its four elements are population, territory, government and sovereignty.'
      - 'A people alone is not a state, and land alone is not a state. They become one when they are organised under a government with authority over a fixed territory.'
      - 'Nigeria is a state: its people live within fixed borders, under the Federal Government, and no outside power rules them.'
      - 'Remember PTGS: population, territory, government, sovereignty.'
      - 'The trap is B. An association of men in a society can be a club or a union; it has no territory and no sovereignty.'
    hint: 'Which option has both people organised together and a fixed territory?'
    why:
      B: 'An association of men may be a club or a union; it lacks a defined territory and sovereignty.'
      C: 'A nation is a people with a shared culture; a state is not a branch of it, and one state may hold many nations.'
      D: 'A geographical location is only land; a state also needs people, a government and sovereignty.'

  4:
    answer: C
    steps:
      - 'The concept is political socialization.'
      - 'Political socialization is the process by which a person learns the political values, beliefs and attitudes of his society.'
      - 'It goes on all through life, through agents such as the family, the school, peer groups, religious bodies, the mass media and political parties.'
      - 'A Nigerian child learns to respect the flag, to recite the National Pledge at school assembly and to value voting from parents and teachers. That is political socialization at work.'
      - 'Remember: socialization is how society passes its political values on.'
      - 'The trap is D, indoctrination. Indoctrination forces one set of ideas on people without question; it is only a narrow, one-sided form of passing on values.'
    hint: 'Which process passes political values from one generation to the next through family, school and the media?'
    why:
      A: 'Re-orientation is an effort to change values people already hold, not the way they acquire them in the first place.'
      B: 'A political campaign seeks votes for a candidate or party at election time; it does not pass on a society''s values.'
      D: 'Indoctrination is a one-sided imposing of ideas; values in a society are acquired through the wider process of socialization.'

  5:
    answer: D
    steps:
      - 'The concept is political sovereignty.'
      - 'Sovereignty is supreme power. Legal sovereignty is the power to make laws, held by the legislature. Political sovereignty is the power behind it, which in a democracy belongs to the electorate.'
      - 'The electorate chooses the lawmakers and the leaders, and can remove them at the next election. So the final political power rests with the voters.'
      - 'In Nigeria, registered voters aged eighteen and above elect the President, the National Assembly, the governors and the state Houses of Assembly.'
      - 'Remember: the legislature holds legal sovereignty, the voters hold political sovereignty.'
      - 'The trap is A, the legislature. It holds legal sovereignty, the power to make law, but it owes its seat to the voters.'
    hint: 'Who chooses, and can remove, the lawmakers in a democracy?'
    why:
      A: 'The legislature holds legal sovereignty, the power to make laws, not political sovereignty.'
      B: 'In a democracy the elite does not hold supreme power; rule by a few is oligarchy or aristocracy.'
      C: 'The executive carries out laws and owes its office to the voters, so final political power is not with it.'
  6:
    answer: A
    steps:
      - 'The concept is the prerogative of mercy, the one power of the executive that does the work of the courts.'
      - 'The executive may grant amnesty or a pardon, reduce a sentence or delay its execution. This changes the result of a judgement, which is why it is called a judicial function of the executive.'
      - 'It acts as a last check on the courts, so that a harsh sentence or a mistake can be put right.'
      - 'The 1999 Constitution gives this power to the President (section 175) and to a state governor (section 212), each after consulting an advisory council on the prerogative of mercy.'
      - 'Remember: mercy is the executive''s judicial power.'
      - 'The trap is C, ensuring obedience to the law. That is law enforcement, the ordinary work of the executive, not a judicial act.'
    hint: 'Which option changes what a court has already decided?'
    why:
      B: 'Implementing court orders is enforcement, the normal executive function of carrying out decisions.'
      C: 'Ensuring obedience to the law is law enforcement, the core executive function, not a judicial one.'
      D: 'Appointing judges is an executive act of appointment; it does not decide or change any case.'

  7:
    answer: C
    steps:
      - 'The concept is the unitary system of government.'
      - 'In a unitary system the constitution places supreme power in one central government. Any local or regional bodies get only the powers the centre chooses to give them.'
      - 'Because the centre is supreme, it can create, change or abolish the lower units, and there is no constitutional sharing of power.'
      - 'Nigeria was run in a unitary way under the Unification Decree (Decree No. 34) of May 1966, which abolished the regions. Britain is the classic example of a unitary state.'
      - 'Remember: unitary means one centre holds it all.'
      - 'The trap is A, federal. In a federation power is shared between the centre and the units by the constitution, and the constitution itself, not the centre, is supreme.'
    hint: 'In which system does the central government hold the supreme power and the units only what it gives them?'
    why:
      A: 'A federal constitution divides power between the centre and the states, so supremacy does not rest in the centre.'
      B: 'In a confederation the member states keep supreme power and the centre is weak.'
      D: 'Parliamentary describes how the executive relates to the legislature, not where supreme power lies.'

  8:
    answer: B
    steps:
      - 'The concept is the presidential system, also called presidentialism.'
      - 'In a presidential system all executive power is vested in one person, the president, who is head of state and head of government. He bears the ultimate responsibility for carrying out the laws.'
      - 'Because the constitution places executive power in him, the ministers he appoints only assist him and answer to him.'
      - 'Section 5 of the 1999 Constitution vests the executive powers of the Federation in the President, as the 1979 Constitution also did.'
      - 'Remember: in a presidential system the buck stops with the president.'
      - 'The trap is D, autocracy. An autocrat holds all powers, making, carrying out and judging laws, without constitutional limits; the question describes the executive power alone.'
    hint: 'In which system does the constitution give one leader the whole executive power?'
    why:
      A: 'In the parliamentary system executive power is shared by the prime minister and cabinet, who are collectively responsible to parliament.'
      C: 'A dictator seizes all power by force; the question describes a constitutional assignment of executive power.'
      D: 'An autocrat holds every kind of power without limits, not just the responsibility to execute laws.'

  9:
    answer: C
    steps:
      - 'The concept is a bill.'
      - 'A bill is the draft of a proposed law placed before the legislature for consideration. It becomes an Act only after it is passed and signed.'
      - 'The legislature debates the bill through its readings and committee stage, then passes or rejects it. Only then does it go to the executive for assent.'
      - 'In Nigeria a bill passed by the Senate and the House of Representatives becomes an Act of the National Assembly when the President assents to it.'
      - 'Remember: a bill goes in, an Act comes out.'
      - 'The trap is A, the executive. The executive signs a bill only after the legislature has considered and passed it.'
    hint: 'Which arm of government debates and passes proposed laws?'
    why:
      A: 'The executive assents to a bill only after the legislature has passed it; it does not consider drafts first.'
      B: 'A party caucus may discuss a bill, but it has no legal power to pass it.'
      D: 'The judiciary interprets laws after they are made; it does not consider bills.'

  10:
    answer: A
    steps:
      - 'The concept is capitalism.'
      - 'Capitalism is an economic and political system in which the means of production, such as land, factories and banks, are owned privately and run for profit.'
      - 'Because owners keep their profit, they compete, and prices are set mainly by the market.'
      - 'A trader who owns her shop in Onitsha market or a businessman who owns a factory in Lagos is working in a capitalist way. Nigeria today has a mixed economy with a large private sector.'
      - 'Remember: capitalism means capital in private hands.'
      - 'The trap is B, socialism. Socialism puts the means of production under state or collective ownership.'
    hint: 'Which system leaves factories and farms in private hands?'
    why:
      B: 'Socialism places the means of production under state or collective ownership.'
      C: 'Communalism is common ownership by the community, as in traditional African land holding.'
      D: 'Communism abolishes private ownership altogether in a classless society.'

  11:
    answer: C
    steps:
      - 'The concept is feudalism, the system of medieval Europe.'
      - 'Under feudalism the king granted land to lords (nobles), and serfs worked that land. So the two major classes were the lords who owned land and the serfs who worked it.'
      - 'The serfs were tied to the land and gave labour and produce; in return the lords gave them protection and a plot to live on.'
      - 'Some Nigerian writers compare the old relationship between a landlord and tenant farmers in parts of the North to this lord and serf pattern.'
      - 'Remember: lords own the land, serfs work the land.'
      - 'The trap is B, vassals. A vassal was a lesser lord who held land from a greater lord, so vassals belonged to the landowning side, not a class opposite the serfs.'
    hint: 'Who owned the land the serfs worked?'
    why:
      A: '"The masses" is a modern general word for ordinary people, not a feudal class.'
      B: 'Vassals were themselves lesser lords holding land from a greater lord, so they were part of the landowning class.'
      D: '"Elite" is a general modern term for a ruling few, not the class name used in feudalism.'

  12:
    answer: B
    steps:
      - 'The concept is a flexible constitution.'
      - 'A flexible constitution can be amended in the same way as an ordinary law, with no special procedure.'
      - 'Britain''s constitution is largely unwritten, so Parliament can change it by passing an ordinary Act with a simple majority.'
      - 'Nigeria''s 1999 Constitution is rigid: section 9 needs a two-thirds majority in each house of the National Assembly and approval by the Houses of Assembly of at least two-thirds of the states.'
      - 'Remember: Britain bends easily; written federal constitutions are rigid.'
      - 'The trap is D, the United States. Its constitution is one of the most rigid: an amendment needs two-thirds of Congress and three-quarters of the states.'
    hint: 'Which country changes its constitution by an ordinary Act of Parliament?'
    why:
      A: 'South Africa has a written constitution that needs special majorities to amend, so it is rigid.'
      C: 'Benin Republic has a written constitution with a special amendment procedure, so it is rigid.'
      D: 'The United States constitution needs two-thirds of Congress and three-quarters of the states to amend, which makes it rigid.'

  13:
    answer: D
    steps:
      - 'The concept is the rule of law.'
      - 'A.V. Dicey (1885) gave three parts to the rule of law: the supremacy of the law, equality before the law, and the protection of rights by the ordinary courts.'
      - 'If the law is supreme, then no ruler can act as he likes. So the rule of law rules out, or negates, absolute and arbitrary power.'
      - 'In Nigeria, the courts can declare an act of government unlawful, and the 1999 Constitution limits the powers of every office holder.'
      - 'Remember: where the law rules, no man rules absolutely.'
      - 'The trap is C, limited power. Limited power is what the rule of law creates, not what it negates.'
    hint: 'If the law is above everyone, what kind of power can no one have?'
    why:
      A: 'Equality before the law is one of the pillars of the rule of law, not its opposite.'
      B: 'Supremacy of the law is the first principle of the rule of law itself.'
      C: 'Limited power is the result of the rule of law, not something it negates.'

  14:
    answer: C
    steps:
      - 'The concept is the separation of powers.'
      - 'Montesquieu, in The Spirit of the Laws (1748), taught that the legislative, executive and judicial powers should be held by separate bodies with separate personnel.'
      - 'If one person or body holds all three, he can make a harsh law, enforce it and judge his own case. Separating them stops tyranny and protects the rights and freedom of citizens.'
      - 'The 1999 Constitution vests legislative power in the National Assembly (section 4), executive power in the President (section 5) and judicial power in the courts (section 6).'
      - 'Remember: three arms, three hands, so no one hand holds everything.'
      - 'The trap is A, fused. Fusion of powers is a feature of the parliamentary system, and it does not by itself guard freedom.'
    hint: 'What did Montesquieu say must happen to the three powers to stop tyranny?'
    why:
      A: 'Fused powers concentrate authority, which is the danger separation of powers guards against.'
      B: 'Incorporating the powers would join them together, the opposite of what protects freedom.'
      D: 'Rotating powers among the arms is not a principle of democratic government.'

  15:
    answer: C
    steps:
      - 'The concept is delegated legislation.'
      - 'Delegated legislation is law made by a person or body to which parliament has given (delegated) part of its law-making power. Examples are ministerial regulations, orders and local government bye-laws.'
      - 'Parliament has too little time and expertise to make every detailed rule, so it passes a parent Act and lets ministers, councils and agencies fill in the details.'
      - 'In Nigeria a local government council makes bye-laws on markets and motor parks, and a minister makes regulations under an Act of the National Assembly.'
      - 'Remember: delegated means passed down from parliament.'
      - 'The trap is A, the president. The president or a minister can be one of the bodies that make delegated legislation, so he is not the one excluded.'
    hint: 'Whose law-making power is being passed down to others?'
    why:
      A: 'The president and his ministers often make delegated legislation, such as regulations, so they are not excluded.'
      B: 'A governor and state commissioners can also make regulations under a law, so they are among the delegates.'
      D: 'Courts make rules of court under delegated powers too, so the judiciary is not the excluded body.'

  16:
    answer: D
    steps:
      - 'The concept is prorogation of parliament.'
      - 'Prorogation is the formal ending of a session of parliament by proclamation of the head of state, in Britain the monarch. Members keep their seats and meet again in the next session.'
      - 'Dissolution is different: it ends the life of the whole parliament, all seats fall vacant and a general election follows.'
      - 'In Nigeria''s parliamentary First Republic, the Governor-General, and from 1963 the President, prorogued and dissolved Parliament on the Prime Minister''s advice.'
      - 'Remember: prorogue pauses, dissolve dismisses.'
      - 'The trap is B, dissolution. It also comes by proclamation, but it ends the parliament itself, not just a session.'
    hint: 'Which act ends a session but leaves the members in their seats?'
    why:
      A: 'A political impasse is a deadlock between parties or arms, not a formal act ending a session.'
      B: 'Dissolution ends the life of the whole parliament and leads to a general election, not just the end of a session.'
      C: 'A vote of no confidence is passed by members against the government; it is not a royal proclamation.'

  17:
    answer: C
    steps:
      - 'The concept is political rights.'
      - 'Political rights are the rights of citizens to take part in the government of their country: to vote, to be voted for, to join a party and to hold public office.'
      - 'They let citizens choose and control their rulers, which is what makes a government democratic.'
      - 'In Nigeria every citizen aged eighteen and above who has registered may vote in elections conducted by INEC.'
      - 'Remember: political rights are about the polls and the parties.'
      - 'The trap is B, civil rights. Civil rights protect the individual, such as freedom of speech and the right to a fair hearing, not participation in government.'
    hint: 'Voting and standing for election are which kind of right?'
    why:
      A: 'Economic rights concern work, property and fair wages, not taking part in government.'
      B: 'Civil rights protect personal freedoms, such as speech and fair hearing, rather than participation in government.'
      D: 'Social rights concern education, health and welfare, not taking part in government.'

  18:
    answer: C
    steps:
      - 'The body is INEC, the Independent National Electoral Commission.'
      - 'INEC was set up in 1998 to conduct the elections that began the Fourth Republic, and the 1999 Constitution makes it the body that conducts federal and state elections.'
      - 'Earlier commissions served earlier periods: FEDECO in the Second Republic, NEC under the Babangida regime and NECON under the Abacha regime.'
      - 'INEC conducts presidential, National Assembly, governorship and state House of Assembly elections, while each State Independent Electoral Commission conducts local government elections.'
      - 'Remember: INEC is the one with "Independent" in front.'
      - 'The trap is B, FEDECO. It conducted federal elections in 1979 and 1983, but it was dissolved after the military took power in December 1983.'
    hint: 'Which electoral commission has existed since 1998?'
    why:
      A: 'NEC was the National Electoral Commission of the Babangida regime; it no longer exists.'
      B: 'FEDECO was the Second Republic''s commission; it was dissolved after December 1983.'
      D: 'NECON was the commission of the Abacha regime, replaced by INEC in 1998.'

  19:
    answer: C
    steps:
      - 'The concept is proportional representation.'
      - 'Under proportional representation each party gets seats in parliament in proportion to its share of the votes. A party with 30% of the votes gets about 30% of the seats.'
      - 'This is fair to small parties, since votes for losing candidates are not wasted.'
      - 'Nigeria does not use it. Its legislators are elected by simple majority, where the candidate with the most votes in a constituency wins. South Africa uses proportional representation.'
      - 'Remember: proportional means seats in proportion to votes.'
      - 'The trap is B, simple majority. Under it the winner in each constituency takes the seat, so seats need not match the votes.'
    hint: 'Which system makes the share of seats match the share of votes?'
    why:
      A: 'Absolute majority means a winner needs more than half the votes; it does not share out seats by votes.'
      B: 'Simple majority gives the seat to the top candidate in each constituency, so seats need not match votes.'
      D: 'Indirect election means voters choose an electoral college that then chooses the officials; it says nothing about sharing seats.'

  20:
    answer: A
    steps:
      - 'The concept is a primary election.'
      - 'A primary election is held within a party to choose the candidates it will present at the general election.'
      - 'It is intra-party, which means inside the party. It can be direct, where all members vote, or indirect, where delegates vote.'
      - 'In Nigeria parties hold primaries before every general election, and INEC monitors them under the Electoral Act.'
      - 'Remember: the primary comes first, inside the party.'
      - 'The trap is B, a general election. That is the contest between parties, in which all voters choose among the parties'' candidates.'
    hint: 'What do party members hold to pick their flag-bearer?'
    why:
      B: 'A general election is a contest between parties open to all voters, not a choice made inside one party.'
      C: 'A mid-term election is held halfway through a term, as in the United States; it is not a party selection.'
      D: 'A by-election fills a single seat that has fallen vacant; it is not a party selection exercise.'

  21:
    answer: B
    steps:
      - 'The concept is a pressure group.'
      - 'A pressure group is an organised group of people with common interests that tries to influence government policy in its members'' favour.'
      - 'Its primary aim is to protect and promote the interest of its members. Unlike a political party, it does not seek to capture political power.'
      - 'The Nigeria Labour Congress presses for workers'' wages, the Nigerian Bar Association for lawyers and the Nigeria Union of Teachers for teachers.'
      - 'Remember: a pressure group pushes for its members; a party runs for office.'
      - 'The trap is C. Capturing political power is the aim of a political party, not of a pressure group.'
    hint: 'What does a union like the NUT exist to do for its members?'
    why:
      A: 'Attracting attention is a method a pressure group may use, not its aim.'
      C: 'Capturing political power is the aim of a political party; pressure groups only influence those in power.'
      D: 'Fighting corrupt officials may be the cause of one group, but it is not the primary aim of pressure groups in general.'

  22:
    answer: C
    steps:
      - 'The concept is public opinion and how it is measured.'
      - 'Public opinion is the views held by a large part of the people on a public issue. It is gauged through opinion polls, the mass media, referendums, elections and public meetings.'
      - 'The mass media carry the views of the people through letters, phone-in programmes, editorials and surveys, so leaders can read the public mood from them.'
      - 'In Nigeria, radio phone-in programmes and newspaper letters columns show how people feel about a new policy, such as a fuel price change.'
      - 'Remember: the media is the mirror of public opinion.'
      - 'The trap is D, the electoral college. It is a small body that chooses officials, so it does not reflect the views of the whole public.'
    hint: 'Which option carries the voices of ordinary people every day?'
    why:
      A: 'A constitution is the body of rules for governing a state, not a tool for measuring opinion.'
      B: 'An educational institution teaches and socialises; it does not measure public opinion.'
      D: 'An electoral college is a small body chosen to elect officials, not a measure of the whole public''s views.'

  23:
    answer: A
    steps:
      - 'The concept is bureaucracy, the civil service.'
      - 'Max Weber described bureaucracy as a permanent organisation of officials appointed on merit, working by fixed rules and a chain of command.'
      - 'Ministers and governments come and go, but the officials stay, keep the records and follow the rules. So the business of government goes on in an orderly way.'
      - 'In a Nigerian federal ministry, the Permanent Secretary and the civil servants remain in office when a minister is changed.'
      - 'Remember: politicians are passengers, the bureaucracy is the bus.'
      - 'The trap is D, the political party. Parties rise and fall with elections, so they cannot guarantee continuity.'
    hint: 'Which body stays in office when ministers change?'
    why:
      B: 'A public corporation provides a particular service, such as ports or power, not continuity of government as a whole.'
      C: 'The ombudsman investigates complaints against officials; it does not keep the machinery of government running.'
      D: 'Political parties lose and win power at elections, so they cannot ensure continuity.'

  24:
    answer: A
    steps:
      - 'The office is the Hakimi, the district head in the Hausa-Fulani emirate system.'
      - 'The emirate was headed by the Emir. Below him the districts were headed by the Hakimi, the villages by the Dagaci and the wards by the Mai Unguwa.'
      - 'The Hakimi collected taxes in his district and kept order there for the Emir, so power ran down a clear chain.'
      - 'This chain was used by the British under indirect rule in Northern Nigeria, and district heads still exist in emirates such as Kano and Zaria.'
      - 'Remember: Emir, Hakimi, Dagaci, from the top down.'
      - 'The trap is B, a Dagaci. The Dagaci headed a village, one step below the district.'
    hint: 'Who stood between the Emir and the village heads?'
    why:
      B: 'The Dagaci was a village head, below the district head.'
      C: 'The Alkali was a judge in the Sharia court, not a territorial head.'
      D: 'The Waziri was the Emir''s chief adviser, like a prime minister, at the capital.'

  25:
    answer: A
    steps:
      - 'The concept is checks and balances in the Old Oyo Empire.'
      - 'The Alaafin was the head of the empire, but the Oyomesi, the seven kingmakers led by the Bashorun, could check him. The Ogboni society in turn checked the Oyomesi.'
      - 'If the Alaafin abused his power, the Oyomesi could reject him and ask him to commit suicide. No one could rule without limits, and this is what made the system democratic.'
      - 'Today the 1999 Constitution uses the same idea: the National Assembly can impeach a President, and the courts can strike down unlawful acts.'
      - 'Remember: Alaafin checked by Oyomesi, Oyomesi checked by Ogboni.'
      - 'The trap is D, the rule of law. It is a modern principle of law; the Oyo system rested on institutions checking one another.'
    hint: 'Who could check the Alaafin, and who could check them?'
    why:
      B: 'Fusion of power concentrates authority; the Oyo system divided and limited it.'
      C: 'Individual responsibility is a moral idea; democracy in Oyo came from institutions checking one another.'
      D: 'The rule of law is a modern principle; the Oyo system worked through bodies that checked each other.'

  26:
    answer: B
    steps:
      - 'The concept is the motive for the colonization of Africa.'
      - 'After the Industrial Revolution, European countries needed raw materials, markets for their goods and places to invest. Africa offered all three.'
      - 'These needs drove the Scramble for Africa, which the Berlin Conference of 1884 to 1885 regulated.'
      - 'In Nigeria the Royal Niger Company traded in palm oil, and the British later developed cocoa, groundnut and cotton for export.'
      - 'Remember: colonialism followed the money.'
      - 'The trap is C, religious reasons. Missionaries came too, but the main drive was economic.'
    hint: 'What did European factories need from Africa?'
    why:
      A: 'Security considerations played a small part; the main drive was trade and raw materials.'
      C: 'Missionaries spread Christianity, but religion was not the main reason for colonization.'
      D: 'Spreading European culture was a claim made to justify rule, not the main motive.'

  27:
    answer: A
    steps:
      - 'The policy is assimilation.'
      - 'Assimilation was the French aim of turning Africans into Frenchmen in language, culture and law, so they could become French citizens.'
      - 'France saw its colonies as part of France itself, so it ruled them directly and spread the French language and education.'
      - 'In Senegal''s four communes Africans could become French citizens, and Blaise Diagne sat in the French parliament from 1914. Nigeria''s neighbours Benin, Niger and Chad were French colonies.'
      - 'Remember: assimilate means make similar, to the French.'
      - 'The trap is D, indirect rule. Indirect rule was the British policy used in Nigeria, ruling through traditional rulers.'
    hint: 'What did the French try to turn Africans into?'
    why:
      B: 'Paternalism is a general attitude of treating colonised people like children, not the named French policy.'
      C: 'Socialism is an economic ideology, not a French colonial policy.'
      D: 'Indirect rule was the British policy of ruling through traditional rulers.'

  28:
    answer: C
    steps:
      - 'The person is Nnamdi Azikiwe.'
      - 'Azikiwe returned to Nigeria in 1937 and founded the West African Pilot newspaper. He moved nationalism from mild requests for reform to a bold demand for self-government.'
      - 'His fiery writing and his NCNC party inspired young people, and his followers formed the Zikist Movement in 1946, which was the most radical nationalist group of the time.'
      - 'Herbert Macaulay, founder of the NNDP in 1923, is called the father of Nigerian nationalism, but his was the earlier, constitutional phase.'
      - 'Remember: Zik and the Pilot took off the gloves.'
      - 'The trap is B, Herbert Macaulay. He started organised nationalism, but radical nationalism is linked to Azikiwe.'
    hint: 'Which nationalist used his newspaper from 1937 to make bold demands?'
    why:
      A: 'Aminu Kano led radical politics in the North through NEPU from 1950, but Nigerian radical nationalism as a whole is credited to Azikiwe.'
      B: 'Herbert Macaulay is the father of Nigerian nationalism, from its earlier constitutional phase.'
      D: 'Mbonu Ojike was a radical follower of Azikiwe in the NCNC, not the source of the movement.'

  29:
    answer: A
    steps:
      - 'The people are Edward Wilmot Blyden and John Payne Jackson.'
      - 'Blyden was a West Indian-born scholar based in Liberia who lived and lectured in Lagos in the 1890s. Payne Jackson was a Liberian-born journalist who founded and edited the Lagos Weekly Record in the 1890s.'
      - 'Both worked inside Lagos itself, through lectures and the press, so their influence on Nigerians was direct. They taught pride in being African and criticised colonial rule.'
      - 'Their ideas helped shape early Lagos nationalists, before Herbert Macaulay founded the NNDP in 1923.'
      - 'Remember: Blyden and Jackson were foreigners at work in Lagos.'
      - 'The trap is C. Du Bois was a foreigner, but H.O. Davies was a Nigerian, a leader of the Nigerian Youth Movement.'
    hint: 'Check two things for each pair: were both foreigners, and did both work in Nigeria itself?'
    why:
      B: 'Casely Hayford of the Gold Coast and James Horton of Sierra Leone shaped West African thought, but they did their main work outside Nigeria, so their influence was less direct.'
      C: 'H.O. Davies was a Nigerian, a leader of the Nigerian Youth Movement, so this is not a pair of foreigners.'
      D: 'Marcus Garvey influenced Africans from abroad and never came to Nigeria, so his influence was indirect.'

  30:
    answer: C
    steps:
      - 'The body is the Senate of Nigeria''s First Republic, 1960 to 1966.'
      - 'Senators were not elected by the people. Each region sent twelve senators chosen by its regional government, Lagos sent four, and four more were appointed on the advice of the Prime Minister.'
      - 'The Senate was meant to protect the regions'' interests and to review bills from the House of Representatives, so the regional governments chose most of its members.'
      - 'Today the 1999 Constitution provides 109 senators, three from each state and one from the FCT, all elected directly by the voters.'
      - 'Remember: First Republic senators were picked, not polled.'
      - 'The trap is A. Direct election of senators began only with the Second Republic in 1979.'
    hint: 'Who sent the regions'' representatives to the First Republic Senate?'
    why:
      A: 'Senators were elected directly only from the Second Republic onward.'
      B: 'No electoral college chose First Republic senators; the governments nominated them.'
      D: 'The president of the Senate presided over it; he did not choose its members.'

  31:
    answer: D
    steps:
      - 'The agency is the Nigeria Police Force.'
      - 'The police keep internal peace and security: they prevent and detect crime, arrest offenders and keep public order.'
      - 'The army, navy and air force defend the country against outside attack, while the police deal with order inside the country.'
      - 'The 1999 Constitution (section 214) establishes the Nigeria Police Force for the whole Federation, headed by the Inspector-General of Police.'
      - 'Remember: the police keep peace at home, the army guards the border.'
      - 'The trap is A, the army. The army may be called in to help in an emergency, but its main duty is to defend Nigeria from external attack.'
    hint: 'Which body do you call when a crime happens on your street?'
    why:
      A: 'The army''s main duty is defence against external attack; it helps internally only in emergencies.'
      B: 'The navy guards Nigeria''s waters and coast against outside threats.'
      C: 'The Civil Defence Corps supports the police and protects public property, but the police hold the main duty.'

  32:
    answer: D
    steps:
      - 'The body is the National Assembly, Nigeria''s federal legislature.'
      - 'It has two chambers, the Senate with 109 members and the House of Representatives with 360 members, and its main function is making laws.'
      - 'Section 4 of the 1999 Constitution vests the legislative power of the Federation in the National Assembly.'
      - 'It also confirms appointments and checks the executive, but these come second to law-making.'
      - 'Remember: legislature means law-making.'
      - 'The trap is C. The Senate does confirm ministers and other appointments, but that is not its primary job.'
    hint: 'What does the word legislature mean?'
    why:
      A: 'Executing laws is the work of the President and the executive.'
      B: 'Interpreting laws is the work of the courts.'
      C: 'Confirming appointments is a secondary function of the Senate, not the main one.'

  33:
    answer: D
    steps:
      - 'The issue is the independence of Nigeria''s electoral commissions.'
      - 'An electoral commission must be neutral to conduct fair elections. Its biggest problem has been interference by those in power and by parties.'
      - 'Its chairman and members are appointed by the President, and it has long depended on government for its funds, so it can come under pressure from those in office.'
      - 'This has been said of FEDECO, NEC, NECON and INEC alike; the 2010 amendment of the 1999 Constitution placed INEC''s funding as a first-line charge on the Consolidated Revenue Fund to protect its independence.'
      - 'Remember: an umpire cannot be fair if a player pays and picks him.'
      - 'The trap is C. Commissions have lacked skilled staff at times, but that is a smaller problem than interference.'
    hint: 'What most threatens the fairness of a referee?'
    why:
      A: 'Public support is a lesser problem; voters turn out and support elections when they trust the umpire.'
      B: 'A large population makes the work bigger, but it does not stop a well-run commission from working.'
      C: 'Shortage of skilled staff is real but can be trained away; interference is the deeper problem.'

  34:
    answer: C
    steps:
      - 'The body is the Public Complaints Commission, Nigeria''s ombudsman.'
      - 'An ombudsman is an official who investigates complaints from citizens against government officials and agencies.'
      - 'Its purpose is to address the grievances of individuals and groups who feel unfairly treated by public officials, so that they get redress without going to court.'
      - 'Nigeria set up the Public Complaints Commission in 1975, with offices in the states, where a citizen can complain about, for example, unpaid pension or unfair dismissal.'
      - 'Remember: ombudsman means the people''s complaint office.'
      - 'The trap is B. Disputes between private individuals go to the courts; the commission deals with complaints against public bodies.'
    hint: 'Where does a citizen go to complain about an unfair government office?'
    why:
      A: 'Training and promotion of public servants is handled by the Civil Service Commission and the ministries.'
      B: 'Disputes between private individuals are settled by the courts.'
      D: 'Fighting corruption is done by bodies such as the EFCC and the ICPC.'

  35:
    answer: B
    steps:
      - 'The parties are the PDP, the AD and the APP.'
      - 'In the 1998 to 1999 transition, INEC gave provisional registration to nine parties. Only three met the conditions after the December 1998 local government elections.'
      - 'These were the Peoples Democratic Party (PDP), the All People''s Party (APP) and the Alliance for Democracy (AD). They contested the 1999 elections that began the Fourth Republic on 29 May 1999.'
      - 'The APP later became the All Nigeria Peoples Party (ANPP). The AC, PPA and DPP came later, as more parties were registered from 2002 onwards.'
      - 'Remember: 1999 had three, PDP, APP, AD.'
      - 'The trap is D. It holds the PDP and the APP, but the AC was formed only in 2006.'
    hint: 'Which three parties contested the 1999 elections?'
    why:
      A: 'The DPP and the PPA were registered years after 1999.'
      C: 'The PPA was registered years after 1999, not at the start of the Fourth Republic.'
      D: 'The AC (Action Congress) was formed in 2006, long after the Fourth Republic began.'

  36:
    answer: C
    steps:
      - 'The state is Zamfara State.'
      - 'In late 1999 Zamfara State, under Governor Ahmed Sani Yerima, became the first state in the Fourth Republic to extend Sharia law to criminal matters, in force from January 2000.'
      - 'Sharia courts had long handled personal and family matters for Muslims in the North; the new step was to extend them to criminal cases.'
      - 'Other northern states, including Kano, Katsina and Sokoto, followed in 2000 and after.'
      - 'Remember: Zamfara was first, Z is first in the queue this time.'
      - 'The trap is A, Kano State. Kano is the largest northern state, but it followed Zamfara.'
    hint: 'Which state was first to do this, in 1999?'
    why:
      A: 'Kano State adopted the expanded Sharia system after Zamfara.'
      B: 'Katsina State followed Zamfara in 2000.'
      D: 'Sokoto State also followed Zamfara.'

  37:
    answer: C
    steps:
      - 'The concepts are the federal character principle and the quota system.'
      - 'The 1979 Constitution required that appointments and the sharing of federal posts reflect the federal character of Nigeria, so that no few states or groups dominate.'
      - 'The aim was equity: a fair share of jobs, places and amenities for every state and group, which in turn builds national unity.'
      - 'The Federal Character Commission, set up in 1996 and kept by the 1999 Constitution, monitors this, and admission to federal unity schools uses a quota for each state.'
      - 'Remember: federal character means fair shares for all.'
      - 'The trap is A, loyalty. Command of loyalty is a hoped-for result, but the principle itself ensures equity in sharing.'
    hint: 'What does sharing posts among all states give each of them?'
    why:
      A: 'Loyalty is a hoped-for result; what the principle directly ensures is a fair share for every group.'
      B: 'Economic empowerment is the aim of other programmes, not of fair sharing of federal posts.'
      D: 'Even development is a goal of planning and revenue sharing, not of the federal character principle.'

  38:
    answer: C
    steps:
      - 'The term is public servants.'
      - 'The public service covers everyone paid from public funds: the civil service in ministries, and workers in public corporations, parastatals, the police and the armed forces.'
      - 'Civil servants are only those who work in the ministries and extra-ministerial departments, so workers in corporations are public servants, not civil servants.'
      - 'A staff member of the Nigerian Ports Authority is a public servant; a clerk in the Federal Ministry of Education is a civil servant.'
      - 'Remember: every civil servant is a public servant, but not every public servant is a civil servant.'
      - 'The trap is A, civil servants. That name belongs only to those working in the ministries.'
    hint: 'Is a corporation worker inside a ministry, or in the wider public service?'
    why:
      A: 'Civil servants work in the ministries, not in public corporations.'
      B: 'Private employees work for privately owned firms, while public corporations are owned by government.'
      D: '"Professional employees" is not a class of government workers.'

  39:
    answer: D
    steps:
      - 'The concept is privatization.'
      - 'Privatization is the sale of all or part of government''s shares in public enterprises to private investors.'
      - 'Public enterprises in Nigeria often ran at a loss and depended on government money. Private owners, who must make a profit, are expected to run them more efficiently.'
      - 'The Bureau of Public Enterprises (BPE) carries out privatization under the Public Enterprises (Privatisation and Commercialisation) Act of 1999.'
      - 'Remember: privatize to make it pay its way.'
      - 'The trap is C. Better living standards may follow, but the central aim is efficiency.'
    hint: 'Why sell a loss-making government company to private owners?'
    why:
      A: 'Privatization often leads to more retrenchment, not less, as new owners cut costs.'
      B: 'Prompt payment of salaries is not the purpose of selling public enterprises.'
      C: 'A better standard of living may follow, but it is not the central aim.'

  40:
    answer: A
    steps:
      - 'The topic is the causes of military intervention in Nigeria.'
      - 'The soldiers who took power on 15 January 1966 said they acted because civilian politicians had failed: corruption, rigged elections and crisis in the Western Region.'
      - 'So the main reason they gave was the perceived incapability of civilians to govern. Each later coup gave a similar reason.'
      - 'The same reason was given in December 1983, when the military ended the Second Republic.'
      - 'Remember: coups came when civilians were seen to fail.'
      - 'The trap is C. The question is why soldiers stepped in; nobody, not even they, said it was a desire for military rule in itself.'
    hint: 'What reason did the soldiers give in their first broadcast?'
    why:
      B: 'Foreign countries did not press for coups; intervention came from inside Nigeria.'
      C: 'The coup makers gave civilian failure, not a desire for military rule, as their reason.'
      D: 'Civilians did not wish to give up power; it was taken from them.'

  41:
    answer: A
    steps:
      - 'The body is the Supreme Military Council (SMC).'
      - 'When Major-General Aguiyi-Ironsi took over in January 1966, he set up the Supreme Military Council as the highest body. It made laws by decree.'
      - 'The military suspended the legislature, so the SMC took over its law-making power, while the Federal Executive Council carried out policy.'
      - 'Later regimes renamed it: the Armed Forces Ruling Council under Babangida from 1985 and the Provisional Ruling Council under Abacha from 1993.'
      - 'Remember: S comes first, Supreme, then Armed Forces, then Provisional.'
      - 'The trap is C. The Federal Executive Council carried out policy; it was an executive body, not the legislative one.'
    hint: 'Which ruling council came first, in 1966?'
    why:
      B: 'The Armed Forces Ruling Council came later, under the Babangida regime from 1985.'
      C: 'The Federal Executive Council was the executive body, not the law-making one.'
      D: 'The Provisional Ruling Council came under the Abacha regime from 1993.'

  42:
    answer: D
    steps:
      - 'The principle is Afrocentrism, Africa as the centrepiece of Nigeria''s foreign policy.'
      - 'From independence in 1960, Nigeria has made Africa the centre of its foreign policy: the unity of Africa, the end of colonialism and apartheid, and peace on the continent.'
      - 'Nigeria sees itself as a leading African country, so its own security and standing are tied to the welfare of Africa.'
      - 'Prime Minister Tafawa Balewa stated this at independence, and Nigeria later led ECOMOG peacekeeping and gave strong support to liberation in Southern Africa.'
      - 'Remember: Africa first, Africa at the centre.'
      - 'The trap is B, sub-regionalism. West Africa through ECOWAS is part of the focus, but the centre is the whole continent.'
    hint: 'Which continent has been at the centre of Nigeria''s foreign policy since 1960?'
    why:
      A: 'South-South cooperation among developing countries is pursued, but it is not the main focus.'
      B: 'West Africa is one circle of interest, but Africa as a whole is the centrepiece.'
      C: 'Globalism looks to the whole world, while Nigeria''s policy puts Africa first.'

  43:
    answer: C
    steps:
      - 'The country is Ghana, led by Kwame Nkrumah.'
      - 'Ghana became independent on 6 March 1957, the first colony in West Africa to win its freedom from colonial rule.'
      - 'Nkrumah declared that Ghana''s independence was meaningless unless linked to the total liberation of Africa. He hosted the All-African People''s Conference in Accra in December 1958 to push decolonization.'
      - 'Nigeria, independent in 1960, later became a strong supporter of liberation in Southern Africa, but Ghana led the early drive.'
      - 'Remember: Ghana first to be free, first to free others.'
      - 'The trap is A, Nigeria. Nigeria supported liberation struggles strongly, but it became independent after Ghana, which led the early campaign.'
    hint: 'Which country became independent first and then called for all of Africa to be free?'
    why:
      A: 'Nigeria supported liberation, especially in Southern Africa, but Ghana led the early campaign.'
      B: 'South Africa was under apartheid minority rule until 1994; it was a target of liberation, not its champion.'
      D: 'Kenya fought its own colonial struggle and became independent in 1963; it did not lead the campaign for Africa.'

  44:
    answer: D
    steps:
      - 'The programme is NEPAD, the New Partnership for Africa''s Development.'
      - 'NEPAD was adopted in 2001 as Africa''s own plan for development, led by Presidents Obasanjo of Nigeria, Mbeki of South Africa, Bouteflika of Algeria and Wade of Senegal.'
      - 'Its weakness is that it relies on Western donors and investors for most of its funds, so its plans depend on outside goodwill and conditions.'
      - 'Nigeria was a founding sponsor, and NEPAD''s African Peer Review Mechanism was set up in 2003. In 2018 NEPAD became the African Union Development Agency (AUDA-NEPAD).'
      - 'Remember: a plan paid for by others is steered by others.'
      - 'The trap is A. NEPAD was drawn up by a few leaders, but it was adopted by all African leaders; the bigger drawback is funding.'
    hint: 'Where does most of NEPAD''s money come from?'
    why:
      A: 'NEPAD was drafted by a few leaders but adopted by African leaders as a whole, so this is a lesser criticism.'
      B: 'Being a programme of the African Union gives NEPAD its home and authority; it is not its drawback.'
      C: 'Youth empowerment is one area of work; the main weakness is dependence on outside money.'

  45:
    answer: B
    steps:
      - 'The body is the African Union (AU), launched in Durban on 9 July 2002.'
      - 'The AU''s organs include the Assembly, the Executive Council, the Commission, the Pan-African Parliament, the Court of Justice, the Peace and Security Council and the Economic, Social and Cultural Council.'
      - 'These organs give the AU a legislature, a court and a security body, which the OAU lacked, so it can act on peace and integration.'
      - 'Nigeria has served on the Peace and Security Council, and the Pan-African Parliament sits in Midrand, South Africa. A 2008 protocol plans to merge the Court of Justice into an African Court of Justice and Human Rights.'
      - 'Remember: P P C, Parliament, Peace and Security Council, Court.'
      - 'The trap is D. The Peace and Security Council is an organ, but there is no People''s Assembly or Humanitarian Board.'
