      - 'The scholarship plan, agreed at a conference in Oxford in 1959, lets students from one member country study in another, which binds the members together.'
      - 'Many Nigerians have studied in Britain, Canada and other member countries on Commonwealth scholarships. Nigeria joined the Commonwealth at independence in 1960.'
      - 'Remember: the Commonwealth shares its classrooms.'
      - 'The trap is C. An Agenda for Peace is a 1992 United Nations document by Secretary-General Boutros Boutros-Ghali.'
    hint: 'Which programme sends students from one member country to study in another?'
    why:
