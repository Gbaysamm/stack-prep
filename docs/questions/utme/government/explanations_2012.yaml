    hint: 'How did the NPFL rebels see a Nigerian-led force at first?'
    why:
      A: 'ECOMOG was meant to be neutral, but it was not seen that way at the start.'
      B: 'Its competence was questioned later; at the start the charge was taking sides.'
      D: 'Some called it invaders, but the standard description of how it was seen is partisan.'

