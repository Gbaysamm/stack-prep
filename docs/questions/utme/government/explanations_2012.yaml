      - 'From the start, Charles Taylor''s NPFL and some francophone member states saw it as partisan, taking sides against the NPFL, partly because Nigeria''s government had close ties with President Samuel Doe''s government.'
      - 'Nigeria provided most of ECOMOG''s troops and money until the Liberian war ended with elections in 1997.'
      - 'Remember: at first ECOMOG was seen as taking sides.'
