      - 'OPEC was founded at the Baghdad Conference on 14 September 1960 by five countries: Iran, Iraq, Kuwait, Saudi Arabia and Venezuela.'
      - 'They joined to control oil prices and production so that the oil companies could not dictate to them.'
      - 'Nigeria joined OPEC later, in 1971. Libya joined in 1962 and Algeria in 1969.'
      - 'Remember: four from the Gulf and Venezuela, at Baghdad, 1960.'
