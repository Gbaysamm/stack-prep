      - 'The Security Council has 15 members: five permanent with the veto (the United States, Britain, France, Russia and China) and ten non-permanent.'
      - 'Africa has no permanent seat, so in the Ezulwini Consensus of 2005 the African Union asked for two permanent seats and five non-permanent seats for Africa.'
      - 'Nigeria is often named as a candidate for one of Africa''s permanent seats. The reform had not been agreed when this was set, and it still has not been agreed.'
      - 'Remember: two seats for Africa, Ezulwini.'
      - 'The trap is A, Asia. Asia already has China as a permanent member; Africa, with none, asked for two.'
