format_version: 1
exam_year: 2013
subject: GOV
explanations:
  2:
    answer: D
    steps:
      - 'This is delegated power: power that its real holder hands to someone else to use on its behalf.'
      - 'When power is delegated, the holder does not use it in person. An agent or representative uses it for them, so the holder exercises it indirectly.'
      - 'This is why representative democracy is also called indirect democracy. The people hold power, delegate it to the people they elect, and rule through them.'
      - 'Nigerian link: Nigerian voters do not sit in the National Assembly. They elect senators and members of the House of Representatives, who make laws for them, so the voters exercise their power indirectly.'
      - 'Remember: delegate means send someone in your place, and power used through someone else is used indirectly.'
      - 'The trap is A, by devolution. Devolution is one way of handing power down to a lower body; it does not describe how delegated power is used.'
    hint: 'If someone acts in your place, are you using the power yourself or through them?'
    why:
      A: 'Devolution is a way of transferring power to a lower body, not the way delegated power is exercised.'
      B: 'Power used directly is used by its holder in person, as in direct democracy, which is the opposite of delegation.'
      C: 'Coercion is the use of force, not the handing of power to an agent.'

  3:
    answer: A
    steps:
      - 'This is de jure sovereignty, which means sovereignty by right of law.'
      - 'De jure sovereignty is supreme power that the law and the constitution recognise. It is acquired through law.'
      - 'It is set against de facto sovereignty, which is the power actually exercised by whoever holds force, even without legal right.'
      - 'Nigerian link: section 14(2)(a) of the 1999 Constitution says sovereignty belongs to the people of Nigeria, from whom government, through the Constitution, derives all its powers.'
      - 'Remember: de jure means "by law"; de facto means "in fact".'
      - 'The trap is D, force. Power taken by force is de facto sovereignty, not de jure.'
    hint: 'What does the Latin "de jure" mean?'
    why:
      B: 'A grant gives a privilege; sovereignty in law rests on the law and constitution, not on a gift.'
      C: 'A treaty binds states to one another; it is not the source of legal sovereignty within a state.'
      D: 'Power seized by force is de facto sovereignty, the opposite of de jure.'

  4:
    answer: D
    steps:
      - 'This is the state.'
      - 'A state is a group of people living in a definite territory under one government and common laws, and free from outside control.'
      - 'Its four features are population, territory, government and sovereignty. The common law in the question comes from the government, and the definite territory is the land the state controls.'
      - 'Nigerian link: Nigeria became a sovereign state on 1 October 1960, with its own territory, people, government and laws.'
      - 'Remember PTGS: people, territory, government, sovereignty.'
      - 'The trap is C, nation. A nation is held together by a shared culture and history, not by a common law over a territory.'
    hint: 'Which of these is defined by territory, people and one law over them?'
    why:
      A: 'A community is any group sharing a place or interest; it need not have its own law or government.'
      B: 'A nation-state is a state whose people also form one nation; the stem says nothing about one culture.'
      C: 'A nation is bound by common culture, language and history, and may have no territory or law of its own.'

  5:
    answer: B
    steps:
      - 'This is political socialization.'
      - 'Political socialization is the process by which the political values, beliefs and attitudes of a society are passed from one generation to the next.'
      - 'It happens through agents such as the family, the school, peer groups, religious bodies and the mass media. Each one teaches people how to see government and their place in it.'
      - 'Nigerian link: civic education in school and the NYSC year, when graduates serve in another state, both pass on values of national unity.'
      - 'Remember: socialization means passing the political culture on.'
      - 'The trap is C, political transition. A transition is a change of government, not the learning of political values.'
    hint: 'How does a young person come to hold the political values of their society?'
    why:
      A: 'A military take-over is a coup, a seizure of power, not the passing on of values.'
      C: 'Political transition is a change from one government or regime to another.'
      D: 'Choosing between party programmes is political participation, which socialization prepares people for.'

  6:
    answer: B
    steps:
      - 'This is Aristotle''s classification of governments.'
      - 'Aristotle sorted governments by how many rule and whom they rule for. Rule by the few for the good of all is aristocracy.'
      - 'For the good of all, rule by one is monarchy, by the few is aristocracy and by the many is polity. When rulers serve only themselves, these become tyranny, oligarchy and democracy.'
      - 'Nigerian link: in old Oyo, the Oyomesi were seven noble chiefs who chose the Alaafin and checked his power, a small group of nobles sharing in rule.'
      - 'Remember: aristos is Greek for "the best", so aristocracy is rule by the best few for all.'
      - 'The trap is C, autocracy. Autocracy is rule by one person with unlimited power, not by a few.'
    hint: 'In Aristotle''s table, what is good rule by the few called?'
    why:
      A: 'Diarchy is rule by two persons or bodies sharing power, not by a few for the good of all.'
      C: 'Autocracy is rule by one person with absolute power.'
      D: 'Polyarchy, a modern term, means rule by many competing groups, not by a few.'

  7:
    answer: B
    steps:
      - 'This is gerontocracy.'
      - 'Gerontocracy is government by the elders, the old people of a community.'
      - 'It rests on the belief that age brings wisdom and experience, so the elders settle disputes and make the rules.'
      - 'Nigerian link: in many pre-colonial Igbo communities, a council of elders, with the holders of the ofo staff, met with the village assembly to rule.'
      - 'Remember: geron is Greek for "old man", as in geriatric care for the old.'
      - 'The trap is A, monarchy. A monarch may be old, but monarchy means rule by one hereditary ruler, not by old people as a group.'
    hint: 'Which word starts with the Greek for "old man"?'
    why:
      A: 'Monarchy is rule by one hereditary king or queen, whatever their age.'
      C: 'Feudalism is a system built on land held in return for service to a lord.'
      D: 'Theocracy is rule by religious leaders in the name of God.'

  8:
    answer: A
    steps:
      - 'This is the executive, and a commissioner is a member of the state executive.'
      - 'The executive is the arm of government that implements, or carries out, the laws.'
      - 'A commissioner heads a state ministry. The ministry turns the laws and policies of the state into action, such as building roads or running schools.'
      - 'Nigerian link: under section 192 of the 1999 Constitution, the governor appoints commissioners, who sit in the State Executive Council and carry out laws made by the State House of Assembly.'
      - 'Remember: the legislature makes, the executive executes, the judiciary judges.'
      - 'The trap is D, making laws. That is the work of the State House of Assembly, the legislature.'
    hint: 'Which arm of government carries out laws?'
    why:
      B: 'Writing laws is part of law-making, the job of the legislature.'
      C: 'Giving loans is a banking activity, not the function of a commissioner as an executive.'
      D: 'Making laws is the function of the legislature, the State House of Assembly.'

  9:
    answer: A
    steps:
      - 'This is rule adjudication.'
      - 'Rule adjudication means interpreting the laws and applying them to disputes to decide who is right. It is the primary function of the judiciary.'
      - 'The three arms divide the work: the legislature makes rules, the executive applies them and the judiciary adjudicates on them.'
      - 'Nigerian link: the courts, from the magistrate courts to the Supreme Court of Nigeria, settle disputes between citizens and between governments.'
      - 'Remember: adjudicate contains "judge", and judges sit in the judiciary.'
      - 'The trap is D, legislature. The legislature makes rules; it does not judge cases under them.'
    hint: 'Which arm settles disputes by interpreting the law?'
    why:
      B: 'The executive applies, or carries out, rules; it does not adjudicate on them.'
      C: 'Government is the whole system of three arms, not the one arm that adjudicates.'
      D: 'The legislature makes rules; judging cases under them is the judiciary''s work.'

  10:
    answer: C
    steps:
      - 'This is judicial review.'
      - 'Judicial review is the power of the courts to examine the acts of the executive and the legislature and declare void any that go against the constitution.'
      - 'In a federation the constitution is supreme, so when the executive acts beyond its powers, the court strikes the act down. This is how the judiciary checks the executive.'
      - 'Nigerian link: section 1(3) of the 1999 Constitution says any law inconsistent with the Constitution is void, and the Supreme Court can so declare.'
      - 'Remember: the court reviews and can say "this is unconstitutional".'
      - 'The trap is B, judicial overview. It sounds like judicial review, but it is not a recognised power of the courts.'
    hint: 'Which power lets a court declare a government action unconstitutional?'
    why:
      A: 'Delegated legislation is law made by bodies the legislature authorises; it is not a court check on the executive.'
      B: '"Judicial overview" is not a recognised power of the courts; the term is judicial review.'
      D: 'Motions are used in the legislature, which is the legislature''s own way of checking the executive.'

  11:
    answer: D
    steps:
      - 'This is the unitary system of government.'
      - 'In a unitary system all powers belong to one central government. Any local units exist only by its will and can be changed by it.'
      - 'Because power is not divided, there are no clashes between tiers of government. Decisions are made quickly and carried out the same way everywhere, which makes the government strong and stable.'
      - 'Nigerian link: the Unification Decree of 24 May 1966, under Aguiyi-Ironsi, tried to turn Nigeria into a unitary state; the federal system was restored in September 1966.'
      - 'Remember: one centre of power gives one strong voice.'
      - 'The trap is C, popular among the masses. A unitary government is often seen as distant from local people, so popularity is not its advantage.'
    hint: 'What happens to a government when power is not shared out among tiers?'
    why:
      A: 'No system is free of controversy; people still disagree over policies under a unitary government.'
      B: 'Being distant from the people is a disadvantage of the unitary system, not an advantage.'
      C: 'A unitary government can seem remote, so popularity among the masses is not a feature it brings.'

  12:
    answer: D
    steps:
      - 'This compares the presidential and the parliamentary systems.'
      - 'In the presidential system the president is elected for a fixed term, and the constitution limits how long and how many times he or she may hold office.'
      - 'In the parliamentary system the prime minister stays in office only while keeping the support of parliament, so there is no fixed tenure. Ministers are also members of parliament, so powers are fused, and the cabinet is collectively responsible.'
      - 'Nigerian link: under sections 135 and 137 of the 1999 Constitution, the President serves four years and may be elected only twice.'
      - 'Remember: presidential means fixed term and separate powers; parliamentary means fused powers and collective responsibility.'
      - 'The trap is B, fused powers. Fusion of executive and legislative powers is a mark of the parliamentary system, not the presidential one.'
    hint: 'Which of these four belongs only to the presidential system?'
    why:
      A: 'Collective responsibility of the cabinet is a feature of the parliamentary system.'
      B: 'Fusion of executive and legislative powers is a feature of the parliamentary system.'
      C: 'Merged powers describe the parliamentary system; the presidential system separates the three arms.'

  13:
    answer: C
    steps:
      - 'This is socialism.'
      - 'Socialism is the ideology in which the main means of production are owned by the state or the community, so that wealth is shared equitably.'
      - 'Socialists argue that private ownership lets a few grow rich while many stay poor, so the state should own key industries and provide free social services.'
      - 'Nigerian link: the Unity Party of Nigeria in the Second Republic campaigned on democratic socialism, with free education and free health care.'
      - 'Remember: socialism puts society first and shares wealth fairly.'
      - 'The trap is A, capitalism. Capitalism leaves wealth to private ownership and the market, which tends to concentrate it.'
    hint: 'Which ideology wants the means of production owned in common?'
    why:
      A: 'Capitalism is built on private ownership and profit, which lets wealth gather in a few hands.'
      B: 'Aristocracy is rule by a few nobles, a form of government rather than a theory of sharing wealth.'
      D: 'Plutocracy is rule by the rich, the opposite of sharing wealth equitably.'

  14:
    answer: A
    steps:
      - 'This is a rigid constitution.'
      - 'A rigid constitution is one that cannot be amended by an ordinary law. It needs a special, difficult procedure.'
      - 'The special procedure protects the constitution from being changed by a passing majority, and in a federation it protects the powers of each tier.'
      - 'Nigerian link: under section 9 of the 1999 Constitution, an amendment needs two-thirds of each house of the National Assembly and the approval of two-thirds of the State Houses of Assembly, which is 24 of 36.'
      - 'Remember: rigid means stiff, hard to bend.'
      - 'The trap is B, written. Most rigid constitutions are written, but a written constitution can also be flexible; "written" describes its form, not how hard it is to amend.'
    hint: 'Which word means stiff and hard to bend?'
    why:
      B: 'Written describes the form of a constitution, and a written one may still be easy to amend.'
      C: 'An unwritten constitution, like Britain''s, is usually changed by ordinary Acts of Parliament.'
      D: 'A flexible constitution is easy to amend by the ordinary law-making process.'

  15:
    answer: D
    steps:
      - 'This is a flexible constitution.'
      - 'A flexible constitution can be amended by the ordinary law-making process of the legislature.'
      - 'Centralized power means all power is held by one central government, as in a unitary state. With nothing to protect between tiers, a constitution the centre can change easily suits it.'
      - 'Nigerian link: Nigeria divides power between the federal, state and local governments, so it has a rigid constitution; a flexible one would let the centre take back states'' powers by an ordinary act.'
      - 'Remember: flexible goes with unitary, rigid goes with federal.'
      - 'The trap is B, rigid. A rigid constitution is made to protect power that is divided, which is the opposite of centralization.'
    hint: 'Centralized power means a unitary state. Which kind of constitution does a unitary state usually need?'
    why:
      A: 'An unwritten constitution is usually flexible too, but it is the ease of amendment, not the lack of a single document, that suits centralized power.'
      B: 'A rigid constitution protects divided power in a federation.'
      C: 'A written constitution is often rigid, and writing it down does not by itself centralize power.'

  16:
    answer: D
    steps:
      - 'This is devolution.'
      - 'Devolution is the transfer of powers from a central government to lower, subordinate bodies, which then exercise those powers on their own, with autonomy.'
      - 'In delegation, the lower body only acts on behalf of the higher one, which can take the power back at any time. In devolution, the powers belong to the lower body.'
      - 'Nigerian link: the 1976 Local Government Reform gave Nigeria''s local governments their own functions and their own share of revenue, so they could act on their own within their areas.'
      - 'Remember: devolve means hand down to keep; delegate means hand down to use for me.'
      - 'The trap is C, delegation. Delegated powers are not autonomous; they are used on behalf of the delegating authority.'
    hint: 'Which transfer lets the lower body use the powers on its own?'
    why:
      A: 'Concentration keeps powers at the centre instead of transferring them.'
      B: 'Deconcentration moves only administrative tasks to field offices of the same central body, with no autonomy.'
      C: 'Delegated powers are used on behalf of the delegating authority and can be taken back, so they are not autonomous.'

  17:
    answer: B
    steps:
      - 'This is citizenship by birth.'
      - 'Citizenship by birth is gained by being born to parents who are citizens. A citizen by birth cannot be deprived of it by the state.'
      - 'Citizenship granted by the state, such as by naturalization, can be withdrawn if the person breaks its conditions, for example by disloyalty or by a serious crime soon after the grant.'
      - 'Nigerian link: section 25 of the 1999 Constitution sets out citizenship by birth, and section 30 lets the President deprive only a person who is not a citizen by birth or by registration.'
      - 'Remember: what you are born with, the state cannot take away.'
      - 'The trap is D, naturalization. Naturalized citizenship is a grant by the state, so the state can withdraw it.'
    hint: 'Which citizenship did the state not give, so it cannot take it back?'
    why:
      A: 'Citizenship imposed by conquest rests on force and is lost or changed when the conquest ends.'
      C: 'Honorary citizenship is a privilege granted by the state and can be withdrawn.'
      D: 'Naturalized citizenship is granted by the state on conditions, and it can be withdrawn if they are broken.'

  18:
    answer: A
    steps:
      - 'This is universal suffrage.'
      - 'Suffrage is the right to vote. Universal suffrage is the right of all citizens who have reached the voting age to vote, without regard to sex, wealth, education or religion.'
      - 'It grew as old limits, such as votes only for property owners or only for men, were removed. Its purpose is to let every citizen take part in choosing the government.'
      - 'Nigerian link: section 77(2) of the 1999 Constitution gives every Nigerian citizen of eighteen years and above the right to register and vote, and INEC registers them.'
      - 'Remember: universal means everyone, so universal suffrage is the vote for every citizen of age.'
      - 'The trap is D, adult suffrage. It describes the same right by the age limit alone; the full term for the right of all citizens to vote is universal suffrage.'
    hint: 'Which suffrage means every citizen of voting age can vote?'
    why:
      B: '"Nationality suffrage" is not a recognised term for the right to vote.'
      C: '"Electoral suffrage" is not a recognised term; suffrage is already about voting in elections.'
      D: 'Adult suffrage names only the age test; the right of all citizens to vote, with no other barrier, is called universal suffrage.'

  19:
    answer: A
    steps:
      - 'This compares a political party with a pressure group.'
      - 'A political party is an organised group that aims to win elections and control the government. A pressure group aims only to influence government policy.'
      - 'Both groups are organised, both plan strategies and both raise funds, so those things do not tell them apart. Their objective does.'
      - 'Nigerian link: parties present candidates at elections run by INEC, the Independent National Electoral Commission, while the Nigeria Labour Congress lobbies the government on wages without fielding candidates.'
      - 'Remember: a party wants to rule; a pressure group wants to be heard.'
      - 'The trap is B, organization. Pressure groups are well organised too, so organization is not the difference.'
    hint: 'What does a party want that a pressure group does not?'
    why:
      B: 'Both parties and pressure groups are formally organised, so organization does not set them apart.'
      C: 'Both use strategies such as campaigns and lobbying; the main difference is what they aim for.'
      D: 'Both are funded by dues, donations and levies, so finance is not the main difference.'

  20:
    answer: C
    steps:
      - 'This is a function of pressure groups.'
      - 'A pressure group is an organised group that tries to influence government policy for its members. One function is to articulate, or express clearly, their opinions and demands.'
      - 'By voicing members'' views to the government, through lobbying, petitions or strikes, it links the people with those in power.'
      - 'Nigerian link: the Nigerian Union of Teachers speaks for teachers on pay and conditions, and the Nigerian Bar Association speaks for lawyers.'
      - 'Remember: pressure groups press their members'' case.'
      - 'The trap is D, contesting elections. That is the work of political parties; pressure groups influence government without seeking office.'
    hint: 'What does a pressure group do with its members'' views?'
    why:
      A: 'The president is nominated by a political party, not by a pressure group.'
      B: 'The budget is prepared by the executive and passed by the legislature.'
      D: 'Contesting elections is a function of political parties, not pressure groups.'

  21:
    answer: A
    steps:
      - 'This is public opinion.'
      - 'Public opinion is the aggregate, or total, of the views held by members of the public and their groups on a government activity or issue of the day.'
      - 'It is formed through the mass media, the family, schools, religious bodies and pressure groups, and it guides government because leaders want public support.'
      - 'Nigerian link: when a government plans a change, such as a rise in fuel prices, newspapers, radio phone-ins and opinion polls show public opinion on it.'
      - 'Remember: public opinion is the people''s view, added up.'
      - 'The trap is D, the National Assembly. Lawmakers'' views are the views of a few representatives, not of the public as a whole.'
    hint: 'Whose views make up public opinion, a few leaders or the public?'
    why:
      B: 'The president''s views are those of one person, not the public.'
      C: 'The chief justice''s views are those of one judge, not the public.'
      D: 'The members of the National Assembly are a few representatives; their views are not those of the public at large.'

  22:
    answer: A
    steps:
      - 'This is the executive class of the civil service.'
      - 'The civil service has four classes: the administrative, the executive, the professional or technical, and the clerical. The executive class carries out and oversees the day-to-day implementation of government decisions and policies.'
      - 'The administrative class advises ministers and helps formulate policy; the executive class turns it into action and supervises the clerical class.'
      - 'Nigerian link: in a federal ministry, the Permanent Secretary heads the administrative class, while executive officers see to it that approved programmes are carried out.'
      - 'Remember: the executive class executes, meaning it carries out.'
      - 'The trap is D, administrative. The administrative class is mainly concerned with advising on and formulating policy, not overseeing its daily execution.'
    hint: 'Which class''s very name means carrying out?'
    why:
      B: 'The clerical class does routine work such as keeping records and files.'
      C: 'The technical, or professional, class gives specialist services, as engineers and doctors do.'
      D: 'The administrative class advises ministers and formulates policy; daily implementation is the executive class''s work.'

  23:
    answer: C
    steps:
      - 'This is the Ogboni of the Oyo empire.'
      - 'The Ogboni was a powerful secret society of elders and nobles. It was responsible for religious and ritual rites, especially the worship of the earth.'
      - 'Because it held this sacred role, the Ogboni also checked the Oyomesi and mediated between them and the Alaafin.'
      - 'Nigerian link: the Oyo empire, with its capital at Oyo-Ile, was the largest pre-colonial Yoruba state; the Ogboni society still exists in Yoruba land today.'
      - 'Remember: Ogboni for the gods and the earth; Oyomesi for choosing the king; Aare Ona Kakanfo for war.'
      - 'The trap is D, the Oyomesi. The Oyomesi were the seven king-makers who chose and checked the Alaafin; ritual rites were the Ogboni''s duty.'
    hint: 'Which Oyo body was a sacred society of the earth?'
    why:
      A: 'The Aare Ona Kakanfo was the commander of the army.'
      B: 'The Oba, the Alaafin in Oyo, was the king and political head.'
      D: 'The Oyomesi were the seven king-makers who chose and checked the Alaafin.'

  24:
    answer: C
    steps:
      - 'This is the Madawaki of the emirate system.'
      - 'In the Hausa-Fulani emirates the Emir ruled with a council of officials. The Madawaki was the commander of the army.'
      - 'Each official had a fixed duty: the Waziri was the chief adviser, the Galadima administered the capital, the Madawaki led the army and the Alkali judged cases under Islamic law.'
      - 'Nigerian link: the title Madawaki is still held in emirates such as Kano and Zaria today.'
      - 'Remember: Madawaki leads the war, Alkali settles the law.'
      - 'The trap is D, Alkali. The Alkali was the Islamic judge, not a military leader.'
    hint: 'Which emirate officer led the soldiers?'
    why:
      A: 'The Hakimi were district heads who collected taxes and ran the districts.'
      B: 'The Sarkin Fada was the head of palace officials and the palace workers.'
      D: 'The Alkali was the judge who applied Islamic (sharia) law.'

  25:
    answer: A
    steps:
      - 'This is indirect rule in Northern Nigeria.'
      - 'Indirect rule was the British system of governing through the existing traditional rulers and institutions. Lord Lugard introduced it in the North.'
      - 'The emirates already had an organised structure: an Emir with strong authority, officials with fixed duties, a system of taxation and Alkali courts. The British simply ruled through it.'
      - 'Nigerian link: in the East, many Igbo communities had no such central ruler, so the British appointed warrant chiefs, and the system met resistance, as in the Aba Women''s Riot of 1929.'
      - 'Remember: indirect rule works where the structure is already built.'
      - 'The trap is C, little resistance. The emirates did resist, as at Kano and Sokoto in 1903; the success came from the structure, not from a lack of resistance.'
    hint: 'What did the emirates already have that indirect rule could use?'
    why:
      B: 'Protecting farmland was not the basis of indirect rule; it relied on existing rulers.'
      C: 'The emirates did resist British conquest, as at Kano and Sokoto in 1903.'
      D: 'The people were not asked how they wished to be governed; indirect rule was a British choice.'

  26:
    answer: D
    steps:
      - 'This is early Nigerian nationalism.'
      - 'The earliest nationalist activities, demands for self-rule and protests against colonial policies, were led by the educated elite.'
      - 'Western education gave them knowledge of rights and self-government, newspapers to spread their views and contact with nationalists abroad.'
      - 'Nigerian link: Herbert Macaulay, often called the father of Nigerian nationalism, founded the Nigerian National Democratic Party in 1923, and wrote in his newspaper, the Lagos Daily News.'
      - 'Remember: the pen came before the party.'
      - 'The trap is C, political parties. Parties came later, and they were formed by the educated elite themselves.'
    hint: 'Who had the education and newspapers to challenge colonial rule first?'
    why:
      A: 'Trade unions joined the struggle later, as in the general strike of 1945.'
      B: 'Many traditional rulers worked within colonial rule, especially under indirect rule.'
      C: 'Political parties came later and were founded by the educated elite.'

  27:
    answer: D
    steps:
      - 'This is the National Congress of British West Africa.'
      - 'The National Congress of British West Africa was founded in Accra in 1920 by J. E. Casely Hayford. It brought together nationalists from Nigeria, the Gold Coast, Sierra Leone and the Gambia.'
      - 'It was the first nationalist movement that spoke for all of British West Africa, demanding elected seats in the legislative councils and more Africans in government.'
      - 'Nigerian link: its demand for elected members is linked to the Clifford Constitution of 1922, which introduced the elective principle in Nigeria.'
      - 'Remember: the first to unite West Africa was the Congress.'
      - 'The trap is C, the Aborigines'' Rights Protection Society. It was founded in 1897, but only in the Gold Coast, to fight a land law; it was not a West African movement.'
    hint: 'Which movement drew members from all four British West African colonies?'
    why:
      A: 'The West African Students'' Union was founded later, in London in 1925.'
      B: 'The Nigerian Youth Movement was a Nigerian body of the 1930s, formed after the Congress.'
      C: 'The Aborigines'' Rights Protection Society worked only in the Gold Coast, against land laws.'

  28:
    answer: D
    steps:
      - 'This is the prime minister in Nigeria''s First Republic, 1960 to 1966.'
      - 'The First Republic used the parliamentary system. The prime minister was the head of government and also a member of parliament, a lawmaker.'
      - 'In the parliamentary system the head of government must be a member of the legislature, so the prime minister held both roles. The head of state was a separate, ceremonial office.'
      - 'Nigerian link: Sir Abubakar Tafawa Balewa was Prime Minister and a member of the House of Representatives; the head of state was the Governor-General and, from 1963, President Nnamdi Azikiwe.'
      - 'Remember: prime minister means head of government with a seat in parliament.'
      - 'The trap is C, head of state and party leader. Balewa was not head of state, and the leader of his party, the Northern People''s Congress, was Sir Ahmadu Bello.'
    hint: 'In a parliamentary system, where must the head of government sit?'
    why:
      A: 'The head of state was the Governor-General and later the President, not the prime minister.'
      B: 'The prime minister was not the party leader; Sir Ahmadu Bello led the Northern People''s Congress.'
      C: 'The prime minister was neither head of state nor leader of his party.'

  29:
    answer: A
    steps:
      - 'This is the statutory allocation of revenue to local government councils under the 1979 Constitution.'
      - 'Section 7(6) of the 1979 Constitution shared this duty. The National Assembly provided for allocation to councils from the Federation Account, and the House of Assembly of each state provided for allocation to councils within the state.'
      - 'The state House of Assembly is the legislature closest to the councils in its state, so it made the law sharing state revenue among them.'
      - 'Nigerian link: the 1999 Constitution keeps the same rule in section 7(6), so each State House of Assembly still makes this provision.'
      - 'Remember: within a state, the state''s own Assembly shares the money.'
      - 'The trap is C, the Federal Legislature. It provides for allocations from the Federation Account, not for allocation within a state.'
    hint: 'Which legislature makes laws for the councils within one state?'
    why:
      B: 'The National Economic Council advises on economic planning; it does not provide for statutory allocations.'
      C: 'The Federal Legislature, the National Assembly, provides for allocation from the Federation Account, not within a state.'
      D: 'The Council of State is an advisory body, not a legislature, so it cannot provide for allocations.'

  30:
    answer: B
    steps:
