format_version: 1
exam_year: 2014
subject: GOV
explanations:
  2:
    answer: D
    steps:
      - 'This is about the state, a political community that has the power to make and enforce laws over everyone in it.'
      - 'Every state needs four things: a definite territory, a population, sovereignty and a government.'
      - 'Without land there is nowhere to rule, without people there is no one to rule, without government no one rules, and without sovereignty the state answers to another power.'
      - 'Nigeria shows all four: its land between Benin, Niger, Chad and Cameroon, its people, its government in Abuja, and its sovereignty since the first of October, 1960.'
      - 'Remember TPSG: Territory, Population, Sovereignty, Government.'
      - 'The trap is B. Resources help a state grow rich, but a poor state is still a state, so resources are not a necessary attribute.'
    hint: 'Which four things would a state stop being a state without?'
    why:
      A: 'Police, army and custom are tools or features of a society; a state needs territory and government, which this list leaves out.'
      B: 'Resources make a state richer, but they are not needed for a state to exist; definite territory is.'
      C: 'Police, army and immigration are agencies of government, not attributes of the state itself.'

  3:
    answer: D
    steps:
      - 'This is political participation.'
      - 'Political participation is the process by which citizens take part in political and public affairs: voting, joining a party, attending rallies, contesting elections or writing to their representatives.'
      - 'People take part because decisions made by government affect their lives, so taking part lets them shape those decisions.'
      - 'In Nigeria, registering with INEC for a voter''s card and voting in a general election are acts of political participation.'
      - 'Remember: participation means taking part.'
      - 'The trap is A. Political socialization is how a person learns political values and attitudes from family, school and media; it is learning, not taking part.'
    hint: 'Which word itself means taking part?'
    why:
      A: 'Political socialization is the learning of political values and beliefs, not taking part in affairs.'
      B: 'Recognition is the acceptance of a state or government by others; it is not a process citizens take part in.'
      C: 'Political culture is the set of shared political beliefs and attitudes of a people, not the act of taking part.'

  4:
    answer: D
    steps:
      - 'This compares a society with a state.'
      - 'A society is a group of people living together and sharing common interests and ways of life. Membership of a society, such as a club, a church or a town union, is voluntary.'
      - 'A state is different. Everyone living in its territory is bound by its laws, so membership of a state is compulsory.'
      - 'In Nigeria, you may choose whether to join the Red Cross or an old students'' association, but you cannot choose to stand outside Nigerian law while living in Nigeria.'
      - 'Remember: society, you choose; state, you obey.'
      - 'The trap is C. Mandatory membership belongs to the state, not to a society.'
    hint: 'Can a person choose whether to belong to a club or association?'
    why:
      A: 'Membership of a society does not come from a constitution; it comes from the person''s own choice.'
      B: 'Conventional means based on custom or habit, which does not describe how people join a society.'
      C: 'Membership is mandatory in the state, whose laws bind everyone, not in a society.'

  5:
    answer: D
    steps:
      - 'This is political sovereignty.'
      - 'Legal sovereignty is the power to make laws, held by the legislature. Political sovereignty is the power behind it, the power that chooses the lawmakers and can remove them.'
      - 'In a democracy, the voters elect the legislature and the executive and can vote them out, so the electorate is the political sovereign.'
      - 'In Nigeria, the electorate elects the President, the members of the National Assembly, the governors and the members of the state Houses of Assembly.'
      - 'Remember: the legislature makes the laws, but the voters make the legislature.'
      - 'The trap is A. The legislature is the legal sovereign, not the political one.'
    hint: 'Who chooses the lawmakers in a democracy?'
    why:
      A: 'The legislature holds legal sovereignty, the power to make laws; it answers to the voters.'
      B: 'A constitution is a body of rules, not a group of people who hold power.'
      C: 'Political parties compete for power, but it is the voters who decide which party wins.'

  6:
    answer: D
    steps:
      - 'This is monarchy, government headed by a king, queen or other royal ruler.'
      - 'In a monarchy the throne passes by heredity, from one member of the royal family to the next, usually on the ruler''s death.'
      - 'Because the office is inherited, the ruler is not elected and usually rules for life.'
      - 'Nigeria''s traditional rulers, such as the Alaafin of Oyo and the Emir of Kano, come from royal families, though Nigeria itself is a republic.'
      - 'Remember: monarch means one ruler, and the crown runs in the family.'
      - 'The trap is A. A fixed tenure belongs to an elected president; a monarch usually reigns for life.'
    hint: 'How does a new king come to the throne?'
    why:
      A: 'A monarch usually reigns for life; a fixed term of office belongs to elected rulers.'
      B: 'Separation of powers is a principle of democratic government, and it is never absolute even there.'
      C: 'Elected executives belong to republics; in a monarchy the head of state inherits the office.'

  7:
    answer: A
    steps:
      - 'This is a bicameral legislature, a legislature with two chambers or houses.'
      - 'A bill must pass both houses before it becomes law, so each house checks the work of the other.'
      - 'This makes it hard for one group to rush a bill through or manipulate it, and it prevents hasty legislation.'
      - 'Nigeria''s National Assembly is bicameral: the Senate with 109 members and the House of Representatives with 360.'
      - 'Remember: two houses, two looks at every bill.'
      - 'The trap is B. Quick deliberation is an advantage of one chamber; two chambers slow things down.'
    hint: 'What does a second house do to a bill that the first house has passed?'
    why:
      B: 'Quick action in emergencies is an advantage of a single chamber; two chambers take longer.'
      C: 'Two chambers make the passage of bills harder, not easier, since both must agree.'
      D: 'Having two houses makes lawmaking more cumbersome, not less.'

  8:
    answer: B
    steps:
      - 'This is the Supreme Court, the highest court in Nigeria.'
      - 'The Supreme Court has the final word on what the constitution means. Its decisions bind every other court and there is no appeal from it.'
      - 'Because it stands at the top of the court system, cases on the constitution finally end there.'
      - 'Nigeria''s Supreme Court sits in Abuja and is headed by the Chief Justice of Nigeria, under the 1999 Constitution.'
      - 'Remember: supreme means highest, so its word is final.'
      - 'The trap is A. The Court of Appeal is just below the Supreme Court, so its decisions can still be appealed.'
    hint: 'Which court has no court above it?'
    why:
      A: 'The Court of Appeal is below the Supreme Court, and appeals go from it to the Supreme Court.'
      C: 'A Magistrate Court is a lower court that handles minor cases.'
      D: 'A High Court can interpret the constitution, but its decisions can be appealed, so its power is not final.'

  9:
    answer: A
    steps:
      - 'This is the unitary system, in which all power is held by one central government.'
      - 'The central government may hand some work to local units, but it can take it back, since they draw their power from it.'
      - 'It works best where the country is small and its people share one language and culture, because there are no strong local differences to protect.'
      - 'Britain and France are unitary. Nigeria, being large and diverse, chose federalism under the 1954 Lyttleton Constitution and still has it under the 1999 Constitution.'
      - 'Remember: one small, similar people, one central government.'
      - 'The trap is D. A strong economy helps any state, but it does not decide whether a unitary system suits it.'
    hint: 'When would one central government easily meet everyone''s needs?'
    why:
      B: 'Being sparsely populated says nothing about whether the people are alike; a thinly peopled country can still be large and diverse.'
      C: 'A strong army is not a condition that makes a unitary system suitable.'
      D: 'A robust economy can exist under any system; size and similarity of people decide the choice.'

  10:
    answer: C
    steps:
      - 'This is constitutional monarchy, where a king or queen reigns under a written or customary constitution.'
      - 'The monarch is head of state by inheritance, but rules within limits set by the constitution and shares power with a parliament.'
      - 'Morocco is ruled by a king, Mohammed the Sixth, under a constitution, with an elected parliament and a prime minister.'
      - 'Nigeria is not a monarchy. Its traditional rulers, such as the Oba of Benin, hold royal titles, but the country is a republic with an elected President.'
      - 'Remember: Morocco has a king and a constitution.'
      - 'The trap is D. Italy once had a king, but it became a republic by referendum in 1946.'
    hint: 'Which of these four countries has a king today?'
    why:
      A: 'Libya''s monarchy ended with the 1969 coup; it has had no king since.'
      B: 'Uganda is a republic headed by an elected president; its traditional kingdoms do not rule the country.'
      D: 'Italy became a republic in 1946, so it has a president, not a monarch.'

  11:
    answer: A
    steps:
      - 'This is Marxism, the teaching of Karl Marx and Friedrich Engels.'
      - 'Marxism holds that history is a struggle between classes, the owners of the means of production and the workers.'
      - 'It teaches that the workers will overthrow capitalism, pass through socialism and reach communism, a classless society with no exploitation.'
      - 'In Nigeria, some labour leaders and student unions have used Marxist ideas in their calls for a fairer share of national wealth.'
      - 'Remember: Marx wanted no classes.'
      - 'The trap is C. Feudalism is a class society of lords and serfs, the very opposite of classless.'
    hint: 'Whose ideas speak of class struggle ending in communism?'
    why:
      B: 'Conservatism wants to keep existing institutions and order, not abolish classes.'
      C: 'Feudalism is built on classes of lords and serfs.'
      D: 'Liberalism stresses individual freedom and private property, and accepts differences of wealth.'

  12:
    answer: B
    steps:
      - 'This is a flexible constitution.'
      - 'A flexible constitution is one that can be amended easily, by the ordinary law-making process, with no special procedure.'
      - 'Because no special majority or referendum is needed, it can change quickly with the times.'
      - 'Nigeria''s 1999 Constitution is rigid: section 9 needs a two-thirds vote in each house of the National Assembly and approval by two-thirds of the state Houses of Assembly. Britain''s constitution is the classic flexible one.'
      - 'Remember: flexible bends easily.'
      - 'The trap is A. Who writes a constitution does not make it flexible; how it is amended does.'
    hint: 'What makes a constitution flexible or rigid?'
    why:
      A: 'Being written by parliament says who wrote it, not how easily it can be changed.'
      C: 'Popularity with legislators has nothing to do with the amendment procedure.'
      D: 'A constitution known to all citizens may be rigid or flexible; that describes awareness, not ease of change.'

  13:
    answer: D
    steps:
      - 'This is checks and balances, where each arm of government can limit the others.'
      - 'Judicial review is the power of the courts to declare a law or an executive act void if it goes against the constitution.'
      - 'Through it the judiciary checks the legislature and the executive, so no arm can act beyond its powers.'
      - 'In Nigeria, the Supreme Court can strike down an Act of the National Assembly that conflicts with the 1999 Constitution.'
      - 'Remember: review means the court looks again at what the others did.'
      - 'The trap is A. A code of conduct sets rules for public officers, but it is not one arm of government checking another.'
    hint: 'Which option shows one arm of government limiting another?'
    why:
      A: 'A code of conduct sets standards for public officers; it is not a check by one arm on another.'
      B: 'Judicial precedent means courts follow earlier decisions; it binds courts, not the other arms.'
      C: 'Judicial immunity protects judges from being sued; it does not check the other arms.'

  14:
    answer: D
    steps:
      - 'These are edicts.'
      - 'Under military rule, laws made by the federal military government were called decrees, and laws made by a state military governor were called edicts.'
      - 'The legislatures were suspended, so the military government made laws itself, and the state''s laws took the name edicts.'
      - 'In Nigeria, state military administrators issued edicts, while the Supreme Military Council and later the Armed Forces Ruling Council issued decrees.'
      - 'Remember: federal decree, state edict.'
      - 'The trap is B. Decrees were made at the federal level, not by the states.'
    hint: 'Decree is the federal military law. What was the state one called?'
    why:
      A: 'Acts are laws passed by an elected legislature such as the National Assembly.'
      B: 'Decrees were laws made by the federal military government.'
      C: 'Bye-laws are made by local government councils.'

  15:
    answer: A
    steps:
      - 'This is citizenship by naturalization.'
      - 'Naturalization is the process by which an alien, a foreigner, applies for and is granted citizenship after living in the country for a set time and meeting its conditions.'
      - 'The alien must usually show good character, a period of residence and intent to live there, then swear an oath of allegiance.'
      - 'Under section 27 of Nigeria''s 1999 Constitution, a foreigner may be naturalized after living in Nigeria for fifteen years, among other conditions.'
      - 'Remember: naturalization makes a foreigner a native in law.'
      - 'The trap is B. Registration is open to people with a link to the country, such as a foreign woman married to a citizen; naturalization is the general route for aliens.'
    hint: 'Which process is meant for a foreigner with no Nigerian parent?'
    why:
      B: 'Registration is for people with a special link, such as a foreign wife of a citizen; naturalization is the general way for aliens.'
      C: 'Citizenship by birth comes from being born to citizens, not something an alien acquires later.'
      D: 'Conferment is honorary citizenship given to a person as a favour, not the normal way an alien acquires it.'

  16:
    answer: D
    steps:
      - 'This is the returning officer.'
      - 'The returning officer collates the results from all the polling units in a constituency and declares the winner.'
      - 'The presiding officer runs one polling unit on election day and counts its votes, then the results are added up level by level until the returning officer announces the final result.'
      - 'In Nigeria, INEC appoints returning officers. For the presidential election, the Chairman of INEC is the returning officer.'
      - 'Remember: the returning officer returns the winner.'
      - 'The trap is C. The presiding officer only runs a single polling unit and does not declare the final result.'
    hint: 'Which officer declares who has been returned as winner?'
    why:
      A: 'An electoral officer runs INEC''s office in a local government area; the declaration is made by the returning officer.'
      B: 'There is no regular electoral post called a ballot officer that declares results.'
      C: 'A presiding officer runs one polling unit and counts its votes, but does not declare the final result.'

  17:
    answer: C
    steps:
      - 'This is the aim of a political party.'
      - 'A political party is an organised group of people with similar ideas who seek to win and use the power of government.'
      - 'Everything a party does, picking candidates, campaigning and making policies, serves this one end, because only in power can it carry out its programme.'
      - 'In Nigeria, parties registered by INEC field candidates for the presidency, governorships and the legislatures in order to win power.'
      - 'Remember: a party wants power; a pressure group wants influence.'
      - 'The trap is A. Making and carrying out policies comes after a party gains power, so it is not the ultimate aim.'
    hint: 'What must a party first gain before it can carry out any policy?'
    why:
      A: 'Formulating and implementing policies is only possible once power is won.'
      B: 'Carrying out people-oriented programmes is a promise, which needs power first.'
      D: 'Raising political awareness is a function of a party, not its final aim.'

  18:
    answer: C
    steps:
      - 'This is a pressure group, an organised group that tries to influence government policy without seeking to form the government.'
      - 'Its main objective is to influence legislation and policies so that its members benefit.'
      - 'It does this by lobbying, petitions, press campaigns, strikes and protests.'
      - 'In Nigeria, the Nigeria Labour Congress, the Nigerian Bar Association and ASUU, the Academic Staff Union of Universities, press the government on matters that affect their members.'
      - 'Remember: pressure groups press, parties contest.'
      - 'The trap is A. Opposition to the government is the work of opposition parties; a pressure group may support or oppose a policy.'
    hint: 'Whose interests does a pressure group mainly fight for?'
    why:
      A: 'Opposing the government is the role of opposition parties; pressure groups only seek to influence policy.'
      B: 'Pressure groups seek their members'' interests, not those of political parties.'
      D: 'Protecting the country against foreigners is the work of the state, not the aim of pressure groups.'

  19:
    answer: B
    steps:
      - 'This is public opinion and its dimensions, the ways an opinion can be described.'
      - 'The main dimensions are substance, which is what the opinion is about, orientation or direction, which is whether people are for or against, and intensity, which is how strongly they feel.'
      - 'Polling is different. It is a method of measuring public opinion by asking a sample of people questions.'
      - 'In Nigeria, polling firms survey voters before elections to measure their opinions; the opinions themselves have substance, direction and intensity.'
      - 'Remember: dimensions describe opinion, polls measure it.'
      - 'The trap is D. Intensity sounds like a measurement, but it is a dimension, the strength of feeling.'
    hint: 'Which option is a tool for finding out opinion rather than a part of it?'
    why:
      A: 'Substance, the matter the opinion is about, is a dimension of public opinion.'
      C: 'Orientation, whether people are for or against, is a dimension of public opinion.'
      D: 'Intensity, how strongly people hold an opinion, is a dimension of public opinion.'

  20:
    answer: D
    steps:
      - 'This is the Civil Service Commission.'
      - 'It is the body charged with appointing, promoting, disciplining and dismissing civil servants.'
      - 'It is made independent so that these decisions are based on merit and not on political pressure.'
      - 'In Nigeria, the Federal Civil Service Commission is set up under the 1999 Constitution, and each state has its own State Civil Service Commission.'
      - 'Remember: the commission hires and fires.'
      - 'The trap is B. A ministry of establishment deals with posts and conditions of service, but it does not hire and discipline officers.'
    hint: 'Which body is set up to keep hiring and firing free from politics?'
    why:
      A: 'The Ministry of Labour and Productivity deals with labour relations and employment generally, not the careers of civil servants.'
      B: 'An establishment office handles posts and conditions of service, but appointment and discipline belong to the commission.'
      C: 'The Bureau of Public Service Reforms studies and drives reform of the service; it does not hire or fire.'

  21:
    answer: C
    steps:
      - 'This is the Madawaki, an official of the pre-colonial Hausa-Fulani emirate.'
      - 'The Madawaki was the commander of the emir''s army, so his role matches that of a Minister of Defence today.'
      - 'Each emir ruled through a council of titled officials, each in charge of one area of state affairs.'
      - 'Others in the Hausa system include the Waziri, the chief adviser, the Galadima, who looked after the capital, and the Ma''aji, the treasurer.'
      - 'Remember: Madawaki marches with the army.'
      - 'The trap is D. Internal affairs and the capital fell to other officials such as the Galadima.'
    hint: 'Which Hausa official commanded the army?'
    why:
      A: 'The Madawaki was not in charge of public works; he led the army.'
      B: 'Education in the emirates was in the hands of Islamic scholars, not the Madawaki.'
      D: 'Internal and city affairs fell to officials such as the Galadima, not the army commander.'

  22:
    answer: B
    steps:
      - 'These are the Ajele, officials of the Old Oyo Empire.'
      - 'The Ajele were the Alaafin''s representatives posted to the towns and districts under Oyo''s rule.'
      - 'They watched over the local rulers, made sure the districts were governed well and loyally, and collected tribute for the Alaafin.'
      - 'In Oyo, the army was headed by the Are-Ona-Kakanfo, while the Oyomesi were the council of kingmakers led by the Bashorun.'
      - 'Remember: the Ajele were the Alaafin''s eyes in the districts.'
      - 'The trap is D. The head of the Oyo army was the Are-Ona-Kakanfo, not the Ajele.'
    hint: 'What did the Alaafin need in towns far from the capital?'
    why:
      A: 'The Ajele supervised the rule of the subject towns; guarding trade routes was not their duty.'
      C: 'Mobilising the army was the work of the military chiefs, not the Ajele.'
      D: 'The head of the army was the Are-Ona-Kakanfo.'

  23:
    answer: C
    steps:
      - 'This is the General Strike of 1945, a major event in Nigerian nationalism.'
      - 'Prices rose sharply during the Second World War while wages stayed low. Workers demanded a 50 per cent rise in their cost of living allowance, called COLA.'
      - 'The colonial government rejected the demand, so in June 1945 workers across the country went on strike, led by Michael Imoudu.'
      - 'The strike showed that Nigerian workers could act together, and it boosted the nationalist movement against colonial rule.'
      - 'Remember: 1945, 50 per cent, COLA.'
      - 'The trap is D. Discriminatory laws angered Nigerians, but the strike was set off by the refused allowance.'
    hint: 'What did the workers ask for that the government refused?'
    why:
      A: 'Unequal employment rules were a grievance, but they did not cause the 1945 strike.'
      B: 'Trade laws affected traders, not the government workers who struck.'
      D: 'Discriminatory laws were a general grievance; the strike was set off by the rejected allowance demand.'

  24:
    answer: C
    steps:
      - 'These are provinces, the units of colonial Nigeria before 1946.'
      - 'In 1914 Lord Lugard joined the Northern and Southern Protectorates. The country was run as provinces under Residents.'
      - 'In 1939 the Southern Provinces were split into Eastern and Western Provinces, so there were three groups of provinces.'
      - 'The Richards Constitution of 1946 turned these into the Northern, Eastern and Western Regions. States came only in 1967.'
      - 'Remember the order: provinces, then regions, then states.'
      - 'The trap is A. Regions came with the Richards Constitution of 1946, after this period.'
    hint: 'Regions began in 1946. What came before them?'
    why:
      A: 'Regions were created by the Richards Constitution of 1946.'
      B: 'Districts were smaller units inside provinces, not the main component units.'
      D: 'States were first created in 1967.'

  25:
    answer: B
    steps:
      - 'This is the beginning of nationalist agitation in Nigeria.'
      - 'In 1908 the colonial government imposed a water rate on Lagos residents to pay for a new water supply.'
      - 'Lagos people protested, arguing that they should not be taxed without being represented. This was among the earliest organised protests against colonial rule.'
      - 'The People''s Union was formed in Lagos in 1908 to lead the protest, and Herbert Macaulay was among its leading voices.'
      - 'Remember: 1908, water in Lagos, the first wave of protest.'
      - 'The trap is A. The youth leagues and movements came in the 1930s, long after 1908.'
    hint: 'Which event in the options came first?'
    why:
      A: 'The West African Youth League was formed in the 1930s, decades after the 1908 protest.'
      C: 'Indirect rule was a British method of administration, not an act of nationalist agitation.'
      D: 'The annexation of Lagos in 1861 was a British act, not a nationalist protest.'

  26:
    answer: D
    steps:
      - 'This is nationalism, the struggle of a colonised people for self-rule and independence.'
      - 'African nationalism grew from the ills of colonialism: racial discrimination, exclusion from top posts, economic exploitation and forced labour.'
      - 'Educated Africans who suffered these wrongs led the call to end colonial rule.'
      - 'In Nigeria, Herbert Macaulay, Nnamdi Azikiwe and Obafemi Awolowo led the push that ended in independence on the first of October, 1960.'
      - 'Remember: colonial rule caused the cure, which was nationalism.'
      - 'The trap is A. Imperialism is the wider policy of building an empire; it was the rule of colonies that Nigerians suffered and rose against.'
    hint: 'What form of foreign rule did Nigerians live under from day to day?'
    why:
      A: 'Imperialism is the broad policy of extending power abroad; the direct wrongs nationalists fought came from colonial rule.'
      B: 'Independence was the goal of nationalism, not its cause.'
      C: 'Slavery had been abolished long before the nationalist movements arose.'

  27:
    answer: A
    steps:
      - 'This is Herbert Macaulay, often called the father of Nigerian nationalism.'
      - 'In 1923 he founded the Nigerian National Democratic Party, the NNDP, Nigeria''s first political party.'
      - 'The party was formed to contest the elective seats in Lagos created by the Clifford Constitution of 1922.'
      - 'The NNDP won the Lagos seats in the Legislative Council in 1923 and in later elections.'
      - 'Remember: Clifford gave seats, Macaulay formed the party to win them.'
      - 'The trap is D. Nnamdi Azikiwe co-founded the NCNC with Macaulay in 1944, but that was later.'
    hint: 'Which party did the 1922 elective seats in Lagos bring about, and who led it?'
    why:
      B: 'Abubakar Tafawa Balewa was a leader of the Northern People''s Congress and became Prime Minister in 1957.'
      C: 'Ahmadu Bello led the Northern People''s Congress, formed in 1949, long after 1923.'
      D: 'Nnamdi Azikiwe helped found the NCNC in 1944, more than twenty years after the NNDP.'

  28:
    answer: D
    steps:
      - 'This is the sharing of powers in a federation into three lists.'
      - 'The exclusive list holds matters only the centre can handle, such as defence. The concurrent list holds matters both levels share. Residual matters, those on neither list, belong to the regions.'
      - 'The Lyttleton Constitution of 1954 made Nigeria a federation, and it was the first to divide powers in this way.'
      - 'The Independence Constitution of 1960 and the 1963 Constitution kept the lists. The 1979 and 1999 Constitutions shared powers with states instead of regions.'
      - 'Remember: Lyttleton laid the lists.'
      - 'The trap is C. The Independence Constitution had the lists, but they began in 1954.'
    hint: 'Which constitution first made Nigeria federal?'
    why:
      A: 'The 1979 Constitution shared powers between the federal and state governments, as regions no longer existed.'
      B: 'The 1999 Constitution shares powers with states, not regions, and it came long after the lists began.'
      C: 'The Independence Constitution kept the lists it inherited from the 1954 Lyttleton Constitution.'

  29:
    answer: B
    steps:
      - 'This is the 1963 Republican Constitution.'
      - 'The Independence Constitution of 1960 kept the British Queen as head of state, represented by a Governor-General, and appeals went to the Privy Council in London.'
      - 'The 1963 Constitution made Nigeria a republic with a President as head of state and ended appeals to the Privy Council, so the Supreme Court became the highest court.'
      - 'It came into force on the first of October, 1963, and Nnamdi Azikiwe became the first President.'
      - 'Remember: 1960 freedom, 1963 republic.'
      - 'The trap is A. The 1979 Constitution came after military rule and brought the presidential system, not the change from the Independence Constitution.'
    hint: 'Which constitution came next after the one of 1960?'
    why:
      A: 'The 1979 Constitution replaced the parliamentary system after military rule; the 1963 Constitution came first.'
      C: 'The 1999 Constitution came decades later, after a long period of military rule.'
      D: 'The 1989 Constitution was drawn up for the Third Republic and never fully came into force.'

  30:
    answer: D
    steps:
      - 'This is the method of choosing the President under the 1963 Republican Constitution.'
      - 'The President was elected by both Houses of Parliament, the Senate and the House of Representatives, sitting together and voting by secret ballot, for a term of five years.'
      - 'This was an indirect election because the people elected Parliament, and Parliament elected the President, who was a ceremonial head of state.'
      - 'Nnamdi Azikiwe became the first President of Nigeria on the first of October, 1963, with Abubakar Tafawa Balewa remaining Prime Minister.'
      - 'Remember: 1963, Parliament chose the President.'
      - 'The trap is C. In 1960 Nigeria had no President; the Queen was head of state, represented by a Governor-General.'
    hint: 'When did Nigeria first have a President, and who chose him?'
    why:
      A: 'Under the 1979 Constitution the President was elected directly by the voters for four years.'
      B: 'The 1983 presidential election was also a direct popular vote under the 1979 Constitution.'
      C: 'In 1960 the head of state was the Queen, represented by a Governor-General appointed on the Prime Minister''s advice.'

  31:
    answer: B
    steps:
      - 'This is the Federal Character Commission.'
      - 'Federal character is the principle that public posts and resources should reflect the diversity of the country, so that no state or group dominates.'
      - 'The Commission works out and enforces a fair share of posts in the public service among the states.'
      - 'It was set up in 1996 and is now a federal executive body under the Third Schedule of the 1999 Constitution.'
      - 'Remember: federal character means every state gets its fair share.'
      - 'The trap is C. Reviewing unfair administrative decisions is the work of the Public Complaints Commission.'
    hint: 'What does federal character try to make fair?'
    why:
      A: 'Providing social services is the work of ministries and agencies, not the Commission.'
      C: 'Reviewing unfair administrative decisions is the duty of the Public Complaints Commission.'
      D: 'Settling disputes is the work of the courts.'

  32:
    answer: D
    steps:
      - 'This is the appointment of the chairman of INEC, the Independent National Electoral Commission.'
      - 'Under section 154 of the 1999 Constitution, the President appoints the chairman and members of INEC.'
      - 'The President first consults the Council of State, and the appointment must then be confirmed by the Senate.'
