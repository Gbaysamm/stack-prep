format_version: 1
exam_year: 2015
subject: GOV
explanations:
  1:
    answer: D
    steps:
      - 'This is about who controls the local government system in Nigeria.'
      - 'Section 7 of the 1999 Constitution guarantees democratically elected local government councils, and says each state must make a law for their structure, composition, finance and functions.'
      - 'Because the councils are set up under a state law, it is the State House of Assembly that fixes how long an elected chairman stays in office.'
      - 'This is why the tenure of council chairmen differs from state to state, and why their elections are run by each State Independent Electoral Commission, not by INEC.'
      - 'Remember: the state makes the law that makes the council.'
      - 'The trap is C, the National Assembly. It makes laws for the whole federation, but the 1999 Constitution leaves the make-up of local government councils to the states.'
    hint: 'Under the 1999 Constitution, whose law sets up the local government councils?'
    why:
      A: 'The Federal Executive Council is the President with the ministers; it runs federal policy and has no power over council tenure.'
      B: 'The National Union of Local Government Employees is a trade union of council workers; it speaks for staff but makes no laws.'
      C: 'The National Assembly legislates for the federation, but the Constitution gives the law on local government councils to the states.'

  2:
    answer: D
    steps:
      - 'This is the 1976 Local Government Reform.'
      - 'In 1976 the military government of General Olusegun Obasanjo issued the Guidelines for Local Government Reform, which set up a uniform, single-tier local government system across the country.'
      - 'For the first time, local government was recognised as the third tier of government, after the federal and state governments, with its own functions and a share of federal revenue.'
      - 'The 1979 Constitution then wrote this into law, and the 1999 Constitution keeps it, so your local government chairman heads the third tier.'
      - 'Remember: federal first, state second, local third.'
      - 'The trap is A, the second tier. That place belongs to the states; local government comes after them.'
    hint: 'Count the levels of government from the top: federal, state, then which?'
    why:
      A: 'The second tier is the state government; local government sits below it.'
      B: 'The first tier is the federal government at the centre.'
      C: 'Nigeria has only three tiers of government, so there is no fourth tier.'

  3:
    answer: B
    steps:
      - 'This is the traditional Igbo political system.'
      - 'The Igbo system was acephalous, which means it had no single ruler. Each village was run by its people through the council of elders and the village assembly.'
      - 'Authority came with age: the elders, led by the Okpara who held the Ofo staff, were respected for their experience, and the age grades shared out other work by seniority.'
      - 'This is why the Igbo system is often called a gerontocracy, and why age grades still organise community work in many towns in the South East today.'
      - 'Remember: in Igboland, grey hair carried the say.'
      - 'The trap is D, status. Title holders such as the Ozo were respected, but the main basis of decision making was age, not status.'
    hint: 'Who led the Igbo council of elders, and why were they trusted?'
    why:
      A: 'The Igbo system was democratic and open to all adult males; it did not rest on inherited privilege.'
      C: 'Women had their own groups, such as the Umuada, but decisions were not given out by gender.'
      D: 'Titles such as Ozo brought respect, but the main basis of decision making was the age and experience of the elders.'

  4:
    answer: D
    steps:
      - 'This is the Jamiyyar Mutanen Arewa, which means the Association of the People of the North.'
      - 'It was founded in 1949 as a cultural organisation of northern elites.'
      - 'In 1951 it turned itself into a political party, the Northern People''s Congress (NPC), to contest elections under the Macpherson Constitution.'
      - 'The NPC was led by Sir Ahmadu Bello, the Sardauna of Sokoto, and became the largest party of the First Republic; Sir Abubakar Tafawa Balewa became Prime Minister from its ranks.'
      - 'Remember: Arewa means North, and the North''s cultural club became the Northern People''s Congress.'
      - 'The trap is C, NEPU. The Northern Elements Progressive Union was formed in 1950 by radicals led by Aminu Kano, as a rival to the conservative northern movement.'
    hint: 'Arewa means North. Which party carried the North in its name?'
    why:
      A: 'The United Middle Belt Congress spoke for the minorities of the Middle Belt and grew out of Middle Belt groups.'
      B: 'The Borno Youth Movement was a small party of the Kanuri in Borno, formed in 1954.'
      C: 'NEPU was a radical party formed by Aminu Kano in opposition to the conservative northern elite.'

  5:
    answer: A
    steps:
      - 'This is about the effects of British colonial rule on Nigeria.'
      - 'Colonial rule organised Nigeria''s economy to serve Britain: Nigerians grew cash crops such as cocoa, groundnuts and palm produce for export and bought back manufactured goods.'
      - 'Because little industry was built at home, Nigeria came to depend on foreign markets, foreign prices and foreign goods. This is economic dependence.'
      - 'The pattern lasted after independence on the first of October 1960, when Nigeria still sold raw materials, first farm produce and then crude oil, and imported finished goods.'
      - 'Remember: raw out, finished in, so the colony depends.'
      - 'The trap is C. Under indirect rule the British kept the traditional state structures, such as the emirates, and ruled through them, so suppressing them was not the major result.'
    hint: 'Think of what Nigeria exported and what it imported under colonial rule.'
    why:
      B: 'A colony was ruled by Europe, so colonial rule could not give Nigeria equal status with Europe.'
      C: 'The British largely kept and used traditional structures through indirect rule; the lasting major effect was economic.'
      D: 'Colonial rule did not raise Nigeria''s image abroad; it made Nigeria a dependent territory.'

  6:
    answer: A
    steps:
      - 'This is judicial review, and judicial decisions as a source of a constitution.'
      - 'Judicial review is the power of the courts to interpret the constitution and to declare any law or act that goes against it null and void.'
      - 'Each time the courts interpret the constitution, their ruling becomes part of how the constitution is understood, so the constitution grows through court decisions.'
      - 'In Nigeria, the Supreme Court in the Lakanmi case of 1970 ruled on the limits of a military decree, and under the 1999 Constitution the courts settle disputes between the federal and state governments.'
      - 'Remember: the legislature writes the law, the judiciary reads it, and its reading shapes the constitution.'
      - 'The trap is D. Acts of parliament also develop a constitution, but they are made by the legislature, not the judiciary.'
    hint: 'Which power lets the courts decide what the constitution means?'
    why:
      B: 'Historical records are a source of a constitution, but they are kept by historians and archives, not made by the judiciary.'
      C: 'Bye-laws are made by local government councils, not by the courts.'
      D: 'Acts of parliament are the work of the legislature, not the judiciary.'

  7:
    answer: C
    steps:
      - 'The institution here is the upper house of a bicameral legislature, which in Nigeria is the Senate.'
      - 'Nigeria''s National Assembly has two houses: the Senate, with 109 members, three from each state and one from the FCT, and the House of Representatives, with 360 members.'
      - 'Most work is shared: a bill, including the appropriation bill, must pass both houses. But some powers belong to the Senate alone, chiefly confirming people the President appoints.'
      - 'Under section 147 of the 1999 Constitution, the President''s choice of ministers must be confirmed by the Senate, which screens each nominee before voting.'
      - 'Remember: the Senate screens the President''s team.'
      - 'The trap is D. The appropriation bill is vital, but it must pass both the Senate and the House of Representatives, so it is not the upper house''s alone.'
    hint: 'Which house screens the President''s nominees for minister?'
    why:
      A: 'Assent to a bill is given by the President, not by any house of the legislature.'
      B: 'Treaties are negotiated and signed by the executive; the legislature only makes them part of Nigerian law.'
      D: 'The appropriation bill must pass both houses of the National Assembly, so it is not a duty of the Senate alone.'

  8:
    answer: A
    steps:
      - 'This is the presidential election of the Third Republic.'
      - 'The election of 12 June 1993 was contested by the two parties the Babangida government had registered in 1989: the National Republican Convention (NRC) and the Social Democratic Party (SDP).'
      - 'The government created only two parties so that each would be national, not ethnic or regional. Bashir Tofa ran for the NRC and Chief M. K. O. Abiola for the SDP.'
      - 'The election was annulled on 23 June 1993, and the Third Republic never fully began. Today 12 June is Nigeria''s Democracy Day.'
      - 'Remember: 1993 had two parties, one a little to the right (NRC) and one a little to the left (SDP).'
      - 'The trap is B, AD and APP. Those parties belong to the Fourth Republic and contested in 1999.'
    hint: 'Which two parties did the military create for the Third Republic?'
    why:
      B: 'The AD and the APP were registered in 1998 and contested the 1999 elections of the Fourth Republic.'
      C: 'The UNCP was one of the five parties of the Abacha transition in the late 1990s, whose presidential election was never held, and no NDP contested in 1993.'
      D: 'The PRP was a Second Republic party of 1979, and no DPP contested in 1993.'

  9:
    answer: B
    steps:
      - 'This is communalism, a mode of production.'
      - 'Communalism is the system in which the land and resources of a community belong to all, and are pooled and used for the general well-being of everyone.'
      - 'It was the way of life in most pre-colonial African societies: people farmed, built and hunted together, and no one was left without land.'
      - 'In many Nigerian villages, family and community land still cannot be sold by one person, and people still join hands to clear a farm or build a house.'
      - 'Remember: communal means community; all share, all care.'
      - 'The trap is A, communism. It sounds alike, but communism is the classless, stateless society that Karl Marx said would come after socialism, in modern industrial nations.'
    hint: 'Which word comes from "community" and describes traditional African sharing?'
    why:
      A: 'Communism is Marx''s final, classless stage after socialism, not the traditional pooling of a village''s resources.'
      C: 'Socialism puts the main means of production in the hands of the state, which plans the economy.'
      D: 'Capitalism leaves resources in private hands, run for private profit.'

  10:
    answer: D
    steps:
      - 'This is about which body Nigeria helped to found.'
      - 'ECOWAS, the Economic Community of West African States, was founded on 28 May 1975 by the Treaty of Lagos, signed by fifteen West African states.'
      - 'Nigeria could only found bodies formed after her independence on the first of October 1960. The UN (1945), the modern Commonwealth (1949) and NATO (1949) were all older.'
      - 'General Yakubu Gowon of Nigeria and General Gnassingbe Eyadema of Togo led the move to form ECOWAS, and the treaty was signed in Lagos.'
      - 'Remember: ECOWAS was born in Lagos in 1975.'
      - 'The trap is A, the UNO. Nigeria is a full member, but she joined on 7 October 1960, fifteen years after the UN was founded.'
    hint: 'Which of these bodies was formed after Nigeria became independent?'
    why:
      A: 'The UN was founded in 1945; Nigeria joined it in 1960, after independence.'
      B: 'The Commonwealth existed before 1960; Nigeria joined it at independence.'
      C: 'NATO is a military alliance of North America and Europe, formed in 1949; Nigeria has never been a member.'

  11:
    answer: A
    steps:
      - 'This is ECOMOG, the peacekeeping force of ECOWAS.'
      - 'In August 1990 ECOWAS sent the ECOWAS Monitoring Group (ECOMOG) into Liberia to end the civil war there.'
      - 'Nigeria supplied most of the troops, money and commanders, because the war threatened the peace of the whole sub-region and the lives of Nigerians living there.'
      - 'This shows Africa as the centrepiece of Nigeria''s foreign policy in action; Nigeria also led ECOMOG in Sierra Leone later in the 1990s.'
      - 'Remember: Liberia, 1990, ECOMOG, Nigeria in front.'
      - 'The trap is B, Nigeria. A country cannot resolve a dispute in itself through ECOWAS; Nigeria was the one doing the resolving.'
    hint: 'Where did ECOMOG first go into action in 1990?'
    why:
      B: 'Nigeria was the main peacemaker, not the country whose dispute ECOWAS settled.'
      C: 'Nigeria''s major peace role in the 1990s was in Liberia and Sierra Leone, not the Gambia.'
      D: 'Senegal had no civil war that ECOWAS, led by Nigeria, had to resolve.'

  12:
    answer: C
    steps:
      - 'This is about the kinds of rights a citizen has.'
      - 'Civil rights, or civil liberties, are the freedoms a person enjoys in society: freedom of speech, of religion, of movement, of association and of peaceful assembly.'
      - 'Political rights are different: they let a citizen take part in government, such as the right to vote and to be voted for.'
      - 'Chapter IV of the 1999 Constitution protects the right to peaceful assembly and association in section 40, so citizens may meet, march or form a club peacefully.'
      - 'Remember: civil rights are about living freely; political rights are about choosing and being chosen.'
      - 'The trap is D, the right to vote. It is a right every adult citizen has, but it is a political right, not a civil one.'
    hint: 'Is voting about living freely, or about taking part in government?'
    why:
      A: 'The right to be voted for is a political right, the right to stand for election.'
      B: 'The right to property is grouped with economic rights, and justice is a duty of the state, not one freedom of the citizen.'
      D: 'The right to vote is a political right, the right to choose leaders.'

  13:
    answer: A
    steps:
      - 'This is a writ, a term used in the courts.'
      - 'A writ is a written order issued by a court, commanding a person to do something or to stop doing it.'
      - 'A restraining order is the plainest example: it commands a person to keep off, to hold back or to stop an act, under pain of contempt of court.'
      - 'Nigerian courts issue writs every day; a civil case begins with a writ of summons, and a person held unlawfully may be freed by a writ of habeas corpus.'
      - 'Remember: a writ is the court''s written order.'
      - 'The trap is B. Prohibition is one narrow writ that stops a lower court going beyond its powers; it is not what the word writ means in general.'
    hint: 'A writ is an order of the court. Which option is an order a court issues to restrain a person?'
    why:
      B: 'Prohibition is one particular writ sent to a lower court, not the general meaning of a writ.'
      C: 'Acquitting is a verdict that frees an accused person at the end of a trial, not a writ.'
      D: 'Sentencing is the punishment given after conviction, not a writ.'

  14:
    answer: C
    steps:
      - 'This is legislative control of public corporations.'
      - 'Public corporations are owned by the government but run by their own boards. The legislature controls them mainly through money.'
      - 'Each year their budgets come before the legislature for approval, and their accounts are examined by the Public Accounts Committee, so they must explain how public money is spent.'
      - 'In Nigeria, the National Assembly approves the budgets of federal corporations and may summon their heads to explain their spending.'
      - 'Remember: the legislature holds the purse, so it holds the corporation.'
      - 'The trap is A. Daily monitoring is the work of the board and management; the legislature checks them only from time to time.'
    hint: 'What power over money does the legislature hold every year?'
    why:
      A: 'The legislature does not watch corporations day to day; that is the job of their boards and the supervising ministry.'
      B: 'Discipline of staff is done by the management of the corporation.'
      D: 'Recruitment of staff is done by the corporation''s board and management.'

  15:
    answer: C
    steps:
      - 'This is Africa as the centrepiece of Nigeria''s foreign policy.'
      - 'Since independence in 1960, Nigeria has put Africa at the centre of her foreign policy, starting with her neighbours and West Africa.'
      - 'The reason is security: trouble in a neighbouring country, such as war, refugees or foreign bases, quickly spills into Nigeria. Peace around her protects her own home environment.'
      - 'Professor Ibrahim Gambari, Foreign Minister in 1984, described this as concentric circles: Nigeria''s own security first, then her neighbours, then West Africa, then Africa, then the world.'
      - 'Remember: keep your neighbour''s house safe and your own house is safe.'
      - 'The trap is D. Nigeria has stood up to major powers over issues like apartheid, but challenging them is not the reason for the policy.'
    hint: 'Why would a country care first about the countries around it?'
    why:
      A: 'Nigeria''s policy seeks peace and unity in Africa, not rivalry.'
      B: 'Nigeria seeks cooperation through bodies like ECOWAS, not control of other economies.'
      D: 'Nigeria has opposed major powers on some issues, but that is not why Africa is her centrepiece.'

  16:
    answer: C
    steps:
      - 'This is the elective principle, the right to choose members of the legislature by vote.'
      - 'The Clifford Constitution of 1922, named after Governor Sir Hugh Clifford, first allowed some members of the Legislative Council to be elected.'
      - 'It gave four elected seats, three for Lagos and one for Calabar. Voters had to be adult men earning at least one hundred pounds a year.'
      - 'This led to Nigeria''s first political party, the Nigerian National Democratic Party, formed by Herbert Macaulay in 1923 to contest those seats.'
      - 'Remember: Clifford came first, in 1922, so he brought the first elections.'
      - 'The trap is B, Richards. The Richards Constitution of 1946 kept the elected seats and added regional councils, but it did not introduce them.'
    hint: 'Which colonial constitution is the oldest of the four?'
    why:
      A: 'The Lyttleton Constitution of 1954 made Nigeria a federation; elections already existed.'
      B: 'The Richards Constitution of 1946 created regional houses, but elections began in 1922.'
      D: 'The Macpherson Constitution of 1951 widened elections, but did not start them.'

  17:
    answer: B
    steps:
      - 'This is a promotional pressure group, also called a cause group.'
      - 'A promotional group fights for a cause or for people other than its own members, such as human rights, the poor or the environment.'
      - 'Its members do not gain for themselves; they speak up for the underprivileged who have no strong voice of their own.'
      - 'In Nigeria, the Civil Liberties Organisation, formed in 1987, campaigns for the rights of detainees and the poor.'
      - 'Remember: promotional groups promote a cause, not their own pockets.'
      - 'The trap is C, economic interest groups. They also act for people, but for their own members'' economic gain, such as a trade union or a chamber of commerce.'
    hint: 'Which kind of pressure group works for others rather than for its own members?'
    why:
      A: 'Professional groups, such as the Nigerian Bar Association, protect the interests of their own members.'
      C: 'Economic groups, such as trade unions, work for their members'' pay and profit.'
      D: 'Educational groups work for the interests of teachers, students or schools.'

  18:
    answer: D
    steps:
      - 'This is the 1979 Constitution, which began the Second Republic.'
      - 'It came into force on the first of October 1979 and replaced the parliamentary system with the presidential system.'
      - 'Instead of a Prime Minister chosen from parliament and a ceremonial President, there was now one executive President, elected directly by the people for a fixed term.'
      - 'Alhaji Shehu Shagari became Nigeria''s first executive President, and the 1999 Constitution kept the presidential system.'
      - 'Remember: 1979 brought the American style President to Nigeria.'
      - 'The trap is B. Nineteen states were created in 1976 by a military decree, not by the 1979 Constitution.'
    hint: 'What changed about the head of government in 1979?'
    why:
      A: 'The constitution set limits on elected officials and checks on their power, rather than raising their power.'
      B: 'The nineteen states were created by decree in 1976, before the constitution.'
      C: 'It did make a member who crossed to another party lose his seat, but that was a minor rule beside the change to a presidential system.'

  19:
    answer: C
    steps:
      - 'This is an organ of the African Union.'
      - 'The Council of Ministers is made up of the foreign ministers of the member states. It meets before the Assembly of Heads of State and Government to prepare its agenda and decisions.'
      - 'The heads of state meet only for short summits, so their ministers do the groundwork first, and the summit then takes the final decisions.'
      - 'Nigeria''s Minister of Foreign Affairs sits on this council for Nigeria.'
      - 'Under the AU''s Constitutive Act this council is formally called the Executive Council. It was the Council of Ministers under the OAU, the AU''s forerunner until 2002.'
      - 'Remember: ministers prepare, heads of state decide.'
      - 'The trap is D. The Secretariat, now the AU Commission, runs the day to day work, but the ministers prepare the summit.'
    hint: 'Who meets just before the heads of state to get their meeting ready?'
    why:
      A: 'The Commission of Mediation, Conciliation and Arbitration settled disputes between OAU members.'
      B: 'The Pan-African Parliament gives Africans a voice in the AU; it does not prepare the summit.'
      D: 'The Secretariat, now the AU Commission, is the administrative office, not the body that prepares the summit.'

  20:
    answer: C
    steps:
      - 'This is fascism, the ideology of Benito Mussolini''s Italy from 1922.'
      - 'Fascism puts the state above the individual. The state is everything, and a person has only the rights the state chooses to give.'
      - 'So power is held tightly by one leader and one party, opposition is banned and the press is controlled.'
      - 'This is the opposite of Chapter IV of Nigeria''s 1999 Constitution, which states fundamental rights that the state must respect.'
      - 'Remember: in fascism, the state gives and the state takes.'
      - 'The trap is D. Sovereignty tied to landed property is a feature of feudalism, where the lord owns the land and the power.'
    hint: 'In fascism, which comes first, the person or the state?'
    why:
      A: 'Fascism centralizes all power in one leader and one party.'
      B: 'Fascism bans opposition parties and crushes dissent.'
      D: 'Linking sovereignty with landed property is a feature of feudalism.'

  21:
    answer: C
    steps:
      - 'This is the Civil Service Commission.'
      - 'The Civil Service Commission is set up by the constitution to appoint, promote and discipline civil servants.'
      - 'It does this so that civil servants are hired and moved up on merit and are protected from being punished for political reasons.'
      - 'The 1999 Constitution sets up the Federal Civil Service Commission, and each state has its own State Civil Service Commission.'
      - 'Remember: appoint, promote, discipline, the three jobs of the Civil Service Commission.'
      - 'The trap is A. The Federal Character Commission checks that posts are shared fairly among the states, but it does not promote or discipline staff.'
    hint: 'Which commission is named after the civil service itself?'
    why:
      A: 'The Federal Character Commission makes sure posts are spread fairly among states; it does not discipline civil servants.'
      B: 'The Ministry of Labour deals with work, wages and trade unions in the country as a whole.'
      D: 'The Public Complaints Commission, the Ombudsman, hears complaints from citizens against officials.'

  22:
    answer: D
    steps:
      - 'This is the unitary system of government.'
      - 'In a unitary state, all power is held by the central government. Any local units exist only because the centre created them.'
      - 'The centre can give power to the units and take it back at will, so its power over them is supreme, or absolute.'
      - 'Nigeria became unitary for a short time when General Aguiyi-Ironsi''s Unification Decree No. 34 of May 1966 abolished the regions. Britain and Ghana are unitary states.'
      - 'Remember: unitary means one centre holding all the power.'
      - 'The trap is B. Sharing power between the centre and the units is federalism, the system Nigeria uses today.'
    hint: 'In a unitary state, who can create and abolish the local units?'
    why:
      A: 'Limited power at the centre is a feature of a confederation.'
      B: 'Power shared between the centre and the units is a federal arrangement.'
      C: 'The centre in a unitary state holds the most power, not an insignificant share.'

  23:
    answer: D
    steps:
      - 'This is OPEC, the Organization of the Petroleum Exporting Countries.'
      - 'OPEC was founded in Baghdad in September 1960 by oil-exporting nations to coordinate their oil policies and secure fair, stable prices for their oil.'
      - 'Crude oil earns most of Nigeria''s foreign exchange and government revenue, so a body that protects oil prices serves her economic interest directly.'
      - 'Nigeria joined OPEC in 1971 and is still a member; a Nigerian has served as OPEC''s Secretary General.'
      - 'Remember: OPEC is about oil, and oil is about money.'
      - 'The trap is C, the AU. It does have economic aims, but it was formed mainly for African unity and political cooperation.'
    hint: 'Which body is about Nigeria''s main export?'
    why:
      A: 'Nigeria is in the UN mainly for world peace, security and her voice in world affairs.'
      B: 'The Commonwealth links former British territories by history and shared values, not mainly by economic interest.'
      C: 'The AU is mainly a political body for African unity, peace and cooperation.'

  24:
    answer: C
    steps:
      - 'This is military government.'
      - 'A military government takes power by force, suspends parts of the constitution and rules by decrees.'
      - 'Because there is no elected legislature and decrees can override the courts, civil liberties such as free speech, free assembly and freedom from detention without trial can be cut away.'
      - 'In Nigeria, military regimes ruled from 1966 to 1979 and 1983 to 1999, and decrees such as the State Security (Detention of Persons) Decree No. 2 of 1984 allowed detention without trial.'
      - 'Remember: guns in power, liberties in danger.'
      - 'The trap is A. A presidential government is a civilian, constitutional system that protects civil liberties.'
    hint: 'Which kind of government rules by decree instead of by an elected legislature?'
    why:
      A: 'A presidential government rules under a constitution that protects civil liberties.'
      B: 'A parliamentary government is answerable to an elected parliament and respects civil liberties.'
      D: 'A republican government has elected leaders and rule of law, which protect civil liberties.'

  25:
    answer: A
    steps:
      - 'This is the National Youth Service Corps (NYSC).'
      - 'The NYSC was set up by Decree No. 24 of 22 May 1973, under the military government of General Yakubu Gowon.'
      - 'After the civil war of 1967 to 1970, the government wanted to rebuild national unity, so young graduates were sent to serve for a year in states other than their own.'
      - 'Today every Nigerian graduate under thirty still serves a year as a corps member, and the scheme''s aim is to promote national unity and integration.'
      - 'Remember: NYSC came after the war, to build one Nigeria.'
      - 'The trap is B. MAMSER, set up in 1987, mobilised people for self-reliance and social justice, but the agency built to promote the national interest of unity was the NYSC.'
    hint: 'Which agency was set up after the civil war to bring young Nigerians from all parts together?'
    why:
      B: 'MAMSER was set up in 1987 to mobilise citizens for self-reliance, social justice and economic recovery, not mainly for national unity.'
      C: 'DFRRI was set up in 1986 to build rural roads, water and food supply.'
      D: 'The NDE was set up in 1986 to create jobs and train the unemployed.'

  26:
    answer: D
    steps:
      - 'This is OPEC, the Organization of the Petroleum Exporting Countries.'
      - 'OPEC exists to coordinate the oil policies of its members and keep oil prices stable and fair for them.'
      - 'Its main tool is to fix a total level of production and give each member a quota, because pumping less oil pushes prices up and pumping more pushes them down.'
      - 'Nigeria, a member since 1971, is given a production quota of barrels per day at OPEC meetings.'
      - 'Remember: OPEC turns the tap, and the tap sets the price.'
      - 'The trap is C. OPEC protects the income of its own oil-producing members, not of developing nations in general; many developing nations import oil and pay more when its price rises.'
    hint: 'How does OPEC control the price of oil?'
    why:
      A: 'OPEC was formed to give producing states control over oil, not to help multinational companies monopolize the market.'
      B: 'OPEC was formed to protect producing states against the multinational oil companies.'
      C: 'OPEC works for the oil income of its own members, not of all developing nations.'

  27:
    answer: D
    steps:
      - 'This is the Dikko affair of 1984.'
      - 'Alhaji Umaru Dikko, a minister in the Second Republic, fled to Britain after the coup of 31 December 1983. The Buhari regime wanted him back to face trial.'
      - 'On 5 July 1984 he was found drugged in a crate at Stansted Airport, about to be flown to Lagos. Britain treated it as an attempt to take him by force.'
      - 'Britain expelled Nigerian diplomats, Nigeria did the same, and both recalled their High Commissioners, so relations were strained for about two years.'
      - 'Remember: the crate at Stansted strained the ties.'
      - 'The trap is A. The atomic tests in the Sahara were carried out by France from 1960, and Nigeria broke relations with France over them in 1961, not with Britain.'
    hint: 'Which Nigerian politician in Britain caused a row in 1984?'
    why:
      A: 'The Sahara atomic tests were carried out by France from 1960, not by Britain.'
      B: 'Britain recognised the regime; the strain came from the Dikko affair.'
      C: 'Nigeria did not stop oil exports to Britain under the Buhari regime.'

  28:
    answer: D
    steps:
      - 'This compares the structure of two military regimes.'
      - 'The Babangida regime, from 27 August 1985, reorganised the top of the armed forces and created the post of Chairman, Joint Chiefs of Staff, which the Buhari regime did not have.'
      - 'To find a difference, rule out what both regimes shared: both had state military governors with commissioners, both had ministers, and both had a National Council of States that included the governors.'
      - 'The Babangida regime also renamed its ruling body the Armed Forces Ruling Council, and its head took the title of President.'
      - 'Remember: a difference must be something only one side had.'
      - 'The trap is A. Governors were assisted by commissioners under both regimes, so it is no difference.'
    hint: 'Strike out everything both regimes had. What is left?'
    why:
