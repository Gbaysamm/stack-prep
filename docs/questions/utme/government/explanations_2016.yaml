    answer: C
    steps:
      - 'This is the edict.'
      - 'An edict is a law made by a military governor for his state.'
      - 'Under military rule the legislatures were dissolved, so the military made laws by command: decrees at the federal level, edicts at the state level.'
      - 'Under military rule in Nigeria, each state''s military governor or administrator issued edicts. Today the state House of Assembly makes the state''s laws.'
      - 'Remember: decree from the centre, edict from the state.'
