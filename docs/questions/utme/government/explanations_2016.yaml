      - 'The Senate was led by Joseph Wayas, its President.'
      - 'In the presidential system of the 1979 Constitution, each house elected its own presiding officer, and the Senate chose Wayas.'
      - 'In the same years, Edwin Ume-Ezeoke was Speaker of the House of Representatives, and John Wash Pam was Deputy President of the Senate.'
      - 'Remember: Wayas led the way in the Senate.'
      - 'The trap is B, John Wash Pam. He was the Senate''s deputy, not its leader.'
    hint: 'Who presided over the Senate from 1979 to 1983?'
    why:
      B: 'John Wash Pam was Deputy President of the Senate.'
      C: 'J. S. Tarka was a senator, not the leader of the Senate.'
      D: 'Edwin Ume-Ezeoke was Speaker of the House of Representatives.'

  49:
    answer: B
    steps:
      - 'This is the aim of political parties.'
      - 'A political party is an organised group of people with common ideas whose ultimate aim is to acquire and exercise political power.'
      - 'A party can only carry out its programme if it is in power, so everything it does, from choosing candidates to campaigning, points to winning elections and controlling government.'
      - 'In Nigeria, parties register with INEC and present candidates to win seats from local councils up to the presidency.'
      - 'Remember: parties want power; pressure groups want influence.'
      - 'The trap is C. Parties do formulate and implement policies, but only after they acquire power.'
    hint: 'What must a party win before it can do anything else?'
    why:
      A: 'People-oriented programmes are carried out after a party wins power; they are a means, not the ultimate aim.'
      C: 'Making and carrying out policy depends on first winning power.'
      D: 'Political education is a function of parties, not their ultimate aim.'

