format_version: 1
exam_year: 2016
subject: GOV
explanations:
  1:
    answer: C
    steps:
      - 'This is naturalization, one of the ways of becoming a citizen.'
      - 'Naturalization is the process by which a foreigner (an alien) with no birth or family tie to a country applies to become its citizen and is granted citizenship by the government.'
      - 'An alien is not born a citizen and has no Nigerian parent or grandparent, so the only door open is to live in the country for many years, show good character and loyalty, take an oath of allegiance and be granted a certificate.'
      - 'Under the 1999 Constitution of Nigeria, a foreigner who has lived in Nigeria for about fifteen years can apply to the President for a certificate of naturalization.'
      - 'Remember: born here is birth, married or of Nigerian descent is registration, a stranger who settles is naturalization.'
      - 'The trap is A, registration. In Nigeria registration is meant for people with a tie already, such as a foreign woman married to a Nigerian man or a person with a Nigerian grandparent, not for a plain alien.'
    hint: 'Which way to citizenship is open to a foreigner who has no Nigerian parent, grandparent or spouse?'
    why:
      A: 'Registration is for people who already have a tie to Nigeria, such as a foreign wife of a Nigerian man or someone with a Nigerian grandparent.'
      B: 'Citizenship by birth goes to people born of citizen parents or grandparents; an alien by definition did not get it that way.'
      D: 'Conferment, an honorary grant, is not one of the ways the constitution lays down for an alien to become a citizen.'

  2:
    answer: D
    steps:
      - 'This is the upper house, usually called the Senate, in a federation.'
      - 'In most federations the upper house gives every federating unit the same number of seats, whatever its size or population.'
      - 'The lower house is shared out by population, so big units win more seats there. The upper house balances this, so small units are not swallowed by big ones.'
      - 'Nigeria''s Senate has three senators from each of the thirty-six states and one from the Federal Capital Territory, so Lagos and Bayelsa have the same voice. The United States Senate has two senators per state.'
      - 'Remember: lower house counts heads, upper house counts states.'
      - 'The trap is C. Each house checks the other in passing bills, but the reason the upper house exists in a federation is to give the units equal standing.'
    hint: 'How many senators does each Nigerian state send, big or small?'
    why:
      A: 'Both houses check the executive; that is the work of the whole legislature, not the reason for an upper house in a federation.'
      B: 'Some upper houses, like the old House of Chiefs, seated elders, but in a federation the upper house exists to represent the units equally.'
      C: 'The two houses check each other, but the upper house was not created mainly to supervise the lower one.'

  3:
    answer: B
    steps:
      - 'The body is the Public Complaints Commission, Nigeria''s ombudsman.'
      - 'An ombudsman is an official body that receives and investigates complaints from citizens against public servants and government agencies.'
      - 'Ordinary people may suffer from delay, neglect or unfair treatment by officials, and going to court is slow and costly. The commission gives them a free and simple place to complain, then investigates and recommends a remedy.'
      - 'Nigeria set up the Public Complaints Commission in 1975, with an office in every state, where a citizen can complain about, for example, an unpaid pension or an unfair dismissal.'
      - 'Remember: the ombudsman is the people''s complaint office.'
      - 'The trap is D. The commission can investigate and recommend, but it is not a court, so it cannot sentence anyone.'
    hint: 'What is an ombudsman for?'
    why:
      A: 'Forged documents are a crime for the police and the courts, not the commission''s work.'
      C: 'The commission has no power of arrest; arrest is the work of the police.'
      D: 'The commission can only investigate and recommend; only a court can sentence.'

  4:
    answer: B
    steps:
      - 'This is about the beginning of nationalism in Nigeria.'
      - 'Nationalism is the demand of a people to manage their own affairs and, in the end, to be free of foreign rule. In Nigeria it was begun by the educated elite: lawyers, journalists, clergymen and teachers trained in mission schools and abroad.'
      - 'They could read the laws and newspapers of the colonial government, so they could argue with it in its own language, and they were the first to be shut out of the top jobs. That is why they led.'
      - 'Herbert Macaulay and others led the 1908 protest against the Lagos water rate, and in 1923 Macaulay founded the Nigerian National Democratic Party, the first political party in Nigeria.'
      - 'Remember: the pen came first. The educated men with newspapers lit the fire of nationalism.'
      - 'The trap is D, traditional rulers. Kings such as Jaja of Opobo and Ovonramwen of Benin resisted the British conquest, but that was resistance to conquest, not the organised nationalist activity that followed.'
    hint: 'Who could read the colonial laws and answer them in newspapers in Lagos?'
    why:
      A: 'Trade unions grew strong only in the 1930s and 1940s, as in the 1945 general strike, long after the first protests.'
      C: 'Political parties came out of the nationalist activities; the first, the NNDP, was formed only in 1923 by the educated elite.'
      D: 'Traditional rulers resisted conquest, and under indirect rule many worked with the colonial government; they did not lead nationalism.'

  5:
    answer: D
    steps:
      - 'The organ is the Economic and Social Council, ECOSOC, one of the six main organs of the United Nations.'
      - 'ECOSOC promotes co-operation among member states in economic, social, cultural, educational and health matters. It co-ordinates the work of the specialized agencies such as the WHO, FAO and UNESCO.'
      - 'Membership of the specialized agencies and of their programmes is voluntary, and ECOSOC works by study, discussion and recommendation, so the co-operation it builds is voluntary, across many areas.'
      - 'In Nigeria, the World Health Organization''s support for polio immunisation is one fruit of the co-operation ECOSOC co-ordinates.'
      - 'Remember: ECOSOC, economic and social, the many fields of everyday life.'
      - 'The trap is A, the General Assembly. It is where every member debates and votes, but the organ set up to run co-operation in these many fields is ECOSOC.'
    hint: 'Which organ''s very name covers the economic and social fields?'
    why:
      A: 'The General Assembly is the main debating and representative body of the UN, not the organ that runs economic and social co-operation.'
      B: 'The International Court of Justice settles legal disputes between states.'
      C: 'The Security Council keeps international peace and security, and its decisions bind members, so it is not voluntary.'

  6:
    answer: C
    steps:
      - 'This is the returning officer.'
      - 'The returning officer is the official who collects and adds up the results from all the polling units in a constituency and formally declares the winner.'
      - 'Votes are counted first at each polling unit, then collated upward. The final total for the whole contest needs one officer to announce it, and that officer is the returning officer.'
      - 'In Nigeria, I N E C, the Independent National Electoral Commission, appoints a returning officer for each election; for the presidential election the INEC chairman is the returning officer.'
      - 'Remember: the returning officer returns the winner.'
      - 'The trap is B, the presiding officer. He runs voting and counting at one polling unit only; he does not announce the overall result.'
    hint: 'Which officer declares who has been returned as the winner?'
    why:
      A: 'Electoral officer is a general title for an election official; it is not the officer who declares the final result.'
      B: 'The presiding officer is in charge of a single polling unit, not the final declaration.'
      D: 'There is no office called ballot officer that declares results.'

  7:
    answer: D
    steps:
      - 'This is the Madawaki, a title in the Hausa-Fulani emirate system.'
      - 'In the emirate, the emir ruled with titled officials. The Madawaki was the commander of the army.'
      - 'Each official had one job, so the emir could rule a large area: the Waziri was the chief adviser, the Galadima ran the capital, the Alkali judged cases, the Ma''aji kept the treasury, and the Madawaki led the army in war.'
      - 'These titles survive today in emirates such as Kano, Zaria and Katsina, where they are given to respected men as chieftaincy titles.'
      - 'Remember: Madawaki marches, the soldier among the titles.'
      - 'The trap is A, Sarkin Fada. He was the head of the palace officials, not of the army.'
    hint: 'Which emirate title belongs to the man who leads the army?'
    why:
      A: 'The Sarkin Fada was the head of the palace officials.'
      B: 'The Hakimi was a district head who collected taxes in his district.'
      C: 'The Alkali was the judge who applied Islamic law in the courts.'

  8:
    answer: B
    steps:
      - 'This is judicial review, a tool of checks and balances.'
      - 'Checks and balances means each arm of government can limit the others so that none abuses its power. Judicial review is the power of the courts to declare a law or an executive action null and void if it breaks the constitution.'
      - 'The legislature makes laws and the executive carries them out, but the courts can strike down what is unconstitutional, so both arms are checked.'
      - 'In Nigeria, the 1999 Constitution says any law inconsistent with it is void, and the Supreme Court has struck down laws and actions on that ground.'
      - 'Remember: review means the court looks again and can cancel.'
      - 'The trap is C, judicial immunity. It protects judges from being sued for their work; it shields, it does not check.'
    hint: 'Which power lets the courts cancel what another arm has done?'
    why:
      A: 'A code of conduct sets rules of behaviour for public officers; it is not one arm checking another.'
      C: 'Judicial immunity protects judges from being sued; it does not let one arm check another.'
      D: 'Judicial precedent means courts follow earlier decisions; it guides judges, it does not check other arms.'

  9:
    answer: B
    steps:
      - 'This is carpet-crossing, also called cross-carpeting.'
      - 'Carpet-crossing is when a member of a legislature, elected on one party''s ticket, leaves it for another party while keeping his seat.'
      - 'It betrays the voters who chose the party, so the 1979 Constitution was the first to outlaw it: a legislator who joined another party before his term ended lost his seat, unless his old party had split or merged.'
      - 'Nigeria had seen its harm in 1951, when members crossing to the Action Group in the Western House of Assembly cost Nnamdi Azikiwe his seat in the central legislature. The 1999 Constitution keeps the same rule today.'
      - 'Remember: seventy-nine stopped the crossing.'
      - 'The trap is A, the 1963 Constitution. It made Nigeria a republic but had no rule against carpet-crossing.'
    hint: 'Which constitution brought in the presidential system of the Second Republic?'
    why:
      A: 'The 1963 Republican Constitution did not outlaw carpet-crossing.'
      C: 'The 1960 Independence Constitution had no rule against it, and the crossings of the First Republic went unpunished.'
      D: 'The 1999 Constitution kept the ban, but the 1979 Constitution brought it in first.'

  10:
    answer: C
    steps:
      - 'This is the Ogboni, a body in the Old Oyo, the Yoruba empire.'
      - 'The Ogboni was a secret society of elders and important men. It performed the religious and ritual rites of the kingdom, especially the worship of the earth.'
      - 'Because it held these sacred duties, it also stood between the Alaafin and the Oyomesi, and its word was respected by both.'
      - 'The Ogboni still exists in Yoruba towns today, where it plays a part in rites around the traditional ruler.'
      - 'Remember: Ogboni for the gods, Oyomesi for the throne, Aare-Ona Kakanfo for war.'
      - 'The trap is B, the Oyomesi. They were the seven kingmakers led by the Bashorun, a political council, not the body for ritual rites.'
    hint: 'Which body of elders in Oyo was a religious secret society?'
    why:
      A: 'The Aare-Ona Kakanfo was the field commander of the army.'
      B: 'The Oyomesi were the kingmakers and council of state, a political body.'
      D: 'The Oba, the Alaafin, was the head of the empire; the ritual rites were carried out by the Ogboni.'

  11:
    answer: A
    steps:
      - 'This is Marxism, the ideas of Karl Marx and Friedrich Engels.'
      - 'Marxism teaches that history is a struggle between classes, the owners of the means of production and the workers. Its goal is a classless society where the means of production are owned in common.'
      - 'Marx argued that private ownership makes classes, and classes make conflict. Abolish private ownership and classes disappear, so in the end even the state would wither away.'
      - 'Nigerian link: in the Second Republic, the UPN of Obafemi Awolowo called its programme democratic socialism, which meant reform such as free education within a mixed economy, not the classless society of Marxism.'
      - 'Remember: Marx wanted no masters.'
      - 'The trap is D, conservatism. It wants to keep society as it is, classes and all.'
    hint: 'Which thinker saw history as class struggle?'
    why:
      B: 'Feudalism is built on classes, lords above serfs, so it cannot aim at a classless society.'
      C: 'Liberalism stresses individual freedom and private property, and accepts classes.'
      D: 'Conservatism defends the existing order, including its classes.'

  12:
    answer: B
    steps:
      - 'This is indirect rule, the British policy of ruling through traditional rulers and institutions.'
      - 'It worked best in Northern Nigeria because the emirates already had an organised structure: an emir, titled officials, a tax system and Alkali courts.'
      - 'Lugard had few men and little money. Where a working system already existed, the British only had to place a Resident beside the emir and use his machinery, so indirect rule ran smoothly.'
      - 'In the East there were no such kings, so the British made warrant chiefs, who were resented, and the 1929 Aba Women''s Riot showed the failure there.'
      - 'Remember: indirect rule needs a ready structure to rule through.'
      - 'The trap is C. The North did resist; the Sokoto Caliphate was conquered by force in 1903. Success came after conquest, from the structure.'
    hint: 'What did the emirates already have that the British could use?'
    why:
      A: 'Farmland was not the reason; the success came from the existing system of rule.'
      C: 'The North did resist, as in the battle for Sokoto in 1903.'
      D: 'The people did not choose indirect rule; it was the British who chose it.'

  13:
    answer: B
    steps:
      - 'This is the commissioner, a member of the state executive.'
      - 'A commissioner is appointed by the state governor, confirmed by the state House of Assembly, and heads a ministry such as Education or Health.'
      - 'The executive arm carries out, or implements, the laws and policies made by the legislature, so the commissioner''s job is to implement laws through his ministry.'
      - 'In a Nigerian state, the Commissioner for Education carries out the state''s education law, for example by running the state''s public schools.'
      - 'Remember: the legislature makes, the executive implements, the judiciary interprets.'
      - 'The trap is A or D, writing or making laws. That is the work of the state House of Assembly, not of a commissioner.'
    hint: 'Which arm is the commissioner in, and what does that arm do with laws?'
    why:
      A: 'Writing laws is the work of the legislature, the state House of Assembly.'
      C: 'Giving loans is the work of banks, not the duty of a commissioner.'
      D: 'Law making belongs to the legislature, not to the executive.'

  14:
    answer: D
    steps:
      - 'This is the cabinet, or parliamentary, system of government.'
      - 'In it the prime minister and the ministers are members of parliament, they form the cabinet, and they are collectively responsible to parliament.'
      - 'The system grew in Britain over centuries, as power passed from the monarch to ministers who had the support of the House of Commons, so Britain is its classic home.'
      - 'Nigeria used the cabinet system in the First Republic, 1960 to 1966, with Sir Abubakar Tafawa Balewa as prime minister, but has had a presidential system since 1979.'
      - 'Remember: Westminster, the cabinet''s birthplace.'
      - 'The trap is C, Nigeria. It once had a cabinet system, but it now operates a presidential system.'
    hint: 'Where did the Westminster system begin?'
    why:
      A: 'France has a mixed, semi-presidential system with a strong elected president.'
      B: 'Cameroun has a presidential system with a strong executive president.'
      C: 'Nigeria has had a presidential system since 1979.'

  15:
    answer: C
    steps:
      - 'This is state creation, used to correct imbalance in the federation.'
      - 'On the twenty-seventh of May, 1967, the Gowon administration divided Nigeria''s four regions into twelve states.'
      - 'The Northern Region alone was larger in land and population than all the other regions together, so it could dominate the federation. Splitting the regions into smaller states reduced that imbalance and gave minorities their own states.'
      - 'The process continued later, and today Nigeria has thirty-six states and the Federal Capital Territory.'
      - 'Remember: Gowon, twelve states, nineteen sixty-seven.'
      - 'The trap is B. Allocation of money did not change the size of the regions, which was the source of the imbalance.'
    hint: 'What did Gowon do to the four regions in 1967?'
    why:
      A: 'Political parties were banned under military rule, so the regime formed none.'
      B: 'More money did not change the structure; dividing the regions did.'
      D: 'Appointing ministers did not alter the sizes of the units of the federation.'

  16:
    answer: A
    steps:
      - 'This is the General Manager, also called the Managing Director, of a public corporation.'
      - 'A public corporation is run by a board, chaired by the Chairman, that makes policy, and by a General Manager who heads the management and runs it day to day.'
      - 'The board meets from time to time, but someone must run the staff and operations every day, so the General Manager is the administrative head.'
      - 'The Nigerian Ports Authority, for example, is run day to day by its Managing Director, under a board, and supervised by the Minister of Transport.'
      - 'Remember: the Chairman chairs, the General Manager manages.'
      - 'The trap is C, the Chairman. He heads the board and its policy, not the daily administration.'
    hint: 'Who manages the staff and the work every day?'
    why:
      B: 'A Permanent Secretary heads a government ministry, not a public corporation.'
      C: 'The Chairman heads the board, which makes policy; the daily administration is under the General Manager.'
      D: 'The supervising Minister oversees the corporation from outside on behalf of government.'

  17:
    answer: D
    steps:
      - 'This is about the attributes of a state.'
      - 'Every state has four attributes: a population, a definite territory, a government and sovereignty.'
      - 'A state is a political community, so without people there is no one to govern. Population is therefore an essential attribute.'
      - 'Nigeria has the largest population in Africa, living within its territory and under one government in Abuja.'
      - 'Remember TPSG: Territory, Population, Sovereignty, Government.'
      - 'The trap is B, language. Many states, Nigeria among them, have hundreds of languages, so a single language is not an attribute of a state.'
    hint: 'Which option is one of the four things every state must have?'
    why:
      A: 'Dress mode is a cultural feature of a people, not an attribute of the state.'
      B: 'Many states have many languages; language is a feature of a nation, not of the state.'
      C: 'Religion is a matter of belief; a state can have many religions or none.'

  18:
    answer: B
    steps:
      - 'This is African nationalism.'
      - 'Nationalism in Africa was the movement of colonised peoples to end foreign rule. Its utmost goal was independence.'
      - 'Colonial rule took away the right of Africans to govern themselves, so every demand, for more seats, jobs or rights, led in the end to one goal: self-government.'
      - 'Nigeria''s nationalists won independence on the first of October, 1960, after Ghana became independent in 1957.'
      - 'Remember: the final goal was freedom from colonial rule.'
      - 'The trap is A, representation. Early nationalists asked for seats in the councils, but that was a step on the road, not the final goal.'
    hint: 'What did all the nationalist demands lead to in the end?'
    why:
      A: 'Representation was an early demand, a step towards independence, not the final goal.'
      C: 'Development was hoped for after independence; it was not the goal of the nationalist struggle itself.'
      D: 'Patriotism is a feeling of love for one''s country, a source of nationalism, not its goal.'

  19:
    answer: A
    steps:
      - 'This is the centrepiece of Nigeria''s foreign policy.'
      - 'Since independence in 1960, Nigeria has made Africa the centrepiece of its foreign policy.'
      - 'Nigeria''s security, trade and neighbours are in Africa, and it saw itself as having a duty to help free and unite the continent, so Africa comes first in its dealings with the world.'
      - 'This is why Nigeria helped found the OAU in 1963 and ECOWAS in 1975, and gave money and support to liberation movements in southern Africa.'
      - 'Remember: Africa first, Africa centre.'
      - 'The trap is B, Europe. Nigeria has close ties with Europe, but those are outer circles of its policy, not the centre.'
    hint: 'Which continent does Nigeria put first?'
    why:
      B: 'Europe is an important partner but not the centre of Nigeria''s foreign policy.'
      C: 'Asia is a trading partner, not the centrepiece.'
      D: 'Latin America is far from the centre of Nigeria''s foreign policy.'

  20:
    answer: B
    steps:
      - 'This is the High Commissioner.'
      - 'A High Commissioner is the chief diplomatic representative of one Commonwealth country in another Commonwealth country.'
      - 'Commonwealth members share a special historical bond with Britain, so they call their envoys to one another High Commissioners rather than ambassadors, and their missions High Commissions.'
      - 'Nigeria has a High Commission in London and in Accra, but an Embassy, headed by an Ambassador, in Washington.'
      - 'Remember: Commonwealth to Commonwealth, High Commissioner.'
      - 'The trap is D, Ambassador. It is the same rank, but the title is used for countries outside the Commonwealth.'
    hint: 'What is Nigeria''s envoy in London called?'
    why:
      A: 'A Consul-General looks after citizens and trade in a city; he is not the chief envoy.'
      C: 'An attache is a junior or specialist member of a mission, such as a military attache.'
      D: 'An Ambassador is the title for an envoy to a country outside the Commonwealth.'

  21:
    answer: D
    steps:
      - 'This is the Adedeji committee.'
      - 'In 1975 the Murtala Muhammed government set up a committee headed by Professor Adebayo Adedeji to review Nigeria''s foreign policy.'
      - 'The new regime wanted a more active, Africa-centred foreign policy, so it asked experts to study the old one and recommend changes.'
      - 'The same regime took a firm stand on Angola, recognising the MPLA government in November 1975, in line with that more active policy.'
      - 'Remember: Adedeji for abroad.'
      - 'The trap is A, the Udoji committee. It reviewed the public service and its salaries in 1972 to 1974, under Gowon.'
    hint: 'Which of these committees dealt with foreign affairs rather than salaries or revenue?'
    why:
      A: 'The Udoji Commission, 1972 to 1974, reviewed the public service.'
      B: 'The Aboyade committee of 1977 worked on revenue allocation.'
      C: 'The Okigbo commission of 1980 also worked on revenue allocation.'

  22:
    answer: B
    steps:
      - 'This is about why Africa is the centrepiece of Nigeria''s foreign policy.'
      - 'Nigeria is the largest country in Africa by population and one of its richest because of its oil.'
      - 'Size and wealth gave Nigeria the means to lead and a sense of duty to help its neighbours and fight colonialism and apartheid, so it put Africa at the centre of its policy.'
      - 'Oil money let Nigeria fund liberation movements in southern Africa and lead ECOWAS and the ECOMOG peacekeeping force in Liberia from 1990.'
      - 'Remember: big and rich, so Africa first.'
      - 'The trap is D, potential role in Africa. Any role Nigeria might play grows out of its size and wealth, which is the cause.'
    hint: 'What makes Nigeria the giant of Africa?'
    why:
      A: 'Nigeria''s role in the Congo crisis came from the policy; it was not the reason for it.'
      C: 'Nigeria does not seek to dominate Africa; its policy speaks of co-operation and good neighbourliness.'
      D: 'Any potential role Nigeria has depends on its size and wealth, which is the real cause.'

  23:
    answer: A
    steps:
      - 'This is rule adjudication.'
      - 'Rule adjudication means interpreting laws and settling disputes under them. It is the primary function of the judiciary.'
      - 'Government has three main jobs: rule making by the legislature, rule application by the executive, and rule adjudication by the judiciary, so each arm can be held to its own job.'
      - 'In Nigeria, the 1999 Constitution vests judicial power in the courts, from the magistrate courts up to the Supreme Court.'
      - 'Remember: make, apply, adjudicate. Legislature, executive, judiciary.'
      - 'The trap is C, government. All three arms make up government, so the word does not name the arm that adjudicates.'
    hint: 'Which arm settles disputes over what the law means?'
    why:
      B: 'The legislature makes rules; it does not adjudicate them.'
      C: 'Government covers all three arms, so it does not name the arm that adjudicates.'
      D: 'The executive applies and enforces rules.'

  24:
    answer: D
    steps:
      - 'This is the franchise, also called suffrage.'
      - 'The franchise is the right to vote in elections.'
      - 'Elections need voters, and the law decides who may vote by age, citizenship and sanity, so franchise names that right.'
      - 'In Nigeria, every citizen aged eighteen and above has the franchise and registers with INEC to use it.'
      - 'Remember: franchise is the vote.'
      - 'The trap is B, rights and duties of citizens. Voting is one of those rights, but franchise means only the right to vote.'
    hint: 'What right does a voter''s card let you use?'
    why:
      A: 'Sovereignty is the supreme power of the state, not the right to vote.'
      B: 'Rights and duties of citizens are many; franchise is only the right to vote.'
      C: 'Ownership of means of production is an economic idea, not the franchise.'

  25:
    answer: D
    steps:
      - 'This is about the dimensions of public opinion.'
      - 'Public opinion is the views of a large part of the people on a public issue. Its dimensions are its substance (what the opinion is about), its orientation or direction (for or against), and its intensity (how strongly it is held).'
      - 'These describe the opinion itself. Polling is different: it is a method of measuring public opinion, by asking a sample of people questions.'
      - 'Before Nigerian elections, polling firms survey voters to measure public opinion on the candidates.'
      - 'Remember: substance, orientation, intensity describe; polling measures.'
      - 'The trap is A, substance. It sounds unusual, but it means the content of the opinion, so it is a dimension.'
    hint: 'Which option is a way of measuring opinion rather than a feature of it?'
    why:
      A: 'Substance, the content of the opinion, is a dimension of public opinion.'
      B: 'Intensity, how strongly the opinion is held, is a dimension of public opinion.'
      C: 'Orientation, whether the opinion is for or against, is a dimension of public opinion.'

  26:
    answer: C
    steps:
      - 'This is political socialization.'
      - 'Political socialization is the process by which people learn and acquire political values, beliefs and attitudes.'
      - 'No one is born with political views. We learn them from agents: the family, the school, peers, religious bodies, the mass media and political parties.'
      - 'In Nigeria, the NYSC scheme, set up in 1973, socializes young graduates into national unity by posting them to states other than their own.'
      - 'Remember: socialization is learning politics from society.'
      - 'The trap is A, education. Schooling is one agent of socialization, but the whole process is socialization.'
    hint: 'Which word names the whole process of learning political values?'
    why:
      A: 'Education is only one agent of political socialization, not the whole process.'
      B: 'Acculturation is taking on the culture of another group, not learning political values.'
      D: 'Participation is taking part in politics, not acquiring its values.'

  27:
    answer: D
    steps:
      - 'This is the pressure group.'
      - 'A pressure group is an organised group of people with common interests that tries to influence government policy and legislation in favour of its members.'
      - 'It does not seek to win power or form a government. It works by lobbying, petitions, strikes and the media, so its main aim is to influence decisions.'
      - 'In Nigeria, the Nigeria Labour Congress presses for higher wages, and the Nigerian Bar Association and the Nigerian Medical Association press for their members.'
      - 'Remember: pressure groups press, parties rule.'
      - 'The trap is A. A pressure group may criticise government, but it is not an opposition trying to replace it.'
    hint: 'Do pressure groups want to take power or to influence those who have it?'
    why:
      A: 'Opposition seeks to replace government; that is the role of parties, not pressure groups.'
      B: 'Pressure groups promote their members'' interests, not mainly the country''s against foreigners.'
      C: 'Pressure groups promote their own members'' interests, not those of political parties.'

  28:
    answer: D
    steps:
      - 'This is the three-tier system: federal, state and local government.'
      - 'The 1976 local government reform made local government the third tier of government in Nigeria.'
      - 'Before 1976 each region ran its own kind of local administration. The reform gave the whole country a single, uniform system of elected councils with their own functions and a share of federal revenue, so local government became a tier of its own.'
      - 'The 1979 Constitution then wrote this into law, and the 1999 Constitution keeps it, with seven hundred and seventy-four local government areas.'
      - 'Remember: seventy-six made it three tiers.'
      - 'The trap is B, the 1963 Constitution. It had federal and regional governments, with local government still under the regions.'
    hint: 'Which reform turned local government into a tier of its own?'
    why:
      A: 'The 2004 pension reform dealt with workers'' pensions, not the tiers of government.'
      B: 'The 1963 Constitution had two tiers, federal and regional.'
      C: 'The Hicks-Phillipson Commission of 1951 dealt with revenue allocation.'

  29:
    answer: C
    steps:
      - 'This is a flexible constitution.'
      - 'A flexible constitution is one that can be easily amended, by the ordinary process of making laws.'
      - 'No special majority or referendum is needed, so the legislature can change it as quickly as any law. A rigid constitution needs a special process.'
      - 'Britain''s constitution is flexible. Nigeria''s 1999 Constitution is rigid: an amendment needs two-thirds of each house of the National Assembly and the approval of two-thirds of the State Houses of Assembly.'
      - 'Remember: flexible bends easily.'
      - 'The trap is D. Who writes a constitution does not make it flexible; how easily it can be changed does.'
    hint: 'What does "flexible" mean when you bend something?'
    why:
      A: 'Being known to citizens has nothing to do with how easily it is amended.'
      B: 'Popularity with legislators does not make a constitution flexible.'
      D: 'Who wrote it does not decide flexibility; the ease of amendment does.'

  30:
    answer: D
    steps:
      - 'This is the General Assembly of the United Nations.'
      - 'The General Assembly is the main representative organ of the UN. Every member state has a seat and one vote.'
      - 'Because all members sit in it as equals, big or small, it represents the whole membership. Other organs have only some members or are staff.'
      - 'Nigeria joined the UN in October 1960 and has its seat in the General Assembly like every other member.'
      - 'Remember: General means all. Every member is there.'
      - 'The trap is A, the Security Council. It is powerful, but it has only fifteen members, so it does not represent all.'
    hint: 'In which organ does every member state sit?'
    why:
      A: 'The Security Council has only fifteen members, five of them permanent.'
      B: 'The Secretariat is the UN''s staff under the Secretary-General, not a body of member states.'
      C: 'The Trusteeship Council supervised trust territories and has suspended its work.'

  31:
    answer: D
    steps:
      - 'This is about privatization of public corporations.'
      - 'Privatization is the sale of all or part of the government''s shares in a public enterprise to private investors.'
      - 'Once private owners hold the shares, they make the decisions, so government control, the defining feature of a public corporation, is weakened or lost.'
      - 'In Nigeria, privatization has been carried out by the Bureau of Public Enterprises, set up in 1999. NITEL and the power companies of PHCN were sold to private buyers.'
      - 'Remember: private shares, less public control.'
      - 'The trap is C, social control. Privatization changes who owns and controls the firm, which is the government, not society in general.'
    hint: 'Who controlled public corporations before they were sold?'
    why:
      A: 'Social harmony is not a feature of public corporations that privatization targets.'
      B: 'National integration is a wider goal of the state, not a feature of a corporation weakened by sale.'
      C: 'Control lost through privatization is government control, not social control.'

  32:
    answer: C
    steps:
      - 'This is the Local Government Service Commission.'
      - 'It is a state body that supervises and manages the personnel of local governments: it appoints, promotes, transfers and disciplines senior local government staff.'
      - 'Councils come and go with elections, so a commission is needed to keep the career staff professional and treated fairly across all the local governments of a state.'
      - 'The commission came out of the 1976 local government reform. Each Nigerian state has one today, while local council elections are run by a separate State Independent Electoral Commission.'
      - 'Remember: service commission, staff commission.'
      - 'The trap is B. Conducting local council elections is the work of the State Independent Electoral Commission.'
    hint: 'Whose careers does a service commission look after?'
    why:
      A: 'The working environment is the duty of each council''s management, not the commission''s main duty.'
      B: 'Local council elections are run by the State Independent Electoral Commission.'
      D: 'New local governments are created by the state House of Assembly and the National Assembly.'

  33:
    answer: A
    steps:
      - 'This is aristocracy in Aristotle''s classification.'
      - 'Aristotle sorted governments by who rules, one, few or many, and whom they rule for. Rule by the few for the good of all is aristocracy.'
      - 'He called it a good form because the best people rule for the common good. When the few rule for themselves, it becomes oligarchy.'
      - 'Aristotle''s six forms: monarchy and tyranny, aristocracy and oligarchy, polity and democracy. Nigeria today is meant to be rule by the many through elected representatives.'
      - 'Remember: aristos means the best. The best few rule for all.'
      - 'The trap is D, autocracy. That is rule by one person with absolute power, not by a few.'
    hint: 'What did Aristotle call the good rule of the few?'
    why:
      B: 'Polyarchy is Robert Dahl''s modern term for rule by many competing groups, not Aristotle''s form.'
      C: 'Diarchy is rule by two, such as a shared civilian and military government.'
      D: 'Autocracy is rule by one person with absolute power.'

  34:
    answer: B
    steps:
      - 'This is the problem of structural imbalance in Nigerian federalism.'
      - 'Structural imbalance means one unit of the federation is so much bigger in size and population than the others that it can dominate them.'
      - 'In the First Republic the Northern Region was larger than the Eastern and Western Regions together and had more seats in the federal parliament than both, so the other units feared domination.'
      - 'The answer has been state creation: twelve states in 1967, rising to thirty-six states today.'
      - 'Remember: a federation is like a table; uneven legs make it wobble.'
      - 'The trap is C. Revenue sharing is debated, but the federation does not lack revenue; the textbook problem is the uneven size of the units.'
    hint: 'What was wrong with the sizes of the regions in the First Republic?'
    why:
      A: 'Pre-colonial structures shaped local rule, but they are not the main problem of the federation.'
      C: 'The quarrel is over how revenue is shared, not a lack of it.'
      D: 'Manpower shortages affect administration, not the federal structure.'

  35:
    answer: D
    steps:
      - 'This is ECOWAS, the Economic Community of West African States.'
      - 'ECOWAS was pioneered by Nigeria and Togo. General Yakubu Gowon and President Gnassingbe Eyadema led the drive from 1972.'
      - 'They wanted to bring English-speaking and French-speaking West African states together for economic co-operation, so Nigeria from one side and Togo from the other toured the region together.'
      - 'The Treaty of Lagos founded ECOWAS on the twenty-eighth of May, 1975, and its headquarters is in Abuja.'
      - 'Remember: Gowon and Eyadema, Nigeria and Togo.'
      - 'The trap is A, Ghana. It is a founding member, but the pioneers were Nigeria and Togo.'
    hint: 'Which French-speaking neighbour worked with Gowon to found ECOWAS?'
    why:
      A: 'Ghana is a founding member, but it did not pioneer ECOWAS with Nigeria.'
      B: 'Cameroun is in Central Africa and is not a member of ECOWAS.'
      C: 'Algeria is in North Africa and is not a member of ECOWAS.'

  36:
    answer: D
    steps:
      - 'This is the Mid-West Region, Nigeria''s fourth region.'
      - 'The Mid-West Region was carved out of the Western Region in 1963, after a referendum.'
      - 'The NPC and NCNC formed the federal coalition and backed the minorities of the West who wanted their own region. The Action Group, which ran the West, was weakened by its crisis of 1962, so the coalition could see it through.'
      - 'The Mid-West later became Bendel State, which was divided into Edo and Delta States in 1991.'
      - 'Remember: sixty-three, the Mid-West joins as region number four.'
      - 'The trap is C, the Western Region. The Mid-West was taken out of the West; the West already existed.'
    hint: 'Which region was created during the First Republic?'
    why:
      A: 'The Eastern Region was one of the three original regions, in place long before 1963.'
      B: 'The Northern Region was one of the three original regions, in place long before 1963.'
      C: 'The Western Region was one of the original regions; the Mid-West was cut from it.'

  37:
    answer: A
    steps:
      - 'This is about the problems of public corporations in Nigeria.'
      - 'The commonest problem textbooks give is wastage of resources: money and materials lost through mismanagement, corruption, overstaffing and inefficiency.'
      - 'Public corporations do not have to make a profit to survive and are often shielded from competition, so waste goes unchecked and many have run at a loss.'
      - 'Before it was unbundled, NEPA was often cited as a public corporation weakened by waste and poor service.'
      - 'Remember: public money, careless spending.'
      - 'The trap is C, public control. Control by government is the defining feature of a public corporation, not its problem.'
    hint: 'What happens to money in a body that need not make a profit?'
    why:
      B: 'Choosing leaders is a normal duty of government for any public body; the problem is what happens to the resources.'
      C: 'Public control is what makes a corporation public; it is its nature, not its problem.'
      D: 'Subsidies are a deliberate policy to keep services affordable; the problem is waste in using resources.'

  38:
    answer: B
    steps:
      - 'This is non-alignment in the Balewa years.'
      - 'Non-alignment means not taking sides with either the Western or the Eastern bloc in the Cold War. Nigeria declared it at independence, but in the sixties its policy leaned to the West.'
      - 'The Balewa government kept close ties with Britain: British advisers, British trade and a defence pact. So it could not stand truly between the two blocs.'
      - 'The Anglo-Nigerian Defence Pact of 1960 tied Nigeria to Britain until protests led to its abrogation in 1962.'
      - 'Remember: you cannot be non-aligned while holding Britain''s hand.'
      - 'The trap is C, Afrocentric policy. Putting Africa first did not tie Nigeria to either bloc.'
    hint: 'Which old colonial power did Nigeria stay close to after 1960?'
    why:
      A: 'Nigeria''s economic potential was high; poverty was not why its non-alignment lacked substance.'
      C: 'An Africa-first policy did not tie Nigeria to either Cold War bloc.'
      D: 'Nigeria had no close partnership with Asian countries in the sixties.'

  39:
    answer: A
    steps:
      - 'This is charismatic authority, from Max Weber''s three types of authority.'
      - 'Charismatic authority rests on the personal qualities of the leader: his gifts, courage or power to inspire.'
      - 'People obey such a leader because they admire him, not because of his office or custom, so his authority is personal.'
      - 'In the nationalist era, leaders such as Nnamdi Azikiwe drew huge crowds by their personal appeal.'
      - 'Remember: charisma is personal magic. Weber''s three are traditional, charismatic and legal.'
      - 'The trap is C, traditional. That rests on custom and inheritance, as with a king, not on the person''s qualities.'
    hint: 'Which type of authority comes from the leader himself?'
    why:
      B: 'Legal authority rests on laws and office, not personal qualities.'
      C: 'Traditional authority rests on custom and inheritance.'
      D: 'Coercion is force, not one of Weber''s types of authority.'

  40:
    answer: D
    steps:
      - 'This is judicial review.'
      - 'Judicial review is the power of the courts to declare an action of the executive or a law of the legislature null and void if it breaks the constitution.'
      - 'In a federal system the constitution is supreme, so the courts guard it and can stop the executive from going beyond its powers.'
      - 'In Nigeria, a state government or a citizen can go to court against a federal action, and the Supreme Court can declare it unconstitutional.'
      - 'Remember: the court reviews and can reverse.'
      - 'The trap is A, judicial overview. It sounds similar, but it is not the name of any power.'
    hint: 'What is the court''s power to cancel unconstitutional actions called?'
    why:
      A: 'Judicial overview is not a recognised power of the courts.'
      B: 'Motions are proposals in a legislature or applications in court, not a way of controlling the executive.'
      C: 'Delegated legislation is law-making power given by the legislature to the executive, not a control.'

  41:
    answer: B
    steps:
      - 'This is the presidential election of the twelfth of June, 1993.'
      - 'Local and foreign observers judged it the freest and fairest election in Nigeria''s history. Moshood Abiola of the SDP and Bashir Tofa of the NRC were the candidates.'
      - 'Voting was peaceful and orderly under the open ballot system, and voters crossed ethnic and religious lines. The Babangida government annulled the election on the twenty-third of June, 1993, before the final results were declared.'
      - 'Since 2019 the twelfth of June has been Nigeria''s Democracy Day.'
      - 'Remember: June twelve, nineteen ninety-three.'
      - 'The trap is A, the 1999 elections. They returned Nigeria to civil rule, but observers did not judge them the freest.'
    hint: 'Which election date is now Democracy Day?'
    why:
      A: 'The 1999 elections ended military rule but were not judged the freest and fairest.'
      C: 'The 2007 elections were widely criticised by observers.'
      D: 'There were no general elections in 1982; the Second Republic held its general elections in 1979 and 1983.'

