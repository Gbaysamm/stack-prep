      B: 'Bye-laws are made by local governments.'
      D: 'Decrees were federal laws made by the ruling military council.'

  44:
    answer: A
    steps:
      - 'This is the pro-Western leaning of Nigeria''s early foreign policy.'
      - 'Nigeria''s foreign policy in the First Republic leaned towards Britain and the West mainly because of its historical development, its colonial history under Britain.'
      - 'British rule shaped Nigeria''s leaders, laws, schools, language and trade, so after independence it was natural to keep looking to Britain and her Western allies.'
      - 'Nigeria joined the Commonwealth and signed the Anglo-Nigerian Defence Pact in 1960, both fruits of that history.'
      - 'Remember: history pointed Nigeria west.'
      - 'The trap is D, economic under-development. Nigeria did depend on Western trade and aid, but that dependence was itself a product of its colonial history.'
    hint: 'Which country ruled Nigeria before 1960?'
    why:
      B: 'Nigeria''s location in Africa did not pull it towards the West.'
      C: 'Social structure was not what made Nigeria pro-Western.'
      D: 'Economic dependence played a part, but it grew out of the colonial history, the main cause.'

  45:
    answer: A
    steps:
      - 'This is the sovereign state.'
      - 'A sovereign state is one whose government makes its decisions independent of foreign interference: supreme power inside and freedom from outside control.'
      - 'Sovereignty means no higher power above the state, so it decides its own laws and policies.'
      - 'Nigeria became sovereign on the first of October, 1960, and a republic on the first of October, 1963, when the British monarch ceased to be its head of state.'
      - 'Remember: sovereign means no master abroad.'
      - 'The trap is D. Free speech is a right of citizens, not what makes a state sovereign.'
    hint: 'Who makes the decisions in a sovereign state?'
    why:
      B: 'A constitution changed by a military government says nothing about freedom from foreign control.'
      C: 'Military rule is a form of government, not the meaning of sovereignty.'
      D: 'Free speech is a citizens'' right; sovereignty is about freedom from outside control.'

  46:
    answer: B
    steps:
      - 'This is the office of the prime minister in the First Republic.'
      - 'Under the parliamentary system of 1960 to 1966, Sir Abubakar Tafawa Balewa was the prime minister, the head of government, and also a member of the House of Representatives.'
      - 'In a parliamentary system the head of government must sit in parliament and keep its support, so he is both a minister and a lawmaker.'
      - 'The ceremonial head of state was the Governor-General, Nnamdi Azikiwe from November 1960, who became President when Nigeria became a republic in 1963.'
      - 'Remember: prime minister sits in parliament and runs the government.'
      - 'The trap is A. The prime minister was not head of state, and Balewa was the deputy leader of the NPC, whose leader was Ahmadu Bello.'
    hint: 'Where did the prime minister sit, and which job did he hold?'
    why:
      A: 'The head of state was the Governor-General and later the President, and Balewa was the NPC''s deputy leader, not its leader.'
      C: 'Balewa was not the leader of his party; Ahmadu Bello led the NPC.'
      D: 'The prime minister was not the head of state; that was the ceremonial Governor-General, then the President.'

