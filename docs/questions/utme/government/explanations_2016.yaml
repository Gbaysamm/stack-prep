    answer: B
    steps:
      - 'This compares the African Union, AU, with the Organisation of African Unity, OAU.'
      - 'The OAU, founded on the twenty-fifth of May, 1963, held strictly to non-interference and had no means to enforce its decisions. The AU, launched in 2002, has effective mechanisms for enforcing its decisions.'
      - 'The AU''s Constitutive Act lets it impose sanctions on members that defy it and intervene in a member state in cases of genocide, war crimes or crimes against humanity, and it has a Peace and Security Council.'
      - 'Nigerian troops have served in AU peace missions such as the one in Darfur, Sudan.'
      - 'Remember: the OAU could talk, the AU can act.'
      - 'The trap is C. The AU still has many divergent views among its members, so this does not set it apart.'
    hint: 'What could the AU do that the OAU could not?'
    why:
      A: 'Both the OAU and the AU have their headquarters in Addis Ababa.'
      C: 'AU members still hold many differing views.'
      D: 'The AU has an Assembly of Heads of State and Government, as the OAU did.'

