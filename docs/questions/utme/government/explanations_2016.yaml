    answer: A
    steps:
      - 'This is gerontocracy.'
      - 'Gerontocracy is rule by the old people, the elders.'
      - 'In many societies age was thought to bring wisdom, so the eldest men of the community made decisions and settled disputes.'
      - 'In pre-colonial Igbo society, the council of elders, with the age grades, governed each village.'
      - 'Remember: geron is Greek for an old man.'
      - 'The trap is C, monarchy. That is rule by one king or queen, not by the elders.'
    hint: 'Which word comes from the Greek for an old man?'
    why:
      B: 'Theocracy is rule by religious leaders in the name of God.'
      C: 'Monarchy is rule by a king or queen.'
      D: 'Feudalism is a system built on land held from lords, not rule by the old.'
