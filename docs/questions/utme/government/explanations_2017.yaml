format_version: 1
exam_year: 2017
subject: GOV
explanations:
  1:
    answer: C
    steps:
      - 'This is about the fundamental rights of a citizen.'
      - 'The right to life is the foremost right: no one may be deprived of life intentionally, except in execution of a lawful sentence of a court.'
      - 'Every other right, to speak, to worship, to vote or to own property, depends on being alive, so the right to life comes first.'
      - 'In Nigeria, the right to life is section 33 of the 1999 Constitution, the first right in Chapter IV, Fundamental Rights.'
      - 'Remember: no life, no other right.'
      - 'The trap is A. Freedom of religion is a real fundamental right, but it is one of many rights that rest on the right to life.'
    hint: 'Which right must you have before you can enjoy any of the others?'
    why:
      A: 'Freedom of thought, conscience and religion is a fundamental right, but it is not the first one; it depends on the right to life.'
      B: 'There is no fundamental right called an academic right; education is a goal of state policy, not the foremost right.'
      D: 'Privacy of home and correspondence is protected, but it ranks after the right to life, which every right depends on.'

  2:
    answer: B
    steps:
      - 'This is aristocracy, one of the forms of government.'
      - 'Aristocracy means rule by the best: a few people chosen for their ability, wisdom, birth or wealth govern the state.'
      - 'Its merit is that the most able citizens are in charge, so decisions are taken by people with knowledge and experience.'
      - 'Some pre-colonial councils in Nigeria worked on this idea, such as the Oyomesi of Oyo, a council of seven nobles chosen from leading families.'
      - 'Remember: aristocracy, the best rule; oligarchy, the few rule for themselves.'
      - 'The trap is C. Rule by an organised few is oligarchy, which is the bad form of minority rule, not the merit of aristocracy.'
    hint: 'The Greek word aristos means "best". Who rules in an aristocracy?'
    why:
      A: 'Aristocracy does not require military experience; rule by soldiers is a military regime.'
      C: 'Control by an organised few for their own benefit is oligarchy, not the merit of aristocracy.'
      D: 'Control by the majority describes democracy, not aristocracy.'

  3:
    answer: D
    steps:
      - 'This is about how a state carries out its foreign policy.'
      - 'The main instruments of foreign policy are diplomacy, propaganda, economic aid or sanctions, and, as a last resort, military force.'
      - 'Propaganda works by spreading information and ideas abroad to win other peoples and governments to a country''s point of view.'
      - 'Nigeria speaks to the world through the Voice of Nigeria, its external radio service, and through its embassies and high commissions.'
      - 'Remember the four tools: talk (diplomacy), tell (propaganda), trade (aid and sanctions), and troops (force).'
      - 'The trap is C. Political representation sounds outward-looking, but it is about citizens being represented at home in parliament, not a tool for dealing with other states.'
    hint: 'Which option is a way of winning over other countries?'
    why:
      A: 'Cultural integration is the blending of cultures within a society, not a tool for carrying out foreign policy.'
      B: 'Democratic elections choose leaders at home; they are not a strategy for dealing with other states.'
      C: 'Political representation is about citizens being represented in their own legislature, not about relations with other states.'

  4:
    answer: A
    steps:
      - 'This is the Structural Adjustment Programme, SAP.'
      - 'SAP was introduced in 1986 by the military regime of General Ibrahim Babangida, who headed the government from 1985 to 1993.'
      - 'It was meant to restructure the economy: it devalued the naira, cut government spending and subsidies, and opened the way for privatization and commercialization.'
      - 'Under SAP, the Second-tier Foreign Exchange Market (SFEM) of 1986 let the naira''s value be set by the market.'
      - 'Remember: B for Babangida, B for the bitter medicine of SAP.'
      - 'The trap is C. The Buhari regime of 1983 to 1985 came just before, with its own austerity measures, but SAP itself came after it ended.'
    hint: 'Which military head ruled Nigeria in 1986?'
    why:
      B: 'Obasanjo''s regimes (1976 to 1979 and 1999 to 2007) did not introduce SAP; it came in 1986.'
      C: 'The Buhari regime (1983 to 1985) ended before SAP was introduced in 1986.'
      D: 'The Abacha regime began in 1993, seven years after SAP was introduced.'

  5:
    answer: D
    steps:
      - 'This is about how ECOWAS, the Economic Community of West African States, is organised to do its work.'
      - 'The Treaty of Lagos of 28 May 1975 set up the Authority of Heads of State and Government, the Council of Ministers, the Executive Secretariat, the Tribunal and specialized commissions.'
      - 'The commissions carry out the day-to-day work in each field: Trade, Customs, Immigration, Monetary and Payments; Industry, Agriculture and Natural Resources; Transport, Telecommunications and Energy; and Social and Cultural Affairs.'
      - 'Nigeria, under General Yakubu Gowon, and Togo led the founding of ECOWAS, and the treaty was signed in Lagos.'
      - 'Today the revised treaty of 1993 has more specialized technical commissions, and since 2007 the Executive Secretariat has been the ECOWAS Commission.'
      - 'Remember: ECOWAS does its work through commissions, one for each field.'
      - 'The trap is A. ECOWAS has one Council of Ministers, which advises the Authority; its working structure is the set of commissions.'
    hint: 'Trade, Transport, Social and Cultural Affairs: what is each of these bodies called?'
    why:
      A: 'ECOWAS has only one council, the Council of Ministers; its operational work is done by the specialized commissions.'
      B: 'Panels are not part of the ECOWAS structure set up by its treaty.'
      C: 'Committees may meet within ECOWAS, but the treaty organises its work through commissions.'

  6:
    answer: D
    steps:
      - 'This is about the problems of local government administration.'
      - 'Local governments in Nigeria have long lacked enough trained staff such as engineers, accountants, doctors and planners.'
      - 'This is because skilled people prefer the better pay, promotion and city life of federal and state service, so local councils are left with fewer of them.'
      - 'In Nigeria, the 774 local government councils, the third tier of government since the 1976 reform, depend on the state''s Local Government Service Commission for staff.'
      - 'Remember: the lowest tier gets the fewest experts.'
      - 'The trap is B. States also face staff problems, but the shortage is a standard and major problem of the local governments.'
    hint: 'Which tier of government struggles most to attract skilled workers?'
    why:
      A: 'The federal government has the most money and attracts the best trained staff, so shortage of personnel is not its major problem.'
      B: 'State governments can pay and recruit far better than local councils, so the shortage is worst at local level.'
      C: 'Regional governments ended in 1967 when states were created, so they are not a current tier.'

  7:
    answer: C
    steps:
      - 'This is sovereignty.'
      - 'Sovereignty is the supreme power of a state to make and enforce laws within its territory, free from control by any other state.'
      - 'It is supreme inside the state, because no person or group is above it, and independent outside, because no foreign power can command it.'
      - 'Nigeria became a sovereign state on the first of October, 1960, when Britain stopped making its laws.'
      - 'Remember: sovereign means supreme.'
      - 'The trap is A. Authority is the right to use power, but sovereignty is the supreme right that belongs to the state itself.'
    hint: 'Which word means the highest power, answerable to no one else?'
    why:
      A: 'Authority is the lawful right to use power, which officers and bodies within the state hold; it is not the supreme right of the state.'
      B: 'Power is the ability to make others act as you wish; it is not the same as a right, let alone the supreme one.'
      D: 'Legitimacy is the people''s acceptance that a government has the right to rule; it is not the supreme right of the state.'

  8:
    answer: B
    steps:
      - 'This is a party''s manifesto.'
      - 'A manifesto is the written programme a party puts before voters: what it promises to do if it wins power.'
      - 'Voters judge a party mostly by what it promises to do for them, so a manifesto that speaks to their needs makes the party popular.'
      - 'Before each general election in Nigeria, parties registered by INEC publish manifestos on things like jobs, roads and security.'
      - 'Remember: the manifesto is the party''s promise list, and promises win votes.'
      - 'The trap is C. Ideology shapes the manifesto, but voters respond to the concrete programme, not the abstract ideas behind it.'
    hint: 'What document do voters read to see what a party will do for them?'
    why:
      A: 'A party constitution governs how the party runs itself inside; voters hardly read it.'
      C: 'Ideology is the set of ideas behind a party; its popularity rests on the concrete programme it offers.'
      D: 'Many branches help a party organise, but people support it for what it promises, not for its number of offices.'

  9:
    answer: D
    steps:
      - 'This is the collegiate executive, also called the plural executive.'
      - 'In a collegiate executive, executive power is held by a council of equals instead of one person, and the chairmanship rotates among them.'
      - 'Rotation means no one member can dominate, because each holds the chair only for a set time.'
      - 'The best-known example is Switzerland''s Federal Council of seven members, whose presidency rotates every year. A Nigerian local government council, by contrast, has one elected chairman.'
      - 'Remember: college means a body of equals; collegiate means leaders take turns.'
      - 'The trap is B. A dual executive splits the head of state and the head of government between two people, but they do not rotate.'
    hint: 'Which kind of executive is a group of equals who take turns in the chair?'
    why:
      A: 'A single executive has one head, as in a presidential system, so there is no rotation.'
      B: 'A dual executive divides ceremonial and real power between two fixed offices, not a rotating chair.'
      C: 'Multi executive is not the name textbooks give; the rotating council of equals is the collegiate executive.'

  10:
    answer: B
    steps:
      - 'This is a rigid constitution.'
      - 'A rigid constitution is one that can be amended only by a special and difficult process, not by an ordinary law.'
      - 'Such a constitution has to be written down in one document, so that its special procedure for amendment can be set out and followed.'
      - 'Nigeria''s 1999 Constitution is rigid and written: section 9 says an amendment needs a two-thirds vote in each house of the National Assembly and approval by two-thirds of the State Houses of Assembly.'
      - 'Remember: rigid means hard to bend, and you can only make it hard to change if it is written down.'
      - 'The trap is C. An unwritten constitution, like Britain''s, can be changed by an ordinary Act of Parliament, so it is flexible, not rigid.'
    hint: 'What is the word for a constitution that is hard to change, and must it be written?'
    why:
      A: 'A flexible constitution is easy to amend, which is the opposite of what the question asks.'
      C: 'An unwritten constitution is flexible, since ordinary laws can change it; it cannot be rigid.'
      D: 'Flexible and rigid are opposites; a constitution cannot be both.'

  11:
    answer: C
    steps:
      - 'This is the United Nations, founded on the twenty-fourth of October, 1945.'
      - 'The first purpose in its Charter is to maintain international peace and security.'
      - 'It does this through the Security Council, peacekeeping forces, mediation and sanctions, which is its main political work.'
      - 'Nigeria joined the UN on the seventh of October, 1960, and has sent troops to many UN peacekeeping missions, starting with the Congo in 1960.'
      - 'Remember: the UN was born after the Second World War to stop a third one.'
      - 'The trap is A. Economic development is real UN work, but it is economic and social, not political.'
    hint: 'Why was the UN set up just after the Second World War?'
    why:
      A: 'Economic development is part of the UN''s economic and social work, not its political achievement.'
      B: 'Educational development is the work of UNESCO, a specialized agency, not the UN''s political achievement.'
      D: 'The UN works with governments of all types; promoting democratic institutions is not its main political purpose.'

  12:
    answer: D
    steps:
      - 'This is the elective principle, the right of people to choose their representatives by election.'
      - 'The Clifford Constitution of 1922 first introduced it, giving four elected seats in the Legislative Council: three for Lagos and one for Calabar.'
      - 'Elections needed parties to contest them, so the elective principle led to the first political parties in Nigeria.'
      - 'Herbert Macaulay formed the Nigerian National Democratic Party in 1923 to contest the Lagos seats.'
      - 'Remember: Clifford came first, 1922, and so did elections.'
      - 'The trap is A. The Richards Constitution of 1946 is remembered for regionalism, but elections had already begun in 1922.'
    hint: 'Which is the earliest of the four constitutions?'
    why:
      A: 'The Richards Constitution (1946) introduced regionalism; the elective principle had come in 1922.'
      B: 'The Macpherson Constitution (1951) widened elections, but it did not introduce them.'
      C: 'The Lyttleton Constitution (1954) brought true federalism, long after elections began in 1922.'

  13:
    answer: B
    steps:
      - 'This is the party system of the First Republic, 1960 to 1966.'
      - 'The three major parties were the NPC, based in the Northern Region; the NCNC, strongest in the East; and the Action Group, based in the West.'
      - 'Each party drew its main support from the largest ethnic group of its region, Hausa-Fulani, Igbo and Yoruba, because the regional structure made the region the prize of politics.'
      - 'The parties formed governments in their home regions, and the NPC and NCNC formed the federal coalition after the 1959 election.'
      - 'Remember: one region, one big tribe, one big party.'
      - 'The trap is A. The NCNC began with a national outlook, but by the First Republic all three parties had a regional and ethnic base.'
    hint: 'Where did each of the NPC, NCNC and AG get most of its votes?'
    why:
      A: 'The parties drew their support mainly from one region each, so they lacked a national outlook.'
      C: 'Parties in the First Republic were funded by members and supporters, not mainly by government.'
      D: 'Their base was regional and ethnic more than religious; religion was not the main appeal of the three parties.'

  14:
    answer: C
    steps:
      - 'This is about how the civil service develops.'
      - 'Professionalism means civil servants are trained, skilled and expert in their work, and are hired and promoted on merit.'
      - 'A civil service grows in quality only when its staff are well trained and expert, because good advice and good administration need knowledge.'
      - 'In Nigeria, the Administrative Staff College of Nigeria at Topo, Badagry, set up in 1973, trains public servants for this purpose.'
      - 'Remember: neutrality, impartiality and anonymity tell a civil servant how to behave; professionalism makes the service grow.'
      - 'The trap is A. Impartiality is a principle of conduct, treating everyone fairly, but it does not by itself develop the service.'
    hint: 'Three options are rules of behaviour. Which one is about skill and training?'
    why:
      A: 'Impartiality is a principle of conduct, serving everyone fairly; it does not by itself develop the service.'
      B: 'Anonymity means civil servants stay out of the public eye while ministers take the credit or blame; it is a rule of conduct, not a means of development.'
      D: 'Neutrality means serving any government without party bias; it is a rule of conduct, not what builds the service.'

  15:
    answer: B
    steps:
      - 'This is the presidential system of government.'
      - 'In a presidential system, one person, the president, is both head of state and head of government: a single chief executive.'
      - 'The president is elected for a fixed term, holds all executive power and appoints ministers who answer to him, so the system is called the chief executive system.'
      - 'Nigeria adopted the executive presidency with the 1979 Constitution, and it continues under the 1999 Constitution.'
      - 'Remember: one chief executive, one president.'
      - 'The trap is C. In the parliamentary system, executive power is shared by a prime minister and cabinet, with a separate ceremonial head of state.'
    hint: 'In which system is one person both head of state and head of government?'
    why:
      A: 'Federalism is about sharing power between tiers of government, not about the form of the executive.'
      C: 'The parliamentary system has a collective cabinet and a separate head of state, not a single chief executive.'
      D: 'Unitarism is about concentrating power at the centre, not about the form of the executive.'

  16:
    answer: D
    steps:
      - 'This is about how public corporations are financed.'
      - 'A public corporation is set up by an Act or decree, owned by government, and run to provide an essential service.'
      - 'Because government owns them and they provide services often at low prices, their main source of money is government subvention, that is grants from the treasury.'
      - 'In Nigeria, bodies like the Nigerian Railway Corporation have depended on yearly subventions in the federal budget.'
      - 'Remember: government owns it, so government mainly funds it.'
      - 'The trap is C. Corporations do earn money from fares and charges, but this is rarely enough to run them.'
    hint: 'Who owns a public corporation, and so who mainly pays for it?'
    why:
      A: 'Foreign aid may help some projects, but it is not the main source of funds for public corporations.'
      B: 'Public corporations have no private shareholders; shareholders'' funds finance private companies.'
      C: 'Fares and charges bring in some money, but they are rarely enough; government subvention is the main source.'

  17:
    answer: C
    steps:
      - 'This is about the history of public corporations in Nigeria.'
      - 'The Nigerian Railway Corporation was set up as a public corporation in 1955, taking over the government railway whose first line, Lagos to Ibadan, opened in 1901.'
      - 'The others are much younger: the Nigerian Mining Corporation was set up in 1972, the Nigerian Postal Service became a separate body in 1985, and the power distribution companies came out of the 2013 privatization.'
      - 'As a corporation, the railway is owned by the federal government but run like a business, carrying goods and passengers between Lagos, Kano and Port Harcourt.'
      - 'Remember: the railway carried Nigeria''s first exports, and it is the oldest of these corporations.'
      - 'The trap is D. The post office is old as a service, but NIPOST became a separate corporation only in 1985.'
    hint: 'Which of these services was set up first as a corporation, in the 1950s?'
    why:
      A: 'Power distribution companies were formed only when the power sector was privatized in 2013.'
      B: 'The Nigerian Mining Corporation was set up in 1972, long after the railway corporation.'
      D: 'The Nigerian Postal Service became a separate corporation only in 1985.'

  18:
    answer: C
    steps:
      - 'This is about the creation of states in Nigeria.'
      - 'On the twenty-third of September, 1987, the Babangida regime created two new states, Akwa Ibom and Katsina.'
      - 'Nigeria had 19 states since 1976, so the two new states made 21.'
      - 'The count went on rising: 30 states in 1991 and 36 states in 1996, which is the number today.'
      - 'Remember the ladder: 12 (1967), 19 (1976), 21 (1987), 30 (1991), 36 (1996).'
      - 'The trap is A. Nineteen was the number before 1987, created in 1976.'
    hint: 'Start from the 19 states of 1976. How many were added in 1987?'
    why:
      A: 'Nineteen states existed from 1976 until 1987, when two more were added.'
      B: 'Twelve states were created in 1967, replacing the four regions.'
      D: 'Thirty states came in 1991, four years later.'

  19:
    answer: D
    steps:
      - 'This is the ombudsman.'
      - 'An ombudsman is an official who receives and investigates complaints from citizens about abuse of power and injustice by public officers and bodies.'
      - 'It protects ordinary people cheaply and quickly, without the cost of going to court, and helps keep officials accountable.'
      - 'The idea began in Sweden in 1809. Nigeria''s ombudsman is the Public Complaints Commission, set up in 1975.'
      - 'Remember: ombudsman, the people''s complaints officer.'
      - 'The trap is B. Alternative dispute resolution settles quarrels between private parties; the ombudsman deals with complaints against public officers.'
    hint: 'Who would you write to if a public official treated you unfairly?'
    why:
      A: 'Educational services are the work of schools and education ministries, not the ombudsman.'
      B: 'Alternative dispute resolution settles private quarrels; the ombudsman handles complaints against public officers.'
      C: 'Providing jobs is the concern of employment agencies, not the ombudsman.'

  20:
    answer: A
    steps:
      - 'This is the structure of military regimes in Nigeria.'
      - 'Under General Yakubu Gowon, head of state from 1966 to 1975, the highest ruling body was the Supreme Military Council (SMC).'
      - 'The SMC made the major policy decisions and issued decrees, while the Federal Executive Council ran the ministries below it.'
      - 'Later regimes renamed their top body: Babangida''s was the Armed Forces Ruling Council (1985 to 1993) and Abacha''s the Provisional Ruling Council.'
      - 'Remember: Gowon, SMC; Babangida, AFRC; Abacha, PRC.'
      - 'The trap is B. The Federal Executive Council existed under Gowon, but it was below the SMC.'
    hint: 'What was the name of the top military council before 1985?'
    why:
      B: 'The Federal Executive Council ran the ministries but answered to the Supreme Military Council.'
      C: 'The Armed Forces Ruling Council was the top body of the Babangida regime, from 1985.'
      D: 'The National Council of State is an advisory body; it was not the apex ruling body under Gowon.'

  21:
    answer: D
    steps:
      - 'This is the Commonwealth of Nations, a voluntary association of Britain and most of its former colonies.'
      - 'The Commonwealth has no army, no court and no power to force its members to obey; it works by agreement.'
      - 'Because membership is voluntary, a member that disagrees can ignore a decision or leave, so the Commonwealth lacks the capacity to enforce its decisions.'
      - 'Nigeria joined the Commonwealth at independence in 1960; its strongest step against a member is suspension, which was applied to Nigeria from 1995 to 1999.'
      - 'Remember: the Commonwealth can advise and suspend, but it cannot compel.'
      - 'The trap is C. Cultural heterogeneity, the variety of its peoples, is a feature of the Commonwealth, not something it lacks.'
    hint: 'Can the Commonwealth force a member country to obey its decisions?'
    why:
      A: 'Members pay contributions and the Secretariat is funded, so finance is not its main weakness.'
      B: 'The Commonwealth has administrative structures, including a Secretariat in London headed by a Secretary-General.'
      C: 'The Commonwealth is very diverse in culture; it does not lack heterogeneity.'

  22:
    answer: C
    steps:
      - 'This is the Public Complaints Commission, Nigeria''s ombudsman.'
      - 'It was set up in 1975 to receive and investigate complaints by individuals and groups against public officers, ministries and agencies.'
      - 'It gives citizens a free and simple way to seek redress for injustice by officials, without the cost and delay of going to court.'
      - 'The commission has offices in the states, and any citizen can bring a complaint to it.'
      - 'Remember: public complaints commission, it handles the public''s complaints.'
      - 'The trap is D. An efficient work environment is a goal of the civil service; the commission''s goal is to address grievances.'
    hint: 'The name of the commission tells you what it handles.'
    why:
      A: 'Fair opportunities for government employees is the concern of the civil service commissions, not the Public Complaints Commission.'
      B: 'Training and promoting public servants is the work of the Civil Service Commission and training institutions.'
      D: 'Creating an efficient work environment is a goal of the civil service itself, not the main objective of this commission.'

  23:
    answer: D
    steps:
      - 'This is about the limits on pressure groups.'
      - 'A pressure group is an organised group that tries to influence government decisions without seeking to take over government.'
      - 'Its size, leadership and affiliations are its own features, which it can build up and which decide its strength. The state of the economy is an outside factor it cannot control.'
      - 'In a weak economy members cannot pay dues, funds for campaigns and lobbying run short, and members fear for their jobs, so the group''s activities are hampered.'
      - 'In Nigeria, groups such as the Nigeria Labour Congress depend on dues paid by their members.'
      - 'Remember: no money, no muscle.'
      - 'The trap is B. Leadership matters, but it is a source of strength the group can choose and change.'
    hint: 'Three options are the group''s own features. Which one lies outside its control?'
    why:
      A: 'A group''s size is a source of strength it can build up; a large membership helps it.'
      B: 'Leadership is the group''s own choice; good leaders strengthen it rather than hamper it.'
      C: 'Affiliation with other bodies can add support; it is a choice the group makes.'

  24:
    answer: D
    steps:
      - 'This is democracy.'
      - 'Democracy is government by the people, through representatives they freely elect; Abraham Lincoln called it government of the people, by the people and for the people.'
      - 'Its central feature is the consent of the people, because the government rules only with their agreement, given and renewed through regular free elections.'
      - 'In Nigeria, citizens give their consent by voting in general elections conducted by INEC.'
      - 'Remember: no consent, no democracy.'
      - 'The trap is C. Every government makes decisions, so decision making is not special to democracy.'
    hint: 'What does a democratic government need from the people that a dictatorship does not?'
    why:
      A: 'Every ruler, democratic or not, can influence people; it is not a special feature of democracy.'
      B: 'Every system, even a military regime, has office holders; this does not make it a democracy.'
      C: 'All governments make decisions; what marks democracy is that it rules by the people''s consent.'

  25:
    answer: B
    steps:
      - 'This is nationalism.'
      - 'Nationalism is the feeling of loyalty to one''s nation and, in a colony, the struggle to end foreign rule and win self-government.'
      - 'Colonial rule denied Africans a say in their own government, so educated Africans organised parties, newspapers and protests to demand self-rule.'
      - 'Nigerian nationalists such as Herbert Macaulay, Nnamdi Azikiwe and Obafemi Awolowo led this struggle until independence on the first of October, 1960.'
      - 'Remember: nationalists fight for their nation to rule itself.'
      - 'The trap is C. Patriotism is love of one''s country, but nationalism is the organised struggle against foreign rule.'
    hint: 'What was the movement that demanded independence for Nigeria called?'
    why:
      A: 'Imperialism is the policy of one country extending control over others, the very thing nationalism fought against.'
      C: 'Patriotism is love and loyalty to one''s country; it is not the name for the struggle for self-government.'
      D: 'Neo-colonialism is indirect control of an independent country by a foreign power, mostly through its economy.'

  26:
    answer: D
    steps:
      - 'This is the Are-Ona-Kakanfo of the Oyo Empire.'
      - 'The Are-Ona-Kakanfo was the commander of the Oyo army, in charge of defending the empire''s territory and leading its wars.'
      - 'He lived away from the capital, in a frontier town, so he could defend the borders, and he was expected never to lose a war.'
      - 'The title still exists in Yorubaland today as an honour given by the Alaafin of Oyo.'
      - 'Remember: Kakanfo, the field marshal.'
      - 'The trap is A. The Bashorun was a powerful leader, but he headed the Oyomesi, the council of kingmakers, not the army.'
    hint: 'Which Oyo title belonged to the army''s commander?'
    why:
      A: 'The Bashorun was the head of the Oyomesi, the council of kingmakers, not the army commander.'
      B: 'The Oyomesi was the council of seven kingmakers that checked the Alaafin, not the army.'
      C: 'The Aremo was the crown prince, the Alaafin''s eldest son, not the defender of the territory.'

  27:
    answer: A
    steps:
      - 'This is about measuring public opinion.'
      - 'Public opinion is the views of the people on public issues, and it can be measured by referendums, opinion polls, elections and the media.'
      - 'A referendum is effective because the whole electorate votes yes or no on one question, so the result shows the real majority view.'
      - 'In 1963, a referendum in the Western Region led to the creation of the Mid-Western Region.'
      - 'Remember: a referendum counts everyone''s view, not just a few.'
      - 'The trap is B. A radio interview hears only a few voices, which may not represent everyone.'
    hint: 'Which method lets every voter give a view and counts them all?'
    why:
      B: 'A radio interview gives the views of only a few people, which may not represent the public.'
      C: 'Letters to government come only from the few who choose to write, so they do not measure general opinion.'
      D: 'Telephone calls reach only those who call in, which is not a fair measure of the public view.'

  28:
    answer: C
    steps:
      - 'This is universal adult suffrage.'
      - 'Universal adult suffrage is the right of all qualified adult citizens to vote, whatever their sex, wealth, religion or education.'
      - 'It is universal because no group is shut out, but it still has qualifications, such as age, citizenship and registration, and it excludes people like those of unsound mind.'
      - 'In Nigeria, every citizen aged eighteen and above who has registered with INEC can vote.'
      - 'Remember: universal means everyone who qualifies, not literally everyone.'
      - 'The trap is A. All citizens includes children and others not qualified, so the word qualified matters.'
    hint: 'Can a ten-year-old citizen vote?'
    why:
      A: 'Not all citizens can vote; children and some others are excluded, so the vote goes to qualified citizens.'
      B: 'Limiting the vote to males is restricted suffrage, the opposite of universal.'
      D: 'Limiting the vote to females is also restricted, not universal.'

  29:
    answer: D
    steps:
      - 'This is the Sokoto Caliphate, set up after the jihad of Usman dan Fodio from 1804.'
      - 'In about 1812 Usman dan Fodio divided the empire into two parts for easier administration.'
      - 'His brother Abdullahi took the western section from Gwandu, and his son Muhammad Bello took the eastern section from Sokoto.'
      - 'The emirates in the west, such as Ilorin and Nupe, owed allegiance to Gwandu.'
