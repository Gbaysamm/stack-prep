format_version: 1
exam_year: 2018
subject: GOV
explanations:
  1:
    answer: C
    steps:
      - 'This is about the structures and systems of government Nigeria has actually used.'
      - 'Nigeria became independent on 1 October 1960 as a federation with a parliamentary system, and a Prime Minister, Sir Abubakar Tafawa Balewa, headed the government until January 1966.'
      - 'In May 1966 the military government of General Aguiyi-Ironsi issued Decree No. 34, which abolished the regions and made Nigeria a unitary state. Later in 1966 the federal structure was restored, and in 1979 the presidential system began.'
      - 'A confederation is a loose union of sovereign states that keep the final power for themselves. Nigeria has never been one; the Aburi meeting of January 1967 was read by some as pointing that way, but it was never put into practice.'
      - 'Remember: federal, then unitary for a few months, then federal again, but never confederal.'
      - 'The trap is A, unitary. It lasted only a few months in 1966, so it is easy to forget, but it did happen.'
    hint: 'Which of these structures would have let each part of Nigeria keep its own sovereignty?'
    why:
      A: 'Decree No. 34 of 1966 made Nigeria a unitary state for a few months under Aguiyi-Ironsi.'
      B: 'Nigeria was a federation at independence in 1960 and has been one for almost all of its history.'
      D: 'From 1960 to January 1966 Nigeria ran a parliamentary system, with a Prime Minister answerable to Parliament.'

  2:
    answer: D
    steps:
      - 'This is the Nigerian National Democratic Party (NNDP).'
      - 'The NNDP was founded in Lagos in 1923 by Herbert Macaulay, often called the father of Nigerian nationalism.'
      - 'It was formed because the Clifford Constitution of 1922 introduced the elective principle, giving Lagos three elected seats and Calabar one in the Legislative Council. A party was needed to contest them, and the NNDP won the Lagos seats in the elections that followed.'
      - 'The other big parties came much later: the NCNC in 1944, and the Action Group and the NPC in 1951, under the Macpherson Constitution.'
      - 'Remember: Clifford gave the vote in 1922, and Macaulay formed the NNDP in 1923 to use it.'
      - 'The trap is C, the NCNC. Macaulay was its first president too, but it was formed in 1944, more than twenty years after the NNDP.'
    hint: 'Which constitution first allowed elections, and which party was formed straight after it to contest them?'
    why:
      A: 'The Action Group was formed in 1951, from the Egbe Omo Oduduwa, under the Macpherson Constitution.'
      B: 'The NPC grew out of the Jamiyyar Mutanen Arewa and became a party only in 1951.'
      C: 'The NCNC was formed in 1944, more than twenty years after the NNDP.'

  3:
    answer: D
    steps:
      - 'This is the primary function of government, the one duty every other duty depends on.'
      - 'The first duty of any government is to maintain law and order: to protect lives and property and keep the peace within the state.'
      - 'Without law and order, no school can stay open, no road is safe and no business can run, so all the welfare services rest on it. This is also why the state alone keeps the police, the courts and the armed forces.'
      - 'Section 14(2)(b) of the 1999 Constitution says the security and welfare of the people shall be the primary purpose of government, and the Nigeria Police Force exists to keep that peace.'
      - 'Remember: peace first, then progress.'
      - 'The trap is A, building schools and hospitals. These are important welfare functions, but they are secondary; they can only happen once law and order is kept.'
    hint: 'Which duty must come first before any school, hospital or road can work?'
    why:
      A: 'Schools and hospitals are welfare services, secondary functions that depend on law and order being kept first.'
      B: 'Transport is a useful service, and many states leave it to private operators; it is not the primary function.'
      C: 'Campaigns and rallies are activities of political parties seeking power, not a function of government.'

  4:
    answer: C
    steps:
      - 'This is about the constitution and the people who operate it.'
      - 'A constitution is the set of rules by which a country is governed, and the operators are the leaders and officials who put those rules to work.'
      - 'Good rules in the hands of bad operators are ignored or abused, and good operators working with bad rules are limited by them. Good government needs both together.'
      - 'Nigeria''s 1999 Constitution sets out rights, the arms of government and the duties of the state, but how well it serves the people depends on how faithfully the President, the National Assembly, the courts and other officers carry it out.'
      - 'Remember: a good road also needs a good driver.'
      - 'The trap is B, good operators but a bad constitution. Good leaders help, but a bad constitution still ties their hands and gives no lasting protection once they leave.'
    hint: 'Think of a car and its driver. What do you need for a safe journey?'
    why:
      A: 'A good constitution is weakened when the people operating it abuse or ignore it.'
      B: 'Good operators are held back by a bad constitution, and their good conduct does not outlast them.'
      D: 'An illegitimate government is not accepted by the people, and acceptance is the basis of good government.'

  5:
    answer: A
    steps:
      - 'This is majority rule with minority rights, a basic principle of democracy.'
      - 'In a democracy, decisions are taken by the majority, but the rights of the minority are protected, so the losing side can still speak, organise and hope to win next time.'
      - 'Majority rule makes the government reflect what most people want; minority rights stop the majority from oppressing those who disagree.'
      - 'In Nigeria, bills in the National Assembly pass by majority vote, but Chapter IV of the 1999 Constitution protects every citizen''s rights, and the federal character principle guards against the domination of some groups by others.'
      - 'Remember: the majority has its way, the minority has its say.'
      - 'The trap is D, two political parties. Many democracies have more than two parties; the number of parties is not a principle of democracy.'
    hint: 'In a democracy, who decides, and what protects those who lose the vote?'
    why:
      B: 'Rule by a minority at the expense of the majority is oligarchy, the opposite of democracy.'
      C: 'Rule by the wealthy few is plutocracy, a kind of oligarchy, not democracy.'
      D: 'A democracy can have two parties or many; the number of parties is not a principle of democracy.'

  6:
    answer: D
    steps:
      - 'This is about the legal source of political authority.'
      - 'Authority is power that is lawful and accepted. In a democracy it comes from the people, through the votes of the electorate in free elections.'
      - 'Because the electorate gives power by law, it can also take it back at the next election, and that is what makes the authority legal.'
      - 'Section 14(2)(a) of the 1999 Constitution says sovereignty belongs to the people of Nigeria, from whom government derives all its powers and authority, and INEC conducts the elections through which they give it.'
      - 'Remember: the ballot, not the bullet.'
      - 'The trap is A, power from the gun. Force can seize control, but it is not a legal source of authority.'
    hint: 'In a democracy, who gives leaders the right to govern?'
    why:
      A: 'Power from the gun is force; it can seize control, but it is not lawful authority.'
      B: 'Economic power can buy influence, but wealth gives no legal right to rule.'
      C: 'A minority has no legal claim to rule over the majority.'

  7:
    answer: B
    steps:
      - 'This is the executive arm of government.'
      - 'The executive carries out laws and runs the government, and it also proposes most new laws by drafting bills and sending them to the legislature.'
      - 'It does this because it runs the ministries and knows what policies and money it needs, so it prepares the bills and the legislature debates and passes them.'
      - 'Under section 81 of the 1999 Constitution, the President lays the budget, the Appropriation Bill, before the National Assembly each year.'
      - 'Remember: the executive proposes, the legislature disposes.'
      - 'The trap is A, the House of Representatives. It is part of the legislature, which considers the bills; the question asks who sends them to it.'
    hint: 'Who sends the budget bill to the National Assembly each year?'
    why:
      A: 'The House of Representatives is part of the legislature, the body that receives and considers the bills.'
      C: 'The Senate is also part of the legislature; it considers bills sent to it.'
      D: 'The judiciary interprets laws and settles disputes; it does not propose bills.'

  8:
    answer: B
    steps:
      - 'This is political participation, taking part in politics by voting, standing for office and joining parties.'
      - 'A democracy allows every adult citizen to take part, so the only fair limits are general ones such as age, which apply to everyone in the same way.'
      - 'Age is used because a young child cannot yet make a mature political choice, and every citizen reaches the voting age in time. Religion, sex and class would shut out whole groups for ever, which is against equal rights.'
      - 'Section 77(2) of the 1999 Constitution gives the vote to every citizen who has reached eighteen years and is registered; the Constitution also sets minimum ages for those who stand for office.'
      - 'Remember: everyone grows up, so age shuts no one out for ever.'
      - 'The trap is C, sex. Women were once denied the vote in many countries, but in a democracy that is discrimination, not a fair limit.'
    hint: 'Which limit applies to every citizen in the same way and lifts with time?'
    why:
      A: 'Restricting participation by religion is discrimination and goes against freedom of religion.'
      C: 'Restricting participation by sex is discrimination; democracy gives men and women equal political rights.'
      D: 'Restricting participation by class favours the rich and breaks the principle of political equality.'

  9:
    answer: C
    steps:
      - 'This is disenfranchisement.'
      - 'To disenfranchise a person is to deny that person the right to vote. Franchise, or suffrage, means the right to vote.'
      - 'It can happen by law, for example to people who are not citizens or are under age, or wrongly, when people are kept from voting by violence or by losing their names from the register.'
      - 'In Nigeria, a citizen must register with INEC to vote, so a citizen who is left off the register is disenfranchised at that election.'
      - 'Remember: franchise is the vote, and dis takes it away.'
      - 'The trap is D, the right to vote and be voted for. That is the franchise itself, the exact opposite of disenfranchisement.'
    hint: 'Franchise means the right to vote. What does the prefix dis do to it?'
    why:
      A: 'The qualification of voters sets who may vote; it is not the denial of the vote.'
      B: 'Disqualifying aspirants stops people standing for office; it does not take away the right to vote.'
      D: 'The right to vote and be voted for is the franchise itself, the opposite of disenfranchisement.'

  10:
    answer: B
    steps:
      - 'This is the right to life and its limitation.'
      - 'The right to life is a fundamental human right, but the Constitution allows a lawful exception when a court sentences a person for a criminal offence of which he has been found guilty.'
      - 'The limit is lawful because it follows a fair trial in a court, not the wish of any person or official.'
      - 'Section 33(1) of the 1999 Constitution says no one shall be deprived of life intentionally, save in execution of the sentence of a court in respect of a criminal offence of which he has been found guilty.'
      - 'Remember: only a court''s sentence after a fair trial can limit the right to life.'
      - 'The trap is D, in the government. The government cannot take life at will; only a court sentence after a trial can limit the right.'
    hint: 'Section 33 of the Constitution names one exception to the right to life. Who decides it?'
    why:
      A: 'Ordinary people have no lawful power to take another person''s life.'
      C: 'The executive has no power to take life at will; it can only carry out a court''s sentence.'
      D: 'The government as a whole cannot take life at will; the limit applies only to a person a court has convicted.'

  11:
    answer: A
    steps:
      - 'This is political socialisation, the process by which people learn political values, beliefs and attitudes.'
      - 'Its agents are the family, the school and university, peer groups, the mass media, religious bodies and political parties.'
      - 'These agents shape what a person thinks about politics as he grows, through daily teaching and contact. Tourism is travel for pleasure; it does not regularly pass on political values.'
      - 'In Nigeria, civic education in schools, radio and television news, and the NYSC orientation camps all teach young people about the nation and its government.'
      - 'Remember: home, school, friends and media teach you politics; holidays do not.'
      - 'The trap is D, university. A university is a school too, so it is an agent of socialisation.'
    hint: 'Which of these does not regularly teach people political values?'
    why:
      B: 'The mass media are a strong agent; they inform people and shape their political opinions.'
      C: 'The peer group, friends of the same age, shapes political views, especially among the young.'
      D: 'A university is a school, and schools teach political values, so it is an agent.'

  12:
    answer: A
    steps:
      - 'This is political sovereignty.'
      - 'Sovereignty is supreme power in a state. Legal sovereignty is the power to make laws, held by the law-making body; political sovereignty is the power behind it, held by the people, the electorate.'
      - 'The people are politically sovereign because they choose the lawmakers and the government at elections, and can remove them at the next one.'
      - 'Section 14(2)(a) of the 1999 Constitution says sovereignty belongs to the people of Nigeria, from whom government through the Constitution derives all its powers and authority.'
      - 'Remember: parliament makes the law, but the people make the parliament.'
      - 'The trap is B, the government. The government exercises power, but only on behalf of the people who elected it.'
    hint: 'Who chooses the government and can remove it at the next election?'
    why:
      B: 'The government exercises power on behalf of the people; it does not own political sovereignty.'
      C: 'The military is under civilian authority in a democracy and holds no sovereignty.'
      D: 'Parliament holds legal sovereignty, the power to make laws, but political sovereignty lies with the people who elect it.'

  13:
    answer: B
    steps:
      - 'This is citizenship by naturalisation.'
      - 'Naturalisation is the way a foreigner who has lived in a country for a long time, and meets its conditions, becomes a citizen.'
      - 'The conditions include a long period of residence, good character, the intention to stay and an oath of allegiance. Twenty years of living in Nigeria meets the residence condition.'
      - 'Section 27 of the 1999 Constitution provides for naturalisation; it requires at least fifteen years of residence in Nigeria, among other conditions.'
      - 'Remember: a long stay leads to naturalisation.'
      - 'The trap is C, registration. Registration is for people with a close link to Nigeria, such as a foreign woman married to a Nigerian man or a person with a Nigerian grandparent, not for long residence alone.'
    hint: 'Which route to citizenship is based on many years of living in the country?'
    why:
      A: 'Nationalisation is the government taking over private businesses, not a way to become a citizen.'
      C: 'Registration is for people with a close family link to Nigeria, such as marriage to a Nigerian man or a Nigerian grandparent.'
      D: 'Marriage alone does not make a person a citizen; a foreign wife of a Nigerian must still apply by registration.'

  14:
    answer: C
    steps:
      - 'This is the head of state in a republican parliamentary system.'
      - 'A parliamentary system splits the two top offices. The Prime Minister is the head of government with real power, and the head of state is ceremonial.'
      - 'In a republic there is no king or queen, so the ceremonial head of state is a President, who signs bills, receives ambassadors and opens Parliament, but acts on the advice of the Prime Minister.'
      - 'When Nigeria became a republic on 1 October 1963, Dr Nnamdi Azikiwe became the ceremonial President, while Sir Abubakar Tafawa Balewa remained Prime Minister.'
      - 'Remember: in a parliamentary republic, the President reigns and the Prime Minister rules.'
      - 'The trap is D, the Queen. She was Nigeria''s head of state from 1960 to 1963, but a republic has no monarch.'
    hint: 'A republic has no monarch. Who takes the ceremonial role instead?'
    why:
      A: 'The Chief Justice heads the judiciary; he is not the head of state.'
      B: 'The Prime Minister is the head of government with real power, not the ceremonial head of state.'
      D: 'A Queen is head of state only in a monarchy; a republic has no monarch.'

  15:
    answer: A
    steps:
      - 'This is representative government.'
      - 'Representative government is government by people the citizens have chosen to act for them.'
      - 'The citizens choose them in a general election, and the same election lets them replace representatives who do not serve them well.'
      - 'In Nigeria, INEC conducts general elections every four years for the President, the National Assembly, the governors and the State Houses of Assembly.'
      - 'Remember: to represent you, someone must first be chosen by you.'
      - 'The trap is B, a military coup. It seizes power by force, and no one is chosen by the people.'
    hint: 'How do citizens choose those who will act for them?'
    why:
      B: 'A military coup takes power by force, so no one is chosen to represent the people.'
      C: 'Apartheid was South Africa''s system of racial segregation that denied the vote to the black majority.'
      D: 'Espionage is spying; it has nothing to do with choosing representatives.'

  16:
    answer: A
    steps:
      - 'This is delegated legislation.'
      - 'Delegated legislation is law made by a body other than the legislature, such as a minister, a commissioner or a local council, under powers given to it by an Act of the legislature.'
      - 'The legislature has too little time and too little technical knowledge to make every detailed rule, so it passes the main law and lets others make the details. This relieves it of its workload.'
      - 'In Nigeria, ministers make regulations under Acts of the National Assembly, and local government councils make bye-laws on matters such as markets and motor parks.'
      - 'Remember: the legislature makes the frame, others fill in the details.'
      - 'The trap is D, checking the executive. Delegated legislation does the opposite; it gives the executive more law-making power, which is why it must be watched.'
    hint: 'Why would a busy legislature hand some law-making to others?'
    why:
      B: 'Delegated legislation can weaken the rule of law, since laws are made by officials who are not elected for that purpose.'
      C: 'Fusion of powers is a feature of the parliamentary system; delegated legislation is not meant to create it.'
      D: 'Delegated legislation gives the executive more power to make rules, so it does not check the executive.'

  17:
    answer: D
    steps:
      - 'This is indirect rule in the Hausa-Fulani emirates.'
      - 'Indirect rule was the British policy, used by Lord Lugard in Northern Nigeria, of ruling through the traditional rulers and their institutions.'
      - 'It worked in the North because the emirates already had a centralised administration: the Emir, his officials such as the Waziri and the Galadima, a system of taxation and the Alkali courts. The British simply ruled through them.'
      - 'In the South East, where there were no such kings, the British appointed warrant chiefs, and indirect rule led to protests such as the Aba Women''s Riot of 1929.'
      - 'Remember: indirect rule needs a ready-made ruler to rule through.'
      - 'The trap is A, one religion. Islam helped hold the emirates together, but what made indirect rule work was the existing system of government, not the religion itself.'
    hint: 'What did the emirates already have that the British could use?'
    why:
      A: 'Islam helped unite the emirates, but indirect rule worked because of the existing administration, not religion alone.'
      B: 'Quranic education gave literacy in Arabic, but it is not why indirect rule succeeded.'
      C: 'Most people in the North were not descendants of Uthman dan Fodio; only the ruling families claimed that descent.'

  18:
    answer: B
    steps:
      - 'This is the French policy of association.'
      - 'Association was the French colonial policy that allowed Africans to keep their own cultures and institutions, while France ruled through chiefs it appointed and controlled.'
      - 'France had first tried assimilation, making Africans into French citizens in language, culture and law, but it proved too costly and was resisted. So France replaced it with association.'
      - 'Assimilation worked mainly in the Four Communes of Senegal, Dakar, Goree, Rufisque and Saint-Louis. Nigeria, ruled by Britain, had indirect rule instead.'
      - 'Remember: the French first tried to assimilate, then settled for association.'
      - 'The trap is A, the British. Association can sound like indirect rule, but Britain never gave up indirect rule for it.'
    hint: 'Which colonial power first tried to turn Africans into its own citizens?'
    why:
      A: 'Britain kept indirect rule; association was a French policy.'
      C: 'Association was French, not British, and it came after assimilation, not at first arrival.'
      D: 'Association was used while France ruled, not when it left West Africa.'

  19:
    answer: C
    steps:
      - 'This is African nationalism.'
      - 'Nationalism in Africa was the movement of Africans to end colonial rule and govern themselves.'
      - 'Through parties, newspapers, strikes and constitutional talks, nationalists pressed the colonial powers until they handed over power. That handing over is decolonisation.'
      - 'Nigerian nationalists such as Herbert Macaulay, Nnamdi Azikiwe, Obafemi Awolowo and Ahmadu Bello led the struggle, and Nigeria became independent on 1 October 1960.'
      - 'Remember: nationalism was the struggle, decolonisation was the result.'
      - 'The trap is A, political awareness among the colonialists. Nationalism raised awareness among Africans, not among the colonial rulers.'
    hint: 'What did the nationalists finally win from the colonial powers?'
    why:
      A: 'Nationalism raised political awareness among Africans, not among the colonialists.'
      B: 'Most new African states chose non-alignment, not alignment with a bloc.'
      D: 'Economic groupings such as ECOWAS came after independence; they were not the main result of nationalism.'

  20:
    answer: A
    steps:
      - 'This is the Richards Constitution, named after Governor Sir Arthur Richards. It was made in 1946 and came into force in 1947.'
      - 'It created a central Legislative Council in Lagos for the whole country, regional Houses of Assembly for the North, West and East, and a House of Chiefs in the North.'
      - 'Before it, the Legislative Council under the Clifford Constitution made laws only for the South, and the North was ruled by the Governor''s proclamations. Richards brought the North and South together in one legislature for the first time.'
      - 'Its three regions laid the base for the federal system Nigeria adopted later.'
      - 'Remember: Richards brought North and South into one room.'
      - 'The trap is D, the elective principle. That came earlier, with the Clifford Constitution of 1922.'
    hint: 'Before 1947, did the Legislative Council make laws for the North?'
    why:
      B: 'The Executive Council under Richards stayed in the hands of British officials; African ministers came only with the Macpherson Constitution of 1951.'
      C: 'Traditional rulers already took part in government through indirect rule; the House of Chiefs was a feature, not the major achievement.'
      D: 'The elective principle was introduced by the Clifford Constitution of 1922.'

  21:
    answer: C
    steps:
      - 'This is the Lyttleton Constitution of 1954.'
      - 'A federation is a system in which powers are shared by the constitution between a central government and the regions or states.'
      - 'The 1954 Constitution shared out powers in an exclusive list for the centre, a concurrent list for both, and residual matters for the regions. That division of functions is what made Nigeria a true federation.'
      - 'The 1999 Constitution still shares powers in the same way, with an Exclusive Legislative List and a Concurrent Legislative List.'
      - 'Remember: no division of powers, no federation.'
      - 'The trap is D, a Prime Minister at the centre. There was no federal Prime Minister in 1954; Balewa became the first one in 1957, and a Prime Minister does not make a federation anyway.'
    hint: 'What must be shared out between the centre and the regions for a country to be a federation?'
    why:
      A: 'The 1954 Constitution did not abolish the representation of British officials, and that has nothing to do with federalism.'
      B: 'Elections choose members of a legislature; they do not create a federation.'
      D: 'There was no federal Prime Minister until 1957, and a Prime Minister is a feature of the parliamentary system, not of federalism.'

  22:
    answer: B
    steps:
      - 'This is the separation of Lagos from the Western Region.'
      - 'At the London Constitutional Conference of 1953, the Colonial Secretary, Oliver Lyttelton, decided that Lagos should be separated from the Western Region and made a federal territory.'
      - 'This was done because Lagos was the federal capital and needed to be neutral ground for all the regions. The Action Group, which wanted Lagos kept in the West, strongly opposed the decision.'
      - 'The 1954 Lyttleton Constitution put the decision into effect. Lagos stayed the Federal Territory until Lagos State was created in 1967, and was the capital until the move to Abuja in 1991.'
      - 'Remember: decided in London in 1953, carried out in 1954.'
      - 'The trap is C, the 1954 conference. That year the constitution came into force, but the decision itself was taken in 1953.'
    hint: 'The decision came first and the constitution that carried it out came the next year.'
    why:
      A: 'The 1950 General Conference at Ibadan reviewed the Richards Constitution and led to the Macpherson Constitution; it did not separate Lagos.'
      C: 'The 1954 conference and constitution carried out the decision already taken in London in 1953.'
      D: 'By 1963 Lagos had long been the Federal Territory; that conference prepared the Republican Constitution.'

  23:
    answer: C
    steps:
      - 'This is about the first person to hold the offices of Head of State and Head of Government at the same time.'
      - 'From 1960 to 1963 the Head of State was the Queen, represented by the Governor-General, and from 1963 the ceremonial President, Dr Nnamdi Azikiwe. The Head of Government was the Prime Minister, Sir Abubakar Tafawa Balewa.'
      - 'In January 1966 the military took over and General J.T.U. Aguiyi-Ironsi became Head of the Federal Military Government and Supreme Commander of the Armed Forces. For the first time, one man held both offices.'
      - 'Military heads of state after him also held both offices, and in 1979 the presidential constitution made Alhaji Shehu Shagari the first elected executive President, who is both Head of State and Head of Government. Under the 1999 Constitution the President still holds both.'
      - 'Remember: before 1966 the two jobs were split; Ironsi was the first to hold both.'
      - 'The trap is D, Shagari. He was the first executive President, but the military heads before him had already held both offices.'
    hint: 'Before 1966, were the Head of State and the Head of Government the same person?'
    why:
      A: 'Lugard was a colonial Governor-General answerable to the British Crown, which was the head of state.'
      B: 'Balewa was Head of Government as Prime Minister, but the Head of State was the Queen and later President Azikiwe.'
      D: 'Shagari was the first executive President, but Aguiyi-Ironsi had already held both offices in 1966.'

  24:
    answer: A
    steps:
      - 'This is about political crises in Nigeria.'
      - 'In 1976 the military government of General Murtala Muhammed accepted the advice of the panel led by Justice Akinola Aguda and chose Abuja as the new Federal Capital, set up by Decree No. 6 of 1976. The seat of government moved there in 1991.'
      - 'Abuja was chosen because it is central and belongs to no single major ethnic group, so its adoption was widely accepted and did not cause a political crisis.'
      - 'The others did: Anthony Enahoro''s 1953 motion for self-government in 1956 split the House, led to a walkout of members from the South and the jeering of northern members in Lagos, and was followed by the Kano riots of 1953; the 1964 federal elections were boycotted in many places by one alliance; and the 1965 Western Region election was followed by widespread violence.'
      - 'Remember: Abuja was chosen to unite, so it did not divide.'
      - 'The trap is B. The motion was made in 1953, and the 1956 in it is the date it asked for self-government, so do not dismiss it as a later, calm event.'
    hint: 'Which of these was chosen precisely because it belonged to no single group?'
    why:
      B: 'Enahoro''s motion for self-government in 1956 split the House along regional lines and was followed by the Kano riots of 1953.'
      C: 'The 1965 Western Region election was followed by widespread violence and unrest in the region.'
      D: 'The 1964 federal elections were boycotted in many areas and led to a constitutional crisis over forming the government.'

  25:
    answer: A
    steps:
      - 'This is monarchy.'
      - 'A monarchy is a system of government headed by a king or queen who inherits the throne, usually from a parent.'
      - 'Power passes down a royal family, so the people do not choose the ruler by election.'
      - 'Nigeria is a republic, but traditional rulers such as the Alaafin of Oyo and the Emirs come to the throne from royal families. Britain and Saudi Arabia are monarchies today.'
      - 'Remember: monarchy is power passed down the royal family.'
      - 'The trap is D, aristocracy. That is rule by a privileged few, the best or noble class, not rule by one person who inherits the throne.'
    hint: 'In which system does a king''s child become the next ruler?'
    why:
      B: 'A diarchy is rule by two authorities sharing power, not inherited power.'
      C: 'In a democracy leaders are elected by the people, not born into power.'
      D: 'An aristocracy is rule by a privileged few, the noble class, not one ruler who inherits the throne.'

  26:
    answer: C
    steps:
      - 'This is accountability, a principle of democratic government.'
      - 'Accountability means that those in power must explain and answer for how they use public power and public money.'
      - 'When leaders must answer to the people, the legislature and the courts, they are less likely to abuse power, and the people''s trust in democracy grows.'
      - 'In Nigeria, public officers declare their assets to the Code of Conduct Bureau, and the Public Accounts Committees of the National Assembly examine how public money was spent.'
      - 'Remember: in a democracy, those who rule must answer to the people.'
      - 'The trap is D, lobbying. Lobbying is a lawful method of pressure groups, but it pushes one group''s interest, often for those with money and access, so it does not by itself promote democracy.'
    hint: 'Which of these makes leaders answer for what they do with power?'
    why:
      A: 'Gerrymandering is drawing constituency boundaries unfairly to favour one party; it damages democracy.'
      B: 'Slander is a false spoken statement that harms a person''s name; it is a civil wrong, not a way to promote democracy.'
      D: 'Lobbying advances one group''s interest and favours those with access, so it does not by itself promote democracy.'

  27:
    answer: A
    steps:
      - 'This is authority.'
      - 'Authority is the right and the ability to command obedience; it is power that is lawful and accepted by those who obey.'
