# UTME 2010 Government, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Government teacher works on the board:
# the question, the concept or institution named, the fact (who, what, when, where), why or how
# it works, a Nigerian link, a way to remember it, the trap, and the answer.
#
#   say:     heard, not read. Dates said as years, abbreviations spelled out the first time
#            with their full name, no symbols the voice would stop on.
#   write:   the one line written while it is said.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2010.yaml. Answers match that file. Q45 is not
# kept, so it has no lesson.
format_version: 1
exam_year: 2010
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'Every nation-state has one thing that makes it more than just a people. What is it?'
        write: 'Nation-state is synonymous with ?'
      - section: 'Name it'
        say: 'The idea here is the nation-state, a state whose people see themselves as one nation.'
        write: 'Nation-state = a nation that is also a state'
      - section: 'The fact'
        say: 'A state has four marks, which are territory, population, government and sovereignty.'
        write: 'State = territory + population + government + sovereignty'
      - section: 'Why it matters'
        say: 'Sovereignty is the supreme power to make and enforce laws, free from outside control. Without it, a nation is only a people, not a state.'
        write: 'Sovereignty = supreme power, no outside control'
      - section: 'In Nigeria'
        say: 'Nigeria became a sovereign state on the first of October, nineteen sixty. From then its own parliament made its laws, not Britain.'
        write: '1 October 1960: Nigeria sovereign'
      - section: 'Remember'
        say: 'Remember, no sovereignty, no state.'
        write: 'No sovereignty, no state'
      - section: 'The trap'
        say: 'Nationalism is tempting, but it is only the feeling that drives a people to seek a state. The state itself is marked by sovereignty.'
        write: 'Nationalism = the feeling, not the state'
      - section: 'Answer'
        say: 'So a nation-state is synonymous with sovereignty, which is option B.'
        write: '$\therefore$ sovereignty'
        answer: true
    traps:
      A: 'You went for self-actualization. That is a personal goal of reaching your full potential. It has nothing to do with statehood.'
      C: 'You chose liberation. Liberation is the act of freeing a people from foreign rule. It may come first, but it is an event, not the state.'
      D: 'You picked nationalism. Nationalism is the feeling that seeks a state. A nation-state is marked by the sovereignty it then holds.'
  3:
    moments:
      - section: 'The question'
        say: 'Why do people in one country vote and obey in their own special way? The answer lies in their political culture.'
        write: 'A fundamental component of political culture = ?'
      - section: 'Name it'
        say: 'The idea here is political culture.'
        write: 'Political culture'
      - section: 'The fact'
        say: 'Political culture is the set of beliefs, attitudes and values that a whole society holds about government and politics.'
        write: 'Political culture = beliefs + attitudes + values of a society'
      - section: 'How it works'
        say: 'Shared social values, like respect for authority or love of freedom, shape how people vote, obey laws and take part.'
        write: 'Social values → how people vote and obey'
      - section: 'In Nigeria'
        say: 'In Nigeria, respect for elders is a social value. That is why candidates visit emirs, obas and obis for their blessing before elections.'
        write: 'Respect for elders → candidates visit traditional rulers'
      - section: 'Remember'
        say: 'Remember, political culture is what a whole society values about power.'
        write: 'Whole society, shared values'
      - section: 'The trap'
        say: 'Family values tempt, but they guide one household. Political culture belongs to the whole society.'
        write: 'Family values: one household only'
      - section: 'Answer'
        say: 'So a fundamental component of political culture is social values, which is option A.'
        write: '$\therefore$ social values'
        answer: true
    traps:
      B: 'You went for family values. They guide one household, but political culture is shared by the whole society.'
      C: 'You chose community structure. That is how a community is organised, not the beliefs and values that make a culture.'
      D: 'You picked economic values. They are about wealth and trade, only one strand of a society''s values.'
  4:
    moments:
      - section: 'The question'
        say: 'Rule by a few can mean rule by the rich, the old or the gifted. Which name goes with the gifted?'
        write: 'Oligarchy of the gifted = ?'
      - section: 'Name it'
        say: 'The idea here is aristocracy.'
        write: 'Aristocracy'
      - section: 'The fact'
        say: 'An oligarchy is rule by a few. Aristocracy is rule by the few who are the best or most gifted.'
        write: 'Aristocracy = rule by the best few'
      - section: 'The word'
        say: 'It comes from the Greek aristos, which means best, and kratos, which means rule.'
        write: 'aristos = best, kratos = rule'
      - section: 'Why'
        say: 'The belief behind it is that the most able and wise should govern.'
        write: 'The most able should govern'
      - section: 'In Nigeria'
        say: 'In old Oyo, the Oyomesi were titled chiefs from leading lineages. They formed a council of nobles that checked the Alaafin.'
        write: 'Oyomesi: council of nobles in old Oyo'
      - section: 'Remember'
        say: 'Remember, aristo means best, so aristocracy is rule by the best.'
        write: 'aristo = best'
      - section: 'The trap'
        say: 'Plutocracy tempts, because it is also rule by a few. But those few are the rich, not the gifted.'
        write: 'Plutocracy = rule by the rich'
      - section: 'Answer'
        say: 'So the oligarchy of the gifted is aristocracy, which is option A.'
        write: '$\therefore$ aristocracy'
        answer: true
    traps:
      B: 'You went for theocracy. That is rule by priests or in the name of God, not by the gifted.'
      C: 'You chose plutocracy. That is rule by the rich, where wealth, not talent, gives power.'
      D: 'You picked gerontocracy. That is rule by the old, where age, not gift, gives power.'
  5:
    moments:
      - section: 'The question'
        say: 'Some heads of state are born to the throne. Others are voted in. What do we call a state led by an elected citizen?'
        write: 'State ruled by an elected citizen = ?'
      - section: 'Name it'
        say: 'The idea here is a republic.'
        write: 'Republic'
      - section: 'The fact'
        say: 'A republic is a state whose head is an ordinary citizen, elected for a fixed term, not a king or queen.'
        write: 'Republic = elected head, fixed term'
      - section: 'Why'
        say: 'Because the head is elected, power comes from the people, and they can take it back at the next election.'
        write: 'Power from the people'
      - section: 'In Nigeria'
        say: 'Nigeria became a republic on the first of October, nineteen sixty-three, when an elected President replaced the Queen as head of state.'
        write: '1 October 1963: Nigeria a republic'
      - section: 'Remember'
        say: 'Remember, a monarch is born to the throne, a republican head is voted in.'
        write: 'Born in, monarchy. Voted in, republic.'
      - section: 'The trap'
        say: 'Monarchy tempts because it also has one head. But a monarch inherits the throne for life and is never elected.'
        write: 'Monarchy = inherited, for life'
      - section: 'Answer'
        say: 'So a state ruled by an elected citizen is a republic, which is option C.'
        write: '$\therefore$ a republic'
        answer: true
    traps:
      A: 'You went for monarchy. A monarch inherits the throne. He or she is not an elected citizen.'
      B: 'You chose plutocracy. That is rule by the rich, and it does not depend on any election.'
      D: 'You picked an empire. An emperor rules many conquered peoples and is not elected.'
  6:
    moments:
      - section: 'The question'
        say: 'Nigeria has over a hundred million voters. Can they all sit in Abuja and make laws? So how does modern democracy work?'
        write: 'True democracy in the modern sense = ?'
      - section: 'Name it'
        say: 'The idea here is modern representative democracy.'
        write: 'Representative democracy'
      - section: 'The old way'
        say: 'In ancient Athens, the citizens met in one place and ruled directly. That is direct democracy.'
        write: 'Athens: citizens rule directly'
      - section: 'The modern way'
        say: 'A modern state has millions of people, so they elect representatives to make laws and govern for them.'
        write: 'Modern state: people elect representatives who rule'
      - section: 'Why'
        say: 'The people still hold power, because they can remove their representatives at the next election.'
        write: 'Voters can remove them'
      - section: 'In Nigeria'
        say: 'Nigerians elect one hundred and nine senators, three hundred and sixty members of the House of Representatives, and a President.'
        write: 'Senate 109 + House of Reps 360 + President'
      - section: 'Remember'
        say: 'Remember, modern democracy is government by the people''s chosen representatives.'
        write: 'Government by chosen representatives'
      - section: 'The trap'
        say: 'The majority ruling directly sounds more democratic, but it is direct democracy, which only works in a small community.'
        write: 'Majority rule directly = direct democracy'
      - section: 'Answer'
        say: 'So modern democracy exists where elected representatives rule, which is option A.'
        write: '$\therefore$ elected representatives rule'
        answer: true
    traps:
      B: 'You went for the majority ruling. That is direct democracy, possible only in a small city like ancient Athens.'
      C: 'You chose the majority voting. Voting alone is not enough, because a sham vote can be held anywhere. The elected people must actually rule.'
      D: 'You picked elite rule. Rule by a small elite is oligarchy, the opposite of democracy.'
  7:
    moments:
      - section: 'The question'
        say: 'Parliament votes that it has no confidence in the government. What happens next?'
        write: 'Vote of no confidence → ?'
      - section: 'Name it'
        say: 'The idea here is the vote of no confidence in a parliamentary system.'
        write: 'Vote of no confidence'
      - section: 'The fact'
        say: 'In a parliamentary system, the Prime Minister and cabinet stay in office only while they keep the support of the majority in parliament.'
        write: 'Cabinet stays only with majority support'
      - section: 'How it works'
        say: 'When that support is lost, the cabinet is bound together by collective responsibility. So it must resign, or ask for a fresh election.'
        write: 'Support lost → cabinet resigns'
      - section: 'In Nigeria'
        say: 'Nigeria used this system in the First Republic, from nineteen sixty to nineteen sixty-six, when Prime Minister Tafawa Balewa answered to the House of Representatives.'
        write: '1960 to 1966: Balewa answers to the House'
      - section: 'Remember'
        say: 'Remember, lose the House, lose the government.'
        write: 'Lose the House, lose the government'
      - section: 'The trap'
        say: 'Ceasing to trust the executive is the reason for the vote. What it means in practice is that the executive must go.'
        write: 'Loss of trust = reason. Resignation = result.'
      - section: 'Answer'
        say: 'So a vote of no confidence means the executive is required to resign, which is option C.'
        write: '$\therefore$ executive is required to resign'
        answer: true
    traps:
      A: 'You went for suspension. There is no suspension. A government that loses parliament''s confidence leaves office.'
      B: 'You chose the legislature ceasing to trust. That is the reason for the vote. The result the system attaches is resignation.'
      D: 'You picked legal proceedings. The vote is political, not a court case, so no trial follows.'
  8:
    moments:
      - section: 'The question'
        say: 'Abuja has the National Assembly and London has Parliament. What is the law-making body in Washington called?'
        write: 'Legislature of the U.S.A. = ?'
      - section: 'Name it'
        say: 'The institution here is the United States Congress.'
        write: 'Congress'
      - section: 'The fact'
        say: 'Congress has two chambers, the Senate and the House of Representatives.'
        write: 'Congress = Senate + House of Representatives'
      - section: 'What it does'
        say: 'It makes federal laws, approves the budget and checks the President, because the American constitution keeps it separate from the executive.'
        write: 'Makes laws, approves budget, checks the President'
      - section: 'In Nigeria'
        say: 'Nigeria''s National Assembly, with its Senate and House of Representatives, was modelled on Congress when Nigeria took up the presidential system in nineteen seventy-nine.'
        write: '1979: National Assembly modelled on Congress'
      - section: 'Remember'
        say: 'Remember, Washington has Congress, Abuja has the National Assembly, London has Parliament.'
        write: 'Washington, Congress. Abuja, National Assembly. London, Parliament.'
      - section: 'The trap'
        say: 'National Assembly tempts because it sounds familiar. But it is Nigeria''s name, not America''s.'
        write: 'National Assembly = Nigeria'
      - section: 'Answer'
        say: 'So the legislative body of the United States is Congress, which is option C.'
        write: '$\therefore$ Congress'
        answer: true
    traps:
      A: 'You went for Parliament. That is the name of the legislature in Britain and many Commonwealth countries.'
      B: 'You chose National Assembly. That is Nigeria''s legislature, not America''s.'
      D: 'You picked Council. Councils make laws for local governments and cities, not for the United States.'
  9:
    moments:
      - section: 'The question'
        say: 'Some legislatures have two houses and some have just one. Which of these countries has just one?'
        write: 'Unicameral legislature = ?'
      - section: 'Name it'
        say: 'The idea here is unicameralism.'
        write: 'Unicameralism'
      - section: 'The fact'
        say: 'Uni means one and camera means chamber. A unicameral legislature has one chamber. A bicameral one has two.'
        write: 'uni = one, bi = two, camera = chamber'
      - section: 'Israel'
        say: 'Israel''s legislature, the Knesset, has a single chamber of one hundred and twenty members.'
        write: 'Israel: Knesset, one chamber, 120 members'
      - section: 'Why'
        say: 'Unitary states often need only one chamber, because there are no federating units that need equal seats in a second house.'
        write: 'No federating units → one chamber is enough'
      - section: 'In Nigeria'
        say: 'Nigeria is bicameral. Its National Assembly has the Senate and the House of Representatives, because a federation needs a house where the states are equal.'
        write: 'Nigeria: Senate + House of Reps, bicameral'
      - section: 'Remember'
        say: 'Remember, uni means one, bi means two.'
        write: 'uni = 1, bi = 2'
      - section: 'The trap'
        say: 'The United Kingdom tempts because it has one Parliament. But that Parliament has two houses, the Commons and the Lords.'
        write: 'U.K. = Commons + Lords, two houses'
      - section: 'Answer'
        say: 'So unicameralism is a feature of the legislature in Israel, which is option A.'
        write: '$\therefore$ Israel'
        answer: true
    traps:
      B: 'You went for the United States. Its Congress has two chambers, the Senate and the House of Representatives.'
      C: 'You chose the United Kingdom. Its Parliament has two chambers, the House of Commons and the House of Lords.'
      D: 'You picked Nigeria. Our National Assembly has two chambers, the Senate and the House of Representatives.'
  10:
    moments:
      - section: 'The question'
        say: 'Lagos has many more people than Bayelsa. So why do both states send exactly three senators to Abuja?'
        write: 'Why an upper house in a federation?'
      - section: 'Name it'
        say: 'The institution here is the upper house, or Senate, of a federation.'
        write: 'Upper house = Senate'
      - section: 'The fact'
        say: 'In most federations the lower house is filled by population, while the upper house gives every unit the same number of seats.'
        write: 'Lower house: by population. Upper house: equal seats.'
      - section: 'Why'
        say: 'This protects small units from being outvoted by big ones, so the units stay equal partners.'
        write: 'Small units protected, units equal'
      - section: 'In Nigeria'
        say: 'Nigeria''s Senate has three senators for each of the thirty-six states and one for the Federal Capital Territory, which makes one hundred and nine.'
        write: '3 × 36 + 1 = 109 senators'
      - section: 'Remember'
        say: 'Remember, the lower house counts people, the upper house counts states.'
        write: 'Lower counts people, upper counts states'
      - section: 'The trap'
        say: 'Preventing executive excesses tempts, but both houses check the executive. That is not what makes the upper house special.'
        write: 'Checking the executive = both houses'
      - section: 'Answer'
        say: 'So the upper house is created to ensure equality of federating units, which is option A.'
        write: '$\therefore$ equality of federating units'
        answer: true
    traps:
      B: 'You went for preventing executive excesses. Both houses check the executive, so that is not why an upper house is created.'
      C: 'You chose overseeing the lower house. The two houses are partners in law-making, not a master and a junior.'
      D: 'You picked experienced elders. Some upper houses do use elders, but in a federation the purpose is equal representation of the units.'
  11:
    moments:
      - section: 'The question'
        say: 'Imagine a union where the members are stronger than the centre and can walk away. What is it called?'
        write: 'Units more powerful than the centre = ?'
      - section: 'Name it'
        say: 'The idea here is confederation.'
        write: 'Confederation'
      - section: 'The fact'
        say: 'A confederation is a loose union of sovereign states. The members keep most power, and the centre has only what they give it.'
        write: 'Confederation = loose union, units keep most power'
      - section: 'Why'
        say: 'The members joined as independent states and can leave, so the centre stays weak and often cannot even tax citizens directly.'
        write: 'Units can leave → weak centre'
      - section: 'Compare'
        say: 'In a unitary state power sits at the centre. In a federation it is shared. In a confederation it sits with the units.'
        write: 'Unitary: centre. Federal: shared. Confederal: units.'
      - section: 'In Nigeria'
        say: 'Nigeria is federal, not confederal. The nineteen ninety-nine Constitution gives sixty-eight subjects, like defence and currency, to the centre alone.'
        write: '1999 Constitution: 68 items on the Exclusive List'
      - section: 'Remember'
        say: 'Remember, in a confederation the members are the bosses.'
        write: 'Confederal: members are the bosses'
      - section: 'The trap'
        say: 'Federal tempts because power is shared there. But in a federation the centre usually holds the bigger powers.'
        write: 'Federal: centre usually stronger'
      - section: 'Answer'
        say: 'So the units are more powerful than the centre in a confederal system, which is option D.'
        write: '$\therefore$ confederal'
        answer: true
    traps:
      A: 'You went for monarchical. That tells us who heads the state, a king or queen, not how power is shared.'
      B: 'You chose federal. In a federation power is shared, and the centre usually holds the greater powers.'
      C: 'You picked unitary. In a unitary state all power lies with the central government.'
  12:
    moments:
      - section: 'The question'
        say: 'In fascist Italy, could the constitution limit the leader? The answer tells us what fascism believes.'
        write: 'Fascism: the leader is ?'
      - section: 'Name it'
        say: 'The idea here is fascism.'
        write: 'Fascism'
      - section: 'The fact'
        say: 'Fascism is a totalitarian ideology, first practised in Italy under Benito Mussolini from nineteen twenty-two.'
        write: 'Italy, Mussolini, from 1922'
      - section: 'How it works'
        say: 'It holds that the leader embodies the will of the nation, so he stands above the constitution and the law.'
        write: 'Leader = will of the nation → above the constitution'
      - say: 'Because the leader is above the law, opposition is not allowed.'
        write: 'No opposition allowed'
      - section: 'In Nigeria'
        say: 'Nigeria''s nineteen ninety-nine Constitution says the opposite in section one. The constitution is supreme and binds everyone, including the President.'
        write: '1999 Constitution, s.1: the constitution is supreme'
      - section: 'Remember'
        say: 'Remember, under fascism the leader is above the law. Under constitutionalism the law is above the leader.'
        write: 'Fascism: leader above law'
      - section: 'The trap'
        say: 'Being subordinate to the laws of the state sounds right, but that is the rule of law, which fascism rejects.'
        write: 'Subordinate to law = rule of law, not fascism'
      - section: 'Answer'
        say: 'So in fascist doctrine the leader is supreme relative to the constitution, which is option A.'
        write: '$\therefore$ supreme relative to the constitution'
        answer: true
    traps:
      B: 'You went for weak relative to the constitution. That describes constitutional government, the opposite of fascism.'
      C: 'You chose subordinate to the laws. That is the rule of law, which fascism rejects.'
      D: 'You picked subordinate to society''s norms. Fascism makes society serve the leader, not the other way round.'
  13:
    moments:
      - section: 'The question'
        say: 'In Britain there is a Queen and a Prime Minister. Which of them really runs the government?'
        write: 'Cabinet system: executive power exercised by ?'
      - section: 'Name it'
        say: 'The idea here is the cabinet, or parliamentary, system.'
        write: 'Cabinet system = parliamentary system'
      - section: 'The fact'
        say: 'The head of state, a monarch or a ceremonial president, has little real power. The head of government, the Prime Minister, exercises executive power with the cabinet.'
        write: 'Head of state: ceremonial. Head of government: real power.'
      - section: 'Why'
        say: 'The Prime Minister leads the majority in parliament, so he heads the cabinet that makes and carries out policy.'
        write: 'Prime Minister = leader of the majority'
      - section: 'In Nigeria'
        say: 'In the First Republic, Prime Minister Tafawa Balewa held executive power, while Nnamdi Azikiwe was the ceremonial head of state.'
        write: 'First Republic: Balewa rules, Azikiwe ceremonial'
      - section: 'Remember'
        say: 'Remember, in a cabinet system the head of state reigns and the head of government rules.'
        write: 'Head of state reigns, head of government rules'
      - section: 'The trap'
        say: 'The monarch tempts because the Queen is at the top. But she acts on the advice of the Prime Minister.'
        write: 'Monarch acts on ministers'' advice'
      - section: 'Answer'
        say: 'So in a cabinet system executive power is exercised by the head of government, which is option A.'
        write: '$\therefore$ head of government'
        answer: true
    traps:
      B: 'You went for the monarch. In a cabinet system the monarch is a ceremonial head who acts on ministers'' advice.'
      C: 'You chose the president. A president in a cabinet system, like Nigeria''s in nineteen sixty-three, is ceremonial.'
      D: 'You picked the dominant party. The party supplies the government, but the head of government and cabinet exercise the power.'
  14:
    moments:
      - section: 'The question'
        say: 'In which system can a minister never sit in the legislature? That is where the arms are kept furthest apart.'
        write: 'Separation of powers best practised in ?'
      - section: 'Name it'
        say: 'The idea here is separation of powers, taught by Montesquieu.'
        write: 'Separation of powers (Montesquieu)'
      - section: 'The fact'
        say: 'It means the legislature, the executive and the judiciary are kept apart, with different people and different jobs.'
        write: 'Legislature | Executive | Judiciary, kept apart'
      - section: 'Why'
        say: 'In a presidential system the President and ministers are not members of the legislature, so the arms are clearly separate.'
        write: 'Presidential: ministers outside the legislature'
      - section: 'In Nigeria'
        say: 'Sections four, five and six of the nineteen ninety-nine Constitution give law-making to the National Assembly, executive power to the President and judicial power to the courts.'
        write: '1999 Constitution: ss. 4, 5, 6'
      - section: 'Remember'
        say: 'Remember, presidential means separate and parliamentary means fused.'
        write: 'Presidential = separate. Parliamentary = fused.'
      - section: 'The trap'
        say: 'Parliamentary tempts, but there the ministers sit in parliament, so the executive and legislature are fused.'
        write: 'Parliamentary: ministers sit in parliament'
      - section: 'Answer'
        say: 'So separation of powers is best practised in the presidential system, which is option A.'
        write: '$\therefore$ presidential system'
        answer: true
    traps:
      B: 'You went for parliamentary. There the cabinet comes from parliament, so the executive and legislature are fused.'
      C: 'You chose monarchical. An absolute monarch holds all three powers in one person.'
      D: 'You picked feudal. A feudal lord made the rules, enforced them and judged them himself.'
  15:
    moments:
      - section: 'The question'
        say: 'Your local government says no trading on the roadside. Who gave it the power to make that law?'
        write: 'Typical delegated legislation = ?'
      - section: 'Name it'
        say: 'The idea here is delegated legislation.'
        write: 'Delegated legislation'
      - section: 'The fact'
        say: 'Delegated legislation is law made by a body other than the legislature, using power the legislature has passed down to it.'
        write: 'Law made by a lower body with power from the legislature'
      - section: 'Why'
        say: 'The legislature has no time for every local detail, so it lets councils and agencies make rules within limits.'
        write: 'Legislature too busy → delegates'
      - section: 'In Nigeria'
        say: 'A Nigerian local government council makes bye-laws on markets, motor parks and sanitation, under powers from the state House of Assembly.'
        write: 'Local government bye-laws: markets, motor parks, sanitation'
      - section: 'Remember'
        say: 'Remember, a bye-law is made by a body below the legislature.'
        write: 'Bye-law = law from below'
      - section: 'The trap'
        say: 'An act tempts, but an act is passed by the legislature itself, so it is primary, not delegated.'
        write: 'Act = made by the legislature itself'
      - section: 'Answer'
        say: 'So a typical form of delegated legislation is a bye-law, which is option D.'
        write: '$\therefore$ a bye-law'
        answer: true
    traps:
      A: 'You went for an act. An act is passed by the legislature itself, so it is not delegated.'
      B: 'You chose a bill. A bill is only a proposed law, not yet a law.'
      C: 'You picked a decree. A military government makes decrees itself, after taking over law-making, not by delegation.'
  16:
    moments:
      - section: 'The question'
        say: 'The law protects your rights. So when can the state take them away?'
        write: 'Rights withdrawn when the person ?'
      - section: 'Name it'
        say: 'The idea here is losing rights by due process of law.'
        write: 'Due process of law'
      - section: 'The fact'
        say: 'A citizen''s rights, such as liberty and the vote, can be withdrawn when a court convicts the person of a serious crime.'
        write: 'Convicted of a serious crime → rights withdrawn'
      - section: 'Why'
        say: 'The rights are protected by law, so only the law, through a fair trial and a sentence, can take them away.'
        write: 'Only the law can take what the law protects'
      - section: 'In Nigeria'
        say: 'Section thirty-five of the nineteen ninety-nine Constitution allows a person''s liberty to be taken in execution of a court''s sentence.'
        write: '1999 Constitution, s.35'
      - section: 'Remember'
        say: 'Remember, rights are lost in a court, not on the street.'
        write: 'Rights lost in court'
      - section: 'The trap'
        say: 'Violent opposition tempts, because it is a crime. But rights are withdrawn only after the person is tried and convicted.'
        write: 'First trial, then conviction'
      - section: 'Answer'
        say: 'So rights can be withdrawn if the person is convicted of a serious crime, which is option C.'
        write: '$\therefore$ convicted of a serious crime'
        answer: true
    traps:
      A: 'You went for violent opposition. It is a crime, but rights go only after trial and conviction, not for the act alone.'
