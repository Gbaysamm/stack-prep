# UTME 2011 Government, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Government teacher works on the board:
# the question, the concept or institution named, the fact stated, why or how it works, a
# Nigerian link, a way to remember it, the trap, and the answer.
#
#   say:     heard, not read. Dates said as years in words, abbreviations said letter by letter
#            with their full names the first time (words such as ECOWAS and OPEC stay words),
#            no symbols the voice would stop on.
#   write:   the one line written while it is said.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2011.yaml. Answers match that file. Q17 and Q45
# are dropped, so they have no lesson.
format_version: 1
exam_year: 2011
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'Nobody is born knowing what to think about government. So how do we pick up our political attitudes and beliefs?'
        write: 'Development of political attitudes and beliefs $= ?$'
      - section: 'The idea'
        say: 'This process is called political socialization.'
        write: 'Political socialization'
      - say: 'Political socialization is the process by which a person develops attitudes, beliefs and values about the political system.'
        write: 'Process of learning political attitudes, beliefs, values'
      - section: 'How it works'
        say: 'It happens through agents of socialization. These are the family, the school, friends, religious bodies, the mass media and political parties.'
        write: 'Agents: family, school, peers, religion, media, parties'
      - section: 'In Nigeria'
        say: 'A pupil who recites the National Pledge every morning is being socialized. So is a youth corps member who learns about another state during N Y S C, the National Youth Service Corps.'
        write: 'National Pledge at assembly; NYSC in another state'
      - section: 'Remember'
        say: 'Remember, socialization is the process, and the attitudes are what it produces.'
        write: 'Socialization = the process'
      - section: 'The trap'
        say: 'Political orientation sounds close, but orientation is the attitude you end up with, not the process of developing it.'
        write: 'Orientation = the result, not the process'
      - section: 'Answer'
        say: 'So the development of political attitudes and beliefs is political socialization, which is option B.'
        write: '$\therefore$ political socialization'
        answer: true
    traps:
      A: 'You went for political emancipation. Emancipation means setting a people free from political control, like winning independence.'
      C: 'You chose political participation. That is taking part in politics, such as voting or campaigning, not learning beliefs.'
      D: 'You picked political orientation. Orientation is the attitude a person ends up holding. The process that develops it is socialization.'
  3:
    moments:
      - section: 'The question'
        say: 'Why do some people queue for hours to vote, while others stay at home? Something guides how people behave in politics.'
        write: 'What governs political behaviour?'
      - section: 'The idea'
        say: 'That something is political culture.'
        write: 'Political culture'
      - say: 'Political culture is the set of shared attitudes, beliefs, values and feelings that a people hold about politics and government.'
        write: 'Shared attitudes, beliefs, values about politics'
      - section: 'How it works'
        say: 'These shared values decide how people act. They decide whether people vote, obey laws, trust leaders or protest.'
        write: 'Shared values → how people act in politics'
      - section: 'In Nigeria'
        say: 'Where people believe their vote counts, more of them turn out at I N E C elections. That is the Independent National Electoral Commission.'
        write: 'Trust in the vote → higher turnout at INEC elections'
      - section: 'Remember'
        say: 'Remember, socialization teaches the culture, and the culture steers the behaviour.'
        write: 'Socialization → culture → behaviour'
      - section: 'The trap'
        say: 'Political socialization is tempting, but it is only the way we learn the culture. It is the culture that guides behaviour.'
        write: 'Socialization teaches; culture governs'
      - section: 'Answer'
        say: 'So political behaviour is governed by political culture, which is option D.'
        write: '$\therefore$ political culture'
        answer: true
    traps:
      A: 'You went for political socialization. Socialization is how we learn political values. The values themselves, the culture, are what guide behaviour.'
      B: 'You chose political ideology. An ideology, like socialism, is a set of ideas held by some groups. It is not shared by a whole people.'
      C: 'You picked political economy. That is a field of study about politics and the economy, not what guides behaviour.'
  4:
    moments:
      - section: 'The question'
        say: 'In a democracy, who holds the final political power? Let us look at sovereignty.'
        write: 'Democratic nation, political sovereignty is with $?$'
      - section: 'The idea'
        say: 'Sovereignty is the supreme power of a state to make and enforce laws.'
        write: 'Sovereignty = supreme power to make and enforce laws'
      - say: 'Sovereignty has two sides. Legal sovereignty lies with the body that makes the law, such as parliament.'
        write: 'Legal sovereignty → the law-maker'
      - say: 'Political sovereignty lies with the people who choose that law-making body, because they put it there.'
        write: 'Political sovereignty → the people who choose it'
      - section: 'How it works'
        say: 'In a democracy the voters give power to leaders at an election, and they can take it back at the next one.'
        write: 'Voters give power, voters can take it back'
      - say: 'So the people who vote, the electorate, hold political sovereignty.'
        write: 'Electorate = all who can vote'
      - section: 'In Nigeria'
        say: 'Every four years, Nigerian voters elect the President, the National Assembly and the state Houses of Assembly. Those leaders hold power because the electorate gave it.'
        write: 'Every 4 years: President, National Assembly, state Assemblies'
      - section: 'Remember'
        say: 'Remember, the law maker is legally sovereign, and the voter is politically sovereign.'
        write: 'Law-maker: legal; voter: political'
      - section: 'The trap'
        say: 'The state is tempting, because the state possesses sovereignty in law. But political sovereignty rests with the electorate.'
        write: 'State = legal, not political'
      - section: 'Answer'
        say: 'So in a democratic nation, political sovereignty is vested in the electorate, which is option D.'
        write: '$\therefore$ the electorate'
        answer: true
    traps:
      A: 'You went for the community. A community is people living together. It is not the body of voters who choose the government.'
      B: 'You chose the state. The state holds legal sovereignty, but in a democracy political sovereignty rests with the voters.'
      C: 'You picked the elite. Power held by a small elite is oligarchy, not democracy.'
  5:
    moments:
      - section: 'The question'
        say: 'What marks out a democracy from other kinds of government?'
        write: 'A feature of democracy $= ?$'
      - section: 'The idea'
        say: 'Democracy is government of the people, by the people and for the people.'
        write: 'Democracy = of, by and for the people'
      - say: 'So the people must be asked. This asking is called popular consultation.'
        write: 'Popular consultation = asking the people'
      - section: 'How it works'
        say: 'The people are consulted through periodic elections, referendums and public hearings. Without asking them, there is no consent, and without consent there is no democracy.'
        write: 'Elections, referendums, public hearings → consent'
      - section: 'In Nigeria'
        say: 'I N E C, the Independent National Electoral Commission, holds general elections every four years. National Assembly committees also hold public hearings on bills.'
        write: 'INEC elections every 4 years; public hearings'
      - section: 'Remember'
        say: 'Remember, democracy asks the people.'
        write: 'Democracy asks the people'
      - section: 'The trap'
        say: 'State responsibilities to society sounds good, but every government has those duties, democratic or not.'
        write: 'Duties to society: every government'
      - section: 'Answer'
        say: 'So a feature of democracy is popular consultation, which is option D.'
        write: '$\therefore$ popular consultation'
        answer: true
    traps:
      A: 'You went for interdependence of states. That is about relations between countries, not how a country is governed.'
      B: 'You chose state responsibilities to society. Every government has those, so they do not mark out democracy.'
      C: 'You picked power in minority parties. Democracy is rule by the majority, with protection for the minority.'
  6:
    moments:
      - section: 'The question'
        say: 'Who owns the farms, factories and banks? One ideology says private people should.'
        write: 'Private ownership of means of production $→ ?$'
      - section: 'The idea'
        say: 'That ideology is capitalism.'
        write: 'Capitalism'
      - say: 'Under capitalism, the means of production, such as land, factories and capital, are owned by private people and run for profit.'
        write: 'Means of production privately owned, run for profit'
      - section: 'How it works'
        say: 'Prices are set by demand and supply in the market, and the hope of profit drives owners to produce.'
        write: 'Market prices; profit motive'
      - section: 'In Nigeria'
        say: 'Private banks, factories and traders work in Nigeria, and privatization moved many government companies into private hands.'
        write: 'Private banks, factories; privatization'
      - section: 'Remember'
        say: 'Remember, capitalism means capital in private hands.'
        write: 'Capitalism = capital in private hands'
      - section: 'The trap'
        say: 'Fascism is tempting, because it allowed private business. But under fascism the state controlled everything, so private ownership is not its central idea.'
        write: 'Fascism: state control first'
      - section: 'Answer'
        say: 'So private ownership of the means of production is central to capitalism, which is option C.'
        write: '$\therefore$ capitalism'
        answer: true
    traps:
      A: 'You went for fascism. Fascism is about a totalitarian state and extreme nationalism, with business under state control.'
      B: 'You chose feudalism. Feudalism is about land held from a lord in return for service, not private capital.'
      D: 'You picked communism. Communism abolishes private ownership, so the means of production are owned in common.'
  7:
    moments:
      - section: 'The question'
        say: 'Picture a ladder of king, lords, vassals and serfs, each holding land from the one above. What do we call that system?'
        write: 'Hierarchy of land ownership $= ?$'
      - section: 'The idea'
        say: 'It is feudalism, the system of medieval Europe.'
        write: 'Feudalism'
      - say: 'The king granted land to lords, the lords granted land to vassals, and serfs worked the land in return for protection.'
        write: 'King → lords → vassals → serfs'
      - section: 'How it works'
        say: 'Each rank held land from the one above and owed it loyalty and service. So the whole society was a ladder built on land.'
        write: 'Land for loyalty and service'
      - section: 'In Nigeria'
        say: 'Pre-colonial Hausa-Fulani emirates had a similar pattern, with fiefs held by title holders under the Emir. Textbooks often call them feudal.'
        write: 'Emirates: fiefs held under the Emir'
      - section: 'Remember'
        say: 'Remember, feudal comes from fief, a piece of land held from a lord.'
        write: 'Feudal ← fief'
      - section: 'The trap'
        say: 'Communism may tempt you, but communism abolishes private land ownership, so it has no ladder of landholders.'
        write: 'Communism: no private land'
      - section: 'Answer'
        say: 'So a system based on hierarchies of land ownership is feudalism, which is option A.'
        write: '$\therefore$ feudalism'
        answer: true
    traps:
      B: 'You chose totalitarianism. That is total state control of life. It is defined by power, not by ranks of land holding.'
      C: 'You went for communism. Communism abolishes private land ownership, so there is no ladder of landholders.'
      D: 'You picked fascism. Fascism is a totalitarian, nationalist ideology, not a system of land ranks.'
  8:
    moments:
      - section: 'The question'
        say: 'Which body does law-like work without being the legislature? That is what quasi-legislative means.'
        write: 'Quasi-legislative functions $→ ?$'
      - section: 'The idea'
        say: 'Quasi means as if, or partly. A quasi-legislative body does some law making work, but it is not a law making house.'
        write: 'Quasi = as if, partly'
      - say: 'The textbook example is the civil service.'
        write: 'The civil service'
      - section: 'How it works'
        say: 'Civil servants draft bills for ministers. They also make detailed rules and regulations under powers delegated by the legislature.'
        write: 'Drafts bills; makes rules under delegated powers'
      - say: 'Laws are often broad, so the civil service fills in the details, and those rules bind the public like law.'
        write: 'Fills in the details of laws'
      - section: 'In Nigeria'
        say: 'Federal ministries draft the bills that ministers send to the National Assembly, and agencies issue regulations under its Acts.'
        write: 'Ministries draft bills; agencies issue regulations'
      - section: 'Remember'
        say: 'Remember, the civil service is quasi-legislative when it writes rules, and quasi-judicial when it settles disputes in tribunals.'
        write: 'Writes rules = quasi-legislative'
      - section: 'The trap'
        say: 'The judiciary is tempting, but the judiciary interprets laws and settles disputes. Its main work is judicial.'
        write: 'Judiciary = interprets law'
      - section: 'Answer'
        say: 'So the body that performs quasi-legislative functions is the civil service, which is option C.'
        write: '$\therefore$ the civil service'
        answer: true
    traps:
      A: 'You went for the judiciary. The judiciary interprets laws and settles disputes. That is its full judicial work, not a partial law making one.'
      B: 'You chose traditional institutions. Today they advise and keep custom, but they do not draft bills or regulations.'
      D: 'You picked the executive. The executive is a full arm that carries out laws. The textbook quasi-legislative body is the civil service that serves it.'
  9:
    moments:
      - section: 'The question'
        say: 'A confederation is a loose union of countries. What is its great weakness?'
        write: 'Major weakness of confederation $= ?$'
      - section: 'The idea'
        say: 'A confederation is a union of sovereign states with a weak central authority.'
        write: 'Confederation = sovereign states, weak centre'
      - section: 'How it works'
        say: 'The member states keep their sovereignty and give the centre only small powers. Each member is free to withdraw.'
        write: 'Members keep sovereignty, free to withdraw'
      - say: 'So when there is a serious quarrel, a member can simply pull out. The union tends to break up.'
        write: 'Quarrel → member pulls out → secession'
      - section: 'In Nigeria'
        say: 'At Aburi in January nineteen sixty-seven, leaders discussed a loose, confederal arrangement for Nigeria. The crisis ended in an attempted secession and civil war.'
        write: 'Aburi, Jan 1967 → attempted secession'
      - section: 'Remember'
        say: 'Remember, in a confederation the door is always open, so states walk out.'
        write: 'Open door → states walk out'
      - section: 'The trap'
        say: 'Over-concentration of authority may tempt you, but that is a weakness of a unitary state, the very opposite.'
        write: 'Too much power at centre = unitary'
      - section: 'Answer'
        say: 'So a major weakness of confederation is the tendency towards secession, which is option B.'
        write: '$\therefore$ tendency towards secession'
        answer: true
    traps:
      A: 'You went for over-concentration of authority. That is a weakness of a unitary state. A confederation has a weak centre.'
      C: 'You chose lack of local independence. Members of a confederation keep full independence, so this is the opposite problem.'
      D: 'You picked lack of common currency. A confederation can share a currency, and it is not the major weakness.'
  10:
    moments:
      - section: 'The question'
        say: 'A member of parliament sits in the capital, far from home. To whom must he report what happened in the house?'
        write: 'MPs report proceedings to $?$'
      - section: 'The idea'
        say: 'This is representation. Each member is elected by the voters of one area, called a constituency.'
        write: 'Constituency = the area a member represents'
      - section: 'How it works'
        say: 'Because the member speaks for the constituency, he must tell its people what the house did.'
        write: 'Speaks for them → reports to them'
      - say: 'That way the voters can judge his work at the next election.'
        write: 'Voters judge him at the next election'
      - section: 'In Nigeria'
        say: 'Each member of the House of Representatives represents a federal constituency and holds town hall meetings to report back.'
        write: 'Federal constituency; town hall meetings'
      - section: 'Remember'
        say: 'Remember, he is elected by the constituency, so he is answerable to the constituency.'
        write: 'Elected by → answerable to'
      - section: 'The trap'
        say: 'Political parties are tempting, because members belong to parties. But the people they represent are their constituents.'
        write: 'Party ≠ the people represented'
      - section: 'Answer'
        say: 'So members of parliament report the proceedings to their constituencies, which is option A.'
        write: '$\therefore$ constituencies'
        answer: true
    traps:
      B: 'You chose local government chairmen. They run councils. Legislators do not report to them.'
      C: 'You went for traditional rulers. They guard custom, but they are not the people a legislator represents.'
      D: 'You picked political parties. A member is loyal to his party, but he represents and reports to his constituency.'
  11:
    moments:
      - section: 'The question'
        say: 'Here are four countries. Three share power with their states. Which one keeps all power at the centre?'
        write: 'Which country is unitary?'
      - section: 'The idea'
        say: 'A unitary state has one central government that holds all power.'
        write: 'Unitary = one centre holds all power'
      - section: 'How it works'
        say: 'Any local bodies get their powers from the centre, and the centre can take them back.'
        write: 'Local powers given by the centre, can be withdrawn'
      - say: 'In a federal state, the constitution shares power between the centre and the states, so neither can take the other''s powers.'
        write: 'Federal = power shared by the constitution'
      - section: 'Check the options'
        say: 'Now the options. Nigeria, India and the United States all have states with their own powers, given by their constitutions. So all three are federal.'
        write: 'Nigeria, India, USA: federal'
      - say: 'Ghana is different. Its regions take their powers from one central government in Accra, so Ghana is unitary.'
        write: 'Ghana: unitary'
      - section: 'In Nigeria'
        say: 'Nigeria has been federal since nineteen fifty-four, except for a short time in nineteen sixty-six when Decree Number Thirty-four made it unitary.'
        write: 'Federal since 1954; Decree No. 34 of 1966'
      - section: 'Remember'
        say: 'Remember, unitary means one centre, and federal means shared power.'
        write: 'Unitary: one centre; federal: shared'
      - section: 'Answer'
        say: 'So the unitary state is Ghana, which is option D.'
        write: '$\therefore$ Ghana'
        answer: true
    traps:
      A: 'You went for Nigeria. Nigeria is a federation of thirty-six states and the Federal Capital Territory.'
      B: 'You chose India. India is a federation, and its constitution shares power between the Union and the states.'
      C: 'You picked the United States. It is the classic federation, with fifty states.'
  12:
    moments:
      - section: 'The question'
        say: 'Parliament can pause, end a session, or end altogether. Which one is ending a session by royal proclamation?'
        write: 'End a session by royal proclamation $= ?$'
      - section: 'The idea'
        say: 'That is prorogation.'
        write: 'Prorogation'
      - say: 'Prorogation is the formal ending of a session by proclamation of the head of state. Parliament still exists and meets again later.'
        write: 'Ends the session; same parliament meets again'
      - section: 'How it works'
        say: 'Adjournment is a short break within a session, decided by the house itself.'
        write: 'Adjournment = break within a session'
      - say: 'Dissolution ends the life of the parliament, so a new one must be elected.'
        write: 'Dissolution = parliament ends, new election'
      - section: 'In Nigeria'
        say: 'Under the nineteen sixty and nineteen sixty-three constitutions, the Governor-General and later the President could prorogue the Federal Parliament.'
        write: '1960, 1963: Governor-General, later President, prorogued'
      - section: 'Remember'
        say: 'Remember, adjourn is a pause, prorogue ends the session, and dissolve ends the parliament.'
        write: 'Pause → end session → end parliament'
      - section: 'Answer'
        say: 'So ending a session by royal proclamation is prorogation, which is option B.'
        write: '$\therefore$ prorogation'
        answer: true
    traps:
      A: 'You went for expiration. Parliament expires when its fixed term runs out, not by a proclamation ending one session.'
      C: 'You chose adjournment. That is a break within a session, decided by the house itself.'
      D: 'You picked dissolution. Dissolution ends the whole parliament and brings an election, not just one session.'
  13:
    moments:
      - section: 'The question'
        say: 'In a parliamentary system, where do the Prime Minister and the ministers come from?'
        write: 'Main feature of the parliamentary system $= ?$'
      - section: 'The idea'
        say: 'In a parliamentary system, the Prime Minister and the cabinet are members of the legislature.'
        write: 'PM and cabinet sit in parliament'
      - section: 'How it works'
        say: 'They come from the party with a majority of seats.'
        write: 'Chosen from the majority party'
      - say: 'So the executive and the legislature are joined in the same people. We call this fusion of powers.'
        write: 'Executive + legislature joined = fusion of powers'
      - say: 'Because the cabinet comes from parliament, it stays in office only while parliament trusts it. This trust is called the confidence of parliament.'
        write: 'Cabinet needs the confidence of parliament'
      - section: 'In Nigeria'
        say: 'In the First Republic, Sir Abubakar Tafawa Balewa was Prime Minister and also a member of the House of Representatives.'
        write: 'Tafawa Balewa: PM and member of the House'
      - section: 'Remember'
        say: 'Remember, in the parliamentary system, ministers sit in parliament.'
        write: 'Ministers sit in parliament'
      - section: 'The trap'
        say: 'Option A says all party members form the executive. That is too wide, because the executive is a small cabinet.'
        write: 'Executive = small cabinet'
      - section: 'Answer'
        say: 'So the main feature is that the executive is drawn from the legislature, which is option D.'
        write: '$\therefore$ executive drawn from the legislature'
        answer: true
    traps:
      A: 'You went for all party members. The executive is a small cabinet of ministers, not every member of the party.'
      B: 'You chose judges from the ruling party. Judges are independent and are not drawn from any party.'
      C: 'You picked electoral commissioners leaving at the end of their tenure. That happens in any system.'
  14:
    moments:
      - section: 'The question'
        say: 'Capitalism encourages private wealth and communism abolishes it. What does socialism do?'
        write: 'Socialism and private wealth $= ?$'
      - section: 'The idea'
        say: 'Socialism is a system where the state owns and controls the major means of production for the good of all.'
        write: 'State owns major means of production'
      - section: 'How it works'
        say: 'Large industries, banks and land belong to the state. Private property is allowed only on a small scale.'
        write: 'Private property on a small scale only'
      - say: 'So a person can own some wealth, but piling it up is limited, to stop a rich class from rising.'
        write: 'Accumulation limited'
      - section: 'In Nigeria'
        say: 'The nineteen ninety-nine Constitution tells the state to stop wealth gathering in the hands of a few. That is a socialist idea in Nigeria''s Fundamental Objectives.'
        write: '1999 Constitution: no concentration of wealth in few hands'
      - section: 'Remember'
        say: 'Remember, capitalism encourages private wealth, socialism limits it, and communism abolishes it.'
        write: 'Encourage → limit → abolish'
      - section: 'The trap'
        say: 'Prohibited is tempting, but that is the communist ideal. Socialism still allows some private property.'
        write: 'Prohibited = communism'
      - section: 'Answer'
        say: 'So in a socialist economy, private accumulation of wealth is limited, which is option C.'
        write: '$\therefore$ limited'
        answer: true
    traps:
      A: 'You went for prohibited. That is the communist ideal. Socialism still allows some private property.'
      B: 'You chose regulated. Every economy regulates wealth through tax and law. Socialism goes further and limits it.'
      D: 'You picked encouraged. Encouraging private wealth is the mark of capitalism.'
  15:
    moments:
      - section: 'The question'
        say: 'Who first sorted constitutions into types? We go back to ancient Greece.'
        write: 'Earliest classification of constitutions $→ ?$'
      - section: 'The idea'
        say: 'Aristotle, the Greek philosopher, studied the constitutions of about one hundred and fifty-eight Greek city-states.'
        write: 'Aristotle: about 158 city-state constitutions'
      - section: 'How it works'
        say: 'He grouped them by who rules, one, few or many, and whether they rule for the good of all.'
        write: 'Who rules? One, few, many. For whose good?'
      - say: 'Where rulers serve the good of all, he named three good forms. Rule by one is monarchy, rule by a few is aristocracy, and rule by many is polity.'
        write: 'Good forms: monarchy, aristocracy, polity'
      - say: 'Where rulers serve only themselves, each good form turns bad. Monarchy becomes tyranny, aristocracy becomes oligarchy, and polity becomes democracy.'
        write: 'Bad forms: tyranny, oligarchy, democracy'
      - say: 'By democracy here, Aristotle meant rule by the poor for their own good, not the democracy we know today.'
        write: 'Aristotle''s democracy = rule by the poor for themselves'
      - section: 'In Nigeria'
        say: 'We still classify constitutions today. The nineteen ninety-nine Constitution of Nigeria is written, rigid and federal.'
        write: '1999 Constitution: written, rigid, federal'
      - section: 'Remember'
        say: 'Remember, Aristotle is the father of political science and the first to sort constitutions.'
        write: 'Aristotle = father of political science'
      - section: 'The trap'
        say: 'Plato may tempt you. He was Aristotle''s teacher, but he wrote about an ideal state, not a classification of real ones.'
        write: 'Plato: the ideal state'
      - section: 'Answer'
        say: 'So the earliest classification of constitutions was the work of Aristotle, which is option A.'
        write: '$\therefore$ Aristotle'
        answer: true
    traps:
      B: 'You chose Rousseau. He wrote The Social Contract in the seventeen hundreds, long after Aristotle.'
      C: 'You went for K C Wheare. He wrote on modern federal government in the twentieth century.'
      D: 'You picked Plato. Plato described an ideal state. It was his student Aristotle who classified real constitutions.'
  16:
    moments:
      - section: 'The question'
        say: 'Having a constitution is one thing. Keeping to it is another. Which one is constitutionalism?'
        write: 'Constitutionalism $= ?$'
      - section: 'The idea'
        say: 'Constitutionalism is the principle that government must act within the limits set by the constitution.'
        write: 'Government acts within the constitution'
      - section: 'How it works'
        say: 'It limits power. Leaders cannot do as they please, citizens'' rights are protected, and courts can strike down actions that go beyond the constitution.'
        write: 'Limits power; protects rights; courts can strike down'
      - section: 'In Nigeria'
        say: 'Section one of the nineteen ninety-nine Constitution says the Constitution is supreme and binds every authority and person in Nigeria.'
        write: 'Section 1, 1999 Constitution: supreme and binding'
      - section: 'Remember'
        say: 'Remember, under constitutionalism the constitution rules the rulers.'
        write: 'The constitution rules the rulers'
      - section: 'The trap'
        say: 'Operating a constitution sounds close, but a constitution can be operated badly. Constitutionalism means keeping strictly to it.'
        write: 'Operating ≠ strict adherence'
      - section: 'Answer'
        say: 'So constitutionalism refers to strict adherence to a constitution, which is option D.'
        write: '$\therefore$ strict adherence to a constitution'
        answer: true
    traps:
      A: 'You went for drafting. Drafting is making a constitution, which comes before constitutionalism.'
      B: 'You chose amendment. Amendment is changing a constitution, not keeping to it.'
      C: 'You picked operating a constitution. It can be operated badly. Constitutionalism means strict adherence to it.'
  17:
    moments:
      - section: 'The question'
