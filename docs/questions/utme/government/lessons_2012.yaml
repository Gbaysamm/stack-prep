# UTME 2012 Government, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Government teacher works on the board:
# the question, the concept or institution named, the fact or definition, why or how it works,
# a Nigerian link, a way to remember it, and the answer. Government has no figures, so there
# are no doodles.
#
#   say:     heard, not read. Dates said as years or full dates, abbreviations said letter by
#            letter with the full name the first time (ECOWAS, NEPAD, OPEC stay as words), no
#            symbols the voice would stop on.
#   write:   the one line written while it is said.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2012.yaml. Answers match that file. Q1, the
# paper-type question, is left out, so 49 questions have lessons.
format_version: 1
exam_year: 2012
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'A union has power. A church has control. So what does the state have that nobody else has?'
        write: 'The state alone has the monopoly of ... ?'
      - section: 'Name it'
        say: 'The idea comes from the German writer Max Weber, in nineteen nineteen.'
        write: 'Max Weber (1919): definition of the state'
      - section: 'The fact'
        say: 'Weber said the state is the body that holds the monopoly of the legitimate use of physical force, which the question calls violence.'
        write: 'State = monopoly of the legitimate use of force (violence)'
      - say: 'A monopoly is a right that one body alone holds, with no one else sharing it.'
        write: 'Monopoly = held by one body alone'
      - say: 'Legitimate means lawful. Only the state may lawfully arrest, punish, imprison or use armed force.'
        write: 'Legitimate = lawful'
      - section: 'Why'
        say: 'Many groups have power or control, so those words do not mark the state out. Lawful force does.'
        write: 'Power, control: shared by many groups'
      - section: 'In Nigeria'
        say: 'In Nigeria only the Police, the armed forces and other lawful agencies may use force. A vigilante group that punishes people on its own is committing a crime.'
        write: 'Police, armed forces: lawful force. Vigilante punishment: a crime'
      - section: 'Remember'
        say: 'Remember, the state alone holds the lawful stick.'
        write: 'The state alone holds the lawful stick'
      - section: 'Answer'
        say: 'So the distinctive attribute of a state is the monopoly of violence, used lawfully, which is option C.'
        write: '$\therefore$ violence (lawful force)'
        answer: true
    traps:
      A: 'You went for control. Parents, employers and churches all exercise control, so it is not unique to the state.'
      B: 'You chose power. Parties, unions and rich people all have power. Only the lawful use of force belongs to the state alone.'
      D: 'You picked justice. Justice is an aim the state pursues, and traditional rulers settle disputes too, so the state has no monopoly of it.'
  3:
    moments:
      - section: 'The question'
        say: 'Is a state just people? Just land? Or something more?'
        write: 'State as a political entity = ?'
      - section: 'Name it'
        say: 'We are looking for the definition of a state.'
        write: 'Definition of a state'
      - section: 'The fact'
        say: 'A state is a group of people organised under a government within a definite territory, with sovereignty.'
        write: 'State = organised people + definite territory + government + sovereignty'
      - section: 'Why'
        say: 'People alone are not a state, and land alone is not a state. They become one when they are organised under a government over a fixed territory.'
        write: 'People alone ✗   land alone ✗   organised + territory ✓'
      - section: 'In Nigeria'
        say: 'Nigeria is a state. Its people live within fixed borders, under the Federal Government, and no outside power rules them.'
        write: 'Nigeria: people, borders, government, sovereignty'
      - section: 'Remember'
        say: 'Remember P T G S, which stands for population, territory, government and sovereignty.'
        write: 'P T G S'
      - section: 'Answer'
        say: 'So a state is an organised group within a definite territory, which is option A.'
        write: '$\therefore$ an organised group within a definite territory'
        answer: true
    traps:
      B: 'You went for an association of men. That could be a club or a union. It has no territory and no sovereignty.'
      C: 'You chose a branch of a nation. A nation is a people with a shared culture, and one state can hold many nations.'
      D: 'You picked a geographical location. That is only land. A state also needs people, a government and sovereignty.'
  4:
    moments:
      - section: 'The question'
        say: 'Nobody is born knowing how to vote or why to respect the flag. So how do we pick up political values?'
        write: 'Political values are acquired through ... ?'
      - section: 'Name it'
        say: 'The process is called political socialization.'
        write: 'Political socialization'
      - section: 'The fact'
        say: 'Political socialization is the process by which a person learns the political values, beliefs and attitudes of his society.'
        write: 'Learning the political values of your society'
      - section: 'How'
        say: 'It goes on all through life. The people and bodies that teach us these values are called the agents of socialization.'
        write: 'Agents = those who pass the values on'
      - say: 'The agents are the family, the school, our friends or peers, religious bodies, the mass media and political parties.'
        write: 'Family, school, peers, religion, media, parties'
      - section: 'In Nigeria'
        say: 'A Nigerian child recites the National Pledge at school assembly and hears parents talk about voting. That is socialization at work.'
        write: 'National Pledge at assembly, parents on voting'
      - section: 'Remember'
        say: 'Remember, socialization is how society passes its political values on.'
        write: 'Society passes values on'
      - section: 'Answer'
        say: 'So political values are acquired through political socialization, which is option C.'
        write: '$\therefore$ political socialization'
        answer: true
    traps:
      A: 'You went for re-orientation. That is an effort to change values people already have, not how they first get them.'
      B: 'You chose a political campaign. A campaign asks for votes at election time. It does not pass values from one generation to the next.'
      D: 'You picked indoctrination. Indoctrination forces one set of ideas on people. Values in a society come through the wider process of socialization.'
  5:
    moments:
      - section: 'The question'
        say: 'Lawmakers make the laws. But who chooses the lawmakers in a democracy?'
        write: 'Political sovereignty in a democracy lies with ... ?'
      - section: 'Name it'
        say: 'Sovereignty means supreme power. There are two kinds to tell apart.'
        write: 'Sovereignty = supreme power'
      - section: 'The fact'
        say: 'Legal sovereignty is the power to make laws, held by the legislature.'
        write: 'Legal sovereignty: the legislature'
      - say: 'Political sovereignty is the power behind it, and in a democracy it belongs to the electorate, which means the voters.'
        write: 'Political sovereignty: the electorate (voters)'
      - section: 'Why'
        say: 'The voters choose the lawmakers and the leaders, and can remove them at the next election. So the final power rests with them.'
        write: 'Voters choose and remove → final power'
      - section: 'In Nigeria'
        say: 'In Nigeria registered voters aged eighteen and above elect the President, the National Assembly, the governors and the state Houses of Assembly.'
        write: 'Voters 18+ elect President, National Assembly, governors, state Assemblies'
      - section: 'Remember'
        say: 'Remember, the legislature holds legal sovereignty and the voters hold political sovereignty.'
        write: 'Legal → legislature.  Political → voters'
      - section: 'Answer'
        say: 'So political sovereignty is vested in the electorate, which is option D.'
        write: '$\therefore$ the electorate'
        answer: true
    traps:
      A: 'You went for the legislature. It holds legal sovereignty, the power to make law, but it owes its seats to the voters.'
      B: 'You chose the elite. In a democracy a small group does not hold supreme power. Rule by a few is oligarchy.'
      C: 'You picked the executive. It carries out the laws and owes its office to the voters.'
  6:
    moments:
      - section: 'The question'
        say: 'The executive carries out laws. But there is one thing it does that changes what a court has decided. What is it?'
        write: 'A judicial function of the executive = ?'
      - section: 'Name it'
        say: 'It is called the prerogative of mercy.'
        write: 'Prerogative of mercy'
      - section: 'The fact'
        say: 'Under it the executive may grant a pardon, which frees one convicted person from his punishment.'
        write: 'Pardon: one offender freed from punishment'
      - say: 'It may also grant an amnesty, which is a pardon given to a whole group of offenders at once.'
        write: 'Amnesty: a pardon for a whole group'
      - say: 'And it may reduce a sentence, or delay the day it is carried out.'
        write: 'Reduce a sentence, or delay it'
      - section: 'Why'
        say: 'This changes the result of a judgement, and that is court work. So it is called a judicial function of the executive.'
        write: 'Changes a judgement → judicial function'
      - say: 'It acts as a last check, so that a harsh sentence or a mistake can be put right.'
        write: 'A last check on the courts'
      - section: 'In Nigeria'
        say: 'The nineteen ninety-nine Constitution gives this power to the President in section one hundred and seventy-five, and to a governor in section two hundred and twelve.'
        write: '1999 Constitution: s.175 (President), s.212 (Governor)'
      - section: 'Remember'
        say: 'Remember, mercy is the executive''s judicial power.'
        write: 'Mercy = the executive''s judicial power'
      - section: 'Answer'
        say: 'So the judicial function of the executive is granting amnesty, which is option A.'
        write: '$\therefore$ granting of amnesty'
        answer: true
    traps:
      B: 'You went for implementing judicial orders. That is enforcement, the normal executive job of carrying out decisions.'
      C: 'You chose ensuring obedience to the law. That is law enforcement, the core executive function, not a judicial one.'
      D: 'You picked appointing judges. That is an act of appointment. It does not decide or change any case.'
  7:
    moments:
      - section: 'The question'
        say: 'In one system the central government holds the supreme power, and every other unit gets only what the centre gives it. Which system is that?'
        write: 'Supreme power at the centre = ?'
      - section: 'Name it'
        say: 'This is the unitary system of government.'
        write: 'Unitary system'
      - section: 'The fact'
        say: 'In a unitary system the constitution places supreme power in one central government.'
        write: 'Supreme power → one central government'
      - section: 'How'
        say: 'Local bodies get only the powers the centre chooses to give them. The centre can create, change or abolish them.'
        write: 'Units get only delegated powers'
      - say: 'Compare a federal system. There the constitution shares power between the centre and the states, and the constitution itself is supreme.'
        write: 'Federal: power shared, the constitution supreme'
      - section: 'In Nigeria'
        say: 'In May nineteen sixty-six the Unification Decree abolished the regions and ran Nigeria in a unitary way. Britain is the classic unitary state.'
        write: 'Unification Decree No. 34 (May 1966); Britain'
      - section: 'Remember'
        say: 'Remember, unitary means one centre holds it all.'
        write: 'Unitary = one centre holds it all'
      - section: 'Answer'
        say: 'So the system with supremacy at the centre is the unitary system, which is option C.'
        write: '$\therefore$ unitary'
        answer: true
    traps:
      A: 'You went for federal. A federal constitution shares power between the centre and the states, so supremacy does not rest at the centre.'
      B: 'You chose confederal. In a confederation the member states keep supreme power, and the centre is weak.'
      D: 'You picked parliamentary. That describes how the executive relates to the legislature, not where supreme power lies.'
  8:
    moments:
      - section: 'The question'
        say: 'In one system the whole job of carrying out the laws rests on one leader. Which system?'
        write: 'Leader with ultimate responsibility to execute laws = ?'
      - section: 'Name it'
        say: 'This is the presidential system, also called presidentialism.'
        write: 'Presidential system'
      - section: 'The fact'
        say: 'All executive power is vested in the president, who is head of state and head of government.'
        write: 'President = head of state + head of government'
      - section: 'Why'
        say: 'Because the constitution places executive power in him, the ministers he appoints only assist him and answer to him.'
        write: 'Ministers assist and answer to the president'
      - section: 'In Nigeria'
        say: 'Section five of the nineteen ninety-nine Constitution vests the executive powers of the Federation in the President.'
        write: '1999 Constitution, s.5: executive power → the President'
      - section: 'Remember'
        say: 'Remember, in a presidential system the buck stops with the president.'
        write: 'The buck stops with the president'
      - section: 'Answer'
        say: 'So the system that gives one leader the ultimate responsibility to execute laws is presidentialism, which is option B.'
        write: '$\therefore$ presidentialism'
        answer: true
    traps:
      A: 'You went for parliamentarianism. There the prime minister and cabinet share executive power and answer to parliament together.'
      C: 'You chose dictatorship. A dictator seizes all power by force. The question describes executive power given by a constitution.'
      D: 'You picked autocracy. An autocrat holds every kind of power without limits, not just the duty to carry out laws.'
  9:
    moments:
      - section: 'The question'
        say: 'A law starts life as a draft. Who must look at that draft first?'
        write: 'A bill awaits the consideration of ... ?'
      - section: 'Name it'
        say: 'The draft is called a bill.'
        write: 'Bill'
      - section: 'The fact'
        say: 'A bill is the draft of a proposed law placed before the legislature.'
        write: 'Bill = draft law before the legislature'
      - section: 'How'
        say: 'The legislature debates it through its readings and the committee stage, then passes or rejects it.'
        write: 'Readings → committee → pass or reject'
      - say: 'Only after it is passed does it go to the executive to be signed. That signature is called assent, and with it the bill becomes an Act, which is a law.'
        write: 'Passed → assent → Act'
      - section: 'In Nigeria'
        say: 'In Nigeria a bill passed by the Senate and the House of Representatives becomes an Act when the President signs it.'
        write: 'Senate + House of Reps → President''s assent → Act'
      - section: 'Remember'
        say: 'Remember, a bill goes in and an Act comes out.'
        write: 'Bill in, Act out'
      - section: 'Answer'
        say: 'So a bill awaits the consideration of the legislature, which is option C.'
        write: '$\therefore$ the legislature'
        answer: true
    traps:
      A: 'You went for the executive. The executive signs a bill only after the legislature has passed it.'
      B: 'You chose the party caucus. A caucus may talk about a bill, but it has no legal power to pass it.'
      D: 'You picked the judiciary. The courts interpret laws after they are made. They do not consider bills.'
  10:
    moments:
      - section: 'The question'
        say: 'Who owns the factories, the farms and the banks? The answer tells you the system.'
        write: 'Private ownership of the means of production = ?'
      - section: 'Name it'
        say: 'Private ownership is the mark of capitalism.'
        write: 'Capitalism'
      - section: 'The fact'
        say: 'Under capitalism the means of production, such as land, factories and banks, are owned privately and run for profit.'
        write: 'Means of production → private owners, for profit'
      - section: 'How'
        say: 'Because owners keep their profit, they compete, and prices are set mostly by the market.'
        write: 'Profit → competition → market prices'
      - section: 'In Nigeria'
        say: 'A trader who owns her shop in Onitsha market is working in a capitalist way. Nigeria has a mixed economy with a large private sector.'
        write: 'Onitsha market trader; Nigeria: mixed economy'
      - section: 'Remember'
        say: 'Remember, capitalism means capital in private hands.'
        write: 'Capital in private hands'
      - section: 'Answer'
        say: 'So private ownership of the means of production is a feature of capitalism, which is option A.'
        write: '$\therefore$ capitalism'
        answer: true
    traps:
      B: 'You went for socialism. Socialism puts the means of production under the state or the community.'
      C: 'You chose communalism. That is common ownership by the community, as in traditional African land holding.'
      D: 'You picked communism. Communism abolishes private ownership altogether.'
  11:
    moments:
      - section: 'The question'
        say: 'In old Europe some people worked the land and others owned it. What were the two classes called?'
        write: 'Feudalism: serfs and ... ?'
      - section: 'Name it'
        say: 'The system is feudalism, the system of medieval Europe.'
        write: 'Feudalism (medieval Europe)'
      - section: 'The fact'
        say: 'The king granted land to lords, who were nobles, and serfs worked that land.'
        write: 'King → lords (own land) → serfs (work land)'
      - section: 'How'
        say: 'The serfs were tied to the land and gave labour and produce. In return the lords gave them protection and a plot to live on.'
        write: 'Serfs: labour.  Lords: protection + land'
      - section: 'A comparison'
        say: 'Some Nigerian writers compare the old tie between landlords and tenant farmers in parts of the North to this pattern.'
        write: 'Landlord and tenant farmer'
      - section: 'Remember'
        say: 'Remember, lords own the land and serfs work the land.'
        write: 'Lords own, serfs work'
      - section: 'Answer'
        say: 'So the two major classes in feudalism are the serfs and the lords, which is option C.'
        write: '$\therefore$ lords'
        answer: true
    traps:
      A: 'You went for the masses. That is a modern word for ordinary people, not a feudal class.'
      B: 'You chose vassals. A vassal was a lesser lord holding land from a greater lord, so vassals were on the landowning side.'
      D: 'You picked the elite. That is a modern word for a ruling few, not the name of a feudal class.'
  12:
    moments:
      - section: 'The question'
        say: 'Some constitutions are hard to change and some are easy. Which country has the easy kind?'
        write: 'A country with a flexible constitution = ?'
      - section: 'Name it'
        say: 'We want a flexible constitution.'
        write: 'Flexible constitution'
      - section: 'The fact'
        say: 'A flexible constitution can be amended the same way as an ordinary law, with no special procedure.'
        write: 'Flexible = amended like an ordinary law'
      - section: 'Why'
        say: 'Britain''s constitution is largely unwritten, so Parliament can change it by an ordinary Act with a simple majority.'
        write: 'Britain: unwritten, changed by an ordinary Act'
      - section: 'In Nigeria'
        say: 'The opposite is a rigid constitution, which can be changed only by a special procedure that is hard to meet.'
        write: 'Rigid = changed only by a special procedure'
      - say: 'For example, Nigeria''s constitution is rigid. Section nine needs two thirds of each house of the National Assembly and two thirds of the state Houses of Assembly.'
        write: 'Nigeria, s.9: two-thirds + two-thirds → rigid'
      - section: 'Remember'
        say: 'Remember, Britain bends easily, while written federal constitutions are rigid.'
        write: 'Britain bends'
      - section: 'Answer'
        say: 'So the country with a flexible constitution is Britain, which is option B.'
        write: '$\therefore$ Britain'
        answer: true
    traps:
      A: 'You went for South Africa. Its written constitution needs special majorities to change, so it is rigid.'
      C: 'You chose Benin Republic. It has a written constitution with a special amendment procedure, so it is rigid.'
      D: 'You picked the United States. Its constitution needs two thirds of Congress and three quarters of the states to change, which makes it very rigid.'
  13:
    moments:
      - section: 'The question'
        say: 'If the law is above everybody, what kind of power can nobody have?'
        write: 'The rule of law negates ... ?'
      - section: 'Name it'
        say: 'The principle is the rule of law, explained by A V Dicey in eighteen eighty-five.'
        write: 'Rule of law (A.V. Dicey, 1885)'
      - section: 'The fact'
        say: 'Dicey gave it three parts. The first is the supremacy of the law, which means the law is above everyone, rulers included.'
        write: '1. Supremacy of the law'
      - say: 'The second is equality before the law, which means the same law applies to everyone, rich or poor.'
        write: '2. Equality before the law'
      - say: 'The third is that the rights of citizens are protected by the ordinary courts.'
        write: '3. Rights protected by the courts'
      - section: 'Why'
        say: 'Absolute power is power with no limits, where a ruler can act as he likes.'
        write: 'Absolute power = power with no limits'
      - say: 'If the law is supreme, no ruler can act as he likes. So the rule of law rules out absolute power.'
        write: 'Law supreme → no absolute power'
      - section: 'In Nigeria'
        say: 'In Nigeria the courts can declare an act of government unlawful, and the nineteen ninety-nine Constitution limits the powers of every office holder.'
        write: 'Courts can strike down unlawful acts'
      - section: 'Remember'
        say: 'Remember, where the law rules, no man rules absolutely.'
        write: 'Where law rules, no man rules absolutely'
      - section: 'Answer'
        say: 'So the rule of law is a negation of absolute power, which is option D.'
        write: '$\therefore$ absolute power'
        answer: true
    traps:
      A: 'You went for equality before the law. That is one of the pillars of the rule of law, not its opposite.'
      B: 'You chose supremacy of the law. That is the first principle of the rule of law itself.'
      C: 'You picked limited power. Limited power is what the rule of law creates, not what it rules out.'
  14:
    moments:
      - section: 'The question'
        say: 'If one man makes the law, enforces it and judges his own case, what happens to your freedom?'
        write: 'To protect rights, the powers of the arms must be ... ?'
      - section: 'Name it'
        say: 'The principle is the separation of powers.'
        write: 'Separation of powers'
      - section: 'The fact'
        say: 'Montesquieu, in The Spirit of the Laws in seventeen forty-eight, taught that the three powers should be held by separate bodies.'
        write: 'Montesquieu, The Spirit of the Laws (1748)'
      - say: 'The three powers are making laws, carrying them out and judging cases. They belong to the legislature, the executive and the judiciary, the three arms of government.'
        write: 'Legislature makes, executive carries out, judiciary judges'
      - section: 'Why'
        say: 'If one body holds all three powers, it can make a harsh law, enforce it and judge its own case. Separating them stops tyranny.'
        write: 'All three in one hand → tyranny'
      - section: 'In Nigeria'
        say: 'In sections four, five and six, the nineteen ninety-nine Constitution gives law-making to the National Assembly, executive power to the President and judicial power to the courts.'
        write: 's.4 National Assembly, s.5 President, s.6 courts'
      - section: 'Remember'
        say: 'Remember, there are three arms in three hands, so no one hand holds everything.'
        write: 'Three arms, three hands'
      - section: 'Answer'
        say: 'So the powers of the arms of government must be separated, which is option C.'
        write: '$\therefore$ separated'
        answer: true
    traps:
      A: 'You went for fused. Fused powers gather authority in one place, and that is the danger to freedom.'
      B: 'You chose incorporated. That would join the powers together, the opposite of what protects freedom.'
      D: 'You picked rotated. Rotating powers among the arms is not a principle of democratic government.'
  15:
    moments:
      - section: 'The question'
        say: 'Parliament cannot write every small rule itself. So it passes some of the work down. Who does the passing down?'
        write: 'Delegated legislation is made by bodies other than ... ?'
      - section: 'Name it'
        say: 'This is delegated legislation.'
        write: 'Delegated legislation'
      - section: 'The fact'
        say: 'Delegated legislation is law made by a person or body to which parliament has given part of its law-making power.'
        write: 'Law-making power passed down from parliament'
      - say: 'For example, ministers make regulations and orders, and local governments make bye-laws.'
        write: 'Regulations, orders, bye-laws'
      - section: 'Why'
        say: 'Parliament has too little time and expertise for every detail. So it passes the main law, called the parent Act, and lets others fill in the details.'
        write: 'Parent Act → details by others'
      - section: 'In Nigeria'
        say: 'A local government council in Nigeria makes bye-laws on markets and motor parks, and a minister makes regulations under an Act of the National Assembly.'
        write: 'Council bye-laws on markets; ministerial regulations'
      - section: 'Remember'
        say: 'Remember, delegated means passed down from parliament.'
        write: 'Delegated = passed down from parliament'
      - section: 'Answer'
        say: 'So delegated legislation is made by bodies other than parliament, which is option C.'
        write: '$\therefore$ parliament'
        answer: true
    traps:
      A: 'You went for the president. The president and ministers often make delegated legislation, so they are not the ones left out.'
      B: 'You chose the governor. A governor and commissioners can also make regulations under a law, so they are among the delegates.'
      D: 'You picked the judiciary. Courts make their own rules of court under delegated powers too.'
  16:
    moments:
      - section: 'The question'
        say: 'Parliament takes a break between sessions. What do we call ending a session by proclamation?'
        write: 'Ending a session of parliament by royal proclamation = ?'
      - section: 'Name it'
        say: 'This is prorogation of parliament.'
        write: 'Prorogation'
      - section: 'The fact'
        say: 'A proclamation is a formal public announcement by the head of state. Prorogation is the end of a session by such a proclamation. The members keep their seats and meet again in the next session.'
        write: 'Session ends, members keep their seats'
      - section: 'Compare'
        say: 'Dissolution is different. It ends the whole parliament, every seat falls vacant, and a general election follows.'
        write: 'Dissolution: parliament ends → general election'
      - section: 'In Nigeria'
        say: 'In the First Republic the Governor-General, and from nineteen sixty-three the President, prorogued and dissolved Parliament on the Prime Minister''s advice.'
        write: 'First Republic: Governor-General, then President'
      - section: 'Remember'
        say: 'Remember, prorogue pauses and dissolve dismisses.'
        write: 'Prorogue pauses, dissolve dismisses'
      - section: 'Answer'
        say: 'So ending a session by royal proclamation is prorogation of parliament, which is option D.'
        write: '$\therefore$ prorogation of parliament'
        answer: true
    traps:
      A: 'You went for political impasse. That is a deadlock between parties, not a formal act that ends a session.'
      B: 'You chose dissolution. It also comes by proclamation, but it ends the whole parliament, not just one session.'
      C: 'You picked a vote of no confidence. That is passed by members against the government, not proclaimed by the head of state.'
  17:
    moments:
      - section: 'The question'
        say: 'You turn eighteen and you can vote. You can join a party and stand for office. What kind of right is that?'
        write: 'Right to take part in government = ?'
      - section: 'Name it'
        say: 'These are political rights.'
        write: 'Political rights'
      - section: 'The fact'
        say: 'Political rights are the rights to vote, to be voted for, to join a party and to hold public office.'
        write: 'Vote, be voted for, join a party, hold office'
      - section: 'Why'
        say: 'They let citizens choose and control their rulers, and that is what makes government democratic.'
        write: 'Citizens choose and control rulers'
      - section: 'In Nigeria'
        say: 'In Nigeria every registered citizen aged eighteen and above may vote in elections run by I N E C, the Independent National Electoral Commission.'
        write: 'Registered, 18+ → vote in INEC elections'
      - section: 'Remember'
        say: 'Remember, political rights are about the polls and the parties.'
        write: 'Polls and parties'
      - section: 'Answer'
        say: 'So the right to take part in government is a political right, which is option C.'
