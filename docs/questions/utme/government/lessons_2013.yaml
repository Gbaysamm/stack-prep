# UTME 2013 Government, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good government teacher works on the board:
# the question, the concept or institution named, the definition or fact, why or how it works,
# a Nigerian link, a way to remember it, and the answer. The traps speak to a student who chose
# each wrong option.
#
#   say:     heard, not read. Dates as years or full dates in words, abbreviations said letter by
#            letter with the full name the first time, unless they are words (ECOWAS, NEPAD).
#   write:   the one line written while it is said.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2013.yaml. Answers match that file. Q50 is
# dropped, so it has no lesson.
format_version: 1
exam_year: 2013
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'When power is delegated, how is it used? Directly, or some other way?'
        write: 'Delegated power is exercised ... ?'
      - section: 'Name it'
        say: 'To delegate is to hand your power to someone else, so that they use it on your behalf.'
        write: 'Delegate = hand power to an agent to use for you'
      - section: 'The fact'
        say: 'The real holder does not use the power in person. The agent uses it for them, so the holder exercises it indirectly.'
        write: 'Holder → agent → action = indirect'
      - section: 'Why'
        say: 'This is why representative democracy is also called indirect democracy. The people delegate their power to the people they elect.'
        write: 'Representative democracy = indirect democracy'
      - section: 'In Nigeria'
        say: 'Nigerian voters do not sit in the National Assembly. They elect senators and representatives, who make laws for them.'
        write: 'Voters → senators and representatives → laws'
      - section: 'Remember'
        say: 'Remember, to delegate is to send someone in your place, and power used through someone else is used indirectly.'
        write: 'Through someone else = indirectly'
      - section: 'Answer'
        say: 'So delegated power is exercised indirectly, which is option D.'
        write: '$\therefore$ indirectly'
        answer: true
    traps:
      A: 'You went for devolution. Devolution is one way of handing power down to a lower body, but it does not tell us how delegated power is used.'
      B: 'You chose directly. Power used directly is used by its holder in person, which is the opposite of delegating it.'
      C: 'You picked coercion. Coercion means force, and it has nothing to do with handing power to an agent.'
  3:
    moments:
      - section: 'The question'
        say: 'Sovereignty can be held by right or held in fact. How is de jure sovereignty acquired?'
        write: 'De jure sovereignty is acquired through ... ?'
      - section: 'Name it'
        say: 'De jure is Latin for by law. So de jure sovereignty means supreme power by right of law.'
        write: 'de jure = by law'
      - section: 'The fact'
        say: 'It is the supreme power that the law and the constitution recognise. So it is acquired through law.'
        write: 'De jure sovereignty ← law and constitution'
      - section: 'Why'
        say: 'Its opposite is de facto sovereignty, which is the power actually held by whoever controls force, even without legal right.'
        write: 'de facto = in fact, often by force'
      - section: 'In Nigeria'
        say: 'Section fourteen of the nineteen ninety-nine Constitution says sovereignty belongs to the people of Nigeria, and government gets its powers through the Constitution.'
        write: '1999 Constitution, s. 14(2)(a): sovereignty belongs to the people'
      - section: 'Remember'
        say: 'Remember, de jure means by law, and de facto means in fact.'
        write: 'de jure = law, de facto = fact'
      - section: 'Answer'
        say: 'So de jure sovereignty is acquired through law, which is option A.'
        write: '$\therefore$ law'
        answer: true
    traps:
      B: 'You went for grant. A grant gives a privilege, but legal sovereignty rests on the law and the constitution, not on a gift.'
      C: 'You chose treaty. A treaty binds states to one another. It is not where legal sovereignty inside a state comes from.'
      D: 'You picked force. Power seized by force is de facto sovereignty, which is the opposite of de jure.'
  4:
    moments:
      - section: 'The question'
        say: 'People living together under a common law, within a definite territory. What do we call that?'
        write: 'People + common law + definite territory = ?'
      - section: 'Name it'
        say: 'This is the state.'
        write: 'The state'
      - section: 'The fact'
        say: 'A state is a group of people living in a definite territory under one government and common laws, and free from outside control.'
        write: 'State = people in a territory under one government and law, sovereign'
      - section: 'How it works'
        say: 'A state has four features, which are population, territory, government and sovereignty. The common law comes from its government.'
        write: 'Population, Territory, Government, Sovereignty'
      - section: 'In Nigeria'
        say: 'Nigeria became a sovereign state on the first of October, nineteen sixty, with its own people, land, government and laws.'
        write: 'Nigeria, a sovereign state from 1 October 1960'
      - section: 'Remember'
        say: 'Remember P T G S, which stands for people, territory, government and sovereignty.'
        write: 'P T G S'
      - section: 'Answer'
        say: 'So the group described is a state, which is option D.'
        write: '$\therefore$ state'
        answer: true
    traps:
      A: 'You went for community. A community is any group sharing a place or an interest, and it need not have its own law or government.'
      B: 'You chose nation-state. That is a state whose people also share one culture, and the question says nothing about culture.'
      C: 'You picked nation. A nation is held together by a shared culture and history, not by a common law over a territory.'
  5:
    moments:
      - section: 'The question'
        say: 'How does a young person come to hold the political values of their society? Political socialization is the name for it.'
        write: 'Political socialization is associated with ... ?'
      - section: 'Name it'
        say: 'Political socialization is the process of passing political values from one generation to the next.'
        write: 'Political socialization = passing on political values'
      - section: 'How it works'
        say: 'It happens through agents such as the family, the school, friends, religious bodies and the mass media.'
        write: 'Agents: family, school, peers, religion, media'
      - say: 'Each agent teaches people how to see government and their own place in it.'
        write: 'Values, beliefs, attitudes → the next generation'
      - section: 'In Nigeria'
        say: 'Civic education in school, and the N Y S C, the National Youth Service Corps, both pass on values of national unity.'
        write: 'Civic education, NYSC: values of unity'
      - section: 'Remember'
        say: 'Remember, socialization means passing the political culture on.'
        write: 'Socialization = passing it on'
      - section: 'Answer'
        say: 'So political socialization is associated with the transmission of political values, which is option B.'
        write: '$\therefore$ the transmission of political values'
        answer: true
    traps:
      A: 'You went for military take-over. That is a coup, a seizure of power, not the passing on of values.'
      C: 'You chose political transition. A transition is a change from one government to another, not the learning of values.'
      D: 'You picked free choice of party programmes. That is political participation, which socialization prepares people for.'
  6:
    moments:
      - section: 'The question'
        say: 'Aristotle sorted governments by who rules and whom they rule for. What is rule by the few for the good of all?'
        write: 'Aristotle: the few rule for the benefit of all = ?'
      - section: 'Name it'
        say: 'Aristotle asked two things. How many rule, and do they rule for all or for themselves?'
        write: 'How many rule? For whom?'
      - section: 'The fact'
        say: 'For the good of all, rule by one is monarchy, rule by the few is aristocracy, and rule by the many is polity.'
        write: 'Good forms: one, monarchy. Few, aristocracy. Many, polity'
      - section: 'Why'
        say: 'When rulers serve only themselves, these turn into tyranny, oligarchy and democracy.'
        write: 'Bad forms: tyranny, oligarchy, democracy'
      - section: 'In Nigeria'
        say: 'In old Oyo, the Oyomesi were seven noble chiefs who chose the Alaafin and checked his power, a small group of nobles sharing in rule.'
        write: 'Oyomesi: seven noble chiefs in old Oyo'
      - section: 'Remember'
        say: 'Remember, aristos is Greek for the best, so aristocracy is rule by the best few for all.'
        write: 'aristos = the best'
      - section: 'Answer'
        say: 'So the few ruling for the benefit of all is aristocracy, which is option B.'
        write: '$\therefore$ aristocracy'
        answer: true
    traps:
      A: 'You went for diarchy. Diarchy is rule by two persons or bodies sharing power, not by a few for the good of all.'
      C: 'You chose autocracy. Autocracy is rule by one person with absolute power.'
      D: 'You picked polyarchy. That is a modern word for rule by many competing groups, not by a few.'
  7:
    moments:
      - section: 'The question'
        say: 'In some communities, the old people rule. What is that called?'
        write: 'Rule by the old people = ?'
      - section: 'Name it'
        say: 'This is gerontocracy.'
        write: 'Gerontocracy'
      - section: 'The fact'
        say: 'Gerontocracy is government by the elders, the old people of a community.'
        write: 'Gerontocracy = rule by the elders'
      - section: 'Why'
        say: 'It rests on the belief that age brings wisdom and experience, so the elders settle disputes and make the rules.'
        write: 'Age → wisdom → the right to rule'
      - section: 'In Nigeria'
        say: 'In many pre-colonial Igbo communities, a council of elders, with the holders of the ofo staff, met with the village assembly to rule.'
        write: 'Igbo council of elders, ofo holders'
      - section: 'Remember'
        say: 'Remember, geron is Greek for old man, as in geriatric care for the old.'
        write: 'geron = old man'
      - section: 'Answer'
        say: 'So rule by the old people is gerontocracy, which is option B.'
        write: '$\therefore$ gerontocracy'
        answer: true
    traps:
      A: 'You went for monarchy. A monarch may be old, but monarchy means rule by one hereditary ruler, not by the old as a group.'
      C: 'You chose feudalism. Feudalism is built on land held in return for service to a lord.'
      D: 'You picked theocracy. Theocracy is rule by religious leaders in the name of God.'
  8:
    moments:
      - section: 'The question'
        say: 'A state commissioner is part of the executive. What is his or her main job?'
        write: 'Commissioner, as an executive, is responsible for ... ?'
      - section: 'Name it'
        say: 'This is the executive, the arm of government that carries out the laws.'
        write: 'Executive = implements the laws'
      - section: 'The fact'
        say: 'A commissioner heads a state ministry, and the ministry turns laws and policies into action.'
        write: 'Commissioner heads a ministry → laws into action'
      - section: 'Why'
        say: 'Roads are built and schools are run because the ministry carries out what the law and the policy say.'
        write: 'Law → ministry → roads, schools'
      - section: 'In Nigeria'
        say: 'Under section one hundred and ninety-two of the nineteen ninety-nine Constitution, the governor appoints commissioners, who carry out the laws of the State House of Assembly.'
        write: '1999 Constitution, s. 192: governor appoints commissioners'
      - section: 'Remember'
        say: 'Remember, the legislature makes, the executive executes, and the judiciary judges.'
        write: 'Make, execute, judge'
      - section: 'Answer'
        say: 'So the commissioner is responsible for implementing laws, which is option A.'
        write: '$\therefore$ implementing laws'
        answer: true
    traps:
      B: 'You went for writing laws. Writing laws is part of law making, which is the job of the legislature.'
      C: 'You chose giving loans. That is a banking activity, not the work of a commissioner.'
      D: 'You picked making laws. That is the work of the State House of Assembly, the legislature.'
  9:
    moments:
      - section: 'The question'
        say: 'Rule adjudication is a big phrase. Which arm of government does it belong to?'
        write: 'Rule adjudication is a function of the ... ?'
      - section: 'Name it'
        say: 'Rule adjudication means interpreting the laws and applying them to disputes, to decide who is right.'
        write: 'Adjudication = interpreting law, settling disputes'
      - section: 'The fact'
        say: 'The three arms share the work. The legislature makes rules, the executive applies them, and the judiciary adjudicates on them.'
        write: 'Make, apply, adjudicate'
      - section: 'Why'
        say: 'The courts are independent, so they can judge fairly between citizens and between governments.'
        write: 'Independent courts → fair judgment'
      - section: 'In Nigeria'
        say: 'The courts, from the magistrate courts up to the Supreme Court of Nigeria, settle such disputes.'
        write: 'Magistrate court → … → Supreme Court'
      - section: 'Remember'
        say: 'Remember, adjudicate contains the word judge, and judges sit in the judiciary.'
        write: 'adJUDicate → judge → judiciary'
      - section: 'Answer'
        say: 'So rule adjudication is a primary function of the judiciary, which is option A.'
        write: '$\therefore$ judiciary'
        answer: true
    traps:
      B: 'You went for executive. The executive applies rules, but it does not judge disputes under them.'
      C: 'You chose government. Government is the whole system of three arms, not the one arm that adjudicates.'
      D: 'You picked legislature. The legislature makes rules. Judging cases under them is the work of the judiciary.'
  10:
    moments:
      - section: 'The question'
        say: 'In a federal state, how do the courts keep the executive in check?'
        write: 'Judiciary controls the executive through ... ?'
      - section: 'Name it'
        say: 'This is judicial review.'
        write: 'Judicial review'
      - section: 'The fact'
        say: 'Judicial review is the power of the courts to examine the acts of government and declare void any that go against the constitution.'
        write: 'Judicial review = courts can declare acts unconstitutional'
      - section: 'Why'
        say: 'In a federation the constitution is supreme. So when the executive acts beyond its powers, the court strikes the act down.'
        write: 'Constitution supreme → unconstitutional act void'
      - section: 'In Nigeria'
        say: 'Section one, subsection three, of the nineteen ninety-nine Constitution says any law that goes against the Constitution is void.'
        write: '1999 Constitution, s. 1(3)'
      - section: 'Remember'
        say: 'Remember, the court reviews the act and can say this is unconstitutional.'
        write: 'Review → unconstitutional → void'
      - section: 'Answer'
        say: 'So the judiciary controls the executive through judicial review, which is option C.'
        write: '$\therefore$ judicial review'
        answer: true
    traps:
      A: 'You went for delegated legislation. That is law made by bodies the legislature authorises. It is not a court check on the executive.'
      B: 'You chose judicial overview. It sounds close, but it is not a recognised power of the courts. The right term is judicial review.'
      D: 'You picked motions. Motions are used in the legislature, which is the legislature''s own way of checking the executive.'
  11:
    moments:
      - section: 'The question'
        say: 'What does the unitary system do well? What does it tend to make government?'
        write: 'Advantage of the unitary system: government becomes ... ?'
      - section: 'Name it'
        say: 'In a unitary system, all powers belong to one central government.'
        write: 'Unitary = all power at the centre'
      - section: 'The fact'
        say: 'Any local units exist only by the will of the centre, and the centre can change them.'
        write: 'Local units exist at the will of the centre'
      - section: 'Why'
        say: 'Because power is not divided, there are no clashes between tiers. Decisions are quick and the same everywhere, so government is strong and stable.'
        write: 'No clashes → quick, uniform decisions → strong and stable'
      - section: 'In Nigeria'
        say: 'On the twenty-fourth of May, nineteen sixty-six, the Unification Decree tried to make Nigeria unitary. The federal system was restored that September.'
        write: 'Unification Decree, 24 May 1966'
      - section: 'Remember'
        say: 'Remember, one centre of power gives one strong voice.'
        write: 'One centre, one strong voice'
      - section: 'Answer'
        say: 'So the unitary system tends to make government strong and stable, which is option D.'
        write: '$\therefore$ strong and stable'
        answer: true
    traps:
      A: 'You went for free of controversy. No system is free of controversy. People still disagree over policies.'
      B: 'You chose distant from the people. That is a disadvantage of the unitary system, not an advantage.'
      C: 'You picked popular among the masses. A unitary government can seem remote, so popularity is not what it brings.'
  12:
    moments:
      - section: 'The question'
        say: 'Four statements, but only one is true of the presidential system and not the parliamentary. Which one?'
        write: 'Presidential differs from parliamentary in that ... ?'
      - section: 'Name it'
        say: 'In the presidential system, the president is elected for a fixed term, and the constitution limits his or her tenure.'
        write: 'Presidential = fixed, limited tenure'
      - section: 'The fact'
        say: 'In the parliamentary system, the prime minister stays only while parliament supports him, so there is no fixed tenure.'
        write: 'Parliamentary = stays while parliament supports'
      - section: 'Why'
        say: 'In the parliamentary system, ministers sit in parliament, so powers are fused, and the cabinet is collectively responsible.'
        write: 'Parliamentary: fused powers, collective responsibility'
      - section: 'In Nigeria'
        say: 'Under the nineteen ninety-nine Constitution, the President serves four years and may be elected only twice.'
        write: '1999 Constitution, ss. 135, 137: four years, two terms'
      - section: 'Remember'
        say: 'Remember, presidential means a fixed term and separate powers. Parliamentary means fused powers and collective responsibility.'
        write: 'Presidential: fixed term. Parliamentary: fusion'
      - section: 'Answer'
        say: 'So the presidential system differs in that the tenure of the president is limited, which is option D.'
        write: '$\therefore$ the tenure of the president is limited'
        answer: true
    traps:
      A: 'You went for collective responsibility. That belongs to the parliamentary system, where the cabinet stands or falls together.'
      B: 'You chose fused powers. Fusion of executive and legislative powers is a mark of the parliamentary system.'
      C: 'You picked merged powers. That describes the parliamentary system. The presidential system separates the three arms.'
  13:
    moments:
      - section: 'The question'
        say: 'Which of these four wants wealth shared fairly among all?'
        write: 'Advocates equitable distribution of wealth = ?'
      - section: 'Name it'
        say: 'This is socialism.'
        write: 'Socialism'
      - section: 'The fact'
        say: 'Socialism is the ideology in which the main means of production are owned by the state or the community, so that wealth is shared fairly.'
        write: 'Socialism = common ownership, fair sharing'
      - section: 'Why'
        say: 'Socialists argue that private ownership lets a few grow rich while many stay poor, so the state should own key industries.'
        write: 'Private ownership → a rich few → state ownership instead'
      - section: 'In Nigeria'
        say: 'In the Second Republic, the Unity Party of Nigeria campaigned on democratic socialism, with free education and free health care.'
        write: 'Unity Party of Nigeria: democratic socialism'
      - section: 'Remember'
        say: 'Remember, socialism puts society first and shares wealth fairly.'
        write: 'Society first, wealth shared'
      - section: 'Answer'
        say: 'So the ideology that advocates equitable distribution of wealth is socialism, which is option C.'
        write: '$\therefore$ socialism'
        answer: true
    traps:
      A: 'You went for capitalism. Capitalism leaves wealth to private owners and the market, which tends to gather it in a few hands.'
      B: 'You chose aristocracy. That is rule by a few nobles, a form of government, not a theory of sharing wealth.'
      D: 'You picked plutocracy. Plutocracy is rule by the rich, the very opposite of sharing wealth fairly.'
  14:
    moments:
      - section: 'The question'
        say: 'Some constitutions are easy to change, and some are hard. What do we call one that is difficult to amend?'
        write: 'Constitution difficult to amend = ?'
      - section: 'Name it'
        say: 'This is a rigid constitution.'
        write: 'Rigid constitution'
      - section: 'The fact'
        say: 'A rigid constitution cannot be amended by an ordinary law. It needs a special, difficult procedure.'
        write: 'Rigid = special procedure to amend'
      - section: 'Why'
        say: 'The hard procedure stops a passing majority from changing it, and in a federation it protects the powers of each tier.'
        write: 'Protects against a passing majority'
      - section: 'In Nigeria'
        say: 'An amendment to the nineteen ninety-nine Constitution needs two-thirds of each house of the National Assembly, and two-thirds of the State Houses of Assembly, which is twenty-four of thirty-six.'
        write: '1999 Constitution, s. 9: two-thirds, then 24 of 36 states'
      - section: 'Remember'
        say: 'Remember, rigid means stiff and hard to bend.'
        write: 'Rigid = stiff'
      - section: 'Answer'
        say: 'So a constitution that is difficult to amend is rigid, which is option A.'
        write: '$\therefore$ rigid'
        answer: true
    traps:
      B: 'You went for written. Written describes the form of a constitution, and a written one can still be easy to amend.'
      C: 'You chose unwritten. An unwritten constitution, like Britain''s, is usually changed by ordinary Acts of Parliament, so it is easy to amend.'
      D: 'You picked flexible. A flexible constitution is the easy one to amend, the opposite of what we want.'
  15:
    moments:
      - section: 'The question'
        say: 'If a country wants all power held at the centre, which kind of constitution suits it best?'
        write: 'Constitution suitable for centralization of power = ?'
      - section: 'Name it'
        say: 'Centralization means all power is held by one central government, as in a unitary state.'
        write: 'Centralization → unitary state'
      - section: 'The fact'
        say: 'A flexible constitution can be amended by the ordinary law-making process of the legislature.'
        write: 'Flexible = amended by ordinary law'
      - section: 'Why'
        say: 'A unitary state has no tiers whose powers must be protected, so a constitution the centre can change easily suits it.'
        write: 'No tiers to protect → flexible suits the centre'
      - section: 'In Nigeria'
        say: 'Nigeria shares power among federal, state and local governments, so it has a rigid constitution. A flexible one would let the centre take back the states'' powers by an ordinary act.'
        write: 'Nigeria: federal, so rigid'
      - section: 'Remember'
        say: 'Remember, flexible goes with unitary, and rigid goes with federal.'
        write: 'Flexible with unitary, rigid with federal'
      - section: 'Answer'
        say: 'So the constitution more suitable for centralization of power is a flexible one, which is option D.'
        write: '$\therefore$ flexible constitution'
        answer: true
    traps:
      A: 'You went for unwritten. Unwritten constitutions are often flexible too, but what suits central power is ease of amendment, and that is the word flexible.'
      B: 'You chose rigid. A rigid constitution is made to protect power that is divided, as in a federation, which is the opposite of centralization.'
      C: 'You picked written. A written constitution is often rigid, and writing it down does not by itself centralize power.'
  16:
    moments:
      - section: 'The question'
        say: 'Powers are handed to lower agencies, and the agencies then use them on their own. What is that called?'
        write: 'Transferring autonomous powers to subordinate agencies = ?'
      - section: 'Name it'
        say: 'This is devolution.'
        write: 'Devolution'
      - section: 'The fact'
        say: 'Devolution is the transfer of powers from the centre to lower bodies, which then use them with autonomy, which means on their own.'
        write: 'Devolution = powers transferred, used autonomously'
      - section: 'Why'
        say: 'In delegation, the lower body only acts on behalf of the higher one, which can take the power back. In devolution the powers belong to the lower body.'
        write: 'Delegation: on behalf of. Devolution: its own'
      - section: 'In Nigeria'
        say: 'The nineteen seventy-six Local Government Reform gave local governments their own functions and their own share of revenue.'
        write: '1976 Local Government Reform'
      - section: 'Remember'
        say: 'Remember, devolve means hand down to keep, and delegate means hand down to use for me.'
        write: 'Devolve = to keep. Delegate = for me'
      - section: 'Answer'
        say: 'So transferring autonomous powers to subordinate agencies is devolution, which is option D.'
        write: '$\therefore$ devolution'
        answer: true
    traps:
      A: 'You went for concentration. Concentration keeps powers at the centre instead of transferring them.'
      B: 'You chose deconcentration. That moves only administrative tasks to field offices of the same central body, with no autonomy.'
      C: 'You picked delegation. Delegated powers are used on behalf of the higher authority and can be taken back, so they are not autonomous.'
  17:
    moments:
      - section: 'The question'
        say: 'Some citizenship can be taken away by the state. Which kind cannot be withdrawn?'
        write: 'Citizenship that cannot be withdrawn = ?'
      - section: 'Name it'
        say: 'This is citizenship by birth.'
        write: 'Citizenship by birth'
      - section: 'The fact'
        say: 'Citizenship by birth comes from being born to parents who are citizens. The state did not grant it, so the state cannot take it away.'
        write: 'By birth = not granted, so not withdrawn'
      - section: 'Why'
        say: 'Citizenship granted by the state, such as by naturalization, comes with conditions, and it can be withdrawn if they are broken.'
        write: 'Granted citizenship → conditions → can be withdrawn'
      - section: 'In Nigeria'
        say: 'Section twenty-five of the nineteen ninety-nine Constitution sets out citizenship by birth, and section thirty lets the President deprive only those who are not citizens by birth or by registration.'
        write: '1999 Constitution, ss. 25 and 30'
      - section: 'Remember'
        say: 'Remember, what you are born with, the state cannot take away.'
        write: 'Born with it, keep it'
      - section: 'Answer'
        say: 'So the citizenship that cannot be withdrawn is citizenship by birth, which is option B.'
        write: '$\therefore$ citizenship by birth'
        answer: true
    traps:
      A: 'You went for conquest. Citizenship imposed by conquest rests on force, and it changes when the conquest ends.'
      C: 'You chose honorary citizenship. That is a privilege granted by the state, so the state can withdraw it.'
      D: 'You picked naturalization. Naturalized citizenship is granted on conditions, so it can be withdrawn if they are broken.'
  18:
    moments:
      - section: 'The question'
        say: 'Suffrage means the right to vote. What is the right of all citizens to vote called?'
        write: 'The right of citizens to vote = ?'
      - section: 'Name it'
        say: 'This is universal suffrage.'
        write: 'Universal suffrage'
      - section: 'The fact'
        say: 'Universal suffrage is the right of all citizens of voting age to vote, whatever their sex, wealth, education or religion.'
        write: 'All citizens of voting age, no other barrier'
      - section: 'Why'
        say: 'Old limits, such as votes only for property owners or only for men, were removed so that every citizen could help choose the government.'
        write: 'Old limits removed → every citizen votes'
      - section: 'In Nigeria'
        say: 'Every Nigerian citizen aged eighteen and above may register and vote, and I N E C, the Independent National Electoral Commission, registers them.'
        write: '1999 Constitution, s. 77(2): eighteen and above'
      - section: 'Remember'
        say: 'Remember, universal means everyone, so universal suffrage is the vote for every citizen of age.'
        write: 'Universal = everyone'
      - section: 'Answer'
        say: 'So the right of citizens to vote is universal suffrage, which is option A.'
        write: '$\therefore$ universal suffrage'
        answer: true
    traps:
      B: 'You went for nationality suffrage. That is not a recognised term for the right to vote.'
      C: 'You chose electoral suffrage. That is not a recognised term either, because suffrage is already about voting in elections.'
      D: 'You picked adult suffrage. It names only the age test. The full term for the right of all citizens to vote, with no other barrier, is universal suffrage.'
  19:
    moments:
      - section: 'The question'
        say: 'Parties and pressure groups both deal with government. What really sets a party apart?'
