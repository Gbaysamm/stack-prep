# UTME 2014 Government, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good government teacher works on the board:
# the question, the concept or institution named, the fact or definition, why or how it works,
# a Nigerian link, a way to remember it, the tempting wrong option, and the answer.
#
#   say:     heard, not read. Dates said as years or full dates, abbreviations spelled out the
#            first time, no symbols the voice would stop on.
#   write:   the one line written while it is said.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2014.yaml. Answers match that file. Q1 (the paper
# type) is left out; the other 49 questions each have a lesson.
format_version: 1
exam_year: 2014
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'Nigeria, Ghana and France are all states. What must every one of them have to count as a state?'
        write: 'The necessary attributes of a state $= ?$'
      - section: 'Name it'
        say: 'A state is a political community with the power to make and enforce laws over everyone in it.'
        write: 'State = political community with power to make and enforce laws'
      - section: 'The fact'
        say: 'Every state needs four things. A definite territory, a population, sovereignty and a government.'
        write: 'Territory + Population + Sovereignty + Government'
      - section: 'Why'
        say: 'Without land there is nowhere to rule. Without people there is no one to rule. Without government no one rules, and without sovereignty the state answers to another power.'
        write: 'Take one away and the state falls'
      - section: 'In Nigeria'
        say: 'Nigeria has its land, its people, its government in Abuja, and its sovereignty since the first of October, nineteen sixty.'
        write: 'Nigeria: land, people, Abuja, sovereign since 1 Oct 1960'
      - section: 'Remember'
        say: 'Remember the letters T P S G, which stand for territory, population, sovereignty and government.'
        write: 'T P S G'
      - section: 'The trap'
        say: 'Resources make a state rich, but a poor state is still a state. So resources are not a must.'
        write: 'Resources: helpful, not necessary'
      - section: 'Answer'
        say: 'So the necessary attributes are definite territory, population, sovereignty and government, which is option D.'
        write: '$\therefore$ definite territory, population, sovereignty, government'
        answer: true
    traps:
      A: 'You went for police, army, sovereignty and custom. Police and army are tools of government, and the list leaves out territory and government itself.'
      B: 'You chose the list with resources. Resources help a state grow rich, but a poor state is still a state. A definite territory is what is needed.'
      C: 'You picked police, army and immigration. These are agencies of government, not the attributes that make a state.'
  3:
    moments:
      - section: 'The question'
        say: 'When you vote, join a party or attend a rally, what are you doing in political terms?'
        write: 'Taking part in political and public affairs $= ?$'
      - section: 'Name it'
        say: 'This is political participation.'
        write: 'Political participation'
      - section: 'The fact'
        say: 'Political participation is the process by which citizens take part in political and public affairs.'
        write: 'Voting, joining parties, rallies, contesting, petitioning'
      - section: 'Why'
        say: 'People take part because government decisions affect their lives, so taking part lets them shape those decisions.'
        write: 'Decisions affect us, so we take part'
      - section: 'In Nigeria'
        say: 'Registering with I N E C, the Independent National Electoral Commission, and voting in a general election are acts of participation.'
        write: 'INEC voter registration, voting'
      - section: 'Remember'
        say: 'Remember, participation simply means taking part.'
        write: 'Participation = taking part'
      - section: 'The trap'
        say: 'Political socialization sounds close, but it is how we learn political values from family, school and the media. That is learning, not taking part.'
        write: 'Socialization = learning values'
      - section: 'Answer'
        say: 'So taking part in political affairs is political participation, which is option D.'
        write: '$\therefore$ participation'
        answer: true
    traps:
      A: 'You went for socialization. That is how we learn political values and beliefs, not the act of taking part.'
      B: 'You chose recognition. Recognition is when other states accept a state or government. Citizens do not take part in it.'
      C: 'You picked culture. Political culture is the shared beliefs and attitudes of a people, not the act of taking part.'
  4:
    moments:
      - section: 'The question'
        say: 'You can choose to join a football club or a town union. Is that how membership of a society works?'
        write: 'Membership of a society is $= ?$'
      - section: 'Name it'
        say: 'We are comparing a society with a state.'
        write: 'Society versus state'
      - section: 'The fact'
        say: 'A society is a group of people who live together and share common interests. Membership of a society is voluntary.'
        write: 'Society: voluntary membership'
      - section: 'Why'
        say: 'The state is different. Everyone in its territory is bound by its laws, so membership of the state is compulsory.'
        write: 'State: compulsory membership'
      - section: 'In Nigeria'
        say: 'You may choose whether to join the Red Cross or your old students association, but you cannot choose to stand outside Nigerian law.'
        write: 'Join a club by choice, obey the law by duty'
      - section: 'Remember'
        say: 'Remember, society you choose, state you obey.'
        write: 'Society: choose. State: obey.'
      - section: 'The trap'
        say: 'Mandatory means compulsory. That word belongs to the state, not to a society.'
        write: 'Mandatory = state'
      - section: 'Answer'
        say: 'So membership of a society is voluntary, which is option D.'
        write: '$\therefore$ voluntary'
        answer: true
    traps:
      A: 'You went for constitutional. Joining a society does not come from a constitution, it comes from your own choice.'
      B: 'You chose conventional. That means based on custom, which does not describe how people join a society.'
      C: 'You picked mandatory. Mandatory membership belongs to the state, whose laws bind everyone. A society is joined by choice.'
  5:
    moments:
      - section: 'The question'
        say: 'In a democracy, the lawmakers make the laws. But who holds the power that stands behind the lawmakers?'
        write: 'The political sovereign in a democracy $= ?$'
      - section: 'Name it'
        say: 'This is political sovereignty, as against legal sovereignty.'
        write: 'Legal sovereignty versus political sovereignty'
      - section: 'The fact'
        say: 'Legal sovereignty is the power to make laws, held by the legislature. Political sovereignty is the power that chooses the lawmakers and can remove them.'
        write: 'Legal = legislature. Political = those who choose it.'
      - section: 'Why'
        say: 'In a democracy the voters elect the legislature and the executive, and they can vote them out. So the electorate is the political sovereign.'
        write: 'Voters elect and remove, so voters are sovereign'
      - section: 'In Nigeria'
        say: 'Nigerian voters elect the President, the National Assembly, the governors and the state Houses of Assembly.'
        write: 'Voters elect President, National Assembly, governors, Houses of Assembly'
      - section: 'Remember'
        say: 'Remember, the legislature makes the laws, but the voters make the legislature.'
        write: 'Voters make the lawmakers'
      - section: 'The trap'
        say: 'The legislature is tempting, but it is the legal sovereign. It answers to the voters.'
        write: 'Legislature = legal sovereign'
      - section: 'Answer'
        say: 'So in a democracy the political sovereign is the electorate, which is option D.'
        write: '$\therefore$ electorate'
        answer: true
    traps:
      A: 'You went for the legislature. It holds legal sovereignty, the power to make laws, but it answers to the voters.'
      B: 'You chose the constitution. A constitution is a body of rules, not a group of people who hold power.'
      C: 'You picked political parties. Parties compete for power, but the voters decide which party wins.'
  6:
    moments:
      - section: 'The question'
        say: 'When a king dies, who takes his place? That tells us the basic feature of a monarchy.'
        write: 'A basic feature of monarchy $= ?$'
      - section: 'Name it'
        say: 'A monarchy is government headed by a king, a queen or another royal ruler.'
        write: 'Monarchy = rule by a royal ruler'
      - section: 'The fact'
        say: 'In a monarchy the throne passes by heredity, from one member of the royal family to the next.'
        write: 'Succession by heredity'
      - section: 'Why'
        say: 'Because the office is inherited, the ruler is not elected, and usually rules for life.'
        write: 'Inherited, not elected, for life'
      - section: 'In Nigeria'
        say: 'Our traditional rulers, like the Alaafin of Oyo and the Emir of Kano, come from royal families, even though Nigeria itself is a republic.'
        write: 'Alaafin of Oyo, Emir of Kano: royal families'
      - section: 'Remember'
        say: 'Remember, in a monarchy the crown runs in the family.'
        write: 'Crown runs in the family'
      - section: 'The trap'
        say: 'A fixed tenure sounds orderly, but a fixed term belongs to an elected president. A monarch usually reigns for life.'
        write: 'Fixed tenure = elected ruler'
      - section: 'Answer'
        say: 'So a basic feature of monarchy is that succession is through heredity, which is option D.'
        write: '$\therefore$ succession through heredity'
        answer: true
    traps:
      A: 'You went for a fixed tenure. A monarch usually reigns for life. A fixed term belongs to elected rulers.'
      B: 'You chose absolute separation of powers. That is a principle of democratic government, and it is never absolute even there.'
      C: 'You picked an elected executive. Elections belong to republics. In a monarchy the head of state inherits the office.'
  7:
    moments:
      - section: 'The question'
        say: 'Why would a country want two houses to make its laws instead of one?'
        write: 'Main advantage of a bicameral legislature $= ?$'
      - section: 'Name it'
        say: 'A bicameral legislature is a legislature with two chambers, or two houses.'
        write: 'Bicameral = two chambers'
      - section: 'The fact'
        say: 'A bill must pass both houses before it becomes law, so each house checks the work of the other.'
        write: 'Bill must pass both houses'
      - section: 'Why'
        say: 'This makes it hard for one group to rush a bill through or manipulate it. It prevents hasty laws.'
        write: 'Two checks, so bills are hard to manipulate'
      - section: 'In Nigeria'
        say: 'Nigeria''s National Assembly has two houses, the Senate with one hundred and nine members and the House of Representatives with three hundred and sixty.'
        write: 'Senate 109 + House of Representatives 360'
      - section: 'Remember'
        say: 'Remember, two houses give every bill two looks.'
        write: 'Two houses, two looks'
      - section: 'The trap'
        say: 'Quick deliberation is tempting, but speed is an advantage of one chamber. Two chambers slow things down.'
        write: 'Speed = one chamber'
      - section: 'Answer'
        say: 'So the main advantage is that a bicameral legislature is not easy to manipulate bills, which is option A.'
        write: '$\therefore$ not easy to manipulate bills'
        answer: true
    traps:
      B: 'You went for quick deliberation. Quick action in emergencies is an advantage of a single chamber. Two chambers take longer.'
      C: 'You chose easy passage of bills. Two chambers make passing bills harder, since both must agree.'
      D: 'You picked less cumbersome. Having two houses makes lawmaking more cumbersome, not less.'
  8:
    moments:
      - section: 'The question'
        say: 'When people disagree over what the constitution means, which court has the very last word?'
        write: 'Court with ultimate power to interpret the constitution $= ?$'
      - section: 'Name it'
        say: 'This is the Supreme Court, the highest court in Nigeria.'
        write: 'Supreme Court'
      - section: 'The fact'
        say: 'The Supreme Court has the final word on what the constitution means. Its decisions bind every other court.'
        write: 'Final word, binds all courts'
      - section: 'Why'
        say: 'It sits at the top of the court ladder, so there is no appeal from it. Cases on the constitution finally end there.'
        write: 'Top of the ladder, no appeal'
      - section: 'In Nigeria'
        say: 'Our Supreme Court sits in Abuja and is headed by the Chief Justice of Nigeria.'
        write: 'Abuja, headed by the Chief Justice of Nigeria'
      - section: 'Remember'
        say: 'Remember, supreme means highest, so its word is final.'
        write: 'Supreme = highest = final'
      - section: 'The trap'
        say: 'The Court of Appeal is high, but it is one step below. Its decisions can still go to the Supreme Court.'
        write: 'Court of Appeal: one step below'
      - section: 'Answer'
        say: 'So the court with the ultimate power to interpret the constitution is the Supreme Court, which is option B.'
        write: '$\therefore$ Supreme Court'
        answer: true
    traps:
      A: 'You went for the Court of Appeal. It sits just below the Supreme Court, and appeals go from it to the Supreme Court.'
      C: 'You chose the Magistrate Court. That is a lower court for minor cases.'
      D: 'You picked the High Court. It can interpret the constitution, but its decisions can be appealed, so its power is not final.'
  9:
    moments:
      - section: 'The question'
        say: 'One central government running everything. Where would that work best?'
        write: 'A unitary system suits a country $= ?$'
      - section: 'Name it'
        say: 'This is the unitary system, where all power is held by one central government.'
        write: 'Unitary = power in one centre'
      - section: 'The fact'
        say: 'Local units may do some work, but they get their power from the centre, and the centre can take it back.'
        write: 'Local units depend on the centre'
      - section: 'Why'
        say: 'It works best where the country is small and the people share one language and culture, because there are no strong local differences to protect.'
        write: 'Small area + homogeneous people'
      - section: 'In Nigeria'
        say: 'Britain is unitary. Nigeria is large and diverse, so it chose federalism in nineteen fifty-four and keeps it under the nineteen ninety-nine Constitution.'
        write: 'Britain: unitary. Nigeria: federal since 1954'
      - section: 'Remember'
        say: 'Remember, one small and similar people, one central government.'
        write: 'Small and similar, one centre'
      - section: 'The trap'
        say: 'A strong economy helps any country, but it does not decide whether a unitary system suits it.'
        write: 'Economy does not decide'
      - section: 'Answer'
        say: 'So a unitary system suits a country with a small area and a homogeneous population, which is option A.'
        write: '$\therefore$ small area, homogeneous population'
        answer: true
    traps:
      B: 'You went for sparsely populated. A thinly peopled country can still be large and diverse. Size and sameness are what matter.'
      C: 'You chose a strong army. An army does not make a unitary system suitable.'
      D: 'You picked a robust economy. A strong economy can exist under any system. Size and sameness of people decide the choice.'
  10:
    moments:
      - section: 'The question'
        say: 'Which of these four countries has a king who reigns under a constitution?'
        write: 'A country with a constitutional monarch $= ?$'
      - section: 'Name it'
        say: 'This is constitutional monarchy, where a king or queen reigns within limits set by a constitution.'
        write: 'Constitutional monarchy'
      - section: 'The fact'
        say: 'The monarch is head of state by inheritance, but shares power with a parliament and acts within the constitution.'
        write: 'King by birth + limits by constitution'
      - section: 'Why'
        say: 'Morocco is ruled by King Mohammed the Sixth under a constitution, with an elected parliament and a prime minister.'
        write: 'Morocco: King Mohammed VI, parliament, prime minister'
      - section: 'In Nigeria'
        say: 'Nigeria is not a monarchy. Our traditional rulers, such as the Oba of Benin, hold royal titles, but the country has an elected President.'
        write: 'Nigeria: republic, elected President'
      - section: 'Remember'
        say: 'Remember, Morocco has a king and a constitution.'
        write: 'Morocco = king + constitution'
      - section: 'The trap'
        say: 'Italy once had a king, but it became a republic by a vote of the people in nineteen forty-six.'
        write: 'Italy: republic since 1946'
      - section: 'Answer'
        say: 'So the country ruled by a constitutional monarch is Morocco, which is option C.'
        write: '$\therefore$ Morocco'
        answer: true
    traps:
      A: 'You went for Libya. Libya''s king was removed in a coup in nineteen sixty-nine, and it has had no king since.'
      B: 'You chose Uganda. Uganda is a republic with an elected president. Its traditional kingdoms do not rule the country.'
      D: 'You picked Italy. Italy had a king once, but it became a republic in nineteen forty-six and now has a president.'
  11:
    moments:
      - section: 'The question'
        say: 'Which set of ideas dreams of a society with no rich class and no poor class?'
        write: 'A classless society is the goal of $= ?$'
      - section: 'Name it'
        say: 'This is Marxism, the teaching of Karl Marx and Friedrich Engels.'
        write: 'Marxism: Karl Marx and Friedrich Engels'
      - section: 'The fact'
        say: 'Marxism says history is a struggle between classes, the owners of the means of production and the workers.'
        write: 'History = class struggle'
      - section: 'Why'
        say: 'It teaches that the workers will overthrow capitalism, pass through socialism and reach communism, a classless society.'
        write: 'capitalism → socialism → communism (classless)'
      - section: 'In Nigeria'
        say: 'Some Nigerian labour leaders and student unions have used Marxist ideas in calling for a fairer share of national wealth.'
        write: 'Marxist ideas in labour and student movements'
      - section: 'Remember'
        say: 'Remember, Marx wanted no classes.'
        write: 'Marx = no classes'
      - section: 'The trap'
        say: 'Feudalism is a society of lords and serfs, which is the very opposite of classless.'
        write: 'Feudalism = lords and serfs'
      - section: 'Answer'
        say: 'So a classless society is the goal of Marxism, which is option A.'
        write: '$\therefore$ Marxism'
        answer: true
    traps:
      B: 'You went for conservatism. Conservatism wants to keep things as they are, not abolish classes.'
      C: 'You chose feudalism. Feudalism is built on classes of lords and serfs, the opposite of classless.'
      D: 'You picked liberalism. Liberalism stresses individual freedom and private property, and accepts differences of wealth.'
  12:
    moments:
      - section: 'The question'
        say: 'Some constitutions bend easily and some are hard to change. What makes one flexible?'
        write: 'A flexible constitution is one which is $= ?$'
      - section: 'Name it'
        say: 'This is a flexible constitution.'
        write: 'Flexible constitution'
      - section: 'The fact'
        say: 'A flexible constitution can be amended easily, by the ordinary law-making process, with no special procedure.'
        write: 'Amended like an ordinary law'
      - section: 'Why'
        say: 'No special majority and no referendum are needed, so it can change quickly with the times.'
        write: 'No special majority, quick change'
      - section: 'In Nigeria'
        say: 'Nigeria''s nineteen ninety-nine Constitution is rigid. An amendment needs two thirds in each house of the National Assembly and the approval of two thirds of the state Houses of Assembly.'
        write: 'Nigeria 1999: rigid, section 9'
      - section: 'Remember'
        say: 'Remember, flexible bends easily, and rigid does not.'
        write: 'Flexible bends'
      - section: 'The trap'
        say: 'Being written by parliament tells us who wrote it, not how easily it can be changed.'
        write: 'Who wrote it is not the test'
      - section: 'Answer'
        say: 'So a flexible constitution is one which is easily amended, which is option B.'
        write: '$\therefore$ easily amended'
        answer: true
    traps:
      A: 'You went for written by parliament. That says who wrote it, not how easily it can be changed.'
      C: 'You chose popular with legislators. Popularity has nothing to do with how a constitution is amended.'
      D: 'You picked known to all citizens. That is about awareness, and a well-known constitution can still be rigid.'
  13:
    moments:
      - section: 'The question'
        say: 'Under checks and balances, each arm of government can limit the others. Which option shows one arm doing that?'
        write: 'A feature of checks and balances $= ?$'
      - section: 'Name it'
        say: 'This is judicial review.'
        write: 'Judicial review'
      - section: 'The fact'
        say: 'Judicial review is the power of the courts to declare a law or an action void if it goes against the constitution.'
        write: 'Courts can void unconstitutional laws and acts'
      - section: 'Why'
        say: 'Through it the judiciary checks the legislature and the executive, so no arm can act beyond its powers.'
        write: 'Judiciary checks legislature and executive'
      - section: 'In Nigeria'
        say: 'The Supreme Court can strike down an Act of the National Assembly that conflicts with the nineteen ninety-nine Constitution.'
        write: 'Supreme Court strikes down unconstitutional Acts'
      - section: 'Remember'
        say: 'Remember, review means the court looks again at what the others did.'
        write: 'Review = look again'
      - section: 'The trap'
        say: 'A code of conduct sets rules for public officers, but it is not one arm of government checking another.'
        write: 'Code of conduct: rules for officers'
      - section: 'Answer'
        say: 'So the feature of checks and balances is judicial review, which is option D.'
        write: '$\therefore$ judicial review'
        answer: true
    traps:
      A: 'You went for the code of conduct. It sets standards for public officers, but it is not one arm checking another.'
      B: 'You chose judicial precedent. That means courts follow earlier decisions. It binds the courts, not the other arms.'
      C: 'You picked judicial immunity. That protects judges from being sued. It does not check the other arms.'
  14:
    moments:
      - section: 'The question'
        say: 'Under military rule, the federal government made decrees. What were the laws made by a state military government called?'
        write: 'Laws of a state military government $= ?$'
      - section: 'Name it'
        say: 'These are edicts.'
        write: 'Edicts'
      - section: 'The fact'
        say: 'Under military rule, federal laws were called decrees and state laws were called edicts.'
        write: 'Federal = decree. State = edict.'
      - section: 'Why'
        say: 'The legislatures were suspended, so the military made the laws itself, and each state military governor issued edicts.'
        write: 'No legislature, so the governor makes edicts'
      - section: 'In Nigeria'
        say: 'The Supreme Military Council made decrees at the centre, while state military governors issued edicts.'
        write: 'Supreme Military Council: decrees. Governors: edicts.'
      - section: 'Remember'
        say: 'Remember, federal decree, state edict.'
        write: 'Federal decree, state edict'
      - section: 'The trap'
        say: 'Decrees sound right because they are military laws, but they were made at the federal level.'
        write: 'Decrees = federal'
      - section: 'Answer'
        say: 'So laws made by military governments at the state level are called edicts, which is option D.'
        write: '$\therefore$ edicts'
        answer: true
    traps:
      A: 'You went for acts. Acts are laws passed by an elected legislature, such as the National Assembly.'
      B: 'You chose decrees. Decrees were military laws made at the federal level, not by the states.'
      C: 'You picked bye-laws. Bye-laws are made by local government councils.'
  15:
    moments:
      - section: 'The question'
        say: 'A foreigner has lived in Nigeria for many years and wants to become a citizen. How does an alien acquire citizenship?'
        write: 'Citizenship acquired by an alien through $= ?$'
      - section: 'Name it'
        say: 'This is citizenship by naturalization.'
        write: 'Naturalization'
      - section: 'The fact'
        say: 'Naturalization is the process by which an alien applies for and is granted citizenship after living in the country for a set time.'
        write: 'Alien + residence + conditions → citizen'
      - section: 'Why'
        say: 'The alien must show good character and a long stay, then swear an oath of allegiance.'
        write: 'Good character, residence, oath'
      - section: 'In Nigeria'
        say: 'Under section twenty-seven of the nineteen ninety-nine Constitution, a foreigner may be naturalized after fifteen years in Nigeria, among other conditions.'
        write: 'Section 27, 1999 Constitution'
      - section: 'Remember'
        say: 'Remember, naturalization makes a foreigner a native in law.'
        write: 'Naturalize = make native'
      - section: 'The trap'
        say: 'Registration is real, but it is for people with a special link, like a foreign woman married to a Nigerian. Naturalization is the general route for aliens.'
        write: 'Registration: special link'
      - section: 'Answer'
        say: 'So an alien acquires citizenship through naturalization, which is option A.'
        write: '$\therefore$ naturalization'
        answer: true
    traps:
      B: 'You went for registration. Registration is for people with a special link, such as a foreign wife of a citizen. The general way for an alien is naturalization.'
      C: 'You chose birth. Citizenship by birth comes from your parents. An alien cannot acquire it later.'
      D: 'You picked conferment. That is honorary citizenship given as a favour, not the normal way an alien becomes a citizen.'
  16:
    moments:
      - section: 'The question'
        say: 'The votes have been counted in every polling unit. Who stands up and announces the winner?'
        write: 'Officer who announces the election result $= ?$'
      - section: 'Name it'
        say: 'This is the returning officer.'
        write: 'Returning officer'
      - section: 'The fact'
        say: 'The returning officer collates the results from all the polling units in a constituency and declares the winner.'
        write: 'Collates results, declares winner'
      - section: 'Why'
        say: 'The presiding officer runs one polling unit and counts its votes. The results are added up level by level until the returning officer announces the final result.'
        write: 'polling unit → ward → constituency → declaration'
      - section: 'In Nigeria'
        say: 'I N E C, the Independent National Electoral Commission, appoints returning officers. For the presidential election, the INEC Chairman is the returning officer.'
        write: 'Presidential election: INEC Chairman returns'
      - section: 'Remember'
        say: 'Remember, the returning officer returns the winner.'
        write: 'Returning officer returns the winner'
      - section: 'The trap'
        say: 'The presiding officer is tempting, but that officer runs only one polling unit and does not declare the final result.'
        write: 'Presiding officer: one polling unit'
      - section: 'Answer'
        say: 'So the officer who announces the result is the returning officer, which is option D.'
        write: '$\therefore$ returning officer'
        answer: true
    traps:
      A: 'You went for the electoral officer. That officer runs the commission''s office in a local government area. The declaration is made by the returning officer.'
      B: 'You chose the ballot officer. There is no regular post by that name that declares results.'
      C: 'You picked the presiding officer. That officer runs one polling unit and counts its votes, but does not declare the final result.'
  17:
    moments:
      - section: 'The question'
        say: 'Parties make manifestos, pick candidates and campaign. What is all of that finally for?'
        write: 'Ultimate aim of political parties $= ?$'
      - section: 'Name it'
        say: 'A political party is an organised group of people with similar ideas who seek to win and use the power of government.'
        write: 'Party = group seeking government power'
      - section: 'The fact'
        say: 'The ultimate aim of a party is to acquire and exercise power.'
        write: 'Aim: acquire and exercise power'
      - section: 'Why'
        say: 'Everything else a party does serves this aim, because only in power can it carry out its programme.'
        write: 'Power first, then programmes'
      - section: 'In Nigeria'
        say: 'Parties registered by INEC field candidates for the presidency, the governorships and the legislatures, in order to win power.'
        write: 'Registered parties contest to win power'
      - section: 'Remember'
        say: 'Remember, a party wants power, and a pressure group wants influence.'
        write: 'Party = power. Pressure group = influence.'
      - section: 'The trap'
        say: 'Making and carrying out policies comes only after a party gains power, so it is not the ultimate aim.'
        write: 'Policies come after power'
      - section: 'Answer'
