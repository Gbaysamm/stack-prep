# UTME 2015 Government, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Government teacher works on the board:
# the question, the concept or institution named, the fact (who, what, when, where), why or how
# it works, a Nigerian link, a way to remember it, and the answer.
#
#   say:     heard, not read. Years in words, abbreviations spelled out letter by letter the
#            first time with their full name (ECOWAS, OPEC, NATO and ECOMOG are said as words),
#            no symbols the voice would stop on.
#   write:   the one line written while it is said.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2015.yaml. Answers match that file. Q7 and Q32
# are dropped, so they have no lesson.
format_version: 1
exam_year: 2015
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'Your local government chairman is elected. But who decides how many years he stays in office?'
        write: 'Tenure of an elected local government chairman is fixed by ?'
      - section: 'Name it'
        say: 'This is about who controls the local government system, the third tier of government.'
        write: 'Local government = third tier'
      - section: 'The fact'
        say: 'Section seven of the nineteen ninety-nine Constitution guarantees elected local government councils.'
        write: '1999 Constitution, s.7: elected councils guaranteed'
      - say: 'The same section says each state must make a law for their structure, composition, finance and functions.'
        write: 'State law sets structure, composition, finance, functions'
      - section: 'How it works'
        say: 'Because the councils are set up under a state law, the State House of Assembly fixes how long a chairman serves.'
        write: 'State law → tenure of the chairman'
      - section: 'In Nigeria'
        say: 'That is why tenure differs from state to state, and why council elections are run by each State Independent Electoral Commission, not by I N E C, the Independent National Electoral Commission.'
        write: 'Tenure differs by state; council polls by the State Electoral Commission'
      - section: 'Remember'
        say: 'Remember, the state makes the law that makes the council.'
        write: 'State law makes the council'
      - section: 'Answer'
        say: 'So the tenure is determined by the State House of Assembly, which is option D.'
        write: '$\therefore$ State House of Assembly'
        answer: true
    traps:
      A: 'You went for the Federal Executive Council. That is the President and the ministers, and it has no power over how long a council chairman serves.'
      B: 'You chose the union of local government workers. It speaks for council staff, but a union cannot make laws.'
      C: 'You picked the National Assembly. It makes laws for the whole country, but the Constitution leaves local government councils to the states.'
  2:
    moments:
      - section: 'The question'
        say: 'In nineteen seventy-six, local government in Nigeria got a new place in the system. Which place?'
        write: '1976 Reforms made local government the ? tier'
      - section: 'Name it'
        say: 'This is the nineteen seventy-six Local Government Reform.'
        write: '1976 Local Government Reform'
      - section: 'The fact'
        say: 'The military government of General Olusegun Obasanjo issued guidelines that set up one uniform, single-tier local government system for the whole country.'
        write: 'Obasanjo regime: uniform, single-tier system'
      - section: 'How it works'
        say: 'For the first time, local government was recognised as a full level of government, with its own functions and a share of federal revenue.'
        write: 'Own functions + share of federal revenue'
      - say: 'Count from the top. The federal government is first, the states are second, and local government is third.'
        write: 'Federal (1st) → State (2nd) → Local (3rd)'
      - section: 'In Nigeria'
        say: 'The nineteen seventy-nine Constitution wrote this into law, and the nineteen ninety-nine Constitution keeps it. Your council chairman heads the third tier.'
        write: '1979 and 1999 Constitutions keep it'
      - section: 'Remember'
        say: 'Remember, federal is first, state is second and local is third.'
        write: 'Federal, state, local = 1, 2, 3'
      - section: 'Answer'
        say: 'So the nineteen seventy-six reforms made local government the third tier of government, which is option D.'
        write: '$\therefore$ third tier of government'
        answer: true
    traps:
      A: 'You went for the second tier. That place belongs to the states, and local government comes after them.'
      B: 'You chose the first tier. That is the federal government at the centre.'
      C: 'You picked the fourth tier. Nigeria has only three tiers of government, so there is no fourth.'
  3:
    moments:
      - section: 'The question'
        say: 'In an old Igbo village there was no king. So who had the right to decide, and why?'
        write: 'Igbo decision making was based on ?'
      - section: 'Name it'
        say: 'This is the traditional Igbo political system.'
        write: 'Traditional Igbo political system'
      - section: 'The fact'
        say: 'The Igbo system was acephalous, which means it had no single ruler. Each village was run by a council of elders and a village assembly.'
        write: 'Acephalous: no king; council of elders + village assembly'
      - section: 'How it works'
        say: 'Authority came with age. The elders, led by the Okpara who held the Ofo staff, were trusted for their experience.'
        write: 'Elders led by the Okpara (holder of the Ofo)'
      - say: 'Younger people worked through age grades, which shared out community tasks by seniority.'
        write: 'Age grades share community work'
      - section: 'In Nigeria'
        say: 'Age grades still organise community work in many towns in the South East today.'
        write: 'Age grades still active in the South East'
      - section: 'Remember'
        say: 'Remember, in Igboland grey hair carried the say.'
        write: 'Grey hair carried the say'
      - section: 'Answer'
        say: 'So decision making was conferred on the basis of age, which is option B.'
        write: '$\therefore$ age'
        answer: true
    traps:
      A: 'You went for privilege. The Igbo system was open to all adult men, and it did not rest on inherited privilege.'
      C: 'You chose gender. Women had their own groups, like the Umuada, but decisions were not given out by gender.'
      D: 'You picked status. Title holders such as the Ozo were respected, but the main basis was the age and experience of the elders.'
  4:
    moments:
      - section: 'The question'
        say: 'A cultural club in the North turned itself into a political party. Which party did it become?'
        write: 'Jamiyyar Mutanen Arewa became which party?'
      - section: 'Name it'
        say: 'Jamiyyar Mutanen Arewa means the Association of the People of the North.'
        write: 'Jamiyyar Mutanen Arewa = Association of the People of the North'
      - section: 'The fact'
        say: 'It was founded in nineteen forty-nine as a cultural organisation of northern elites.'
        write: '1949: cultural organisation'
      - section: 'How it happened'
        say: 'In nineteen fifty-one it became a political party, to contest the elections under the Macpherson Constitution.'
        write: '1951: became a political party'
      - say: 'That party was the N P C, the Northern People''s Congress.'
        write: 'NPC = Northern People''s Congress'
      - section: 'In Nigeria'
        say: 'The N P C was led by Sir Ahmadu Bello, the Sardauna of Sokoto, and it became the largest party of the First Republic.'
        write: 'Leader: Sir Ahmadu Bello, Sardauna of Sokoto'
      - section: 'Remember'
        say: 'Remember, Arewa means North, so the North''s club became the Northern People''s Congress.'
        write: 'Arewa = North → Northern People''s Congress'
      - section: 'Answer'
        say: 'So the party that came from Jamiyyar Mutanen Arewa was the N P C, which is option D.'
        write: '$\therefore$ NPC'
        answer: true
    traps:
      A: 'You went for the U M B C, the United Middle Belt Congress. It spoke for the minorities of the Middle Belt and grew from Middle Belt groups.'
      B: 'You chose the B Y M, the Borno Youth Movement. It was a small party of the Kanuri in Borno, formed in nineteen fifty-four.'
      C: 'You picked N E P U, the Northern Elements Progressive Union. It was formed by Aminu Kano as a radical rival to the northern elite, not from their club.'
  5:
    moments:
      - section: 'The question'
        say: 'Colonial rule ended in nineteen sixty, but one of its effects stayed for a long time. Which is the major one?'
        write: 'A major consequence of colonialism on Nigeria = ?'
      - section: 'Name it'
        say: 'This is about the effects of British colonial rule on Nigeria.'
        write: 'Effects of British colonial rule'
      - section: 'The fact'
        say: 'Colonial rule shaped Nigeria''s economy to serve Britain. Nigerians grew cocoa, groundnuts and palm produce for export.'
        write: 'Export: cocoa, groundnuts, palm produce'
      - say: 'Then they bought back manufactured goods from Britain.'
        write: 'Import: manufactured goods'
      - section: 'Why'
        say: 'Because little industry was built at home, Nigeria came to depend on foreign markets, foreign prices and foreign goods. That is economic dependence.'
        write: 'Raw out, finished in → economic dependence'
      - section: 'In Nigeria'
        say: 'After independence on the first of October, nineteen sixty, Nigeria still sold raw materials, first farm produce and later crude oil, and imported finished goods.'
        write: 'After 1960: crude oil out, finished goods in'
      - section: 'Remember'
        say: 'Remember, raw out and finished in, so the colony depends.'
        write: 'Raw out, finished in'
      - section: 'Answer'
        say: 'So a major consequence of colonialism on Nigeria is economic dependence, which is option A.'
        write: '$\therefore$ economic dependence'
        answer: true
    traps:
      B: 'You went for equal status with Europe. A colony was ruled by Europe, so colonial rule could not make it equal.'
      C: 'You chose suppression of state structures. Under indirect rule the British kept the emirates and other traditional structures and ruled through them, so this was not the major result.'
      D: 'You picked the uplift of its image. Colonial rule made Nigeria a dependent territory. It did not raise its image.'
  6:
    moments:
      - section: 'The question'
        say: 'Judges do not write constitutions. So how do they help a constitution grow?'
        write: 'The judiciary develops constitutions through ?'
      - section: 'Name it'
        say: 'This is judicial review.'
        write: 'Judicial review'
      - section: 'The fact'
        say: 'Judicial review is the power of the courts to interpret the constitution and declare any law that goes against it null and void.'
        write: 'Courts interpret the constitution; unconstitutional law = null and void'
      - section: 'How it works'
        say: 'Each time the courts interpret the constitution, their ruling becomes part of how it is understood. So the constitution grows through court decisions.'
        write: 'Court ruling → part of the constitution''s meaning'
      - section: 'In Nigeria'
        say: 'In the Lakanmi case of nineteen seventy, the Supreme Court ruled on the limits of a military decree.'
        write: 'Lakanmi case, 1970, Supreme Court'
      - say: 'Under the nineteen ninety-nine Constitution, the courts also settle disputes between the federal and state governments.'
        write: 'Courts settle federal and state disputes'
      - section: 'Remember'
        say: 'Remember, the legislature writes the law, and the judiciary reads it. Its reading shapes the constitution.'
        write: 'Legislature writes, judiciary reads'
      - section: 'Answer'
        say: 'So the judiciary contributes to constitutions through judicial review, which is option A.'
        write: '$\therefore$ judicial review'
        answer: true
    traps:
      B: 'You went for historical records. They are a source of a constitution, but historians and archives keep them, not the judiciary.'
      C: 'You chose bye-laws. Those are made by local government councils, not by the courts.'
      D: 'You picked Acts of parliament. They do develop a constitution, but they are the work of the legislature, not the judiciary.'
  7:
    moments:
      - section: 'The question'
        say: 'We need a duty that only the upper house carries out, not one it shares.'
        write: 'Duty of the upper house alone = ?'
      - section: 'Name it'
        say: 'The upper house of Nigeria''s National Assembly is the Senate.'
        write: 'Upper house = Senate'
      - section: 'The fact'
        say: 'The Senate has one hundred and nine members, three from each state and one from the Federal Capital Territory. The House of Representatives has three hundred and sixty.'
        write: 'Senate 109, House of Representatives 360'
      - section: 'Shared or alone'
        say: 'Every bill, the budget included, must pass both houses. But confirming the President''s appointees belongs to the Senate alone.'
        write: 'Bills: both houses. Confirmation: Senate alone'
      - section: 'In Nigeria'
        say: 'Under section one hundred and forty-seven of the nineteen ninety-nine Constitution, the Senate screens and confirms each ministerial nominee.'
        write: 'Section 147: Senate confirms ministers'
      - section: 'Remember'
        say: 'Remember, the Senate screens the President''s team.'
        write: 'Senate screens the team'
      - section: 'The trap'
        say: 'The appropriation bill tempts, but it must pass both houses, so it is not the Senate''s alone.'
        write: 'Appropriation bill = both houses'
      - section: 'Answer'
        say: 'So the duty of the upper house alone is the confirmation of the appointment of ministers, which is option C.'
        write: '$\therefore$ confirmation of ministers'
        answer: true
    traps:
      A: 'You went for assent. The President assents to bills, not the Senate.'
      B: 'You chose signing treaties. The executive signs them. The legislature only makes them part of our law.'
      D: 'You picked the appropriation bill. It must pass both houses, so it is not the Senate''s alone.'
  8:
    moments:
      - section: 'The question'
        say: 'On the twelfth of June, nineteen ninety-three, Nigerians voted for a President. Which two parties were on the ballot?'
        write: 'Parties in the 1993 presidential election = ?'
      - section: 'Name it'
        say: 'This is the presidential election of the Third Republic.'
        write: 'Third Republic presidential election, 12 June 1993'
      - section: 'The fact'
        say: 'The Babangida government registered only two parties in nineteen eighty-nine.'
        write: 'Two parties registered in 1989'
      - say: 'They were the N R C, the National Republican Convention, and the S D P, the Social Democratic Party.'
        write: 'NRC and SDP'
      - section: 'Why two'
        say: 'Two parties were created so that each would have to be national, not ethnic or regional. Bashir Tofa ran for the N R C and Chief M K O Abiola for the S D P.'
        write: 'NRC: Bashir Tofa; SDP: M. K. O. Abiola'
      - section: 'In Nigeria'
        say: 'The election was annulled on the twenty-third of June, nineteen ninety-three. Today the twelfth of June is Nigeria''s Democracy Day.'
        write: 'Annulled 23 June 1993; 12 June now Democracy Day'
      - section: 'Remember'
        say: 'Remember, nineteen ninety-three had two parties, one a little to the right and one a little to the left.'
        write: '1993: NRC (right), SDP (left)'
      - section: 'Answer'
        say: 'So the parties that contested the nineteen ninety-three presidential election were the N R C and the S D P, which is option A.'
        write: '$\therefore$ NRC and SDP'
        answer: true
    traps:
      B: 'You went for the A D and the A P P. Those parties were registered in nineteen ninety-eight and contested in nineteen ninety-nine, in the Fourth Republic.'
      C: 'You chose the U N C P and the N D P. The U N C P was a party of the Abacha transition, whose presidential election never held, and no N D P contested in nineteen ninety-three.'
      D: 'You picked the P R P and the D P P. The P R P was a Second Republic party of nineteen seventy-nine, and no D P P contested in nineteen ninety-three.'
  9:
    moments:
      - section: 'The question'
        say: 'Picture a village where everyone shares the land and works it for the good of all. What do we call that way of life?'
        write: 'Resources pooled for the well-being of all = ?'
      - section: 'Name it'
        say: 'This is communalism, a mode of production.'
        write: 'Communalism'
      - section: 'The fact'
        say: 'In communalism, the land and resources of a community belong to all, and are pooled and used for everyone''s well-being.'
        write: 'Community owns resources; used for all'
      - section: 'How it works'
        say: 'It was the way of life in most pre-colonial African societies. People farmed, built and hunted together, and no one was left without land.'
        write: 'Pre-colonial Africa: work together, no one landless'
      - section: 'In Nigeria'
        say: 'In many Nigerian villages, community land still cannot be sold by one person, and people still join hands to clear a farm or build a house.'
        write: 'Community land, communal labour still seen today'
      - section: 'Remember'
        say: 'Remember, communal comes from community, so all share and all care.'
        write: 'Communal = community: all share, all care'
      - section: 'Answer'
        say: 'So pooling a community''s resources for the good of all is communalism, which is option B.'
        write: '$\therefore$ communalism'
        answer: true
    traps:
      A: 'You went for communism. It sounds alike, but communism is the classless, stateless stage that Karl Marx said would come after socialism, in industrial nations.'
      C: 'You chose socialism. Socialism puts the main means of production in the hands of the state, which plans the economy.'
      D: 'You picked capitalism. Capitalism leaves resources in private hands, run for private profit.'
  10:
    moments:
      - section: 'The question'
        say: 'Nigeria belongs to many international bodies. But which one was she there to found?'
        write: 'Nigeria was a founding member of ?'
      - section: 'Name it'
        say: 'This is about founding membership, which means being there at the start.'
        write: 'Founding member = there at the start'
      - section: 'The rule'
        say: 'Nigeria became independent on the first of October, nineteen sixty. She could only found a body formed after that date.'
        write: 'Independence: 1 October 1960'
      - section: 'Check the dates'
        say: 'The U N, the United Nations, began in nineteen forty-five. The modern Commonwealth and NATO began in nineteen forty-nine.'
        write: 'UN 1945; Commonwealth 1949; NATO 1949'
      - say: 'ECOWAS, the Economic Community of West African States, was founded on the twenty-eighth of May, nineteen seventy-five.'
        write: 'ECOWAS: 28 May 1975'
      - section: 'In Nigeria'
        say: 'General Yakubu Gowon of Nigeria and General Eyadema of Togo led the move, and the treaty was signed in Lagos.'
        write: 'Treaty of Lagos, Gowon and Eyadema'
      - section: 'Remember'
        say: 'Remember, ECOWAS was born in Lagos in nineteen seventy-five.'
        write: 'ECOWAS: born in Lagos, 1975'
      - section: 'Answer'
        say: 'So the body Nigeria helped to found was ECOWAS, which is option D.'
        write: '$\therefore$ ECOWAS'
        answer: true
    traps:
      A: 'You went for the United Nations. Nigeria is a full member, but she joined on the seventh of October, nineteen sixty, fifteen years after it was founded.'
      B: 'You chose the Commonwealth. It existed before nineteen sixty, and Nigeria joined it at independence.'
      C: 'You picked NATO. It is a military alliance of North America and Europe from nineteen forty-nine, and Nigeria has never been a member.'
  11:
    moments:
      - section: 'The question'
        say: 'In nineteen ninety, a civil war raged in a West African country, and Nigeria led the effort to end it. Where?'
        write: 'Nigeria''s ECOWAS role in dispute resolution was in ?'
      - section: 'Name it'
        say: 'This is ECOMOG, the ECOWAS Monitoring Group, the peacekeeping force of ECOWAS.'
        write: 'ECOMOG = ECOWAS Monitoring Group'
      - section: 'The fact'
        say: 'In August, nineteen ninety, ECOWAS sent ECOMOG into Liberia to end the civil war there.'
        write: 'August 1990: ECOMOG into Liberia'
      - section: 'Why Nigeria'
        say: 'Nigeria supplied most of the troops, money and commanders, because the war threatened the whole sub-region and the Nigerians living there.'
        write: 'Nigeria: most troops, money, commanders'
      - section: 'In Nigeria'
        say: 'This was Africa as the centrepiece of Nigeria''s foreign policy in action. Nigeria later led ECOMOG in Sierra Leone too.'
        write: 'Later: Sierra Leone too'
      - section: 'Remember'
        say: 'Remember, ECOMOG went into Liberia in nineteen ninety, with Nigeria in front.'
        write: 'Liberia, 1990, ECOMOG, Nigeria in front'
      - section: 'Answer'
        say: 'So Nigeria''s role in ECOWAS dispute resolution was significant in Liberia, which is option A.'
        write: '$\therefore$ Liberia'
        answer: true
    traps:
      B: 'You went for Nigeria. Nigeria was the peacemaker, not the country whose dispute was being settled.'
      C: 'You chose the Gambia. Nigeria''s big peace role in the nineteen nineties was in Liberia and Sierra Leone.'
      D: 'You picked Senegal. Senegal had no civil war that Nigeria led ECOWAS to resolve.'
  12:
    moments:
      - section: 'The question'
        say: 'Voting is a right. Marching peacefully with your friends is a right. But which one is a civil right?'
        write: 'An example of a civil right = ?'
      - section: 'Name it'
        say: 'This is about the kinds of rights a citizen has.'
        write: 'Civil, political and economic rights'
      - section: 'The fact'
        say: 'Civil rights, or civil liberties, are the freedoms a person enjoys in society, such as free speech, religion, movement and peaceful assembly.'
        write: 'Civil rights: speech, religion, movement, assembly'
      - section: 'The difference'
        say: 'Political rights are different. They let a citizen take part in government, like the right to vote and the right to be voted for.'
        write: 'Political rights: vote, be voted for'
      - section: 'In Nigeria'
        say: 'Section forty of the nineteen ninety-nine Constitution protects the right to peaceful assembly and association.'
        write: '1999 Constitution, s.40: peaceful assembly and association'
      - section: 'Remember'
        say: 'Remember, civil rights are about living freely, and political rights are about choosing and being chosen.'
        write: 'Civil = living freely; political = choosing'
      - section: 'Answer'
        say: 'So the right to peaceful assembly is a civil right, which is option C.'
        write: '$\therefore$ peaceful assembly'
        answer: true
    traps:
      A: 'You went for being voted for. That is a political right, the right to stand for election.'
      B: 'You chose property and justice. The right to property is grouped with economic rights, and justice is a duty of the state, not one freedom of the citizen.'
      D: 'You picked the right to vote. Every adult citizen has it, but it is a political right, not a civil one.'
  13:
    moments:
      - section: 'The question'
        say: 'Lawyers talk about serving someone with a writ. What exactly is a writ?'
        write: 'In judicial parlance, a writ means ?'
      - section: 'Name it'
        say: 'This is a writ, a word used in the courts.'
        write: 'Writ'
      - section: 'The fact'
        say: 'A writ is a written order issued by a court, commanding a person to do something or to stop doing it.'
        write: 'Writ = court''s written order to do or not to do'
      - section: 'How it works'
        say: 'A restraining order is the plainest example. It commands a person to hold back or stop an act, and disobeying it is contempt of court.'
        write: 'Restraining order: stop or hold back, or contempt of court'
      - section: 'In Nigeria'
        say: 'Nigerian courts issue writs every day. A civil case begins with a writ of summons, and a person held unlawfully may be freed by a writ of habeas corpus.'
        write: 'Writ of summons; writ of habeas corpus'
      - section: 'Remember'
        say: 'Remember, a writ is the court''s written order.'
        write: 'Writ = written order'
      - section: 'Answer'
        say: 'So in judicial parlance a writ means a restraining order, which is option A.'
        write: '$\therefore$ restraining order'
        answer: true
    traps:
      B: 'You went for prohibitive order. Prohibition is one narrow writ that stops a lower court going beyond its powers, not the general meaning of a writ.'
      C: 'You chose acquitting order. Acquittal is a verdict that frees an accused person at the end of a trial, not a writ.'
      D: 'You picked sentencing order. A sentence is the punishment after conviction, not a writ.'
  14:
    moments:
      - section: 'The question'
        say: 'Public corporations run themselves day to day. So how does the legislature keep them in check?'
        write: 'Legislature controls public corporations through ?'
      - section: 'Name it'
        say: 'This is legislative control of public corporations.'
        write: 'Legislative control of public corporations'
      - section: 'The fact'
        say: 'Public corporations are owned by government but run by their own boards. The legislature controls them mainly through money.'
        write: 'Owned by government, run by boards'
      - section: 'How it works'
        say: 'Each year their budgets come before the legislature for approval.'
        write: 'Annual budgets approved by the legislature'
      - say: 'Their accounts are also examined by the Public Accounts Committee, so they must explain how public money is spent.'
        write: 'Public Accounts Committee checks spending'
      - section: 'In Nigeria'
        say: 'The National Assembly approves the budgets of federal corporations and can summon their heads to explain their spending.'
        write: 'National Assembly approves, summons heads'
      - section: 'Remember'
        say: 'Remember, the legislature holds the purse, so it holds the corporation.'
        write: 'Hold the purse, hold the corporation'
      - section: 'Answer'
        say: 'So the legislature controls public corporations through approval of their annual budgets, which is option C.'
        write: '$\therefore$ approval of their annual budgets'
        answer: true
    traps:
      A: 'You went for daily monitoring. The legislature checks corporations only from time to time. Daily work is for their boards and management.'
      B: 'You chose discipline of staff. That is done by the corporation''s own management.'
      D: 'You picked recruitment of staff. The board and management hire staff, not the legislature.'
  15:
    moments:
      - section: 'The question'
        say: 'Since nineteen sixty, Africa has been the centre of Nigeria''s foreign policy. But why put Africa first?'
        write: 'Why is Africa the centrepiece of Nigeria''s foreign policy?'
      - section: 'Name it'
        say: 'This is Africa as the centrepiece of Nigeria''s foreign policy.'
        write: 'Africa as the centrepiece'
      - section: 'The fact'
        say: 'Since independence, Nigeria has put Africa at the centre of her foreign policy, starting with her neighbours and West Africa.'
        write: 'Neighbours → West Africa → Africa'
      - section: 'Why'
        say: 'Trouble next door, like war, refugees or foreign bases, quickly spills into Nigeria. Peace around her protects her own home environment.'
        write: 'Peace around Nigeria → safety at home'
      - section: 'In Nigeria'
        say: 'Professor Ibrahim Gambari, Foreign Minister in nineteen eighty-four, called this the concentric circles. Nigeria''s own security comes first, then her neighbours, then West Africa, then Africa, then the world.'
        write: 'Concentric circles: Nigeria → neighbours → West Africa → Africa → world'
      - section: 'Remember'
        say: 'Remember, keep your neighbour''s house safe and your own house is safe.'
        write: 'Neighbour safe, home safe'
      - section: 'Answer'
        say: 'So one reason for making Africa the centrepiece is to protect her domestic environment, which is option C.'
        write: '$\therefore$ protect her domestic environment'
        answer: true
    traps:
      A: 'You went for rivalry. Nigeria''s policy seeks peace and unity in Africa, not rivalry.'
      B: 'You chose monopolising African economies. Nigeria seeks cooperation through bodies like ECOWAS, not control of other economies.'
      D: 'You picked challenging the major powers. Nigeria has opposed them on issues like apartheid, but that is not why Africa comes first.'
  16:
    moments:
      - section: 'The question'
        say: 'Before nineteen twenty-two, no Nigerian could vote anyone into the colonial legislature. Which constitution changed that?'
        write: 'Elective principle first introduced by ?'
      - section: 'Name it'
        say: 'This is the elective principle, the right to choose members of the legislature by vote.'
        write: 'Elective principle = choosing legislators by vote'
      - section: 'The fact'
        say: 'The Clifford Constitution of nineteen twenty-two, named after Governor Sir Hugh Clifford, first allowed elected members in the Legislative Council.'
        write: 'Clifford Constitution, 1922'
      - section: 'How it worked'
