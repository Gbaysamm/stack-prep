# UTME 2016 Government, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good government teacher works on the board:
# the question, the concept or institution named, the fact or definition, why or how it works,
# a Nigerian link, a way to remember it, the tempting wrong option, and the answer.
#
#   say:     heard, not read. Dates said as years or full dates, abbreviations spelled out the
#            first time, no symbols the voice would stop on.
#   write:   the one line written while it is said.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2016.yaml. Answers match that file. Q43 repeats
# Q37 in print, so it was rebuilt on the same topic; all 50 questions have a lesson.
format_version: 1
exam_year: 2016
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'A Ghanaian trader has lived in Kano for twenty years and wants to become a Nigerian. He has no Nigerian parent, grandparent or wife. Which door is open to him?'
        write: 'An alien acquires citizenship through $= ?$'
      - section: 'Name it'
        say: 'This is naturalization, one of the ways of becoming a citizen.'
        write: 'Naturalization'
      - section: 'The fact'
        say: 'Naturalization is the process by which a foreigner with no birth or family tie applies to become a citizen, and the government grants it.'
        write: 'Naturalization = alien applies, government grants citizenship'
      - section: 'Why'
        say: 'An alien was not born a citizen and has no Nigerian family. So he must live here many years, show good character, swear loyalty and receive a certificate.'
        write: 'Long residence + good character + oath → certificate'
      - section: 'In Nigeria'
        say: 'Under the nineteen ninety-nine Constitution, a foreigner who has lived in Nigeria for about fifteen years can apply to the President for naturalization.'
        write: '1999 Constitution: about 15 years in Nigeria, apply to the President'
      - section: 'Remember'
        say: 'Born here is birth. Married to a Nigerian or of Nigerian descent is registration. A stranger who settles is naturalization.'
        write: 'Birth · registration (a tie) · naturalization (a stranger)'
      - section: 'The trap'
        say: 'Registration tempts, but in Nigeria it is for people who already have a tie, like a foreign wife of a Nigerian man.'
        write: 'Registration needs a tie already'
      - section: 'Answer'
        say: 'So an alien acquires citizenship through naturalization, which is option C.'
        write: '$\therefore$ naturalization'
        answer: true
    traps:
      A: 'You went for registration. In Nigeria registration is for people with a tie already, such as a foreign wife of a Nigerian man or someone with a Nigerian grandparent.'
      B: 'You chose birth. Citizenship by birth comes from citizen parents or grandparents, so an alien cannot have it.'
      D: 'You picked conferment. That is not one of the ways the constitution lays down for an alien to become a citizen.'
  2:
    moments:
      - section: 'The question'
        say: 'Lagos has millions of people and Bayelsa far fewer. Yet each sends three senators. Why is the upper house built like that?'
        write: 'The upper house in a federation is created to $= ?$'
      - section: 'Name it'
        say: 'This is the upper house, usually called the Senate.'
        write: 'Upper house = Senate'
      - section: 'The fact'
        say: 'A federation shares power between a central government and smaller units, which in Nigeria are the states. These are the federating units. In most federations the upper house gives every federating unit the same number of seats, whatever its size.'
        write: 'Same seats for every unit'
      - section: 'Why'
        say: 'The lower house is shared by population, so big units win more seats there. The upper house balances that, so small units are not swallowed.'
        write: 'Lower house by population → upper house by equality'
      - section: 'In Nigeria'
        say: 'Nigeria''s Senate has three senators from each of the thirty-six states and one from the Federal Capital Territory.'
        write: '3 per state + 1 for the FCT'
      - section: 'Remember'
        say: 'Remember, the lower house counts heads and the upper house counts states.'
        write: 'Lower counts heads, upper counts states'
      - section: 'The trap'
        say: 'The two houses do check each other, but that is not why a federation has an upper house. It is there to make the units equal.'
        write: 'Checking the lower house is not the reason'
      - section: 'Answer'
        say: 'So the upper house is created to ensure equality of the federating units, which is option D.'
        write: '$\therefore$ equality of federating units'
        answer: true
    traps:
      A: 'You went for preventing excesses of the executive. Both houses check the executive. That is the work of the whole legislature, not the reason for an upper house.'
      B: 'You chose experienced elders. Some upper houses seated chiefs, but in a federation the upper house is there to make the units equal.'
      C: 'You picked checking the lower house. The two houses check each other, but that is not why the upper house was created.'
  3:
    moments:
      - section: 'The question'
        say: 'Your grandmother''s pension has not been paid for a year, and the office keeps sending her away. Where can she complain?'
        write: 'The Public Complaints Commission is responsible for $= ?$'
      - section: 'Name it'
        say: 'The body is the Public Complaints Commission, which is Nigeria''s ombudsman.'
        write: 'Public Complaints Commission = ombudsman'
      - section: 'The fact'
        say: 'An ombudsman receives and investigates complaints from citizens against public servants and government agencies.'
        write: 'Receives complaints against public servants'
      - section: 'Why'
        say: 'Going to court is slow and costly. The commission gives ordinary people a free place to complain, then it investigates and recommends a remedy.'
        write: 'Free, simple → investigate → recommend'
      - section: 'In Nigeria'
        say: 'Nigeria set up the Public Complaints Commission in nineteen seventy-five, with an office in every state.'
        write: 'Set up 1975, an office in every state'
      - section: 'Remember'
        say: 'Remember, the ombudsman is the people''s complaint office.'
        write: 'Ombudsman = complaint office'
      - section: 'The trap'
        say: 'Sentencing tempts, but the commission is not a court. Only a court can sentence.'
        write: 'Not a court, so no sentencing'
      - section: 'Answer'
        say: 'So the commission is responsible for entertaining complaints against public servants, which is option B.'
        write: '$\therefore$ entertaining complaints against public servants'
        answer: true
    traps:
      A: 'You went for false documents. Forgery is a crime for the police and the courts, not the commission.'
      C: 'You chose arresting public servants. The commission has no power of arrest. That belongs to the police.'
      D: 'You picked sentencing. The commission can only investigate and recommend. Only a court can sentence.'
  4:
    moments:
      - section: 'The question'
        say: 'Before there were parties or trade unions, someone began to argue with the colonial government in Lagos. Who was it?'
        write: 'The earliest nationalist activities were spearheaded by $= ?$'
      - section: 'Name it'
        say: 'This is the beginning of nationalism in Nigeria.'
        write: 'Early Nigerian nationalism'
      - section: 'The fact'
        say: 'Nationalism in Nigeria was begun by the educated elite. These were lawyers, journalists, clergymen and teachers.'
        write: 'Educated elite: lawyers, journalists, clergy, teachers'
      - section: 'Why'
        say: 'They could read the colonial laws and answer them in newspapers, in the rulers'' own language. They were also the first to be shut out of top jobs.'
        write: 'Could read and argue + shut out of jobs → led'
      - section: 'In Nigeria'
        say: 'Herbert Macaulay and others led the protest against the Lagos water rate in nineteen eight. In nineteen twenty-three he founded the Nigerian National Democratic Party.'
        write: '1908 water rate protest · 1923 NNDP'
      - section: 'Remember'
        say: 'Remember, the pen came first. Educated men with newspapers lit the fire.'
        write: 'The pen came first'
      - section: 'The trap'
        say: 'Traditional rulers tempt. Kings like Jaja of Opobo resisted the British conquest, but that was resistance to conquest, not organised nationalism.'
        write: 'Resisting conquest ≠ nationalist activity'
      - section: 'Answer'
        say: 'So the earliest nationalist activities were spearheaded by the educated elites, which is option B.'
        write: '$\therefore$ educated elites'
        answer: true
    traps:
      A: 'You went for trade unions. They grew strong only in the nineteen thirties and forties, long after the first protests.'
      C: 'You chose political parties. The parties came out of nationalism. The first one was formed only in nineteen twenty-three, by the educated elite.'
      D: 'You picked traditional rulers. They resisted the conquest, and many later worked with the colonial government. They did not lead nationalism.'
  5:
    moments:
      - section: 'The question'
        say: 'Think of health, farming, schools and trade. Which organ of the United Nations brings member states together in all these fields?'
        write: 'UN organ promoting voluntary co-operation in diverse areas $= ?$'
      - section: 'Name it'
        say: 'This is the Economic and Social Council, one of the six main organs of the United Nations.'
        write: 'Economic and Social Council (ECOSOC)'
      - section: 'The fact'
        say: 'It promotes co-operation in economic, social, cultural, educational and health matters.'
        write: 'Economic, social, cultural, educational, health'
      - say: 'It also co-ordinates the specialized agencies. These are United Nations bodies that each work in one field, such as the World Health Organization in health.'
        write: 'Co-ordinates the specialized agencies, such as WHO'
      - section: 'Why'
        say: 'States join the specialized agencies by choice, and the council works by study and recommendation. So the co-operation it builds is voluntary.'
        write: 'Join by choice + recommend → voluntary co-operation'
      - section: 'In Nigeria'
        say: 'The World Health Organization''s support for polio immunisation in Nigeria is one fruit of that co-operation.'
        write: 'WHO and polio immunisation in Nigeria'
      - section: 'Remember'
        say: 'Remember, economic and social means the many fields of everyday life.'
        write: 'Economic + social = everyday life'
      - section: 'The trap'
        say: 'The General Assembly tempts because every member debates there. But the organ built to run co-operation in these fields is the Economic and Social Council.'
        write: 'General Assembly debates · ECOSOC co-ordinates'
      - section: 'Answer'
        say: 'So the organ is the Economic and Social Council, which is option D.'
        write: '$\therefore$ Economic and Social Council'
        answer: true
    traps:
      A: 'You went for the General Assembly. It is the main debating body where every member sits, not the organ that runs economic and social co-operation.'
      B: 'You chose the International Court of Justice. It settles legal disputes between states.'
      C: 'You picked the Security Council. It keeps the peace, and its decisions bind members, so that is not voluntary.'
  6:
    moments:
      - section: 'The question'
        say: 'The votes are counted in hundreds of polling units. Who stands up at the end and announces the winner?'
        write: 'The officer who announces the result $= ?$'
      - section: 'Name it'
        say: 'This is the returning officer.'
        write: 'Returning officer'
      - section: 'The fact'
        say: 'The returning officer collects the results from all the polling units in a constituency, adds them up and declares the winner.'
        write: 'Collects, adds up, declares'
      - section: 'Why'
        say: 'Votes are counted first at each unit and then collated, which means gathered and added up, at higher and higher levels. One officer must announce the final total, and that is the returning officer.'
        write: 'Polling unit → collation → returning officer'
      - section: 'In Nigeria'
        say: 'I N E C, the Independent National Electoral Commission, appoints the returning officers. For the presidential election, the INEC chairman is the returning officer.'
        write: 'INEC appoints them · INEC chairman for the presidency'
      - section: 'Remember'
        say: 'Remember, the returning officer returns the winner.'
        write: 'Returning officer returns the winner'
      - section: 'The trap'
        say: 'The presiding officer tempts, but he runs only one polling unit. He does not announce the final result.'
        write: 'Presiding officer = one polling unit'
      - section: 'Answer'
        say: 'So the officer who announces the result is the returning officer, which is option C.'
        write: '$\therefore$ returning officer'
        answer: true
    traps:
      A: 'You went for electoral officer. That is a general title for an election official, not the one who declares the final result.'
      B: 'You chose presiding officer. He is in charge of one polling unit only.'
      D: 'You picked ballot officer. There is no such office that declares results.'
  7:
    moments:
      - section: 'The question'
        say: 'In a Hausa Fulani emirate, war has come. Which titled official leads the army out?'
        write: 'Commander of the army in the emirate $= ?$'
      - section: 'Name it'
        say: 'This is the Madawaki, a title in the emirate system.'
        write: 'Madawaki'
      - section: 'The fact'
        say: 'The emir ruled with titled officials, and the Madawaki was the commander of the army.'
        write: 'Madawaki = commander of the army'
      - section: 'Why'
        say: 'Each official had one job, so the emir could rule a large area. Let us see a few of them beside the Madawaki.'
        write: 'One official, one job'
      - say: 'For example, the Waziri was the chief adviser to the emir, rather like a prime minister.'
        write: 'Waziri = chief adviser'
      - say: 'The Alkali was the judge, who applied Islamic law in the courts.'
        write: 'Alkali = judge'
      - say: 'The Ma''aji kept the treasury. So only the Madawaki led the army in war.'
        write: 'Ma''aji = treasurer · Madawaki = war'
      - section: 'In Nigeria'
        say: 'These titles live on today in emirates such as Kano, Zaria and Katsina.'
        write: 'Kano, Zaria, Katsina'
      - section: 'Remember'
        say: 'Remember, the Madawaki marches. He is the soldier among the titles.'
        write: 'Madawaki marches'
      - section: 'The trap'
        say: 'Sarkin Fada tempts because he is close to the emir, but he heads the palace officials, not the army.'
        write: 'Sarkin Fada = head of palace officials'
      - section: 'Answer'
        say: 'So the commander of the army is the Madawaki, which is option D.'
        write: '$\therefore$ Madawaki'
        answer: true
    traps:
      A: 'You went for Sarkin Fada. He was the head of the palace officials, not the army.'
      B: 'You chose Hakimi. He was a district head who collected taxes in his district.'
      C: 'You picked Alkali. He was the judge who applied Islamic law.'
  8:
    moments:
      - section: 'The question'
        say: 'The legislature passes a law that breaks the constitution. Which tool lets another arm stop it?'
        write: 'A feature of checks and balances $= ?$'
      - section: 'Name it'
        say: 'This is judicial review, a tool of checks and balances.'
        write: 'Judicial review'
      - section: 'The fact'
        say: 'Judicial review is the power of the courts to declare a law or an executive action null and void, that is, of no effect, if it breaks the constitution.'
        write: 'Courts can declare unconstitutional acts void'
      - section: 'Why'
        say: 'Checks and balances means each arm can limit the others. With judicial review, the courts check both the legislature and the executive.'
        write: 'Courts check legislature and executive'
      - section: 'In Nigeria'
        say: 'The nineteen ninety-nine Constitution says any law inconsistent with it is void, and the Supreme Court has struck laws down on that ground.'
        write: '1999 Constitution supreme · Supreme Court strikes down'
      - section: 'Remember'
        say: 'Remember, review means the court looks again and can cancel.'
        write: 'Review = look again, cancel'
      - section: 'The trap'
        say: 'Judicial immunity tempts, but it only protects judges from being sued. It shields, it does not check.'
        write: 'Immunity shields, it does not check'
      - section: 'Answer'
        say: 'So the feature of checks and balances is judicial review, which is option B.'
        write: '$\therefore$ judicial review'
        answer: true
    traps:
      A: 'You went for code of conduct. It sets rules of behaviour for public officers, not one arm checking another.'
      C: 'You chose judicial immunity. It protects judges from being sued. It does not let one arm check another.'
      D: 'You picked judicial precedent. That means courts follow earlier decisions. It guides judges, it does not check other arms.'
  9:
    moments:
      - section: 'The question'
        say: 'A legislator wins his seat on one party''s ticket, then joins another party. Which constitution first said he must lose his seat?'
        write: 'Cross-carpeting was first outlawed by $= ?$'
      - section: 'Name it'
        say: 'This is carpet crossing, also called cross carpeting.'
        write: 'Carpet-crossing'
      - section: 'The fact'
        say: 'Carpet crossing is when an elected member leaves his party for another while keeping his seat.'
        write: 'Leave the party, keep the seat'
      - section: 'Why'
        say: 'Carpet crossing betrays the voters, because many of them voted for the party and its programme, not only for the man.'
        write: 'Betrays the voters who chose the party'
      - say: 'So the nineteen seventy-nine Constitution was the first to say such a member loses his seat, unless his party had split or merged.'
        write: '1979: cross over → lose the seat'
      - section: 'In Nigeria'
        say: 'Nigeria saw its harm in nineteen fifty-one, when crossings to the Action Group in the Western House cost Nnamdi Azikiwe a seat in the central legislature.'
        write: '1951 Western House crossings'
      - section: 'Now'
        say: 'The nineteen ninety-nine Constitution keeps the same rule today.'
        write: '1999 keeps the rule'
      - section: 'Remember'
        say: 'Remember, seventy-nine stopped the crossing.'
        write: '79 stopped the crossing'
      - section: 'The trap'
        say: 'The nineteen sixty-three Constitution tempts because it made Nigeria a republic. But it had no rule against carpet crossing.'
        write: '1963: republic, but no ban'
      - section: 'Answer'
        say: 'So cross carpeting was first outlawed in the nineteen seventy-nine constitution, which is option B.'
        write: '$\therefore$ 1979 constitution'
        answer: true
    traps:
      A: 'You went for the nineteen sixty-three constitution. It made Nigeria a republic, but it did not outlaw carpet crossing.'
      C: 'You chose the nineteen sixty constitution. It had no rule against it, and the crossings of the First Republic went unpunished.'
      D: 'You picked the nineteen ninety-nine constitution. It keeps the ban, but the nineteen seventy-nine constitution brought it in first.'
  10:
    moments:
      - section: 'The question'
        say: 'In Old Oyo, someone had to offer the sacred rites to the earth. Which body did that?'
        write: 'Ritual rites in the Yoruba empire were performed by $= ?$'
      - section: 'Name it'
        say: 'This is the Ogboni, a body in Old Oyo.'
        write: 'Ogboni'
      - section: 'The fact'
        say: 'The Ogboni was a secret society of elders and important men. It performed the religious and ritual rites, especially the worship of the earth.'
        write: 'Ogboni = secret society, ritual rites, earth worship'
      - section: 'Why'
        say: 'Because it held these sacred duties, the Ogboni also stood between the Alaafin and the Oyomesi, and both respected its word.'
        write: 'Sacred duties → respected by Alaafin and Oyomesi'
      - section: 'In Nigeria'
        say: 'The Ogboni still exists in Yoruba towns today, with a part in rites around the traditional ruler.'
        write: 'Still in Yoruba towns'
      - section: 'Remember'
        say: 'Remember, Ogboni for the gods, Oyomesi for the throne, and Aare Ona Kakanfo for war.'
        write: 'Ogboni gods · Oyomesi throne · Kakanfo war'
      - section: 'The trap'
        say: 'The Oyomesi tempt, but they were the seven kingmakers led by the Bashorun. That is a political council.'
        write: 'Oyomesi = kingmakers'
      - section: 'Answer'
        say: 'So the ritual rites were the responsibility of the Ogboni, which is option C.'
        write: '$\therefore$ Ogboni'
        answer: true
    traps:
      A: 'You went for Aare Ona Kakanfo. He was the field commander of the army.'
      B: 'You chose the Oyomesi. They were the kingmakers and council of state, a political body.'
      D: 'You picked the Oba. The Alaafin was the head of the empire, and the rites were carried out by the Ogboni.'
  11:
    moments:
      - section: 'The question'
        say: 'Imagine a society with no rich owners and no poor workers, just everyone owning together. Whose dream is that?'
        write: 'A classless society is the goal of $= ?$'
      - section: 'Name it'
        say: 'This is Marxism, the ideas of Karl Marx and Friedrich Engels.'
        write: 'Marxism'
      - section: 'The fact'
        say: 'Marxism teaches that history is a struggle between owners and workers. Its goal is a classless society where the means of production, which are the land, factories and machines used to make goods, are owned in common.'
        write: 'Class struggle → common ownership → classless society'
      - section: 'Why'
        say: 'Marx said private ownership makes classes, and classes make conflict. Remove private ownership and the classes disappear.'
        write: 'Private ownership → classes → conflict'
      - section: 'In Nigeria'
        say: 'In the Second Republic, Obafemi Awolowo''s Unity Party of Nigeria called its programme democratic socialism. That meant reforms like free education in a mixed economy, not a classless society.'
        write: 'UPN democratic socialism: reform, not classless'
      - section: 'Remember'
        say: 'Remember, Marx wanted no masters.'
        write: 'Marx: no masters'
      - section: 'The trap'
        say: 'Conservatism may tempt, but it wants to keep society as it is, classes and all.'
        write: 'Conservatism keeps the classes'
      - section: 'Answer'
        say: 'So a classless society is the goal of Marxism, which is option A.'
        write: '$\therefore$ Marxism'
        answer: true
    traps:
      B: 'You went for feudalism. It is built on classes, with lords above serfs, so it cannot aim at a classless society.'
      C: 'You chose liberalism. It stresses individual freedom and private property, and it accepts classes.'
      D: 'You picked conservatism. It defends the existing order, classes included.'
  12:
    moments:
      - section: 'The question'
        say: 'Lugard had few officers and little money. Why did ruling through local rulers work so well in the North?'
        write: 'Indirect rule succeeded in the North because $= ?$'
      - section: 'Name it'
        say: 'This is indirect rule, the British policy of ruling through traditional rulers.'
        write: 'Indirect rule'
      - section: 'The fact'
        say: 'The emirates already had an organised structure, with an emir, titled officials, a tax system and Alkali courts.'
        write: 'Emir + officials + taxes + Alkali courts'
      - section: 'Why'
        say: 'Where a working system already existed, the British only had to put a Resident, a British officer who advised and watched over the emir, beside the emir and use his machinery.'
        write: 'Ready structure → just add a Resident'
      - section: 'In Nigeria'
        say: 'In the East there were no such kings. The British made warrant chiefs, and the Aba Women''s Riot of nineteen twenty-nine showed the failure.'
        write: 'East: warrant chiefs, 1929 Aba Women''s Riot'
      - section: 'Remember'
        say: 'Remember, indirect rule needs a ready structure to rule through.'
        write: 'No structure, no indirect rule'
      - section: 'The trap'
        say: 'Little resistance tempts, but the North did resist. Sokoto was taken by force in nineteen oh three.'
        write: 'The North resisted, Sokoto 1903'
      - section: 'Answer'
        say: 'So indirect rule worked in the North because of an organised structure there, which is option B.'
        write: '$\therefore$ an organised structure in the area'
        answer: true
    traps:
      A: 'You went for farmlands. Land was not the reason. The success came from the existing system of rule.'
      C: 'You chose little resistance. The North did resist, as in the fall of Sokoto in nineteen oh three.'
      D: 'You picked the people''s wish to be ruled indirectly. The people did not choose it. The British did.'
  13:
    moments:
      - section: 'The question'
        say: 'The state House of Assembly passes an education law. Whose job is it to carry it out?'
        write: 'As an executive, the commissioner is responsible for $= ?$'
      - section: 'Name it'
        say: 'This is the commissioner, a member of the state executive.'
        write: 'Commissioner'
      - section: 'The fact'
        say: 'A commissioner is appointed by the governor, confirmed by the state House of Assembly, and heads a ministry.'
        write: 'Appointed by governor · confirmed by Assembly · heads a ministry'
      - section: 'Why'
        say: 'The executive arm implements the laws the legislature makes. So the commissioner implements laws through his ministry.'
        write: 'Executive = implements laws'
      - section: 'In Nigeria'
        say: 'In a Nigerian state, the Commissioner for Education carries out the education law by running the public schools.'
        write: 'Commissioner for Education runs the schools'
      - section: 'Remember'
        say: 'Remember, the legislature makes, the executive implements and the judiciary interprets.'
        write: 'Make · implement · interpret'
      - section: 'The trap'
        say: 'Writing laws and law making tempt, but that is the House of Assembly''s work, not a commissioner''s.'
        write: 'Law making = House of Assembly'
      - section: 'Answer'
        say: 'So the commissioner is responsible for implementing laws, which is option B.'
        write: '$\therefore$ implementing laws'
        answer: true
    traps:
      A: 'You went for writing laws. That is the work of the legislature, the state House of Assembly.'
      C: 'You chose giving loans. That is the work of banks, not a commissioner.'
      D: 'You picked law making. That belongs to the legislature, not the executive.'
  14:
    moments:
      - section: 'The question'
        say: 'The prime minister and the ministers all sit in parliament and answer to it. Which country is the classic home of that system?'
        write: 'A country with a cabinet system $= ?$'
      - section: 'Name it'
        say: 'This is the cabinet system, also called the parliamentary system.'
        write: 'Cabinet (parliamentary) system'
      - section: 'The fact'
        say: 'The prime minister and ministers are members of parliament, and together they form the cabinet.'
        write: 'Ministers sit in parliament, form the cabinet'
      - say: 'They are collectively responsible to parliament. This means they stand or fall together, so if parliament loses confidence in them, the whole cabinet goes.'
        write: 'Collective responsibility = stand or fall together'
      - section: 'Why'
        say: 'The system grew in Britain over centuries, as power passed from the monarch to ministers backed by the House of Commons.'
        write: 'Grew in Britain over centuries'
      - section: 'In Nigeria'
        say: 'Nigeria used it in the First Republic, with Sir Abubakar Tafawa Balewa as prime minister, but has had a presidential system since nineteen seventy-nine.'
        write: 'Nigeria: cabinet 1960 to 1966, presidential since 1979'
      - section: 'Remember'
        say: 'Remember, Westminster is the cabinet''s birthplace.'
        write: 'Westminster'
      - section: 'The trap'
        say: 'Nigeria tempts because it once had a cabinet system. Today it is presidential.'
        write: 'Nigeria now presidential'
      - section: 'Answer'
        say: 'So a good example of a cabinet system is Britain, which is option D.'
        write: '$\therefore$ Britain'
        answer: true
    traps:
      A: 'You went for France. It has a mixed, semi presidential system with a strong elected president.'
      B: 'You chose Cameroun. It has a presidential system with a strong executive president.'
      C: 'You picked Nigeria. It has had a presidential system since nineteen seventy-nine.'
  15:
    moments:
      - section: 'The question'
        say: 'One region of Nigeria was bigger than all the others put together. What did Gowon do about it?'
        write: 'To reduce regional imbalance, the Gowon administration $= ?$'
      - section: 'Name it'
        say: 'This is state creation, used to correct imbalance in the federation.'
        write: 'State creation'
      - section: 'The fact'
        say: 'On the twenty-seventh of May, nineteen sixty-seven, the Gowon administration divided the four regions into twelve states.'
