# UTME 2017 Government, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good government teacher works on the board:
# the question, the concept or institution named, the fact or definition, why or how it works,
# a Nigerian link, a way to remember it, the tempting wrong option, and the answer.
#
#   say:     heard, not read. Dates said as years or full dates, abbreviations spelled out the
#            first time, no symbols the voice would stop on.
#   write:   the one line written while it is said.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2017.yaml. Answers match that file. This paper has
# no paper-type question; all 40 questions each have a lesson.
format_version: 1
exam_year: 2017
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'A citizen has many rights. Which one comes before all the others?'
        write: 'The foremost right of a citizen $= ?$'
      - section: 'Name it'
        say: 'This is about fundamental rights, the rights the constitution guarantees to every citizen.'
        write: 'Fundamental rights'
      - section: 'The fact'
        say: 'The right to life comes first. No one may be deprived of life on purpose, except by the lawful sentence of a court.'
        write: 'Right to life = the first fundamental right'
      - section: 'Why'
        say: 'To speak, to worship, to vote or to own property, you must first be alive. So every other right rests on the right to life.'
        write: 'No life, no other right'
      - section: 'In Nigeria'
        say: 'In the nineteen ninety-nine Constitution, the right to life is section thirty-three, the very first right in Chapter Four.'
        write: '1999 Constitution, Chapter IV, section 33'
      - section: 'Remember'
        say: 'Remember, no life, no other right.'
        write: 'Life first'
      - section: 'The trap'
        say: 'Freedom of religion is a real right, but it is one of many rights that rest on being alive.'
        write: 'Religion: a right, but not the first'
      - section: 'Answer'
        say: 'So the foremost right of a citizen is the right to life, which is option C.'
        write: '$\therefore$ right to life'
        answer: true
    traps:
      A: 'You chose the religious right. Freedom of religion is a fundamental right, but it depends on the right to life, which comes first.'
      B: 'You went for academic right. There is no fundamental right by that name, and education is a goal of state policy.'
      D: 'You picked private life. Privacy is protected, but it ranks after the right to life, which every right depends on.'
  2:
    moments:
      - section: 'The question'
        say: 'What is good about aristocracy as a form of government?'
        write: 'A merit of aristocracy $= ?$'
      - section: 'Name it'
        say: 'Aristocracy comes from the Greek word aristos, which means the best.'
        write: 'Aristocracy, from aristos = best'
      - section: 'The fact'
        say: 'Aristocracy is rule by the best, a few people chosen for their ability, wisdom or birth.'
        write: 'Aristocracy = rule by the best few'
      - section: 'Why'
        say: 'Its merit is that the most able citizens are in charge, so decisions come from people with knowledge and experience.'
        write: 'Able people in charge, wiser decisions'
      - section: 'In Nigeria'
        say: 'The Oyomesi of old Oyo, a council of seven nobles from leading families, worked on this idea.'
        write: 'Oyomesi: seven nobles of Oyo'
      - section: 'Remember'
        say: 'Remember, in aristocracy the best rule, but in oligarchy the few rule for themselves.'
        write: 'Aristocracy = best; oligarchy = selfish few'
      - section: 'The trap'
        say: 'An organised few in control sounds close, but that is oligarchy, the bad form of minority rule.'
        write: 'Organised few = oligarchy'
      - section: 'Answer'
        say: 'So the merit of aristocracy is that the best citizen is in control of government, which is option B.'
        write: '$\therefore$ the best citizen in control'
        answer: true
    traps:
      A: 'You chose military experience. Aristocracy does not need soldiers to rule, and rule by soldiers is a military regime.'
      C: 'You went for the organised few. That is oligarchy, where a few rule for their own benefit, not the merit of aristocracy.'
      D: 'You picked majority control. Rule by the majority is democracy, not aristocracy.'
  3:
    moments:
      - section: 'The question'
        say: 'A country has decided its foreign policy. What tools does it use to carry it out?'
        write: 'A strategy of foreign policy implementation $= ?$'
      - section: 'Name it'
        say: 'These are the instruments of foreign policy.'
        write: 'Instruments of foreign policy'
      - section: 'The fact'
        say: 'The main instruments are diplomacy, propaganda, economic aid or sanctions, and military force as a last resort.'
        write: 'Diplomacy, propaganda, aid or sanctions, force'
      - section: 'Why'
        say: 'Propaganda spreads information and ideas abroad, so that other peoples and governments come round to a country''s point of view.'
        write: 'Propaganda wins minds abroad'
      - section: 'In Nigeria'
        say: 'Nigeria speaks to the world through the Voice of Nigeria, its external radio service, and through its embassies.'
        write: 'Voice of Nigeria, embassies'
      - section: 'Remember'
        say: 'Remember four tools. Talk, tell, trade and troops.'
        write: 'Talk, tell, trade, troops'
      - section: 'The trap'
        say: 'Political representation sounds important, but it is about citizens being represented at home, not about dealing with other states.'
        write: 'Representation: at home, not abroad'
      - section: 'Answer'
        say: 'So the strategy of foreign policy implementation here is propaganda, which is option D.'
        write: '$\therefore$ propaganda'
        answer: true
    traps:
      A: 'You chose cultural integration. That is the blending of cultures within a society, not a tool for dealing with other states.'
      B: 'You went for democratic elections. Elections choose leaders at home. They are not a way of carrying out foreign policy.'
      C: 'You picked political representation. That is about citizens being represented in their own legislature, not about relations abroad.'
  4:
    moments:
      - section: 'The question'
        say: 'Which regime brought in the Structural Adjustment Programme?'
        write: 'Structural Adjustment Programme (SAP) introduced under $= ?$'
      - section: 'Name it'
        say: 'The Structural Adjustment Programme was an economic plan to restructure Nigeria''s economy.'
        write: 'SAP = economic restructuring plan'
      - section: 'The fact'
        say: 'It was introduced in nineteen eighty-six by the military regime of General Ibrahim Babangida, who ruled from nineteen eighty-five to nineteen ninety-three.'
        write: 'SAP, 1986, Babangida regime (1985 to 1993)'
      - section: 'How'
        say: 'It devalued the naira, cut government spending and subsidies, and opened the way for privatization.'
        write: 'Devalue naira, cut spending, privatize'
      - section: 'In Nigeria'
        say: 'Under it, a new foreign exchange market in nineteen eighty-six let the market set the value of the naira.'
        write: 'Second-tier Foreign Exchange Market, 1986'
      - section: 'Remember'
        say: 'Remember, B for Babangida and B for the bitter medicine of the programme.'
        write: 'B for Babangida'
      - section: 'The trap'
        say: 'The Buhari regime came just before, from nineteen eighty-three to nineteen eighty-five, and it had ended before the programme began.'
        write: 'Buhari regime: 1983 to 1985, before SAP'
      - section: 'Answer'
        say: 'So the Structural Adjustment Programme came under the Babangida regime, which is option A.'
        write: '$\therefore$ Babangida regime'
        answer: true
    traps:
      B: 'You chose Obasanjo. His regimes were from nineteen seventy-six to nineteen seventy-nine and from nineteen ninety-nine, not in nineteen eighty-six.'
      C: 'You went for Buhari. His regime ended in nineteen eighty-five, before the programme came in nineteen eighty-six.'
      D: 'You picked Abacha. His regime began in nineteen ninety-three, seven years after the programme.'
  5:
    moments:
      - section: 'The question'
        say: 'ECOWAS has many aims. What kind of bodies did it set up to do its work in each field?'
        write: 'ECOWAS is operationally structured with $= ?$'
      - section: 'Name it'
        say: 'ECOWAS is the Economic Community of West African States.'
        write: 'ECOWAS = Economic Community of West African States'
      - section: 'The fact'
        say: 'The Treaty of Lagos of the twenty-eighth of May, nineteen seventy-five, set up the Authority, the Council of Ministers, the Secretariat, the Tribunal and specialized commissions.'
        write: 'Authority, Council of Ministers, Secretariat, Tribunal, commissions'
      - section: 'How'
        say: 'The commissions do the daily work in each field, such as trade and customs, industry and agriculture, transport, and social and cultural affairs.'
        write: 'One commission for each field of work'
      - section: 'In Nigeria'
        say: 'Nigeria under General Yakubu Gowon, together with Togo, led the founding of ECOWAS, and the treaty was signed in Lagos.'
        write: 'Treaty of Lagos, 28 May 1975'
      - section: 'Now'
        say: 'Today there are more specialized commissions, and since two thousand and seven the Secretariat has been the ECOWAS Commission.'
        write: 'Since 2007: the ECOWAS Commission'
      - section: 'Remember'
        say: 'Remember, ECOWAS works through commissions, one for each field.'
        write: 'ECOWAS works through commissions'
      - section: 'The trap'
        say: 'Councils sounds right, but ECOWAS has only one Council of Ministers, which advises the Authority.'
        write: 'Only one council'
      - section: 'Answer'
        say: 'So ECOWAS is operationally structured with commissions, which is option D.'
        write: '$\therefore$ commissions'
        answer: true
    traps:
      A: 'You chose councils. ECOWAS has just one, the Council of Ministers. Its working structure is the specialized commissions.'
      B: 'You went for panels. Panels are not part of the structure the ECOWAS treaty set up.'
      C: 'You picked committees. Committees may meet, but the treaty organises the work through commissions.'
  6:
    moments:
      - section: 'The question'
        say: 'Which tier of government suffers most from a shortage of trained staff?'
        write: 'Shortage of trained personnel is a major problem of $= ?$'
      - section: 'Name it'
        say: 'This is one of the problems of local government administration.'
        write: 'Problems of local government'
      - section: 'The fact'
        say: 'Local governments have long lacked enough trained engineers, accountants, doctors and planners.'
        write: 'Too few trained staff at local level'
      - section: 'Why'
        say: 'Skilled people prefer the better pay, promotion and city life of federal and state service, so local councils are left with fewer of them.'
        write: 'Better pay elsewhere, so experts leave'
      - section: 'In Nigeria'
        say: 'Nigeria''s seven hundred and seventy-four local government councils depend on each state''s Local Government Service Commission for staff.'
        write: '774 councils, staffed through the state'
      - section: 'Remember'
        say: 'Remember, the lowest tier gets the fewest experts.'
        write: 'Lowest tier, fewest experts'
      - section: 'The trap'
        say: 'State governments also face staff problems, but they can pay and recruit far better than local councils.'
        write: 'States recruit better'
      - section: 'Answer'
        say: 'So shortage of trained personnel is a major problem of local governments, which is option D.'
        write: '$\therefore$ local governments'
        answer: true
    traps:
      A: 'You chose the federal government. It has the most money and attracts the best trained staff.'
      B: 'You went for state governments. They can pay and recruit far better than local councils, so the shortage is worst at local level.'
      C: 'You picked regional governments. Regions ended in nineteen sixty-seven when states were created.'
  7:
    moments:
      - section: 'The question'
        say: 'What do we call the supreme right of a state, answerable to no one?'
        write: 'The supreme right of a state $= ?$'
      - section: 'Name it'
        say: 'This is sovereignty.'
        write: 'Sovereignty'
      - section: 'The fact'
        say: 'Sovereignty is the supreme power of a state to make and enforce laws in its territory, free from outside control.'
        write: 'Supreme power to make and enforce laws'
      - section: 'Why'
        say: 'It is supreme inside, because no one is above it, and independent outside, because no foreign power can command it.'
        write: 'Supreme inside, independent outside'
      - section: 'In Nigeria'
        say: 'Nigeria became a sovereign state on the first of October, nineteen sixty, when Britain stopped making its laws.'
        write: 'Sovereign since 1 October 1960'
      - section: 'Remember'
        say: 'Remember, sovereign means supreme.'
        write: 'Sovereign = supreme'
      - section: 'The trap'
        say: 'Authority is the right to use power, and officers within the state hold it. The supreme right belongs to the state itself.'
        write: 'Authority: held by officers, not supreme'
      - section: 'Answer'
        say: 'So the supreme right of a state is sovereignty, which is option C.'
        write: '$\therefore$ sovereignty'
        answer: true
    traps:
      A: 'You chose authority. Authority is the lawful right to use power, held by officers and bodies within the state, not the supreme right of the state.'
      B: 'You went for power. Power is the ability to make others obey. It is not the same as a right.'
      D: 'You picked legitimacy. That is the people accepting a government''s right to rule, not the supreme right of the state.'
  8:
    moments:
      - section: 'The question'
        say: 'Why do voters like one party more than another?'
        write: 'The popularity of a party rests on its $= ?$'
      - section: 'Name it'
        say: 'This is the party manifesto.'
        write: 'Manifesto'
      - section: 'The fact'
        say: 'A manifesto is the written programme a party puts before voters, showing what it will do if it wins.'
        write: 'Manifesto = the party''s programme and promises'
      - section: 'Why'
        say: 'Voters judge a party mostly by what it promises to do for them, so a good manifesto makes a party popular.'
        write: 'Promises that meet needs win votes'
      - section: 'In Nigeria'
        say: 'Before each election, parties registered by I N E C, the Independent National Electoral Commission, publish manifestos on jobs, roads and security.'
        write: 'Parties registered by INEC publish manifestos'
      - section: 'Remember'
        say: 'Remember, the manifesto is the promise list, and promises win votes.'
        write: 'Manifesto = promise list'
      - section: 'The trap'
        say: 'Ideology shapes the manifesto, but voters respond to the clear programme, not the ideas behind it.'
        write: 'Ideology: behind it, not in front'
      - section: 'Answer'
        say: 'So a party''s popularity rests on its manifesto, which is option B.'
        write: '$\therefore$ manifesto'
        answer: true
    traps:
      A: 'You chose the constitution. A party constitution governs how the party runs itself, and voters hardly read it.'
      C: 'You went for ideology. Ideology is the set of ideas behind a party, but voters respond to the programme it offers.'
      D: 'You picked the number of branches. Branches help a party organise, but people support it for what it promises.'
  9:
    moments:
      - section: 'The question'
        say: 'Picture a council of equals who take turns in the chair. What is that called?'
        write: 'Executive with rotational leadership $= ?$'
      - section: 'Name it'
        say: 'This is the collegiate executive, also called the plural executive.'
        write: 'Collegiate (plural) executive'
      - section: 'The fact'
        say: 'Executive power is held by a council of equals instead of one person, and the chairmanship rotates among them.'
        write: 'Council of equals, chair rotates'
      - section: 'Why'
        say: 'Because the chair rotates, no single member can dominate the council.'
        write: 'Rotation stops domination'
      - section: 'Example'
        say: 'Switzerland has a Federal Council of seven members whose presidency rotates every year. A Nigerian local council, by contrast, has one elected chairman.'
        write: 'Switzerland: seven members, yearly rotation'
      - section: 'Remember'
        say: 'Remember, a college is a body of equals, so in a collegiate executive the leaders take turns.'
        write: 'Collegiate = equals take turns'
      - section: 'The trap'
        say: 'A dual executive splits the head of state and head of government between two people, but they do not rotate.'
        write: 'Dual: two fixed offices'
      - section: 'Answer'
        say: 'So a council with rotational leadership is a collegiate executive, which is option D.'
        write: '$\therefore$ collegiate executive'
        answer: true
    traps:
      A: 'You chose single executive. That has one head, as in a presidential system, so there is no rotation.'
      B: 'You went for dual executive. It splits ceremonial and real power between two fixed offices, not a rotating chair.'
      C: 'You picked multi executive. That is not the textbook name. A rotating council of equals is the collegiate executive.'
  10:
    moments:
      - section: 'The question'
        say: 'Some constitutions are hard to change. How do we describe them?'
        write: 'A constitution difficult to amend $= ?$'
      - section: 'Name it'
        say: 'This is a rigid constitution.'
        write: 'Rigid constitution'
      - section: 'The fact'
        say: 'A rigid constitution can be amended only by a special and difficult process, not by an ordinary law.'
        write: 'Rigid = special process to amend'
      - section: 'Why'
        say: 'That special process must be set out in writing, so a rigid constitution is also a written one.'
        write: 'Special process needs writing, so rigid and written'
      - section: 'In Nigeria'
        say: 'Under section nine of the nineteen ninety-nine Constitution, an amendment needs two thirds of each house of the National Assembly and two thirds of the State Houses of Assembly.'
        write: 'Section 9: two-thirds of NASS and of State Assemblies'
      - section: 'Remember'
        say: 'Remember, rigid means hard to bend, and only a written constitution can be made hard to change.'
        write: 'Rigid goes with written'
      - section: 'The trap'
        say: 'An unwritten constitution, like Britain''s, can be changed by an ordinary Act, so it is flexible, never rigid.'
        write: 'Unwritten = flexible'
      - section: 'Answer'
        say: 'So a constitution that is difficult to amend is rigid and written, which is option B.'
        write: '$\therefore$ rigid and written'
        answer: true
    traps:
      A: 'You chose written and flexible. A flexible constitution is easy to amend, the opposite of what we want.'
      C: 'You went for unwritten and rigid. An unwritten constitution can be changed by ordinary law, so it is flexible.'
      D: 'You picked flexible and rigid. These are opposites, so a constitution cannot be both.'
  11:
    moments:
      - section: 'The question'
        say: 'Of all the work of the United Nations, what is its political achievement?'
        write: 'The political achievement of the UN $= ?$'
      - section: 'Name it'
        say: 'This is the U N, the United Nations, founded on the twenty-fourth of October, nineteen forty-five.'
        write: 'United Nations, 24 October 1945'
      - section: 'The fact'
        say: 'The first purpose in its Charter is to maintain international peace and security.'
        write: 'Purpose one: international peace and security'
      - section: 'How'
        say: 'It works through the Security Council, peacekeeping forces, mediation and sanctions.'
        write: 'Security Council, peacekeeping, mediation, sanctions'
      - section: 'In Nigeria'
        say: 'Nigeria joined the United Nations on the seventh of October, nineteen sixty, and soon sent troops to keep the peace in the Congo.'
        write: 'Nigeria joined 7 October 1960; Congo mission'
      - section: 'Remember'
        say: 'Remember, the United Nations was born after the Second World War to stop a third one.'
        write: 'Born to stop another world war'
      - section: 'The trap'
        say: 'Economic development is real United Nations work, but it is economic and social work, not political.'
        write: 'Economic work is not political'
      - section: 'Answer'
        say: 'So the political achievement of the United Nations is the promotion of international peace and security, which is option C.'
        write: '$\therefore$ international peace and security'
        answer: true
    traps:
      A: 'You chose economic development. That is part of the economic and social work of the United Nations, not its political achievement.'
      B: 'You went for educational development. That is the work of UNESCO, a specialized agency.'
      D: 'You picked democratic institutions. The United Nations works with governments of all types, so this is not its main political purpose.'
  12:
    moments:
      - section: 'The question'
        say: 'When did Nigerians first get to elect anyone to a legislature?'
        write: 'Elective principle first introduced by $= ?$'
      - section: 'Name it'
        say: 'The elective principle is the right of people to choose their representatives by election.'
        write: 'Elective principle = choosing representatives by vote'
      - section: 'The fact'
        say: 'The Clifford Constitution of nineteen twenty-two first brought it, with four elected seats, three for Lagos and one for Calabar.'
        write: 'Clifford, 1922: 3 Lagos + 1 Calabar'
      - section: 'Why'
        say: 'Elections need parties to contest them, so the elective principle led to the first political parties.'
        write: 'Elections gave birth to parties'
      - section: 'In Nigeria'
        say: 'Herbert Macaulay formed the Nigerian National Democratic Party in nineteen twenty-three to contest the Lagos seats.'
        write: 'NNDP, 1923, Herbert Macaulay'
      - section: 'Remember'
        say: 'Remember, Clifford came first, in nineteen twenty-two, and so did elections.'
        write: 'Clifford first, elections first'
      - section: 'The trap'
        say: 'The Richards Constitution of nineteen forty-six is famous for regionalism, but elections had begun long before.'
        write: 'Richards = regionalism'
      - section: 'Answer'
        say: 'So the elective principle was first introduced by the Clifford Constitution, which is option D.'
        write: '$\therefore$ Clifford Constitution'
        answer: true
    traps:
      A: 'You chose Richards. The Richards Constitution of nineteen forty-six brought regionalism, but elections began in nineteen twenty-two.'
      B: 'You went for Macpherson. It widened elections in nineteen fifty-one, but it did not introduce them.'
      C: 'You picked Lyttleton. It brought true federalism in nineteen fifty-four, long after elections began.'
  13:
    moments:
      - section: 'The question'
        say: 'The three big parties of the First Republic each had a home base. What was it?'
        write: 'The three major First Republic parties had $= ?$'
      - section: 'Name it'
        say: 'This is the party system of the First Republic, from nineteen sixty to nineteen sixty-six.'
        write: 'First Republic, 1960 to 1966'
      - section: 'The fact'
        say: 'The N P C was based in the North, the N C N C was strongest in the East, and the Action Group was based in the West.'
        write: 'NPC North, NCNC East, AG West'
      - section: 'Why'
        say: 'Each drew its support from the largest ethnic group of its region, because the region was the prize of politics.'
        write: 'Hausa-Fulani, Igbo, Yoruba'
      - section: 'In Nigeria'
        say: 'Each party ruled its home region, and the N P C and N C N C formed the federal coalition after the nineteen fifty-nine election.'
        write: 'NPC and NCNC coalition, 1959'
      - section: 'Remember'
        say: 'Remember, one region, one big tribe, one big party.'
        write: 'One region, one tribe, one party'
      - section: 'The trap'
        say: 'The N C N C began with a national outlook, but by the First Republic all three had a regional and ethnic base.'
        write: 'National outlook faded'
      - section: 'Answer'
        say: 'So the three major parties had a regional and ethnic undertone, which is option B.'
        write: '$\therefore$ regional and ethnic undertone'
        answer: true
    traps:
      A: 'You chose national outlook. The parties drew their support mainly from one region each, so they lacked it.'
      C: 'You went for governmental funding. The parties were funded by members and supporters, not mainly by government.'
      D: 'You picked religious appeals. Their base was regional and ethnic more than religious.'
  14:
    moments:
      - section: 'The question'
        say: 'Three options here are rules of behaviour. Which one actually makes the civil service grow?'
        write: 'Development of the civil service relies on $= ?$'
      - section: 'Name it'
        say: 'This is professionalism.'
        write: 'Professionalism'
      - section: 'The fact'
        say: 'Professionalism means civil servants are trained, skilled and expert, and are hired and promoted on merit.'
        write: 'Trained, skilled, expert, merit'
      - section: 'Why'
        say: 'Good advice and good administration need knowledge, so the service improves only as its staff grow in skill.'
        write: 'Skill builds the service'
      - section: 'In Nigeria'
        say: 'The Administrative Staff College of Nigeria at Topo, Badagry, set up in nineteen seventy-three, trains public servants for this.'
        write: 'ASCON, Topo, Badagry, 1973'
      - section: 'Remember'
        say: 'Remember, neutrality, impartiality and anonymity tell a civil servant how to behave. Professionalism makes the service grow.'
        write: 'Conduct rules versus growth'
      - section: 'The trap'
        say: 'Impartiality, treating everyone fairly, is a good rule of conduct, but it does not by itself develop the service.'
        write: 'Impartiality: a rule of conduct'
      - section: 'Answer'
        say: 'So the development of the civil service relies on professionalism, which is option C.'
        write: '$\therefore$ professionalism'
        answer: true
    traps:
      A: 'You chose impartiality. It is a principle of conduct, serving everyone fairly, but it does not by itself develop the service.'
      B: 'You went for anonymity. It means civil servants stay out of the public eye while ministers take the credit or blame. That is conduct, not development.'
      D: 'You picked neutrality. It means serving any government without party bias. That is conduct, not what builds the service.'
  15:
    moments:
      - section: 'The question'
        say: 'In which system does one chief executive hold all executive power?'
        write: 'The chief executive system is associated with $= ?$'
      - section: 'Name it'
        say: 'This is the presidential system.'
        write: 'Presidential system'
      - section: 'The fact'
        say: 'One person, the president, is both head of state and head of government.'
        write: 'President = head of state + head of government'
      - section: 'Why'
        say: 'The president is elected for a fixed term and appoints ministers who answer to him, so he alone is the chief executive.'
        write: 'Fixed term, ministers answer to him'
      - section: 'In Nigeria'
        say: 'Nigeria adopted the executive presidency in the nineteen seventy-nine Constitution, and keeps it under the nineteen ninety-nine Constitution.'
        write: 'Executive president since 1979'
      - section: 'Remember'
        say: 'Remember, one chief executive, one president.'
        write: 'One chief executive = presidential'
      - section: 'The trap'
        say: 'In the parliamentary system, power is shared by a prime minister and cabinet, with a separate ceremonial head of state.'
        write: 'Parliamentary: cabinet + ceremonial head'
      - section: 'Answer'
        say: 'So the chief executive system goes with presidentialism, which is option B.'
        write: '$\therefore$ presidentialism'
        answer: true
    traps:
      A: 'You chose federalism. Federalism is about sharing power between tiers, not the form of the executive.'
      C: 'You went for parliamentarism. That has a collective cabinet and a separate head of state, not a single chief executive.'
      D: 'You picked unitarism. That is about power at the centre, not the form of the executive.'
  16:
    moments:
      - section: 'The question'
        say: 'Where does a public corporation get most of its money?'
        write: 'Public corporations are mainly funded through $= ?$'
      - section: 'Name it'
        say: 'A public corporation is set up by law, owned by government, and run to provide an essential service.'
        write: 'Public corporation = government-owned service body'
      - section: 'The fact'
        say: 'Its main source of money is government subvention, which means grants from the treasury.'
        write: 'Main funds = government subvention (grants)'
      - section: 'Why'
        say: 'Government owns it, and it often sells its services cheaply, so its own earnings are rarely enough.'
        write: 'Low charges, so government pays'
      - section: 'In Nigeria'
