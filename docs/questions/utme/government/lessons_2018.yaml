# UTME 2018 Government, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Government teacher works on the board:
# the question, the concept or institution named, the fact (who, what, when, where), why or how
# it works, a Nigerian link, a way to remember it, and the answer.
#
#   say:     heard, not read. Years in words, abbreviations spelled out letter by letter the
#            first time with their full name (ECOWAS, SWAPO, FRELIMO and NATO are said as
#            words), no symbols the voice would stop on.
#   write:   the one line written while it is said.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2018.yaml. Answers match that file. No question
# is dropped, so all 40 have a lesson.
format_version: 1
exam_year: 2018
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'In its first twenty years, Nigeria tried several systems of government. Which one did it never try?'
        write: '1960 to 1980: which system did Nigeria never have?'
      - section: 'Name it'
        say: 'This is about the structures and systems Nigeria has actually used.'
        write: 'Structures and systems of government in Nigeria'
      - section: 'The fact'
        say: 'Nigeria became independent on the first of October, nineteen sixty, as a federation with a parliamentary system and a Prime Minister.'
        write: '1960: federal + parliamentary'
      - say: 'In May nineteen sixty-six, Decree number thirty-four of General Aguiyi-Ironsi abolished the regions and made Nigeria a unitary state.'
        write: '1966: Decree No. 34, unitary'
      - say: 'Later that year the federal structure came back, and in nineteen seventy-nine the presidential system began.'
        write: 'Late 1966: federal again; 1979: presidential'
      - section: 'Why'
        say: 'A confederation is a loose union of sovereign states that keep the final power for themselves. Nigeria has never been one.'
        write: 'Confederal = sovereign states in a loose union. Never in Nigeria'
      - section: 'In Nigeria'
        say: 'The Aburi meeting of January nineteen sixty-seven was read by some as pointing that way, but it was never put into practice.'
        write: 'Aburi 1967: never carried out'
      - section: 'Remember'
        say: 'Remember, Nigeria was federal, then unitary for a few months, then federal again, but never confederal.'
        write: 'Federal, unitary, federal, never confederal'
      - section: 'Answer'
        say: 'So the system Nigeria did not experience is confederal, which is option C.'
        write: '$\therefore$ confederal'
        answer: true
    traps:
      A: 'You went for unitary. It lasted only a few months in nineteen sixty-six, but Nigeria did have it.'
      B: 'You chose federal. Nigeria was a federation at independence, and has been one for most of its history.'
      D: 'You picked parliamentary. From nineteen sixty to nineteen sixty-six Nigeria had a Prime Minister answerable to Parliament.'
  2:
    moments:
      - section: 'The question'
        say: 'Nigeria has had many political parties. Which one came first of all?'
        write: 'The first political party in Nigeria?'
      - section: 'Name it'
        say: 'This is the N N D P, the Nigerian National Democratic Party.'
        write: 'NNDP = Nigerian National Democratic Party'
      - section: 'The fact'
        say: 'It was founded in Lagos in nineteen twenty-three by Herbert Macaulay, often called the father of Nigerian nationalism.'
        write: '1923, Lagos, Herbert Macaulay'
      - section: 'Why'
        say: 'The Clifford Constitution of nineteen twenty-two gave Lagos three elected seats and Calabar one. A party was needed to contest them.'
        write: 'Clifford 1922: elective principle (Lagos 3, Calabar 1)'
      - say: 'So the N N D P was formed, and it won the Lagos seats in the elections that followed.'
        write: 'NNDP won the Lagos seats'
      - section: 'In Nigeria'
        say: 'The other parties came much later. The N C N C came in nineteen forty-four, and the Action Group and the N P C in nineteen fifty-one.'
        write: 'NCNC 1944; AG and NPC 1951'
      - section: 'Remember'
        say: 'Remember, Clifford gave the vote in nineteen twenty-two, and Macaulay formed the N N D P in nineteen twenty-three to use it.'
        write: 'Vote 1922 → NNDP 1923'
      - section: 'Answer'
        say: 'So the first political party in Nigeria was the Nigerian National Democratic Party, which is option D.'
        write: '$\therefore$ NNDP'
        answer: true
    traps:
      A: 'You went for the Action Group. It was formed in nineteen fifty-one, almost thirty years after the N N D P.'
      B: 'You chose the Northern People''s Congress. It became a party only in nineteen fifty-one.'
      C: 'You picked the N C N C. Macaulay led it too, but it was formed in nineteen forty-four, long after the N N D P.'
  3:
    moments:
      - section: 'The question'
        say: 'Government does many things. But which one comes first, before all the others?'
        write: 'The primary function of government?'
      - section: 'Name it'
        say: 'This is the primary function of government, the duty every other duty depends on.'
        write: 'Primary function = the first duty'
      - section: 'The fact'
        say: 'The first duty of any government is to maintain law and order, which means protecting lives and property and keeping the peace.'
        write: 'Maintain law and order: protect lives and property'
      - section: 'Why'
        say: 'Without peace, no school can stay open, no road is safe and no business can run. All the other services rest on it.'
        write: 'No peace → no schools, roads or business'
      - say: 'That is why the state alone keeps the police, the courts and the armed forces.'
        write: 'Police, courts, armed forces'
      - section: 'In Nigeria'
        say: 'Section fourteen of the nineteen ninety-nine Constitution says the security and welfare of the people shall be the primary purpose of government.'
        write: '1999 Constitution, s.14(2)(b): security and welfare'
      - section: 'Remember'
        say: 'Remember, peace first, then progress.'
        write: 'Peace first, then progress'
      - section: 'Answer'
        say: 'So the primary function of government is to maintain law and order, which is option D.'
        write: '$\therefore$ maintain law and order'
        answer: true
    traps:
      A: 'You went for schools and hospitals. They matter a lot, but they are secondary, and they can only run once there is law and order.'
      B: 'You chose transport. It is a useful service, often left to private operators, but it is not the first duty.'
      C: 'You picked campaigns and rallies. Those are what parties do to win power, not a function of government.'
  4:
    moments:
      - section: 'The question'
        say: 'Is a good constitution enough to give a country good government? Let us think it through.'
        write: 'Good government needs ?'
      - section: 'Name it'
        say: 'This is about the constitution and the people who operate it.'
        write: 'Constitution + operators'
      - section: 'The fact'
        say: 'A constitution is the set of rules by which a country is governed. The operators are the leaders and officials who put those rules to work.'
        write: 'Constitution = rules; operators = leaders and officials'
      - section: 'Why'
        say: 'Good rules in the hands of bad operators are ignored or abused.'
        write: 'Good rules + bad operators → abuse'
      - say: 'And good operators with bad rules are tied down by those rules. So we need both together.'
        write: 'Bad rules + good operators → limited'
      - section: 'In Nigeria'
        say: 'The nineteen ninety-nine Constitution sets out our rights and the arms of government, but how well it serves us depends on how faithfully officials carry it out.'
        write: '1999 Constitution works through those who run it'
      - section: 'Remember'
        say: 'Remember, a good road also needs a good driver.'
        write: 'Good road + good driver'
      - section: 'Answer'
        say: 'So a country is most likely to have good government with a good constitution and good operators, which is option C.'
        write: '$\therefore$ a good constitution and good operators'
        answer: true
    traps:
      A: 'You went for a good constitution with bad operators. The best rules fail when the people running them abuse them.'
      B: 'You chose good operators with a bad constitution. Good leaders help, but bad rules still tie their hands.'
      D: 'You picked illegitimate government. A government the people do not accept cannot give good government.'
  5:
    moments:
      - section: 'The question'
        say: 'In a democracy, most people get their way. But what happens to those who lose the vote?'
        write: 'A basic principle of democracy: rule by ?'
      - section: 'Name it'
        say: 'This is majority rule with minority rights.'
        write: 'Majority rule + minority rights'
      - section: 'The fact'
        say: 'Decisions are taken by the majority, but the rights of the minority are protected.'
        write: 'Majority decides; minority protected'
      - section: 'Why'
        say: 'Majority rule makes government reflect what most people want. Minority rights stop the majority from oppressing those who disagree.'
        write: 'Stops the majority oppressing the minority'
      - section: 'In Nigeria'
        say: 'Bills in the National Assembly pass by majority vote, but Chapter four of the Constitution protects the rights of every citizen.'
        write: 'Majority vote in the National Assembly; Chapter IV rights for all'
      - section: 'Remember'
        say: 'Remember, the majority has its way, and the minority has its say.'
        write: 'Majority has its way, minority has its say'
      - section: 'Answer'
        say: 'So the basic principle is rule by the majority and the right of the minority, which is option A.'
        write: '$\therefore$ the majority and the right of the minority'
        answer: true
    traps:
      B: 'You chose rule by the minority over the majority. That is oligarchy, the opposite of democracy.'
      C: 'You went for the wealthy few. Rule by the rich is plutocracy, not democracy.'
      D: 'You picked two political parties. A democracy can have two parties or many, so the number is not the principle.'
  6:
    moments:
      - section: 'The question'
        say: 'A gun can make people obey. But does it give anyone the legal right to rule?'
        write: 'A legal source of political authority?'
      - section: 'Name it'
        say: 'This is about the legal source of political authority.'
        write: 'Legal source of authority'
      - section: 'The fact'
        say: 'Authority is power that is lawful and accepted. In a democracy it comes from the people, through the votes of the electorate.'
        write: 'Authority comes from the electorate'
      - section: 'Why'
        say: 'Because the electorate gives power by law, it can also take it back at the next election. That is what makes the authority legal.'
        write: 'Given by vote, removable by vote'
      - section: 'In Nigeria'
        say: 'Section fourteen of the Constitution says sovereignty belongs to the people of Nigeria, from whom government gets all its powers and authority.'
        write: '1999 Constitution, s.14(2)(a): sovereignty belongs to the people'
      - say: 'And I N E C, the Independent National Electoral Commission, runs the elections through which the people give it.'
        write: 'INEC conducts the elections'
      - section: 'Remember'
        say: 'Remember, power comes by the ballot, not the bullet.'
        write: 'The ballot, not the bullet'
      - section: 'Answer'
        say: 'So the legal source of political authority is power from the electorate, which is option D.'
        write: '$\therefore$ power from the electorate'
        answer: true
    traps:
      A: 'You went for power from the gun. Force can seize control, but it gives no legal authority.'
      B: 'You chose economic power. Money can buy influence, but wealth gives no legal right to rule.'
      C: 'You picked minority power. A minority has no legal claim to rule over everyone else.'
  7:
    moments:
      - section: 'The question'
        say: 'Every year a budget bill arrives at the National Assembly. Who sends it there?'
        write: 'Which organ initiates bills and sends them to the legislature?'
      - section: 'Name it'
        say: 'This is the executive arm of government.'
        write: 'The executive'
      - section: 'The fact'
        say: 'The executive carries out the laws and runs the government. It also drafts most new bills and sends them to the legislature.'
        write: 'Executive drafts bills → legislature'
      - section: 'Why'
        say: 'It runs the ministries, so it knows what policies and money it needs. It prepares the bills, and the legislature debates and passes them.'
        write: 'Runs ministries, knows its needs'
      - section: 'In Nigeria'
        say: 'Under section eighty-one of the Constitution, the President lays the budget, called the Appropriation Bill, before the National Assembly each year.'
        write: '1999 Constitution, s.81: President lays the Appropriation Bill'
      - section: 'Remember'
        say: 'Remember, the executive proposes and the legislature disposes.'
        write: 'Executive proposes, legislature disposes'
      - section: 'Answer'
        say: 'So the organ that initiates bills and sends them to the legislature is the executive, which is option B.'
        write: '$\therefore$ Executive'
        answer: true
    traps:
      A: 'You went for the House of Representatives. It is part of the legislature, the body that receives the bills.'
      C: 'You chose the Senate. It is also part of the legislature, and it considers the bills sent to it.'
      D: 'You picked the judiciary. The courts interpret laws, but they do not propose bills.'
  8:
    moments:
      - section: 'The question'
        say: 'A democracy lets every adult take part in politics. So which limit can it fairly set?'
        write: 'Participation may be restricted on the basis of ?'
      - section: 'Name it'
        say: 'This is political participation, which means voting, standing for office and joining parties.'
        write: 'Political participation'
      - section: 'The fact'
        say: 'In a democracy the only fair limits are general ones that apply to everyone in the same way, such as age.'
        write: 'Fair limit = applies to all equally'
      - section: 'Why'
        say: 'A young child cannot yet make a mature political choice, and every citizen reaches the voting age in time.'
        write: 'Age limit lifts with time'
      - say: 'But religion, sex and class would shut out whole groups for ever, which is against equal rights.'
        write: 'Religion, sex, class → discrimination'
      - section: 'In Nigeria'
        say: 'Section seventy-seven of the Constitution gives the vote to every registered citizen who has reached eighteen years.'
        write: '1999 Constitution, s.77(2): vote at 18'
      - section: 'Remember'
        say: 'Remember, everyone grows up, so age shuts no one out for ever.'
        write: 'Everyone grows up'
      - section: 'Answer'
        say: 'So participation could be restricted on the basis of age, which is option B.'
        write: '$\therefore$ age'
        answer: true
    traps:
      A: 'You went for religion. Shutting people out by religion is discrimination, and it goes against freedom of religion.'
      C: 'You chose sex. Some countries once kept women from voting, but in a democracy that is discrimination.'
      D: 'You picked class. Limiting participation by class favours the rich and breaks political equality.'
  9:
    moments:
      - section: 'The question'
        say: 'Disenfranchisement is a long word. Let us break it open and see what it means.'
        write: 'Disenfranchisement = ?'
      - section: 'Name it'
        say: 'The franchise, also called suffrage, is the right to vote.'
        write: 'Franchise = suffrage = right to vote'
      - section: 'The fact'
        say: 'To disenfranchise a person is to deny that person the right to vote.'
        write: 'Dis + franchise = deny the vote'
      - section: 'How'
        say: 'It can happen by law, for people who are not citizens or are under age. It can also happen wrongly, through violence or names lost from the register.'
        write: 'By law, or by violence and lost names'
      - section: 'In Nigeria'
        say: 'A Nigerian must register with I N E C, the Independent National Electoral Commission, to vote. A citizen left off the register is disenfranchised at that election.'
        write: 'Not on the INEC register → cannot vote'
      - section: 'Remember'
        say: 'Remember, franchise is the vote, and dis takes it away.'
        write: 'Dis takes the vote away'
      - section: 'Answer'
        say: 'So disenfranchisement refers to the denial of the right to vote in an election, which is option C.'
        write: '$\therefore$ denial of the right to vote'
        answer: true
    traps:
      A: 'You went for the qualification of voters. That sets who may vote, but it is not taking the vote away.'
      B: 'You chose the disqualification of aspirants. That stops people standing for office, not voting.'
      D: 'You picked the right to vote and be voted for. That is the franchise itself, the opposite of disenfranchisement.'
  10:
    moments:
      - section: 'The question'
        say: 'The right to life is the most basic right of all. Is there any case where the law limits it?'
        write: 'Where is the right to life limited?'
      - section: 'Name it'
        say: 'This is the right to life, a fundamental human right.'
        write: 'Right to life'
      - section: 'The fact'
        say: 'The Constitution allows one lawful exception, when a court sentences a person for a crime of which he has been found guilty.'
        write: 'Exception: sentence of a court after conviction'
      - section: 'Why'
        say: 'The limit is lawful because it follows a fair trial in a court, not the wish of any official.'
        write: 'Fair trial, not anyone''s wish'
      - section: 'In Nigeria'
        say: 'Section thirty-three of the nineteen ninety-nine Constitution says no one shall be deprived of life, except in carrying out the sentence of a court.'
        write: '1999 Constitution, s.33(1)'
      - section: 'Remember'
        say: 'Remember, only a court''s sentence after a fair trial can limit the right to life.'
        write: 'Only a court''s sentence'
      - section: 'Answer'
        say: 'So the limitation is found in the case of a convicted person, which is option B.'
        write: '$\therefore$ a convicted person'
        answer: true
    traps:
      A: 'You went for the option among the people. No ordinary person has a lawful power to take another''s life.'
      C: 'You chose the executive. The executive cannot take life at will, and it can only carry out a court''s sentence.'
      D: 'You picked the government. The limit applies only to a person a court has convicted, not to the government''s wishes.'
  11:
    moments:
      - section: 'The question'
        say: 'Where do young people learn what they think about politics? One of these places does not teach it.'
        write: 'Not an agent of political socialisation?'
      - section: 'Name it'
        say: 'This is political socialisation, the way people learn political values, beliefs and attitudes.'
        write: 'Political socialisation = learning political values'
      - section: 'The fact'
        say: 'Its agents are the family, schools and universities, peer groups, the mass media, religious bodies and political parties.'
        write: 'Family, school, peers, media, religion, parties'
      - section: 'Why'
        say: 'These agents shape a person''s views every day as he grows. Tourism is travel for pleasure, and it does not regularly pass on political values.'
        write: 'Tourism = travel for pleasure'
      - section: 'In Nigeria'
        say: 'Civic education in schools, the news on radio and television, and the N Y S C orientation camps, run by the National Youth Service Corps, all teach young Nigerians about their nation.'
        write: 'Civic education, news, NYSC camps'
      - section: 'Remember'
        say: 'Remember, home, school, friends and media teach you politics, but holidays do not.'
        write: 'Holidays do not teach politics'
      - section: 'Answer'
        say: 'So the one that is not an agent of political socialisation is tourism, which is option A.'
        write: '$\therefore$ Tourism'
        answer: true
    traps:
      B: 'You chose the mass media. They inform people every day and shape their political opinions, so they are an agent.'
      C: 'You went for the peer group. Friends of the same age shape our views, especially when we are young.'
      D: 'You picked university. A university is a school, and schools teach political values.'
  12:
    moments:
      - section: 'The question'
        say: 'Parliament makes the laws. But who stands behind Parliament and gives it its power?'
        write: 'Political sovereignty belongs to ?'
      - section: 'Name it'
        say: 'This is political sovereignty. Sovereignty means supreme power in a state.'
        write: 'Sovereignty = supreme power'
      - section: 'The fact'
        say: 'Legal sovereignty is the power to make laws, held by the law-making body.'
        write: 'Legal sovereignty → the law-making body'
      - say: 'Political sovereignty is the power behind it, held by the people, the electorate.'
        write: 'Political sovereignty → the people'
      - section: 'Why'
        say: 'The people choose the lawmakers and the government at elections, and they can remove them at the next one.'
        write: 'The people elect and remove'
      - section: 'In Nigeria'
        say: 'Section fourteen of the nineteen ninety-nine Constitution says sovereignty belongs to the people of Nigeria.'
        write: '1999 Constitution, s.14(2)(a)'
      - section: 'Remember'
        say: 'Remember, parliament makes the law, but the people make the parliament.'
        write: 'The people make the parliament'
      - section: 'Answer'
        say: 'So political sovereignty belongs to the people, which is option A.'
        write: '$\therefore$ the people'
        answer: true
    traps:
      B: 'You chose the government. It uses power, but only on behalf of the people who elected it.'
      C: 'You went for the military. In a democracy the military is under civilian authority and holds no sovereignty.'
      D: 'You picked parliament. Parliament holds legal sovereignty, but the people who elect it hold political sovereignty.'
  13:
    moments:
      - section: 'The question'
        say: 'A foreigner has lived in Nigeria for twenty years and wants to become a citizen. Which route fits?'
        write: 'Alien, 20 years in Nigeria → citizenship by ?'
      - section: 'Name it'
        say: 'This is citizenship by naturalisation.'
        write: 'Naturalisation'
      - section: 'The fact'
        say: 'Naturalisation is the way a foreigner who has lived in a country for a long time, and meets its conditions, becomes a citizen.'
        write: 'Long residence + conditions → citizen'
      - section: 'How'
        say: 'The conditions include long residence, good character, the intention to stay, and an oath of allegiance.'
        write: 'Residence, character, intention, oath'
      - section: 'In Nigeria'
        say: 'Section twenty-seven of the Constitution provides for naturalisation, and it asks for at least fifteen years of residence. Twenty years meets that.'
        write: '1999 Constitution, s.27: at least 15 years'
      - say: 'Registration is different. It is for people with a close link, such as a foreign wife of a Nigerian man.'
        write: 'Registration = close family link'
      - section: 'Remember'
        say: 'Remember, a long stay leads to naturalisation.'
        write: 'Long stay → naturalisation'
      - section: 'Answer'
        say: 'So the alien may acquire citizenship by naturalisation, which is option B.'
        write: '$\therefore$ naturalisation'
        answer: true
    traps:
      A: 'You went for nationalisation. That is the government taking over private businesses, not a route to citizenship.'
      C: 'You chose registration. It is for people with a close family link to Nigeria, not for long residence alone.'
      D: 'You picked marriage. Marriage alone does not make a citizen, and a foreign wife must still apply by registration.'
  14:
    moments:
      - section: 'The question'
        say: 'A republic has no king or queen. So in a parliamentary republic, who is the ceremonial head of state?'
        write: 'Ceremonial Head of State in a republican parliamentary system?'
      - section: 'Name it'
        say: 'This is the head of state in a republican parliamentary system.'
        write: 'Republican parliamentary system'
      - section: 'The fact'
        say: 'A parliamentary system splits the top offices. The Prime Minister is the head of government, with real power.'
        write: 'Prime Minister = head of government (real power)'
      - say: 'The head of state is ceremonial, and in a republic that is a President.'
        write: 'President = head of state (ceremonial)'
      - section: 'How'
        say: 'The President signs bills, receives ambassadors and opens Parliament, but acts on the advice of the Prime Minister.'
        write: 'Acts on the Prime Minister''s advice'
      - section: 'In Nigeria'
        say: 'When Nigeria became a republic on the first of October, nineteen sixty-three, Dr Nnamdi Azikiwe became the ceremonial President and Sir Abubakar Tafawa Balewa stayed Prime Minister.'
        write: '1963: Azikiwe President, Balewa Prime Minister'
      - section: 'Remember'
        say: 'Remember, in a parliamentary republic the President reigns and the Prime Minister rules.'
        write: 'President reigns, Prime Minister rules'
      - section: 'Answer'
        say: 'So the ceremonial head of state is the President, which is option C.'
        write: '$\therefore$ President'
        answer: true
    traps:
      A: 'You went for the Chief Justice. He heads the judiciary, not the state.'
      B: 'You chose the Prime Minister. He is the head of government with real power, not the ceremonial head of state.'
      D: 'You picked the Queen. She was our head of state until nineteen sixty-three, but a republic has no monarch.'
  15:
    moments:
      - section: 'The question'
        say: 'To be represented, you must first choose someone to speak for you. How is that done?'
        write: 'Representative government is set up through ?'
      - section: 'Name it'
        say: 'This is representative government.'
        write: 'Representative government'
      - section: 'The fact'
        say: 'It is government by people the citizens have chosen to act for them.'
        write: 'Government by chosen representatives'
      - section: 'How'
        say: 'The citizens choose them in a general election, and the next election lets them replace those who do not serve them well.'
        write: 'Chosen and replaced at elections'
      - section: 'In Nigeria'
        say: 'I N E C, the Independent National Electoral Commission, holds general elections every four years for the President, the National Assembly, the governors and the State Houses of Assembly.'
        write: 'INEC: general elections every 4 years'
      - section: 'Remember'
        say: 'Remember, to represent you, someone must first be chosen by you.'
        write: 'Chosen by you to speak for you'
      - section: 'Answer'
        say: 'So representative government is established through a general election, which is option A.'
        write: '$\therefore$ a general election'
        answer: true
    traps:
      B: 'You chose a military coup. A coup takes power by force, and no one is chosen by the people.'
      C: 'You went for apartheid. That was South Africa''s racial system, which kept the black majority from voting.'
      D: 'You picked espionage. That is spying, and it has nothing to do with choosing representatives.'
  16:
    moments:
      - section: 'The question'
        say: 'A legislature cannot write every small rule itself. So why does it hand some law-making to others?'
        write: 'Delegated legislation is suitable for ?'
      - section: 'Name it'
        say: 'This is delegated legislation.'
        write: 'Delegated legislation'
      - section: 'The fact'
        say: 'It is law made by a body other than the legislature, such as a minister or a local council, under powers given by an Act of the legislature.'
        write: 'Made by others under an enabling Act'
      - section: 'Why'
        say: 'The legislature has too little time and technical knowledge for every detailed rule, so it passes the main law and lets others fill in the details.'
        write: 'Too little time → others make the details'
      - say: 'That relieves the legislature of its workload.'
        write: 'Relieves the workload'
      - section: 'In Nigeria'
        say: 'Ministers make regulations under Acts of the National Assembly, and local councils make bye-laws on markets and motor parks.'
        write: 'Regulations by ministers; bye-laws by councils'
      - section: 'Remember'
        say: 'Remember, the legislature makes the frame, and others fill in the details.'
        write: 'Frame by the legislature, details by others'
      - section: 'Answer'
        say: 'So delegated legislation is suitable for relieving the parliament of its workload, which is option A.'
        write: '$\therefore$ relieving the parliament of its workload'
        answer: true
    traps:
      B: 'You chose enthroning the rule of law. Laws made by officials can actually weaken the rule of law, which is why they are watched.'
      C: 'You went for fusion of powers. That is a feature of the parliamentary system, not the purpose of delegated legislation.'
      D: 'You picked checking the executive. Delegated legislation gives the executive more power, so it does the opposite.'
  17:
    moments:
      - section: 'The question'
        say: 'Indirect rule worked well in the North but caused trouble elsewhere. What made the difference?'
        write: 'Why did indirect rule succeed among the Hausa-Fulani?'
      - section: 'Name it'
        say: 'This is indirect rule, the British policy of ruling through traditional rulers and their institutions.'
        write: 'Indirect rule = rule through traditional rulers'
      - section: 'The fact'
