# UTME 2010 Government, written up by hand from source/past-questions.pdf, pages 2-10.
# Q1 (the paper type) is left out. 48 questions are kept and one is dropped: Q45, whose option
# D is cut off and whose options A and B both describe the same Security Council seat.
# Answers were worked out afresh. Seven printed keys did not hold up: Q23 (the Igbo system rested
# on the Umunna, the patrilineage), Q27 (Ovonramwen was deported to Calabar; Jaja went to the
# West Indies), Q28 (James S. Coleman described the two phases), Q38 (the General Purposes
# Committee was the local government's cabinet), Q39 (the Armed Forces Ruling Council),
# Q40 (Decree No. 34 was seen as abolishing the federation) and Q49 (the General Assembly
# appoints on the Security Council's recommendation). Repairs: Q9 option D "Ghana", whose
# Parliament is also unicameral, became Nigeria; Q24 "Aro age-grade system" became "Aro
# system"; Q33 and Q34 stems made grammatical; Q44 options B, C and D restored ("Lim" removed,
# "African on" became the Organization of African Unity, "the crisis in" took back "Liberia",
# which had slipped into Q45); Q50 "Assembly" became "Authority"; plain typos fixed.
