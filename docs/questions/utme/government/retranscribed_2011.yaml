questions:
  - number: 2
    stem: 'The development of attitudes and beliefs about a political system is'
    options:
      A: 'political emancipation'
      B: 'political socialization'
      C: 'political participation'
      D: 'political orientation'
    answer: B
    printed_key: D
    key_note: 'Political socialization is the process by which a person acquires political attitudes, beliefs and values; orientation is the outcome, not the process of development.'
    subtopic: GOV.I2.c
    level: 1
    level_reason: recall the definition of political socialization

  - number: 3
    stem: 'Political behaviour is governed by'
    options:
      A: 'political socialization'
      B: 'political ideology'
      C: 'political economy'
      D: 'political culture'
    answer: D
    printed_key: B
    key_note: 'Political culture, the shared attitudes, beliefs and values about politics, is what shapes and governs political behaviour; an ideology is a set of ideas about how society should be run.'
    subtopic: GOV.I2.c
    level: 2
    level_reason: tell political culture apart from socialization and ideology
    corrected: '"behavior" became "behaviour"'

  - number: 4
    stem: 'In a democratic nation, political sovereignty is vested in the'
