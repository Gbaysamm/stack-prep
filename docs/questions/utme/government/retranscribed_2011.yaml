# UTME 2011 Government, written up by hand from source/past-questions.pdf, pages 11-19.
# Q1 (the paper type) is left out. Answers were worked out afresh; most printed keys do not
# match their questions, and only Q4, Q14, Q15, Q29 and Q42 agree with the worked answer. Q17 is
# dropped because three of its options are standard advantages of delegated legislation, and
# Q45 is dropped because no option gives the 1979 membership of the Non-Aligned Movement and its
# fifth option was "none of the above". Repairs: Q4's stem names a democratic nation and
# political sovereignty; Q13 option D says the executive is drawn from the legislature; Q26
# options B and D became Oyo and Nupe, since the Ibibio and many Ijaw groups were also
# non-centralised; Q31's crisis is dated 1962; Q33 option A is "General Orders"; Q36 option A
# names states and ethnic groups; Q46 names Rilwanu Lukman; plain typos fixed throughout.
format_version: 1
source:
