    printed_key: D
    subtopic: GOV.I2.a
    level: 2
    level_reason: tell political sovereignty apart from legal sovereignty
    corrected: 'stem: "In a nation, sovereignty is vested in the" became "In a democratic nation, political sovereignty is vested in the", since legal sovereignty lies with the state and only political sovereignty lies with the electorate'

