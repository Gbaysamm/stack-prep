# UTME 2012 Government, written up by hand from source/past-questions.pdf, pages 20-28.
# Q1 is the paper-type question (Type Red) and is left out, so 49 questions are kept and none is
# dropped. Every answer was worked out afresh. Ten printed keys did not hold up: Q2 (Weber's
# mark of the state is the monopoly of legitimate force), Q6 (granting amnesty, the prerogative
# of mercy, is the executive's judicial function), Q7 (supreme power held at the centre is a
# unitary system), Q8 (a single leader with ultimate executive responsibility is the
# presidential system), Q15 (delegated legislation is made by bodies other than parliament),
# Q16 (ending a session by royal proclamation is prorogation), Q29 (Blyden and Payne Jackson
# both worked in Lagos; H.O. Davies was a Nigerian), Q46 (ECOMOG was seen at first as partisan),
# Q47 (the Commonwealth Scholarship and Fellowship Plan binds members) and Q48 (Gaddafi's Sirte
# Declaration launched the African Union). Repairs: Q44 option B was garbled and now reads
# "affiliation with the African Union"; Q20's stem gained its missing "is"; Q49 lost a stray
# dash; plain typos and spellings fixed (Macaulay, Du Bois, Gaddafi, by-election, Hakimi).
