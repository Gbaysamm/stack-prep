# UTME 2013 Government, written up by hand from source/past-questions.pdf, pages 29-37.
# Q1 (the paper type) is left out, so 49 questions are kept. Q50 asked with which body OPEC
# "has strong influence" (EU, ADB, AU, IMF), and no recommended text teaches such a tie, so it
# is rebuilt to ask how OPEC influences oil prices (production quotas). Answers were worked out afresh. Ten printed
# keys did not hold up: Q2 (delegated power is exercised indirectly, through an agent), Q12
# (fixed tenure marks the presidential system; the other three are parliamentary), Q15 (a
# flexible constitution suits centralised power), Q16 (transfer of autonomous powers is
# devolution), Q31 (the Revenue Mobilisation, Allocation and Fiscal Commission fixes the pay of
# political office holders), Q32 (the Bureau's first constitutional duty is to receive asset
# declarations), Q33 (the Third Republic had two parties), Q36 (Abacha's 1996 states made 36),
# Q40 (the Provisional Ruling Council was Abacha's) and Q42 (the Technical Aid Corps serves
# Africa, the Caribbean and the Pacific). Repairs: Q29's stem says "within a state", since the
# 1979 Constitution gave the National Assembly the allocation from the Federation Account and
# the state House of Assembly the allocation within the state; Q25 option B was cut short;
# Q30 option C names Edwin Ume-Ezeoke; plain typos fixed throughout.
