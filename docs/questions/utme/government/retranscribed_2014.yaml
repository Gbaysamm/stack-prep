# UTME 2014 Government, written up by hand from source/past-questions.pdf, pages 38-46.
# Q1 asks for the paper type and is left out, so 49 questions are kept and none is dropped.
# Answers were worked out afresh. Eleven printed keys did not hold up: Q10 (Italy is a republic;
# Morocco has a constitutional monarch), Q13 (judicial review, not a code of conduct, is the
# check), Q19 (polling measures opinion; it is not a dimension of it), Q22 (the Ajele oversaw the
# subject towns), Q23 (the 1945 strike was over the cost of living allowance), Q24 (provinces,
# not regions, before 1946), Q25 (the 1908 Lagos water rate protest came before the youth
# movements), Q28 (the three lists began with the Lyttleton Constitution), Q30 (the President
# was chosen by Parliament under the 1963 Constitution), Q46 (high commissioners, not attaches)
# and Q49 (the OAU Secretary-General served four years). Repairs: Q28 gives the Lyttleton
# Constitution in place of the cut "Republican" and asks which constitution first brought in
# the lists; Q30 says Parliament, as the 1963 Constitution did, not the Senate alone; Q6
# option A is untangled; Q22's options are put in one tense; plain typos fixed throughout.
