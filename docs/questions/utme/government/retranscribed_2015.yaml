# UTME 2015 Government, written up by hand from source/past-questions.pdf, pages 47-55.
# This paper prints no paper-type question, so Q1 is a real question and is kept. Answers were
# worked out afresh. Seven printed keys did not hold up: Q5 (economic dependence, not the
# suppression of state structures, which indirect rule kept), Q9 (pooling resources for all is
# communalism, not communism), Q12 (voting is a political right; peaceful assembly is the civil
# right), Q33 (the NCNC formed the 1959 coalition with the NPC), Q38 (aristocracy is rule by the
# best; rule by the few is oligarchy), Q43 (Udoji reviewed the public service; Raisman was the
# revenue allocation commission) and Q47 (the Social and Cultural Affairs Commission was one of
# the specialized commissions of the 1975 ECOWAS treaty). Repairs: Q16 had lost its option D,
# restored as the Macpherson Constitution, the fourth colonial constitution; Q43's stem now says
# "before independence", since the Aboyade body of 1977 also worked on revenue allocation;
# Q23 "OEC" is OPEC; Q25's two directorates carry their real names; Q35 "Indignant" is
# indigenous; Q34 option B is instrumental authority; Q27 names Umaru Dikko; plain typos fixed.
# Dropped: Q7 (option C is cut short and, on any reading, as true of the upper house as D) and
# Q32 (every option is an aim of ECOWAS, so none is a shortcoming).
