# UTME 2016 Government, written up by hand from source/past-questions.pdf, pages 56-64.
# This paper prints no paper-type question, so Q1 is a real question and is kept. Q43 prints
# Q37 again with its options reordered, so it is dropped as a repeat: 49 questions are kept.
# Answers were worked out afresh. Eight printed keys did not hold up: Q4 (the educated elite led
# the earliest nationalist activities), Q5 (the Economic and Social Council promotes voluntary
# co-operation), Q9 (the 1979 Constitution first outlawed carpet-crossing), Q21 (the Adedeji
# committee reviewed foreign policy in 1975-76), Q22 (Nigeria's size and wealth), Q25 (polling
# measures opinion; it is not a dimension of it), Q38 (close ties with Britain) and Q44 (her
# colonial history). Repairs: Q16 option D "Chief Executive", another name for the General
# Manager, became "supervising Minister" so that only one option is right; Q48 option D
# "Godwin Ume-Ezeoke" became "Edwin Ume-Ezeoke"; Q36's options name the regions in full; plain
# typos fixed throughout (Q4 "ere", Q10 "emipre", Q15 "In it bids", Q21 "wa", Q34 "lick",
# Q36 "Northam", Q38 "dose").
