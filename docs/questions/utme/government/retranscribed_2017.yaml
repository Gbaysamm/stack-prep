# UTME 2017 Government, written up by hand from source/past-questions.pdf, pages 65-71.
# This paper prints 40 questions and no paper-type question, so Q1 is a real question and is
# kept. Answers were worked out afresh. Two printed keys did not hold up: Q5 (ECOWAS works
# through its specialized commissions, not "councils") and Q22 (the Public Complaints Commission
# exists to address the grievances of individuals and groups). Repairs: Q33 option D "1983
# Constitution" is the 1963 (Republican) Constitution, the right answer; Q14 option C "pro
# notability" is professionalism; Q34 option D "Pro action" is protection; Q35 option D "system"
# is the unitary system; Q39 option D "Concentration diffusion of powers" is concentration of
# powers; Q7's stem says "supreme right", since a plain "right" to rule is authority; Q30's stem
# says "power to legislate", since both tiers draw their power from the constitution itself;
# Q12 "Littleton" is Lyttleton; plain typos and stray dashes fixed. Nothing was dropped.
