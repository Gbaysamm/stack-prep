# UTME 2018 Government, written up by hand from source/past-questions.pdf, pages 72-78.
# This paper prints no paper-type question, so Q1 is a real question and all 40 questions are
# kept; none is dropped. Answers were worked out afresh. Four printed keys did not hold up: Q4
# (good government needs both a good constitution and good operators, not an illegitimate
# government), Q12 (political sovereignty rests with the people, the electorate; government
# only exercises power on their behalf), Q22 (Lagos was separated from the Western Region at the
# 1953 London conference; the 1954 Lyttleton Constitution only put that decision into effect)
# and Q23 (Aguiyi-Ironsi, in January 1966, was the first to hold both offices at once; Shagari,
# in 1979, was the first executive President). Repairs: Q24 option A, "the New Federal General
# Elections Capital", is the new Federal Capital; Q22's stem loses a stray "party"; Q29 option C
# "political vulture" is political culture; Q17 option A loses a stray capital "A"; Q14 says
# "republican"; plain typos fixed (Q9 "president aspirants", Q23 "Fredick", Q36 "Isreal").
