# UTME Government — the topics and subtopics every question is tagged with.
#
# Read from source/syllabus.pdf. The syllabus has four parts, I Elements of Government,
# II Political Development in Nigeria, III Foreign Policy and Nigeria's Relationship with the
# International Community and IV International Organizations, each with numbered topics. A
# topic here is one numbered topic (GOV.<part><number>, the part in Roman numerals as the
# syllabus prints it); a subtopic is one of its lettered contents, (a), (b), ... in the
# syllabus's own lettering, and a topic the syllabus does not letter has one subtopic, `a`.
# database/load_retranscribed_government.py builds the curriculum from this file, and every
# retranscribed_YYYY.yaml uses these codes.
#
# Part III topic 4 (Nigeria in international organizations) and Part IV topic 1 (the
# organizations themselves) cover the same bodies: tag a question about what Nigeria did in or
# through a body under III4, and one about the body's own origin, structure or work under IV1.
format_version: 1
