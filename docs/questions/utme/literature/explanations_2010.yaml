format_version: 1
exam_year: 2010
subject: LIT
explanations:
  2:
    answer: A
    steps:
      - 'This is the central conflict of J. C. de Graft''s Sons and Daughters, the clash that drives the whole play.'
      - 'James Ofosu, a wealthy and strict father, wants his children to enter the professions he respects. Aaron wants to be an artist and Maanan wants to be a dancer.'
      - 'The play is built on the quarrels between father and children over these ambitions, and on the question of who should choose a young person''s future.'
      - 'It matters because the play asks whether parents own their children''s lives, a question every generation meets.'
      - 'Remember it the Nigerian way: the parent who says "medicine, law or engineering, nothing else" against the child who wants music or art.'
      - 'The trap is B, the sharing of his property. Inheritance quarrels are common in African plays, but in this one the fight is about careers, not land or money.'
    hint: 'What do Aaron and Maanan want to become, and what does their father want instead?'
    why:
      B: 'The quarrel in the play is not about inheritance; James''s wealth is never the thing in dispute.'
      C: 'Religion is not what divides James from his children.'
      D: 'The family''s home is never in dispute; the play is set in it.'

  3:
    answer: B
    steps:
      - 'This is Maanan''s feeling towards Lawyer B, her father''s friend.'
      - 'Lawyer B, a respected family friend, makes advances to Maanan, and that is why she dislikes him.'
      - 'When this comes out, James Ofosu sees that the "respectable" profession he admires does not make a man respectable, and it helps change his mind about his children.'
      - 'It matters because it exposes the hypocrisy of a man the father held up as a model.'
      - 'Remember: Maanan''s dislike is personal, it is about what Lawyer B did to her.'
      - 'The trap is D, the betrayal of his wife''s trust. His conduct does wrong his wife, but the stem asks why Maanan dislikes him, and that is his advances towards her.'
    hint: 'What did Lawyer B do to Maanan herself?'
    why:
      A: 'Her dislike comes from his conduct towards her, not from any view he holds about her career.'
      C: 'The betrayal of her father''s friendship follows from the advances; the advances themselves are the cause of her dislike.'
      D: 'This describes the effect on his wife, not the reason Maanan herself dislikes him.'

  4:
    answer: D
    steps:
      - 'This is Maanan''s ambition, the heart of her quarrel with her father.'
      - 'Maanan wants to become a dancer, while her father, James Ofosu, wants her in a profession he thinks respectable.'
      - 'Her love of dance, like Aaron''s love of painting, stands for the arts that James looks down on.'
      - 'It matters because the play defends the arts as a worthy calling against the belief that only certain professions bring honour.'
      - 'Remember: Aaron paints, Maanan dances, James disapproves of both.'
      - 'The trap is A, a lawyer. That is the kind of profession her father admires for her, not what Maanan herself wants.'
    hint: 'Which choice would her strict father call a waste of her education?'
    why:
      A: 'Law is the sort of profession James admires, not Maanan''s own wish.'
      B: 'Medicine is not Maanan''s ambition; she wants to dance.'
      C: 'Nursing is not what Maanan wants to do in the play.'

  5:
    answer: D
    steps:
      - 'This is the setting of the play, the place where the action happens.'
      - 'The action of Sons and Daughters takes place in James Ofosu''s house, among his family.'
      - 'Every quarrel between James and his children happens at home, where father and children cannot avoid each other.'
      - 'It matters because the home is the place where parental authority rules, so the setting fits a play about that authority.'
      - 'Remember: a family quarrel needs a family house.'
      - 'The trap is C, Aunt''s house. Aunt belongs to the family, but the scenes are in James''s own house.'
    hint: 'Whose authority is being questioned, and where is it strongest?'
    why:
      A: 'The play does not take place on the street; it is a domestic drama.'
      B: 'George''s home is not where the action is set.'
      C: 'Aunt visits the family, but the action takes place in James Ofosu''s house.'

  6:
    answer: D
    steps:
      - 'This is Friar Laurence speaking to Romeo in Act 3 of Romeo and Juliet, after Romeo has been banished.'
      - 'Romeo''s "fault" is that he killed Tybalt, Juliet''s cousin, and the law of Verona says that killing deserves death.'
      - 'The lines show it: "Thy fault our law calls death; but the kind prince ... turn''d that black word death to banishment." The Prince spared Romeo''s life and banished him instead.'
      - 'The Friar calls Romeo''s weeping a "deadly sin" and "rude unthankfulness" because Romeo is ungrateful for that mercy.'
      - 'Remember: the fault is the killing, the mercy is banishment, and the sin is ingratitude.'
      - 'The trap is B, the suicide of Romeo. Romeo kills himself only at the end of the play, long after this speech.'
    hint: 'What did Romeo do that the Prince punished with banishment?'
    why:
      A: 'Juliet''s suicide happens in the last scene, after this speech.'
      B: 'Romeo''s suicide comes at the very end of the play, not before his banishment.'
      C: 'Romeo kills Paris at the tomb in the last act, long after this scene.'

  7:
    answer: A
    steps:
      - 'This is blank verse, the verse form of Shakespeare''s plays.'
      - 'Blank verse is unrhymed iambic pentameter, lines of ten syllables with five stresses, da DUM da DUM.'
      - 'Most of Romeo and Juliet is written this way, for example "But soft, what light through yonder window breaks?"'
      - 'It matters because blank verse sounds close to natural speech while keeping a steady beat, so the lines are dignified but alive.'
      - 'Remember: blank means no rhyme, but it still has a beat.'
      - 'The trap is B, free verse. Free verse has no regular beat at all and belongs to modern poetry, three centuries after Shakespeare.'
    hint: 'Count the beats in "But soft, what light through yonder window breaks". Do the lines rhyme?'
    why:
      B: 'Free verse has no regular metre; it is a modern form Shakespeare did not use.'
      C: 'Metre is the beat pattern of verse, not a name for the form a play is written in.'
      D: 'A foot is one unit of metre, such as an iamb, not a verse form.'

  8:
    answer: B
    steps:
      - 'This line is spoken by Juliet in Act 3, Scene 2, when the Nurse tells her that Romeo has killed Tybalt.'
      - 'Juliet calls Romeo a "serpent heart" hidden behind a "flowering face", a fair face that hides a cruel heart.'
      - 'The line is one of a string of oxymorons, such as "beautiful tyrant" and "fiend angelical", showing her torn between love and horror.'
      - 'It matters because it shows how the feud forces Juliet to feel love and hate for the same person.'
      - 'Remember: the serpent is the snake in the garden, beautiful outside and deadly within.'
      - 'The trap is C, Tybalt. Tybalt is the one who died; Juliet is speaking of the man who killed him.'
    hint: 'Who has just killed Juliet''s cousin, and how might she feel about him?'
    why:
      A: 'Juliet is the speaker, not the one described.'
      C: 'Tybalt has just been killed; the line describes his killer.'
      D: 'Benvolio is a peacemaker and is not the subject of this speech.'

  9:
    answer: B
    steps:
      - 'This is the spatial setting, the place where the play happens.'
      - 'Romeo and Juliet is set in Verona, a city in northern Italy, with one later scene in Mantua.'
      - 'The Prologue says so at once: "In fair Verona, where we lay our scene."'
      - 'It matters because Verona is the city whose peace the two families keep breaking, and the Prince who rules it must punish them.'
      - 'Remember: "fair Verona" in the first lines.'
      - 'The trap is C, Padua. It is another Italian city, the setting of The Taming of the Shrew, not of this play.'
    hint: 'What does the Prologue call "fair"?'
    why:
      A: 'Athens is the setting of A Midsummer Night''s Dream.'
      C: 'Padua is the setting of The Taming of the Shrew.'
      D: 'Venice is the setting of The Merchant of Venice and the opening of Othello.'

  10:
    answer: A
    steps:
      - 'This is the cause of Romeo''s banishment.'
      - 'In Act 3 Tybalt kills Mercutio in a street fight, and Romeo, in fury, fights and kills Tybalt.'
      - 'The Prince had already ruled that further street violence would cost lives, but he banishes Romeo to Mantua instead of sentencing him to death.'
      - 'It matters because the banishment separates the newly married lovers and sets off the chain of events that ends in their deaths.'
      - 'Remember: Mercutio dies, Tybalt dies, Romeo goes.'
      - 'The trap is B, marrying Juliet without consent. The marriage is secret and nobody punishes it, because nobody knows about it.'
    hint: 'What did Romeo do in the street after Mercutio fell?'
    why:
      B: 'The marriage is kept secret, so no one could banish him for it.'
      C: 'Capulet tolerates Romeo at the party and forbids Tybalt to attack him.'
      D: 'Romeo kills Paris at the tomb at the end, after he has already been banished.'

  11:
    answer: C
    steps:
      - 'This is the value at the centre of the society in The Joys of Motherhood.'
      - 'In the Igbo society of the novel, a woman''s worth is measured by the children she bears, especially sons.'
      - 'Nnu Ego''s first marriage fails because she bears no child, and she nearly drowns herself when her first son dies. She goes on bearing children whatever the cost.'
      - 'It matters because the title is ironic: motherhood gives Nnu Ego status but brings poverty and loneliness.'
      - 'Remember: a child is a woman''s "crown" in the novel, but the crown is heavy.'
      - 'The trap is A, egalitarianism. The society is the opposite of equal; men and women are treated very differently.'
    hint: 'What did a wife have to give to be respected in Ibuza and Lagos?'
    why:
      A: 'The society is unequal, not egalitarian; men and elders hold power.'
      B: 'Men in the novel take several wives, so monogamy is not valued.'
      D: 'Women are not treated as equals of men in the novel.'

  12:
    answer: B
    steps:
      - 'This is the dibia''s explanation of Nnu Ego''s lump.'
      - 'When Agbadi''s senior wife Agunwa dies, her slave woman is buried with her. The slave is struck on the head before she is pushed into the grave.'
      - 'When Nnu Ego is born with a lump on her head, the dibia says the slave woman has come back as the child''s chi.'
      - 'It matters because the slave woman''s spirit is blamed for Nnu Ego''s troubles all through her life, linking her sorrows to an old cruelty.'
      - 'Remember: the lump is the mark of the blow.'
      - 'The trap is D, ill-luck from a predestined fate. Her life is unlucky, but the dibia links the lump to one cause, the slave woman.'
    hint: 'Where was the slave woman struck before she was buried?'
    why:
      A: 'The lump is read as the mark of a wound, not of beauty or perfection.'
      C: 'Agunwa is the dead wife; the spirit that returns is her slave woman.'
      D: 'The dibia names a particular cause, the slave woman''s spirit, not fate in general.'

  13:
    answer: B
    steps:
      - 'This is the condition Nnaife''s family lives in.'
      - 'Nnaife''s family in Lagos is always poor and often hungry; there are many children and little money.'
      - 'Nnu Ego sells on the street to feed the children, and when Nnaife is away the family nearly starves.'
      - 'It matters because the hunger shows how hard the "joys" of motherhood really are.'
      - 'Remember: many mouths, little money.'
      - 'The trap is D, disagreement and humiliation. There are quarrels, but poverty and hunger are the family''s constant state.'
    hint: 'What does Nnu Ego struggle to put on the table every day?'
    why:
      A: 'The family knows little happiness; the title''s "joys" are ironic.'
      C: 'Sickness and lost jobs come and go, but poverty and hunger never leave.'
      D: 'Quarrels happen, but they are not the family''s constant condition.'

  14:
    answer: C
    steps:
      - 'This is the reason Meka is given the medal in Ferdinand Oyono''s The Old Man and the Medal.'
      - 'Meka gave his land to the Catholic mission and lost his two sons, who died fighting for France in the war.'
      - 'For these sacrifices the colonial administration decides to honour him with a medal.'
      - 'It matters because the medal is an empty reward for great losses, and the novel shows how little it means to the colonialists.'
      - 'Remember: land and sons given, a piece of metal received.'
      - 'The trap is A, fighting for France. It was his sons who died in the war, not Meka who fought.'
    hint: 'What did Meka give to the church and to the war?'
    why:
      A: 'Meka''s sons died in the war; he did not fight in it himself.'
      B: 'No such act is the reason for the medal.'
      D: 'Meka is a devout convert, but he did not convert the village.'

  15:
    answer: B
    steps:
      - 'This is Meka''s character.'
      - 'Meka is a devout, trusting and naive old man who believes the white men honour him as their friend.'
      - 'He accepts the medal with pride, but after the ceremony he is caught in a storm, arrested and locked up, and only then does he see how little he means to them.'
      - 'It matters because his simple trust shows how colonialism used loyal Africans.'
      - 'Remember: Meka is the old man who believed every word.'
      - 'The trap is D, a religious bigot. Meka is very religious, but a bigot hates other beliefs, and the novel does not show him that way.'
    hint: 'How does Meka feel about the white men before the ceremony, and what does that say about him?'
    why:
      A: 'Meka does not think only of himself; he trusts and gives to others.'
      C: 'Meka does not act rashly; his fault is trust, not haste.'
      D: 'Meka is devout, but he does not show hatred of other faiths.'

  16:
    answer: B
    steps:
      - 'This is the colonialists'' attitude to the Africans in The Old Man and the Medal.'
      - 'The colonialists look down on the Africans; they treat them with disdain, which means scorn.'
      - 'Meka is honoured in public, but soon after the ceremony he is arrested and locked up like a common thief.'
      - 'It matters because the novel exposes the contempt behind colonial "friendship".'
      - 'Remember: disdain is looking down on someone.'
      - 'The trap is D, honour. The medal looks like honour, but the treatment that follows shows contempt.'
    hint: 'How is Meka treated once the ceremony is over?'
    why:
      A: 'To handle with kid gloves is to treat gently and carefully, which the colonialists do not do.'
      C: 'Indifference means not caring; the colonialists actively look down on and humiliate the Africans.'
      D: 'The medal is an empty honour; their real attitude is contempt.'

  17:
    answer: C
    steps:
      - 'This is the Ministry of Peace in George Orwell''s Nineteen Eighty-Four.'
      - 'Orwell writes that the Ministry of Peace "concerned itself with war".'
      - 'Each ministry has the opposite name: the Ministry of Truth makes lies, the Ministry of Love tortures, and the Ministry of Peace runs the endless war.'
      - 'It matters because the names are doublespeak, words used to hide the truth, which is how the Party controls minds.'
      - 'Remember: in Oceania, every ministry means its opposite, and "War is Peace".'
      - 'The trap is D, reconciliation. That is what the name suggests, but the ministry does the opposite.'
    hint: 'Think of the Party slogan "War is Peace".'
    why:
      A: 'The ministry does not exist to make instruments.'
      B: 'Weapons serve the war, but the ministry is concerned with the war itself.'
      D: 'Reconciliation is what the name pretends; the ministry wages war.'

  18:
    answer: A
    steps:
      - 'This is the subject matter of Nineteen Eighty-Four.'
      - 'The novel is about a totalitarian dictatorship, a state that controls every part of life, even thought.'
      - 'Big Brother watches through telescreens, the Thought Police arrest people for thinking, and history is rewritten every day.'
      - 'It matters because Orwell wrote it as a warning against any government that seeks total control.'
      - 'Remember: Big Brother is watching you.'
      - 'The trap is B, exploitation and cruelty. These happen in the novel, but they are tools of the dictatorship, not the subject.'
    hint: 'What kind of government watches you even in your own room?'
    why:
      B: 'Cruelty and exploitation are features of the state, not the novel''s subject.'
      C: 'The novel is not about just punishment for wrongs.'
      D: 'There are classes, but the novel is about total state control, not class division.'

  19:
    answer: B
    steps:
      - 'This is Winston Smith''s first act of rebellion.'
      - 'The novel opens with Winston beginning a private diary, which is a crime in Oceania.'
      - 'He writes "DOWN WITH BIG BROTHER" in it, and from that act his rebellion grows.'
      - 'It matters because private thought itself is rebellion in a state that controls thought.'
      - 'Remember: the pen came first, the affair and the plot later.'
      - 'The trap is C, the secret affair. The affair with Julia is rebellion too, but it comes after the diary.'
    hint: 'What does Winston do alone in his flat in the first chapter?'
    why:
      A: 'Winston does no real anti-Party work until much later, when he approaches O''Brien.'
      C: 'The affair with Julia begins after he has started the diary.'
      D: 'Winston never spies on the Party; he is the one watched.'

  20:
    answer: B
    steps:
      - 'This is the Party''s aim in Nineteen Eighty-Four.'
      - 'O''Brien tells Winston, "The Party seeks power entirely for its own sake."'
      - 'He says the Party is not interested in the good of others, only in power, and that power is an end, not a means.'
      - 'It matters because it shows the total emptiness at the heart of the dictatorship.'
      - 'Remember: power for power''s sake.'
      - 'The trap is D, the people''s sake. Tyrants often claim this, but O''Brien says plainly that the Party does not care about the people.'
    hint: 'What does O''Brien say power is, a means or an end?'
    why:
      A: 'O''Brien says the Party is not interested in the good of anyone else.'
      C: 'Members are tools of the Party; even they are watched and punished.'
      D: 'O''Brien says the Party does not seek power for the good of others.'

  21:
    answer: D
    steps:
      - 'This is imagery, language that appeals to one of the five senses.'
      - 'Tactile imagery appeals to the sense of touch, what we feel on our skin.'
      - 'Bare feet moving over "paths strewn with glass chips" make us feel the sharp edges cutting the soles.'
      - 'It matters because pain we can almost feel makes the dancers'' suffering and courage real to us.'
      - 'Remember: a barefoot walk on a road full of broken bottles; you feel it before you see it.'
      - 'The trap is C, hearing. Glass may crunch, but the image is built on bare skin meeting sharp glass.'
    hint: 'Which part of the body meets the glass?'
    why:
      A: 'Nothing in the image is tasted.'
      B: 'Nothing in the image is smelled.'
      C: 'The image centres on bare feet meeting sharp glass, a feeling, not a sound.'

  22:
    answer: C
    steps:
      - 'This is the village scene in David Rubadiri''s An African Thunderstorm.'
      - 'As the storm comes, the children are delighted, while the women, babies on their backs, dart about.'
      - 'The poem says: "Screams of delighted children" and "Women, / Babies clinging on their backs, / Dart about / In and out / Madly".'
      - 'It matters because the contrast shows two responses to the storm: the children''s excitement and the women''s anxious hurry.'
      - 'Remember: children scream for joy, mothers rush in and out.'
      - 'The trap is D, both women and children are delighted. Only the children are delighted; the women are hurrying in alarm.'
    hint: 'What are the women doing while the children scream?'
    why:
      A: 'The poem does not show the women cooking; they are darting about.'
      B: 'The children''s delight is in the wind and the din, not in playing in the rain.'
      D: 'The women are not delighted; they dart about madly.'

  23:
    answer: C
    steps:
      - 'This is enjambment.'
      - 'Enjambment is the running on of a sentence from one line of poetry into the next without a pause at the line end.'
      - 'Here "Yet in their finger upon" runs straight on into "Our navel", and "say" runs on into "They feel a foetal throb". No line is complete by itself.'
      - 'It matters because the run-on lines carry the reader forward, like the hope of new life the midwives feel.'
      - 'Remember: enjambment is a sentence that steps over the edge of the line.'
      - 'The trap is D, rhythm. Every poem has rhythm, but the device that stands out in these lines is the running on of the sense.'
    hint: 'Can "Yet in their finger upon" stand as a complete thought?'
    why:
      A: 'An epigram is a short, witty saying, which these lines are not.'
      B: 'An allegory is a whole story with a hidden second meaning, not a short extract like this.'
      D: 'Rhythm is in all verse; the striking device here is the run-on lines.'

  24:
    answer: C
    steps:
      - 'This is the theme of Mazisi Kunene''s A Heritage of Liberation.'
      - 'Kunene, a South African poet who opposed apartheid, writes about the fight for freedom as something passed on, a heritage.'
      - 'The title says it: liberation is a heritage, an inheritance that the present generation hands down so that those after them carry on the struggle.'
      - 'It matters because it shows a struggle bigger than one lifetime.'
      - 'Remember: a heritage is what you pass on, like a family house kept for the children.'
      - 'The trap is B, the joy of a victory already won. The poem looks forward to a struggle still to be carried on.'
    hint: 'What does a "heritage" mean, and who receives one?'
    why:
      A: 'The poem is about struggle, not the beauty of the land.'
      B: 'Freedom has not yet been won; the poem passes the struggle on.'
      D: 'It is not an elegy for a chief.'

  25:
    answer: D
    steps:
      - 'This is a paradox.'
      - 'A paradox is a statement that seems to contradict itself but, on reflection, holds a truth.'
      - '"The Child is father of the Man" sounds impossible, since a child cannot father an adult. But it means the person we become grows out of the child we were.'
      - 'It matters because the shock of the contradiction makes us stop and find the deeper truth.'
      - 'Remember: a paradox is a riddle with a truth inside, like "the more you learn, the more you know you don''t know".'
      - 'The trap is C, oxymoron. An oxymoron puts two opposite words side by side, like "bitter sweet"; a paradox is a whole statement.'
    hint: 'Can a child really father a man? Then what truth is hiding in the line?'
    why:
      A: 'Onomatopoeia is a word that imitates a sound, like "buzz"; there is none here.'
      B: 'Antithesis balances two contrasting ideas in parallel phrases, like "to err is human, to forgive divine".'
      C: 'An oxymoron joins two opposite words, like "bitter sweet"; this is a whole statement that seems impossible.'

  26:
    answer: D
    steps:
      - 'This is the word "minstrel".'
      - 'A minstrel is a singer, musician or poet who entertains people with songs and stories.'
      - 'In medieval Europe minstrels sang at courts and in towns; to ask for "the minstrel''s seat" is to ask for the singer''s place.'
      - 'It matters because the title places the speaker as a singer, so we read the poem as a song.'
      - 'Remember: our griots and praise singers are Africa''s minstrels.'
      - 'The trap is A, a priest. A priest leads worship; a minstrel sings to entertain.'
    hint: 'Think of a griot or a praise singer at a ceremony.'
    why:
      A: 'A priest leads worship and offers sacrifices; that is not a minstrel.'
      B: 'A king''s messenger carries messages; a minstrel sings.'
      C: 'A farmer tends the land; a minstrel entertains with songs.'

  27:
    answer: D
    steps:
      - 'This is the blazon in Andrew Marvell''s To His Coy Mistress, a list of praises for parts of the lady''s body.'
      - 'The speaker says that if they had all the time in the world, "An hundred years should go to praise / Thine eyes".'
      - 'He goes on: "Two hundred to adore each breast, / But thirty thousand to the rest."'
      - 'It matters because the huge numbers are playful exaggeration, hyperbole, setting up his argument that they do not have that much time.'
      - 'Remember: eyes a hundred, each breast two hundred, the rest thirty thousand.'
      - 'The trap is A, thirty thousand years. That is the time for "the rest", not the eyes.'
    hint: 'How many years "should go to praise / Thine eyes"?'
    why:
      A: 'Thirty thousand years go to "the rest", not the eyes.'
      B: 'Six decades is not mentioned in the poem.'
      C: 'Two hundred years are for each breast, not the eyes.'

  28:
    answer: B
    steps:
      - 'This is the speaker''s first mistake in D. H. Lawrence''s Bat.'
      - 'At dusk in Florence, the speaker watches dark shapes flying over the river and takes them for swallows.'
      - 'Then he looks again and realises with disgust, "Bats!"'
      - 'It matters because the shift from graceful swallows to bats shows the speaker''s change from calm admiration to revulsion.'
      - 'Remember: at first swallows, then bats.'
      - 'The trap is C, pipistrello. That is the Italian word for a bat, so it is what they really are, not what he took them for.'
    hint: 'Which graceful bird flies fast at dusk like a bat?'
    why:
      A: 'Owls are not the bird the speaker first thinks of.'
      C: 'Pipistrello is Italian for bat, which is what they turn out to be.'
      D: 'Sparrows are not the bird the speaker mistakes them for.'

  29:
    answer: C
    steps:
      - 'This is the journey in T. S. Eliot''s Journey of the Magi.'
      - 'The Magi travel on camels.'
      - 'The poem says: "And the camels galled, sore-footed, refractory, / Lying down in the melting snow."'
      - 'It matters because the tired, stubborn camels show how hard the journey was.'
      - 'Remember: wise men from the East travel by camel.'
      - 'The trap is B, horses. An "old white horse" appears in the poem, galloping away in a meadow, but it does not carry the Magi.'
    hint: 'Which animals are "galled, sore-footed, refractory"?'
    why:
      A: 'Donkeys do not carry the Magi in the poem.'
      B: 'The only horse is the old white horse galloping away in the meadow.'
      D: 'The Magi do not ride in chariots.'

  30:
    answer: B
    steps:
      - 'This is the sonnet.'
      - 'A sonnet is a poem of fourteen lines, usually in iambic pentameter, with a set rhyme scheme.'
      - 'The title Sonnet VII tells us the form, so the poem has fourteen lines.'
      - 'It matters because the form shapes the poem: fourteen lines force the poet to be brief and to build to a turn.'
      - 'Remember: sonnet, fourteen lines, like the fourteen days in a fortnight.'
      - 'The trap is C, nineteen lines. That is the villanelle, another fixed form.'
    hint: 'How many lines does a Shakespearean sonnet have?'
    why:
      A: 'Three lines is a tercet, or the length of a haiku.'
      C: 'Nineteen lines is a villanelle.'
      D: 'A sonnet has a fixed length.'

  31:
    answer: C
    steps:
      - 'This is farce.'
      - 'A farce is a kind of comedy that aims only at making the audience laugh loudly, through absurd situations, horseplay and exaggerated characters.'
      - 'In a farce people hide in cupboards, chase each other, and get mistaken for someone else.'
      - 'It matters because farce wants laughter for its own sake, while comedy also has a story and characters to care about.'
      - 'Remember: a farce is like a Nollywood slapstick sketch, all laughter, no lesson.'
      - 'The trap is B, comedy. Comedy amuses and ends happily, but farce aims at excessive laughter.'
    hint: 'Which kind of play pushes laughter to the extreme?'
    why:
      A: 'Tragicomedy mixes serious and comic events.'
      B: 'Comedy amuses, but excessive laughter is the aim of farce.'
      D: 'Satire uses laughter to attack folly or vice, not laughter for its own sake.'

  32:
    answer: B
    steps:
      - 'This is the climax, part of the plot.'
      - 'The climax is the turning point of the plot, the moment of greatest tension.'
