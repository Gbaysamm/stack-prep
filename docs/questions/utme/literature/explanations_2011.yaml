format_version: 1
exam_year: 2011
subject: LIT
explanations:
  2:
    answer: B
    steps:
      - 'This is about the type of drama, judged by how the play ends.'
      - 'A comedy is a play whose conflicts are resolved happily: the troubles are cleared up and the characters end in agreement, not in death.'
      - 'In Sons and Daughters, James Ofosu fights his children over their careers, but in the end he gives way and accepts their choices, so the family is united again.'
      - 'That happy resolution, with no death and a lesson learnt, is what makes the play a comedy.'
      - 'Remember: tragedy ends in death, comedy ends in agreement, like a family quarrel settled over a pot of jollof.'
      - 'The trap is D, melodrama. Melodrama piles up sensational events and exaggerated emotion; Sons and Daughters is a quiet family drama that ends in reconciliation.'
    hint: 'Does the play end in death or in agreement?'
    why:
      A: 'A tragedy ends in the downfall or death of the hero; this play ends with the family reconciled.'
      C: 'A farce relies on wild, absurd situations for laughs; this play treats a real family conflict seriously.'
      D: 'A melodrama exaggerates events and feelings for thrills; this play is a realistic family drama.'

  3:
    answer: D
    steps:
      - 'This is the prevailing theme, the main idea the whole play keeps returning to.'
      - 'Sons and Daughters is built on one conflict: James Ofosu wants his children to take respectable professions, while they want careers of their own choosing.'
      - 'Aaron wants to be an artist and Maanan a dancer, against their father''s wishes, and every scene turns on this clash of wills.'
      - 'The play uses this clash to ask how far parents should decide their children''s future, a question many Nigerian homes still argue about when a child says "I want to study music, not medicine".'
      - 'Remember: sons and daughters against the father''s will.'
      - 'The trap is C, social decadence. Lawyer Bonu''s behaviour shows some moral rot, but it is a side issue; the main theme is the clash between the father and his children.'
    hint: 'What do the father and his children argue about from start to finish?'
    why:
      A: 'Love is present in the family, but the play is not mainly about love.'
      B: 'Ofosu is comfortable, but wealth is the setting of the play, not its theme.'
      C: 'Moral decay appears only in a side episode; it is not the prevailing theme.'

  4:
    answer: C
    steps:
      - 'This is about Lawyer Bonu, a family friend in Sons and Daughters, and what his conduct reveals.'
      - 'Hypocrisy is saying one thing and doing another: claiming a high moral standard while not keeping it.'
      - 'Bonu is a respected elder and a trusted friend of James Ofosu, the father who insists on "respectable" careers, yet he makes advances to Ofosu''s own daughter, Maanan.'
      - 'His conduct exposes the elders who lecture the young about respectability. It also helps the play''s argument that the children''s choices deserve respect.'
      - 'Remember: the man who preaches respectability is the one who breaks it.'
      - 'The trap is B. Bonu is Ofosu''s friend, but his conduct shows Ofosu misjudged him, not that Ofosu chose his friends wisely.'
    hint: 'Does Bonu behave the way a respected elder says the young should behave?'
    why:
      A: 'Maanan wants to be a dancer, not a lawyer.'
      B: 'Bonu''s conduct shows that Ofosu misjudged his friend.'
      D: 'Dancing is looked down on in Ofosu''s circle; that is exactly Maanan''s problem.'

  5:
    answer: B
    steps:
      - 'This is about the speaker''s mood, read from the words he uses.'
      - 'Frustration is the feeling of being blocked from what you want to do.'
      - 'The speaker says everything in the room "outrages my sense of beauty" and "undermines my will to create pictures of lasting appeal". He is Aaron, the son who wants to be a painter.'
      - '"Outrages" and "undermines" show anger and a will being worn down: his surroundings stop him from painting. That is frustration.'
      - 'Remember: an artist who cannot create is a frustrated artist, like a tailor with no power for his machine.'
      - 'The trap is D, tired. "Undermines my will" can sound like tiredness, but "outrages" shows anger at being blocked, not weariness.'
    hint: 'What do the words "outrages" and "undermines" tell you about how he feels?'
    why:
      A: 'Nothing in the words is happy; the room "outrages" him.'
      C: 'Excitement is eager and hopeful; he is angry and blocked.'
      D: 'He is angry at what stops him, not weary.'

  6:
    answer: C
    steps:
      - 'This is Juliet''s speech just before she drinks the potion, in Act 4 of Romeo and Juliet.'
      - 'Friar Lawrence has given her a vial of potion that will make her seem dead for a time, so that she can escape marrying Paris and later join Romeo.'
      - 'She sends the Nurse and her mother away, feels "a faint cold fear", nearly calls them back, then says "My dismal scene I needs must act alone. Come, vial." She is speaking to the vial she is about to drink.'
      - 'She means to wake in the tomb and go to Romeo, so her intention is to drink the potion and seem dead, not to die.'
      - 'Remember: "Come, vial" is the Friar''s plan in action, sleep that looks like death.'
      - 'The trap is A, killing herself with poison. She fears the Friar may have given her poison, and she keeps a dagger in case the potion fails, but her intention is to drink the sleeping draught.'
    hint: 'What is in the vial the Friar gave her, and what is it meant to do?'
    why:
      A: 'She fears it might be poison, but she drinks it believing it will only make her seem dead.'
      B: 'She thinks of calling the Nurse back, then rejects the idea: "What should she do here?"'
      D: 'She does not run to Mantua; the plan is that Romeo will come to her at the tomb.'

  7:
    answer: C
    steps:
      - 'This is the denouement of a play.'
      - 'The denouement is the final unravelling of the plot, after the climax, when the conflict is settled and loose ends are tied.'
      - 'In Romeo and Juliet, after the lovers die in the tomb, Montague and Capulet take each other''s hands and promise to raise golden statues of each other''s children. The feud is over.'
      - 'This reconciliation settles the conflict that drove the whole play: the lovers'' deaths end the hatred.'
      - 'Remember: denouement means "untying"; the families'' knot is untied at the end.'
      - 'The trap is D, when Romeo hears of Juliet''s death. That turns the action towards the climax; it does not settle the conflict.'
    hint: 'When is the conflict between the two families finally settled?'
    why:
      A: 'The Capulet feast is early in the play, where the lovers meet; it starts the trouble.'
      B: 'Romeo killing Paris is part of the climax at the tomb, not the settling of the conflict.'
      D: 'This news drives the action to its climax; the conflict is not yet resolved.'

  8:
    answer: A
    steps:
      - 'This is about who brings Romeo the news of Juliet''s death in Mantua.'
      - 'Balthasar, Romeo''s servant, sees Juliet laid in the Capulet tomb and rides to Mantua to tell him.'
      - 'In Act 5, Scene 1 Balthasar says she "sleeps in Capel''s monument", and Romeo at once decides to buy poison and go back to Verona.'
      - 'The false news reaches Romeo because Friar John''s letter, which explained the plan, never got through.'
      - 'Remember: the servant''s news arrives, the Friar''s letter does not.'
      - 'The trap is D, Friar John. He was meant to carry the letter, but he was kept in a house shut up for the plague and never reached Mantua.'
    hint: 'Who is Romeo''s own servant?'
    why:
      B: 'Friar Lawrence stays in Verona and plans to tell Romeo by letter.'
      C: 'A boy is not the messenger; Balthasar, Romeo''s servant, brings the news.'
      D: 'Friar John was held back by a plague quarantine and never delivered the letter.'

  9:
    answer: B
    steps:
      - 'This is Mercutio, Romeo''s witty friend and a kinsman of the Prince.'
      - 'Quarrelsome means ready to pick a fight.'
      - 'In Act 3 Mercutio provokes Tybalt ("Tybalt, you rat-catcher, will you walk?") and draws his sword when Romeo will not fight. He is killed in that fight.'
      - 'His quarrel leads to his death and Romeo''s revenge on Tybalt, which gets Romeo banished, so his hot temper turns the play towards tragedy.'
      - 'Remember: "A plague o'' both your houses!" is the cry of the quarrelsome friend who dies in the quarrel.'
      - 'The trap is D, kind-hearted. Mercutio is loyal to Romeo, but the play shows his fiery, fighting side.'
    hint: 'Who starts the street fight with Tybalt in Act 3?'
    why:
      A: 'Mercutio is never shown cheating anyone.'
      C: 'He is fiery and mocking, the opposite of gentle.'
      D: 'He is loyal, but what the play stresses is his readiness to fight.'

  10:
    answer: D
    steps:
      - 'This is about how the plot of Romeo and Juliet is arranged.'
      - 'A chronological plot tells events in the order they happen, from first to last, with no flashbacks.'
      - 'The play runs straight from the street brawl, through the feast, the marriage, the killing of Tybalt and the potion, to the deaths in the tomb, over a few days.'
      - 'The straight time order and the short time span make the tragedy feel rushed and unstoppable.'
      - 'Remember: chronological means by the clock, one day after the next.'
      - 'The trap is C, convoluted. Events move fast, but they are easy to follow because they are told in order.'
    hint: 'Does the play ever go back in time?'
    why:
      A: 'An episodic plot is a string of loosely linked episodes; here each event causes the next.'
      B: 'The events are fast but plainly ordered, not complicated.'
      C: 'Convoluted means twisted and hard to follow; this plot runs in a straight line.'

  11:
    answer: B
    steps:
      - 'This is about the turning point of The Old Man and the Medal: the night of the medal.'
      - 'Meka gave his land to the Catholic mission and lost his two sons in the war for France. The colonial government gives him a medal, and he believes he is now a friend of the white men.'
      - 'That night, drunk and lost in the storm, he wanders into the European quarter, where he is arrested and locked up for the night like a common thief.'
      - 'The night opens his eyes: the whites do not treat him as a friend or an equal at all. The novel''s theme is this disillusionment with colonial rule.'
      - 'Remember: one medal, one night in a cell, and the scales fall from his eyes.'
      - 'The trap is A. Meka is proud of the medal before the storm, but after the night he no longer wants their honours.'
    hint: 'How do the white men treat Meka that night, and what does that teach him?'
    why:
      A: 'After the night he no longer wants their honours at all.'
      C: 'Kelara, his wife, stands by him; the night is about the colonisers, not his marriage.'
      D: 'The night teaches him that the colonisers will not reward him.'

  12:
    answer: D
    steps:
      - 'This is Father Vandermayer, the priest of the Catholic mission in The Old Man and the Medal.'
      - 'Hypocrisy is preaching one thing and doing another.'
      - 'The church took Meka''s land and preaches that all are brothers in Christ, yet Vandermayer treats Meka as an inferior and is happy to use him.'
      - 'Oyono uses Vandermayer to satirise the colonial church, which spoke of love and equality but served its own interest.'
      - 'Remember: sermons about brotherhood, but no brotherhood for Meka.'
      - 'The trap is B, suspicion. The church is not suspicious of Meka; it takes from him while preaching brotherhood.'
    hint: 'Does the church practise what it preaches towards Meka?'
    why:
      A: 'Despondency means low spirits; the church is not sad, it is self-serving.'
      B: 'The church is not suspicious of Meka; it simply uses him.'
      C: 'Infuriation means great anger; the church''s fault is false piety, not rage.'

  13:
    answer: B
    steps:
      - 'This is caricature: a description that exaggerates a person''s features to make him look ridiculous.'
      - 'Oyono often describes the colonial white men this way, so the reader laughs at them.'
      - 'Here the jaw goes "down and came up, puffing up and then deflating the skin under his chin". The man looks like a frog puffing its throat as it croaks.'
      - 'This mocks the man''s self-importance: a grand speaker reduced to a puffing animal. The satire serves the novel''s mockery of colonial pride.'
      - 'Remember: if a description makes you think of a bullfrog, the writer is laughing at the man.'
      - 'The trap is A. A man making a speech may look grand, but the puffing chin makes him comic, not dignified.'
    hint: 'What animal puffs up the skin under its chin?'
    why:
      A: 'Nothing in the words is grand; the puffing chin makes him comic.'
      C: 'The description is comic, not threatening.'
      D: 'The man is laughed at, not pitied.'

  14:
    answer: D
    steps:
      - 'This is about the cause of Nnaife''s arrest near the end of The Joys of Motherhood.'
      - 'Nnaife''s daughter Kehinde goes off to marry a Yoruba man instead of the Ibuza husband her father expects.'
      - 'Furious, Nnaife takes a cutlass to the Yoruba family and is arrested for attempted murder; the court case follows.'
      - 'The episode shows how Nnaife holds on to the old ways of Ibuza even in Lagos, and how Nnu Ego''s family falls apart in spite of all her sacrifice.'
      - 'Remember: Kehinde''s choice, Nnaife''s cutlass.'
      - 'The trap is C. Oshia does go abroad and leaves his parents disappointed, but that is not what sends Nnaife after the Yoruba family with a cutlass.'
    hint: 'Whose marriage makes Nnaife angry enough to fight?'
    why:
      A: 'Losing his job with the Meers comes much earlier and does not lead to the attack.'
      B: 'Nnu Ego never leaves Nnaife for another man.'
      C: 'Oshia''s going abroad disappoints them, but it is not the cause of the attack.'

  15:
    answer: D
    steps:
      - 'This is Nwokocha Agbadi, Nnu Ego''s father, in The Joys of Motherhood.'
      - 'Agbadi is a great chief of Ibuza, known for his wealth, his power with words and his success with women.'
      - 'The novel describes him as a wealthy local chief and a skilled speaker, who wins the proud Ona as his lover.'
      - 'His wealth and status explain why Nnu Ego''s first marriage and her bride price matter so much, and why her later poverty in Lagos is such a fall.'
      - 'Remember: Agbadi has a big mouth and a big barn, words and wealth.'
      - 'The trap is A, height. Agbadi is described as handsome and strong, but his fame rests on his wealth and his speech.'
    hint: 'What makes a chief great in Ibuza besides his words?'
    why:
      A: 'His fame does not rest on his height.'
      B: 'He is proud and strong-willed, but not known for treachery.'
      C: 'Illiteracy is not what anyone is famous for; he is famous for his wealth.'

  16:
    answer: B
    steps:
      - 'This is a symbolic dream in The Joys of Motherhood.'
      - 'Nnu Ego''s chi is the slave woman buried alive with Agbadi''s senior wife. For years the chi seems to deny her children.'
      - 'In the dream the chi at last hands her a baby boy, and soon after, Nnu Ego conceives her first son.'
      - 'The dream signals a blessing to come, the child she has prayed for. Its later sorrows feed the bitter irony of the title.'
      - 'Remember: in a dream, a baby given is a baby coming.'
      - 'The trap is A, reincarnation. The chi is linked to the slave woman''s spirit, but the dream promises a child; it is not about rebirth.'
    hint: 'What happens to Nnu Ego soon after the dream?'
    why:
      A: 'The dream promises a child; it is not about a dead person being born again.'
      C: 'The chi is her personal god, but the dream signifies a blessing, not idol worship.'
      D: 'The dream brings good news, a son, not doom.'

  17:
    answer: B
    steps:
      - 'This is about the kind of world Nineteen Eighty-Four pictures.'
      - 'A totalitarian state controls every part of life: work, love, thought and even history.'
      - 'Written in 1948, the novel imagines the year 1984 in Oceania, where the Party watches everyone through telescreens and the Thought Police punish "thoughtcrime".'
      - 'Orwell set it in the future as a warning of where total state power could lead.'
      - 'Remember: Big Brother is watching you, in the future.'
      - 'The trap is A. The Party rewrites the past, but the novel pictures a future world, not a useless past.'
    hint: 'When was the book written, and when is it set?'
    why:
      A: 'The Party rewrites the past, but the novel is set in the future.'
      C: 'Oceania is frighteningly stable under the Party; there is no unstable moment.'
      D: 'The atmosphere is one of fear and surveillance, not peace.'

  18:
    answer: A
    steps:
      - 'This is about Winston Smith''s hopes in Nineteen Eighty-Four.'
      - 'Winston dreams of a world where people can think and speak freely, where "freedom is the freedom to say that two plus two make four".'
      - 'He keeps a secret diary, loves Julia and joins what he thinks is the Brotherhood, all in hope of freedom.'
      - 'The Party crushes those dreams in the Ministry of Love, showing how total power destroys freedom.'
      - 'Remember: Winston wants the right to say two plus two make four.'
      - 'The trap is B, internal security. That is what the Party prizes; Winston wants freedom from it.'
    hint: 'What does Winston want that the Party will not allow?'
    why:
      B: 'Internal security is the Party''s obsession, not Winston''s dream.'
      C: 'Winston does not dream of wealth or capitalism; he wants freedom.'
      D: 'Sovereignty is a state''s power; Winston''s dream is personal freedom.'

  19:
    answer: C
    steps:
      - 'This is Room 101, a room in the Ministry of Love in Nineteen Eighty-Four.'
      - 'O''Brien says Room 101 holds "the worst thing in the world", which is each prisoner''s own deepest fear.'
      - 'For Winston it is rats. Faced with the cage of rats, he screams "Do it to Julia!" and betrays her.'
      - 'Room 101 symbolises the Party''s power to torture and humiliate a person until nothing of himself is left.'
      - 'Remember: one-oh-one, where your worst fear is waiting.'
      - 'The trap is A, rest. The name sounds like an ordinary office room, but it is a place of torture.'
    hint: 'What does O''Brien say is in Room 101?'
    why:
      A: 'No one rests in Room 101; it is where prisoners are broken.'
      B: 'It is a place of terror, not fun.'
      D: 'No one is shown round Room 101 on a tour; prisoners are taken there to face their worst fear.'

  20:
    answer: D
    steps:
      - 'This is about the outlook of Nineteen Eighty-Four.'
      - 'A pessimistic work expects the worst and offers little hope.'
      - 'Winston''s rebellion fails completely. In the last line he has been broken, and "He loved Big Brother."'
      - 'The Party wins and no one escapes, so the novel warns rather than reassures.'
      - 'Remember: the last line, "He loved Big Brother", is the darkest ending there is.'
      - 'The trap is A, optimistic. Winston hopes for a while, but the ending crushes that hope.'
    hint: 'How does the story end for Winston?'
    why:
      A: 'Winston''s hope is crushed by the end.'
      B: 'Antagonistic means hostile; it describes characters, not the novel''s outlook.'
      C: 'The novel warns, but its outlook is best described as pessimistic.'

  21:
    answer: C
    steps:
      - 'This is synecdoche.'
      - 'Synecdoche is naming a part of something to stand for the whole, as in "all hands on deck" for all the sailors.'
      - 'In Naked Soles, the "naked soles", bare feet, stand for the barefoot people themselves.'
      - 'Naming only their bare feet points at their poverty and their hard road, and makes the reader see them through their suffering.'
      - 'Remember: "hands" for workers, "mouths to feed" for children, "naked soles" for barefoot people.'
      - 'The trap is A, onomatopoeia. Onomatopoeia is about words that sound like what they mean; here a part stands for the whole.'
    hint: 'Are the feet the whole person, or only a part of them?'
    why:
      A: 'Onomatopoeia is a word that imitates a sound, like "buzz".'
      B: 'An oxymoron joins two opposite words, like "sweet sorrow".'
      D: 'Apostrophe is addressing someone absent or a thing as if it could hear.'

  22:
    answer: D
    steps:
      - 'This is the opening of David Rubadiri''s An African Thunderstorm.'
      - 'The poem begins "From the west / Clouds come hurrying with the wind".'
      - 'The clouds roll in from the west, driven by the wind, and the village watches the storm gather.'
      - 'Opening with the hurrying clouds builds the sense of a storm on its way, and the threat it brings.'
      - 'Remember: the storm comes from the west, clouds first, rain later.'
      - 'The trap is A, rain from the west. The direction is right, but the poem begins with clouds; the rain comes only at the end.'
    hint: 'What comes first in a storm, the clouds or the rain?'
    why:
      A: 'The rain comes only at the end; the storm begins with clouds.'
      B: 'The clouds come from the west, not the east.'
      C: 'The poem begins with clouds from the west, not rain from the east.'

  23:
    answer: A
    steps:
      - 'This is a metaphor.'
      - 'A metaphor speaks of one thing as if it were another, with no "like" or "as".'
      - 'The soul has no body, so it has no navel. The title gives it one, to speak of its innermost centre.'
      - 'The navel is where the unborn child was joined to its mother, so the metaphor points to the deepest, most hidden part of a person.'
      - 'Remember: a simile says "like a navel"; a metaphor simply says the soul has one.'
      - 'The trap is B, simile. There is no "like" or "as"; the soul simply has a navel.'
    hint: 'Is there a "like" or "as" in the title?'
    why:
      B: 'A simile compares with "like" or "as"; the title uses neither.'
      C: 'Onomatopoeia imitates a sound; the title does not.'
      D: 'Alliteration repeats opening consonants; the title''s power is in its comparison.'

  24:
    answer: A
    steps:
      - 'This is the persona''s concern in Mazisi Kunene''s A Heritage of Liberation.'
      - 'A heritage is something handed down from one generation to the next.'
      - 'The persona speaks of the struggle for freedom and asks that its weapons be kept and handed on to the generations yet unborn.'
      - 'The poem reflects the South African fight against oppression: the struggle must go on until freedom is won.'
      - 'Remember: the heritage is the struggle itself, passed from hand to hand.'
      - 'The trap is D. Kunene draws on Zulu tradition, but the concern of this poem is the liberation struggle, not a celebration of tradition.'
    hint: 'What is the "heritage" in the title?'
    why:
      B: 'The poem does not criticise modern tradition.'
      C: 'The poem trusts the next generation to carry on the struggle; it does not attack them.'
      D: 'The poem is about the struggle for freedom, not a celebration of tradition.'

  25:
    answer: B
    steps:
      - 'This is situational irony.'
      - 'Situational irony is a gap between what is expected and what actually happens: the outcome is the opposite of what was hoped for.'
      - 'In a war poem, the irony of life might be that the end of the war, which should bring joy, brings only loss.'
      - 'Irony makes the reader stop and think, because the result surprises and often hurts.'
      - 'Remember: a fire station burning down is irony.'
      - 'The trap is A. Silence after a battle may be part of a war poem, but it does not define irony.'
    hint: 'Irony is about a gap. A gap between what and what?'
    why:
      A: 'Silence after battle is a picture, not the definition of irony.'
      C: 'Praising heroes is panegyric, not irony.'
      D: 'Ordering events in time is chronology or plot.'

  26:
    answer: B
    steps:
      - 'This is a rhetorical question.'
      - 'A rhetorical question is asked for effect, not to get an answer; the speaker already holds the answer.'
      - '"What is there in that to vex some of them so?" The speaker does not want a reply; he means "there is nothing in that to be angry about".'
      - 'The question makes his point forcefully and invites the listener to agree with him about marriage.'
      - 'Remember: "Is that how to greet your elders?" is a rhetorical question every Nigerian child has heard.'
      - 'The trap is A, litotes. Litotes is understatement by denying the opposite ("not bad"); here a question is asked for effect.'
    hint: 'Does the speaker really want an answer?'
    why:
      A: 'Litotes is understatement by denial, like "not bad at all".'
      C: 'A transferred epithet gives a describing word to the wrong noun, like "a sleepless night".'
      D: 'Synecdoche uses a part for the whole.'

  27:
    answer: B
    steps:
      - 'This is the death imagery in Andrew Marvell''s To His Coy Mistress.'
      - 'The poem is a carpe diem poem, "seize the day": life is short, so love now.'
      - 'Marvell pictures "Time''s wingèd chariot hurrying near", "Deserts of vast eternity", and the grave where "worms shall try / That long-preserved virginity".'
      - 'These images of death and decay stress how quickly life passes, to persuade the lady not to waste time being coy.'
      - 'Remember: the chariot is coming, so do not wait.'
      - 'The trap is D, scare the lady. The images are grim, but their purpose is to underscore how short life is, not to frighten her.'
    hint: 'What does the persona want the lady to do, and why does he mention the grave?'
    why:
      A: 'The poem is about human time, not God''s power.'
      C: 'He does not condemn her; he tries to win her.'
      D: 'The grim images serve the argument that life is short, not mere fright.'

  28:
    answer: C
    steps:
      - 'This is suspense in D. H. Lawrence''s Bat.'
      - 'Suspense is holding back information so the reader wants to know what happens next.'
      - 'The persona watches creatures flitting over the river in Florence at dusk and thinks they are swallows. Only later does he realise, and cry out, that they are bats.'
      - 'Holding back the discovery keeps the reader watching with him, and the cry "Bats!" carries his disgust.'
      - 'Remember: a Nollywood scene that keeps the face of the stranger hidden till the end is using suspense.'
      - 'The trap is B, hyperbole. Lawrence''s description is vivid, but interest is held by the delayed discovery.'
    hint: 'When does the persona realise what the creatures really are?'
    why:
      A: 'Elision is leaving out a sound, as in "o''er"; it does not hold the reader''s interest.'
      B: 'The description is vivid, but the poem holds interest by delaying the discovery.'
      D: 'An oxymoron joins opposites; it is not how the poem holds interest.'

  29:
    answer: B
    steps:
      - 'This is personification.'
      - 'Personification gives a human action or quality to a thing.'
      - 'The water-mill is "beating the darkness", as a person beats something. A mill cannot beat the dark, so the action is human.'
      - 'The image makes the dawn scene vivid and slightly threatening, and the "three trees on the low sky" look ahead to the three crosses.'
      - 'Remember: if a thing does what a person does, it is personification.'
      - 'The trap is D, alliteration. The lines have little repeated opening sound; the striking device is the mill beating the darkness.'
    hint: 'Which thing in the lines does something a person does?'
    why:
      A: 'An oxymoron joins opposites, like "living death"; there is none here.'
      C: 'Hyperbole is exaggeration; the lines describe a quiet scene.'
      D: 'There is little repeated opening sound; the main device is personification.'

  30:
    answer: B
    steps:
      - 'This is the tone of Wendy Cope''s Sonnet VII.'
      - 'Tone is the writer''s attitude, as the reader feels it in the words.'
      - 'Cope is a comic poet. Her sonnet borrows the grand form of the love sonnet and fills it with everyday, comic details.'
      - 'The joke is the gap between the grand form and the ordinary matter, so the tone is light and humorous.'
      - 'Remember: a grand form with everyday matter makes people laugh.'
      - 'The trap is D, mournful. A sonnet often mourns lost love or time, but Cope plays with that for comedy.'
    hint: 'Is Cope laughing or weeping?'
    why:
      A: 'The sonnet is not trying to win an argument.'
      C: 'The poem is comic, not hopeful about the future.'
