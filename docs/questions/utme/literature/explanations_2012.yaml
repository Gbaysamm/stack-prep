format_version: 1
exam_year: 2012
subject: LIT
explanations:
  2:
    answer: C
    steps:
      - 'This is about the family in J.C. de Graft''s Sons and Daughters.'
      - 'A paternal aunt is your father''s sister. Aaron and Maanan''s father is James Ofosu, and his elder sister is Aunt Fosuwa.'
      - 'The list of characters at the start of the play sets out the family: James Ofosu, his wife Hannah, their children George, Aaron and Maanan, and James''s sister Fosuwa.'
      - 'Aunt Fosuwa matters because she stands for the old family voice, and she is set against Hannah, the caring mother.'
      - 'Remember: paternal means from the father''s side, as in a paternity test. Your father''s sister is your paternal aunt.'
      - 'The trap is B, Hannah. She is close to the children, but she is their mother, not their aunt.'
    hint: 'Paternal means from the father. Who is James Ofosu''s sister?'
    why:
      A: 'Mrs Bonu is Lawyer Bonu''s wife, not a member of the Ofosu family.'
      B: 'Hannah is the mother of Aaron and Maanan, not their aunt.'
      D: 'Adwao is not the sister of James Ofosu.'

  3:
    answer: C
    steps:
      - 'This is about the central conflict of J.C. de Graft''s Sons and Daughters, the struggle that drives the whole play.'
      - 'James Ofosu, a rich man, wants his children to enter the respected professions he chooses for them, such as law and engineering.'
      - 'His children want careers of their own choice, in the arts, so father and children clash over who should decide their future.'
      - 'This matters because the play asks how far parents may rule their grown children''s lives, a question every Nigerian family that says "you will read medicine" still knows.'
      - 'Remember the title: Sons and Daughters. The play is about the children and the father who plans their lives.'
      - 'The trap is B, a quarrel about the Bonus. Lawyer Bonu causes trouble for Maanan, but that is one episode, not the conflict of the whole play.'
    hint: 'Look at the title. Whose future is the whole family arguing about?'
    why:
      A: 'There is no fight between rival families over land in the play.'
      B: 'Lawyer Bonu''s behaviour is one episode; the play is not built on a quarrel between him and his wife over money.'
      D: 'Hannah and Aunt Fosuwa differ in attitude, but not over who owns a house, and that is not the central conflict.'

  4:
    answer: A
    steps:
      - 'This line is spoken by Maanan, the daughter of James Ofosu, to Lawyer Bonu.'
      - 'Maanan works in Lawyer Bonu''s office, and he harasses her and tries to force his attentions on her.'
      - 'When he moves to touch her, she threatens him with a bottle: "If you touch me, I shall smash your face with this bottle."'
      - 'The line shows Maanan as brave and able to defend herself, and it exposes the hypocrisy of a respected man whom James trusts.'
      - 'Remember: a girl defending herself in an office, with a bottle in her hand.'
      - 'The trap is B, Maanan to Mrs Bonu. Mrs Bonu is the lawyer''s wife; the man who tries to touch Maanan is her husband.'
    hint: 'Who in the play tries to touch Maanan against her will?'
    why:
      B: 'Mrs Bonu does not try to touch Maanan; it is her husband who harasses her.'
      C: 'James does not threaten anyone with a bottle; the line belongs to a scene of harassment.'
      D: 'Aaron is not threatened in this way; the line is a young woman defending herself.'

  5:
    answer: B
    steps:
      - 'The issue at stake here is sexual harassment: Lawyer Bonu is trying to kiss and touch Maanan.'
      - 'Lawyer Bonu is a friend of James Ofosu and Maanan''s employer, and he uses that position to make advances to her.'
      - 'The words "If you touch me" show that he is reaching for her, and the bottle shows how seriously she refuses.'
      - 'The scene matters because it shows that the respectable career James admires can hide a man without morals.'
      - 'Remember: "If you touch me" tells you someone is trying to touch her, and that someone is Bonu.'
      - 'The trap is A, compromise. Maanan is not giving in or meeting him halfway; she is refusing him outright.'
    hint: 'What must the other person be trying to do for her to say "If you touch me"?'
    why:
      A: 'A threat to smash someone''s face is a refusal, not a compromise.'
      C: 'The line has nothing to do with James''s view of Awere.'
      D: 'Mrs Bonu is not taunting Maanan; the danger comes from Mrs Bonu''s husband.'

  6:
    answer: B
    steps:
      - 'These lines come from the Prologue to Romeo and Juliet, spoken by the Chorus before the play begins.'
      - 'A tragedy is predestined when the downfall is fixed by fate from the start.'
      - 'The word "fatal" means doomed, and "star-cross''d" means crossed by the stars, which were believed to rule a person''s fate.'
      - 'So Shakespeare tells us before the first scene that the lovers are doomed. We watch the play knowing how it ends, and that knowledge deepens the pity.'
      - 'Remember: star-crossed means the stars are against you, like an Ifa reading that has already spoken.'
      - 'The trap is C, enmity. The feud is real, but these two lines point to fate, the stars, above the feud.'
    hint: 'What did people believe the stars controlled?'
    why:
      A: 'The words "fatal" and "star-cross''d" say the end is fixed, not avoidable.'
      C: 'The feud is part of the story, but these lines put the blame on fate and the stars.'
      D: 'This describes the outcome, not what the lines suggest about the tragedy''s cause.'

  7:
    answer: D
    steps:
      - 'This is Romeo''s first sight of Juliet at the Capulet feast, in Act 1 Scene 5, and the device is imagery of light against darkness.'
      - 'Imagery is language that makes a picture in the mind. Here Romeo uses light images to show how Juliet shines.'
      - 'He says she "doth teach the torches to burn bright", so she is brighter than the torches, and she hangs on night "Like a rich jewel in an Ethiope''s ear", a bright jewel against dark skin.'
      - 'Both images say the same thing: Juliet stands out from everything around her. Her beauty is outstanding.'
      - 'Remember: a jewel on dark skin, or a torch in a dark room, is the thing you cannot stop looking at.'
      - 'The trap is C, riches. The word "rich" is there, but the jewel is a picture of brightness, not of money.'
    hint: 'What happens to a bright jewel when it is set against darkness?'
    why:
      A: 'Juliet does not fade into the night; she outshines it.'
      B: 'Nobody envies her in these lines; Romeo is simply dazzled.'
      C: 'The jewel shows her brightness, not her wealth.'

  8:
    answer: C
    steps:
      - 'These lines are spoken by Romeo, in praise of Rosaline, in Act 1 Scene 2.'
      - 'Before Romeo meets Juliet, he is lovesick for Rosaline, who will not return his love.'
      - 'When Benvolio says he will show him fairer women, Romeo answers: "One fairer than my love! the all-seeing sun / Ne''er saw her match since first the world begun."'
      - 'This matters because a few scenes later Romeo forgets Rosaline the moment he sees Juliet, which shows how quick and extreme his young love is.'
      - 'Remember: R for Rosaline comes before J for Juliet in Romeo''s heart.'
      - 'The trap is B, Romeo praising Juliet. The words sound like his later praise of Juliet, but at this point he has not met her.'
    hint: 'Whom does Romeo love when the play opens, before the Capulet feast?'
    why:
      A: 'Paris praises Juliet in other words; this line is Romeo''s.'
      B: 'Romeo has not yet met Juliet when he says this.'
      D: 'Lady Capulet does not speak these lines.'

  9:
    answer: A
    steps:
      - 'Mercutio is Romeo''s friend, and his major role is to be a foil, a contrast to Romeo.'
      - 'A foil is a character whose qualities set off, by contrast, the qualities of another.'
      - 'Romeo is dreamy and swept away by love; Mercutio mocks love, jokes about dreams in his Queen Mab speech, and loves a quarrel.'
      - 'The contrast makes Romeo''s romantic nature clearer, and Mercutio''s death later turns the play from comedy to tragedy.'
      - 'Remember: a foil is like the dark cloth a jeweller puts behind a ring, to make it shine.'
      - 'The trap is B. Mercutio does not encourage Romeo''s passion; he laughs at it.'
    hint: 'Is Mercutio like Romeo, or very different from him?'
    why:
      B: 'Mercutio mocks Romeo''s love rather than helping it along.'
      C: 'He quarrels with Tybalt, but that is not his chief purpose in the play.'
      D: 'He does not go with Romeo to Friar Lawrence; that is not his role.'

  10:
    answer: B
    steps:
      - 'The feature is the Chorus.'
      - 'In classical Greek tragedy, a Chorus speaks to the audience, sets the scene and comments on the action.'
      - 'Romeo and Juliet opens with a Chorus speaking the Prologue, and a Chorus speaks again before Act 2.'
      - 'This classical device tells the audience the story in advance, so they watch knowing the lovers will die.'
      - 'Remember: Greek tragedy had a Chorus and kept the killing off stage.'
      - 'The trap is C, comic relief. The Nurse and Mercutio give comic relief, but that belongs to Elizabethan drama, not classical tragedy.'
    hint: 'Who speaks the Prologue before the first scene?'
    why:
      A: 'Classical tragedy kept violence off stage; showing it on stage is not a classical feature.'
      C: 'Comic relief comes from Elizabethan drama; Greek tragedy did not mix in clowning.'
      D: 'The play is told in order, without flashback.'

  11:
    answer: C
    steps:
      - 'The action in the extract is prayer.'
      - 'In Ferdinand Oyono''s The Old Man and the Medal, Meka and his household are Christian converts who pray together.'
      - 'The words "kneeling down", "knelt down beside him" and "knelt down as well" show everyone taking the posture of prayer.'
      - 'Oyono describes the scene with gentle humour, "his behind up in the air", which shows the villagers'' simple devotion to the faith the colonisers brought.'
      - 'Remember: kneel to pray.'
      - 'The trap is D, celebration. Celebration may come later with the medal, but kneeling side by side here is prayer.'
    hint: 'What do Christians do when they kneel down together?'
    why:
      A: 'A parade is marching, not kneeling.'
      B: 'Dancing is done standing and moving, not kneeling.'
      D: 'Kneeling together in this way is prayer, not celebration.'

  12:
    answer: B
    steps:
      - 'This description is of the feet of Meka, the old man of the title.'
      - 'Meka is an old villager who has given his land to the Church and is to receive a medal from the colonial administration.'
      - 'The extract shows feet ruined by years of walking barefoot: no toenails, and toes twisted up by yaws.'
      - 'These feet matter in the story, because Meka must squeeze them into tight new shoes for the medal ceremony, and the pain makes the white man''s honour look absurd.'
      - 'Remember: the old man of the title, the old man with the old feet.'
      - 'The trap is A, Kelara. She is Meka''s wife and is close by, but the "he" in the extract is a man.'
    hint: 'The extract says "he". Who is the old man of the title?'
    why:
      A: 'Kelara is Meka''s wife, and the extract speaks of a man.'
      C: 'Engamba is not the old man of the title whose feet are described.'
      D: 'Mvondo is not the old man whose feet are described.'

  13:
    answer: B
    steps:
      - 'The figure of speech is a simile.'
      - 'A simile compares two different things openly, using "like" or "as".'
      - 'Oyono writes that they knelt "like camels waiting to be loaded". The word "like" joins the kneeling people to kneeling camels.'
      - 'The comparison is humorous and shows how patient, tired and passive the villagers are in their worship.'
      - 'Remember: simile is similar, and it uses "like" or "as".'
      - 'The trap is C, metaphor. A metaphor would say they were camels; here the word "like" makes it a simile.'
    hint: 'Look for the small word that joins the people to the camels.'
    why:
      A: 'There is no question in the extract at all.'
      C: 'A metaphor makes the comparison without "like"; this one uses "like".'
      D: 'A mixed metaphor joins two clashing metaphors; here there is one clear simile.'

  14:
    answer: A
    steps:
      - 'This is about the value the Ibuza community sets on childbirth.'
      - 'In Buchi Emecheta''s The Joys of Motherhood, Ibuza judges a woman''s worth and a family''s success by the children she bears.'
      - 'Nnu Ego''s first marriage, to Amatokwu, fails because she does not conceive, and she is sent away; later she pours her whole life into bearing and raising children.'
      - 'This belief drives the tragedy: Nnu Ego gives everything to motherhood and is left poor and alone.'
      - 'Remember: in Ibuza a child is a woman''s crown, as the name Nnu Ego, twenty bags of cowries, says a child is worth a fortune.'
      - 'The trap is B, wealth. Money matters, but in Ibuza children themselves are counted as a family''s wealth.'
    hint: 'Why is Nnu Ego sent back from her first marriage?'
    why:
      B: 'Wealth is wanted, but Ibuza counts children as the real riches and the mark of fulfilment.'
      C: 'Western education is not what Ibuza values as the sign of success.'
      D: 'Ibuza values sons more than daughters, so a female child is not the symbol here.'

  15:
    answer: D
    steps:
      - 'This is Ona''s dying wish to Agbadi.'
      - 'Ona, Nnu Ego''s mother, was a proud woman who never married Agbadi, because her father, who had no son, wanted her to stay in his house.'
      - 'As she dies, she asks Agbadi to let their daughter have a life of her own and a husband if she wants one.'
      - 'This wish matters because it sets up the novel''s question of whether a woman can be free in a world that sees her only as a wife and mother.'
      - 'Remember: Ona lived free, and she wanted her daughter to choose freely too.'
      - 'The trap is B, care for her children. A dying mother would want that, but Ona''s wish is about her daughter''s freedom to choose.'
    hint: 'Ona herself was never made to marry. What did she want for her daughter?'
    why:
      A: 'Ona does not ask about her own burial.'
      B: 'Her wish is about her daughter''s freedom, not general care.'
      C: 'She does not ask Agbadi to take another wife.'

  16:
    answer: A
    steps:
      - 'The device here is irony in the title.'
      - 'Irony is a gap between what is said or expected and what really happens.'
      - 'The title promises the joys of motherhood, yet Nnu Ego, who gave her whole life to her children, dies alone by the roadside with none of them beside her.'
      - 'The irony makes the reader question the belief that children alone make a woman''s life full, which is the novel''s main theme.'
      - 'Remember: when a title promises joy and the ending brings sorrow, the title is ironic.'
      - 'The trap is B, literal. Read literally, the title would mean that motherhood brought her joy, which the ending denies.'
    hint: 'Does the ending give Nnu Ego the joy the title promises?'
    why:
      B: 'A literal title would mean motherhood brought joy; the ending shows the opposite.'
      C: 'The title is not a proverb; it is an ironic phrase.'
      D: 'The title is not a prayer; it points to the gap between hope and reality.'

  17:
    answer: C
    steps:
      - 'Nineteen Eighty-Four is a satire.'
      - 'A satire is a work that uses exaggeration and ridicule to attack people, systems or ideas in order to correct them.'
      - 'Orwell pushes the methods of totalitarian governments to an extreme: Big Brother watching, the Thought Police, Newspeak and history rewritten daily.'
      - 'The exaggeration warns readers how power can crush truth and freedom, which is why the novel is still read wherever governments silence critics.'
      - 'Remember: satire is a laughing or frightening mirror held up to power.'
      - 'The trap is A, metaphor. A metaphor is a figure of speech inside a text, not a name for a whole novel.'
    hint: 'Which of these names a kind of work that attacks something by exaggerating it?'
    why:
      A: 'Metaphor is a figure of speech, not a kind of novel.'
      B: 'Hyperbole is a single exaggeration, not a classification of a whole work.'
      D: 'A pastoral is a work about peaceful country life, the opposite of this novel.'

  18:
    answer: B
    steps:
      - 'This is Winston''s belief in the proles.'
      - 'The proles are the working people of Oceania, about eighty-five per cent of the population, who are not Party members.'
      - 'Winston writes in his diary, "If there is hope, it lies in the proles," because only they are numerous enough to overthrow the Party.'
      - 'The line matters because the proles never rise; they are kept busy with work, beer and the lottery, so the hope stays only a hope.'
      - 'Remember: proles is short for proletariat, the many workers.'
      - 'The trap is A, the Ministry of Truth. That is where Winston works, rewriting history; it is a tool of the Party, not a source of hope.'
    hint: 'Who are the vast majority of people in Oceania?'
    why:
      A: 'The Ministry of Truth rewrites the past for the Party; it offers no hope.'
      C: 'The Party is what crushes hope; Winston wants it overthrown.'
      D: 'The children are trained to spy for the Party, so they offer no hope.'

  19:
    answer: A
    steps:
      - 'The Two Minutes Hate is a daily ritual for Party members.'
      - 'Every day, Party members gather before a telescreen that shows Emmanuel Goldstein, the Enemy of the People, and enemy soldiers.'
      - 'They scream, curse and throw things at the screen, and the hatred is then turned into love for Big Brother.'
      - 'Orwell shows how a government can control people by giving them an enemy to hate together.'
      - 'Remember: two minutes of hate a day keeps Party members loyal.'
      - 'The trap is B, children spying on their parents. That happens in the novel through the Spies, but it is not the Hate.'
    hint: 'Whose face appears on the screen during the Hate?'
    why:
      B: 'Children are trained to spy through the Spies, not through the Two Minutes Hate.'
      C: 'The proles are left to themselves; the Hate is for Party members.'
      D: 'Thought criminals are punished in the Ministry of Love, not through the Hate.'

  20:
    answer: A
    steps:
      - 'The torturer is O''Brien.'
      - 'O''Brien is a member of the Inner Party whom Winston trusts, believing he belongs to the Brotherhood that resists the Party.'
      - 'After Winston''s arrest, O''Brien himself tortures and re-educates him in the Ministry of Love, ending in Room 101.'
      - 'This is the novel''s cruellest irony: the man Winston trusted most is the one who breaks him until he loves Big Brother.'
      - 'Remember: O for O''Brien, O for the Ministry of Love''s torture room.'
      - 'The trap is B, the Thought Police. They arrest Winston, but O''Brien carries out the torture.'
    hint: 'Who stands over Winston in the Ministry of Love?'
    why:
      B: 'The Thought Police arrest Winston, but O''Brien tortures him.'
      C: 'Big Brother is a face on posters; he never appears in person.'
      D: 'Goldstein is the hated enemy, not one of Winston''s torturers.'

  21:
    answer: B
    steps:
      - 'The term is the movement of a poem.'
      - 'The movement of a poem is the way its thought, feeling and mood develop from the first line to the last.'
      - 'To trace it, ask where the poem starts, how it changes, and where it ends; a poem may move from anger to hope, or from a scene to a lesson.'
      - 'Following the movement helps you see the poem''s argument as a whole, instead of single lines.'
      - 'Remember: movement is a journey, so ask where the poem sets off and where it arrives.'
      - 'The trap is A, the number of lines. That is the structure on the page, not the poem''s journey of thought.'
    hint: 'Movement means a journey. What travels through a poem from start to end?'
    why:
      A: 'Line counts describe form, not how the poem''s thought develops.'
      C: 'Rhyme scheme is a pattern of sound, not the movement of thought.'
      D: 'The poet''s life story lies outside the poem.'

  22:
    answer: A
    steps:
      - 'The theme is the destructive power of nature.'
      - 'In David Rubadiri''s An African Thunderstorm, a storm sweeps from the west over an African village.'
      - 'The wind comes "like a plague of locusts" and tosses things up "like a madman chasing nothing", while women with babies on their backs dart about in fear.'
      - 'The poem shows how small people are before nature''s force, and many readers also see in the storm the violent arrival of colonial power.'
      - 'Remember: locusts and a madman, two pictures of destruction.'
      - 'The trap is C, farming in the rainy season. The storm comes before the rain, and the villagers are running for shelter, not farming.'
    hint: 'What does the storm do to the trees, the huts and the people?'
    why:
      B: 'The poem is not about love between a man and a woman.'
      C: 'The villagers are fleeing the storm, not farming.'
      D: 'The poem describes one storm, not the modern problem of climate change.'

  23:
    answer: C
    steps:
      - 'This is about the word heritage in the title of Mazisi Kunene''s A Heritage of Liberation.'
      - 'A heritage is something handed down from one generation to the next.'
      - 'Calling liberation a heritage means the fight for freedom in South Africa must be passed on to those yet unborn, until it is won.'
      - 'This gives the poem its theme of a long struggle that one generation alone may not finish.'
      - 'Remember: a heritage is like the family land passed from father to son.'
      - 'The trap is A. A heritage is kept and passed on, not finished and forgotten.'
    hint: 'What happens to something that is your heritage?'
    why:
      A: 'A heritage is kept for the future, not forgotten.'
      B: 'The struggle is a people''s fight for freedom, not a family quarrel.'
      D: 'The freedom is fought for by the people, not given by foreign powers.'

  24:
    answer: D
    steps:
      - 'The word is minstrel.'
      - 'A minstrel is a singer or poet who performs for the people, like the travelling singers of the Middle Ages.'
      - 'In the title Give Me the Minstrel''s Seat, the speaker asks for the seat of the singer, the place of the one who speaks for the people.'
      - 'This shows the poet''s view of his own role: to sing the people''s joys and sorrows.'
      - 'Remember: a minstrel is like a griot or an oral poet at a festival, the one with the song.'
      - 'The trap is B, a priest. Both speak to a gathering, but a minstrel sings and performs.'
    hint: 'Think of a performer with a song or a story, not a soldier or a ruler.'
    why:
      A: 'A soldier fights; a minstrel sings.'
      B: 'A priest leads worship; a minstrel performs songs and poems.'
      C: 'A king rules; a minstrel entertains and speaks for the people.'

  25:
    answer: A
    steps:
      - 'The figure of speech is a simile.'
      - 'A simile compares two different things using "like" or "as".'
      - 'Marvell writes that the young woman''s "youthful hue / Sits on thy skin like morning dew". The word "like" compares her fresh colour to dew.'
      - 'Dew is fresh but vanishes in the morning sun, so the simile also warns that her youth will soon pass, the argument of the whole poem.'
      - 'Remember: "like" or "as" means a simile.'
      - 'The trap is C, paradox. There is no contradiction here, just a comparison.'
    hint: 'Find the word that joins her skin to the morning dew.'
    why:
      B: 'Anaphora repeats words at the start of lines; nothing is repeated here.'
      C: 'A paradox is a statement that seems to contradict itself; there is no contradiction here.'
      D: 'Onomatopoeia imitates sounds; no word here imitates a sound.'

  26:
    answer: C
    steps:
      - 'The bird is the swallow.'
      - 'In D.H. Lawrence''s Bat, the speaker sits in Florence at sunset and sees creatures flying over the river.'
      - 'He first takes them for swallows, "swallows with spools of dark thread sewing the shadows together", then sees their jerky flight and realises they are bats.'
      - 'The contrast between graceful swallows and the bats he finds ugly shows his disgust at the bats.'
      - 'Remember: "swallows sewing the shadows", the s sounds go together.'
      - 'The trap is A, sparrows. Sparrows are small birds too, but the poem names swallows.'
    hint: 'Which bird flies fast at dusk over water, sewing the shadows?'
    why:
      A: 'Sparrows are not the birds the poem names.'
      B: 'Swans are large, slow birds, nothing like bats.'
      D: 'Crows are not the birds the speaker mistakes the bats for.'

  27:
    answer: C
    steps:
      - 'The theme is spiritual rebirth.'
      - 'In T.S. Eliot''s Journey of the Magi, one of the wise men looks back on the journey to see the infant Christ.'
      - 'He asks, "were we led all that way for / Birth or Death?" and says the Birth was "Hard and bitter agony for us, like Death, our death".'
      - 'Seeing Christ killed their old way of life, and they returned home changed, no longer at ease, so the poem examines how a new faith means a death of the old self.'
      - 'Remember: one birth in the stable, one rebirth in the wise man.'
      - 'The trap is D, holy pilgrimage. The poem describes a journey, but the issue it examines is the change inside the traveller.'
    hint: 'Why does the speaker say this Birth was like Death?'
    why:
      A: 'The three trees are an image in the poem, not an issue it examines.'
      B: 'The empty wine-skins are an image of the journey, not its theme.'
      D: 'The journey is the outer story; the poem examines the inner change it brings.'

  28:
    answer: D
    steps:
      - 'The figure of speech is alliteration.'
      - 'Alliteration is the repetition of the same consonant sound at the start of words close together.'
      - 'In "We would be believing we dreamt it", the w sound opens "We", "would" and "we", and the b sound opens "be" and "believing".'
      - 'The repeated sounds slow the line down and give it a soft, dreamy music that fits the idea of disbelief.'
      - 'Remember: alliteration is about first letters, like "Peter Piper picked".'
      - 'The trap is A, apostrophe. Apostrophe speaks to someone absent; this line speaks to no one.'
    hint: 'Say the line aloud. Which first sounds do you hear more than once?'
    why:
      A: 'Apostrophe addresses an absent person or thing; nobody is addressed here.'
      B: 'Personification gives human qualities to a thing; no thing is described here.'
      C: 'Antithesis sets two opposite ideas side by side; there are no opposites here.'

  29:
    answer: D
    steps:
      - 'The word is casualties.'
      - 'Casualties are people killed or wounded in a war or an accident.'
      - 'In poems such as Okinba Launko''s End of the War, the poet counts the cost of war in casualties, the lives lost and broken.'
      - 'Knowing the word lets you see that a war poem is weighing human loss, not victory.'
      - 'Remember: after a road accident, the news reports the casualties, the dead and the injured.'
      - 'The trap is B, soldiers who run away. Deserters are not casualties unless they are killed or wounded.'
    hint: 'When the news counts casualties after a crash, whom does it count?'
    why:
      A: 'Captured weapons are spoils of war, not casualties.'
      B: 'Soldiers who run away are deserters, not casualties.'
      C: 'Treaties end wars; they are not casualties.'

  30:
    answer: A
    steps:
      - 'The form is the sonnet.'
      - 'A sonnet is a lyric poem of fourteen lines, usually in iambic pentameter with a fixed rhyme scheme.'
      - 'The Petrarchan sonnet divides its fourteen lines into eight and six; the Shakespearean into three quatrains and a couplet.'
      - 'Knowing the form helps you look for the turn, the point where the sonnet''s thought changes direction.'
      - 'Remember: a sonnet is a fortnight poem, fourteen lines like fourteen days.'
      - 'The trap is C, eight lines. Eight lines make the octave, only the first part of a Petrarchan sonnet.'
    hint: 'How many days are in a fortnight?'
    why:
      B: 'Twelve lines is not the fixed length of a sonnet.'
      C: 'Eight lines is only the octave, the first part of a Petrarchan sonnet.'
      D: 'A sonnet has a fixed length of fourteen lines.'

  31:
    answer: B
    steps:
      - 'The term is allegory.'
      - 'An allegory is a story in which characters and events stand for ideas, people or events beyond the story, so it can be read on two levels.'
