format_version: 1
exam_year: 2013
subject: LIT
explanations:
  2:
    answer: A
    steps:
    - 'This is about character: what a speaker''s own words reveal about him.'
    - An oath sworn by a dead father's coffin is a traditional oath. It calls the ancestors to witness the promise and to punish the one who breaks it.
    - James says "I will swear by my father's coffin". He does not reach for the Bible or the Quran; he reaches for his forefathers.
    - It matters because the play sets James, the stern father who expects to decide his children's future, against children who want to choose for themselves.
    - 'Remember: a man who swears by the ancestors, like an elder swearing by the shrine of his fathers in the village, speaks as a traditionalist.'
    - The trap is C, pagan. It is an insulting label, not a fair description, and nothing in the lines speaks of worshipping idols.
    hint: 'Whom does James call to witness his oath: God, or his forefathers?'
    why:
      B: A Christian would swear on the Bible or by God, not by a coffin.
      C: Pagan is an insulting label, and the lines say nothing about idols.
      D: A Muslim would swear by Allah or on the Quran, not by his father's coffin.
  3:
    answer: B
    steps:
    - 'This is about tone: the attitude a speaker shows through the way he speaks.'
    - A domineering person orders others about; an impatient one cannot wait to be heard.
    - James does not ask; he says "Let me swear". And he calls the person before him simply "woman", not by name, which is curt and dismissive.
    - It matters because James is the stern, controlling father of the play, the man who wants to rule his household and his children's careers.
    - 'Remember: a bare "woman!" from a husband in a quarrel is the voice of a man who wants the last word.'
    - The trap is A, respectful and gentle. Swearing an oath can sound solemn, but the blunt "woman" is neither respectful nor gentle.
    hint: Would a gentle speaker call someone simply "woman"?
    why:
      A: Calling someone just "woman" in a quarrel is curt, not respectful.
      C: He is not begging; "Let me swear" is a demand to be heard.
      D: An oath on a father's coffin is deadly serious, not a joke.
  4:
    answer: C
    steps:
    - This is personification.
    - Personification gives human actions or feelings to an object, an animal or an idea.
    - Engineering is a subject, an idea. Aaron says it "can go hang itself", an action only a person can do.
    - It matters because the scornful picture shows how fiercely Aaron rejects the career his father has chosen for him; he wants art.
    - 'Remember: when a thing does what a person does (the wind whispers, the exam is waiting for you), that is personification.'
    - The trap is D, metaphor. A metaphor says one thing is another ("engineering is a prison"); here engineering is not called anything, it is made to act like a person.
    hint: Can a subject like engineering really hang itself? Who normally does that?
    why:
      A: Metonymy names a thing by something linked to it ("the crown" for the king); nothing is renamed here.
      B: Synecdoche uses a part for the whole ("hands" for workers); there is no part standing for a whole.
      D: A metaphor says one thing is another; here engineering is given a human action instead.
  5:
    answer: C
    steps:
    - This is about what a character stands for in the play's main conflict.
    - Sons and Daughters is built on the clash between a father, James Ofosu, who wants to choose his children's careers, and children who want to choose for themselves.
    - Aaron wants to be an artist, not an engineer, and his sister Maanan wants to dance. Together they speak for the young.
    - It matters because the play asks whether parents should decide their children's future, a question every Nigerian home with a "you must read medicine" parent still knows.
    - 'Remember: Aaron and Maanan are the new; James is the old.'
    - The trap is A, painters. Aaron does want to paint, but in the play's conflict he stands for a whole generation, not a trade.
    hint: In the quarrel between James and his children, which side is Aaron on?
    why:
      A: Painting is Aaron's wish, but what he represents is the younger generation's right to choose.
      B: Art work is what Aaron wants to make, not what he stands for.
      D: The old generation is James, the father who wants to choose his children's careers.
  6:
    answer: B
    steps:
    - This is the Capulet feast in Act 1, Scene 5.
    - Tybalt, a Capulet, recognises Romeo's voice at old Capulet's party and complains to his uncle.
    - '"This is a Montague, our foe" names the intruder, and "hither come ... to scorn at our solemnity this night" says he has come to the Capulets'' celebration. Romeo was not invited; he came masked with Benvolio and Mercutio.'
    - It matters because this is where Romeo first sees Juliet, and where Tybalt's anger begins, the anger that later leads to Mercutio's death.
    - 'Remember: "solemnity this night" means the night''s celebration, the feast.'
    - The trap is D, holding a sword to commit murder. Tybalt is the one who calls for his rapier; Romeo has come in a mask, not with a sword.
    hint: What is happening at the Capulets' house "this night"?
    why:
      A: Romeo has come to see the guests and the party, not to steal anything.
      C: There is no shouting match; Romeo is quietly watching Juliet.
      D: It is Tybalt who calls for a sword; Romeo came masked to the feast.
  7:
    answer: A
    steps:
    - The speaker is Tybalt, Juliet's cousin, in the street brawl of Act 1, Scene 1.
    - Benvolio has drawn his sword only to part the fighting servants, and asks Tybalt to help keep the peace.
    - Tybalt answers "I hate the word, as I hate hell, all Montagues, and thee", then "Have at thee, coward!" and attacks. He hates peace itself and goes looking for a fight.
    - 'It matters because Tybalt''s hot temper drives the tragedy: later he kills Mercutio and is killed by Romeo, which gets Romeo banished.'
    - 'Remember: Tybalt is the "Prince of Cats", always ready to scratch.'
    - The trap is D, trouble shooter. It sounds like "trouble-maker", but a troubleshooter is someone who solves problems, the very thing Tybalt refuses to do.
    hint: When Benvolio talks of peace, what does Tybalt say he feels about the word?
    why:
      B: Benvolio is the peacemaker here; Tybalt hates the very word peace.
      C: Tybalt is a Capulet, Lady Capulet's nephew, and he hates all Montagues.
      D: A troubleshooter solves problems; Tybalt starts them.
  8:
    answer: A
    steps:
    - This is Romeo's state of mind in Act 1, before he meets Juliet.
    - He is in love with Rosaline, who has sworn never to marry and will not return his love.
    - His father says he walks out before dawn, then "private in his chamber pens himself" and shuts out the daylight. Romeo tells Benvolio, "Sad hours seem long."
    - It matters because it shows Romeo as a young man ruled by feeling, which makes his sudden love for Juliet, and the haste of it, believable.
    - 'Remember: before Juliet, Romeo is the sighing lover, sad (melancholic) and full of tender feeling (sentimental).'
    - 'The trap is B, dreamy and hopeful. He is dreamy, but he has no hope: Rosaline has refused him.'
    hint: How does Romeo feel about Rosaline's refusal before he meets Juliet?
    why:
      B: Romeo is dreamy but has no hope; Rosaline has sworn to stay chaste.
      C: Romeo has no wish for revenge at the start; he even avoids the brawl.
      D: Gay and elated is the opposite of the sighing, shut-away Romeo of Act 1.
  9:
    answer: B
    steps:
    - The speaker is Friar Lawrence, in his cell in Act 3, Scene 3.
    - 'Romeo has killed Tybalt and is hiding with the Friar. The Friar brings the Prince''s sentence: banishment, not death.'
    - 'Romeo cries that banishment is worse than death, so the Friar scolds him: "O deadly sin! O rude unthankfulness!" The law calls his fault death, but "the kind Prince" has turned "that black word ''death'' to banishment".'
    - It matters because the Friar is Romeo's adviser and the one who calls him ungrateful; only he is with Romeo when the sentence is told.
    - 'Remember: the Friar is the voice of advice and patience, and the one who scolds Romeo for despair.'
    - The trap is A, Lord Montague. He is Romeo's father, but he is not in the cell; the scene is between Romeo and the Friar, with the Nurse arriving later.
    hint: Where is Romeo hiding after he kills Tybalt, and who brings him the Prince's sentence?
    why:
      A: Lord Montague is not in the Friar's cell and never brings Romeo the sentence.
      C: The Apothecary appears only in Mantua in Act 5, selling Romeo poison.
      D: Lord Capulet is Tybalt's uncle and would not call the Prince "kind" for sparing Romeo.
  10:
    answer: D
    steps:
    - This is the opening street brawl, Act 1, Scene 1.
    - Servants of the Capulets and Montagues start fighting. Benvolio, a Montague, draws his sword to beat them apart.
    - 'Tybalt arrives and draws on him. Benvolio says, "I do but keep the peace. Put up thy sword, or manage it to part these men with me": either sheathe it or use it to help separate the servants.'
    - 'It matters because it shows at once the two sides of the feud: Benvolio the peacemaker and Tybalt the fighter.'
    - 'Remember: "part these men" means separate the fighters, the servants.'
    - The trap is B, the Prince arrives. The Prince does come to stop the fight, but only after this exchange; these are Benvolio's words.
    hint: Who wants to "part these men", and which men are fighting at the start of the play?
    why:
      A: Tybalt's challenge to Romeo comes in Act 3; Romeo is not even in this brawl.
      B: The Prince arrives after this exchange; the words are Benvolio's.
      C: Romeo and Paris fight only at the Capulet tomb in Act 5.
  11:
    answer: B
    steps:
    - 'This is the central event of the novel, the one in its title: the medal.'
    - Meka is an old, loyal Christian villager. He gave his land to the Catholic Mission, and his two sons died fighting for France.
    - For this, the colonial administration announces that Meka will be given a medal on the day of the Chief of the Whites' visit.
    - 'It matters because the medal is cheap and hollow: Meka has given his land and his sons, and he gets a piece of metal. By the end, after he is beaten and locked up, he sees the colonial "friendship" for what it is.'
    - 'Remember: land and two sons in, one medal out.'
    - The trap is A, a church elders' council. Meka is a faithful churchgoer, but the reward the story is built on is the medal.
    hint: Look at the novel's title. What does the old man receive?
    why:
      A: Meka's reward in the story is not a church post but the medal of the title.
      C: A place near a leper is no reward, and not what the novel is about.
      D: Meka gave land away; he is not given land in return.
  12:
    answer: A
    steps:
    - 'This is about the purpose of a remark: what the speaker is doing with the words.'
    - Praise is speaking well of someone's work or qualities.
    - '"I have never seen cocoa as well dried as yours" says Meka''s cocoa is the best the speaker has seen. "Since I came to this country" shows the speaker is a newcomer from abroad.'
    - It matters because the novel shows how the colonisers praise and reward Meka for what is useful to them, his land, his sons, his cocoa, while never treating him as an equal.
    - 'Remember: "never seen ... as well ... as yours" is the shape of a compliment.'
    - The trap is B, blame. Nothing in the words finds fault; the cocoa is called the best.
    hint: Is the speaker saying Meka's cocoa is good or bad?
    why:
      B: Nothing is found fault with; the cocoa is called the best the speaker has seen.
      C: There is no threat or caution in the words.
      D: The speaker is not saying sorry for anything.
  13:
    answer: D
    steps:
    - This is the meaning the colonisers give the medal.
    - At the ceremony, the white officials present the medal as a sign of the friendship between the colonial power and Meka, the loyal African.
    - Meka goes home proud to be called a friend of the whites. But that same night he is arrested, beaten and locked up when he wanders lost in a storm.
    - 'It matters because the novel is ironic: the "friendship" the medal stands for is empty. The whites will not treat Meka as a friend, or even as a man, once the ceremony is over.'
    - 'Remember: the medal says "friendship"; the cell says the truth.'
    - The trap is C, peace. The colonial order talks of peace, but the medal is presented as a token of friendship.
    hint: What do the white officials call Meka when they pin the medal on him?
    why:
      A: Meka never fought; his sons died in the war, and the medal is not for a victory.
      B: Love is never what the colonial officials claim; they speak of friendship.
      C: Peace is not the point of the ceremony; the medal is offered as a token of friendship.
  14:
    answer: C
    steps:
    - This is the belief about Nnu Ego's chi, her personal god.
    - When Agunwa, Agbadi's senior wife, died, a slave woman was buried alive with her. Before she died, the slave woman was struck on the head, and she vowed to come back.
    - Nnu Ego is born with a lump on her head where the slave was struck, so the dibia says the slave woman is her chi. When Nnu Ego bears no child for Amatokwu, the people blame that angry chi.
    - 'It matters because it sets up the novel''s question: can a woman have worth apart from children? Nnu Ego''s whole life is shaped by the belief that a woman''s value lies in motherhood.'
    - 'Remember: a lump on the head, a slave''s revenge, and an empty womb.'
    - The trap is B, Adaku. Adaku is Nnu Ego's co-wife in her second marriage, to Nnaife, in Lagos; she is not part of the first marriage at all.
    hint: Think of the slave woman buried with Agunwa, and the mark on Nnu Ego's head.
    why:
      A: Agbadi loves Nnu Ego dearly and longs for her to have children; he places no curse.
      B: Adaku is Nnu Ego's co-wife in her second marriage, to Nnaife; she is not part of the first.
      D: Poverty is not what the people blame; they look to her chi.
  15:
    answer: B
    steps:
    - This is Nnaife's job when the novel moves to colonial Lagos.
    - Nnaife works as a washerman for a white couple, Dr Meers and his wife, washing their clothes, even Mrs Meers' underwear.
    - 'When Nnu Ego arrives from Ibuza, she is ashamed: she had expected a man''s man, and finds a soft husband doing what she sees as a woman''s work for white people.'
    - 'It matters because it shows how colonial city life changes men''s roles: Nnaife has money of a kind, but none of the pride of a farmer back home.'
    - 'Remember: in Ibuza a man farms; in Lagos, Nnaife washes the Meers'' clothes.'
    - The trap is C, a cocoa farmer. Farming is the work Nnu Ego expected of a husband, the work of men at home, not Nnaife's job in Lagos.
    hint: What does Nnu Ego find Nnaife doing for his white employers that she thinks is not a man's work?
    why:
      A: Nnaife is not a clerk; he does manual work for the Meers.
      C: Farming is the work of men in Ibuza, not Nnaife's job in Lagos.
      D: Nnaife does not tap palm wine; he washes clothes for the Meers.
  16:
    answer: D
    steps:
    - 'This is a theme: the central idea the story explores.'
    - Adaku is Nnaife's second wife in Lagos. She has daughters but no living son, and in a quarrel she is made to feel worth less than Nnu Ego, the mother of sons.
    - Adaku refuses to accept it. She leaves the household, works for herself as a trader, and spends her money on her daughters' schooling.
    - 'It matters because Adaku is the novel''s contrast to Nnu Ego: Nnu Ego lives for her children and dies alone, while Adaku chooses her own life. The title, The Joys of Motherhood, is bitterly ironic.'
    - 'Remember: Nnu Ego gives everything to motherhood; Adaku walks out and stands on her own feet.'
    - 'The trap is B, loyalty to tradition. Adaku does the opposite: she breaks with the custom that a wife stays and serves.'
    hint: Does Adaku stay and accept her place, or leave to choose her own life?
    why:
      A: Adaku leaves the polygamous home because it gives her no joy or respect.
      B: Adaku breaks with tradition; she does not stay loyal to it.
      C: She does value school for her daughters, but her decision is about her own freedom, not colonial schooling.
  17:
    answer: B
    steps:
    - This is the Ministry of Love, Miniluv in Newspeak.
    - Oceania has four ministries, and each name means the opposite of its work. The Ministry of Love keeps "law and order" by arrest, torture and pain.
    - Winston is taken there after his arrest. O'Brien tortures him for months, and in Room 101 breaks him with his worst fear, rats.
    - 'It matters because it shows doublethink in a name: the most frightening place in Oceania is called "Love".'
    - 'Remember: Love tortures, Truth lies, Peace makes war, Plenty starves.'
    - The trap is A, peace and freedom. That is what the name seems to promise, but in Oceania every ministry's name is a lie.
    hint: In Oceania, does a ministry's name tell the truth about its work, or the opposite?
    why:
      A: Peace and freedom is what the name pretends; the ministry arrests and tortures.
      C: Joy and peace is the name's lie; Miniluv is a place of fear.
      D: News and entertainment belong to the Ministry of Truth, where Winston works.
  18:
    answer: B
    steps:
    - This is the question of who holds power in Oceania.
    - Oceania is ruled by one Party, Ingsoc, headed by Big Brother. The Party controls the ministries, the telescreens and the Thought Police.
    - O'Brien tells Winston plainly, "The Party seeks power entirely for its own sake." The torture of Miniluv is the Party's.
    - It matters because the novel warns how a single party with total control can crush every individual, and even change the past.
    - 'Remember: the Thought Police are the Party''s hands; the Party is the owner.'
    - The trap is C, the Thought Police. They do the arresting, but they are an instrument, not the owner.
    hint: The Thought Police are a tool. Whose tool are they?
    why:
      A: The proles, the poor masses, hold no power at all.
      C: The Thought Police are one of the Party's instruments, not the owner of them.
      D: Individuals have no power in Oceania; the Party crushes them.
  19:
    answer: A
    steps:
    - This is the protagonist, the central character the story follows.
    - Nineteen Eighty-Four follows Winston Smith from his first secret act of rebellion, a diary, to his arrest and breaking.
    - 'We see Oceania through Winston''s eyes: his work at the Ministry of Truth, his love affair with Julia, his trust in O''Brien and his torture.'
    - It matters because following one ordinary man lets the reader feel the Party's power from the inside.
    - 'Remember: the story begins and ends with Winston, from "the clocks were striking thirteen" to "He loved Big Brother."'
    - The trap is D, Big Brother. His face is everywhere, but he never appears as a person; the action follows Winston.
    hint: Through whose eyes do we see the whole story?
    why:
      B: O'Brien is important, but he enters Winston's story; the action follows Winston.
      C: Julia is Winston's lover, a part of his story, not its centre.
      D: Big Brother never appears in person; he is a face on posters.
  20:
    answer: B
    steps:
    - This is the Ministry of Truth, Minitrue in Newspeak.
    - Minitrue handles news, entertainment, education and the arts. Winston works in its Records Department.
    - His job is to rewrite old newspaper articles so that the past always agrees with what the Party says now. The real records go down the "memory hole" to be burnt.
    - It matters because the Ministry of Truth's real work is lying, and Winston's own job shows him how the Party controls the past.
    - 'Remember: Winston works where truth is changed, the Ministry of Truth.'
    - The trap is A, Love. Winston is taken to the Ministry of Love only after his arrest, as a prisoner, not to work.
    hint: Winston's job is changing old newspapers. Which ministry handles news and records?
    why:
      A: Winston goes to the Ministry of Love only as a prisoner, to be tortured.
      C: The Ministry of Peace runs the war, not records.
      D: The Ministry of Plenty runs the economy and rations.
  21:
    answer: D
    steps:
    - This is onomatopoeia.
    - Onomatopoeia is the use of a word whose sound imitates the sound it describes.
    - '"Buzz" sounds like a bee, "hiss" like a snake, and "gbim, gbim" like the beat of a drum.'
    - It matters because it lets the reader hear the scene, not just see it; poets use it to bring sound into a line.
    - 'Remember: say the word and you hear the thing, like "kpa kpa kpa" for a knock on the door.'
    - The trap is C, hyperbole. Hyperbole is deliberate exaggeration ("I have told you a million times"); it is about size, not sound.
    hint: Say "buzz" and "hiss" aloud. What do they sound like?
    why:
      A: Zeugma makes one word govern two others in different senses ("she lost her keys and her temper").
      B: An oxymoron joins two opposite words ("bitter sweet", "living death").
      C: Hyperbole is deliberate exaggeration, not the imitation of a sound.
  22:
    answer: B
    steps:
    - This is the poem's style, how it presents its subject.
    - A dramatic poem presents events as action, with movement, noise and tension, as if the scene is happening before us.
    - Rubadiri's storm comes "From the west / Clouds come hurrying with the wind"; it turns "Sharply / Here and there / Like a madman chasing nothing". Women hurry to gather their children, clothes wave like tattered flags, and the lightning flashes and the thunder cracks.
    - It matters because the drama makes the reader feel the storm's power and the village's alarm; many readers also see in the sudden invader a picture of colonial intrusion.
    - 'Remember: hurrying, chasing, flashing, cracking, an action scene in a poem.'
    - The trap is C, traditional. The poem describes a village, but its form and approach are not traditional; it is its movement that marks it.
    hint: Is the poem still and calm, or full of movement and noise?
    why:
      A: The poem does not lecture or teach a moral; it shows a storm in action.
      C: A village setting does not make the poem traditional; its mark is its drama.
      D: Nothing is mocked; the storm is shown, not ridiculed.
  23:
    answer: A
    steps:
    - This is apostrophe.
    - Apostrophe is a figure of speech in which the speaker breaks off to address someone absent, or a thing or idea, directly, as "you".
    - 'The line turns and speaks straight to "you": "Since it was you who in all these thin seasons". The one addressed is spoken to, but does not answer.'
    - It matters because direct address makes the poem urgent and personal; the persona is calling on a listener, not just describing.
    - 'Remember: apostrophe turns to speak to "you" who cannot reply, like a mourner who cries to the dead, "Why did you leave us?"'
    - The trap is D, aside. An aside is a stage device in drama, words spoken to the audience that the other characters do not hear; this is a poem.
    hint: Whom does the line speak to, and does that listener reply?
    why:
      B: An allusion refers to a known person, place or story; the line refers to none.
      C: An anecdote is a short story of an incident; one line of address tells no story.
      D: An aside is a dramatic device spoken to the audience on stage, not a device of this poem.
  24:
    answer: D
    steps:
    - This is the rhetorical question.
    - A rhetorical question is asked for effect, to make a point, not to get an answer.
    - '"For what reason or rhyme ... refuse to marry?" and "what is there in that to vex some of them so?" The speaker does not wait for a reply; the questions carry his own view that women need men.'
    - It matters because the questions show the speaker's attitude, and invite the reader to argue back.
    - 'Remember: a mother who asks "Am I your mate?" does not want an answer. That is a rhetorical question.'
    - The trap is C, ironical statement. The speaker may sound one-sided, but these lines are questions, and the device is the question asked for effect.
    hint: Does the speaker really want someone to answer him?
    why:
      A: Pathetic fallacy gives human feelings to nature ("the sky wept"); there is no nature here.
      B: Chiasmus reverses words in two parallel phrases ("fair is foul, and foul is fair"); these lines do not.
      C: The lines are questions asked to make a point, not statements that mean their opposite.
  25:
    answer: A
    steps:
    - This is an image, a metaphor for time.
    - A chariot is a fast war carriage; one with wings is faster still. Marvell pictures time as that chariot racing up behind the speaker.
    - '"At my back I always hear / Time''s wingèd chariot hurrying near": time is always close behind, and it is hurrying.'
    - 'It matters because it is the turning point of the poem''s argument: life is short and time flies, so the lady should stop being coy and love now.'
    - 'Remember: a winged chariot is time flying, the way we say "the term just flew by".'
    - The trap is D, how fast events unfold. The chariot is time itself, not events; the image is about time passing.
    hint: What is faster than a chariot? And whose chariot is it?
    why:
      B: The image shows time's speed, not how useful time is.
      C: Nothing in the image measures time; it shows time racing by.
      D: The chariot is time itself; the image is about time passing, not events.
  26:
    answer: A
    steps:
    - This is the poem's opening, the setting.
    - 'Lawrence opens with the evening scene: "At evening, sitting on this terrace, / When the sun from the west, beyond Pisa, beyond the mountains of Carrara / Departs".'
    - Only after setting the scene, the sunset over Florence and the river, does the persona notice the creatures flying, first thinking them swallows, then crying "Bats!"
    - It matters because the calm, beautiful evening sets up the shock and disgust when the swallows turn out to be bats.
    - 'Remember: first the stage, then the actors; first the sunset, then the bats.'
    - The trap is C, bats. The bats are the subject of the poem, but they arrive after the scene is set.
    hint: Before any creature appears, where is the persona sitting, and at what time of day?
    why:
      B: The flying creatures come after the scene is set.
      C: The bats are the subject, but they appear only after the evening scene.
      D: The Chinese symbol of happiness comes at the end of the poem, not the opening.
  27:
    answer: A
    steps:
    - This is a theme, the central idea a poem explores, which is more than its subject.
    - 'One of the wise men looks back on the hard journey to find the infant Christ: "A cold coming we had of it".'
    - He found "Birth or Death?" The birth was "Hard and bitter agony for us, like Death, our death". Home again, he is "no longer at ease here, in the old dispensation" and says "I should be glad of another death."
    - 'It matters because the journey stands for a spiritual search: the wise men seek salvation, and finding it means the death of their old life.'
    - 'Remember: the journey is the story; the search for salvation is the meaning.'
    - The trap is D, journey. The journey is the subject, what happens, but the theme is what the journey means.
    hint: The journey is what happens. What were the wise men really seeking?
    why:
      B: The magi are not fleeing anyone; they travel to find the child.
      C: Nature appears in the cold and the valley, but it is setting, not theme.
      D: The journey is the poem's subject; the theme is the spiritual quest it stands for.
  28:
    answer: C
    steps:
    - This is a metaphor in a title.
    - A metaphor describes one thing as if it were another. The navel is the centre of the body; the soul is a person's inner self.
    - Put together, "the navel of the soul" is the very centre of the inner self, the deepest place in a person, where feeling and conscience live.
    - It matters because the title tells the reader that the poem goes inward, to what lies at the core of a person or a people.
    - 'Remember: the navel is the centre of the body, so the navel of the soul is the centre of the inner self.'
    - The trap is A, a hospital where babies are born. A navel recalls birth, but the soul has no hospital; the metaphor points inward, not to a place.
    hint: Where on the body is the navel? Now put the soul in place of the body.
    why:
      A: A navel recalls birth, but the metaphor is about the soul's centre, not a building.
      B: A midwife cuts the cord at the navel, but the title is about the soul, not a skill.
      D: The phrase names no building; it points to the inner self.
  29:
    answer: D
    steps:
    - 'This is imagery: words that make pictures for the senses.'
    - 'The lines are built on two sound images: beating drums and starting echoes.'
    - '"To beat drums is mere children''s play, the adult''s is to start echoes": a child makes noise for the moment; a grown-up starts something whose sound goes on long after. The pictures carry the meaning.'
    - 'It matters because the proverb-like images say what plain words could not: real deeds, like the end of a war, must have effects that last.'
    - 'Remember: drum and echo are images you can hear.'
    - The trap is B, rhythm. The lines have a beat, but they do not rhyme or keep a set rhythm; what they give the poem is pictures.
    hint: What two things do you see and hear in the lines?
    why:
      A: The lines do not rhyme with each other.
      B: The lines are broken by pauses; they do not set up a regular rhythm.
      C: The dots are pauses in speech; the lines' real work is done by their images.
  30:
    answer: C
    steps:
    - This is the sonnet, a type of poem.
    - A sonnet is traditionally a lyric poem of fourteen lines, usually in iambic pentameter with a set rhyme scheme.
    - The Petrarchan sonnet divides the fourteen into an octave of eight and a sestet of six; the Shakespearean into three quatrains of four and a couplet of two.
    - 'It matters because the form shapes the thought: a problem is set out, then turned or answered in the last lines.'
    - 'Remember: eight plus six, or four, four, four plus two. Either way, fourteen.'
    - The trap is A, eight lines. Eight is the octave, only the first part of a Petrarchan sonnet.
    hint: 'Add the octave and the sestet: eight plus six.'
    why:
      A: Eight lines is only the octave, the first part of a Petrarchan sonnet.
      B: Twelve lines is three quatrains without the closing couplet.
      D: Sixteen is two more than the sonnet's fixed length.
  31:
    answer: C
    steps:
    - This is flashback.
    - A flashback breaks the time order of a story to show an event that happened earlier.
    - In Things Fall Apart, the story stops to tell how the young Okonkwo threw Amalinze the Cat, years before. The present action pauses while the past is shown.
    - 'It matters because a flashback explains the present: why a character is the way he is, or how a conflict began.'
    - 'Remember: flash back, as when Nollywood turns the screen grey to show what happened years ago.'
    - The trap is D, foreshadowing. It looks the other way, hinting at what will happen later.
    hint: Does the device look back in time, or forward?
    why:
      A: An interlude is a short break or entertainment between the parts of a play.
      B: Anti-climax is a sudden fall from something serious to something trivial.
      D: Foreshadowing hints at what will happen later; it looks forward, not back.
  32:
    answer: C
    steps:
    - This is the stanza.
    - A stanza is a group of lines in a poem, set apart by a space, usually developing one idea.
    - 'A paragraph does the same job in prose: a group of sentences on one idea, set apart from the next.'
    - It matters because seeing stanzas as a poem's paragraphs helps you follow how its argument moves from one idea to the next.
    - 'Remember: paragraph is to prose as stanza is to poetry. One idea, one block.'
    - The trap is B, verse. A verse is a single line of poetry, or poetry in general, so it matches a sentence, not a paragraph.
    hint: A paragraph is a block of sentences. What is a block of lines in a poem called?
    why:
      A: A trope is a figure of speech, such as a metaphor, not a unit of a poem.
      B: A verse is a single line, or poetry in general, not a block of lines.
      D: Metre is the pattern of beats in a line, not a block of lines.
  33:
    answer: D
    steps:
    - This is the fable.
    - A fable is a short story, often with animals as characters, that illustrates a moral truth or lesson about how to live.
    - In the tortoise stories told by moonlight, the tortoise's greed or cunning leads to a lesson, and the story ends with a moral truth such as "pride goes before a fall".
    - 'It matters because the fable teaches through story: the reader learns the lesson by watching it happen.'
    - 'Remember: fable equals a story plus a moral truth.'
    - The trap is B, origin. Stories that explain origins ("why the tortoise's shell is cracked") are myths or folk tales; the fable's aim is a moral truth.
    hint: 'What does every fable end with: a date, a custom, or a lesson that is true for everyone?'
    why:
      A: Urgency has nothing to do with the fable; it is a calm teaching story.
      B: Stories of origins are myths or folk tales; the fable teaches a moral truth.
      C: A fable may show customs, but its purpose is a moral truth.
  34:
    answer: C
    steps:
    - This is repetition.
    - Repetition is the deliberate use of a word, phrase or line more than once, to make it stand out.
    - In Martin Luther King's speech, "I have a dream" comes again and again; in a poem, a refrain returns at the end of each stanza. Each return drives the point home.
    - It matters because what is said again is remembered; the reader feels the weight of the idea.
    - 'Remember: say it again to stress it, the way a teacher says "Read, read, read!"'
    - The trap is D, alliteration. It repeats a first consonant sound for music ("Peter Piper picked"), not a whole word or idea for emphasis.
    hint: How does a speaker make sure a point is not missed? He says it ...
    why:
      A: Rhyme matches end sounds for music, not for emphasis.
      B: Assonance repeats vowel sounds inside words for music.
      D: Alliteration repeats first consonant sounds for music, not a whole word for emphasis.
  35:
    answer: B
    steps:
    - This is satire.
    - Satire is writing that mocks the faults of people, institutions or ideas, using humour, irony or exaggeration, in the hope of correcting them.
    - Orwell's Animal Farm mocks a revolution that betrays itself; on Nigerian television, comedians who mimic corrupt politicians are doing the same.
    - It matters because satire makes people laugh at wrongdoing, and laughter can shame where a lecture fails.
    - 'Remember: satire laughs at faults so that they will be fixed.'
    - The trap is C, an irony. Irony is a device a satirist often uses, but it is not itself a whole literary work that ridicules.
    hint: Which kind of work makes fun of people's faults to correct them?
    why:
      A: A masque is a courtly entertainment of music, dance and spectacle.
      C: Irony is a device, often used in satire, not a whole work that ridicules.
      D: A fable teaches a moral through a short story, usually with animals.
  36:
    answer: B
    steps:
    - This is irony, verbal irony.
    - Verbal irony is saying the opposite of what one really means.
    - When NEPA takes the light for the fifth time in a day and someone says "Wonderful service!", he means it is terrible. In Julius Caesar, Antony keeps calling Brutus "an honourable man" while showing he is not.
    - It matters because irony makes the reader see the gap between words and truth, often with bite.
    - 'Remember: irony says "well done" when it means "what a mess".'
    - The trap is C, paradox. A paradox seems to contradict itself but holds a truth ("the child is father of the man"); it does not mean its opposite.
    hint: If someone says "What lovely weather!" in a storm, what figure is that?
    why:
      A: Satire is a whole work that mocks faults; it may use irony, but it is not this figure.
      C: A paradox seems self-contradictory but is true; it does not mean the opposite.
      D: A metaphor calls one thing another; it does not reverse the meaning.
  37:
    answer: D
    steps:
    - This is mime.
    - 'Mime is acting without words: the story is told by gesture, movement and facial expression.'
    - A character who silently weeps over a grave, or a dumb show where actors act out a story without a word, is mime.
    - It matters because mime shows that drama is action as well as words; a gesture can say what speech cannot.
    - 'Remember: mime keeps its mouth shut.'
    - The trap is A, soliloquy. A soliloquy is all speech, a character talking alone; mime has none.
    hint: Which of these has no words at all?
    why:
      A: A soliloquy is a speech; mime has no speech.
      B: An aside is spoken words meant for the audience.
      C: An epilogue is a speech at the end of a play.
  38:
    answer: B
    steps:
    - This is didactic.
    - A didactic work is written mainly to teach, to give moral or practical instruction.
    - Fables, the Book of Proverbs, and the folk tales told to children by moonlight, which always end with a lesson, are didactic.
    - 'It matters because knowing the writer''s aim tells you how to read: a didactic work wants you to learn and change, not only to enjoy.'
    - 'Remember: didactic comes from the Greek for "to teach". Think of a teacher with a lesson in every story.'
    - The trap is D, corrective. Correcting faults is part of teaching, but "didactic" is the literary term for a work that teaches a moral.
    hint: Which word is the literary term for writing that sets out to teach?
    why:
      A: Impressive just means striking; it is not a literary term for teaching.
      C: Lyrical describes a song-like work expressing feeling, not teaching.
      D: Corrective is an everyday word; the literary term for a teaching work is didactic.
  39:
    answer: D
    steps:
    - This is the tragic flaw, called hamartia by Aristotle.
    - A tragic flaw is a weakness or error of judgement in the hero that leads to his downfall.
    - Okonkwo's fear of weakness and his rashness lead him to kill Ikemefuna and later the messenger, and so to his ruin. Othello's jealousy destroys him and Desdemona.
    - It matters because the flaw makes the fall the hero's own doing, so we feel both pity and fear.
    - 'Remember: one crack in the pot, and the whole pot breaks.'
    - The trap is C, climax. The climax is the turning point of the plot, not the hero's mistake.
    hint: Which term names something inside the hero himself?
    why:
      A: Comic relief is a funny scene that eases tension in a tragedy.
      B: Terse describes short, clipped language, not a hero's mistake.
      C: The climax is the highest point of tension in the plot, not the hero's error.
  40:
    answer: D
    steps:
    - This is the soliloquy.
    - A soliloquy is a speech in which a character, alone on stage or as if alone, speaks his thoughts aloud to himself.
    - 'Hamlet''s "To be, or not to be" is a soliloquy: he talks to himself about life and death, and the audience overhears his thoughts.'
    - It matters because the soliloquy lets the audience see inside a character's mind, his doubts and plans.
    - 'Remember: solo, alone. A soliloquy is a solo speech to oneself.'
    - The trap is A, monologue. A monologue is a long speech by one character, but it is spoken to other characters or to an audience, not to himself.
    hint: Who is listening in a monologue? And who is listening in a soliloquy?
    why:
      A: A monologue is a long speech by one person addressed to others, not to oneself.
      B: An epilogue is a closing speech to the audience at the end of a play.
      C: An aside is a brief remark to the audience that the other characters do not hear.
  41:
    answer: B
    steps:
    - 'This is about what an image reveals: the "jealous eye".'
    - To be covetous is to be envious, to want what belongs to another, and to begrudge it to them.
    - 'Night, pictured as a woman, has a "jealous eye" that will "quench the sea''s / Fluorescence": she puts out the sea''s glow, as if no light but hers may shine.'
    - It matters because the image makes Night a possessive, envious presence, darkening everything around the persona.
    - 'Remember: a jealous eye is a covetous eye; it cannot bear another''s shine.'
    - The trap is A, a magician. Quenching the sea's light sounds like magic, but the word the lines use is "jealous", a feeling, not a power.
    hint: Which word in the lines describes the woman's eye?
    why:
      A: Putting out the light may seem magical, but the lines stress jealousy, not magic.
      C: Dogmatic means stubbornly sure of one's opinions; the lines say nothing of opinions.
      D: A seer sees the future; this eye is jealous, not prophetic.
  42:
    answer: D
    steps:
    - 'This is about the speaker''s attitude to the sun: an indictment, a charge or accusation.'
    - To indict is to accuse someone formally of wrongdoing.
    - The speaker calls the sun a "busy old fool" and "unruly", then demands, "Why dost thou thus ... call on us?" He accuses the sun of barging in on two lovers in bed.
    - 'It matters because the playful scolding sets up the poem''s boast: the lovers'' world is so complete that even the sun should serve them.'
    - 'Remember: names like "fool" and a "why do you" question make a charge sheet.'
    - The trap is B, invitation to the sun. The sun has already come in through the windows; the speaker wants it gone, not invited.
    hint: What names does the speaker call the sun? Are they kind?
    why:
      A: The sun is insulted, not praised.
      B: The sun is already peeping in; the speaker scolds it, he does not invite it.
      C: '"Busy old fool" is no welcome.'
  43:
    answer: B
    steps:
    - This is personification.
    - Personification gives human qualities or actions to a thing, an animal or an idea.
    - The sun is called a "busy old fool", "unruly" like a badly behaved person, and is said to "call on us" through windows and curtains, like a nosy visitor.
    - It matters because treating the sun as a meddling old man makes the speaker's scolding funny and vivid.
    - 'Remember: if the sun can be a fool and pay a visit, it has been made a person.'
    - The trap is A, simile. A simile uses "like" or "as"; the lines have neither, they treat the sun directly as a person.
    hint: Can the sun really be a fool, or call on someone?
    why:
      A: There is no "like" or "as" comparison in the lines.
      C: An epigram is a short, witty saying that stands on its own; these lines scold the sun.
      D: A pun plays on two meanings of a word; no word here carries a double meaning.
  44:
    answer: A
    steps:
    - This is about the persona's situation, read from his own questions.
    - In The Solitary Reaper, the persona hears a Highland girl singing alone as she reaps, in Gaelic, a language he does not know.
    - '"Will no one tell me what she sings?" He needs someone to tell him. Then he only guesses: "Perhaps" it is about "battles long ago", "Or is it some more humble lay"? He cannot understand her words.'
    - It matters because the poem's point is that the song moves him deeply even without its meaning; music speaks beyond words.
    - 'Remember: if you must ask "What is she singing?", you do not understand the language.'
    - The trap is B, in love with the girl. He is moved by her song, but nothing in the lines speaks of love for her.
    hint: Would someone who understood the song need to ask what she sings?
    why:
      B: He is moved by the song, but the lines say nothing of love for the girl.
      C: He does not hate her words; he is enchanted by the song.
      D: If he understood the songs, he would not need to ask or guess.
  45:
    answer: B
    steps:
    - This is the rhetorical question.
    - A rhetorical question is asked for effect, not to get a real answer.
    - '"Will no one tell me what she sings?" There is no one in the field to tell him, and he does not wait; he goes straight on to his own guesses.'
    - It matters because the question pulls the reader into the persona's wonder and draws us into guessing with him.
    - 'Remember: a question nobody is there to answer is a rhetorical question.'
    - The trap is A, transferred epithet. The extract has one ("unhappy" things, the sadness belongs to people), but it is not in the first line.
    hint: Is anyone in the field there to answer him?
    why:
      A: A transferred epithet moves an adjective to the wrong noun; the first line has none.
      C: The persona means exactly what he asks; there is no gap between words and meaning.
      D: A conceit is an elaborate, far-fetched comparison; the line makes no comparison.
  46:
    answer: B
    steps:
    - This is apostrophe.
    - Apostrophe is a figure of speech in which the speaker turns to address directly someone absent or unseen, or a thing or idea.
    - '"Oh incomprehensible God!" The persona cries out straight to God, who cannot be seen and does not reply. The "Oh" marks the turn.'
    - 'It matters because the address makes the poem a prayer, urgent and personal: the persona asks whether his own inborn stars, his fate, will guide him to God''s final call.'
    - 'Remember: an "O" or "Oh" before a name that cannot answer ("O God!", "O Death!") is apostrophe.'
    - The trap is A, passion. The line is full of feeling, but passion is an emotion, not the name of a literary device.
    hint: Whom does the first line speak to directly?
    why:
      A: The line is full of feeling, but passion is an emotion, not a device.
      C: Burlesque mocks a serious subject by treating it lightly; this line is reverent.
      D: Rhetoric is the whole art of persuasive speech, not one device.
  47:
    answer: A
    steps:
    - This is the speaker's view of the sun, read from his words.
    - A meddling intruder is someone who pushes in where he is not wanted and interferes in other people's business.
    - The sun is "busy", a busybody; "unruly", behaving badly; and it comes "through windows, and through curtains" to "call on" the lovers, uninvited.
    - It matters because the lovers think their love is the centre of the world; the sun is a nuisance that should go and wake schoolboys and farm workers instead.
    - 'Remember: through the window and through the curtain, uninvited, is how an intruder comes in.'
    - The trap is B, a light provider. The sun does give light, but the speaker resents that light here; he sees it as an intrusion.
    hint: Does the speaker want the sun's visit?
    why:
      B: The sun gives light, but the speaker resents it for barging in.
      C: The lovers do not welcome the morning; they want the night to continue.
      D: '"Busy old fool" is the language of annoyance, not friendship.'
  48:
    answer: A
    steps:
    - This is the theme, the central idea the lines express.
    - 'The first line sets it out: "The body perishes, the heart stays young." The body ages and dies, but the heart, the seat of love, stays young.'
    - 'The images that follow show what wears out with use and age, the platter and the log, against what does not: the heart''s feeling. Even an old lover still cannot rest while a rival weeps; love''s passion stays alive.'
    - 'It matters because the images of decay are there as contrast: everything physical wears away, and love does not.'
    - 'Remember: plates wear out, logs lose their bark, but the heart stays young.'
    - 'The trap is D, the diminishing nature of love. The lines show things diminishing, but they set love apart from them: "the heart stays young".'
    hint: Read the first line again. What perishes, and what stays young?
    why:
      B: The log is one image of decay, used as contrast; the poem is not about wood.
      C: The last line touches on rivalry, but the main idea is that the heart, and its love, stays young.
      D: The poem says the heart stays young; it is the body and things that wear away.
  49:
    answer: C
    steps:
    - This is about the meaning of one line.
    - 'A rival is someone who loves the same person. Two men, say, love one woman: one wins, the other weeps.'
    - '"No lover peaceful while the rival weeps": the winner cannot be at peace while the loser grieves. The rival''s pain reaches him and troubles him.'
    - 'It matters because it shows how closely love binds people, even rivals: one lover''s sorrow unsettles the other.'
    - 'Remember: in a love triangle, the tears of one disturb the peace of the other.'
    - The trap is B, the two lovers weep together. Only the rival weeps; the other lover is not weeping but cannot be at peace.
    hint: Who weeps in the line, and who cannot be at peace?
    why:
      A: The line is about the effect of a rival's grief, not about whether love lasts.
      B: Only the rival weeps; the other lover is troubled, not weeping.
      D: The line says nothing about love ending; it is about one lover's pain affecting the other.
  50:
    answer: B
    steps:
    - This is parallelism.
    - Parallelism is the use of the same grammatical pattern in two or more phrases or sentences, to balance them and drive a point home.
    - '"Will college make you a better Olokun priest? / Will it make you serve our ancestors better?" Both questions follow the same pattern, "Will ... make you ...?", and the two compound words, "able-bodied, strong-hearted", balance each other too.'
    - It matters because the matching questions hammer home the speaker's view that tradition needs no college, the clash of old ways and new learning.
    - 'Remember: same shape, side by side, like the parallel lines of a railway track.'
    - The trap is D, metaphor. Nothing is called something else here; the force of the passage comes from its repeated pattern.
    hint: Put the first two lines side by side. What is the same about them?
    why:
      A: There is no comparison with "like" or "as".
      C: No word imitates a sound.
      D: Nothing is called something it is not; the passage works by its repeated pattern.
