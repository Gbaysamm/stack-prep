      - 'Catharsis is the purging, or cleansing, of the emotions of pity and fear that a tragedy arouses in its audience.'
      - 'At the end of Shakespeare''s Othello, we feel pity for Desdemona and Othello and fear at how far jealousy can go; as the play ends, those feelings are released and we leave calmer and wiser.'
