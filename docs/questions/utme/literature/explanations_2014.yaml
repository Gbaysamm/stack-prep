      - 'In Shakespeare''s Macbeth, just after Duncan is murdered, the drunken Porter jokes at the gate about being the porter of hell''s gate. In Romeo and Juliet, the Nurse''s chatter lightens the tragedy.'
      - 'It matters because a moment of laughter rests the audience, and makes the tragedy that follows feel even heavier.'
      - 'Remember: comic relief is like a joke at a wake; for a moment everybody breathes again.'
