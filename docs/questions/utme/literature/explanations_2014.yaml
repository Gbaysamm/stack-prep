    steps:
      - 'This is about plot, one of the main elements of any story or play.'
      - 'A plot is the arrangement of the events of a story, linked by cause and effect: one event leads to the next.'
      - 'E. M. Forster''s example: ''The king died and then the queen died'' is only a story; ''The king died, and then the queen died of grief'' is a plot, because the second event is caused by the first.'
      - 'Plot matters because it gives a work its shape: exposition, rising action, climax, falling action and resolution all hang on it.'
