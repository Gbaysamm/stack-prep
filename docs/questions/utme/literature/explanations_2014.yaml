format_version: 1
exam_year: 2014
subject: LIT
explanations:
  2:
    answer: B
    steps:
      - 'This is about how the gods, Anlugbua and his mother Lawumi, are presented in Femi Osofisan''s Women of Owu.'
      - 'In the play the fate of Owu is the will of the gods. The city''s fall is presented as their decision, and they go on to decide what will become of the armies that destroyed it.'
      - 'Osofisan shows this to make us question the gods. They shape the destiny of men, yet they do not save the women who worshipped them, and the women are left to bear the suffering.'
      - 'This serves the play''s theme of war and its victims: ordinary people pay for decisions made far above them.'
      - 'Remember: the gods in Women of Owu draw the plan, like an architect, and the people must live in the house they draw.'
      - 'The trap is A, helpless. The gods do not protect Owu, but not for lack of power; they are the ones deciding its fate.'
    hint: 'Ask who decides what happens to Owu and to its conquerors in the play.'
    why:
      A: 'The gods are not powerless; they decide the fate of Owu and of its conquerors.'
      C: 'The gods are not shown as lovers; their concern is power and punishment.'
      D: 'The gods do not save Owu; the women are left to suffer the destruction.'

  3:
    answer: B
    steps:
      - 'This is about how Orisaye, Erelu''s daughter, sees Balogun Kusa, a commander of the armies that destroyed Owu.'
      - 'Orisaye is one of the captive women of Owu. The men of her city have been killed and she is to be carried off by the conquerors, so she sees Kusa as an enemy and a butcher.'
      - 'Her words come from the moment of defeat: the general that his own soldiers might praise is, to his victims, a killer of their people.'
      - 'This serves the play''s theme: war that the victors call glory is, for the defeated, slaughter.'
      - 'Remember: ask who is speaking. A woman of Owu will not praise the general who burnt her home.'
      - 'The trap is A, a great warrior. Kusa may be skilled in battle, but Orisaye speaks as his victim, not as an admirer.'
    hint: 'Orisaye has just lost her city to Kusa''s army. Would she praise him?'
    why:
      A: 'Others might praise his skill in war, but Orisaye, his captive, does not.'
      C: 'Kusa helped to destroy her city; he is no friend to her.'
      D: 'To the women of Owu he is the leader of their destroyers, not a good leader.'

  4:
    answer: A
    steps:
      - 'This is about Erelu Afin, the leading woman of Femi Osofisan''s Women of Owu.'
      - 'Erelu is the queen of Owu, the oldest wife of Oba Akinjobi, the king of Owu.'
      - 'She is Osofisan''s version of Hecuba, the old queen in Euripides'' The Trojan Women, which the play reworks in a Yoruba setting.'
      - 'Throughout the play she leads the women of Owu in mourning the fallen city, so the grief of a whole people is seen through its queen.'
      - 'Remember: Erelu is a title of high honour for a woman in Yoruba land; in this play it belongs to the king''s senior wife.'
      - 'The trap is B, a courtier to the Alaafin of Oyo. The Alaafin is a famous Yoruba king, but Erelu belongs to the royal house of Owu.'
    hint: 'Which king''s house does Erelu belong to?'
    why:
      B: 'She belongs to Owu''s royal house, not the court of the Alaafin of Oyo.'
      C: 'The play shows her as the grieving queen, not as the cleverest woman in the town.'
      D: 'She is royalty, the Oba''s wife, not a trader from Apomu market.'

  5:
    answer: C
    steps:
      - 'This is about Orisaye, Erelu''s daughter, who is to be taken away by Balogun Kusa as his wife.'
      - 'The people around her treat her as a lunatic, because of her wild words and behaviour.'
      - 'She is Osofisan''s version of Cassandra in Euripides'' The Trojan Women, the prophetess whom everyone thinks mad and nobody believes.'
      - 'Her madness matters because it carries truth: in her wild speech she sees beyond the conquerors'' victory to the trouble that waits for them.'
      - 'Remember: think of the ''madwoman'' in a Nollywood village story whose strange words later come true.'
      - 'The trap is A, goddess. She speaks of gods and of the future, but she is a human woman, not a goddess.'
    hint: 'Think of Cassandra in the Greek story of Troy. How did people see her?'
    why:
      A: 'She speaks of the gods and the future, but she is a human woman, not a goddess.'
      B: 'She is not a healer; her strangeness lies in her wild speech, not in herbs.'
      D: 'She is a captive woman of Owu, not a fighter.'

  6:
    answer: A
    steps:
      - 'This is about Ariel in William Shakespeare''s The Tempest.'
      - 'Ariel is ''an airy spirit'' who serves Prospero, and he leads the island''s other spirits in carrying out Prospero''s commands.'
      - 'He raises the storm in Act 1, and Prospero praises him in Act 4: ''Thou and thy meaner fellows your last service / Did worthily perform.'' The ''meaner fellows'' are the lesser spirits Ariel leads.'
      - 'Ariel matters because he is the power behind Prospero''s magic, and his longing for freedom runs through the play until Prospero sets him free at the end.'
      - 'Remember: Ariel sounds like ''air''. He is the spirit of the air, chief of the spirits.'
      - 'The trap is D, Sycorax''s son. Ariel once served the witch Sycorax, who shut him in a cloven pine, but her son is Caliban.'
    hint: 'Ariel is a spirit. Who are the ''meaner fellows'' Prospero mentions?'
    why:
      B: 'Prospero''s daughter is Miranda.'
      C: 'Alonso''s wife does not appear in the play; Ariel is a spirit, not a woman of Naples.'
      D: 'Sycorax''s son is Caliban; Ariel was once her servant, whom she imprisoned in a pine.'

  7:
    answer: B
    steps:
      - 'This is about how long Prospero and Miranda have lived on the island when the play opens.'
      - 'Prospero tells Miranda it has been twelve years: ''Twelve year since, Miranda, twelve year since, / Thy father was the Duke of Milan.'''
      - 'He says this in Act 1 Scene 2, when he tells her for the first time how his brother Antonio took his dukedom and set them adrift at sea. Miranda was then ''not / Out three years old'', so she is now about fifteen.'
      - 'The number matters: twelve years of exile have made Prospero master of the island, and now his enemies have sailed within reach.'
      - 'Remember: twelve years of exile, from a girl of three to a girl of fifteen.'
      - 'The trap is A, two decades. That would make Miranda over twenty, but she is a girl of about fifteen.'
    hint: 'Prospero repeats the number twice when he begins his story to Miranda.'
    why:
      A: 'Two decades is twenty years; Miranda, who was under three when they came, is only about fifteen.'
      C: 'Forty days is far too short; they have lived there long enough for Miranda to grow up.'
      D: 'Eighteen months is far too short; Prospero says twelve years.'

  8:
    answer: C
    steps:
      - 'This is about Caliban''s attempt on Miranda in The Tempest, and his own reason for it.'
      - 'When Prospero accuses him, Caliban answers: ''O ho, O ho! Would''t had been done! / Thou didst prevent me; I had peopled else / This isle with Calibans.'''
      - 'So his desire was to fill, or populate, the island with children like himself.'
      - 'This matters because it shows why Prospero now keeps Caliban as a slave, and it raises the play''s question of who should own the island.'
      - 'Remember: ''peopled else this isle with Calibans'' means ''or else I would have filled the island with Calibans''.'
      - 'The trap is D, marry her. Caliban never speaks of marriage; his own words are about peopling the isle.'
    hint: 'Look at Caliban''s own words: what did he say he would have done to the isle?'
    why:
      A: 'Caliban loves the island and claims it as his own; he wants to rule it, not destroy it.'
      B: 'Ferdinand has not yet arrived when this happened; Caliban is not competing with him.'
      D: 'Caliban never speaks of marriage; he speaks of peopling the isle with Calibans.'

  9:
    answer: C
    steps:
      - 'This is about the character who stands for savagery in The Tempest.'
      - 'Caliban is the savage of the play. In the list of characters he is ''a savage and deformed slave'', and he is called ''savage'' to his face in Act 1 Scene 2.'
      - 'He shows it in his curses, his attempt on Miranda, and his plot with Stephano and Trinculo to kill Prospero.'
      - 'He matters because the play sets him against civilised Prospero and Miranda; yet he also speaks some of its most beautiful lines about the island, so the play makes us think about what ''savage'' means.'
      - 'Remember: Caliban''s name is close to ''cannibal'', a word Shakespeare''s audience linked with savages.'
      - 'The trap is B, Stephano. He is a drunken butler who joins Caliban''s plot, but he stands for drunken folly, not savagery.'
    hint: 'Which character does the list of characters call ''a savage and deformed slave''?'
    why:
      A: 'Ariel is a delicate spirit of the air, linked with music and magic.'
      B: 'Stephano is a drunken butler; he stands for drunken folly, not savagery.'
      D: 'Ferdinand is the gentle, courteous prince who falls in love with Miranda.'

  10:
    answer: B
    steps:
      - 'This is about the kind of man Prospero was, and how he lost his dukedom.'
      - 'Prospero tells Miranda that he handed the work of government to his brother Antonio and grew ''stranger'' to his state, ''being transported / And rapt in secret studies''.'
      - 'So he cared more for his books than for ruling Milan, and that gave Antonio the chance to seize the dukedom.'
      - 'This matters because his love of study is both his fault and his strength: it lost him Milan, but it gave him the magic that brings his enemies to the island.'
      - 'Remember: ''my library was dukedom large enough''. Prospero''s books mattered more to him than his throne.'
      - 'The trap is A, full of mistrust for everybody. Prospero is watchful, but he trusts Gonzalo, Ariel and, in the end, Ferdinand.'
    hint: 'What was Prospero doing while Antonio plotted against him?'
    why:
      A: 'He is watchful, but he trusts Gonzalo and Ariel; mistrust of everybody is not his portrait.'
      C: 'The spirits serve him, not the other way round; he commands them by his art.'
      D: 'He wants his own dukedom back, not to conquer the world, and he gives up his magic at the end.'

  11:
    answer: D
    steps:
      - 'This is about the main theme of Asare Konadu''s A Woman in Her Prime.'
      - 'The novel follows Pokuwaa, a hard-working woman who has everything except the child she longs for. Her quest for a child is its theme.'
      - 'Every part of the story turns on it: her married life, her visits to the gods and their priests, the sacrifices she makes and the talk of the village.'
      - 'This matters because it shows how much a traditional African society values children, and how heavily childlessness weighs on a woman.'
      - 'Remember: Pokuwaa''s whole life in the novel is one long journey towards a child.'
      - 'The trap is A, exploitation of the African woman. Pokuwaa suffers, but from childlessness, not from being exploited.'
    hint: 'What does Pokuwaa want more than anything else in the novel?'
    why:
      A: 'Pokuwaa is a strong woman; her suffering comes from childlessness, not from exploitation.'
      B: 'The novel is set in Ghana, but its concern is childlessness, not discrimination between the sexes.'
      C: 'The novel is set in Ghana, not Nigeria, and it is not about a women''s liberation movement.'

  12:
    answer: D
    steps:
      - 'This is about what Pokuwaa''s world sees as the worst misfortune for a woman.'
      - 'In A Woman in Her Prime, the worst calamity that can befall a woman is barrenness, being unable to bear any child at all.'
      - 'Pokuwaa is hard-working and respected, yet she is pitied, because she has no child. Her whole quest in the novel comes from this fear.'
      - 'This matters because in the traditional society of the novel, a woman''s worth is measured by the children she bears.'
      - 'Remember: in the novel, a woman can have everything else, but without a child people still pity her.'
      - 'The trap is A, inability to bear male children. That is a worry in some stories, but Pokuwaa''s sorrow is that she has no child at all.'
    hint: 'What is the one thing Pokuwaa lacks in the novel?'
    why:
      A: 'Pokuwaa''s sorrow is having no child at all, not having no son.'
      B: 'Pokuwaa marries; marriage is not what she lacks.'
      C: 'Divorce is not shown as the worst calamity; having no child is the sorrow at the heart of the novel.'

  13:
    answer: B
    steps:
      - 'This is about the setting of Asare Konadu''s A Woman in Her Prime: where the story takes place.'
      - 'The novel is set in a farming village in rural Ghana, among the Akan people.'
      - 'Pokuwaa works her farm, goes to the village shrine and lives by the village''s customs and festivals. The village life is all around her story.'
      - 'The setting matters because her quest for a child is shaped by the beliefs of that traditional rural society.'
      - 'Remember: Asare Konadu was Ghanaian, and his novel stays in the Ghanaian village, far from the big towns.'
      - 'The trap is C, Accra. It is in Ghana, but the novel stays in the village, not the capital.'
    hint: 'Konadu was Ghanaian. Is Pokuwaa''s world a city or a village?'
    why:
      A: 'The novel is set in Ghana, not Nigeria, and in a village, not a city.'
      C: 'Accra is the capital; the novel stays in a rural village.'
      D: 'The story follows a village woman and her farm, not a school.'

  14:
    answer: C
    steps:
      - 'This is about Father Benedict, the white parish priest of St. Agnes church in Enugu, at the very start of Purple Hibiscus.'
      - 'Kambili tells us that Father Benedict ''had changed things in the parish, such as insisting that the Credo and kyrie be recited only in Latin; Igbo was not acceptable.'''
      - 'Papa, Eugene, admires these changes; the priest''s European ways match his own scorn for Igbo tradition.'
      - 'This matters because it sets up a contrast that runs through the novel: Father Amadi, the young Nigerian priest, sings Igbo songs at Mass, and Kambili grows by learning from him.'
      - 'Remember: Benedict means Latin; Amadi means Igbo.'
      - 'The trap is B, the Credo in Igbo. That is the opposite of the change: Father Benedict made Igbo unacceptable.'
    hint: 'Father Benedict is a white priest who wants the Mass to sound like Rome. Which language would he insist on?'
    why:
      A: 'No monthly fast is among Father Benedict''s changes.'
      B: 'This is the opposite: Father Benedict made Igbo unacceptable in the Credo and Kyrie.'
      D: 'Holy communion is not one of the changes he made to the parish.'

  15:
    answer: C
    steps:
      - 'This is about Eugene Achike, Kambili''s father, called Papa.'
      - 'Eugene is a fanatical Catholic: his faith is strict, rigid and violent.'
      - 'He beats his wife and children for the smallest religious failing, pours boiling water on Kambili''s feet, refuses to let his children spend time with his own father, Papa-Nnukwu, whom he calls a heathen, and gives huge sums to the Church.'
      - 'This matters because his fanaticism is the main source of the fear in the family, and of the rebellion that follows.'
      - 'Remember: Eugene measures everything, even love, by his Catholic rules.'
      - 'The trap is B, an uncompromising traditionalist. He is uncompromising, but against tradition: he rejects his father''s traditional religion.'
    hint: 'How does Eugene treat his own father''s traditional religion?'
    why:
      A: 'He beats his wife and children; he is not soft or gentle at home.'
      B: 'He is uncompromising, but against tradition; he rejects his father''s traditional faith.'
      D: 'He is a wealthy factory owner and newspaper publisher, not a retired soldier.'

  16:
    answer: A
    steps:
      - 'This is about the character at the centre of Purple Hibiscus.'
      - 'Kambili Achike, Eugene''s fifteen-year-old daughter, tells the story, and the novel''s theme is her growth from silence to a voice of her own.'
      - 'We see her at first too frightened to speak; at Aunty Ifeoma''s home in Nsukka she learns to laugh, to sing and to love, and by the end she can speak for herself.'
      - 'This matters because the novel is a coming-of-age story: its themes of freedom, fear and faith are all seen through her change.'
      - 'Remember: the purple hibiscus is a rare flower that grows in Aunty Ifeoma''s garden. Kambili is the flower that learns to bloom.'
      - 'The trap is D, Jaja. His rebellion is important, but the story is told by Kambili and centres on her growth.'
    hint: 'Who tells the story, and whose change do we follow from the first page to the last?'
    why:
      B: 'Mama suffers greatly and acts in the end, but the story is told through Kambili.'
      C: 'Sisi is the house help, a minor character.'
      D: 'Jaja''s rebellion is important, but the novel is Kambili''s story, told in her voice.'

  17:
    answer: C
    steps:
      - 'This is about the great fish in Ernest Hemingway''s The Old Man and the Sea.'
      - 'After eighty-four days without a fish, Santiago hooks a giant marlin, and after a struggle of two days and nights he kills it.'
      - 'The marlin is longer than his skiff, so he lashes it alongside; on the way home sharks eat it until only the skeleton is left.'
      - 'The marlin matters because it is a worthy opponent: Santiago loves and respects it even as he kills it, and the struggle shows his courage.'
      - 'Remember: the marlin is the prize, and the sharks are the thieves.'
      - 'The trap is A, shark. Santiago kills several sharks, but they attack his catch; the marlin is the fish he caught after days of effort.'
    hint: 'Which fish does Santiago fight for days, and which ones come afterwards to eat it?'
    why:
      A: 'The sharks come after the catch and eat the marlin; they are not the fish he spent days catching.'
      B: 'An iris is a flower, not a fish.'
      D: 'A geisha is a Japanese woman entertainer, not a fish.'

  18:
    answer: D
    steps:
      - 'This is about the main theme of The Old Man and the Sea.'
      - 'The novel shows man''s struggle against defeat. Santiago says it himself: ''But man is not made for defeat. A man can be destroyed but not defeated.'''
      - 'He loses the marlin to the sharks and comes home with only a skeleton, yet he never gives up, and he plans to fish again.'
      - 'This matters because it shows Hemingway''s idea of courage: dignity lies in how a man fights, not in whether he wins.'
      - 'Remember: ''destroyed but not defeated''.'
      - 'The trap is A, attempt to catch fish. That is the story''s event, but the theme is what the event shows: man''s struggle against defeat.'
    hint: 'Santiago says a man ''can be destroyed but not'' what?'
    why:
      A: 'Catching fish is the event of the story; the theme is the struggle against defeat that it shows.'
      B: 'Santiago does not set out to understand life; he sets out to endure and to fight.'
      C: 'The sea is the setting, but the theme is man''s struggle, not the sea''s influence.'

  19:
    answer: D
    steps:
      - 'This is about Santiago''s attitude to nature: the sea, the fish and the birds.'
      - 'His attitude is warm and friendly. ''He always thought of the sea as la mar which is what people call her in Spanish when they love her.'''
      - 'He talks to a tired small bird that lands on his line, he calls the marlin his brother, and he says to it, ''Fish, I love you and respect you very much.'''
      - 'This matters because he kills the marlin out of need and pride, not hatred; his love for nature makes his struggle noble.'
      - 'Remember: Santiago fights nature as a brother, not as an enemy.'
      - 'The trap is A, cautious and sceptical. Santiago is a careful fisherman, but his attitude to the sea is love, not suspicion.'
    hint: 'What does Santiago call the marlin while he fights it?'
    why:
      A: 'Santiago is careful at sea, but his feeling for nature is love, not suspicion.'
      B: 'He calls the fish his brother and speaks to the birds with kindness; he is not hostile.'
      C: 'He watches the birds, the fish and the stars with close attention; he is not indifferent.'

  20:
    answer: D
    steps:
      - 'This is about the dreams of Santiago, which come at three points in The Old Man and the Sea.'
      - 'His first dream comes the night before the fishing trip, in his shack: he dreams of Africa and the lions on the beach. His second comes far out at sea, when he sleeps in the skiff for a while with the line held under him, while the marlin is still hooked.'
      - 'In that sleep he dreams of a school of porpoises, then of his bed in the village during a north wind, then of the lions. The book ends with a third: ''The old man was dreaming about the lions.'''
      - 'The dreams matter because the lions stand for the strength and youth he still carries inside, even when he is worn out.'
      - 'Remember: first in the shack, second on the boat, last at the end of the book.'
      - 'The trap is A, the night before the trip. That is his first dream, not his second.'
    hint: 'Count the dreams in order: where is Santiago when he first dreams, and where the next time?'
    why:
      A: 'The night before the trip is his first dream, of Africa and the lions.'
      B: 'His first dream is in his house; the second comes while he is out at sea.'
      C: 'The dream at the end of the book is his last, not his second.'

  21:
    answer: C
    steps:
      - 'This is about imagery, the kinds of picture a poem paints in the mind.'
      - 'An image can appeal to any of the five senses. An image that appeals to sight is visual; to hearing, auditory; to taste, gustatory; to touch, tactile.'
      - 'So in any poem, Adeoti''s Hard Lines included, a line that makes us see a colour, a shape or a scene uses visual imagery: for example ''the red sun sinks behind grey hills''.'
      - 'Naming the sense matters, because it shows how the poet makes us experience the poem, not just understand it.'
      - 'Remember: visual goes with vision (sight), auditory with audio (sound), gustatory with taste, tactile with touch.'
      - 'The trap is D, tactile. It sounds like a general word for images, but it belongs to touch.'
    hint: 'Which of these words is linked to ''vision''?'
    why:
      A: 'Auditory imagery appeals to hearing, as in the word ''audio''.'
      B: 'Gustatory imagery appeals to taste.'
      D: 'Tactile imagery appeals to touch.'

  22:
    answer: A
    steps:
      - 'This is about tone, one of the first things to discuss in any poem, Umeh''s Ambassadors of Poverty included.'
      - 'Tone is the poet''s attitude to the subject (and to the reader), shown through the choice of words.'
      - 'A poet can write about the same thing in a mocking, angry, sad or admiring tone. Words like ''so-called leaders'' would show a mocking tone; ''our brave heroes'' an admiring one.'
      - 'Tone matters because it tells us how the poet wants us to feel about the subject, and so what the poem means.'
      - 'Remember: tone in a poem is like the tone of voice your mother uses; the same words can be warm or angry.'
      - 'The trap is C, the pattern of rhymes. That is the rhyme scheme, part of the poem''s form, not its attitude.'
    hint: 'Think of ''tone of voice''. Is it about the sound pattern, or about the speaker''s feeling?'
    why:
      B: 'The number of stanzas is part of the poem''s form, not its tone.'
      C: 'The pattern of rhymes is the rhyme scheme, part of the form, not the attitude.'
      D: 'The place where the poem is set is its setting, not its tone.'

  23:
    answer: B
    steps:
      - 'This is about the title of Owonibi''s poem, Homeless, not Hopeless.'
      - 'A title often states the poem''s main idea. This one sets two words against each other: the people are ''homeless'', but ''not hopeless''.'
      - 'The two words look and sound almost alike, so the contrast is sharp: the street beggars have lost their homes, yet they still have hope.'
      - 'This matters because the title tells us the attitude of the poem before we read a line: it sees the poor with dignity, not only with pity.'
      - 'Remember: a beggar under a Lagos bridge may have no roof, but he can still dream of tomorrow.'
      - 'The trap is A, lost both their homes and their hope. That ignores the word ''not'', which is the heart of the title.'
    hint: 'Read the title slowly. Which word does ''not'' go with?'
    why:
      A: 'The title says ''not hopeless'', so they have not lost their hope.'
      C: 'The title says they are homeless, so they do not have homes.'
      D: 'The title calls them homeless; it says nothing of new homes.'

  24:
    answer: A
    steps:
      - 'This is about the poet Syl Cheney-Coker, whose poem Myopia is among the set poems.'
      - 'Syl Cheney-Coker is a poet from Sierra Leone. He was born in Freetown in 1945.'
      - 'His poems often speak of the pain and history of his country, and of Africa''s troubles.'
      - 'Knowing a poet''s country matters, because it helps us read the history and feelings behind the poems.'
      - 'Remember: Cheney-Coker, Creole Freetown, Sierra Leone.'
      - 'The trap is B, Kenya. That is the home of Jared Angira, another African poet often studied alongside him.'
    hint: 'Cheney-Coker was born in Freetown. Which country''s capital is that?'
    why:
      B: 'Kenya is the home of poets such as Jared Angira, not Cheney-Coker.'
      C: 'South Africa is the home of poets such as Dennis Brutus, not Cheney-Coker.'
      D: 'Ghana is the home of poets such as Kofi Awoonor, not Cheney-Coker.'

  25:
    answer: B
    steps:
      - 'This is about the poet Jared Angira.'
      - 'Jared Angira is a poet from Kenya, in East Africa, born in 1947.'
      - 'His poems, such as those in Silent Voices and Juices, speak of the poor and of injustice in Kenyan society.'
      - 'Knowing a poet''s country helps us read the world his poems come from.'
      - 'Remember: Angira, Kenya, both have the sound of East Africa; think ''Angira from Kenya''.'
      - 'The trap is A, Sierra Leone. That is the home of Syl Cheney-Coker, another African poet often studied alongside him.'
    hint: 'Jared Angira writes from East Africa. Which of these countries is in East Africa?'
    why:
      A: 'Sierra Leone is the home of Syl Cheney-Coker, not Angira.'
      C: 'South Africa is the home of Dennis Brutus, not Angira.'
      D: 'Ghana is the home of Kofi Awoonor, not Angira.'

  26:
    answer: A
    steps:
      - 'This is about the serenade, a kind of song that gives its name to the poem Serenade.'
      - 'A serenade is a love song sung or played at night by a lover, usually under the window of the beloved.'
      - 'A poem called Serenade takes the form of that song: a lover speaking tenderly to the one he loves, often at evening or night.'
      - 'Knowing the kind of poem matters, because it tells us what to expect: tenderness, longing and praise of the beloved.'
      - 'Remember: think of the young man in a Nollywood film singing with a guitar under a girl''s window at night.'
      - 'The trap is B, a song of mourning. That is a dirge or an elegy, which is sad, not loving.'
    hint: 'Think of a young man with a guitar under a window at night. What is he singing?'
    why:
      B: 'A song of mourning for the dead is a dirge or an elegy.'
      C: 'A long poem about the deeds of a hero is an epic.'
      D: 'A poem that mocks a person is a lampoon.'

  27:
    answer: D
    steps:
      - 'This is about apostrophe, the device Donne uses for the sun in The Sun Rising.'
      - 'Apostrophe is speaking directly to someone absent, or to a thing that cannot answer, as if it could hear.'
      - 'Donne''s lover opens by scolding the sun: ''Busy old fool, unruly sun, / Why dost thou thus, / Through windows, and through curtains call on us?'''
      - 'The effect is playful and bold: the lovers feel so important that they order the sun about and tell it to mind its own business.'
      - 'Remember: when you shout at the rain, ''Why now, of all days?'', you are using apostrophe.'
      - 'The trap is A, invocation. An invocation calls on a god or a muse for help; Donne is not asking the sun for help, he is scolding it.'
    hint: 'In the first line, who is the lover talking to?'
    why:
      A: 'An invocation calls on a god or muse for help; Donne scolds the sun, he does not pray to it.'
      B: 'Ellipsis leaves words out; it is not how the sun is shown.'
