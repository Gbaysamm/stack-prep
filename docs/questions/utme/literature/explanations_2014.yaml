      A: 'A tragicomedy is a whole play that mixes the serious and the comic, not one incident.'
      B: 'A tragic hero is the main character of a tragedy, brought down by a flaw.'
      C: 'A comedy is a whole play with a happy ending, not a funny moment inside a serious one.'

