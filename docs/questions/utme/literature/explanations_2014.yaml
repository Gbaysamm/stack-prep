    hint: 'Is a plot just one part of a story, or the way all its events are linked?'
    why:
      A: 'The resolution of conflicts is one stage near the end of a plot, not the plot itself.'
      B: 'Poetic justice is the rewarding of good and punishing of evil; it is not what plot means.'
      C: 'Character delineation is characterisation, how characters are drawn.'

