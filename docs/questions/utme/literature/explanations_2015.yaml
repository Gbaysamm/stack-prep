format_version: 1
exam_year: 2015
subject: LIT
explanations:
  1:
    answer: C
    steps:
      - 'This is about personification in John Donne''s The Sun Rising.'
      - 'Personification gives human qualities, feelings or actions to something that is not human.'
      - 'Donne calls the sun a ''busy old fool'' and ''unruly'', and asks why it calls on the lovers through windows and curtains. Only a person can be a fool, be unruly or come calling.'
      - 'The effect is comic and bold: the lovers scold the sun like a nosy old man who has walked into their room uninvited.'
      - 'Remember: if a thing in nature is spoken of as if it were a person, with a person''s habits and faults, it is personification.'
      - 'The trap is A, simile. There is no ''like'' or ''as'' here; the sun is not compared to a fool, it is called one and treated as one.'
    hint: 'Can the sun really be an old fool who calls on people? What does the poet turn it into?'
    why:
      A: 'There is no comparison with ''like'' or ''as''; the sun is treated as a person.'
      B: 'Diction is the poet''s choice of words in general, not a figure of speech.'
      D: 'A pun plays on two meanings of one word; no word here has a double meaning.'

  2:
    answer: D
    steps:
      - 'This is about allusion in Langston Hughes''s The Negro Speaks of Rivers.'
      - 'An allusion is a brief reference to a person, place or event that the reader is expected to know. It can be biblical, classical, literary or historical.'
      - 'Hughes''s speaker recalls bathing in the Euphrates, building a hut by the Congo, raising the pyramids above the Nile, and hearing the Mississippi sing when Abraham Lincoln went down to New Orleans.'
      - 'Each reference is to a moment in the history of black people, from the earliest civilisations to slavery in America. So the allusion is mainly historical.'
      - 'It matters because the rivers carry the long memory of a people: the speaker''s soul has grown as deep as the rivers.'
      - 'The trap is A, biblical. The Euphrates is named in the Bible, but the poem uses it as a cradle of early human history, not to retell a Bible story.'
    hint: 'List the rivers and the events the speaker remembers by them. Are they from the Bible, from Greek myth, or from the past of a people?'
    why:
      A: 'The rivers are not used to recall Bible stories but stages in the history of black people.'
      B: 'There is no reference to Greek or Roman myth or literature.'
      C: 'The poem does not refer to other books or writers.'

  3:
    answer: A
    steps:
      - 'This is about what sodium cyanide is, and so what image the poet calls up by naming it in Hard Lines.'
      - 'Sodium cyanide is a deadly poison. A very small amount can kill a person.'
      - 'When a poet names it, the word brings the idea of something deadly or destructive into the poem. That is how a concrete image works: the reader''s knowledge of the thing does the work.'
      - 'Remember: cyanide is the poison of crime stories and of illegal gold mining that kills fish in rivers. It is never sweet, sticky or fragrant.'
      - 'The trap is B, adhesive. A glue sticks things together; sodium cyanide is a white salt that poisons.'
    hint: 'What is sodium cyanide known for?'
    why:
      B: 'Sodium cyanide is not a glue; it is a poison.'
      C: 'It is not known for sweetness; its danger is that it kills.'
      D: 'It is not a perfume; it is a deadly poison.'

  4:
    answer: C
    steps:
      - 'This is about alliteration in the title of Owonibi''s poem Homeless, not Hopeless.'
      - 'Alliteration is the repetition of the same consonant sound at the beginning of words that are close together.'
      - 'Both ''Homeless'' and ''Hopeless'' begin with the same h sound, and they stand side by side in the title.'
      - 'The matching sound ties the two words together so that the difference between them stands out: without a home, but not without hope.'
      - 'Remember: alliteration is at the start, like ''Peter Piper picked'' or ''big brother Bola''.'
      - 'The trap is D, assonance. Assonance repeats vowel sounds inside words; here the repeated sound is the consonant h at the start.'
    hint: 'Say the two words aloud. Which sound comes first in both?'
    why:
      A: 'Rhyme matches the ending sounds of words; the point here is the matching first sound.'
      B: 'Onomatopoeia is a word that imitates a sound, like ''buzz''; neither word does.'
      D: 'Assonance repeats vowel sounds; the repeated sound here is the consonant h.'

  5:
    answer: A
    steps:
      - 'This is about the serenade, a kind of love song.'
      - 'A serenade is a love song sung or played at night, often beneath the window of the woman who is loved.'
      - 'The singer is a suitor, a man seeking the love of a woman, who hopes she will look out and accept him.'
      - 'A poem titled Serenade borrows this setting: a lover''s voice pleading in the evening.'
      - 'Remember: think of a young man with a guitar under a window at night. He is courting, so he is a suitor.'
      - 'The trap is D, passer-by. A passer-by does not stop to sing; the serenade is aimed at one beloved.'
    hint: 'Who stands under a window at night to sing a love song?'
    why:
      B: 'A mother sings a lullaby to her child, not a serenade to a lover.'
      C: 'A spinster is an unmarried woman; the serenade is sung to the beloved, traditionally by a man.'
      D: 'A passer-by has no beloved to court; the serenade is a suitor''s song.'

  6:
    answer: D
    steps:
      - 'This is about the word peasant, which protest poets use when they speak for the poor.'
      - 'A peasant is a poor farmer or farm worker of low social standing, who works the land, often land owned by others.'
      - 'When a poet such as Cheney-Coker speaks of peasants, he speaks for the poorest working people, set against the rich and the powerful.'
      - 'Knowing the word matters: protest poetry sets the peasant against the ruler, and you cannot read the poem''s anger without knowing whose side it is on.'
      - 'Remember: think of the poor farmer with a hoe on a small plot, not the man who owns the big farm.'
      - 'The trap is A, rich owners of large estates. They are the landlords the peasants often work for, the very opposite.'
    hint: 'Is a peasant rich or poor? Does he work the land or rule the country?'
    why:
      A: 'Rich landowners are the opposite of peasants, who are poor.'
      B: 'Politicians rule; peasants are the poor who are ruled.'
      C: 'City traders are not peasants; peasants work the land.'

  7:
    answer: B
    steps:
      - 'This is about the meaning of the title of Jared Angira''s poem Expelled.'
      - 'To be expelled is to be driven out or forced to leave a place, a school or a group.'
      - 'A title is the first clue to a poem''s subject. Expelled tells us at once that the poem deals with someone who has been put out.'
      - 'Remember: a student expelled from school is sent away for good. The word always means being driven out.'
      - 'The trap is A, welcomed home. That is the very opposite of being expelled.'
    hint: 'What happens to a student who is expelled?'
    why:
      A: 'Being welcomed home is the opposite of being expelled.'
      C: 'To be honoured is to be praised, not driven out.'
      D: 'Expelled has nothing to do with healing.'

  8:
    answer: C
    steps:
      - 'This is about enjambment in John Fletcher''s Upon an Honest Man''s Fortune.'
      - 'Enjambment is the running on of the sense and the grammar from the end of one line of verse into the next, with no pause at the line end.'
      - 'In the lines, the first ends with ''the soul that can'', and the sentence only completes itself with ''Render'' at the start of the next line. The reader must carry straight on.'
      - 'The effect is a smooth, flowing movement that carries the poem''s argument forward: the honest soul is master of its own fate.'
      - 'Remember: enjambment is like a sentence that steps over the edge of the line, the way a footballer runs on past the touchline.'
      - 'The trap is D, caesura. A caesura is a pause in the middle of a line, like the break after ''Man is his own star''; the question asks about the run over the line end.'
    hint: 'Read the end of the first line. Does the sense stop there, or does it need the next word?'
    why:
      A: 'Synecdoche puts a part for the whole; the question is about how the lines run on.'
      B: 'Antithesis sets opposites side by side; the question is about the line end.'
      D: 'A caesura is a pause inside a line, not a run-on across the line end.'

  9:
    answer: C
    steps:
      - 'This is about how rhythm is made in Sir Walter Raleigh''s The Soul''s Errand, also called The Lie.'
      - 'Rhythm in a poem is the beat and flow of its sounds. Repetition of words, line patterns and refrains is one of the strongest ways to build it.'
      - 'In the poem the speaker sends his soul to the court, the church, the rulers and others, and stanza after stanza repeats the same commands to tell them their faults, ending on the same refrain about giving them the lie.'
      - 'This repeated pattern sets up a steady, hammering beat, like a drum that strikes on every stanza, and drives home the charge against each false institution.'
      - 'Remember: a chorus that comes back in every verse of a song is what makes you tap your feet. The Lie works the same way.'
      - 'The trap is A, metaphor. The poem has images, but its rhythm comes from what keeps coming back, not from comparisons.'
    hint: 'Look at how each stanza ends. What comes back again and again?'
    why:
      A: 'Metaphors give images, but the poem''s beat comes from the repeated commands and refrain.'
      B: 'There is some alliteration, but it is not what drives the rhythm of the whole poem.'
      D: 'Antithesis sets opposites against each other; the rhythm comes from repetition.'

  10:
    answer: D
    steps:
      - 'This is about irony in the title of Umeh''s poem Ambassadors of Poverty.'
      - 'Irony is a contrast between what words lead us to expect and what is really meant or what is really so.'
      - 'An ambassador is an honoured envoy who represents a country, lives in comfort and is treated with respect. To be an ambassador of poverty joins that dignified title to want and lack.'
      - 'The clash makes us look twice: the poor are given a grand title, and the grand title is turned into a mockery of their condition.'
      - 'Remember: calling a hungry crowd ''ambassadors of poverty'' is like calling a pothole-filled road ''the express highway''. The name and the reality pull against each other.'
      - 'The trap is A, repetition. No word in the title is repeated.'
    hint: 'What do we expect of an ambassador? Does poverty fit that picture?'
    why:
      A: 'No word or sound in the title is repeated.'
      B: 'There is no comparison using ''like'' or ''as''.'
      C: 'The words do not begin with the same consonant sound.'

  11:
    answer: A
    steps:
      - 'This is about alliteration, a sound device.'
      - 'Alliteration is the repetition of the same consonant sound, usually at the start of words, in quick succession.'
      - 'For example, ''Peter Piper picked a peck of pickled pepper'' repeats the p sound again and again.'
      - 'Poets use it to make lines memorable and to echo their meaning: hard sounds for harshness, soft sounds for calm.'
      - 'Remember: alliteration and assonance both repeat sounds. Alliteration takes consonants, assonance takes vowels.'
      - 'The trap is D, assonance. Assonance repeats vowel sounds, as in ''the rain in Spain'', not consonants.'
    hint: 'The question says consonant. Which device repeats consonant sounds?'
    why:
      B: 'A pun plays on two meanings of a word, not on repeated sounds.'
      C: 'Onomatopoeia is a word that imitates the sound it names, like ''buzz'' or ''crash''.'
      D: 'Assonance repeats vowel sounds, not consonant sounds.'

  12:
    answer: A
    steps:
      - 'This is about the episodic plot.'
      - 'Aristotle called a plot episodic when its episodes or acts follow one another without probable or necessary sequence: one does not cause the next.'
      - 'In such a plot you could move a scene or remove it and the story would still stand, because the events are only strung together.'
      - 'It matters because a well-made plot, for Aristotle, links each event to the next by cause; the episodic plot is the weaker kind.'
      - 'Remember: an episodic plot is like a string of separate comedy skits with the same actors. Each episode stands on its own.'
      - 'The trap is C, linear. A linear plot runs in time order, and each event can still cause the next; episodic means the events are not linked.'
    hint: 'If the acts do not cause one another, each act is a separate what?'
    why:
      B: 'A simple plot has one line of action without a reversal; it is still connected.'
      C: 'A linear plot follows time order; it says nothing about events lacking a link.'
      D: 'A convoluted plot is twisted and complex, not merely unconnected.'

  13:
    answer: B
    steps:
      - 'This is about the flashback.'
      - 'A flashback is a scene or passage that goes back to events that happened before the present action of the story.'
      - 'In a play the action is broken off and an earlier scene is shown or recalled, so that the audience understands what is happening now.'
      - 'It matters because it fills in the past, explains motives and builds suspense without telling the story only in order.'
      - 'Remember: in a film, when the screen goes misty and we see the hero as a child, that is a flashback.'
      - 'The trap is C, interlude. An interlude is a short entertainment between the acts, not a return to the past.'
    hint: 'The technique looks back. Which word has ''back'' in it?'
    why:
      A: 'The climax is the turning point of highest tension, not a look back.'
      C: 'An interlude is a short piece between acts, not a recall of earlier action.'
      D: 'Catharsis is the release of pity and fear in the audience of a tragedy.'

  14:
    answer: B
    steps:
      - 'This is about what literary criticism does.'
      - 'Literary criticism is the analysis, interpretation and evaluation of literary works.'
      - 'A critic studies how a work is made, what it means and how well it succeeds, weighing its strengths as well as its weaknesses.'
      - 'It matters because criticism helps readers see more in a work and judge it fairly.'
      - 'Remember: in everyday talk, to criticise is to find fault. In literature, criticism is a full judgement, like a football analyst reviewing a whole match, not only the mistakes.'
      - 'The trap is A, find faults. That is the everyday meaning, but a critic looks at the good as well as the bad.'
    hint: 'Does a literary critic look only at what is wrong with a book?'
    why:
      A: 'Finding faults is only part of it; criticism weighs strengths too.'
      C: 'Comparing novels is one method, but criticism covers all kinds of works and more than comparison.'
      D: 'Discovering beauty is part of it, but criticism also analyses and judges.'

  15:
    answer: C
    steps:
      - 'This is about the aside, a dramatic technique.'
      - 'An aside is a short speech spoken by a character to the audience, or to himself, while other characters are on stage. By the rules of the stage, they do not hear it.'
      - 'It lets the audience in on a character''s true thoughts, often a secret plan, while the others stay in the dark.'
      - 'It matters because it creates dramatic irony: we know what the other characters do not.'
      - 'Remember: an aside is spoken to one side, like a whisper behind the hand.'
      - 'The trap is A, soliloquy. A soliloquy is a speech made by a character alone on stage; an aside is made with others present who do not hear.'
    hint: 'Other actors are on stage but do not hear. Is the speaker alone?'
    why:
      A: 'A soliloquy is spoken by a character alone on stage, not in front of others who fail to hear.'
      B: 'The chorus is a group that comments on the action for all to hear.'
      D: 'A solo is a piece sung or performed by one person; it is not this technique.'

  16:
    answer: A
    steps:
      - 'This is about the chorus in drama.'
      - 'In Greek drama the chorus was a group of singers and dancers who commented on the action and spoke to the audience.'
      - 'The chorus stands between the play and the audience: it explains what has happened, voices the feelings of the community and guides the audience''s response.'
      - 'It matters because it links the story on stage to the people watching it.'
      - 'Remember: a church choir sings together; a chorus in drama sings, dances and comments together.'
      - 'The trap is D, cast. The cast is all the actors in a play, not a special group that links play and audience.'
    hint: 'Which group in Greek drama sang, danced and commented on the action together?'
    why:
      B: 'A clown is one comic character, not a band of singers and dancers.'
      C: 'The playwright writes the play; he is not on stage.'
      D: 'The cast is all the actors, not the group that links play and audience.'

  17:
    answer: C
    steps:
      - 'This is about the eponymous character.'
      - 'An eponymous character is the one whose name is the title of the work.'
      - 'Hamlet in Shakespeare''s Hamlet, Othello in Othello and Macbeth in Macbeth are all eponymous characters.'
      - 'It matters because the title usually points to the character the work is built around.'
      - 'Remember: the word comes from Greek for ''giving one''s name''. The eponymous hero gives his name to the book.'
      - 'The trap is A, antagonist. The antagonist opposes the hero; he rarely gives the work its name.'
    hint: 'Think of Othello or Macbeth. What is a character called when the play is named after him?'
    why:
      A: 'The antagonist is the opponent of the hero, not the character in the title.'
      B: 'A round character is a fully developed one; that says nothing about the title.'
      D: 'A flat character is undeveloped; that says nothing about the title.'

  18:
    answer: B
    steps:
      - 'This is about poetic licence.'
      - 'Poetic licence is the freedom poets take to depart from the normal rules of grammar, word order, spelling or fact for the sake of rhyme, rhythm or effect.'
      - 'A poet may write ''o''er'' for ''over'' to keep the beat, or turn a sentence round to put the rhyme at the end of the line.'
      - 'It matters because readers should not mark such changes as mistakes; they are chosen for effect.'
      - 'Remember: a driver''s licence lets you drive; poetic licence lets the poet bend the rules of language.'
      - 'The trap is C, approval to compose poems. Nobody needs permission to write a poem; the licence is a freedom with language.'
    hint: 'Poets sometimes break grammar rules on purpose. What is that freedom called?'
    why:
      A: 'It has nothing to do with selling poems.'
      C: 'No approval is needed to write a poem; the licence is freedom with language.'
      D: 'An honour given to poets is an award, not poetic licence.'

  19:
    answer: A
    steps:
      - 'This is about the protagonist.'
      - 'The protagonist is the chief character of a play or novel, the one at the centre of the action.'
      - 'Okonkwo in Things Fall Apart and Santiago in The Old Man and the Sea are protagonists.'
      - 'It matters because the conflict of the story is usually built around the protagonist and the forces against him.'
      - 'Remember: ''proto'' means first. The protagonist is the first, or leading, actor in the story.'
      - 'The trap is C, antagonist. The antagonist is the one who opposes the protagonist.'
    hint: 'Which term has ''proto'', meaning first, in it?'
    why:
      B: 'Any performer is an actor; the term asked for names the leading character.'
      C: 'The antagonist opposes the leading character.'
      D: 'An actress is a female performer, not the leading role as such.'

  20:
    answer: D
    steps:
      - 'This is about the pastoral.'
      - 'A pastoral is a poem or other work that shows the simple life of the countryside, of shepherds and villagers, often with nostalgia, a longing for a happier past.'
      - 'It sets the peace and innocence of rural life against the noise and corruption of the town.'
      - 'Remember: a pastor is a shepherd, and the pastoral began as poems about shepherds. Think of a city worker dreaming of quiet evenings in his home village.'
      - 'The trap is C, epic. An epic is a long poem about the deeds of a great hero, not about simple village life.'
    hint: 'Which word comes from the Latin for shepherd?'
    why:
      A: 'A ballad is a song that tells a story, not a longing for village life.'
      B: 'A romance is a tale of adventure and love, often of knights.'
      C: 'An epic celebrates the great deeds of a hero, not simple village life.'

  21:
    answer: D
    steps:
      - 'This is about the attitude of a speaker in a short unseen extract.'
      - 'The speaker says that all people make decisions, and that sometimes they are wrong and sometimes right.'
      - 'This accepts mistakes as part of life. It is the kind of thing said to comfort someone who regrets a choice: do not blame yourself too much.'
      - 'So the speaker is reassuring, calming and encouraging the listener.'
      - 'Remember: think of a parent telling a child who failed an exam that everybody gets some things wrong. That is reassurance.'
      - 'The trap is C, pessimistic. The speaker admits that decisions can be wrong, but also that they can be right; there is no gloomy expectation of the worst.'
    hint: 'Is the speaker warning, worrying or comforting?'
    why:
      A: 'Nothing in the words shows fear.'
      B: 'The tone is calm, not excited.'
      C: 'The speaker balances wrong with right; there is no gloom.'

  22:
    answer: D
    steps:
      - 'This is about the mode of writing in the lines from Okot p''Bitek''s Song of Lawino.'
      - 'Descriptive writing paints a picture of a person, place or thing with details of how it looks.'
      - 'The lines give the woman''s neck as thin like a rope, long and skinny, and her face as sickly pale. Every word adds to a picture of how she looks.'
      - 'The details are chosen to make the woman look unattractive, so the description also carries mockery.'
      - 'Remember: if the words make you see the person, it is descriptive. If they tell what happened next, it is narrative.'
      - 'The trap is A, narrative. Narrative tells a story of events; nothing happens in these lines, they only show how someone looks.'
    hint: 'Do the lines tell a story, argue a point, or paint a picture?'
    why:
      A: 'No events are told; the lines only show how someone looks.'
      B: 'There is no argument or reasoning in the lines.'
      C: 'There is no dialogue or acting out; dramatic is not the mode here.'

  23:
    answer: B
    steps:
      - 'This is about the image of the laugh in Gabriel Okara''s Once Upon a Time.'
      - 'In the poem a father tells his son how people have changed. They no longer laugh from the heart.'
      - 'Now, he says, they only laugh with their teeth, while their cold eyes search behind his shadow. A laugh of the teeth alone is a show; the cold, searching eyes show what they really feel.'
      - 'So the lines express insincerity: a false face of friendliness hiding suspicion and self-interest.'
      - 'Remember: think of a smile that does not reach the eyes, like a salesman''s grin. The mouth says one thing, the eyes another.'
      - 'The trap is A, friendliness. The people seem friendly, but the poem shows that the friendliness is false.'
    hint: 'If someone laughs only with the teeth while the eyes stay cold, is the laugh real?'
    why:
      A: 'The friendliness is only on the surface; the cold eyes show it is false.'
      C: 'The lines show falseness and suspicion, not envy of another''s goods.'
      D: 'There is no feeling for another''s pain in a laugh of the teeth alone.'

  24:
    answer: C
    steps:
      - 'This is about a biblical allusion in the traditional Love Song.'
      - 'An allusion is a short reference to a person, place or event the reader is expected to know.'
      - 'In Christian belief, the Saviour is Jesus Christ. So ''the saviour''s image'' points to the picture of Christ, as found in the Bible and in Christian worship.'
      - 'In the lines, opening the beloved''s heart shows the saviour''s image there, so the allusion tells us what fills her heart.'
      - 'Remember: in a Nigerian church, ''our Saviour'' always means Jesus Christ.'
      - 'The trap is A, a hero of Greek myth. Greek myth has heroes like Hercules, but none is called the Saviour.'
    hint: 'Who is called the Saviour in Christian belief?'
    why:
      A: 'No hero of Greek myth is known as the Saviour.'
      B: 'A king of history is not what ''the saviour'' refers to.'
      D: 'The poet''s father is not called the saviour; the word points to Christ.'

  25:
    answer: C
    steps:
      - 'This is about the simile in Mrs Hardcastle''s complaint in Oliver Goldsmith''s She Stoops to Conquer.'
      - 'A simile is a direct comparison between two different things, made with ''like'' or ''as''.'
      - 'Mrs Hardcastle says their old mansion ''looks for all the world like an inn''. The house is compared to an inn, and the word ''like'' makes the comparison open.'
      - 'The simile sets up the joke of the play: later two young men really do take the Hardcastles'' house for an inn.'
      - 'Remember: spot the ''like'' or the ''as'', and you have found a simile.'
      - 'The trap is D, metaphor. A metaphor would say the house is an inn; here the word ''like'' makes it a simile.'
    hint: 'Find the little word that joins the house to the inn.'
    why:
      A: 'The words mean what they say; the comparison is plain, not ironic.'
      B: 'A euphemism softens something unpleasant; nothing is softened here.'
      D: 'A metaphor compares without ''like'' or ''as''; this comparison uses ''like''.'

  26:
    answer: A
    steps:
      - 'This is about personification in the phrase ''to appease the angry earth''.'
      - 'Personification gives human feelings or actions to something that is not human.'
      - 'The earth is called angry, and the people eat kola nuts together to appease it, to calm it as one would calm an offended elder. Only a person can be angry and be pacified.'
      - 'The figure fits the traditional world of the extract, where the land is treated as a living power that must be kept at peace.'
      - 'Remember: if the earth, the sun or the river is given a mood, a face or a voice, it is personification.'
      - 'The trap is D, metaphor. The earth is not said to be some other thing; it is given a human feeling, which is personification.'
    hint: 'Can the earth really be angry? What has the writer given it?'
    why:
      B: 'There is no comparison using ''like'' or ''as''.'
      C: 'Nothing is exaggerated for effect; the earth is given a human mood.'
      D: 'The earth is not called something else; it is given a human feeling.'

  27:
    answer: B
    steps:
      - 'This is about the mood of Mrs Hardcastle in her complaint in Oliver Goldsmith''s She Stoops to Conquer.'
      - 'Mood here means the speaker''s state of feeling, which we read from her words and tone.'
      - 'She mocks her husband''s talk of the fine old times, which he has repeated for many a long year, and complains that their house looks like an inn but they never see company.'
      - 'She is bored with life in the country and tired of her husband''s stories. Her mood is one of frustration.'
      - 'Remember: a wife who says ''you have been telling us of them for many a long year'' is not happy; she has had enough.'
      - 'The trap is C, regretful. Regret is sorrow for something one did; Mrs Hardcastle blames her dull life and her husband, she does not repent.'
    hint: 'Is Mrs Hardcastle pleased, hopeful or fed up with her life?'
    why:
      A: 'She looks forward to nothing in these lines; she complains.'
      C: 'She is not sorry for a wrong she did; she is annoyed with her dull life.'
      D: 'Her mockery and complaint show she is not happy.'

  28:
    answer: A
    steps:
      - 'This is about the speaker''s attitude in the lines from Okot p''Bitek''s Song of Lawino.'
      - 'Ridicule is making fun of a person to show them up as foolish or unattractive.'
      - 'The woman''s neck is likened to a rope, thin, long and skinny, and her face is called sickly pale. These are not kind words; each detail makes her look absurd.'
      - 'Lawino speaks in the voice of a village woman who mocks the copied foreign ways she sees around her, and ridicule is one of her strongest weapons.'
      - 'Remember: comparing someone''s neck to a rope is the kind of joke friends make at a market stall. It is mockery.'
      - 'The trap is C, anger. The words are mocking and amused, not furious.'
    hint: 'Is the speaker praising, warning, raging at or laughing at the woman?'
    why:
      B: 'Admonition is a gentle warning; the lines mock rather than advise.'
      C: 'The tone is mocking, not furious.'
      D: 'There is no pity in the description; it makes fun of her.'

  29:
    answer: B
    steps:
      - 'This is about the metaphor in William Blake''s Ah! Sun-flower.'
      - 'A metaphor describes one thing as if it were another, without ''like'' or ''as''.'
      - 'The sun does not walk, but Blake speaks of ''the steps of the Sun''. The sun''s daily journey across the sky is described as steps, and the sunflower, turning to follow it, seems to count them.'
      - 'The figure gives the poem its picture of longing: the flower follows the sun all day, wishing for the golden land where the journey ends.'
      - 'Remember: if a thing is called by another thing''s name with no ''like'', it is a metaphor. The sun''s path is called its steps.'
