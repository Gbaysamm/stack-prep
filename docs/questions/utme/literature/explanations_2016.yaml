format_version: 1
exam_year: 2016
subject: LIT
explanations:
  1:
    answer: D
    steps:
      - 'This is about Aloho, the young woman at the centre of Frank Ogodo Ogbeche''s Harvest of Corruption.'
      - 'Aloho is a jobless young graduate. Her friend Ochuole draws her into the circle of Chief Haladu Ade Amaka, a corrupt minister, and she is used to carry drugs for him.'
      - 'The speakers plan to "dangle this babe before the Chief for a price" and make her "run the errands while we pick the bucks". She is the bait and the courier, which is exactly what happens to Aloho.'
      - 'The moment matters because it shows the play''s theme: the powerful and their agents buy and use the young and desperate for money.'
      - 'Remember: Aloho is the one who is used; Ochuole is the one who leads her in.'
      - 'The trap is C, Ochuole. She belongs to the Chief''s circle and helps bring Aloho in, so she is not the new "babe" being offered.'
    hint: 'Who is the jobless girl newly brought to the Chief, and later used to carry his goods?'
    why:
      A: 'Ogeyi is not the girl the schemers offer to the Chief for a price.'
      B: 'Alice is not the young woman used as the Chief''s courier.'
      C: 'Ochuole already moves in the Chief''s circle and helps lure Aloho; she is not the one being dangled.'

  2:
    answer: B
    steps:
      - 'This is about tone and feeling, read straight from the words of the extract.'
      - 'A speaker''s feeling shows in the kind of sentences used: exclamations, cries to God and broken questions show strong emotion.'
      - 'Look at the words: "O! God forgive me" and "Is this a trap or what? God!" are cries of shock. "Poor girl!" and "this dangerous decision" show pity and worry for the girl.'
      - 'This matters in Harvest of Corruption because the play keeps showing ordinary people horrified at what corruption does to the young.'
      - 'Remember: count the exclamation marks and listen for "poor"; shock plus "poor girl" is pity.'
      - 'The trap is A, mocking amusement. A mocker laughs at the girl; this speaker begs God''s forgiveness and fears for her.'
    hint: 'What does someone feel who cries "God forgive me" and then says "Poor girl!"?'
    why:
      A: 'Nothing in the lines laughs at the girl; "Poor girl!" is pity, not mockery.'
      C: 'Repeated exclamations and cries to God are the opposite of calm indifference.'
      D: 'The speaker calls her decision "dangerous"; there is no joy in the lines.'

  3:
    answer: B
    steps:
      - 'This is the setting of Harvest of Corruption, the time and place where the action happens.'
      - 'The play is set in a modern, fictional African country, among government offices, hotels, police stations and courts.'
      - 'Its people include a Chief who is a government minister, his agents, jobless graduates and the police who try to catch them, so the world is a present-day African state ruled by corrupt officials.'
      - 'The setting matters because Ogbeche wants Nigerian readers to see their own society in it: the abuse of public office for private gain.'
      - 'Remember: a minister, a hotel and an airport tell you the play is modern and African.'
      - 'The trap is C, a fishing village before colonial rule. Some African plays are set there, but this one has ministers, police and airports.'
    hint: 'What kind of country has ministers, police stations and an airport?'
    why:
      A: 'There is no king or medieval court in the play; its ruler figures are modern public officials.'
      C: 'The play is about modern government corruption, not village life before colonial rule.'
      D: 'An American plantation is the world of slave narratives, not this Nigerian play.'

  4:
    answer: D
    steps:
      - 'This is a stage direction.'
      - 'A stage direction is an instruction printed in a play, usually in brackets or italics, telling the actor how to move or speak. It is not spoken aloud.'
      - 'In the extract, "(He says without looking up.)" is not part of what the character says. It tells the actor to speak without raising his eyes.'
      - 'It matters because it shows character: a man who dismisses a visitor without even looking up is busy, important in his own eyes and careless of others.'
      - 'Remember: words in brackets in a play are for the actor and the director, not the audience.'
      - 'The trap is A, an aside. An aside is spoken, to the audience, and the other characters do not hear it; these bracketed words are not spoken at all.'
    hint: 'Are the words in brackets said aloud, or do they tell the actor what to do?'
    why:
      A: 'An aside is a remark spoken to the audience that other characters do not hear; the bracketed words are never spoken.'
      B: 'A soliloquy is a long speech made alone on stage; this is a brief instruction.'
      C: 'A prologue is an opening speech or scene before the main action, not an instruction inside a line.'

  5:
    answer: C
    steps:
      - 'This is about Chief Haladu Ade Amaka, the corrupt minister in Harvest of Corruption.'
      - 'The Chief runs a drug business on the side, using young women such as Aloho to carry hard drugs abroad. That is smuggling: moving forbidden goods across borders secretly.'
      - 'The plot turns on it: Aloho is caught with drugs, and the police work to trace the trade back to the Chief.'
      - 'It matters because the play shows a man trusted with public office using it to cover crime, which is the "harvest of corruption" of the title.'
      - 'Remember: a minister using couriers at the airport is smuggling.'
      - 'The trap is A, child trafficking. The Chief exploits young women, but they carry his drugs; he does not sell children.'
    hint: 'What do the Chief''s couriers carry through the airport?'
    why:
      A: 'The young women are used as drug couriers, not sold; child trafficking is not the Chief''s crime.'
      B: 'Land grabbing plays no part in the Chief''s crimes in the play.'
      D: 'Election rigging is not what the Chief is charged with; his trade is in drugs.'

  6:
    answer: A
    steps:
      - 'This is a simile.'
      - 'A simile compares two different things directly, using "like" or "as".'
      - 'Othello looks at the dead Desdemona and says she is "Pale as thy smock", as pale as her white nightdress. The word "as" makes the comparison open.'
      - 'The simile makes us see her lifeless whiteness, and it hints at her innocence, which Othello now begins to understand.'
      - 'Remember: if you can see "like" or "as" joining the two things, it is a simile. "As black as charcoal" is a simile too.'
      - 'The trap is C, metaphor. A metaphor also compares, but it says one thing is the other, with no "like" or "as".'
    hint: 'Which small word joins "pale" to "thy smock"?'
    why:
      B: 'A pun plays on two meanings of one word; "pale as thy smock" has no double meaning.'
      C: 'A metaphor compares without "like" or "as"; here "as" is used.'
      D: 'A paradox is a statement that seems to contradict itself; there is no contradiction here.'

  7:
    answer: A
    steps:
      - 'This is Othello''s motive for killing Desdemona.'
      - 'Othello kills Desdemona because Iago has made him jealous. Iago convinces him that she is unfaithful with Cassio.'
      - 'Iago plants the handkerchief, Othello''s first gift to Desdemona, on Cassio, and Othello takes it as proof. Iago even warns him of jealousy, "the green-eyed monster", while feeding it, and it destroys him.'
      - 'This matters because jealousy is the tragic flaw that turns a noble general into a murderer.'
      - 'Remember: one handkerchief, one lie, one jealous husband.'
      - 'The trap is B, an insult to his race. Othello is mocked as a Moor, but he kills Desdemona because he believes she has betrayed him.'
    hint: 'What feeling does Iago work up in Othello with the handkerchief?'
    why:
      B: 'Othello faces racial insults, but he kills Desdemona because he believes she is unfaithful.'
      C: 'Brabantio accuses Othello of witchcraft, not Desdemona; she is never thought to be a witch.'
      D: 'Desdemona stays loyal to Othello to the end; she never seeks to go back to her father.'

  8:
    answer: B
    steps:
      - 'This is about Brabantio, Desdemona''s father, a senator of Venice.'
      - 'Brabantio opposes the marriage because Othello is a Moor, a Black African, and he cannot believe his daughter would choose him freely.'
      - 'He says she must have been bewitched to run "to the sooty bosom / Of such a thing as thou". Iago and Roderigo wake him with crude racial images to stir that anger.'
      - 'This matters because it shows the racial prejudice of Venice, which Iago later uses against Othello.'
      - 'Remember: Brabantio welcomed Othello as a guest, but not as a son-in-law.'
      - 'The trap is C. Roderigo had wooed Desdemona, but Brabantio had already turned him away; that is not why he opposes Othello.'
    hint: 'What does Brabantio keep saying about Othello''s colour and his "charms"?'
    why:
      A: 'Iago is a soldier; Brabantio never wants him for Desdemona.'
      C: 'Brabantio had already refused Roderigo; Roderigo''s wooing is not the reason he opposes Othello.'
      D: 'Desdemona''s age is never Brabantio''s complaint; he objects to Othello himself.'

  9:
    answer: C
    steps:
      - 'This is Othello''s last speech, at the end of Act 5.'
      - 'Othello has learnt that Desdemona was innocent. Under arrest, he asks the Venetians to report him truly, as "one that loved not wisely but too well".'
      - 'He begins "Soft you; a word or two before you go", reminds them "I have done the state some service", and at the end of the speech stabs himself and dies.'
      - 'It matters because the hero recovers some dignity in his final moments, as tragic heroes do.'
      - 'Remember: "Soft you" is the start of Othello''s goodbye to life.'
      - 'The trap is A, travelling. "Before you go" sounds like a journey, but it is the Venetians who will go; Othello is about to die.'
    hint: 'What does Othello do at the end of this speech?'
    why:
      A: 'It is the Venetian officers who will go; Othello is not travelling.'
      B: 'Othello is not ill; he is under arrest and about to take his own life.'
      D: 'The elopement happens at the start of the play; this speech is at the very end.'

  10:
    answer: A
    steps:
      - 'This is Brabantio, Desdemona''s father.'
      - 'In Act 1 he learns that his daughter has secretly married Othello and left his house at night.'
      - '"How got she out?" asks how she left his house. "Fathers, from hence trust not your daughters'' minds" is a warning only a father would give, and "charms" shows he thinks she was bewitched.'
      - 'It matters because his belief in "charms" shows that he cannot accept his daughter loving a Moor.'
      - 'Remember: only a father says "trust not your daughters".'
      - 'The trap is D, Roderigo. He is with Brabantio in this scene and is upset too, but he is not a father speaking of his own daughter.'
    hint: 'Who would speak of "your daughters" as a betrayed father?'
    why:
      B: 'Othello is the man accused here, not the one speaking against him.'
      C: 'Gratiano is Brabantio''s brother and appears later; he does not speak these lines.'
      D: 'Roderigo is present but has no daughter; these are a father''s words.'

  11:
    answer: C
    steps:
      - 'This is about Kabria, a central character in Amma Darko''s Faceless.'
      - 'Kabria works for MUTE, a non-governmental organisation that helps street children in Accra. Her husband is Adade.'
      - 'Her home life is shown alongside her work: Adade, their children Obea, Essie and Ottu, and her old car, Creamy.'
      - 'Her busy family life matters because it shows the strain on a working mother who still makes time for children who have no one.'
      - 'Remember: Kabria, Adade and Creamy, the family and its car.'
      - 'The trap is D, Ottu. Ottu is in Kabria''s family, but he is her son, not her husband.'
    hint: 'Who is the father of Obea, Essie and Ottu?'
    why:
      A: 'Kwei is not Kabria''s husband.'
      B: 'Kpakpo is not Kabria''s husband.'
      D: 'Ottu is Kabria''s son, not her husband.'

  12:
    answer: A
    steps:
      - 'This is Fofo, the fourteen-year-old street girl in Faceless.'
      - 'Fofo lives on the streets of Accra at Agbogbloshie. She has had to look after herself, so she has a child''s age but an adult''s toughness.'
      - 'The line "She was both a child and an adult and could act like both" sums her up: she is young and frightened, yet she bargains, survives and takes adult decisions.'
      - 'It matters because Darko shows how street life steals childhood, which is the novel''s main concern.'
      - 'Remember: Fofo is fourteen going on forty.'
      - 'The trap is B, Baby T. She is Fofo''s older sister, but she is already dead when the novel opens, so she is not the one acting "like both".'
    hint: 'Which young girl must survive the streets alone while still a child?'
    why:
      B: 'Baby T, Fofo''s sister, is found dead early in the novel; the description is of the living Fofo.'
      C: 'Odarley is Fofo''s friend, a minor figure; the description fits Fofo.'
      D: 'Obea is Kabria''s daughter, who has a home and a mother.'

  13:
    answer: C
    steps:
      - 'This is about Amma Darko, the author of Faceless.'
      - 'Amma Darko is a Ghanaian novelist, born in 1956.'
      - 'Faceless is set in Accra, Ghana''s capital, in the slum of Sodom and Gomorrah and the market at Agbogbloshie.'
      - 'Knowing her country helps you read the novel: its street children, NGOs and radio programmes are Ghanaian.'
      - 'Remember: Accra in the novel, Ghana for the writer.'
      - 'The trap is A, Germany. Darko once lived and worked in Germany, and her early novels were published in German, but she is Ghanaian.'
    hint: 'In which country''s capital is the novel set?'
    why:
      A: 'Darko lived in Germany for some years, but she is Ghanaian.'
      B: 'Nothing links Amma Darko to Scotland.'
      D: 'Darko is from Ghana, Nigeria''s West African neighbour, not Nigeria.'

  14:
    answer: B
    steps:
      - 'This is the theme of widowhood in Bayo Adebowale''s Lonely Days.'
      - 'The novel follows Yaremi, newly widowed in the Yoruba village of Kufi, as custom expects her to mourn in seclusion, be inherited by one of her husband''s kin and give up her own choices.'
      - 'The rites leave her cut off, watched and pressed to remarry against her will. The novel shows her pain, and the pain of other widows in the village, in detail.'
      - 'This matters because Adebowale is criticising a tradition that treats a widow as property. That criticism is the heart of the novel.'
      - 'Remember: the title says it: the days are lonely because of how the widow is treated.'
      - 'The trap is D. Yaremi shows great strength, but the rites put widows under the control of others; they do not let widows rule.'
    hint: 'Does the novel show widowhood rites as a blessing or a burden?'
    why:
      A: 'The rites are about mourning and control, not a celebration of wealth.'
      C: 'Lonely Days is set in a village; it does not mock city life.'
      D: 'The rites bring widows under the control of others; they do not make widows rulers.'

  15:
    answer: C
    steps:
      - 'This is the setting of Lonely Days.'
      - 'The novel is set in Kufi, a small Yoruba farming village in south-western Nigeria.'
      - 'Its life is village life: farms, markets, compounds, elders, and the customs that shape Yaremi''s widowhood.'
      - 'The setting matters because the traditional village is where the old widowhood customs are strongest.'
      - 'Remember: Kufi is to Yaremi what Umuofia is to Okonkwo, the village that holds the story.'
      - 'The trap is A, Lagos. It is in Nigeria, but Lonely Days stays in the village.'
    hint: 'Is Yaremi''s world a big city or a village?'
    why:
      A: 'Lagos is a city; the novel is set in the village of Kufi.'
      B: 'Accra is the setting of Amma Darko''s Faceless, not Lonely Days.'
      D: 'Chicago''s South Side is the setting of Richard Wright''s Native Son.'

  16:
    answer: A
    steps:
      - 'This is Yaremi, the heroine of Lonely Days.'
      - 'Yaremi is an ageing widow in Kufi. After her husband''s death she is left alone, and suitors and custom press on her.'
      - 'She refuses to be inherited as a wife, keeps her independence and bears her loneliness with quiet strength and dignity.'
      - 'She matters because she gives the novel''s criticism of widowhood a human face: a good woman made to suffer by custom.'
      - 'Remember: Yaremi is lonely, but never weak.'
      - 'The trap is D. A chief enforces customs, but Yaremi is the one who suffers under them, not the one who imposes them.'
    hint: 'Is Yaremi the one who suffers the rites, or the one who enforces them?'
    why:
      B: 'Yaremi is an older woman whose husband has died, not a bride.'
      C: 'Yaremi lives in the village of Kufi; she is not a rich city trader.'
      D: 'Yaremi suffers under the widowhood rites; she does not enforce them.'

  17:
    answer: B
    steps:
      - 'This is the moment after Mary Dalton''s death in Richard Wright''s Native Son.'
      - 'Bigger accidentally smothers Mary in her bedroom. In panic he carries her body down to the basement and burns it in the furnace.'
      - 'He tends that furnace as the Daltons'' chauffeur, which is how he knows it. Later, reporters gather in the basement, and the bones in the ashes give him away.'
      - 'It matters because the furnace becomes a symbol of the fear and hidden rage burning in Bigger.'
      - 'Remember: the furnace lives in the basement, and the basement holds the secret.'
      - 'The trap is C, the backyard. Bigger hides the body indoors, where his work as chauffeur takes him to the furnace.'
    hint: 'Where in the Dalton house is the furnace Bigger looks after?'
    why:
      A: 'The toilet is not where the body is burnt; the furnace is in the basement.'
      C: 'Bigger does not burn the body outside; he uses the furnace indoors.'
      D: 'A wardrobe cannot burn a body; the furnace in the basement does.'

  18:
    answer: A
    steps:
      - 'This is Jan Erlone, Mary Dalton''s boyfriend.'
      - 'Jan is a young white communist. On the night Bigger starts work, Mary and Jan make Bigger drive them, eat with them and drink with them.'
      - 'Bigger later tries to blame Mary''s disappearance on Jan, using his communist links, but Jan forgives Bigger and finds him a lawyer, Boris Max.'
      - 'Jan matters because his friendship shows a white man trying to see Bigger as a human being.'
      - 'Remember: Jan is the boyfriend; Max is the lawyer Jan brings.'
      - 'The trap is D, Max. Max defends Bigger in court; he is not Mary''s lover.'
    hint: 'Who is with Mary in the car on Bigger''s first night at work?'
    why:
      B: 'Buckley is the State''s Attorney who prosecutes Bigger.'
      C: 'Bigger is the Daltons'' chauffeur, not Mary''s lover.'
      D: 'Max is the lawyer who defends Bigger.'

  19:
    answer: D
    steps:
      - 'This is a rhetorical question.'
      - 'A rhetorical question is asked for effect, not to get an answer from anyone.'
      - 'Bigger asks himself "Suppose Mary had not burned? Suppose she was still there, exposed?" He does not expect a reply; the questions show his panic and fear.'
      - 'It matters because the questions take us inside Bigger''s frightened mind, which is how Wright makes us feel his terror.'
      - 'Remember: a question with no one to answer it is rhetorical, like a mother shouting "Do you want to kill me?"'
      - 'The trap is C, syntactical parallelism. The two sentences both start with "Suppose", but the device that drives them is the question asked of no one.'
    hint: 'Does Bigger expect anyone to answer these questions?'
    why:
      A: 'An apostrophe addresses someone absent or a thing; Bigger is talking to himself.'
      B: 'A euphemism softens a harsh idea; these lines state the danger plainly.'
      C: 'The two lines repeat "Suppose", but what marks them is that they are questions with no answer expected.'

  20:
    answer: D
    steps:
      - 'This is Bigger''s gang and its choice of victims in Native Son.'
      - 'The novel says the gang had always robbed Black people because it was easier and safer: white police seldom searched hard for those who robbed Black victims.'
      - 'They are afraid to rob Blum, a white shopkeeper, and the fear of that robbery splits the gang in Book One.'
      - 'It matters because it shows how racism shapes even crime: Black victims are left unprotected.'
      - 'Remember: they picked the easy target.'
      - 'The trap is B. Robbing anyone is a crime; the gang chose Black victims because the police cared less, not because it was legal.'
    hint: 'Why is robbing Blum, a white man, frightening to the gang?'
    why:
      A: 'Being of the same race does not explain robbing them; the gang''s reason was that it was easier.'
      B: 'Robbery is a crime whoever the victim; the gang only expected little police interest.'
      C: 'The gang''s reason, as the novel gives it, is that it was easier and safer, not the victims'' helplessness.'

  21:
    answer: A
    steps:
      - 'This is the theme of William Morris''s The Proud King.'
      - 'The proud king Jovinian boasts that he is like a god. God humbles him: an angel takes his place and his own people no longer know him.'
      - 'Only when he humbles himself and repents is he given back his throne.'
      - 'The poem matters because it warns that pride, or arrogance, goes before a fall.'
      - 'Remember: the title tells you the theme, proud means arrogant.'
      - 'The trap is D, achievement. The king is great and powerful, but the poem is about his pride, not praise of what he achieved.'
    hint: 'What does the word "proud" in the title tell you?'
    why:
      B: 'The king''s fault is pride in his power, not greed for more wealth.'
      C: 'Education plays no part in the king''s fall.'
      D: 'The poem condemns the king''s pride; it does not celebrate achievement.'

  22:
    answer: C
    steps:
      - 'This is personification.'
      - 'Personification gives an abstract idea or a lifeless thing the life, actions or feelings of a living being.'
      - 'In "The panic of growing older / spreads fluttering wings", panic, a feeling, is given wings and spreads them like a living bird.'
      - 'It makes the fear of age seem alive and restless, hovering over the poet year after year.'
      - 'Remember: if an idea does something only a living thing can do, it is personified, like "hunger is knocking at the door".'
      - 'The trap is B, simile. There is no "like" or "as" in the lines, so it is not a simile.'
    hint: 'Can a feeling really spread wings? What is the poet doing to it?'
    why:
      A: 'Onomatopoeia is a word that imitates a sound; no word here imitates a sound.'
      B: 'A simile uses "like" or "as"; there is neither in these lines.'
      D: 'An apostrophe addresses someone or something directly; the poet does not speak to panic.'

  23:
    answer: C
    steps:
      - 'This is Kofi Awoonor, the poet.'
      - 'Kofi Awoonor was a Ghanaian poet and diplomat, born in 1935 in the Volta Region.'
      - 'His poems draw on the Ewe dirge tradition of his people; he died in the Westgate Mall attack in Nairobi in 2013.'
      - 'Knowing he is Ghanaian helps you read his poems on African tradition and its meeting with the West.'
      - 'Remember: Kofi is a Ghanaian day name, for a boy born on Friday.'
      - 'The trap is D, Kenya. Awoonor died in Nairobi, but he was a Ghanaian.'
    hint: 'Kofi is a day name from which West African country?'
    why:
      A: 'Awoonor is not Cameroonian.'
      B: 'Awoonor is a West African poet, but from Ghana, not Nigeria.'
      D: 'Awoonor died in Kenya in 2013, but he was Ghanaian.'

  24:
    answer: D
    steps:
      - 'This is the symbol of the piano in Gabriel Okara''s Piano and Drums.'
      - 'A symbol is a thing that stands for an idea. In the poem the drums stand for simple, primal African life, and the piano stands for Western culture.'
      - 'The piano''s "tear-furrowed concerto" speaks "of complex ways" and is "lost in the labyrinth of its complexities", while the jungle drums sound "mystic rhythm" and simple, direct life.'
      - 'It matters because the persona is caught between the two, which is the conflict of the poem: the educated African torn between tradition and the West.'
      - 'Remember: drums are simple, piano is complex.'
      - 'The trap is B. The persona feels confused, but the complexity belongs to the piano, the West, not to Africa.'
    hint: 'Which instrument speaks "of complex ways"?'
    why:
      A: 'The poem sets two cultures side by side; it does not say the West is superior.'
      B: 'Africa is shown by the simple drums; complexity is the piano''s, the West''s.'
      C: 'The piano''s music is complex, not simple.'

  25:
    answer: B
    steps:
      - 'This is rhyme scheme.'
      - 'A rhyme scheme is the pattern of rhyme at the ends of lines, marked with letters: the same letter for lines that rhyme.'
      - 'The line endings are "asleep" (a), "foam" (b), "deep" (a), "home" (b), so the pattern is a b a b.'
      - 'The alternating rhyme rocks like the tide the poem describes, carrying the speaker gently out to sea, which is death.'
      - 'Remember: mark only the last word of each line, then give the first new sound a, the next b.'
      - 'The trap is D, a a b b. That would need "asleep" to rhyme with "foam", which it does not.'
    hint: 'Write the last word of each line. Which ones sound alike?'
    why:
      A: 'a b b a needs "foam" to rhyme with "deep"; it rhymes with "home".'
      C: 'a b c d means no rhymes, but "asleep" and "deep" rhyme, and so do "foam" and "home".'
      D: 'a a b b needs "asleep" to rhyme with "foam"; it does not.'

  26:
    answer: C
    steps:
      - 'This is metaphor.'
      - 'A metaphor speaks of one thing as if it were another, with no "like" or "as".'
      - 'In The Pulley, God has "a glass of blessings standing by" and pours them on man. In these lines beauty "flowed" out, as though it were a liquid poured from the glass.'
      - 'The metaphor makes God''s gifts real and visible: we see them poured out one after another until God stops before the last one, rest.'
      - 'Remember: if a gift flows like water but nobody says "like", it is a metaphor.'
      - 'The trap is A, personification. A liquid is not a person; giving beauty the nature of a liquid is metaphor.'
    hint: 'What does "flowed" turn beauty into: a person or a liquid?'
    why:
      A: 'Personification gives human qualities; "flowed" makes beauty a liquid, not a person.'
      B: 'A paradox is a statement that seems to contradict itself; nothing here is contradictory.'
      D: 'Antithesis sets opposite ideas side by side; strength, beauty and wisdom are not opposites.'

  27:
    answer: C
    steps:
      - 'This is the theme of William Blake''s The School Boy, from Songs of Experience.'
      - 'The boy loves summer mornings, the birds and the fields, but "to go to school in a summer morn, / O! it drives all joy away".'
      - 'He asks, "How can the bird that is born for joy / Sit in a cage and sing?" The cage is the school; the bird is the child.'
      - 'It matters because Blake attacks a rigid schooling that crushes a child''s freedom, and he warns parents that nipped buds cannot bear fruit.'
      - 'Remember: the caged bird is the schoolboy.'
      - 'The trap is A, laziness. The boy is not lazy; he loves to learn from nature, and it is the dull classroom that kills his joy.'
    hint: 'In the poem, what is the cage, and who is the bird?'
    why:
      A: 'The boy is not lazy; the poem blames the school, not the child.'
      B: 'The boy loves summer; the poem praises summer and criticises school.'
      D: 'The poem does not attack fathers for sending children to farm; it pleads with parents about school.'

  28:
    answer: C
    steps:
      - 'This is the language, or tone, of the persona in Birago Diop''s Vanity.'
      - 'Imploring language begs and pleads, often through repeated, anxious questions.'
      - 'The persona asks "What eyes will watch our large mouths" twice. The repeated question pleads for someone to listen to "our torments".'
