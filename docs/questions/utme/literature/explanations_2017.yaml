format_version: 1
exam_year: 2017
subject: LIT
explanations:
  1:
    answer: C
    steps:
      - 'This is about Aloho, the young woman at the centre of Frank Ogodo Ogbeche''s Harvest of Corruption, and what her fate teaches.'
      - 'Aloho wants a quick way out of joblessness. She is drawn into the circle of Chief Haladu Ade Amaka and used to carry drugs, and she is caught.'
      - 'The title says it all: corruption is a seed, and what it yields at harvest is ruin. Aloho reaps what was sown, and so, in time, do those who used her.'
      - 'The play warns young readers that easy money through crime leads to punishment, not to reward.'
      - 'Remember: "harvest" means you reap what you sow.'
      - 'The trap is D, injustice. Aloho is used by people more powerful than she is, but her arrest follows from what she chose to do, so the play presents it as punishment.'
    hint: 'What does the word "harvest" in the title suggest about wrongdoing?'
    why:
      A: 'Aloho gains nothing lasting from her crime; it ruins her.'
      B: 'Her arrest is the opposite of a blessing; it is the price of her choice.'
      D: 'She is exploited, but her fall comes from her own wrongdoing, so the play treats it as punishment.'

  2:
    answer: D
    steps:
      - 'This is about the type of work Harvest of Corruption is.'
      - 'Satire is writing that exposes and ridicules vice or folly in society, in order to correct it.'
      - 'The play holds up corrupt officials, drug barons and greedy young people to scorn. Chief Haladu Ade Amaka uses his office and young women like Aloho to enrich himself.'
      - 'By laughing at and condemning this corruption, Ogbeche aims to shame society into changing. That aim is the mark of satire.'
      - 'Remember: satire is a mirror held up to society''s faults, the way a Nigerian cartoonist mocks a politician to make a point.'
      - 'The trap is C, fable. A fable also teaches a moral, but it is a short tale, usually with animals that talk; Harvest of Corruption is a full play about real human vices.'
    hint: 'Does the play mock and expose wrongdoing in society, or tell a short tale with talking animals?'
    why:
      A: 'Dramatic irony is a device inside a play, when the audience knows what a character does not; it is not the type of the whole play.'
      B: 'An allegory carries a hidden second meaning through symbolic characters; this play attacks corruption openly.'
      C: 'A fable is a short moral tale, usually with animals; this is a full play exposing human vice.'

  3:
    answer: D
    steps:
      - 'This is about how public office is treated in Harvest of Corruption.'
      - 'The play''s main theme is corruption: the misuse of public office for private gain.'
      - 'Officials like Chief Haladu Ade Amaka use their positions and connections to make money for themselves, including through drug smuggling, instead of serving the people.'
      - 'This shows the rot the play attacks: an office meant to serve becomes a way to grab public money.'
      - 'Remember: the title is about corruption, so the officials are the corrupt ones.'
      - 'The trap is C, a duty to serve hardworking youths. That is what government office should be, but the play shows officials doing the opposite, and exploiting young people.'
    hint: 'The play''s title names the vice. What do corrupt officials do with public money?'
    why:
      A: 'The officials do not see office as a waste of time; they find it very profitable.'
      B: 'Hard work is not their concern; they use office to enrich themselves.'
      C: 'Serving the youth is the ideal, but the officials exploit young people instead.'

  4:
    answer: B
    steps:
      - 'This is about the attitude a speaker shows in an extract from Harvest of Corruption.'
      - 'An attitude is the way a speaker feels towards a person or subject, and we read it from the speaker''s own words.'
      - 'The speaker groans "En! En! En! You have come again", then says "I am not always comfortable when you start dishing out this you born again stuff".'
      - '"You have come again" shows weariness at hearing the same thing, and "not always comfortable" and "dishing out" show the speaker dislikes being preached to.'
      - 'Remember: "En! En! En!" is the sound of someone saying "here we go again", like a friend rolling their eyes at a sermon.'
      - 'The trap is C, fear. The speaker is uncomfortable, but nothing in the words suggests being afraid; it is impatience, not fear.'
    hint: 'What does "You have come again" tell you about how the speaker feels?'
    why:
      A: 'The speaker mocks the "born again stuff", which is the opposite of admiration.'
      C: 'Discomfort here means irritation at being preached to, not fear.'
      D: 'The speaker is irritated, not sorrowful; there is no grief in the words.'

  5:
    answer: C
    steps:
      - 'This is about Ochuole, Aloho''s friend in Harvest of Corruption.'
      - 'A character is judged by what she does. Ochuole knows the Chief''s world of easy money and draws Aloho into it.'
      - 'She leads her friend from honest job-seeking into the Chief''s corrupt circle, where Aloho is used and ruined.'
      - 'Someone who leads others into wrongdoing is mischievous and corrupting, a bad influence.'
      - 'Remember: show me your friend and I will tell you who you are.'
      - 'The trap is A, too sophisticated. Ochuole may seem stylish and worldly, but the danger she poses is moral, not her sophistication.'
    hint: 'What does Ochuole do to her friend Aloho?'
    why:
      A: 'Her worldliness is not the problem; her corrupting influence is.'
      B: 'Pride is not what marks her; she leads others into wrongdoing.'
      D: 'Being born-again would be a good influence, the opposite of what Ochuole is.'

  6:
    answer: A
    steps:
      - 'This is Brabantio, Desdemona''s father, speaking to the Duke in Act 1 Scene 3 of Othello.'
      - 'Brabantio cannot believe his daughter would freely marry Othello, so he suspects witchcraft.'
      - 'He says she is "abused, stol''n from me, and corrupted / By spells and medicines bought of mountebanks". Mountebanks are quack sellers of potions.'
      - 'His suspicion shows his prejudice against Othello and prepares us for how easily suspicion grows in this play.'
      - 'Remember: the father cries "juju", as a Nigerian parent might say a suitor has "charmed" his daughter.'
      - 'The trap is C, Othello''s suspicion. Othello''s suspicion of Desdemona comes later and is about Cassio, not about spells.'
    hint: 'Whose daughter has been "stol''n", and what does he blame?'
    why:
      B: 'Iago''s distrust of Emilia is a different matter; these lines are about a daughter stolen by spells.'
      C: 'Othello later suspects Desdemona of loving Cassio, not of being bewitched.'
      D: 'Cassio has no quarrel with Iago in this speech; it is a father''s complaint.'

  7:
    answer: C
    steps:
      - 'This is about the first recorded performance of Shakespeare''s Othello.'
      - 'Court records show Othello was played on 1 November 1604 in the Banqueting House at Whitehall Palace, London, before King James I.'
      - 'Shakespeare''s company, the King''s Men, often performed at court as well as at their public playhouse, the Globe.'
      - 'This dates the play to about 1603 to 1604, in Shakespeare''s great period of tragedy.'
      - 'Remember: Whitehall for the King, 1604.'
      - 'The trap is D, a London theatre. The play was later staged at the Globe, but the first recorded performance was at Whitehall Palace.'
    hint: 'Shakespeare''s company was the King''s Men. Where would they play for the King?'
    why:
      A: 'There were no stadium performances of Shakespeare in 1604; this is far from the record.'
      B: 'Manchester has no link to the first recorded performance.'
      D: 'The Globe staged the play later; the first recorded performance was at court in Whitehall.'

  8:
    answer: A
    steps:
      - 'This is Desdemona speaking to Emilia in Act 4 Scene 3 of Othello, the willow scene.'
      - 'Emilia has laid Desdemona''s wedding sheets on the bed as she asked.'
      - 'Desdemona answers "If I do die before thee, prithee, shroud me / In one of those same sheets." A shroud is the cloth a body is buried in.'
      - 'Her words foreshadow her death on that same bed that night, which makes the scene full of dread for the audience.'
      - 'Remember: wedding sheets become a shroud.'
      - 'The trap is C, Iago to Emilia. Emilia is the listener, but it is her mistress Desdemona, not her husband, who asks to be shrouded.'
    hint: 'Who sleeps in the wedding sheets, and who has just laid them on the bed?'
    why:
      B: 'Othello never asks Iago to shroud him; this is a woman speaking to her maid.'
      C: 'Iago does not talk of wedding sheets or of being shrouded.'
      D: 'Cassio and Bianca are not in this scene.'

  9:
    answer: B
    steps:
      - 'This is Othello speaking to Iago in Act 1 Scene 2, when Iago warns him that Brabantio is furious.'
      - 'Othello is calm. He says "Let him do his spite", meaning Brabantio can do his worst.'
      - '"My services which I have done the signiory / Shall out-tongue his complaints": his service to the Venetian state will speak louder than Brabantio. He adds that he comes "From men of royal siege", royal birth.'
      - 'The speech shows Othello at his best: confident, dignified and secure in his worth, which makes his later fall more tragic.'
      - 'Remember: the general who served the state is the one who boasts of service.'
      - 'The trap is A, Brabantio. Brabantio is the "him" whose spite is dismissed; he is spoken about, not speaking.'
    hint: 'Who has done great "services" for the state of Venice?'
    why:
      A: 'Brabantio is the angry father being talked about, not the speaker.'
      C: 'Cassio has no reason to defend himself against Brabantio''s spite.'
      D: 'Iago is the listener here; he has stirred up Brabantio, he does not answer him.'

  10:
    answer: A
    steps:
      - 'This is Brabantio in Act 1 Scene 1 of Othello, just after he learns that Desdemona has gone.'
      - 'He cries "O heaven! How got she out? O treason of the blood!" Treason of the blood is betrayal by his own child.'
      - 'He warns other fathers not to trust their daughters, and asks if there are "charms" by which youth "May be abused?"'
      - 'His talk of charms sets up the witchcraft charge he will bring against Othello before the Duke.'
      - 'Remember: a father''s grief and a cry of charms, both Brabantio.'
      - 'The trap is D, Roderigo. Roderigo is with Brabantio in this scene, but he is the one who brings the news, not the grieving father.'
    hint: 'Who would call a daughter''s flight "treason of the blood"?'
    why:
      B: 'Othello is the man Desdemona has gone to; he does not mourn her leaving.'
      C: 'Gratiano is Brabantio''s brother and appears late in the play; this is the first scene.'
      D: 'Roderigo is present, but he did not lose a daughter.'

  11:
    answer: B
    steps:
      - 'This is an allusion.'
      - 'An allusion is a brief reference to a well-known person, place, event or text, often from the Bible, history or myth.'
      - 'In Amma Darko''s Faceless, the slum in Accra where street children like Fofo live is called Sodom and Gomorrah. In the Bible, Sodom and Gomorrah were cities destroyed for their wickedness.'
      - 'The name tells us at once that the place is full of vice and danger, without long description.'
      - 'Remember: allusion points to something the reader already knows, like calling a lazy man "Jonah".'
      - 'The trap is C, synecdoche. Synecdoche uses a part for the whole; here a famous outside name is borrowed, which is allusion.'
    hint: 'Where do the names Sodom and Gomorrah first come from?'
    why:
      A: 'A mixed metaphor joins two clashing images; this is a single borrowed name.'
      C: 'Synecdoche uses a part for the whole, such as "hands" for workers.'
      D: 'A euphemism softens an unpleasant fact, but this name makes the place sound worse, not gentler.'

  12:
    answer: B
    steps:
      - 'This is the central concern of Amma Darko''s Faceless.'
      - 'The novel follows street children in Accra, such as Fofo and her sister Baby T, and asks how they came to be there.'
      - 'Their mother, Maa Tsuru, fails to care for and protect them, so they end up on the streets, where Baby T is abused and killed.'
      - 'Darko lays the blame on irresponsible, negligent parenthood, and calls society to take responsibility for these "faceless" children.'
      - 'Remember: the children are faceless because their parents looked away.'
      - 'The trap is A, stubborn children. Fofo is tough and streetwise, but the novel shows her as a victim of neglect, not as a stubborn child.'
    hint: 'Who does the novel blame for the children ending up on the street?'
    why:
      A: 'The children are shown as victims, not as stubborn.'
      C: 'Politicians are not the focus; the novel is about families and street children.'
      D: 'Friends matter little here; the root cause is the parents'' neglect.'

  13:
    answer: B
    steps:
      - 'This is about Fofo, the young girl at the heart of Amma Darko''s Faceless.'
      - 'Fofo is a street girl in Accra. She has run away from a home where her mother, Maa Tsuru, neglected her and her siblings.'
      - 'On the streets she must fend for herself and face daily danger, and the search for her dead sister Baby T''s story drives the plot.'
      - 'Through Fofo, Darko gives a face to the "faceless" children of the streets.'
      - 'Remember: Fofo is the face of the faceless.'
      - 'The trap is C, a journalist. Journalists and social workers, like Kabria, help Fofo, but she is the child they are helping.'
    hint: 'Is Fofo the one who helps, or the one who needs help?'
    why:
      A: 'Fofo comes from a poor, neglectful home, not a rich one.'
      C: 'Fofo does not write about the slums; she lives in them.'
      D: 'The social workers help Fofo; she is not one of them.'

  14:
    answer: A
    steps:
      - 'This is about what the title of Bayo Adebowale''s Lonely Days points to.'
      - 'The novel tells the story of Yaremi, a widow in the village of Kufi, after the death of her husband.'
      - 'Her days are lonely: she is left without her husband, bound by widowhood customs and set apart from the life she knew.'
      - 'The title turns her private loneliness into the novel''s theme, the plight of widows in a traditional society.'
      - 'Remember: lonely days are a widow''s days.'
      - 'The trap is C, a prisoner. Yaremi''s customs do confine her, but she is a widow in her village, not a prisoner in jail.'
    hint: 'Who is the novel about, and what has she just lost?'
    why:
      B: 'The novel is set in a village, not on a trader''s travels abroad.'
      C: 'Yaremi is confined by custom, not held in a city jail.'
      D: 'The novel is about an older widow, not a child at school.'

  15:
    answer: D
    steps:
      - 'This is about whom the customs of Kufi press hardest in Bayo Adebowale''s Lonely Days.'
      - 'The novel is about widowhood. Yaremi and the other widows of Kufi must mourn, obey and accept what custom decides for them.'
      - 'The rites and the pressure to be inherited by a husband''s relatives fall on the widows, not on the other women of the village.'
      - 'Adebowale uses the widows'' suffering to question customs that strip women of their freedom.'
      - 'Remember: the novel''s subject is in its heroine, Yaremi the widow.'
      - 'The trap is C, traders. Women of Kufi trade in the market, but trade is not what the customs punish; widowhood is.'
    hint: 'What has happened to Yaremi that brings the village''s customs down on her?'
    why:
      A: 'Singing is not what brings the weight of custom on the women.'
      B: 'Farming is ordinary village work, not what the customs punish.'
      C: 'Trading is everyday work; the customs fall on the women whose husbands have died.'

  16:
    answer: A
    steps:
      - 'This is about what the widows of Kufi lose in Bayo Adebowale''s Lonely Days.'
      - 'When a woman''s husband dies in Kufi, custom pushes her to the edge: she must mourn as she is told, and her choices are made by others.'
      - 'Yaremi and the other widows lose the respected place a wife had in the community. That is a loss of dignity and status.'
      - 'This shared loss is what the novel protests against, and why Yaremi''s quiet strength matters.'
      - 'Remember: the widow loses her husband, and custom takes her standing too.'
      - 'The trap is B, wealth from trade. Widows may become poorer, but the loss the novel stresses is of respect and place.'
    hint: 'What does custom take from a woman once her husband is gone?'
    why:
      B: 'Poverty may follow, but the novel stresses the loss of respect and place.'
      C: 'Fame as singers has nothing to do with widowhood.'
      D: 'The widows of Kufi held no political office to lose.'

  17:
    answer: C
    steps:
      - 'This is descriptive writing.'
      - 'Descriptive writing paints a picture of a scene, a person or a thing, so the reader can see it.'
      - 'The opening of Richard Wright''s Native Son shows "Light flooded the room and revealed a black boy standing in a narrow space between two iron beds". We see the light, the boy, the narrow space and the beds.'
      - 'The picture of a cramped room introduces Bigger''s poverty and the crowded life of his family on the South Side of Chicago.'
      - 'Remember: if you can draw it, it is descriptive.'
      - 'The trap is A, narrative. The novel tells a story, but these lines stop to show a scene; their style is descriptive.'
    hint: 'Do the lines mainly tell what happens, or show what the room looks like?'
    why:
      A: 'Narrative style moves events along; these lines mainly paint the scene.'
      B: 'Dramatic style is dialogue and action as in a play; there is no speech here.'
      D: 'Expository writing explains an idea or gives information; these lines paint a picture.'

  18:
    answer: A
    steps:
      - 'This is about why Bigger kills Mary in Richard Wright''s Native Son.'
      - 'Bigger carries the drunk Mary to her room. Her blind mother, Mrs Dalton, comes in.'
      - 'Terrified that he, a Black man, will be found in a white girl''s bedroom, he presses a pillow over Mary''s face to keep her quiet, and smothers her.'
      - 'The killing grows out of fear, the fear that rules Bigger''s life in a racist society, which is why Book One is called "Fear".'
      - 'Remember: Book One is "Fear", and fear is why Mary dies.'
      - 'The trap is C, hatred. Bigger does feel hatred for white people, but at that moment he acts out of panic, not a plan to kill.'
    hint: 'What is Book One of the novel called?'
    why:
      B: 'Bigger is not envious of Mary at that moment; he is terrified of being caught.'
      C: 'Hatred is part of Bigger''s life, but the killing itself comes from panic.'
      D: 'He does not kill her because he distrusts her; he fears being discovered.'

  19:
    answer: A
    steps:
      - 'This is about the job Bigger takes with the Dalton family in Richard Wright''s Native Son.'
      - 'Mr Dalton, a rich white businessman, hires Bigger as the family chauffeur, to drive the family car.'
      - 'On his first night as chauffeur he drives Mary Dalton and Jan, which leads to Mary''s death.'
      - 'The job puts Bigger, a poor young Black man, into a rich white home, where his fear and anger come to a head.'
      - 'Remember: Bigger drives the car, and the car drives the plot.'
      - 'The trap is D, butler. Bigger works in the house too, tending the furnace, but he is hired to drive.'
    hint: 'On his first night at work, where does Bigger take Mary?'
    why:
      B: 'The Daltons have a cook, Peggy; Bigger is not hired to cook.'
      C: 'Bigger is not a gardener; he drives the car and tends the furnace.'
      D: 'He does some house work, such as the furnace, but he is hired as chauffeur.'

  20:
    answer: A
    steps:
      - 'This is irony in Mr Dalton''s character in Richard Wright''s Native Son.'
      - 'Irony is a gap between how things seem and how they really are.'
      - 'Mr Dalton gives money to Black charities and even gives ping-pong tables to a Negro boys'' club, so he seems a friend of Black people.'
      - 'But he also owns the South Side real estate company that rents crowded, rat-filled flats to Black families, like Bigger''s, at high rents.'
      - 'Wright shows that charity cannot make up for an unjust system that the giver profits from.'
      - 'Remember: he gives with one hand and takes the rent with the other.'
      - 'The trap is D, pays for Bigger''s lawyer. Bigger''s lawyer is Boris Max, who takes the case for the Communist side, not Mr Dalton.'
    hint: 'Who owns the run-down flat where Bigger''s family pays rent?'
    why:
      B: 'Mr Dalton employs Bigger, a Black servant, so this is untrue.'
      C: 'Mary lives in the Dalton home; she is not sent to the South Side.'
      D: 'Bigger''s lawyer, Boris Max, is not paid by Mr Dalton.'

  21:
    answer: A
    steps:
      - 'This is didactic poetry.'
      - 'A didactic poem is one written mainly to teach a moral or a lesson.'
      - 'In William Morris''s The Proud King, King Jovinian grows so proud he thinks himself greater than God. An angel takes his place, no one knows him, and he is humbled until he repents.'
      - 'The poem teaches that pride goes before a fall, and that power is a gift from God.'
      - 'Remember: didactic is like a teacher, there is always a lesson at the end, as in a Yoruba folktale.'
      - 'The trap is C, traditional. The story is old and told in a familiar way, but "traditional" does not name its purpose, which is to teach.'
    hint: 'What lesson does the king learn at the end?'
    why:
      B: 'A pastoral poem idealises shepherds and country life; this is about a king and his pride.'
      C: 'Traditional describes form or origin, not the poem''s teaching purpose.'
      D: 'A lyric expresses personal feeling; this poem tells a story to teach a lesson.'

  22:
    answer: C
    steps:
      - 'This is the image of the drums in Gabriel Okara''s Piano and Drums.'
      - 'To telegraph is to send a message over a distance. Talking drums in Africa really do carry messages.'
      - 'The speaker hears "jungle drums telegraphing / the mystic rhythm ... speaking of / primal youth and the beginning". The drums are "speaking".'
      - 'The drums stand for the speaker''s African roots, which call out to him with a message of his origins, before the piano of the West pulls him away.'
      - 'Remember: telegraph means message, like the talking drum announcing the oba''s arrival.'
      - 'The trap is B, only provide music. The drums do make music, but "telegraphing" and "speaking of" show they carry meaning.'
    hint: 'What does a telegraph do?'
    why:
      A: 'The rhythm is "urgent, raw" and lasting in his memory, not a passing mood.'
      B: '"Telegraphing" and "speaking of" show the drums do more than make music.'
      D: 'Nothing in the lines speaks of dancing; the drums send a message.'

  23:
    answer: B
    steps:
      - 'This is alliteration.'
      - 'Alliteration is the repetition of the same consonant sound at the beginning of words close together.'
      - 'In "the silent snake slid swiftly", the "s" sound starts four words in a row.'
      - 'Poets, including Gbemisola Adeoti, use it for music and emphasis; here the hissing "s" even sounds like the snake.'
      - 'Remember: "Peter Piper picked a peck" is alliteration, the same first sound again and again.'
      - 'The trap is A, pun. A pun plays on two meanings of a word; alliteration is about repeated sounds.'
    hint: 'Listen to the first sound of each word.'
    why:
      A: 'A pun plays on a double meaning, not on repeated first sounds.'
      C: 'A metaphor compares two things without "like" or "as".'
      D: 'A simile compares using "like" or "as".'

  24:
    answer: C
    steps:
      - 'This is the mood of the speaker in Alfred Tennyson''s Crossing the Bar.'
      - 'Mood here is the feeling the speaker shows towards his subject, which is his own death.'
      - 'He pictures death as a sea journey and asks for "no sadness of farewell". He ends "I hope to see my Pilot face to face / When I have crost the bar".'
      - 'The calm and the faith make the poem a comfort to readers facing death.'
      - 'Remember: Tennyson asked for this poem to close every collection of his work, as his last word of hope.'
      - 'The trap is A, pain. The subject is death, which many link with pain, but the speaker meets it calmly and with hope.'
    hint: 'Look at the last stanza. What does he "hope" for?'
    why:
      A: 'The speaker asks for "no moaning of the bar"; he is calm, not in pain.'
      B: 'There is no sign of frustration; he accepts death peacefully.'
      D: 'The poem is about facing death with faith, not about love.'

  25:
    answer: C
    steps:
      - 'This is a metaphor.'
      - 'A metaphor compares two things by saying one is the other, without "like" or "as".'
      - 'In George Herbert''s The Pulley, God has "a glass of blessings standing by" and says "pour on him all we can". Blessings are pictured as a liquid in a glass, poured out on man.'
      - 'The image makes God''s gifts seem rich and generous, and sets up the one blessing, rest, that God keeps back.'
      - 'Remember: blessings are not really a drink, so a "glass of blessings" is a metaphor.'
      - 'The trap is D, simile. There is a comparison, but there is no "like" or "as", so it is not a simile.'
    hint: 'Is there a "like" or "as" in the phrase?'
    why:
      A: 'Synecdoche uses a part for the whole; no part stands for anything here.'
      B: 'Blessings are not given human qualities; they are pictured as a liquid.'
      D: 'A simile needs "like" or "as", and there is none.'

  26:
    answer: B
    steps:
      - 'This is philosophical poetry.'
      - 'A philosophical poem reflects deeply on life''s big questions, such as time, death and the meaning of life.'
      - 'In Lenrie Peters''s The Panic of Growing Older, the speaker reaches thirty and feels panic as he weighs his ambitions against passing time and the approach of age.'
      - 'The poem invites readers to think about how they use their own years.'
      - 'Remember: philosophy thinks about life, and so does this poem.'
      - 'The trap is A, metaphysical. That word names a seventeenth-century school of poets, such as Donne, known for far-fetched comparisons called conceits.'
    hint: 'Is the poem thinking about life, mocking society, or using conceits like Donne''s?'
    why:
      A: 'Metaphysical poetry is the seventeenth-century school of Donne; this modern poem is reflective, not of that school.'
      C: 'The poem does not mock society; it reflects on the speaker''s own life.'
      D: 'It uses metaphors, but "metaphorical" names a device, not the kind of poem.'

  27:
    answer: B
    steps:
      - 'This is the rhetorical question.'
      - 'A rhetorical question is asked for effect, not for an answer, because the answer is clear.'
      - 'In William Blake''s The School Boy, the boy asks "How can the bird that is born for joy / Sit in a cage and sing?"'
      - 'The questions protest that school, like a cage, kills a child''s natural joy.'
      - 'Remember: a rhetorical question already knows its answer, like "Is water wet?"'
      - 'The trap is D, metaphor. The cage is a metaphor for school, but the device that stands out in the boy''s pleas is the question.'
    hint: 'Does the boy expect anyone to answer him?'
    why:
      A: 'An oxymoron joins opposite words, like "sweet sorrow"; that is not the vivid device here.'
      C: 'The boy means what he says; his words are not ironical.'
      D: 'The cage image is a metaphor, but the questions are the device that drives the poem.'

  28:
    answer: A
    steps:
      - 'This is personification.'
      - 'Personification gives human feelings or actions to something that is not human.'
      - 'In Gbanabam Hallowell''s The Dining Table, the speaker says "my boots have suddenly become too reluctant to walk me." Boots cannot feel reluctant or walk a person.'
      - 'Giving the boots a human unwillingness shows how heavy the speaker''s own steps have become.'
      - 'Remember: if a thing acts like a person, it is personification.'
      - 'The trap is D, alliteration. There is no run of repeated first sounds; the point is the human feeling given to boots.'
    hint: 'Can boots really feel "reluctant"?'
    why:
      B: 'Onomatopoeia is a word that sounds like its meaning, such as "buzz"; there is none here.'
      C: 'An oxymoron joins opposite words; "reluctant to walk" has no such pair.'
