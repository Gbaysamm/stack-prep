    answer: D
    steps:
    - This is a lampoon.
    - A lampoon is a poem or piece of writing that attacks and mocks a particular person.
    - 'The poem speaks straight to one person, "You", and insults his body: his head is "like a drum that is beaten for spirits" and his ears are "like the fans used for blowing fire".'
    - It matters because many African oral traditions have songs of abuse that mock a person in public, and these lines belong to that tradition.
    - 'Remember: a lampoon points its finger at one "you", like the mocking songs sung at someone during a festival.'
    - The trap is A, panegyric. A panegyric also speaks to a person, but it praises; these lines insult.
    hint: Is the poem praising this person or mocking him?
    why:
      A: A panegyric praises its subject; these lines mock him.
      B: A dirge is a song of mourning for the dead, not a mocking attack.
      C: An epic is a long poem about a hero's great deeds, not a short insult.
