    answer: B
    steps:
    - This is symbolism.
    - A symbol is an object that stands for something larger than itself.
    - In "The drum overwhelmed the guns", the drum stands for the noise of words, rumour and propaganda, and the guns for the real fighting. The noise of talk drowns the truth of the war.
    - It matters because the poem says the Nigerian Civil War made casualties of people far from the fighting, through the noise of words.
    - 'Remember: a drum calls and announces; a gun fights. When objects stand for more than themselves, that is symbolism.'
