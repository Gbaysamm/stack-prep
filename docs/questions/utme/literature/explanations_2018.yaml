  31:
    answer: C
    steps:
    - This is light verse.
    - Light verse is poetry written in a playful, humorous spirit, often about everyday things.
    - The persona grumbles at bed-bugs, calling them "you awful parasites" who "share with me this little bed", sucking blood from his "poor head". A small household nuisance is treated with mock seriousness.
    - It matters because the humour makes us laugh, and also makes us think about other "parasites" that feed on people.
    - 'Remember: light verse is a poem that smiles, even when the subject itches.'
    - The trap is A, limerick. A limerick is a particular five-line comic poem rhyming A A B B A; these lines do not have that shape.
    hint: Do these lines have the five-line shape of a limerick, or are they simply humorous verse?
    why:
      A: A limerick has five lines rhyming A A B B A; these lines do not follow that pattern.
      B: A lampoon attacks a particular person; this is a bed-bug, not a person.
      D: Light opera is a musical stage play, not a short poem.
