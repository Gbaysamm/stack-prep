format_version: 1
exam_year: 2018
subject: LIT
explanations:
  1:
    answer: B
    steps:
    - This is allegory.
    - An allegory is a story in which the characters and events stand for ideas or real things beyond themselves, so the whole story carries a second meaning under the first.
    - In George Orwell's Animal Farm the animals and their farm stand for the leaders and events of the Russian Revolution. In Bunyan's The Pilgrim's Progress a man called Christian travels through places like the Slough of Despond, which stand for stages of the Christian life.
    - It matters because allegory lets a writer teach a lesson, or criticise the powerful, through a story that seems simple on the surface.
    - 'Remember: an allegory is a story with a second story inside it, like the tortoise tale an elder tells to warn a greedy child without naming him.'
    - The trap is C, metaphor. A metaphor is one implied comparison in a line; an allegory carries its symbols through a whole work.
    hint: Is the question about one comparison in a line, or a whole story whose people stand for something else?
    why:
      A: Characteristics are the qualities of a character, not a kind of literary work.
      C: A metaphor is a single implied comparison, not a whole story built of symbols.
      D: Parallelism is the repeating of similar grammatical patterns, not a story of symbols.
  2:
    answer: B
    steps:
    - This is characterisation, a narrative technique.
    - 'Characterisation is the way a writer creates the people in a story and reveals them to the reader: by describing them, by what they say and do, and by what other characters say about them.'
    - When a novelist tells us a man's room is dirty, lets us hear him shout at his children, and shows a neighbour avoiding him, each detail reveals the character. That revealing is the characterisation.
    - It matters because we judge characters, and so the meaning of the story, through the way the writer presents them.
    - 'Remember: the characters are the people; characterisation is how the writer shows them to you, the way a Nollywood film shows you the villain long before anyone calls him one.'
    - The trap is C, characters and the way they behave. That names the characters themselves, not the technique by which they are revealed.
    hint: Is characterisation the people, or the writer's method of showing them?
    why:
      A: The writer's opinion of a character is only one thing that may show; characterisation is the whole method of revealing them.
      C: This names the characters and their actions, not the technique that reveals them to the reader.
      D: Readers are the audience of a novel; they are not part of how characters are presented.
  3:
    answer: A
    steps:
    - This is verbal irony.
    - Verbal irony is saying one thing while meaning the opposite. The speaker knows the real meaning lies under the words.
    - A student scores two out of fifty and his friend says "Brilliant result!" The words praise; the meaning mocks.
    - It matters because irony lets a writer criticise, mock or show feeling with a sting, and it asks the reader to look under the surface.
    - 'Remember: verbal irony lives in the words; the meaning is upside down, like calling a power cut "steady light".'
    - The trap is B. A character acting against the run of events, unaware of what the audience knows, belongs to dramatic or situational irony, not verbal irony.
    hint: When someone says "What lovely weather!" in a downpour, do they mean it?
    why:
      B: This points to dramatic or situational irony, where events turn against a character, not to irony in the words spoken.
      C: A situation that defies a logical resolution is a dilemma or a paradox, not verbal irony.
      D: Meaning exactly what one says is plain statement, the very opposite of irony.
  4:
    answer: A
    steps:
    - This is the aside, a dramatic technique.
    - An aside is a short speech a character makes to the audience while other characters are on stage. By the rule of the theatre, they do not hear it.
    - In Shakespeare's Othello, Iago watches Cassio take Desdemona by the hand and tells the audience "With as little a web as this will I ensnare as great a fly as Cassio." The others on stage hear nothing.
    - It matters because the aside lets the audience into a character's secret thoughts and plans, which builds dramatic irony.
    - 'Remember: an aside is a whisper to the audience behind the other characters'' backs.'
    - The trap is B, soliloquy. A soliloquy is also heard only by the audience, but the character speaks it alone on stage, and it is usually long.
    hint: Are the other characters still on stage when these words are spoken?
    why:
      B: A soliloquy is spoken by a character alone on stage, not in front of the others.
      C: Acoustics concern how sound carries in a theatre; it is not a kind of speech.
      D: Tone is the attitude in a speaker's voice, not a speech hidden from other characters.
  5:
    answer: B
    steps:
    - This is the definition of drama.
    - 'Drama represents a complete action by having actors perform it: they speak as the characters, move and gesture before an audience.'
    - In a play such as Othello, we do not read that Othello is jealous; an actor speaks his words, paces and strikes Desdemona in front of us.
    - 'It matters because this is what marks drama off from the other genres: prose tells a story through a narrator, and poetry works through rhythm and patterned language.'
    - 'Remember: drama is shown, not told, like a Yoruba travelling theatre troupe acting out the story in the village square.'
    - The trap is D, description and comment for silent reading. That is how prose works; drama is made to be performed.
    hint: In which genre do people act the story out instead of telling it?
    why:
      A: A single storyteller narrating to a reader is the method of prose fiction.
      C: Rhyme, rhythm, metre and stanzas are the tools of poetry.
      D: Description and comment for silent reading belong to prose, not to performance.
  6:
    answer: C
    steps:
    - This is metre.
    - Metre is the regular pattern of stressed and unstressed syllables in a line of poetry. It gives verse a steady beat.
    - 'Shakespeare''s "But soft, what light through yonder window breaks?" goes da DUM five times: an unstressed then a stressed syllable, repeated. That regular rhythm is iambic pentameter, a metre.'
    - It matters because a regular beat makes verse musical and memorable, and a break in the beat draws attention to a word.
    - 'Remember: metre is the poem''s drumbeat, as steady as the beat a talking drummer keeps under a praise song.'
    - The trap is B, assonance. Assonance repeats vowel sounds; it is about sound, not about a regular beat.
    hint: Which term means the measured beat of a line?
    why:
      A: Allegory is a story whose characters stand for ideas; it has nothing to do with rhythm.
      B: Assonance is the repetition of vowel sounds, not a regular rhythm.
      D: Onomatopoeia is a word that imitates a sound, like buzz or bang.
  7:
    answer: A
    steps:
    - This is drama, the genre that acts out human action.
    - 'From Aristotle on, drama has been described as an imitation of action: people on stage do what the characters do, in front of an audience.'
    - In a play, a quarrel is not described; two actors quarrel before us. That direct imitation is what drama is.
    - It matters because drama gives the audience the action at first hand, without a narrator in between.
    - 'Remember: prose tells, poetry sings, drama does.'
    - The trap is B, comedy. Comedy is a type of drama, not a genre beside it; the genre itself is drama.
    hint: Which of the three main genres puts people on a stage to act?
    why:
      B: Comedy is one type of drama, not the genre itself.
      C: Prose tells a story through narration; it does not act it out.
      D: Poetry expresses ideas and feeling in patterned language; it does not act out actions.
  8:
    answer: B
    steps:
    - This is the fable, a kind of prose story.
    - A fable is a short story, usually with a moral, in which animals, plants or things act and speak like people.
    - In Aesop's The Tortoise and the Hare, the slow tortoise beats the boastful hare, and the moral is that slow and steady wins the race.
    - It matters because fables teach a lesson in a form even a child remembers.
    - 'Remember: the tortoise tales of Yoruba and Igbo moonlight stories are fables, with the tortoise talking and scheming like a man.'
    - The trap is D, told in poetic form. Some fables are written in verse, but what makes a fable is its animal or object characters and its moral.
    hint: Who are the characters in the tortoise and the hare?
    why:
      A: Making allegations about characters is not the mark of any kind of story.
      C: Every story has a setting; it does not make a story a fable.
      D: A fable can be in prose or verse; its mark is animal or object characters with a moral.
  9:
    answer: D
    steps:
    - This is oxymoron.
    - An oxymoron places two words of opposite meaning side by side, so that contrasting ideas meet in one phrase.
    - Romeo cries "O brawling love, O loving hate". Love and hate, brawling and loving, are set right next to each other.
    - It matters because the clash shows a mixed or troubled state of mind in very few words.
    - 'Remember: "bitter sweet", "deafening silence", a "wise fool"; two opposites squeezed together make an oxymoron.'
    - The trap is A, euphemism. A euphemism is a soft word for a hard thing; it does not set two opposites together.
    hint: Which term means two opposite ideas placed together?
    why:
      A: A euphemism is a gentle word for something unpleasant, like "passed on" for died.
      B: Synecdoche uses a part for the whole, like "hands" for workers.
      C: Catharsis is the release of pity and fear an audience feels at a tragedy, not a figure of speech.
  10:
    answer: D
    steps:
    - This is caricature.
    - A caricature is a description or picture that exaggerates or distorts a person's striking features or habits to make the person look laughable.
    - A newspaper cartoonist draws a politician with an enormous belly and a tiny head. Nobody looks like that; the exaggeration is there to make us laugh at him.
    - It matters because caricature brings down the proud and the powerful through laughter.
    - 'Remember: caricature blows a feature up until it is funny, and the laughter is the point.'
    - The trap is B, expose. Exposing faults is the wider aim of satire; caricature's own aim is to ridicule by exaggeration.
    hint: What does a cartoonist want you to do when he draws a huge nose?
    why:
      A: Plain description is not exaggerated, and caricature always exaggerates.
      B: Exposure is the wider aim of satire; caricature's own aim is ridicule through exaggeration.
      C: Caricature does stress features, but stressing them is the means; the aim is to make them laughable.
  11:
    answer: A
    steps:
    - This is the killing of Mary Dalton in Richard Wright's Native Son.
    - Bigger carries the drunk Mary up to her bedroom. Her blind mother, Mrs Dalton, comes into the room.
    - Terrified that a Black man will be found in a white girl's bedroom, Bigger presses a pillow over Mary's face to keep her quiet, and smothers her without meaning to.
    - It matters because the novel shows how a racist society fills Bigger with fear, and fear drives his act.
    - 'Remember: the first part of Native Son is called "Fear", and that is why Mary dies.'
    - The trap is C, hatred. Bigger does hate the white world that hems him in, but this killing is an act of panic, not of planned hatred.
    hint: What is Bigger afraid of when the blind Mrs Dalton enters the room?
    why:
      B: Bigger does not kill Mary because he envies her; he panics.
      C: Bigger hates the white world, but he smothers Mary in panic, not out of hatred for her.
      D: Distrust plays no part; he is terrified of being discovered in her room.
  12:
    answer: B
    steps:
    - This is Bigger Thomas's job in Richard Wright's Native Son.
    - Mr Dalton, a rich white man, hires Bigger as the family's chauffeur, the driver of their car.
    - On his first night at work Bigger drives Mary Dalton out, and that duty brings him into her room when he helps her home.
    - It matters because the job puts Bigger inside a white household, the place where his fear and the white family's blindness meet.
    - 'Remember: Bigger drives the car, and the drive sets the whole story going.'
    - The trap is A, cook. The Daltons do have a cook, Peggy, but Bigger is hired to drive.
    hint: What does Bigger do for Mary on his first night at work?
    why:
      A: The Daltons' cook is Peggy; Bigger is hired to drive.
      C: Bigger is not a gardener; he drives the family car and tends the furnace.
      D: Bigger is not a butler; his job is to drive the family.
  13:
    answer: B
    steps:
    - This is about Mr Dalton's charity in Richard Wright's Native Son.
    - Hypocrisy is showing a goodness one does not really practise.
    - Mr Dalton gives ping-pong tables and money to help young Black people. Yet his own real-estate company rents crowded, rat-infested flats to Black families, Bigger's among them, at high rents. The money he gives away comes from the people he overcharges.
    - It matters because Wright shows that the rich man's kindness keeps the system that crushes Bigger in place.
    - 'Remember: a landlord who raises your rent and then sends you a Christmas gift is not being generous.'
    - The trap is A, selfless. The gifts look generous, but they cost him nothing he has not taken from the same families.
    hint: Where does the money for Mr Dalton's gifts come from?
    why:
      A: The gifts look generous, but he profits from the very families he claims to help.
      C: Mr Dalton changes nothing about the system; he gains from it.
      D: His gifts are public and well known; his kindness is not secret.
  14:
    answer: B
    steps:
    - This is about the title of Bayo Adebowale's Lonely Days.
    - A title often names the novel's central situation. Lonely Days follows Yaremi, a widow in the Yoruba village of Kufi, after her husband dies.
    - 'Her life as a widow is lonely: she mourns, she suffers the widowhood rites, and she is left to face her days without a husband.'
    - It matters because the novel uses one widow's lonely days to show the hardships tradition places on widows.
    - 'Remember: the lonely days are a widow''s days, as when a Nigerian widow sits out her mourning period cut off from the life of the town.'
    - The trap is A, the dry season. Kufi is a farming village, but the loneliness in the title is Yaremi's, not the land's.
    hint: Who is lonely in Lonely Days, and why?
    why:
      A: The loneliness in the title is Yaremi's as a widow, not a season's damage to farms.
      C: The novel is set in the village of Kufi, not in a city hospital.
      D: There is no soldier at war at the heart of Lonely Days; it is a widow's story.
  15:
    answer: C
    steps:
    - This is about Yaremi's character in Bayo Adebowale's Lonely Days.
    - In the tradition the novel shows, a widow may be inherited as a wife by a man from her late husband's family.
    - Yaremi turns these men away. She chooses to live on alone rather than be passed on like property.
    - It matters because her refusal shows the novel's challenge to customs that treat widows as things to be inherited.
    - 'Remember: a woman who says no to being inherited is saying she belongs to herself.'
    - The trap is B, fear of the village elders. Refusing a custom the elders uphold takes courage, not fear.
    hint: Does turning down a custom of the elders take fear or courage?
    why:
      A: Refusing to be inherited is not grabbing property; it is refusing to become someone's property.
      B: Standing against a custom the elders uphold takes courage, not fear.
      D: Her refusal is about her own dignity, not a wish to leave for the city.
  16:
    answer: A
    steps:
    - This is about the kind of work Lonely Days is.
    - Prose fiction is an invented story told in ordinary sentences and paragraphs; the novel is its main form.
    - Lonely Days tells an invented story about the widow Yaremi, in prose, through a narrator. It is a novel.
    - 'It matters because knowing the genre tells you how to read the work: look at plot, character, setting and point of view.'
    - 'Remember: a made-up story in paragraphs is prose fiction, from a short story to a long novel.'
    - The trap is B, autobiography. Lonely Days is about a widow's life, but it is invented and not the writer's own life story.
    hint: Is Lonely Days a true life story, a play, a poem or an invented story in paragraphs?
    why:
      B: An autobiography is a writer's true account of his own life; Lonely Days is an invented story.
      C: Lonely Days is written to be read, in paragraphs, not acted from a script.
      D: An epic poem is a long narrative in verse about heroic deeds; Lonely Days is in prose.
  17:
    answer: B
    steps:
    - This is the world of George Orwell's Nineteen Eighty-Four.
    - 'A totalitarian state is one where a single party controls every part of life: work, thought, love and even memory.'
    - Orwell wrote the novel in 1949 and set it in 1984, in Oceania, where Big Brother watches through telescreens, the Thought Police arrest people for their thoughts, and the Party rewrites the past.
    - 'It matters because the novel is a warning: this is the future that could come if power is never checked.'
    - 'Remember: "Big Brother is watching you" sums up a totalitarian future.'
    - The trap is A, a useless past. The Party does destroy and rewrite the past, but the novel itself pictures a future.
    hint: When is the novel set, and who controls everything there?
    why:
      A: The novel looks forward to a feared future; the past is only something the Party rewrites.
      C: Oceania is not unstable; it is held rigidly and permanently in the Party's grip.
      D: Oceania is ruled by fear, surveillance and constant war, not peace.
  18:
    answer: A
    steps:
    - This is about Winston Smith's hopes in George Orwell's Nineteen Eighty-Four.
    - 'Winston secretly longs for freedom: to think for himself, to love Julia, to know the truth, and to see the people rule instead of the Party.'
    - He writes "Freedom is the freedom to say that two plus two make four" in his diary, and he dreams the proles will one day rise. The Party's power crushes all of this.
    - It matters because the novel shows how total power destroys the very wish for freedom and democracy.
    - 'Remember: Winston''s diary is his small vote for freedom, and the Party takes even that.'
    - The trap is B, internal security. That is what the Party claims to provide, not what Winston dreams of.
    hint: What does Winston secretly want that the Party will not allow?
    why:
      B: Internal security is the Party's excuse for control, not Winston's dream.
      C: Winston dreams of truth and freedom, not of wealth.
      D: Sovereignty is a nation's independence; Winston's hopes are for personal freedom and the people's rule.
  19:
    answer: D
    steps:
    - This is Room 101 in George Orwell's Nineteen Eighty-Four.
    - Room 101 is the room in the Ministry of Love where a prisoner is made to face the thing he fears most.
    - For Winston it is rats. When the cage of rats is brought to his face, he breaks and betrays Julia.
    - 'It matters because Room 101 shows the Party''s final weapon: torture that destroys a person''s loyalty and self.'
    - 'Remember: Room 101 holds "the worst thing in the world".'
    - The trap is C, humiliation. Winston is humiliated, but Room 101 is above all a place of torture.
    hint: What is done to Winston when he is taken to Room 101?
    why:
      A: No one rests in Room 101; it is where prisoners are broken.
      B: Room 101 is the most feared place in the Ministry of Love, the opposite of fun.
      C: Humiliation is part of it, but Room 101 is first a place of torture.
  20:
    answer: D
    steps:
    - This is the outlook of George Orwell's Nineteen Eighty-Four.
    - A pessimistic work expects the worst; it shows evil winning and gives little hope.
    - Winston rebels, but he is caught, tortured and broken. The novel ends with him sitting in a café, and its last words say he loved Big Brother.
    - 'It matters because Orwell''s dark ending is a warning: if such power is allowed to grow, the individual will lose.'
    - 'Remember: the hero loses everything and the Party wins, so the book is pessimistic.'
    - The trap is A, optimistic. Winston's rebellion raises hope for a while, but the ending crushes it.
    hint: Who wins at the end, Winston or the Party?
    why:
      A: The ending crushes Winston's hope completely; nothing in it is optimistic.
      B: Antagonistic describes hostility between people, not the outlook of the whole novel.
      C: The novel warns, but "persuasive" does not describe its dark view of the future.
  21:
    answer: C
    steps:
    - This is the central idea of J.P. Clark's The Wives' Revolt.
    - The play turns on a quarrel between the men and women of the town over how money paid by an oil company is shared.
    - The wives feel cheated and walk out. Apart, both sides suffer, and the men find they cannot manage without their wives. The comedy ends with each side learning that the other is an equal partner.
    - It matters because Clark argues that men and women should be treated as equals, and shows that this can be reached through dialogue.
    - 'Remember: the revolt ends in a lesson, not a defeat; equality is worth having and can be had.'
    - The trap is B, desirable but unattainable. The play does not end in hopelessness; it shows the two sides coming to terms.
    hint: Does the play end with the quarrel still raging, or with both sides learning?
    why:
      A: The play argues for equality between men and women, so it does not treat equality as undesirable.
      B: The comedy ends with the sides coming to terms, so it does not present equality as out of reach.
      D: Nothing in the play calls equality obnoxious; it presents it as fair.
  22:
    answer: B
    steps:
    - This is the wives' walk-out in J.P. Clark's The Wives' Revolt.
    - A revolt is a protest against those in authority.
    - The wives believe the men have shared the oil company's money unfairly and treated them high-handedly, so they leave the town together in protest.
    - It matters because their absence shows the men how much the women matter to the life of the town.
    - 'Remember: the title tells you; the wives leave in revolt, like workers going on strike.'
    - The trap is A, find new husbands. The wives leave to make a point to their husbands, not to replace them.
    hint: What does the title say the wives are doing?
    why:
      A: The wives leave to protest, not to look for other husbands.
      C: Their leaving is a protest, not a trading trip.
      D: There is no war driving them out; their quarrel is with their own husbands.
  23:
    answer: A
    steps:
    - This is a mocking line in J.P. Clark's The Wives' Revolt.
    - 'The line uses contrast: "great orators in the assembly" against "poor nannies at home".'
    - Who speak at the town assembly in the play? The men. And with the wives gone, who is left minding the children at home? The husbands. They talk big in public and struggle at home.
    - It matters because the play laughs at men who think they rule everything, until the women leave.
    - 'Remember: a nanny minds children; with the wives gone, the husbands are the nannies.'
    - The trap is C, wives. The wives are the ones who have walked out; they are not the ones left minding the children.
    hint: Who has been left at home with the children?
    why:
      B: The old women are not the speakers in the assembly the line mocks.
      C: The wives have walked out; they are not left at home as nannies.
      D: Spinsters are neither speakers in the assembly nor left minding children here.
  24:
    answer: A
    steps:
    - This is a figurative phrase in J.P. Clark's The Wives' Revolt.
    - '"Those with full breasts" names people by one feature of their bodies; full breasts belong to young women of child-bearing age.'
    - The speaker says they "have walked out", and sets them against "the old girls returned home on retirement". The young wives have left; only the old women remain.
    - 'It matters because the line shows what the town has lost: its young mothers, the women who keep homes running.'
    - 'Remember: full breasts mean young mothers; returned on retirement means old women.'
    - The trap is B, the old women. The extract names them separately, as the ones left behind.
    hint: Who has walked out of the town, the young or the old?
    why:
      B: The old women are named separately, as the ones still at home.
      C: The men are the ones left behind, not the ones who walked out.
      D: The children are not described here; the phrase points to their mothers.
  25:
    answer: B
    steps:
    - This is Udje, the oral tradition behind the abuse in J.P. Clark's The Wives' Revolt.
    - Udje is the Urhobo tradition of satirical song, in which rival groups compose songs abusing and mocking each other.
    - In the play, the men and the women trade insults and mockery, side against side, in the spirit of an Udje contest.
    - It matters because Clark builds his comedy out of the oral tradition of the Urhobo people, among whom the play is set.
    - 'Remember: Udje is singing your rival''s faults in public, the way rival groups trade jibes at a festival.'
    - The trap is D, Ekpe. Ekpe is a well-known Nigerian tradition, but it is a society, not a contest of abusive songs.
    hint: Which tradition is a contest of mocking songs between rival groups?
    why:
      A: Ikaki is a masquerade, not a tradition of trading songs of abuse.
      C: Etiyeri is not the Urhobo contest of abusive songs that Udje is.
      D: Ekpe is the leopard society of the Efik and Ibibio, not a contest of abuse.
  26:
    answer: A
    steps:
    - This is simile.
    - A simile compares two things openly, using "like" or "as".
    - Othello looks at the dead Desdemona and says she is "Pale as thy smock". Her face is compared with her white nightdress, and the word "as" makes the comparison open.
    - It matters because the plain, pale image brings home her innocence, and his own horror at what he has done.
    - 'Remember: if you can see "like" or "as" making the comparison, it is a simile.'
    - The trap is C, metaphor. A metaphor would say she is a smock; here "as" shows the comparison openly.
    hint: Which little word sits between "Pale" and "thy smock"?
    why:
      B: A pun plays on two meanings of a word; there is no double meaning in "pale as thy smock".
      C: A metaphor compares without "like" or "as"; this comparison uses "as".
      D: A paradox is a statement that seems to contradict itself; this is a plain comparison.
  27:
    answer: A
    steps:
    - This is the climax of William Shakespeare's Othello.
    - Iago poisons Othello's mind with lies that Desdemona is unfaithful with Cassio, and plants her handkerchief as false proof.
    - Othello, wild with jealousy, smothers Desdemona in her bed in Act 5. Iago had warned him to "beware, my lord, of jealousy; it is the green-eyed monster".
    - It matters because jealousy is the tragic flaw that turns a noble general into a murderer.
    - 'Remember: green-eyed monster, jealousy, Othello.'
    - The trap is B, race insulted. Othello does face racist insults, but he kills Desdemona because he believes she has betrayed him.
    hint: What feeling does Iago warn Othello against, then stir up in him?
    why:
      B: Othello faces racist insults in the play, but he kills Desdemona out of jealousy.
      C: Desdemona is no witch; it is Brabantio who accuses Othello of witchcraft.
      D: Desdemona is not an idol; Othello kills her because he believes she is unfaithful.
  28:
    answer: B
    steps:
    - This is Brabantio's objection in William Shakespeare's Othello.
    - Brabantio, a Venetian senator, cannot accept that his daughter has married a Black man, a Moor.
    - Iago and Roderigo stir him with racist pictures of Othello, and Brabantio says Desdemona could never have fallen in love "with what she feared to look on" unless she was bewitched.
    - It matters because his prejudice shows the racism Othello faces in Venice, which Iago later uses against him.
    - 'Remember: Brabantio liked Othello as a guest and a general, but not as a son-in-law, because he is a Moor.'
    - The trap is C, Roderigo wooed her first. Roderigo did court Desdemona, but Brabantio had already sent him away.
    hint: What does Brabantio say she "feared to look on"?
    why:
      A: Iago never sought to marry Desdemona; he is Othello's ensign.
      C: Brabantio had already turned Roderigo away, so this is not his reason.
      D: Brabantio objects to whom she married, not to her age.
  29:
    answer: C
    steps:
    - This is Othello's last speech in William Shakespeare's Othello.
    - Having learnt that Desdemona was innocent, Othello stops the officers who are about to take him away.
    - He says "Soft you; a word or two before you go" and asks them to report him truly in their letters. At the end of the speech he stabs himself and dies.
    - It matters because in his dying speech he tries to win back some of his old nobility before the end.
    - 'Remember: "a word or two before you go" is a dying man''s last request.'
    - The trap is A, travelling. The officers mean to take him to Venice, but he speaks these lines just before he takes his own life.
    hint: What does Othello do at the end of this speech?
    why:
