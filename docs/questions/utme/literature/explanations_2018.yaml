    answer: B
    steps:
    - This is the subject of the poem, read straight from the lines.
    - The title is "To Bed-Bug", and the persona speaks to "you awful parasites".
    - They "share with me this little bed" and are "sucking blood from my poor head". Only bed-bugs live in the bed and feed on blood at night.
    - 'It matters because the dismay is real and funny: the persona cannot sleep for the bites.'
    - 'Remember: in the bed, biting at night, sucking blood; that is the bed-bug every boarding-school student knows.'
