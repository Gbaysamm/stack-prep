    hint: What does the title name?
    why:
      A: Bats do not live in a bed or suck a sleeper's blood.
      C: Grasshoppers live in fields and do not suck blood.
      D: Mosquitoes bite at night too, but the title and the bed point to bed-bugs.
  33:
    answer: C
    steps:
    - This is personification.
    - Personification gives human qualities or actions to animals, things or ideas.
    - 'The persona speaks to the bed-bugs as if they were bedfellows: they "share with me this little bed" and "awake me". Sharing a bed is a human act.'
    - It matters because treating the bugs as unwanted human companions makes the complaint comic and vivid.
    - 'Remember: when an insect is spoken to like a troublesome roommate, it is personification.'
    - The trap is A, metaphor. "Awful parasites" may look like one, but bed-bugs really are parasites, so it is a plain description.
    hint: Who normally "shares" a bed with you?
    why:
      A: Bed-bugs really are parasites, so "awful parasites" is not a metaphor; the device is treating them as bedfellows.
      B: There is no comparison with "like" or "as" in the lines.
      D: The complaint is not exaggerated beyond belief; bed-bugs really do bite and wake a sleeper.
