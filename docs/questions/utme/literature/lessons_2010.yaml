# UTME 2010 Literature in English, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Literature teacher works on the board:
# the question, the term, character or event named, the definition or the fact in the text,
# the words or the moment that show it, why it matters, a way to remember it, and the answer.
#
#   say:     heard, not read. Quoted lines are read naturally, rhyme letters one by one, names
#            as written, and no symbols the voice would stop on.
#   write:   the one line written while it is said.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2010.yaml. Answers match that file. No question
# is dropped, so all 49 kept questions have a lesson.
format_version: 1
exam_year: 2010
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'Every play has one big quarrel at its heart. What is the quarrel in Sons and Daughters?'
        write: 'Sons and Daughters: the main conflict?'
      - section: 'Name it'
        say: 'This is the central conflict, the clash that drives the whole play.'
        write: 'Central conflict = the clash that drives the plot'
      - section: 'The fact'
        say: 'James Ofosu is a rich, strict father. He wants his children in the professions he respects.'
        write: 'James Ofosu: "respectable" professions only'
      - section: 'Show it'
        say: 'But Aaron wants to be an artist, and Maanan wants to be a dancer.'
        write: 'Aaron → artist; Maanan → dancer'
      - section: 'Why'
        say: 'So the play asks who should choose a young person''s future, the parent or the child.'
        write: 'Who chooses the future: parent or child?'
      - section: 'Remember'
        say: 'Think of the parent who says medicine, law or engineering, nothing else, and the child who wants music or art.'
        write: 'Parent''s choice versus child''s dream'
      - section: 'Answer'
        say: 'So the conflict is over their choice of careers, which is option A.'
        write: '$\therefore$ their choice of careers'
        answer: true
    traps:
      B: 'You went for the sharing of property. Many African plays fight over land, but this one fights over careers.'
      C: 'You chose religion. Faith is not what divides James from his children.'
      D: 'You picked where the family should live. The home is never in dispute, the whole play happens in it.'
  3:
    moments:
      - section: 'The question'
        say: 'Maanan cannot stand Lawyer B, her father''s friend. Why?'
        write: 'Why does Maanan dislike Lawyer B?'
      - section: 'Name it'
        say: 'This is about Lawyer B, a respected friend of the family.'
        write: 'Lawyer B = James Ofosu''s respected friend'
      - section: 'The fact'
        say: 'Lawyer B makes advances to Maanan, and that is why she dislikes him.'
        write: 'Lawyer B makes advances to Maanan'
      - section: 'Show it'
        say: 'When it comes out, James sees that a respectable profession does not make a respectable man.'
        write: 'Profession ≠ character'
      - section: 'Why'
        say: 'It exposes the hypocrisy of the very man James held up as a model, and it helps change his mind.'
        write: 'The model man is a hypocrite'
      - section: 'Remember'
        say: 'Remember, her dislike is personal. It is about what he did to her.'
        write: 'What he did to her'
      - section: 'Answer'
        say: 'So Maanan dislikes him because of his advances towards her, which is option B.'
        write: '$\therefore$ his recent advances towards her'
        answer: true
    traps:
      A: 'You went for his view of her career. Her dislike comes from what he did to her, not from his opinions.'
      C: 'You chose the betrayal of her father''s trust. That follows from the advances, but the advances are the cause.'
      D: 'You picked his wife''s trust. That is the harm to his wife, not the reason Maanan herself dislikes him.'
  4:
    moments:
      - section: 'The question'
        say: 'Maanan has a dream her father does not like. What does she want to become?'
        write: 'Maanan wants to become ?'
      - section: 'Name it'
        say: 'This is Maanan''s ambition, the heart of her quarrel with James Ofosu.'
        write: 'Maanan''s ambition'
      - section: 'The fact'
        say: 'Maanan wants to become a dancer.'
        write: 'Maanan → a dancer'
      - section: 'Show it'
        say: 'Her father wants her in a profession he thinks respectable, and he looks down on dance.'
        write: 'James: dance is not "respectable"'
      - section: 'Why'
        say: 'Her dancing, like Aaron''s painting, stands for the arts, and the play defends the arts as a worthy calling.'
        write: 'The arts are a worthy calling'
      - section: 'Remember'
        say: 'Remember, Aaron paints, Maanan dances, and James disapproves of both.'
        write: 'Aaron paints, Maanan dances'
      - section: 'Answer'
        say: 'So Maanan wants to become a dancer, which is option D.'
        write: '$\therefore$ a dancer'
        answer: true
    traps:
      A: 'You went for a lawyer. That is the kind of job her father admires, not Maanan''s own dream.'
      B: 'You chose a doctor. Medicine is not Maanan''s wish, she wants to dance.'
      C: 'You picked a nurse. Nursing is not what Maanan wants in the play.'
  5:
    moments:
      - section: 'The question'
        say: 'A family quarrel needs a place. Where does the action of Sons and Daughters happen?'
        write: 'Sons and Daughters: where?'
      - section: 'Name it'
        say: 'This is the setting, the place where the action happens.'
        write: 'Setting = where the action happens'
      - section: 'The fact'
        say: 'The action takes place in James Ofosu''s house, among his family.'
        write: 'James Ofosu''s house'
      - section: 'Show it'
        say: 'Every quarrel between James and his children happens at home, where they cannot avoid each other.'
        write: 'Every quarrel at home'
      - section: 'Why'
        say: 'Home is where a father''s authority rules, so it fits a play about that authority.'
        write: 'Home = the father''s kingdom'
      - section: 'Remember'
        say: 'Remember, a family quarrel needs a family house.'
        write: 'Family quarrel, family house'
      - section: 'Answer'
        say: 'So the play takes place in James Ofosu''s house, which is option D.'
        write: '$\therefore$ in James Ofosu''s house'
        answer: true
    traps:
      A: 'You went for the street. This is a home drama, not a street play.'
      B: 'You chose George''s place. The action is not set there.'
      C: 'You picked Aunt''s house. Aunt is family, but the scenes are in James''s own house.'
  6:
    moments:
      - section: 'The question'
        say: 'Friar Laurence scolds Romeo. What is the fault that the law calls death?'
        write: '"Thy fault our law calls death" = ?'
      - section: 'Name it'
        say: 'This is Act three of Romeo and Juliet. Romeo has just been banished.'
        write: 'Act 3: Friar Laurence to Romeo'
      - section: 'The fact'
        say: 'Romeo killed Tybalt, Juliet''s cousin, and the law of Verona says such a killing deserves death.'
        write: 'Romeo killed Tybalt → law says death'
      - section: 'Show it'
        say: 'Look at the words. Thy fault our law calls death, but the kind prince turned that black word death to banishment.'
        write: '"turn''d that black word death to banishment"'
      - section: 'Why'
        say: 'So the Prince showed mercy. The deadly sin the Friar names is Romeo''s ingratitude for that mercy.'
        write: 'Sin = ingratitude for mercy'
      - section: 'Remember'
        say: 'Remember, the fault is the killing, the mercy is banishment, the sin is ingratitude.'
        write: 'Fault → mercy → ingratitude'
      - section: 'Answer'
        say: 'So the fault is the killing of Tybalt, which is option D.'
        write: '$\therefore$ killing of Tybalt'
        answer: true
    traps:
      A: 'You went for Juliet''s suicide. That happens in the last scene, long after this speech.'
      B: 'You chose Romeo''s suicide. He dies only at the very end of the play.'
      C: 'You picked the murder of Paris. Romeo kills Paris at the tomb in the last act.'
  7:
    moments:
      - section: 'The question'
        say: 'Shakespeare''s characters speak in verse. What kind of verse is most of Romeo and Juliet?'
        write: 'Romeo and Juliet: mostly written in ?'
      - section: 'Name it'
        say: 'This is blank verse.'
        write: 'Blank verse'
      - section: 'Define it'
        say: 'Blank verse is unrhymed iambic pentameter. Each line has ten syllables and five beats.'
        write: 'Blank verse = unrhymed iambic pentameter'
      - section: 'Show it'
        say: 'Listen. But soft, what light through yonder window breaks? Da dum, da dum, da dum, da dum, da dum.'
        write: 'but SOFT / what LIGHT / through YON / der WIN / dow BREAKS'
      - section: 'Why'
        say: 'It sounds close to natural speech but keeps a steady beat, so the lines are dignified yet alive.'
        write: 'Natural speech + steady beat'
      - section: 'Remember'
        say: 'Remember, blank means no rhyme, but it still has a beat.'
        write: 'Blank = no rhyme, still a beat'
      - section: 'Answer'
        say: 'So the play is mostly written in blank verse, which is option A.'
        write: '$\therefore$ blank verse'
        answer: true
    traps:
      B: 'You went for free verse. Free verse has no regular beat, and it came about three centuries after Shakespeare.'
      C: 'You chose metres. Metre is the beat pattern, not the name of the verse form.'
      D: 'You picked foot. A foot is one unit of the beat, like one iamb, not a verse form.'
  8:
    moments:
      - section: 'The question'
        say: 'O serpent heart, hid with a flowering face. Who is Juliet talking about?'
        write: '"O serpent heart, hid with a flowering face!"'
      - section: 'Name it'
        say: 'This is Juliet in Act three, Scene two. The Nurse has just told her that Romeo killed Tybalt.'
        write: 'Act 3 Sc 2: Juliet hears Tybalt is dead'
      - section: 'Show it'
        say: 'A serpent heart is a cruel heart, and a flowering face is a beautiful face. A fair face hides a cruel heart.'
        write: 'serpent heart = cruel; flowering face = fair'
      - section: 'The fact'
        say: 'She is speaking of Romeo, the man she loves, who has killed her cousin.'
        write: 'Romeo, her husband, killed her cousin'
      - section: 'Why'
        say: 'The line shows the feud forcing Juliet to love and hate the same person.'
        write: 'Love and horror at once'
      - section: 'Remember'
        say: 'Remember the snake in the garden, beautiful outside and deadly within.'
        write: 'The snake in the garden'
      - section: 'Answer'
        say: 'So the line refers to Romeo, which is option B.'
        write: '$\therefore$ Romeo'
        answer: true
    traps:
      A: 'You went for Juliet. She is the speaker, not the one she describes.'
      C: 'You chose Tybalt. Tybalt is the one who has died. Juliet is speaking of his killer.'
      D: 'You picked Benvolio. He is a peacemaker and is not in this speech.'
  9:
    moments:
      - section: 'The question'
        say: 'Every play happens somewhere. In which city is Romeo and Juliet set?'
        write: 'Romeo and Juliet: the place?'
      - section: 'Name it'
        say: 'This is the spatial setting, which means the place of the action.'
        write: 'Spatial setting = place'
      - section: 'The fact'
        say: 'The play is set in Verona, a city in northern Italy.'
        write: 'Verona, northern Italy'
      - section: 'Show it'
        say: 'The Prologue tells us at once. In fair Verona, where we lay our scene.'
        write: '"In fair Verona, where we lay our scene"'
      - section: 'Why'
        say: 'Verona is the city whose peace the two families keep breaking, and its Prince must punish them.'
        write: 'The feud breaks Verona''s peace'
      - section: 'Remember'
        say: 'Remember, fair Verona in the very first lines.'
        write: 'Fair Verona'
      - section: 'Answer'
        say: 'So the setting is Verona, which is option B.'
        write: '$\therefore$ Verona'
        answer: true
    traps:
      A: 'You went for Athens. That is the setting of A Midsummer Night''s Dream.'
      C: 'You chose Padua. That is the setting of The Taming of the Shrew.'
      D: 'You picked Venice. That is The Merchant of Venice and the start of Othello.'
  10:
    moments:
      - section: 'The question'
        say: 'Romeo is sent away to Mantua. What did he do?'
        write: 'Why is Romeo banished?'
      - section: 'Name it'
        say: 'This is the cause of Romeo''s banishment in Act three.'
        write: 'Act 3: the street fight'
      - section: 'The fact'
        say: 'Tybalt kills Mercutio in a street fight. Then Romeo, in fury, fights and kills Tybalt.'
        write: 'Tybalt kills Mercutio → Romeo kills Tybalt'
      - section: 'Show it'
        say: 'The Prince could sentence him to death, but he banishes Romeo to Mantua instead.'
        write: 'Death sentence → banishment to Mantua'
      - section: 'Why'
        say: 'The banishment parts the new husband and wife, and sets off the chain that ends in their deaths.'
        write: 'Banishment → the tragic chain'
      - section: 'Remember'
        say: 'Remember, Mercutio dies, Tybalt dies, Romeo goes.'
        write: 'Mercutio dies, Tybalt dies, Romeo goes'
      - section: 'Answer'
        say: 'So Romeo is banished because he kills Tybalt in a street duel, which is option A.'
        write: '$\therefore$ kills Tybalt in a street duel'
        answer: true
    traps:
      B: 'You went for the secret marriage. Nobody knew about it, so nobody could punish it.'
      C: 'You chose the party. Capulet let Romeo stay and stopped Tybalt from attacking him.'
      D: 'You picked Paris. Romeo kills Paris at the tomb, after he has already been banished.'
  11:
    moments:
      - section: 'The question'
        say: 'In Nnu Ego''s world, what makes a woman respected?'
        write: 'The Joys of Motherhood: society values ?'
      - section: 'Name it'
        say: 'This is the value at the centre of the society in The Joys of Motherhood.'
        write: 'The central value of the society'
      - section: 'The fact'
        say: 'A woman''s worth is measured by the children she bears, especially sons. That is procreation.'
        write: 'Procreation = bearing children'
      - section: 'Show it'
        say: 'Nnu Ego''s first marriage fails because she has no child, and she nearly kills herself when her first son dies.'
        write: 'No child → marriage fails'
      - section: 'Why'
        say: 'The title is ironic. Motherhood gives Nnu Ego status, but it brings her poverty and loneliness.'
        write: 'The "joys" are ironic'
      - section: 'Remember'
        say: 'Remember, a child is a woman''s crown in the novel, but the crown is heavy.'
        write: 'A heavy crown'
      - section: 'Answer'
        say: 'So the society puts high value on procreation, which is option C.'
        write: '$\therefore$ procreation'
        answer: true
    traps:
      A: 'You went for egalitarianism. The society is far from equal, men and elders hold the power.'
      B: 'You chose monogamy. The men in the novel take several wives.'
      D: 'You picked gender equity. Women are not treated as the equals of men in the novel.'
  12:
    moments:
      - section: 'The question'
        say: 'Nnu Ego is born with a lump on her head. What does the medicine man say it means?'
        write: 'The lump on Nnu Ego''s head = ?'
      - section: 'Name it'
        say: 'This is the dibia''s reading of the lump.'
        write: 'The dibia''s reading'
      - section: 'The fact'
        say: 'When Agbadi''s senior wife Agunwa dies, her slave woman is buried with her. The slave is struck on the head first.'
        write: 'Agunwa dies → her slave woman is struck and buried'
      - section: 'Show it'
        say: 'The dibia says the slave woman has come back as the baby''s chi, and the lump marks the blow.'
        write: 'The slave woman = Nnu Ego''s chi'
      - section: 'Why'
        say: 'The slave woman''s spirit is blamed for Nnu Ego''s troubles all her life, linking her sorrows to an old cruelty.'
        write: 'An old cruelty follows her'
      - section: 'Remember'
        say: 'Remember, the lump is the mark of the blow.'
        write: 'Lump = mark of the blow'
      - section: 'Answer'
        say: 'So the lump is linked to the wound on the slave woman buried with Agbadi''s wife, which is option B.'
        write: '$\therefore$ the wound on the slave woman'
        answer: true
    traps:
      A: 'You went for perfection. The lump is read as the mark of a wound, not of beauty.'
      C: 'You chose Agunwa coming back. Agunwa is the dead wife, it is her slave woman who returns.'
      D: 'You picked fate. Her life is unlucky, but the dibia names one cause, the slave woman.'
  13:
    moments:
      - section: 'The question'
        say: 'What never leaves Nnaife''s family in Lagos?'
        write: 'Nnaife''s family''s constant companions?'
      - section: 'Name it'
        say: 'This is the condition Nnaife''s family lives in.'
        write: 'The family''s condition'
      - section: 'The fact'
        say: 'The family is always poor and often hungry. There are many children and very little money.'
        write: 'Many mouths, little money'
      - section: 'Show it'
        say: 'Nnu Ego sells on the street to feed the children, and when Nnaife is away they nearly starve.'
        write: 'Nnu Ego trades to feed them'
      - section: 'Why'
        say: 'The hunger shows how hard the joys of motherhood really are.'
        write: 'Hunger mocks the "joys"'
      - section: 'Remember'
        say: 'Remember, many mouths and little money.'
        write: 'Poverty + hunger'
      - section: 'Answer'
        say: 'So their constant companions are poverty and hunger, which is option B.'
        write: '$\therefore$ poverty and hunger'
        answer: true
    traps:
      A: 'You went for togetherness and happiness. The family knows little happiness, the joys of the title are ironic.'
      C: 'You chose sickness and joblessness. These come and go, but poverty and hunger stay.'
      D: 'You picked disagreement and humiliation. There are quarrels, but they are not the family''s constant state.'
  14:
    moments:
      - section: 'The question'
        say: 'Meka is to be given a medal. What has he done to earn it?'
        write: 'The Old Man and the Medal: why the medal?'
      - section: 'Name it'
        say: 'This is the event the whole novel is built on.'
        write: 'Meka''s medal'
      - section: 'The fact'
        say: 'Meka gave his land to the Catholic mission.'
        write: 'Land → the Catholic mission'
      - section: 'Show it'
        say: 'And his two sons died fighting for France in the war.'
        write: 'Two sons → died in the war'
      - section: 'Why'
        say: 'The medal is an empty reward for great losses, and the novel shows how little it means to the colonialists.'
        write: 'Great losses, empty reward'
      - section: 'Remember'
        say: 'Remember, land and sons given, a piece of metal received.'
        write: 'Land + sons → metal'
      - section: 'Answer'
        say: 'So Meka receives the medal because he gave his land to the mission and lost his two sons in the war, which is option C.'
        write: '$\therefore$ gave his land and lost his two sons'
        answer: true
    traps:
      A: 'You went for fighting for France. It was his sons who died in the war, not Meka who fought.'
      B: 'You chose killing a leopard. That is not why he is honoured.'
      D: 'You picked converting the village. Meka is a devout convert, but he did not convert the village.'
  15:
    moments:
      - section: 'The question'
        say: 'What kind of man is Meka?'
        write: 'Meka can best be described as ?'
      - section: 'Name it'
        say: 'This is characterisation, what Meka is like.'
        write: 'Meka''s character'
      - section: 'The fact'
        say: 'Meka is devout, trusting and naive. He believes the white men honour him as a friend.'
        write: 'Devout, trusting, naive'
      - section: 'Show it'
        say: 'He accepts the medal proudly, but soon after he is arrested and locked up. Only then does he see the truth.'
        write: 'Medal → arrest → his eyes open'
      - section: 'Why'
        say: 'His simple trust shows how colonialism used loyal Africans.'
        write: 'Simple trust, used by colonialism'
      - section: 'Remember'
        say: 'Remember, Meka is the old man who believed every word.'
        write: 'He believed every word'
      - section: 'Answer'
        say: 'So Meka is best described as a simple-hearted old man, which is option B.'
        write: '$\therefore$ a simple-hearted old man'
        answer: true
    traps:
      A: 'You went for egocentric. Meka does not think only of himself, he gives and trusts.'
      C: 'You chose impulsive. His fault is trust, not haste.'
      D: 'You picked religious bigot. Meka is very devout, but a bigot hates other faiths, and he does not.'
  16:
    moments:
      - section: 'The question'
        say: 'The colonialists give Meka a medal. But how do they really treat the Africans?'
        write: 'The colonialists treat the Africans with ?'
      - section: 'Name it'
        say: 'This is the colonial attitude in The Old Man and the Medal.'
        write: 'The colonial attitude'
      - section: 'The fact'
        say: 'They treat the Africans with disdain, which means scorn, looking down on them.'
        write: 'Disdain = scorn'
      - section: 'Show it'
        say: 'Meka is honoured in public, but soon after the ceremony he is arrested and locked up like a common thief.'
        write: 'Honoured, then locked up'
      - section: 'Why'
        say: 'The novel exposes the contempt hiding behind colonial friendship.'
        write: 'Contempt behind the friendship'
      - section: 'Remember'
        say: 'Remember, disdain is looking down on someone.'
        write: 'Disdain = looking down'
      - section: 'Answer'
        say: 'So the colonialists treat the Africans with disdain, which is option B.'
        write: '$\therefore$ disdain'
        answer: true
    traps:
      A: 'You went for kid gloves. That means handling gently, which they never do.'
      C: 'You chose indifference. They do not just ignore the Africans, they look down on them.'
      D: 'You picked honour. The medal looks like honour, but what follows shows contempt.'
  17:
    moments:
      - section: 'The question'
        say: 'In Oceania there is a Ministry of Peace. What does it really make?'
        write: 'Ministry of Peace makes ?'
      - section: 'Name it'
        say: 'This is doublespeak, a name that means the opposite of what it says.'
        write: 'Doublespeak = names that hide the truth'
      - section: 'The fact'
        say: 'Orwell writes that the Ministry of Peace concerned itself with war.'
        write: '"concerned itself with war"'
      - section: 'Show it'
        say: 'The Ministry of Truth makes lies, the Ministry of Love tortures, and the Ministry of Peace runs the war.'
        write: 'Truth → lies; Love → torture; Peace → war'
      - section: 'Why'
        say: 'Twisting words is how the Party controls minds.'
        write: 'Control words, control minds'
      - section: 'Remember'
        say: 'Remember the slogan, War is Peace.'
        write: 'WAR IS PEACE'
      - section: 'Answer'
        say: 'So the Ministry of Peace is concerned with making wars, which is option C.'
        write: '$\therefore$ wars'
        answer: true
    traps:
      A: 'You went for instruments. The ministry does not exist to make instruments.'
      B: 'You chose weapons. Weapons serve the war, but the ministry runs the war itself.'
      D: 'You picked reconciliation. That is what the name pretends, the ministry does the opposite.'
  18:
    moments:
      - section: 'The question'
        say: 'What is Nineteen Eighty-Four really about?'
        write: 'Nineteen Eighty-Four: subject matter?'
      - section: 'Name it'
        say: 'This is the subject matter, the main thing a work is about.'
        write: 'Subject matter = what it is about'
      - section: 'The fact'
        say: 'The novel is about a totalitarian dictatorship, a state that controls everything, even thought.'
        write: 'Totalitarian = total control'
      - section: 'Show it'
        say: 'Telescreens watch every room, the Thought Police arrest people for thinking, and history is rewritten every day.'
        write: 'Telescreens, Thought Police, rewritten history'
      - section: 'Why'
        say: 'Orwell wrote it as a warning against any government that seeks total control.'
        write: 'A warning'
      - section: 'Remember'
        say: 'Remember, Big Brother is watching you.'
        write: 'BIG BROTHER IS WATCHING YOU'
      - section: 'Answer'
        say: 'So the subject matter is totalitarian dictatorship, which is option A.'
        write: '$\therefore$ totalitarian dictatorship'
        answer: true
    traps:
      B: 'You went for exploitation and cruelty. They are there, but they are tools of the dictatorship, not the subject.'
      C: 'You chose retributive justice. The novel is not about fair punishment.'
      D: 'You picked class segregation. There are classes, but the novel is about total state control.'
  19:
    moments:
      - section: 'The question'
        say: 'Winston Smith rebels against Big Brother. What is his very first act?'
        write: 'Winston''s first act of rebellion?'
      - section: 'Name it'
        say: 'This is the opening of the novel.'
        write: 'Chapter one'
      - section: 'The fact'
        say: 'Winston begins a private diary, and in Oceania that is a crime.'
        write: 'A private diary = a crime'
      - section: 'Show it'
        say: 'He writes in it, Down with Big Brother.'
        write: '"DOWN WITH BIG BROTHER"'
      - section: 'Why'
        say: 'In a state that controls thought, private thought itself is rebellion.'
        write: 'Private thought = rebellion'
      - section: 'Remember'
        say: 'Remember, the pen came first, the affair and the plot came later.'
        write: 'Diary → affair → O''Brien'
      - section: 'Answer'
        say: 'So Winston started his rebellion by keeping a private diary, which is option B.'
        write: '$\therefore$ by keeping a private diary'
        answer: true
    traps:
      A: 'You went for anti-Party activities. Real plotting comes much later, when he goes to O''Brien.'
      C: 'You chose the secret affair. That is rebellion too, but it comes after the diary.'
      D: 'You picked spying on the Party. Winston never spies on the Party, he is the one being watched.'
  20:
    moments:
      - section: 'The question'
        say: 'Why does the Party want power? O''Brien tells Winston plainly.'
        write: 'The Party seeks power for ?'
      - section: 'Name it'
        say: 'This is the Party''s aim, as O''Brien explains it.'
        write: 'The Party''s aim'
      - section: 'The fact'
        say: 'O''Brien says, The Party seeks power entirely for its own sake.'
        write: '"The Party seeks power entirely for its own sake"'
