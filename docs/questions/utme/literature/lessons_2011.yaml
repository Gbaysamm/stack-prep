# UTME 2011 Literature in English, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Literature teacher works on the board:
# the question, the term, device, character or event named, the definition or the fact, the
# exact words or the moment that shows it, why it matters, a way to remember it, and the answer.
#
#   say:     heard, not read. Quoted lines are read naturally; no symbols the voice would stop on.
#   write:   the one line written while it is said.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2011.yaml. Answers match that file. No question
# is dropped, so all 49 kept questions have a lesson.
format_version: 1
exam_year: 2011
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'A father and his children fight over careers. Does the play end in tears or in a handshake?'
        write: 'Sons and Daughters: what type of drama, judged by its ending?'
      - section: 'Name it'
        say: 'This is about the type of drama, and we judge the type by how the conflict is resolved.'
        write: 'Type of drama = how the conflict ends'
      - section: 'The rule'
        say: 'A comedy is a play whose conflicts end happily, with the characters reconciled and no one dead.'
        write: 'Comedy: conflict resolved happily'
      - section: 'Show it'
        say: 'In Sons and Daughters, James Ofosu fights his children over their careers. In the end he gives way and accepts their choices.'
        write: 'Ofosu gives way, family united'
      - section: 'Why it matters'
        say: 'No death, a lesson learnt, and a family together again. That is the shape of a comedy.'
        write: 'No death + reconciliation = comedy'
      - section: 'Remember'
        say: 'Tragedy ends in death. Comedy ends in agreement, like a family quarrel settled over a pot of jollof.'
        write: 'Tragedy → death; comedy → agreement'
      - section: 'Answer'
        say: 'So from its resolution of conflicts, the play is a comedy, which is option B.'
        write: '$\therefore$ comedy'
        answer: true
    traps:
      A: 'You chose tragedy. A tragedy ends in the hero''s fall or death, but this family ends reconciled.'
      C: 'You went for farce. A farce lives on wild, silly situations, and this play treats a real family quarrel seriously.'
      D: 'You picked melodrama. Melodrama exaggerates events and feelings, but this is a quiet, realistic family drama.'
  3:
    moments:
      - section: 'The question'
        say: 'What do the father and his children argue about from the first scene to the last?'
        write: 'Sons and Daughters: the prevailing theme?'
      - section: 'Name it'
        say: 'The prevailing theme is the main idea the whole play keeps coming back to.'
        write: 'Prevailing theme = the main idea throughout'
      - section: 'The fact'
        say: 'James Ofosu wants his children in respectable professions. They want careers of their own choosing.'
        write: 'Father''s will  versus  children''s choice'
      - section: 'Show it'
        say: 'Aaron wants to be an artist and Maanan a dancer, against their father''s wishes. Every scene turns on this clash.'
        write: 'Aaron the artist, Maanan the dancer'
      - section: 'Why it matters'
        say: 'The play asks how far parents should decide their children''s future. Many Nigerian homes still argue about it.'
        write: '"Study medicine, not music!"'
      - section: 'Remember'
        say: 'Remember, sons and daughters against the father''s will.'
        write: 'Children''s choice vs father''s will'
      - section: 'Answer'
        say: 'So the prevailing theme is the clash between a father''s will and his children''s choice of career, which is option D.'
        write: '$\therefore$ the clash of wills over careers'
        answer: true
    traps:
      A: 'You chose love. The family loves one another, but love is not what the play is mainly about.'
      B: 'You went for affluence. Ofosu is comfortable, but wealth is the background, not the theme.'
      C: 'You picked social decadence. Some moral rot appears in one side episode, but the main theme is the clash over careers.'
  4:
    moments:
      - section: 'The question'
        say: 'A respected elder lectures the young about good behaviour. Then he behaves badly himself. What does that show?'
        write: 'Sons and Daughters: Lawyer Bonu''s advances to Maanan show?'
      - section: 'Name it'
        say: 'This is Lawyer Bonu, a trusted friend of the Ofosu family.'
        write: 'Lawyer Bonu, family friend'
      - section: 'The rule'
        say: 'Hypocrisy means claiming a high moral standard while not keeping it yourself.'
        write: 'Hypocrisy = preach one thing, do another'
      - section: 'Show it'
        say: 'Bonu is honoured as a respectable elder, yet he makes advances to Maanan, his friend''s own daughter.'
        write: 'Respected elder → advances to Maanan'
      - section: 'Why it matters'
        say: 'It exposes the elders who say they know what is best for the young, and it helps the play argue that the children deserve respect.'
        write: 'Elders exposed; children''s choices defended'
      - section: 'Remember'
        say: 'Remember, the man who preaches respectability is the one who breaks it.'
        write: 'The preacher breaks his own sermon'
      - section: 'Answer'
        say: 'So Bonu''s advances show the hypocrisy of elders who claim to know what is best for the young, which is option C.'
        write: '$\therefore$ the hypocrisy of the elders'
        answer: true
    traps:
      A: 'You chose this, but Maanan wants to be a dancer, not a lawyer.'
      B: 'You went for Ofosu''s wisdom. Bonu''s conduct actually shows that Ofosu misjudged his friend.'
      D: 'You picked this, but dancing is looked down on in Ofosu''s circle. That is exactly Maanan''s problem.'
  5:
    moments:
      - section: 'The question'
        say: 'An artist looks around a room and says it outrages his sense of beauty. How does he feel?'
        write: '"Everything in this room outrages my sense of beauty..." Mood?'
      - section: 'Name it'
        say: 'This is the speaker''s mood, and we read it from his own words.'
        write: 'Mood, read from the words'
      - section: 'The rule'
        say: 'Frustration is the feeling of being blocked from doing what you want to do.'
        write: 'Frustrated = blocked from your aim'
      - section: 'Show it'
        say: 'Look at two words. The room outrages his sense of beauty, and it undermines his will to create pictures.'
        write: '"outrages" + "undermines my will to create"'
        point:
          - {line: 3, kind: underline, at: 'outrages', on: 'outrages'}
          - {line: 3, kind: underline, at: 'undermines', on: 'undermines'}
      - section: 'Why it matters'
        say: 'He is Aaron, the son who wants to paint, and his home stops him. Anger plus a blocked will is frustration.'
        write: 'Aaron the painter, blocked at home'
      - section: 'Remember'
        say: 'An artist who cannot create is frustrated, like a tailor whose machine has no power.'
        write: 'No power for the machine = frustration'
      - section: 'Answer'
        say: 'So the speaker is frustrated, which is option B.'
        write: '$\therefore$ frustrated'
        answer: true
    traps:
      A: 'You chose happy. But nothing in his words is happy, because the room outrages him.'
      C: 'You went for excited. Excitement is eager and hopeful, and he is angry and blocked.'
      D: 'You picked tired. Undermines can sound weary, but outrages shows anger at being blocked.'
  6:
    moments:
      - section: 'The question'
        say: 'Juliet is alone with a little bottle. Is she about to die, or about to pretend to die?'
        write: '"Come, vial." What does Juliet intend?'
      - section: 'Name it'
        say: 'This is Juliet''s speech in Act four, just before she drinks.'
        write: 'Romeo and Juliet, Act 4, Scene 3'
      - section: 'The fact'
        say: 'Friar Lawrence gave her a potion that makes her seem dead for a time, so she can escape marrying Paris.'
        write: 'Friar''s potion → seems dead for a time'
      - section: 'Show it'
        say: 'She nearly calls the Nurse back, then says, my dismal scene I needs must act alone. Come, vial.'
        write: '"My dismal scene I needs must act alone. Come, vial."'
        point:
          - {line: 3, kind: underline, at: 'vial', on: 'vial'}
      - section: 'Why it matters'
        say: 'She plans to wake in the tomb and go to Romeo. She means to seem dead, not to die.'
        write: 'Plan: wake in the tomb, join Romeo'
      - section: 'Remember'
        say: 'Come, vial, is the Friar''s plan in action, a sleep that looks like death.'
        write: 'Vial = sleep that looks like death'
      - section: 'Answer'
        say: 'So Juliet intends to drink the Friar''s potion so that she will seem dead, which is option C.'
        write: '$\therefore$ drink the potion and seem dead'
        answer: true
    traps:
      A: 'You chose suicide by poison. She fears it might be poison, but she drinks it believing it will only make her seem dead.'
      B: 'You went for calling the Nurse. She thinks of it, then says what should she do here, and sends the thought away.'
      D: 'You picked running to Mantua. The plan is that Romeo comes to her at the tomb.'
  7:
    moments:
      - section: 'The question'
        say: 'After all the deaths, two old enemies shake hands. What do we call that point in a play?'
        write: 'Romeo and Juliet: when is the denouement?'
      - section: 'Name it'
        say: 'This is the denouement.'
        write: 'Denouement'
      - section: 'The rule'
        say: 'The denouement is the final unravelling after the climax, when the conflict is settled and loose ends are tied.'
        write: 'Denouement = the untying, conflict settled'
      - section: 'Show it'
        say: 'After the lovers die, Montague and Capulet take hands and promise golden statues of each other''s children.'
        write: 'Montague + Capulet take hands'
      - section: 'Why it matters'
        say: 'The feud that drove the whole play is finally over. The lovers'' deaths end the hatred.'
        write: 'The feud ends'
      - section: 'Remember'
        say: 'Denouement means untying. The families'' knot is untied at the end.'
        write: 'Denouement = untying the knot'
      - section: 'Answer'
        say: 'So the denouement comes at the reconciliation of the feuding families, which is option C.'
        write: '$\therefore$ the reconciliation of the families'
        answer: true
    traps:
      A: 'You chose the family feast. That is early in the play, where the trouble begins.'
      B: 'You went for Romeo killing Paris. That is part of the climax, not the settling of the conflict.'
      D: 'You picked the news of Juliet''s death. It drives the play towards its climax, but nothing is settled yet.'
  8:
    moments:
      - section: 'The question'
        say: 'Romeo is in Mantua. Someone rides in with terrible news. Who is it?'
        write: 'Who tells Romeo in Mantua that Juliet is dead?'
      - section: 'Name it'
        say: 'This is Balthasar, Romeo''s own servant.'
        write: 'Balthasar = Romeo''s servant'
      - section: 'The fact'
        say: 'Balthasar sees Juliet laid in the Capulet tomb and rides to Mantua to tell his master.'
        write: 'Sees the tomb → rides to Mantua'
      - section: 'Show it'
        say: 'In Act five, Scene one, he says her body sleeps in the Capulets'' monument. Romeo decides at once to buy poison.'
        write: '"Her body sleeps in Capel''s monument"'
      - section: 'Why it matters'
        say: 'Friar John''s letter explaining the plan never reached Romeo. So the false news is all he hears.'
        write: 'Letter lost; false news arrives'
      - section: 'Remember'
        say: 'The servant''s news arrives, but the Friar''s letter does not.'
        write: 'Servant arrives, letter does not'
      - section: 'Answer'
        say: 'So the news is broken to Romeo by Balthasar, which is option A.'
        write: '$\therefore$ Balthasar'
        answer: true
    traps:
      B: 'You chose Friar Lawrence. He stays in Verona and plans to tell Romeo by letter.'
      C: 'You went for a boy. The messenger is Balthasar, Romeo''s servant.'
      D: 'You picked Friar John. He was held back by a plague quarantine and never reached Mantua.'
  9:
    moments:
      - section: 'The question'
        say: 'Who starts the street fight with Tybalt, and dies in it?'
        write: 'Romeo and Juliet: Mercutio is...?'
      - section: 'Name it'
        say: 'This is Mercutio, Romeo''s witty friend.'
        write: 'Mercutio, Romeo''s friend'
      - section: 'The rule'
        say: 'Quarrelsome means always ready to pick a fight.'
        write: 'Quarrelsome = ready to fight'
      - section: 'Show it'
        say: 'In Act three he taunts Tybalt, calling him a rat-catcher, and draws his sword when Romeo will not fight.'
        write: '"Tybalt, you rat-catcher, will you walk?"'
      - section: 'Why it matters'
        say: 'His quarrel gets him killed, Romeo kills Tybalt for it, and Romeo is banished. The tragedy turns here.'
        write: 'Mercutio dies → Tybalt dies → Romeo banished'
      - section: 'Remember'
        say: 'A plague on both your houses is the cry of the quarrelsome friend who dies in the quarrel.'
        write: '"A plague o'' both your houses!"'
      - section: 'Answer'
        say: 'So Mercutio can be described as quarrelsome, which is option B.'
        write: '$\therefore$ quarrelsome'
        answer: true
    traps:
      A: 'You chose fraudulent. Mercutio never cheats anyone in the play.'
      C: 'You went for gentle. He is fiery and mocking, the opposite of gentle.'
      D: 'You picked kind-hearted. He is loyal to Romeo, but the play stresses his fighting side.'
  10:
    moments:
      - section: 'The question'
        say: 'Does Romeo and Juliet ever jump back in time?'
        write: 'Romeo and Juliet: how is the plot ordered?'
      - section: 'Name it'
        say: 'This is about the order of events in the plot.'
        write: 'Plot order'
      - section: 'The rule'
        say: 'A chronological plot tells events in the order they happen, first to last, with no flashbacks.'
        write: 'Chronological = in time order'
      - section: 'Show it'
        say: 'The brawl, the feast, the marriage, Tybalt''s death, the potion, the tomb. All in order, over a few days.'
        write: 'Brawl → feast → marriage → Tybalt → potion → tomb'
      - section: 'Why it matters'
        say: 'The straight line and the short time make the tragedy feel rushed and unstoppable.'
        write: 'A few days, straight ahead'
      - section: 'Remember'
        say: 'Chronological means by the clock, one day after the next.'
        write: 'Chronos = time'
      - section: 'Answer'
        say: 'So the plot of the play is chronological, which is option D.'
        write: '$\therefore$ chronological'
        answer: true
    traps:
      A: 'You chose episodic. An episodic plot is loosely linked episodes, but here each event causes the next.'
      B: 'You went for complicated. The events are fast, but they are plainly ordered.'
      C: 'You picked convoluted. That means twisted and hard to follow, and this plot runs in a straight line.'
  11:
    moments:
      - section: 'The question'
        say: 'In the morning Meka gets a medal. By the next morning he is in a cell. What has he learnt?'
        write: 'The Old Man and the Medal: what does the night make Meka see?'
      - section: 'Name it'
        say: 'This is the turning point of the novel, the night of the medal.'
        write: 'The night of the medal'
      - section: 'The fact'
        say: 'Meka gave his land to the mission and lost two sons in the war for France. He believes the medal makes him the white men''s friend.'
        write: 'Land + two sons given → medal'
      - section: 'Show it'
        say: 'That night, drunk and lost in the storm, he strays into the European quarter and is locked up like a common thief.'
        write: 'Storm → European quarter → cell'
      - section: 'Why it matters'
        say: 'His eyes open. The colonisers do not see him as a friend or an equal. That disillusionment is the novel''s theme.'
        write: 'Theme: disillusionment with colonial rule'
      - section: 'Remember'
        say: 'One medal, one night in a cell, and the scales fall from his eyes.'
        write: 'Medal → cell → eyes open'
      - section: 'Answer'
        say: 'So the night makes Meka see that the colonial masters do not regard him as their friend or equal, which is option B.'
        write: '$\therefore$ not their friend or equal'
        answer: true
    traps:
      A: 'You chose a bigger medal. After that night he no longer wants their honours at all.'
      C: 'You went for Kelara. His wife stands by him, and the night is about the colonisers, not his marriage.'
      D: 'You picked payment for his land. The night teaches him the colonisers will not reward him.'
  12:
    moments:
      - section: 'The question'
        say: 'The church preaches brotherhood. Does it treat Meka like a brother?'
        write: 'Father Vandermayer towards Meka shows the church''s...?'
      - section: 'Name it'
        say: 'This is Father Vandermayer, the priest of the Catholic mission.'
        write: 'Father Vandermayer, the mission priest'
      - section: 'The rule'
        say: 'Hypocrisy is preaching one thing and doing another.'
        write: 'Hypocrisy = preach one thing, do another'
      - section: 'Show it'
        say: 'The church took Meka''s land and preaches that all are brothers in Christ, yet Vandermayer treats him as an inferior.'
        write: 'Takes the land, preaches brotherhood, treats him as inferior'
      - section: 'Why it matters'
        say: 'Oyono uses him to mock the colonial church, which spoke of love but served itself.'
        write: 'Satire of the colonial church'
      - section: 'Remember'
        say: 'Sermons about brotherhood, but no brotherhood for Meka.'
        write: 'Brotherhood preached, not practised'
      - section: 'Answer'
        say: 'So Vandermayer''s attitude illustrates the church''s hypocrisy, which is option D.'
        write: '$\therefore$ hypocrisy'
        answer: true
    traps:
      A: 'You chose despondency. That means low spirits, and the church is not sad, it is self-serving.'
      B: 'You went for suspicion. The church is not suspicious of Meka, it simply uses him.'
      C: 'You picked infuriation. That is great anger, and the church''s fault is false piety, not rage.'
  13:
    moments:
      - section: 'The question'
        say: 'A man talks, and the skin under his chin puffs up and down. What creature does that remind you of?'
        write: '"...puffing up and then deflating the skin under his chin" makes him look?'
      - section: 'Name it'
        say: 'This is caricature.'
        write: 'Caricature'
      - section: 'The rule'
        say: 'Caricature exaggerates a person''s features to make him look ridiculous.'
        write: 'Caricature = exaggerate to mock'
      - section: 'Show it'
        say: 'His lower jaw went down and came up, puffing up and then deflating the skin under his chin.'
        write: '"puffing up and then deflating the skin under his chin"'
        point:
          - {line: 3, kind: underline, at: 'puffing', on: 'puffing'}
          - {line: 3, kind: underline, at: 'deflating', on: 'deflating'}
      - section: 'Picture it'
        say: 'That is a frog puffing its throat as it croaks. A grand man becomes a croaking frog.'
        write: 'Man speaking = frog croaking'
      - section: 'Why it matters'
        say: 'Oyono mocks the pride of the colonial white men, so the reader laughs at them.'
        write: 'Satire of colonial pride'
      - section: 'Remember'
        say: 'If a description makes you think of a bullfrog, the writer is laughing at the man.'
        write: 'Bullfrog = mockery'
      - section: 'Answer'
        say: 'So the description makes the man look ridiculous, like a puffing frog, which is option B.'
        write: '$\therefore$ ridiculous, like a puffing frog'
        answer: true
    traps:
      A: 'You chose dignified. A speaker may look grand, but the puffing chin makes him comic.'
      C: 'You went for frightening. The description is comic, not threatening.'
      D: 'You picked sad. The man is laughed at, not pitied.'
  14:
    moments:
      - section: 'The question'
        say: 'Nnaife takes up a cutlass against a Yoruba family. What made him that angry?'
        write: 'The Joys of Motherhood: why does Nnaife attack?'
      - section: 'Name it'
        say: 'This is the cause of Nnaife''s arrest near the end of the novel.'
        write: 'Nnaife''s arrest'
      - section: 'The fact'
        say: 'His daughter Kehinde goes off to marry a Yoruba man, not the Ibuza husband her father expects.'
        write: 'Kehinde marries a Yoruba man'
      - section: 'Show it'
        say: 'Nnaife goes after the Yoruba family with a cutlass and is arrested for attempted murder.'
        write: 'Cutlass → arrest for attempted murder'
      - section: 'Why it matters'
        say: 'He clings to the ways of Ibuza even in Lagos, and Nnu Ego''s family falls apart in spite of all her sacrifice.'
        write: 'Old ways in a new city; the family breaks'
      - section: 'Remember'
        say: 'Kehinde''s choice, Nnaife''s cutlass.'
        write: 'Kehinde''s choice → Nnaife''s cutlass'
      - section: 'Answer'
        say: 'So Nnaife attacks because his daughter Kehinde has gone to marry a Yoruba man, which is option D.'
        write: '$\therefore$ Kehinde''s Yoruba husband'
        answer: true
    traps:
      A: 'You chose losing his job. That happens much earlier and does not lead to the attack.'
      B: 'You went for Nnu Ego leaving. She never leaves Nnaife for another man.'
      C: 'You picked Oshia going abroad. It disappoints them, but it is not why Nnaife attacks.'
  15:
    moments:
      - section: 'The question'
        say: 'What makes a chief great in Ibuza, besides a sweet tongue?'
        write: 'Nwokocha Agbadi is famous for oratory and...?'
      - section: 'Name it'
        say: 'This is Nwokocha Agbadi, Nnu Ego''s father.'
        write: 'Agbadi, Nnu Ego''s father'
      - section: 'The fact'
        say: 'Agbadi is a great chief of Ibuza, famous for his wealth and his power with words.'
        write: 'Wealth + oratory'
      - section: 'Show it'
        say: 'The novel presents him as a wealthy local chief and a skilled speaker, who wins the proud Ona as his lover.'
        write: 'Wealthy chief, skilled speaker'
      - section: 'Why it matters'
        say: 'His wealth explains why Nnu Ego''s bride price matters so much, and why her poverty in Lagos is such a fall.'
        write: 'Rich father → poor daughter in Lagos'
      - section: 'Remember'
        say: 'Agbadi has a big mouth and a big barn, words and wealth.'
        write: 'Words and wealth'
      - section: 'Answer'
        say: 'So Agbadi is famous for his oratorical powers and his wealth, which is option D.'
        write: '$\therefore$ wealth'
        answer: true
    traps:
      A: 'You chose height. His fame rests on his wealth and his speech, not his height.'
      B: 'You went for treachery. He is proud and strong-willed, but not known for betrayal.'
      C: 'You picked illiteracy. No one is famous for that, and Agbadi is famous for his wealth.'
  16:
    moments:
      - section: 'The question'
        say: 'In a dream, Nnu Ego''s chi hands her a baby boy. Good news or bad?'
        write: 'The Joys of Motherhood: the dream of the baby boy signifies?'
      - section: 'Name it'
        say: 'This is a symbolic dream, and the giver is Nnu Ego''s chi, her personal god.'
        write: 'Chi = personal god'
      - section: 'The fact'
        say: 'Her chi is the slave woman buried with Agbadi''s senior wife. For years she seems to deny Nnu Ego children.'
        write: 'Chi = the slave woman'
      - section: 'Show it'
        say: 'In the dream the chi at last hands her a baby boy, and soon after, Nnu Ego conceives her first son.'
        write: 'Baby in the dream → baby in the womb'
      - section: 'Why it matters'
        say: 'The dream promises the child she prayed for. The later sorrows of that motherhood give the title its bitter irony.'
        write: 'Promise of a child'
      - section: 'Remember'
        say: 'In a dream, a baby given is a baby coming.'
        write: 'Given in a dream = coming soon'
      - section: 'Answer'
        say: 'So the dream signifies a future blessing, which is option B.'
        write: '$\therefore$ future blessing'
        answer: true
    traps:
      A: 'You chose reincarnation. The dream promises a child, not a dead person born again.'
      C: 'You went for idol worship. The chi is her personal god, but the dream signifies a blessing.'
      D: 'You picked doom. The dream brings good news, a son.'
  17:
    moments:
      - section: 'The question'
        say: 'Orwell wrote it in nineteen forty-eight and set it in nineteen eighty-four. Past or future?'
        write: 'Nineteen Eighty-Four draws a picture of...?'
      - section: 'Name it'
        say: 'This is the world of the novel, the state of Oceania.'
        write: 'Oceania'
      - section: 'The rule'
        say: 'A totalitarian state controls every part of life, work, love, thought and even history.'
        write: 'Totalitarian = total control'
      - section: 'Show it'
        say: 'The Party watches everyone through telescreens, and the Thought Police punish thoughtcrime.'
        write: 'Telescreens, Thought Police, thoughtcrime'
      - section: 'Why it matters'
        say: 'Orwell set it in the future as a warning of where total state power could lead.'
        write: 'A warning about the future'
      - section: 'Remember'
        say: 'Big Brother is watching you, in the future.'
        write: 'BIG BROTHER IS WATCHING YOU'
      - section: 'Answer'
        say: 'So the novel draws a picture of a totalitarian future, which is option B.'
        write: '$\therefore$ a totalitarian future'
        answer: true
    traps:
      A: 'You chose a useless past. The Party rewrites the past, but the novel is set in the future.'
      C: 'You went for an unstable moment. Oceania is frighteningly stable under the Party.'
      D: 'You picked a peaceful atmosphere. The air is full of fear and surveillance.'
  18:
    moments:
      - section: 'The question'
        say: 'Winston keeps a secret diary. What is he dreaming of?'
        write: 'Nineteen Eighty-Four: Winston''s dreams of...?'
      - section: 'Name it'
        say: 'This is Winston Smith''s hope, the thing the Party crushes.'
        write: 'Winston''s dream'
      - section: 'The fact'
        say: 'Winston dreams of a world where people can think and speak freely.'
        write: 'Free thought, free speech'
      - section: 'Show it'
        say: 'He writes that freedom is the freedom to say that two plus two make four.'
        write: '"Freedom is the freedom to say that two plus two make four."'
      - section: 'Why it matters'
        say: 'The Party breaks that dream in the Ministry of Love, showing how total power destroys freedom.'
        write: 'Ministry of Love crushes the dream'
      - section: 'Remember'
