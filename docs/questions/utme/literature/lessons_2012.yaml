# UTME 2012 Literature in English, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Literature teacher works on the board:
# the question, the term, character or event named, the definition or fact, the exact words or
# the moment in the text that shows it, why it matters, a way to remember it, and the answer.
#
#   say:     heard, not read. Quoted lines read naturally, rhyme schemes letter by letter, no
#            symbols the voice would stop on.
#   write:   the one line written while it is said.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2012.yaml. Answers match that file. No question
# is dropped, so all 49 kept questions have a lesson.
format_version: 1
exam_year: 2012
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'Families in plays can be big. In Sons and Daughters, who is the paternal aunt of Aaron and Maanan?'
        write: 'Sons and Daughters: paternal aunt of Aaron and Maanan?'
      - section: 'Name it'
        say: 'First, the word paternal. It means from the father''s side.'
        write: 'Paternal = from the father''s side'
      - section: 'The fact'
        say: 'So a paternal aunt is your father''s sister. Aaron and Maanan''s father is James Ofosu.'
        write: 'Father = James Ofosu'
      - say: 'James Ofosu''s elder sister is Aunt Fosuwa. The list of characters at the start of the play tells us so.'
        write: 'James''s sister = Aunt Fosuwa'
      - section: 'Why it matters'
        say: 'Aunt Fosuwa speaks with the old family voice, and the play sets her against Hannah, the caring mother.'
        write: 'Fosuwa (old voice) vs Hannah (mother)'
      - section: 'Remember'
        say: 'Remember a paternity test. Paternal always points to the father.'
        write: 'Paternal → father → his sister'
      - section: 'Answer'
        say: 'So the paternal aunt of Aaron and Maanan is Fosuwa, which is option C.'
        write: '$\therefore$ Fosuwa'
        answer: true
    traps:
      A: 'You chose Mrs Bonu. She is Lawyer Bonu''s wife, not part of the Ofosu family.'
      B: 'You went for Hannah. She is close to the children, but she is their mother, not their aunt.'
      D: 'You picked Adwao. She is not the sister of James Ofosu.'
  3:
    moments:
      - section: 'The question'
        say: 'Every play has one big struggle that drives it. What is the central conflict in Sons and Daughters?'
        write: 'Sons and Daughters: the central conflict?'
      - section: 'Name it'
        say: 'The central conflict is the main clash that runs through the whole play, not one small quarrel.'
        write: 'Central conflict = the clash that drives the whole play'
      - section: 'The fact'
        say: 'James Ofosu is a rich man who wants his children to follow respected careers he chooses, such as law and engineering.'
        write: 'James wants law and engineering'
      - say: 'But his children want careers of their own choosing, in the arts. So father and children clash.'
        write: 'Children want their own careers'
      - section: 'Show it'
        say: 'Look at the title, Sons and Daughters. The play is about the children, and the father who plans their lives.'
        write: 'Title → the children''s future'
      - section: 'Why it matters'
        say: 'The play asks how far parents may rule their grown children''s lives. Many Nigerian homes still say, you will read medicine.'
        write: 'Who should choose a child''s career?'
      - section: 'Remember'
        say: 'Remember, it is sons and daughters against a father with a plan.'
        write: 'Father''s plan vs children''s dreams'
      - section: 'Answer'
        say: 'So the central conflict is between James Ofosu and his children over their careers, which is option C.'
        write: '$\therefore$ James vs his children over careers'
        answer: true
    traps:
      A: 'You chose rival families over land. There is no land war in this play.'
      B: 'You went for the Bonus. Lawyer Bonu causes trouble, but that is one episode, not the conflict of the whole play.'
      D: 'You picked Hannah and Fosuwa. They differ in attitude, but not over a house, and that is not the central conflict.'
  4:
    moments:
      - section: 'The question'
        say: 'Someone is holding a bottle and is ready to use it. Who says this, and to whom?'
        write: '"If you touch me, I shall smash your face with this bottle."'
      - section: 'Name it'
        say: 'This is Maanan, the daughter of James Ofosu, speaking to Lawyer Bonu.'
        write: 'Maanan → Lawyer Bonu'
      - section: 'The fact'
        say: 'Maanan works in Lawyer Bonu''s office, and he harasses her and tries to force himself on her.'
        write: 'Bonu harasses Maanan at work'
      - section: 'Show it'
        say: 'Look at the words, if you touch me. Someone is reaching for her, and it is Bonu.'
        write: '"If you touch me" → Bonu reaches for her'
      - section: 'Why it matters'
        say: 'The line shows Maanan as brave, and it shows that the respected lawyer James trusts is not a good man.'
        write: 'Maanan brave; Bonu a hypocrite'
      - section: 'Remember'
        say: 'Picture a young woman in an office, with a bottle in her hand, defending herself.'
        write: 'Office + bottle = Maanan vs Bonu'
      - section: 'Answer'
        say: 'So the statement is made by Maanan to Lawyer Bonu, which is option A.'
        write: '$\therefore$ Maanan to Lawyer Bonu'
        answer: true
    traps:
      B: 'You chose Mrs Bonu. She is the lawyer''s wife, but the one who tries to touch Maanan is her husband.'
      C: 'You went for James and Awere. James never threatens anyone with a bottle.'
      D: 'You picked Awere and Aaron. The line belongs to a young woman defending herself.'
  5:
    moments:
      - section: 'The question'
        say: 'Same line, new question. What is really going on when Maanan grabs the bottle?'
        write: 'The issue at stake?'
      - section: 'Name it'
        say: 'The issue is harassment. Lawyer Bonu is trying to kiss and touch Maanan.'
        write: 'Issue = harassment'
      - section: 'The fact'
        say: 'Bonu is a friend of James Ofosu and Maanan''s employer, and he uses that power to make advances to her.'
        write: 'Bonu = employer + family friend'
      - section: 'Show it'
        say: 'The words if you touch me tell us he is reaching for her. The bottle tells us how firmly she refuses.'
        write: '"If you touch me" + the bottle = a firm no'
      - section: 'Why it matters'
        say: 'The scene shows that the respectable career James admires can hide a man without morals.'
        write: 'Respectable ≠ good'
      - section: 'Remember'
        say: 'Ask what the other person must be doing for her to say if you touch me.'
        write: 'Read the line backwards to the action'
      - section: 'Answer'
        say: 'So the issue is that Lawyer Bonu is trying to kiss Maanan, which is option B.'
        write: '$\therefore$ Bonu tries to kiss Maanan'
        answer: true
    traps:
      A: 'You chose compromise. A threat to smash a face is a refusal, not meeting halfway.'
      C: 'You went for James and Awere. The line has nothing to do with them.'
      D: 'You picked Mrs Bonu taunting Maanan. The danger comes from her husband, not from her.'
  6:
    moments:
      - section: 'The question'
        say: 'Before the play even starts, Shakespeare tells us how it ends. What do these lines suggest about the tragedy?'
        write: '"From forth the fatal loins of these two foes / A pair of star-cross''d lovers take their life"'
      - section: 'Name it'
        say: 'These lines come from the Prologue, spoken by the Chorus.'
        write: 'Romeo and Juliet, Prologue'
      - section: 'Define it'
        say: 'A tragedy is predestined when fate has fixed the downfall from the start.'
        write: 'Predestined = fixed by fate beforehand'
      - section: 'Show it'
        say: 'Look at the word fatal. It means doomed.'
        write: '"fatal" = doomed'
      - say: 'Now look at star crossed. The stars were believed to rule a person''s fate, and here they are against the lovers.'
        write: '"star-cross''d" = the stars are against them'
      - section: 'Why it matters'
        say: 'We watch the whole play knowing the lovers will die, and that makes every happy moment painful.'
        write: 'We know the end → deeper pity'
      - section: 'Remember'
        say: 'Think of an Ifa reading that has already spoken. Star crossed means the end is already written.'
        write: 'Star-crossed = already written'
      - section: 'Answer'
        say: 'So the lines suggest the tragedy is predestined, which is option B.'
        write: '$\therefore$ predestined'
        answer: true
    traps:
      A: 'You chose could have been averted. The words fatal and star crossed say the end is fixed.'
      C: 'You went for enmity. The feud is real, but these lines point to the stars and to fate.'
      D: 'You picked misfortune on the lovers. That is the outcome, not what the lines say about its cause.'
  7:
    moments:
      - section: 'The question'
        say: 'Romeo sees Juliet for the first time and is dazzled. How do these lines present her beauty?'
        write: '"O, she doth teach the torches to burn bright!"'
      - section: 'Name it'
        say: 'This is Romeo at the Capulet feast, and his device is imagery of light against darkness.'
        write: 'Imagery: light against dark'
      - section: 'Define it'
        say: 'Imagery is language that paints a picture in the mind.'
        write: 'Imagery = a picture in words'
      - section: 'Show it'
        say: 'First picture. She teaches the torches to burn bright, so she is brighter than the torches.'
        write: 'Brighter than the torches'
      - say: 'Second picture. She hangs upon the cheek of night like a rich jewel in an Ethiope''s ear, a bright jewel against dark skin.'
        write: '"Like a rich jewel in an Ethiope''s ear"'
      - section: 'Why it matters'
        say: 'Both pictures say one thing. Juliet stands out from everything around her.'
        write: 'She stands out → outstanding'
      - section: 'Remember'
        say: 'A torch in a dark room is the thing you cannot stop looking at.'
        write: 'Bright against dark = outstanding'
      - section: 'Answer'
        say: 'So Juliet''s beauty is presented as being outstanding, which is option D.'
        write: '$\therefore$ as being outstanding'
        answer: true
    traps:
      A: 'You chose fading into the night. Juliet does the opposite, because she outshines the night.'
      B: 'You went for envy. Nobody envies her in these lines. Romeo is simply dazzled.'
      C: 'You picked riches. The word rich is there, but the jewel is a picture of brightness, not money.'
  8:
    moments:
      - section: 'The question'
        say: 'Here is high praise of a beautiful woman. But who says it, and about whom?'
        write: '"the all-seeing sun / Ne''er saw her match since first the world begun"'
      - section: 'Name it'
        say: 'This is Romeo, praising Rosaline, in Act one Scene two.'
        write: 'Romeo → Rosaline (Act 1 Scene 2)'
      - section: 'The fact'
        say: 'When the play opens, Romeo is lovesick for Rosaline, who will not love him back.'
        write: 'Romeo loves Rosaline first'
      - section: 'Show it'
        say: 'Benvolio offers to show him fairer women. Romeo answers, one fairer than my love, the all seeing sun never saw her match.'
        write: '"One fairer than my love!"'
      - section: 'Why it matters'
        say: 'A few scenes later he forgets Rosaline the moment he sees Juliet. That shows how quick and extreme his young love is.'
        write: 'Rosaline forgotten at once → hasty love'
      - section: 'Remember'
        say: 'R for Rosaline comes before J for Juliet in Romeo''s heart.'
        write: 'R before J'
      - section: 'Answer'
        say: 'So the lines were spoken by Romeo in praise of Rosaline, which is option C.'
        write: '$\therefore$ Romeo, of Rosaline'
        answer: true
    traps:
      A: 'You chose Count Paris. He praises Juliet elsewhere, but these words are Romeo''s.'
      B: 'You went for Romeo praising Juliet. At this point he has not met her yet.'
      D: 'You picked Lady Capulet. She does not speak these lines.'
  9:
    moments:
      - section: 'The question'
        say: 'Mercutio jokes, fights and dies. But what is his major role in the play?'
        write: 'Mercutio''s major role?'
      - section: 'Name it'
        say: 'Mercutio is a foil to Romeo.'
        write: 'Mercutio = a foil'
      - section: 'Define it'
        say: 'A foil is a character whose qualities show up another character''s by contrast.'
        write: 'Foil = a contrast that shows up another'
      - section: 'Show it'
        say: 'Romeo is dreamy and swept away by love. Mercutio mocks love, laughs at dreams in his Queen Mab speech, and loves a quarrel.'
        write: 'Romeo dreamy ↔ Mercutio mocking'
      - section: 'Why it matters'
        say: 'The contrast makes Romeo''s romantic nature clearer, and Mercutio''s death turns the play towards tragedy.'
        write: 'Contrast → Romeo clearer'
      - section: 'Remember'
        say: 'A jeweller puts dark cloth behind a ring to make it shine. Mercutio is that cloth.'
        write: 'Foil = the dark cloth behind the ring'
      - section: 'Answer'
        say: 'So Mercutio''s major role is to serve as a contrast to Romeo, which is option A.'
        write: '$\therefore$ a contrast to Romeo'
        answer: true
    traps:
      B: 'You chose aiding Romeo''s passion. Mercutio laughs at Romeo''s love instead.'
      C: 'You went for annoying Tybalt. They do quarrel, but that is not his main purpose.'
      D: 'You picked going to Friar Lawrence. Mercutio does not do that.'
  10:
    moments:
      - section: 'The question'
        say: 'Romeo and Juliet borrows one feature from the old Greek tragedies. Which one?'
        write: 'Classical feature in Romeo and Juliet?'
      - section: 'Name it'
        say: 'The feature is the Chorus.'
        write: 'The Chorus'
      - section: 'Define it'
        say: 'In Greek tragedy, a Chorus speaks to the audience, sets the scene, and comments on the action.'
        write: 'Chorus = speaks to us, comments on the action'
      - section: 'Show it'
        say: 'Romeo and Juliet opens with a Chorus speaking the Prologue, and a Chorus speaks again before Act two.'
        write: 'Prologue + before Act 2'
      - section: 'Why it matters'
        say: 'The Chorus tells us the ending in advance, so we watch the lovers knowing they will die.'
        write: 'We know the end from the start'
      - section: 'Remember'
        say: 'Greek tragedy had a Chorus and kept the killing off stage.'
        write: 'Greek = Chorus + violence off stage'
      - section: 'Answer'
        say: 'So the play shares classical tragedy''s use of a chorus, which is option B.'
        write: '$\therefore$ chorus'
        answer: true
    traps:
      A: 'You chose violence on stage. Classical tragedy kept violence off stage.'
      C: 'You went for comic relief. The Nurse is funny, but comic relief comes from Elizabethan drama, not Greek tragedy.'
      D: 'You picked flashback. The play is told in order, with no flashback.'
  11:
    moments:
      - section: 'The question'
        say: 'Four people kneel down side by side. What are they doing?'
        write: 'Meka, Kelara, Amalia and her husband kneel. Why?'
      - section: 'Name it'
        say: 'The action is prayer.'
        write: 'Prayer'
      - section: 'The fact'
        say: 'In The Old Man and the Medal, Meka and his household are Christian converts who pray together.'
        write: 'Meka''s household = Christian converts'
      - section: 'Show it'
        say: 'Look at the words kneeling down, knelt down beside him and knelt down as well. Everyone takes the posture of prayer.'
        write: '"kneeling down" ... "knelt down" ... "knelt down as well"'
      - section: 'Why it matters'
        say: 'Oyono adds gentle humour, his behind up in the air, to show the villagers'' simple devotion to the white man''s faith.'
        write: '"his behind up in the air" → gentle humour'
      - section: 'Remember'
        say: 'Kneel to pray. When a whole household kneels together, they are praying.'
        write: 'Kneel → pray'
      - section: 'Answer'
        say: 'So their actions signify prayer, which is option C.'
        write: '$\therefore$ prayer'
        answer: true
    traps:
      A: 'You chose parade. A parade is marching, not kneeling.'
      B: 'You went for dance. Dancers stand and move, and they do not kneel side by side.'
      D: 'You picked celebration. Kneeling together like this is prayer.'
  12:
    moments:
      - section: 'The question'
        say: 'He has no toenails, and his toes are twisted up to the sky. Whose feet are these?'
        write: 'Whose feet are described?'
      - section: 'Name it'
        say: 'These are the feet of Meka, the old man of the title.'
        write: 'Meka, the old man'
      - section: 'The fact'
        say: 'Meka gave his land to the Church, and the colonial administration is to give him a medal.'
        write: 'Meka → the medal'
      - section: 'Show it'
        say: 'The extract says he had no toenails anymore, and yaws had twisted his toes so that they pointed to the sky.'
        write: '"no toenails anymore" ... "pointed to the sky"'
      - section: 'Why it matters'
        say: 'Meka must squeeze these feet into tight new shoes for the ceremony, and his pain makes the white man''s honour look absurd.'
        write: 'Old feet + tight shoes = comic pain'
      - section: 'Remember'
        say: 'The old man of the title has the old, worn feet.'
        write: 'Old man → old feet'
      - section: 'Answer'
        say: 'So the description is of the foot of Meka, which is option B.'
        write: '$\therefore$ Meka'
        answer: true
    traps:
      A: 'You chose Kelara. She is Meka''s wife, but the extract says he.'
      C: 'You went for Engamba. He is not the old man of the title.'
      D: 'You picked Mvondo. He is not the old man whose feet are described.'
  13:
    moments:
      - section: 'The question'
        say: 'People at prayer are compared to camels. What figure of speech is that?'
        write: '"kneeling on their bamboo bed like camels waiting to be loaded"'
      - section: 'Name it'
        say: 'This is a simile.'
        write: 'Simile'
      - section: 'Define it'
        say: 'A simile compares two different things openly, using like or as.'
        write: 'Simile = comparison with "like" or "as"'
      - section: 'Show it'
        say: 'Look at the small word like. It joins the kneeling people to kneeling camels.'
        write: 'People **like** camels'
      - section: 'Why it matters'
        say: 'The comparison is funny, and it shows the villagers as patient, tired and passive.'
        write: 'Camels waiting = patient, passive'
      - section: 'Remember'
        say: 'Simile sounds like similar, and it uses like or as.'
        write: 'Simile → similar → like / as'
      - section: 'Answer'
        say: 'So the dominant figure of speech is a simile, which is option B.'
        write: '$\therefore$ simile'
        answer: true
    traps:
      A: 'You chose rhetorical question. There is no question in the extract.'
      C: 'You went for metaphor. A metaphor would say they were camels, but here the word like makes it a simile.'
      D: 'You picked mixed metaphor. That joins two clashing metaphors, and here there is one clear simile.'
  14:
    moments:
      - section: 'The question'
        say: 'In Ibuza, what makes a woman a success? That is the question at the heart of this novel.'
        write: 'The Joys of Motherhood: Ibuza''s symbol of success?'
      - section: 'Name it'
        say: 'The answer is childbirth.'
        write: 'Childbirth'
      - section: 'The fact'
        say: 'Ibuza judges a woman''s worth and a family''s success by the children she bears.'
        write: 'Ibuza: children = worth'
      - section: 'Show it'
        say: 'Nnu Ego''s first marriage, to Amatokwu, fails because she does not conceive, and she is sent away.'
        write: 'No child → sent back from Amatokwu'
      - section: 'Why it matters'
        say: 'Nnu Ego then gives her whole life to bearing children, and that belief drives her tragedy.'
        write: 'All for children → tragedy'
      - section: 'Remember'
        say: 'Even her name, Nnu Ego, means twenty bags of cowries. A child is counted as a fortune.'
        write: 'Nnu Ego = twenty bags of cowries'
      - section: 'Answer'
        say: 'So Ibuza places great importance on childbirth, which is option A.'
        write: '$\therefore$ childbirth'
        answer: true
    traps:
      B: 'You chose wealth. Money matters, but in Ibuza children are counted as the real wealth.'
      C: 'You went for Western education. That is not what Ibuza values as success.'
      D: 'You picked a female child. Ibuza values sons more than daughters.'
  15:
    moments:
      - section: 'The question'
        say: 'A dying mother makes one last wish. What does Ona ask of Agbadi?'
        write: 'Ona''s dying wish to Agbadi?'
      - section: 'Name it'
        say: 'This is Ona''s dying wish about her daughter, Nnu Ego.'
        write: 'Ona''s wish for Nnu Ego'
      - section: 'The fact'
        say: 'Ona was a proud woman who never married Agbadi, because her father, who had no son, wanted her to stay in his house.'
        write: 'Ona never married Agbadi'
      - section: 'Show it'
        say: 'As she dies, she asks Agbadi to let their daughter have a life of her own, and a husband if she wants one.'
        write: 'A life of her own, a husband if she wants'
      - section: 'Why it matters'
        say: 'The wish raises the novel''s big question. Can a woman be free in a world that sees her only as a wife and mother?'
        write: 'Can a woman be free?'
      - section: 'Remember'
        say: 'Ona lived free, and she wanted her daughter to choose freely too.'
        write: 'Free mother → free choice for daughter'
      - section: 'Answer'
        say: 'So Ona appeals to Agbadi to allow Nnu Ego to marry a man of her choice, which is option D.'
        write: '$\therefore$ let Nnu Ego marry by choice'
        answer: true
    traps:
      A: 'You chose a befitting burial. Ona does not ask about her own burial.'
      B: 'You went for caring for her children. Her wish is about her daughter''s freedom to choose.'
      C: 'You picked taking another wife. Ona does not ask for that.'
  16:
    moments:
      - section: 'The question'
        say: 'The title promises joy. So why does Nnu Ego die alone by the roadside?'
        write: 'The Joys of Motherhood: what kind of title?'
      - section: 'Name it'
        say: 'The device here is irony in the title.'
        write: 'Irony'
      - section: 'Define it'
        say: 'Irony is a gap between what we expect and what really happens.'
        write: 'Irony = expected ≠ what happens'
      - section: 'Show it'
        say: 'Nnu Ego gave her whole life to her children, yet she dies alone by the roadside, with none of them beside her.'
        write: 'Many children → dies alone'
      - section: 'Why it matters'
        say: 'The irony makes us question the belief that children alone make a woman''s life full.'
        write: 'Is motherhood alone enough?'
      - section: 'Remember'
        say: 'When a title promises joy and the ending brings sorrow, the title is ironic.'
        write: 'Promised joy + real sorrow = ironic'
      - section: 'Answer'
        say: 'So the ending shows that the title is ironic, which is option A.'
        write: '$\therefore$ ironic'
        answer: true
    traps:
      B: 'You chose literal. A literal title would mean motherhood brought her joy, and the ending shows the opposite.'
      C: 'You went for a proverb. The title is an ironic phrase, not a proverb.'
      D: 'You picked a prayer. The title points to the gap between hope and reality.'
  17:
    moments:
      - section: 'The question'
        say: 'Big Brother is watching you. What kind of work is Nineteen Eighty-Four?'
        write: 'Nineteen Eighty-Four is mainly a ...?'
      - section: 'Name it'
        say: 'Nineteen Eighty-Four is a satire.'
        write: 'Satire'
      - section: 'Define it'
        say: 'A satire uses exaggeration and ridicule to attack people, systems or ideas, so that they may change.'
        write: 'Satire = exaggeration to attack and correct'
      - section: 'Show it'
        say: 'Orwell pushes a tyrant''s methods to the extreme. We see Big Brother watching, the Thought Police, Newspeak and history rewritten every day.'
        write: 'Big Brother, Thought Police, Newspeak'
      - section: 'Why it matters'
        say: 'The exaggeration warns us how power can crush truth and freedom.'
        write: 'A warning against tyranny'
      - section: 'Remember'
        say: 'Satire is a frightening mirror held up to power.'
        write: 'Satire = a mirror to power'
      - section: 'Answer'
        say: 'So the novel is mainly classified as a satire, which is option C.'
        write: '$\therefore$ satire'
        answer: true
    traps:
      A: 'You chose metaphor. That is a figure of speech, not a kind of novel.'
      B: 'You went for hyperbole. That is one exaggeration, not a name for a whole work.'
      D: 'You picked pastoral. A pastoral is about peaceful country life, the opposite of this novel.'
  18:
    moments:
      - section: 'The question'
        say: 'Winston opens his secret diary. Where does he say the hope of the country lies?'
        write: 'Winston: hope lies in the ...?'
      - section: 'Name it'
        say: 'Winston puts his hope in the proles.'
        write: 'The proles'
      - section: 'The fact'
        say: 'The proles are the working people of Oceania, about eighty-five per cent of everyone, and they are not Party members.'
        write: 'Proles = 85% of Oceania, not in the Party'
      - section: 'Show it'
        say: 'He writes, if there is hope, it lies in the proles. Only they are many enough to overthrow the Party.'
        write: '"If there is hope, it lies in the proles."'
      - section: 'Why it matters'
        say: 'But the proles never rise. They are kept busy with work, beer and the lottery, so the hope stays only a hope.'
        write: 'The proles never rise'
      - section: 'Remember'
        say: 'Proles is short for proletariat, the many workers.'
        write: 'Proles = proletariat'
      - section: 'Answer'
        say: 'So Winston writes that hope lies in the proles, which is option B.'
        write: '$\therefore$ proles'
        answer: true
    traps:
      A: 'You chose the Ministry of Truth. That is where Winston works rewriting history for the Party.'
      C: 'You went for the Party. The Party is what crushes hope.'
      D: 'You picked children. They are trained to spy for the Party.'
  19:
    moments:
      - section: 'The question'
        say: 'Every day, Party members scream at a screen for two minutes. What is it for?'
        write: 'The Two Minutes Hate is designed to ...?'
      - section: 'Name it'
        say: 'The Two Minutes Hate is a daily ritual for Party members.'
        write: 'Two Minutes Hate = daily, for Party members'
