# UTME 2013 Literature in English, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Literature teacher works on the board:
# the question, the term, character or event named, the definition or the fact in the text, the
# exact words or the moment that decide it, why it matters, a way to remember it, and the answer.
#
#   say:     heard, not read. Quoted lines read naturally, names said as written, no symbols
#            the voice would stop on.
#   write:   the one line written while it is said.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2013.yaml. Answers match that file. No question
# is dropped, so all 49 kept questions have a lesson.
format_version: 1
exam_year: 2013
lessons:
  2:
    moments:
    - section: The question
      say: James is about to swear an oath. What does the oath he chooses tell us about him?
      write: 'Sons and Daughters: what do James''s words show?'
    - section: Name it
      say: This is about character, what a man's own words reveal about him.
      write: Character from speech
    - section: The words
      say: Look at his words. I will swear by my father's coffin.
      write: '"I will swear by my father''s coffin"'
    - section: The fact
      say: Swearing by a dead father calls the ancestors to witness the promise. That is a traditional oath.
      write: Oath by the ancestors = traditional oath
    - section: Why it matters
      say: He does not reach for the Bible or the Quran. He reaches for his forefathers, like the stern father of the old ways.
      write: Not the Bible, not the Quran, the forefathers
    - section: Remember
      say: Think of a village elder who swears by the shrine of his fathers. Whoever swears by the ancestors speaks as a traditionalist.
      write: Swears by ancestors → traditionalist
    - section: Answer
      say: So the lines depict James as a traditionalist, which is option A.
      write: 'Answer: A, traditionalist'
      answer: true
    traps:
      B: You chose Christian. A Christian would swear on the Bible or by God, not by a coffin.
      C: You went for pagan. That is an insulting label, and the lines say nothing about idols.
      D: You picked Muslim. A Muslim would swear by Allah, not by his father's coffin.
  3:
    moments:
    - section: The question
      say: James says, let me swear, woman. What does the way he speaks show about him?
      write: '"Let me swear, woman": what kind of man?'
    - section: Name it
      say: This is about tone, the attitude a speaker shows in the way he speaks.
      write: Tone = attitude in the voice
    - section: The words
      say: He does not ask politely. He says let me swear, as if no one may stop him.
      write: '"Let me swear" = a demand'
    - say: And he calls her simply woman, not by her name. That is curt and dismissive.
      write: '"woman" = curt, dismissive'
    - section: Why it matters
      say: James is the stern, controlling father of the play, a man who wants to rule his household and his children's careers.
      write: James = the controlling father
    - section: Remember
      say: Picture a husband in a quarrel snapping, woman, listen to me. That is the voice of a man who wants the last word.
      write: Bare "woman!" → domineering
    - section: Answer
      say: So James is domineering and impatient, which is option B.
      write: 'Answer: B, domineering and impatient'
      answer: true
    traps:
      A: You chose respectful and gentle. Calling someone just woman in a quarrel is curt, not gentle.
      C: You went for frightened and pleading. He is not begging, he demands to be heard.
      D: You picked playful and teasing. An oath on a father's coffin is serious, not a joke.
  4:
    moments:
    - section: The question
      say: Aaron says engineering can go hang itself. Which figure of speech is that?
      write: '"engineering can go hang itself"'
    - section: Name it
      say: This is personification.
      write: Personification
    - section: The rule
      say: Personification gives human actions or feelings to a thing, an animal or an idea.
      write: Human action → thing or idea
    - section: The words
      say: Engineering is a subject, an idea. But Aaron says it can go hang itself, and only a person can do that.
      write: engineering (an idea) + hang itself (a human act)
    - section: Why it matters
      say: The scornful picture shows how strongly Aaron rejects the career his father chose. He wants art school.
      write: Aaron rejects engineering, wants art
    - section: Remember
      say: When a thing acts like a person, like the wind whispering or the exam waiting for you, that is personification.
      write: Thing acts like a person → personification
    - section: Answer
      say: So the dominant figure of speech is personification, which is option C.
      write: 'Answer: C, personification'
      answer: true
    traps:
      A: You chose metonymy. That names a thing by something linked to it, like the crown for the king. Nothing is renamed here.
      B: You went for synecdoche. That uses a part for the whole, like hands for workers. There is no part here.
      D: You picked metaphor. A metaphor says one thing is another. Here engineering is given a human action instead.
  5:
    moments:
    - section: The question
      say: Aaron wants to go to art school. In the play, what does he stand for?
      write: Aaron represents ... ?
    - section: Name it
      say: This is about what a character stands for in the play's main conflict.
      write: Character as symbol
    - section: The conflict
      say: The play is built on a clash between a father who wants to choose his children's careers and children who want to choose for themselves.
      write: Father's choice vs children's choice
    - section: The fact
      say: James Ofosu wants Aaron to be an engineer. Aaron wants art, and his sister Maanan wants to dance.
      write: James → engineering; Aaron → art; Maanan → dance
    - section: Why it matters
      say: Many Nigerian homes know this quarrel, the parent who says you must read medicine.
      write: '"You must read medicine!"'
    - section: Remember
      say: Aaron and Maanan are the new. James is the old.
      write: Children = new; James = old
    - section: Answer
      say: So Aaron represents the new generation, which is option C.
      write: 'Answer: C, new generation'
      answer: true
    traps:
      A: You chose painters. Aaron wants to paint, but he stands for a whole generation, not a trade.
      B: You went for art work. That is what Aaron wants to make, not what he stands for.
      D: You picked old generation. That is James, the father who wants to choose for his children.
  6:
    moments:
    - section: The question
      say: Someone calls Romeo a villain who has come to scorn their solemnity. What is Romeo doing?
      write: '"A villain that is hither come in spite"'
    - section: Name it
      say: This is the Capulet feast, in Act one, Scene five.
      write: 'Act 1, Scene 5: the Capulet feast'
    - section: The fact
      say: Tybalt, a Capulet, recognises Romeo's voice at old Capulet's party, and complains to his uncle.
      write: Tybalt to old Capulet
    - section: The words
      say: This is a Montague, our foe. He is the enemy, inside the Capulets' house.
      write: '"a Montague, our foe"'
    - say: To scorn at our solemnity this night. The solemnity is the night's celebration, the feast.
      write: solemnity this night = the feast
    - section: Why it matters
      say: Romeo came masked and uninvited with Benvolio and Mercutio. Here he first sees Juliet, and here Tybalt's anger begins.
      write: Romeo, masked, uninvited
    - section: Remember
      say: Think of a gate-crasher at an owambe party in the enemy family's compound.
      write: Gate-crasher at the enemy's party
    - section: Answer
      say: So the villain is attending a feast uninvited, which is option B.
      write: 'Answer: B, attending a feast uninvited'
      answer: true
    traps:
      A: You chose attempting to steal. Romeo came to see the party, not to take anything.
      C: You went for a shouting match. Romeo is quietly watching Juliet, there is no shouting.
      D: You picked holding a sword. It is Tybalt who calls for a sword, Romeo came in a mask.
  7:
    moments:
    - section: The question
      say: A man hears the word peace and draws his sword. What do his words reveal about him?
      write: '"I hate the word"'
    - section: Name it
      say: The speaker is Tybalt, Juliet's cousin, in the street fight of Act one, Scene one.
      write: Tybalt, Act 1, Scene 1
    - section: The moment
      say: Benvolio has drawn his sword only to part the fighting servants, and he asks Tybalt to help keep the peace.
      write: 'Benvolio: keep the peace'
    - section: The words
      say: Tybalt says he hates peace as he hates hell, all Montagues, and Benvolio. Then he says have at thee, coward, and attacks.
      write: hates peace + "Have at thee" = attacks
    - section: Why it matters
      say: Tybalt's temper drives the tragedy. He later kills Mercutio and is killed by Romeo, and Romeo is banished.
      write: Tybalt → Mercutio dies → Romeo banished
    - section: Remember
      say: Mercutio calls Tybalt the Prince of Cats, always ready to scratch.
      write: Prince of Cats
    - section: Answer
      say: So the lines reveal Tybalt as a violence seeker, which is option A.
      write: 'Answer: A, violence seeker'
      answer: true
    traps:
      B: You chose peace maker. That is Benvolio. Tybalt hates the very word peace.
      C: You went for real Montague. Tybalt is a Capulet, and he hates all Montagues.
      D: You picked trouble shooter. A troubleshooter solves problems, but Tybalt starts them.
  8:
    moments:
    - section: The question
      say: The play opens with Romeo hiding in his room. What is his mood?
      write: Romeo's mood at the start?
    - section: Name it
      say: This is Romeo in Act one, before he meets Juliet.
      write: Act 1, before Juliet
    - section: The fact
      say: He loves Rosaline, who has sworn never to marry and will not love him back.
      write: Romeo loves Rosaline. She says no.
    - section: The moment
      say: His father says Romeo shuts himself in his room and keeps out the daylight. Romeo tells Benvolio, sad hours seem long.
      write: '"Sad hours seem long"'
    - section: Why it matters
      say: It shows a young man ruled by feeling, which makes his sudden love for Juliet believable.
      write: Ruled by feeling
    - section: Remember
      say: Before Juliet, Romeo is the sighing lover, sad and full of tender feeling.
      write: Sad = melancholic; tender = sentimental
    - section: Answer
      say: So Romeo is melancholic and sentimental, which is option A.
      write: 'Answer: A, melancholic and sentimental'
      answer: true
    traps:
      B: You chose dreamy and hopeful. He is dreamy, but Rosaline has refused him, so there is no hope.
      C: You went for angry and vengeful. Romeo wants no revenge at the start, he even avoids the fight.
      D: You picked gay and elated. That is the opposite of the sighing Romeo who hides from daylight.
  9:
    moments:
    - section: The question
      say: Someone tells Romeo the Prince was kind to turn death into banishment. Who says it?
      write: Who speaks? "turn'd that black word 'death' to banishment"
    - section: The moment
      say: Romeo has killed Tybalt and is hiding in Friar Lawrence's cell, in Act three, Scene three.
      write: 'Act 3, Scene 3: the Friar''s cell'
    - section: The fact
      say: The Friar brings the Prince's sentence. Romeo is banished, not put to death.
      write: 'Sentence: banishment, not death'
    - section: The words
      say: Romeo cries that banishment is worse than death. So the Friar scolds him, O deadly sin, O rude unthankfulness.
      write: '"O rude unthankfulness!"'
    - section: Why it matters
      say: The Friar is Romeo's adviser. Only he is with Romeo when the sentence is told.
      write: Friar = Romeo's adviser
    - section: Remember
      say: The Friar is the voice of patience, the one who scolds Romeo for despair.
      write: Friar = patience
    - section: Answer
      say: So the speaker is Friar Lawrence, which is option B.
      write: 'Answer: B, Friar Lawrence'
      answer: true
    traps:
      A: You chose Lord Montague. He is Romeo's father, but he is not in the Friar's cell.
      C: You went for the Apothecary. He appears only in Mantua, selling Romeo poison.
      D: You picked Lord Capulet. He is Tybalt's uncle and would never praise the Prince for sparing Romeo.
  10:
    moments:
    - section: The question
      say: Someone says put up thy sword, or use it to part these men with me. When is this said?
      write: '"Put up thy sword": when?'
    - section: Name it
      say: This is the opening street fight, Act one, Scene one.
      write: Act 1, Scene 1
    - section: The fact
      say: Servants of the two families start fighting. Benvolio draws his sword to beat them apart.
      write: Servants fight; Benvolio parts them
    - section: The moment
      say: Tybalt arrives and draws on him. Benvolio says, put up thy sword, or help me part these men.
      write: Benvolio to Tybalt
    - section: The words
      say: Part these men means separate the fighters, and the fighters are the servants.
      write: part these men = separate the servants
    - section: Why it matters
      say: The first scene shows both sides of the feud, Benvolio the peacemaker and Tybalt the fighter.
      write: Benvolio = peace; Tybalt = fight
    - section: Answer
      say: So it was said when Benvolio tries to separate the servants, which is option D.
      write: 'Answer: D'
      answer: true
    traps:
      A: You chose Tybalt challenging Romeo. That comes in Act three, and Romeo is not in this fight.
      B: You went for the Prince arriving. He comes after this, and these words are Benvolio's.
      C: You picked Romeo and Paris. They fight only at the tomb in Act five.
  11:
    moments:
    - section: The question
      say: Meka gave his land to the Church, and his two sons died in the war. What does he get for it?
      write: Land + two sons → ?
    - section: Name it
      say: Look at the title. The Old Man and the Medal.
      write: The Old Man and the MEDAL
    - section: The fact
      say: Meka is an old, loyal Christian villager. His land went to the Catholic Mission, and his sons died fighting for France.
      write: Land → Mission; sons → war
    - section: The reward
      say: So the colonial administration announces that Meka will receive a medal, on the day the Chief of the Whites visits.
      write: Reward = a medal
    - section: Why it matters
      say: The medal is hollow. Meka gave his land and his sons, and gets a piece of metal.
      write: Land and sons for a piece of metal
    - say: By the end, beaten and locked up, Meka sees the colonial friendship for what it is.
      write: The friendship is empty
    - section: Remember
      say: Land and two sons in, one medal out.
      write: Land + sons in → medal out
    - section: Answer
      say: So Meka is rewarded with a medal from the colonial administration, which is option B.
      write: 'Answer: B, a medal'
      answer: true
    traps:
      A: You chose the elders' council. Meka is a faithful churchgoer, but his reward in the story is the medal.
      C: You went for a place near a leper. That is no reward, and not what the novel is about.
      D: You picked land for a house. Meka gave his land away, he is not given land back.
  12:
    moments:
    - section: The question
      say: Someone tells Meka he has never seen cocoa as well dried as his. What kind of remark is that?
      write: '"never seen cocoa as well dried as yours"'
    - section: Name it
      say: This is about purpose, what the speaker is doing with the words.
      write: What is the remark doing?
    - section: The rule
      say: Praise is speaking well of someone's work or qualities.
      write: Praise = speaking well of someone
    - section: The words
      say: Never seen cocoa as well dried as yours means Meka's cocoa is the best the speaker has seen.
      write: the best cocoa = praise
    - say: Since I came to this country tells us the speaker is a newcomer from abroad.
      write: '"Since I came to this country" = a foreigner'
    - section: Why it matters
      say: In the novel the colonisers praise Meka for what is useful to them, his land, his sons, his cocoa, but never treat him as an equal.
      write: Praised for what he gives
    - section: Answer
      say: So the remark is one of praise, which is option A.
      write: 'Answer: A, praise'
      answer: true
    traps:
      B: You chose blame. Nothing in the words finds fault, the cocoa is called the best.
      C: You went for warning. There is no threat or caution in the words.
      D: You picked apology. The speaker is not saying sorry for anything.
  13:
    moments:
    - section: The question
      say: The white men pin a medal on Meka. What do they say it stands for?
      write: The medal symbolises ... ?
    - section: Name it
      say: This is the meaning the colonisers give the medal.
      write: Symbol = what a thing stands for
    - section: The fact
      say: At the ceremony, the officials present the medal as a sign of friendship between the colonial power and Meka.
      write: Medal = friendship
    - section: The moment
      say: Meka goes home proud to be called their friend. But that night he is arrested and beaten when he is lost in a storm.
      write: That night, arrested and beaten
    - section: Why it matters
      say: The novel is ironic. The friendship the medal stands for is empty once the ceremony is over.
      write: Irony, the friendship is empty
    - section: Remember
      say: The medal says friendship, and the cell tells the truth.
      write: Medal says friendship; cell says the truth
    - section: Answer
      say: So to the white men the medal symbolises friendship, which is option D.
      write: 'Answer: D, friendship'
      answer: true
    traps:
      A: You chose victory in war. Meka never fought, and the medal is not for a victory.
      B: You went for love. The officials never speak of love, they speak of friendship.
      C: You picked peace. The medal is offered as a token of friendship, not peace.
  14:
    moments:
    - section: The question
      say: In her first marriage, Nnu Ego has no child. What do the people blame?
      write: Nnu Ego childless with Amatokwu. Why?
    - section: Name it
      say: This is about Nnu Ego's chi, her personal god.
      write: chi = personal god
    - section: The fact
      say: When Agunwa, Agbadi's senior wife, died, a slave woman was buried alive with her.
      write: Agunwa dies; slave buried with her
    - say: The slave was struck on the head, and she vowed to come back.
      write: Struck on the head, vows to return
    - section: The sign
      say: Nnu Ego is born with a lump on her head, in the same place. So the slave woman is said to be her chi.
      write: Lump on the head → slave is her chi
    - section: Why it matters
      say: When no child comes, the angry chi is blamed. Nnu Ego's whole life is shaped by the belief that a woman's worth lies in motherhood.
      write: Worth = motherhood?
    - section: Remember
      say: A lump on the head, a slave's revenge, and an empty womb.
      write: Lump, revenge, empty womb
    - section: Answer
      say: So her childlessness is blamed on her chi, the slave woman, which is option C.
      write: 'Answer: C, her chi'
      answer: true
    traps:
      A: You chose a curse from Agbadi. He loves Nnu Ego and longs for her children, he curses no one.
      B: You went for Adaku. She is the co-wife in the second marriage, to Nnaife, not the first.
      D: You picked poverty. That is not what the people blame, they look to her chi.
  15:
    moments:
    - section: The question
      say: Nnu Ego leaves Ibuza to join her new husband in Lagos. What is his job?
      write: Nnaife's job in Lagos?
    - section: Name it
      say: This is Nnaife's work in colonial Lagos.
      write: Nnaife in Lagos
    - section: The fact
      say: Nnaife washes clothes for a white couple, Dr Meers and his wife, even Mrs Meers' underwear.
      write: Washerman for the Meers
    - section: The moment
      say: Nnu Ego is ashamed. She expected a strong farmer, and finds a soft husband doing what she sees as a woman's work.
      write: Nnu Ego is ashamed
    - section: Why it matters
      say: City life under the colonisers changes men's roles. Nnaife has wages, but not the pride of a farmer at home.
      write: Wages, but no pride
    - section: Remember
      say: In Ibuza a man farms. In Lagos, Nnaife washes the Meers' clothes.
      write: Ibuza → farm; Lagos → wash
    - section: Answer
      say: So Nnaife works as a washerman for the Meers, which is option B.
      write: 'Answer: B, washerman'
      answer: true
    traps:
      A: You chose a bank clerk. Nnaife does manual work for the Meers, not office work.
      C: You went for cocoa farmer. Farming is the work of men back in Ibuza, not Nnaife's job in Lagos.
      D: You picked palm-wine tapper. Nnaife washes clothes, he does not tap palm wine.
  16:
    moments:
    - section: The question
      say: Adaku walks out of Nnaife's home to trade and educate her daughters. What theme does that show?
      write: Adaku leaves. Which theme?
    - section: Name it
      say: This is a theme, the central idea the story explores.
      write: Theme = the central idea
    - section: The fact
      say: Adaku is Nnaife's second wife. She has daughters but no living son, and she is made to feel worth less than Nnu Ego.
      write: Daughters, no son, less respect
    - section: The moment
      say: Adaku refuses that place. She leaves, trades for herself, and pays for her daughters' schooling.
      write: Leaves, trades, educates daughters
    - section: Why it matters
      say: She is the contrast to Nnu Ego, who lives only for her children and dies alone. So the title, The Joys of Motherhood, is bitterly ironic.
      write: Adaku vs Nnu Ego
    - section: Remember
      say: Nnu Ego gives everything to motherhood. Adaku stands on her own feet.
      write: Adaku = her own feet
    - section: Answer
      say: So Adaku's decision shows a woman's search for independence, which is option D.
      write: 'Answer: D, independence'
      answer: true
    traps:
      A: You chose the joy of polygamy. Adaku leaves because that home gives her no joy or respect.
      B: You went for loyalty to tradition. Adaku breaks with tradition, she does not keep it.
      C: You picked colonial schooling. School matters to her daughters, but her choice is about her own freedom.
  17:
    moments:
    - section: The question
      say: Oceania has a Ministry of Love. What does it really do?
      write: Ministry of Love = ?
    - section: Name it
      say: This is Miniluv, the Ministry of Love.
      write: Miniluv
    - section: The rule
      say: In Oceania each ministry's name means the opposite of its work.
      write: Name = the opposite of the work
    - section: The fact
      say: The Ministry of Love keeps order by arrest, torture and pain.
      write: Love → arrest, torture, pain
    - section: The moment
      say: Winston is tortured there by O'Brien, and in Room one hundred and one he is broken with rats.
      write: 'Room 101: rats'
    - section: Remember
      say: Love tortures, Truth lies, Peace makes war, Plenty starves.
      write: Love tortures; Truth lies; Peace wars; Plenty starves
    - section: Answer
      say: So the Ministry of Love is concerned with torture and pain, which is option B.
      write: 'Answer: B, torture and pain'
      answer: true
    traps:
      A: You chose peace and freedom. That is what the name pretends, but the ministry tortures.
      C: You went for joy and peace. That is the name's lie, Miniluv is a place of fear.
      D: You picked news and entertainment. That is the Ministry of Truth, where Winston works.
  18:
    moments:
    - section: The question
      say: Telescreens, the Thought Police, the torture rooms. Whose are they?
      write: Instruments of power belong to ... ?
    - section: Name it
      say: This is about who holds power in Oceania.
      write: Power in Oceania
    - section: The fact
      say: Oceania is ruled by one Party, Ingsoc, headed by Big Brother.
      write: The Party, Big Brother
    - say: The Party controls the ministries, the telescreens and the Thought Police.
      write: Party → ministries, telescreens, Thought Police
    - section: The words
      say: O'Brien tells Winston that the Party seeks power entirely for its own sake.
      write: '"The Party seeks power entirely for its own sake"'
    - section: Remember
      say: The Thought Police are the Party's hands. The Party is the owner.
      write: Thought Police = the hands; Party = the owner
    - section: Answer
      say: So the instruments of power and torture belong to the Party, which is option B.
      write: 'Answer: B, the Party'
      answer: true
    traps:
      A: You chose the proles. They are the poor masses, and they hold no power at all.
      C: You went for the Thought Police. They do the arresting, but they are the Party's tool.
      D: You picked individuals. In Oceania the individual has no power, the Party crushes him.
  19:
    moments:
    - section: The question
      say: Whose story is Nineteen Eighty-Four? Who is the action built around?
      write: The action is built around ... ?
    - section: Name it
      say: This is the protagonist, the central character the story follows.
      write: Protagonist = the central character
    - section: The fact
      say: The novel follows Winston Smith, from his secret diary to his arrest and breaking.
      write: 'Winston: diary → arrest → broken'
    - section: The story
      say: We see his work at the Ministry of Truth, his love for Julia, his trust in O'Brien and his torture.
      write: Work, Julia, O'Brien, torture
    - section: Why it matters
      say: Following one ordinary man lets us feel the Party's power from the inside.
      write: One man, from the inside
    - section: Remember
      say: It begins with Winston as the clocks strike thirteen, and ends with Winston loving Big Brother.
      write: Begins and ends with Winston
    - section: Answer
      say: So the action is built around Winston Smith, which is option A.
      write: 'Answer: A, Winston Smith'
      answer: true
    traps:
      B: You chose O'Brien. He matters, but he enters Winston's story, which the action follows.
      C: You went for Julia. She is Winston's lover, part of his story, not its centre.
      D: You picked Big Brother. His face is everywhere, but he never appears as a person.
  20:
    moments:
    - section: The question
      say: Winston spends his days rewriting old newspapers. Which ministry does he work for?
      write: Records Department, Ministry of ... ?
    - section: Name it
      say: This is the Ministry of Truth, Minitrue.
      write: Minitrue
    - section: The fact
      say: The Ministry of Truth handles news, entertainment, education and the arts. Winston works in its Records Department.
      write: Truth = news and records
    - section: The job
      say: He rewrites old articles so the past always agrees with the Party. The real records go down the memory hole.
      write: Rewrite the past; memory hole
    - section: Why it matters
      say: The Ministry of Truth's real work is lying. Winston's own job shows him how the Party controls the past.
      write: Truth tells lies
    - section: Remember
      say: Winston works where the truth is changed, the Ministry of Truth.
      write: Truth is changed at Minitrue
    - section: Answer
      say: So Winston works in the Ministry of Truth, which is option B.
      write: 'Answer: B, Truth'
      answer: true
    traps:
