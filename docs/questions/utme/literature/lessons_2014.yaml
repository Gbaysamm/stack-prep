# UTME 2014 Literature in English, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Literature teacher works on the board:
# the question, the term, device, character or event named, the definition or the fact, the
# exact words or the moment that show it, why it matters, a way to remember it, the trap, and
# the answer.
#
#   say:     heard, not read. Quoted lines read naturally, names said as written, years in
#            words, no symbols the voice would stop on.
#   write:   the one line written while it is said.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2014.yaml. Answers match that file. No question
# is dropped, so all 49 have a lesson.
format_version: 1
exam_year: 2014
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'A city has been burnt and its women wait to be carried away. Where were the gods?'
        write: 'Women of Owu: how are the gods portrayed?'
      - section: 'Name it'
        say: 'The gods in Femi Osofisan''s play are Anlugbua and his mother Lawumi.'
        write: 'The gods: Anlugbua and Lawumi'
      - section: 'The fact'
        say: 'In the play, the fall of Owu is the will of the gods. They decide it, and they also decide what will become of the conquering armies.'
        write: 'The gods decide the fate of Owu and of its conquerors'
      - section: 'Show it'
        say: 'So the destiny of the people is drawn up by the gods, not by the people themselves.'
        write: 'Gods = the planners of human destiny'
      - section: 'Why it matters'
        say: 'Osofisan wants us to question such gods. They shape destiny, yet they leave the women of Owu to suffer.'
        write: 'Theme: ordinary people pay for decisions made above them'
      - section: Remember
        say: 'Think of an architect. He draws the plan, and others must live in the house he draws.'
        write: 'Architect draws, the people live in it'
      - section: 'The trap'
        say: 'Do not choose helpless. The gods fail to protect Owu, but they have the power, and they use it.'
        write: 'Not helpless: they choose'
      - section: Answer
        say: 'So the gods are portrayed as architects of man''s destiny, which is option B.'
        write: 'Answer: B, architects of man''s destiny'
        answer: true
    traps:
      A: 'You chose helpless. The gods do not save Owu, but they are the ones deciding its fate, so they are not powerless.'
      C: 'You picked amorous. The gods in this play are concerned with power and punishment, not with love.'
      D: 'You went for saviours of mankind. The women of Owu are not saved. They are left to suffer.'

  3:
    moments:
      - section: 'The question'
        say: 'A young woman has watched her city burn. How does she speak of the general who burnt it?'
        write: 'Women of Owu: Orisaye on Balogun Kusa'
      - section: 'Name it'
        say: 'Orisaye is the daughter of Erelu, and she is one of the captive women of Owu.'
        write: 'Orisaye = Erelu''s daughter, a captive'
      - section: 'The fact'
        say: 'Balogun Kusa is a commander of the armies that sacked Owu and killed its men.'
        write: 'Balogun Kusa = a commander of the conquerors'
      - section: 'Show it'
        say: 'So to Orisaye he is an enemy, and a butcher of her people.'
        write: 'Kusa, to Orisaye: an enemy and a butcher'
      - section: 'Why it matters'
        say: 'The play shows war from the side of its victims. What the winner calls glory, the loser calls slaughter.'
        write: 'Theme: war seen by its victims'
      - section: Remember
        say: 'Always ask who is speaking. A woman of Owu will not praise the man who burnt her home.'
        write: 'Who is speaking? A victim'
      - section: Answer
        say: 'So Orisaye describes Balogun Kusa as an enemy and a butcher, which is option B.'
        write: 'Answer: B, an enemy and a butcher'
        answer: true
    traps:
      A: 'You chose a great warrior. Others might praise his fighting, but Orisaye is his captive, and she does not.'
      C: 'You picked a friend in need. Kusa helped to destroy her city, so he is no friend of hers.'
      D: 'You went for a good leader. To the women of Owu he leads the men who destroyed them.'

  4:
    moments:
      - section: 'The question'
        say: 'Every tragedy of a fallen city needs a queen to mourn it. Who is Erelu?'
        write: 'Women of Owu: who is Erelu?'
      - section: 'Name it'
        say: 'Erelu Afin is the leading woman of the play.'
        write: 'Erelu Afin'
      - section: 'The fact'
        say: 'She is the queen of Owu, the oldest wife of Oba Akinjobi, the king of Owu.'
        write: 'Erelu = oldest wife of Oba Akinjobi'
      - section: 'Show it'
        say: 'Osofisan reworks Euripides'' play The Trojan Women, and Erelu takes the place of Hecuba, the old queen of Troy.'
        write: 'Erelu = Hecuba of Troy'
      - section: 'Why it matters'
        say: 'Through her the grief of a whole city is seen in one royal woman.'
        write: 'A people''s grief in its queen'
      - section: Remember
        say: 'Erelu is a Yoruba title of high honour for a woman. Here it belongs to the king''s senior wife.'
        write: 'Erelu = honoured title, the Oba''s senior wife'
      - section: Answer
        say: 'So Erelu is the oldest wife of the Oba Akinjobi, which is option A.'
        write: 'Answer: A, the oldest wife of the Oba Akinjobi'
        answer: true
    traps:
      B: 'You chose a courtier to the Alaafin of Oyo. The Alaafin is a famous king, but Erelu belongs to the royal house of Owu.'
      C: 'You picked the most brilliant woman in Owu. The play shows her as its grieving queen, not its cleverest woman.'
      D: 'You went for a market woman from Apomu. Erelu is royalty, the wife of the Oba.'

  5:
    moments:
      - section: 'The question'
        say: 'A young captive speaks wild words about the future. What do the people around her call her?'
        write: 'Women of Owu: how is Orisaye regarded?'
      - section: 'Name it'
        say: 'Orisaye is Erelu''s daughter, and she is to be taken away by Balogun Kusa as his wife.'
        write: 'Orisaye, Erelu''s daughter'
      - section: 'The fact'
        say: 'Because of her wild words and behaviour, the people around her treat her as a lunatic.'
        write: 'Orisaye is thought mad'
      - section: 'Show it'
        say: 'She is Osofisan''s version of Cassandra of Troy, the prophetess everyone thought mad.'
        write: 'Orisaye = Cassandra'
      - section: 'Why it matters'
        say: 'Her madness carries truth. In her wild speech she sees the trouble waiting for the conquerors.'
        write: 'Madness that carries truth'
      - section: Remember
        say: 'Think of the madwoman in a village story whose strange words later come true.'
        write: 'The madwoman who is right'
      - section: Answer
        say: 'So Orisaye is regarded as a lunatic, which is option C.'
        write: 'Answer: C, a lunatic'
        answer: true
    traps:
      A: 'You chose goddess. She speaks about gods and the future, but she is a human woman.'
      B: 'You picked herbalist. Orisaye is not a healer. Her strangeness is in her wild speech.'
      D: 'You went for soldier. Orisaye is a captive woman of Owu, not a fighter.'

  6:
    moments:
      - section: 'The question'
        say: 'There is a storm, an island and a magician with helpers you cannot see. Who is Ariel?'
        write: 'The Tempest: who is Ariel?'
      - section: 'Name it'
        say: 'Ariel is an airy spirit who serves Prospero.'
        write: 'Ariel = an airy spirit'
      - section: 'The fact'
        say: 'He leads the island''s other spirits in carrying out Prospero''s commands.'
        write: 'Ariel leads the spirits'
      - section: 'Show it'
        say: 'Prospero praises him and his meaner fellows for their service. The meaner fellows are the lesser spirits he leads.'
        write: '''Thou and thy meaner fellows'' (Act 4)'
      - section: 'Why it matters'
        say: 'Ariel is the power behind Prospero''s magic, and he longs to be free until Prospero frees him at the end.'
        write: 'Ariel = Prospero''s magic; longs for freedom'
      - section: Remember
        say: 'Ariel sounds like air. He is the spirit of the air, chief of the spirits.'
        write: 'Ariel, air, chief spirit'
      - section: 'The trap'
        say: 'Careful with Sycorax. Ariel once served her, but her son is Caliban.'
        write: 'Sycorax''s son = Caliban'
      - section: Answer
        say: 'So Ariel is the leader of the spirits, which is option A.'
        write: 'Answer: A, leader of the spirits'
        answer: true
    traps:
      B: 'You chose Prospero''s daughter. That is Miranda.'
      C: 'You picked Alonso''s wife. She never appears in the play, and Ariel is a spirit.'
      D: 'You went for Sycorax''s son. That is Caliban. Ariel was only once her servant.'

  7:
    moments:
      - section: 'The question'
        say: 'When the storm begins, how long have Prospero and Miranda been on the island?'
        write: 'The Tempest: how long on the island?'
      - section: 'Name it'
        say: 'This is Prospero''s story of his exile, told to Miranda in Act 1 Scene 2.'
        write: 'Act 1 Scene 2: Prospero''s story'
      - section: 'The fact'
        say: 'He says, twelve year since, Miranda, twelve year since, thy father was the Duke of Milan.'
        write: '''Twelve year since, Miranda, twelve year since'''
      - section: 'Show it'
        say: 'His brother Antonio took his dukedom and set them adrift. Miranda was not yet three years old.'
        write: 'Then: Miranda under 3'
      - section: Check
        say: 'Under three then, plus twelve years, makes Miranda about fifteen now. That fits the young girl we meet.'
        write: 'Under 3 + 12 years = about 15'
      - section: Remember
        say: 'That is twelve years of exile, from a girl of three to a girl of fifteen.'
        write: '12 years: 3 to 15'
      - section: Answer
        say: 'So they have lived on the island for twelve years, which is option B.'
        write: 'Answer: B, twelve years'
        answer: true
    traps:
      A: 'You chose two decades. That would make Miranda over twenty, but she is about fifteen.'
      C: 'You picked forty days. That is far too short, because Miranda has grown up on the island.'
      D: 'You went for eighteen months. Prospero says twelve years, and he says it twice.'

  8:
    moments:
      - section: 'The question'
        say: 'Caliban once tried to harm Miranda. What does he himself say he wanted?'
        write: 'The Tempest: Caliban''s motive'
      - section: 'Name it'
        say: 'This is Caliban, the son of the witch Sycorax, now Prospero''s slave.'
        write: 'Caliban, Prospero''s slave'
      - section: 'The fact'
        say: 'When Prospero accuses him, Caliban says, thou didst prevent me, I had peopled else this isle with Calibans.'
        write: '''I had peopled else / This isle with Calibans'''
      - section: 'Show it'
        say: 'Peopled else means or else I would have filled. He wanted to fill the island with his own children.'
        write: 'Peopled else = or else I would have filled'
      - section: 'Why it matters'
        say: 'This is why Prospero keeps him as a slave, and it raises the question of who owns the island.'
        write: 'Why Caliban is a slave; who owns the isle?'
      - section: Remember
        say: 'Peopled with Calibans means populated with Calibans.'
        write: 'Peopled = populated'
      - section: Answer
        say: 'So his desire was to populate the island with Calibans, which is option C.'
        write: 'Answer: C, populate the island with Calibans'
        answer: true
    traps:
      A: 'You chose destroy the island. Caliban loves the island and claims it. He does not want it destroyed.'
      B: 'You picked compete with Ferdinand. Ferdinand had not yet come to the island when this happened.'
      D: 'You went for marry her. Caliban never speaks of marriage. His words are about peopling the isle.'

  9:
    moments:
      - section: 'The question'
        say: 'Every character in The Tempest stands for something. Who stands for savagery?'
        write: 'The Tempest: the character of savagery'
      - section: 'Name it'
        say: 'The list of characters calls Caliban a savage and deformed slave.'
        write: 'Caliban, ''a savage and deformed slave'''
      - section: 'Show it'
        say: 'He curses, he attacks Miranda, and he plots with Stephano and Trinculo to kill Prospero.'
        write: 'Curses, the attack, the murder plot'
      - section: 'Why it matters'
        say: 'He is set against civilised Prospero. Yet he speaks beautiful lines about the island, so we must ask what savage really means.'
        write: 'Savage against civilised'
      - section: Remember
        say: 'Caliban sounds close to cannibal, a word the audience linked with savages.'
        write: 'Caliban, cannibal'
      - section: 'The trap'
        say: 'Stephano joins the plot, but he is a drunken butler. He stands for folly, not savagery.'
        write: 'Stephano = drunken folly'
      - section: Answer
        say: 'So the character associated with savagery is Caliban, which is option C.'
        write: 'Answer: C, Caliban'
        answer: true
    traps:
      A: 'You chose Ariel. Ariel is a delicate spirit of the air, linked with music and magic.'
      B: 'You picked Stephano. He is a drunken butler who stands for folly, not savagery.'
      D: 'You went for Ferdinand. He is the gentle prince who loves Miranda.'

  10:
    moments:
      - section: 'The question'
        say: 'How did a duke lose his whole dukedom to his own brother?'
        write: 'The Tempest: what kind of man is Prospero?'
      - section: 'Name it'
        say: 'This is Prospero, once the Duke of Milan.'
        write: 'Prospero, Duke of Milan'
      - section: 'The fact'
        say: 'He says he cast the government upon his brother, and grew a stranger to his state, rapt in secret studies.'
        write: '''rapt in secret studies'''
      - section: 'Show it'
        say: 'He also says, my library was dukedom large enough. His books mattered more than ruling.'
        write: '''my library / Was dukedom large enough'''
      - section: 'Why it matters'
        say: 'His love of study lost him Milan, but it also gave him the magic that brings his enemies to the island.'
        write: 'Study: his fault and his strength'
      - section: Remember
        say: 'Prospero chose the library over the throne.'
        write: 'Library over throne'
      - section: Answer
        say: 'So Prospero is portrayed as more interested in studying than in governance, which is option B.'
        write: 'Answer: B, more interested in studying than in governance'
        answer: true
    traps:
      A: 'You chose full of mistrust for everybody. He is watchful, but he trusts Gonzalo and Ariel.'
      C: 'You picked dependent on the spirits. The spirits serve him, and he commands them by his art.'
      D: 'You went for eager to conquer the world. He wants only his own dukedom back.'

  11:
    moments:
      - section: 'The question'
        say: 'A woman in her prime is hard-working and respected. What is missing?'
        write: 'A Woman in Her Prime: the theme'
      - section: 'Name it'
        say: 'The heroine of Asare Konadu''s novel is Pokuwaa.'
        write: 'Pokuwaa, the heroine'
      - section: 'The fact'
        say: 'Pokuwaa longs for a child, and the whole novel follows her quest for one.'
        write: 'Her quest for a child'
      - section: 'Show it'
        say: 'Her married life, her visits to the gods and the sacrifices she makes all turn on this one longing.'
        write: 'Married life, gods, sacrifices: all for a child'
      - section: 'Why it matters'
        say: 'It shows how much the society values children, and how heavily childlessness weighs on a woman.'
        write: 'Children valued; childlessness a heavy load'
      - section: Remember
        say: 'Pokuwaa''s life in the novel is one long journey towards a child.'
        write: 'One long journey to a child'
      - section: Answer
        say: 'So the novel explores the child quest of an African woman, which is option D.'
        write: 'Answer: D, child quest of an African woman'
        answer: true
    traps:
      A: 'You chose exploitation of the African woman. Pokuwaa suffers from childlessness, not from being exploited.'
      B: 'You picked sex discrimination in Ghana. The novel''s concern is her longing for a child.'
      C: 'You went for women liberation in Nigeria. The novel is set in Ghana, and it is about childlessness.'

  12:
    moments:
      - section: 'The question'
        say: 'In Pokuwaa''s village, what is the worst thing that can happen to a woman?'
        write: 'A Woman in Her Prime: the worst calamity'
      - section: 'Name it'
        say: 'This is the great fear of the novel, and it is Pokuwaa''s own sorrow.'
        write: 'Pokuwaa''s sorrow'
      - section: 'The fact'
        say: 'The worst calamity is barrenness, being unable to bear any child at all.'
        write: 'Barrenness = unable to bear a child'
      - section: 'Show it'
        say: 'Pokuwaa is hard-working and respected, yet people pity her, because she has no child.'
        write: 'Everything, but no child'
      - section: 'Why it matters'
        say: 'In this society a woman''s worth is measured by the children she bears.'
        write: 'Worth measured by children'
      - section: Remember
        say: 'She can have everything else, but without a child she is still pitied.'
        write: 'No child, still pitied'
      - section: Answer
        say: 'So the worst calamity is barrenness, which is option D.'
        write: 'Answer: D, barrenness'
        answer: true
    traps:
      A: 'You chose inability to bear male children. Pokuwaa''s sorrow is having no child at all.'
      B: 'You picked inability to marry. Pokuwaa does marry. Marriage is not what she lacks.'
      C: 'You went for divorce. The sorrow at the heart of the novel is having no child, not a broken marriage.'

  13:
    moments:
      - section: 'The question'
        say: 'Every novel has a place. Where does Pokuwaa''s story happen?'
        write: 'A Woman in Her Prime: the setting'
      - section: 'Name it'
        say: 'Setting means the place and time where a story happens.'
        write: 'Setting = where and when'
      - section: 'The fact'
        say: 'This novel is set in a farming village in rural Ghana, among the Akan people.'
        write: 'A farming village in rural Ghana'
      - section: 'Show it'
        say: 'Pokuwaa farms her land, visits the village shrine and lives by the village customs.'
        write: 'Farm, shrine, customs'
      - section: 'Why it matters'
        say: 'Her quest for a child is shaped by the beliefs of that traditional village.'
        write: 'The village shapes her quest'
      - section: Remember
        say: 'Asare Konadu was Ghanaian, and his novel stays in the village, far from the big towns.'
        write: 'Ghana, village, not city'
      - section: Answer
        say: 'So the novel is set in a farming village in rural Ghana, which is option B.'
        write: 'Answer: B, a farming village in rural Ghana'
        answer: true
    traps:
      A: 'You chose a city suburb in Nigeria. The novel is set in Ghana, in a village.'
      C: 'You picked Accra. It is in Ghana, but the story stays in a rural village.'
      D: 'You went for a mission school. The story follows a village woman and her farm.'

  14:
    moments:
      - section: 'The question'
        say: 'A new priest changes the way St. Agnes worships. What does he insist on?'
        write: 'Purple Hibiscus: Father Benedict''s changes'
      - section: 'Name it'
        say: 'Father Benedict is the white parish priest of St. Agnes in Enugu.'
        write: 'Father Benedict, St. Agnes, Enugu'
      - section: 'The fact'
        say: 'Kambili says he insisted that the Credo and kyrie be recited only in Latin, and Igbo was not acceptable.'
        write: '''the Credo and kyrie be recited only in Latin'''
      - section: 'Show it'
        say: 'Papa admires this. The priest''s European ways match his own scorn for Igbo tradition.'
        write: 'Papa admires Latin'
      - section: 'Why it matters'
        say: 'Later Father Amadi sings Igbo songs at Mass, and Kambili grows by learning from him.'
        write: 'Benedict against Amadi'
      - section: Remember
        say: 'Benedict means Latin, and Amadi means Igbo.'
        write: 'Benedict = Latin; Amadi = Igbo'
      - section: Answer
        say: 'So one change is that the Kyrie must be rendered only in Latin, which is option C.'
        write: 'Answer: C, the Kyrie only in Latin'
        answer: true
    traps:
      A: 'You chose fasting every month. That is not among Father Benedict''s changes.'
      B: 'You picked the Credo in Igbo. That is the opposite. Father Benedict made Igbo unacceptable.'
      D: 'You went for holy communion. That is not one of the changes he made.'

  15:
    moments:
      - section: 'The question'
        say: 'Here is a rich man, a generous giver and a father his children fear. Who is Eugene Achike?'
        write: 'Purple Hibiscus: how is Eugene portrayed?'
      - section: 'Name it'
        say: 'Eugene Achike is Kambili''s father, called Papa.'
        write: 'Eugene Achike = Papa'
      - section: 'The fact'
        say: 'He is a fanatical Catholic, strict, rigid and violent in his faith.'
        write: 'A fanatical Catholic'
      - section: 'Show it'
        say: 'He beats his family for small religious failings, and calls his own father, Papa Nnukwu, a heathen.'
        write: 'Beatings; Papa-Nnukwu called a heathen'
      - section: 'Why it matters'
        say: 'His fanaticism is the main source of fear in the family, and of the rebellion that follows.'
        write: 'Fear, then rebellion'
      - section: Remember
        say: 'Eugene measures everything, even love, by his Catholic rules.'
        write: 'Love measured by rules'
      - section: Answer
        say: 'So Eugene is portrayed as a fanatical Catholic adherent, which is option C.'
        write: 'Answer: C, a fanatical Catholic adherent'
        answer: true
    traps:
      A: 'You chose a soft and gentle husband. He beats his wife, so he is not gentle.'
      B: 'You picked an uncompromising traditionalist. He is uncompromising, but against tradition.'
      D: 'You went for a tough retired soldier. He owns factories and a newspaper.'

  16:
    moments:
      - section: 'The question'
        say: 'One family has four members. Whose story is Purple Hibiscus?'
        write: 'Purple Hibiscus: who is central?'
      - section: 'Name it'
        say: 'Kambili Achike is Eugene''s fifteen year old daughter, and she tells the story.'
        write: 'Kambili, the narrator'
      - section: 'The fact'
        say: 'The theme is her growth, from a frightened, silent girl to a young woman with a voice.'
        write: 'Silence to voice'
      - section: 'Show it'
        say: 'At Aunty Ifeoma''s home in Nsukka, she learns to laugh, to sing and to love.'
        write: 'Nsukka: laughter and song'
      - section: 'Why it matters'
        say: 'The novel is a coming of age story, so its themes are all seen through her change.'
        write: 'Coming of age'
      - section: Remember
        say: 'The purple hibiscus is a rare flower in Aunty Ifeoma''s garden. Kambili is the flower that learns to bloom.'
        write: 'Kambili = the flower that blooms'
      - section: Answer
        say: 'So the character central to the theme is Kambili, which is option A.'
        write: 'Answer: A, Kambili'
        answer: true
    traps:
      B: 'You chose Mama. She suffers and acts in the end, but the story is told through Kambili.'
      C: 'You picked Sisi. She is the house help, a minor character.'
      D: 'You went for Jaja. His rebellion matters, but the novel follows Kambili''s growth in her own voice.'

  17:
    moments:
      - section: 'The question'
        say: 'An old man goes eighty-four days without a fish, and then a giant is on the line. What is it?'
        write: 'The Old Man and the Sea: the great fish'
      - section: 'Name it'
        say: 'Santiago is the old Cuban fisherman of the story.'
        write: 'Santiago, the old fisherman'
      - section: 'The fact'
        say: 'He hooks a giant marlin, and after two days and nights he kills it.'
        write: 'A giant marlin'
      - section: 'Show it'
        say: 'The marlin is longer than his skiff. On the way home, sharks eat it down to the skeleton.'
        write: 'Longer than the skiff; sharks eat it'
      - section: 'Why it matters'
        say: 'The marlin is a worthy opponent. Santiago loves and respects it, even as he kills it.'
        write: 'A worthy opponent'
      - section: Remember
        say: 'The marlin is the prize, and the sharks are the thieves.'
        write: 'Marlin = prize, sharks = thieves'
      - section: Answer
        say: 'So the fish Santiago catches after days of effort is a marlin, which is option C.'
        write: 'Answer: C, marlin'
        answer: true
    traps:
      A: 'You chose shark. The sharks come afterwards to eat the catch. The fish he fought for days is the marlin.'
      B: 'You picked iris. An iris is a flower, not a fish.'
      D: 'You went for geisha. A geisha is a Japanese entertainer, not a fish.'

  18:
    moments:
      - section: 'The question'
        say: 'An old man loses his great fish to the sharks. So what is the story really about?'
        write: 'The Old Man and the Sea: the theme'
      - section: 'Name it'
        say: 'A theme is the main idea a story shows, not just what happens in it.'
        write: 'Theme = the main idea'
      - section: 'The fact'
        say: 'Santiago says, man is not made for defeat. A man can be destroyed but not defeated.'
        write: '''A man can be destroyed but not defeated'''
      - section: 'Show it'
        say: 'He comes home with only a skeleton, yet he plans to fish again.'
        write: 'Only a skeleton, yet he will fish again'
      - section: 'Why it matters'
        say: 'For Hemingway, dignity lies in how a man fights, not in whether he wins.'
        write: 'Dignity in the fight'
      - section: Remember
        say: 'He is destroyed, but not defeated.'
        write: 'Destroyed, not defeated'
      - section: Answer
        say: 'So the novel demonstrates the struggle of man against defeat, which is option D.'
        write: 'Answer: D, struggle of man against defeat'
        answer: true
    traps:
      A: 'You chose attempt to catch fish. That is the event. The theme is the struggle against defeat it shows.'
      B: 'You picked desire to understand life. Santiago sets out to endure and fight, not to explain life.'
      C: 'You went for influence of the sea on man. The sea is the setting. The theme is man''s struggle.'

  19:
    moments:
      - section: 'The question'
        say: 'An old man is alone at sea for days. How does he feel about the sea and its creatures?'
        write: 'The Old Man and the Sea: Santiago and nature'
      - section: 'Name it'
