# UTME 2015 Literature in English, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Literature teacher works on the board:
# the question, the term, device, character or event named, the definition or the fact, the
# exact words or the moment that show it, why it matters, a way to remember it, the trap, and
# the answer.
#
#   say:     heard, not read. Quoted lines read naturally, names said as written, years in
#            words, no symbols the voice would stop on.
#   write:   the one line written while it is said.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2015.yaml. Answers match that file. No question
# is dropped, so all 50 have a lesson.
format_version: 1
exam_year: 2015
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'Two lovers are woken by the morning sun, and the poet tells it off. What figure of speech is he using?'
        write: 'Donne, The Sun Rising: the figure of speech?'
      - section: 'Name it'
        say: 'The figure is personification.'
        write: 'Personification'
      - section: 'The definition'
        say: 'Personification gives human qualities, feelings or actions to something that is not human.'
        write: 'Personification = human qualities given to a non-human thing'
      - section: 'Show it'
        say: 'Donne calls the sun a busy old fool, and unruly. He asks why it calls on the lovers through windows and through curtains.'
        write: '''Busy old fool, unruly Sun'''
      - section: 'Why it matters'
        say: 'Only a person can be a fool or come calling. The sun becomes a nosy old man walking into the lovers'' room, and the effect is bold and funny.'
        write: 'The sun = a nosy old visitor'
      - section: 'The trap'
        say: 'There is no like or as here. The sun is not compared to a fool, it is treated as one.'
        write: 'No like or as, so not a simile'
      - section: Answer
        say: 'So the most vivid figure of speech is personification, which is option C.'
        write: 'Answer: C, personification'
        answer: true
    traps:
      A: 'You chose simile. A simile needs like or as, and there is none here. The sun is treated as a person.'
      B: 'You picked diction. Diction is the poet''s choice of words in general, not a figure of speech.'
      D: 'You went for pun. A pun plays on two meanings of one word, and no word here has two meanings.'

  2:
    moments:
      - section: 'The question'
        say: 'A speaker remembers the great rivers of the world. What kind of allusion does Langston Hughes use?'
        write: 'The Negro Speaks of Rivers: kind of allusion?'
      - section: 'The term'
        say: 'An allusion is a short reference to a person, place or event the reader is expected to know.'
        write: 'Allusion = a brief reference to something known'
      - section: 'Show it'
        say: 'The speaker bathed in the Euphrates, built a hut by the Congo, raised the pyramids above the Nile, and heard the Mississippi sing when Abraham Lincoln went down to New Orleans.'
        write: 'Euphrates, Congo, Nile, Mississippi'
      - section: 'The point'
        say: 'Each river marks a moment in the history of black people, from the first civilisations to slavery in America.'
        write: 'Each river = a stage in black history'
      - section: 'Why it matters'
        say: 'The rivers carry the long memory of a people, so the speaker''s soul has grown as deep as they are.'
        write: 'A people''s memory, deep as rivers'
      - section: 'The trap'
        say: 'The Euphrates is in the Bible, but the poem does not retell a Bible story. It uses the river as a cradle of human history.'
        write: 'Not biblical: history'
      - section: Answer
        say: 'So the allusion is mainly historical, which is option D.'
        write: 'Answer: D, historical'
        answer: true
    traps:
      A: 'You chose biblical. The Euphrates appears in the Bible, but here it marks a stage in history, not a Bible story.'
      B: 'You picked classical. There is no reference to Greek or Roman myth.'
      C: 'You went for literary. The poem does not refer to other books or writers.'

  3:
    moments:
      - section: 'The question'
        say: 'A poet names a chemical in his poem. What is sodium cyanide?'
        write: 'Adeoti, Hard Lines: sodium cyanide is?'
      - section: 'The fact'
        say: 'Sodium cyanide is a deadly poison. A very small amount can kill.'
        write: 'Sodium cyanide = a deadly poison'
      - section: 'How an image works'
        say: 'When a poet names a real thing, what we know about it comes into the poem with it.'
        write: 'A named thing brings its meaning'
      - section: 'Why it matters'
        say: 'So naming sodium cyanide brings the idea of something deadly and destructive.'
        write: 'Image of something deadly'
      - section: Remember
        say: 'Cyanide is the poison of crime stories, and of illegal mining that kills the fish in rivers.'
        write: 'Cyanide = poison'
      - section: 'The trap'
        say: 'Do not choose adhesive. A glue sticks things together, but sodium cyanide poisons.'
        write: 'Not glue'
      - section: Answer
        say: 'So sodium cyanide is poisonous, which is option A.'
        write: 'Answer: A, poisonous'
        answer: true
    traps:
      B: 'You chose adhesive. Sodium cyanide is not a glue, it is a poison.'
      C: 'You picked sweet. Sodium cyanide is known for killing, not for sweetness.'
      D: 'You went for fragrant. It is not a perfume, it is a deadly poison.'

  4:
    moments:
      - section: 'The question'
        say: 'Say the title aloud. Homeless, not Hopeless. What sound device do you hear?'
        write: 'Homeless, not Hopeless: the repeated h sound'
      - section: 'Name it'
        say: 'The device is alliteration.'
        write: 'Alliteration'
      - section: 'The definition'
        say: 'Alliteration is the repetition of the same consonant sound at the start of words close together.'
        write: 'Alliteration = same consonant sound at the start'
      - section: 'Show it'
        say: 'Homeless and Hopeless both begin with the h sound, side by side in the title.'
        write: '**H**omeless, **H**opeless'
      - section: 'Why it matters'
        say: 'The matching sound ties the two words together, so their difference stands out. Without a home, but not without hope.'
        write: 'Same sound, different meaning'
      - section: Remember
        say: 'Think of Peter Piper picked a peck. Alliteration lives at the start of the words.'
        write: 'Peter Piper picked'
      - section: 'The trap'
        say: 'Assonance repeats vowel sounds. Here the repeated sound is the consonant h.'
        write: 'Assonance = vowels'
      - section: Answer
        say: 'So the repeated h sound is alliteration, which is option C.'
        write: 'Answer: C, alliteration'
        answer: true
    traps:
      A: 'You chose rhyme. Rhyme matches the ending sounds of words, but the point here is the first sound.'
      B: 'You picked onomatopoeia. That is a word that imitates a sound, like buzz, and neither word does.'
      D: 'You went for assonance. Assonance repeats vowels, but the repeated sound here is the consonant h.'

  5:
    moments:
      - section: 'The question'
        say: 'A man stands beneath a window at night and sings a love song. Who is he?'
        write: 'Serenade: who sings it?'
      - section: 'The term'
        say: 'A serenade is a love song sung or played at night, often under the window of the beloved.'
        write: 'Serenade = a night love song to a beloved'
      - section: 'The singer'
        say: 'The singer is a suitor, a man seeking a woman''s love, who hopes she will look out and accept him.'
        write: 'Suitor = a man courting a woman'
      - section: 'Why it matters'
        say: 'A poem called Serenade borrows this setting, a lover''s voice pleading in the evening.'
        write: 'A lover''s plea'
      - section: Remember
        say: 'Picture a young man with a guitar under a window. He is courting, so he is a suitor.'
        write: 'Guitar under the window'
      - section: 'The trap'
        say: 'A passer-by does not stop to sing. The serenade is aimed at one beloved.'
        write: 'Not a passer-by'
      - section: Answer
        say: 'So the singer of a serenade is a suitor, which is option A.'
        write: 'Answer: A, suitor'
        answer: true
    traps:
      B: 'You chose mother. A mother sings a lullaby to her baby, not a serenade to a lover.'
      C: 'You picked spinster. The serenade is sung to the beloved, traditionally by a man who courts her.'
      D: 'You went for passer-by. A passer-by has no beloved to court.'

  6:
    moments:
      - section: 'The question'
        say: 'Protest poets often speak for the peasants. What is a peasant?'
        write: 'What is a peasant?'
      - section: 'The meaning'
        say: 'A peasant is a poor farmer or farm worker of low social standing, who works the land.'
        write: 'Peasant = poor farm worker, low standing'
      - section: 'Show it'
        say: 'Often the peasant works land owned by others, and earns little for it.'
        write: 'Works the land, often for others'
      - section: 'Why it matters'
        say: 'Protest poetry sets the peasant against the rich and the ruler. You must know whose side the poem is on.'
        write: 'Peasant against ruler'
      - section: Remember
        say: 'Think of the poor farmer with his hoe on a small plot, not the man who owns the big farm.'
        write: 'The man with the hoe'
      - section: 'The trap'
        say: 'The rich owners of large estates are the landlords, the very opposite of peasants.'
        write: 'Landlord is not peasant'
      - section: Answer
        say: 'So a peasant is one of the poor farm workers of low social standing, which is option D.'
        write: 'Answer: D, poor farm workers of low social standing'
        answer: true
    traps:
      A: 'You chose rich owners of large estates. They are the opposite of peasants, who are poor.'
      B: 'You picked politicians. Politicians rule, and peasants are the poor who are ruled.'
      C: 'You went for traders in the city. Peasants work the land, not in city markets.'

  7:
    moments:
      - section: 'The question'
        say: 'A title is the first clue to a poem. What does the title Expelled tell us?'
        write: 'Angira, Expelled: what does the title tell us?'
      - section: 'The word'
        say: 'To be expelled is to be driven out, or forced to leave a place, a school or a group.'
        write: 'Expelled = driven out'
      - section: 'Show it'
        say: 'So the title tells us at once that the poem deals with someone who has been put out.'
        write: 'Someone put out'
      - section: 'Why it matters'
        say: 'Reading the title well tells you what to look for in the poem before you start.'
        write: 'The title = the first clue'
      - section: Remember
        say: 'A student expelled from school is sent away for good. The word always means being driven out.'
        write: 'Expelled from school = sent away'
      - section: 'The trap'
        say: 'Welcomed home is the very opposite of being expelled.'
        write: 'Welcomed is the opposite'
      - section: Answer
        say: 'So the title tells us someone has been driven out, which is option B.'
        write: 'Answer: B, driven out'
        answer: true
    traps:
      A: 'You chose welcomed home. That is the opposite of being expelled.'
      C: 'You picked honoured with a title. To be honoured is to be praised, not driven out.'
      D: 'You went for healed of sickness. Expelled has nothing to do with healing.'

  8:
    moments:
      - section: 'The question'
        say: 'Read the end of Fletcher''s first line. Does the sense stop there, or run on?'
        write: 'Fletcher: the soul that can / Render'
      - section: 'Name it'
        say: 'When the sense runs on from one line into the next with no pause, the device is enjambment.'
        write: 'Enjambment'
      - section: 'The definition'
        say: 'Enjambment is the running on of the sense and grammar over the end of a line of verse.'
        write: 'Enjambment = sense runs over the line end'
      - section: 'Show it'
        say: 'The first line ends with, the soul that can. We must read on to render an honest and a perfect man before the sense is whole.'
        write: '''the soul that can / Render an honest and a perfect man'''
      - section: 'Why it matters'
        say: 'The run on gives a smooth, flowing movement that carries the argument forward. The honest soul is master of its fate.'
        write: 'Flow carries the argument'
      - section: Remember
        say: 'Enjambment is a sentence that steps over the edge of the line, like a runner who keeps going past the line.'
        write: 'Steps over the edge'
      - section: 'The trap'
        say: 'A caesura is a pause inside a line, like the break after man is his own star. The question asks about the run over the line end.'
        write: 'Caesura = pause inside the line'
      - section: Answer
        say: 'So the device is enjambment, which is option C.'
        write: 'Answer: C, enjambment'
        answer: true
    traps:
      A: 'You chose synecdoche. That puts a part for the whole, but the question is about how the lines run on.'
      B: 'You picked antithesis. That sets opposites side by side, but the question is about the line end.'
      D: 'You went for caesura. A caesura is a pause inside a line, not a run over the end of one.'

  9:
    moments:
      - section: 'The question'
        say: 'How does Raleigh give The Soul''s Errand its strong beat?'
        write: 'Raleigh, The Soul''s Errand: how is rhythm made?'
      - section: 'The term'
        say: 'Rhythm is the beat and flow of a poem''s sounds. Repetition is one of the strongest ways to build it.'
        write: 'Rhythm = beat and flow'
      - section: 'Show it'
        say: 'The speaker sends his soul to the court, the church and the rulers. Stanza after stanza repeats the same commands, and ends on the same refrain about giving them the lie.'
        write: 'Same commands, same refrain, every stanza'
      - section: 'Why it matters'
        say: 'The repeated pattern beats like a drum, and drives home the charge against each false institution.'
        write: 'A drum beat of accusation'
      - section: Remember
        say: 'A chorus that comes back in every verse of a song makes you tap your feet. The poem works the same way.'
        write: 'The chorus makes the beat'
      - section: 'The trap'
        say: 'The poem has images, but its rhythm comes from what keeps coming back, not from comparisons.'
        write: 'Not metaphor'
      - section: Answer
        say: 'So rhythm is achieved through repetition, which is option C.'
        write: 'Answer: C, repetition'
        answer: true
    traps:
      A: 'You chose metaphor. Metaphors give images, but the beat comes from the repeated commands and refrain.'
      B: 'You picked alliteration. There is a little, but it does not drive the rhythm of the whole poem.'
      D: 'You went for antithesis. That sets opposites against each other, but the rhythm comes from repetition.'

  10:
    moments:
      - section: 'The question'
        say: 'Ambassadors of Poverty. What device is in that title?'
        write: 'Umeh, Ambassadors of Poverty: the device?'
      - section: 'Name it'
        say: 'The device is irony.'
        write: 'Irony'
      - section: 'The definition'
        say: 'Irony is a contrast between what the words lead us to expect and what is really meant, or really so.'
        write: 'Irony = expectation against reality'
      - section: 'Show it'
        say: 'An ambassador is an honoured envoy who lives in comfort. Joined to poverty, the grand title clashes with want and lack.'
        write: 'Ambassador (honour) + poverty (want)'
      - section: 'Why it matters'
        say: 'The poor are given a grand title, and the grand title becomes a mockery of their condition.'
        write: 'A grand name for a hard life'
      - section: Remember
        say: 'It is like calling a road full of potholes the express highway. The name and the reality pull apart.'
        write: 'Pothole road called express highway'
      - section: 'The trap'
        say: 'Nothing in the title is repeated, so it is not repetition.'
        write: 'No repetition'
      - section: Answer
        say: 'So the title is an irony, which is option D.'
        write: 'Answer: D, an irony'
        answer: true
    traps:
      A: 'You chose repetition. No word or sound in the title is repeated.'
      B: 'You picked simile. There is no like or as in the title.'
      C: 'You went for alliteration. The words do not begin with the same consonant sound.'

  11:
    moments:
      - section: 'The question'
        say: 'Which device repeats a consonant sound in quick succession?'
        write: 'Repeated consonant sound: which device?'
      - section: 'Name it'
        say: 'The device is alliteration.'
        write: 'Alliteration'
      - section: 'The definition'
        say: 'Alliteration is the repetition of the same consonant sound, usually at the start of words close together.'
        write: 'Alliteration = repeated consonant sounds'
      - section: 'Show it'
        say: 'Peter Piper picked a peck of pickled pepper. Hear the p sound again and again.'
        write: '**P**eter **P**iper **p**icked a **p**eck'
      - section: 'Why it matters'
        say: 'Poets use it to make lines memorable and to echo their meaning, hard sounds for harshness, soft sounds for calm.'
        write: 'Memorable, echoes meaning'
      - section: Remember
        say: 'Alliteration takes consonants. Assonance takes vowels.'
        write: 'Alliteration = consonants, assonance = vowels'
      - section: Answer
        say: 'So the repetition of a consonant sound is alliteration, which is option A.'
        write: 'Answer: A, alliteration'
        answer: true
    traps:
      B: 'You chose pun. A pun plays on two meanings of a word, not on repeated sounds.'
      C: 'You picked onomatopoeia. That is a word that imitates a sound, like buzz or crash.'
      D: 'You went for assonance. Assonance repeats vowel sounds, not consonants.'

  12:
    moments:
      - section: 'The question'
        say: 'A plot whose acts follow one another but do not cause one another. What is it called?'
        write: 'Acts without probable or necessary sequence'
      - section: 'Name it'
        say: 'It is an episodic plot.'
        write: 'Episodic plot'
      - section: 'The definition'
        say: 'Aristotle called a plot episodic when its episodes follow one another without probable or necessary sequence.'
        write: 'Episodic = events not linked by cause'
      - section: 'Show it'
        say: 'In such a plot you could move or remove a scene and the story would still stand. The events are only strung together.'
        write: 'Scenes strung together'
      - section: 'Why it matters'
        say: 'For Aristotle, a good plot links each event to the next by cause. The episodic plot is the weaker kind.'
        write: 'Cause links a strong plot'
      - section: Remember
        say: 'Think of a string of separate comedy skits with the same actors. Each episode stands alone.'
        write: 'Skits, not a story'
      - section: 'The trap'
        say: 'A linear plot runs in time order, and each event can still cause the next. Episodic means the events are not linked.'
        write: 'Linear = in time order'
      - section: Answer
        say: 'So such a plot is called episodic, which is option A.'
        write: 'Answer: A, episodic'
        answer: true
    traps:
      B: 'You chose simple. A simple plot has one line of action, but it is still connected.'
      C: 'You picked linear. Linear means in time order, not without links between events.'
      D: 'You went for convoluted. That means twisted and complex, not merely unconnected.'

  13:
    moments:
      - section: 'The question'
        say: 'A play stops its present action and goes back to an earlier scene. What is that technique?'
        write: 'Recalling an earlier scene: which technique?'
      - section: 'Name it'
        say: 'It is the flashback.'
        write: 'Flashback'
      - section: 'The definition'
        say: 'A flashback is a scene or passage that goes back to events before the present action of the story.'
        write: 'Flashback = a return to earlier events'
      - section: 'Why it matters'
        say: 'It fills in the past, explains why characters act as they do, and builds suspense.'
        write: 'Fills in the past, explains motives'
      - section: Remember
        say: 'In a film, when the screen goes misty and we see the hero as a child, that is a flashback.'
        write: 'Misty screen, hero as a child'
      - section: 'The trap'
        say: 'An interlude is a short entertainment between acts. It does not go back in time.'
        write: 'Interlude = between acts'
      - section: Answer
        say: 'So the technique is the flashback, which is option B.'
        write: 'Answer: B, flashback'
        answer: true
    traps:
      A: 'You chose climax. The climax is the point of highest tension, not a look back.'
      C: 'You picked interlude. That is a short piece between acts, not a recall of earlier action.'
      D: 'You went for catharsis. That is the release of pity and fear in a tragedy''s audience.'

  14:
    moments:
      - section: 'The question'
        say: 'What does literary criticism seek to do?'
        write: 'Literary criticism seeks to?'
      - section: 'The definition'
        say: 'Literary criticism is the analysis, interpretation and evaluation of literary works.'
        write: 'Criticism = analyse, interpret, evaluate'
      - section: 'Show it'
        say: 'A critic studies how a work is made, what it means and how well it succeeds, its strengths as well as its weaknesses.'
        write: 'Strengths and weaknesses'
      - section: 'Why it matters'
        say: 'Criticism helps readers see more in a work, and judge it fairly.'
        write: 'See more, judge fairly'
      - section: Remember
        say: 'A football analyst reviews the whole match, not only the mistakes. A literary critic does the same with a book.'
        write: 'Like a match analyst'
      - section: 'The trap'
        say: 'In everyday talk, to criticise is to find fault. In literature, criticism weighs the good as well as the bad.'
        write: 'Not only fault-finding'
      - section: Answer
        say: 'So criticism seeks to analyse and evaluate a literary work, which is option B.'
        write: 'Answer: B, analyse and evaluate a literary work'
        answer: true
    traps:
      A: 'You chose find faults. That is only the everyday meaning. Criticism weighs strengths too.'
      C: 'You picked compare and contrast novels. That is one method, but criticism covers all kinds of works.'
      D: 'You went for discover the beauty. That is part of it, but criticism also analyses and judges.'

  15:
    moments:
      - section: 'The question'
        say: 'An actor speaks to the audience while the others on stage do not hear him. What is this called?'
        write: 'Speech to the audience, unheard by others'
      - section: 'Name it'
        say: 'It is an aside.'
        write: 'Aside'
      - section: 'The definition'
        say: 'An aside is a short speech to the audience, made while other characters are on stage. By the rules of the stage, they do not hear it.'
        write: 'Aside = spoken to the audience, others present but not hearing'
      - section: 'Why it matters'
        say: 'It lets us into a character''s secret thoughts, so we know what the others do not. That is dramatic irony.'
        write: 'Creates dramatic irony'
      - section: Remember
        say: 'An aside is spoken to one side, like a whisper behind the hand.'
        write: 'A whisper behind the hand'
      - section: 'The trap'
        say: 'A soliloquy is spoken by a character alone on stage. An aside is spoken with others present.'
        write: 'Soliloquy = alone'
      - section: Answer
        say: 'So this is called an aside, which is option C.'
        write: 'Answer: C, aside'
        answer: true
    traps:
      A: 'You chose soliloquy. A soliloquy is spoken alone on stage, not in front of others who fail to hear.'
      B: 'You picked chorus. The chorus comments on the action for all to hear.'
      D: 'You went for solo. A solo is a piece performed by one person, not this technique.'

  16:
    moments:
      - section: 'The question'
        say: 'A band of singers and dancers links the play to the audience. What is it called?'
        write: 'Singers and dancers linking play and audience'
      - section: 'Name it'
        say: 'It is the chorus.'
        write: 'Chorus'
      - section: 'The fact'
        say: 'In Greek drama the chorus was a group of singers and dancers who commented on the action and spoke to the audience.'
        write: 'Chorus = group that sings, dances, comments'
      - section: 'Why it matters'
        say: 'The chorus explains what has happened, voices the feelings of the community, and guides the audience.'
        write: 'Explains, voices, guides'
      - section: Remember
        say: 'A church choir sings together. A chorus in drama sings, dances and comments together.'
        write: 'Choir, chorus'
      - section: 'The trap'
        say: 'The cast is all the actors in a play, not the special group that links play and audience.'
        write: 'Cast = all the actors'
      - section: Answer
        say: 'So the band is the chorus, which is option A.'
        write: 'Answer: A, chorus'
        answer: true
    traps:
      B: 'You chose clown. A clown is one comic character, not a band of singers and dancers.'
      C: 'You picked playwright. The playwright writes the play and is not on stage.'
      D: 'You went for cast. The cast is all the actors, not the group that links play and audience.'

  17:
    moments:
      - section: 'The question'
        say: 'A character gives his name to the title of the book. What is he called?'
        write: 'A character named in the title'
      - section: 'Name it'
        say: 'He is the eponymous character.'
        write: 'Eponymous'
      - section: 'The definition'
        say: 'An eponymous character is the one whose name is the title of the work.'
        write: 'Eponymous = gives the work its name'
      - section: 'Show it'
        say: 'Othello in Othello and Macbeth in Macbeth are eponymous characters.'
        write: 'Othello, Macbeth'
      - section: Remember
        say: 'The word comes from Greek for giving one''s name. The eponymous hero gives his name to the book.'
        write: 'Gives his name'
      - section: 'The trap'
        say: 'The antagonist opposes the hero. He rarely gives the work its name.'
        write: 'Antagonist = the opponent'
      - section: Answer
        say: 'So the character is called eponymous, which is option C.'
        write: 'Answer: C, eponymous'
        answer: true
    traps:
      A: 'You chose antagonist. The antagonist opposes the hero. He is not the one in the title.'
      B: 'You picked round. A round character is fully developed, which says nothing about the title.'
      D: 'You went for flat. A flat character is undeveloped, which says nothing about the title.'

  18:
    moments:
      - section: 'The question'
        say: 'In poetry, what does licence mean?'
        write: 'Poetic licence = ?'
      - section: 'The definition'
        say: 'Poetic licence is the freedom poets take to bend the normal rules of grammar, word order, spelling or fact, for rhyme, rhythm or effect.'
        write: 'Poetic licence = freedom with language'
      - section: 'Show it'
        say: 'A poet may write o''er for over to keep the beat, or turn a sentence round to put the rhyme at the end.'
        write: 'o''er for over'
      - section: 'Why it matters'
        say: 'Readers should not mark such changes as mistakes. They are chosen for effect.'
        write: 'Chosen, not mistakes'
      - section: Remember
        say: 'A driver''s licence lets you drive. Poetic licence lets the poet bend the rules of language.'
