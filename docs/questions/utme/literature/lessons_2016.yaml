        write: 'Brabantio, senator, father'
      - section: 'The fact'
        say: 'He opposes the marriage because Othello is a Moor, a Black African.'
        write: 'Othello is a Moor'
      - section: 'Show it'
        say: 'He says she must have been bewitched to run to the sooty bosom of such a thing as Othello.'
        write: '"the sooty bosom / Of such a thing as thou"'
      - section: 'Why it matters'
        say: 'It shows the racial prejudice of Venice, which Iago later uses against Othello.'
        write: 'Prejudice that Iago uses'
      - section: 'Remember'
        say: 'Remember, Brabantio welcomed Othello as a guest, but not as a son in law.'
        write: 'Guest, yes; son-in-law, no'
      - section: 'Answer'
        say: 'So Brabantio is opposed because Othello is a Moor, which is option B.'
        write: '∴ Othello is a Moor'
        answer: true
    traps:
      A: 'You chose Iago. Brabantio never wants Iago for his daughter.'
      C: 'You went for Roderigo. Brabantio had already turned Roderigo away, so that is not the reason.'
      D: 'You picked her age. Brabantio never complains about her age. He objects to Othello himself.'
  9:
