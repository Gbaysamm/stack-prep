    traps:
      A: 'You chose travelling. It is the Venetians who will go. Othello is about to die.'
      B: 'You went for sick. He is not ill. He is about to take his own life.'
      D: 'You picked eloping. The elopement is at the start of the play, and this speech is at the end.'
