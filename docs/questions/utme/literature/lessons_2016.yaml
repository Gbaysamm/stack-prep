# UTME 2016 Literature in English, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Literature teacher works on the board:
# the question, the term, character or event named, the definition or fact, the exact words or
# moment that show it, why it matters, a way to remember it, and the answer.
#
#   say:     heard, not read. Quoted lines read naturally, names said as written, rhyme schemes
#            letter by letter, no symbols the voice would stop on.
#   write:   the one line written while it is said.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2016.yaml. Answers match that file. No question
# is dropped, so all 50 have a lesson.
format_version: 1
exam_year: 2016
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'Some people are planning to use a young woman for money. Who is the babe they will dangle before the Chief?'
        write: 'Harvest of Corruption: who is "the babe"?'
      - section: 'The words'
        say: 'Listen to the plan. We will dangle this babe before the Chief for a price, and she will run the errands while we pick the bucks.'
        write: '"dangle this babe before the Chief for a price"'
      - section: 'The fact'
        say: 'In the play, Aloho is a young graduate looking for a job. Her friend Ochuole leads her to Chief Haladu Ade Amaka.'
        write: 'Aloho, jobless graduate → Ochuole → the Chief'
      - say: 'The Chief employs her and uses her to carry drugs. She runs his errands, just as the plan says.'
        write: 'Aloho = the courier who "runs the errands"'
      - section: 'Why it matters'
        say: 'This is the theme of the play. The powerful buy and use the young and desperate for money.'
        write: 'Theme: the young exploited for money'
      - section: 'Remember'
        say: 'Remember, Aloho is the one who is used, and Ochuole is the one who leads her in.'
        write: 'Aloho is used; Ochuole leads her in'
      - section: 'Answer'
        say: 'So the babe in the excerpt is Aloho, which is option D.'
        write: '∴ Aloho'
        answer: true
    traps:
      A: 'You chose Ogeyi. She is not the girl the schemers offer to the Chief for a price.'
      B: 'You went for Alice. She is not the young woman used as the Chief''s courier.'
      C: 'You picked Ochuole. She helps lead Aloho in, so she is not the new girl being dangled.'
  2:
    moments:
      - section: 'The question'
        say: 'Someone cries out to God about a girl''s decision. What is the speaker feeling?'
        write: 'Harvest of Corruption: the speaker''s feeling?'
      - section: 'Name it'
        say: 'This is about feeling, and we read it straight from the kind of sentences the speaker uses.'
        write: 'Feeling shows in the sentences'
      - section: 'The words'
        say: 'First come the cries. O God forgive me. Is this a trap or what? God!'
        write: '"O! God forgive me ... God!" = shock'
      - say: 'Then comes the worry. Poor girl! Whatever is her reason for this dangerous decision.'
        write: '"Poor girl!" "dangerous" = pity and worry'
      - section: 'Why it matters'
        say: 'The play keeps showing ordinary people horrified at what corruption does to the young.'
        write: 'Horror at what corruption does'
      - section: 'Remember'
        say: 'Count the exclamation marks, and listen for the word poor. Shock plus poor girl means pity.'
        write: 'Shock + "poor girl" = pity'
      - section: 'Answer'
        say: 'So the speaker feels shock mixed with pity, which is option B.'
        write: '∴ shock mixed with pity'
        answer: true
    traps:
      A: 'You went for mocking amusement. Nobody laughs here. Poor girl is pity, not mockery.'
      C: 'You chose calm indifference. Cries to God and exclamation marks are the opposite of calm.'
      D: 'You picked joyful excitement. The speaker calls the decision dangerous, so there is no joy.'
  3:
    moments:
      - section: 'The question'
        say: 'Where and when does Harvest of Corruption take place? What kind of world is it?'
        write: 'Harvest of Corruption: the setting?'
      - section: 'Name it'
        say: 'The setting is the time and place where the action happens.'
        write: 'Setting = time + place'
      - section: 'The fact'
        say: 'The play is set in a modern African country, among government offices, hotels, police stations and courts.'
        write: 'Modern African country: offices, hotels, police, courts'
      - section: 'Show it'
        say: 'Its people include a Chief who is a minister, his agents, jobless graduates and the police who chase them.'
        write: 'Minister, agents, graduates, police'
      - section: 'Why it matters'
        say: 'Ogbeche wants Nigerian readers to see their own society, where public office is abused for private gain.'
        write: 'Theme: public office abused'
      - section: 'Remember'
        say: 'Remember, a minister, a hotel and an airport tell you the play is modern and African.'
        write: 'Minister + hotel + airport = modern Africa'
      - section: 'Answer'
        say: 'So the setting is a modern African country whose officials are corrupt, which is option B.'
        write: '∴ a modern African country with corrupt officials'
        answer: true
    traps:
      A: 'You chose a royal court in medieval Europe. The play has ministers and police, not kings and knights.'
      C: 'You went for a fishing village before colonial rule. This play is about modern government corruption.'
      D: 'You picked an American plantation. That is the world of slave stories, not this Nigerian play.'
  4:
    moments:
      - section: 'The question'
        say: 'Some words in this line sit inside brackets. What are they called?'
        write: '"Good day (He says without looking up.) See me there by 4 p.m."'
      - section: 'Name it'
        say: 'These words are a stage direction.'
        write: 'Stage direction'
      - section: 'Define it'
        say: 'A stage direction is an instruction printed in a play, often in brackets, telling the actor how to move or speak.'
        write: 'Stage direction = instruction to the actor, not spoken'
      - section: 'Show it'
        say: 'The words he says without looking up are never spoken. They tell the actor to keep his eyes down.'
        write: '(He says without looking up.) → not spoken'
      - section: 'Why it matters'
        say: 'It shows character. A man who sends a visitor away without looking up is busy and careless of others.'
        write: 'Shows a proud, dismissive man'
      - section: 'Remember'
        say: 'Remember, words in brackets in a play are for the actor and the director, not the audience.'
        write: 'Brackets in a play = for the actor'
      - section: 'Answer'
        say: 'So the words in brackets are a stage direction, which is option D.'
        write: '∴ a stage direction'
        answer: true
    traps:
      A: 'You chose an aside. An aside is spoken to the audience. These words are not spoken at all.'
      B: 'You went for a soliloquy. That is a long speech made alone on stage, not a short instruction.'
      C: 'You picked a prologue. A prologue opens a play before the action, it does not sit inside a line.'
  5:
    moments:
      - section: 'The question'
        say: 'Chief Haladu Ade Amaka is a powerful man in Harvest of Corruption. What is his crime?'
        write: 'Chief Haladu Ade Amaka''s crime?'
