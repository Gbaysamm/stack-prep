        say: 'He is a government minister who runs a drug business on the side.'
        write: 'A minister with a secret drug trade'
      - section: 'Define it'
        say: 'Smuggling means moving forbidden goods across borders in secret.'
        write: 'Smuggling = moving forbidden goods in secret'
      - section: 'Show it'
        say: 'The Chief uses young women such as Aloho to carry hard drugs abroad, and Aloho is caught with them.'
        write: 'Aloho carries the drugs → caught'
      - section: 'Why it matters'
        say: 'A man trusted with public office uses it to cover crime. That is the harvest of corruption in the title.'
        write: 'Public office covers private crime'
      - section: 'Remember'
        say: 'Remember, a minister who sends couriers through the airport is a smuggler.'
        write: 'Couriers at the airport = smuggling'
      - section: 'Answer'
        say: 'So the Chief is involved in smuggling, which is option C.'
        write: '∴ smuggling'
        answer: true
    traps:
      A: 'You chose child trafficking. The young women carry his drugs. He does not sell children.'
      B: 'You went for land grabbing. That plays no part in the Chief''s crimes.'
      D: 'You picked rigging. His crime in the play is the drug trade, not elections.'
  6:
    moments:
      - section: 'The question'
        say: 'Othello looks at Desdemona and says she is pale as thy smock. Which device is that?'
        write: '"Pale as thy smock": which device?'
      - section: 'Name it'
        say: 'This is a simile.'
        write: 'Simile'
      - section: 'Define it'
        say: 'A simile compares two different things openly, using like or as.'
        write: 'Simile = comparison with "like" or "as"'
      - section: 'Show it'
        say: 'Her face is compared with her smock, her white nightdress. The little word as joins them.'
        write: 'pale AS thy smock → face compared with nightdress'
      - section: 'Why it matters'
        say: 'We see her lifeless whiteness, and it hints at the innocence Othello is only now beginning to see.'
        write: 'Lifeless white = innocence'
      - section: 'Remember'
        say: 'Remember, if like or as joins the two things, it is a simile, like as black as charcoal.'
        write: '"as black as charcoal" = simile'
      - section: 'Answer'
        say: 'So the device is a simile, which is option A.'
        write: '∴ simile'
        answer: true
    traps:
      B: 'You chose pun. A pun plays on two meanings of a word, and there is no double meaning here.'
      C: 'You went for metaphor. A metaphor compares without like or as, but here as is used.'
      D: 'You picked paradox. A paradox seems to contradict itself, and nothing here does.'
  7:
    moments:
      - section: 'The question'
        say: 'Othello loved Desdemona. So why does he kill her?'
        write: 'Why does Othello kill Desdemona?'
      - section: 'Name it'
        say: 'This is about Othello''s motive, the reason for the murder.'
        write: 'The motive'
      - section: 'The fact'
        say: 'Iago convinces Othello that Desdemona is unfaithful with Cassio.'
        write: 'Iago''s lie: Desdemona and Cassio'
      - section: 'Show it'
        say: 'Iago plants the handkerchief, Othello''s first gift to her, on Cassio. Othello takes it as proof.'
        write: 'The handkerchief → "proof"'
      - say: 'Iago even warns him of jealousy, the green eyed monster, while feeding it.'
        write: '"the green-eyed monster"'
      - section: 'Why it matters'
        say: 'Jealousy is the tragic flaw that turns a noble general into a murderer.'
        write: 'Jealousy = the tragic flaw'
      - section: 'Remember'
        say: 'Remember, one handkerchief, one lie, one jealous husband.'
        write: 'One handkerchief, one lie, one jealous husband'
      - section: 'Answer'
        say: 'So Othello kills Desdemona because he is jealous, which is option A.'
        write: '∴ the former is jealous'
        answer: true
    traps:
      B: 'You chose the insult to his race. He is mocked as a Moor, but he kills her because he thinks she betrayed him.'
      C: 'You went for witchcraft. Brabantio accuses Othello of witchcraft. Nobody thinks Desdemona is a witch.'
      D: 'You picked going back to her father. Desdemona stays loyal to Othello to the very end.'
  8:
    moments:
