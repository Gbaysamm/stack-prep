  16:
    moments:
      - section: 'The question'
        say: 'Besides their husbands, what else do the widows of Kufi lose?'
        write: 'Lonely Days: the widows share the loss of ?'
      - section: 'Name it'
        say: 'This is about the widows'' place in the community in Bayo Adebowale''s novel.'
        write: 'The widows'' place'
      - section: 'The fact'
        say: 'When a husband dies, custom pushes his widow to the edge. Others make her choices for her.'
        write: 'Custom pushes the widow aside'
