        say: 'Yaremi and the other widows lose the respected place a wife once had.'
        write: 'Respected wife → pushed-aside widow'
      - section: 'Why it matters'
        say: 'That loss of dignity and status is what the novel protests against.'
        write: 'Loss of dignity and status'
      - section: 'Remember'
        say: 'The widow loses her husband, and custom takes her standing too.'
        write: 'Husband gone, standing gone'
      - section: 'Answer'
        say: 'So the widows share the loss of dignity and status, which is option A.'
        write: '$\therefore$ dignity and status'
        answer: true
    traps:
      B: 'You chose wealth from trade. Widows may grow poorer, but the novel stresses the loss of respect.'
      C: 'You went for fame as singers. Fame has nothing to do with widowhood.'
      D: 'You picked political office. The widows held no office to lose.'
  17:
    moments:
      - section: 'The question'
        say: 'A room fills with light, and a boy stands between two iron beds. What style of writing is this?'
        write: 'Native Son: "Light flooded the room ..."'
      - section: 'Name it'
        say: 'This is descriptive writing.'
        write: 'Descriptive'
      - section: 'The rule'
        say: 'Descriptive writing paints a picture of a scene, so the reader can see it.'
        write: 'Descriptive = paints a picture'
      - section: 'Show it'
        say: 'Light flooded the room and revealed a black boy standing in a narrow space between two iron beds. We see the light, the boy, the narrow space and the beds.'
        write: 'Light, boy, narrow space, two iron beds'
      - section: 'Why it matters'
        say: 'The cramped room shows Bigger''s poverty and his crowded family life in Chicago.'
        write: 'Cramped room = poverty'
      - section: 'Remember'
