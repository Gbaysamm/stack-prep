        say: 'The heroine, Yaremi, is a widow, and the whole novel follows her life under these customs. So the widows are the ones who suffer.'
        write: 'Heroine Yaremi = a widow'
      - section: 'Answer'
        say: 'So the women who suffer most under Kufi''s customs are the widows, which is option D.'
        write: '$\therefore$ widows'
        answer: true
    traps:
      A: 'You chose singers. Singing is not what brings the customs down on the women.'
      B: 'You went for farmers. Farming is ordinary village work, not what the customs punish.'
