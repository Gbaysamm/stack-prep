        say: 'Yaremi and the other widows of Kufi must mourn, obey and accept what custom decides for them.'
        write: 'Widows must mourn and obey'
      - section: 'Show it'
        say: 'The rites, and the pressure to be inherited by a husband''s relatives, fall on the widows.'
