# UTME 2017 Literature in English, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Literature teacher works on the board:
# the question, the term, device, character or event named, the definition or the fact, the
# exact words or the moment that shows it, why it matters, a way to remember it, and the answer.
#
#   say:     heard, not read. Quoted lines are read naturally; no symbols the voice would stop on.
#   write:   the one line written while it is said.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2017.yaml. Answers match that file. No question
# is dropped, so all 40 have a lesson.
format_version: 1
exam_year: 2017
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'A young graduate wants easy money and takes the crooked road. How does her story end, and what does it teach?'
        write: 'Harvest of Corruption: Aloho''s fate shows wrongdoing meets ?'
      - section: 'Name it'
        say: 'This is about Aloho, the young woman at the centre of Frank Ogodo Ogbeche''s play.'
        write: 'Aloho, the heroine'
      - section: 'The fact'
        say: 'Aloho is drawn into the circle of Chief Haladu Ade Amaka and used to carry drugs. In the end she is caught and arrested.'
        write: 'Easy money → drug courier → arrest'
      - section: 'Show it'
        say: 'Now look at the title. A harvest is what you reap from the seed you planted.'
        write: 'Harvest = you reap what you sow'
      - section: 'Why it matters'
        say: 'Corruption is the seed, and ruin is the harvest. The play warns the young that crime leads to punishment.'
        write: 'Seed: corruption. Harvest: punishment'
      - section: 'Remember'
        say: 'Remember the farmer. Plant yam, and you harvest yam. Plant crime, and you harvest punishment.'
        write: 'Plant crime, reap punishment'
      - section: 'Answer'
        say: 'So Aloho''s fate shows that wrongdoing is finally met with punishment, which is option C.'
        write: '$\therefore$ punishment'
        answer: true
    traps:
      A: 'You chose reward. Aloho gains nothing lasting from her crime, and it ruins her.'
      B: 'You went for blessing. Her arrest is no blessing. It is the price of her choice.'
      D: 'You picked injustice. She is used by powerful people, but her fall follows from what she chose, so the play shows it as punishment.'
  2:
    moments:
      - section: 'The question'
        say: 'Here is a play full of corrupt officials, drug barons and greedy youths. What kind of writing holds them up to scorn?'
        write: 'Harvest of Corruption is a ?'
      - section: 'Name it'
        say: 'This is satire.'
        write: 'Satire'
      - section: 'The rule'
        say: 'Satire exposes and mocks the faults of society, so that people will be ashamed and change.'
        write: 'Satire = exposing vice to correct it'
      - section: 'Show it'
        say: 'Chief Haladu Ade Amaka uses his office and young women like Aloho to make himself rich. The play shows him up.'
        write: 'Corrupt Chief, used youths, exposed'
      - section: 'Why it matters'
        say: 'Ogbeche wants Nigerian society to see its own corruption and be shamed into change.'
        write: 'Aim: shame society into change'
      - section: 'Remember'
        say: 'Think of a newspaper cartoon that mocks a politician. That is satire, a mirror held up to our faults.'
        write: 'Satire = a mirror for society''s faults'
      - section: 'Answer'
        say: 'So Harvest of Corruption can be described as a satire, which is option D.'
        write: '$\therefore$ satire'
        answer: true
    traps:
      A: 'You chose dramatic irony. That is a device inside a play, not the type of the whole play.'
      B: 'You went for allegory. An allegory hides a second meaning, but this play attacks corruption openly.'
      C: 'You picked fable. A fable also teaches, but it is a short tale, usually with talking animals.'
  3:
    moments:
      - section: 'The question'
        say: 'In a play called Harvest of Corruption, how do the big men treat their government offices?'
        write: 'Harvest of Corruption: officials treat office as ?'
      - section: 'Name it'
        say: 'This is the play''s main theme, corruption.'
        write: 'Theme: corruption'
      - section: 'The rule'
        say: 'Corruption is the misuse of public office for private gain.'
        write: 'Corruption = public office, private gain'
      - section: 'Show it'
        say: 'Chief Haladu Ade Amaka uses his position and connections to make money for himself, even through drug smuggling.'
        write: 'The Chief: office used to get rich'
      - section: 'Why it matters'
        say: 'An office meant to serve the people becomes a way to grab public money. That is the rot the play attacks.'
        write: 'Serve the people? No. Grab the funds.'
      - section: 'Remember'
        say: 'The title names the vice, corruption. So expect the officials in this play to misuse their office.'
        write: 'Title names the vice: corrupt officials'
      - section: 'Answer'
        say: 'So they treat office as an avenue to take public funds for themselves, which is option D.'
        write: '$\therefore$ an avenue to take public funds'
        answer: true
    traps:
      A: 'You chose a waste of time. The officials find office very profitable, not a waste.'
      B: 'You went for time consuming work. Hard work is not their concern, because they use office to get rich.'
      C: 'You picked a duty to serve hardworking youths. That is what office should be, but these officials exploit the young.'
  4:
    moments:
      - section: 'The question'
        say: 'Someone starts preaching again, and the listener groans. What attitude do these words show?'
        write: '"En! En! En! You have come again ..."'
      - section: 'Name it'
        say: 'This is about attitude, the way a speaker feels towards a person or a subject.'
        write: 'Attitude = how the speaker feels'
      - section: 'Show it'
        say: 'Listen to the groan. En, en, en, you have come again. That is someone saying here we go again.'
        write: '"You have come again" = weariness'
        point:
          - {line: 2, kind: underline, at: 'come again', on: 'come'}
      - say: 'Then the speaker says, I am not always comfortable when you start dishing out this you born again stuff.'
        write: '"not always comfortable", "dishing out"'
      - section: 'Why it matters'
        say: 'The speaker is tired of being preached to and wants it to stop. That is impatience and discomfort.'
        write: 'Tired of the preaching = impatience'
      - section: 'Remember'
        say: 'Picture a friend rolling her eyes when you start a sermon. That is the feeling here.'
        write: 'Eye-roll at a sermon'
      - section: 'Answer'
        say: 'So the speaker''s attitude is one of impatience and discomfort, which is option B.'
        write: '$\therefore$ impatience and discomfort'
        answer: true
    traps:
      A: 'You chose deep admiration. The speaker mocks the born again stuff, which is the opposite of admiring it.'
      C: 'You went for fear. The speaker is uncomfortable, but it is irritation, not fear.'
      D: 'You picked sorrow. There is no grief in these words, only impatience.'
  5:
    moments:
      - section: 'The question'
        say: 'Aloho''s friend Ochuole leads her into the Chief''s world. What kind of friend is that?'
        write: 'Harvest of Corruption: Ochuole is best described as ?'
      - section: 'Name it'
        say: 'This is about characterisation. We judge a character by what she does.'
        write: 'Character = judged by actions'
      - section: 'Show it'
        say: 'Ochuole knows the Chief''s world of easy money, and she draws Aloho into it.'
        write: 'Ochuole draws Aloho in'
      - say: 'Aloho moves from honest job seeking into crime, and is ruined.'
        write: 'Honest job seeker → used and ruined'
      - section: 'Why it matters'
        say: 'Someone who leads others into wrongdoing is mischievous and corrupting, a bad influence.'
        write: 'Leads others astray = mischievous, corrupting'
      - section: 'Remember'
        say: 'Remember the saying, show me your friend and I will tell you who you are.'
        write: 'Show me your friend ...'
      - section: 'Answer'
        say: 'So Ochuole is best described as mischievous and corrupting, which is option C.'
        write: '$\therefore$ mischievous and corrupting'
        answer: true
    traps:
      A: 'You chose too sophisticated. Her style is not the danger. Her corrupting influence is.'
      B: 'You went for proud. Pride is not what marks her. She leads others into wrongdoing.'
      D: 'You picked born again. A born again friend would be a good influence, the opposite of Ochuole.'
  6:
    moments:
      - section: 'The question'
        say: 'A father says his daughter was stolen by spells. Whose suspicion is this?'
        write: 'Othello: "She is abused, stol''n from me ..."'
      - section: 'Name it'
        say: 'This is Brabantio, Desdemona''s father, speaking to the Duke in Act one, Scene three.'
        write: 'Brabantio, Act 1 Scene 3'
      - section: 'The fact'
        say: 'Brabantio cannot believe Desdemona would freely marry Othello. So he suspects witchcraft.'
        write: 'He suspects witchcraft'
      - section: 'Show it'
        say: 'Look at the words. Corrupted by spells and medicines bought of mountebanks. Mountebanks are quack sellers of potions.'
        write: '"spells and medicines bought of mountebanks"'
      - section: 'Why it matters'
        say: 'His suspicion shows his prejudice against Othello, and warns us how fast suspicion spreads in this play.'
        write: 'Prejudice; suspicion grows'
      - section: 'Remember'
        say: 'The father cries juju, the way a parent might say a suitor has charmed his daughter.'
        write: 'Father cries "juju!"'
      - section: 'Answer'
        say: 'So the excerpt refers to Brabantio''s suspicion, which is option A.'
        write: '$\therefore$ Brabantio''s suspicion'
        answer: true
    traps:
      B: 'You chose Iago''s distrust of Emilia. These lines are about a daughter stolen by spells, not a wife.'
      C: 'You went for Othello''s suspicion. Othello''s doubts come later, and they are about Cassio, not spells.'
      D: 'You picked Cassio''s disaffection for Iago. This is a father''s complaint, and Cassio is not speaking.'
  7:
    moments:
      - section: 'The question'
        say: 'Where was Othello first recorded on stage? Was it a stadium, a palace or a public theatre?'
        write: 'Othello: first recorded performance, 1604'
      - section: 'Name it'
        say: 'This is about the stage history of the play.'
        write: 'Stage history'
      - section: 'The fact'
        say: 'Court records show Othello was played on the first of November, sixteen oh four, at Whitehall Palace in London.'
        write: '1 November 1604, Whitehall Palace'
      - section: 'Show it'
        say: 'It was performed in the Banqueting House, before King James the First.'
        write: 'Banqueting House, before King James I'
      - section: 'Why it matters'
        say: 'Shakespeare''s company, the King''s Men, played at court as well as at the Globe.'
        write: 'King''s Men: court and the Globe'
      - say: 'Because the play was already on stage in sixteen oh four, this record also tells us Shakespeare had written it by then.'
        write: 'Staged in 1604, so written by 1604'
      - section: 'Remember'
        say: 'Remember Whitehall, for the King, in sixteen oh four.'
        write: 'Whitehall, King, 1604'
      - section: 'Answer'
        say: 'So the first recorded performance was at Whitehall Palace, London, which is option C.'
        write: '$\therefore$ Whitehall Palace, London'
        answer: true
    traps:
      A: 'You chose Liverpool stadium. Shakespeare''s plays were not put on in stadiums in sixteen oh four.'
      B: 'You went for Manchester stadium. Manchester has no link with the first recorded performance.'
      D: 'You picked a London theatre. The play was later staged at the Globe, but the first record is at Whitehall.'
  8:
    moments:
      - section: 'The question'
        say: 'Someone asks to be buried in her wedding sheets. Who is speaking, and to whom?'
        write: 'Othello: "If I do die before thee, prithee, shroud me"'
      - section: 'Name it'
        say: 'This is the willow scene, Act four, Scene three.'
        write: 'The willow scene, Act 4 Scene 3'
      - section: 'The fact'
        say: 'Emilia has laid Desdemona''s wedding sheets on the bed, as Desdemona asked.'
        write: 'Emilia lays the wedding sheets'
      - section: 'Show it'
        say: 'Desdemona answers, if I do die before thee, prithee, shroud me in one of those same sheets. A shroud is the cloth a body is buried in.'
        write: 'Shroud = burial cloth'
      - section: 'Why it matters'
        say: 'That night she dies on that same bed. Her words foreshadow her death, and fill us with dread.'
        write: 'Foreshadows her death'
      - section: 'Remember'
        say: 'Wedding sheets become a shroud. The bride speaks to her maid.'
        write: 'Wedding sheets → shroud'
      - section: 'Answer'
        say: 'So the plea is made by Desdemona to Emilia, which is option A.'
        write: '$\therefore$ Desdemona to Emilia'
        answer: true
    traps:
      B: 'You chose Othello to Iago. This is a woman speaking to her maid about her sheets.'
      C: 'You went for Iago to Emilia. Emilia is the listener, but her mistress Desdemona is speaking.'
      D: 'You picked Cassio to Bianca. They are not in this scene.'
  9:
    moments:
      - section: 'The question'
        say: 'Someone says his services to the state will out talk his enemy''s complaints. Who has served Venice so well?'
        write: 'Othello: "My services which I have done the signiory"'
      - section: 'Name it'
        say: 'This is Othello, speaking to Iago in Act one, Scene two.'
        write: 'Othello to Iago, Act 1 Scene 2'
      - section: 'The fact'
        say: 'Iago warns Othello that Brabantio is furious about the marriage. Othello stays calm.'
        write: 'Brabantio is furious; Othello is calm'
      - section: 'Show it'
        say: 'Let him do his spite. Him is Brabantio, so the speaker is answering Brabantio''s anger.'
        write: '"Let him do his spite" → him = Brabantio'
      - say: 'Then he says, my services which I have done the signiory shall out tongue his complaints. The signiory is the government of Venice, and Othello is its general.'
        write: 'Signiory = the rulers of Venice'
      - say: 'To out tongue is to speak louder than. So his good service to the state will count for more than Brabantio''s complaints.'
        write: 'Out-tongue = speak louder than'
      - say: 'He adds that he comes from men of royal siege, that is, royal birth. Only Othello, the general, can say all of this.'
        write: '"Royal siege" = royal birth'
      - section: 'Why it matters'
        say: 'This is Othello at his best, confident and dignified. It makes his fall later all the more tragic.'
        write: 'Confident, dignified → tragic fall'
      - section: 'Remember'
        say: 'The general who served the state is the one who boasts of service.'
        write: 'Services to the state = the general'
      - section: 'Answer'
        say: 'So the speaker is Othello, which is option B.'
        write: '$\therefore$ Othello'
        answer: true
    traps:
      A: 'You chose Brabantio. He is the him whose spite is dismissed. He is spoken about, not speaking.'
      C: 'You went for Cassio. Cassio has no quarrel with Brabantio to answer.'
      D: 'You picked Iago. Iago is the listener here. He stirred up Brabantio, and he does not answer him.'
  10:
    moments:
      - section: 'The question'
        say: 'A father has just found his daughter gone. Who cries out treason of the blood?'
        write: 'Othello: "O treason of the blood!"'
      - section: 'Name it'
        say: 'This is Brabantio, in Act one, Scene one, the night Desdemona runs off with Othello.'
        write: 'Brabantio, Act 1 Scene 1'
      - section: 'Show it'
        say: 'O heaven! How got she out? O treason of the blood! Treason of the blood means betrayal by his own child.'
        write: 'Treason of the blood = betrayal by his own child'
      - say: 'He warns, fathers, from hence trust not your daughters'' minds. Only a father speaks this way.'
        write: '"Fathers, from hence trust not your daughters'' minds"'
      - section: 'Why it matters'
        say: 'He asks, is there not charms. That talk of charms sets up the witchcraft charge he brings against Othello.'
        write: '"charms" → witchcraft charge'
      - section: 'Remember'
        say: 'A father''s grief and a cry of charms both belong to Brabantio.'
        write: 'Grief + charms = Brabantio'
      - section: 'Answer'
        say: 'So the speaker is Brabantio, which is option A.'
        write: '$\therefore$ Brabantio'
        answer: true
    traps:
      B: 'You chose Othello. Desdemona has run to Othello, so he has no reason to mourn her going.'
      C: 'You went for Gratiano. He is Brabantio''s brother, but he comes in only near the end of the play.'
      D: 'You picked Roderigo. He is there in the scene and brings the news, but he has lost no daughter.'
  11:
    moments:
      - section: 'The question'
        say: 'A slum in Accra is called Sodom and Gomorrah. What device is the writer using?'
        write: 'Faceless: "Sodom and Gomorrah" is an example of ?'
      - section: 'Name it'
        say: 'This is allusion.'
        write: 'Allusion'
      - section: 'The rule'
        say: 'An allusion is a short reference to a well known person, place or story, often from the Bible or history.'
        write: 'Allusion = reference to something well known'
      - section: 'Show it'
        say: 'For example, in the Bible, Sodom and Gomorrah were cities destroyed for their wickedness.'
        write: 'Bible: cities destroyed for wickedness'
      - say: 'Amma Darko gives that same name to the slum in Accra where Fofo lives. So the name points back to the Bible story.'
        write: 'Slum in Accra named after them'
      - section: 'Why it matters'
        say: 'With one name, the reader knows the place is full of vice and danger.'
        write: 'One name = vice and danger'
      - section: 'Remember'
        say: 'Calling a lazy man Jonah, or a betrayer Judas, is allusion. It points to a story we already know.'
        write: 'Judas, Jonah, Sodom = allusions'
      - section: 'Answer'
        say: 'So Sodom and Gomorrah in the novel is an example of allusion, which is option B.'
        write: '$\therefore$ allusion'
        answer: true
    traps:
      A: 'You chose mixed metaphor. That joins two clashing images, but this is one borrowed name.'
      C: 'You went for synecdoche. That uses a part for the whole, like hands for workers.'
      D: 'You picked euphemism. A euphemism softens a hard fact, but this name makes the place sound worse.'
  12:
    moments:
      - section: 'The question'
        say: 'The novel shows children sleeping on the streets of Accra. Whom does the novel blame?'
        write: 'Faceless mainly focuses on ?'
      - section: 'Name it'
        say: 'This is the central concern of Amma Darko''s Faceless.'
        write: 'Central concern'
      - section: 'The fact'
        say: 'The novel follows street children, Fofo and her sister Baby T, and asks how they came to be there.'
        write: 'Fofo and Baby T on the streets'
      - section: 'Show it'
        say: 'Their mother, Maa Tsuru, fails to care for and protect them. So they end up on the streets, where Baby T is killed.'
        write: 'Maa Tsuru fails her children'
      - section: 'Why it matters'
        say: 'Darko blames careless parenthood, and calls on society to take care of these faceless children.'
        write: 'Blame: negligent parents'
      - section: 'Remember'
        say: 'The children are faceless because their parents looked away.'
        write: 'Faceless children, looking-away parents'
      - section: 'Answer'
        say: 'So the novel focuses on negligent parents, which is option B.'
        write: '$\therefore$ negligent parents'
        answer: true
    traps:
      A: 'You chose stubborn children. The children are shown as victims of neglect, not as stubborn.'
      C: 'You went for greedy politicians. The novel is about families and street children, not politicians.'
      D: 'You picked peer group influence. The root cause the novel shows is the parents'' neglect.'
  13:
    moments:
      - section: 'The question'
        say: 'Who is Fofo, the girl at the heart of Faceless? Is she the helper, or the one who needs help?'
        write: 'Faceless: Fofo is best described as ?'
      - section: 'Name it'
        say: 'This is about Fofo, the main child character in Amma Darko''s novel.'
        write: 'Fofo'
      - section: 'The fact'
        say: 'Fofo is a street girl in Accra. She has run away from a home where her mother, Maa Tsuru, neglected her.'
        write: 'Street girl; neglectful home'
      - section: 'Show it'
        say: 'On the streets she must fend for herself and face danger every day.'
        write: 'Fends for herself, in danger'
      - section: 'Why it matters'
        say: 'Through Fofo, Darko gives a face to the faceless children of the streets.'
        write: 'Fofo = a face for the faceless'
      - section: 'Remember'
        say: 'The social workers and journalists help. Fofo is the one they help.'
        write: 'Helpers help Fofo'
      - section: 'Answer'
        say: 'So Fofo is a street girl who has run away from a neglectful home, which is option B.'
        write: '$\therefore$ a street girl from a neglectful home'
        answer: true
    traps:
      A: 'You chose a spoilt girl from a rich home. Fofo comes from a poor, neglectful home.'
      C: 'You went for a journalist. Fofo does not write about the slums. She lives in them.'
      D: 'You picked a social worker. The social workers help Fofo, and she is not one of them.'
  14:
    moments:
      - section: 'The question'
        say: 'Here is a novel called Lonely Days. Whose days are lonely, and why?'
        write: 'Lonely Days: the title points to ?'
      - section: 'Name it'
        say: 'This is about the title of Bayo Adebowale''s novel.'
        write: 'The title'
      - section: 'The fact'
        say: 'The novel tells the story of Yaremi, a widow in the village of Kufi, after her husband dies.'
        write: 'Yaremi, widow, Kufi'
      - section: 'Show it'
        say: 'Without her husband, and bound by widowhood customs, her days are lonely.'
        write: 'No husband + customs = lonely days'
