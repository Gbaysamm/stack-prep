        say: 'The title turns her loneliness into the novel''s theme, the hard life of widows in a traditional society.'
        write: 'Theme: the plight of widows'
      - section: 'Remember'
        say: 'Lonely days are a widow''s days.'
        write: 'Lonely days = a widow''s days'
      - section: 'Answer'
        say: 'So the title points to the loneliness Yaremi endures as a widow, which is option A.'
        write: '$\therefore$ Yaremi''s loneliness as a widow'
        answer: true
    traps:
      B: 'You chose a trader''s travels abroad. The novel stays in a village, with a widow.'
      C: 'You went for a prisoner. Custom confines Yaremi, but she is a widow in her village, not in jail.'
      D: 'You picked a child at boarding school. The novel is about an older widow, not a child.'
  15:
    moments:
      - section: 'The question'
        say: 'Which women of Kufi feel the weight of the village''s customs most?'
