# UTME 2018 Literature in English, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the way a good Literature teacher works on the board:
# the question, the term, character or event named, the definition or the fact in the text, the
# exact words or the moment that decide it, why it matters, a way to remember it, and the answer.
#
#   say:     heard, not read. Quoted lines read naturally, names said as written, no symbols
#            the voice would stop on.
#   write:   the one line written while it is said.
#   answer:  true on the moment that gives the answer, which names the option.
#   traps:   said to a student who chose that wrong option, kindly, with the reason.
#
# Keyed on question number, like explanations_2018.yaml. Answers match that file. No question
# is dropped, so all 40 questions have a lesson.
format_version: 1
exam_year: 2018
lessons:
  1:
    moments:
    - section: The question
      say: A whole story where the people and events stand for something else. What do we call that kind of work?
      write: Characters and events used as symbols = ?
    - section: Name it
      say: This is allegory.
      write: Allegory
    - section: The rule
      say: An allegory is a story whose characters and events stand for ideas or real things, so the story carries a second meaning under the first.
      write: Allegory = a story with a second meaning
    - section: Show it
      say: In Animal Farm, the animals and their farm stand for the leaders and events of the Russian Revolution.
      write: 'Animal Farm: animals = real leaders'
    - section: Why it matters
      say: Allegory lets a writer teach a lesson, or criticise the powerful, through a story that looks simple.
      write: Teach or criticise safely
    - section: Remember
      say: Think of the tortoise tale an elder tells to warn a greedy child without naming him. That is a story with a second story inside.
      write: Tortoise tale → a hidden lesson
    - section: Answer
      say: So a work whose characters and events are symbols is an allegory, which is option B.
      write: 'Answer: B, allegory'
      answer: true
    traps:
      A: You chose characteristics. Those are the qualities of a character, not a kind of work.
      C: You went for metaphor. A metaphor is one comparison in a line, but an allegory carries its symbols through a whole story.
      D: You picked parallelism. That is repeating a grammatical pattern, not a story of symbols.
  2:
    moments:
    - section: The question
      say: Characterisation sounds like the characters themselves. But is it?
      write: Characterisation in a novel = ?
    - section: Name it
      say: Characterisation is a narrative technique, a method the writer uses.
      write: Characterisation = a technique
    - section: The rule
      say: It is the way a writer reveals the characters to the reader, through description, speech, action and what others say about them.
      write: How the writer reveals characters
    - section: Show it
      say: A writer shows us a dirty room, lets us hear a man shout at his children, and shows a neighbour avoiding him. Each detail reveals the man.
      write: Room + speech + others' reactions → the man
    - section: Why it matters
      say: We judge the characters, and so the meaning of the story, through the way they are presented.
      write: We judge through the presenting
    - section: Remember
      say: The characters are the people. Characterisation is how they are shown to you, like a film showing you the villain before anyone names him.
      write: People ≠ the method of showing them
    - section: Answer
      say: So characterisation is the way the characters are revealed to the reader, which is option B.
      write: 'Answer: B'
      answer: true
    traps:
      A: You chose the writer's opinion. That is only one thing that may show, not the whole method of revealing characters.
      C: You went for the characters and how they behave. That names the people themselves, not the technique that reveals them.
      D: You picked readers of the characters. Readers are the audience, not part of how characters are shown.
  3:
    moments:
    - section: The question
      say: Your friend scores two out of fifty and you say, brilliant result. What are you doing?
      write: Verbal irony = ?
    - section: Name it
      say: This is verbal irony.
      write: Verbal irony
    - section: The rule
      say: Verbal irony is saying one thing while meaning the opposite.
      write: Say one thing, mean the opposite
    - section: Show it
      say: The words brilliant result praise. The meaning mocks.
      write: '"Brilliant result!" for 2/50 → mockery'
    - section: Why it matters
      say: Irony lets a writer criticise or mock with a sting, and asks us to look under the surface.
      write: A sting under the words
    - section: Remember
      say: Calling a power cut steady light is verbal irony. The meaning is upside down.
      write: Power cut = "steady light"
    - section: Answer
      say: So verbal irony is a device in which the speaker means the opposite of what he says, which is option A.
      write: 'Answer: A'
      answer: true
    traps:
      B: You chose a character acting against the run of events. That points to dramatic or situational irony, not irony in the words.
      C: You went for a situation that defies a logical answer. That is a dilemma or a paradox.
      D: You picked meaning exactly what one says. That is plain statement, the opposite of irony.
  4:
    moments:
    - section: The question
      say: A character speaks to the audience while others stand right there on stage, and they hear nothing. What is that called?
      write: Heard by the audience, not by the other characters = ?
    - section: Name it
      say: This is the aside.
      write: Aside
    - section: The rule
      say: An aside is a short speech to the audience while other characters are on stage. By the rule of the theatre, they do not hear it.
      write: Aside = to the audience, others present
    - section: Show it
      say: In Othello, Iago watches Cassio take Desdemona's hand and tells us, with as little a web as this will I ensnare as great a fly as Cassio.
      write: 'Iago: "With as little a web as this..."'
    - section: Why it matters
      say: The aside lets us into a character's secret plans, so we know more than the others on stage.
      write: We share the secret
    - section: Remember
      say: An aside is a whisper to the audience behind the other characters' backs.
      write: Aside = a whisper behind their backs
    - section: Answer
      say: So words meant for the audience but not for the other characters on stage are an aside, which is option A.
      write: 'Answer: A, aside'
      answer: true
    traps:
      B: You chose soliloquy. A soliloquy is spoken by a character alone on stage, not in front of the others.
      C: You went for acoustic. Acoustics are about how sound carries in a hall, not a kind of speech.
      D: You picked tone. Tone is the attitude in a voice, not a hidden speech.
  5:
    moments:
    - section: The question
      say: Prose tells a story. Poetry sings it. How does drama present it?
      write: Drama presents actions by means of ?
    - section: Name it
      say: This is the definition of drama.
      write: Drama
    - section: The rule
      say: Drama represents a complete action by having actors perform it. They speak, move and gesture before an audience.
      write: Drama = speech + movement + gesture by actors
    - section: Show it
      say: In Othello we are not told that Othello is jealous. An actor speaks his words, paces the stage and strikes Desdemona in front of us.
      write: Othello acted, not narrated
    - section: Why it matters
      say: This marks drama off from prose, which uses a narrator, and from poetry, which works through rhythm and patterned language.
      write: Prose tells, poetry sings, drama shows
    - section: Remember
      say: Think of a travelling theatre troupe acting out a story in the village square. Drama is shown, not told.
      write: Shown, not told
    - section: Answer
      say: So drama presents actions through speech, movement and gesture performed by actors, which is option B.
      write: 'Answer: B'
      answer: true
    traps:
      A: You chose a single storyteller narrating. That is how prose fiction works.
      C: You went for rhyme, rhythm and stanzas. Those are the tools of poetry.
      D: You picked description for silent reading. That belongs to prose, not to performance.
  6:
    moments:
    - section: The question
      say: Some poems keep a steady beat, like a drum. What is that regular rhythm called?
      write: Regular rhythm in poetry = ?
    - section: Name it
      say: This is metre.
      write: Metre
    - section: The rule
      say: Metre is the regular pattern of stressed and unstressed syllables in a line.
      write: Metre = a regular pattern of stresses
    - section: Show it
      say: But soft, what light through yonder window breaks. Hear it go da dum, da dum, five times.
      write: da DUM × 5 = iambic pentameter
    - section: Why it matters
      say: A steady beat makes verse musical and easy to remember.
      write: Music and memory
    - section: Remember
      say: Metre is the poem's drumbeat, as steady as a talking drummer under a praise song.
      write: Metre = the drumbeat
    - section: Answer
      say: So a poet's use of regular rhythm is metre, which is option C.
      write: 'Answer: C, metre'
      answer: true
    traps:
      A: You chose allegory. That is a story whose characters stand for ideas, nothing to do with rhythm.
      B: You went for assonance. That repeats vowel sounds, it is not a regular beat.
      D: You picked onomatopoeia. That is a word that sounds like its meaning, like buzz.
  7:
    moments:
    - section: The question
      say: Which genre does not describe human action but acts it out in front of us?
      write: The genre that imitates human action = ?
    - section: Name it
      say: This is drama.
      write: Drama
    - section: The rule
      say: Since Aristotle, drama has been called an imitation of action. People on stage do what the characters do.
      write: Drama = imitation of action
    - section: Show it
      say: In a play, a quarrel is not described. Two actors quarrel before our eyes.
      write: A quarrel acted, not told
    - section: Why it matters
      say: Drama gives us the action at first hand, with no narrator in between.
      write: No narrator in between
    - section: Remember
      say: Prose tells, poetry sings, drama does.
      write: Prose tells · poetry sings · drama does
    - section: Answer
      say: So the genre that directly imitates human actions is drama, which is option A.
      write: 'Answer: A, drama'
      answer: true
    traps:
      B: You chose comedy. Comedy is one type of drama, not the genre itself.
      C: You went for prose. Prose narrates a story, it does not act it out.
      D: You picked poetry. Poetry works through patterned language, not acted actions.
  8:
    moments:
    - section: The question
      say: The tortoise and the hare race each other. What kind of story is that?
      write: A fable is a story in which ?
    - section: Name it
      say: This is the fable.
      write: Fable
    - section: The rule
      say: A fable is a short story with a moral, in which animals or things act and speak like people.
      write: Fable = animal characters + a moral
    - section: Show it
      say: In Aesop's tale, the slow tortoise beats the boastful hare. The moral is that slow and steady wins the race.
      write: Tortoise and hare → slow and steady wins
    - section: Why it matters
      say: Fables teach a lesson in a form even a child remembers.
      write: A lesson children remember
    - section: Remember
      say: The tortoise of our moonlight stories talks and schemes like a man. That is a fable.
      write: Moonlight tortoise tales = fables
    - section: Answer
      say: So a fable is a story in which animals or things are used as characters, which is option B.
      write: 'Answer: B'
      answer: true
    traps:
      A: You chose allegations about characters. That is not the mark of any kind of story.
      C: You went for an important setting. Every story has a setting, so that does not make a fable.
      D: You picked poetic form. A fable can be in prose or verse, its mark is its animal characters.
  9:
    moments:
    - section: The question
      say: Romeo says, O brawling love, O loving hate. What happens when opposites sit side by side?
      write: Two contrasting ideas together = ?
    - section: Name it
      say: This is oxymoron.
      write: Oxymoron
    - section: The rule
      say: An oxymoron places two words of opposite meaning side by side.
      write: Oxymoron = opposites side by side
    - section: Show it
      say: Loving and hate, brawling and love. Each pair joins two opposites.
      write: '"loving hate", "brawling love"'
    - section: Why it matters
      say: The clash shows a mixed, troubled mind in very few words.
      write: A troubled mind in few words
    - section: Remember
      say: Bitter sweet, deafening silence, a wise fool. Two opposites squeezed together make an oxymoron.
      write: bitter sweet · deafening silence
    - section: Answer
      say: So the juxtaposition of two contrasting ideas in a line is oxymoron, which is option D.
      write: 'Answer: D, oxymoron'
      answer: true
    traps:
      A: You chose euphemism. That is a gentle word for something unpleasant, like passed on for died.
      B: You went for synecdoche. That uses a part for the whole, like hands for workers.
      C: You picked catharsis. That is the release of feeling at a tragedy, not a figure of speech.
  10:
    moments:
    - section: The question
      say: A cartoonist draws a politician with a huge belly and a tiny head. Why?
      write: The main aim of caricature = ?
    - section: Name it
      say: This is caricature.
      write: Caricature
    - section: The rule
      say: A caricature exaggerates a person's striking features or habits to make the person look laughable.
      write: Caricature = exaggeration for laughter
    - section: Show it
      say: Nobody really looks like that cartoon. The exaggeration is there so that we laugh at him.
      write: Huge belly, tiny head → laughter
    - section: Why it matters
      say: Caricature brings down the proud and powerful through laughter.
      write: Laughter cuts the proud down
    - section: Remember
      say: Caricature blows a feature up until it is funny, and the laughter is the point.
      write: Blow it up → laugh at it
    - section: Answer
      say: So the main aim of caricature is to ridicule, which is option D.
      write: 'Answer: D, ridicule'
      answer: true
    traps:
      A: You chose describe. Plain description does not exaggerate, and caricature always does.
      B: You went for expose. That is the wider aim of satire, while caricature itself aims to ridicule.
      C: You picked emphasize. Caricature does stress features, but that is its means, not its aim.
  11:
    moments:
    - section: The question
      say: Bigger kills Mary Dalton. Was it hate, or something else?
      write: 'Native Son: why does Bigger kill Mary?'
    - section: The moment
      say: Bigger carries the drunk Mary up to her bedroom. Then her blind mother, Mrs Dalton, comes in.
      write: Mary drunk · Mrs Dalton enters
    - section: The fact
      say: Terrified of being found in a white girl's bedroom, Bigger presses a pillow over Mary's face to keep her quiet.
      write: Pillow over her face → she is smothered
    - say: He does not plan to kill her. He panics.
      write: Panic, not a plan
    - section: Why it matters
      say: The novel shows how a racist society fills Bigger with fear, and fear drives his act.
      write: Racism → fear → the killing
    - section: Remember
      say: The first part of the novel is called Fear. That is why Mary dies.
      write: Book One = "Fear"
    - section: Answer
      say: So Bigger kills Mary out of fear, which is option A.
      write: 'Answer: A, fear'
      answer: true
    traps:
      B: You chose envy. Bigger does not kill Mary because he envies her, he panics.
      C: You went for hatred. Bigger hates the white world, but this killing is panic, not planned hate.
      D: You picked distrust. He is terrified of being found in her room, distrust plays no part.
  12:
    moments:
    - section: The question
      say: Bigger goes to work for the rich Dalton family. What job does he take?
      write: 'Native Son: Bigger''s job?'
    - section: The fact
      say: Mr Dalton hires Bigger as the family's chauffeur, the driver of their car.
      write: Bigger = the Daltons' chauffeur
    - section: The moment
      say: On his first night, Bigger drives Mary Dalton out.
      write: 'First night: drives Mary'
    - say: That duty brings him into her room when he helps her home.
      write: The drive → her room
    - section: Why it matters
      say: The job puts Bigger inside a white household, where his fear and the family's blindness meet.
      write: Inside the white household
    - section: Remember
      say: Bigger drives the car, and the drive sets the whole story going.
      write: He drives → the story starts
    - section: Answer
      say: So Bigger takes the job of chauffeur, which is option B.
      write: 'Answer: B, chauffeur'
      answer: true
    traps:
      A: You chose cook. The Daltons have a cook, Peggy, but Bigger is hired to drive.
      C: You went for gardener. Bigger drives the family car and tends the furnace.
      D: You picked butler. Bigger is not a butler, he drives the family.
  13:
    moments:
    - section: The question
      say: Mr Dalton gives gifts to young Black people. Is he truly kind?
      write: 'Native Son: Mr Dalton''s kindness is ?'
    - section: Name it
      say: This is hypocrisy, showing a goodness one does not really practise.
      write: Hypocrisy
    - section: The gifts
      say: Mr Dalton gives money and ping-pong tables to help young Black people.
      write: 'Gifts: money, ping-pong tables'
    - section: The rents
      say: But his own company rents crowded, rat-infested flats to Black families, Bigger's among them, at high rents.
      write: 'Rents: high, for rat-infested flats'
    - say: So the money he gives away comes from the very people he overcharges.
      write: Gift money ← overcharged families
    - section: Why it matters
      say: Wright shows that the rich man's kindness keeps in place the system that crushes Bigger.
      write: Kindness that keeps the system
    - section: Remember
      say: A landlord who raises your rent and then sends you a Christmas gift is not being generous.
      write: Raise the rent, send a gift
    - section: Answer
      say: So Mr Dalton's kindness is hypocritical, which is option B.
      write: 'Answer: B, hypocritical'
      answer: true
    traps:
      A: You chose selfless. The gifts look generous, but he profits from the very families he helps.
      C: You went for revolutionary. Mr Dalton changes nothing, he gains from the system.
      D: You picked secret. His gifts are public and well known.
  14:
    moments:
    - section: The question
      say: A title often holds the whole story. Whose lonely days are these?
      write: 'Lonely Days: the title points to ?'
    - section: The fact
      say: Lonely Days follows Yaremi, a widow in the Yoruba village of Kufi, after her husband dies.
      write: Yaremi = a widow in Kufi
    - section: The moment
      say: She mourns, she goes through the widowhood rites, and she faces her days without a husband.
      write: Mourning · rites · alone
    - section: Name it
      say: Her isolation and grief are the lonely days of the title.
      write: Lonely days = Yaremi's widowhood
    - section: Why it matters
      say: The novel uses one widow's life to show the hardships tradition places on widows.
      write: One widow → all widows
    - section: Remember
      say: Picture a widow sitting out her mourning, cut off from the life of the town.
      write: A widow's days
    - section: Answer
      say: So the title points to Yaremi's isolation and grief as a widow, which is option B.
      write: 'Answer: B'
      answer: true
    traps:
      A: You chose the dry season. Kufi is a farming village, but the loneliness is Yaremi's, not the land's.
      C: You went for a city hospital. The novel is set in the village of Kufi.
      D: You picked a soldier at war. Lonely Days is a widow's story.
  15:
    moments:
    - section: The question
      say: After her husband dies, men want to inherit Yaremi as a wife. She says no. What does that show?
      write: 'Lonely Days: Yaremi''s refusal shows ?'
    - section: The custom
      say: In the tradition the novel shows, a widow may be inherited as a wife by a man from her late husband's family.
      write: 'Custom: a widow is inherited'
    - section: The moment
      say: Yaremi turns these men away. She chooses to live alone rather than be passed on like property.
      write: Yaremi says no
    - section: Name it
      say: Saying no to such a custom shows independence and self-respect.
      write: Independence + self-respect
    - section: Why it matters
      say: Her refusal challenges customs that treat widows as things to be inherited.
      write: A widow is not property
    - section: Remember
      say: A woman who refuses to be inherited is saying she belongs to herself.
      write: She belongs to herself
    - section: Answer
      say: So Yaremi's refusal shows her independence and self-respect, which is option C.
      write: 'Answer: C'
      answer: true
    traps:
      A: You chose greed for property. She is refusing to become someone's property, not grabbing any.
      B: You went for fear of the elders. Standing against a custom they uphold takes courage, not fear.
      D: You picked a wish to move to the city. Her refusal is about her dignity.
  16:
    moments:
    - section: The question
      say: Is Lonely Days a true life story, a play, a poem, or an invented story told in paragraphs?
      write: Lonely Days is an example of ?
    - section: Name it
      say: This is prose fiction.
      write: Prose fiction
    - section: The rule
      say: Prose fiction is an invented story told in ordinary sentences and paragraphs. The novel is its main form.
      write: Invented story + paragraphs
    - section: Show it
      say: Lonely Days tells an invented story about the widow Yaremi, in prose, through a narrator. It is a novel.
      write: Lonely Days = a novel
    - section: Why it matters
      say: Knowing the genre tells you what to look for, which is plot, character, setting and point of view.
      write: Genre tells you how to read
    - section: Remember
      say: A made-up story in paragraphs is prose fiction, from a short story to a long novel.
      write: Made up + paragraphs = prose fiction
    - section: Answer
      say: So Lonely Days is an example of prose fiction, which is option A.
      write: 'Answer: A'
      answer: true
    traps:
      B: You chose autobiography. That is a writer's true story of his own life, and Lonely Days is invented.
      C: You went for drama. Lonely Days is written in paragraphs to be read, not acted from a script.
      D: You picked epic poetry. An epic is a long heroic poem in verse, and Lonely Days is in prose.
  17:
    moments:
    - section: The question
      say: Orwell wrote this novel in nineteen forty-nine. Why call it Nineteen Eighty-Four?
      write: Nineteen Eighty-Four pictures ?
    - section: Name it
      say: The novel pictures a totalitarian state.
      write: Totalitarian
    - section: The rule
      say: A totalitarian state is one where a single party controls every part of life, even thought and memory.
      write: One party controls everything
    - section: Show it
      say: In Oceania, Big Brother watches through telescreens, the Thought Police arrest people for their thoughts, and the Party rewrites the past.
      write: Telescreens · Thought Police · rewritten past
    - section: When
      say: And it is set in nineteen eighty-four, thirty-five years after Orwell wrote it. That is the future.
      write: Written 1949 → set 1984 = the future
    - section: Why it matters
      say: The novel is a warning about where unchecked power could lead.
      write: A warning
    - section: Remember
      say: Big Brother is watching you sums up a totalitarian future.
      write: '"Big Brother is watching you"'
    - section: Answer
      say: So the novel draws a picture of a totalitarian future, which is option B.
      write: 'Answer: B'
      answer: true
    traps:
      A: You chose a useless past. The Party rewrites the past, but the novel pictures the future.
      C: You went for an unstable moment. Oceania is held rigidly and permanently in the Party's grip.
      D: You picked a peaceful atmosphere. Oceania is ruled by fear and constant war.
  18:
    moments:
    - section: The question
      say: Winston Smith dreams in secret. What does he dream of, that the Party crushes?
      write: Winston's dreams of ?
    - section: The fact
      say: Winston longs to think for himself, to love Julia, to know the truth, and to see the people rule.
      write: Think · love · truth · the people
    - section: Show it
      say: In his diary he writes, freedom is the freedom to say that two plus two make four.
      write: '"Freedom is the freedom to say 2 + 2 = 4"'
    - say: And he hopes the proles, the ordinary people, will one day rise.
      write: Hope in the proles
    - section: Name it
      say: Freedom for himself and rule by the people are dreams of freedom and democracy.
      write: = freedom and democracy
    - section: Why it matters
      say: The novel shows total power destroying even the wish for freedom.
      write: Power kills the wish
    - section: Remember
      say: Winston's diary is his small vote for freedom, and the Party takes even that.
      write: Diary = a vote for freedom
    - section: Answer
      say: So the Party debased Winston's dreams of freedom and democracy, which is option A.
      write: 'Answer: A'
      answer: true
    traps:
      B: You chose internal security. That is the Party's excuse for control, not Winston's dream.
      C: You went for wealth and capitalism. Winston dreams of truth and freedom, not money.
      D: You picked sovereignty. That is a nation's independence, but Winston hopes for personal freedom.
  19:
    moments:
    - section: The question
      say: Every prisoner in Oceania dreads one room. What happens in Room 101?
      write: Room 101 symbolises ?
    - section: The fact
      say: Room 101 is in the Ministry of Love. There a prisoner faces the thing he fears most.
      write: Room 101 = your worst fear
    - section: The moment
      say: For Winston, it is rats. A cage of rats is brought to his face.
      write: Winston + rats
    - say: He breaks, and he betrays Julia.
      write: He betrays Julia
    - section: Why it matters
      say: Room 101 is the Party's final weapon, torture that destroys a person's loyalty and self.
      write: Torture breaks the self
    - section: Remember
      say: Room 101 holds the worst thing in the world.
      write: '"the worst thing in the world"'
    - section: Answer
      say: So Room 101 symbolises a place of torture, which is option D.
      write: 'Answer: D, torture'
      answer: true
    traps:
      A: You chose rest. No one rests in Room 101, it is where prisoners are broken.
      B: You went for fun. It is the most feared place in the Ministry of Love.
      C: You picked humiliation. That is part of it, but Room 101 is first a place of torture.
  20:
    moments:
    - section: The question
      say: Winston rebels against the Party. Does he win?
      write: Nineteen Eighty-Four can be described as ?
    - section: Name it
      say: A pessimistic work expects the worst. It shows evil winning and gives little hope.
      write: Pessimistic = expects the worst
    - section: The moment
      say: Winston is caught, tortured and broken.
      write: Caught · tortured · broken
    - say: The novel ends with him in a café, and its last words say he loved Big Brother.
      write: '"He loved Big Brother."'
    - section: Why it matters
      say: The dark ending is a warning. If such power grows, the individual loses.
      write: A warning
    - section: Remember
      say: The hero loses everything and the Party wins. That is a pessimistic book.
      write: Hero loses → pessimistic
    - section: Answer
      say: So the novel can be described as pessimistic, which is option D.
      write: 'Answer: D, pessimistic'
      answer: true
    traps:
