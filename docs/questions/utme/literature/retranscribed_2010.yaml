# UTME 2010 Literature in English, written up by hand from source/past-questions.pdf, pages 2-11.
# Q1 (the paper type) is left out; the other 49 questions are kept and none is dropped. Answers
# were worked out afresh from the texts, extracts and definitions. Eight printed keys did not
# hold up: Q7 (Romeo and Juliet is mostly blank verse), Q12 (the lump marks the slave woman
# buried with Agunwa), Q15 (Meka is simple-hearted, not a bigot), Q17 (the Ministry of Peace
# makes war), Q18 (totalitarian dictatorship), Q19 (the diary), Q28 (Lawrence first takes the
# bats for swallows) and Q48 (Futility is an elegy). Q12's options C and D had slipped to the
# top of page 2 and are put back. Set-text questions whose detail could not be confirmed were
# rebuilt on what is certain (Q2, Q4, Q14, Q21, Q24, Q25, Q26, Q30); Q36 and Q46 had no single
# right option and were repaired; Q11 and Q48 lost a second right option. Quotations were put
# back into their authors' words and line breaks (Q6, Q8, Q44, Q47, Q48, Q50).
