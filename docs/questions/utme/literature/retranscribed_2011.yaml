# UTME 2011 Literature in English, written up by hand from source/past-questions.pdf, pages 12-22.
# Q1 (the paper type) is left out; the other 49 questions are kept and none is dropped. Every
# answer was worked out afresh. Printed keys that did not hold up: Q17 (Nineteen Eighty-Four
# pictures a totalitarian future), Q19 (Room 101 is a place of torture and humiliation), Q20
# (the novel is pessimistic), Q32 (the Zhang Yu passage is about the strategy of war) and Q42
# (Dream Code works through metaphor and rhyme). Rebuilt because a set-text fact could not be
# taught with certainty or the question was broken: Q4 (where Maanan is harassed), Q6 (option A
# cut off, "commit / suicide" split in two), Q11 (what the downpour "symbolizes" had no single
# answer), Q13 (which character is described could not be confirmed), Q14 (the length of Nnaife's
# sentence), Q21 (the line from Naked Soles), Q23 (the theme of In the Navel of the Soul) and Q25
# (option A cut off; the poem's content could not be confirmed). Repairs: Q3 option D made precise;
# Q10 option A, "simple", replaced so only one answer fits; Q24 option A made precise; Q33 gains
# "anaphora", the term asked for; Q36 option D; Q38 stem rebuilt so only a round character fits;
# Q40 says the syllables alternate; garbled quotations restored (Q6, Q29, Q41, Q45, Q46, Q47,
# Q48, Q50) and plain typos fixed (Q2 "it's", "pay"; Q7 "denouement"; Q27 "Coy"; Q38 "Readers";
# Q41 "simile"; Q44 "Ola").
