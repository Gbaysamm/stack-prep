# UTME 2012 Literature in English, written up by hand from source/past-questions.pdf, pages 23-33.
# Q1 (the paper type) is left out; the other 49 questions are kept and none is dropped. Every
# answer was worked out afresh. Printed keys that did not hold up: Q10 (the Chorus, not comic
# relief, is the classical feature), Q18 (Winston writes that hope lies in the proles), Q26
# (Lawrence first takes the bats for swallows), Q32 (characterisation is the way characters are
# revealed), Q45 (the speaker stands apart from a family that worships Koomson: alienation),
# Q46 (night children are spirit beings of the dark) and Q48 (the drums are a symbol). Rebuilt,
# because a set-text detail could not be made certain or the options gave no single right
# answer: Q3, Q16, Q19, Q21, Q22, Q23, Q24, Q29, Q30, Q35 and Q50; options replaced so that
# only one is right: Q7, Q14, Q17, Q28, Q41, Q42, Q44, Q45, Q49. Quotations restored to the
# authors' words (Q6, Q7, Q8, Q44, Q47, Q50) and plain typos fixed (Q4-5 heading, "Roseline",
# "onomatopia", "Elliot", "rhyme a scheme", "That board").
