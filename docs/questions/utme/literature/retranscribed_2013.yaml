# UTME 2013 Literature in English, written up by hand from source/past-questions.pdf, pages 34-44.
# Q1 (the paper type) is left out; the other 49 questions are kept and none is dropped. Every
# answer was worked out afresh. Printed keys that did not hold up: Q7 (Tybalt is a violence
# seeker; a troubleshooter solves problems), Q8 (Romeo is melancholic over Rosaline), Q9 (Friar
# Lawrence speaks), Q17 (the Ministry of Love tortures), Q18 (power belongs to the Party), Q20
# (Winston works at the Ministry of Truth), Q22 (An African Thunderstorm is dramatic), Q40 (a
# speech to oneself is a soliloquy), Q44 (the persona cannot understand the reaper's Gaelic) and
# Q50 (the repeated questions are parallelism). Rebuilt on the same text, extract or term, where
# the printed question could not be settled with certainty or was garbled: Q3, Q11, Q12, Q14,
# Q15, Q16, Q21, Q28, Q30 and Q47. Options that made a second right answer were replaced in Q8,
# Q13, Q17, Q18, Q26, Q29 and Q38. Quotations are restored to the authors' words (Romeo and
# Juliet, Marvell, Donne, Wordsworth, Soyinka) with their line breaks, and stems that said only
# "the play" or "the novel" name the text.
