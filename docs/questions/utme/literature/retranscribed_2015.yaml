# UTME 2015 Literature in English, written up by hand from source/past-questions.pdf, pages 55-64.
# From 2015 Q1 is a real question, so all 50 questions are kept with their printed numbers and
# none is dropped. Every answer was worked out afresh from the texts and the terms. The printed
# key did not hold for Q2 (historical allusion), Q3 (sodium cyanide is a poison), Q9 (the
# refrain gives The Lie its rhythm), Q10 (the irony of the title), Q11 (alliteration), Q14
# (criticism analyses and evaluates), Q15 (aside), Q20 (pastoral), Q23 (insincerity), Q31
# (Havana), Q32 (Santiago the optimist), Q41 (sin and forgiveness), Q42 (knowledge), Q43
# (Prospero enslaves Ariel and Caliban) and Q44 (the love of power). Rebuilt on the same text,
# extract or term, because the printed question rested on a set-text detail that could not be
# checked, had no single right answer or was garbled: Q4 (alliteration in the title Homeless,
# not Hopeless), Q5 (who sings a serenade), Q6 (what a peasant is), Q7 (the title Expelled), Q8
# (enjambment in Fletcher's lines), Q24 (the saviour allusion), Q27 (a garbled repeat of Q25,
# now on the speaker's mood), Q34 (the lions Santiago dreams of), Q35 (the root of Eugene's
# violence), Q38 and Q40 (the libation extract), Q39 (Pokuwaa's longing for a child), Q48
# (Orisaye as Cassandra) and Q50 (who destroyed Owu). Options repaired so only one is right:
# Q37, Q42, Q43. Small repairs: Q1, Q25 and Q29 (the authors' words restored), Q12, Q18, Q22,
# Q26, Q28, Q30, Q49 and the set-text stems Q31 to Q50 (title and author added).
