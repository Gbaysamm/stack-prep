# UTME 2016 Literature in English, written up by hand from source/past-questions.pdf, pages 65-75.
# This paper prints no paper-type question, so Q1 is a real question and all 50 questions are
# kept; none is dropped. Every answer was worked out afresh. Printed keys that did not hold up:
# Q20 (Bigger's gang robs Black people because it is easier and safer), Q30 (petered-out desires
# show disappointment), Q31 (drama is both literary and theatrical), Q32 (a speech to oneself
# alone on stage is a soliloquy), Q38 (creative imagination marks literature off from other
# disciplines) and Q48 (withered leaves, a panting dog and a shrunken noon shadow picture the heat
# of summer). Rebuilt because a set-text detail could not be taught with certainty or the
# question had no single answer: Q2 (the speaker could not be confirmed; now the speaker's
# feeling), Q3 (the country's name in Harvest of Corruption; now the kind of setting), Q4 (where
# "there" is; now the bracketed stage direction), Q14 (the colour of mourning clothes in Kufi;
# now what the widowhood rites expose), Q15 (what the bage cap signifies; now the novel's
# setting), Q16 (the name of Yaremi's son; now what kind of character Yaremi is), Q24 (what the
# piano stands for), Q26 (personification and metaphor both fitted; now the image in "flowed"),
# Q27 (no option fitted cleanly; now what the poem criticises) and Q29 (the persona's feeling
# could not be fixed from the lines; now the imagery of the meal). Repairs: Q7 gains its missing
# option D; Q22 option B, "metaphor", replaced by "simile" so only one answer fits; every stem
# names its set text; quotations restored to the authors' words (Q6, Q9, Q10, Q25, Q41, Q42, Q43,
# Q46, Q48, Q49, Q50); plain typos fixed (Q1 "fora", Q2 "0!", Q8 "lago", Q10 "0", Q18
# "Earlone", Q19 "expose", Q34 "post", Q37 "discuses", Q38 "distinguish").
