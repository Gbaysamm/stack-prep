# UTME 2017 Literature in English, written up by hand from source/past-questions.pdf, pages 76-83.
# This paper prints no paper-type question, so Q1 is a real question and all 40 questions are
# kept; none is dropped. Every answer was worked out afresh. Printed keys that did not hold up:
# Q2 (the play is a satire on corruption, not a fable), Q7 (Othello's first recorded
# performance was at Whitehall Palace in 1604), Q9 (the "services ... done the signiory" speech
# is Othello's, not Brabantio's) and Q26 (The Panic of Growing Older is a philosophical poem; it
# is not metaphysical poetry in the strict sense). Rebuilt because a set-text detail could not
# be taught with certainty, a line or options were missing, or no option fitted: Q1 (how Aloho
# saw her pregnancy; now what Aloho's fate shows), Q3 (Ochuole's view of a government job; now
# how the play's officials treat public office), Q4 (two options missing and the speaker
# unconfirmed; now the attitude the extract shows), Q5 (now what kind of character Ochuole is),
# Q13 (why Fofo slept by the provision store; now what Fofo is), Q14 (what labankada signifies;
# now what the title points to), Q15 (now which women suffer most under Kufi's customs), Q16
# (now what the widows lose), Q19 (Bigger's weekly wage; now his job), Q20 (Mr Dalton's opinion;
# now the irony of his charity), Q23 (the line from Ambush was not printed; now the term
# alliteration), Q28 (option D missing; now the device in the line), Q29 (two tones fitted; now
# sorrow and regret) and Q40 (no option fitted a reader-address; now what "Behold" and "O
# listen!" do). Repairs: Q22 drops "definite" and names the lines; Q25 option C, "hyperbole",
# is replaced by "metaphor", since the glass of blessings is a metaphor; Q33 option B is spelt
# out; every stem names its set text; quotations restored to the authors' words (Q6, Q8, Q9,
# Q10, Q25, Q39, Q40); plain typos fixed (Q5 "Aloch", Q7 "Threatre", Q9 "Lago", Q16 "windows",
# Q36 "lines move", Q38 "call be").
