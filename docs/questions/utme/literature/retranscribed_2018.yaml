# UTME 2018 Literature in English, written up by hand from source/past-questions.pdf, pages 84-92.
# This paper prints no paper-type question, so Q1 is a real question and all 40 questions are
# kept; none is dropped. Every answer was worked out afresh. Printed keys that did not hold up:
# Q2 (characterisation is how characters are revealed), Q17 (a totalitarian future), Q20 (the
# novel is pessimistic), Q31 (the bed-bug lines are light verse, not a limerick), Q36 (night
# children are spirit beings), Q38 (the drum and the guns are symbols), Q39 (the funeral piles
# are personified) and Q40 (Ulysses means to live life to the full). Rebuilt because a set-text
# detail could not be taught with certainty or the question had no single answer: Q5 (the
# medium of drama; now drama's means against prose and poetry), Q12 (Bigger's weekly pay; now his
# job), Q13 (Mr Dalton's opinion; now what his charity shows), Q14 (the colour of mourning clothes
# in Kufi; now what the title points to), Q15 (the bage cap; now Yaremi's refusal to be
# inherited), Q16 (the name of Yaremi's son; now the kind of work), Q22 (why the women settle at
# Iyara; now why the wives leave), Q24 (where the listener stands on stage; now who "those with
# full breasts" are). Options replaced so that exactly one answer fits: Q32 (no option named the
# bed-bugs), Q34 (four overlapping terms), Q35 ("alienation" beside despair), Q39 (metaphor beside
# personification) and Q40 (no option fitted the lines).
# Every stem names its set text; quotations are restored to the authors' words (Othello,
# Soyinka's Night, Tennyson's Ulysses) with their line breaks; plain typos are fixed.
