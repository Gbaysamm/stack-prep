# UTME Literature in English — the topics and subtopics every question is tagged with.
#
# Read from source/syllabus.pdf. The syllabus numbers its five topics straight through
# (Drama, Prose, Poetry, General Literary Terms and Principles, Literary Appreciation). A topic
# here is one numbered topic (LIT.<number>); a subtopic is one of its lettered contents, (a),
# (b), (c) in the syllabus's own lettering, and a topic printed with a single content, or
# none, has one subtopic, `a`. database/load_retranscribed_literature.py builds the curriculum
# from this file, and every retranscribed_YYYY.yaml uses these codes.
#
# Questions on a set text (a play, a novel, a prescribed poem) are tagged with the genre's
# interpretation subtopic (LIT.1.c, LIT.2.c, LIT.3.c) unless they test a technique (LIT.1.b,
# LIT.2.b, LIT.3.b) or a type (LIT.1.a, LIT.2.a, LIT.3.a). Unseen extracts are LIT.5.a; a
# definition of a literary term asked without a text is LIT.4.a.
format_version: 1
topics:
  LIT.1:
    name: Drama
    subtopics:
      LIT.1.a: "Types of drama: tragedy, comedy, tragicomedy, melodrama, farce, opera"
      LIT.1.b: "Dramatic techniques"
      LIT.1.c: "Interpretation of the prescribed plays: theme, plot, context, setting"
  LIT.2:
    name: Prose
    subtopics:
      LIT.2.a: "Types of prose: fiction, non-fiction, faction"
      LIT.2.b: "Narrative techniques: point of view, characterisation, language"
      LIT.2.c: "Analysis of the prescribed novels: theme, plot, setting, context"
  LIT.3:
    name: Poetry
    subtopics:
      LIT.3.a: "Types of poetry: sonnet, ode, lyric, elegy, ballad, panegyric, epic"
      LIT.3.b: "Poetic devices: imagery, sound, diction, persona"
      LIT.3.c: "Appreciation of the prescribed poems: theme, relevance, style"
  LIT.4:
    name: General Literary Terms and Principles
    subtopics:
      LIT.4.a: "Literary terms across drama, prose and poetry"
  LIT.5:
    name: Literary Appreciation
    subtopics:
      LIT.5.a: "Unseen passages and extracts from drama, prose and poetry"
