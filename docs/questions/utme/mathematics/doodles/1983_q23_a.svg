<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A chain: V goes through a flip to give w, and w goes through a cube to give u">
  <g data-part="vb">
    <path d="M34 60C34 67.7 28.1 74.6 20 74.6C11.9 74.6 6.4 67.5 6.4 60C6.4 52.5 11.9 45.3 20 45.3C28.1 45.3 34 52.3 34 60Z" fill="#3b82f6" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="66" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">V</text>
  </g>
  <g data-part="wb">
    <path d="M73.7 60C73.7 67.6 67.3 73.3 60 73.3C52.7 73.3 45.9 67.8 45.9 60C45.9 52.2 52 45.5 60 45.5C68 45.5 73.7 52.4 73.7 60Z" fill="#fde047" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="66" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">w</text>
  </g>
  <g data-part="ub">
    <path d="M114 60C114 67.7 107.6 73.8 100 73.8C92.4 73.8 86 67.8 86 60C86 52.2 91.9 45.3 100 45.3C108.1 45.3 114 52.3 114 60Z" fill="#22c55e" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="66" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">u</text>
  </g>
  <g data-part="flip">
    <path d="M36 60Q40 60 44 60" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40.4 57.8L44 60L40.4 62.2" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="34" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">w = k/V</text>
  </g>
  <g data-part="cubed">
    <path d="M76 60Q80 60 84 60" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M80.4 57.8L84 60L80.4 62.2" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="94" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">u = cw³</text>
  </g>
  <text x="40" y="114" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">u from V?</text>
</svg>
