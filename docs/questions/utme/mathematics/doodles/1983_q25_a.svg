    <text x="24" y="22.3" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">−2</text>
    <path d="M24 30Q24 35 24 40" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M26.2 36.4L24 40L21.8 36.4" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-part="machine">
    <path d="M14 36Q26.6 36.8 38 36Q35.6 42.8 32 50Q25.1 49.6 20 50Q16.2 43.4 14 36" fill="#fde047" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8 50Q51.9 50.1 96 50Q96.6 70.3 96 90Q51.2 90.4 8 90Q8.6 70.7 8 50" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M96 74Q101.5 77.2 108 82Q107.4 85.4 108 90Q101.6 89.8 96 90Q96.2 82.4 96 74" fill="#fde047" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M89 59C89 60.7 87.6 61.9 86 61.9C84.4 61.9 83.1 60.6 83.1 59C83.1 57.4 84.3 55.9 86 55.9C87.7 55.9 89 57.3 89 59Z" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="76.4" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">x³ − x + 3</text>
  </g>
