    <path d="M178 94Q177.9 99.9 178 106" fill="none" stroke="#1d1b3a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="178" y="128" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">1</text>
