    <path d="M183.2 100C183.2 102.9 180.8 105.1 178 105.1C175.2 105.1 172.9 102.8 172.9 100C172.9 97.2 175.1 94.8 178 94.8C180.9 94.8 183.2 97.1 183.2 100Z" fill="#fde047" fill-opacity="0.6" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
