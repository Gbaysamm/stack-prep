<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="A balance: y minus 1 all squared on the left pan, 4y minus 7 on the right; which y balances it?">
  <path d="M150 112Q154.2 83.1 160 54Q164.5 82.7 170 112Q160.6 111.9 150 112" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M142 112Q159.5 112.7 178 112" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M70 54Q160.6 53.6 250 54" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M70 54Q57.9 71.7 46 90" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M70 54Q81.9 71.1 94 90" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 90Q70 102 110 90Z" fill="#fde047" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M250 54Q237.7 71.8 226 90" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M250 54Q261.6 72.8 274 90" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M210 90Q250 102 290 90Z" fill="#fde047" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <g data-part="left">
    <text x="70" y="36" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a">(y − 1)²</text>
  </g>
  <g data-part="right">
    <text x="250" y="36" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a">4y − 7</text>
  </g>
