<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="A bank: Udoh puts in 150 naira, and over 5 years the interest adds up to 55 naira">
  <g data-part="bank">
    <path d="M14 58Q38.8 41.2 64 24Q89.8 41.8 114 58Q63.5 58.5 14 58" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 58Q64.1 58 110 58Q110.3 61.2 110 66Q63.6 65.4 18 66Q18.1 62.5 18 58" fill="none" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 68L30 116M50 68L50 116M78 68L78 116M98 68L98 116" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 116Q63.4 116.7 116 116Q115.3 120.5 116 125Q63.8 125.8 12 125Q11.1 121.3 12 116" fill="none" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="52" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">BANK</text>
  </g>
  <g data-part="principal">
    <text x="64" y="156" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a">₦150 in</text>
  </g>
  <g data-part="years">
    <path d="M136 128Q220.9 127.2 306 128" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="154" y="146" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">1</text>
    <text x="188" y="146" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">2</text>
    <text x="222" y="146" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">3</text>
    <text x="256" y="146" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">4</text>
    <text x="290" y="146" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">5</text>
    <text x="222" y="30" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">5 years</text>
  </g>
  <g data-part="interest">
    <path d="M138 154Q138 159 144 159L216 159Q221 159 221 164Q221 159 226 159L298 159Q304 159 304 154" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="222" y="186" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">₦55 interest</text>
  </g>
</svg>
