<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A rectangle y tall and x wide with area 187; it splits into a y by y square and a 6 by y strip">
  <g data-part="rect">
    <path d="M18 28Q60.9 27.1 103 28Q103.7 55.5 103 83Q60 83.7 18 83Q17.4 55.2 18 28" fill="#fde047" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-part="xside">
    <text x="60" y="20" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">x</text>
  </g>
  <g data-part="yside">
    <text x="9" y="62" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">y</text>
  </g>
  <g data-part="area">
    <text x="60" y="112" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">area = 187</text>
  </g>
  <g data-part="split">
    <path d="M73 28Q72.6 55.7 73 83" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
    <text x="45" y="62" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">y²</text>
    <text x="88" y="62" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">6y</text>
    <text x="45" y="96" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">y</text>
    <text x="88" y="96" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">6</text>
  </g>
</svg>
