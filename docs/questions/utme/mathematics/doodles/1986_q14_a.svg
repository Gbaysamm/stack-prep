<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A staircase of doubling from 1: one step up gives 2, two steps 4, three steps 8">
  <text x="60" y="16" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">how many ×2 steps?</text>
  <path d="M20 86Q35.2 86.3 50 86Q50 97.9 50 108Q35.2 108.6 20 108Q20.2 96.6 20 86" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M50 64Q65.4 64.1 80 64Q80.9 86.8 80 108Q65.2 108.3 50 108Q50.2 85.3 50 64" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M80 42Q94.8 41.6 110 42Q110.5 75.9 110 108Q95.7 108.3 80 108Q79.7 75.4 80 42" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="10" y="104" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">1</text>
  <g data-part="s1">
    <text x="35" y="102" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">2</text>
    <text x="17" y="84" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">×2</text>
  </g>
  <g data-part="s2">
    <text x="65" y="80" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">4</text>
    <text x="47" y="62" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">×2</text>
  </g>
  <g data-part="s3">
    <text x="95" y="58" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">8</text>
    <text x="77" y="40" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">×2</text>
  </g>
</svg>
