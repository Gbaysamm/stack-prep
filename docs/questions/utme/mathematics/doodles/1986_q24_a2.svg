<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="A big square A with a small square B cut from its corner; the L that is left rearranged into a rectangle A + B long and A − B tall">
  <path d="M20 50Q70.9 50.8 120 50Q119.4 99.2 120 150Q69.2 149.3 20 150Q19.7 99.2 20 50" fill="#fde047" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M20 50Q44.8 49.1 70 50Q69.6 75.9 70 100Q44.4 100.5 20 100Q19.2 74.8 20 50" fill="#ec4899" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="45" y="82" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">B²</text>
  <text x="84" y="132" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">A² − B²</text>
  <g data-part="aside">
    <text x="70" y="172" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a">A</text>
  </g>
  <g data-part="bside">
    <text x="45" y="42" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">B</text>
  </g>
  <path d="M128 125Q142 125 156 125" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M151.5 122.2L156 125L151.5 127.8" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g data-part="rect">
    <path d="M162 100Q212.8 99.6 262 100Q261.4 125.6 262 150Q211.8 149.3 162 150Q162 124.3 162 100" fill="#fde047" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M262 100Q287.8 99.7 312 100Q312.1 124.9 312 150Q287.8 150.4 262 150Q262.4 124.5 262 100" fill="#fde047" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="212" y="132" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">A × (A − B)</text>
    <text x="287" y="132" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">B</text>
  </g>
  <g data-part="rtop">
    <text x="237" y="90" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">A + B</text>
  </g>
  <g data-part="rbot">
    <text x="237" y="178" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">(A − B)(A + B)</text>
  </g>
</svg>
