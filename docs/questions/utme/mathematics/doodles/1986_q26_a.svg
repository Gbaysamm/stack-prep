<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A rectangle x + 2 wide and x − 2 tall: its area x squared minus 4 contains both small bottoms">
  <g data-part="top">
    <text x="78" y="22" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">x + 2</text>
  </g>
  <g data-part="left">
    <text x="22" y="70" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">x − 2</text>
  </g>
  <g data-part="area">
    <path d="M46 30Q78.5 30.8 112 30Q112 65.3 112 100Q78.5 99.2 46 100Q45.6 65.8 46 30" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="79" y="71" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">x² − 4</text>
  </g>
</svg>
