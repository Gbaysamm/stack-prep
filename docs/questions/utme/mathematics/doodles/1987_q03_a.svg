<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A metre stick beside a yard stick: the metre is a tenth of a yard longer, 1 m = 1.1 yd">
  <text x="60" y="18" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">1 m = 1.1 yd</text>
  <g data-part="metre">
    <path d="M8 28Q54.9 27.3 102 28Q101.4 36.5 102 44Q55.6 44.5 8 44Q7.2 36.7 8 28" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="55" y="41" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">1 m</text>
  </g>
  <g data-part="extra">
    <path d="M102 28Q106.7 28.4 112 28Q111.6 36.7 112 44Q107.8 44.4 102 44Q102 35.9 102 28" fill="#fde047" fill-opacity="0.55" stroke="#1d1b3a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="107" y="60" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">0.1</text>
  </g>
  <g data-part="yard">
    <path d="M8 70Q55.6 70.1 102 70Q102.8 77.3 102 86Q54.5 86.6 8 86Q8.8 77.3 8 70" fill="#22c55e" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="55" y="83" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">1 yd</text>
  </g>
  <path d="M102 64Q102.6 78.2 102 92" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
</svg>
