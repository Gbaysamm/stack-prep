<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="Three wage envelopes: 20 weeks at 20 naira, 24 weeks at 36 naira and 8 weeks unknown; the year average is 30 naira">
  <g data-part="env1">
    <path d="M4 36Q21.3 35.7 38 36Q37.8 48.5 38 62Q21.2 62.4 4 62Q4.6 49.8 4 36" fill="#22c55e" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4 36L21 48L38 36" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="21" y="26" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">20 wks</text>
    <text x="21" y="82" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">₦20</text>
  </g>
  <g data-part="env2">
    <path d="M43 36Q59.1 36.9 77 36Q76.1 49.1 77 62Q60.3 61.6 43 62Q43.2 49 43 36" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M43 36L60 48L77 36" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="26" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">24 wks</text>
    <text x="60" y="82" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">₦36</text>
  </g>
  <g data-part="env3">
    <path d="M82 36Q98.6 36.2 116 36Q116.3 48.2 116 62Q98.6 61.2 82 62Q82.9 48.4 82 36" fill="#7c3aed" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M82 36L99 48L116 36" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="99" y="26" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">8 wks</text>
    <text x="99" y="82" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">?</text>
  </g>
  <g data-part="mean">
    <text x="60" y="108" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">year mean ₦30</text>
  </g>
</svg>
