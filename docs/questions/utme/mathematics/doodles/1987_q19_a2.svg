<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A chain: R is squared to give V, and V is flipped to give P; then a jump straight from R to P">
  <g data-part="rb">
    <path d="M29.1 70C29.1 76.1 23.7 80.4 18 80.4C12.3 80.4 6.9 76.1 6.9 70C6.9 63.9 12.2 59.4 18 59.4C23.8 59.4 29.1 63.9 29.1 70Z" fill="#3b82f6" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="18" y="76" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">R</text>
  </g>
  <g data-part="vb">
    <path d="M71.6 70C71.6 76.4 65.9 80.6 60 80.6C54.1 80.6 48.6 76.3 48.6 70C48.6 63.7 53.8 58.8 60 58.8C66.2 58.8 71.6 63.6 71.6 70Z" fill="#fde047" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="76" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">V</text>
  </g>
  <g data-part="pb">
    <path d="M112.6 70C112.6 75.8 108.1 81.1 102 81.1C95.9 81.1 91 76.1 91 70C91 63.9 96.1 59.2 102 59.2C107.9 59.2 112.6 64.2 112.6 70Z" fill="#22c55e" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="102" y="76" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">P</text>
  </g>
  <g data-part="sq">
    <path d="M31 70Q39 70 47 70" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M43.4 67.8L47 70L43.4 72.2" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="100" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">V = cR²</text>
  </g>
  <g data-part="flip">
    <path d="M73 70Q81 70 89 70" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M85.4 67.8L89 70L85.4 72.2" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="100" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">P = k/V</text>
  </g>
  <g data-part="rp">
    <path d="M22 54Q60 14 98 54" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M96.9 48.8L98 54L92.9 52.6" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="22" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">P = K/R²</text>
  </g>
</svg>
