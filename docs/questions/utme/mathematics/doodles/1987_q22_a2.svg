<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="6 to the power 2x + 1 as cards: 6 times 6 to the x times 6 to the x; then each 6 to the x is tagged u, giving 6u squared minus 7u minus 5">
