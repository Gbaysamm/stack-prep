  <text x="46.5" y="40.1" font-family="Caveat, cursive" font-size="16" text-anchor="start" fill="#1d1b3a">2x + 1</text>
  <text x="106" y="50" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a">=</text>
  <g data-part="six">
    <path d="M124 22Q144.1 22.7 164 22Q164.6 43.2 164 64Q144.7 64.4 124 64Q124.4 43.3 124 22" fill="#fde047" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="144" y="50.3" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a">6</text>
  </g>
  <text x="178" y="50" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">×</text>
  <g data-part="cards">
    <path d="M192 22Q213.7 22.8 236 22Q236 42.7 236 64Q214 64.2 192 64Q191.2 42.4 192 22" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="211" y="50" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a">6</text>
    <text x="217.5" y="40.1" font-family="Caveat, cursive" font-size="16" text-anchor="start" fill="#1d1b3a">x</text>
    <path d="M260 22Q282.1 21.5 304 22Q304.3 43.4 304 64Q282.2 63.3 260 64Q259.3 42.9 260 22" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="279" y="50" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a">6</text>
    <text x="285.5" y="40.1" font-family="Caveat, cursive" font-size="16" text-anchor="start" fill="#1d1b3a">x</text>
    <text x="248" y="50" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">×</text>
  </g>
  <g data-part="us">
    <path d="M214 68Q214 74 214 80" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M216.2 76.4L214 80L211.8 76.4" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M208 82L220 82A12 12 0 0 1 220 106L208 106A12 12 0 0 1 208 82Z" fill="#22c55e" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="214" y="100.6" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">u</text>
    <path d="M282 68Q282 74 282 80" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M284.2 76.4L282 80L279.8 76.4" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M276 82L288 82A12 12 0 0 1 288 106L276 106A12 12 0 0 1 276 82Z" fill="#22c55e" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="282" y="100.6" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">u</text>
  </g>
  <g data-part="quad">
    <text x="160" y="144" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a">6u² − 7u − 5</text>
