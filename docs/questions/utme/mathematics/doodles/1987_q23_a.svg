<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="A card 5 minus y, from x + y = 5, drops into the x slot of x squared minus 2y squared = 1">
  <text x="84" y="46" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">x + y = 5 gives</text>
  <g data-part="card">
    <path d="M176 18Q215.9 17.2 256 18Q256.5 37.2 256 58Q215.2 58.5 176 58Q176.1 37.3 176 18" fill="#fde047" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="216" y="45.3" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a">5 − y</text>
  </g>
  <g data-part="slot">
    <path d="M66 112h90v48h-90Z" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/>
    <text x="111" y="144" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a">x</text>
  </g>
  <g data-part="eq">
    <text x="52" y="146" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a">(</text>
    <text x="174" y="146" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a">)²</text>
    <text x="248" y="146" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a">− 2y² = 1</text>
  </g>
  <path data-path="drop" d="M216 38Q170 60 111 136" stroke="none" fill="none"/>
</svg>
