<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="The sun rising at 5.30 a.m. and setting at 7.00 p.m., crossing the sky over the horizon">
  <path d="M4 80Q59.5 80.6 116 80" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g data-part="am">
    <path d="M22 72Q41 36 60 36" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/>
  </g>
  <g data-part="pm">
    <path d="M60 36Q79 36 98 72" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/>
  </g>
  <text x="60" y="22" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">noon</text>
  <g data-part="rise">
    <text x="28" y="98" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">5.30 a.m.</text>
  </g>
  <g data-part="set">
    <text x="92" y="98" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">7.00 p.m.</text>
