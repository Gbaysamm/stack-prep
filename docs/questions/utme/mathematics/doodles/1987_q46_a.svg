  </g>
  <g data-part="sun">
    <path d="M30.2 70C30.2 74.5 26.2 77.7 22 77.7C17.8 77.7 14.1 74.4 14.1 70C14.1 65.6 17.7 62.2 22 62.2C26.3 62.2 30.2 65.5 30.2 70Z" fill="#fde047" fill-opacity="0.6" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 57v-5M9 70h-5M35 70h5M13 61l-3-3M31 61l3-3" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path data-path="rise-to-noon" d="M22 70Q41 34 60 34" stroke="none" fill="none"/>
  <path data-path="noon-to-set" d="M60 34Q79 34 98 70" stroke="none" fill="none"/>
