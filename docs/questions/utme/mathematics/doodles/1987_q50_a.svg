    <text x="209" y="124.6" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">trapezium</text>
  </g>
  <g data-part="count">
    <text x="160" y="172" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">parallelograms: ?</text>
  </g>
</svg>
