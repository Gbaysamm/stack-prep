  <g data-part="sq">
    <path d="M22 54Q64.8 53.1 108 54Q108.7 71.3 108 88Q65.1 87.5 22 88Q22.2 70.1 22 54" fill="none" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="65" y="76.6" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">square</text>
  </g>
  <g data-part="rect">
