    <text x="161" y="76.6" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">rectangle</text>
  </g>
  <g data-part="rhom">
    <path d="M214 54Q257.8 54.6 300 54Q299.8 71.2 300 88Q257.3 88 214 88Q214.7 70.4 214 54" fill="none" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="257" y="76.6" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">rhombus</text>
  </g>
  <g data-part="kite">
    <path d="M70 102Q112.2 102.3 156 102Q156.7 118.1 156 136Q112.3 136.7 70 136Q70 118.7 70 102" fill="none" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="113" y="124.6" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">kite</text>
  </g>
  <g data-part="trap">
