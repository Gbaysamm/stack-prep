<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="Two balances: the whole numbers on the left must equal those on the right, and so must the root 3 parts">
  <g data-part="whole">
    <path d="M14 34Q60.3 34 106 34" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M54 50Q56.7 42.2 60 34Q62.1 42.6 66 50Q59.6 49.4 54 50" fill="#fde047" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="26" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">4m − 6</text>
    <text x="88" y="26" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">6</text>
    <text x="60" y="64" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">whole numbers</text>
  </g>
  <g data-part="roots">
    <path d="M14 88Q60.2 88.4 106 88" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M54 104Q57.1 95.1 60 88Q62.6 95.3 66 104Q59.9 103.9 54 104" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="80" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">4 − 2m</text>
    <text x="88" y="80" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">−2</text>
    <text x="60" y="118" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">root 3 parts</text>
  </g>
</svg>
