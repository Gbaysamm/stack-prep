<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="A staircase of equal steps d: the 4th step is at minus 6, the 8th and 9th together make 72">
  <g data-part="stairs">
    <rect x="20" y="172" width="30" height="12" rx="2" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="52" y="153.3" width="30" height="30.7" rx="2" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="84" y="134.7" width="30" height="49.3" rx="2" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="116" y="116" width="30" height="68" rx="2" fill="#f97316" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="148" y="97.3" width="30" height="86.7" rx="2" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="180" y="78.7" width="30" height="105.3" rx="2" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="212" y="60" width="30" height="124" rx="2" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="244" y="41.3" width="30" height="142.7" rx="2" fill="#22c55e" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="276" y="22.7" width="30" height="161.3" rx="2" fill="#22c55e" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M10 104Q159.9 104 310 104" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
  <text x="14" y="98" font-family="Caveat, cursive" font-size="16" text-anchor="start" fill="#1d1b3a">0</text>
  <g data-part="t4">
    <text x="131" y="86" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">T₄ = −6</text>
  </g>
  <g data-part="t89">
    <text x="110" y="30" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">T₈ + T₉ = 72</text>
  </g>
  <g data-part="step">
    <path d="M180 78.7L212 78.7L212 60.0" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
    <text x="222" y="80.7" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">d</text>
  </g>
</svg>
