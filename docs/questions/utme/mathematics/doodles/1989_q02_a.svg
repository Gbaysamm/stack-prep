<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A number line with a window from 1 to 10; 4.5 sits inside the window, so the power of ten is still to be found">
  <g data-part="window">
    <path d="M16 46Q60.2 46.1 104 46Q104 68.3 104 90Q60 89.7 16 90Q16.2 67.4 16 46Z" fill="#fde047" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="16" y="108" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">1</text>
    <text x="104" y="108" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">10</text>
  </g>
  <path d="M6 68Q59.8 67.7 114 68" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g data-part="number">
    <circle cx="50" cy="68" r="4.5" fill="#ec4899" fill-opacity="0.6" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="60" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">4.5</text>
  </g>
  <g data-part="power">
    <text x="66" y="28" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">× 10</text>
    <text x="84" y="20" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">?</text>
  </g>
</svg>
