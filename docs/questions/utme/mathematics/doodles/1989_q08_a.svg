<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A savings jar: 800 naira fills it two thirds of the way, the top is one and a half times that, and the gap between is the interest; later four 100-naira coins, one a year">
  <text x="58" y="15" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">12½% a year</text>
  <g data-fill="money">
    <path d="M36 28Q35.6 66.9 36 106Q57.5 105.8 80 106Q79.5 66.5 80 28Z" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M33 20Q57.6 19.6 83 20Q83 23.7 83 28Q58.7 28.3 33 28Q32.3 23.4 33 20Z" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g data-part="principal">
    <path d="M30 54Q32.9 54 36 54" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="59" font-family="Caveat, cursive" font-size="15" text-anchor="end" fill="#1d1b3a">₦800</text>
  </g>
  <g data-part="top">
    <text x="28" y="34" font-family="Caveat, cursive" font-size="15" text-anchor="end" fill="#1d1b3a">1½×</text>
  </g>
  <g data-part="interest">
    <path d="M84 28Q89 28 89 33L89 37Q89 41 93 41Q89 41 89 45L89 49Q89 54 84 54" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="95" y="46" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">?</text>
  </g>
  <g data-part="years">
    <text x="58" y="119" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">? years</text>
  </g>
</svg>
