<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A savings jar: 800 naira fills it two thirds of the way, the top is one and a half times that, and the gap between is the interest; later four 100-naira coins, one a year">
