<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="Square tiles: a 2 by 2 square is 4 unit tiles, and a square of side root 3 has area 3; then 3 of the 4 tiles are crossed out, leaving 1">
  <g data-part="four">
    <path d="M8 30Q19.4 29.9 30 30Q29.9 40.6 30 52Q19 52.3 8 52Q7.6 41.3 8 30Z" fill="#fde047" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 30Q40.6 29.8 52 30Q51.6 41 52 52Q41.3 52.2 30 52Q29.8 40.9 30 30Z" fill="#fde047" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8 52Q18.7 51.7 30 52Q30.2 62.7 30 74Q18.9 73.7 8 74Q7.8 63 8 52Z" fill="#fde047" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 52Q40.6 51.9 52 52Q52 63.4 52 74Q40.8 74.1 30 74Q30 62.8 30 52Z" fill="#fde047" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="96" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">2² = 4</text>
  </g>
  <g data-part="three">
    <path d="M70 36Q89 35.7 108 36Q107.6 55.6 108 74Q88.8 74.1 70 74Q69.6 54.8 70 36Z" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="89" y="60" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">3</text>
    <text x="89" y="28" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">√3</text>
    <text x="89" y="96" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">(√3)² = 3</text>
  </g>
  <g data-part="left">
    <path d="M35 35Q41.2 41 47 47" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M47 35Q41.2 40.9 35 47" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M13 57Q19.2 62.9 25 69" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M25 57Q19 62.8 13 69" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M35 57Q40.8 62.9 47 69" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M47 57Q41.2 63.2 35 69" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="116" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">4 − 3 = 1</text>
  </g>
</svg>
