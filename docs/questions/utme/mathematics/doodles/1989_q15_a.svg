<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A dinner bill: 74 naira for 20 students, 96 naira for 30, and 15 students unknown; a fixed charge and a charge for each student are still to be found">
  <path d="M10 8L78 8L78 104L72 110L66 104L60 110L54 104L48 110L42 104L36 110L30 104L24 110L18 104L10 110Z" fill="#fde047" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="44" y="24" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">dinner bill</text>
  <g data-part="row20">
    <text x="44" y="46" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">20: ₦74</text>
  </g>
  <g data-part="row30">
    <text x="44" y="68" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">30: ₦96</text>
  </g>
  <g data-part="row15">
    <text x="44" y="92" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">15: ₦?</text>
  </g>
  <g data-part="fixed">
    <text x="100" y="34" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">fixed</text>
    <text x="100" y="50" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">₦?</text>
  </g>
  <g data-part="each">
    <text x="100" y="76" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">each</text>
    <text x="100" y="92" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">₦?</text>
  </g>
</svg>
