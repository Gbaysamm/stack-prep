<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A function machine f: x + 1 goes in at the top, the rule 2x squared minus 5x plus 3 is on its side, and what comes out is unknown">
  <g data-part="input">
    <text x="30" y="18" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">x + 1</text>
    <path d="M30 24Q34 32 38 40" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38.4 35.8L38 40L34.4 37.8" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-part="machine">
    <path d="M24 42Q59.5 41.2 96 42Q96.9 64.6 96 88Q60.7 87.4 24 88Q24.8 64.9 24 42Z" fill="#7c3aed" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="62" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">f</text>
    <text x="60" y="80" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">2x² − 5x + 3</text>
    <circle cx="34" cy="50" r="3" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="86" cy="50" r="3" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-part="output">
    <path d="M82 90Q87 97 92 104" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M91.7 99.8L92 104L88.1 102.3" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="116" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">?</text>
  </g>
</svg>
