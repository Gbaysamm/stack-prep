<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="Two baskets: one holds y and a box marked y squared minus 4, the other holds xy and the same box">
  <g data-part="left">
    <path d="M4 56Q7.5 78.2 10 100Q30.1 99.9 50 100Q52.7 78.5 56 56" fill="#f97316" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4 56Q30.6 56 56 56" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="80" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">y</text>
  </g>
  <g data-part="box1">
    <path d="M6 18Q30.5 17.2 54 18Q54 31.9 54 44Q30.8 43.6 6 44Q5.4 30.5 6 18Z" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="36" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">y² − 4</text>
  </g>
  <g data-part="right">
    <path d="M64 56Q67.2 77.7 70 100Q90.3 100.1 110 100Q113.5 78.5 116 56" fill="#22c55e" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M64 56Q90.1 56.7 116 56" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="80" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">xy</text>
  </g>
  <g data-part="box2">
    <path d="M66 18Q90.9 17.5 114 18Q113.7 31.5 114 44Q90.4 44.3 66 44Q65.3 30.5 66 18Z" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="36" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">y² − 4</text>
  </g>
  <text x="60" y="116" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">the same box in both</text>
</svg>
