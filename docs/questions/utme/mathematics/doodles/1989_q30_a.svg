<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A frog on a number line at minus 8 makes three equal hops to 19; the two stops between are m and n">
  <path d="M4 88Q59.8 88.9 116 88" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g data-part="start">
    <path d="M12 82Q11.9 88 12 94" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="12" y="110" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">−8</text>
  </g>
  <g data-part="m">
    <path d="M44 82Q44 88 44 94" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="110" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">m</text>
  </g>
  <g data-part="n">
    <path d="M76 82Q76 88 76 94" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="110" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">n</text>
  </g>
  <g data-part="end">
    <path d="M108 82Q108.1 88.2 108 94" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="108" y="110" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">19</text>
  </g>
  <g data-part="hop1">
    <path d="M12 80Q28 46 44 80" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/>
    <text x="28" y="52" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">d</text>
  </g>
  <g data-part="hop2">
    <path d="M44 80Q60 46 76 80" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/>
    <text x="60" y="52" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">d</text>
  </g>
  <g data-part="hop3">
    <path d="M76 80Q92 46 108 80" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/>
    <text x="92" y="52" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">d</text>
  </g>
  <g data-part="frog">
    <path d="M19.9 72C19.9 75.3 16.3 77.8 12 77.8C7.7 77.8 4.1 75.3 4.1 72C4.1 68.7 7.4 65.8 12 65.8C16.6 65.8 19.9 68.7 19.9 72Z" fill="#22c55e" fill-opacity="0.55" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="8" cy="65" r="2.6" fill="#22c55e" fill-opacity="0.55" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="16" cy="65" r="2.6" fill="#22c55e" fill-opacity="0.55" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path data-path="hops" d="M12 72Q28 38 44 72Q60 38 76 72Q92 38 108 72" stroke="none" fill="none"/>
</svg>
