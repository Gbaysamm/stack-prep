<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="An equilateral triangle of side 2 with 60 degree corners; then its height is dropped, cutting the base into halves of 1, and the height is root 3">
  <g data-part="tri">
    <path d="M60 16Q37.9 56 16 96Q59.7 96.2 104 96Q82 56 60 16Z" fill="#22c55e" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="52" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">2</text>
    <text x="92" y="52" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">2</text>
    <text x="38" y="90" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">60°</text>
  </g>
  <g data-part="height">
    <path d="M60 16Q59.8 55.8 60 96" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/>
    <path d="M60 88L68 88L68 96" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="66" font-family="Caveat, cursive" font-size="15" text-anchor="start" fill="#1d1b3a">√3</text>
  </g>
  <g data-part="half">
    <text x="82" y="112" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">1</text>
    <text x="38" y="112" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">1</text>
  </g>
</svg>
