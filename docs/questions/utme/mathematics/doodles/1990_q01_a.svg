    <path d="M52 76Q51.8 79.9 52 84" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M66 76Q66 79.9 66 84" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M80 76Q80.1 79.9 80 84" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M94 76Q94.1 80.2 94 84" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M108 76Q108.1 80 108 84" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="38" y="102" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">0</text>
  </g>
  <g data-part="start">
    <path d="M109.1 80C109.1 82.5 107.1 84.6 104.5 84.6C101.9 84.6 100 82.5 100 80C100 77.5 102 75.5 104.5 75.5C107 75.5 109.1 77.5 109.1 80Z" fill="#3b82f6" fill-opacity="0.6" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104.5" y="102" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">4¾</text>
  </g>
  <g data-part="hop">
    <path d="M104.5 72Q60.8 46 17 72" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
