    <text x="60" y="50" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">back 6¼</text>
  </g>
  <g data-part="land">
    <circle cx="17" cy="80" r="4.5" fill="#ec4899" fill-opacity="0.6" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="17" y="102" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">?</text>
