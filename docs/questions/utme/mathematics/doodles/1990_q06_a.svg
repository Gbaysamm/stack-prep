<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="Two trays: the ordinary numbers in one, the powers of ten in the other, worked on separately">
  <text x="60" y="20" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">sort into two trays</text>
  <g data-part="nums">
    <text x="31" y="44" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">numbers</text>
    <path d="M6 52Q7.9 67.6 10 84Q30.9 84.4 52 84Q53.6 68.5 56 52" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="31" y="76" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">?</text>
  </g>
  <g data-part="pows">
    <text x="89" y="44" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">tens</text>
    <path d="M64 52Q65.9 68.4 68 84Q88.6 84.1 110 84Q112.4 67.9 114 52" fill="#7c3aed" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="89" y="76" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">?</text>
  </g>
  <g data-part="result">
    <text x="60" y="112" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">then join them</text>
  </g>
</svg>
