    <path d="M34 54Q59.7 54.1 86 54Q85.9 61.4 86 69Q60.1 69.2 34 69Q34.2 61.7 34 54Z" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
    <path d="M34 39Q60.2 39.3 86 39Q86.1 46.7 86 54Q60.2 54.1 34 54Q33.7 46.4 34 39Z" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
  </g>
  <g data-part="count">
    <text x="104" y="84" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">?</text>
