<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A card showing 1 over x flips over to show a question mark: a negative power flips a fraction">
  <g data-part="card1">
    <path d="M8 40Q26.4 40.8 46 40Q46.3 64.4 46 90Q27.3 89.9 8 90Q7.3 65.1 8 40Z" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="27" y="60" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">1</text>
    <path d="M15 66Q26.9 66.1 39 66" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="27" y="84" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">x</text>
  </g>
  <g data-part="flip">
    <path d="M30 34Q60 20 90 34" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M86.5 28.7L90 34L83.7 34.7" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="18" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">flip</text>
  </g>
  <g data-part="flipped">
    <path d="M72 40Q90.3 39.8 110 40Q109.5 65.3 110 90Q90.8 89.1 72 90Q72.5 65.8 72 40Z" fill="#ec4899" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="91" y="72" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">?</text>
  </g>
  <g data-part="rule">
    <text x="60" y="112" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">power −1 = flip</text>
  </g>
</svg>
