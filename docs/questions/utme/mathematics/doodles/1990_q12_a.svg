<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="Three value cards, a = 2, b = -2 and c = -1/2, above two empty bracket boxes that multiply to a question mark">
  <g data-part="vals">
    <path d="M3 8Q20.8 8.1 39 8Q38.9 19.8 39 32Q20.9 31.7 3 32Q2.8 19.7 3 8Z" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="21" y="25" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">a=2</text>
    <path d="M42 8Q59.9 8.1 78 8Q78.2 19.8 78 32Q59.9 32.2 42 32Q42.3 19.7 42 8Z" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="25" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">b=−2</text>
    <path d="M81 8Q99 7.9 117 8Q117.2 20.2 117 32Q98.8 32.2 81 32Q81 20.3 81 8Z" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="99" y="25" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">c=−½</text>
  </g>
  <g data-part="br1">
    <path d="M6 48Q28.8 47.9 50 48Q49.7 65.6 50 84Q28.5 84.6 6 84Q6.7 66.6 6 48Z" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="72" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">?</text>
    <text x="28" y="99" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">bracket 1</text>
  </g>
  <text x="60" y="72" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">×</text>
  <g data-part="br2">
    <path d="M70 48Q92.3 48.9 114 48Q113.7 66.2 114 84Q91.7 84.7 70 84Q70.3 66.6 70 48Z" fill="#f97316" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="92" y="72" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">?</text>
    <text x="92" y="99" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">bracket 2</text>
  </g>
  <g data-part="prod">
    <text x="60" y="118" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">product = ?</text>
  </g>
</svg>
