<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A chain of three dials: Z drives X, and X drives Y; later, doubling Z makes X four times bigger and divides Y by 16">
  <g data-part="z">
    <path d="M56.5 18C56.5 24.9 50.9 30.4 44 30.4C37.1 30.4 31.3 25 31.3 18C31.3 11 37.7 6.6 44 6.6C50.3 6.6 56.5 11.1 56.5 18Z" fill="#3b82f6" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="24" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">Z</text>
  </g>
  <g data-part="x">
    <path d="M56.7 60C56.7 67 51 72.7 44 72.7C37 72.7 32.3 66.5 32.3 60C32.3 53.5 37.2 47.6 44 47.6C50.8 47.6 56.7 53 56.7 60Z" fill="#fde047" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="66" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">X</text>
  </g>
  <g data-part="y">
    <path d="M56.3 102C56.3 108.8 51 114.7 44 114.7C37 114.7 32.7 108.2 32.7 102C32.7 95.8 37.3 89.8 44 89.8C50.7 89.8 56.3 95.2 56.3 102Z" fill="#ec4899" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="108" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">Y</text>
  </g>
  <path d="M44 32Q44 39 44 46" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M46.8 41.5L44 46L41.2 41.5" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M44 74Q44 81 44 88" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M46.8 83.5L44 88L41.2 83.5" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g data-part="rel1">
    <text x="90" y="44" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">X = mZ²</text>
  </g>
  <g data-part="rel2">
    <text x="90" y="86" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">Y = k/X²</text>
  </g>
</svg>
