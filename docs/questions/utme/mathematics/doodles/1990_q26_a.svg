    <text x="65.4" y="108" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a"> = 3</text>
  </g>
  <g data-part="zlab">
    <text x="98" y="108" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">z = ?</text>
