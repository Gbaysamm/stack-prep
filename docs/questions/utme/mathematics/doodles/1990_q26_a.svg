  </g>
  <g data-part="sqz">
    <path d="M82 56Q97.6 56.8 114 56Q114.2 71.9 114 88Q97.3 88.4 82 88Q82.7 72.8 82 56Z" fill="#22c55e" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
