  </g>
  <g data-part="ylab">
    <path d="M38.8 103.6L41.3 102.5L43.8 109L46.8 97.1L54.7 97.1" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
