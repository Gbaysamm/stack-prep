<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="Musa's debt as a jar: 10 naira borrowed at 2% a month for 4 months; later four 20-kobo interest coins; 8 naira paid back; how much is still owed">
  <g data-part="rate">
    <text x="32" y="14" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">2% a month</text>
  </g>
  <g data-part="months">
    <path d="M86 4Q100.2 4.1 114 4Q113.9 17.3 114 30Q99.9 30 86 30Q85.9 17 86 4Z" fill="none" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M86 11Q99.9 10.9 114 11" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="27" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">4</text>
    <text x="100" y="45" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">months</text>
  </g>
  <g data-fill="debt">
    <path d="M38 34Q38.1 66.4 38 98Q56.2 98.3 74 98Q73.7 65.8 74 34Z" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M35 26Q55.9 26.2 77 26Q77.5 29.9 77 34Q55.2 33.2 35 34Q34.4 30.5 35 26Z" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g data-part="borrow">
    <path d="M31 40Q34.1 40.1 37 40" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="17" y="45" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">₦10</text>
  </g>
  <g data-part="repay">
    <path d="M2 78Q17.1 78.7 32 78Q32.3 87.1 32 96Q17.6 96.7 2 96Q2.7 87 2 78Z" fill="#22c55e" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="17" y="91.6" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">₦8</text>
    <path d="M36 66Q25.5 66.1 20 75" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M23.8 73.1L20 75L20 70.8" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-part="owed">
    <text x="56" y="116" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">owes ?</text>
  </g>
</svg>
