    <path d="M6 10Q6.9 24.7 8 40Q20 40 32 40Q32.8 24.7 34 10" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M3 8Q6 9.8 9 12" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8 34Q19.9 34.2 32 34Q32.1 36.9 32 40Q20.1 39.9 8 40Q7.9 36.9 8 34Z" fill="#3b82f6" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="58" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">3 gal</text>
    <text x="20" y="74" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">20%</text>
  </g>
  <g data-part="jug2">
    <path d="M86 10Q86.7 25.3 88 40Q100 40 112 40Q113.1 25 114 10" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
