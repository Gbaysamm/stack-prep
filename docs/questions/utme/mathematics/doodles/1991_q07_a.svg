<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A jug of 3 gallons that is 20% water and a jug of 5 gallons that is 15% water poured into one bucket of 8 gallons; what percentage is water?">
