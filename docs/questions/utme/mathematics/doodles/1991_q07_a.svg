    <path d="M88 35.5Q100.1 35.6 112 35.5Q111.8 37.8 112 40Q100.2 40.1 88 40Q87.9 37.6 88 35.5Z" fill="#3b82f6" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="58" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">5 gal</text>
    <text x="100" y="74" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">15%</text>
  </g>
  <path d="M36 44Q48.4 56.5 50 74" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M52.3 69.3L50 74L46.9 69.8" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M84 44Q71.6 56.5 70 74" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M73.1 69.8L70 74L67.7 69.3" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g data-part="mix">
    <g data-fill="water">
      <path d="M44 80Q46 96.9 48 114Q59.6 114.2 72 114Q73.9 97.3 76 80Q59.8 79.8 44 80Z" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="24" y="104" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">8 gal</text>
  </g>
  <g data-part="pct">
    <text x="98" y="98" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">?%</text>
    <text x="98" y="114" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">water</text>
  </g>
</svg>
