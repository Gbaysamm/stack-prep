<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="Logs count factors: ten is one block of 10, so log 10 is 1; four is two blocks of 2, so log 4 is 2 log 2">
  <g data-part="ten">
    <path d="M12 46Q30.5 45.8 50 46Q49.7 71.1 50 96Q31.3 96.4 12 96Q12.1 70.5 12 46Z" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="31" y="76.9" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">10</text>
    <text x="31" y="30" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">10 =</text>
    <text x="31" y="115" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">one 10</text>
  </g>
  <g data-part="twos">
    <path d="M66 66Q76.2 66.3 86 66Q86.1 81.1 86 96Q76.1 96.4 66 96Q66 80.6 66 66Z" fill="#f97316" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="86.3" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">2</text>
    <text x="91" y="86" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">×</text>
    <path d="M96 66Q106.4 65.5 116 66Q116.1 80.9 116 96Q106.1 95.9 96 96Q96.1 80.6 96 66Z" fill="#f97316" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="106" y="86.3" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">2</text>
    <text x="91" y="50" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">4 =</text>
    <text x="91" y="115" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">two 2s</text>
  </g>
</svg>
