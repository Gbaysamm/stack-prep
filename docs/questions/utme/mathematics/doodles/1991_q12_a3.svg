<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A multiplication grid: columns x squared, minus 3x, plus 1; rows x and minus a; the rows fill in one at a time">
  <g data-part="cols">
    <text x="43" y="20" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">x²</text>
    <text x="73" y="20" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">−3x</text>
    <text x="103" y="20" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">+1</text>
  </g>
  <g data-part="rows">
    <text x="14" y="46" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">x</text>
    <text x="14" y="76" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">−a</text>
  </g>
  <path d="M28 26Q73.1 26.2 118 26Q118.1 55.7 118 86Q73 85.8 28 86Q28.2 56.1 28 26Z" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M58 26L58 86M88 26L88 86M28 56L118 56" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g data-part="row1">
    <path d="M28 26Q73 25.9 118 26Q118.1 40.9 118 56Q73.1 56 28 56Q28 41 28 26Z" fill="#7c3aed" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="43" y="46" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">x³</text>
    <text x="73" y="46" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">−3x²</text>
    <text x="103" y="46" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">+x</text>
  </g>
  <g data-part="row2">
    <path d="M28 56Q73.1 55.9 118 56Q117.9 71.1 118 86Q72.8 86 28 86Q28 71 28 56Z" fill="#ec4899" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="43" y="76" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">−ax²</text>
    <text x="73" y="76" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">+3ax</text>
    <text x="103" y="76" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">−a</text>
  </g>
</svg>
