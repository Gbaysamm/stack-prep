<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A function machine g that squares its input and adds three times it; x + 1 goes in, what comes out? then g(x) is taken away">
  <g data-part="in">
    <text x="52" y="14" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">x + 1</text>
    <path d="M38 20Q51.4 19.3 66 20Q61.9 27.4 58 36Q51.5 35.8 46 36Q42.6 27.8 38 20Z" fill="#fde047" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-part="machine">
    <path d="M24 36Q58.6 35.8 94 36Q94.2 58.3 94 80Q59.1 80.2 24 80Q24.2 57.7 24 36Z" fill="#7c3aed" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="59" y="64" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">x² + 3x</text>
    <text x="14" y="62" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">g</text>
  </g>
  <g data-part="out">
    <path d="M80 80Q86.2 87.1 92 94" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M92 94Q96 97 100 100" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M98.4 96.1L100 100L95.8 99.6" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="108" y="112" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">?</text>
  </g>
</svg>
