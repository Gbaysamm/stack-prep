<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A 1 by 1 square with a B by B corner cut away, where B is a minus b; the L-shape that is left is re-cut into a rectangle 1 minus B by 1 plus B">
  <g data-part="lshape">
    <path d="M8 16Q35.2 15.7 64 16Q63.2 34.5 64 52Q53.8 51.2 44 52Q44.5 62.2 44 72Q26.3 71.1 8 72Q8.5 44.2 8 16Z" fill="#7c3aed" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="12" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">1</text>
    <text x="26" y="50" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">1²</text>
  </g>
  <g data-part="corner">
    <path d="M44 52Q53.8 51.9 64 52Q64 62.1 64 72Q53.9 71.9 44 72Q44 62.2 44 52Z" fill="#ec4899" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="67" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">B²</text>
  </g>
  <text x="92" y="40" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">B = a − b</text>
  <g data-part="rect">
    <path d="M76 58Q78.3 70.7 90 76" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M87.6 72.5L90 76L85.8 76.5" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8 82Q45.7 82.1 84 82Q83.8 99.2 84 116Q45.9 115.7 8 116Q7.9 99 8 82Z" fill="#7c3aed" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="46" y="104" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">(1−B)(1+B)</text>
  </g>
</svg>
