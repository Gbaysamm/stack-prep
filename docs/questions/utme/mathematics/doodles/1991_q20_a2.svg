<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="Two balances: 3x plus y balances 8, and x squared plus xy balances 6; y from the first is carried down into the second">
  <g data-part="scale1">
    <path d="M60 30Q56.3 36.3 53 42Q59.8 42.1 67 42Q63.4 35.5 60 30Z" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 30Q59.8 29.8 108 30" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15 27Q32 34 49 27" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M71 27Q88 34 105 27" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="21" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">3x + y</text>
    <text x="88" y="21" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">8</text>
  </g>
  <g data-part="scale2">
    <path d="M60 88Q56.8 94.4 53 100Q59.5 100.4 67 100Q64.1 94.3 60 88Z" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 88Q59.9 88.3 108 88" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15 85Q32 92 49 85" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M71 85Q88 92 105 85" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="79" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">x² + xy</text>
    <text x="88" y="79" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">6</text>
  </g>
  <g data-part="sub">
    <text x="64" y="62" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">y = 8 − 3x</text>
    <path d="M12 42Q16 53 12 64" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15.3 61.4L12 64L11.2 59.9" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
