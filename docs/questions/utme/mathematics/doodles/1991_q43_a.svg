  </g>
  <g data-part="surveyor">
    <circle cx="20" cy="73.4" r="3.4" fill="#f97316" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 76.7Q20.7 81.6 20 84.9" fill="none" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15.2 82Q17.2 79.8 20 78.6Q22 81.1 24.8 82" fill="none" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16.4 94Q18.8 89.4 20 84.9Q22 89.1 23.6 94" fill="none" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
