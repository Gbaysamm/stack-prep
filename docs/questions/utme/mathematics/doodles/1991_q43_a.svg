<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A surveyor walks 500 m up a hill that slopes at 30 degrees; how high does he rise?">
  <path d="M2 100Q60.1 100.1 118 100" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M10 100Q55.1 73.2 100 48Q99.9 74.2 100 100Q54.3 100.2 10 100Z" fill="#22c55e" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M26 100A16 16 0 0 0 24 92" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="38" y="96" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">30°</text>
  <text x="42" y="64" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">500 m</text>
  <g data-part="height">
