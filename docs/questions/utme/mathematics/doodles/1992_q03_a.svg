  <g data-part="tower">
    <path d="M40 14Q60.2 13.7 80 14Q80.2 26.7 80 40Q60.2 40.3 40 40Q40.3 26.5 40 14Z" fill="#7c3aed" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40 40Q59.6 40.5 80 40Q79.8 53 80 66Q60.3 65.7 40 66Q39.7 53.1 40 40Z" fill="#7c3aed" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40 66Q60.4 65.9 80 66Q80.2 78.9 80 92Q60.1 91.7 40 92Q39.9 78.7 40 66Z" fill="#7c3aed" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="28" y="33" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">a</text>
  <text x="28" y="59" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">a</text>
  <text x="28" y="85" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">a</text>
  <g data-part="count">
