<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="A big square of side A with a small square of side B cut from its corner; the L-shape left over rearranges into a rectangle A + B long and A minus B wide">
  <g data-part="big">
    <path d="M24 44Q56.9 43.2 89 44Q88.8 61.8 89 79Q107.1 79.6 124 79Q123.9 110.7 124 144Q73.5 144.1 24 144Q24.7 93.1 24 44Z" fill="#7c3aed" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="104" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a">A²</text>
    <text x="74" y="166" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">A = 3p</text>
  </g>
  <g data-part="small">
    <path d="M89 44Q106.7 44.1 124 44Q124 61.8 124 79Q106.7 78.9 89 79Q88.7 61.3 89 44Z" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="106.5" y="67" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">B²</text>
    <text x="106.5" y="32" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">B = q − 3r</text>
  </g>
  <text x="74" y="192" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">A² − B²</text>
  <path d="M97.5 52.5Q106.5 61.6 115.5 70.5" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M115.5 52.5Q106.6 61.3 97.5 70.5" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M132 60Q149 60 166 60" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M161.5 57.2L166 60L161.5 62.8" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g data-part="rect">
    <path d="M172 72Q239.2 72.4 307 72Q307.4 104.2 307 137Q239.5 137.1 172 137Q171.9 104.8 172 72Z" fill="#22c55e" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M272 72Q271.1 104.1 272 137" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/>
    <text x="239" y="158" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">A + B</text>
    <text x="168" y="111" font-family="Caveat, cursive" font-size="18" text-anchor="end" fill="#1d1b3a">A − B</text>
  </g>
  <text x="239" y="192" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">(A − B)(A + B)</text>
</svg>
