    <text x="98" y="90" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">8</text>
  </g>
  <text x="62" y="114" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">y = 9 or 64</text>
