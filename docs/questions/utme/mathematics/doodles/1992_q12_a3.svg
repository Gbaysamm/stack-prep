    <text x="28" y="90" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">side u</text>
  </g>
  <g data-part="three">
    <path d="M58 57Q65.6 57.3 73 57Q73 64.8 73 72Q65.6 71.9 58 72Q58 64.7 58 57Z" fill="#22c55e" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
