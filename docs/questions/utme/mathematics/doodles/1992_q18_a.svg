<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A jar marked 9 at the top; the terms 3, 2, four thirds and so on are poured in and the level creeps up towards 9 but never passes it">
  <text x="60" y="12" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">3 + 2 + 4/3 + …</text>
  <g data-fill="sum">
    <path d="M36 28Q35.9 69.5 36 112Q60.4 111.8 86 112Q86.4 70.5 86 28Z" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M33 20Q61.5 20.2 89 20Q88.1 23.9 89 28Q61.6 27.9 33 28Q32.6 23.2 33 20Z" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g data-part="nine">
    <path d="M26 28Q29.8 28 34 28" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="16" y="34" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">9</text>
  </g>
  <g data-part="first">
    <path d="M88 84Q92 84 96 84" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="89" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">3</text>
  </g>
</svg>
