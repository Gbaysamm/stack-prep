<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A machine that combines m with e; m goes in and m comes out unchanged; what is e?">
  <g data-part="input">
    <text x="10" y="70" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">m</text>
    <path d="M18 64Q24 64 30 64" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M25.5 61.2L30 64L25.5 66.8" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-part="machine">
    <path d="M32 44Q58.8 43.7 86 44Q85.6 64.5 86 84Q59.2 84.7 32 84Q31.2 63.7 32 44Z" fill="#7c3aed" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="59" y="70" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">m * e</text>
    <circle cx="44" cy="90" r="5" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="74" cy="90" r="5" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-part="output">
    <path d="M88 64Q94 64 100 64" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M95.5 61.2L100 64L95.5 66.8" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="110" y="70" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">m</text>
  </g>
  <g data-part="e">
    <path d="M40 12Q59.1 11.2 78 12Q77.3 22.9 78 34Q59.6 33.5 40 34Q39.8 22.6 40 12Z" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="59" y="27.9" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">e = ?</text>
  </g>
  <text x="60" y="114" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">m comes out unchanged</text>
</svg>
