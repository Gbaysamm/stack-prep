    <path d="M10 34L10 74M6 38L46 38M14 34L14 74M6 42L46 42M18 34L18 74M6 46L46 46M22 34L22 74M6 50L46 50M26 34L26 74M6 54L46 54M30 34L30 74M6 58L46 58M34 34L34 74M6 62L46 62M38 34L38 74M6 66L46 66M42 34L42 74M6 70L46 70" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="26" y="96" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">100</text>
    <text x="26" y="114" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">10²</text>
  </g>
  <g data-part="ten">
    <path d="M62 34Q64 33.9 66 34Q66.1 54.1 66 74Q64.2 74 62 74Q62 53.8 62 34Z" fill="#3b82f6" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="96" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">10</text>
    <text x="64" y="114" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">10¹</text>
  </g>
  <g data-part="one">
    <path d="M95 70Q97 70 99 70Q99.1 72 99 74Q97 74.1 95 74Q95 72.1 95 70Z" fill="#f97316" fill-opacity="0.55" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="97" y="96" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">1</text>
    <text x="97" y="114" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">10⁰</text>
  </g>
  <text x="80" y="22" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">÷ 10</text>
</svg>
