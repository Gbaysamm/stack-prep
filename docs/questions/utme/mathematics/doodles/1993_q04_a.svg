<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="Three piles: 100, 10 and 1, for 10 squared, 10 to the 1 and 10 to the 0; each step down divides by 10">
  <g data-part="hundred">
