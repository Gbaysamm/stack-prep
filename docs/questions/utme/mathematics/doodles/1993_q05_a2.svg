<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A square of side root 3 holds 3 tiles of area, a 2 by 2 square holds 4; 3 take away 4 leaves one tile short">
  <g data-part="three">
    <path d="M8 30Q26.5 30.1 46 30Q46.8 49.1 46 68Q26.4 68.5 8 68Q7.2 49.2 8 30Z" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="27" y="54" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">3</text>
    <text x="27" y="22" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">√3</text>
    <text x="27" y="88" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">(√3)² = 3</text>
  </g>
  <g data-part="four">
    <path d="M66 26Q76.9 26 88 26Q87.9 37.1 88 48Q76.6 48 66 48Q66 37.2 66 26Z" fill="#fde047" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M88 26Q98.8 26.3 110 26Q109.6 37.3 110 48Q99.1 48.1 88 48Q87.7 37.4 88 26Z" fill="#fde047" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M66 48Q76.8 48 88 48Q87.9 59.3 88 70Q76.7 70.1 66 70Q66.4 59.2 66 48Z" fill="#fde047" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M88 48Q99 47.7 110 48Q110.1 59.2 110 70Q98.6 70.1 88 70Q87.6 58.8 88 48Z" fill="#fde047" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="88" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">2² = 4</text>
  </g>
  <g data-part="short">
    <path d="M93 53Q99.1 58.8 105 65" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M105 53Q98.8 58.9 93 65" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="114" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">3 − 4 = −1</text>
  </g>
</svg>
