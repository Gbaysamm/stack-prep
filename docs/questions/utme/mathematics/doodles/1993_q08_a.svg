    <path d="M22.8 58Q30.3 58.4 37.2 58" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="114" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">₦225</text>
  </g>
  <text x="30" y="24" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">4% a year</text>
