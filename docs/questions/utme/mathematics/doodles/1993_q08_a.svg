    <path d="M24.4 57C5.2 67 5.2 97 30 96C54.8 97 54 67 35.6 57" fill="#22c55e" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
