<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A right-angled triangle with legs x and 3: its long side is the square root of x squared plus 9">
  <g data-part="tri">
    <path d="M14 96Q56.1 96 98 96Q97.9 66.2 98 36Q56.1 65.9 14 96Z" fill="#22c55e" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M90 96L90 88L98 88" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-part="leg">
    <text x="56" y="114" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">x</text>
  </g>
  <g data-part="three">
    <text x="108" y="70" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">3</text>
  </g>
  <g data-part="hyp">
    <text x="46" y="52" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">√(x²+9)</text>
  </g>
</svg>
