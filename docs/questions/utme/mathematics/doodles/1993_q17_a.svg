<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A function machine f whose input slot reads x plus 2; to make it read minus 1, x must be found, and the output is unknown">
  <g data-part="input">
    <path d="M10 8Q32.3 8.5 54 8Q54.1 19.6 54 30Q32.4 29.9 10 30Q10.4 18.9 10 8Z" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="24" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">x + 2</text>
    <path d="M32 32Q36 38 40 44" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M39.8 39.8L40 44L36.2 42.2" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-part="machine">
    <path d="M24 46Q60.2 46.8 96 46Q96.5 67 96 88Q60.4 87.9 24 88Q24.4 66.6 24 46Z" fill="#7c3aed" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="66" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">f</text>
    <text x="60" y="82" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">2x² + 7x − 5</text>
  </g>
  <g data-part="want">
    <text x="92" y="22" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">want −1</text>
  </g>
  <g data-part="output">
    <path d="M82 90Q87 96 92 102" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M91.4 97.8L92 102L88 100.6" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="116" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">?</text>
  </g>
</svg>
