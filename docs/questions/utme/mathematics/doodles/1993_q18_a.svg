<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A rectangle whose area is x cubed plus 7x squared minus x minus 7 and one side x squared minus 1; the other side is unknown">
  <g data-part="area">
    <path d="M14 28Q58.2 27.3 102 28Q101.6 57.7 102 88Q58.1 87.7 14 88Q14 58.6 14 28Z" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="56" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">x³ + 7x²</text>
    <text x="58" y="74" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">− x − 7</text>
  </g>
  <g data-part="side1">
    <text x="58" y="106" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">x² − 1</text>
  </g>
  <g data-part="side2">
    <text x="110" y="62" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">?</text>
  </g>
  <text x="58" y="18" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">area</text>
</svg>
