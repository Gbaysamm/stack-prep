<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A machine for the star: x and 2 go in, x to the power 2 comes out, and it must come out as x">
  <g data-part="inputs">
    <text x="34" y="18" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">x</text>
    <text x="86" y="18" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">2</text>
    <path d="M34 24Q39 32 44 40" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44 35.8L44 40L40.2 38.1" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M86 24Q81 32 76 40" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M79.8 38.1L76 40L76 35.8" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-part="machine">
    <path d="M22 42Q60.3 42.8 98 42Q98.6 60.8 98 78Q59.7 78 22 78Q22.8 59.2 22 42Z" fill="#f97316" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="66" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">x * y = x</text>
    <text x="84" y="59" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">y</text>
  </g>
  <g data-part="output">
    <path d="M60 80Q60 87 60 94" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M62.2 90.4L60 94L57.8 90.4" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="112" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">x² = x ?</text>
  </g>
</svg>
