<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A lift shaft: the equator is the ground floor, 30 degrees south is 30 floors down and 13 degrees north is 13 floors up; the lift rides from 30 south to 13 north">
  <path d="M22 12Q35.1 12.1 48 12Q47.6 63.2 48 114Q35.3 113.6 22 114Q22.3 63.2 22 12Z" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g data-part="north">
    <path d="M14 20Q34.9 20.2 56 20" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="25" font-family="Caveat, cursive" font-size="14" text-anchor="start" fill="#1d1b3a">13°N</text>
  </g>
  <g data-part="equator">
    <path d="M14 46Q35 45.9 56 46" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="51" font-family="Caveat, cursive" font-size="14" text-anchor="start" fill="#1d1b3a">equator 0°</text>
  </g>
  <g data-part="south">
    <path d="M14 106Q34.9 106.2 56 106" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="111" font-family="Caveat, cursive" font-size="14" text-anchor="start" fill="#1d1b3a">30°S</text>
  </g>
  <g data-part="lift">
    <path d="M26 96Q35.1 95.9 44 96Q43.9 104.3 44 112Q35.8 111.7 26 112Q25.4 104.2 26 96Z" fill="#3b82f6" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path data-path="up1" d="M35 104L35 44" stroke="none" fill="none"/>
  <path data-path="up2" d="M35 44L35 18" stroke="none" fill="none"/>
</svg>
