<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="Two trays for exam scripts: marks below 50, and marks of at least 50; how many land in each is unknown">
  <g data-part="below">
    <path d="M6 60Q9 74.4 12 88Q31.4 88 50 88Q53.3 74.2 56 60" fill="#ec4899" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M6 60Q31 59.4 56 60" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
