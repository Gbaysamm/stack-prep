    <text x="89" y="108" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">at least 50</text>
    <text x="89" y="80" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">?</text>
  </g>
  <g data-part="pile">
