<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A rectangle in four pieces: columns x and y, rows a squared and minus b squared; later its sides read x + y and a squared minus b squared">
  <g data-part="cols">
    <text x="50" y="16" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">x</text>
    <text x="90" y="16" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">y</text>
  </g>
  <g data-part="row-a">
    <path d="M30 24Q69.4 24.6 110 24Q110.8 44 110 64Q70.5 64.4 30 64Q29.3 43.4 30 24Z" fill="#7c3aed" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M70 24Q70.5 44.5 70 64" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="14" y="50" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">a²</text>
    <text x="50" y="50" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">a²x</text>
    <text x="90" y="50" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">a²y</text>
  </g>
  <g data-part="row-b">
    <path d="M30 64Q69.3 63.9 110 64Q109.6 78.9 110 94Q70.2 93.5 30 94Q29.2 79.1 30 64Z" fill="#f97316" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M70 64Q70.7 79.6 70 94" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="14" y="84" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">−b²</text>
    <text x="50" y="84" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">−b²x</text>
    <text x="90" y="84" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">−b²y</text>
  </g>
</svg>
