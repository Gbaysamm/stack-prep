  </g>
  <text x="60" y="16" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">row × column</text>
  <text x="60" y="114" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">pair up, multiply, add</text>
