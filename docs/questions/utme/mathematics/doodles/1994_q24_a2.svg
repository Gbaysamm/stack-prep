    <text x="39" y="78" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">y</text>
  </g>
  <g data-part="col">
    <path d="M80 40Q90.8 39.8 102 40Q101.8 51.1 102 62Q91 61.8 80 62Q80.5 50.7 80 40Z" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
