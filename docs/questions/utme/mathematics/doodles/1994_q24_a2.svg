<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A 2 by 2 grid of seats with 1, 1 in the top row and 3, y in the bottom row, and a column x, 1; then arrows pair each top-row seat with a column seat">
  <g data-part="row1">
