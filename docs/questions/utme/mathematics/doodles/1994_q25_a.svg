<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A 3 by 3 grid of numbers with signs plus, minus, plus over the top row; then the top row and the first column are covered, leaving the minor 5, 6, 0, -1">
  <g data-part="signs">
    <text x="34" y="18" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">+</text>
    <text x="60" y="18" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">−</text>
    <text x="86" y="18" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">+</text>
  </g>
  <g data-part="top">
    <rect x="21" y="26" width="26" height="26" rx="2" fill="#fde047" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="44.3" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">1</text>
    <rect x="47" y="26" width="26" height="26" rx="2" fill="#fde047" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="44.3" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">2</text>
    <rect x="73" y="26" width="26" height="26" rx="2" fill="#fde047" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="44.3" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">3</text>
  </g>
  <rect x="21" y="52" width="26" height="26" rx="2" fill="#22c55e" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="34" y="70.3" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">4</text>
  <rect x="21" y="78" width="26" height="26" rx="2" fill="#22c55e" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="34" y="96.3" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">2</text>
  <g data-part="minor1">
    <rect x="47" y="52" width="26" height="26" rx="2" fill="#3b82f6" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="70.3" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">5</text>
    <rect x="73" y="52" width="26" height="26" rx="2" fill="#3b82f6" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="70.3" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">6</text>
    <rect x="47" y="78" width="26" height="26" rx="2" fill="#3b82f6" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="96.3" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">0</text>
    <rect x="73" y="78" width="26" height="26" rx="2" fill="#3b82f6" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="96.3" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">−1</text>
  </g>
</svg>
