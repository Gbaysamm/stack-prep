<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="The four corners of a quadrilateral torn off and laid round a point: together they make a full turn of 360 degrees; three are the given angles and the fourth is unknown">
  <g data-part="three">
    <path d="M60 58L60 18A40 40 0 0 1 99.4 64.9Z" fill="#7c3aed" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 58L99.4 64.9A40 40 0 0 1 66.9 97.4Z" fill="#3b82f6" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 58L66.9 97.4A40 40 0 0 1 20.6 51.1Z" fill="#22c55e" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78.4" y="47.6" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">1st</text>
    <text x="77" y="80" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">2nd</text>
    <text x="43" y="80" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">3rd</text>
  </g>
  <g data-part="fourth">
    <path d="M60 58L20.6 51.1A40 40 0 0 1 60 18Z" fill="#f97316" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44.6" y="44.6" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">?</text>
  </g>
  <text x="60" y="116" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">four corners: 360°</text>
</svg>
