    <text x="60" y="118" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">8 cm</text>
    <text x="34" y="64" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">8 cm</text>
  </g>
  <text x="50" y="98" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">45°</text>
