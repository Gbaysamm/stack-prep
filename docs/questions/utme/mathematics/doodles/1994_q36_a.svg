<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A playground slide that drops 4 for every 3 across, with a child at the top ready to slide down">
  <path d="M4 104Q60.7 104.4 116 104" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g data-part="ladder">
    <path d="M58 30Q58.6 67 58 104" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48 30Q47.2 66.8 48 104" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48 50Q52.4 50.2 58 50" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48 70Q53.8 70.2 58 70" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48 90Q52.3 90.1 58 90" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-part="slide">
    <path d="M58 30Q85.6 66.9 113 104" fill="none" stroke="#1d1b3a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-part="drop">
    <text x="43" y="72" font-family="Caveat, cursive" font-size="15" text-anchor="end" fill="#1d1b3a">down 4</text>
  </g>
  <g data-part="across">
    <text x="86" y="118" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">across 3</text>
  </g>
  <g data-part="kid">
    <circle cx="64" cy="15.1" r="3.1" fill="#f97316" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M64 18.2Q64.4 21.7 64 25.6" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M59.6 23Q62.3 21.5 64 19.9Q65.3 21.7 68.4 23" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60.7 34Q62.8 29.4 64 25.6Q66.1 29.9 67.3 34" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-part="grad">
    <text x="100" y="44" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">m = ?</text>
  </g>
  <path data-path="down" d="M64 23L108 84" stroke="none" fill="none"/>
</svg>
