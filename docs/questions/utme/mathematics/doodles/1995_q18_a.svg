<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="The fraction&#x27;s factors as tiles: x minus 1 and x plus 1 on top; x plus 2, x minus 1 and x plus 1 underneath">
<g data-part="minus"><rect x="42" y="16" width="36" height="26" rx="4" fill="#fde047" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="34" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">(x−1)</text><rect x="42" y="64" width="36" height="26" rx="4" fill="#fde047" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="82" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">(x−1)</text></g>
<g data-part="plus"><rect x="82" y="16" width="36" height="26" rx="4" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="34" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">(x+1)</text><rect x="82" y="64" width="36" height="26" rx="4" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="82" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">(x+1)</text></g>
<g data-part="rest"><rect x="2" y="64" width="36" height="26" rx="4" fill="#ec4899" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="82" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">(x+2)</text></g>
<line x1="4" y1="53" x2="116" y2="53" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="60" y="112" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">cancel the pairs</text>
</svg>
