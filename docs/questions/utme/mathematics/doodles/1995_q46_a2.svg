<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="The scores 1 to 5 as dots on a line, balancing at their mean, 3; each distance from 3 drawn as a square: 4, 1, 0, 1, 4">
<line x1="8" y1="40" x2="112" y2="40" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<g data-part="scores"><circle cx="16" cy="40" r="3.5" fill="#1d1b3a"/><circle cx="38" cy="40" r="3.5" fill="#1d1b3a"/><circle cx="60" cy="40" r="3.5" fill="#1d1b3a"/><circle cx="82" cy="40" r="3.5" fill="#1d1b3a"/><circle cx="104" cy="40" r="3.5" fill="#1d1b3a"/><text x="16" y="32" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">1</text><text x="104" y="32" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">5</text></g>
<g data-part="mean"><line x1="60" y1="40" x2="60" y2="90" stroke="#1d1b3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="60,90 53,101 67,101" fill="#7c3aed" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="117" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">3</text></g>
<g data-part="squares"><rect x="16" y="40" width="44" height="44" fill="#f97316" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="67" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">4</text><rect x="60" y="40" width="44" height="44" fill="#f97316" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="67" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">4</text><rect x="38" y="18" width="22" height="22" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="49" y="34" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">1</text><rect x="60" y="18" width="22" height="22" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="34" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">1</text></g>
</svg>
