<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A card reading minus 1 about to drop into a machine f of x, which must give out 0">
<path data-path="in" d="M20 16Q46 -4 60 30" stroke="none" fill="none"/>
<g data-part="card"><rect x="6" y="6" width="28" height="20" rx="3" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="21" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">−1</text></g>
<polygon points="42,30 78,30 68,44 52,44" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<g data-part="machine"><path d="M24 44Q60 43.4 96 44Q96.6 64 96 84Q60 84.6 24 84Q23.4 64 24 44Z" fill="#7c3aed" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="70.3" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">f(x)</text></g>
<line x1="60" y1="84" x2="60" y2="92" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<g data-part="out"><rect x="46" y="92" width="28" height="22" rx="3" fill="#22c55e" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="108" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a" font-weight="700">0</text></g>
<text x="100" y="108" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">rem.</text>
</svg>
