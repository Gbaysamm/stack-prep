<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A pizza cut back into two slices, K over r minus 2 and L over r plus 1; K is 3">
<g data-part="k-slice"><path d="M60 16A42 42 0 0 0 60 100Z" fill="#f97316" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="54" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a" font-weight="700">K</text><line x1="26" y1="62" x2="50" y2="62" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="80" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">r − 2</text></g>
<g data-part="l-slice"><path d="M64 16A42 42 0 0 1 64 100Z" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="86" y="54" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a" font-weight="700">L</text><line x1="74" y1="62" x2="98" y2="62" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="80" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">r + 1</text></g>
<g data-part="k-val"><text x="30" y="116" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a" font-weight="700">K = 3</text></g>
</svg>
