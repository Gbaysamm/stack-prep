<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="A star machine takes 4 and 5; a circle-plus machine takes 3 and waits for its second input; the star machine gives out 14, which is carried across">
<g data-part="star"><path d="M20 64Q75 63.4 130 64Q130.6 92 130 120Q75 120.6 20 120Q19.4 92 20 64Z" fill="#7c3aed" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="75" y="99.7" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a">m * n</text><text x="75" y="142" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">mn − n − 1</text></g>
<g data-part="in1"><rect x="34" y="30" width="30" height="24" rx="3" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="49" y="48" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">4</text><rect x="86" y="30" width="30" height="24" rx="3" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="101" y="48" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">5</text></g>
<g data-part="oplus"><path d="M190 64Q245 63.4 300 64Q300.6 92 300 120Q245 120.6 190 120Q189.4 92 190 64Z" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="245" y="99.7" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a">m ⊕ n</text><text x="245" y="142" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">mn + n − 2</text></g>
<g data-part="m2"><rect x="204" y="30" width="30" height="24" rx="3" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="219" y="48" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">3</text></g>
<g data-part="n2"><path d="M256 30Q271 29.6 286 30Q286.4 42 286 54Q271 54.4 256 54Q255.6 42 256 30Z" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round"/></g>
<g data-part="out2"><rect x="230" y="160" width="30" height="26" rx="3" fill="#22c55e" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="245" y="179" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">?</text></g>
<text x="160" y="22" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">3 ⊕ (4 * 5)</text>
<path data-path="feed" d="M75 173Q160 200 176 110Q190 20 271 42" stroke="none" fill="none"/>
<g data-part="out1"><rect x="60" y="160" width="30" height="26" rx="3" fill="#22c55e" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="75" y="179" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">14</text></g>
</svg>
