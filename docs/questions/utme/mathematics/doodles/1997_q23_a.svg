<g data-part="row2"><rect x="43" y="112" width="38" height="12" rx="4" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="124" width="44" height="24" rx="5" fill="#3b82f6" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="142" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">−1</text><rect x="103" y="112" width="38" height="12" rx="4" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="100" y="124" width="44" height="24" rx="5" fill="#3b82f6" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="122" y="142" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">4</text></g>
