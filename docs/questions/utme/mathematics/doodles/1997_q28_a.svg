<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A round cake cut into 6 equal slices from the centre; one slice of 60 degrees is shaded, and its curved crust is the arc">
  <g data-part="cake">
    <circle cx="60" cy="64" r="44" fill="#f97316" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 64L104 64M60 64L82 25.9M60 64L38 25.9M60 64L16 64M60 64L38 102.1M60 64L82 102.1" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-part="slice">
    <path d="M60 64L82 25.9A44 44 0 0 0 38 25.9Z" fill="#ec4899" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M64.5 56.2A9 9 0 0 0 55.5 56.2" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-part="crust">
    <path d="M82 25.9A44 44 0 0 0 38 25.9" fill="none" stroke="#1d1b3a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="60" y="118" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">6 equal slices</text>
</svg>
