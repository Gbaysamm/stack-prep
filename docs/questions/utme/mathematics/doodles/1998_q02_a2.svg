<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A bar of 5 equal pieces with 4 shaded: 24 over 30 is 4 over 5, or 0.8; below, the 4 shaded pieces count as one whole and the bar holds 5 of them: 5 over 4, 1.25">
<g data-part="row1"><rect x="10" y="22" width="20" height="22" fill="#7c3aed" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="22" width="20" height="22" fill="#7c3aed" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="50" y="22" width="20" height="22" fill="#7c3aed" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="70" y="22" width="20" height="22" fill="#7c3aed" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="90" y="22" width="20" height="22" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="64" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">4 of 5 = 0.8</text></g>
<g data-part="row2"><rect x="10" y="72" width="20" height="22" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="72" width="20" height="22" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="50" y="72" width="20" height="22" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="70" y="72" width="20" height="22" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="90" y="72" width="20" height="22" fill="#f97316" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 99Q50 104 90 99" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="116" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">1 whole</text><text x="101" y="116" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">+¼</text></g>
</svg>
