<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="Three b blocks multiplied make b cubed; three blocks of 1 over a make a to the minus 3; the cube root keeps one block from each row, so b is 1 over a">
<g data-part="bs"><text x="14" y="30" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">b³</text><rect x="30" y="12" width="24" height="26" fill="#22c55e" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="30.3" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">b</text><rect x="60" y="12" width="24" height="26" fill="#22c55e" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="30.3" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">b</text><rect x="90" y="12" width="24" height="26" fill="#22c55e" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="30.3" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">b</text></g>
<text x="66" y="49" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">=</text>
<g data-part="as"><text x="14" y="70" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">a⁻³</text><rect x="30" y="52" width="24" height="26" fill="#ec4899" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="69.6" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">1/a</text><rect x="60" y="52" width="24" height="26" fill="#ec4899" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="69.6" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">1/a</text><rect x="90" y="52" width="24" height="26" fill="#ec4899" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="69.6" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">1/a</text></g>
<g data-part="root"><ellipse cx="42" cy="45" rx="17" ry="40" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="108" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">b = 1/a</text></g>
</svg>
