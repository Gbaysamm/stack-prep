<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="How many 4s multiply to make 4? One, so log base 4 of 4 is 1; how many 2s? Two, 2 times 2, so log base 2 of 4 is 2">
<text x="60" y="15" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">make 4</text>
<g data-part="fours"><rect x="12" y="24" width="28" height="26" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="42.9" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">4</text><text x="76" y="43" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">one 4</text><text x="60" y="66" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">log₄ 4 = 1</text></g>
<g data-part="twos"><rect x="12" y="76" width="26" height="24" fill="#22c55e" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="25" y="93.6" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">2</text><text x="45" y="94" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">×</text><rect x="52" y="76" width="26" height="24" fill="#22c55e" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="93.6" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">2</text><text x="98" y="94" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">two</text><text x="60" y="116" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">log₂ 4 = 2</text></g>
</svg>
