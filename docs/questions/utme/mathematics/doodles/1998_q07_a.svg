<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="Two clocks: normal hours paid r naira an hour, overtime 2r naira an hour; the 35-hour week is split into 35 minus q normal hours and q overtime hours">
<g data-part="normal"><circle cx="32" cy="46" r="20" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 46Q32.1 39.6 32 33.6" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 46Q36.4 47.5 41 49" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="46" r="2" fill="#1d1b3a" stroke="#1d1b3a" stroke-width="2"/><text x="29" y="16" font-family="Caveat, cursive" font-size="15" fill="#1d1b3a" text-anchor="middle">normal</text><text x="32" y="84" font-family="Caveat, cursive" font-size="16" fill="#1d1b3a" text-anchor="middle">₦r / h</text></g>
<g data-part="overtime"><circle cx="88" cy="46" r="20" fill="#ec4899" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M88 46Q87.9 39.7 88 33.6" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M88 46Q92.6 47.6 97 49" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="88" cy="46" r="2" fill="#1d1b3a" stroke="#1d1b3a" stroke-width="2"/><text x="91" y="16" font-family="Caveat, cursive" font-size="14" fill="#1d1b3a" text-anchor="middle">overtime</text><text x="88" y="84" font-family="Caveat, cursive" font-size="16" fill="#1d1b3a" text-anchor="middle">₦2r / h</text></g>
<g data-part="week-normal"><rect x="8" y="92" width="72" height="22" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="108" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">35 − q</text></g>
<g data-part="week-over"><rect x="80" y="92" width="32" height="22" fill="#ec4899" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="108" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">q</text></g>
</svg>
