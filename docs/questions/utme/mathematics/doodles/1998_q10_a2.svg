<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A machine for f(m): put in 1, the value that makes m minus 1 zero, and out comes the remainder 2; put in minus 1 and out comes 4">
<g data-part="machine"><rect x="34" y="26" width="52" height="78" rx="6" fill="#7c3aed" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="70" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">f(m)</text></g>
<g data-part="run1"><text x="12" y="50" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">1</text><path d="M20 44Q26.5 44 33 44M29.5 46L33 44L29.5 42" fill="none" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M87 44Q93.5 44 100 44M96.5 46L100 44L96.5 42" fill="none" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="108" y="50" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">2</text></g>
<text x="60" y="18" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">in → out</text>
<g data-part="run2"><text x="12" y="94" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">−1</text><path d="M22 88Q27.5 88 33 88M29.5 90L33 88L29.5 86" fill="none" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M87 88Q93.5 88 100 88M96.5 90L100 88L96.5 86" fill="none" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="108" y="94" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">4</text></g>
</svg>
