<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A square of area x with side root x, and in its corner a smaller square of area x minus 2; the big side is 1 longer; the sides turn out to be 3 over 2 and a half">
<g data-part="big"><rect x="10" y="24" width="72" height="72" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="18" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">√x</text><text x="56" y="52" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">area x</text></g>
<g data-part="small"><rect x="10" y="72" width="24" height="24" fill="#ec4899" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="116" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">x−2</text></g>
<g data-part="gap"><line x1="36" y1="102" x2="82" y2="102" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="36" y1="98" x2="36" y2="106" stroke="#1d1b3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="82" y1="98" x2="82" y2="106" stroke="#1d1b3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="59" y="116" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">1</text></g>
<g data-part="found"><text x="92" y="18" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">= 3/2</text><text x="22" y="66" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">½</text></g>
</svg>
