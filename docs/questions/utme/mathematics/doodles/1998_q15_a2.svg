<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="Dividing by 2x + 1 as building a rectangle of height 2x + 1 whose area is 2x cubed + 11x squared + 17x + 6; strip 1 is x squared long">
<line x1="70" y1="44" x2="70" y2="164" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="50" y="100" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">2x</text>
<text x="50" y="158" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">1</text>
<line x1="62" y1="134" x2="78" y2="134" stroke="#1d1b3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="34" y="30" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">length:</text>
<g data-part="area"><text x="160" y="190" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">area = 2x³ + 11x² + 17x + 6</text></g>
<g data-part="round1"><rect x="70" y="44" width="90" height="90" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="115" y="96" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">2x³</text><rect x="70" y="134" width="90" height="30" fill="#3b82f6" fill-opacity="0.55" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="115" y="156" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">x²</text><text x="115" y="30" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">x²</text></g>
</svg>
