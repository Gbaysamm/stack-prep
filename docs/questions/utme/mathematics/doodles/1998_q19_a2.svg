<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="Three terms of an arithmetic progression as a staircase with two equal steps d: p + 1, 2p minus 10, 1 minus 4p squared; with p = 2 the steps are 3, minus 6, minus 15, each a drop of 9">
<g data-part="stairs"><polygon points="20,50 110,50 110,100 200,100 200,150 290,150 290,185 20,185" fill="#7c3aed" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="65" y="40" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">p + 1</text>
<text x="155" y="90" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">2p − 10</text>
<text x="245" y="140" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">1 − 4p²</text>
<g data-part="steps"><text x="104" y="80" font-family="Caveat, cursive" font-size="20" text-anchor="end" fill="#1d1b3a">d</text><text x="194" y="130" font-family="Caveat, cursive" font-size="20" text-anchor="end" fill="#1d1b3a">d</text></g>
<g data-part="values"><text x="65" y="90" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a" font-weight="700">3</text><text x="155" y="140" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a" font-weight="700">−6</text><text x="245" y="176" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a" font-weight="700">−15</text><text x="104" y="102" font-family="Caveat, cursive" font-size="18" text-anchor="end" fill="#1d1b3a">−9</text><text x="194" y="152" font-family="Caveat, cursive" font-size="18" text-anchor="end" fill="#1d1b3a">−9</text></g>
</svg>
