<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A bar for the sum to infinity; the first three terms a, ar and ar squared fill its first half; the rest is r cubed of the whole, so r cubed is a half">
<text x="60" y="16" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">sum to ∞</text>
<rect x="8" y="40" width="104" height="24" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g data-part="first3"><rect x="8" y="40" width="21.5" height="24" fill="#3b82f6" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="29.5" y="40" width="17" height="24" fill="#22c55e" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="46.5" y="40" width="13.5" height="24" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="34" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">a, ar, ar²</text><path d="M9 72Q34 79 59 72" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="90" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">3 terms</text></g>
<g data-part="rest"><path d="M61 72Q86 79 111 72" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="86" y="90" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">rest</text></g>
<g data-part="cube"><text x="60" y="106" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">rest = r³ × all</text><text x="60" y="119" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">so r³ = ½</text></g>
</svg>
