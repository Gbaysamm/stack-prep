<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="The 3 by 3 grid of entries like a seat plan; row 1 and column 2 are covered, leaving 1 minus x, 3, 1 and 4">
<g data-part="grid"><rect x="15" y="15" width="30" height="30" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="35" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">x</text><rect x="45" y="15" width="30" height="30" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="35" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">1</text><rect x="75" y="15" width="30" height="30" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="35" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">0</text><rect x="15" y="45" width="30" height="30" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="65" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">1−x</text><rect x="45" y="45" width="30" height="30" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="65" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">2</text><rect x="75" y="45" width="30" height="30" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="65" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">3</text><rect x="15" y="75" width="30" height="30" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="95" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">1</text><rect x="45" y="75" width="30" height="30" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="95" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">1+x</text><rect x="75" y="75" width="30" height="30" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="95" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">4</text></g>
<g data-part="cover"><rect x="15" y="15" width="90" height="30" fill="#ec4899" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="45" y="45" width="30" height="60" fill="#ec4899" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g data-part="minor"><rect x="13" y="43" width="94" height="64" fill="none" stroke="#1d1b3a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="60" y="118" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">for the 1</text>
</svg>
