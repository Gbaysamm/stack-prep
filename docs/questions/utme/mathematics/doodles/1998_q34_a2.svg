<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A dial where cos is 1 only at the start, angle 0; 2x can make one full turn back to it, 2 pi, so x is half a turn, pi">
<circle cx="56" cy="60" r="34" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="18" y1="60" x2="94" y2="60" stroke="#1d1b3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="56" y1="22" x2="56" y2="98" stroke="#1d1b3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g data-part="hand"><line x1="56" y1="60" x2="90" y2="60" stroke="#1d1b3a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="90" cy="60" r="3.5" fill="#1d1b3a"/></g>
<text x="92" y="14" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">cos = 1</text>
<path d="M92 20Q91.5 36 91 52M89.1 48.5L91 52L93.1 48.6" fill="none" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80" y="76" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">0</text>
<g data-part="turn"><path d="M97.1 68.7A42 42 0 1 1 97.1 51.3" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M99.4 45.7L97.1 51.3L92.6 47.1" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="56" y1="60" x2="22" y2="60" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="22" cy="60" r="3.5" fill="#1d1b3a"/><text x="32" y="54" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">π</text><text x="56" y="116" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">2x = 2π, x = π</text></g>
</svg>
