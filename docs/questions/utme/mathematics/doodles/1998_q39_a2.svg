<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="The product uv as a rectangle u wide and v tall, with u = x and v = sec x; as it grows, new area comes in two strips: u&#x27; v down the side and u v&#x27; along the top">
<g data-part="area"><rect x="22" y="36" width="56" height="56" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="70" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">uv</text></g>
<text x="50" y="105" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">u</text>
<text x="12" y="68" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">v</text>
<text x="60" y="117" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">u = x, v = sec x</text>
<g data-part="side"><rect x="78" y="36" width="12" height="56" fill="#ec4899" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="68" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">u′v</text></g>
<g data-part="top"><rect x="22" y="24" width="56" height="12" fill="#fde047" fill-opacity="0.55" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="17" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">uv′</text></g>
</svg>
