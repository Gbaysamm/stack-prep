<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="The graph of y = 1, a flat line at height 1 from 0 to pi over 2; the strip under it is to be painted">
<line x1="18" y1="96" x2="112" y2="96" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="18" y1="100" x2="18" y2="12" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<g data-part="strip"><g data-fill="paint"><rect x="18" y="50" width="74" height="46" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="55" y="80" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">area</text></g>
<g data-part="line"><line x1="18" y1="50" x2="104" y2="50" stroke="#1d1b3a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="42" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">y = 1</text></g>
<text x="10" y="55" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">1</text>
<text x="18" y="112" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">0</text>
<line x1="92" y1="92" x2="92" y2="100" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="92" y="112" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">π/2</text>
</svg>
