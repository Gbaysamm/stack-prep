<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="K, K + 1 and K + 2 on a plank balancing at K + 1; the gaps of 1 either side become two squares of area 1, total 2">
<g data-part="plank"><rect x="8" y="86" width="104" height="4" fill="#f97316" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="30" cy="82" r="4" fill="#1d1b3a"/><circle cx="60" cy="82" r="4" fill="#1d1b3a"/><circle cx="90" cy="82" r="4" fill="#1d1b3a"/><polygon points="60,91 52,103 68,103" fill="#fde047" fill-opacity="0.55" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="118" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">K</text><text x="60" y="118" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">K+1</text><text x="92" y="118" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">K+2</text></g>
<g data-part="tiles"><rect x="30" y="52" width="30" height="30" fill="#ec4899" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="72" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">1</text><rect x="60" y="52" width="30" height="30" fill="#ec4899" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="75" y="72" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">1</text><text x="60" y="40" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">1 + 0 + 1 = 2</text></g>
</svg>
