<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A 2 by 2 block of four unit tiles; the tilted square joining the midpoints of its sides has side root 2 and area 2, exactly half the block">
<g data-part="tiles"><rect x="14" y="14" width="40" height="40" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="14" y="54" width="40" height="40" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="54" y="14" width="40" height="40" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="54" y="54" width="40" height="40" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g data-part="inner"><polygon points="54,14 94,54 54,94 14,54" fill="#ec4899" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<g data-part="side"><text x="107" y="40" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a" font-weight="700">√2</text></g>
<text x="60" y="114" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">pink = 2 tiles</text>
</svg>
