<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A tower of three blocks, each marked 2, multiplied together to make 8; one block is one of the three steps">
<text x="50" y="18" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">2 × 2 × 2</text>
<g data-part="tower"><rect x="30" y="30" width="40" height="26" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="49" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">2</text><rect x="30" y="56" width="40" height="26" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="75" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">2</text></g>
<g data-part="one"><rect x="30" y="82" width="40" height="26" fill="#f97316" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="101" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">2</text></g>
<g data-part="eight"><path d="M80 30Q88 30 88 40L88 62Q88 69 94 69Q88 69 88 76L88 98Q88 108 80 108" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="75" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a" font-weight="700">8</text></g>
</svg>
