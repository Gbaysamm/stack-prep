<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A machine for a * b with two input funnels, 2 and ?, and an output tray that must give 0, the identity">
<g data-part="in-a"><polygon points="22,26 52,26 44,46 30,46" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="37" y="20" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a" font-weight="700">2</text></g>
<g data-part="in-b"><polygon points="68,26 98,26 90,46 76,46" fill="#f97316" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="83" y="20" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a" font-weight="700">?</text></g>
<g data-part="box"><path d="M16 46Q60 45.4 104 46Q104.6 66 104 86Q60 86.6 16 86Q15.4 66 16 46Z" fill="#7c3aed" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="72" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">a * b</text></g>
