<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="Two cards: m over n is minus 3 over 4, and flipped upside down, n over m is 4 over minus 3">
<g data-part="mn"><rect x="10" y="24" width="40" height="56" rx="5" fill="#fde047" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="46" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">−3</text><line x1="17" y1="51" x2="43" y2="51" stroke="#1d1b3a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="68" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">4</text><text x="30" y="96" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">m/n</text></g>
<g data-part="flip"><path d="M36 20Q60 11 84 20M79.1 20.8L84 20L80.8 16.1" fill="none" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g data-part="nm"><rect x="70" y="24" width="40" height="56" rx="5" fill="#22c55e" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="46" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">4</text><line x1="77" y1="51" x2="103" y2="51" stroke="#1d1b3a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="68" font-family="Caveat, cursive" font-size="17" text-anchor="middle" fill="#1d1b3a">−3</text><text x="90" y="96" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">n/m</text></g>
</svg>
