<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="The dividend as columns for x cubed, x squared, x and 1 holding 4, 0, minus 3 and 1; the empty x squared column holds a 0">
<text x="160" y="24" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">4x³ + 0x² − 3x + 1</text>
<g data-part="cols"><rect x="30" y="58" width="60" height="50" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="50" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">x³</text><text x="60" y="92" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a" font-weight="700">4</text><rect x="170" y="58" width="60" height="50" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="50" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">x</text><text x="200" y="92" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a" font-weight="700">−3</text><rect x="240" y="58" width="60" height="50" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="270" y="50" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">1</text><text x="270" y="92" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a" font-weight="700">1</text></g>
<g data-part="zero"><rect x="100" y="58" width="60" height="50" fill="#ec4899" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="50" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">x²</text><text x="130" y="92" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a" font-weight="700">0</text></g>
</svg>
