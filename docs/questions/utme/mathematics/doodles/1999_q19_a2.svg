<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="The same parcel, x + y, appears twice: parcel squared, plus 3 parcels, minus 18; each parcel gets a tag u, giving u squared plus 3u minus 18">
<g data-part="p1"><path d="M16 50Q61 49.4 106 50Q106.6 72 106 94Q61 94.6 16 94Q15.4 72 16 50Z" fill="#f97316" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M61 50Q49 36 59 38M61 50Q73 36 63 38" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="61" y="79" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">x + y</text></g>
<text x="116" y="56" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a" font-weight="700">2</text>
<text x="142" y="80" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a">+ 3</text>
<g data-part="p2"><path d="M164 50Q209 49.4 254 50Q254.6 72 254 94Q209 94.6 164 94Q163.4 72 164 50Z" fill="#f97316" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M209 50Q197 36 207 38M209 50Q221 36 211 38" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="209" y="79" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">x + y</text></g>
<text x="288" y="80" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a">− 18</text>
<g data-part="tags"><line x1="61" y1="94" x2="61" y2="108" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M44 120L54 108L84 108L84 132L54 132Z" fill="#ec4899" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="52" cy="120" r="2" fill="none" stroke="#1d1b3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="69" y="125.9" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">u</text><line x1="209" y1="94" x2="209" y2="108" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M192 120L202 108L232 108L232 132L202 132Z" fill="#ec4899" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="120" r="2" fill="none" stroke="#1d1b3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="217" y="125.9" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">u</text></g>
<g data-part="quad"><text x="160" y="176" font-family="Caveat, cursive" font-size="22" text-anchor="middle" fill="#1d1b3a" font-weight="700">u² + 3u − 18</text></g>
</svg>
