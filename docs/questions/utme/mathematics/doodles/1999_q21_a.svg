<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="The fraction 1 over x cubed minus 1 as a pizza, split back into two slices: A over x minus 1, and Bx plus C over x squared plus x plus 1">
<g data-part="whole"><text x="60" y="16" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">1 / (x³ − 1)</text></g>
<g data-part="slice1"><path d="M66 70L92.9 43.1A38 38 0 0 1 92.9 96.9Z" fill="#f97316" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="96" cy="62" r="2.2" fill="#1d1b3a"/><circle cx="94" cy="84" r="2.2" fill="#1d1b3a"/><text x="88" y="77" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a" font-weight="700">A</text></g>
<g data-part="slice2"><path d="M56 70L82.9 96.9A38 38 0 1 1 82.9 43.1Z" fill="#fde047" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="46" cy="48" r="2.2" fill="#1d1b3a"/><circle cx="52" cy="94" r="2.2" fill="#1d1b3a"/><text x="36" y="76" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a" font-weight="700">Bx+C</text></g>
<text x="60" y="120" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">two slices</text>
</svg>
