<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A rectangle with sides u and v, so its area is uv; as x grows it gains a strip u′v down the side and a strip uv′ along the top">
<g data-part="rect"><rect x="22" y="30" width="62" height="66" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="53" y="69" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">uv</text></g>
<g data-part="u-side"><text x="53" y="113" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">u = 3x²</text></g>
<g data-part="v-side"><text x="11" y="69" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a" font-weight="700">v</text></g>
<g data-part="strip-r"><rect x="84" y="30" width="12" height="66" fill="#f97316" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="108" y="69" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">u′v</text></g>
<g data-part="strip-t"><rect x="22" y="18" width="62" height="12" fill="#22c55e" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="22" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">uv′</text></g>
</svg>
