<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="A bar of 12 equal pieces: the four numbers&#x27; distances from the mean add to 12; the first three take 6, leaving 6 for the fourth">
<text x="160" y="26" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">all four: 4 × 3 = 12</text>
<g data-part="total"><rect x="40" y="38" width="20" height="28" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="38" width="20" height="28" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="38" width="20" height="28" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="100" y="38" width="20" height="28" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="120" y="38" width="20" height="28" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="140" y="38" width="20" height="28" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="160" y="38" width="20" height="28" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="180" y="38" width="20" height="28" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="200" y="38" width="20" height="28" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="220" y="38" width="20" height="28" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="240" y="38" width="20" height="28" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="260" y="38" width="20" height="28" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g data-part="three"><rect x="40" y="38" width="120" height="28" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="90" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">first three: 6</text></g>
<g data-part="fourth"><rect x="160" y="38" width="120" height="28" fill="#f97316" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="90" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">fourth: 6</text></g>
</svg>
