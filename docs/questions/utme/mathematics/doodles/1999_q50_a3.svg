<g data-part="line"><line x1="20" y1="150" x2="300" y2="150" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="160" y1="142" x2="160" y2="158" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="176" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a" font-weight="700">5</text><text x="160" y="196" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">mean</text><path d="M152 136Q98 136 44 136M48.3 133.5L44 136L48.3 138.5" fill="none" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M168 136Q222 136 276 136M271.7 138.5L276 136L271.7 133.5" fill="none" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="128" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">6</text><text x="220" y="128" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">6</text></g>
