<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A square of side root 3 with area 3, and a square of side 2 root 2 made of four small squares of side root 2, each of area 2, with 3 minus 8 equals minus 5 below">
<g data-part="small"><rect x="6" y="40" width="34" height="34" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="23" y="63" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">3</text><text x="23" y="92" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">√3</text></g>
<g data-part="big"><rect x="50" y="14" width="32" height="32" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="82" y="14" width="32" height="32" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="50" y="46" width="32" height="32" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="82" y="46" width="32" height="32" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="36" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">2</text><text x="98" y="36" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">2</text><text x="66" y="68" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">2</text><text x="98" y="68" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">2</text><text x="66" y="96" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">√2</text><text x="98" y="96" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">√2</text></g>
