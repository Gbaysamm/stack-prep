<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="Powers of 2 as blocks: one block y is 2 to the n, two blocks are 2 to the n plus 1, half a block is 2 to the n minus 1">
<g data-part="u"><rect x="20" y="26" width="26" height="26" rx="2" fill="#7c3aed" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="33" y="44" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">y</text><text x="33" y="74" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">y = 2ⁿ</text></g>
<g data-part="double"><rect x="118" y="26" width="26" height="26" rx="2" fill="#7c3aed" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="131" y="44" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">y</text><rect x="146" y="26" width="26" height="26" rx="2" fill="#7c3aed" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="159" y="44" font-family="Caveat, cursive" font-size="15" text-anchor="middle" fill="#1d1b3a">y</text><text x="145" y="74" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">2ⁿ⁺¹ = 2y</text></g>
<g data-part="half"><rect x="240" y="26" width="14" height="26" rx="2" fill="#7c3aed" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="247" y="74" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">2ⁿ⁻¹ = y/2</text></g>
</svg>
