<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="Two machines in a row, log base 5 then 5 to the power: a card saying 1/8 goes in and comes out as 1/8">
<text x="160" y="30" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a">a power undoes its own log</text>
<g data-part="m1"><path d="M96 72Q128 71.4 160 72Q160.6 105 160 138Q128 138.6 96 138Q95.4 105 96 72Z" fill="#7c3aed" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="128" y="112" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a" font-weight="700">log₅</text></g>
<g data-part="m2"><path d="M186 72Q218 71.4 250 72Q250.6 105 250 138Q218 138.6 186 138Q185.4 105 186 72Z" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="218" y="112" font-family="Caveat, cursive" font-size="20" text-anchor="middle" fill="#1d1b3a" font-weight="700">5^</text></g>
<g data-part="out"><rect x="262" y="90" width="40" height="30" rx="3" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="282" y="150" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">out</text></g>
<text x="40" y="150" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">in</text>
<g data-part="card"><rect x="20" y="90" width="40" height="30" rx="3" fill="#fde047" fill-opacity="0.55" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="111" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">1/8</text></g>
<path data-path="through" d="M40 105L282 105" stroke="none" fill="none"/>
</svg>
