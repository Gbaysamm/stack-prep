<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" aria-label="A walker on a number line from 0 to 1 jumping forward a half, back a quarter, forward an eighth and so on">
<line x1="20" y1="150" x2="300" y2="150" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="30" y1="144" x2="30" y2="156" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="95" y1="144" x2="95" y2="156" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="160" y1="144" x2="160" y2="156" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="290" y1="144" x2="290" y2="156" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="30" y="176" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">0</text>
<text x="95" y="176" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">¼</text>
<text x="160" y="176" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">½</text>
<text x="290" y="176" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">1</text>
<g data-part="jumps"><path d="M30 150Q95 33 160 150Q127.5 91.5 95 150Q111.2 120.8 127.5 150Q119.4 135.4 111.2 150Q115.3 142.7 119.4 150Q117.3 146.3 115.3 150Q116.3 148.2 117.3 150" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="95" y="82" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">+½</text><text x="128" y="114" font-family="Caveat, cursive" font-size="16" text-anchor="middle" fill="#1d1b3a">−¼</text></g>
<text x="160" y="26" font-family="Caveat, cursive" font-size="18" text-anchor="middle" fill="#1d1b3a">forward, back, forward, back...</text>
<g data-part="walker"><circle cx="30" cy="119.1" r="5.1" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="28.1" cy="118.4" r="1.1" fill="#1d1b3a"/><circle cx="31.9" cy="118.4" r="1.1" fill="#1d1b3a"/><path d="M22.4 144.2Q22.4 125.5 30 125.5Q37.6 125.5 37.6 144.2Z" fill="#22c55e" fill-opacity="0.45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<path data-path="hops" d="M30 150Q95 33 160 150Q127.5 91.5 95 150Q111.2 120.8 127.5 150Q119.4 135.4 111.2 150Q115.3 142.7 119.4 150Q117.3 146.3 115.3 150Q116.3 148.2 117.3 150" stroke="none" fill="none"/>
</svg>
