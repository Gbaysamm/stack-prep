<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="The 3 by 3 seat plan with row 1 and column 1 covered, leaving the 2 by 2 block t plus 1, 1, 4, t minus 2">
<rect x="15" y="15" width="90" height="90" rx="4" fill="none" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="45" y1="15" x2="45" y2="105" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="75" y1="15" x2="75" y2="105" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="15" y1="45" x2="105" y2="45" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="15" y1="75" x2="105" y2="75" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<g data-part="pivot"><text x="30" y="35" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">t−4</text></g>
<g data-part="zeros"><text x="60" y="35" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">0</text><text x="90" y="35" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">0</text></g>
<g data-part="col1"><text x="30" y="65" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">−1</text><text x="30" y="95" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">3</text></g>
<g data-part="minor"><text x="60" y="65" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">t+1</text><text x="90" y="65" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">1</text><text x="60" y="95" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">4</text><text x="90" y="95" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">t−2</text></g>
<g data-part="cover"><rect x="15" y="15" width="90" height="30" rx="4" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="15" y="45" width="30" height="60" rx="4" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
