<text x="90" y="78" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">radius</text>
<text x="30" y="98" font-family="Caveat, cursive" font-size="14" text-anchor="middle" fill="#1d1b3a">8π m³/s</text>
