<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="Two dials: the volume dial reads 8 pi cubic metres per second, and the radius dial reads 1/9 metre per second">
<g data-part="vol"><path d="M5 58A25 25 0 0 1 55 58Z" fill="#3b82f6" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="11" y1="58" x2="6" y2="58" stroke="#1d1b3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="16.6" y1="44.6" x2="13" y2="41" stroke="#1d1b3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="30" y1="39" x2="30" y2="34" stroke="#1d1b3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="43.4" y1="44.6" x2="47" y2="41" stroke="#1d1b3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="49" y1="58" x2="54" y2="58" stroke="#1d1b3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="30" y1="58" x2="44.6" y2="47.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="30" cy="58" r="3" fill="#1d1b3a"/></g>
