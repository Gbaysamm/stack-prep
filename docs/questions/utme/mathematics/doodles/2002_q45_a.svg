<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="The power rule: in x squared the 2 climbs down in front to give 2x; in minus x to the minus 1 the minus 1 climbs down"><g data-part="row1"><text x="24" y="44" font-family="Caveat, cursive" font-size="18" fill="#1d1b3a" text-anchor="middle">x</text><text x="34" y="30" font-family="Caveat, cursive" font-size="15" fill="#1d1b3a" text-anchor="middle">2</text><path d="M36 18Q20 8 12 34" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 28L12 35L17 30" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 38Q57 38 66 38M61.6 35.7L66 38L61.6 40.3" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="44" font-family="Caveat, cursive" font-size="18" fill="#1d1b3a" text-anchor="middle">2x</text></g><g data-part="row2"><text x="22" y="90" font-family="Caveat, cursive" font-size="18" fill="#1d1b3a" text-anchor="middle">−x</text><text x="38" y="76" font-family="Caveat, cursive" font-size="15" fill="#1d1b3a" text-anchor="middle">−1</text><path d="M40 64Q20 54 8 80" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 74L8 81L13 76" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M52 84Q60 84 68 84M63.6 81.7L68 84L63.6 86.3" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
