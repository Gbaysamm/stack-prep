<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="A machine: U and V go in, it multiplies k by U times V and divides by U plus V, and x comes out; k is unknown"><g data-part="inputs"><text x="30" y="15" font-family="Caveat, cursive" font-size="16" fill="#1d1b3a" text-anchor="middle">U = 3</text><text x="90" y="15" font-family="Caveat, cursive" font-size="16" fill="#1d1b3a" text-anchor="middle">V = 1</text><path d="M34 20Q39 27 44 34M43.3 29L44 34L39.5 31.8" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M86 20Q81 27 76 34M80.5 31.8L76 34L76.7 29" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g data-part="machine"><path d="M25 36Q60.6 35.4 95 36Q100 36 100 41Q99.9 57.6 100 73Q100 78 95 78Q60.5 77.9 25 78Q20 78 20 73Q20.1 56.5 20 41Q20 36 25 36Z" fill="#7c3aed" fill-opacity="0.35" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="53" font-family="Caveat, cursive" font-size="16" fill="#1d1b3a" text-anchor="middle">k × U × V</text><path d="M34 58Q60.1 58.2 86 58" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="73" font-family="Caveat, cursive" font-size="16" fill="#1d1b3a" text-anchor="middle">U + V</text></g><g data-part="output"><path d="M42 80Q39 87 36 94M39.9 90.9L36 94L35.6 89" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="112" font-family="Caveat, cursive" font-size="17" fill="#1d1b3a" text-anchor="middle">x = 3</text></g><g data-part="dial"><circle cx="90" cy="100" r="13" fill="#fde047" fill-opacity="0.5" stroke="#1d1b3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="106" font-family="Caveat, cursive" font-size="16" fill="#1d1b3a" text-anchor="middle">k ?</text></g></svg>
