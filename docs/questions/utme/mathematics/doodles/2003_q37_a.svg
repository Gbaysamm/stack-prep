<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="Two machines in a chain: x goes into the inside machine and comes out as u equals minus 4x; u goes into the outside machine and comes out as y equals 3 sin u"><g data-part="x-in"><text x="60" y="13" font-family="Caveat, cursive" font-size="17" fill="#1d1b3a" text-anchor="middle">x</text><path d="M60 17Q60 22.5 60 28M62.3 23.6L60 28L57.7 23.6" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g data-part="inner"><path d="M25 30Q59.6 29.4 95 30Q100 30 100 35Q99.5 41.9 100 49Q100 54 95 54Q59.8 54.6 25 54Q20 54 20 49Q19.4 42.1 20 35Q20 30 25 30Z" fill="#3b82f6" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="47" font-family="Caveat, cursive" font-size="16" fill="#1d1b3a" text-anchor="middle">u = −4x</text></g><g data-part="link"><path d="M60 56Q60 61 60 66M62.3 61.6L60 66L57.7 61.6" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g data-part="outer"><path d="M21 68Q59.7 67.5 99 68Q104 68 104 73Q103.9 79.4 104 87Q104 92 99 92Q60.4 92.1 21 92Q16 92 16 87Q16.4 79.7 16 73Q16 68 21 68Z" fill="#7c3aed" fill-opacity="0.4" stroke="#1d1b3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="85" font-family="Caveat, cursive" font-size="16" fill="#1d1b3a" text-anchor="middle">y = 3 sin u</text></g><g data-part="y-out"><path d="M60 94Q60 99 60 104M62.3 99.6L60 104L57.7 99.6" fill="none" stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="117" font-family="Caveat, cursive" font-size="17" fill="#1d1b3a" text-anchor="middle">y</text></g></svg>
