      - 'Now watch this one. $\log_{7}\tfrac{1}{7}$: a reciprocal is a power of $-1$, $7^{-1} = \tfrac{1}{7}$, so it is $-1$.'
      - 'The sum is $2 + (-1) = 1$.'
      - 'Or combine them first with $\log a + \log b = \log ab$ — $\log_{7}\left(49 \times \tfrac{1}{7}\right) = \log_{7}7 = 1$ ✓.'
