# UTME 1983 Mathematics — worked explanations, written against the paper.
#
# Keyed on question number; see explanations_2003.yaml for why, and for how these are written.
# This is a five-option paper (A-E).
#
# All 50 are answered, and all 21 the key covers agree with it. Q8, Q11, Q44 and Q48 rest on
# rebuilt options or stems, which their notes in retranscribed_1983.yaml say plainly.
format_version: 1
exam_year: 1983
subject: MATH

explanations:
  1:
    answer: D
    steps:
      - 'The median is the middle value once the data are in order; the mode is the value that occurs most often.'
      - 'In order: 3, 5, 5, 8, 9.'
      - 'There are five values, so the median is the third: $M = 5$.'
      - 'The value 5 appears twice and every other value once, so the mode is $D = 5$.'
      - 'So $(M, D) = (5, 5)$.'
      - 'The trap is option A, $(6, 5)$, which takes the *mean* ($30 \div 5 = 6$) in place of the median.'
    hint: 'Sort the five numbers; the middle one is the median.'

  2:
    answer: E
    steps:
      - 'In a ratio share, the difference between two shares corresponds to the difference in their parts.'
      - 'The ratio $4 : 5$ means Y gets 1 part more than X.'
      - 'That 1 part is ₦5,000.'
      - 'The whole profit is $4 + 5 = 9$ parts: $9 \times 5000 = ₦45{,}000$.'
      - 'Check: X gets ₦20,000 and Y gets ₦25,000, a difference of ₦5,000 ✓.'
      - 'The trap is options A and B, which are the two individual shares, not the total.'
    hint: 'One part of the ratio is ₦5,000; there are nine parts.'

  3:
    answer: C
    steps:
      - 'The exterior angles of any polygon add to $360^{\circ}$; in a regular hexagon all six are equal, so each is $360 \div 6 = 60^{\circ}$.'
      - 'An interior and an exterior angle make a straight line, so each interior angle is $180^{\circ} - 60^{\circ} = 120^{\circ}$.'
      - 'Check with the angle sum: $(6 - 2) \times 180^{\circ} = 720^{\circ}$, and $720 \div 6 = 120^{\circ}$ ✓.'
      - 'The trap is option A, $60^{\circ}$ — the exterior angle, or the angle of each of the six equilateral triangles at the centre.'
    hint: 'Each exterior angle is $60^{\circ}$.'

  4:
    answer: A
    steps:
      - 'A chain $A = B = C$ contains two equations. Choose the pairs that simplify best.'
      - 'From $4x - 3 = 3x + y$: $x - y = 3$.'
      - 'From $3x + y = 2y + 5x - 12$: $-2x - y = -12$, that is $2x + y = 12$.'
      - 'Add the two equations: $3x = 15$, so $x = 5$; then $y = x - 3 = 2$.'
      - 'Check all three expressions: $4(5) - 3 = 17$, $3(5) + 2 = 17$, $2(2) + 5(5) - 12 = 17$ ✓.'
      - 'The trap is option D, $y = -2$ — the sign lost when rearranging $x - y = 3$.'
    hint: 'Get $x - y = 3$ and $2x + y = 12$.'

  5:
    answer: C
    steps:
      - 'Since $x = 1$ is a root, $(x - 1)$ is a factor. Divide it out to leave a quadratic.'
      - 'Synthetic division of $1, -2, -5, 6$ by 1: bring down 1; $1 \times 1 - 2 = -1$; $-1 \times 1 - 5 = -6$; $-6 \times 1 + 6 = 0$ ✓.'
      - 'The quotient is $x^{2} - x - 6 = (x - 3)(x + 2)$.'
      - 'So the other roots are $3$ and $-2$.'
      - 'Check $x = 3$: $27 - 18 - 15 + 6 = 0$ ✓; $x = -2$: $-8 - 8 + 10 + 6 = 0$ ✓.'
      - 'The trap is option A, $-3$ and 2 — both signs reversed, from reading the factors $(x - 3)(x + 2)$ as the roots themselves.'
    hint: 'Divide by $x - 1$ to get $x^{2} - x - 6$.'

  6:
    answer: B
    steps:
      - '"Jointly proportional to the cube of $y$ and the fourth power of $z$" means $x = ky^{3}z^{4}$ for some constant $k$.'
      - 'Each change multiplies $x$ by a scale factor, and the factors combine by multiplying.'
      - 'Halving $y$ multiplies $y^{3}$ by $\left(\tfrac{1}{2}\right)^{3} = \tfrac{1}{8}$.'
      - 'Doubling $z$ multiplies $z^{4}$ by $2^{4} = 16$.'
      - 'The overall factor is $\tfrac{1}{8} \times 16 = 2$, so $x$ doubles: new $x$ to old $x$ is $2 : 1$, an increase.'
      - 'The trap is option A, $4 : 1$ — from using $2^{3}$ for $z$ or $\tfrac{1}{2}$ unpowered for $y$. Each factor must be raised to its own power.'
    hint: 'Multiply the scale factors $\tfrac{1}{8}$ and $16$.'

  7:
    answer: B
    steps:
      - 'Work through the two right-angled triangles, starting with the one where a side and an angle are known.'
      - 'In triangle $PQR$, the right angle is at $P$ and $QR = 8$ is the hypotenuse. $PR$ is opposite the $60^{\circ}$ at $Q$: $PR = 8\sin 60^{\circ} = 4\sqrt{3}$.'
      - 'In triangle $PRS$, the right angle is at $R$ and the angle at $P$ is $45^{\circ}$, so the triangle is isosceles: $RS = PR = 4\sqrt{3}$.'
      - 'Its hypotenuse is $PS = PR\sqrt{2} = 4\sqrt{3} \times \sqrt{2} = 4\sqrt{6}$ cm.'
      - 'Numerically about 9.8 cm — longer than $PR$ (6.9 cm), as a hypotenuse must be ✓.'
      - 'The trap is option C, $2\sqrt{6}$, from taking $PR = 8\cos 60^{\circ} = 4$ and missing half: $PR$ faces the $60^{\circ}$ angle, so it uses sine.'
    hint: '$PR = 8\sin 60^{\circ}$; triangle $PRS$ is right-angled and isosceles.'

  8:
    answer: B
    steps:
      - 'Write everything in terms of $\sin z$ and $\cos z$, then substitute. With $\cos z = L$ and $z$ acute, $\sin z = \sqrt{1 - L^{2}}$.'
      - 'The numerator: $\cot z - \operatorname{cosec} z = \dfrac{\cos z}{\sin z} - \dfrac{1}{\sin z} = \dfrac{L - 1}{\sin z}$.'
      - 'The denominator: $\sec z + \tan z = \dfrac{1}{\cos z} + \dfrac{\sin z}{\cos z} = \dfrac{1 + \sin z}{L}$.'
      - 'Dividing: $\dfrac{L - 1}{\sin z} \times \dfrac{L}{1 + \sin z} = \dfrac{L(L - 1)}{\sin z(1 + \sin z)}$.'
      - 'Expand the bottom: $\sin z + \sin^{2}z = \sqrt{1 - L^{2}} + (1 - L^{2})$. So the expression is $\dfrac{L^{2} - L}{1 - L^{2} + \sqrt{1 - L^{2}}}$.'
      - 'Check with $z = 60^{\circ}$, $L = \tfrac{1}{2}$: directly $\tfrac{0.577 - 1.155}{2 + 1.732} = -0.155$; the formula gives $\tfrac{-0.25}{0.75 + 0.866} = -0.155$ ✓.'
      - 'The trap is option C, the same fraction with its numerator reversed. For an acute angle $L < 1$, so $L^{2} - L$ is negative — and so is the expression, since $\cot z < \operatorname{cosec} z$.'
    hint: 'Numerator $\tfrac{L - 1}{\sin z}$, denominator $\tfrac{1 + \sin z}{L}$.'

  9:
    answer: B
    steps:
      - 'Write each number in standard form, then multiply the number parts and add the indices.'
      - '$0.0000152 = 1.52 \times 10^{-5}$ and $0.00042 = 4.2 \times 10^{-4}$.'
      - 'Numbers: $1.52 \times 4.2 = 6.384$. Powers: $10^{-5} \times 10^{-4} = 10^{-9}$.'
      - 'So the product is $6.384 \times 10^{-9}$, giving $A = 6.38$ and $B = -9$.'
      - 'The trap is option C, $B = 9$ — the sign of the index lost. Multiplying two small numbers gives an even smaller one, so the index must be negative.'
    hint: '$1.52 \times 10^{-5} \times 4.2 \times 10^{-4}$.'

  10:
    answer: A
    steps:
      - 'By the factor theorem, if $(x - a)$ is a factor then the expression is zero at $x = a$.'
      - '$(x - 1)$ is a factor: $l + 2k + 24 = 0$.'
      - '$(x + 2)$ is a factor: $l(-8) + 2k(4) + 24 = 0$, that is $-8l + 8k + 24 = 0$, or $l = k + 3$.'
      - 'Substitute: $(k + 3) + 2k + 24 = 0$, so $3k = -27$ and $k = -9$; then $l = -6$.'
      - 'Check at $x = 1$: $-6 - 18 + 24 = 0$ ✓; at $x = -2$: $48 - 72 + 24 = 0$ ✓.'
      - 'The trap is substituting $x = 2$ for the factor $(x + 2)$; the root is $x = -2$.'
    hint: 'Substitute $x = 1$ and $x = -2$.'

  11:
    answer: D
    steps:
      - 'To make $T$ the subject, remove the cube root first by cubing both sides.'
      - '$\dfrac{a^{3}v^{3}}{(1 - v)^{3}} = \dfrac{2v + T}{2aT}$.'
      - 'Cross-multiply: $2aT \cdot a^{3}v^{3} = (1 - v)^{3}(2v + T)$, that is $2a^{4}v^{3}T = 2v(1 - v)^{3} + T(1 - v)^{3}$.'
      - 'Collect the $T$ terms: $T\left[2a^{4}v^{3} - (1 - v)^{3}\right] = 2v(1 - v)^{3}$.'
      - 'Divide: $T = \dfrac{2v(1 - v)^{3}}{2a^{4}v^{3} - (1 - v)^{3}}$.'
      - 'The trap is option E, with $+(1 - v)^{3}$ in the denominator — the term moved across without changing its sign.'
    hint: 'Cube both sides, cross-multiply and collect $T$.'

  12:
    answer: B
    steps:
      - 'The sector angles of a pie chart add to $360^{\circ}$, which gives an equation for $x$.'
      - 'Add them: $(3x - 18) + (2x + 12) + (x + 12) + x + (2x - 24) = 9x - 18$.'
      - 'So $9x - 18 = 360$, giving $9x = 378$ and $x = 42$.'
      - 'The Additional Mathematics angle is $2x - 24 = 60^{\circ}$.'
      - 'That is $\tfrac{60}{360} = \tfrac{1}{6}$ of the class: $\tfrac{1}{6} \times 60 = 10$ pupils.'
      - 'The trap is option C, 18, from using the Biology angle; or stopping at $x = 42$.'
    hint: 'The angles total $9x - 18 = 360$.'

  13:
    answer: A
    steps:
      - 'Cube each decimal separately, then subtract. When a decimal is cubed, the number of decimal places triples.'
      - '$0.3$ has one decimal place, so $(0.3)^{3}$ has three: $3^{3} = 27$, giving $0.027$.'
      - '$(0.2)^{3}$: $2^{3} = 8$, again with three decimal places, giving $0.008$.'
      - 'Subtract: $0.027 - 0.008 = 0.019$.'
      - 'A shortcut: $a^{3} - b^{3} = (a - b)(a^{2} + ab + b^{2}) = 0.1 \times (0.09 + 0.06 + 0.04) = 0.1 \times 0.19 = 0.019$ ✓.'
      - 'The trap is misplacing the decimal point: options B, C and D are the same digits 19 moved by powers of ten. Counting three decimal places settles it.'
    hint: '$0.027 - 0.008$.'

  14:
    answer: A
    steps:
      - '"Partly as the square of $x$ and partly as the inverse of the square root of $x$" means $y = ax^{2} + \dfrac{b}{\sqrt{x}}$.'
      - 'At $x = 1$, $y = 2$: $a + b = 2$.'
      - 'At $x = 4$, $y = 6$: $16a + \tfrac{b}{2} = 6$, or $32a + b = 12$.'
      - 'Subtract the first equation: $31a = 10$, so $a = \tfrac{10}{31}$ and $b = 2 - \tfrac{10}{31} = \tfrac{52}{31}$.'
      - 'So $y = \dfrac{10x^{2}}{31} + \dfrac{52}{31\sqrt{x}}$.'
      - 'The trap is option E, which uses the same constant $\tfrac{10}{31}$ for both parts. The two parts vary separately, each with its own constant.'
    hint: 'Solve $a + b = 2$ and $32a + b = 12$.'

  15:
    answer: D
    steps:
      - 'Factorise everything, then cancel.'
      - '$x^{2} - 9 = (x - 3)(x + 3)$; $x^{2} - 3x = x(x - 3)$; $x^{2} - 49 = (x - 7)(x + 7)$.'
      - 'The product is $\dfrac{(x - 7) \cdot x(x - 3)}{(x - 3)(x + 3)(x - 7)(x + 7)}$.'
      - 'Cancel $(x - 7)$ and $(x - 3)$: $\dfrac{x}{(x + 3)(x + 7)}$.'
      - 'The trap is option A, which keeps $(x - 3)$ — the factor that cancels — instead of $(x + 3)$.'
    hint: 'Factorise the two differences of squares.'

  16:
    answer: D
    steps:
      - 'The hypotenuse is the longest side, $3x + 1$. Pythagoras: $(3x + 1)^{2} = (3x - 1)^{2} + x^{2}$.'
      - 'Expand: $9x^{2} + 6x + 1 = 9x^{2} - 6x + 1 + x^{2}$.'
      - 'Simplify: $12x = x^{2}$, so $x(x - 12) = 0$.'
      - '$x = 0$ is not a length, so $x = 12$.'
      - 'Check: sides 37, 35 and 12, and $35^{2} + 12^{2} = 1225 + 144 = 1369 = 37^{2}$ ✓.'
      - 'The trap is option E, 0 — the other root of the equation, which gives a triangle with no size.'
    hint: 'Pythagoras simplifies to $x^{2} = 12x$.'

  17:
    answer: B
    steps:
      - 'The median is the middle score once the list is in order.'
      - 'In order: 21, 23, 29, 40, 41, 43, 47, 50, 50, 55, 56, 70, 70, 73.'
      - 'There are 14 scores — an even number — so the median is the average of the 7th and 8th.'
      - 'The 7th is 47 and the 8th is 50: median $= \tfrac{47 + 50}{2} = 48\tfrac{1}{2}$.'
      - 'The trap is option A, 47, which takes only the 7th score; or option C, 50, the mode (with 70 also appearing twice).'
    hint: 'Sort the 14 scores and average the 7th and 8th.'

  18:
    answer: D
    steps:
      - 'Read three features off the graph: where it crosses the $y$-axis, where it crosses the $x$-axis, and which way it opens.'
      - 'It crosses the $y$-axis at 1, so the constant term is 1.'
      - 'It opens downwards (it has a highest point), so the $x^{2}$ coefficient is negative.'
      - 'It crosses the $x$-axis at $-1$ and $\tfrac{1}{3}$, so the equation is $y = -(x + 1)(3x - 1) = -(3x^{2} + 2x - 1) = 1 - 2x - 3x^{2}$.'
      - 'Check: at $x = -1$, $1 + 2 - 3 = 0$ ✓; at $x = \tfrac{1}{3}$, $1 - \tfrac{2}{3} - \tfrac{1}{3} = 0$ ✓.'
      - 'The trap is option C, $1 + 2x - 3x^{2}$, which opens downwards and passes through 1 but has roots $1$ and $-\tfrac{1}{3}$ — the mirror image.'
    hint: 'Intercept 1, opens downwards, roots $-1$ and $\tfrac{1}{3}$.'

  19:
    answer: D
    steps:
      - 'The diagonals of a rhombus bisect its angles.'
      - 'The diagonal $KG$ makes $30^{\circ}$ with $KF$, so the whole angle at $K$ is $\angle HKF = 60^{\circ}$.'
      - 'Adjacent angles of a rhombus (like any parallelogram) add to $180^{\circ}$, because the sides are parallel.'
      - 'So the angle at $H$ is $180^{\circ} - 60^{\circ} = 120^{\circ}$.'
      - 'The trap is option E, $60^{\circ}$ — the angle at $K$ itself. In a rhombus *opposite* angles are equal and *neighbouring* angles add to $180^{\circ}$; $H$ is a neighbour of $K$, not its opposite.'
    hint: 'The diagonal halves the $60^{\circ}$ at $K$.'

  20:
    answer: E
    steps:
      - 'The desk tilts about its 2 m edge $PQ$, which stays on the horizontal. The 0.8 m edge $QR$ rises at $30^{\circ}$.'
      - 'The height of $R$ above the floor is $0.8\sin 30^{\circ} = 0.4$ m.'
      - 'The diagonal $PR$ of the desk is $\sqrt{2^{2} + 0.8^{2}} = \sqrt{4.64} \approx 2.154$ m.'
      - 'The inclination $\theta$ of $PR$ satisfies $\sin\theta = \dfrac{\text{height}}{PR} = \dfrac{0.4}{2.154} = 0.1857$.'
      - 'So $\theta \approx 10.70^{\circ} = 10^{\circ}42''$ (since $0.70 \times 60 = 42$).'
      - 'The trap is option B, $30^{\circ}$: the diagonal is longer than the sloping edge but rises only to the same height, so it is less steep.'
    hint: 'Height 0.4 m over diagonal 2.154 m.'

  21:
    answer: B
    steps:
      - 'Numbers in different bases are compared in base ten, so convert the base-2 numeral first.'
      - '$100100_{2}$ has 1s in the $32$ and $4$ places: $32 + 4 = 36$.'
      - 'So $x^{2} = 36$ and, taking the positive root, $x = 6$ in base ten.'
      - 'Now write 6 in base 4: $6 = 1 \times 4 + 2$, so $x = 12_{4}$.'
      - 'Check: $12_{4} = 6$ and $6^{2} = 36 = 100100_{2}$ ✓.'
      - 'The trap is option A, 6 — correct as a number, but written in base ten. The question defines $x$ as a base-4 numeral.'
    hint: '$100100_{2} = 36$; then write $\sqrt{36}$ in base 4.'

  22:
    answer: C
    steps:
      - 'The power law $\log a^{n} = n\log a$ turns every term into a multiple of the same logarithm, $\log_{10}a$.'
      - 'First term: $\log_{10}a^{1/3} = \tfrac{1}{3}\log_{10}a$.'
      - 'Second term: $\tfrac{1}{4}\log_{10}a$, already in that form.'
      - 'Third term: $\tfrac{1}{12}\log_{10}a^{7} = \tfrac{7}{12}\log_{10}a$.'
      - 'Combine the coefficients over 12: $\tfrac{4}{12} + \tfrac{3}{12} - \tfrac{7}{12} = 0$.'
      - 'So the whole expression is $0 \times \log_{10}a = 0$, whatever the value of $a$.'
      - 'The trap is option B, $\tfrac{7}{6}\log_{10}a$, which adds the third coefficient instead of subtracting it: $\tfrac{4 + 3 + 7}{12} = \tfrac{14}{12}$.'
    hint: 'Bring every index down in front and use twelfths.'

  23:
    answer: E
    steps:
      - 'Write each variation as an equation with its own constant, then substitute to eliminate $w$.'
      - '"$w$ varies inversely as $V$": $w = \dfrac{k}{V}$.'
      - '"$u$ varies directly as $w^{3}$": $u = cw^{3}$.'
      - 'Substitute: $u = c\left(\dfrac{k}{V}\right)^{3} = \dfrac{ck^{3}}{V^{3}}$. The constants combine into one, $K = ck^{3}$, so $u = \dfrac{K}{V^{3}}$.'
      - 'Use $u = 1$ when $V = 2$: $1 = \dfrac{K}{8}$, so $K = 8$ and $u = \dfrac{8}{V^{3}}$.'
      - 'Check: at $V = 2$, $u = \tfrac{8}{8} = 1$ ✓.'
      - 'The trap is option A, $u = 8V^{3}$, which forgets that the first link is inverse: as $V$ grows, $w$ shrinks, and so does $u$.'
    hint: 'Substitute $w = \tfrac{k}{V}$ into $u = cw^{3}$.'

  24:
    answer: C
    steps:
      - 'Make $y$ the subject of the linear equation and substitute into the other.'
      - 'From $y + 5x - 2 = 0$: $y = 2 - 5x$.'
      - 'Substitute: $x^{2} + 2 - 5x - 8 = 0$, that is $x^{2} - 5x - 6 = 0$.'
      - 'Factorise: $(x - 6)(x + 1) = 0$, so $x = 6$ or $x = -1$.'
      - 'The trap is options A and B, which contain $-28$ — the value of $y$ when $x = 6$, not a value of $x$.'
    hint: 'Substitute $y = 2 - 5x$.'

  25:
    answer: A
    steps:
      - 'First check that the given values fit the rule: $y = x^{3} - x + 3$.'
      - 'At $x = 2$: $8 - 2 + 3 = 9$ ✓; at $x = 3$: $27 - 3 + 3 = 27$ ✓; at $x = -1, 0, 1$ the value is 3 ✓.'
      - 'At $x = -2$: $(-2)^{3} - (-2) + 3 = -8 + 2 + 3 = -3$.'
      - 'The trap is the double sign: subtracting $-2$ adds 2. Treating it as $-2$ gives $-7$, not offered; ignoring the cube''s sign gives 13 (option D).'
    hint: '$(-2)^{3} = -8$ and $-(-2) = +2$.'

  26:
    answer: C
    steps:
      - 'The angle at the centre is twice the angle at the circumference standing on the same arc.'
      - 'The $130^{\circ}$ angle is at a point on the lower arc; it stands on the upper arc between the two radii.'
      - 'So the angle at $O$ on that upper side is $2 \times 130^{\circ} = 260^{\circ}$ — a reflex angle.'
      - '$x$ is the angle at $O$ on the other side, so $x = 360^{\circ} - 260^{\circ} = 100^{\circ}$.'
      - 'A check with the other arc: the $130^{\circ}$ angle and any angle standing on the lower arc from the far side would add to $180^{\circ}$, so that angle is $50^{\circ}$, and the centre angle on the lower arc is $2 \times 50^{\circ} = 100^{\circ}$ ✓.'
      - 'The trap is option B, $260^{\circ}$ — the reflex angle, not the angle marked inside the quadrilateral.'
    hint: 'The reflex angle at $O$ is $2 \times 130^{\circ}$.'

  27:
    answer: D
    steps:
      - 'A pie chart gives each item the same fraction of $360^{\circ}$ as it has of the total.'
      - 'The total is $6 + 10 + 14 + 16 + 26 = 72$.'
      - 'So each unit is worth $\tfrac{360}{72} = 5^{\circ}$.'
      - 'The angles are $6 \times 5 = 30^{\circ}$, $10 \times 5 = 50^{\circ}$, $14 \times 5 = 70^{\circ}$, $16 \times 5 = 80^{\circ}$ and $26 \times 5 = 130^{\circ}$.'
      - 'Check: $30 + 50 + 70 + 80 + 130 = 360$ ✓.'
      - 'The trap is option B, which multiplies by 10 and totals $720^{\circ}$, and option C, which copies the data as degrees and totals only $72^{\circ}$. A correct set must add to exactly $360^{\circ}$.'
    hint: 'Each unit is $360 \div 72 = 5^{\circ}$.'

  28:
    answer: B
    steps:
      - 'Tally the scores: 55 once, 60 four times, 65 six times, 70 four times, 75 once — 16 in all.'
      - 'The mode is the most frequent score: 65.'
      - 'For the median of 16 scores, average the 8th and 9th. The first five sorted scores are 55, 60, 60, 60, 60; the 6th to 11th are 65.'
      - 'So the 8th and 9th are both 65, and the median is 65.'
      - 'The sum is $65 + 65 = 130$.'
      - 'The trap is taking the median from the unsorted list — its 8th and 9th entries are 70 and 75, which would give 72.5 and a sum of 137.5 (option E). The list must be put in order first.'
    hint: 'The mode and median are both 65.'

  29:
    answer: C
    steps:
      - 'Count the letters, then the vowels among them.'
      - 'MATRICULATION has 13 letters: M, A, T, R, I, C, U, L, A, T, I, O, N.'
      - 'The vowels are A, I, U, A, I, O — six of them (A and I each appear twice).'
      - 'The probability is $\tfrac{6}{13}$.'
      - 'The trap is option E, $\tfrac{4}{13}$, which counts each *kind* of vowel once (A, I, U, O). Every letter is cut separately, so repeated letters count each time.'
    hint: 'Six vowels among 13 letters.'

  30:
    answer: C
    steps:
      - 'The instruction sets the order: round each number first, then multiply, then round the product. Doing it in a different order can change the last digit.'
      - 'Significant figures are counted from the first non-zero digit. In 59.81789 the first three are 5, 9, 8, and the next digit is 1, so it rounds down to 59.8.'
      - 'In 0.0746829 the leading zeros do not count; the first three significant figures are 7, 4, 6, and the next digit is 8, so it rounds up to 0.0747.'
      - 'Multiply: $59.8 \times 0.0747 = 4.46706$.'
      - 'Round to three significant figures: the fourth digit is 7, so $4.46706 \to 4.47$.'
      - 'For comparison, multiplying the unrounded numbers gives $4.4674\ldots$, which also rounds to 4.47 here — but that is luck, not method.'
      - 'The trap is option B, 4.48, from rounding 0.0746829 to 0.0748 (the digit after 6 is 8, which raises the 6 to 7, not the 7 to 8).'
    hint: 'Round to 59.8 and 0.0747, multiply, then round.'

  31:
    answer: E
    steps:
      - 'Percentage error measures the size of a mistake relative to the true value: $\dfrac{\text{error}}{\text{true value}} \times 100$.'
      - 'The true length is 250 cm and the measured length 255 cm, so the error is $255 - 250 = 5$ cm.'
      - 'As a fraction of the true value: $\dfrac{5}{250} = \dfrac{1}{50} = 0.02$.'
      - 'As a percentage: $0.02 \times 100 = 2\%$.'
      - 'The comparison is always with the *true* value. Dividing by the measured 255 instead would give 1.96%, a small but real difference.'
      - 'The trap is option C, 5 — the error in centimetres, not the percentage.'
    hint: 'Error 5 cm divided by the true 250 cm, times 100.'

  32:
    answer: D
    steps:
      - 'Write both sides as powers of the primes 2 and 3, then match the indices.'
      - '$\left(\tfrac{2}{3}\right)^{m}\left(\tfrac{3}{4}\right)^{n} = \dfrac{2^{m}3^{n}}{3^{m}2^{2n}} = 2^{m - 2n}3^{n - m}$.'
      - '$\tfrac{256}{729} = \tfrac{2^{8}}{3^{6}} = 2^{8}3^{-6}$.'
      - 'Matching: $m - 2n = 8$ and $n - m = -6$.'
      - 'From the second, $m = n + 6$; substituting, $n + 6 - 2n = 8$, so $n = -2$ and $m = 4$.'
      - 'Check: $\left(\tfrac{2}{3}\right)^{4}\left(\tfrac{3}{4}\right)^{-2} = \tfrac{16}{81} \times \tfrac{16}{9} = \tfrac{256}{729}$ ✓.'
      - 'The trap is option A, $n = 2$ — the sign of $n$ lost.'
    hint: 'Match the powers of 2 and of 3.'

