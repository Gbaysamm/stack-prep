format_version: 1
exam_year: 1983
subject: MATH

explanations:
  1:
    answer: D
    steps:
      - 'Two averages are asked for here, and each has its own meaning. Let''s sort out which is which first.'
      - 'Here''s what the words mean. The median is the middle value once the data are in order; the mode is the value that occurs most often.'
      - 'So start by putting the numbers in order: 3, 5, 5, 8, 9.'
      - 'Now count along. There are five values, so the median is the third: $M = 5$.'
      - 'Next, the value 5 appears twice and every other value once, so the mode is $D = 5$.'
      - 'Putting them together, $(M, D) = (5, 5)$.'
      - 'The trap is option A, $(6, 5)$, which takes the *mean* ($30 \div 5 = 6$) in place of the median. So remember: the median is the middle, not the average.'
    hint: 'Try sorting the five numbers first; the middle one is the median.'

  2:
    answer: E
    steps:
      - 'Ratio questions like this can feel slippery, but one small idea unlocks it. Let''s find what a single part is worth.'
      - 'Here''s the key idea: in a ratio share, the difference between two shares corresponds to the difference in their parts.'
      - 'The ratio $4 : 5$ means Y gets 1 part more than X.'
      - 'And we''re told that difference is ₦5,000 — so that 1 part is ₦5,000.'
      - 'Now, the whole profit is $4 + 5 = 9$ parts: $9 \times 5000 = ₦45{,}000$.'
      - 'Let''s check it. X gets ₦20,000 and Y gets ₦25,000, a difference of ₦5,000 ✓.'
      - 'The trap is options A and B, which are the two individual shares, not the total. Always read again what the question wants — here it is the whole profit.'
    hint: 'One part of the ratio is ₦5,000. How many parts are there altogether?'

  3:
    answer: C
    steps:
      - 'Polygon angles are much friendlier from the outside. Let''s start with the exterior angles.'
      - 'The exterior angles of any polygon add to $360^{\circ}$; in a regular hexagon all six are equal, so each is $360 \div 6 = 60^{\circ}$.'
      - 'Now, an interior and an exterior angle make a straight line, so each interior angle is $180^{\circ} - 60^{\circ} = 120^{\circ}$.'
      - 'Let''s confirm it another way. Check with the angle sum: $(6 - 2) \times 180^{\circ} = 720^{\circ}$, and $720 \div 6 = 120^{\circ}$ ✓.'
      - 'The trap is option A, $60^{\circ}$ — the exterior angle, or the angle of each of the six equilateral triangles at the centre. Keep inside and outside apart, and you''ll get these every time.'
    hint: 'Each exterior angle is $60^{\circ}$. What sits beside it on a straight line?'

  4:
    answer: A
    steps:
      - 'This one looks busy, with three expressions chained together, but it comes down to two simple equations. Let''s set them up together.'
      - 'First, notice that a chain $A = B = C$ contains two equations. Choose the pairs that simplify best.'
      - 'Take the first pair. From $4x - 3 = 3x + y$, which gives $x - y = 3$.'
      - 'Now the second pair. From $3x + y = 2y + 5x - 12$, which gives $-2x - y = -12$, that is $2x + y = 12$.'
      - 'The $y$ terms are ready to cancel. Add the two equations: $3x = 15$, so $x = 5$; then $y = x - 3 = 2$.'
      - 'Let''s make sure. Check all three expressions: $4(5) - 3 = 17$, $3(5) + 2 = 17$, $2(2) + 5(5) - 12 = 17$ ✓.'
      - 'The trap is option D, $y = -2$ — the sign lost when rearranging $x - y = 3$. Take your time with signs when you move terms across, and this is yours.'
    hint: 'Try pairing them to get $x - y = 3$ and $2x + y = 12$.'

  5:
    answer: C
    steps:
      - 'A cubic can look scary, but we''re handed one root already, and that does most of the work. Let''s use it.'
      - 'Since $x = 1$ is a root, $(x - 1)$ is a factor. Divide it out to leave a quadratic.'
      - 'Synthetic division of $1, -2, -5, 6$ by 1: bring down 1; $1 \times 1 - 2 = -1$; $-1 \times 1 - 5 = -6$; $-6 \times 1 + 6 = 0$ ✓.'
      - 'That zero remainder is a good sign. The quotient is $x^{2} - x - 6 = (x - 3)(x + 2)$.'
      - 'So the other roots are $3$ and $-2$.'
      - 'Let''s test them in the original. Check $x = 3$, which gives $27 - 18 - 15 + 6 = 0$ ✓; $x = -2$, which gives $-8 - 8 + 10 + 6 = 0$ ✓.'
      - 'The trap is option A, $-3$ and 2 — both signs reversed, from reading the factors $(x - 3)(x + 2)$ as the roots themselves. Remember: the factor $x - 3$ gives the root $+3$.'
    hint: 'Divide by $x - 1$ and you''ll get $x^{2} - x - 6$.'

  6:
    answer: B
    steps:
      - 'Variation questions reward a calm, step-by-step approach. We''ll write the rule down and then watch what each change does.'
      - 'Start with the words. "Jointly proportional to the cube of $y$ and the fourth power of $z$" means $x = ky^{3}z^{4}$ for some constant $k$.'
      - 'Here''s the key idea: each change multiplies $x$ by a scale factor, and the factors combine by multiplying.'
      - 'Take $y$ first. Halving $y$ multiplies $y^{3}$ by $\left(\tfrac{1}{2}\right)^{3} = \tfrac{1}{8}$.'
      - 'Now $z$. Doubling $z$ multiplies $z^{4}$ by $2^{4} = 16$.'
      - 'Put the two together. The overall factor is $\tfrac{1}{8} \times 16 = 2$, so $x$ doubles: new $x$ to old $x$ is $2 : 1$, an increase.'
      - 'The trap is option A, $4 : 1$ — from using $2^{3}$ for $z$ or $\tfrac{1}{2}$ unpowered for $y$. Each factor must be raised to its own power — that''s the habit to keep.'
    hint: 'Multiply the two scale factors, $\tfrac{1}{8}$ and $16$.'

  7:
    answer: B
    steps:
      - 'There are two right-angled triangles here, joined along one side. We''ll work through them one at a time.'
      - 'Begin with the triangle where a side and an angle are both known.'
      - 'In triangle $PQR$, the right angle is at $P$ and $QR = 8$ is the hypotenuse. $PR$ is opposite the $60^{\circ}$ at $Q$, which gives $PR = 8\sin 60^{\circ} = 4\sqrt{3}$.'
      - 'Now, in triangle $PRS$, the right angle is at $R$ and the angle at $P$ is $45^{\circ}$, so the triangle is isosceles: $RS = PR = 4\sqrt{3}$.'
      - 'So its hypotenuse is $PS = PR\sqrt{2} = 4\sqrt{3} \times \sqrt{2} = 4\sqrt{6}$ cm.'
      - 'Does that make sense? Numerically about 9.8 cm — longer than $PR$ (6.9 cm), as a hypotenuse must be ✓.'
      - 'The slip to watch is taking $PR = 8\cos 60^{\circ} = 4$, which would make $PS = 4\sqrt{2}$ — not even offered. $PR$ faces the $60^{\circ}$ angle, so it uses sine. And option C, $2\sqrt{6}$, is exactly half the answer. Opposite side, sine — hold on to that.'
    hint: 'Try $PR = 8\sin 60^{\circ}$; then notice triangle $PRS$ is right-angled and isosceles.'

  8:
    answer: B
    steps:
      - 'This one has a lot of trig functions, but they all come back to sine and cosine. Let''s rewrite everything in those two and go slowly.'
      - 'That''s our plan: write everything in terms of $\sin z$ and $\cos z$, then substitute. With $\cos z = L$ and $z$ acute, $\sin z = \sqrt{1 - L^{2}}$.'
      - 'Start with the top. The numerator: $\cot z - \operatorname{cosec} z = \dfrac{\cos z}{\sin z} - \dfrac{1}{\sin z} = \dfrac{L - 1}{\sin z}$.'
      - 'Now the bottom. The denominator: $\sec z + \tan z = \dfrac{1}{\cos z} + \dfrac{\sin z}{\cos z} = \dfrac{1 + \sin z}{L}$.'
      - 'Dividing means flipping the second fraction: $\dfrac{L - 1}{\sin z} \times \dfrac{L}{1 + \sin z} = \dfrac{L(L - 1)}{\sin z(1 + \sin z)}$.'
      - 'Nearly there. Expand the bottom: $\sin z + \sin^{2}z = \sqrt{1 - L^{2}} + (1 - L^{2})$. So the expression is $\dfrac{L^{2} - L}{1 - L^{2} + \sqrt{1 - L^{2}}}$.'
      - 'Let''s test it with a real angle. Check with $z = 60^{\circ}$, $L = \tfrac{1}{2}$: directly $\tfrac{0.577 - 1.155}{2 + 1.732} = -0.155$; the formula gives $\tfrac{-0.25}{0.75 + 0.866} = -0.155$ ✓.'
      - 'The trap is option C, the same fraction with its numerator reversed. For an acute angle $L < 1$, so $L^{2} - L$ is negative — and so is the expression, since $\cot z < \operatorname{cosec} z$. A quick sign check like that can save you.'
    hint: 'The numerator becomes $\tfrac{L - 1}{\sin z}$ and the denominator $\tfrac{1 + \sin z}{L}$.'

  9:
    answer: B
    steps:
      - 'Tiny decimals like these are much easier in standard form. Let''s convert them and the rest follows.'
      - 'The plan: write each number in standard form, then multiply the number parts and add the indices.'
      - 'So $0.0000152 = 1.52 \times 10^{-5}$ and $0.00042 = 4.2 \times 10^{-4}$.'
      - 'Now handle the two parts separately. Numbers: $1.52 \times 4.2 = 6.384$. Powers: $10^{-5} \times 10^{-4} = 10^{-9}$.'
      - 'So the product is $6.384 \times 10^{-9}$, giving $A = 6.38$ and $B = -9$.'
      - 'The trap is option C, $B = 9$ — the sign of the index lost. Multiplying two small numbers gives an even smaller one, so the index must be negative. Keep that picture in mind and you won''t slip.'
    hint: 'Write it as $1.52 \times 10^{-5} \times 4.2 \times 10^{-4}$.'

  10:
    answer: A
    steps:
      - 'Whenever you''re told something is a factor, the factor theorem is the tool. Let''s use it twice.'
      - 'Here''s the rule: by the factor theorem, if $(x - a)$ is a factor then the expression is zero at $x = a$.'
      - 'Start with $x = 1$. Since $(x - 1)$ is a factor: $l + 2k + 24 = 0$.'
      - 'Next, watch the sign carefully. $(x + 2)$ is a factor: $l(-8) + 2k(4) + 24 = 0$, that is $-8l + 8k + 24 = 0$, or $l = k + 3$.'
      - 'Now substitute: $(k + 3) + 2k + 24 = 0$, so $3k = -27$ and $k = -9$; then $l = -6$.'
      - 'Let''s check both. At $x = 1$, which gives $-6 - 18 + 24 = 0$ ✓; at $x = -2$, which gives $48 - 72 + 24 = 0$ ✓.'
      - 'The trap is substituting $x = 2$ for the factor $(x + 2)$; the root is $x = -2$. Set the factor to zero and you''ll always get the right value.'
    hint: 'Try substituting $x = 1$ and $x = -2$.'

  11:
    answer: D
    steps:
      - 'Changing the subject of a formula with a cube root takes patience, not tricks. Let''s peel it apart one layer at a time.'
      - 'To make $T$ the subject, remove the cube root first by cubing both sides.'
      - 'That gives $\dfrac{a^{3}v^{3}}{(1 - v)^{3}} = \dfrac{2v + T}{2aT}$.'
      - 'Now clear the fractions. Cross-multiply: $2aT \cdot a^{3}v^{3} = (1 - v)^{3}(2v + T)$, that is $2a^{4}v^{3}T = 2v(1 - v)^{3} + T(1 - v)^{3}$.'
      - 'Here''s the key move: collect the $T$ terms: $T\left[2a^{4}v^{3} - (1 - v)^{3}\right] = 2v(1 - v)^{3}$.'
      - 'Finally, divide: $T = \dfrac{2v(1 - v)^{3}}{2a^{4}v^{3} - (1 - v)^{3}}$.'
      - 'The trap is option E, with $+(1 - v)^{3}$ in the denominator — the term moved across without changing its sign. Crossing the equals sign flips the sign; that''s the whole lesson here.'
    hint: 'Cube both sides, cross-multiply, then collect the $T$ terms.'

  12:
    answer: B
    steps:
      - 'A pie chart always hides one equation, and that''s where we begin.'
      - 'The sector angles of a pie chart add to $360^{\circ}$, which gives an equation for $x$.'
      - 'So add them: $(3x - 18) + (2x + 12) + (x + 12) + x + (2x - 24) = 9x - 18$.'
      - 'Now set that equal to the full turn. So $9x - 18 = 360$, giving $9x = 378$ and $x = 42$.'
      - 'But we''re not done — we need the Additional Mathematics sector. The Additional Mathematics angle is $2x - 24 = 60^{\circ}$.'
      - 'Turn that angle into pupils. That is $\tfrac{60}{360} = \tfrac{1}{6}$ of the class: $\tfrac{1}{6} \times 60 = 10$ pupils.'
      - 'The trap is option C, 18, from using the Biology angle; or stopping at $x = 42$. Finding $x$ is only halfway — always finish with what the question asks.'
    hint: 'The angles total $9x - 18 = 360$. Start there.'

  13:
    answer: A
    steps:
      - 'Most of the danger here is in the decimal point, so we''ll count places carefully.'
      - 'The plan: cube each decimal separately, then subtract. When a decimal is cubed, the number of decimal places triples.'
      - 'Start with $0.3$. It has one decimal place, so $(0.3)^{3}$ has three: $3^{3} = 27$, giving $0.027$.'
      - 'Now $(0.2)^{3}$ — $2^{3} = 8$, again with three decimal places, giving $0.008$.'
      - 'Then subtract: $0.027 - 0.008 = 0.019$.'
      - 'If you like, there''s a shortcut to check. $a^{3} - b^{3} = (a - b)(a^{2} + ab + b^{2}) = 0.1 \times (0.09 + 0.06 + 0.04) = 0.1 \times 0.19 = 0.019$ ✓.'
      - 'The trap is misplacing the decimal point: options B, C and D are the same digits 19 moved by powers of ten. Counting three decimal places settles it — and now you know how.'
    hint: 'Work out $0.027 - 0.008$.'

  14:
    answer: A
    steps:
      - 'Partial variation sounds complicated, but it just means two parts with two separate constants. Let''s build the equation.'
      - 'Translate the words first. "Partly as the square of $x$ and partly as the inverse of the square root of $x$" means $y = ax^{2} + \dfrac{b}{\sqrt{x}}$.'
      - 'Now use the first pair of values. At $x = 1$, $y = 2$, which gives $a + b = 2$.'
      - 'And the second. At $x = 4$, $y = 6$, which gives $16a + \tfrac{b}{2} = 6$, or $32a + b = 12$.'
      - 'Subtract the first equation: $31a = 10$, so $a = \tfrac{10}{31}$ and $b = 2 - \tfrac{10}{31} = \tfrac{52}{31}$.'
      - 'So $y = \dfrac{10x^{2}}{31} + \dfrac{52}{31\sqrt{x}}$.'
      - 'The trap is option E, which uses the same constant $\tfrac{10}{31}$ for both parts. The two parts vary separately, each with its own constant — keep that in mind and these become routine.'
    hint: 'Try solving $a + b = 2$ and $32a + b = 12$.'

  15:
    answer: D
    steps:
      - 'When algebraic fractions are multiplied, the whole game is spotting what cancels. Let''s factorise first.'
      - 'That''s the method: factorise everything, then cancel.'
      - 'Here are the pieces. $x^{2} - 9 = (x - 3)(x + 3)$; $x^{2} - 3x = x(x - 3)$; $x^{2} - 49 = (x - 7)(x + 7)$.'
      - 'Put them all into one fraction. The product is $\dfrac{(x - 7) \cdot x(x - 3)}{(x - 3)(x + 3)(x - 7)(x + 7)}$.'
      - 'Now cancel $(x - 7)$ and $(x - 3)$ — $\dfrac{x}{(x + 3)(x + 7)}$.'
      - 'The trap is option A, which keeps $(x - 3)$ — the factor that cancels — instead of $(x + 3)$. Look closely at which bracket survives, and you''ve got it.'
    hint: 'Factorise the two differences of squares first.'

  16:
    answer: D
    steps:
      - 'A right-angled triangle with sides in $x$ is a Pythagoras question. Let''s set it up carefully.'
      - 'The hypotenuse is the longest side, $3x + 1$. Pythagoras: $(3x + 1)^{2} = (3x - 1)^{2} + x^{2}$.'
      - 'Now expand: $9x^{2} + 6x + 1 = 9x^{2} - 6x + 1 + x^{2}$.'
      - 'Lots of it cancels. Simplify: $12x = x^{2}$, so $x(x - 12) = 0$.'
      - 'Two roots appear, but only one is sensible. $x = 0$ is not a length, so $x = 12$.'
      - 'Let''s check the triangle. Sides 37, 35 and 12, and $35^{2} + 12^{2} = 1225 + 144 = 1369 = 37^{2}$ ✓.'
      - 'The trap is option E, 0 — the other root of the equation, which gives a triangle with no size. Always ask whether a root makes sense in the real shape.'
    hint: 'Pythagoras simplifies to $x^{2} = 12x$.'

  17:
    answer: B
    steps:
      - 'Fourteen scores is a lot to handle, but the median only needs order and counting. Let''s go through it.'
      - 'Remember, the median is the middle score once the list is in order.'
      - 'So sort them: 21, 23, 29, 40, 41, 43, 47, 50, 50, 55, 56, 70, 70, 73.'
      - 'Here''s the key point. There are 14 scores — an even number — so the median is the average of the 7th and 8th.'
      - 'The 7th is 47 and the 8th is 50: median $= \tfrac{47 + 50}{2} = 48\tfrac{1}{2}$.'
      - 'The trap is option A, 47, which takes only the 7th score; or option C, 50, the mode (with 70 also appearing twice). With an even count, always average the middle two.'
    hint: 'Sort the 14 scores and average the 7th and 8th.'

  18:
    answer: D
    steps:
      - 'Matching a curve to its equation is like detective work: gather clues from the graph, then see which option fits them all.'
      - 'We''ll read three features off the graph: where it crosses the $y$-axis, where it crosses the $x$-axis, and which way it opens.'
      - 'First clue. It crosses the $y$-axis at 1, so the constant term is 1.'
      - 'Second clue. It opens downwards (it has a highest point), so the $x^{2}$ coefficient is negative.'
      - 'Third clue. It crosses the $x$-axis at $-1$ and $\tfrac{1}{3}$, so the equation is $y = -(x + 1)(3x - 1) = -(3x^{2} + 2x - 1) = 1 - 2x - 3x^{2}$.'
      - 'Let''s confirm those crossings. At $x = -1$, $1 + 2 - 3 = 0$ ✓; at $x = \tfrac{1}{3}$, $1 - \tfrac{2}{3} - \tfrac{1}{3} = 0$ ✓.'
      - 'The trap is option C, $1 + 2x - 3x^{2}$, which opens downwards and passes through 1 but has roots $1$ and $-\tfrac{1}{3}$ — the mirror image. Checking the roots is what separates them.'
    hint: 'Look for the intercept 1, a downward opening, and roots $-1$ and $\tfrac{1}{3}$.'

  19:
    answer: D
    steps:
      - 'The whole question turns on two facts about a rhombus. Let''s bring them in one at a time.'
      - 'The first fact: the diagonals of a rhombus bisect its angles.'
      - 'So the diagonal $KG$ makes $30^{\circ}$ with $KF$, and the whole angle at $K$ is $\angle HKF = 60^{\circ}$.'
      - 'Now the second fact. Adjacent angles of a rhombus (like any parallelogram) add to $180^{\circ}$, because the sides are parallel.'
      - 'So the angle at $H$ is $180^{\circ} - 60^{\circ} = 120^{\circ}$.'
      - 'The trap is option E, $60^{\circ}$ — the angle at $K$ itself. In a rhombus *opposite* angles are equal and *neighbouring* angles add to $180^{\circ}$; $H$ is a neighbour of $K$, not its opposite. Picture the shape and you''ll see it.'
    hint: 'The diagonal halves the $60^{\circ}$ at $K$.'

  20:
    answer: E
    steps:
      - 'This is a three-dimensional picture, so let''s imagine the desk carefully before we calculate anything.'
      - 'Picture it this way. The desk tilts about its 2 m edge $PQ$, which stays on the horizontal. The 0.8 m edge $QR$ rises at $30^{\circ}$.'
      - 'First, find how high $R$ gets. The height of $R$ above the floor is $0.8\sin 30^{\circ} = 0.4$ m.'
      - 'Next, the diagonal $PR$ of the desk is $\sqrt{2^{2} + 0.8^{2}} = \sqrt{4.64} \approx 2.154$ m.'
      - 'Now the diagonal rises that same 0.4 m. The inclination $\theta$ of $PR$ satisfies $\sin\theta = \dfrac{\text{height}}{PR} = \dfrac{0.4}{2.154} = 0.1857$.'
      - 'So $\theta \approx 10.70^{\circ} = 10^{\circ}42''$ (since $0.70 \times 60 = 42$).'
      - 'The trap is option B, $30^{\circ}$: the diagonal is longer than the sloping edge but rises only to the same height, so it is less steep. Same height, longer path — gentler slope.'
    hint: 'Compare the height, 0.4 m, with the diagonal, 2.154 m.'

  21:
    answer: B
    steps:
      - 'The trick with number bases is to go through base ten. Let''s do that step by step.'
      - 'Numbers in different bases are compared in base ten, so convert the base-2 numeral first.'
      - 'Look at where the 1s sit. $100100_{2}$ has 1s in the $32$ and $4$ places: $32 + 4 = 36$.'
      - 'So $x^{2} = 36$ and, taking the positive root, $x = 6$ in base ten.'
      - 'Now go back out to the base we need. Write 6 in base 4: $6 = 1 \times 4 + 2$, so $x = 12_{4}$.'
      - 'Let''s check. $12_{4} = 6$ and $6^{2} = 36 = 100100_{2}$ ✓.'
      - 'The trap is option A, 6 — correct as a number, but written in base ten. The question defines $x$ as a base-4 numeral. Always finish in the base the question asks for.'
    hint: 'First, $100100_{2} = 36$; then write $\sqrt{36}$ in base 4.'

  22:
    answer: C
    steps:
      - 'Three different-looking logs, but they''re all secretly the same log. Let''s make that visible.'
      - 'Here''s the key idea: the power law $\log a^{n} = n\log a$ turns every term into a multiple of the same logarithm, $\log_{10}a$.'
      - 'Start with the first term: $\log_{10}a^{1/3} = \tfrac{1}{3}\log_{10}a$.'
      - 'The second term is $\tfrac{1}{4}\log_{10}a$, already in that form.'
      - 'And the third term: $\tfrac{1}{12}\log_{10}a^{7} = \tfrac{7}{12}\log_{10}a$.'
      - 'Now combine the coefficients over 12, minding the minus sign: $\tfrac{4}{12} + \tfrac{3}{12} - \tfrac{7}{12} = 0$.'
      - 'So the whole expression is $0 \times \log_{10}a = 0$, whatever the value of $a$.'
      - 'The trap is option B, $\tfrac{7}{6}\log_{10}a$, which adds the third coefficient instead of subtracting it: $\tfrac{4 + 3 + 7}{12} = \tfrac{14}{12}$. Keep an eye on that last sign and the answer falls out neatly.'
    hint: 'Bring every index down in front, then work in twelfths.'

  23:
    answer: E
    steps:
      - 'Two linked variations can feel tangled, but we''ll write each as an equation and then join them.'
      - 'The plan: write each variation as an equation with its own constant, then substitute to eliminate $w$.'
      - 'First link. "$w$ varies inversely as $V$": $w = \dfrac{k}{V}$.'
      - 'Second link. "$u$ varies directly as $w^{3}$": $u = cw^{3}$.'
      - 'Now substitute: $u = c\left(\dfrac{k}{V}\right)^{3} = \dfrac{ck^{3}}{V^{3}}$. The constants combine into one, $K = ck^{3}$, so $u = \dfrac{K}{V^{3}}$.'
      - 'Use the given values. With $u = 1$ when $V = 2$, which gives $1 = \dfrac{K}{8}$, so $K = 8$ and $u = \dfrac{8}{V^{3}}$.'
      - 'Quick check: at $V = 2$, $u = \tfrac{8}{8} = 1$ ✓.'
      - 'The trap is option A, $u = 8V^{3}$, which forgets that the first link is inverse: as $V$ grows, $w$ shrinks, and so does $u$. Follow the chain one link at a time and it holds together.'
    hint: 'Substitute $w = \tfrac{k}{V}$ into $u = cw^{3}$.'

  24:
    answer: C
    steps:
      - 'One straight line and one curve: substitution is the natural way in. Let''s do it.'
      - 'The method: make $y$ the subject of the linear equation and substitute into the other.'
      - 'From $y + 5x - 2 = 0$ — $y = 2 - 5x$.'
      - 'Now substitute: $x^{2} + 2 - 5x - 8 = 0$, that is $x^{2} - 5x - 6 = 0$.'
      - 'That factorises nicely: $(x - 6)(x + 1) = 0$, so $x = 6$ or $x = -1$.'
      - 'The trap is options A and B, which contain $-28$ — the value of $y$ when $x = 6$, not a value of $x$. Check which letter the question asks for before you answer.'
    hint: 'Substitute $y = 2 - 5x$.'

  25:
    answer: A
    steps:
      - 'A lot of students slip on this one, and it''s usually over a single sign. Let''s go slowly.'
      - 'First check that the given values fit the rule: $y = x^{3} - x + 3$.'
      - 'Test a few. At $x = 2$, which gives $8 - 2 + 3 = 9$ ✓; at $x = 3$, which gives $27 - 3 + 3 = 27$ ✓; at $x = -1, 0, 1$ the value is 3 ✓.'
      - 'Now the one we need. At $x = -2$, which gives $(-2)^{3} - (-2) + 3 = -8 + 2 + 3 = -3$.'
      - 'The trap is the double sign: subtracting $-2$ adds 2. Treating it as $-2$ gives $-7$, not offered; ignoring the cube''s sign gives 13 (option D). Put negatives in brackets and they''ll behave.'
    hint: 'Remember $(-2)^{3} = -8$ and $-(-2) = +2$.'

  26:
    answer: C
    steps:
      - 'Here the whole question turns on one fact about circles, so let''s start there.'
      - 'The fact: the angle at the centre is twice the angle at the circumference standing on the same arc.'
      - 'Now look at the diagram. The $130^{\circ}$ angle is at a point on the lower arc; it stands on the upper arc between the two radii.'
