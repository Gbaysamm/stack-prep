# UTME 1984 Mathematics — worked explanations, written against the paper.
#
# Keyed on question number; see explanations_2003.yaml for why, and for how these are written.
# This is a five-option paper (A-E).
#
# All 50 are answered, and all 24 the key covers agree with it. Q25 and Q35 rest on rebuilt
# stems, which their notes in retranscribed_1984.yaml say plainly.
# Polished for a spoken lesson: each explanation opens, moves step by step, and closes.
format_version: 1
exam_year: 1984
subject: MATH

explanations:
  1:
    answer: C
    steps:
      - 'Don''t worry about the stacked fractions — we''ll take the top and the bottom one at a time, and it gets much easier.'
      - 'Here''s the plan. Work out the numerator and the denominator separately, then divide. Inside the numerator, "of" means multiply, and it is done before the subtraction.'
      - 'Start with the bracket: $\tfrac{2}{3} - \tfrac{1}{5} = \tfrac{10}{15} - \tfrac{3}{15} = \tfrac{7}{15}$.'
      - 'Next, "$\tfrac{1}{3}$ of $\tfrac{2}{5}$" $= \tfrac{1}{3} \times \tfrac{2}{5} = \tfrac{2}{15}$.'
      - 'So the numerator is $\tfrac{7}{15} - \tfrac{2}{15} = \tfrac{5}{15} = \tfrac{1}{3}$.'
      - 'Now the bottom. The denominator: $\dfrac{1}{1/2} = 2$, since dividing by a half doubles. So it is $3 - 2 = 1$.'
      - 'That makes the whole expression $\tfrac{1}{3} \div 1 = \tfrac{1}{3}$.'
      - 'The trap is misreading the denominator as $3 - \tfrac{1}{2} = \tfrac{5}{2}$, which gives $\tfrac{2}{15}$ — not offered. Dividing 1 by a half gives 2, not a half. Hold on to that and these become routine.'
    hint: 'The numerator works out to $\tfrac{1}{3}$; the denominator is $3 - 2$.'

  2:
    answer: D
    steps:
      - 'Here we''re hunting for a base, and the carries give it away. Let''s go column by column.'
      - 'The idea: add the numbers column by column as you would in base ten, but remember that a carry happens whenever a column reaches the base, not 10.'
      - 'Start with the units column: $3 + 1 = 4$, and the answer shows 4, so there is no carry.'
      - 'Now watch the middle column carefully: $6 + 4 = 10$ in ordinary counting, but the answer shows 1 in that column with a carry into the next. So $10$ must equal "one base, plus 1": $b + 1 = 10$, giving $b = 9$.'
      - 'Let''s check the last column: $2 + 4 + 1$ (the carry) $= 7$ ✓, as the answer shows.'
      - 'And to be completely sure, confirm in base ten: $263_{9} = 2(81) + 6(9) + 3 = 219$, $441_{9} = 4(81) + 4(9) + 1 = 361$, $714_{9} = 7(81) + 1(9) + 4 = 580$, and $219 + 361 = 580$ ✓.'
      - 'The trap is option C, 10: in base ten $263 + 441 = 704$, not 714 — the middle column would show 0, not 1. The carry column always tells the story.'
    hint: 'In the middle column, $6 + 4$ must equal the base plus 1.'

  3:
    answer: A
    steps:
      - 'Very small and very large numbers together — standard form is made for exactly this. Let''s use it.'
      - 'The method: put both numbers in standard form, then divide the number parts and the powers of ten separately.'
      - 'So the numerator: $0.00014323 = 1.4323 \times 10^{-4}$. Denominator: $1{,}940{,}000 = 1.94 \times 10^{6}$.'
      - 'First divide the powers: $10^{-4} \div 10^{6} = 10^{-10}$.'
      - 'Then divide the numbers: $1.4323 \div 1.94 = 0.7383$.'
      - 'Watch this part carefully. The quotient is $0.7383 \times 10^{-10}$. That is not standard form yet, because 0.7383 is less than 1; move the point one place and lower the index: $7.383 \times 10^{-11}$.'
      - 'So $k = 7.383$ and $n = -11$.'
      - 'The trap is option D, $7.831$ — the same digits in the wrong order — and forgetting the final adjustment, which would give $n = -10$. Always check the front number is between 1 and 10 before you stop.'
    hint: 'Write the numerator as $1.4323 \times 10^{-4}$ and the denominator as $1.94 \times 10^{6}$.'

  4:
    answer: A
    steps:
      - 'This is a chain of sales, and the neatest way through is backwards. Let''s undo it one sale at a time.'
      - 'Here''s the rule: work backwards from the last sale, undoing each percentage change in turn. A percentage profit or loss is always taken on the seller''s own cost.'
      - 'Start with the last sale. Q sold to R at a 5% loss, so ₦209 is 95% of what Q paid: $Q = \dfrac{209}{0.95} = ₦220$.'
      - 'Now step back once more. P sold to Q at a 10% profit, so ₦220 is 110% of what P paid: $P = \dfrac{220}{1.10} = ₦200$.'
      - 'Let''s check forwards: ₦200 plus 10% is ₦220; ₦220 minus 5% is ₦209 ✓.'
      - 'The trap is combining the two percentages into a single 5% gain ($209 \div 1.05 \approx 199$) or reversing them by subtraction. Each percentage applies to a different base, so they must be undone one at a time — and now you know how.'
    hint: 'Undo the 5% loss first ($\div 0.95$), then the 10% profit ($\div 1.10$).'

  5:
    answer: A
    steps:
      - 'This one looks wordy, but it turns into a quadratic once we name the price. Let''s build it carefully.'
      - 'Start by letting the present price be $p$ kobo. ₦2.40 is 240 kobo, so at present a customer buys $\dfrac{240}{p}$ oranges.'
      - 'After the rise the price is $p + \tfrac{1}{2}$, and the customer buys $\dfrac{240}{p + \frac{1}{2}}$.'
      - 'We''re told the second number is 16 less: $\dfrac{240}{p} - \dfrac{240}{p + \frac{1}{2}} = 16$.'
      - 'Now combine the left side: $\dfrac{240 \times \frac{1}{2}}{p(p + \frac{1}{2})} = 16$, so $120 = 16p^{2} + 8p$, or $2p^{2} + p - 15 = 0$.'
      - 'Factorise: $(2p - 5)(p + 3) = 0$, so $p = \tfrac{5}{2} = 2\tfrac{1}{2}$k (the negative root is impossible for a price).'
      - 'Let''s check: at $2\tfrac{1}{2}$k, 240k buys 96 oranges; at 3k it buys 80, which is 16 fewer ✓.'
      - 'The trap is setting the difference of the *prices* equal to 16, rather than the difference in the *numbers* of oranges. Read what the 16 is counting, and the equation writes itself.'
    hint: 'Try setting $\tfrac{240}{p} - \tfrac{240}{p + 1/2} = 16$.'

  6:
    answer: E
    steps:
      - 'Money split between two rates — one unknown is all we need. Let''s set it up.'
      - 'The trick: with one sum split between two rates, name the part at one rate and write the other part as what is left.'
      - 'So let $x$ be the amount at 8%. The rest, $50{,}000 - x$, is at 6%.'
      - 'Now add the yields: $0.08x + 0.06(50{,}000 - x) = 3{,}700$.'
      - 'Expand: $0.08x + 3{,}000 - 0.06x = 3{,}700$, so $0.02x = 700$ and $x = 35{,}000$.'
      - 'Let''s check: 8% of ₦35,000 is ₦2,800 and 6% of ₦15,000 is ₦900; together ₦3,700 ✓.'
      - 'The trap is option A, ₦15,000 — the amount at 6%, the other part of the same answer. Keep track of which part your $x$ stands for.'
    hint: 'Let $x$ be the amount invested at 8%.'

  7:
    answer: C
    steps:
      - 'Two groups with different means — the safe way is always to work with totals. Let''s do that.'
      - 'Here''s the idea: a mean times the number of people gives the total score, so write the grand total as the sum of the two group totals.'
      - 'First the boys. The 30 boys scored $30 \times 6 = 180$ altogether.'
      - 'Then, the $x$ girls scored $8x$ altogether.'
      - 'So $180 + 8x = 468$, giving $8x = 288$ and $x = 36$.'
      - 'Let''s check: $180 + 8(36) = 180 + 288 = 468$ ✓.'
      - 'The trap is averaging the two means ($\tfrac{6 + 8}{2} = 7$) and dividing 468 by 7 — the groups are different sizes, so their means cannot be averaged directly. Totals first, always.'
    hint: 'The boys'' total is 180; the girls'' total is $8x$.'

  8:
    answer: A
    steps:
      - 'Pie chart angles come from one conversion. Find what a naira is worth in degrees and the rest follows.'
      - 'Remember, a pie chart gives each item the same fraction of $360^{\circ}$ as it has of the total.'
      - 'So first, the total cost is $70 + 15 + 30 + 5 = ₦120$.'
      - 'Labour is $\tfrac{70}{120}$ of it.'
      - 'Its angle is $\tfrac{70}{120} \times 360^{\circ} = 70 \times 3 = 210^{\circ}$, since $\tfrac{360}{120} = 3$.'
      - 'Let''s check: the other sectors are $45^{\circ}$, $90^{\circ}$ and $15^{\circ}$, and $210 + 45 + 90 + 15 = 360$ ✓.'
      - 'The trap is option B, $105^{\circ}$, which divides by 240 instead of 120 — or halving by mistake. When all the sectors add to $360^{\circ}$, you know you''re right.'
    hint: 'Each naira is worth $3^{\circ}$.'

  9:
    answer: B
    steps:
      - 'Probability here is really a counting question. Let''s count the right things.'
      - 'Remember, a probability of a random choice is the number of favourable outcomes over the number of possible ones.'
      - 'Choosing from 1 to 300 gives 300 equally likely numbers.'
      - 'Now the favourable ones. The numbers divisible by 4 are $4, 8, 12, \ldots, 300$ — that is $4 \times 1$ up to $4 \times 75$, so 75 of them.'
      - 'So the probability is $\tfrac{75}{300} = \tfrac{1}{4}$.'
      - 'This matches intuition: exactly every fourth whole number is a multiple of 4, and 300 is itself a multiple of 4, so there are no leftovers.'
      - 'The trap is option D, $\tfrac{4}{300}$, which puts the divisor 4 in the numerator instead of the count of multiples, 75. Count the favourable outcomes, and you''re safe.'
    hint: 'Count the multiples of 4: $300 \div 4$.'

  10:
    answer: C
    steps:
      - 'Three logs, one of them with a fractional base. Let''s evaluate each by asking one simple question.'
      - 'The question is: "what power of the base gives this number?".'
      - 'First, $\log_{3}27 = 3$, since $3^{3} = 27$.'
      - 'Now the tricky one. $\log_{1/4}64$, which gives $\left(\tfrac{1}{4}\right)^{n} = 64 = 4^{3}$ needs $n = -3$, since $\left(\tfrac{1}{4}\right)^{-3} = 4^{3}$.'
      - 'Then $\log_{3}\tfrac{1}{81} = -4$, since $3^{-4} = \tfrac{1}{81}$.'
      - 'Putting them in: the expression is $\dfrac{3 - (-3)}{-4} = \dfrac{6}{-4} = -\dfrac{3}{2}$.'
      - 'The trap is the sign of $\log_{1/4}64$: a base less than 1 must be raised to a *negative* power to give a number bigger than 1. Taking it as $+3$ gives 0. Mind the signs and you''ll get it.'
    hint: 'Note $\log_{1/4}64 = -3$ and $\log_{3}\tfrac{1}{81} = -4$.'

  11:
    answer: D
    steps:
      - 'A steady rate of change means a straight line. Let''s turn the words into its equation.'
      - 'When $y$ goes up by 4 every time $x$ goes up by 1, the graph is a straight line with gradient 4.'
      - 'Next, the point $(0, -3)$ is on it, so $-3$ is the $y$-intercept.'
      - 'So the equation is $y = 4x - 3$.'
      - 'The options are rearranged, so match it: $y + 3 = 4x$, which is option D.'
      - 'Let''s check: at $x = 0$, $y = -3$ ✓; at $x = 1$, $y = 1$, an increase of 4 ✓.'
      - 'The trap is option E, $4y = x + 3$, which has gradient $\tfrac{1}{4}$ — the rate the wrong way round. Change in $y$ per change in $x$ — keep that order.'
    hint: 'Gradient 4, intercept $-3$.'

  12:
    answer: B
    steps:
      - 'Base five makes this look strange, but the trick is to go through base ten. Let''s do that.'
      - 'The plan: convert the base-five numbers to base ten, calculate, then convert the answer back to base five.'
      - 'So $103_{5} = 25 + 0 + 3 = 28$ oranges. $14_{5} = 5 + 4 = 9$ and $24_{5} = 10 + 4 = 14$ monts.'
      - 'Now, the gain per orange: $14 - 9 = 5$ monts. Total gain: $28 \times 5 = 140$ monts.'
      - 'Back to base five. Write 140 in base five: $140 = 1 \times 125 + 0 \times 25 + 3 \times 5 + 0$, so it is $1030_{5}$.'
      - 'Let''s check by division: $140 \div 5 = 28$ r 0; $28 \div 5 = 5$ r 3; $5 \div 5 = 1$ r 0; $1 \div 5 = 0$ r 1 — read upwards, $1030$ ✓.'
      - 'The trap is option A, $103_{5}$ — the number of oranges, not the gain. Always finish with the quantity the question names.'
    hint: 'In base ten there are 28 oranges, with a gain of 5 each.'

  13:
    answer: C
    steps:
      - 'Surds in the denominator are cleared with one standard move. Let''s use it.'
      - 'Rationalising means clearing the surds out of the denominator. For a denominator $a - b$ with surds, multiply top and bottom by the conjugate $a + b$, because $(a - b)(a + b) = a^{2} - b^{2}$ has no surd.'
      - 'Here the conjugate of $\sqrt{7} - \sqrt{5}$ is $\sqrt{7} + \sqrt{5}$.'
      - 'The bottom tidies up: the denominator becomes $(\sqrt{7})^{2} - (\sqrt{5})^{2} = 7 - 5 = 2$.'
      - 'Now the top. The numerator: $(5\sqrt{7} - 7\sqrt{5})(\sqrt{7} + \sqrt{5}) = 5 \cdot 7 + 5\sqrt{35} - 7\sqrt{35} - 7 \cdot 5$.'
      - 'Nicely, the whole numbers cancel ($35 - 35$), leaving $-2\sqrt{35}$.'
      - 'Finally, divide by the denominator: $\dfrac{-2\sqrt{35}}{2} = -\sqrt{35}$.'
      - 'The trap is option A, $-2\sqrt{35}$ — the new numerator, not yet divided by the 2 underneath it. Don''t forget that last division — it''s the easiest step to miss.'
    hint: 'Multiply top and bottom by $\sqrt{7} + \sqrt{5}$.'

  14:
    answer: C
    steps:
      - 'Powers with $n$ in them look scary, but a common factor makes $n$ vanish. Let''s find it.'
      - 'The idea: take out the lowest power of 3 from both the top and the bottom; everything else becomes plain numbers.'
      - 'Start with the top. Numerator: $3^{n} - 3^{n-1} = 3^{n-1}(3 - 1) = 2 \times 3^{n-1}$.'
      - 'Now the bottom. Denominator: $3^{3} \times 3^{n} = 27 \times 3^{n} = 27 \times 3 \times 3^{n-1}$, so it is $3^{n-1}(81 - 27) = 54 \times 3^{n-1}$.'
      - 'So the fraction is $\dfrac{2 \times 3^{n-1}}{54 \times 3^{n-1}} = \dfrac{2}{54} = \dfrac{1}{27}$.'
      - 'Let''s test it with $n = 1$ — $\dfrac{3 - 1}{81 - 27} = \dfrac{2}{54} = \dfrac{1}{27}$ ✓.'
      - 'The trap is option E, $\tfrac{2}{27}$, from writing the denominator as $27 \times 3^{n-1}$ instead of $54 \times 3^{n-1}$. Plugging in a small $n$ is a great way to catch that.'
    hint: 'Factor $3^{n-1}$ out of the top and the bottom.'

  15:
    answer: D
    steps:
      - 'Variation questions follow a pattern: write the rule, find the constant, then use it. Let''s follow it.'
      - 'Translate first. "Directly as the square of $q$ and inversely as $r$" means $p = \dfrac{kq^{2}}{r}$.'
      - 'Next, find $k$ from the first case: $36 = \dfrac{k \times 9}{4}$, so $k = 16$.'
      - 'Now use the new values, $q = 5$ and $r = 2$ — $p = \dfrac{16 \times 25}{2} = 200$.'
      - 'Here''s a check by scale factors: $q$ grows by $\tfrac{5}{3}$, so $q^{2}$ grows by $\tfrac{25}{9}$; $r$ halves, which doubles $p$. So $p = 36 \times \tfrac{25}{9} \times 2 = 200$ ✓.'
      - 'The trap is option B, 100 — forgetting that halving $r$ doubles $p$, because the variation with $r$ is inverse. Inverse means opposite: smaller $r$, bigger $p$.'
    hint: 'Use $p = \tfrac{kq^{2}}{r}$ with $k = 16$.'

  16:
    answer: C
    steps:
      - 'Factorising is much gentler once you pull out the common factor. Let''s start there.'
      - 'Take out the common factor first: $6x^{2} - 14x - 12 = 2(3x^{2} - 7x - 6)$.'
      - 'Now the quadratic. Two numbers multiplying to $3 \times (-6) = -18$ and adding to $-7$ are $-9$ and $+2$.'
      - 'Split the middle: $3x^{2} - 9x + 2x - 6 = 3x(x - 3) + 2(x - 3) = (x - 3)(3x + 2)$.'
      - 'So the full factorisation is $2(x - 3)(3x + 2)$.'
      - 'Let''s check by expanding: $2(3x^{2} + 2x - 9x - 6) = 6x^{2} - 14x - 12$ ✓.'
      - 'The trap is option A, $2(x + 3)(3x - 2)$, which has both signs reversed; it expands to $6x^{2} + 14x - 12$. Expanding back is the quickest way to be sure.'
    hint: 'Take out 2; then split $-7x$ into $-9x + 2x$.'

  17:
    answer: B
    steps:
      - 'A line meeting a curve — we know one meeting point already, and that unlocks the line. Let''s use it.'
      - 'The known point $(5, 5)$ lies on the line $y = mx$, so $5 = 5m$ and $m = 1$: the line is $y = x$.'
      - 'Now, the meeting points satisfy both equations: $x = x^{2} - 12x + 40$.'
      - 'Rearrange: $x^{2} - 13x + 40 = 0$, which factorises as $(x - 5)(x - 8) = 0$.'
      - 'We expected $x = 5$ — that''s the point already known; the other is $x = 8$.'
      - 'And on the line $y = x$, so the other point is $(8, 8)$.'
      - 'Let''s check on the curve: $64 - 96 + 40 = 8$ ✓.'
      - 'The trap is option C, $(8, 5)$, which takes the new $x$ but keeps the old $y$. The $y$ comes from the line, $y = x$ — always find both coordinates fresh.'
    hint: 'The line is $y = x$; solve $x = x^{2} - 12x + 40$.'

  18:
    answer: D
    steps:
      - 'You don''t need to draw the graph to answer this — the table already tells us. Let''s read it.'
      - 'Here''s the key idea: a graph crosses the $x$-axis where $y$ changes sign, so look along the table for a sign change.'
      - 'Between $x = -2$ and $x = 1$ the values are 11, 5, 1, −1.'
      - 'Now spot it. The only sign change is between $x = 0$ ($y = 1$) and $x = 1$ ($y = -1$).'
      - 'So the graph crosses the axis once in that stretch, in $0 < x < 1$.'
      - 'Let''s confirm with the formula: the roots of $x^{2} - 3x + 1 = 0$ are $\tfrac{3 \pm \sqrt{5}}{2}$, about 0.38 and 2.62 — only 0.38 lies between −2 and 1 ✓.'
      - 'The trap is options A and B, which claim a second crossing among the negative values; $y$ stays positive there. No sign change, no crossing — that''s the rule to remember.'
    hint: 'Look for where $y$ changes from positive to negative.'

  19:
    answer: E
    steps:
      - 'An inequality from a story has two sides to it, and it''s easy to forget one. Let''s find both.'
      - 'Two conditions apply: Musa''s total must be less than Ngozi''s 118 km, and the distance $5x$ must be positive.'
      - 'First, Musa''s total is $5x + (x + 10) = 6x + 10$.'
      - 'Coming second means $6x + 10 < 118$, so $6x < 108$ and $x < 18$.'
      - 'Now the other side. A distance covered must be positive: $5x > 0$, so $x > 0$.'
      - 'Together: $0 < x < 18$.'
      - 'The trap is option D, $0 < x < 15$, which uses a wrong total; or forgetting the lower limit entirely. A distance can''t be negative, so that lower limit always belongs.'
    hint: 'Musa''s total, $6x + 10$, is less than 118.'

  20:
    answer: D
    steps:
      - 'Simultaneous equations, then one small extra step at the end. Let''s go.'
      - 'The plan: solve the two linear equations, then add the results.'
      - 'From $x - 2y = 11$ — $x = 11 + 2y$.'
      - 'Now substitute into $2x + 3y = 1$ — $2(11 + 2y) + 3y = 1$, so $22 + 7y = 1$ and $y = -3$.'
      - 'Then $x = 11 + 2(-3) = 5$.'
      - 'And the question wants the sum: $x + y = 5 + (-3) = 2$.'
      - 'Let''s check: $2(5) + 3(-3) = 10 - 9 = 1$ ✓ and $5 - 2(-3) = 11$ ✓.'
      - 'The trap is options A and B — the values of $x$ and $y$ themselves. The question asks for their sum, so that last step matters.'
    hint: 'Substitute $x = 11 + 2y$.'

  21:
    answer: C
    steps:
      - 'Work problems catch a lot of students, and it''s nearly always about adding the wrong thing. Let''s add rates.'
      - 'Here''s the key idea: work problems add *rates*: in one day Tunde does $\tfrac{1}{x}$ of the job and Shola does $\tfrac{1}{x + 15}$.'
      - 'Together they do $\tfrac{1}{18}$ of it a day: $\dfrac{1}{x} + \dfrac{1}{x + 15} = \dfrac{1}{18}$.'
      - 'Now clear the fractions. Multiply through by $18x(x + 15)$ — $18(x + 15) + 18x = x(x + 15)$.'
      - 'Simplify: $36x + 270 = x^{2} + 15x$, so $x^{2} - 21x - 270 = 0$.'
      - 'Its positive root is 30 (since $(x - 30)(x + 9) = 0$): Tunde takes 30 days and Shola 45. Check: $\tfrac{1}{30} + \tfrac{1}{45} = \tfrac{3 + 2}{90} = \tfrac{1}{18}$ ✓.'
      - 'The trap is adding the *times* instead of the rates. Two people working together never take the sum of their separate times — together is always faster.'
    hint: 'Add the daily rates: $\tfrac{1}{x} + \tfrac{1}{x + 15} = \tfrac{1}{18}$.'

  22:
    answer: E
    steps:
      - 'A function inside a function — the order matters, so let''s work from the inside out.'
      - 'Here''s the rule: a composite function $g(f(x))$ is worked from the inside out: first find $f(x)$, then put that value into $g$.'
      - 'Start with $x = 3$. Every bracket $(x - 3)$ is 0, so $f(3) = 0 + 0 - 5 = -5$.'
      - 'Then $g(f(3)) = g(-5) = \sqrt{5 + (-5)} = \sqrt{0} = 0$.'
      - 'Now $x = 4$. The brackets are 1: $f(4) = 2(1) + 3(1) - 5 = 0$.'
      - 'Then $g(f(4)) = g(0) = \sqrt{5}$.'
      - 'So the pair is 0 and $\sqrt{5}$.'
      - 'The trap is putting 3 and 4 straight into $g$, giving $\sqrt{8}$ and 3 — working outside-in. The inner function always acts first; that''s the whole secret.'
    hint: 'Find $f(3)$ and $f(4)$ first.'

  23:
    answer: E
    steps:
      - 'Building a quadratic from its roots needs just the sum and the product. Let''s find those two.'
      - 'The pattern: a quadratic with roots $\alpha$ and $\beta$ is $x^{2} - (\alpha + \beta)x + \alpha\beta = 0$.'
      - 'First the sum of roots: $(1 - \sqrt{13}) + (1 + \sqrt{13}) = 2$ — the surds cancel.'
      - 'Then the product: $(1 - \sqrt{13})(1 + \sqrt{13}) = 1 - 13 = -12$, a difference of squares.'
      - 'So the equation is $x^{2} - 2x - 12 = 0$.'
      - 'Let''s check: by the formula its roots are $\tfrac{2 \pm \sqrt{4 + 48}}{2} = 1 \pm \sqrt{13}$ ✓.'
      - 'The trap is the sign of the sum: the $x$-coefficient is *minus* the sum. Option C, $x^{2} + 2x + 12$, has both signs wrong. Minus the sum, plus the product — keep that pattern handy.'
    hint: 'The sum is 2 and the product is $-12$.'

  24:
    answer: C
    steps:
      - 'Three expressions, one hidden common factor. Let''s factorise each and compare.'
      - 'The approach: factorise each expression fully and look for what they share.'
      - 'The first is a difference of two squares: $4a^{2} - 9b^{2} = (2a - 3b)(2a + 3b)$.'
      - 'The second is a sum of two cubes: $8a^{3} + 27b^{3} = (2a)^{3} + (3b)^{3} = (2a + 3b)(4a^{2} - 6ab + 9b^{2})$.'
      - 'And the third: $(4a + 6b)^{2} = [2(2a + 3b)]^{2} = 4(2a + 3b)^{2}$.'
      - 'Now compare. The factor present in all three is $2a + 3b$.'
      - 'The trap is option A, $4a + 6b$, which divides the third expression but not the first two. Taking out the common factor 2 reveals the real shared bracket — always factorise fully.'
    hint: 'Factorise each: a difference of squares, a sum of cubes, and a square.'

  25:
    answer: B
    steps:
      - 'A prism''s volume comes from one idea. Let''s find the cross-section first.'
      - 'The idea: a prism''s volume is the area of its uniform cross-section times its length.'
      - 'The cross-section is a right-angled triangle with hypotenuse 5 cm and one leg 4 cm, so the other leg is $\sqrt{25 - 16} = 3$ cm — the 3-4-5 triangle.'
      - 'Now its area. The two legs are at right angles, so the area is $\tfrac{1}{2} \times 3 \times 4 = 6\ \text{cm}^{2}$.'
      - 'Then multiply by the length: volume $= 6 \times 8 = 48\ \text{cm}^{3}$.'
      - 'The trap is using the hypotenuse as a leg: $\tfrac{1}{2} \times 4 \times 5 \times 8 = 80$, not offered. Only the two sides meeting at the right angle give the area directly — remember that for every right triangle.'
    hint: 'The cross-section is a 3-4-5 triangle, with area 6.'

  26:
    answer: B
    steps:
      - 'Two factors given means two equations, thanks to the factor theorem. Let''s use it.'
      - 'The factor theorem: if $(x - a)$ is a factor, then substituting $x = a$ gives zero.'
      - 'First, $(x - 2)$ is a factor, so $8 + 4p + 2q + 1 = 0$, that is $4p + 2q = -9$.'
