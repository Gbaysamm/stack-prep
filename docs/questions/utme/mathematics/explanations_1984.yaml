# UTME 1984 Mathematics — worked explanations, written against the paper.
#
# Keyed on question number; see explanations_2003.yaml for why, and for how these are written.
# This is a five-option paper (A-E).
#
# All 50 are answered, and all 24 the key covers agree with it. Q25 and Q35 rest on rebuilt
# stems, which their notes in retranscribed_1984.yaml say plainly.
format_version: 1
exam_year: 1984
subject: MATH

explanations:
  1:
    answer: C
    steps:
      - 'Work out the numerator and the denominator separately, then divide. Inside the numerator, "of" means multiply, and it is done before the subtraction.'
      - 'The bracket first: $\tfrac{2}{3} - \tfrac{1}{5} = \tfrac{10}{15} - \tfrac{3}{15} = \tfrac{7}{15}$.'
      - 'Then "$\tfrac{1}{3}$ of $\tfrac{2}{5}$" $= \tfrac{1}{3} \times \tfrac{2}{5} = \tfrac{2}{15}$.'
      - 'The numerator is $\tfrac{7}{15} - \tfrac{2}{15} = \tfrac{5}{15} = \tfrac{1}{3}$.'
      - 'The denominator: $\dfrac{1}{1/2} = 2$, since dividing by a half doubles. So it is $3 - 2 = 1$.'
      - 'The whole expression is $\tfrac{1}{3} \div 1 = \tfrac{1}{3}$.'
      - 'The trap is misreading the denominator as $3 - \tfrac{1}{2} = \tfrac{5}{2}$, which gives $\tfrac{2}{15}$ — not offered. Dividing 1 by a half gives 2, not a half.'
    hint: 'The numerator is $\tfrac{1}{3}$; the denominator is $3 - 2$.'

  2:
    answer: D
    steps:
      - 'Add the numbers column by column as you would in base ten, but remember that a carry happens whenever a column reaches the base, not 10.'
      - 'Units column: $3 + 1 = 4$, and the answer shows 4, so there is no carry.'
      - 'Middle column: $6 + 4 = 10$ in ordinary counting, but the answer shows 1 in that column with a carry into the next. So $10$ must equal "one base, plus 1": $b + 1 = 10$, giving $b = 9$.'
      - 'Check the last column: $2 + 4 + 1$ (the carry) $= 7$ ✓, as the answer shows.'
      - 'Confirm in base ten: $263_{9} = 2(81) + 6(9) + 3 = 219$, $441_{9} = 4(81) + 4(9) + 1 = 361$, $714_{9} = 7(81) + 1(9) + 4 = 580$, and $219 + 361 = 580$ ✓.'
      - 'The trap is option C, 10: in base ten $263 + 441 = 704$, not 714 — the middle column would show 0, not 1.'
    hint: 'In the middle column $6 + 4$ must equal the base plus 1.'

  3:
    answer: A
    steps:
      - 'Put both numbers in standard form, then divide the number parts and the powers of ten separately.'
      - 'Numerator: $0.00014323 = 1.4323 \times 10^{-4}$. Denominator: $1{,}940{,}000 = 1.94 \times 10^{6}$.'
      - 'Divide the powers: $10^{-4} \div 10^{6} = 10^{-10}$.'
      - 'Divide the numbers: $1.4323 \div 1.94 = 0.7383$.'
      - 'So the quotient is $0.7383 \times 10^{-10}$. That is not standard form yet, because 0.7383 is less than 1; move the point one place and lower the index: $7.383 \times 10^{-11}$.'
      - 'So $k = 7.383$ and $n = -11$.'
      - 'The trap is option D, $7.831$ — the same digits in the wrong order — and forgetting the final adjustment, which would give $n = -10$.'
    hint: 'Numerator $1.4323 \times 10^{-4}$, denominator $1.94 \times 10^{6}$.'

  4:
    answer: A
    steps:
      - 'Work backwards from the last sale, undoing each percentage change in turn. A percentage profit or loss is always taken on the seller''s own cost.'
      - 'Q sold to R at a 5% loss, so ₦209 is 95% of what Q paid: $Q = \dfrac{209}{0.95} = ₦220$.'
      - 'P sold to Q at a 10% profit, so ₦220 is 110% of what P paid: $P = \dfrac{220}{1.10} = ₦200$.'
      - 'Check forwards: ₦200 plus 10% is ₦220; ₦220 minus 5% is ₦209 ✓.'
      - 'The trap is combining the two percentages into a single 5% gain ($209 \div 1.05 \approx 199$) or reversing them by subtraction. Each percentage applies to a different base, so they must be undone one at a time.'
    hint: 'Undo the 5% loss first ($\div 0.95$), then the 10% profit ($\div 1.10$).'

  5:
    answer: A
    steps:
      - 'Let the present price be $p$ kobo. ₦2.40 is 240 kobo, so at present a customer buys $\dfrac{240}{p}$ oranges.'
      - 'After the rise the price is $p + \tfrac{1}{2}$, and the customer buys $\dfrac{240}{p + \frac{1}{2}}$.'
      - 'The second number is 16 less: $\dfrac{240}{p} - \dfrac{240}{p + \frac{1}{2}} = 16$.'
      - 'Combine the left side: $\dfrac{240 \times \frac{1}{2}}{p(p + \frac{1}{2})} = 16$, so $120 = 16p^{2} + 8p$, or $2p^{2} + p - 15 = 0$.'
      - 'Factorise: $(2p - 5)(p + 3) = 0$, so $p = \tfrac{5}{2} = 2\tfrac{1}{2}$k (the negative root is impossible for a price).'
      - 'Check: at $2\tfrac{1}{2}$k, 240k buys 96 oranges; at 3k it buys 80, which is 16 fewer ✓.'
      - 'The trap is setting the difference of the *prices* equal to 16, rather than the difference in the *numbers* of oranges.'
    hint: 'Set $\tfrac{240}{p} - \tfrac{240}{p + 1/2} = 16$.'

  6:
    answer: E
    steps:
      - 'With one sum split between two rates, name the part at one rate and write the other part as what is left.'
      - 'Let $x$ be the amount at 8%. The rest, $50{,}000 - x$, is at 6%.'
      - 'The yields: $0.08x + 0.06(50{,}000 - x) = 3{,}700$.'
      - 'Expand: $0.08x + 3{,}000 - 0.06x = 3{,}700$, so $0.02x = 700$ and $x = 35{,}000$.'
      - 'Check: 8% of ₦35,000 is ₦2,800 and 6% of ₦15,000 is ₦900; together ₦3,700 ✓.'
      - 'The trap is option A, ₦15,000 — the amount at 6%, the other part of the same answer.'
    hint: 'Let $x$ be the amount at 8%.'

  7:
    answer: C
    steps:
      - 'A mean times the number of people gives the total score, so write the grand total as the sum of the two group totals.'
      - 'The 30 boys scored $30 \times 6 = 180$ altogether.'
      - 'The $x$ girls scored $8x$ altogether.'
      - 'So $180 + 8x = 468$, giving $8x = 288$ and $x = 36$.'
      - 'Check: $180 + 8(36) = 180 + 288 = 468$ ✓.'
      - 'The trap is averaging the two means ($\tfrac{6 + 8}{2} = 7$) and dividing 468 by 7 — the groups are different sizes, so their means cannot be averaged directly.'
    hint: 'Boys'' total 180; girls'' total $8x$.'

  8:
    answer: A
    steps:
      - 'A pie chart gives each item the same fraction of $360^{\circ}$ as it has of the total.'
      - 'The total cost is $70 + 15 + 30 + 5 = ₦120$.'
      - 'Labour is $\tfrac{70}{120}$ of it.'
      - 'Its angle is $\tfrac{70}{120} \times 360^{\circ} = 70 \times 3 = 210^{\circ}$, since $\tfrac{360}{120} = 3$.'
      - 'Check: the other sectors are $45^{\circ}$, $90^{\circ}$ and $15^{\circ}$, and $210 + 45 + 90 + 15 = 360$ ✓.'
      - 'The trap is option B, $105^{\circ}$, which divides by 240 instead of 120 — or halving by mistake.'
    hint: 'Each naira is worth $3^{\circ}$.'

  9:
    answer: B
    steps:
      - 'A probability of a random choice is the number of favourable outcomes over the number of possible ones.'
      - 'Choosing from 1 to 300 gives 300 equally likely numbers.'
      - 'The numbers divisible by 4 are $4, 8, 12, \ldots, 300$ — that is $4 \times 1$ up to $4 \times 75$, so 75 of them.'
      - 'The probability is $\tfrac{75}{300} = \tfrac{1}{4}$.'
      - 'This matches intuition: exactly every fourth whole number is a multiple of 4, and 300 is itself a multiple of 4, so there are no leftovers.'
      - 'The trap is option D, $\tfrac{4}{300}$, which puts the divisor 4 in the numerator instead of the count of multiples, 75.'
    hint: 'Count the multiples of 4: $300 \div 4$.'

  10:
    answer: C
    steps:
      - 'Evaluate each logarithm by asking "what power of the base gives this number?".'
      - '$\log_{3}27 = 3$, since $3^{3} = 27$.'
      - '$\log_{1/4}64$: $\left(\tfrac{1}{4}\right)^{n} = 64 = 4^{3}$ needs $n = -3$, since $\left(\tfrac{1}{4}\right)^{-3} = 4^{3}$.'
      - '$\log_{3}\tfrac{1}{81} = -4$, since $3^{-4} = \tfrac{1}{81}$.'
      - 'So the expression is $\dfrac{3 - (-3)}{-4} = \dfrac{6}{-4} = -\dfrac{3}{2}$.'
      - 'The trap is the sign of $\log_{1/4}64$: a base less than 1 must be raised to a *negative* power to give a number bigger than 1. Taking it as $+3$ gives 0.'
    hint: '$\log_{1/4}64 = -3$ and $\log_{3}\tfrac{1}{81} = -4$.'

  11:
    answer: D
    steps:
      - 'When $y$ goes up by 4 every time $x$ goes up by 1, the graph is a straight line with gradient 4.'
      - 'The point $(0, -3)$ is on it, so $-3$ is the $y$-intercept.'
      - 'The equation is $y = 4x - 3$.'
      - 'Rearranged, $y + 3 = 4x$, which is option D.'
      - 'Check: at $x = 0$, $y = -3$ ✓; at $x = 1$, $y = 1$, an increase of 4 ✓.'
      - 'The trap is option E, $4y = x + 3$, which has gradient $\tfrac{1}{4}$ — the rate the wrong way round.'
    hint: 'Gradient 4, intercept $-3$.'

  12:
    answer: B
    steps:
      - 'Convert the base-five numbers to base ten, calculate, then convert the answer back to base five.'
      - '$103_{5} = 25 + 0 + 3 = 28$ oranges. $14_{5} = 5 + 4 = 9$ and $24_{5} = 10 + 4 = 14$ monts.'
      - 'Gain per orange: $14 - 9 = 5$ monts. Total gain: $28 \times 5 = 140$ monts.'
      - 'Write 140 in base five: $140 = 1 \times 125 + 0 \times 25 + 3 \times 5 + 0$, so it is $1030_{5}$.'
      - 'Check by division: $140 \div 5 = 28$ r 0; $28 \div 5 = 5$ r 3; $5 \div 5 = 1$ r 0; $1 \div 5 = 0$ r 1 — read upwards, $1030$ ✓.'
      - 'The trap is option A, $103_{5}$ — the number of oranges, not the gain.'
    hint: 'In base ten: 28 oranges, gain 5 each.'

  13:
    answer: C
    steps:
      - 'Rationalising means clearing the surds out of the denominator. For a denominator $a - b$ with surds, multiply top and bottom by the conjugate $a + b$, because $(a - b)(a + b) = a^{2} - b^{2}$ has no surd.'
      - 'Here the conjugate of $\sqrt{7} - \sqrt{5}$ is $\sqrt{7} + \sqrt{5}$.'
      - 'The denominator becomes $(\sqrt{7})^{2} - (\sqrt{5})^{2} = 7 - 5 = 2$.'
      - 'The numerator: $(5\sqrt{7} - 7\sqrt{5})(\sqrt{7} + \sqrt{5}) = 5 \cdot 7 + 5\sqrt{35} - 7\sqrt{35} - 7 \cdot 5$.'
      - 'The whole numbers cancel ($35 - 35$), leaving $-2\sqrt{35}$.'
      - 'Divide by the denominator: $\dfrac{-2\sqrt{35}}{2} = -\sqrt{35}$.'
      - 'The trap is option A, $-2\sqrt{35}$ — the new numerator, not yet divided by the 2 underneath it.'
    hint: 'Multiply top and bottom by $\sqrt{7} + \sqrt{5}$.'

  14:
    answer: C
    steps:
      - 'Take out the lowest power of 3 from both the top and the bottom; everything else becomes plain numbers.'
      - 'Numerator: $3^{n} - 3^{n-1} = 3^{n-1}(3 - 1) = 2 \times 3^{n-1}$.'
      - 'Denominator: $3^{3} \times 3^{n} = 27 \times 3^{n} = 27 \times 3 \times 3^{n-1}$, so it is $3^{n-1}(81 - 27) = 54 \times 3^{n-1}$.'
      - 'The fraction is $\dfrac{2 \times 3^{n-1}}{54 \times 3^{n-1}} = \dfrac{2}{54} = \dfrac{1}{27}$.'
      - 'Check with $n = 1$: $\dfrac{3 - 1}{81 - 27} = \dfrac{2}{54} = \dfrac{1}{27}$ ✓.'
      - 'The trap is option E, $\tfrac{2}{27}$, from writing the denominator as $27 \times 3^{n-1}$ instead of $54 \times 3^{n-1}$.'
    hint: 'Factor $3^{n-1}$ out of the top and the bottom.'

  15:
    answer: D
    steps:
      - '"Directly as the square of $q$ and inversely as $r$" means $p = \dfrac{kq^{2}}{r}$.'
      - 'Find $k$ from the first case: $36 = \dfrac{k \times 9}{4}$, so $k = 16$.'
      - 'Now $q = 5$ and $r = 2$: $p = \dfrac{16 \times 25}{2} = 200$.'
      - 'A check by scale factors: $q$ grows by $\tfrac{5}{3}$, so $q^{2}$ grows by $\tfrac{25}{9}$; $r$ halves, which doubles $p$. So $p = 36 \times \tfrac{25}{9} \times 2 = 200$ ✓.'
      - 'The trap is option B, 100 — forgetting that halving $r$ doubles $p$, because the variation with $r$ is inverse.'
    hint: '$p = \tfrac{kq^{2}}{r}$ with $k = 16$.'

  16:
    answer: C
    steps:
      - 'Take out the common factor first: $6x^{2} - 14x - 12 = 2(3x^{2} - 7x - 6)$.'
      - 'Factorise the quadratic: two numbers multiplying to $3 \times (-6) = -18$ and adding to $-7$ are $-9$ and $+2$.'
      - 'Split the middle: $3x^{2} - 9x + 2x - 6 = 3x(x - 3) + 2(x - 3) = (x - 3)(3x + 2)$.'
      - 'So the full factorisation is $2(x - 3)(3x + 2)$.'
      - 'Check by expanding: $2(3x^{2} + 2x - 9x - 6) = 6x^{2} - 14x - 12$ ✓.'
      - 'The trap is option A, $2(x + 3)(3x - 2)$, which has both signs reversed; it expands to $6x^{2} + 14x - 12$.'
    hint: 'Take out 2; then split $-7x$ into $-9x + 2x$.'

  17:
    answer: B
    steps:
      - 'The known point $(5, 5)$ lies on the line $y = mx$, so $5 = 5m$ and $m = 1$: the line is $y = x$.'
      - 'The meeting points satisfy both equations: $x = x^{2} - 12x + 40$.'
      - 'Rearrange: $x^{2} - 13x + 40 = 0$, which factorises as $(x - 5)(x - 8) = 0$.'
      - '$x = 5$ is the point already known; the other is $x = 8$.'
      - 'On the line $y = x$, so the other point is $(8, 8)$.'
      - 'Check on the curve: $64 - 96 + 40 = 8$ ✓.'
      - 'The trap is option C, $(8, 5)$, which takes the new $x$ but keeps the old $y$. The $y$ comes from the line, $y = x$.'
    hint: 'The line is $y = x$; solve $x = x^{2} - 12x + 40$.'

  18:
    answer: D
    steps:
      - 'A graph crosses the $x$-axis where $y$ changes sign, so look along the table for a sign change.'
      - 'Between $x = -2$ and $x = 1$ the values are 11, 5, 1, −1.'
      - 'The only sign change is between $x = 0$ ($y = 1$) and $x = 1$ ($y = -1$).'
      - 'So the graph crosses the axis once in that stretch, in $0 < x < 1$.'
      - 'Check with the formula: the roots of $x^{2} - 3x + 1 = 0$ are $\tfrac{3 \pm \sqrt{5}}{2}$, about 0.38 and 2.62 — only 0.38 lies between −2 and 1 ✓.'
      - 'The trap is options A and B, which claim a second crossing among the negative values; $y$ stays positive there.'
    hint: 'Look for where $y$ changes from positive to negative.'

  19:
    answer: E
    steps:
      - 'Two conditions apply: Musa''s total must be less than Ngozi''s 118 km, and the distance $5x$ must be positive.'
      - 'Musa''s total is $5x + (x + 10) = 6x + 10$.'
      - 'Coming second means $6x + 10 < 118$, so $6x < 108$ and $x < 18$.'
      - 'A distance covered must be positive: $5x > 0$, so $x > 0$.'
      - 'Together: $0 < x < 18$.'
      - 'The trap is option D, $0 < x < 15$, which uses a wrong total; or forgetting the lower limit entirely.'
    hint: 'Musa''s total $6x + 10$ is less than 118.'

  20:
    answer: D
    steps:
      - 'Solve the two linear equations, then add the results.'
      - 'From $x - 2y = 11$: $x = 11 + 2y$.'
      - 'Substitute into $2x + 3y = 1$: $2(11 + 2y) + 3y = 1$, so $22 + 7y = 1$ and $y = -3$.'
      - 'Then $x = 11 + 2(-3) = 5$.'
      - 'So $x + y = 5 + (-3) = 2$.'
      - 'Check: $2(5) + 3(-3) = 10 - 9 = 1$ ✓ and $5 - 2(-3) = 11$ ✓.'
      - 'The trap is options A and B — the values of $x$ and $y$ themselves. The question asks for their sum.'
    hint: 'Substitute $x = 11 + 2y$.'

  21:
    answer: C
    steps:
      - 'Work problems add *rates*: in one day Tunde does $\tfrac{1}{x}$ of the job and Shola does $\tfrac{1}{x + 15}$.'
      - 'Together they do $\tfrac{1}{18}$ of it a day: $\dfrac{1}{x} + \dfrac{1}{x + 15} = \dfrac{1}{18}$.'
      - 'Multiply through by $18x(x + 15)$: $18(x + 15) + 18x = x(x + 15)$.'
      - 'Simplify: $36x + 270 = x^{2} + 15x$, so $x^{2} - 21x - 270 = 0$.'
      - 'Its positive root is 30 (since $(x - 30)(x + 9) = 0$): Tunde takes 30 days and Shola 45. Check: $\tfrac{1}{30} + \tfrac{1}{45} = \tfrac{3 + 2}{90} = \tfrac{1}{18}$ ✓.'
      - 'The trap is adding the *times* instead of the rates. Two people working together never take the sum of their separate times.'
    hint: 'Add the daily rates: $\tfrac{1}{x} + \tfrac{1}{x + 15} = \tfrac{1}{18}$.'

  22:
    answer: E
    steps:
      - 'A composite function $g(f(x))$ is worked from the inside out: first find $f(x)$, then put that value into $g$.'
      - 'At $x = 3$ every bracket $(x - 3)$ is 0, so $f(3) = 0 + 0 - 5 = -5$.'
      - 'Then $g(f(3)) = g(-5) = \sqrt{5 + (-5)} = \sqrt{0} = 0$.'
      - 'At $x = 4$ the brackets are 1: $f(4) = 2(1) + 3(1) - 5 = 0$.'
      - 'Then $g(f(4)) = g(0) = \sqrt{5}$.'
      - 'So the pair is 0 and $\sqrt{5}$.'
      - 'The trap is putting 3 and 4 straight into $g$, giving $\sqrt{8}$ and 3 — working outside-in. The inner function always acts first.'
    hint: 'Find $f(3)$ and $f(4)$ first.'

  23:
    answer: E
    steps:
      - 'A quadratic with roots $\alpha$ and $\beta$ is $x^{2} - (\alpha + \beta)x + \alpha\beta = 0$.'
      - 'Sum of roots: $(1 - \sqrt{13}) + (1 + \sqrt{13}) = 2$ — the surds cancel.'
      - 'Product: $(1 - \sqrt{13})(1 + \sqrt{13}) = 1 - 13 = -12$, a difference of squares.'
      - 'So the equation is $x^{2} - 2x - 12 = 0$.'
      - 'Check: by the formula its roots are $\tfrac{2 \pm \sqrt{4 + 48}}{2} = 1 \pm \sqrt{13}$ ✓.'
      - 'The trap is the sign of the sum: the $x$-coefficient is *minus* the sum. Option C, $x^{2} + 2x + 12$, has both signs wrong.'
    hint: 'Sum 2, product $-12$.'

  24:
    answer: C
    steps:
      - 'Factorise each expression fully and look for what they share.'
      - '$4a^{2} - 9b^{2} = (2a - 3b)(2a + 3b)$, a difference of two squares.'
      - '$8a^{3} + 27b^{3} = (2a)^{3} + (3b)^{3} = (2a + 3b)(4a^{2} - 6ab + 9b^{2})$, a sum of two cubes.'
      - '$(4a + 6b)^{2} = [2(2a + 3b)]^{2} = 4(2a + 3b)^{2}$.'
      - 'The factor present in all three is $2a + 3b$.'
      - 'The trap is option A, $4a + 6b$, which divides the third expression but not the first two. Taking out the common factor 2 reveals the real shared bracket.'
    hint: 'Factorise each: difference of squares, sum of cubes, and a square.'

  25:
    answer: B
    steps:
      - 'A prism''s volume is the area of its uniform cross-section times its length.'
      - 'The cross-section is a right-angled triangle with hypotenuse 5 cm and one leg 4 cm, so the other leg is $\sqrt{25 - 16} = 3$ cm — the 3-4-5 triangle.'
      - 'The two legs are at right angles, so the area is $\tfrac{1}{2} \times 3 \times 4 = 6\ \text{cm}^{2}$.'
      - 'Volume $= 6 \times 8 = 48\ \text{cm}^{3}$.'
      - 'The trap is using the hypotenuse as a leg: $\tfrac{1}{2} \times 4 \times 5 \times 8 = 80$, not offered. Only the two sides meeting at the right angle give the area directly.'
    hint: 'Cross-section is a 3-4-5 triangle, area 6.'

  26:
    answer: B
    steps:
      - 'The factor theorem: if $(x - a)$ is a factor, then substituting $x = a$ gives zero.'
      - '$(x - 2)$ is a factor, so $8 + 4p + 2q + 1 = 0$, that is $4p + 2q = -9$.'
      - '$(x + 1)$ is a factor, so $-1 + p - q + 1 = 0$, that is $p = q$.'
      - 'Substitute: $4p + 2p = -9$, so $p = -\tfrac{3}{2}$ and $q = -\tfrac{3}{2}$.'
      - 'The sum is $p + q = -3$.'
      - 'The trap is substituting $x = 1$ for the factor $(x + 1)$; the root is $x = -1$.'
    hint: 'Substitute $x = 2$ and $x = -1$, each giving zero.'

  27:
    answer: D
    steps:
      - 'When a sector is bent into a cone, the two straight edges join to form the slant side, and the curved edge (the arc) wraps round to become the circumference of the base.'
      - 'The circle has diameter 12 cm, so its radius is 6 cm and its full circumference is $2\pi \times 6 = 12\pi$ cm.'
      - 'The sector takes $\tfrac{210}{360} = \tfrac{7}{12}$ of the circle, so its arc is $\tfrac{7}{12} \times 12\pi = 7\pi$ cm.'
      - 'That arc is the base circumference: $2\pi r = 7\pi$.'
      - 'So $r = \tfrac{7}{2} = 3.5$ cm.'
      - 'A sense check: the base radius must be less than the slant height (6 cm), and 3.5 is ✓.'
      - 'The trap is option A, 7.00 cm, which solves $\pi r = 7\pi$ — the base *diameter* rather than the radius.'
    hint: 'The arc, $7\pi$, becomes the base circumference $2\pi r$.'

  28:
    answer: D
    steps:
      - 'Two sides and a non-included angle are known, so the sine rule finds another angle: each side over the sine of the angle opposite it is the same.'
      - '$YZ = 5$ is opposite the $120^{\circ}$ at $X$; $XZ = 3$ is opposite the angle at $Y$.'
      - '$\dfrac{\sin Y}{3} = \dfrac{\sin 120^{\circ}}{5}$, so $\sin Y = \dfrac{3 \times 0.8660}{5} = 0.5196$.'
      - 'So $Y = 31.31^{\circ}$. The decimal part $0.31^{\circ}$ is $0.31 \times 60 \approx 18''$, giving $31^{\circ}18''$.'
      - 'Only the acute value is possible, since the triangle already has an obtuse angle at $X$.'
      - 'The trap is option B, $31^{\circ}20''$, from rounding the decimal before converting to minutes.'
    hint: '$\sin Y = \tfrac{3\sin 120^{\circ}}{5}$.'

  29:
    answer: A
    steps:
      - 'The largest angle is opposite the longest side, $x + 4$. The cosine rule links that angle to all three sides.'
      - '$\cos\theta = \dfrac{x^{2} + (x - 4)^{2} - (x + 4)^{2}}{2x(x - 4)}$.'
      - 'The numerator: $(x - 4)^{2} - (x + 4)^{2} = -16x$, so it is $x^{2} - 16x = x(x - 16)$.'
      - 'So $\cos\theta = \dfrac{x(x - 16)}{2x(x - 4)} = \dfrac{x - 16}{2(x - 4)}$.'
      - 'Set it to $\tfrac{1}{5}$: $5(x - 16) = 2(x - 4)$, so $5x - 80 = 2x - 8$ and $x = 24$.'
      - 'Check: sides 28, 24, 20 give $\cos\theta = \tfrac{576 + 400 - 784}{960} = \tfrac{192}{960} = \tfrac{1}{5}$ ✓.'
      - 'The trap is option C, 28 cm — the longest side, $x + 4$, rather than $x$.'
    hint: 'Cosine rule with $x + 4$ opposite the largest angle.'

  30:
    answer: A
    steps:
      - 'Both fractions share the denominator $1 - x$, so their squares share $(1 - x)^{2}$.'
      - '$a^{2} - b^{2} = \dfrac{4x^{2} - (1 + x)^{2}}{(1 - x)^{2}} = \dfrac{4x^{2} - 1 - 2x - x^{2}}{(1 - x)^{2}} = \dfrac{3x^{2} - 2x - 1}{(1 - x)^{2}}$.'
      - 'Factorise the numerator: $3x^{2} - 2x - 1 = (3x + 1)(x - 1)$.'
      - 'And $(1 - x)^{2} = (x - 1)^{2}$, so one factor cancels: $\dfrac{(3x + 1)(x - 1)}{(x - 1)^{2}} = \dfrac{3x + 1}{x - 1}$.'
      - 'Check with $x = 2$: $a = -4$, $b = -3$, so $a^{2} - b^{2} = 7$; and $\tfrac{7}{1} = 7$ ✓.'
      - 'The trap is stopping at $\tfrac{3x^{2} - 2x - 1}{(1 - x)^{2}}$, which is correct but not the *simplest* form — and it is not among the options exactly.'
