      - 'The idea: factorise the numerator by treating it as a quadratic in $x^{2}$.'
      - 'Let $u = x^{2}$: $u^{2} - 5u + 4 = (u - 1)(u - 4)$.'
      - 'So $x^{4} - 5x^{2} + 4 = (x^{2} - 1)(x^{2} - 4)$.'
      - 'Now divide by $x^{2} - 1$: the factor cancels, leaving $x^{2} - 4$.'
      - 'Let''s check with $x = 3$: $\tfrac{81 - 45 + 4}{8} = \tfrac{40}{8} = 5$, and $9 - 4 = 5$ ✓.'
      - 'The trap is option A, $x^{2} - 1$ — the factor that cancels, rather than the one left behind. Ask which factor survives, and you''ll have it.'
    hint: 'The numerator is $(x^{2} - 1)(x^{2} - 4)$.'
