# UTME 1985 Mathematics — worked explanations, written against the paper.
#
# Keyed on question number; see explanations_2003.yaml for why, and for how these are written.
# This is a five-option paper (A-E).
#
# All 50 are answered, and all 31 the key covers agree with it. Q15, Q45 and Q50 rest on
# rebuilt stems, which their notes in retranscribed_1985.yaml say plainly.
# Polished for a spoken lesson: each explanation opens, moves step by step, and closes.
format_version: 1
exam_year: 1985
subject: MATH

explanations:
  1:
    answer: A
    steps:
      - 'Fractions and decimals side by side are hard to compare by eye. Let''s put them all in the same form.'
      - 'Here''s the idea: numbers written in different forms can only be compared once they are in the same form, so turn both fractions into decimals.'
      - 'Start with $\tfrac{6}{7} = 0.8571\ldots$ (divide 6 by 7).'
      - 'Then $\tfrac{13}{15} = 0.8666\ldots$ (divide 13 by 15).'
      - 'The third number is already a decimal: $0.865$.'
      - 'Now line them up to three or four decimal places: $0.8571$, $0.8650$, $0.8667$. In ascending order (smallest first): $\tfrac{6}{7} < 0.865 < \tfrac{13}{15}$.'
      - 'Notice how close $0.865$ and $\tfrac{13}{15}$ are — they differ only in the fourth decimal place, so rounding too early would hide the difference.'
      - 'The trap is option E, which puts $0.865$ first because it "looks smaller" with fewer digits. The number of digits says nothing about size; only the place values do. Line up the decimal points, and you''ll always see it.'
    hint: 'Try converting $\tfrac{6}{7}$ and $\tfrac{13}{15}$ to decimals to four places.'

  2:
    answer: E
    steps:
      - 'Here we''re working backwards from the final amount to the starting sum. Let''s think in percentages.'
      - 'Remember, with simple interest, the amount is the principal plus the interest, and the interest is a fixed percentage each year.'
      - 'So over 4 years at 8% a year the interest is $4 \times 8\% = 32\%$ of the principal.'
      - 'That makes the amount $100\% + 32\% = 132\%$ of the principal: $1.32P = 330$.'
      - 'Therefore $P = \dfrac{330}{1.32} = 250$, so ₦250.00 was invested.'
      - 'Let''s check: 8% of ₦250 is ₦20 a year, so 4 years give ₦80, and $250 + 80 = 330$ ✓.'
      - 'The trap is taking 32% off the final ₦330 ($330 - 105.60 = 224.40$, not offered) or subtracting only one year''s interest. The percentage is of the unknown principal, not of the amount — keep that straight and you''re fine.'
    hint: 'The amount is 1.32 times the principal.'

  3:
    answer: B
    steps:
      - 'The trick with number bases is to go through base ten. Let''s do that step by step.'
      - 'So the easiest route is to convert everything to base ten, solve, then convert the answer back to base 2.'
      - 'Convert each one: $11_{2} = 2 + 1 = 3$; $1000_{2} = 8$; $101_{2} = 4 + 1 = 5$.'
      - 'Now the equation becomes $\dfrac{3}{x} = \dfrac{8}{x + 5}$.'
      - 'Cross-multiply: $3(x + 5) = 8x$, so $3x + 15 = 8x$ and $5x = 15$, giving $x = 3$.'
      - 'Back to base 2: $3 = 2 + 1 = 11_{2}$.'
      - 'Let''s check: $\tfrac{3}{3} = 1$ and $\tfrac{8}{3 + 5} = 1$ ✓.'
      - 'The trap is option A, $101$ — the $5$ from the equation, not the solution. The answer must be written back in base 2, and for the unknown, not a number from the question.'
    hint: 'In base ten the equation is $\tfrac{3}{x} = \tfrac{8}{x + 5}$.'

  4:
    answer: A
    steps:
      - 'A double inequality looks like two problems, but we can handle it all at once. Let''s see how.'
      - 'The rule: a double inequality is solved by doing the same operation to all three parts at once.'
      - 'First, add 6 throughout: $-2 + 6 \le 2x \le 4 + 6$, that is $4 \le 2x \le 10$.'
      - 'Then divide throughout by 2 (positive, so the signs stay the same): $2 \le x \le 5$.'
      - 'So the integers in that range are 2, 3, 4 and 5 — both ends included, because the inequality includes equality.'
      - 'Let''s check the ends: $x = 2$ gives $2(2) - 6 = -2$ ✓ and $x = 5$ gives $4$ ✓.'
      - 'The trap is option B, 2, 3, 4, which drops the upper end — or, with strict inequalities, dropping both ends. Whether an end point counts depends entirely on $\le$ versus $<$, so always look at the sign.'
    hint: 'Add 6, then divide by 2: $2 \le x \le 5$.'

  5:
    answer: A
    steps:
      - 'Rounding is where this one is won or lost. We''ll add everything exactly first, then round once.'
      - 'That''s the rule: rounding should be done once, at the end, so first add everything exactly as decimals.'
      - 'As decimals, $\tfrac{1}{100} = 0.01$, $\tfrac{3}{1000} = 0.003$ and $\tfrac{27}{10000} = 0.0027$.'
      - 'Now line up the decimal points and add: $100.0000 + 0.0100 + 0.0030 + 0.0027 = 100.0157$.'
      - 'To two decimal places, look at the third decimal digit. It is 5, and the rule is that 5 or more rounds the previous digit up.'
      - 'So $100.0157 \to 100.02$.'
      - 'The trap is option D, 100.01, which either chops off the digits instead of rounding or rounds each small fraction to 0.00 before adding — losing the 0.0057 that tips the total up. Exact first, round last.'
    hint: 'Add to get 100.0157, then round.'

  6:
    answer: C
    steps:
      - 'Fractions stacked inside fractions look frightening, but there''s a clear path: start at the bottom and climb.'
      - 'That''s the method. A continued fraction is simplified from the bottom up: work out the deepest fraction first and climb.'
      - 'The deepest part: $4 + \tfrac{1}{5} = \tfrac{21}{5}$, so $\dfrac{1}{4 + \frac{1}{5}} = \dfrac{5}{21}$.'
      - 'Next level up: $2 - \tfrac{5}{21} = \tfrac{42 - 5}{21} = \tfrac{37}{21}$, and its reciprocal is $\tfrac{21}{37}$.'
      - 'And the next: $2 + \tfrac{21}{37} = \tfrac{74 + 21}{37} = \tfrac{95}{37}$, and its reciprocal is $\tfrac{37}{95}$.'
      - 'Finally: $\tfrac{1}{2} + \tfrac{37}{95} = \tfrac{95}{190} + \tfrac{74}{190} = \tfrac{169}{190}$.'
      - 'A sense check: $\tfrac{37}{95} \approx 0.39$, so the total is about $0.89$, and $\tfrac{169}{190} \approx 0.889$ ✓.'
      - 'The trap is working from the top down, adding $\tfrac{1}{2} + 1$ first. In a continued fraction every "1 over" applies to everything below it, so the bottom must be finished first. Bottom up, every time.'
    hint: 'Start with $4 + \tfrac{1}{5}$ and work upwards, taking reciprocals.'

  7:
    answer: B
    steps:
      - 'With a ratio, we can often just pick friendly numbers. Let''s see why that works here.'
      - 'A ratio $6 : 4 : 5$ means the numbers are $6k$, $4k$ and $5k$ for some $k$. Any expression where the $k$s cancel can be evaluated with $k = 1$.'
      - 'So take $p = 6$, $q = 4$, $r = 5$.'
      - 'The top: $3p - q = 18 - 4 = 14$.'
      - 'The bottom: $4q + r = 16 + 5 = 21$.'
      - 'So the value is $\tfrac{14}{21} = \tfrac{2}{3}$.'
      - 'If you''re unsure, keep $k$ in: $\tfrac{18k - 4k}{16k + 5k} = \tfrac{14k}{21k}$, and the $k$ cancels — which is why the ratio alone is enough.'
      - 'The trap is option A, $\tfrac{3}{2}$, the fraction upside down. Numerator over denominator, in that order — a small check that pays off.'
    hint: 'Put $p = 6$, $q = 4$, $r = 5$.'

  8:
    answer: E
    steps:
      - 'Three small logarithms, each answering the same question. Let''s take them one at a time.'
      - 'Each logarithm asks one question: what power of the base gives the number? Answer each in turn.'
      - 'First, $\log_{2}4$: $2^{2} = 4$, so it is 2.'
      - 'Now watch this one. $\log_{4}2$: 2 is the square root of 4, and a square root is the power $\tfrac{1}{2}$, so $4^{1/2} = 2$ and the log is $\tfrac{1}{2}$.'
      - 'Then $\log_{25}5$: in the same way $25^{1/2} = 5$, so it is $\tfrac{1}{2}$.'
      - 'So the expression is $2 + \tfrac{1}{2} - \tfrac{1}{2} = 2$.'
      - 'Here''s a pattern worth knowing: $\log_{a}b = \dfrac{1}{\log_{b}a}$. So $\log_{4}2 = \dfrac{1}{\log_{2}4} = \dfrac{1}{2}$ ✓.'
      - 'The trap is reading $\log_{4}2$ as 2 because "2 squared is 4" — that answers $\log_{2}4$, the question the other way round. Always start from the base.'
    hint: 'Note $\log_{2}4 = 2$, and the other two are each $\tfrac{1}{2}$.'

  9:
    answer: A
    steps:
      - 'This one is a little story, and each sentence becomes a piece of algebra. Let''s translate it together.'
      - 'Start by letting John start with $x$ naira and translate each sentence into algebra.'
      - 'He gives away $\tfrac{x}{3}$, so he keeps $\tfrac{2x}{3}$.'
      - 'And Janet now has $105 + \tfrac{x}{3}$.'
      - 'Now the key sentence. John''s money is one quarter of Janet''s: $\tfrac{2x}{3} = \tfrac{1}{4}\left(105 + \tfrac{x}{3}\right)$.'
      - 'Clear the fractions. Multiply by 12: $8x = 3(105) + x$, so $7x = 315$ and $x = 45$.'
      - 'Let''s check: John gives ₦15 and keeps ₦30; Janet has ₦120, and $30 = \tfrac{1}{4} \times 120$ ✓.'
      - 'The trap is forgetting that Janet''s total grows when John gives her money: comparing $\tfrac{2x}{3}$ with a quarter of 105 alone gives about ₦39, not offered. Follow the money both ways, and it balances.'
    hint: 'John keeps $\tfrac{2x}{3}$; Janet has $105 + \tfrac{x}{3}$.'

  10:
    answer: B
    steps:
      - 'Every logarithm can be turned back into a power, and that''s exactly what we''ll do here.'
      - 'Remember, a logarithm is an index. The statement $\log_{9}x = 1.5$ means "9 raised to the power 1.5 gives $x$": $x = 9^{1.5}$.'
      - 'Next, write the decimal index as a fraction: $1.5 = \tfrac{3}{2}$.'
      - 'Here''s how to read it. A fractional index $\tfrac{m}{n}$ means: take the $n$th root, then raise to the power $m$. So $9^{3/2} = \left(\sqrt{9}\right)^{3}$.'
      - 'Now $\sqrt{9} = 3$, and $3^{3} = 27$. So $x = 27$.'
      - 'Let''s check: $9^{1.5} = 9 \times 9^{0.5} = 9 \times 3 = 27$ ✓.'
      - 'The trap is treating the logarithm as a multiplication: $9 \times 1.5 = 13.5$ is not offered, but the same slip with other numbers is behind options like 24.5. A logarithm always converts to a power — hold on to that.'
    hint: 'Think of it as $x = 9^{3/2} = (\sqrt{9})^{3}$.'

  11:
    answer: A
    steps:
      - 'Changing the subject can feel messy when the letter appears twice. We''ll gather it up carefully.'
      - 'The plan: to make $h$ the subject, clear the fraction, then collect every term containing $h$ on one side.'
      - 'First, multiply both sides by $1 - dh$: $a(1 - dh) = b(1 - ch)$.'
      - 'Expand: $a - adh = b - bch$.'
      - 'Now move the $h$ terms to one side and the rest to the other: $a - b = adh - bch$.'
      - 'Factor out $h$: $a - b = h(ad - bc)$.'
      - 'And divide: $h = \dfrac{a - b}{ad - bc}$.'
      - 'The trap is option E, $\tfrac{b - a}{ad - bc}$, from moving the terms across with the signs slipped. A check with numbers settles it: $b = 1$, $c = 0$, $d = 1$, $h = \tfrac{1}{2}$ gives $a = 2$, and $\tfrac{2 - 1}{2 - 0} = \tfrac{1}{2}$ ✓. A quick numeric test is a great habit.'
    hint: 'Cross-multiply, then factor out $h$.'

  12:
    answer: C
    steps:
      - 'Currency problems like this come down to a single equation. Let''s write it and rearrange it.'
      - 'Start by writing the statement as an equation: $22.5\%$ of one naira equals $17.1\%$ of one M.'
      - 'So $0.225\,\text{N} = 0.171\,\text{M}$.'
      - 'Now, to express 1 M in naira, divide both sides by 0.171: $1\text{M} = \dfrac{0.225}{0.171}\,\text{N}$.'
      - 'Simplify $\tfrac{225}{171}$: both divide by 9, giving $\tfrac{25}{19} = 1\tfrac{6}{19}$.'
      - 'The options use 57ths: $\tfrac{6}{19} = \tfrac{18}{57}$, so $1\text{M} = ₦1\tfrac{18}{57}$.'
      - 'Does it make sense? A smaller percentage of M matches a larger percentage of the naira, so M is worth more than the naira — the rate should be a little above 1 ✓.'
      - 'The trap is option A, $\tfrac{15}{57}$ — close to the fraction the wrong way up. Always divide so that the currency being converted sits alone on one side, and you''ll get it right.'
    hint: 'Write it as $0.225\,\text{N} = 0.171\,\text{M}$.'

  13:
    answer: A
    steps:
      - 'Whenever you see "equal roots", the discriminant is the tool. Let''s use it.'
      - 'The fact: a quadratic has equal roots exactly when its discriminant $b^{2} - 4ac$ is zero.'
      - 'Here $a = 1$, $b = -(p - 2)$ and $c = 2p + 1$.'
      - 'So set $(p - 2)^{2} - 4(2p + 1) = 0$.'
      - 'Expand: $p^{2} - 4p + 4 - 8p - 4 = p^{2} - 12p = 0$.'
      - 'Factorise: $p(p - 12) = 0$, so $p = 0$ or $p = 12$.'
      - 'Let''s check both. $p = 12$: $x^{2} - 10x + 25 = (x - 5)^{2}$ ✓; $p = 0$: $x^{2} + 2x + 1 = (x + 1)^{2}$ ✓.'
      - 'The trap is dropping the root $p = 0$ by dividing by $p$. Always factorise instead of dividing by an unknown — that way no answer slips away.'
    hint: 'Set the discriminant to zero.'

  14:
    answer: A
    steps:
      - 'You don''t need a new series here — just the one for $e^{x}$ with a clever substitution. Let''s make it.'
      - 'The series for $e^{x}$ holds for any value put in place of $x$, and $\dfrac{1}{e^{x/2}} = e^{-x/2}$. So replace every $x$ in the series by $-\tfrac{x}{2}$.'
      - 'The first term is 1.'
      - 'The second is $-\dfrac{x}{2}$.'
      - 'Now watch the signs. Third: $\dfrac{(-x/2)^{2}}{1 \cdot 2} = \dfrac{x^{2}}{4 \times 2} = \dfrac{x^{2}}{1 \cdot 2^{3}}$ — positive, because the square removes the minus.'
      - 'Fourth: $\dfrac{(-x/2)^{3}}{1 \cdot 2 \cdot 3} = -\dfrac{x^{3}}{8 \times 6} = -\dfrac{x^{3}}{2^{4} \cdot 3}$ — negative, because a cube keeps the minus.'
      - 'So $e^{-x/2} = 1 - \dfrac{x}{2} + \dfrac{x^{2}}{1 \cdot 2^{3}} - \dfrac{x^{3}}{2^{4} \cdot 3} + \cdots$, with signs that alternate.'
      - 'The trap is option E, which has all plus signs — that is $e^{+x/2}$, the value before taking the reciprocal. Option D gets the signs right but forgets to square and cube the $\tfrac{1}{2}$ properly. Substitute the whole of $-\tfrac{x}{2}$, sign and all.'
    hint: 'Substitute $-\tfrac{x}{2}$ for $x$ in the series.'

  15:
    answer: D
    steps:
      - 'Surds can tempt you into a long calculation, but look first — something here simply cancels.'
      - 'Take out the common factor 4 from top and bottom of the fraction first: $\dfrac{4(\sqrt{3} + \sqrt{2})}{4(\sqrt{3} - \sqrt{2})} = \dfrac{\sqrt{3} + \sqrt{2}}{\sqrt{3} - \sqrt{2}}$.'
      - 'The expression is then $\dfrac{\sqrt{3} + \sqrt{2}}{\sqrt{3} - \sqrt{2}} \times (\sqrt{3} - \sqrt{2})$.'
      - 'And here''s the neat part: the factor $(\sqrt{3} - \sqrt{2})$ multiplies the denominator away completely.'
      - 'What is left is $\sqrt{3} + \sqrt{2}$.'
      - 'A numerical check: the fraction is $\tfrac{3.146}{0.318} \approx 9.90$, times $0.318$ gives $3.146$, and $\sqrt{3} + \sqrt{2} \approx 3.146$ ✓.'
      - 'The trap is rationalising first — multiplying top and bottom by the conjugate — which works but takes far longer. Look for a factor that simply cancels before expanding anything; it saves precious exam time.'
    hint: 'Look at the last factor — it cancels the denominator.'

  16:
    answer: D
    steps:
      - 'Partial variation means two parts with two constants. We''ll find both from the two facts given.'
      - 'Translate first. "Partly constant and partly inversely proportional" means the cost per head has the form $C = a + \dfrac{b}{n}$, where $n$ is the number of people.'
      - 'Now the two facts. For 100 people: $30 = a + \dfrac{b}{100}$. For 40 people: $60 = a + \dfrac{b}{40}$.'
      - 'Subtract the first from the second: $30 = \dfrac{b}{40} - \dfrac{b}{100} = b \cdot \dfrac{5 - 2}{200} = \dfrac{3b}{200}$, so $b = 2000$.'
      - 'Then $a = 30 - \dfrac{2000}{100} = 10$.'
      - 'Now use the rule. For 50 people: $C = 10 + \dfrac{2000}{50} = 10 + 40 = 50$k.'
      - 'A sense check: 50 people is between 40 and 100, so the cost per head should lie between 30k and 60k ✓.'
      - 'The trap is treating the cost as purely inverse — $60 \times \tfrac{40}{50} = 48$k, not offered — and forgetting the constant part that does not shrink with more people. Two parts, two constants — that''s the pattern.'
    hint: 'Write $C = a + \tfrac{b}{n}$ and use the two facts to find $a$ and $b$.'

  17:
    answer: A
    steps:
      - 'This looks like a monster, but it is a difference of two squares in disguise. Let''s unmask it.'
      - 'Notice $9 = 3^{2}$, so the expression is a difference of two squares: $9 - (x^{2} - 3x - 1)^{2} = (3 - B)(3 + B)$ with $B = x^{2} - 3x - 1$.'
      - 'Now the first bracket: $3 - (x^{2} - 3x - 1) = -x^{2} + 3x + 4 = -(x^{2} - 3x - 4) = -(x - 4)(x + 1)$.'
      - 'And the second bracket: $3 + x^{2} - 3x - 1 = x^{2} - 3x + 2 = (x - 1)(x - 2)$.'
      - 'Together: $-(x - 4)(x + 1)(x - 1)(x - 2)$.'
      - 'Let''s check with $x = 0$: the original is $9 - 1 = 8$, and $-(-4)(1)(-1)(-2) = 8$ ✓.'
      - 'The trap is losing the leading minus sign, which comes from $-x^{2}$ in the first bracket. Option D has no minus and the wrong factors; option E is the factorisation of $(x^{2} - 1)(x^{2} - 4)$. Keep that minus in front, and you''ve got it.'
    hint: 'Use $3^{2} - B^{2} = (3 - B)(3 + B)$.'

  18:
    answer: C
    steps:
      - 'An equation with powers of 3 can hide a quadratic. Let''s bring it into the open.'
      - 'Here''s the key idea: $3^{2y} = (3^{y})^{2}$, so the equation is a quadratic in $3^{y}$.'
      - 'So let $u = 3^{y}$: $u^{2} - 6u - 27 = 0$.'
      - 'Factorise: $(u - 9)(u + 3) = 0$, so $u = 9$ or $u = -3$.'
      - 'Now think about what makes sense. A power of 3 is always positive, so $3^{y} = -3$ is impossible and is rejected.'
      - 'That leaves $3^{y} = 9 = 3^{2}$, which gives $y = 2$.'
      - 'Let''s check: $81 - 6(9) = 27$ ✓.'
      - 'The trap is option B or D, which come from treating $u = -3$ as allowed. Discarding impossible values of the substitution is part of the method — always ask if a value can really happen.'
    hint: 'Let $u = 3^{y}$, and reject the negative root.'

  19:
    answer: A
    steps:
      - 'Four terms usually means factorising by grouping. Let''s find the right pairs.'
      - 'The method: four terms — group them into pairs that share a factor.'
      - 'Pair the $b$ terms and the $y$ terms: $(abx^{2} - 4bx) + (8y - 2axy)$.'
      - 'First pair: $bx(ax - 4)$. Second pair: $-2y(ax - 4)$ — taking out $-2y$ makes the bracket match.'
      - 'The common bracket comes out: $(ax - 4)(bx - 2y)$.'
      - 'Let''s check by expanding: $abx^{2} - 2axy - 4bx + 8y$ ✓.'
      - 'The trap is option E, $(bx - 4)(ax - 2y)$, which swaps the letters inside the brackets; expanded it gives $abx^{2} - 2bxy - 4ax + 8y$, a different expression. Expanding back is the surest check.'
    hint: 'Group it as $bx(ax - 4) - 2y(ax - 4)$.'

  20:
    answer: E
    steps:
      - 'A cubic meeting a quadratic sounds hard, but a common factor makes it quick. Let''s find it.'
      - 'At an intersection the two $y$-values are equal: $x^{3} + x = x^{2} + 1$.'
      - 'Now factor each side: $x(x^{2} + 1) = x^{2} + 1$.'
      - 'Bring to one side: $(x^{2} + 1)(x - 1) = 0$.'
      - 'Here''s the key point. The factor $x^{2} + 1$ is never zero for real $x$ (it is at least 1), so the only real solution is $x = 1$.'
      - 'Let''s check: both curves give $y = 2$ at $x = 1$ ✓.'
      - 'The trap is dividing both sides by $x^{2} + 1$ without noticing it is safe only because it is never zero — or trying $x = -1$, where the curves give $-2$ and $2$. Factorising keeps every step honest.'
    hint: 'Factor it as $x(x^{2} + 1) = x^{2} + 1$.'

  21:
    answer: D
    steps:
      - 'A perfect square is just a quadratic with one repeated root. So, once again, the discriminant does the work.'
      - 'The fact: a quadratic $ax^{2} + bx + c$ is a perfect square when it has a single repeated root, which happens exactly when the discriminant $b^{2} - 4ac$ is zero.'
      - 'Here $a = 3$, $b = -7$ and $c = R$.'
      - 'So set $b^{2} - 4ac = 0$: $(-7)^{2} - 4(3)(R) = 49 - 12R = 0$.'
      - 'That gives $R = \tfrac{49}{12}$.'
      - 'Let''s confirm by completing the square: $3x^{2} - 7x + \tfrac{49}{12} = 3\left(x^{2} - \tfrac{7}{3}x + \tfrac{49}{36}\right) = 3\left(x - \tfrac{7}{6}\right)^{2}$ ✓.'
      - 'The trap is option E, $\tfrac{49}{36}$ — the familiar rule "(half the coefficient of $x$) squared" applied without first taking out the leading 3. That rule only works when the $x^{2}$ coefficient is 1 — worth remembering.'
    hint: 'Set $49 - 12R = 0$.'

  22:
    answer: B
    steps:
      - 'Don''t worry about the fractions — we''ll clear them in one move and it gets much easier.'
      - 'Here''s the move: multiply every term by the common denominator $3(2r - 1)(r + 2)$.'
      - 'That gives $6(r + 2) - 5(2r - 1)(r + 2) = 3(2r - 1)$.'
      - 'Now expand: $6r + 12 - 5(2r^{2} + 3r - 2) = 6r - 3$, that is $6r + 12 - 10r^{2} - 15r + 10 = 6r - 3$.'
      - 'Collect: $-10r^{2} - 15r + 25 = 0$, or dividing by $-5$, $2r^{2} + 3r - 5 = 0$.'
      - 'Factorise: $(2r + 5)(r - 1) = 0$, so $r = 1$ or $r = -\tfrac{5}{2}$.'
      - 'Let''s check $r = 1$: $2 - \tfrac{5}{3} = \tfrac{1}{3}$ and $\tfrac{1}{3}$ ✓.'
      - 'The trap is option A, $(-1, \tfrac{5}{2})$ — both roots with their signs reversed, from factorising as $(2r - 5)(r + 1)$. Expand your brackets back to check the signs.'
    hint: 'Clear the fractions to reach $2r^{2} + 3r - 5 = 0$.'

  23:
    answer: A
    steps:
      - 'One linear equation and one quadratic — substitution is the natural route. Let''s take it.'
      - 'The method: make $y$ the subject of the linear equation and substitute it into the quadratic one.'
      - 'From $2x + y = 4$: $y = 4 - 2x$.'
      - 'Now substitute: $x^{2} + x(4 - 2x) = -12$, so $-x^{2} + 4x + 12 = 0$, or $x^{2} - 4x - 12 = 0$.'
      - 'Factorise: $(x - 6)(x + 2) = 0$, so $x = 6$ or $x = -2$.'
      - 'Then find each $y$. $y = 4 - 12 = -8$ or $y = 4 + 4 = 8$: the pairs are $(6, -8)$ and $(-2, 8)$.'
      - 'Let''s check $(6, -8)$: $36 - 48 = -12$ ✓.'
      - 'The trap is option D, which lists the same numbers in the wrong positions — each pair must be $(x, y)$ in that order. Keep each $x$ with its own $y$.'
    hint: 'Substitute $y = 4 - 2x$.'

  24:
    answer: A
    steps:
      - 'A chain of equals signs hides two equations. Let''s pull them apart and solve.'
      - 'Here''s how to read it: a chain $A = B = 5$ contains two equations: $2x - 3y + 10 = 5$ and $10x - 6y = 5$.'
      - 'The first simplifies to $2x - 3y = -5$.'
      - 'Now eliminate $y$. Double it: $4x - 6y = -10$. Subtract from the second: $6x = 15$, so $x = \tfrac{5}{2} = 2\tfrac{1}{2}$.'
      - 'Then $3y = 2x + 5 = 10$, so $y = \tfrac{10}{3} = 3\tfrac{1}{3}$.'
      - 'Let''s check in the second: $25 - 20 = 5$ ✓.'
      - 'The trap is option E, which keeps the right $x$ but a wrong $y$ — usually from dropping the $+10$ when simplifying the first equation. Carry every term across, and both values come out right.'
    hint: 'Split the chain into two equations.'

  25:
    answer: D
    steps:
      - 'This one catches a lot of students because the rule is given for $f(x - 2)$, not $f(x)$. Let''s handle that carefully.'
