format_version: 1
exam_year: 1986
subject: MATH

explanations:
  1:
    answer: C
    steps:
      - 'Three numbers in base 3 all at once can look scary, but there''s a safe road through it. Let''s take it together.'
      - 'Here''s the plan: arithmetic across numerals in another base is safest done in base ten. Convert each one, calculate, then convert the answer back.'
      - 'Start with the first. In base 3 the place values are 9, 3 and 1. So $212_{3} = 2(9) + 1(3) + 2 = 23$.'
      - 'Do the same for the other two: $121_{3} = 1(9) + 2(3) + 1 = 16$ and $222_{3} = 2(9) + 2(3) + 2 = 26$.'
      - 'Now the calculation itself is ordinary arithmetic: $23 - 16 + 26 = 33$.'
      - 'Next, write 33 back in base 3. The place values are 27, 9, 3, 1: $33 = 1(27) + 0(9) + 2(3) + 0(1)$, so it is $1020_{3}$.'
      - 'Let''s check by dividing: $33 \div 3 = 11$ r 0, $11 \div 3 = 3$ r 2, $3 \div 3 = 1$ r 0, $1 \div 3 = 0$ r 1 — read upwards, $1020$ ✓.'
      - 'The trap is option A, $313_{3}$, which is not even a base-3 numeral: base 3 only uses the digits 0, 1 and 2. Any option containing a 3 can be rejected at once — a quick check that saves time.'
    hint: 'Try converting to base ten first (23, 16, 26), calculate, then turn 33 back into base 3.'

  2:
    answer: C
    steps:
      - 'This one is about the difference between what might have been and what really was. Let''s keep those two apart.'
      - 'An average of 60 over four subjects means a total of $4 \times 60 = 240$ — but that is the total he *would* have had.'
      - 'Now look at what that "would have" total assumes: 75 in Biology. His actual Biology mark was 57.'
      - 'So the gap between them is $75 - 57 = 18$ marks.'
      - 'Take that gap off, and his actual total is $240 - 18 = 222$.'
      - 'Let''s check: with 222 and the Biology mark raised by 18, the total becomes 240, and $240 \div 4 = 60$ ✓.'
      - 'The trap is option B, 240 — the hypothetical total, not the real one. The question asks what his total *was*, so always read which version of the story it wants.'
    hint: 'The hypothetical total is $4 \times 60$; now take off the 18 marks he did not actually score.'

  3:
    answer: D
    steps:
      - 'L.C.M. and H.C.F. questions both come from the same place: prime factors. Let''s break the numbers down first.'
      - 'Factorise all three numbers into primes; then both the L.C.M. and the H.C.F. can be read straight off.'
      - 'Here they are: $48 = 2^{4} \times 3$, $64 = 2^{6}$ and $80 = 2^{4} \times 5$.'
      - 'For the H.C.F., take each prime to the *lowest* power found in all three. Only 2 is common, and its lowest power is $2^{4} = 16$.'
      - 'For the L.C.M., it''s the opposite: each prime to the *highest* power found in any. That gives $2^{6} \times 3 \times 5 = 64 \times 15 = 960$.'
      - 'Now divide: $960 \div 16 = 60$.'
      - 'The trap is swapping the roles of highest and lowest powers — which would make the H.C.F. bigger than the L.C.M. and the answer a fraction. Remember: lowest for H.C.F., highest for L.C.M.'
    hint: 'Work out the L.C.M. (960) and the H.C.F. (16) from the prime factors.'

  4:
    answer: D
    steps:
      - 'Perfect squares have a neat fingerprint in their prime factors. Once you see it, this question opens up.'
      - 'Here''s the key idea: a perfect square has every prime factor to an even power, so factorise 252 and look for the primes with odd powers.'
      - 'Break it down: $252 = 4 \times 63 = 2^{2} \times 3^{2} \times 7$.'
      - 'The 2 and the 3 are already squared; only the 7 appears to an odd power (the first).'
      - 'So give it a partner. Multiplying by one more 7 makes it $7^{2}$: $252 \times 7 = 1764 = 42^{2}$.'
      - 'That means the smallest multiplier is 7.'
      - 'The trap is option A, 2 — but 252 already contains $2^{2}$; multiplying by 2 would make $2^{3}$, an odd power, and ruin the square. Pair up the lonely primes and you''re done.'
    hint: 'Break it down: $252 = 2^{2} \times 3^{2} \times 7$ — which prime is unpaired?'

  5:
    answer: B
    steps:
      - 'A fraction inside a fraction can look messy. We''ll tidy it into one fraction, then flip it.'
      - 'Remember what a reciprocal is: 1 divided by the number — for a fraction $\tfrac{a}{b}$ it is $\tfrac{b}{a}$. So first reduce the whole expression to a single fraction.'
      - 'Start with the denominator: $\tfrac{1}{2} + \tfrac{1}{3}$. The common denominator is 6, so this is $\tfrac{3}{6} + \tfrac{2}{6} = \tfrac{5}{6}$.'
      - 'The expression is now $\dfrac{2/3}{5/6}$, which means $\tfrac{2}{3} \div \tfrac{5}{6}$.'
      - 'Dividing by a fraction is multiplying by its reciprocal: $\tfrac{2}{3} \times \tfrac{6}{5} = \tfrac{12}{15} = \tfrac{4}{5}$.'
      - 'Now for the step the question actually asks for. The reciprocal of $\tfrac{4}{5}$ is $\tfrac{5}{4}$.'
      - 'Quick check: $\tfrac{4}{5} \times \tfrac{5}{4} = 1$ ✓ — a number times its reciprocal is always 1.'
      - 'The trap is option A, $\tfrac{4}{5}$ — the value of the expression, correct as far as it goes but missing the final step the question asks for. So finish the job: simplify, then flip.'
    hint: 'Simplify it to $\tfrac{4}{5}$ first, then invert.'

  6:
    answer: B
    steps:
      - 'Sharing problems like this turn on one little word: "remainder". Let''s follow the oranges carefully.'
      - 'The second boy''s share is a fraction of what remains, so we track the fractions of the whole step by step.'
      - 'After the first boy takes $\tfrac{1}{3}$, the remainder is $\tfrac{2}{3}$ of the oranges.'
      - 'The second takes $\tfrac{2}{3}$ of that: $\tfrac{2}{3} \times \tfrac{2}{3} = \tfrac{4}{9}$ of the whole.'
      - 'The third gets whatever is left: $1 - \tfrac{1}{3} - \tfrac{4}{9} = \tfrac{9 - 3 - 4}{9} = \tfrac{2}{9}$.'
      - 'Now use the 12. So $\tfrac{2}{9}$ of the oranges is 12, making $\tfrac{1}{9}$ equal to 6, and the whole $9 \times 6 = 54$.'
      - 'Let''s check: $18$, then $\tfrac{2}{3}$ of 36 is 24, then 12 — and $18 + 24 + 12 = 54$ ✓.'
      - 'The trap is reading "$\tfrac{2}{3}$ of the remainder" as $\tfrac{2}{3}$ of the whole, which leaves nothing for the third boy at all. Always ask: a fraction of what?'
    hint: 'Work out what fraction the third boy gets — it''s $\tfrac{2}{9}$ of the whole.'

  7:
    answer: B
    steps:
      - 'This is a substitution question, and the danger is all in the minus signs. Let''s go slowly.'
      - 'Substitute each value in brackets and keep careful track of the signs, since two of the four values are negative.'
      - 'Start with the numerator: $P - Q + 2S = 18 - 21 + 2(-4)$.'
      - 'Work it through: $18 - 21 = -3$ and $2(-4) = -8$, so the numerator is $-3 - 8 = -11$.'
      - 'Now the denominator: $R^{3} = (-6)^{3} = (-6)(-6)(-6)$. The first two give $+36$, and $36 \times (-6) = -216$.'
      - 'Watch this part carefully: an odd power of a negative number stays negative — that is the key sign here.'
      - 'So the value is $\dfrac{-11}{-216} = \dfrac{11}{216}$, since a negative divided by a negative is positive.'
      - 'The trap is option A, $-\tfrac{11}{216}$, from taking $(-6)^{3}$ as $+216$. Squaring removes a minus sign; cubing keeps it — hold on to that and these become much safer.'
    hint: 'The numerator comes to $-11$; think about what $(-6)^{3} = -216$ does to the sign.'

  8:
    answer: A
    steps:
      - 'All those small decimals look fiddly, but standard form tames them. Let''s split digits from powers of ten.'
      - 'First, write every decimal in standard form so that the digits and the powers of ten can be handled separately.'
      - 'Start with the numerator: $3 \times 10^{-2} \times 4 \times 6.4 \times 10^{-4}$. The digits give $3 \times 4 \times 6.4 = 76.8$, the powers give $10^{-6}$: so $7.68 \times 10^{-5}$.'
      - 'Now the denominator: $4.8 \times 10^{-1} \times 1.2 \times 10^{-2}$. The digits give $5.76$, the powers $10^{-3}$: so $5.76 \times 10^{-3}$.'
      - 'Then divide. The digits: $7.68 \div 5.76 = 1.333\ldots$ The powers: $10^{-5} \div 10^{-3} = 10^{-2}$.'
      - 'So the value is $1.33 \times 10^{-2}$, which to two significant figures is $1.3 \times 10^{-2}$ (it is exactly $\tfrac{1}{75}$).'
      - 'The trap is option C, $7.5 \times 10^{1}$ — the fraction upside down, $\tfrac{0.00576}{0.0000768} = 75$. Keep the top on top and standard form does the rest.'
    hint: 'Get the numerator to $7.68 \times 10^{-5}$ and the denominator to $5.76 \times 10^{-3}$.'

  9:
    answer: B
    steps:
      - 'Simple interest questions all come back to one formula. Once it''s rearranged, the rest is arithmetic.'
      - 'Here it is: simple interest grows by the same amount each year, $I = \dfrac{PRT}{100}$, where $P$ is the principal, $R$ the rate per year and $T$ the time in years.'
      - 'We want the rate, so rearrange: $R = \dfrac{100I}{PT}$.'
      - 'Now substitute. Here $I = 55$, $P = 150$ and $T = 5$, so $R = \dfrac{100 \times 55}{150 \times 5} = \dfrac{5500}{750}$.'
      - 'Simplify: dividing top and bottom by 250 gives $\dfrac{22}{3} = 7\tfrac{1}{3}$.'
      - 'So the rate is $7\tfrac{1}{3}\%$ per annum.'
      - 'Let''s check: $7\tfrac{1}{3}\%$ of ₦150 is $150 \times \tfrac{22}{300} = ₦11$ a year, and $5 \times 11 = ₦55$ ✓.'
      - 'The trap is option A, 11% — the yearly interest in naira (₦11) mistaken for the percentage rate. Option C, 5%, confuses the 5 years with the rate. Keep naira and percent apart and you''ll be fine.'
    hint: 'Rearrange for the rate: $R = \tfrac{100 \times 55}{150 \times 5}$.'

  10:
    answer: B
    steps:
      - 'Ratio sharing is all about the size of one part. Find that, and everything else follows.'
      - 'Bisi has 2 parts and received 5 pencils, so one part is $5 \div 2 = 2.5$ pencils.'
      - 'Now count the parts in total. The whole ratio $2 : 3 : 5$ has $2 + 3 + 5 = 10$ parts.'
      - 'So the total is $10 \times 2.5 = 25$ pencils.'
      - 'A quick check: Sola gets $3 \times 2.5 = 7.5$ and Tunde $12.5$ — fractions of a pencil, which is odd, but the question only asks for the total, and $5 + 7.5 + 12.5 = 25$ ✓.'
      - 'The trap is option D, 50 — treating Bisi''s 5 as one part instead of two. Always find the size of one part first.'
    hint: 'Bisi''s 2 parts are 5 pencils; how many parts make the whole?'

  11:
    answer: C
    steps:
      - 'Two facts about two ages — that''s two equations. Let''s write them down and solve.'
      - 'The two conditions give us $x - y = 6$ and $xy = 187$.'
      - 'From the first, $x = y + 6$. Substituting: $y(y + 6) = 187$, so $y^{2} + 6y - 187 = 0$.'
      - 'Now factorise: two numbers multiplying to $-187$ and adding to 6 are 17 and $-11$. So $(y + 17)(y - 11) = 0$.'
      - 'Ages are positive, so $y = 11$ and $x = 17$.'
      - 'Let''s check: $17 - 11 = 6$ and $17 \times 11 = 187$ ✓.'
      - 'By the way, there''s a quicker road to the same answer: $187 = 11 \times 17$ is the only factor pair differing by 6.'
      - 'The trap is option D, (18, 12), which differs by 6 but has product 216, not 187. Both conditions must hold, so always test an option against every fact given.'
    hint: 'Look for two factors of 187 that differ by 6.'

  12:
    answer: B
    steps:
      - 'Age problems get much friendlier once you spot the one thing that never changes. Let''s find it.'
      - 'Here it is: the difference in two people''s ages never changes. That fixed difference is the key.'
      - 'In 1984 the father was $45 - 24 = 21$ years older than Ike, and he always will be.'
      - 'Now, Ike is half his father''s age when the father is twice Ike''s age: $F = 2I$ and $F - I = 21$, so $I = 21$.'
      - 'Ike was 24 in 1984, so he was 21 three years earlier, in 1981.'
      - 'Let''s check: in 1981 Ike was 21 and his father 42, and $21 = \tfrac{1}{2} \times 42$ ✓.'
      - 'The trap is halving 45 to get 22.5 and working from that. The father''s age changes too, so both ages must move back together. Hold on to the fixed gap and these fall into place.'
    hint: 'The age gap is always 21. How old is Ike when he is half his father''s age?'

  13:
    answer: D
    steps:
      - 'Surds in the denominator are the scary part here, but they cancel beautifully. Let''s see how.'
      - 'Combine the two fractions over their product first; the denominators are conjugates, so their product has no surd.'
      - 'Multiply them out: $(\sqrt{5} + \sqrt{3})(\sqrt{5} - \sqrt{3}) = 5 - 3 = 2$.'
      - 'Now the numerator: $(\sqrt{5} - \sqrt{3}) - (\sqrt{5} + \sqrt{3}) = -2\sqrt{3}$.'
      - 'So the bracket equals $\dfrac{-2\sqrt{3}}{2} = -\sqrt{3}$.'
      - 'Last, multiply by $\dfrac{1}{\sqrt{3}}$: $-\sqrt{3} \times \dfrac{1}{\sqrt{3}} = -1$.'
      - 'A numerical check backs this up: $\tfrac{1}{3.968} - \tfrac{1}{0.504} \approx 0.252 - 1.984 = -1.732$, and $-1.732 \div 1.732 = -1$ ✓.'
      - 'The trap is option C, $-2$, from forgetting to divide by the denominator product 2 — or the sign slip that gives $+1$. Conjugates are your friend: they turn surds into whole numbers.'
    hint: 'Combine the fractions — the bracket simplifies to $-\sqrt{3}$.'

  14:
    answer: B
    steps:
      - 'Several logs of the same base can be squeezed into one. That''s the move that unlocks this question.'
      - 'Remember the laws: a sum of logs becomes the log of a product, a difference the log of a quotient.'
      - 'So $\log_{2}4 + \log_{2}7 - \log_{2}n = \log_{2}\dfrac{4 \times 7}{n} = \log_{2}\dfrac{28}{n}$.'
      - 'That leaves a single equation: $\log_{2}\dfrac{28}{n} = 1$.'
      - 'Now undo the logarithm: $\log_{2}X = 1$ means $X = 2^{1} = 2$. So $\dfrac{28}{n} = 2$.'
      - 'Therefore $n = \dfrac{28}{2} = 14$.'
      - 'Let''s check term by term: $\log_{2}4 = 2$, and $\log_{2}14 = \log_{2}2 + \log_{2}7 = 1 + \log_{2}7$; so the left side is $2 + \log_{2}7 - 1 - \log_{2}7 = 1$ ✓.'
      - 'The trap is option D, 28, which would give $\log_{2}1 = 0$ — setting the quotient to 1 instead of 2. Undo the log carefully and it works out.'
    hint: 'Try combining into $\log_{2}\tfrac{28}{n} = 1$, so $\tfrac{28}{n} = 2$.'

  15:
    answer: B
    steps:
      - 'Fractional indices look frightening, but every number here is secretly a power of 3. Let''s use that.'
      - 'The plan: write every number as a power of 3, then add and subtract the indices.'
      - 'So $9^{1/3} = (3^{2})^{1/3} = 3^{2/3}$ and $27^{-1/2} = (3^{3})^{-1/2} = 3^{-3/2}$.'
      - 'Now the numerator is $3^{2/3 - 3/2} = 3^{-5/6}$, since $\tfrac{2}{3} - \tfrac{3}{2} = \tfrac{4 - 9}{6} = -\tfrac{5}{6}$.'
      - 'And the denominator is $3^{-1/6 - 2/3} = 3^{-5/6}$, since $-\tfrac{1}{6} - \tfrac{4}{6} = -\tfrac{5}{6}$.'
      - 'Look at that — numerator and denominator are equal, so the fraction is $3^{0} = 1$.'
      - 'The trap is option C, 3, from a slip in the fractional indices — adding $\tfrac{2}{3}$ and $\tfrac{3}{2}$ over an unlike denominator. Common denominators are essential with fractional indices, so take your time there.'
    hint: 'Write everything as a power of 3; top and bottom both come to $3^{-5/6}$.'

  16:
    answer: D
    steps:
      - 'Variation questions always start the same way: turn the words into an equation with a constant. Let''s do that.'
      - '"$x$ varies directly as $y^{3}$" means $x$ is a fixed multiple of $y^{3}$: $x = ky^{3}$ for some constant $k$.'
      - 'Next, find the constant from the given pair. With $x = 2$ and $y = 1$: $2 = k \times 1^{3} = k$, so $k = 2$.'
      - 'The rule is therefore $x = 2y^{3}$.'
      - 'Now use it. When $y = 5$: $y^{3} = 125$, so $x = 2 \times 125 = 250$.'
      - 'A sense check through scale factors: $y$ went up five times, so $y^{3}$ — and therefore $x$ — went up $5^{3} = 125$ times, from 2 to 250 ✓.'
      - 'The trap is option C, 125, which is $y^{3}$ with the constant $k = 2$ forgotten; option B, 10, treats the variation as direct in $y$ rather than $y^{3}$. Find $k$ first, every time.'
    hint: 'Find the constant first — the rule is $x = 2y^{3}$.'

  17:
    answer: B
    steps:
      - 'This factorisation hides a well-known pattern: a sum of two cubes. Let''s uncover it.'
      - 'First take out the common factor $a$: $8a + 125ax^{3} = a(8 + 125x^{3})$.'
      - 'Now look inside the bracket. It is a sum of two cubes: $8 = 2^{3}$ and $125x^{3} = (5x)^{3}$.'
      - 'Here''s the rule to use: $p^{3} + q^{3} = (p + q)(p^{2} - pq + q^{2})$.'
      - 'With $p = 2$ and $q = 5x$: $(2 + 5x)(4 - 10x + 25x^{2})$.'
      - 'So the complete factorisation is $a(2 + 5x)(4 - 10x + 25x^{2})$.'
      - 'Let''s check with $x = 1$, $a = 1$: the original is $8 + 125 = 133$, and $7 \times (4 - 10 + 25) = 7 \times 19 = 133$ ✓.'
      - 'The trap is option D, whose quadratic factor has $+10ax$. In a sum of cubes the middle term of the quadratic is always negative — a small sign, but it decides the answer.'
    hint: 'Take out $a$ first, then use the sum of cubes with $2$ and $5x$.'

  18:
    answer: A
    steps:
      - 'Putting a negative number into fractions is where signs go astray. We''ll take it one fraction at a time.'
      - 'Substituting a negative number calls for brackets and care with signs, so take each fraction on its own before adding.'
      - 'First fraction: $\dfrac{x}{x - 3}$ at $x = -2$ is $\dfrac{-2}{-2 - 3} = \dfrac{-2}{-5}$.'
      - 'A negative divided by a negative is positive, so this is $\dfrac{2}{5}$.'
      - 'Now the second fraction: $\dfrac{x}{x + 4}$ at $x = -2$ is $\dfrac{-2}{-2 + 4} = \dfrac{-2}{2} = -1$.'
      - 'Add the two: $\dfrac{2}{5} + (-1) = \dfrac{2}{5} - \dfrac{5}{5} = -\dfrac{3}{5}$.'
      - 'Let''s check by combining first: $y = \dfrac{x(x + 4) + x(x - 3)}{(x - 3)(x + 4)} = \dfrac{2x^{2} + x}{(x - 3)(x + 4)}$; at $x = -2$ this is $\dfrac{8 - 2}{(-5)(2)} = \dfrac{6}{-10} = -\dfrac{3}{5}$ ✓.'
      - 'The trap is option B, $+\tfrac{3}{5}$, from treating $\tfrac{-2}{-5}$ as negative; option C, $-\tfrac{7}{5}$, comes from taking it as $-\tfrac{2}{5}$ and then subtracting 1. Brackets around negatives keep you safe.'
    hint: 'Work out each fraction separately — they come to $\tfrac{2}{5}$ and $-1$.'

  19:
    answer: D
    steps:
      - 'Don''t worry about the fractions in this inequality — we''ll clear them in one move and it gets much easier.'
      - 'Multiply every term by 15, the L.C.M. of 3 and 5 — a positive number, so the inequality sign is unchanged.'
      - 'That gives $5(x + 1) - 15 > 3(x + 4)$.'
      - 'Now expand: $5x + 5 - 15 > 3x + 12$, that is $5x - 10 > 3x + 12$.'
      - 'Collect the $x$ terms: $2x > 22$, so $x > 11$.'
      - 'Let''s check $x = 14$: $\tfrac{15}{3} - 1 = 4$ and $\tfrac{18}{5} = 3.6$, and $4 > 3.6$ ✓. At $x = 11$ both sides equal 3, the boundary.'
      - 'The trap is option A, $x < 11$ — reversing the sign without cause. The sign flips only when multiplying or dividing by a negative number, so keep it steady here.'
    hint: 'Try multiplying through by 15 to clear the fractions.'

  20:
    answer: D
    steps:
      - 'Four terms and no factor common to all of them — that''s a signal to group them in pairs. Let''s do it.'
      - 'Factorising by grouping means pairing the terms so that each pair shares something.'
      - 'Rearrange so the $x^{2}$ term sits with the $ax$ term: $(x^{2} + ax) + (2x + 2a)$.'
      - 'The first pair has $x$ in common: $x(x + a)$.'
      - 'The second pair has 2 in common: $2(x + a)$.'
      - 'Now both contain the bracket $(x + a)$, which comes out: $(x + a)(x + 2)$.'
      - 'Let''s check by expanding: $(x + 2)(x + a) = x^{2} + ax + 2x + 2a$ ✓, the original four terms.'
      - 'The trap is option A, $(x + 2a)(x + 1)$, which keeps the $2a$ together; it expands to $x^{2} + x + 2ax + 2a$, giving $2ax$ where $ax$ is needed. Expanding your answer is always a quick safety net.'
    hint: 'Try grouping as $x(x + a) + 2(x + a)$.'

  21:
    answer: B
    steps:
      - 'When a quadratic won''t factorise neatly, the formula always works. Let''s use it carefully.'
      - 'Use $x = \dfrac{-b \pm \sqrt{b^{2} - 4ac}}{2a}$ with $a = 3$, $b = 6$, $c = -2$.'
      - 'Start with the discriminant: $b^{2} - 4ac = 36 + 24 = 60$.'
      - 'Simplify the root: $\sqrt{60} = \sqrt{4 \times 15} = 2\sqrt{15}$.'
      - 'So $x = \dfrac{-6 \pm 2\sqrt{15}}{6} = -1 \pm \dfrac{\sqrt{15}}{3}$.'
      - 'Let''s check numerically. The roots are about $0.29$ and $-2.29$; check $x = 0.29$: $3(0.084) + 1.74 - 2 \approx 0$ ✓.'
      - 'The trap is the sign of $-4ac$: with $c$ negative it is $+24$. Using $36 - 24 = 12$ gives the $\sqrt{3}$ of options A and C. Watch the sign of $c$ and the formula looks after you.'
    hint: 'Work out the discriminant carefully: $36 + 24 = 60$.'

  22:
    answer: D
    steps:
      - 'Adding algebraic fractions is just like adding ordinary ones — we need a common denominator. Let''s find it.'
      - 'Factorise each denominator to see what they share.'
      - 'We get $5x + 5 = 5(x + 1)$ and $7x + 7 = 7(x + 1)$.'
      - 'So the common denominator is $35(x + 1)$.'
      - 'Rewrite and add: $\dfrac{7}{35(x + 1)} + \dfrac{5}{35(x + 1)} = \dfrac{12}{35(x + 1)}$.'
      - 'Multiplied out, $35(x + 1) = 35x + 35$, which is how option D writes it.'
      - 'Quick check with $x = 0$: $\tfrac{1}{5} + \tfrac{1}{7} = \tfrac{12}{35}$ ✓.'
      - 'The trap is option C, which puts an $x$ into the numerator; adding two fractions with numerator 1 cannot create one. Factorise first and the common denominator shows itself.'
    hint: 'Factorise the bottoms — the common denominator is $35(x + 1)$.'

  23:
    answer: D
    steps:
      - 'Finding where a curve cuts the axes comes down to two simple substitutions. Let''s do each.'
      - 'Remember: a curve meets the $y$-axis where $x = 0$ and the $x$-axis where $y = 0$.'
      - 'First, at $x = 0$: $y = 4$, giving the point $(0, 4)$.'
      - 'Now at $y = 0$: $-x^{2} + 3x + 4 = 0$, or $x^{2} - 3x - 4 = 0$, which factorises as $(x - 4)(x + 1) = 0$.'
      - 'So $x = 4$ or $x = -1$, giving $(4, 0)$ and $(-1, 0)$.'
      - 'Putting it together, the three points are $(0, 4)$, $(4, 0)$ and $(-1, 0)$.'
      - 'The trap is option A, which includes $(0, 0)$. The curve passes through the origin only if the constant term is zero; here it is 4. So glance at the constant before trusting the origin.'
    hint: 'Put $x = 0$ for the $y$-intercept, and $y = 0$ for the roots.'

  24:
    answer: C
    steps:
      - 'Two squared brackets with a minus between them — that''s a difference of two squares. Let''s use it.'
      - 'The rule is $A^{2} - B^{2} = (A - B)(A + B)$, with $A = 4a + 3$ and $B = 3a - 2$.'
      - 'Watch this part carefully: $A - B = 4a + 3 - 3a + 2 = a + 5$. Note the minus changes both signs in $B$.'
      - 'The other bracket is easier: $A + B = 4a + 3 + 3a - 2 = 7a + 1$.'
      - 'So the factorisation is $(a + 5)(7a + 1)$.'
      - 'Let''s check with $a = 0$: $9 - 4 = 5$, and $5 \times 1 = 5$ ✓.'
      - 'The trap is option B, $(a - 5)(7a - 1)$, which comes from subtracting $B$ without changing the sign of its $-2$. Put $B$ in brackets before you subtract and the signs look after themselves.'
    hint: 'It''s a difference of squares with $A = 4a + 3$, $B = 3a - 2$.'

  25:
    answer: B
    steps:
      - 'Equations with unknowns up in the powers need a common base. Once we have it, we can just compare the powers.'
