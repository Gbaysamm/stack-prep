      - 'So $1 + \tan^{2}\theta = \sec^{2}\theta = \dfrac{b^{2}}{a^{2}}$.'
      - 'Check with a triangle: adjacent $a$, hypotenuse $b$, opposite $\sqrt{b^{2} - a^{2}}$. Then $\tan^{2}\theta = \dfrac{b^{2} - a^{2}}{a^{2}}$, and adding 1 gives $\dfrac{b^{2} - a^{2} + a^{2}}{a^{2}} = \dfrac{b^{2}}{a^{2}}$ ✓.'
      - 'The trap is option B, $\tfrac{a^{2}}{b^{2}}$, which is $\cos^{2}\theta$ — the reciprocal of the answer. Since $1 + \tan^{2}\theta$ is at least 1, and $\tfrac{a}{b}$ is at most 1, only the fraction with $b$ on top can be right.'
