# UTME 1987 Mathematics — worked explanations, written against the paper.
#
# Keyed on question number; see explanations_2003.yaml for why, and for how these are written.
#
# All 50 are answered. Of the 29 the key covers, 28 agree; Q20 differs, and
# retranscribed_1987.yaml sets out why. Q11 and Q12 rest on rebuilt stems, which their notes
# say plainly.
format_version: 1
exam_year: 1987
subject: MATH

explanations:
  1:
    answer: B
    steps:
      - 'Changing between two bases that are not ten is done in two stages: first into base ten, then out of it into the new base.'
      - 'In base 5 the place values, from the right, are 1, 5 and 25. So $241_{5} = 2 \times 25 + 4 \times 5 + 1 \times 1 = 50 + 20 + 1 = 71$.'
      - 'Now write 71 in base 8 by dividing repeatedly by 8 and keeping the remainders.'
      - '$71 \div 8 = 8$ remainder 7; $8 \div 8 = 1$ remainder 0; $1 \div 8 = 0$ remainder 1.'
      - 'Reading the remainders from the last one upwards gives $107_{8}$.'
      - 'Check: $107_{8} = 1 \times 64 + 0 \times 8 + 7 = 71$ ✓.'
      - 'The trap is option A, $71_{8}$ — the base-ten value 71 with a subscript 8 stuck on. The digits must be recalculated, not relabelled; $71_{8}$ is really $57$.'
    hint: 'Convert $241_{5}$ to base ten (71) first, then divide by 8.'

  2:
    answer: B
    steps:
      - 'A rod that can be cut exactly into 40 cm strips has a length that is a multiple of 40; the same rod cut into 48 cm strips must be a multiple of 48. The least such length is the lowest common multiple.'
      - 'Factorise: $40 = 2^{3} \times 5$ and $48 = 2^{4} \times 3$.'
      - 'The LCM takes each prime to its highest power: $2^{4} \times 3 \times 5 = 16 \times 15 = 240$.'
      - 'Check: $240 \div 40 = 6$ strips and $240 \div 48 = 5$ strips, both exact ✓.'
      - 'Option A, 120, fails: $120 \div 48 = 2.5$, not a whole number of strips.'
      - 'The trap is options C and D, which are common multiples (480 is) but not the *least* one. Or reaching for the H.C.F., 8, which answers a different question — the longest strip that fits both.'
    hint: 'Find the L.C.M. of 40 and 48.'

  3:
    answer: D
    steps:
      - 'The area is in square yards but the length is in metres, so both must be put into the same unit before dividing.'
      - 'Convert the length to yards: 1 m is 1.1 yd, so 50 m is $50 \times 1.1 = 55$ yd.'
      - 'Width in yards $= \dfrac{\text{area}}{\text{length}} = \dfrac{1815}{55} = 33$ yd.'
      - 'The answer is wanted in metres, so convert back: $33 \div 1.1 = 30$ m.'
      - 'Check: $50 \text{ m} \times 30 \text{ m} = 1500\ \text{m}^{2}$, and one square metre is $1.1^{2} = 1.21$ square yards, so $1500 \times 1.21 = 1815$ ✓.'
      - 'The trap is option C, 33 — the width in yards, correct as a number but in the wrong unit. The question asks for metres.'
    hint: 'Change 50 m to yards, divide, then change the answer back to metres.'

  4:
    answer: C
    steps:
      - 'The instruction is to round every number *first*, then calculate — so round each to two significant figures before doing any arithmetic.'
      - '$0.02174$ to 2 s.f.: the first significant figures are 2 and 1, and the next digit is 7, so it rounds up to $0.022$.'
      - '$1.2047$ to 2 s.f. is $1.2$, since the next digit, 0, does not round up.'
      - '$0.023789$ to 2 s.f.: the figures are 2 and 3, the next is 7, so it becomes $0.024$.'
      - 'Now evaluate: $\dfrac{0.022 \times 1.2}{0.024} = \dfrac{0.0264}{0.024} = 1.1$.'
      - 'For comparison, the unrounded value is about $1.10$ too — rounding first changes little here.'
      - 'The trap is rounding $0.02174$ down to $0.021$, which gives $\tfrac{0.0252}{0.024} = 1.05$. Rounding looks at the digit *after* the last one kept, and 7 rounds up.'
    hint: 'Round each number to 2 s.f. first: 0.022, 1.2 and 0.024.'

  5:
    answer: B
    steps:
      - 'Average speed is always total distance divided by total time — never the average of the two speeds, because the slower leg takes longer.'
      - 'Let the distance $PQ$ be $d$ km. The whole journey is $2d$ km.'
      - 'The time out is $\dfrac{d}{90}$ hours and the time back is $\dfrac{d}{45} = \dfrac{2d}{90}$ hours.'
      - 'Total time $= \dfrac{d}{90} + \dfrac{2d}{90} = \dfrac{3d}{90} = \dfrac{d}{30}$ hours.'
      - 'Average speed $= \dfrac{2d}{d/30} = 2 \times 30 = 60$ km/h.'
      - 'Check with a real distance, say 90 km: 1 hour out, 2 hours back, 180 km in 3 hours = 60 km/h ✓.'
      - 'The trap is option C, 67.5 km/h — the simple average $\tfrac{90 + 45}{2}$. The train spends twice as long at the slow speed, which drags the average down.'
    hint: 'Pick a convenient distance and divide total distance by total time.'

  6:
    answer: D
    steps:
      - 'Percentage changes to length and width multiply together to give the change in area, so work with the scale factors.'
      - 'Let the square have side $s$, so its area is $s^{2}$.'
      - 'The length becomes $1.2s$ (a 20% increase) and the width $0.8s$ (a 20% decrease).'
      - 'The rectangle''s area is $1.2s \times 0.8s = 0.96s^{2}$.'
      - 'So the ratio of rectangle to square is $0.96 : 1 = 96 : 100 = 24 : 25$.'
      - 'The trap is assuming the changes cancel — a 20% rise and a 20% fall do not return you to the start, because the fall is taken from a bigger number. The area drops by 4%. Option B, 25 : 24, is the ratio upside down.'
    hint: 'Multiply the scale factors 1.2 and 0.8.'

  7:
    answer: A
    steps:
      - 'Profit is what is left after the money invested is recovered, so find it first.'
      - 'Profit $= ₦15{,}000 - ₦5{,}000 = ₦10{,}000$.'
      - 'The ratio $2 : 3$ has $2 + 3 = 5$ parts, so each part is $10{,}000 \div 5 = ₦2{,}000$.'
      - 'The shares are $2 \times 2000 = ₦4{,}000$ and $3 \times 2000 = ₦6{,}000$.'
      - 'The difference is $6000 - 4000 = ₦2{,}000$ — exactly one part, since the ratio terms differ by 1.'
      - 'The trap is sharing the whole ₦15,000 instead of the profit: the parts would be ₦3,000 and the difference ₦3,000, not offered. Options B and C are the two shares themselves.'
    hint: 'Profit is ₦10,000; the shares differ by one of the five parts.'

  8:
    answer: A
    steps:
      - 'An average multiplied by the number of weeks gives the total, so work with totals.'
      - 'A year has 52 weeks, and $20 + 24 + 8 = 52$ ✓. The whole-year total is $52 \times ₦30 = ₦1{,}560$.'
      - 'The first 20 weeks earn $20 \times 20 = ₦400$.'
      - 'The next 24 weeks earn $24 \times 36 = ₦864$.'
      - 'So the remaining 8 weeks must earn $1560 - 400 - 864 = ₦296$.'
      - 'The average for those weeks is $296 \div 8 = ₦37$.'
      - 'The trap is option C, ₦30 — assuming the remaining weeks simply match the yearly average. The early weeks were paid below ₦30, so the late ones must be above it to compensate.'
    hint: 'Year total $52 \times 30$; subtract the first two periods and divide by 8.'

  9:
    answer: B
    steps:
      - 'With simple interest, the amount is the principal plus the interest: $A = P + \dfrac{PRT}{100} = P\left(1 + \dfrac{RT}{100}\right)$.'
      - 'Here $R = 4$ and $T = 3$, so $\dfrac{RT}{100} = 0.12$ and $A = 1.12P$.'
      - 'The amount is ₦7,000, so $1.12P = 7000$ and $P = \dfrac{7000}{1.12} = ₦6{,}250$.'
      - 'Check: interest is $6250 \times 0.04 \times 3 = ₦750$, and $6250 + 750 = 7000$ ✓.'
      - 'The trap is option C, ₦6,160 — taking 12% *of the ₦7,000* off it ($7000 - 840$). The interest is 12% of the unknown principal, not of the final amount.'
    hint: 'The amount is 1.12 times the principal.'

  10:
    answer: C
    steps:
      - 'Percentage profit or loss is always measured against the cost price, so find the cost first.'
      - 'Selling at ₦1.35 gives an 8% profit, so ₦1.35 is 108% of the cost: $1.08C = 1.35$.'
      - 'So $C = \dfrac{1.35}{1.08} = ₦1.25$.'
      - 'Selling for ₦1.10 is below cost, a loss of $1.25 - 1.10 = ₦0.15$.'
      - 'As a percentage of the cost: $\dfrac{0.15}{1.25} \times 100 = 12\%$ loss.'
      - 'The trap is measuring the loss against ₦1.35 or ₦1.10 instead of the cost, which gives about 11% or 14%. Profit and loss percentages are always based on cost price.'
    hint: 'Cost $= 1.35 \div 1.08$; then compare ₦1.10 with it.'

  11:
    answer: B
    steps:
      - 'Work problems are solved by measuring the job in a common unit — here, the work one boy does in an hour (a "boy-hour").'
      - 'Boys work at a quarter of a girl''s rate, so one girl does the work of 4 boys.'
      - 'Four boys and eight girls are therefore worth $4 + 8 \times 4 = 36$ boys.'
      - 'They take 5 hours, so the field needs $36 \times 5 = 180$ boy-hours of work.'
      - 'To finish in 3 hours with boys alone: $\dfrac{180}{3} = 60$ boys.'
      - 'A sense check: fewer hours need more workers, and boys are slow workers, so a large number is expected ✓.'
      - 'The trap is option A, 180 — the total boy-hours, not yet divided by the 3 hours available.'
    hint: 'Convert everyone to boys (a girl = 4 boys), find the boy-hours, divide by 3.'

  12:
    answer: A
    steps:
      - 'Fractional indices have two parts: the denominator is a root and the numerator is a power. It is easiest to take the root first.'
      - '$125^{4/3}$: the cube root of 125 is 5, and $5^{4} = 625$.'
      - '$16^{3/4}$: the fourth root of 16 is 2, and $2^{3} = 8$.'
      - 'So the expression is $\dfrac{625}{8}$.'
      - 'Taking the root first keeps the numbers small: $125^{4}$ is over 244 million, whose cube root would be hard to find by hand.'
      - 'The trap is option B, $\tfrac{8}{625}$, the fraction upside down, and option D, 8, which is only the denominator.'
    hint: 'Cube root of 125, then fourth power; fourth root of 16, then cube.'

  13:
    answer: B
    steps:
      - 'First find the value both ways, then subtract, then write the difference in standard form.'
      - '$\tfrac{35}{6} = 5.8333\ldots$, with the 3 recurring.'
      - 'To 3 significant figures: 5, 8, 3 — the next digit is 3, so it stays $5.83$.'
      - 'To 3 decimal places: $5.833$.'
      - 'The error is $5.833 - 5.83 = 0.003$.'
      - 'Standard form writes a number as $A \times 10^{n}$ with $1 \le A < 10$: $0.003 = 3.0 \times 10^{-3}$.'
      - 'The trap is option A, 0.003 — the right number, but not in standard form, which is what the question asks for. Option D, $0.3 \times 10^{-3}$, is only $0.0003$, and its front number is below 1 anyway.'
    hint: '$5.833 - 5.83$, then write it as $A \times 10^{n}$.'

  14:
    answer: A
    steps:
      - 'Simplify the top and bottom separately using the laws of logarithms.'
      - 'Numerator: $\log_{2}6 - \log_{2}3 = \log_{2}\tfrac{6}{3} = \log_{2}2 = 1$.'
      - 'Denominator: $\log_{2}8 = 3$, since $2^{3} = 8$.'
      - '$\log_{2}\tfrac{1}{2} = -1$, since $2^{-1} = \tfrac{1}{2}$, so $2\log_{2}\tfrac{1}{2} = -2$.'
      - 'The denominator is $3 - (-2) = 5$.'
      - 'So the expression is $\dfrac{1}{5}$.'
      - 'The trap is option C, $-\tfrac{1}{2}$ or similar, from treating $\log_{2}\tfrac{1}{2}$ as positive — the denominator would then be $3 - 2 = 1$, giving 1. The log of a number below 1 is negative.'
    hint: 'Numerator is $\log_{2}2 = 1$; $\log_{2}\tfrac{1}{2} = -1$.'

  15:
    answer: D
    steps:
      - 'Multiply the whole numbers together and the surds together, then simplify.'
      - 'Numerator: $2 \times 3 = 6$ and $\sqrt{14} \times \sqrt{21} = \sqrt{294}$. Since $294 = 49 \times 6$, $\sqrt{294} = 7\sqrt{6}$. So the numerator is $42\sqrt{6}$.'
      - 'Denominator: $7 \times 2 = 14$ and $\sqrt{24} \times \sqrt{98} = \sqrt{2352}$. Since $2352 = 784 \times 3$ and $784 = 28^{2}$, $\sqrt{2352} = 28\sqrt{3}$. So the denominator is $392\sqrt{3}$.'
      - 'The fraction is $\dfrac{42\sqrt{6}}{392\sqrt{3}}$. Now $\tfrac{\sqrt{6}}{\sqrt{3}} = \sqrt{2}$ and $\tfrac{42}{392} = \tfrac{3}{28}$.'
      - 'So the result is $\dfrac{3\sqrt{2}}{28}$.'
      - 'Numerical check: the original is $\tfrac{6 \times 17.15}{14 \times 48.50} \approx 0.1515$, and $\tfrac{3 \times 1.414}{28} \approx 0.1515$ ✓.'
      - 'The trap is option C, $\tfrac{3\sqrt{14}}{28}$ — getting the number right but not simplifying the surds against each other.'
    hint: 'Break each surd into a perfect square times a small number.'

  16:
    answer: D
    steps:
      - 'Substitute the known values first, then solve for $n$.'
      - 'With $r = \sqrt{\tfrac{1}{3}}$, $r^{2} = \tfrac{1}{3}$, so $1 - r^{2} = \tfrac{2}{3}$.'
      - 'The formula becomes $1 = \dfrac{2}{3} \times \dfrac{2/3}{n^{2}} = \dfrac{4/9}{n^{2}}$.'
      - 'So $n^{2} = \tfrac{4}{9}$.'
      - 'Taking the positive square root: $n = \tfrac{2}{3}$.'
      - 'Check: $\tfrac{2}{3} \times \tfrac{2/3}{4/9} = \tfrac{2}{3} \times \tfrac{3}{2} = 1$ ✓.'
      - 'The trap is option A, $\tfrac{3}{2}$ — the reciprocal, from solving $n^{2} = \tfrac{9}{4}$ by mixing up which side $n^{2}$ is on.'
    hint: '$1 - r^{2} = \tfrac{2}{3}$, so $n^{2} = \tfrac{4}{9}$.'

  17:
    answer: A
    steps:
      - 'Work out $a$ and $b$ first, being careful with the negative value of $v$.'
      - '$a = u^{2} - 3v^{2} = 1 - 3(1) = -2$, since $(-1)^{2} = 1$.'
      - '$b = 2uv + v^{2} = 2(1)(-1) + 1 = -1$.'
      - 'First bracket: $2a - b = -4 - (-1) = -3$.'
      - 'Second bracket: $a - b^{2} = -2 - 1 = -3$, since $(-1)^{2} = 1$.'
      - 'Product: $(-3)(-3) = 9$.'
      - 'The trap is squaring $v = -1$ as $-1$. Every even power of a negative number is positive; that slip changes both $a$ and $b$.'
    hint: '$a = -2$ and $b = -1$; then $(2a - b)(a - b^{2}) = (-3)(-3)$.'

  18:
    answer: D
    steps:
      - 'In $Q = 15 + 0.5n$, the 15 is a fixed cost and $0.5n$ grows with the number of people.'
      - 'Each extra person adds $0.5$ to $Q$ — that is the coefficient of $n$.'
      - 'So one more person costs ₦0.50 extra.'
      - 'In kobo (100 kobo to the naira): $0.50 \times 100 = 50$ kobo.'
      - 'Check: $Q(11) - Q(10) = 20.5 - 20 = 0.5$ ✓.'
      - 'The trap is including the fixed ₦15, or confusing naira and kobo — 150k and 200k both come from adding the constant in some way. The extra cost only involves the part that changes.'
    hint: 'The extra cost per person is the coefficient of $n$.'

  19:
    answer: B
    steps:
      - 'Write each variation as an equation with a constant, then substitute to remove $V$.'
      - '$P$ varies inversely as $V$: $P = \dfrac{k}{V}$.'
      - '$V$ varies directly as $R^{2}$: $V = cR^{2}$.'
      - 'Substituting: $P = \dfrac{k}{cR^{2}} = \dfrac{K}{R^{2}}$, with the constants combined into $K$.'
      - 'Use $R = 7$, $P = 2$: $2 = \dfrac{K}{49}$, so $K = 98$.'
      - 'The relationship is $P = \dfrac{98}{R^{2}}$, that is $PR^{2} = 98$.'
      - 'The trap is option A, $P = 98R^{2}$ — a direct variation, when the chain "inversely, then directly" makes $P$ inversely related to $R^{2}$.'
    hint: 'Combine $P = \tfrac{k}{V}$ and $V = cR^{2}$ into $P = \tfrac{K}{R^{2}}$.'

  20:
    answer: C
    steps:
      - 'To make $y$ the subject, isolate the term containing $y$, then undo each operation on it in reverse order.'
      - 'Subtract $x^{2}$: $Z - x^{2} = \dfrac{1}{y^{3}}$.'
      - 'Take reciprocals of both sides: $y^{3} = \dfrac{1}{Z - x^{2}}$.'
      - 'Take the cube root: $y = \dfrac{1}{(Z - x^{2})^{1/3}}$.'
      - 'Check with $x = 1$, $Z = 9$: then $\tfrac{1}{y^{3}} = 8$, so $y = \tfrac{1}{2}$; and $\tfrac{1}{8^{1/3}} = \tfrac{1}{2}$ ✓.'
      - 'The trap is option D, which takes the cube root of $Z$ and of $x^{2}$ separately. Roots do not split over subtraction: $\sqrt[3]{9 - 1} = 2$, but $\sqrt[3]{9} - \sqrt[3]{1} \approx 1.08$.'
    hint: 'Subtract $x^{2}$, flip both sides, then take the cube root of the whole bracket.'

  21:
    answer: C
    steps:
      - 'A quadratic $ax^{2} + bx + c$ is a perfect square exactly when it has one repeated root, that is when its discriminant $b^{2} - 4ac$ is zero.'
      - 'Here $a = 1$, $b = 2(m + 1)$ and $c = m + 3$.'
      - 'Set $b^{2} - 4ac = 0$: $4(m + 1)^{2} - 4(m + 3) = 0$.'
      - 'Divide by 4 and expand: $m^{2} + 2m + 1 - m - 3 = 0$, so $m^{2} + m - 2 = 0$.'
      - 'Factorise: $(m + 2)(m - 1) = 0$, so $m = 1$ or $m = -2$.'
      - 'Check $m = 1$: the function is $x^{2} + 4x + 4 = (x + 2)^{2}$ ✓. And $m = -2$: $x^{2} - 2x + 1 = (x - 1)^{2}$ ✓.'
      - 'The trap is option B, $-1, 2$ — the right numbers with both signs reversed, from solving $(m + 2)(m - 1) = 0$ carelessly.'
    hint: 'Set the discriminant $b^{2} - 4ac$ to zero.'

  22:
    answer: A
    steps:
      - 'The powers of 6 become a quadratic once $6^{2x + 1}$ is rewritten: $6^{2x + 1} = 6 \times 6^{2x} = 6(6^{x})^{2}$.'
      - 'Let $u = 6^{x}$. The expression becomes $6u^{2} - 7u - 5$.'
      - 'Factorise: two numbers multiplying to $6 \times (-5) = -30$ and adding to $-7$ are $-10$ and $3$.'
      - 'Split the middle: $6u^{2} - 10u + 3u - 5 = 2u(3u - 5) + 1(3u - 5) = (3u - 5)(2u + 1)$.'
      - 'Replace $u$ by $6^{x}$: $\{3(6^{x}) - 5\}\{2(6^{x}) + 1\}$.'
      - 'Check by expanding: $(3u - 5)(2u + 1) = 6u^{2} + 3u - 10u - 5 = 6u^{2} - 7u - 5$ ✓.'
      - 'The trap is option B, with $-1$ in the second bracket, which expands to $-13u + 5$. Only one arrangement of the signs reproduces both $-7u$ and $-5$.'
    hint: 'Write $6^{2x + 1} = 6(6^{x})^{2}$ and let $u = 6^{x}$.'

  23:
    answer: C
    steps:
      - 'With one linear and one quadratic equation, make a letter the subject of the linear one and substitute into the quadratic.'
      - 'From $x + y = 5$: $x = 5 - y$.'
      - 'Substitute: $(5 - y)^{2} - 2y^{2} = 1$, so $25 - 10y + y^{2} - 2y^{2} = 1$.'
      - 'Simplify: $-y^{2} - 10y + 24 = 0$, or $y^{2} + 10y - 24 = 0$.'
      - 'Factorise: $(y + 12)(y - 2) = 0$, so $y = -12$ or $y = 2$.'
      - 'Check $y = 2$: $x = 3$, and $9 - 8 = 1$ ✓. Check $y = -12$: $x = 17$, and $289 - 288 = 1$ ✓.'
      - 'The trap is option A, $12, -2$ — both signs reversed, from the factorisation $(y - 12)(y + 2)$, which gives $y^{2} - 10y - 24$.'
    hint: 'Substitute $x = 5 - y$ to get $y^{2} + 10y - 24 = 0$.'

  24:
    answer: A
    steps:
      - 'The rule links the number of sides to the number of diagonals: a figure with $n$ diagonals has $(n - 2)^{2}$ sides.'
      - 'A 25-sided figure therefore satisfies $(n - 2)^{2} = 25$.'
      - 'Take the square root: $n - 2 = 5$ (the negative root would give a negative $n$).'
      - 'So $n = 7$.'
      - 'Check: $(7 - 2)^{2} = 25$ ✓.'
      - 'The trap is working backwards the wrong way — taking $n = 25$ and computing $(25 - 2)^{2}$. The 25 is the number of *sides*, which is the output of the rule, not its input.'
    hint: 'Solve $(n - 2)^{2} = 25$.'

  25:
    answer: A
    steps:
      - 'A function "vanishes" where its value is zero, which on a graph is where the curve meets the horizontal axis.'
      - 'The curve crosses the $x$-axis at three points: $x = -1$, $x = 0$ and $x = 1$.'
      - 'So the function vanishes at $-1$, $0$ and $1$.'
      - 'This fits a cubic: a cubic can have at most three real roots, and here all three are visible — the function could be $f(x) = kx(x - 1)(x + 1)$.'
      - 'Options B and D describe *intervals*, where the function is negative or positive, not the individual points where it is zero.'
      - 'The trap is option B, $-1 < x < 1$ — the stretch between the outer roots, which contains the root at 0 but also every point where the curve is above or below the axis.'
    hint: '"Vanishes" means $f(x) = 0$: read where the curve crosses the $x$-axis.'

  26:
    answer: B
    steps:
      - 'Solve a linear inequality like an equation, but reverse the sign whenever you multiply or divide by a negative number.'
      - 'Expand the bracket: $x - 1 > 4x + 8$.'
      - 'Collect the $x$ terms on one side: $x - 4x > 8 + 1$, so $-3x > 9$.'
      - 'Divide by $-3$ and reverse the sign: $x < -3$.'
      - 'Check with $x = -4$: $-5 > 4(-2) = -8$ ✓. And $x = 0$ fails: $-1 > 8$ is false ✓.'
      - 'The trap is option A, $x > -3$ — dividing by $-3$ without reversing the inequality.'
    hint: 'You reach $-3x > 9$; dividing by $-3$ flips the sign.'

  27:
    answer: C
    steps:
      - 'Factorise the top and the bottom completely, then cancel common factors.'
      - 'The numerator is a difference of two squares: $x^{2} - y^{2} = (x - y)(x + y)$.'
      - 'The denominator: $2x^{2} + xy - y^{2}$. Look for $(2x + ?)(x + ?)$ — it is $(2x - y)(x + y)$, since that expands to $2x^{2} + 2xy - xy - y^{2}$ ✓.'
      - 'Cancel the common factor $(x + y)$: $\dfrac{x - y}{2x - y}$.'
      - 'Check with $x = 2$, $y = 1$: the original is $\tfrac{3}{8 + 2 - 1} = \tfrac{3}{9} = \tfrac{1}{3}$, and $\tfrac{1}{3}$ ✓.'
      - 'The trap is option D, $\tfrac{x - y}{2x + y}$, from factorising the denominator as $(2x + y)(x - y)$, which expands to $2x^{2} - xy - y^{2}$ — the wrong middle sign.'
    hint: 'Denominator is $(2x - y)(x + y)$.'

  28:
    answer: D
    steps:
      - 'A quadratic with a positive $x^{2}$ term has a lowest point, and completing the square shows where it is and how low it goes.'
      - '$x^{2} - 6x + 8 = (x - 3)^{2} - 9 + 8 = (x - 3)^{2} - 1$.'
      - 'A square is never negative, so $(x - 3)^{2} \ge 0$, and the smallest value of $y$ is when it is zero.'
      - 'So the minimum value is $-1$, reached at $x = 3$.'
      - 'By calculus: $\tfrac{dy}{dx} = 2x - 6 = 0$ at $x = 3$, and $y = 9 - 18 + 8 = -1$ ✓.'
      - 'The trap is option B, 3 — the value of $x$ where the minimum happens, not the minimum value of $y$.'
    hint: 'Complete the square: $(x - 3)^{2} - 1$.'

  29:
    answer: D
    steps:
      - 'The terms increase by 2 each time, so this is an arithmetic progression with $a = -10$ and $d = 2$.'
      - 'The sum formula is $S_{n} = \dfrac{n}{2}[2a + (n - 1)d]$.'
      - 'With $n = 21$: $2a + 20d = -20 + 40 = 20$.'
      - '$S_{21} = \dfrac{21}{2} \times 20 = 210$.'
      - 'A check: the 21st term is $-10 + 20 \times 2 = 30$, and $\tfrac{21}{2}(-10 + 30) = 210$ ✓.'
      - 'The early negative terms cancel part of the later positive ones: $-10$ to $10$ sums to zero, leaving $12 + 14 + \cdots + 30 = 210$.'
      - 'The trap is option C, 200 — using $nd$ instead of $(n - 1)d$, or counting 20 terms instead of 21.'
    hint: 'AP with $a = -10$, $d = 2$, $n = 21$.'

  30:
    answer: B
    steps:
      - 'Each term is double the one before, so this is a geometric progression with $a = 4$ and $r = 2$.'
