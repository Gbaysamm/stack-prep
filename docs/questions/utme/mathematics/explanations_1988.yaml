explanations:
  1:
    answer: C
    steps:
      - 'This one is all about the order of operations, and one little word decides it: "of". Let''s take it carefully.'
      - 'The word "of" means multiply, and it binds more tightly than division: in $2 \div \tfrac{1}{4} \text{ of } 32$, the "of" is worked out first.'
      - 'So start there: $\tfrac{1}{4}$ of 32 is $\tfrac{1}{4} \times 32 = 8$.'
      - 'That makes the denominator $2 \div 8 = \tfrac{1}{4}$.'
      - 'Now the whole fraction is $1\tfrac{1}{2} \div \tfrac{1}{4} = \tfrac{3}{2} \times 4 = 6$.'
      - 'It makes sense: dividing by a quarter is the same as multiplying by 4, so a small denominator makes a larger answer.'
      - 'The trap is working strictly left to right in the denominator: $2 \div \tfrac{1}{4} = 8$, then $8 \times 32 = 256$, giving $\tfrac{3}{2} \div 256 = \tfrac{3}{512}$ — not an option, but the same tiny size as option A, which should make you suspicious of A. "Of" must be done before the division, so remember to deal with it first.'
    hint: 'Do "$\tfrac{1}{4}$ of 32" first; the denominator becomes $2 \div 8$.'

  2:
    answer: B
    steps:
      - 'This question hides two small questions inside it. We''ll answer each, then multiply.'
      - 'Two separate facts are wanted, so take them one at a time.'
      - 'First, the primes between 1 and 6 are 2, 3 and 5 (1 is not prime, 4 is not prime). Their sum is $x = 2 + 3 + 5 = 10$.'
      - 'Next, the H.C.F. of 6, 9 and 15 is the largest number dividing all three. $6 = 2 \times 3$, $9 = 3 \times 3$, $15 = 3 \times 5$ — the only common factor is 3, so $y = 3$.'
      - 'Now multiply: $xy = 10 \times 3 = 30$.'
      - 'The trap is option C, 33, which counts 1 as a prime ($x = 11$). By definition a prime has exactly two different factors, and 1 has only one — so 1 is never prime.'
    hint: 'The primes 2, 3, 5 add to 10; what is the H.C.F. of 6, 9 and 15?'

  3:
    answer: B
    steps:
      - 'Percentage error always compares the mistake with the true value. Let''s set that up.'
      - 'The true mass is 5.0 g and the measured mass is 5.1 g, so the error is $5.1 - 5.0 = 0.1$ g.'
      - 'Now as a fraction of the true value: $\dfrac{0.1}{5.0} = \dfrac{1}{50} = 0.02$.'
      - 'Multiply by 100 to turn it into a percentage: $0.02 \times 100 = 2\%$.'
      - 'A sense check: 0.1 g is a small slip on 5 g, so the percentage should be small — a few per cent at most ✓.'
      - 'The trap is option C, 0.02 — the relative error, left as a decimal without multiplying by 100. Option A, 20, comes from dividing 0.1 by 0.5 by mistake. Don''t forget that last times 100.'
    hint: 'Divide the error, 0.1 g, by the true 5.0 g, then multiply by 100.'

  4:
    answer: D
    steps:
      - 'Dividing by a tiny decimal feels awkward, so we''ll make the divisor a whole number first. It gets much easier.'
      - 'Multiply top and bottom by 10,000, which does not change the value of the fraction.'
      - 'That gives $\dfrac{0.24633}{0.0306} = \dfrac{2463.3}{306}$.'
      - 'Now divide: $306 \times 8 = 2448$, leaving a remainder of $2463.3 - 2448 = 15.3$.'
      - 'And $15.3 \div 306 = 0.05$ exactly, so the quotient is $8.05$ exactly.'
      - 'Next, round to one decimal place by looking at the second decimal digit. It is 5, and the rule is that 5 or more rounds the previous digit up: $8.05 \to 8.1$.'
      - 'Let''s check: $0.0306 \times 8.05 = 0.24633$ ✓.'
      - 'The trap is option C, 8.0 — chopping off the digits instead of rounding. Option A, 0.8, misplaces the decimal point by a factor of ten. A 5 rounds up — hold on to that.'
    hint: 'The quotient is exactly 8.05; now round that 5 up.'

  5:
    answer: B
    steps:
      - 'This is a chain: the ₦720 leads to Kehinde''s share, and her share leads to the whole store. Let''s follow it link by link.'
      - 'The ₦720 is the price of a known fraction of Kehinde''s share, so it reveals her share, and her share reveals the whole store through the ratio.'
      - 'First, $\tfrac{2}{3}$ of Kehinde''s share is ₦720, so her whole share is $720 \times \tfrac{3}{2} = ₦1{,}080$.'
      - 'Next, her share is 9 parts of the $11 + 9 = 20$ parts of the store, so one part is $1080 \div 9 = ₦120$.'
      - 'So the store is worth $20 \times 120 = ₦2{,}400$.'
      - 'Let''s check: Taiwo''s share is $11 \times 120 = ₦1{,}320$, and $1320 + 1080 = 2400$ ✓.'
      - 'The trap is option A, ₦1,080 — Kehinde''s share, found halfway through. Keep going until you reach what the question asks for.'
    hint: 'Kehinde''s share is $720 \times \tfrac{3}{2}$, which is 9 of 20 parts.'

  6:
    answer: D
    steps:
      - 'Ratios don''t change neatly when you remove balls, so we''ll switch to actual numbers first. Let''s count them.'
      - 'A ratio together with one actual count gives every count; change the counts, then rebuild the ratio.'
      - 'The ratio 5 : 2 : 1 with 10 blue balls means one "part" is 10 balls.'
      - 'So there are $5 \times 10 = 50$ green and $2 \times 10 = 20$ black.'
      - 'Now, 40 green, 10 black, 10 blue remain.'
      - 'The ratio $40 : 10 : 10$ simplifies (dividing by 10) to $4 : 1 : 1$.'
      - 'The trap is option B, 4 : 2 : 1 — removing the green balls but forgetting the black ones. Change every count the question mentions, then simplify.'
    hint: 'One part is 10 balls: 50 green, 20 black and 10 blue before the removal.'

  7:
    answer: C
    steps:
      - 'Only part of the income is taxed, and that''s the detail that matters. Let''s work backwards from the tax.'
      - 'Find the taxed part from the tax paid, then the whole income.'
      - 'The tax-free part is $\tfrac{1}{8}$, so $\tfrac{7}{8}$ of the income is taxed.'
      - 'Now, 20% of the taxed part is ₦490, so the taxed part is $490 \div 0.2 = ₦2{,}450$.'
      - 'That is $\tfrac{7}{8}$ of the income: income $= 2450 \times \tfrac{8}{7} = ₦2{,}800$.'
      - 'Let''s check: $\tfrac{7}{8}$ of 2,800 is 2,450, and 20% of that is 490 ✓.'
      - 'The trap is option B, ₦2,450 — the taxable part, not the whole income. One more step brings back the tax-free eighth.'
    hint: 'The taxed part is $490 \div 0.2$; that is $\tfrac{7}{8}$ of the income.'

  8:
    answer: C
    steps:
      - 'Fractional indices get much friendlier once everything is in prime factors. Let''s break the numbers down.'
      - 'Write every number in terms of its prime factors, so that the indices can be combined.'
      - 'First, $8^{1/3} = (2^{3})^{1/3} = 2$.'
      - 'Then $10^{2/3} = (2 \times 5)^{2/3} = 2^{2/3} \times 5^{2/3}$.'
      - 'The fraction is $\dfrac{2 \times 5^{2/3}}{2^{2/3} \times 5^{2/3}}$. Watch the $5^{2/3}$ cancel.'
      - 'That leaves $\dfrac{2}{2^{2/3}} = 2^{1 - 2/3} = 2^{1/3} = \sqrt[3]{2}$.'
      - 'A numerical check: $\sqrt[3]{2} \approx 1.26$, and directly $\tfrac{2 \times 2.924}{4.642} \approx 1.26$ ✓.'
      - 'The trap is option D, $\sqrt[3]{5}$ — the powers of 5 cancel completely, so no 5 can survive into the answer. Prime factors make that easy to see.'
    hint: 'Split $10^{2/3}$ into $2^{2/3} \times 5^{2/3}$; the fives cancel.'

  9:
    answer: C
    steps:
      - 'We''re given the logs of 2 and 3, so the job is to build 4.5 out of 2s and 3s. Let''s do that.'
      - 'Write 4.5 using only the numbers whose logarithms are given, 2 and 3.'
      - 'So $4.5 = \tfrac{9}{2} = \tfrac{3^{2}}{2}$.'
      - 'Now the log laws: $\log 4.5 = \log 3^{2} - \log 2 = 2\log 3 - \log 2$.'
      - 'Substitute: $2(0.4771) - 0.3010 = 0.9542 - 0.3010 = 0.6532$.'
      - 'A sense check: 4.5 lies between 1 and 10, so its logarithm lies between 0 and 1, and $\log 4.5$ should be just under $\log 5 \approx 0.699$ ✓.'
      - 'The trap is option D, 0.9542 — that is $\log 9$, with the division by 2 forgotten. Build the number fully before you stop.'
    hint: 'Notice $4.5 = \tfrac{9}{2}$, so $\log 4.5 = 2\log 3 - \log 2$.'

  10:
    answer: C
    steps:
      - 'When surds appear on both sides, we can match the plain numbers and the surd parts separately. Let''s set that up.'
      - 'Expand the square first, then compare the whole-number parts and the surd parts separately.'
      - 'Here''s the square: $(1 - \sqrt{3})^{2} = 1 - 2\sqrt{3} + 3 = 4 - 2\sqrt{3}$.'
      - 'Now multiply by $(m + \sqrt{3})$ — $4m - 2m\sqrt{3} + 4\sqrt{3} - 2(3) = (4m - 6) + (4 - 2m)\sqrt{3}$.'
      - 'This must equal $6 - 2\sqrt{3}$. Matching the whole numbers: $4m - 6 = 6$, so $m = 3$.'
      - 'Matching the surds: $4 - 2m = -2$, so $m = 3$ again ✓ — both parts agree, which confirms the reading.'
      - 'The trap is expanding $(1 - \sqrt{3})^{2}$ as $1 - 3 = -2$, forgetting the middle term $-2\sqrt{3}$. A squared bracket always has three terms.'
    hint: 'Expand to $(4m - 6) + (4 - 2m)\sqrt{3}$ and match both parts.'

  11:
    answer: D
    steps:
      - 'This one turns on a fact about books rather than a formula. Once you see it, the rest is careful units.'
      - 'Here''s the key: a leaf is one sheet of paper, and it carries two pages — one on each side.'
      - 'So an 800-page book has $800 \div 2 = 400$ leaves.'
      - 'The 18 mm thickness is shared equally among the 400 leaves: each leaf is $\dfrac{18}{400} = 0.045$ mm.'
      - 'Now convert to metres. There are 1000 mm in a metre, so divide by 1000: $0.045 \div 1000 = 0.000045$ m.'
      - 'In standard form, move the decimal point five places right to get $4.5$, so $0.000045 = 4.5 \times 10^{-5}$ m.'
      - 'A sense check: a sheet of paper is a few hundredths of a millimetre thick, and 0.045 mm fits that ✓.'
      - 'The trap is option C, $2.25 \times 10^{-5}$ m, which divides 18 mm by 800 pages instead of 400 leaves — exactly half the true thickness. Options A and B convert the units wrongly by a factor of ten. Pages and leaves are different things.'
    hint: 'An 800-page book has 400 leaves; then change millimetres to metres.'

  12:
    answer: C
    steps:
      - 'Subtracting algebraic fractions — the danger is the minus sign in front of the second product. Let''s go slowly.'
      - 'Subtract over the common denominator $(x + 1)(x + 2)$.'
      - 'The numerator is $(x + 2)^{2} - (x - 2)(x + 1)$.'
      - 'Expand each piece: $(x + 2)^{2} = x^{2} + 4x + 4$ and $(x - 2)(x + 1) = x^{2} - x - 2$.'
      - 'Now subtract, changing every sign in the second: $x^{2} + 4x + 4 - x^{2} + x + 2 = 5x + 6$.'
      - 'So the result is $\dfrac{5x + 6}{(x + 1)(x + 2)}$.'
      - 'Let''s check with $x = 0$ — $2 - (-1) = 3$, and $\tfrac{6}{2} = 3$ ✓.'
      - 'The trap is option B, $3x + 2$ on top — the second product subtracted without changing all its signs. Keep it in brackets until you subtract, and you''ll be fine.'
    hint: 'The numerator is $(x + 2)^{2} - (x - 2)(x + 1)$.'

  13:
    answer: B
    steps:
      - 'We''re given $\tfrac{1}{p}$ and $\tfrac{1}{q}$ in disguise, so the first job is to find $p$ and $q$ themselves. Let''s start there.'
      - 'Turn the two given expressions into $p$ and $q$ by flipping them upside down.'
      - 'Spot the perfect squares: $a^{2} + 2ab + b^{2} = (a + b)^{2}$ and $a^{2} - 2ab + b^{2} = (a - b)^{2}$.'
      - 'So $p = \dfrac{a - b}{(a + b)^{2}}$ and $q = \dfrac{(a - b)^{2}}{a + b}$.'
      - 'Then $\dfrac{p}{q} = \dfrac{a - b}{(a + b)^{2}} \times \dfrac{a + b}{(a - b)^{2}} = \dfrac{1}{(a + b)(a - b)}$.'
      - 'And $(a + b)(a - b) = a^{2} - b^{2}$, so $\dfrac{p}{q} = \dfrac{1}{a^{2} - b^{2}}$.'
      - 'Let''s check with $a = 2$, $b = 1$ — $p = \tfrac{1}{9}$, $q = \tfrac{1}{3}$, so $\tfrac{p}{q} = \tfrac{1}{3}$; and $\tfrac{1}{4 - 1} = \tfrac{1}{3}$ ✓.'
      - 'The trap is option D, $a^{2} - b^{2}$ — the answer upside down, which comes from dividing $\tfrac{1}{p}$ by $\tfrac{1}{q}$ instead of $p$ by $q$. Flip first, then divide.'
    hint: 'Invert both to get $p$ and $q$, then divide.'

  14:
    answer: C
    steps:
      - 'Variation questions always start by writing the rule with a constant. Let''s do that, then find the constant.'
      - '"$x$ varies inversely as the cube root of $y$" means $x$ equals a constant divided by $\sqrt[3]{y}$ — $x = \dfrac{k}{\sqrt[3]{y}}$.'
      - 'Use the given pair to find $k$. With $x = 1$ and $y = 8$, which gives $\sqrt[3]{8} = 2$, since $2^{3} = 8$.'
      - 'So $1 = \dfrac{k}{2}$, giving $k = 2$. The rule is $x = \dfrac{2}{\sqrt[3]{y}}$.'
      - 'Now put $x = 3$ — $3 = \dfrac{2}{\sqrt[3]{y}}$, so $\sqrt[3]{y} = \dfrac{2}{3}$.'
      - 'Undo a cube root by cubing: $y = \left(\dfrac{2}{3}\right)^{3} = \dfrac{8}{27}$.'
      - 'Let''s check: $\sqrt[3]{\tfrac{8}{27}} = \tfrac{2}{3}$, and $\tfrac{2}{2/3} = 3$ ✓. It also makes sense that $y$ shrank: under inverse variation, a bigger $x$ needs a smaller $y$.'
      - 'The trap is option B, $\tfrac{2}{3}$ — that is $\sqrt[3]{y}$, the step before the answer. Option A, $\tfrac{1}{3}$, ignores the cube root altogether. Finish by cubing, and you''re there.'
    hint: 'Find $k = 2$, get $\sqrt[3]{y} = \tfrac{2}{3}$, then cube it.'

  15:
    answer: D
    steps:
      - 'Substituting a negative number into powers is where signs slip. Let''s go slowly, one piece at a time.'
      - 'Work out each power and root separately.'
      - 'We get $a^{3} = (-3)^{3} = -27$, $b^{3} = 8$ and $c^{1/2} = \sqrt{4} = 2$.'
      - 'So the numerator is $-27 - 8 - 2 = -37$.'
      - 'Now the denominator: $b - a - c = 2 - (-3) - 4 = 2 + 3 - 4 = 1$.'
      - 'So the value is $\dfrac{-37}{1} = -37$.'
      - 'The trap is the sign of $a^{3}$: an odd power of a negative number stays negative. Taking $(-3)^{3}$ as $+27$ gives a numerator of $+17$, which no option carries. Odd powers keep the minus — that''s the thing to remember.'
    hint: 'The numerator is $-27 - 8 - 2$; the denominator is $2 + 3 - 4$.'

  16:
    answer: A
    steps:
      - 'Putting an expression into a function means replacing every $y$ with the whole thing, brackets and all. Let''s do it carefully.'
      - 'To find $g(y + 3)$, replace every $y$ in the rule by the whole expression $(y + 3)$ — brackets matter.'
      - 'The first fraction becomes $\dfrac{(y + 3) - 3}{11} = \dfrac{y}{11}$.'
      - 'The second fraction''s denominator becomes $(y + 3)^{2} - 9$.'
      - 'Expand the square: $(y + 3)^{2} = y^{2} + 6y + 9$, so $(y + 3)^{2} - 9 = y^{2} + 6y$.'
      - 'Factorise: $y^{2} + 6y = y(y + 6)$.'
      - 'So $g(y + 3) = \dfrac{y}{11} + \dfrac{11}{y(y + 6)}$.'
      - 'Let''s check with $y = 1$ — $g(4) = \tfrac{1}{11} + \tfrac{11}{7}$, and the answer gives $\tfrac{1}{11} + \tfrac{11}{1 \times 7}$ ✓.'
      - 'The trap is option B, $y(y + 3)$, which comes from expanding $(y + 3)^{2}$ as $y^{2} + 3y + 9$ — the middle term must be doubled, $2 \times 3y = 6y$. Don''t forget that doubling.'
    hint: 'Expanding gives $(y + 3)^{2} - 9 = y^{2} + 6y$.'

  17:
    answer: D
    steps:
      - 'This looks like a difference of two squares, and it is — but there''s a common factor to pull out first. Let''s find it.'
      - 'Each bracket has its own common factor, so take those out first.'
      - 'We have $x^{2} + x = x(x + 1)$ and $2x + 2 = 2(x + 1)$.'
      - 'So the expression is $x^{2}(x + 1)^{2} - 4(x + 1)^{2} = (x + 1)^{2}(x^{2} - 4)$.'
      - 'And $x^{2} - 4 = (x + 2)(x - 2)$, so the complete factorisation is $(x + 1)^{2}(x + 2)(x - 2)$.'
      - 'Let''s check with $x = 1$ — $(2)^{2} - (4)^{2} = -12$, and $4 \times 3 \times (-1) = -12$ ✓.'
      - 'The trap is option C, $(x + 1)^{2}(x + 2)^{2}$ — a *sum* of squares never factorises this way, and the minus sign in the original must produce a factor $(x - 2)$. Keep factorising until nothing more comes out.'
    hint: 'Take out $(x + 1)^{2}$ to leave $x^{2} - 4$.'

  18:
    answer: B
    steps:
      - 'Cube roots on the bottom are a hint: the top, $x - y$, is a difference of cubes in disguise. Let''s reveal it.'
      - 'Since $(x^{1/3})^{3} = x$ and $(y^{1/3})^{3} = y$, write $a = x^{1/3}$ and $b = y^{1/3}$, so that $x - y = a^{3} - b^{3}$.'
      - 'The difference of cubes factorises as $a^{3} - b^{3} = (a - b)(a^{2} + ab + b^{2})$.'
      - 'Now look at the denominator: $x^{1/3} - y^{1/3} = a - b$, exactly the first factor, so it cancels.'
      - 'What remains is $a^{2} + ab + b^{2}$.'
      - 'Back in terms of $x$ and $y$ — $a^{2} = x^{2/3}$, $ab = x^{1/3}y^{1/3}$ and $b^{2} = y^{2/3}$.'
      - 'So the simplified form is $x^{2/3} + x^{1/3}y^{1/3} + y^{2/3}$.'
      - 'Let''s check with $x = 8$, $y = 1$: the original is $\tfrac{8 - 1}{2 - 1} = 7$, and $4 + 2 + 1 = 7$ ✓.'
      - 'The trap is option C, which has minus signs in the quadratic factor. That belongs to the *sum* of cubes, $a^{3} + b^{3} = (a + b)(a^{2} - ab + b^{2})$. Difference of cubes keeps the plus signs.'
    hint: 'Let $a = x^{1/3}$, $b = y^{1/3}$; then $x - y = a^{3} - b^{3}$.'

  19:
    answer: C
    steps:
      - 'Before reaching for the quadratic formula, it pays to look at the shape of the equation. This one is a perfect square.'
      - 'Here''s the pattern: $A^{2} + 2AB + B^{2}$ is the expansion of $(A + B)^{2}$, and this equation fits it.'
      - 'Take $A = x$ and $B = \dfrac{1}{r^{2}}$.'
      - 'Then $2AB = 2 \times x \times \dfrac{1}{r^{2}} = \dfrac{2x}{r^{2}}$ ✓, the middle term, and $B^{2} = \dfrac{1}{r^{4}}$ ✓, the last term.'
      - 'So the equation is $\left(x + \dfrac{1}{r^{2}}\right)^{2} = 0$.'
      - 'A square equals zero only when the quantity being squared is zero: $x + \dfrac{1}{r^{2}} = 0$, so $x = -\dfrac{1}{r^{2}}$.'
      - 'Because it is a perfect square, the two roots of the quadratic coincide — there is exactly one solution.'
      - 'The trap is option B, $+\tfrac{1}{r^{2}}$, the sign lost when moving $\tfrac{1}{r^{2}}$ across. Substituting it back gives $\tfrac{1}{r^{4}} + \tfrac{2}{r^{4}} + \tfrac{1}{r^{4}} = \tfrac{4}{r^{4}}$, not 0. Always look for a pattern first.'
    hint: 'Notice that the left side is $\left(x + \tfrac{1}{r^{2}}\right)^{2}$.'

  20:
    answer: A
    steps:
      - 'A double inequality is just two inequalities at once. And there''s a negative to divide by, so let''s watch the signs.'
      - 'Treat all three parts together, doing the same to each.'
      - 'Subtract 5: $1 - 5 \le -2x \le 7 - 5$, that is $-4 \le -2x \le 2$.'
      - 'Now divide by $-2$, which reverses both signs: $2 \ge x \ge -1$, or $-1 \le x \le 2$.'
      - 'The integers in that range are $-1, 0, 1, 2$.'
      - 'Let''s check the ends: $x = -1$ gives $5 + 2 = 7$ ✓; $x = 2$ gives $5 - 4 = 1$ ✓.'
      - 'The trap is forgetting to reverse the signs when dividing by $-2$, which gives the impossible $-1 \ge x \ge 2$. Divide by a negative, flip the signs.'
    hint: 'Subtract 5, divide by $-2$, and reverse the inequality signs.'

  21:
    answer: D
    steps:
      - 'Two simultaneous equations, and elimination will do the job neatly. Let''s line them up.'
      - 'Rearrange both equations into the standard form and eliminate one letter.'
      - 'They are $3x - 5y = 3$ and $6x - 2y = 5$.'
      - 'Double the first: $6x - 10y = 6$. Subtract it from the second: $8y = -1$, so $y = -\tfrac{1}{8}$.'
      - 'Now substitute back: $3x = 3 + 5\left(-\tfrac{1}{8}\right) = \tfrac{19}{8}$, so $x = \tfrac{19}{24}$.'
      - 'So $(x, y) = \left(\tfrac{19}{24}, -\tfrac{1}{8}\right)$.'
      - 'The trap is option A, the same two numbers in the wrong order. The pair is written $(x, y)$, so $x$ always comes first.'
    hint: 'Try doubling the first equation and subtracting.'

  22:
    answer: C
    steps:
      - 'You know the quadratic formula — this question checks whether you can use it with unusual letters. Let''s match them up.'
      - 'The formula solves any equation $Ax^{2} + Bx + C = 0$ as $x = \dfrac{-B \pm \sqrt{B^{2} - 4AC}}{2A}$, where $A$, $B$, $C$ are just the numbers (or letters) standing in those three places.'
      - 'Now match this equation to that pattern. The coefficient of $x^{2}$ is $p$, so $A = p$.'
      - 'The coefficient of $x$ is $q$, so $B = q$.'
      - 'The constant term is $b$, so $C = b$. (Be careful: here the letter $b$ is the *constant*, not the coefficient of $x$ as in the textbook formula.)'
      - 'Substituting: $x = \dfrac{-q \pm \sqrt{q^{2} - 4pb}}{2p}$, which is option C.'
      - 'The trap is option A — the formula in its textbook letters $a$, $b$, $c$, not translated into this equation, where $b$ would even be the wrong term. Option D puts $p^{2}$ under the root, squaring the wrong coefficient. Match by position, not by letter.'
    hint: 'Match $A = p$, $B = q$, $C = b$ in the quadratic formula.'

  23:
    answer: C
    steps:
      - 'Adding algebraic fractions starts with factorising the bottoms. Then a common factor appears — let''s find it.'
      - 'Factorise the denominators first: $x^{2} + 5x + 6 = (x + 2)(x + 3)$ and $x^{2} + 3x + 2 = (x + 1)(x + 2)$.'
      - 'So the common denominator is $(x + 1)(x + 2)(x + 3)$.'
      - 'The numerator is $(x + 1) + (x + 3) = 2x + 4 = 2(x + 2)$.'
      - 'Now cancel $(x + 2)$: the result is $\dfrac{2}{(x + 1)(x + 3)}$.'
      - 'Let''s check with $x = 0$ — $\tfrac{1}{6} + \tfrac{1}{2} = \tfrac{2}{3}$, and $\tfrac{2}{3}$ ✓.'
      - 'The trap is stopping at $\dfrac{2x + 4}{(x + 1)(x + 2)(x + 3)}$ without noticing that the numerator shares the factor $(x + 2)$. Always check whether the top factorises too.'
    hint: 'Factorise both denominators; the numerator becomes $2(x + 2)$.'

  24:
    answer: D
    steps:
      - 'Simplifying a fraction like this is all about factorising. Once the brackets appear, one will cancel.'
      - 'An algebraic fraction simplifies only by cancelling *factors*, so factorise the top and the bottom completely first.'
      - 'The numerator is a difference of two squares: $4a^{2} = (2a)^{2}$ and $49b^{2} = (7b)^{2}$, so $4a^{2} - 49b^{2} = (2a - 7b)(2a + 7b)$.'
      - 'Now the denominator, a quadratic in $a$. Look for two numbers multiplying to $2 \times (-7) = -14$ and adding to $5$: they are $7$ and $-2$.'
      - 'Split the middle term: $2a^{2} + 7ab - 2ab - 7b^{2} = a(2a + 7b) - b(2a + 7b) = (2a + 7b)(a - b)$.'
      - 'The fraction is $\dfrac{(2a - 7b)(2a + 7b)}{(2a + 7b)(a - b)}$, and the common factor $(2a + 7b)$ cancels.'
      - 'That leaves $\dfrac{2a - 7b}{a - b}$.'
      - 'Let''s check with $a = 2$, $b = 1$: the original is $\tfrac{16 - 49}{8 + 10 - 7} = \tfrac{-33}{11} = -3$, and $\tfrac{4 - 7}{2 - 1} = -3$ ✓.'
