# UTME 1988 Mathematics — worked explanations, written against the paper.
#
# Keyed on question number; see explanations_2003.yaml for why, and for how these are written.
#
# All 49 printed questions are answered (the paper has no question 43). Of the 27 the key
# covers, 24 agree; Q6, Q13 and Q39 differ, and retranscribed_1988.yaml sets out why. Q26 is
# rebuilt, which its note says plainly.
format_version: 1
exam_year: 1988
subject: MATH

explanations:
  1:
    answer: C
    steps:
      - 'The word "of" means multiply, and it binds more tightly than division: in $2 \div \tfrac{1}{4} \text{ of } 32$, the "of" is worked out first.'
      - '$\tfrac{1}{4}$ of 32 is $\tfrac{1}{4} \times 32 = 8$.'
      - 'So the denominator is $2 \div 8 = \tfrac{1}{4}$.'
      - 'The whole fraction is $1\tfrac{1}{2} \div \tfrac{1}{4} = \tfrac{3}{2} \times 4 = 6$.'
      - 'Dividing by a quarter is the same as multiplying by 4, so a small denominator makes a larger answer.'
      - 'The trap is working strictly left to right in the denominator: $2 \div \tfrac{1}{4} = 8$, then $8 \times 32 = 256$, giving $\tfrac{3}{2} \div 256 = \tfrac{3}{512}$ — close to option A. "Of" must be done before the division.'
    hint: 'Do "$\tfrac{1}{4}$ of 32" first; the denominator becomes $2 \div 8$.'

  2:
    answer: B
    steps:
      - 'Two separate facts are wanted, then multiplied, so take them one at a time.'
      - 'The primes between 1 and 6 are 2, 3 and 5 (1 is not prime, 4 is not prime). Their sum is $x = 2 + 3 + 5 = 10$.'
      - 'The H.C.F. of 6, 9 and 15 is the largest number dividing all three. $6 = 2 \times 3$, $9 = 3 \times 3$, $15 = 3 \times 5$ — the only common factor is 3, so $y = 3$.'
      - 'The product is $xy = 10 \times 3 = 30$.'
      - 'The trap is option C, 33, which counts 1 as a prime ($x = 11$). By definition a prime has exactly two different factors, and 1 has only one.'
    hint: 'Primes 2, 3, 5 add to 10; the H.C.F. of 6, 9, 15 is 3.'

  3:
    answer: B
    steps:
      - 'Percentage error measures how big a mistake is compared with the true value, so it is always error ÷ true value × 100.'
      - 'The true mass is 5.0 g and the measured mass is 5.1 g, so the error is $5.1 - 5.0 = 0.1$ g.'
      - 'As a fraction of the true value: $\dfrac{0.1}{5.0} = \dfrac{1}{50} = 0.02$.'
      - 'Multiply by 100 to turn it into a percentage: $0.02 \times 100 = 2\%$.'
      - 'A sense check: 0.1 g is a small slip on 5 g, so the percentage should be small — a few per cent at most ✓.'
      - 'The trap is option C, 0.02 — the relative error, left as a decimal without multiplying by 100. Option A, 20, comes from dividing 0.1 by 0.5 by mistake.'
    hint: 'Error 0.1 g divided by the true 5.0 g, then × 100.'

  4:
    answer: D
    steps:
      - 'Dividing by a small decimal is easier once the divisor is a whole number. Multiply top and bottom by 10,000, which does not change the value of the fraction.'
      - '$\dfrac{0.24633}{0.0306} = \dfrac{2463.3}{306}$.'
      - 'Now divide: $306 \times 8 = 2448$, leaving a remainder of $2463.3 - 2448 = 15.3$.'
      - 'And $15.3 \div 306 = 0.05$ exactly, so the quotient is $8.05$ exactly.'
      - 'To one decimal place, look at the second decimal digit. It is 5, and the rule is that 5 or more rounds the previous digit up: $8.05 \to 8.1$.'
      - 'Check: $0.0306 \times 8.05 = 0.24633$ ✓.'
      - 'The trap is option C, 8.0 — chopping off the digits instead of rounding. Option A, 0.8, misplaces the decimal point by a factor of ten.'
    hint: 'The quotient is exactly 8.05; round the 5 up.'

  5:
    answer: B
    steps:
      - 'The ₦720 is the price of a known fraction of Kehinde''s share, so it reveals her share, and her share reveals the whole store through the ratio.'
      - '$\tfrac{2}{3}$ of Kehinde''s share is ₦720, so her whole share is $720 \times \tfrac{3}{2} = ₦1{,}080$.'
      - 'Her share is 9 parts of the $11 + 9 = 20$ parts of the store, so one part is $1080 \div 9 = ₦120$.'
      - 'The store is worth $20 \times 120 = ₦2{,}400$.'
      - 'Check: Taiwo''s share is $11 \times 120 = ₦1{,}320$, and $1320 + 1080 = 2400$ ✓.'
      - 'The trap is option A, ₦1,080 — Kehinde''s share, found halfway through.'
    hint: 'Kehinde''s share is $720 \times \tfrac{3}{2}$, which is 9 of 20 parts.'

  6:
    answer: D
    steps:
      - 'A ratio together with one actual count gives every count; change the counts, then rebuild the ratio.'
      - 'The ratio 5 : 2 : 1 with 10 blue balls means one "part" is 10 balls.'
      - 'So there are $5 \times 10 = 50$ green and $2 \times 10 = 20$ black.'
      - 'Remove 10 green and 10 black: 40 green, 10 black, 10 blue remain.'
      - 'The ratio $40 : 10 : 10$ simplifies (dividing by 10) to $4 : 1 : 1$.'
      - 'The trap is option B, 4 : 2 : 1 — removing the green balls but forgetting the black ones.'
    hint: 'One part is 10 balls: 50 green, 20 black, 10 blue before the removal.'

  7:
    answer: C
    steps:
      - 'Only part of the income is taxed, so find the taxed part from the tax paid, then the whole income.'
      - 'The tax-free part is $\tfrac{1}{8}$, so $\tfrac{7}{8}$ of the income is taxed.'
      - '20% of the taxed part is ₦490, so the taxed part is $490 \div 0.2 = ₦2{,}450$.'
      - 'That is $\tfrac{7}{8}$ of the income: income $= 2450 \times \tfrac{8}{7} = ₦2{,}800$.'
      - 'Check: $\tfrac{7}{8}$ of 2,800 is 2,450, and 20% of that is 490 ✓.'
      - 'The trap is option B, ₦2,450 — the taxable part, not the whole income.'
    hint: 'Taxed part $= 490 \div 0.2$; that is $\tfrac{7}{8}$ of the income.'

  8:
    answer: C
    steps:
      - 'Write every number in terms of its prime factors, so that the indices can be combined.'
      - '$8^{1/3} = (2^{3})^{1/3} = 2$.'
      - '$10^{2/3} = (2 \times 5)^{2/3} = 2^{2/3} \times 5^{2/3}$.'
      - 'The fraction is $\dfrac{2 \times 5^{2/3}}{2^{2/3} \times 5^{2/3}}$. The $5^{2/3}$ cancels.'
      - 'That leaves $\dfrac{2}{2^{2/3}} = 2^{1 - 2/3} = 2^{1/3} = \sqrt[3]{2}$.'
      - 'Numerically $\sqrt[3]{2} \approx 1.26$, and directly $\tfrac{2 \times 2.924}{4.642} \approx 1.26$ ✓.'
      - 'The trap is option D, $\sqrt[3]{5}$ — the powers of 5 cancel completely, so no 5 can survive into the answer.'
    hint: 'Split $10^{2/3}$ into $2^{2/3} \times 5^{2/3}$; the fives cancel.'

  9:
    answer: C
    steps:
      - 'Write 4.5 using only the numbers whose logarithms are given, 2 and 3.'
      - '$4.5 = \tfrac{9}{2} = \tfrac{3^{2}}{2}$.'
      - 'So $\log 4.5 = \log 3^{2} - \log 2 = 2\log 3 - \log 2$.'
      - 'Substitute: $2(0.4771) - 0.3010 = 0.9542 - 0.3010 = 0.6532$.'
      - 'Sense check: 4.5 lies between 1 and 10, so its logarithm lies between 0 and 1, and $\log 4.5$ should be just under $\log 5 \approx 0.699$ ✓.'
      - 'The trap is option D, 0.9542 — that is $\log 9$, with the division by 2 forgotten.'
    hint: '$4.5 = \tfrac{9}{2}$, so $\log 4.5 = 2\log 3 - \log 2$.'

  10:
    answer: C
    steps:
      - 'Expand the square first, then compare the whole-number parts and the surd parts separately.'
      - '$(1 - \sqrt{3})^{2} = 1 - 2\sqrt{3} + 3 = 4 - 2\sqrt{3}$.'
      - 'Multiply by $(m + \sqrt{3})$: $4m - 2m\sqrt{3} + 4\sqrt{3} - 2(3) = (4m - 6) + (4 - 2m)\sqrt{3}$.'
      - 'This must equal $6 - 2\sqrt{3}$. Matching the whole numbers: $4m - 6 = 6$, so $m = 3$.'
      - 'Matching the surds: $4 - 2m = -2$, so $m = 3$ again ✓ — both parts agree, which confirms the reading.'
      - 'The trap is expanding $(1 - \sqrt{3})^{2}$ as $1 - 3 = -2$, forgetting the middle term $-2\sqrt{3}$.'
    hint: 'Expand to $(4m - 6) + (4 - 2m)\sqrt{3}$ and match both parts.'

  11:
    answer: D
    steps:
      - 'The key fact is how books are made: a leaf is one sheet of paper, and it carries two pages — one on each side.'
      - 'So an 800-page book has $800 \div 2 = 400$ leaves.'
      - 'The 18 mm thickness is shared equally among the 400 leaves: each leaf is $\dfrac{18}{400} = 0.045$ mm.'
      - 'Now convert to metres. There are 1000 mm in a metre, so divide by 1000: $0.045 \div 1000 = 0.000045$ m.'
      - 'In standard form a number is written as (a number from 1 to 10) × (a power of 10). Moving the decimal point five places right gives $4.5$, so $0.000045 = 4.5 \times 10^{-5}$ m.'
      - 'A sense check: a sheet of paper is a few hundredths of a millimetre thick, and 0.045 mm fits that ✓.'
      - 'The trap is option C, $2.25 \times 10^{-5}$ m, which divides 18 mm by 800 pages instead of 400 leaves — exactly half the true thickness. Options A and B keep the right digits but convert the units wrongly by a factor of ten.'
    hint: '800 pages are 400 leaves; then change millimetres to metres.'

  12:
    answer: C
    steps:
      - 'Subtract over the common denominator $(x + 1)(x + 2)$.'
      - 'The numerator is $(x + 2)^{2} - (x - 2)(x + 1)$.'
      - '$(x + 2)^{2} = x^{2} + 4x + 4$ and $(x - 2)(x + 1) = x^{2} - x - 2$.'
      - 'Subtracting: $x^{2} + 4x + 4 - x^{2} + x + 2 = 5x + 6$.'
      - 'So the result is $\dfrac{5x + 6}{(x + 1)(x + 2)}$.'
      - 'Check with $x = 0$: $2 - (-1) = 3$, and $\tfrac{6}{2} = 3$ ✓.'
      - 'The trap is option B, $3x + 2$ on top — the second product subtracted without changing all its signs.'
    hint: 'Numerator $(x + 2)^{2} - (x - 2)(x + 1)$.'

  13:
    answer: B
    steps:
      - 'First turn the two given expressions into $p$ and $q$ themselves, by flipping them upside down.'
      - '$a^{2} + 2ab + b^{2} = (a + b)^{2}$ and $a^{2} - 2ab + b^{2} = (a - b)^{2}$.'
      - 'So $p = \dfrac{a - b}{(a + b)^{2}}$ and $q = \dfrac{(a - b)^{2}}{a + b}$.'
      - 'Then $\dfrac{p}{q} = \dfrac{a - b}{(a + b)^{2}} \times \dfrac{a + b}{(a - b)^{2}} = \dfrac{1}{(a + b)(a - b)}$.'
      - 'And $(a + b)(a - b) = a^{2} - b^{2}$, so $\dfrac{p}{q} = \dfrac{1}{a^{2} - b^{2}}$.'
      - 'Check with $a = 2$, $b = 1$: $p = \tfrac{1}{9}$, $q = \tfrac{1}{3}$, so $\tfrac{p}{q} = \tfrac{1}{3}$; and $\tfrac{1}{4 - 1} = \tfrac{1}{3}$ ✓.'
      - 'The trap is option D, $a^{2} - b^{2}$ — the answer upside down, which comes from dividing $\tfrac{1}{p}$ by $\tfrac{1}{q}$ instead of $p$ by $q$.'
    hint: 'Invert both to get $p$ and $q$, then divide.'

  14:
    answer: C
    steps:
      - '"$x$ varies inversely as the cube root of $y$" means $x$ equals a constant divided by $\sqrt[3]{y}$: $x = \dfrac{k}{\sqrt[3]{y}}$.'
      - 'Use the given pair to find $k$. With $x = 1$ and $y = 8$: $\sqrt[3]{8} = 2$, since $2^{3} = 8$.'
      - 'So $1 = \dfrac{k}{2}$, giving $k = 2$. The rule is $x = \dfrac{2}{\sqrt[3]{y}}$.'
      - 'Now put $x = 3$: $3 = \dfrac{2}{\sqrt[3]{y}}$, so $\sqrt[3]{y} = \dfrac{2}{3}$.'
      - 'Undo a cube root by cubing: $y = \left(\dfrac{2}{3}\right)^{3} = \dfrac{8}{27}$.'
      - 'Check: $\sqrt[3]{\tfrac{8}{27}} = \tfrac{2}{3}$, and $\tfrac{2}{2/3} = 3$ ✓. It also makes sense that $y$ shrank: under inverse variation, a bigger $x$ needs a smaller $y$.'
      - 'The trap is option B, $\tfrac{2}{3}$ — that is $\sqrt[3]{y}$, the step before the answer. Option A, $\tfrac{1}{3}$, divides the given 1 by the new 3 without using the cube root at all.'
    hint: 'Find $k = 2$, get $\sqrt[3]{y} = \tfrac{2}{3}$, then cube it.'

  15:
    answer: D
    steps:
      - 'Substitute carefully, working out each power and root separately.'
      - '$a^{3} = (-3)^{3} = -27$, $b^{3} = 8$ and $c^{1/2} = \sqrt{4} = 2$.'
      - 'The numerator is $-27 - 8 - 2 = -37$.'
      - 'The denominator is $b - a - c = 2 - (-3) - 4 = 2 + 3 - 4 = 1$.'
      - 'So the value is $\dfrac{-37}{1} = -37$.'
      - 'The trap is the sign of $a^{3}$: an odd power of a negative number stays negative. Taking $(-3)^{3}$ as $+27$ gives a numerator of $+17$, which no option carries.'
    hint: 'Numerator $-27 - 8 - 2$; denominator $2 + 3 - 4$.'

  16:
    answer: A
    steps:
      - 'To find $g(y + 3)$, replace every $y$ in the rule by the whole expression $(y + 3)$ — brackets matter.'
      - 'The first fraction becomes $\dfrac{(y + 3) - 3}{11} = \dfrac{y}{11}$.'
      - 'The second fraction''s denominator becomes $(y + 3)^{2} - 9$.'
      - 'Expand the square: $(y + 3)^{2} = y^{2} + 6y + 9$, so $(y + 3)^{2} - 9 = y^{2} + 6y$.'
      - 'Factorise: $y^{2} + 6y = y(y + 6)$.'
      - 'So $g(y + 3) = \dfrac{y}{11} + \dfrac{11}{y(y + 6)}$.'
      - 'Check with $y = 1$: $g(4) = \tfrac{1}{11} + \tfrac{11}{7}$, and the answer gives $\tfrac{1}{11} + \tfrac{11}{1 \times 7}$ ✓.'
      - 'The trap is option B, $y(y + 3)$, which comes from expanding $(y + 3)^{2}$ as $y^{2} + 3y + 9$ — the middle term must be doubled, $2 \times 3y = 6y$.'
    hint: '$(y + 3)^{2} - 9 = y^{2} + 6y$.'

  17:
    answer: D
    steps:
      - 'The expression is a difference of two squares, but each bracket has its own common factor — take those out first.'
      - '$x^{2} + x = x(x + 1)$ and $2x + 2 = 2(x + 1)$.'
      - 'So the expression is $x^{2}(x + 1)^{2} - 4(x + 1)^{2} = (x + 1)^{2}(x^{2} - 4)$.'
      - 'And $x^{2} - 4 = (x + 2)(x - 2)$, so the complete factorisation is $(x + 1)^{2}(x + 2)(x - 2)$.'
      - 'Check with $x = 1$: $(2)^{2} - (4)^{2} = -12$, and $4 \times 3 \times (-1) = -12$ ✓.'
      - 'The trap is option C, $(x + 1)^{2}(x + 2)^{2}$ — a *sum* of squares never factorises this way, and the minus sign in the original must produce a factor $(x - 2)$.'
    hint: 'Take out $(x + 1)^{2}$ to leave $x^{2} - 4$.'

  18:
    answer: B
    steps:
      - 'The key is to see $x - y$ as a difference of cubes. Since $(x^{1/3})^{3} = x$ and $(y^{1/3})^{3} = y$, write $a = x^{1/3}$ and $b = y^{1/3}$, so that $x - y = a^{3} - b^{3}$.'
      - 'The difference of cubes factorises as $a^{3} - b^{3} = (a - b)(a^{2} + ab + b^{2})$.'
      - 'The denominator is $x^{1/3} - y^{1/3} = a - b$, exactly the first factor, so it cancels.'
      - 'What remains is $a^{2} + ab + b^{2}$.'
      - 'Back in terms of $x$ and $y$: $a^{2} = x^{2/3}$, $ab = x^{1/3}y^{1/3}$ and $b^{2} = y^{2/3}$.'
      - 'So the simplified form is $x^{2/3} + x^{1/3}y^{1/3} + y^{2/3}$.'
      - 'Check with $x = 8$, $y = 1$: the original is $\tfrac{8 - 1}{2 - 1} = 7$, and $4 + 2 + 1 = 7$ ✓.'
      - 'The trap is option C, which has minus signs in the quadratic factor. That belongs to the *sum* of cubes, $a^{3} + b^{3} = (a + b)(a^{2} - ab + b^{2})$.'
    hint: 'Let $a = x^{1/3}$, $b = y^{1/3}$; then $x - y = a^{3} - b^{3}$.'

  19:
    answer: C
    steps:
      - 'Before reaching for the quadratic formula, look at the shape of the three terms. $A^{2} + 2AB + B^{2}$ is the expansion of $(A + B)^{2}$, and this equation fits that pattern.'
      - 'Take $A = x$ and $B = \dfrac{1}{r^{2}}$.'
      - 'Then $2AB = 2 \times x \times \dfrac{1}{r^{2}} = \dfrac{2x}{r^{2}}$ ✓, the middle term, and $B^{2} = \dfrac{1}{r^{4}}$ ✓, the last term.'
      - 'So the equation is $\left(x + \dfrac{1}{r^{2}}\right)^{2} = 0$.'
      - 'A square equals zero only when the quantity being squared is zero: $x + \dfrac{1}{r^{2}} = 0$, so $x = -\dfrac{1}{r^{2}}$.'
      - 'Because it is a perfect square, the two roots of the quadratic coincide — there is exactly one solution.'
      - 'The trap is option B, $+\tfrac{1}{r^{2}}$, the sign lost when moving $\tfrac{1}{r^{2}}$ across. Substituting it back gives $\tfrac{1}{r^{4}} + \tfrac{2}{r^{4}} + \tfrac{1}{r^{4}} = \tfrac{4}{r^{4}}$, not 0.'
    hint: 'The left side is $\left(x + \tfrac{1}{r^{2}}\right)^{2}$.'

  20:
    answer: A
    steps:
      - 'Treat all three parts of the double inequality together, doing the same to each.'
      - 'Subtract 5: $1 - 5 \le -2x \le 7 - 5$, that is $-4 \le -2x \le 2$.'
      - 'Divide by $-2$, which reverses both signs: $2 \ge x \ge -1$, or $-1 \le x \le 2$.'
      - 'The integers in that range are $-1, 0, 1, 2$.'
      - 'Check the ends: $x = -1$ gives $5 + 2 = 7$ ✓; $x = 2$ gives $5 - 4 = 1$ ✓.'
      - 'The trap is forgetting to reverse the signs when dividing by $-2$, which gives the impossible $-1 \ge x \ge 2$.'
    hint: 'Subtract 5, divide by $-2$ and reverse the inequality signs.'

  21:
    answer: D
    steps:
      - 'Rearrange both equations into the standard form and eliminate one letter.'
      - 'They are $3x - 5y = 3$ and $6x - 2y = 5$.'
      - 'Double the first: $6x - 10y = 6$. Subtract it from the second: $8y = -1$, so $y = -\tfrac{1}{8}$.'
      - 'Then $3x = 3 + 5\left(-\tfrac{1}{8}\right) = \tfrac{19}{8}$, so $x = \tfrac{19}{24}$.'
      - 'So $(x, y) = \left(\tfrac{19}{24}, -\tfrac{1}{8}\right)$.'
      - 'The trap is option A, the same two numbers in the wrong order. The pair is written $(x, y)$.'
    hint: 'Double the first equation and subtract.'

  22:
    answer: C
    steps:
      - 'The quadratic formula solves any equation $Ax^{2} + Bx + C = 0$ as $x = \dfrac{-B \pm \sqrt{B^{2} - 4AC}}{2A}$, where $A$, $B$, $C$ are just the numbers (or letters) standing in those three places.'
      - 'Match this equation to that pattern. The coefficient of $x^{2}$ is $p$, so $A = p$.'
      - 'The coefficient of $x$ is $q$, so $B = q$.'
      - 'The constant term is $b$, so $C = b$. (Be careful: here the letter $b$ is the *constant*, not the coefficient of $x$ as in the textbook formula.)'
      - 'Substituting: $x = \dfrac{-q \pm \sqrt{q^{2} - 4pb}}{2p}$, which is option C.'
      - 'The trap is option A — the formula in its textbook letters $a$, $b$, $c$. It is correct in general, but it has not been translated into this equation''s coefficients, and here $b$ would even be the wrong term. Option D puts $p^{2}$ under the root, squaring the wrong coefficient.'
    hint: 'Match $A = p$, $B = q$, $C = b$ in the quadratic formula.'

  23:
    answer: C
    steps:
      - 'Factorise the denominators first: $x^{2} + 5x + 6 = (x + 2)(x + 3)$ and $x^{2} + 3x + 2 = (x + 1)(x + 2)$.'
      - 'The common denominator is $(x + 1)(x + 2)(x + 3)$.'
      - 'The numerator is $(x + 1) + (x + 3) = 2x + 4 = 2(x + 2)$.'
      - 'Cancel $(x + 2)$: the result is $\dfrac{2}{(x + 1)(x + 3)}$.'
      - 'Check with $x = 0$: $\tfrac{1}{6} + \tfrac{1}{2} = \tfrac{2}{3}$, and $\tfrac{2}{3}$ ✓.'
      - 'The trap is stopping at $\dfrac{2x + 4}{(x + 1)(x + 2)(x + 3)}$ without noticing that the numerator shares the factor $(x + 2)$.'
    hint: 'Factorise both denominators; the numerator becomes $2(x + 2)$.'

  24:
    answer: D
    steps:
      - 'An algebraic fraction simplifies only by cancelling *factors*, so factorise the top and the bottom completely first.'
      - 'The numerator is a difference of two squares: $4a^{2} = (2a)^{2}$ and $49b^{2} = (7b)^{2}$, so $4a^{2} - 49b^{2} = (2a - 7b)(2a + 7b)$.'
      - 'The denominator is a quadratic in $a$. Look for two numbers multiplying to $2 \times (-7) = -14$ and adding to $5$: they are $7$ and $-2$.'
      - 'Split the middle term: $2a^{2} + 7ab - 2ab - 7b^{2} = a(2a + 7b) - b(2a + 7b) = (2a + 7b)(a - b)$.'
      - 'The fraction is $\dfrac{(2a - 7b)(2a + 7b)}{(2a + 7b)(a - b)}$, and the common factor $(2a + 7b)$ cancels.'
      - 'That leaves $\dfrac{2a - 7b}{a - b}$.'
      - 'Check with $a = 2$, $b = 1$: the original is $\tfrac{16 - 49}{8 + 10 - 7} = \tfrac{-33}{11} = -3$, and $\tfrac{4 - 7}{2 - 1} = -3$ ✓.'
      - 'The trap is option B, $\tfrac{2a + 7b}{a - b}$ — keeping the bracket that cancels and discarding the one that stays.'
    hint: 'Numerator $(2a - 7b)(2a + 7b)$; denominator $(2a + 7b)(a - b)$.'

  25:
    answer: A
    steps:
      - 'Where two graphs cross, their $y$-values are equal. So find the equation whose roots are where the curve meets the line $y = 1$.'
      - 'Set $\dfrac{x^{2} + 3}{x + 4} = 1$. Multiply by $x + 4$: $x^{2} + 3 = x + 4$.'
      - 'Rearrange: $x^{2} - x - 1 = 0$ — exactly the equation asked about. So its solutions are the $x$-values of the two crossing points.'
      - 'From the graph the crossings are at about $x = -0.6$ and $x = 1.6$.'
      - 'Check with the formula: $x = \dfrac{1 \pm \sqrt{5}}{2} = 1.618$ or $-0.618$ ✓.'
      - 'The trap is option B, the signs swapped. The larger crossing is clearly to the right of the $y$-axis.'
    hint: 'Setting the curve equal to 1 gives $x^{2} - x - 1 = 0$.'

  26:
    answer: A
    steps:
      - 'The curve is below the line exactly between the two points where they cross.'
      - 'From question 25, they cross at $x \approx -0.6$ and $x \approx 1.6$.'
      - 'Between those, at $x = 0$ for example, the curve is $\tfrac{3}{4} < 1$ — below the line ✓.'
      - 'Outside them, at $x = 3$ for example, the curve is $\tfrac{12}{7} > 1$ — above the line.'
      - 'So the curve is below $y = 1$ for $-0.6 < x < 1.6$.'
      - 'The trap is option C, which describes where the curve is *above* the line — the two outer stretches.'
    hint: 'Between the two crossing points found in question 25.'

  27:
    answer: A
    steps:
      - 'If the solutions come from the intersection of $y = 2 + x - x^{2}$ and $y = L(x)$, then setting them equal must give $x^{2} - 2x - 1 = 0$.'
      - 'So $2 + x - x^{2} - L(x)$ must be a rearrangement of the given equation. Adding $x^{2} - 2x - 1 = 0$ to the curve''s right side does it.'
      - '$L(x) = (2 + x - x^{2}) + (x^{2} - 2x - 1) = 1 - x$.'
      - 'Check: $2 + x - x^{2} = 1 - x$ gives $-x^{2} + 2x + 1 = 0$, which is $x^{2} - 2x - 1 = 0$ ✓.'
      - 'The trap is option C, $y = x - 1$, which has both signs reversed. Its intersection gives $x^{2} - 3 = 0$ instead.'
    hint: 'Add the given equation''s left side to $2 + x - x^{2}$.'

  28:
    answer: D
    steps:
      - 'Write each term with the first term $a$ and common difference $d$: the $n$th term is $a + (n - 1)d$.'
      - 'The 8th and 9th terms are $a + 7d$ and $a + 8d$, so $2a + 15d = 72$.'
      - 'The 4th term is $a + 3d = -6$, so $2a + 6d = -12$.'
      - 'Subtract: $9d = 84$, giving $d = \tfrac{84}{9} = \tfrac{28}{3} = 9\tfrac{1}{3}$.'
