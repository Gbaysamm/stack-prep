#
# All 50 are answered. Of the 34 the key covers, 32 agree; Q25 and Q26 differ, and
# retranscribed_1989.yaml sets out why. Q14 rests on a reconstructed expression, which its
# note says plainly.
# Polished for a spoken lesson: each explanation opens, moves step by step, and closes.
format_version: 1
exam_year: 1989
subject: MATH

explanations:
  1:
    answer: C
    steps:
      - 'Ordering fractions is much less scary once they all look alike. Let''s put them on an equal footing first.'
      - 'Here''s the plan: fractions with different denominators are hard to compare by eye, so turn each into a decimal first. Then "descending" simply means each number is smaller than the one before.'
      - 'So the fractions become $\tfrac{9}{10} = 0.9$, $\tfrac{17}{20} = 0.85$, $\tfrac{4}{5} = 0.8$, $\tfrac{3}{4} = 0.75$ and $\tfrac{17}{10} = 1.7$.'
      - 'Now look at option C. It reads $0.9, 0.85, 0.8, 0.75$ — every number smaller than the one before it, so it is in descending order.'
      - 'Compare that with option A, which reads $0.9, 0.8, 0.75, 1.7$ — it falls and then jumps up at the end.'
      - 'Option B reads $0.8, 0.9, \ldots$ — it rises straight away.'
      - 'And option D reads $0.8, 0.9, 1.7, 0.75$ — it rises twice before falling.'
      - 'The trap is $\tfrac{17}{10}$, which looks similar to $\tfrac{17}{20}$ but is more than twice as big: a larger denominator means a *smaller* fraction, so $\tfrac{17}{20}$ is less than $\tfrac{17}{10}$. When in doubt, turn fractions into decimals and the order becomes clear.'
    hint: 'Try converting each fraction to a decimal, then check that every one is smaller than the last.'

  2:
    answer: A
    steps:
      - 'The numbers here look big and messy, but they tame quickly if we take them in a sensible order. Let''s go.'
      - 'Remember, multiplications and divisions in a chain can be done in any convenient order, so simplify the awkward numbers first.'
      - 'Start with $2{,}700{,}000 \times 0.03$. Multiplying by 0.03 is the same as multiplying by 3 and dividing by 100: $2{,}700{,}000 \div 100 = 27{,}000$, and $27{,}000 \times 3 = 81{,}000$.'
      - 'Now divide by 18,000: $\dfrac{81{,}000}{18{,}000} = \dfrac{81}{18} = 4.5$.'
      - 'Next, think about standard form. A number between 1 and 10 carries the power $10^{0}$, since $10^{0} = 1$.'
      - 'So the answer is $4.5 \times 10^{0}$.'
      - 'The trap is option C, $4.5 \times 10^{2}$, which is what you get by treating 0.03 as 3 — forgetting that multiplying by a number less than 1 makes the result smaller. Keep an eye on those small decimals and you''ll be fine.'
    hint: 'Work out $2{,}700{,}000 \times 0.03 = 81{,}000$ first, then divide by 18,000.'

  3:
    answer: C
    steps:
      - 'This question is really asking what 2,520 is built from. Let''s break it down piece by piece.'
      - 'First, a prime factor is a factor that is itself a prime number, so we break 2,520 down into primes by dividing by the smallest prime that works, over and over.'
      - 'Start with 2: $2520 \div 2 = 1260$; $1260 \div 2 = 630$; $630 \div 2 = 315$.'
      - '315 is odd, so now try 3: $315 \div 3 = 105$; $105 \div 3 = 35$.'
      - 'What''s left is $35 = 5 \times 7$, and both of those are prime.'
      - 'So $2520 = 2^{3} \times 3^{2} \times 5 \times 7$, and the distinct prime factors are 2, 3, 5 and 7.'
      - 'Let''s check: $8 \times 9 \times 5 \times 7 = 72 \times 35 = 2520$ ✓.'
      - 'The trap is options A, B and D, which all contain 9. Nine divides 2,520, but $9 = 3 \times 3$ is not prime — it is a factor, not a *prime* factor. Always ask whether each number on your list is truly prime.'
    hint: 'Keep dividing by 2, then 3, then 5, then 7 — and remember that 9 is not prime.'

  4:
    answer: A
    steps:
      - 'The trick with number bases is to go through base ten. Let''s do that step by step.'
      - 'So the route is: convert the given numeral to base ten, then convert that into the new base.'
      - 'In base twelve, $12_{12}$ means one twelve and two units: $1 \times 12 + 2 = 14$ in base ten.'
      - 'Now write 14 in base 7 by dividing by 7: $14 \div 7 = 2$ remainder 0, and $2 \div 7 = 0$ remainder 2.'
      - 'Reading the remainders upwards gives $20_{7}$.'
      - 'Let''s check: $20_{7} = 2 \times 7 + 0 = 14$ ✓.'
      - 'So $x = 20$.'
      - 'The trap is option C, 14 — the base-ten value, found halfway through. The question asks for the numeral in base 7, which needs the second conversion. So don''t stop at base ten; finish the journey.'
    hint: 'First find $12_{12} = 14$ in base ten; now write 14 in base 7.'

  5:
    answer: D
    steps:
      - 'Roots and powers stacked together can look frightening, but we''ll peel them off one layer at a time.'
      - 'Work from the inside out, and keep the number part and the letter part separate: roots and powers act on each of them.'
      - 'Inside is $64r^{-6}$. Its cube root takes the cube root of 64 and divides the index $-6$ by 3.'
      - 'So $\sqrt[3]{64} = 4$, since $4^{3} = 64$, and $\sqrt[3]{r^{-6}} = r^{-6/3} = r^{-2}$. The cube root is $4r^{-2}$.'
      - 'Now raise that to the power $\tfrac{1}{2}$, which means a square root: $\sqrt{4} = 2$ and $(r^{-2})^{1/2} = r^{-1}$.'
      - 'The result is $2r^{-1}$, and a negative index means a reciprocal: $2r^{-1} = \dfrac{2}{r}$.'
      - 'Let''s check with $r = 1$: the original is $(\sqrt[3]{64})^{1/2} = 4^{1/2} = 2$, and $\tfrac{2}{1} = 2$ ✓.'
      - 'The trap is option B, $2r$ — the negative index ignored. The $r$ started with a negative power, so it must end up in the denominator. Hold on to that minus sign and the rest follows.'
    hint: 'Take the cube root first: $4r^{-2}$. Then the square root: $2r^{-1}$.'

  6:
    answer: A
    steps:
      - 'This one tests whether you can tell significant figures from decimal places. Let''s round both ways carefully.'
      - 'The key point: they count from different starting points, so we round the number both ways and then subtract.'
      - 'Significant figures start at the first non-zero digit. In 0.007685 those digits are 7, 6, 8, 5. Keeping three (7, 6, 8), the next digit is 5, so round up: $0.00769$.'
      - 'Decimal places, on the other hand, count from the decimal point. Four places keeps 0.0076, and the next digit is 8, so round up: $0.0077$.'
      - 'Now subtract: $0.0077 - 0.00769 = 0.00001$.'
      - 'In index form, $0.00001 = 10^{-5}$.'
      - 'The trap is treating the two instructions as the same: three significant figures here is five decimal places, because of the two zeros in front of the 7. Remember, leading zeros never count as significant.'
    hint: 'Rounding to 3 s.f. gives 0.00769; rounding to 4 d.p. gives 0.0077.'

  7:
    answer: D
    steps:
      - 'Ratios with letters can feel abstract, so let''s make them concrete with real numbers.'
      - 'Here''s the idea: a ratio can be replaced by any pair of numbers in the same proportion, so choose actual values that fit each ratio and work with those.'
      - 'Take $a = 5$, $b = 8$, $x = 25$ and $y = 16$.'
      - 'Then $\dfrac{a}{x} = \dfrac{5}{25} = \dfrac{1}{5}$ and $\dfrac{b}{y} = \dfrac{8}{16} = \dfrac{1}{2}$.'
      - 'Now clear the fractions. The ratio $\tfrac{1}{5} : \tfrac{1}{2}$ becomes, after multiplying both parts by 10, $2 : 5$.'
      - 'You might wonder if that depends on our choice. It doesn''t: if $a = 5k$, $b = 8k$, $x = 25m$, $y = 16m$, the $k$ and $m$ cancel out of the ratio.'
      - 'The trap is option A, 125 : 128, which multiplies across ($5 \times 25 : 8 \times 16$) instead of dividing. Read the question carefully — it asks for $a$ over $x$, a division.'
    hint: 'Try $a = 5$, $b = 8$, $x = 25$, $y = 16$ and compare $\tfrac{5}{25}$ with $\tfrac{8}{16}$.'

  8:
    answer: B
    steps:
      - 'Simple interest questions come down to one formula. Let''s first work out exactly how much interest we need.'
      - 'The amount is the principal plus the interest, so "one and a half times the principal" means the interest alone equals half the principal.'
      - 'Half of ₦800 is ₦400, so the interest earned is ₦400.'
      - 'Now bring in the formula. Simple interest is $I = \dfrac{PRT}{100}$. Rearranged for time: $T = \dfrac{100I}{PR}$.'
      - 'Substitute: $T = \dfrac{100 \times 400}{800 \times 12.5} = \dfrac{40000}{10000} = 4$ years.'
      - 'Let''s check: $12\tfrac{1}{2}\%$ of ₦800 is ₦100 a year, so four years give ₦400, and $800 + 400 = 1200 = 1.5 \times 800$ ✓.'
      - 'The trap is option D, 8, the time for the money to *double*. A one-and-a-half-times amount needs only half as long. So always pull the interest out of the amount before you start.'
    hint: 'The interest is half of ₦800, and each year earns ₦100.'

  9:
    answer: D
    steps:
      - 'Percentages and areas together can trip anyone up. The whole question turns on one idea about squares.'
      - 'Here it is: surface area depends on the *square* of the diameter, so a change in area and a change in diameter are linked through a square root.'
      - 'An increase of 44% multiplies the area by 1.44.'
      - 'Since area is proportional to $d^{2}$, the diameter is multiplied by $\sqrt{1.44} = 1.2$.'
      - 'And multiplying by 1.2 is an increase of 20%.'
      - 'Let''s check: a diameter 1.2 times as big gives an area $1.2^{2} = 1.44$ times as big ✓.'
      - 'The trap is option A, 44% — assuming the diameter grows by the same percentage as the area. It is the square root of the scale factor, not the percentage, that carries across. Remember: lengths go with the square root of the area factor.'
    hint: 'The area scale factor is 1.44, so think about what the length scale factor must be: $\sqrt{1.44}$.'

  10:
    answer: D
    steps:
      - 'A surd in the denominator is the thing to deal with first. Once it''s gone, the rest falls into place.'
      - 'So rationalise it: multiply top and bottom by the conjugate $2 + \sqrt{3}$.'
      - 'The new denominator is $(2 - \sqrt{3})(2 + \sqrt{3}) = 4 - 3 = 1$.'
      - 'That''s lovely, because it means $\dfrac{1}{2 - \sqrt{3}} = 2 + \sqrt{3}$.'
      - 'Now subtract carefully: $4 - (2 + \sqrt{3}) = 4 - 2 - \sqrt{3} = 2 - \sqrt{3}$.'
      - 'A quick size check: $2 - \sqrt{3} \approx 0.27$, and directly $4 - \tfrac{1}{0.268} \approx 4 - 3.73 = 0.27$ ✓.'
      - 'The trap is option C, $-2 + \sqrt{3}$, which has both signs reversed — the result of forgetting that the minus in front of the bracket applies to *both* terms inside. Bracket it, then share the minus out.'
    hint: 'Rationalise first: $\tfrac{1}{2 - \sqrt{3}} = 2 + \sqrt{3}$, then subtract that from 4.'

  11:
    answer: A
    steps:
      - 'Logarithm equations get much friendlier once everything is squeezed into a single log. Let''s do that.'
      - 'We''ll combine them using $n\log a = \log a^{n}$ and $\log a + \log b = \log ab$.'
      - 'First, $3\log_{3}q = \log_{3}q^{3}$, so the equation becomes $\log_{3}p + \log_{3}q^{3} = 3$, that is $\log_{3}(pq^{3}) = 3$.'
      - 'Now undo the logarithm: $\log_{3}N = 3$ means $N = 3^{3}$. So $pq^{3} = 27$.'
      - 'Divide by $q^{3}$ — $p = \dfrac{27}{q^{3}} = \dfrac{3^{3}}{q^{3}} = \left(\dfrac{3}{q}\right)^{3}$.'
      - 'Let''s check with $q = 1$: then $p = 27$, and $\log_{3}27 + 3\log_{3}1 = 3 + 0 = 3$ ✓.'
      - 'The trap is option D, $\left(\tfrac{3}{q}\right)^{1/3}$ — the 3 in front of the logarithm treated as a cube root instead of a cube. A number in front of a log becomes a power, not a root.'
    hint: 'Try combining into $\log_{3}(pq^{3}) = 3$, so $pq^{3} = 27$.'

  12:
    answer: D
    steps:
      - 'This one is a quadratic in disguise. Once you see the disguise, it''s familiar ground.'
      - 'Notice that $9^{y}$ is $(3^{2})^{y} = (3^{y})^{2}$, so the equation is a quadratic in $3^{y}$.'
      - 'Let $u = 3^{y}$. The equation becomes $u^{2} - 4u + 3 = 0$.'
      - 'Factorise: $(u - 1)(u - 3) = 0$, so $u = 1$ or $u = 3$.'
      - 'Now undo the substitution. $3^{y} = 1$ gives $y = 0$, since any number to the power 0 is 1.'
      - 'And $3^{y} = 3$ gives $y = 1$.'
      - 'Let''s check $y = 1$ — $9 - 12 + 3 = 0$ ✓. And $y = 0$, which gives $1 - 4 + 3 = 0$ ✓.'
      - 'The trap is option C, "1 and 3" — the values of $u = 3^{y}$, left without converting back to $y$. Whenever you substitute, remember to go back to the original letter at the end.'
    hint: 'Let $u = 3^{y}$; then $9^{y} = u^{2}$.'

  13:
    answer: B
    steps:
      - 'Changing the subject is about undoing things in the right order. Let''s take it one layer at a time.'
      - 'The plan: to make $R$ the subject, first remove the square root by squaring, then clear the fraction, then gather the $R$ terms.'
      - 'Square both sides: $S^{2} = \dfrac{2R + T}{2RT}$.'
      - 'Next, multiply by $2RT$ — $2RTS^{2} = 2R + T$.'
      - 'Now gather the $R$ terms on one side: $2RTS^{2} - 2R = T$.'
      - 'Factor out $2R$ — $2R(TS^{2} - 1) = T$.'
      - 'Then divide: $R = \dfrac{T}{2(TS^{2} - 1)}$.'
      - 'Let''s check with $R = 1$, $T = 2$: then $S^{2} = \tfrac{4}{4} = 1$, and the formula gives $\tfrac{2}{2(2 - 1)} = 1$ ✓.'
      - 'The trap is option A, which loses the factor 2 when $2R$ is taken out. Factor out the whole common factor, number included — that''s the habit that gets this right.'
    hint: 'Square, multiply by $2RT$, then factor $2R$ out of $2RTS^{2} - 2R$.'

  14:
    answer: A
    steps:
      - 'A lot of students slip on this one, and it''s almost always over a sign. Let''s go slowly.'
      - 'With a negative fraction to substitute, work out each power of $x$ separately and keep careful track of the signs.'
      - 'With $x = -\tfrac{3}{4}$ — $x^{3} = -\tfrac{27}{64}$, since an odd power of a negative number stays negative.'
      - 'Next, $x^{2} = \tfrac{9}{16}$, positive because the power is even.'
      - 'And $x^{-3} = \dfrac{1}{x^{3}} = -\dfrac{64}{27}$.'
      - 'First term: $\tfrac{32}{81} \times \left(-\tfrac{27}{64}\right) = -\tfrac{1}{6}$.'
      - 'Second term: $\tfrac{64}{27} \times \tfrac{9}{16} = \tfrac{4}{3}$, and it is subtracted.'
      - 'Watch this part carefully. Third term: $\tfrac{81}{16} \times \left(-\tfrac{64}{27}\right) = -12$, and it is subtracted, which adds 12.'
      - 'Total: $-\tfrac{1}{6} - \tfrac{4}{3} + 12 = -\tfrac{1}{6} - \tfrac{8}{6} + \tfrac{72}{6} = \tfrac{63}{6} = 10\tfrac{1}{2}$.'
      - 'The trap is the double negative in the last term: subtracting $-12$ adds 12. Getting that sign wrong gives $-13\tfrac{1}{2}$, option D. Two minuses make a plus — keep that in front of you.'
    hint: 'Find $x^{3}$, $x^{2}$ and $x^{-3}$ first, then watch the minus signs.'

  15:
    answer: B
    steps:
      - 'This is a variation question with a fixed part hiding inside it. Let''s write it as an equation first.'
      - '"Partly constant and partly varies as" means the cost has the form $C = a + bn$, where $a$ is the fixed part and $b$ the cost per student.'
      - 'The two facts give two equations: $74 = a + 20b$ and $96 = a + 30b$.'
      - 'Subtract the first from the second: $22 = 10b$, so $b = 2.2$.'
      - 'Then $a = 74 - 20(2.2) = 74 - 44 = 30$.'
      - 'Now for 15 students: $C = 30 + 15(2.2) = 30 + 33 = 63$.'
      - 'Let''s check against the second fact: $30 + 30(2.2) = 30 + 66 = 96$ ✓.'
      - 'The trap is treating the cost as purely proportional: $74 \times \tfrac{15}{20} = 55.50$, not offered. The fixed ₦30 does not shrink with fewer students. Whenever you see "partly constant", start with $a + bn$.'
    hint: 'Write $C = a + bn$ and subtract the two equations to find $b$.'

  16:
    answer: A
    steps:
      - 'Function questions like this reward tidy working. We''ll substitute, expand, and collect.'
      - 'To find $f(x + 1)$, replace every $x$ in the rule with the whole bracket $(x + 1)$.'
      - 'That gives $f(x + 1) = 2(x + 1)^{2} - 5(x + 1) + 3$.'
      - 'Expand the square first: $(x + 1)^{2} = x^{2} + 2x + 1$, so $2(x + 1)^{2} = 2x^{2} + 4x + 2$.'
      - 'Then the middle term: $-5(x + 1) = -5x - 5$.'
      - 'Now add everything: $2x^{2} + 4x + 2 - 5x - 5 + 3 = 2x^{2} - x + 0$.'
      - 'So $f(x + 1) = 2x^{2} - x$.'
      - 'Let''s check with $x = 0$ — $f(1) = 2 - 5 + 3 = 0$, and $2(0) - 0 = 0$ ✓.'
      - 'The trap is option B, $2x^{2} - x + 10$ — the constant terms added as $2 + 5 + 3$ instead of $2 - 5 + 3$. Carry each sign along with its number and you''ll avoid it.'
    hint: 'Substitute $(x + 1)$ everywhere; the constants are $2 - 5 + 3$.'

  17:
    answer: C
    steps:
      - 'Here the whole question turns on one fact about powers, so let''s start there.'
      - 'A power of 2 equals 1 only when the index is 0, because $2^{0} = 1$ and every other power of 2 is bigger or smaller than 1.'
      - 'So $x^{3} - x^{2} - 2x = 0$.'
      - 'Factor out $x$ — $x(x^{2} - x - 2) = 0$, and the quadratic factorises as $(x - 2)(x + 1)$.'
      - 'That gives $x = 0$, $x = 2$ or $x = -1$.'
      - 'The question wants the positive number, which is $x = 2$.'
      - 'Let''s check: $8 - 4 - 4 = 0$, and $2^{0} = 1$ ✓.'
      - 'The trap is option D, 1. Substituting it gives an index of $1 - 1 - 2 = -2$, and $2^{-2} = \tfrac{1}{4}$, not 1. So remember: a power equals 1 only when its index is zero.'
    hint: 'Ask yourself: $2^{\text{something}} = 1$ only when the something is what?'

  18:
    answer: D
    steps:
      - 'Algebraic fractions simplify beautifully once you factorise. Let''s do the top and bottom separately.'
      - 'The rule is: factorise the top and the bottom completely, then cancel what they share.'
      - 'The numerator $324 - 4x^{2}$ has a common factor 4: $4(81 - x^{2})$. And $81 - x^{2}$ is a difference of two squares, $(9 - x)(9 + x)$.'
      - 'The denominator is $2x + 18 = 2(x + 9)$.'
      - 'So the fraction is $\dfrac{4(9 - x)(9 + x)}{2(x + 9)}$.'
      - 'Now cancel $(9 + x)$ with $(x + 9)$, and $\tfrac{4}{2} = 2$: the result is $2(9 - x)$.'
      - 'And $2(9 - x) = -2(x - 9)$, which is how option D writes it.'
      - 'Let''s check with $x = 0$: the original is $\tfrac{324}{18} = 18$, and $-2(0 - 9) = 18$ ✓.'
      - 'The trap is option A, $2(x - 9)$, with the wrong sign: $9 - x$ and $x - 9$ are negatives of each other. Flipping a bracket always costs a minus sign.'
    hint: 'Notice $324 - 4x^{2} = 4(9 - x)(9 + x)$ and $2x + 18 = 2(x + 9)$.'

  19:
    answer: C
    steps:
      - 'Four terms and no obvious common factor — that''s a signal to group. Let''s pair them up.'
      - 'Group as $(y^{3} - 4y) + (xy^{3} - 4xy)$.'
      - 'The first pair is $y(y^{2} - 4)$ and the second is $xy(y^{2} - 4)$.'
      - 'Now $(y^{2} - 4)$ is common: $(y^{2} - 4)(y + xy)$.'
      - 'But we''re not finished. Factorising completely means going further. $y + xy = y(1 + x)$, and $y^{2} - 4 = (y + 2)(y - 2)$.'
      - 'So the full factorisation is $y(1 + x)(y + 2)(y - 2)$.'
      - 'The trap is option B, $(y + xy)(y + 2)(y - 2)$. It is equal in value, but the bracket $(y + xy)$ still contains the common factor $y$, so it is not *completely* factorised. Always look inside each bracket once more before you stop.'
    hint: 'Group into $y(y^{2} - 4) + xy(y^{2} - 4)$, then factorise every bracket fully.'

  20:
    answer: C
    steps:
      - 'Negative indices make this look harder than it is. Underneath, it''s a pattern you know.'
      - 'Start by rewriting the negative indices as fractions: $8^{-1} = \tfrac{1}{8} = \left(\tfrac{1}{2}\right)^{3}$ and $2^{-1} = \tfrac{1}{2}$.'
      - 'So the expression is $x^{3} - \left(\tfrac{1}{2}\right)^{3}$, a difference of two cubes.'
      - 'The rule is $a^{3} - b^{3} = (a - b)(a^{2} + ab + b^{2})$.'
      - 'With $a = x$ and $b = \tfrac{1}{2}$: the other factor is $x^{2} + \tfrac{1}{2}x + \tfrac{1}{4}$.'
      - 'In the index form the options use, that is $x^{2} + 2^{-1}x + 4^{-1}$.'
      - 'Let''s check by multiplying: $(x - \tfrac{1}{2})(x^{2} + \tfrac{1}{2}x + \tfrac{1}{4}) = x^{3} + \tfrac{1}{2}x^{2} + \tfrac{1}{4}x - \tfrac{1}{2}x^{2} - \tfrac{1}{4}x - \tfrac{1}{8} = x^{3} - \tfrac{1}{8}$ ✓.'
      - 'The trap is options A and B, which end in $-4^{-1}$. In a difference of cubes every sign in the quadratic factor is positive. Learn that pattern once and it serves you for good.'
    hint: 'Think difference of cubes: $a^{3} - b^{3} = (a - b)(a^{2} + ab + b^{2})$ with $b = \tfrac{1}{2}$.'

  21:
    answer: B
    steps:
      - 'This one hides a perfect square inside it. Let''s bring it into the open.'
      - 'First rearrange so that the terms in $a$ and $b$ sit together: $4a^{2} + 12ab + 9b^{2} - c^{2}$.'
      - 'Now notice the first three terms form a perfect square: $(2a + 3b)^{2} = 4a^{2} + 12ab + 9b^{2}$.'
      - 'So the expression is $(2a + 3b)^{2} - c^{2}$, a difference of two squares.'
      - 'Using $A^{2} - B^{2} = (A - B)(A + B)$ — $(2a + 3b - c)(2a + 3b + c)$.'
      - 'Let''s check by expanding: $(2a + 3b)^{2} - c^{2}$ gives back $4a^{2} + 12ab + 9b^{2} - c^{2}$ ✓.'
      - 'The trap is option C, $(2a - 3b - c)(2a - 3b + c)$. That would come from $(2a - 3b)^{2}$, whose middle term is $-12ab$ — the wrong sign. Let the sign of the middle term tell you which square it is.'
    hint: 'Try spotting that $4a^{2} + 12ab + 9b^{2} = (2a + 3b)^{2}$.'

  22:
    answer: A
    steps:
      - 'Comparing coefficients is a matter of expanding carefully and lining things up. Let''s do it.'
      - 'The plan: expand the left side fully and then match the coefficients of $xy$ and $y^{2}$.'
      - 'First, $(3y - 4x)^{2} = 9y^{2} - 24xy + 16x^{2}$.'
      - 'Halving it: $\tfrac{1}{2}(3y - 4x)^{2} = \tfrac{9}{2}y^{2} - 12xy + 8x^{2}$.'
      - 'Now compare with $8x^{2} + Kxy + Ly^{2}$: the $x^{2}$ terms match (8), $K = -12$ and $L = \tfrac{9}{2}$.'
      - 'That matching $x^{2}$ term is a useful check that the expansion is right.'
      - 'The trap is option D, $12$ and $\tfrac{9}{2}$ — the sign of the middle term lost. Squaring a difference gives a *negative* middle term. Keep that minus and you have it.'
    hint: 'Expand $(3y - 4x)^{2}$, halve it, and read off the coefficients.'

  23:
    answer: D
    steps:
      - 'Don''t worry about the negative powers — one substitution turns this into ordinary simultaneous equations.'
      - 'The unknowns appear as $x^{-1}$ and $y^{-1}$, so treat those as the unknowns: let $u = \tfrac{1}{x}$ and $v = \tfrac{1}{y}$.'
      - 'The equations become $2u - 3v = 4$ and $4u + v = 1$.'
      - 'From the second, $v = 1 - 4u$. Substitute into the first: $2u - 3(1 - 4u) = 4$.'
      - 'Expand: $2u - 3 + 12u = 4$, so $14u = 7$ and $u = \tfrac{1}{2}$.'
      - 'Then $v = 1 - 2 = -1$.'
      - 'Now undo the substitution: $x = \tfrac{1}{u} = 2$ and $y = \tfrac{1}{v} = -1$.'
      - 'Let''s check in the first equation: $2(\tfrac{1}{2}) - 3(-1) = 1 + 3 = 4$ ✓.'
      - 'The trap is option A, "$-1, 2$" — the right numbers in the wrong order. The question asks for $x$ and $y$ "respectively". Always match your answers to the order the question asks for.'
    hint: 'Let $u = x^{-1}$ and $v = y^{-1}$; solve, then take reciprocals.'

  24:
    answer: A
    steps:
