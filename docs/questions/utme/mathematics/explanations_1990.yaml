      - 'Now for the slant height, found from a right-angled triangle down the side of the frustum. Its vertical leg is the height, 6 cm.'
      - 'Its horizontal leg is how far the side moves outwards from top to bottom — the difference of the radii, $6 - 4 = 2$ cm.'
      - 'So $l = \sqrt{6^{2} + 2^{2}} = \sqrt{36 + 4} = \sqrt{40} = 2\sqrt{10}$ cm.'
      - 'Then the curved surface area is $\pi(4 + 6)(2\sqrt{10}) = 20\sqrt{10}\,\pi\ \text{cm}^{2}$, about $198.7\ \text{cm}^{2}$.'
      - 'The trap is option D, $60\pi$ — the vertical height 6 used in place of the slant height. The surface lies along the slope, so it is the slope''s length that matters. Whenever it''s a curved surface, reach for the slant.'
    hint: 'The slant height is $\sqrt{6^{2} + 2^{2}}$; then use $\pi(r_{1} + r_{2})l$.'

  45:
    answer: B
    steps:
      - 'Locus questions are about picturing where a moving point is allowed to be. Let''s picture this one.'
      - 'The distance from a point to a line is measured along the perpendicular. So think of the points whose perpendicular distances to the two lines are equal.'
      - 'Take a point on the line that splits the angle between the two lines in half. Drop perpendiculars to each line: the two right-angled triangles share a hypotenuse and have equal angles, so they are congruent, and the two distances are equal.'
      - 'Conversely, any point equidistant from the two lines must lie on such a bisecting line.'
      - 'So the locus is the bisector of the angles between the lines — in fact both bisectors, which cross at right angles at the intersection point.'
      - 'The trap is option A, the perpendicular bisector. That is the locus of points equidistant from two *points*; here the fixed objects are two *lines*, and the answer is the angle bisector. Two points, perpendicular bisector; two lines, angle bisector.'
    hint: 'Being equidistant from two lines means lying on a line that halves the angle between them.'

  46:
    answer: D
    steps:
      - 'Pie chart angles are fractions of a full turn. Let''s find how many degrees each unit is worth.'
      - 'In a pie chart, each number''s sector angle is its fraction of the total, times $360^{\circ}$.'
      - 'The total is $4 + 16 + 30 + 20 + 10 + 14 + 26 = 120$.'
      - 'The numbers equal to or greater than 16 are 16, 30, 20 and 26, which total 92.'
      - 'So their sectors together take up $\dfrac{92}{120} \times 360^{\circ} = 92 \times 3 = 276^{\circ}$.'
      - 'Notice that $360 \div 120 = 3$, so every unit in this chart is worth exactly $3^{\circ}$.'
      - 'The trap is option C, $92^{\circ}$ — the sum of the numbers, not the sum of their angles. It needs converting at $3^{\circ}$ per unit. Numbers and degrees are different, so always convert.'
    hint: 'The total is 120, so each unit is $3^{\circ}$; the chosen numbers add to 92.'

  47:
    answer: D
    steps:
      - 'Mean questions are easiest when you work with totals instead. Let''s do that.'
      - 'A mean times the number of values gives the total, so work with totals — they change by exactly the number added.'
      - 'Ten numbers with mean 16 total $10 \times 16 = 160$.'
      - 'Eleven numbers with mean 18 total $11 \times 18 = 198$.'
      - 'So the eleventh number is the difference: $198 - 160 = 38$.'
      - 'Let''s check: $\tfrac{160 + 38}{11} = \tfrac{198}{11} = 18$ ✓.'
      - 'The trap is option C, 18. Adding a number equal to the new mean would not raise the mean at all; to pull the average of eleven numbers up by 2, the new one must be well above 18. Think in totals and it becomes clear.'
    hint: 'Find the totals: $10 \times 16$ before, $11 \times 18$ after.'

  48:
    answer: B
    steps:
      - 'An unknown frequency in a table — we''ll build an equation from the mean. Let''s set it up.'
      - 'The mean of a frequency table is $\dfrac{\sum fx}{\sum f}$. Write both sums with $x$ in them, then set the mean to 3.5.'
      - 'The frequencies total $1 + 4 + 5 + 6 + x + 2 = 18 + x$.'
      - 'The products: $1(1) + 2(4) + 3(5) + 4(6) + 5x + 6(2) = 1 + 8 + 15 + 24 + 5x + 12 = 60 + 5x$.'
      - 'So $\dfrac{60 + 5x}{18 + x} = 3.5$, giving $60 + 5x = 63 + 3.5x$.'
      - 'Then $1.5x = 3$ and $x = 2$.'
      - 'Let''s check: $\tfrac{60 + 10}{20} = 3.5$ ✓.'
      - 'The trap is forgetting that $x$ is a *frequency*: it must appear in the total $\sum f$ as well as in $\sum fx$. Leaving it out of the denominator gives $\tfrac{60 + 5x}{18} = 3.5$, so $x = 0.6$ — not a possible number of students. A frequency always counts in the total.'
    hint: 'Set up $\tfrac{60 + 5x}{18 + x} = 3.5$.'

  49:
    answer: C
    steps:
      - 'With only four numbers, the safest approach is to list every possible pair. Let''s do that.'
      - 'List every pair that could be removed, since the order of removal does not matter.'
      - 'From 1, 2, 3 and 4 the pairs are: $\{1,2\}, \{1,3\}, \{1,4\}, \{2,3\}, \{2,4\}, \{3,4\}$ — six in all.'
      - 'Their sums are 3, 4, 5, 5, 6 and 7.'
      - 'The even sums are 4 (from $\{1,3\}$) and 6 (from $\{2,4\}$): two pairs.'
      - 'So the probability is $\tfrac{2}{6} = \tfrac{1}{3}$.'
      - 'Here''s the reason: a sum of two numbers is even only when both are odd or both are even, and there is just one pair of each here.'
      - 'The trap is option B, $\tfrac{1}{2}$ — assuming even and odd sums are equally likely. With two odd and two even numbers, mixed pairs (which give odd sums) outnumber matched ones four to two. Listing the cases beats guessing every time.'
    hint: 'There are six possible pairs; the sum is even only for $\{1,3\}$ and $\{2,4\}$.'

  50:
    answer: C
    steps:
      - 'Probability is careful counting, top and bottom. Here the counting of the range is where the danger lies.'
      - 'A probability here is the number of favourable choices over the number of possible choices, so both counts must be exact.'
      - 'First, count the possible numbers carefully: "from 41 to 56" includes both ends.'
      - 'The count is $56 - 41 + 1 = 16$ — the $+1$ because both 41 and 56 are included. (Counting a short case confirms the rule: from 1 to 3 there are $3 - 1 + 1 = 3$ numbers.)'
      - 'Now the favourable ones. The multiples of 9 in that range are $45 = 9 \times 5$ and $54 = 9 \times 6$. The neighbours, $36$ and $63$, lie outside it.'
      - 'So the probability is $\tfrac{2}{16} = \tfrac{1}{8}$.'
      - 'The trap is option B, $\tfrac{2}{15}$, which counts the numbers as $56 - 41 = 15$ and forgets the $+1$ — the classic fence-post error. Option D, $\tfrac{7}{8}$, is the probability of *not* getting a multiple of 9. When both ends are included, add one.'
    hint: 'There are $56 - 41 + 1 = 16$ numbers, and two of them are multiples of 9.'
