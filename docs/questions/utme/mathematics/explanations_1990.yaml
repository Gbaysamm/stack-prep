#
# All 50 are answered. Of the 31 the key covers, 29 agree; Q13 and Q50 differ, and
# retranscribed_1990.yaml sets out why. Where a question rests on a repaired stem, option or
# figure, that file says exactly what was changed.
format_version: 1
exam_year: 1990
subject: MATH

explanations:
  1:
    answer: B
    steps:
      - 'Treat the top and the bottom separately, turning every mixed number into an improper fraction first — that is always the safest way to combine them.'
      - 'The numerator: $4\tfrac{3}{4} - 6\tfrac{1}{4} = \tfrac{19}{4} - \tfrac{25}{4} = -\tfrac{6}{4} = -\tfrac{3}{2}$.'
      - 'The denominator uses "of", which means multiply: $4\tfrac{1}{5} \text{ of } 1\tfrac{1}{4} = \tfrac{21}{5} \times \tfrac{5}{4} = \tfrac{21}{4}$.'
      - 'Now divide: $-\tfrac{3}{2} \div \tfrac{21}{4} = -\tfrac{3}{2} \times \tfrac{4}{21}$.'
      - 'Cancel before multiplying: 3 goes into 21 seven times, and 2 goes into 4 twice, leaving $-\tfrac{1}{1} \times \tfrac{2}{7} = -\tfrac{2}{7}$.'
      - 'A size check: the top is $-1.5$ and the bottom $5.25$, so the answer should be a small negative number, about $-0.29$; and $-\tfrac{2}{7} \approx -0.286$ ✓.'
      - 'The trap is option D, $\tfrac{10}{21}$, which is positive. The numerator subtracts a larger number from a smaller one, so the whole fraction must come out negative; any positive option can be ruled out before doing any arithmetic.'
    hint: 'Numerator $\tfrac{19}{4} - \tfrac{25}{4}$; "of" in the denominator means multiply.'

  2:
    answer: A
    steps:
      - 'The highest common factor is found by factorising each expression completely and keeping only what the two share.'
      - 'The first: $a^{2}bx + abx^{2}$ has $abx$ in both terms, so it is $abx(a + x)$.'
      - 'The second: $a^{2}b - b^{3}$ has $b$ in both terms, so it is $b(a^{2} - b^{2}) = b(a - b)(a + b)$.'
      - 'Line the factors up: the first has $a$, $b$, $x$ and $(a + x)$; the second has $b$, $(a - b)$ and $(a + b)$.'
      - 'The only factor that appears in both lists is $b$.'
      - 'So the H.C.F. is $b$.'
      - 'The trap is option B, $a + b$. It appears in the second expression, but the first contains $a + x$, not $a + b$ — the two brackets look alike and are not the same.'
    hint: 'Factorise both fully: $abx(a + x)$ and $b(a - b)(a + b)$.'

  3:
    answer: D
    steps:
      - 'Deal with the bracket first, then multiply, then round.'
      - 'Squaring a power of ten doubles its index: $(3 \times 10^{-3})^{2} = 9 \times 10^{-6}$.'
      - 'So the product is $241.34 \times 9 \times 10^{-6}$.'
      - 'First $241.34 \times 9 = 2172.06$.'
      - 'Then multiply by $10^{-6}$, moving the decimal point six places left: $0.00217206$.'
      - 'For 4 significant figures, count from the first non-zero digit, the 2: the four are 2, 1, 7, 2, and the next digit is 0, so nothing rounds up. The answer is $0.002172$.'
      - 'The trap is option B, $0.001448$. It comes from $241.34 \times 6 \times 10^{-6}$ — squaring the bracket by doubling the 3 instead of squaring it. $3^{2}$ is 9, not 6.'
    hint: '$(3 \times 10^{-3})^{2} = 9 \times 10^{-6}$; then multiply and keep four significant figures.'

  4:
    answer: A
    steps:
      - 'Simple interest follows $I = \dfrac{PRT}{100}$, where $P$ is the principal, $R$ the rate per year and $T$ the time in years. Rearranged for the rate: $R = \dfrac{100I}{PT}$.'
      - 'Here $I = 7.50$, $P = 100$ and $T = 5$.'
      - 'So $R = \dfrac{100 \times 7.50}{100 \times 5} = \dfrac{750}{500} = 1.5$.'
      - 'The rate is $1\tfrac{1}{2}\%$ per year.'
      - 'Check: $1.5\%$ of ₦100 is ₦1.50 a year, and over 5 years that is ₦7.50 ✓.'
      - 'The trap is forgetting the 5 years. ₦7.50 on ₦100 is $7.5\%$ in total, but that is spread over five years; a rate is always per year, so it must be divided by 5.'
    hint: 'Use $R = \dfrac{100I}{PT}$ with $T = 5$.'

  5:
    answer: A
    steps:
      - 'The phrase "of the remainder" is the key: the second child''s fraction applies to what is left, not to the whole basket.'
      - 'The first child takes $\tfrac{1}{4}$, so the remainder is $1 - \tfrac{1}{4} = \tfrac{3}{4}$ of the basket.'
      - 'The second takes $\tfrac{3}{4}$ of that remainder: $\tfrac{3}{4} \times \tfrac{3}{4} = \tfrac{9}{16}$ of the basket.'
      - 'The third takes whatever is left: $1 - \tfrac{1}{4} - \tfrac{9}{16} = \tfrac{16}{16} - \tfrac{4}{16} - \tfrac{9}{16} = \tfrac{3}{16}$.'
      - 'Another way to see it: after the second child, a quarter of the remainder is left, and $\tfrac{1}{4} \times \tfrac{3}{4} = \tfrac{3}{16}$ ✓.'
      - 'The trap is option C, $\tfrac{9}{16}$ — the *second* child''s share, found on the way and easy to write down as the answer.'
    hint: 'The second child takes $\tfrac{3}{4}$ of $\tfrac{3}{4}$; the third takes what is left.'

  6:
    answer: C
    steps:
      - 'Rewrite each decimal in standard form so that the digits and the powers of ten can be handled separately.'
      - 'The numerator is $(2.75 \times 10^{-3}) \times (6.4 \times 10^{-3})$. The digits give $2.75 \times 6.4 = 17.6$, and the powers give $10^{-6}$.'
      - 'The denominator is $(2.5 \times 10^{-2}) \times (8 \times 10^{-2})$. The digits give $2.5 \times 8 = 20$, and the powers give $10^{-4}$.'
      - 'Divide the digits: $17.6 \div 20 = 0.88$. Divide the powers: $10^{-6} \div 10^{-4} = 10^{-2}$.'
      - 'So the value is $0.88 \times 10^{-2}$, which in standard form is $8.8 \times 10^{-3}$.'
      - 'Check directly: $0.00275 \times 0.0064 = 0.0000176$ and $0.025 \times 0.08 = 0.002$, and $0.0000176 \div 0.002 = 0.0088$ ✓.'
      - 'The trap is option A, $8.8 \times 10^{-1}$, which is off by a factor of a hundred. Keeping track of the powers of ten separately is what prevents this.'
    hint: 'Numerator $17.6 \times 10^{-6}$, denominator $20 \times 10^{-4}$.'

  7:
    answer: B
    steps:
      - 'Work out what fraction of the whole profit the third brother received; then his ₦12,000 fixes the total.'
      - 'The first receives $\tfrac{1}{3}$, leaving $\tfrac{2}{3}$.'
      - 'The second receives $\tfrac{2}{3}$ of that remainder: $\tfrac{2}{3} \times \tfrac{2}{3} = \tfrac{4}{9}$ of the whole.'
      - 'The third receives the rest: $1 - \tfrac{1}{3} - \tfrac{4}{9} = \tfrac{9}{9} - \tfrac{3}{9} - \tfrac{4}{9} = \tfrac{2}{9}$.'
      - 'So $\tfrac{2}{9}$ of the profit is ₦12,000, making $\tfrac{1}{9}$ equal to ₦6,000 and the whole profit $9 \times 6000 = ₦54{,}000$.'
      - 'Check the three shares: ₦18,000, then $\tfrac{2}{3}$ of ₦36,000 = ₦24,000, then ₦12,000. They add to ₦54,000 ✓.'
      - 'The trap is reading "$\tfrac{2}{3}$ of the remainder" as $\tfrac{2}{3}$ of the whole profit. Then the first two shares would be $\tfrac{1}{3} + \tfrac{2}{3} = 1$, leaving nothing for the third brother at all — a sign the reading is wrong.'
    hint: 'The third brother''s share is $1 - \tfrac{1}{3} - \tfrac{4}{9} = \tfrac{2}{9}$ of the profit.'

  8:
    answer: C
    steps:
      - 'Nested radicals are simplified from the inside out: each inner root, once found, joins the terms of the one around it.'
      - 'Innermost: $\sqrt{100r^{8}} = 10r^{4}$, since $(10r^{4})^{2} = 100r^{8}$.'
      - 'Next layer: $71r^{4} + 10r^{4} = 81r^{4}$, and $\sqrt{81r^{4}} = 9r^{2}$.'
      - 'Outer layer: $160r^{2} + 9r^{2} = 169r^{2}$, and $\sqrt{169r^{2}} = 13r$.'
      - 'Each step produces a perfect square, which is the sign that the question was built to come out neatly — 81 and 169 are $9^{2}$ and $13^{2}$.'
      - 'The trap is option A, $9r^{2}$, the value of the *middle* radical. It is correct as far as it goes, but there is still one more root to take.'
    hint: 'Work from the inside: $10r^{4}$, then $9r^{2}$, then $\sqrt{169r^{2}}$.'

  9:
    answer: A
    steps:
      - 'Surds combine only when they share the same root — like terms in algebra — so write both terms as multiples of $\sqrt{3}$.'
      - 'For $\sqrt{27}$, pull out the largest square factor: $27 = 9 \times 3$, so $\sqrt{27} = \sqrt{9}\sqrt{3} = 3\sqrt{3}$.'
      - 'For $\dfrac{3}{\sqrt{3}}$, rationalise the denominator: multiply top and bottom by $\sqrt{3}$ to get $\dfrac{3\sqrt{3}}{3}$.'
      - 'The 3s cancel, leaving $\sqrt{3}$. (A shortcut: $3 = \sqrt{3} \times \sqrt{3}$, so $\tfrac{3}{\sqrt{3}} = \sqrt{3}$ directly.)'
      - 'Now both are multiples of $\sqrt{3}$: $3\sqrt{3} + 1\sqrt{3} = 4\sqrt{3}$.'
      - 'Numerical check: $\sqrt{27} \approx 5.196$ and $\tfrac{3}{1.732} \approx 1.732$, total $6.928$; and $4\sqrt{3} \approx 6.928$ ✓.'
      - 'The trap is option C, $3\sqrt{3}$, which is $\sqrt{27}$ alone with the second term dropped.'
    hint: '$\sqrt{27} = 3\sqrt{3}$ and $\tfrac{3}{\sqrt{3}} = \sqrt{3}$.'

  10:
    answer: A
    steps:
      - 'Combine all the logarithms into one using the laws $n\log a = \log a^{n}$, $\log a + \log b = \log ab$ and $\log a - \log b = \log\tfrac{a}{b}$.'
      - '$3\log_{6}9 = \log_{6}9^{3} = \log_{6}729$.'
      - 'The whole expression is $\log_{6}\dfrac{729 \times 12 \times 64}{72}$.'
      - 'Simplify: $\tfrac{12}{72} = \tfrac{1}{6}$, so this is $\log_{6}\dfrac{729 \times 64}{6}$. And $729 \times 64 = 46656$, and $46656 \div 6 = 7776$.'
      - 'So the expression equals $\log_{6}7776$.'
      - 'Now, $7776 = 6^{5}$ (since $6^{2} = 36$, $6^{3} = 216$, $6^{4} = 1296$, $6^{5} = 7776$).'
      - 'Therefore $\log_{6}7776 = 5$.'
      - 'The trap is option B, 7776 — the number inside the logarithm, not the logarithm itself. The last step, recognising $7776$ as $6^{5}$, turns it into the answer.'
    hint: 'Combine into $\log_{6}7776$, and note $6^{5} = 7776$.'

  11:
    answer: C
    steps:
      - 'A negative index means a reciprocal, so first rewrite each term inside the bracket.'
      - '$x^{-1} = \dfrac{1}{x}$, so $\dfrac{1}{x^{-1}} = \dfrac{1}{1/x} = x$. In the same way $\dfrac{1}{y^{-1}} = y$.'
      - 'The bracket is therefore $x + y$.'
      - 'The outer index $-1$ turns it upside down: $(x + y)^{-1} = \dfrac{1}{x + y}$.'
      - 'Check with $x = 2$, $y = 3$: inside the bracket, $\tfrac{1}{1/2} + \tfrac{1}{1/3} = 2 + 3 = 5$, and $5^{-1} = \tfrac{1}{5} = \tfrac{1}{2 + 3}$ ✓.'
      - 'The trap is option D, $(xy)^{-1}$. It treats the $+$ as though it were $\times$ — but reciprocals of a sum do not split into a product. With $x = 2$, $y = 3$ it gives $\tfrac{1}{6}$, not $\tfrac{1}{5}$.'
    hint: '$\dfrac{1}{x^{-1}} = x$, so the bracket is $x + y$; then take its reciprocal.'

  12:
    answer: D
    steps:
      - 'Substitute carefully, working out each term separately and watching the signs — two of the three values are negative.'
      - '$ab^{2} = 2 \times (-2)^{2} = 2 \times 4 = 8$.'
      - '$bc^{2} = (-2) \times \left(-\tfrac{1}{2}\right)^{2} = (-2) \times \tfrac{1}{4} = -\tfrac{1}{2}$.'
      - 'So the first bracket is $8 - \left(-\tfrac{1}{2}\right) = 8\tfrac{1}{2}$.'
      - '$a^{2}c = 4 \times \left(-\tfrac{1}{2}\right) = -2$, and $abc = 2 \times (-2) \times \left(-\tfrac{1}{2}\right) = 2$.'
      - 'So the second bracket is $-2 - 2 = -4$.'
      - 'The product is $8\tfrac{1}{2} \times (-4) = -34$.'
      - 'The trap is option C, $-30$. It comes from taking $bc^{2}$ as $+\tfrac{1}{2}$, making the first bracket $7\tfrac{1}{2}$ instead of $8\tfrac{1}{2}$. Subtracting a negative number adds it.'
    hint: 'The first bracket is $8 - (-\tfrac{1}{2})$; the second is $-2 - 2$.'

  13:
    answer: C
    steps:
      - 'Write each variation as an equation with its own constant, then substitute one into the other to eliminate $X$.'
      - '"$Y$ varies inversely as $X^{2}$" means $Y = \dfrac{k}{X^{2}}$.'
      - '"$X$ varies directly as $Z^{2}$" means $X = mZ^{2}$.'
      - 'Substitute: $Y = \dfrac{k}{(mZ^{2})^{2}} = \dfrac{k}{m^{2}Z^{4}}$.'
      - 'The two constants combine into one, $C = \dfrac{k}{m^{2}}$, so $Y = \dfrac{C}{Z^{4}}$, which is $Z^{4}Y = C$.'
      - 'Check the logic: doubling $Z$ multiplies $X$ by 4, which divides $Y$ by $4^{2} = 16 = 2^{4}$ ✓, the fourth power of the change in $Z$.'
      - 'The trap is option A, $Z^{2}Y = C$. It comes from substituting $X = mZ^{2}$ into $\tfrac{k}{X^{2}}$ without squaring it — forgetting that $X$ is itself squared.'
    hint: 'Substitute $X = mZ^{2}$ into $Y = \tfrac{k}{X^{2}}$, remembering to square it.'

  14:
    answer: D
    steps:
      - 'To make $r$ the subject, clear the fractions first, then gather every $r$ term on one side.'
      - 'Cross-multiply $\dfrac{p}{2} = \dfrac{r}{r + q}$: $p(r + q) = 2r$.'
      - 'Expand: $pr + pq = 2r$.'
      - 'Gather the $r$ terms: $pq = 2r - pr$.'
      - 'Factor out $r$: $pq = r(2 - p)$.'
      - 'Divide: $r = \dfrac{pq}{2 - p}$.'
      - 'Check with $p = 1$, $q = 3$: the formula gives $r = 3$, and then $\tfrac{r}{r + q} = \tfrac{3}{6} = \tfrac{1}{2} = \tfrac{p}{2}$ ✓.'
      - 'The trap is the squared options, A to C. Nothing in the working is ever squared, so any option with $p^{2}$ or $q^{2}$ can be dismissed on sight.'
    hint: 'Cross-multiply to $p(r + q) = 2r$, then factor out $r$.'

  15:
    answer: D
    steps:
      - 'The rule tells you $f$ of $(x - 4)$, not $f$ of $x$. To get $f(2)$, find the $x$ that makes $x - 4$ equal to 2.'
      - 'Set $x - 4 = 2$, so $x = 6$.'
      - 'Now substitute $x = 6$ into the right-hand side: $6^{2} + 2(6) + 3 = 36 + 12 + 3 = 51$.'
      - 'So $f(2) = 51$.'
      - 'Another way: write $t = x - 4$, so $x = t + 4$ and $f(t) = (t + 4)^{2} + 2(t + 4) + 3 = t^{2} + 10t + 27$. Then $f(2) = 4 + 20 + 27 = 51$ ✓.'
      - 'The trap is option B, 11, which is $2^{2} + 2(2) + 3$ — substituting 2 straight into the right-hand side, as though the rule were for $f(x)$.'
    hint: 'Choose $x$ so that $x - 4 = 2$, then substitute that $x$.'

  16:
    answer: C
    steps:
      - 'This is a difference of two squares: $9(x + y)^{2} = [3(x + y)]^{2}$ and $4(x - y)^{2} = [2(x - y)]^{2}$.'
      - 'Using $A^{2} - B^{2} = (A - B)(A + B)$ with $A = 3(x + y)$ and $B = 2(x - y)$.'
      - 'The first bracket: $3(x + y) - 2(x - y) = 3x + 3y - 2x + 2y = x + 5y$.'
      - 'The second bracket: $3(x + y) + 2(x - y) = 3x + 3y + 2x - 2y = 5x + y$.'
      - 'So the factorisation is $(x + 5y)(5x + y)$.'
      - 'Check with $x = 1$, $y = 0$: the original is $9 - 4 = 5$, and $(1)(5) = 5$ ✓. With $x = 0$, $y = 1$: $9 - 4 = 5$, and $(5)(1) = 5$ ✓.'
      - 'The trap is option A, $(x + y)(5x + y)$. It has the right second bracket, but the first comes from forgetting that subtracting $2(x - y)$ turns $-2y$ into $+2y$.'
    hint: 'Difference of squares with $A = 3(x + y)$ and $B = 2(x - y)$.'

  17:
    answer: A
    steps:
      - 'The identity $(a - b)^{2} = a^{2} + b^{2} - 2ab$ links exactly the two quantities given.'
      - 'Substitute: $(a - b)^{2} = 16 - 7 = 9$.'
      - 'A number whose square is 9 can be $3$ or $-3$.'
      - 'So $a - b = 3$ or $a - b = -3$.'
      - 'Both are genuinely possible: swapping the values of $a$ and $b$ leaves $a^{2} + b^{2}$ and $2ab$ unchanged but flips the sign of $a - b$.'
      - 'The trap is keeping only the positive root. The question asks for *all* the possible values, and every square root has two.'
    hint: '$(a - b)^{2} = a^{2} + b^{2} - 2ab = 9$.'

  18:
    answer: A
    steps:
      - 'Dividing by a linear factor $x - 1$ is quickest with synthetic division, using the root $x = 1$.'
      - 'Write down the coefficients: $1, -2, -5, 6$.'
      - 'Bring down the 1. Multiply by 1 and add to $-2$: $-1$. Multiply by 1 and add to $-5$: $-6$. Multiply by 1 and add to 6: 0.'
      - 'The remainder is 0, confirming $x - 1$ is a factor, and the quotient coefficients are $1, -1, -6$: the quotient is $x^{2} - x - 6$.'
      - 'Check by multiplying back: $(x - 1)(x^{2} - x - 6) = x^{3} - x^{2} - 6x - x^{2} + x + 6 = x^{3} - 2x^{2} - 5x + 6$ ✓.'
      - 'The trap is option B, $x^{2} - 5x + 6$, which just keeps the last two coefficients of the original. Multiplying it back by $x - 1$ gives $x^{3} - 6x^{2} + 11x - 6$, nothing like the original.'
    hint: 'Synthetic division with root 1 on coefficients $1, -2, -5, 6$.'

  19:
    answer: B
    steps:
      - 'Squaring $x + \dfrac{1}{x}$ produces exactly the two terms wanted, plus a middle term that is always 2.'
      - '$\left(x + \dfrac{1}{x}\right)^{2} = x^{2} + 2 \cdot x \cdot \dfrac{1}{x} + \dfrac{1}{x^{2}} = x^{2} + 2 + \dfrac{1}{x^{2}}$.'
      - 'The middle term is 2 because $x$ and $\tfrac{1}{x}$ multiply to 1, whatever $x$ is — so the $x$ disappears from it completely.'
      - 'The left side is $4^{2} = 16$, since $x + \tfrac{1}{x} = 4$.'
      - 'So $x^{2} + 2 + \dfrac{1}{x^{2}} = 16$.'
      - 'Subtract 2 from both sides: $x^{2} + \dfrac{1}{x^{2}} = 14$.'
      - 'There is no need to find $x$ itself (it is $2 \pm \sqrt{3}$); the squaring trick reaches the answer without it.'
      - 'The trap is option A, 16 — squaring 4 and forgetting the middle term $2$ that squaring a sum always brings.'
    hint: 'Square both sides: the middle term is $2 \cdot x \cdot \tfrac{1}{x} = 2$.'

  20:
    answer: B
    steps:
      - 'A perfect square of two terms has the shape $A^{2} - 2AB + B^{2} = (A - B)^{2}$, so match what is given against that shape.'
      - 'Take $A^{2} = 4x^{2}$, so $A = 2x$.'
      - 'The $-4$ must then be the middle term $-2AB$: $-2(2x)B = -4$ gives $B = \dfrac{1}{x}$.'
      - 'The missing piece is $B^{2} = \dfrac{1}{x^{2}}$.'
      - 'So $4x^{2} - 4 + \dfrac{1}{x^{2}} = \left(2x - \dfrac{1}{x}\right)^{2}$.'
      - 'Check by expanding: $(2x)^{2} - 2(2x)\left(\tfrac{1}{x}\right) + \tfrac{1}{x^{2}} = 4x^{2} - 4 + \tfrac{1}{x^{2}}$ ✓.'
      - 'The trap is option A, $-\tfrac{1}{x^{2}}$. The last term of a perfect square is itself a square, and squares are never negative.'
    hint: 'Treat $-4$ as the middle term $-2(2x)(\tfrac{1}{x})$.'

  21:
    answer: C
    steps:
      - 'The equation mixes $x$ and $\sqrt{x}$, but $x$ is $(\sqrt{x})^{2}$, so it is a quadratic in $\sqrt{x}$.'
      - 'Let $u = \sqrt{x}$: $u^{2} - 8u + 15 = 0$.'
      - 'Factorise: $(u - 3)(u - 5) = 0$, so $u = 3$ or $u = 5$.'
      - 'Undo the substitution: $x = u^{2}$, giving $x = 9$ or $x = 25$.'
      - 'Check $x = 25$: $25 - 8(5) + 15 = 0$ ✓. And $x = 9$: $9 - 24 + 15 = 0$ ✓.'
      - 'The trap is option A, "3, 5" — the values of $\sqrt{x}$, left without being squared back into $x$.'
    hint: 'Let $u = \sqrt{x}$, solve for $u$, then square.'

  22:
    answer: D
    steps:
      - 'In a right-angled triangle the longest side is the hypotenuse, and Pythagoras says its square equals the sum of the squares of the other two.'
      - 'The longest here is $3x + 1$, so $x^{2} + (3x - 1)^{2} = (3x + 1)^{2}$.'
      - 'Expand: $x^{2} + 9x^{2} - 6x + 1 = 9x^{2} + 6x + 1$.'
      - 'Cancel $9x^{2}$ and 1 from both sides: $x^{2} - 6x = 6x$, so $x^{2} = 12x$.'
      - 'Then $x(x - 12) = 0$, giving $x = 0$ or $x = 12$. A side cannot be 0, so $x = 12$.'
      - 'Check: the sides are 12, 35 and 37, and $12^{2} + 35^{2} = 144 + 1225 = 1369 = 37^{2}$ ✓.'
      - 'The trap is option A, 5 — reaching for the famous 3-4-5 triangle. Substitute it: the sides would be 5, 14 and 16, and $25 + 196 = 221$ is not $256$.'
    hint: 'Pythagoras with hypotenuse $3x + 1$; everything but $x^{2} = 12x$ cancels.'

  23:
    answer: A
    steps:
      - 'Two facts give two equations: the perimeter fixes the sum of length and width, and the area fixes their product.'
      - 'Perimeter $2(L + W) = 24$, so $L + W = 12$.'
      - 'Area $LW = 35$.'
      - 'Two numbers with sum 12 and product 35: they are 5 and 7, since $5 + 7 = 12$ and $5 \times 7 = 35$.'
      - 'The width is the shorter side, 5 m.'
      - 'The trap is option B, 7 m — the length. Both numbers come out of the same working, and "how wide" asks for the smaller.'
    hint: '$L + W = 12$ and $LW = 35$; the width is the smaller of the two.'

  24:
    answer: B
    steps:
      - 'Let the unknown be the assistant''s number of days, since everything else is expressed relative to it.'
      - 'Say the assistant worked $d$ days. Then the painter worked $d + 10$ days.'
      - 'The painter earns $40(d + 10)$ and the assistant $10d$, together ₦2,000: $40(d + 10) + 10d = 2000$.'
      - 'Expand: $40d + 400 + 10d = 2000$, so $50d = 1600$ and $d = 32$.'
      - 'The assistant receives $10 \times 32 = ₦320$.'
      - 'Check: the painter worked 42 days for $40 \times 42 = ₦1{,}680$, and $1680 + 320 = 2000$ ✓.'
      - 'The trap is option A, ₦32.00 — the number of days the assistant worked, not his pay. The last multiplication by ₦10 a day is easily skipped.'
    hint: 'If the assistant worked $d$ days: $40(d + 10) + 10d = 2000$.'

  25:
    answer: B
    steps:
      - 'The common denominator is $x^{2} - y^{2}$, because it factorises as $(x + y)(x - y)$ and so contains both of the other denominators.'
      - 'Rewrite the first fraction: $\dfrac{x}{x + y} = \dfrac{x(x - y)}{x^{2} - y^{2}}$.'
      - 'Rewrite the second: $\dfrac{y}{x - y} = \dfrac{y(x + y)}{x^{2} - y^{2}}$.'
      - 'Combine the numerators: $x(x - y) + y(x + y) - x^{2} = x^{2} - xy + xy + y^{2} - x^{2}$.'
      - 'The $xy$ terms cancel and so do the $x^{2}$ terms, leaving $y^{2}$.'
      - 'So the expression simplifies to $\dfrac{y^{2}}{x^{2} - y^{2}}$.'
      - 'Check with $x = 2$, $y = 1$: $\tfrac{2}{3} + 1 - \tfrac{4}{3} = \tfrac{1}{3}$, and $\tfrac{1}{4 - 1} = \tfrac{1}{3}$ ✓.'
      - 'The trap is option A, $\dfrac{x^{2}}{x^{2} - y^{2}}$ — the last fraction on its own, with the other two thought to cancel. They add to $\tfrac{x^{2} + y^{2}}{x^{2} - y^{2}}$, and only the $x^{2}$ part is removed.'
