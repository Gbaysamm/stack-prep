# UTME 1991 Mathematics — worked explanations, written against the paper.
#
# Keyed on question number; see explanations_2003.yaml for why, and for how these are written.
#
# All 50 are answered, and all 27 the key covers agree with it. Where a question rests on a
# repaired stem, option or figure, retranscribed_1991.yaml says exactly what was changed.
format_version: 1
exam_year: 1991
subject: MATH

explanations:
  1:
    answer: B
    steps:
      - 'The order of operations decides this question: multiplication is done before addition and subtraction, even though it sits in the middle of the line.'
      - 'So the first job is $1\tfrac{1}{4} \times \tfrac{2}{3}$. Turn the mixed number into an improper fraction: $1\tfrac{1}{4} = \tfrac{5}{4}$.'
      - 'Multiply: $\tfrac{5}{4} \times \tfrac{2}{3} = \tfrac{10}{12} = \tfrac{5}{6}$.'
      - 'The expression is now $3\tfrac{1}{3} - \tfrac{5}{6} + 1\tfrac{2}{5}$. Write the mixed numbers as improper fractions too: $3\tfrac{1}{3} = \tfrac{10}{3}$ and $1\tfrac{2}{5} = \tfrac{7}{5}$.'
      - 'The denominators are 3, 6 and 5, and the smallest number all three divide into is 30.'
      - 'Converting: $\tfrac{10}{3} = \tfrac{100}{30}$, $\tfrac{5}{6} = \tfrac{25}{30}$, $\tfrac{7}{5} = \tfrac{42}{30}$.'
      - 'So the value is $\dfrac{100 - 25 + 42}{30} = \dfrac{117}{30}$.'
      - 'As a mixed number, $117 = 3 \times 30 + 27$, giving $3\tfrac{27}{30}$, and $\tfrac{27}{30}$ simplifies to $\tfrac{9}{10}$: the answer is $3\tfrac{9}{10}$.'
      - 'The trap is working straight along the line from left to right — subtracting first, then multiplying the result by $\tfrac{2}{3}$. That gives $2\tfrac{71}{90}$, which is not even offered; the multiplication must be done before either of its neighbours.'
    hint: 'Do $1\tfrac{1}{4} \times \tfrac{2}{3}$ first, then put everything over 30.'

  2:
    answer: A
    steps:
      - 'A subtraction in an unknown base can be tested by converting all three numbers to base ten and checking whether the sum works — so try the options rather than solving a cubic.'
      - 'Before converting anything, look at the digits. The numerals use the digit 7, so the base must be at least 8; every option passes that test.'
      - 'Try $n = 8$. In base 8 the place values are 512, 64, 8 and 1.'
      - '$7056_{8} = 7(512) + 0(64) + 5(8) + 6 = 3584 + 0 + 40 + 6 = 3630$.'
      - '$4577_{8} = 4(512) + 5(64) + 7(8) + 7 = 2048 + 320 + 56 + 7 = 2431$.'
      - 'The difference in base ten is $3630 - 2431 = 1199$.'
      - 'And $2257_{8} = 2(512) + 2(64) + 5(8) + 7 = 1024 + 128 + 40 + 7 = 1199$ ✓ — so base 8 works.'
      - 'A quicker check works column by column. In the units, $6 - 7$ needs a borrow, and $6 + n - 7 = 7$ gives $n = 8$ directly — the answer drops out of the very first column.'
      - 'The trap is option C, 10. Doing the subtraction in ordinary base ten gives $7056 - 4577 = 2479$, not 2257, so base ten fails at once — but it is the base people reach for by habit.'
    hint: 'Borrowing in the units column gives $6 + n - 7 = 7$.'

  3:
    answer: A
    steps:
      - 'Work inside the bracket first, and handle each small decimal by thinking about what dividing by it really does.'
      - '$\dfrac{1}{0.05} = 20$, since 0.05 goes into 1 exactly 20 times.'
      - 'Dividing by a fraction means multiplying by its reciprocal, so $20 \div \dfrac{1}{5.005} = 20 \times 5.005 = 100.1$.'
      - 'Now the second bracket: $0.05 \times 2.05 = 0.1025$.'
      - 'Subtract: $100.1 - 0.1025 = 99.9975$.'
      - 'To 3 decimal places, look at the fourth decimal place, which is 5 — so round up the third: $99.9975 \to 99.998$.'
      - 'A size check: the bracket is about 100 and the thing taken away is about a tenth, so the answer must be just under 100 ✓.'
      - 'The trap is option D, 9.998, one place of the decimal point out. It comes from treating $\tfrac{1}{0.05}$ as 2 instead of 20. Dividing by a small number makes the result *larger*.'
    hint: '$\tfrac{1}{0.05} = 20$, and dividing by $\tfrac{1}{5.005}$ means multiplying by 5.005.'

  4:
    answer: D
    steps:
      - 'Significant figures are counted from the first non-zero digit, whatever side of the decimal point they fall on.'
      - 'First the division: $62 \div 3 = 20.6666\ldots$, with the 6 recurring for ever.'
      - 'Count three significant figures from the left: 2, 0 and 6. So the answer will be $20.6$ or $20.7$.'
      - 'Look at the next digit to decide which. It is 6, which is 5 or more, so round the last kept digit up: $20.6 \to 20.7$.'
      - 'So $\dfrac{62}{3} = 20.7$ to 3 significant figures.'
      - 'Check the others. Options B and C carry 5 and 4 significant figures — correctly rounded, but to the wrong number of figures.'
      - 'The trap is option A, 20.6, which truncates instead of rounding: it simply chops off the digits after the third without looking at the next one.'
    hint: '$20.666\ldots$ to 3 significant figures — the fourth digit is a 6, so round up.'

  5:
    answer: A
    steps:
      - 'The two factories move in opposite directions, so work out each change in bags and then combine them — a loss and a gain partly cancel.'
      - 'Factory P loses 5% of its 20,000 bags: $0.05 \times 20000 = 1000$ bags fewer per day.'
      - 'Factory Q gains 5% of its 15,000 bags: $0.05 \times 15000 = 750$ bags more per day.'
      - 'The net change is $-1000 + 750 = -250$, a loss of 250 bags a day.'
      - 'Check with totals. Before: $20000 + 15000 = 35000$. After: $19000 + 15750 = 34750$. The difference is $35000 - 34750 = 250$ ✓.'
      - 'Notice that the two 5% changes do not cancel, because they are 5% of *different* amounts. P is the bigger factory, so its 5% is worth more bags.'
      - 'The trap is option C, 1000, which is P''s loss on its own with Q''s gain forgotten. Option B, 750, is Q''s gain on its own.'
    hint: 'P loses 1000 bags and Q gains 750; the effective loss is the difference.'

  6:
    answer: C
    steps:
      - 'Simple interest grows by the same amount every month, so work out the total interest first, then deal with the repayment.'
      - 'One month''s interest is 2% of ₦10.00: $0.02 \times 10 = ₦0.20$.'
      - 'Over 4 months that is $4 \times 0.20 = ₦0.80$.'
      - 'So after 4 months the debt stands at $10.00 + 0.80 = ₦10.80$.'
      - 'He then repays ₦8.00, leaving $10.80 - 8.00 = ₦2.80$ still owed.'
      - 'The same in one line, using $I = \dfrac{PRT}{100}$: $I = \dfrac{10 \times 2 \times 4}{100} = 0.80$, and $10 + 0.80 - 8 = 2.80$ ✓.'
      - 'The trap is option A, ₦10.80. That is the full amount owed at the four-month mark — correct as far as it goes, but the question asks what he *still* owes after paying ₦8.00 back.'
    hint: 'Interest is ₦0.20 a month for 4 months; add it to ₦10, then subtract the ₦8 repaid.'

  7:
    answer: B
    steps:
      - 'Percentages of two different amounts cannot be averaged directly; turn each into an actual quantity of water first.'
      - 'The first spirit is 3 gallons at 20% water: $0.20 \times 3 = 0.6$ gallons of water.'
      - 'The second is 5 gallons at 15% water: $0.15 \times 5 = 0.75$ gallons of water.'
      - 'Together: $0.6 + 0.75 = 1.35$ gallons of water in $3 + 5 = 8$ gallons of mixture.'
      - 'As a percentage: $\dfrac{1.35}{8} \times 100 = 16.875\%$.'
      - 'And $0.875 = \tfrac{7}{8}$, so the answer is $16\tfrac{7}{8}\%$.'
      - 'A sense check: the result must lie between the two starting strengths, 15% and 20%, and nearer 15% because there is more of that spirit ✓.'
      - 'The trap is averaging the two percentages without weighting them: $\tfrac{20 + 15}{2} = 17\tfrac{1}{2}\%$. That treats the two spirits as equal amounts, when there are 5 gallons of one and only 3 of the other. Options C and D, both above $17\tfrac{1}{2}\%$, lean even further towards the smaller, stronger batch — the wrong way.'
    hint: 'Find the gallons of water in each (0.6 and 0.75), then divide the total by 8.'

  8:
    answer: C
    steps:
      - 'A product of several numbers is just all of them multiplied together, so first put each factor into a plain form.'
      - 'The first is $\dfrac{27}{5}$, already simple.'
      - 'The second is $3^{-3}$. A negative index means a reciprocal: $3^{-3} = \dfrac{1}{3^{3}} = \dfrac{1}{27}$.'
      - 'The third is $\left(\dfrac{1}{5}\right)^{-1}$, the reciprocal of $\dfrac{1}{5}$, which is 5.'
      - 'Multiply: $\dfrac{27}{5} \times \dfrac{1}{27} \times 5$.'
      - 'The 27 on top cancels the 27 underneath, and the 5 underneath cancels the 5 on top, leaving exactly 1.'
      - 'The trap is misreading the negative indices. Taking $3^{-3}$ as $-27$ or $(\tfrac{1}{5})^{-1}$ as $-\tfrac{1}{5}$ confuses a negative *index* with a negative *number*; a negative index never makes a positive base negative, it only turns it upside down.'
    hint: '$3^{-3} = \tfrac{1}{27}$ and $(\tfrac{1}{5})^{-1} = 5$; then everything cancels.'

  9:
    answer: D
    steps:
      - 'Several logarithms of the same base collapse into one using three laws: $n\log a = \log a^{n}$, $\log a + \log b = \log ab$ and $\log a - \log b = \log\tfrac{a}{b}$.'
      - 'Start with the coefficient: $2\log\tfrac{2}{5} = \log\left(\tfrac{2}{5}\right)^{2} = \log\tfrac{4}{25}$.'
      - 'The whole expression becomes one logarithm: $\log\left(\dfrac{4}{25} \div \dfrac{72}{125} \times 9\right)$.'
      - 'Dividing by $\tfrac{72}{125}$ means multiplying by $\tfrac{125}{72}$: $\dfrac{4}{25} \times \dfrac{125}{72} \times 9$.'
      - 'Simplify in stages. $\dfrac{125}{25} = 5$, so this is $\dfrac{4 \times 5 \times 9}{72} = \dfrac{180}{72} = \dfrac{5}{2}$.'
      - 'So the expression equals $\log\tfrac{5}{2}$. The options are written in terms of $\log 2$ and $\log 3$, so rewrite $\tfrac{5}{2}$ as $\tfrac{10}{4}$.'
      - 'Then $\log\tfrac{10}{4} = \log 10 - \log 4 = 1 - \log 2^{2} = 1 - 2\log 2$, using $\log 10 = 1$ in base ten.'
      - 'The trap is options A and B, which carry $\log 3$. The factors of 3 in 72 and 9 cancel completely — $72 = 8 \times 9$ — and noticing that early saves a lot of work.'
    hint: 'Combine into $\log\left(\tfrac{4}{25} \times \tfrac{125}{72} \times 9\right) = \log\tfrac{5}{2}$, then write $\tfrac{5}{2} = \tfrac{10}{4}$.'

  10:
    answer: B
    steps:
      - 'Rationalising means clearing the surds from the denominator, which is done by multiplying top and bottom by the conjugate — the same two terms with the sign between them changed.'
      - 'The denominator is $3\sqrt{2} - 2\sqrt{3}$, so its conjugate is $3\sqrt{2} + 2\sqrt{3}$.'
      - 'The new denominator is a difference of two squares: $(3\sqrt{2})^{2} - (2\sqrt{3})^{2} = 18 - 12 = 6$.'
      - 'The new numerator is $(2\sqrt{3} + 3\sqrt{2})(3\sqrt{2} + 2\sqrt{3})$ — the same two terms in a different order, so it is $(2\sqrt{3} + 3\sqrt{2})^{2}$.'
      - 'Expanding: $(2\sqrt{3})^{2} + 2(2\sqrt{3})(3\sqrt{2}) + (3\sqrt{2})^{2} = 12 + 12\sqrt{6} + 18 = 30 + 12\sqrt{6}$.'
      - 'Divide by the denominator: $\dfrac{30 + 12\sqrt{6}}{6} = 5 + 2\sqrt{6}$.'
      - 'A size check: the original top is about $3.46 + 4.24 = 7.70$ and the bottom about $4.24 - 3.46 = 0.78$, so the value is about 9.9; and $5 + 2(2.449) = 9.9$ ✓.'
      - 'The trap is option A, $5 - 2\sqrt{6}$. That is the result of squaring the numerator as $(a - b)^{2}$ instead of $(a + b)^{2}$ — and its value, about 0.1, is far too small for a fraction with a small denominator.'
    hint: 'Multiply top and bottom by $3\sqrt{2} + 2\sqrt{3}$; the bottom becomes $18 - 12 = 6$.'

  11:
    answer: A
    steps:
      - 'Two fractions with surd denominators are subtracted over a common denominator, and here the two denominators are conjugates, which makes the common denominator a whole number.'
      - 'The common denominator is $(3 + \sqrt{5})(3 - \sqrt{5}) = 9 - 5 = 4$.'
      - 'The first fraction becomes $\dfrac{3 - \sqrt{5}}{4}$ and the second $\dfrac{3 + \sqrt{5}}{4}$.'
      - 'Subtract the numerators: $(3 - \sqrt{5}) - (3 + \sqrt{5}) = 3 - \sqrt{5} - 3 - \sqrt{5} = -2\sqrt{5}$.'
      - 'So the result is $\dfrac{-2\sqrt{5}}{4} = -\dfrac{1}{2}\sqrt{5}$.'
      - 'Check the sign by estimating: $\tfrac{1}{3 + 2.24} = 0.19$ and $\tfrac{1}{3 - 2.24} = 1.32$, so the difference is about $-1.13$, and $-\tfrac{1}{2}\sqrt{5} = -1.12$ ✓.'
      - 'The trap is option B, $+\tfrac{1}{2}\sqrt{5}$. The second fraction is the bigger one (its denominator is smaller), so taking it away must give a negative result.'
    hint: 'The common denominator is $9 - 5 = 4$; the numerator is $(3 - \sqrt{5}) - (3 + \sqrt{5})$.'

  12:
    answer: C
    steps:
      - 'To multiply a bracket by a bracket, multiply every term in the first by every term in the second, then collect like powers.'
      - 'Multiply $x^{2} - 3x + 1$ by $x$: $x^{3} - 3x^{2} + x$.'
      - 'Multiply $x^{2} - 3x + 1$ by $-a$: $-ax^{2} + 3ax - a$. Watch the middle term: $(-3x)(-a) = +3ax$.'
      - 'Add the two rows: $x^{3} - 3x^{2} - ax^{2} + x + 3ax - a$.'
      - 'Collect the $x^{2}$ terms: $-3x^{2} - ax^{2} = -(3 + a)x^{2}$.'
      - 'Collect the $x$ terms: $x + 3ax = (1 + 3a)x$.'
      - 'So the product is $x^{3} - (3 + a)x^{2} + (1 + 3a)x - a$.'
      - 'Test with numbers: put $x = 2$, $a = 1$. The original is $(4 - 6 + 1)(2 - 1) = -1$, and the answer gives $8 - 4(4) + 4(2) - 1 = -1$ ✓.'
      - 'The trap is option A, which ends in $-1$. That constant comes from multiplying only the 1 by $-1$ instead of by $-a$ — the last terms of the two brackets multiply to $(1)(-a) = -a$.'
    hint: 'Multiply by $x$, then by $-a$, and collect: the $x^{2}$ terms give $-(3 + a)x^{2}$.'

  13:
    answer: A
    steps:
      - 'Factorise before substituting — the common factors cancel and the arithmetic becomes much lighter.'
      - 'The numerator $xy^{2} - x^{2}y$ has $xy$ in both terms: $xy(y - x)$.'
      - 'The denominator $x^{2} - xy$ has $x$ in both terms: $x(x - y)$.'
      - 'Cancel the $x$: $\dfrac{y(y - x)}{x - y}$. And $y - x = -(x - y)$, so the brackets cancel leaving a minus sign: the whole thing is $-y$.'
      - 'With $y = 3$ the value is $-3$.'
      - 'Check by substituting directly: the numerator is $(-2)(9) - (4)(3) = -18 - 12 = -30$, the denominator is $4 - (-2)(3) = 4 + 6 = 10$, and $\tfrac{-30}{10} = -3$ ✓.'
      - 'The trap is option D, $+3$. It comes from cancelling $y - x$ against $x - y$ as though they were equal, when they are negatives of each other.'
    hint: 'Factorise to $\dfrac{xy(y - x)}{x(x - y)}$ — the brackets cancel to $-1$, leaving $-y$.'

  14:
    answer: C
    steps:
      - 'Average speed is always total distance divided by total time — never the average of the two speeds, because the car spends different amounts of time at each.'
      - 'The total distance is $p + q$ km.'
      - 'The time for the first leg is distance over speed: $\dfrac{p}{u}$ hours. For the second leg it is $\dfrac{q}{w}$ hours.'
      - 'The total time is $\dfrac{p}{u} + \dfrac{q}{w} = \dfrac{pw + qu}{uw}$, over the common denominator $uw$.'
      - 'Average speed $= \dfrac{p + q}{\;\dfrac{pw + qu}{uw}\;} = \dfrac{uw(p + q)}{wp + uq}$.'
      - 'Test it: if both legs are 60 km and both speeds 30 km/h, the answer gives $\dfrac{900 \times 120}{1800 + 1800} = 30$ km/h ✓, which it must.'
      - 'The trap is option B, $u + w$ — adding the speeds, which would give 60 km/h in the test just done. Even the simple average $\tfrac{u + w}{2}$ is only right when the two legs take equal *times*.'
    hint: 'Total distance $p + q$ over total time $\tfrac{p}{u} + \tfrac{q}{w}$.'

  15:
    answer: C
    steps:
      - '"$w$ varies inversely as $Z$" means $w = \dfrac{k}{Z}$ for some constant $k$. Here $Z = \dfrac{uv}{u + v}$.'
      - 'Dividing by a fraction flips it: $w = k \times \dfrac{u + v}{uv}$.'
      - 'Now use the given values to find $k$. With $u = 2$ and $v = 6$: $u + v = 8$ and $uv = 12$.'
      - 'So $8 = k \times \dfrac{8}{12}$, giving $k = 8 \times \dfrac{12}{8} = 12$.'
      - 'The relationship is $w = \dfrac{12(u + v)}{uv}$, and multiplying both sides by $uv$ gives $uvw = 12(u + v)$.'
      - 'Check with the given values: $2 \times 6 \times 8 = 96$ and $12(2 + 6) = 96$ ✓.'
      - 'The trap is option B, $16uv = 3w(u + v)$. It also fits the single data point (both sides equal 192), but rearranged it says $w = \tfrac{16}{3} \times \tfrac{uv}{u + v}$ — $w$ varying *directly*, not inversely. One data point cannot tell the two apart; only the word "inversely" can.'
    hint: 'Write $w = \dfrac{k(u + v)}{uv}$ and use $u = 2$, $v = 6$, $w = 8$ to find $k$.'

  16:
    answer: B
    steps:
      - 'To find $g(x + 1)$, replace every $x$ in the rule by the whole bracket $(x + 1)$.'
      - '$g(x + 1) = (x + 1)^{2} + 3(x + 1)$.'
      - 'Expand: $(x + 1)^{2} = x^{2} + 2x + 1$, and $3(x + 1) = 3x + 3$.'
      - 'So $g(x + 1) = x^{2} + 2x + 1 + 3x + 3 = x^{2} + 5x + 4$.'
      - 'Subtract $g(x) = x^{2} + 3x$: $(x^{2} + 5x + 4) - (x^{2} + 3x) = 2x + 4$.'
      - 'Factorise: $2x + 4 = 2(x + 2)$.'
      - 'Check with $x = 1$: $g(2) = 4 + 6 = 10$ and $g(1) = 1 + 3 = 4$, a difference of 6; and $2(1 + 2) = 6$ ✓.'
      - 'The trap is option A, $x + 2$ — half the answer. It comes from expanding $(x + 1)^{2}$ as $x^{2} + 1$, losing the middle term $2x$, which is exactly where the factor 2 lives.'
    hint: 'Substitute $(x + 1)$ for $x$, expand, then take away $x^{2} + 3x$.'

  17:
    answer: D
    steps:
      - 'A four-term cubic often factorises by grouping: split it into two pairs, take out what each pair has in common, and look for a shared bracket.'
      - 'Group as $(m^{3} - m^{2}) + (2m - 2)$.'
      - 'From the first pair take out $m^{2}$: $m^{2}(m - 1)$.'
      - 'From the second pair take out 2: $2(m - 1)$.'
      - 'Both pairs now contain $(m - 1)$, so it comes out as a common factor: $(m - 1)(m^{2} + 2)$.'
      - 'That is option D, $(m^{2} + 2)(m - 1)$. The quadratic $m^{2} + 2$ cannot be factorised further — it is always at least 2, so it has no real roots.'
      - 'Check by expanding: $(m^{2} + 2)(m - 1) = m^{3} - m^{2} + 2m - 2$ ✓.'
      - 'The trap is option A, $(m^{2} + 1)(m - 2)$, the same shape of answer. Expanding it gives $m^{3} - 2m^{2} + m - 2$, which has the wrong $m^{2}$ and $m$ terms; the factor theorem shows it at once, since $m = 2$ does not make the original zero ($8 - 4 + 4 - 2 = 6$).'
    hint: 'Group as $m^{2}(m - 1) + 2(m - 1)$.'

  18:
    answer: B
    steps:
      - '$1 - (a - b)^{2}$ is a difference of two squares, because 1 is $1^{2}$: it has the form $A^{2} - B^{2}$ with $A = 1$ and $B = a - b$.'
      - 'The rule is $A^{2} - B^{2} = (A - B)(A + B)$.'
      - 'So $1 - (a - b)^{2} = \left[1 - (a - b)\right]\left[1 + (a - b)\right]$.'
      - 'Remove the inner brackets carefully. In the first, the minus sign changes both signs inside: $1 - a + b$.'
      - 'In the second nothing changes: $1 + a - b$.'
      - 'The factorisation is $(1 - a + b)(1 + a - b)$, option B.'
      - 'Check with $a = 3$, $b = 1$: the original is $1 - 4 = -3$, and $(1 - 3 + 1)(1 + 3 - 1) = (-1)(3) = -3$ ✓.'
      - 'The trap is option C, the same bracket twice. That would be a perfect *square*, which is never negative — yet the test above gave $-3$. A difference of squares always gives two different brackets.'
    hint: 'Treat it as $1^{2} - (a - b)^{2}$ and use $(A - B)(A + B)$.'

  19:
    answer: C
    steps:
      - 'With four terms and no common factor across all of them, group them in pairs that do share a factor.'
      - 'Rearrange to put the $r$ terms together and the $p$ terms together: $rs + rt - ps - pt$.'
      - 'From the first pair take out $r$: $r(s + t)$.'
      - 'From the second pair take out $-p$: $-p(s + t)$. Taking out the minus sign is what makes the brackets match.'
      - 'The common bracket comes out: $(s + t)(r - p)$.'
      - 'So $r - p$ is a factor — option C.'
      - 'Check by expanding: $(s + t)(r - p) = rs - ps + rt - pt$ ✓, the original four terms.'
      - 'The trap is option D, $r + p$. It comes from taking out $+p$ instead of $-p$ from the second pair, which leaves $(s + t)$ and $-(s + t)$ that do not match.'
    hint: 'Group as $r(s + t) - p(s + t)$.'

  20:
    answer: A
    steps:
      - 'When one equation is linear and the other quadratic, make one letter the subject of the linear one and substitute it into the quadratic.'
      - 'From $3x + y = 8$: $y = 8 - 3x$.'
      - 'Substitute into $x^{2} + xy = 6$: $x^{2} + x(8 - 3x) = 6$.'
      - 'Expand: $x^{2} + 8x - 3x^{2} = 6$, so $-2x^{2} + 8x - 6 = 0$.'
      - 'Divide by $-2$: $x^{2} - 4x + 3 = 0$, which factorises as $(x - 1)(x - 3) = 0$. So $x = 1$ or $x = 3$.'
      - 'The question wants $y$, not $x$. With $x = 1$: $y = 8 - 3 = 5$. With $x = 3$: $y = 8 - 9 = -1$.'
      - 'Check the pair $(3, -1)$ in the quadratic: $9 + (3)(-1) = 6$ ✓.'
      - 'The trap is stopping at the $x$ values. Options that contain 1 — C and D — use the $x = 1$ root as if it were a value of $y$; the question asks for $y$, which needs one more substitution.'
    hint: 'Put $y = 8 - 3x$ into the second equation, solve for $x$, then find $y$.'

  21:
    answer: A
    steps:
      - 'Clear the fractions by multiplying through by their lowest common denominator — a positive number, so the inequality sign stays as it is.'
      - 'The denominators are 2, 3 and 4, and their LCM is 12.'
      - 'Multiplying each term by 12: $6x + 4x + 3x < 12$.'
      - 'Collect: $13x < 12$.'
      - 'Divide by 13, again a positive number, so the sign is unchanged: $x < \dfrac{12}{13}$.'
      - 'Check a value just below, $x = \tfrac{12}{13}$ exactly: $\tfrac{12}{13}(\tfrac{1}{2} + \tfrac{1}{3} + \tfrac{1}{4}) = \tfrac{12}{13} \times \tfrac{13}{12} = 1$, the boundary ✓.'
      - 'The trap is option D, $x < \tfrac{13}{12}$ — the fraction turned upside down. It comes from adding the fractions to get $\tfrac{13}{12}$ and then forgetting that it multiplies $x$ rather than bounds it.'
    hint: 'Multiply through by 12 to get $13x < 12$.'

  22:
    answer: D
    steps:
      - 'Translate the words into an equation one phrase at a time.'
      - '"Thrice its square" is $3n^{2}$. "Twelve times the number" is $12n$. "Is equal to" joins them: $3n^{2} = 12n$.'
      - 'Do not divide both sides by $n$ straight away — that can lose a solution. Bring everything to one side instead: $3n^{2} - 12n = 0$.'
      - 'Factorise: $3n(n - 4) = 0$, so $n = 0$ or $n = 4$.'
      - 'The question asks for the positive number, which rules out 0 and leaves $n = 4$.'
      - 'Check: thrice the square of 4 is $3 \times 16 = 48$, and twelve times 4 is 48 ✓.'
      - 'The trap is misplacing the square. Reading "thrice its square" as $(3n)^{2} = 9n^{2}$ gives $9n^{2} = 12n$ and $n = \tfrac{4}{3}$, which is not offered; and dropping the square altogether gives $3n = 12n$, which only $n = 0$ satisfies. The square belongs to $n$ alone, and the 3 multiplies it afterwards.'
    hint: 'Write $3n^{2} = 12n$, factorise, and choose the positive root.'

  23:
    answer: C
    steps:
      - 'A product of brackets can only be solved by setting each bracket to zero when the right-hand side is zero. Here it is 12, so the first job is to expand and rearrange.'
      - 'Expand: $(x - 2)(x - 3) = x^{2} - 5x + 6$.'
