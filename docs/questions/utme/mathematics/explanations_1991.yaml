      - 'Place $X$ at the origin. $Z$ is 60 m due north of it, and $Y$ is $60\sqrt{3}$ m due east of $Z$.'
      - 'So from $X$, $Y$ is 60 m north and $60\sqrt{3}$ m east — a right-angled triangle with the right angle at $Z$.'
      - 'The angle $\theta$ at $X$, measured from north, has the east distance opposite and the north distance adjacent: $\tan\theta = \dfrac{60\sqrt{3}}{60} = \sqrt{3}$.'
      - 'And $\tan 60^{\circ} = \sqrt{3}$, so $\theta = 60^{\circ}$.'
      - 'So the bearing of $Y$ from $X$ is $060^{\circ}$.'
      - 'The trap is option A, $030^{\circ}$. It comes from measuring the angle from the east–west line instead of from north, or equivalently from taking $\tan\theta = \tfrac{60}{60\sqrt{3}}$. Bearings always start from north — make that your first thought.'
    hint: 'North 60, east $60\sqrt{3}$, so $\tan\theta = \sqrt{3}$ from north.'

