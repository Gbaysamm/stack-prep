      - 'We''re going from cosine to cosecant. The bridge is the Pythagorean identity — let''s cross it carefully.'
      - 'Cosecant is $\dfrac{1}{\sin x}$, so the job is to get $\sin x$ from $\cos x$ using $\sin^{2}x + \cos^{2}x = 1$.'
      - '$\cos^{2}x = \left(\dfrac{\sqrt{a}}{b}\right)^{2} = \dfrac{a}{b^{2}}$. The square root on top disappears, but the $b$ underneath becomes $b^{2}$.'
      - 'Then $\sin^{2}x = 1 - \dfrac{a}{b^{2}} = \dfrac{b^{2} - a}{b^{2}}$.'
      - 'Take the square root: $\sin x = \dfrac{\sqrt{b^{2} - a}}{b}$.'
      - 'Turn it upside down: $\operatorname{cosec} x = \dfrac{b}{\sqrt{b^{2} - a}}$.'
      - 'The same answer from a triangle: adjacent $\sqrt{a}$, hypotenuse $b$, so opposite $= \sqrt{b^{2} - a}$, and cosec is hypotenuse over opposite ✓.'
      - 'The trap is option C, $\dfrac{b}{\sqrt{b - a}}$ — what you get by squaring $\dfrac{\sqrt{a}}{b}$ as $\dfrac{a}{b}$, forgetting to square the denominator. Only the top was under a square root. Square the top and the bottom, every time.'
    hint: 'Square the cosine as $\tfrac{a}{b^{2}}$; then $\sin^{2}x = \tfrac{b^{2} - a}{b^{2}}$.'

