# UTME 1992 Mathematics — worked explanations, written against the paper.
#
# Keyed on question number; see explanations_2003.yaml for why, and for how these are written.
#
# All 50 are answered. Of the 33 the key covers, 32 agree with it; the exception is Q42,
# where the key gives commodity H's quantity (108) instead of its sector angle (54°).
# Where a question rests on a repaired stem, option or figure, retranscribed_1992.yaml says
# exactly what was changed and why.
format_version: 1
exam_year: 1992
subject: MATH

explanations:
  1:
    answer: A
    steps:
      - 'Two numerals in different bases can only be compared once both are written in base ten, so convert each side separately and then set them equal.'
      - 'Start with the side that has no unknown. In $10011_{2}$ the place values, reading right to left, are $1, 2, 4, 8, 16$.'
      - 'So $10011_{2} = (1 \times 16) + (0 \times 8) + (0 \times 4) + (1 \times 2) + (1 \times 1) = 16 + 2 + 1 = 19$.'
      - 'Now the left side. In $34_{n}$ the digit 3 sits in the $n$ column and the digit 4 in the units column, so $34_{n} = 3n + 4$.'
      - 'Setting the two base-ten values equal: $3n + 4 = 19$.'
      - 'Subtracting 4 from both sides gives $3n = 15$, and dividing by 3 gives $n = 5$.'
      - 'Check the answer is even legal: a base-$n$ numeral may only use digits below $n$. The digits here are 3 and 4, and both are below 5 ✓. Had the answer come out as 4 or less it would have had to be rejected.'
      - 'The trap is reading $34_{n}$ as "thirty-four" and looking for a base that turns 34 into 19 — there is none, because the 3 is not three tens, it is three $n$s.'
    hint: 'Convert $10011_{2}$ to base ten first, then write $34_{n}$ as $3n + 4$ and solve.'

  2:
    answer: C
    steps:
      - 'Percentage error in a calculated quantity is not the same as percentage error in the measurement it came from — squaring the radius doubles the relative error, and that is the whole point of this question.'
      - 'The relative error in the radius is $\dfrac{0.1}{5} = 0.02$.'
      - 'The area is $A = \pi r^{2}$. Because $r$ is squared, the relative error in $A$ is twice the relative error in $r$: $\dfrac{\Delta A}{A} = 2 \times \dfrac{\Delta r}{r}$.'
      - 'So $\dfrac{\Delta A}{A} = 2 \times 0.02 = 0.04$.'
      - 'As a percentage that is $0.04 \times 100 = 4\%$.'
      - 'Confirm it the long way, without the rule. The largest area is $\pi(5.1)^{2} = 26.01\pi$ and the true area is $\pi(5)^{2} = 25\pi$.'
      - 'The difference is $1.01\pi$, and $\dfrac{1.01\pi}{25\pi} \times 100 = 4.04\%$ — 4% to the nearest whole number ✓.'
      - 'The trap is option D. Forgetting to double, and also forgetting to divide by the radius, gives $0.1 \times ... $ arithmetic that lands on 25 or on $\tfrac{1}{25}$; both options A and D are built from the raw numbers 5 and 0.1 rather than from the ratio.'
    hint: 'Relative error in $r^{2}$ is twice the relative error in $r$ — find $0.1 \div 5$ first, then double it.'

  3:
    answer: A
    steps:
      - 'A logarithm to an awkward base is easiest to handle by changing it to a common base, and the natural choice here is $a$, since both the base and the argument are powers of $a$.'
      - 'The change-of-base rule says $\log_{b}X = \dfrac{\log_{a}X}{\log_{a}b}$.'
      - 'The argument is $a^{n}$, and $\log_{a}a^{n} = n$ — a power of the base logs down to its own index.'
      - 'The base is $b = a^{1/n}$, so $\log_{a}b = \log_{a}a^{1/n} = \dfrac{1}{n}$.'
      - 'Therefore $\log_{b}a^{n} = \dfrac{n}{\;1/n\;}$.'
      - 'Dividing by a fraction means multiplying by its reciprocal: $\dfrac{n}{\;1/n\;} = n \times n = n^{2}$.'
      - 'Check it from the definition instead. $\log_{b}a^{n}$ is the power to which $b$ must be raised to give $a^{n}$; and $b^{n^{2}} = \left(a^{1/n}\right)^{n^{2}} = a^{n^{2}/n} = a^{n}$ ✓.'
      - 'The trap is option C. Reading off $\log_{a}b = \tfrac{1}{n}$ and stopping there answers the wrong question — that is the logarithm the other way round, and the change-of-base rule has it in the denominator, not the answer.'
    hint: 'Change the base to $a$: the top becomes $n$ and the bottom becomes $\tfrac{1}{n}$.'

  4:
    answer: B
    steps:
      - 'An equation in indices is solved by getting both sides to the same base, so that the indices themselves can be equated.'
      - 'The left side is a quotient of powers of 4, and dividing powers of the same base means subtracting indices: $\dfrac{4^{2x}}{4^{3x}} = 4^{2x - 3x} = 4^{-x}$.'
      - 'The right side is 2, which is not a power of 4 as it stands — but 4 is $2^{2}$, so write everything in base 2 instead.'
      - 'The left side becomes $4^{-x} = \left(2^{2}\right)^{-x} = 2^{-2x}$, using the rule that a power of a power multiplies the indices.'
      - 'The right side is $2 = 2^{1}$.'
      - 'So $2^{-2x} = 2^{1}$. With equal bases the indices must be equal: $-2x = 1$.'
      - 'Dividing both sides by $-2$ gives $x = -\dfrac{1}{2}$.'
      - 'Check: $4^{2(-1/2)} = 4^{-1} = \tfrac{1}{4}$ and $4^{3(-1/2)} = 4^{-3/2} = \tfrac{1}{8}$, and $\tfrac{1}{4} \div \tfrac{1}{8} = 2$ ✓.'
      - 'The trap is option C. Subtracting the indices the wrong way round gives $4^{x} = 2$ and so $x = +\tfrac{1}{2}$; the numerator index is the smaller one, so the result must be negative.'
    hint: 'Subtract the indices to get $4^{-x}$, then rewrite both sides as powers of 2.'

  5:
    answer: A
    steps:
      - 'In standard form the tidiest route is to handle the decimal parts and the powers of ten separately, because both obey their own simple rules.'
      - 'First the numerator. Multiply the decimals: $1.25 \times 2.0 = 2.5$.'
      - 'Then the powers of ten in the numerator, adding the indices: $10^{4} \times 10^{-1} = 10^{4 + (-1)} = 10^{3}$.'
      - 'So the numerator is $2.5 \times 10^{3}$.'
      - 'Now divide by $6.25 \times 10^{5}$. Take the decimals first: $2.5 \div 6.25 = 0.4$.'
      - 'Then the powers of ten, subtracting the indices: $10^{3} \div 10^{5} = 10^{3 - 5} = 10^{-2}$.'
      - 'That gives $0.4 \times 10^{-2}$, which is not yet in standard form because 0.4 is less than 1.'
      - 'Move the point one place right and drop the index by one to compensate: $0.4 \times 10^{-2} = 4.0 \times 10^{-3}$.'
      - 'The trap is option B, $5.0 \times 10^{-2}$ — the answer you reach by writing $0.4 \times 10^{-2}$ and then "tidying" it to $4 \times 10^{-2}$ without changing the index, or by mishandling the last step. Moving the decimal point right must always lower the power of ten.'
    hint: 'Do the decimals and the powers of ten separately; $0.4 \times 10^{-2}$ still needs tidying into standard form.'

  6:
    answer: C
    steps:
      - 'Surds can only be added or subtracted when they share the same radical, so every term must first be broken into a whole number times the simplest possible surd.'
      - 'Take $5\sqrt{18}$. Since $18 = 9 \times 2$ and 9 is a perfect square, $\sqrt{18} = 3\sqrt{2}$, so $5\sqrt{18} = 15\sqrt{2}$.'
      - 'Take $3\sqrt{72}$. Since $72 = 36 \times 2$, $\sqrt{72} = 6\sqrt{2}$, so $3\sqrt{72} = 18\sqrt{2}$.'
      - 'Take $4\sqrt{50}$. Since $50 = 25 \times 2$, $\sqrt{50} = 5\sqrt{2}$, so $4\sqrt{50} = 20\sqrt{2}$.'
      - 'All three are now multiples of $\sqrt{2}$, so they combine like ordinary like terms.'
      - 'Collecting the coefficients: $15 - 18 + 20 = 17$.'
      - 'The answer is therefore $17\sqrt{2}$.'
      - 'The trap is option A, $17\sqrt{4}$. The coefficient 17 is right, but $\sqrt{4}$ is simply 2, so that option is really the whole number 34 — a surd left unsimplified in the answer list is nearly always a distractor. Option B, $4\sqrt{17}$, swaps the two numbers over.'
    hint: 'Pull the largest square factor out of each surd; all three reduce to multiples of $\sqrt{2}$.'

  7:
    answer: C
    steps:
      - 'When an expression contains both $x^{2}$ and $\dfrac{1}{x^{2}}$, work each one out in turn and rationalise any surd that appears in a denominator.'
      - 'First $x^{2}$. With $x = 3 - \sqrt{3}$, expanding gives $x^{2} = 9 - 2(3)(\sqrt{3}) + 3 = 12 - 6\sqrt{3}$.'
      - 'Now the second term: $\dfrac{36}{x^{2}} = \dfrac{36}{12 - 6\sqrt{3}}$.'
      - 'Divide top and bottom by 6 to keep the numbers small: $\dfrac{6}{2 - \sqrt{3}}$.'
      - 'Rationalise by multiplying top and bottom by the conjugate $2 + \sqrt{3}$.'
      - 'The denominator becomes $(2 - \sqrt{3})(2 + \sqrt{3}) = 4 - 3 = 1$ — the surd disappears entirely.'
      - 'So $\dfrac{36}{x^{2}} = 6(2 + \sqrt{3}) = 12 + 6\sqrt{3}$.'
      - 'Adding the two parts: $(12 - 6\sqrt{3}) + (12 + 6\sqrt{3}) = 24$. The surd terms are equal and opposite, so they cancel exactly.'
      - 'The trap is stopping at $x^{2} = 12 - 6\sqrt{3}$ and reading off 12, or halving 24 to get 18 (option B). The cancellation of the $6\sqrt{3}$ terms is the signal that the whole-number answer 24 is the intended one.'
    hint: 'Work out $x^{2}$, then rationalise $\dfrac{36}{x^{2}}$ — the two surd parts cancel.'

  8:
    answer: D
    steps:
      - 'A prime factor is a factor that is itself prime, so the first job is to factorise each number completely and then list only the distinct primes.'
      - 'For 44: $44 = 2 \times 22 = 2 \times 2 \times 11$, so $44 = 2^{2} \times 11$ and the set of prime factors is $x = \{2, 11\}$.'
      - 'For 60: $60 = 2 \times 30 = 2 \times 2 \times 15 = 2 \times 2 \times 3 \times 5$, so $60 = 2^{2} \times 3 \times 5$ and $y = \{2, 3, 5\}$.'
      - 'Note that 4 is not a prime factor of either number — it is a factor, but it is not prime, and every option containing 4 can be discarded on that ground alone.'
      - 'The union $x \cup y$ collects every element that is in either set, listing repeats only once: $\{2, 11\} \cup \{2, 3, 5\} = \{2, 3, 5, 11\}$.'
      - 'The intersection $x \cap y$ keeps only the elements common to both: the only number in both lists is 2, so $x \cap y = \{2\}$.'
      - 'The pair $\{2, 3, 5, 11\}$ and $\{2\}$ is option D.'
      - 'The trap is options A and B, which both smuggle 4 into the list. It is the commonest slip here — $44 = 4 \times 11$ is a true factorisation, but 4 is composite, so it cannot belong to a set of prime factors.'
    hint: 'Prime factors of 44 are $\{2, 11\}$ and of 60 are $\{2, 3, 5\}$; 4 is a factor but not a prime.'

  9:
    answer: B
    steps:
      - 'A set defined by a condition has to be tested, not assumed — and here the condition turns out to be impossible, which is the whole question.'
      - 'The set is $F = \{x : x^{2} = 2^{6},\ x \text{ is odd}\}$. First work out $2^{6} = 64$.'
      - 'Solving $x^{2} = 64$ gives $x = 8$ or $x = -8$.'
      - 'Now apply the second condition: $x$ must be odd. Both 8 and $-8$ are even, so neither survives.'
      - 'So $F$ has no elements at all: $F = \varnothing$.'
      - 'Next, $E \cap F$. Intersecting any set with the empty set gives the empty set, so $E \cap F = \varnothing$, whatever $E$ happens to contain.'
      - 'Finally the complement. $(E \cap F)^{\prime}$ means everything in the universal set that is *not* in $E \cap F$ — and since $E \cap F$ is empty, nothing is excluded.'
      - 'So $(E \cap F)^{\prime} = U$, option B.'
      - 'The trap is option D, $\varnothing$. It is easy to find that $E \cap F$ is empty and then write that down as the answer, forgetting the dash. The complement of the empty set is the *whole* universal set, not the empty set.'
    hint: 'No odd number squares to 64, so $F$ is empty — then take the complement of an empty intersection.'

  10:
    answer: D
    steps:
      - 'Making a letter the subject means isolating it, and when that letter appears both squared and to the first power, the expression is a quadratic in it and must be treated as one.'
      - 'Start from $s = ut + \tfrac{1}{2}at^{2}$ and clear the fraction by multiplying every term by 2: $2s = 2ut + at^{2}$.'
      - 'Bring everything to one side in the standard order, highest power of $t$ first: $at^{2} + 2ut - 2s = 0$.'
      - 'This is a quadratic in $t$ with coefficients $A = a$, $B = 2u$ and $C = -2s$.'
      - 'Apply the formula $t = \dfrac{-B \pm \sqrt{B^{2} - 4AC}}{2A}$.'
      - 'The discriminant is $B^{2} - 4AC = (2u)^{2} - 4(a)(-2s) = 4u^{2} + 8as$.'
      - 'Factor 4 out of the square root: $\sqrt{4u^{2} + 8as} = \sqrt{4(u^{2} + 2as)} = 2\sqrt{u^{2} + 2as}$.'
      - 'So $t = \dfrac{-2u \pm 2\sqrt{u^{2} + 2as}}{2a}$, and cancelling the 2 throughout gives $t = \dfrac{1}{a}\left[-u \pm \sqrt{u^{2} + 2as}\right]$.'
      - 'The trap is the sign inside the root. Because $C = -2s$ is negative, $-4AC$ is $+8as$ — options A and B carry $-2as$, which is what you get by dropping that minus sign. And options A and C keep $+u$ outside the root, forgetting that the formula begins with $-B$.'
    hint: 'Rearrange to $at^{2} + 2ut - 2s = 0$ and use the quadratic formula; watch the sign of $-4AC$.'

  11:
    answer: C
    steps:
      - 'Four terms with no common factor, and three of them involving only $q$ and $r$, is the signature of grouping into a difference of two squares.'
      - 'Group the last three terms together, taking care with the signs: $9p^{2} - q^{2} + 6qr - 9r^{2} = 9p^{2} - \left(q^{2} - 6qr + 9r^{2}\right)$.'
      - 'Note that pulling the minus sign out flips the sign of all three terms inside the bracket — that is why $+6qr$ became $-6qr$.'
      - 'The bracket is now a perfect square: $q^{2} - 6qr + 9r^{2} = (q - 3r)^{2}$, since $(q - 3r)^{2} = q^{2} - 6qr + 9r^{2}$ ✓.'
      - 'The expression is therefore $9p^{2} - (q - 3r)^{2}$, and $9p^{2} = (3p)^{2}$, so this is a difference of two squares.'
      - 'The rule $A^{2} - B^{2} = (A - B)(A + B)$ with $A = 3p$ and $B = q - 3r$ gives $\left[3p - (q - 3r)\right]\left[3p + (q - 3r)\right]$.'
      - 'Removing the inner brackets: $(3p - q + 3r)(3p + q - 3r)$, which is option C.'
      - 'The trap is option D, which has $-q$ in both brackets. Expand it and the $q$ terms give $-q \times -q = +q^{2}$, the wrong sign; in a genuine difference of two squares the second bracket must reverse *every* sign of the first block, so $-q + 3r$ has to become $+q - 3r$.'
    hint: 'Group the last three terms inside a bracket with a minus outside — they form $(q - 3r)^{2}$.'

  12:
    answer: B
    steps:
      - 'This is not a quadratic in $y$, but it is a quadratic in $\sqrt{y}$ — the middle term carries $\sqrt{y}$ and the first term, $y$, is exactly $\left(\sqrt{y}\right)^{2}$.'
      - 'Let $u = \sqrt{y}$. Then $y = u^{2}$ and the equation becomes $u^{2} - 11u + 24 = 0$.'
      - 'Factorise: two numbers multiplying to 24 and adding to $-11$ are $-3$ and $-8$.'
      - 'So $(u - 3)(u - 8) = 0$, giving $u = 3$ or $u = 8$.'
      - 'Now undo the substitution. $u = \sqrt{y}$, so $y = u^{2}$.'
      - 'From $u = 3$: $y = 9$. From $u = 8$: $y = 64$.'
      - 'Check $y = 64$ in the original: $64 - 11\sqrt{64} + 24 = 64 - 88 + 24 = 0$ ✓. And $y = 9$: $9 - 33 + 24 = 0$ ✓.'
      - 'Both roots are valid here because both values of $u$ came out positive, and a square root cannot be negative — always worth checking, since a negative $u$ would have to be thrown away.'
      - 'The trap is option A, "8, 3". Those are the values of $\sqrt{y}$, not of $y$ — the substitution has been solved but never undone. Option D offers $-8$, which no square root can equal.'
    hint: 'Substitute $u = \sqrt{y}$, factorise, then remember to square the answers back.'

  13:
    answer: D
    steps:
      - 'With one sum split between two rates, name the unknown part, write the other part as what is left, and add the two interests.'
      - 'Let $x$ be the amount invested at 5%. Then the rest, $280 - x$, is invested at 4%.'
      - 'Simple interest for one year is just rate times principal. The 5% part earns $0.05x$.'
      - 'The 4% part earns $0.04(280 - x) = 11.20 - 0.04x$.'
      - 'The two together are the stated total: $0.05x + 11.20 - 0.04x = 12.80$.'
      - 'Collect the $x$ terms: $0.01x + 11.20 = 12.80$.'
      - 'Subtracting: $0.01x = 1.60$, so $x = \dfrac{1.60}{0.01} = 160$.'
      - 'Check both parts. ₦160 at 5% gives ₦8.00; the remaining ₦120 at 4% gives ₦4.80; and $8.00 + 4.80 = 12.80$ ✓.'
      - 'The trap is option B, ₦120.00 — that is the *other* part of the money, the amount at 4%. The check above produces both numbers, so it is worth reading the question once more before choosing between them.'
    hint: 'Call the 5% part $x$ and the 4% part $280 - x$; their interests add to ₦12.80.'

  14:
    answer: A
    steps:
      - 'The factor theorem says that if $x - c$ is a factor of a polynomial $f(x)$, then $f(c) = 0$ — substituting the root makes the whole polynomial vanish.'
      - 'Here the factor is $x + 1$, which is $x - (-1)$, so the root is $c = -1$, not $+1$.'
      - 'Substitute $x = -1$ into $f(x) = x^{3} + 3x^{2} + kx + 4$.'
      - 'The cube: $(-1)^{3} = -1$, since an odd power of a negative number stays negative.'
      - 'The square term: $3(-1)^{2} = 3(1) = 3$, since an even power turns it positive.'
      - 'The linear term: $k(-1) = -k$. And the constant stays 4.'
      - 'So $f(-1) = -1 + 3 - k + 4 = 6 - k$.'
      - 'Setting this to zero: $6 - k = 0$, so $k = 6$.'
      - 'Check by dividing: $x^{3} + 3x^{2} + 6x + 4$ at $x = -1$ is $-1 + 3 - 6 + 4 = 0$ ✓.'
      - 'The trap is option B, $-6$. It comes from substituting $x = +1$ by mistake, which gives $1 + 3 + k + 4 = 8 + k = 0$ and $k = -8$, or from solving $6 - k = 0$ as $k = -6$. The factor $x + 1$ always means the root $-1$.'
    hint: 'A factor of $x + 1$ means $f(-1) = 0$ — substitute $-1$, not $+1$.'

  15:
    answer: A
    steps:
      - 'Partial fractions start by factorising the denominator, because each factor becomes the denominator of one of the pieces.'
      - 'Factorise $x^{2} + x - 2$: two numbers multiplying to $-2$ and adding to $+1$ are $+2$ and $-1$, so $x^{2} + x - 2 = (x + 2)(x - 1)$.'
      - 'Both factors are linear and different, so write $\dfrac{3}{(x + 2)(x - 1)} = \dfrac{A}{x + 2} + \dfrac{B}{x - 1}$.'
      - 'Multiply through by $(x + 2)(x - 1)$ to clear the denominators: $3 = A(x - 1) + B(x + 2)$.'
      - 'This holds for every $x$, so choose values that kill one unknown at a time.'
      - 'Put $x = 1$: the $A$ term vanishes, leaving $3 = B(3)$, so $B = 1$.'
      - 'Put $x = -2$: the $B$ term vanishes, leaving $3 = A(-3)$, so $A = -1$.'
      - 'The decomposition is therefore $\dfrac{-1}{x + 2} + \dfrac{1}{x - 1}$, which is written more naturally as $\dfrac{1}{x - 1} - \dfrac{1}{x + 2}$ — option A.'
      - 'The trap is option B. It has the right two denominators but both signs positive; adding those two fractions gives $\dfrac{2x + 1}{(x+2)(x-1)}$, not the constant 3 required. One of the two numerators has to be negative.'
    hint: 'Factorise the denominator into $(x + 2)(x - 1)$, then substitute $x = 1$ and $x = -2$ in turn.'

  16:
    answer: C
    steps:
      - 'A double inequality is solved by doing the same thing to all three parts at once, keeping them in order.'
      - 'Start from $-11 \le 4 - 3x \le 28$ and subtract 4 from every part.'
      - 'The left becomes $-11 - 4 = -15$, the middle becomes $-3x$, the right becomes $28 - 4 = 24$: so $-15 \le -3x \le 24$.'
      - 'Now divide every part by $-3$ to reach $x$ on its own.'
      - 'Dividing an inequality by a negative number reverses the direction of both signs — this is the step the question is really testing.'
      - 'The left: $\dfrac{-15}{-3} = 5$. The right: $\dfrac{24}{-3} = -8$. With both signs reversed, $5 \ge x \ge -8$.'
      - 'Written in the usual increasing order that is $-8 \le x \le 5$.'
      - 'Check an endpoint and a middle value. At $x = -8$: $4 - 3(-8) = 28$ ✓ the upper limit. At $x = 5$: $4 - 15 = -11$ ✓ the lower limit. At $x = 0$: $4$, comfortably inside ✓.'
      - 'The trap is option B, $5 \le x \le 8$. It keeps the numbers 5 and 8 but never reverses the inequality and never picks up the minus on the 8 — the two signs of the division are both lost at once.'
    hint: 'Subtract 4 from all three parts, then divide by $-3$ and reverse both inequality signs.'

  17:
    answer: A
    steps:
      - 'A quadratic graph gives up its equation through the points where it meets the axes, so read those off the sketch first.'
      - 'The curve cuts the $x$-axis at $x = -2$ and $x = 2$. Those are the roots, so $x + 2$ and $x - 2$ are both factors.'
      - 'That means $y = a(x + 2)(x - 2)$ for some number $a$ still to be found.'
      - 'Expanding the brackets: $y = a\left(x^{2} - 4\right) = ax^{2} - 4a$.'
      - 'Now use the $y$-intercept. The curve passes through $(0, -4)$, so substituting $x = 0$ gives $-4a = -4$, hence $a = 1$.'
      - 'The equation is therefore $y = x^{2} - 4$.'
      - 'Comparing with $y = ax^{2} + bx + c$: $a = 1$, $b = 0$ and $c = -4$.'
      - 'The $b = 0$ is confirmed by the picture itself — the curve is symmetrical about the $y$-axis, and a parabola only sits that way when its $x$ term is missing.'
      - 'The trap is option C, $0, 1, -4$. Setting $a = 0$ would remove the $x^{2}$ term altogether and leave a straight line, which cannot have two roots or a lowest point. Any option with $a = 0$ can be rejected before any calculation at all.'
    hint: 'Roots at $\pm 2$ give $y = a(x^{2} - 4)$; the intercept $-4$ then fixes $a = 1$.'

  18:
    answer: D
    steps:
      - 'Before summing, check that the series really is geometric by dividing each term by the one before it.'
      - 'The terms are $3, 2, \tfrac{4}{3}, \tfrac{8}{9}, \tfrac{16}{27}, \ldots$'
      - '$\dfrac{2}{3}$ is the first ratio. The next is $\dfrac{4/3}{2} = \dfrac{4}{3} \times \dfrac{1}{2} = \dfrac{2}{3}$ ✓. And $\dfrac{8/9}{4/3} = \dfrac{8}{9} \times \dfrac{3}{4} = \dfrac{2}{3}$ ✓.'
      - 'So it is geometric with first term $a = 3$ and common ratio $r = \dfrac{2}{3}$.'
      - 'A sum to infinity exists only when $|r| < 1$, and $\tfrac{2}{3}$ passes that test — otherwise the terms would not shrink towards zero and no finite total would exist.'
      - 'The formula is $S_{\infty} = \dfrac{a}{1 - r}$.'
      - 'The denominator is $1 - \dfrac{2}{3} = \dfrac{1}{3}$.'
      - 'So $S_{\infty} = \dfrac{3}{\;1/3\;} = 3 \times 3 = 9$.'
      - 'A rough check: the first five terms already total $3 + 2 + 1.33 + 0.89 + 0.59 = 7.81$, climbing towards 9 but never reaching it ✓.'
      - 'The trap is option C, 18. It comes from using $\dfrac{a}{r}$ or from halving nothing — dividing 3 by $\tfrac{1}{3}$ and then doubling. Always subtract $r$ from 1 first, then divide.'
    hint: 'The ratio is $\tfrac{2}{3}$; use $S_{\infty} = \dfrac{a}{1 - r}$ with $1 - \tfrac{2}{3} = \tfrac{1}{3}$.'

  19:
    answer: C
    steps:
      - 'To find the rule behind a sequence, look at the gaps between consecutive terms — and if those are not constant, look at the gaps between the gaps.'
      - 'The terms are $2, 6, 12, 20$. The first differences are $6 - 2 = 4$, $12 - 6 = 6$, $20 - 12 = 8$.'
      - 'Those differences, $4, 6, 8$, are not constant, so the sequence is not linear and options A and B, both linear, can be set aside at once.'
      - 'The second differences are $6 - 4 = 2$ and $8 - 6 = 2$ — constant, which means the rule is a quadratic in $n$.'
      - 'Rather than solve for the quadratic from scratch, test the two quadratic options against $n = 1$.'
      - 'Option C at $n = 1$: $1^{2} + 1 = 2$ ✓, which matches the first term.'
      - 'Option D at $n = 1$: $1 + 3 + 2 = 6$ ✗, which is the second term, not the first.'
      - 'Confirm option C right through: $n = 2$ gives $4 + 2 = 6$ ✓; $n = 3$ gives $9 + 3 = 12$ ✓; $n = 4$ gives $16 + 4 = 20$ ✓.'
      - 'It is worth seeing why the rule works: $n^{2} + n = n(n + 1)$, so the sequence is $1 \times 2,\ 2 \times 3,\ 3 \times 4,\ 4 \times 5$ — each term is a number times the next.'
      - 'The trap is option D. It fits the sequence perfectly but one place out of step, giving the second term when asked for the first. Always test $n = 1$ before anything else.'
