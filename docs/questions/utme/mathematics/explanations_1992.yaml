      - 'So the question is really asking when $\dfrac{1}{n}$ and $\dfrac{1}{n - 1}$ are practically the same number.'
      - 'The difference between the two divisors is always exactly 1, but what matters is how big that 1 is *relative to $n$*.'
      - 'For a small sample, say $n = 5$, the divisors are 5 and 4 — a difference of 25%, which is nowhere near negligible.'
      - 'For $n = 35$, the divisors are 35 and 34, differing by about 2.9% — noticeably smaller but still a real gap.'
      - 'For $n$ larger than 35 the gap keeps shrinking: at $n = 100$ it is about 1%, at $n = 1000$ about 0.1%.'
      - 'So the two definitions converge as the sample grows, and the condition wanted is $n > 35$.'
      - 'This is why statistics texts draw the line between "small samples", where the $n - 1$ correction genuinely matters, and "large samples", where it may be ignored — and 30 to 35 is the conventional boundary.'
      - 'The trap is option D, $n = 5$. It is the case where the two definitions differ *most*, not least — the intuition runs backwards unless you notice that the fixed difference of 1 matters less the larger $n$ becomes.'
    hint: 'The divisors differ by 1 always; ask when that 1 is negligible compared with $n$ itself.'

