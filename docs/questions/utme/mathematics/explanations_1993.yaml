# UTME 1993 Mathematics — worked explanations, written against the paper.
#
# Keyed on question number; see explanations_2003.yaml for why, and for how these are written.
#
# All 50 are answered, and all 24 the key covers agree with it. Where a question rests on a
# repaired stem or option, retranscribed_1993.yaml says exactly what was changed.
format_version: 1
exam_year: 1993
subject: MATH

explanations:
  1:
    answer: A
    steps:
      - "Converting from base ten means dividing repeatedly by the new base and collecting the remainders."
      - "$71 \\div 8 = 8$ remainder $7$."
      - "$8 \\div 8 = 1$ remainder $0$."
      - "$1 \\div 8 = 0$ remainder $1$."
      - "Reading the remainders from the last upwards gives $107_{8}$."
      - "Check by converting back: $107_{8}$ has place values 64, 8 and 1, so it is $(1 \\times 64) + (0 \\times 8) + 7 = 71$ ✓."
      - "The zero in the middle column is essential — it holds the place, and dropping it would give $17_{8} = 15$, which is option D."
      - "Option C simply copies the digits across with a new subscript, which changes the number entirely: $71_{8}$ is $(7 \\times 8) + 1 = 57$."
    hint: "Divide 71 by 8 repeatedly and read the remainders upwards — the middle one is a zero that must be kept."

  2:
    answer: D
    steps:
      - "Dividing by a small decimal is easiest after clearing it, so multiply top and bottom by 100."
      - "$\\dfrac{3524}{0.05} = \\dfrac{352400}{5}$."
      - "Dividing: $352400 \\div 5 = 70480$."
      - "Now round to 3 significant figures. The first three significant digits are 7, 0 and 4."
      - "The next digit is 8, which is 5 or more, so the 4 rounds up to 5."
      - "The remaining places become zeros: $70500$."
      - "Option C is the exact value, $70480$, with the rounding instruction ignored — it has five significant figures, not three."
      - "Dividing by $0.05$ multiplies by 20, so the answer should be about twenty times 3524, which is around 70,000 ✓ — a check that rules out option A's 705 immediately."
    hint: "Dividing by 0.05 multiplies by 20. Then round 70480 to three significant figures — the fourth digit is 8."

  3:
    answer: B
    steps:
      - "Both sides are powers, but of different bases, so rewrite them with the same base before comparing."
      - "Since $9 = 3^{2}$, the left side is $\\left(3^{2}\\right)^{x - 1/2} = 3^{2(x - 1/2)}$."
      - "Raising a power to a power multiplies the indices: $2\\left(x - \\tfrac{1}{2}\\right) = 2x - 1$."
      - "So the equation is $3^{2x - 1} = 3^{x^{2}}$."
      - "With the bases equal, the indices must be equal: $2x - 1 = x^{2}$."
      - "Rearranging: $x^{2} - 2x + 1 = 0$."
      - "That factorises as $(x - 1)^{2} = 0$, so $x = 1$ is the only root — a repeated one."
      - "Check: $9^{(1 - 1/2)} = 9^{1/2} = 3$, and $3^{1^{2}} = 3$ ✓. The perfect square is why there is a single answer rather than a pair."
    hint: "Write 9 as $3^2$ so both sides share a base, then equate the indices — the quadratic is a perfect square."

  4:
    answer: B
    steps:
      - "Three different bases multiplied together, so break every one down into powers of 2 and 5."
      - "$10^{y} = (2 \\times 5)^{y} = 2^{y}5^{y}$."
      - "$5^{2y-2}$ is already a power of 5."
      - "$4^{y-1} = \\left(2^{2}\\right)^{y-1} = 2^{2y-2}$."
      - "Now collect the powers of 2: $y + (2y - 2) = 3y - 2$. And the powers of 5: $y + (2y - 2) = 3y - 2$ as well."
      - "So the whole left side is $2^{3y-2} \\times 5^{3y-2} = (2 \\times 5)^{3y-2} = 10^{3y-2}$."
      - "Setting that equal to 1: any number to the power zero is 1, so $3y - 2 = 0$."
      - "Therefore $y = \\dfrac{2}{3}$."
      - "That the 2s and 5s carry the same index is not luck — it is what lets the whole expression collapse back into a single power of 10, and it is the point of the question."
    hint: "Write every factor in terms of 2 and 5; both indices come to $3y-2$, so the product is $10^{3y-2} = 10^0$."

  5:
    answer: D
    steps:
      - "Two fractions to subtract, so put them over a common denominator — and here the product of the denominators is a difference of two squares."
      - "The common denominator is $(\\sqrt{3} - 2)(\\sqrt{3} + 2) = (\\sqrt{3})^{2} - 2^{2} = 3 - 4 = -1$."
      - "The numerator is $(\\sqrt{3} + 2) - (\\sqrt{3} - 2)$."
      - "The $\\sqrt{3}$ terms cancel: $2 - (-2) = 4$."
      - "So the expression is $\\dfrac{4}{-1}$."
      - "That is $-4$."
      - "The sign is everything here. The denominator comes out negative because $3 < 4$, and missing that gives $+4$, which is option A."
      - "The surds vanish entirely, which is the signal that the difference of two squares was the right tool — no rationalising of individual terms was needed."
    hint: "Use a common denominator: it is $3 - 4 = -1$, and the numerator's surds cancel to leave 4."

  6:
    answer: D
    steps:
      - "Bring the coefficient inside the logarithm first, so the two terms can be combined."
      - "The power law gives $2\\log_{3}y = \\log_{3}y^{2}$."
      - "Then the sum of two logarithms is the logarithm of a product: $\\log_{3}y^{2} + \\log_{3}x^{2} = \\log_{3}\\left(x^{2}y^{2}\\right)$."
      - "So $\\log_{3}\\left(x^{2}y^{2}\\right) = 4$."
      - "Converting to index form: $x^{2}y^{2} = 3^{4} = 81$."
      - "The left side is $(xy)^{2}$, so $(xy)^{2} = 81$ and $xy = \\pm 9$."
      - "Therefore $y = \\pm\\dfrac{9}{x}$."
      - "The $\\pm$ matters: squaring loses the sign, so both roots must be carried. Option C gives $\\tfrac{2}{x}$, which comes from taking a square root of the equation rather than of 81."
    hint: "Combine into $\\log_3(x^2y^2) = 4$, so $(xy)^2 = 81$ — and take both square roots."

  7:
    answer: A
    steps:
      - "A difference of two logarithms with the same base is the logarithm of a quotient."
      - "So $\\log_{5}(62.5) - \\log_{5}\\left(\\tfrac{1}{2}\\right) = \\log_{5}\\left(62.5 \\div \\tfrac{1}{2}\\right)$."
      - "Dividing by a half is multiplying by 2: $62.5 \\times 2 = 125$."
      - "So the expression is $\\log_{5}125$."
      - "That asks what power of 5 gives 125."
      - "Since $5^{3} = 125$, the answer is 3."
      - "Dividing by $\\tfrac{1}{2}$ is the step to watch — it makes the number *larger*, not smaller. Multiplying by a half instead would give $\\log_{5}31.25$, which is not a whole number at all."
      - "That the result comes out exactly is the check that 125 really is a power of 5."
    hint: "Combine into one logarithm; dividing by $\\tfrac12$ doubles 62.5 to 125, which is $5^3$."

  8:
    answer: A
    steps:
      - "Simple interest is given by $I = \\dfrac{PRT}{100}$, where $P$ is the principal, $R$ the rate and $T$ the time."
      - "Here the interest is ₦27.00, the principal ₦225.00 and the rate 4% per annum."
      - "Substituting: $27 = \\dfrac{225 \\times 4 \\times x}{100}$."
      - "The right side simplifies: $\\dfrac{900x}{100} = 9x$."
      - "So $9x = 27$."
      - "Therefore $x = 3$ years."
      - "Check: 4% of ₦225 is ₦9 a year, and three years give $3 \\times 9 = ₦27$ ✓."
      - "The ₦27 is the interest, not the final amount — the money grows to ₦252 in total. Using 252 in the formula would give a very different and wrong answer."
    hint: "Use $I = \\tfrac{PRT}{100}$ with $I = 27$. The yearly interest is ₦9, so it takes three years."

  9:
    answer: C
    steps:
      - "With three overlapping circles there are seven separate regions, so read the shaded one by asking, for each circle in turn, whether the shading is inside it or outside."
      - "The shaded lens lies inside $X$ — it sits within the left-hand circle."
      - "It also lies inside $Z$, the lower circle."
      - "But it lies outside $Y$: the right-hand circle's edge cuts across and the shading stops there."
      - "So a point in the shaded region is in $X$, and not in $Y$, and in $Z$."
      - "Written as a set expression, that is $X \\cap Y^{c} \\cap Z$."
      - "Option A, $X \\cap Z$, is the whole lens where those two circles overlap — including the part that also lies inside $Y$, which is not shaded."
      - "Option D swaps which circle is excluded: $X \\cap Y \\cap Z^{c}$ is the region inside $X$ and $Y$ but outside $Z$, a different patch altogether."
    hint: "Ask three questions about the shaded lens — inside $X$? inside $Y$? inside $Z$? — and write the three answers as one expression."

  10:
    answer: B
    steps:
      - "A square root on one side, so square both sides to remove it — the root is already alone, which makes this clean."
      - "Squaring: $x^{2} + 9 = (x + 1)^{2}$."
      - "Expand the right side properly, as a bracket squared: $(x+1)^{2} = x^{2} + 2x + 1$."
      - "So $x^{2} + 9 = x^{2} + 2x + 1$."
      - "The $x^{2}$ appears on both sides and cancels, which is what makes this a linear equation rather than a quadratic."
      - "What remains is $9 = 2x + 1$, so $2x = 8$ and $x = 4$."
      - "Check in the original: $\\sqrt{16 + 9} = \\sqrt{25} = 5$, and $4 + 1 = 5$ ✓."
      - "Squaring can introduce false roots, so the check is not optional. Here it passes, and treating $(x+1)^{2}$ as $x^{2} + 1$ — the commonest slip — would give $9 = 1$, an obvious contradiction."
    hint: "Square both sides, expanding $(x+1)^2$ in full. The $x^2$ cancels, and check your answer back in the original."

  11:
    answer: B
    steps:
      - "$x$ appears in both the numerator and the denominator, so clear the fraction first and then collect the $x$ terms."
      - "Cross-multiplying: $q(1 + ax) = p(1 - ax)$."
      - "Expanding both sides: $q + aqx = p - apx$."
      - "Now gather the $x$ terms on one side and the rest on the other: $aqx + apx = p - q$."
      - "Factor out $ax$: $ax(q + p) = p - q$."
      - "Divide by $a(p + q)$: $x = \\dfrac{p - q}{a(p + q)}$."
      - "Check with numbers. If $a = 1$ and $x = \\tfrac{1}{3}$, the left side is $\\dfrac{4/3}{2/3} = 2$, so $\\dfrac{p}{q} = 2$; and $\\dfrac{p-q}{p+q} = \\dfrac{1}{3}$ ✓."
      - "Option A has the two brackets swapped. Which goes on top is decided by where the minus appears when collecting — the $x$ terms both end up positive, so the constants give the difference."
    hint: "Cross-multiply, gather the $x$ terms, and factor out $ax$ — the difference ends up on top and the sum below."

  12:
    answer: C
    steps:
      - "The quadratic is written with the constant first and a negative $x^{2}$ term, so reorder it before factorising."
      - "$15 + 7x - 2x^{2} = -2x^{2} + 7x + 15$."
      - "Taking out $-1$ makes the leading coefficient positive: $-(2x^{2} - 7x - 15)$."
      - "Now factorise the bracket. Two numbers multiplying to $2 \\times (-15) = -30$ and adding to $-7$ are $-10$ and $3$."
      - "Splitting: $2x^{2} - 10x + 3x - 15 = 2x(x - 5) + 3(x - 5) = (2x + 3)(x - 5)$."
      - "So the expression is $-(2x + 3)(x - 5)$, and its factors are $(2x + 3)$ and $(x - 5)$ up to sign."
      - "Of the options, only $x - 5$ appears."
      - "There is a quicker check: a factor $(x - a)$ means the expression is zero at $x = a$. Substituting $x = 5$: $15 + 35 - 50 = 0$ ✓. Testing $x = 3$, $x = -3$ and $x = -5$ in turn gives 30, $-24$ and $-70$, none of them zero."
    hint: "Reorder to $-2x^2 + 7x + 15$ and factorise, or simply substitute each option's root and look for the one that gives zero."

  13:
    answer: D
    steps:
      - "Two brackets squared and subtracted — that is a difference of two squares, and factorising it avoids expanding either one."
      - "The rule is $A^{2} - B^{2} = (A + B)(A - B)$, with $A = x + \\dfrac{1}{x} + 1$ and $B = x - \\dfrac{1}{x} - 1$."
      - "First $A + B$: the $\\dfrac{1}{x}$ terms cancel and so do the $1$s, leaving $2x$."
      - "Then $A - B$: the $x$ terms cancel, and subtracting the negatives doubles the rest — $\\dfrac{2}{x} + 2$."
      - "So the expression is $2x\\left(\\dfrac{2}{x} + 2\\right)$."
      - "Multiplying out: $2x \\times \\dfrac{2}{x} = 4$, and $2x \\times 2 = 4x$."
      - "So the answer is $4 + 4x = 4(1 + x)$."
      - "Option B is $\\left(\\tfrac{2}{x} + 2\\right)^{2}$ — the factor $A - B$ squared, from pairing the brackets wrongly. And option C, 4, is what the expression would be without the $+1$ and $-1$ inside; those two are exactly what produce the extra $4x$."
    hint: "Use $A^2 - B^2 = (A+B)(A-B)$: the sum is $2x$ and the difference is $\\tfrac{2}{x} + 2$."

  14:
    answer: D
    steps:
      - "One equation is linear in $y$, so make $y$ the subject of it and substitute into the other."
      - "From $y - 7x + 3 = 0$: $y = 7x - 3$."
      - "Substituting into $x^{2} + y - 5 = 0$: $x^{2} + (7x - 3) - 5 = 0$."
      - "Simplifying: $x^{2} + 7x - 8 = 0$."
      - "Factorise: two numbers multiplying to $-8$ and adding to $7$ are $8$ and $-1$."
      - "So $(x + 8)(x - 1) = 0$, giving $x = -8$ or $x = 1$."
      - "The question asks only for $x$, so both values are the answer: $1, -8$."
      - "Check $x = 1$: then $y = 4$, and $1 + 4 - 5 = 0$ ✓. Check $x = -8$: then $y = -59$, and $64 - 59 - 5 = 0$ ✓."
      - "Both roots are genuine — a line meeting a parabola generally crosses it twice — so neither may be discarded. Option C, $-1, 8$, has both signs the wrong way round."
    hint: "Substitute $y = 7x - 3$ into the first equation and factorise. Both roots are valid."

  15:
    answer: C
    steps:
      - "Both sides share the factor $(3x - 2)$, so bring everything to one side rather than dividing by it."
      - "Dividing by $(3x - 2)$ would lose the root that makes it zero, which is exactly one of the answers."
      - "$(3x - 2)(5x - 4) - (3x - 2)^{2} = 0$."
      - "Factor out $(3x - 2)$: $(3x - 2)\\left[(5x - 4) - (3x - 2)\\right] = 0$."
      - "Simplify the square bracket: $5x - 4 - 3x + 2 = 2x - 2$."
      - "So $(3x - 2)(2x - 2) = 0$."
      - "That gives $3x - 2 = 0$, so $x = \\dfrac{2}{3}$; or $2x - 2 = 0$, so $x = 1$."
      - "Check $x = 1$: $(1)(1) = 1$ and $1^{2} = 1$ ✓. Check $x = \\tfrac{2}{3}$: both sides are zero ✓."
      - "Option B gives only $x = 1$ — precisely what you get by cancelling the common factor. Whenever both sides share a bracket, factorising keeps both roots and dividing throws one away."
    hint: "Do not cancel the common bracket — move everything to one side and factor it out, keeping both roots."

  16:
    answer: D
    steps:
      - "Each curve is written in factorised form, so its crossings of the $x$-axis can be read straight off."
      - "For $y = x(2 - x)$, the factors are $x$ and $(2 - x)$, so it meets the axis at $x = 0$ and $x = 2$."
      - "The coefficient of $x^{2}$ is $-1$, so this parabola opens downwards, peaking between its roots at $x = 1$."
      - "For $y = (x - 1)(x - 3)$, the roots are $x = 1$ and $x = 3$, and the $x^{2}$ coefficient is positive, so it opens upwards with its minimum at $x = 2$."
      - "Together the two curves meet the axis at four places: $0$, $1$, $2$ and $3$."
      - "The origin is already marked as $0$ on the diagram, so the three labelled points $p$, $q$ and $r$ take the remaining crossings in order from left to right."
      - "That gives $p = 1$, $q = 2$, $r = 3$."
      - "Reading the crossings off the factorised forms is the whole method — expanding to $2x - x^{2}$ and $x^{2} - 4x + 3$ hides exactly the information the question wants."
    hint: "Read each curve's roots straight from its brackets: 0 and 2 for one, 1 and 3 for the other. The labelled points follow in order."

  17:
    answer: B
    steps:
      - "The function is defined in terms of $x + 2$, not $x$, so find the value of $x$ that makes the input equal $-1$."
      - "Set $x + 2 = -1$, which gives $x = -3$."
      - "Now substitute $x = -3$ into the right-hand side: $f(-1) = 2(-3)^{2} + 7(-3) - 5$."
      - "Term by term: $(-3)^{2} = 9$, so the first term is $2 \\times 9 = 18$."
      - "The second is $7 \\times (-3) = -21$."
      - "And the third is $-5$."
      - "Adding: $18 - 21 - 5 = -8$."
      - "Substituting $x = -1$ directly is the trap: that would give $f(1)$, not $f(-1)$, since the rule's input is $x + 2$. Working out which $x$ produces the wanted input is the step the question is built on."
    hint: "The input is $x+2$, so solve $x + 2 = -1$ first, then substitute that $x$ into the expression."

  18:
    answer: D
    steps:
      - "Before setting out a long division, check whether the dividend factorises — here it does, by grouping."
      - "$x^{3} + 7x^{2} - x - 7$. Pair the first two and the last two: $x^{2}(x + 7) - 1(x + 7)$."
      - "Both parts carry the bracket $(x + 7)$, so the expression is $(x + 7)(x^{2} - 1)$."
      - "The divisor is $-1 + x^{2}$, which is just $x^{2} - 1$ written the other way round."
      - "So the division is $\\dfrac{(x + 7)(x^{2} - 1)}{x^{2} - 1}$."
      - "The $(x^{2} - 1)$ cancels completely."
      - "That leaves $x + 7$."
      - "Option C, $x - 7$, has the sign of the 7 wrong — it comes from pairing the terms as $x^{2}(x+7) - 1(x+7)$ but then reading the outside factor from the wrong bracket. Multiplying back, $(x+7)(x^2-1) = x^3 + 7x^2 - x - 7$ ✓, confirms which it is."
    hint: "Factorise the dividend by grouping into $(x+7)(x^2-1)$ — the divisor is that second bracket, so it cancels."

  19:
    answer: B
    steps:
      - "A fraction whose top and bottom are themselves fractions — simplify each separately, then divide."
      - "The numerator is $\\dfrac{1}{p} - \\dfrac{1}{q}$. Over the common denominator $pq$ that is $\\dfrac{q - p}{pq}$."
      - "The denominator is $\\dfrac{p}{q} - \\dfrac{q}{p}$. Over $pq$ that is $\\dfrac{p^{2} - q^{2}}{pq}$."
      - "Dividing one by the other means multiplying by the reciprocal, and the $pq$ cancels: $\\dfrac{q - p}{p^{2} - q^{2}}$."
      - "Now factorise the denominator as a difference of two squares: $p^{2} - q^{2} = (p - q)(p + q)$."
      - "And note the numerator is the negative of $(p - q)$: $q - p = -(p - q)$."
      - "So the expression is $\\dfrac{-(p - q)}{(p - q)(p + q)}$, and the $(p - q)$ cancels."
      - "That leaves $-\\dfrac{1}{p + q}$."
      - "The minus sign is the whole difficulty: $q - p$ and $p - q$ look alike but differ in sign, and treating them as the same gives $+\\dfrac{1}{p+q}$, which is not offered. Writing one as the negative of the other makes the cancellation safe."
    hint: "Simplify top and bottom over $pq$, factorise $p^2 - q^2$, and note that $q - p = -(p - q)$."

  20:
    answer: B
    steps:
      - "Bring everything to one side so the quadratic can be factorised."
      - "$y^{2} - 3y > 18$ becomes $y^{2} - 3y - 18 > 0$."
      - "Factorise: two numbers multiplying to $-18$ and adding to $-3$ are $-6$ and $3$."
      - "So $(y - 6)(y + 3) > 0$."
      - "The roots are $y = 6$ and $y = -3$."
      - "A product of two factors is *positive* when both have the same sign, which happens outside the roots — to the left of the smaller and to the right of the larger."
      - "So the solution is $y < -3$ or $y > 6$."
      - "Test a value in each region. At $y = -4$: $16 + 12 = 28 > 18$ ✓. At $y = 7$: $49 - 21 = 28 > 18$ ✓. And between, at $y = 0$: $0 > 18$ is false ✓."
      - "Option A gives the region *between* the roots, which is where the product is negative. Whether the answer is inside or outside is decided by the direction of the inequality, and one test point settles it."
    hint: "Rearrange and factorise. A positive product means outside the roots — test one value in each region to be sure."

  21:
    answer: B
    steps:
      - "There is an unknown in a denominator, so the sign of $x + 3$ decides whether the inequality flips. Take the two cases separately."
      - "Multiply both sides by $3(x + 3)$. If $x + 3 > 0$ the direction is unchanged; if $x + 3 < 0$ it reverses."
      - "Case one, $x > -3$: $(x + 1)(x + 3) > 3$, that is $x^{2} + 4x + 3 > 3$, so $x^{2} + 4x > 0$ and $x(x + 4) > 0$."
      - "That holds for $x < -4$ or $x > 0$. But this case needs $x > -3$, and the question needs $x$ negative — no value satisfies all three."
      - "Case two, $x < -3$: the inequality reverses, giving $(x + 1)(x + 3) < 3$, so $x^{2} + 4x < 0$ and $x(x + 4) < 0$."
      - "A negative product means between the roots: $-4 < x < 0$."
      - "Combining with this case's condition $x < -3$: the overlap is $-4 < x < -3$."
      - "Check a value inside, say $x = -3.5$: the left side is $\\dfrac{-2.5}{3} = -0.833$ and the right is $\\dfrac{1}{-0.5} = -2$; and $-0.833 > -2$ ✓."
      - "Splitting into cases is unavoidable whenever an unknown sits in a denominator — multiplying through blindly would give only case one's answer, which turns out to be empty."
    hint: "Split on the sign of $x+3$. Only the case $x < -3$ survives, and there the inequality reverses."

  22:
    answer: C
    steps:
      - "The salary rises in steps, so count how many rises have happened by the month in question."
      - "The eighth month of the third year is month $24 + 8 = 32$, counting from the start."
      - "A rise comes after each six-month period, so the salary changes at the start of months 7, 13, 19, 25 and 31."
      - "Listing the bands: months 1–6 at ₦540; 7–12 at ₦576; 13–18 at ₦612; 19–24 at ₦648; 25–30 at ₦684; 31–36 at ₦720."
      - "Month 32 falls in the last of these bands."
      - "So the salary is ₦720.00."
      - "Equivalently, five rises have occurred by then: $540 + 5(36) = 540 + 180 = ₦720$ ✓."
      - "Counting the rises rather than the periods is what matters. Month 32 is in the sixth six-month band, but only five *increases* have taken place, because the first band carries none."
    hint: "The eighth month of year three is month 32. Count how many six-month rises have happened by then — five, not six."

  23:
    answer: B
    steps:
      - "In a geometric progression consecutive terms have a constant ratio, so the middle term squared equals the product of its neighbours."
      - "That gives $(2k - 1)^{2} = (k + 1)(3k + 1)$."
      - "Expanding the left: $4k^{2} - 4k + 1$."
      - "Expanding the right: $3k^{2} + k + 3k + 1 = 3k^{2} + 4k + 1$."
      - "Setting them equal: $4k^{2} - 4k + 1 = 3k^{2} + 4k + 1$, which reduces to $k^{2} - 8k = 0$."
      - "Factorising: $k(k - 8) = 0$, so $k = 0$ or $k = 8$."
      - "Now find the ratio for each. With $k = 0$ the terms are $1, -1, 1$, so the ratio is $-1$."
      - "With $k = 8$ they are $9, 15, 25$, so the ratio is $\\dfrac{15}{9} = \\dfrac{5}{3}$ — and $\\dfrac{25}{15} = \\dfrac{5}{3}$ too ✓."
      - "The question asks for the ratios, not the values of $k$. Option A gives $0, 8$, which are the $k$ values — a step on the way, and the easiest thing to stop at."
    hint: "Use middle² = product of the outer two to find $k$, then convert each $k$ into the actual common ratio."

  24:
    answer: A
    steps:
      - "Apply the rule $x * y = x^{y}$ with $y = 2$."
      - "That gives $x * 2 = x^{2}$."
      - "The question says this equals $x$, so $x^{2} = x$."
      - "Bring everything to one side: $x^{2} - x = 0$."
      - "Factorise: $x(x - 1) = 0$."
      - "So $x = 0$ or $x = 1$."
      - "Check both: $0^{2} = 0$ ✓ and $1^{2} = 1$ ✓."
      - "Dividing through by $x$ instead of factorising would give $x = 1$ alone and quietly lose the root $x = 0$ — the same trap as question 15, and the reason factorising is the safer habit."
    hint: "The rule gives $x^2 = x$. Factorise rather than divide by $x$, or you lose one of the two roots."

  25:
    answer: B
    steps:
