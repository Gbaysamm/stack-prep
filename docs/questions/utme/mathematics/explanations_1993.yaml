    steps:
      - 'Finding the mode of grouped data uses a formula, and it''s all about putting the right numbers in the right places. Let''s do it together.'
      - 'Here''s the method. For grouped data the mode is estimated from the modal class and how far its frequency exceeds each neighbour.'
      - 'First, the modal class is the one with the highest frequency: $10$–$20$, with 27 coconuts.'
      - 'Now, the formula is $\text{mode} = L + \left(\dfrac{f_{1} - f_{0}}{(f_{1} - f_{0}) + (f_{1} - f_{2})}\right) \times c$.'
      - 'Let''s read off the values. Here $L = 10$ is the lower boundary, $f_{1} = 27$ the modal frequency, $f_{0} = 10$ the class before, $f_{2} = 19$ the class after, and $c = 10$ the class width.'
      - 'Next, the two differences are $27 - 10 = 17$ and $27 - 19 = 8$.'
      - 'So the fraction is $\dfrac{17}{17 + 8} = \dfrac{17}{25}$.'
      - 'Then $\text{mode} = 10 + \dfrac{17}{25} \times 10 = 10 + 6.8$.'
      - 'And that is $16.8$ g.'
      - 'One more note. The class boundaries here are already whole tens, so no half-unit adjustment is needed — unlike tables written as $1$–$5$, $6$–$10$. And the answer must lie inside the modal class, between 10 and 20 ✓, which rules out nothing here but is always worth checking. The usual slip is mixing up $f_{0}$ and $f_{2}$, the class before and the class after, so label them before you substitute.'
    hint: 'The modal class is 10–20. Use the formula with $f_0 = 10$, $f_1 = 27$, $f_2 = 19$ and a width of 10.'

