explanations:
  1:
    answer: A
    steps:
      - 'Changing a number out of base ten has a steady routine. Let''s go through it together, one division at a time.'
      - 'Here''s the method. Converting from base ten means dividing repeatedly by the new base and collecting the remainders.'
      - 'Let''s start. $71 \div 8 = 8$ remainder $7$.'
      - 'Then $8 \div 8 = 1$ remainder $0$.'
      - 'And once more, $1 \div 8 = 0$ remainder $1$.'
      - 'Now reading the remainders from the last upwards gives $107_{8}$.'
      - 'Let''s check by converting back: $107_{8}$ has place values 64, 8 and 1, so it is $(1 \times 64) + (0 \times 8) + 7 = 71$ ✓.'
      - 'Watch this part carefully: the zero in the middle column is essential — it holds the place, and dropping it would give $17_{8} = 15$, which is option D.'
      - 'And one more trap: option C simply copies the digits across with a new subscript, which changes the number entirely: $71_{8}$ is $(7 \times 8) + 1 = 57$. So divide, collect the remainders, and read them from the bottom up.'
    hint: 'Divide 71 by 8 repeatedly and read the remainders upwards — the middle one is a zero that must be kept.'

  2:
    answer: D
    steps:
      - 'Dividing by a small decimal feels awkward, but there''s a neat way to clear it. Then we just round carefully.'
      - 'Here''s a handy first move. Dividing by a small decimal is easiest after clearing it, so multiply top and bottom by 100.'
      - 'So $\dfrac{3524}{0.05} = \dfrac{352400}{5}$.'
      - 'Next, dividing: $352400 \div 5 = 70480$.'
      - 'That''s the exact value. Now round to 3 significant figures. The first three significant digits are 7, 0 and 4.'
      - 'The next digit is 8, which is 5 or more, so the 4 rounds up to 5.'
      - 'Then the remaining places become zeros: $70500$.'
      - 'Now, a common slip: option C is the exact value, $70480$, with the rounding instruction ignored — it has five significant figures, not three.'
      - 'Finally, a quick size check. Dividing by $0.05$ multiplies by 20, so the answer should be about twenty times 3524, which is around 70,000 ✓ — a check that rules out option A''s 705 immediately. Always finish with the rounding the question asks for.'
    hint: 'Dividing by 0.05 multiplies by 20. Then round 70480 to three significant figures — the fourth digit is 8.'

  3:
    answer: B
    steps:
      - 'Here the two sides have different bases, 9 and 3. Once they share a base, this becomes a quadratic. Let''s build it up.'
      - 'This is the plan. Both sides are powers, but of different bases, so rewrite them with the same base before comparing.'
      - 'Let''s start with the left side. Since $9 = 3^{2}$, the left side is $\left(3^{2}\right)^{x - 1/2} = 3^{2(x - 1/2)}$.'
      - 'Remember, raising a power to a power multiplies the indices: $2\left(x - \tfrac{1}{2}\right) = 2x - 1$.'
      - 'So the equation is $3^{2x - 1} = 3^{x^{2}}$.'
      - 'Here''s the key step. With the bases equal, the indices must be equal: $2x - 1 = x^{2}$.'
      - 'Then rearranging: $x^{2} - 2x + 1 = 0$.'
      - 'Look closely: that factorises as $(x - 1)^{2} = 0$, so $x = 1$ is the only root — a repeated one.'
      - 'Let''s check: $9^{(1 - 1/2)} = 9^{1/2} = 3$, and $3^{1^{2}} = 3$ ✓. The perfect square is why there is a single answer rather than a pair. A common slip is multiplying only the $x$ by 2 and forgetting the $\tfrac{1}{2}$, so take your time with the bracket in the index.'
    hint: 'Write 9 as $3^2$ so both sides share a base, then equate the indices — the quadratic is a perfect square.'

  4:
    answer: B
    steps:
      - 'Three different bases in one product can look messy. The trick is to break everything down into 2s and 5s, so let''s do that.'
      - 'Here''s the idea. Three different bases multiplied together, so break every one down into powers of 2 and 5.'
      - 'Start with the first factor. $10^{y} = (2 \times 5)^{y} = 2^{y}5^{y}$.'
      - 'Next, $5^{2y-2}$ is already a power of 5.'
      - 'And the last one: $4^{y-1} = \left(2^{2}\right)^{y-1} = 2^{2y-2}$.'
      - 'Good. Now collect the powers of 2: $y + (2y - 2) = 3y - 2$. And the powers of 5: $y + (2y - 2) = 3y - 2$ as well.'
      - 'So the whole left side is $2^{3y-2} \times 5^{3y-2} = (2 \times 5)^{3y-2} = 10^{3y-2}$.'
      - 'Here''s the key fact. Setting that equal to 1: any number to the power zero is 1, so $3y - 2 = 0$.'
      - 'That gives $y = \dfrac{2}{3}$.'
      - 'Notice something nice. That the 2s and 5s carry the same index is not luck — it is what lets the whole expression collapse back into a single power of 10, and it is the point of the question. The tempting slip is leaving $4^{y-1}$ as a power of 4, and then nothing collapses. Break everything into primes, and it all falls into place.'
    hint: 'Write every factor in terms of 2 and 5; both indices come to $3y-2$, so the product is $10^{3y-2} = 10^0$.'

  5:
    answer: D
    steps:
      - 'Two fractions with surds underneath, and you might expect a long calculation. Watch how quickly it collapses. Let''s go.'
      - 'Here''s the approach. Two fractions to subtract, so put them over a common denominator — and here the product of the denominators is a difference of two squares.'
      - 'Start with the bottom. The common denominator is $(\sqrt{3} - 2)(\sqrt{3} + 2) = (\sqrt{3})^{2} - 2^{2} = 3 - 4 = -1$.'
      - 'Now the top. The numerator is $(\sqrt{3} + 2) - (\sqrt{3} - 2)$.'
      - 'Look what happens: the $\sqrt{3}$ terms cancel: $2 - (-2) = 4$.'
      - 'Putting it together, the expression is $\dfrac{4}{-1}$.'
      - 'And that is $-4$.'
      - 'Now, the trap. The sign is everything here. The denominator comes out negative because $3 < 4$, and missing that gives $+4$, which is option A.'
      - 'One more thing. The surds vanish entirely, which is the signal that the difference of two squares was the right tool — no rationalising of individual terms was needed. Watch the sign of that denominator, and you''ll get this right every time.'
    hint: 'Use a common denominator: it is $3 - 4 = -1$, and the numerator''s surds cancel to leave 4.'

  6:
    answer: D
    steps:
      - 'This is a logarithm question that ends with a square root, and that''s where the care is needed. Let''s take it step by step.'
      - 'Here''s where we start. Bring the coefficient inside the logarithm first, so the two terms can be combined.'
      - 'Let''s do that. The power law gives $2\log_{3}y = \log_{3}y^{2}$.'
      - 'Next, the sum of two logarithms is the logarithm of a product: $\log_{3}y^{2} + \log_{3}x^{2} = \log_{3}\left(x^{2}y^{2}\right)$.'
      - 'So $\log_{3}\left(x^{2}y^{2}\right) = 4$.'
      - 'Now converting to index form: $x^{2}y^{2} = 3^{4} = 81$.'
      - 'And the left side is $(xy)^{2}$, so $(xy)^{2} = 81$ and $xy = \pm 9$.'
      - 'That means $y = \pm\dfrac{9}{x}$.'
      - 'Now, the trap. The $\pm$ matters: squaring loses the sign, so both roots must be carried. Option C gives $\tfrac{2}{x}$, which comes from taking a square root of the equation rather than of 81. Whenever you take a square root to solve, carry both signs.'
    hint: 'Combine into $\log_3(x^2y^2) = 4$, so $(xy)^2 = 81$ — and take both square roots.'

  7:
    answer: A
    steps:
      - 'Two logarithms with the same base can be combined into one, and then this becomes a quick question. Let''s see it.'
      - 'Here''s the rule we need. A difference of two logarithms with the same base is the logarithm of a quotient.'
      - 'Using it, $\log_{5}(62.5) - \log_{5}\left(\tfrac{1}{2}\right) = \log_{5}\left(62.5 \div \tfrac{1}{2}\right)$.'
      - 'Now dividing by a half is multiplying by 2: $62.5 \times 2 = 125$.'
      - 'So the expression is $\log_{5}125$.'
      - 'In other words, that asks what power of 5 gives 125.'
      - 'And since $5^{3} = 125$, the answer is 3.'
      - 'Now, the trap. Dividing by $\tfrac{1}{2}$ is the step to watch — it makes the number *larger*, not smaller. Multiplying by a half instead would give $\log_{5}31.25$, which is not a whole number at all.'
      - 'Finally, that the result comes out exactly is the check that 125 really is a power of 5. So combine first, and remember that dividing by a half doubles.'
    hint: 'Combine into one logarithm; dividing by $\tfrac12$ doubles 62.5 to 125, which is $5^3$.'

  8:
    answer: A
    steps:
      - 'Simple interest has one formula, and the only care is putting the right numbers into it. Let''s do that together.'
      - 'Let''s recall the formula. Simple interest is given by $I = \dfrac{PRT}{100}$, where $P$ is the principal, $R$ the rate and $T$ the time.'
      - 'Now read off the values. Here the interest is ₦27.00, the principal ₦225.00 and the rate 4% per annum.'
      - 'Next, substituting: $27 = \dfrac{225 \times 4 \times x}{100}$.'
      - 'Tidying up, the right side simplifies: $\dfrac{900x}{100} = 9x$.'
      - 'That leaves $9x = 27$.'
      - 'So $x = 3$ years.'
      - 'Let''s check: 4% of ₦225 is ₦9 a year, and three years give $3 \times 9 = ₦27$ ✓.'
      - 'Now, the trap. The ₦27 is the interest, not the final amount — the money grows to ₦252 in total. Using 252 in the formula would give a very different and wrong answer. Always check whether a number is the interest or the total amount.'
    hint: 'Use $I = \tfrac{PRT}{100}$ with $I = 27$. The yearly interest is ₦9, so it takes three years.'

  9:
    answer: C
    steps:
      - 'Three overlapping circles make seven regions, which can look confusing. But there''s a calm way to read any shaded part. Let''s try it.'
      - 'Here''s a good way to read it. With three overlapping circles there are seven separate regions, so read the shaded one by asking, for each circle in turn, whether the shading is inside it or outside.'
      - 'Start with $X$. The shaded lens lies inside $X$ — it sits within the left-hand circle.'
      - 'Next, it also lies inside $Z$, the lower circle.'
      - 'Now look at $Y$. But it lies outside $Y$: the right-hand circle''s edge cuts across and the shading stops there.'
      - 'Putting that together, a point in the shaded region is in $X$, and not in $Y$, and in $Z$.'
      - 'And written as a set expression, that is $X \cap Y^{c} \cap Z$.'
      - 'Now, the traps. Option A, $X \cap Z$, is the whole lens where those two circles overlap — including the part that also lies inside $Y$, which is not shaded.'
      - 'And option D swaps which circle is excluded: $X \cap Y \cap Z^{c}$ is the region inside $X$ and $Y$ but outside $Z$, a different patch altogether. Go circle by circle, inside or outside, and the expression writes itself.'
    hint: 'Ask three questions about the shaded lens — inside $X$? inside $Y$? inside $Z$? — and write the three answers as one expression.'

  10:
    answer: B
    steps:
      - 'A square root equation. We''ll remove the root, and then something nice happens. Let''s see.'
      - 'Here''s the first move. A square root on one side, so square both sides to remove it — the root is already alone, which makes this clean.'
      - 'Let''s do it. Squaring: $x^{2} + 9 = (x + 1)^{2}$.'
      - 'Now, carefully: expand the right side properly, as a bracket squared: $(x+1)^{2} = x^{2} + 2x + 1$.'
      - 'That gives us $x^{2} + 9 = x^{2} + 2x + 1$.'
      - 'Here''s the nice part. The $x^{2}$ appears on both sides and cancels, which is what makes this a linear equation rather than a quadratic.'
      - 'Now what remains is $9 = 2x + 1$, so $2x = 8$ and $x = 4$.'
      - 'Let''s check in the original: $\sqrt{16 + 9} = \sqrt{25} = 5$, and $4 + 1 = 5$ ✓.'
      - 'Why bother checking? Squaring can introduce false roots, so the check is not optional. Here it passes, and treating $(x+1)^{2}$ as $x^{2} + 1$ — the commonest slip — would give $9 = 1$, an obvious contradiction. Expand the square in full, and always check a squared equation at the end.'
    hint: 'Square both sides, expanding $(x+1)^2$ in full. The $x^2$ cancels, and check your answer back in the original.'

  11:
    answer: B
    steps:
      - 'Here we make $x$ the subject when it appears twice. The plan is to gather it in one place. Let''s work through it.'
      - 'This is the plan. $x$ appears in both the numerator and the denominator, so clear the fraction first and then collect the $x$ terms.'
      - 'Let''s start. Cross-multiplying: $q(1 + ax) = p(1 - ax)$.'
      - 'Next, expanding both sides: $q + aqx = p - apx$.'
      - 'Now gather the $x$ terms on one side and the rest on the other: $aqx + apx = p - q$.'
      - 'Then factor out $ax$: $ax(q + p) = p - q$.'
      - 'Finally, divide by $a(p + q)$: $x = \dfrac{p - q}{a(p + q)}$.'
      - 'Let''s check with numbers. If $a = 1$ and $x = \tfrac{1}{3}$, the left side is $\dfrac{4/3}{2/3} = 2$, so $\dfrac{p}{q} = 2$; and $\dfrac{p-q}{p+q} = \dfrac{1}{3}$ ✓.'
      - 'Now, the trap. Option A has the two brackets swapped. Which goes on top is decided by where the minus appears when collecting — the $x$ terms both end up positive, so the constants give the difference. Collect the $x$ terms carefully, and let the signs tell you which bracket goes on top.'
    hint: 'Cross-multiply, gather the $x$ terms, and factor out $ax$ — the difference ends up on top and the sum below.'

  12:
    answer: C
    steps:
      - 'This quadratic is written back to front, which makes it look unfamiliar. Let''s tidy it up and factorise.'
      - 'Here''s the first job. The quadratic is written with the constant first and a negative $x^{2}$ term, so reorder it before factorising.'
      - 'Let''s reorder it. $15 + 7x - 2x^{2} = -2x^{2} + 7x + 15$.'
      - 'Next, taking out $-1$ makes the leading coefficient positive: $-(2x^{2} - 7x - 15)$.'
      - 'Now factorise the bracket. Two numbers multiplying to $2 \times (-15) = -30$ and adding to $-7$ are $-10$ and $3$.'
      - 'Splitting: $2x^{2} - 10x + 3x - 15 = 2x(x - 5) + 3(x - 5) = (2x + 3)(x - 5)$.'
      - 'Putting it together, the expression is $-(2x + 3)(x - 5)$, and its factors are $(2x + 3)$ and $(x - 5)$ up to sign.'
      - 'Now, of the options, only $x - 5$ appears.'
      - 'Better still, there is a quicker check: a factor $(x - a)$ means the expression is zero at $x = a$. Substituting $x = 5$: $15 + 35 - 50 = 0$ ✓. Testing $x = 3$, $x = -3$ and $x = -5$ in turn gives 30, $-24$ and $-70$, none of them zero. The slip to avoid is testing $-5$ for the factor $x - 5$; the root has the opposite sign.'
    hint: 'Reorder to $-2x^2 + 7x + 15$ and factorise, or simply substitute each option''s root and look for the one that gives zero.'

  13:
    answer: D
    steps:
      - 'Expanding these two squares would take ages. There''s a much shorter road, and it starts with spotting a pattern. Let''s find it.'
      - 'The big idea is this. Two brackets squared and subtracted — that is a difference of two squares, and factorising it avoids expanding either one.'
      - 'Let''s name the pieces. The rule is $A^{2} - B^{2} = (A + B)(A - B)$, with $A = x + \dfrac{1}{x} + 1$ and $B = x - \dfrac{1}{x} - 1$.'
      - 'Let''s add them. First $A + B$: the $\dfrac{1}{x}$ terms cancel and so do the $1$s, leaving $2x$.'
      - 'Now subtract. Then $A - B$: the $x$ terms cancel, and subtracting the negatives doubles the rest — $\dfrac{2}{x} + 2$.'
      - 'Putting that together, the expression is $2x\left(\dfrac{2}{x} + 2\right)$.'
      - 'Now multiplying out: $2x \times \dfrac{2}{x} = 4$, and $2x \times 2 = 4x$.'
      - 'So the answer is $4 + 4x = 4(1 + x)$.'
      - 'Now, the traps. Option B is $\left(\tfrac{2}{x} + 2\right)^{2}$ — the factor $A - B$ squared, from pairing the brackets wrongly. And option C, 4, is what the expression would be without the $+1$ and $-1$ inside; those two are exactly what produce the extra $4x$. Spot the difference of two squares, and a messy expansion disappears.'
    hint: 'Use $A^2 - B^2 = (A+B)(A-B)$: the sum is $2x$ and the difference is $\tfrac{2}{x} + 2$.'

  14:
    answer: D
    steps:
      - 'Here a straight line meets a curve, so we solve the two equations together. Let''s use substitution.'
      - 'Here''s our route. One equation is linear in $y$, so make $y$ the subject of it and substitute into the other.'
      - 'Let''s do that. From $y - 7x + 3 = 0$: $y = 7x - 3$.'
      - 'Next, substituting into $x^{2} + y - 5 = 0$: $x^{2} + (7x - 3) - 5 = 0$.'
      - 'Then simplifying: $x^{2} + 7x - 8 = 0$.'
      - 'Now factorise: two numbers multiplying to $-8$ and adding to $7$ are $8$ and $-1$.'
      - 'So $(x + 8)(x - 1) = 0$, giving $x = -8$ or $x = 1$.'
      - 'Now, the question asks only for $x$, so both values are the answer: $1, -8$.'
      - 'Let''s check $x = 1$: then $y = 4$, and $1 + 4 - 5 = 0$ ✓. Check $x = -8$: then $y = -59$, and $64 - 59 - 5 = 0$ ✓.'
      - 'Finally, both roots are genuine — a line meeting a parabola generally crosses it twice — so neither may be discarded. Option C, $-1, 8$, has both signs the wrong way round. Keep both roots, and match the signs to your brackets carefully.'
    hint: 'Substitute $y = 7x - 3$ into the first equation and factorise. Both roots are valid.'

  15:
    answer: C
    steps:
      - 'Both sides share a bracket here, and there''s a very tempting shortcut that loses an answer. Let''s avoid it together.'
      - 'Hold on to this idea. Both sides share the factor $(3x - 2)$, so bring everything to one side rather than dividing by it.'
      - 'Why not just divide? Dividing by $(3x - 2)$ would lose the root that makes it zero, which is exactly one of the answers.'
      - 'So let''s rearrange: $(3x - 2)(5x - 4) - (3x - 2)^{2} = 0$.'
      - 'Now factor out $(3x - 2)$: $(3x - 2)\left[(5x - 4) - (3x - 2)\right] = 0$.'
      - 'Next, simplify the square bracket: $5x - 4 - 3x + 2 = 2x - 2$.'
      - 'That leaves $(3x - 2)(2x - 2) = 0$.'
      - 'Now each bracket can be zero. That gives $3x - 2 = 0$, so $x = \dfrac{2}{3}$; or $2x - 2 = 0$, so $x = 1$.'
      - 'Let''s check $x = 1$: $(1)(1) = 1$ and $1^{2} = 1$ ✓. Check $x = \tfrac{2}{3}$: both sides are zero ✓.'
      - 'Now, the trap. Option B gives only $x = 1$ — precisely what you get by cancelling the common factor. Whenever both sides share a bracket, factorising keeps both roots and dividing throws one away. Factorise instead of cancelling, and no root gets lost.'
    hint: 'Do not cancel the common bracket — move everything to one side and factor it out, keeping both roots.'

  16:
    answer: D
    steps:
      - 'Two parabolas on one diagram, and we need to label where they cross the axis. The factorised forms make this quick. Let''s read them.'
      - 'Here''s the good news. Each curve is written in factorised form, so its crossings of the $x$-axis can be read straight off.'
      - 'Take the first curve. For $y = x(2 - x)$, the factors are $x$ and $(2 - x)$, so it meets the axis at $x = 0$ and $x = 2$.'
      - 'And the coefficient of $x^{2}$ is $-1$, so this parabola opens downwards, peaking between its roots at $x = 1$.'
      - 'Now the second curve. For $y = (x - 1)(x - 3)$, the roots are $x = 1$ and $x = 3$, and the $x^{2}$ coefficient is positive, so it opens upwards with its minimum at $x = 2$.'
      - 'So together the two curves meet the axis at four places: $0$, $1$, $2$ and $3$.'
      - 'Now look at the diagram. The origin is already marked as $0$ on the diagram, so the three labelled points $p$, $q$ and $r$ take the remaining crossings in order from left to right.'
      - 'So that gives $p = 1$, $q = 2$, $r = 3$.'
      - 'Here''s the lesson. Reading the crossings off the factorised forms is the whole method — expanding to $2x - x^{2}$ and $x^{2} - 4x + 3$ hides exactly the information the question wants. The slip to avoid is expanding the brackets first and losing sight of the roots. Read them straight off, and the labels follow.'
    hint: 'Read each curve''s roots straight from its brackets: 0 and 2 for one, 1 and 3 for the other. The labelled points follow in order.'

  17:
    answer: B
    steps:
      - 'This function has a little twist in how it''s written. Once you see it, the rest is careful arithmetic. Let''s go.'
      - 'Here''s the twist. The function is defined in terms of $x + 2$, not $x$, so find the value of $x$ that makes the input equal $-1$.'
      - 'So set $x + 2 = -1$, which gives $x = -3$.'
      - 'Now substitute $x = -3$ into the right-hand side: $f(-1) = 2(-3)^{2} + 7(-3) - 5$.'
      - 'Carefully now. Term by term: $(-3)^{2} = 9$, so the first term is $2 \times 9 = 18$.'
      - 'Next, the second is $7 \times (-3) = -21$.'
      - 'And the third is $-5$.'
      - 'Finally, adding: $18 - 21 - 5 = -8$.'
      - 'Watch out here. Substituting $x = -1$ directly is the trap: that would give $f(1)$, not $f(-1)$, since the rule''s input is $x + 2$. Working out which $x$ produces the wanted input is the step the question is built on. Always ask which $x$ gives you the input you need.'
    hint: 'The input is $x+2$, so solve $x + 2 = -1$ first, then substitute that $x$ into the expression.'

  18:
    answer: D
    steps:
      - 'This looks like a long division, but there''s a shortcut that makes it very short. Let''s look for it.'
      - 'Here''s a time-saver. Before setting out a long division, check whether the dividend factorises — here it does, by grouping.'
      - 'Let''s look at it. $x^{3} + 7x^{2} - x - 7$. Pair the first two and the last two: $x^{2}(x + 7) - 1(x + 7)$.'
      - 'Now both parts carry the bracket $(x + 7)$, so the expression is $(x + 7)(x^{2} - 1)$.'
      - 'Next, the divisor is $-1 + x^{2}$, which is just $x^{2} - 1$ written the other way round.'
      - 'That means the division is $\dfrac{(x + 7)(x^{2} - 1)}{x^{2} - 1}$.'
      - 'Now the $(x^{2} - 1)$ cancels completely.'
      - 'So that leaves $x + 7$.'
      - 'Now, the trap. Option C, $x - 7$, has the sign of the 7 wrong — it comes from pairing the terms as $x^{2}(x+7) - 1(x+7)$ but then reading the outside factor from the wrong bracket. Multiplying back, $(x+7)(x^2-1) = x^3 + 7x^2 - x - 7$ ✓, confirms which it is. Try grouping before long division — it often saves a lot of work.'
    hint: 'Factorise the dividend by grouping into $(x+7)(x^2-1)$ — the divisor is that second bracket, so it cancels.'

  19:
    answer: B
    steps:
      - 'A fraction inside a fraction can look heavy. We''ll simplify the top and bottom separately, and watch one sign carefully.'
      - 'Here''s the approach. A fraction whose top and bottom are themselves fractions — simplify each separately, then divide.'
      - 'Start with the top. The numerator is $\dfrac{1}{p} - \dfrac{1}{q}$. Over the common denominator $pq$ that is $\dfrac{q - p}{pq}$.'
      - 'Now the bottom. The denominator is $\dfrac{p}{q} - \dfrac{q}{p}$. Over $pq$ that is $\dfrac{p^{2} - q^{2}}{pq}$.'
      - 'Next, dividing one by the other means multiplying by the reciprocal, and the $pq$ cancels: $\dfrac{q - p}{p^{2} - q^{2}}$.'
      - 'Now factorise the denominator as a difference of two squares: $p^{2} - q^{2} = (p - q)(p + q)$.'
      - 'And note the numerator is the negative of $(p - q)$: $q - p = -(p - q)$.'
      - 'Putting that in, the expression is $\dfrac{-(p - q)}{(p - q)(p + q)}$, and the $(p - q)$ cancels.'
      - 'So that leaves $-\dfrac{1}{p + q}$.'
      - 'Now, the trap. The minus sign is the whole difficulty: $q - p$ and $p - q$ look alike but differ in sign, and treating them as the same gives $+\dfrac{1}{p+q}$, which is not offered. Writing one as the negative of the other makes the cancellation safe. Whenever you see $q - p$ next to $p - q$, pull out the minus sign first.'
    hint: 'Simplify top and bottom over $pq$, factorise $p^2 - q^2$, and note that $q - p = -(p - q)$.'

  20:
    answer: B
    steps:
      - 'A quadratic inequality. We''ll find the roots, then decide which side of them we want. Let''s work it out.'
      - 'Here''s the first step. Bring everything to one side so the quadratic can be factorised.'
      - 'So $y^{2} - 3y > 18$ becomes $y^{2} - 3y - 18 > 0$.'
      - 'Next, factorise: two numbers multiplying to $-18$ and adding to $-3$ are $-6$ and $3$.'
      - 'That gives $(y - 6)(y + 3) > 0$.'
      - 'So the roots are $y = 6$ and $y = -3$.'
      - 'Now here''s the key idea. A product of two factors is *positive* when both have the same sign, which happens outside the roots — to the left of the smaller and to the right of the larger.'
      - 'That means the solution is $y < -3$ or $y > 6$.'
      - 'Let''s test a value in each region. At $y = -4$: $16 + 12 = 28 > 18$ ✓. At $y = 7$: $49 - 21 = 28 > 18$ ✓. And between, at $y = 0$: $0 > 18$ is false ✓.'
