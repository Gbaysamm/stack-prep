    steps:
      - 'Three independent events, and one small word, "only", decides the answer. Let''s read it carefully.'
      - 'Here''s what the words mean. ''$Y$ and $Z$ only'' means both of those happen *and* $X$ does not — all three conditions at once.'
      - 'And the events are independent, so the probability of the combination is the product of the three separate probabilities.'
      - 'Let''s take them one by one. $Y$ occurs with probability $\dfrac{2}{3}$, and $Z$ with probability $\dfrac{1}{4}$.'
      - 'But $X$ must *not* occur. Its probability of occurring is $\dfrac{1}{2}$, so the probability it does not is $1 - \dfrac{1}{2} = \dfrac{1}{2}$.'
      - 'Now multiplying all three: $\dfrac{1}{2} \times \dfrac{2}{3} \times \dfrac{1}{4}$.'
      - 'Then the 2 in the numerator cancels the first denominator, leaving $\dfrac{1}{3} \times \dfrac{1}{4}$.'
      - 'And that is $\dfrac{1}{12}$.'
      - 'Now, the traps. Option B, $\dfrac{1}{24}$, uses $\dfrac{1}{4}$ for $Y$ or mishandles a fraction; option A is $\dfrac{1}{8}$, which drops $Y$ altogether.'
      - 'Here''s the heart of it. The word ''only'' is what brings the third factor in. Without it the answer would be $\dfrac{2}{3} \times \dfrac{1}{4} = \dfrac{1}{6}$ — the chance that $Y$ and $Z$ both happen, regardless of $X$. So read "only" carefully — it brings in that extra factor.'
    hint: '''Only'' means $X$ must fail too, so multiply $P(Y) \times P(Z)$ by $1 - P(X)$.'
