      - 'Now, the trap. Option A has $\sqrt{3} + 1$ in the denominator, which is what you get by collecting the terms with the wrong sign. A quick size check settles it: $\dfrac{5}{\sqrt{3}+1} \approx 1.8$, far too short for a tower seen at $45^{\circ}$ from 6.8 m away. A quick size check on your answer will often catch a sign slip.'
    hint: 'The $45^\circ$ makes $QH = TH$. Put that into the $30^\circ$ triangle, where the base is $5 + TH$.'

