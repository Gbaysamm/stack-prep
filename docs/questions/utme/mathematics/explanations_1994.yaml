      - 'Here''s the key first move. Split the fraction into separate powers of $x$ before integrating — the power rule needs one term at a time.'
      - 'Let''s split it. $\dfrac{1 - x}{x^{3}} = \dfrac{1}{x^{3}} - \dfrac{x}{x^{3}} = x^{-3} - x^{-2}$.'
      - 'Now integrate each: raise the index by one and divide by the new index.'
      - 'First, for $x^{-3}$: the new index is $-2$, giving $\dfrac{x^{-2}}{-2} = -\dfrac{1}{2x^{2}}$.'
      - 'Then, for $-x^{-2}$: the new index is $-1$, giving $-\dfrac{x^{-1}}{-1} = +\dfrac{1}{x}$.'
      - 'Now adding, with the constant of integration: $\dfrac{1}{x} - \dfrac{1}{2x^{2}} + k$.'
      - 'Let''s check by differentiating back: $\dfrac{1}{x} = x^{-1}$ gives $-x^{-2}$, and $-\tfrac{1}{2}x^{-2}$ gives $x^{-3}$ — together $x^{-3} - x^{-2}$ ✓.'
      - 'Now, the traps. The two minus signs on the second term make a plus, which is where this most often goes wrong. Option A tries to integrate the top and bottom separately, which is not something integration allows. Split first, then integrate one power at a time.'
    hint: 'Split into $x^{-3} - x^{-2}$ first, then use the power rule on each — and watch the double negative on the second.'

