      - 'Let''s differentiate. $y = 2x^{2} - 2x + 3$ differentiates to $\dfrac{dy}{dx} = 4x - 2$.'
      - 'Now setting that equal to the required gradient: $4x - 2 = 2$.'
      - 'So $4x = 4$, giving $x = 1$.'
      - 'But the question asks for the *point*, not just the $x$-coordinate, so the $y$-value is still needed.'
      - 'So substitute $x = 1$ back into the original curve — not into the derivative: $y = 2(1)^{2} - 2(1) + 3 = 2 - 2 + 3 = 3$.'
      - 'That means the point is $(1, 3)$.'
      - 'Now, the trap. Option C is $(0, 3)$, which has the right $y$-value but $x = 0$ — where the gradient is $-2$, not 2. Substituting back into the *curve* rather than the derivative is the step that gets the second coordinate right. Find $x$ from the derivative, and $y$ from the curve.'
    hint: 'Set the derivative equal to 2 to find $x$, then substitute that $x$ into the original curve for $y$.'

