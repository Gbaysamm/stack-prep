# UTME 1994 Mathematics — worked explanations, written against the paper.
#
# Keyed on question number; see explanations_2003.yaml for why, and for how these are written.
#
# Forty-nine questions: the paper ends at Q49 in this compilation. One answer disagrees with
# keys_1994.yaml — Q7, where the key gives the number offering both subjects rather than
# Physics only, and says so in its steps.
format_version: 1
exam_year: 1994
subject: MATH

explanations:
  1:
    answer: A
    steps:
      - "Brackets first, and the innermost bracket first of all."
      - "Inside it: $\\dfrac{9}{10} - 1 + \\dfrac{3}{4}$. Over a common denominator of 20 that is $\\dfrac{18}{20} - \\dfrac{20}{20} + \\dfrac{15}{20}$."
      - "Adding the numerators: $18 - 20 + 15 = 13$, so the inner bracket is $\\dfrac{13}{20}$."
      - "Now multiply by $\\dfrac{5}{7}$: $\\dfrac{5}{7} \\times \\dfrac{13}{20} = \\dfrac{65}{140}$."
      - "Cancel by 5: $\\dfrac{13}{28}$. That is the whole square bracket."
      - "Finally the division. Dividing by a fraction means multiplying by its reciprocal: $\\dfrac{1}{3} \\div \\dfrac{13}{28} = \\dfrac{1}{3} \\times \\dfrac{28}{13}$."
      - "That is $\\dfrac{28}{39}$."
      - "Option C is $\\dfrac{39}{28}$ — the same fraction inverted, from multiplying by $\\tfrac{13}{28}$ rather than by its reciprocal. Only the *second* fraction flips in a division."
    hint: "Work the inner bracket over a denominator of 20, multiply by $\\tfrac57$, then invert that result before multiplying by $\\tfrac13$."

  2:
    answer: B
    steps:
      - "Six decimals to handle, so deal with the top and the bottom separately before dividing."
      - "Numerator: $0.36 \\times 5.4 = 1.944$, and $1.944 \\times 0.63 = 1.22472$."
      - "Denominator: $4.2 \\times 9.0 = 37.8$, and $37.8 \\times 2.4 = 90.72$."
      - "Now divide: $\\dfrac{1.22472}{90.72}$."
      - "That is $0.0135$ to three places."
      - "Rounding to 2 significant figures: the first two significant digits are 1 and 3, and the next digit is 5, so the 3 rounds up to 4."
      - "The answer is $0.014$."
      - "Options C and D are ten times too large, from losing one decimal place in the division. A rough check settles the size: the top is about 1.2 and the bottom about 91, so the answer must be near one seventy-fifth — a hundredth or so, not a tenth."
    hint: "Multiply out the top and bottom separately, divide, then round to 2 s.f. — the third digit is 5, so round up."

  3:
    answer: B
    steps:
      - "Two logarithms in different bases, so evaluate each on its own before dividing."
      - "The numerator asks what power of 5 gives $0.04$. Since $0.04 = \\dfrac{4}{100} = \\dfrac{1}{25}$ and $25 = 5^{2}$, we have $0.04 = 5^{-2}$."
      - "So $\\log_{5}(0.04) = -2$."
      - "The denominator is a difference of logarithms with the same base, which is the logarithm of a quotient: $\\log_{3}18 - \\log_{3}2 = \\log_{3}\\dfrac{18}{2} = \\log_{3}9$."
      - "And $9 = 3^{2}$, so $\\log_{3}9 = 2$."
      - "Dividing: $\\dfrac{-2}{2} = -1$."
      - "The negative comes from $0.04$ being smaller than 1 — the logarithm of any number below 1 is negative, whatever the base."
      - "Option A is $+1$, the answer with that sign lost. Option C, $\\tfrac{2}{3}$, comes from dividing the *bases* or from mishandling the subtraction into $\\tfrac{\\log 18}{\\log 2}$, which is not what the law says."
    hint: "$0.04 = 5^{-2}$, and the difference of logs is $\\log_3 9 = 2$. The answer is negative."

  4:
    answer: D
    steps:
      - "A negative index means a reciprocal, so rewrite the left side to see what is really being asked."
      - "$8x^{-2} = \\dfrac{8}{x^{2}}$."
      - "So the equation is $\\dfrac{8}{x^{2}} = \\dfrac{2}{25}$."
      - "Cross-multiplying: $8 \\times 25 = 2x^{2}$, that is $200 = 2x^{2}$."
      - "So $x^{2} = 100$."
      - "Taking the square root: $x = 10$ (the positive root, which is what the options offer)."
      - "Check: $8(10)^{-2} = \\dfrac{8}{100} = 0.08$, and $\\dfrac{2}{25} = 0.08$ ✓."
      - "Reading $x^{-2}$ as $-x^{2}$ is the trap the notation sets. A negative index never makes the value negative — it turns it upside down."
    hint: "Rewrite $8x^{-2}$ as $\\tfrac{8}{x^2}$, cross-multiply, and take the square root at the end."

  5:
    answer: B
    steps:
      - "Reduce every surd to a multiple of the same root, then they can simply be added and subtracted."
      - "$\\sqrt{48} = \\sqrt{16 \\times 3} = 4\\sqrt{3}$."
      - "$\\sqrt{75} = \\sqrt{25 \\times 3} = 5\\sqrt{3}$."
      - "The middle term has a surd in the denominator, so rationalise: $\\dfrac{9}{\\sqrt{3}} = \\dfrac{9\\sqrt{3}}{3} = 3\\sqrt{3}$."
      - "Now all three terms are multiples of $\\sqrt{3}$: $4\\sqrt{3} - 3\\sqrt{3} + 5\\sqrt{3}$."
      - "Collecting the coefficients: $4 - 3 + 5 = 6$."
      - "So the answer is $6\\sqrt{3}$."
      - "Looking for the largest square factor is what makes each simplification work — 16 inside 48 and 25 inside 75. Option D, $18\\sqrt{3}$, is $4 + 9 + 5$, from treating the 9 as its own coefficient without rationalising."
    hint: "Simplify $\\sqrt{48}$ and $\\sqrt{75}$, rationalise $\\tfrac{9}{\\sqrt3}$, then collect the coefficients of $\\sqrt3$."

  6:
    answer: D
    steps:
      - "The value given is $\\sqrt{2}$, but the expression has $\\sqrt{2}$ in the denominator — so rearrange until the given value can be used directly."
      - "Rationalise by multiplying top and bottom by $\\sqrt{2}$: $\\dfrac{1}{\\sqrt{2}} = \\dfrac{1 \\times \\sqrt{2}}{\\sqrt{2} \\times \\sqrt{2}} = \\dfrac{\\sqrt{2}}{2}$."
      - "Now the given value slots straight in: $\\dfrac{1.414}{2}$."
      - "That is $0.707$."
      - "Dividing by 2 is far easier than dividing 1 by 1.414, which is the point of rationalising."
      - "A check on size: $\\sqrt{2}$ is a little over 1, so its reciprocal must be a little under 1 — around 0.7 ✓."
      - "Option A is $0.141$, which is $\\dfrac{1.414}{10}$ — a decimal point slipped. Option C, $0.667$, is $\\tfrac{2}{3}$, close to the right value but arrived at by guesswork rather than the calculation."
    hint: "Rationalise to $\\tfrac{\\sqrt2}{2}$, then just halve 1.414."

  7:
    answer: D
    steps:
      - "Every student offers at least one subject, so nobody sits outside the two groups — the union is the whole class of 42."
      - "The addition rule says $n(M \\cup P) = n(M) + n(P) - n(M \\cap P)$."
      - "Substituting: $42 = 28 + 22 - n(M \\cap P)$."
      - "So $n(M \\cap P) = 50 - 42 = 8$ students offer both."
      - "But the question asks for Physics *only*, which excludes those 8."
      - "Of the 22 who offer Physics, 8 also offer Mathematics, leaving $22 - 8 = 14$ who offer Physics alone."
      - "Check the whole class: 14 Physics only, $28 - 8 = 20$ Mathematics only, and 8 both. That totals $14 + 20 + 8 = 42$ ✓."
      - "Option B is 8 — the number offering *both*, which is a step on the way rather than the answer. The word 'only' is the whole difference between them, and stopping at the overlap is the single commonest error in questions of this shape."
    hint: "Find the overlap first with the addition rule, then subtract it from the 22 who offer Physics — 'only' excludes them."

  8:
    answer: B
    steps:
      - "The condition $A \\subseteq B$ means every element of $A$ is also in $B$, and that simplifies the bracket before anything else is done."
      - "Consider $A \\cap B$: it collects what is in both. Since all of $A$ lies inside $B$, that is simply all of $A$."
      - "So $A \\cap B = A$."
      - "The expression therefore becomes $A \\cap A'$."
      - "$A'$ is everything in the universal set that is *not* in $A$."
      - "So $A \\cap A'$ asks for elements that are in $A$ and not in $A$ at the same time."
      - "No element can satisfy that, so the result is the empty set, $\\varnothing$."
      - "Option A is $A$ itself, which is what you get by dropping the complement dash. That dash reverses everything: $A \\cap A = A$, but $A \\cap A' = \\varnothing$, and the two are as far apart as sets can be."
    hint: "Use $A \\subseteq B$ to reduce $A \\cap B$ to $A$, then note that nothing can be both in $A$ and outside it."

  9:
    answer: B
    steps:
      - "Notice that $25 = 5^{2}$, so $25^{x} = (5^{2})^{x} = (5^{x})^{2}$ — both terms are powers of $5^{x}$."
      - "Substituting $u = 5^{x}$ turns the equation into an ordinary quadratic: $u^{2} + 3u = 4$."
      - "Rearranging: $u^{2} + 3u - 4 = 0$."
      - "Factorise: two numbers multiplying to $-4$ and adding to $3$ are $4$ and $-1$, so $(u + 4)(u - 1) = 0$."
      - "That gives $u = -4$ or $u = 1$."
      - "Now undo the substitution. $5^{x} = -4$ is impossible — a positive base raised to any real power is positive, so that root must be discarded."
      - "$5^{x} = 1$ gives $x = 0$, since any non-zero number to the power zero is 1."
      - "Option A offers both roots as answers, and option D offers $-4$ as a value of $x$. But $-4$ was a value of $u$, not of $x$, and it fails the test that $5^{x}$ can never be negative — checking each root back in the substitution is what catches it."
    hint: "Let $u = 5^x$ so $25^x = u^2$. Solve the quadratic, then reject the negative root — $5^x$ is always positive."

  10:
    answer: B
    steps:
      - "The numerator is a difference of two squares, which factorises without any expanding."
      - "The rule is $P^{2} - Q^{2} = (P - Q)(P + Q)$, with $P = 2m - u$ and $Q = m - 2u$."
      - "First bracket: $(2m - u) - (m - 2u) = 2m - u - m + 2u = m + u$."
      - "Second bracket: $(2m - u) + (m - 2u) = 3m - 3u = 3(m - u)$."
      - "So the numerator is $3(m + u)(m - u)$."
      - "The denominator factorises too: $5m^{2} - 5u^{2} = 5(m^{2} - u^{2}) = 5(m + u)(m - u)$."
      - "Now both $(m + u)$ and $(m - u)$ cancel, leaving $\\dfrac{3}{5}$."
      - "Every letter disappears, which is why the answer is a plain number rather than an expression — and that rules out options C and D before any working. Expanding the two squares instead would give $3m^{2} - 3u^{2}$ on top, the same thing the long way round."
    hint: "Treat the numerator as a difference of two squares; the denominator factorises the same way and everything cancels."

  11:
    answer: D
    steps:
      - "Four terms with no factor common to all, so group them into pairs that each share something."
      - "Rearrange to put the $a^{2}$ terms together: $a^{2}x + a^{2}y - b^{2}x - b^{2}y$."
      - "From the first pair take out $a^{2}$: that leaves $a^{2}(x + y)$."
      - "From the second pair take out $-b^{2}$: that leaves $-b^{2}(x + y)$."
      - "Both carry the bracket $(x + y)$, so factor it out: $(x + y)(a^{2} - b^{2})$."
      - "But $a^{2} - b^{2}$ is itself a difference of two squares, and the question says 'factorize' without qualification — so it must go further."
      - "$a^{2} - b^{2} = (a - b)(a + b)$."
      - "So the full factorisation is $(x + y)(a - b)(a + b)$."
      - "Option A stops at $(a - b)(x + y)$, which is only part of the expression. Options B and C use $(x - y)$, which would need the middle signs arranged differently — expanding any candidate checks it in one line."
    hint: "Group to get $(x+y)(a^2-b^2)$, then keep going — the second bracket is a difference of two squares."

  12:
    answer: B
    steps:
      - "Each factor gives an equation through the factor theorem: if $(x - a)$ is a factor then substituting $x = a$ gives zero."
      - "For $(x - 1)$, substitute $x = 1$: $p + q + 11 - 6 = 0$, so $p + q = -5$."
      - "For $(x - 3)$, substitute $x = 3$: $27p + 9q + 33 - 6 = 0$, so $27p + 9q = -27$."
      - "Divide that second equation through by 9: $3p + q = -3$."
      - "Now subtract the first equation from this one, eliminating $q$: $(3p + q) - (p + q) = -3 - (-5)$."
      - "That gives $2p = 2$, so $p = 1$."
      - "Substituting back: $1 + q = -5$, so $q = -6$."
      - "Check with the original: $f(x) = x^{3} - 6x^{2} + 11x - 6$, and $f(1) = 1 - 6 + 11 - 6 = 0$ ✓, $f(3) = 27 - 54 + 33 - 6 = 0$ ✓."
      - "Simplifying the second equation by 9 before subtracting is what keeps the numbers small; working with $27p + 9q$ directly is where arithmetic slips creep in."
    hint: "Substitute $x = 1$ and $x = 3$, divide the second equation by 9, then subtract to eliminate $q$."

  13:
    answer: A
    steps:
      - "Two features of the graph are marked, so test each option against both."
      - "The curve passes through $(3, 0)$ and cuts the $y$-axis at $(0, -27)$."
      - "Option A, $y = (x - 3)^{3}$: at $x = 3$ it gives $0$ ✓, and at $x = 0$ it gives $(-3)^{3} = -27$ ✓."
      - "Option C, $y = x^{3} - 27$: at $x = 3$ it gives $27 - 27 = 0$ ✓, and at $x = 0$ it gives $-27$ ✓ — both points fit this one too."
      - "So the marked points alone cannot separate A from C. The *shape* at the crossing decides it."
      - "For $y = (x - 3)^{3}$ the gradient is $3(x - 3)^{2}$, which is zero at $x = 3$ — the curve flattens out as it crosses the axis."
      - "For $y = x^{3} - 27$ the gradient is $3x^{2}$, which is $27$ at $x = 3$ — steep there, and flat at $x = 0$ instead."
      - "The graph clearly flattens where it meets the axis at $(3, 0)$ and is steep where it crosses the $y$-axis, so it is $y = (x - 3)^{3}$."
      - "Options B and D can be rejected at once: B passes through $(0, 27)$, and D falls as $x$ increases, while the drawn curve rises."
    hint: "Both A and C pass through the two marked points, so look at where the curve flattens — that is its stationary inflection."

  14:
    answer: C
    steps:
      - "Substitute the given values first, so the equation becomes one in $x$ alone."
      - "With $a = 1$ and $b = 3$: $\\dfrac{1}{1 - x} = \\dfrac{3}{x - 3}$."
      - "Cross-multiply to clear both denominators: $1(x - 3) = 3(1 - x)$."
      - "Expanding the right side: $x - 3 = 3 - 3x$."
      - "Collect the $x$ terms on one side and the numbers on the other: $x + 3x = 3 + 3$."
      - "So $4x = 6$."
      - "Therefore $x = \\dfrac{6}{4} = \\dfrac{3}{2}$."
      - "Check in the original: $\\dfrac{1}{1 - 1.5} = \\dfrac{1}{-0.5} = -2$, and $\\dfrac{3}{1.5 - 3} = \\dfrac{3}{-1.5} = -2$ ✓."
      - "Both sides come out negative, which is worth noticing — the value $x = 1.5$ sits between the two forbidden values 1 and 3, where each denominator changes sign."
    hint: "Put $a = 1$ and $b = 3$ in first, cross-multiply, and collect the $x$ terms."

  15:
    answer: A
    steps:
      - "Three fractions with different denominators, so multiply through by everything at once: $r(r - 1)(r + 1)$."
      - "The first term, $\\dfrac{1}{r-1}$, becomes $r(r + 1)$."
      - "The second, $\\dfrac{2}{r+1}$, becomes $2r(r - 1)$."
      - "The right side, $\\dfrac{3}{r}$, becomes $3(r - 1)(r + 1)$."
      - "So $r(r + 1) + 2r(r - 1) = 3(r - 1)(r + 1)$."
      - "Expanding: $r^{2} + r + 2r^{2} - 2r = 3(r^{2} - 1)$."
      - "The left side collects to $3r^{2} - r$, and the right is $3r^{2} - 3$."
      - "The $3r^{2}$ appears on both sides and cancels, leaving $-r = -3$, so $r = 3$."
      - "That the quadratic terms cancel is what makes this solvable so simply — and it is a useful check that the expansion was done right. Check the answer too: $\\tfrac{1}{2} + \\tfrac{2}{4} = 1$ and $\\tfrac{3}{3} = 1$ ✓."
    hint: "Multiply through by $r(r-1)(r+1)$; the $r^2$ terms cancel and a linear equation is left."

  16:
    answer: A
    steps:
      - "Multiply both sides by the whole denominator $(1 - x)(x + 2)$ to clear the fractions."
      - "That gives $x - 3 = P(x + 2) + Q(1 - x)$."
      - "Now choose a value of $x$ that makes the $Q$ term vanish, so $P$ is left alone."
      - "$Q$ is multiplied by $(1 - x)$, which is zero when $x = 1$."
      - "Substituting $x = 1$ on the left: $1 - 3 = -2$."
      - "On the right: $P(1 + 2) + Q(0) = 3P$."
      - "So $3P = -2$, giving $P = -\\dfrac{2}{3}$."
      - "Only $P$ was asked for, so $Q$ need not be found — though putting $x = -2$ would give it."
      - "Note which bracket pairs with which constant: $P$ sits over $(1 - x)$, so it is the value $x = 1$ that isolates it. Using $x = -2$ instead would give $Q$, and option D's $+\\tfrac{2}{3}$ is this answer with the sign of the $-2$ mislaid."
    hint: "Clear the denominators, then substitute $x = 1$ — the value that kills the $Q$ term — and watch the sign."

  17:
    answer: C
    steps:
      - "There is an unknown in the denominator, so the sign of $x$ decides whether multiplying through reverses the inequality. Take the two cases separately."
      - "First suppose $x$ is negative. Then $\\dfrac{1}{x}$ is negative, and a negative number can never exceed 2 — so no negative $x$ works."
      - "Note also that $x$ cannot be zero, since $\\dfrac{1}{0}$ is undefined."
      - "So any solution must have $x > 0$."
      - "With $x$ positive, multiplying both sides by $x$ leaves the inequality direction unchanged: $1 > 2x$."
      - "Dividing by 2: $x < \\dfrac{1}{2}$."
      - "Combining with $x > 0$, the solution is $0 < x < \\dfrac{1}{2}$."
      - "Check a value inside, say $x = 0.25$: $\\dfrac{1}{0.25} = 4 > 2$ ✓. And one outside, $x = 1$: $1 > 2$ is false ✓."
      - "Option A gives $x < \\tfrac{1}{2}$ without the lower limit, which would wrongly admit every negative number — and at $x = -1$, $\\dfrac{1}{x} = -1$, nowhere near greater than 2. The lower bound is not decoration."
    hint: "Rule out negative $x$ first (the reciprocal would be negative), then multiply through safely and keep $x > 0$ in the answer."

  18:
    answer: B
    steps:
      - "The boundary is the line $2x - y - 2 = 0$, and the shading lies on one side of it. Testing a point decides which."
      - "Pick any point clearly inside the shaded region — the point $(3, 0)$ on the $x$-axis, to the right of where the line crosses, will do."
      - "Substituting: $2(3) - 0 - 2 = 6 - 2 = 4$."
      - "That is positive, so throughout the shaded region $2x - y - 2$ is greater than zero."
      - "Now decide between the strict and the inclusive inequality. The boundary line is drawn solid rather than dashed, which means the points on it are included."
      - "On the line itself, $2x - y - 2 = 0$ exactly."
      - "So the region is $2x - y - 2 \\ge 0$."
      - "Options A and C have the inequality the wrong way round, describing the region on the far side of the line — where the origin sits. Testing the origin confirms it: $0 - 0 - 2 = -2$, which is negative, and the origin is indeed *outside* the shading."
    hint: "Test a point inside the shading, such as $(3,0)$. A solid boundary line means the inequality includes equality."

  19:
    answer: D
    steps:
      - "Write the 6th term using the standard form $a + (n - 1)d$, so the common difference appears explicitly."
      - "The 6th term is $a + 5d$ — five steps after the first, not six."
      - "We are told it equals 11, and that the first term $a$ is 1."
      - "So $1 + 5d = 11$."
      - "Subtracting 1: $5d = 10$."
      - "Therefore $d = 2$."
      - "Check by listing: 1, 3, 5, 7, 9, 11 — and the 6th term is indeed 11 ✓."
      - "Using $a + 6d$ instead would give $d = \\tfrac{10}{6} = \\tfrac{5}{3}$, which is offered as option B. The $n$th term sits $n - 1$ steps along, and counting the gaps rather than the terms is what gets it right."
    hint: "The 6th term is $a + 5d$, not $a + 6d$. Substitute $a = 1$ and solve."

  20:
    answer: C
    steps:
      - "Six logarithms of powers of the same number — use the power law to bring every index out in front."
      - "The law says $\\log r^{k} = k\\log r$, so each term becomes a multiple of $\\log_{10}r$."
      - "The expression becomes $(1 + 2 + 4 + 8 + 16 + 32)\\log_{10}r$."
      - "Those coefficients are the powers of 2, and they add to $63$ — which is $2^{6} - 1$, the reason the question's right-hand side is 63."
      - "So the equation is $63\\log_{10}r = 63$."
      - "Dividing by 63: $\\log_{10}r = 1$."
      - "A logarithm of 1 in base 10 means the number is the base itself: $r = 10^{1} = 10$."
      - "Option B, $10^{0}$, is 1 — what you get from $\\log_{10}r = 0$, that is from dividing 63 by itself twice over. And option A's negative index would need the sum of the coefficients to be negative, which it plainly is not."
    hint: "Bring every index out in front; the coefficients add to 63, which cancels the right-hand side."

  21:
    answer: C
    steps:
      - "Look at how the sequence grows before guessing a formula."
      - "The terms are 3, 6, 10, 15, 21, and the gaps between them are 3, 4, 5, 6 — increasing by one each time."
      - "A sequence whose differences grow steadily like that is quadratic in $n$, so expect an $n^{2}$ in the answer."
      - "The quickest route is to test the options against the first term. For $n = 1$ the answer must be 3."
      - "Option A: $1\\left(1 - \\tfrac{1}{2}\\right) = \\tfrac{1}{2}$ ✗. Option B: $1\\left(1 + \\tfrac{1}{2}\\right) = \\tfrac{3}{2}$ ✗. Option D: $1(3) = 3$ ✓. Option C: $\\dfrac{(2)(3)}{2} = 3$ ✓."
      - "Two survive, so test $n = 2$, where the answer must be 6. Option D gives $2(5) = 10$ ✗; option C gives $\\dfrac{(3)(4)}{2} = 6$ ✓."
      - "Confirm with $n = 3$: $\\dfrac{(4)(5)}{2} = 10$ ✓, and $n = 4$: $\\dfrac{(5)(6)}{2} = 15$ ✓."
      - "So the $n$th term is $\\dfrac{(n + 1)(n + 2)}{2}$ — these are the triangular numbers, shifted along by one."
      - "Testing one value rarely settles a formula question, because distractors are usually built to match the first term. Two values almost always does."
    hint: "Check each option at $n = 1$, then use $n = 2$ to separate the ones that survive."

  22:
    answer: D
    steps:
      - "The operation is ordinary multiplication on the positive integers, so check each property in turn."
      - "Closure: the product of two positive integers is always a positive integer, so the set is closed ✓."
      - "Associativity: $(ab)c = a(bc)$ holds for ordinary multiplication ✓."
      - "Identity: an element $e$ with $a \\times e = a$ for every $a$. Taking $e = 1$ works, and 1 is a positive integer ✓."
      - "Inverse: for each $a$ there must be a positive integer $b$ with $a \\times b = 1$, the identity."
      - "That requires $b = \\dfrac{1}{a}$."
      - "But $\\dfrac{1}{a}$ is only a positive integer when $a = 1$. For $a = 2$ the inverse would be $\\tfrac{1}{2}$, which is not in the set."
      - "So the inverse property fails, and that is the answer."
      - "The set matters as much as the operation: over the positive *rationals* every element would have an inverse and all four properties would hold. It is the restriction to whole numbers that breaks this one."
    hint: "Check each property against the positive integers. The inverse of $a$ would have to be $\\tfrac1a$, which is rarely a whole number."

  23:
    answer: D
    steps:
      - "An inverse is defined relative to the identity, so the identity must be found first."
      - "The identity is the element whose row repeats the column headings and whose column repeats the row headings — combining with it changes nothing."
      - "Scanning the columns: under 2 the entries read 4, 8, 2, 6; under 4 they read 8, 6, 4, 2; under 6 they read 2, 4, 6, 8."
      - "The headings down the side are 2, 4, 6, 8, and the column under 6 matches them exactly."
      - "Checking the row for 6 as well: it reads 2, 4, 6, 8, matching the column headings ✓. So 6 is the identity."
      - "That can be confirmed arithmetically: $2 \\times 6 = 12 \\equiv 2$, $4 \\times 6 = 24 \\equiv 4$, $6 \\times 6 = 36 \\equiv 6$, $8 \\times 6 = 48 \\equiv 8$, all modulo 10 ✓."
      - "Now find the inverse of 2 — the element $x$ with $2 \\otimes x = 6$. Reading along the row for 2: the entries are 4, 8, 2, 6, and the 6 sits under the heading 8."
      - "So the inverse of 2 is 8, and indeed $2 \\times 8 = 16 \\equiv 6 \\pmod{10}$ ✓."
      - "Assuming the identity is 1 — as it would be for ordinary multiplication — is the trap here. 1 is not even in this set; modulo 10 on $\\{2,4,6,8\\}$ has 6 in that role."
    hint: "Find the identity first — it is the element whose row and column copy the headings — then look along the row for 2."

  24:
    answer: C
    steps:
      - "Multiplying the matrix by the column vector gives two ordinary equations, so write them out."
