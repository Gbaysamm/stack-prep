  47:
    answer: B
    steps:
      - 'The median of grouped data comes from a formula, and the class boundary is the detail to watch. Let''s go step by step.'
      - 'Here''s the method. For grouped data the median is estimated by interpolating within the class that contains the middle value.'
      - 'Let''s begin. First the total frequency: $6 + 15 + 20 + 7 + 2 = 50$.'
      - 'So the median lies at position $\dfrac{50}{2} = 25$.'
      - 'Now run cumulative totals down the classes. Up to $1$–$5$: 6. Up to $6$–$10$ — $6 + 15 = 21$.'
      - 'But 21 is still short of 25, so add the next class: up to $11$–$15$ the total is $21 + 20 = 41$, which passes 25. The median class is $11$–$15$.'
      - 'Now we interpolate. The formula is $L + \left(\dfrac{\tfrac{n}{2} - cf}{f}\right)c$, where $L$ is the lower class *boundary*, $cf$ the cumulative frequency before the class, $f$ its frequency and $c$ its width.'
      - 'Watch this part carefully: the classes are whole numbers, so the boundary between $6$–$10$ and $11$–$15$ sits halfway at $10.5$. The class runs from $10.5$ to $15.5$, a width of 5.'
      - 'Now substituting: $10.5 + \left(\dfrac{25 - 21}{20}\right) \times 5 = 10.5 + \dfrac{4}{20} \times 5 = 10.5 + 1 = 11.5$.'
      - 'So the median is $11\tfrac{1}{2}$.'
      - 'Now, the trap. Using 11 instead of $10.5$ for $L$ would give 12, and the half-unit gap between the stated class limits is exactly what the boundary closes. Always use the boundary, halfway between the classes, and you''ll be spot on.'
    hint: 'Find the median class by cumulative totals, then interpolate using the lower *boundary* 10.5 and a class width of 5.'

