  19:
    answer: D
    steps:
      - 'An arithmetic progression with one missing piece, the common difference. Let''s find it.'
      - 'This is the plan. Write the 6th term using the standard form $a + (n - 1)d$, so the common difference appears explicitly.'
      - 'Careful here: the 6th term is $a + 5d$ — five steps after the first, not six.'
      - 'Now, we are told it equals 11, and that the first term $a$ is 1.'
      - 'That gives $1 + 5d = 11$.'
      - 'Then subtracting 1: $5d = 10$.'
      - 'So $d = 2$.'
      - 'Let''s check by listing: 1, 3, 5, 7, 9, 11 — and the 6th term is indeed 11 ✓.'
      - 'Now, the trap. Using $a + 6d$ instead would give $d = \tfrac{10}{6} = \tfrac{5}{3}$, which is offered as option B. The $n$th term sits $n - 1$ steps along, and counting the gaps rather than the terms is what gets it right. The $n$th term is $n - 1$ steps along, so count the gaps.'
    hint: 'The 6th term is $a + 5d$, not $a + 6d$. Substitute $a = 1$ and solve.'

  20:
    answer: C
    steps:
      - 'Six logarithms added together looks like a lot of work. One law turns them into one simple equation. Let''s use it.'
      - 'Here''s the key. Six logarithms of powers of the same number — use the power law to bring every index out in front.'
      - 'Remember, the law says $\log r^{k} = k\log r$, so each term becomes a multiple of $\log_{10}r$.'
      - 'So the expression becomes $(1 + 2 + 4 + 8 + 16 + 32)\log_{10}r$.'
      - 'Now, those coefficients are the powers of 2, and they add to $63$ — which is $2^{6} - 1$, the reason the question''s right-hand side is 63.'
