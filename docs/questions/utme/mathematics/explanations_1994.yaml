    answer: D
    steps:
      - 'A definite integral of a bracket squared. We can integrate the bracket directly, as long as we remember one extra division. Let''s see.'
      - 'Here''s a shortcut. The integrand is a squared bracket, so it can be integrated directly without expanding.'
      - 'Here''s the rule. For $(ax + b)^{n}$, raise the index by one, divide by the new index, and divide by the coefficient of $x$ — here that coefficient is 2.'
      - 'So $\displaystyle\int (2x + 1)^{2}\,dx = \dfrac{(2x + 1)^{3}}{3 \times 2} = \dfrac{(2x + 1)^{3}}{6}$.'
      - 'Now evaluate between the limits, upper first.'
      - 'Start with the top. At $x = 1$, which gives $2(1) + 1 = 3$, and $\dfrac{3^{3}}{6} = \dfrac{27}{6}$.'
      - 'Then the bottom. At $x = -1$, which gives $2(-1) + 1 = -1$, and $\dfrac{(-1)^{3}}{6} = -\dfrac{1}{6}$.'
      - 'Now subtracting: $\dfrac{27}{6} - \left(-\dfrac{1}{6}\right) = \dfrac{28}{6} = \dfrac{14}{3}$.'
      - 'And as a mixed number that is $4\tfrac{2}{3}$.'
      - 'Now, the traps. The division by 2 is easy to forget — without it the answer would be $\dfrac{28}{3}$, twice as large. And the double negative at the lower limit adds a sixth rather than removing one; subtracting it instead gives $\dfrac{27}{6} - \dfrac{1}{6} = \dfrac{26}{6} = 4\tfrac{1}{3}$, which is exactly option C. Divide by the new index and by the coefficient of $x$ — both of them.'
    hint: 'Integrate the bracket directly, dividing by both the new index 3 and the coefficient 2. Mind the double negative at $x = -1$.'

