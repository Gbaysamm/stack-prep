      - 'Pick any point clearly inside the shaded region — the point $(3, 0)$ on the $x$-axis, to the right of where the line crosses, will do.'
      - 'Now substituting: $2(3) - 0 - 2 = 6 - 2 = 4$.'
      - 'And that is positive, so throughout the shaded region $2x - y - 2$ is greater than zero.'
