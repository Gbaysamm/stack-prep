explanations:
  1:
    answer: A
    steps:
      - 'Lots of fractions and brackets here, but if we take them in the right order it stays calm. Let''s begin from the inside.'
      - 'Here''s the order of work. Brackets first, and the innermost bracket first of all.'
      - 'Let''s start. Inside it: $\dfrac{9}{10} - 1 + \dfrac{3}{4}$. Over a common denominator of 20 that is $\dfrac{18}{20} - \dfrac{20}{20} + \dfrac{15}{20}$.'
      - 'Then adding the numerators: $18 - 20 + 15 = 13$, so the inner bracket is $\dfrac{13}{20}$.'
      - 'Now multiply by $\dfrac{5}{7}$ — $\dfrac{5}{7} \times \dfrac{13}{20} = \dfrac{65}{140}$.'
      - 'Next, cancel by 5: $\dfrac{13}{28}$. That is the whole square bracket.'
      - 'Finally the division. Dividing by a fraction means multiplying by its reciprocal: $\dfrac{1}{3} \div \dfrac{13}{28} = \dfrac{1}{3} \times \dfrac{28}{13}$.'
      - 'And that is $\dfrac{28}{39}$.'
      - 'Now, the trap. Option C is $\dfrac{39}{28}$ — the same fraction inverted, from multiplying by $\tfrac{13}{28}$ rather than by its reciprocal. Only the *second* fraction flips in a division. In a division, only the second fraction turns upside down.'
    hint: 'Work the inner bracket over a denominator of 20, multiply by $\tfrac57$, then invert that result before multiplying by $\tfrac13$.'

  2:
    answer: B
    steps:
      - 'Six decimals in one fraction can feel like a lot. We''ll handle the top and bottom separately, then round with care.'
      - 'Here''s our route. Six decimals to handle, so deal with the top and the bottom separately before dividing.'
      - 'Start with the top. Numerator: $0.36 \times 5.4 = 1.944$, and $1.944 \times 0.63 = 1.22472$.'
      - 'Now the bottom. Denominator: $4.2 \times 9.0 = 37.8$, and $37.8 \times 2.4 = 90.72$.'
      - 'Next, divide: $\dfrac{1.22472}{90.72}$.'
      - 'And that is $0.0135$ to three places.'
      - 'Now rounding to 2 significant figures: the first two significant digits are 1 and 3, and the next digit is 5, so the 3 rounds up to 4.'
      - 'So the answer is $0.014$.'
      - 'Now, the trap. Options C and D are ten times too large, from losing one decimal place in the division. A rough check settles the size: the top is about 1.2 and the bottom about 91, so the answer must be near one seventy-fifth — a hundredth or so, not a tenth. A rough estimate first will always tell you the size of the answer.'
    hint: 'Multiply out the top and bottom separately, divide, then round to 2 s.f. — the third digit is 5, so round up.'

  3:
    answer: B
    steps:
      - 'Two logarithms with different bases, one over the other. We''ll work each one out on its own first. Let''s go.'
      - 'This is the plan. Two logarithms in different bases, so evaluate each on its own before dividing.'
      - 'Start with the top. The numerator asks what power of 5 gives $0.04$. Since $0.04 = \dfrac{4}{100} = \dfrac{1}{25}$ and $25 = 5^{2}$, we have $0.04 = 5^{-2}$.'
      - 'So $\log_{5}(0.04) = -2$.'
      - 'Now the bottom. The denominator is a difference of logarithms with the same base, which is the logarithm of a quotient: $\log_{3}18 - \log_{3}2 = \log_{3}\dfrac{18}{2} = \log_{3}9$.'
      - 'And $9 = 3^{2}$, so $\log_{3}9 = 2$.'
      - 'Finally, dividing: $\dfrac{-2}{2} = -1$.'
      - 'Notice the sign. The negative comes from $0.04$ being smaller than 1 — the logarithm of any number below 1 is negative, whatever the base.'
      - 'Now, the traps. Option A is $+1$, the answer with that sign lost. Option C, $\tfrac{2}{3}$, comes from dividing the *bases* or from mishandling the subtraction into $\tfrac{\log 18}{\log 2}$, which is not what the law says. The logarithm of a number below 1 is always negative, so keep that minus sign.'
    hint: '$0.04 = 5^{-2}$, and the difference of logs is $\log_3 9 = 2$. The answer is negative.'

  4:
    answer: D
    steps:
      - 'A negative index can look alarming, but it simply means "one over". Let''s rewrite it and solve.'
      - 'Here''s the key idea. A negative index means a reciprocal, so rewrite the left side to see what is really being asked.'
      - 'Let''s rewrite it. $8x^{-2} = \dfrac{8}{x^{2}}$.'
      - 'So the equation is $\dfrac{8}{x^{2}} = \dfrac{2}{25}$.'
      - 'Next, cross-multiplying: $8 \times 25 = 2x^{2}$, that is $200 = 2x^{2}$.'
      - 'Dividing by 2, $x^{2} = 100$.'
      - 'Then, $x = 10$ (the positive root, which is what the options offer).'
      - 'Let''s check: $8(10)^{-2} = \dfrac{8}{100} = 0.08$, and $\dfrac{2}{25} = 0.08$ ✓.'
      - 'Now, the trap. Reading $x^{-2}$ as $-x^{2}$ is the trap the notation sets. A negative index never makes the value negative — it turns it upside down. A negative index turns a number upside down; it never makes it negative.'
    hint: 'Rewrite $8x^{-2}$ as $\tfrac{8}{x^2}$, cross-multiply, and take the square root at the end.'

  5:
    answer: B
    steps:
      - 'Three surds that look different, but they all hide the same root. Let''s uncover it.'
      - 'Here''s the aim. Reduce every surd to a multiple of the same root, then they can simply be added and subtracted.'
      - 'Start with the first. $\sqrt{48} = \sqrt{16 \times 3} = 4\sqrt{3}$.'
      - 'Next, $\sqrt{75} = \sqrt{25 \times 3} = 5\sqrt{3}$.'
      - 'Now the middle term has a surd in the denominator, so rationalise: $\dfrac{9}{\sqrt{3}} = \dfrac{9\sqrt{3}}{3} = 3\sqrt{3}$.'
      - 'Good. Now all three terms are multiples of $\sqrt{3}$ — $4\sqrt{3} - 3\sqrt{3} + 5\sqrt{3}$.'
      - 'Then collecting the coefficients: $4 - 3 + 5 = 6$.'
      - 'So the answer is $6\sqrt{3}$.'
      - 'Now, the trap. Looking for the largest square factor is what makes each simplification work — 16 inside 48 and 25 inside 75. Option D, $18\sqrt{3}$, is $4 + 9 + 5$, from treating the 9 as its own coefficient without rationalising. Simplify and rationalise every term before you add.'
    hint: 'Simplify $\sqrt{48}$ and $\sqrt{75}$, rationalise $\tfrac{9}{\sqrt3}$, then collect the coefficients of $\sqrt3$.'

  6:
    answer: D
    steps:
      - 'We''re given $\sqrt{2}$, but it''s sitting in a denominator. Let''s move it somewhere more useful.'
      - 'Here''s the problem. The value given is $\sqrt{2}$, but the expression has $\sqrt{2}$ in the denominator — so rearrange until the given value can be used directly.'
      - 'So let''s rationalise by multiplying top and bottom by $\sqrt{2}$ — $\dfrac{1}{\sqrt{2}} = \dfrac{1 \times \sqrt{2}}{\sqrt{2} \times \sqrt{2}} = \dfrac{\sqrt{2}}{2}$.'
      - 'Now the given value slots straight in: $\dfrac{1.414}{2}$.'
      - 'And that is $0.707$.'
      - 'See how much easier that is? Dividing by 2 is far easier than dividing 1 by 1.414, which is the point of rationalising.'
      - 'Does that make sense? A check on size: $\sqrt{2}$ is a little over 1, so its reciprocal must be a little under 1 — around 0.7 ✓.'
      - 'Now, the traps. Option A is $0.141$, which is $\dfrac{1.414}{10}$ — a decimal point slipped. Option C, $0.667$, is $\tfrac{2}{3}$, close to the right value but arrived at by guesswork rather than the calculation. Rationalise first, and the arithmetic becomes gentle.'
    hint: 'Rationalise to $\tfrac{\sqrt2}{2}$, then just halve 1.414.'

  7:
    answer: D
    steps:
      - 'Two overlapping groups of students, and one small word decides the answer. Let''s find the overlap first.'
      - 'Here''s the starting point. Every student offers at least one subject, so nobody sits outside the two groups — the union is the whole class of 42.'
      - 'The addition rule says $n(M \cup P) = n(M) + n(P) - n(M \cap P)$.'
      - 'Now substituting: $42 = 28 + 22 - n(M \cap P)$.'
      - 'So $n(M \cap P) = 50 - 42 = 8$ students offer both.'
      - 'Careful now. But the question asks for Physics *only*, which excludes those 8.'
      - 'So of the 22 who offer Physics, 8 also offer Mathematics, leaving $22 - 8 = 14$ who offer Physics alone.'
      - 'Let''s check the whole class: 14 Physics only, $28 - 8 = 20$ Mathematics only, and 8 both. That totals $14 + 20 + 8 = 42$ ✓.'
      - 'Now, the trap. Option B is 8 — the number offering *both*, which is a step on the way rather than the answer. The word ''only'' is the whole difference between them, and stopping at the overlap is the single commonest error in questions of this shape. When you see "only", take the overlap away.'
    hint: 'Find the overlap first with the addition rule, then subtract it from the 22 who offer Physics — ''only'' excludes them.'

  8:
    answer: B
    steps:
      - 'Set notation can look like a code, but each symbol has a plain meaning. Let''s read it one piece at a time.'
      - 'Here''s the key fact. The condition $A \subseteq B$ means every element of $A$ is also in $B$, and that simplifies the bracket before anything else is done.'
      - 'Let''s use it. Consider $A \cap B$: it collects what is in both. Since all of $A$ lies inside $B$, that is simply all of $A$.'
      - 'So $A \cap B = A$.'
      - 'So the expression becomes $A \cap A''$.'
      - 'Now remember, $A''$ is everything in the universal set that is *not* in $A$.'
      - 'So $A \cap A''$ asks for elements that are in $A$ and not in $A$ at the same time.'
      - 'Of course, no element can satisfy that, so the result is the empty set, $\varnothing$.'
      - 'Now, the trap. Option A is $A$ itself, which is what you get by dropping the complement dash. That dash reverses everything: $A \cap A = A$, but $A \cap A'' = \varnothing$, and the two are as far apart as sets can be. Nothing can be both inside a set and outside it.'
    hint: 'Use $A \subseteq B$ to reduce $A \cap B$ to $A$, then note that nothing can be both in $A$ and outside it.'

  9:
    answer: B
    steps:
      - 'This looks like an index equation, but it''s really a quadratic in disguise. Let''s reveal it.'
      - 'Here''s the key observation. Notice that $25 = 5^{2}$, so $25^{x} = (5^{2})^{x} = (5^{x})^{2}$ — both terms are powers of $5^{x}$.'
      - 'So substituting $u = 5^{x}$ turns the equation into an ordinary quadratic: $u^{2} + 3u = 4$.'
      - 'Then rearranging: $u^{2} + 3u - 4 = 0$.'
      - 'Next, factorise: two numbers multiplying to $-4$ and adding to $3$ are $4$ and $-1$, so $(u + 4)(u - 1) = 0$.'
      - 'So that gives $u = -4$ or $u = 1$.'
      - 'Now undo the substitution. $5^{x} = -4$ is impossible — a positive base raised to any real power is positive, so that root must be discarded.'
      - 'The other root works: $5^{x} = 1$ gives $x = 0$, since any non-zero number to the power zero is 1.'
      - 'Now, the traps. Option A offers both roots as answers, and option D offers $-4$ as a value of $x$. But $-4$ was a value of $u$, not of $x$, and it fails the test that $5^{x}$ can never be negative — checking each root back in the substitution is what catches it. A positive base raised to any power stays positive, so use that to reject roots.'
    hint: 'Let $u = 5^x$ so $25^x = u^2$. Solve the quadratic, then reject the negative root — $5^x$ is always positive.'

  10:
    answer: B
    steps:
      - 'This fraction looks heavy, but it''s built to cancel. Let''s factorise the top and bottom and watch.'
      - 'Here''s what matters. The numerator is a difference of two squares, which factorises without any expanding.'
      - 'Let''s name the pieces. The rule is $P^{2} - Q^{2} = (P - Q)(P + Q)$, with $P = 2m - u$ and $Q = m - 2u$.'
      - 'First bracket: $(2m - u) - (m - 2u) = 2m - u - m + 2u = m + u$.'
      - 'Now the other. Second bracket: $(2m - u) + (m - 2u) = 3m - 3u = 3(m - u)$.'
      - 'So the numerator is $3(m + u)(m - u)$.'
      - 'Next, the denominator factorises too: $5m^{2} - 5u^{2} = 5(m^{2} - u^{2}) = 5(m + u)(m - u)$.'
      - 'Now both $(m + u)$ and $(m - u)$ cancel, leaving $\dfrac{3}{5}$.'
      - 'Here''s a useful clue. Every letter disappears, which is why the answer is a plain number rather than an expression — and that rules out options C and D before any working. Expanding the two squares instead would give $3m^{2} - 3u^{2}$ on top, the same thing the long way round. A common slip is expanding everything instead of factorising, so look for a difference of two squares, and expect things to cancel.'
    hint: 'Treat the numerator as a difference of two squares; the denominator factorises the same way and everything cancels.'

  11:
    answer: D
    steps:
      - 'Four terms and no common factor, so this needs grouping. And there''s a second step many students miss. Let''s go.'
      - 'Here''s the approach. Four terms with no factor common to all, so group them into pairs that each share something.'
      - 'Let''s start. Rearrange to put the $a^{2}$ terms together: $a^{2}x + a^{2}y - b^{2}x - b^{2}y$.'
      - 'Now, from the first pair take out $a^{2}$: that leaves $a^{2}(x + y)$.'
      - 'And from the second pair take out $-b^{2}$: that leaves $-b^{2}(x + y)$.'
      - 'Here''s the payoff: both carry the bracket $(x + y)$, so factor it out: $(x + y)(a^{2} - b^{2})$.'
      - 'But $a^{2} - b^{2}$ is itself a difference of two squares, and the question says ''factorize'' without qualification — so it must go further.'
      - 'So $a^{2} - b^{2} = (a - b)(a + b)$.'
      - 'Putting it all together, the full factorisation is $(x + y)(a - b)(a + b)$.'
      - 'Now, the trap. Option A stops at $(a - b)(x + y)$, which is only part of the expression. Options B and C use $(x - y)$, which would need the middle signs arranged differently — expanding any candidate checks it in one line. Keep factorising until nothing more will come apart.'
    hint: 'Group to get $(x+y)(a^2-b^2)$, then keep going — the second bracket is a difference of two squares.'

  12:
    answer: B
    steps:
      - 'Two factors give us two equations in $p$ and $q$. Let''s build them and solve together.'
      - 'Here''s the tool. Each factor gives an equation through the factor theorem: if $(x - a)$ is a factor then substituting $x = a$ gives zero.'
      - 'Start with the first factor. For $(x - 1)$, substitute $x = 1$, which gives $p + q + 11 - 6 = 0$, so $p + q = -5$.'
      - 'Now the second. For $(x - 3)$, substitute $x = 3$, which gives $27p + 9q + 33 - 6 = 0$, so $27p + 9q = -27$.'
      - 'To keep it tidy, divide that second equation through by 9: $3p + q = -3$.'
      - 'Now subtract the first equation from this one, eliminating $q$ — $(3p + q) - (p + q) = -3 - (-5)$.'
      - 'So that gives $2p = 2$, so $p = 1$.'
      - 'Then substituting back: $1 + q = -5$, so $q = -6$.'
      - 'Let''s check with the original: $f(x) = x^{3} - 6x^{2} + 11x - 6$, and $f(1) = 1 - 6 + 11 - 6 = 0$ ✓, $f(3) = 27 - 54 + 33 - 6 = 0$ ✓.'
      - 'A tip: simplifying the second equation by 9 before subtracting is what keeps the numbers small; working with $27p + 9q$ directly is where arithmetic slips creep in. The slip to watch is subtracting the equations in the wrong order and losing a sign, so write the subtraction out in full, as we did.'
    hint: 'Substitute $x = 1$ and $x = 3$, divide the second equation by 9, then subtract to eliminate $q$.'

  13:
    answer: A
    steps:
      - 'Here we match a graph to its equation. Two options fit the points, so we''ll need to look at the shape too. Let''s see.'
      - 'Here''s how we''ll do it. Two features of the graph are marked, so test each option against both.'
      - 'Let''s read the graph. The curve passes through $(3, 0)$ and cuts the $y$-axis at $(0, -27)$.'
      - 'Option A, $y = (x - 3)^{3}$: at $x = 3$ it gives $0$ ✓, and at $x = 0$ it gives $(-3)^{3} = -27$ ✓.'
      - 'Now, option C, $y = x^{3} - 27$: at $x = 3$ it gives $27 - 27 = 0$ ✓, and at $x = 0$ it gives $-27$ ✓ — both points fit this one too.'
      - 'So the marked points alone cannot separate A from C. The *shape* at the crossing decides it.'
      - 'Here''s how to tell them apart. For $y = (x - 3)^{3}$ the gradient is $3(x - 3)^{2}$, which is zero at $x = 3$ — the curve flattens out as it crosses the axis.'
      - 'Compare that with the other. For $y = x^{3} - 27$ the gradient is $3x^{2}$, which is $27$ at $x = 3$ — steep there, and flat at $x = 0$ instead.'
      - 'Now look at the picture. The graph clearly flattens where it meets the axis at $(3, 0)$ and is steep where it crosses the $y$-axis, so it is $y = (x - 3)^{3}$.'
      - 'As for the others, options B and D can be rejected at once: B passes through $(0, 27)$, and D falls as $x$ increases, while the drawn curve rises. So when two options fit the same points, look at the shape — here, where the curve flattens.'
    hint: 'Both A and C pass through the two marked points, so look at where the curve flattens — that is its stationary inflection.'

  14:
    answer: C
    steps:
      - 'Letters first, then numbers? Here it''s easier the other way round. Let''s put the numbers in straight away.'
      - 'Here''s our route. Substitute the given values first, so the equation becomes one in $x$ alone.'
      - 'So with $a = 1$ and $b = 3$ — $\dfrac{1}{1 - x} = \dfrac{3}{x - 3}$.'
      - 'Now cross-multiply to clear both denominators: $1(x - 3) = 3(1 - x)$.'
      - 'Next, expanding the right side: $x - 3 = 3 - 3x$.'
      - 'Then collect the $x$ terms on one side and the numbers on the other: $x + 3x = 3 + 3$.'
      - 'So $4x = 6$.'
      - 'That gives $x = \dfrac{6}{4} = \dfrac{3}{2}$.'
      - 'Let''s check in the original: $\dfrac{1}{1 - 1.5} = \dfrac{1}{-0.5} = -2$, and $\dfrac{3}{1.5 - 3} = \dfrac{3}{-1.5} = -2$ ✓.'
      - 'Notice something. Both sides come out negative, which is worth noticing — the value $x = 1.5$ sits between the two forbidden values 1 and 3, where each denominator changes sign. A common slip is expanding $3(1 - x)$ as $3 - x$; multiply the 3 into both terms, and it comes out cleanly.'
    hint: 'Put $a = 1$ and $b = 3$ in first, cross-multiply, and collect the $x$ terms.'

  15:
    answer: A
    steps:
      - 'Three fractions with three different denominators. We''ll clear them all in one move, and then it gets much friendlier.'
      - 'Three fractions with different denominators, so multiply through by everything at once: $r(r - 1)(r + 1)$.'
      - 'The first term, $\dfrac{1}{r-1}$, becomes $r(r + 1)$.'
      - 'Next, the second, $\dfrac{2}{r+1}$, becomes $2r(r - 1)$.'
      - 'And the right side, $\dfrac{3}{r}$, becomes $3(r - 1)(r + 1)$.'
      - 'So $r(r + 1) + 2r(r - 1) = 3(r - 1)(r + 1)$.'
      - 'Now expanding: $r^{2} + r + 2r^{2} - 2r = 3(r^{2} - 1)$.'
      - 'Tidying up, the left side collects to $3r^{2} - r$, and the right is $3r^{2} - 3$.'
      - 'Here''s the nice part: the $3r^{2}$ appears on both sides and cancels, leaving $-r = -3$, so $r = 3$.'
      - 'That''s worth noticing. That the quadratic terms cancel is what makes this solvable so simply — and it is a useful check that the expansion was done right. Check the answer too: $\tfrac{1}{2} + \tfrac{2}{4} = 1$ and $\tfrac{3}{3} = 1$ ✓. The slip to watch is forgetting to multiply one of the terms, so every term must be multiplied, on both sides.'
    hint: 'Multiply through by $r(r-1)(r+1)$; the $r^2$ terms cancel and a linear equation is left.'

  16:
    answer: A
    steps:
      - 'Partial fractions again, and there''s a smart substitution that finds $P$ in one go. Let''s use it.'
      - 'Here''s the first step. Multiply both sides by the whole denominator $(1 - x)(x + 2)$ to clear the fractions.'
      - 'So that gives $x - 3 = P(x + 2) + Q(1 - x)$.'
      - 'Now choose a value of $x$ that makes the $Q$ term vanish, so $P$ is left alone.'
      - 'Look at $Q$ — $Q$ is multiplied by $(1 - x)$, which is zero when $x = 1$.'
      - 'So substituting $x = 1$ on the left: $1 - 3 = -2$.'
      - 'And on the right: $P(1 + 2) + Q(0) = 3P$.'
      - 'So $3P = -2$, giving $P = -\dfrac{2}{3}$.'
      - 'That''s all we need. Only $P$ was asked for, so $Q$ need not be found — though putting $x = -2$ would give it.'
      - 'Now, the trap. Note which bracket pairs with which constant: $P$ sits over $(1 - x)$, so it is the value $x = 1$ that isolates it. Using $x = -2$ instead would give $Q$, and option D''s $+\tfrac{2}{3}$ is this answer with the sign of the $-2$ mislaid. Pick the value of $x$ that clears the other letter, and watch every sign.'
    hint: 'Clear the denominators, then substitute $x = 1$ — the value that kills the $Q$ term — and watch the sign.'

  17:
    answer: C
    steps:
      - 'An inequality with $x$ underneath looks short, but it has a hidden catch. Let''s take it carefully.'
      - 'Here''s the catch. There is an unknown in the denominator, so the sign of $x$ decides whether multiplying through reverses the inequality. Take the two cases separately.'
      - 'Let''s start with negatives. First suppose $x$ is negative. Then $\dfrac{1}{x}$ is negative, and a negative number can never exceed 2 — so no negative $x$ works.'
      - 'And note also that $x$ cannot be zero, since $\dfrac{1}{0}$ is undefined.'
      - 'So any solution must have $x > 0$.'
      - 'Now, with $x$ positive, multiplying both sides by $x$ leaves the inequality direction unchanged: $1 > 2x$.'
      - 'Then dividing by 2: $x < \dfrac{1}{2}$.'
      - 'Finally, combining with $x > 0$, the solution is $0 < x < \dfrac{1}{2}$.'
      - 'Let''s check a value inside, say $x = 0.25$ — $\dfrac{1}{0.25} = 4 > 2$ ✓. And one outside, $x = 1$, which gives $1 > 2$ is false ✓.'
      - 'Now, the trap. Option A gives $x < \tfrac{1}{2}$ without the lower limit, which would wrongly admit every negative number — and at $x = -1$, $\dfrac{1}{x} = -1$, nowhere near greater than 2. The lower bound is not decoration. Keep that lower bound — it''s part of the answer.'
    hint: 'Rule out negative $x$ first (the reciprocal would be negative), then multiply through safely and keep $x > 0$ in the answer.'

  18:
    answer: B
    steps:
