      - 'Let''s begin. First the total frequency: $(y + 2) + (y - 1) + (2y - 3) + (y + 4) + (3y - 4)$.'
      - 'Now, collecting the $y$ terms: $1 + 1 + 2 + 1 + 3 = 8$, so $8y$. Collecting the numbers: $2 - 1 - 3 + 4 - 4 = -2$.'
      - 'So $\sum f = 8y - 2$.'
      - 'Now $\sum fx$, multiplying each frequency by its $x$ — $1(y+2) + 2(y-1) + 3(2y-3) + 4(y+4) + 5(3y-4)$.'
      - 'Expanding, that is $y + 2 + 2y - 2 + 6y - 9 + 4y + 16 + 15y - 20$.'
      - 'Then collecting: the $y$ terms give $1 + 2 + 6 + 4 + 15 = 28y$, and the numbers give $2 - 2 - 9 + 16 - 20 = -13$. So $\sum fx = 28y - 13$.'
      - 'Next, setting the mean: $\dfrac{28y - 13}{8y - 2} = \dfrac{43}{14}$.'
      - 'Now cross-multiplying: $14(28y - 13) = 43(8y - 2)$, that is $392y - 182 = 344y - 86$.'
      - 'So $48y = 96$, giving $y = 2$.'
      - 'Let''s check: the frequencies become 4, 1, 1, 6, 2, totalling 14, and $\sum fx = 4 + 2 + 3 + 24 + 10 = 43$, so the mean is $\dfrac{43}{14}$ ✓. Every frequency comes out positive, which it must. The usual slip is a sign error when collecting the numbers, so add them one at a time, as we did. You''ve built the method well.'
