# UTME 1995 Mathematics — worked explanations, written against the paper.
#
# Keyed on question number; see explanations_2003.yaml for why, and for how these are written.
#
# All 50 are answered. Two disagree with keys_1995.yaml and say so in their steps — Q15,
# where the key's factorisation expands to the wrong signs, and Q35, where the key takes the
# nearest printed option rather than reading a damaged radical.
format_version: 1
exam_year: 1995
subject: MATH

explanations:
  1:
    answer: A
    steps:
      - "Subtracting directly in base 5 means borrowing in fives, which is error-prone; converting to base ten, subtracting there, and converting back is safer."
      - "$3310_{5}$ has place values 125, 25, 5 and 1: $(3 \\times 125) + (3 \\times 25) + (1 \\times 5) + 0 = 375 + 75 + 5 = 455$."
      - "$1442_{5}$ is $(1 \\times 125) + (4 \\times 25) + (4 \\times 5) + 2 = 125 + 100 + 20 + 2 = 247$."
      - "Subtracting in base ten: $455 - 247 = 208$."
      - "Now convert 208 back to base 5 by repeated division. $208 \\div 5 = 41$ remainder 3."
      - "$41 \\div 5 = 8$ remainder 1. $8 \\div 5 = 1$ remainder 3. $1 \\div 5 = 0$ remainder 1."
      - "Reading the remainders upwards gives $1313_{5}$."
      - "Check: $(1 \\times 125) + (3 \\times 25) + (1 \\times 5) + 3 = 125 + 75 + 5 + 3 = 208$ ✓. Option C, $4302_{5}$, contains the digit 4 legally but is simply a different number — it is worth converting any answer back to confirm."
    hint: "Convert both numerals to base ten, subtract there, then divide repeatedly by 5 and read the remainders upwards."

  2:
    answer: B
    steps:
      - "'To 5 decimal places' means keeping exactly five digits after the point, then deciding whether the last one rounds up."
      - "The number is $3.1415926$."
      - "Counting five digits after the point: 1, 4, 1, 5, 9. So the answer will be $3.1415\\!\\ldots$ with the fifth digit being 9."
      - "The digit immediately after those five is 2."
      - "Since 2 is less than 5, the fifth digit stays as it is — no rounding up."
      - "So the answer is $3.14159$."
      - "Option A rounds the 9 up to 10, carrying into the 5 and giving $3.14160$. That would be right if the next digit were 5 or more, and it is not."
      - "Option D, $3.14200$, has rounded to three decimal places and padded with zeros — which is a different instruction altogether. Counting the places deliberately is what separates them."
    hint: "Count five digits after the point, then look at the sixth. It is 2, so nothing rounds up."

  3:
    answer: A
    steps:
      - "Percentage error compares the size of the mistake with the *true* value, not with the measurement."
      - "The formula is $\\dfrac{|\\text{measured} - \\text{actual}|}{\\text{actual}} \\times 100$."
      - "The actual length is 15 cm and the measured length is 16.8 cm."
      - "The error is $16.8 - 15 = 1.8$ cm."
      - "So the percentage error is $\\dfrac{1.8}{15} \\times 100$."
      - "$\\dfrac{1.8}{15} = 0.12$, and $0.12 \\times 100 = 12$."
      - "To 2 significant figures that is $12\\%$, written $12.00\\%$."
      - "Option C, $10.71\\%$, is $\\dfrac{1.8}{16.8} \\times 100$ — dividing by the measurement instead of the true length. The denominator is always what the error is being judged against, and here that is the 15 cm the notebook really is."
    hint: "Divide the 1.8 cm error by the true length 15, not by the measurement, then multiply by 100."

  4:
    answer: A
    steps:
      - "'10% of his basic salary' fixes the increment against the original figure, so the same amount is added every year — this is simple growth, not compound."
      - "The basic salary is ₦24,000, so the annual increment is $0.10 \\times 24000 = ₦2{,}400$."
      - "At the beginning of the first year his salary is the present one, ₦24,000."
      - "At the beginning of the second year one increment has been added: $24000 + 2400 = ₦26{,}400$."
      - "At the beginning of the third year a second increment has been added: $26400 + 2400 = ₦28{,}800$."
      - "So the answer is ₦28,800."
      - "Counting the increments is the care required: from the beginning of year 1 to the beginning of year 3 is *two* steps, not three."
      - "Option B, ₦29,040, is $24000 \\times 1.1^{2}$ — compound growth, where the second increment is 10% of the already-raised salary. The phrase 'of his basic salary' rules that out: the basic salary never changes."
    hint: "The increment is a fixed ₦2,400 each year. Two increments separate the start of year 1 from the start of year 3."

  5:
    answer: D
    steps:
      - "Writing each decimal in standard form first keeps the powers of ten under control."
      - "$0.0014 = 1.4 \\times 10^{-3}$, since the point moves three places right to reach 1.4."
      - "$0.011 = 1.1 \\times 10^{-2}$, two places."
      - "Now multiply the digits and the powers separately."
      - "$1.4 \\times 1.1 = 1.54$."
      - "For the powers, multiplying means adding the indices: $10^{-3} \\times 10^{-2} = 10^{-5}$."
      - "So the product is $1.54 \\times 10^{-5}$."
      - "Check the size: both numbers are small, so their product should be much smaller still — around a hundred-thousandth, which $10^{-5}$ is ✓."
      - "Option B, $1.54 \\times 10^{-3}$, adds only one of the indices, and options A and C have positive powers, which would make the answer larger than either number. Multiplying two numbers below 1 always gives something smaller than both."
    hint: "Put both numbers in standard form, multiply $1.4 \\times 1.1$, and add the two negative indices."

  6:
    answer: B
    steps:
      - "Fractional indices are roots: the denominator gives the root and the numerator the power."
      - "For $81^{3/4}$, take the fourth root first and then cube. Since $81 = 3^{4}$, its fourth root is 3."
      - "So $81^{3/4} = 3^{3} = 27$."
      - "For $27^{1/3}$, take the cube root: $27 = 3^{3}$, so the cube root is 3."
      - "The numerator is therefore $27 - 3 = 24$."
      - "Now the denominator: $3 \\times 2^{3} = 3 \\times 8 = 24$."
      - "So the whole expression is $\\dfrac{24}{24} = 1$."
      - "Option A is 27 — the first term of the numerator alone, with the subtraction and the division both forgotten. Taking the root before the power keeps the numbers small: raising 81 to the third power first would give 531,441 to take a fourth root of."
    hint: "Take the root before the power: the fourth root of 81 is 3, then cube it. The denominator also comes to 24."

  7:
    answer: D
    steps:
      - "Three separate pieces here, each a different kind of index or logarithm. Take them one at a time."
      - "$(16)^{3/2}$: the denominator 2 means a square root, so take $\\sqrt{16} = 4$ and then cube it."
      - "$4^{3} = 64$."
      - "$\\log_{10}0.0001$ asks what power of 10 gives $0.0001$. Since $0.0001 = 10^{-4}$, the answer is $-4$."
      - "$\\log_{2}32$ asks what power of 2 gives 32. Since $2^{5} = 32$, the answer is 5."
      - "Now add all three: $64 + (-4) + 5$."
      - "That is $64 - 4 + 5 = 65$."
      - "So the value is $65.00$."
      - "The middle term is negative because $0.0001$ is less than 1, and the logarithm of any number below 1 is negative. Treating it as $+4$ gives 73, which is not offered; but missing the sign in a question with closer options is exactly how marks go."
    hint: "Square root then cube for the first term; the second is negative because 0.0001 is below 1; the third is 5."

  8:
    answer: A
    steps:
      - "Before reaching for the conjugate, check whether the surds simplify — here they do, and that makes the question much easier."
      - "$\\sqrt{12} = \\sqrt{4 \\times 3} = 2\\sqrt{3}$."
      - "So the numerator is $2\\sqrt{3} - \\sqrt{3} = \\sqrt{3}$ — one lot of $\\sqrt{3}$ left from two."
      - "And the denominator is $2\\sqrt{3} + \\sqrt{3} = 3\\sqrt{3}$."
      - "The fraction is therefore $\\dfrac{\\sqrt{3}}{3\\sqrt{3}}$."
      - "The $\\sqrt{3}$ cancels top and bottom."
      - "That leaves $\\dfrac{1}{3}$."
      - "No rationalising was needed at all, because the surd vanished on its own. Option C, $\\tfrac{9}{15}$, comes from treating $\\sqrt{12}$ as 12 — but $\\sqrt{12}$ is about 3.46, and simplifying it to $2\\sqrt{3}$ is the step that makes everything collapse."
    hint: "Simplify $\\sqrt{12}$ to $2\\sqrt{3}$ first; the numerator and denominator then share a factor of $\\sqrt{3}$."

  9:
    answer: B
    steps:
      - "Two teams with some players in both: this is the addition rule, and the team names give the sizes."
      - "A 'first eleven' has 11 members and a 'first fourteen' has 14 — those numbers are in the names, which is the small reading trick the question turns on."
      - "Four boys are in both teams."
      - "The rule is $n(C \\cup R) = n(C) + n(R) - n(C \\cap R)$, subtracting the overlap once because adding 11 and 14 counts those four boys twice."
      - "Substituting: $11 + 14 - 4$."
      - "$11 + 14 = 25$, and $25 - 4 = 21$."
      - "So 21 boys play for at least one of the two teams."
      - "Option A is 25 — the two squads added with no allowance for the overlap. Option D is 3, which is $\\ldots$ neither here nor there; the overlap is subtracted once, not twice."
    hint: "A first eleven is 11 and a first fourteen is 14. Add them and subtract the 4 who are in both."

  10:
    answer: C
    steps:
      - "Set-builder notation reads as: all $x$ satisfying the conditions after the colon. Both conditions must hold at once."
      - "The first condition is $x^{2} = 9$, which gives $x = 3$ or $x = -3$."
      - "The second condition is $x > 4$."
      - "Now test each candidate. Is $3 > 4$? No. Is $-3 > 4$? No."
      - "Neither value satisfies both conditions, so no element belongs to $S$."
      - "A set with no elements is the empty set, written $\\varnothing$."
      - "So $S = \\varnothing$."
      - "Option A is the number 0, which is not a set at all. Option B, $\\{0\\}$, is a set *containing* the number zero — it has one element, so it is not empty. And option D, $\\{\\varnothing\\}$, is a set containing the empty set, which also has one element. The empty set itself is the only one with nothing in it."
    hint: "Solve $x^2 = 9$, test both roots against $x > 4$, and note that a set with no elements is $\\varnothing$ — not 0 and not $\\{0\\}$."

  11:
    answer: A
    steps:
      - "A factor of a polynomial makes it zero, so the factor theorem turns each factor into a substitution."
      - "$x - 1$ is a factor, so $f(1) = 0$: $1 + p + q + 6 = 0$, that is $p + q = -7$."
      - "$x + 1$ is a factor, so $f(-1) = 0$. Here $(-1)^{3} = -1$ and $(-1)^{2} = 1$, so $-1 + p - q + 6 = 0$."
      - "That gives $p - q = -5$."
      - "Now solve the pair. Adding the two equations eliminates $q$: $2p = -12$."
      - "So $p = -6$."
      - "Substituting back into $p + q = -7$: $-6 + q = -7$, so $q = -1$."
      - "Check: $f(x) = x^{3} - 6x^{2} - x + 6$, and $f(1) = 1 - 6 - 1 + 6 = 0$ ✓, $f(-1) = -1 - 6 + 1 + 6 = 0$ ✓."
      - "The sign of $(-1)^{2}$ is the usual stumble — it is positive, so the $p$ term keeps its sign while the $q$ term flips. Getting that backwards gives $p = -1$, $q = -6$, and the pair the wrong way round."
    hint: "Substitute $x = 1$ and $x = -1$ to get two equations, remembering $(-1)^2$ is positive, then add them to eliminate $q$."

  12:
    answer: B
    steps:
      - "The remainder theorem says that dividing $f(x)$ by $(x - a)$ leaves the remainder $f(a)$ — substitute the value that makes the divisor zero."
      - "The divisor is $x + 1$, which is zero at $x = -1$."
      - "So evaluate $f(-1)$ where $f(x) = 2x^{2} - px + p$."
      - "Term by term: $2(-1)^{2} = 2(1) = 2$; $-p(-1) = +p$; and the last term is $+p$."
      - "So $f(-1) = 2 + p + p = 2 + 2p$."
      - "The remainder is 6, so $2 + 2p = 6$."
      - "Therefore $2p = 4$ and $p = 2$, which is positive as the question asks."
      - "Check by substituting: $2x^{2} - 2x + 2$ at $x = -1$ gives $2 + 2 + 2 = 6$ ✓."
      - "Both $p$ terms end up positive here — one because a negative times a negative is positive, the other because it was positive already. Losing either sign gives $2 = 6$ or $2 - 2p = 6$, neither of which has a positive solution."
    hint: "Substitute $x = -1$ into $2x^2 - px + p$ and set the result equal to 6, watching that both $p$ terms come out positive."

  13:
    answer: B
    steps:
      - "$T$ sits under a square root inside a fraction, so peel the layers off one at a time, starting from the outside."
      - "Square both sides to remove the root: $s^{2} = 4r^{2}(Q\\pi T + K)$ — remember the 2 and the $r$ are both squared."
      - "Divide both sides by $4r^{2}$ to free the bracket: $\\dfrac{s^{2}}{4r^{2}} = Q\\pi T + K$."
      - "Subtract $K$: $Q\\pi T = \\dfrac{s^{2}}{4r^{2}} - K$."
      - "Now divide everything by $Q\\pi$ to isolate $T$. Dividing a difference means dividing *both* terms."
      - "The first term becomes $\\dfrac{s^{2}}{4\\pi r^{2}Q}$."
      - "The second becomes $\\dfrac{K}{\\pi Q}$."
      - "So $T = \\dfrac{s^{2}}{4\\pi r^{2}Q} - \\dfrac{K}{\\pi Q}$."
      - "Options C and D leave the $K$ term undivided, which is the commonest slip at the last step: the $Q\\pi$ divides the whole right-hand side, not just its first term. And squaring $2r$ as $2r^{2}$ rather than $4r^{2}$ is what turns the 4 into a 2 in options A and C."
    hint: "Square both sides — $(2r)^2$ is $4r^2$ — then divide by $Q\\pi$ at the end, remembering it divides both terms."

  14:
    answer: D
    steps:
      - "A graph crosses the $x$-axis where $y = 0$, so set the expression to zero and solve."
      - "$x^{2} - 5x + 6 = 0$."
      - "Factorise: two numbers multiplying to $+6$ and adding to $-5$. Since the product is positive and the sum negative, both must be negative: $-2$ and $-3$."
      - "So $(x - 2)(x - 3) = 0$."
      - "The roots are $x = 2$ and $x = 3$."
      - "The crossing points are therefore $(2, 0)$ and $(3, 0)$ — the $y$-coordinate is zero because these are points on the $x$-axis."
      - "Check by substituting: $4 - 10 + 6 = 0$ ✓ and $9 - 15 + 6 = 0$ ✓."
      - "Options A, B and C all have negative roots, which would need the sum of the roots to be negative. But the sum of the roots is $-\\dfrac{b}{a} = +5$, so they cannot both be negative — a check that rules out three options at a glance."
    hint: "Set $y = 0$ and factorise. Both roots are positive, since they add to 5 and multiply to 6."

  15:
    answer: A
    steps:
      - "Four terms with no common factor across all of them: rearrange into two pairs that each share something, then look for a common bracket."
      - "Write the expression in a helpful order: $abx^{2} - 2bxy - 3ax + 6y$."
      - "From the first pair, $abx^{2} - 2bxy$, take out $bx$: that leaves $bx(ax - 2y)$."
      - "From the second pair, $-3ax + 6y$, take out $-3$: that leaves $-3(ax - 2y)$."
      - "Both now carry the bracket $(ax - 2y)$, which is the sign that the pairing was chosen well."
      - "Factoring it out gives $(ax - 2y)(bx - 3)$."
      - "Check by expanding: $abx^{2} - 3ax - 2bxy + 6y$, which is the stem exactly ✓."
      - "Option C, $(bx + 3)(ax - 2y)$, is worth testing because it looks close. Expanding it gives $abx^{2} - 2bxy + 3ax - 6y$ — the last two signs are both wrong. Taking out $-3$ rather than $+3$ from the second pair is what gets them right, and expanding any candidate settles it in one line."
    hint: "Group as $bx(ax-2y) - 3(ax-2y)$. Watch the sign taken out of the second pair, and expand your answer to check."

  16:
    answer: A
    steps:
      - "The expression is already factorised, so read the roots straight off: $x = 3$ and $x = 4$."
      - "A product of two factors is negative when they have opposite signs, which happens between the roots."
      - "Test a value in the middle, say $x = 3.5$: $(0.5)(-0.5) = -0.25$, which is indeed negative ✓."
      - "Test outside, say $x = 5$: $(2)(1) = 2$, positive ✗."
      - "So the product is negative for $3 < x < 4$."
      - "But the inequality is $\\le 0$, not $< 0$, so the values where the product *equals* zero are included too."
      - "That happens exactly at the roots $x = 3$ and $x = 4$."
      - "So the solution includes both endpoints: $3 \\le x \\le 4$."
      - "Options B, C and D differ only in which endpoints are included. The 'or equal to' in $\\le 0$ is what brings both in, since at each root the product is 0 and 0 does satisfy $\\le 0$."
    hint: "The product is negative between the roots, and $\\le 0$ also allows equality — so both endpoints are included."

  17:
    answer: C
    steps:
      - "Write each given term in the standard form $a + (n-1)d$ and solve the pair for $a$ and $d$."
      - "The 4th term is $a + 3d = 13$."
      - "The 10th term is $a + 9d = 31$."
      - "Subtracting the first from the second eliminates $a$: $6d = 18$."
      - "So $d = 3$."
      - "Substituting back: $a + 9 = 13$, so $a = 4$."
      - "Now the 21st term is $a + 20d$ — the gap from the first term is 20, one less than 21."
      - "That is $4 + 20(3) = 4 + 60 = 64$."
      - "The commonest error is using $a + 21d$, which would give 67. The $n$th term sits $n - 1$ steps after the first, and checking with a small case confirms it: the 4th term should be $4 + 3(3) = 13$ ✓."
    hint: "Subtract the two given terms to find $d$, then $a$. The 21st term is $a + 20d$, not $a + 21d$."

  18:
    answer: A
    steps:
      - "Factorise the top and the bottom separately, then cancel whatever they share."
      - "The numerator is a difference of two squares: $x^{2} - 1 = (x - 1)(x + 1)$."
      - "The denominator has four terms, so group them: $x^{3} + 2x^{2} - x - 2 = x^{2}(x + 2) - 1(x + 2)$."
      - "Both parts carry $(x + 2)$, so it factorises as $(x + 2)(x^{2} - 1)$."
      - "And $x^{2} - 1$ factorises again: $(x + 2)(x - 1)(x + 1)$."
      - "Now the fraction is $\\dfrac{(x - 1)(x + 1)}{(x + 2)(x - 1)(x + 1)}$."
      - "Both $(x - 1)$ and $(x + 1)$ cancel, leaving $\\dfrac{1}{x + 2}$."
      - "The whole numerator disappears, which is why the answer is 1 over something rather than a ratio of two brackets. Options B and C keep an $(x-1)$ on top — that happens if only one of the two common factors is spotted, and factorising the denominator fully is what reveals both."
    hint: "Factorise the denominator by grouping to get $(x+2)(x^2-1)$, then cancel the whole numerator against it."

  19:
    answer: B
    steps:
      - "The denominator is already factorised into two distinct linear brackets, so each gets its own fraction with a constant on top."
      - "Write $\\dfrac{5x - 12}{(x - 2)(x - 3)} = \\dfrac{A}{x - 2} + \\dfrac{B}{x - 3}$."
      - "Multiply through by $(x - 2)(x - 3)$: $5x - 12 = A(x - 3) + B(x - 2)$."
      - "Now choose values of $x$ that make one bracket vanish."
      - "Put $x = 3$: the left side is $15 - 12 = 3$, and the right side is $A(0) + B(1) = B$. So $B = 3$."
      - "Put $x = 2$: the left side is $10 - 12 = -2$, and the right side is $A(-1) + B(0) = -A$. So $A = 2$."
      - "Therefore the decomposition is $\\dfrac{2}{x - 2} + \\dfrac{3}{x - 3}$."
      - "Check by recombining: $\\dfrac{2(x-3) + 3(x-2)}{(x-2)(x-3)} = \\dfrac{2x - 6 + 3x - 6}{(x-2)(x-3)} = \\dfrac{5x - 12}{(x-2)(x-3)}$ ✓."
      - "The sign at $x = 2$ is where this turns: $A$ is multiplied by $-1$, so $-A = -2$ gives $A = +2$. Option A has that term negative, which is the same working with the sign of $-A$ mishandled."
    hint: "Substitute $x = 3$ and then $x = 2$ to pick off each constant, and watch the minus that appears at $x = 2$."

  20:
    answer: A
    steps:
      - "$f(x) > 0$ means the curve is *above* the $x$-axis, so read off the stretches where the graph sits above the horizontal line."
      - "The curve crosses the axis at three places: $x = -1$, $x = 1$ and $x = 2$."
      - "To the left of $-1$ the curve is below the axis — it comes up from the bottom left."
      - "Between $-1$ and $1$ it is above the axis, rising to a peak near the $y$-axis."
      - "Between $1$ and $2$ it dips below again."
      - "Beyond $2$ it rises and stays above."
      - "So the curve is positive on two separate stretches: between $-1$ and $1$, and everywhere past $2$."
      - "That is $-1 < x < 1$ together with $x > 2$, which is option A."
      - "Options C and D include $x \\le -1$, the region where the graph is below the axis. Reading 'above' straight off the picture, rather than solving anything, is the whole method — and the three crossings split the axis into four stretches, of which exactly two qualify."
    hint: "Read where the curve lies above the axis. The three crossings give four stretches; two of them are above."

  21:
    answer: B
    steps:
      - "An operation is commutative when swapping the two inputs leaves the answer unchanged — so for each option, compute $a * b$ and $b * a$ and compare."
      - "Option A: $a * b = a + 2b$, while $b * a = b + 2a$. Trying $a = 1$, $b = 2$ gives $5$ and $4$ — different, so not commutative."
      - "Option C: $a * b = a^{2} + b$, while $b * a = b^{2} + a$. With $a = 1$, $b = 2$: $3$ and $5$ — different."
      - "Option D: $a * b = \\dfrac{a(b+1)}{2}$, while $b * a = \\dfrac{b(a+1)}{2}$. With $a = 1$, $b = 2$: $\\tfrac{3}{2}$ and $1$ — different."
      - "Option B: $a * b = a + b - ab$. Swapping gives $b * a = b + a - ba$."
      - "Now $a + b$ and $b + a$ are the same because ordinary addition is commutative, and $ab$ and $ba$ are the same because ordinary multiplication is."
      - "So the two expressions are identical for every pair, and the operation is commutative."
      - "The point is that B is built only from $a + b$ and $ab$, both of which are already symmetric in $a$ and $b$. The others single one letter out — by doubling it, squaring it, or multiplying by it — and that asymmetry is what breaks commutativity."
    hint: "Swap $a$ and $b$ in each rule. The commutative one is built only from $a+b$ and $ab$, which are already symmetric."

  22:
    answer: C
    steps:
      - "The brackets say to work the inner operation first."
      - "The inner one is $12 * 27$, and the rule is $a * b = \\sqrt{ab}$."
      - "So $12 * 27 = \\sqrt{12 \\times 27}$."
      - "Rather than multiplying out, split into factors that are easy to root: $12 \\times 27 = 324$, and $324 = 18^{2}$."
      - "So $12 * 27 = 18$."
      - "Now the outer operation: $2 * 18 = \\sqrt{2 \\times 18} = \\sqrt{36}$."
      - "That is 6."
      - "Working outwards is essential — computing $2 * 12$ first and then starring with 27 would give $\\sqrt{24} \\approx 4.9$ and then $\\sqrt{132}$, an entirely different and non-integer answer. This operation is not associative, so the brackets genuinely matter."
    hint: "Do the bracket first: $\\sqrt{12 \\times 27} = \\sqrt{324} = 18$. Then star that with 2."

  23:
    answer: D
    steps:
      - "Check first that this really is a geometric progression: each term should be a fixed multiple of the one before."
      - "Dividing the second term by the first: $\\dfrac{9/10}{1} = \\dfrac{9}{10}$. Dividing the third by the second gives $\\dfrac{9}{10}$ again ✓."
      - "So the first term is $a = 1$ and the common ratio is $r = \\dfrac{9}{10}$."
      - "A sum to infinity exists only when $r$ lies strictly between $-1$ and 1, and $0.9$ does ✓."
      - "The formula is $S_{\\infty} = \\dfrac{a}{1 - r}$."
      - "The denominator is $1 - \\dfrac{9}{10} = \\dfrac{1}{10}$."
      - "So $S_{\\infty} = \\dfrac{1}{1/10} = 10$."
      - "Dividing by a tenth multiplies by ten, which is why a ratio close to 1 gives such a large sum: the terms shrink slowly, so a great many of them add up. Option A is $\\tfrac{1}{10}$ — the denominator mistaken for the answer, and the reciprocal step skipped."
    hint: "The ratio is $\\tfrac{9}{10}$, so $1 - r = \\tfrac{1}{10}$. Dividing 1 by a tenth gives 10, not a tenth."

  24:
    answer: B
    steps:
      - "Expand the three-by-three determinant along the first row, with the alternating signs $+, -, +$."
      - "The first minor, deleting row 1 and column 1, is $\\begin{vmatrix} 1 & k \\\\ 3 & -1 \\end{vmatrix} = (1)(-1) - (k)(3) = -1 - 3k$."
      - "The second, deleting row 1 and column 2, is $\\begin{vmatrix} 2 & k \\\\ 1 & -1 \\end{vmatrix} = -2 - k$."
      - "The third, deleting row 1 and column 3, is $\\begin{vmatrix} 2 & 1 \\\\ 1 & 3 \\end{vmatrix} = 6 - 1 = 5$."
      - "Now assemble, using the top row's entries $-2$, $1$, $1$: $(-2)(-1 - 3k) - (1)(-2 - k) + (1)(5)$."
      - "The first part is $2 + 6k$; the second is $+2 + k$; the third is $5$."
      - "Adding: $2 + 6k + 2 + k + 5 = 9 + 7k$."
      - "Setting that equal to 23: $7k = 14$, so $k = 2$."
