# UTME 1995 Mathematics — worked explanations, written against the paper.
#
# Keyed on question number; see explanations_2003.yaml for why, and for how these are written.
#
# All 50 are answered. Two disagree with keys_1995.yaml and say so in their steps — Q15,
# where the key's factorisation expands to the wrong signs, and Q35, where the key takes the
# nearest printed option rather than reading a damaged radical.
# Polished for a spoken lesson: each explanation opens, moves step by step, and closes.
format_version: 1
exam_year: 1995
subject: MATH

explanations:
  1:
    answer: A
    steps:
      - 'Number bases can feel slippery, but there is a safe route through base ten. Let''s take it one step at a time.'
      - 'Here''s the plan. Subtracting directly in base 5 means borrowing in fives, which is error-prone; converting to base ten, subtracting there, and converting back is safer.'
      - 'Start with the first numeral. $3310_{5}$ has place values 125, 25, 5 and 1: $(3 \times 125) + (3 \times 25) + (1 \times 5) + 0 = 375 + 75 + 5 = 455$.'
      - 'Now the second one. $1442_{5}$ is $(1 \times 125) + (4 \times 25) + (4 \times 5) + 2 = 125 + 100 + 20 + 2 = 247$.'
      - 'With both in base ten, the subtraction is quick. Subtracting in base ten: $455 - 247 = 208$.'
      - 'Now convert 208 back to base 5 by repeated division. $208 \div 5 = 41$ remainder 3.'
      - 'Keep dividing by 5. $41 \div 5 = 8$ remainder 1. $8 \div 5 = 1$ remainder 3. $1 \div 5 = 0$ remainder 1.'
      - 'Reading the remainders upwards gives $1313_{5}$.'
      - 'Always finish by testing the answer. Check: $(1 \times 125) + (3 \times 25) + (1 \times 5) + 3 = 125 + 75 + 5 + 3 = 208$ ✓. Option C, $4302_{5}$, contains the digit 4 legally but is simply a different number — it is worth converting any answer back to confirm. Going through base ten and checking at the end is the habit that keeps these safe.'
    hint: 'Convert both numerals to base ten, subtract there, then divide repeatedly by 5 and read the remainders upwards.'

  2:
    answer: B
    steps:
      - 'Rounding questions are all about counting carefully. Let''s count the places together.'
      - 'First, be clear what the instruction asks. ''To 5 decimal places'' means keeping exactly five digits after the point, then deciding whether the last one rounds up.'
      - 'The number is $3.1415926$.'
      - 'Now, counting five digits after the point: 1, 4, 1, 5, 9. So the answer will be $3.1415\!\ldots$ with the fifth digit being 9.'
      - 'Next, look at the very next digit — this is the one that decides everything. The digit immediately after those five is 2.'
      - 'Since 2 is less than 5, the fifth digit stays as it is — no rounding up.'
      - 'That settles it. So the answer is $3.14159$.'
      - 'Now, a common slip: option A rounds the 9 up to 10, carrying into the 5 and giving $3.14160$. That would be right if the next digit were 5 or more, and it is not.'
      - 'There''s one more trap here: option D, $3.14200$, has rounded to three decimal places and padded with zeros — which is a different instruction altogether. Counting the places deliberately is what separates them. Count the places on purpose and look only at the next digit — you''ve got it.'
    hint: 'Count five digits after the point, then look at the sixth. It is 2, so nothing rounds up.'

  3:
    answer: A
    steps:
      - 'Percentage error has one detail that catches many students, and it''s what you divide by. Let''s be careful with it.'
      - 'Here''s the key idea. Percentage error compares the size of the mistake with the *true* value, not with the measurement.'
      - 'So, the formula is $\dfrac{|\text{measured} - \text{actual}|}{\text{actual}} \times 100$.'
      - 'Now, the actual length is 15 cm and the measured length is 16.8 cm.'
      - 'First, the error is $16.8 - 15 = 1.8$ cm.'
      - 'Next, put it over the true length. So the percentage error is $\dfrac{1.8}{15} \times 100$.'
      - 'Let''s work that out. $\dfrac{1.8}{15} = 0.12$, and $0.12 \times 100 = 12$.'
      - 'To 2 significant figures that is $12\%$, written $12.00\%$.'
      - 'Here''s the trap to watch: option C, $10.71\%$, is $\dfrac{1.8}{16.8} \times 100$ — dividing by the measurement instead of the true length. The denominator is always what the error is being judged against, and here that is the 15 cm the notebook really is. So always divide by the true value, and you''ll get these right.'
    hint: 'Divide the 1.8 cm error by the true length 15, not by the measurement, then multiply by 100.'

  4:
    answer: A
    steps:
      - 'This is a salary question, and the whole thing turns on one phrase: of his basic salary. Let''s see why.'
      - 'Start with that phrase. ''10% of his basic salary'' fixes the increment against the original figure, so the same amount is added every year — this is simple growth, not compound.'
      - 'So first find the increment. The basic salary is ₦24,000, so the annual increment is $0.10 \times 24000 = ₦2{,}400$.'
      - 'Now let''s walk through the years. At the beginning of the first year his salary is the present one, ₦24,000.'
      - 'At the beginning of the second year one increment has been added: $24000 + 2400 = ₦26{,}400$.'
      - 'And once more. At the beginning of the third year a second increment has been added: $26400 + 2400 = ₦28{,}800$.'
      - 'So the answer is ₦28,800.'
      - 'Counting the increments is the care required: from the beginning of year 1 to the beginning of year 3 is *two* steps, not three.'
      - 'Now, the tempting wrong answer. Option B, ₦29,040, is $24000 \times 1.1^{2}$ — compound growth, where the second increment is 10% of the already-raised salary. The phrase ''of his basic salary'' rules that out: the basic salary never changes. Remember: a fixed percentage of the original means the same amount is added every year.'
    hint: 'The increment is a fixed ₦2,400 each year. Two increments separate the start of year 1 from the start of year 3.'

  5:
    answer: D
    steps:
      - 'Multiplying small decimals is much calmer in standard form. Let''s rewrite them first.'
      - 'Here''s the approach. Writing each decimal in standard form first keeps the powers of ten under control.'
      - 'Start with the first number. $0.0014 = 1.4 \times 10^{-3}$, since the point moves three places right to reach 1.4.'
      - 'Now the second. $0.011 = 1.1 \times 10^{-2}$, two places.'
      - 'Now multiply the digits and the powers separately.'
      - 'The digits first. $1.4 \times 1.1 = 1.54$.'
      - 'Now, for the powers, multiplying means adding the indices: $10^{-3} \times 10^{-2} = 10^{-5}$.'
      - 'Put the two parts together. So the product is $1.54 \times 10^{-5}$.'
      - 'Check the size: both numbers are small, so their product should be much smaller still — around a hundred-thousandth, which $10^{-5}$ is ✓.'
      - 'As for the other options, option B, $1.54 \times 10^{-3}$, adds only one of the indices, and options A and C have positive powers, which would make the answer larger than either number. Multiplying two numbers below 1 always gives something smaller than both. Standard form keeps the zeros under control — you''ve got the method now.'
    hint: 'Put both numbers in standard form, multiply $1.4 \times 1.1$, and add the two negative indices.'

  6:
    answer: B
    steps:
      - 'Fractional indices look scary, but each one is just a root and a power. Let''s untangle them together.'
      - 'Remember: the denominator of a fractional index gives the root, and the numerator gives the power.'
      - 'Start with the first term. For $81^{3/4}$, take the fourth root first and then cube. Since $81 = 3^{4}$, its fourth root is 3.'
      - 'So $81^{3/4} = 3^{3} = 27$.'
      - 'Now the second term. For $27^{1/3}$, take the cube root: $27 = 3^{3}$, so the cube root is 3.'
      - 'Put the top together. The numerator is therefore $27 - 3 = 24$.'
      - 'Next, the bottom line. Now the denominator: $3 \times 2^{3} = 3 \times 8 = 24$.'
      - 'Now divide. So the whole expression is $\dfrac{24}{24} = 1$.'
      - 'Here''s the trap: option A is 27 — the first term of the numerator alone, with the subtraction and the division both forgotten. Taking the root before the power keeps the numbers small: raising 81 to the third power first would give 531,441 to take a fourth root of. Root first, then power — it keeps the numbers small and friendly.'
    hint: 'Take the root before the power: the fourth root of 81 is 3, then cube it. The denominator also comes to 24.'

  7:
    answer: D
    steps:
      - 'There are three separate pieces here, and each one is quick once you know what it asks. Let''s take them in turn.'
      - 'Here''s the plan. Three separate pieces here, each a different kind of index or logarithm. Take them one at a time.'
      - 'Start with the first piece. $(16)^{3/2}$: the denominator 2 means a square root, so take $\sqrt{16} = 4$ and then cube it.'
      - '$4^{3} = 64$.'
      - 'Now the second piece. $\log_{10}0.0001$ asks what power of 10 gives $0.0001$. Since $0.0001 = 10^{-4}$, the answer is $-4$.'
      - 'And the third. $\log_{2}32$ asks what power of 2 gives 32. Since $2^{5} = 32$, the answer is 5.'
      - 'Now bring them together. Now add all three: $64 + (-4) + 5$.'
      - 'That is $64 - 4 + 5 = 65$.'
      - 'So the value is $65.00$.'
      - 'Here''s where marks are lost. The middle term is negative because $0.0001$ is less than 1, and the logarithm of any number below 1 is negative. Treating it as $+4$ gives 73, which is not offered; but missing the sign in a question with closer options is exactly how marks go. A log of a number below 1 is always negative — keep that in mind and you''re safe.'
    hint: 'Square root then cube for the first term; the second is negative because 0.0001 is below 1; the third is 5.'

  8:
    answer: A
    steps:
      - 'Surds in a fraction can look like a lot of work. Here, one small simplification makes it collapse, so let''s find it.'
      - 'Before reaching for the conjugate, check whether the surds simplify — here they do, and that makes the question much easier.'
      - 'Start with the root of 12. $\sqrt{12} = \sqrt{4 \times 3} = 2\sqrt{3}$.'
      - 'Now look at the top. So the numerator is $2\sqrt{3} - \sqrt{3} = \sqrt{3}$ — one lot of $\sqrt{3}$ left from two.'
      - 'And the bottom. And the denominator is $2\sqrt{3} + \sqrt{3} = 3\sqrt{3}$.'
      - 'The fraction is therefore $\dfrac{\sqrt{3}}{3\sqrt{3}}$.'
      - 'Here''s the nice part. The $\sqrt{3}$ cancels top and bottom.'
      - 'That leaves $\dfrac{1}{3}$.'
      - 'Here''s why the options matter. No rationalising was needed at all, because the surd vanished on its own. Option C, $\tfrac{9}{15}$, comes from treating $\sqrt{12}$ as 12 — but $\sqrt{12}$ is about 3.46, and simplifying it to $2\sqrt{3}$ is the step that makes everything collapse. So always simplify the surds first — it often does the hard work for you.'
    hint: 'Simplify $\sqrt{12}$ to $2\sqrt{3}$ first; the numerator and denominator then share a factor of $\sqrt{3}$.'

  9:
    answer: B
    steps:
      - 'This one hides its numbers in the team names. Once you spot them, it''s a quick sets question.'
      - 'Here''s the setting. Two teams with some players in both: this is the addition rule, and the team names give the sizes.'
      - 'First, a ''first eleven'' has 11 members and a ''first fourteen'' has 14 — those numbers are in the names, which is the small reading trick the question turns on.'
      - 'Next, the overlap. Four boys are in both teams.'
      - 'Now, the rule is $n(C \cup R) = n(C) + n(R) - n(C \cap R)$, subtracting the overlap once because adding 11 and 14 counts those four boys twice.'
      - 'Let''s put the numbers in. Substituting: $11 + 14 - 4$.'
      - 'Work it out: $11 + 14 = 25$, and $25 - 4 = 21$.'
      - 'So 21 boys play for at least one of the two teams.'
      - 'Two traps here. Option A is 25 — the two squads added with no allowance for the overlap. Option D is 3, which is $\ldots$ neither here nor there; the overlap is subtracted once, not twice. Add the two groups, take off the overlap once, and you''re done.'
    hint: 'A first eleven is 11 and a first fourteen is 14. Add them and subtract the 4 who are in both.'

  10:
    answer: C
    steps:
      - 'Set-builder notation looks formal, but it''s really just a list of rules. Let''s test the rules together.'
      - 'First, set-builder notation reads as: all $x$ satisfying the conditions after the colon. Both conditions must hold at once.'
      - 'The first condition is $x^{2} = 9$, which gives $x = 3$ or $x = -3$.'
      - 'Now, the second condition is $x > 4$.'
      - 'Here''s the key step: test each candidate. Is $3 > 4$? No. Is $-3 > 4$? No.'
      - 'Neither value satisfies both conditions, so no element belongs to $S$.'
      - 'And remember: a set with no elements is the empty set, written $\varnothing$.'
      - 'So $S = \varnothing$.'
      - 'Now, the options are built to confuse, so let''s look closely. Option A is the number 0, which is not a set at all. Option B, $\{0\}$, holds the number zero, so it has one element. Option D, $\{\varnothing\}$, holds the empty set, so it also has one element. Nothing in the set means the empty set — not zero, and not a set holding zero.'
    hint: 'Solve $x^2 = 9$, test both roots against $x > 4$, and note that a set with no elements is $\varnothing$ — not 0 and not $\{0\}$.'

  11:
    answer: A
    steps:
      - 'Two factors, two unknowns — the factor theorem turns this into two small equations. Let''s set them up.'
      - 'Here''s the key idea. A factor of a polynomial makes it zero, so the factor theorem turns each factor into a substitution.'
      - '$x - 1$ is a factor, so $f(1) = 0$: $1 + p + q + 6 = 0$, that is $p + q = -7$.'
      - 'Now the second factor. Watch the signs here. $x + 1$ is a factor, so $f(-1) = 0$. Here $(-1)^{3} = -1$ and $(-1)^{2} = 1$, so $-1 + p - q + 6 = 0$.'
      - 'That gives $p - q = -5$.'
      - 'Now solve the pair. Adding the two equations eliminates $q$: $2p = -12$.'
      - 'So $p = -6$.'
      - 'Then find the other one. Substituting back into $p + q = -7$: $-6 + q = -7$, so $q = -1$.'
      - 'Check: $f(x) = x^{3} - 6x^{2} - x + 6$, and $f(1) = 1 - 6 - 1 + 6 = 0$ ✓, $f(-1) = -1 - 6 + 1 + 6 = 0$ ✓.'
      - 'Now, the trap. The sign of $(-1)^{2}$ is the usual stumble — it is positive, so the $p$ term keeps its sign while the $q$ term flips. Getting that backwards gives $p = -1$, $q = -6$, and the pair the wrong way round. Take your time with the powers of minus one, and this method works every time.'
    hint: 'Substitute $x = 1$ and $x = -1$ to get two equations, remembering $(-1)^2$ is positive, then add them to eliminate $q$.'

  12:
    answer: B
    steps:
      - 'This is a remainder theorem question, and the only danger is the signs. Let''s go slowly.'
      - 'First, the key fact. The remainder theorem says that dividing $f(x)$ by $(x - a)$ leaves the remainder $f(a)$ — substitute the value that makes the divisor zero.'
      - 'So what value do we use? The divisor is $x + 1$, which is zero at $x = -1$.'
      - 'Now substitute. So evaluate $f(-1)$ where $f(x) = 2x^{2} - px + p$.'
      - 'Term by term: $2(-1)^{2} = 2(1) = 2$; $-p(-1) = +p$; and the last term is $+p$.'
      - 'Collect them up. So $f(-1) = 2 + p + p = 2 + 2p$.'
      - 'Now, the remainder is 6, so $2 + 2p = 6$.'
      - 'Therefore $2p = 4$ and $p = 2$, which is positive as the question asks.'
      - 'Check by substituting: $2x^{2} - 2x + 2$ at $x = -1$ gives $2 + 2 + 2 = 6$ ✓.'
      - 'Watch the signs here. Both $p$ terms end up positive here — one because a negative times a negative is positive, the other because it was positive already. Losing either sign gives $2 = 6$ or $2 - 2p = 6$, neither of which has a positive solution. Substitute the value that makes the divisor zero, mind the signs, and you''ll get it.'
    hint: 'Substitute $x = -1$ into $2x^2 - px + p$ and set the result equal to 6, watching that both $p$ terms come out positive.'

  13:
    answer: B
    steps:
      - 'Changing the subject can feel like untangling a knot. The secret is to peel the layers off in order, from the outside in.'
      - 'Here''s the plan. $T$ sits under a square root inside a fraction, so peel the layers off one at a time, starting from the outside.'
      - 'First, square both sides to remove the root: $s^{2} = 4r^{2}(Q\pi T + K)$ — remember the 2 and the $r$ are both squared.'
      - 'Next, divide both sides by $4r^{2}$ to free the bracket: $\dfrac{s^{2}}{4r^{2}} = Q\pi T + K$.'
      - 'Then subtract $K$: $Q\pi T = \dfrac{s^{2}}{4r^{2}} - K$.'
      - 'Now for the last move. Now divide everything by $Q\pi$ to isolate $T$. Dividing a difference means dividing *both* terms.'
      - 'The first term becomes $\dfrac{s^{2}}{4\pi r^{2}Q}$.'
      - 'And the second becomes $\dfrac{K}{\pi Q}$.'
      - 'So $T = \dfrac{s^{2}}{4\pi r^{2}Q} - \dfrac{K}{\pi Q}$.'
      - 'Here''s where most slips happen. Options C and D leave the $K$ term undivided, which is the commonest slip at the last step: the $Q\pi$ divides the whole right-hand side, not just its first term. And squaring $2r$ as $2r^{2}$ rather than $4r^{2}$ is what turns the 4 into a 2 in options A and C. Divide every term, and square the whole of 2r — that''s how you keep this one right.'
    hint: 'Square both sides — $(2r)^2$ is $4r^2$ — then divide by $Q\pi$ at the end, remembering it divides both terms.'

  14:
    answer: D
    steps:
      - 'Where a graph crosses the x-axis is really a question about zero. Let''s use that.'
      - 'A graph crosses the $x$-axis where $y = 0$, so set the expression to zero and solve.'
      - 'So here''s our equation. $x^{2} - 5x + 6 = 0$.'
      - 'Now, factorise: two numbers multiplying to $+6$ and adding to $-5$. Since the product is positive and the sum negative, both must be negative: $-2$ and $-3$.'
      - 'So $(x - 2)(x - 3) = 0$.'
      - 'The roots are $x = 2$ and $x = 3$.'
      - 'Now, the crossing points are therefore $(2, 0)$ and $(3, 0)$ — the $y$-coordinate is zero because these are points on the $x$-axis.'
      - 'Check by substituting: $4 - 10 + 6 = 0$ ✓ and $9 - 15 + 6 = 0$ ✓.'
      - 'There''s also a neat shortcut here. Options A, B and C all have negative roots, which would need the sum of the roots to be negative. But the sum of the roots is $-\dfrac{b}{a} = +5$, so they cannot both be negative — a check that rules out three options at a glance. Set y to zero, factorise, and check the signs of the roots — that''s all this needs.'
    hint: 'Set $y = 0$ and factorise. Both roots are positive, since they add to 5 and multiply to 6.'

  15:
    answer: A
    steps:
      - 'Four terms and no common factor means this is a grouping question. Let''s pair them up cleverly.'
      - 'Here''s the method. Four terms with no common factor across all of them: rearrange into two pairs that each share something, then look for a common bracket.'
      - 'First, reorder the terms. Write the expression in a helpful order: $abx^{2} - 2bxy - 3ax + 6y$.'
      - 'Now, from the first pair, $abx^{2} - 2bxy$, take out $bx$: that leaves $bx(ax - 2y)$.'
      - 'Then the second pair — watch the sign. From the second pair, $-3ax + 6y$, take out $-3$: that leaves $-3(ax - 2y)$.'
      - 'Look at that. Both now carry the bracket $(ax - 2y)$, which is the sign that the pairing was chosen well.'
      - 'Factoring it out gives $(ax - 2y)(bx - 3)$.'
      - 'Check by expanding: $abx^{2} - 3ax - 2bxy + 6y$, which is the stem exactly ✓.'
      - 'Now, the option that looks close. Option C, $(bx + 3)(ax - 2y)$, is worth testing. Expanding it gives $abx^{2} - 2bxy + 3ax - 6y$ — the last two signs are both wrong. Taking out $-3$ rather than $+3$ from the second pair is what gets them right, and expanding any candidate settles it in one line.'
    hint: 'Group as $bx(ax-2y) - 3(ax-2y)$. Watch the sign taken out of the second pair, and expand your answer to check.'

  16:
    answer: A
    steps:
      - 'This is a quadratic inequality, and there''s one small symbol in it that matters a lot. Let''s find it.'
      - 'Start by reading off the roots. The expression is already factorised, so read the roots straight off: $x = 3$ and $x = 4$.'
      - 'Here''s the key idea. A product of two factors is negative when they have opposite signs, which happens between the roots.'
      - 'Test a value in the middle, say $x = 3.5$: $(0.5)(-0.5) = -0.25$, which is indeed negative ✓.'
      - 'Now, test outside, say $x = 5$: $(2)(1) = 2$, positive ✗.'
      - 'So the product is negative for $3 < x < 4$.'
      - 'Now watch this part carefully. But the inequality is $\le 0$, not $< 0$, so the values where the product *equals* zero are included too.'
      - 'That happens exactly at the roots $x = 3$ and $x = 4$.'
      - 'So the solution includes both endpoints: $3 \le x \le 4$.'
      - 'Now, the tempting wrong answers. Options B, C and D differ only in which endpoints are included. The ''or equal to'' in $\le 0$ is what brings both in, since at each root the product is 0 and 0 does satisfy $\le 0$. Less than or equal to always brings in the endpoints — don''t let them slip away.'
    hint: 'The product is negative between the roots, and $\le 0$ also allows equality — so both endpoints are included.'

  17:
    answer: C
    steps:
      - 'Arithmetic progressions always come down to two numbers, the first term and the common difference. Let''s find them.'
      - 'Here''s the method. Write each given term in the standard form $a + (n-1)d$ and solve the pair for $a$ and $d$.'
      - 'The 4th term is $a + 3d = 13$.'
      - 'Now, the 10th term is $a + 9d = 31$.'
      - 'Watch what happens next. Subtracting the first from the second eliminates $a$: $6d = 18$.'
      - 'So $d = 3$.'
      - 'Then find the first term. Substituting back: $a + 9 = 13$, so $a = 4$.'
      - 'Here''s the careful part. Now the 21st term is $a + 20d$ — the gap from the first term is 20, one less than 21.'
      - 'That is $4 + 20(3) = 4 + 60 = 64$.'
      - 'The commonest error is using $a + 21d$, which would give 67. The $n$th term sits $n - 1$ steps after the first, and checking with a small case confirms it: the 4th term should be $4 + 3(3) = 13$ ✓. Remember, the nth term is n minus one steps after the first. You''ve got it.'
    hint: 'Subtract the two given terms to find $d$, then $a$. The 21st term is $a + 20d$, not $a + 21d$.'

  18:
    answer: A
    steps:
      - 'Algebraic fractions simplify beautifully once both halves are fully factorised. Let''s factorise and cancel.'
      - 'Here''s the plan. Factorise the top and the bottom separately, then cancel whatever they share.'
      - 'Start with the top. The numerator is a difference of two squares: $x^{2} - 1 = (x - 1)(x + 1)$.'
      - 'Now the bottom, which needs grouping. The denominator has four terms, so group them: $x^{3} + 2x^{2} - x - 2 = x^{2}(x + 2) - 1(x + 2)$.'
      - 'Both parts carry $(x + 2)$, so it factorises as $(x + 2)(x^{2} - 1)$.'
      - 'And one more step. And $x^{2} - 1$ factorises again: $(x + 2)(x - 1)(x + 1)$.'
      - 'Now the fraction is $\dfrac{(x - 1)(x + 1)}{(x + 2)(x - 1)(x + 1)}$.'
      - 'Both $(x - 1)$ and $(x + 1)$ cancel, leaving $\dfrac{1}{x + 2}$.'
      - 'Here''s why the options matter. The whole numerator disappears, which is why the answer is 1 over something rather than a ratio of two brackets. Options B and C keep an $(x-1)$ on top — that happens if only one of the two common factors is spotted, and factorising the denominator fully is what reveals both. Factorise fully before cancelling, and you''ll spot every common factor.'
    hint: 'Factorise the denominator by grouping to get $(x+2)(x^2-1)$, then cancel the whole numerator against it.'

  19:
    answer: B
    steps:
      - 'Partial fractions are a routine you can learn, and this one is a clean example. Let''s follow the routine.'
      - 'First, the setup. The denominator is already factorised into two distinct linear brackets, so each gets its own fraction with a constant on top.'
      - 'So, write $\dfrac{5x - 12}{(x - 2)(x - 3)} = \dfrac{A}{x - 2} + \dfrac{B}{x - 3}$.'
      - 'Now clear the denominators. Multiply through by $(x - 2)(x - 3)$: $5x - 12 = A(x - 3) + B(x - 2)$.'
      - 'Here''s the clever part. Now choose values of $x$ that make one bracket vanish.'
      - 'First, put $x = 3$: the left side is $15 - 12 = 3$, and the right side is $A(0) + B(1) = B$. So $B = 3$.'
      - 'Next, put $x = 2$: the left side is $10 - 12 = -2$, and the right side is $A(-1) + B(0) = -A$. So $A = 2$.'
      - 'Therefore the decomposition is $\dfrac{2}{x - 2} + \dfrac{3}{x - 3}$.'
      - 'Check by recombining: $\dfrac{2(x-3) + 3(x-2)}{(x-2)(x-3)} = \dfrac{2x - 6 + 3x - 6}{(x-2)(x-3)} = \dfrac{5x - 12}{(x-2)(x-3)}$ ✓.'
      - 'Now, the trap. The sign at $x = 2$ is where this turns: $A$ is multiplied by $-1$, so $-A = -2$ gives $A = +2$. Option A has that term negative, which is the same working with the sign of $-A$ mishandled. Choose values that kill one bracket at a time, and mind the minus signs.'
    hint: 'Substitute $x = 3$ and then $x = 2$ to pick off each constant, and watch the minus that appears at $x = 2$.'

  20:
    answer: A
    steps:
      - 'This one is all about reading a graph, not solving anything. Let''s read it carefully together.'
      - 'First, $f(x) > 0$ means the curve is *above* the $x$-axis, so read off the stretches where the graph sits above the horizontal line.'
      - 'The curve crosses the axis at three places: $x = -1$, $x = 1$ and $x = 2$.'
      - 'Now look at each stretch in turn. To the left of $-1$ the curve is below the axis — it comes up from the bottom left.'
      - 'Next, between $-1$ and $1$ it is above the axis, rising to a peak near the $y$-axis.'
      - 'Then, between $1$ and $2$ it dips below again.'
      - 'And finally, beyond $2$ it rises and stays above.'
      - 'So the curve is positive on two separate stretches: between $-1$ and $1$, and everywhere past $2$.'
