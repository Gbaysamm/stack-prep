explanations:
  1:
    answer: D
    steps:
      - 'Base four numerals just need their place values written out. Let''s do that and build an equation.'
      - 'A numeral in base 4 has place values that are powers of 4, so write out what each digit is worth before solving for $P$.'
      - 'Start from the right. Reading $1P03$ from the right, the columns are worth $1$, $4$, $16$ and $64$.'
      - 'So $(1P03)_{4} = (1 \times 64) + (P \times 16) + (0 \times 4) + (3 \times 1)$.'
      - 'That is $64 + 16P + 3 = 67 + 16P$.'
      - 'Now use the value we''re given. Setting it equal to 115: $67 + 16P = 115$.'
      - 'So $16P = 48$, giving $P = 3$.'
      - 'Check $P$ is a legal base-4 digit — digits must be 0 to 3, and 3 just qualifies ✓. And check the whole numeral: $(1303)_{4} = 64 + 48 + 0 + 3 = 115$ ✓.'
      - 'One more thing to notice. The zero in the third column contributes nothing, but it still holds a place. Dropping it would shift every other digit and change the answer entirely. Every digit holds its place, even a zero — you''ve got this one.'
    hint: 'Write out the four place values 64, 16, 4 and 1, build an equation in $P$, and check your $P$ is a valid base-4 digit.'

  2:
    answer: B
    steps:
      - 'Squaring these decimals by hand would take ages. There''s a much better way, so let''s look for it.'
      - 'Squaring two four-figure decimals by hand is slow and error-prone, so look for structure first — and a difference of two squares is exactly that.'
      - 'The identity is $a^{2} - b^{2} = (a + b)(a - b)$.'
      - 'Now name the two numbers. Here $a = 64.764$ and $b = 35.236$.'
      - 'Watch what happens to the sum. The sum is $64.764 + 35.236 = 100$ exactly — the decimals were chosen to make this happen, which is the signal the identity was intended.'
      - 'Now, the difference is $64.764 - 35.236 = 29.528$.'
      - 'So the expression is $100 \times 29.528 = 2952.8$.'
      - 'Now round to 3 significant figures. The first three significant digits are 2, 9 and 5, and the next digit is 2, which is below 5, so the 5 stays.'
      - 'That gives 2950.'
      - 'Watch out for the traps here. Option A is 2960, from rounding 2952.8 up. Rounding is decided by the digit immediately after the ones you keep, and here that digit is 2. Look for a difference of two squares whenever two numbers add to something neat.'
    hint: 'Use $a^2 - b^2 = (a+b)(a-b)$ — the two numbers add to exactly 100 — then round the product to 3 s.f.'

  3:
    answer: C
    steps:
      - 'Cubing tiny decimals invites lost zeros. Standard form keeps them safe, so let''s use it.'
      - 'So write each decimal in standard form first, and cube that.'
      - 'Start with the first number. $0.006 = 6 \times 10^{-3}$, so $(0.006)^{3} = 6^{3} \times 10^{-9} = 216 \times 10^{-9}$.'
      - 'Now the second. $0.004 = 4 \times 10^{-3}$, so $(0.004)^{3} = 4^{3} \times 10^{-9} = 64 \times 10^{-9}$.'
      - 'Here''s the nice part. Both now carry the same power of ten, so they can be added directly: $216 + 64 = 280$.'
      - 'So the total is $280 \times 10^{-9}$.'
      - 'But we''re not quite done. That is not yet standard form, which needs exactly one non-zero digit before the point.'
      - 'Moving the point two places left multiplies the power of ten by $10^{2}$ — $280 \times 10^{-9} = 2.8 \times 10^{-7}$.'
      - 'Watch out for this one: option A is $2.8 \times 10^{-9}$, which keeps the original power of ten and forgets that shifting 280 to 2.8 must be paid for. Every place the decimal point moves left raises the index by one. Every place the point moves left raises the index by one — hold on to that.'
    hint: 'Cube each number in standard form, add them while the powers of ten match, then fix the answer into standard form.'

  4:
    answer: C
    steps:
      - 'When the logs of 2 and 3 are given, the job is to build the number from 2s and 3s. Let''s see how.'
      - 'You are given the logarithms of 2 and 3, so express 13.5 using only 2s and 3s.'
      - 'Start by rewriting 13.5. $13.5 = \dfrac{27}{2}$, and $27 = 3^{3}$, so $13.5 = \dfrac{3^{3}}{2}$.'
      - 'Now apply the log laws. A quotient becomes a subtraction and a power becomes a multiplier.'
      - '$\log_{a}13.5 = \log_{a}3^{3} - \log_{a}2 = 3\log_{a}3 - \log_{a}2$.'
      - 'Put in the values. Substituting the given values: $3(1.097) - 0.693$.'
      - '$3 \times 1.097 = 3.291$.'
      - 'Then $3.291 - 0.693 = 2.598$.'
      - 'Here''s where it goes wrong: option B, 1.790, is $1.097 + 0.693$ — just adding the two logs you were given, which is $\log_{a}6$, not $\log_{a}13.5$. The other options don''t come from any correct use of the log laws. Writing $13.5$ as $3^{3} \div 2$ is the step that decides it. Break the number into its prime pieces first, and the log laws do the rest.'
    hint: 'Write 13.5 as $\tfrac{3^3}{2}$, then split it into $3\log_a 3 - \log_a 2$.'

  5:
    answer: B
    steps:
      - 'Log expressions like this simplify nicely if you follow the laws in order. Let''s go step by step.'
      - 'Bring the coefficient inside the logarithm first, so the two terms can be combined into one.'
      - 'Start with the coefficient. The power law says $2\log_{2}6 = \log_{2}6^{2} = \log_{2}36$.'
      - 'So the expression is $\log_{2}96 - \log_{2}36$.'
      - 'Now combine. A difference of logarithms with the same base is the logarithm of a quotient: $\log_{2}\dfrac{96}{36}$.'
      - 'Simplify the fraction: both divide by 12, giving $\dfrac{8}{3}$.'
      - 'Now watch this. So the expression is $\log_{2}\dfrac{8}{3}$, which splits again as $\log_{2}8 - \log_{2}3$.'
      - 'And $\log_{2}8 = 3$, since $2^{3} = 8$.'
      - 'So the answer is $3 - \log_{2}3$.'
      - 'Here''s the trap. Option A is $2 - \log_{2}3$, which comes from taking $\log_{2}4$ instead of $\log_{2}8$ — that is, simplifying $\tfrac{96}{36}$ carelessly to $\tfrac{4}{3}$ rather than $\tfrac{8}{3}$. Simplify the fraction carefully — that one step decides the answer.'
    hint: 'Turn $2\log_2 6$ into $\log_2 36$, subtract to get $\log_2 \tfrac{8}{3}$, then split off $\log_2 8 = 3$.'

  6:
    answer: D
    steps:
      - 'Every number here is a power of 2, and that''s the key. Let''s rewrite everything in base 2.'
      - 'On the left, $8 = 2^{3}$, so $8^{x/2} = \left(2^{3}\right)^{x/2} = 2^{3x/2}$ — raising a power to a power multiplies the indices.'
      - 'Now, on the right, $2^{3/8}$ is already in base 2.'
      - 'And $4 = 2^{2}$, so $4^{3/4} = \left(2^{2}\right)^{3/4} = 2^{3/2}$.'
      - 'Now combine the right side. Multiplying powers of the same base adds the indices: $2^{3/8} \times 2^{3/2} = 2^{3/8 + 3/2}$.'
      - 'Over a denominator of 8: $\dfrac{3}{8} + \dfrac{12}{8} = \dfrac{15}{8}$.'
      - 'Here''s the payoff. So $2^{3x/2} = 2^{15/8}$, and since the bases match, the indices must be equal: $\dfrac{3x}{2} = \dfrac{15}{8}$.'
      - 'Finally, multiplying both sides by $\dfrac{2}{3}$ — $x = \dfrac{15}{8} \times \dfrac{2}{3} = \dfrac{30}{24} = \dfrac{5}{4}$.'
      - 'A word of warning. The two rules do different jobs and mixing them up is the trap: a power *of* a power multiplies indices, while a product of powers adds them. Both appear here, one on each side. Power of a power multiplies; a product of powers adds. You''ve got the method now.'
    hint: 'Write 8 and 4 as powers of 2, then equate the indices — multiplying for a power of a power, adding for a product.'

  7:
    answer: A
    steps:
      - 'Surds in the denominator are cleared with the conjugate. There''s a bit of arithmetic, so let''s be patient with it.'
      - 'A surd in the denominator is cleared by multiplying top and bottom by the conjugate — the same expression with its middle sign reversed.'
      - 'Find the conjugate. The denominator is $3\sqrt{5} - 2\sqrt{3}$, so the conjugate is $3\sqrt{5} + 2\sqrt{3}$.'
      - 'The new denominator is a difference of two squares: $(3\sqrt{5})^{2} - (2\sqrt{3})^{2} = 9 \times 5 - 4 \times 3 = 45 - 12 = 33$.'
      - 'Now the numerator: $(2\sqrt{3} + 3\sqrt{5})(3\sqrt{5} + 2\sqrt{3})$.'
      - 'Four products here. Expanding term by term: $2\sqrt{3} \times 3\sqrt{5} = 6\sqrt{15}$; $2\sqrt{3} \times 2\sqrt{3} = 4 \times 3 = 12$; $3\sqrt{5} \times 3\sqrt{5} = 9 \times 5 = 45$; $3\sqrt{5} \times 2\sqrt{3} = 6\sqrt{15}$.'
      - 'Collecting: $12 + 45 + 12\sqrt{15} = 57 + 12\sqrt{15}$.'
      - 'Now simplify. So the expression is $\dfrac{57 + 12\sqrt{15}}{33}$, and every term divides by 3.'
      - 'That gives $\dfrac{19 + 4\sqrt{15}}{11}$.'
      - 'Here''s the usual slip. Option B has the right numerator over 19, but 19 doesn''t come out of the working at all — the bottom is $45 - 12 = 33$, and dividing by 3 gives 11. The slip to watch for is squaring $3\sqrt{5}$ as $3 \times 5$ rather than $9 \times 5$; the coefficient gets squared too. Square the coefficient as well as the surd, and this comes out cleanly.'
    hint: 'Multiply top and bottom by $3\sqrt{5} + 2\sqrt{3}$, square the coefficients as well as the surds, then divide through by 3.'

  8:
    answer: B
    steps:
      - 'Simple interest questions are about one formula and one careful reading. Let''s read carefully.'
      - 'Simple interest is earned on the original sum only, at the same amount every year, so the formula is $I = \dfrac{PRT}{100}$.'
      - 'First find the interest itself. The money grew from ₦1,000 to ₦1,240.'
      - 'So the interest over the whole period is $1240 - 1000 = ₦240$.'
      - 'Now the formula. Now substitute into the formula with $P = 1000$ and $T = 3$ — $240 = \dfrac{1000 \times R \times 3}{100}$.'
      - 'The right side simplifies: $\dfrac{3000R}{100} = 30R$.'
      - 'So $30R = 240$, giving $R = 8$.'
      - 'The rate is therefore 8% per annum.'
      - 'Before we finish, a quick check: 8% of ₦1,000 is ₦80 a year, and three years give $3 \times 80 = ₦240$ ✓. The ₦1,240 is the *final amount*, not the interest — using it directly in the formula is the mistake the question invites. Always separate the interest from the final amount first — that''s the key.'
    hint: 'Subtract to get the interest of ₦240 first, then use $I = \tfrac{PRT}{100}$ with $P = 1000$ and $T = 3$.'

  9:
    answer: C
    steps:
      - 'This sets question has a bracket, so we''ll work from the inside out. There''s a neat shortcut at the end too.'
      - 'Work from the inside out: the bracket $Y \cup Z$ first, then intersect the result with $X$.'
      - 'A union collects everything in either set: $Y = \{P, N, O, U, R\}$ and $Z = \{L, O, U, D\}$.'
      - 'Together they give $\{P, N, O, U, R, L, D\}$ — the O and U appear in both but are listed once.'
      - 'Now intersect with $X = \{S, P, E, N, D\}$, keeping only what appears in both.'
      - 'Going through $X$ one letter at a time: S is not in the union; P is ✓; E is not; N is ✓; D is ✓.'
      - 'So $X \cap (Y \cup Z) = \{P, N, D\}$.'
      - 'Here''s something useful. There is a shortcut worth knowing for questions like this. An intersection with $X$ can never contain anything outside $X$, so the answer must be a subset of $\{S, P, E, N, D\}$.'
      - 'Checking the options against that alone: A contains O, U and R; B contains R; D contains U. None of those letters is in $X$, so all three are impossible before any working is done.'
      - 'That leaves only $\{P, N, D\}$. Ruling out options by what they *cannot* contain is often faster than computing the answer outright. Options containing O, U or R are the traps, since those letters are not in X. Keep that trick handy.'
    hint: 'Do the union first, then intersect. Or note that the answer must be a subset of $X$ — that alone eliminates three options.'

  10:
    answer: B
    steps:
      - 'Two overlapping groups inside a total — this is the addition rule, followed by one subtraction. Let''s go.'
      - 'Two overlapping groups inside a fixed total: find how many are in at least one group, then subtract from the total.'
      - 'The addition rule avoids double-counting: $n(H \cup I) = n(H) + n(I) - n(H \cap I)$.'
      - 'Why subtract? The 9 who speak both have been counted once in the 80 and once in the 20, so they must be taken off once.'
      - 'Substituting: $n(H \cup I) = 80 + 20 - 9 = 91$.'
      - 'So 91 students speak at least one of the two languages.'
      - 'Now think about the rest. Everyone else speaks neither, and there are 100 students altogether.'
      - 'So the answer is $100 - 91 = 9$.'
      - 'A small warning. That it matches the 9 who speak both is a coincidence of the numbers, not a rule. Option A, 0, is what you get by adding 80 and 20 to make 100 and concluding everyone is covered — the overlap is exactly what makes that wrong. Take the overlap off once, then subtract from the total — you''ve got it.'
    hint: 'Add the two groups, subtract the overlap once, then take the result away from 100.'

  11:
    answer: A
    steps:
      - 'Divisible by means factor, so the factor theorem does all the work here. Let''s go slowly with the signs.'
      - 'First, what the words mean. ''Divisible by $x + 1$'' means $x + 1$ is a factor, so dividing leaves no remainder.'
      - 'The factor theorem turns that into a substitution: if $(x - a)$ is a factor of $f(x)$, then $f(a) = 0$.'
      - 'Now which value to use. Here the factor is $x + 1$, which is $x - (-1)$, so the value to substitute is $x = -1$ — not $+1$.'
      - 'Now substitute. Compute $f(-1) = (-1)^{3} + 2(-1)^{2} + q(-1) - 6$.'
      - 'Carefully now. Term by term: $(-1)^{3} = -1$; $2(-1)^{2} = 2(1) = 2$; $q(-1) = -q$; and the constant is $-6$.'
      - 'So $f(-1) = -1 + 2 - q - 6 = -5 - q$.'
      - 'Setting this to zero: $-5 - q = 0$, so $q = -5$.'
      - 'Always test it. Check: $f(x) = x^{3} + 2x^{2} - 5x - 6$, and $f(-1) = -1 + 2 + 5 - 6 = 0$ ✓.'
      - 'Watch the powers of minus one. The odd and even powers behave differently under the minus: $(-1)^{2}$ is positive while $(-1)^{3}$ is negative. And watch the $q$ term: writing $q(-1)$ as $+q$ gives $-1 + 2 + q - 6 = 0$, so $q = 5$, which is option D. Odd powers of minus one stay negative, even ones turn positive — keep that straight.'
    hint: 'Substitute $x = -1$ (the value making $x+1$ zero) and set the result to zero, watching the signs on the odd and even powers.'

  12:
    answer: B
    steps:
      - 'The unknowns are in the denominators, which looks awkward. But there''s a neat trick here, so let''s find it.'
      - 'The unknowns sit in denominators, which looks awkward — but notice that $\dfrac{3}{y}$ appears in both equations with opposite signs.'
      - 'So that means adding the two equations will eliminate it without any substitution.'
      - 'Let''s add them. Adding: $\left(\dfrac{2}{x} + \dfrac{4}{x}\right) + \left(-\dfrac{3}{y} + \dfrac{3}{y}\right) = 2 + 10$.'
      - 'The $y$ terms cancel and the $x$ terms combine: $\dfrac{6}{x} = 12$.'
      - 'So $6 = 12x$, giving $x = \dfrac{1}{2}$.'
      - 'Now find y. Substitute back into the first equation: $\dfrac{2}{1/2} - \dfrac{3}{y} = 2$, and $\dfrac{2}{1/2} = 4$.'
      - 'So $4 - \dfrac{3}{y} = 2$, giving $\dfrac{3}{y} = 2$ and $y = \dfrac{3}{2}$.'
      - 'Now test it. Check in the second equation: $\dfrac{4}{1/2} + \dfrac{3}{3/2} = 8 + 2 = 10$ ✓.'
      - 'Here''s the idea to remember. Treating $\dfrac{1}{x}$ and $\dfrac{1}{y}$ as the unknowns — rather than $x$ and $y$ — is what makes this an ordinary pair of simultaneous equations. The last step, inverting back, is easy to forget: $\dfrac{1}{x} = 2$ means $x = \tfrac{1}{2}$, not 2. Treat one over x as the unknown, then flip back at the end — nicely done.'
    hint: 'Add the equations to cancel the $y$ terms, and remember the result gives $\tfrac{1}{x}$ — invert it at the end.'

  13:
    answer: A
    steps:
      - 'Finding the minimum of a quadratic is about the turning point. Let''s locate it together.'
      - 'First, a quick check. The coefficient of $x^{2}$ is positive, so the parabola opens upwards and does have a minimum.'
      - 'Now find where it is. That minimum sits at the turning point, $x = -\dfrac{b}{2a}$, with $a = 1$ and $b = -3$.'
      - 'So $x = -\dfrac{-3}{2(1)} = \dfrac{3}{2}$.'
      - 'Now, substitute that back to get the value: $\left(\dfrac{3}{2}\right)^{2} - 3\left(\dfrac{3}{2}\right) + 2$.'
      - 'Term by term: $\dfrac{9}{4} - \dfrac{9}{2} + 2$.'
      - 'Over a denominator of 4: $\dfrac{9}{4} - \dfrac{18}{4} + \dfrac{8}{4} = \dfrac{9 - 18 + 8}{4} = -\dfrac{1}{4}$.'
      - 'Here''s another way to see it. Completing the square gives the same result and shows why: $x^{2} - 3x + 2 = \left(x - \tfrac{3}{2}\right)^{2} - \tfrac{1}{4}$, and a square is never negative, so the smallest the whole thing can be is $-\tfrac{1}{4}$.'
      - 'Watch out: option C is $+\tfrac{1}{4}$. The minimum here lies *below* the axis — the curve $x^{2} - 3x + 2$ factorises as $(x-1)(x-2)$ and so dips between its roots — and a positive answer contradicts that. A parabola that dips between its roots has a negative minimum — that''s the check to remember.'
    hint: 'Find the turning point at $x = \tfrac{3}{2}$ and substitute back, or complete the square — the minimum is negative.'

  14:
    answer: B
    steps:
      - 'Here f is buried deep inside the formula. We''ll unwrap it one layer at a time.'
      - '$f$ sits under a square root inside a compound fraction, so there are two layers to remove.'
      - 'First square both sides to remove the root: $t^{2} = \dfrac{v}{\dfrac{1}{f} + \dfrac{1}{g}}$.'
      - 'Watch this part. Now the bracket is a denominator, so multiply both sides by it: $t^{2}\left(\dfrac{1}{f} + \dfrac{1}{g}\right) = v$.'
      - 'Next, divide by $t^{2}$ — $\dfrac{1}{f} + \dfrac{1}{g} = \dfrac{v}{t^{2}}$.'
      - 'Then isolate the term with $f$ — $\dfrac{1}{f} = \dfrac{v}{t^{2}} - \dfrac{1}{g}$.'
      - 'Now combine the right side over the common denominator $gt^{2}$ — $\dfrac{vg - t^{2}}{gt^{2}}$.'
      - 'Finally take the reciprocal of both sides, since $f$ is currently upside down: $f = \dfrac{gt^{2}}{gv - t^{2}}$.'
      - 'Here''s the trap: option A is that fraction the other way up — the answer for $\dfrac{1}{f}$, not for $f$. The last inversion is a separate step and the commonest place to stop early. Don''t stop at one over f — flip it, and you''re done.'
    hint: 'Square, clear the denominator, isolate $\tfrac{1}{f}$, combine the right side into one fraction, then flip it.'

  15:
    answer: D
    steps:
      - 'Perfect square questions are about matching a pattern. Let''s find the pattern and match it.'
      - 'A perfect square in two letters has the form $(2x - ky)^{2}$, since the first term $4x^{2}$ is the square of $2x$.'
      - 'Now, expanding that pattern: $(2x - ky)^{2} = 4x^{2} - 4kxy + k^{2}y^{2}$.'
      - 'Here''s the key comparison. Compare the middle terms with the expression given. It has $-18xy$, so $-4k = -18$.'
      - 'That gives $k = \dfrac{18}{4} = \dfrac{9}{2}$.'
      - 'Now, the constant term must then be $k^{2}y^{2} = \left(\dfrac{9}{2}\right)^{2}y^{2} = \dfrac{81y^{2}}{4}$.'
      - 'So $g = \dfrac{81y^{2}}{4}$.'
      - 'Let''s make sure. Check: $\left(2x - \tfrac{9}{2}y\right)^{2} = 4x^{2} - 18xy + \tfrac{81}{4}y^{2}$ ✓.'
      - 'There is a general shortcut: for $ax^{2} + bx + c$ to be a perfect square the discriminant $b^{2} - 4ac$ must be zero, so $324y^{2} = 16g$ and $g = \tfrac{81y^{2}}{4}$ — the same answer with no expanding.'
      - 'Watch out for this: option C is $81y^{2}$, from halving the middle coefficient to 9 and squaring, forgetting that the $4x^{2}$ makes the first term $2x$ rather than $x$. Remember the first term is 2x, not x, and the pattern works perfectly.'
    hint: 'Match against $(2x - ky)^2$: the middle term gives $k = \tfrac{9}{2}$, and $g$ is $k^2y^2$.'

  16:
    answer: A
    steps:
      - 'Partial fractions again, and there''s a quick way to get just the constant we need. Let''s use it.'
      - 'In a partial-fraction identity the two sides are equal for every value of the variable, so a well-chosen substitution isolates one constant at a time.'
      - 'Start by clearing the denominators. Multiplying $\dfrac{5 + 2r}{(r+1)(r-2)} = \dfrac{K}{r-2} + \dfrac{L}{r+1}$ by $(r+1)(r-2)$ gives'
      - '$5 + 2r = K(r + 1) + L(r - 2)$.'
      - 'Now choose a clever value. To find $K$, choose the value that makes the $L$ bracket vanish: $r - 2 = 0$, so $r = 2$.'
      - 'Substituting: the left side is $5 + 2(2) = 9$.'
      - 'The right side is $K(2 + 1) + L(0) = 3K$.'
      - 'So $3K = 9$, giving $K = 3$.'
      - 'Only $K$ was asked for, so $L$ need never be found — though for completeness, putting $r = -1$ gives $3 = -3L$ and $L = -1$.'
      - 'Here''s the one real risk. Notice which bracket pairs with which constant: $K$ sits over $(r - 2)$, so it survives when $r = 2$. Substituting $r = -1$ instead would give $L$, and mixing the two up is the one real risk here. Pick the value that makes the other bracket vanish, and each constant comes out on its own.'
    hint: 'Clear the denominators, then substitute $r = 2$ — the value that kills the other term — to get $K$ in one step.'

  17:
    answer: C
    steps:
      - 'Inequalities with an unknown in the denominator need care. Here, the question gives us exactly what we need.'
      - 'Here''s the concern. There is an unknown in the denominator, so the sign of that denominator decides whether the inequality flips when you multiply through.'
      - 'Good news. The question settles it for us: it states $g(x) > 0$, so $6x + 7$ is positive and multiplying by it leaves the inequality direction unchanged.'
      - 'So multiplying $\dfrac{2x + 4}{6x + 7} < 1$ by $(6x + 7)$ gives $2x + 4 < 6x + 7$.'
      - 'Next, collect the $x$ terms on one side: $4 - 7 < 6x - 2x$.'
      - 'That is $-3 < 4x$.'
      - 'Now dividing by 4 — a positive number, so again no flip: $-\dfrac{3}{4} < x$.'
      - 'Written the usual way round, $x > -\dfrac{3}{4}$.'
      - 'Now, the tempting wrong answer: option A has the inequality reversed, which is what you get by multiplying through as if $6x + 7$ were negative. The sentence ''$g(x) > 0$'' is not decoration — it is the permission to multiply without flipping, and it is the whole reason it appears in the stem. Always check the sign before you multiply an inequality through — the question gave it to you here.'
    hint: 'Because $g(x) > 0$ you may multiply through without reversing the inequality. Then collect the $x$ terms.'

  18:
    answer: A
    steps:
      - 'Quadratic inequality, so we''ll rearrange, factorise, and then think about signs. Let''s start.'
      - 'Bring everything to one side so the quadratic can be factorised: $12x^{2} < x + 1$ becomes $12x^{2} - x - 1 < 0$.'
      - 'Next, to factorise, look for two numbers multiplying to $12 \times (-1) = -12$ and adding to $-1$: those are $-4$ and $3$.'
      - 'Split the middle term and group: $12x^{2} - 4x + 3x - 1 = 4x(3x - 1) + 1(3x - 1)$.'
      - 'Both parts share $(3x - 1)$, so the factorisation is $(4x + 1)(3x - 1) < 0$.'
      - 'The roots are where each bracket is zero: $x = -\dfrac{1}{4}$ and $x = \dfrac{1}{3}$.'
      - 'Here''s the key idea. A product of two numbers is negative exactly when they have opposite signs, which happens *between* the roots.'
      - 'So the solution is $-\dfrac{1}{4} < x < \dfrac{1}{3}$.'
      - 'It''s worth making sure. Test a point inside to be sure: at $x = 0$ the original reads $0 < 1$ ✓. And outside, at $x = 1$, which gives $12 < 2$ is false ✓.'
      - 'Watch for this slip: option C has the two roots swapped round, giving $-\tfrac{1}{3} < x < \tfrac{1}{4}$ — the right numbers attached to the wrong brackets. Reading each root off its own bracket avoids it. Read each root from its own bracket, and remember: between the roots means a negative product.'
    hint: 'Rearrange to $12x^2 - x - 1 < 0$ and factorise. A negative product means the answer lies between the roots.'

  19:
    answer: D
    steps:
      - 'This question gives the sum, not the terms. There''s a lovely trick to pull out any single term, so let''s use it.'
