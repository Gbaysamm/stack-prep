explanations:
  1:
    answer: B
    steps:
      - 'Three different bases in one question. The safe way through is base ten, so let''s go there.'
      - 'Three different bases appear, so convert everything to base ten, solve there, and convert back at the end.'
      - 'Start with the binary number. $1011_{2}$ has place values 8, 4, 2 and 1: $(1 \times 8) + (0 \times 4) + (1 \times 2) + 1 = 11$.'
      - '$25_{10}$ is already base ten.'
      - 'So $X$ in base ten is $25 - 11 = 14$.'
      - 'But $X$ is written in base 7, so 14 must be converted.'
      - 'Divide by 7. $14 \div 7 = 2$ remainder 0, so $X = 20_{7}$.'
      - 'Now test it. Check: $20_{7} = (2 \times 7) + 0 = 14$ ✓, and $11 + 14 = 25$ ✓.'
      - 'Now, the tempting wrong answers. Option A is 14 — the base-ten value written down without converting. The subscript 7 on $X$ is what makes that a different answer, and it is easy to read past. Always look at the base the answer is written in — it''s easy to read past.'
    hint: 'Convert $1011_2$ to base ten, subtract from 25, then convert the result back to base 7.'

  2:
    answer: B
    steps:
      - 'Reciprocals inside reciprocals — let''s take this calmly, from the inside out.'
      - 'Work from the inside out: the bracket first, then the power of $-1$ outside it.'
      - 'Start with the bracket. Dividing by a fraction is multiplying by its reciprocal, so $\dfrac{1}{0.03} \div \dfrac{1}{0.024} = \dfrac{1}{0.03} \times \dfrac{0.024}{1} = \dfrac{0.024}{0.03}$.'
      - 'That is $0.8$.'
      - 'Now the outer power. The index $-1$ means take the reciprocal: $\dfrac{1}{0.8}$.'
      - 'So the answer is $1.25$.'
      - 'A neater route skips the arithmetic entirely: $\left[\dfrac{a}{b}\right]^{-1} = \dfrac{b}{a}$, so the whole thing is just $\dfrac{0.03}{0.024}$, which is $1.25$ directly.'
      - 'Watch out for the traps here. Option D is $0.75$, and option C is $0.94$ — both come from dividing the decimals the wrong way round at one of the two stages. Two reciprocals are taken here, and they must not cancel each other by accident. Two flips, taken in order — and you''ve got it.'
    hint: 'Turn the division into $\tfrac{0.024}{0.03}$, then the outer $-1$ flips it back to $\tfrac{0.03}{0.024}$.'

  3:
    answer: C
    steps:
      - 'Two conditions linked by b — let''s get rid of b first, and then keep an eye on what''s asked.'
      - 'Two conditions are given and $b$ is the link between them, so eliminate $b$ first.'
      - 'Start with the first condition. From $b^{3} = a^{-3}$, take the cube root of both sides: $b = a^{-1}$.'
      - 'Now, substitute that into the second condition: $c^{1/3} = a^{1/2} \times a^{-1}$.'
      - 'Multiplying powers of the same letter means adding indices: $\tfrac{1}{2} + (-1) = -\tfrac{1}{2}$.'
      - 'So $c^{1/3} = a^{-1/2}$.'
      - 'But the question asks for $c$, not $c^{1/3}$, so cube both sides.'
      - 'Cubing multiplies the index by 3: $c = a^{-1/2 \times 3} = a^{-3/2}$.'
      - 'Here''s where students often slip. Option A is $a^{-1/2}$, which is exactly where the working stops if the last cubing is forgotten. That step is the difference between $c^{1/3}$ and $c$, and the question names $c$. Always finish by checking you''ve found exactly what the question names.'
    hint: 'Get $b$ in terms of $a$ first, substitute, then remember to cube because the working gives $c^{1/3}$, not $c$.'

  4:
    answer: C
    steps:
      - 'Logs with different bases can look messy. Let''s combine each pair and turn them into ordinary equations.'
      - 'Each equation is a sum of two logarithms with the same base, so combine each into a single logarithm before doing anything else.'
      - 'Start with the first equation. The law $\log m + \log n = \log(mn)$ turns the first into $\log_{4}\left[(y - 1) \times \tfrac{1}{2}x\right] = 1$.'
      - 'A logarithm equal to 1 means the inside equals the base, so $(y - 1)\tfrac{x}{2} = 4$, giving $(y - 1)x = 8$.'
      - 'Now, the second becomes $\log_{2}\left[(y + 1)x\right] = 2$, so the inside equals $2^{2} = 4$: $(y + 1)x = 4$.'
      - 'Now subtract the second from the first. The $x$ factors out: $x\left[(y - 1) - (y + 1)\right] = 8 - 4$.'
      - 'The bracket is $-2$, so $-2x = 4$ and $x = -2$.'
      - 'Now find y. Substitute back into $(y + 1)x = 4$: $(y + 1)(-2) = 4$, so $y + 1 = -2$ and $y = -3$.'
      - 'A word about the wrong options. The question asks for $x$ and $y$ respectively, in that order, so the answer is $-2, -3$. Option D reverses them, which is the standard trap whenever a question says ''respectively''. Respectively means in order — keep x first and you''re safe.'
    hint: 'Combine each pair of logs into one, convert each to index form, then subtract the two equations to eliminate $y$.'

  5:
    answer: D
    steps:
      - 'Surds again, but there''s a hidden factor that makes this much shorter. Let''s look for it.'
      - '$K$ is on its own in the numerator, so multiply both sides by the denominator to free it.'
      - 'That gives us this. $K = (\sqrt{6} - 2)(\sqrt{3} + \sqrt{2})$.'
      - 'Here''s a clever observation. Rather than expanding straight away, notice that $\sqrt{6} = \sqrt{2} \times \sqrt{3}$, so the bracket may factorise.'
      - 'Indeed $\sqrt{6} - 2 = \sqrt{2}\sqrt{3} - \sqrt{2}\sqrt{2} = \sqrt{2}(\sqrt{3} - \sqrt{2})$.'
      - 'So $K = \sqrt{2}(\sqrt{3} - \sqrt{2})(\sqrt{3} + \sqrt{2})$.'
      - 'The last two brackets are a difference of two squares: $(\sqrt{3})^{2} - (\sqrt{2})^{2} = 3 - 2 = 1$.'
      - 'So $K = \sqrt{2} \times 1 = \sqrt{2}$.'
      - 'Let''s double-check by expanding. Expanding directly gives the same: $\sqrt{18} + \sqrt{12} - 2\sqrt{3} - 2\sqrt{2} = 3\sqrt{2} + 2\sqrt{3} - 2\sqrt{3} - 2\sqrt{2} = \sqrt{2}$ ✓. Spotting the common factor of $\sqrt{2}$ turns four terms into one line. Expanding and then forgetting to simplify the root of 18 and the root of 12 is where most slips happen. Look for the common factor first.'
    hint: 'Multiply up, then factor $\sqrt{2}$ out of $\sqrt{6} - 2$ so a difference of two squares appears.'

  6:
    answer: D
    steps:
      - 'This is a volume problem wearing a business costume. Let''s compare the volumes and then count the money.'
      - 'The oil is poured from one cylinder into another, so compare volumes — and a cylinder''s volume is $\pi r^{2}h$.'
      - 'Careful with the measurements: both are given as *diameters*, and the formula needs radii.'
      - 'Start with the jug. The jug has diameter 10 cm, so $r = 5$, and depth 18 cm. Its volume is $\pi(5^{2})(18) = 450\pi$ cubic cm.'
      - 'Now a tin. Each tin has diameter 6 cm, so $r = 3$, and depth 10 cm. Its volume is $\pi(3^{2})(10) = 90\pi$ cubic cm.'
      - 'Now divide. The number of tins filled is $\dfrac{450\pi}{90\pi} = 5$. The $\pi$ cancels, so no approximation is ever needed.'
      - 'Now the money. Selling 5 tins at ₦15.00 brings in $5 \times 15 = ₦75$.'
      - 'She paid ₦50 for the jug, so her profit is $75 - 50 = ₦25$.'
      - 'Now, the tempting wrong answers. Option A is ₦62.50, which comes from using the diameters as radii — that quadruples both volumes but changes their ratio too, because the depths are not in the same proportion. Halving each diameter first is the step that keeps it right. Radius, not diameter — halve first, and the rest is straightforward.'
    hint: 'Halve both diameters to get radii, divide the jug''s volume by a tin''s, then take off the ₦50 she paid.'

  7:
    answer: A
    steps:
      - 'Two kinds of pay here, normal and overtime. Let''s pay each kind of hour at its own rate.'
      - 'Split the 35 hours into the two kinds of work, because they are paid at different rates.'
      - 'First, the hours. Of the 35 hours, $q$ are overtime, so the normal hours number $35 - q$.'
      - 'Normal work pays $r$ naira an hour, so it earns $r(35 - q) = 35r - rq$.'
      - 'Overtime pays double, which is $2r$ an hour, over $q$ hours: $2r \times q = 2rq$.'
      - 'Adding the two: $35r - rq + 2rq$.'
      - 'The $-rq$ and $+2rq$ combine to $+rq$, giving $35r + rq$.'
      - 'Tidy up. Factorising out $r$: $r(35 + q)$.'
      - 'Watch out for the traps here. The $35$ is the *total* hours, not the normal hours, which is why the overtime is counted once extra rather than twice over. Treating all 35 hours as normal and adding $2rq$ on top would give $r(35 + 2q)$, and the subtraction of the overtime hours from the 35 is what prevents that. Take the overtime hours out of the 35 first — you''ve got the method now.'
    hint: 'Normal hours are $35 - q$, not 35. Pay those at $r$ and the $q$ overtime hours at $2r$, then simplify.'

  8:
    answer: D
    steps:
      - 'Sets with unions — let''s work outward from the bracket.'
      - 'A union collects every element that appears in either set, listing each only once.'
      - 'First $Q \cup R$: $Q = \{3, 4, 5\}$ and $R = \{2, 4, 6\}$.'
      - 'Together they give $\{2, 3, 4, 5, 6\}$ — the 4 is in both but appears once.'
      - 'Now union that with $P = \{1, 2, 3, 4\}$.'
      - '$P$ contributes the 1, which nothing else had; everything else in $P$ is already present.'
      - 'So $P \cup (Q \cup R) = \{1, 2, 3, 4, 5, 6\}$, which is the whole universal set.'
      - 'Here''s where students often slip. Option A is $\{4\}$, the answer if both operations were intersections — 4 is the only element in all three sets. Union and intersection pull in opposite directions, and here the result could hardly be bigger. Union keeps everything, intersection keeps only what''s shared — don''t swap them.'
    hint: 'Union means keep everything from either set. Do the bracket first, then bring in $P$.'

  9:
    answer: C
    steps:
      - 'A Venn diagram with three circles — let''s ask three simple questions about the shaded patch.'
      - 'With three overlapping circles there are seven separate regions, so read the shaded one by asking, for each circle in turn, whether the shading lies inside or outside it.'
      - 'Start with P. The shaded patch lies inside $P$ — it sits within the left-hand circle''s boundary.'
      - 'Now R. It also lies inside $R$, the lower circle.'
      - 'And Q. But it lies outside $Q$: the right-hand circle''s edge cuts across and the shading stops there.'
      - 'Putting that together. So a point in the shaded region is in $P$, and in $R$, and not in $Q$.'
      - 'Now write it in symbols. ''In $P$ and not in $Q$'' is $P \cap Q''$, and intersecting that with $R$ gives $(P \cap Q'') \cap R$.'
      - 'Option D uses a union at the front, $(P \cup Q'') \cap R$, which would take in everything in $R$ that is either inside $P$ or outside $Q$ — a much larger region covering nearly all of $R$.'
      - 'And here''s the other. Option B, $(P \cap Q) \cap R$, is the small central patch where all three overlap. It sits right next to the shaded one, and the only thing separating them is whether $Q$ is included or excluded. Inside or outside, circle by circle — that''s the whole method.'
    hint: 'Ask three questions about the shaded patch — inside $P$? inside $Q$? inside $R$? — then write the three answers as one expression.'

  10:
    answer: A
    steps:
      - 'Two remainders means two equations. Let''s build them with the remainder theorem.'
      - 'Two remainders are given, so use the remainder theorem twice and solve the pair of equations that results.'
      - 'The theorem says the remainder on dividing $f(m)$ by $(m - a)$ is $f(a)$ — substitute the value that makes the divisor zero.'
      - 'Start with the first divisor. For $(m - 1)$, substitute $m = 1$: $f(1) = p(1)^{2} + q(1) + 1 = p + q + 1$.'
      - 'That remainder is 2, so $p + q + 1 = 2$, giving $p + q = 1$.'
      - 'Now the second divisor. For $(m + 1)$, the divisor is zero at $m = -1$: $f(-1) = p(-1)^{2} + q(-1) + 1 = p - q + 1$.'
      - 'That remainder is 4, so $p - q + 1 = 4$, giving $p - q = 3$.'
      - 'Now solve the pair. Adding the two equations eliminates $q$: $2p = 4$, so $p = 2$.'
      - 'Then $q = 1 - p = -1$.'
      - 'Always test your answers. Check: $f(1) = 2 - 1 + 1 = 2$ ✓ and $f(-1) = 2 + 1 + 1 = 4$ ✓. The sign on $m = -1$ is the usual slip — for $(m + 1)$ the substitution is $-1$, not $+1$. Plus one in the divisor means substitute minus one — hold on to that.'
    hint: 'Substitute $m = 1$ and $m = -1$ to get two equations in $p$ and $q$, then add them to eliminate $q$.'

  11:
    answer: C
    steps:
      - 'This expression hides four terms inside three. Let''s expand, then group.'
      - 'Four terms are hidden here as three, so expand the bracket first and then factorise by grouping.'
      - 'Start by expanding. $r^{2} - r(2p + q) + 2pq = r^{2} - 2pr - qr + 2pq$.'
      - 'Now group the four terms into two pairs, choosing pairs that share a factor.'
      - 'Take the first with the fourth and the second with the third: $(r^{2} - qr) + (2pq - 2pr)$.'
      - 'From the first pair take out $r$: $r(r - q)$. From the second take out $-2p$: $-2p(r - q)$.'
      - 'Look at that. Both now carry the same bracket $(r - q)$, which is the signal that the grouping was chosen well.'
      - 'Factoring it out: $(r - q)(r - 2p)$.'
      - 'Always check it. Check by expanding: $r^{2} - 2pr - qr + 2pq$ ✓. Option B, $(r - q)(r + p)$, has the wrong sign and no 2 — expanding any candidate takes seconds and settles it. Expanding a candidate back is the quickest way to be sure.'
    hint: 'Expand the bracket to get four terms, then group them so both pairs leave the same factor behind.'

  12:
    answer: D
    steps:
      - 'Two square roots in one equation need care. The secret is to separate them before squaring.'
      - 'Two square roots cannot be squared away in one go, so first arrange the equation with one root alone on each side.'
      - 'Move one root across. Rewrite as $\sqrt{x} = 1 + \sqrt{x - 2}$.'
      - 'Now square both sides. The right side is a two-term bracket, so square it properly: $(1 + \sqrt{x-2})^{2} = 1 + 2\sqrt{x - 2} + (x - 2)$.'
      - 'So $x = 1 + 2\sqrt{x - 2} + x - 2$.'
      - 'Here''s the nice part. The $x$ appears on both sides and cancels — which is what makes this solvable.'
      - 'What remains is $0 = -1 + 2\sqrt{x - 2}$, so $2\sqrt{x - 2} = 1$ and $\sqrt{x - 2} = \dfrac{1}{2}$.'
      - 'Square again: $x - 2 = \dfrac{1}{4}$, so $x = 2 + \dfrac{1}{4} = \dfrac{9}{4}$.'
      - 'Check in the original: $\sqrt{9/4} = 1.5$ and $\sqrt{9/4 - 2} = \sqrt{1/4} = 0.5$, and $1.5 - 0.5 - 1 = 0$ ✓.'
      - 'Watch out for the traps here. Squaring the equation as it stands — treating $(\sqrt{x} - \sqrt{x-2})^{2}$ as $x - (x-2)$ — is the error the question is built around. A bracket squared always has a middle term. A bracket squared always has a middle term — never forget it.'
    hint: 'Move one root to the other side before squaring, and square the two-term side as a full bracket.'

  13:
    answer: B
    steps:
      - 'Real roots means the discriminant is not negative. Let''s form it and solve.'
      - 'Roots are real when the discriminant $b^{2} - 4ac$ is not negative, so form it and solve the resulting inequality.'
      - 'Start with a, b and c. Here $a = 3$, $b = -3m$ and $c = m^{2} - m - 3$.'
      - 'Now build the discriminant. So $b^{2} - 4ac = 9m^{2} - 4(3)(m^{2} - m - 3) = 9m^{2} - 12m^{2} + 12m + 36$.'
      - 'Collecting: $-3m^{2} + 12m + 36 \ge 0$.'
      - 'Watch this step carefully. Divide through by $-3$ — and because that is a negative number, the inequality sign reverses: $m^{2} - 4m - 12 \le 0$.'
      - 'Factorise: two numbers multiplying to $-12$ and adding to $-4$ are $-6$ and $2$, giving $(m - 6)(m + 2) \le 0$.'
      - 'A product is negative between its roots, so the solution is $-2 \le m \le 6$.'
      - 'Matching the offered ranges, that is $-2 < m < 6$.'
      - 'Here''s the single step this question turns on. Dividing by the negative without flipping the sign would give $m^{2} - 4m - 12 \ge 0$ and the outside region instead — the exact opposite answer, and the single step this question turns on. Dividing by a negative flips the sign — make it a reflex.'
    hint: 'Set the discriminant $\ge 0$, and when you divide by $-3$ remember to reverse the inequality.'

  14:
    answer: A
    steps:
      - 'Rearranging formulas takes patience, and this one rewards a tidy plan. Let''s make one.'
      - 'The question wants $\dfrac{a}{x}$ as a single subject, so aim to get all the $a$''s on one side and all the $x$''s on the other.'
      - 'Start by clearing the fraction: multiply both sides by $(x - a)$.'
      - '$x + a = m(x - a) = mx - ma$.'
      - 'Now gather the $a$ terms on the left and the $x$ terms on the right: $a + ma = mx - x$.'
      - 'Then factorise each side: $a(1 + m) = x(m - 1)$.'
      - 'Finally, divide both sides by $x$ and by $(1 + m)$ to isolate the ratio: $\dfrac{a}{x} = \dfrac{m - 1}{m + 1}$.'
      - 'It''s worth testing. Check with a number. If $a = 1$ and $x = 3$, then $\dfrac{x+a}{x-a} = \dfrac{4}{2} = 2$, so $m = 2$; and $\dfrac{m-1}{m+1} = \dfrac{1}{3} = \dfrac{a}{x}$ ✓.'
      - 'A word about the wrong options. Option D is the reciprocal, $\dfrac{m+1}{m-1}$ — the answer for $\dfrac{x}{a}$ rather than $\dfrac{a}{x}$. Testing one set of numbers separates the two immediately. Check which way up the ratio is — a quick number test settles it.'
    hint: 'Clear the fraction, collect $a$ on one side and $x$ on the other, then factorise both sides before dividing.'

  15:
    answer: A
    steps:
      - 'Long division of polynomials is a steady routine. Let''s go round it three times.'
      - 'Polynomial long division needs every power present; here all four are, so set it out directly.'
      - 'Divide the leading terms: $2x^{3} \div 2x = x^{2}$. That is the first term of the quotient.'
      - 'Multiply back: $x^{2}(2x + 1) = 2x^{3} + x^{2}$, and subtract. The cubes cancel and $11x^{2} - x^{2} = 10x^{2}$, leaving $10x^{2} + 17x + 6$.'
      - 'Repeat: $10x^{2} \div 2x = 5x$. Multiply back: $5x(2x + 1) = 10x^{2} + 5x$, and subtract, leaving $12x + 6$.'
      - 'Repeat again: $12x \div 2x = 6$. Multiply back: $6(2x + 1) = 12x + 6$, and subtract, leaving 0.'
      - 'Good sign. A zero remainder confirms $2x + 1$ is a factor.'
      - 'So reading off the quotient: $x^{2} + 5x + 6$.'
      - 'Here''s the trap. Option B keeps a 2 in front, $2x^{2} + 5x + 6$. A quick check settles it: the leading term of the dividend is $2x^{3}$ and the divisor starts with $2x$, so the quotient must start with $x^{2}$, not $2x^{2}$. Check the first term of the quotient, and the rest follows.'
    hint: 'Divide leading term by leading term each round. Check the first quotient term: $2x^3 \div 2x$ is $x^2$.'

  16:
    answer: D
    steps:
      - 'Partial fractions start with factorising. Let''s factorise, then find each constant.'
      - 'Partial fractions start with factorising the denominator, since each factor gets its own fraction.'
      - 'Here''s how to factorise. $6x^{2} - x - 1$ needs two numbers multiplying to $6 \times (-1) = -6$ and adding to $-1$: those are $-3$ and $2$.'
      - 'Splitting: $6x^{2} - 3x + 2x - 1 = 3x(2x - 1) + 1(2x - 1) = (3x + 1)(2x - 1)$.'
      - 'Now set up the fractions. Both factors are linear, so each takes a constant numerator: $\dfrac{11x + 2}{(3x+1)(2x-1)} = \dfrac{A}{3x + 1} + \dfrac{B}{2x - 1}$.'
      - 'Multiply through: $11x + 2 = A(2x - 1) + B(3x + 1)$.'
      - 'Now pick clever values. Put $x = \tfrac{1}{2}$ to kill the $A$ term: $\tfrac{11}{2} + 2 = B\left(\tfrac{3}{2} + 1\right)$, so $\tfrac{15}{2} = \tfrac{5}{2}B$ and $B = 3$.'
      - 'Then put $x = -\tfrac{1}{3}$ to kill the $B$ term: $-\tfrac{11}{3} + 2 = A\left(-\tfrac{2}{3} - 1\right)$, so $-\tfrac{5}{3} = -\tfrac{5}{3}A$ and $A = 1$.'
      - 'So the expression is $\dfrac{1}{3x + 1} + \dfrac{3}{2x - 1}$.'
      - 'Now, the tempting wrong answers. Options A and C swap the signs inside the denominators, which is the same as factorising the quadratic wrongly. Multiplying the two brackets back out is the check that catches it. Multiply your brackets back out to check the factorisation — that catches this slip.'
    hint: 'Factorise the denominator into $(3x+1)(2x-1)$, then substitute the values that make each bracket zero.'

  17:
    answer: B
    steps:
      - 'An inequality with x in the denominators. The question tells us x is positive, and that''s going to matter.'
      - 'Every term has $x$ in a denominator, so clear them — but only after noting the sign of what you multiply by.'
      - 'Here''s why that matters. The question states $x$ is a positive real number, so $12x$ is positive and multiplying through by it leaves the inequality sign unchanged.'
      - 'Multiplying $\dfrac{1}{3x} + \dfrac{1}{2} > \dfrac{1}{4x}$ by $12x$ gives $4 + 6x > 3$.'
      - 'So $6x > -1$, that is $x > -\dfrac{1}{6}$.'
      - 'Now bring back the condition the question imposed: $x$ is positive.'
      - 'Every positive number is already greater than $-\tfrac{1}{6}$, so the restriction $x > -\tfrac{1}{6}$ adds nothing.'
      - 'The answer is therefore simply $x > 0$ — the inequality holds for every positive $x$.'
      - 'Watch out for the traps here. Option A is $x > -\tfrac{1}{6}$, the algebra taken on its own. It is not wrong arithmetic, but it ignores the sentence the question opens with. When a question fixes the domain, the final answer has to sit inside it.'
      - 'And here''s a nice way to see it. You can see the result without algebra too: for positive $x$, $\tfrac{1}{3x}$ already exceeds $\tfrac{1}{4x}$, and adding $\tfrac{1}{2}$ only widens the gap. So the algebra alone, option A, is the trap — always fit your answer inside the domain the question gives.'
    hint: 'Multiply through by $12x$ — safe because $x$ is positive — then check your answer against the domain the question states.'

  18:
    answer: D
    steps:
      - 'Reading inequalities from a shaded graph is a skill worth practising. Let''s go boundary by boundary.'
      - 'Three boundaries enclose the region: the two axes and the slanting line. Deal with each in turn.'
      - 'Start with the y-axis. The shading lies to the right of the $y$-axis, so $x \ge 0$.'
      - 'Now the x-axis. It lies above the $x$-axis, so $y \ge 0$.'
      - 'Now the line. It cuts the axes at $(0, 3)$ and $(2, 0)$, so use the intercept form $\dfrac{x}{2} + \dfrac{y}{3} = 1$.'
      - 'Multiplying through by 6 clears the fractions: $3x + 2y = 6$.'
      - 'Here''s the key step. Decide which side is shaded by testing a point. The origin is easiest, and it is clearly *outside* the shading.'
      - 'At the origin $3x + 2y = 0$, which is less than 6. Since the origin is excluded, the shaded side is where $3x + 2y \ge 6$.'
      - 'Putting all three together: $x \ge 0$, $y \ge 0$, $3x + 2y \ge 6$.'
      - 'Here''s where students often slip. Option A gives only two conditions and so fails to close the region off below. Option B adds $y \ge 3$, which would cut away everything beneath the point $(0,3)$ — including the part of the shading that reaches down to the $x$-axis. Test the origin, and you''ll always know which way the inequality points.'
    hint: 'Get the line from its two intercepts, then test the origin: it is outside the shading, so the inequality points away from it.'

  19:
    answer: C
    steps:
      - 'Three terms of an arithmetic progression, and one key fact. Let''s use it.'
      - 'In an arithmetic progression consecutive terms have a constant difference, so the gap from the first to the second equals the gap from the second to the third.'
      - 'That gives $(2p - 10) - (p + 1) = (1 - 4p^{2}) - (2p - 10)$.'
      - 'Equivalently, twice the middle term equals the sum of the outer two: $2(2p - 10) = (p + 1) + (1 - 4p^{2})$.'
      - 'The left side is $4p - 20$.'
      - 'The right side is $p + 1 + 1 - 4p^{2} = -4p^{2} + p + 2$.'
      - 'Bring everything to one side: $4p^{2} + 4p - p - 20 - 2 = 0$, which is $4p^{2} + 3p - 22 = 0$.'
      - 'Now the quadratic formula. The discriminant is $9 + 4(4)(22) = 9 + 352 = 361$, and $\sqrt{361} = 19$.'
      - 'So $p = \dfrac{-3 \pm 19}{8}$, giving $p = 2$ or $p = -\dfrac{11}{4}$.'
      - 'Let''s check. The question asks for the possible values, plural, so both are wanted. Checking $p = 2$: the terms are 3, $-6$, $-15$, with a common difference of $-9$ ✓. Giving only one value is the trap here — both belong. Well done for seeing it through.'
    hint: 'Use ''twice the middle term equals the sum of the outer two'', then solve the quadratic — there are two answers.'

  20:
