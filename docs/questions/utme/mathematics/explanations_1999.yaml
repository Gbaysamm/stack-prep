explanations:
  1:
    answer: C
    steps:
      - "Dividing powers of the same letter means subtracting the indices — that rule is the whole question, applied three times over."
      - "For $a$: the index is $2 - (-1)$. Subtracting a negative adds, so that is $2 + 1 = 3$, giving $p = 3$."
      - "For $b$: $3 - 4 = -1$, so $q = -1$."
      - "For $c$: the numerator's $c$ has an unwritten index of 1, so $1 - 5 = -4$, giving $r = -4$."
      - "So the fraction simplifies to $a^{3}b^{-1}c^{-4}$."
      - "The question asks only for $p + 2q$, so substitute: $3 + 2(-1)$."
      - "That is $3 - 2 = 1$."
      - "The $a$ index is where this is usually lost. Treating $a^{-1}$ in the denominator as an ordinary $a$ gives $p = 1$ and an answer of $-1$ — which is offered. A negative index in a denominator becomes a *positive* contribution on top."
    hint: "Subtract the denominator's index from the numerator's for each letter, and watch the double negative on $a$."

  2:
    answer: A
    steps:
      - "Two fractions set equal can be cross-multiplied, which clears both denominators in one step."
      - "So $\\sqrt{2}(x - \\sqrt{2}) = 1(x + \\sqrt{2})$."
      - "Expand the left: $\\sqrt{2} \\cdot x - \\sqrt{2} \\cdot \\sqrt{2} = \\sqrt{2}x - 2$, since $\\sqrt{2}$ times itself is just 2."
      - "So $\\sqrt{2}x - 2 = x + \\sqrt{2}$."
      - "Collect the $x$ terms on one side and the numbers on the other: $\\sqrt{2}x - x = 2 + \\sqrt{2}$."
      - "Factor out $x$: $x(\\sqrt{2} - 1) = 2 + \\sqrt{2}$, so $x = \\dfrac{2 + \\sqrt{2}}{\\sqrt{2} - 1}$."
      - "A surd is left in the denominator, so rationalise by multiplying top and bottom by the conjugate $\\sqrt{2} + 1$. The denominator becomes $(\\sqrt{2})^{2} - 1^{2} = 2 - 1 = 1$."
      - "The numerator is $(2 + \\sqrt{2})(\\sqrt{2} + 1) = 2\\sqrt{2} + 2 + 2 + \\sqrt{2} = 3\\sqrt{2} + 4$."
      - "With a denominator of 1, that is the answer: $x = 3\\sqrt{2} + 4$."
      - "The denominator coming out as exactly 1 is a useful sign the conjugate was chosen correctly. Option B is the same expression with the $+4$ turned into $-4$, which is what you get by mishandling the $-2$ when collecting terms."
    hint: "Cross-multiply, gather the $x$ terms, then rationalise by multiplying by the conjugate $\\sqrt{2} + 1$."

  3:
    answer: B
    steps:
      - "Percentage gain is always measured against the *cost*, so work out what was spent and what came back separately."
      - "The oranges were bought at 5 for ₦1.20, and 100 oranges is $\\dfrac{100}{5} = 20$ such lots."
      - "So the cost was $20 \\times 1.20 = ₦24$."
      - "20 oranges were spoilt, leaving $100 - 20 = 80$ to sell."
      - "Those were sold at 4 for ₦1.50, and 80 oranges is $\\dfrac{80}{4} = 20$ lots."
      - "So the takings were $20 \\times 1.50 = ₦30$."
      - "The gain is $30 - 24 = ₦6$, and as a percentage of the ₦24 cost that is $\\dfrac{6}{24} \\times 100 = 25\\%$ gain."
      - "The spoilt oranges do not reduce the cost — they were still paid for. Cutting the cost down to 80 oranges' worth is the trap, and it would give a different and wrong percentage."
    hint: "All 100 oranges were paid for, but only 80 were sold. Work out cost and takings separately, then measure the gain against the cost."

  4:
    answer: C
    steps:
      - "Work strictly from the inside out: the dash outside the bracket applies to whatever the bracket contains, so $P \\cup Q$ must be found first."
      - "$P = \\{3, 4, 5\\}$ and $Q = \\{2, 4, 6\\}$, so $P \\cup Q$ collects everything in either: $\\{2, 3, 4, 5, 6\\}$."
      - "Note 4 appears in both but is listed once — a set never repeats an element."
      - "Now take the complement. That means everything in the universal set $U = \\{1, 2, 3, 4, 5, 6\\}$ that is *not* in $P \\cup Q$."
      - "Running through $U$: 2, 3, 4, 5 and 6 are all in the union, so only 1 survives. $(P \\cup Q)' = \\{1\\}$."
      - "Finally intersect with $R = \\{1, 2, 3, 4\\}$: keep only what is in both."
      - "1 is in $R$, so $(P \\cup Q)' \\cap R = \\{1\\}$."
      - "Option D is the empty set, which is what you would get by complementing after the intersection instead of before. The order the brackets impose is the entire question."
    hint: "Find $P \\cup Q$ first, then everything in $U$ outside it, and only then intersect with $R$."

  5:
    answer: B
    steps:
      - "Arithmetic in an unfamiliar base is easiest done by converting to base ten, working there, and converting back."
      - "$2434_{6}$ has place values $216$, $36$, $6$ and $1$, since each column is six times the one to its right."
      - "So it is $(2 \\times 216) + (4 \\times 36) + (3 \\times 6) + 4 = 432 + 144 + 18 + 4 = 598$."
      - "$42_{6}$ is $(4 \\times 6) + 2 = 26$."
      - "Dividing in base ten: $598 \\div 26 = 23$."
      - "Now convert 23 back to base six. $23 \\div 6 = 3$ remainder 5."
      - "Reading the quotient then the remainder gives $35_{6}$."
      - "Option A is $23_{6}$ — the base-ten answer written down with a base-six subscript, without actually converting. The conversion back is a separate step and it is easy to skip."
    hint: "Convert both numerals to base ten, divide there, then convert the answer back to base six."

  6:
    answer: D
    steps:
      - "Both numerals contain the unknown digit $Y$, so write each in base ten with $Y$ carried through."
      - "$(Y3)_{9}$ has two columns, worth 9 and 1, so it is $9Y + 3$."
      - "$(Y3)_{5}$ has columns worth 5 and 1, so it is $5Y + 3$."
      - "The equation says twice the first equals three times the second: $2(9Y + 3) = 3(5Y + 3)$."
      - "Expanding: $18Y + 6 = 15Y + 9$."
      - "Collecting: $18Y - 15Y = 9 - 6$, so $3Y = 3$."
      - "Therefore $Y = 1$."
      - "Check the digit is legal in both bases — it must be smaller than each base, and 1 is smaller than 5 and 9 ✓. Check the arithmetic too: $(13)_{9} = 12$ and $2 \\times 12 = 24$; $(13)_{5} = 8$ and $3 \\times 8 = 24$ ✓."
    hint: "Write each numeral in base ten with $Y$ as an unknown, then solve the linear equation and check $Y$ is a valid digit."

  7:
    answer: B
    steps:
      - "Everything here is a decimal, so the quickest route is to simplify the fraction under the root before taking any square root at all."
      - "The numerator is $0.0023 \\times 750$. Since $23 \\times 75 = 1725$, this is $1.725$."
      - "The denominator is $0.00345 \\times 1.25 = 0.0043125$."
      - "Now divide: $\\dfrac{1.725}{0.0043125}$. Multiplying top and bottom by $10{,}000$ makes it $\\dfrac{17250}{43.125}$, which is $400$."
      - "A cleaner way to see it: $0.00345$ is exactly twice $0.001725$, so $\\dfrac{1.725}{0.00345} = 500$, and dividing that by $1.25$ gives $400$."
      - "So the expression is $\\sqrt{400}$."
      - "That is 20."
      - "Simplifying inside the root first is what makes this manageable — taking square roots of the individual decimals and then combining them is far more work and invites rounding error."
    hint: "Work out the whole fraction under the root first; it comes to a perfect square."

  8:
    answer: C
    steps:
      - "You are given one logarithm and asked for another, so look for a way to build 5 out of 10 using the log laws."
      - "The useful fact is $5 = \\dfrac{10}{2}$, and the law $\\log(\\tfrac{m}{n}) = \\log m - \\log n$ turns that division into a subtraction."
      - "So $\\log_{8}5 = \\log_{8}10 - \\log_{8}2$."
      - "The first part is $x$, given. The second needs working out."
      - "$\\log_{8}2$ asks: what power of 8 gives 2? Since $8 = 2^{3}$, the cube root of 8 is 2, so $8^{1/3} = 2$."
      - "Therefore $\\log_{8}2 = \\dfrac{1}{3}$."
      - "So $\\log_{8}5 = x - \\dfrac{1}{3}$."
      - "Option D uses $\\tfrac{1}{2}$, which would be $\\log_{8}2$ if the base were 4 rather than 8. The base matters: $\\log_{8}2$ is a third precisely because 8 is the *cube* of 2."
    hint: "Write 5 as $\\tfrac{10}{2}$ and split the logarithm. Then work out $\\log_{8}2$ by asking what power of 8 gives 2."

  9:
    answer: A
    steps:
      - "Three overlapping groups call for the inclusion-exclusion rule, but the word 'only' in one of the figures has to be handled first."
      - "The rule is $n(Y \\cup P \\cup M) = n(Y) + n(P) + n(M) - n(Y \\cap P) - n(Y \\cap M) - n(P \\cap M) + n(Y \\cap P \\cap M)$."
      - "The singles are given: yam 10, plantain 14, maize 12."
      - "Two of the pairs are given directly: plantain and maize 5, yam and maize 4. These include the women who sell all three."
      - "But 'yam and plantain' is given as 2 *only*, meaning excluding the all-three group. Since 3 sell all three, the full overlap is $n(Y \\cap P) = 2 + 3 = 5$."
      - "Now substitute: $10 + 14 + 12 - 5 - 4 - 5 + 3$."
      - "The singles total 36; the pairs subtract 14, leaving 22; adding back the 3 gives 25."
      - "Every woman sells at least one item, so nobody sits outside the union — the union is the whole group, 25 women."
      - "Using 2 rather than 5 for the yam-and-plantain overlap gives 28, and the word 'only' is the only thing separating the two. Where a pair is quoted without it, the all-three group is already inside it."
    hint: "Convert the 'only' figure into a full overlap by adding the 3 who sell everything, then apply inclusion-exclusion."

  10:
    answer: B
    steps:
      - "You are given $Q$ and $Q + P$, so the first job is to get $P$ on its own by subtracting."
      - "$P = (Q + P) - Q = \\begin{pmatrix} 7 & 2 \\\\ 6 & 8 \\end{pmatrix} - \\begin{pmatrix} 6 & 0 \\\\ 4 & 5 \\end{pmatrix}$, and matrices subtract entry by entry."
      - "That gives $P = \\begin{pmatrix} 1 & 2 \\\\ 2 & 3 \\end{pmatrix}$."
      - "Doubling a matrix multiplies every entry by 2, so $2P = \\begin{pmatrix} 2 & 4 \\\\ 4 & 6 \\end{pmatrix}$."
      - "Adding: $Q + 2P = \\begin{pmatrix} 6 + 2 & 0 + 4 \\\\ 4 + 4 & 5 + 6 \\end{pmatrix} = \\begin{pmatrix} 8 & 4 \\\\ 8 & 11 \\end{pmatrix}$."
      - "The vertical bars mean the determinant, which for a two-by-two matrix is the leading-diagonal product minus the other diagonal's product."
      - "So $|Q + 2P| = (8)(11) - (4)(8) = 88 - 32 = 56$."
      - "A tempting shortcut is to take determinants first and combine them — but $|Q + 2P|$ is not $|Q| + 2|P|$, and determinants simply do not distribute over addition. The matrices have to be added before the determinant is taken."
    hint: "Subtract to find $P$, double it, add it to $Q$, and only then take the determinant — determinants do not add."

  11:
    answer: A
    steps:
      - "The inverse of an element is whatever combines with it to give the identity, and the question tells us the identity is zero."
      - "So we need the number $b$ for which $2 * b = 0$."
      - "Apply the rule $a * b = ab + a + b$ with $a = 2$: $2 * b = 2b + 2 + b$."
      - "Collecting the $b$ terms: $3b + 2$."
      - "Setting that equal to the identity: $3b + 2 = 0$."
      - "So $3b = -2$, giving $b = -\\dfrac{2}{3}$."
      - "Check it: $2 * \\left(-\\tfrac{2}{3}\\right) = 2\\left(-\\tfrac{2}{3}\\right) + 2 + \\left(-\\tfrac{2}{3}\\right) = -\\tfrac{4}{3} + 2 - \\tfrac{2}{3} = -2 + 2 = 0$ ✓."
      - "The sign is the whole risk here. The identity is zero, so the inverse must pull the result *down* to zero — for a positive element that means a negative inverse, which is worth noticing before you even do the algebra."
    hint: "Set $2 * b$ equal to the identity 0 using the given rule, collect the $b$ terms, and expect a negative answer."

  12:
    answer: C
    steps:
      - "Two facts are given about the progression, so turn each into an equation in the first term $a$ and the common ratio $r$."
      - "'The first term is twice its common ratio' means $a = 2r$."
      - "The sum to infinity of a geometric progression is $S_{\\infty} = \\dfrac{a}{1 - r}$, valid because such a sum only exists when $r$ lies between $-1$ and 1."
      - "So $\\dfrac{2r}{1 - r} = 8$."
      - "Multiply both sides by $(1 - r)$: $2r = 8(1 - r) = 8 - 8r$."
      - "Collecting: $10r = 8$, so $r = \\dfrac{4}{5}$ — and this does lie between $-1$ and 1, so the sum to infinity was legitimate ✓."
      - "Then $a = 2r = \\dfrac{8}{5}$."
      - "The sum of the first two terms is $a + ar = a(1 + r) = \\dfrac{8}{5} \\times \\dfrac{9}{5} = \\dfrac{72}{25}$."
      - "Option A is $\\tfrac{8}{5}$, the first term alone — the answer if you stop once $a$ is found. The question asks for the first *two* terms."
    hint: "Turn both statements into equations, solve for $r$ then $a$, and remember to add the second term as well as the first."

  13:
    answer: C
    steps:
      - "Express the total spending in terms of $x$ first, then turn the two limits into a pair of inequalities."
      - "She bought $x$ oranges at ₦5 each, costing $5x$."
      - "She bought twice as many mangoes, so $2x$ mangoes at ₦4 each, costing $4 \\times 2x = 8x$."
      - "The total is therefore $5x + 8x = 13x$."
      - "'At least ₦65' means $13x \\ge 65$, and 'at most ₦130' means $13x \\le 130$."
      - "Writing both together: $65 \\le 13x \\le 130$."
      - "Dividing every part by 13: $5 \\le x \\le 10$."
      - "The commonest slip is costing the mangoes as $4x$ rather than $8x$ — forgetting that there are twice as many of them. That would give $9x$ and a different range entirely."
    hint: "There are $2x$ mangoes, not $x$, so their cost is $8x$. Build the total, then divide the two limits through."

  14:
    answer: C
    steps:
      - "The rule defines $m * n$ in terms of $m$ and $n$, so substitute carefully: $m$ is the value *before* the star and $n$ the one after."
      - "Here $m = -3$ and $n = 4$, so $-3 * 4 = \\dfrac{-3}{4} - \\dfrac{4}{-3}$."
      - "The second fraction has a negative denominator. Dividing by a negative gives a negative, so $\\dfrac{4}{-3} = -\\dfrac{4}{3}$."
      - "Subtracting that negative turns it into an addition: $-\\dfrac{3}{4} + \\dfrac{4}{3}$."
      - "Now use a common denominator of 12: $-\\dfrac{3}{4} = -\\dfrac{9}{12}$ and $\\dfrac{4}{3} = \\dfrac{16}{12}$."
      - "Adding: $\\dfrac{-9 + 16}{12} = \\dfrac{7}{12}$."
      - "Option B is $-\\tfrac{7}{12}$ — the same size with the sign flipped, which is what you get from taking $m$ and $n$ the wrong way round. This operation is not commutative, so the order matters: $4 * (-3)$ really would give $-\\tfrac{7}{12}$."
    hint: "Substitute $m = -3$ and $n = 4$ in that order, and note that subtracting a negative fraction adds it."

  15:
    answer: B
    steps:
      - "$ST = I$ says that $T$ undoes $S$, so $T$ is the inverse of $S$."
      - "For a two-by-two matrix $\\begin{pmatrix} a & b \\\\ c & d \\end{pmatrix}$, the inverse is $\\dfrac{1}{ad - bc}\\begin{pmatrix} d & -b \\\\ -c & a \\end{pmatrix}$ — swap the leading diagonal, negate the other, and divide by the determinant."
      - "Here $a = -1$, $b = 1$, $c = 1$, $d = -2$."
      - "The determinant is $ad - bc = (-1)(-2) - (1)(1) = 2 - 1 = 1$."
      - "A determinant of 1 is convenient: dividing by it changes nothing."
      - "Swapping the leading diagonal puts $-2$ top-left and $-1$ bottom-right. Negating the other diagonal turns the $1$s into $-1$s."
      - "So $T = \\begin{pmatrix} -2 & -1 \\\\ -1 & -1 \\end{pmatrix}$."
      - "Check by multiplying: $\\begin{pmatrix} -1 & 1 \\\\ 1 & -2 \\end{pmatrix}\\begin{pmatrix} -2 & -1 \\\\ -1 & -1 \\end{pmatrix} = \\begin{pmatrix} 2 - 1 & 1 - 1 \\\\ -2 + 2 & -1 + 2 \\end{pmatrix} = \\begin{pmatrix} 1 & 0 \\\\ 0 & 1 \\end{pmatrix}$ ✓. Option A negates the wrong diagonal, which the multiplication check catches at once."
    hint: "$T$ is $S^{-1}$: swap the leading diagonal, negate the other, divide by the determinant — then multiply back to check."

  16:
    answer: D
    steps:
      - "Long division of polynomials needs every power present, so write the dividend with its missing term: $4x^{3} + 0x^{2} - 3x + 1$."
      - "Divide the leading terms: $4x^{3} \\div 2x = 2x^{2}$. That is the first term of the quotient."
      - "Multiply back: $2x^{2}(2x - 1) = 4x^{3} - 2x^{2}$, and subtract it. The $4x^{3}$ cancels and $0x^{2} - (-2x^{2}) = 2x^{2}$, leaving $2x^{2} - 3x + 1$."
      - "Repeat: $2x^{2} \\div 2x = x$. Multiply back: $x(2x - 1) = 2x^{2} - x$, and subtract, leaving $-3x - (-x) = -2x$, so $-2x + 1$."
      - "Repeat once more: $-2x \\div 2x = -1$. Multiply back: $-1(2x - 1) = -2x + 1$, and subtracting leaves 0."
      - "A remainder of zero confirms $2x - 1$ really is a factor."
      - "Reading off the three quotient terms: $2x^{2} + x - 1$."
      - "Omitting the $0x^{2}$ placeholder is what derails this most often — without it the subtractions line up under the wrong columns. You can also check the answer by expanding: $(2x-1)(2x^{2}+x-1) = 4x^{3}+2x^{2}-2x-2x^{2}-x+1 = 4x^{3}-3x+1$ ✓."
    hint: "Insert the missing $0x^{2}$ term before dividing, then check your quotient by multiplying it back out."

  17:
    answer: D
    steps:
      - "Consecutive integers differ by 1, so name the middle one and write the others in terms of it — that keeps the algebra symmetric."
      - "Let $l = n$. Then $k = n - 1$ and $m = n + 1$."
      - "The condition is $l^{2} = 3(k + m)$."
      - "Work out $k + m$ first: $(n - 1) + (n + 1) = 2n$. The $-1$ and $+1$ cancel, which is exactly why naming the middle one helps."
      - "So the equation is $n^{2} = 3(2n) = 6n$."
      - "Bring everything to one side: $n^{2} - 6n = 0$, so $n(n - 6) = 0$."
      - "That gives $n = 0$ or $n = 6$, and since the integers are positive, $n = 6$."
      - "The question asks for $m$, the largest of the three, so $m = n + 1 = 7$."
      - "Option C is 6 — the value of $n$ rather than of $m$. The three integers are 5, 6 and 7, and checking confirms it: $6^{2} = 36$ and $3(5 + 7) = 36$ ✓."
    hint: "Call the middle integer $n$ so the outer two are $n \\pm 1$. Solve for $n$, then remember $m$ is the largest."

  18:
    answer: A
    steps:
      - "Two curves bound the shaded region, so identify each one before writing any inequality."
      - "The straight line passes through the origin at $45^{\\circ}$, so its gradient is $\\tan 45^{\\circ} = 1$ and its equation is $y = x$."
      - "The curve crosses the axis at $-1$, $0$ and $1$, which means it has factors $x$, $x - 1$ and $x + 1$. Their product is $x^{3} - x$, so the curve is $y = x^{3} - x$."
      - "Now read the shading. It lies *below* the line, so $y \\le x$, which rearranges to $y - x \\le 0$."
      - "It lies *above* the curve, so $y \\ge x^{3} - x$."
      - "Rearrange that second one to match the options: adding $x$ and subtracting $x^{3}$ from both sides gives $y + x - x^{3} \\ge 0$."
      - "So the region is $y + x - x^{3} \\ge 0$ and $y - x \\le 0$."
      - "Test a point to be sure. The point $(0.5, 0)$ sits inside the shading; $y + x - x^{3} = 0 + 0.5 - 0.125 = 0.375 \\ge 0$ ✓ and $y - x = -0.5 \\le 0$ ✓."
      - "Options C and D have the inequality signs the other way round, which describes the region on the far side of each boundary. Testing a single interior point separates them in seconds."
    hint: "Read off the line as $y = x$ and the cubic from its three roots, then decide above or below for each — and confirm with one point inside the shading."

  19:
    answer: A
    steps:
      - "Five terms is too many to factorise directly, so look for structure. The first three terms are a perfect square."
      - "$x^{2} + 2xy + y^{2} = (x + y)^{2}$."
      - "The next two share a factor of 3: $3x + 3y = 3(x + y)$."
      - "So the whole expression is $(x + y)^{2} + 3(x + y) - 18$, and the same bracket $(x + y)$ appears twice."
      - "Substitute $u = x + y$. The expression becomes $u^{2} + 3u - 18$, an ordinary quadratic."
      - "Factorise it: two numbers multiplying to $-18$ and adding to $3$ are $6$ and $-3$, giving $(u + 6)(u - 3)$."
      - "Now put $x + y$ back in place of $u$: $(x + y + 6)(x + y - 3)$."
      - "Expanding mentally to check the constant: $6 \\times (-3) = -18$ ✓, and the $u$ terms give $6u - 3u = 3u = 3(x+y)$ ✓."
      - "Options B and C use $x - y$, which would need the middle term to be $-2xy$. The sign of that middle term tells you which perfect square you have, and it is worth reading before anything else."
    hint: "Spot that the first three terms make $(x+y)^2$ and the next two make $3(x+y)$, then treat $x+y$ as a single letter."

  20:
    answer: B
    steps:
      - "Give the two numbers names and write both statements as equations — the difference is already named $P$ for us."
      - "Let the larger be $a$ and the smaller be $b$, so $a - b = P$."
      - "'The sum is twice their difference' means $a + b = 2(a - b)$."
      - "Expand the right side: $a + b = 2a - 2b$."
      - "Collect: $b + 2b = 2a - a$, so $3b = a$. The larger number is three times the smaller."
      - "Now use the difference: $a - b = P$ becomes $3b - b = P$, so $2b = P$ and $b = \\dfrac{P}{2}$."
      - "The larger is $a = 3b = \\dfrac{3P}{2}$."
      - "Check: the sum is $\\tfrac{3P}{2} + \\tfrac{P}{2} = 2P$, and twice the difference is $2P$ ✓."
      - "Option A is $\\tfrac{P}{2}$, which is the *smaller* number. The question asks for the larger, and stopping at $b$ is the easy mistake once the algebra is done."
    hint: "Set up $a + b = 2(a-b)$ and $a - b = P$. Solve for the smaller first, then remember which one the question wants."

  21:
    answer: C
    steps:
      - "Partial fractions start with factorising the denominator, since each factor gets its own fraction."
      - "$x^{3} - 1$ is a difference of cubes: $x^{3} - 1 = (x - 1)(x^{2} + x + 1)$."
      - "The quadratic factor will not factorise further over the real numbers — its discriminant is $1 - 4 = -3$ — so it keeps a linear numerator."
      - "So write $\\dfrac{1}{x^{3} - 1} = \\dfrac{A}{x - 1} + \\dfrac{Bx + C}{x^{2} + x + 1}$."
      - "Multiply through by $x^{3} - 1$: $1 = A(x^{2} + x + 1) + (Bx + C)(x - 1)$."
      - "Put $x = 1$ to kill the second term: $1 = A(1 + 1 + 1) = 3A$, so $A = \\dfrac{1}{3}$."
      - "Compare $x^{2}$ coefficients: on the left there are none, on the right $A + B$. So $B = -A = -\\dfrac{1}{3}$."
      - "Compare constants: $1 = A - C$, so $C = A - 1 = \\dfrac{1}{3} - 1 = -\\dfrac{2}{3}$."
      - "Putting them together: $\\dfrac{1}{3(x - 1)} + \\dfrac{-\\tfrac{1}{3}x - \\tfrac{2}{3}}{x^{2} + x + 1} = \\dfrac{1}{3(x - 1)} - \\dfrac{x + 2}{3(x^{2} + x + 1)}$."
      - "Option A drops the factor of 3 throughout, which is what happens if $A$ is taken as 1. Substituting a convenient value — say $x = 0$, where the original is $-1$ — checks the whole decomposition at once."
    hint: "Factorise as a difference of cubes, give the quadratic factor a linear numerator $Bx + C$, and substitute $x = 1$ to find $A$ first."

  22:
    answer: B
    steps:
      - "A bisector drawn from a vertex to the opposite side splits that side in the ratio of the two sides enclosing the angle — that is the angle-bisector theorem."
      - "The bisector comes from $M$, and the two sides meeting at $M$ are $MN = 6$ and $MO = 4$."
      - "So $P$ divides $NO$ with $\\dfrac{NP}{PO} = \\dfrac{MN}{MO} = \\dfrac{6}{4} = \\dfrac{3}{2}$."
      - "That means $NP$ is 3 parts and $PO$ is 2 parts, making 5 parts altogether."
