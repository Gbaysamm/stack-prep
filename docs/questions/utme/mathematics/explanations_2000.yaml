explanations:
  1:
    answer: C
    steps:
      - "Two operations here, and the brackets say which comes first: work out $P - Q$ before intersecting with $R$."
      - "$P - Q$ means everything in $P$ that is not in $Q$. Go through $P = \\{1, 2, u, v, w, x\\}$ one element at a time."
      - "2, $u$, $v$ and $w$ all appear in $Q$, so they are removed. That leaves $P - Q = \\{1, x\\}$."
      - "Now intersect with $R = \\{2, 3, 4, v, x, y\\}$: keep only what appears in both."
      - "1 is not in $R$, but $x$ is."
      - "So $(P - Q) \\cap R = \\{x\\}$."
      - "Option A is $\\{1, x\\}$ — the first step handed in before the intersection was taken. Doing the operations in the order the brackets give is the whole question."
    hint: "Work out $P - Q$ first, then see which of those elements also appear in $R$."

  2:
    answer: B
    steps:
      - "'Increased by 2% each year' means each year's population is 1.02 times the year before — so this compounds rather than adding a fixed amount."
      - "From January 1998 to January 2000 is 2 years, not 3. Counting the gap rather than the number of dates named is easy to get wrong."
      - "So the population is $240{,}000 \\times 1.02^{2}$."
      - "$1.02^{2} = 1.0404$."
      - "$240{,}000 \\times 1.0404 = 249{,}696$."
      - "Option C is 249,600, which is $240{,}000 \\times 1.04$ — simple interest, adding 2% twice of the *original* rather than compounding. The difference, ₦96, is the second year's interest on the first year's interest."
    hint: "Two years at 2% compound means multiplying by $1.02$ twice. Count the years between the dates carefully."

  3:
    answer: B
    steps:
      - "A surd in the denominator has to be cleared, and the tool is the conjugate: the same expression with its middle sign reversed."
      - "The denominator is $\\sqrt{3} + 2\\sqrt{2}$, so multiply top and bottom by $\\sqrt{3} - 2\\sqrt{2}$."
      - "The new denominator is a difference of two squares: $(\\sqrt{3})^{2} - (2\\sqrt{2})^{2} = 3 - 8 = -5$."
      - "The new numerator is $(2\\sqrt{3} - \\sqrt{2})(\\sqrt{3} - 2\\sqrt{2})$. Expanding: $2 \\times 3 = 6$; $-4\\sqrt{6}$; $-\\sqrt{6}$; $+2 \\times 2 = 4$."
      - "Collecting: $6 + 4 - 5\\sqrt{6} = 10 - 5\\sqrt{6}$."
      - "So the expression is $\\dfrac{10 - 5\\sqrt{6}}{-5}$."
      - "Dividing each term by $-5$: $-2 + \\sqrt{6}$."
      - "Matching against $m + n\\sqrt{6}$ gives $m = -2$ and $n = 1$. The negative denominator flips both signs — losing that gives option A's $1, -2$, which is the same pair the wrong way round *and* the wrong sign."
    hint: "Multiply top and bottom by the conjugate of the denominator. Note the denominator comes out negative, which flips the signs of both parts."

  4:
    answer: C
    steps:
      - "Name the unknown that everything else is described against. Let $n$ be the number who like neither; then the number who like both is $3n$."
      - "The addition rule says $n(M \\cup T) = n(M) + n(T) - n(M \\cap T) = 60 + 50 - 3n = 110 - 3n$."
      - "Everyone is either in that union or in neither group, and there are 94 members altogether."
      - "So $(110 - 3n) + n = 94$, which is $110 - 2n = 94$."
      - "Therefore $2n = 16$, so $n = 8$ and the number liking both is $3 \\times 8 = 24$."
      - "The union is $110 - 24 = 86$ members who like at least one type."
      - "But the question asks for those who like *only one* type, so the 24 who like both must come out: $86 - 24 = 62$."
      - "Option D is 86 — everyone who likes at least one type. The word 'only' is what separates the two, and it costs exactly the 24 who like both."
    hint: "Let the 'neither' group be $n$ so that 'both' is $3n$. Find $n$ first, then remember 'only one type' excludes those who like both."

  5:
    answer: B
    steps:
      - "The instruction is to round *first*, then calculate — which is the opposite of usual practice, and is the point of the question."
      - "To two significant figures: $2.813 \\to 2.8$, $1.063 \\to 1.1$, and $5.637 \\to 5.6$. The powers of ten are exact and stay as they are."
      - "So the calculation becomes $\\dfrac{(2.8 \\times 10^{-3}) \\times 1.1}{5.6 \\times 10^{-2}}$."
      - "The numerator is $2.8 \\times 1.1 = 3.08$, giving $3.08 \\times 10^{-3}$."
      - "Now divide: $\\dfrac{3.08}{5.6} = 0.55$, and $\\dfrac{10^{-3}}{10^{-2}} = 10^{-1}$."
      - "So the value is $0.55 \\times 10^{-1} = 0.055$."
      - "Option D is $0.54$ — ten times too large, from mishandling the powers of ten. Subtracting indices when dividing, $-3 - (-2) = -1$, is where that goes wrong."
    hint: "Round each number to 2 s.f. before doing anything else, and handle the powers of ten separately from the digits."

  6:
    answer: D
    steps:
      - "Compound interest multiplies by the same factor each year, so after 3 years at 25% the deposit has grown by $1.25^{3}$."
      - "The question gives the *final* amount and asks for the starting one, so this is a division rather than a multiplication."
      - "First work out the growth factor: $1.25^{2} = 1.5625$, and $1.5625 \\times 1.25 = 1.953125$."
      - "So $P \\times 1.953125 = 150{,}000$."
      - "Therefore $P = \\dfrac{150{,}000}{1.953125}$."
      - "That is ₦76,800."
      - "Check by going forwards: $76{,}800 \\times 1.25 = 96{,}000$; $\\times 1.25 = 120{,}000$; $\\times 1.25 = 150{,}000$ ✓."
      - "Option B is ₦96,000 — the amount after one year rather than the deposit needed at the start. Working forwards as a check catches that immediately."
    hint: "The ₦150,000 is the end figure, so divide by the growth factor rather than multiplying. Then check by growing your answer forwards."

  7:
    answer: C
    steps:
      - "Three different bases appear here, so convert everything to base ten before doing any arithmetic."
      - "$256_{7}$ has place values 49, 7 and 1: $(2 \\times 49) + (5 \\times 7) + 6 = 98 + 35 + 6 = 139$."
      - "$314_{10}$ is already in base ten."
      - "So the left-hand side is $314 - 139 = 175$."
      - "Now the right-hand side. $340_{x}$ has place values $x^{2}$, $x$ and 1, so it is $3x^{2} + 4x + 0$."
      - "Setting them equal: $3x^{2} + 4x = 175$, so $3x^{2} + 4x - 175 = 0$."
      - "The discriminant is $16 + 4(3)(175) = 2116$, and $\\sqrt{2116} = 46$, so $x = \\dfrac{-4 + 46}{6} = 7$. (The negative root is discarded — a base cannot be negative.)"
      - "Check: $340_{7} = 3(49) + 4(7) = 147 + 28 = 175$ ✓. And 7 is a valid base for the digits 3 and 4, which it must be — a numeral can only use digits smaller than its base."
    hint: "Convert everything to base ten, then treat $340_x$ as $3x^2 + 4x$ and solve the quadratic. Check the digits are valid in the base you find."

  8:
    answer: B
    steps:
      - "Follow the article through two sales, keeping clear whose cost is whose."
      - "Femi's profit was ₦10,000 at 40%, so that 40% is measured against what *Femi* paid."
      - "If $0.40 \\times (\\text{Femi's cost}) = 10{,}000$, then Femi's cost was $\\dfrac{10{,}000}{0.40} = ₦25{,}000$."
      - "Femi's cost is what Audu sold it for, so Audu sold at ₦25,000 having paid ₦50,000."
      - "Audu's loss is therefore $50{,}000 - 25{,}000 = ₦25{,}000$, measured against *his* cost of ₦50,000."
      - "As a percentage: $\\dfrac{25{,}000}{50{,}000} \\times 100 = 50\\%$."
      - "So $x = 50$."
      - "The trap is measuring Femi's 40% against Audu's ₦50,000, which gives ₦20,000 and no consistent answer. Each percentage belongs to the cost of the person making that sale."
    hint: "Work backwards from Femi's ₦10,000 profit to find what Femi paid — that is what Audu sold for. Then measure Audu's loss against his own ₦50,000."

  9:
    answer: C
    steps:
      - "Every term is a power of 2 near $2^{n}$, so substituting a single letter makes this ordinary algebra."
      - "Let $u = 2^{n}$. Then $2^{n+1} = 2u$ and $2^{n-1} = \\dfrac{u}{2}$."
      - "Numerator: $3(2u) - 4\\left(\\dfrac{u}{2}\\right) = 6u - 2u = 4u$."
      - "Denominator: $2u - u = u$."
      - "So the fraction is $\\dfrac{4u}{u} = 4$."
      - "The $2^{n}$ cancels entirely, which is why the answer is a plain number rather than another power — a useful check that the substitution was done consistently."
      - "Options A and B keep an $n$ in them, which cannot survive: the numerator and denominator are both multiples of $2^{n}$, so it must cancel."
    hint: "Write every term in terms of $u = 2^{n}$. Then the whole thing becomes a simple fraction and the $u$ cancels."

  10:
    answer: D
    steps:
      - "All three numerals are in base six, so convert each to base ten with $P$ carried through as an unknown."
      - "$P344_{6} = 216P + 3(36) + 4(6) + 4 = 216P + 108 + 24 + 4 = 216P + 136$."
      - "$23P2_{6} = 2(216) + 3(36) + 6P + 2 = 432 + 108 + 6P + 2 = 542 + 6P$."
      - "$2PP2_{6} = 2(216) + 36P + 6P + 2 = 432 + 42P + 2 = 434 + 42P$."
      - "The equation says the first minus the second equals the third: $(216P + 136) - (542 + 6P) = 434 + 42P$."
      - "Simplify the left: $210P - 406$."
      - "So $210P - 406 = 434 + 42P$, giving $168P = 840$."
      - "Therefore $P = 5$. Check it is a legal base-six digit — digits must be 0 to 5, and 5 just qualifies ✓."
    hint: "Convert all three numerals to base ten with $P$ left as an unknown, then solve the linear equation. Check your $P$ is a valid base-six digit."

  11:
    answer: B
    steps:
      - "Both parts have a logarithm in the index, and the key identity is $a^{\\log_{a}k} = k$ — a base and its own logarithm undo each other."
      - "First part: $5^{-3\\log_{5}2}$. Move the $-3$ inside using the power law: $-3\\log_{5}2 = \\log_{5}2^{-3}$."
      - "So $5^{\\log_{5}2^{-3}} = 2^{-3} = \\dfrac{1}{8}$."
      - "Second part: $2^{2\\log_{2}3}$. The same way, $2\\log_{2}3 = \\log_{2}9$, so $2^{\\log_{2}9} = 9$."
      - "Multiplying the two: $\\dfrac{1}{8} \\times 9 = \\dfrac{9}{8}$."
      - "As a mixed number that is $1\\tfrac{1}{8}$."
      - "Option D is $\\tfrac{1}{8}$ — the first part alone, with the second forgotten. And the minus sign matters: without it the first part would be 8, giving 72."
    hint: "Use the power law to move each coefficient into the logarithm, then let each base cancel against its own logarithm."

  12:
    answer: D
    steps:
      - "The operation is defined as $a * b = a^{b}$, so substitute $b = 2$ directly into that rule."
      - "$a * 2 = a^{2}$."
      - "The question says this equals $2 - a$, so $a^{2} = 2 - a$."
      - "Bring everything to one side: $a^{2} + a - 2 = 0$."
      - "Factorise: two numbers multiplying to $-2$ and adding to $1$ are $2$ and $-1$, so $(a + 2)(a - 1) = 0$."
      - "So $a = -2$ or $a = 1$."
      - "Check both in the original: $1^{2} = 1$ and $2 - 1 = 1$ ✓; $(-2)^{2} = 4$ and $2 - (-2) = 4$ ✓."
      - "The question asks for the possible values, plural — a quadratic normally has two roots and both must be given. Options offering only correct-looking single values are there for anyone who stops at the first root."
    hint: "Apply the rule with $b = 2$ to get $a^{2}$, set it equal to $2 - a$, and solve the resulting quadratic. There are two answers."

  13:
    answer: C
    steps:
      - "Write both terms using the standard form $a + (n-1)d$, so the common difference appears explicitly."
      - "The 3rd term is $a + 2d$, and we are told it equals $4x - 2y$."
      - "The 9th term is $a + 8d$, and it equals $10x - 8y$."
      - "Subtracting the first equation from the second eliminates $a$ entirely: $(a + 8d) - (a + 2d) = 6d$."
      - "On the right: $(10x - 8y) - (4x - 2y) = 6x - 6y$."
      - "So $6d = 6x - 6y$."
      - "Dividing by 6: $d = x - y$."
      - "There is no need to find $a$ at all — subtracting the two terms removes it, which is why this works with two unknowns in the terms themselves. And note the gap is 6 terms, giving $6d$, not $9 - 3 = 6$ by coincidence but because $8 - 2 = 6$."
    hint: "Write both terms in terms of $a$ and $d$, then subtract to eliminate $a$. Count the gap between the terms carefully."

  14:
    answer: C
    steps:
      - "The inverse of $p$ is the element $q$ for which $p * q$ gives the identity, and the question tells us the identity is zero."
      - "So set $p * q = 0$, which by the rule means $p + q - pq = 0$."
      - "Gather the terms containing $q$: $q - pq = -p$."
      - "Factor $q$ out of the left side: $q(1 - p) = -p$."
      - "Divide by $(1 - p)$: $q = \\dfrac{-p}{1 - p}$."
      - "Multiply top and bottom by $-1$ to tidy the signs: $q = \\dfrac{p}{p - 1}$."
      - "Check with a number, say $p = 2$: the inverse should be $\\dfrac{2}{1} = 2$, and indeed $2 * 2 = 2 + 2 - 4 = 0$ ✓."
      - "Option D is $\\dfrac{p}{p+1}$, the same expression with one sign wrong — which is what you get by dropping the minus when tidying."
    hint: "Set $p * q$ equal to the identity 0, then collect the $q$ terms and factor $q$ out before dividing."

  15:
    answer: A
    steps:
      - "Transposing a matrix swaps its rows and columns, so the entry in row 1 column 2 trades places with the one in row 2 column 1."
      - "For $\\begin{pmatrix} a & b \\\\ c & d \\end{pmatrix}$, the transpose is $\\begin{pmatrix} a & c \\\\ b & d \\end{pmatrix}$."
      - "Saying $P^{T} = P$ means those two matrices are identical entry by entry."
      - "The diagonal entries match automatically, so the only real condition is $b = c$. A matrix with this property is called symmetric."
      - "We are told $b = 1$, so $c$ must be 1 as well."
      - "Checking the options, only A has a lower-left entry of 1 to match the $b = 1$ in the upper right. Every other option has $-1$ there, so none of them is symmetric."
      - "So the answer is $\\begin{pmatrix} 0 & 1 \\\\ 1 & 0 \\end{pmatrix}$."
      - "The diagonal entries are irrelevant to this question — $a$ and $d$ can be anything at all and the matrix is still symmetric. Only the off-diagonal pair has to match."
    hint: "Transposing swaps the off-diagonal entries, so $P^{T} = P$ just means $b = c$. Look for the option whose lower-left entry is also 1."

  16:
    answer: B
    steps:
      - "Look at the bracket first: $\\tfrac{1}{2} - \\tfrac{1}{4} + \\tfrac{1}{8} - \\tfrac{1}{16} + \\ldots$ — each term is half the previous one with the sign flipped."
      - "That makes it a geometric progression with first term $a = \\tfrac{1}{2}$ and common ratio $r = -\\tfrac{1}{2}$."
      - "Since $r$ lies between $-1$ and 1, the series has a sum to infinity: $S_\\infty = \\dfrac{a}{1 - r}$."
      - "The denominator is $1 - \\left(-\\tfrac{1}{2}\\right) = \\tfrac{3}{2}$. Subtracting a negative adds."
      - "So $S_\\infty = \\dfrac{1/2}{3/2} = \\dfrac{1}{2} \\times \\dfrac{2}{3} = \\dfrac{1}{3}$."
      - "The whole expression is that sum raised to the power $-1$, which means taking its reciprocal."
      - "So the answer is $\\dfrac{1}{1/3} = 3$."
      - "Stopping at $\\tfrac{1}{3}$ is the trap, and so is taking $r = +\\tfrac{1}{2}$: that would give a sum of 1 and an answer of 1. The alternating signs are what make $r$ negative."
    hint: "The bracket is a geometric series with a negative ratio. Sum it to infinity first, then remember the power $-1$ means take the reciprocal."

  17:
    answer: C
    steps:
      - "Each inequality has a boundary line, so rearrange both into $y = mx + c$ form to see what those lines look like."
      - "The first, $2x - 2 \\le y$, is $y \\ge 2x - 2$ — a line of gradient 2 crossing the $y$-axis at $-2$, with the region above it."
      - "The second, $2y - 2 \\le x$, rearranges to $y \\le \\dfrac{x + 2}{2}$ — a line of gradient $\\tfrac{1}{2}$ crossing at $+1$, with the region below it."
      - "Both gradients are positive, which immediately rules out any graph whose lines slope downwards."
      - "Find where they cross: $2x - 2 = \\dfrac{x + 2}{2}$ gives $4x - 4 = x + 2$, so $x = 2$ and $y = 2$."
      - "So the region is a wedge with its point at $(2, 2)$, opening to the left — above the steep line and below the shallow one."
      - "Graph C shows exactly that: two lines of positive gradient meeting near $(2, 2)$ with the shading between them, widening leftwards."
      - "If the lines are hard to tell apart, test a point. The origin satisfies both — $0 \\ge -2$ ✓ and $0 \\le 1$ ✓ — so the correct graph must have the origin inside its shaded region."
    hint: "Rearrange both inequalities into $y = mx + c$ form. Both gradients are positive, and the origin satisfies both — use that to pick the graph."

  18:
    answer: D
    steps:
      - "The first row is $(t-4, 0, 0)$ — two zeros, so expanding along it is by far the quickest route."
      - "Only the first entry survives, so the determinant is $(t - 4)$ times the minor left after deleting its row and column."
      - "That minor is $\\begin{vmatrix} t + 1 & 1 \\\\ 4 & t - 2 \\end{vmatrix}$, worked out as usual: the product of the leading diagonal minus the product of the other."
      - "So the minor is $(t + 1)(t - 2) - (1)(4) = t^{2} - t - 2 - 4 = t^{2} - t - 6$."
      - "Factorising: $(t - 3)(t + 2)$."
      - "So the whole determinant is $(t - 4)(t - 3)(t + 2)$, which is zero when any factor is zero."
      - "That gives $t = 4$, $t = 3$ and $t = -2$ — the three values in option D."
    hint: "Expand along the row with two zeros. The cubic that results factorises, and each factor gives one value of $t$."

  19:
    answer: A
    steps:
      - "If $(x - 1)$, $(x + 1)$ and $(x - 2)$ are all factors of a cubic, then the cubic is $a$ times their product — nothing else fits three factors into degree three."
      - "So $ax^{3} + bx^{2} + cx - 1 = a(x - 1)(x + 1)(x - 2)$."
      - "The quickest way in is the constant term, which you get by putting $x = 0$ on both sides."
      - "On the left that is $-1$. On the right: $a(-1)(1)(-2) = 2a$."
      - "So $2a = -1$, giving $a = -\\dfrac{1}{2}$."
      - "Now expand the right side: $(x-1)(x+1) = x^{2} - 1$, and $(x^{2}-1)(x-2) = x^{3} - 2x^{2} - x + 2$."
      - "Multiplying by $a = -\\tfrac{1}{2}$: $-\\tfrac{1}{2}x^{3} + x^{2} + \\tfrac{1}{2}x - 1$."
      - "Reading off the coefficients: $a = -\\tfrac{1}{2}$, $b = 1$, $c = \\tfrac{1}{2}$. The constant $-1$ matches, which confirms the whole thing."
    hint: "Write the cubic as $a$ times the product of the three factors, then compare constant terms to find $a$ before expanding."

  20:
    answer: B
    steps:
      - "The profit is $10x - x^{2}$, a quadratic in $x$ with a negative coefficient of $x^{2}$, so it opens downward and does have a maximum."
      - "Write it in standard order: $-x^{2} + 10x$, so $a = -1$ and $b = 10$."
      - "The turning point of a quadratic is at $x = -\\dfrac{b}{2a}$."
      - "Substituting: $x = -\\dfrac{10}{2(-1)} = -\\dfrac{10}{-2} = 5$."
      - "So 5 bags give the maximum profit."
      - "Check either side: at 4 bags the profit is $40 - 16 = 24$, at 5 it is $50 - 25 = 25$, and at 6 it is $60 - 36 = 24$ ✓ — 5 really is the peak."
      - "The question asks for the number of bags, not the profit itself. The maximum profit is ₦25, which is not what was asked and is not offered."
    hint: "The profit is a downward parabola. Find its turning point with $x = -\\tfrac{b}{2a}$, and check you are giving the number of bags rather than the profit."

  21:
    answer: D
    steps:
      - "Bring everything to one side so the inequality can be factorised: $2 - x > x^{2}$ becomes $0 > x^{2} + x - 2$."
      - "Written the usual way round: $x^{2} + x - 2 < 0$."
      - "Factorise: two numbers multiplying to $-2$ and adding to $1$ are $2$ and $-1$, so $(x + 2)(x - 1) < 0$."
      - "A product of two things is negative exactly when they have opposite signs, so the solution lies *between* the roots."
      - "The roots are $x = -2$ and $x = 1$."
      - "So the solution is $-2 < x < 1$."
      - "Check a point inside, say $x = 0$: $2 - 0 = 2$ and $0^{2} = 0$, and $2 > 0$ ✓. And outside, say $x = 2$: $2 - 2 = 0$ against $4$ — false ✓."
      - "Option A gives the outside region, which is what you get when the product is *positive*. Testing one point in the middle settles which of the two it is, and takes a few seconds."
    hint: "Rearrange to a quadratic less than zero and factorise. When a product is negative the answer lies between the roots, not outside them."

  22:
    answer: D
    steps:
      - "You are not asked for the roots themselves, only a combination of them — and the sum and product of roots come straight from the coefficients."
      - "For $ax^{2} + bx + c = 0$: the sum $\\alpha + \\beta = -\\dfrac{b}{a}$ and the product $\\alpha\\beta = \\dfrac{c}{a}$."
      - "Here $a = 3$, $b = 5$ and $c = -2$, so $\\alpha + \\beta = -\\dfrac{5}{3}$ and $\\alpha\\beta = -\\dfrac{2}{3}$."
      - "Now rewrite what is asked as a single fraction: $\\dfrac{1}{\\alpha} + \\dfrac{1}{\\beta} = \\dfrac{\\beta + \\alpha}{\\alpha\\beta}$."
      - "That is exactly the sum divided by the product."
      - "Substituting: $\\dfrac{-5/3}{-2/3}$."
      - "The thirds cancel and the two minus signs make a plus: $\\dfrac{5}{2}$."
      - "Option A is $-\\tfrac{5}{2}$, the same value with one of those two minus signs lost. Finding the actual roots would also work here but takes much longer and risks more arithmetic."
    hint: "Write $\\tfrac{1}{\\alpha} + \\tfrac{1}{\\beta}$ as one fraction — it becomes the sum of the roots over their product, both of which come from the coefficients."

  23:
    answer: A
    steps:
      - "The expression is a fraction with a fixed numerator, so it is smallest exactly when its denominator is largest."
      - "This is the reverse of the usual instinct, and it is what the question is testing."
      - "The denominator is $3 - \\cos\\theta$, and it is largest when $\\cos\\theta$ is smallest."
      - "Cosine never goes below $-1$, and over a full turn $0 \\le \\theta \\le 2\\pi$ it does reach $-1$, at $\\theta = \\pi$."
      - "So the largest denominator is $3 - (-1) = 4$."
      - "The minimum value of the function is therefore $\\dfrac{2}{4} = \\dfrac{1}{2}$."
      - "Chasing the largest $\\cos\\theta$ instead gives a denominator of $3 - 1 = 2$ and a value of 1 — which is the *maximum*, offered as option C."
    hint: "With a fixed top, the fraction is smallest when the bottom is biggest. So make $\\cos\\theta$ as small as it can be."

  24:
    answer: D
    steps:
      - "A frustum is a pyramid with a smaller, similar pyramid cut off the top — so the two pyramids are similar and their dimensions are in proportion."
      - "Let $h$ be the full pyramid's height. The small pyramid removed from the top has height $h - 6$, since the frustum between them is 6 m deep."
      - "Similar solids have their base sides in the same ratio as their heights."
      - "The small pyramid's base is the 2 m square and the full pyramid's is the 5 m square, so $\\dfrac{2}{5} = \\dfrac{h - 6}{h}$."
      - "Cross-multiplying: $2h = 5(h - 6) = 5h - 30$."
      - "So $30 = 3h$, giving $h = 10$ m."
      - "Check: the small pyramid is then 4 m tall, and $\\dfrac{4}{10} = \\dfrac{2}{5}$ ✓."
      - "The 6 m is the *frustum's* depth, not either pyramid's height — writing $h - 6$ for the small one is where the whole solution turns."
    hint: "The top piece cut off is a similar pyramid. Its height is the full height minus 6, and side lengths are in the same ratio as heights."

  25:
    answer: B
    steps:
      - "A point moving so that it stays the same distance from a straight line traces a line parallel to it — that is what the locus $ST$ is."
      - "So $ST$ is parallel to $UV$."
      - "Now $US$ is a line crossing both of those parallels, which makes it a transversal."
      - "$\\angle VUS$ and $\\angle UST$ sit on the same side of that transversal, one at each parallel line — they are co-interior angles."
