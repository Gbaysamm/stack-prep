explanations:
  1:
    answer: D
    steps:
      - 'Simple interest, but with a twist: we''re told the final amount, not the starting one. Let''s work backwards.'
      - 'Here''s the key fact: simple interest does not compound, so the interest is the same amount each year and the total is just the rate multiplied by the years.'
      - 'At 2% per annum for 5 years, the total interest is $2\% \times 5 = 10\%$ of the principal.'
      - 'So the amount is the principal plus a tenth of itself: $A = P + 0.1P = 1.1P$.'
      - 'Now use the amount. We are told the amount is ₦5,000, so $1.1P = 5000$.'
      - 'Dividing: $P = \dfrac{5000}{1.1} = ₦4{,}545.45$.'
      - 'Check it: 10% of ₦4,545.45 is ₦454.55, and $4545.45 + 454.55 = 5000$ ✓.'
      - 'Be careful: the trap the printed options set is treating ₦5,000 as the principal and adding interest to it, which gives ₦5,500 — the wrong direction entirely. ''Amounts to'' means ₦5,000 is the finishing figure, not the starting one. Read ''amounts to'' as the finishing figure, and you''ll work in the right direction.'
    hint: 'Five years at 2% adds 10% in total. The ₦5,000 is the amount *after* that has been added, so divide rather than multiply.'

  2:
    answer: B
    steps:
      - 'A profit question where the cost has two parts. Let''s make sure we count both.'
      - 'Here''s the key idea: percentage gain is measured against what the car actually cost him — and that is more than the purchase price, because he also spent money on it.'
      - 'Total cost: $₦250{,}000 + ₦70{,}000 = ₦320{,}000$.'
      - 'Now the profit. He sold it for ₦400,000, so the profit is $400{,}000 - 320{,}000 = ₦80{,}000$.'
      - 'Remember the formula: percentage gain is $\dfrac{\text{profit}}{\text{cost}} \times 100$.'
      - 'So it is $\dfrac{80{,}000}{320{,}000} \times 100 = \dfrac{1}{4} \times 100 = 25\%$.'
      - 'Here''s the trap: ignoring the refurbishing money gives $\dfrac{150{,}000}{250{,}000} = 60\%$, which is offered as option D. The ₦70,000 is part of what the car cost him and must go into the denominator as well as reducing the profit. Every naira spent on the car belongs in its cost.'
    hint: 'The cost includes the refurbishing. Work out the total spent first, then express the profit as a percentage of that.'

  3:
    answer: B
    steps:
      - 'This is a calculation with decimals where order and rounding both matter. Let''s go carefully.'
      - 'First, the order: multiplication comes before subtraction, so deal with $1.6324 \times 0.43$ first.'
      - 'Let''s multiply. Ignoring decimals: $16324 \times 43 = 701{,}932$.'
      - 'Now count decimal places: 1.6324 has four and 0.43 has two, so the product has six — $0.701932$.'
      - 'Now subtract: $21.05347 - 0.701932$.'
      - 'Line up the decimal points: $21.053470 - 0.701932 = 20.351538$.'
      - 'Now round. To three decimal places, look at the fourth digit after the point: it is 5, so the third rounds up from 1 to 2.'
      - 'That gives $20.352$.'
      - 'Watch out: Option A is $20.351$ — the same calculation truncated rather than rounded. And doing the subtraction before the multiplication would give roughly $8.35$, which is not offered at all. Multiply first, and round only at the very end.'
    hint: 'Multiply first, then subtract. Keep enough decimal places to round correctly at the end.'

  4:
    answer: B
    steps:
      - 'More decimals, and the danger is losing a decimal place. Let''s take the top and bottom one at a time.'
      - 'Work out the top and the bottom separately before dividing.'
      - 'Start with the square. $(0.14)^{2} = 0.0196$.'
      - 'Multiply by $0.275$: $0.0196 \times 0.275 = 0.00539$.'
      - 'The bottom is $7 \times 0.02 = 0.14$.'
      - 'So the expression is $\dfrac{0.00539}{0.14}$.'
      - 'Next, multiply top and bottom by 100 to clear decimals: $\dfrac{0.539}{14} = 0.0385$.'
      - 'Finally, to three decimal places, the fourth digit is 5, so the third rounds up: $0.039$.'
      - 'Here''s the trap: Option C is $0.308$, which is ten times too big — the commonest outcome of losing one decimal place in $(0.14)^{2}$, since squaring doubles the places. Squaring doubles the decimal places — count them and you''re safe.'
    hint: 'Square first, then multiply, then divide. Count the decimal places carefully when you square.'

  5:
    answer: C
    steps:
      - 'Surds and squares together — but there''s a pattern here that saves a lot of work.'
      - 'Here''s the pattern: the top is a difference of two squares, so factorise rather than expanding both squares separately.'
      - '$p^{2} - q^{2} = (p - q)(p + q)$.'
      - 'Now the pieces. With $p = 1 + \sqrt{2}$ and $q = 1 - \sqrt{2}$: the sum is $p + q = 2$, since the surds cancel.'
      - 'And the difference is $p - q = (1 + \sqrt{2}) - (1 - \sqrt{2}) = 2\sqrt{2}$.'
      - 'So the top is $2\sqrt{2} \times 2 = 4\sqrt{2}$.'
      - 'Now, the bottom needs $pq = (1 + \sqrt{2})(1 - \sqrt{2})$, another difference of two squares: $1 - 2 = -1$. So $2pq = -2$.'
      - 'Therefore the value is $\dfrac{4\sqrt{2}}{-2} = -2\sqrt{2}$.'
      - 'Be careful: the minus comes entirely from $pq$ being negative, which is easy to lose — and option D is the same answer with that sign dropped. Difference of two squares twice, and one sign to watch — that''s the whole question.'
    hint: 'Use the difference of two squares on the top, and notice that $pq$ is also a difference of two squares. Watch its sign.'

  6:
    answer: D
    steps:
      - 'This expression looks heavy, but everything depends on one ratio. Let''s find it first.'
      - 'Here''s the idea: the relation $\tfrac{y}{2} = x$ means $y = 2x$, so every ratio of $x$ to $y$ can be turned into a plain number.'
      - 'Let''s find it: $\dfrac{x}{y} = \dfrac{x}{2x} = \dfrac{1}{2}$.'
      - 'So $\dfrac{x^{3}}{y^{3}} = \left(\dfrac{1}{2}\right)^{3} = \dfrac{1}{8}$, and $\dfrac{x^{2}}{y^{2}} = \left(\dfrac{1}{2}\right)^{2} = \dfrac{1}{4}$.'
      - 'Now the top: $\dfrac{1}{8} + \dfrac{1}{2} = \dfrac{1}{8} + \dfrac{4}{8} = \dfrac{5}{8}$.'
      - 'And the bottom: $\dfrac{1}{2} - \dfrac{1}{4} = \dfrac{1}{4}$.'
      - 'Finally, dividing: $\dfrac{5}{8} \div \dfrac{1}{4} = \dfrac{5}{8} \times 4 = \dfrac{5}{2}$.'
      - 'Be careful: Option B is $\tfrac{5}{8}$ — the numerator alone, handed in before the division was done. Turn the ratio into a number first, and it all becomes ordinary fractions.'
    hint: 'Turn $\tfrac{x}{y}$ into $\tfrac{1}{2}$ first, then every term becomes an ordinary fraction.'

  7:
    answer: B
    steps:
      - 'Cube roots work just like square roots, but with threes. Let''s take the pieces one at a time.'
      - 'Here''s the rule: a cube root undoes a cube, and it can be taken of each factor separately: $\sqrt[3]{ab} = \sqrt[3]{a} \times \sqrt[3]{b}$.'
      - 'So $\sqrt[3]{64a^{3}} = \sqrt[3]{64} \times \sqrt[3]{a^{3}}$.'
      - 'Start with the number. $\sqrt[3]{64} = 4$, since $4^{3} = 64$.'
      - 'Now the letter. $\sqrt[3]{a^{3}} = a$, since cubing and cube-rooting cancel.'
      - 'So the answer is $4a$.'
      - 'Here''s the trap: Option A is $8a$, which comes from $\sqrt[3]{64}$ being read as $\sqrt{64}$. A cube root of 64 is 4; a square root of it is 8, and the small 3 on the radical is the difference. Always check the little number on the root sign.'
    hint: 'Take the cube root of the 64 and of the $a^{3}$ separately. Remember it is a cube root, not a square root.'

  8:
    answer: C
    steps:
      - 'Four terms can look impossible to factorise, but there''s a perfect square hiding in three of them. Let''s find it.'
      - 'Here''s the clue: four terms with a lone $-9y^{2}$ suggests grouping the other three, because $4x^{2} + 20x + 25$ looks like it might be a perfect square.'
      - 'Check: $(2x)^{2} = 4x^{2}$, $5^{2} = 25$, and $2 \times 2x \times 5 = 20x$ ✓. So $4x^{2} + 20x + 25 = (2x + 5)^{2}$.'
      - 'The expression is therefore $(2x + 5)^{2} - 9y^{2}$.'
      - 'Now look at what''s left. And $9y^{2} = (3y)^{2}$, so this is a difference of two squares: $A^{2} - B^{2}$ with $A = 2x + 5$ and $B = 3y$.'
      - 'Now the formula. Applying $A^{2} - B^{2} = (A - B)(A + B)$: $\left[(2x + 5) - 3y\right]\left[(2x + 5) + 3y\right]$.'
      - 'Tidying: $(2x - 3y + 5)(2x + 3y + 5)$.'
      - 'Let''s make sure it''s right. Check by expanding the $y$ terms: $-3y \times 3y = -9y^{2}$ ✓, and the cross terms $+3y(2x+5)$ and $-3y(2x+5)$ cancel, which is what leaves no $y$ term in the original.'
      - 'The big idea: rearranging four terms so that a perfect square appears is the whole method — attacking them in the printed order leads nowhere. Look for the perfect square first, and the rest follows.'
    corrected: >-
      the printed option C is (2x - 3y + 5)(2x - 3y - 5), which expands with a -9y^2 but also
      leaves stray y terms; no printed option is the correct factorisation. C now carries
      (2x - 3y + 5)(2x + 3y + 5). Verify against the paper.
    hint: 'Three of the terms form a perfect square. Group them, and what is left is a difference of two squares.'

  9:
    answer: A
    steps:
      - 'Two graphs meeting at a point — that means their y-values are equal there. Let''s use that.'
      - 'Here''s the idea: two graphs intersect where they have the same $y$ for the same $x$, so set the two expressions equal to each other.'
      - 'That gives $px^{2} + q = 2x^{2} - 1$, and this must hold at the point where they meet.'
      - 'Now use the point. We are told they meet at $x = 2$, so substitute that value into both sides.'
      - 'Left side: $p(2)^{2} + q = 4p + q$.'
      - 'Right side: $2(2)^{2} - 1 = 8 - 1 = 7$.'
      - 'So $4p + q = 7$.'
      - 'Now rearrange. The question asks for $p$ in terms of $q$, so make $p$ the subject: subtract $q$ from both sides to get $4p = 7 - q$.'
      - 'Divide by 4: $p = \dfrac{7 - q}{4}$.'
      - 'One more thought: note that only the $x$ value is needed — the $y$ value at the intersection is never required, because setting the two expressions equal has already used it. Set the expressions equal, substitute, rearrange — that''s all it takes.'
    hint: 'At an intersection the two expressions for $y$ are equal. Set them equal, put $x = 2$ in, and rearrange for $p$.'

  10:
    answer: D
    steps:
      - 'Two equations with squares in them can be tricky, but there''s an identity that does most of the work.'
      - 'Here''s the approach: two equations in two unknowns, and one of them is symmetric — so use the identity linking a sum of squares to a sum and a product.'
      - 'Here''s the identity: $(m + n)^{2} = m^{2} + n^{2} + 2mn$.'
      - 'Now fill in what we know. Substituting what is given: $7^{2} = 29 + 2mn$, so $49 = 29 + 2mn$.'
      - 'Therefore $2mn = 20$ and $mn = 10$.'
      - 'Now $m$ and $n$ are two numbers with sum 7 and product 10 — which is exactly the description of the roots of $t^{2} - 7t + 10 = 0$.'
      - 'Factorising: $(t - 2)(t - 5) = 0$, so the numbers are 2 and 5.'
      - 'Notice: since the question names $m$ and $n$ without saying which is which, both orders work: $(2, 5)$ and $(5, 2)$.'
      - 'Be careful: Options A, B and C each pair numbers that do not both satisfy $m + n = 7$ — a quick check worth doing before choosing. Squaring the sum is the key move — remember it for symmetric questions like this.'
    hint: 'Square the sum $m + n$ and compare with the sum of squares to find $mn$. Then look for two numbers with that sum and product.'

  11:
    answer: C
    steps:
      - 'This fraction looks frightening, but a single substitution turns it into ordinary polynomials.'
      - 'Here''s why: the powers of $a$ here are $3x$, $2x$ and $x$, which are the cube, the square and the first power of $a^{x}$ — so substituting makes it an ordinary polynomial.'
      - 'Let $u = a^{x}$. Then $a^{2x} = u^{2}$ and $a^{3x} = u^{3}$.'
      - 'The top becomes $u^{3} - 26u^{2} + 156u - 216$ and the bottom becomes $u^{2} - 24u + 108$.'
      - 'Factorise the bottom: two numbers multiplying to 108 and adding to $-24$ are $-6$ and $-18$, so it is $(u - 6)(u - 18)$.'
      - 'Next, the top. Try $u = 6$ in the top: $216 - 936 + 936 - 216 = 0$, so $(u - 6)$ is a factor there too. Dividing gives $u^{2} - 20u + 36 = (u - 2)(u - 18)$.'
      - 'So the top is $(u - 6)(u - 2)(u - 18)$ and the division cancels $(u - 6)(u - 18)$, leaving $u - 2$.'
      - 'Finally, putting $u$ back: $a^{x} - 2$.'
      - 'The lesson: substituting a single letter for $a^{x}$ is what makes this tractable. Left in index form the factorising is very hard to see. Swap in a single letter, and hard-looking indices become friendly.'
    hint: 'Let $u = a^{x}$, so the powers become $u^{3}$, $u^{2}$ and $u$. Factorise both polynomials and cancel.'

  12:
    answer: C
    steps:
      - 'Integer solutions of inequalities are best found by a careful search. Let''s organise it.'
      - 'Here''s the strategy: there are three conditions to satisfy at once, so narrow the possibilities before testing the inequality.'
      - 'Start with y. $y > 0$ and $y < 3$ with $y$ an integer leaves only $y = 1$ or $y = 2$.'
      - 'Now x. $x > 0$ with $x$ an integer means $x \ge 1$.'
      - 'Now test each value of y. Take $y = 1$ first: $3(1) + 5x \le 15$ gives $5x \le 12$, so $x \le 2.4$. The integers are $x = 1$ and $x = 2$.'
      - 'Now $y = 2$: $3(2) + 5x \le 15$ gives $5x \le 9$, so $x \le 1.8$. Only $x = 1$ works.'
      - 'So the solutions are $(1, 1)$, $(2, 1)$ and $(1, 2)$.'
      - 'Watch out: Options A and D include a point with $y = 3$, which the strict inequality $y < 3$ forbids, and $(3, 1)$ fails because $3 + 15 = 18 > 15$. Testing each candidate against every condition is quicker than sketching here. Test every candidate against every condition, and nothing slips through.'
    hint: 'The bounds on $y$ leave only two values. Take each in turn and see which whole values of $x$ then satisfy the inequality.'

  13:
    answer: A
    steps:
      - 'This looks like a graph-reading question, but a little algebra and one test point settle it neatly.'
      - 'Here''s the idea: a region bounded by straight lines is described by one inequality per boundary line; the job is to decide, for each line, which side the triangle lies on.'
      - 'First find the corners. The line $2y - x - 2 = 0$ meets the $x$-axis where $y = 0$: $x = -2$, which is $S$. The line $y + 2x + 2 = 0$ meets it at $x = -1$, which is $T$.'
      - 'Now the top corner. The two lines meet at $P$: from $2y = x + 2$ and $y = -2x - 2$, $2(-2x - 2) = x + 2$ gives $x = -1.2$ and $y = 0.4$. So $P$ is above the axis, and the triangle lies on the upper side of the $x$-axis: $y \ge 0$.'
      - 'Now, test a point inside the triangle, such as $(-1.4, 0.1)$, against each line. For $2y - x - 2$: $0.2 + 1.4 - 2 = -0.4$, so the region has $2y - x - 2 \le 0$.'
      - 'Then the other line. For $y + 2x + 2$: $0.1 - 2.8 + 2 = -0.7$, so the region has $y + 2x + 2 \le 0$.'
      - 'Together: $2y - x - 2 \le 0$, $y + 2x + 2 \le 0$ and $y \ge 0$. Every point of the triangle also has $x \le 0$, so option A''s extra condition is true, though not needed.'
      - 'Be careful: the trap is options B and C, which use $y \le 0$ — the region *below* the axis. The corner $P$ at height $0.4$ shows the triangle is above it. One test point inside the region settles every inequality.'
    hint: 'Find $P$ where the lines meet, then test a point inside the triangle in each inequality.'

  14:
    answer: C
    steps:
      - 'Arithmetic progression questions come down to writing each term with a and d. Let''s do that.'
      - 'Here''s the formula: write both terms using $a + (n-1)d$, the standard form for the $n$th term of an arithmetic progression.'
      - 'The sixth term is $a + 5d$.'
      - 'The twelfth term is $a + 11d$.'
      - 'Now, the condition is that the sixth is half the twelfth: $a + 5d = \tfrac{1}{2}(a + 11d)$.'
      - 'Let''s clear the fraction. Multiply both sides by 2 to clear the fraction: $2a + 10d = a + 11d$.'
      - 'Subtract $a$ and $10d$ from both sides: $a = d$.'
      - 'So the first term equals the common difference.'
      - 'One caution: take care with the halving — putting the $\tfrac{1}{2}$ on the sixth term instead gives $a = -\tfrac{7}{3}d$, which matches nothing. Read which term is half of which. Read which term is half of which, and the algebra is short.'
    hint: 'Write the 6th and 12th terms in terms of $a$ and $d$, set up the ''half of'' equation and clear the fraction first.'

  15:
    answer: A
    steps:
      - 'A savings plan that grows by the same amount every year is an arithmetic progression. Let''s see how long it takes.'
      - 'First, the pattern: his savings form an arithmetic progression: ₦100 in the first year, then ₦20 more each year, so $a = 100$ and $d = 20$.'
      - 'Here''s the key point: the question asks about the *total* saved, so use the sum formula $S_n = \tfrac{n}{2}\left[2a + (n-1)d\right]$.'
      - 'Substituting: $S_n = \tfrac{n}{2}\left[200 + 20(n-1)\right]$.'
      - 'Simplify inside the bracket: $200 + 20n - 20 = 180 + 20n$.'
      - 'So $S_n = \tfrac{n}{2}(180 + 20n) = n(90 + 10n)$.'
      - 'Now, set that equal to 5800: $10n^{2} + 90n - 5800 = 0$, and dividing by 10 gives $n^{2} + 9n - 580 = 0$.'
      - 'Factorising: $(n + 29)(n - 20) = 0$, so $n = 20$ — the negative root has no meaning here.'
      - 'Check: in year 20 he saves $100 + 19(20) = ₦480$, and the average of ₦100 and ₦480 over 20 years is $\tfrac{580}{2} \times 20 = ₦5800$ ✓. Notice 580 appears in that working, which is how the printed target lost its zero. The trap is using the single-term formula — here we need the total, so the sum formula is the one to use.'
    hint: 'This is the sum of an arithmetic progression, not a single term. Use $S_n$, form a quadratic in $n$ and factorise.'

  16:
    answer: A
    steps:
      - 'Another binary operation question. We need the identity first, and then the inverse follows.'
      - 'Here''s the order: an inverse is the element that combines with a given one to produce the identity, so the identity has to be known first — and here it is given as $-1$.'
      - 'First, it is worth checking that: $a * e = a + e + 1$, and for this to equal $a$ we need $e + 1 = 0$, so $e = -1$ ✓.'
      - 'Now let $x$ be the inverse of 2. The defining condition is $2 * x = -1$.'
      - 'Next, apply the rule: $2 * x = 2 + x + 1 = x + 3$.'
      - 'So $x + 3 = -1$.'
      - 'Therefore $x = -4$.'
      - 'Finally, check both ways: $2 * (-4) = 2 - 4 + 1 = -1$ ✓ and $(-4) * 2 = -1$ ✓, so the operation is commutative and the inverse works from either side. Know the identity, set up the equation, and the inverse falls out.'
    hint: 'The inverse of 2 is whatever combines with 2 to give the identity $-1$. Write $2 * x$ using the rule and set it equal to $-1$.'

  17:
    answer: C
    steps:
      - 'Finding the identity in a table is a matter of looking for a row that changes nothing. Let''s scan.'
      - 'Remember: the identity element is the one that leaves every other element unchanged when combined with it.'
      - 'So read across each row and look for the row that simply repeats the column headings.'
      - 'Let''s try each row. Row $k$ gives $l$, $m$, $k$ — not the headings $k$, $l$, $m$, so $k$ is not it.'
      - 'Row $l$ gives $m$, $k$, $l$ — again not the headings.'
      - 'Row $m$ gives $k$, $l$, $m$, which is exactly the column headings in order.'
      - 'To be sure, check down the $m$ column as well: $k$, $l$, $m$ ✓ — it works from both sides, as an identity must.'
      - 'So the identity element is $m$.'
      - 'Be careful: Option D is $o$, an element that does not appear in the table at all. An identity has to be a member of the set, which rules it out before any checking begins. An identity must be in the set and must work from both sides.'
    hint: 'Look for the row that reproduces the column headings exactly — and check the matching column too.'

  18:
    answer: B
    steps:
      - 'Matrix squaring takes a little patience, so let''s take the pieces one at a time.'
      - 'Here''s the plan: work out the three pieces separately: $k^{2}$, then $k$, then $I$.'
      - 'Start with the square. For $k^{2}$, multiply row by column. Top-left: $(2)(2) + (1)(3) = 4 + 3 = 7$. Top-right: $(2)(1) + (1)(4) = 2 + 4 = 6$.'
      - 'Then the bottom row. Bottom-left: $(3)(2) + (4)(3) = 6 + 12 = 18$. Bottom-right: $(3)(1) + (4)(4) = 3 + 16 = 19$.'
      - 'So $k^{2} = \begin{pmatrix} 7 & 6 \\ 18 & 19 \end{pmatrix}$.'
      - 'Now add $k$ itself: $\begin{pmatrix} 7+2 & 6+1 \\ 18+3 & 19+4 \end{pmatrix} = \begin{pmatrix} 9 & 7 \\ 21 & 23 \end{pmatrix}$.'
      - 'Finally add $I$, which is 1 on the leading diagonal and 0 elsewhere: $\begin{pmatrix} 10 & 7 \\ 21 & 24 \end{pmatrix}$.'
      - 'Here''s the trap: the identity matrix adds 1 only to the diagonal entries. Adding 1 everywhere would give option A''s shape, which is the error this question is built to catch. Row times column, and ones only on the diagonal.'
    hint: 'Square the matrix by row-times-column multiplication, add the original, then add $I$ — which only affects the diagonal.'

  19:
    answer: B
    steps:
      - 'A three-by-three determinant is really three small ones. The signs are where the care goes.'
      - 'Here''s the method: expand along the top row, alternating the signs plus, minus, plus.'
      - 'First term: $-1 \times \begin{vmatrix} 1 & 1 \\ 2 & 1 \end{vmatrix} = -1 \times (1 - 2) = -1 \times -1 = 1$.'
      - 'Now, the second term carries a minus in front: $-(-1) \times \begin{vmatrix} 3 & 1 \\ 1 & 1 \end{vmatrix} = +1 \times (3 - 1) = 2$.'
      - 'Third term: $-1 \times \begin{vmatrix} 3 & 1 \\ 1 & 2 \end{vmatrix} = -1 \times (6 - 1) = -5$.'
      - 'Now add them up. Adding: $1 + 2 - 5 = -2$.'
      - 'Here''s the trap: two minus signs meet on the middle term — the $-1$ from the matrix and the $-$ from the expansion pattern — and they make a plus. Missing that gives $1 - 2 - 5 = -6$, which is not offered, so an answer off the list is a signal to re-check that sign. Two minuses make a plus — keep that in mind on the middle term.'
    hint: 'Expand along the top row. The middle term has a minus from the pattern and a minus from the entry itself.'

  20:
    answer: D
    steps:
      - 'This one is about scaling a matrix. The only care needed is with the signs.'
      - 'Here''s the rule: multiplying a matrix by a number is the simplest matrix operation there is: every single entry is multiplied by that number, and the shape does not change.'
      - 'So $-2P$ is found by multiplying each of the nine entries of $P$ by $-2$, one at a time.'
      - 'Let''s go row by row. First row of $P$ is $3$, $-3$, $4$. Multiplying each by $-2$ gives $-6$, $+6$, $-8$ — note the middle entry becomes positive, because a negative times a negative is positive.'
      - 'Second row is $5$, $0$, $6$, which becomes $-10$, $0$, $-12$. Zero times anything stays zero.'
      - 'Third row is $1$, $2$, $1$, which becomes $-2$, $-4$, $-2$.'
      - 'Now put it together. Assembling: $-2P = \begin{pmatrix} -6 & 6 & -8 \\ -10 & 0 & -12 \\ -2 & -4 & -2 \end{pmatrix}$.'
      - 'A quick check: every entry of $P$ was multiplied by a negative number, so every non-zero entry must change sign. Any candidate answer keeping a positive entry where $P$ had a positive one — or keeping $5$ and $6$ unchanged, as some of the printed options do — can be ruled out without any arithmetic at all. A negative multiplier flips every sign — that''s the thing to remember.'
    hint: 'Multiply every entry by $-2$, including the zero. Watch the entry that is already negative — two negatives make a positive.'

  21:
    answer: C
    steps:
      - 'A polygon with a special angle relationship. The exterior angles make this quick.'
      - 'Start with this: at each vertex of a polygon the interior and exterior angles sit on a straight line, so together they make $180^{\circ}$.'
