format_version: 1
exam_year: 2002
subject: MATH

explanations:
  1:
    answer: D
    steps:
      - 'This is a profit and loss question, and the key is knowing which price you have been given. Let''s work back to the cost together.'
      - 'Start with the loss. A loss of 25% means the selling price is 75% of what the goats cost — so the ₦180,000 is not the cost, it is three quarters of it.'
      - 'Now write that as an equation. If $0.75 \times \text{cost} = 180{,}000$, then the cost is $180{,}000 \div 0.75$.'
      - 'That gives ₦240,000 as the total amount he originally paid.'
      - 'Next, each goat cost ₦4,000, so the number of goats is $240{,}000 \div 4{,}000$.'
      - 'And that is 60 goats.'
      - 'Option B is 45, which is $180{,}000 \div 4{,}000$ — dividing the *selling* price by the cost per goat. The 25% loss is there precisely to stop that shortcut working. So always get back to the cost price first.'
    hint: 'The ₦180,000 is the selling price, and it is 75% of what he paid. Try working back to the cost first.'

  2:
    answer: C
    steps:
      - 'Squaring a bracket with surds in it looks awkward, but the surds tidy up beautifully. Let''s expand it carefully.'
      - 'Start with the pattern. Expand using $(a + b)^{2} = a^{2} + 2ab + b^{2}$, taking $a = \sqrt{0.7}$ and $b = \sqrt{70}$.'
      - 'The two outside squares are quick. The first square undoes its root: $(\sqrt{0.7})^{2} = 0.7$. The last does the same: $(\sqrt{70})^{2} = 70$.'
      - 'Now the middle term, which is where the care goes. It is $2\sqrt{0.7} \times \sqrt{70} = 2\sqrt{0.7 \times 70}$, since roots multiply under one sign.'
      - 'And here''s the nice part: $0.7 \times 70 = 49$, and $\sqrt{49} = 7$, so the middle term is $2 \times 7 = 14$.'
      - 'Adding all three: $0.7 + 14 + 70 = 84.7$.'
      - 'Option D is 70.7 — the two squares added with the middle term forgotten. Squaring a sum is never just squaring each piece, so always look for that middle term.'
    hint: 'Expand the bracket properly, with the middle term. You''ll find the two surds multiply to a perfect square.'

  3:
    answer: A
    steps:
      - 'Don''t let all these small decimals worry you. We''ll pair them up and cancel before multiplying, and it becomes much calmer.'
      - 'Here''s the plan: rather than multiplying three small decimals twice over, pair each factor on top with one below and simplify.'
      - 'First pair: $\dfrac{0.21}{0.063} = \dfrac{210}{63}$, which cancels to $\dfrac{10}{3}$.'
      - 'Second pair: $\dfrac{0.072}{0.006} = 12$.'
      - 'Third pair: $\dfrac{0.0054}{1.68} = \dfrac{54}{16800}$, which is $0.003214\ldots$'
      - 'Now bring them together. Multiplying: $\dfrac{10}{3} \times 12 = 40$, and $40 \times 0.003214\ldots = 0.12857\ldots$'
      - 'Last, the rounding. To four significant figures that is $0.1286$ — the fifth digit is 7, so the fourth rounds up from 5 to 6.'
      - 'Options C and D are the same digits ten times smaller. Keeping track of the decimal places is most of this question, which is why pairing the factors first is worth the effort. You''ve got a tidy method for these now.'
    hint: 'Try pairing each factor on the top with one on the bottom and cancel before multiplying. Then count significant figures from the first non-zero digit.'

  4:
    answer: B
    steps:
      - 'This is a two-set problem, and the whole thing turns on finding the overlap. Let''s set it up together.'
      - 'Start with what the total tells us. 220 students offer at least one subject, so the union of the two sets is 220.'
      - 'Now bring in the formula: $n(B \cup M) = n(B) + n(M) - n(B \cap M)$.'
      - 'Substituting: $220 = 125 + 110 - n(B \cap M)$.'
      - 'So $n(B \cap M) = 235 - 220 = 15$ students offer both.'
      - 'Watch the wording now. Biology *but not* Mathematics means the Biology total with the overlap removed: $125 - 15 = 110$.'
      - 'Option A is 125, the full Biology figure. The phrase ''but not Mathematics'' is what takes the 15 off it. So find the overlap first, and the rest follows.'
    hint: 'Find how many offer both subjects first, then take that away from the Biology total.'

  5:
    answer: C
    steps:
      - 'Here we have a chain of subtractions with decimals. The safest route is to gather everything we are taking away, then subtract once.'
      - 'That''s the idea: this is a chain of subtractions, so work left to right — or, more safely, add up everything being taken away first.'
      - 'The amounts subtracted are $5.7$, $3.45$ and $1.75$.'
      - 'Adding them: $5.7 + 3.45 = 9.15$, and $9.15 + 1.75 = 10.9$.'
      - 'Now subtract once: $52.4 - 10.9$.'
      - 'That gives $41.5$.'
      - 'Lining up the decimal points matters here — $5.7$ is $5.70$, and treating it as $5.07$ or adding the digits unaligned is where the near-miss options come from. Line up the points and you''ll be fine.'
    hint: 'Add up all three numbers being subtracted first, then take that total away in one step.'

  6:
    answer: C
    steps:
      - 'This one mixes three kinds of index at once. We''ll take each factor on its own and then watch them cancel.'
      - 'The plan: take each factor separately, turning every index into something concrete before multiplying.'
      - 'First, $(343)^{\frac{1}{3}}$ is the cube root of 343. Since $7^{3} = 343$, this is 7.'
      - 'Next, $(0.14)^{-1}$ is the reciprocal of $0.14$, which is $\dfrac{1}{0.14} = \dfrac{100}{14} = \dfrac{50}{7}$.'
      - 'And $(25)^{-\frac{1}{2}}$ is one over the square root of 25, which is $\dfrac{1}{5}$.'
      - 'Now multiply, and look how neatly it goes: $7 \times \dfrac{50}{7} = 50$ — the sevens cancel.'
      - 'Then $50 \times \dfrac{1}{5} = 10$.'
      - 'Remember, a negative index means a reciprocal, and a fractional index means a root. This question puts all three kinds together, and the cancelling 7s are the sign you have read them correctly. That''s a good check to carry with you.'
    hint: 'A fractional index is a root and a negative index is a reciprocal. Work out each of the three factors on its own first.'

  7:
    answer: C
    steps:
      - 'The shaded ring is just one circle with another taken out of it. Let''s find both areas and subtract.'
      - 'Here''s the key idea: the shaded portion is the ring between the two circles, so its area is the big circle minus the small one.'
      - 'The big circle has area $\pi R^{2}$.'
      - 'Now the small circle. It has radius $r = \tfrac{2}{5}R$, so its area is $\pi r^{2} = \pi\left(\tfrac{2}{5}R\right)^{2}$.'
      - 'Watch this part carefully. Squaring the fraction means squaring top and bottom: $\left(\tfrac{2}{5}\right)^{2} = \tfrac{4}{25}$, so the small circle is $\tfrac{4}{25}\pi R^{2}$.'
      - 'Now subtract: $\pi R^{2} - \tfrac{4}{25}\pi R^{2} = \left(1 - \tfrac{4}{25}\right)\pi R^{2}$.'
      - 'And $1 - \tfrac{4}{25} = \tfrac{21}{25}$, so the shaded area is $\tfrac{21}{25}\pi R^{2}$.'
      - 'Option A is $\tfrac{9}{25}\pi R^{2}$, which comes from squaring $\tfrac{2}{5}$ as $\tfrac{3}{5}$ or subtracting the wrong way. Squaring the ratio — not just using it — is the step that matters. Square the ratio for areas, every time.'
    hint: 'Take the small circle''s area from the big one. Remember to square the ratio $\tfrac{2}{5}$ when you square the radius.'

  8:
    answer: D
    steps:
      - 'Perpendicular lines come down to one fact about gradients. Let''s find both gradients and use it.'
      - 'The fact is this: perpendicular lines have gradients whose product is $-1$.'
      - 'Start with the first line in $y = mx + c$ form: $2y = kx - 4$, so $y = \tfrac{k}{2}x - 2$. Its gradient is $\tfrac{k}{2}$.'
      - 'Next, the second: $y = -\tfrac{1}{4}x + 7$. Its gradient is $-\tfrac{1}{4}$.'
      - 'Now set the product to $-1$ — $\tfrac{k}{2} \times -\tfrac{1}{4} = -1$.'
      - 'The left side is $-\tfrac{k}{8}$, so $-\tfrac{k}{8} = -1$.'
      - 'Multiplying both sides by $-8$ — $k = 8$.'
      - 'Option A is $-8$, which is what you get by making the product of the gradients $+1$ instead of $-1$ — the sign is the whole difference. So remember: parallel means equal, perpendicular means multiply to minus one.'
    hint: 'Put both lines into $y = mx + c$ form. For perpendicular lines the two gradients multiply to $-1$ — they aren''t equal.'

  9:
    answer: B
    steps:
      - 'A bucket is wider at the top than the bottom, so it isn''t a cylinder. Let''s use the right formula for its shape.'
      - 'First, name the shape. A bucket with different diameters top and bottom is a frustum — a cone with its tip cut off — so use the frustum volume formula.'
      - 'Next, the measurements. The radii are half the diameters: $R = 6$ cm at the top and $r = 4$ cm at the bottom, with height $h = 4$ cm.'
      - 'The formula is $V = \tfrac{\pi h}{3}\left(R^{2} + Rr + r^{2}\right)$.'
      - 'Work out the bracket piece by piece: $R^{2} = 36$, $Rr = 6 \times 4 = 24$, and $r^{2} = 16$.'
      - 'Adding: $36 + 24 + 16 = 76$.'
      - 'So $V = \dfrac{\pi \times 4}{3} \times 76 = \dfrac{304\pi}{3}\ \text{cm}^{3}$.'
      - 'Treating the bucket as a cylinder of radius 6 gives $144\pi$, which is option A. The sloping side is the whole reason the frustum formula exists — a bucket is not a tin. Spot the shape first, and the formula follows.'
    hint: 'The bucket is a frustum, not a cylinder. Use $V = \tfrac{\pi h}{3}(R^{2} + Rr + r^{2})$ with the radii, not the diameters.'

  10:
    answer: B
    steps:
      - 'Here the whole question turns on one fact about circles. Once we use it, it''s just Pythagoras and an area.'
      - 'The fact: $XZ$ is a diameter, and the angle in a semicircle is a right angle — so the angle at $Y$ is $90^{\circ}$ and triangle $XYZ$ is right-angled.'
      - 'Now the lengths. The radius is $\tfrac{15}{2}$ cm, so the diameter $XZ$ is 15 cm. That is the hypotenuse.'
      - 'One other side is given: $XY = 12$ cm. Let''s find $YZ$ by Pythagoras.'
      - '$YZ^{2} = 15^{2} - 12^{2} = 225 - 144 = 81$, so $YZ = 9$ cm.'
      - 'For the area, remember that in a right-angled triangle the two shorter sides are the base and height, so the area is $\tfrac{1}{2} \times 12 \times 9$.'
      - 'That is $54\ \text{cm}^{2}$.'
      - 'Using the diameter as a side gives $\tfrac{1}{2} \times 15 \times 12 = 90$, which is not offered — but option A, 75, comes from a similar mix-up. Only the two sides meeting at the right angle can be base and height. Keep that in mind and these become routine.'
    hint: 'The angle in a semicircle is $90^{\circ}$. Find the third side by Pythagoras, then use the two shorter sides as base and height.'

  11:
    answer: D
    steps:
      - 'This question has two small jobs: find where the line meets each axis, then find the point halfway between. Let''s do them in turn.'
      - 'Remember that intercepts are where the line meets the axes, so find each by setting the other variable to zero.'
      - 'For the $x$-intercept put $y = 0$ — $0 = 4x - 8$, so $x = 2$. The point is $(2, 0)$.'
      - 'For the $y$-intercept put $x = 0$ — $2y = -8$, so $y = -4$. The point is $(0, -4)$.'
      - 'Now take the midpoint of those two points.'
      - 'The $x$ coordinate is $\dfrac{2 + 0}{2} = 1$, and the $y$ coordinate is $\dfrac{0 + (-4)}{2} = -2$.'
      - 'So the midpoint is $(1, -2)$.'
      - 'Option C is $(2, 0)$ — one of the intercepts rather than the midpoint of both. And note the equation is $2y = 4x - 8$, so dividing by 2 first gives $y = 2x - 4$; reading $-8$ as the $y$-intercept without dividing is the other slip here. Take it one small job at a time and it works out.'
    hint: 'Find where the line crosses each axis by setting the other variable to zero, then average the two points.'

  12:
    answer: C
    steps:
      - 'Two words decide this one: ''major'' and ''diameter''. Let''s read both carefully and then use the sector formula.'
      - 'Picture the chord first. It cuts the circle into two sectors: a minor one of $120^{\circ}$ and a major one that is the rest of the turn.'
      - 'So the major sector''s angle is $360^{\circ} - 120^{\circ} = 240^{\circ}$. Reading the word ''major'' is the first half of this question.'
      - 'Next, the radius. The diameter is $4\sqrt{3}$, so the radius is $2\sqrt{3}$.'
      - 'Squaring that: $r^{2} = (2\sqrt{3})^{2} = 4 \times 3 = 12$.'
      - 'Now the sector area is $\dfrac{\theta}{360} \times \pi r^{2} = \dfrac{240}{360} \times \pi \times 12$.'
      - 'And $\dfrac{240}{360} = \dfrac{2}{3}$, and $\dfrac{2}{3} \times 12 = 8$, so the area is $8\pi\ \text{cm}^{2}$.'
      - 'Using $120^{\circ}$ gives $4\pi$ — the minor sector, offered as option D. And forgetting to halve the diameter would quadruple everything. Read those two words carefully and you have it.'
    hint: 'The major sector is the larger one, so its angle is $360^{\circ}$ minus the one given. Halve the diameter before squaring.'

  13:
    answer: A
    steps:
      - 'When you''re given one trig ratio and asked for others, draw the triangle. Let''s build it from the tangent.'
      - 'A tangent of $\tfrac{4}{3}$ means a right-angled triangle with opposite 4 and adjacent 3 — so sketch that triangle and find its hypotenuse.'
      - 'By Pythagoras the hypotenuse is $\sqrt{4^{2} + 3^{2}} = \sqrt{16 + 9} = \sqrt{25} = 5$. This is the familiar 3-4-5 triangle.'
      - 'Now read off the ratios. So $\sin\theta = \dfrac{\text{opposite}}{\text{hypotenuse}} = \dfrac{4}{5}$ and $\cos\theta = \dfrac{\text{adjacent}}{\text{hypotenuse}} = \dfrac{3}{5}$.'
      - 'Next, square each: $\sin^{2}\theta = \dfrac{16}{25}$ and $\cos^{2}\theta = \dfrac{9}{25}$.'
      - 'Then subtract: $\dfrac{16}{25} - \dfrac{9}{25} = \dfrac{7}{25}$.'
      - 'Option C is $\tfrac{16}{25}$, which is $\sin^{2}\theta$ alone. And note $\sin^{2}\theta + \cos^{2}\theta$ would be 1 — a useful check that the two fractions are right before subtracting. Draw the triangle, and these ratio questions open right up.'
    hint: 'Build the right-angled triangle from the tangent, find the hypotenuse, then read off sine and cosine before squaring.'

  14:
    answer: C
    steps:
      - 'This figure looks busy, but it''s just two isosceles triangles working together. Let''s follow the angle $x$ through them.'
      - 'Two isosceles triangles sit side by side here, and the trick is to carry the angle $x$ through both of them.'
      - 'Start with triangle $PQS$. Since $PQ = QS$, the angles opposite those equal sides are equal: $\angle QPS = \angle QSP = x$.'
      - 'Here''s the link: an exterior angle of a triangle equals the sum of the two interior opposite angles, so $\angle RQS$, exterior at $Q$, is $x + x = 2x$.'
      - 'Now triangle $QSR$ has $QS = RS$, so it too is isosceles, giving $\angle SQR = \angle SRQ = 2x$.'
      - 'Its third angle follows from the angle sum: $\angle QSR = 180 - 2x - 2x = 180 - 4x$.'
      - 'Finally, $P$, $S$ and $T$ are on a straight line, so the three angles at $S$ add to $180^{\circ}$ — $x + (180 - 4x) + 72 = 180$.'
      - 'Simplifying: $-3x + 72 = 0$, so $x = 24^{\circ}$.'
      - 'Let''s check it: the angles at $S$ are $24$, $84$ and $72$, which total $180$ ✓. The exterior-angle step is what links the two triangles — without it, $x$ never reaches the second one. That''s the move to remember.'
    hint: 'Use the equal sides to mark equal angles, then the exterior angle of the first triangle to carry $x$ into the second. Finish with the angles on the straight line at $S$.'

  15:
    answer: D
    steps:
      - 'Locus questions are about picturing every point that fits a rule. Let''s find all the points the same distance from $S$ and $T$.'
      - 'Start with the meaning. A locus is every point satisfying a condition, so ask which points are the same distance from $S$ as from $T$.'
      - 'The midpoint of $ST$ obviously qualifies, but it is not the only such point.'
      - 'Now think a little wider. Any point directly ''above'' that midpoint, at right angles to $ST$, is also equidistant — the two slanted distances are mirror images.'
      - 'Collecting all of them gives a line through the midpoint of $ST$ and at right angles to it.'
      - 'That line is called the perpendicular bisector of $ST$ — ''bisector'' because it cuts $ST$ in half, ''perpendicular'' because it meets it at $90^{\circ}$.'
      - 'Option A says only ''a perpendicular to $ST$'', which leaves out the crucial part: there are infinitely many perpendiculars to $ST$, and only the one through the midpoint is the locus. Both halves of the name matter.'
    hint: 'Think about the midpoint of $ST$, then about the points directly above and below it. Both parts of the name matter.'

  16:
    answer: A
    steps:
      - 'The word ''total'' is doing a lot of work in this question. Let''s count every surface of the hemisphere.'
      - 'Here''s what it means: ''total'' surface area of a solid hemisphere means the curved part *and* the flat circular face that closes it.'
      - 'The curved part is half a sphere''s surface: $\tfrac{1}{2} \times 4\pi r^{2} = 2\pi r^{2}$.'
      - 'The flat face is a circle of the same radius: $\pi r^{2}$.'
      - 'Adding them gives $3\pi r^{2}$ — worth remembering as the total surface of a solid hemisphere.'
      - 'Now put in the numbers. With $r = 7$, which gives $3 \times \dfrac{22}{7} \times 49$.'
      - 'The 7 cancels into the 49 seven times, leaving $3 \times 22 \times 7 = 462\ \text{cm}^{2}$.'
      - 'Option C is $308\ \text{cm}^{2}$, which is $2\pi r^{2}$ — the curved surface with the flat face forgotten. The word ''total'' is the whole difference. Count every face, and you''re there.'
    hint: 'A solid hemisphere has a curved surface and a flat circular base. Add both — the total comes to $3\pi r^{2}$.'

  17:
    answer: A
    steps:
      - 'To name a triangle, we need all three of its inside angles. One of them is hiding outside, so let''s bring it in.'
      - 'That''s the plan: to classify a triangle you need all three of its angles, so start by turning the exterior angle into an interior one.'
      - 'The $128^{\circ}$ marked at $P$ lies outside the triangle, and angles on a straight line add to $180^{\circ}$.'
      - 'So the interior angle at $P$ is $180 - 128 = 52^{\circ}$.'
      - 'The angle at $Q$ is given as $50^{\circ}$.'
      - 'Now the third angle follows from the angle sum: $\angle R = 180 - 52 - 50 = 78^{\circ}$.'
      - 'Look at the three together: $52^{\circ}$, $50^{\circ}$ and $78^{\circ}$ — all different, so no two sides are equal and the triangle is scalene.'
      - 'Option D, obtuse-angled, is tempting because $128^{\circ}$ is obtuse — but that angle is outside the triangle. Every interior angle here is under $90^{\circ}$, so the triangle is acute as well as scalene. Always work with the angles inside.'
    hint: 'The $128^{\circ}$ is outside the triangle. Convert it to the interior angle first, then find the third angle and compare all three.'

  18:
    answer: B
    steps:
      - 'This is a polygon angle-sum question with one small twist in the units. Let''s sort that out first.'
      - 'First convert the given sum into degrees: a right angle is $90^{\circ}$, so 20 right angles is $20 \times 90 = 1800^{\circ}$.'
      - 'Now the formula. The interior angles of a polygon with $n$ sides add to $(n - 2) \times 180^{\circ}$.'
      - 'So $(n - 2) \times 180 = 1800$.'
      - 'Divide both sides by 180: $n - 2 = 10$.'
      - 'Therefore $n = 12$.'
      - 'Option A is 10, which is $n - 2$ — the answer one step early. And leaving the sum as 20 instead of converting to $1800^{\circ}$ makes the equation unsolvable, which is the first thing to check if the arithmetic looks strange. Finish the last step, and you''ve got it.'
    hint: 'Turn the 20 right angles into degrees first, then use the interior angle sum formula — and remember to add the 2 back at the end.'

  19:
    answer: D
    steps:
      - 'A quick sketch helps a lot here. Let''s picture the two lines and find the one exactly between them.'
      - 'Notice first that both given lines are vertical — $x = 1$ and $x = 7$ are lines of constant $x$ — so the points equidistant from them also form a vertical line.'
      - 'That rules out options A and B immediately, since $y = $ constant describes a horizontal line.'
      - 'Now, a point is equidistant from the two lines when it sits exactly halfway between them.'
      - 'Halfway between $x = 1$ and $x = 7$ is $\dfrac{1 + 7}{2} = 4$.'
      - 'So the locus is the line $x = 4$.'
      - 'Option C is $x = 3$, which is 3 units from the first line — the halfway *distance* rather than the halfway *position*. The gap is 6, so the midline is 3 units along from $x = 1$, at $x = 4$. Averaging the two positions keeps you safe.'
    hint: 'Both lines are vertical, so the answer is too. Find the value of $x$ exactly halfway between 1 and 7.'

  20:
    answer: B
    steps:
      - 'This solid is two familiar shapes stuck together. We''ll find each volume and add them — but watch the height.'
      - 'The solid is made of two pieces — a cylinder and a hemisphere on top — so work out each volume and add them.'
      - 'Start with the measurements. The radius is 3 cm for both parts. The 23 cm on the figure spans the whole solid, and the hemisphere accounts for 3 cm of it (its radius), so the cylindrical part is $23 - 3 = 20$ cm tall.'
      - 'Now the cylinder: volume is $\pi r^{2}h = \pi \times 3^{2} \times 20 = \pi \times 9 \times 20 = 180\pi\ \text{cm}^{3}$.'
      - 'Next, the hemisphere. It is half a sphere, so its volume is $\tfrac{1}{2} \times \tfrac{4}{3}\pi r^{3} = \tfrac{2}{3}\pi r^{3}$.'
      - 'With $r = 3$ — $r^{3} = 27$, so the hemisphere is $\tfrac{2}{3}\pi \times 27 = 18\pi\ \text{cm}^{3}$.'
      - 'Adding the two: $180\pi + 18\pi = 198\pi\ \text{cm}^{3}$.'
      - 'Option C is $180\pi$ — the cylinder alone, with the bowl on top forgotten. And taking the cylinder as the full 23 cm would give $207\pi + 18\pi$, which is no option at all: a useful signal that the height needs splitting. Split the solid, and each part is familiar.'
    hint: 'Split the solid into a cylinder and a hemisphere. The height marked covers both, so take the hemisphere''s radius off before using the cylinder formula.'

  21:
    answer: D
    steps:
      - 'Angle of elevation questions often hide one extra height. Let''s find it and make sure it goes back in at the end.'
      - 'Here''s the key: the hunter''s eyes are 1.6 m above the ground, so the angle of elevation is measured from *that* height, not from the ground. That is the whole question.'
      - 'From the hunter''s eye level, the horizontal distance to the tree is 10.4 m and the angle up to the bird is $45^{\circ}$.'
      - 'In that right-angled triangle, $\tan 45^{\circ} = \dfrac{\text{height above eye level}}{10.4}$.'
      - 'Since $\tan 45^{\circ} = 1$, the height above eye level equals the horizontal distance: 10.4 m.'
      - 'But careful — that is the height above the hunter''s eyes, not above the ground.'
      - 'So add his own height back: $10.4 + 1.6 = 12.0$ m.'
      - 'Option C is 10.4 m — the answer that forgets the hunter is not lying on the ground. Whenever an observer''s height is given, it is given because it has to be added. That''s the habit to keep.'
    hint: 'The $45^{\circ}$ is measured from the hunter''s eyes. Find the height above eye level first, then add his own height.'

  22:
    answer: A
    steps:
      - 'Whenever means are being compared, it helps to go back to totals. Let''s do exactly that.'
      - 'The idea: a mean is a total divided by a count, so turn both means back into totals before doing anything else.'
      - 'Six numbers with mean 60 have a total of $6 \times 60 = 360$.'
      - 'The first five with mean 50 have a total of $5 \times 50 = 250$.'
      - 'Now, the sixth number is whatever is left when the five are taken from the six.'
      - 'So it is $360 - 250 = 110$.'
      - 'Option C is 100, which comes from subtracting the means ($60 - 50 = 10$) and scaling somehow. Means cannot be subtracted like that — only the totals can. Turn means into totals and you''ll get these every time.'
    hint: 'Turn each mean into a total by multiplying by how many numbers it covers, then subtract one total from the other.'

  23:
    answer: D
    steps:
      - 'That letter $k$ looks like a problem, but it''s going to disappear. Let''s see why.'
      - 'Remember, the range is the largest value minus the smallest, and every term here is $k$ plus or minus something — so the $k$ will cancel.'
      - 'Look at the amounts added or taken away: $+2, -3, +4, -2, 0, -5, +3, -1, +6$.'
      - 'The largest of those is $+6$, so the largest term is $k + 6$.'
      - 'The smallest is $-5$, so the smallest term is $k - 5$.'
      - 'Now the range is $(k + 6) - (k - 5)$.'
      - 'The $k$ terms cancel and subtracting a negative adds: $6 + 5 = 11$.'
      - 'The slip to avoid is $6 - 5 = 1$ — taking away the minus five must add five. This is why the range is useful: it does not depend on where the data sits, only on how spread out it is. Shifting every value by $k$ leaves it unchanged.'
    hint: 'Every term is $k$ plus or minus a number. Find the biggest and smallest of those numbers — the $k$ will cancel.'

  24:
    answer: C
    steps:
      - 'There are two parts here: find $x$ from the total, then read the question''s ''at least'' carefully. Let''s start with the total.'
      - 'The frequencies in the table must account for all 260 students, so that sum is the equation to start from.'
      - 'Adding the entries: $20 + x + 50 + 40 + 2x + 60$.'
      - 'Collect the plain numbers: $20 + 50 + 40 + 60 = 170$. And the unknowns: $x + 2x = 3x$.'
