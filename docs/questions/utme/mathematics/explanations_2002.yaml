# UTME 2002 Mathematics — worked explanations, written against the paper.
#
# Keyed on question number; see explanations_2003.yaml for why, and for how these are written.
#
# All 50 are answered. Where a question carries a diagram, the figure is still marked for
# display — a student should see what the examiner drew — but in every case this year the
# printed text carries enough to reach the answer, so none is left pending.
#
# Checked against keys_2002.yaml, which covers 39. They agree throughout. Eleven answers are
# new: Q7, 10, 13, 14, 17, 20, 24, 25, 32, 40 and 45.
format_version: 1
exam_year: 2002
subject: MATH

explanations:
  1:
    answer: D
    steps:
      - "A loss of 25% means the selling price is 75% of what the goats cost — so the ₦180,000 is not the cost, it is three quarters of it."
      - "If $0.75 \\times \\text{cost} = 180{,}000$, then the cost is $180{,}000 \\div 0.75$."
      - "That gives ₦240,000 as the total amount he originally paid."
      - "Each goat cost ₦4,000, so the number of goats is $240{,}000 \\div 4{,}000$."
      - "That is 60 goats."
      - "Option B is 45, which is $180{,}000 \\div 4{,}000$ — dividing the *selling* price by the cost per goat. The 25% loss is there precisely to stop that shortcut working."
    hint: "The ₦180,000 is the selling price, and it is 75% of what he paid. Work back to the cost first."

  2:
    answer: C
    steps:
      - "Expand using $(a + b)^{2} = a^{2} + 2ab + b^{2}$, taking $a = \\sqrt{0.7}$ and $b = \\sqrt{70}$."
      - "The first square undoes its root: $(\\sqrt{0.7})^{2} = 0.7$. The last does the same: $(\\sqrt{70})^{2} = 70$."
      - "The middle term is $2\\sqrt{0.7} \\times \\sqrt{70} = 2\\sqrt{0.7 \\times 70}$, since roots multiply under one sign."
      - "$0.7 \\times 70 = 49$, and $\\sqrt{49} = 7$, so the middle term is $2 \\times 7 = 14$."
      - "Adding all three: $0.7 + 14 + 70 = 84.7$."
      - "Option D is 70.7 — the two squares added with the middle term forgotten. Squaring a sum is never just squaring each piece."
    hint: "Expand the bracket properly with the middle term. The two surds multiply to a perfect square."

  3:
    answer: A
    steps:
      - "Rather than multiplying three small decimals twice over, pair each factor on top with one below and simplify."
      - "$\\dfrac{0.21}{0.063} = \\dfrac{210}{63}$, which cancels to $\\dfrac{10}{3}$."
      - "$\\dfrac{0.072}{0.006} = 12$."
      - "$\\dfrac{0.0054}{1.68} = \\dfrac{54}{16800}$, which is $0.003214\\ldots$"
      - "Multiplying: $\\dfrac{10}{3} \\times 12 = 40$, and $40 \\times 0.003214\\ldots = 0.12857\\ldots$"
      - "To four significant figures that is $0.1286$ — the fifth digit is 7, so the fourth rounds up from 5 to 6."
      - "Options C and D are the same digits ten times smaller. Keeping track of the decimal places is most of this question, which is why pairing the factors first is worth the effort."
    hint: "Pair each factor on the top with one on the bottom and cancel before multiplying. Then count significant figures from the first non-zero digit."

  4:
    answer: B
    steps:
      - "220 students offer at least one subject, so the union of the two sets is 220."
      - "Use $n(B \\cup M) = n(B) + n(M) - n(B \\cap M)$."
      - "Substituting: $220 = 125 + 110 - n(B \\cap M)$."
      - "So $n(B \\cap M) = 235 - 220 = 15$ students offer both."
      - "Biology *but not* Mathematics means the Biology total with the overlap removed: $125 - 15 = 110$."
      - "Option A is 125, the full Biology figure. The phrase 'but not Mathematics' is what takes the 15 off it."
    hint: "Find how many offer both subjects first, then take that away from the Biology total."

  5:
    answer: C
    steps:
      - "This is a chain of subtractions, so work left to right — or, more safely, add up everything being taken away first."
      - "The amounts subtracted are $5.7$, $3.45$ and $1.75$."
      - "Adding them: $5.7 + 3.45 = 9.15$, and $9.15 + 1.75 = 10.9$."
      - "Now subtract once: $52.4 - 10.9$."
      - "That gives $41.5$."
      - "Lining up the decimal points matters here — $5.7$ is $5.70$, and treating it as $5.07$ or adding the digits unaligned is where the near-miss options come from."
    hint: "Add up all three numbers being subtracted first, then take that total away in one step."

  6:
    answer: C
    steps:
      - "Take each factor separately, turning every index into something concrete before multiplying."
      - "$(343)^{\\frac{1}{3}}$ is the cube root of 343. Since $7^{3} = 343$, this is 7."
      - "$(0.14)^{-1}$ is the reciprocal of $0.14$, which is $\\dfrac{1}{0.14} = \\dfrac{100}{14} = \\dfrac{50}{7}$."
      - "$(25)^{-\\frac{1}{2}}$ is one over the square root of 25, which is $\\dfrac{1}{5}$."
      - "Now multiply: $7 \\times \\dfrac{50}{7} = 50$ — the sevens cancel."
      - "Then $50 \\times \\dfrac{1}{5} = 10$."
      - "A negative index means a reciprocal, and a fractional index means a root. This question puts all three kinds together, and the cancelling 7s are the sign you have read them correctly."
    hint: "A fractional index is a root and a negative index is a reciprocal. Work out each of the three factors on its own first."

  7:
    answer: C
    steps:
      - "The shaded portion is the ring between the two circles, so its area is the big circle minus the small one."
      - "The big circle has area $\\pi R^{2}$."
      - "The small circle has radius $r = \\tfrac{2}{5}R$, so its area is $\\pi r^{2} = \\pi\\left(\\tfrac{2}{5}R\\right)^{2}$."
      - "Squaring the fraction means squaring top and bottom: $\\left(\\tfrac{2}{5}\\right)^{2} = \\tfrac{4}{25}$, so the small circle is $\\tfrac{4}{25}\\pi R^{2}$."
      - "Subtracting: $\\pi R^{2} - \\tfrac{4}{25}\\pi R^{2} = \\left(1 - \\tfrac{4}{25}\\right)\\pi R^{2}$."
      - "$1 - \\tfrac{4}{25} = \\tfrac{21}{25}$, so the shaded area is $\\tfrac{21}{25}\\pi R^{2}$."
      - "Option A is $\\tfrac{9}{25}\\pi R^{2}$, which comes from squaring $\\tfrac{2}{5}$ as $\\tfrac{3}{5}$ or subtracting the wrong way. Squaring the ratio — not just using it — is the step that matters."
    hint: "Take the small circle's area from the big one. Remember to square the ratio $\\tfrac{2}{5}$ when you square the radius."

  8:
    answer: D
    steps:
      - "Perpendicular lines have gradients whose product is $-1$, so find both gradients and set that product up."
      - "Rearrange the first line into $y = mx + c$ form: $2y = kx - 4$, so $y = \\tfrac{k}{2}x - 2$. Its gradient is $\\tfrac{k}{2}$."
      - "Rearrange the second: $y = -\\tfrac{1}{4}x + 7$. Its gradient is $-\\tfrac{1}{4}$."
      - "Now set the product to $-1$: $\\tfrac{k}{2} \\times -\\tfrac{1}{4} = -1$."
      - "The left side is $-\\tfrac{k}{8}$, so $-\\tfrac{k}{8} = -1$."
      - "Multiplying both sides by $-8$: $k = 8$."
      - "Option A is $-8$, which is what you get by setting the gradients *equal* — the condition for parallel lines rather than perpendicular ones."
    hint: "Put both lines into $y = mx + c$ form. For perpendicular lines the two gradients multiply to $-1$, not to each other."

  9:
    answer: B
    steps:
      - "A bucket with different diameters top and bottom is a frustum — a cone with its tip cut off — so use the frustum volume formula."
      - "The radii are half the diameters: $R = 6$ cm at the top and $r = 4$ cm at the bottom, with height $h = 4$ cm."
      - "The formula is $V = \\tfrac{\\pi h}{3}\\left(R^{2} + Rr + r^{2}\\right)$."
      - "Work out the bracket: $R^{2} = 36$, $Rr = 6 \\times 4 = 24$, and $r^{2} = 16$."
      - "Adding: $36 + 24 + 16 = 76$."
      - "So $V = \\dfrac{\\pi \\times 4}{3} \\times 76 = \\dfrac{304\\pi}{3}\\ \\text{cm}^{3}$."
      - "Treating the bucket as a cylinder of radius 6 gives $144\\pi$, which is option A. The sloping side is the whole reason the frustum formula exists — a bucket is not a tin."
    hint: "The bucket is a frustum, not a cylinder. Use $V = \\tfrac{\\pi h}{3}(R^{2} + Rr + r^{2})$ with the radii, not the diameters."

  10:
    answer: B
    steps:
      - "$XZ$ is a diameter, and the angle in a semicircle is a right angle — so the angle at $Y$ is $90^{\\circ}$ and triangle $XYZ$ is right-angled."
      - "The radius is $\\tfrac{15}{2}$ cm, so the diameter $XZ$ is 15 cm. That is the hypotenuse."
      - "One other side is given: $XY = 12$ cm. Find $YZ$ by Pythagoras."
      - "$YZ^{2} = 15^{2} - 12^{2} = 225 - 144 = 81$, so $YZ = 9$ cm."
      - "In a right-angled triangle the two shorter sides are the base and height, so the area is $\\tfrac{1}{2} \\times 12 \\times 9$."
      - "That is $54\\ \\text{cm}^{2}$."
      - "Using the diameter as a side gives $\\tfrac{1}{2} \\times 15 \\times 12 = 90$, which is not offered — but option A, 75, comes from a similar mix-up. Only the two sides meeting at the right angle can be base and height."
    hint: "The angle in a semicircle is $90^{\\circ}$. Find the third side by Pythagoras, then use the two shorter sides as base and height."

  11:
    answer: D
    steps:
      - "Intercepts are where the line meets the axes, so find each by setting the other variable to zero."
      - "For the $x$-intercept put $y = 0$: $0 = 4x - 8$, so $x = 2$. The point is $(2, 0)$."
      - "For the $y$-intercept put $x = 0$: $2y = -8$, so $y = -4$. The point is $(0, -4)$."
      - "Now take the midpoint of those two points."
      - "The $x$ coordinate is $\\dfrac{2 + 0}{2} = 1$, and the $y$ coordinate is $\\dfrac{0 + (-4)}{2} = -2$."
      - "So the midpoint is $(1, -2)$."
      - "Option C is $(2, 0)$ — one of the intercepts rather than the midpoint of both. And note the equation is $2y = 4x - 8$, so dividing by 2 first gives $y = 2x - 4$; reading $-8$ as the $y$-intercept without dividing is the other slip here."
    hint: "Find where the line crosses each axis by setting the other variable to zero, then average the two points."

  12:
    answer: C
    steps:
      - "The chord cuts the circle into two sectors: a minor one of $120^{\\circ}$ and a major one that is the rest of the turn."
      - "The major sector's angle is $360^{\\circ} - 120^{\\circ} = 240^{\\circ}$. Reading the word 'major' is the first half of this question."
      - "The diameter is $4\\sqrt{3}$, so the radius is $2\\sqrt{3}$."
      - "Squaring that: $r^{2} = (2\\sqrt{3})^{2} = 4 \\times 3 = 12$."
      - "Sector area is $\\dfrac{\\theta}{360} \\times \\pi r^{2} = \\dfrac{240}{360} \\times \\pi \\times 12$."
      - "$\\dfrac{240}{360} = \\dfrac{2}{3}$, and $\\dfrac{2}{3} \\times 12 = 8$, so the area is $8\\pi\\ \\text{cm}^{2}$."
      - "Using $120^{\\circ}$ gives $4\\pi$ — the minor sector, offered as option D. And forgetting to halve the diameter would quadruple everything."
    hint: "The major sector is the larger one, so its angle is $360^{\\circ}$ minus the one given. Halve the diameter before squaring."

  13:
    answer: A
    steps:
      - "A tangent of $\\tfrac{4}{3}$ means a right-angled triangle with opposite 4 and adjacent 3 — so sketch that triangle and find its hypotenuse."
      - "By Pythagoras the hypotenuse is $\\sqrt{4^{2} + 3^{2}} = \\sqrt{16 + 9} = \\sqrt{25} = 5$. This is the familiar 3-4-5 triangle."
      - "So $\\sin\\theta = \\dfrac{\\text{opposite}}{\\text{hypotenuse}} = \\dfrac{4}{5}$ and $\\cos\\theta = \\dfrac{\\text{adjacent}}{\\text{hypotenuse}} = \\dfrac{3}{5}$."
      - "Square each: $\\sin^{2}\\theta = \\dfrac{16}{25}$ and $\\cos^{2}\\theta = \\dfrac{9}{25}$."
      - "Subtract: $\\dfrac{16}{25} - \\dfrac{9}{25} = \\dfrac{7}{25}$."
      - "Option C is $\\tfrac{16}{25}$, which is $\\sin^{2}\\theta$ alone. And note $\\sin^{2}\\theta + \\cos^{2}\\theta$ would be 1 — a useful check that the two fractions are right before subtracting."
    hint: "Build the right-angled triangle from the tangent, find the hypotenuse, then read off sine and cosine before squaring."

  14:
    answer: C
    steps:
      - "Two isosceles triangles sit side by side here, and the trick is to carry the angle $x$ through both of them."
      - "In triangle $PQS$, $PQ = QS$, so the angles opposite those equal sides are equal: $\\angle QPS = \\angle QSP = x$."
      - "An exterior angle of a triangle equals the sum of the two interior opposite angles, so $\\angle RQS$, exterior at $Q$, is $x + x = 2x$."
      - "Now triangle $QSR$ has $QS = RS$, so it too is isosceles, giving $\\angle SQR = \\angle SRQ = 2x$."
      - "Its third angle follows from the angle sum: $\\angle QSR = 180 - 2x - 2x = 180 - 4x$."
      - "Finally, $P$, $S$ and $T$ are on a straight line, so the three angles at $S$ add to $180^{\\circ}$: $x + (180 - 4x) + 72 = 180$."
      - "Simplifying: $-3x + 72 = 0$, so $x = 24^{\\circ}$."
      - "Check it: the angles at $S$ are $24$, $84$ and $72$, which total $180$ ✓. The exterior-angle step is what links the two triangles — without it, $x$ never reaches the second one."
    hint: "Use the equal sides to mark equal angles, then the exterior angle of the first triangle to carry $x$ into the second. Finish with the angles on the straight line at $S$."

  15:
    answer: D
    steps:
      - "A locus is every point satisfying a condition, so ask which points are the same distance from $S$ as from $T$."
      - "The midpoint of $ST$ obviously qualifies, but it is not the only such point."
      - "Any point directly 'above' that midpoint, at right angles to $ST$, is also equidistant — the two slanted distances are mirror images."
      - "Collecting all of them gives a line through the midpoint of $ST$ and at right angles to it."
      - "That line is called the perpendicular bisector of $ST$ — 'bisector' because it cuts $ST$ in half, 'perpendicular' because it meets it at $90^{\\circ}$."
      - "Option A says only 'a perpendicular to $ST$', which leaves out the crucial part: there are infinitely many perpendiculars to $ST$, and only the one through the midpoint is the locus."
    hint: "Think about the midpoint of $ST$, then about the points directly above and below it. Both parts of the name matter."

  16:
    answer: A
    steps:
      - "'Total' surface area of a solid hemisphere means the curved part *and* the flat circular face that closes it."
      - "The curved part is half a sphere's surface: $\\tfrac{1}{2} \\times 4\\pi r^{2} = 2\\pi r^{2}$."
      - "The flat face is a circle of the same radius: $\\pi r^{2}$."
      - "Adding them gives $3\\pi r^{2}$ — worth remembering as the total surface of a solid hemisphere."
      - "With $r = 7$: $3 \\times \\dfrac{22}{7} \\times 49$."
      - "The 7 cancels into the 49 seven times, leaving $3 \\times 22 \\times 7 = 462\\ \\text{cm}^{2}$."
      - "Option C is $308\\ \\text{cm}^{2}$, which is $2\\pi r^{2}$ — the curved surface with the flat face forgotten. The word 'total' is the whole difference."
    hint: "A solid hemisphere has a curved surface and a flat circular base. Add both — the total comes to $3\\pi r^{2}$."

  17:
    answer: A
    steps:
      - "To classify a triangle you need all three of its angles, so start by turning the exterior angle into an interior one."
      - "The $128^{\\circ}$ marked at $P$ lies outside the triangle, and angles on a straight line add to $180^{\\circ}$."
      - "So the interior angle at $P$ is $180 - 128 = 52^{\\circ}$."
      - "The angle at $Q$ is given as $50^{\\circ}$."
      - "The third angle follows from the angle sum: $\\angle R = 180 - 52 - 50 = 78^{\\circ}$."
      - "The three angles are $52^{\\circ}$, $50^{\\circ}$ and $78^{\\circ}$ — all different, so no two sides are equal and the triangle is scalene."
      - "Option D, obtuse-angled, is tempting because $128^{\\circ}$ is obtuse — but that angle is outside the triangle. Every interior angle here is under $90^{\\circ}$, so the triangle is acute as well as scalene."
    hint: "The $128^{\\circ}$ is outside the triangle. Convert it to the interior angle first, then find the third angle and compare all three."

  18:
    answer: B
    steps:
      - "First convert the given sum into degrees: a right angle is $90^{\\circ}$, so 20 right angles is $20 \\times 90 = 1800^{\\circ}$."
      - "The interior angles of a polygon with $n$ sides add to $(n - 2) \\times 180^{\\circ}$."
      - "So $(n - 2) \\times 180 = 1800$."
      - "Divide both sides by 180: $n - 2 = 10$."
      - "Therefore $n = 12$."
      - "Option A is 10, which is $n - 2$ — the answer one step early. And leaving the sum as 20 instead of converting to $1800^{\\circ}$ makes the equation unsolvable, which is the first thing to check if the arithmetic looks strange."
    hint: "Turn the 20 right angles into degrees first, then use the interior angle sum formula and remember to add the 2 back at the end."

  19:
    answer: D
    steps:
      - "Both given lines are vertical — $x = 1$ and $x = 7$ are lines of constant $x$ — so the points equidistant from them also form a vertical line."
      - "That rules out options A and B immediately, since $y = $ constant describes a horizontal line."
      - "A point is equidistant from the two lines when it sits exactly halfway between them."
      - "Halfway between $x = 1$ and $x = 7$ is $\\dfrac{1 + 7}{2} = 4$."
      - "So the locus is the line $x = 4$."
      - "Option C is $x = 3$, which is 3 units from the first line — the halfway *distance* rather than the halfway *position*. The gap is 6, so the midline is 3 units along from $x = 1$, at $x = 4$."
    hint: "Both lines are vertical, so the answer is too. Find the value of $x$ exactly halfway between 1 and 7."

  20:
    answer: B
    steps:
      - "The solid is made of two pieces — a cylinder and a hemisphere on top — so work out each volume and add them."
      - "The radius is 3 cm for both parts. The 23 cm on the figure spans the whole solid, and the hemisphere accounts for 3 cm of it (its radius), so the cylindrical part is $23 - 3 = 20$ cm tall."
      - "Cylinder volume is $\\pi r^{2}h = \\pi \\times 3^{2} \\times 20 = \\pi \\times 9 \\times 20 = 180\\pi\\ \\text{cm}^{3}$."
      - "A hemisphere is half a sphere, so its volume is $\\tfrac{1}{2} \\times \\tfrac{4}{3}\\pi r^{3} = \\tfrac{2}{3}\\pi r^{3}$."
      - "With $r = 3$: $r^{3} = 27$, so the hemisphere is $\\tfrac{2}{3}\\pi \\times 27 = 18\\pi\\ \\text{cm}^{3}$."
      - "Adding the two: $180\\pi + 18\\pi = 198\\pi\\ \\text{cm}^{3}$."
      - "Option C is $180\\pi$ — the cylinder alone, with the bowl on top forgotten. And taking the cylinder as the full 23 cm would give $207\\pi + 18\\pi$, which is no option at all: a useful signal that the height needs splitting."
    hint: "Split the solid into a cylinder and a hemisphere. The height marked covers both, so take the hemisphere's radius off before using the cylinder formula."

  21:
    answer: D
    steps:
      - "The hunter's eyes are 1.6 m above the ground, so the angle of elevation is measured from *that* height, not from the ground. That is the whole question."
      - "From the hunter's eye level, the horizontal distance to the tree is 10.4 m and the angle up to the bird is $45^{\\circ}$."
      - "In that right-angled triangle, $\\tan 45^{\\circ} = \\dfrac{\\text{height above eye level}}{10.4}$."
      - "Since $\\tan 45^{\\circ} = 1$, the height above eye level equals the horizontal distance: 10.4 m."
      - "But that is the height above the hunter's eyes, not above the ground."
      - "Add his own height back: $10.4 + 1.6 = 12.0$ m."
      - "Option C is 10.4 m — the answer that forgets the hunter is not lying on the ground. Whenever an observer's height is given, it is given because it has to be added."
    hint: "The $45^{\\circ}$ is measured from the hunter's eyes. Find the height above eye level first, then add his own height."

  22:
    answer: A
    steps:
      - "A mean is a total divided by a count, so turn both means back into totals before doing anything else."
      - "Six numbers with mean 60 have a total of $6 \\times 60 = 360$."
      - "The first five with mean 50 have a total of $5 \\times 50 = 250$."
      - "The sixth number is whatever is left when the five are taken from the six."
      - "So it is $360 - 250 = 110$."
      - "Option C is 100, which comes from subtracting the means ($60 - 50 = 10$) and scaling somehow. Means cannot be subtracted like that — only the totals can."
    hint: "Turn each mean into a total by multiplying by how many numbers it covers, then subtract one total from the other."

  23:
    answer: D
    steps:
      - "The range is the largest value minus the smallest, and every term here is $k$ plus or minus something — so the $k$ will cancel."
      - "Look at the amounts added or taken away: $+2, -3, +4, -2, 0, -5, +3, -1, +6$."
      - "The largest of those is $+6$, so the largest term is $k + 6$."
      - "The smallest is $-5$, so the smallest term is $k - 5$."
      - "The range is $(k + 6) - (k - 5)$."
      - "The $k$ terms cancel and subtracting a negative adds: $6 + 5 = 11$."
      - "This is why the range is useful — it does not depend on where the data sits, only on how spread out it is. Shifting every value by $k$ leaves it unchanged."
    hint: "Every term is $k$ plus or minus a number. Find the biggest and smallest of those numbers — the $k$ will cancel."

  24:
    answer: C
    steps:
      - "The frequencies in the table must account for all 260 students, so that sum is the equation to start from."
      - "Adding the entries: $20 + x + 50 + 40 + 2x + 60$."
      - "Collect the plain numbers: $20 + 50 + 40 + 60 = 170$. And the unknowns: $x + 2x = 3x$."
      - "So $170 + 3x = 260$, giving $3x = 90$ and $x = 30$."
      - "Now read what is asked: 'at least four days' means four, five *or* six days — three columns, not one."
      - "Those frequencies are $40$, $2x = 60$, and $60$."
      - "Adding: $40 + 60 + 60 = 160$ students."
      - "Option A is 40 — the four-day column alone. 'At least' always means that value and everything beyond it."
    hint: "Use the total of 260 to find $x$ first. Then remember 'at least four days' includes the five- and six-day columns too."

  25:
    answer: B
    steps:
      - "Every student falls into exactly one of four groups: Music only, both subjects, History only, or neither. Those four must add to 80."
      - "From the diagram those groups are $30 - x$, $x$, $40 - x$ and 20."
      - "So $(30 - x) + x + (40 - x) + 20 = 80$."
      - "Simplify the left side: the $-x$ and $+x$ cancel, leaving $30 + 40 - x + 20 = 90 - x$."
      - "So $90 - x = 80$, giving $x = 10$ students taking both subjects."
      - "Music *only* is therefore $30 - 10 = 20$ students."
      - "The probability is that count over the whole class: $\\dfrac{20}{80} = 0.25$."
      - "Option D is 0.50, which is $\\dfrac{40}{80}$ — using the 40 from the History side, or using the whole Music circle rather than the 'only' part. The word 'only' means the overlap is excluded."
    hint: "All four regions must add to 80 — do not forget the 20 outside both circles. Solve for $x$, then read off Music only."

  26:
    answer: B
    steps:
      - "The mean is the total divided by how many values there are, so add carefully — the negatives are the whole difficulty."
      - "Running through them: $7 - 3 = 4$; $4 + 4 = 8$; $8 - 2 = 6$; $6 + 5 = 11$; $11 - 9 = 2$."
      - "Continuing: $2 + 4 = 6$; $6 + 8 = 14$; $14 - 6 = 8$; $8 + 12 = 20$."
      - "So the ten values total 20."
      - "The mean is $\\dfrac{20}{10} = 2$."
      - "A useful check: the positives are $7 + 4 + 5 + 4 + 8 + 12 = 40$ and the negatives are $3 + 2 + 9 + 6 = 20$, so the total is $40 - 20 = 20$ ✓. Grouping them that way is safer than a single running total."
    hint: "Add the positive values and the negative values separately, then combine. Divide by 10, not by the number of positive terms."

  27:
    answer: A
    steps:
      - "The probability of passing is $\\tfrac{2}{3}$, so the probability of failing one examination is $1 - \\tfrac{2}{3} = \\tfrac{1}{3}$."
      - "'Not pass any of them' means failing all three — every one must go the same way."
      - "The three examinations are independent, so multiply the probabilities rather than adding them."
      - "That gives $\\tfrac{1}{3} \\times \\tfrac{1}{3} \\times \\tfrac{1}{3}$."
      - "Multiplying tops and bottoms: $\\dfrac{1}{27}$."
      - "Option B is $\\tfrac{8}{27}$, which is $\\left(\\tfrac{2}{3}\\right)^{3}$ — the probability of *passing* all three. Converting to the failure probability before cubing is the step that decides this question."
    hint: "Work out the probability of failing one examination first, then multiply it by itself three times."

  28:
    answer: C
    steps:
      - "There are five digits available — 3, 2, 5, 6 and 4 — and all of them are different."
      - "A three-digit number means filling three positions, and no digit may repeat."
      - "For the first position any of the 5 digits may be used."
      - "Once one is used it is gone, so the second position has 4 choices left."
      - "The third position then has 3."
      - "Multiply the choices together: $5 \\times 4 \\times 3 = 60$."
      - "Option D is 120, which is $5 \\times 4 \\times 3 \\times 2$ — four positions rather than three. Order matters here, so this is a permutation; using combinations would give 10, which is option A."
    hint: "Count the choices for each of the three positions in turn, remembering one digit is used up each time, then multiply."

  29:
    answer: A
    steps:
      - "A pie chart divides $360^{\\circ}$ in proportion to the quantities, so first find the total of all the acres."
