  46:
    answer: D
    steps:
      - 'Frequency tables with an unknown come down to one equation: all the counts add to the total. Let''s build it carefully.'
      - 'The die was tossed 120 times, and every toss produced exactly one of the six outcomes. So the six frequencies must add to 120 — that is the equation this question turns on.'
      - 'Four of the frequencies are plain numbers: 12, 20, 21 and 28. Adding them: $12 + 20 = 32$, $32 + 21 = 53$, $53 + 28 = 81$.'
      - 'Now look closely at the other two cells: $x$ and $x - 1$. Note they are *not* the same expression, which matters in a moment.'
      - 'So the equation is $81 + x + (x - 1) = 120$.'
      - 'Collecting terms on the left: $81 - 1 = 80$, and $x + x = 2x$, giving $80 + 2x = 120$.'
      - 'Subtract 80 from both sides: $2x = 40$.'
      - 'So $x = 20$.'
      - 'Let''s check: the frequencies become 12, 20, 20, 21, 19, 28, and those add to 120 ✓. Treating both unknown cells as $x$ would give $81 + 2x = 120$ and $x = 19.5$ — impossible, since a frequency counts whole tosses. Read each cell exactly as written.'
    hint: 'All six frequencies must add up to 120. Look carefully at the two cells containing the unknown — they aren''t the same expression.'

  47:
    answer: D
    steps:
      - 'Permutations and combinations together can look heavy, but they share most of their factors. Let''s write them out and cancel.'
      - 'Write both expressions out in full so the common parts become visible.'
      - 'A permutation of 3 from $n$ is $^{n}P_{3} = n(n-1)(n-2)$ — three descending factors.'
      - 'A combination of 4 from $n$ is $^{n}C_{4} = \dfrac{n(n-1)(n-2)(n-3)}{4!}$, and $4! = 24$.'
      - 'So $6\left(^{n}C_{4}\right) = \dfrac{6n(n-1)(n-2)(n-3)}{24} = \dfrac{n(n-1)(n-2)(n-3)}{4}$.'
      - 'The equation $^{n}P_{3} - 6\left(^{n}C_{4}\right) = 0$ therefore becomes $n(n-1)(n-2) = \dfrac{n(n-1)(n-2)(n-3)}{4}$.'
      - 'Here''s the key move: both sides share the factor $n(n-1)(n-2)$. For any $n \ge 3$ that factor is not zero, so it is safe to divide both sides by it.'
      - 'That leaves $1 = \dfrac{n-3}{4}$, so $n - 3 = 4$ and $n = 7$.'
      - 'Check: $^{7}P_{3} = 7 \times 6 \times 5 = 210$, and $^{7}C_{4} = 35$, so $6 \times 35 = 210$ ✓. A common slip is forgetting the $4!$ under the combination. Cancelling the shared factor first turns several lines of algebra into one.'
    hint: 'Write the permutation and the combination out as products of descending factors. They share three of them — cancel before you solve.'

  48:
    answer: B
    steps:
      - 'Two-dice questions are all about counting outcomes, not sums. Let''s count carefully.'
      - 'With two dice there are $6 \times 6 = 36$ possible outcomes, and each one is equally likely. The *sums* from 2 to 12 are not equally likely, but the 36 outcomes are, so all counting must be done in outcomes.'
      - 'The sums divisible by 3 are 3, 6, 9 and 12. Let''s count the outcomes giving each.'
      - 'Sum 3: $(1,2)$ and $(2,1)$ — 2 ways.'
      - 'Sum 6: $(1,5), (2,4), (3,3), (4,2), (5,1)$ — 5 ways.'
      - 'Sum 9: $(3,6), (4,5), (5,4), (6,3)$ — 4 ways.'
      - 'Sum 12: $(6,6)$ — 1 way.'
      - 'Altogether $2 + 5 + 4 + 1 = 12$ favourable outcomes out of 36.'
      - 'So the probability is $\dfrac{12}{36} = \dfrac{1}{3}$.'
      - 'Counting sums instead of outcomes gives 4 out of 11, which is close to $\tfrac{1}{3}$ and wrong for the right-looking reason — $(1,2)$ and $(2,1)$ really are two different outcomes. Count the 36, and you''ll be right.'
    hint: 'There are 36 outcomes, not 11 sums. List which sums divide by 3, then count the ordered pairs giving each one.'

  49:
    answer: B
    steps:
      - 'Choosing a committee is a combinations question with two separate choices. Let''s make each choice, then put them together.'
      - 'A committee is a group, not an ordered line-up: choosing Ade then Bola gives the same committee as Bola then Ade. So this is combinations, not permutations.'
      - 'The two choices are separate, so handle them separately. First the men: choose 2 from 4.'
      - '$^{4}C_{2} = \dfrac{4 \times 3}{2 \times 1} = 6$. So there are 6 possible pairs of men.'
      - 'Now the women: choose 1 from 3, which is simply $^{3}C_{1} = 3$.'
      - 'Each of the 6 pairs of men can be joined by any one of the 3 women, and every such combination is a different committee.'
      - 'That means multiplying, not adding: $6 \times 3 = 18$.'
      - 'So there are 18 possible committees.'
      - 'Adding gives 9, which is offered as option C. Adding would be right if you were choosing men *or* women; multiplying is right because you need men *and* women together. ''And'' means multiply — keep that one close.'
    hint: 'Count the ways to choose the men and the ways to choose the women separately. Then ask whether each pair of men can go with each woman.'

  50:
    answer: D
    steps:
      - 'Two averages, found two different ways, and then a comparison. Let''s take them one at a time.'
      - 'The mean is the total divided by how many numbers there are. Adding: $30 + 56 = 86$; $86 + 31 = 117$; $117 + 55 = 172$; $172 + 43 = 215$; $215 + 44 = 259$.'
      - 'There are six numbers, so the mean is $\dfrac{259}{6} = 43.1\overline{6}$, which is about 43.17.'
      - 'Now the median, which is the middle value — but only once the numbers are in order. Sorted, they are 30, 31, 43, 44, 55, 56.'
      - 'With six numbers there is no single middle one, so the median is the average of the third and fourth: $\dfrac{43 + 44}{2} = 43.5$.'
      - 'The question asks by how much the mean is *less than* the median, so subtract in that order: $43.5 - 43.17 = 0.33$.'
      - 'Sorting first is essential. Taking the numbers as listed would put 31 and 55 in the middle and give a median of 43 — close enough to look plausible, and wrong. Sort first, and the median is easy.'
    hint: 'Find the mean by adding and dividing. For the median, sort the numbers first — and with six of them, average the middle two.'
