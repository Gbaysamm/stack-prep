# UTME 2004 Mathematics — worked explanations, written against the paper.
#
# Keyed on question number; see explanations_2003.yaml for why, and for how these are
# written. In short: state the rule before using it, do the arithmetic in full, and finish by
# naming the wrong answer the paper is fishing for.
#
# All 50 are answered. Seven that were once pending turned out to be answerable: their
# values were on the page, in a picture rather than in the text, and reading the figures at
# 400dpi recovered them. Four now carry an SVG drawn from those values, so a student sees a
# clean chart rather than a cropped scan.
#
# Two are reconstructions rather than repairs, and retranscribed_2004.yaml says so. Q6's stem
# contains no equation at all; it is given the right-hand side 16, the version of the question
# in common circulation. Q49 is printed with a table headed "No. of days" and "No. of
# students" whose frequencies cannot sum to the 100 rolls its stem claims -- that table belongs
# to 2002 Q24 -- so it is given a coherent table of the same shape.
#
# Answers are checked against keys_2004.yaml, which covers 30 of them. They agree everywhere
# except Q47, where the key ignores the constraint the question turns on; that disagreement is
# argued in the explanation rather than hidden.
# Polished for a spoken lesson: each explanation opens, moves step by step, and closes.
format_version: 1
exam_year: 2004
subject: MATH

explanations:
  1:
    answer: C
    steps:
      - 'This is subtraction you already know, just in base five. The only new thing is what a borrow is worth, so let''s go column by column.'
      - 'Work right to left.'
      - 'Units column: $3 - 4$ cannot be done, so borrow from the column to the left. In base five the borrow adds 5, making it $3 + 5 = 8$, and $8 - 4 = 4$. That matches the 4 printed in the answer, so the borrow is right.'
      - 'Next, the fives column: the 4 there was reduced to 3 by that borrow. Now $3 - x$ must end in 4, which is impossible without another borrow, so borrow again: $3 + 5 = 8$, and $8 - x = 4$ gives $x = 4$.'
      - 'Twenty-fives column: the 2 was reduced to 1 by the last borrow. $1 - 3$ needs a borrow too: $1 + 5 = 6$, and $6 - 3 = 3$, which matches the 3 printed.'
      - 'Last, the hundred-and-twenty-fives column: the 4 was reduced to 3. $3 - 1 = 2$, so $y = 2$.'
      - 'The question asks for $x$ and $y$ respectively, so the answer is $4, 2$.'
      - 'Let''s check the whole thing in base ten: $4243_5 = 573$ and $1344_5 = 224$, and $573 - 224 = 349 = 2344_5$ ✓. Treating a borrow as worth 10 instead of 5 is the one mistake that matters here — remember, a borrow is worth the base.'
    hint: 'Subtract column by column from the right, but remember a borrow in base five is worth 5, not 10.'

  2:
    answer: C
    steps:
      - 'Three numbers, two different bases. The safe road is through base ten, so let''s take it.'
      - 'The three numerals are in different bases, so convert everything to base ten before doing any arithmetic.'
      - 'First, $451_6 = (4 \times 36) + (5 \times 6) + 1 = 144 + 30 + 1 = 175$.'
      - 'Next, $305_6 = (3 \times 36) + (0 \times 6) + 5 = 108 + 0 + 5 = 113$.'
      - 'The equation says $175 - p = 113$, so $p = 175 - 113 = 62$ in base ten.'
      - 'But the options are in base seven, so convert 62 across. The place values are 1, 7 and 49.'
      - '$62 \div 49 = 1$ remainder 13; $13 \div 7 = 1$ remainder 6. So the digits are 1, 1, 6.'
      - 'Therefore $p = 116_7$.'
      - 'Notice the subscripts differ across the question — two sixes and a seven. Subtracting the digits directly, without converting, is the slip this question is testing you won''t make. Base ten in the middle keeps you safe.'
    hint: 'Convert both base-six numbers into base ten, subtract there, then convert the result into base seven.'

  3:
    answer: D
    steps:
      - 'Don''t worry about the fraction stacked on a fraction. We''ll tidy the top, tidy the bottom, and then it''s one division.'
      - 'A compound fraction like this is really one division: work out the top, work out the bottom, then divide.'
      - 'Start with the top, first part: $\tfrac{1}{10} \times \tfrac{2}{3} = \tfrac{2}{30} = \tfrac{1}{15}$.'
      - 'Then add: $\tfrac{1}{15} + \tfrac{1}{4}$. Over 60 that is $\tfrac{4}{60} + \tfrac{15}{60} = \tfrac{19}{60}$.'
      - 'Now the bottom, first part: $\tfrac{1}{2} \div \tfrac{3}{5}$ means $\tfrac{1}{2} \times \tfrac{5}{3} = \tfrac{5}{6}$.'
      - 'Then subtract: $\tfrac{5}{6} - \tfrac{1}{4}$. Over 12 that is $\tfrac{10}{12} - \tfrac{3}{12} = \tfrac{7}{12}$.'
      - 'Now divide top by bottom: $\tfrac{19}{60} \div \tfrac{7}{12} = \tfrac{19}{60} \times \tfrac{12}{7}$.'
      - 'The 12 cancels into the 60 five times, leaving $\tfrac{19}{5 \times 7} = \tfrac{19}{35}$.'
      - 'Options A and B are the bottom and the top on their own — both are there for anyone who works out one half of the fraction and stops. Finish both halves, then divide.'
    hint: 'Simplify the numerator to a single fraction and the denominator to a single fraction. Then divide one by the other.'

  4:
    answer: A
    steps:
      - 'A ratio needs two numbers, and here one of them is hiding. Let''s find it first.'
      - 'A ratio compares two quantities, so find both before writing anything down.'
      - 'The number sowed is given directly: 5000 grains.'
      - 'The number harvested is not given directly — it must be worked out. There are 5000 cobs, and each carries 500 grains.'
      - 'So the harvest is $5000 \times 500 = 2{,}500{,}000$ grains.'
      - 'Now the ratio sowed to harvested is $5000 : 2{,}500{,}000$.'
      - 'Divide both sides by 5000: $1 : 500$.'
      - 'The trap is comparing 5000 grains with 5000 cobs and answering $1:1$, or stopping at the 500 grains per cob without multiplying. A cob is not a grain, and the question asks about grains at both ends. Same units on both sides, always.'
    hint: 'Work out how many grains were harvested altogether first — that''s cobs multiplied by grains per cob — then compare with the 5000 sowed.'

  5:
    answer: C
    steps:
      - 'A lot of students slip on this one, and it''s usually over three small words: ''of the remainder''. Let''s go slowly.'
      - 'the second teacher gets a fraction *of the remainder*, not of the whole packet. That is the whole question.'
      - 'The first teacher takes $\tfrac{2}{5}$, so the remainder after him is $1 - \tfrac{2}{5} = \tfrac{3}{5}$.'
      - 'Now the second teacher takes $\tfrac{2}{15}$ of that remainder: $\tfrac{2}{15} \times \tfrac{3}{5} = \tfrac{6}{75}$.'
      - 'Simplify by dividing top and bottom by 3: $\tfrac{2}{25}$.'
      - 'The third teacher gets whatever is left of the whole packet: $1 - \tfrac{2}{5} - \tfrac{2}{25}$.'
      - 'Over 25: $\tfrac{25}{25} - \tfrac{10}{25} - \tfrac{2}{25} = \tfrac{13}{25}$.'
      - 'Taking $\tfrac{2}{15}$ of the whole packet instead of the remainder gives $1 - \tfrac{2}{5} - \tfrac{2}{15} = \tfrac{7}{15}$ — not offered, but the same slip with different numbers is what options A and B are waiting for. Always ask: a fraction of what?'
    hint: 'The second teacher''s share is a fraction of what was left after the first teacher, not of the whole packet.'

  6:
    answer: B
    steps:
      - 'Equations with powers get much easier once both sides share a base. Here that base is 4.'
      - 'The method: an equation in powers is solved by writing both sides as powers of the same base, then equating the indices.'
      - 'A cube root is the power $\tfrac{1}{3}$, so $\sqrt[3]{4^{2x}} = 4^{2x/3}$.'
      - 'The right-hand side is $16 = 4^{2}$.'
      - 'So $4^{2x/3} = 4^{2}$, and with equal bases the indices must be equal: $\tfrac{2x}{3} = 2$.'
      - 'Multiply by 3 and divide by 2: $x = 3$.'
      - 'Let''s check: $4^{2 \times 3} = 4^{6} = 4096$, and $\sqrt[3]{4096} = 16$ ✓ (since $16^{3} = 4096$).'
      - 'The trap is option D, 6 — the index $2x$ itself, not $x$ — or forgetting the cube root and solving $4^{2x} = 16$ to get $x = 1$. Same base, then compare indices, and you''re there.'
    hint: 'Try writing $\sqrt[3]{4^{2x}}$ as $4^{2x/3}$ and 16 as $4^{2}$.'

  7:
    answer: C
    steps:
      - 'When there''s a surd in the denominator, there''s one reliable tool to clear it. Let''s use it.'
      - 'That tool is the conjugate: multiply top and bottom by the denominator with its middle sign reversed.'
      - 'The denominator is $\sqrt{3} + 2$, so its conjugate is $2 - \sqrt{3}$.'
      - 'Multiplying top and bottom by the same thing does not change the value, so $\dfrac{1}{\sqrt{3}+2} \times \dfrac{2 - \sqrt{3}}{2 - \sqrt{3}}$.'
      - 'The new denominator is $(2 + \sqrt{3})(2 - \sqrt{3})$, a difference of two squares: $2^{2} - (\sqrt{3})^{2} = 4 - 3 = 1$.'
      - 'That is why the conjugate works — the surd squares away and leaves a whole number.'
      - 'So the expression is $\dfrac{2 - \sqrt{3}}{1} = 2 - \sqrt{3}$.'
      - 'In the form $a + b\sqrt{3}$ that is $a = 2$ and $b = -1$.'
      - 'Option D, $2 + \sqrt{3}$, is the conjugate itself — right shape, wrong sign, and exactly what you get by multiplying by $\sqrt{3} + 2$ instead of its conjugate. Flip the middle sign, and the surd disappears.'
    hint: 'Multiply top and bottom by the conjugate of the denominator, and use the difference of two squares to clear the surd.'

  8:
    answer: C
    steps:
      - 'Two logarithms on one side can become one with the right laws. Let''s combine them, then read it as a power.'
      - 'The plan: collect the left-hand side into a single logarithm using the power and subtraction laws.'
      - 'First, the power law moves a coefficient into an index: $6\log_x 2 = \log_x 2^{6} = \log_x 64$, and $3\log_x 3 = \log_x 3^{3} = \log_x 27$.'
      - 'Next, the subtraction law turns a difference of logs into a quotient: $\log_x 64 - \log_x 27 = \log_x \dfrac{64}{27}$.'
      - 'So the equation is $\log_x \dfrac{64}{27} = 3$.'
      - 'Now, a logarithm equation is read back as a power: $\log_x A = 3$ means $x^{3} = A$.'
      - 'So $x^{3} = \dfrac{64}{27}$.'
      - 'Take the cube root of top and bottom separately: $\sqrt[3]{64} = 4$ and $\sqrt[3]{27} = 3$, so $x = \dfrac{4}{3}$.'
      - 'Option D is $\tfrac{8}{3}$ — what you get by taking a square root somewhere instead of a cube root. The 3 on the right-hand side is what makes it a cube. Combine the logs, then read it back as a power.'
    hint: 'Use the power law to bring the coefficients inside, then the subtraction law to make one logarithm. Then read it back as a power.'

  9:
    answer: A
    steps:
      - 'Three overlapping circles can look confusing, but we''ll just ask three yes-or-no questions about the shaded patch.'
      - 'With three overlapping circles there are seven separate regions, so the way to read a shaded one is to ask, for each circle in turn, whether the shading is inside it or outside it.'
      - 'First, $Q$: the shaded patch lies inside it — it sits within the right-hand circle''s boundary.'
      - 'Next, $R$: it also lies inside the lower circle.'
      - 'But it lies outside $P$: the left-hand circle''s edge cuts across and the shading stops there, staying on the far side.'
      - 'So a point in the shaded region is in $Q$ *and* in $R$ *and* not in $P$.'
      - 'Now write it in symbols. ''In $Q$ and in $R$'' is $Q \cap R$, and ''not in $P$'' is $P^{c}$, so together the region is $P^{c} \cap (Q \cap R)$.'
      - 'Option D is $P^{c} \cap (Q \cup R)$, which would shade everything in either $Q$ or $R$ outside $P$ — a far larger region including the parts of $Q$ and $R$ that do not overlap each other.'
      - 'And option C uses $\cup$ at the front, which would include the whole of $P^{c}$ — every point outside $P$, even those in no circle at all. Three questions, one answer each — that''s all these need.'
    hint: 'Ask three separate questions about the shaded patch: is it inside $P$? inside $Q$? inside $R$? Then write those three answers as one expression.'

  10:
    answer: C
    steps:
      - 'Everything in this question is described in terms of one unknown group. Let''s name it and build from there.'
      - 'Let $b$ be the number offering both subjects — everything else in the question is described in terms of that.'
      - 'The number offering Physics is three times that: $P = 3b$.'
      - 'The number offering Chemistry is twice the Physics figure: $C = 2 \times 3b = 6b$.'
      - 'Every student offers at least one subject, so nobody is outside the two sets and the union is the whole class of 40.'
      - 'Now the addition rule gives $P + C - b = 40$, since those offering both have been counted in each of $P$ and $C$.'
      - 'Substituting: $3b + 6b - b = 8b = 40$, so $b = 5$.'
      - 'Physics altogether is $3b = 15$, but the question asks for Physics *only* — those who do not also take Chemistry.'
      - 'So subtract the overlap: $15 - 5 = 10$.'
      - 'Option B is 15, the full Physics figure. The word ''only'' is the entire difference between the two. Watch for it every time.'
    hint: 'Call the number taking both subjects $b$ and write everything else in terms of it. At the end, remember ''only'' means the overlap has to come out.'

  11:
    answer: C
    steps:
      - 'Crossing the $x$-axis means solving a cubic. We''ll find one root by trying, and the rest will follow.'
      - 'A curve crosses the $x$-axis where $y = 0$, so this is really asking you to solve $x^{3} + 2x^{2} - 5x - 6 = 0$.'
      - 'For a cubic, find one root by trial using factors of the constant term 6: the candidates are $\pm 1, \pm 2, \pm 3, \pm 6$.'
      - 'Try $x = 2$: $8 + 8 - 10 - 6 = 0$. So $x = 2$ is a root and $(x - 2)$ is a factor.'
      - 'Now divide to get the quadratic factor: $x^{3} + 2x^{2} - 5x - 6 = (x - 2)(x^{2} + 4x + 3)$.'
      - 'Factorise the quadratic: $x^{2} + 4x + 3 = (x + 1)(x + 3)$.'
      - 'So the roots are $x = 2$, $x = -1$ and $x = -3$.'
      - 'Let''s check one of them: at $x = -3$, $-27 + 18 + 15 - 6 = 0$ ✓.'
      - 'Every option here is the same three numbers with signs shuffled, so the sign of each root is the whole question — a factor $(x + 1)$ gives the root $-1$, not $+1$. Flip the sign from the bracket and you''ll be right.'
    hint: 'Set $y = 0$ and find one root by trying factors of 6. Then divide out and factorise what is left.'

  12:
    answer: B
    steps:
      - 'There''s no need for long division here. One theorem gives the remainder straight away.'
      - 'The remainder theorem says that dividing $f(x)$ by $(x - a)$ leaves the remainder $f(a)$ — no long division needed.'
      - 'Here the divisor is $x + 3$, which is $x - (-3)$, so $a = -3$.'
      - 'So the remainder is $f(-3)$, where $f(x) = 3x^{3} + 5x^{2} - 11x + 4$.'
      - 'Now work out each term. $3(-3)^{3} = 3 \times -27 = -81$.'
      - 'Next, $5(-3)^{2} = 5 \times 9 = 45$. Note the square makes this positive.'
      - 'And $-11(-3) = +33$, since a negative times a negative is positive.'
      - 'Adding all four terms: $-81 + 45 + 33 + 4 = 1$.'
      - 'So the remainder is 1.'
      - 'Using $a = +3$ instead of $-3$ is the standard slip: $x + 3$ is zero at $x = -3$, and it is that zero the theorem needs. Find what makes the divisor zero, and substitute that.'
    hint: 'Use the remainder theorem: the remainder is $f(a)$ where $a$ makes the divisor zero. For $x + 3$, that is $x = -3$, not $+3$.'

  13:
    answer: B
    steps:
      - 'This factorisation has a difference of two squares hiding in it. Once we spot it, the rest falls into place.'
      - 'Four terms with no factor common to all of them means grouping — and the pairing has to be chosen so that both pairs leave the same bracket.'
      - 'Look at the last two terms: $-a^{2} + 4b^{2}$ is a difference of two squares in disguise, since $-(a^{2} - 4b^{2}) = -(a - 2b)(a + 2b)$.'
      - 'Now the first two: $ac - 2bc$ has $c$ in common, giving $c(a - 2b)$.'
      - 'So the expression is $c(a - 2b) - (a - 2b)(a + 2b)$.'
      - 'Both parts now contain $(a - 2b)$, so take it out as a common factor.'
      - 'That leaves $(a - 2b)\left[c - (a + 2b)\right]$.'
      - 'Watch this part: expand the inner bracket carefully — the minus applies to both terms: $c - a - 2b$.'
      - 'So the factorisation is $(a - 2b)(c - a - 2b)$.'
      - 'Options A and D differ only in the signs inside the second bracket, which is exactly what dropping that minus across $(a + 2b)$ would give you. Carry the minus through the whole bracket.'
    hint: 'Spot that $-a^{2} + 4b^{2}$ is a difference of two squares. Factorise it, and see what bracket it shares with the first two terms.'

  14:
    answer: B
    steps:
      - 'Inverse proportion means one thing stays fixed: the product. Let''s find it and use it.'
      - 'Inversely proportional means $y = \dfrac{k}{x}$, so the product $xy$ is the same in every case.'
      - 'Find $k$ from the pair you are given: $k = xy = \tfrac{1}{2} \times 4 = 2$.'
      - 'So the relationship is $y = \dfrac{2}{x}$, or equivalently $xy = 2$ always.'
      - 'Now use $y = 10$: $10x = 2$.'
      - 'Dividing: $x = \dfrac{2}{10} = \dfrac{1}{5}$.'
      - 'Let''s check the direction makes sense: $y$ went up from 4 to 10, so $x$ should go down — and $\tfrac{1}{2}$ down to $\tfrac{1}{5}$ does.'
      - 'Option D is 10, which is what you get by treating the relationship as direct. In direct proportion $x$ would rise with $y$; here it must fall. Inverse means the product stays fixed.'
    hint: 'Inverse proportion means $xy$ stays constant. Find that constant from the first pair, then use it with $y = 10$.'

  15:
    answer: D
    steps:
      - 'The word ''square'' in this question is doing real work. Let''s build it into the formula from the start.'
      - '''Varies directly as the square of $T$'' means $L = kT^{2}$ — the square is part of the relationship, not an afterthought.'
      - 'Find $k$ from the pendulum you are told about: $64 = k \times 4^{2} = 16k$.'
      - 'So $k = \dfrac{64}{16} = 4$.'
      - 'Now apply $L = 4T^{2}$ with $T = 9$.'
      - 'First the square: $9^{2} = 81$.'
      - 'Then $L = 4 \times 81 = 324$ cm.'
      - 'Option C is 144 cm, which is $64 \times \tfrac{9}{4}$ — the answer you get by scaling the length in proportion to $T$ rather than to $T^{2}$. Doubling the period makes a pendulum four times as long, not twice. Keep the square in, all the way through.'
    hint: 'Write $L = kT^{2}$, find $k$ from the pendulum you are given, then substitute $T = 9$. Don''t forget to square.'

  16:
    answer: A
    steps:
      - 'We need the boundary line and the side that''s shaded. Let''s find the line first, then test a point.'
      - 'The boundary is a straight line, and the graph gives two points on it: $(0, 6)$ on the $y$-axis and $(2, 0)$ on the $x$-axis.'
      - 'Find its gradient: $m = \dfrac{0 - 6}{2 - 0} = \dfrac{-6}{2} = -3$.'
      - 'With a $y$-intercept of 6, the line is $y = -3x + 6$.'
      - 'Rearranging so it matches the shape of the options: $y + 3x = 6$.'
      - 'Now decide which side of the line is shaded, and the safest way is to test a point. The origin is the easiest one to use.'
      - 'At the origin, $y + 3x = 0 + 0 = 0$, which is less than 6.'
      - 'The origin lies inside the shaded band on the graph, so the shaded side is the one where $y + 3x$ is less than 6.'
      - 'So the region is $\{(x, y) : y + 3x < 6\}$.'
      - 'Options C and D use $y - 3x$, which describes a line of gradient $+3$ — sloping the other way entirely. Reading the gradient''s sign off the picture rules out half the options before any testing.'
    hint: 'Find the equation of the line from its two intercepts, then substitute the origin to see which side of it is shaded.'

  17:
    answer: C
    steps:
      - 'This double inequality has one moment that needs real care: dividing by a negative. Let''s go slowly.'
      - 'A double inequality is handled by doing the same thing to all three parts at once.'
      - 'Start with $-1 < 3 - 2x \le 5$ and subtract 3 throughout: $-4 < -2x \le 2$.'
      - 'Now divide throughout by $-2$. Dividing by a negative reverses both inequality signs — this is the step the question is built around.'
      - 'That gives $2 > x \ge -1$, which reads more naturally as $-1 \le x < 2$.'
      - 'Note which end is inclusive: $x$ can equal $-1$, but it cannot equal 2.'
      - 'So the integers in that range are $-1$, 0 and 1.'
      - 'Option B includes 2, which fails because the original inequality is strict at that end. Forgetting to flip the signs when dividing by $-2$ produces exactly that wrong set. Divide by a negative, flip the signs — every time.'
    hint: 'Subtract 3 from all three parts, then divide by $-2$ — and remember what dividing by a negative does to the inequality signs.'

  18:
    answer: D
    steps:
      - 'Two formulas, one value of $n$. We''ll work each term out separately, then multiply.'
      - 'Both formulas give the $n$th term, so substitute $n = 2$ into each one separately.'
      - 'For $Q_n = 3 \cdot 2^{n-2}$ with $n = 2$: the index is $2 - 2 = 0$.'
      - 'Anything to the power zero is 1, so $Q_2 = 3 \times 1 = 3$.'
      - 'Now for $U_n = 3 \cdot 2^{2n-3}$ with $n = 2$: the index is $(2 \times 2) - 3 = 1$.'
      - 'So $U_2 = 3 \times 2^{1} = 6$.'
      - 'The question asks for the product: $3 \times 6 = 18$.'
      - 'Option B is 6 and option A is 3 — the two terms on their own. And $2^{0} = 1$, not 0, which is the arithmetic slip that turns $Q_2$ into nothing. Work the index out first, and the rest is easy.'
    hint: 'Put $n = 2$ into each formula separately, working out the index first. Then multiply the two results.'

  19:
    answer: D
    steps:
      - 'We know the first and fourth terms of a geometric progression, and that''s enough to find the ratio. Let''s start there.'
      - 'In a geometric progression the $n$th term is $ar^{n-1}$, so the fourth term is $ar^{3}$.'
      - 'The first term is given: $a = 6$. The fourth term gives $6r^{3} = 162$.'
      - 'Divide both sides by 6: $r^{3} = 27$.'
      - 'Take the cube root: $r = 3$.'
      - 'Now write out the first three terms: $6$, $6 \times 3 = 18$, and $18 \times 3 = 54$.'
      - 'Their sum is $6 + 18 + 54 = 78$.'
      - 'Option C is 48, the sum you get with $r = 2$ — which comes from misreading $r^{3} = 27$ as $r = 27/3$. The cube root is the step that matters. You''ve got it now.'
    hint: 'Use the fourth term to find $r$ — remember it is $ar^{3}$, not $ar^{4}$ — then write out the first three terms and add them.'

  20:
    answer: B
    steps:
      - 'An infinite sum can still have a finite answer, as long as the ratio behaves. Let''s check it and use the formula.'
      - 'A sum to infinity only exists for a geometric series whose ratio is between $-1$ and 1, so first check what the ratio is.'
      - 'Divide any term by the one before it: $\tfrac{1}{6} \div \tfrac{1}{2} = \tfrac{1}{6} \times \tfrac{2}{1} = \tfrac{1}{3}$.'
      - 'Check it holds for the next pair too: $\tfrac{1}{18} \div \tfrac{1}{6} = \tfrac{1}{3}$ ✓. So $r = \tfrac{1}{3}$, which is safely between $-1$ and 1.'
      - 'The formula is $S_\infty = \dfrac{a}{1 - r}$, with $a = \tfrac{1}{2}$.'
      - 'The denominator first: $1 - \tfrac{1}{3} = \tfrac{2}{3}$.'
      - 'So $S_\infty = \dfrac{1/2}{2/3} = \dfrac{1}{2} \times \dfrac{3}{2} = \dfrac{3}{4}$.'
      - 'Dividing by $\tfrac{2}{3}$ means multiplying by $\tfrac{3}{2}$ — turning that upside down instead gives $\tfrac{1}{3}$, which is offered as option D. Take care with that last division and you''re there.'
    hint: 'Find the common ratio first, then use $S_\infty = \dfrac{a}{1-r}$. Take care when dividing by the fraction at the end.'

  21:
    answer: B
    steps:
      - 'A made-up operation is just a rule to follow carefully. Let''s apply it twice, inside first.'
      - 'A defined operation is just a rule to follow. Here $p * q$ means multiply the two numbers and take the square root.'
      - 'Brackets first, as always: work out $8 * 32$ before touching the 4.'
      - '$8 * 32 = \sqrt{8 \times 32} = \sqrt{256}$.'
      - 'And $\sqrt{256} = 16$, so the expression becomes $4 * 16$.'
      - 'Now apply the rule again: $4 * 16 = \sqrt{4 \times 16} = \sqrt{64}$.'
      - 'That gives $\sqrt{64} = 8$.'
      - 'Option A is 16 — the value of the inner bracket, which is easy to hand in as the final answer once you have done the harder half of the work. Finish the outer step too.'
    hint: 'Work out the bracket first using the rule, then apply the same rule again to the result.'

  22:
    answer: B
    steps:
      - 'The inverse of a two-by-two matrix follows a neat recipe. Let''s go through it step by step.'
      - 'For a $2 \times 2$ matrix $\begin{pmatrix} a & b \\ c & d \end{pmatrix}$, the inverse is $\dfrac{1}{ad - bc}\begin{pmatrix} d & -b \\ -c & a \end{pmatrix}$ — swap the leading diagonal, negate the other one, and divide by the determinant.'
      - 'First the determinant: $ad - bc = (2)(1) - (1)(1) = 2 - 1 = 1$.'
      - 'A determinant of 1 is convenient: dividing by it changes nothing, so the inverse is just the rearranged matrix.'
      - 'Next, swap $a$ and $d$: the 2 and the 1 on the leading diagonal exchange places, giving 1 in the top left and 2 in the bottom right.'
      - 'Then negate the other diagonal: both off-diagonal entries are 1, so each becomes $-1$.'
      - 'So the inverse is $\begin{pmatrix} 1 & -1 \\ -1 & 2 \end{pmatrix}$.'
