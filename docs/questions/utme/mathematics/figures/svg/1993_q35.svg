<svg viewBox="0 0 340 290" width="340" height="290" role="img"
     aria-label="Square PQRS of area 100 square centimetres, divided by the lines XY and TV into the small square TUYS and the larger square XQVU">
  <path d="M110 40 H270 V200 H110 Z" fill="#6d5ae0" fill-opacity="0.24"/>
  <path d="M70 200 H110 V240 H70 Z" fill="#6d5ae0" fill-opacity="0.45"/>

  <g fill="none" stroke="#1a1a1f" stroke-width="1.9">
    <path d="M70 40 H270 V240 H70 Z"/>
  </g>
  <g fill="none" stroke="#3f2fa8" stroke-width="1.6">
    <path d="M110 40 V240"/>
    <path d="M70 200 H270"/>
  </g>

  <g fill="#1a1a1f">
    <circle cx="70" cy="40" r="3"/><circle cx="270" cy="40" r="3"/>
    <circle cx="270" cy="240" r="3"/><circle cx="70" cy="240" r="3"/>
    <circle cx="110" cy="40" r="3"/><circle cx="270" cy="200" r="3"/>
    <circle cx="110" cy="200" r="3"/><circle cx="70" cy="200" r="3"/>
    <circle cx="110" cy="240" r="3"/>
  </g>

  <g font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">
    <text x="66" y="32" text-anchor="middle">P</text>
    <text x="110" y="32" text-anchor="middle">X</text>
    <text x="274" y="32" text-anchor="middle">Q</text>
    <text x="58" y="205">T</text>
    <text x="118" y="195">U</text>
    <text x="280" y="205">V</text>
    <text x="58" y="256">S</text>
    <text x="110" y="262" text-anchor="middle">Y</text>
    <text x="280" y="256">R</text>
  </g>
</svg>
