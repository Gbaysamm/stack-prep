<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="300" height="250" role="img"
     aria-label="Triangle PQR with PR 10 cm along the base and the angle at P equal to 30 degrees; PQ is required">
  <path d="M70 200 L203.4 123 L180 200 Z" fill="#6d5ae0" fill-opacity="0.14"/>

  <g fill="none" stroke="#1a1a1f" stroke-width="1.9" stroke-linejoin="round">
    <path d="M70 200 L203.4 123 L180 200 Z"/>
  </g>

  <path d="M104.6 180 A40 40 0 0 1 110 200" fill="none" stroke="#1a1a1f" stroke-width="1.4"/>

  <g fill="#1a1a1f">
    <circle cx="70" cy="200" r="3.2"/>
    <circle cx="203.4" cy="123" r="3.2"/>
    <circle cx="180" cy="200" r="3.2"/>
  </g>

  <g font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">
    <text x="54" y="212">P</text>
    <text x="210" y="118">Q</text>
    <text x="180" y="220" text-anchor="middle">R</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">
    <text x="118" y="192">30°</text>
    <text x="125" y="220" text-anchor="middle">10 cm</text>
  </g>
  <text x="126" y="154" font-family="system-ui, sans-serif" font-size="14"
        font-weight="700" fill="#b91c1c">?</text>
</svg>
