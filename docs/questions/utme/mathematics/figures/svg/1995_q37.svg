<svg viewBox="0 0 360 290" width="360" height="290" role="img"
     aria-label="Four sine and cosine sketches labelled A to D; graph C is y = 3 sin x, rising through the origin to a maximum of 3 at pi over 2">
  <!-- A: y = -3 sin x -->
  <g transform="translate(10,10)">
    <rect x="0" y="0" width="160" height="112" fill="#fff" stroke="#d6d6de" stroke-width="1"/>
    <g stroke="#b9b9c6" stroke-width="1" fill="none"><path d="M8 55 H152 M80 6 V106"/></g>
    <path d="M15 55 L23.1 39.7 L31.25 26.7 L39.4 18 L47.5 15 L55.6 18 L63.75 26.7 L71.9 39.7
             L80 55 L88.1 70.3 L96.25 83.3 L104.4 92 L112.5 95 L120.6 92 L128.75 83.3
             L136.9 70.3 L145 55"
          fill="none" stroke="#3f2fa8" stroke-width="2" stroke-linejoin="round"/>
    <g font-family="system-ui, sans-serif" font-size="9" fill="#555">
      <text x="10" y="66">-π</text><text x="140" y="66">π</text><text x="84" y="18">3</text>
    </g>
    <text x="80" y="128" font-family="system-ui, sans-serif" font-size="14"
          font-weight="700" fill="#1a1a1f" text-anchor="middle">A</text>
  </g>

  <!-- B: y = 3 cos x -->
  <g transform="translate(190,10)">
    <rect x="0" y="0" width="160" height="112" fill="#fff" stroke="#d6d6de" stroke-width="1"/>
    <g stroke="#b9b9c6" stroke-width="1" fill="none"><path d="M8 55 H152 M80 6 V106"/></g>
    <path d="M15 95 L23.1 92 L31.25 83.3 L39.4 70.3 L47.5 55 L55.6 39.7 L63.75 26.7 L71.9 18
             L80 15 L88.1 18 L96.25 26.7 L104.4 39.7 L112.5 55 L120.6 70.3 L128.75 83.3
             L136.9 92 L145 95"
          fill="none" stroke="#3f2fa8" stroke-width="2" stroke-linejoin="round"/>
    <g font-family="system-ui, sans-serif" font-size="9" fill="#555">
      <text x="10" y="66">-π</text><text x="140" y="66">π</text><text x="84" y="18">3</text>
    </g>
    <text x="80" y="128" font-family="system-ui, sans-serif" font-size="14"
          font-weight="700" fill="#1a1a1f" text-anchor="middle">B</text>
  </g>

  <!-- C: y = 3 sin x -->
  <g transform="translate(10,155)">
    <rect x="0" y="0" width="160" height="112" fill="#fff" stroke="#d6d6de" stroke-width="1"/>
    <g stroke="#b9b9c6" stroke-width="1" fill="none"><path d="M8 55 H152 M80 6 V106"/></g>
    <path d="M15 55 L23.1 70.3 L31.25 83.3 L39.4 92 L47.5 95 L55.6 92 L63.75 83.3 L71.9 70.3
             L80 55 L88.1 39.7 L96.25 26.7 L104.4 18 L112.5 15 L120.6 18 L128.75 26.7
             L136.9 39.7 L145 55"
          fill="none" stroke="#3f2fa8" stroke-width="2" stroke-linejoin="round"/>
    <g font-family="system-ui, sans-serif" font-size="9" fill="#555">
      <text x="10" y="66">-π</text><text x="140" y="66">π</text><text x="84" y="18">3</text>
    </g>
    <text x="80" y="128" font-family="system-ui, sans-serif" font-size="14"
          font-weight="700" fill="#1a1a1f" text-anchor="middle">C</text>
  </g>

  <!-- D: y = -3 cos x -->
  <g transform="translate(190,155)">
    <rect x="0" y="0" width="160" height="112" fill="#fff" stroke="#d6d6de" stroke-width="1"/>
    <g stroke="#b9b9c6" stroke-width="1" fill="none"><path d="M8 55 H152 M80 6 V106"/></g>
    <path d="M15 15 L23.1 18 L31.25 26.7 L39.4 39.7 L47.5 55 L55.6 70.3 L63.75 83.3 L71.9 92
             L80 95 L88.1 92 L96.25 83.3 L104.4 70.3 L112.5 55 L120.6 39.7 L128.75 26.7
             L136.9 18 L145 15"
          fill="none" stroke="#3f2fa8" stroke-width="2" stroke-linejoin="round"/>
    <g font-family="system-ui, sans-serif" font-size="9" fill="#555">
      <text x="10" y="66">-π</text><text x="140" y="66">π</text><text x="84" y="18">3</text>
    </g>
    <text x="80" y="128" font-family="system-ui, sans-serif" font-size="14"
          font-weight="700" fill="#1a1a1f" text-anchor="middle">D</text>
  </g>
