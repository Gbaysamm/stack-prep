<svg viewBox="0 0 400 265" width="400" height="265" role="img"
     aria-label="Histogram of examination scores in classes of width 50: 3 candidates below 50, then 5, 8, 1 and 2 up to 250">
  <g stroke="#e4e4ea" stroke-width="1" fill="none">
    <path d="M70 181 H372 M70 147 H372 M70 113 H372 M70 79 H372 M70 45 H372"/>
  </g>
  <g stroke="#1a1a1f" stroke-width="1.5" fill="none">
    <path d="M70 35 V215 H378"/>
  </g>

  <g fill="#6d5ae0" fill-opacity="0.7" stroke="#3f2fa8" stroke-width="1.2">
    <rect x="70" y="164" width="50" height="51"/>
    <rect x="120" y="130" width="50" height="85"/>
    <rect x="170" y="79" width="50" height="136"/>
    <rect x="220" y="198" width="50" height="17"/>
    <rect x="270" y="181" width="50" height="34"/>
  </g>

  <g font-family="system-ui, sans-serif" font-size="11" fill="#555" text-anchor="end">
    <text x="62" y="219">0</text>
    <text x="62" y="185">2</text>
    <text x="62" y="151">4</text>
    <text x="62" y="117">6</text>
    <text x="62" y="83">8</text>
    <text x="62" y="49">10</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#1a1a1f" text-anchor="middle">
    <text x="120" y="231">50</text>
    <text x="170" y="231">100</text>
    <text x="220" y="231">150</text>
    <text x="270" y="231">200</text>
    <text x="320" y="231">250</text>
    <text x="370" y="231">300</text>
    <text x="220" y="252" font-weight="600" fill="#555">Score</text>
  </g>
  <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="600"
        fill="#555" text-anchor="middle" transform="translate(18,125) rotate(-90)">No. of candidates</text>
</svg>
