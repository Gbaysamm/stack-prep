<svg viewBox="0 0 300 250" width="300" height="250" role="img"
     aria-label="A circle with the secant from T cutting it at P then Q, and the tangent TZ touching at Z; PQ is 9 units, TZ is 6 units and TP is x">
  <circle cx="143.5" cy="145.4" r="80" fill="none" stroke="#1a1a1f" stroke-width="1.7"/>

  <g fill="none" stroke="#3f2fa8" stroke-width="1.8">
    <path d="M119.5 69.1 L250 130"/>
    <path d="M210 189.9 L250 130"/>
  </g>

  <g fill="#1a1a1f">
    <circle cx="119.5" cy="69.1" r="3.2"/>
    <circle cx="217.4" cy="114.8" r="3.2"/>
    <circle cx="250" cy="130" r="3.2"/>
    <circle cx="210" cy="189.9" r="3.2"/>
  </g>

  <g font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">
    <text x="104" y="62">Q</text>
    <text x="224" y="108">P</text>
    <text x="258" y="128">T</text>
    <text x="206" y="207">Z</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#b91c1c">
    <text x="157" y="84">9</text>
    <text x="236" y="112">x</text>
    <text x="240" y="168">6</text>
  </g>
</svg>
