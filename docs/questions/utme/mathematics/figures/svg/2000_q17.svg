<svg viewBox="0 0 340 320" width="340" height="320" role="img"
     aria-label="Four candidate graphs A to D. Graph C shows two lines of positive gradient meeting at (2, 2) with the region between them, containing the origin, shaded.">
  <defs>
    <clipPath id="p2000a"><rect x="0" y="0" width="150" height="135"/></clipPath>
    <clipPath id="p2000b"><rect x="0" y="0" width="150" height="135"/></clipPath>
    <clipPath id="p2000c"><rect x="0" y="0" width="150" height="135"/></clipPath>
    <clipPath id="p2000d"><rect x="0" y="0" width="150" height="135"/></clipPath>
  </defs>

  <!-- panel A: correct lines, opposite wedge -->
  <g transform="translate(10,10)">
    <rect x="0" y="0" width="150" height="135" fill="#fff" stroke="#d6d6de" stroke-width="1"/>
    <g clip-path="url(#p2000a)">
      <path d="M70 70 L105 0 L150 0 L150 30 Z" fill="#6d5ae0" fill-opacity="0.22"/>
      <g stroke="#b9b9c6" stroke-width="1">
        <path d="M0 90 H150 M50 0 V135"/>
      </g>
      <g stroke="#3f2fa8" stroke-width="1.8" fill="none">
        <path d="M37.5 135 L105 0"/>
        <path d="M0 105 L150 30"/>
      </g>
      <circle cx="70" cy="70" r="2.6" fill="#1a1a1f"/>
    </g>
    <text x="75" y="158" font-family="system-ui, sans-serif" font-size="14"
          font-weight="700" fill="#1a1a1f" text-anchor="middle">A</text>
  </g>

  <!-- panel B: negative gradients -->
  <g transform="translate(180,10)">
    <rect x="0" y="0" width="150" height="135" fill="#fff" stroke="#d6d6de" stroke-width="1"/>
    <g clip-path="url(#p2000b)">
      <path d="M56.7 83.3 L150 130 L150 135 L82.5 135 Z" fill="#6d5ae0" fill-opacity="0.22"/>
      <g stroke="#b9b9c6" stroke-width="1">
        <path d="M0 90 H150 M50 0 V135"/>
      </g>
      <g stroke="#3f2fa8" stroke-width="1.8" fill="none">
        <path d="M15 0 L82.5 135"/>
        <path d="M0 55 L150 130"/>
      </g>
      <circle cx="56.7" cy="83.3" r="2.6" fill="#1a1a1f"/>
    </g>
    <text x="75" y="158" font-family="system-ui, sans-serif" font-size="14"
          font-weight="700" fill="#1a1a1f" text-anchor="middle">B</text>
  </g>

  <!-- panel C: the correct region -->
  <g transform="translate(10,165)">
    <rect x="0" y="0" width="150" height="135" fill="#fff" stroke="#d6d6de" stroke-width="1"/>
    <g clip-path="url(#p2000c)">
      <path d="M70 70 L0 105 L0 135 L37.5 135 Z" fill="#6d5ae0" fill-opacity="0.22"/>
      <g stroke="#b9b9c6" stroke-width="1">
        <path d="M0 90 H150 M50 0 V135"/>
      </g>
      <g stroke="#3f2fa8" stroke-width="1.8" fill="none">
        <path d="M37.5 135 L105 0"/>
        <path d="M0 105 L150 30"/>
      </g>
      <circle cx="70" cy="70" r="2.6" fill="#1a1a1f"/>
    </g>
    <text x="75" y="313" font-family="system-ui, sans-serif" font-size="14"
          font-weight="700" fill="#1a1a1f" text-anchor="middle">C</text>
  </g>

  <!-- panel D: correct lines, region below both -->
  <g transform="translate(180,165)">
    <rect x="0" y="0" width="150" height="135" fill="#fff" stroke="#d6d6de" stroke-width="1"/>
    <g clip-path="url(#p2000d)">
      <path d="M70 70 L150 30 L150 135 L37.5 135 Z" fill="#6d5ae0" fill-opacity="0.22"/>
      <g stroke="#b9b9c6" stroke-width="1">
        <path d="M0 90 H150 M50 0 V135"/>
      </g>
      <g stroke="#3f2fa8" stroke-width="1.8" fill="none">
        <path d="M37.5 135 L105 0"/>
        <path d="M0 105 L150 30"/>
      </g>
      <circle cx="70" cy="70" r="2.6" fill="#1a1a1f"/>
    </g>
    <text x="75" y="313" font-family="system-ui, sans-serif" font-size="14"
          font-weight="700" fill="#1a1a1f" text-anchor="middle">D</text>
  </g>
</svg>
