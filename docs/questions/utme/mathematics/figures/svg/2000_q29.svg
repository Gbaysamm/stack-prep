<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 285" width="300" height="285" role="img"
     aria-label="Circle through P, Q, R and S with PQ equal to QR, diagonal PR drawn, angle RPQ 30 degrees and angle RPS 50 degrees; angle PRS is required">
  <circle cx="150" cy="130" r="110" fill="none" stroke="#b9b9c6" stroke-width="1.4"/>

  <g fill="none" stroke="#1a1a1f" stroke-width="1.8" stroke-linejoin="round">
    <path d="M46.6 167.6 L130.9 238.3 L234.3 200.7 L205.0 34.7 Z"/>
  </g>
  <path d="M46.6 167.6 L234.3 200.7" fill="none" stroke="#3f2fa8"
        stroke-width="1.6" stroke-dasharray="5 3"/>

  <!-- equal-side ticks on PQ and QR -->
  <g stroke="#1a1a1f" stroke-width="1.6">
    <path d="M92.6 198.4 L84.9 207.6"/>
    <path d="M184.7 225.1 L180.5 213.9"/>
  </g>

  <!-- angles at P -->
  <path d="M72.6 189.5 A34 34 0 0 0 80.1 173.5" fill="none" stroke="#1a1a1f" stroke-width="1.3"/>
  <path d="M91.9 175.6 A46 46 0 0 0 81.8 138.0" fill="none" stroke="#1a1a1f" stroke-width="1.3"/>

  <!-- the required angle at R -->
  <path d="M229.1 171.1 A30 30 0 0 0 204.8 195.5" fill="none" stroke="#b91c1c" stroke-width="1.6"/>

  <g fill="#1a1a1f">
    <circle cx="46.6" cy="167.6" r="3.2"/>
    <circle cx="130.9" cy="238.3" r="3.2"/>
    <circle cx="234.3" cy="200.7" r="3.2"/>
    <circle cx="205.0" cy="34.7" r="3.2"/>
  </g>

  <g font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">
    <text x="26" y="174">P</text>
    <text x="124" y="260">Q</text>
    <text x="246" y="216">R</text>
    <text x="212" y="24">S</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#1a1a1f">
    <text x="88" y="192">30°</text>
    <text x="100" y="156">50°</text>
  </g>
  <text x="200" y="176" font-family="system-ui, sans-serif" font-size="13"
        font-weight="700" fill="#b91c1c" text-anchor="end">?</text>
</svg>
