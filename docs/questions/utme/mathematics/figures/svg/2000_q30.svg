<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 275" width="300" height="275" role="img"
     aria-label="Circle EFGH centre O with diameter FH horizontal and chord GE meeting it at right angles at N, where NH is 8 cm and GE is 24 cm">
  <circle cx="150" cy="130" r="100" fill="none" stroke="#1a1a1f" stroke-width="1.6"/>

  <g stroke="#3f2fa8" stroke-width="1.8" fill="none">
    <path d="M50 130 H250"/>
    <path d="M188.5 37.7 V222.3"/>
  </g>

  <!-- right angle at N -->
  <path d="M188.5 118.5 H200.5 V130" fill="none" stroke="#1a1a1f" stroke-width="1.4"/>

  <g fill="#1a1a1f">
    <circle cx="50" cy="130" r="3.2"/>
    <circle cx="250" cy="130" r="3.2"/>
    <circle cx="188.5" cy="37.7" r="3.2"/>
    <circle cx="188.5" cy="222.3" r="3.2"/>
    <circle cx="150" cy="130" r="3.2"/>
    <circle cx="188.5" cy="130" r="3.2"/>
  </g>

  <!-- NH measurement -->
  <g stroke="#b91c1c" stroke-width="1.3" fill="none">
    <path d="M188.5 100 V112 M250 100 V112 M188.5 106 H250"/>
  </g>

  <g font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">
    <text x="34" y="136">F</text>
    <text x="260" y="136">H</text>
    <text x="196" y="30">G</text>
    <text x="196" y="240">E</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">
    <text x="140" y="148" text-anchor="end">O</text>
    <text x="183" y="148" text-anchor="end">N</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle">
    <text x="219" y="98">8 cm</text>
  </g>
  <text x="180" y="86" font-family="system-ui, sans-serif" font-size="12"
        fill="#3f2fa8" text-anchor="end">GE = 24 cm</text>

  <!-- FH dimension line -->
  <g stroke="#555" stroke-width="1.2" fill="none">
    <path d="M50 244 V256 M250 244 V256 M50 250 H250"/>
  </g>
  <text x="150" y="270" font-family="system-ui, sans-serif" font-size="12"
        fill="#555" text-anchor="middle">FH = ?</text>
</svg>
