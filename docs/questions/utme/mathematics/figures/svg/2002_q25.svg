<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 220" width="330" height="220" role="img"
     aria-label="Venn diagram for a class of 80: Music only is 30 minus x, both is x, History only is 40 minus x, and 20 offer neither">
  <rect x="10" y="10" width="310" height="200" fill="none" stroke="#1a1a1f" stroke-width="1.6"/>
  <circle cx="135.0" cy="110.0" r="72.0" fill="none" stroke="#1a1a1f" stroke-width="1.7"/>
  <circle cx="205.0" cy="110.0" r="72.0" fill="none" stroke="#1a1a1f" stroke-width="1.7"/>
  <text x="70.0" y="34.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f" text-anchor="middle">Music</text>
  <text x="262.0" y="34.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f" text-anchor="middle">History</text>
  <text x="310.0" y="32.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f" text-anchor="end">80</text>
  <text x="100.0" y="114.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f" text-anchor="middle">30 − x</text>
  <text x="170.0" y="114.0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f" font-style="italic" text-anchor="middle">x</text>
  <text x="240.0" y="114.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f" text-anchor="middle">40 − x</text>
  <text x="306.0" y="200.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f" text-anchor="end">20</text>
</svg>
