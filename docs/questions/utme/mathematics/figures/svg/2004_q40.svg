<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="300" height="250" role="img"
     aria-label="Pie chart of crops harvested: Others 60 degrees, Maize a right angle of 90 degrees, Millet 150 degrees, Beans 60 degrees">
  <g transform="translate(150,120)">
    <path d="M0 0 L0 -100 A100 100 0 0 1 86.6 -50 Z" fill="#c7bff5"/>
    <path d="M0 0 L86.6 -50 A100 100 0 0 1 50 86.6 Z" fill="#9f92ee"/>
    <path d="M0 0 L50 86.6 A100 100 0 0 1 -86.6 -50 Z" fill="#6d5ae0"/>
    <path d="M0 0 L-86.6 -50 A100 100 0 0 1 0 -100 Z" fill="#e3dffa"/>
    <g fill="none" stroke="#fff" stroke-width="2">
      <path d="M0 0 L0 -100 M0 0 L86.6 -50 M0 0 L50 86.6 M0 0 L-86.6 -50"/>
    </g>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#1a1a1f" stroke-width="1.6"/>
    <path d="M12.1 -7 L19.1 5.1 L7 12.1" fill="none" stroke="#1a1a1f" stroke-width="1.4"/>
    <g font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f" text-anchor="middle">
      <text x="30" y="-58">Others</text><text x="30" y="-44" font-weight="700">60°</text>
      <text x="60" y="10">Maize</text><text x="60" y="24" font-weight="700">90°</text>
      <text x="-36" y="36" fill="#fff">Millet</text><text x="-36" y="50" font-weight="700" fill="#fff">150°</text>
      <text x="-34" y="-58">Beans</text><text x="-34" y="-44" font-weight="700">60°</text>
    </g>
  </g>
</svg>
