          - {figure: 0, kind: circle, target: '−1', text: 'x = −1'}
      - say: 'So the graph is $y = 1 - 2x - 3x^2$, which is answer choice D.'
        write: 'Graph: $y = 1 - 2x - 3x^{2}$'
        answer: true
    traps:
      A: 'You went for $1 + 2x + 3x^2$. It passes through 1 on the $y$-axis, but its $x^2$ term is positive, so it opens upwards. The graph opens downwards.'
      B: 'You went for $1 - 2x + 3x^2$. The constant is right, but the plus $3x^2$ makes it open upwards, and the graph opens downwards.'
      C: 'You went for $1 + 2x - 3x^2$. It opens downwards and passes through 1, but at $x = -1$ it gives negative 4, not zero. Its roots are 1 and $-\tfrac{1}{3}$, the mirror image of the graph.'
      E: 'You went for $3x^2 + 2x - 1$. That crosses the $y$-axis at negative 1 and opens upwards. The graph crosses at positive 1 and opens downwards.'
  19:
