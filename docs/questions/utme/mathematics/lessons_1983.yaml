          - {id: t, op: total, part: 'col:2', text: '2.30', 'on': 'Add'}
      - say: 'There are 5 values, so $n$ is 5. The mean, $x$ bar, is $A$ plus the sum of $d$ over $n$.'
        write: '$n = 5$; $\ \bar{x} = A + \dfrac{\sum d}{n}$'
