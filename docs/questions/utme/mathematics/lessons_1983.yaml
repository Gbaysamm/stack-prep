        point:
          - {figure: sketch, kind: highlight, target: PR}
          - {figure: sketch, kind: highlight, target: QR}
      - say: '2 root 3, squared, is 4 times 3, which is 12. $PQ$ is the longest side.'
        write: '$|PQ|^{2} = (2\sqrt{3})^{2} = 4 \times 3 = 12$'
        point:
          - {figure: sketch, kind: highlight, target: PQ, text: 'longest'}
      - say: 'Add the two smaller squares. 3 plus 9 is 12, which is exactly the square on the longest side.'
        write: '$|PR|^{2} + |QR|^{2} = 3 + 9 = 12 = |PQ|^{2}$'
      - say: 'So the sides fit Pythagoras, and the triangle is right-angled. The right angle faces the longest side, $PQ$, so it is at $R$, by the converse of Pythagoras.'
        write: '$\therefore \angle R = 90^{\circ}$ (converse of Pythagoras)'
        point:
          - {figure: sketch, kind: arc, target: PRQ, text: '90°'}
      - say: 'Now the three angles add up to 180, by the angle sum of a triangle.'
        write: '$\angle P + 90^{\circ} + 30^{\circ} = 180^{\circ}$ ($\angle$ sum of $\triangle$)'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '=90∘'}, at: '90∘', text: 'from here'}
      - say: '90 plus 30 is 120. 180 minus 120 is 60.'
        write: '$\angle P = 180^{\circ} - 120^{\circ} = 60^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: QPR, text: '60°'}
      - section: 'Check'
        say: 'Check the given 30 degrees at $Q$. Relative to $Q$, $PR$ is opposite and $PQ$ is the hypotenuse. SOH says sine is opposite over hypotenuse.'
        write: '$\sin Q = \dfrac{\text{opp}}{\text{hyp}} = \dfrac{\sqrt{3}}{2\sqrt{3}}$'
        point:
          - {figure: sketch, kind: highlight, target: PR, text: 'opp'}
          - {figure: sketch, kind: highlight, target: PQ, text: 'hyp'}
      - say: 'The root 3s cancel, leaving a half. Sine 30 degrees is a half, so $Q$ is 30, as given.'
        write: '$\sin Q = \dfrac{1}{2}$, $\ Q = 30^{\circ}\ \checkmark$'
      - say: 'Therefore $P$ is 60 degrees and $R$ is 90 degrees, option A.'
        write: '$\therefore P = 60^{\circ}$, $R = 90^{\circ}$ (A)'
        answer: true
    traps:
