          - {id: trip, op: label, part: leg1, text: '4v km', 'on': 'kilometres'}
      - say: 'Second part. The speed is $2v$ for 3 hours. $2v$ times 3 is $6v$ kilometres.'
        write: '2nd part: $2v \times 3 = 6v$ km'
