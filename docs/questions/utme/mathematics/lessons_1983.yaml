      C: 'You went for 6. That''s only one significant figure. To 3 significant figures, 6.0975 is 6.10, keeping the final zero.'
      D: 'You went for 6.09. That cuts off the digits instead of rounding. The digit after the 9 is 7, so the 9 rounds up, and 6.09 becomes 6.10.'
