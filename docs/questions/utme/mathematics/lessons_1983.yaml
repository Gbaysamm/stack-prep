        say: 'We are given three sides and one angle. Before reaching for the sine rule, test the sides. If they fit Pythagoras, the triangle is right-angled, and the rest is easy.'
        write: '$QR = 3$, $PR = \sqrt{3}$, $PQ = 2\sqrt{3}$, $\angle Q = 30^{\circ}$'
      - section: 'Solution'
