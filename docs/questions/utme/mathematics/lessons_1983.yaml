  33:
    moments:
      - say: 'Without tables, we want log base 7 of 49, plus log base 7 of 1 over 7.'
        write: '$\log_{7}49 + \log_{7}\tfrac{1}{7}$'
      - say: 'A logarithm answers a question: what power of the base gives this number? So log base 7 of $N$ is the power we raise 7 to, to get $N$. Picture a staircase where each step up multiplies by 7.'
        doodle: {name: 'custom:1983_q33_a', id: steps, caption: 'each step up is ×7'}
        write: '$\log_{7}N = p$ means $7^{p} = N$'
      - say: 'For log base 7 of 49: 7 to what power is 49? 7 times 7 is 49, so 7 squared is 49.'
        write: '$7^{2} = 7 \times 7 = 49$'
      - say: 'From 1, two steps up reach 49. So log base 7 of 49 is 2.'
        doodle_do: [{id: steps, op: circle, part: st3}]
        write: '$\log_{7}49 = 2$'
      - say: 'For log base 7 of 1 over 7: 1 over a number is that number to the power negative 1. So 7 to the negative 1 is 1 over 7.'
        write: '$7^{-1} = \tfrac{1}{7}$'
      - say: 'From 1, one step down reaches 1 over 7. So log base 7 of 1 over 7 is negative 1.'
        doodle_do: [{id: steps, op: circle, part: st0}]
        write: '$\log_{7}\tfrac{1}{7} = -1$'
      - say: 'Now put the two values back into the sum: 2 plus negative 1 is 1.'
        write: '$\log_{7}49 + \log_{7}\tfrac{1}{7} = 2 + (-1) = 1$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '=2'}, at: '=[[2]]+'}
          - {line: 6, kind: move, from: {line: 5, at: '=−1'}, at: '(−1)'}
      - say: 'The product law of logs: the log of one number plus the log of another is the log of their product.'
        write: 'Product law: $\log_{a}m + \log_{a}n = \log_{a}(mn)$'
      - say: 'Let''s check with the rule: log $a$ plus log $b$ equals the log of $a$ times $b$.'
        write: 'Check: $\log_{7}49 + \log_{7}\tfrac{1}{7} = \log_{7}\left(49 \times \tfrac{1}{7}\right)$'
      - say: 'On the stairs, 7 is one step up from 1. 49 times 1 over 7 is 7, and log base 7 of 7 is 1, because 7 to the power 1 is 7. It agrees.'
        doodle_do: [{id: steps, op: pulse, part: st2}]
        write: '$= \log_{7}7 = 1$'
      - say: 'So the value is 1, which is answer choice A.'
        write: 'Value $= 1$'
        answer: true
    traps:
      B: 'You went for 2. That''s only log base 7 of 49. We still have to add log base 7 of 1 over 7, which is negative 1, so the total is 1.'
      C: 'You went for 3. That takes log base 7 of 1 over 7 as positive 1. But 1 over 7 is 7 to the negative 1, so its log is negative 1, and 2 plus negative 1 is 1.'
      D: 'You went for 7. 49 times 1 over 7 is indeed 7, but the question wants the log of that. Log base 7 of 7 is 1.'
      E: 'You went for 0. The two logs don''t cancel: log base 7 of 49 is 2, and log base 7 of 1 over 7 is negative 1. Together they make 1.'
  34:
    moments:
      - section: 'The question'
        say: 'Factorise completely. Fourth powers are a clue: this factorises more than once, and "completely" means we keep going until nothing more factorises.'
        write: '$81a^{4} - 16b^{4}$'
      - section: 'Solution'
        say: 'Both terms are perfect squares, with a minus between them. That is a difference of two squares. Write the rule first.'
        write: 'Solution'
      - say: 'The rule: $p$ squared minus $q$ squared equals $p$ minus $q$, times $p$ plus $q$.'
        write: '$p^{2} - q^{2} = (p - q)(p + q)$'
      - say: '81 is 9 squared and $a$ to the 4 is $a$ squared, squared. So $81a^4$ is $9a^2$, all squared.'
        write: '$81a^{4} = (9a^{2})^{2}$'
      - say: '16 is 4 squared and $b$ to the 4 is $b$ squared, squared. So $16b^4$ is $4b^2$, all squared.'
        write: '$16b^{4} = (4b^{2})^{2}$'
      - say: 'So our expression is one square minus another. Picture a big square with a small square taken out.'
        write: '$81a^{4} - 16b^{4} = (9a^{2})^{2} - (4b^{2})^{2}$'
        doodle: {name: 'custom:1983_q34_a', id: squares, caption: 'square minus square'}
      - say: 'Here $p$ is $9a^2$ and $q$ is $4b^2$. By the rule, it is the difference times the sum.'
        write: '$= (9a^{2} - 4b^{2})(9a^{2} + 4b^{2})$'
        doodle_do:
          - {id: squares, op: label, part: big, text: 'p = 9a²'}
          - {id: squares, op: label, part: small, text: 'q = 4b²'}
      - section: 'Keep going'
        say: 'Look at the first bracket: $9a^2$ minus $4b^2$ is $3a$ squared minus $2b$ squared. Another difference of two squares.'
        write: '$9a^{2} - 4b^{2} = (3a)^{2} - (2b)^{2}$'
        point:
          - {line: 6, kind: underline, at: '(9a2−4b2)', text: 'factorise again'}
      - say: 'By the same rule, it is $3a$ minus $2b$, times $3a$ plus $2b$.'
        write: '$= (3a - 2b)(3a + 2b)$'
      - say: 'The second bracket, $9a^2$ plus $4b^2$, is a sum of two squares. A sum of two squares does not factorise, so it stays.'
        write: '$9a^{2} + 4b^{2}$ does not factorise'
      - say: 'Therefore, put the pieces together.'
        write: '$\therefore (3a - 2b)(3a + 2b)(9a^{2} + 4b^{2})$'
        point:
          - {line: 10, kind: move, from: {line: 8, at: '(3a−2b)(3a+2b)'}, at: '(3a−2b)(3a+2b)', text: 'from here'}
      - section: 'Check'
        say: 'Expand back. $3a$ minus $2b$, times $3a$ plus $2b$, is $9a^2$ minus $4b^2$.'
        write: '$(3a - 2b)(3a + 2b) = 9a^{2} - 4b^{2}$'
      - say: 'Then multiply by the last bracket: $9a^2$ minus $4b^2$, times $9a^2$ plus $4b^2$.'
        write: '$(9a^{2} - 4b^{2})(9a^{2} + 4b^{2})$'
      - say: 'That is $81a^4$ minus $16b^4$. We are back to the question.'
        write: '$= 81a^{4} - 16b^{4}\ \checkmark$'
      - say: 'So the complete factorisation is option C.'
        write: '$\therefore (3a - 2b)(3a + 2b)(9a^{2} + 4b^{2})$ (C)'
        answer: true
    traps:
      A: 'You went for the option with $2a - 3b$. The letters and numbers have been swapped. The square root of $9a^2$ is $3a$ and of $4b^2$ is $2b$, so the brackets are $3a - 2b$ and $3a + 2b$.'
      B: 'You went for the option with $2a - 3b$ and $4a^2 - 9b^2$. The numbers have been swapped between $a$ and $b$. $81a^4$ is $9a^2$ squared, so the brackets are $3a - 2b$, $3a + 2b$ and $9a^2 + 4b^2$.'
      D: 'You went for $3a - 2b$ times $2a - 3b$. The second bracket should be $3a + 2b$: a difference of two squares always splits into a minus bracket and a plus bracket with the same terms.'
      E: 'You went for the option ending in $9a^2 - 4b^2$. That bracket is itself a difference of two squares, so it is not completely factorised. The bracket that stays is the sum, $9a^2 + 4b^2$.'
  35:
    moments:
      - say: 'A convex hexagon has one angle of 170 degrees, and the other five angles are all $x$ degrees. We want $x$.'
        write: 'One angle $170^{\circ}$, five angles of $x^{\circ}$'
      - say: 'Let me draw the hexagon with its six angles.'
