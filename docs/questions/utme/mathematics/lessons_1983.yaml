      C: 'You went for 24 degrees. Remember the tangent makes 90 degrees with the radius, so the angle at $P$ is $x + 90$. Then $4x + 120 = 180$ gives $x = 15$, and $2x$ is 30.'
      D: 'You went for 12 degrees. The angle at $T$ in triangle $PQT$ is $x + 2x$, which is $3x$, and the angle at $P$ is $x + 90$. That gives $x = 15$, and angle $PTO$ is $2x$, 30 degrees.'
      E: 'You went for 60 degrees. That''s $4x$, not $2x$. From $4x = 60$, $x$ is 15, and angle $PTO$ is 2 times 15, which is 30.'
  50:
    moments:
