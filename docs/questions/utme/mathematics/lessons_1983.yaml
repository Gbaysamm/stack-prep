        write: 'Perimeter $= \text{arc } RSP + PT + TR$'
      - say: 'First the arc. The length of an arc is theta over 360, times 2 pi r. A semicircle is half the circle, so theta is 180 degrees.'
        write: 'Arc $= \dfrac{\theta}{360^{\circ}} \times 2\pi r$'
      - say: 'Put in theta equals 180, pi equals 22 over 7, and $r$ equals 3.5.'
        write: '$= \dfrac{180}{360} \times 2 \times \dfrac{22}{7} \times 3.5$'
        point:
          - {line: 4, kind: move, from: {line: 0, at: 'r=3.5'}, at: '3.5', text: 'r'}
      - say: '180 over 360 is a half. 2 times 3.5 is 7, which cancels the 7 under 22, leaving 22. Half of 22 is 11.'
        write: '$= \dfrac{1}{2} \times 22 = 11$ cm'
        point:
          - {figure: 0, kind: label, target: S, text: 'arc 11 cm'}
      - say: 'Now triangle $PTR$. It has 60 degrees at $P$ and at $R$. The three angles add up to 180, by the angle sum of a triangle.'
        write: '$\angle PTR + 60^{\circ} + 60^{\circ} = 180^{\circ}$ ($\angle$ sum of $\triangle$)'
      - say: '60 plus 60 is 120, and 180 minus 120 is 60.'
        write: '$\angle PTR = 180^{\circ} - 120^{\circ} = 60^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: PTR, text: '60°'}
