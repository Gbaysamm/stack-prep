          - {line: 5, kind: move, from: {line: 4, at: '=6v'}, at: '6v'}
      - say: '$4v$ plus $6v$ is $10v$.'
        write: '$10v = 600$'
      - say: 'Divide both sides by 10. 600 divided by 10 is 60.'
        write: '$v = \dfrac{600}{10} = 60$'
      - say: 'Careful: 60 is his first speed. In the last 3 hours he drove at $2v$, which is 2 times 60, or 120 km per hour.'
        write: 'Last 3 hours: $2v = 2 \times 60 = 120$ km/h'
