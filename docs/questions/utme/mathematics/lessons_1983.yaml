        point:
          - {figure: 0, kind: highlight, target: PR, text: 'crosses both'}
          - {figure: 0, kind: arc, target: RPQ, text: '25°'}
      - say: 'Now triangle $PRQ$. It has 25 at $P$ and 100 at $R$, and its angles add up to 180, by the angle sum of a triangle.'
