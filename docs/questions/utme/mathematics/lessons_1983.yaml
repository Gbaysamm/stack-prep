      - say: 'In a right-angled triangle, Pythagoras works, and the hypotenuse is the longest side. Here that''s $3x + 1$.'
        write: 'Hypotenuse $= 3x + 1$, the longest side'
        point:
          - {figure: sketch, kind: highlight, target: AB, text: 'hypotenuse'}
      - say: 'So the square on $3x + 1$ equals the sum of the squares on the other two sides.'
        write: '$(3x + 1)^{2} = (3x - 1)^{2} + x^{2}$'
      - say: 'Expand the left. $3x$ squared is $9x^2$, twice $3x$ times 1 is $6x$, and 1 squared is 1.'
        write: '$(3x + 1)^{2} = 9x^{2} + 6x + 1$'
      - say: 'Expand $3x - 1$ squared the same way, but the middle term is now negative $6x$.'
        write: '$(3x - 1)^{2} = 9x^{2} - 6x + 1$'
      - say: 'Put both expansions back into the Pythagoras equation.'
        write: '$9x^{2} + 6x + 1 = 9x^{2} - 6x + 1 + x^{2}$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '=9x2+6x+1'}, at: '9x2+6x+1'}
          - {line: 7, kind: move, from: {line: 6, at: '=9x2−6x+1'}, at: '9x2−6x+1'}
      - say: 'Subtract $9x^2$ and 1 from both sides. They cancel from each side.'
        write: '$6x = -6x + x^{2}$'
      - say: 'Add $6x$ to both sides. $6x$ plus $6x$ is $12x$.'
        write: '$12x = x^{2}$'
      - say: 'Bring everything to one side.'
        write: '$x^{2} - 12x = 0$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '12x'}, at: '−12x', text: 'across'}
      - say: 'Both terms have $x$ in them, so take $x$ out as a factor.'
        write: '$x(x - 12) = 0$'
      - say: 'So $x$ is 0 or 12. A side of length 0 makes no triangle, so $x$ is 12.'
        write: '$x = 0$ (no triangle) or $x = 12$'
