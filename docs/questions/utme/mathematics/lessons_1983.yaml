        write: '$\angle SRP = 25^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: SRP, text: '25°'}
      - say: '$PR$ crosses the parallel lines $SR$ and $PQ$, making a Z. Alternate angles are equal, so angle $RPQ$ is also 25.'
