  28:
    moments:
      - say: 'We have 16 test scores, and we want the median plus the mode.'
        write: 'Scores: $65, 65, 55, 60, 60, 65, 60, 70, 75, 70, 65, 70, 60, 65, 65, 70$'
      - say: 'With so many repeats, it''s easiest to tally each score first. 55 appears once, 60 four times, 65 six times, 70 four times and 75 once. Picture each score as a pile of counters.'
        doodle: {name: 'custom:1983_q28_a', id: piles, caption: 'one counter per student'}
        write: 'Tally: $55 \to 1,\ \ 60 \to 4,\ \ 65 \to 6,\ \ 70 \to 4,\ \ 75 \to 1$'
      - say: 'Check the count: 1 plus 4 plus 6 plus 4 plus 1 is 16. Good.'
        write: 'Total: $1 + 4 + 6 + 4 + 1 = 16$'
      - say: 'Look at the tallest pile. The mode is the score that appears most often. From the tally, 65 appears six times, more than any other.'
        doodle_do: [{id: piles, op: circle, part: s65}]
        write: 'Mode $= 65$, which appears 6 times'
        point:
          - {line: 1, kind: circle, at: '65→6', text: 'most often'}
          - {line: 3, kind: highlight, at: 'Mode=65', to: {doodle: piles, part: s65}}
      - say: 'Now the median. With 16 scores, an even number, it''s the average of the 8th and 9th scores in order.'
        write: 'Median $= \dfrac{8\text{th} + 9\text{th}}{2}$'
      - say: 'Use the tally to place the scores in order. 55 is 1st, and the four 60s are the 2nd to the 5th.'
        write: '1st: $55$; 2nd to 5th: $60$'
      - say: 'The six 65s come next. They fill the 6th to the 11th places, since 5 plus 6 is 11.'
        doodle_do: [{id: piles, op: label, part: s65, text: '6th to 11th'}]
        write: '6th to 11th: $65$, since $5 + 6 = 11$'
      - say: 'Both land in the tallest pile. So the 8th and 9th scores both sit in the 65s.'
        doodle_do: [{id: piles, op: pulse, part: s65}]
        write: '8th $= 65$, 9th $= 65$'
      - say: 'Put them into the median formula: 65 plus 65, over 2, is 65.'
        write: 'Median $= \dfrac{65 + 65}{2} = 65$'
      - say: 'The question wants the median plus the mode. Going back, the mode is 65 too, so that''s 65 plus 65, which is 130.'
        write: 'Median $+$ mode $= 65 + 65 = 130$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '=65'}, at: '[[65]]+65', text: 'median'}
          - {line: 9, kind: move, from: {line: 3, at: 'Mode=[[65]]'}, at: '65+[[65]]', text: 'mode'}
      - say: 'So the answer is 130, which is answer choice B.'
        write: 'Sum $= 130$'
        answer: true
    traps:
      A: 'You went for 125. That''s 60 plus 65, as if the median were 60. In order, the 8th and 9th scores are both 65, so the median is 65, and 65 plus 65 is 130.'
      C: 'You went for 140. That''s 70 plus 70. But the most frequent score is 65, which appears six times, and the median is also 65. So the sum is 130.'
      D: 'You went for 150. That would need both the median and the mode to be 75, the top score. Both are 65, so the sum is 130.'
      E: 'You went for 137.5. That takes the 8th and 9th entries from the unsorted list, 70 and 75. The scores must be put in order first, and then the 8th and 9th are both 65.'
  29:
    moments:
      - say: 'The letters of MATRICULATION are cut out and put in a box. We draw one at random and want the probability that it''s a vowel. Picture the slips in the box.'
        doodle: {name: 'custom:1983_q29_a', id: box, caption: 'MATRICULATION: 13 letters in a box'}
        write: 'MATRICULATION'
      - say: 'Probability is the number of ways we can succeed, over the total number of possibilities. Here, that''s the number of vowels over the number of letters.'
        write: '$P(\text{vowel}) = \dfrac{\text{number of vowels}}{\text{number of letters}}$'
      - say: 'Let''s spell it out letter by letter: M, A, T, R, I, C, U, L, A, T, I, O, N.'
        write: 'Letters: M, A, T, R, I, C, U, L, A, T, I, O, N'
      - say: 'Counting them, there are 13 letters, and each one is a separate piece of paper in the box.'
        doodle_do: [{id: box, op: label, part: box, text: '13 slips'}]
        write: 'Number of letters $= 13$'
      - say: 'The vowels are A, E, I, O and U. Picking out every vowel as it appears, we get A, I, U, A, I and O.'
        write: 'Vowels: A, I, U, A, I, O'
      - say: 'A and I each appear twice, and each copy is its own piece of paper, so each copy counts.'
        write: 'A twice, I twice, U once, O once'
      - say: '2 plus 2 plus 1 plus 1 is 6 vowels.'
        doodle_do: [{id: box, op: label, part: slips, text: '6 vowels'}]
        write: 'Number of vowels $= 2 + 2 + 1 + 1 = 6$'
      - say: 'Quick check: the other 13 minus 6, which is 7 letters, are consonants: M, T, R, C, L, T and N. That''s 7.'
        write: 'Consonants: $13 - 6 = 7$ (M, T, R, C, L, T, N)'
      - say: 'For the slip we draw, put the two counts into the probability: 6 vowels over 13 letters. That''s 6 over 13, which is answer choice C.'
        doodle_do: [{id: box, op: circle, part: drawn}]
        write: '$P(\text{vowel}) = \dfrac{6}{13}$'
        point:
          - {line: 8, kind: move, from: {line: 6, at: '=6'}, at: '13[[6]]', text: 'vowels'}
          - {line: 8, kind: move, from: {line: 3, at: '=13'}, at: '[[13]]6', text: 'letters'}
        answer: true
    traps:
      A: 'You went for 2 over 13. That counts only the letters that repeat, A and I. There are 6 vowels in all: A, I, U, A, I and O.'
      B: 'You went for 5 over 13. One vowel was missed. Counting carefully, the vowels are A, I, U, A, I and O, which is 6.'
      D: 'You went for 8 over 13. That''s too many: some consonants have been counted as vowels. The vowels are A, I, U, A, I and O, which is 6.'
      E: 'You went for 4 over 13. That counts each kind of vowel once: A, I, U and O. But every letter is cut out separately, so the second A and the second I count too, making 6.'
  30:
    moments:
      - section: 'The question'
        say: 'Four options differ only in the last digit: 4.46, 4.47, 4.48, 4.49. So every rounding must be done exactly as the question says, in the right order.'
        doodle: {name: 'custom:1983_q30_a', id: figs, caption: 'keep three figures'}
        write: 'Correct $59.81789$ and $0.0746829$ to 3 s.f., multiply, give 3 s.f.'
      - say: 'The rule for significant figures: start counting at the first digit that is not zero. Mark a cut after the figures you keep, and look at the next digit.'
        write: 'Solution'
      - say: 'If the next digit is 5 or more, add 1 to the last digit you keep. If it is less than 5, leave the last digit as it is.'
        write: 'Next digit $\ge 5$: add 1. Next digit $< 5$: leave it.'
      - section: 'Round each number'
        say: 'In 59.81789, the first three significant figures are 5, 9 and 8. Cut after the 8. The next digit is 1, less than 5, so the 8 stays.'
        doodle_do: [{id: figs, op: label, part: cut1, text: 'next is 1: leave it'}]
        write: '$59.8|1789 \approx 59.8$ (3 s.f.)'
      - say: 'In 0.0746829, the zeros in front do not count. The first three significant figures are 7, 4 and 6. The next digit is 8, so add 1: the 6 becomes 7.'
        doodle_do: [{id: figs, op: label, part: cut2, text: 'next is 8: add 1'}]
        write: '$0.0746|829 \approx 0.0747$ (3 s.f.)'
      - section: 'Multiply'
        say: 'Now multiply the two rounded numbers.'
        write: 'Product $= 59.8 \times 0.0747$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '≈ 59.8'}, at: '59.8'}
          - {line: 5, kind: move, from: {line: 4, at: '≈ 0.0747'}, at: '0.0747'}
      - say: 'Multiply 598 by 747, leaving out the points. 598 times 7 is 4,186. Times 40 is 23,920. Times 700 is 418,600. Add them: 446,706.'
        write: '$\begin{array}{r} 598 \\ \times\ \ 747 \\ \hline 4186 \\ 23920 \\ 418600 \\ \hline 446706 \end{array}$'
      - say: 'Now the points. 59.8 has 1 decimal place and 0.0747 has 4, so the product has 5 decimal places.'
        write: '$59.8 \times 0.0747 = 4.46706$'
      - section: 'Round the answer'
        say: 'Round to 3 significant figures: 4, 4 and 6. Cut after the 6. The next digit is 7, which is 5 or more, so the 6 becomes 7.'
        write: '$4.46|706 \approx 4.47$ (3 s.f.)'
      - section: 'Check'
        say: 'Check the size: 60 times 0.075 is 4.5, close to our 4.47. The answer is the right size.'
        write: 'Check: $60 \times 0.075 = 4.5 \approx 4.47 \ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the answer, to 3 significant figures, is 4.47, which is option C.'
        write: '$\therefore$ Product $= 4.47$ (3 s.f.)'
        answer: true
    traps:
      A: 'You went for 4.46. That cuts off 4.46706 without rounding. The next digit after the cut is 7, which is 5 or more, so add 1: 4.47.'
      B: 'You went for 4.48. That comes from rounding 0.0746829 to 0.0748. Only the digit straight after the cut counts: after 7, 4, 6 comes 8, so the 6 becomes 7, giving 0.0747.'
      D: 'You went for 4.49. Rounding gives 59.8 and 0.0747, and 59.8 times 0.0747 is 4.46706, which is 4.47 to 3 significant figures.'
      E: 'You went for 4.50. That rounds to too few figures. 4.46706 to 3 significant figures is 4.47.'
  31:
    moments:
      - section: 'The question'
        say: 'A rod that is really 250 cm long is measured as 255 cm. Is the error 5 percent? Many students think so. Let''s see what the percentage error really is.'
        doodle: {name: 'custom:1983_q31_a', id: rod, caption: 'really 250 cm, measured as 255 cm'}
        write: 'Actual length $= 250$ cm, measured length $= 255$ cm'
      - say: 'We write the formula first. Percentage error is the error divided by the actual value, times 100 percent.'
        write: 'Solution'
      - say: 'Here is the formula. The error is always compared with the actual, true value.'
        write: 'Percentage error $= \dfrac{\text{error}}{\text{actual value}} \times 100\%$'
      - section: 'Find the error'
        say: 'The error is the difference between the measured value and the actual value: 255 minus 250, which is 5 cm.'
        doodle_do: [{id: rod, op: label, part: tape, text: '5 cm too long'}]
        write: 'Error $= 255 - 250 = 5$ cm'
      - section: 'Substitute'
        say: 'Now substitute. The error, 5, goes on top. The actual value, 250, goes underneath.'
        doodle_do: [{id: rod, op: circle, part: 'true'}]
        write: 'Percentage error $= \dfrac{5}{250} \times 100\%$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= [[5]] cm'}, at: '250[[5]]', text: 'error'}
          - {line: 4, kind: move, from: {line: 0, at: '[[250]] cm'}, at: '[[250]]5', text: 'actual value'}
      - say: 'Cancel first. 5 goes into 5 once, and into 250 fifty times. So 5 over 250 is 1 over 50.'
        write: '$= \dfrac{1}{50} \times 100\%$'
      - say: '100 divided by 50 is 2.'
        write: '$= 2\%$'
      - say: 'Therefore the percentage error is 2 percent.'
        write: '$\therefore$ Percentage error $= 2\%$'
      - section: 'Check'
        say: 'Look at the tape again. Check: 1 percent of 250 cm is 2.5 cm, and our error of 5 cm is 2 times 2.5. So the error is 2 percent.'
        doodle_do: [{id: rod, op: pulse, part: tape}]
        write: 'Check: $1\%$ of $250 = 2.5$, and $5 = 2 \times 2.5 \ \checkmark$'
      - section: 'Answer'
        say: 'So the percentage error is 2, which is option E.'
        write: '$\therefore$ Percentage error $= 2\%$'
        answer: true
    traps:
      A: 'You went for 55. That looks like the end of 255, not a calculation. The error is 5 cm, and 5 over 250, times 100 percent, is 2 percent.'
      B: 'You went for 10. That is five times too big. The error is 5 cm out of an actual 250 cm, and 5 over 250 times 100 percent is 2 percent.'
      C: 'You went for 5. That is the error in centimetres, not a percentage. Divide it by the actual length and multiply by 100: 5 over 250 times 100 is 2.'
      D: 'You went for 4. That is twice the answer. The error is 255 minus 250, which is 5, and 5 over 250 times 100 percent is 2 percent.'
  32:
    moments:
      - say: 'We''re told 2 over 3 to the power $m$, times 3 over 4 to the power $n$, equals 256 over 729. We want $m$ and $n$.'
        write: '$\left(\tfrac{2}{3}\right)^{m}\left(\tfrac{3}{4}\right)^{n} = \tfrac{256}{729}$'
      - say: 'The plan: write both sides as powers of the primes 2 and 3, then match the powers on each side.'
        write: 'Plan: powers of 2 and 3 on both sides'
      - say: '2 over 3, to the $m$, is 2 to the $m$ over 3 to the $m$.'
        write: '$\left(\tfrac{2}{3}\right)^{m} = \dfrac{2^{m}}{3^{m}}$'
      - say: '3 over 4, to the $n$, is 3 to the $n$ over 4 to the $n$. And 4 is 2 squared, so 4 to the $n$ is 2 to the $2n$.'
        write: '$\left(\tfrac{3}{4}\right)^{n} = \dfrac{3^{n}}{4^{n}} = \dfrac{3^{n}}{2^{2n}}$'
      - say: 'Multiply them. For the 2s, $2^m$ on top and $2^{2n}$ below give 2 to the $m - 2n$. For the 3s, $3^n$ on top and $3^m$ below give 3 to the $n - m$.'
        write: 'Left side $= \dfrac{2^{m}}{3^{m}} \times \dfrac{3^{n}}{2^{2n}} = 2^{m - 2n} \times 3^{n - m}$'
      - say: 'Now the right side. Picture 256 as a tower of 2s. Doubling from 2: 2, 4, 8, 16, 32, 64, 128, 256. That''s eight 2s, so 256 is 2 to the 8.'
        doodle: {name: 'custom:1983_q32_a', id: towers, caption: 'how many 2s? how many 3s?'}
        write: '$256 = 2^{8}$'
      - say: 'And 729 as a tower of 3s. And tripling from 3: 3, 9, 27, 81, 243, 729. That''s six 3s, so 729 is 3 to the 6.'
        doodle_do: [{id: towers, op: highlight, part: threes}]
        write: '$729 = 3^{6}$'
      - say: 'Dividing by 3 to the 6 is the same as multiplying by 3 to the negative 6.'
        write: 'Right side $= \dfrac{2^{8}}{3^{6}} = 2^{8} \times 3^{-6}$'
      - say: 'Now match the powers of 2 on both sides: $m$ minus $2n$ equals 8.'
        doodle_do: [{id: towers, op: label, part: twos, text: '8 twos'}]
        write: 'Powers of 2: $m - 2n = 8 \quad (1)$'
        point:
          - {line: 4, kind: circle, at: '2m−2n'}
          - {line: 7, kind: circle, at: '28×'}
      - say: 'And match the powers of 3: $n$ minus $m$ equals negative 6.'
        doodle_do: [{id: towers, op: label, part: threes, text: '6 threes'}]
        write: 'Powers of 3: $n - m = -6 \quad (2)$'
        point:
          - {line: 4, kind: circle, at: '3n−m'}
          - {line: 7, kind: circle, at: '3−6'}
      - say: 'Add the two equations, and the $m$ terms cancel. Negative $2n$ plus $n$ is negative $n$, and 8 plus negative 6 is 2.'
        write: '(1) $+$ (2): $-n = 2$'
      - say: 'So $n$ is negative 2.'
        write: '$n = -2$'
      - say: 'Rearrange equation two: $m$ is $n$ plus 6. Negative 2 plus 6 is 4.'
        write: 'From (2): $m = n + 6 = -2 + 6 = 4$'
      - say: 'Check: 2 over 3 to the 4 is 16 over 81. 3 over 4 to the negative 2 flips to 4 over 3, squared, which is 16 over 9.'
        write: 'Check: $\left(\tfrac{2}{3}\right)^{4} = \tfrac{16}{81}$, $\left(\tfrac{3}{4}\right)^{-2} = \left(\tfrac{4}{3}\right)^{2} = \tfrac{16}{9}$'
      - say: '16 times 16 is 256, and 81 times 9 is 729. So the product is 256 over 729, as required.'
        write: '$\tfrac{16}{81} \times \tfrac{16}{9} = \tfrac{256}{729}$'
      - say: 'So $m = 4$ and $n = -2$, which is answer choice D.'
        write: '$m = 4,\ n = -2$'
        answer: true
    traps:
      A: 'You went for $m = 4$ and $n = 2$. The sign of $n$ was lost. With $n = 2$ we''d get 16 over 81 times 9 over 16, which is 9 over 81. The negative power is what flips 3 over 4 upside down to make 256.'
