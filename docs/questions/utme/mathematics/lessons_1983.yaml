          - {figure: sketch_b, kind: circle, target: '?', text: 'clockwise'}
      - say: 'The ship ends up south and west of the port, so it''s in the south-west quarter. Its bearing must be between 180 and 270 degrees.'
        write: '$180^{\circ} < \text{bearing} < 270^{\circ}$'
        point:
          - {figure: sketch_b, kind: circle, target: H, text: 'south-west'}
      - say: 'Draw the right-angled triangle: 30 km down from $P$, then 60 km across to $H$. Let theta be the angle at $P$ between due south and the line $PH$.'
        write: 'Angle $\theta$ at $P$: from due south, towards $H$'
        point:
