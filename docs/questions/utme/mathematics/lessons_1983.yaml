# UTME 1983 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1983.yaml. Answers match that file.
# This is a five-option paper (A-E), so each lesson has four traps.
format_version: 1
exam_year: 1983
lessons:
  1:
    moments:
      - say: 'We have five measurements: 5, 9, 3, 5 and 8. We want the median, $M$, and the mode, $D$, written as a pair. Picture them as five cards.'
        doodle: {name: 'custom:1983_q01_a', id: cards, caption: 'five measurements'}
        write: 'Data: $5,\ 9,\ 3,\ 5,\ 8$'
      - say: 'First, what do the words mean? The median is the middle value, once the numbers are put in order.'
        write: 'Median $M$: the middle value, in order'
      - say: 'And the mode is the value that appears most often.'
        write: 'Mode $D$: the most frequent value'
      - say: 'So let''s put the cards in order, smallest first. The smallest is 3, then the two 5s, then 8, then 9.'
        doodle_do: [{id: cards, op: stage, stage: 'custom:1983_q01_a2'}]
        write: 'In order: $3,\ 5,\ 5,\ 8,\ 9$'
      - say: 'How many values are there? Five. With five values, the middle one is the third, because two values sit on each side of it.'
        write: '$n = 5$, so the middle is the 3rd value'
      - say: 'Now count along the bottom row of cards: 3 is first, 5 is second, and 5 is third. So the median is 5.'
        doodle_do: [{id: cards, op: circle, part: mid}]
        write: 'Median: $M = 5$'
        point:
          - {line: 4, kind: circle, at: '3rd', text: 'the middle'}
          - {line: 5, kind: highlight, at: 'M=5', to: {doodle: cards, part: mid}}
      - say: 'Now the mode. Go back to the ordered list and count each value: 3 appears once, 5 appears twice, 8 once and 9 once.'
        write: 'Counts: $3 \to 1,\ \ 5 \to 2,\ \ 8 \to 1,\ \ 9 \to 1$'
      - say: 'Look at the two green cards. 5 appears more often than any other value, so the mode is 5.'
        doodle_do: [{id: cards, op: highlight, part: s5}, {id: cards, op: highlight, part: mid}]
        write: 'Mode: $D = 5$'
        point:
          - {line: 6, kind: circle, at: '5→2', text: 'most often'}
      - say: 'Putting the two together, $M$ is 5 and $D$ is 5, so the pair is 5, 5, which is answer choice D.'
        write: '$(M,\ D) = (5,\ 5)$'
        answer: true
    traps:
      A: 'You went for 6, 5. The 6 is the mean: the numbers add to 30, and 30 divided by 5 is 6. The median is the middle value once they''re in order, which is 5.'
      B: 'You went for 5, 8. The median is right, but 8 appears only once. The mode is the value that appears most often, and that''s 5, which appears twice.'
      C: 'You went for 5, 7. The median is right, but 7 is not even one of the measurements. The mode is the most frequent value, which is 5.'
      E: 'You went for 7, 5. The mode is right, but the median is the middle value after sorting: 3, 5, 5, 8, 9. The middle one is 5, not 7.'
  2:
    moments:
      - section: 'The question'
        say: 'Two partners share a profit in the ratio 4 to 5, and Y gets ₦5,000 more than X. Many students stop at one share. We want the whole profit.'
        doodle: {name: 'custom:1983_q02_a', id: sacks, caption: 'profit shared X : Y = 4 : 5'}
        write: 'X : Y $= 4 : 5$; Y gets ₦5,000 more than X. Total profit $= ?$'
      - say: 'Let''s set it out the way you would in the exam. First, give the unknown a name.'
        write: 'Solution'
      - say: 'Let the total profit be x naira. The letter x stands for the number we are looking for.'
        write: 'Let the total profit be ₦$x$'
      - section: 'Sum of ratio'
        say: 'Add the parts of the ratio: 4 plus 5 is 9. This is the sum of ratio. The profit is cut into 9 equal parts.'
        doodle_do: [{id: sacks, op: stage, stage: 'custom:1983_q02_a2', 'on': 'sum of ratio'}]
        write: 'Sum of ratio $= 4 + 5 = 9$'
      - say: 'Each share is its part over the sum of ratio, times the total. X has 4 parts, so X gets 4 over 9 of x.'
        doodle_do: [{id: sacks, op: label, part: x, text: '4/9 of x'}]
        write: 'X''s share $= \dfrac{4}{9} \times x = \dfrac{4x}{9}$'
      - say: 'Y has 5 parts, so Y gets 5 over 9 of x.'
        doodle_do: [{id: sacks, op: label, part: 'y', text: '5/9 of x'}]
        write: 'Y''s share $= \dfrac{5}{9} \times x = \dfrac{5x}{9}$'
      - section: 'Form the equation'
        say: 'Look at the extra on Y''s sack. Y received 5,000 naira more than X, so Y''s share minus X''s share is 5,000.'
        doodle_do: [{id: sacks, op: circle, part: diff}]
        write: 'Y''s share $-$ X''s share $= 5000$'
      - say: 'Put in the two shares we wrote: 5x over 9, minus 4x over 9, equals 5,000.'
        write: '$\dfrac{5x}{9} - \dfrac{4x}{9} = 5000$'
      - say: 'The denominators are the same, so subtract the numerators. 5x minus 4x is x. So x over 9 is 5,000.'
        write: '$\dfrac{x}{9} = 5000$'
      - say: 'To get x by itself, multiply both sides by 9.'
        write: '$x = 5000 \times 9$'
      - say: '5,000 times 9 is 45,000.'
        write: '$x = 45000$'
      - section: 'Check'
        say: 'Check each share. X gets 4 over 9 of 45,000. 45,000 divided by 9 is 5,000, and 5,000 times 4 is 20,000.'
        doodle_do: [{id: sacks, op: label, part: x, text: '₦20,000'}]
        write: 'X $= \tfrac{4}{9} \times 45000 = 20000$'
      - say: 'Y gets 5 over 9 of 45,000, which is 5 times 5,000, that is 25,000.'
        doodle_do: [{id: sacks, op: label, part: 'y', text: '₦25,000'}]
        write: 'Y $= \tfrac{5}{9} \times 45000 = 25000$'
      - say: '25,000 minus 20,000 is 5,000, exactly what the question says.'
        write: '$25000 - 20000 = 5000 \ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the total profit for the year is 45,000 naira, which is option E.'
        write: '$\therefore$ Total profit $=$ ₦45,000.00'
        answer: true
    traps:
      A: 'You went for ₦20,000. That is X''s share alone, 4 over 9 of the profit. The question wants the whole profit, which is ₦45,000.'
      B: 'You went for ₦25,000. That is Y''s share alone, 5 over 9 of the profit. The whole profit is ₦45,000.'
      C: 'You went for ₦30,000. Try it: 5 over 9 of 30,000 minus 4 over 9 of 30,000 is only about 3,333, not 5,000. The equation x over 9 equals 5,000 gives 45,000.'
      D: 'You went for ₦15,000. That treats the profit as 3 parts of ₦5,000. The sum of ratio is 4 plus 5, which is 9, so the profit is 9 times 5,000, which is ₦45,000.'
  3:
    moments:
      - say: 'We have a regular hexagon, and we want the size of each of its interior angles.'
        write: 'Regular hexagon: $n = 6$ sides'
      - say: 'Let me draw the regular hexagon, with one side extended at $A$.'
        show_sketch: true
      - say: 'Regular means all six sides are equal and all six angles are equal.'
        write: 'All 6 interior angles are equal'
      - say: 'The easiest way in is from the outside. Walk once round any polygon and you turn through one full turn, so the exterior angles always add up to 360 degrees.'
        write: 'Sum of exterior angles $= 360^{\circ}$'
        point:
          - {figure: sketch, kind: circle, target: '60°', text: 'exterior angle'}
      - say: 'Here the six exterior angles are equal, so each one is 360 divided by 6.'
        write: 'Each exterior angle $= \dfrac{360^{\circ}}{6}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '360∘'}, at: '360∘', text: 'shared by 6'}
      - say: '360 divided by 6 is 60, so each exterior angle is 60 degrees.'
        write: '$= 60^{\circ}$'
      - say: 'An interior angle and its exterior angle sit together on a straight line, so they add up to 180 degrees.'
        write: 'Interior $+$ exterior $= 180^{\circ}$'
        point:
          - {figure: sketch, kind: circle, target: '?', text: 'interior'}
          - {figure: sketch, kind: circle, target: '60°', text: 'exterior'}
      - say: 'So each interior angle is 180 minus the 60 we just found, which is 120 degrees.'
        write: 'Interior $= 180^{\circ} - 60^{\circ} = 120^{\circ}$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '60∘'}, at: '−60∘', text: 'from here'}
          - {figure: sketch, kind: circle, target: '?', text: '120°'}
      - say: 'Let''s check another way. The interior angles of a polygon with $n$ sides add up to $n$ minus 2, times 180 degrees.'
        write: 'Sum of interior angles $= (n - 2) \times 180^{\circ}$'
      - say: 'Put in $n = 6$. 6 minus 2 is 4, and 4 times 180 is 720 degrees.'
        write: '$= (6 - 2) \times 180^{\circ} = 4 \times 180^{\circ} = 720^{\circ}$'
        point:
          - {line: 8, kind: box, text: 'the rule'}
          - {line: 9, kind: move, from: {line: 0, at: 'n=[[6]]'}, at: '([[6]]−2)', text: 'n = 6'}
      - say: 'Shared equally among the six angles, 720 divided by 6 is 120. It agrees.'
        write: 'Each angle $= \dfrac{720^{\circ}}{6} = 120^{\circ}$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '=720∘'}, at: '720∘'}
      - say: 'So each interior angle is 120 degrees, which is answer choice C.'
        write: 'Each interior angle $= 120^{\circ}$'
        answer: true
    traps:
      A: 'You went for 60 degrees. That''s the exterior angle. The interior angle sits beside it on a straight line, so it''s 180 minus 60, which is 120 degrees.'
      B: 'You went for 30 degrees. That''s half of the exterior angle, and far too small for a hexagon''s corner. Each exterior angle is 360 divided by 6, which is 60, and each interior angle is 180 minus 60, which is 120.'
      D: 'You went for 45 degrees. That''s the exterior angle of a regular octagon, 360 divided by 8. A hexagon has 6 sides, so its exterior angle is 60 and its interior angle is 120.'
      E: 'You went for 135 degrees. That''s the interior angle of a regular octagon, with 8 sides. A hexagon has 6 sides, so each interior angle is 180 minus 60, which is 120.'
  4:
    moments:
      - section: 'The question'
        say: 'Three expressions are all equal to each other, joined in one chain. We want $x$ and $y$. One chain like this hides two equations.'
        write: '$4x - 3 = 3x + y = 2y + 5x - 12$'
        doodle: {name: 'custom:1983_q04_a', id: chain, caption: 'one chain, two links'}
      - section: 'Solution'
        say: 'We take the chain one link at a time. Each link gives one equation, so we get two simultaneous equations. We number them, then eliminate.'
        write: 'Solution'
      - say: 'Take the first link: $4x$ minus 3 equals $3x$ plus $y$.'
        write: 'First link: $4x - 3 = 3x + y$'
        doodle_do:
          - {id: chain, op: highlight, part: l1}
      - say: 'Collect the letters on the left and the numbers on the right. Subtract $3x$ and $y$ from both sides, and add 3 to both sides.'
        write: '$4x - 3x - y = 3$'
      - say: '$4x$ minus $3x$ is $x$. So $x$ minus $y$ equals 3. Call it equation one.'
        write: '$x - y = 3 \quad \text{......(1)}$'
      - say: 'Now the second link: $3x$ plus $y$ equals $2y$ plus $5x$ minus 12.'
        write: 'Second link: $3x + y = 2y + 5x - 12$'
        doodle_do:
          - {id: chain, op: highlight, part: l2}
      - say: 'Collect like terms. Subtract $5x$ and $2y$ from both sides.'
        write: '$3x - 5x + y - 2y = -12$'
      - say: '$3x$ minus $5x$ is negative $2x$. $y$ minus $2y$ is negative $y$.'
        write: '$-2x - y = -12$'
      - say: 'Multiply through by negative 1 to make the signs positive. Call it equation two.'
        write: '$2x + y = 12 \quad \text{......(2)}$'
      - section: 'Eliminate y'
        say: 'Equation one has negative $y$ and equation two has plus $y$. Add the two equations, and the $y$ terms cancel. $x$ plus $2x$ is $3x$; 3 plus 12 is 15.'
        write: '(1) + (2): $3x = 15$'
        point:
          - {line: 4, kind: circle, at: '−y', text: 'cancels'}
          - {line: 8, kind: circle, at: '+y', text: 'with this'}
      - say: 'Divide both sides by 3. 15 divided by 3 is 5.'
        write: '$x = \dfrac{15}{3} = 5$'
      - say: 'Now find $y$. Substitute $x$ equals 5 in equation one.'
        write: 'Substitute $x = 5$ in (1):'
      - say: 'That gives 5 minus $y$ equals 3.'
        write: '$5 - y = 3$'
      - say: 'Add $y$ to both sides and subtract 3 from both sides. 5 minus 3 is 2.'
        write: '$y = 5 - 3 = 2$'
      - say: 'Therefore $x$ equals 5 and $y$ equals 2.'
        write: '$\therefore x = 5,\ y = 2$'
      - section: 'Check'
        say: 'Check all three links of the chain. 4 times 5, minus 3, is 17.'
        write: '$4(5) - 3 = 17$'
        doodle_do:
          - {id: chain, op: label, part: e1, text: '17'}
      - say: '3 times 5, plus 2, is 17.'
        write: '$3(5) + 2 = 17$'
        doodle_do:
          - {id: chain, op: label, part: e2, text: '17'}
      - say: '2 times 2, plus 5 times 5, minus 12, is 4 plus 25 minus 12, which is 17. All three are equal.'
        write: '$2(2) + 5(5) - 12 = 17\ \checkmark$'
        doodle_do:
          - {id: chain, op: label, part: e3, text: '17'}
      - say: 'So $x$ is 5 and $y$ is 2: option A.'
        write: '$\therefore x = 5,\ y = 2$ (A)'
        answer: true
    traps:
      B: 'You went for $x$ equals 2 and $y$ equals 5. Those are the right numbers, but swapped. Adding the equations gives $3x$ equals 15, so $x$ is 5, and then $y$ is 2.'
      C: 'You went for $x$ equals negative 2 and $y$ equals negative 5. The first two expressions both give negative 11, but the third gives negative 10 minus 10 minus 12, which is negative 32. The chain breaks.'
      D: 'You went for $x$ equals 5 and $y$ equals negative 2. The $x$ is right, but the sign of $y$ slipped. From $x$ minus $y$ equals 3, $y$ is 5 minus 3, positive 2.'
      E: 'You went for $x$ equals negative 5 and $y$ equals negative 2. Both signs are wrong. Adding the equations gives $3x$ equals positive 15, so $x$ is 5 and $y$ is 2.'
  5:
    moments:
      - section: 'The question'
        say: 'We are told $x$ equals 1 is a root of this cubic, and we want the other two roots. Picture the curve: it crosses the axis three times, and we know one crossing.'
        write: '$x^{3} - 2x^{2} - 5x + 6 = 0$'
        doodle: {name: 'custom:1983_q05_a', id: curve, caption: 'three crossings, one known'}
      - section: 'Solution'
        say: 'By the factor theorem, if 1 is a root then $x$ minus 1 is a factor. We divide it out by long division, and a quadratic is left.'
        write: 'Solution'
      - say: 'So write it down: $x$ equals 1 is a root, therefore $x$ minus 1 is a factor.'
        write: '$x = 1$ is a root $\therefore (x - 1)$ is a factor'
        doodle_do:
          - {id: curve, op: circle, part: r1}
      - section: 'Long division'
        say: 'Divide $x$ cubed minus $2x$ squared minus $5x$ plus 6 by $x$ minus 1. First term: $x$ cubed divided by $x$ is $x$ squared.'
        write: '$x^{3} \div x = x^{2}$'
      - say: 'Multiply $x$ squared by $x$ minus 1. That gives $x$ cubed minus $x$ squared.'
        write: '$x^{2}(x - 1) = x^{3} - x^{2}$'
      - say: 'Subtract it. $x$ cubed cancels. Negative $2x$ squared minus negative $x$ squared is negative $x$ squared. Bring down negative $5x$.'
        write: 'Subtract: $-x^{2} - 5x$'
      - say: 'Next: negative $x$ squared divided by $x$ is negative $x$.'
        write: '$-x^{2} \div x = -x$'
      - say: 'Multiply negative $x$ by $x$ minus 1. That gives negative $x$ squared plus $x$.'
        write: '$-x(x - 1) = -x^{2} + x$'
      - say: 'Subtract. Negative $5x$ minus $x$ is negative $6x$. Bring down plus 6.'
        write: 'Subtract: $-6x + 6$'
      - say: 'Next: negative $6x$ divided by $x$ is negative 6.'
        write: '$-6x \div x = -6$'
      - say: 'Multiply negative 6 by $x$ minus 1. That gives negative $6x$ plus 6.'
        write: '$-6(x - 1) = -6x + 6$'
      - say: 'Subtract, and nothing is left. A remainder of zero confirms that $x$ minus 1 is a factor.'
        write: 'Subtract: remainder $= 0$'
      - say: 'The terms on top, $x$ squared, negative $x$, negative 6, make the quotient.'
        write: 'Quotient $= x^{2} - x - 6$'
      - say: 'So the cubic is $x$ minus 1, times $x$ squared minus $x$ minus 6.'
        write: '$(x - 1)(x^{2} - x - 6) = 0$'
      - say: '$x$ minus 1 gives the root we already have. The other two roots come from the quadratic.'
        write: '$x^{2} - x - 6 = 0$'
      - section: 'Factorise'
        say: 'Here $a$ is 1, $b$ is negative 1 and $c$ is negative 6. The product is $a$ times $c$, negative 6. The sum is $b$, negative 1.'
        write: 'Product $= ac = -6$, Sum $= b = -1$'
      - say: 'Two numbers that multiply to negative 6 and add to negative 1: negative 3 and plus 2.'
        write: 'Factors: $-3$ and $+2$'
      - say: 'Replace the middle term, negative $x$, with negative $3x$ plus $2x$.'
        write: '$x^{2} - 3x + 2x - 6 = 0$'
      - say: 'Group in pairs. From the first pair take out $x$; from the second take out 2. Both brackets are $x$ minus 3.'
        write: '$x(x - 3) + 2(x - 3) = 0$'
      - say: 'Take out the common bracket, $x$ minus 3. What is left is $x$ plus 2.'
        write: '$(x - 3)(x + 2) = 0$'
      - say: 'Either the first bracket is zero or the second one is.'
        write: 'Either $x - 3 = 0$ or $x + 2 = 0$'
      - say: 'Therefore $x$ equals 3 or $x$ equals negative 2. Those are the two missing crossings.'
        write: '$\therefore x = 3$ or $x = -2$'
        doodle_do:
          - {id: curve, op: label, part: r3, text: '3'}
          - {id: curve, op: label, part: r2, text: '−2'}
      - section: 'Check'
        say: 'Put $x$ equals 3 in the cubic: 27 minus 18 minus 15 plus 6 is zero.'
        write: '$x = 3$: $27 - 18 - 15 + 6 = 0\ \checkmark$'
      - say: 'Put $x$ equals negative 2: negative 8 minus 8 plus 10 plus 6 is zero too.'
        write: '$x = -2$: $-8 - 8 + 10 + 6 = 0\ \checkmark$'
      - say: 'So the other roots are 3 and negative 2: option C.'
        write: '$\therefore$ other roots: $3$ and $-2$ (C)'
        answer: true
    traps:
      A: 'You went for negative 3 and 2. Those are the numbers inside the brackets, not the roots. $x$ minus 3 is zero when $x$ is positive 3, and $x$ plus 2 is zero when $x$ is negative 2.'
      B: 'You went for negative 2 and 2. Negative 2 is a root, but 2 is not: 8 minus 8 minus 10 plus 6 is negative 4, not zero. The other root is 3.'
      D: 'You went for 1 and 3. The 1 is the root we were given; the question wants the other two. The quotient factorises as $(x - 3)(x + 2)$, giving 3 and negative 2.'
      E: 'You went for negative 3 and 1. The 1 was already given, and negative 3 is not a root at all. The quotient is $(x - 3)(x + 2)$, giving 3 and negative 2.'
  6:
    moments:
      - section: 'The question'
        say: '$x$ is jointly proportional to the cube of $y$ and the fourth power of $z$. We halve $y$ and double $z$. Many students guess "no change". Let''s see what really happens to $x$.'
        doodle: {name: 'custom:1983_q06_a', id: tiles, caption: 'three y tiles, four z tiles'}
        write: 'Halve $y$, double $z$: how does $x$ change?'
      - say: 'Solution. Every variation question starts the same way: write the statement with the sign of proportionality, then bring in a constant.'
        write: 'Solution'
      - say: 'Jointly proportional to $y$ cubed and $z$ to the fourth means $x$ varies as their product. This sign means "varies as".'
        write: '$x \propto y^{3}z^{4}$'
      - say: 'Replace the sign with "equals $k$ times", where $k$ is the constant of variation. Call this equation one; we come back to it.'
        write: '$\therefore\ x = ky^{3}z^{4} \quad \ldots (1)$'
      - section: 'The new values'
        say: 'Halving $y$ makes it $y$ over 2. Doubling $z$ makes it $2z$. On the tiles, every $y$ is halved and every $z$ is doubled. Put both into the equation.'
        doodle_do: [{id: tiles, op: stage, stage: 'custom:1983_q06_a2', 'on': 'tiles'}]
        write: 'New $x = k\left(\dfrac{y}{2}\right)^{3}(2z)^{4}$'
      - say: 'Each bracket takes its own power. $y$ over 2, cubed, is $y$ cubed over 2 cubed, and 2 cubed is 8.'
        doodle_do: [{id: tiles, op: label, part: ys, text: '½ × ½ × ½ = ⅛'}]
        write: '$\left(\dfrac{y}{2}\right)^{3} = \dfrac{y^{3}}{2^{3}} = \dfrac{y^{3}}{8}$'
      - say: '$2z$ to the power 4 is 2 to the power 4 times $z$ to the power 4. 2 times 2 times 2 times 2 is 16.'
        doodle_do: [{id: tiles, op: label, part: zs, text: '2 × 2 × 2 × 2 = 16'}]
        write: '$(2z)^{4} = 2^{4}z^{4} = 16z^{4}$'
      - say: 'Put both results back into the new $x$.'
        write: 'New $x = k \times \dfrac{y^{3}}{8} \times 16z^{4}$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '=8y3'}, at: '8y3', text: 'y part'}
          - {line: 7, kind: move, from: {line: 6, at: '=16z4'}, at: '16z4', text: 'z part'}
      - say: 'Collect the numbers. 16 divided by 8 is 2.'
        write: '$= \dfrac{16}{8}\,ky^{3}z^{4} = 2ky^{3}z^{4}$'
      - say: 'Now look back at equation one. $k$ $y$ cubed $z$ to the fourth is the old $x$. So the new $x$ is 2 times the old $x$.'
        write: '$\therefore$ new $x = 2 \times$ old $x$'
        point:
          - {line: 3, kind: arrow, from: {line: 8, at: '2[[ky3z4]]'}, at: 'ky3z4', text: 'old x'}
      - say: 'Therefore new $x$ to old $x$ is 2 to 1. $x$ has doubled, so it is an increase.'
        write: 'New $x$ : old $x = 2 : 1$, an increase'
      - section: 'Check'
        say: 'Check with numbers. Take $k$ as 1, $y$ as 2 and $z$ as 1. Then $x$ is 2 cubed times 1, which is 8.'
        write: 'Check: $k = 1,\ y = 2,\ z = 1$: $\ x = 2^{3} \times 1^{4} = 8$'
      - say: 'Now halve $y$ to 1 and double $z$ to 2. 1 cubed times 2 to the fourth is 16. 8 became 16, so $x$ doubled.'
        write: '$y = 1,\ z = 2$: $\ x = 1^{3} \times 2^{4} = 16 = 2 \times 8\ \checkmark$'
      - say: 'So $x$ increases in the ratio 2 to 1, which is option B.'
        write: '$\therefore$ $x$ increases in the ratio $2 : 1$'
        answer: true
    traps:
      A: 'You went for 4 to 1. That gives a factor the wrong power, such as squaring the half instead of cubing it: 16 over 4 is 4. Halving $y$ divides by 2 cubed, which is 8, doubling $z$ multiplies by 16, and 16 over 8 is 2.'
      C: 'You went for 1 to 4, a decrease. But doubling $z$ multiplies $x$ by 16, which outweighs dividing by 8 from halving $y$. Overall $x$ is multiplied by 2, an increase.'
      D: 'You went for no change. The two changes would only cancel if their factors matched. Here halving $y$ divides $x$ by 8, and doubling $z$ multiplies it by 16, so $x$ doubles.'
      E: 'You went for 3 to 4, a decrease. Halving $y$ divides $x$ by 2 cubed, which is 8, and doubling $z$ multiplies it by 2 to the power 4, which is 16. 16 over 8 is 2, so $x$ increases, 2 to 1.'
  7:
    moments:
      - say: 'In the figure, triangle $PQR$ has a right angle at $P$ and 60 degrees at $Q$, with $QR = 8$ cm. Triangle $PRS$ has a right angle at $R$ and 45 degrees at $P$. We want $PS$.'
        write: '$QR = 8$ cm, $\angle PQR = 60^{\circ}$, $\angle RPS = 45^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: PQR, text: '60°'}
          - {figure: 0, kind: highlight, target: QR, text: '8 cm'}
          - {figure: 0, kind: arc, target: RPS, text: '45°'}
      - say: 'The plan: first find $PR$, the side the two triangles share. Then use it in triangle $PRS$ to reach $PS$.'
        write: 'Plan: find $PR$ first, then $PS$'
        point:
          - {figure: 0, kind: highlight, target: PR, text: 'shared side'}
          - {figure: 0, kind: highlight, target: PS, text: 'want'}
      - say: 'In triangle $PQR$ the right angle is at $P$, so the side opposite it, $QR$, is the hypotenuse. It''s 8 cm.'
        write: 'In $\triangle PQR$: hypotenuse $QR = 8$'
        point:
          - {figure: 0, kind: highlight, target: QR, text: 'hypotenuse'}
      - say: 'SOH: the sine of an angle is the opposite side over the hypotenuse.'
        write: 'SOH: $\sin\theta = \dfrac{\text{opposite}}{\text{hypotenuse}}$'
      - say: '$PR$ is the side opposite the 60 degree angle at $Q$. Opposite over hypotenuse is sine.'
        write: '$\sin 60^{\circ} = \dfrac{PR}{QR} = \dfrac{PR}{8}$'
        point:
          - {figure: 0, kind: highlight, target: PR, text: 'opposite'}
          - {figure: 0, kind: arc, target: PQR, text: '60°'}
      - say: 'Multiply both sides by 8, so $PR$ is 8 times sine 60 degrees.'
        write: '$PR = 8\sin 60^{\circ}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '[[8]]PR'}, at: '[[8]]sin', text: 'times 8'}
      - say: 'Sine 60 degrees is root 3 over 2.'
        write: '$= 8 \times \dfrac{\sqrt{3}}{2}$'
      - say: '8 divided by 2 is 4, so $PR$ is 4 root 3 cm.'
        write: '$PR = 4\sqrt{3}$ cm'
        point:
          - {figure: 0, kind: label, target: PR, text: '4√3'}
      - say: 'The rule: the three angles of any triangle add up to 180 degrees.'
        write: 'Angle sum of a triangle: $A + B + C = 180^{\circ}$'
      - say: 'Now triangle $PRS$. It has 90 degrees at $R$ and 45 at $P$, so the angle at $S$ is 180 minus 90 minus 45, which is 45 degrees too.'
        write: 'In $\triangle PRS$: $\angle PSR = 180^{\circ} - 90^{\circ} - 45^{\circ} = 45^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: PSR, text: '45°'}
      - say: 'Two equal angles mean two equal sides. So $RS$ equals the $PR$ we just found, 4 root 3.'
        write: '$RS = PR = 4\sqrt{3}$'
        point:
          - {line: 10, kind: move, from: {line: 7, at: '43'}, at: '43', text: 'just found'}
          - {figure: 0, kind: label, target: RS, text: '4√3'}
      - say: 'Pythagoras: the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hypotenuse}^{2} = \text{opposite}^{2} + \text{adjacent}^{2}$'
      - say: '$PS$ is opposite the right angle at $R$, so it''s the hypotenuse. By Pythagoras, $PS$ squared is $PR$ squared plus $RS$ squared.'
        write: '$PS^{2} = PR^{2} + RS^{2}$'
        point:
          - {figure: 0, kind: highlight, target: PS, text: 'hypotenuse'}
      - say: 'Put in 4 root 3 for both sides.'
        write: '$= (4\sqrt{3})^{2} + (4\sqrt{3})^{2}$'
      - say: '4 root 3 squared is 16 times 3, which is 48. So we have 48 plus 48, which is 96.'
        write: '$= 48 + 48 = 96$'
      - say: 'So $PS$ is the square root of 96. 96 is 16 times 6, and the square root of 16 is 4.'
        write: '$PS = \sqrt{96} = \sqrt{16 \times 6} = 4\sqrt{6}$'
      - say: 'So $PS$ is 4 root 6 cm, which is answer choice B.'
        write: '$PS = 4\sqrt{6}$ cm'
        answer: true
    traps:
      A: 'You went for 2 root 3. That''s only half of $PR$, and $PS$ is longer still, since it''s a hypotenuse. $PR$ is 4 root 3, and $PS$ is $PR$ times root 2, which is 4 root 6.'
      C: 'You went for 2 root 6, exactly half the answer. $PR$ faces the 60 degree angle, so $PR$ is 8 sine 60, which is 4 root 3, and then $PS$ is 4 root 3 times root 2, which is 4 root 6.'
      D: 'You went for 8 root 6, double the answer. Sine 60 is root 3 over 2, so $PR$ is 8 times root 3 over 2, which is 4 root 3, not 8 root 3. Then $PS$ is 4 root 6.'
      E: 'You went for 8 cm. That''s $QR$, the hypotenuse of the first triangle. $PS$ is the hypotenuse of the second triangle, $PRS$, and works out to 4 root 6 cm.'
  8:
    moments:
      - say: 'We know $\cos z = L$, where $z$ is acute. We want the expression cot $z$ minus cosec $z$, over sec $z$ plus tan $z$, written in terms of $L$.'
        write: '$\dfrac{\cot z - \operatorname{cosec} z}{\sec z + \tan z}$'
      - say: 'Picture a right triangle with hypotenuse 1 and the side next to $z$ equal to $L$, so $\cos z = L$. The plan: write everything using sine and cosine, simplify, then replace them with $L$. First we need $\sin z$, and for that we use the identity sine squared plus cos squared equals 1.'
        doodle: {name: 'custom:1983_q08_a', id: tri, caption: 'cos z = L over 1'}
        write: '$\sin^{2}z + \cos^{2}z = 1$'
      - say: 'Put $L$ in for $\cos z$ and move it across. $\sin^2 z$ is 1 minus $L$ squared.'
        write: '$\sin^{2}z = 1 - L^{2}$'
        point:
          - {line: 1, kind: box, text: 'identity'}
          - {line: 2, kind: move, from: {line: 1, at: 'cos2z'}, at: '−L2', text: 'across, as L²'}
      - say: 'Since $z$ is acute, its sine is positive, so $\sin z$ is the positive square root. It is the third side of the triangle.'
        doodle_do: [{id: tri, op: label, part: opp, text: 'sin z'}]
        write: '$\sin z = \sqrt{1 - L^{2}}$'
      - say: 'Now the top of our expression. Cot is cos over sin, and cosec is 1 over sin.'
        write: 'Top: $\cot z - \operatorname{cosec} z = \dfrac{\cos z}{\sin z} - \dfrac{1}{\sin z}$'
      - say: 'They share the same bottom, $\sin z$, so we combine them, and put $L$ in place of $\cos z$.'
        write: '$= \dfrac{L - 1}{\sin z}$'
      - say: 'Now the bottom of our expression. Sec is 1 over cos, and tan is sin over cos.'
        write: 'Bottom: $\sec z + \tan z = \dfrac{1}{\cos z} + \dfrac{\sin z}{\cos z}$'
      - say: 'Again they share a bottom, this time $\cos z$, which is $L$.'
        write: '$= \dfrac{1 + \sin z}{L}$'
      - say: 'Now divide the top we found by the bottom we found. Dividing by a fraction means multiplying by it turned upside down.'
        write: 'Expression $= \dfrac{L - 1}{\sin z} \times \dfrac{L}{1 + \sin z}$'
      - say: 'Multiply the tops together and the bottoms together.'
        write: '$= \dfrac{L(L - 1)}{\sin z\,(1 + \sin z)}$'
      - say: 'On top, $L$ times $L - 1$ is $L^2 - L$. On the bottom, $\sin z$ times $1 + \sin z$ is $\sin z + \sin^2 z$.'
        write: '$= \dfrac{L^{2} - L}{\sin z + \sin^{2}z}$'
      - say: 'Now go back to the two lines we found at the start: $\sin z$ is the root of $1 - L^2$, and $\sin^2 z$ is $1 - L^2$.'
        doodle_do: [{id: tri, op: pulse, part: opp}]
        write: '$= \dfrac{L^{2} - L}{\sqrt{1 - L^{2}} + (1 - L^{2})}$'
        point:
          - {line: 11, kind: move, from: {line: 3, at: '1−L2'}, at: '[[1−L2]]+(', text: 'sin z'}
          - {line: 11, kind: move, from: {line: 2, at: '1−L2'}, at: '(1−L2)', text: 'sin² z'}
      - say: 'Writing the bottom the other way round, we get $L^2 - L$ over $1 - L^2$ plus the root of $1 - L^2$, which is answer choice B.'
        write: '$= \dfrac{L^{2} - L}{1 - L^{2} + \sqrt{1 - L^{2}}}$'
        answer: true
    traps:
      A: 'You went for $1 - L$ over $1 + L$. That leaves out $\sin z$ altogether. The top becomes $L - 1$ over $\sin z$ and the bottom $1 + \sin z$ over $L$, and $\sin z$ is the root of $1 - L^2$, which must stay in the answer.'
      C: 'You went for the same fraction with $L - L^2$ on top. The sign is flipped. The top of the question is $\cos z - 1$ over $\sin z$, so the numerator is $L(L - 1)$, which is $L^2 - L$.'
      D: 'You went for a bottom with $1 + L^2$. But $\sin^2 z$ is $1 - L^2$, not $1 + L^2$, because $\sin^2 z + \cos^2 z = 1$.'
      E: 'You went for $L - L^2$ over $1$ plus a root. Two things slipped: the top should be $L^2 - L$, and the bottom is $\sin z + \sin^2 z$, which needs the $1 - L^2$ as well as the root.'
  9:
    moments:
      - section: 'The question'
        say: 'Two very small decimals are multiplied, and the answer must be in standard form, A times 10 to the power B. The sign of B is where many students slip.'
        write: '$0.0000152 \times 0.00042 = A \times 10^{B}$, $1 \le A < 10$'
      - say: 'Standard form means a number from 1 up to, but not including, 10, times a power of 10. So we first write each number in standard form.'
        doodle: {name: 'custom:1983_q09_a', id: hops, caption: 'the point hops right'}
        write: 'Solution'
      - section: 'Each number in standard form'
        say: 'For 0.0000152, the decimal point moves 5 places to the right to give 1.52. Moving it to the right gives a negative index: 10 to the power minus 5.'
        doodle_do: [{id: hops, op: stage, stage: 'custom:1983_q09_a2'}]
        write: '$0.0000152 = 1.52 \times 10^{-5}$'
        point:
          - {line: 2, kind: highlight, at: '10−5', to: {doodle: hops, part: hops1}}
      - say: 'For 0.00042, the point moves 4 places to the right to give 4.2. So it is 4.2 times 10 to the power minus 4.'
        doodle_do: [{id: hops, op: stage, stage: 'custom:1983_q09_a3'}]
        write: '$0.00042 = 4.2 \times 10^{-4}$'
        point:
          - {line: 3, kind: highlight, at: '10−4', to: {doodle: hops, part: hops2}}
      - say: 'So the product is 1.52 times 10 to the minus 5, times 4.2 times 10 to the minus 4.'
        write: 'Product $= 1.52 \times 10^{-5} \times 4.2 \times 10^{-4}$'
      - say: 'We may multiply in any order, so group the numbers together and the powers of 10 together.'
        write: '$= (1.52 \times 4.2) \times (10^{-5} \times 10^{-4})$'
      - section: 'Multiply the numbers'
        say: 'Multiply 152 by 42, leaving out the points for now. 152 times 2 is 304. 152 times 40 is 6,080. Add them: 6,384.'
        write: '$\begin{array}{r} 152 \\ \times\ \ 42 \\ \hline 304 \\ 6080 \\ \hline 6384 \end{array}$'
      - say: 'Now the points. 1.52 has 2 decimal places and 4.2 has 1, so the answer has 3 decimal places: 6.384.'
        write: '$1.52 \times 4.2 = 6.384$'
      - section: 'Multiply the powers'
        say: 'Now the powers. The law of indices says: to multiply powers of the same base, add the indices.'
        write: '$a^{m} \times a^{n} = a^{m + n}$'
      - say: 'So minus 5 plus minus 4 is minus 9.'
        write: '$10^{-5} \times 10^{-4} = 10^{-5 + (-4)} = 10^{-9}$'
      - say: 'Therefore the product is 6.384 times 10 to the minus 9. And 6.384 lies between 1 and 10, so this is standard form.'
        write: '$\therefore$ Product $= 6.384 \times 10^{-9}$'
        point:
          - {line: 10, kind: move, from: {line: 7, at: '= 6.384'}, at: '6.384'}
          - {line: 10, kind: move, from: {line: 9, at: '= 10−9'}, at: '10−9'}
      - say: 'The options give A to 3 significant figures. After 6.38 the next digit is 4, which is less than 5, so we leave the 8 as it is.'
        write: '$6.38|4 \approx 6.38$ (3 s.f.)'
      - section: 'Check'
        say: 'Check: a number less than 1 times another number less than 1 gives a smaller number still, so B must be negative. Minus 9 fits.'
        write: 'Check: both numbers are less than 1, so $B < 0$ $\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore A is 6.38 and B is minus 9, which is option B.'
        write: '$\therefore A = 6.38,\ \ B = -9$'
        answer: true
    traps:
      A: 'You went for A = 9 and B = 6.38. The values are swapped. A is the number part, 6.38, and B is the index of 10, minus 9.'
      C: 'You went for B = 9. The sign of the index was lost. Both numbers are less than 1, so the product is tiny and the index is negative: minus 9.'
      D: 'You went for B = minus 1. The indices must be added: minus 5 plus minus 4 is minus 9.'
      E: 'You went for B = 1. That would make the product bigger than 6, but the product of two tiny decimals is tiny. Minus 5 plus minus 4 is minus 9.'
  10:
    moments:
      - section: 'The question'
        say: '$x$ plus 2 and $x$ minus 1 are both factors of this cubic. We want $l$ and $k$. Picture each factor as a key that must turn the lock to zero.'
        write: '$lx^{3} + 2kx^{2} + 24$'
        doodle: {name: 'custom:1983_q10_a', id: keys, caption: 'each factor is a key to zero'}
      - section: 'Solution'
        say: 'The factor theorem says: if $x$ minus $a$ is a factor, then $f$ of $a$ is zero. Two factors give us two equations in $l$ and $k$.'
        write: 'Solution'
      - say: 'First, give the expression a name, $f$ of $x$.'
        write: 'Let $f(x) = lx^{3} + 2kx^{2} + 24$'
      - say: 'First key. Set the factor $x$ minus 1 equal to zero. Therefore $x$ equals 1.'
        write: 'Let $x - 1 = 0$, $\therefore x = 1$'
        doodle_do:
          - {id: keys, op: highlight, part: key1}
      - say: 'Put 1 in place of every $x$, each in brackets. By the factor theorem, the result is zero.'
        write: '$f(1) = l(1)^{3} + 2k(1)^{2} + 24 = 0$'
      - say: '1 cubed and 1 squared are both 1.'
        write: '$l + 2k + 24 = 0$'
      - say: 'Subtract 24 from both sides. Call it equation one.'
        write: '$l + 2k = -24 \quad \text{......(1)}$'
      - say: 'Second key. Set $x$ plus 2 equal to zero. Therefore $x$ equals negative 2, not positive 2.'
        write: 'Let $x + 2 = 0$, $\therefore x = -2$'
        doodle_do:
          - {id: keys, op: highlight, part: key2}
      - say: 'Put negative 2 in place of every $x$, in brackets.'
        write: '$f(-2) = l(-2)^{3} + 2k(-2)^{2} + 24 = 0$'
      - say: 'Negative 2 cubed is negative 8. Negative 2 squared is 4, and $2k$ times 4 is $8k$.'
        write: '$-8l + 8k + 24 = 0$'
      - say: 'Every term divides by 8. Divide through by 8.'
        write: '$-l + k + 3 = 0$'
      - say: 'Subtract 3 from both sides. Call it equation two.'
        write: '$-l + k = -3 \quad \text{......(2)}$'
      - section: 'Solve for l and k'
        say: 'Equation one has plus $l$, equation two has negative $l$. Add them, and $l$ cancels. $2k$ plus $k$ is $3k$; negative 24 plus negative 3 is negative 27.'
        write: '(1) + (2): $3k = -27$'
      - say: 'Divide both sides by 3. Negative 27 over 3 is negative 9.'
        write: '$k = \dfrac{-27}{3} = -9$'
      - say: 'Now substitute $k$ equals negative 9 in equation one.'
        write: 'Substitute $k = -9$ in (1):'
      - say: '$l$ plus 2 times negative 9 equals negative 24.'
        write: '$l + 2(-9) = -24$'
      - say: '2 times negative 9 is negative 18.'
        write: '$l - 18 = -24$'
      - say: 'Add 18 to both sides. Negative 24 plus 18 is negative 6.'
        write: '$l = -24 + 18 = -6$'
      - say: 'Therefore $l$ equals negative 6 and $k$ equals negative 9.'
        write: '$\therefore l = -6,\ k = -9$'
      - section: 'Check'
        say: 'Try the first key in the lock. $f$ of 1 is negative 6, plus 2 times negative 9, plus 24. Negative 6 minus 18 plus 24 is zero.'
        write: '$f(1) = -6 - 18 + 24 = 0\ \checkmark$'
        doodle_do:
          - {id: keys, op: arrow, part: key1, to_part: lock}
      - say: 'And the second key. Negative 8 times negative 6 is 48; 8 times negative 9 is negative 72. 48 minus 72 plus 24 is zero.'
        write: '$f(-2) = 48 - 72 + 24 = 0\ \checkmark$'
        doodle_do:
          - {id: keys, op: arrow, part: key2, to_part: lock}
      - say: 'So $l$ is negative 6 and $k$ is negative 9: option A.'
        write: '$\therefore l = -6,\ k = -9$ (A)'
        answer: true
    traps:
      B: 'You went for $l$ equals negative 2 and $k$ equals 1. Test it: $f$ of 1 is negative 2 plus 2 plus 24, which is 24, not zero. So $x$ minus 1 would not be a factor.'
      C: 'You went for $l$ equals negative 2 and $k$ equals negative 1. Then $f$ of 1 is negative 2 minus 2 plus 24, which is 20, not zero. Solving equations (1) and (2) gives negative 6 and negative 9.'
      D: 'You went for $l$ equals 0 and $k$ equals 1. With $l$ equal to 0 there is no cubic at all, and $f$ of 1 is 2 plus 24, which is 26, not zero.'
      E: 'You went for $l$ equals 6 and $k$ equals 0. Then $f$ of 1 is 6 plus 24, which is 30, not zero. Remember, $x$ plus 2 equals 0 gives $x$ equals negative 2.'
  11:
    moments:
      - section: 'The question'
        say: 'Make $T$ the subject. $T$ is wrapped in layers: a cube root outside, a fraction inside, and it appears twice. We peel one layer at a time.'
        write: '$\dfrac{av}{1 - v} = \sqrt[3]{\dfrac{2v + T}{2aT}}$'
        doodle: {name: 'custom:1983_q11_a', id: layers, caption: 'T is wrapped in layers'}
      - section: 'Solution'
        say: 'We undo the operations in reverse order, one per line. The outer layer is the cube root, so that goes first.'
        write: 'Solution'
      - say: 'Cube both sides. Cubing undoes a cube root, so the root disappears from the right.'
        write: '$\left(\dfrac{av}{1 - v}\right)^{3} = \dfrac{2v + T}{2aT}$'
        doodle_do:
          - {id: layers, op: cross, part: root}
      - say: 'Cubing a fraction cubes the top and the bottom. $av$ cubed is $a$ cubed $v$ cubed; the bottom is $1 - v$, all cubed.'
        write: '$\dfrac{a^{3}v^{3}}{(1 - v)^{3}} = \dfrac{2v + T}{2aT}$'
      - say: 'Next layer, the fractions. Cross multiply: the top of each side times the bottom of the other.'
        write: '$2aT \times a^{3}v^{3} = (1 - v)^{3}(2v + T)$'
        doodle_do:
          - {id: layers, op: cross, part: frac}
      - say: 'On the left, $2a$ times $a$ cubed is $2a$ to the power 4. So the left side is $2a^4v^3T$.'
        write: '$2a^{4}v^{3}T = (1 - v)^{3}(2v + T)$'
      - say: 'Open the bracket on the right: $1 - v$ cubed times $2v$, plus $1 - v$ cubed times $T$.'
        write: '$2a^{4}v^{3}T = 2v(1 - v)^{3} + T(1 - v)^{3}$'
      - say: '$T$ is in two terms. Collect the terms in $T$ on one side: subtract $T(1 - v)^3$ from both sides. It arrives on the left with a minus sign.'
        write: '$2a^{4}v^{3}T - T(1 - v)^{3} = 2v(1 - v)^{3}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '+T(1−v)3'}, at: '−T(1−v)3', text: 'across: minus'}
      - say: 'Both terms on the left contain $T$. Factorise out $T$.'
        write: '$T[2a^{4}v^{3} - (1 - v)^{3}] = 2v(1 - v)^{3}$'
      - say: 'Divide both sides by the square bracket. Therefore $T$ equals $2v$ times $1 - v$ cubed, over $2a^4v^3$ minus $1 - v$ cubed.'
        write: '$\therefore T = \dfrac{2v(1 - v)^{3}}{2a^{4}v^{3} - (1 - v)^{3}}$'
        doodle_do:
          - {id: layers, op: circle, part: core}
      - section: 'Check'
        say: 'Check with easy numbers: $a$ equals 1 and $v$ equals a half. Then $1 - v$ is a half, and the left side is a half over a half, which is 1.'
        write: '$a = 1,\ v = \tfrac{1}{2}$: LHS $= \dfrac{\frac{1}{2}}{\frac{1}{2}} = 1$'
      - say: 'In our formula, a half cubed is one-eighth. The top is 2 times a half times one-eighth, which is one-eighth. The bottom is two-eighths minus one-eighth, also one-eighth. So $T$ is 1.'
        write: '$T = \dfrac{2(\frac{1}{2})(\frac{1}{8})}{2(\frac{1}{8}) - \frac{1}{8}} = \dfrac{\frac{1}{8}}{\frac{1}{8}} = 1$'
      - say: 'Put $T$ equals 1 in the right side of the question: 2 times a half plus 1 is 2, over 2 times 1 times 1. The cube root of 1 is 1. Both sides agree.'
        write: 'RHS $= \sqrt[3]{\dfrac{1 + 1}{2}} = \sqrt[3]{1} = 1\ \checkmark$'
      - say: 'So the answer has $2a^4v^3$ minus $1 - v$ cubed at the bottom: option D.'
        write: '$\therefore T = \dfrac{2v(1 - v)^{3}}{2a^{4}v^{3} - (1 - v)^{3}}$ (D)'
        answer: true
    traps:
      A: 'You went for $3av$ over $1 - v$. A cube root is not removed by multiplying by 3. We cube both sides, and then collect $T$ from both terms it appears in.'
      B: 'You went for the answer with squares. This is a cube root, so both sides must be cubed, which gives $(1 - v)^3$ and $v^3$. And $2aT$ times $a^3$ gives $a^4$, not $a^2$.'
      C: 'You went for the answer with squares and a plus sign. Cubing is needed to remove a cube root, and when $T(1 - v)^3$ is collected on the left it becomes a minus.'
      E: 'You went for the version with a plus at the bottom. When $T(1 - v)^3$ is subtracted from both sides to join the other $T$ term, it becomes minus, so the bottom is $2a^4v^3$ minus $(1 - v)^3$.'
  12:
    moments:
      - say: 'There are 60 pupils, and the pie chart gives each subject''s angle in terms of $x$. We want the number offering Additional Mathematics, whose angle is $2x - 24$ degrees.'
        write: 'Add. Maths: $(2x - 24)^{\circ}$, class of 60'
        point:
          - {figure: 0, kind: circle, target: '(2x − 24)°', text: 'Add. Maths'}
      - say: 'The angles in a pie chart make a full turn, so together they add up to 360 degrees.'
        write: 'Sum of angles $= 360^{\circ}$'
      - say: 'Write out all five sectors from the chart, and set their sum equal to 360.'
        write: '$(3x - 18) + (2x + 12) + (x + 12) + x + (2x - 24) = 360$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
      - say: 'Collect the $x$ terms first: $3x$ plus $2x$ plus $x$ plus $x$ plus $2x$ is $9x$.'
        write: '$x$ terms: $3x + 2x + x + x + 2x = 9x$'
      - say: 'Now the numbers: negative 18 plus 12 plus 12 minus 24. That''s negative 18.'
        write: 'Numbers: $-18 + 12 + 12 - 24 = -18$'
      - say: 'So the equation becomes $9x$ minus 18 equals 360.'
        write: '$9x - 18 = 360$'
      - say: 'Add 18 to both sides. 360 plus 18 is 378.'
        write: '$9x = 360 + 18 = 378$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '−18'}, at: '+18', text: 'across'}
      - say: 'Divide both sides by 9. 378 divided by 9 is 42.'
        write: '$x = \dfrac{378}{9} = 42$'
      - say: 'We''re not finished: we need the Additional Mathematics angle. Put 42 into $2x - 24$. 2 times 42 is 84, and 84 minus 24 is 60 degrees.'
        write: 'Add. Maths angle $= 2(42) - 24 = 84 - 24 = 60^{\circ}$'
        point:
          - {line: 0, kind: underline, at: '(2x−24)', text: 'Add. Maths'}
          - {line: 8, kind: move, from: {line: 7, at: '=42'}, at: '42', text: 'sub in'}
          - {figure: 0, kind: label, target: '(2x − 24)°', text: '= 60°'}
      - say: 'A sector of 60 degrees is 60 out of the 360 degrees of the whole circle. That simplifies to 1 over 6.'
        write: 'Fraction of the class $= \dfrac{60}{360} = \dfrac{1}{6}$'
        point:
          - {figure: 0, kind: circle, target: '(2x − 24)°', text: '60° of 360°'}
      - say: 'So 1 over 6 of the 60 pupils offer Additional Mathematics. 60 divided by 6 is 10.'
        write: 'Pupils $= \dfrac{1}{6} \times 60 = 10$'
      - say: 'So 10 pupils offer Additional Mathematics, which is answer choice B.'
        write: 'Add. Maths: 10 pupils'
        answer: true
    traps:
      A: 'You went for 15. That would need a sector of 90 degrees. With $x = 42$, the Additional Mathematics angle is 2 times 42 minus 24, which is 60 degrees, and that is 10 pupils.'
      C: 'You went for 18. That''s the Biology sector: 3 times 42 minus 18 is 108 degrees, which is 18 pupils. The question asks about Additional Mathematics, whose angle is 60 degrees.'
      D: 'You went for 12. That would need a 72 degree sector. The Additional Mathematics angle is $2x - 24$, and with $x = 42$ that is 60 degrees: 60 over 360 of 60 pupils, which is 10.'
      E: 'You went for 28. No sector gives that many pupils. Solving $9x - 18 = 360$ gives $x = 42$, the Additional Mathematics angle is 60 degrees, and 60 over 360 of the 60 pupils is 10.'
  13:
    moments:
      - section: 'The question'
        say: 'Five options, and four of them have the same digits, 1 and 9. The whole question is where the decimal point goes. Picture two cubes, with edges 0.3 and 0.2.'
        doodle: {name: 'custom:1983_q13_a', id: cubes, caption: 'two cubes'}
        write: 'Find $(0.3)^{3} - (0.2)^{3}$'
      - say: 'By BODMAS, powers are worked out before subtraction. So we cube each decimal first, then subtract.'
        write: 'Solution'
      - section: 'Cube each number'
        say: '0.3 cubed means 0.3 times 0.3 times 0.3.'
        write: '$(0.3)^{3} = 0.3 \times 0.3 \times 0.3$'
      - say: 'Multiply the digits: 3 times 3 times 3 is 27. Count the decimal places: one in each number, so three in the answer. That gives 0.027.'
        doodle_do: [{id: cubes, op: label, part: big, text: '0.027'}]
        write: '$= 0.027$'
      - say: 'Now 0.2 cubed, which is 0.2 times 0.2 times 0.2.'
        write: '$(0.2)^{3} = 0.2 \times 0.2 \times 0.2$'
      - say: '2 times 2 times 2 is 8, and again there are three decimal places. So 0.2 cubed is 0.008.'
        doodle_do: [{id: cubes, op: label, part: small, text: '0.008'}]
        write: '$= 0.008$'
      - section: 'Subtract'
        say: 'Now put the two cubes back into the question.'
        write: '$(0.3)^{3} - (0.2)^{3} = 0.027 - 0.008$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '= 0.027'}, at: '0.027'}
          - {line: 6, kind: move, from: {line: 5, at: '= 0.008'}, at: '0.008'}
      - say: 'Set the subtraction out with the decimal points in a line. 27 thousandths minus 8 thousandths is 19 thousandths.'
        doodle_do: [{id: cubes, op: cross, part: small}]
        write: '$\begin{array}{r} 0.027 \\ -\ 0.008 \\ \hline 0.019 \end{array}$'
      - say: 'Therefore the value is 0.019.'
        write: '$\therefore (0.3)^{3} - (0.2)^{3} = 0.019$'
      - section: 'Check'
        say: 'Check with fractions. 0.3 is 3 over 10, so its cube is 27 over 1,000. 0.2 cubed is 8 over 1,000.'
        write: 'Check: $\dfrac{27}{1000} - \dfrac{8}{1000} = \dfrac{19}{1000}$'
      - say: '19 over 1,000 is 19 thousandths, which is 0.019. It agrees.'
        write: '$\dfrac{19}{1000} = 0.019 \ \checkmark$'
      - section: 'Answer'
        say: 'So the value is 0.019, which is option A.'
        write: '$\therefore$ Value $= 0.019$'
        answer: true
    traps:
      B: 'You went for 0.0019. The digits are right, but the point has moved one place too far. A cube of a number with one decimal place has three decimal places, so the answer is 0.019.'
      C: 'You went for 0.00019. The point is two places too far. 0.027 minus 0.008 is 0.019: nineteen thousandths.'
      D: 'You went for 0.000019. That has six decimal places, as if each number had two. 0.3 and 0.2 have one decimal place each, so their cubes have three.'
      E: 'You went for 0.000035. That does not come from cubing. 0.3 cubed is 0.027 and 0.2 cubed is 0.008, and 0.027 minus 0.008 is 0.019.'
  14:
    moments:
      - section: 'The question'
        say: '$y$ varies partly as $x$ squared and partly as 1 over root $x$. Two parts means two unknown constants, so we need two equations. The two given pairs supply them.'
        write: '$y = 2$ when $x = 1$; $\ y = 6$ when $x = 4$'
      - say: 'Solution. Partial variation: $y$ is the sum of two parts, and each part gets its own constant, $k$ one and $k$ two.'
        write: 'Solution'
      - say: 'Picture $y$ as one tank filled from two taps: one part goes with $x$ squared, the other with 1 over root $x$. So $y$ equals $k$ one $x$ squared, plus $k$ two over root $x$.'
        doodle: {name: 'custom:1983_q14_a', id: tank, caption: 'two parts make up y'}
        write: '$y = k_{1}x^{2} + \dfrac{k_{2}}{\sqrt{x}}$'
      - section: 'Two equations'
        say: 'Now substitute the first pair: $x$ equals 1 and $y$ equals 2.'
        write: 'When $x = 1,\ y = 2$: $\ 2 = k_{1}(1)^{2} + \dfrac{k_{2}}{\sqrt{1}}$'
        point:
          - {line: 3, kind: move, from: {line: 0, at: 'y = [[2]]'}, at: ':[[2]] =', text: 'y'}
      - say: '1 squared is 1, and the square root of 1 is 1. So $k$ one plus $k$ two is 2. Number it equation one.'
        doodle_do: [{id: tank, op: label, part: tank, text: 'y = 2 when x = 1'}]
        write: '$k_{1} + k_{2} = 2 \quad \ldots (1)$'
      - say: 'Now the second pair: $x$ equals 4 and $y$ equals 6.'
        write: 'When $x = 4,\ y = 6$: $\ 6 = k_{1}(4)^{2} + \dfrac{k_{2}}{\sqrt{4}}$'
      - say: '4 squared is 16, and the square root of 4 is 2.'
        write: '$16k_{1} + \dfrac{k_{2}}{2} = 6$'
      - say: 'Multiply every term by 2 to clear the fraction. 16 times 2 is 32, and 6 times 2 is 12. That is equation two.'
        write: '$32k_{1} + k_{2} = 12 \quad \ldots (2)$'
      - section: 'Solve for the constants'
        say: 'Both equations have a single $k$ two, so take equation two minus equation one. The $k$ two cancels.'
        write: '$(2) - (1)$: $\ 32k_{1} - k_{1} = 12 - 2$'
      - say: '32 $k$ one minus $k$ one is 31 $k$ one, and 12 minus 2 is 10.'
        write: '$31k_{1} = 10$'
      - say: 'Divide both sides by 31.'
        write: '$\therefore\ k_{1} = \dfrac{10}{31}$'
      - say: 'Substitute into equation one: $k$ two is 2 minus 10 over 31. 2 is 62 over 31, and 62 minus 10 is 52.'
        write: 'Sub. in (1): $\ k_{2} = 2 - \dfrac{10}{31} = \dfrac{62 - 10}{31} = \dfrac{52}{31}$'
      - section: 'The equation'
        say: 'Put both constants back into the law of variation. One constant for each part of the tank.'
        doodle_do: [{id: tank, op: label, part: tapa, text: 'k₁ = 10/31'}, {id: tank, op: label, part: tapb, text: 'k₂ = 52/31'}]
        write: '$\therefore\ y = \dfrac{10x^{2}}{31} + \dfrac{52}{31\sqrt{x}}$'
        point:
          - {line: 12, kind: move, from: {line: 10, at: '3110'}, at: '[[31]]10x2', text: 'k₁'}
      - section: 'Check'
        say: 'Check with $x$ equals 4. 10 times 16 over 31 is 160 over 31. 52 over 31 times 2 is 26 over 31. Together, 186 over 31, which is 6.'
        write: 'Check $x = 4$: $\ \dfrac{160}{31} + \dfrac{26}{31} = \dfrac{186}{31} = 6\ \checkmark$'
      - say: 'So the expression is $10 x$ squared over 31, plus 52 over 31 root $x$: option A.'
        write: '$y = \dfrac{10x^{2}}{31} + \dfrac{52}{31\sqrt{x}}$'
        answer: true
    traps:
      B: 'You went for $x^2$ plus 1 over root $x$. That takes both constants as 1. Test it at $x = 4$: 16 plus a half is 16 and a half, not 6.'
      C: 'You went for $x^2$ plus 1 over $x$. The second part is the inverse of the square root of $x$, not of $x$, and each part needs its own constant, found from the two given pairs.'
      D: 'You went for 1 over 31 in both parts. Test it at $x = 1$: 1 over 31 plus 1 over 31 is 2 over 31, not 2. The constants are 10 over 31 and 52 over 31.'
      E: 'You went for 10 over 31 times both parts. That uses a single constant, but partial variation needs two. $k$ one is 10 over 31, and $k$ two is 52 over 31.'
  15:
    moments:
      - section: 'The question'
        say: 'Two algebraic fractions multiplied together. They look heavy, but most of this cancels. The whole game is spotting what cancels.'
        write: '$\dfrac{x - 7}{x^{2} - 9} \times \dfrac{x^{2} - 3x}{x^{2} - 49}$'
      - section: 'Solution'
        say: 'With algebraic fractions we always factorise every top and bottom first, each on its own line. Then we cancel common factors.'
        write: 'Solution'
      - say: '$x$ squared minus 9 is a difference of two squares: $x$ squared minus 3 squared. So it is $x$ minus 3, times $x$ plus 3.'
        write: '$x^{2} - 9 = (x - 3)(x + 3)$'
      - say: '$x$ squared minus $3x$ has a common factor, $x$. Take it out: $x$ times $x$ minus 3.'
        write: '$x^{2} - 3x = x(x - 3)$'
      - say: '$x$ squared minus 49 is another difference of two squares: $x$ squared minus 7 squared.'
        write: '$x^{2} - 49 = (x - 7)(x + 7)$'
      - say: '$x$ minus 7 on the first top cannot be factorised further. Now rewrite the question with every factorised piece.'
        write: '$\dfrac{x - 7}{(x - 3)(x + 3)} \times \dfrac{x(x - 3)}{(x - 7)(x + 7)}$'
      - say: 'Multiply the tops together and the bottoms together to make one fraction. Picture each factor as a tile.'
        write: '$= \dfrac{x(x - 7)(x - 3)}{(x - 3)(x + 3)(x - 7)(x + 7)}$'
        doodle: {name: 'custom:1983_q15_a', id: tiles, caption: 'factor tiles', size: scene}
      - section: 'Cancel'
        say: '$x$ minus 7 is on the top and on the bottom. Cancel the common factor. Cross out the pink pair.'
        write: '$= \dfrac{x(x - 3)}{(x - 3)(x + 3)(x + 7)}$'
        doodle_do:
          - {id: tiles, op: cross, part: t7}
          - {id: tiles, op: cross, part: b7}
        point:
          - {line: 6, kind: strike, at: 'x[[(x−7)]]', text: 'cancels'}
          - {line: 6, kind: strike, at: '(x+3)[[(x−7)]]'}
      - say: '$x$ minus 3 is also on the top and the bottom. Cancel it too. Cross out the blue pair.'
        write: '$\therefore \dfrac{x}{(x + 3)(x + 7)}$'
        doodle_do:
          - {id: tiles, op: cross, part: t3}
          - {id: tiles, op: cross, part: b3}
        point:
          - {line: 7, kind: strike, at: 'x[[(x−3)]]', text: 'cancels'}
          - {line: 7, kind: strike, at: '[[(x−3)]](x+3)'}
      - section: 'Check'
        say: 'Check with $x$ equals 1. In the question: negative 6 over negative 8, times negative 2 over negative 48. That is three-quarters times one over 24.'
        write: '$x = 1$: $\dfrac{-6}{-8} \times \dfrac{-2}{-48} = \dfrac{3}{4} \times \dfrac{1}{24}$'
      - say: 'Three-quarters times one over 24 is 3 over 96, which is 1 over 32.'
        write: '$= \dfrac{3}{96} = \dfrac{1}{32}$'
      - say: 'Our answer gives 1 over 4 times 8, which is 1 over 32. They agree.'
        write: '$\dfrac{1}{(4)(8)} = \dfrac{1}{32}\ \checkmark$'
      - say: 'So the expression simplifies to $x$ over $x$ plus 3, times $x$ plus 7: option D.'
        write: '$\therefore \dfrac{x}{(x + 3)(x + 7)}$ (D)'
        doodle_do:
          - {id: tiles, op: circle, part: tx}
        answer: true
    traps:
      A: 'You went for $x$ over $x - 3$ times $x + 7$. The $x - 3$ is the factor that cancels, because it is on the top and the bottom. The one that survives is $x + 3$.'
      B: 'You went for $x + 3$ times $x + 7$, over $x$. That is the right answer turned upside down. The $x$ comes from the top, $x^2 - 3x$, so it stays on top.'
      C: 'You went for $x$ over $x - 3$ times $x - 7$. Both of those factors cancel. The brackets that survive are $x + 3$ and $x + 7$.'
      E: 'You went for a bracket $x + 4$. No 4 appears when we factorise: $x^2 - 9$ gives $x + 3$ and $x - 3$. The answer is $x$ over $x + 3$ times $x + 7$.'
  16:
    moments:
      - say: 'A right-angled triangle has sides $3x + 1$, $3x - 1$ and $x$ centimetres. We want $x$.'
        write: 'Sides: $3x + 1,\ \ 3x - 1,\ \ x$'
      - say: 'Let me draw the right-angled triangle with its three sides.'
        show_sketch: true
        point:
          - {figure: sketch, kind: highlight, target: AB, text: '3x + 1'}
          - {figure: sketch, kind: highlight, target: BC, text: '3x − 1'}
          - {figure: sketch, kind: highlight, target: AC, text: 'x'}
      - say: 'Pythagoras: the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hypotenuse}^{2} = \text{opposite}^{2} + \text{adjacent}^{2}$'
      - say: 'In a right-angled triangle, Pythagoras works, and the hypotenuse is the longest side. Here that''s $3x + 1$.'
        write: 'Hypotenuse $= 3x + 1$, the longest side'
        point:
          - {figure: sketch, kind: highlight, target: AB, text: 'hypotenuse'}
      - say: 'So the square on $3x + 1$ equals the sum of the squares on the other two sides.'
        write: '$(3x + 1)^{2} = (3x - 1)^{2} + x^{2}$'
      - say: 'Expand the left. $3x$ squared is $9x^2$, twice $3x$ times 1 is $6x$, and 1 squared is 1.'
        write: '$(3x + 1)^{2} = 9x^{2} + 6x + 1$'
      - say: 'Expand $3x - 1$ squared the same way, but the middle term is now negative $6x$.'
        write: '$(3x - 1)^{2} = 9x^{2} - 6x + 1$'
      - say: 'Put both expansions back into the Pythagoras equation.'
        write: '$9x^{2} + 6x + 1 = 9x^{2} - 6x + 1 + x^{2}$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '=9x2+6x+1'}, at: '9x2+6x+1'}
          - {line: 7, kind: move, from: {line: 6, at: '=9x2−6x+1'}, at: '9x2−6x+1'}
      - say: 'Subtract $9x^2$ and 1 from both sides. They cancel from each side.'
        write: '$6x = -6x + x^{2}$'
      - say: 'Add $6x$ to both sides. $6x$ plus $6x$ is $12x$.'
        write: '$12x = x^{2}$'
      - say: 'Bring everything to one side.'
        write: '$x^{2} - 12x = 0$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '12x'}, at: '−12x', text: 'across'}
      - say: 'Both terms have $x$ in them, so take $x$ out as a factor.'
        write: '$x(x - 12) = 0$'
      - say: 'So $x$ is 0 or 12. A side of length 0 makes no triangle, so $x$ is 12.'
        write: '$x = 0$ (no triangle) or $x = 12$'
        point:
          - {line: 12, kind: strike, at: 'x=0', text: 'not this'}
          - {figure: sketch, kind: label, target: AC, text: '12 cm'}
      - say: 'Let''s check. With $x = 12$, the sides are 3 times 12 plus 1, which is 37, then 3 times 12 minus 1, which is 35, and 12.'
        write: 'Sides: $3(12) + 1 = 37,\ \ 3(12) - 1 = 35,\ \ 12$'
        point:
          - {figure: sketch, kind: label, target: AB, text: '37'}
          - {figure: sketch, kind: label, target: CB, text: '35'}
          - {figure: sketch, kind: label, target: AC, text: '12'}
      - say: '35 squared is 1225, 12 squared is 144, and together they make 1369, which is 37 squared.'
        write: '$35^{2} + 12^{2} = 1225 + 144 = 1369 = 37^{2}$'
      - say: 'So $x$ is 12, which is answer choice D.'
        write: '$x = 12$'
        answer: true
    traps:
      A: 'You went for 2. Then the sides are 7, 5 and 2, and 5 squared plus 2 squared is 25 plus 4, which is 29, not 49. Pythagoras simplifies to $x^2 = 12x$, so $x$ is 12.'
      B: 'You went for 6. Then the sides are 19, 17 and 6, and 17 squared plus 6 squared is 289 plus 36, which is 325, not 361. Pythagoras gives $x^2 = 12x$, so $x$ is 12.'
      C: 'You went for 18. Then the sides are 55, 53 and 18, and 53 squared plus 18 squared is 3133, not 3025. Pythagoras gives $x^2 = 12x$, so $x$ is 12.'
      E: 'You went for 0. It does solve $x(x - 12) = 0$, but a side can''t have length 0. The other root, 12, is the one that makes a real triangle.'
  17:
    moments:
      - say: 'We have 14 exam scores, and we want the median.'
        write: 'Scores: $41, 29, 55, 21, 47, 70, 70, 40, 43, 56, 73, 23, 50, 50$'
      - say: 'The median is the middle score, so the scores must first be put in order.'
        write: 'Median: the middle score, in order'
      - say: 'From smallest to largest: 21, 23, 29, 40, 41, 43, 47, then 50, 50, 55, 56, 70, 70, 73.'
        write: 'In order: $21, 23, 29, 40, 41, 43, 47, 50, 50, 55, 56, 70, 70, 73$'
      - say: 'Picture one student for each score. How many scores are there? 14.'
        doodle: {name: 'student-small', id: class, caption: 'one student per score', repeat: 14, layout: row}
        write: 'Number of scores: $n = 14$'
      - say: 'Split the line of students down the middle. 14 is even, so there is no single middle score. Two scores share the middle: the 7th and the 8th, with 6 scores on either side. The median is their average.'
        doodle_do: [{id: class, op: split, n: 7, text: '1st to 7th | 8th to 14th'}]
        write: 'Median $= \dfrac{7\text{th} + 8\text{th}}{2}$'
      - say: 'Count along the ordered list: 21, 23, 29, 40, 41, 43, and the 7th is 47.'
        doodle_do: [{id: class, op: count, n: 7}]
        write: '7th score $= 47$'
        point:
          - {line: 2, kind: circle, at: '47', text: '7th'}
      - say: 'The very next one, the 8th, is 50.'
        write: '8th score $= 50$'
        point:
          - {line: 2, kind: circle, at: '47[[50]]', text: '8th'}
      - say: 'Now put those two scores into the median formula.'
        write: 'Median $= \dfrac{47 + 50}{2}$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '=47'}, at: '47'}
          - {line: 7, kind: move, from: {line: 6, at: '=50'}, at: '50'}
      - say: '47 plus 50 is 97, so we have 97 over 2.'
        write: '$= \dfrac{97}{2}$'
      - say: '97 divided by 2 is 48 and a half. So the median is 48 and a half, which is answer choice B.'
        write: '$= 48\tfrac{1}{2}$'
        answer: true
    traps:
      A: 'You went for 47. That''s only the 7th score. With 14 scores there are two middle scores, the 7th and 8th, and the median is their average, 48 and a half.'
      C: 'You went for 50. That''s the 8th score on its own, and it also appears twice. The median of 14 scores is the average of the 7th and 8th, 47 and 50, which is 48 and a half.'
      D: 'You went for 48. You were close: 47 plus 50 is 97, and half of 97 is 48 and a half, not 48. Keep the half.'
      E: 'You went for 49. The middle two scores are 47 and 50, and their average is 97 over 2, which is 48 and a half.'
  18:
    moments:
      - say: 'We want the equation that matches the graph. Let''s read three clues off the graph: where it crosses the $y$-axis, which way it opens, and where it crosses the $x$-axis.'
        write: 'Clues: $y$-intercept, shape, $x$-intercepts'
        point:
          - {figure: 0, kind: circle, target: {x: 190, y: 50}, text: 'y-axis crossing'}
          - {figure: 0, kind: arrow, target: {x: 152, y: 40}, text: 'shape'}
          - {figure: 0, kind: circle, target: '−1', text: 'x-axis crossing'}
      - say: 'Clue one: the curve crosses the $y$-axis at 1. At $x = 0$, each equation gives just its constant term, so the constant must be 1.'
        write: '$y$-intercept: $y = 1$ when $x = 0$'
        point:
          - {figure: 0, kind: label, target: {x: 190, y: 50}, text: 'y-intercept 1'}
      - say: 'Test option E at $x = 0$: 3 times 0, plus 2 times 0, minus 1, is negative 1. So E is out.'
        write: 'E: $3(0)^{2} + 2(0) - 1 = -1$, out'
      - say: 'Clue two: the curve opens downwards, like a hill. That means the $x^2$ term must be negative.'
        write: 'Opens downwards: coefficient of $x^{2} < 0$'
        point:
          - {figure: 0, kind: arrow, target: {x: 152, y: 40}, text: 'opens down'}
      - say: 'A and B have plus $3x^2$, so they open upwards and are out. That leaves C and D, which both have minus $3x^2$.'
        write: 'A, B have $+3x^{2}$: out. Left: C and D'
        point:
          - {line: 4, kind: strike, at: 'A,B', text: 'open upwards'}
      - say: 'Clue three: the curve crosses the $x$-axis at negative 1, so $y$ must be zero when $x$ is negative 1. Test D first.'
        write: 'D at $x = -1$: $y = 1 - 2(-1) - 3(-1)^{2}$'
        point:
          - {figure: 0, kind: circle, target: '−1', text: 'crosses here'}
      - say: 'Minus 2 times negative 1 is plus 2. Negative 1 squared is 1, so the last term is minus 3. 1 plus 2 minus 3 is zero.'
        write: '$= 1 + 2 - 3 = 0$'
      - say: 'Now test C at negative 1. 2 times negative 1 is negative 2, so we get 1 minus 2 minus 3, which is negative 4.'
        write: 'C at $x = -1$: $y = 1 + 2(-1) - 3(-1)^{2} = 1 - 2 - 3 = -4$'
      - say: 'So C misses the point where the graph crosses at negative 1, but D goes through it.'
        write: 'C: $y \ne 0$ at $x = -1$; D: $y = 0$'
        point:
          - {line: 7, kind: strike, at: 'C', text: 'not this'}
          - {line: 6, kind: circle, at: '=0', text: 'D fits'}
          - {figure: 0, kind: circle, target: '−1', text: 'x = −1'}
      - say: 'To be sure, let''s factorise D. $1 - 2x - 3x^2$ is $1 - 3x$ times $1 + x$.'
        write: '$1 - 2x - 3x^{2} = (1 - 3x)(1 + x)$'
      - say: 'Its roots are where each bracket is zero: $x = \tfrac{1}{3}$ and $x = -1$. Those are exactly where the graph crosses the $x$-axis.'
        write: '$1 - 3x = 0 \Rightarrow x = \tfrac{1}{3},\quad 1 + x = 0 \Rightarrow x = -1$'
        point:
