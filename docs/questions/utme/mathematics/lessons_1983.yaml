        write: '$\angle QTP = x + 2x = 3x$'
        point:
          - {figure: 0, kind: arc, target: QTP, text: '3x'}
      - say: 'The three angles of triangle $PQT$ add up to 180, by the angle sum of a triangle.'
        write: '$30 + (x + 90) + 3x = 180$ ($\angle$ sum of $\triangle$)'
      - say: 'Collect like terms. $x$ plus $3x$ is $4x$, and 30 plus 90 is 120.'
        write: '$4x + 120 = 180$'
      - say: 'Take 120 to the other side. 180 minus 120 is 60.'
        write: '$4x = 180 - 120 = 60$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '+120'}, at: '−120', text: 'across'}
