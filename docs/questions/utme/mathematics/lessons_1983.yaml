      - say: '$T$ is trapped inside a cube root, so the first job is to remove the root. The opposite of a cube root is cubing, so we cube both sides.'
        write: '$\left(\dfrac{av}{1 - v}\right)^{3} = \dfrac{2v + T}{2aT}$'
      - say: 'Cubing a fraction cubes the top and the bottom. $av$ cubed is $a^3v^3$, and the bottom becomes $1 - v$, cubed.'
