        write: 'Check (2): $\dfrac{810}{7} + \dfrac{450}{7} = \dfrac{1260}{7} = 180$'
      - say: 'So $x$ is 38 and 4 over 7 degrees, and $y$ is 32 and 1 over 7 degrees, which is answer choice E.'
