          - {figure: sketch, kind: label, target: AC, text: '12 cm'}
      - say: 'Let''s check. With $x = 12$, the sides are 3 times 12 plus 1, which is 37, then 3 times 12 minus 1, which is 35, and 12.'
        write: 'Sides: $3(12) + 1 = 37,\ \ 3(12) - 1 = 35,\ \ 12$'
        point:
