    moments:
      - say: 'We want to simplify $x - 7$ over $x^2 - 9$, times $x^2 - 3x$ over $x^2 - 49$.'
        write: '$\dfrac{x - 7}{x^{2} - 9} \times \dfrac{x^{2} - 3x}{x^{2} - 49}$'
      - say: 'With algebraic fractions, the method is always: factorise everything, then cancel what appears on both the top and the bottom.'
        write: 'Method: factorise, then cancel'
      - say: '$x^2 - 9$ is a difference of two squares, $x^2$ minus 3 squared. So it''s $x - 3$ times $x + 3$.'
        write: '$x^{2} - 9 = (x - 3)(x + 3)$'
      - say: '$x^2 - 3x$ has a common factor of $x$. Take it out, and we get $x$ times $x - 3$.'
        write: '$x^{2} - 3x = x(x - 3)$'
      - say: '$x^2 - 49$ is another difference of two squares, $x^2$ minus 7 squared.'
        write: '$x^{2} - 49 = (x - 7)(x + 7)$'
      - say: 'Now rewrite the question, putting in each factorised piece we just found.'
        write: 'Expression $= \dfrac{x - 7}{(x - 3)(x + 3)} \times \dfrac{x(x - 3)}{(x - 7)(x + 7)}$'
        point:
          - {line: 5, kind: move, from: {line: 2, at: '(x−3)(x+3)'}, at: '(x−3)(x+3)'}
          - {line: 5, kind: move, from: {line: 3, at: 'x(x−3)'}, at: 'x(x−3)'}
          - {line: 5, kind: move, from: {line: 4, at: '(x−7)(x+7)'}, at: '(x−7)(x+7)'}
      - say: 'Multiply the tops together and the bottoms together to make one fraction.'
        write: '$= \dfrac{x(x - 7)(x - 3)}{(x - 3)(x + 3)(x - 7)(x + 7)}$'
      - say: '$x - 7$ is on the top and on the bottom, so it cancels.'
        write: '$= \dfrac{x(x - 3)}{(x - 3)(x + 3)(x + 7)}$'
        point:
          - {line: 6, kind: strike, at: 'x[[(x−7)]]', text: 'cancels'}
          - {line: 6, kind: strike, at: '(x+3)[[(x−7)]]'}
      - say: '$x - 3$ is also on both the top and the bottom, so that cancels too.'
        write: '$= \dfrac{x}{(x + 3)(x + 7)}$'
        point:
          - {line: 7, kind: strike, at: 'x[[(x−3)]]', text: 'cancels'}
          - {line: 7, kind: strike, at: '[[(x−3)]](x+3)'}
      - say: 'What''s left is $x$ over $x + 3$ times $x + 7$, which is answer choice D.'
        write: 'Simplified: $\dfrac{x}{(x + 3)(x + 7)}$'
        answer: true
    traps:
      A: 'You went for $x$ over $x - 3$ times $x + 7$. The $x - 3$ is the factor that cancels, because it''s on the top and the bottom. The one that survives is $x + 3$.'
      B: 'You went for $x + 3$ times $x + 7$, over $x$. That''s the right answer turned upside down. The $x$ comes from the top, $x^2 - 3x$, so it stays on top.'
      C: 'You went for $x$ over $x - 3$ times $x - 7$. Both of those factors cancel. The brackets that survive are $x + 3$ and $x + 7$.'
      E: 'You went for a bracket $x + 4$. No 4 appears when we factorise: $x^2 - 9$ gives $x + 3$ and $x - 3$. The answer is $x$ over $x + 3$ times $x + 7$.'
  16:
