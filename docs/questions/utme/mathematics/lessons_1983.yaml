  39:
    moments:
      - say: 'A square paper has side 2.524375 cm, and a square diagram of side 0.524375 cm is drawn on it. We want the area not covered, to 3 significant figures.'
        write: 'Paper side $a = 2.524375$, diagram side $b = 0.524375$'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '2.524375 cm', text: 'a'}
          - {figure: sketch, kind: circle, target: '0.524375 cm', text: 'b'}
      - say: 'The area of a square is its side, squared.'
        write: 'Area of a square $= \text{side}^{2}$'
      - say: 'First part: the paper, a big square of side 2.524375. Its area is 2.524375 squared.'
        write: 'Paper: $A_{1} = 2.524375^{2}$'
        point:
          - {figure: sketch, kind: highlight, target: '2.524375 cm', text: 'big square'}
      - say: 'Second part: the diagram, a small square of side 0.524375. Its area is 0.524375 squared.'
        write: 'Diagram: $A_{2} = 0.524375^{2}$'
        point:
          - {figure: sketch, kind: highlight, target: '0.524375 cm', text: 'small square'}
      - say: 'The uncovered area is the area of the big square minus the area of the small square.'
        write: 'Uncovered area $= a^{2} - b^{2} = 2.524375^{2} - 0.524375^{2}$'
        point:
          - {figure: sketch, kind: circle, target: '?', text: 'a² − b²'}
      - say: 'Squaring those long decimals would be painful. But this is a difference of two squares, so we can use $a - b$ times $a + b$.'
        write: 'Difference of squares: $a^{2} - b^{2} = (a - b)(a + b)$'
      - say: 'Look how neat it gets. The decimal parts are the same, so $a$ minus $b$ is exactly 2.'
        write: '$a - b = 2.524375 - 0.524375 = 2$'
      - say: 'And $a$ plus $b$: 2.524375 plus 0.524375 is 3.04875.'
        write: '$a + b = 2.524375 + 0.524375 = 3.04875$'
      - say: 'Now put both of those back into the area.'
        write: 'Area $= (a - b)(a + b) = 2 \times 3.04875$'
        point:
          - {line: 5, kind: box, text: 'the rule'}
          - {line: 8, kind: move, from: {line: 6, at: '0.524375[[=2]]'}, at: '[[2]]×'}
          - {line: 8, kind: move, from: {line: 7, at: '=3.04875'}, at: '3.04875'}
      - say: '2 times 3.04875 is 6.0975 square centimetres.'
        write: '$= 6.0975\ \text{cm}^{2}$'
      - say: 'Now round to 3 significant figures. The first three figures are 6, 0 and 9, and the next digit is 7, so the 9 goes up. 6.09 becomes 6.10.'
        write: '$6.0975 \approx 6.10$ to 3 significant figures'
      - say: 'The final zero is a significant figure, so we keep it. Writing just 6 would be only one significant figure.'
        write: 'Keep the zero: $6.10$, not $6$'
      - say: 'So the area not covered is 6.10 square centimetres, which is answer choice B.'
