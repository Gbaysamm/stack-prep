      - say: 'Now clear the fractions by cross-multiplying: the top of each side times the bottom of the other.'
        write: '$2aT \times a^{3}v^{3} = (1 - v)^{3}(2v + T)$'
      - say: 'On the left, $2a$ times $a^3$ is $2a^4$. So the left side is $2a^4v^3T$.'
