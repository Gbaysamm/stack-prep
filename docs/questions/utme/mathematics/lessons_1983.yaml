# UTME 1983 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1983.yaml. Answers match that file.
# This is a five-option paper (A-E), so each lesson has four traps.
format_version: 1
exam_year: 1983
lessons:
  1:
    moments:
      - say: 'We have five measurements: 5, 9, 3, 5 and 8. We want the median, $M$, and the mode, $D$, written as a pair.'
        write: 'Data: $5,\ 9,\ 3,\ 5,\ 8$'
      - say: 'First, what do the words mean? The median is the middle value, once the numbers are put in order.'
        write: 'Median $M$: the middle value, in order'
      - say: 'And the mode is the value that appears most often.'
        write: 'Mode $D$: the most frequent value'
      - say: 'So let''s put the numbers in order, smallest first. The smallest is 3, then the two 5s, then 8, then 9.'
        write: 'In order: $3,\ 5,\ 5,\ 8,\ 9$'
      - say: 'How many values are there? Five. With five values, the middle one is the third, because two values sit on each side of it.'
        write: '$n = 5$, so the middle is the 3rd value'
      - say: 'Now count along the ordered list: 3 is first, 5 is second, and 5 is third. So the median is 5.'
        write: 'Median: $M = 5$'
        point:
          - {line: 4, kind: circle, at: '3rd', text: 'the middle'}
      - say: 'Now the mode. Go back to the ordered list and count each value: 3 appears once, 5 appears twice, 8 once and 9 once.'
        write: 'Counts: $3 \to 1,\ \ 5 \to 2,\ \ 8 \to 1,\ \ 9 \to 1$'
      - say: '5 appears more often than any other value, so the mode is 5.'
        write: 'Mode: $D = 5$'
        point:
          - {line: 6, kind: circle, at: '5→2', text: 'most often'}
      - say: 'Putting the two together, $M$ is 5 and $D$ is 5, so the pair is 5, 5, which is answer choice D.'
        write: '$(M,\ D) = (5,\ 5)$'
        answer: true
    traps:
      A: 'You went for 6, 5. The 6 is the mean: the numbers add to 30, and 30 divided by 5 is 6. The median is the middle value once they''re in order, which is 5.'
      B: 'You went for 5, 8. The median is right, but 8 appears only once. The mode is the value that appears most often, and that''s 5, which appears twice.'
      C: 'You went for 5, 7. The median is right, but 7 is not even one of the measurements. The mode is the most frequent value, which is 5.'
      E: 'You went for 7, 5. The mode is right, but the median is the middle value after sorting: 3, 5, 5, 8, 9. The middle one is 5, not 7.'
  2:
    moments:
      - say: 'Two partners, X and Y, share the profit in the ratio 4 to 5. At the end of the year, Y got ₦5,000 more than X. We want the total profit.'
        doodle: {name: 'custom:1983_q02_a', caption: 'Profit shared X : Y = 4 : 5'}
        write: 'Ratio: $X : Y = 4 : 5$'
      - say: 'Think of the profit as cut into equal parts. X gets 4 of the parts and Y gets 5 of them.'
        write: 'X gets 4 parts, Y gets 5 parts'
      - say: 'So how many more parts does Y get than X? 5 minus 4 is 1. Y gets 1 part more.'
        write: 'Difference: $5 - 4 = 1$ part'
      - say: 'And the question says Y got ₦5,000 more than X. So that 1 extra part must be worth ₦5,000.'
        write: '1 part = ₦5,000'
      - say: 'Now the whole profit. Going back to the ratio, the total number of parts is 4 plus 5, which is 9.'
        write: 'Total parts: $4 + 5 = 9$'
      - say: 'Each of those 9 parts is worth ₦5,000, so the total profit is 9 times 5,000.'
        write: 'Total profit $= 9 \times 5{,}000$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '=9'}, at: '9', text: 'parts'}
          - {line: 5, kind: move, from: {line: 3, at: '₦5,000'}, at: '5,000', text: 'each part'}
      - say: '9 times 5,000 is 45,000.'
        write: '$= 45{,}000$'
      - say: 'Let''s check. X gets 4 parts, and 4 times 5,000 is 20,000.'
        write: 'X: $4 \times 5{,}000 = 20{,}000$'
      - say: 'Y gets 5 parts, and 5 times 5,000 is 25,000.'
        write: 'Y: $5 \times 5{,}000 = 25{,}000$'
      - say: 'The difference is 25,000 minus 20,000, which is 5,000, just as the question said.'
        write: 'Difference: $25{,}000 - 20{,}000 = 5{,}000$'
      - say: 'So the total profit for the year is ₦45,000, which is answer choice E.'
        write: 'Total profit: ₦45,000'
        answer: true
    traps:
      A: 'You went for ₦20,000. That''s X''s share on its own, 4 parts of ₦5,000. The question wants the whole profit, which is 9 parts.'
      B: 'You went for ₦25,000. That''s Y''s share on its own, 5 parts of ₦5,000. The whole profit is 9 parts, which is ₦45,000.'
      C: 'You went for ₦30,000. That doesn''t fit the ratio. The ₦5,000 difference is 1 part, the whole profit is 9 parts, and 9 times 5,000 is 45,000.'
      D: 'You went for ₦15,000. The ₦5,000 is the value of one part, but the whole profit has 4 plus 5, which is 9 parts, not 3. 9 times 5,000 is 45,000.'
  3:
    moments:
      - say: 'We have a regular hexagon, and we want the size of each of its interior angles.'
        write: 'Regular hexagon: $n = 6$ sides'
      - say: 'Let me draw a diagram of this, to make it simpler to see.'
        show_sketch: true
      - say: 'Regular means all six sides are equal and all six angles are equal.'
        write: 'All 6 interior angles are equal'
      - say: 'The easiest way in is from the outside. Walk once round any polygon and you turn through one full turn, so the exterior angles always add up to 360 degrees.'
        write: 'Sum of exterior angles $= 360^{\circ}$'
        point:
          - {figure: sketch, kind: circle, target: '60°', text: 'exterior angle'}
      - say: 'Here the six exterior angles are equal, so each one is 360 divided by 6.'
        write: 'Each exterior angle $= \dfrac{360^{\circ}}{6}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '360∘'}, at: '360∘', text: 'shared by 6'}
      - say: '360 divided by 6 is 60, so each exterior angle is 60 degrees.'
        write: '$= 60^{\circ}$'
      - say: 'An interior angle and its exterior angle sit together on a straight line, so they add up to 180 degrees.'
        write: 'Interior $+$ exterior $= 180^{\circ}$'
        point:
          - {figure: sketch, kind: circle, target: '?', text: 'interior'}
          - {figure: sketch, kind: circle, target: '60°', text: 'exterior'}
      - say: 'So each interior angle is 180 minus the 60 we just found, which is 120 degrees.'
        write: 'Interior $= 180^{\circ} - 60^{\circ} = 120^{\circ}$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '60∘'}, at: '−60∘', text: 'from here'}
          - {figure: sketch, kind: circle, target: '?', text: '120°'}
      - say: 'Let''s check another way. The interior angles of a polygon with $n$ sides add up to $n$ minus 2, times 180 degrees.'
        write: 'Sum of interior angles $= (n - 2) \times 180^{\circ}$'
      - say: 'Put in $n = 6$. 6 minus 2 is 4, and 4 times 180 is 720 degrees.'
        write: '$= (6 - 2) \times 180^{\circ} = 4 \times 180^{\circ} = 720^{\circ}$'
        point:
          - {line: 8, kind: box, text: 'the rule'}
          - {line: 9, kind: move, from: {line: 0, at: 'n=[[6]]'}, at: '([[6]]−2)', text: 'n = 6'}
      - say: 'Shared equally among the six angles, 720 divided by 6 is 120. It agrees.'
        write: 'Each angle $= \dfrac{720^{\circ}}{6} = 120^{\circ}$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '=720∘'}, at: '720∘'}
      - say: 'So each interior angle is 120 degrees, which is answer choice C.'
        write: 'Each interior angle $= 120^{\circ}$'
        answer: true
    traps:
      A: 'You went for 60 degrees. That''s the exterior angle. The interior angle sits beside it on a straight line, so it''s 180 minus 60, which is 120 degrees.'
      B: 'You went for 30 degrees. That''s half of the exterior angle, and far too small for a hexagon''s corner. Each exterior angle is 360 divided by 6, which is 60, and each interior angle is 180 minus 60, which is 120.'
      D: 'You went for 45 degrees. That''s the exterior angle of a regular octagon, 360 divided by 8. A hexagon has 6 sides, so its exterior angle is 60 and its interior angle is 120.'
      E: 'You went for 135 degrees. That''s the interior angle of a regular octagon, with 8 sides. A hexagon has 6 sides, so each interior angle is 180 minus 60, which is 120.'
  4:
    moments:
      - say: 'Three expressions are all equal to each other: $4x - 3$, $3x + y$ and $2y + 5x - 12$. We want $x$ and $y$.'
        write: '$4x - 3 = 3x + y = 2y + 5x - 12$'
      - say: 'A chain like this holds two equations. We''ll set the first expression equal to the second, and then the second equal to the third.'
        write: 'Two equations from one chain'
      - say: 'First pair: $4x - 3$ equals $3x + y$.'
        write: 'First pair: $4x - 3 = 3x + y$'
      - say: 'Subtract $3x$ from both sides. $4x$ minus $3x$ is $x$, so $x - 3$ equals $y$.'
        write: '$x - 3 = y$'
      - say: 'Now subtract $y$ from both sides and add 3 to both sides. That gives $x - y = 3$. Let''s call it equation one.'
        write: '$x - y = 3 \quad (1)$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '=y'}, at: '−y', text: 'across'}
          - {line: 4, kind: move, from: {line: 3, at: '−3'}, at: '=3', text: 'across'}
      - say: 'Second pair: $3x + y$ equals $2y + 5x - 12$.'
        write: 'Second pair: $3x + y = 2y + 5x - 12$'
      - say: 'Bring the letters to the left by subtracting $2y$ and $5x$ from both sides.'
        write: '$3x - 5x + y - 2y = -12$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '2y'}, at: '−2y', text: 'across'}
          - {line: 6, kind: move, from: {line: 5, at: '+5x'}, at: '−5x', text: 'across'}
      - say: '$3x$ minus $5x$ is negative $2x$, and $y$ minus $2y$ is negative $y$.'
        write: '$-2x - y = -12$'
      - say: 'Multiply both sides by negative 1 to tidy it up. That gives $2x + y = 12$. Let''s call it equation two.'
        write: '$2x + y = 12 \quad (2)$'
      - say: 'Look: equation one has minus $y$ and equation two has plus $y$. If we add the two equations, the $y$ terms cancel.'
        write: 'Add (1) and (2): $(x - y) + (2x + y) = 3 + 12$'
        point:
          - {line: 9, kind: strike, at: '-y', text: 'cancels'}
          - {line: 9, kind: strike, at: '+y'}
      - say: '$x$ plus $2x$ is $3x$, and 3 plus 12 is 15.'
        write: '$3x = 15$'
      - say: 'Divide both sides by 3. 15 divided by 3 is 5.'
        write: '$x = \dfrac{15}{3} = 5$'
      - say: 'Now go back to equation one and put in $x = 5$. That gives 5 minus $y$ equals 3.'
        write: 'In (1): $5 - y = 3$'
        point:
          - {line: 12, kind: move, from: {line: 11, at: '=5'}, at: '[[5]]−y', text: 'sub in'}
      - say: 'So $y$ is 5 minus 3, which is 2.'
        write: '$y = 5 - 3 = 2$'
      - say: 'Let''s check all three expressions. 4 times 5, minus 3, is 17. 3 times 5, plus 2, is 17. And 2 times 2, plus 5 times 5, minus 12, is 4 plus 25 minus 12, which is 17.'
        write: 'Check: $4(5) - 3 = 17,\ \ 3(5) + 2 = 17,\ \ 2(2) + 5(5) - 12 = 17$'
      - say: 'So $x = 5$ and $y = 2$, which is answer choice A.'
        write: '$x = 5,\ y = 2$'
        answer: true
    traps:
      B: 'You went for $x = 2$ and $y = 5$. Those are the right numbers, but swapped. Adding the equations gives $3x = 15$, so $x$ is 5, and then $y$ is 2.'
      C: 'You went for $x = -2$ and $y = -5$. Check it: $4(-2) - 3$ is negative 11, and $3(-2) + (-5)$ is negative 11 too, but the third expression is negative 10 minus 10 minus 12, which is negative 32. They are not all equal. The solution is $x = 5$, $y = 2$.'
      D: 'You went for $x = 5$ and $y = -2$. The $x$ is right, but the sign of $y$ slipped. From $x - y = 3$, $y$ is $x - 3$, which is 5 minus 3, positive 2.'
      E: 'You went for $x = -5$ and $y = -2$. Both signs are wrong. Adding the equations gives $3x = 15$, so $x$ is positive 5, and $y = x - 3$ is positive 2.'
  5:
    moments:
      - say: 'We''re told that $x = 1$ is a root of $x^3 - 2x^2 - 5x + 6 = 0$. We want the other two roots.'
        write: '$x^{3} - 2x^{2} - 5x + 6 = 0$'
      - say: 'If 1 is a root, then $x - 1$ is a factor. So we divide the cubic by $x - 1$, and a quadratic will be left over.'
        write: 'Root $x = 1$, so $(x - 1)$ is a factor'
      - say: 'Let''s use synthetic division. Write down the coefficients of the cubic: 1, negative 2, negative 5 and 6. We divide by the root, 1.'
        write: 'Coefficients: $1,\ -2,\ -5,\ 6$'
      - say: 'Bring down the first coefficient, 1, as it is.'
        write: 'Bring down: $1$'
      - say: 'Multiply it by the root, 1, and add to the next coefficient. Negative 2 plus 1 times 1 is negative 1.'
        write: '$-2 + 1 \times 1 = -1$'
      - say: 'Next, negative 1 times 1 is negative 1, and negative 5 plus negative 1 is negative 6.'
        write: '$-5 + (-1) \times 1 = -6$'
      - say: 'Then negative 6 times 1 is negative 6, and 6 plus negative 6 is zero. A remainder of zero confirms that $x - 1$ is a factor.'
        write: 'Remainder: $6 + (-6) \times 1 = 0$'
        point:
          - {line: 6, kind: circle, at: '=0', text: 'remainder 0'}
      - say: 'The numbers we got, 1, negative 1 and negative 6, are the coefficients of the quadratic that is left: $x^2 - x - 6$.'
        write: '$x^{3} - 2x^{2} - 5x + 6 = (x - 1)(x^{2} - x - 6)$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '=−1'}, at: '−x', text: 'coefficients'}
          - {line: 7, kind: move, from: {line: 5, at: '=−6'}, at: '−6)'}
      - say: 'Now factorise $x^2 - x - 6$. We want two numbers that multiply to negative 6 and add to negative 1. That''s negative 3 and 2.'
        write: '$-3 \times 2 = -6,\quad -3 + 2 = -1$'
      - say: 'So the quadratic factorises as $x - 3$ times $x + 2$.'
        write: '$x^{2} - x - 6 = (x - 3)(x + 2)$'
      - say: 'Set each factor to zero. $x - 3 = 0$ gives $x = 3$, and $x + 2 = 0$ gives $x = -2$.'
        write: '$x - 3 = 0 \Rightarrow x = 3,\quad x + 2 = 0 \Rightarrow x = -2$'
      - say: 'Let''s check $x = 3$ in the original cubic: 27 minus 18 minus 15 plus 6 is zero.'
        write: 'At $x = 3$: $27 - 18 - 15 + 6 = 0$'
      - say: 'And $x = -2$: negative 8 minus 8 plus 10 plus 6 is zero too.'
        write: 'At $x = -2$: $-8 - 8 + 10 + 6 = 0$'
      - say: 'So the other roots are 3 and negative 2, which is answer choice C.'
        write: 'Other roots: $x = 3$ and $x = -2$'
        answer: true
    traps:
      A: 'You went for negative 3 and 2. Those are the numbers inside the brackets, not the roots. The factor $x - 3$ is zero when $x$ is positive 3, and $x + 2$ is zero when $x$ is negative 2.'
      B: 'You went for negative 2 and 2. Negative 2 is a root, but 2 is not: 8 minus 8 minus 10 plus 6 is negative 4, not zero. The other root is 3.'
      D: 'You went for 1 and 3. The 1 is the root we were given; the question wants the other two. Dividing out $x - 1$ leaves $(x - 3)(x + 2)$, so they are 3 and negative 2.'
      E: 'You went for negative 3 and 1. The 1 was already given, and negative 3 is not a root at all. The quadratic left over is $(x - 3)(x + 2)$, giving 3 and negative 2.'
  6:
    moments:
      - say: '$x$ is jointly proportional to the cube of $y$ and the fourth power of $z$. We halve $y$, double $z$, and ask how $x$ changes.'
        write: '$x \propto y^{3}z^{4}$'
      - say: 'Jointly proportional means $x$ equals a constant, $k$, times $y$ cubed times $z$ to the fourth.'
        write: '$x = ky^{3}z^{4}$'
      - say: 'Halving $y$ turns it into $y$ over 2. Doubling $z$ turns it into $2z$. Let''s put those into the formula to get the new $x$.'
        write: 'New $x = k\left(\dfrac{y}{2}\right)^{3}(2z)^{4}$'
      - say: 'Each bracket keeps its own power. $y$ over 2, cubed, is $y$ cubed over 2 cubed, and 2 cubed is 8.'
        write: '$\left(\dfrac{y}{2}\right)^{3} = \dfrac{y^{3}}{2^{3}} = \dfrac{y^{3}}{8}$'
      - say: '$2z$ to the fourth is 2 to the fourth times $z$ to the fourth. 2 times 2 times 2 times 2 is 16.'
        write: '$(2z)^{4} = 2^{4}z^{4} = 16z^{4}$'
      - say: 'Now put both of those back into the new $x$.'
        write: 'New $x = k \times \dfrac{y^{3}}{8} \times 16z^{4}$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '=8y3'}, at: '8y3'}
          - {line: 5, kind: move, from: {line: 4, at: '=16z4'}, at: '16z4'}
      - say: 'Gather the numbers: 16 over 8 is 2.'
        write: '$= \dfrac{16}{8}\,ky^{3}z^{4} = 2ky^{3}z^{4}$'
      - say: 'And $ky^3z^4$ is exactly the old $x$, from our first formula. So the new $x$ is 2 times the old $x$.'
        write: 'New $x = 2 \times$ old $x$'
        point:
          - {line: 1, kind: arrow, from: {line: 6, at: '2[[ky3z4]]'}, at: 'ky3z4', text: 'old x'}
      - say: 'So new $x$ to old $x$ is 2 to 1. Since $x$ has doubled, it''s an increase.'
        write: 'New $x$ : old $x = 2 : 1$'
      - say: 'So $x$ increases in the ratio 2 to 1, which is answer choice B.'
        write: 'Ratio $2 : 1$, an increase'
        answer: true
    traps:
      A: 'You went for 4 to 1. That comes from giving a factor the wrong power, such as squaring the half instead of cubing it: 16 over 4 is 4. Halving $y$ divides by 2 cubed, which is 8, doubling $z$ multiplies by 16, and 16 over 8 is 2.'
      C: 'You went for 1 to 4, a decrease. But doubling $z$ multiplies $x$ by 16, which outweighs dividing by 8 from halving $y$. Overall $x$ is multiplied by 2, an increase.'
      D: 'You went for no change. The two changes would only cancel if their factors matched. Here halving $y$ divides $x$ by 8, and doubling $z$ multiplies it by 16, so $x$ doubles.'
      E: 'You went for 3 to 4, a decrease. Halving $y$ divides $x$ by 2 cubed, which is 8, and doubling $z$ multiplies it by 2 to the fourth, which is 16. 16 over 8 is 2, so $x$ increases, 2 to 1.'
  7:
    moments:
      - say: 'In the figure, triangle $PQR$ has a right angle at $P$ and 60 degrees at $Q$, with $QR = 8$ cm. Triangle $PRS$ has a right angle at $R$ and 45 degrees at $P$. We want $PS$.'
        write: '$QR = 8$ cm, $\angle PQR = 60^{\circ}$, $\angle RPS = 45^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: PQR, text: '60°'}
          - {figure: 0, kind: highlight, target: QR, text: '8 cm'}
          - {figure: 0, kind: arc, target: RPS, text: '45°'}
      - say: 'The plan: first find $PR$, the side the two triangles share. Then use it in triangle $PRS$ to reach $PS$.'
        write: 'Plan: find $PR$ first, then $PS$'
        point:
          - {figure: 0, kind: highlight, target: PR, text: 'shared side'}
          - {figure: 0, kind: highlight, target: PS, text: 'want'}
      - say: 'In triangle $PQR$ the right angle is at $P$, so the side opposite it, $QR$, is the hypotenuse. It''s 8 cm.'
        write: 'In $\triangle PQR$: hypotenuse $QR = 8$'
        point:
          - {figure: 0, kind: highlight, target: QR, text: 'hypotenuse'}
      - say: 'SOH: the sine of an angle is the opposite side over the hypotenuse.'
        write: 'SOH: $\sin\theta = \dfrac{\text{opposite}}{\text{hypotenuse}}$'
      - say: '$PR$ is the side opposite the 60 degree angle at $Q$. Opposite over hypotenuse is sine.'
        write: '$\sin 60^{\circ} = \dfrac{PR}{QR} = \dfrac{PR}{8}$'
        point:
          - {figure: 0, kind: highlight, target: PR, text: 'opposite'}
          - {figure: 0, kind: arc, target: PQR, text: '60°'}
      - say: 'Multiply both sides by 8, so $PR$ is 8 times sine 60 degrees.'
        write: '$PR = 8\sin 60^{\circ}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '[[8]]PR'}, at: '[[8]]sin', text: 'times 8'}
      - say: 'Sine 60 degrees is root 3 over 2.'
        write: '$= 8 \times \dfrac{\sqrt{3}}{2}$'
      - say: '8 divided by 2 is 4, so $PR$ is 4 root 3 cm.'
        write: '$PR = 4\sqrt{3}$ cm'
        point:
          - {figure: 0, kind: label, target: PR, text: '4√3'}
      - say: 'The rule: the three angles of any triangle add up to 180 degrees.'
        write: 'Angle sum of a triangle: $A + B + C = 180^{\circ}$'
      - say: 'Now triangle $PRS$. It has 90 degrees at $R$ and 45 at $P$, so the angle at $S$ is 180 minus 90 minus 45, which is 45 degrees too.'
        write: 'In $\triangle PRS$: $\angle PSR = 180^{\circ} - 90^{\circ} - 45^{\circ} = 45^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: PSR, text: '45°'}
      - say: 'Two equal angles mean two equal sides. So $RS$ equals the $PR$ we just found, 4 root 3.'
        write: '$RS = PR = 4\sqrt{3}$'
        point:
          - {line: 10, kind: move, from: {line: 7, at: '43'}, at: '43', text: 'just found'}
          - {figure: 0, kind: label, target: RS, text: '4√3'}
      - say: 'Pythagoras: the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hypotenuse}^{2} = \text{opposite}^{2} + \text{adjacent}^{2}$'
      - say: '$PS$ is opposite the right angle at $R$, so it''s the hypotenuse. By Pythagoras, $PS$ squared is $PR$ squared plus $RS$ squared.'
        write: '$PS^{2} = PR^{2} + RS^{2}$'
        point:
          - {figure: 0, kind: highlight, target: PS, text: 'hypotenuse'}
      - say: 'Put in 4 root 3 for both sides.'
        write: '$= (4\sqrt{3})^{2} + (4\sqrt{3})^{2}$'
      - say: '4 root 3 squared is 16 times 3, which is 48. So we have 48 plus 48, which is 96.'
        write: '$= 48 + 48 = 96$'
      - say: 'So $PS$ is the square root of 96. 96 is 16 times 6, and the square root of 16 is 4.'
        write: '$PS = \sqrt{96} = \sqrt{16 \times 6} = 4\sqrt{6}$'
      - say: 'So $PS$ is 4 root 6 cm, which is answer choice B.'
        write: '$PS = 4\sqrt{6}$ cm'
        answer: true
    traps:
      A: 'You went for 2 root 3. That''s only half of $PR$, and $PS$ is longer still, since it''s a hypotenuse. $PR$ is 4 root 3, and $PS$ is $PR$ times root 2, which is 4 root 6.'
      C: 'You went for 2 root 6, exactly half the answer. $PR$ faces the 60 degree angle, so $PR$ is 8 sine 60, which is 4 root 3, and then $PS$ is 4 root 3 times root 2, which is 4 root 6.'
      D: 'You went for 8 root 6, double the answer. Sine 60 is root 3 over 2, so $PR$ is 8 times root 3 over 2, which is 4 root 3, not 8 root 3. Then $PS$ is 4 root 6.'
      E: 'You went for 8 cm. That''s $QR$, the hypotenuse of the first triangle. $PS$ is the hypotenuse of the second triangle, $PRS$, and works out to 4 root 6 cm.'
  8:
    moments:
      - say: 'We know $\cos z = L$, where $z$ is acute. We want the expression cot $z$ minus cosec $z$, over sec $z$ plus tan $z$, written in terms of $L$.'
        write: '$\dfrac{\cot z - \operatorname{cosec} z}{\sec z + \tan z}$'
      - say: 'The plan: write everything using sine and cosine, simplify, then replace them with $L$. First we need $\sin z$, and for that we use the identity sine squared plus cos squared equals 1.'
        write: '$\sin^{2}z + \cos^{2}z = 1$'
      - say: 'Put $L$ in for $\cos z$ and move it across. $\sin^2 z$ is 1 minus $L$ squared.'
