          - {figure: 0, kind: circle, target: '(x + 3y)°', text: 'above'}
          - {figure: 0, kind: circle, target: 'y°', text: 'below'}
      - say: 'Angles on a straight line add up to 180 degrees. That''s true on the top side and on the bottom side, so we get two equations.'
        write: 'Angles on a straight line $= 180^{\circ}$'
        point:
          - {figure: 0, kind: highlight, target: PR, text: 'straight line'}
          - {figure: 0, kind: circle, target: '45°', text: 'top: 180°'}
          - {figure: 0, kind: circle, target: '(3x + y)°', text: 'bottom: 180°'}
      - say: 'Above the line: $x + 3y$ plus 45 is 180.'
        write: 'Above: $(x + 3y) + 45 = 180$'
        point:
          - {figure: 0, kind: circle, target: '(x + 3y)°'}
          - {figure: 0, kind: circle, target: '45°'}
      - say: 'Subtract 45 from both sides. 180 minus 45 is 135. That''s equation one.'
        write: '$x + 3y = 180 - 45 = 135 \quad (1)$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '+45'}, at: '−45', text: 'across'}
      - say: 'Below the line: $y$ plus $3x + y$ is 180.'
        write: 'Below: $y + (3x + y) = 180$'
        point:
          - {figure: 0, kind: circle, target: 'y°'}
          - {figure: 0, kind: circle, target: '(3x + y)°'}
      - say: '$y$ plus $y$ is $2y$. That''s equation two.'
        write: '$3x + 2y = 180 \quad (2)$'
      - say: 'From equation one, subtract $3y$ from both sides: $x$ is 135 minus $3y$.'
        write: 'From (1): $x = 135 - 3y$'
      - say: 'Substitute that into equation two, in place of $x$.'
        write: 'In (2): $3(135 - 3y) + 2y = 180$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '135−3y'}, at: '(135−3y)', text: 'in for x'}
      - say: '3 times 135 is 405, and 3 times $3y$ is $9y$.'
        write: '$405 - 9y + 2y = 180$'
      - say: 'Negative $9y$ plus $2y$ is negative $7y$.'
        write: '$405 - 7y = 180$'
      - say: 'Add $7y$ to both sides and subtract 180. 405 minus 180 is 225.'
        write: '$7y = 405 - 180 = 225$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '−7y'}, at: '7y', text: 'across'}
          - {line: 10, kind: move, from: {line: 9, at: '=180'}, at: '−180', text: 'across'}
      - say: 'Divide by 7. 7 times 32 is 224, so 225 over 7 is 32 and 1 over 7.'
        write: '$y = \dfrac{225}{7} = 32\tfrac{1}{7}$'
      - say: 'Now go back to $x$ equals 135 minus $3y$, and put in 225 over 7 for $y$. 3 times 225 is 675.'
        write: '$x = 135 - 3 \times \dfrac{225}{7} = 135 - \dfrac{675}{7}$'
        point:
          - {line: 6, kind: arrow, at: 'x=135−3y', text: 'back here'}
          - {line: 12, kind: move, from: {line: 11, at: '7225'}, at: '7225', text: 'y'}
      - say: '135 times 7 is 945, so 135 is 945 over 7. And 945 minus 675 is 270.'
        write: '$= \dfrac{945}{7} - \dfrac{675}{7} = \dfrac{270}{7}$'
