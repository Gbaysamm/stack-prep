# UTME 1983 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1983.yaml. Answers match that file.
# This is a five-option paper (A-E), so each lesson has four traps.
format_version: 1
exam_year: 1983
lessons:
  1:
    moments:
      - say: 'We have five measurements: 5, 9, 3, 5 and 8. We want the median $M$ and the mode $D$, written as a pair.'
        write: '$5,\ 9,\ 3,\ 5,\ 8$'
      - say: 'First, what do these words mean? The median is the middle value once the numbers are in order. The mode is the value that appears most often.'
      - say: 'So let''s put the numbers in order, from smallest to largest. The smallest is 3, then the two 5s, then 8, then 9.'
        write: '$3,\ 5,\ 5,\ 8,\ 9$'
      - say: 'How many values do we have? Five. With five values, the middle one is the third, because two values sit on each side of it.'
        write: '$n = 5 \Rightarrow \text{middle} = \text{3rd value}$'
      - say: 'Counting along: 3 is first, 5 is second, and 5 is third. So the median is 5.'
        write: '$M = 5$'
      - say: 'Now the mode. 3 appears once, 5 appears twice, 8 appears once and 9 appears once.'
        write: '$5 \text{ appears twice}$'
      - say: 'So 5 appears most often, and the mode is 5.'
        write: '$D = 5$'
      - say: 'Putting them together, $M$, $D$ is 5, 5, which is answer choice D.'
        write: '$(M,\ D) = (5,\ 5)$'
        answer: true
    traps:
      A: 'You went for 6, 5. The 6 is the mean: the numbers add to 30, and 30 divided by 5 is 6. The median is the middle value once they''re in order, which is 5.'
      B: 'You went for 5, 8. The median is right, but 8 appears only once. The mode is the value that appears most often, and that''s 5, which appears twice.'
      C: 'You went for 5, 7. The median is right, but 7 is not even one of the measurements. The mode is the most frequent value, which is 5.'
      E: 'You went for 7, 5. The mode is right, but the median is the middle value after sorting: 3, 5, 5, 8, 9. The middle one is 5, not 7.'
  2:
    moments:
      - say: 'Two partners, X and Y, share the profit in the ratio 4 to 5. At the end of the year, Y got ₦5,000 more than X. We want the total profit.'
        write: '$X : Y = 4 : 5$'
      - say: 'Think of the profit as cut into equal parts. X gets 4 of the parts and Y gets 5 of them.'
      - say: 'So how many more parts does Y get than X? 5 minus 4 is 1. Y gets 1 part more.'
        write: '$5 - 4 = 1 \text{ part}$'
      - say: 'And we''re told Y got ₦5,000 more. So that 1 part must be worth ₦5,000.'
        write: '1 part = ₦5,000'
      - say: 'Now the whole profit. The total number of parts is 4 plus 5, which is 9.'
        write: '$4 + 5 = 9 \text{ parts}$'
      - say: 'That''s 9 parts, each worth ₦5,000. 9 times 5,000 is 45,000.'
        write: '$9 \times 5{,}000 = 45{,}000$'
      - say: 'Let''s check. X gets 4 parts, and 4 times 5,000 is 20,000. Y gets 5 parts, and 5 times 5,000 is 25,000.'
        write: 'X: ₦20,000 and Y: ₦25,000'
      - say: '25,000 minus 20,000 is 5,000, just as the question said.'
        write: '$25{,}000 - 20{,}000 = 5{,}000$'
      - say: 'So the total profit for the year is ₦45,000, which is answer choice E.'
        write: 'Total profit: ₦45,000'
        answer: true
    traps:
      A: 'You went for ₦20,000. That''s X''s share on its own, 4 parts of ₦5,000. The question wants the whole profit, which is 9 parts.'
      B: 'You went for ₦25,000. That''s Y''s share on its own, 5 parts of ₦5,000. The whole profit is 9 parts, which is ₦45,000.'
      C: 'You went for ₦30,000. That doesn''t fit the ratio. The ₦5,000 difference is 1 part, the whole profit is 9 parts, and 9 times 5,000 is 45,000.'
      D: 'You went for ₦15,000. The ₦5,000 is the value of one part, but the whole profit has 4 plus 5, which is 9 parts, not 3. 9 times 5,000 is 45,000.'
  3:
    moments:
      - say: 'We have a regular hexagon, and we want the size of each of its interior angles.'
        write: '$\text{regular hexagon: } 6 \text{ sides}$'
      - say: 'Regular means all six sides are equal and all six angles are equal.'
      - say: 'The easiest way in is from the outside. The exterior angles of any polygon always add up to 360 degrees.'
        write: '$\text{sum of exterior angles} = 360^{\circ}$'
      - say: 'Here there are six equal exterior angles, so each one is 360 divided by 6, which is 60 degrees.'
        write: '$\text{exterior angle} = \dfrac{360^{\circ}}{6} = 60^{\circ}$'
      - say: 'An interior angle and its exterior angle sit together on a straight line, so they add up to 180 degrees.'
        write: '$\text{interior} + \text{exterior} = 180^{\circ}$'
      - say: 'So each interior angle is 180 minus 60, which is 120 degrees.'
        write: '$\text{interior} = 180^{\circ} - 60^{\circ} = 120^{\circ}$'
      - say: 'Let''s check another way. The interior angles of a polygon with $n$ sides add up to $n$ minus 2, times 180 degrees.'
        write: '$\text{sum} = (n - 2) \times 180^{\circ}$'
      - say: 'For six sides, that''s 4 times 180, which is 720 degrees.'
        write: '$(6 - 2) \times 180^{\circ} = 720^{\circ}$'
      - say: 'Shared equally among six angles, 720 divided by 6 is 120. It agrees.'
        write: '$\dfrac{720^{\circ}}{6} = 120^{\circ}$'
      - say: 'So each interior angle is 120 degrees, which is answer choice C.'
        write: '$120^{\circ}$'
        answer: true
    traps:
      A: 'You went for 60 degrees. That''s the exterior angle. The interior angle sits beside it on a straight line, so it''s 180 minus 60, which is 120 degrees.'
      B: 'You went for 30 degrees. That''s far too small for a hexagon. Each exterior angle is 360 divided by 6, which is 60, and each interior angle is 180 minus 60, which is 120.'
      D: 'You went for 45 degrees. That''s the exterior angle of a regular octagon, 360 divided by 8. A hexagon has 6 sides, so its exterior angle is 60 and its interior angle is 120.'
      E: 'You went for 135 degrees. That''s the interior angle of a regular octagon, with 8 sides. A hexagon has 6 sides, so each interior angle is 180 minus 60, which is 120.'
  4:
    moments:
      - say: 'Three expressions are all equal to each other: $4x - 3$, $3x + y$ and $2y + 5x - 12$. We want $x$ and $y$.'
        write: '$4x - 3 = 3x + y = 2y + 5x - 12$'
      - say: 'A chain like this holds two equations. We''ll set the first expression equal to the second, and the second equal to the third.'
      - say: 'First pair: $4x - 3$ equals $3x + y$.'
        write: '$4x - 3 = 3x + y$'
      - say: 'Subtract $3x$ from both sides. $4x$ minus $3x$ is $x$, so $x - 3$ equals $y$.'
        write: '$x - 3 = y$'
      - say: 'Now subtract $y$ from both sides and add 3 to both sides. That gives $x - y = 3$. Let''s call it equation one.'
        write: '$x - y = 3 \quad (1)$'
      - say: 'Second pair: $3x + y$ equals $2y + 5x - 12$.'
        write: '$3x + y = 2y + 5x - 12$'
      - say: 'Bring the letters to the left by subtracting $2y$ and $5x$ from both sides. $3x$ minus $5x$ is negative $2x$, and $y$ minus $2y$ is negative $y$.'
        write: '$-2x - y = -12$'
      - say: 'Multiply both sides by negative 1 to tidy it up. That gives $2x + y = 12$. Let''s call it equation two.'
        write: '$2x + y = 12 \quad (2)$'
      - say: 'Look: equation one has minus $y$ and equation two has plus $y$. If we add the two equations, the $y$ terms cancel.'
        write: '$(x - y) + (2x + y) = 3 + 12$'
      - say: '$x$ plus $2x$ is $3x$, and 3 plus 12 is 15.'
        write: '$3x = 15$'
      - say: 'Divide both sides by 3. 15 divided by 3 is 5.'
        write: '$x = 5$'
      - say: 'Now put $x = 5$ into equation one: 5 minus $y$ equals 3. So $y$ is 5 minus 3, which is 2.'
        write: '$y = 5 - 3 = 2$'
      - say: 'Let''s check all three. $4(5) - 3$ is 17. $3(5) + 2$ is 17. And $2(2) + 5(5) - 12$ is 4 plus 25 minus 12, which is 17. All equal.'
        write: '$17 = 17 = 17$'
      - say: 'So $x = 5$ and $y = 2$, which is answer choice A.'
        write: '$x = 5,\ y = 2$'
        answer: true
    traps:
      B: 'You went for $x = 2$ and $y = 5$. Those are the right numbers, but swapped. Adding the equations gives $3x = 15$, so $x$ is 5, and then $y$ is 2.'
      C: 'You went for $x = -2$ and $y = -5$. Check it: $4(-2) - 3$ is negative 11, and $3(-2) + (-5)$ is negative 11 too, but the third expression is negative 10 minus 10 minus 12, which is negative 32. They are not all equal. The solution is $x = 5$, $y = 2$.'
      D: 'You went for $x = 5$ and $y = -2$. The $x$ is right, but the sign of $y$ slipped. From $x - y = 3$, $y$ is $x - 3$, which is 5 minus 3, positive 2.'
      E: 'You went for $x = -5$ and $y = -2$. Both signs are wrong. Adding the equations gives $3x = 15$, so $x$ is positive 5, and $y = x - 3$ is positive 2.'
  5:
    moments:
      - say: 'We''re told that $x = 1$ is a root of $x^3 - 2x^2 - 5x + 6 = 0$. We want the other two roots.'
        write: '$x^{3} - 2x^{2} - 5x + 6 = 0$'
      - say: 'If 1 is a root, then $x - 1$ is a factor. So we divide the cubic by $x - 1$, and a quadratic will be left over.'
        write: '$(x - 1) \text{ is a factor}$'
      - say: 'Let''s use synthetic division. Write down the coefficients: 1, negative 2, negative 5 and 6. We divide by the root, 1.'
        write: '$\text{coefficients: } 1,\ -2,\ -5,\ 6$'
      - say: 'Bring down the first 1. Then 1 times 1 is 1, and negative 2 plus 1 is negative 1.'
        write: '$-2 + 1 \times 1 = -1$'
      - say: 'Next, negative 1 times 1 is negative 1, and negative 5 plus negative 1 is negative 6.'
        write: '$-5 + (-1) \times 1 = -6$'
      - say: 'Then negative 6 times 1 is negative 6, and 6 plus negative 6 is zero. A remainder of zero confirms that $x - 1$ is a factor.'
        write: '$6 + (-6) \times 1 = 0$'
      - say: 'The numbers 1, negative 1 and negative 6 give the quadratic $x^2 - x - 6$.'
        write: '$x^{3} - 2x^{2} - 5x + 6 = (x - 1)(x^{2} - x - 6)$'
      - say: 'Now factorise $x^2 - x - 6$. We want two numbers that multiply to negative 6 and add to negative 1. That''s negative 3 and 2.'
        write: '$-3 \times 2 = -6, \quad -3 + 2 = -1$'
      - say: 'So it factorises as $x - 3$ times $x + 2$.'
        write: '$x^{2} - x - 6 = (x - 3)(x + 2)$'
      - say: 'Set each factor to zero. $x - 3 = 0$ gives $x = 3$, and $x + 2 = 0$ gives $x = -2$.'
        write: '$x = 3 \quad \text{or} \quad x = -2$'
      - say: 'Let''s check $x = 3$: 27 minus 18 minus 15 plus 6 is zero.'
        write: '$27 - 18 - 15 + 6 = 0$'
      - say: 'And $x = -2$: negative 8 minus 8 plus 10 plus 6 is zero too.'
        write: '$-8 - 8 + 10 + 6 = 0$'
      - say: 'So the other roots are 3 and negative 2, which is answer choice C.'
        write: '$3 \text{ and } -2$'
        answer: true
    traps:
      A: 'You went for negative 3 and 2. Those are the numbers inside the brackets, not the roots. The factor $x - 3$ is zero when $x$ is positive 3, and $x + 2$ is zero when $x$ is negative 2.'
      B: 'You went for negative 2 and 2. Negative 2 is a root, but 2 is not: 8 minus 8 minus 10 plus 6 is negative 4, not zero. The other root is 3.'
      D: 'You went for 1 and 3. The 1 is the root we were given; the question wants the other two. Dividing out $x - 1$ leaves $(x - 3)(x + 2)$, so they are 3 and negative 2.'
      E: 'You went for negative 3 and 1. The 1 was already given, and negative 3 is not a root at all. The quadratic left over is $(x - 3)(x + 2)$, giving 3 and negative 2.'
  6:
    moments:
      - say: '$x$ is jointly proportional to the cube of $y$ and the fourth power of $z$. We halve $y$, double $z$, and ask how $x$ changes.'
        write: '$x \propto y^{3}z^{4}$'
      - say: 'Jointly proportional means we can write $x = ky^3z^4$, where $k$ is a constant.'
        write: '$x = ky^{3}z^{4}$'
      - say: 'Halving $y$ turns it into one half $y$. Doubling $z$ turns it into $2z$. Let''s put those into the formula to get the new $x$.'
        write: '$x_{\text{new}} = k\left(\tfrac{1}{2}y\right)^{3}(2z)^{4}$'
      - say: 'Each factor keeps its own power. One half cubed is one half times one half times one half, which is one eighth.'
        write: '$\left(\tfrac{1}{2}\right)^{3} = \tfrac{1}{8}$'
      - say: '2 to the fourth power is 2 times 2 times 2 times 2, which is 16.'
        write: '$2^{4} = 16$'
      - say: 'So the new $x$ is $k$, times one eighth of $y^3$, times 16 $z^4$.'
        write: '$x_{\text{new}} = k \times \tfrac{1}{8}y^{3} \times 16z^{4}$'
      - say: 'One eighth times 16 is 16 divided by 8, which is 2.'
        write: '$\tfrac{1}{8} \times 16 = 2$'
      - say: 'So the new $x$ is 2 times $ky^3z^4$, and that''s 2 times the old $x$.'
        write: '$x_{\text{new}} = 2ky^{3}z^{4} = 2x$'
      - say: 'New $x$ to old $x$ is 2 to 1. Since $x$ has doubled, it''s an increase.'
        write: '$x_{\text{new}} : x = 2 : 1$'
      - say: 'So $x$ increases in the ratio 2 to 1, which is answer choice B.'
        write: '$2 : 1 \text{ increase}$'
        answer: true
    traps:
      A: 'You went for 4 to 1. That comes from giving one of the factors the wrong power, such as squaring the half instead of cubing it. Halving $y$ gives one eighth, doubling $z$ gives 16, and 16 times one eighth is 2.'
      C: 'You went for 1 to 4, a decrease. But doubling $z$ multiplies $x$ by 16, which outweighs the one eighth from halving $y$. Overall $x$ is multiplied by 2, an increase.'
      D: 'You went for no change. The two changes would only cancel if they gave matching factors. Here they give one eighth and 16, and 16 times one eighth is 2, so $x$ doubles.'
      E: 'You went for 3 to 4, a decrease. Each change multiplies $x$ by a factor: one half cubed is one eighth, 2 to the fourth is 16, and together they make 2. So $x$ increases, 2 to 1.'
  7:
    moments:
      - say: 'In the figure, triangle $PQR$ has a right angle at $P$ and 60 degrees at $Q$, with $QR = 8$ cm. Triangle $PRS$ has a right angle at $R$ and 45 degrees at $P$. We want $PS$.'
        write: '$QR = 8 \text{ cm}$'
      - say: 'The plan: first find $PR$, the side the two triangles share. Then use it in triangle $PRS$.'
      - say: 'In triangle $PQR$ the right angle is at $P$, so the side opposite it, $QR$, is the hypotenuse. It''s 8 cm.'
        write: '$\text{hypotenuse } QR = 8$'
      - say: '$PR$ is the side opposite the 60 degree angle at $Q$. Opposite over hypotenuse is sine.'
        write: '$\sin 60^{\circ} = \dfrac{PR}{QR}$'
      - say: 'Multiply both sides by 8, so $PR$ is 8 times sine 60 degrees.'
        write: '$PR = 8\sin 60^{\circ}$'
      - say: 'Sine 60 degrees is root 3 over 2.'
        write: '$PR = 8 \times \dfrac{\sqrt{3}}{2}$'
      - say: '8 divided by 2 is 4, so $PR$ is 4 root 3 cm.'
        write: '$PR = 4\sqrt{3}$'
      - say: 'Now triangle $PRS$. It has 90 degrees at $R$ and 45 at $P$, so the angle at $S$ is 180 minus 90 minus 45, which is 45 degrees too.'
        write: '$\angle PSR = 180^{\circ} - 90^{\circ} - 45^{\circ} = 45^{\circ}$'
      - say: 'Two equal angles mean two equal sides. So $RS$ equals $PR$, which is 4 root 3.'
        write: '$RS = PR = 4\sqrt{3}$'
      - say: '$PS$ is opposite the right angle at $R$, so it''s the hypotenuse. By Pythagoras, $PS^2 = PR^2 + RS^2$.'
        write: '$PS^{2} = PR^{2} + RS^{2}$'
      - say: '4 root 3 squared is 16 times 3, which is 48. So we have 48 plus 48, which is 96.'
        write: '$PS^{2} = 48 + 48 = 96$'
      - say: 'So $PS$ is the square root of 96. 96 is 16 times 6, and the square root of 16 is 4.'
        write: '$PS = \sqrt{16 \times 6} = 4\sqrt{6}$'
      - say: 'So $PS$ is 4 root 6 cm, which is answer choice B.'
        write: '$PS = 4\sqrt{6} \text{ cm}$'
        answer: true
    traps:
      A: 'You went for 2 root 3. That''s only half of $PR$, and $PS$ is longer still, since it''s a hypotenuse. $PR$ is 4 root 3, and $PS$ is $PR$ times root 2, which is 4 root 6.'
      C: 'You went for 2 root 6, exactly half the answer. $PR$ faces the 60 degree angle, so $PR$ is 8 sine 60, which is 4 root 3, and then $PS$ is 4 root 3 times root 2, which is 4 root 6.'
      D: 'You went for 8 root 6, double the answer. Sine 60 is root 3 over 2, so $PR$ is 8 times root 3 over 2, which is 4 root 3, not 8 root 3. Then $PS$ is 4 root 6.'
      E: 'You went for 8 cm. That''s $QR$, the hypotenuse of the first triangle. $PS$ is the hypotenuse of the second triangle, $PRS$, and works out to 4 root 6 cm.'
  8:
    moments:
      - say: 'We know $\cos z = L$, where $z$ is acute. We want the expression cot $z$ minus cosec $z$, over sec $z$ plus tan $z$, written in terms of $L$.'
        write: '$\dfrac{\cot z - \operatorname{cosec} z}{\sec z + \tan z}$'
      - say: 'The plan: write everything using sine and cosine, simplify, and then replace them with $L$.'
      - say: 'First we need $\sin z$. From $\sin^2 z + \cos^2 z = 1$, we get $\sin^2 z = 1 - L^2$.'
        write: '$\sin^{2}z = 1 - L^{2}$'
      - say: 'Since $z$ is acute, its sine is positive, so $\sin z$ is the positive square root.'
        write: '$\sin z = \sqrt{1 - L^{2}}$'
      - say: 'Now the top. Cot is cos over sin, and cosec is 1 over sin.'
        write: '$\cot z - \operatorname{cosec} z = \dfrac{\cos z}{\sin z} - \dfrac{1}{\sin z}$'
      - say: 'They share the same bottom, $\sin z$, so we combine them, and put $L$ in place of $\cos z$.'
        write: '$= \dfrac{L - 1}{\sin z}$'
      - say: 'Now the bottom. Sec is 1 over cos, and tan is sin over cos.'
        write: '$\sec z + \tan z = \dfrac{1}{\cos z} + \dfrac{\sin z}{\cos z}$'
      - say: 'Again they share a bottom, this time $\cos z$, which is $L$.'
        write: '$= \dfrac{1 + \sin z}{L}$'
      - say: 'Dividing by a fraction means multiplying by it turned upside down.'
        write: '$\dfrac{L - 1}{\sin z} \times \dfrac{L}{1 + \sin z}$'
      - say: 'Multiply the tops together and the bottoms together.'
        write: '$= \dfrac{L(L - 1)}{\sin z\,(1 + \sin z)}$'
      - say: 'On top, $L$ times $L - 1$ is $L^2 - L$. On the bottom, $\sin z$ times $1 + \sin z$ is $\sin z + \sin^2 z$.'
        write: '$= \dfrac{L^{2} - L}{\sin z + \sin^{2}z}$'
      - say: 'Now replace: $\sin z$ is the root of $1 - L^2$, and $\sin^2 z$ is $1 - L^2$.'
        write: '$= \dfrac{L^{2} - L}{\sqrt{1 - L^{2}} + (1 - L^{2})}$'
      - say: 'Writing the bottom the other way round, we get $L^2 - L$ over $1 - L^2$ plus the root of $1 - L^2$, which is answer choice B.'
        write: '$\dfrac{L^{2} - L}{1 - L^{2} + \sqrt{1 - L^{2}}}$'
        answer: true
    traps:
      A: 'You went for $1 - L$ over $1 + L$. That leaves out $\sin z$ altogether. The top becomes $L - 1$ over $\sin z$ and the bottom $1 + \sin z$ over $L$, and $\sin z$ is the root of $1 - L^2$, which must stay in the answer.'
      C: 'You went for the same fraction with $L - L^2$ on top. The sign is flipped. The top of the question is $\cos z - 1$ over $\sin z$, so the numerator is $L(L - 1)$, which is $L^2 - L$.'
      D: 'You went for a bottom with $1 + L^2$. But $\sin^2 z$ is $1 - L^2$, not $1 + L^2$, because $\sin^2 z + \cos^2 z = 1$.'
      E: 'You went for $L - L^2$ over $1$ plus a root. Two things slipped: the top should be $L^2 - L$, and the bottom is $\sin z + \sin^2 z$, which needs the $1 - L^2$ as well as the root.'
  9:
    moments:
      - say: 'We multiply 0.0000152 by 0.00042 and write the answer as $A$ times 10 to the $B$, with $A$ between 1 and 10.'
        write: '$0.0000152 \times 0.00042 = A \times 10^{B}$'
      - say: 'The easiest way is to put each number in standard form first.'
      - say: 'For 0.0000152, the decimal point moves 5 places to the right to give 1.52. Moving it right means a negative power, so it''s 1.52 times 10 to the negative 5.'
        write: '$0.0000152 = 1.52 \times 10^{-5}$'
      - say: 'For 0.00042, the point moves 4 places to the right to give 4.2.'
        write: '$0.00042 = 4.2 \times 10^{-4}$'
      - say: 'Now multiply: the numbers together, and the powers of 10 together.'
        write: '$(1.52 \times 4.2) \times (10^{-5} \times 10^{-4})$'
      - say: '1.52 times 4 is 6.08, and 1.52 times 0.2 is 0.304. Add them, and we get 6.384.'
        write: '$1.52 \times 4.2 = 6.08 + 0.304 = 6.384$'
      - say: 'When we multiply powers of 10, we add the indices. Negative 5 plus negative 4 is negative 9.'
        write: '$10^{-5} \times 10^{-4} = 10^{-9}$'
      - say: 'So the product is 6.384 times 10 to the negative 9. And 6.384 is between 1 and 10, as it should be.'
        write: '$6.384 \times 10^{-9}$'
      - say: 'To two decimal places, $A$ is 6.38, and $B$ is negative 9, which is answer choice B.'
        write: '$A = 6.38,\ B = -9$'
        answer: true
    traps:
      A: 'You went for $A = 9$ and $B = 6.38$. The values are swapped round. $A$ is the number part, 6.38, and $B$ is the power of 10, negative 9.'
      C: 'You went for $B = 9$. The sign of the index was lost. Multiplying two small numbers gives an even smaller one, so the power of 10 must be negative: negative 9.'
      D: 'You went for $B = -1$. The powers of 10 must be added: negative 5 plus negative 4 is negative 9.'
      E: 'You went for $B = 1$. That would make the answer bigger than 6, but the product of two tiny decimals is tiny. The powers are negative 5 and negative 4, which add to negative 9.'
  10:
    moments:
      - say: '$x + 2$ and $x - 1$ are both factors of $lx^3 + 2kx^2 + 24$. We want the values of $l$ and $k$.'
        write: '$f(x) = lx^{3} + 2kx^{2} + 24$'
      - say: 'The factor theorem says: if $x - a$ is a factor, then putting $x = a$ into the expression gives zero.'
      - say: 'For the factor $x - 1$, setting it to zero gives $x = 1$. So we put 1 in place of $x$.'
        write: '$l(1)^{3} + 2k(1)^{2} + 24 = 0$'
      - say: '1 cubed and 1 squared are both 1. That''s equation one.'
        write: '$l + 2k + 24 = 0 \quad (1)$'
      - say: 'For the factor $x + 2$, setting it to zero gives $x = -2$, not positive 2. So we put negative 2 in place of $x$.'
        write: '$l(-2)^{3} + 2k(-2)^{2} + 24 = 0$'
      - say: 'Negative 2 cubed is negative 8, and negative 2 squared is 4. $2k$ times 4 is $8k$.'
        write: '$-8l + 8k + 24 = 0$'
      - say: 'Every term divides by 8. That gives negative $l$ plus $k$ plus 3 equals zero, so $l$ equals $k + 3$. That''s equation two.'
        write: '$l = k + 3 \quad (2)$'
      - say: 'Now substitute $k + 3$ for $l$ in equation one.'
        write: '$(k + 3) + 2k + 24 = 0$'
      - say: '$k$ plus $2k$ is $3k$, and 3 plus 24 is 27.'
        write: '$3k + 27 = 0$'
      - say: 'Subtract 27 from both sides to get $3k = -27$, then divide by 3. $k$ is negative 9.'
        write: '$3k = -27 \Rightarrow k = -9$'
      - say: 'Then $l$ is $k$ plus 3, which is negative 9 plus 3, negative 6.'
        write: '$l = -9 + 3 = -6$'
      - say: 'Check at $x = 1$: negative 6, plus 2 times negative 9, plus 24. That''s negative 6 minus 18 plus 24, which is zero.'
        write: '$-6 - 18 + 24 = 0$'
