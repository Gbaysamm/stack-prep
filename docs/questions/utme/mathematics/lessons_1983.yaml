          - {figure: sketch, kind: label, target: CB, text: '35'}
          - {figure: sketch, kind: label, target: AC, text: '12'}
      - say: '35 squared is 1225, 12 squared is 144, and together they make 1369, which is 37 squared.'
        write: '$35^{2} + 12^{2} = 1225 + 144 = 1369 = 37^{2}$'
      - say: 'So $x$ is 12, which is answer choice D.'
        write: '$x = 12$'
        answer: true
    traps:
