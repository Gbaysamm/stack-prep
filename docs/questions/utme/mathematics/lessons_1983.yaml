        write: 'Distance $=$ speed $\times$ time'
      - say: 'In the first part, he went at $v$ for 4 hours, so he covered $4v$ km.'
        write: 'First part: $4 \times v = 4v$ km'
      - say: 'In the second part, he went at $2v$ for 3 hours. 3 times $2v$ is $6v$ km.'
        write: 'Second part: $3 \times 2v = 6v$ km'
