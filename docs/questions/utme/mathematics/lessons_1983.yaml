        point:
          - {line: 11, kind: move, from: {line: 9, at: '3110'}, at: '3110', text: 'a'}
          - {line: 11, kind: move, from: {line: 10, at: '=3152'}, at: '3152', text: 'b'}
      - say: 'So $y$ is $10x^2$ over 31, plus 52 over 31 root $x$, which is answer choice A.'
        write: '$y = \dfrac{10x^{2}}{31} + \dfrac{52}{31\sqrt{x}}$'
        answer: true
