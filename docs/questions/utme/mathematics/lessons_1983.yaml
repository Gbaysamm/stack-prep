        write: 'Numbers: $59.81789$ and $0.0746829$'
      - say: 'The order matters: round each number first, then multiply, then round the product.'
        write: 'Order: round, multiply, round again'
      - say: 'In 59.81789, the first three significant figures are 5, 9 and 8. The next digit is 1, which is less than 5, so we round down.'
        write: '$59.81789 \approx 59.8$ (next digit 1, round down)'
      - say: 'In 0.0746829, the zeros at the front don''t count. The first three significant figures are 7, 4 and 6. The next digit is 8, so the 6 goes up to 7.'
