  49:
    moments:
      - say: '$PT$ is a tangent to the circle at $P$, and $O$ is the centre. Angle $PQT$ is 30 degrees, and the marked angles are $OPQ = x$, $QTO = x$ and $OTP = 2x$. We want angle $PTO$.'
        write: '$\angle PQT = 30^{\circ}, \ \angle OPQ = x, \ \angle QTO = x, \ \angle OTP = 2x$'
        point:
          - {figure: 0, kind: highlight, target: PT, text: 'tangent'}
          - {figure: 0, kind: circle, target: O, text: 'centre'}
          - {figure: 0, kind: arc, target: PQT, text: '30°'}
      - say: 'Here''s the key fact: a tangent is perpendicular to the radius at the point where it touches. So angle $OPT$ is 90 degrees.'
        write: 'Tangent meets radius at right angles: $\angle OPT = 90^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: OPT, text: '90°'}
      - say: 'Now look at the big triangle $PQT$. Its angle at $Q$ is 30 degrees.'
        write: 'In $\triangle PQT$: $\angle Q = 30^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: PQT, text: '30°'}
      - say: 'Its angle at $P$ is made of two parts: $x$ between $PQ$ and $PO$, and the 90 we just found between $PO$ and $PT$.'
        write: '$\angle QPT = \angle QPO + \angle OPT = x + 90^{\circ}$'
        point:
          - {line: 3, kind: move, from: {line: 1, at: '90∘'}, at: '+90∘', text: 'tangent'}
          - {figure: 0, kind: arc, target: QPT, text: 'x + 90°'}
      - say: 'Its angle at $T$ is also made of two parts: $x$ and $2x$, which make $3x$.'
        write: '$\angle QTP = \angle QTO + \angle OTP = x + 2x = 3x$'
        point:
          - {figure: 0, kind: arc, target: QTP, text: '3x'}
      - say: 'The rule: the three angles of any triangle add up to 180 degrees.'
        write: 'Angle sum of a triangle: $A + B + C = 180^{\circ}$'
      - say: 'The three angles of the triangle add up to 180 degrees. Put in the three angles we just wrote.'
        write: '$30 + (x + 90) + 3x = 180$'
        point:
          - {line: 6, kind: move, from: {line: 2, at: '30∘'}, at: '30+'}
          - {line: 6, kind: move, from: {line: 3, at: '=x+90∘'}, at: '(x+90)'}
          - {line: 6, kind: move, from: {line: 4, at: '=3x'}, at: '3x'}
      - say: 'Collect like terms: $x$ plus $3x$ is $4x$, and 30 plus 90 is 120.'
        write: '$4x + 120 = 180$'
      - say: 'Subtract 120 from both sides. 180 minus 120 is 60.'
        write: '$4x = 180 - 120 = 60$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '+120'}, at: '−120', text: 'across'}
      - say: 'Divide by 4. 60 divided by 4 is 15.'
        write: '$x = \dfrac{60}{4} = 15^{\circ}$'
      - say: 'But the question wants angle $PTO$, which is marked $2x$. 2 times 15 is 30.'
        write: '$\angle PTO = 2x = 2 \times 15^{\circ} = 30^{\circ}$'
        point:
          - {line: 0, kind: underline, at: 'OTP=2x', text: 'asked for'}
          - {line: 10, kind: move, from: {line: 9, at: '15∘'}, at: '15∘'}
          - {figure: 0, kind: arc, target: PTO, text: '30°'}
      - say: 'So angle $PTO$ is 30 degrees, which is answer choice A.'
        write: 'So $\angle PTO = 30^{\circ}$'
        answer: true
        point:
          - {figure: 0, kind: arc, target: PTO, text: '30°'}
