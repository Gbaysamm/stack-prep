          - {line: 8, kind: move, from: {line: 7, at: '=60'}, at: '2×[[60]]', text: 'v'}
      - say: 'Let''s check: 4 times 60 is 240, and 3 times 120 is 360. 240 plus 360 is 600. Correct.'
        write: 'Check: $4 \times 60 + 3 \times 120 = 240 + 360 = 600$'
      - say: 'So in the last 3 hours he drove at 120 km per hour, which is answer choice A.'
        write: 'Speed for the last 3 hours $= 120$ km/h'
        answer: true
    traps:
      B: 'You went for 60 km per hour. That''s his first speed, $v$. For the last 3 hours he doubled it, so his speed was 120 km per hour.'
