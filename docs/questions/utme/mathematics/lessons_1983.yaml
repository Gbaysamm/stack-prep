          - {figure: sketch, kind: arc, target: ABC, text: 'x'}
      - say: 'The interior angles of a polygon with $n$ sides add up to $n$ minus 2, times 180 degrees. That''s because it can be cut into $n$ minus 2 triangles from one corner.'
        write: 'Sum of interior angles $= (n - 2) \times 180^{\circ}$'
      - say: 'A hexagon has 6 sides, so put in $n = 6$. 6 minus 2 is 4.'
        write: '$= (6 - 2) \times 180^{\circ} = 4 \times 180^{\circ}$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
      - say: '4 times 180 is 720 degrees.'
        write: '$= 720^{\circ}$'
      - say: 'The angles are 170 and five lots of $x$, and together they make the 720 we just found.'
