          - {figure: 0, kind: arc, target: GKF, text: '30°'}
          - {figure: 0, kind: arc, target: HKG, text: '30°'}
      - say: 'So the diagonal $KG$ splits the angle at $K$ into two equal parts. The part on the other side, angle $HKG$, is also 30 degrees.'
        write: '$\angle HKG = \angle GKF = 30^{\circ}$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
          - {figure: 0, kind: arc, target: HKG, text: '30°'}
      - say: 'So the whole angle at $K$ is 30 plus 30, which is 60 degrees.'
        write: '$\angle HKF = 30^{\circ} + 30^{\circ} = 60^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: HKF, text: '60°'}
      - say: 'The rule: co-interior angles between parallel lines add up to 180 degrees.'
        write: 'Co-interior angles add up to $180^{\circ}$'
      - say: 'Now, $HG$ is parallel to $KF$. The angles at $K$ and $H$ sit between those parallel sides, on the same side of $KH$, so they add up to 180 degrees.'
        write: 'Co-interior angles: $\angle K + \angle H = 180^{\circ}$'
        point:
          - {figure: 0, kind: highlight, target: HG, text: 'parallel'}
          - {figure: 0, kind: highlight, target: KF, text: 'parallel'}
          - {figure: 0, kind: arc, target: KHG}
      - say: 'Put in the 60 degrees we found at $K$, and $x$ for the angle at $H$.'
        write: '$60^{\circ} + x = 180^{\circ}$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '=60∘'}, at: '60∘', text: 'from here'}
          - {figure: 0, kind: arc, target: HKF, text: '60°'}
          - {figure: 0, kind: circle, target: x, text: 'x'}
      - say: 'Subtract 60 from both sides. 180 minus 60 is 120.'
        write: '$x = 180^{\circ} - 60^{\circ} = 120^{\circ}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '60∘+'}, at: '−60∘', text: 'across'}
          - {figure: 0, kind: arc, target: KHG, text: 'x = 120°'}
      - say: 'Let''s check with triangle $KHG$. $HK$ equals $HG$, since the sides of a rhombus are equal, so its base angles at $K$ and $G$ are equal, both 30 degrees.'
        write: 'In $\triangle KHG$: $\angle HKG = \angle HGK = 30^{\circ}$'
        point:
          - {figure: 0, kind: highlight, target: HK, text: 'equal'}
          - {figure: 0, kind: highlight, target: HG, text: 'equal'}
          - {figure: 0, kind: arc, target: HGK, text: '30°'}
      - say: 'Then $x$ is 180 minus 30 minus 30, which is 120 again.'
        write: '$x = 180^{\circ} - 30^{\circ} - 30^{\circ} = 120^{\circ}$'
      - say: 'So $x$ is 120 degrees, which is answer choice D.'
        write: '$x = 120^{\circ}$'
        answer: true
    traps:
      A: 'You went for 90 degrees. That would make the rhombus a square, but a square''s diagonal makes 45 degrees with a side, not 30. Here the angle at $K$ is 60, so the angle at $H$ is 120.'
      B: 'You went for 30 degrees. That''s the angle between the diagonal and a side at $K$. The angle at $H$ is the full corner angle, and it works out to 120.'
      C: 'You went for 150 degrees, which is 180 minus 30. But 30 is only half the angle at $K$; the whole angle there is 60. So the angle at $H$ is 180 minus 60, which is 120.'
      E: 'You went for 60 degrees. That''s the angle at $K$. $H$ is next to $K$, not opposite it, so the two angles add up to 180. The angle at $H$ is 120.'
  20:
    moments:
      - say: 'A desk $PQRS$ is 2 metres by 0.8 metres. It''s tilted at 30 degrees to the horizontal along its 2 metre edge $PQ$. We want the angle the diagonal $PR$ makes with the horizontal.'
        write: 'Desk: $PQ = 2$ m, $QR = 0.8$ m, tilted at $30^{\circ}$'
        point:
          - {figure: 0, kind: highlight, target: PQ, text: '2 m edge'}
          - {figure: 0, kind: circle, target: '30°', text: 'tilt'}
          - {figure: 0, kind: highlight, target: PR, text: 'diagonal'}
      - say: 'Picture it. The edge $PQ$ stays on the horizontal floor, and the short edge $QR$ rises from it at 30 degrees. So the corner $R$ is lifted off the floor.'
        write: '$QR$ rises at $30^{\circ}$ to the horizontal'
      - say: 'SOH: the sine of an angle is the opposite side over the hypotenuse.'
        write: 'SOH: $\sin\theta = \dfrac{\text{opposite}}{\text{hypotenuse}}$'
      - say: 'First, how high is $R$? $QR$ is 0.8 metres, sloping at 30 degrees, and the height is the side opposite that angle. So it''s 0.8 times sine 30.'
        write: 'Height of $R$: $h = QR\sin 30^{\circ} = 0.8\sin 30^{\circ}$'
        point:
          - {figure: 0, kind: highlight, target: QR, text: '0.8 m'}
          - {figure: 0, kind: circle, target: '30°'}
      - say: 'Sine 30 degrees is a half, and half of 0.8 is 0.4. So $R$ is 0.4 metres high.'
        write: '$h = 0.8 \times 0.5 = 0.4$ m'
        point:
          - {figure: 0, kind: label, target: R, text: '0.4 m up'}
      - say: 'Pythagoras: the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hypotenuse}^{2} = \text{opposite}^{2} + \text{adjacent}^{2}$'
      - say: 'Next, the length of the diagonal $PR$. On the desk, $PQ$ and $QR$ meet at a right angle, so we use Pythagoras.'
        write: '$PR^{2} = PQ^{2} + QR^{2} = 2^{2} + 0.8^{2}$'
        point:
          - {figure: 0, kind: highlight, target: PQ, text: '2 m'}
      - say: '2 squared is 4, and 0.8 squared is 0.64. Together that''s 4.64.'
        write: '$= 4 + 0.64 = 4.64$'
      - say: 'The square root of 4.64 is about 2.154 metres.'
        write: '$PR = \sqrt{4.64} \approx 2.154$ m'
      - say: 'Now, $PR$ starts at $P$ on the floor and climbs to $R$, which we found is 0.4 metres up. So the sine of its angle, theta, is that height over the length of $PR$.'
        write: '$\sin\theta = \dfrac{h}{PR} = \dfrac{0.4}{2.154}$'
        point:
          - {line: 9, kind: move, from: {line: 4, at: '0.4m'}, at: '0.4', text: 'height'}
          - {line: 9, kind: move, from: {line: 8, at: '2.154'}, at: '2.154', text: 'PR'}
          - {figure: 0, kind: highlight, target: PR}
      - say: '0.4 divided by 2.154 is about 0.1857.'
        write: '$\sin\theta \approx 0.1857$'
      - say: 'From the tables, the angle whose sine is 0.1857 is about 10.70 degrees.'
        write: '$\theta \approx 10.70^{\circ}$'
      - say: 'The 0.70 of a degree goes into minutes. There are 60 minutes in a degree, and 0.70 times 60 is 42.'
        write: 'Minutes: $0.70 \times 60 = 42$'
      - say: 'So the diagonal is inclined at 10 degrees 42 minutes, which is answer choice E.'
        write: '$\theta = 10^{\circ}42''$'
        answer: true
        point:
          - {figure: 0, kind: label, target: PR, text: '10°42′ to horizontal'}
    traps:
      A: 'You went for 23 degrees 35 minutes. That''s the angle whose sine is 0.4, as if the diagonal were 1 metre long. The sine is the height over the length of $PR$: 0.4 over 2.154.'
      B: 'You went for 30 degrees. That''s the slope of the short edge $QR$. The diagonal $PR$ is longer but rises to the same height of 0.4 metres, so it is less steep.'
      C: 'You went for 15 degrees 36 minutes. The height of $R$ is 0.4 metres and $PR$ is 2.154 metres long, so the sine of the angle is 0.1857, which gives 10 degrees 42 minutes.'
      D: 'You went for 10 degrees. That''s close but not accurate enough: the angle is 10.70 degrees, and 0.70 of a degree is 42 minutes. So it''s 10 degrees 42 minutes.'
  21:
    moments:
      - section: 'The question'
        say: 'A number x, written in base four, is squared, and the result is one-zero-zero-one-zero-zero base two. The bases are different, so we go through base ten.'
        write: '$(x_{\text{base }4})^{2} = 100100_{2}$'
      - say: 'First, change one-zero-zero-one-zero-zero base two to base ten.'
        write: 'Solution'
      - section: 'Step 1: base 2 to base 10'
        say: 'Write the index numbers over the digits, starting from nought on the right and counting up to five on the left.'
        write: '$\overset{5}{1}\,\overset{4}{0}\,\overset{3}{0}\,\overset{2}{1}\,\overset{1}{0}\,\overset{0}{0}_{2}$'
      - say: 'Each digit times two to the power of its index: 1 times 2 to the power 5, plus 0 times 2 to the power 4, plus 0 times 2 cubed.'
        write: '$= 1 \times 2^{5} + 0 \times 2^{4} + 0 \times 2^{3}$'
      - say: 'Then plus 1 times 2 squared, plus 0 times 2 to the power 1, plus 0 times 2 to the power nought.'
        write: '$\quad + 1 \times 2^{2} + 0 \times 2^{1} + 0 \times 2^{0}$'
      - say: '2 to the power 5 is 32, and 2 squared is 4. Every 0 digit gives 0.'
        write: '$= 32 + 0 + 0 + 4 + 0 + 0$'
      - say: '32 plus 4 is 36, base ten.'
        write: '$= 36_{10}$'
      - section: 'Step 2: find x in base ten'
        say: 'So x squared is 36.'
        write: '$x^{2} = 36$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '3610'}, at: '36'}
      - say: 'Take the square root of both sides. 36 dots make a square with 6 on each side, so x is 6, base ten. A count like this is positive.'
        write: '$x = \sqrt{36} = 6_{10}$'
        doodle: {name: 'custom:1983_q21_a', id: dots, caption: '36 dots in a square'}
        doodle_do:
          - {id: dots, op: label, part: side, text: '6', 'on': '6 on each side'}
      - section: 'Step 3: base 10 to base 4'
        say: 'But x is wanted in base four. Divide 6 by 4 again and again on the ladder, writing each remainder by the side.'
        diagram: {id: L, kind: ladder, divisor: 4, number: 6, 'on': 'ladder'}
      - say: '6 divided by 4 is 1, remainder 2.'
        diagram_do:
          - {id: L, op: step}
      - say: '1 divided by 4 is 0, remainder 1. We stop at 0.'
        diagram_do:
          - {id: L, op: step}
      - say: 'Read the remainders from the bottom up: one, two. So 6 is one-two base four.'
        diagram_do:
          - {id: L, op: read, 'on': 'bottom up'}
        write: '$6_{10} = 12_{4}$'
        point:
          - {line: 12, kind: highlight, at: '124', to: {diagram: L, part: result}}
      - section: 'Check'
        say: 'Check by expanding back. Index numbers over one-two: one, nought. 1 times 4 to the power 1, plus 2 times 4 to the power nought.'
        write: '$\overset{1}{1}\,\overset{0}{2}_{4} = 1 \times 4^{1} + 2 \times 4^{0} = 4 + 2 = 6$'
      - say: 'And 6 squared is 36, which is one-zero-zero-one-zero-zero base two. It agrees.'
        write: '$6^{2} = 36\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore x is one-two base four, which is option B.'
        write: '$\therefore x = 12_{4}$'
        answer: true
    traps:
      A: 'You went for 6. That is the right value, but in base ten. The question gives x in base four, and on the ladder 6 becomes one-two base four.'
      C: 'You went for one-zero-zero. In base four that is 1 times 4 squared, which is 16, and 16 squared is 256, not 36.'
      D: 'You went for two-one-zero. In base four that is 2 times 16 plus 1 times 4, which is 36. That is x squared, not x. Take the square root first.'
      E: 'You went for one-one-zero. That is 6 written in base two, not base four. Divide by 4 on the ladder: one-two base four.'
  22:
    moments:
      - say: 'We want to simplify the log of $a$ to the power 1 over 3, plus a quarter of log $a$, minus 1 over 12 of the log of $a$ to the 7. All the logs are base 10.'
        write: '$\log_{10}a^{1/3} + \tfrac{1}{4}\log_{10}a - \tfrac{1}{12}\log_{10}a^{7}$'
      - say: 'The key tool is the power law: the log of $a$ to a power is the power times the log of $a$. It turns every term into a number times the same log.'
        write: 'Power law: $\log a^{n} = n\log a$'
      - say: 'In the first term, bring the power, 1 over 3, down in front.'
        write: 'First term: $\log_{10}a^{1/3} = \tfrac{1}{3}\log_{10}a$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
          - {line: 2, kind: move, from: {line: 2, at: '1/3'}, at: '=[[31]]log', text: 'down in front'}
      - say: 'The second term is already a quarter of log $a$, so it stays as it is.'
        write: 'Second term: $\tfrac{1}{4}\log_{10}a$'
      - say: 'In the third term, bring the 7 down. 1 over 12, times 7, is 7 over 12.'
        write: 'Third term: $\tfrac{1}{12}\log_{10}a^{7} = \tfrac{7}{12}\log_{10}a$'
        point:
          - {line: 4, kind: move, from: {line: 4, at: 'a[[7]]='}, at: '=[[127]]log', text: 'down in front'}
      - say: 'Now put the three terms back together, keeping the minus sign on the last one. Picture the pluses on one pan and the minus on the other.'
        doodle: {name: 'custom:1983_q22_a', id: scale, caption: 'plus on the left, minus on the right'}
        write: 'Expression $= \tfrac{1}{3}\log_{10}a + \tfrac{1}{4}\log_{10}a - \tfrac{7}{12}\log_{10}a$'
      - say: 'Every term has log $a$ in it, so take log $a$ out as a common factor.'
        write: '$= \left(\tfrac{1}{3} + \tfrac{1}{4} - \tfrac{7}{12}\right)\log_{10}a$'
      - say: 'Put the fractions over 12. 1 over 3 is 4 over 12, and 1 over 4 is 3 over 12.'
        doodle_do: [{id: scale, op: label, part: left, text: '4/12 + 3/12'}]
        write: '$= \left(\tfrac{4}{12} + \tfrac{3}{12} - \tfrac{7}{12}\right)\log_{10}a$'
      - say: 'On top, 4 plus 3 is 7, and 7 minus 7 is zero. The two pans balance exactly.'
        doodle_do: [{id: scale, op: highlight, part: beam}]
        write: '$= \tfrac{4 + 3 - 7}{12}\log_{10}a = \tfrac{0}{12}\log_{10}a$'
      - say: 'Zero times anything is zero, whatever $a$ is. So the whole expression is 0, which is answer choice C.'
        doodle_do: [{id: scale, op: label, part: beam, text: 'balanced: 0'}]
        write: '$= 0$'
        answer: true
    traps:
      A: 'You went for 1. The numbers in front of log $a$ are 4 over 12, 3 over 12 and minus 7 over 12, and they add to zero, not 1. So the expression is 0.'
      B: 'You went for 7 over 6 log $a$. That comes from adding the last term instead of subtracting it: 4 plus 3 plus 7 is 14, and 14 over 12 is 7 over 6. With the minus sign it''s 4 plus 3 minus 7, which is zero.'
      D: 'You went for 10. The 10 is only the base of the logarithms. Using the power law, the numbers in front of log $a$ are 4 over 12, 3 over 12 and minus 7 over 12, which add to zero.'
      E: 'You went for $a$. The logs don''t combine to give $a$ itself. Written as multiples of log $a$, the coefficients cancel exactly, so the answer is 0.'
  23:
    moments:
      - section: 'The question'
        say: '$w$ varies inversely as $V$, and $u$ varies directly as $w$ cubed. We want one equation linking $u$ straight to $V$. Picture a chain from $V$ through $w$ to $u$.'
        doodle: {name: 'custom:1983_q23_a', id: chain, caption: 'V to w to u'}
        write: 'Given: $u = 1$ when $V = 2$'
      - say: 'Solution. Write each statement with the sign of proportionality, then bring in a constant for each.'
        write: 'Solution'
      - section: 'The two variations'
        say: '$w$ varies inversely as $V$: $w$ is proportional to 1 over $V$.'
        doodle_do: [{id: chain, op: highlight, part: flip}]
        write: '$w \propto \dfrac{1}{V}$'
      - say: 'Replace the sign with a constant, $k$ one. Number it equation one.'
        write: '$\therefore\ w = \dfrac{k_{1}}{V} \quad \ldots (1)$'
      - say: '$u$ varies directly as $w$ cubed: $u$ is proportional to $w$ cubed.'
        doodle_do: [{id: chain, op: highlight, part: cubed}]
        write: '$u \propto w^{3}$'
      - say: 'With a second constant, $k$ two, that is equation two.'
        write: '$\therefore\ u = k_{2}w^{3} \quad \ldots (2)$'
      - section: 'Remove w'
        say: 'To link $u$ with $V$, remove $w$. Substitute equation one into equation two. On the chain, we jump straight from $V$ to $u$.'
        doodle_do: [{id: chain, op: arrow, part: vb, to_part: ub}]
        write: 'Sub. (1) in (2): $\ u = k_{2}\left(\dfrac{k_{1}}{V}\right)^{3}$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: 'Vk1'}, at: '(Vk1)', text: 'w from (1)'}
      - say: 'Cubing a fraction cubes the top and the bottom.'
        write: '$u = \dfrac{k_{2}k_{1}^{3}}{V^{3}}$'
      - say: '$k$ two times $k$ one cubed is just one constant. Let it be $k$.'
        write: 'Let $k = k_{2}k_{1}^{3}$: $\ u = \dfrac{k}{V^{3}}$'
      - section: 'Find k'
        say: 'Now find $k$ from the given values: $u$ is 1 when $V$ is 2.'
        write: 'When $V = 2,\ u = 1$: $\ 1 = \dfrac{k}{2^{3}}$'
        point:
          - {line: 9, kind: move, from: {line: 0, at: 'V = [[2]]'}, at: '[[2]]3k', text: 'V'}
      - say: '2 cubed is 8. Multiply both sides by 8, and $k$ is 8.'
        write: '$1 = \dfrac{k}{8}$ $\ \therefore\ k = 8$'
      - say: 'So the relationship between $u$ and $V$ is $u$ equals 8 over $V$ cubed. That is the end of the chain.'
        doodle_do: [{id: chain, op: label, part: ub, text: '8 ÷ V³'}]
        write: '$\therefore\ u = \dfrac{8}{V^{3}}$'
      - section: 'Check'
        say: 'Check: when $V$ is 2, 8 over 2 cubed is 8 over 8, which is 1. That is the given value.'
        write: 'Check $V = 2$: $\ u = \dfrac{8}{2^{3}} = \dfrac{8}{8} = 1\ \checkmark$'
      - say: 'So $u$ equals 8 over $V$ cubed: option E.'
        write: '$u = \dfrac{8}{V^{3}}$'
        answer: true
    traps:
      A: 'You went for $u = 8V^3$. That forgets the first link is inverse. As $V$ grows, $w$ shrinks, so $u$ shrinks too. Also, at $V = 2$ it gives 64, not 1.'
      B: 'You went for $u = 2\sqrt{V}$. At $V = 2$ that gives 2 root 2, not 1. Substituting $w = k_1$ over $V$ into $u = k_2w^3$ gives $u$ equals a constant over $V$ cubed.'
      C: 'You went for $V = 8$ over $u^2$. Test it: when $u = 1$ it gives $V = 8$, not 2. The chain gives $u$ equals a constant over $V$ cubed, and the constant is 8.'
      D: 'You went for $V = 8u^2$. When $u = 1$ it gives $V = 8$, not 2. The correct link has $V$ cubed, from $w$ being cubed: $u$ equals 8 over $V$ cubed.'
  24:
    moments:
      - section: 'The question'
        say: 'One curve and one straight line. We want the values of $x$ where they meet. Watch out: the options mix $x$ values with $y$ values.'
        write: '$x^{2} + y - 8 = 0$ and $y + 5x - 2 = 0$'
        doodle: {name: 'custom:1983_q24_a', id: graph, caption: 'a curve and a line meet twice'}
      - section: 'Solution'
        say: 'One equation is linear, one is quadratic. We use substitution: make $y$ the subject of the linear one, and put it into the quadratic.'
        write: 'Solution'
      - say: 'Number the equations. The quadratic is equation one.'
        write: '$x^{2} + y - 8 = 0 \quad \text{......(1)}$'
      - say: 'The straight line is equation two.'
        write: '$y + 5x - 2 = 0 \quad \text{......(2)}$'
      - say: 'From equation two, subtract $5x$ from both sides and add 2. Call it equation three.'
        write: 'From (2): $y = 2 - 5x \quad \text{......(3)}$'
        doodle_do:
          - {id: graph, op: highlight, part: line}
      - say: 'Substitute equation three in equation one: put $2 - 5x$ in place of $y$, in brackets.'
        write: 'Substitute (3) in (1):'
      - say: '$x$ squared, plus bracket 2 minus $5x$, minus 8, equals zero.'
        write: '$x^{2} + (2 - 5x) - 8 = 0$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '2−5x'}, at: '(2−5x)', text: 'in for y'}
      - say: 'Open the bracket and collect like terms: 2 minus 8 is negative 6.'
        write: '$x^{2} - 5x - 6 = 0$'
      - section: 'Factorise'
        say: 'Here $a$ is 1, $b$ is negative 5 and $c$ is negative 6. The product is $ac$, negative 6. The sum is $b$, negative 5.'
        write: 'Product $= ac = -6$, Sum $= b = -5$'
      - say: 'Negative 6 and plus 1: negative 6 times 1 is negative 6, and negative 6 plus 1 is negative 5.'
        write: 'Factors: $-6$ and $+1$'
      - say: 'Replace the middle term, negative $5x$, with negative $6x$ plus $x$.'
        write: '$x^{2} - 6x + x - 6 = 0$'
      - say: 'Group in pairs. From the first pair take out $x$; from the second take out 1. Both brackets are $x$ minus 6.'
        write: '$x(x - 6) + 1(x - 6) = 0$'
      - say: 'Take out the common bracket, $x$ minus 6. What is left is $x$ plus 1.'
        write: '$(x - 6)(x + 1) = 0$'
      - say: 'Either the first bracket is zero or the second one is.'
        write: 'Either $x - 6 = 0$ or $x + 1 = 0$'
      - say: 'Therefore $x$ equals 6 or $x$ equals negative 1. Those are the two meeting points.'
        write: '$\therefore x = 6$ or $x = -1$'
        doodle_do:
          - {id: graph, op: label, part: p1, text: 'x = −1'}
          - {id: graph, op: label, part: p2, text: 'x = 6'}
      - section: 'Check'
        say: 'When $x$ is 6, equation three gives $y$ equals 2 minus 30, negative 28. In equation one: 36 minus 28 minus 8 is zero.'
        write: '$x = 6$: $y = -28$; $36 - 28 - 8 = 0\ \checkmark$'
      - say: 'When $x$ is negative 1, $y$ is 2 plus 5, which is 7. In equation one: 1 plus 7 minus 8 is zero.'
        write: '$x = -1$: $y = 7$; $1 + 7 - 8 = 0\ \checkmark$'
      - say: 'The question asks for $x$ only. So $x$ is 6 or negative 1: option C.'
        write: '$\therefore x = 6, -1$ (C)'
        answer: true
    traps:
      A: 'You went for negative 28 and 7. Those are the $y$ values that go with each solution. The question asks for $x$, which is 6 or negative 1.'
      B: 'You went for 6 and negative 28. That is the $x$ and $y$ of one meeting point. The question wants both values of $x$: 6 and negative 1.'
      D: 'You went for negative 1 and 7. That is the $x$ and $y$ of one meeting point. The two values of $x$ are 6 and negative 1.'
      E: 'You went for 3 and 2. Put $x$ equals 3 in equation three and $y$ is negative 13, but then 9 minus 13 minus 8 is not zero. Solving $x^2 - 5x - 6 = 0$ gives 6 and negative 1.'
  25:
    moments:
      - say: 'The table gives values of $y = x^3 - x + 3$. The value at $x = -2$ is missing, and we want it.'
        write: '$y = x^{3} - x + 3$'
      - say: 'First let''s make sure the rule fits the table. At $x = 2$: 2 cubed is 8, and 8 minus 2 plus 3 is 9. That matches.'
        write: 'At $x = 2$: $2^{3} - 2 + 3 = 8 - 2 + 3 = 9$'
      - say: 'At $x = 3$: 3 cubed is 27, and 27 minus 3 plus 3 is 27. That matches too.'
        write: 'At $x = 3$: $3^{3} - 3 + 3 = 27 - 3 + 3 = 27$'
      - say: 'At $x = -1$: negative 1 cubed is negative 1, and minus negative 1 is plus 1. So negative 1 plus 1 plus 3 is 3. It matches.'
        write: 'At $x = -1$: $(-1)^{3} - (-1) + 3 = -1 + 1 + 3 = 3$'
      - say: 'Picture the rule as a machine. Now the missing one. Put negative 2 in place of $x$, and keep it in brackets so the signs stay safe.'
        doodle: {name: 'custom:1983_q25_a', id: machine, caption: 'the rule is a machine'}
        write: 'At $x = -2$: $y = (-2)^{3} - (-2) + 3$'
      - say: 'Negative 2 cubed: negative 2 times negative 2 is 4, and 4 times negative 2 is negative 8. That happens inside the machine.'
        doodle_do: [{id: machine, op: label, part: machine, text: '(−2)³ = −8'}]
        write: '$(-2)^{3} = (-2)(-2)(-2) = -8$'
      - say: 'And minus negative 2 is plus 2.'
        write: '$-(-2) = +2$'
