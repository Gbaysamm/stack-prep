      - say: 'From that angle, the 60 km side is opposite and the 30 km side is adjacent. So tan theta is 60 over 30.'
        write: '$\tan\theta = \dfrac{\text{opposite}}{\text{adjacent}} = \dfrac{60}{30}$'
        point:
          - {figure: sketch_b, kind: underline, target: '60 km', text: 'opposite'}
          - {figure: sketch_b, kind: underline, target: '30 km', text: 'adjacent'}
      - say: '60 divided by 30 is 2.'
        write: '$= 2$'
      - say: 'From the tables, the angle whose tangent is 2 is about 63.435 degrees.'
        write: '$\theta \approx 63.435^{\circ}$'
        point:
          - {figure: sketch_b, kind: circle, target: θ, text: '63.435°'}
      - say: 'Change the decimal part to minutes: 0.435 times 60 is about 26. So theta is 63 degrees 26 minutes.'
        write: '$0.435 \times 60 \approx 26$, so $\theta = 63^{\circ}26''$'
      - say: 'Now turn from north. 180 degrees turns us to face due south, and then we turn a further 63 degrees 26 minutes towards the west.'
        write: 'Bearing $= 180^{\circ} + 63^{\circ}26''$'
        point:
