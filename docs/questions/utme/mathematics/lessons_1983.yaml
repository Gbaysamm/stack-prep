      B: 'You went for 4.48. That comes from rounding 0.0746829 to 0.0748. Only the digit after the third figure matters: after 7, 4, 6 comes 8, so the 6 becomes 7, giving 0.0747.'
      D: 'You went for 4.49. Rounding gives 59.8 and 0.0747, and 59.8 times 0.0747 is 4.46706, which is 4.47 to three significant figures.'
      E: 'You went for 4.50. That''s rounding too far. 59.8 times 0.0747 is 4.46706, and to three significant figures that''s 4.47.'
  31:
    moments:
      - say: 'A rod that is really 250 cm long is measured as 255 cm by mistake. We want the percentage error.'
        doodle: {name: 'custom:1983_q31_a', caption: 'Really 250 cm, measured as 255 cm'}
        write: 'True length $= 250$ cm, measured $= 255$ cm'
      - say: 'Percentage error compares the size of the mistake with the true value.'
        write: 'Percentage error $= \dfrac{\text{error}}{\text{true value}} \times 100\%$'
      - say: 'First, the error. The measurement was 255 instead of 250, so the error is 255 minus 250, which is 5 cm.'
        write: 'Error $= 255 - 250 = 5$ cm'
      - say: 'Now put the numbers into the formula. The error, 5, goes on top, and the true value, 250, goes on the bottom.'
        write: 'Percentage error $= \dfrac{5}{250} \times 100\%$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
          - {line: 3, kind: move, from: {line: 2, at: '=[[5]]cm'}, at: '250[[5]]', text: 'error'}
          - {line: 3, kind: move, from: {line: 0, at: '[[250]]cm'}, at: '[[250]]5', text: 'true value'}
      - say: 'Simplify the fraction: 5 goes into 250 fifty times, so 5 over 250 is 1 over 50.'
        write: '$= \dfrac{1}{50} \times 100\%$'
      - say: '1 over 50, times 100, is 100 divided by 50, which is 2.'
        write: '$= \dfrac{100}{50}\% = 2\%$'
      - say: 'One detail matters here. We compare with the true value, 250, not the measured 255. Dividing by 255 would give about 1.96 percent instead.'
        write: 'Not $\dfrac{5}{255} \times 100\% \approx 1.96\%$'
        point:
          - {line: 6, kind: strike, text: 'not this'}
      - say: 'Does 2 percent make sense? 1 percent of 250 is 2.5 cm, and our error of 5 cm is two lots of that.'
        write: '$1\%$ of $250 = 2.5$, and $5 = 2 \times 2.5$'
      - say: 'So the percentage error is 2 percent, which is answer choice E.'
        write: 'Percentage error $= 2\%$'
        answer: true
    traps:
      A: 'You went for 55. That looks like the last digits of 255, not a calculation. The error is 5 cm, and 5 over 250, times 100, is 2 percent.'
      B: 'You went for 10. That''s five times too big. The error is 5 cm out of a true 250 cm, and 5 over 250 times 100 is 2 percent.'
      C: 'You went for 5. That''s the error in centimetres, not a percentage. We still need to divide it by the true length and multiply by 100: 5 over 250 times 100 is 2.'
      D: 'You went for 4. That''s double the answer. The error is 255 minus 250, which is 5, and 5 over 250 times 100 is 2 percent.'
  32:
    moments:
      - say: 'We''re told 2 over 3 to the power $m$, times 3 over 4 to the power $n$, equals 256 over 729. We want $m$ and $n$.'
        write: '$\left(\tfrac{2}{3}\right)^{m}\left(\tfrac{3}{4}\right)^{n} = \tfrac{256}{729}$'
      - say: 'The plan: write both sides as powers of the primes 2 and 3, then match the powers on each side.'
        write: 'Plan: powers of 2 and 3 on both sides'
      - say: '2 over 3, to the $m$, is 2 to the $m$ over 3 to the $m$.'
        write: '$\left(\tfrac{2}{3}\right)^{m} = \dfrac{2^{m}}{3^{m}}$'
      - say: '3 over 4, to the $n$, is 3 to the $n$ over 4 to the $n$. And 4 is 2 squared, so 4 to the $n$ is 2 to the $2n$.'
        write: '$\left(\tfrac{3}{4}\right)^{n} = \dfrac{3^{n}}{4^{n}} = \dfrac{3^{n}}{2^{2n}}$'
      - say: 'Multiply them. For the 2s, $2^m$ on top and $2^{2n}$ below give 2 to the $m - 2n$. For the 3s, $3^n$ on top and $3^m$ below give 3 to the $n - m$.'
        write: 'Left side $= \dfrac{2^{m}}{3^{m}} \times \dfrac{3^{n}}{2^{2n}} = 2^{m - 2n} \times 3^{n - m}$'
      - say: 'Now the right side. Doubling from 2: 2, 4, 8, 16, 32, 64, 128, 256. That''s eight 2s, so 256 is 2 to the 8.'
        write: '$256 = 2^{8}$'
      - say: 'And tripling from 3: 3, 9, 27, 81, 243, 729. That''s six 3s, so 729 is 3 to the 6.'
        write: '$729 = 3^{6}$'
      - say: 'Dividing by 3 to the 6 is the same as multiplying by 3 to the negative 6.'
        write: 'Right side $= \dfrac{2^{8}}{3^{6}} = 2^{8} \times 3^{-6}$'
      - say: 'Now match the powers of 2 on both sides: $m$ minus $2n$ equals 8.'
        write: 'Powers of 2: $m - 2n = 8 \quad (1)$'
        point:
          - {line: 4, kind: circle, at: '2m−2n'}
          - {line: 7, kind: circle, at: '28×'}
      - say: 'And match the powers of 3: $n$ minus $m$ equals negative 6.'
        write: 'Powers of 3: $n - m = -6 \quad (2)$'
        point:
          - {line: 4, kind: circle, at: '3n−m'}
          - {line: 7, kind: circle, at: '3−6'}
      - say: 'Add the two equations, and the $m$ terms cancel. Negative $2n$ plus $n$ is negative $n$, and 8 plus negative 6 is 2.'
        write: '(1) $+$ (2): $-n = 2$'
      - say: 'So $n$ is negative 2.'
        write: '$n = -2$'
      - say: 'Rearrange equation two: $m$ is $n$ plus 6. Negative 2 plus 6 is 4.'
        write: 'From (2): $m = n + 6 = -2 + 6 = 4$'
      - say: 'Check: 2 over 3 to the 4 is 16 over 81. 3 over 4 to the negative 2 flips to 4 over 3, squared, which is 16 over 9.'
        write: 'Check: $\left(\tfrac{2}{3}\right)^{4} = \tfrac{16}{81}$, $\left(\tfrac{3}{4}\right)^{-2} = \left(\tfrac{4}{3}\right)^{2} = \tfrac{16}{9}$'
      - say: '16 times 16 is 256, and 81 times 9 is 729. So the product is 256 over 729, as required.'
        write: '$\tfrac{16}{81} \times \tfrac{16}{9} = \tfrac{256}{729}$'
      - say: 'So $m = 4$ and $n = -2$, which is answer choice D.'
        write: '$m = 4,\ n = -2$'
        answer: true
    traps:
      A: 'You went for $m = 4$ and $n = 2$. The sign of $n$ was lost. With $n = 2$ we''d get 16 over 81 times 9 over 16, which is 9 over 81. The negative power is what flips 3 over 4 upside down to make 256.'
      B: 'You went for $m = -4$ and $n = -2$. With $m = -4$, 2 over 3 flips to 3 over 2, and the answer would be bigger than 1. But 256 over 729 is less than 1. Matching powers gives $m = 4$.'
      C: 'You went for $m = -4$ and $n = 2$. Both signs are reversed, and that gives 729 over 256, the fraction upside down. Matching the powers gives $m = 4$ and $n = -2$.'
      E: 'You went for $m = -2$ and $n = 4$. Test it in $m - 2n = 8$: negative 2 minus 8 is negative 10, not 8. The solution is $m = 4$ and $n = -2$.'
  33:
    moments:
      - say: 'Without tables, we want log base 7 of 49, plus log base 7 of 1 over 7.'
        write: '$\log_{7}49 + \log_{7}\tfrac{1}{7}$'
      - say: 'A logarithm answers a question: what power of the base gives this number? So log base 7 of $N$ is the power we raise 7 to, to get $N$.'
        write: '$\log_{7}N = p$ means $7^{p} = N$'
      - say: 'For log base 7 of 49: 7 to what power is 49? 7 times 7 is 49, so 7 squared is 49.'
        write: '$7^{2} = 7 \times 7 = 49$'
      - say: 'So log base 7 of 49 is 2.'
        write: '$\log_{7}49 = 2$'
      - say: 'For log base 7 of 1 over 7: 1 over a number is that number to the power negative 1. So 7 to the negative 1 is 1 over 7.'
        write: '$7^{-1} = \tfrac{1}{7}$'
      - say: 'So log base 7 of 1 over 7 is negative 1.'
        write: '$\log_{7}\tfrac{1}{7} = -1$'
      - say: 'Now put the two values back into the sum: 2 plus negative 1 is 1.'
        write: '$\log_{7}49 + \log_{7}\tfrac{1}{7} = 2 + (-1) = 1$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '=2'}, at: '=[[2]]+'}
          - {line: 6, kind: move, from: {line: 5, at: '=−1'}, at: '(−1)'}
      - say: 'The product law of logs: the log of one number plus the log of another is the log of their product.'
        write: 'Product law: $\log_{a}m + \log_{a}n = \log_{a}(mn)$'
      - say: 'Let''s check with the rule: log $a$ plus log $b$ equals the log of $a$ times $b$.'
        write: 'Check: $\log_{7}49 + \log_{7}\tfrac{1}{7} = \log_{7}\left(49 \times \tfrac{1}{7}\right)$'
      - say: '49 times 1 over 7 is 7, and log base 7 of 7 is 1, because 7 to the power 1 is 7. It agrees.'
        write: '$= \log_{7}7 = 1$'
      - say: 'So the value is 1, which is answer choice A.'
        write: 'Value $= 1$'
        answer: true
    traps:
      B: 'You went for 2. That''s only log base 7 of 49. We still have to add log base 7 of 1 over 7, which is negative 1, so the total is 1.'
      C: 'You went for 3. That takes log base 7 of 1 over 7 as positive 1. But 1 over 7 is 7 to the negative 1, so its log is negative 1, and 2 plus negative 1 is 1.'
      D: 'You went for 7. 49 times 1 over 7 is indeed 7, but the question wants the log of that. Log base 7 of 7 is 1.'
      E: 'You went for 0. The two logs don''t cancel: log base 7 of 49 is 2, and log base 7 of 1 over 7 is negative 1. Together they make 1.'
  34:
    moments:
      - say: 'We want to factorise $81a^4 - 16b^4$ completely.'
        write: '$81a^{4} - 16b^{4}$'
      - say: '81 is 9 squared and $a^4$ is $a^2$ squared, so $81a^4$ is $9a^2$ squared.'
        write: '$81a^{4} = (9a^{2})^{2}$'
      - say: 'In the same way, 16 is 4 squared and $b^4$ is $b^2$ squared, so $16b^4$ is $4b^2$ squared.'
        write: '$16b^{4} = (4b^{2})^{2}$'
      - say: 'So our expression is one square minus another square.'
        write: '$81a^{4} - 16b^{4} = (9a^{2})^{2} - (4b^{2})^{2}$'
        point:
          - {line: 3, kind: move, from: {line: 1, at: '(9a2)2'}, at: '(9a2)2'}
          - {line: 3, kind: move, from: {line: 2, at: '(4b2)2'}, at: '(4b2)2'}
      - say: 'A difference of two squares always factorises as the difference times the sum.'
        write: 'Difference of squares: $p^{2} - q^{2} = (p - q)(p + q)$'
      - say: 'Here $p$ is $9a^2$ and $q$ is $4b^2$.'
        write: '$= (9a^{2} - 4b^{2})(9a^{2} + 4b^{2})$'
        point:
          - {line: 4, kind: box, text: 'the rule'}
      - say: 'Completely means keep going. Look at the first bracket, $9a^2 - 4b^2$: that''s $3a$ squared minus $2b$ squared, another difference of two squares.'
        write: '$9a^{2} - 4b^{2} = (3a)^{2} - (2b)^{2}$'
      - say: 'So it factorises as $3a - 2b$ times $3a + 2b$.'
        write: '$= (3a - 2b)(3a + 2b)$'
      - say: 'The other bracket, $9a^2 + 4b^2$, is a sum of two squares, and that does not factorise. So it stays as it is.'
        write: '$9a^{2} + 4b^{2}$: a sum of squares, so it stays'
      - say: 'Now put the pieces together: replace $9a^2 - 4b^2$ with the two brackets we just found.'
        write: '$81a^{4} - 16b^{4} = (3a - 2b)(3a + 2b)(9a^{2} + 4b^{2})$'
        point:
          - {line: 9, kind: move, from: {line: 7, at: '(3a−2b)(3a+2b)'}, at: '(3a−2b)(3a+2b)', text: 'from here'}
      - say: 'So, completely factorised, it''s $3a - 2b$, times $3a + 2b$, times $9a^2 + 4b^2$, which is answer choice C.'
        write: 'Fully factorised: $(3a - 2b)(3a + 2b)(9a^{2} + 4b^{2})$'
        answer: true
    traps:
      A: 'You went for the option with $2a - 3b$. The letters and numbers have been swapped. The square root of $9a^2$ is $3a$ and of $4b^2$ is $2b$, so the brackets are $3a - 2b$ and $3a + 2b$.'
      B: 'You went for the option with $2a - 3b$ and $4a^2 - 9b^2$. The numbers have been swapped between $a$ and $b$. $81a^4$ is $9a^2$ squared, so the brackets are $3a - 2b$, $3a + 2b$ and $9a^2 + 4b^2$.'
      D: 'You went for $3a - 2b$ times $2a - 3b$. The second bracket should be $3a + 2b$: a difference of two squares always splits into a minus bracket and a plus bracket with the same terms.'
      E: 'You went for the option ending in $9a^2 - 4b^2$. That bracket is itself a difference of two squares, and it comes from the minus part, not the plus part. The leftover bracket is $9a^2 + 4b^2$.'
  35:
    moments:
      - say: 'A convex hexagon has one angle of 170 degrees, and the other five angles are all $x$ degrees. We want $x$.'
        write: 'One angle $170^{\circ}$, five angles of $x^{\circ}$'
      - say: 'Let me draw a diagram of this, to make it simpler to see.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '170°', text: 'one angle'}
          - {figure: sketch, kind: arc, target: ABC, text: 'x'}
      - say: 'The interior angles of a polygon with $n$ sides add up to $n$ minus 2, times 180 degrees. That''s because it can be cut into $n$ minus 2 triangles from one corner.'
        write: 'Sum of interior angles $= (n - 2) \times 180^{\circ}$'
      - say: 'A hexagon has 6 sides, so put in $n = 6$. 6 minus 2 is 4.'
        write: '$= (6 - 2) \times 180^{\circ} = 4 \times 180^{\circ}$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
      - say: '4 times 180 is 720 degrees.'
        write: '$= 720^{\circ}$'
      - say: 'The angles are 170 and five lots of $x$, and together they make the 720 we just found.'
        write: '$170 + 5x = 720$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '720∘'}, at: '720'}
          - {figure: sketch, kind: circle, target: '170°'}
          - {figure: sketch, kind: arc, target: CDE, text: '5 angles of x'}
      - say: 'Subtract 170 from both sides. 720 minus 170 is 550.'
        write: '$5x = 720 - 170 = 550$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '170+'}, at: '−170', text: 'across'}
      - say: 'Divide both sides by 5. 550 divided by 5 is 110.'
        write: '$x = \dfrac{550}{5} = 110$'
      - say: 'Check: 5 times 110 is 550, and 550 plus 170 is 720. Good.'
        write: 'Check: $170 + 5 \times 110 = 170 + 550 = 720$'
      - say: 'Every angle, 170 and 110, is less than 180 degrees, so the hexagon is convex, just as the question says.'
        write: '$170^{\circ} < 180^{\circ}$ and $110^{\circ} < 180^{\circ}$: convex'
      - say: 'So each of the other angles is 110 degrees, which is answer choice B.'
        write: '$x = 110^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: DEF, text: '110°'}
        answer: true
    traps:
      A: 'You went for 120 degrees. That''s each angle of a regular hexagon. This one isn''t regular: one angle is 170, so the other five must share 720 minus 170, which is 550, giving 110 each.'
      C: 'You went for 105 degrees. Check it: 5 times 105 is 525, and 525 plus 170 is 695, not 720. The five angles share 550, so each is 110.'
      D: 'You went for 102 degrees. Check it: 5 times 102 is 510, and 510 plus 170 is 680, not 720. The angle sum of a hexagon is 720, which gives 110.'
      E: 'You went for 100 degrees. That gives 500 plus 170, which is 670, not 720. Each of the five angles is 550 divided by 5, which is 110.'
  36:
    moments:
      - say: '$PQRS$ is a cyclic quadrilateral with $PQ = PS$. $PT$ is a tangent at $P$, and it makes 50 degrees with $PQ$. We want angle $QRS$.'
        write: '$\angle TPQ = 50^{\circ}$, $PQ = PS$'
        point:
          - {figure: 0, kind: arc, target: TPQ, text: '50°'}
      - say: 'Imagine the diagonal $QS$ drawn in. We''ll use three circle facts, one after another.'
        write: 'Join $QS$'
        point:
          - {figure: 0, kind: highlight, target: QS, text: 'join QS'}
      - say: 'First, the alternate segment theorem: the angle between a tangent and a chord equals the angle in the alternate segment, on the other side of the chord.'
        write: 'Tangent-chord angle $=$ angle in alternate segment'
        point:
          - {figure: 0, kind: arc, target: TPQ, text: '50°'}
          - {figure: 0, kind: arc, target: QSP, text: '50°'}
      - say: 'Here the chord is $PQ$, and the angle on the other side of it is at $S$. So angle $PSQ$ equals the 50 degrees between the tangent and $PQ$.'
        write: '$\angle PSQ = \angle TPQ = 50^{\circ}$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {figure: 0, kind: arc, target: PSQ, text: '50°'}
      - say: 'Second, $PQ$ equals $PS$, so triangle $PQS$ is isosceles. Its base angles, at $Q$ and $S$, are equal.'
        write: '$PQ = PS \Rightarrow \angle PQS = \angle PSQ = 50^{\circ}$'
        point:
          - {line: 0, kind: underline, at: 'PQ=PS', text: 'given'}
          - {figure: 0, kind: arc, target: PQS, text: '50°'}
      - say: 'The rule: the three angles of any triangle add up to 180 degrees.'
        write: 'Angle sum of a triangle: $A + B + C = 180^{\circ}$'
      - say: 'The angles in triangle $PQS$ add to 180, so the angle at $P$ is 180 minus 50 minus 50.'
        write: '$\angle QPS = 180^{\circ} - 50^{\circ} - 50^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: QPS, text: '80°'}
      - say: '50 plus 50 is 100, and 180 minus 100 is 80 degrees.'
        write: '$= 180^{\circ} - 100^{\circ} = 80^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: QPS, text: '80°'}
      - say: 'The rule: opposite angles of a cyclic quadrilateral add up to 180 degrees.'
        write: 'Cyclic quadrilateral: opposite angles add up to $180^{\circ}$'
      - say: 'Third, in a cyclic quadrilateral, opposite angles add to 180 degrees. The angle at $R$ is opposite the angle at $P$.'
        write: '$\angle QRS + \angle QPS = 180^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: QRS, text: 'R'}
          - {figure: 0, kind: arc, target: QPS, text: 'P'}
      - say: 'Put in the 80 degrees we found at $P$.'
        write: '$\angle QRS + 80^{\circ} = 180^{\circ}$'
        point:
          - {line: 10, kind: move, from: {line: 7, at: '=80∘'}, at: '+[[80∘]]', text: 'from here'}
      - say: 'So angle $QRS$ is 180 minus 80, which is 100 degrees.'
        write: '$\angle QRS = 180^{\circ} - 80^{\circ} = 100^{\circ}$'
        point:
          - {line: 11, kind: move, from: {line: 10, at: '+80∘'}, at: '−80∘', text: 'across'}
          - {figure: 0, kind: arc, target: QRS, text: '100°'}
      - say: 'So angle $QRS$ is 100 degrees, which is answer choice E.'
        write: 'So $\angle QRS = 100^{\circ}$'
        answer: true
        point:
          - {figure: 0, kind: arc, target: QRS, text: '100°'}
    traps:
      A: 'You went for 50 degrees. That''s the angle between the tangent and the chord, which gives the angle $PSQ$. We still need the angle at $P$, which is 80, and then the opposite angle at $R$, which is 100.'
      B: 'You went for 40 degrees. That''s 90 minus 50, but there''s no right angle to use here. The alternate segment theorem gives 50 at $S$, then 80 at $P$, then 180 minus 80 at $R$.'
      C: 'You went for 110 degrees. The angle at $P$ is 180 minus 50 minus 50, which is 80, and the opposite angle at $R$ is 180 minus 80, which is 100.'
      D: 'You went for 80 degrees. That''s the angle at $P$. The question asks for the angle at $R$, which is opposite it in the cyclic quadrilateral, so it''s 180 minus 80, which is 100.'
  37:
    moments:
      - say: 'A ship leaves port $P$, sails 30 km due south, then 60 km due west. We want the bearing of the ship $H$ from $P$.'
        write: '$30$ km south, then $60$ km west'
      - say: 'Let me draw a diagram of this, to make it simpler to see.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: P, text: 'port'}
          - {figure: sketch, kind: circle, target: '30 km', text: 'south'}
          - {figure: sketch, kind: circle, target: '60 km', text: 'west'}
      - say: 'Now let me join $P$ to $H$ on the diagram, and mark the bearing we want: it turns clockwise from north round to the line $PH$.'
        show_sketch: sketch_b
        point:
          - {figure: sketch_b, kind: highlight, target: PH, text: 'P to H'}
      - say: 'A bearing is measured from north, turning clockwise, and it''s written with three figures.'
        write: 'Bearing: clockwise from north'
        point:
          - {figure: sketch_b, kind: circle, target: N, text: 'north'}
          - {figure: sketch_b, kind: circle, target: '?', text: 'clockwise'}
      - say: 'The ship ends up south and west of the port, so it''s in the south-west quarter. Its bearing must be between 180 and 270 degrees.'
        write: '$180^{\circ} < \text{bearing} < 270^{\circ}$'
        point:
          - {figure: sketch_b, kind: circle, target: H, text: 'south-west'}
      - say: 'Draw the right-angled triangle: 30 km down from $P$, then 60 km across to $H$. Let theta be the angle at $P$ between due south and the line $PH$.'
        write: 'Angle $\theta$ at $P$: from due south, towards $H$'
        point:
          - {figure: sketch_b, kind: circle, target: θ}
      - say: 'From that angle, the 60 km side is opposite and the 30 km side is adjacent. So tan theta is 60 over 30.'
        write: '$\tan\theta = \dfrac{\text{opposite}}{\text{adjacent}} = \dfrac{60}{30}$'
        point:
          - {figure: sketch_b, kind: underline, target: '60 km', text: 'opposite'}
          - {figure: sketch_b, kind: underline, target: '30 km', text: 'adjacent'}
      - say: '60 divided by 30 is 2.'
        write: '$= 2$'
      - say: 'From the tables, the angle whose tangent is 2 is about 63.435 degrees.'
        write: '$\theta \approx 63.435^{\circ}$'
        point:
          - {figure: sketch_b, kind: circle, target: θ, text: '63.435°'}
      - say: 'Change the decimal part to minutes: 0.435 times 60 is about 26. So theta is 63 degrees 26 minutes.'
        write: '$0.435 \times 60 \approx 26$, so $\theta = 63^{\circ}26''$'
      - say: 'Now turn from north. 180 degrees turns us to face due south, and then we turn a further 63 degrees 26 minutes towards the west.'
        write: 'Bearing $= 180^{\circ} + 63^{\circ}26''$'
        point:
