          - {figure: sketch_b, kind: circle, target: '?', text: '180° + 63°26′'}
      - say: '180 plus 63 is 243. So the bearing of $H$ from $P$ is 243 degrees 26 minutes, which is answer choice B.'
        write: '$= 243^{\circ}26''$'
        point:
          - {figure: sketch_b, kind: label, target: '?', text: '243°26′'}
        answer: true
    traps:
      A: 'You went for 026 degrees 34 minutes. That''s the other angle in the triangle, and it points north-east. The ship is south-west of the port, so the bearing must be between 180 and 270.'
      C: 'You went for 116 degrees 34 minutes, which is 180 minus 63 degrees 26 minutes. That points south-east. The ship went west, so we add to 180 instead: 243 degrees 26 minutes.'
      D: 'You went for 063 degrees 26 minutes. That''s the angle west of south on its own, but a bearing is measured clockwise from north. Add the 180 to face south first: 243 degrees 26 minutes.'
      E: 'You went for 240 degrees. That''s in the right quarter but not exact. Tan $\theta$ is 60 over 30, which is 2, so $\theta$ is 63 degrees 26 minutes, and the bearing is 243 degrees 26 minutes.'
