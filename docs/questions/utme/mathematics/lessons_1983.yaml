      C: 'You went for 105 degrees. Check it: 5 times 105 is 525, and 525 plus 170 is 695, not 720. The five angles share 550, so each is 110.'
      D: 'You went for 102 degrees. Check it: 5 times 102 is 510, and 510 plus 170 is 680, not 720. The angle sum of a hexagon is 720, which gives 110.'
      E: 'You went for 100 degrees. That gives 500 plus 170, which is 670, not 720. Each of the five angles is 550 divided by 5, which is 110.'
  36:
    moments:
      - say: '$PQRS$ is a cyclic quadrilateral with $PQ = PS$. $PT$ is a tangent at $P$, and it makes 50 degrees with $PQ$. We want angle $QRS$.'
        write: '$\angle TPQ = 50^{\circ}$, $PQ = PS$'
        point:
          - {figure: 0, kind: arc, target: TPQ, text: '50°'}
      - say: 'Imagine the diagonal $QS$ drawn in. We''ll use three circle facts, one after another.'
        write: 'Join $QS$'
        point:
          - {figure: 0, kind: highlight, target: QS, text: 'join QS'}
      - say: 'First, the alternate segment theorem: the angle between a tangent and a chord equals the angle in the alternate segment, on the other side of the chord.'
        write: 'Tangent-chord angle $=$ angle in alternate segment'
        point:
          - {figure: 0, kind: arc, target: TPQ, text: '50°'}
          - {figure: 0, kind: arc, target: QSP, text: '50°'}
      - say: 'Here the chord is $PQ$, and the angle on the other side of it is at $S$. So angle $PSQ$ equals the 50 degrees between the tangent and $PQ$.'
        write: '$\angle PSQ = \angle TPQ = 50^{\circ}$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {figure: 0, kind: arc, target: PSQ, text: '50°'}
      - say: 'Second, $PQ$ equals $PS$, so triangle $PQS$ is isosceles. Its base angles, at $Q$ and $S$, are equal.'
        write: '$PQ = PS \Rightarrow \angle PQS = \angle PSQ = 50^{\circ}$'
        point:
          - {line: 0, kind: underline, at: 'PQ=PS', text: 'given'}
          - {figure: 0, kind: arc, target: PQS, text: '50°'}
      - say: 'The rule: the three angles of any triangle add up to 180 degrees.'
        write: 'Angle sum of a triangle: $A + B + C = 180^{\circ}$'
      - say: 'The angles in triangle $PQS$ add to 180, so the angle at $P$ is 180 minus 50 minus 50.'
        write: '$\angle QPS = 180^{\circ} - 50^{\circ} - 50^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: QPS, text: '80°'}
      - say: '50 plus 50 is 100, and 180 minus 100 is 80 degrees.'
        write: '$= 180^{\circ} - 100^{\circ} = 80^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: QPS, text: '80°'}
      - say: 'The rule: opposite angles of a cyclic quadrilateral add up to 180 degrees.'
        write: 'Cyclic quadrilateral: opposite angles add up to $180^{\circ}$'
      - say: 'Third, in a cyclic quadrilateral, opposite angles add to 180 degrees. The angle at $R$ is opposite the angle at $P$.'
        write: '$\angle QRS + \angle QPS = 180^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: QRS, text: 'R'}
          - {figure: 0, kind: arc, target: QPS, text: 'P'}
      - say: 'Put in the 80 degrees we found at $P$.'
