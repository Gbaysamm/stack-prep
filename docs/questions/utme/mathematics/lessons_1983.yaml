          - {line: 6, kind: travel, at: '6v', from: {line: 5, at: '= [[6v]]'}, text: '2nd part'}
      - say: 'Collect like terms, so $4v$ plus $6v$ is $10v$.'
        write: '$10v = 600$'
      - say: 'Divide both sides by 10. 600 divided by 10 is 60.'
        write: '$v = \dfrac{600}{10} = 60$'
        doodle_do:
