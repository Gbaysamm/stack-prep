  42:
    moments:
      - say: 'We want to simplify the cube root of $27a^9$ over 8.'
        write: '$\sqrt[3]{\dfrac{27a^{9}}{8}}$'
      - say: 'The cube root of a fraction is the cube root of the top over the cube root of the bottom.'
        write: '$= \dfrac{\sqrt[3]{27a^{9}}}{\sqrt[3]{8}}$'
      - say: 'And the cube root of a product is the product of the cube roots. So the top splits into two pieces, and we can take each piece separately.'
        write: '$= \dfrac{\sqrt[3]{27} \times \sqrt[3]{a^{9}}}{\sqrt[3]{8}}$'
      - say: 'The cube root of 27 is 3, because 3 times 3 times 3 is 27.'
        write: '$\sqrt[3]{27} = 3$, since $3 \times 3 \times 3 = 27$'
      - say: 'The cube root of 8 is 2, because 2 times 2 times 2 is 8.'
        write: '$\sqrt[3]{8} = 2$, since $2 \times 2 \times 2 = 8$'
      - say: 'For $a^9$, a cube root divides the power by 3. 9 divided by 3 is 3.'
        write: '$\sqrt[3]{a^{9}} = a^{9 \div 3} = a^{3}$'
      - say: 'Now put the three pieces back into the fraction: 3 times $a^3$, over 2.'
        write: '$\sqrt[3]{\dfrac{27a^{9}}{8}} = \dfrac{3 \times a^{3}}{2} = \dfrac{3a^{3}}{2}$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '=3'}, at: '[[3]]×'}
          - {line: 6, kind: move, from: {line: 5, at: '=a3'}, at: '×[[a3]]'}
          - {line: 6, kind: move, from: {line: 4, at: '=2'}, at: '=[[2]]3×'}
      - say: 'Let''s check by cubing it back. 3 cubed is 27, $a^3$ cubed is $a^9$, and 2 cubed is 8.'
        write: 'Check: $\left(\dfrac{3a^{3}}{2}\right)^{3} = \dfrac{3^{3}(a^{3})^{3}}{2^{3}} = \dfrac{27a^{9}}{8}$'
      - say: 'That''s exactly what was under the cube root, so our answer is right.'
        write: 'Matches the original $\dfrac{27a^{9}}{8}$'
      - say: 'So the answer is $3a^3$ over 2, which is answer choice E.'
        write: 'Answer: $\dfrac{3a^{3}}{2}$'
        answer: true
    traps:
      A: 'You went for $9a^2$ over 2. The cube root of 27 is 3, not 9, and a cube root divides the power 9 by 3, giving $a^3$, not $a^2$.'
      B: 'You went for $9a^3$ over 2. The power is right, but the cube root of 27 is 3, because 3 times 3 times 3 is 27. Nine cubed would be 729.'
      C: 'You went for 2 over $3a^2$. That''s upside down, and the power is wrong too. The 27 and $a^9$ are on top, so $3a^3$ stays on top, over 2.'
      D: 'You went for 2 over $3a^3$. That''s the right answer turned upside down. The 27 and $a^9$ are on the top, so the answer is $3a^3$ over 2.'
  43:
    moments:
      - say: 'The pie chart shows four crops: beans 14.5 kg, okro 14.5 kg, rice 56.5 kg and yams 184.5 kg. We want the angle of the okro sector.'
        doodle: {name: 'custom:1983_q43_a', caption: 'Farm yields in kg, Ondo'}
        write: 'Beans $14.5$, okro $14.5$, rice $56.5$, yams $184.5$ (kg)'
        point:
          - {figure: 0, kind: circle, target: Okro}
      - say: 'Each sector''s angle is its share of the total, times 360 degrees.'
        write: 'Angle $= \dfrac{\text{yield}}{\text{total}} \times 360^{\circ}$'
      - say: 'So first we need the total of all four yields.'
        write: 'Total $= 14.5 + 14.5 + 56.5 + 184.5$'
      - say: '14.5 plus 14.5 is 29, and 29 plus 56.5 is 85.5.'
        write: '$= 29 + 56.5 + 184.5 = 85.5 + 184.5$'
      - say: 'And 85.5 plus 184.5 is 270.'
        write: '$= 270$ kg'
      - say: 'So okro''s angle is 14.5 out of 270, times 360 degrees.'
        write: 'Okro $= \dfrac{14.5}{270} \times 360^{\circ}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '270'}, at: '270', text: 'total'}
          - {figure: 0, kind: circle, target: Okro, text: '14.5 of 270'}
      - say: '360 over 270 simplifies. Divide both by 90, and it''s 4 over 3. So each kilogram is worth 4 over 3 of a degree.'
        write: '$\dfrac{360}{270} = \dfrac{4}{3}$'
      - say: 'So okro''s angle is 14.5 times 4 over 3. 14.5 times 4 is 58, so we have 58 over 3.'
        write: 'Okro $= 14.5 \times \dfrac{4}{3} = \dfrac{58}{3}$'
      - say: '58 divided by 3 is 19, with 1 left over. So it''s 19 and a third degrees.'
        write: '$= 19\tfrac{1}{3}^{\circ}$'
        point:
          - {figure: 0, kind: label, target: Okro, text: '19⅓°'}
      - say: 'Let''s check the whole chart. Beans is also 19 and a third. Rice is 56.5 times 4 over 3, which is 75 and a third. Yams is 184.5 times 4 over 3, which is 246.'
        write: 'Beans $= 19\tfrac{1}{3}$, rice $= 75\tfrac{1}{3}$, yams $= 246$'
      - say: 'Together: 19 and a third, plus 19 and a third, plus 75 and a third, plus 246, makes 360. Good.'
        write: '$19\tfrac{1}{3} + 19\tfrac{1}{3} + 75\tfrac{1}{3} + 246 = 360$'
      - say: 'So the okro sector is 19 and a third degrees, which is answer choice B.'
        write: 'Okro $= 19\tfrac{1}{3}^{\circ}$'
        answer: true
        point:
          - {figure: 0, kind: label, target: Okro, text: '19⅓°'}
    traps:
      A: 'You went for 91 and a half degrees. That''s far too big for 14.5 kg out of 270 kg, which is only about 1 over 19 of the chart. 14.5 times 4 over 3 is 19 and a third degrees.'
      C: 'You went for 33 and a third degrees. Find the total first, 270 kg. Then each kilogram is 360 over 270, which is 4 over 3 of a degree, and 14.5 times 4 over 3 is 19 and a third.'
      D: 'You went for 11 degrees. That doesn''t share 360 degrees in proportion. The total is 270 kg, so okro gets 14.5 over 270 of 360 degrees, which is 19 and a third.'
      E: 'You went for 91 degrees. That''s far too big a share for okro. The total is 270 kg, and 14.5 over 270 of 360 degrees is 19 and a third.'
  44:
    moments:
      - say: 'In the figure, $PQR$ is a straight line. Above it, at $Q$, the angles are $x + 3y$ and 45 degrees. Below it they are $y$ and $3x + y$. We want $x$ and $y$.'
        write: 'Above: $(x + 3y)^{\circ},\ 45^{\circ}$; below: $y^{\circ},\ (3x + y)^{\circ}$'
        point:
