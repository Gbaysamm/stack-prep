        point:
          - {figure: 0, kind: arc, target: GKF, text: '30°'}
      - say: 'A rhombus has four equal sides, and its opposite sides are parallel. One more fact: each diagonal cuts the angles at its ends exactly in half.'
        write: 'Rhombus: each diagonal bisects the corner angles'
        point:
