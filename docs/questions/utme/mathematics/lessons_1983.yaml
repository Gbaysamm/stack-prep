      - say: 'Since $z$ is acute, its sine is positive, so $\sin z$ is the positive square root.'
        write: '$\sin z = \sqrt{1 - L^{2}}$'
      - say: 'Now the top of our expression. Cot is cos over sin, and cosec is 1 over sin.'
        write: 'Top: $\cot z - \operatorname{cosec} z = \dfrac{\cos z}{\sin z} - \dfrac{1}{\sin z}$'
      - say: 'They share the same bottom, $\sin z$, so we combine them, and put $L$ in place of $\cos z$.'
        write: '$= \dfrac{L - 1}{\sin z}$'
      - say: 'Now the bottom of our expression. Sec is 1 over cos, and tan is sin over cos.'
        write: 'Bottom: $\sec z + \tan z = \dfrac{1}{\cos z} + \dfrac{\sin z}{\cos z}$'
      - say: 'Again they share a bottom, this time $\cos z$, which is $L$.'
        write: '$= \dfrac{1 + \sin z}{L}$'
      - say: 'Now divide the top we found by the bottom we found. Dividing by a fraction means multiplying by it turned upside down.'
        write: 'Expression $= \dfrac{L - 1}{\sin z} \times \dfrac{L}{1 + \sin z}$'
      - say: 'Multiply the tops together and the bottoms together.'
        write: '$= \dfrac{L(L - 1)}{\sin z\,(1 + \sin z)}$'
      - say: 'On top, $L$ times $L - 1$ is $L^2 - L$. On the bottom, $\sin z$ times $1 + \sin z$ is $\sin z + \sin^2 z$.'
        write: '$= \dfrac{L^{2} - L}{\sin z + \sin^{2}z}$'
      - say: 'Now go back to the two lines we found at the start: $\sin z$ is the root of $1 - L^2$, and $\sin^2 z$ is $1 - L^2$.'
        write: '$= \dfrac{L^{2} - L}{\sqrt{1 - L^{2}} + (1 - L^{2})}$'
        point:
