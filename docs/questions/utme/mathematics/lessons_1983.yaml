        write: '$\angle QPS = 25^{\circ} + 25^{\circ} = 50^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: QPS, text: '50°'}
      - say: 'Co-interior angles add up to 180. 50 plus 130 is 180. It agrees.'
        write: '$50^{\circ} + 130^{\circ} = 180^{\circ}$ (co-int. $\angle$s, $PQ \parallel SR$) $\checkmark$'
