      C: 'You went for $x = 22.5$ and $y = 45$. Test it above the line: 22.5 plus 135 is 157.5, not 135. Solving the two equations gives $y = 32\tfrac{1}{7}$ and $x = 38\tfrac{4}{7}$.'
      D: 'You went for $x = 56.25$ and $y = 11.5$. Test it above the line: 56.25 plus 34.5 is 90.75, not 135. The solution of the two equations is $x = 38\tfrac{4}{7}$, $y = 32\tfrac{1}{7}$.'
  45:
    moments:
      - say: '$PR$ is the diameter of a semicircle with centre $Q$ and radius 3.5 cm. Below it is a triangle $PTR$ with 60 degree angles at $P$ and $R$. We want the perimeter of the figure $PTRS$. Take $\pi$ as 22 over 7.'
        write: '$r = 3.5$ cm, $\angle QPT = \angle QRT = 60^{\circ}$, $\pi = \tfrac{22}{7}$'
        point:
          - {figure: 0, kind: highlight, target: PR, text: 'diameter'}
          - {figure: 0, kind: circle, target: '3.5 cm', text: 'radius'}
          - {figure: 0, kind: circle, target: T, text: 'triangle PTR'}
      - say: 'Perimeter means the distance around the outside edge. The edge is the curved arc $RSP$, then the straight sides $PT$ and $TR$. The diameter $PR$ is inside the figure, so it doesn''t count.'
        write: 'Perimeter $=$ arc $RSP + PT + TR$'
        point:
          - {figure: 0, kind: circle, target: S, text: 'arc RSP'}
          - {figure: 0, kind: highlight, target: PT}
          - {figure: 0, kind: highlight, target: TR}
      - say: 'First the arc. A semicircle''s arc is half of the full circumference, $2\pi r$, so it''s $\pi r$.'
        write: 'Arc $= \tfrac{1}{2} \times 2\pi r = \pi r$'
        point:
          - {figure: 0, kind: arc, target: RS}
          - {figure: 0, kind: arc, target: SP}
      - say: 'Put in 22 over 7 for pi and 3.5 for $r$.'
        write: '$= \dfrac{22}{7} \times 3.5$'
        point:
          - {line: 3, kind: move, from: {line: 0, at: 'π=722'}, at: '722', text: 'π'}
          - {line: 3, kind: move, from: {line: 0, at: 'r=3.5'}, at: '3.5', text: 'r'}
      - say: '3.5 divided by 7 is 0.5, and 22 times 0.5 is 11. So the arc is 11 cm.'
        write: '$= 22 \times 0.5 = 11$ cm'
        point:
          - {figure: 0, kind: label, target: S, text: 'arc 11 cm'}
      - say: 'The rule: the three angles of any triangle add up to 180 degrees.'
        write: 'Angle sum of a triangle: $A + B + C = 180^{\circ}$'
      - say: 'Now triangle $PTR$. It has 60 degrees at $P$ and at $R$, so the angle at $T$ is 180 minus 60 minus 60, which is also 60.'
        write: '$\angle PTR = 180^{\circ} - 60^{\circ} - 60^{\circ} = 60^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: PTR, text: '60°'}
      - say: 'All three angles are 60, so triangle $PTR$ is equilateral: all its sides are equal.'
        write: '$\triangle PTR$ is equilateral: $PT = TR = PR$'
        point:
          - {figure: 0, kind: arc, target: PTR, text: '60°'}
          - {figure: 0, kind: highlight, target: PT, text: 'equal'}
          - {figure: 0, kind: highlight, target: TR, text: 'equal'}
      - say: 'Its side $PR$ is the diameter, twice the radius. 2 times 3.5 is 7 cm.'
        write: '$PR = 2 \times 3.5 = 7$ cm'
        point:
          - {figure: 0, kind: highlight, target: PR, text: '7 cm'}
      - say: 'So $PT$ and $TR$ are also 7 cm each.'
        write: '$PT = TR = 7$ cm'
        point:
          - {figure: 0, kind: label, target: PT, text: '7 cm'}
          - {figure: 0, kind: label, target: TR, text: '7 cm'}
      - say: 'Now go back to our perimeter line and put in the pieces: the arc, 11, plus 7, plus 7.'
        write: 'Perimeter $= 11 + 7 + 7$'
        point:
          - {line: 10, kind: move, from: {line: 4, at: '11cm'}, at: '11', text: 'arc'}
          - {line: 10, kind: move, from: {line: 9, at: '7cm'}, at: '11+[[7]]', text: 'sides'}
          - {line: 10, kind: move, from: {line: 9, at: '7cm'}, at: '7+[[7]]'}
      - say: '11 plus 7 plus 7 is 25. So the perimeter is 25 cm, which is answer choice A.'
        write: '$= 25$ cm'
        answer: true
    traps:
