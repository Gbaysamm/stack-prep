  21:
    moments:
      - say: 'Some number $x$, written in base 4, is squared, and the result is 1, 0, 0, 1, 0, 0 in base 2. We want $x$.'
        write: '$(x_{\text{base }4})^{2} = 100100_{2}$'
      - say: 'The bases are different, so we go through base ten. First, turn the base 2 number into base ten.'
        write: 'Step 1: $100100_{2}$ in base ten'
      - say: 'In base 2 the place values, from the right, are 1, 2, 4, 8, 16 and 32. Each one doubles the one before.'
        write: 'Place values: $32,\ 16,\ 8,\ 4,\ 2,\ 1$'
      - say: 'So 1, 0, 0, 1, 0, 0 means one 32, no 16, no 8, one 4, no 2 and no 1.'
        write: '$100100_{2} = 1 \times 32 + 0 \times 16 + 0 \times 8 + 1 \times 4 + 0 \times 2 + 0 \times 1$'
      - say: 'That''s 32 plus 4, which is 36.'
        write: '$= 32 + 4 = 36$'
      - say: 'Go back to the question: $x$ squared equals this number. So $x$ squared is 36.'
        write: '$x^{2} = 36$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '=36'}, at: '36'}
      - say: 'The square root of 36 is 6. So $x$ is 6 in base ten.'
        write: '$x = \sqrt{36} = 6_{10}$'
      - say: 'But the question wants $x$ in base 4. To convert, divide by 4 and keep the remainders. 6 divided by 4 is 1, remainder 2.'
        write: '$6 \div 4 = 1$ remainder $2$'
      - say: 'Then 1 divided by 4 is 0, remainder 1. We stop at zero.'
        write: '$1 \div 4 = 0$ remainder $1$'
      - say: 'Read the remainders from the bottom up: 1, then 2. So 6 is 1, 2 in base 4.'
        write: '$6_{10} = 12_{4}$'
        point:
