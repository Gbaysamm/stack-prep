      - say: 'So angle $QRS$ is 180 minus 80, which is 100 degrees.'
        write: '$\angle QRS = 180^{\circ} - 80^{\circ} = 100^{\circ}$'
        point:
          - {line: 11, kind: move, from: {line: 10, at: '+80∘'}, at: '−80∘', text: 'across'}
          - {figure: 0, kind: arc, target: QRS, text: '100°'}
      - say: 'So angle $QRS$ is 100 degrees, which is answer choice E.'
        write: 'So $\angle QRS = 100^{\circ}$'
        answer: true
        point:
          - {figure: 0, kind: arc, target: QRS, text: '100°'}
    traps:
      A: 'You went for 50 degrees. That''s the angle between the tangent and the chord, which gives the angle $PSQ$. We still need the angle at $P$, which is 80, and then the opposite angle at $R$, which is 100.'
      B: 'You went for 40 degrees. That''s 90 minus 50, but there''s no right angle to use here. The alternate segment theorem gives 50 at $S$, then 80 at $P$, then 180 minus 80 at $R$.'
      C: 'You went for 110 degrees. The angle at $P$ is 180 minus 50 minus 50, which is 80, and the opposite angle at $R$ is 180 minus 80, which is 100.'
      D: 'You went for 80 degrees. That''s the angle at $P$. The question asks for the angle at $R$, which is opposite it in the cyclic quadrilateral, so it''s 180 minus 80, which is 100.'
  37:
