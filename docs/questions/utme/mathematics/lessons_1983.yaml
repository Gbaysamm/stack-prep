        write: 'Solution. Let the speed for the first 4 hours $= v$ km/h'
        doodle_do:
          - {id: trip, op: circle, part: leg1, text: 'speed v', 'on': 'first 4 hours'}
      - say: 'He doubled his speed, and double means times 2. So the speed for the last 3 hours is $2v$.'
