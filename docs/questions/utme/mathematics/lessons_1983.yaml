  40:
    moments:
      - say: '$f(x)$ is 1 over $x - 1$, plus $x - 1$ over $x^2 - 1$. We want $f(1 - x)$.'
        write: '$f(x) = \dfrac{1}{x - 1} + \dfrac{x - 1}{x^{2} - 1}$'
      - say: 'It''s easier if we tidy up $f$ first. $x^2 - 1$ is a difference of two squares.'
        write: '$x^{2} - 1 = (x - 1)(x + 1)$'
      - say: 'So in the second fraction, $x - 1$ cancels from the top and bottom, leaving 1 over $x + 1$.'
        write: '$\dfrac{x - 1}{(x - 1)(x + 1)} = \dfrac{1}{x + 1}$'
        point:
          - {line: 2, kind: strike, at: '[[(x−1)]](x+1)', text: 'cancels'}
          - {line: 2, kind: strike, at: '[[x−1]]=x'}
      - say: 'So $f(x)$ is 1 over $x - 1$, plus 1 over $x + 1$.'
        write: '$f(x) = \dfrac{1}{x - 1} + \dfrac{1}{x + 1}$'
      - say: 'Now replace every $x$ with $1 - x$, in brackets so we don''t lose any signs.'
        write: '$f(1 - x) = \dfrac{1}{(1 - x) - 1} + \dfrac{1}{(1 - x) + 1}$'
        point:
          - {line: 3, kind: arrow, text: 'tidied f'}
      - say: 'First bottom: 1 minus $x$ minus 1. The 1s cancel and leave negative $x$.'
        write: 'First bottom: $(1 - x) - 1 = -x$'
      - say: 'So the first fraction is 1 over negative $x$, which is negative 1 over $x$.'
        write: 'First term $= \dfrac{1}{-x} = -\dfrac{1}{x}$'
      - say: 'Second bottom: 1 minus $x$ plus 1 is 2 minus $x$.'
        write: 'Second bottom: $(1 - x) + 1 = 2 - x$'
      - say: '2 minus $x$ is the negative of $x$ minus 2. So the second fraction is negative 1 over $x - 2$.'
        write: 'Second term $= \dfrac{1}{2 - x} = \dfrac{1}{-(x - 2)} = -\dfrac{1}{x - 2}$'
      - say: 'Put the two terms back together. $f(1 - x)$ is negative 1 over $x$, minus 1 over $x - 2$, which is answer choice C.'
        write: '$f(1 - x) = -\dfrac{1}{x} - \dfrac{1}{x - 2}$'
        answer: true
    traps:
      A: 'You went for 1 over $x$ plus 1 over $x + 2$. Both signs have slipped. $(1 - x) - 1$ is negative $x$, and $(1 - x) + 1$ is 2 minus $x$, which is negative $(x - 2)$.'
      B: 'You went for $x$ plus 1 over $2x - 1$. That doesn''t come from substituting. Put $1 - x$ in brackets in place of each $x$: the bottoms become negative $x$ and 2 minus $x$.'
      D: 'You went for negative 1 over $x$ plus 1 over $x^2 - 1$. The first part is right, but the second fraction must also have $1 - x$ put into it. Simplified first, it becomes 1 over 2 minus $x$, which is negative 1 over $x - 2$.'
      E: 'You went for 1 over $x$ minus 1 over $x - 2$. The second part is right, but the first bottom is $(1 - x) - 1$, which is negative $x$, not $x$. So the first term is negative 1 over $x$.'
