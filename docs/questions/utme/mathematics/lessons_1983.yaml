# UTME 1983 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1983.yaml. Answers match that file.
# This is a five-option paper (A-E), so each lesson has four traps.
format_version: 1
exam_year: 1983
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'We have five measurements, which are 5, 9, 3, 5 and 8. We want the median, $M$, and the mode, $D$, as a pair. Picture them as five cards.'
        write: 'Data: $5,\ 9,\ 3,\ 5,\ 8$'
        doodle: {name: 'custom:1983_q01_a', id: cards, caption: 'five measurements'}
      - section: 'Solution'
        say: 'Solution. The median is the middle value once the data are arranged in order of size. So first, arrange them, smallest first.'
        write: 'Solution. In order: $3,\ 5,\ 5,\ 8,\ 9$'
        doodle_do:
          - {id: cards, op: stage, stage: 'custom:1983_q01_a2', 'on': 'arrange'}
      - section: 'The median'
        say: 'There are 5 values, so $n$ is 5. For ungrouped data, the median is the $n$ plus 1 over 2th value.'
        write: '$n = 5$; median $=$ the $\left(\dfrac{n + 1}{2}\right)$th value'
      - say: 'Now substitute. 5 plus 1 is 6, and 6 over 2 is 3. So the median is the 3rd value.'
        write: '$= \left(\dfrac{5 + 1}{2}\right)$th $=$ 3rd value'
      - say: 'Count along the ordered list. 3 is 1st, 5 is 2nd, and 5 is 3rd. So the median is 5.'
        write: '$\therefore M = 5$'
        doodle_do:
          - {id: cards, op: circle, part: mid, text: '3rd'}
        point:
          - {line: 1, kind: circle, at: '5,[[5]],8', text: '3rd'}
      - section: 'The mode'
        say: 'The mode is the value with the highest frequency. A small table of $x$ and $f$ shows it, with 3 once, 5 twice, 8 once and 9 once.'
        write: 'Mode: the value with the highest frequency'
        diagram:
          id: t
          kind: table
          columns: ['x', 'f']
          rows: [[3, 1], [5, 2], [8, 1], [9, 1]]
          'on': 'table'
      - say: 'The highest frequency is 2, for the value 5. So the mode is 5.'
        write: '$\therefore D = 5$'
        diagram_do:
          - {id: t, op: highlight, part: 'row:2', text: 'highest f', 'on': 'highest'}
        doodle_do:
          - {id: cards, op: highlight, part: s5}
      - section: 'Check'
        say: 'To check, two values sit below the median, 3 and 5, and two sit above it, 8 and 9. The middle is right.'
        write: 'Check: $3,\ 5\ |\ \mathbf{5}\ |\ 8,\ 9$ ✓'
      - section: 'Answer'
        say: '$M$ is 5 and $D$ is 5, so the pair is 5, 5. That is option D.'
        write: '$\therefore (M,\ D) = (5,\ 5)$'
        answer: true
    traps:
      A: 'You went for 6, 5. The 6 is the mean. The numbers add to 30, and 30 over 5 is 6. The median is the $n$ plus 1 over 2th value in order, the 3rd, which is 5.'
      B: 'You went for 5, 8. The median is right, but 8 has a frequency of only 1. The mode is the value with the highest frequency, and that is 5, which appears twice.'
      C: 'You went for 5, 7. The median is right, but 7 is not one of the measurements at all. The mode is the value with the highest frequency, 5.'
      E: 'You went for 7, 5. The mode is right, but the median comes after arranging in order, which gives 3, 5, 5, 8 and 9. The 3rd value is 5, not 7.'
  2:
    moments:
      - section: 'The question'
        say: 'Two partners share a profit in the ratio 4 to 5, and Y gets ₦5,000 more than X. Many students stop at one share. We want the whole profit.'
        write: 'X : Y $= 4 : 5$; Y gets ₦5,000 more than X. Total profit $= ?$'
      - say: 'Let''s set it out the way you would in the exam. First, give the unknown a name.'
        write: 'Solution'
      - say: 'Let the total profit be x naira. The letter x stands for the number we are looking for.'
        write: 'Let the total profit be ₦$x$'
      - section: 'Sum of ratio'
        say: 'Add the parts of the ratio, so 4 plus 5 is 9. This is the sum of ratio. The profit is cut into 9 equal parts.'
        write: 'Sum of ratio $= 4 + 5 = 9$'
      - say: 'Each share is its part over the sum of ratio, times the total. X has 4 parts, so X gets 4 over 9 of x.'
        write: 'X''s share $= \dfrac{4}{9} \times x = \dfrac{4x}{9}$'
      - say: 'Y has 5 parts, so Y gets 5 over 9 of x.'
        write: 'Y''s share $= \dfrac{5}{9} \times x = \dfrac{5x}{9}$'
      - section: 'Form the equation'
        say: 'Y received 5,000 naira more than X, so Y''s share minus X''s share is 5,000.'
        write: 'Y''s share $-$ X''s share $= 5000$'
      - say: 'Put in the two shares we wrote, so 5x over 9, minus 4x over 9, equals 5,000.'
        write: '$\dfrac{5x}{9} - \dfrac{4x}{9} = 5000$'
      - say: 'The denominators are the same, so subtract the numerators. 5x minus 4x is x. So x over 9 is 5,000.'
        write: '$\dfrac{x}{9} = 5000$'
      - say: 'To get x by itself, multiply both sides by 9.'
        write: '$x = 5000 \times 9$'
      - say: '5,000 times 9 is 45,000.'
        write: '$x = 45000$'
      - section: 'Check'
        say: 'Check each share. X gets 4 over 9 of 45,000. 45,000 divided by 9 is 5,000, and 5,000 times 4 is 20,000.'
        write: 'X $= \tfrac{4}{9} \times 45000 = 20000$'
      - say: 'Y gets 5 over 9 of 45,000, which is 5 times 5,000, that is 25,000.'
        write: 'Y $= \tfrac{5}{9} \times 45000 = 25000$'
      - say: '25,000 minus 20,000 is 5,000, exactly what the question says.'
        write: '$25000 - 20000 = 5000 \ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the total profit for the year is 45,000 naira, which is option E.'
        write: '$\therefore$ Total profit $=$ ₦45,000.00'
        answer: true
    traps:
      A: 'You went for ₦20,000. That is X''s share alone, 4 over 9 of the profit. The question wants the whole profit, which is ₦45,000.'
      B: 'You went for ₦25,000. That is Y''s share alone, 5 over 9 of the profit. The whole profit is ₦45,000.'
      C: 'You went for ₦30,000. Try it. 5 over 9 of 30,000 minus 4 over 9 of 30,000 is only about 3,333, not 5,000. The equation x over 9 equals 5,000 gives 45,000.'
      D: 'You went for ₦15,000. That treats the profit as 3 parts of ₦5,000. The sum of ratio is 4 plus 5, which is 9, so the profit is 9 times 5,000, which is ₦45,000.'
  3:
    moments:
      - section: 'The question'
        say: 'A regular hexagon has six equal sides and six equal corners. The quickest road to each corner goes round the outside of the hexagon, through the exterior angle.'
        write: 'Regular hexagon, $n = 6$, each int. $\angle = ?$'
      - section: 'Solution'
        say: 'Solution. Let me draw the regular hexagon, with the side $BA$ produced past $A$. The angle outside is the exterior angle, and the angle inside is the one we want.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '60°', text: 'exterior'}
          - {figure: sketch, kind: circle, target: '?', text: 'interior'}
      - say: 'Walk once round any polygon and you turn through one full turn. So the exterior angles always add up to 360 degrees.'
        write: 'Sum of ext. $\angle$s $= 360^{\circ}$'
      - say: 'The hexagon is regular, so its six exterior angles are equal. Each one is 360 divided by 6.'
        write: 'Each ext. $\angle = \dfrac{360^{\circ}}{6}$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '360∘'}, at: '360∘', text: 'shared by 6'}
      - say: '360 divided by 6 is 60. Each exterior angle is 60 degrees.'
        write: 'Each ext. $\angle = 60^{\circ}$'
        point:
          - {figure: sketch, kind: circle, target: '60°', text: '60°'}
      - say: 'At $A$, the interior angle and the exterior angle sit together on the straight line $BA$ produced. The reason is angles on a straight line.'
        write: 'Int. $\angle$ + ext. $\angle = 180^{\circ}$ ($\angle$s on a str. line)'
        point:
          - {figure: sketch, kind: circle, target: '?', text: 'interior'}
          - {figure: sketch, kind: circle, target: '60°', text: 'exterior'}
      - say: 'Take the 60 to the other side, and we get 180 minus 60.'
        write: 'Int. $\angle = 180^{\circ} - 60^{\circ}$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '=60∘'}, at: '−60∘', text: 'from here'}
      - say: '180 minus 60 is 120. Each interior angle is 120 degrees.'
        write: 'Int. $\angle = 120^{\circ}$'
        point:
          - {figure: sketch, kind: circle, target: '?', text: '120°'}
      - section: 'Check'
        say: 'Check with the angle sum. The interior angles of an $n$-sided polygon add up to $n$ minus 2, times 180. Here $n$ is 6.'
        write: 'Sum of int. $\angle$s $= (6 - 2) \times 180^{\circ} = 720^{\circ}$'
      - say: 'Six equal angles share 720 degrees. 720 divided by 6 is 120. It agrees.'
        write: '$\dfrac{720^{\circ}}{6} = 120^{\circ}\ \checkmark$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '=720∘'}, at: '720∘'}
      - say: 'Therefore each interior angle of a regular hexagon is 120 degrees, option C.'
        write: '$\therefore$ each int. $\angle = 120^{\circ}$ (C)'
        answer: true
    traps:
      A: 'You went for 60 degrees. That is the exterior angle, 360 divided by 6. The interior angle sits beside it on a straight line, so it is 180 minus 60, which is 120.'
      B: 'You went for 30 degrees. That is half of the exterior angle, far too small for a hexagon''s corner. Each exterior angle is 360 divided by 6, which is 60, and each interior angle is 180 minus 60, which is 120.'
      D: 'You went for 45 degrees. That is the exterior angle of a regular octagon, 360 divided by 8. A hexagon has 6 sides, so its exterior angle is 60 and its interior angle is 120.'
      E: 'You went for 135 degrees. That is the interior angle of a regular octagon, with 8 sides. A hexagon has 6 sides, so each interior angle is 180 minus 60, which is 120.'
  4:
    moments:
      - section: 'The question'
        say: 'Three expressions are all equal to each other, joined in one chain. We want $x$ and $y$. One chain like this hides two equations.'
        write: '$4x - 3 = 3x + y = 2y + 5x - 12$'
      - section: 'Solution'
        say: 'We take the chain one link at a time. Each link gives one equation, so we get two simultaneous equations. We number them, then eliminate.'
        write: 'Solution'
      - say: 'Take the first link, which says $4x$ minus 3 equals $3x$ plus $y$.'
        write: 'First link: $4x - 3 = 3x + y$'
      - say: 'Collect the letters on the left and the numbers on the right. Subtract $3x$ and $y$ from both sides, and add 3 to both sides.'
        write: '$4x - 3x - y = 3$'
      - say: '$4x$ minus $3x$ is $x$. So $x$ minus $y$ equals 3. Call it equation one.'
        write: '$x - y = 3 \quad \text{......(1)}$'
      - say: 'Now the second link says $3x$ plus $y$ equals $2y$ plus $5x$ minus 12.'
        write: 'Second link: $3x + y = 2y + 5x - 12$'
      - say: 'Collect like terms. Subtract $5x$ and $2y$ from both sides.'
        write: '$3x - 5x + y - 2y = -12$'
      - say: '$3x$ minus $5x$ is negative $2x$. $y$ minus $2y$ is negative $y$.'
        write: '$-2x - y = -12$'
      - say: 'Multiply through by negative 1 to make the signs positive. Call it equation two.'
        write: '$2x + y = 12 \quad \text{......(2)}$'
      - section: 'Eliminate y'
        say: 'Equation one has negative $y$ and equation two has plus $y$. Add the two equations, and the $y$ terms cancel. $x$ plus $2x$ is $3x$, and 3 plus 12 is 15.'
        write: '(1) + (2): $3x = 15$'
        point:
          - {line: 4, kind: circle, at: '−y', text: 'cancels'}
          - {line: 8, kind: circle, at: '+y', text: 'with this'}
      - say: 'Divide both sides by 3. 15 divided by 3 is 5.'
        write: '$x = \dfrac{15}{3} = 5$'
      - say: 'Now find $y$. Substitute $x$ equals 5 in equation one.'
        write: 'Substitute $x = 5$ in (1):'
      - say: 'That gives 5 minus $y$ equals 3.'
        write: '$5 - y = 3$'
      - say: 'Add $y$ to both sides and subtract 3 from both sides. 5 minus 3 is 2.'
        write: '$y = 5 - 3 = 2$'
      - say: 'Therefore $x$ equals 5 and $y$ equals 2.'
        write: '$\therefore x = 5,\ y = 2$'
      - section: 'Check'
        say: 'Check all three links of the chain. 4 times 5, minus 3, is 17.'
        write: '$4(5) - 3 = 17$'
      - say: '3 times 5, plus 2, is 17.'
        write: '$3(5) + 2 = 17$'
      - say: '2 times 2, plus 5 times 5, minus 12, is 4 plus 25 minus 12, which is 17. All three are equal.'
        write: '$2(2) + 5(5) - 12 = 17\ \checkmark$'
      - say: 'So $x$ is 5 and $y$ is 2, which is option A.'
        write: '$\therefore x = 5,\ y = 2$ (A)'
        answer: true
    traps:
      B: 'You went for $x$ equals 2 and $y$ equals 5. Those are the right numbers, but swapped. Adding the equations gives $3x$ equals 15, so $x$ is 5, and then $y$ is 2.'
      C: 'You went for $x$ equals negative 2 and $y$ equals negative 5. The first two expressions both give negative 11, but the third gives negative 10 minus 10 minus 12, which is negative 32. The chain breaks.'
      D: 'You went for $x$ equals 5 and $y$ equals negative 2. The $x$ is right, but the sign of $y$ slipped. From $x$ minus $y$ equals 3, $y$ is 5 minus 3, which is positive 2.'
      E: 'You went for $x$ equals negative 5 and $y$ equals negative 2. Both signs are wrong. Adding the equations gives $3x$ equals positive 15, so $x$ is 5 and $y$ is 2.'
  5:
    moments:
      - section: 'The question'
        say: 'We are told $x$ equals 1 is a root of this cubic, and we want the other two roots. Picture the curve. It crosses the axis three times, and we know one crossing.'
        write: '$x^{3} - 2x^{2} - 5x + 6 = 0$'
        doodle: {name: 'custom:1983_q05_a', id: curve, caption: 'three crossings, one known'}
      - section: 'Solution'
        say: 'By the factor theorem, if 1 is a root then $x$ minus 1 is a factor. We divide it out by long division, and a quadratic is left.'
        write: 'Solution'
      - say: 'So write it down. $x$ equals 1 is a root, therefore $x$ minus 1 is a factor.'
        write: '$x = 1$ is a root $\therefore (x - 1)$ is a factor'
        doodle_do:
          - {id: curve, op: circle, part: r1}
      - section: 'Long division'
        say: 'Divide $x$ cubed minus $2x$ squared minus $5x$ plus 6 by $x$ minus 1. For the first term, $x$ cubed divided by $x$ is $x$ squared.'
        write: '$x^{3} \div x = x^{2}$'
      - say: 'Multiply $x$ squared by $x$ minus 1. That gives $x$ cubed minus $x$ squared.'
        write: '$x^{2}(x - 1) = x^{3} - x^{2}$'
      - say: 'Subtract it. $x$ cubed cancels. Negative $2x$ squared minus negative $x$ squared is negative $x$ squared. Bring down negative $5x$.'
        write: 'Subtract: $-x^{2} - 5x$'
      - say: 'Next, negative $x$ squared divided by $x$ is negative $x$.'
        write: '$-x^{2} \div x = -x$'
      - say: 'Multiply negative $x$ by $x$ minus 1. That gives negative $x$ squared plus $x$.'
        write: '$-x(x - 1) = -x^{2} + x$'
      - say: 'Subtract. Negative $5x$ minus $x$ is negative $6x$. Bring down plus 6.'
        write: 'Subtract: $-6x + 6$'
      - say: 'Then negative $6x$ divided by $x$ is negative 6.'
        write: '$-6x \div x = -6$'
      - say: 'Multiply negative 6 by $x$ minus 1. That gives negative $6x$ plus 6.'
        write: '$-6(x - 1) = -6x + 6$'
      - say: 'Subtract, and nothing is left. A remainder of zero confirms that $x$ minus 1 is a factor.'
        write: 'Subtract: remainder $= 0$'
      - say: 'The terms on top, $x$ squared, negative $x$ and negative 6, make the quotient.'
        write: 'Quotient $= x^{2} - x - 6$'
      - say: 'So the cubic is $x$ minus 1, times $x$ squared minus $x$ minus 6.'
        write: '$(x - 1)(x^{2} - x - 6) = 0$'
      - say: '$x$ minus 1 gives the root we already have. The other two roots come from the quadratic.'
        write: '$x^{2} - x - 6 = 0$'
      - section: 'Factorise'
        say: 'Here $a$ is 1, $b$ is negative 1 and $c$ is negative 6. The product is $a$ times $c$, negative 6. The sum is $b$, negative 1.'
        write: 'Product $= ac = -6$, Sum $= b = -1$'
      - say: 'Two numbers that multiply to negative 6 and add to negative 1 are negative 3 and plus 2.'
        write: 'Factors: $-3$ and $+2$'
      - say: 'Replace the middle term, negative $x$, with negative $3x$ plus $2x$.'
        write: '$x^{2} - 3x + 2x - 6 = 0$'
      - say: 'Group in pairs. From the first pair take out $x$, and from the second take out 2. Both brackets are $x$ minus 3.'
        write: '$x(x - 3) + 2(x - 3) = 0$'
      - say: 'Take out the common bracket, $x$ minus 3. What is left is $x$ plus 2.'
        write: '$(x - 3)(x + 2) = 0$'
      - say: 'Either the first bracket is zero or the second one is.'
        write: 'Either $x - 3 = 0$ or $x + 2 = 0$'
      - say: 'Therefore $x$ equals 3 or $x$ equals negative 2. Those are the two missing crossings.'
        write: '$\therefore x = 3$ or $x = -2$'
        doodle_do:
          - {id: curve, op: label, part: r3, text: '3'}
          - {id: curve, op: label, part: r2, text: '−2'}
      - section: 'Check'
        say: 'Put $x$ equals 3 in the cubic, and 27 minus 18 minus 15 plus 6 is zero.'
        write: '$x = 3$: $27 - 18 - 15 + 6 = 0\ \checkmark$'
      - say: 'Put $x$ equals negative 2, and negative 8 minus 8 plus 10 plus 6 is zero too.'
        write: '$x = -2$: $-8 - 8 + 10 + 6 = 0\ \checkmark$'
      - say: 'So the other roots are 3 and negative 2, which is option C.'
        write: '$\therefore$ other roots: $3$ and $-2$ (C)'
        answer: true
    traps:
      A: 'You went for negative 3 and 2. Those are the numbers inside the brackets, not the roots. $x$ minus 3 is zero when $x$ is positive 3, and $x$ plus 2 is zero when $x$ is negative 2.'
      B: 'You went for negative 2 and 2. Negative 2 is a root, but 2 is not, because 8 minus 8 minus 10 plus 6 is negative 4, not zero. The other root is 3.'
      D: 'You went for 1 and 3. The 1 is the root we were given, and the question wants the other two. The quotient factorises as $(x - 3)(x + 2)$, giving 3 and negative 2.'
      E: 'You went for negative 3 and 1. The 1 was already given, and negative 3 is not a root at all. The quotient is $(x - 3)(x + 2)$, giving 3 and negative 2.'
  6:
    moments:
      - section: 'The question'
        say: '$x$ is jointly proportional to the cube of $y$ and the fourth power of $z$. We halve $y$ and double $z$. Many students guess "no change". Let''s see what really happens to $x$.'
        doodle: {name: 'custom:1983_q06_a', id: tiles, caption: 'three y tiles, four z tiles'}
        write: 'Halve $y$, double $z$: how does $x$ change?'
      - say: 'Solution. Every variation question starts the same way. Write the statement with the sign of proportionality, then bring in a constant.'
        write: 'Solution'
      - say: 'Jointly proportional to $y$ cubed and $z$ to the fourth means $x$ varies as their product. This sign means "varies as".'
        write: '$x \propto y^{3}z^{4}$'
      - say: 'Replace the sign with "equals $k$ times", where $k$ is the constant of variation. Call this equation one, because we come back to it.'
        write: '$\therefore\ x = ky^{3}z^{4} \quad \ldots (1)$'
      - section: 'The new values'
        say: 'Halving $y$ makes it $y$ over 2. Doubling $z$ makes it $2z$. On the tiles, every $y$ is halved and every $z$ is doubled. Put both into the equation.'
        doodle_do: [{id: tiles, op: stage, stage: 'custom:1983_q06_a2', 'on': 'tiles'}]
        write: 'New $x = k\left(\dfrac{y}{2}\right)^{3}(2z)^{4}$'
      - say: 'Each bracket takes its own power. $y$ over 2, cubed, is $y$ cubed over 2 cubed, and 2 cubed is 8.'
        doodle_do: [{id: tiles, op: label, part: ys, text: '½ × ½ × ½ = ⅛'}]
        write: '$\left(\dfrac{y}{2}\right)^{3} = \dfrac{y^{3}}{2^{3}} = \dfrac{y^{3}}{8}$'
      - say: '$2z$ to the power 4 is 2 to the power 4 times $z$ to the power 4. 2 times 2 times 2 times 2 is 16.'
        doodle_do: [{id: tiles, op: label, part: zs, text: '2 × 2 × 2 × 2 = 16'}]
        write: '$(2z)^{4} = 2^{4}z^{4} = 16z^{4}$'
      - say: 'Put both results back into the new $x$.'
        write: 'New $x = k \times \dfrac{y^{3}}{8} \times 16z^{4}$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '=8y3'}, at: '8y3', text: 'y part'}
          - {line: 7, kind: move, from: {line: 6, at: '=16z4'}, at: '16z4', text: 'z part'}
      - say: 'Collect the numbers. 16 divided by 8 is 2.'
        write: '$= \dfrac{16}{8}\,ky^{3}z^{4} = 2ky^{3}z^{4}$'
      - say: 'Now look back at equation one. $k$ $y$ cubed $z$ to the fourth is the old $x$. So the new $x$ is 2 times the old $x$.'
        write: '$\therefore$ new $x = 2 \times$ old $x$'
        point:
          - {line: 3, kind: arrow, from: {line: 8, at: '2[[ky3z4]]'}, at: 'ky3z4', text: 'old x'}
      - say: 'Therefore new $x$ to old $x$ is 2 to 1. $x$ has doubled, so it is an increase.'
        write: 'New $x$ : old $x = 2 : 1$, an increase'
      - section: 'Check'
        say: 'Check with numbers. Take $k$ as 1, $y$ as 2 and $z$ as 1. Then $x$ is 2 cubed times 1, which is 8.'
        write: 'Check: $k = 1,\ y = 2,\ z = 1$: $\ x = 2^{3} \times 1^{4} = 8$'
      - say: 'Now halve $y$ to 1 and double $z$ to 2. 1 cubed times 2 to the fourth is 16. 8 became 16, so $x$ doubled.'
        write: '$y = 1,\ z = 2$: $\ x = 1^{3} \times 2^{4} = 16 = 2 \times 8\ \checkmark$'
      - say: 'So $x$ increases in the ratio 2 to 1, which is option B.'
        write: '$\therefore$ $x$ increases in the ratio $2 : 1$'
        answer: true
    traps:
      A: 'You went for 4 to 1. That gives a factor the wrong power, such as squaring the half instead of cubing it, and 16 over 4 is 4. Halving $y$ divides by 2 cubed, which is 8, doubling $z$ multiplies by 16, and 16 over 8 is 2.'
      C: 'You went for 1 to 4, a decrease. But doubling $z$ multiplies $x$ by 16, which outweighs dividing by 8 from halving $y$. Overall $x$ is multiplied by 2, an increase.'
      D: 'You went for no change. The two changes would only cancel if their factors matched. Here halving $y$ divides $x$ by 8, and doubling $z$ multiplies it by 16, so $x$ doubles.'
      E: 'You went for 3 to 4, a decrease. Halving $y$ divides $x$ by 2 cubed, which is 8, and doubling $z$ multiplies it by 2 to the power 4, which is 16. 16 over 8 is 2, so $x$ increases, 2 to 1.'
  7:
    moments:
      - section: 'The question'
        say: 'Two right-angled triangles share the side $PR$. Find that shared side in the first triangle, and it carries you across to $PS$ in the second.'
        write: '$QR = 8$ cm, $\angle Q = 60^{\circ}$, $\angle RPS = 45^{\circ}$, $PS = ?$'
        point:
          - {figure: 0, kind: highlight, target: QR, text: '8 cm'}
          - {figure: 0, kind: arc, target: PQR, text: '60°'}
          - {figure: 0, kind: arc, target: RPS, text: '45°'}
      - section: 'Solution'
        say: 'Solution. We find $PR$ first, in triangle $PQR$, where we know a side and an angle. Then we use $PR$ in triangle $PRS$.'
        write: 'Solution'
        point:
          - {figure: 0, kind: highlight, target: PR, text: 'shared side'}
      - say: 'In triangle $PQR$, take theta as the 60 degrees at $Q$. $PR$ is opposite theta. $QR$, facing the right angle at $P$, is the hypotenuse.'
        write: 'In $\triangle PQR$: $PR$ = opp, $QR$ = hyp'
        point:
          - {figure: 0, kind: highlight, target: PR, text: 'opp'}
          - {figure: 0, kind: highlight, target: QR, text: 'hyp'}
      - say: 'Opposite and hypotenuse means SOH. Sine of theta is opposite over hypotenuse.'
        write: '$\sin\theta = \dfrac{\text{opp}}{\text{hyp}}$ (SOH)'
      - say: 'Put in theta equals 60 degrees, and $QR$ equals 8.'
        write: '$\sin 60^{\circ} = \dfrac{PR}{8}$'
      - say: 'Multiply both sides by 8, so $PR$ stands alone.'
        write: '$PR = 8\sin 60^{\circ}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '8'}, at: '[[8]]sin', text: 'times 8'}
      - say: 'Sine 60 degrees is root 3 over 2.'
        write: '$PR = 8 \times \dfrac{\sqrt{3}}{2}$'
      - say: '8 divided by 2 is 4. So $PR$ is 4 root 3 centimetres.'
        write: '$PR = 4\sqrt{3}$ cm'
        point:
          - {figure: 0, kind: label, target: PR, text: '4√3'}
      - say: 'Now triangle $PRS$. It has 90 degrees at $R$ and 45 at $P$. The three angles add up to 180, by the angle sum of a triangle.'
        write: '$\angle PSR + 90^{\circ} + 45^{\circ} = 180^{\circ}$ ($\angle$ sum of $\triangle$)'
      - say: '90 plus 45 is 135, and 180 minus 135 is 45.'
        write: '$\angle PSR = 180^{\circ} - 135^{\circ} = 45^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: PSR, text: '45°'}
      - say: 'Two equal angles, 45 at $P$ and 45 at $S$, so the sides facing them are equal. That is because sides opposite equal angles are equal.'
        write: '$RS = PR = 4\sqrt{3}$ (sides opp. equal $\angle$s)'
        point:
          - {figure: 0, kind: label, target: RS, text: '4√3'}
      - say: '$PS$ faces the right angle at $R$, so it is the hypotenuse of triangle $PRS$, and we use Pythagoras.'
        write: '$PS^{2} = PR^{2} + RS^{2}$ (Pythagoras)'
        point:
          - {figure: 0, kind: highlight, target: PS, text: 'hyp'}
      - say: 'Put in 4 root 3 for both $PR$ and $RS$.'
        write: '$PS^{2} = (4\sqrt{3})^{2} + (4\sqrt{3})^{2}$'
      - say: '4 root 3, squared, is 16 times 3, which is 48. 48 plus 48 is 96.'
        write: '$PS^{2} = 48 + 48 = 96$'
      - say: 'Take the square root. 96 is 16 times 6, and 16 is a perfect square.'
        write: '$PS = \sqrt{96} = \sqrt{16 \times 6}$'
      - say: 'The square root of 16 is 4. So $PS$ is 4 root 6 centimetres.'
        write: '$PS = 4\sqrt{6}$ cm'
        point:
          - {figure: 0, kind: label, target: PS, text: '4√6 cm'}
      - section: 'Check'
        say: 'Check with the 45 degrees at $P$. Now $PR$ is adjacent and $PS$ is the hypotenuse, so we use CAH. Cos 45 should be 1 over root 2.'
        write: '$\cos 45^{\circ} = \dfrac{PR}{PS} = \dfrac{4\sqrt{3}}{4\sqrt{6}} = \dfrac{1}{\sqrt{2}}\ \checkmark$'
        point:
          - {figure: 0, kind: arc, target: RPS, text: '45°'}
      - say: 'Therefore $PS$ is 4 root 6 centimetres, option B.'
        write: '$\therefore PS = 4\sqrt{6}$ cm (B)'
        answer: true
    traps:
      A: 'You went for 2 root 3. That is only half of $PR$, and $PS$ is longer than $PR$, since it is a hypotenuse. $PR$ is 4 root 3, $RS$ is also 4 root 3, and Pythagoras gives $PS$ as 4 root 6.'
      C: 'You went for 2 root 6, exactly half the answer. $PR$ is 8 times sine 60, which is 4 root 3, not 2 root 3. Then $PS$ squared is 48 plus 48, which is 96, and $PS$ is 4 root 6.'
      D: 'You went for 8 root 6, double the answer. Sine 60 is root 3 over 2, so $PR$ is 8 times root 3 over 2, which is 4 root 3, not 8 root 3. Then $PS$ is 4 root 6.'
      E: 'You went for 8 cm. That is $QR$, the hypotenuse of the first triangle. $PS$ is the hypotenuse of the second triangle, $PRS$, and works out to 4 root 6 centimetres.'
  8:
    moments:
      - section: 'The question'
        say: 'We know cos $z$ is $L$, and we want a big fraction of cot, cosec, sec and tan in terms of $L$. It looks heavy, but one right-angled triangle gives all four.'
        write: '$\cos z = L$; find $\dfrac{\cot z - \operatorname{cosec} z}{\sec z + \tan z}$'
      - section: 'Solution'
        say: 'Solution. $z$ is acute, so draw a right-angled triangle. Write $L$ as $L$ over 1. CAH says cos is adjacent over hypotenuse, so the adjacent side is $L$ and the hypotenuse is 1.'
        doodle: {name: 'custom:1983_q08_a', id: tri, caption: 'cos z = L over 1'}
        write: 'Solution: $\cos z = \dfrac{L}{1} = \dfrac{\text{adj}}{\text{hyp}}$: adj $= L$, hyp $= 1$'
        doodle_do:
          - {id: tri, op: label, part: adj, text: 'adj = L'}
          - {id: tri, op: label, part: hyp, text: 'hyp = 1'}
      - say: 'Find the opposite side by Pythagoras, where the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hyp}^{2} = \text{opp}^{2} + \text{adj}^{2}$'
      - say: 'Now substitute. 1 squared equals opp squared plus $L$ squared. So opp squared is 1 minus $L$ squared.'
        write: '$1^{2} = \text{opp}^{2} + L^{2} \Rightarrow \text{opp}^{2} = 1 - L^{2}$'
      - say: 'Take the square root. A side is positive, so the opposite side is root of 1 minus $L$ squared.'
        write: '$\text{opp} = \sqrt{1 - L^{2}}$'
        doodle_do:
          - {id: tri, op: label, part: opp, text: 'opp = √(1 − L²)'}
      - section: 'The four ratios'
        say: 'Now read each ratio off the triangle. Cot is 1 over tan, so it is adjacent over opposite.'
        write: '$\cot z = \dfrac{\text{adj}}{\text{opp}} = \dfrac{L}{\sqrt{1 - L^{2}}}$'
      - say: 'Cosec is 1 over sin, so it is hypotenuse over opposite.'
        write: '$\operatorname{cosec} z = \dfrac{\text{hyp}}{\text{opp}} = \dfrac{1}{\sqrt{1 - L^{2}}}$'
      - say: 'Sec is 1 over cos, so it is hypotenuse over adjacent, which is 1 over $L$.'
        write: '$\sec z = \dfrac{\text{hyp}}{\text{adj}} = \dfrac{1}{L}$'
      - say: 'Tan is opposite over adjacent.'
        write: '$\tan z = \dfrac{\text{opp}}{\text{adj}} = \dfrac{\sqrt{1 - L^{2}}}{L}$'
      - section: 'Top and bottom'
        say: 'The top is cot minus cosec. Both have the same denominator, root of 1 minus $L$ squared, so subtract the numerators.'
        write: 'Top $= \cot z - \operatorname{cosec} z = \dfrac{L - 1}{\sqrt{1 - L^{2}}}$'
      - say: 'The bottom is sec plus tan. Both have denominator $L$, so add the numerators.'
        write: 'Bottom $= \sec z + \tan z = \dfrac{1 + \sqrt{1 - L^{2}}}{L}$'
      - section: 'Divide'
        say: 'Now divide the top by the bottom. To divide by a fraction, multiply by its reciprocal.'
        write: '$= \dfrac{L - 1}{\sqrt{1 - L^{2}}} \times \dfrac{L}{1 + \sqrt{1 - L^{2}}}$'
      - say: 'Multiply the numerators, so $L$ times $L$ minus 1 is $L$ squared minus $L$. Multiply the denominators, expanding the bracket.'
        write: '$= \dfrac{L^{2} - L}{\sqrt{1 - L^{2}} + (\sqrt{1 - L^{2}})^{2}}$'
      - say: 'Root of 1 minus $L$ squared, squared, is just 1 minus $L$ squared. Write that first in the denominator.'
        write: '$= \dfrac{L^{2} - L}{1 - L^{2} + \sqrt{1 - L^{2}}}$'
      - section: 'Check'
        say: 'Check with $z$ equal to 60 degrees, so $L$ is 1 over 2. The question gives about minus 0.577 over 3.732, which is about minus 0.155.'
        write: 'Check $z = 60^{\circ}$: $\ \dfrac{0.577 - 1.155}{2 + 1.732} \approx -0.155$'
      - say: 'Try our answer with $L$ equal to 0.5. 0.25 minus 0.5 is minus 0.25, and 1 minus 0.25 plus 0.866 is 1.616. Minus 0.25 over 1.616 is about minus 0.155. It agrees.'
        write: '$\dfrac{0.25 - 0.5}{0.75 + 0.866} \approx -0.155\ \checkmark$'
      - section: 'Answer'
        say: 'So the expression is $L$ squared minus $L$, over 1 minus $L$ squared plus root of 1 minus $L$ squared, which is answer choice B.'
        write: '$\therefore \dfrac{L^{2} - L}{1 - L^{2} + \sqrt{1 - L^{2}}}$'
        answer: true
        doodle_do:
          - {id: tri, op: circle, part: opp}
    traps:
      A: 'You went for 1 minus $L$, over 1 plus $L$. That leaves out the opposite side altogether. The top is $L$ minus 1 over the opposite, root of 1 minus $L$ squared, and that root stays in the answer.'
      C: 'You went for $L$ minus $L$ squared on top. That flips the sign. Cot minus cosec is $L$ minus 1 over the opposite, so the numerator is $L$ times $L$ minus 1, which is $L$ squared minus $L$.'
      D: 'You went for 1 plus $L$ squared in the denominator. But the opposite squared is 1 minus $L$ squared, because Pythagoras gives it as hyp squared minus adj squared.'
      E: 'You went for $L$ minus $L$ squared over 1 plus a root. There are two slips. The numerator should be $L$ squared minus $L$, and the denominator is the opposite times 1 plus the opposite, which brings in 1 minus $L$ squared.'
  9:
    moments:
      - section: 'The question'
        say: 'Two very small decimals are multiplied, and the answer must be in standard form, A times 10 to the power B. The sign of B is where many students slip.'
        write: '$0.0000152 \times 0.00042 = A \times 10^{B}$, $1 \le A < 10$'
      - say: 'Standard form means a number from 1 up to, but not including, 10, times a power of 10. So we first write each number in standard form.'
        doodle: {name: 'custom:1983_q09_a', id: hops, caption: 'the point hops right'}
        write: 'Solution'
      - section: 'Each number in standard form'
        say: 'For 0.0000152, the decimal point moves 5 places to the right to give 1.52. Moving it to the right gives a negative index, which is 10 to the power minus 5.'
        doodle_do: [{id: hops, op: stage, stage: 'custom:1983_q09_a2'}]
        write: '$0.0000152 = 1.52 \times 10^{-5}$'
        point:
          - {line: 2, kind: highlight, at: '10−5', to: {doodle: hops, part: hops1}}
      - say: 'For 0.00042, the point moves 4 places to the right to give 4.2. So it is 4.2 times 10 to the power minus 4.'
        doodle_do: [{id: hops, op: stage, stage: 'custom:1983_q09_a3'}]
        write: '$0.00042 = 4.2 \times 10^{-4}$'
        point:
          - {line: 3, kind: highlight, at: '10−4', to: {doodle: hops, part: hops2}}
      - say: 'So the product is 1.52 times 10 to the minus 5, times 4.2 times 10 to the minus 4.'
        write: 'Product $= 1.52 \times 10^{-5} \times 4.2 \times 10^{-4}$'
      - say: 'We may multiply in any order, so group the numbers together and the powers of 10 together.'
        write: '$= (1.52 \times 4.2) \times (10^{-5} \times 10^{-4})$'
      - section: 'Multiply the numbers'
        say: 'Multiply 152 by 42, leaving out the points for now. 152 times 2 is 304. 152 times 40 is 6,080. Add them and we get 6,384.'
        write: '$\begin{array}{r} 152 \\ \times\ \ 42 \\ \hline 304 \\ 6080 \\ \hline 6384 \end{array}$'
      - say: 'Now the points. 1.52 has 2 decimal places and 4.2 has 1, so the answer has 3 decimal places, giving 6.384.'
        write: '$1.52 \times 4.2 = 6.384$'
      - section: 'Multiply the powers'
        say: 'Now the powers. The law of indices says that to multiply powers of the same base, we add the indices.'
        write: '$a^{m} \times a^{n} = a^{m + n}$'
      - say: 'So minus 5 plus minus 4 is minus 9.'
        write: '$10^{-5} \times 10^{-4} = 10^{-5 + (-4)} = 10^{-9}$'
      - say: 'Therefore the product is 6.384 times 10 to the minus 9. And 6.384 lies between 1 and 10, so this is standard form.'
        write: '$\therefore$ Product $= 6.384 \times 10^{-9}$'
        point:
          - {line: 10, kind: move, from: {line: 7, at: '= 6.384'}, at: '6.384'}
          - {line: 10, kind: move, from: {line: 9, at: '= 10−9'}, at: '10−9'}
      - say: 'The options give A to 3 significant figures. After 6.38 the next digit is 4, which is less than 5, so we leave the 8 as it is.'
        write: '$6.38|4 \approx 6.38$ (3 s.f.)'
      - section: 'Check'
        say: 'To check, a number less than 1 times another number less than 1 gives a smaller number still, so B must be negative. Minus 9 fits.'
        write: 'Check: both numbers are less than 1, so $B < 0$ $\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore A is 6.38 and B is minus 9, which is option B.'
        write: '$\therefore A = 6.38,\ \ B = -9$'
        answer: true
    traps:
      A: 'You went for A = 9 and B = 6.38. The values are swapped. A is the number part, 6.38, and B is the index of 10, minus 9.'
      C: 'You went for B = 9. The sign of the index was lost. Both numbers are less than 1, so the product is tiny and the index is negative, which is minus 9.'
      D: 'You went for B = minus 1. The indices must be added, and minus 5 plus minus 4 is minus 9.'
      E: 'You went for B = 1. That would make the product bigger than 6, but the product of two tiny decimals is tiny. Minus 5 plus minus 4 is minus 9.'
  10:
    moments:
      - section: 'The question'
        say: '$x$ plus 2 and $x$ minus 1 are both factors of this cubic. We want $l$ and $k$. Think of each factor as a key that must turn the expression to zero.'
        write: '$lx^{3} + 2kx^{2} + 24$'
      - section: 'Solution'
        say: 'The factor theorem says that if $x$ minus $a$ is a factor, then $f$ of $a$ is zero. Two factors give us two equations in $l$ and $k$.'
        write: 'Solution'
      - say: 'First, give the expression a name, $f$ of $x$.'
        write: 'Let $f(x) = lx^{3} + 2kx^{2} + 24$'
      - say: 'First key. Set the factor $x$ minus 1 equal to zero. Therefore $x$ equals 1.'
        write: 'Let $x - 1 = 0$, $\therefore x = 1$'
      - say: 'Put 1 in place of every $x$, each in brackets. By the factor theorem, the result is zero.'
        write: '$f(1) = l(1)^{3} + 2k(1)^{2} + 24 = 0$'
      - say: '1 cubed and 1 squared are both 1.'
        write: '$l + 2k + 24 = 0$'
      - say: 'Subtract 24 from both sides. Call it equation one.'
        write: '$l + 2k = -24 \quad \text{......(1)}$'
      - say: 'Second key. Set $x$ plus 2 equal to zero. Therefore $x$ equals negative 2, not positive 2.'
        write: 'Let $x + 2 = 0$, $\therefore x = -2$'
      - say: 'Put negative 2 in place of every $x$, in brackets.'
        write: '$f(-2) = l(-2)^{3} + 2k(-2)^{2} + 24 = 0$'
      - say: 'Negative 2 cubed is negative 8. Negative 2 squared is 4, and $2k$ times 4 is $8k$.'
        write: '$-8l + 8k + 24 = 0$'
      - say: 'Every term divides by 8. Divide through by 8.'
        write: '$-l + k + 3 = 0$'
      - say: 'Subtract 3 from both sides. Call it equation two.'
        write: '$-l + k = -3 \quad \text{......(2)}$'
      - section: 'Solve for l and k'
        say: 'Equation one has plus $l$, and equation two has negative $l$. Add them, and $l$ cancels. $2k$ plus $k$ is $3k$, and negative 24 plus negative 3 is negative 27.'
        write: '(1) + (2): $3k = -27$'
      - say: 'Divide both sides by 3. Negative 27 over 3 is negative 9.'
        write: '$k = \dfrac{-27}{3} = -9$'
      - say: 'Now substitute $k$ equals negative 9 in equation one.'
        write: 'Substitute $k = -9$ in (1):'
      - say: '$l$ plus 2 times negative 9 equals negative 24.'
        write: '$l + 2(-9) = -24$'
      - say: '2 times negative 9 is negative 18.'
        write: '$l - 18 = -24$'
      - say: 'Add 18 to both sides. Negative 24 plus 18 is negative 6.'
        write: '$l = -24 + 18 = -6$'
      - say: 'Therefore $l$ equals negative 6 and $k$ equals negative 9.'
        write: '$\therefore l = -6,\ k = -9$'
      - section: 'Check'
        say: 'Try the first key. $f$ of 1 is negative 6, plus 2 times negative 9, plus 24. Negative 6 minus 18 plus 24 is zero.'
        write: '$f(1) = -6 - 18 + 24 = 0\ \checkmark$'
      - say: 'And the second key. Negative 8 times negative 6 is 48, and 8 times negative 9 is negative 72. 48 minus 72 plus 24 is zero.'
        write: '$f(-2) = 48 - 72 + 24 = 0\ \checkmark$'
      - say: 'So $l$ is negative 6 and $k$ is negative 9, which is option A.'
        write: '$\therefore l = -6,\ k = -9$ (A)'
        answer: true
    traps:
      B: 'You went for $l$ equals negative 2 and $k$ equals 1. Test it. $f$ of 1 is negative 2 plus 2 plus 24, which is 24, not zero. So $x$ minus 1 would not be a factor.'
      C: 'You went for $l$ equals negative 2 and $k$ equals negative 1. Then $f$ of 1 is negative 2 minus 2 plus 24, which is 20, not zero. Solving equations one and two gives negative 6 and negative 9.'
      D: 'You went for $l$ equals 0 and $k$ equals 1. With $l$ equal to 0 there is no cubic at all, and $f$ of 1 is 2 plus 24, which is 26, not zero.'
      E: 'You went for $l$ equals 6 and $k$ equals 0. Then $f$ of 1 is 6 plus 24, which is 30, not zero. Remember, $x$ plus 2 equals 0 gives $x$ equals negative 2.'
  11:
    moments:
      - section: 'The question'
        say: 'Make $T$ the subject. $T$ is wrapped in layers, with a cube root outside and a fraction inside, and it appears twice. We peel one layer at a time.'
        write: '$\dfrac{av}{1 - v} = \sqrt[3]{\dfrac{2v + T}{2aT}}$'
      - section: 'Solution'
        say: 'We undo the operations in reverse order, one per line. The outer layer is the cube root, so that goes first.'
        write: 'Solution'
      - say: 'Cube both sides. Cubing undoes a cube root, so the root disappears from the right.'
        write: '$\left(\dfrac{av}{1 - v}\right)^{3} = \dfrac{2v + T}{2aT}$'
      - say: 'Cubing a fraction cubes the top and the bottom. $av$ cubed is $a$ cubed $v$ cubed, and the bottom is $1 - v$, all cubed.'
        write: '$\dfrac{a^{3}v^{3}}{(1 - v)^{3}} = \dfrac{2v + T}{2aT}$'
      - say: 'Next layer, the fractions. Cross multiply, which means the top of each side times the bottom of the other.'
        write: '$2aT \times a^{3}v^{3} = (1 - v)^{3}(2v + T)$'
      - say: 'On the left, $2a$ times $a$ cubed is $2a$ to the power 4. So the left side is $2a^4v^3T$.'
        write: '$2a^{4}v^{3}T = (1 - v)^{3}(2v + T)$'
      - say: 'Open the bracket on the right, and we get $1 - v$ cubed times $2v$, plus $1 - v$ cubed times $T$.'
        write: '$2a^{4}v^{3}T = 2v(1 - v)^{3} + T(1 - v)^{3}$'
      - say: '$T$ is in two terms. Collect the terms in $T$ on one side by subtracting $T(1 - v)^3$ from both sides. It arrives on the left with a minus sign.'
        write: '$2a^{4}v^{3}T - T(1 - v)^{3} = 2v(1 - v)^{3}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '+T(1−v)3'}, at: '−T(1−v)3', text: 'across: minus'}
      - say: 'Both terms on the left contain $T$. Factorise out $T$.'
        write: '$T[2a^{4}v^{3} - (1 - v)^{3}] = 2v(1 - v)^{3}$'
      - say: 'Divide both sides by the square bracket. Therefore $T$ equals $2v$ times $1 - v$ cubed, over $2a^4v^3$ minus $1 - v$ cubed.'
        write: '$\therefore T = \dfrac{2v(1 - v)^{3}}{2a^{4}v^{3} - (1 - v)^{3}}$'
      - section: 'Check'
        say: 'Check with easy numbers, $a$ equals 1 and $v$ equals a half. Then $1 - v$ is a half, and the left side is a half over a half, which is 1.'
        write: '$a = 1,\ v = \tfrac{1}{2}$: LHS $= \dfrac{\frac{1}{2}}{\frac{1}{2}} = 1$'
      - say: 'In our formula, a half cubed is one-eighth. The top is 2 times a half times one-eighth, which is one-eighth. The bottom is two-eighths minus one-eighth, which is also one-eighth. So $T$ is 1.'
        write: '$T = \dfrac{2(\frac{1}{2})(\frac{1}{8})}{2(\frac{1}{8}) - \frac{1}{8}} = \dfrac{\frac{1}{8}}{\frac{1}{8}} = 1$'
      - say: 'Put $T$ equals 1 in the right side of the question. 2 times a half plus 1 is 2, over 2 times 1 times 1. The cube root of 1 is 1. Both sides agree.'
        write: 'RHS $= \sqrt[3]{\dfrac{1 + 1}{2}} = \sqrt[3]{1} = 1\ \checkmark$'
      - say: 'So the answer has $2a^4v^3$ minus $1 - v$ cubed at the bottom, which is option D.'
        write: '$\therefore T = \dfrac{2v(1 - v)^{3}}{2a^{4}v^{3} - (1 - v)^{3}}$ (D)'
        answer: true
    traps:
      A: 'You went for $3av$ over $1 - v$. A cube root is not removed by multiplying by 3. We cube both sides, and then collect $T$ from both terms it appears in.'
      B: 'You went for the answer with squares. This is a cube root, so both sides must be cubed, which gives $(1 - v)^3$ and $v^3$. And $2aT$ times $a^3$ gives $a^4$, not $a^2$.'
      C: 'You went for the answer with squares and a plus sign. Cubing is needed to remove a cube root, and when $T(1 - v)^3$ is collected on the left it becomes a minus.'
      E: 'You went for the version with a plus at the bottom. When $T(1 - v)^3$ is subtracted from both sides to join the other $T$ term, it becomes minus, so the bottom is $2a^4v^3$ minus $(1 - v)^3$.'
  12:
    moments:
      - section: 'The question'
        say: 'We have a pie chart of 60 pupils, with every sectoral angle written in terms of x. We want the number offering Additional Mathematics, whose sector is 2x minus 24 degrees.'
        write: '60 pupils. Add. Maths sector $= (2x - 24)^{\circ}$. Number $= ?$'
        point:
          - {figure: 0, kind: circle, target: '(2x − 24)°', text: 'Add. Maths'}
      - section: 'Solution'
        say: 'Solution. Copy the sectors into a table with subject, sectoral angle, and number of pupils, which we will fill in.'
        write: 'Angles at a point: sum $= 360^{\circ}$'
        diagram: {id: t, kind: table, columns: [Subject, 'Sectoral angle', 'Pupils'], rows: [[Biology, '(3x − 18)°', ''], [History, '(2x + 12)°', ''], [French, '(x + 12)°', ''], [Geography, 'x°', ''], [Add. Maths, '(2x − 24)°', '']]}
      - say: 'The angles of a pie chart are angles at a point, the centre, so they add up to 360 degrees.'
        write: '$(3x - 18) + (2x + 12) + (x + 12) + x + (2x - 24) = 360$'
      - say: 'Collect like terms. The x terms give 3x plus 2x plus x plus x plus 2x, which is 9x. The numbers give minus 18 plus 12 plus 12 minus 24, which is minus 18.'
        write: '$9x - 18 = 360$'
      - say: 'Take minus 18 across, and it becomes plus 18. 360 plus 18 is 378.'
        write: '$9x = 360 + 18 = 378$'
      - say: 'Divide both sides by 9. 378 divided by 9 is 42.'
        write: '$x = \dfrac{378}{9} = 42$'
      - section: 'The Add. Maths sector'
        say: 'Put x equals 42 into the Additional Mathematics angle. 2 times 42 is 84, and 84 minus 24 is 60 degrees.'
        write: 'Add. Maths $= 2(42) - 24 = 84 - 24 = 60^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:5,2', text: '60°', 'on': '60 degrees'}
        point:
          - {figure: 0, kind: label, target: '(2x − 24)°', text: '= 60°'}
      - say: 'The whole circle, 360 degrees, stands for all 60 pupils. So the number in a sector is its angle over 360, times 60.'
        write: 'Number $= \dfrac{\text{angle}}{360^{\circ}} \times \text{total}$'
      - say: 'Substitute 60 degrees and 60 pupils.'
        write: '$= \dfrac{60}{360} \times 60$'
      - say: '60 over 360 is 1 over 6, and 1 over 6 of 60 is 10.'
        write: '$= \dfrac{1}{6} \times 60 = 10$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:5,3', text: '10', 'on': 'is 10'}
      - section: 'Check'
        say: 'Check the whole class. The angles are 108, 96, 54, 42 and 60 degrees, so the pupils are 18, 16, 9, 7 and 10. They add up to 60.'
        write: '$18 + 16 + 9 + 7 + 10 = 60\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore 10 pupils offer Additional Mathematics, which is answer choice B.'
        write: '$\therefore$ 10 pupils offer Add. Maths'
        answer: true
    traps:
      A: 'You went for 15. That would need a 90 degree sector. With x equals 42, the Additional Mathematics angle is 60 degrees, and 60 over 360 of 60 pupils is 10.'
      C: 'You went for 18. That is the Biology sector. 3 times 42 minus 18 is 108 degrees, which is 18 pupils. Additional Mathematics is 60 degrees, which is 10 pupils.'
      D: 'You went for 12. That would need a 72 degree sector. The Additional Mathematics sector is 2x minus 24, which is 60 degrees, or 10 pupils.'
      E: 'You went for 28. No sector gives that many. Solve 9x minus 18 equals 360 to get x equals 42. The Additional Mathematics sector is 60 degrees, which is 10 pupils.'
  13:
    moments:
      - section: 'The question'
        say: 'There are five options, and four of them have the same digits, 1 and 9. The whole question is where the decimal point goes. Picture two cubes, with edges 0.3 and 0.2.'
        doodle: {name: 'custom:1983_q13_a', id: cubes, caption: 'two cubes'}
        write: 'Find $(0.3)^{3} - (0.2)^{3}$'
      - say: 'By BODMAS, powers are worked out before subtraction. So we cube each decimal first, then subtract.'
        write: 'Solution'
      - section: 'Cube each number'
        say: '0.3 cubed means 0.3 times 0.3 times 0.3.'
        write: '$(0.3)^{3} = 0.3 \times 0.3 \times 0.3$'
      - say: 'Multiply the digits, so 3 times 3 times 3 is 27. Count the decimal places, one in each number, so three in the answer. That gives 0.027.'
        doodle_do: [{id: cubes, op: label, part: big, text: '0.027'}]
        write: '$= 0.027$'
      - say: 'Now 0.2 cubed, which is 0.2 times 0.2 times 0.2.'
        write: '$(0.2)^{3} = 0.2 \times 0.2 \times 0.2$'
      - say: '2 times 2 times 2 is 8, and again there are three decimal places. So 0.2 cubed is 0.008.'
        doodle_do: [{id: cubes, op: label, part: small, text: '0.008'}]
        write: '$= 0.008$'
      - section: 'Subtract'
        say: 'Now put the two cubes back into the question.'
        write: '$(0.3)^{3} - (0.2)^{3} = 0.027 - 0.008$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '= 0.027'}, at: '0.027'}
          - {line: 6, kind: move, from: {line: 5, at: '= 0.008'}, at: '0.008'}
      - say: 'Set the subtraction out with the decimal points in a line. 27 thousandths minus 8 thousandths is 19 thousandths.'
        doodle_do: [{id: cubes, op: cross, part: small}]
        write: '$\begin{array}{r} 0.027 \\ -\ 0.008 \\ \hline 0.019 \end{array}$'
      - say: 'Therefore the value is 0.019.'
        write: '$\therefore (0.3)^{3} - (0.2)^{3} = 0.019$'
      - section: 'Check'
        say: 'Check with fractions. 0.3 is 3 over 10, so its cube is 27 over 1,000. 0.2 cubed is 8 over 1,000.'
        write: 'Check: $\dfrac{27}{1000} - \dfrac{8}{1000} = \dfrac{19}{1000}$'
      - say: '19 over 1,000 is 19 thousandths, which is 0.019. It agrees.'
        write: '$\dfrac{19}{1000} = 0.019 \ \checkmark$'
      - section: 'Answer'
        say: 'So the value is 0.019, which is option A.'
        write: '$\therefore$ Value $= 0.019$'
        answer: true
    traps:
      B: 'You went for 0.0019. The digits are right, but the point has moved one place too far. A cube of a number with one decimal place has three decimal places, so the answer is 0.019.'
      C: 'You went for 0.00019. The point is two places too far. 0.027 minus 0.008 is 0.019, which is nineteen thousandths.'
      D: 'You went for 0.000019. That has six decimal places, as if each number had two. 0.3 and 0.2 have one decimal place each, so their cubes have three.'
      E: 'You went for 0.000035. That does not come from cubing. 0.3 cubed is 0.027 and 0.2 cubed is 0.008, and 0.027 minus 0.008 is 0.019.'
  14:
    moments:
      - section: 'The question'
        say: '$y$ varies partly as $x$ squared and partly as 1 over root $x$. Two parts means two unknown constants, so we need two equations. The two given pairs supply them.'
        write: '$y = 2$ when $x = 1$; $\ y = 6$ when $x = 4$'
      - say: 'Solution. In partial variation, $y$ is the sum of two parts, and each part gets its own constant, $k$ one and $k$ two.'
        write: 'Solution'
      - say: '$y$ is made of two parts. One part goes with $x$ squared, and the other with 1 over root $x$. So $y$ equals $k$ one $x$ squared, plus $k$ two over root $x$.'
        write: '$y = k_{1}x^{2} + \dfrac{k_{2}}{\sqrt{x}}$'
      - section: 'Two equations'
        say: 'Now substitute the first pair, which is $x$ equals 1 and $y$ equals 2.'
        write: 'When $x = 1,\ y = 2$: $\ 2 = k_{1}(1)^{2} + \dfrac{k_{2}}{\sqrt{1}}$'
        point:
          - {line: 3, kind: move, from: {line: 0, at: 'y = [[2]]'}, at: ':[[2]] =', text: 'y'}
      - say: '1 squared is 1, and the square root of 1 is 1. So $k$ one plus $k$ two is 2. Number it equation one.'
        write: '$k_{1} + k_{2} = 2 \quad \ldots (1)$'
      - say: 'Now the second pair, $x$ equals 4 and $y$ equals 6.'
        write: 'When $x = 4,\ y = 6$: $\ 6 = k_{1}(4)^{2} + \dfrac{k_{2}}{\sqrt{4}}$'
      - say: '4 squared is 16, and the square root of 4 is 2.'
        write: '$16k_{1} + \dfrac{k_{2}}{2} = 6$'
      - say: 'Multiply every term by 2 to clear the fraction. 16 times 2 is 32, and 6 times 2 is 12. That is equation two.'
        write: '$32k_{1} + k_{2} = 12 \quad \ldots (2)$'
      - section: 'Solve for the constants'
        say: 'Both equations have a single $k$ two, so take equation two minus equation one. The $k$ two cancels.'
        write: '$(2) - (1)$: $\ 32k_{1} - k_{1} = 12 - 2$'
      - say: '32 $k$ one minus $k$ one is 31 $k$ one, and 12 minus 2 is 10.'
        write: '$31k_{1} = 10$'
      - say: 'Divide both sides by 31.'
        write: '$\therefore\ k_{1} = \dfrac{10}{31}$'
      - say: 'Substitute into equation one, and $k$ two is 2 minus 10 over 31. 2 is 62 over 31, and 62 minus 10 is 52.'
        write: 'Sub. in (1): $\ k_{2} = 2 - \dfrac{10}{31} = \dfrac{62 - 10}{31} = \dfrac{52}{31}$'
      - section: 'The equation'
        say: 'Put both constants back into the law of variation. There is one constant for each part.'
        write: '$\therefore\ y = \dfrac{10x^{2}}{31} + \dfrac{52}{31\sqrt{x}}$'
        point:
          - {line: 12, kind: move, from: {line: 10, at: '3110'}, at: '[[31]]10x2', text: 'k₁'}
      - section: 'Check'
        say: 'Check with $x$ equals 4. 10 times 16 over 31 is 160 over 31. 52 over 31 times 2 is 26 over 31. Together they make 186 over 31, which is 6.'
        write: 'Check $x = 4$: $\ \dfrac{160}{31} + \dfrac{26}{31} = \dfrac{186}{31} = 6\ \checkmark$'
      - say: 'So the expression is $10 x$ squared over 31, plus 52 over 31 root $x$, which is option A.'
        write: '$y = \dfrac{10x^{2}}{31} + \dfrac{52}{31\sqrt{x}}$'
        answer: true
    traps:
      B: 'You went for $x^2$ plus 1 over root $x$. That takes both constants as 1. Test it at $x = 4$. 16 plus a half is 16 and a half, not 6.'
      C: 'You went for $x^2$ plus 1 over $x$. The second part is the inverse of the square root of $x$, not of $x$, and each part needs its own constant, found from the two given pairs.'
      D: 'You went for 1 over 31 in both parts. Test it at $x = 1$. 1 over 31 plus 1 over 31 is 2 over 31, not 2. The constants are 10 over 31 and 52 over 31.'
      E: 'You went for 10 over 31 times both parts. That uses a single constant, but partial variation needs two. $k$ one is 10 over 31, and $k$ two is 52 over 31.'
  15:
    moments:
      - section: 'The question'
        say: 'Two algebraic fractions are multiplied together. They look heavy, but most of this cancels. The whole game is spotting what cancels.'
        write: '$\dfrac{x - 7}{x^{2} - 9} \times \dfrac{x^{2} - 3x}{x^{2} - 49}$'
      - section: 'Solution'
        say: 'With algebraic fractions we always factorise every top and bottom first, each on its own line. Then we cancel common factors.'
        write: 'Solution'
      - say: '$x$ squared minus 9 is a difference of two squares, $x$ squared minus 3 squared. So it is $x$ minus 3, times $x$ plus 3.'
        write: '$x^{2} - 9 = (x - 3)(x + 3)$'
      - say: '$x$ squared minus $3x$ has a common factor, which is $x$. Take it out to get $x$ times $x$ minus 3.'
        write: '$x^{2} - 3x = x(x - 3)$'
      - say: '$x$ squared minus 49 is another difference of two squares, because it is $x$ squared minus 7 squared.'
        write: '$x^{2} - 49 = (x - 7)(x + 7)$'
      - say: '$x$ minus 7 on the first top cannot be factorised further. Now rewrite the question with every factorised piece.'
        write: '$\dfrac{x - 7}{(x - 3)(x + 3)} \times \dfrac{x(x - 3)}{(x - 7)(x + 7)}$'
      - say: 'Multiply the tops together and the bottoms together to make one fraction. Picture each factor as a tile.'
        write: '$= \dfrac{x(x - 7)(x - 3)}{(x - 3)(x + 3)(x - 7)(x + 7)}$'
        doodle: {name: 'custom:1983_q15_a', id: tiles, caption: 'factor tiles', size: scene}
      - section: 'Cancel'
        say: '$x$ minus 7 is on the top and on the bottom. Cancel the common factor. Cross out the pink pair.'
        write: '$= \dfrac{x(x - 3)}{(x - 3)(x + 3)(x + 7)}$'
        doodle_do:
          - {id: tiles, op: cross, part: t7}
          - {id: tiles, op: cross, part: b7}
        point:
          - {line: 6, kind: strike, at: 'x[[(x−7)]]', text: 'cancels'}
          - {line: 6, kind: strike, at: '(x+3)[[(x−7)]]'}
      - say: '$x$ minus 3 is also on the top and the bottom. Cancel it too. Cross out the blue pair.'
        write: '$\therefore \dfrac{x}{(x + 3)(x + 7)}$'
        doodle_do:
          - {id: tiles, op: cross, part: t3}
          - {id: tiles, op: cross, part: b3}
        point:
          - {line: 7, kind: strike, at: 'x[[(x−3)]]', text: 'cancels'}
          - {line: 7, kind: strike, at: '[[(x−3)]](x+3)'}
      - section: 'Check'
        say: 'Check with $x$ equals 1. In the question we get negative 6 over negative 8, times negative 2 over negative 48. That is three-quarters times one over 24.'
        write: '$x = 1$: $\dfrac{-6}{-8} \times \dfrac{-2}{-48} = \dfrac{3}{4} \times \dfrac{1}{24}$'
      - say: 'Three-quarters times one over 24 is 3 over 96, which is 1 over 32.'
        write: '$= \dfrac{3}{96} = \dfrac{1}{32}$'
      - say: 'Our answer gives 1 over 4 times 8, which is 1 over 32. They agree.'
        write: '$\dfrac{1}{(4)(8)} = \dfrac{1}{32}\ \checkmark$'
      - say: 'So the expression simplifies to $x$ over $x$ plus 3, times $x$ plus 7, and that is option D.'
        write: '$\therefore \dfrac{x}{(x + 3)(x + 7)}$ (D)'
        doodle_do:
          - {id: tiles, op: circle, part: tx}
        answer: true
    traps:
      A: 'You went for $x$ over $x - 3$ times $x + 7$. The $x - 3$ is the factor that cancels, because it is on the top and the bottom. The one that survives is $x + 3$.'
      B: 'You went for $x + 3$ times $x + 7$, over $x$. That is the right answer turned upside down. The $x$ comes from the top, $x^2 - 3x$, so it stays on top.'
      C: 'You went for $x$ over $x - 3$ times $x - 7$. Both of those factors cancel. The brackets that survive are $x + 3$ and $x + 7$.'
      E: 'You went for a bracket $x + 4$. No 4 appears when we factorise, because $x^2 - 9$ gives $x + 3$ and $x - 3$. The answer is $x$ over $x + 3$ times $x + 7$.'
  16:
    moments:
      - section: 'The question'
        say: 'We have three sides, all in terms of $x$, and a right angle. Pythagoras turns them into one equation. Watch for the root that gives no triangle.'
        write: 'Sides $3x + 1$, $3x - 1$, $x$; $\ x = ?$'
      - section: 'Solution'
        say: 'Solution. Let me draw the right-angled triangle, with the right angle at $C$. The hypotenuse is the longest side, $3x$ plus 1, facing the right angle.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: highlight, target: AB, text: 'hypotenuse'}
      - say: 'The square on the hypotenuse equals the sum of the squares on the other two sides. This is Pythagoras.'
        write: '$|AB|^{2} = |BC|^{2} + |AC|^{2}$ (Pythagoras)'
        point:
          - {figure: sketch, kind: highlight, target: BC, text: '3x − 1'}
          - {figure: sketch, kind: highlight, target: AC, text: 'x'}
      - say: 'Put in the three sides.'
        write: '$(3x + 1)^{2} = (3x - 1)^{2} + x^{2}$'
      - say: 'Expand both brackets. $3x$ plus 1, squared, is $9x^2$ plus $6x$ plus 1. With the minus, the middle term is minus $6x$.'
        write: '$9x^{2} + 6x + 1 = 9x^{2} - 6x + 1 + x^{2}$'
      - say: 'Subtract $9x^2$ and 1 from both sides. They cancel.'
        write: '$6x = -6x + x^{2}$'
      - say: 'Add $6x$ to both sides. $6x$ plus $6x$ is $12x$.'
        write: '$12x = x^{2}$'
      - say: 'Bring everything to one side, so the equation equals zero.'
        write: '$x^{2} - 12x = 0$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '12x'}, at: '−12x', text: 'across'}
      - say: 'Both terms have $x$, so take $x$ out as a common factor.'
        write: '$x(x - 12) = 0$'
      - say: 'A product is zero only if one factor is zero. Either $x$ equals 0, or $x$ minus 12 equals 0.'
        write: 'Either $x = 0$ or $x - 12 = 0$'
      - say: 'A side of length 0 makes no triangle, so we reject it. Therefore $x$ is 12.'
        write: '$\therefore x = 12$ ($x \neq 0$)'
        point:
          - {line: 9, kind: strike, at: 'x=0', text: 'no triangle'}
          - {figure: sketch, kind: label, target: AC, text: '12 cm'}
      - section: 'Check'
        say: 'Check. With $x$ equals 12, the sides are 3 times 12 plus 1, which is 37, then 3 times 12 minus 1, which is 35, and 12.'
        write: 'Sides: $37,\ 35,\ 12$'
        point:
          - {figure: sketch, kind: label, target: AB, text: '37'}
          - {figure: sketch, kind: label, target: BC, text: '35'}
      - say: '35 squared is 1225, and 12 squared is 144. Together they make 1369, which is 37 squared.'
        write: '$35^{2} + 12^{2} = 1225 + 144 = 1369 = 37^{2}\ \checkmark$'
      - say: 'Therefore $x$ is 12, option D.'
        write: '$\therefore x = 12$ (D)'
        answer: true
    traps:
      A: 'You went for 2. Then the sides are 7, 5 and 2, and 5 squared plus 2 squared is 25 plus 4, which is 29, not 49. Pythagoras simplifies to $x^2 = 12x$, so $x$ is 12.'
      B: 'You went for 6. Then the sides are 19, 17 and 6, and 17 squared plus 6 squared is 289 plus 36, which is 325, not 361. Pythagoras gives $x^2 = 12x$, so $x$ is 12.'
      C: 'You went for 18. Then the sides are 55, 53 and 18, and 53 squared plus 18 squared is 3133, not 3025. Pythagoras gives $x^2 = 12x$, so $x$ is 12.'
      E: 'You went for 0. It does solve $x(x - 12) = 0$, but a side cannot have length 0. The other root, 12, is the one that makes a real triangle.'
  17:
    moments:
      - section: 'The question'
        say: 'We have fourteen exam scores, in no order. We want the median, the middle score. The middle only means something once the scores stand in order, so that comes first.'
        write: 'Scores: $41, 29, 55, 21, 47, 70, 70, 40, 43, 56, 73, 23, 50, 50$'
      - section: 'Solution'
        say: 'Solution. Arrange the scores in order of size, smallest first. We get 21, 23, 29, 40, 41, 43, 47, then 50, 50, 55, 56, 70, 70 and 73.'
        write: 'Solution. In order: $21, 23, 29, 40, 41, 43, 47, 50, 50, 55, 56, 70, 70, 73$'
      - section: 'The median'
        say: 'Count them, and $n$ is 14. For ungrouped data the median is the $n$ plus 1 over 2th value.'
        write: '$n = 14$; median $=$ the $\left(\dfrac{n + 1}{2}\right)$th value'
      - say: '14 plus 1 is 15, and 15 over 2 is 7 and a half. Half a position means the median sits halfway between the 7th and the 8th values.'
        write: '$= \left(\dfrac{14 + 1}{2}\right)$th $= 7\tfrac{1}{2}$th: between the 7th and 8th values'
      - say: 'Count along the ordered list. 21 is 1st, and the 7th is 47. The very next one, the 8th, is 50.'
        write: '7th value $= 47$, 8th value $= 50$'
        point:
          - {line: 1, kind: circle, at: '[[47]]50', text: '7th'}
          - {line: 1, kind: circle, at: '47[[50]]', text: '8th'}
      - say: 'The median is the average of those two middle values, so 47 plus 50, over 2.'
        write: 'Median $= \dfrac{47 + 50}{2}$'
      - say: '47 plus 50 is 97. So it is 97 over 2.'
        write: '$= \dfrac{97}{2}$'
      - say: '97 divided by 2 is 48 and a half.'
        write: '$\therefore$ Median $= 48\tfrac{1}{2}$'
      - section: 'Check'
        say: 'To check, six scores sit below 47, from 21 to 43, and six sit above 50, from 50 to 73. So 47 and 50 really are the middle pair.'
        write: 'Check: 6 values below the 7th, 6 values above the 8th ✓'
      - section: 'Answer'
        say: 'So the median score is 48 and a half, which is option B.'
        write: '$\therefore$ Median $= 48\tfrac{1}{2}$'
        answer: true
    traps:
      A: 'You went for 47. That is only the 7th value. With 14 scores, $n$ plus 1 over 2 is 7 and a half, so the median is halfway between the 7th and 8th values, 47 and 50, which gives 48 and a half.'
      C: 'You went for 50. That is the 8th value on its own. The median of 14 scores is the average of the 7th and 8th values, 47 and 50, which is 48 and a half.'
      D: 'You went for 48. You were close. 47 plus 50 is 97, and 97 over 2 is 48 and a half, not 48. Keep the half.'
      E: 'You went for 49. The two middle values in order are 47 and 50, and their average is 97 over 2, which is 48 and a half.'
  18:
    moments:
      - section: 'The question'
        say: 'One curve, five quadratics. We read where the curve cuts the axes, build the equation from its roots, and only then look at the options.'
        write: 'Equation of the curve $= ?$'
      - section: 'Solution'
        say: 'Solution. First, read the graph. The curve cuts the $y$-axis at 1, so the $y$-intercept is the point 0, 1.'
        write: 'Solution. $y$-intercept: $(0,\ 1)$'
        point:
          - {figure: 0, kind: circle, target: {x: 190, y: 50}, text: 'y = 1'}
      - say: 'It cuts the $x$-axis at negative 1 and at one-third. Those are the roots, because there $y$ is zero.'
        write: 'Roots: $x = -1$ and $x = \tfrac{1}{3}$'
        point:
          - {figure: 0, kind: circle, target: {x: 80, y: 80}, text: 'x = −1'}
          - {figure: 0, kind: circle, target: {x: 226.7, y: 80}, text: 'x = ⅓'}
      - say: 'Recall that a quadratic with roots alpha and beta is $a$, times $x$ minus alpha, times $x$ minus beta. The number $a$ is still unknown.'
        write: 'Recall: $y = a(x - \alpha)(x - \beta)$'
      - say: 'Substitute the roots. $x$ minus negative 1 is $x$ plus 1, and the other bracket is $x$ minus one-third.'
        write: '$y = a(x + 1)\left(x - \tfrac{1}{3}\right)$'
      - section: 'Find a'
        say: 'Use the $y$-intercept to find $a$. At $x$ equals 0, $y$ is 1. So 1 equals $a$, times 1, times negative one-third.'
        write: 'At $(0,\ 1)$: $1 = a(0 + 1)\left(0 - \tfrac{1}{3}\right) = -\dfrac{a}{3}$'
        point:
          - {figure: 0, kind: arrow, target: {x: 190, y: 50}, text: '(0, 1)'}
      - say: 'Multiply both sides by negative 3.'
        write: '$\therefore a = -3$'
      - section: 'Expand'
        say: 'Put $a$ back. Multiply the 3 into the second bracket, so 3 times $x$ minus one-third is $3x$ minus 1, and the minus stays in front.'
        write: '$y = -3(x + 1)\left(x - \tfrac{1}{3}\right) = -(x + 1)(3x - 1)$'
      - say: 'Open the brackets. $x$ times $3x$ is $3x^2$, $x$ times negative 1 is negative $x$, 1 times $3x$ is $3x$, and 1 times negative 1 is negative 1.'
        write: '$= -(3x^{2} - x + 3x - 1)$'
      - say: 'Collect like terms, so negative $x$ plus $3x$ is $2x$.'
        write: '$= -(3x^{2} + 2x - 1)$'
      - say: 'Take the minus sign through the bracket, and write the constant first, as the options do.'
        write: '$\therefore y = 1 - 2x - 3x^{2}$'
      - section: 'Check'
        say: 'Check the shape. The coefficient of $x^2$ is negative 3, so the curve has a maximum point and opens downwards, just like the graph.'
        write: 'Check: coefficient of $x^{2} = -3 < 0$, maximum point ✓'
        point:
          - {figure: 0, kind: arrow, target: {x: 152, y: 40}, text: 'maximum point'}
      - say: 'And put in the root negative 1, so 1, plus 2, minus 3 is zero.'
        write: '$x = -1$: $1 - 2(-1) - 3(-1)^{2} = 1 + 2 - 3 = 0$ ✓'
      - section: 'Exam tip'
        say: 'Here is an exam tip. E cuts the $y$-axis at negative 1, and A and B open upwards. Of C and D, only D gives zero at $x$ equals negative 1.'
        write: 'Exam tip: E: $y$-int. $-1$; A, B: $+3x^{2}$; C at $x = -1$: $-4$'
      - section: 'Answer'
        say: 'Therefore the curve is $y$ equals 1 minus $2x$ minus $3x^2$, which is answer choice D.'
        write: '$\therefore y = 1 - 2x - 3x^{2}$ (D)'
        answer: true
    traps:
      A: 'You went for $1 + 2x + 3x^2$. It cuts the $y$-axis at 1, but its $x^2$ coefficient is positive, so it has a minimum point and opens upwards. The graph opens downwards.'
      B: 'You went for $1 - 2x + 3x^2$. The constant is right, but plus $3x^2$ makes it open upwards. The graph has a maximum point, so the $x^2$ coefficient is negative.'
      C: 'You went for $1 + 2x - 3x^2$. It opens downwards and passes through 1, but at $x = -1$ it gives negative 4, not zero. Its roots are 1 and $-\tfrac{1}{3}$, the mirror image of the graph.'
      E: 'You went for $3x^2 + 2x - 1$. Those are the right roots, but $a$ came out positive. At $x = 0$ it gives negative 1, and the graph cuts the $y$-axis at positive 1, so $a$ is negative 3.'
  19:
    moments:
      - section: 'The question'
        say: 'A rhombus is a parallelogram with all four sides equal. The diagonal $KG$ cuts it into two isosceles triangles, and one of them holds the angle $x$.'
        write: 'Rhombus $FGHK$, $\angle GKF = 30^{\circ}$, $x = ?$'
        point:
          - {figure: 0, kind: arc, target: GKF, text: '30°'}
          - {figure: 0, kind: circle, target: x, text: '?'}
      - section: 'Solution'
        say: 'Solution. We work in triangle $KHG$, the top half of the rhombus, because $x$ is one of its angles.'
        write: 'Solution'
        point:
          - {figure: 0, kind: highlight, target: KG, text: 'diagonal'}
      - say: 'Opposite sides of a rhombus are parallel, so $HG$ is parallel to $KF$. The diagonal $KG$ crosses both and makes a Z, so these are alternate angles.'
        write: '$\angle HGK = \angle GKF = 30^{\circ}$ (alt. $\angle$s, $HG \parallel KF$)'
        point:
          - {figure: 0, kind: arc, target: GKF, text: '30°'}
          - {figure: 0, kind: arc, target: HGK, text: '30°'}
      - say: 'All four sides of a rhombus are equal, so $HK$ equals $HG$. Triangle $KHG$ is isosceles.'
        write: '$HK = HG$ (sides of rhombus)'
        point:
          - {figure: 0, kind: highlight, target: HK, text: 'equal'}
          - {figure: 0, kind: highlight, target: HG, text: 'equal'}
      - say: 'So its base angles, at $K$ and at $G$, are equal, because base angles of an isosceles triangle are equal.'
        write: '$\angle HKG = \angle HGK = 30^{\circ}$ (base $\angle$s of isos. $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: HKG, text: '30°'}
      - say: 'The three angles of triangle $KHG$ add up to 180, by the angle sum of a triangle.'
        write: '$x + 30^{\circ} + 30^{\circ} = 180^{\circ}$ ($\angle$ sum of $\triangle$)'
      - say: '30 plus 30 is 60. Take it to the other side, and we get 180 minus 60.'
        write: '$x = 180^{\circ} - 60^{\circ}$'
      - say: '180 minus 60 is 120. So $x$ is 120 degrees.'
        write: '$x = 120^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: KHG, text: '120°'}
      - section: 'Check'
        say: 'Check with the parallel sides. The whole angle at $K$ is 30 plus 30, which is 60.'
        write: '$\angle HKF = 30^{\circ} + 30^{\circ} = 60^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: HKF, text: '60°'}
      - say: 'The angles at $K$ and $H$ lie between the parallel sides $HG$ and $KF$, on the same side of $KH$. Co-interior angles add up to 180, and 60 plus 120 is 180.'
        write: '$60^{\circ} + 120^{\circ} = 180^{\circ}$ (co-int. $\angle$s, $HG \parallel KF$) $\checkmark$'
      - say: 'Therefore $x$ is 120 degrees, option D.'
        write: '$\therefore x = 120^{\circ}$ (D)'
        answer: true
    traps:
      A: 'You went for 90 degrees. That would make the rhombus a square, but a square''s diagonal makes 45 degrees with a side, not 30. Here the base angles of triangle $KHG$ are 30 each, so $x$ is 180 minus 60, which is 120.'
      B: 'You went for 30 degrees. That is the angle between the diagonal and a side. The angle $x$ at $H$ is the third angle of triangle $KHG$, so it is 180 minus 30 minus 30, which is 120.'
      C: 'You went for 150 degrees, which is 180 minus 30. But triangle $KHG$ has two angles of 30, one at $K$ and one at $G$. So $x$ is 180 minus 60, which is 120.'
      E: 'You went for 60 degrees. That is the whole angle at $K$. $H$ is next to $K$, not opposite it, so the two angles add up to 180. The angle at $H$ is 120.'
  20:
    moments:
      - section: 'The question'
        say: 'A desk $PQRS$, 2 metres by 0.8 metres, is tilted at 30 degrees along its 2 metre edge $PQ$. We want the angle the diagonal $PR$ makes with the horizontal.'
        write: 'Desk $2$ m $\times\ 0.8$ m, tilted $30^{\circ}$ along $PQ$'
        point:
          - {figure: 0, kind: highlight, target: PQ, text: '2 m edge'}
          - {figure: 0, kind: highlight, target: PR, text: 'diagonal'}
      - section: 'Solution'
        say: 'Solution. Look at the figure. The edge $PQ$ stays on the floor, and the short edge $QR$ rises from it at 30 degrees. So the corner $R$ is lifted.'
        write: 'Solution: $PQ = 2$ m (on floor), $QR = 0.8$ m at $30^{\circ}$'
        point:
          - {figure: 0, kind: highlight, target: QR, text: '0.8 m'}
          - {figure: 0, kind: circle, target: '30°', text: 'tilt'}
      - say: 'There are two unknowns, so we name them. Let $h$ be the height of $R$ above the floor, and let theta be the angle $PR$ makes with the floor.'
        write: 'Let $h$ = height of $R$, $\ \theta$ = inclination of $PR$'
        point:
          - {figure: 0, kind: label, target: R, text: 'h up'}
      - section: 'The height of R'
        say: 'In the upright triangle under $QR$, the height $h$ is opposite the 30 degrees, and $QR$ is the hypotenuse. Opposite and hypotenuse means SOH, so we use sine.'
        write: '$\sin 30^{\circ} = \dfrac{\text{opp}}{\text{hyp}} = \dfrac{h}{0.8}$ (SOH)'
      - say: 'Cross-multiply, so $h$ is 0.8 times sine 30. Sine 30 is a half, so $h$ is 0.8 times 0.5, which is 0.4 metres.'
        write: '$h = 0.8\sin 30^{\circ} = 0.8 \times 0.5 = 0.4$ m'
        point:
          - {figure: 0, kind: label, target: R, text: '0.4 m up'}
      - section: 'The length of PR'
        say: 'On the desk top, $PQ$ and $QR$ meet at a right angle, so $PR$ is the hypotenuse. By Pythagoras, $PR$ squared is $PQ$ squared plus $QR$ squared.'
        write: '$PR^{2} = PQ^{2} + QR^{2}$ (Pythagoras)'
        point:
          - {figure: 0, kind: highlight, target: PR, text: 'hyp on the desk'}
      - say: 'Substitute 2 and 0.8. 2 squared is 4, and 0.8 squared is 0.64. Together they make 4.64.'
        write: '$= 2^{2} + 0.8^{2} = 4 + 0.64 = 4.64$'
      - say: 'Take the square root. The root of 4.64 is 2.154 metres.'
        write: '$PR = \sqrt{4.64} = 2.154$ m'
      - section: 'The angle of PR'
        say: '$PR$ climbs from $P$ on the floor up to $R$. The height $h$ is opposite theta, and $PR$ is the hypotenuse. SOH again.'
        write: '$\sin\theta = \dfrac{\text{opp}}{\text{hyp}} = \dfrac{h}{PR}$ (SOH)'
        point:
          - {figure: 0, kind: highlight, target: PR}
      - say: 'Now substitute, with $h$ as 0.4 and $PR$ as 2.154. 0.4 divided by 2.154 is 0.1857.'
        write: '$\sin\theta = \dfrac{0.4}{2.154} = 0.1857$'
        point:
          - {line: 9, kind: move, from: {line: 4, at: '=[[0.4]]m'}, at: '2.154[[0.4]]', text: 'h'}
          - {line: 9, kind: move, from: {line: 7, at: '2.154'}, at: '[[2.154]]0.4', text: 'PR'}
      - say: 'Now the sine tables. Look for 0.1857, and it sits at 10 degrees, in the 42 minutes column. So theta is 10 degrees 42 minutes.'
        write: '$\theta = \sin^{-1} 0.1857 = 10^{\circ}42''$ (tables)'
      - say: 'Therefore the diagonal $PR$ is inclined at 10 degrees 42 minutes to the horizontal.'
        write: '$\therefore$ inclination of $PR = 10^{\circ}42''$'
        point:
          - {figure: 0, kind: label, target: PR, text: '10°42′'}
      - section: 'Check'
        say: 'To check, go back up the diagonal. 2.154 times sine 10 degrees 42 minutes is 2.154 times 0.1857, which is 0.400 metres. That is the height of $R$.'
        write: 'Check: $2.154 \times 0.1857 = 0.400$ m $= h\ \checkmark$'
      - say: 'It also makes sense. $PR$ rises to the same 0.4 metres as $QR$, but it is longer, so it is less steep than 30 degrees.'
        write: '$10^{\circ}42'' < 30^{\circ}$ (longer slope, same height)'
      - section: 'Answer'
        say: 'So the inclination of the diagonal $PR$ to the horizontal is 10 degrees 42 minutes, which is answer choice E.'
        write: '$\therefore \theta = 10^{\circ}42''$'
        answer: true
    traps:
      A: 'You went for 23 degrees 35 minutes. That is the angle whose sine is 0.4, as if the diagonal were 1 metre long. The sine is the height over $PR$, so it is 0.4 over 2.154, which is 0.1857.'
      B: 'You went for 30 degrees. That is the slope of the short edge $QR$. The diagonal rises to the same 0.4 metres but is longer, so it is less steep, at 10 degrees 42 minutes.'
      C: 'You went for 15 degrees 36 minutes. The height of $R$ is 0.4 metres and $PR$ is 2.154 metres, so the sine of the angle is 0.1857, which the tables give as 10 degrees 42 minutes.'
      D: 'You went for 10 degrees. That drops the minutes. The tables give 0.1857 at 10 degrees 42 minutes, not at 10 degrees exactly.'
  21:
    moments:
      - section: 'The question'
        say: 'A number x, written in base four, is squared, and the result is one-zero-zero-one-zero-zero base two. The bases are different, so we go through base ten.'
        write: '$(x_{\text{base }4})^{2} = 100100_{2}$'
      - say: 'First, change one-zero-zero-one-zero-zero base two to base ten.'
        write: 'Solution'
      - section: 'Step 1: base 2 to base 10'
        say: 'Write the index numbers over the digits, starting from nought on the right and counting up to five on the left.'
        write: '$\overset{5}{1}\,\overset{4}{0}\,\overset{3}{0}\,\overset{2}{1}\,\overset{1}{0}\,\overset{0}{0}_{2}$'
      - say: 'Each digit is multiplied by two to the power of its index. So we have 1 times 2 to the power 5, plus 0 times 2 to the power 4, plus 0 times 2 cubed.'
        write: '$= 1 \times 2^{5} + 0 \times 2^{4} + 0 \times 2^{3}$'
      - say: 'Then we add 1 times 2 squared, 0 times 2 to the power 1 and 0 times 2 to the power nought.'
        write: '$\quad + 1 \times 2^{2} + 0 \times 2^{1} + 0 \times 2^{0}$'
      - say: '2 to the power 5 is 32, and 2 squared is 4. Every 0 digit gives 0.'
        write: '$= 32 + 0 + 0 + 4 + 0 + 0$'
      - say: '32 plus 4 is 36, base ten.'
        write: '$= 36_{10}$'
      - section: 'Step 2: find x in base ten'
        say: 'So x squared is 36.'
        write: '$x^{2} = 36$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '3610'}, at: '36'}
      - say: 'Take the square root of both sides. 36 dots make a square with 6 on each side, so x is 6, base ten. A count like this is positive.'
        write: '$x = \sqrt{36} = 6_{10}$'
        doodle: {name: 'custom:1983_q21_a', id: dots, caption: '36 dots in a square'}
        doodle_do:
          - {id: dots, op: label, part: side, text: '6', 'on': '6 on each side'}
      - section: 'Step 3: base 10 to base 4'
        say: 'But x is wanted in base four. Divide 6 by 4 again and again on the ladder, writing each remainder by the side.'
        diagram: {id: L, kind: ladder, divisor: 4, number: 6, 'on': 'ladder'}
      - say: '6 divided by 4 is 1, remainder 2.'
        diagram_do:
          - {id: L, op: step}
      - say: '1 divided by 4 is 0, remainder 1. We stop at 0.'
        diagram_do:
          - {id: L, op: step}
      - say: 'Read the remainders from the bottom up, which gives one, two. So 6 is one-two base four.'
        diagram_do:
          - {id: L, op: read, 'on': 'bottom up'}
        write: '$6_{10} = 12_{4}$'
        point:
          - {line: 12, kind: highlight, at: '124', to: {diagram: L, part: result}}
      - section: 'Check'
        say: 'Check by expanding back. The index numbers over one-two are one and nought. That gives 1 times 4 to the power 1, plus 2 times 4 to the power nought.'
        write: '$\overset{1}{1}\,\overset{0}{2}_{4} = 1 \times 4^{1} + 2 \times 4^{0} = 4 + 2 = 6$'
      - say: 'And 6 squared is 36, which is one-zero-zero-one-zero-zero base two. It agrees.'
        write: '$6^{2} = 36\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore x is one-two base four, which is option B.'
        write: '$\therefore x = 12_{4}$'
        answer: true
    traps:
      A: 'You went for 6. That is the right value, but in base ten. The question gives x in base four, and on the ladder 6 becomes one-two base four.'
      C: 'You went for one-zero-zero. In base four that is 1 times 4 squared, which is 16, and 16 squared is 256, not 36.'
      D: 'You went for two-one-zero. In base four that is 2 times 16 plus 1 times 4, which is 36. That is x squared, not x. Take the square root first.'
      E: 'You went for one-one-zero. That is 6 written in base two, not base four. Divide by 4 on the ladder, and you get one-two base four.'
  22:
    moments:
      - section: 'The question'
        say: 'There are three logs, and powers everywhere. Bring every power down in front, and the three terms turn out to be the same log, times three numbers.'
        write: 'Simplify $\log_{10}a^{1/3} + \tfrac{1}{4}\log_{10}a - \tfrac{1}{12}\log_{10}a^{7}$'
      - say: 'Solution. We use one law of logarithms on each term, then collect them.'
        write: 'Solution'
      - section: 'The law'
        say: 'Recall the power law of logarithms. The log of $M$ to the power $n$ is $n$ times the log of $M$. The index comes down in front.'
        write: 'Recall: $\log_{a}M^{n} = n\log_{a}M$'
      - section: 'Bring the powers down'
        say: 'The first term. By the power law, the index 1 over 3 comes down in front of log $a$.'
        write: '$\log_{10}a^{1/3} = \tfrac{1}{3}\log_{10}a$'
      - say: 'The second term, 1 over 4 log $a$, has no index to bring down. It stays as it is.'
        write: '$\tfrac{1}{4}\log_{10}a = \tfrac{1}{4}\log_{10}a$'
      - say: 'The third term. The index 7 comes down, so we have 1 over 12, times 7, log $a$. 1 over 12 times 7 is 7 over 12.'
        write: '$\tfrac{1}{12}\log_{10}a^{7} = \tfrac{7}{12}\log_{10}a$'
      - section: 'Collect the terms'
        say: 'Now write the expression again with the three new terms, keeping the minus sign on the last one.'
        write: 'Expression $= \tfrac{1}{3}\log_{10}a + \tfrac{1}{4}\log_{10}a - \tfrac{7}{12}\log_{10}a$'
      - say: 'Every term has log $a$ in it, so factorise. Take log $a$ out as a common factor, and put the numbers in a bracket.'
        write: '$= \left(\tfrac{1}{3} + \tfrac{1}{4} - \tfrac{7}{12}\right)\log_{10}a$'
      - say: 'The L.C.M. of 3, 4 and 12 is 12. 12 divided by 3 is 4, and 12 divided by 4 is 3. So the bracket is 4 plus 3 minus 7, over 12.'
        write: '$= \left(\dfrac{4 + 3 - 7}{12}\right)\log_{10}a$'
      - say: 'On top, 4 plus 3 is 7, and 7 minus 7 is 0. The plus terms and the minus term cancel exactly.'
        write: '$= \dfrac{0}{12}\log_{10}a$'
      - say: '0 over 12 is 0, and 0 times log $a$ is 0, whatever $a$ is.'
        write: '$= 0$'
      - section: 'Check'
        say: 'Check another way. Keep the indices, and use the laws of indices. 1 over 3, plus 1 over 4, minus 7 over 12, is 0. So everything is log of $a$ to the power 0, which is log 1, and log 1 is 0.'
        write: 'Check: $\log_{10}a^{\frac{1}{3} + \frac{1}{4} - \frac{7}{12}} = \log_{10}a^{0} = \log_{10}1 = 0$'
      - section: 'Answer'
        say: 'Therefore the expression simplifies to 0, which is option C.'
        write: '$\therefore$ the expression $= 0$'
        answer: true
    traps:
      A: 'You went for 1. By the power law, the numbers in front of log $a$ are 4 over 12, 3 over 12 and minus 7 over 12. They add to 0, not 1, so the expression is 0.'
      B: 'You went for 7 over 6 log $a$. That adds the last term instead of subtracting it, so 4 plus 3 plus 7 is 14, and 14 over 12 is 7 over 6. With the minus sign it is 4 plus 3 minus 7, which is 0.'
      D: 'You went for 10. The 10 is only the base of the logarithms. Bring each power down in front, and the numbers before log $a$ add to 0.'
      E: 'You went for $a$. The logs do not combine to give $a$ itself. Written as multiples of log $a$, the numbers in front cancel exactly, so the answer is 0.'
  23:
    moments:
      - section: 'The question'
        say: '$w$ varies inversely as $V$, and $u$ varies directly as $w$ cubed. We want one equation linking $u$ straight to $V$. Picture a chain from $V$ through $w$ to $u$.'
        doodle: {name: 'custom:1983_q23_a', id: chain, caption: 'V to w to u'}
        write: 'Given: $u = 1$ when $V = 2$'
      - say: 'Solution. Write each statement with the sign of proportionality, then bring in a constant for each.'
        write: 'Solution'
      - section: 'The two variations'
        say: '$w$ varies inversely as $V$, which means $w$ is proportional to 1 over $V$.'
        doodle_do: [{id: chain, op: highlight, part: flip}]
        write: '$w \propto \dfrac{1}{V}$'
      - say: 'Replace the sign with a constant, $k$ one. Number it equation one.'
        write: '$\therefore\ w = \dfrac{k_{1}}{V} \quad \ldots (1)$'
      - say: '$u$ varies directly as $w$ cubed, so $u$ is proportional to $w$ cubed.'
        doodle_do: [{id: chain, op: highlight, part: cubed}]
        write: '$u \propto w^{3}$'
      - say: 'With a second constant, $k$ two, that is equation two.'
        write: '$\therefore\ u = k_{2}w^{3} \quad \ldots (2)$'
      - section: 'Remove w'
        say: 'To link $u$ with $V$, remove $w$. Substitute equation one into equation two. On the chain, we jump straight from $V$ to $u$.'
        doodle_do: [{id: chain, op: arrow, part: vb, to_part: ub}]
        write: 'Sub. (1) in (2): $\ u = k_{2}\left(\dfrac{k_{1}}{V}\right)^{3}$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: 'Vk1'}, at: '(Vk1)', text: 'w from (1)'}
      - say: 'Cubing a fraction cubes the top and the bottom.'
        write: '$u = \dfrac{k_{2}k_{1}^{3}}{V^{3}}$'
      - say: '$k$ two times $k$ one cubed is just one constant. Let it be $k$.'
        write: 'Let $k = k_{2}k_{1}^{3}$: $\ u = \dfrac{k}{V^{3}}$'
      - section: 'Find k'
        say: 'Now find $k$ from the given values, where $u$ is 1 when $V$ is 2.'
        write: 'When $V = 2,\ u = 1$: $\ 1 = \dfrac{k}{2^{3}}$'
        point:
          - {line: 9, kind: move, from: {line: 0, at: 'V = [[2]]'}, at: '[[2]]3k', text: 'V'}
      - say: '2 cubed is 8. Multiply both sides by 8, and $k$ is 8.'
        write: '$1 = \dfrac{k}{8}$ $\ \therefore\ k = 8$'
      - say: 'So the relationship between $u$ and $V$ is $u$ equals 8 over $V$ cubed. That is the end of the chain.'
        doodle_do: [{id: chain, op: label, part: ub, text: '8 ÷ V³'}]
        write: '$\therefore\ u = \dfrac{8}{V^{3}}$'
      - section: 'Check'
        say: 'To check, when $V$ is 2, 8 over 2 cubed is 8 over 8, which is 1. That is the given value.'
        write: 'Check $V = 2$: $\ u = \dfrac{8}{2^{3}} = \dfrac{8}{8} = 1\ \checkmark$'
      - say: 'So $u$ equals 8 over $V$ cubed, which is option E.'
        write: '$u = \dfrac{8}{V^{3}}$'
        answer: true
    traps:
      A: 'You went for $u = 8V^3$. That forgets that the first link is inverse. As $V$ grows, $w$ shrinks, so $u$ shrinks too. Also, at $V = 2$ it gives 64, not 1.'
      B: 'You went for $u = 2\sqrt{V}$. At $V = 2$ that gives 2 root 2, not 1. Substituting $w = k_1$ over $V$ into $u = k_2w^3$ gives $u$ equals a constant over $V$ cubed.'
      C: 'You went for $V = 8$ over $u^2$. Test it. When $u = 1$ it gives $V = 8$, not 2. The chain gives $u$ equals a constant over $V$ cubed, and the constant is 8.'
      D: 'You went for $V = 8u^2$. When $u = 1$ it gives $V = 8$, not 2. The correct link has $V$ cubed, from $w$ being cubed, so $u$ equals 8 over $V$ cubed.'
  24:
    moments:
      - section: 'The question'
        say: 'We have one curve and one straight line. We want the values of $x$ where they meet. Watch out, because the options mix $x$ values with $y$ values.'
        write: '$x^{2} + y - 8 = 0$ and $y + 5x - 2 = 0$'
        doodle: {name: 'custom:1983_q24_a', id: graph, caption: 'a curve and a line meet twice'}
      - section: 'Solution'
        say: 'One equation is linear, and one is quadratic. We use substitution, so make $y$ the subject of the linear one, and put it into the quadratic.'
        write: 'Solution'
      - say: 'Number the equations. The quadratic is equation one.'
        write: '$x^{2} + y - 8 = 0 \quad \text{......(1)}$'
      - say: 'The straight line is equation two.'
        write: '$y + 5x - 2 = 0 \quad \text{......(2)}$'
      - say: 'From equation two, subtract $5x$ from both sides and add 2. Call it equation three.'
        write: 'From (2): $y = 2 - 5x \quad \text{......(3)}$'
        doodle_do:
          - {id: graph, op: highlight, part: line}
      - say: 'Substitute equation three in equation one. That is, put $2 - 5x$ in place of $y$, in brackets.'
        write: 'Substitute (3) in (1):'
      - say: '$x$ squared, plus bracket 2 minus $5x$, minus 8, equals zero.'
        write: '$x^{2} + (2 - 5x) - 8 = 0$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '2−5x'}, at: '(2−5x)', text: 'in for y'}
      - say: 'Open the bracket and collect like terms, so 2 minus 8 is negative 6.'
        write: '$x^{2} - 5x - 6 = 0$'
      - section: 'Factorise'
        say: 'Here $a$ is 1, $b$ is negative 5 and $c$ is negative 6. The product is $ac$, negative 6. The sum is $b$, negative 5.'
        write: 'Product $= ac = -6$, Sum $= b = -5$'
      - say: 'Negative 6 and plus 1 work, because negative 6 times 1 is negative 6, and negative 6 plus 1 is negative 5.'
        write: 'Factors: $-6$ and $+1$'
      - say: 'Replace the middle term, negative $5x$, with negative $6x$ plus $x$.'
        write: '$x^{2} - 6x + x - 6 = 0$'
      - say: 'Group in pairs. From the first pair take out $x$, and from the second take out 1. Both brackets are $x$ minus 6.'
        write: '$x(x - 6) + 1(x - 6) = 0$'
      - say: 'Take out the common bracket, $x$ minus 6. What is left is $x$ plus 1.'
        write: '$(x - 6)(x + 1) = 0$'
      - say: 'Either the first bracket is zero or the second one is.'
        write: 'Either $x - 6 = 0$ or $x + 1 = 0$'
      - say: 'Therefore $x$ equals 6 or $x$ equals negative 1. Those are the two meeting points.'
        write: '$\therefore x = 6$ or $x = -1$'
        doodle_do:
          - {id: graph, op: label, part: p1, text: 'x = −1'}
          - {id: graph, op: label, part: p2, text: 'x = 6'}
      - section: 'Check'
        say: 'When $x$ is 6, equation three gives $y$ equals 2 minus 30, which is negative 28. In equation one, 36 minus 28 minus 8 is zero.'
        write: '$x = 6$: $y = -28$; $36 - 28 - 8 = 0\ \checkmark$'
      - say: 'When $x$ is negative 1, $y$ is 2 plus 5, which is 7. In equation one, 1 plus 7 minus 8 is zero.'
        write: '$x = -1$: $y = 7$; $1 + 7 - 8 = 0\ \checkmark$'
      - say: 'The question asks for $x$ only. So $x$ is 6 or negative 1, and that is option C.'
        write: '$\therefore x = 6, -1$ (C)'
        answer: true
    traps:
      A: 'You went for negative 28 and 7. Those are the $y$ values that go with each solution. The question asks for $x$, which is 6 or negative 1.'
      B: 'You went for 6 and negative 28. That is the $x$ and $y$ of one meeting point. The question wants both values of $x$, which are 6 and negative 1.'
      D: 'You went for negative 1 and 7. That is the $x$ and $y$ of one meeting point. The two values of $x$ are 6 and negative 1.'
      E: 'You went for 3 and 2. Put $x$ equals 3 in equation three and $y$ is negative 13, but then 9 minus 13 minus 8 is not zero. Solving $x^2 - 5x - 6 = 0$ gives 6 and negative 1.'
  25:
    moments:
      - section: 'The question'
        say: 'The table gives values of $y = x^3 - x + 3$ for $x$ from negative 2 to 3. Only the value at $x$ equals negative 2 is missing.'
        write: 'Missing: $y$ when $x = -2$'
      - section: 'Solution'
        say: 'Solution. Write the rule first, exactly as the table gives it.'
        write: 'Solution. $y = x^{3} - x + 3$'
      - say: 'Substitute $x$ equals negative 2, and keep it in brackets so the signs stay safe. Picture the rule as a machine, and negative 2 goes in.'
        doodle: {name: 'custom:1983_q25_a', id: machine, caption: 'the rule is a machine'}
        write: 'When $x = -2$: $y = (-2)^{3} - (-2) + 3$'
      - say: 'For negative 2 cubed, negative 2 times negative 2 is 4, and 4 times negative 2 is negative 8. An odd power of a negative number stays negative.'
        write: '$(-2)^{3} = (-2)(-2)(-2) = -8$'
        doodle_do: [{id: machine, op: label, part: machine, text: '(−2)³ = −8'}]
      - say: 'And minus negative 2 is plus 2, because two minus signs together make a plus.'
        write: '$-(-2) = +2$'
      - say: 'Put the two back into the line for $y$, and we have negative 8, plus 2, plus 3.'
        write: '$y = -8 + 2 + 3$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '=−8'}, at: '−8'}
          - {line: 5, kind: move, from: {line: 4, at: '+2'}, at: '+2'}
      - say: 'Negative 8 plus 2 is negative 6, and negative 6 plus 3 is negative 3. That is what comes out.'
        write: '$= -6 + 3 = -3$'
        doodle_do: [{id: machine, op: label, part: output, text: '−3'}]
      - section: 'Check'
        say: 'Check that the rule really fits the table. At $x$ equals 2, we get 8, minus 2, plus 3, which is 9, as the table gives.'
        write: 'Check: $x = 2$: $2^{3} - 2 + 3 = 8 - 2 + 3 = 9$ ✓'
      - say: 'At $x$ equals negative 1, we get negative 1, plus 1, plus 3, which is 3, as the table gives.'
        write: '$x = -1$: $(-1)^{3} - (-1) + 3 = -1 + 1 + 3 = 3$ ✓'
      - section: 'Answer'
        say: 'Therefore the missing value is negative 3, which is answer choice A.'
        write: '$\therefore$ missing value $= -3$ (A)'
        answer: true
    traps:
      B: 'You went for 3. That is the value at $x = -1$, 0 and 1, but at $x = -2$ the cube takes over. Negative 8 plus 2 plus 3 is negative 3.'
      C: 'You went for negative 9. Take the signs one at a time. Negative 2 cubed is negative 8, minus negative 2 is plus 2, and then plus 3. Negative 8 plus 2 plus 3 is negative 3.'
      D: 'You went for 13. That treats negative 2 cubed as positive 8, so 8 plus 2 plus 3 is 13. An odd power of a negative number stays negative, so it is negative 8, and the answer is negative 3.'
      E: 'You went for 9. That is the value at $x = 2$. At $x = -2$ the cube is negative 8, and negative 8 plus 2 plus 3 is negative 3.'
  26:
    moments:
      - section: 'The question'
        say: 'The angle at the centre is twice the angle at the circumference. But twice 130 is 260, and the $x$ in the figure is clearly smaller. Which angle at $O$ is it?'
        write: 'Angle at circumference $= 130^{\circ}$, $x = ?$'
        point:
          - {figure: 0, kind: circle, target: '130°', text: 'at circumference'}
          - {figure: 0, kind: circle, target: x, text: 'at centre'}
      - section: 'Solution'
        say: 'Solution. Look at which arc the 130 degree angle stands on. Its arms open upwards, so it stands on the big arc round the top of the circle.'
        write: 'Solution'
        point:
          - {figure: 0, kind: circle, target: '130°'}
          - {figure: 0, kind: arrow, target: {x: 120, y: 30}, text: 'upper arc'}
      - say: 'The angle at $O$ facing that same upper arc is the reflex angle, round the top of $O$. It is twice 130, because the angle at centre is twice the angle at circumference.'
        write: 'Reflex $\angle O = 2 \times 130^{\circ}$ ($\angle$ at centre $= 2 \times \angle$ at circumference)'
        point:
          - {figure: 0, kind: circle, target: O, text: 'reflex angle'}
      - say: '2 times 130 is 260. The reflex angle at $O$ is 260 degrees.'
        write: 'Reflex $\angle O = 260^{\circ}$'
        point:
          - {figure: 0, kind: label, target: O, text: '260° round the top'}
      - say: '$x$ and the reflex angle together make the full turn at $O$, because of angles at a point.'
        write: '$x + 260^{\circ} = 360^{\circ}$ ($\angle$s at a point)'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '=260∘'}, at: '260∘', text: 'from here'}
      - say: 'Take 260 to the other side, and we get 360 minus 260.'
        write: '$x = 360^{\circ} - 260^{\circ}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '+260∘'}, at: '−260∘', text: 'across'}
      - say: '360 minus 260 is 100. So $x$ is 100 degrees.'
        write: '$x = 100^{\circ}$'
        point:
          - {figure: 0, kind: circle, target: x, text: '100°'}
      - section: 'Check'
        say: 'Check another way. Pick a point on the upper arc. With the 130 degree point, it makes a cyclic quadrilateral, so its angle is 180 minus 130, by opposite angles of a cyclic quadrilateral.'
        write: '$180^{\circ} - 130^{\circ} = 50^{\circ}$ (opp. $\angle$s of cyclic quad.)'
        point:
          - {figure: 0, kind: label, target: {x: 120, y: 30}, text: '50° here'}
      - say: 'That 50 degrees stands on the lower arc, the same arc as $x$. Twice 50 is 100. It agrees.'
        write: '$x = 2 \times 50^{\circ} = 100^{\circ}\ \checkmark$'
      - say: 'Therefore $x$ is 100, option C.'
        write: '$\therefore x = 100^{\circ}$ (C)'
        answer: true
    traps:
      A: 'You went for 50. That is the angle at the circumference on the other arc. The angle at the centre on the same arc as $x$ is twice that, which is 100.'
      B: 'You went for 260. That is the reflex angle at $O$, round the top. The angle $x$ marked in the diagram is on the other side, so it is 360 minus 260, which is 100.'
      D: 'You went for 65, half of 130. The rule goes the other way. The angle at the centre is twice the angle at the circumference. Twice 130 is the reflex 260, so $x$ is 100.'
      E: 'You went for 130. That is the angle at the circumference. The angle at the centre on the same arc is twice it, which is 260, and $x$ is the rest of the full turn, which is 100.'
  27:
    moments:
      - section: 'The question'
        say: 'Five items with frequencies 6, 10, 14, 16 and 26 go on a pie chart. We want the angle of every sector.'
        write: 'Data: $6,\ 10,\ 14,\ 16,\ 26$. Find the sectoral angles.'
      - section: 'Solution'
        say: 'Solution. Draw the table with each item, its frequency f, and its sectoral angle. The whole circle, 360 degrees, stands for the total frequency.'
        write: 'Sectoral angle $= \dfrac{f}{\Sigma f} \times 360^{\circ}$'
        diagram: {id: t, kind: table, columns: [Item, 'Frequency (f)', 'f/Σf × 360°', 'Angle'], rows: [[A, 6, '', ''], [B, 10, '', ''], [C, 14, '', ''], [D, 16, '', ''], [E, 26, '', ''], [Total, '', '', '']]}
      - say: 'First the total frequency, sigma f. 6 plus 10 is 16, plus 14 is 30, plus 16 is 46, plus 26 is 72.'
        write: '$\Sigma f = 6 + 10 + 14 + 16 + 26 = 72$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:6,2', text: '72', 'on': '72'}
      - section: 'The sectoral angles'
        say: 'For item A, we have 6 over 72, times 360. 360 divided by 72 is 5, and 6 times 5 is 30 degrees.'
        write: 'A: $\dfrac{6}{72} \times 360^{\circ} = 30^{\circ}$'
        diagram: {id: p, kind: pie, show: angle, sectors: [{label: A, value: 6, later: true}, {label: B, value: 10, later: true}, {label: C, value: 14, later: true}, {label: D, value: 16, later: true}, {label: E, value: 26, later: true}]}
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,3', text: '6/72 × 360°'}
          - {id: t, op: fill, part: 'cell:1,4', text: '30°', 'on': '30 degrees'}
          - {id: p, op: draw-sector, 'on': '30 degrees'}
      - say: 'For item B, we have 10 over 72, times 360. 10 times 5 is 50 degrees.'
        write: 'B: $\dfrac{10}{72} \times 360^{\circ} = 50^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:2,3', text: '10/72 × 360°'}
          - {id: t, op: fill, part: 'cell:2,4', text: '50°', 'on': '50 degrees'}
          - {id: p, op: draw-sector, 'on': '50 degrees'}
      - say: 'Item C is 14 over 72, times 360. 14 times 5 is 70 degrees.'
        write: 'C: $\dfrac{14}{72} \times 360^{\circ} = 70^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:3,3', text: '14/72 × 360°'}
          - {id: t, op: fill, part: 'cell:3,4', text: '70°', 'on': '70 degrees'}
          - {id: p, op: draw-sector, 'on': '70 degrees'}
      - say: 'Item D is 16 over 72, times 360. 16 times 5 is 80 degrees.'
        write: 'D: $\dfrac{16}{72} \times 360^{\circ} = 80^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,3', text: '16/72 × 360°'}
          - {id: t, op: fill, part: 'cell:4,4', text: '80°', 'on': '80 degrees'}
          - {id: p, op: draw-sector, 'on': '80 degrees'}
      - say: 'And item E is 26 over 72, times 360. 26 times 5 is 130 degrees.'
        write: 'E: $\dfrac{26}{72} \times 360^{\circ} = 130^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:5,3', text: '26/72 × 360°'}
          - {id: t, op: fill, part: 'cell:5,4', text: '130°', 'on': '130 degrees'}
          - {id: p, op: draw-sector, 'on': '130 degrees'}
      - section: 'Check'
        say: 'Check the total row, because the angles must make a full turn. 30 plus 50 plus 70 plus 80 plus 130 is 360 degrees. The pie is full.'
        write: '$30 + 50 + 70 + 80 + 130 = 360^{\circ}\ \checkmark$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:6,4', text: '360°', 'on': '360 degrees'}
      - section: 'Answer'
        say: 'Therefore the angles are 30, 50, 70, 80 and 130 degrees, which is answer choice D.'
        write: '$\therefore 30^{\circ},\ 50^{\circ},\ 70^{\circ},\ 80^{\circ},\ 130^{\circ}$'
        answer: true
    traps:
      A: 'You went for 15, 25, 35, 40 and 65. Those add up to only 180 degrees, half a circle. Each angle is f over 72, times 360, so A is 6 over 72 of 360, which is 30 degrees.'
      B: 'You went for 60, 100, 140, 160 and 260. Those add up to 720 degrees, two full turns. Each angle is f over 72, times 360, so A is 30 degrees.'
      C: 'You went for 6, 10, 14, 16 and 26 degrees. That copies the frequencies as angles, and they add up to only 72. Each angle is f over 72, times 360.'
      E: 'You went for none of the above. But D works, because the angles 30, 50, 70, 80 and 130 add up to exactly 360 degrees.'
  28:
    moments:
      - section: 'The question'
        say: 'We have sixteen test scores, with lots of repeats. We want the median plus the mode. With so many repeats, a frequency table makes both easy.'
        write: 'Scores: $65, 65, 55, 60, 60, 65, 60, 70, 75, 70, 65, 70, 60, 65, 65, 70$'
      - section: 'Solution'
        say: 'Solution. Make a table with $x$, the score, in order of size, and $f$, its frequency, which is the number of times it appears. We add a cf column for the median.'
        write: 'Solution'
        diagram:
          id: t
          kind: table
          columns: ['x', 'f', 'cf']
          rows: [[55, '', ''], [60, '', ''], [65, '', ''], [70, '', ''], [75, '', '']]
          'on': 'table'
      - say: 'Count each score in the list. 55 appears once. 60 appears 4 times. 65 appears 6 times.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,2', text: '1'}
          - {id: t, op: fill, part: 'cell:2,2', text: '4'}
          - {id: t, op: fill, part: 'cell:3,2', text: '6'}
      - say: '70 appears 4 times, and 75 once. Add down the $f$ column, so 1 plus 4 plus 6 plus 4 plus 1 is 16, all the students.'
        write: '$\sum f = 16$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,2', text: '4'}
          - {id: t, op: fill, part: 'cell:5,2', text: '1'}
          - {id: t, op: total, part: 'col:2', 'on': 'Add'}
      - section: 'The mode'
        say: 'The mode is the value with the highest frequency. The highest $f$ is 6, for the score 65, which is the tallest pile of counters.'
        write: 'Mode $= 65$ (highest frequency, 6)'
        diagram_do:
          - {id: t, op: highlight, part: 'row:3', text: 'highest f', 'on': 'highest'}
        doodle: {name: 'custom:1983_q28_a', id: piles, caption: 'one counter per student', 'on': 'pile'}
        doodle_do:
          - {id: piles, op: circle, part: s65, text: 'mode', 'on': 'tallest'}
      - section: 'The median'
        say: 'Now the cf column, the cumulative frequency, which is a running total of $f$ down the table. It goes 1, then 5, 11, 15 and 16.'
        diagram_do:
          - {id: t, op: total, part: 'col:2', into: 'col:3', 'on': 'running'}
      - say: '$n$ is 16, an even number. So the median is the average of the $n$ over 2th value, the 8th, and the one after it, the 9th.'
        write: '$\dfrac{n}{2} = \dfrac{16}{2} = 8$: the 8th and 9th values'
      - say: 'Go down the cf column to the first cf that reaches 9. 5 is too small, but 11 is enough. So the 6th to the 11th values are all 65, and the 8th and 9th are both 65.'
        write: '8th and 9th values: $x = 65$ (cf $= 11$)'
        diagram_do:
          - {id: t, op: highlight, part: 'row:3', text: '6th to 11th', 'on': '11', on_nth: 1}
      - say: 'The average of 65 and 65 is 65.'
        write: 'Median $= \dfrac{65 + 65}{2} = 65$'
      - say: 'The question wants the median plus the mode, so 65 plus 65, which is 130.'
        write: 'Median $+$ mode $= 65 + 65 = 130$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '65=[[65]]'}, at: '[[65]]+65', text: 'median'}
          - {line: 9, kind: move, from: {line: 4, at: '=[[65]]'}, at: '65+[[65]]', text: 'mode'}
      - section: 'Check'
        say: 'Check the middle. Below 65 there are 1 plus 4, which is 5 scores, and above 65 there are 4 plus 1, which is 5. The two sides are equal, so 65 is the middle.'
        write: 'Check: below 65: $1 + 4 = 5$; above 65: $4 + 1 = 5$ ✓'
      - section: 'Answer'
        say: 'So the median plus the mode is 130, which is option B.'
        write: '$\therefore$ Median $+$ mode $= 130$'
        answer: true
    traps:
      A: 'You went for 125. That is 60 plus 65, as if the median were 60. The cf column shows the 6th to the 11th values are all 65, so the 8th and 9th are 65, and 65 plus 65 is 130.'
      C: 'You went for 140. That is 70 plus 70. But the highest frequency is 6, for 65, so the mode is 65, and the median is also 65. The sum is 130.'
      D: 'You went for 150. That would need both the median and the mode to be 75, the top score, which appears only once. Both are 65, so the sum is 130.'
      E: 'You went for 137.5. That takes the 8th and 9th scores from the list before arranging it, 70 and 75. Arrange in order of size first, and then the 8th and 9th are both 65.'
  29:
    moments:
      - section: 'The question'
        say: 'The letters of MATRICULATION are cut out and put in a box, and one is drawn at random. What is the probability of a vowel? Be careful, because a letter that appears twice is two slips.'
        write: 'MATRICULATION: $P(\text{vowel}) = ?$'
        doodle: {name: 'custom:1983_q29_a', id: box, caption: 'MATRICULATION: 13 letters in a box'}
      - say: 'Solution. Let $E$ be the event that a vowel is drawn.'
        write: 'Solution: let $E$ = a vowel is drawn'
      - section: 'The sample space'
        say: 'The sample space is every slip in the box. Spell the word out, letter by letter, as M, A, T, R, I, C, U, L, A, T, I, O and N.'
        write: 'Letters: M, A, T, R, I, C, U, L, A, T, I, O, N'
      - say: 'Count them, and we get 13 slips. So n of $S$, the number of possible outcomes, is 13.'
        write: '$n(S) = 13$'
        doodle_do:
          - {id: box, op: label, part: box, text: '13 slips'}
      - section: 'The favourable outcomes'
        say: 'The vowels are A, E, I, O and U. Pick out every vowel slip in the word, in order, and we get A, I, U, A, I and O.'
        write: 'Vowels: A, I, U, A, I, O'
      - say: 'A and I each appear twice, and each copy is its own slip. So n of $E$ is 2 plus 2 plus 1 plus 1, which is 6.'
        write: '$n(E) = 2 + 2 + 1 + 1 = 6$'
        doodle_do:
          - {id: box, op: label, part: slips, text: '6 vowel slips'}
      - section: 'The probability'
        say: 'The probability of $E$ is n of $E$ over n of $S$, which is the number of favourable outcomes over the total number of possible outcomes.'
        write: '$P(E) = \dfrac{n(E)}{n(S)}$'
      - say: 'Now substitute, and we get 6 vowels over 13 letters.'
        write: '$= \dfrac{6}{13}$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '= 6'}, at: '13[[6]]', text: 'n(E)'}
          - {line: 7, kind: move, from: {line: 3, at: '= 13'}, at: '[[13]]6', text: 'n(S)'}
      - section: 'Check'
        say: 'Check with the consonants, which are M, T, R, C, L, T and N. That is 7 slips, and 6 plus 7 is 13, every slip counted once.'
        write: 'Check: 7 consonants, $\ 6 + 7 = 13\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the probability of drawing a vowel is 6 over 13, which is option C.'
        write: '$\therefore P(\text{vowel}) = \dfrac{6}{13}$'
        doodle_do:
          - {id: box, op: circle, part: drawn}
        answer: true
    traps:
      A: 'You went for 2 over 13. That counts only the vowels that repeat, A and I. n of E counts every vowel slip, which means A, I, U, A, I and O, and that is 6.'
      B: 'You went for 5 over 13. One vowel slip was missed. List them in order, and you get A, I, U, A, I and O. n of E is 6.'
      D: 'You went for 8 over 13. That is too many, because some consonants were counted as vowels. Only A, E, I, O and U are vowels, and the word has 6 of them.'
      E: 'You went for 4 over 13. That counts each kind of vowel once, which is A, I, U and O. But each letter is its own slip, so the second A and the second I count too, and n of E is 6.'
  30:
    moments:
      - section: 'The question'
        say: 'Four options differ only in the last digit, 4.46, 4.47, 4.48 and 4.49. So every rounding must be done exactly as the question says, in the right order.'
        write: 'Correct $59.81789$ and $0.0746829$ to 3 s.f., multiply, give 3 s.f.'
      - say: 'The rule for significant figures is to start counting at the first digit that is not zero. Mark a cut after the figures you keep, and look at the next digit.'
        write: 'Solution'
      - say: 'If the next digit is 5 or more, add 1 to the last digit you keep. If it is less than 5, leave the last digit as it is.'
        write: 'Next digit $\ge 5$: add 1. Next digit $< 5$: leave it.'
      - section: 'Round each number'
        say: 'In 59.81789, the first three significant figures are 5, 9 and 8. Cut after the 8. The next digit is 1, which is less than 5, so the 8 stays.'
        write: '$59.8|1789 \approx 59.8$ (3 s.f.)'
      - say: 'In 0.0746829, the zeros in front do not count. The first three significant figures are 7, 4 and 6. The next digit is 8, so add 1, and the 6 becomes 7.'
        write: '$0.0746|829 \approx 0.0747$ (3 s.f.)'
      - section: 'Multiply'
        say: 'Now multiply the two rounded numbers.'
        write: 'Product $= 59.8 \times 0.0747$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '≈ 59.8'}, at: '59.8'}
          - {line: 5, kind: move, from: {line: 4, at: '≈ 0.0747'}, at: '0.0747'}
      - say: 'Multiply 598 by 747, leaving out the points. 598 times 7 is 4,186. 598 times 40 is 23,920, and 598 times 700 is 418,600. Add them and we get 446,706.'
        write: '$\begin{array}{r} 598 \\ \times\ \ 747 \\ \hline 4186 \\ 23920 \\ 418600 \\ \hline 446706 \end{array}$'
      - say: 'Now the points. 59.8 has 1 decimal place and 0.0747 has 4, so the product has 5 decimal places.'
        write: '$59.8 \times 0.0747 = 4.46706$'
      - section: 'Round the answer'
        say: 'Round to 3 significant figures, which are 4, 4 and 6. Cut after the 6. The next digit is 7, which is 5 or more, so the 6 becomes 7.'
        write: '$4.46|706 \approx 4.47$ (3 s.f.)'
      - section: 'Check'
        say: 'Check the size. 60 times 0.075 is 4.5, which is close to our 4.47. The answer is the right size.'
        write: 'Check: $60 \times 0.075 = 4.5 \approx 4.47 \ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the answer, to 3 significant figures, is 4.47, which is option C.'
        write: '$\therefore$ Product $= 4.47$ (3 s.f.)'
        answer: true
    traps:
      A: 'You went for 4.46. That cuts off 4.46706 without rounding. The next digit after the cut is 7, which is 5 or more, so add 1 to get 4.47.'
      B: 'You went for 4.48. That comes from rounding 0.0746829 to 0.0748. Only the digit straight after the cut counts. After 7, 4 and 6 comes 8, so the 6 becomes 7, giving 0.0747.'
      D: 'You went for 4.49. Rounding gives 59.8 and 0.0747, and 59.8 times 0.0747 is 4.46706, which is 4.47 to 3 significant figures.'
      E: 'You went for 4.50. That rounds to too few figures. 4.46706 to 3 significant figures is 4.47.'
  31:
    moments:
      - section: 'The question'
        say: 'A rod that is really 250 cm long is measured as 255 cm. Is the error 5 percent? Many students think so. Let''s see what the percentage error really is.'
        write: 'Actual length $= 250$ cm, measured length $= 255$ cm'
      - say: 'We write the formula first. Percentage error is the error divided by the actual value, times 100 percent.'
        write: 'Solution'
      - say: 'Here is the formula. The error is always compared with the actual, true value.'
        write: 'Percentage error $= \dfrac{\text{error}}{\text{actual value}} \times 100\%$'
      - section: 'Find the error'
        say: 'The error is the difference between the measured value and the actual value, so 255 minus 250, which is 5 cm.'
        write: 'Error $= 255 - 250 = 5$ cm'
      - section: 'Substitute'
        say: 'Now substitute. The error, 5, goes on top. The actual value, 250, goes underneath.'
        write: 'Percentage error $= \dfrac{5}{250} \times 100\%$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= [[5]] cm'}, at: '250[[5]]', text: 'error'}
          - {line: 4, kind: move, from: {line: 0, at: '[[250]] cm'}, at: '[[250]]5', text: 'actual value'}
      - say: 'Cancel first. 5 goes into 5 once, and into 250 fifty times. So 5 over 250 is 1 over 50.'
        write: '$= \dfrac{1}{50} \times 100\%$'
      - say: '100 divided by 50 is 2.'
        write: '$= 2\%$'
      - say: 'Therefore the percentage error is 2 percent.'
        write: '$\therefore$ Percentage error $= 2\%$'
      - section: 'Check'
        say: 'To check, 1 percent of 250 cm is 2.5 cm, and our error of 5 cm is 2 times 2.5. So the error is 2 percent.'
        write: 'Check: $1\%$ of $250 = 2.5$, and $5 = 2 \times 2.5 \ \checkmark$'
      - section: 'Answer'
        say: 'So the percentage error is 2, which is option E.'
        write: '$\therefore$ Percentage error $= 2\%$'
        answer: true
    traps:
      A: 'You went for 55. That looks like the end of 255, not a calculation. The error is 5 cm, and 5 over 250, times 100 percent, is 2 percent.'
      B: 'You went for 10. That is five times too big. The error is 5 cm out of an actual 250 cm, and 5 over 250 times 100 percent is 2 percent.'
      C: 'You went for 5. That is the error in centimetres, not a percentage. Divide it by the actual length and multiply by 100, so 5 over 250 times 100 is 2.'
      D: 'You went for 4. That is twice the answer. The error is 255 minus 250, which is 5, and 5 over 250 times 100 percent is 2 percent.'
  32:
    moments:
      - section: 'The question'
        say: 'Two fractions with unknown powers multiply to 256 over 729. The way in is to write every number as a power of 2 or 3, then equate the indices.'
        write: 'If $\left(\tfrac{2}{3}\right)^{m}\left(\tfrac{3}{4}\right)^{n} = \tfrac{256}{729}$, find $m$ and $n$.'
      - say: 'Solution. We change the left side to powers of 2 and 3 first, then the right side.'
        write: 'Solution'
      - section: 'The left side'
        say: 'By the law of indices, a fraction to a power puts the power on the top and on the bottom. So 2 over 3, to the power $m$, is 2 to the $m$ over 3 to the $m$.'
        write: '$\left(\tfrac{2}{3}\right)^{m} = \dfrac{2^{m}}{3^{m}}$ $\quad [(\tfrac{a}{b})^{n} = \tfrac{a^{n}}{b^{n}}]$'
      - say: 'By the same law, 3 over 4, to the power $n$, is 3 to the $n$ over 4 to the $n$.'
        write: '$\left(\tfrac{3}{4}\right)^{n} = \dfrac{3^{n}}{4^{n}}$'
      - say: '4 is not a prime, so write it as 2 squared. A power of a power multiplies the indices, so 2 squared, to the power $n$, is 2 to the power $2n$.'
        write: '$4^{n} = (2^{2})^{n} = 2^{2n}$ $\quad [(a^{m})^{n} = a^{mn}]$'
      - section: 'The right side'
        say: 'Now the right side. Keep doubling from 2, giving 2, 4, 8, 16, 32, 64, 128 and 256. That is eight 2s, so 256 is 2 to the power 8.'
        doodle: {name: 'custom:1983_q32_a', id: towers, caption: 'how many 2s? how many 3s?'}
        write: '$256 = 2^{8}$'
        doodle_do: [{id: towers, op: label, part: twos, text: '8 twos'}]
      - say: 'Keep tripling from 3, giving 3, 9, 27, 81, 243 and 729. That is six 3s, so 729 is 3 to the power 6.'
        write: '$729 = 3^{6}$'
        doodle_do: [{id: towers, op: label, part: threes, text: '6 threes'}]
      - section: 'Same bases'
        say: 'Substitute everything into the equation. The 2s and the 3s are now written as powers.'
        write: '$\dfrac{2^{m}}{3^{m}} \times \dfrac{3^{n}}{2^{2n}} = \dfrac{2^{8}}{3^{6}}$'
      - say: 'The law of indices says that to divide powers of the same base, we subtract the indices. 2 to the $m$ over 2 to the $2n$ is 2 to the $m$ minus $2n$. 3 to the $n$ over 3 to the $m$ is 3 to the $n$ minus $m$.'
        write: '$2^{m - 2n} \times 3^{n - m} = \dfrac{2^{8}}{3^{6}}$ $\quad [a^{m} \div a^{n} = a^{m-n}]$'
      - say: 'On the right, 1 over 3 to the 6 is 3 to the power negative 6, by the negative index law. Now both sides are powers of 2 times powers of 3.'
        write: '$2^{m - 2n} \times 3^{n - m} = 2^{8} \times 3^{-6}$ $\quad [\tfrac{1}{a^{n}} = a^{-n}]$'
      - section: 'Equate the indices'
        say: 'The bases are the same, so equate the indices. For base 2, $m$ minus $2n$ equals 8. Call it equation 1.'
        write: 'Equating the indices of 2: $m - 2n = 8 \quad \ldots (1)$'
        point:
          - {line: 9, kind: circle, at: '2m−2n'}
          - {line: 9, kind: circle, at: '28'}
      - say: 'For base 3, $n$ minus $m$ equals negative 6. Call it equation 2.'
        write: 'Equating the indices of 3: $n - m = -6 \quad \ldots (2)$'
        point:
          - {line: 9, kind: circle, at: '3n−m'}
          - {line: 9, kind: circle, at: '3−6'}
      - section: 'Solve'
        say: 'Add equation 1 and equation 2, so the $m$ terms cancel. Negative $2n$ plus $n$ is negative $n$, and 8 plus negative 6 is 2.'
        write: '(1) $+$ (2): $-n = 2$'
      - say: 'Divide both sides by negative 1.'
        write: '$\therefore n = -2$'
      - say: 'Substitute $n$ equals negative 2 into equation 2.'
        write: 'Substitute $n = -2$ in (2): $-2 - m = -6$'
      - say: 'Add 2 to both sides, so negative 6 plus 2 is negative 4.'
        write: '$-m = -6 + 2 = -4$'
      - say: 'Divide both sides by negative 1.'
        write: '$\therefore m = 4$'
      - section: 'Check'
        say: 'Check in the question. 2 over 3 to the 4 is 16 over 81. A negative index means the reciprocal, so 3 over 4 to the negative 2 is 4 over 3, squared, which is 16 over 9.'
        write: 'Check: $\left(\tfrac{2}{3}\right)^{4} \times \left(\tfrac{3}{4}\right)^{-2} = \tfrac{16}{81} \times \tfrac{16}{9}$'
      - say: '16 times 16 is 256, and 81 times 9 is 729. That is the right side.'
        write: '$= \tfrac{256}{729}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore $m$ is 4 and $n$ is negative 2, which is option D.'
        write: '$\therefore m = 4,\ n = -2$'
        answer: true
    traps:
      A: 'You went for $m = 4$ and $n = 2$. The sign of $n$ was lost. Equating the indices of 2 gives $m - 2n = 8$, and with $m = 4$ that needs $n = -2$. The negative index turns 3 over 4 into 4 over 3.'
      B: 'You went for $m = -4$ and $n = -2$. With $m = -4$, 2 over 3 becomes 3 over 2 and the product is more than 1, but 256 over 729 is less than 1. Equation 2, $n - m = -6$, gives $m = 4$.'
      C: 'You went for $m = -4$ and $n = 2$. Both signs are reversed, and that gives 729 over 256, the fraction upside down. Equating the indices gives $m = 4$ and $n = -2$.'
      E: 'You went for $m = -2$ and $n = 4$. Test it in equation 1, $m - 2n = 8$. Negative 2 minus 8 is negative 10, not 8. The solution is $m = 4$ and $n = -2$.'
  33:
    moments:
      - section: 'The question'
        say: 'We have two logs to base 7, and no tables. One of them is negative. Change each log into index form, and the powers will show us.'
        write: 'Evaluate $\log_{7}49 + \log_{7}\tfrac{1}{7}$'
      - say: 'Solution. We find the two logs one at a time, then add them.'
        write: 'Solution'
      - section: 'Index form'
        say: 'Recall the meaning of a logarithm. Log base $a$ of $N$ equals $x$ means $a$ to the power $x$ equals $N$. Picture the powers of 7 as a staircase, where each step up multiplies by 7.'
        doodle: {name: 'custom:1983_q33_a', id: steps, caption: 'each step up is ×7'}
        write: 'Recall: $\log_{a}N = x$ means $a^{x} = N$'
      - section: 'The first log'
        say: 'Let log base 7 of 49 be $x$. In index form, 7 to the power $x$ equals 49.'
        write: 'Let $\log_{7}49 = x \Rightarrow 7^{x} = 49$'
      - say: 'Write 49 as a power of 7. 7 times 7 is 49, so 49 is 7 squared. Now both sides have base 7, which is two steps up the stairs.'
        doodle_do: [{id: steps, op: circle, part: st3}]
        write: '$7^{x} = 7^{2}$'
      - say: 'Since the bases are the same, equate the indices. So $x$ is 2.'
        write: '$\therefore x = 2$'
      - section: 'The second log'
        say: 'Let log base 7 of 1 over 7 be $y$. In index form, 7 to the power $y$ equals 1 over 7.'
        write: 'Let $\log_{7}\tfrac{1}{7} = y \Rightarrow 7^{y} = \tfrac{1}{7}$'
      - say: 'The law of indices for a negative index says $a$ to the minus $n$ is 1 over $a$ to the $n$. So 1 over 7 is 7 to the power minus 1, which is one step down the stairs.'
        doodle_do: [{id: steps, op: circle, part: st0}]
        write: '$7^{y} = 7^{-1}$ $\quad [a^{-n} = \tfrac{1}{a^{n}}]$'
      - say: 'The bases are the same, so equate the indices. $y$ is minus 1.'
        write: '$\therefore y = -1$'
      - section: 'Put them together'
        say: 'Now put the two values back into the expression, giving 2, plus minus 1.'
        write: '$\log_{7}49 + \log_{7}\tfrac{1}{7} = 2 + (-1)$'
      - say: '2 plus minus 1 is 2 minus 1, which is 1.'
        write: '$= 1$'
      - section: 'Check'
        say: 'Check with the product law of logarithms, which says adding two logs to the same base gives the log of the product. 49 times 1 over 7 is 7, and log base 7 of 7 is 1. It agrees.'
        doodle_do: [{id: steps, op: pulse, part: st2}]
        write: 'Check: $\log_{7}\left(49 \times \tfrac{1}{7}\right) = \log_{7}7 = 1\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the value is 1, which is option A.'
        write: '$\therefore \log_{7}49 + \log_{7}\tfrac{1}{7} = 1$'
        answer: true
    traps:
      B: 'You went for 2. That is only log base 7 of 49. We still add log base 7 of 1 over 7, which is minus 1, so the total is 1.'
      C: 'You went for 3. That takes log base 7 of 1 over 7 as plus 1. But 1 over 7 is 7 to the power minus 1, so its log is minus 1, and 2 plus minus 1 is 1.'
      D: 'You went for 7. 49 times 1 over 7 is indeed 7, but the question wants the log of it. Log base 7 of 7 is 1.'
      E: 'You went for 0. The two logs do not cancel. Log base 7 of 49 is 2, and log base 7 of 1 over 7 is minus 1. Together they make 1.'
  34:
    moments:
      - section: 'The question'
        say: 'Factorise completely. Fourth powers are a clue that this factorises more than once, and "completely" means we keep going until nothing more factorises.'
        write: '$81a^{4} - 16b^{4}$'
      - section: 'Solution'
        say: 'Both terms are perfect squares, with a minus between them. That is a difference of two squares. Write the rule first.'
        write: 'Solution'
      - say: 'The rule is that $p$ squared minus $q$ squared equals $p$ minus $q$, times $p$ plus $q$.'
        write: '$p^{2} - q^{2} = (p - q)(p + q)$'
      - say: '81 is 9 squared and $a$ to the 4 is $a$ squared, squared. So $81a^4$ is $9a^2$, all squared.'
        write: '$81a^{4} = (9a^{2})^{2}$'
      - say: '16 is 4 squared and $b$ to the 4 is $b$ squared, squared. So $16b^4$ is $4b^2$, all squared.'
        write: '$16b^{4} = (4b^{2})^{2}$'
      - say: 'So our expression is one square minus another. Picture a big square with a small square taken out.'
        write: '$81a^{4} - 16b^{4} = (9a^{2})^{2} - (4b^{2})^{2}$'
        doodle: {name: 'custom:1983_q34_a', id: squares, caption: 'square minus square'}
      - say: 'Here $p$ is $9a^2$ and $q$ is $4b^2$. By the rule, it is the difference times the sum.'
        write: '$= (9a^{2} - 4b^{2})(9a^{2} + 4b^{2})$'
        doodle_do:
          - {id: squares, op: label, part: big, text: 'p = 9a²'}
          - {id: squares, op: label, part: small, text: 'q = 4b²'}
      - section: 'Keep going'
        say: 'Look at the first bracket. $9a^2$ minus $4b^2$ is $3a$ squared minus $2b$ squared, which is another difference of two squares.'
        write: '$9a^{2} - 4b^{2} = (3a)^{2} - (2b)^{2}$'
        point:
          - {line: 6, kind: underline, at: '(9a2−4b2)', text: 'factorise again'}
      - say: 'By the same rule, it is $3a$ minus $2b$, times $3a$ plus $2b$.'
        write: '$= (3a - 2b)(3a + 2b)$'
      - say: 'The second bracket, $9a^2$ plus $4b^2$, is a sum of two squares. A sum of two squares does not factorise, so it stays.'
        write: '$9a^{2} + 4b^{2}$ does not factorise'
      - say: 'Therefore, put the pieces together.'
        write: '$\therefore (3a - 2b)(3a + 2b)(9a^{2} + 4b^{2})$'
        point:
          - {line: 10, kind: move, from: {line: 8, at: '(3a−2b)(3a+2b)'}, at: '(3a−2b)(3a+2b)', text: 'from here'}
      - section: 'Check'
        say: 'Expand back. $3a$ minus $2b$, times $3a$ plus $2b$, is $9a^2$ minus $4b^2$.'
        write: '$(3a - 2b)(3a + 2b) = 9a^{2} - 4b^{2}$'
      - say: 'Then multiply by the last bracket, so $9a^2$ minus $4b^2$, times $9a^2$ plus $4b^2$.'
        write: '$(9a^{2} - 4b^{2})(9a^{2} + 4b^{2})$'
      - say: 'That is $81a^4$ minus $16b^4$. We are back to the question.'
        write: '$= 81a^{4} - 16b^{4}\ \checkmark$'
      - say: 'So the complete factorisation is option C.'
        write: '$\therefore (3a - 2b)(3a + 2b)(9a^{2} + 4b^{2})$ (C)'
        answer: true
    traps:
      A: 'You went for the option with $2a - 3b$. The letters and numbers have been swapped. The square root of $9a^2$ is $3a$ and of $4b^2$ is $2b$, so the brackets are $3a - 2b$ and $3a + 2b$.'
      B: 'You went for the option with $2a - 3b$ and $4a^2 - 9b^2$. The numbers have been swapped between $a$ and $b$. $81a^4$ is $9a^2$ squared, so the brackets are $3a - 2b$, $3a + 2b$ and $9a^2 + 4b^2$.'
      D: 'You went for $3a - 2b$ times $2a - 3b$. The second bracket should be $3a + 2b$, because a difference of two squares always splits into a minus bracket and a plus bracket with the same terms.'
      E: 'You went for the option ending in $9a^2 - 4b^2$. That bracket is itself a difference of two squares, so it is not completely factorised. The bracket that stays is the sum, $9a^2 + 4b^2$.'
  35:
    moments:
      - section: 'The question'
        say: 'This hexagon is not regular, because it has one big angle of 170 and five equal ones. So 120 is out. We need the angle sum, and one equation.'
        write: 'Hexagon: one $\angle = 170^{\circ}$, five $\angle$s $= x$, $x = ?$'
      - section: 'Solution'
        say: 'Solution. Let me draw the hexagon, with 170 degrees at $A$ and $x$ at each of the other five corners.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '170°', text: 'one angle'}
          - {figure: sketch, kind: arc, target: ABC, text: 'x'}
      - say: 'From one corner, a polygon with $n$ sides cuts into $n$ minus 2 triangles, each 180 degrees. So the interior angles add up to $n$ minus 2, times 180.'
        write: 'Sum of int. $\angle$s $= (n - 2) \times 180^{\circ}$'
      - say: 'A hexagon has 6 sides. Put in $n$ equals 6. 6 minus 2 is 4.'
        write: '$= (6 - 2) \times 180^{\circ} = 4 \times 180^{\circ}$'
      - say: '4 times 180 is 720 degrees.'
        write: '$= 720^{\circ}$'
      - say: 'The six angles are 170 and five angles of $x$. Together they make 720.'
        write: '$170 + 5x = 720$ (sum of int. $\angle$s of polygon)'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '720∘'}, at: '720', text: 'angle sum'}
          - {figure: sketch, kind: circle, target: '170°'}
          - {figure: sketch, kind: arc, target: CDE, text: '5 angles of x'}
      - say: 'Take 170 to the other side. 720 minus 170 is 550.'
        write: '$5x = 720 - 170 = 550$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '170+'}, at: '−170', text: 'across'}
      - say: 'Divide both sides by 5. 550 divided by 5 is 110.'
        write: '$x = \dfrac{550}{5} = 110$'
        point:
          - {figure: sketch, kind: arc, target: DEF, text: '110°'}
      - section: 'Check'
        say: 'To check, 5 times 110 is 550, and 550 plus 170 is 720, which is the angle sum.'
        write: '$170 + 5 \times 110 = 170 + 550 = 720\ \checkmark$'
      - say: 'Every angle, 170 and 110, is less than 180 degrees, so the hexagon is convex, just as the question says.'
        write: '$170^{\circ} < 180^{\circ}$, $110^{\circ} < 180^{\circ}$: convex $\checkmark$'
      - say: 'Therefore each of the other angles is 110 degrees, option B.'
        write: '$\therefore x = 110^{\circ}$ (B)'
        answer: true
    traps:
      A: 'You went for 120 degrees. That is each angle of a regular hexagon. This one is not regular. One angle is 170, so the other five share 720 minus 170, which is 550, giving 110 each.'
      C: 'You went for 105 degrees. Check it. 5 times 105 is 525, and 525 plus 170 is 695, not 720. The five angles share 550, so each is 110.'
      D: 'You went for 102 degrees. Check it. 5 times 102 is 510, and 510 plus 170 is 680, not 720. The angle sum of a hexagon is 720, which gives 110.'
      E: 'You went for 100 degrees. That gives 500 plus 170, which is 670, not 720. Each of the five angles is 550 divided by 5, which is 110.'
  36:
    moments:
      - section: 'The question'
        say: 'We have a tangent, a cyclic quadrilateral and two equal sides. Three circle facts, one after the other, carry the 50 degrees round to angle $QRS$.'
        write: '$PQ = PS$, $\angle TPQ = 50^{\circ}$, $\angle QRS = ?$'
        point:
          - {figure: 0, kind: arc, target: TPQ, text: '50°'}
          - {figure: 0, kind: arc, target: QRS, text: '?'}
      - section: 'Solution'
        say: 'Solution. We work on the diagram, and every angle we find goes on it. Each line gets its reason in brackets, the way the examiner wants it.'
        write: 'Solution'
      - say: 'First, join $Q$ to $S$. That makes triangle $PQS$ inside the quadrilateral, with the equal sides $PQ$ and $PS$.'
        write: 'Join $QS$'
        point:
          - {figure: 0, kind: highlight, target: QS, text: 'join QS'}
      - say: 'The angle between the tangent and the chord $PQ$ equals the angle in the alternate segment, at $S$. This is the alternate segment theorem.'
        write: '$\angle PSQ = \angle TPQ = 50^{\circ}$ (alt. segment theorem)'
        point:
          - {figure: 0, kind: arc, target: TPQ, text: '50°'}
          - {figure: 0, kind: arc, target: PSQ, text: '50°'}
      - say: '$PQ$ equals $PS$, so triangle $PQS$ is isosceles. Its base angles, at $Q$ and $S$, are equal, because base angles of an isosceles triangle are equal.'
        write: '$\angle PQS = \angle PSQ = 50^{\circ}$ (base $\angle$s of isos. $\triangle$)'
        point:
          - {line: 0, kind: underline, at: 'PQ=PS', text: 'given'}
          - {figure: 0, kind: arc, target: PQS, text: '50°'}
      - say: 'The three angles of triangle $PQS$ add up to 180 degrees, by the angle sum of a triangle.'
        write: '$\angle QPS + 50^{\circ} + 50^{\circ} = 180^{\circ}$ ($\angle$ sum of $\triangle$)'
      - say: '50 plus 50 is 100. Take it to the other side, and we get 180 minus 100.'
        write: '$\angle QPS = 180^{\circ} - 100^{\circ}$'
      - say: '180 minus 100 is 80 degrees. That is the angle at $P$.'
        write: '$\angle QPS = 80^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: QPS, text: '80°'}
      - say: '$R$ is opposite $P$ in the cyclic quadrilateral, so the two angles add up to 180, by opposite angles of a cyclic quadrilateral.'
        write: '$\angle QRS + \angle QPS = 180^{\circ}$ (opp. $\angle$s of cyclic quad.)'
        point:
          - {figure: 0, kind: arc, target: QRS, text: 'R'}
          - {figure: 0, kind: arc, target: QPS, text: 'P'}
      - say: 'Put in the 80 degrees we found at $P$.'
        write: '$\angle QRS + 80^{\circ} = 180^{\circ}$'
        point:
          - {line: 9, kind: move, from: {line: 7, at: '=80∘'}, at: '+[[80∘]]', text: 'from here'}
      - say: 'Take 80 to the other side. 180 minus 80 is 100.'
        write: '$\angle QRS = 180^{\circ} - 80^{\circ} = 100^{\circ}$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '+80∘'}, at: '−80∘', text: 'across'}
          - {figure: 0, kind: arc, target: QRS, text: '100°'}
      - section: 'Check'
        say: 'Check on the straight line of the tangent at $P$. On the other side, the tangent makes 50 degrees with $PS$, by the same theorem. 50 plus 80 plus 50 is 180.'
        write: '$50^{\circ} + 80^{\circ} + 50^{\circ} = 180^{\circ}$ ($\angle$s on a str. line) $\checkmark$'
        point:
          - {figure: 0, kind: arc, target: TPQ, text: '50°'}
          - {figure: 0, kind: arc, target: QPS, text: '80°'}
      - say: 'Therefore angle $QRS$ is 100 degrees, option E.'
        write: '$\therefore \angle QRS = 100^{\circ}$ (E)'
        answer: true
        point:
          - {figure: 0, kind: arc, target: QRS, text: '100°'}
    traps:
      A: 'You went for 50 degrees. That is the angle at $S$, from the alternate segment theorem. It gives the angle at $P$, 80 degrees, and the angle at $R$ is opposite it, so it is 180 minus 80, which is 100.'
      B: 'You went for 40 degrees, 90 minus 50. There is no right angle here. The alternate segment theorem gives 50 at $S$, the triangle gives 80 at $P$, and opposite angles give 100 at $R$.'
      C: 'You went for 110 degrees. The angle at $P$ is 180 minus 50 minus 50, which is 80, not 70. Opposite angles of a cyclic quadrilateral then give 180 minus 80, which is 100.'
      D: 'You went for 80 degrees. That is angle $QPS$, at $P$. The question asks for the angle at $R$, opposite it in the cyclic quadrilateral, so it is 180 minus 80, which is 100.'
  37:
    moments:
      - section: 'The question'
        say: 'A ship leaves port $P$, sails 30 km due south, then 60 km due west. We want the bearing of the ship $H$ from $P$.'
        write: '$30$ km due S, then $60$ km due W'
      - section: 'Solution'
        say: 'Solution. Let me draw the journey, 30 km straight down from $P$, then 60 km across to the west. I put a North line at $P$, because the bearing is taken from $P$.'
        write: 'Solution: N line at $P$; $\ 30$ km S, $60$ km W'
        show_sketch: true
        'on': 'draw the journey'
        point:
          - {figure: sketch, kind: circle, target: P, text: 'from here'}
          - {figure: sketch, kind: highlight, target: '30 km', text: 'south'}
          - {figure: sketch, kind: highlight, target: '60 km', text: 'west'}
      - say: 'South and west are at right angles, so the turn is 90 degrees. Let me join $P$ to $H$, and let theta be the angle at $P$ between due south and $PH$.'
        write: 'Let $\theta = \angle$ between S and $PH$ at $P$'
        show_sketch: sketch_b
        'on': 'join'
        point:
          - {figure: sketch_b, kind: highlight, target: PH, text: 'P to H'}
          - {figure: sketch_b, kind: circle, target: θ}
      - section: 'The angle at P'
        say: 'From theta, the 60 km side is opposite and the 30 km side is adjacent. Opposite and adjacent means TOA, so we use tangent.'
        write: '$\tan\theta = \dfrac{\text{opp}}{\text{adj}} = \dfrac{60}{30}$ (TOA)'
        point:
          - {figure: sketch_b, kind: underline, target: '60 km', text: 'opp'}
          - {figure: sketch_b, kind: underline, target: '30 km', text: 'adj'}
      - say: '60 divided by 30 is 2.'
        write: '$\tan\theta = 2$'
      - say: 'Now the tangent tables. 2.0000 sits at 63 degrees, in the 26 minutes column. So theta is 63 degrees 26 minutes.'
        write: '$\theta = \tan^{-1} 2 = 63^{\circ}26''$ (tables)'
        point:
          - {figure: sketch_b, kind: circle, target: θ, text: '63°26′'}
      - section: 'The bearing'
        say: 'A bearing is measured at $P$, clockwise from North, in three figures. Clockwise from North, due South is 180 degrees.'
        write: 'Due S from $P = 180^{\circ}$'
        point:
          - {figure: sketch_b, kind: circle, target: N, text: 'start at N'}
      - say: '$H$ is west of the South line, so we keep turning clockwise past South by theta. Add theta to 180.'
        write: 'Bearing of $H$ from $P = 180^{\circ} + \theta$'
        point:
          - {figure: sketch_b, kind: circle, target: '?', text: 'past South'}
      - say: '180 plus 63 degrees 26 minutes is 243 degrees 26 minutes.'
        write: '$= 180^{\circ} + 63^{\circ}26'' = 243^{\circ}26''$'
        point:
          - {line: 8, kind: move, from: {line: 5, at: '=63∘26′'}, at: '+63∘26′', text: 'θ'}
      - say: 'Therefore the bearing of $H$ from $P$ is 243 degrees 26 minutes. It is already three figures.'
        write: '$\therefore$ Bearing of $H$ from $P = 243^{\circ}26''$'
        point:
          - {figure: sketch_b, kind: label, target: '?', text: '243°26′'}
      - section: 'Check'
        say: 'Check the quarter. $H$ is south and west of $P$, so its bearing must be between 180 and 270 degrees. 243 degrees 26 minutes is.'
        write: 'Check: $180^{\circ} < 243^{\circ}26'' < 270^{\circ}$ (S-W) $\checkmark$'
      - say: 'And check the angles of the triangle. At $H$, tan is 30 over 60, which is 0.5, giving 26 degrees 34 minutes. With 63 degrees 26 minutes that makes 90. Right.'
        write: '$63^{\circ}26'' + 26^{\circ}34'' = 90^{\circ}\ \checkmark$'
      - section: 'Answer'
        say: 'So the bearing of $H$ from $P$ is 243 degrees 26 minutes, which is answer choice B.'
        write: '$\therefore 243^{\circ}26''$'
        answer: true
    traps:
      A: 'You went for 026 degrees 34 minutes. That is the angle at $H$ in the triangle, and as a bearing it points north-east. The ship is south-west of the port, so the bearing is 180 plus 63 degrees 26 minutes.'
      C: 'You went for 116 degrees 34 minutes, which is 180 minus 63 degrees 26 minutes. That points south-east. The ship went west, past South, so we add, giving 243 degrees 26 minutes.'
      D: 'You went for 063 degrees 26 minutes. That is theta, measured from South. A bearing is measured clockwise from North, so add the 180 first, giving 243 degrees 26 minutes.'
      E: 'You went for 240 degrees. That is in the right quarter but not exact. Tan theta is 2, so theta is 63 degrees 26 minutes, and the bearing is 243 degrees 26 minutes.'
  38:
    moments:
      - section: 'The question'
        say: 'A survey of 100 households asks how many members each one has. We want the median number of members per household. The data are already a frequency table, so here it is.'
        write: 'Median $= ?$'
        diagram:
          id: t
          kind: table
          columns: ['x (members)', 'f (households)', 'cf']
          rows: [[1, 3, ''], [2, 12, ''], [3, 15, ''], [4, 28, ''], [5, 21, ''], [6, 10, ''], [7, 7, ''], [8, 4, '']]
          'on': 'table'
      - section: 'Solution'
        say: 'Solution. $x$ is the number of members in a household, and $f$, the frequency, is the number of households. The total frequency, $N$, is 100.'
        write: 'Solution. $N = \sum f = 100$'
      - section: 'The median'
        say: 'The median needs the cf column, the cumulative frequency, which is a running total of $f$ down the table. It goes 3, then 15, 30, 58, 79, 89, 96 and 100.'
        diagram_do:
          - {id: t, op: total, part: 'col:2', into: 'col:3', 'on': 'running'}
      - say: '$N$ is 100, an even number. So the median is the average of the $N$ over 2th value, the 50th, and the one after it, the 51st.'
        write: '$\dfrac{N}{2} = \dfrac{100}{2} = 50$: the 50th and 51st values'
      - say: 'Go down the cf column to the first cf that reaches 51. 30 is too small, but 58 is enough.'
        write: 'cf before $= 30$; cf of $x = 4$ is $58$'
        diagram_do:
          - {id: t, op: highlight, part: 'row:4', text: 'cf reaches 51 here', 'on': '58'}
      - say: 'So the 31st to the 58th households all have 4 members. The 50th and 51st are both in that stretch.'
        write: '31st to 58th values: $x = 4$'
        diagram_do:
          - {id: t, op: label, part: 'cell:4,3', text: '31st to 58th', 'on': 'stretch'}
      - say: 'So the 50th value is 4, and the 51st is 4.'
        write: '50th value $= 4$, 51st value $= 4$'
      - say: 'The median is their average, so 4 plus 4, over 2, which is 4.'
        write: '$\therefore$ Median $= \dfrac{4 + 4}{2} = 4$'
        point:
          - {line: 7, kind: highlight, at: '[[=4]]', to: {diagram: t, part: 'row:4'}}
      - section: 'Check'
        say: 'To check, up to 3 members there are only 30 households, fewer than half of 100. Up to 4 members there are 58, more than half. So the middle household has 4 members.'
        write: 'Check: $30 < 50$ and $58 > 51$ ✓'
      - section: 'Answer'
        say: 'So the median is 4 members per household, which is option A.'
        write: '$\therefore$ Median $= 4$ members'
        answer: true
    traps:
      B: 'You went for 3. The cf at 3 members is only 30, so the 50th and 51st households come later. The cf column reaches 58 at 4 members, so they have 4.'
      C: 'You went for 5. The 5-member households start at the 59th, after the cf of 58. The 50th and 51st are in the 4-member row, the 31st to the 58th.'
      D: 'You went for 4.5, as if the middle fell between the 4s and the 5s. The cf column shows the 4-member households run from the 31st to the 58th, so the 50th and 51st are both 4.'
      E: 'You went for none. The cf column finds the median. The 50th and 51st households both have 4 members, so the median is 4.'
  39:
    moments:
      - section: 'The question'
        say: 'A square paper has side 2.524375 cm, and a smaller square diagram sits on it. We want the part of the paper left uncovered, to 3 significant figures.'
        write: 'Find the area not covered, to 3 s.f.'
      - say: 'Write Solution, then sketch the two squares, one inside the other, with their sides written on them.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: '2.524375 cm', text: 'paper', 'on': 'two squares'}
          - {figure: sketch, kind: underline, target: '0.524375 cm', text: 'diagram', 'on': 'sides written'}
      - section: 'What we know'
        say: 'List the givens. Call the side of the paper a, which is 2.524375 cm. Call the side of the diagram b, which is 0.524375 cm.'
        write: '$a = 2.524375$ cm, $b = 0.524375$ cm'
      - section: 'The formula'
        say: 'The area not covered is the area of the paper minus the area of the diagram.'
        write: 'Area not covered $=$ area of paper $-$ area of diagram'
        point:
          - {figure: sketch, kind: circle, target: '?', text: 'paper − diagram', 'on': 'minus'}
      - say: 'The area of a square is side squared. So this is a squared minus b squared.'
        write: '$= a^{2} - b^{2}$'
      - say: 'Squaring those long decimals is slow. a squared minus b squared is a difference of two squares, so it factorises into a minus b, times a plus b.'
        write: '$= (a - b)(a + b)$'
      - section: 'Substitute'
        say: 'Substitute a and b into both brackets.'
        write: '$= (2.524375 - 0.524375)(2.524375 + 0.524375)$'
      - section: 'Simplify'
        say: 'In the first bracket, the decimal parts are the same, so 2.524375 minus 0.524375 is exactly 2. In the second, adding gives 3.04875.'
        write: '$= 2 \times 3.04875$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '(2.524375 − 0.524375)'}, at: '[[2]]×', text: 'exactly 2', 'on': 'exactly 2'}
      - say: '2 times 3.04875 is 6.0975 square centimetres.'
        write: '$= 6.0975\ \text{cm}^{2}$'
      - say: 'Now round to 3 significant figures. The first three are 6, 0 and 9. The next digit is 7, which is 5 or more, so the 9 goes up, and 6.09 becomes 6.10.'
        write: '$\approx 6.10\ \text{cm}^{2}$ (3 s.f.)'
        point:
          - {line: 8, kind: circle, at: '6.09[[7]]', text: 'next digit', 'on': 'next digit is 7'}
      - say: 'Therefore the area not covered is 6.10 square centimetres. Keep the last zero, because it is the third significant figure.'
        write: '$\therefore$ area not covered $= 6.10\ \text{cm}^{2}$'
        point:
          - {figure: sketch, kind: label, target: '?', text: '6.10 cm²', 'on': 'Therefore'}
      - section: 'Check'
        say: 'Check by squaring directly. 2.524375 squared is about 6.3725, and 0.524375 squared is about 0.2750. Their difference is about 6.0975, which is the same.'
        write: 'Check: $6.3725 - 0.2750 = 6.0975$ ✓'
      - section: 'Answer'
        say: 'So the area not covered is 6.10 square centimetres, which is answer choice B.'
        write: '$\therefore$ area $= 6.10\ \text{cm}^{2}$ (B)'
        answer: true
    traps:
      A: 'You went for 6.00. The area is 6.0975, and to 3 significant figures that is 6.10, because the digit after the 9 is 7, so the 9 rounds up.'
      C: 'You went for 6. That is only one significant figure. To 3 significant figures, 6.0975 is 6.10, keeping the final zero.'
      D: 'You went for 6.09. That cuts off the digits instead of rounding. The digit after the 9 is 7, so the 9 rounds up, and 6.09 becomes 6.10.'
      E: 'You went for 4.00. That is a minus b, squared, which is 2 squared. The difference of the areas is a minus b, times a plus b, which is 2 times 3.04875, or 6.0975.'
  40:
    moments:
      - section: 'The question'
        say: 'We have $f$ of $x$, and we want $f$ of $1 - x$. Picture $f$ as a machine, and we feed it $1 - x$. Tidy the machine first, and the signs stay safe.'
        write: '$f(x) = \dfrac{1}{x - 1} + \dfrac{x - 1}{x^{2} - 1}$'
        doodle: {name: 'custom:1983_q40_a', id: f, caption: 'feed 1 − x into f'}
      - section: 'Solution'
        say: 'First simplify $f$ of $x$ by factorising. Then replace every $x$ with $1 - x$, in brackets.'
        write: 'Solution'
      - say: '$x$ squared minus 1 is a difference of two squares, so it is $x$ minus 1, times $x$ plus 1.'
        write: '$x^{2} - 1 = (x - 1)(x + 1)$'
      - say: 'In the second fraction, $x$ minus 1 is on the top and the bottom. Cancel the common factor, leaving 1 over $x$ plus 1.'
        write: '$\dfrac{x - 1}{(x - 1)(x + 1)} = \dfrac{1}{x + 1}$'
        point:
          - {line: 3, kind: strike, at: '[[(x−1)]](x+1)', text: 'cancels'}
      - say: 'So $f$ of $x$ is 1 over $x$ minus 1, plus 1 over $x$ plus 1.'
        write: '$f(x) = \dfrac{1}{x - 1} + \dfrac{1}{x + 1}$'
      - section: 'Feed in 1 − x'
        say: 'Now replace every $x$ with $1 - x$. Keep it in brackets so no sign is lost.'
        write: '$f(1 - x) = \dfrac{1}{(1 - x) - 1} + \dfrac{1}{(1 - x) + 1}$'
        doodle_do:
          - {id: f, op: pulse, part: input}
      - say: 'For the first bottom, open the bracket. This gives 1 minus $x$ minus 1. The 1s cancel, leaving negative $x$.'
        write: '$(1 - x) - 1 = -x$'
      - say: 'So the first fraction is 1 over negative $x$, which is negative 1 over $x$.'
        write: '$\dfrac{1}{-x} = -\dfrac{1}{x}$'
      - say: 'For the second bottom, 1 minus $x$ plus 1 is 2 minus $x$.'
        write: '$(1 - x) + 1 = 2 - x$'
      - say: '2 minus $x$ is negative, bracket $x$ minus 2. So the second fraction is negative 1 over $x$ minus 2.'
        write: '$\dfrac{1}{2 - x} = \dfrac{1}{-(x - 2)} = -\dfrac{1}{x - 2}$'
      - say: 'Put the two terms together. Therefore $f$ of $1 - x$ is negative 1 over $x$, minus 1 over $x$ minus 2. That is what comes out of the machine.'
        write: '$\therefore f(1 - x) = -\dfrac{1}{x} - \dfrac{1}{x - 2}$'
        doodle_do:
          - {id: f, op: circle, part: output}
      - section: 'Check'
        say: 'Check with $x$ equals 3. Then $1 - x$ is negative 2. In the question, $f$ of negative 2 is 1 over negative 3, plus negative 3 over 3.'
        write: '$f(-2) = \dfrac{1}{-3} + \dfrac{-3}{3} = -\dfrac{1}{3} - 1 = -\dfrac{4}{3}$'
      - say: 'Our answer at $x$ equals 3 gives negative one-third, minus 1 over 1. That is negative four-thirds too.'
        write: '$-\dfrac{1}{3} - \dfrac{1}{1} = -\dfrac{4}{3}\ \checkmark$'
      - say: 'So $f$ of $1 - x$ is negative 1 over $x$, minus 1 over $x$ minus 2, which is option C.'
        write: '$\therefore -\dfrac{1}{x} - \dfrac{1}{x - 2}$ (C)'
        answer: true
    traps:
      A: 'You went for 1 over $x$ plus 1 over $x + 2$. Both signs have slipped. $(1 - x) - 1$ is negative $x$, and $(1 - x) + 1$ is 2 minus $x$, which is negative, bracket $x$ minus 2.'
      B: 'You went for $x$ plus 1 over $2x - 1$. That does not come from substituting. Put $1 - x$ in brackets in place of each $x$, and the bottoms become negative $x$ and 2 minus $x$.'
      D: 'You went for negative 1 over $x$ plus 1 over $x^2 - 1$. The first part is right, but $1 - x$ must go into the second fraction too. It becomes 1 over 2 minus $x$, which is negative 1 over $x$ minus 2.'
      E: 'You went for 1 over $x$ minus 1 over $x - 2$. The second part is right, but the first bottom is $(1 - x) - 1$, which is negative $x$, not $x$. So the first term is negative 1 over $x$.'
  41:
    moments:
      - section: 'The question'
        say: 'A reflex angle at the centre can throw you off. Turn it into the ordinary angle first, then see which arc $R$ stands on.'
        write: 'Reflex $\angle POQ = 235^{\circ}$, $\angle PRQ = ?$'
        point:
          - {figure: 0, kind: circle, target: '235°', text: 'reflex'}
          - {figure: 0, kind: arc, target: PRQ, text: '?'}
      - section: 'Solution'
        say: 'Solution. First we find the ordinary angle $POQ$, on the other side of $O$ from the reflex angle.'
        write: 'Solution'
      - say: 'Together, the ordinary angle and the reflex angle make the full turn at $O$, which is 360 degrees, because of angles at a point.'
        write: '$\angle POQ + 235^{\circ} = 360^{\circ}$ ($\angle$s at a point)'
        point:
          - {figure: 0, kind: circle, target: '235°', text: 'reflex'}
      - say: 'Take 235 to the other side. 360 minus 235 is 125.'
        write: '$\angle POQ = 360^{\circ} - 235^{\circ} = 125^{\circ}$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '+235∘'}, at: '−235∘', text: 'across'}
          - {figure: 0, kind: arc, target: POQ, text: '125°'}
      - say: '$R$ is on the major arc, so angle $PRQ$ stands on the minor arc $PQ$, the same arc as the 125 degrees at $O$. The angle at the centre is twice the angle at the circumference.'
        write: '$\angle POQ = 2 \times \angle PRQ$ ($\angle$ at centre $= 2 \times \angle$ at circumference)'
        point:
          - {figure: 0, kind: arc, target: PQ, text: 'minor arc'}
          - {figure: 0, kind: arc, target: PRQ}
      - say: 'Put in the 125 degrees.'
        write: '$125^{\circ} = 2 \times \angle PRQ$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '=125∘'}, at: '125∘', text: 'from here'}
      - say: 'Divide both sides by 2.'
        write: '$\angle PRQ = \dfrac{125^{\circ}}{2}$'
      - say: 'Half of 125 is 62 and a half. So angle $PRQ$ is 62 and a half degrees.'
        write: '$\angle PRQ = 62\tfrac{1}{2}^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: PRQ, text: '62½°'}
      - section: 'Check'
        say: 'Check by working back. Twice 62 and a half is 125, and 125 plus the reflex 235 is 360, the full turn at $O$.'
        write: '$2 \times 62\tfrac{1}{2}^{\circ} = 125^{\circ}$, $125^{\circ} + 235^{\circ} = 360^{\circ}\ \checkmark$'
      - say: 'Therefore angle $PRQ$ is 62 and a half degrees, option B.'
        write: '$\therefore \angle PRQ = 62\tfrac{1}{2}^{\circ}$ (B)'
        answer: true
    traps:
      A: 'You went for 66 and a half degrees. The ordinary angle at $O$ is 360 minus 235, which is 125, not 133. The angle at $R$ is half of 125, which is 62 and a half.'
      C: 'You went for 125 degrees. That is the angle at the centre. The angle at the circumference on the same arc is half of it, which is 62 and a half degrees.'
      D: 'You went for 105 degrees. The angle at $O$ on the side facing $R$''s arc is 360 minus 235, which is 125, and the angle at $R$ is half of 125, which is 62 and a half.'
      E: 'You went for 65 degrees. That is close, but the angle at the centre is 125, not 130. Half of 125 is 62 and a half.'
  42:
    moments:
      - section: 'The question'
        say: 'We have a cube root over a fraction, with a power inside. Every number here is a perfect cube. Change the root to an index, and the laws of indices do the rest.'
        write: 'Simplify $\sqrt[3]{\dfrac{27a^{9}}{8}}$'
      - say: 'Solution. First the cube root becomes a power, then each number becomes a cube.'
        write: 'Solution'
      - section: 'Index form'
        say: 'Recall that the cube root is the same as the power 1 over 3. The $n$th root of $x$ is $x$ to the power 1 over $n$.'
        write: '$\sqrt[3]{\dfrac{27a^{9}}{8}} = \left(\dfrac{27a^{9}}{8}\right)^{\frac{1}{3}}$ $\quad [\sqrt[n]{x} = x^{\frac{1}{n}}]$'
      - say: 'Write 27 and 8 as powers. 3 times 3 times 3 is 27, so 27 is 3 cubed, and the big block is 3 along each edge. 2 times 2 times 2 is 8, so 8 is 2 cubed.'
        doodle: {name: 'custom:1983_q42_a', id: blocks, caption: '27 over 8, as cubes'}
        write: '$27 = 3^{3},\quad 8 = 2^{3}$'
        doodle_do: [{id: blocks, op: label, part: top, text: 'edge 3'}, {id: blocks, op: label, part: bottom, text: 'edge 2'}]
      - say: 'Put them back into the bracket.'
        write: '$= \left(\dfrac{3^{3}a^{9}}{2^{3}}\right)^{\frac{1}{3}}$'
      - section: 'The laws of indices'
        say: 'By the law of indices, a power outside a bracket goes onto every factor, on the top and on the bottom.'
        write: '$= \dfrac{(3^{3})^{\frac{1}{3}} \times (a^{9})^{\frac{1}{3}}}{(2^{3})^{\frac{1}{3}}}$ $\quad [(\tfrac{xy}{z})^{n} = \tfrac{x^{n}y^{n}}{z^{n}}]$'
      - say: 'Another law of indices says a power of a power multiplies the indices. So we have 3 times 1 over 3, 9 times 1 over 3 and 3 times 1 over 3.'
        write: '$= \dfrac{3^{3 \times \frac{1}{3}} \times a^{9 \times \frac{1}{3}}}{2^{3 \times \frac{1}{3}}}$ $\quad [(a^{m})^{n} = a^{mn}]$'
      - say: '3 times 1 over 3 is 1, and 9 times 1 over 3 is 3. So we have 3 to the power 1, times $a$ cubed, over 2 to the power 1.'
        write: '$= \dfrac{3^{1} \times a^{3}}{2^{1}}$'
      - say: 'Any number to the power 1 is itself.'
        write: '$\therefore \sqrt[3]{\dfrac{27a^{9}}{8}} = \dfrac{3a^{3}}{2}$'
        doodle_do: [{id: blocks, op: pulse}]
      - section: 'Check'
        say: 'Check by cubing the answer. The cube goes on every factor, so we get 3 cubed, times $a$ cubed all cubed, over 2 cubed.'
        write: 'Check: $\left(\dfrac{3a^{3}}{2}\right)^{3} = \dfrac{3^{3}(a^{3})^{3}}{2^{3}}$'
      - say: '3 cubed is 27, $a$ cubed, cubed, is $a$ to the 9, and 2 cubed is 8. That is exactly what was under the cube root.'
        write: '$= \dfrac{27a^{9}}{8}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the answer is $3a^3$ over 2, which is option E.'
        write: '$\therefore \dfrac{3a^{3}}{2}$'
        answer: true
    traps:
      A: 'You went for $9a^2$ over 2. 27 is 3 cubed, so its cube root is 3, not 9. And $a$ to the 9, to the power 1 over 3, is $a$ to the 3, not $a$ squared, because we multiply the indices.'
      B: 'You went for $9a^3$ over 2. The power is right, but 27 is 3 cubed, so 27 to the power 1 over 3 is 3. 9 cubed would be 729.'
      C: 'You went for 2 over $3a^2$. That is upside down, and the power is wrong too. The 27 and $a^9$ are on top, so $3a^3$ stays on top, over 2.'
      D: 'You went for 2 over $3a^3$. That is the right answer turned upside down. The 27 and $a^9$ are on the top, so the answer is $3a^3$ over 2.'
  43:
    moments:
      - section: 'The question'
        say: 'Here are four crops from a farm in Ondo, beans 14.5 kg, okro 14.5 kg, rice 56.5 kg and yams 184.5 kg. We want the angle of the okro sector.'
        write: 'Okro sector $= ?$'
        point:
          - {figure: 0, kind: circle, target: Okro}
      - section: 'Solution'
        say: 'Solution. Draw the table of crops and yields. Each sectoral angle is the yield over the total yield, times 360 degrees.'
        write: 'Sectoral angle $= \dfrac{\text{yield}}{\text{total}} \times 360^{\circ}$'
        diagram: {id: t, kind: table, columns: [Crop, 'Yield (kg)', 'Sectoral angle'], rows: [[Beans, 14.5, ''], [Okro, 14.5, ''], [Rice, 56.5, ''], [Yams, 184.5, '']]}
      - say: 'First the total. 14.5 plus 14.5 is 29. 29 plus 56.5 is 85.5. 85.5 plus 184.5 is 270 kilograms.'
        write: 'Total $= 14.5 + 14.5 + 56.5 + 184.5 = 270$ kg'
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': '270'}
      - section: 'The okro sector'
        say: 'Okro is 14.5 kilograms out of 270. Substitute into the formula.'
        write: 'Okro $= \dfrac{14.5}{270} \times 360^{\circ}$'
      - say: 'Simplify 360 over 270. Divide both by 90, and it is 4 over 3.'
        write: '$= 14.5 \times \dfrac{4}{3}$'
      - say: '14.5 times 4 is 58. So it is 58 over 3.'
        write: '$= \dfrac{58}{3}$'
      - say: '58 divided by 3 is 19, remainder 1. So it is 19 and 1 over 3 degrees.'
        write: '$= 19\tfrac{1}{3}^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:2,3', text: '19⅓°', 'on': 'degrees'}
        point:
          - {figure: 0, kind: label, target: Okro, text: '19⅓°'}
      - section: 'Check'
        say: 'Check the whole circle with the same 4 over 3. Beans is also 19 and 1 over 3. Rice is 56.5 times 4 over 3, which is 75 and 1 over 3. Yams is 184.5 times 4 over 3, which is 246.'
        write: 'Beans $19\tfrac{1}{3}^{\circ}$, rice $75\tfrac{1}{3}^{\circ}$, yams $246^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,3', text: '19⅓°', 'on': 'Beans'}
          - {id: t, op: fill, part: 'cell:3,3', text: '75⅓°', 'on': 'Rice'}
          - {id: t, op: fill, part: 'cell:4,3', text: '246°', 'on': 'Yams'}
      - say: '19 and 1 over 3, plus 19 and 1 over 3, plus 75 and 1 over 3, plus 246, is 360 degrees.'
        write: '$19\tfrac{1}{3} + 19\tfrac{1}{3} + 75\tfrac{1}{3} + 246 = 360^{\circ}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the okro sector is 19 and 1 over 3 degrees, which is answer choice B.'
        write: '$\therefore$ okro sector $= 19\tfrac{1}{3}^{\circ}$'
        answer: true
    traps:
      A: 'You went for 91 and a half degrees. That is far too big for 14.5 kg out of 270 kg. 14.5 over 270, times 360, is 19 and 1 over 3 degrees.'
      C: 'You went for 33 and 1 over 3 degrees. Find the total first, 270 kg. Then okro is 14.5 over 270, times 360, which is 19 and 1 over 3.'
      D: 'You went for 11 degrees. That does not share 360 degrees in proportion. Okro is 14.5 over 270 of 360 degrees, which is 19 and 1 over 3.'
      E: 'You went for 91 degrees. That is far too big a share for okro. 14.5 over 270, times 360, is 19 and 1 over 3 degrees.'
  44:
    moments:
      - section: 'The question'
        say: '$PQR$ is a straight line. Above it at $Q$ are $x + 3y$ and 45 degrees, and below it are $y$ and $3x + y$. Two straight-line facts give two equations.'
        write: 'Above: $(x + 3y)^{\circ},\ 45^{\circ}$; below: $y^{\circ},\ (3x + y)^{\circ}$'
        point:
          - {figure: 0, kind: highlight, target: PR, text: 'straight line'}
          - {figure: 0, kind: circle, target: '(x + 3y)°', text: 'above'}
          - {figure: 0, kind: circle, target: 'y°', text: 'below'}
      - section: 'Solution'
        say: 'Solution. Above the line, the two angles add up to 180 degrees, because they are angles on a straight line.'
        write: 'Solution. $(x + 3y) + 45 = 180$ ($\angle$s on a str. line)'
        point:
          - {figure: 0, kind: circle, target: '(x + 3y)°'}
          - {figure: 0, kind: circle, target: '45°'}
      - say: 'Take 45 to the other side. 180 minus 45 is 135. Number it equation one.'
        write: '$x + 3y = 135 \quad \ldots (1)$'
      - say: 'Below the line, the two angles also add up to 180 degrees. The reason is the same.'
        write: '$y + (3x + y) = 180$ ($\angle$s on a str. line)'
        point:
          - {figure: 0, kind: circle, target: 'y°'}
          - {figure: 0, kind: circle, target: '(3x + y)°'}
      - say: 'Collect like terms, so $y$ plus $y$ is $2y$. That is equation two.'
        write: '$3x + 2y = 180 \quad \ldots (2)$'
      - section: 'Eliminate x'
        say: 'Now solve them together by elimination. Multiply equation one by 3, so that both equations have $3x$.'
        write: '$(1) \times 3$: $3x + 9y = 405 \quad \ldots (3)$'
      - say: 'Subtract equation two from equation three. $3x$ minus $3x$ is zero, $9y$ minus $2y$ is $7y$, and 405 minus 180 is 225.'
        write: '$(3) - (2)$: $7y = 225$'
      - say: 'Divide both sides by 7. 7 times 32 is 224, so 225 over 7 is 32 and 1 over 7.'
        write: '$y = \dfrac{225}{7} = 32\tfrac{1}{7}$'
      - section: 'Find x'
        say: 'Substitute $y$ in equation one, so $x$ plus 3 times 225 over 7 equals 135. 3 times 225 is 675.'
        write: 'Sub. in (1): $x + \dfrac{675}{7} = 135$'
      - say: 'Take 675 over 7 across. 135 is 945 over 7, and 945 minus 675 is 270.'
        write: '$x = \dfrac{945}{7} - \dfrac{675}{7} = \dfrac{270}{7}$'
      - say: '7 times 38 is 266, with 4 left over. So $x$ is 38 and 4 over 7.'
        write: '$x = 38\tfrac{4}{7}$'
      - section: 'Check'
        say: 'Check in equation two. 3 times 270 over 7 is 810 over 7, and 2 times 225 over 7 is 450 over 7. Together they make 1260 over 7, which is 180.'
        write: 'Check (2): $\dfrac{810}{7} + \dfrac{450}{7} = \dfrac{1260}{7} = 180$ ✓'
      - section: 'Answer'
        say: 'Therefore $x$ is 38 and 4 over 7 degrees, and $y$ is 32 and 1 over 7 degrees, which is answer choice E.'
        write: '$\therefore x = 38\tfrac{4}{7}^{\circ},\ \ y = 32\tfrac{1}{7}^{\circ}$ (E)'
        answer: true
    traps:
      A: 'You went for $x = 22.5$ and $y = 33.75$. Test it in equation one. 22.5 plus 3 times 33.75 is 123.75, not 135. The angles above the line would not make 180.'
      B: 'You went for $x = 15$ and $y = 52.5$. Test it in equation one. 15 plus 3 times 52.5 is 172.5, not 135. Always substitute back into both equations.'
      C: 'You went for $x = 22.5$ and $y = 45$. Test it in equation one. 22.5 plus 135 is 157.5, not 135. Solving the two equations gives $y = 32\tfrac{1}{7}$ and $x = 38\tfrac{4}{7}$.'
