      - say: 'Partly and partly means $y$ is the sum of two parts, each with its own constant. One part goes with $x$ squared, the other with 1 over root $x$. Call the constants $a$ and $b$.'
        write: '$y = ax^{2} + \dfrac{b}{\sqrt{x}}$'
      - say: 'Now use the first pair of values: put in $x = 1$ and $y = 2$.'
        write: 'At $x = 1$: $2 = a(1)^{2} + \dfrac{b}{\sqrt{1}}$'
      - say: '1 squared is 1, and the square root of 1 is 1. So $a$ plus $b$ is 2. That''s equation one.'
        write: '$a + b = 2 \quad (1)$'
      - say: 'Now the second pair: put in $x = 4$ and $y = 6$.'
        write: 'At $x = 4$: $6 = a(4)^{2} + \dfrac{b}{\sqrt{4}}$'
      - say: '4 squared is 16, and the square root of 4 is 2. So $16a$ plus $b$ over 2 equals 6.'
        write: '$16a + \dfrac{b}{2} = 6$'
      - say: 'Multiply every term by 2 to clear the fraction. $16a$ times 2 is $32a$, and 6 times 2 is 12. That''s equation two.'
        write: '$32a + b = 12 \quad (2)$'
      - say: 'Both equations have a single $b$, so take equation two minus equation one, and the $b$ disappears.'
        write: '(2) $-$ (1): $32a - a = 12 - 2$'
      - say: '$32a$ minus $a$ is $31a$, and 12 minus 2 is 10.'
        write: '$31a = 10$'
      - say: 'Divide both sides by 31.'
        write: '$a = \dfrac{10}{31}$'
      - say: 'Now back to equation one: $b$ is 2 minus 10 over 31. Write 2 as 62 over 31, and 62 minus 10 is 52.'
