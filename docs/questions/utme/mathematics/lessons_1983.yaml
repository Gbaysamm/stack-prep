      - say: 'So angle $OPT$ is 90 degrees, because a tangent is perpendicular to the radius at the point of contact.'
        write: '$\angle OPT = 90^{\circ}$ (tangent $\perp$ radius)'
        point:
          - {figure: 0, kind: arc, target: OPT, text: '90°'}
