      - say: 'Group the first pair and the last pair. From the first, take out $3x$. From the second, take out 2.'
        write: '$3x(x - 3) + 2(x - 3)$'
      - say: 'Both groups share $x$ minus 3, so take it out.'
        write: '$(x - 3)(3x + 2)$'
      - say: 'Don''t forget the 2 we took out at the start.'
        write: '$2(x - 3)(3x + 2)$'
      - say: 'Let''s check by expanding. $x$ minus 3 times $3x$ plus 2 is $3x^{2} + 2x - 9x - 6$, which is $3x^{2} - 7x - 6$. Times 2 gives $6x^{2} - 14x - 12$.'
        write: '$2(3x^{2} - 7x - 6) = 6x^{2} - 14x - 12$'
