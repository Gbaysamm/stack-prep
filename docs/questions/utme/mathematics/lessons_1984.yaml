      - say: '3 lots minus 1 lot is 2 lots.'
        write: '$= 2 \times 3^{n-1}$'
      - say: 'Now the bottom. 3 cubed is 27, so the first part is 27 times 3 to the $n$, which is 27 times 3 times 3 to the $n$ minus 1, which is 81 times 3 to the $n$ minus 1.'
        write: '$3^{3} \times 3^{n} = 81 \times 3^{n-1}$'
