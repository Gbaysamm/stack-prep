        point:
          - {line: 4, kind: move, from: {line: 3, at: '=30∘'}, at: '30∘'}
          - {figure: 0, kind: arc, target: TOU, text: '15°'}
      - say: 'So starting from $OP$, we turn 90 degrees to reach $OT$, then another 15 degrees to reach $OU$.'
        write: '$\angle UOP = \angle TOP + 15^{\circ} = 90^{\circ} + 15^{\circ}$'
        point:
          - {line: 5, kind: move, from: {line: 1, at: '90∘'}, at: '[[90∘]]+15∘'}
          - {line: 5, kind: move, from: {line: 4, at: '=15∘'}, at: '90∘+[[15∘]]'}
      - say: '90 plus 15 is 105.'
        write: '$= 105^{\circ}$'
