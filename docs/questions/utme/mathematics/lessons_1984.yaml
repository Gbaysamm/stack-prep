        write: 'First: $\ 4a^{2} - 9b^{2} = (2a)^{2} - (3b)^{2}$'
      - say: 'A difference of two squares splits into a minus bracket times a plus bracket.'
        write: '$= (2a - 3b)(2a + 3b)$'
      - say: 'The second is a sum of two cubes. 8 $a$ cubed is $2a$ all cubed, because 2 cubed is 8. And 27 $b$ cubed is $3b$ all cubed, because 3 cubed is 27.'
        write: 'Second: $\ 8a^{3} + 27b^{3} = (2a)^{3} + (3b)^{3}$'
      - say: 'A sum of two cubes, $p$ cubed plus $q$ cubed, factorises as $p$ plus $q$, times $p$ squared minus $pq$ plus $q$ squared.'
        write: '$p^{3} + q^{3} = (p + q)(p^{2} - pq + q^{2})$'
      - say: 'Here $p$ is $2a$ and $q$ is $3b$. So $p$ squared is 4 $a$ squared, $pq$ is $6ab$, and $q$ squared is 9 $b$ squared.'
