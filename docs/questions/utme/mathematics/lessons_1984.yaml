      - say: '$q$ squared minus 1 is a difference of two squares, $q$ squared minus 1 squared.'
        write: '$pq = (q - 1)(q + 1)$'
      - say: 'Now put that in place of $pq$ on the bottom of $t$.'
        write: '$t = \dfrac{q - 1}{(q - 1)(q + 1)}$'
