  46:
    moments:
      - say: 'In the diagram, $O$ is the centre of the circle, $PR$ and $SQ$ are diameters, and $PS$ is parallel to $RT$. Angle $PRT$ is 135 degrees. We want angle $PSQ$.'
        write: '$PS \parallel RT, \quad \angle PRT = 135^{\circ}$; $\ PR$ and $SQ$ are diameters'
        point:
          - {figure: 0, kind: arc, target: PRT, text: '135°'}
      - say: 'The rule: co-interior angles between parallel lines add up to 180 degrees.'
        write: 'Co-interior angles add up to $180^{\circ}$'
      - say: 'We''ll use the parallel lines first, then the circle. $PR$ cuts across the parallel lines $PS$ and $RT$. Angles $SPR$ and $PRT$ lie between the parallels on the same side, so they are co-interior angles, which add to 180 degrees.'
        write: 'Co-interior: $\ \angle SPR + \angle PRT = 180^{\circ}$'
        point:
          - {figure: 0, kind: highlight, target: PS, text: 'parallel'}
          - {figure: 0, kind: highlight, target: RT, text: 'parallel'}
          - {figure: 0, kind: arc, target: SPR, text: 'co-interior'}
      - say: 'Put in 135 for angle $PRT$. 180 minus 135 is 45.'
        write: '$\angle SPR = 180^{\circ} - 135^{\circ} = 45^{\circ}$'
        point:
          - {line: 3, kind: move, from: {line: 0, at: '135∘'}, at: '−135∘', text: 'given'}
          - {figure: 0, kind: arc, target: SPR, text: '45°'}
      - say: 'The rule: the angle at the centre is twice the angle at the circumference, standing on the same arc.'
        write: 'Angle at the centre $= 2 \times$ angle at the circumference'
      - say: 'Now the circle. Angle $SPR$ is at the circumference, standing on the arc $SR$. The angle at the centre on the same arc is twice as big: 2 times 45 is 90.'
        write: 'At the centre: $\ \angle SOR = 2 \times \angle SPR = 2 \times 45^{\circ} = 90^{\circ}$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '=45∘'}, at: '45∘'}
          - {figure: 0, kind: arc, target: SOR, text: '90°'}
      - say: '$PR$ and $SQ$ are both diameters, so they cross at $O$. Angle $POQ$ is vertically opposite angle $SOR$, so it is also 90 degrees.'
        write: 'Vertically opposite: $\ \angle POQ = \angle SOR = 90^{\circ}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '=90∘'}, at: '90∘'}
          - {figure: 0, kind: arc, target: POQ, text: '90°'}
      - say: 'Now angle $PSQ$ is at the circumference, standing on the arc $PQ$. So it is half of the centre angle on that arc, angle $POQ$.'
        write: '$\angle PSQ = \tfrac{1}{2} \times \angle POQ$'
        point:
          - {figure: 0, kind: arc, target: PSQ, text: 'circumference'}
          - {figure: 0, kind: arc, target: POQ, text: 'centre'}
      - say: 'Half of 90 is 45.'
        write: '$= \tfrac{1}{2} \times 90^{\circ} = 45^{\circ}$'
        point:
          - {line: 8, kind: move, from: {line: 6, at: '=90∘'}, at: '90∘'}
          - {figure: 0, kind: arc, target: PSQ, text: '45°'}
      - say: 'Another way to check: in triangle $OPS$, $OP$ equals $OS$, both radii. So the angle at $S$ equals the angle at $P$, which is angle $SPR$, 45 degrees. And since $O$ lies on $SQ$, the angle at $S$ is angle $PSQ$.'
        write: 'Check: $\ OP = OS \Rightarrow \angle PSQ = \angle OSP = \angle OPS = 45^{\circ}$'
        point:
          - {figure: 0, kind: highlight, target: OP, text: 'radius'}
          - {figure: 0, kind: highlight, target: OS, text: 'radius'}
          - {figure: 0, kind: arc, target: OSP, text: '45°'}
      - say: 'So angle $PSQ$ is 45 degrees, which is answer choice B.'
        write: '$\angle PSQ = 45^{\circ}$'
        answer: true
        point:
          - {figure: 0, kind: arc, target: PSQ, text: '45°'}
    traps:
      A: 'You went for 67 and a half degrees. That''s half of 135. Use the parallel lines first: co-interior angles give angle $SPR$ as 45, and then the circle gives angle $PSQ$ as 45.'
      C: 'You went for 90 degrees. That''s angle $PSR$, the angle in a semicircle on the diameter $PR$, or the centre angle $POQ$. Angle $PSQ$ stands on arc $PQ$, so it''s half of 90, which is 45.'
      D: 'You went for 33 and three quarter degrees. That''s a quarter of 135. The co-interior angles give angle $SPR$ as 45, the centre angle is 90, and angle $PSQ$ is half of that, 45.'
      E: 'You went for 22 and a half degrees. That divides by 2 once too often. The centre angle $POQ$ is 90, and the angle at the circumference is half of it, 45.'
  47:
    moments:
      - say: '$XYZ$ is a triangle, and $XW$ is perpendicular to $YZ$ at $W$. $XZ$ is 5 cm, $WZ$ is 4 cm and $YZ$ is 10 cm. We want $XY$.'
        write: '$XW \perp YZ$; $\ XZ = 5,\ WZ = 4,\ YZ = 10$'
        point:
          - {figure: 0, kind: highlight, target: XW, text: '⊥ YZ'}
          - {figure: 0, kind: highlight, target: XZ, text: '5 cm'}
          - {figure: 0, kind: highlight, target: WZ, text: '4 cm'}
      - say: 'Pythagoras: the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hypotenuse}^{2} = \text{opposite}^{2} + \text{adjacent}^{2}$'
      - say: 'The line $XW$ splits the big triangle into two right-angled triangles that share the side $XW$. Let''s find $XW$ from the triangle we know best, $XWZ$, which is right-angled at $W$.'
        write: 'In $\triangle XWZ$: $\ XW^{2} + WZ^{2} = XZ^{2}$'
        point:
          - {figure: 0, kind: highlight, target: XZ, text: '5 cm'}
          - {figure: 0, kind: highlight, target: WZ, text: '4 cm'}
      - say: 'Rearrange: $XW$ squared is $XZ$ squared minus $WZ$ squared. Put in 5 and 4.'
        write: '$XW^{2} = XZ^{2} - WZ^{2} = 5^{2} - 4^{2}$'
        point:
          - {line: 3, kind: move, from: {line: 0, at: 'XZ=[[5]]'}, at: '[[5]]2−', text: 'XZ'}
          - {line: 3, kind: move, from: {line: 0, at: 'WZ=[[4]]'}, at: '−[[4]]2', text: 'WZ'}
      - say: '5 squared is 25 and 4 squared is 16. 25 minus 16 is 9.'
        write: '$= 25 - 16 = 9$'
      - say: 'The square root of 9 is 3, so $XW$ is 3 cm.'
        write: '$XW = \sqrt{9} = 3$ cm'
        point:
          - {figure: 0, kind: label, target: XW, text: '3 cm'}
      - say: 'Next, the rest of the base. $YW$ is $YZ$ minus $WZ$: 10 minus 4 is 6.'
        write: '$YW = YZ - WZ = 10 - 4 = 6$ cm'
        point:
          - {line: 6, kind: move, from: {line: 0, at: 'YZ=[[10]]'}, at: '[[10]]−4', text: 'YZ'}
          - {line: 6, kind: move, from: {line: 0, at: 'WZ=[[4]]'}, at: '10[[−4]]', text: 'WZ'}
          - {figure: 0, kind: label, target: YW, text: '6 cm'}
      - say: 'Now the other triangle, $XWY$, also right-angled at $W$. By Pythagoras, $XY$ squared is $YW$ squared plus $XW$ squared.'
        write: 'In $\triangle XWY$: $\ XY^{2} = YW^{2} + XW^{2}$'
        point:
          - {figure: 0, kind: highlight, target: XY}
      - say: 'Put in the 6 and the 3 we just found. 6 squared is 36, 3 squared is 9, and 36 plus 9 is 45.'
        write: '$= 6^{2} + 3^{2} = 36 + 9 = 45$'
        point:
          - {line: 8, kind: move, from: {line: 6, at: '=6cm'}, at: '[[6]]2+'}
          - {line: 8, kind: move, from: {line: 5, at: '=3cm'}, at: '+[[3]]2'}
      - say: 'Take the square root. 45 is 9 times 5, and the square root of 9 is 3, so this is 3 root 5.'
        write: '$XY = \sqrt{45} = \sqrt{9 \times 5} = 3\sqrt{5}$'
      - say: 'So $XY$ is 3 root 5 cm, which is answer choice B.'
        write: '$XY = 3\sqrt{5}$ cm'
        point:
          - {figure: 0, kind: label, target: XY, text: '3√5 cm'}
        answer: true
    traps:
      A: 'You went for 5 root 3 cm. The numbers are swapped: $XY$ squared is 45, which is 9 times 5, so $XY$ is 3 root 5. 5 root 3 would need 75.'
      C: 'You went for 3 root 3 cm. That would need $XY$ squared to be 27. With $YW$ equal to 6 and $XW$ equal to 3, $XY$ squared is 36 plus 9, which is 45.'
      D: 'You went for 5 cm. That assumes $XY$ equals $XZ$, as if $W$ were the midpoint of $YZ$. But $W$ is 6 cm from $Y$ and only 4 cm from $Z$.'
      E: 'You went for 6 cm. That''s $YW$, part of the base. $XY$ is the slanting side, so use Pythagoras: the root of 36 plus 9 is 3 root 5.'
  48:
    moments:
      - say: 'We have the diameters of 20 copper spheres, grouped into classes, and we want the mean diameter. Picture measuring each sphere across its middle.'
        doodle: {name: 'custom:1984_q48_a', id: spheres, caption: 'Measuring 20 copper spheres', size: scene}
        write: 'Mean diameter of the 20 spheres $= ?$'
      - say: 'For grouped data, each class is represented by its midpoint $x$. We multiply each midpoint by its frequency $f$, add those up, and divide by the total frequency.'
        write: 'Mean $= \dfrac{\sum fx}{\sum f}$'
      - say: 'The midpoint is halfway between the class boundaries. 3.35 plus 3.45 is 6.80, and half of that is 3.40.'
        write: 'First midpoint $= \dfrac{3.35 + 3.45}{2} = \dfrac{6.80}{2} = 3.40$'
      - say: 'In the same way, the other three midpoints are 3.50, 3.60 and 3.70. Sort the spheres into four piles, one per midpoint.'
        doodle_do: [{id: spheres, op: stage, stage: 'custom:1984_q48_a2'}]
        write: 'Midpoints $x$: $\ 3.40,\ 3.50,\ 3.60,\ 3.70$'
      - say: 'Count the four piles. The frequencies are 3, 6, 7 and 4. They add to 20, which matches the 20 spheres.'
        doodle_do: [{id: spheres, op: label, part: tray, text: '3 + 6 + 7 + 4 = 20'}]
        write: '$\sum f = 3 + 6 + 7 + 4 = 20$'
      - say: 'Now multiply each midpoint by its frequency. 3 times 3.40 is 10.2, and 6 times 3.50 is 21.'
        write: '$3 \times 3.40 = 10.2,\quad 6 \times 3.50 = 21$'
      - say: 'Then 7 times 3.60 is 25.2, and 4 times 3.70 is 14.8.'
        write: '$7 \times 3.60 = 25.2,\quad 4 \times 3.70 = 14.8$'
      - say: 'Pile by pile: Add those four products. 10.2 plus 21 is 31.2. Plus 25.2 is 56.4. Plus 14.8 is 71.2.'
        doodle_do: [{id: spheres, op: pulse, part: tray}]
        write: '$\sum fx = 10.2 + 21 + 25.2 + 14.8 = 71.2$'
      - say: 'Now put both totals into the formula: 71.2 over 20.'
        write: 'Mean $= \dfrac{71.2}{20}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '=71.2'}, at: '71.2', text: 'Σfx'}
          - {line: 8, kind: move, from: {line: 4, at: '=20'}, at: '[[20]]71.2', text: 'Σf'}
      - say: '71.2 divided by 20 is 3.56. That is the typical sphere''s diameter.'
        doodle_do: [{id: spheres, op: label, part: cal, text: '3.56 cm'}]
        write: '$= 3.56$'
        point:
          - {line: 9, kind: highlight, at: '3.56', to: {doodle: spheres, part: cal}}
      - say: 'So the mean diameter is 3.56 cm, which is answer choice C.'
        write: 'Mean diameter $= 3.56$ cm'
        answer: true
    traps:
      A: 'You went for 3.40 cm. That''s the midpoint of the first class only. The mean weights every midpoint by its frequency: 71.2 over 20 is 3.56.'
      B: 'You went for 3.58 cm. Check the products and their sum: 10.2 plus 21 plus 25.2 plus 14.8 is 71.2, and 71.2 divided by 20 is 3.56.'
      D: 'You went for 3.62 cm. The mean should sit near the classes with the most spheres, around 3.5 to 3.6. The sum of $fx$ is 71.2, and 71.2 over 20 is 3.56.'
      E: 'You went for 3.63 cm. Use the class midpoints, 3.40 to 3.70, weighted by 3, 6, 7 and 4. That gives 71.2 over 20, which is 3.56.'
  49:
    moments:
