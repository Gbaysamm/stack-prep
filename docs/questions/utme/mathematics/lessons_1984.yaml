        point:
          - {line: 1, kind: box, text: 'the rule'}
      - say: 'Now the tricky one, log base a quarter of 64. Call it $n$. Then a quarter to the power $n$ must be 64.'
        write: 'Second: $\ \log_{1/4}64 = n$ means $\left(\tfrac{1}{4}\right)^{n} = 64$'
      - say: 'A quarter is 4 to the minus 1, so a quarter to the $n$ is 4 to the minus $n$. And 64 is 4 cubed.'
        write: '$\left(4^{-1}\right)^{n} = 4^{3} \;\Rightarrow\; 4^{-n} = 4^{3}$'
      - say: 'The bases are both 4, so the powers must match. Minus $n$ is 3, which makes $n$ minus 3.'
        write: '$-n = 3$, so $\log_{1/4}64 = -3$'
      - say: 'Now the bottom, log base 3 of 1 over 81. 3 to the power 4 is 81, so 1 over 81 is 3 to the minus 4.'
        write: 'Bottom: $\ \dfrac{1}{81} = \dfrac{1}{3^{4}} = 3^{-4}$, so $\log_{3}\tfrac{1}{81} = -4$'
      - say: 'Now put the three values we found back in. The top is 3 minus minus 3, and the bottom is minus 4.'
        write: 'So the expression $= \dfrac{3 - (-3)}{-4}$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '=−3'}, at: '(−3)'}
          - {line: 7, kind: move, from: {line: 6, at: '=−4'}, at: '−4'}
      - say: 'Taking away a minus is adding, so 3 minus minus 3 is 3 plus 3, which is 6.'
        write: '$= \dfrac{3 + 3}{-4} = \dfrac{6}{-4}$'
      - say: 'Divide the top and bottom by 2: 6 over 2 is 3, and minus 4 over 2 is minus 2. A positive over a negative is negative.'
        write: '$= -\dfrac{3}{2}$'
      - say: 'So the value is minus 3 over 2, which is answer choice C.'
        write: 'Value $= -\dfrac{3}{2}$'
        answer: true
    traps:
      A: 'You went for 7 over 4. The bottom, log base 3 of 1 over 81, is minus 4, so the answer must be negative. And the top is 3 minus minus 3, which is 6, giving minus 3 over 2.'
      B: 'You went for minus 7 over 4. The bottom is right, but the top is 3 minus minus 3, which is 6, not 7. Then 6 over minus 4 is minus 3 over 2.'
      D: 'You went for 7 over 3. Work each log separately: they are 3, minus 3 and minus 4. Then 6 over minus 4 is minus 3 over 2.'
      E: 'You went for minus 1 over 4. A base less than 1 needs a negative power to give a number bigger than 1, so log base a quarter of 64 is minus 3. The top is then 6, and 6 over minus 4 is minus 3 over 2.'
