  26:
    moments:
      - say: '$x$ minus 2 and $x$ plus 1 are both factors of $x$ cubed plus $p x$ squared plus $qx$ plus 1. We want $p$ plus $q$. Two factors will give us two equations.'
        write: '$x^{3} + px^{2} + qx + 1$'
      - say: 'The factor theorem says: if $x$ minus $a$ is a factor, then putting $x$ equals $a$ into the expression gives zero.'
        write: 'Factor theorem: $\ (x - a)$ is a factor $\Rightarrow$ the value at $x = a$ is $0$'
      - say: 'First factor, $x$ minus 2. It is zero when $x$ is 2, so put $x$ equals 2 into the expression.'
        write: 'At $x = 2$: $\ 2^{3} + p(2)^{2} + q(2) + 1 = 0$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
      - say: '2 cubed is 8, and 2 squared is 4.'
        write: '$8 + 4p + 2q + 1 = 0$'
      - say: '8 plus 1 is 9. Take 9 from both sides. Let''s call this equation 1.'
        write: '(1) $\ 4p + 2q = -9$'
      - say: 'Now the second factor, $x$ plus 1. Careful with the sign: $x$ plus 1 is zero when $x$ is minus 1, so we put in minus 1, not plus 1.'
        write: 'At $x = -1$: $\ (-1)^{3} + p(-1)^{2} + q(-1) + 1 = 0$'
      - say: 'Minus 1 cubed is minus 1, and minus 1 squared is plus 1.'
        write: '$-1 + p - q + 1 = 0$'
      - say: 'The minus 1 and plus 1 cancel, leaving $p$ minus $q$ equals zero. So $p$ equals $q$. Call this equation 2.'
        write: '(2) $\ p - q = 0$, so $p = q$'
        point:
          - {line: 6, kind: strike, at: '−1', text: 'cancel'}
          - {line: 6, kind: strike, at: '+1'}
      - say: 'Now use equation 2 in equation 1: replace $q$ with $p$. $4p$ plus $2p$ is $6p$.'
        write: 'In (1): $\ 4p + 2p = -9 \Rightarrow 6p = -9$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: 'so[[p]]=q'}, at: '+[[2p]]', text: 'p for q'}
      - say: 'Divide by 6. Minus 9 over 6 simplifies to minus 3 over 2. And since $q$ equals $p$, $q$ is minus 3 over 2 as well.'
        write: '$p = -\dfrac{9}{6} = -\dfrac{3}{2}, \quad q = -\dfrac{3}{2}$'
      - say: 'Now add them. Minus 3 over 2 plus minus 3 over 2 is minus 6 over 2, which is minus 3.'
        write: '$p + q = -\dfrac{3}{2} - \dfrac{3}{2} = -\dfrac{6}{2} = -3$'
      - say: 'So $p$ plus $q$ is minus 3, which is answer choice B.'
        write: '$p + q = -3$'
        answer: true
    traps:
      A: 'You went for 0. $p$ and $q$ are equal, not opposite, so they don''t cancel. Both are minus 3 over 2, and their sum is minus 3.'
      C: 'You went for 3. The size is right, but the sign isn''t: $6p = -9$, so $p$ and $q$ are both negative, and the sum is minus 3.'
