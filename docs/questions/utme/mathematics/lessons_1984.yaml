      B: 'You went for $x$ over $y$. That''s sin theta, which we were given. 1 over tan theta is adjacent over opposite.'
      D: 'You went for option D. That''s hypotenuse over adjacent, which is 1 over cos theta. We want adjacent over opposite.'
      E: 'You went for option E. That''s adjacent over hypotenuse, which is cos theta. 1 over tan theta puts the opposite side, $x$, underneath.'
