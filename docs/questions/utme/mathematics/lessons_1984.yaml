        write: 'Product: $\ \alpha\beta = (1 - \sqrt{13})(1 + \sqrt{13}) = 1^{2} - (\sqrt{13})^{2}$'
      - say: '1 squared is 1, and root 13 squared is 13. 1 minus 13 is minus 12.'
