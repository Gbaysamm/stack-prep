      - say: 'Now put the top over the bottom. The 3 to the $n$ minus 1 cancels.'
        write: '$\dfrac{2 \times 3^{n-1}}{54 \times 3^{n-1}} = \dfrac{2}{54}$'
      - say: 'Divide top and bottom by 2: one over 27.'
        write: '$= \dfrac{1}{27}$'
      - say: 'A quick test with $n$ equals 1: the top is 3 minus 1, which is 2, and the bottom is 81 minus 27, which is 54. 2 over 54 is one over 27.'
