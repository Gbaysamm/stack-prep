        write: '$P = \dfrac{\text{favourable}}{\text{possible}}$'
      - say: 'There are 300 numbers to choose from, all equally likely.'
        write: 'Possible outcomes $= 300$'
      - say: 'The favourable ones are the multiples of 4: 4, 8, 12, and so on, up to 300.'
        write: 'Multiples of 4: $\ 4, 8, 12, \ldots, 300$'
      - say: 'How many are there? They are 4 times 1, 4 times 2, and so on. 300 divided by 4 is 75, so the last one, 300, is 4 times 75.'
        write: '$300 \div 4 = 75$, so $300 = 4 \times 75$'
      - say: 'So the multiples run from 4 times 1 up to 4 times 75. That is 75 favourable numbers.'
        write: 'Favourable outcomes $= 75$'
