        write: 'Sides $x + 4,\ x,\ x - 4$; $\ \cos(\text{largest angle}) = \dfrac{1}{5}$'
      - say: 'Let me draw a diagram of this, to make it simpler to see.'
        show_sketch: true
        point:
          - {figure: sketch, kind: highlight, target: BC, text: 'x + 4'}
          - {figure: sketch, kind: highlight, target: AC, text: 'x'}
          - {figure: sketch, kind: highlight, target: AB, text: 'x − 4'}
      - say: 'Here''s the key fact: the largest angle is always opposite the longest side. The longest side is $x$ plus 4, so call the angle opposite it theta.'
        write: 'Largest angle $\theta$ is opposite $x + 4$'
        point:
          - {figure: sketch, kind: highlight, target: BC, text: 'longest'}
          - {figure: sketch, kind: arc, target: BAC, text: 'θ'}
      - say: 'The cosine rule links an angle to the three sides: the two sides around the angle, squared and added, minus the opposite side squared, all over twice the two sides around it.'
        write: 'Cosine rule: $\ \cos\theta = \dfrac{b^{2} + c^{2} - a^{2}}{2bc}$'
        point:
          - {figure: sketch, kind: arc, target: BAC, text: 'θ'}
      - say: 'Here the sides around theta are $x$ and $x$ minus 4, and the side opposite it is $x$ plus 4.'
        write: '$\cos\theta = \dfrac{x^{2} + (x - 4)^{2} - (x + 4)^{2}}{2x(x - 4)}$'
        point:
          - {line: 3, kind: box, text: 'the rule'}
          - {figure: sketch, kind: highlight, target: AC, text: 'around θ'}
          - {figure: sketch, kind: highlight, target: AB, text: 'around θ'}
      - say: 'Let''s tidy the top. $x$ minus 4, squared, is $x$ squared minus $8x$ plus 16.'
