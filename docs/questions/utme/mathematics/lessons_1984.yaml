      - say: 'Multiply both sides by 4: 36 times 4 is 144.'
        write: '$144 = 9k$'
      - say: 'Divide both sides by 9: 144 divided by 9 is 16.'
        write: '$k = 16$'
      - say: 'So the rule is $p$ equals 16 $q$ squared over $r$.'
        write: '$p = \dfrac{16q^{2}}{r}$'
      - say: 'Now use $q$ equals 5 and $r$ equals 2.'
        write: '$p = \dfrac{16 \times 5^{2}}{2}$'
      - say: '5 squared is 25, and 16 times 25 is 400.'
        write: '$p = \dfrac{400}{2}$'
      - say: '400 divided by 2 is 200.'
        write: '$p = 200$'
      - say: 'So $p$ is 200, which is answer choice D.'
        write: '$p = 200$'
        answer: true
