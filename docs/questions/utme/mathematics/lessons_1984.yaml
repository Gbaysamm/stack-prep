      - say: '1 over $p$ is 2 over 3, and 1 over $pq$ is 1 over 3. So $t$ is 2 over 3 minus 1 over 3, which is 1 over 3. And 1 over $q$ plus 1 is 1 over 3 too.'
        write: '$t = \dfrac{2}{3} - \dfrac{1}{3} = \dfrac{1}{3} = \dfrac{1}{2 + 1}$'
