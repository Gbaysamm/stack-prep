        write: 'SOH: $\sin\theta = \dfrac{\text{opposite}}{\text{hypotenuse}}$'
      - say: 'Sine is opposite over hypotenuse. So draw a triangle where the side opposite theta is $x$ and the hypotenuse is $y$.'
        write: 'Opposite $= x$, hypotenuse $= y$'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: x, text: 'opposite'}
          - {figure: sketch, kind: circle, target: y, text: 'hypotenuse'}
      - say: 'Pythagoras: the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hypotenuse}^{2} = \text{opposite}^{2} + \text{adjacent}^{2}$'
      - say: 'We need the third side, the adjacent. By Pythagoras, the two shorter sides squared and added make the hypotenuse squared.'
        write: '$x^{2} + (\text{adjacent})^{2} = y^{2}$'
        point:
          - {figure: sketch, kind: highlight, target: AC, text: 'adjacent'}
          - {figure: sketch, kind: highlight, target: AB, text: 'hypotenuse'}
      - say: 'Take $x$ squared from both sides.'
        write: '$(\text{adjacent})^{2} = y^{2} - x^{2}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: 'x2+'}, at: '−x2', text: 'across'}
      - say: 'Take the square root. The side is a length, so it is positive.'
        write: 'Adjacent $= \sqrt{y^{2} - x^{2}}$'
        point:
          - {figure: sketch, kind: label, target: '?', text: '√(y² − x²)'}
      - say: 'Now tan theta is opposite over adjacent. Using our sides, that is $x$ over the root of $y$ squared minus $x$ squared.'
        write: '$\tan\theta = \dfrac{\text{opposite}}{\text{adjacent}} = \dfrac{x}{\sqrt{y^{2} - x^{2}}}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: 'y2−x2'}, at: 'y2−x2', text: 'adjacent'}
      - say: '1 over tan theta turns that fraction upside down: adjacent over opposite.'
        write: '$\dfrac{1}{\tan\theta} = \dfrac{\text{adjacent}}{\text{opposite}} = \dfrac{\sqrt{y^{2} - x^{2}}}{x}$'
      - say: 'Let''s check with a 3, 4, 5 triangle. If $x$ is 3 and $y$ is 5, the adjacent side is the root of 25 minus 9, which is root 16, or 4.'
        write: 'Check $x = 3,\ y = 5$: $\ \sqrt{25 - 9} = \sqrt{16} = 4$'
        point:
