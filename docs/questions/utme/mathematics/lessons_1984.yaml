          - {figure: sketch, kind: label, target: AB, text: '5'}
          - {figure: sketch, kind: label, target: AC, text: '4'}
      - say: 'So our answer gives 4 over 3. And tan theta is 3 over 4, whose upside-down is indeed 4 over 3.'
        write: '$\dfrac{1}{\tan\theta} = \dfrac{4}{3}$, and $\tan\theta = \dfrac{3}{4}$'
      - say: 'So 1 over tan theta is the root of $y$ squared minus $x$ squared, over $x$, which is answer choice C.'
        write: 'Answer: $\ \dfrac{1}{\tan\theta} = \dfrac{\sqrt{y^{2} - x^{2}}}{x}$'
        answer: true
    traps:
