      D: 'You went for 4 over 300. That puts the divisor 4 on top instead of the count of multiples. There are 75 multiples of 4, so the probability is 75 over 300, which is 1 over 4.'
      E: 'You went for 1 over 300. That''s the chance of one particular number. Many numbers work, 75 of them, so the probability is 75 over 300, which is 1 over 4.'
  10:
