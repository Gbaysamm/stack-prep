      - say: 'And we''re told the angle at $R$ in the small triangle equals the angle at $S$ in the big one. Two pairs of equal angles make the triangles similar.'
        write: 'Given $\angle PRQ = \angle PST$, so $\triangle PRQ \sim \triangle PST$'
        point:
          - {figure: 0, kind: arc, target: PRQ}
          - {figure: 0, kind: arc, target: PST, text: 'equal'}
      - say: 'Now match the corners by their equal angles. $P$ goes with $P$, $R$ goes with $S$, and so the last pair, $Q$, goes with $T$.'
        write: 'Matching corners: $\ P \leftrightarrow P,\quad R \leftrightarrow S,\quad Q \leftrightarrow T$'
      - say: 'That tells us which sides go together. $PR$ matches $PS$, and $RQ$ matches $ST$.'
        write: 'Matching sides: $\ PR \leftrightarrow PS,\quad RQ \leftrightarrow ST$'
        point:
          - {figure: 0, kind: highlight, target: PR}
          - {figure: 0, kind: highlight, target: PS}
      - say: 'In similar triangles, matching sides are in the same ratio.'
        write: '$\dfrac{PR}{PS} = \dfrac{RQ}{ST}$'
