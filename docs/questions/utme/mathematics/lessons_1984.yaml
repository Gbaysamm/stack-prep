          - {line: 6, kind: move, from: {line: 0, at: 'QR=[[8]]'}, at: '12[[8]]', text: 'RQ'}
          - {line: 6, kind: move, from: {line: 0, at: 'ST=[[12]]'}, at: '[[12]]8', text: 'ST'}
      - say: 'Cross-multiply: 8 times $PS$ equals 6 times 12, which is 72.'
        write: '$8 \times PS = 6 \times 12 = 72$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '[[PS]]6'}, at: '×[[PS]]', text: 'across'}
          - {line: 7, kind: move, from: {line: 6, at: '[[12]]8'}, at: '×[[12]]', text: 'across'}
      - say: 'Divide both sides by 8. 72 divided by 8 is 9.'
        write: '$PS = \dfrac{72}{8} = 9$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '[[8]]×PS'}, at: '[[8]]72', text: 'divide'}
      - say: 'Check the scale: the big triangle is 12 over 8, which is 1.5 times the small one, and 6 times 1.5 is 9.'
        write: 'Check: $\ \dfrac{12}{8} = 1.5,\quad 6 \times 1.5 = 9$'
