# UTME 1984 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1984.yaml. Answers match that file.
# This is a five-option paper (A-E), so each question has four traps.
format_version: 1
exam_year: 1984
lessons:
  1:
    moments:
      - say: 'We have a big stacked fraction to simplify. The plan is to work out the top on its own, then the bottom on its own, and divide at the end.'
        write: '$\dfrac{\left(\frac{2}{3} - \frac{1}{5}\right) - \frac{1}{3} \text{ of } \frac{2}{5}}{3 - \dfrac{1}{1/2}}$'
      - say: 'Start with the bracket on top: $\tfrac{2}{3}$ minus $\tfrac{1}{5}$. The common denominator is 15.'
        write: '$\tfrac{2}{3} - \tfrac{1}{5} = \tfrac{10}{15} - \tfrac{3}{15}$'
      - say: '10 fifteenths minus 3 fifteenths is 7 fifteenths.'
        write: '$= \tfrac{7}{15}$'
      - say: 'Next, "of" means multiply. So $\tfrac{1}{3}$ of $\tfrac{2}{5}$ is 1 times 2 over 3 times 5, which is 2 fifteenths.'
        write: '$\tfrac{1}{3} \times \tfrac{2}{5} = \tfrac{2}{15}$'
      - say: 'Now the whole top is 7 fifteenths minus 2 fifteenths, which is 5 fifteenths.'
        write: '$\tfrac{7}{15} - \tfrac{2}{15} = \tfrac{5}{15}$'
      - say: '5 goes into 5 once and into 15 three times, so the top is one third.'
        write: '$\text{top} = \tfrac{1}{3}$'
      - say: 'Now the bottom. What is 1 divided by a half? It asks how many halves are in 1, and there are 2.'
        write: '$\dfrac{1}{1/2} = 2$'
      - say: 'So the bottom is 3 minus 2, which is 1.'
        write: '$\text{bottom} = 3 - 2 = 1$'
      - say: 'Now divide the top by the bottom. One third divided by 1 is still one third.'
        write: '$\dfrac{1/3}{1} = \tfrac{1}{3}$'
      - say: 'So the expression simplifies to one third, which is answer choice C.'
        write: '$\tfrac{1}{3}$'
        answer: true
    traps:
      A: 'You went for $\tfrac{1}{7}$. The 7 comes from the bracket, $\tfrac{7}{15}$, but we still have to take away $\tfrac{2}{15}$ for the "of" part. The top ends up as $\tfrac{1}{3}$, and the bottom is 1.'
      B: 'You went for 7. That number only appears inside the bracket, $\tfrac{7}{15}$. Finish the top to get $\tfrac{1}{3}$, and the bottom is 3 minus 2, which is 1.'
      D: 'You went for 3. That''s the answer turned upside down. The top is $\tfrac{1}{3}$ and the bottom is 1, so the answer is $\tfrac{1}{3}$, not 3.'
      E: 'You went for $\tfrac{1}{5}$. Remember that 1 divided by a half is 2, not a half, so the bottom is 3 minus 2, which is 1. The top is $\tfrac{1}{3}$, so the answer is $\tfrac{1}{3}$.'
  2:
    moments:
      - say: 'We are told that 263 plus 441 equals 714 in some base, and we need to find that base. The carries will give it away.'
        write: '$263 + 441 = 714$'
      - say: 'Remember, in base $b$ you carry whenever a column reaches $b$, not 10. So let''s add column by column, starting from the units.'
      - say: 'Units column: 3 plus 1 is 4, and the answer shows 4. No carry there.'
        write: '$3 + 1 = 4$'
      - say: 'Middle column: 6 plus 4 is 10 in ordinary counting.'
        write: '$6 + 4 = 10$'
      - say: 'But the answer shows 1 in that column, and something was carried into the next. So 10 must be one whole base plus 1.'
        write: '$b + 1 = 10$'
      - say: 'Take 1 from both sides, and the base is 9.'
        write: '$b = 9$'
      - say: 'Let''s check the last column: 2 plus 4 is 6, plus the carried 1 makes 7. The answer shows 7. That fits.'
        write: '$2 + 4 + 1 = 7$'
      - say: 'To be completely sure, change each number to base ten. 263 in base 9 is 2 times 81, plus 6 times 9, plus 3. That is 162 plus 54 plus 3, which is 219.'
        write: '$263_{9} = 162 + 54 + 3 = 219$'
      - say: '441 in base 9 is 4 times 81, plus 4 times 9, plus 1. That is 324 plus 36 plus 1, which is 361.'
        write: '$441_{9} = 324 + 36 + 1 = 361$'
      - say: '714 in base 9 is 7 times 81, plus 1 times 9, plus 4. That is 567 plus 9 plus 4, which is 580.'
        write: '$714_{9} = 567 + 9 + 4 = 580$'
      - say: 'And 219 plus 361 is 580. It checks out.'
        write: '$219 + 361 = 580$'
      - say: 'So the base used is 9, which is answer choice D.'
        write: '$\text{base } 9$'
        answer: true
    traps:
      A: 'You went for 12. In base 12, 6 plus 4 is 10, which is less than the base, so there would be no carry and no 1 in the middle. The carry tells us 10 is the base plus 1, so the base is 9.'
      B: 'You went for 11. In base 11 there is still no carry from 6 plus 4, because 10 is less than 11. The middle column shows a carry, so 10 must be the base plus 1, which makes the base 9.'
      C: 'You went for 10. In ordinary base ten, 263 plus 441 is 704, not 714. The middle column would show 0, not 1.'
      E: 'You went for 8. In base 8, 6 plus 4 is one 8 and 2 left over, so the middle column would show 2, not 1. We need 10 to be the base plus 1, so the base is 9.'
  3:
    moments:
      - say: 'We are dividing a tiny number by a huge number, and we want the answer in standard form, $k$ times 10 to the $n$, with $k$ between 1 and 10.'
        write: '$\dfrac{0.00014323}{1{,}940{,}000} = k \times 10^{n}$'
      - say: 'The plan: put both numbers in standard form first. For the top, move the point 4 places to the right to get 1.4323, so the power is negative 4.'
        write: '$0.00014323 = 1.4323 \times 10^{-4}$'
      - say: 'For the bottom, move the point 6 places to the left to get 1.94, so the power is positive 6.'
        write: '$1{,}940{,}000 = 1.94 \times 10^{6}$'
      - say: 'Now the fraction becomes 1.4323 over 1.94, times 10 to the negative 4 over 10 to the 6.'
        write: '$\dfrac{1.4323}{1.94} \times \dfrac{10^{-4}}{10^{6}}$'
      - say: 'Divide the powers of ten by subtracting the indices: negative 4 minus 6 is negative 10.'
        write: '$\dfrac{10^{-4}}{10^{6}} = 10^{-10}$'
      - say: 'Now divide the numbers. 1.4323 divided by 1.94 is 0.7383. You can check: 1.94 times 0.7383 is 1.4323.'
        write: '$1.4323 \div 1.94 = 0.7383$'
      - say: 'So far we have 0.7383 times 10 to the negative 10.'
        write: '$0.7383 \times 10^{-10}$'
      - say: 'But that isn''t standard form yet, because 0.7383 is less than 1. Move the point one place to the right, and lower the power by one to make up for it.'
        write: '$= 7.383 \times 10^{-11}$'
      - say: 'So $k$ is 7.383 and $n$ is negative 11, which is answer choice A.'
        write: '$k = 7.383,\ n = -11$'
        answer: true
    traps:
      B: 'You went for 2.34 and 10. Dividing a tiny number by a huge one gives a very small answer, so the power of ten must be negative. The quotient is $7.383 \times 10^{-11}$.'
      C: 'You went for 3.87 and 2. The power can''t be positive here: a tiny number divided by a big one is tiny. Write both in standard form, then subtract the indices, negative 4 minus 6.'
      D: 'You went for 7.831 and negative 11. The power is right, but the digits are swapped. 1.4323 divided by 1.94 is 0.7383, so $k$ is 7.383.'
      E: 'You went for 5.41 and negative 2. Put both numbers in standard form: the top is $10^{-4}$ and the bottom is $10^{6}$, so the powers give $10^{-10}$ before the final adjustment to $10^{-11}$.'
  4:
    moments:
      - say: 'P sold a bicycle to Q at a 10% profit, then Q sold it to R for ₦209 at a 5% loss. We want what P paid. The neatest way is to work backwards, one sale at a time.'
        write: 'Q sold to R for ₦209'
      - say: 'Remember, a profit or a loss is always a percentage of the seller''s own cost. Q lost 5%, so Q got back 100 minus 5, which is 95% of what Q paid.'
        write: '$100\% - 5\% = 95\%$'
      - say: 'So 95% of Q''s cost is 209. As a decimal, that is 0.95 times Q''s cost.'
        write: '$0.95 \times Q = 209$'
      - say: 'Divide both sides by 0.95.'
        write: '$Q = \dfrac{209}{0.95}$'
      - say: 'Multiply top and bottom by 100 to clear the decimal: 20,900 over 95. 95 times 220 is 20,900, so Q paid ₦220.'
        write: '$Q = \dfrac{20{,}900}{95} = 220$'
      - say: 'Now step back once more. Q paid ₦220 to P, and P made a 10% profit. So ₦220 is 100 plus 10, which is 110% of what P paid.'
        write: '$1.10 \times P = 220$'
      - say: 'Divide both sides by 1.10.'
        write: '$P = \dfrac{220}{1.10}$'
      - say: 'Multiply top and bottom by 10: 2,200 over 11. 11 times 200 is 2,200, so P paid ₦200.'
        write: '$P = \dfrac{2{,}200}{11} = 200$'
      - say: 'Let''s check forwards. ₦200 plus 10% is ₦220. Then 5% of 220 is 11, and 220 minus 11 is 209. That matches.'
        write: '$200 \to 220 \to 209$'
      - say: 'So the bicycle cost P ₦200, which is answer choice A.'
        write: 'Cost to P: ₦200'
        answer: true
    traps:
      B: 'You went for ₦196. Each percentage has to be undone on its own base. Divide ₦209 by 0.95 to get ₦220, then divide by 1.10 to get ₦200.'
      C: 'You went for ₦180. That doesn''t come from undoing the sales. ₦209 is 95% of ₦220, and ₦220 is 110% of ₦200.'
      D: 'You went for ₦205. The two percentages can''t just be combined. Undo the 5% loss first to get ₦220, then undo the 10% profit to get ₦200.'
      E: 'You went for ₦150. That''s far too low: 10% profit on ₦150 would only be ₦165. Work backwards: ₦209 divided by 0.95 is ₦220, and ₦220 divided by 1.10 is ₦200.'
  5:
    moments:
      - say: 'Oranges go up by half a kobo each, and then ₦2.40 buys 16 fewer oranges. We want the present price. Let''s call the present price $p$ kobo.'
        write: '$\text{present price} = p \text{ kobo}$'
      - say: 'First, change naira to kobo. ₦2.40 is 240 kobo. So right now, a customer can buy 240 divided by $p$ oranges.'
        write: '$\text{now: } \dfrac{240}{p}$'
      - say: 'After the rise, each orange costs $p$ plus a half, so the customer buys 240 divided by $p$ plus a half.'
        write: '$\text{after: } \dfrac{240}{p + \frac{1}{2}}$'
      - say: 'The second number is 16 less than the first. So the first minus the second is 16.'
        write: '$\dfrac{240}{p} - \dfrac{240}{p + \frac{1}{2}} = 16$'
      - say: 'Combine the left side over the common denominator $p$ times $p$ plus a half. On top, the $240p$ cancels, leaving 240 times a half, which is 120.'
        write: '$\dfrac{120}{p\left(p + \frac{1}{2}\right)} = 16$'
      - say: 'Multiply both sides by the bottom. $p$ times $p$ plus a half is $p$ squared plus half $p$, and 16 times that is $16p^{2} + 8p$.'
        write: '$120 = 16p^{2} + 8p$'
      - say: 'Bring everything to one side, and divide every term by 8. 16 over 8 is 2, 8 over 8 is 1, and 120 over 8 is 15.'
        write: '$2p^{2} + p - 15 = 0$'
      - say: 'Now factorise. We need two numbers that multiply to 2 times negative 15, which is negative 30, and add to 1. Those are 6 and negative 5.'
        write: '$2p^{2} + 6p - 5p - 15 = 0$'
      - say: 'Group them: $2p$ times $p$ plus 3, minus 5 times $p$ plus 3.'
        write: '$(2p - 5)(p + 3) = 0$'
      - say: 'So $p$ is 5 over 2, or negative 3. A price can''t be negative, so $p$ is 5 over 2, which is two and a half kobo.'
        write: '$p = \tfrac{5}{2} = 2\tfrac{1}{2}$'
      - say: 'Let''s check. At two and a half kobo, 240 kobo buys 96 oranges. At 3 kobo, it buys 80. And 96 minus 80 is 16.'
        write: '$96 - 80 = 16$'
      - say: 'So the present price is two and a half kobo, which is answer choice A.'
        write: '$2\tfrac{1}{2}\text{k}$'
        answer: true
    traps:
      B: 'You went for three and a half kobo. At that price, 240 kobo buys about 68 oranges, and the difference after a half-kobo rise is not 16. The equation gives $p = 2\tfrac{1}{2}$.'
      C: 'You went for five and a half kobo. Remember the 16 counts oranges, not kobo. Set the difference in the numbers of oranges equal to 16, and you get $p = 2\tfrac{1}{2}$.'
      D: 'You went for 20 kobo. At 20 kobo, 240 kobo buys only 12 oranges, so it couldn''t fall by 16. Solve $2p^{2} + p - 15 = 0$ to get $2\tfrac{1}{2}$.'
      E: 'You went for twenty-one and a half kobo. That price buys fewer than 12 oranges, so 16 fewer is impossible. The present price is $2\tfrac{1}{2}$ kobo.'
  6:
    moments:
      - say: 'A man put ₦50,000 into two companies paying 6% and 8%, and got ₦3,700 in total. We want how much he put in at 8%.'
        write: 'Total: ₦50,000, yield: ₦3,700'
      - say: 'The trick is to name one part and write the other as what''s left. Let $x$ be the amount at 8%. Then the amount at 6% is 50,000 minus $x$.'
        write: '$\text{at } 8\%: x, \quad \text{at } 6\%: 50{,}000 - x$'
      - say: 'The two yields add up to 3,700. 8% of $x$ is $0.08x$, and 6% of the rest is 0.06 times 50,000 minus $x$.'
        write: '$0.08x + 0.06(50{,}000 - x) = 3{,}700$'
      - say: 'Expand the bracket. 0.06 times 50,000 is 3,000, and 0.06 times $x$ is $0.06x$.'
        write: '$0.08x + 3{,}000 - 0.06x = 3{,}700$'
      - say: 'Collect the $x$ terms: 0.08 minus 0.06 is 0.02.'
        write: '$0.02x + 3{,}000 = 3{,}700$'
      - say: 'Subtract 3,000 from both sides. 3,700 minus 3,000 is 700.'
        write: '$0.02x = 700$'
      - say: 'Divide both sides by 0.02. Dividing by 0.02 is the same as multiplying by 50, and 700 times 50 is 35,000.'
        write: '$x = 35{,}000$'
      - say: 'Let''s check. 8% of 35,000 is 2,800. The rest is 15,000, and 6% of that is 900. 2,800 plus 900 is 3,700.'
        write: '$2{,}800 + 900 = 3{,}700$'
      - say: 'So he invested ₦35,000 at 8%, which is answer choice E.'
        write: 'At 8%: ₦35,000'
        answer: true
    traps:
      A: 'You went for ₦15,000. That''s the amount at 6%, the other part of the money. Our $x$ was the amount at 8%, which is ₦35,000.'
      B: 'You went for ₦29,600. 8% of that is ₦2,368, and 6% of the rest is ₦1,224, which only adds to ₦3,592. The equation gives ₦35,000.'
      C: 'You went for ₦21,400. Set up the yields: $0.08x + 0.06(50{,}000 - x) = 3{,}700$. That simplifies to $0.02x = 700$, so $x$ is ₦35,000.'
      D: 'You went for ₦27,800. Check it: the yields would add to ₦3,556, not ₦3,700. Solve $0.02x = 700$ to get ₦35,000.'
  7:
    moments:
      - say: '30 boys averaged 6, and $x$ girls averaged 8, and the total score was 468. We want $x$. With different group sizes, the safe way is to work with totals.'
        write: '$\text{total} = 468$'
      - say: 'Here''s the idea: a mean times the number of people gives the total. So the boys'' total is 30 times 6, which is 180.'
        write: '$\text{boys: } 30 \times 6 = 180$'
      - say: 'The girls'' total is $x$ times 8, which is $8x$.'
        write: '$\text{girls: } 8x$'
      - say: 'Together they make the grand total of 468.'
        write: '$180 + 8x = 468$'
      - say: 'Subtract 180 from both sides. 468 minus 180 is 288.'
        write: '$8x = 288$'
      - say: 'Divide both sides by 8. 288 divided by 8 is 36.'
        write: '$x = 36$'
      - say: 'Let''s check. 8 times 36 is 288, and 180 plus 288 is 468. That works.'
        write: '$180 + 288 = 468$'
      - say: 'So there were 36 girls, which is answer choice C.'
        write: '$x = 36$'
        answer: true
    traps:
      A: 'You went for 38. Then the girls would score 8 times 38, which is 304, and the total would be 484, not 468. The girls'' total must be 288, so $x$ is 36.'
      B: 'You went for 24. Then the girls would score only 192, and the total would be 372. Work with totals: $180 + 8x = 468$ gives $x = 36$.'
      D: 'You went for 22. The boys'' total is 30 times 6, which is 180, leaving 288 for the girls. 288 divided by 8 is 36.'
      E: 'You went for 41. The two means can''t just be averaged, because the groups are different sizes. Use totals: $180 + 8x = 468$, so $x = 36$.'
  8:
    moments:
      - say: 'We have four costs, and we want the angle for labour in a pie chart. A pie chart gives each item the same fraction of 360 degrees as it has of the total.'
        write: '$70,\ 15,\ 30,\ 5$'
      - say: 'So first, the total cost. 70 plus 15 is 85, plus 30 is 115, plus 5 is 120. The total is ₦120.'
        write: '$70 + 15 + 30 + 5 = 120$'
      - say: 'Labour is ₦70 out of ₦120.'
        write: '$\text{labour} = \dfrac{70}{120}$'
      - say: 'So its angle is 70 over 120 of 360 degrees.'
        write: '$\dfrac{70}{120} \times 360^{\circ}$'
      - say: '360 divided by 120 is 3, so each naira is worth 3 degrees.'
        write: '$\dfrac{360}{120} = 3$'
      - say: 'So labour gets 70 times 3, which is 210 degrees.'
        write: '$70 \times 3 = 210^{\circ}$'
      - say: 'Let''s check. Power is 45 degrees, materials 90, miscellaneous 15. 210 plus 45 plus 90 plus 15 is 360.'
        write: '$210 + 45 + 90 + 15 = 360$'
      - say: 'So the labour sector is 210 degrees, which is answer choice A.'
        write: '$210^{\circ}$'
        answer: true
    traps:
      B: 'You went for 105 degrees. That''s half the right angle. Each naira is worth 360 over 120, which is 3 degrees, so labour gets 70 times 3, which is 210.'
      C: 'You went for 175 degrees. That would be the angle if each naira were worth 2.5 degrees. The total is 120, so each naira is worth 3 degrees, and 70 times 3 is 210.'
      D: 'You went for 150 degrees. Add up the whole cost first: it''s ₦120. Then labour gets 70 over 120 of 360, which is 210 degrees.'
      E: 'You went for 90 degrees. That''s the sector for materials, ₦30 times 3. The question asks for labour, ₦70, which is 210 degrees.'
  9:
    moments:
      - say: 'Bola picks a number from 1 to 300, and we want the chance that it divides by 4. Probability is the number of favourable outcomes over the number of possible ones.'
        write: '$P = \dfrac{\text{favourable}}{\text{possible}}$'
      - say: 'There are 300 numbers, all equally likely.'
        write: '$\text{possible} = 300$'
      - say: 'Now count the numbers divisible by 4. They are 4, 8, 12, and so on, up to 300.'
        write: '$4, 8, 12, \ldots, 300$'
      - say: 'That''s 4 times 1, 4 times 2, all the way to 4 times 75, because 300 divided by 4 is 75. So there are 75 of them.'
        write: '$300 \div 4 = 75$'
      - say: 'So the probability is 75 over 300.'
        write: '$P = \dfrac{75}{300}$'
      - say: '75 goes into 300 exactly 4 times, so this simplifies to one quarter.'
        write: '$= \tfrac{1}{4}$'
      - say: 'That makes sense: every fourth number is a multiple of 4. So the probability is one quarter, which is answer choice B.'
        write: '$\tfrac{1}{4}$'
        answer: true
    traps:
      A: 'You went for $\tfrac{1}{3}$. That would be the chance of a multiple of 3. Multiples of 4 come every fourth number, so there are 75 of them, and 75 over 300 is $\tfrac{1}{4}$.'
      C: 'You went for $\tfrac{1}{5}$. That would be the chance of a multiple of 5. There are 75 multiples of 4 up to 300, and 75 over 300 is $\tfrac{1}{4}$.'
      D: 'You went for $\tfrac{4}{300}$. That puts the divisor 4 on top instead of the count of multiples. There are 75 multiples of 4, so the probability is 75 over 300, which is $\tfrac{1}{4}$.'
      E: 'You went for $\tfrac{1}{300}$. That''s the chance of one particular number. Many numbers work, 75 of them, so the probability is $\tfrac{75}{300} = \tfrac{1}{4}$.'
  10:
    moments:
      - say: 'We have three logarithms to work out without tables. For each one, ask: what power of the base gives this number?'
        write: '$\dfrac{\log_{3}27 - \log_{1/4}64}{\log_{3}\frac{1}{81}}$'
      - say: 'First, log base 3 of 27. 3 cubed is 27, so the answer is 3.'
        write: '$\log_{3}27 = 3 \quad (3^{3} = 27)$'
      - say: 'Now the tricky one, log base a quarter of 64. We want a power $n$ so that a quarter to the $n$ is 64.'
        write: '$\left(\tfrac{1}{4}\right)^{n} = 64$'
      - say: '64 is 4 cubed. And a quarter is 4 to the negative 1, so a quarter to the $n$ is 4 to the negative $n$.'
        write: '$4^{-n} = 4^{3}$'
      - say: 'So negative $n$ is 3, which means $n$ is negative 3.'
        write: '$\log_{1/4}64 = -3$'
      - say: 'Now the bottom, log base 3 of one over 81. 3 to the 4 is 81, so one over 81 is 3 to the negative 4.'
        write: '$\log_{3}\tfrac{1}{81} = -4 \quad (3^{-4} = \tfrac{1}{81})$'
      - say: 'Put all three back in. The top is 3 minus negative 3, and the bottom is negative 4.'
        write: '$\dfrac{3 - (-3)}{-4}$'
      - say: '3 minus negative 3 is 3 plus 3, which is 6.'
        write: '$= \dfrac{6}{-4}$'
      - say: 'Divide top and bottom by 2: negative 3 over 2.'
        write: '$= -\dfrac{3}{2}$'
      - say: 'So the value is negative three halves, which is answer choice C.'
        write: '$-\tfrac{3}{2}$'
        answer: true
    traps:
      A: 'You went for $\tfrac{7}{4}$. The bottom, log base 3 of $\tfrac{1}{81}$, is negative 4, so the answer must be negative. And the top is 3 minus negative 3, which is 6, giving $-\tfrac{3}{2}$.'
      B: 'You went for $-\tfrac{7}{4}$. The bottom is right, but the top is 3 minus negative 3, which is 6, not 7. Six over negative 4 is $-\tfrac{3}{2}$.'
      D: 'You went for $\tfrac{7}{3}$. Work each log separately: they are 3, negative 3 and negative 4. Then 6 over negative 4 is $-\tfrac{3}{2}$.'
      E: 'You went for $-\tfrac{1}{4}$. A base less than 1 needs a negative power to give a number bigger than 1, so log base a quarter of 64 is negative 3. The top is then 6, and 6 over negative 4 is $-\tfrac{3}{2}$.'
  11:
    moments:
      - say: 'A point moves so that every time $x$ goes up by 1, $y$ goes up by 4, and it passes through 0, negative 3. We want the equation of its graph.'
        write: '$(0,\ -3)$'
      - say: 'A steady rate of change means a straight line. The gradient is the change in $y$ over the change in $x$: 4 over 1, which is 4.'
        write: '$m = \dfrac{4}{1} = 4$'
      - say: 'The point 0, negative 3 is where $x$ is zero, so it sits on the $y$-axis. That makes negative 3 the $y$-intercept.'
        write: '$c = -3$'
      - say: 'A straight line is $y$ equals $mx$ plus $c$. Put in 4 for $m$ and negative 3 for $c$.'
        write: '$y = 4x - 3$'
      - say: 'None of the options looks exactly like this, so let''s rearrange. Add 3 to both sides.'
        write: '$y + 3 = 4x$'
      - say: 'Let''s check. When $x$ is 0, $y$ is 0 minus 3, which is negative 3. When $x$ is 1, $y$ is 4 minus 3, which is 1. That''s a rise of 4, just as we were told.'
        write: '$x = 0: y = -3; \quad x = 1: y = 1$'
      - say: 'So the equation is $y$ plus 3 equals $4x$, which is answer choice D.'
        write: '$y + 3 = 4x$'
        answer: true
    traps:
      A: 'You went for $-3 = \dfrac{y + 4}{x + 1}$. That mixes the point and the rise into one fraction. The line has gradient 4 and passes through 0, negative 3, so it is $y = 4x - 3$, or $y + 3 = 4x$.'
      B: 'You went for $4y = -3 + x$. That line has gradient one quarter, the rate the wrong way round. The gradient is the change in $y$ over the change in $x$, which is 4.'
      C: 'You went for $\dfrac{y}{x} = -\dfrac{3}{4}$. That doesn''t even pass through 0, negative 3. The line is $y = 4x - 3$.'
      E: 'You went for $4y = x + 3$. That has gradient one quarter, and at $x = 0$ it gives $y = \tfrac{3}{4}$. The line we want rises 4 for every 1 across and starts at negative 3.'
  12:
    moments:
      - say: 'A trader in a base-five country bought $103_{5}$ oranges at $\text{M}14_{5}$ each and sold them at $\text{M}24_{5}$ each. We want his gain, in base five.'
