        write: '$SP = 9$ cm'
        point:
          - {figure: 0, kind: label, target: PS, text: '9 cm'}
        answer: true
    traps:
      A: 'You went for 4 cm. That matches the sides the wrong way round, 6 times 8 over 12. The equal angles are at $R$ and $S$, so $PR$ goes with $PS$: 6 over $PS$ equals 8 over 12, giving 9.'
      B: 'You went for 16 cm. That comes from 8 times 12 over 6, which puts $QR$ with $PS$. Match by the equal angles: $PR$ with $PS$, and $RQ$ with $ST$.'
      D: 'You went for 14 cm. The sides must be in the same ratio: 6 over $PS$ equals 8 over 12, so $PS$ is 72 over 8, which is 9.'
      E: 'You went for impossible. Two equal angles are enough to make the triangles similar, and then the given sides give $PS = 9$.'
  45:
