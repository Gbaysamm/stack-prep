# UTME 1984 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1984.yaml. Answers match that file.
# This is a five-option paper (A-E), so each question has four traps.
format_version: 1
exam_year: 1984
lessons:
  1:
    moments:
      - say: 'We have a stacked fraction to simplify. The plan is to work out the top on its own, then the bottom on its own, and divide at the end.'
        write: '$\dfrac{\left(\frac{2}{3} - \frac{1}{5}\right) - \frac{1}{3} \text{ of } \frac{2}{5}}{3 - \dfrac{1}{1/2}}$'
      - say: 'Start with the bracket on the top: 2 over 3 minus 1 over 5. To subtract fractions we need a common denominator, and the smallest one for 3 and 5 is 15.'
        write: 'Bracket: $\ \dfrac{2}{3} - \dfrac{1}{5} = \dfrac{10}{15} - \dfrac{3}{15}$'
      - say: '2 over 3 is 10 over 15, and 1 over 5 is 3 over 15. 10 minus 3 is 7, so the bracket is 7 over 15.'
        write: '$= \dfrac{7}{15}$'
      - say: 'Next, the word "of". With fractions, "of" means multiply. So 1 over 3 of 2 over 5 is 1 times 2, over 3 times 5.'
        write: '"Of" part: $\ \dfrac{1}{3} \times \dfrac{2}{5} = \dfrac{1 \times 2}{3 \times 5}$'
      - say: '1 times 2 is 2, and 3 times 5 is 15. So the "of" part is 2 over 15.'
        write: '$= \dfrac{2}{15}$'
      - say: 'Now the whole top is the bracket we found, 7 over 15, minus the "of" part, 2 over 15.'
        write: 'Top $= \dfrac{7}{15} - \dfrac{2}{15}$'
        point:
          - {line: 5, kind: move, from: {line: 2, at: '=157'}, at: '[[157]]−', text: 'bracket'}
          - {line: 5, kind: move, from: {line: 4, at: '=152'}, at: '−152', text: '"of" part'}
      - say: 'The bottoms are the same, so subtract the tops. 7 minus 2 is 5, giving 5 over 15.'
        write: '$= \dfrac{5}{15}$'
      - say: 'Divide the top and bottom by 5. 5 divided by 5 is 1, and 15 divided by 5 is 3. So the whole top is 1 over 3.'
        write: '$= \dfrac{1}{3}$'
      - say: 'Now the bottom of the big fraction: 3 minus 1 over a half. Dividing by a half is the same as multiplying by 2, so 1 over a half is 1 times 2, which is 2.'
        write: 'Bottom: $\ \dfrac{1}{1/2} = 1 \times 2 = 2$'
      - say: 'So the bottom is 3 minus that 2, which is 1.'
        write: 'Bottom $= 3 - 2 = 1$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '=2'}, at: '−2'}
      - say: 'Now divide the top, 1 over 3, by the bottom, 1. Dividing by 1 changes nothing.'
        write: 'Whole expression $= \dfrac{1/3}{1} = \dfrac{1}{3}$'
        point:
          - {line: 10, kind: move, from: {line: 7, at: '=31'}, at: '1/3', text: 'top'}
          - {line: 10, kind: move, from: {line: 9, at: '=1'}, at: '[[1]]1/3', text: 'bottom'}
      - say: 'So the expression simplifies to one third, which is answer choice C.'
        write: 'Answer: $\ \dfrac{1}{3}$'
        answer: true
    traps:
      A: 'You went for 1 over 7. The 7 only belongs to the bracket, 7 over 15; we still take away the 2 over 15 from the "of" part. The top ends up as 1 over 3, and the bottom is 1.'
      B: 'You went for 7. That number only appears inside the bracket, 7 over 15. Finish the top to get 1 over 3, and the bottom is 3 minus 2, which is 1.'
      D: 'You went for 3. That is the answer turned upside down. The top is 1 over 3 and the bottom is 1, so the answer is 1 over 3, not 3 over 1.'
      E: 'You went for 1 over 5. The top is 5 over 15, which simplifies to 1 over 3, not 1 over 5. And 1 divided by a half is 2, so the bottom is 3 minus 2, which is 1.'
  2:
    moments:
      - say: 'We are told that 263 plus 441 equals 714 in some base, and we need to find that base. The carries in the addition will give it away.'
        write: '$263 + 441 = 714$'
      - say: 'Remember how carrying works. In base ten you carry when a column reaches 10. In base $b$, you carry 1 whenever a column reaches $b$, and write down what is left over.'
        write: 'In base $b$: carry 1 for every $b$'
      - say: 'Let''s add column by column, starting with the units. 3 plus 1 is 4, and the answer shows 4. So there is no carry there.'
        write: 'Units: $\ 3 + 1 = 4$, no carry'
      - say: 'Now the middle column. 6 plus 4 is 10, counting in the ordinary way.'
        write: 'Middle: $\ 6 + 4 = 10$'
      - say: 'But the answer shows only 1 in the middle, and the left column gets a carry. So that 10 must be one full base carried, plus 1 left over.'
        write: '$10 = b + 1$'
        point:
          - {line: 3, kind: circle, at: '=10'}
      - say: 'Take 1 from both sides, and the base is 9.'
        write: '$b = 10 - 1 = 9$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '+1'}, at: '−1', text: 'across'}
      - say: 'Let''s check the left column with that carry. 2 plus 4 is 6, plus the carried 1 is 7, and the answer shows 7.'
        write: 'Left: $\ 2 + 4 + 1 = 7$'
      - say: 'To be completely sure, change each number to base ten. In base 9 the places are worth 81, 9 and 1. So 263 base 9 is 2 eighty-ones, plus 6 nines, plus 3.'
        write: '$263_{9} = 2(81) + 6(9) + 3$'
      - say: '2 times 81 is 162, and 6 times 9 is 54. 162 plus 54 plus 3 is 219.'
        write: '$= 162 + 54 + 3 = 219$'
      - say: 'In the same way, 441 base 9 is 4 times 81, which is 324, plus 4 times 9, which is 36, plus 1. That makes 361.'
        write: '$441_{9} = 4(81) + 4(9) + 1 = 324 + 36 + 1 = 361$'
      - say: 'And 714 base 9 is 7 times 81, which is 567, plus 1 nine, plus 4. That makes 580.'
        write: '$714_{9} = 7(81) + 1(9) + 4 = 567 + 9 + 4 = 580$'
      - say: 'Now add the first two base ten values we found, 219 and 361. That is 580, exactly the third number.'
        write: 'Check: $\ 219 + 361 = 580$'
        point:
          - {line: 11, kind: move, from: {line: 8, at: '=219'}, at: '219'}
          - {line: 11, kind: move, from: {line: 9, at: '=361'}, at: '361'}
      - say: 'So the number base used is 9, which is answer choice D.'
        write: 'Base $= 9$'
        answer: true
    traps:
      A: 'You went for 12. In base 12, 6 plus 4 is 10, which is less than 12, so there would be no carry, and the left column would show 6, not 7. The carry tells us 10 is the base plus 1, so the base is 9.'
      B: 'You went for 11. In base 11, 6 plus 4 is still less than the base, so nothing is carried. The middle column does carry, so 10 must be the base plus 1, which makes the base 9.'
      C: 'You went for 10. In ordinary base ten, 263 plus 441 is 704, not 714. The middle column would show 0, not 1.'
      E: 'You went for 8. In base 8, 6 plus 4 is one 8 with 2 left over, so the middle column would show 2 and the sum would be 724. We need 10 to be the base plus 1, so the base is 9.'
  3:
    moments:
      - say: 'We are dividing a tiny number by a huge one, and we want the answer in standard form: $k$ times 10 to the power $n$, where $k$ is at least 1 but less than 10.'
        write: '$\dfrac{0.00014323}{1{,}940{,}000} = k \times 10^{n}$'
      - say: 'The plan is to write both numbers in standard form first. For the top, move the point 4 places to the right to get 1.4323. Moving right means the power is minus 4.'
        write: 'Top: $\ 0.00014323 = 1.4323 \times 10^{-4}$'
      - say: 'For the bottom, move the point 6 places to the left to get 1.94, so the power is plus 6.'
        write: 'Bottom: $\ 1{,}940{,}000 = 1.94 \times 10^{6}$'
      - say: 'Now put those two lines back into the fraction. We can divide the number parts and the powers of ten separately.'
        write: 'So $\ \dfrac{0.00014323}{1{,}940{,}000} = \dfrac{1.4323}{1.94} \times \dfrac{10^{-4}}{10^{6}}$'
        point:
          - {line: 3, kind: move, from: {line: 1, at: '=[[1.4323]]'}, at: '1.94[[1.4323]]', text: 'top'}
          - {line: 3, kind: move, from: {line: 2, at: '=[[1.94]]'}, at: '[[1.94]]1.4323', text: 'bottom'}
      - say: 'Law of indices: to divide powers of the same base, subtract the indices.'
        write: 'Law of indices: $\dfrac{a^{m}}{a^{n}} = a^{m - n}$'
      - say: 'Powers first. To divide powers of ten, subtract the indices: minus 4 minus 6 is minus 10.'
        write: 'Powers: $\ \dfrac{10^{-4}}{10^{6}} = 10^{-4 - 6} = 10^{-10}$'
      - say: 'Now the number parts: 1.4323 divided by 1.94. Since 1.94 is bigger than 1.4323, the answer is less than 1. It comes to 0.7383.'
        write: 'Numbers: $\ 1.4323 \div 1.94 = 0.7383$'
      - say: 'Let''s check that by multiplying back. 1.94 times 0.7383 is 1.4323.'
        write: 'Check: $\ 1.94 \times 0.7383 = 1.4323$'
      - say: 'Putting the two results together, the quotient is 0.7383 times 10 to the minus 10.'
        write: 'Quotient $= 0.7383 \times 10^{-10}$'
        point:
          - {line: 8, kind: move, from: {line: 6, at: '=0.7383'}, at: '0.7383'}
          - {line: 8, kind: move, from: {line: 5, at: '=10−10'}, at: '10−10'}
      - say: 'But that is not standard form yet, because 0.7383 is less than 1. Moving the point one place right gives 7.383, so 0.7383 is 7.383 times 10 to the minus 1.'
        write: '$0.7383 = 7.383 \times 10^{-1}$'
      - say: 'Law of indices: to multiply powers of the same base, add the indices.'
        write: 'Law of indices: $a^{m} \times a^{n} = a^{m + n}$'
      - say: 'Put that into the quotient. Now we multiply 10 to the minus 1 by 10 to the minus 10, so we add the indices: minus 1 plus minus 10 is minus 11.'
        write: 'Quotient $= 7.383 \times 10^{-1} \times 10^{-10} = 7.383 \times 10^{-11}$'
        point:
          - {line: 11, kind: move, from: {line: 9, at: '=7.383×10−1'}, at: '7.383×10−1×'}
      - say: 'So $k$ is 7.383 and $n$ is minus 11, which is answer choice A.'
        write: '$k = 7.383,\quad n = -11$'
        answer: true
    traps:
      B: 'You went for 2.34 and 10. Dividing a tiny number by a huge one gives a very small answer, so the power of ten must be negative. The quotient is 7.383 times 10 to the minus 11.'
      C: 'You went for 3.87 and 2. The power can''t be positive here: a tiny number divided by a big one is tiny. Write both in standard form, then subtract the indices, minus 4 minus 6.'
      D: 'You went for 7.831 and minus 11. The power is right, but the digits are swapped. 1.4323 divided by 1.94 is 0.7383, so $k$ is 7.383.'
      E: 'You went for 5.41 and minus 2. Put both numbers in standard form: the top has 10 to the minus 4 and the bottom 10 to the 6, so the powers give minus 10, and the final adjustment makes it minus 11.'
  4:
    moments:
      - say: 'P sold a bicycle to Q at a 10% profit. Then Q sold it to R for ₦209 at a 5% loss. We want what P paid. The neatest way is to work backwards, one sale at a time.'
        write: 'Q sold to R for ₦209, at a 5% loss'
      - say: 'Remember, a profit or loss is always a percentage of the seller''s own cost. Q lost 5%, so Q got back 100 minus 5, which is 95%, of what Q paid.'
        write: 'Q got back $100\% - 5\% = 95\%$ of his cost'
      - say: 'So 95% of Q''s cost is ₦209. As a decimal, 95% is 0.95.'
        write: '$0.95 \times \text{Q''s cost} = 209$'
        point:
          - {line: 1, kind: circle, at: '95%'}
          - {line: 2, kind: move, from: {line: 0, at: '₦209'}, at: '209'}
      - say: 'To get Q''s cost by itself, divide both sides by 0.95.'
        write: 'Q''s cost $= \dfrac{209}{0.95}$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '0.95'}, at: '0.95', text: 'divide'}
      - say: 'Multiply the top and bottom by 100 to clear the decimal. That gives 20,900 over 95.'
        write: '$= \dfrac{20{,}900}{95}$'
      - say: '95 times 200 is 19,000, and 95 times 20 is 1,900. Together that is 20,900, so the division gives 220.'
        write: '$= 220$'
      - say: 'So Q paid ₦220, and he paid it to P. Now step back to the first sale. P made a 10% profit, so ₦220 is 100 plus 10, which is 110%, of what P paid.'
        write: '$1.10 \times \text{P''s cost} = 220$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '220'}, at: '220', text: 'Q paid'}
      - say: 'Divide both sides by 1.10.'
        write: 'P''s cost $= \dfrac{220}{1.10}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '1.10'}, at: '1.10', text: 'divide'}
      - say: 'Multiply the top and bottom by 10 to get 2,200 over 11. 11 times 200 is 2,200, so P paid ₦200.'
        write: '$= \dfrac{2{,}200}{11} = 200$'
      - say: 'Let''s check by going forwards. 10% of 200 is 20, so Q paid 220. Then 5% of 220 is 11, and 220 minus 11 is 209. That matches.'
        write: 'Check: $\ 200 + 20 = 220,\quad 220 - 11 = 209$'
      - say: 'So the bicycle cost P ₦200, which is answer choice A.'
        write: 'P''s cost $=$ ₦200'
        answer: true
    traps:
      B: 'You went for ₦196. Try it forwards: 10% profit makes ₦215.60, and a 5% loss on that is about ₦204.82, not ₦209. Undo each sale on its own base: ₦209 divided by 0.95 is ₦220, and ₦220 divided by 1.10 is ₦200.'
      C: 'You went for ₦180. Forwards, that gives ₦198 and then about ₦188, far below ₦209. ₦209 is 95% of ₦220, and ₦220 is 110% of ₦200.'
      D: 'You went for ₦205. The two percentages can''t just be combined into one change. Undo the 5% loss first to get ₦220, then undo the 10% profit to get ₦200.'
      E: 'You went for ₦150. That''s far too low: 10% profit on ₦150 is only ₦165. Work backwards: ₦209 divided by 0.95 is ₦220, and ₦220 divided by 1.10 is ₦200.'
  5:
    moments:
      - say: 'If the price of an orange goes up by half a kobo, ₦2.40 buys 16 fewer oranges. We want the present price. Let''s call it $p$ kobo.'
        write: 'Present price $= p$ kobo'
      - say: 'We''ll work in kobo throughout. ₦2.40 is 240 kobo.'
        write: '₦2.40 $= 240$ kobo'
      - say: 'The number of oranges you can buy is the money divided by the price of one. So right now, 240 kobo buys 240 over $p$ oranges.'
        write: 'Oranges now $= \dfrac{240}{p}$'
      - say: 'After the rise, one orange costs $p$ plus a half, so 240 kobo buys 240 over $p$ plus a half.'
        write: 'Oranges after $= \dfrac{240}{p + \frac{1}{2}}$'
      - say: 'The second number is 16 less than the first. So the first number minus the second number is 16.'
        write: '$\dfrac{240}{p} - \dfrac{240}{p + \frac{1}{2}} = 16$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: 'p240'}, at: 'p240', text: 'now'}
          - {line: 4, kind: move, from: {line: 3, at: 'p+21240'}, at: 'p+21240', text: 'after'}
      - say: 'To subtract, use the common denominator $p$ times $p$ plus a half. The top becomes 240 times $p$ plus a half, minus 240 times $p$.'
        write: '$\dfrac{240\left(p + \frac{1}{2}\right) - 240p}{p\left(p + \frac{1}{2}\right)} = 16$'
      - say: 'Expand the top. 240 times $p$ is $240p$, and 240 times a half is 120. The two $240p$ terms cancel, leaving 120.'
        write: '$\dfrac{240p + 120 - 240p}{p\left(p + \frac{1}{2}\right)} = \dfrac{120}{p\left(p + \frac{1}{2}\right)} = 16$'
        point:
          - {line: 6, kind: strike, at: '[[240p]]+120', text: 'cancel'}
          - {line: 6, kind: strike, at: '−240p'}
      - say: 'Multiply both sides by the bottom. $p$ times $p$ plus a half is $p$ squared plus a half $p$.'
        write: '$120 = 16\left(p^{2} + \tfrac{1}{2}p\right)$'
      - say: '16 times $p$ squared is $16p^{2}$, and 16 times a half $p$ is $8p$.'
        write: '$120 = 16p^{2} + 8p$'
      - say: 'Bring the 120 across, then divide every term by 8. 16 over 8 is 2, 8 over 8 is 1, and 120 over 8 is 15.'
        write: '$16p^{2} + 8p - 120 = 0 \;\Rightarrow\; 2p^{2} + p - 15 = 0$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '120'}, at: '−120', text: 'across'}
      - say: 'Now factorise. We need two numbers that multiply to 2 times minus 15, which is minus 30, and add to 1. Those are 6 and minus 5.'
        write: 'Split the middle: $\ 2p^{2} + 6p - 5p - 15 = 0$'
      - say: 'Group in pairs. The first pair gives $2p$ times $p$ plus 3, and the second gives minus 5 times $p$ plus 3.'
        write: '$2p(p + 3) - 5(p + 3) = 0$'
      - say: 'Both groups share $p$ plus 3, so take it out.'
        write: '$(2p - 5)(p + 3) = 0$'
      - say: 'So $p$ is 5 over 2, or minus 3. A price can''t be negative, so $p$ is 5 over 2, which is two and a half kobo.'
        write: '$p = \dfrac{5}{2} = 2\tfrac{1}{2}$ kobo'
      - say: 'Let''s check. At two and a half kobo, 240 kobo buys 96 oranges. At 3 kobo it buys 80. And 96 minus 80 is 16.'
        write: 'Check: $\ \dfrac{240}{2.5} = 96,\quad \dfrac{240}{3} = 80,\quad 96 - 80 = 16$'
      - say: 'So the present price is two and a half kobo, which is answer choice A.'
        write: 'Present price $= 2\tfrac{1}{2}$k'
        answer: true
    traps:
      B: 'You went for three and a half kobo. At that price 240 kobo buys about 68.6 oranges, and at 4 kobo it buys 60, a drop of only about 8.6, not 16. The equation gives $p = 2\tfrac{1}{2}$.'
      C: 'You went for five and a half kobo. Remember the 16 counts oranges, not kobo. Set the difference in the numbers of oranges equal to 16, and you get $p = 2\tfrac{1}{2}$.'
      D: 'You went for 20 kobo. At 20 kobo, 240 kobo buys only 12 oranges, so the number can''t fall by 16. Solve $2p^{2} + p - 15 = 0$ to get two and a half.'
      E: 'You went for twenty-one and a half kobo. That price buys fewer than 12 oranges, so 16 fewer is impossible. The present price is two and a half kobo.'
  6:
    moments:
      - say: 'A man put ₦50,000 into two companies, paying 6% and 8%, and got ₦3,700 in total. We want how much he put in at 8%.'
        write: 'Total invested ₦50,000; total yield ₦3,700'
      - say: 'When one sum is split two ways, name one part and write the other as what is left. Let $x$ be the amount at 8%.'
        write: 'Amount at 8% $= x$'
      - say: 'Then the amount at 6% is the rest: 50,000 minus $x$.'
        write: 'Amount at 6% $= 50{,}000 - x$'
      - say: 'The yield from each part is its rate times the amount. 8% of $x$ is 0.08 times $x$.'
        write: 'Yield at 8% $= 0.08x$'
      - say: 'And 6% of the rest is 0.06 times 50,000 minus $x$.'
        write: 'Yield at 6% $= 0.06(50{,}000 - x)$'
      - say: 'The two yields we just wrote add up to ₦3,700.'
        write: '$0.08x + 0.06(50{,}000 - x) = 3{,}700$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '0.08x'}, at: '0.08x'}
          - {line: 5, kind: move, from: {line: 4, at: '0.06(50,000−x)'}, at: '0.06(50,000−x)'}
      - say: 'Expand the bracket. 0.06 times 50,000 is 3,000, and 0.06 times $x$ is $0.06x$.'
        write: '$0.08x + 3{,}000 - 0.06x = 3{,}700$'
      - say: 'Collect the $x$ terms. 0.08 minus 0.06 is 0.02.'
        write: '$0.02x + 3{,}000 = 3{,}700$'
      - say: 'Subtract 3,000 from both sides. 3,700 minus 3,000 is 700.'
        write: '$0.02x = 700$'
      - say: 'Divide both sides by 0.02. Dividing by 0.02 is the same as multiplying by 50, and 700 times 50 is 35,000.'
        write: '$x = \dfrac{700}{0.02} = 700 \times 50 = 35{,}000$'
      - say: 'Let''s check. 8% of 35,000 is 2,800. The rest is 50,000 minus 35,000, which is 15,000, and 6% of that is 900. 2,800 plus 900 is 3,700.'
        write: 'Check: $\ 0.08(35{,}000) + 0.06(15{,}000) = 2{,}800 + 900 = 3{,}700$'
      - say: 'So he invested ₦35,000 at 8%, which is answer choice E.'
        write: 'Amount at 8% $=$ ₦35,000'
        answer: true
    traps:
      A: 'You went for ₦15,000. That''s the amount at 6%, the other part of the money. Our $x$ was the amount at 8%, which is ₦35,000.'
      B: 'You went for ₦29,600. 8% of that is ₦2,368, and 6% of the other ₦20,400 is ₦1,224, which only adds to ₦3,592. The equation gives ₦35,000.'
      C: 'You went for ₦21,400. Its yields add to only ₦3,428. Set up $0.08x + 0.06(50{,}000 - x) = 3{,}700$; it simplifies to $0.02x = 700$, so $x$ is ₦35,000.'
      D: 'You went for ₦27,800. Check it: the yields would add to ₦3,556, not ₦3,700. Solve $0.02x = 700$ to get ₦35,000.'
  7:
    moments:
      - say: '30 boys and $x$ girls sat a test. The boys averaged 6, the girls averaged 8, and the total score was 468. We want $x$.'
        write: 'Boys: 30, mean 6; girls: $x$, mean 8; total 468'
      - say: 'The groups are different sizes, so we can''t just average the two means. The safe way is to work with totals. Remember, a mean is the total divided by the number of people.'
        write: '$\text{mean} = \dfrac{\text{total}}{\text{number of people}}$'
      - say: 'Turn that round, and the total is the mean times the number of people.'
        write: '$\text{total} = \text{mean} \times \text{number of people}$'
      - say: 'For the boys, that is 6 times 30, which is 180.'
        write: 'Boys'' total $= 6 \times 30 = 180$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
      - say: 'For the girls, it is 8 times $x$, which is $8x$.'
        write: 'Girls'' total $= 8 \times x = 8x$'
      - say: 'The two totals we just found make up the whole score, 468.'
        write: '$180 + 8x = 468$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '=180'}, at: '180'}
          - {line: 5, kind: move, from: {line: 4, at: '=8x'}, at: '8x'}
      - say: 'Subtract 180 from both sides. 468 minus 180 is 288.'
        write: '$8x = 468 - 180 = 288$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '180+'}, at: '−180', text: 'across'}
      - say: 'Divide both sides by 8. 288 divided by 8 is 36.'
        write: '$x = \dfrac{288}{8} = 36$'
      - say: 'Let''s check. 8 times 36 is 288, and 180 plus 288 is 468, the total we were given.'
        write: 'Check: $\ 180 + 8(36) = 180 + 288 = 468$'
      - say: 'So there were 36 girls, which is answer choice C.'
        write: 'Number of girls: $\ x = 36$'
        answer: true
    traps:
      A: 'You went for 38. Then the girls would score 8 times 38, which is 304, and the total would be 484, not 468. The girls'' total must be 288, so $x$ is 36.'
      B: 'You went for 24. Then the girls would score only 192, and the total would be 372. Work with totals: 180 plus $8x$ equals 468 gives $x = 36$.'
      D: 'You went for 22. Then the total would be 180 plus 176, which is 356. The boys'' total is 180, leaving 288 for the girls, and 288 divided by 8 is 36.'
      E: 'You went for 41. Then the girls alone would score 328, and the total would be 508. The two means can''t just be averaged; use totals: 180 plus $8x$ equals 468, so $x = 36$.'
  8:
    moments:
      - say: 'The cost of an article is labour ₦70, power ₦15, materials ₦30 and miscellaneous ₦5. We want the angle of the labour sector in a pie chart.'
