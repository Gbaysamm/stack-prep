  13:
    moments:
      - say: 'We need to rationalise this fraction, which means clearing the surds out of the bottom.'
        write: '$\dfrac{5\sqrt{7} - 7\sqrt{5}}{\sqrt{7} - \sqrt{5}}$'
      - say: 'The standard move is to multiply the top and the bottom by the conjugate of the bottom. The conjugate of root 7 minus root 5 is root 7 plus root 5: the same two terms with the sign changed.'
        write: 'Conjugate of $\sqrt{7} - \sqrt{5}$: $\ \sqrt{7} + \sqrt{5}$'
      - say: 'Why does that help? A minus bracket times a plus bracket is a difference of two squares, and squaring a square root removes the root.'
        write: '$(a - b)(a + b) = a^{2} - b^{2}$'
      - say: 'So multiply the top and the bottom by root 7 plus root 5. Doing the same to both keeps the value of the fraction the same.'
        write: '$= \dfrac{(5\sqrt{7} - 7\sqrt{5})(\sqrt{7} + \sqrt{5})}{(\sqrt{7} - \sqrt{5})(\sqrt{7} + \sqrt{5})}$'
      - say: 'The bottom first. By the difference of two squares, it is root 7 squared minus root 5 squared.'
        write: 'Bottom $= (\sqrt{7})^{2} - (\sqrt{5})^{2}$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
      - say: 'Root 7 squared is 7, and root 5 squared is 5. 7 minus 5 is 2. No surds left.'
        write: '$= 7 - 5 = 2$'
      - say: 'Now the top. Multiply each term in the first bracket by each term in the second. First, 5 root 7 times root 7 is 5 times 7, which is 35.'
        write: '$5\sqrt{7} \times \sqrt{7} = 5 \times 7 = 35$'
      - say: 'Next, 5 root 7 times root 5 is 5 root 35.'
        write: '$5\sqrt{7} \times \sqrt{5} = 5\sqrt{35}$'
      - say: 'Then minus 7 root 5 times root 7 is minus 7 root 35.'
        write: '$-7\sqrt{5} \times \sqrt{7} = -7\sqrt{35}$'
      - say: 'And minus 7 root 5 times root 5 is minus 7 times 5, which is minus 35.'
        write: '$-7\sqrt{5} \times \sqrt{5} = -7 \times 5 = -35$'
      - say: 'Add the four pieces. The 35 and minus 35 cancel. 5 root 35 minus 7 root 35 is minus 2 root 35.'
        write: 'Top $= 35 + 5\sqrt{35} - 7\sqrt{35} - 35 = -2\sqrt{35}$'
      - say: 'Now put the new top over the new bottom we found, 2. The 2s cancel.'
        write: 'Fraction $= \dfrac{-2\sqrt{35}}{2} = -\sqrt{35}$'
        point:
          - {line: 11, kind: move, from: {line: 10, at: '=−235'}, at: '−235', text: 'top'}
          - {line: 11, kind: move, from: {line: 5, at: '=2'}, at: '=[[2]]−235', text: 'bottom'}
      - say: 'So the fraction rationalises to minus root 35, which is answer choice C.'
        write: 'Answer: $\ -\sqrt{35}$'
        answer: true
    traps:
      A: 'You went for minus 2 root 35. That''s the new top, but it still has to be divided by the new bottom, which is 2. Minus 2 root 35 over 2 is minus root 35.'
      B: 'You went for 4 root 7 minus 6 root 5. That comes from taking the bottom away from the top term by term, which isn''t how fractions work. Multiply the top and bottom by the conjugate, root 7 plus root 5.'
      D: 'You went for 4 root 7 minus 8 root 5. Surds in a fraction can''t be cancelled term by term. Multiply by the conjugate: the whole numbers cancel and you''re left with minus root 35.'
      E: 'You went for root 35. The size is right, but watch the sign: 5 root 35 minus 7 root 35 is minus 2 root 35, so the answer is minus root 35.'
  14:
    moments:
      - say: 'This fraction has powers of 3 with $n$ in them. The trick is to take out the lowest power, 3 to the $n$ minus 1, from the top and from the bottom.'
        write: '$\dfrac{3^{n} - 3^{n-1}}{3^{3} \times 3^{n} - 27 \times 3^{n-1}}$'
      - say: 'First, a key fact. 3 to the $n$ has one more 3 multiplied in than 3 to the $n$ minus 1, so it is 3 times 3 to the $n$ minus 1.'
        write: '$3^{n} = 3 \times 3^{n-1}$'
      - say: 'Now the top. Replace the 3 to the $n$ using that fact.'
        write: 'Top $= 3^{n} - 3^{n-1} = 3 \times 3^{n-1} - 1 \times 3^{n-1}$'
        point:
          - {line: 1, kind: box, text: 'key fact'}
      - say: 'Take out 3 to the $n$ minus 1. That leaves 3 minus 1, which is 2.'
        write: '$= 3^{n-1}(3 - 1) = 2 \times 3^{n-1}$'
      - say: 'Now the bottom. 3 cubed is 27, so the first part is 27 times 3 to the $n$.'
        write: 'Bottom $= 27 \times 3^{n} - 27 \times 3^{n-1}$'
      - say: 'Use the same fact again: 27 times 3 to the $n$ is 27 times 3 times 3 to the $n$ minus 1. And 27 times 3 is 81.'
        write: '$27 \times 3^{n} = 27 \times 3 \times 3^{n-1} = 81 \times 3^{n-1}$'
      - say: 'So the bottom is 81 lots of 3 to the $n$ minus 1, take away 27 lots.'
        write: 'Bottom $= 81 \times 3^{n-1} - 27 \times 3^{n-1}$'
      - say: 'Take out 3 to the $n$ minus 1. 81 minus 27 is 54.'
        write: '$= 3^{n-1}(81 - 27) = 54 \times 3^{n-1}$'
      - say: 'Now put the top we found over the bottom we found. 3 to the $n$ minus 1 is on both, so it cancels.'
        write: 'Fraction $= \dfrac{2 \times 3^{n-1}}{54 \times 3^{n-1}} = \dfrac{2}{54}$'
        point:
