  15:
    moments:
      - say: '$p$ varies directly as the square of $q$ and inversely as $r$. First, let''s turn those words into an equation.'
      - say: 'Directly as $q$ squared puts $q$ squared on top. Inversely as $r$ puts $r$ on the bottom. And $k$ is the constant.'
        write: '$p = \dfrac{kq^{2}}{r}$'
