      - say: 'The third is a square. Inside the bracket, 4 and 6 share a factor of 2, so take it out.'
        write: 'Third: $\ 4a + 6b = 2(2a + 3b)$'
      - say: 'Squaring that squares both parts. 2 squared is 4.'
        write: '$(4a + 6b)^{2} = 2^{2}(2a + 3b)^{2} = 4(2a + 3b)^{2}$'
      - say: 'Now compare the three factorisations on the board. The bracket $2a$ plus $3b$ appears in all three.'
        write: 'Common to all three: $\ 2a + 3b$'
        point:
