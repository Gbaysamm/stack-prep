# UTME 1984 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1984.yaml. Answers match that file.
# This is a five-option paper (A-E), so each question has four traps.
format_version: 1
exam_year: 1984
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'We have a big fraction with a bracket, the word "of" and a division hidden in the bottom. The order you work in decides the answer. BODMAS will tell us the order.'
        write: '$\dfrac{\left(\frac{2}{3} - \frac{1}{5}\right) - \frac{1}{3} \text{ of } \frac{2}{5}}{3 - \dfrac{1}{1/2}}$'
      - say: 'BODMAS means Brackets, then Of, then Division and Multiplication, then Addition and Subtraction. We simplify the numerator first, then the denominator.'
        write: 'Solution (BODMAS: B, O, D, M, A, S)'
      - section: 'Numerator: B for brackets'
        say: 'B comes first, so the bracket, 2 over 3 minus 1 over 5. To subtract fractions we need the L.C.M. of the denominators 3 and 5, which is 15.'
        write: 'L.C.M. of 3 and 5 $= 15$'
      - say: 'Picture a bar cut into 15 equal squares. 15 divided by 3 is 5, and 5 times 2 is 10. 15 divided by 5 is 3, and 3 times 1 is 3.'
        doodle: {name: 'custom:1984_q01_a', id: bar, caption: 'a bar of 15 fifteenths'}
        write: '$\dfrac{2}{3} - \dfrac{1}{5} = \dfrac{10 - 3}{15}$'
      - say: '10 minus 3 is 7. So the bracket is 7 over 15, so shade 7 of the 15 squares.'
        doodle_do: [{id: bar, op: stage, stage: 'custom:1984_q01_a2'}]
        write: '$= \dfrac{7}{15}$'
      - section: 'Numerator: O for of'
        say: 'O is next, and "of" means multiply. So 1 over 3 of 2 over 5 is 1 over 3 times 2 over 5.'
        write: '$\dfrac{1}{3} \text{ of } \dfrac{2}{5} = \dfrac{1}{3} \times \dfrac{2}{5}$'
      - say: 'For the numerators, 1 times 2 is 2. For the denominators, 3 times 5 is 15. So the "of" part is 2 over 15, the two pink squares.'
        doodle_do: [{id: bar, op: highlight, part: two}]
        write: '$= \dfrac{2}{15}$'
      - section: 'Numerator: S for subtract'
        say: 'Now S. The numerator is the bracket, 7 over 15, minus the "of" part, 2 over 15.'
        write: 'Numerator $= \dfrac{7}{15} - \dfrac{2}{15}$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '= 157'}, at: '[[157]]−', text: 'bracket'}
          - {line: 7, kind: move, from: {line: 6, at: '= 152'}, at: '−152', text: 'of'}
      - say: 'Same denominator, so 7 minus 2 is 5. That gives 5 over 15. Cross the two pink squares off the bar.'
        doodle_do: [{id: bar, op: cross, part: two}]
        write: '$= \dfrac{5}{15}$'
      - say: 'Divide the numerator and the denominator by 5. 5 over 15 becomes 1 over 3, which is one full row of the bar.'
        doodle_do: [{id: bar, op: circle, part: row1}]
        write: '$= \dfrac{1}{3}$'
      - section: 'Denominator'
        say: 'Now the denominator, 3 minus 1 divided by a half. By BODMAS, division comes before subtraction. To divide by a half, multiply by its reciprocal, 2 over 1.'
        write: '$1 \div \dfrac{1}{2} = 1 \times \dfrac{2}{1} = 2$'
      - say: 'Then subtract, so 3 minus 2 is 1. So the denominator is 1.'
        write: 'Denominator $= 3 - 2 = 1$'
      - section: 'Divide'
        say: 'The whole expression is the numerator, 1 over 3, divided by the denominator, 1. Dividing by 1 changes nothing.'
        write: '$\therefore$ Expression $= \dfrac{1}{3} \div 1 = \dfrac{1}{3}$'
        point:
          - {line: 12, kind: move, from: {line: 9, at: '= 31'}, at: '[[31]]÷', text: 'numerator'}
          - {line: 12, kind: move, from: {line: 11, at: '= 1'}, at: '÷[[1]]', text: 'denominator'}
      - section: 'Check'
        say: 'Check with decimals. 7 over 15 is about 0.467 and 2 over 15 is about 0.133. 0.467 minus 0.133 is 0.333, which is one third.'
        write: 'Check: $0.467 - 0.133 = 0.333 = \tfrac{1}{3} \ \checkmark$'
      - section: 'Answer'
        say: 'So the expression simplifies to one third, which is option C.'
        write: '$\therefore$ Answer $= \dfrac{1}{3}$'
        answer: true
    traps:
      A: 'You went for 1 over 7. The 7 belongs only to the bracket, 7 over 15. By BODMAS we still take away the "of" part, 2 over 15, and the numerator becomes 1 over 3.'
      B: 'You went for 7. That number only appears inside the bracket. Finish the numerator to get 1 over 3. The denominator is 3 minus 2, which is 1.'
      D: 'You went for 3. That is the answer turned upside down. The numerator is 1 over 3 and the denominator is 1, so the answer is 1 over 3.'
      E: 'You went for 1 over 5. The numerator is 5 over 15, and dividing both by 5 gives 1 over 3, not 1 over 5. The denominator is 1.'
  2:
    moments:
      - section: 'The question'
        say: 'Two-six-three plus four-four-one makes seven-one-four. In base ten that is false, so another base was used. Which one?'
        write: '$263 + 441 = 714$'
      - say: 'We do not know the base, so we give it a letter.'
        write: 'Solution'
      - say: 'Let the base be b. Then every number in the sum is in base b.'
        write: 'Let the base be $b$.'
      - section: 'Expand each number in base b'
        say: 'Write the index numbers over two-six-three, which are two, one and nought. Each digit is multiplied by b to the power of its index.'
        write: '$\overset{2}{2}\,\overset{1}{6}\,\overset{0}{3}_{b} = 2 \times b^{2} + 6 \times b^{1} + 3 \times b^{0}$'
      - say: 'b to the power 1 is b, and b to the power nought is 1. So it is 2 b squared, plus 6 b, plus 3.'
        write: '$= 2b^{2} + 6b + 3$'
      - say: 'The same for four-four-one gives 4 times b squared, plus 4 times b to the power 1, plus 1 times b to the power nought.'
        write: '$\overset{2}{4}\,\overset{1}{4}\,\overset{0}{1}_{b} = 4b^{2} + 4b + 1$'
      - say: 'And seven-one-four gives 7 b squared, plus b, plus 4.'
        write: '$\overset{2}{7}\,\overset{1}{1}\,\overset{0}{4}_{b} = 7b^{2} + b + 4$'
      - section: 'Form the equation'
        say: 'Now put the three expansions into the sum, so the first plus the second equals the third.'
        write: '$(2b^{2} + 6b + 3) + (4b^{2} + 4b + 1) = 7b^{2} + b + 4$'
      - say: 'Collect like terms on the left. 2 b squared plus 4 b squared is 6 b squared, 6 b plus 4 b is 10 b, and 3 plus 1 is 4.'
        write: '$6b^{2} + 10b + 4 = 7b^{2} + b + 4$'
      - say: 'Take everything on the left across to the right, changing each sign.'
        write: '$0 = 7b^{2} - 6b^{2} + b - 10b + 4 - 4$'
      - say: '7 b squared minus 6 b squared is b squared. b minus 10 b is minus 9 b. 4 minus 4 is 0.'
        write: '$0 = b^{2} - 9b$'
      - say: 'Factorise, because b is common to both terms.'
        write: '$b(b - 9) = 0$'
      - say: 'Either b equals 0, or b minus 9 equals 0, so b equals 9.'
        write: 'Either $b = 0$ or $b = 9$'
      - say: 'A base must be bigger than every digit it uses. The largest digit here is 7, so b cannot be 0.'
        write: 'Largest digit is 7, so $b > 7$'
      - say: 'Therefore the base is 9.'
        write: '$\therefore b = 9$'
      - section: 'Check: add in base 9'
        say: 'Check by adding in base nine, column by column. In the units, 3 plus 1 is 4, as in the answer.'
        write: 'Units: $3 + 1 = 4$'
      - say: 'In the middle column, 6 plus 4 is 10, which is one nine and 1 over. Write 1, carry 1. The answer shows 1 there.'
        write: '$6 + 4 = 10 = 1 \times 9 + 1$: write 1, carry 1'
      - say: 'In the left column, 2 plus 4, plus the carried 1, is 7. That gives seven-one-four. It agrees.'
        write: '$2 + 4 + 1 = 7$, so the sum is $714_{9}\ \checkmark$'
      - section: 'Answer'
        say: 'So the number base used is 9, which is option D.'
        write: '$\therefore$ the base is 9'
        answer: true
    traps:
      A: 'You went for 12. In base 12, 6 plus 4 is 10, less than 12, so nothing is carried and the left column would show 6, not 7. The equation $b^{2} - 9b = 0$ gives 9.'
      B: 'You went for 11. In base 11, 6 plus 4 is still less than the base, so nothing is carried. Solve $b(b - 9) = 0$, and the base is 9.'
      C: 'You went for 10. In base ten, 263 plus 441 is 704, not 714. The middle column would show 0, not 1.'
      E: 'You went for 8. In base 8, 6 plus 4 is one eight and 2 over, so the sum would be seven-two-four. The base that fits is 9.'
  3:
    moments:
      - section: 'The question'
        say: 'Here a tiny number is divided by a huge one. Two options share the index minus 11, and they differ only in the order of the digits. Let''s get both parts right.'
        doodle: {name: 'custom:1984_q03_a', id: hops, caption: 'the decimal point hops', size: scene}
        write: '$\dfrac{0.00014323}{1{,}940{,}000} = k \times 10^{n}$, $1 \le k < 10$'
      - say: 'Standard form is a number from 1 up to 10, times a power of 10. We write the numerator and the denominator in standard form first.'
        write: 'Solution'
      - section: 'Standard form'
        say: 'For the numerator, move the point 4 places to the right to get 1.4323. Moving right gives a negative index, so it is 10 to the minus 4.'
        doodle_do: [{id: hops, op: stage, stage: 'custom:1984_q03_a2'}]
        write: '$0.00014323 = 1.4323 \times 10^{-4}$'
        point:
          - {line: 2, kind: highlight, at: '10−4', to: {doodle: hops, part: hops1}}
      - say: 'For the denominator, move the point 6 places to the left to get 1.94. Moving left gives a positive index, 10 to the power 6.'
        doodle_do: [{id: hops, op: stage, stage: 'custom:1984_q03_a3'}]
        write: '$1{,}940{,}000 = 1.94 \times 10^{6}$'
        point:
          - {line: 3, kind: highlight, at: '106', to: {doodle: hops, part: hops2}}
      - say: 'Now divide the numbers by the numbers and the powers of 10 by the powers of 10.'
        write: '$\dfrac{1.4323 \times 10^{-4}}{1.94 \times 10^{6}} = \dfrac{1.4323}{1.94} \times \dfrac{10^{-4}}{10^{6}}$'
      - section: 'The powers'
        say: 'The law of indices for division says we subtract the index of the denominator from the index of the numerator.'
        write: '$a^{m} \div a^{n} = a^{m - n}$'
      - say: 'Minus 4 minus 6 is minus 10.'
        write: '$\dfrac{10^{-4}}{10^{6}} = 10^{-4 - 6} = 10^{-10}$'
      - section: 'The numbers'
        say: 'Now 1.4323 divided by 1.94. Multiply both by 100 to clear the decimal in the divisor, and we get 143.23 divided by 194.'
        write: '$\dfrac{1.4323}{1.94} = \dfrac{143.23}{194}$'
      - say: 'Long division. 194 into 1432 goes 7 times, and 7 times 194 is 1,358, leaving 74. Bring down 3 to make 743.'
        write: '$194 \times 7 = 1358$; $1432 - 1358 = 74$'
      - say: '194 into 743 goes 3 times, which is 582, leaving 161. Bring down 0 to make 1,610. 194 goes 8 times, 1,552, leaving 58.'
        write: '$743 - 582 = 161$; $1610 - 1552 = 58$'
      - say: 'Bring down 0 to make 580. 194 goes 2 times, which is 388, leaving 192. Bring down 0 to make 1,920, which takes 9. So the digits run 7, 3, 8, 2 and 9.'
        write: '$580 - 388 = 192$; $1920 \to 9$'
      - say: 'So 143.23 divided by 194 is 0.73829 and so on. To 4 significant figures, the next digit is 9, so add 1, giving 0.7383.'
        write: '$\dfrac{143.23}{194} = 0.7382|9\ldots \approx 0.7383$'
      - section: 'Put it together'
        say: 'So the quotient is 0.7383 times 10 to the minus 10. But 0.7383 is less than 1, so this is not yet standard form.'
        write: 'Quotient $= 0.7383 \times 10^{-10}$'
        point:
          - {line: 12, kind: move, from: {line: 11, at: '≈ 0.7383'}, at: '0.7383'}
          - {line: 12, kind: move, from: {line: 6, at: '= 10−10'}, at: '10−10'}
      - say: 'Move the point one place to the right, so 0.7383 is 7.383 times 10 to the minus 1.'
        doodle_do: [{id: hops, op: stage, stage: 'custom:1984_q03_a4'}]
        write: '$0.7383 = 7.383 \times 10^{-1}$'
        point:
          - {line: 13, kind: highlight, at: '10−1', to: {doodle: hops, part: hops3}}
      - say: 'Multiplying powers of 10, we add the indices, so minus 1 plus minus 10 is minus 11.'
        write: '$\therefore$ Quotient $= 7.383 \times 10^{-1} \times 10^{-10} = 7.383 \times 10^{-11}$'
      - section: 'Check'
        say: 'Check by multiplying back. 1.94 times 0.7383 is about 1.4323, the number we started with.'
        write: 'Check: $1.94 \times 0.7383 \approx 1.4323 \ \checkmark$'
      - section: 'Answer'
        say: 'Therefore k is 7.383 and n is minus 11, which is option A.'
        write: '$\therefore k = 7.383,\ \ n = -11$'
        answer: true
    traps:
      B: 'You went for 2.34 and 10. A tiny number divided by a huge one is tiny, so the index must be negative. The quotient is 7.383 times 10 to the minus 11.'
      C: 'You went for 3.87 and 2. The index cannot be positive here. In standard form the indices are minus 4 and 6, and minus 4 minus 6 is minus 10, which becomes minus 11.'
      D: 'You went for 7.831 and minus 11. The index is right, but the digits are mixed up. The long division gives 0.7383, so k is 7.383.'
      E: 'You went for 5.41 and minus 2. Write both numbers in standard form. Minus 4 minus 6 gives minus 10, and the final adjustment makes it minus 11.'
  4:
    moments:
      - section: 'The question'
        say: 'One bicycle is sold twice. P sells to Q at a 10 percent profit, then Q sells to R for ₦209 at a 5 percent loss. We work backwards to what P paid.'
        write: 'P → Q: 10% profit. Q → R: S.P. ₦209, 5% loss. P''s C.P. $= ?$'
      - say: 'C.P. means cost price, what the seller paid. S.P. means selling price. A profit or loss percent is always worked out on the seller''s own C.P.'
        write: 'Solution'
      - section: 'The formulas'
        say: 'For a loss, the S.P. is 100 minus the loss percent, out of 100, of the C.P. Turned round, the C.P. is 100 over 100 minus the loss percent, times the S.P.'
        write: 'Loss: C.P. $= \dfrac{100}{100 - \text{loss}\%} \times$ S.P.'
      - say: 'For a profit, the C.P. is 100 over 100 plus the gain percent, times the S.P.'
        write: 'Gain: C.P. $= \dfrac{100}{100 + \text{gain}\%} \times$ S.P.'
      - section: 'Second sale: Q to R'
        say: 'Start with the last sale, because we know its S.P. Q sold for ₦209 at a 5 percent loss.'
        write: 'S.P. $= 209$, loss $= 5\%$'
      - say: 'Substitute into the loss formula. 100 minus 5 is 95.'
        write: 'Q''s C.P. $= \dfrac{100}{100 - 5} \times 209 = \dfrac{100}{95} \times 209$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: 'S.P. = [[209]]'}, at: '95100×[[209]]', text: 'S.P.'}
      - say: 'Cancel first. 209 is 11 times 19, and 95 is 5 times 19. The 19s cancel, leaving 100 times 11 over 5.'
        write: '$= \dfrac{100 \times 11}{5}$'
      - say: '100 divided by 5 is 20, and 20 times 11 is 220. So Q paid ₦220.'
        write: 'Q''s C.P. $= 220$'
      - section: 'First sale: P to Q'
        say: 'What Q paid is what P sold for. So P''s S.P. is ₦220, at a 10 percent profit.'
        write: 'P''s S.P. $= 220$, gain $= 10\%$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= 220'}, at: '220', text: 'same money'}
      - say: 'Substitute into the gain formula. 100 plus 10 is 110.'
        write: 'P''s C.P. $= \dfrac{100}{100 + 10} \times 220 = \dfrac{100}{110} \times 220$'
      - say: 'Now cancel. 220 divided by 110 is 2. And 100 times 2 is 200.'
        write: '$= 100 \times 2 = 200$'
        point:
          - {line: 10, kind: highlight, at: '= [[200]]'}
      - say: 'Therefore the bicycle cost P ₦200.'
        write: '$\therefore$ P''s C.P. $=$ ₦200'
      - section: 'Check'
        say: 'Check forwards. 10 percent of 200 is 20, so P sold to Q for 220. 5 percent of 220 is 11, and 220 minus 11 is 209. It agrees.'
        write: 'Check: $200 + 20 = 220$; $220 - 11 = 209 \ \checkmark$'
      - section: 'Answer'
        say: 'So the bicycle cost P ₦200, which is option A.'
        write: '$\therefore$ Cost to P $=$ ₦200'
        answer: true
    traps:
      B: 'You went for ₦196. Try it forwards. A 10 percent profit gives ₦215.60, and a 5 percent loss on that is about ₦204.82, not ₦209. Undo each sale on its own C.P., so ₦209 gives ₦220, and ₦220 gives ₦200.'
      C: 'You went for ₦180. Forwards, that gives ₦198 and then about ₦188, far below ₦209. C.P. is 100 over 95 times 209, which is ₦220, then 100 over 110 times 220, which is ₦200.'
      D: 'You went for ₦205. The two percentages cannot be joined into one change, because each is on a different C.P. Undo the 5 percent loss first to get ₦220, then the 10 percent profit to get ₦200.'
      E: 'You went for ₦150. That is far too low, because a 10 percent profit on ₦150 is only ₦165. Working backwards gives ₦220 and then ₦200.'
  5:
    moments:
      - section: 'The question'
        say: 'If an orange costs half a kobo more, ₦2.40 buys 16 fewer oranges. We want the present price. The 16 counts oranges, not kobo.'
        write: 'Present price of an orange $= ?$'
      - section: 'Solution'
        say: 'We name the unknown, write the number of oranges before and after, and make an equation from the 16. It becomes a quadratic.'
        write: 'Solution'
      - say: 'Let the present price be $p$ kobo.'
        write: 'Let the present price be $p$ kobo'
      - say: 'Work in kobo throughout. ₦2.40 is 240 kobo.'
        write: '₦2.40 $= 240$k'
      - say: 'The number of oranges is money divided by price. So now, 240 kobo buys 240 over $p$ oranges. That is how many he gets now.'
        write: 'Number now $= \dfrac{240}{p}$'
      - say: 'Raise the price, and he gets fewer. The new price is $p$ plus a half kobo.'
        write: 'New price $= (p + \tfrac{1}{2})$k'
      - say: 'So now 240 kobo buys 240 over $p$ plus a half oranges.'
        write: 'Number after $= \dfrac{240}{p + \frac{1}{2}}$'
      - say: 'The number before minus the number after is 16.'
        write: '$\dfrac{240}{p} - \dfrac{240}{p + \frac{1}{2}} = 16$'
      - section: 'Clear the fractions'
        say: 'Multiply every term by the L.C.M. of the bottoms, $p$ times $p$ plus a half.'
        write: 'Multiply through by $p(p + \tfrac{1}{2})$:'
      - say: 'The first term keeps $p$ plus a half, the second keeps $p$, and the 16 is multiplied by both.'
        write: '$240(p + \tfrac{1}{2}) - 240p = 16p(p + \tfrac{1}{2})$'
      - say: 'Open the brackets. 240 times a half is 120, and 16 times a half $p$ is $8p$.'
        write: '$240p + 120 - 240p = 16p^{2} + 8p$'
      - say: '$240p$ minus $240p$ is zero, leaving 120.'
        write: '$120 = 16p^{2} + 8p$'
      - say: 'Subtract 120 from both sides to make one side zero.'
        write: '$16p^{2} + 8p - 120 = 0$'
      - say: 'Every term divides by 8. 16 over 8 is 2, 8 over 8 is 1 and 120 over 8 is 15.'
        write: '$2p^{2} + p - 15 = 0$'
      - section: 'Factorise'
        say: 'Here $a$ is 2, $b$ is 1 and $c$ is negative 15. The product is $ac$, negative 30. The sum is $b$, 1.'
        write: 'Product $= ac = -30$, Sum $= b = 1$'
      - say: 'Two numbers that multiply to negative 30 and add to 1 are plus 6 and negative 5.'
        write: 'Factors: $+6$ and $-5$'
      - say: 'Replace the middle term, $p$, with $6p$ minus $5p$.'
        write: '$2p^{2} + 6p - 5p - 15 = 0$'
      - say: 'Group in pairs. Take out $2p$ from the first pair and negative 5 from the second. Both brackets are $p$ plus 3.'
        write: '$2p(p + 3) - 5(p + 3) = 0$'
      - say: 'Take out the common bracket, $p$ plus 3. What is left is $2p$ minus 5.'
        write: '$(p + 3)(2p - 5) = 0$'
      - say: 'Either the first bracket is zero or the second one is.'
        write: 'Either $p + 3 = 0$ or $2p - 5 = 0$'
      - say: 'So $p$ is negative 3 or 5 over 2.'
        write: '$p = -3$ or $p = \dfrac{5}{2}$'
      - say: 'A price cannot be negative. Therefore $p$ is 5 over 2, two and a half kobo.'
        write: '$\therefore p = 2\tfrac{1}{2}$k'
      - section: 'Check'
        say: 'At two and a half kobo, 240 kobo buys 96 oranges. At 3 kobo it buys 80.'
        write: '$\dfrac{240}{2.5} = 96$, $\dfrac{240}{3} = 80$'
      - say: '96 minus 80 is 16, just as the question says.'
        write: '$96 - 80 = 16\ \checkmark$'
      - say: 'So the present price is two and a half kobo, which is option A.'
        write: '$\therefore$ present price $= 2\tfrac{1}{2}$k (A)'
        answer: true
    traps:
      B: 'You went for three and a half kobo. At that price 240 kobo buys about 68.6 oranges, and at 4 kobo it buys 60, a drop of only about 8.6, not 16. The equation gives $p$ equals two and a half.'
      C: 'You went for five and a half kobo. Remember the 16 counts oranges, not kobo. Set the difference in the numbers of oranges equal to 16, and you get two and a half.'
      D: 'You went for 20 kobo. At 20 kobo, 240 kobo buys only 12 oranges, so the number cannot fall by 16. Solving $2p^{2} + p - 15 = 0$ gives two and a half.'
      E: 'You went for twenty-one and a half kobo. That price buys fewer than 12 oranges, so 16 fewer is impossible. The present price is two and a half kobo.'
  6:
    moments:
      - section: 'The question'
        say: 'A man puts ₦50,000 into two companies. One pays a 6 percent dividend, the other 8 percent, and together they yield ₦3,700. How much went in at 8 percent?'
        write: 'Total invested ₦50,000 at 8% and 6%; total yield ₦3,700'
      - say: 'When one sum is split two ways, we name one part and write the other part as what is left.'
        write: 'Solution'
      - section: 'Let x be'
        say: 'Let x naira be the amount invested at 8 percent.'
        write: 'Let the amount at 8% be ₦$x$'
      - say: 'Then the rest, 50,000 minus x, is at 6 percent.'
        write: 'Amount at 6% $= $₦$(50000 - x)$'
      - section: 'Yield from each part'
        say: 'The yield from each part is the rate over 100, times the amount. So the 8 percent part yields 8 over 100 times x.'
        write: 'Yield at 8% $= \dfrac{8}{100} \times x = \dfrac{8x}{100}$'
      - say: 'And the 6 percent part yields 6 over 100 times 50,000 minus x.'
        write: 'Yield at 6% $= \dfrac{6}{100} \times (50000 - x)$'
      - section: 'Form the equation'
        say: 'Together the two yields make ₦3,700.'
        write: '$\dfrac{8x}{100} + \dfrac{6(50000 - x)}{100} = 3700$'
      - say: 'Multiply every term by 100 to clear the fractions.'
        write: '$8x + 6(50000 - x) = 370000$'
      - say: 'Open the bracket. 6 times 50,000 is 300,000, and 6 times minus x is minus 6x.'
        write: '$8x + 300000 - 6x = 370000$'
      - say: 'Collect like terms. 8x minus 6x is 2x.'
        write: '$2x + 300000 = 370000$'
      - say: 'Subtract 300,000 from both sides. 370,000 minus 300,000 is 70,000.'
        write: '$2x = 70000$'
      - say: 'Divide both sides by 2. 70,000 divided by 2 is 35,000. That is the 8 percent company''s share.'
        write: '$x = 35000$'
        point:
          - {line: 11, kind: highlight, at: '35000'}
      - section: 'Check'
        say: 'Check. The rest is 50,000 minus 35,000, which is 15,000. Put both amounts back into the yields.'
        write: 'Check: $\tfrac{8}{100} \times 35000 + \tfrac{6}{100} \times 15000$'
      - say: '8 percent of 35,000 is 2,800, and 6 percent of 15,000 is 900. 2,800 plus 900 is 3,700, the total yield.'
        write: '$= 2800 + 900 = 3700 \ \checkmark$'
      - section: 'Answer'
        say: 'Therefore he invested ₦35,000 at 8 percent, which is option E.'
        write: '$\therefore$ Amount at 8% $=$ ₦35,000'
        answer: true
    traps:
      A: 'You went for ₦15,000. That is the amount at 6 percent, the other part of the money. We let x be the amount at 8 percent, and x is ₦35,000.'
      B: 'You went for ₦29,600. 8 percent of that is ₦2,368, and 6 percent of the other ₦20,400 is ₦1,224, which adds to only ₦3,592. The equation gives ₦35,000.'
      C: 'You went for ₦21,400. Its yields add to only ₦3,428. The equation 8x plus 6 times 50,000 minus x equals 370,000 gives 2x equals 70,000, so x is ₦35,000.'
      D: 'You went for ₦27,800. Check it. The yields would add to ₦3,556, not ₦3,700. Solve 2x equals 70,000 to get ₦35,000.'
  7:
    moments:
      - section: 'The question'
        say: '30 boys and $x$ girls sat a test. The boys averaged 6, the girls averaged 8, and all their scores add to 468. How many girls? Picture the two groups.'
        write: 'Boys: 30, mean 6; girls: $x$, mean 8; total score $= 468$'
        doodle: {name: 'custom:1984_q07_a', id: test, caption: 'boys and girls sat the same test', size: scene, 'on': 'Picture'}
      - section: 'Solution'
        say: 'Solution. The groups are different sizes, so we cannot just average the two means. We work with totals. The mean is the total over the number, so the total is the mean times the number.'
        write: 'Solution. Total $=$ mean $\times$ number'
      - say: 'Let the number of girls be $x$, as the question names it.'
        write: 'Let the number of girls $= x$'
      - say: 'The boys'' total is 6 times 30, which is 180.'
        write: 'Boys'' total $= 6 \times 30 = 180$'
        doodle_do:
          - {id: test, op: label, part: boys, text: '6 × 30 = 180'}
      - say: 'The girls'' total is 8 times $x$, which is $8x$.'
        write: 'Girls'' total $= 8 \times x = 8x$'
        doodle_do:
          - {id: test, op: label, part: girls, text: '8x'}
      - say: 'Boys'' total plus girls'' total is the whole score, 468. Put the two totals end to end in one bar.'
        write: '$180 + 8x = 468$'
        doodle_do:
          - {id: test, op: stage, stage: 'custom:1984_q07_a2', 'on': 'bar'}
        point:
          - {line: 5, kind: move, from: {line: 3, at: '=180'}, at: '180', text: 'boys'}
          - {line: 5, kind: move, from: {line: 4, at: '=8x'}, at: '8x', text: 'girls'}
      - say: 'Subtract 180 from both sides, so 468 minus 180 is 288. That is the girls'' part of the bar.'
        write: '$8x = 468 - 180 = 288$'
        doodle_do:
          - {id: test, op: label, part: gbar, text: '288'}
      - say: 'Divide both sides by 8.'
        write: '$x = \dfrac{288}{8}$'
      - say: '288 divided by 8 is 36.'
        write: '$\therefore x = 36$'
      - section: 'Check'
        say: 'To check, 8 times 36 is 288, and 180 plus 288 is 468, the total we were given.'
        write: 'Check: $180 + 8(36) = 180 + 288 = 468$ ✓'
      - section: 'Answer'
        say: 'So there were 36 girls, which is option C.'
        write: '$\therefore x = 36$ girls'
        answer: true
    traps:
      A: 'You went for 38. Then the girls'' total would be 8 times 38, which is 304, and the whole score 484, not 468. From 180 plus $8x$ equals 468, $8x$ is 288 and $x$ is 36.'
      B: 'You went for 24. Then the girls'' total would be only 192, and the whole score 372. Total equals mean times number, so 180 plus $8x$ equals 468 gives $x = 36$.'
      D: 'You went for 22. Then the whole score would be 180 plus 176, which is 356. The boys'' total is 180, leaving 288 for the girls, and 288 over 8 is 36.'
      E: 'You went for 41. Then the girls alone would score 328, and the whole score would be 508. The two means cannot be averaged, so use totals. 180 plus $8x$ equals 468, so $x = 36$.'
  8:
    moments:
      - section: 'The question'
        say: 'The cost of making an article is labour ₦70, power ₦15, materials ₦30 and miscellaneous ₦5. We want the angle of the labour sector in a pie chart.'
        write: 'Labour ₦70, power ₦15, materials ₦30, misc. ₦5. Labour angle $= ?$'
      - section: 'Solution'
        say: 'Solution. Draw the table of items and amounts. Each sectoral angle is the amount over the total, times 360 degrees, because the whole circle stands for the whole cost.'
        write: 'Sectoral angle $= \dfrac{\text{amount}}{\text{total}} \times 360^{\circ}$'
        diagram: {id: t, kind: table, columns: [Item, 'Amount (₦)', 'Sectoral angle'], rows: [[Labour, 70, ''], [Power, 15, ''], [Materials, 30, ''], [Misc., 5, '']]}
      - say: 'First the total. 70 plus 15 is 85, plus 30 is 115, plus 5 is 120.'
        write: 'Total $= 70 + 15 + 30 + 5 = ₦120$'
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': '120'}
      - section: 'The labour sector'
        say: 'Labour is ₦70 out of ₦120. Substitute into the formula.'
        write: 'Labour $= \dfrac{70}{120} \times 360^{\circ}$'
        point:
          - {line: 3, kind: highlight, at: '70', to: {diagram: t, part: 'cell:1,2'}}
      - say: 'Simplify, so 360 divided by 120 is 3. So it is 70 times 3 degrees.'
        write: '$= 70 \times 3^{\circ}$'
      - say: '70 times 3 is 210 degrees.'
        write: '$= 210^{\circ}$'
        diagram: {id: p, kind: pie, show: none, sectors: [{label: Labour, value: 70}, {label: Power, value: 15}, {label: Materials, value: 30}, {label: Misc., value: 5}]}
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,3', text: '210°', 'on': '210 degrees'}
          - {id: p, op: angle, part: 'sector:Labour', 'on': '210 degrees'}
      - section: 'Check'
        say: 'Check that the circle is full. Power is 15 times 3, which is 45. Materials is 30 times 3, which is 90. Miscellaneous is 5 times 3, which is 15.'
        write: 'Power $45^{\circ}$, materials $90^{\circ}$, misc. $15^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:2,3', text: '45°', 'on': '45'}
          - {id: t, op: fill, part: 'cell:3,3', text: '90°', 'on': '90'}
          - {id: t, op: fill, part: 'cell:4,3', text: '15°', 'on': 'which is 15'}
      - say: '210 plus 45 plus 90 plus 15 is 360 degrees, the whole circle.'
        write: '$210 + 45 + 90 + 15 = 360^{\circ}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the labour sector is 210 degrees, which is answer choice A.'
        write: '$\therefore$ labour angle $= 210^{\circ}$'
        answer: true
    traps:
      B: 'You went for 105 degrees. That is half the right angle, as if the circle were 180 degrees. Labour is 70 over 120, times 360, which is 210 degrees.'
      C: 'You went for 175 degrees. That would need a total of 144. The total is 120, so labour is 70 over 120, times 360, which is 210 degrees.'
      D: 'You went for 150 degrees. Add up the whole cost first, which is ₦120. Then labour is 70 over 120 of 360 degrees, which is 210.'
      E: 'You went for 90 degrees. That is the materials sector, 30 over 120 of 360. Labour, ₦70, is 210 degrees.'
  9:
    moments:
      - section: 'The question'
        say: 'Bola picks a number at random from 1 to 300. What is the probability that it is divisible by 4? Picture 300 numbered balls in a jar.'
        write: '$1$ to $300$: $P(\text{divisible by } 4) = ?$'
        doodle: {name: 'custom:1984_q09_a', id: balls, caption: 'Bola picks one number from 1 to 300', size: scene}
      - say: 'Solution. Let $E$ be the event that the number is divisible by 4.'
        write: 'Solution: let $E$ = divisible by 4'
      - section: 'The sample space'
        say: 'Every number from 1 to 300 can be picked, one ball for each. So n of $S$, the number of possible outcomes, is 300.'
        write: '$n(S) = 300$'
        doodle_do:
          - {id: balls, op: label, part: jar, text: '300 balls'}
      - section: 'The favourable outcomes'
        say: 'The numbers divisible by 4 are the multiples of 4, which are 4, 8, 12, and so on up to 300. Lay the numbers out in rows of 4, and the last in each row is shaded.'
        write: '$E = \{4,\ 8,\ 12,\ \ldots,\ 300\}$'
        doodle_do:
          - {id: balls, op: stage, stage: 'custom:1984_q09_a2'}
      - say: 'To count them, divide the last one by 4. 300 divided by 4 is 75, so they run from 4 times 1 up to 4 times 75, with one shaded number in each row.'
        write: '$n(E) = 300 \div 4 = 75$'
        doodle_do:
          - {id: balls, op: stage, stage: 'custom:1984_q09_a3'}
        point:
          - {line: 4, kind: highlight, at: '75', to: {doodle: balls, part: rows}}
      - section: 'The probability'
        say: 'The probability of $E$ is n of $E$ over n of $S$, that is, the number of favourable outcomes over the total number of possible outcomes.'
        write: '$P(E) = \dfrac{n(E)}{n(S)}$'
      - say: 'Substitute to get 75 over 300.'
        write: '$= \dfrac{75}{300}$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '= 75'}, at: '300[[75]]', text: 'n(E)'}
          - {line: 6, kind: move, from: {line: 2, at: '= 300'}, at: '[[300]]75', text: 'n(S)'}
      - say: '75 goes into 300 exactly 4 times, so divide the top and the bottom by 75. That gives 1 over 4.'
        write: '$= \dfrac{75 \div 75}{300 \div 75} = \dfrac{1}{4}$'
      - section: 'Check'
        say: 'Check with the shaded column. Every fourth whole number is a multiple of 4, so 1 number in every 4 works.'
        write: 'Check: 1 in every 4 numbers $\Rightarrow \dfrac{1}{4}\ \checkmark$'
        doodle_do:
          - {id: balls, op: pulse, part: fours}
      - section: 'Answer'
        say: 'Therefore the probability that the number is divisible by 4 is 1 over 4, which is option B.'
        write: '$\therefore P(E) = \dfrac{1}{4}$'
        answer: true
    traps:
      A: 'You went for 1 over 3. That would be the probability of a multiple of 3. The multiples of 4 come every fourth number, so n of E is 75, and 75 over 300 is 1 over 4.'
      C: 'You went for 1 over 5. That would be the probability of a multiple of 5. n of E is 300 divided by 4, which is 75, and 75 over 300 is 1 over 4.'
      D: 'You went for 4 over 300. That puts the divisor 4 on top instead of n of E. There are 75 multiples of 4, so P of E is 75 over 300, which is 1 over 4.'
      E: 'You went for 1 over 300. That is the probability of one particular number. Here 75 numbers are favourable, so P of E is 75 over 300, which is 1 over 4.'
  10:
    moments:
      - section: 'The question'
        say: 'There are three logs in one fraction, and one has a base less than 1. Change each log into index form, find its value, then put the fraction together.'
        write: 'Evaluate $\dfrac{\log_{3}27 - \log_{1/4}64}{\log_{3}\frac{1}{81}}$'
      - say: 'Solution. We find the three logs one at a time.'
        write: 'Solution'
      - section: 'Index form'
        say: 'Recall the meaning of a logarithm. Log base $a$ of $N$ equals $x$ means $a$ to the power $x$ equals $N$. Picture the powers of 3 as a ladder, one rung per power.'
        doodle: {name: 'custom:1984_q10_a', id: ladder, caption: 'powers of 3', size: scene}
        write: 'Recall: $\log_{a}N = x$ means $a^{x} = N$'
      - section: 'The first log'
        say: 'Let log base 3 of 27 be $x$. In index form, 3 to the power $x$ equals 27.'
        write: 'Let $\log_{3}27 = x \Rightarrow 3^{x} = 27$'
      - say: '3 times 3 times 3 is 27, so 27 is 3 cubed. The bases are the same, so equate the indices, and $x$ is 3. On the ladder, that is 3 rungs up from 1.'
        doodle_do: [{id: ladder, op: stage, stage: 'custom:1984_q10_a2'}]
        write: '$3^{x} = 3^{3} \quad \therefore x = 3$'
      - section: 'The second log'
        say: 'Let log base 1 over 4 of 64 be $y$. In index form, 1 over 4 to the power $y$ equals 64.'
        write: 'Let $\log_{1/4}64 = y \Rightarrow \left(\tfrac{1}{4}\right)^{y} = 64$'
      - say: 'Write both sides with base 4. By the negative index law, 1 over 4 is 4 to the power minus 1. And 64 is 4 cubed.'
        write: '$\left(4^{-1}\right)^{y} = 4^{3}$'
      - say: 'The law of indices for a power of a power says multiply the indices. Minus 1 times $y$ is minus $y$.'
        write: '$4^{-y} = 4^{3}$ $\quad [(a^{m})^{n} = a^{mn}]$'
      - say: 'Equate the indices, so minus $y$ equals 3. Multiply both sides by minus 1, so $y$ is minus 3.'
        write: '$-y = 3 \quad \therefore y = -3$'
      - section: 'The bottom log'
        say: 'Let log base 3 of 1 over 81 be $z$. In index form, 3 to the power $z$ equals 1 over 81.'
        write: 'Let $\log_{3}\tfrac{1}{81} = z \Rightarrow 3^{z} = \tfrac{1}{81}$'
      - say: '81 is 3 to the power 4, and 1 over 3 to the 4 is 3 to the minus 4. On the ladder, that is 4 rungs down from 1.'
        doodle_do: [{id: ladder, op: stage, stage: 'custom:1984_q10_a3'}]
        write: '$3^{z} = \dfrac{1}{3^{4}} = 3^{-4}$'
      - say: 'Equate the indices. $z$ is minus 4.'
        write: '$\therefore z = -4$'
      - section: 'Put them together'
        say: 'Now put the three values into the fraction. The top is 3 minus minus 3, and the bottom is minus 4.'
        write: '$\dfrac{\log_{3}27 - \log_{1/4}64}{\log_{3}\frac{1}{81}} = \dfrac{3 - (-3)}{-4}$'
      - say: 'Minus a minus is plus, so the top is 3 plus 3, which is 6.'
        write: '$= \dfrac{6}{-4}$'
      - say: 'Divide the top and bottom by 2. A positive over a negative is negative, so this is minus 3 over 2.'
        write: '$= -\dfrac{3}{2}$'
      - section: 'Check'
        say: 'Check the tricky log by going back to index form. 1 over 4 to the power minus 3 is 4 cubed, which is 64. So $y$ equals minus 3 is right.'
        write: 'Check: $\left(\tfrac{1}{4}\right)^{-3} = 4^{3} = 64\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the value is minus 3 over 2, which is option C.'
        write: '$\therefore$ the value $= -\dfrac{3}{2}$'
        answer: true
    traps:
      A: 'You went for 7 over 4. The bottom, log base 3 of 1 over 81, is minus 4, so the answer must be negative. And the top is 3 minus minus 3, which is 6, giving minus 3 over 2.'
      B: 'You went for minus 7 over 4. The bottom is right, but the top is 3 minus minus 3, which is 6, not 7. Then 6 over minus 4 is minus 3 over 2.'
      D: 'You went for 7 over 3. Change each log to index form, and the values are 3, minus 3 and minus 4. Then 6 over minus 4 is minus 3 over 2.'
      E: 'You went for minus 1 over 4. A base less than 1 needs a negative index to give a number bigger than 1, so log base 1 over 4 of 64 is minus 3. The top is then 6, and 6 over minus 4 is minus 3 over 2.'
  11:
    moments:
      - section: 'The question'
        say: 'A point P moves in a straight path. One position is 0, minus 3, and each time $x$ increases by 1, $y$ increases by 4. We want the equation of its graph.'
        write: '$P(0,\ -3)$; $x$ increases by 1 $\Rightarrow y$ increases by 4'
      - section: 'Solution'
        say: 'Solution. Let me draw the axes and mark the point we are given, 0, minus 3. Call it the first point, $x$ 1, $y$ 1.'
        write: 'Solution: $(x_{1},\ y_{1}) = (0,\ -3)$'
        diagram:
          id: g
          kind: graph
          x: [-2, 3]
          y: [-5, 6]
          step: 1
          plots:
            - {fn: '4x - 3', label: 'y + 3 = 4x', colour: green, later: true}
          points:
            - {x: 0, y: -3, text: '(0, −3)', colour: blue}
      - section: 'A second point'
        say: 'Get a second point from the second fact. Add 1 to $x$ and add 4 to $y$, so 0 plus 1 is 1, and minus 3 plus 4 is 1.'
        write: '$(x_{2},\ y_{2}) = (0 + 1,\ -3 + 4) = (1,\ 1)$'
        diagram_do:
          - {id: g, op: point, x: 1, y: 1, text: '(1, 1)', colour: blue}
      - section: 'The gradient'
        say: 'The gradient, $m$, of the line through two points is $y$ 2 minus $y$ 1, over $x$ 2 minus $x$ 1.'
        write: '$m = \dfrac{y_{2} - y_{1}}{x_{2} - x_{1}}$'
      - say: 'Substitute. $y$ 2 minus $y$ 1 is 1 minus minus 3, with the minus 3 in a bracket. $x$ 2 minus $x$ 1 is 1 minus 0.'
        write: '$= \dfrac{1 - (-3)}{1 - 0}$'
      - say: '1 minus minus 3 is 1 plus 3, which is 4. 1 minus 0 is 1. So the gradient is 4.'
        write: '$= \dfrac{4}{1} = 4$'
      - section: 'The equation'
        say: 'The equation of a line with gradient $m$ through the point $x$ 1, $y$ 1 is $y$ minus $y$ 1 equals $m$ times, bracket, $x$ minus $x$ 1.'
        write: '$y - y_{1} = m(x - x_{1})$'
      - say: 'Substitute $m$ equals 4, $x$ 1 equals 0 and $y$ 1 equals minus 3.'
        write: '$y - (-3) = 4(x - 0)$'
      - say: 'Minus minus 3 is plus 3, and $x$ minus 0 is $x$. Now draw the line through the two points.'
        write: '$\therefore y + 3 = 4x$'
        diagram_do:
          - {id: g, op: plot}
      - section: 'Check'
        say: 'Check with the second point, 1, 1. The left side is 1 plus 3, which is 4. The right side is 4 times 1, which is 4.'
        write: 'Check: $(1,\ 1)$: $1 + 3 = 4 = 4(1)\ \checkmark$'
        diagram_do:
          - {id: g, op: gradient, part: 'plot:1', x: [0, 1], text: 'up 4 for 1 across'}
      - say: 'Therefore the equation of the graph is $y$ plus 3 equals $4x$, which is option D.'
        write: '$\therefore$ the equation is $y + 3 = 4x$'
        answer: true
    traps:
      A: 'You went for minus 3 equals $y$ plus 4, over $x$ plus 1. That mixes the point and the increases into one fraction, and at $x = 0$ it gives $y = -7$. Use $y - y_{1} = m(x - x_{1})$ with $m = 4$.'
      B: 'You went for $4y = -3 + x$. That line has gradient 1 over 4, the fraction upside down. The gradient is the change in $y$ over the change in $x$, which is 4 over 1.'
      C: 'You went for $y$ over $x$ equals minus 3 over 4. That line passes through the origin, not through 0, minus 3. Substitute into $y - y_{1} = m(x - x_{1})$ to get $y + 3 = 4x$.'
      E: 'You went for $4y = x + 3$. At $x = 0$ it gives $y = \tfrac{3}{4}$, not minus 3, and its gradient is 1 over 4. The line rises 4 for every 1 across.'
  12:
    moments:
      - section: 'The question'
        say: 'This trader counts in base five. He buys one-zero-three base five oranges at one-four base five monts each, and sells them at two-four base five each. What is his gain?'
        write: '$103_{5}$ oranges, C.P. $\text{M}14_{5}$, S.P. $\text{M}24_{5}$ each'
      - say: 'Everything is in base five, so we can work in base five itself, as WAEC expects.'
        write: 'Solution'
      - section: 'Gain on one orange'
        say: 'The gain on one orange is the selling price, S.P., minus the cost price, C.P.'
        write: 'Gain on one orange $=$ S.P. $-$ C.P.'
      - say: 'S.P. is two-four base five, and C.P. is one-four base five.'
        write: '$= 24_{5} - 14_{5}$'
      - say: 'Subtract in columns. In the units, 4 minus 4 is 0. In the fives, 2 minus 1 is 1. No borrowing is needed.'
        write: '$\begin{array}{rrr} & 2 & 4 \\ - & 1 & 4 \\ \hline & 1 & 0 \end{array}$'
      - say: 'So he gains one-zero base five monts on each orange.'
        write: 'Gain on one orange $= \text{M}10_{5}$'
      - section: 'Gain on all the oranges'
        say: 'He sold one-zero-three base five oranges, so multiply the gain on one by the number of oranges.'
        write: 'Total gain $= 103_{5} \times 10_{5}$'
      - say: 'One-zero base five is 5, the base itself. Multiplying by the base moves every digit one place to the left, and a nought fills the units.'
        write: '$= 1030_{5}$'
      - section: 'Check: change to base ten'
        say: 'Check in base ten. Write index numbers over one-zero-three, then multiply each digit by five to the power of its index.'
        write: '$\overset{2}{1}\,\overset{1}{0}\,\overset{0}{3}_{5} = 1 \times 5^{2} + 0 \times 5^{1} + 3 \times 5^{0}$'
      - say: '25 plus 0 plus 3 is 28. So he sold 28 oranges.'
        write: '$= 25 + 0 + 3 = 28$ oranges'
      - say: 'One-zero base five is 1 times 5, plus 0, which is 5 monts gain on each.'
        write: '$\overset{1}{1}\,\overset{0}{0}_{5} = 1 \times 5^{1} + 0 \times 5^{0} = 5$'
      - say: '28 oranges at 5 monts gain each is 140 monts.'
        write: '$28 \times 5 = 140$'
      - say: 'Now expand our answer, one-zero-three-zero base five, with index numbers three, two, one, nought.'
        write: '$\overset{3}{1}\,\overset{2}{0}\,\overset{1}{3}\,\overset{0}{0}_{5} = 1 \times 5^{3} + 0 \times 5^{2} + 3 \times 5^{1} + 0 \times 5^{0}$'
      - say: '5 cubed is 125, and 3 times 5 is 15. 125 plus 15 is 140. It agrees.'
        write: '$= 125 + 0 + 15 + 0 = 140\ \checkmark$'
        point:
          - {line: 13, kind: move, from: {line: 11, at: '=140'}, at: '140'}
      - section: 'Answer'
        say: 'Therefore his gain is one-zero-three-zero base five monts, which is option B.'
        write: '$\therefore$ gain $= \text{M}1030_{5}$'
        answer: true
    traps:
      A: 'You went for one-zero-three base five. That is the number of oranges, not the gain. Multiply it by the gain on one orange, one-zero base five, to get one-zero-three-zero base five.'
      C: 'You went for one-zero-two base five. That is only 27 in base ten. The gain is 28 oranges at 5 monts each, which is 140, or one-zero-three-zero base five.'
      D: 'You went for two-zero-zero-two base five. That is 252, what he paid for 28 oranges at 9 monts. The gain is S.P. minus C.P. on each orange, times the number of oranges.'
      E: 'You went for three-zero-three-two base five. That is 392, what he took in for 28 oranges at 14 monts. Take away the cost to get the gain.'
  13:
    moments:
      - section: 'The question'
        say: 'There are surds on the top and on the bottom. To rationalise means to clear the surds out of the denominator. One multiplication does it, using the conjugate.'
        write: 'Rationalise $\dfrac{5\sqrt{7} - 7\sqrt{5}}{\sqrt{7} - \sqrt{5}}$'
      - say: 'Solution. We multiply the numerator and the denominator by the conjugate of the denominator, then simplify each one.'
        write: 'Solution'
      - section: 'The conjugate'
        say: 'The conjugate of root 7 minus root 5 is root 7 plus root 5, which is the same two terms, with the sign between them changed.'
        write: 'Conjugate of $\sqrt{7} - \sqrt{5}$ is $\sqrt{7} + \sqrt{5}$'
      - say: 'Multiply the numerator and the denominator by root 7 plus root 5. Root 7 plus root 5, over itself, is 1, so the value does not change.'
        write: '$= \dfrac{5\sqrt{7} - 7\sqrt{5}}{\sqrt{7} - \sqrt{5}} \times \dfrac{\sqrt{7} + \sqrt{5}}{\sqrt{7} + \sqrt{5}}$'
      - section: 'The denominator'
        say: 'The denominator is a difference of two squares, where $a$ minus $b$, times $a$ plus $b$, is $a$ squared minus $b$ squared. Picture a square of area 7 with a square of area 5 taken from it.'
        doodle: {name: 'custom:1984_q13_a', id: tiles, caption: 'square minus square'}
        write: '$(a - b)(a + b) = a^{2} - b^{2}$'
      - say: 'Here $a$ is root 7 and $b$ is root 5. So the denominator is root 7 squared minus root 5 squared.'
        write: 'Denominator $= (\sqrt{7})^{2} - (\sqrt{5})^{2}$'
      - say: 'Root 7 squared is 7, and root 5 squared is 5. 7 minus 5 is 2. No surd is left, and that is the strip left in the picture.'
        doodle_do: [{id: tiles, op: stage, stage: 'custom:1984_q13_a2'}]
        write: '$= 7 - 5 = 2$'
        point:
          - {line: 6, kind: highlight, at: '7−5=2', to: {doodle: tiles, part: rest}}
      - section: 'The numerator'
        say: 'Now the numerator, which is 5 root 7 minus 7 root 5, times root 7 plus root 5.'
        write: 'Numerator $= (5\sqrt{7} - 7\sqrt{5})(\sqrt{7} + \sqrt{5})$'
      - say: 'Open the brackets. Each term in the first bracket multiplies each term in the second.'
        write: '$= 5\sqrt{7}\sqrt{7} + 5\sqrt{7}\sqrt{5} - 7\sqrt{5}\sqrt{7} - 7\sqrt{5}\sqrt{5}$'
      - say: 'Root 7 times root 7 is 7, so 5 times 7. Root 7 times root 5 is root 35. Root 5 times root 5 is 5, so minus 7 times 5.'
        write: '$= 5(7) + 5\sqrt{35} - 7\sqrt{35} - 7(5)$ $\quad [\sqrt{a}\sqrt{b} = \sqrt{ab}]$'
      - say: '35 minus 35 is 0. And 5 root 35 minus 7 root 35 is minus 2 root 35.'
        write: '$= 35 - 35 - 2\sqrt{35} = -2\sqrt{35}$'
      - section: 'Divide'
        say: 'Put the numerator over the denominator, and we get minus 2 root 35, over 2.'
        write: '$\therefore \dfrac{5\sqrt{7} - 7\sqrt{5}}{\sqrt{7} - \sqrt{5}} = \dfrac{-2\sqrt{35}}{2}$'
        doodle_do: [{id: tiles, op: pulse, part: rest}]
      - say: 'Divide by 2. The 2s cancel, leaving minus root 35.'
        write: '$= -\sqrt{35}$'
      - section: 'Check'
        say: 'Check with decimals. 5 root 7 is about 13.23 and 7 root 5 is about 15.65. The denominator is about 0.41. The fraction is about minus 5.9, and root 35 is about 5.92.'
        write: 'Check: $\dfrac{13.23 - 15.65}{0.41} \approx -5.9 \approx -\sqrt{35}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the fraction rationalises to minus root 35, which is option C.'
        write: '$\therefore$ the answer is $-\sqrt{35}$'
        answer: true
    traps:
      A: 'You went for minus 2 root 35. That is the numerator after multiplying by the conjugate, but it still has to be divided by the denominator, 2. Minus 2 root 35 over 2 is minus root 35.'
      B: 'You went for 4 root 7 minus 6 root 5. That takes the denominator away from the numerator term by term, which is not how fractions work. Multiply the numerator and denominator by the conjugate, root 7 plus root 5.'
      D: 'You went for 4 root 7 minus 8 root 5. Surds in a fraction cannot be cancelled term by term. Multiply by the conjugate, and the 35 and minus 35 cancel, and you are left with minus root 35.'
      E: 'You went for root 35. The size is right, but watch the sign. 5 root 35 minus 7 root 35 is minus 2 root 35, so the answer is minus root 35.'
  14:
    moments:
      - section: 'The question'
        say: 'There are powers of 3 with $n$ in them, on the top and the bottom. The classroom way is to split 3 to the $n$ minus 1 with a law of indices, then let 3 to the $n$ be $y$.'
        write: 'Simplify $\dfrac{3^{n} - 3^{n-1}}{3^{3} \times 3^{n} - 27 \times 3^{n-1}}$'
      - say: 'Solution. We write every power in terms of 3 to the $n$ first.'
        write: 'Solution'
      - section: 'Split the index'
        say: 'The law of indices says $a$ to the $m$ times $a$ to the $n$ is $a$ to the $m$ plus $n$. Read it backwards, so 3 to the $n$ minus 1 is 3 to the $n$, times 3 to the negative 1.'
        write: '$3^{n-1} = 3^{n} \times 3^{-1}$ $\quad [a^{m+n} = a^{m} \times a^{n}]$'
      - say: 'A negative index means the reciprocal, so 3 to the negative 1 is 1 over 3. So 3 to the $n$ minus 1 is 3 to the $n$ over 3.'
        write: '$= 3^{n} \times \tfrac{1}{3} = \dfrac{3^{n}}{3}$ $\quad [a^{-1} = \tfrac{1}{a}]$'
      - say: 'Now let 3 to the $n$ be $y$. Then 3 to the $n$ minus 1 is $y$ over 3.'
        write: 'Let $3^{n} = y$, so $3^{n-1} = \dfrac{y}{3}$'
      - section: 'The numerator'
        say: 'Substitute into the numerator, giving $y$ minus $y$ over 3.'
        write: 'Numerator $= 3^{n} - 3^{n-1} = y - \dfrac{y}{3}$'
      - say: 'The L.C.M. is 3. $y$ is $3y$ over 3, and $3y$ minus $y$ is $2y$.'
        write: '$= \dfrac{3y - y}{3} = \dfrac{2y}{3}$'
      - section: 'The denominator'
        say: 'Now the denominator. 3 cubed is 27, and 3 to the $n$ is $y$.'
        write: 'Denominator $= 3^{3} \times 3^{n} - 27 \times 3^{n-1}$'
      - say: 'Now substitute, giving 27 times $y$, minus 27 times $y$ over 3.'
        write: '$= 27 \times y - 27 \times \dfrac{y}{3}$'
      - say: '27 over 3 is 9, so the second term is $9y$. And $27y$ minus $9y$ is $18y$.'
        write: '$= 27y - 9y = 18y$'
      - section: 'Divide'
        say: 'Now the numerator divided by the denominator. To divide by $18y$, multiply by 1 over $18y$.'
        write: '$\dfrac{2y}{3} \div 18y = \dfrac{2y}{3} \times \dfrac{1}{18y}$'
        point:
          - {line: 10, kind: move, from: {line: 6, at: '32y'}, at: '[[32y]]÷', text: 'numerator'}
          - {line: 10, kind: move, from: {line: 9, at: '=18y'}, at: '÷18y', text: 'denominator'}
      - say: '$y$ is on the top and the bottom, so it cancels. 3 times 18 is 54, leaving 2 over 54.'
        write: '$= \dfrac{2}{54}$'
      - say: 'Divide the top and bottom by 2. 2 over 2 is 1, and 54 over 2 is 27.'
        write: '$\therefore$ the expression $= \dfrac{1}{27}$'
      - section: 'Check'
        say: 'Check with $n$ equals 1. The top is 3 minus 1, which is 2. The bottom is 27 times 3, minus 27 times 1, which is 54. And 2 over 54 is 1 over 27.'
        write: 'Check $n = 1$: $\ \dfrac{3 - 1}{27 \times 3 - 27 \times 1} = \dfrac{2}{54} = \dfrac{1}{27}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the expression simplifies to 1 over 27, which is option C.'
        write: '$\therefore \dfrac{1}{27}$'
        answer: true
    traps:
      A: 'You went for 1. The top and bottom are not equal. With 3 to the $n$ as $y$, the top is $2y$ over 3 and the bottom is $18y$, so the fraction is 2 over 54, which is 1 over 27.'
      B: 'You went for 0. The top is not zero. 3 to the $n$ minus 3 to the $n$ minus 1 is $y$ minus $y$ over 3, which is $2y$ over 3. Divided by $18y$, that is 1 over 27.'
      D: 'You went for 3 to the $n$ minus 3 to the $n$ minus 1. That is just the numerator again. The denominator is $18y$, and dividing gives 1 over 27.'
      E: 'You went for 2 over 27. That takes the denominator as $9y$, which is only 27 times $y$ over 3. The denominator is $27y$ minus $9y$, which is $18y$, so the answer is 2 over 54, which is 1 over 27.'
  15:
    moments:
      - section: 'The question'
        say: '$p$ varies directly as the square of $q$ and inversely as $r$. One set of values lets us find the constant, and then we can find $p$ for any new values.'
        write: '$p = 36$ when $q = 3,\ r = 4$; $\ p = ?$ when $q = 5,\ r = 2$'
      - say: 'Solution. First the variation statement. Directly as $q$ squared puts $q$ squared on top, and inversely as $r$ puts $r$ underneath.'
        write: 'Solution: $\ p \propto \dfrac{q^{2}}{r}$'
      - say: 'Replace the sign of proportionality with a constant, $k$, the constant of variation.'
        write: '$\therefore\ p = \dfrac{kq^{2}}{r}$'
      - section: 'Find k'
        say: 'To find $k$, substitute the first set, where $p$ is 36, $q$ is 3 and $r$ is 4. Picture $q$ squared as a square of tiles, shared over $r$ plates.'
        doodle: {name: 'custom:1984_q15_a', id: share, caption: 'q² tiles shared over r plates', size: scene}
        write: 'When $p = 36,\ q = 3,\ r = 4$: $\ 36 = \dfrac{k \times 3^{2}}{4}$'
        point:
          - {line: 3, kind: move, from: {line: 0, at: 'p = [[36]]'}, at: ':[[36]] =', text: 'p'}
      - say: '3 squared is 9.'
        write: '$36 = \dfrac{9k}{4}$'
      - say: 'Multiply both sides by 4. 36 times 4 is 144.'
        write: '$9k = 144$'
      - say: 'Divide both sides by 9. 144 divided by 9 is 16.'
        doodle_do: [{id: share, op: label, part: left, text: 'k = 16'}]
        write: '$k = \dfrac{144}{9} = 16$'
      - section: 'The equation'
        say: 'So the equation connecting $p$, $q$ and $r$ is $p$ equals $16 q$ squared over $r$.'
        write: '$\therefore\ p = \dfrac{16q^{2}}{r}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '= 16'}, at: '[[16]]q2', text: 'k'}
      - section: 'Find p'
        say: 'Now substitute the new values, $q$ equals 5 and $r$ equals 2. On the picture, that is 5 by 5 tiles, over 2 plates.'
        doodle_do: [{id: share, op: stage, stage: 'custom:1984_q15_a2'}]
        write: 'When $q = 5,\ r = 2$: $\ p = \dfrac{16 \times 5^{2}}{2}$'
      - say: '5 squared is 25, and 16 times 25 is 400.'
        write: '$= \dfrac{16 \times 25}{2} = \dfrac{400}{2}$'
      - say: '400 divided by 2 is 200.'
        doodle_do: [{id: share, op: label, part: right, text: 'p = 200'}]
        write: '$\therefore\ p = 200$'
        point:
          - {line: 10, kind: highlight, at: '200', to: {doodle: share, part: right}}
      - section: 'Check'
        say: 'Check by scale factors. $q$ squared goes from 9 to 25, and halving $r$ doubles $p$. 36 times 25 over 9 is 100, and times 2 is 200.'
        write: 'Check: $\ 36 \times \dfrac{25}{9} \times 2 = 100 \times 2 = 200\ \checkmark$'
      - say: 'So $p$ is 200, which is option D.'
        write: '$p = 200$'
        answer: true
    traps:
      A: 'You went for 72. That doubles 36 for the halving of $r$, but forgets that $q$ went from 3 to 5, so $q$ squared grows from 9 to 25. With $k = 16$, $p$ is 16 times 25 over 2, which is 200.'
      B: 'You went for 100. That handles $q$ but forgets $r$. Halving $r$ doubles $p$, because the variation with $r$ is inverse. So $p$ is 200.'
      C: 'You went for 90. Find $k$ first. 36 equals $9k$ over 4 gives $k = 16$. Then $p$ is 16 times 25 over 2, which is 200.'
      E: 'You went for 125. Remember $p$ goes with the square of $q$, divided by $r$. With $k = 16$, $p$ is 16 times 25 over 2, which is 200.'
  16:
    moments:
      - section: 'The question'
        say: 'Factorise this quadratic. Two options start with 6 and two start with 2, so the first step decides a lot. Picture the three terms as tiles.'
        write: '$6x^{2} - 14x - 12$'
        doodle: {name: 'custom:1984_q16_a', id: tiles, caption: 'three term tiles', size: scene}
      - section: 'Solution'
        say: 'Always take out the common factor first. Then factorise what is left by product and sum.'
        write: 'Solution'
      - say: '6, 14 and 12 are all even, so 2 divides every term. Only 2 is common to all three. Take it out.'
        write: '$6x^{2} - 14x - 12 = 2(3x^{2} - 7x - 6)$'
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1984_q16_a2'}
      - section: 'Factorise the bracket'
        say: 'Inside the bracket, $a$ is 3, $b$ is negative 7 and $c$ is negative 6. The product is $ac$, so 3 times negative 6, which is negative 18. The sum is $b$, negative 7.'
        write: 'Product $= ac = -18$, Sum $= b = -7$'
      - say: 'Two numbers that multiply to negative 18 and add to negative 7 are negative 9 and plus 2.'
        write: 'Factors: $-9$ and $+2$'
      - say: 'Replace the middle term, negative $7x$, with negative $9x$ plus $2x$. Lay the four pieces out in a grid.'
        write: '$3x^{2} - 9x + 2x - 6$'
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1984_q16_a3'}
      - say: 'Group in pairs. From the first pair take out $3x$, and from the second take out 2. Both brackets are $x$ minus 3.'
        write: '$= 3x(x - 3) + 2(x - 3)$'
      - say: 'Take out the common bracket, $x$ minus 3. What is left is $3x$ plus 2. They are the sides of the grid.'
        write: '$= (x - 3)(3x + 2)$'
        doodle_do:
          - {id: tiles, op: label, part: grid, text: '(x − 3)(3x + 2)'}
      - say: 'Do not forget the 2 we took out at the start. Put it back in front.'
        write: '$\therefore 6x^{2} - 14x - 12 = 2(x - 3)(3x + 2)$'
        doodle_do:
          - {id: tiles, op: pulse, part: halves}
        point:
          - {line: 8, kind: move, from: {line: 2, at: '=[[2]]('}, at: '=[[2]](x', text: 'the 2'}
      - section: 'Check'
        say: 'Expand back. $x$ minus 3, times $3x$ plus 2, is $3x$ squared plus $2x$ minus $9x$ minus 6.'
        write: '$(x - 3)(3x + 2) = 3x^{2} + 2x - 9x - 6$'
      - say: '$2x$ minus $9x$ is negative $7x$.'
        write: '$= 3x^{2} - 7x - 6$'
      - say: 'Times 2, it gives back the expression we started with.'
        write: '$2(3x^{2} - 7x - 6) = 6x^{2} - 14x - 12\ \checkmark$'
      - say: 'So the factorisation is 2, times $x$ minus 3, times $3x$ plus 2, which is option C.'
        write: '$\therefore 2(x - 3)(3x + 2)$ (C)'
        answer: true
    traps:
      A: 'You went for 2, times $x$ plus 3, times $3x$ minus 2. Both signs are reversed. It expands to $6x$ squared plus $14x$ minus 12, with the wrong sign on the middle term.'
      B: 'You went for 6, times $x$ minus 2, times $x$ plus 1. That expands to $6x$ squared minus $6x$ minus 12, not minus $14x$ in the middle. Only 2 is common to all three terms.'
      D: 'You went for 6, times $x$ plus 2, times $x$ minus 1. That expands to $6x$ squared plus $6x$ minus 12. Take out just 2, then split negative $7x$ into negative $9x$ plus $2x$.'
      E: 'You went for $3x$ plus 4, times $2x$ plus 3. That expands to $6x$ squared plus $17x$ plus 12, with every sign positive. Expanding back is the quickest way to test a factorisation.'
  17:
    moments:
      - section: 'The question'
        say: 'A straight line through the origin meets a curve at two points. We know one of them, 5, 5. That one point unlocks the line, and the line unlocks the other point.'
        write: '$y = mx$ meets $y = x^{2} - 12x + 40$'
      - section: 'Solution'
        say: 'Let me sketch the line and the curve. They meet at A, the point 5, 5, and at B, the point we want.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'y = mx', text: 'line'}
          - {figure: sketch, kind: circle, target: 'y = x² − 12x + 40', text: 'curve'}
          - {figure: sketch, kind: circle, target: A, text: '(5, 5)'}
      - say: 'First find $m$. The point 5, 5 is on the line, so put $x$ equals 5 and $y$ equals 5 into $y$ equals $mx$.'
        write: 'At $(5,\ 5)$: $5 = m(5)$'
      - say: 'Divide both sides by 5, and $m$ is 1.'
        write: '$m = \dfrac{5}{5} = 1$'
      - say: 'Therefore the line is $y$ equals $x$.'
        write: '$\therefore$ the line is $y = x$'
        point:
          - {figure: sketch, kind: label, target: 'y = mx', text: 'y = x'}
      - section: 'Where they meet'
        say: 'Where the line meets the curve, both give the same $y$. So the curve''s $y$ equals the line''s $y$, which is $x$.'
        write: '$x^{2} - 12x + 40 = x$'
        point:
          - {figure: sketch, kind: circle, target: A, text: 'meet'}
          - {figure: sketch, kind: circle, target: B, text: 'meet'}
      - say: 'Subtract $x$ from both sides to make the right-hand side zero.'
        write: '$x^{2} - 12x - x + 40 = 0$'
      - say: 'Collect like terms, so negative $12x$ minus $x$ is negative $13x$.'
        write: '$x^{2} - 13x + 40 = 0$'
      - say: 'Here $a$ is 1, $b$ is negative 13 and $c$ is 40. The product is $ac$, 40. The sum is $b$, negative 13.'
        write: 'Product $= ac = 40$, Sum $= b = -13$'
      - say: 'Two numbers that multiply to 40 and add to negative 13 are negative 5 and negative 8.'
        write: 'Factors: $-5$ and $-8$'
      - say: 'Replace the middle term, negative $13x$, with negative $5x$ minus $8x$.'
        write: '$x^{2} - 5x - 8x + 40 = 0$'
      - say: 'Group in pairs. Take out $x$ from the first pair and negative 8 from the second. Both brackets are $x$ minus 5.'
        write: '$x(x - 5) - 8(x - 5) = 0$'
      - say: 'Take out the common bracket, $x$ minus 5. What is left is $x$ minus 8.'
        write: '$(x - 5)(x - 8) = 0$'
      - say: 'Either the first bracket is zero or the second one is.'
        write: 'Either $x - 5 = 0$ or $x - 8 = 0$'
      - say: 'So $x$ is 5 or 8. The 5 is the point we were given, so the new point has $x$ equals 8.'
        write: '$x = 5$ (given) or $x = 8$'
        point:
          - {line: 14, kind: circle, at: 'x=8', text: 'new point'}
          - {figure: sketch, kind: circle, target: B, text: 'x = 8'}
      - say: 'Its $y$ comes from the line, $y$ equals $x$. So $y$ is 8 too.'
        write: 'When $x = 8$: $y = x = 8$'
      - say: 'Therefore the other point is 8, 8.'
        write: '$\therefore$ the other point is $(8,\ 8)$'
        point:
          - {figure: sketch, kind: label, target: B, text: '(8, 8)'}
      - section: 'Check'
        say: 'Check that 8, 8 is on the curve too. 8 squared is 64, 12 times 8 is 96, and 64 minus 96 plus 40 is 8.'
        write: '$8^{2} - 12(8) + 40 = 64 - 96 + 40$'
      - say: 'That is 8, the same $y$. So 8, 8 is on both the line and the curve.'
        write: '$= 8\ \checkmark$'
        point:
          - {figure: sketch, kind: circle, target: 'y = x² − 12x + 40', text: 'on the curve too'}
      - say: 'So the other point is 8, 8, which is option B.'
        write: '$\therefore (8,\ 8)$ (B)'
        point:
          - {figure: sketch, kind: label, target: '?', text: '(8, 8)'}
        answer: true
    traps:
      A: 'You went for 5, 6. That is not on the line $y = x$, and at $x$ equals 5 the curve gives 5, not 6. Solving $x^{2} - 13x + 40 = 0$ gives $x$ equals 8, and then $y$ is 8.'
      C: 'You went for 8, 5. The $x$ is right, but the $y$ must come from the line $y = x$, so it is 8, not 5.'
      D: 'You went for 7, 7. That is on the line, but not on the curve, because 49 minus 84 plus 40 is 5, not 7. The meeting point is 8, 8.'
      E: 'You went for 7, 5. That is on the curve, but not on the line $y = x$. The point must be on both, which gives 8, 8.'
  18:
    moments:
      - section: 'The question'
        say: 'We have a table of values for $y$ equals $x$ squared minus $3x$ plus 1. We want where the graph crosses the $x$-axis between $x$ equals minus 2 and $x$ equals 1.'
        write: '$y = x^{2} - 3x + 1$, $\ -2 \le x \le 1$'
      - section: 'Solution'
        say: 'Solution. On the $x$-axis, $y$ is 0. So where the graph crosses the axis, $y$ changes sign, from positive to negative, or negative to positive.'
        write: 'Solution: on the $x$-axis, $y = 0$'
      - say: 'So we look for the change of sign in the $y$ row of the table.'
        write: 'Crossing $\Rightarrow$ $y$ changes sign'
      - say: 'Copy the part of the table we need, from $x$ equals minus 2 to 1, and check one value. At minus 2, we get 4, plus 6, plus 1, which is 11, as the table says.'
        write: 'At $x = -2$: $\ y = (-2)^{2} - 3(-2) + 1 = 11$ ✓'
        diagram:
          id: t
          kind: table
          columns: ['x', 'y', 'sign of y']
          rows: [[-2, 11, ''], [-1, 5, ''], [0, 1, ''], [1, -1, '']]
          'on': 'Copy'
      - say: 'Now the sign column. 11 is positive, 5 is positive, and 1 is positive.'
        write: '$y > 0$ at $x = -2,\ -1,\ 0$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,3', text: '+'}
          - {id: t, op: fill, part: 'cell:2,3', text: '+'}
          - {id: t, op: fill, part: 'cell:3,3', text: '+'}
      - say: 'But at $x$ equals 1, $y$ is minus 1, which is negative. From $x$ equals 0 to 1, $y$ goes from 1 to minus 1. The sign has changed.'
        write: '$y(0) = 1 > 0,\ \ y(1) = -1 < 0$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,3', text: '−', colour: orange}
          - {id: t, op: highlight, part: 'row:3', text: 'sign changes', 'on': 'changed'}
          - {id: t, op: highlight, part: 'row:4'}
      - say: 'From minus 2 to 0 the sign never changes, so there is no crossing there. The only crossing is between 0 and 1.'
        write: '$\therefore$ the graph crosses in $0 < x < 1$'
      - section: 'Check'
        say: 'Check with the quadratic formula. $x$ equals minus $b$, plus or minus the square root of $b$ squared minus $4ac$, all over $2a$.'
        write: '$x = \dfrac{-b \pm \sqrt{b^{2} - 4ac}}{2a}$'
      - say: 'Here $a$ is 1, $b$ is minus 3 and $c$ is 1. So $x$ is 3 plus or minus the square root of 9 minus 4, over 2.'
        write: '$x = \dfrac{3 \pm \sqrt{9 - 4}}{2} = \dfrac{3 \pm \sqrt{5}}{2}$'
      - say: 'Root 5 is about 2.24. So $x$ is about 0.38 or 2.62. Only 0.38 lies between minus 2 and 1, and it is between 0 and 1. On the graph, that is where the curve cuts the axis.'
        write: '$x \approx 0.38$ or $x \approx 2.62$ ✓'
        diagram:
          id: g
          kind: graph
          x: [-2, 4]
          y: [-2, 12]
          x_step: 1
          y_step: 2
          plots:
            - {fn: 'x^2 - 3x + 1', label: 'y = x² − 3x + 1'}
        diagram_do:
          - {id: g, op: intercepts, part: 'plot:1', axis: x, 'on': 'cuts'}
      - section: 'Answer'
        say: 'So between $x$ equals minus 2 and 1, the graph crosses only in the range 0 less than $x$ less than 1, which is option D.'
        write: '$\therefore\ 0 < x < 1$'
        answer: true
    traps:
      A: 'You went for minus 1 to 0 and 0 to 1. Between minus 1 and 0, $y$ goes from 5 to 1. Both are positive, so there is no change of sign and no crossing. Only 0 to 1 has a change of sign.'
      B: 'You went for minus 2 to minus 1 and 0 to 1. Between minus 2 and minus 1, $y$ goes from 11 to 5, both positive, so no crossing. Only 0 to 1 counts.'
      C: 'You went for minus 1 to 0 only. There, $y$ goes from 5 to 1, both positive. The sign changes between $x = 0$ and $x = 1$.'
      E: 'You went for 1 to 2. That is outside the stretch the question asks about, and $y$ is minus 1 at both ends anyway. The crossing is between 0 and 1.'
  19:
    moments:
      - section: 'The question'
        say: 'Musa ran $5x$ km in the first hour and $x$ plus 10 km in the next. He came second to Ngozi, who covered 118 km. That word "second" hides an inequality. Let''s find it.'
        write: 'Musa: $5x$ km, then $(x + 10)$ km; $\ $Ngozi: 118 km'
      - say: 'Solution. We solve an inequality like an equation, with one extra rule. If we multiply or divide by a negative number, the sign reverses.'
        write: 'Solution'
      - section: 'Musa''s total'
        say: 'Watch Musa run his two hours. His total distance is $5x$ plus $x$ plus 10, which is $6x$ plus 10.'
        write: 'Musa''s total $= 5x + (x + 10) = 6x + 10$'
      - say: 'Ngozi finished first. Musa came second, so his total is less than her 118 km.'
        write: '$6x + 10 < 118$'
        point:
          - {line: 0, kind: underline, at: '118', text: 'Ngozi'}
      - say: 'Subtract 10 from both sides. 118 minus 10 is 108.'
        write: '$6x < 118 - 10$'
      - say: 'So $6x$ is less than 108.'
        write: '$6x < 108$'
      - say: 'Divide both sides by 6. 6 is positive, so the sign stays. 108 divided by 6 is 18.'
        write: '$x < 18$'
      - section: 'Distance is positive'
        say: 'One more condition. Musa covered $5x$ km in the first hour, and a distance must be more than zero.'
        write: '$5x > 0$'
      - say: 'Divide both sides by 5, and $x$ is greater than 0. Then $x$ plus 10 is positive too.'
        write: '$x > 0$'
      - section: 'Answer'
        say: 'Put the two together, so $x$ is greater than 0 and less than 18. Show it on a number line with open circles at 0 and 18, because neither is included.'
        write: '$\therefore\ 0 < x < 18$'
        diagram: {id: n, kind: numberline, range: [-2, 20], step: 2}
        diagram_do:
          - {id: n, op: interval, from: 0, to: 18, from_open: true, to_open: true, text: '0 < x < 18', answer: true, 'on': 'open circles'}
        point:
          - {line: 9, kind: move, from: {line: 8, at: 'x > 0'}, at: '[[0]] <', text: 'from here'}
          - {line: 9, kind: move, from: {line: 6, at: 'x < 18'}, at: '18', text: 'from here'}
      - section: 'Check'
        say: 'Check with $x$ equals 10, inside the range. 6 times 10 plus 10 is 70, which is less than 118. Musa is behind Ngozi, as he should be.'
        write: 'Check $x = 10$: $\ 6(10) + 10 = 70 < 118\ \checkmark$'
      - say: 'So the correct inequality is 0 less than $x$ less than 18, which is option E.'
        write: '$0 < x < 18$'
        answer: true
    traps:
      A: 'You went for 0 less than minus $x$ less than 15. That makes $x$ negative, and then $5x$ would be a negative distance. From $6x + 10 < 118$ we get $x < 18$, and $x$ must be positive.'
      B: 'You went for minus 3 less than $x$ less than 3. $x$ can''t be negative, since $5x$ is a distance, and the upper limit comes from $6x + 10 < 118$, which gives 18.'
      C: 'You went for 15 less than $x$ less than 18. The upper limit is right, but nothing forces $x$ above 15. The lower limit comes from the distance being positive, so it''s 0.'
      D: 'You went for 0 less than $x$ less than 15. The lower limit is right, but check the total. $6x + 10 < 118$ gives $6x < 108$, so $x < 18$.'
  20:
    moments:
      - section: 'The question'
        say: 'There are two equations, and the question wants $x$ plus $y$, not $x$ and $y$. Picture each equation as a straight line. We want where they meet, then one extra step.'
        write: '$2x + 3y = 1$ and $x - 2y = 11$'
        doodle: {name: 'custom:1984_q20_a', id: lines, caption: 'two lines meet at one point'}
      - section: 'Solution'
        say: 'We number the equations and use elimination. Make the $x$ terms the same, then subtract.'
        write: 'Solution'
      - say: 'Equation one is $2x$ plus $3y$ equals 1.'
        write: '$2x + 3y = 1 \quad \text{......(1)}$'
        doodle_do:
          - {id: lines, op: highlight, part: line1}
      - say: 'Equation two is $x$ minus $2y$ equals 11.'
        write: '$x - 2y = 11 \quad \text{......(2)}$'
        doodle_do:
          - {id: lines, op: highlight, part: line2}
      - say: 'Equation one has $2x$. Multiply equation two by 2, so it has $2x$ too. Call it equation three.'
        write: '(2) $\times$ 2: $2x - 4y = 22 \quad \text{......(3)}$'
      - section: 'Eliminate x'
        say: 'Subtract equation three from equation one. $2x$ minus $2x$ is zero. $3y$ minus negative $4y$ is $7y$. 1 minus 22 is negative 21.'
        write: '(1) $-$ (3): $7y = -21$'
      - say: 'Divide both sides by 7. Negative 21 over 7 is negative 3.'
        write: '$y = \dfrac{-21}{7} = -3$'
      - say: 'Now substitute $y$ equals negative 3 in equation two.'
        write: 'Substitute $y = -3$ in (2):'
      - say: '$x$ minus 2 times negative 3 equals 11.'
        write: '$x - 2(-3) = 11$'
      - say: '2 times negative 3 is negative 6, and minus negative 6 is plus 6.'
        write: '$x + 6 = 11$'
      - say: 'Subtract 6 from both sides. 11 minus 6 is 5. That is the meeting point of the two lines.'
        write: '$x = 11 - 6 = 5$'
        doodle_do:
          - {id: lines, op: label, part: meet, text: '(5, −3)'}
      - say: 'Now the extra step. The question wants $x$ plus $y$, and 5 plus negative 3 is 2.'
        write: '$\therefore x + y = 5 + (-3) = 2$'
        doodle_do:
          - {id: lines, op: circle, part: meet}
      - section: 'Check'
        say: 'Check equation one. 2 times 5 is 10, and 3 times negative 3 is negative 9. 10 minus 9 is 1.'
        write: '(1): $2(5) + 3(-3) = 10 - 9 = 1\ \checkmark$'
      - say: 'Check equation two. 5 minus 2 times negative 3 is 5 plus 6, which is 11.'
        write: '(2): $5 - 2(-3) = 5 + 6 = 11\ \checkmark$'
      - say: 'So $x$ plus $y$ is 2, which is option D.'
        write: '$\therefore x + y = 2$ (D)'
        answer: true
    traps:
      A: 'You went for 5. That is $x$ on its own. The question asks for $x$ plus $y$, and 5 plus negative 3 is 2.'
      B: 'You went for negative 3. That is $y$ on its own. Add $x$, which is 5, to get 2.'
      C: 'You went for 8. That is $x$ minus $y$, 5 minus negative 3. The question wants the sum, 5 plus negative 3, which is 2.'
      E: 'You went for negative 2. Watch the signs. $x$ is positive 5 and $y$ is negative 3, so their sum is positive 2.'
  21:
    moments:
      - section: 'The question'
        say: 'Tunde and Shola finish a job together in 18 days. Tunde alone takes $x$ days, and Shola takes 15 days longer.'
        write: 'Tunde: $x$ days; Shola: $(x + 15)$ days'
      - section: 'Solution'
        say: 'In work problems we add the work done in one day, not the days. Write each person''s one-day work, then add.'
        write: 'Solution'
      - say: 'Tunde takes $x$ days for the whole job, so in 1 day he does 1 over $x$ of it.'
        write: 'Tunde''s work in 1 day $= \dfrac{1}{x}$'
      - say: 'Shola takes $x$ plus 15 days, so in 1 day he does 1 over $x$ plus 15.'
        write: 'Shola''s work in 1 day $= \dfrac{1}{x + 15}$'
      - say: 'Together they take 18 days, so together they do 1 over 18 in a day.'
        write: 'Together in 1 day $= \dfrac{1}{18}$'
      - say: 'Their two days'' work add up to that.'
        write: '$\dfrac{1}{x} + \dfrac{1}{x + 15} = \dfrac{1}{18}$'
      - section: 'Clear the fractions'
        say: 'The L.C.M. of the bottoms is 18, times $x$, times $x$ plus 15. Multiply every term by it.'
        write: 'L.C.M. $= 18x(x + 15)$'
      - say: 'In the first term $x$ cancels, leaving 18 times $x$ plus 15. In the second, $x$ plus 15 cancels, leaving $18x$. On the right, 18 cancels.'
        write: '$18(x + 15) + 18x = x(x + 15)$'
      - say: 'Open the brackets. 18 times $x$ plus 15 is $18x$ plus 270. $x$ times $x$ plus 15 is $x$ squared plus $15x$.'
        write: '$18x + 270 + 18x = x^{2} + 15x$'
      - say: 'Collect like terms, so $18x$ plus $18x$ is $36x$.'
        write: '$36x + 270 = x^{2} + 15x$'
      - say: 'Subtract $36x$ and 270 from both sides, so the left-hand side is zero.'
        write: '$0 = x^{2} + 15x - 36x - 270$'
      - say: '$15x$ minus $36x$ is negative $21x$. Therefore $x$ squared minus $21x$ minus 270 equals zero.'
        write: '$\therefore x^{2} - 21x - 270 = 0$'
      - section: 'Check'
        say: 'Check that it makes sense. The product is negative 270 and the sum is negative 21, so the factors are negative 30 and plus 9. So it factorises, and $x$ is 30.'
        write: '$(x - 30)(x + 9) = 0$, so $x = 30$'
      - say: 'Then Shola takes 45 days. 1 over 30 plus 1 over 45 is 3 over 90 plus 2 over 90, which is 5 over 90, or 1 over 18. Together they finish in 18 days.'
        write: '$\dfrac{1}{30} + \dfrac{1}{45} = \dfrac{3 + 2}{90} = \dfrac{1}{18}\ \checkmark$'
      - say: 'So $x$ satisfies $x$ squared minus $21x$ minus 270 equals zero, which is option C.'
        write: '$\therefore x^{2} - 21x - 270 = 0$ (C)'
        answer: true
    traps:
      A: 'You went for $x^{2} - 5x - 18 = 0$. Add the one-day work, so 1 over $x$ plus 1 over $x$ plus 15 equals 1 over 18. Clearing the fractions gives $x^{2} - 21x - 270 = 0$.'
      B: 'You went for $x^{2} - 20x + 360 = 0$. That one has no real roots at all, so no number of days fits it. The one-day work equation gives $x^{2} - 21x - 270 = 0$.'
      D: 'You went for $2x^{2} + 42x - 190 = 0$. Multiply through by the L.C.M., $18x(x + 15)$, carefully, and you get $36x + 270 = x^{2} + 15x$, which rearranges to $x^{2} - 21x - 270 = 0$.'
      E: 'You went for $3x^{2} - 31x + 150 = 0$. Work problems add the work done in one day, not the days. From 1 over $x$ plus 1 over $x$ plus 15 equals 1 over 18, we get $x^{2} - 21x - 270 = 0$.'
  22:
    moments:
      - section: 'The question'
        say: 'This is a function inside a function. Order matters, so we work from the inside out. Picture $f$ and $g$ as two machines in a row.'
        write: '$f(x) = 2(x - 3)^{2} + 3(x - 3) - 5$'
        doodle: {name: 'custom:1984_q22_a', id: machines, caption: 'f, then g', size: scene}
      - say: 'And $g$ of $y$ is the square root of 5 plus $y$. We want $g$ of $f$ of 3, and $g$ of $f$ of 4.'
        write: '$g(y) = \sqrt{5 + y}$'
      - section: 'Solution'
        say: 'For $g$ of $f$ of $x$, first find $f$ of $x$. Then put that answer into $g$.'
        write: 'Solution'
      - section: 'x = 3'
        say: 'Put 3 in place of every $x$ in $f$, in brackets.'
        write: '$f(3) = 2(3 - 3)^{2} + 3(3 - 3) - 5$'
      - say: '3 minus 3 is zero in every bracket.'
        write: '$= 2(0)^{2} + 3(0) - 5$'
      - say: '2 times zero is zero and 3 times zero is zero, so we are left with negative 5. That comes out of machine $f$.'
        write: '$= -5$'
        doodle_do:
          - {id: machines, op: label, part: mid1, text: '−5'}
      - say: 'Now feed negative 5 into $g$. 5 plus negative 5 is zero, and the square root of zero is zero.'
        write: '$g(f(3)) = g(-5) = \sqrt{5 + (-5)} = 0$'
        doodle_do:
          - {id: machines, op: label, part: out1, text: '0'}
        point:
          - {line: 6, kind: move, from: {line: 5, at: '−5'}, at: 'g[[(−5)]]', text: 'f(3)'}
      - section: 'x = 4'
        say: 'Now feed 4 into the machines. Put 4 in place of every $x$ in $f$.'
        write: '$f(4) = 2(4 - 3)^{2} + 3(4 - 3) - 5$'
        doodle_do:
          - {id: machines, op: stage, stage: 'custom:1984_q22_a2'}
      - say: '4 minus 3 is 1 in every bracket.'
        write: '$= 2(1)^{2} + 3(1) - 5$'
      - say: '1 squared is 1. So we have 2 plus 3 minus 5, which is zero. That comes out of $f$.'
        write: '$= 2 + 3 - 5 = 0$'
        doodle_do:
          - {id: machines, op: label, part: mid2, text: '0'}
      - say: 'Feed zero into $g$. 5 plus zero is 5, so we get root 5.'
        write: '$g(f(4)) = g(0) = \sqrt{5 + 0} = \sqrt{5}$'
        doodle_do:
          - {id: machines, op: label, part: out2, text: 'root 5'}
      - say: 'Therefore the two values are 0 and root 5.'
        write: '$\therefore g(f(3)) = 0$, $g(f(4)) = \sqrt{5}$'
      - section: 'Check'
        say: 'Check $f$ another way. Let $u$ be $x$ minus 3. Then $f$ is $2u$ squared plus $3u$ minus 5.'
        write: 'Let $u = x - 3$: $f = 2u^{2} + 3u - 5$'
      - say: 'Factorise it. The product is negative 10 and the sum is 3, so we use plus 5 and negative 2. It factorises as $2u$ plus 5, times $u$ minus 1.'
        write: '$f = (2u + 5)(u - 1)$'
      - say: 'At $x$ equals 3, $u$ is zero, and 5 times negative 1 is negative 5. At $x$ equals 4, $u$ is 1, and 7 times zero is zero. Both agree.'
        write: '$f(3) = (5)(-1) = -5$, $f(4) = (7)(0) = 0\ \checkmark$'
      - say: 'So the values are 0 and root 5, which is option E.'
        write: '$\therefore 0$ and $\sqrt{5}$ (E)'
        answer: true
    traps:
      A: 'You went for 3 and 4. Those are the starting numbers, not the answers. Put 3 and 4 into $f$ first, which gives negative 5 and 0, then into $g$, which gives 0 and root 5.'
      B: 'You went for negative 3 and 4. A square root never gives a negative answer, so negative 3 cannot come out of $g$. Work inside out, and $g(f(3))$ is 0 and $g(f(4))$ is root 5.'
      C: 'You went for negative 3 and negative 4. $g$ is a square root, so its values cannot be negative. First $f(3)$ is negative 5 and $f(4)$ is 0. Then $g$ gives 0 and root 5.'
      D: 'You went for 3 and negative 4. $g$ cannot give a negative number, because it is a square root. Working inside out gives 0 and root 5.'
  23:
    moments:
      - section: 'The question'
        say: 'We want the quadratic equation whose roots are 1 minus root 13 and 1 plus root 13. Picture them on a number line, the same distance either side of 1.'
        write: 'Roots: $1 - \sqrt{13}$ and $1 + \sqrt{13}$'
        doodle: {name: 'custom:1984_q23_a', id: line, caption: 'two roots, either side of 1', size: scene}
      - section: 'Solution'
        say: 'To build a quadratic from its roots, we need only the sum and the product of the roots.'
        write: 'Solution'
      - say: 'Let the roots be alpha and beta.'
        write: 'Let $\alpha = 1 - \sqrt{13}$, $\beta = 1 + \sqrt{13}$'
      - say: 'The equation is $x$ squared, minus the sum of roots times $x$, plus the product of roots, equals zero.'
        write: '$x^{2} - (\alpha + \beta)x + \alpha\beta = 0$'
      - section: 'Sum and product'
        say: 'First the sum. Add the two roots.'
        write: '$\alpha + \beta = (1 - \sqrt{13}) + (1 + \sqrt{13})$'
      - say: 'On the number line the two arms point opposite ways, so they cancel, and negative root 13 plus root 13 is zero. 1 plus 1 is 2.'
        write: '$= 2$'
        doodle_do:
          - {id: line, op: highlight, part: arm1}
          - {id: line, op: highlight, part: arm2}
          - {id: line, op: label, part: mid, text: 'sum = 2'}
      - say: 'Now the product. A minus bracket times a plus bracket is a difference of two squares.'
        write: '$\alpha\beta = (1 - \sqrt{13})(1 + \sqrt{13})$'
      - say: 'So it is 1 squared minus root 13 squared.'
        write: '$= 1^{2} - (\sqrt{13})^{2}$'
      - say: '1 squared is 1 and root 13 squared is 13. 1 minus 13 is negative 12.'
        write: '$= 1 - 13 = -12$'
      - say: 'Now substitute the sum, 2, and the product, negative 12, into the equation.'
        write: '$x^{2} - (2)x + (-12) = 0$'
        point:
          - {line: 9, kind: move, from: {line: 5, at: '2'}, at: '(2)', text: 'sum'}
          - {line: 9, kind: move, from: {line: 8, at: '=−12'}, at: '(−12)', text: 'product'}
      - say: 'Minus 2 times $x$ is negative $2x$, and plus negative 12 is minus 12.'
        write: '$\therefore x^{2} - 2x - 12 = 0$'
      - section: 'Check'
        say: 'Solve it with the almighty formula. $x$ equals negative $b$, plus or minus the square root of $b$ squared minus $4ac$, all over $2a$.'
        write: '$x = \dfrac{-b \pm \sqrt{b^{2} - 4ac}}{2a}$'
      - say: 'Here $a$ is 1, $b$ is negative 2 and $c$ is negative 12.'
        write: '$a = 1,\ b = -2,\ c = -12$'
      - say: 'Substitute, with brackets.'
        write: '$x = \dfrac{-(-2) \pm \sqrt{(-2)^{2} - 4(1)(-12)}}{2(1)}$'
      - say: '4 plus 48 is 52, and root 52 is root 4 times 13, which is 2 root 13.'
        write: '$= \dfrac{2 \pm \sqrt{52}}{2} = \dfrac{2 \pm 2\sqrt{13}}{2}$'
      - say: 'Divide both parts of the top by 2, which gives 1 plus or minus root 13. Those are the roots we started with.'
        write: '$= 1 \pm \sqrt{13}\ \checkmark$'
        doodle_do:
          - {id: line, op: pulse}
      - say: 'So the equation is $x$ squared minus $2x$ minus 12 equals zero, which is option E.'
        write: '$\therefore x^{2} - 2x - 12 = 0$ (E)'
        answer: true
    traps:
      A: 'You went for option A. That puts the roots themselves in as coefficients. The $x$ term is minus the sum, which is negative $2x$, and the last term is the product, negative 12.'
      B: 'You went for option B. The coefficients come from the sum and product of the roots, not from the roots themselves. That gives $x^{2} - 2x - 12 = 0$.'
      C: 'You went for $x^{2} + 2x + 12 = 0$. Both signs are wrong. The $x$ term is minus the sum, so negative $2x$, and the product is 1 minus 13, which is negative 12.'
      D: 'You went for $x^{2} - 2x + 12 = 0$. The middle term is right, but the product is 1 minus 13, which is negative 12, so the last term is minus 12.'
  24:
    moments:
      - section: 'The question'
        say: 'We want a factor common to all three expressions. Factorise each one completely, then compare. Think of each expression as a bag of factors.'
        write: '$4a^{2} - 9b^{2},\ \ 8a^{3} + 27b^{3},\ \ (4a + 6b)^{2}$'
        doodle: {name: 'custom:1984_q24_a', id: bags, caption: 'three bags of factors', size: scene}
      - section: 'Solution'
        say: 'Solution. The first is a difference of two squares, because $4a$ squared is $2a$, all squared, and $9b$ squared is $3b$, all squared.'
        write: 'Solution: $4a^{2} - 9b^{2} = (2a)^{2} - (3b)^{2}$'
      - say: 'A difference of two squares factorises into the difference times the sum.'
        write: '$= (2a - 3b)(2a + 3b)$'
        doodle_do:
          - {id: bags, op: stage, stage: 'custom:1984_q24_a2'}
      - section: 'Sum of two cubes'
        say: 'The second is a sum of two cubes. The rule is that $x$ cubed plus $y$ cubed is $x$ plus $y$, times $x$ squared minus $xy$ plus $y$ squared.'
        write: '$x^{3} + y^{3} = (x + y)(x^{2} - xy + y^{2})$'
      - say: '2 cubed is 8 and 3 cubed is 27. So $8a$ cubed is $2a$, all cubed, and $27b$ cubed is $3b$, all cubed.'
        write: '$8a^{3} + 27b^{3} = (2a)^{3} + (3b)^{3}$'
      - say: 'Here $x$ is $2a$ and $y$ is $3b$. $x$ squared is $4a$ squared, $xy$ is $6ab$, and $y$ squared is $9b$ squared.'
        write: '$= (2a + 3b)(4a^{2} - 6ab + 9b^{2})$'
        doodle_do:
          - {id: bags, op: stage, stage: 'custom:1984_q24_a3'}
      - section: 'The square'
        say: 'In the third, inside the bracket, 4 and 6 have a common factor, 2. Take it out.'
        write: '$4a + 6b = 2(2a + 3b)$'
      - say: 'Square it. 2 squared is 4.'
        write: '$(4a + 6b)^{2} = 4(2a + 3b)^{2}$'
        doodle_do:
          - {id: bags, op: stage, stage: 'custom:1984_q24_a4'}
      - section: 'Compare'
        say: 'Compare the three factorisations. The bracket $2a$ plus $3b$ appears in all three.'
        write: '$\therefore$ common factor $= 2a + 3b$'
        doodle_do:
          - {id: bags, op: circle, part: c1}
          - {id: bags, op: circle, part: c2}
          - {id: bags, op: circle, part: c3}
      - section: 'Check'
        say: 'Check with $a$ equals 1 and $b$ equals 1. $2a$ plus $3b$ is 5. The three expressions are negative 5, 35 and 100, and 5 divides all of them.'
        write: 'Check $a = b = 1$: $2a + 3b = 5$ divides $-5,\ 35,\ 100\ \checkmark$'
      - say: 'Therefore the factor common to all three is $2a$ plus $3b$, which is answer choice C.'
        write: '$\therefore\ 2a + 3b$'
        answer: true
    traps:
      A: 'You went for $4a$ plus $6b$. That divides the third expression, but not the first two. Take 2 out of $4a$ plus $6b$, and the shared bracket $2a$ plus $3b$ appears.'
      B: 'You went for $4a$ minus $6b$. That is twice $2a$ minus $3b$, which goes only with the first expression. The bracket in all three is $2a$ plus $3b$.'
      D: 'You went for $2a$ minus $3b$. It divides the first expression, but not the sum of cubes or the square. The common factor is $2a$ plus $3b$.'
      E: 'You went for none. Factorise each completely, as a difference of two squares, a sum of two cubes and a square. All three contain $2a$ plus $3b$.'
  25:
    moments:
      - section: 'The question'
        say: 'Think of a loaf of bread cut into equal slices. Every slice has the same face. A prism is like that, so its volume is one face times the length.'
        write: 'Find the volume of the prism.'
        doodle: {name: 'custom:1984_q25_a', id: loaf, caption: 'one slice, then the whole loaf', size: scene}
      - say: 'Write Solution. The figure is given. The cross-section is a right-angled triangle with hypotenuse 5 cm and one shorter side 4 cm, and the prism is 8 cm long.'
        write: 'Solution'
        point:
          - {figure: 0, kind: highlight, target: PQ, text: 'hypotenuse', 'on': 'hypotenuse 5 cm'}
          - {figure: 0, kind: circle, target: '8 cm', text: 'length', 'on': '8 cm long'}
      - section: 'What we know'
        say: 'List the givens, which are hypotenuse 5 cm, one shorter side 4 cm and length l equals 8 cm.'
        write: 'Hypotenuse $= 5$ cm, base $= 4$ cm, $l = 8$ cm'
      - say: 'To find the area of the triangle we need the other shorter side, the height. Let it be h centimetres.'
        write: 'Let the height of the triangle be $h$ cm'
        point:
          - {figure: 0, kind: arrow, target: {x: 60, y: 167}, text: 'h', 'on': 'Let it be'}
      - section: 'Pythagoras'
        say: 'By Pythagoras'' theorem, the square on the hypotenuse equals the sum of the squares on the other two sides.'
        write: '$5^{2} = h^{2} + 4^{2}$ (Pythagoras)'
      - say: 'Take 4 squared to the other side, so h squared is 25 minus 16, which is 9.'
        write: '$h^{2} = 25 - 16 = 9$'
      - say: 'The square root of 9 is 3, so the height is 3 cm. This is the well-known 3, 4, 5 triangle.'
        write: '$h = \sqrt{9} = 3$ cm'
        doodle_do:
          - {id: loaf, op: label, part: short, text: '3 cm', 'on': 'height is 3 cm'}
        point:
          - {figure: 0, kind: label, target: {x: 60, y: 167}, text: '3 cm', 'on': 'height is 3 cm'}
      - section: 'The cross-section'
        say: 'The area of a triangle is a half, times base, times height. The 4 cm and 3 cm sides meet at the right angle, so they are the base and the height.'
        write: 'Area of cross-section $= \tfrac{1}{2} \times \text{base} \times \text{height}$'
      - say: 'Substitute, so a half times 4 times 3, which is a half of 12, which is 6 square centimetres. That is the face of every slice.'
        write: '$= \tfrac{1}{2} \times 4 \times 3 = 6\ \text{cm}^{2}$'
        doodle_do:
          - {id: loaf, op: stage, stage: 'custom:1984_q25_a2', 'on': 'face of every slice'}
      - section: 'The volume'
        say: 'The volume of a prism is the area of the cross-section, times the length.'
        write: '$V = \text{area of cross-section} \times l$'
      - say: 'Substitute to get 6 times 8.'
        write: '$V = 6 \times 8$'
        doodle_do:
          - {id: loaf, op: stage, stage: 'custom:1984_q25_a3', 'on': '6 times 8'}
        point:
          - {line: 10, kind: move, from: {line: 8, at: '= [[6]]cm'}, at: '[[6]]×', text: 'area', 'on': '6 times'}
          - {line: 10, kind: move, from: {line: 2, at: 'l = [[8]]'}, at: '×[[8]]', text: 'length', 'on': 'times 8'}
      - say: '6 times 8 is 48. Therefore the volume is 48 cubic centimetres. It is cubic because it is a volume.'
        write: '$\therefore V = 48\ \text{cm}^{3}$'
        doodle_do:
          - {id: loaf, op: label, part: loaf, text: '48 cm³', 'on': 'Therefore'}
      - section: 'Check'
        say: 'To check, a box 4 by 3 by 8 is 96. The triangle is half of the rectangle, so the prism is half the box, which is 48.'
        write: 'Check: $\tfrac{1}{2} \times (4 \times 3 \times 8) = \tfrac{1}{2} \times 96 = 48$ ✓'
      - section: 'Answer'
        say: 'So the volume is 48 cubic centimetres, which is answer choice B.'
        write: '$\therefore V = 48\ \text{cm}^{3}$ (B)'
        answer: true
    traps:
      A: 'You went for 160 cubic centimetres. That multiplies 4, 5 and 8 with no half. The hypotenuse is not one of the sides that meet at the right angle. Those are 4 and 3, giving an area of 6.'
      C: 'You went for 96 cubic centimetres. That is 4 times 3 times 8, the whole box. The triangle is half of the rectangle, so the area is 6, and 6 times 8 is 48.'
      D: 'You went for 120 cubic centimetres. That uses 3, 5 and 8. The two sides at the right angle are 4 and 3, so the area is a half of 12, which is 6, and the volume is 48.'
      E: 'You went for 40 cubic centimetres. That is 5 times 8, which leaves out the area of the triangle. The area is a half times 4 times 3, which is 6, so the volume is 48.'
  26:
    moments:
      - section: 'The question'
        say: '$x$ minus 2 and $x$ plus 1 are both factors of this cubic. We want $p$ plus $q$. Think of each factor as a key that must turn the expression to zero.'
        write: '$x^{3} + px^{2} + qx + 1$'
      - section: 'Solution'
        say: 'The factor theorem says that if $x$ minus $a$ is a factor, then $f$ of $a$ is zero. Two factors give two equations in $p$ and $q$.'
        write: 'Solution'
      - say: 'First, give the expression a name, $f$ of $x$.'
        write: 'Let $f(x) = x^{3} + px^{2} + qx + 1$'
      - say: 'First key. Set $x$ minus 2 equal to zero. Therefore $x$ equals 2.'
        write: 'Let $x - 2 = 0$, $\therefore x = 2$'
      - say: 'Put 2 in place of every $x$, in brackets. By the factor theorem the result is zero.'
        write: '$f(2) = (2)^{3} + p(2)^{2} + q(2) + 1 = 0$'
      - say: '2 cubed is 8, and 2 squared is 4.'
        write: '$8 + 4p + 2q + 1 = 0$'
      - say: '8 plus 1 is 9. Subtract 9 from both sides. Call it equation one.'
        write: '$4p + 2q = -9 \quad \text{......(1)}$'
      - say: 'Second key. Set $x$ plus 1 equal to zero. Therefore $x$ equals negative 1, not positive 1.'
        write: 'Let $x + 1 = 0$, $\therefore x = -1$'
      - say: 'Put negative 1 in place of every $x$, in brackets.'
        write: '$f(-1) = (-1)^{3} + p(-1)^{2} + q(-1) + 1 = 0$'
      - say: 'Negative 1 cubed is negative 1, and negative 1 squared is plus 1.'
        write: '$-1 + p - q + 1 = 0$'
      - say: 'Negative 1 plus 1 is zero. Call it equation two.'
        write: '$p - q = 0 \quad \text{......(2)}$'
      - section: 'Solve for p and q'
        say: 'Multiply equation two by 2, so the $q$ terms match. Call it equation three.'
        write: '(2) $\times$ 2: $2p - 2q = 0 \quad \text{......(3)}$'
      - say: 'Add equations one and three. $2q$ and negative $2q$ cancel. $4p$ plus $2p$ is $6p$.'
        write: '(1) + (3): $6p = -9$'
      - say: 'Divide both sides by 6. Negative 9 over 6 is negative 3 over 2.'
        write: '$p = -\dfrac{9}{6} = -\dfrac{3}{2}$'
      - say: 'From equation two, $q$ equals $p$. So $q$ is negative 3 over 2 as well.'
        write: 'From (2): $q = p = -\dfrac{3}{2}$'
      - say: 'Therefore $p$ plus $q$ is negative 3 over 2 plus negative 3 over 2, which is negative 3.'
        write: '$\therefore p + q = -\dfrac{3}{2} - \dfrac{3}{2} = -3$'
      - section: 'Check'
        say: 'Try the first key. With $p$ and $q$ both negative 3 over 2, $f$ of 2 is 8 minus 6 minus 3 plus 1, which is zero.'
        write: '$f(2) = 8 - 6 - 3 + 1 = 0\ \checkmark$'
      - say: 'And the second key. $f$ of negative 1 is negative 1, minus 3 over 2, plus 3 over 2, plus 1. That is zero.'
        write: '$f(-1) = -1 - \tfrac{3}{2} + \tfrac{3}{2} + 1 = 0\ \checkmark$'
      - say: 'So $p$ plus $q$ is negative 3, which is option B.'
        write: '$\therefore p + q = -3$ (B)'
        answer: true
    traps:
      A: 'You went for 0. $p$ and $q$ are equal, not opposite, so they do not cancel. Both are negative 3 over 2, and their sum is negative 3.'
      C: 'You went for 3. The size is right, but the sign is not. $6p$ equals negative 9, so $p$ and $q$ are both negative, and the sum is negative 3.'
      D: 'You went for negative 17 over 3. Check the two equations. $x$ equals 2 gives $4p + 2q = -9$, and $x$ equals negative 1, not plus 1, gives $p = q$. Then $p$ and $q$ are each negative 3 over 2, and the sum is negative 3.'
      E: 'You went for negative 2 over 3. Solve $4p + 2q = -9$ together with $p = q$. Then $6p$ equals negative 9, so $p$ and $q$ are each negative 3 over 2, and the sum is negative 3.'
  27:
    moments:
      - section: 'The question'
        say: 'Cut a 210 degree sector from a paper circle, and bend it round until the two straight edges meet. You have made a cone. How wide is its base?'
        write: 'Find the base radius of the cone.'
      - say: 'Write Solution, then sketch the sector, and the cone it bends into.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '210°', text: 'sector angle', 'on': 'sketch the sector'}
          - {figure: sketch, kind: circle, target: V, text: 'cone', 'on': 'the cone'}
      - section: 'What we know'
        say: 'List the givens. The circle has diameter 12 cm, so its radius, capital R, is 12 over 2, which is 6 cm. The sector angle theta is 210 degrees.'
        write: '$R = \dfrac{12}{2} = 6$ cm, $\theta = 210^{\circ}$'
        point:
          - {figure: sketch, kind: highlight, target: OA, text: 'R = 6', 'on': 'capital R'}
      - say: 'Let the base radius of the cone be small r.'
        write: 'Let the base radius of the cone be $r$ cm'
        point:
          - {figure: sketch, kind: circle, target: 'r = ?', text: 'r', 'on': 'small r'}
      - section: 'The rule'
        say: 'When a sector is bent into a cone, the radius of the sector becomes the slant height, and the arc of the sector becomes the circumference of the base.'
        write: 'Arc length of sector $=$ circumference of base'
        point:
          - {figure: sketch, kind: arrow, target: {x: 95, y: 46}, text: 'arc → base circle', 'on': 'arc of the sector'}
      - say: 'In symbols, theta over 360, times 2 pi capital R, equals 2 pi small r.'
        write: '$\dfrac{\theta}{360} \times 2\pi R = 2\pi r$'
      - section: 'Substitute'
        say: 'Substitute, where theta is 210 and capital R is 6.'
        write: '$\dfrac{210}{360} \times 2\pi \times 6 = 2\pi r$'
        point:
          - {line: 6, kind: move, from: {line: 2, at: '= 6'}, at: '×6', text: 'R', 'on': 'R is 6'}
      - section: 'Simplify'
        say: 'Both sides have 2 pi, so divide both sides by 2 pi. That leaves r equals 210 over 360, times 6.'
        write: '$r = \dfrac{210}{360} \times 6$'
        point:
          - {line: 6, kind: strike, at: '[[2π]]×6', text: '÷ 2π', 'on': 'divide both sides'}
      - say: 'For 210 over 360, divide top and bottom by 30, which gives 7 over 12.'
        write: '$r = \dfrac{7}{12} \times 6$'
      - say: '6 goes into 12 twice, so this is 7 over 2, which is 3.5.'
        write: '$r = \dfrac{7}{2} = 3.5$'
      - say: 'Therefore the base radius of the cone is 3.50 centimetres.'
        write: '$\therefore r = 3.50$ cm'
        point:
          - {figure: sketch, kind: label, target: 'r = ?', text: '3.50 cm', 'on': 'Therefore'}
      - section: 'Check'
        say: 'To check, the base radius must be smaller than the slant height, 6 cm. 3.5 is smaller. And 2 pi times 3.5 is 7 pi, which is 7 over 12 of 12 pi.'
        write: 'Check: $2\pi \times 3.5 = 7\pi = \dfrac{7}{12} \times 12\pi$ ✓'
      - section: 'Answer'
        say: 'So the base radius is 3.50 cm, which is answer choice D.'
        write: '$\therefore r = 3.50$ cm (D)'
        answer: true
    traps:
      A: 'You went for 7.00 cm. That is the base diameter, not the radius, and it comes from pi r equals 7 pi. The circumference is 2 pi r, so r is 3.5.'
      B: 'You went for 1.75 cm. That divides by 2 once too often, as if the radius of the circle were 3. The radius is 12 over 2, which is 6, so r is 7 over 12 of 6, which is 3.5.'
      C: 'You went for root 21 cm. No Pythagoras is needed for the base radius. The arc, 7 pi, becomes the circumference 2 pi r, so r is 3.5.'
      E: 'You went for 2 root 21 cm. The base radius comes straight from the arc length. 2 pi r equals 7 pi, so r is 3.5 cm.'
  28:
    moments:
      - section: 'The question'
        say: 'We know two sides and the angle facing one of them. That is the sine rule''s job. The options differ only in minutes, so the last step needs care.'
        write: '$\angle X = 120^{\circ}$, $XZ = 3$, $YZ = 5$, $\angle Y = ?$'
        point:
          - {figure: 0, kind: arc, target: YXZ, text: '120°'}
          - {figure: 0, kind: arc, target: XYZ, text: '?'}
      - section: 'Solution'
        say: 'Solution. First name each side by the angle facing it. $YZ$ faces $X$, so it is small $x$, 5 centimetres. $XZ$ faces $Y$, so it is small $y$, 3 centimetres.'
        write: 'Solution'
      - say: 'Write the two pairs down, each side with its opposite angle.'
        write: '$x = YZ = 5$ cm, $\ y = XZ = 3$ cm'
        point:
          - {figure: 0, kind: highlight, target: YZ, text: 'x, faces X'}
          - {figure: 0, kind: highlight, target: XZ, text: 'y, faces Y'}
      - say: 'The sine rule says each side over the sine of the angle facing it gives the same number.'
        write: '$\dfrac{x}{\sin X} = \dfrac{y}{\sin Y}$ (sine rule)'
      - say: 'Put in $x$ equals 5, $X$ equals 120 degrees, and $y$ equals 3.'
        write: '$\dfrac{5}{\sin 120^{\circ}} = \dfrac{3}{\sin Y}$'
      - say: 'Cross-multiply, and 5 times sine $Y$ equals 3 times sine 120.'
        write: '$5\sin Y = 3\sin 120^{\circ}$'
      - say: 'Divide both sides by 5, so sine $Y$ stands alone.'
        write: '$\sin Y = \dfrac{3\sin 120^{\circ}}{5}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '[[5]]sinY'}, at: '5', text: 'divide by 5'}
      - say: '120 is in the second quadrant, where sine is positive. Sine 120 equals sine of 180 minus 120, which is sine 60, 0.8660.'
        write: '$\sin 120^{\circ} = \sin 60^{\circ} = 0.8660$'
      - say: 'Put that in. 3 times 0.8660 is 2.598.'
        write: '$\sin Y = \dfrac{3 \times 0.8660}{5} = \dfrac{2.598}{5}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '=0.8660'}, at: '0.8660', text: 'from here'}
      - say: '2.598 divided by 5 is 0.5196.'
        write: '$\sin Y = 0.5196$'
      - say: 'Take the inverse sine. The angle whose sine is 0.5196 is 31.306 degrees.'
        write: '$Y = \sin^{-1} 0.5196 = 31.306^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: XYZ, text: '31.306°'}
      - say: 'Sine is also positive for an obtuse angle, but the triangle already has an obtuse angle at $X$. A triangle cannot have two, so $Y$ is acute.'
        write: '$Y$ is acute, since $\angle X = 120^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: YXZ, text: 'obtuse'}
      - say: 'Change the decimal part to minutes. One degree is 60 minutes. 0.306 times 60 is 18.4, which is 18 minutes to the nearest minute.'
        write: '$0.306^{\circ} = 0.306 \times 60'' = 18.4'' \approx 18''$'
      - say: 'So angle $XYZ$ is 31 degrees 18 minutes.'
        write: '$\angle XYZ = 31^{\circ}18''$'
        point:
          - {figure: 0, kind: arc, target: XYZ, text: '31°18′'}
      - section: 'Check'
        say: 'To check, both sides of the sine rule should give the same number. 3 over 0.5196 is 5.774, and 5 over 0.8660 is also 5.774.'
        write: '$\dfrac{3}{0.5196} = 5.774 = \dfrac{5}{0.8660}\ \checkmark$'
      - say: 'Therefore angle $XYZ$ is 31 degrees 18 minutes, option D.'
        write: '$\therefore \angle XYZ = 31^{\circ}18''$ (D)'
        answer: true
    traps:
      A: 'You went for 29 degrees. That is about the third angle, at $Z$, since 180 minus 120 minus 31.3 is about 28.7. The question asks for the angle at $Y$, facing the 3 centimetre side.'
      B: 'You went for 31 degrees 20 minutes. That comes from rounding too early. 0.306 of a degree is 0.306 times 60, which is about 18 minutes, not 20.'
      C: 'You went for 31 degrees. That is close, but it drops the minutes. The angle is 31.306 degrees, and 0.306 times 60 gives 18 minutes.'
      E: 'You went for 59 degrees. That is 90 minus 31, which is not any angle in this triangle. The sine rule gives sine $Y$ equals 0.5196, so $Y$ is 31 degrees 18 minutes.'
  29:
    moments:
      - section: 'The question'
        say: 'A triangle has sides $x$ plus 4, $x$, and $x$ minus 4 centimetres. The cosine of its largest angle is 1 over 5. We want $x$.'
        write: 'Sides $(x + 4),\ x,\ (x - 4)$ cm; $\ \cos(\text{largest}\ \angle) = \dfrac{1}{5}$'
      - section: 'Solution'
        say: 'Solution. Let me draw the triangle $ABC$ with its three sides written on it.'
        write: 'Solution: $BC = x + 4,\ AC = x,\ AB = x - 4$'
        show_sketch: true
        'on': 'draw'
        point:
          - {figure: sketch, kind: highlight, target: BC, text: 'x + 4'}
          - {figure: sketch, kind: highlight, target: AC, text: 'x'}
          - {figure: sketch, kind: highlight, target: AB, text: 'x − 4'}
      - say: 'The largest angle is always opposite the longest side. The longest side is $x$ plus 4, so the largest angle is at $A$. Let it be theta.'
        write: 'Let $\theta = \angle A$ (opp. the longest side, $x + 4$)'
        point:
          - {figure: sketch, kind: highlight, target: BC, text: 'longest'}
          - {figure: sketch, kind: arc, target: BAC, text: 'θ'}
      - section: 'The cosine rule'
        say: 'We know three sides and the cosine of an angle, so we use the cosine rule. Small $a$ is the side opposite the angle $A$.'
        write: '$a^{2} = b^{2} + c^{2} - 2bc\cos A$ (cosine rule)'
      - say: 'Substitute. $a$ is $x$ plus 4, then $b$ and $c$ are $x$ and $x$ minus 4, the sides around $A$, and cos $A$ is 1 over 5.'
        write: '$(x + 4)^{2} = x^{2} + (x - 4)^{2} - 2x(x - 4) \times \dfrac{1}{5}$'
        point:
          - {figure: sketch, kind: highlight, target: AC, text: 'around θ'}
          - {figure: sketch, kind: highlight, target: AB, text: 'around θ'}
      - say: 'Clear the fraction by multiplying every term by 5.'
        write: '$5(x + 4)^{2} = 5x^{2} + 5(x - 4)^{2} - 2x(x - 4)$'
      - say: 'Expand each bracket. $x$ plus 4, squared, is $x$ squared plus $8x$ plus 16, and $x$ minus 4, squared, is $x$ squared minus $8x$ plus 16.'
        write: '$5x^{2} + 40x + 80 = 5x^{2} + 5x^{2} - 40x + 80 - 2x^{2} + 8x$'
      - say: 'Collect like terms on the right. 5 plus 5 minus 2 is $8x$ squared, and minus $40x$ plus $8x$ is minus $32x$.'
        write: '$5x^{2} + 40x + 80 = 8x^{2} - 32x + 80$'
      - say: 'Take everything to the right-hand side. The 80s cancel. $8x$ squared minus $5x$ squared is $3x$ squared, and minus $32x$ minus $40x$ is minus $72x$.'
        write: '$0 = 3x^{2} - 72x$'
      - say: 'Factorise, because $3x$ is common to both terms.'
        write: '$3x(x - 24) = 0$'
      - say: 'Either $3x$ is 0 or $x$ minus 24 is 0. So $x$ is 0 or 24. A side cannot be 0 cm, so we reject 0.'
        write: 'Either $x = 0$ or $x = 24$; $\ x \neq 0$ (a side)'
      - say: 'Therefore $x$ is 24 cm.'
        write: '$\therefore x = 24$ cm'
      - section: 'Check'
        say: 'Now check. The sides are 28, 24 and 20. The cosine rule turned round gives 24 squared plus 20 squared minus 28 squared, over 2 times 24 times 20.'
        write: 'Check: $\cos A = \dfrac{24^{2} + 20^{2} - 28^{2}}{2 \times 24 \times 20}$'
      - say: '576 plus 400 minus 784 is 192, and 2 times 24 times 20 is 960. 192 over 960 is 1 over 5.'
        write: '$= \dfrac{576 + 400 - 784}{960} = \dfrac{192}{960} = \dfrac{1}{5}\ \checkmark$'
      - section: 'Answer'
        say: 'So $x$ is 24 cm, which is answer choice A.'
        write: '$\therefore x = 24$ cm'
        answer: true
    traps:
      B: 'You went for 20 cm. That is the shortest side, $x$ minus 4, when $x$ is 24. The question asks for $x$ itself.'
      C: 'You went for 28 cm. That is the longest side, $x$ plus 4, when $x$ is 24. The question asks for $x$ itself.'
      D: 'You went for 88 over 7 cm. Check the expansion. After multiplying by 5, the right side collects to $8x$ squared minus $32x$ plus 80. Then $3x$ squared minus $72x$ is 0, which gives $x = 24$.'
      E: 'You went for 0 cm. That is the other root of $3x(x - 24) = 0$, but a side of a triangle cannot be 0 cm. We reject it, so $x = 24$.'
  30:
    moments:
      - section: 'The question'
        say: 'We have two fractions with the same bottom. We want $a$ squared minus $b$ squared in its simplest form, and "simplest" means one more cancellation is hiding at the end.'
        write: '$a = \dfrac{2x}{1 - x}$, $b = \dfrac{1 + x}{1 - x}$'
      - section: 'Solution'
        say: 'Square each fraction, put them over the common bottom, simplify the top, then factorise and cancel.'
        write: 'Solution'
      - say: 'Squaring a fraction squares the top and the bottom. Both bottoms become $1 - x$, all squared.'
        write: '$a^{2} - b^{2} = \dfrac{(2x)^{2}}{(1 - x)^{2}} - \dfrac{(1 + x)^{2}}{(1 - x)^{2}}$'
      - say: 'The bottoms are the same, so write one fraction and subtract the tops.'
        write: '$= \dfrac{(2x)^{2} - (1 + x)^{2}}{(1 - x)^{2}}$'
      - say: '$2x$, all squared, is $4x$ squared. 1 plus $x$, all squared, is 1 plus $2x$ plus $x$ squared.'
        write: '$= \dfrac{4x^{2} - (1 + 2x + x^{2})}{(1 - x)^{2}}$'
      - say: 'Open the bracket. The minus in front changes every sign inside it.'
        write: '$= \dfrac{4x^{2} - 1 - 2x - x^{2}}{(1 - x)^{2}}$'
      - say: 'Collect like terms, so $4x$ squared minus $x$ squared is $3x$ squared.'
        write: '$= \dfrac{3x^{2} - 2x - 1}{(1 - x)^{2}}$'
      - section: 'Factorise the top'
        say: 'For $3x$ squared minus $2x$ minus 1, the product is $ac$, 3 times negative 1, which is negative 3. The sum is $b$, negative 2.'
        write: 'Product $= ac = -3$, Sum $= b = -2$'
      - say: 'Two numbers that multiply to negative 3 and add to negative 2 are negative 3 and plus 1.'
        write: 'Factors: $-3$ and $+1$'
      - say: 'Replace the middle term, negative $2x$, with negative $3x$ plus $x$.'
        write: '$3x^{2} - 3x + x - 1$'
      - say: 'Group in pairs. Take out $3x$ from the first pair and 1 from the second. Both brackets are $x$ minus 1.'
        write: '$= 3x(x - 1) + 1(x - 1)$'
      - say: 'Take out the common bracket, $x$ minus 1.'
        write: '$= (3x + 1)(x - 1)$'
      - section: 'Cancel'
        say: 'Now the bottom. 1 minus $x$, squared, equals $x$ minus 1, squared, because squaring removes the minus sign. Picture each factor as a tile.'
        write: '$(1 - x)^{2} = (x - 1)^{2}$'
        doodle: {name: 'custom:1984_q30_a', id: tiles, caption: 'factor tiles', size: scene}
      - say: 'Put the factorised top over the bottom.'
        write: '$a^{2} - b^{2} = \dfrac{(3x + 1)(x - 1)}{(x - 1)^{2}}$'
      - say: 'One $x$ minus 1 is on the top and the bottom. Cancel the common factor. Cross out one pink pair of tiles.'
        write: '$\therefore a^{2} - b^{2} = \dfrac{3x + 1}{x - 1}$'
        doodle_do:
          - {id: tiles, op: cross, part: t2}
          - {id: tiles, op: cross, part: b1}
      - section: 'Check'
        say: 'Check with $x$ equals 2. $a$ is 4 over negative 1, negative 4. $b$ is 3 over negative 1, negative 3.'
        write: '$x = 2$: $a = -4$, $b = -3$'
      - say: '$a$ squared minus $b$ squared is 16 minus 9, which is 7.'
        write: '$a^{2} - b^{2} = 16 - 9 = 7$'
      - say: 'Our answer gives 3 times 2 plus 1, over 2 minus 1, which is 7 over 1. They agree.'
        write: '$\dfrac{3(2) + 1}{2 - 1} = 7\ \checkmark$'
      - say: 'Two tiles are left. So the simplest form is $3x$ plus 1, over $x$ minus 1, which is option A.'
        write: '$\therefore \dfrac{3x + 1}{x - 1}$ (A)'
        doodle_do:
          - {id: tiles, op: circle, part: t1}
          - {id: tiles, op: circle, part: b2}
        answer: true
    traps:
      B: 'You went for option B. Its top has lost the negative $2x$, because 1 plus $x$, all squared, is 1 plus $2x$ plus $x$ squared. The top is $3x$ squared minus $2x$ minus 1, which factorises and cancels to $3x$ plus 1 over $x$ minus 1.'
      C: 'You went for option C. Open the bracket carefully. $4x$ squared minus the whole of 1 plus $2x$ plus $x$ squared is $3x$ squared minus $2x$ minus 1. That factorises and simplifies to $3x$ plus 1 over $x$ minus 1.'
      D: 'You went for option D. That adds the $x$ squared terms instead of subtracting. $4x$ squared minus $x$ squared is $3x$ squared, and the top is $3x$ squared minus $2x$ minus 1.'
      E: 'You went for option E. The minus in front of the bracket changes the sign of the $x$ squared too, so we get $3x$ squared, not 5. The simplest form is $3x$ plus 1 over $x$ minus 1.'
  31:
    moments:
      - section: 'The question'
        say: 'A bracket with a whole number and a fraction is multiplied by $x$ plus 2. Tidy the bracket into one fraction first, and the rest is short.'
        write: '$\left(1 + \dfrac{x - 1}{x + 1}\right)(x + 2)$'
      - section: 'Solution'
        say: 'To add 1 and a fraction, use the L.C.M. of the bottoms. Then multiply by $x$ plus 2. Picture the bracket as two fraction tiles.'
        write: 'Solution'
        doodle: {name: 'custom:1984_q31_a', id: fracs, caption: 'two tiles, one bottom', size: scene}
      - say: 'The only bottom is $x$ plus 1, so the L.C.M. is $x$ plus 1.'
        write: 'L.C.M. $= x + 1$'
        doodle_do:
          - {id: fracs, op: highlight, part: b1}
          - {id: fracs, op: highlight, part: b2}
      - say: '1 becomes $x$ plus 1 over $x$ plus 1, since anything over itself is 1. Now both tops sit over one bottom.'
        write: '$1 + \dfrac{x - 1}{x + 1} = \dfrac{(x + 1) + (x - 1)}{x + 1}$'
      - say: 'Open the brackets on top. $x$ plus $x$ is $2x$, and plus 1 minus 1 is zero. The two tiles merge into one.'
        write: '$= \dfrac{2x}{x + 1}$'
        doodle_do:
          - {id: fracs, op: stage, stage: 'custom:1984_q31_a2'}
      - say: 'Now multiply the bracket by $x$ plus 2. That multiplies the top.'
        write: '$\dfrac{2x}{x + 1} \times (x + 2) = \dfrac{2x(x + 2)}{x + 1}$'
        doodle_do:
          - {id: fracs, op: label, part: mtop, text: '× (x + 2)'}
      - say: 'Can anything cancel? $x$ plus 1 is not a factor of the top, so no. Therefore this is the simplest form.'
        write: '$\therefore \dfrac{2x(x + 2)}{x + 1}$'
        doodle_do:
          - {id: fracs, op: pulse, part: merged}
      - section: 'Check'
        say: 'Check with $x$ equals 1. In the question, 1 minus 1 over 1 plus 1 is zero over 2. So the bracket is 1, and times 3 gives 3.'
        write: '$x = 1$: $\left(1 + \dfrac{0}{2}\right)(3) = 3$'
      - say: 'Our answer gives 2 times 1 times 3, over 2, which is 6 over 2, or 3. They agree.'
        write: '$\dfrac{2(1)(3)}{2} = \dfrac{6}{2} = 3\ \checkmark$'
      - say: 'So the expression simplifies to $2x$ times $x$ plus 2, over $x$ plus 1, which is option E.'
        write: '$\therefore \dfrac{2x(x + 2)}{x + 1}$ (E)'
        answer: true
    traps:
      A: 'You went for $x$ squared minus 1, times $x$ plus 2. That multiplies instead of adding inside the bracket. Write 1 as $x$ plus 1 over $x$ plus 1 and add, and the bracket becomes $2x$ over $x$ plus 1.'
      B: 'You went for $x$ squared times $x$ plus 2, over $x$ plus 1. The tops add, not multiply. $x$ plus 1, plus $x$ minus 1, is $2x$, not $x$ squared.'
      C: 'You went for $x^{2} - (x + 2)$. The bracket is multiplied by $x$ plus 2, not subtracted. Tidy the bracket to $2x$ over $x$ plus 1, then multiply.'
      D: 'You went for $2x$ times $x$ plus 2. That drops the bottom, $x$ plus 1. The bracket is $2x$ over $x$ plus 1, so the answer keeps $x$ plus 1 underneath.'
  32:
    moments:
      - section: 'The question'
        say: 'A regular hexagon is full of isosceles triangles, because all its sides are equal. Two of them meet at $V$, and they give us the angle there.'
        write: 'Regular hexagon $PQRSTW$, $\angle TVS = ?$'
        point:
          - {figure: 0, kind: highlight, target: QS}
          - {figure: 0, kind: highlight, target: RT}
          - {figure: 0, kind: arc, target: TVS, text: '?'}
      - section: 'Solution'
        say: 'Solution. First we find each interior angle of the regular hexagon. We go through the exterior angle, because it is simpler.'
        write: 'Solution'
      - say: 'The six exterior angles are equal and add up to 360, so each is 360 divided by 6, which is 60, because the sum of exterior angles is 360.'
        write: 'Ext. $\angle = \dfrac{360^{\circ}}{6} = 60^{\circ}$ (sum of ext. $\angle$s $= 360^{\circ}$)'
      - say: 'Interior and exterior angles sit on a straight line, so each interior angle is 180 minus 60, which is 120.'
        write: 'Int. $\angle = 180^{\circ} - 60^{\circ} = 120^{\circ}$ ($\angle$s on a str. line)'
        point:
          - {figure: 0, kind: arc, target: QRS, text: '120°'}
      - say: 'Now triangle $QRS$. $QR$ equals $RS$, since all sides of a regular hexagon are equal. So its base angles at $Q$ and $S$ are equal, as base angles of an isosceles triangle.'
        write: '$\angle RSQ = \angle RQS$ (base $\angle$s of isos. $\triangle$)'
      - say: 'The base angles share what is left of 180 after the 120 at $R$, by the angle sum of a triangle.'
        write: '$\angle RSQ = \dfrac{180^{\circ} - 120^{\circ}}{2} = 30^{\circ}$ ($\angle$ sum of $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: RSQ, text: '30°'}
      - say: 'In the same way, triangle $RST$ has $RS$ equal to $ST$, and 120 degrees at $S$. So its base angle $SRT$ is also 30.'
        write: '$\angle SRT = 30^{\circ}$ (same reason)'
        point:
          - {figure: 0, kind: arc, target: SRT, text: '30°'}
      - say: 'Now the small triangle $RVS$, where the diagonals cross. Its angles at $R$ and $S$ are both 30, and its three angles add up to 180.'
        write: '$\angle RVS + 30^{\circ} + 30^{\circ} = 180^{\circ}$ ($\angle$ sum of $\triangle$)'
      - say: '30 plus 30 is 60, and 180 minus 60 is 120.'
        write: '$\angle RVS = 180^{\circ} - 60^{\circ} = 120^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: RVS, text: '120°'}
      - say: 'Angle $TVS$ sits next to angle $RVS$ on the straight line $RT$, so the two add up to 180, because they are angles on a straight line.'
        write: '$\angle TVS = 180^{\circ} - 120^{\circ}$ ($\angle$s on a str. line)'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '=120∘'}, at: '−120∘', text: 'from here'}
          - {figure: 0, kind: highlight, target: RT, text: 'straight line'}
      - say: '180 minus 120 is 60. So angle $TVS$ is 60 degrees.'
        write: '$\angle TVS = 60^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: TVS, text: '60°'}
      - section: 'Check'
        say: 'To check, angle $TVS$ is the exterior angle of triangle $RVS$ at $V$. It equals the two interior opposite angles added, 30 plus 30, which is 60.'
        write: '$\angle TVS = 30^{\circ} + 30^{\circ} = 60^{\circ}$ (ext. $\angle$ of $\triangle$) $\checkmark$'
      - say: 'Therefore angle $TVS$ is 60 degrees, option A.'
        write: '$\therefore \angle TVS = 60^{\circ}$ (A)'
        answer: true
    traps:
      B: 'You went for 90 degrees. These diagonals do not cross at right angles. In triangle $RVS$ the base angles are 30 each, so angle $RVS$ is 120, and angle $TVS$ next to it is 60.'
      C: 'You went for 120 degrees. That is angle $RVS$, on the other side of the crossing. Angle $TVS$ is next to it on a straight line, so it is 180 minus 120, which is 60.'
      D: 'You went for 30 degrees. That is a base angle of triangle $QRS$ or $RST$. Keep going. Triangle $RVS$ gives 120 at $V$, and angle $TVS$ is 60.'
      E: 'You went for 80 degrees. Every angle here comes from 120 and 30. Triangle $RVS$ gives 120 at $V$, and the angle next to it, $TVS$, is 60.'
  33:
    moments:
      - section: 'The question'
        say: 'We want the whole numbers $x$ that keep 2 minus $5x$ between minus 3 and 12. There is a minus sign in front of the $5x$, and that is where most students slip.'
        write: '$-3 < 2 - 5x < 12$'
      - say: 'Solution. This is a double inequality, which is two inequalities in one. Whatever we do, we do to all three parts, until $x$ is alone in the middle.'
        write: 'Solution'
      - say: 'First, subtract 2 from all three parts.'
        write: '$-3 - 2 < 2 - 5x - 2 < 12 - 2$'
      - say: 'Minus 3 minus 2 is minus 5. In the middle, 2 minus 2 is 0, leaving minus $5x$. And 12 minus 2 is 10.'
        write: '$-5 < -5x < 10$'
      - section: 'Divide by a negative'
        say: 'Now divide all three parts by minus 5. Dividing by a negative number reverses the inequality signs. For example, 1 is less than 2, but minus 1 is greater than minus 2.'
        write: 'Divide by $-5$, reverse the signs: $\ \dfrac{-5}{-5} > x > \dfrac{10}{-5}$'
      - say: 'Minus 5 over minus 5 is 1. And 10 over minus 5 is minus 2.'
        write: '$1 > x > -2$'
        point:
          - {line: 4, kind: circle, at: 'reverse', text: 'signs reversed'}
      - say: 'Write it the usual way, smallest number first, so $x$ is greater than minus 2 and less than 1.'
        write: '$\therefore\ -2 < x < 1$'
      - section: 'The number line'
        say: 'Show it on a number line. The signs are strict, so both ends get open circles, because minus 2 and 1 are not included.'
        diagram: {id: n, kind: numberline, range: [-4, 3]}
        diagram_do:
          - {id: n, op: interval, from: -2, to: 1, from_open: true, to_open: true, text: '−2 < x < 1', 'on': 'open circles'}
      - say: 'The integers strictly between minus 2 and 1 are minus 1 and 0.'
        write: 'Integers: $\ x = -1,\ 0$'
        diagram_do:
          - {id: n, op: point, x: -1, text: '−1', answer: true}
          - {id: n, op: point, x: 0, text: '0', answer: true}
      - section: 'Check'
        say: 'Check $x$ equals minus 1. 2 minus 5 times minus 1 is 2 plus 5, which is 7. 7 lies between minus 3 and 12.'
        write: 'Check $x = -1$: $\ 2 - 5(-1) = 7$, and $-3 < 7 < 12\ \checkmark$'
      - say: 'And for $x$ equals 0, 2 minus 0 is 2, also between minus 3 and 12.'
        write: '$x = 0$: $\ 2 - 5(0) = 2$, and $-3 < 2 < 12\ \checkmark$'
      - say: 'So the integral values are minus 1 and 0, which is option C.'
        write: '$\therefore\ x = -1,\ 0$'
        answer: true
    traps:
      A: 'You went for minus 2 and minus 1. Minus 2 is not allowed, because the inequality is strict. At $x = -2$, 2 minus $5x$ is exactly 12. The values are minus 1 and 0.'
      B: 'You went for minus 2 and 2. Both are outside the range. At $x = 2$, 2 minus $5x$ is minus 8. The values strictly between minus 2 and 1 are minus 1 and 0.'
      D: 'You went for 0 and 1. At $x = 1$, 2 minus $5x$ is exactly minus 3, which is not allowed. The range is minus 2 less than $x$ less than 1.'
      E: 'You went for 1 and 2. That comes from not reversing the signs when dividing by minus 5. Dividing by a negative reverses the inequality, giving minus 2 less than $x$ less than 1.'
  34:
    moments:
      - section: 'The question'
        say: 'Three equilateral triangles of side r sit inside a semicircle of radius r, all meeting at the centre. We want the shaded pieces between the triangles and the arc.'
        write: 'Find the shaded area.'
        point:
          - {figure: 0, kind: arrow, target: {x: 140, y: 27}, text: 'shaded', 'on': 'shaded pieces'}
      - say: 'Write Solution. The figure is given. Each triangle is equilateral, so each angle at the centre is 60 degrees, and three of them make the 180 degrees on the straight edge.'
        write: 'Solution'
        point:
          - {figure: 0, kind: circle, target: '60°', text: '60° each', 'on': '60 degrees'}
      - section: 'The plan'
        say: 'The shaded area is what is left of the semicircle when the three triangles are taken away.'
        write: 'Shaded area $=$ area of semicircle $- 3 \times$ area of $\triangle$'
        point:
          - {figure: 0, kind: highlight, target: {x: 48, y: 80}, 'on': 'what is left'}
          - {figure: 0, kind: highlight, target: {x: 140, y: 27}, text: 'left over', 'on': 'what is left'}
          - {figure: 0, kind: highlight, target: {x: 232, y: 80}, 'on': 'what is left'}
      - section: 'The semicircle'
        say: 'The area of a semicircle is half of pi r squared.'
        write: 'Area of semicircle $= \tfrac{1}{2}\pi r^{2}$'
      - section: 'One triangle'
        say: 'The area of a triangle, from two sides and the included angle, is a half, a b, sine C.'
        write: 'Area of $\triangle = \tfrac{1}{2}ab\sin C$'
      - say: 'Now substitute. The two sides are r and r, and the angle between them is 60 degrees.'
        write: '$= \tfrac{1}{2} \times r \times r \times \sin 60^{\circ}$'
        point:
          - {figure: 0, kind: circle, target: '60°', text: 'between r and r', 'on': '60 degrees'}
      - say: 'Sine 60 degrees is root 3 over 2. A half times root 3 over 2 is root 3 over 4.'
        write: '$= \tfrac{1}{2}r^{2} \times \dfrac{\sqrt{3}}{2} = \dfrac{\sqrt{3}}{4}r^{2}$'
      - section: 'Put together'
        say: 'Now substitute both areas into the plan, giving half pi r squared, minus 3 times root 3 over 4, r squared.'
        write: 'Shaded area $= \tfrac{1}{2}\pi r^{2} - 3 \times \dfrac{\sqrt{3}}{4}r^{2}$'
        point:
          - {line: 7, kind: move, from: {line: 3, at: '21πr2'}, at: '=[[21πr2]]', text: 'semicircle', 'on': 'half pi r squared'}
          - {line: 7, kind: move, from: {line: 6, at: '=[[43r2]]'}, at: '3×[[43r2]]', text: 'one triangle', 'on': 'minus 3 times'}
      - say: 'Write both over 4. A half is 2 over 4, so the first term is 2 pi over 4, r squared.'
        write: '$= \dfrac{2\pi r^{2}}{4} - \dfrac{3\sqrt{3}r^{2}}{4}$'
      - say: 'Both terms have r squared over 4, so take it out as a common factor.'
        write: '$= \dfrac{r^{2}}{4}(2\pi - 3\sqrt{3})$'
      - say: 'Therefore the shaded area is r squared over 4, times 2 pi minus 3 root 3.'
        write: '$\therefore$ shaded area $= \dfrac{r^{2}}{4}(2\pi - 3\sqrt{3})$'
        point:
          - {figure: 0, kind: label, target: {x: 140, y: 27}, text: 'r²/4 (2π − 3√3)', 'on': 'Therefore'}
      - section: 'Check'
        say: 'Check with r equals 2. The semicircle is 2 pi, about 6.28, and the triangles are 3 root 3, about 5.20. The difference, 1.08, is positive and small, as the picture shows.'
        write: 'Check ($r = 2$): $6.28 - 5.20 = 1.08 > 0$ ✓'
      - section: 'Answer'
        say: 'So the shaded area is r squared over 4, times 2 pi minus 3 root 3, which is answer choice B.'
        write: '$\therefore$ shaded area $= \dfrac{r^{2}}{4}(2\pi - 3\sqrt{3})$ (B)'
        answer: true
    traps:
      A: 'You went for option A, with 4 pi in the bracket. That uses the whole circle, pi r squared, but the figure is a semicircle, half of pi r squared, which gives 2 pi over 4.'
      C: 'You went for half of pi r squared. That is the whole semicircle. The shaded part is only what is left after taking away the three triangles.'
      D: 'You went for option D. An area must have r squared in it, not just r. Take the semicircle and subtract three triangles of root 3 over 4, r squared, each.'
      E: 'You went for option E, with a plus sign. The triangles are taken away from the semicircle, not added to it, so their area is subtracted.'
  35:
    moments:
      - section: 'The question'
        say: 'We use a triangle fact, then two circle facts, one after the other. Each one hands its angle to the next, until we reach the angle at $Q$.'
        write: '$\angle PSQ = 35^{\circ}$, $\angle SPR = 30^{\circ}$, $\angle OQP = ?$'
        point:
          - {figure: 0, kind: arc, target: PSQ, text: '35°'}
          - {figure: 0, kind: arc, target: SPR, text: '30°'}
          - {figure: 0, kind: arc, target: OQP, text: '?'}
      - section: 'Solution'
        say: 'Solution. $QRS$ is a straight line, so angle $PRQ$ lies outside triangle $PRS$, at $R$. It is an exterior angle of that triangle.'
        write: 'Solution'
        point:
          - {figure: 0, kind: highlight, target: QS, text: 'straight line'}
      - say: 'An exterior angle equals the sum of the two interior opposite angles, at $S$ and at $P$. That is the exterior angle of a triangle.'
        write: '$\angle PRQ = \angle PSR + \angle SPR$ (ext. $\angle$ of $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: PRQ, text: 'exterior'}
      - say: '35 plus 30 is 65. So angle $PRQ$ is 65 degrees.'
        write: '$\angle PRQ = 35^{\circ} + 30^{\circ} = 65^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: PRQ, text: '65°'}
      - say: 'Angle $PRQ$ is at the circumference, standing on the arc $PQ$. Angle $POQ$, at the centre, stands on the same arc, so it is twice as big.'
        write: '$\angle POQ = 2 \times \angle PRQ$ ($\angle$ at centre $= 2 \times \angle$ at circumference)'
        point:
          - {figure: 0, kind: arc, target: POQ, text: 'centre'}
      - say: '2 times 65 is 130. So angle $POQ$ is 130 degrees.'
        write: '$\angle POQ = 2 \times 65^{\circ} = 130^{\circ}$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '=65∘'}, at: '65∘', text: 'from here'}
          - {figure: 0, kind: arc, target: POQ, text: '130°'}
      - say: 'Now triangle $OPQ$. $OP$ and $OQ$ are both radii, so they are equal, and the triangle is isosceles.'
        write: '$OP = OQ$ (radii)'
        point:
          - {figure: 0, kind: highlight, target: OP, text: 'r'}
          - {figure: 0, kind: highlight, target: OQ, text: 'r'}
      - say: 'So its base angles at $P$ and $Q$ are equal, because base angles of an isosceles triangle are equal.'
        write: '$\angle OQP = \angle OPQ$ (base $\angle$s of isos. $\triangle$)'
      - say: 'The three angles of triangle $OPQ$ add up to 180. The two base angles are equal, so together they are twice angle $OQP$.'
        write: '$2\angle OQP + 130^{\circ} = 180^{\circ}$ ($\angle$ sum of $\triangle$)'
      - say: '180 minus 130 is 50.'
        write: '$2\angle OQP = 50^{\circ}$'
      - say: 'Divide by 2. Half of 50 is 25.'
        write: '$\angle OQP = 25^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: OQP, text: '25°'}
      - section: 'Check'
        say: 'Check the angles of triangle $OPQ$, which are 25 at $Q$, 25 at $P$ and 130 at $O$. 25 plus 25 plus 130 is 180.'
        write: '$25^{\circ} + 25^{\circ} + 130^{\circ} = 180^{\circ}\ \checkmark$'
      - say: 'Therefore angle $OQP$ is 25 degrees, option D.'
        write: '$\therefore \angle OQP = 25^{\circ}$ (D)'
        answer: true
    traps:
      A: 'You went for 35 degrees. That is the angle at $S$, which is given. Use it with the 30 degrees to get 65 at $R$, then 130 at the centre, then 25 at $Q$.'
      B: 'You went for 30 degrees. That is the angle at $P$ in triangle $PRS$, which is given. Keep going through the circle facts to reach angle $OQP$, which is 25.'
      C: 'You went for 130 degrees. That is the angle at the centre, $POQ$. The question asks for angle $OQP$, a base angle of the isosceles triangle, which is half of 50, which is 25.'
      E: 'You went for 65 degrees. That is angle $PRQ$, found on the way. Double it for the centre angle, 130. Then the base angles of triangle $OPQ$ are 25 each.'
  36:
    moments:
      - section: 'The question'
        say: 'We want $t$ in terms of $q$ only, so $p$ has to disappear. The first equation is there to remove it.'
        write: '$pq + 1 = q^{2}$, $t = \dfrac{1}{p} - \dfrac{1}{pq}$'
      - section: 'Solution'
        say: 'First put $t$ over one bottom using the L.C.M. Then use the given equation to replace $pq$, factorise, and cancel.'
        write: 'Solution'
      - say: 'The bottoms are $p$ and $pq$, so the L.C.M. is $pq$.'
        write: 'L.C.M. $= pq$'
      - say: 'Multiply the top and bottom of 1 over $p$ by $q$, so it becomes $q$ over $pq$.'
        write: '$t = \dfrac{q}{pq} - \dfrac{1}{pq}$'
      - say: 'The bottoms are the same, so subtract the tops. Picture it as a top tile over a bottom tile.'
        write: '$t = \dfrac{q - 1}{pq}$'
        doodle: {name: 'custom:1984_q36_a', id: tiles, caption: 'a top tile over a bottom tile', size: scene}
      - section: 'Remove p'
        say: 'The bottom is $pq$, and the given equation tells us about $pq$. Subtract 1 from both sides of $pq$ plus 1 equals $q$ squared.'
        write: '$pq = q^{2} - 1$'
        doodle_do:
          - {id: tiles, op: label, part: pq, text: 'q² − 1'}
        point:
          - {line: 0, kind: underline, at: 'pq+1=q2', text: 'given'}
      - say: '$q$ squared minus 1 is a difference of two squares, so it is $q$ minus 1, times $q$ plus 1.'
        write: '$pq = (q - 1)(q + 1)$'
      - say: 'Put that in place of $pq$ on the bottom of $t$. The bottom tile becomes two tiles.'
        write: '$t = \dfrac{q - 1}{(q - 1)(q + 1)}$'
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1984_q36_a2'}
        point:
          - {line: 7, kind: move, from: {line: 6, at: '(q−1)(q+1)'}, at: '(q−1)(q+1)', text: 'for pq'}
      - say: '$q$ minus 1 is on the top and the bottom. Cancel the common factor, leaving 1 on top. Cross out the pink pair.'
        write: '$\therefore t = \dfrac{1}{q + 1}$'
        doodle_do:
          - {id: tiles, op: cross, part: top}
          - {id: tiles, op: cross, part: b1}
          - {id: tiles, op: circle, part: b2}
      - section: 'Check'
        say: 'Check with $q$ equals 2. Then $2p$ plus 1 is 4, so $2p$ is 3 and $p$ is 3 over 2.'
        write: '$q = 2$: $2p + 1 = 4$, $p = \dfrac{3}{2}$'
      - say: '1 over $p$ is 2 over 3, and 1 over $pq$ is 1 over 3. So $t$ is 2 over 3 minus 1 over 3, which is 1 over 3. And 1 over 2 plus 1 is 1 over 3 too.'
        write: '$t = \dfrac{2}{3} - \dfrac{1}{3} = \dfrac{1}{3} = \dfrac{1}{2 + 1}\ \checkmark$'
      - say: 'So $t$ is 1 over $q$ plus 1, which is option C.'
        write: '$\therefore t = \dfrac{1}{q + 1}$ (C)'
        answer: true
    traps:
      A: 'You went for 1 over $p$ minus $q$. That still has $p$ in it, and we want $t$ in terms of $q$ only. Use $pq = (q - 1)(q + 1)$ to remove $p$.'
      B: 'You went for 1 over $q$ minus 1. That cancels the wrong factor. The top is $q$ minus 1, so it is $q$ minus 1 that cancels, leaving 1 over $q$ plus 1.'
      D: 'You went for 1 plus $q$. That is the answer turned upside down. $t$ is $q$ minus 1 over $(q - 1)(q + 1)$, which is 1 over $q$ plus 1.'
      E: 'You went for 1 over 1 minus $q$. Try $q$ equals 2. Then $t$ is 1 over 3, but 1 over 1 minus 2 is negative 1. The answer is 1 over $q$ plus 1.'
  37:
    moments:
      - section: 'The question'
        say: 'We have a frequency table of scores. $cf$ of $x$ is the cumulative frequency at the score $x$. We want $cf$ of 5. Table first.'
        write: '$cf(5) = ?$'
        diagram:
          id: t
          kind: table
          columns: ['Score (x)', 'f', 'cf']
          rows: [[3, 30, ''], [4, 32, ''], [5, 30, ''], [6, 35, ''], [7, 20, '']]
          'on': 'Table'
      - section: 'Solution'
        say: 'Solution. The cumulative frequency at a score is the number of students who scored that much or less, which is the sum of the frequencies up to and including that row.'
        write: 'Solution. $cf(x) =$ number who scored $x$ or less'
      - say: 'So we add a cf column, the cumulative frequency, which is a running total of $f$ down the table. It goes 30, then 62, 92, 127 and 147.'
        diagram_do:
          - {id: t, op: total, part: 'col:2', into: 'col:3', 'on': 'running'}
      - say: '$cf$ of 5 counts the scores 3, 4 and 5. So it is their three frequencies added.'
        write: '$cf(5) = f(3) + f(4) + f(5)$'
      - say: 'Read them from the $f$ column, so 30, 32 and 30.'
        write: '$= 30 + 32 + 30$'
        diagram_do:
          - {id: t, op: highlight, part: 'col:2', text: 'scores 3 to 5', 'on': 'column'}
      - say: '30 plus 32 is 62, and 62 plus 30 is 92. That is the cf in the row for the score 5.'
        write: '$\therefore cf(5) = 92$'
        diagram_do:
          - {id: t, op: highlight, part: 'cell:3,3', text: 'cf(5) = 92', 'on': 'row'}
        point:
          - {line: 5, kind: highlight, at: '92', to: {diagram: t, part: 'cell:3,3'}}
      - section: 'Check'
        say: 'Check from the other end. Add down the whole $f$ column, and 30 plus 32 plus 30 plus 35 plus 20 is 147, the last cf.'
        write: '$\sum f = 147$'
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': 'Add'}
      - say: 'The scores above 5 are 6 and 7, so 35 plus 20 is 55 students. Take them away from 147.'
        write: 'Above 5: $35 + 20 = 55$'
      - say: '147 minus 55 is 92, the same as before.'
        write: 'Check: $147 - 55 = 92$ ✓'
        point:
          - {line: 8, kind: move, from: {line: 6, at: '147'}, at: '147', text: 'Σf'}
          - {line: 8, kind: move, from: {line: 7, at: '=55'}, at: '55', text: 'above 5'}
      - section: 'Answer'
        say: 'So $cf$ of 5 is 92, which is option E.'
        write: '$\therefore cf(5) = 92$'
        answer: true
    traps:
      A: 'You went for 30. That is the frequency of the score 5 on its own. The cumulative frequency adds everything up to and including 5, so 30 plus 32 plus 30, which is 92.'
      B: 'You went for 35. That is the frequency of the score 6. $cf$ of 5 adds the frequencies of 3, 4 and 5, giving 92.'
      C: 'You went for 55. That is the number who scored above 5. $cf$ of 5 counts those who scored 5 or less, and 147 minus 55 is 92.'
      D: 'You went for 62. That is $cf$ of 4, one row short in the cf column. Add the 30 who scored 5 to get 92.'
  38:
    moments:
      - section: 'The question'
        say: 'Four points on a circle make a cyclic quadrilateral, and its exterior angle is the shortcut here. We use one triangle first, then one circle fact.'
        write: '$\angle QPT = 44^{\circ}$, $\angle PQT = 20^{\circ}$, $y = ?$'
        point:
          - {figure: 0, kind: arc, target: QPT, text: '44°'}
          - {figure: 0, kind: arc, target: PQT, text: '20°'}
          - {figure: 0, kind: circle, target: y, text: '?'}
      - section: 'Solution'
        say: 'Solution. $Q$, $T$, $S$ and $R$ all lie on the circle, so $QTSR$ is a cyclic quadrilateral. We start in the small triangle $PQT$.'
        write: 'Solution'
      - say: 'Triangle $PQT$ has 44 degrees at $P$ and 20 at $Q$. Its three angles add up to 180, by the angle sum of a triangle.'
        write: '$\angle PTQ + 44^{\circ} + 20^{\circ} = 180^{\circ}$ ($\angle$ sum of $\triangle$)'
      - say: '44 plus 20 is 64, and 180 minus 64 is 116.'
        write: '$\angle PTQ = 180^{\circ} - 64^{\circ} = 116^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: PTQ, text: '116°'}
      - say: '$P$, $T$ and $S$ are on a straight line, so angle $PTQ$ is the exterior angle at $T$. It equals the interior angle at the opposite corner, $R$, as the exterior angle of a cyclic quadrilateral.'
        write: '$y = \angle PTQ$ (ext. $\angle$ of cyclic quad.)'
        point:
          - {figure: 0, kind: highlight, target: PS, text: 'straight line'}
          - {figure: 0, kind: circle, target: y, text: 'opposite T'}
      - say: 'So $y$ is the 116 degrees we found.'
        write: '$y = 116^{\circ}$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '=116∘'}, at: '116∘', text: 'from here'}
          - {figure: 0, kind: circle, target: y, text: '116°'}
      - section: 'Check'
        say: 'Check by a second route. The exterior angle at $Q$, 20 degrees, equals the interior angle at $S$, by the same fact.'
        write: '$\angle TSR = \angle PQT = 20^{\circ}$ (ext. $\angle$ of cyclic quad.)'
        point:
          - {figure: 0, kind: arc, target: TSR, text: '20°'}
      - say: 'Then the big triangle $PRS$ has 44 at $P$ and 20 at $S$. So $y$ is 180 minus 44 minus 20, which is 116 again.'
        write: '$y = 180^{\circ} - 44^{\circ} - 20^{\circ} = 116^{\circ}\ \checkmark$'
      - say: 'Therefore the angle marked $y$ is 116 degrees, option B.'
        write: '$\therefore y = 116^{\circ}$ (B)'
        answer: true
    traps:
      A: 'You went for 66 degrees. Triangle $PQT$ gives angle $PTQ$ as 180 minus 44 minus 20, which is 116, and that exterior angle equals the interior opposite angle $y$. So $y$ is 116.'
      C: 'You went for 26 degrees. Use triangle $PQT$ first. The angle at $T$ is 116. As the exterior angle of the cyclic quadrilateral, it equals $y$.'
      D: 'You went for 70 degrees. The angles of triangle $PQT$ give 116 at $T$, and the exterior angle of a cyclic quadrilateral equals the interior opposite angle. So $y$ is 116.'
      E: 'You went for 44 degrees. That is the angle at $P$, copied across. The angle $y$ equals the exterior angle at $T$, which is 180 minus 44 minus 20, or 116.'
  39:
    moments:
      - section: 'The question'
        say: 'A cone has base radius r cm and a vertical angle of 2y degrees. We want its height. Slice the cone straight down the middle and a right-angled triangle appears.'
        write: 'Find the height of the cone.'
      - say: 'Write Solution, then sketch the cone with its vertex V, the centre of the base O, and a point A on the rim.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '2y°', text: 'vertical angle', 'on': 'vertex V'}
      - section: 'What we know'
        say: 'List the givens. The base radius is r and the vertical angle is 2y degrees. Let the height be h.'
        write: '$|OA| = r$, vertical angle $= 2y^{\circ}$; let $|VO| = h$'
        point:
          - {figure: sketch, kind: highlight, target: VO, text: 'h', 'on': 'height be h'}
      - say: 'The height VO is the axis of the cone, so it bisects the vertical angle, which means it cuts it into two equal parts. So the angle OVA is y.'
        write: '$\angle OVA = \tfrac{1}{2} \times 2y = y$ (axis bisects vertical angle)'
        point:
          - {figure: sketch, kind: arc, target: OVA, text: 'y', 'on': 'angle OVA'}
      - say: 'Triangle VOA is right-angled at O. From the angle y, r is the opposite side and h is the adjacent side.'
        write: 'In $\triangle VOA$: opp $= r$, adj $= h$'
        point:
          - {figure: sketch, kind: highlight, target: OA, text: 'opposite', 'on': 'opposite side'}
          - {figure: sketch, kind: highlight, target: VO, text: 'adjacent', 'on': 'adjacent side'}
      - section: 'SOH CAH TOA'
        say: 'We have opposite and adjacent, so by SOH CAH TOA, that is TOA, and tan equals opposite over adjacent.'
        write: '$\tan y = \dfrac{\text{opp}}{\text{adj}} = \dfrac{r}{h}$'
      - say: 'Cross-multiply, and h times tan y equals r.'
        write: '$h\tan y = r$'
      - say: 'Divide both sides by tan y.'
        write: '$h = \dfrac{r}{\tan y}$'
      - say: 'One over tan is cot, short for cotangent. So r over tan y is r cot y.'
        write: '$h = r\cot y$'
      - say: 'Therefore the height of the cone is r cot y centimetres.'
        write: '$\therefore h = r\cot y^{\circ}$ cm'
        point:
          - {figure: sketch, kind: label, target: 'h = ?', text: 'r cot y', 'on': 'Therefore'}
      - section: 'Check'
        say: 'Check with y equals 45 degrees. The triangle is isosceles, so h should equal r. Cot 45 degrees is 1, and r times 1 is r.'
        write: 'Check: $y = 45^{\circ} \Rightarrow h = r\cot 45^{\circ} = r$ ✓'
      - section: 'Answer'
        say: 'So the height is r cot y centimetres, which is answer choice C.'
        write: '$\therefore h = r\cot y^{\circ}$ cm (C)'
        answer: true
    traps:
      A: 'You went for r tan y. That puts the radius and height the wrong way round. From the angle at the top, r is opposite and h is adjacent, so tan y is r over h, and h is r cot y.'
      B: 'You went for r sin y. Sine uses the slant edge, the hypotenuse. We know r and want h, which are opposite and adjacent, so we need tan, and h is r cot y.'
      D: 'You went for r cos y. Cosine uses the slant edge, which we do not know. With r opposite and h adjacent, tan y is r over h, giving h equals r cot y.'
      E: 'You went for r cosec y. That is the length of the slant edge, not the height. The height uses tan, so h is r cot y.'
  40:
    moments:
      - section: 'The question'
        say: 'Two fair dice are rolled. What is the probability that both show the same number?'
        write: 'Two fair dice: $P(\text{both the same}) = ?$'
      - say: 'Solution. Let $E$ be the event that both dice show the same number.'
        write: 'Solution: let $E$ = both show the same number'
      - section: 'The sample space'
        say: 'The sample space, $S$, is every way the two dice can land. Draw the outcome table, with the first die down the side, the second across the top, and the pair in each cell.'
        diagram:
          id: s
          kind: table
          'on': 'outcome table'
          columns: ['1st, 2nd', '1', '2', '3', '4', '5', '6']
          rows: [[1, '1,1', '1,2', '1,3', '1,4', '1,5', '1,6'], [2, '2,1', '2,2', '2,3', '2,4', '2,5', '2,6'], [3, '3,1', '3,2', '3,3', '3,4', '3,5', '3,6'], [4, '4,1', '4,2', '4,3', '4,4', '4,5', '4,6'], [5, '5,1', '5,2', '5,3', '5,4', '5,5', '5,6'], [6, '6,1', '6,2', '6,3', '6,4', '6,5', '6,6']]
      - say: 'Each die has 6 faces, so the table has 6 times 6 cells. n of $S$, the number of possible outcomes, is 36.'
        write: '$n(S) = 6 \times 6 = 36$'
      - section: 'The favourable outcomes'
        say: 'Both the same means a double, so 1 and 1, 2 and 2, up to 6 and 6. They lie on the slanting line of the table. I ring the first three.'
        write: '$E = \{(1,1),\ (2,2),\ \ldots,\ (6,6)\}$'
        diagram_do:
          - {id: s, op: highlight, part: 'cell:1,2', 'on': 'ring'}
          - {id: s, op: highlight, part: 'cell:2,3'}
          - {id: s, op: highlight, part: 'cell:3,4'}
      - say: 'Ring 4 and 4, 5 and 5, 6 and 6. That is 6 doubles, so n of $E$ is 6.'
        write: '$n(E) = 6$'
        diagram_do:
          - {id: s, op: highlight, part: 'cell:4,5'}
          - {id: s, op: highlight, part: 'cell:5,6'}
          - {id: s, op: highlight, part: 'cell:6,7'}
      - section: 'The probability'
        say: 'The probability of $E$ is n of $E$ over n of $S$, which is the number of favourable outcomes over the total number of possible outcomes.'
        write: '$P(E) = \dfrac{n(E)}{n(S)}$'
      - say: 'Substitute to get 6 over 36.'
        write: '$= \dfrac{6}{36}$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '= 6'}, at: '36[[6]]', text: 'n(E)'}
          - {line: 7, kind: move, from: {line: 3, at: '= 36'}, at: '[[36]]6', text: 'n(S)'}
      - say: 'Divide the top and the bottom by 6. 6 divided by 6 is 1, and 36 divided by 6 is 6.'
        write: '$= \dfrac{6 \div 6}{36 \div 6} = \dfrac{1}{6}$'
      - section: 'Check'
        say: 'To check, whatever the first die shows, look at the second die. Only 1 of its 6 faces matches. So the probability is 1 over 6 again.'
        write: 'Check: 1 face of the 2nd die matches: $\dfrac{1}{6}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the probability that both dice show the same number is 1 over 6, which is option E.'
        write: '$\therefore P(E) = \dfrac{1}{6}$'
        answer: true
    traps:
      A: 'You went for 1 over 36. That is the probability of one particular double, like double six. Any of the 6 doubles will do, so n of E is 6, and 6 over 36 is 1 over 6.'
      B: 'You went for 7 over 36. The slanting line of the table has only 6 doubles, from 1 and 1 to 6 and 6. So P of E is 6 over 36, which is 1 over 6.'
      C: 'You went for a half. Most rolls give two different numbers. Only 6 of the 36 cells are doubles, which is 1 over 6.'
      D: 'You went for 1 over 3. That would need 12 doubles. The table has only 6 out of 36, which is 1 over 6.'
  41:
    moments:
      - section: 'The question'
        say: 'We want the larger value of $y$. A squared bracket usually means a quadratic is waiting. Picture the two sides on a balance.'
        write: '$(y - 1)^{2} = 4y - 7$'
        doodle: {name: 'custom:1984_q41_a', id: scale, caption: 'two sides on a balance', size: scene}
      - section: 'Solution'
        say: 'Open the bracket, bring every term to one side so the other side is zero, then factorise.'
        write: 'Solution'
      - say: 'Open the bracket. $y$ minus 1, all squared, is $y$ squared minus $2y$ plus 1.'
        write: '$y^{2} - 2y + 1 = 4y - 7$'
      - say: 'Subtract $4y$ from both sides and add 7 to both sides.'
        write: '$y^{2} - 2y - 4y + 1 + 7 = 0$'
      - say: 'Collect like terms. Negative $2y$ minus $4y$ is negative $6y$, and 1 plus 7 is 8.'
        write: '$y^{2} - 6y + 8 = 0$'
      - section: 'Factorise'
        say: 'Here $a$ is 1, $b$ is negative 6 and $c$ is 8. The product is $ac$, 8. The sum is $b$, negative 6.'
        write: 'Product $= ac = 8$, Sum $= b = -6$'
      - say: 'Two numbers that multiply to 8 and add to negative 6 are negative 2 and negative 4.'
        write: 'Factors: $-2$ and $-4$'
      - say: 'Replace the middle term, negative $6y$, with negative $2y$ minus $4y$.'
        write: '$y^{2} - 2y - 4y + 8 = 0$'
      - say: 'Group in pairs. Take out $y$ from the first pair and negative 4 from the second. Both brackets are $y$ minus 2.'
        write: '$y(y - 2) - 4(y - 2) = 0$'
      - say: 'Take out the common bracket, $y$ minus 2. What is left is $y$ minus 4.'
        write: '$(y - 2)(y - 4) = 0$'
      - say: 'Either the first bracket is zero or the second one is.'
        write: 'Either $y - 2 = 0$ or $y - 4 = 0$'
      - say: 'So $y$ is 2 or 4. Either value makes the balance level.'
        write: '$y = 2$ or $y = 4$'
        doodle_do:
          - {id: scale, op: label, part: beam, text: 'y = 2 or y = 4'}
      - say: 'The question wants the larger one. Therefore $y$ is 4.'
        write: '$\therefore$ the larger value is $y = 4$'
      - section: 'Check'
        say: 'Put $y$ equals 4 in the question. 4 minus 1 is 3, and 3 squared is 9.'
        write: 'LHS: $(4 - 1)^{2} = 9$'
        doodle_do:
          - {id: scale, op: label, part: left, text: '9'}
      - say: 'On the other side, 4 times 4 is 16, minus 7 is 9. Both sides match, and the two pans balance.'
        write: 'RHS: $4(4) - 7 = 9\ \checkmark$'
        doodle_do:
          - {id: scale, op: label, part: right, text: '9'}
          - {id: scale, op: highlight, part: beam}
      - say: 'So the larger value of $y$ is 4, which is option B.'
        write: '$\therefore y = 4$ (B)'
        answer: true
    traps:
      A: 'You went for 2. That is one of the solutions, but it is the smaller one. The question asks for the larger, which is 4.'
      C: 'You went for 6. That is the sum of the two roots, read off the negative $6y$ term. Solve $y^{2} - 6y + 8 = 0$ fully. The roots are 2 and 4, and the larger is 4.'
      D: 'You went for 7. That comes from the number in the question, not from solving. Open the bracket, rearrange to $y^{2} - 6y + 8 = 0$, and the roots are 2 and 4.'
      E: 'You went for 8. That is the product of the two roots, the constant term. The roots themselves are 2 and 4, and the larger is 4.'
  42:
    moments:
      - section: 'The question'
        say: 'The graph shows the line $y$ equals $2x$ plus 1 and the curve $y$ equals $x$ squared minus $2x$ plus 1. We want the $x$-coordinates of the points where they meet.'
        write: '$y = 2x + 1$ and $y = x^{2} - 2x + 1$; $x = ?$ where they meet'
        point:
          - {figure: 0, kind: circle, target: 'y = 2x + 1'}
          - {figure: 0, kind: circle, target: 'y = x² − 2x + 1'}
      - section: 'Solution'
        say: 'Solution. Number the two equations, 1 and 2.'
        write: 'Solution: $y = 2x + 1$ ... (1)'
      - say: 'Equation 2 is the curve.'
        write: '$y = x^{2} - 2x + 1$ ... (2)'
      - say: 'At the points of intersection, both graphs have the same $y$ for the same $x$. So equate equation 2 and equation 1.'
        write: '(2) $=$ (1): $\ x^{2} - 2x + 1 = 2x + 1$'
      - say: 'Collect all the terms on the left, so subtract $2x$ and subtract 1 from both sides.'
        write: '$x^{2} - 2x - 2x + 1 - 1 = 0$'
      - say: 'Minus $2x$ minus $2x$ is minus $4x$, and 1 minus 1 is zero.'
        write: '$x^{2} - 4x = 0$'
      - say: 'Do not divide by $x$, because that loses a root. Factorise, as $x$ is a common factor.'
        write: '$x(x - 4) = 0$'
      - say: 'A product is zero when one of its factors is zero.'
        write: 'Either $x = 0$ or $x - 4 = 0$'
      - say: 'From the second, $x$ is 4.'
        write: '$\therefore x = 0$ or $x = 4$'
      - section: 'Check'
        say: 'Check $x$ equals 0 in both equations. Equation 1 gives 1, and equation 2 gives 0 minus 0 plus 1, which is 1. That is the point 0, 1.'
        write: 'Check $x = 0$: (1) $y = 1$; (2) $y = 1\ \checkmark$'
        point:
          - {figure: 0, kind: circle, target: {x: 90, y: 252}, text: '(0, 1)'}
      - say: 'Check $x$ equals 4. Equation 1 gives 8 plus 1, which is 9. Equation 2 gives 16 minus 8 plus 1, which is 9. That is the point 4, 9.'
        write: 'Check $x = 4$: (1) $y = 9$; (2) $y = 16 - 8 + 1 = 9\ \checkmark$'
        point:
          - {figure: 0, kind: circle, target: {x: 270, y: 108}, text: '(4, 9)'}
      - section: 'Answer'
        say: 'Therefore the $x$-coordinates of the points of intersection are 0 and 4, which is option E.'
        write: '$\therefore x = 0,\ 4$'
        answer: true
    traps:
      A: 'You went for 1, 1. That is where the curve touches the $x$-axis, not where it meets the line. Equating the two equations gives $x(x - 4) = 0$, so $x = 0$ or 4.'
      B: 'You went for 0, minus 4. Watch the sign. $x - 4 = 0$ gives $x = 4$, not minus 4. The graph shows the crossing at $x = 4$.'
      C: 'You went for 4, 9. Those are the $x$ and $y$ of ONE point. The question asks for the two $x$-coordinates, 0 and 4.'
      D: 'You went for 0, 0. That keeps only one root. $x(x - 4) = 0$ also gives $x = 4$.'
  43:
    moments:
      - section: 'The question'
        say: 'Sin theta is $x$ over $y$, and we want 1 over tan theta. The ratio is in letters, but the method is the same as with numbers, so draw the triangle.'
        write: '$\sin\theta = \dfrac{x}{y}$, $\ 0^{\circ} < \theta < 90^{\circ}$; find $\dfrac{1}{\tan\theta}$'
      - section: 'Solution'
        say: 'Solution. Theta is acute, so let me draw a right-angled triangle $ABC$, with the right angle at $C$ and theta at $A$.'
        write: 'Solution: right $\angle$ at $C$, $\theta$ at $A$'
        show_sketch: true
        'on': 'draw'
        point:
          - {figure: sketch, kind: arc, target: BAC, text: 'θ'}
      - say: 'SOH CAH TOA. Sin is SOH, which is opposite over hypotenuse. So the side opposite theta, $BC$, is $x$, and the hypotenuse $AB$ is $y$.'
        write: 'SOH: $\sin\theta = \dfrac{\text{opp}}{\text{hyp}} = \dfrac{x}{y}$: opp $= x$, hyp $= y$'
        point:
          - {figure: sketch, kind: highlight, target: BC, text: 'opp = x'}
          - {figure: sketch, kind: highlight, target: AB, text: 'hyp = y'}
      - section: 'The adjacent side'
        say: 'The adjacent side $AC$ is missing. By Pythagoras, the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hyp}^{2} = \text{opp}^{2} + \text{adj}^{2}$'
        point:
          - {figure: sketch, kind: highlight, target: AC, text: 'adj = ?'}
      - say: 'Substitute, so $y$ squared equals $x$ squared plus adj squared.'
        write: '$y^{2} = x^{2} + \text{adj}^{2}$'
      - say: 'Take $x$ squared to the other side, then take the square root. A side is positive.'
        write: '$\text{adj}^{2} = y^{2} - x^{2} \Rightarrow \text{adj} = \sqrt{y^{2} - x^{2}}$'
        point:
          - {figure: sketch, kind: label, target: '?', text: '√(y² − x²)'}
      - section: 'cot θ'
        say: 'Tan is TOA, opposite over adjacent. So 1 over tan, which is cot, is adjacent over opposite.'
        write: '$\dfrac{1}{\tan\theta} = \dfrac{\text{adj}}{\text{opp}}$'
      - say: 'Now substitute. The adjacent is root of $y$ squared minus $x$ squared, and the opposite is $x$.'
        write: '$\dfrac{1}{\tan\theta} = \dfrac{\sqrt{y^{2} - x^{2}}}{x}$'
      - section: 'Check'
        say: 'Check with a 3, 4, 5 triangle. Take $x$ as 3 and $y$ as 5. Then the adjacent is root of 25 minus 9, which is root 16, or 4.'
        write: 'Check $x = 3,\ y = 5$: $\ \sqrt{25 - 9} = \sqrt{16} = 4$'
      - say: 'Our formula gives 4 over 3. And in the 3, 4, 5 triangle, tan theta is 3 over 4, whose reciprocal is 4 over 3. It agrees.'
        write: '$\dfrac{\sqrt{16}}{3} = \dfrac{4}{3} = 1 \div \dfrac{3}{4}\ \checkmark$'
      - section: 'Answer'
        say: 'So 1 over tan theta is root of $y$ squared minus $x$ squared, over $x$, which is answer choice C.'
        write: '$\therefore \dfrac{1}{\tan\theta} = \dfrac{\sqrt{y^{2} - x^{2}}}{x}$'
        answer: true
    traps:
      A: 'You went for option A. That is tan theta itself, opposite over adjacent. The question wants 1 over tan theta, adjacent over opposite.'
      B: 'You went for $x$ over $y$. That is sin theta, which we were given. 1 over tan theta is adjacent over opposite.'
      D: 'You went for option D. That is hypotenuse over adjacent, which is sec theta, 1 over cos. We want adjacent over opposite.'
      E: 'You went for option E. That is adjacent over hypotenuse, which is cos theta. 1 over tan theta has the opposite side, $x$, in the denominator.'
  44:
    moments:
      - section: 'The question'
        say: 'We have two triangles, one inside the other, with an equal pair of angles. That makes them similar. The skill is matching the right sides.'
        write: '$\angle TSP = \angle PRQ$, $QR = 8$, $PR = 6$, $ST = 12$, $SP = ?$'
        point:
          - {figure: 0, kind: arc, target: PRQ, text: 'equal'}
          - {figure: 0, kind: arc, target: TSP, text: 'equal'}
      - section: 'Solution'
        say: 'Solution. Compare the small triangle $PRQ$ with the big triangle $PST$. List their equal angles, with a reason for each.'
        write: 'Solution'
      - say: 'Both triangles have the same angle at $P$, because it is a common angle.'
        write: '$\angle RPQ = \angle SPT$ (common)'
        point:
          - {figure: 0, kind: arc, target: RPQ, text: 'common'}
      - say: 'The angle at $R$ equals the angle at $S$. That is given.'
        write: '$\angle PRQ = \angle PST$ (given)'
      - say: 'The third pair must then be equal too, by the angle sum of a triangle.'
        write: '$\angle PQR = \angle PTS$ ($\angle$ sum of $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: PQR}
          - {figure: 0, kind: arc, target: PTS}
      - say: 'All three angles match, so the triangles are similar. We write the letters in matching order, $P$ with $P$, $R$ with $S$ and $Q$ with $T$.'
        write: '$\triangle PRQ \;|||\; \triangle PST$ (equiangular)'
      - say: 'In similar triangles, matching sides are in the same ratio. Read the pairs off the matched letters.'
        write: '$\dfrac{PR}{PS} = \dfrac{RQ}{ST} = \dfrac{PQ}{PT}$'
        point:
          - {figure: 0, kind: highlight, target: PR, text: '6'}
          - {figure: 0, kind: highlight, target: PS, text: '?'}
      - say: 'We know $PR$, $RQ$ and $ST$, so we take the first two ratios. Put in 6, 8 and 12.'
        write: '$\dfrac{6}{PS} = \dfrac{8}{12}$'
      - say: 'Cross-multiply. 8 times $PS$ equals 6 times 12.'
        write: '$8 \times PS = 6 \times 12$'
      - say: '6 times 12 is 72.'
        write: '$8 \times PS = 72$'
      - say: 'Divide both sides by 8. 72 divided by 8 is 9.'
        write: '$PS = \dfrac{72}{8} = 9$ cm'
        point:
          - {figure: 0, kind: label, target: PS, text: '9 cm'}
      - section: 'Check'
        say: 'Check the scale. $ST$ over $RQ$ is 12 over 8, which is 1.5, so the big triangle is 1.5 times the small one. 6 times 1.5 is 9.'
        write: '$\dfrac{12}{8} = 1.5$, $\ 6 \times 1.5 = 9\ \checkmark$'
      - say: 'Therefore $SP$ is 9 centimetres, option C.'
        write: '$\therefore SP = 9$ cm (C)'
        answer: true
    traps:
      A: 'You went for 4 cm. That matches the sides the wrong way round, 6 times 8 over 12. The equal angles are at $R$ and $S$, so $PR$ goes with $PS$, and 6 over $PS$ equals 8 over 12, giving 9.'
      B: 'You went for 16 cm. That comes from 8 times 12 over 6, which puts $QR$ with $PS$. Match by the equal angles, so $PR$ goes with $PS$, and $RQ$ with $ST$.'
      D: 'You went for 14 cm. The sides must be in the same ratio. 6 over $PS$ equals 8 over 12, so $PS$ is 72 over 8, which is 9.'
      E: 'You went for impossible. Two equal angles are enough to make the triangles similar, and then the given sides give $PS$ equals 9.'
  45:
    moments:
      - section: 'The question'
        say: 'A bar chart shows the marks in a class test. We want the number of students in the class.'
        write: 'Number of students $= ?$'
        point:
          - {figure: 0, kind: circle, target: Frequency, text: 'students'}
      - section: 'Solution'
        say: 'Solution. In a bar chart, the height of each bar is its frequency, which is the number of students in that group of marks. Read every bar into a frequency table.'
        write: 'Height of a bar $=$ frequency $f$'
        diagram: {id: t, kind: table, columns: [Marks, 'Frequency (f)'], rows: [['0–9', ''], ['10–19', ''], ['20–29', ''], ['30–39', ''], ['40–49', ''], ['50–59', '']]}
      - say: 'The 0 to 9 bar reaches 4. The 10 to 19 bar reaches 6. The 20 to 29 bar reaches 8.'
        write: 'Frequencies: $4,\ 6,\ 8$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,2', text: '4', 'on': 'reaches 4'}
          - {id: t, op: fill, part: 'cell:2,2', text: '6', 'on': 'reaches 6'}
          - {id: t, op: fill, part: 'cell:3,2', text: '8', 'on': 'reaches 8'}
        point:
          - {figure: 0, kind: label, target: '0–9', text: '4'}
      - say: 'The 30 to 39 bar, the tallest, reaches 9. The 40 to 49 bar reaches 5. The 50 to 59 bar reaches 2.'
        write: 'Frequencies: $9,\ 5,\ 2$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,2', text: '9', 'on': 'reaches 9'}
          - {id: t, op: fill, part: 'cell:5,2', text: '5', 'on': 'reaches 5'}
          - {id: t, op: fill, part: 'cell:6,2', text: '2', 'on': 'reaches 2'}
        point:
          - {figure: 0, kind: label, target: '30–39', text: '9'}
      - say: 'Every student is in exactly one group, so the class size is the total frequency, sigma f.'
        write: 'Number of students $= \Sigma f$'
      - say: 'Add them up in order. 4 plus 6 is 10, and 10 plus 8 is 18.'
        write: '$\Sigma f = 4 + 6 + 8 + 9 + 5 + 2 = 18 + 9 + 5 + 2$'
      - say: '18 plus 9 is 27, plus 5 is 32, plus 2 is 34.'
        write: '$= 34$'
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': '34'}
      - section: 'Check'
        say: 'Check by adding in pairs. 4 plus 6 is 10, 8 plus 9 is 17, and 5 plus 2 is 7. 10 plus 17 plus 7 is 34.'
        write: '$10 + 17 + 7 = 34\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore there are 34 students in the class, which is answer choice E.'
        write: '$\therefore$ 34 students'
        answer: true
    traps:
      A: 'You went for 9. That is the tallest bar alone, the students who scored 30 to 39. The class is the total frequency of all six bars, which is 34.'
      B: 'You went for 2. That is the shortest bar, the students who scored 50 to 59. Add all six frequencies to get 34.'
      C: 'You went for 60. That is the top of the marks scale, not a count of students. Add the bar heights to get 34.'
      D: 'You went for 30. Check the addition. 4, 6, 8, 9, 5 and 2 add up to 34.'
  46:
    moments:
      - section: 'The question'
        say: 'Here we have parallel lines and a circle together. The parallel lines give us one angle at $P$, then two radii carry it straight across to $S$.'
        write: '$PS \parallel RT$, $\angle PRT = 135^{\circ}$, $\angle PSQ = ?$'
        point:
          - {figure: 0, kind: arc, target: PRT, text: '135°'}
          - {figure: 0, kind: circle, target: '?', text: 'PSQ'}
      - section: 'Solution'
        say: 'Solution. $PR$ and $SQ$ are diameters, so they meet at the centre $O$. We start with the parallel lines, then use the circle.'
        write: 'Solution'
      - say: '$PR$ cuts the parallel lines $PS$ and $RT$. Angles $SPR$ and $PRT$ are between the parallels, on the same side of $PR$, so they are co-interior angles. They add up to 180.'
        write: '$\angle SPR + \angle PRT = 180^{\circ}$ (co-int. $\angle$s, $PS \parallel RT$)'
        point:
          - {figure: 0, kind: highlight, target: PS, text: 'parallel'}
          - {figure: 0, kind: highlight, target: RT, text: 'parallel'}
      - say: 'Put in the 135 degrees, and take it to the other side, giving 180 minus 135.'
        write: '$\angle SPR = 180^{\circ} - 135^{\circ}$'
      - say: '180 minus 135 is 45 degrees. That is the angle at $P$.'
        write: '$\angle SPR = 45^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: SPR, text: '45°'}
      - say: 'Now the circle. $OP$ and $OS$ are both radii, so they are equal. That makes triangle $OPS$ isosceles.'
        write: '$OP = OS$ (radii)'
        point:
          - {figure: 0, kind: highlight, target: OP, text: 'r'}
          - {figure: 0, kind: highlight, target: OS, text: 'r'}
      - say: 'Its base angles, at $P$ and $S$, are equal, as base angles of an isosceles triangle. Angle $OPS$ is the 45 degrees we found, since $O$ is on $PR$.'
        write: '$\angle OSP = \angle OPS = 45^{\circ}$ (base $\angle$s of isos. $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: OSP, text: '45°'}
      - say: '$O$ lies on the diameter $SQ$, so angle $OSP$ is the same angle as $PSQ$.'
        write: '$\angle PSQ = \angle OSP = 45^{\circ}$ ($O$ on $SQ$)'
        point:
          - {figure: 0, kind: arc, target: PSQ, text: '45°'}
      - section: 'Check'
        say: 'Check by the angle at the centre. Angle $SOR$ stands on the arc $SR$, like angle $SPR$, so it is twice 45, because the angle at centre is twice the angle at circumference.'
        write: '$\angle SOR = 2 \times 45^{\circ} = 90^{\circ}$ ($\angle$ at centre $= 2 \times \angle$ at circumference)'
        point:
          - {figure: 0, kind: arc, target: SOR, text: '90°'}
      - say: 'Angle $POQ$ is vertically opposite angle $SOR$, so it is also 90 degrees.'
        write: '$\angle POQ = \angle SOR = 90^{\circ}$ (vert. opp. $\angle$s)'
        point:
          - {figure: 0, kind: arc, target: POQ, text: '90°'}
      - say: 'Angle $PSQ$ stands on the arc $PQ$, at the circumference, so it is half of 90. Half of 90 is 45, as before.'
        write: '$\angle PSQ = \tfrac{1}{2} \times 90^{\circ} = 45^{\circ}\ \checkmark$'
      - say: 'Therefore angle $PSQ$ is 45 degrees, option B.'
        write: '$\therefore \angle PSQ = 45^{\circ}$ (B)'
        answer: true
        point:
          - {figure: 0, kind: arc, target: PSQ, text: '45°'}
    traps:
      A: 'You went for 67 and a half degrees. That is half of 135. Use the parallel lines first. Co-interior angles give angle $SPR$ as 45, and the radii then give angle $PSQ$ as 45.'
      C: 'You went for 90 degrees. That is angle $PSR$, the angle in a semicircle, or the centre angle $POQ$. Angle $PSQ$ is a base angle of the isosceles triangle $OPS$, 45 degrees.'
      D: 'You went for 33 and three quarter degrees. That is a quarter of 135. Co-interior angles give 45 at $P$, and the isosceles triangle $OPS$ gives the same 45 at $S$.'
      E: 'You went for 22 and a half degrees. That halves 45 once too often. Triangle $OPS$ is isosceles, so the angle at $S$ equals the angle at $P$, 45.'
  47:
    moments:
      - section: 'The question'
        say: 'The foot of the perpendicular, $W$, is not the middle of $YZ$. That is the trap here. Pythagoras twice, one right-angled triangle at a time, gives $XY$.'
        write: '$XZ = 5$, $WZ = 4$, $YZ = 10$ (cm), $XY = ?$'
        point:
          - {figure: 0, kind: highlight, target: XW, text: '⊥ YZ'}
          - {figure: 0, kind: highlight, target: XY, text: '?'}
      - section: 'Solution'
        say: 'Solution. $XW$ is perpendicular to $YZ$, so it cuts the big triangle into two right-angled triangles, $XWZ$ and $XWY$. They share the side $XW$.'
        write: 'Solution'
        point:
          - {figure: 0, kind: arc, target: XWZ, text: '90°'}
      - say: 'Start with triangle $XWZ$. $XZ$ faces the right angle at $W$, so it is the hypotenuse, and we use Pythagoras.'
        write: 'In $\triangle XWZ$: $|XZ|^{2} = |XW|^{2} + |WZ|^{2}$ (Pythagoras)'
        point:
          - {figure: 0, kind: highlight, target: XZ, text: '5 cm'}
          - {figure: 0, kind: highlight, target: WZ, text: '4 cm'}
      - say: 'Put in $XZ$ equals 5 and $WZ$ equals 4.'
        write: '$5^{2} = |XW|^{2} + 4^{2}$'
      - say: '5 squared is 25 and 4 squared is 16.'
        write: '$25 = |XW|^{2} + 16$'
      - say: 'Take 16 to the other side. 25 minus 16 is 9.'
        write: '$|XW|^{2} = 25 - 16 = 9$'
      - say: 'The square root of 9 is 3. So $XW$ is 3 centimetres.'
        write: '$|XW| = \sqrt{9} = 3$ cm'
        point:
          - {figure: 0, kind: label, target: XW, text: '3 cm'}
      - say: 'Next, the rest of the base. $YW$ is $YZ$ minus $WZ$, so 10 minus 4 is 6.'
        write: '$|YW| = |YZ| - |WZ| = 10 - 4 = 6$ cm'
        point:
          - {figure: 0, kind: label, target: YW, text: '6 cm'}
      - say: 'Now triangle $XWY$, also right-angled at $W$. $XY$ faces the right angle, so it is the hypotenuse. Pythagoras again.'
        write: 'In $\triangle XWY$: $|XY|^{2} = |XW|^{2} + |YW|^{2}$ (Pythagoras)'
        point:
          - {figure: 0, kind: highlight, target: XY, text: 'hypotenuse'}
      - say: 'Put in the 3 and the 6 we found. 3 squared is 9, and 6 squared is 36.'
        write: '$|XY|^{2} = 3^{2} + 6^{2} = 9 + 36$'
      - say: '9 plus 36 is 45.'
        write: '$|XY|^{2} = 45$'
      - say: 'Take the square root. 45 is 9 times 5, and the square root of 9 is 3. So we get 3 root 5.'
        write: '$|XY| = \sqrt{45} = \sqrt{9 \times 5} = 3\sqrt{5}$'
        point:
          - {figure: 0, kind: label, target: XY, text: '3√5 cm'}
      - section: 'Check'
        say: 'Check by squaring back. 3 root 5 squared is 9 times 5, which is 45. And 6 squared plus 3 squared is 36 plus 9, also 45.'
        write: '$(3\sqrt{5})^{2} = 45 = 6^{2} + 3^{2}\ \checkmark$'
      - say: 'Therefore $XY$ is 3 root 5 centimetres, option B.'
        write: '$\therefore |XY| = 3\sqrt{5}$ cm (B)'
        answer: true
    traps:
      A: 'You went for 5 root 3 cm. The numbers are swapped. $XY$ squared is 45, which is 9 times 5, so $XY$ is 3 root 5. 5 root 3 would need 75.'
      C: 'You went for 3 root 3 cm. That would need $XY$ squared to be 27. With $YW$ equal to 6 and $XW$ equal to 3, $XY$ squared is 36 plus 9, which is 45.'
      D: 'You went for 5 cm. That assumes $XY$ equals $XZ$, as if $W$ were the middle of $YZ$. But $W$ is 6 cm from $Y$ and only 4 cm from $Z$.'
      E: 'You went for 6 cm. That is $YW$, part of the base. $XY$ is the slanting side, the hypotenuse of triangle $XWY$, so it is the square root of 36 plus 9, which is 3 root 5.'
  48:
    moments:
      - section: 'The question'
        say: 'Twenty copper spheres have their diameters grouped into classes. We want the mean diameter. Picture each sphere measured across its middle. Table first.'
        write: 'Mean diameter $= ?$'
        doodle: {name: 'custom:1984_q48_a', id: spheres, caption: 'measuring 20 copper spheres', size: scene, 'on': 'Picture'}
        diagram:
          id: t
          kind: table
          columns: ['Class boundaries', 'Class mark (x)', 'f', 'fx']
          rows: [['3.35 – 3.45', '', 3, ''], ['3.45 – 3.55', '', 6, ''], ['3.55 – 3.65', '', 7, ''], ['3.65 – 3.75', '', 4, '']]
          'on': 'Table'
      - section: 'Solution'
        say: 'Solution. For grouped data, $x$ is the class mark, the middle of the class. Each class mark is multiplied by its frequency, so we add the $x$ and $fx$ columns.'
        write: 'Solution. $\bar{x} = \dfrac{\sum fx}{\sum f}$'
      - section: 'The class marks'
        say: 'The class mark is half of lower boundary plus upper boundary. 3.35 plus 3.45 is 6.80, and half of it is 3.40. In the same way, we get 3.50 and 3.60.'
        write: 'Class mark $= \dfrac{3.35 + 3.45}{2} = 3.40$, and so on'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,2', text: '3.40'}
          - {id: t, op: fill, part: 'cell:2,2', text: '3.50'}
          - {id: t, op: fill, part: 'cell:3,2', text: '3.60'}
      - say: 'The last class mark is 3.70. Sort the spheres into four trays, one for each class mark.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,2', text: '3.70'}
        doodle_do:
          - {id: spheres, op: stage, stage: 'custom:1984_q48_a2', 'on': 'trays'}
      - section: 'The mean'
        say: 'The $fx$ column is each class mark times its frequency. 3.40 times 3 is 10.2. 3.50 times 6 is 21. 3.60 times 7 is 25.2.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,4', text: '10.2'}
          - {id: t, op: fill, part: 'cell:2,4', text: '21'}
          - {id: t, op: fill, part: 'cell:3,4', text: '25.2'}
      - say: '3.70 times 4 is 14.8. Add down the $f$ column, and 3 plus 6 plus 7 plus 4 is 20, the twenty spheres.'
        write: '$\sum f = 20$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,4', text: '14.8'}
          - {id: t, op: total, part: 'col:3', 'on': 'Add'}
        doodle_do:
          - {id: spheres, op: label, part: tray, text: '3 + 6 + 7 + 4 = 20'}
      - say: 'Add down the $fx$ column. 10.2 plus 21 is 31.2, plus 25.2 is 56.4, plus 14.8 is 71.2.'
        write: '$\sum fx = 71.2$'
        diagram_do:
          - {id: t, op: total, part: 'col:4', text: '71.2', 'on': 'Add'}
      - say: 'Substitute into the formula, giving 71.2 over 20.'
        write: '$\bar{x} = \dfrac{71.2}{20}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '71.2'}, at: '20[[71.2]]', text: 'Σfx'}
          - {line: 7, kind: move, from: {line: 5, at: '20'}, at: '[[20]]71.2', text: 'Σf'}
      - say: '71.2 divided by 20 is 3.56. The mean diameter is 3.56 centimetres.'
        write: '$\therefore \bar{x} = 3.56$ cm'
        doodle_do:
          - {id: spheres, op: label, part: cal, text: '3.56 cm'}
      - section: 'Check'
        say: 'Check with an assumed mean of 3.60. The deviations times $f$ are minus 0.6, minus 0.6, 0 and 0.4, which add to minus 0.8. Minus 0.8 over 20 is minus 0.04, and 3.60 minus 0.04 is 3.56.'
        write: 'Check: $A = 3.60$: $\ 3.60 + \dfrac{-0.8}{20} = 3.60 - 0.04 = 3.56$ ✓'
      - section: 'Answer'
        say: 'So the mean diameter is 3.56 cm, which is option C.'
        write: '$\therefore$ Mean diameter $= 3.56$ cm'
        answer: true
    traps:
      A: 'You went for 3.40 cm. That is the class mark of the first class only. The mean weights every class mark by its frequency, and 71.2 over 20 is 3.56.'
      B: 'You went for 3.58 cm. Check the $fx$ column and its sum. 10.2 plus 21 plus 25.2 plus 14.8 is 71.2, and 71.2 over 20 is 3.56.'
      D: 'You went for 3.62 cm. The mean sits near the classes with the most spheres, 3.50 and 3.60. The sum of $fx$ is 71.2, and 71.2 over 20 is 3.56.'
      E: 'You went for 3.63 cm. Use the class marks, 3.40 to 3.70, each times its frequency. That gives 71.2 over 20, which is 3.56.'
  49:
    moments:
      - section: 'The question'
        say: 'Every line here was built with ruler and compasses, and each one sits at a known angle from $OP$. Measure them all from $OP$, and $OU$ falls into place.'
        write: '$OT \perp OP$, $\angle SOP = 120^{\circ}$, obtuse $\angle UOP = ?$'
        point:
          - {figure: 0, kind: arc, target: UOP, text: '?'}
      - section: 'Solution'
        say: 'Solution. We measure every angle at $O$ from the same arm, $OP$, and give each line its reason.'
        write: 'Solution'
      - say: '$OT$ was built perpendicular to $OP$, by bisecting the straight angle at $O$. So angle $TOP$ is 90 degrees, by the construction.'
        write: '$\angle TOP = 90^{\circ}$ (construction, $OT \perp OP$)'
        point:
          - {figure: 0, kind: arc, target: TOP, text: '90°'}
      - say: '$S$ was built by stepping the same radius twice round the arc from $OP$, so 60 plus 60. So angle $SOP$ is 120 degrees.'
        write: '$\angle SOP = 120^{\circ}$ (construction, $60^{\circ} + 60^{\circ}$)'
        point:
          - {figure: 0, kind: arc, target: SOP, text: '120°'}
      - say: '$OT$ lies inside angle $SOP$. So angle $TOS$ is the big angle minus the small one.'
        write: '$\angle TOS = \angle SOP - \angle TOP$'
      - say: '120 minus 90 is 30 degrees.'
        write: '$\angle TOS = 120^{\circ} - 90^{\circ} = 30^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: TOS, text: '30°'}
      - say: '$U$ is on the bisector of angle $TOS$. To bisect means to cut into two equal halves. Half of 30 is 15.'
        write: '$\angle TOU = \tfrac{1}{2} \times 30^{\circ} = 15^{\circ}$ ($OU$ bisects $\angle TOS$)'
        point:
          - {figure: 0, kind: arc, target: TOU, text: '15°'}
      - say: 'From $OP$, we turn 90 degrees to reach $OT$, then another 15 degrees to reach $OU$.'
        write: '$\angle UOP = \angle TOP + \angle TOU$'
      - say: '90 plus 15 is 105 degrees. This is how 105 degrees is constructed, as 90 plus 15.'
        write: '$\angle UOP = 90^{\circ} + 15^{\circ} = 105^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: UOP, text: '105°'}
      - section: 'Check'
        say: 'Check from the other side. Angle $UOS$ is the other half, also 15. So angle $UOP$ is 120 minus 15, which is 105 again.'
        write: '$\angle UOP = 120^{\circ} - 15^{\circ} = 105^{\circ}\ \checkmark$'
        point:
          - {figure: 0, kind: arc, target: UOS, text: '15°'}
      - say: 'And 105 is more than 90 but less than 180, so it is obtuse, as the question says.'
        write: '$90^{\circ} < 105^{\circ} < 180^{\circ}$ (obtuse) $\checkmark$'
      - say: 'Therefore the obtuse angle $UOP$ is 105 degrees, option D.'
        write: '$\therefore \angle UOP = 105^{\circ}$ (D)'
        answer: true
    traps:
      A: 'You went for 75 degrees. That is the acute angle on the other side of $OU$, 180 minus 105. The question asks for the obtuse angle with $OP$, which is 90 plus 15, or 105.'
      B: 'You went for 154 degrees. $OU$ lies between $OT$, at 90 degrees from $OP$, and $OS$, at 120. So the angle must be between 90 and 120, and 90 plus 15 is 105.'
      C: 'You went for 120 degrees. That is angle $SOP$, for $OS$. $U$ is on the bisector of angle $TOS$, 15 degrees past $OT$, so it is 90 plus 15, which is 105.'
      E: 'You went for 125 degrees. That is past $OS$, which is at 120. $OU$ bisects the 30 degrees between $OT$ and $OS$, so it is at 90 plus 15, which is 105.'
  50:
    moments:
      - section: 'The question'
        say: 'Build 60 degrees, then bisect it. That is one of the first constructions we learn. Read what the compasses did, and angle $VOP$ follows.'
        write: '$OV$ bisects $\angle ROP$, acute $\angle VOP = ?$'
        point:
          - {figure: 0, kind: arc, target: VOP, text: '?'}
      - section: 'Solution'
        say: 'Solution. First we see how the angle at $R$ was built, then we cut it in half.'
        write: 'Solution'
      - say: 'With centre $O$, an arc was drawn to cut $OP$. With the same radius, from that point, a second arc cut the first one at $R$. Then $OR$ was joined.'
        write: 'Arc, centre $O$; same radius from the arc on $OP$ gives $R$'
        point:
          - {figure: 0, kind: circle, target: R, text: 'same radius'}
      - say: 'So $O$, $R$ and that point on $OP$ are all one radius apart, which makes an equilateral triangle. Each of its angles is 60 degrees.'
        write: '$\angle ROP = 60^{\circ}$ (construction: equilateral $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: ROP, text: '60°'}
      - say: '$V$ is on the bisector of angle $ROP$. To bisect means to cut into two equal halves.'
        write: '$\angle VOP = \tfrac{1}{2} \times \angle ROP$ ($OV$ bisects $\angle ROP$)'
        point:
          - {figure: 0, kind: highlight, target: OV, text: 'bisector'}
      - say: 'Put in the 60 degrees. Half of 60 is 30.'
        write: '$\angle VOP = \tfrac{1}{2} \times 60^{\circ} = 30^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: VOP, text: '30°'}
      - section: 'Check'
        say: 'Check. The other half, angle $ROV$, is also 30. 30 plus 30 gives back the 60 degrees at $R$. And 30 is less than 90, so it is acute, as asked.'
        write: '$30^{\circ} + 30^{\circ} = 60^{\circ} = \angle ROP\ \checkmark$'
        point:
          - {figure: 0, kind: arc, target: ROV, text: '30°'}
      - say: 'Therefore the acute angle $VOP$ is 30 degrees, option B. This is how we construct 30 degrees. We build 60, then bisect it.'
        write: '$\therefore \angle VOP = 30^{\circ}$ (B)'
        answer: true
    traps:
      A: 'You went for 60 degrees. That is angle $ROP$, before it is bisected. $V$ is on the bisector, so the angle is half of 60, which is 30.'
      C: 'You went for 45 degrees. That comes from bisecting a right angle. Here the angle bisected is $ROP$, which is 60, giving 30.'
      D: 'You went for 90 degrees. That is angle $TOP$, and it is not acute. $OV$ bisects the 60 degree angle, so angle $VOP$ is 30.'
      E: 'You went for 15 degrees. That halves the angle twice. Angle $ROP$ is 60, and bisecting it once gives 30.'
