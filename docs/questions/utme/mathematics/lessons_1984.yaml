          - {line: 8, kind: move, from: {line: 7, at: '=54×3n−1'}, at: '54×3n−1', text: 'bottom'}
      - say: 'Divide the top and bottom by 2. 2 over 2 is 1, and 54 over 2 is 27.'
        write: '$= \dfrac{1}{27}$'
      - say: 'A quick test with $n$ equals 1. The top is 3 minus 1, which is 2. The bottom is 27 times 3, which is 81, minus 27 times 1, which gives 54. And 2 over 54 is 1 over 27.'
        write: 'Check $n = 1$: $\ \dfrac{3 - 1}{27 \times 3 - 27 \times 1} = \dfrac{2}{54} = \dfrac{1}{27}$'
      - say: 'So the fraction simplifies to 1 over 27, which is answer choice C.'
        write: 'Answer: $\ \dfrac{1}{27}$'
        answer: true
    traps:
      A: 'You went for 1. The top and bottom aren''t equal. The top is 2 lots of 3 to the $n$ minus 1 and the bottom is 54 lots, so the fraction is 2 over 54, which is 1 over 27.'
      B: 'You went for 0. The top isn''t zero: 3 to the $n$ minus 3 to the $n$ minus 1 is 2 lots of 3 to the $n$ minus 1. Over 54 lots on the bottom, that''s 1 over 27.'
      D: 'You went for 3 to the $n$ minus 3 to the $n$ minus 1. That''s just the top again. The bottom is 54 times 3 to the $n$ minus 1, and dividing gives 1 over 27.'
      E: 'You went for 2 over 27. The bottom is 54 lots, not 27 lots, because 27 times 3 to the $n$ is 81 lots of 3 to the $n$ minus 1. So the fraction is 2 over 54, which is 1 over 27.'
  15:
    moments:
      - say: '$p$ varies directly as the square of $q$ and inversely as $r$. We know one set of values, and we want $p$ for new ones. First, turn the words into an equation.'
        write: 'Given: $\ p = 36$ when $q = 3,\ r = 4$'
      - say: '"Directly as $q$ squared" puts $q$ squared on top. "Inversely as $r$" puts $r$ on the bottom. And $k$ is a constant we must find.'
        write: '$p = \dfrac{kq^{2}}{r}$'
      - say: 'To find $k$, put in the first set of values: $p$ is 36, $q$ is 3 and $r$ is 4.'
        write: '$36 = \dfrac{k \times 3^{2}}{4}$'
        point:
          - {line: 2, kind: move, from: {line: 0, at: 'p=[[36]]'}, at: '[[36]]=', text: 'p'}
          - {line: 2, kind: move, from: {line: 0, at: 'q=[[3]]'}, at: '×[[3]]2', text: 'q'}
          - {line: 2, kind: move, from: {line: 0, at: 'r=[[4]]'}, at: '[[4]]k', text: 'r'}
      - say: '3 squared is 9, so 36 equals $9k$ over 4.'
        write: '$36 = \dfrac{9k}{4}$'
      - say: 'Multiply both sides by 4. 36 times 4 is 144.'
        write: '$144 = 9k$'
      - say: 'Divide both sides by 9. 144 divided by 9 is 16.'
        write: '$k = \dfrac{144}{9} = 16$'
      - say: 'Now put that $k$ back into the rule.'
        write: 'So $\ p = \dfrac{16q^{2}}{r}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '=16'}, at: '16', text: 'k'}
      - say: 'Now use the new values, $q$ equals 5 and $r$ equals 2.'
        write: '$p = \dfrac{16 \times 5^{2}}{2}$'
