          - {figure: 0, kind: arc, target: MYN, text: 'y'}
          - {figure: 0, kind: arc, target: MNQ, text: '86°'}
      - say: 'So $y$ is 180 minus 58 minus 86. 58 plus 86 is 144, and 180 minus 144 is 36.'
        write: '$y = 180^{\circ} - 58^{\circ} - 86^{\circ} = 180^{\circ} - 144^{\circ} = 36^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: MYN, text: 'y = 36°'}
      - say: 'So $x$ is 28 degrees and $y$ is 36 degrees, which is answer choice A.'
        write: '$(x, y) = (28^{\circ},\ 36^{\circ})$'
        answer: true
    traps:
      B: 'You went for 36 and 28. Those are the right angles in the wrong order. X is where MN and PQ meet, giving 28 degrees; Y is where NQ and MP meet, giving 36 degrees.'
      C: 'You went for 43 and 61. Those are half of 86 and half of 122. Use opposite angles of the cyclic quadrilateral instead: 94 at P and 58 at M, then the triangle angle sums.'
      D: 'You went for 61 and 43, half of each given angle. The opposite angles give 58 at M and 94 at P, so x is 28 and y is 36.'
      E: 'You went for 36 and 43. The 36 belongs to y, not x. In triangle MXP, 180 minus 58 minus 94 gives x equals 28.'
  38:
    moments:
      - say: 'Cos theta is root 3 over 2, and theta is less than 90 degrees. We want cot of 90 minus theta, over sin squared theta.'
        write: '$\cos\theta = \dfrac{\sqrt{3}}{2},\quad \dfrac{\cot(90^{\circ} - \theta)}{\sin^{2}\theta}$'
      - say: 'Picture the triangle with sides 1, root 3 and 2. First, find the angle. In the 30, 60, 90 triangle with sides 1, root 3 and 2, the side next to the 30 degree angle is root 3 and the hypotenuse is 2. So the acute angle whose cosine is root 3 over 2 is 30 degrees.'
        doodle: {name: 'custom:1985_q38_a', id: tri, caption: 'the 1, root 3, 2 triangle', size: scene}
        write: '$\cos 30^{\circ} = \dfrac{\sqrt{3}}{2} \Rightarrow \theta = 30^{\circ}$'
      - say: 'Now the top. Put theta equals 30: 90 minus 30 is 60, so we need cot 60 degrees. The top corner of the triangle is 60 degrees.'
        doodle_do: [{id: tri, op: label, part: theta, text: '30°'}, {id: tri, op: label, part: top, text: '60°'}]
        write: 'Top: $\cot(90^{\circ} - 30^{\circ}) = \cot 60^{\circ}$'
        point:
          - {line: 2, kind: move, from: {line: 1, at: 'θ=[[30∘]]'}, at: '−30∘', text: 'sub in'}
      - say: 'Complementary angles swap tan and cot. So cot 60 degrees equals tan 30 degrees, which is 1 over root 3.'
        write: '$\cot 60^{\circ} = \tan 30^{\circ} = \dfrac{1}{\sqrt{3}}$'
      - say: 'Now the bottom. Sin 30 degrees is a half: the opposite side 1, over the hypotenuse 2. Opposite side over hypotenuse, in the triangle.'
        doodle_do: [{id: tri, op: highlight, part: opp}, {id: tri, op: highlight, part: hyp}]
        write: 'Bottom: $\sin 30^{\circ} = \tfrac{1}{2}$'
      - say: 'Squared, a half times a half is a quarter.'
        write: '$\sin^{2}30^{\circ} = \tfrac{1}{2} \times \tfrac{1}{2} = \tfrac{1}{4}$'
      - say: 'Put the top and bottom we found back into the expression: 1 over root 3, divided by a quarter.'
        write: '$\dfrac{\cot 60^{\circ}}{\sin^{2}30^{\circ}} = \dfrac{1/\sqrt{3}}{1/4}$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '=31'}, at: '1/3', text: 'top'}
          - {line: 6, kind: move, from: {line: 5, at: '=41'}, at: '1/4', text: 'bottom'}
      - say: 'Dividing by a quarter is the same as multiplying by 4. That gives 4 over root 3.'
        write: '$= \dfrac{1}{\sqrt{3}} \times 4 = \dfrac{4}{\sqrt{3}}$'
      - say: 'Rationalise: multiply the top and bottom by root 3. Root 3 times root 3 is 3.'
        write: '$= \dfrac{4 \times \sqrt{3}}{\sqrt{3} \times \sqrt{3}} = \dfrac{4\sqrt{3}}{3}$'
      - say: 'So the value is 4 root 3 over 3, which is answer choice A.'
        write: '$\dfrac{\cot(90^{\circ} - \theta)}{\sin^{2}\theta} = \dfrac{4\sqrt{3}}{3}$'
        answer: true
    traps:
      B: 'You went for 4 root 3. That uses tan 60, which is root 3, on top. But cot 60 is 1 over root 3, giving 4 over root 3, which is 4 root 3 over 3.'
      C: 'You went for root 3 over 2. That is just cos theta, the value we were given. Work out cot 60 over sin squared 30: that is 4 root 3 over 3.'
      D: 'You went for 1 over root 3. That is the top only. Dividing by sin squared 30, a quarter, multiplies it by 4.'
      E: 'You went for 2 over root 3. That divides by sin 30, a half, instead of sin squared 30, a quarter. Dividing by a quarter gives 4 over root 3.'
  39:
