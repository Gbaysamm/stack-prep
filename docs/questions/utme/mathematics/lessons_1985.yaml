  41:
    moments:
      - section: 'The question'
        say: '$GHIJKLMN$ is a cube of side $a$, and $HN$ runs right through it, from a bottom corner to the opposite top corner. Pythagoras twice will give it.'
        write: 'Cube of side $a$; $|HN| = ?$'
        point:
          - {figure: 0, kind: highlight, target: HN, text: '|HN| = ?'}
          - {figure: 0, kind: circle, target: a, text: 'side a'}
      - section: 'Solution'
        say: 'Solution. First go across the floor. On the base $GHIJ$, the angle at $G$ is a right angle, so triangle $HGJ$ is right-angled at $G$.'
        write: 'Solution. In $\triangle HGJ$, $\angle G = 90^{\circ}$'
        point:
          - {figure: 0, kind: highlight, target: HJ, text: 'across the floor'}
      - say: 'Pythagoras: the square on $HJ$ equals the sum of the squares on the two edges. Each edge is $a$.'
        write: '$|HJ|^{2} = |HG|^{2} + |GJ|^{2}$ (Pythagoras)'
      - say: 'Substitute $a$ for each edge. $a$ squared plus $a$ squared is $2a$ squared.'
        write: '$|HJ|^{2} = a^{2} + a^{2} = 2a^{2}$'
      - say: 'Take the square root of both sides. The square root of $2a$ squared is $a$ root 2.'
        write: '$|HJ| = \sqrt{2a^{2}} = a\sqrt{2}$'
        point:
          - {figure: 0, kind: label, target: HJ, text: 'a√2'}
      - section: 'Up to N'
        say: 'Now go up. $N$ is directly above $J$, a height $a$ away, and $HJ$ lies flat on the floor. So triangle $HJN$ is right-angled at $J$.'
        write: 'In $\triangle HJN$, $\angle J = 90^{\circ}$'
        point:
          - {figure: 0, kind: highlight, target: JN, text: 'up, a'}
      - say: 'Pythagoras again: the square on $HN$ equals the square on $HJ$ plus the square on $JN$.'
        write: '$|HN|^{2} = |HJ|^{2} + |JN|^{2}$ (Pythagoras)'
      - say: 'Substitute: $HJ$ is $a$ root 2, and $JN$ is $a$.'
        write: '$|HN|^{2} = (a\sqrt{2})^{2} + a^{2}$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '=a2'}, at: '(a2)', text: '|HJ|'}
      - say: '$a$ root 2, squared, is $a$ squared times 2, which is $2a$ squared. Add $a$ squared: $3a$ squared.'
        write: '$= 2a^{2} + a^{2} = 3a^{2}$'
      - say: 'Take the square root. The square root of 3 times $a$ squared is root 3 times $a$.'
        write: '$|HN| = \sqrt{3a^{2}} = a\sqrt{3}$'
        point:
          - {figure: 0, kind: label, target: HN, text: 'a√3'}
      - section: 'Check'
        say: 'Check with the diagonal of a cuboid: the square root of length squared, plus breadth squared, plus height squared. For a cube, all three are $a$.'
        write: 'Check: $\sqrt{a^{2} + a^{2} + a^{2}} = \sqrt{3a^{2}} = a\sqrt{3}$ ✓'
      - section: 'Answer'
        say: 'Therefore $HN$ is $a$ root 3, which is answer choice E.'
        write: '$\therefore |HN| = a\sqrt{3}$ (E)'
        answer: true
    traps:
      A: 'You went for 3 root $a$. The root belongs over the 3, not the $a$: the square root of $3a^{2}$ is $a$ root 3.'
      B: 'You went for $3a$. That adds three edges, as if you walked along them. The straight line through the cube is shorter: the square root of $3a^{2}$, which is $a$ root 3.'
      C: 'You went for $3a^{2}$. That is $|HN|^{2}$. Take the square root to get the length: $a$ root 3.'
      D: 'You went for $a$ root 2. That is $HJ$, the diagonal across the floor. Go up by $a$ as well: the square root of $2a^{2}$ plus $a^{2}$ is $a$ root 3.'
  42:
    moments:
      - section: 'The question'
        say: 'The area of the trapezium is given for a reason: it hides the height. Triangle $SQR$ shares that same height.'
        write: '$PQ \parallel SR$, $PQ = 4$, $SR = 3$, area $= 14$'
      - section: 'Solution'
        say: 'Solution. Let me draw the trapezium $PQRS$, with $PQ$ parallel to $SR$, and the diagonal $SQ$ that cuts off triangle $SQR$.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '14 cm²', text: 'area'}
      - say: 'The area of a trapezium is half the sum of the parallel sides, times the height $h$ between them.'
        write: 'Area $= \tfrac{1}{2}(a + b)h$'
        point:
          - {figure: sketch, kind: highlight, target: PQ, text: 'a = 4'}
          - {figure: sketch, kind: highlight, target: SR, text: 'b = 3'}
      - say: 'Substitute: the area is 14, and the parallel sides are 4 and 3.'
        write: '$14 = \tfrac{1}{2}(4 + 3)h$'
      - say: '4 plus 3 is 7, and a half of 7 is 7 over 2.'
        write: '$14 = \tfrac{7}{2}h$'
      - say: 'Multiply both sides by 2 over 7. 14 times 2 is 28, and 28 over 7 is 4.'
        write: '$h = 14 \times \dfrac{2}{7} = 4$ cm'
        point:
          - {figure: sketch, kind: label, target: h, text: '4 cm'}
      - say: 'Triangle $SQR$ has base $SR$. Its third corner, $Q$, is on the other parallel side, so its height is the same $h$.'
        write: 'Area of $\triangle SQR = \tfrac{1}{2} \times |SR| \times h$'
        point:
          - {figure: sketch, kind: highlight, target: SR, text: 'base'}
      - say: 'Substitute: $SR$ is 3 and $h$ is 4.'
        write: '$= \tfrac{1}{2} \times 3 \times 4$'
      - say: '3 times 4 is 12, and half of 12 is 6.'
        write: '$= 6\ \text{cm}^{2}$'
      - section: 'Check'
        say: 'Check. The diagonal $SQ$ cuts the trapezium into two triangles. The other one, $PQS$, has base $PQ$, which is 4, and the same height, 4.'
        write: 'Area of $\triangle PQS = \tfrac{1}{2} \times 4 \times 4 = 8\ \text{cm}^{2}$'
        point:
          - {figure: sketch, kind: highlight, target: PQ, text: 'base 4'}
      - say: 'The two triangles together make the whole trapezium: 6 plus 8 is 14.'
        write: '$6 + 8 = 14\ \checkmark$'
      - say: 'Therefore the area of triangle $SQR$ is 6.0 square centimetres, option B.'
        write: '$\therefore$ Area of $\triangle SQR = 6.0\ \text{cm}^{2}$ (B)'
        answer: true
    traps:
      A: 'You went for 7.0, half the trapezium. The diagonal does not cut it into two equal parts: the two triangles share the height 4 but have bases 3 and 4. So $SQR$ is 6.'
      C: 'You went for 5.2. First find the height from the trapezium: 14 equals 7 over 2 times $h$, so $h$ is 4. Then half of 3 times 4 is 6.'
      D: 'You went for 5.0. The height is 4, from 14 equals 7 over 2 times $h$. The triangle''s area is half of 3 times 4, which is 6.'
      E: 'You went for 4.1. The triangle has base $SR$, 3, and the same height as the trapezium, 4. Half of 3 times 4 is 6.'
  43:
    moments:
      - section: 'The question'
        say: 'A tangent and a diameter. The angle in a semicircle and the alternate segment theorem, tied together by one triangle, give a relation between theta and phi.'
        write: '$\angle QPR = \theta$, $\angle PQR = \phi$, relation $= ?$'
        point:
          - {figure: 0, kind: arc, target: QPR, text: 'θ'}
          - {figure: 0, kind: arc, target: PQR, text: 'φ'}
      - section: 'Solution'
        say: 'Solution. First, join $Q$ to $S$. That gives the big triangle $SQP$, with theta at $P$.'
        write: 'Join $QS$'
        point:
          - {figure: 0, kind: highlight, target: QS, text: 'join QS'}
      - say: '$SR$ is a diameter, so the angle it makes at $Q$, on the circle, is a right angle. Reason: angle in a semicircle.'
        write: '$\angle SQR = 90^{\circ}$ ($\angle$ in a semicircle)'
        point:
          - {figure: 0, kind: arc, target: SQR, text: '90°'}
      - say: 'The angle between the tangent $QP$ and the chord $QR$ is phi. It equals the angle in the alternate segment, at $S$. Reason: the alternate segment theorem.'
        write: '$\angle QSR = \angle PQR = \phi$ (alt. segment theorem)'
        point:
          - {figure: 0, kind: arc, target: QSR, text: 'φ'}
      - say: 'At $Q$, the angle of triangle $SQP$ is the right angle $SQR$ plus the angle $RQP$, which is phi.'
        write: '$\angle SQP = 90^{\circ} + \phi$ ($\angle SQR + \angle RQP$)'
        point:
          - {figure: 0, kind: arc, target: SQP, text: '90° + φ'}
      - say: 'The three angles of triangle $SQP$ add up to 180: phi at $S$, theta at $P$, and 90 plus phi at $Q$.'
        write: '$\phi + \theta + (90^{\circ} + \phi) = 180^{\circ}$ ($\angle$ sum of $\triangle SQP$)'
      - say: 'Collect like terms: phi plus phi is 2 phi.'
        write: '$\theta + 2\phi + 90^{\circ} = 180^{\circ}$'
      - say: 'Take 90 to the other side. 180 minus 90 is 90.'
        write: '$\theta + 2\phi = 180^{\circ} - 90^{\circ} = 90^{\circ}$'
      - section: 'Check'
        say: 'Check by another triangle. In triangle $SQR$, the angles are 90 at $Q$ and phi at $S$, so the angle at $R$ is 90 minus phi.'
        write: '$\angle QRS = 90^{\circ} - \phi$ ($\angle$ sum of $\triangle SQR$)'
        point:
          - {figure: 0, kind: arc, target: QRS, text: '90° − φ'}
      - say: 'But angle $QRS$ is also the exterior angle of triangle $QRP$, so it equals the two opposite angles, theta plus phi.'
        write: '$\angle QRS = \theta + \phi$ (ext. $\angle$ of $\triangle QRP$)'
      - say: 'So theta plus phi equals 90 minus phi. Take phi across: theta plus 2 phi is 90, the same relation.'
        write: '$\theta + \phi = 90^{\circ} - \phi \Rightarrow \theta + 2\phi = 90^{\circ}\ \checkmark$'
      - say: 'Therefore theta plus 2 phi equals 90 degrees, option E.'
        write: '$\therefore \theta + 2\phi = 90^{\circ}$ (E)'
        answer: true
    traps:
      A: 'You went for theta plus phi equals 90. That misses one phi. In triangle $SQP$, phi appears twice: at $S$, and inside the angle at $Q$, which is 90 plus phi.'
      B: 'You went for phi equals 90 minus 2 theta. That is the right relation with theta and phi swapped. The 2 belongs with phi, because phi appears at $S$ and at $Q$.'
      C: 'You went for theta equals phi. That is true only in one special case, 30 and 30. The general relation, from the angle sum of the triangle, is theta plus 2 phi equals 90.'
      D: 'You went for phi equals 2 theta. Try theta equals 30: that makes phi 60, and then theta plus 2 phi is 150, not 90. The relation is theta plus 2 phi equals 90.'
  44:
    moments:
      - section: 'The question'
        say: 'A bag has 4 white balls and 6 red balls. Two are taken out without putting the first back. What is the probability that both are red? Picture the bag.'
        write: '4 white, 6 red; two taken without replacement'
        doodle: {name: 'custom:1985_q44_a', id: bag, caption: 'two drawn, the first not put back', size: scene}
      - say: 'Solution. Let $R_1$ be the event that the first ball is red, and $R_2$ that the second ball is red.'
        write: 'Solution: let $R_1$ = 1st red, $R_2$ = 2nd red'
      - say: 'The bag holds 4 plus 6, which is 10 balls.'
        write: 'Total $= 4 + 6 = 10$ balls'
      - section: 'The tree diagram'
        say: 'Draw the tree diagram. First ball: red 6 over 10, white 4 over 10. Without replacement, only 9 balls are left, so every second branch is over 9.'
        write: 'Without replacement: $10 - 1 = 9$ left'
        diagram:
          id: t
          kind: tree
          'on': 'tree diagram'
          levels: ['1st ball', '2nd ball']
          branches:
            - {label: Red, p: '6/10', then: [{label: Red, p: '5/9'}, {label: White, p: '4/9'}]}
            - {label: White, p: '4/10', then: [{label: Red, p: '6/9'}, {label: White, p: '3/9'}]}
      - say: 'First ball: 6 of the 10 balls are red, so P of $R_1$ is 6 over 10.'
        write: '$P(R_1) = \dfrac{6}{10}$'
        doodle_do:
          - {id: bag, op: highlight, part: reds}
        diagram_do:
          - {id: t, op: highlight, part: 'branch:Red'}
      - say: 'Watch the first red ball leave the bag. It is not put back, so 5 red are left out of 9. P of $R_2$ is 5 over 9.'
        write: '$P(R_2) = \dfrac{5}{9}$'
        doodle_do:
          - {id: bag, op: move, part: first, path: out}
          - {id: bag, op: label, part: reds, text: '5 red of 9'}
        diagram_do:
          - {id: t, op: highlight, part: 'branch:Red/Red'}
      - section: 'Multiply along the path'
        say: 'Both red means red and then red. The multiplication rule: multiply along the path. P of $R_1 R_2$ is P of $R_1$ times P of $R_2$.'
        write: '$P(R_1R_2) = P(R_1) \times P(R_2)$'
      - say: 'Substitute the two probabilities.'
        write: '$= \dfrac{6}{10} \times \dfrac{5}{9}$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '106'}, at: '[[106]]×', text: '1st red'}
          - {line: 7, kind: move, from: {line: 5, at: '95'}, at: '×[[95]]', text: '2nd red'}
        diagram_do:
          - {id: t, op: path, part: 'Red/Red'}
      - say: 'Multiply the tops and the bottoms. 6 times 5 is 30, and 10 times 9 is 90.'
        write: '$= \dfrac{6 \times 5}{10 \times 9} = \dfrac{30}{90}$'
      - say: '30 goes into 90 three times, so divide the top and the bottom by 30. That gives 1 over 3.'
        write: '$= \dfrac{1}{3}$'
      - section: 'Check'
        say: 'Check with combinations. Choosing 2 red from 6 is 6 C 2, which is 15. Choosing any 2 from 10 is 10 C 2, which is 45. And 15 over 45 is 1 over 3.'
        write: 'Check: $\dfrac{^{6}C_{2}}{^{10}C_{2}} = \dfrac{15}{45} = \dfrac{1}{3}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the probability that both balls are red is 1 over 3: option A.'
        write: '$\therefore P(\text{both red}) = \dfrac{1}{3}$'
        answer: true
    traps:
      B: 'You went for 2 over 9. Multiply along the path carefully: 6 over 10 times 5 over 9 is 30 over 90, which is 1 over 3.'
      C: 'You went for 2 over 15. That is the White, White path: 4 over 10 times 3 over 9. We want the Red, Red path: 6 over 10 times 5 over 9, which is 1 over 3.'
      D: 'You went for 1 over 5. Multiply along the Red, Red path: 6 times 5 is 30, and 10 times 9 is 90. 30 over 90 is 1 over 3.'
      E: 'You went for 3 over 5. That is only P of R1, the first ball red. The second must be red too, 5 over 9, so multiply: 1 over 3.'
  45:
    moments:
      - section: 'The question'
        say: 'Discs of diameter $2\sqrt{2}$ centimetres are cut in rows from a sheet $2^{18}\sqrt{2}$ long and $4\sqrt{2}$ wide. We want how many discs.'
        write: 'Number of discs $= ?$'
      - section: 'Solution'
        say: 'Solution. Let me draw the sheet with the discs cut along it in rows, and write the givens.'
        write: 'Solution. $d = 2\sqrt{2},\ \ l = 2^{18}\sqrt{2},\ \ w = 4\sqrt{2}$ (cm)'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '2√2 cm', text: 'd'}
          - {figure: sketch, kind: circle, target: '2¹⁸√2 cm', text: 'l'}
          - {figure: sketch, kind: circle, target: '4√2 cm', text: 'w'}
      - say: 'In straight rows, each disc takes up a square of card whose side is the diameter. So count how many diameters fit along the length, and how many across the width.'
        write: 'Number of discs $=$ number along $\times$ number across'
      - section: 'Along the length'
        say: 'Along the length: divide the length by the diameter.'
        write: 'Number along $= \dfrac{l}{d} = \dfrac{2^{18}\sqrt{2}}{2\sqrt{2}}$'
        point:
          - {figure: sketch, kind: underline, target: '2¹⁸√2 cm', text: 'length'}
      - say: 'Root 2 on top cancels root 2 below. Then divide powers of the same base by subtracting the indices: 18 minus 1 is 17.'
        write: '$= \dfrac{2^{18}}{2^{1}} = 2^{18 - 1} = 2^{17}$ $\quad [a^{m} \div a^{n} = a^{m - n}]$'
      - section: 'Across the width'
        say: 'Across the width: $4\sqrt{2}$ divided by $2\sqrt{2}$. Root 2 cancels, and 4 over 2 is 2. So there are 2 rows.'
        write: 'Number across $= \dfrac{w}{d} = \dfrac{4\sqrt{2}}{2\sqrt{2}} = 2$'
        point:
          - {figure: sketch, kind: underline, target: '4√2 cm', text: 'width'}
      - section: 'Total'
        say: 'Multiply: 2 rows, each with 2 to the 17 discs.'
        write: 'Number of discs $= 2^{17} \times 2$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '=[[217]]'}, at: '[[217]]×', text: 'along'}
          - {line: 6, kind: move, from: {line: 5, at: '[[=2]]'}, at: '×[[2]]', text: 'across'}
      - say: 'Multiply powers of the same base by adding the indices: 17 plus 1 is 18.'
        write: '$= 2^{17 + 1} = 2^{18}$ $\quad [a^{m} \times a^{n} = a^{m + n}]$'
      - say: 'The options use base 4. 4 is 2 squared, and a power of a power multiplies the indices, so 4 to the 9 is 2 to the 18.'
        write: '$4^{9} = (2^{2})^{9} = 2^{18}$ $\quad [(a^{m})^{n} = a^{mn}]$'
      - section: 'Check'
        say: 'Check: 2 to the 17 discs in a row, each $2\sqrt{2}$ wide, cover 2 to the 18 root 2 centimetres, the whole length.'
        write: 'Check: $2^{17} \times 2\sqrt{2} = 2^{18}\sqrt{2} = l$ ✓'
      - section: 'Answer'
        say: 'Therefore the number of discs is 4 to the 9, which is answer choice A.'
        write: '$\therefore$ number of discs $= 2^{18} = 4^{9}$ (A)'
        answer: true
        point:
          - {figure: sketch, kind: label, target: 'how many discs?', text: '4⁹'}
    traps:
      B: 'You went for 2 to the 19. That is twice too many: it divides the length by root 2 alone and forgets the 2 in the diameter. Divide by the whole diameter, $2\sqrt{2}$.'
      C: 'You went for 2 to the 17 times (root 2 plus 2). The root 2s cancel completely when you divide by the diameter, so the answer is a whole power of 2: 2 to the 18.'
      D: 'You went for 2 to the 10 times (1 plus root 2). That is far too few. Along the length alone, 2 to the 17 discs fit, and there are 2 rows.'
      E: 'You went for 2 to the 9 times (root 2 plus 1). The root 2 cancels when you divide by the diameter. The count is 2 to the 17 times 2, which is 4 to the 9.'
  46:
    moments:
      - section: 'The question'
        say: 'Two towns sit on the same circle of latitude, 60 degrees south, one at 147 east and one at 153 west. How far apart are they along that circle?'
        write: 'Find $|XY|$ along the parallel of latitude $60^{\circ}$S.'
      - say: 'Write Solution, then sketch the parallel of latitude 60 degrees south, seen from above the South Pole, with X and Y on it.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '147°E', 'on': 'with X'}
          - {figure: sketch, kind: circle, target: '153°W', 'on': 'and Y'}
      - section: 'What we know'
        say: 'List the givens: latitude alpha is 60 degrees, X is at 147 east, Y is at 153 west, and 2 pi R is 4 times 10 to the power 4 kilometres.'
        write: '$\alpha = 60^{\circ}$, $X$: $147^{\circ}$E, $Y$: $153^{\circ}$W, $2\pi R = 4 \times 10^{4}$ km'
      - section: 'The angle'
        say: 'Find theta, the difference in longitude. East and west are on opposite sides of Greenwich, so we add.'
        write: '$147^{\circ} + 153^{\circ} = 300^{\circ}$ (E and W: add)'
      - say: '300 degrees is the long way round, past Greenwich. The short way, across the 180 degree line, is 360 minus 300, which is 60 degrees.'
        write: '$\theta = 360^{\circ} - 300^{\circ} = 60^{\circ}$'
        point:
          - {figure: sketch, kind: circle, target: '180°', text: 'short way', 'on': 'across the 180'}
          - {figure: sketch, kind: label, target: '?', text: '60°', 'on': '60 degrees'}
      - section: 'The formula'
        say: 'The points are on a small circle, a parallel of latitude, whose radius is R cos alpha. So the distance is theta over 360, times 2 pi R cos alpha.'
        write: '$|XY| = \dfrac{\theta}{360} \times 2\pi R\cos\alpha$'
        point:
          - {figure: sketch, kind: circle, target: 'r = R cos 60°', text: 'small circle', 'on': 'R cos alpha'}
      - section: 'Substitute'
        say: 'Substitute: theta is 60, 2 pi R is 40,000, and alpha is 60 degrees.'
        write: '$|XY| = \dfrac{60}{360} \times 40000 \times \cos 60^{\circ}$'
      - section: 'Simplify'
        say: '60 over 360 is 1 over 6, and cos 60 degrees is a half.'
        write: '$= \dfrac{1}{6} \times 40000 \times \dfrac{1}{2}$'
      - say: 'Half of 40,000 is 20,000, so this is 20,000 over 6.'
        write: '$= \dfrac{20000}{6} = 3333.3$'
      - say: 'Therefore, to the nearest kilometre, the distance is 3,333 kilometres.'
        write: '$\therefore |XY| \approx 3333$ km'
        point:
          - {figure: sketch, kind: arc, target: XY, text: '3333 km', 'on': 'Therefore'}
      - section: 'Check'
        say: 'Check: the circle of latitude is 20,000 km round. 60 degrees is 1 sixth of the circle, and 6 times 3,333.3 is 20,000.'
        write: 'Check: $6 \times 3333.3 \approx 20000 = 40000 \times \cos 60^{\circ}$ ✓'
      - section: 'Answer'
        say: 'So the distance is 3,333 kilometres, which is answer choice E.'
        write: '$\therefore |XY| = 3333$ km (E)'
        answer: true
    traps:
      A: 'You went for 28,850 km. That is far too long for a short arc. The points are only 60 degrees apart, and the circle of latitude is 20,000 km round, so the distance is 1 over 6 of that.'
      B: 'You went for 16,667 km. That uses 300 degrees, the long way round. The short way across the 180 degree line is 360 minus 300, which is 60 degrees.'
      C: 'You went for 8,333 km. Theta is 60 degrees, 1 over 6 of the circle, and the parallel is 40,000 times cos 60, which is 20,000 km round. So the arc is 3,333 km.'
      D: 'You went for 6,667 km. That uses the full 40,000 km, the equator. At latitude 60 the circle is smaller: multiply by cos 60, a half, to get 20,000, and 1 over 6 of that is 3,333.'
  47:
    moments:
      - section: 'The question'
        say: 'Cut a slice of pizza, then cut straight across between the two ends of the crust. The thin curved strip left is a segment. We want its area.'
        write: 'Find the area of the shaded segment.'
      - say: 'Write Solution. The figure is given: a circle of radius 3, and a chord that makes 120 degrees at the centre.'
        write: 'Solution'
        point:
          - {figure: 0, kind: circle, target: '120°', text: 'angle at centre', 'on': '120 degrees'}
      - section: 'What we know'
        say: 'List the givens: r is 3, theta is 120 degrees.'
        write: '$r = 3$, $\theta = 120^{\circ}$'
      - section: 'The plan'
        say: 'A segment is the sector with the triangle taken out. So area of segment equals area of sector minus area of triangle.'
        write: 'Area of segment $=$ area of sector $-$ area of $\triangle$'
        point:
          - {figure: 0, kind: highlight, target: {x: 130, y: 55}, text: 'segment', 'on': 'area of segment'}
          - {figure: 0, kind: circle, target: {x: 130, y: 130}, text: 'sector − triangle', 'on': 'sector minus'}
      - section: 'The sector'
        say: 'Area of a sector is theta over 360, times pi r squared.'
        write: 'Area of sector $= \dfrac{\theta}{360} \times \pi r^{2}$'
      - say: 'Substitute: theta is 120, r is 3.'
        write: '$= \dfrac{120}{360} \times \pi \times 3^{2}$'
      - say: '120 over 360 is 1 over 3, and 3 squared is 9. 1 third of 9 pi is 3 pi.'
        write: '$= \dfrac{1}{3} \times 9\pi = 3\pi$'
      - section: 'The triangle'
        say: 'Area of a triangle, from two sides and the included angle, is a half a b sine C. The two sides are radii, 3 and 3, with 120 degrees between them.'
        write: 'Area of $\triangle = \tfrac{1}{2}ab\sin C = \tfrac{1}{2} \times 3 \times 3 \times \sin 120^{\circ}$'
        point:
          - {figure: 0, kind: circle, target: {x: 86, y: 106}, text: '3', 'on': '3 and 3'}
          - {figure: 0, kind: circle, target: {x: 174, y: 106}, text: '3', 'on': '3 and 3'}
      - say: 'Sine 120 degrees equals sine 60 degrees, because 120 is 180 minus 60. That is root 3 over 2.'
        write: '$\sin 120^{\circ} = \sin 60^{\circ} = \dfrac{\sqrt{3}}{2}$'
      - say: 'So the area is 9 over 2, times root 3 over 2, which is 9 root 3 over 4.'
        write: 'Area of $\triangle = \dfrac{9}{2} \times \dfrac{\sqrt{3}}{2} = \dfrac{9\sqrt{3}}{4}$'
      - section: 'Put together'
        say: 'Substitute both into the plan: 3 pi, minus 9 root 3 over 4.'
        write: 'Area of segment $= 3\pi - \dfrac{9\sqrt{3}}{4}$'
        point:
          - {line: 10, kind: move, from: {line: 6, at: '=[[3π]]'}, at: '3π', text: 'sector', 'on': '3 pi'}
          - {line: 10, kind: move, from: {line: 9, at: '=[[493]]'}, at: '493', text: 'triangle', 'on': 'minus 9 root 3'}
      - say: 'Take out the common factor 3. 9 root 3 over 4 is 3 times 3 root 3 over 4.'
        write: '$= 3\left(\pi - \dfrac{3\sqrt{3}}{4}\right)$'
      - say: 'Therefore the area of the segment is 3 times, pi minus 3 root 3 over 4.'
        write: '$\therefore$ area of segment $= 3\left(\pi - \dfrac{3\sqrt{3}}{4}\right)$'
      - section: 'Check'
        say: 'Check in numbers: 3 pi is about 9.425 and 9 root 3 over 4 is about 3.897. The segment is about 5.53, positive and smaller than the sector, as it should be.'
        write: 'Check: $9.425 - 3.897 \approx 5.53 > 0$ ✓'
        point:
          - {figure: 0, kind: label, target: {x: 130, y: 55}, text: '≈ 5.53', 'on': 'about 5.53'}
      - section: 'Answer'
        say: 'So the area of the segment is 3 times, pi minus 3 root 3 over 4, which is answer choice C.'
        write: '$\therefore$ area $= 3\left(\pi - \tfrac{3\sqrt{3}}{4}\right)$ (C)'
        answer: true
    traps:
      A: 'You went for 3 pi. That is the whole sector, with the triangle still in it. Take away the triangle, 9 root 3 over 4, to leave the segment.'
      B: 'You went for 9 root 3 over 4. That is the triangle alone. The segment is the sector minus the triangle: 3 pi minus 9 root 3 over 4.'
      D: 'You went for option D. That is a negative number, and an area cannot be negative. The segment is the sector minus the triangle: 3 pi minus 9 root 3 over 4.'
      E: 'You went for pi plus 9 root 3 over 4. That adds the triangle instead of subtracting it, and the sector is 3 pi, not pi. Area of segment is sector minus triangle.'
  48:
    moments:
      - section: 'The question'
        say: 'In a class of 120 students, 18 scored an A grade. On a pie chart, the A-grade sector has angle Z degrees. We want Z.'
        write: 'A grade: 18 of 120 students. $Z = ?$'
        doodle: {name: 'custom:1985_q48_a', id: scripts, caption: '18 A grades in a class of 120'}
      - section: 'Solution'
        say: 'Solution. The givens: the frequency for A is 18, and the total frequency, sigma f, is the whole class, 120.'
        write: '$f = 18,\quad \Sigma f = 120$'
        doodle_do:
          - {id: scripts, op: circle, part: count}
      - say: 'The whole circle, 360 degrees, stands for the whole class. So the sectoral angle is the frequency over the total, times 360 degrees.'
        write: 'Sectoral angle $= \dfrac{f}{\Sigma f} \times 360^{\circ}$'
      - say: 'Substitute 18 and 120.'
        write: '$Z = \dfrac{18}{120} \times 360$'
      - say: 'Simplify 18 over 120 first: divide top and bottom by 6, and it is 3 over 20.'
        write: '$= \dfrac{3}{20} \times 360$'
      - say: '360 divided by 20 is 18. So it is 3 times 18.'
        write: '$= 3 \times 18$'
      - say: '3 times 18 is 54.'
        write: '$= 54$'
        diagram: {id: p, kind: pie, show: none, sectors: [{label: 'A grade', value: 18, colour: green}, {label: Others, value: 102, colour: grey}]}
        diagram_do:
          - {id: p, op: angle, part: 'sector:A grade', text: 'Z = 54°', 'on': '54'}
        doodle_do:
          - {id: scripts, op: label, part: a, text: '54°'}
      - section: 'Check'
        say: 'Check: 54 degrees out of 360 is the same share as 18 students out of 120. 54 over 360 is 3 over 20, and 18 over 120 is also 3 over 20.'
        write: '$\dfrac{54}{360} = \dfrac{3}{20} = \dfrac{18}{120}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore Z is 54, which is answer choice E.'
        write: '$\therefore Z = 54$'
        answer: true
    traps:
      A: 'You went for 15. That is the percentage of the class, 18 out of 120. A pie chart shares 360 degrees, not 100: 18 over 120, times 360, is 54.'
      B: 'You went for 28. Substitute into the formula: 18 over 120, times 360. 360 divided by 120 is 3, and 18 times 3 is 54.'
      C: 'You went for 50. Work it exactly: 18 over 120, times 360, is 18 times 3, which is 54.'
      D: 'You went for 52. Check the multiplication: 18 times 3 is 54.'
  49:
    moments:
      - section: 'The question'
        say: 'It looks like an arrowhead, but it is just a quadrilateral with one corner pushed in. Its four interior angles still add up to 360 degrees.'
        write: '$20^{\circ}$, $80^{\circ}$, $40^{\circ}$ given, $x = ?$'
        point:
          - {figure: 0, kind: circle, target: '20°'}
          - {figure: 0, kind: circle, target: '80°'}
          - {figure: 0, kind: circle, target: '40°'}
      - section: 'Solution'
        say: 'Solution. At the pushed-in corner, the angle inside the shape is a reflex angle, bigger than 180. Let it be $y$.'
        write: 'Let the reflex angle at the notch be $y$'
        point:
          - {figure: 0, kind: label, target: {x: 220, y: 118}, text: 'y (reflex)'}
      - say: 'The four interior angles of a quadrilateral add up to 360 degrees. Reason: sum of the interior angles of a quadrilateral.'
        write: '$y + 20^{\circ} + 80^{\circ} + 40^{\circ} = 360^{\circ}$ (sum of int. $\angle$s of quad.)'
      - say: '20 plus 80 is 100, and 100 plus 40 is 140.'
        write: '$y + 140^{\circ} = 360^{\circ}$'
      - say: 'Take 140 to the other side. 360 minus 140 is 220.'
        write: '$y = 360^{\circ} - 140^{\circ} = 220^{\circ}$'
        point:
          - {figure: 0, kind: label, target: {x: 220, y: 118}, text: '220°'}
      - say: '$x$ and $y$ sit at the same corner, on the two sides of it. Together they make a full turn. Reason: angles at a point.'
        write: '$x + y = 360^{\circ}$ ($\angle$s at a point)'
        point:
          - {figure: 0, kind: circle, target: x, text: 'x'}
      - say: 'Put in 220 for $y$. 360 minus 220 is 140.'
        write: '$x = 360^{\circ} - 220^{\circ} = 140^{\circ}$'
        point:
          - {figure: 0, kind: label, target: x, text: '140°'}
      - section: 'Check'
        say: 'Check another way. Join the top corner to the notch and extend the line. Each triangle''s exterior angle at the notch equals its two interior opposite angles added.'
        write: '$x = 20^{\circ} + 80^{\circ} + 40^{\circ}$ (ext. $\angle$ of $\triangle$, twice)'
      - say: 'The 80 at the top is shared between the two triangles. 20 plus 80 plus 40 is 140, the same $x$.'
        write: '$x = 140^{\circ}\ \checkmark$'
      - say: 'Therefore $x$ is 140 degrees, option E.'
        write: '$\therefore x = 140^{\circ}$ (E)'
        answer: true
    traps:
      A: 'You went for 100 degrees, maybe 180 minus 80. The shape is a quadrilateral: its reflex angle at the notch is 360 minus 140, which is 220, and $x$ is 360 minus 220, which is 140.'
      B: 'You went for 120 degrees. Add all three given angles: 20 plus 80 plus 40 is 140, and that is the angle $x$ at the notch.'
      C: 'You went for 60 degrees. That is 20 plus 40, leaving out the 80. All three given angles add up to $x$: 140 degrees.'
      D: 'You went for 110 degrees. The four interior angles add up to 360, so the reflex angle is 220, and $x$ is 360 minus 220, which is 140.'
  50:
    moments:
      - section: 'The question'
        say: 'An $x$ to the 4 on top and $x$ squared minus 1 below. Factorise the top, and something will cancel. Picture the top and the bottom as tiles.'
        doodle: {name: 'custom:1985_q50_a', id: tiles, caption: 'the fraction as tiles', size: scene}
        write: '$\dfrac{x^{4} - 5x^{2} + 4}{x^{2} - 1}$'
      - section: 'Solution'
        say: 'Factorise the numerator first. It has only $x$ to the 4, $x$ squared and a number, so it is a quadratic in $x$ squared.'
        write: 'Solution'
      - say: 'Let $u$ stand for $x$ squared. Then $x$ to the 4 is $u$ squared.'
        write: 'Let $u = x^{2}$'
      - say: 'The numerator becomes $u$ squared minus $5u$ plus 4.'
        write: '$x^{4} - 5x^{2} + 4 = u^{2} - 5u + 4$'
      - say: 'The product is 4 and the sum is negative 5.'
        write: 'Product $= 4$, Sum $= -5$'
      - say: 'Negative 4 and negative 1: they multiply to 4 and add to negative 5.'
        write: 'Factors: $-4$ and $-1$'
      - say: 'Replace negative $5u$ with negative $4u$ minus $u$.'
        write: '$u^{2} - 4u - u + 4$'
      - say: 'Take out $u$ from the first pair and negative 1 from the second. Both brackets are $u$ minus 4.'
        write: '$= u(u - 4) - 1(u - 4)$'
      - say: 'Take out the common bracket.'
        write: '$= (u - 4)(u - 1)$'
      - say: 'Now put $x$ squared back in place of $u$. The top tile splits into two.'
        doodle_do: [{id: tiles, op: stage, stage: 'custom:1985_q50_a2'}]
        write: '$= (x^{2} - 4)(x^{2} - 1)$'
      - section: 'Simplify'
        say: 'Put the factorised numerator over the denominator.'
        write: '$\dfrac{x^{4} - 5x^{2} + 4}{x^{2} - 1} = \dfrac{(x^{2} - 4)(x^{2} - 1)}{x^{2} - 1}$'
      - say: 'Cancel the common factor, $x$ squared minus 1, on the top and the bottom. Cross out the matching tiles.'
        doodle_do: [{id: tiles, op: cross, part: t1}, {id: tiles, op: cross, part: bot}]
        write: '$\therefore \dfrac{x^{4} - 5x^{2} + 4}{x^{2} - 1} = x^{2} - 4$'
        point:
          - {line: 10, kind: strike, at: '(x2−4)[[(x2−1)]]', text: 'cancels'}
          - {line: 11, kind: highlight, at: 'x2 − 4', to: {doodle: tiles, part: t4}}
      - section: 'Check'
        say: 'Check with $x$ equals 3. The top is 81 minus 45 plus 4, which is 40. The bottom is 9 minus 1, which is 8. 40 over 8 is 5.'
        write: '$x = 3$: $\dfrac{81 - 45 + 4}{9 - 1} = \dfrac{40}{8} = 5$'
      - say: 'Our answer at $x$ equals 3: 9 minus 4 is 5. They agree. The green tile is what was left.'
        doodle_do: [{id: tiles, op: circle, part: t4}]
        write: '$3^{2} - 4 = 5\ \checkmark$'
      - say: 'So the expression simplifies to $x$ squared minus 4: option E.'
        write: '$\therefore x^{2} - 4$ (E)'
        answer: true
    traps:
      A: 'You went for x squared minus 1. That is the factor that cancels, not the one left behind. The top is (x squared minus 4)(x squared minus 1), so x squared minus 4 remains.'
      B: 'You went for x squared plus 1. Check with x equals 3: the expression is 5, but 9 plus 1 is 10. The factor left over is x squared minus 4.'
      C: 'You went for x squared plus 4. The numbers with product 4 and sum negative 5 are both negative: negative 4 and negative 1. So it is x squared minus 4.'
      D: 'You went for 1. The top and the bottom are not the same; only one factor cancels. What is left is x squared minus 4.'
