  21:
    moments:
      - say: 'The quadratic $3x$ squared minus $7x$ plus $R$ is a perfect square. We want $R$.'
        write: '$3x^{2} - 7x + R$'
      - say: 'A perfect square has one repeated root. And a quadratic has a repeated root exactly when its discriminant, $b$ squared minus $4ac$, is zero.'
        write: '$b^{2} - 4ac = 0$'
      - say: 'Let''s read off the coefficients. $a$ is 3, $b$ is negative 7, and $c$ is $R$.'
        write: '$a = 3,\quad b = -7,\quad c = R$'
      - say: 'Substitute them in.'
        write: '$(-7)^{2} - 4(3)(R) = 0$'
      - say: 'Negative 7 squared is 49. And 4 times 3 is 12, so we have $12R$.'
        write: '$49 - 12R = 0$'
      - say: 'Add $12R$ to both sides.'
        write: '$12R = 49$'
      - say: 'Divide both sides by 12.'
        write: '$R = \dfrac{49}{12}$'
      - say: 'Let''s confirm by completing the square. Take out the 3: we get 3 times $x$ squared minus seven thirds $x$, plus $R$ over 3.'
        write: '$3\left(x^{2} - \tfrac{7}{3}x + \tfrac{R}{3}\right)$'
      - say: 'Half of seven thirds is seven sixths, and seven sixths squared is forty-nine thirty-sixths. So $R$ over 3 must be 49 over 36.'
        write: '$\tfrac{R}{3} = \left(\tfrac{7}{6}\right)^{2} = \tfrac{49}{36}$'
      - say: 'Multiply by 3: 49 over 36 times 3 is 49 over 12. The same answer.'
        write: '$R = 3 \times \tfrac{49}{36} = \tfrac{49}{12}$'
      - say: 'So $R$ is 49 over 12, which is answer choice D.'
        write: '$R = \tfrac{49}{12}$'
        answer: true
    traps:
