      - say: 'Multiplying by 2 adds one to the power: 2 to the 17 times 2 to the 1 is 2 to the 18.'
        write: '$= 2^{17 + 1} = 2^{18}$'
      - say: 'Law of indices: a power of a power multiplies the indices.'
        write: 'Law of indices: $(a^{m})^{n} = a^{mn}$'
