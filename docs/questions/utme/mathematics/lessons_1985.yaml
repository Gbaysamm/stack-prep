  13:
    moments:
      - say: 'We want the values of $p$ for which $x$ squared minus $p$ minus 2 times $x$, plus $2p$ plus 1, equals zero has equal roots.'
        write: '$x^{2} - (p - 2)x + 2p + 1 = 0$'
      - say: 'Here''s the key fact: a quadratic has equal roots exactly when its discriminant, $b$ squared minus $4ac$, is zero.'
        write: '$b^{2} - 4ac = 0$'
      - say: 'Let''s read off $a$, $b$ and $c$. $a$ is 1, $b$ is negative $p$ minus 2, and $c$ is $2p$ plus 1.'
        write: '$a = 1,\quad b = -(p - 2),\quad c = 2p + 1$'
      - say: 'Substitute them in. Squaring removes the minus sign on $b$.'
        write: '$(p - 2)^{2} - 4(1)(2p + 1) = 0$'
      - say: 'Expand the square: $p$ minus 2, squared, is $p$ squared minus $4p$ plus 4.'
        write: '$(p - 2)^{2} = p^{2} - 4p + 4$'
      - say: 'And 4 times $2p$ plus 1 is $8p$ plus 4.'
        write: '$4(2p + 1) = 8p + 4$'
      - say: 'So we have $p$ squared minus $4p$ plus 4, minus $8p$, minus 4, all equal to zero.'
        write: '$p^{2} - 4p + 4 - 8p - 4 = 0$'
      - say: 'Collect like terms. Negative $4p$ minus $8p$ is negative $12p$, and 4 minus 4 is zero.'
        write: '$p^{2} - 12p = 0$'
      - say: 'Factorise by taking out $p$. Don''t divide by $p$, or you lose an answer.'
        write: '$p(p - 12) = 0$'
      - say: 'So either $p$ is zero, or $p$ minus 12 is zero, which gives $p$ equals 12.'
        write: '$p = 0 \quad \text{or} \quad p = 12$'
      - say: 'Quick check with $p$ equals 12: the equation becomes $x$ squared minus $10x$ plus 25, which is $x$ minus 5, squared. Equal roots.'
        write: '$x^{2} - 10x + 25 = (x - 5)^{2}$'
      - say: 'So the values are 0 and 12, which is answer choice A.'
        write: '$p = 0,\ 12$'
        answer: true
    traps:
      B: 'You went for 1 and 2. Put p equals 1 into the discriminant: 1 minus 12 is not zero. Setting b squared minus 4ac to zero gives p squared minus 12p equals zero, so p is 0 or 12.'
