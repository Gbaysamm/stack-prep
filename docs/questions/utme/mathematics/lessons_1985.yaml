      D: 'You went for (2, 2). The mode is right, but the mean is 35 goals over 20 matches, which is 1.75, not 2.'
      E: 'You went for (2, 1). The mean is 35 over 20, which is 1.75. And the mode is 2, the number of goals scored in the most matches.'
  29:
    moments:
      - say: 'A right-angled isosceles triangle has hypotenuse 2. We want the length of each of the other sides.'
        write: 'Hypotenuse $= 2$'
      - say: 'Let me draw the right-angled isosceles triangle.'
        show_sketch: true
        point:
          - {figure: sketch, kind: highlight, target: AB, text: 'hypotenuse'}
      - say: 'Isosceles means two sides are equal. In a right-angled isosceles triangle, the two equal sides are the shorter ones, with the right angle between them. Let''s call each one $a$.'
        write: 'Equal sides: $a$ and $a$'
        point:
          - {figure: sketch, kind: highlight, target: AC, text: 'a'}
          - {figure: sketch, kind: highlight, target: CB, text: 'a'}
      - say: 'Pythagoras: the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hypotenuse}^{2} = \text{opposite}^{2} + \text{adjacent}^{2}$'
      - say: 'Pythagoras says the squares of the two shorter sides add up to the square of the hypotenuse.'
        write: '$a^{2} + a^{2} = 2^{2}$'
        point:
          - {line: 4, kind: move, from: {line: 0, at: '=2'}, at: '=[[2]]2', text: 'given'}
      - say: '$a$ squared plus $a$ squared is $2a$ squared, and 2 squared is 4.'
        write: '$2a^{2} = 4$'
      - say: 'Divide both sides by 2. 4 divided by 2 is 2.'
        write: '$a^{2} = \dfrac{4}{2} = 2$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '[[2]]a2'}, at: '[[2]]4', text: 'divide'}
      - say: 'Take the square root of both sides. A length is positive, so $a$ is root 2.'
        write: '$a = \sqrt{2}$'
      - say: 'Check it in Pythagoras: root 2 squared is 2, and 2 plus 2 is 4, which is 2 squared. Correct.'
        write: 'Check: $(\sqrt{2})^{2} + (\sqrt{2})^{2} = 2 + 2 = 4 = 2^{2}$'
      - say: 'And each side, about 1.41, is shorter than the hypotenuse, 2, as it must be. The hypotenuse is always the longest side.'
        write: '$\sqrt{2} \approx 1.41 < 2$'
        point:
          - {figure: sketch, kind: highlight, target: AB, text: 'hypotenuse 2'}
          - {figure: sketch, kind: highlight, target: CA, text: '≈ 1.41'}
      - say: 'So each of the other sides is root 2, which is answer choice A.'
        write: 'Each side $= \sqrt{2}$'
        point:
          - {figure: sketch, kind: label, target: AC, text: '√2'}
          - {figure: sketch, kind: label, target: CB, text: '√2'}
        answer: true
    traps:
      B: 'You went for 1 over root 2. That is the answer for a hypotenuse of 1. Here the hypotenuse is 2, so a squared plus a squared equals 4, and a is root 2.'
      C: 'You went for 2 root 2. That multiplies the hypotenuse by root 2 instead of dividing, and it would make the sides longer than the hypotenuse, which is impossible.'
      D: 'You went for 1. Check it: 1 squared plus 1 squared is 2, not 4. The sides must be root 2.'
      E: 'You went for root 2 minus 1. That is too short: its square is much less than 2. From 2a squared equals 4, a squared is 2, so a is root 2.'
  30:
    moments:
      - say: 'Two fair coins are tossed. We want the probability of getting at least one head. Picture the two coins spinning.'
        doodle: {name: 'custom:1985_q30_a', id: coins, caption: 'two fair coins tossed', size: scene}
        write: 'Two fair coins: $P(\text{at least one head}) = \ ?$'
      - say: 'Let me draw a tree diagram, so we can see every outcome.'
        show_sketch: true
      - say: 'Let''s list every way the two coins can land. The first coin can be a head or a tail, and so can the second. Here are the four landings as coin pairs.'
        doodle_do: [{id: coins, op: stage, stage: 'custom:1985_q30_a2'}]
        write: 'Outcomes: $HH,\ \ HT,\ \ TH,\ \ TT$'
      - say: 'That is 4 equally likely outcomes. Notice $HT$ and $TH$ are different: head then tail, or tail then head.'
        write: 'Total outcomes $= 4$'
      - say: 'Three of the coin pairs show a head. "At least one head" means one head or two heads, so anything except no heads. Those are $HH$, $HT$ and $TH$.'
        doodle_do: [{id: coins, op: highlight, part: hh}, {id: coins, op: highlight, part: ht}, {id: coins, op: highlight, part: th}]
        write: 'At least one head: $HH,\ \ HT,\ \ TH$'
        point:
          - {figure: sketch, kind: circle, target: HH}
          - {figure: sketch, kind: circle, target: HT}
          - {figure: sketch, kind: circle, target: TH}
      - say: 'Probability is the number of favourable outcomes over the total number of outcomes.'
        write: 'Probability: $P = \dfrac{\text{favourable outcomes}}{\text{total outcomes}}$'
      - say: 'That is 3 of the 4 outcomes. Probability is favourable outcomes over total outcomes, so it is 3 over 4.'
        write: '$P = \dfrac{3}{4}$'
        point:
          - {line: 4, kind: arrow, text: '3 of them'}
          - {line: 6, kind: move, from: {line: 3, at: '=4'}, at: '[[4]]3', text: 'total'}
      - say: 'There''s a faster way, using the opposite. The only outcome with no head at all is $TT$. That is the blue pair.'
        doodle_do: [{id: coins, op: circle, part: tt}]
        write: 'No head: $TT$ only'
        point:
          - {figure: sketch, kind: circle, target: TT, text: 'no head'}
      - say: 'For independent events, the probability of both is the product of the probabilities.'
        write: 'Independent events: $P(A \text{ and } B) = P(A) \times P(B)$'
      - say: 'Each coin lands tails with probability a half, so the probability of $TT$ is a half times a half, which is a quarter.'
        doodle_do: [{id: coins, op: label, part: tt, text: '¼'}]
        write: '$P(TT) = \tfrac{1}{2} \times \tfrac{1}{2} = \tfrac{1}{4}$'
        point:
          - {figure: sketch, kind: circle, target: TT, text: '½ × ½'}
      - say: 'The complement rule: the probability that something does not happen is 1 minus the probability that it does.'
        write: 'Complement: $P(\text{not } A) = 1 - P(A)$'
      - say: 'Every other outcome has at least one head. So the probability of at least one head is 1 minus that quarter, which is three quarters. The same answer.'
        write: '$P(\text{at least one head}) = 1 - \tfrac{1}{4} = \tfrac{3}{4}$'
        point:
          - {line: 11, kind: move, from: {line: 9, at: '=41'}, at: '−41', text: 'P(TT)'}
      - say: 'So the probability is three quarters, which is answer choice E.'
        write: '$P = \tfrac{3}{4}$'
        answer: true
    traps:
      A: 'You went for a quarter. That is the probability of no heads at all, TT. At least one head is everything else: 1 minus a quarter, which is three quarters.'
      B: 'You went for a half. That is the probability of exactly one head, HT or TH. At least one head also includes HH, so it is 3 out of 4.'
      C: 'You went for 1. That would mean a head is certain, but both coins can land tails. That one outcome, TT, leaves 3 out of 4.'
      D: 'You went for two thirds, from listing only three outcomes: two heads, one head, no head. But one head can happen in two ways, HT and TH. There are 4 equal outcomes, and 3 have a head.'
  31:
    moments:
      - say: 'Two similar rectangular blocks have lengths in the ratio 2 to 3. The larger block has volume 351 cubic centimetres. We want the volume of the smaller one.'
        write: '$\text{lengths } 2 : 3,\quad V_{\text{large}} = 351\ \text{cm}^{3}$'
      - say: 'Let me draw the two blocks.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'V = 351 cm³'}
      - say: 'Here''s the key fact. In similar solids every length is scaled by the same factor. Volume multiplies three lengths together, so volumes scale by the cube of the length ratio.'
        write: '$\text{volume ratio} = (\text{length ratio})^{3}$'
      - say: 'So cube each number in the length ratio. 2 cubed is 2 times 2 times 2, which is 8. 3 cubed is 3 times 3 times 3, which is 27.'
        write: '$2^{3} = 8,\quad 3^{3} = 27$'
        point:
          - {figure: sketch, kind: circle, target: 'length 2', text: '2³ = 8'}
          - {figure: sketch, kind: circle, target: 'length 3', text: '3³ = 27'}
      - say: 'So the volumes, small to large, are in the ratio 8 to 27.'
        write: 'Volume ratio $= 2^{3} : 3^{3} = 8 : 27$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {line: 4, kind: move, from: {line: 3, at: '=8'}, at: '=[[8]]27'}
          - {line: 4, kind: move, from: {line: 3, at: '=27'}, at: '=8[[27]]'}
      - say: 'Think of the volumes as made of equal parts. The larger block is 27 parts, and its volume is 351.'
        write: '$27 \text{ parts} = 351\ \text{cm}^{3}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '=8[[27]]'}, at: '27'}
          - {figure: sketch, kind: circle, target: 'V = 351 cm³', text: '27 parts'}
      - say: 'So one part is 351 divided by 27.'
        write: '$1 \text{ part} = \dfrac{351}{27}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '=[[351]]'}, at: '27[[351]]'}
          - {line: 6, kind: move, from: {line: 5, at: '[[27]]parts'}, at: '[[27]]351'}
      - say: 'Let''s work it out. 27 times 10 is 270, and 27 times 3 is 81. 270 plus 81 is 351, so 27 times 13 is 351.'
        write: '$27 \times 13 = 270 + 81 = 351$'
      - say: 'So 351 divided by 27 is 13. One part is 13 cubic centimetres.'
        write: '$1 \text{ part} = 13\ \text{cm}^{3}$'
      - say: 'The smaller block is 8 parts. 8 times 13 is 104.'
        write: '$8 \text{ parts} = 8 \times 13 = 104\ \text{cm}^{3}$'
        point:
          - {line: 9, kind: move, from: {line: 4, at: '=[[8]]27'}, at: '[[8]]×', text: 'small'}
          - {line: 9, kind: move, from: {line: 8, at: '=13'}, at: '×[[13]]', text: 'one part'}
          - {figure: sketch, kind: circle, target: 'V = ?', text: '104 cm³'}
      - say: 'Check: 104 over 351. 104 is 8 times 13, and 351 is 27 times 13, so the 13s cancel, giving 8 over 27. It matches the volume ratio.'
        write: 'Check: $\dfrac{104}{351} = \dfrac{8 \times 13}{27 \times 13} = \dfrac{8}{27}$'
      - say: 'So the smaller block has volume 104 cubic centimetres, which is answer choice E.'
        write: '$V_{\text{small}} = 104.00\ \text{cm}^{3}$'
        answer: true
    traps:
      A: 'You went for 234. That is 351 times two thirds, using the length ratio directly. Volumes scale by the cube of the ratio, 8 to 27.'
      B: 'You went for 526.5. That is 351 times 3 over 2, which makes the other block bigger. It is the smaller block, and volumes go by the cube: 8 to 27.'
      C: 'You went for 166. Volumes scale by the cube of the length ratio, 8 to 27. One part is 351 over 27, which is 13, and 8 parts make 104.'
      D: 'You went for 729.75. That is bigger than 351, but the other block is the smaller one. Cube the ratio to get 8 to 27, and 8 times 13 is 104.'
  32:
    moments:
      - say: 'From a hunter on the ground, the bearing of a bird on a tree is N72°E. We want the bearing of the hunter from the bird.'
        write: 'Bird from hunter: N$72^{\circ}$E'
