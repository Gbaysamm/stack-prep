      - say: 'The area of a sector is its angle over 360 degrees, times the area of the whole circle.'
        write: 'Sector area $= \dfrac{\theta}{360^{\circ}} \times \pi r^{2}$'
      - say: 'First the sector. The whole circle has area pi $r$ squared, and the sector is 120 out of 360 of it.'
        write: 'Sector $= \dfrac{120}{360} \times \pi \times 3^{2}$'
        point:
          - {line: 1, kind: box, text: 'the plan'}
          - {figure: 0, kind: circle, target: '120°', text: '120 of 360'}
      - say: '120 over 360 is a third, and 3 squared is 9. A third of 9 pi is 3 pi.'
        write: '$= \dfrac{1}{3} \times 9\pi = 3\pi$'
      - say: 'The rule for the area of a triangle from two sides and the angle between them: a half, times the two sides, times the sine of that angle.'
        write: 'Area of a triangle: $\tfrac{1}{2}ab\sin C$'
      - say: 'Now the triangle. It has two sides of 3, the radii, with 120 degrees between them. Its area is a half, times 3, times 3, times sin 120.'
        write: 'Triangle $= \tfrac{1}{2} \times 3 \times 3 \times \sin 120^{\circ}$'
        point:
          - {figure: 0, kind: circle, target: {x: 86, y: 106}, text: '3'}
          - {figure: 0, kind: circle, target: {x: 174, y: 106}, text: '3'}
          - {figure: 0, kind: circle, target: '120°', text: 'between'}
      - say: 'Sin 120 degrees is the same as sin 60, because 120 is 180 minus 60. That is root 3 over 2.'
        write: '$\sin 120^{\circ} = \sin 60^{\circ} = \dfrac{\sqrt{3}}{2}$'
      - say: 'So a half times 3 times 3 is 9 over 2, and 9 over 2 times root 3 over 2 is 9 root 3 over 4.'
        write: 'Triangle $= \dfrac{9}{2} \times \dfrac{\sqrt{3}}{2} = \dfrac{9\sqrt{3}}{4}$'
      - say: 'Now go back to segment equals sector minus triangle, and put in the 3 pi and the 9 root 3 over 4 we found.'
        write: 'Segment $= 3\pi - \dfrac{9\sqrt{3}}{4}$'
        point:
          - {line: 9, kind: move, from: {line: 4, at: '=3π'}, at: '3π', text: 'sector'}
          - {line: 9, kind: move, from: {line: 8, at: '=493'}, at: '493', text: 'triangle'}
          - {figure: 0, kind: highlight, target: {x: 130, y: 55}, text: 'segment'}
      - say: 'Take out the common factor 3. 3 pi is 3 times pi, and 9 root 3 over 4 is 3 times 3 root 3 over 4.'
        write: '$= 3\left(\pi - \dfrac{3\sqrt{3}}{4}\right)$'
      - say: 'In numbers, 3 pi is about 9.425 and 9 root 3 over 4 is about 3.897. The difference is about 5.53, less than the sector, as it should be.'
        write: 'Segment $\approx 9.425 - 3.897 \approx 5.53$'
        point:
          - {figure: 0, kind: label, target: {x: 130, y: 55}, text: '≈ 5.53'}
      - say: 'So the area of the segment is 3 times pi minus 3 root 3 over 4, which is answer choice C.'
        write: 'Segment $= 3\left(\pi - \tfrac{3\sqrt{3}}{4}\right)$'
        answer: true
    traps:
      A: 'You went for 3 pi. That is the whole sector, with the triangle still in it. Take away the triangle, 9 root 3 over 4, to leave the segment.'
      B: 'You went for 9 root 3 over 4. That is the triangle alone. The segment is the sector minus the triangle: 3 pi minus 9 root 3 over 4.'
      D: 'You went for 3 times (root 3 minus pi) over 4. That is a negative number, and an area can''t be negative. The segment is 3 pi minus 9 root 3 over 4.'
      E: 'You went for pi plus 9 root 3 over 4. That adds the triangle instead of subtracting it, and the sector is 3 pi, not pi. Sector minus triangle is the recipe.'
  48:
    moments:
      - say: 'In a class of 120 students, 18 scored an A. On a pie chart the A-grade section has angle $Z$ degrees. We want $Z$. Picture the pile of marked scripts.'
        doodle: {name: 'custom:1985_q48_a', id: scripts, caption: '18 A grades in a class of 120'}
        write: 'A-grade: 18 out of 120 students'
      - say: 'Let me draw the pie chart, so we can see the parts of the whole.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'A grade: 18'}
      - say: 'A pie chart shares out the full 360 degrees around the centre among the groups, in proportion to their sizes. The whole class of 120 gets the whole 360 degrees.'
        write: '120 students $\to 360^{\circ}$'
        point:
          - {figure: sketch, kind: circle, target: '120 students = 360°'}
      - say: 'The A scripts are 18 of the 120. So a group''s angle is its fraction of the whole class, times 360. The A-grade fraction is 18 over 120.'
        doodle_do: [{id: scripts, op: circle, part: count}]
        write: '$Z = \dfrac{18}{120} \times 360$'
        point:
          - {line: 3, kind: move, from: {line: 0, at: '[[18]]outof'}, at: '120[[18]]', text: 'A grades'}
          - {line: 3, kind: move, from: {line: 0, at: 'of[[120]]'}, at: '[[120]]18', text: 'class'}
      - say: 'Simplify 18 over 120 first. Both divide by 6: 18 divided by 6 is 3, and 120 divided by 6 is 20.'
        write: '$\dfrac{18}{120} = \dfrac{18 \div 6}{120 \div 6} = \dfrac{3}{20}$'
      - say: 'Put that back in: $Z$ is 3 over 20, times 360.'
        write: '$Z = \dfrac{3}{20} \times 360$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '=203'}, at: '203', text: 'simplified'}
      - say: 'Divide first: 360 divided by 20 is 18.'
        write: '$360 \div 20 = 18$'
      - say: 'Then multiply by the 3 on top: 3 times 18 is 54.'
        write: '$Z = 3 \times 18 = 54$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '=18'}, at: '×[[18]]'}
          - {figure: sketch, kind: circle, target: Z, text: '54°'}
      - say: 'A quicker check: 120 students share 360 degrees, so each student is worth 360 divided by 120, which is 3 degrees. Picture the 18 A students.'
        doodle: {name: 'student-small', id: astudents, caption: 'the 18 A students', repeat: 18, layout: grid}
        write: 'Check: $360^{\circ} \div 120 = 3^{\circ}$ per student'
      - say: '18 students at 3 degrees each is 18 times 3, which is 54 degrees. The same answer.'
        doodle_do: [{id: astudents, op: group, n: 18, text: '18 × 3° = 54°'}]
        write: '$18 \times 3^{\circ} = 54^{\circ} \ \checkmark$'
      - say: 'So $Z$ is 54, which is answer choice E.'
        doodle_do: [{id: scripts, op: label, part: a, text: '54°'}]
        write: '$Z = 54$'
        answer: true
    traps:
      A: 'You went for 15. That is the percentage of the class, 18 out of 120. A pie chart shares out 360 degrees, not 100: each student is worth 3 degrees, so 18 students give 54.'
      B: 'You went for 28. Each student is worth 360 divided by 120, which is 3 degrees. 18 times 3 is 54.'
      C: 'You went for 50. Work it out exactly: 3 over 20 of 360 is 3 times 18, which is 54.'
      D: 'You went for 52. Check the multiplication: 18 students at 3 degrees each is 54 degrees.'
  49:
    moments:
      - say: 'In the diagram, an arrowhead shape has angles of 20, 80 and 40 degrees at its three outer corners. We want the angle $x$ at the notch.'
        write: '$20^{\circ},\quad 80^{\circ},\quad 40^{\circ}$'
        point:
          - {figure: 0, kind: circle, target: '20°'}
          - {figure: 0, kind: circle, target: '80°'}
          - {figure: 0, kind: circle, target: '40°'}
      - say: 'The shape has four corners, so it is a quadrilateral, even though one corner points inwards.'
        write: 'Four corners: a quadrilateral'
      - say: 'The interior angles of any quadrilateral add up to 360 degrees.'
        write: 'Sum of interior angles $= 360^{\circ}$'
      - say: 'At the notch, the angle inside the shape is a reflex angle, bigger than 180. Let''s find it: 360 minus the other three angles.'
        write: 'Reflex angle at notch $= 360^{\circ} - 20^{\circ} - 80^{\circ} - 40^{\circ}$'
        point:
          - {figure: 0, kind: circle, target: '20°'}
          - {figure: 0, kind: circle, target: '80°'}
          - {figure: 0, kind: circle, target: '40°'}
      - say: 'First add the three angles: 20 plus 80 is 100, and 100 plus 40 is 140.'
        write: '$20^{\circ} + 80^{\circ} + 40^{\circ} = 140^{\circ}$'
      - say: 'So the reflex angle is 360 minus that 140, which is 220 degrees.'
        write: 'Reflex angle $= 360^{\circ} - 140^{\circ} = 220^{\circ}$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {line: 5, kind: move, from: {line: 4, at: '=140∘'}, at: '−140∘'}
          - {figure: 0, kind: label, target: {x: 220, y: 118}, text: '220° reflex'}
      - say: 'The angle $x$, marked in the diagram, is on the other side of the notch. Together with the reflex angle it makes a full turn, and the angles at a point add up to 360 degrees.'
        write: '$x + 220^{\circ} = 360^{\circ}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '=220∘'}, at: '220∘'}
          - {figure: 0, kind: circle, target: x, text: 'x'}
      - say: 'Subtract 220 from both sides. 360 minus 220 is 140.'
        write: '$x = 360^{\circ} - 220^{\circ} = 140^{\circ}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '+220∘'}, at: '−220∘', text: 'across'}
          - {figure: 0, kind: label, target: x, text: '140°'}
      - say: 'Notice that this equals the sum of the three outer angles: 20 plus 80 plus 40 is 140. That''s a handy fact for arrowheads.'
        write: '$20^{\circ} + 80^{\circ} + 40^{\circ} = 140^{\circ}$'
      - say: 'So $x$ is 140 degrees, which is answer choice E.'
        write: '$x = 140^{\circ}$'
        answer: true
    traps:
      A: 'You went for 100 degrees, maybe from 180 minus 80. The shape is a quadrilateral: its reflex angle at the notch is 360 minus 140, which is 220, and x is 360 minus 220, which is 140.'
      B: 'You went for 120 degrees. Add all three outer angles: 20 plus 80 plus 40 is 140, and that is the angle at the notch.'
      C: 'You went for 60 degrees. That is 20 plus 40 and leaves out the 80. All three outer angles add up to x: 140 degrees.'
      D: 'You went for 110 degrees. The four interior angles add to 360, so the reflex angle is 220, and x is 360 minus 220, which is 140.'
  50:
    moments:
      - section: 'The question'
        say: 'An $x$ to the 4 on top and $x$ squared minus 1 below. Factorise the top, and something will cancel. Picture the top and the bottom as tiles.'
        doodle: {name: 'custom:1985_q50_a', id: tiles, caption: 'the fraction as tiles', size: scene}
        write: '$\dfrac{x^{4} - 5x^{2} + 4}{x^{2} - 1}$'
      - section: 'Solution'
        say: 'Factorise the numerator first. It has only $x$ to the 4, $x$ squared and a number, so it is a quadratic in $x$ squared.'
        write: 'Solution'
      - say: 'Let $u$ stand for $x$ squared. Then $x$ to the 4 is $u$ squared.'
        write: 'Let $u = x^{2}$'
      - say: 'The numerator becomes $u$ squared minus $5u$ plus 4.'
        write: '$x^{4} - 5x^{2} + 4 = u^{2} - 5u + 4$'
      - say: 'The product is 4 and the sum is negative 5.'
        write: 'Product $= 4$, Sum $= -5$'
      - say: 'Negative 4 and negative 1: they multiply to 4 and add to negative 5.'
        write: 'Factors: $-4$ and $-1$'
      - say: 'Replace negative $5u$ with negative $4u$ minus $u$.'
        write: '$u^{2} - 4u - u + 4$'
      - say: 'Take out $u$ from the first pair and negative 1 from the second. Both brackets are $u$ minus 4.'
        write: '$= u(u - 4) - 1(u - 4)$'
      - say: 'Take out the common bracket.'
        write: '$= (u - 4)(u - 1)$'
      - say: 'Now put $x$ squared back in place of $u$. The top tile splits into two.'
        doodle_do: [{id: tiles, op: stage, stage: 'custom:1985_q50_a2'}]
        write: '$= (x^{2} - 4)(x^{2} - 1)$'
      - section: 'Simplify'
        say: 'Put the factorised numerator over the denominator.'
        write: '$\dfrac{x^{4} - 5x^{2} + 4}{x^{2} - 1} = \dfrac{(x^{2} - 4)(x^{2} - 1)}{x^{2} - 1}$'
      - say: 'Cancel the common factor, $x$ squared minus 1, on the top and the bottom. Cross out the matching tiles.'
        doodle_do: [{id: tiles, op: cross, part: t1}, {id: tiles, op: cross, part: bot}]
        write: '$\therefore \dfrac{x^{4} - 5x^{2} + 4}{x^{2} - 1} = x^{2} - 4$'
        point:
          - {line: 10, kind: strike, at: '(x2−4)[[(x2−1)]]', text: 'cancels'}
          - {line: 11, kind: highlight, at: 'x2 − 4', to: {doodle: tiles, part: t4}}
      - section: 'Check'
        say: 'Check with $x$ equals 3. The top is 81 minus 45 plus 4, which is 40. The bottom is 9 minus 1, which is 8. 40 over 8 is 5.'
        write: '$x = 3$: $\dfrac{81 - 45 + 4}{9 - 1} = \dfrac{40}{8} = 5$'
      - say: 'Our answer at $x$ equals 3: 9 minus 4 is 5. They agree. The green tile is what was left.'
        doodle_do: [{id: tiles, op: circle, part: t4}]
        write: '$3^{2} - 4 = 5\ \checkmark$'
      - say: 'So the expression simplifies to $x$ squared minus 4: option E.'
        write: '$\therefore x^{2} - 4$ (E)'
        answer: true
    traps:
      A: 'You went for x squared minus 1. That is the factor that cancels, not the one left behind. The top is (x squared minus 4)(x squared minus 1), so x squared minus 4 remains.'
      B: 'You went for x squared plus 1. Check with x equals 3: the expression is 5, but 9 plus 1 is 10. The factor left over is x squared minus 4.'
      C: 'You went for x squared plus 4. The numbers with product 4 and sum negative 5 are both negative: negative 4 and negative 1. So it is x squared minus 4.'
      D: 'You went for 1. The top and the bottom are not the same; only one factor cancels. What is left is x squared minus 4.'
