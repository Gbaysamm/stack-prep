          - {figure: sketch, kind: highlight, target: SR, text: 'base'}
      - say: 'Its area is a half, times base, times height: a half times 3 times 4.'
        write: 'Area of $\triangle SQR = \tfrac{1}{2} \times 3 \times 4$'
        point:
