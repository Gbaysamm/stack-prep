          - {line: 6, kind: move, from: {line: 5, at: '=20'}, at: '[[20]]35', text: 'matches'}
      - say: 'Divide the top and bottom by 5: 35 over 20 is 7 over 4. And 7 divided by 4 is 1.75.'
        doodle_do: [{id: goals, op: label, part: net, text: '1.75 a match'}]
        write: '$= \dfrac{7}{4} = 1.75$'
      - say: 'Look at the tallest pile of counters. Now the mode. Look along the bottom row of the table for the biggest number of matches. It is 7, and those 7 matches had 2 goals each. So the mode is 2.'
        doodle_do: [{id: goals, op: circle, part: g2}]
        write: 'Highest frequency $= 7$, at 2 goals, so mode $= 2$'
        point:
          - {line: 8, kind: highlight, at: 'mode = 2', to: {doodle: goals, part: g2}}
      - say: 'So the mean and mode are 1.75 and 2, which is answer choice B.'
        write: '(mean, mode) $= (1.75,\ 2)$'
        answer: true
    traps:
      A: 'You went for (1.75, 5). The mean is right, but the mode is not the biggest number of goals. It is the number of goals that happened most often, which is 2, in 7 matches.'
