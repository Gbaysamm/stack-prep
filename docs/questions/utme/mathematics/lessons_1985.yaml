  21:
    moments:
      - say: 'The quadratic $3x$ squared minus $7x$ plus $R$ is a perfect square. We want $R$.'
        write: '$3x^{2} - 7x + R$'
      - say: 'A perfect square has one repeated root. And a quadratic has a repeated root exactly when its discriminant, $b$ squared minus $4ac$, is zero.'
        write: '$b^{2} - 4ac = 0$'
      - say: 'Let''s read off the coefficients. $a$ is 3, $b$ is negative 7, and $c$ is $R$.'
        write: '$a = 3,\quad b = -7,\quad c = R$'
      - say: 'Substitute these values into $b$ squared minus $4ac$ equals zero.'
        write: '$(-7)^{2} - 4(3)(R) = 0$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: 'b=[[−7]]'}, at: '(−7)', text: 'b'}
          - {line: 3, kind: move, from: {line: 2, at: 'a=[[3]]'}, at: '4[[(3)]]', text: 'a'}
          - {line: 3, kind: move, from: {line: 2, at: 'c=[[R]]'}, at: '(R)', text: 'c'}
      - say: 'Negative 7 squared is 49. And 4 times 3 is 12, so we have $12R$.'
        write: '$49 - 12R = 0$'
      - say: 'Add $12R$ to both sides.'
        write: '$12R = 49$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '−12R'}, at: '12R', text: 'across'}
      - say: 'Divide both sides by 12.'
        write: '$R = \dfrac{49}{12}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '[[12]]R'}, at: '[[12]]49', text: 'divide'}
      - say: 'Let''s confirm by completing the square. Take out the 3 from every term: we get 3 times, $x$ squared minus 7 over 3 $x$, plus $R$ over 3.'
        write: '$3x^{2} - 7x + R = 3\left(x^{2} - \tfrac{7}{3}x + \tfrac{R}{3}\right)$'
      - say: 'Inside the bracket, a perfect square needs the last term to be half the $x$ coefficient, squared. Half of 7 over 3 is 7 over 6.'
        write: 'Half of $\tfrac{7}{3}$: $\ \tfrac{7}{6}$'
      - say: '7 over 6, squared, is 49 over 36. So $R$ over 3 must be 49 over 36.'
        write: '$\tfrac{R}{3} = \left(\tfrac{7}{6}\right)^{2} = \tfrac{49}{36}$'
      - say: 'Multiply by 3: 3 times 49 over 36 is 49 over 12, since 36 divided by 3 is 12. The same answer.'
        write: '$R = 3 \times \tfrac{49}{36} = \tfrac{49}{12} \ \checkmark$'
      - say: 'So $R$ is 49 over 12, which is answer choice D.'
        write: '$R = \tfrac{49}{12}$'
        answer: true
    traps:
      A: 'You went for 49 over 24. That puts an extra 2 in the bottom. The discriminant gives 49 minus 4 times 3 times R, which is 49 minus 12R, so R is 49 over 12.'
      B: 'You went for 49 over 3. That divides 49 by the 3 alone and forgets the 4 in 4ac. The condition is 49 equals 12R, so R is 49 over 12.'
      C: 'You went for 49 over 6. The discriminant is b squared minus 4ac, which is 49 minus 12R. So R is 49 over 12, not 49 over 6.'
      E: 'You went for 49 over 36. That uses the rule "half the x coefficient, squared" without first taking out the leading 3. It works only when the x squared coefficient is 1. The answer is 49 over 12.'
  22:
    moments:
      - say: 'We need to solve 2 over $2r$ minus 1, minus 5 over 3, equals 1 over $r$ plus 2.'
        write: '$\dfrac{2}{2r - 1} - \dfrac{5}{3} = \dfrac{1}{r + 2}$'
      - say: 'Don''t worry about the fractions. We clear them all in one move: multiply every term by 3, times $2r$ minus 1, times $r$ plus 2. That is every denominator multiplied together.'
        write: 'Multiply every term by $3(2r - 1)(r + 2)$:'
      - say: 'In the first term, $2r$ minus 1 cancels, leaving 2 times 3 times $r$ plus 2, which is 6 times $r$ plus 2. In the second, the 3 cancels, leaving 5 times the two brackets. In the last, $r$ plus 2 cancels, leaving 3 times $2r$ minus 1.'
        write: '$6(r + 2) - 5(2r - 1)(r + 2) = 3(2r - 1)$'
      - say: 'Now expand the double bracket: $2r$ times $r$ is $2r$ squared, $2r$ times 2 is $4r$, negative 1 times $r$ is negative $r$, and negative 1 times 2 is negative 2. $4r$ minus $r$ is $3r$.'
        write: '$(2r - 1)(r + 2) = 2r^{2} + 4r - r - 2 = 2r^{2} + 3r - 2$'
      - say: 'Put that back into the equation, and expand the other two brackets: 6 times $r$ plus 2 is $6r$ plus 12, and 3 times $2r$ minus 1 is $6r$ minus 3.'
        write: '$6r + 12 - 5(2r^{2} + 3r - 2) = 6r - 3$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '=2r2+3r−2'}, at: '(2r2+3r−2)'}
      - say: 'Multiply out the negative 5: negative $10r$ squared, negative $15r$, and plus 10.'
        write: '$6r + 12 - 10r^{2} - 15r + 10 = 6r - 3$'
      - say: 'Tidy the left side. $6r$ minus $15r$ is negative $9r$, and 12 plus 10 is 22.'
        write: '$-10r^{2} - 9r + 22 = 6r - 3$'
      - say: 'Bring everything to the left: subtract $6r$ and add 3 on both sides. Negative $9r$ minus $6r$ is negative $15r$, and 22 plus 3 is 25.'
        write: '$-10r^{2} - 15r + 25 = 0$'
      - say: 'Every term divides by negative 5. That makes the numbers smaller and the $r$ squared term positive.'
        write: '$2r^{2} + 3r - 5 = 0$'
