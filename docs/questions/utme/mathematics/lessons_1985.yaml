      - say: 'That is S72°W, the same as before.'
        write: '$252^{\circ} = $ S$72^{\circ}$W $\ \checkmark$'
      - say: 'So the bearing of the hunter from the bird is S72°W, which is answer choice B.'
        write: 'Hunter from bird: S$72^{\circ}$W'
        answer: true
        point:
          - {figure: sketch, kind: circle, target: '?', text: 'S72°W'}
    traps:
      A: 'You went for S18°W. That uses 90 minus 72. Turning round swaps the directions but keeps the angle, so it is S72°W.'
