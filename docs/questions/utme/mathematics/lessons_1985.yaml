        write: '$3^{y} = -3 \ \text{(impossible)}$'
      - say: 'That leaves 3 to the $y$ equals 9. And 9 is 3 squared.'
        write: '$3^{y} = 9 = 3^{2}$'
      - say: 'The bases match, so the powers match: $y$ is 2.'
        write: '$y = 2$'
      - say: 'Let''s check. 3 to the 4 is 81. 6 times 3 squared is 6 times 9, which is 54. 81 minus 54 is 27. Correct.'
        write: '$81 - 6(9) = 81 - 54 = 27$'
      - say: 'So $y$ is 2, which is answer choice C.'
        write: '$y = 2$'
