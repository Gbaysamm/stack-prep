  43:
    moments:
      - say: 'In the diagram, $PQ$ is a tangent to the circle at $Q$, and $SR$ is a diameter. Angle $QPR$ is theta and angle $PQR$ is phi. We want the relationship between them.'
        write: '$\angle QPR = \theta,\quad \angle PQR = \phi$'
        point:
          - {figure: 0, kind: arc, target: QPR, text: 'θ'}
          - {figure: 0, kind: arc, target: PQR, text: 'φ'}
      - say: 'We''ll use two circle facts: the angle in a semicircle, and the alternate segment theorem. Then the angle sum of a triangle ties them together.'
        write: 'Plan: semicircle, alternate segment, triangle'
      - say: 'First, $SR$ is a diameter. The angle it makes at $Q$ on the circle is a right angle.'
        write: 'Angle in a semicircle: $\angle SQR = 90^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: SQR, text: '90°'}
      - say: 'The alternate segment theorem: the angle between a tangent and a chord equals the angle in the alternate segment.'
        write: 'Alternate segment: tangent–chord angle $=$ angle in the alternate segment'
      - say: 'The angle between tangent $QP$ and chord $QR$ is phi, so by that theorem the angle at $S$ in the alternate segment is also phi.'
        write: '$\angle QSR = \angle PQR = \phi$'
        point:
          - {figure: 0, kind: arc, target: QSR, text: 'φ'}
      - say: 'Now look at the big triangle $SQP$. Its angle at $S$ is the phi we just found, and its angle at $P$ is theta.'
        write: 'In $\triangle SQP$: $\angle S = \phi,\quad \angle P = \theta$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '=ϕ'}, at: 'S=[[ϕ]]', text: 'just found'}
          - {figure: 0, kind: arc, target: QSR, text: 'φ'}
          - {figure: 0, kind: circle, target: θ, text: 'θ at P'}
      - say: 'Its angle at $Q$ is made of two pieces: the right angle $SQR$, plus the angle $RQP$, which is phi. So it is 90 plus phi.'
        write: '$\angle SQP = \angle SQR + \angle RQP = 90^{\circ} + \phi$'
        point:
          - {line: 6, kind: move, from: {line: 2, at: '=90∘'}, at: '90∘'}
          - {figure: 0, kind: arc, target: SQP, text: '90° + φ'}
      - say: 'The rule: the three angles of any triangle add up to 180 degrees.'
        write: 'Angle sum of a triangle: $A + B + C = 180^{\circ}$'
      - say: 'The angles of a triangle add to 180 degrees. So phi, plus theta, plus 90 plus phi, equals 180.'
        write: '$\phi + \theta + (90^{\circ} + \phi) = 180^{\circ}$'
        point:
          - {line: 8, kind: move, from: {line: 6, at: '=90∘+ϕ'}, at: '(90∘+ϕ)'}
          - {figure: 0, kind: arc, target: SQP, text: '90° + φ'}
      - say: 'Phi plus phi is 2 phi. Then subtract 90 from both sides.'
        write: '$\theta + 2\phi = 180^{\circ} - 90^{\circ}$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '([[90∘]]'}, at: '−90∘', text: 'across'}
      - say: '180 minus 90 is 90.'
        write: '$\theta + 2\phi = 90^{\circ}$'
      - say: 'A check with numbers: if theta is 30, then 2 phi is 90 minus 30, which is 60, so phi is 30.'
        write: 'Check $\theta = 30^{\circ}$: $2\phi = 60^{\circ},\ \phi = 30^{\circ}$'
      - say: 'Then the triangle''s angles are phi, 30, at $S$, theta, 30, at $P$, and 90 plus 30, which is 120, at $Q$. 30 plus 30 plus 120 is 180. It works.'
