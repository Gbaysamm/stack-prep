      - say: 'So theta plus two phi equals 90 degrees, which is answer choice E.'
        write: '$\theta + 2\phi = 90^{\circ}$'
        answer: true
    traps:
      A: 'You went for theta plus phi equals 90. That misses one phi. In triangle SQP, phi appears twice: at S, and inside the angle at Q, which is 90 plus phi.'
      B: 'You went for phi equals 90 minus 2 theta. That is the right relation with theta and phi swapped. The 2 belongs with phi, because phi appears at S and at Q.'
      C: 'You went for theta equals phi. That is true only in one special case, 30 and 30. The general rule, from the triangle angle sum, is theta plus 2 phi equals 90.'
      D: 'You went for phi equals 2 theta. Try theta 30: that would make phi 60, and then theta plus 2 phi is 150, not 90. The relation is theta plus 2 phi equals 90.'
  44:
    moments:
      - say: 'A bag has 4 white balls and 6 red balls. Two balls are taken out without putting the first back. We want the probability that both are red. Picture the bag of balls.'
        doodle: {name: 'custom:1985_q44_a', id: bag, caption: 'two drawn, the first not put back', size: scene}
        write: '$4 \text{ white},\ 6 \text{ red},\ 10 \text{ total}$'
      - say: 'Let me draw a tree diagram, so we can see every outcome.'
        show_sketch: true
      - say: 'Without replacement, the first draw changes what''s left in the bag. So we multiply the probability of the first by the probability of the second, after updating the bag.'
        write: '$P(\text{both red}) = P(\text{1st red}) \times P(\text{2nd red})$'
      - say: 'Six red balls in the bag. First draw: 6 of the 10 balls are red, so the probability is 6 over 10.'
        doodle_do: [{id: bag, op: highlight, part: reds}, {id: bag, op: highlight, part: first}]
        write: '$P(\text{1st red}) = \dfrac{6}{10}$'
        point:
          - {figure: sketch, kind: circle, target: '6/10', text: '1st red'}
      - say: 'Watch the first red ball leave the bag. Now one red ball is gone and not put back. There are 5 red left, out of 9 balls.'
        doodle_do: [{id: bag, op: move, part: first, path: out}, {id: bag, op: label, part: reds, text: '5 red of 9'}]
        write: '$P(\text{2nd red}) = \dfrac{5}{9}$'
        point:
          - {figure: sketch, kind: circle, target: '5/9', text: '2nd red'}
      - say: 'Put those two probabilities into the multiplication.'
        write: '$P(\text{both red}) = \dfrac{6}{10} \times \dfrac{5}{9}$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {line: 5, kind: move, from: {line: 3, at: '=106'}, at: '106', text: '1st'}
          - {line: 5, kind: move, from: {line: 4, at: '=95'}, at: '95', text: 'one red gone'}
      - say: 'Multiply the tops and the bottoms. 6 times 5 is 30, and 10 times 9 is 90.'
        write: '$= \dfrac{6 \times 5}{10 \times 9} = \dfrac{30}{90}$'
      - say: '30 goes into 90 three times, so 30 over 90 simplifies to 1 over 3.'
        write: '$= \dfrac{30 \div 30}{90 \div 30} = \dfrac{1}{3}$'
        point:
          - {figure: sketch, kind: circle, target: RR, text: '1/3'}
      - say: 'Line up the 10 balls. Check with combinations. The number of ways to choose 2 red from 6 is 6 times 5 over 2, which is 15. The ways to choose any 2 from 10 is 10 times 9 over 2, which is 45.'
        doodle: {id: row, caption: 'the 10 balls in a row', repeat: [{name: 'ball-red', n: 6}, {name: 'ball-white', n: 4}], layout: row}
        write: 'Check: $^{6}C_{2} = \dfrac{6 \times 5}{2} = 15,\quad ^{10}C_{2} = \dfrac{10 \times 9}{2} = 45$'
      - say: 'Look at the six red balls. So the probability is 15 over 45, which is also 1 over 3.'
        doodle_do: [{id: row, op: group, n: 6, text: '6 red: 15 pairs'}]
        write: '$\dfrac{15}{45} = \dfrac{1}{3} \ \checkmark$'
      - say: 'So the probability is a third, which is answer choice A.'
        write: '$P(\text{both red}) = \tfrac{1}{3}$'
        answer: true
    traps:
      B: 'You went for 2 over 9. The first draw is 6 out of 10, and the second is 5 out of 9. 6 over 10 times 5 over 9 is 30 over 90, which is 1 over 3.'
      C: 'You went for 2 over 15. That is the probability both are white: 4 over 10 times 3 over 9. We want both red: 6 over 10 times 5 over 9, which is 1 over 3.'
      D: 'You went for 1 over 5. Multiply the probabilities carefully: 6 over 10 times 5 over 9 is 30 over 90, which is 1 over 3.'
      E: 'You went for 3 over 5. That is the probability of just the first ball being red. The second must be red too, 5 out of 9, giving 1 over 3.'
