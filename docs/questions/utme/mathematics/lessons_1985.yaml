      B: 'You went for 49 over 3. That divides 49 by the 3 alone and forgets the 4 in 4ac. The condition is 49 equals 12R, so R is 49 over 12.'
      C: 'You went for 49 over 6. The discriminant is b squared minus 4ac, which is 49 minus 12R. So R is 49 over 12, not 49 over 6.'
      E: 'You went for 49 over 36. That uses the rule "half the x coefficient, squared" without first taking out the leading 3. It works only when the x squared coefficient is 1. The answer is 49 over 12.'
  22:
    moments:
      - say: 'We need to solve 2 over $2r$ minus 1, minus five thirds, equals 1 over $r$ plus 2.'
        write: '$\dfrac{2}{2r - 1} - \dfrac{5}{3} = \dfrac{1}{r + 2}$'
      - say: 'Don''t worry about the fractions. We clear them all in one move: multiply every term by 3 times $2r$ minus 1 times $r$ plus 2.'
        write: '$\times\ 3(2r - 1)(r + 2)$'
      - say: 'In the first term, $2r$ minus 1 cancels, leaving 6 times $r$ plus 2. In the second, the 3 cancels, leaving 5 times the two brackets. In the last, $r$ plus 2 cancels, leaving 3 times $2r$ minus 1.'
        write: '$6(r + 2) - 5(2r - 1)(r + 2) = 3(2r - 1)$'
      - say: 'Now expand the double bracket: $2r$ times $r$ is $2r$ squared, $2r$ times 2 is $4r$, negative 1 times $r$ is negative $r$, and negative 1 times 2 is negative 2.'
        write: '$(2r - 1)(r + 2) = 2r^{2} + 3r - 2$'
