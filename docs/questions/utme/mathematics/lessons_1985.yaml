      - say: 'Let''s check by expanding. $ax$ times $bx$ is $abx$ squared, and $ax$ times negative $2y$ is negative $2axy$.'
        write: 'Check: $ax \cdot bx = abx^{2},\quad ax \cdot (-2y) = -2axy$'
      - say: 'Negative 4 times $bx$ is negative $4bx$, and negative 4 times negative $2y$ is plus $8y$.'
        write: '$-4 \cdot bx = -4bx,\quad -4 \cdot (-2y) = 8y$'
      - say: 'Those four terms are exactly the four in the question, just in a different order.'
        write: '$(ax - 4)(bx - 2y) = abx^{2} - 2axy - 4bx + 8y \ \checkmark$'
      - say: 'So the factors are $ax$ minus 4, times $bx$ minus $2y$, which is answer choice A.'
