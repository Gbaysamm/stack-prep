          - {line: 5, kind: move, from: {line: 4, at: '=−2y(ax−4)'}, at: '−2y(ax−4)'}
      - say: 'The bracket $ax$ minus 4 is in both parts. Take it out, and what is left is $bx$ minus $2y$.'
