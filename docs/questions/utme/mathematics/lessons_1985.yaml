          - {figure: sketch_b, kind: highlight, target: OB}
          - {figure: sketch_b, kind: highlight, target: AB}
      - say: 'The rule for the area of a triangle from two sides and the angle between them: a half, times the two sides, times the sine of that angle.'
        write: 'Area of a triangle: $\tfrac{1}{2}ab\sin C$'
      - say: 'The area of a triangle is half times two sides times the sine of the angle between them. Here the two sides are 8 and 8, and the angle is 60 degrees.'
        write: 'Area of one triangle $= \tfrac{1}{2} \times 8 \times 8 \times \sin 60^{\circ}$'
        point:
          - {figure: sketch_b, kind: highlight, target: OA, text: '8'}
          - {figure: sketch_b, kind: highlight, target: OB, text: '8'}
          - {figure: sketch_b, kind: arc, target: AOB, text: '60°'}
      - say: 'Sin 60 degrees is root 3 over 2.'
        write: '$= \tfrac{1}{2} \times 8 \times 8 \times \dfrac{\sqrt{3}}{2}$'
      - say: '8 times 8 is 64, and half of 64 is 32. Then 32 times root 3 over 2 is 16 root 3.'
        write: '$= 32 \times \dfrac{\sqrt{3}}{2} = 16\sqrt{3}$'
      - say: 'So each triangle has area 16 root 3, and there are six of them.'
        write: 'Hexagon $= 6 \times 16\sqrt{3}$'
        point:
          - {line: 10, kind: move, from: {line: 3, at: '=6'}, at: '[[6]]×', text: 'six'}
