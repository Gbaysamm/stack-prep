      - say: 'Complementary angles swap tan and cot. So cot 60 degrees equals tan 30 degrees, which is 1 over root 3.'
        write: '$\cot 60^{\circ} = \tan 30^{\circ} = \dfrac{1}{\sqrt{3}}$'
      - say: 'Now the bottom. Sin 30 degrees is a half: the opposite side 1, over the hypotenuse 2.'
        write: 'Bottom: $\sin 30^{\circ} = \tfrac{1}{2}$'
      - say: 'Squared, a half times a half is a quarter.'
        write: '$\sin^{2}30^{\circ} = \tfrac{1}{2} \times \tfrac{1}{2} = \tfrac{1}{4}$'
