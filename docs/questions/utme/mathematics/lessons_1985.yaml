          - {figure: 0, kind: highlight, target: HN, text: 'HN'}
      - say: 'Pythagoras: the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hypotenuse}^{2} = \text{opposite}^{2} + \text{adjacent}^{2}$'
      - say: 'First, across the floor. $H$ and $J$ are opposite corners of the bottom face, a square of side $a$. The two edges and $HJ$ make a right-angled triangle, so $HJ$ squared is $a$ squared plus $a$ squared.'
        write: '$HJ^{2} = a^{2} + a^{2}$'
        point:
          - {figure: 0, kind: highlight, target: HJ, text: 'across the floor'}
      - say: '$a$ squared plus $a$ squared is $2a$ squared.'
        write: '$HJ^{2} = 2a^{2}$'
      - say: 'Take the square root: $HJ$ is $a$ root 2.'
        write: '$HJ = a\sqrt{2}$'
        point:
          - {figure: 0, kind: label, target: HJ, text: 'a√2'}
      - say: 'Now go up. $N$ is directly above $J$, a height $a$ away. $HJ$ lies flat on the floor, so triangle $HJN$ has a right angle at $J$.'
        write: '$HN^{2} = HJ^{2} + JN^{2}$'
        point:
          - {figure: 0, kind: highlight, target: JN, text: 'up, a'}
      - say: 'Substitute: $HJ$ is $a$ root 2, and $JN$ is $a$.'
        write: '$HN^{2} = (a\sqrt{2})^{2} + a^{2}$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: 'a2'}, at: '(a2)', text: 'HJ'}
      - say: '$a$ root 2, squared, is $2a$ squared. Add $a$ squared: that is $3a$ squared.'
        write: '$HN^{2} = 2a^{2} + a^{2} = 3a^{2}$'
      - say: 'Take the square root. The square root of $3a$ squared is $a$ root 3.'
        write: '$HN = \sqrt{3a^{2}} = a\sqrt{3}$'
        point:
          - {figure: 0, kind: label, target: HN, text: 'a√3'}
      - say: 'So $HN$ is $a$ root 3, which is answer choice E.'
        write: '$HN = a\sqrt{3}$'
        answer: true
    traps:
      A: 'You went for 3 root a. The root belongs over the 3, not the a: the square root of 3a squared is a root 3.'
