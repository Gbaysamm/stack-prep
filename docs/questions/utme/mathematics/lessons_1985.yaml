      E: 'You went for S27°W. The directions are right, but the angle must stay 72 degrees, not 27.'
  33:
    moments:
      - say: 'In triangle $XYZ$, $XK$ is perpendicular to $YZ$. $XK$ is 15, $XZ$ is 25 and $YK$ is 8 centimetres. We want the area of triangle $XYZ$.'
        write: '$XK = 15,\quad XZ = 25,\quad YK = 8$'
        point:
          - {figure: 0, kind: highlight, target: XK, text: '15'}
          - {figure: 0, kind: highlight, target: XZ, text: '25'}
          - {figure: 0, kind: highlight, target: YK, text: '8'}
      - say: 'The area of a triangle is half times base times height. The height is $XK$, 15. But for the base $YZ$ we still need the piece $KZ$.'
        write: '$\text{Area} = \tfrac{1}{2} \times \text{base} \times \text{height}$'
        point:
          - {figure: 0, kind: highlight, target: XK, text: 'height'}
          - {figure: 0, kind: highlight, target: YZ, text: 'base'}
          - {figure: 0, kind: highlight, target: KZ, text: 'need this'}
      - say: 'Pythagoras: the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hypotenuse}^{2} = \text{opposite}^{2} + \text{adjacent}^{2}$'
      - say: 'In the diagram, triangle $XKZ$ has a right angle at $K$, with hypotenuse $XZ$. So by Pythagoras, $XK$ squared plus $KZ$ squared equals $XZ$ squared. Rearranged, $KZ$ squared is $XZ$ squared minus $XK$ squared.'
        write: '$KZ^{2} = XZ^{2} - XK^{2}$'
        point:
          - {figure: 0, kind: highlight, target: XZ, text: 'hypotenuse'}
      - say: 'Substitute the lengths: $XZ$ is 25 and $XK$ is 15.'
        write: '$KZ^{2} = 25^{2} - 15^{2}$'
        point:
          - {line: 4, kind: move, from: {line: 0, at: 'XZ=[[25]]'}, at: '[[25]]2', text: 'XZ'}
          - {line: 4, kind: move, from: {line: 0, at: 'XK=[[15]]'}, at: '[[15]]2', text: 'XK'}
      - say: '25 squared is 625, and 15 squared is 225.'
        write: '$= 625 - 225$'
      - say: '625 minus 225 is 400.'
        write: '$= 400$'
      - say: 'The square root of 400 is 20, so $KZ$ is 20 centimetres.'
        write: '$KZ = \sqrt{400} = 20$'
        point:
          - {figure: 0, kind: label, target: KZ, text: '20'}
      - say: 'So the whole base $YZ$ is $YK$ plus the $KZ$ we just found: 8 plus 20 is 28 centimetres.'
        write: '$YZ = YK + KZ = 8 + 20 = 28$'
        point:
          - {line: 8, kind: move, from: {line: 0, at: 'YK=[[8]]'}, at: '=[[8]]+', text: 'YK'}
          - {line: 8, kind: move, from: {line: 7, at: '=20'}, at: '+[[20]]', text: 'KZ'}
          - {figure: 0, kind: highlight, target: YZ, text: '28'}
      - say: 'Now the area, with base 28 and height 15: half times 28 times 15.'
        write: 'Area $= \tfrac{1}{2} \times 28 \times 15$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '=28'}, at: '28', text: 'base'}
          - {line: 9, kind: move, from: {line: 0, at: 'XK=[[15]]'}, at: '×[[15]]', text: 'height'}
          - {figure: 0, kind: highlight, target: YZ, text: 'base 28'}
      - say: 'Half of 28 is 14, and 14 times 15 is 210.'
        write: '$= 14 \times 15 = 210$'
      - say: 'So the area is 210 square centimetres, which is answer choice B.'
        write: 'Area of $\triangle XYZ = 210\ \text{cm}^{2}$'
        answer: true
    traps:
      A: 'You went for 180. The base is not complete. By Pythagoras KZ is 20, so the whole base is 8 plus 20, which is 28, and half of 28 times 15 is 210.'
      C: 'You went for 160. The height is XK, 15, and the base is YZ, 28. Half of 28 times 15 is 210.'
      D: 'You went for 320. Use the height XK, 15, with the full base, 28. Half of 28 times 15 is 210.'
      E: 'You went for 390. That is too big; check that you took half. Half of 28 times 15 is 14 times 15, which is 210.'
  34:
    moments:
      - say: 'Without tables, we want 1 plus sec squared 30 degrees.'
        write: '$1 + \sec^{2}30^{\circ}$'
      - say: 'Secant is 1 over cosine. So first we need the exact value of cos 30 degrees. Picture an equilateral triangle of side 2, cut in half.'
        doodle: {name: 'custom:1985_q34_a', id: tri, caption: 'half of an equilateral triangle', size: scene}
        write: '$\sec\theta = \dfrac{1}{\cos\theta}$'
      - say: 'Take an equilateral triangle of side 2 and cut it in half. The sides are 1, root 3 and 2, with angles 30, 60 and 90. Next to the 30 degree angle is root 3, and the hypotenuse is 2. Look at the yellow half.'
        doodle_do: [{id: tri, op: stage, stage: 'custom:1985_q34_a2'}]
        write: '$\cos 30^{\circ} = \dfrac{\sqrt{3}}{2}$'
      - say: 'So sec 30 degrees is 1 over root 3 over 2. Dividing by a fraction flips it: 2 over root 3.'
        doodle_do: [{id: tri, op: label, part: hyp, text: 'sec 30° = 2 ÷ root 3'}]
        write: '$\sec 30^{\circ} = \dfrac{1}{\sqrt{3}/2} = \dfrac{2}{\sqrt{3}}$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
          - {line: 3, kind: move, from: {line: 2, at: '=23'}, at: '3/2', text: 'cos 30°'}
      - say: 'Now square it. Square the top and the bottom: 2 squared is 4, and root 3 squared is 3.'
        write: '$\sec^{2}30^{\circ} = \left(\dfrac{2}{\sqrt{3}}\right)^{2} = \dfrac{4}{3}$'
      - say: 'Now go back to the question, and don''t forget the 1 at the front. We need 1 plus 4 over 3.'
        write: '$1 + \sec^{2}30^{\circ} = 1 + \dfrac{4}{3}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '=34'}, at: '+34', text: 'sec² 30°'}
      - say: 'To add, write the 1 as 3 over 3.'
        write: '$= \dfrac{3}{3} + \dfrac{4}{3}$'
      - say: '3 plus 4 is 7, so we have 7 over 3.'
        write: '$= \dfrac{7}{3}$'
      - say: '3 goes into 7 twice, with 1 left over. So 7 over 3 is 2 and a third.'
        write: '$= 2\tfrac{1}{3}$'
      - say: 'A check using an identity: sec squared is 1 plus tan squared. Tan 30 degrees is 1 over root 3, so tan squared is 1 over 3, and 1 plus 1 over 3 is 4 over 3, as we found. In the yellow half, that is 1 over root 3.'
        doodle_do: [{id: tri, op: highlight, part: opp}]
        write: 'Check: $\sec^{2}30^{\circ} = 1 + \tan^{2}30^{\circ} = 1 + \dfrac{1}{3} = \dfrac{4}{3}$'
      - say: 'So 1 plus sec squared 30 degrees is 2 and a third, which is answer choice A.'
        write: '$1 + \sec^{2}30^{\circ} = 2\tfrac{1}{3}$'
        answer: true
    traps:
      B: 'You went for 2. Sec squared 30 degrees is 4 over 3, not 1. Add the 1 at the front: 1 plus 4 over 3 is 7 over 3, which is 2 and a third.'
      C: 'You went for 1 and a third. That is sec squared 30 degrees on its own. The question adds 1 more, giving 2 and a third.'
      D: 'You went for three quarters. That is cos squared 30 degrees. Secant is 1 over cosine, so sec squared is 4 over 3, and adding 1 gives 2 and a third.'
      E: 'You went for 3 over 7. That is the right answer turned upside down. 1 plus 4 over 3 is 7 over 3.'
  35:
    moments:
      - say: 'A number is chosen at random from the integers 1 to 10. We want the probability that it is a prime or a multiple of 3.'
        write: 'Numbers: $1,\ 2,\ 3,\ \ldots,\ 10$'
      - say: 'Let me draw a Venn diagram, so we can see where everything belongs.'
        show_sketch: true
      - say: 'There are 10 numbers, all equally likely.'
        write: 'Total outcomes $= 10$'
      - say: 'First the primes. A prime has exactly two factors, 1 and itself. So 1 is not prime, because it has only one factor. The primes are 2, 3, 5 and 7.'
        write: 'Primes: $2,\ 3,\ 5,\ 7$'
        point:
          - {figure: sketch, kind: circle, target: Prime, text: '2, 3, 5, 7'}
      - say: 'Next, the multiples of 3 up to 10: 3, 6 and 9.'
        write: 'Multiples of 3: $3,\ 6,\ 9$'
        point:
          - {figure: sketch, kind: circle, target: 'Multiple of 3', text: '3, 6, 9'}
      - say: 'Now combine the two lists. The number 3 is in both, so we write it only once.'
        write: 'Prime or multiple of 3: $2,\ 3,\ 5,\ 6,\ 7,\ 9$'
        point:
          - {line: 3, kind: circle, at: '3,5', text: 'in both'}
          - {line: 4, kind: circle, at: '3,6'}
          - {figure: sketch, kind: circle, target: '3', text: 'in both'}
      - say: 'Count them: that is 6 numbers.'
        write: 'Favourable outcomes $= 6$'
      - say: 'Probability is the number of favourable outcomes over the total number of outcomes.'
        write: 'Probability: $P = \dfrac{\text{favourable outcomes}}{\text{total outcomes}}$'
      - say: 'So the probability is 6 over 10. Both divide by 2, so it simplifies to 3 over 5.'
        write: '$P = \dfrac{6}{10} = \dfrac{3}{5}$'
        point:
          - {line: 8, kind: move, from: {line: 6, at: '=6'}, at: '10[[6]]'}
          - {line: 8, kind: move, from: {line: 2, at: '=10'}, at: '[[10]]6'}
      - say: 'The addition rule: the probability of A or B is the probability of A, plus the probability of B, minus the probability of both.'
        write: 'Addition rule: $P(A \text{ or } B) = P(A) + P(B) - P(A \text{ and } B)$'
      - say: 'The same with the addition rule: 4 over 10 for the primes, plus 3 over 10 for the multiples of 3, minus 1 over 10 for the number 3 we counted twice. That is 6 over 10.'
        write: 'Check: $\tfrac{4}{10} + \tfrac{3}{10} - \tfrac{1}{10} = \tfrac{6}{10}$'
      - say: 'So the probability is 3 over 5, which is answer choice B.'
        write: '$P = \tfrac{3}{5}$'
        answer: true
    traps:
      A: 'You went for 7 over 10. That adds 4 primes and 3 multiples of 3, but 3 is in both lists and gets counted twice. Count it once: 6 numbers.'
      C: 'You went for 4 over 5, which is 8 numbers. Only 2, 3, 5, 6, 7 and 9 qualify. Remember 1 is not a prime.'
      D: 'You went for a half, which is 5 numbers. Recount: 2, 3, 5, 6, 7 and 9 make 6.'
      E: 'You went for 3 over 10. That counts only the multiples of 3. The primes 2, 5 and 7 count too, giving 6 out of 10.'
  36:
    moments:
      - say: 'A regular hexagon is drawn inside a circle of radius 8 centimetres. We want the area of the hexagon.'
