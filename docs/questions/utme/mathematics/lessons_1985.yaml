  14:
    moments:
      - say: 'We''re given the series for $e$ to the $x$: 1 plus $x$ plus $x$ squared over 1 times 2, plus $x$ cubed over 1 times 2 times 3, and so on. We want 1 over $e$ to the $x$ over 2.'
        write: '$e^{x} = 1 + x + \dfrac{x^{2}}{1 \cdot 2} + \dfrac{x^{3}}{1 \cdot 2 \cdot 3} + \cdots$'
      - say: 'First, 1 over $e$ to a power is $e$ to the negative of that power. So 1 over $e$ to the $x$ over 2 is $e$ to the negative $x$ over 2.'
        write: '$\dfrac{1}{e^{x/2}} = e^{-x/2}$'
      - say: 'The series works for anything we put in place of $x$. So we replace every $x$ with negative $x$ over 2, sign and all.'
      - say: 'The first term is just 1.'
        write: '$\text{1st term: } 1$'
      - say: 'The second term is $x$, so it becomes negative $x$ over 2.'
        write: '$\text{2nd term: } -\dfrac{x}{2}$'
      - say: 'The third term is $x$ squared over 1 times 2. Negative $x$ over 2, squared, is $x$ squared over 4. The square removes the minus.'
        write: '$\left(-\dfrac{x}{2}\right)^{2} = \dfrac{x^{2}}{4}$'
      - say: 'Now divide by 1 times 2. $x$ squared over 4 times 2 is $x$ squared over 8, and 8 is 2 cubed.'
        write: '$\dfrac{x^{2}}{4 \times 2} = \dfrac{x^{2}}{1 \cdot 2^{3}}$'
      - say: 'The fourth term is $x$ cubed over 1 times 2 times 3. Negative $x$ over 2, cubed, is negative $x$ cubed over 8. A cube keeps the minus.'
        write: '$\left(-\dfrac{x}{2}\right)^{3} = -\dfrac{x^{3}}{8}$'
      - say: 'Now divide by 1 times 2 times 3, which is 6. 8 times 6 is 48, and 48 is 2 to the 4, which is 16, times 3.'
        write: '$-\dfrac{x^{3}}{8 \times 6} = -\dfrac{x^{3}}{2^{4} \cdot 3}$'
      - say: 'Put the terms together. The signs alternate: plus, minus, plus, minus.'
        write: '$1 - \dfrac{x}{2} + \dfrac{x^{2}}{1 \cdot 2^{3}} - \dfrac{x^{3}}{2^{4} \cdot 3} + \cdots$'
      - say: 'So that is the series for 1 over $e$ to the $x$ over 2, which is answer choice A.'
        write: '$\dfrac{1}{e^{x/2}} = 1 - \dfrac{x}{2} + \dfrac{x^{2}}{1 \cdot 2^{3}} - \cdots$'
        answer: true
    traps:
      B: 'You went for all plus signs with 2 squared and 2 cubed. The signs are wrong, and so are the powers of 2: you need to replace x with negative x over 2, then divide by the factorials too.'
      C: 'You went for plus x over 2. Replacing x with negative x over 2 makes the second term negative x over 2. Odd powers keep the minus sign.'
      D: 'You went for 2 squared and 2 cubed on the bottom. The signs are right, but you still need to divide by the 1 times 2 and 1 times 2 times 3: x squared over 4, over 2, is x squared over 8.'
      E: 'You went for all plus signs. That is the series for e to the x over 2 itself, before taking 1 over it. Replace x with negative x over 2, and the signs alternate.'
  15:
    moments:
      - say: 'We want to simplify $4\sqrt{3}$ plus $4\sqrt{2}$, over $4\sqrt{3}$ minus $4\sqrt{2}$, all times root 3 minus root 2.'
        write: '$\dfrac{4\sqrt{3} + 4\sqrt{2}}{4\sqrt{3} - 4\sqrt{2}} \times (\sqrt{3} - \sqrt{2})$'
