      - say: 'Now let me join the centre $O$ to each of the six corners. Every one of those lines is a radius, 8 centimetres long.'
        show_sketch: sketch_b
        point:
          - {figure: sketch_b, kind: circle, target: '8 cm', text: 'radius'}
      - say: 'Because the hexagon is regular, those six radii cut it into six identical triangles.'
        write: 'Hexagon $= 6$ identical triangles'
        point:
          - {figure: sketch_b, kind: circle, target: O, text: 'centre'}
          - {figure: sketch_b, kind: highlight, target: OA}
          - {figure: sketch_b, kind: highlight, target: OB}
      - say: 'The angles at the centre share out the full 360 degrees. 360 divided by 6 is 60 degrees each.'
        write: 'Angle at centre $= 360^{\circ} \div 6 = 60^{\circ}$'
        point:
          - {figure: sketch_b, kind: arc, target: AOB, text: '60°'}
      - say: 'Each triangle has two sides equal to the radius, 8, with 60 degrees between them. A triangle like that is equilateral, so every side is 8.'
        write: 'Each triangle: sides $8,\ 8,\ 8$ (equilateral)'
        point:
