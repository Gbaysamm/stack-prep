      - say: 'And the two triangles together make the whole trapezium: 6 plus 8 is 14. It fits.'
        write: '$6 + 8 = 14 \ \checkmark$'
      - say: 'So the area of triangle $SQR$ is 6.0 square centimetres, which is answer choice B.'
