      C: 'You went for 3a squared. That is HN squared. Take the square root to get the length: a root 3.'
      D: 'You went for a root 2. That is the diagonal across one face, HJ. Go up by a as well: the square root of 2a squared plus a squared is a root 3.'
  42:
    moments:
      - say: '$PQRS$ is a trapezium of area 14 square centimetres, with $PQ$ parallel to $RS$. $PQ$ is 4 and $SR$ is 3 centimetres. We want the area of triangle $SQR$.'
