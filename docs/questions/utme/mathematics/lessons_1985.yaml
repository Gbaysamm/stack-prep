          - {figure: sketch_b, kind: label, target: AOB, text: '16√3 each'}
      - say: '6 times 16 is 96.'
        write: '$= 96\sqrt{3}\ \text{cm}^{2}$'
      - say: 'A sense check: 96 root 3 is about 166, and the circle''s area is 64 pi, about 201. The hexagon fits inside the circle, so it must be smaller. Good.'
        write: '$96\sqrt{3} \approx 166 < 64\pi \approx 201$'
      - say: 'So the area is 96 root 3 square centimetres, which is answer choice B.'
        write: 'Area $= 96\sqrt{3}\ \text{cm}^{2}$'
        answer: true
    traps:
      A: 'You went for 16 root 3. That is only one of the six triangles. Multiply by 6 to get 96 root 3.'
      C: 'You went for 192 root 3. That forgets the half in the triangle area formula. Each triangle is half of 8 times 8 times sin 60, which is 16 root 3, and six of them make 96 root 3.'
      D: 'You went for 16. That leaves out the root 3 from sin 60 degrees, and the factor of 6. The area is 96 root 3.'
      E: 'You went for 32. That is half of 64, before multiplying by sin 60 degrees and by 6 triangles. The full area is 96 root 3.'
  37:
    moments:
      - say: '$MNQP$ is a cyclic quadrilateral. $MN$ and $PQ$ meet at $X$, and $NQ$ and $MP$ meet at $Y$. Angle $MNQ$ is 86 and angle $NQP$ is 122 degrees. We want the angles $x$ and $y$.'
        write: '$\angle MNQ = 86^{\circ},\quad \angle NQP = 122^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: MNQ, text: '86°'}
          - {figure: 0, kind: arc, target: NQP, text: '122°'}
      - say: 'The key fact: in a cyclic quadrilateral, opposite angles add up to 180 degrees.'
        write: 'Cyclic quadrilateral: opposite angles add to $180^{\circ}$'
      - say: 'The angle at $N$ is 86, so the opposite angle, at $P$, is 180 minus 86, which is 94 degrees.'
        write: '$\angle MPQ = 180^{\circ} - 86^{\circ} = 94^{\circ}$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
          - {figure: 0, kind: arc, target: MPQ, text: '94°'}
      - say: 'The angle at $Q$ is 122, so the opposite angle, at $M$, is 180 minus 122, which is 58 degrees.'
        write: '$\angle NMP = 180^{\circ} - 122^{\circ} = 58^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: NMP, text: '58°'}
      - say: 'Now look at $X$ in the diagram. The lines $MN$ and $PQ$ meet there, so $M$, $X$ and $P$ make a triangle. Its angle at $M$ is the 58 degrees we found, and its angle at $P$ is the 94 degrees.'
        write: 'In $\triangle MXP$: $\angle M = 58^{\circ},\ \angle P = 94^{\circ}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '=58∘'}, at: '58∘'}
          - {line: 4, kind: move, from: {line: 2, at: '=94∘'}, at: '94∘'}
          - {figure: 0, kind: arc, target: MXP, text: 'x'}
      - say: 'The rule: the three angles of any triangle add up to 180 degrees.'
        write: 'Angle sum of a triangle: $A + B + C = 180^{\circ}$'
      - say: 'The angles of a triangle add to 180, so $x$ is 180 minus 58 minus 94.'
        write: '$x = 180^{\circ} - 58^{\circ} - 94^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: NMP, text: '58°'}
          - {figure: 0, kind: arc, target: MPQ, text: '94°'}
          - {figure: 0, kind: arc, target: MXP, text: 'x'}
      - say: '58 plus 94 is 152, and 180 minus 152 is 28.'
        write: '$= 180^{\circ} - 152^{\circ} = 28^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: MXP, text: 'x = 28°'}
      - say: 'Now look at $Y$. The lines $NQ$ and $MP$ meet there, so $M$, $N$ and $Y$ make a triangle. Its angle at $M$ is again 58 degrees, and its angle at $N$ is the given 86 degrees.'
        write: 'In $\triangle MNY$: $\angle M = 58^{\circ},\ \angle N = 86^{\circ}$'
        point:
