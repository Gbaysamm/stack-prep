        write: '$= \dfrac{\sqrt{3} + \sqrt{2}}{\sqrt{3} - \sqrt{2}}$'
      - say: 'Now bring back the last factor, root 3 minus root 2.'
        write: '$\dfrac{\sqrt{3} + \sqrt{2}}{\sqrt{3} - \sqrt{2}} \times (\sqrt{3} - \sqrt{2})$'
