  18:
    moments:
      - say: 'We want $y$ if 3 to the $2y$ minus 6 times 3 to the $y$ equals 27.'
        write: '$3^{2y} - 6(3^{y}) = 27$'
      - say: 'Here''s the key idea: 3 to the $2y$ is the same as 3 to the $y$, squared. So this is a quadratic in disguise.'
        write: '$3^{2y} = (3^{y})^{2}$'
      - say: 'Let''s make it clearer. Let $u$ stand for 3 to the $y$.'
