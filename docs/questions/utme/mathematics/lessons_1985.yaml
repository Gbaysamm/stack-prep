        write: '$3 - B = 3 - (x^{2} - 3x - 1) = 3 - x^{2} + 3x + 1$'
      - say: '3 plus 1 is 4. So it is negative $x$ squared plus $3x$ plus 4.'
        write: '$= -x^{2} + 3x + 4$'
      - say: 'Take out a minus sign to make the $x$ squared positive. Every sign inside flips.'
        write: '$= -(x^{2} - 3x - 4)$'
      - say: 'Now factorise. We need two numbers that multiply to negative 4 and add to negative 3. Negative 4 times 1 is negative 4, and negative 4 plus 1 is negative 3.'
        write: '$= -(x - 4)(x + 1)$'
      - say: 'Now the second bracket, 3 plus $B$: 3 plus $x$ squared minus $3x$ minus 1. 3 minus 1 is 2.'
        write: '$3 + B = 3 + x^{2} - 3x - 1 = x^{2} - 3x + 2$'
      - say: 'Two numbers that multiply to 2 and add to negative 3: negative 1 and negative 2.'
        write: '$= (x - 1)(x - 2)$'
      - say: 'Now go back to 3 minus $B$, times 3 plus $B$, and put in the two factorised brackets, keeping the minus sign in front.'
        write: '$9 - (x^{2} - 3x - 1)^{2} = -(x - 4)(x + 1)(x - 1)(x - 2)$'
        point:
          - {line: 9, kind: move, from: {line: 6, at: '−(x−4)(x+1)'}, at: '−(x−4)(x+1)', text: '3 − B'}
          - {line: 9, kind: move, from: {line: 8, at: '(x−1)(x−2)'}, at: '(x−1)(x−2)', text: '3 + B'}
      - say: 'Let''s check with $x$ equals zero. In the original, the bracket is negative 1, and its square is 1. So we get 9 minus 1, which is 8.'
        write: 'Check $x = 0$: $9 - (-1)^{2} = 9 - 1 = 8$'
      - say: 'Now the factors at $x$ equals zero: negative 4 times 1 is negative 4, times negative 1 is 4, times negative 2 is negative 8. And the minus in front makes it 8. They agree.'
        write: '$-(-4)(1)(-1)(-2) = -(-8) = 8 \ \checkmark$'
      - say: 'So the factors are minus, $x$ minus 4, times $x$ plus 1, times $x$ minus 1, times $x$ minus 2, which is answer choice A.'
        write: '$= -(x - 4)(x + 1)(x - 1)(x - 2)$'
        answer: true
    traps:
      B: 'You went for (x minus 4)(x minus 1)(x minus 1)(x plus 2). Test x equals 0: that gives negative 8, but the original is 8. The first bracket is negative (x minus 4)(x plus 1).'
      C: 'You went for negative (x minus 2)(x plus 1)(x plus 2)(x plus 4). At x equals 0 it gives 16, not 8. Factor 3 minus B and 3 plus B carefully.'
      D: 'You went for (x minus 4)(x minus 3)(x minus 2)(x plus 1). At x equals 0 that gives negative 24, not 8. The second bracket, x squared minus 3x plus 2, is (x minus 1)(x minus 2).'
      E: 'You went for (x minus 2)(x plus 2)(x minus 1)(x plus 1). That is the factors of (x squared minus 1)(x squared minus 4), a different expression. At x equals 0 it gives 4, not 8.'
  18:
    moments:
