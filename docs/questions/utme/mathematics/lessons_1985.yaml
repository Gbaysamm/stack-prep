      C: 'You went for 2 to the 17 times (root 2 plus 2). The root 2s cancel completely when you divide by the diameter, so the answer is a whole power of 2: 2 to the 18.'
      D: 'You went for 2 to the 10 times (1 plus root 2). That is far too few. Along the length alone, 2 to the 17 discs fit, and there are 2 rows.'
      E: 'You went for 2 to the 9 times (root 2 plus 1). The root 2 cancels when you divide by the diameter. The count is 2 to the 17 times 2, which is 4 to the 9.'
  46:
