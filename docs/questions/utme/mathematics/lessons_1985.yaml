      - say: 'Let''s pair the two terms with $b$, and the two terms with $y$.'
        write: '$= (abx^{2} - 4bx) + (8y - 2axy)$'
      - say: 'In the first pair, both terms have $bx$. Take it out: $abx$ squared over $bx$ is $ax$, and $4bx$ over $bx$ is 4. So we get $bx$ times $ax$ minus 4.'
        write: '$abx^{2} - 4bx = bx(ax - 4)$'
      - say: 'In the second pair, both terms have $2y$. We want the same bracket, $ax$ minus 4, so take out negative $2y$. Negative $2y$ times $ax$ is negative $2axy$, and negative $2y$ times negative 4 is $8y$.'
        write: '$8y - 2axy = -2y(ax - 4)$'
      - say: 'Now put the two pairs we just factorised back together.'
        write: '$= bx(ax - 4) - 2y(ax - 4)$'
        point:
