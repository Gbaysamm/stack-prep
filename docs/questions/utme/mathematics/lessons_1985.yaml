      - say: '3 times 4 is 12, and half of 12 is 6.'
        write: '$= \tfrac{1}{2} \times 12 = 6$'
      - say: 'Check: the other triangle, $PQS$, has base $PQ$, which is 4, and the same height 4. So its area is half of 4 times 4, which is 8.'
