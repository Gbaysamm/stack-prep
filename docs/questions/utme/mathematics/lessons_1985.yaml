  16:
    moments:
      - say: 'The cost per head is partly constant and partly inversely proportional to the number of people. For 100 people it is 30k; for 40 people it is 60k. We want the cost per head for 50 people.'
        write: '100 people: 30k each; 40 people: 60k each'
      - say: 'First, translate. "Partly constant" is a fixed number, call it $a$. "Partly inversely proportional" is a number $b$ divided by the number of people, $n$. So the cost per head is $a$ plus $b$ over $n$.'
        write: '$C = a + \dfrac{b}{n}$'
      - say: 'Now use the first fact. For 100 people the cost is 30, so put $n$ equals 100 and $C$ equals 30 into the rule.'
        write: '$n = 100:\ 30 = a + \dfrac{b}{100}$'
        point:
          - {line: 2, kind: move, from: {line: 0, at: '[[100]]people'}, at: 'n=[[100]]', text: 'n'}
          - {line: 2, kind: move, from: {line: 0, at: '[[30]]keach'}, at: '[[30]]=', text: 'C'}
      - say: 'The second fact: for 40 people the cost is 60.'
        write: '$n = 40:\ 60 = a + \dfrac{b}{40}$'
        point:
          - {line: 3, kind: move, from: {line: 0, at: '[[40]]people'}, at: 'n=[[40]]', text: 'n'}
          - {line: 3, kind: move, from: {line: 0, at: '[[60]]keach'}, at: '[[60]]=', text: 'C'}
      - say: 'Take the second equation minus the first. The $a$s cancel, and 60 minus 30 is 30.'
        write: '$60 - 30 = \dfrac{b}{40} - \dfrac{b}{100}$'
      - say: 'Use a common denominator of 200. $b$ over 40 is $5b$ over 200, and $b$ over 100 is $2b$ over 200. $5b$ minus $2b$ is $3b$.'
        write: '$30 = \dfrac{5b}{200} - \dfrac{2b}{200} = \dfrac{3b}{200}$'
      - say: 'Multiply both sides by 200. 30 times 200 is 6000, so $3b$ is 6000.'
        write: '$3b = 30 \times 200 = 6000$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '[[200]]3b'}, at: '×[[200]]', text: 'across'}
      - say: 'Divide by 3. 6000 divided by 3 is 2000.'
        write: '$b = 6000 \div 3 = 2000$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '[[3]]b'}, at: '÷3', text: 'across'}
      - say: 'Now find $a$. Go back to the first equation and put in $b$ equals 2000.'
        write: '$30 = a + \dfrac{2000}{100}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '=2000'}, at: '100[[2000]]', text: 'b'}
      - say: '2000 over 100 is 20, so 30 equals $a$ plus 20.'
        write: '$30 = a + 20$'
      - say: 'Subtract 20 from both sides: $a$ is 10.'
        write: '$a = 30 - 20 = 10$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '+20'}, at: '−20', text: 'across'}
      - say: 'So, with the $a$ and $b$ we found, the rule is: cost equals 10 plus 2000 over $n$.'
        write: '$C = 10 + \dfrac{2000}{n}$'
        point:
          - {line: 1, kind: arrow, text: 'the rule'}
          - {line: 11, kind: move, from: {line: 10, at: '=10'}, at: '=[[10]]+', text: 'a'}
          - {line: 11, kind: move, from: {line: 7, at: '=2000'}, at: 'n[[2000]]', text: 'b'}
      - say: 'Now the question: 50 people. Put $n$ equals 50 into the rule.'
        write: '$n = 50:\ C = 10 + \dfrac{2000}{50}$'
      - say: '2000 divided by 50 is 40, and 10 plus 40 is 50.'
        write: '$= 10 + 40 = 50$'
      - say: 'That sits between 30k and 60k, as it should, since 50 people is between 40 and 100. So the cost is 50k, which is answer choice D.'
        write: '$C = 50\text{k}$'
        answer: true
    traps:
      A: 'You went for 15k. With more people than 40 but fewer than 100, the cost per head must lie between 30k and 60k. The rule 10 plus 2000 over n gives 50k.'
      B: 'You went for 45k, the average of 30k and 60k. The cost does not change evenly with the number of people. Use the rule: 10 plus 2000 over 50 is 50k.'
      C: 'You went for 20k. That is 2000 over 100, the varying part for 100 people. For 50 people it is 2000 over 50, which is 40, plus the constant 10, making 50k.'
      E: 'You went for 40k. That is the varying part only, 2000 over 50. Don''t forget to add the constant part, 10k, which gives 50k.'
  17:
    moments:
      - say: 'We want the factors of 9 minus the square of $x$ squared minus $3x$ minus 1.'
        write: '$9 - (x^{2} - 3x - 1)^{2}$'
      - say: 'Notice that 9 is 3 squared. So this is one square minus another square: a difference of two squares.'
        write: '$3^{2} - B^{2},\quad B = x^{2} - 3x - 1$'
      - say: 'A difference of two squares factors as 3 minus $B$, times 3 plus $B$.'
