        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '14 cm²', text: 'area'}
      - say: 'The trapezium''s area is given for a reason: it tells us the height. The area of a trapezium is half the sum of the parallel sides, times the height.'
        write: '$\text{Area} = \tfrac{1}{2}(a + b)h$'
        point:
          - {figure: sketch, kind: circle, target: '14 cm²', text: 'area'}
          - {figure: sketch, kind: highlight, target: PQ, text: 'parallel'}
          - {figure: sketch, kind: highlight, target: SR, text: 'parallel'}
      - say: 'Substitute: the parallel sides are 4 and 3, and the area is 14. So 14 equals a half, times 4 plus 3, times $h$.'
        write: '$14 = \tfrac{1}{2}(4 + 3)h$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {line: 3, kind: move, from: {line: 0, at: 'PQ=[[4]]'}, at: '([[4]]+3)', text: 'PQ'}
          - {line: 3, kind: move, from: {line: 0, at: 'SR=[[3]]'}, at: '(4+[[3]])', text: 'SR'}
      - say: '4 plus 3 is 7, and a half of 7 is 7 over 2.'
        write: '$14 = \tfrac{7}{2}h$'
      - say: 'Multiply both sides by 2: 14 times 2 is 28, so 28 equals $7h$.'
        write: '$7h = 14 \times 2 = 28$'
      - say: 'Divide by 7: 28 divided by 7 is 4. So the height is 4 centimetres.'
        write: '$h = 28 \div 7 = 4$'
        point:
          - {figure: sketch, kind: label, target: h, text: '4 cm'}
      - say: 'Now triangle $SQR$. Its base is $SR$, which is 3. Its third corner, $Q$, lies on the other parallel side, so its height is the same 4 centimetres we just found.'
