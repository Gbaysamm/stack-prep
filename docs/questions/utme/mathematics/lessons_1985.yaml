        write: '$= -(x - 4)(x + 1)$'
      - say: 'Now the second bracket: 3 plus $x$ squared minus $3x$ minus 1. 3 minus 1 is 2.'
        write: '$3 + (x^{2} - 3x - 1) = x^{2} - 3x + 2$'
      - say: 'Two numbers that multiply to 2 and add to negative 3: negative 1 and negative 2.'
        write: '$= (x - 1)(x - 2)$'
      - say: 'Put the two brackets together, keeping the minus sign in front.'
        write: '$-(x - 4)(x + 1)(x - 1)(x - 2)$'
      - say: 'Let''s check with $x$ equals zero. The original is 9 minus 1, which is 8. The factors give negative, times negative 4, times 1, times negative 1, times negative 2, which is also 8.'
        write: '$-(-4)(1)(-1)(-2) = 8$'
      - say: 'So the factors are negative $x$ minus 4, times $x$ plus 1, times $x$ minus 1, times $x$ minus 2, which is answer choice A.'
        write: '$-(x - 4)(x + 1)(x - 1)(x - 2)$'
        answer: true
