    moments:
      - say: 'The table gives the scores of students in a test. We want the pair $S$, $m$: $S$ is how many scored 4 or less, and $m$ is the mode.'
        write: '$(S,\ m)$'
      - say: 'Start with the mode. The mode is the score with the highest frequency. The frequencies are 2, 4, 7, 14, 12, 6, 4 and 1.'
        write: '$2,\ 4,\ 7,\ 14,\ 12,\ 6,\ 4,\ 1$'
      - say: 'The biggest is 14, and it''s under the score 4. So the mode is 4.'
        write: '$m = 4$'
      - say: 'Now $S$. Scored 4 or less means the scores 1, 2, 3 and 4. It includes 4 itself.'
        write: '$\text{scores } 1,\ 2,\ 3,\ 4$'
      - say: 'Add their frequencies: 2 plus 4 plus 7 plus 14.'
        write: '$S = 2 + 4 + 7 + 14$'
      - say: '2 plus 4 is 6. 6 plus 7 is 13. 13 plus 14 is 27.'
        write: '$S = 27$'
      - say: 'Let''s check from the other end. Those who scored more than 4: 12 plus 6 plus 4 plus 1 is 23. The total is 27 plus 23, which is 50, and all the frequencies do add to 50.'
        write: '$12 + 6 + 4 + 1 = 23,\ \ 27 + 23 = 50$'
      - say: 'So $S$, $m$ is 27, 4, which is answer choice A.'
        write: '$(S,\ m) = (27,\ 4)$'
        answer: true
    traps:
      B: 'You went for 14, 4. The 14 is the number who scored exactly 4. But $S$ is 4 or less, which adds the scores 1, 2 and 3 as well: 2 plus 4 plus 7 plus 14 is 27.'
      C: 'You went for 13, 4. That counts the scores below 4 only. "4 or less" includes the 14 students who scored 4, so $S$ is 13 plus 14, which is 27.'
      D: 'You went for 4, 4. The mode is 4, but $S$ is a count of students, not a score. Add the frequencies for scores 1 to 4: 27.'
