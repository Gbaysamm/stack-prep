        write: 'Check: $\ \dfrac{185}{900} \times 360 = \dfrac{185 \times 2}{5} = \dfrac{370}{5} = 74$'
      - say: 'One more check with Oyo: 225 times 0.4 is 90 degrees, a quarter of the circle. And 225 is a quarter of 900. That fits.'
        write: 'Oyo $= 225 \times 0.4^{\circ} = 90^{\circ}$'
