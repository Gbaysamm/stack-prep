  32:
    moments:
      - say: 'We''re told cos theta is $a$ over $b$, and we want 1 plus tan squared theta.'
        write: '$\cos\theta = \dfrac{a}{b}$'
      - say: 'This uses one of the most important identities in trigonometry. Start with sine squared plus cos squared equals 1.'
        write: '$\sin^{2}\theta + \cos^{2}\theta = 1$'
      - say: 'Divide every term by cos squared theta.'
        write: '$\dfrac{\sin^{2}\theta}{\cos^{2}\theta} + \dfrac{\cos^{2}\theta}{\cos^{2}\theta} = \dfrac{1}{\cos^{2}\theta}$'
      - say: 'Sine over cos is tan, so the first term is tan squared. And cos squared over cos squared is 1.'
        write: '$\tan^{2}\theta + 1 = \dfrac{1}{\cos^{2}\theta}$'
      - say: 'So 1 plus tan squared is exactly 1 over cos squared. That''s what we want.'
        write: '$1 + \tan^{2}\theta = \dfrac{1}{\cos^{2}\theta}$'
      - say: 'Cos theta is $a$ over $b$, so cos squared is $a$ squared over $b$ squared.'
        write: '$\cos^{2}\theta = \dfrac{a^{2}}{b^{2}}$'
      - say: '1 divided by a fraction is that fraction turned upside down. So we get $b$ squared over $a$ squared.'
        write: '$1 + \tan^{2}\theta = \dfrac{1}{a^{2}/b^{2}} = \dfrac{b^{2}}{a^{2}}$'
        point:
          - {line: 4, kind: box, text: 'identity'}
          - {line: 6, kind: move, from: {line: 5, at: 'b2a2'}, at: 'a2/b2', text: 'cos² θ'}
      - say: 'Let me draw a right-angled triangle for $\theta$.'
        show_sketch: true
      - say: 'Let''s check with a right-angled triangle. Cos is adjacent over hypotenuse, so take adjacent $a$ and hypotenuse $b$. By Pythagoras, the opposite side is the root of $b$ squared minus $a$ squared.'
        write: 'Opposite $= \sqrt{b^{2} - a^{2}}$'
        point:
          - {figure: sketch, kind: highlight, target: [A, B], text: 'adjacent a'}
          - {figure: sketch, kind: highlight, target: [A, C], text: 'hypotenuse b'}
          - {figure: sketch, kind: circle, target: '?', text: 'opposite'}
      - say: 'Tan is opposite over adjacent, so tan squared is $b$ squared minus $a$ squared, over $a$ squared.'
        write: '$\tan^{2}\theta = \dfrac{b^{2} - a^{2}}{a^{2}}$'
        point:
          - {figure: sketch, kind: circle, target: 'θ'}
          - {figure: sketch, kind: label, target: '?', text: '√(b² − a²)'}
      - say: 'Add 1, written as $a$ squared over $a$ squared. The top becomes $b$ squared minus $a$ squared plus $a$ squared, which is $b$ squared.'
        write: '$1 + \tan^{2}\theta = \dfrac{a^{2} + b^{2} - a^{2}}{a^{2}} = \dfrac{b^{2}}{a^{2}}$'
      - say: 'Both ways agree. So 1 plus tan squared theta is $b$ squared over $a$ squared, which is answer choice A.'
        write: '$1 + \tan^{2}\theta = \dfrac{b^{2}}{a^{2}}$'
        answer: true
    traps:
      B: 'You went for $a$ squared over $b$ squared. That''s cos squared theta itself. 1 plus tan squared is 1 over cos squared, so you need to turn it upside down: $b$ squared over $a$ squared.'
      C: 'You went for $a$ squared plus $b$ squared over $b$ squared minus $a$ squared. Use the identity: 1 plus tan squared is 1 over cos squared, which is $b$ squared over $a$ squared.'
      D: 'You went for $2a$ squared plus $b$ squared over $a$ squared plus $b$ squared. Divide sine squared plus cos squared equals 1 by cos squared, and you get 1 plus tan squared equals $b$ squared over $a$ squared.'
