      - say: 'Now we have two simultaneous equations. Subtract the first from the second, so the $x$ terms cancel.'
        write: '$(x + 3y) - (x + 2y) = 2 - 1$'
      - say: '$3y$ minus $2y$ is $y$, and 2 minus 1 is 1.'
