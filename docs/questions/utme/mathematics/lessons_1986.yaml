  46:
    moments:
      - say: 'We want the median of ten numbers: 89, 141, 130, 161, 120, 131, 131, 100, 108 and 119. Picture them as ten cards.'
        doodle: {name: 'custom:1986_q46_a', id: cards, caption: 'ten number cards', size: scene}
        write: '$89,\ 141,\ 130,\ 161,\ 120,\ 131,\ 131,\ 100,\ 108,\ 119$'
      - say: 'The median is the middle value once the data is in order. So the first job is always to sort the numbers from smallest to largest.'
      - say: 'In order, they are: 89, 100, 108, 119, 120, 130, 131, 131, 141, 161. The cards are now in order.'
        doodle_do: [{id: cards, op: stage, stage: 'custom:1986_q46_a2'}]
        write: 'In order: $\ 89,\ 100,\ 108,\ 119,\ 120,\ 130,\ 131,\ 131,\ 141,\ 161$'
      - say: 'Picture ten people in a line, one for each number. Now count them. There are 10 numbers.'
