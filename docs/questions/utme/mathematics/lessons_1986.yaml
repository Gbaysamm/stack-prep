  38:
    moments:
      - section: 'The question'
        say: 'A circle has radius 6 cm, and a piece of its edge 8 cm long is marked off. Join both ends to the centre. How much area is in that slice?'
        write: 'Find the area of the sector.'
      - say: 'Write Solution, then sketch the sector: centre O, radius 6 cm, and an arc AB 8 cm long.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: OA, text: 'r = 6', 'on': 'radius 6 cm'}
          - {figure: sketch, kind: circle, target: '8 cm', text: 'L = 8', 'on': 'arc AB'}
      - section: 'What we know'
        say: 'List the givens: r is 6 cm, the arc length L is 8 cm. The angle theta is not given, so we find it first.'
        write: '$r = 6$ cm, $L = 8$ cm, $\theta = ?$'
      - section: 'Find the angle'
        say: 'Length of arc: L equals theta over 360, times 2 pi r.'
        write: '$L = \dfrac{\theta}{360} \times 2\pi r$'
      - say: 'Substitute: L is 8 and r is 6.'
        write: '$8 = \dfrac{\theta}{360} \times 2\pi \times 6$'
      - say: 'We do not need theta itself, only the fraction theta over 360. 2 pi times 6 is 12 pi, so divide both sides by 12 pi.'
        write: '$\dfrac{\theta}{360} = \dfrac{8}{12\pi} = \dfrac{2}{3\pi}$'
      - section: 'The area'
        say: 'Area of a sector: A equals theta over 360, times pi r squared.'
        write: '$A = \dfrac{\theta}{360} \times \pi r^{2}$'
      - say: 'Substitute: theta over 360 is 2 over 3 pi, and r is 6.'
        write: '$A = \dfrac{2}{3\pi} \times \pi \times 6^{2}$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '=[[3π2]]'}, at: '3π2', text: 'θ/360', 'on': '2 over 3 pi'}
      - say: 'The pi cancels. 6 squared is 36, and 36 over 3 is 12. 2 times 12 is 24.'
        write: '$= \dfrac{2 \times 36}{3} = 24$'
      - say: 'Therefore the area of the sector is 24 square centimetres.'
        write: '$\therefore A = 24\ \text{cm}^{2}$'
        point:
          - {figure: sketch, kind: label, target: 'area = ?', text: '24 cm²', 'on': 'Therefore'}
      - section: 'Exam tip'
        say: 'Exam tip: putting the two formulas together gives area equals a half, r times L. Here that is a half times 6 times 8, which is 24 again.'
        write: 'Exam tip: $A = \tfrac{1}{2}rL = \tfrac{1}{2} \times 6 \times 8 = 24$ ✓'
      - section: 'Answer'
        say: 'So the area of the sector is 24 square centimetres, which is answer choice B.'
        write: '$\therefore A = 24\ \text{cm}^{2}$ (B)'
        answer: true
    traps:
      A: 'You went for 5 and a third. That is 8 squared over 12, not a sector area. With theta over 360 equal to 2 over 3 pi, the area is 2 over 3 pi times 36 pi, which is 24.'
      C: 'You went for 36. That is 6 squared, the radius squared, with no pi and no fraction. The sector is 2 over 3 pi of the circle''s 36 pi, which is 24.'
      D: 'You went for 48. That is r times L, 6 times 8, without the half. The area is a half r L, which is 24.'
  39:
    moments:
      - section: 'The question'
        say: 'In triangle $XYZ$, $XY$ is 4, $XZ$ is 3 and $YZ$ is 6. We want the cosine of angle $Z$.'
        write: '$XY = 4,\ XZ = 3,\ YZ = 6$; find $\cos Z$'
        point:
          - {figure: 0, kind: arc, target: XZY, text: 'Z'}
      - section: 'Solution'
        say: 'Solution. We know all three sides and want an angle, so we use the cosine rule. Small $z$ is the side opposite $Z$; $x$ and $y$ are the sides that meet at $Z$.'
        write: 'Solution: $\cos Z = \dfrac{x^{2} + y^{2} - z^{2}}{2xy}$ (cosine rule)'
      - say: 'Match the sides to angle $Z$. The two sides meeting at $Z$ are $XZ$ and $YZ$, 3 and 6. The side opposite $Z$ is $XY$, 4: that is the one we subtract.'
        write: 'At $Z$: $XZ = 3,\ YZ = 6$; opp. $Z$: $XY = 4$'
        point:
          - {figure: 0, kind: highlight, target: XZ, text: '3'}
          - {figure: 0, kind: highlight, target: YZ, text: '6'}
          - {figure: 0, kind: underline, target: XY, text: 'opposite'}
      - say: 'Substitute.'
        write: '$\cos Z = \dfrac{3^{2} + 6^{2} - 4^{2}}{2 \times 3 \times 6}$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: 'XY=4'}, at: '−[[42]]', text: 'opposite'}
      - say: '3 squared is 9, 6 squared is 36, and 4 squared is 16. Below, 2 times 3 is 6, and 6 times 6 is 36.'
        write: '$= \dfrac{9 + 36 - 16}{36}$'
      - say: 'The top: 9 plus 36 is 45, and 45 minus 16 is 29. 29 is prime, so the fraction is already in its lowest terms.'
        write: '$= \dfrac{45 - 16}{36} = \dfrac{29}{36}$'
      - say: 'Therefore cos $Z$ is 29 over 36.'
        write: '$\therefore \cos Z = \dfrac{29}{36}$'
      - section: 'Check'
        say: 'Check the size. 29 over 36 is about 0.81, positive, so $Z$ is acute. That fits: $Z$ faces the middle side, 4, not the longest.'
        write: 'Check: $\dfrac{29}{36} \approx 0.81 > 0$, so $Z$ is acute $\checkmark$'
        point:
          - {figure: 0, kind: arc, target: XZY, text: 'acute'}
      - section: 'Answer'
        say: 'So cos $Z$ is 29 over 36, which is answer choice B.'
        write: '$\therefore \cos Z = \dfrac{29}{36}$'
        answer: true
    traps:
      A: 'You went for three quarters. The cosine rule needs all three sides: 3 squared plus 6 squared minus 4 squared, over 2 times 3 times 6. That is 29 over 36.'
      C: 'You went for two thirds. Check which side you subtract: it must be the side opposite $Z$, which is 4. So it is 9 plus 36 minus 16, over 36, which is 29 over 36.'
      D: 'You went for a half. That would make angle $Z$ exactly 60 degrees. Work it out: 9 plus 36 minus 16 is 29, and the bottom is 36, so cos $Z$ is 29 over 36.'
  40:
    moments:
      - section: 'The question'
        say: 'An isosceles triangle on a straight line, and a second triangle leaning on it. Chase the angle from $P$ along the line to $Q$, then up to $S$.'
        write: '$PQ = QT$, $\angle TPQ = 20^{\circ}$, $\angle SRQ = 35^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: TPQ, text: '20°'}
          - {figure: 0, kind: arc, target: SRQ, text: '35°'}
          - {figure: 0, kind: circle, target: '?', text: '∠TSR = ?'}
      - section: 'Solution'
        say: 'Solution. We work through the triangle $PQT$ first, then the triangle $SQR$.'
        write: 'Solution'
      - say: '$PQ$ equals $QT$, so triangle $PQT$ is isosceles. The angles opposite the equal sides, at $T$ and $P$, are equal. Reason: base angles of an isosceles triangle.'
        write: '$\angle QTP = \angle QPT = 20^{\circ}$ (base $\angle$s of isos. $\triangle$)'
        point:
          - {figure: 0, kind: highlight, target: PQ}
          - {figure: 0, kind: highlight, target: QT}
          - {figure: 0, kind: arc, target: QTP, text: '20°'}
      - say: '$PQR$ is a straight line, so angle $TQR$ is outside triangle $PQT$, at $Q$. An exterior angle equals the two interior opposite angles added.'
        write: '$\angle TQR = 20^{\circ} + 20^{\circ} = 40^{\circ}$ (ext. $\angle$ of $\triangle PQT$)'
        point:
          - {figure: 0, kind: arc, target: TQR, text: '40°'}
      - say: '$S$ lies on $QT$, so in triangle $SQR$ the angle at $Q$ is that 40, and the angle at $R$ is 35. Angle $TSR$ is its exterior angle at $S$.'
        write: '$\angle TSR = \angle SQR + \angle SRQ$ (ext. $\angle$ of $\triangle SQR$)'
      - say: '40 plus 35 is 75.'
        write: '$\angle TSR = 40^{\circ} + 35^{\circ} = 75^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: TSR, text: '75°'}
      - section: 'Check'
        say: 'Check by the angle sum. In triangle $SQR$, angle $QSR$ is 180 minus 40 minus 35, which is 105.'
        write: '$\angle QSR = 180^{\circ} - 40^{\circ} - 35^{\circ} = 105^{\circ}$ ($\angle$ sum of $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: QSR, text: '105°'}
      - say: '$T$, $S$ and $Q$ are on one straight line, so angle $TSR$ is 180 minus 105, which is 75 again.'
        write: '$\angle TSR = 180^{\circ} - 105^{\circ} = 75^{\circ}\ \checkmark$ ($\angle$s on a str. line)'
      - say: 'Therefore angle $TSR$ is 75 degrees, option C.'
        write: '$\therefore \angle TSR = 75^{\circ}$ (C)'
        answer: true
    traps:
      A: 'You went for 20 degrees. That is the angle at $P$, given in the question. The exterior angle at $Q$ is 20 plus 20, which is 40, so angle $TSR$ is 40 plus 35, which is 75.'
      B: 'You went for 55 degrees. That uses 20 degrees for the angle at $Q$. But angle $TQR$ is the exterior angle of triangle $PQT$, 20 plus 20, which is 40. So angle $TSR$ is 40 plus 35, which is 75.'
      D: 'You went for 140 degrees. That is angle $PQT$, at the top of the isosceles triangle. We want angle $TSR$, which is 40 plus 35, or 75.'
  41:
    moments:
      - section: 'The question'
        say: 'Picture a solid cone made of card: a curved side, and a flat circle at the bottom. We want the area of all the card, both parts together.'
        write: 'Find the total surface area of the solid cone.'
      - say: 'Write Solution, then sketch the cone with its base radius and its slant height.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: OB, text: 'r', 'on': 'base radius'}
          - {figure: sketch, kind: highlight, target: AB, text: 'l', 'on': 'slant height'}
      - section: 'What we know'
        say: 'List the givens: r is 2 root 3 cm, and the slant height l is 4 root 3 cm.'
        write: '$r = 2\sqrt{3}$ cm, $l = 4\sqrt{3}$ cm'
      - section: 'The formula'
        say: 'Solid means the base is included. Total surface area is the curved surface, pi r l, plus the base, pi r squared.'
        write: 'T.S.A. $= \pi rl + \pi r^{2}$'
      - say: 'Take out the common factor pi r. That gives pi r, times r plus l.'
        write: 'T.S.A. $= \pi r(r + l)$'
      - section: 'Substitute'
        say: 'Substitute: r is 2 root 3, and r plus l is 2 root 3 plus 4 root 3.'
        write: '$= \pi \times 2\sqrt{3}(2\sqrt{3} + 4\sqrt{3})$'
      - section: 'Simplify'
        say: 'Add the like surds: 2 root 3 plus 4 root 3 is 6 root 3.'
        write: '$= \pi \times 2\sqrt{3} \times 6\sqrt{3}$'
      - say: 'Multiply the whole numbers: 2 times 6 is 12. Multiply the surds: root 3 times root 3 is 3.'
        write: '$= \pi \times 12 \times 3$'
      - say: '12 times 3 is 36. Therefore the total surface area is 36 pi square centimetres.'
        write: '$\therefore$ T.S.A. $= 36\pi\ \text{cm}^{2}$'
      - section: 'Check'
        say: 'Check part by part. Base: pi times 2 root 3 squared, which is 12 pi. Curved: pi times 2 root 3 times 4 root 3, which is 24 pi. 12 pi plus 24 pi is 36 pi.'
        write: 'Check: $12\pi + 24\pi = 36\pi$ ✓'
      - section: 'Answer'
        say: 'So the total surface area is 36 pi square centimetres, which is answer choice D.'
        write: '$\therefore$ T.S.A. $= 36\pi\ \text{cm}^{2}$ (D)'
        answer: true
    traps:
      A: 'You went for 8 root 3 pi. The surds should multiply out: root 3 times root 3 is 3. The total is pi times 2 root 3 times 6 root 3, which is 36 pi.'
      B: 'You went for 24 pi. That is the curved surface on its own, pi r l. A solid cone also has its base, pi r squared, which is 12 pi, bringing the total to 36 pi.'
      C: 'You went for 15 root 3 pi. Use pi r, times r plus l: that is pi times 2 root 3 times 6 root 3, and the root 3s multiply to 3, giving 36 pi.'
  42:
    moments:
      - section: 'The question'
        say: '$U$ and $V$ are fixed points, and $W$ moves so that angle $UWV$ is always a right angle. The path $W$ traces is its locus. Which path is it?'
        write: '$\angle UWV = 90^{\circ}$; locus of $W = ?$'
      - section: 'Solution'
        say: 'Solution. A locus is the path traced by a moving point under a given condition. Let me draw $U$, $V$, and one position of $W$ with a right angle there.'
        show_sketch: true
        write: 'Solution: $\angle UWV = 90^{\circ}$ for every position of $W$'
        point:
          - {figure: sketch, kind: arc, target: UWV, text: '90°'}
      - say: 'Let $M$ be the midpoint of $UV$. In triangle $UWV$ the right angle is at $W$, so $UV$ is the hypotenuse.'
        write: 'Let $M$ be the midpoint of $UV$'
        point:
          - {figure: sketch, kind: circle, target: M, text: 'midpoint'}
      - say: 'In a right-angled triangle, the midpoint of the hypotenuse is the same distance from all three vertices. Write the reason in brackets.'
        write: '$MW = MU = MV$ (mid-pt of hyp. of rt.-$\angle$d $\triangle$)'
        point:
          - {figure: sketch, kind: highlight, target: MW}
          - {figure: sketch, kind: highlight, target: MU}
          - {figure: sketch, kind: highlight, target: MV}
      - say: '$MU$ is half of $UV$, and $UV$ never changes. So $W$ is always the same distance, half of $UV$, from the fixed point $M$.'
        write: '$MW = \tfrac{1}{2}UV$ (a constant)'
      - say: 'The standard locus: a point at a fixed distance from a fixed point traces a circle. Here the centre is $M$ and the radius is half of $UV$.'
        write: 'Fixed distance from fixed point $M$ $\Rightarrow$ circle, centre $M$, radius $\tfrac{1}{2}UV$'
        point:
          - {figure: sketch, kind: circle, target: 'locus of W'}
      - say: 'The diameter is twice the radius: 2 times half of $UV$ is $UV$ itself.'
        write: 'Diameter $= 2 \times \tfrac{1}{2}UV = UV$'
        point:
          - {figure: sketch, kind: underline, target: UV, text: 'diameter'}
      - section: 'Check'
        say: 'Check with the circle theorem: the angle in a semicircle is 90 degrees. So every $W$ on this circle does give a right angle. $U$ and $V$ themselves are left out.'
        write: 'Check: $\angle$ in a semicircle $= 90^{\circ}\ \checkmark$ ($W \neq U, V$)'
        point:
          - {figure: sketch, kind: arc, target: UWV, text: '∠ in a semicircle'}
      - section: 'Answer'
        say: 'Therefore the locus of $W$ is a circle with $UV$ as diameter, which is option D.'
        write: '$\therefore$ locus of $W$: a circle with $UV$ as diameter'
        answer: true
    traps:
      A: 'You went for the perpendicular bisector of $UV$. That is the locus of points equidistant from $U$ and $V$. A right angle at $W$ makes $MW = \tfrac{1}{2}UV$: a circle with $UV$ as diameter.'
      B: 'You went for a circle with $UV$ as radius. That circle is twice too big and centred at the wrong point. The radius is $MW = \tfrac{1}{2}UV$, so $UV$ is the diameter.'
      C: 'You went for a line parallel to $UV$. Along such a line the angle $UWV$ keeps changing, so it cannot stay 90 degrees. The angle in a semicircle gives the circle with $UV$ as diameter.'
  43:
    moments:
      - section: 'The question'
        say: 'Two pairs of parallel lines, and a path that bends at $R$. One extra line through the bend carries the angles across to $T$.'
        write: '$PQ \parallel ST$, $RS \parallel UV$, $\angle PQR = 35^{\circ}$, $\angle QRS = 65^{\circ}$, $\angle STV = ?$'
        point:
          - {figure: 0, kind: circle, target: '35°'}
          - {figure: 0, kind: circle, target: '65°'}
          - {figure: 0, kind: circle, target: '?', text: 'angle STV'}
      - section: 'Solution'
        say: 'Solution. We re-draw the diagram, so we can add our own line to it. The line $QRS$ bends at $R$, between the parallels $PQ$ and $ST$.'
        write: 'Solution'
        show_sketch: true
      - say: 'Through $R$, draw the line $RX$ parallel to $PQ$ and $ST$. Now each arm of the bend meets a parallel line we can use.'
        write: 'Draw $RX \parallel PQ \parallel ST$ (construction)'
        point:
          - {figure: sketch, kind: highlight, target: RX, text: 'new parallel line'}
      - say: 'Angle $PQR$ and angle $QRX$ make a Z between $PQ$ and $RX$. Alternate angles are equal. Reason: alternate angles.'
        write: '$\angle QRX = \angle PQR = 35^{\circ}$ (alt. $\angle$s, $PQ \parallel RX$)'
        point:
          - {figure: sketch, kind: arc, target: PQR, text: '35°'}
          - {figure: sketch, kind: arc, target: QRX, text: '35°'}
      - say: '$RX$ cuts the 65 degrees at $R$ into two parts. The part we want, angle $XRS$, is the whole angle minus the part we found.'
        write: '$\angle XRS = \angle QRS - \angle QRX$'
        point:
          - {figure: sketch, kind: arc, target: QRS, text: '65°'}
      - say: '65 minus 35 is 30 degrees.'
        write: '$\angle XRS = 65^{\circ} - 35^{\circ} = 30^{\circ}$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '= 35∘'}, at: '− 35∘', text: 'from here'}
          - {figure: sketch, kind: arc, target: XRS, text: '30°'}
      - say: 'Now the other arm. Angle $XRS$ and angle $RST$ make a Z between $RX$ and $ST$. Reason: alternate angles again.'
        write: '$\angle RST = \angle XRS = 30^{\circ}$ (alt. $\angle$s, $RX \parallel ST$)'
        point:
          - {figure: sketch, kind: arc, target: RST, text: '30°'}
      - say: 'Last, the second pair of parallels. $ST$ crosses $RS$ and $UV$, and angle $RST$ and angle $STV$ make a Z. Reason: alternate angles.'
        write: '$\angle STV = \angle RST = 30^{\circ}$ (alt. $\angle$s, $RS \parallel UV$)'
        point:
          - {figure: sketch, kind: highlight, target: RS}
          - {figure: sketch, kind: highlight, target: TV, text: 'parallel'}
          - {figure: sketch, kind: arc, target: STV, text: '30°'}
      - section: 'Check'
        say: 'Check. The two parts at $R$ must make up the given 65 degrees. 35 plus 30 is 65.'
        write: '$\angle QRX + \angle XRS = 35^{\circ} + 30^{\circ} = 65^{\circ}$ $\checkmark$'
        point:
          - {figure: sketch, kind: arc, target: QRX, text: '35°'}
          - {figure: sketch, kind: arc, target: XRS, text: '30°'}
      - say: 'Therefore angle $STV$ is 30 degrees, option A.'
        write: '$\therefore \angle STV = 30^{\circ}$ (A)'
        answer: true
        point:
          - {figure: 0, kind: label, target: '?', text: '30°'}
    traps:
      B: 'You went for 35 degrees. That copies angle $PQR$ across on its own. It is only one part of the 65 at $R$; the other part, 65 minus 35, is 30, and that is the part carried to $T$.'
      C: 'You went for 55 degrees, which is 90 minus 35. There is no right angle here. Alternate angles give 35 at $R$, so the other part of the 65 is 30, and alternate angles carry it to $STV$.'
      D: 'You went for 65 degrees. That copies angle $QRS$ across. The line $RX$ splits it into 35 and 30, and only the 30 is carried to $S$ and then to $T$.'
  44:
    moments:
      - section: 'The question'
        say: 'An open box: no lid. Count the faces before you paint, because the lid is where most students lose this one. Picture the paint tin: it fills as we add up the area.'
        doodle: {name: 'custom:1986_q44_a', id: tin, caption: 'Painting costs ₦2 per m²'}
        write: 'Open box $4\ \text{m} \times 3\ \text{m} \times 4\ \text{m}$, ₦2.00 per $\text{m}^{2}$, cost $= ?$'
      - section: 'Solution'
        say: 'Solution. Let me draw the open box and label it: length 4 metres, breadth 3 metres, height 4 metres.'
        write: 'Solution'
        show_sketch: true
      - say: 'Write the givens: $l$ is 4, $b$ is 3, $h$ is 4.'
        write: '$l = 4$ m, $b = 3$ m, $h = 4$ m'
        point:
          - {figure: sketch, kind: circle, target: 'l = 4 m'}
          - {figure: sketch, kind: circle, target: 'b = 3 m'}
          - {figure: sketch, kind: circle, target: 'h = 4 m'}
      - say: 'Painting the outside means the surface area. The box is open, so there is no lid: we paint the base and the four sides only.'
        write: 'Area to paint $=$ base $+$ 4 sides (no lid)'
        point:
          - {figure: sketch, kind: underline, target: 'open top (no lid)'}
      - say: 'The formula first. The base is $l$ times $b$. Two sides are $l$ by $h$, and two sides are $b$ by $h$.'
        write: '$A = lb + 2lh + 2bh$'
      - say: 'Substitute: 4 times 3, plus 2 times 4 times 4, plus 2 times 3 times 4.'
        write: '$A = 4 \times 3 + 2(4 \times 4) + 2(3 \times 4)$'
      - say: '4 times 3 is 12. 2 times 16 is 32. 2 times 12 is 24. The tin fills as each face goes in.'
        doodle_do: [{id: tin, op: fill, to: 1.0}]
        write: '$A = 12 + 32 + 24$'
      - say: '12 plus 32 is 44, and 44 plus 24 is 68 square metres.'
        write: '$A = 68\ \text{m}^{2}$'
        point:
          - {line: 7, kind: highlight, at: '68', to: {doodle: tin, part: area}}
      - say: 'Each square metre costs 2 naira, so the cost is the area times 2 naira.'
        write: 'Cost $= 68 \times$ ₦2.00'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= 68'}, at: '68', text: 'area'}
      - say: '68 times 2 is 136. The cost is 136 naira.'
        doodle_do: [{id: tin, op: label, part: price, text: '68 × ₦2 = ₦136'}]
        write: '$=$ ₦136.00'
      - section: 'Check'
        say: 'Check another way. A closed box has 2 times, $lb$ plus $lh$ plus $bh$. That is 2 times 40, which is 80. Take away the lid, 12: 80 minus 12 is 68.'
        write: '$2(12 + 16 + 12) - 12 = 80 - 12 = 68\ \text{m}^{2}$ $\checkmark$'
      - say: 'Therefore the cost is 136 naira, option C.'
        write: '$\therefore$ Cost $=$ ₦136.00 (C)'
        answer: true
    traps:
      A: 'You went for ₦96. That is 48 times 2, and 48 is the volume, 4 times 3 times 4. Painting needs the surface area: 12 plus 32 plus 24 is 68 square metres, so ₦136.'
      B: 'You went for ₦112. That is the four sides only, 32 plus 24, which is 56 square metres. The base is painted too: add 12 to get 68 square metres, and 68 times 2 is ₦136.'
      D: 'You went for ₦160. That paints a lid as well: 80 square metres. An open box has no lid, so take 12 away: 68 square metres, and 68 times 2 is ₦136.'
  45:
    moments:
      - section: 'The question'
        say: 'Nine hundred students were admitted from six states. In a pie chart of this distribution, we want the angle for Anambra, which had 185 students.'
        write: 'Anambra: 185 students. Sectoral angle $= ?$'
      - section: 'Solution'
        say: 'Solution. The table of states and students is given. Add a column for the sectoral angle: the frequency over the total, times 360 degrees.'
        write: 'Sectoral angle $= \dfrac{f}{\Sigma f} \times 360^{\circ}$'
        diagram: {id: t, kind: table, columns: [State, 'Students (f)', 'Sectoral angle'], rows: [[Anambra, 185, ''], [Imo, 135, ''], [Kaduna, 90, ''], [Kwara, 110, ''], [Ondo, 155, ''], [Oyo, 225, '']]}
      - say: 'Check the total. 185 plus 135 is 320, plus 90 is 410, plus 110 is 520, plus 155 is 675, plus 225 is 900. That matches the nine hundred.'
        write: '$\Sigma f = 185 + 135 + 90 + 110 + 155 + 225 = 900$'
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': '900'}
      - section: 'Anambra'
        say: 'Substitute Anambra''s 185 and the total, 900.'
        write: 'Anambra $= \dfrac{185}{900} \times 360^{\circ}$'
      - say: 'Simplify 360 over 900: divide both by 180, and it is 2 over 5. So it is 185 times 2, over 5.'
        write: '$= \dfrac{185 \times 2}{5} = \dfrac{370}{5}$'
      - say: '370 divided by 5 is 74 degrees.'
        write: '$= 74^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,3', text: '74°', 'on': '74 degrees'}
      - section: 'Check'
        say: 'Check the full circle with the same 2 over 5. Imo is 54 degrees, Kaduna 36, and Kwara 44.'
        write: 'Imo $54^{\circ}$, Kaduna $36^{\circ}$, Kwara $44^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:2,3', text: '54°', 'on': '54'}
          - {id: t, op: fill, part: 'cell:3,3', text: '36°', 'on': '36'}
          - {id: t, op: fill, part: 'cell:4,3', text: '44°', 'on': '44'}
      - say: 'Ondo is 62 and Oyo is 90. 74 plus 54 plus 36 plus 44 plus 62 plus 90 is 360 degrees.'
        write: '$74 + 54 + 36 + 44 + 62 + 90 = 360^{\circ}\ \checkmark$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:5,3', text: '62°', 'on': 'Ondo'}
          - {id: t, op: fill, part: 'cell:6,3', text: '90°', 'on': 'Oyo'}
      - section: 'Answer'
        say: 'Therefore the angle for Anambra is 74 degrees, which is answer choice C.'
        write: '$\therefore$ Anambra $= 74^{\circ}$'
        answer: true
    traps:
      A: 'You went for 50 degrees. Anambra is 185 over 900, times 360: 185 times 2, over 5, which is 74 degrees.'
      B: 'You went for 65 degrees. Substitute into the formula: 185 over 900, times 360, is 370 over 5, which is 74.'
      D: 'You went for 88 degrees. That is too big. 185 over 900, times 360, is 74 degrees.'
  46:
    moments:
      - section: 'The question'
        say: 'Ten numbers, in no order. We want the median, the middle value. Picture them as ten cards.'
        write: 'Data: $89,\ 141,\ 130,\ 161,\ 120,\ 131,\ 131,\ 100,\ 108,\ 119$'
        doodle: {name: 'custom:1986_q46_a', id: cards, caption: 'ten number cards', size: scene, 'on': 'cards'}
      - section: 'Solution'
        say: 'Solution. The median is the middle value once the data are arranged in order of size. So arrange them, smallest first: 89, 100, 108, 119, 120, 130, 131, 131, 141, 161.'
        write: 'Solution. In order: $89,\ 100,\ 108,\ 119,\ 120,\ 130,\ 131,\ 131,\ 141,\ 161$'
        doodle_do:
          - {id: cards, op: stage, stage: 'custom:1986_q46_a2', 'on': 'arrange'}
      - section: 'The median'
        say: 'Count them: $n$ is 10. For ungrouped data the median is the $n$ plus 1 over 2th value.'
        write: '$n = 10$; median $=$ the $\left(\dfrac{n + 1}{2}\right)$th value'
      - say: '10 plus 1 is 11, and 11 over 2 is 5 and a half. So the median sits halfway between the 5th and the 6th values.'
        write: '$= \left(\dfrac{10 + 1}{2}\right)$th $= 5\tfrac{1}{2}$th: between the 5th and 6th values'
      - say: 'Count along the ordered list: the 5th value is 120 and the 6th is 130. On the cards, the two in the middle.'
        write: '5th value $= 120$, 6th value $= 130$'
        doodle_do:
          - {id: cards, op: circle, part: c5, text: '5th'}
          - {id: cards, op: circle, part: c6, text: '6th'}
        point:
          - {line: 1, kind: circle, at: '120', text: '5th'}
          - {line: 1, kind: circle, at: '130', text: '6th'}
      - say: 'The median is their average: 120 plus 130, over 2.'
        write: 'Median $= \dfrac{120 + 130}{2}$'
      - say: '120 plus 130 is 250, and 250 over 2 is 125: halfway between the two middle cards.'
        write: '$= \dfrac{250}{2} = 125$'
        doodle_do:
          - {id: cards, op: stage, stage: 'custom:1986_q46_a3', 'on': 'halfway'}
          - {id: cards, op: label, part: mid, text: '125'}
      - say: 'So the median is 125. It does not have to be one of the numbers in the list.'
        write: '$\therefore$ Median $= 125$'
      - section: 'Check'
        say: 'Check: four values sit below 120, from 89 to 119, and four sit above 130, from 131 to 161. So 120 and 130 are the middle pair.'
        write: 'Check: 4 values below the 5th, 4 values above the 6th ✓'
      - section: 'Answer'
        say: 'So the median is 125, which is option B.'
        write: '$\therefore$ Median $= 125$'
        answer: true
    traps:
      A: 'You went for 131. That is the mode, the only value that appears twice. The median is the middle of the ordered list: the average of the 5th and 6th values, 120 and 130, which is 125.'
      C: 'You went for 123. That is the mean: the ten numbers add to 1230, and 1230 over 10 is 123. The median is the middle of the ordered list, 125.'
      D: 'You went for 120. That is only the 5th value. With ten values, the median is halfway between the 5th and 6th, 120 and 130, which is 125.'
  47:
    moments:
      - section: 'The question'
        say: 'A number is picked at random from 40 to 50. What is the probability that it is a prime? Two of the odd numbers here only look prime. Picture eleven cards.'
        write: '$40$ to $50$: $P(\text{prime}) = ?$'
        doodle: {name: 'custom:1986_q47_a', id: cards, caption: 'One number from 40 to 50', size: scene}
      - say: 'Solution. Let $E$ be the event that the number is a prime.'
        write: 'Solution: let $E$ = the number is prime'
      - section: 'The sample space'
        say: 'The sample space is every number from 40 to 50.'
        write: '$S = \{40,\ 41,\ 42,\ \ldots,\ 50\}$'
      - say: 'Both ends count, so n of $S$ is 50 minus 40, plus 1, which is 11. Count the cards: 11.'
        write: '$n(S) = 50 - 40 + 1 = 11$'
        doodle_do:
          - {id: cards, op: stage, stage: 'custom:1986_q47_a2'}
        point:
          - {line: 3, kind: highlight, at: '= 11', to: {doodle: cards, part: count}}
      - section: 'The favourable outcomes'
        say: 'A prime has exactly two factors, 1 and itself. The even numbers all divide by 2, so they are not prime. Cross out every even card.'
        write: 'Even, not prime: $40,\ 42,\ 44,\ 46,\ 48,\ 50$'
        doodle_do:
          - {id: cards, op: stage, stage: 'custom:1986_q47_a3'}
      - say: 'Now test the odd ones. 45 is 5 times 9, and 49 is 7 times 7. It looks prime, but it is 7 squared. Cross both out.'
        write: '$45 = 5 \times 9,\quad 49 = 7 \times 7$'
        doodle_do:
          - {id: cards, op: cross, part: c45}
          - {id: cards, op: cross, part: c49}
      - say: 'Three cards are left: 41, 43 and 47. Each has no factor but 1 and itself.'
        write: '$E = \{41,\ 43,\ 47\}$'
        doodle_do:
          - {id: cards, op: circle, part: c41}
          - {id: cards, op: circle, part: c43}
          - {id: cards, op: circle, part: c47}
      - say: 'So n of $E$ is 3.'
        write: '$n(E) = 3$'
      - section: 'The probability'
        say: 'The probability of $E$ is n of $E$ over n of $S$: the number of favourable outcomes over the total number of possible outcomes.'
        write: '$P(E) = \dfrac{n(E)}{n(S)}$'
      - say: 'Substitute: 3 over 11. 11 is prime, so this does not simplify.'
        write: '$= \dfrac{3}{11}$'
        point:
          - {line: 9, kind: move, from: {line: 7, at: '= 3'}, at: '11[[3]]', text: 'n(E)'}
          - {line: 9, kind: move, from: {line: 3, at: '= 11'}, at: '[[11]]3', text: 'n(S)'}
      - section: 'Check'
        say: 'Check the three primes. 7 times 7 is 49, so any factor of a number below 50 shows up among 2, 3, 5 and 7. None of them divides 41, 43 or 47.'
        write: 'Check: $2, 3, 5, 7$ do not divide $41, 43, 47\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the probability that the number is a prime is 3 over 11: option A.'
        write: '$\therefore P(\text{prime}) = \dfrac{3}{11}$'
        answer: true
    traps:
      B: 'You went for 5 over 11. That counts all the odd numbers, 41, 43, 45, 47 and 49. But 45 is 5 times 9 and 49 is 7 times 7, so n of E is only 3.'
      C: 'You went for 3 over 10. The 3 primes are right, but n of S is 11, not 10. Both ends count: 50 minus 40, plus 1.'
      D: 'You went for 4 over 11. That includes 49, which looks prime but is 7 times 7. E is only 41, 43 and 47.'
  48:
    moments:
      - section: 'The question'
        say: 'A city of 90 million people is shown by age group in the pie chart. We want the number of people aged 15 to 29.'
        write: 'Population 90 million. Aged 15–29 $= ?$'
      - section: 'Solution'
        say: 'Solution. Read the sector from the chart: the 15 to 29 group has a sectoral angle of 104 degrees.'
        write: '15–29 years: $104^{\circ}$; total $= 90$ million'
        point:
          - {figure: 0, kind: circle, target: '104°', text: '15–29'}
      - say: 'The whole circle, 360 degrees, stands for the whole population. So the number in a group is its angle over 360, times the total.'
        write: 'Number $= \dfrac{\text{angle}}{360^{\circ}} \times \text{total}$'
      - say: 'Substitute 104 degrees and 90 million.'
        write: '$= \dfrac{104}{360} \times 90$ million'
      - say: 'Simplify. 90 over 360 is 1 over 4, since 360 is 4 times 90. So it is 104 times 1 over 4.'
        write: '$= 104 \times \dfrac{1}{4}$ million'
      - say: '104 divided by 4 is 26. So it is 26 million.'
        write: '$= 26$ million'
        point:
          - {figure: 0, kind: label, target: '15–29 yrs', text: '26 million'}
      - say: 'One million is 10 to the power 6, so 26 million is 26 times 10 to the power 6.'
        write: '$= 26 \times 10^{6}$'
      - section: 'Check'
        say: 'Check that the chart was read correctly: the angles 116, 104, 64, 52 and 24 degrees add up to 360.'
        write: '$116 + 104 + 64 + 52 + 24 = 360^{\circ}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore 26 times 10 to the power 6 people are aged 15 to 29, which is answer choice B.'
        write: '$\therefore$ aged 15–29 $= 26 \times 10^{6}$'
        answer: true
    traps:
      A: 'You went for 29 times 10 to the power 6. That is the under-15 group, the 116 degree sector. The 15 to 29 sector is 104 degrees: 104 over 360 of 90 million is 26 million.'
      C: 'You went for 16 times 10 to the power 6. That is the 30 to 44 group, the 64 degree sector. Use the 104 degree sector: 26 million.'
      D: 'You went for 13 times 10 to the power 6. That is the 45 to 59 group, the 52 degree sector. The 15 to 29 sector, 104 degrees, gives 26 million.'
  49:
    moments:
      - section: 'The question'
        say: 'A man has 6 black, 5 brown and 7 purple shirts in a drawer. With his eyes closed, what is the probability that he picks a purple one? Picture the three piles.'
        write: 'Black $6$, brown $5$, purple $7$: $P(\text{purple}) = ?$'
        doodle: {name: 'custom:1986_q49_a', id: drawer, caption: 'Picked with his eyes closed'}
      - say: 'Solution. Let $E$ be the event that he picks a purple shirt. His eyes are closed, so every shirt is equally likely.'
        write: 'Solution: let $E$ = a purple shirt'
      - section: 'The sample space'
        say: 'The sample space is every shirt in the drawer. n of $S$ is 6 plus 5 plus 7.'
        write: '$n(S) = 6 + 5 + 7$'
      - say: '6 plus 5 is 11, and 11 plus 7 is 18.'
        write: '$= 18$'
        doodle_do:
          - {id: drawer, op: label, part: drawer, text: '18 shirts'}
        point:
          - {line: 3, kind: highlight, at: '18', to: {doodle: drawer, part: drawer}}
      - section: 'The favourable outcomes'
        say: 'The favourable shirts are the purple pile: n of $E$ is 7.'
        write: '$n(E) = 7$'
        doodle_do:
          - {id: drawer, op: circle, part: purple}
      - section: 'The probability'
        say: 'The probability of $E$ is n of $E$ over n of $S$: the number of favourable outcomes over the total number of possible outcomes.'
        write: '$P(E) = \dfrac{n(E)}{n(S)}$'
      - say: 'Substitute: 7 over 18.'
        write: '$= \dfrac{7}{18}$'
        doodle_do:
          - {id: drawer, op: label, part: purple, text: '7 of the 18'}
        point:
          - {line: 6, kind: move, from: {line: 4, at: '= 7'}, at: '18[[7]]', text: 'n(E)'}
          - {line: 6, kind: move, from: {line: 3, at: '= 18'}, at: '[[18]]7', text: 'n(S)'}
      - say: 'Does it simplify? 7 is prime, and 18 is 2 times 3 times 3, with no 7 in it. So 7 over 18 is in its lowest terms.'
        write: '$18 = 2 \times 3 \times 3$: no factor of 7'
      - section: 'Check'
        say: 'Check with the complement. Not purple is the 11 black and brown shirts: 11 over 18. And 7 over 18 plus 11 over 18 is 18 over 18, which is 1.'
        write: 'Check: $P(E^{\prime}) = \dfrac{11}{18}$, $\ \dfrac{7}{18} + \dfrac{11}{18} = 1\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the probability of picking a purple shirt is 7 over 18: option C.'
        write: '$\therefore P(\text{purple}) = \dfrac{7}{18}$'
        answer: true
    traps:
      A: 'You went for 1 over 7. That leaves out n of S. There are 7 purple shirts out of 18 altogether, so P of E is 7 over 18.'
      B: 'You went for 11 over 18. That is P of E complement, NOT purple: the 11 black and brown shirts. Purple is 7 out of 18.'
      D: 'You went for 7 over 11. That divides by the 11 shirts that are not purple. n of S is all 18 shirts in the drawer, so it is 7 over 18.'
  50:
    moments:
      - section: 'The question'
        say: 'Scores in a Mathematics test, with their frequencies. $S$ is the number who scored 4 or less, and $m$ is the mode. We want the pair $S$, $m$. Table first.'
        write: '$(S,\ m) = ?$'
        diagram:
          id: t
          kind: table
          columns: ['Score (x)', 'f', 'cf']
          rows: [[1, 2, ''], [2, 4, ''], [3, 7, ''], [4, 14, ''], [5, 12, ''], [6, 6, ''], [7, 4, ''], [8, 1, '']]
          'on': 'Table'
      - section: 'Solution'
        say: 'Solution. $x$ is the score, and $f$, the frequency, is the number of students with that score. Picture each frequency as a bar.'
        write: 'Solution'
        doodle: {name: 'custom:1986_q50_a', id: bars, caption: 'the frequencies as bars', size: scene, 'on': 'bar'}
      - section: 'The mode'
        say: 'The mode is the value with the highest frequency. Down the $f$ column, the highest is 14, the tallest bar, at the score 4.'
        write: 'Highest frequency $= 14$, at $x = 4$'
        diagram_do:
          - {id: t, op: highlight, part: 'row:4', text: 'highest f', 'on': 'highest'}
        doodle_do:
          - {id: bars, op: circle, part: b4, text: 'mode', 'on': 'tallest'}
      - say: 'So the mode, $m$, is 4.'
        write: '$\therefore m = 4$'
      - section: 'S, scored 4 or less'
        say: 'Now the cf column, the cumulative frequency: a running total of $f$ down the table. 2, then 6, 13, 27, 39, 45, 49 and 50.'
        diagram_do:
          - {id: t, op: total, part: 'col:2', into: 'col:3', 'on': 'running'}
      - say: '4 or less means the scores 1, 2, 3 and 4, with 4 itself included. So $S$ adds their frequencies: the first four bars.'
        write: '$S = 2 + 4 + 7 + 14$'
        doodle_do:
          - {id: bars, op: stage, stage: 'custom:1986_q50_a2', 'on': 'bars'}
      - say: '2 plus 4 is 6, plus 7 is 13, plus 14 is 27. That is the cf in the row for the score 4.'
        write: '$\therefore S = 27$'
        diagram_do:
          - {id: t, op: highlight, part: 'cell:4,3', text: 'S = 27', 'on': 'row'}
        doodle_do:
          - {id: bars, op: label, part: le4, text: '27 students'}
        point:
          - {line: 6, kind: highlight, at: '27', to: {diagram: t, part: 'cell:4,3'}}
      - section: 'Check'
        say: 'Check from the other end. Add down the $f$ column: the total is 50, the last cf. More than 4 is the other four bars: 12 plus 6 plus 4 plus 1, which is 23.'
        write: '$\sum f = 50$; more than 4: $12 + 6 + 4 + 1 = 23$'
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': 'Add'}
        doodle_do:
          - {id: bars, op: stage, stage: 'custom:1986_q50_a3', 'on': 'other'}
      - say: '50 minus 23 is 27, the same $S$ as before.'
        write: 'Check: $50 - 23 = 27$ ✓'
      - section: 'Answer'
        say: '$S$ first, then $m$: 27 and 4. That is option A.'
        write: '$\therefore (S,\ m) = (27,\ 4)$'
        answer: true
    traps:
      B: 'You went for 14 and 4. The 14 is the number who scored exactly 4. $S$ is 4 or less, the cf at the score 4: 2 plus 4 plus 7 plus 14, which is 27.'
      C: 'You went for 13 and 4. 13 is the cf at the score 3, the scores below 4 only. "4 or less" includes the 14 who scored 4, so $S$ is 13 plus 14, which is 27.'
      D: 'You went for 4 and 4. The mode is 4, but $S$ is a number of students, not a score. The cf at the score 4 is 27.'
