        write: 'Number of values $= 10$'
      - say: 'Split the line of people in half. 10 is even, so there is no single middle number. The median is the average of the two middle values, the 5th and the 6th, with four numbers on each side of them.'
        doodle_do: [{id: line, op: split, n: 5, text: 'first five | last five'}]
        write: 'Median $= \dfrac{5\text{th} + 6\text{th}}{2}$'
      - say: 'On the cards, the two green ones. Counting along, the 5th number is 120 and the 6th is 130.'
        doodle_do: [{id: cards, op: circle, part: c5}, {id: cards, op: circle, part: c6}]
