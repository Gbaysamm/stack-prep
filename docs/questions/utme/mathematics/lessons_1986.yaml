# UTME 1986 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1986.yaml. Answers match that file.
format_version: 1
exam_year: 1986
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'Two-one-two base three, minus one-two-one base three, plus two-two-two base three. We work in base three itself, column by column, as WAEC expects.'
        write: 'Evaluate $212_{3} - 121_{3} + 222_{3}$'
      - say: 'Work from left to right: first the subtraction, then the addition. One rule for base three: a borrow or a carry is worth 3, not 10.'
        write: 'Solution'
      - section: 'First: 212₃ − 121₃'
        say: 'Set out the subtraction in columns, units under units.'
        write: '$\begin{array}{rrrr} & 2 & 1 & 2 \\ - & 1 & 2 & 1 \\ \hline & & & \end{array}$'
      - say: 'Units column: 2 minus 1 is 1.'
        write: 'Units: $2 - 1 = 1$'
      - say: 'Threes column: 1 minus 2 cannot be done, so borrow 1 from the nines column. A borrowed 1 is worth 3.'
        write: 'Threes: $1 - 2$, borrow 1 three'
      - say: '1 plus 3 is 4, and 4 minus 2 is 2.'
        write: '$1 + 3 = 4,\quad 4 - 2 = 2$'
      - say: 'Nines column: the 2 lent 1, so it is now 1. 1 minus 1 is 0.'
        write: 'Nines: $2 - 1 = 1$ (it lent 1), $1 - 1 = 0$'
      - say: 'Here is the finished subtraction, with the new top digits written small above. The answer is nought-two-one, which is two-one base three.'
        write: '$\begin{array}{rrrr} & \scriptstyle 1 & \scriptstyle 4 & \\ & 2 & 1 & 2 \\ - & 1 & 2 & 1 \\ \hline & 0 & 2 & 1 \end{array} \quad = 21_{3}$'
      - section: 'Then: 21₃ + 222₃'
        say: 'Now add two-two-two base three to that, in columns.'
        write: '$\begin{array}{rrrr} & & 2 & 1 \\ + & 2 & 2 & 2 \\ \hline & & & \end{array}$'
      - say: 'Units: 1 plus 2 is 3. 3 is one three and nought over, so write 0 and carry 1.'
        write: 'Units: $1 + 2 = 3 = 1 \times 3 + 0$: write 0, carry 1'
      - say: 'Threes: 2 plus 2, plus the carried 1, is 5. 5 is one three and 2 over: write 2, carry 1.'
        write: 'Threes: $2 + 2 + 1 = 5 = 1 \times 3 + 2$: write 2, carry 1'
      - say: 'Nines: 2 plus the carried 1 is 3. That is one three and nought over: write 0, carry 1.'
        write: 'Nines: $2 + 1 = 3 = 1 \times 3 + 0$: write 0, carry 1'
      - say: 'Nothing is left to add, so the carried 1 is written in front.'
        write: '$\begin{array}{rrrrr} & \scriptstyle 1 & \scriptstyle 1 & \scriptstyle 1 & \\ & & & 2 & 1 \\ + & & 2 & 2 & 2 \\ \hline & 1 & 0 & 2 & 0 \end{array}$'
      - say: 'So the whole sum is one-zero-two-zero base three.'
        write: '$212_{3} - 121_{3} + 222_{3} = 1020_{3}$'
      - section: 'Check: change to base ten'
        say: 'Check in base ten. Index numbers over two-one-two: 2 times 9, plus 1 times 3, plus 2 times 1 is 23.'
        write: '$\overset{2}{2}\,\overset{1}{1}\,\overset{0}{2}_{3} = 2 \times 3^{2} + 1 \times 3^{1} + 2 \times 3^{0} = 23$'
      - say: 'One-two-one base three: 9 plus 6 plus 1 is 16.'
        write: '$\overset{2}{1}\,\overset{1}{2}\,\overset{0}{1}_{3} = 1 \times 3^{2} + 2 \times 3^{1} + 1 \times 3^{0} = 16$'
      - say: 'Two-two-two base three: 18 plus 6 plus 2 is 26.'
        write: '$\overset{2}{2}\,\overset{1}{2}\,\overset{0}{2}_{3} = 2 \times 3^{2} + 2 \times 3^{1} + 2 \times 3^{0} = 26$'
      - say: 'So the sum in base ten is 23 minus 16 plus 26, which is 33.'
        write: '$23 - 16 + 26 = 33$'
      - say: 'And our answer, one-zero-two-zero base three, is 27 plus 0 plus 6 plus 0, which is 33. It agrees.'
        write: '$\overset{3}{1}\,\overset{2}{0}\,\overset{1}{2}\,\overset{0}{0}_{3} = 1 \times 3^{3} + 0 + 2 \times 3^{1} + 0 = 33\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the answer is one-zero-two-zero base three, which is option C.'
        write: '$\therefore 1020_{3}$'
        answer: true
    traps:
      A: 'You went for three-one-three base three. That cannot be a base three number: base three only uses the digits 0, 1 and 2. When a column reaches 3, write the remainder and carry 1.'
      B: 'You went for one-zero-zero-zero base three. That is 27 in base ten, but the sum is 23 minus 16 plus 26, which is 33. Check each column and its carry.'
      D: 'You went for one-two-two-two base three. That is 53 in base ten, not 33. Work left to right, and in each column borrow or carry in threes, not tens.'
  2:
    moments:
      - say: 'If Musa had scored 75 in Biology instead of 57, his average over four subjects would have been 60. We want his real total. Picture his report card, and the dream in the bubble.'
        doodle: {name: 'custom:1986_q02_a', id: card, caption: 'Biology: 57, not 75'}
        write: 'Imagined average $= 60$ over 4 subjects'
      - say: 'Remember what an average is: the total divided by the number of subjects.'
        write: '$\text{average} = \dfrac{\text{total}}{\text{number of subjects}}$'
      - say: 'Turn that round, and the total is the average times the number of subjects.'
        write: '$\text{total} = \text{average} \times \text{number of subjects}$'
      - say: 'That total belongs to the dream in the bubble. For the imagined marks, that is 60 times 4, which is 240.'
        doodle_do: [{id: card, op: label, part: bubble, text: '60 × 4 = 240'}]
        write: 'Imagined total $= 60 \times 4 = 240$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {line: 3, kind: highlight, at: '240', to: {doodle: card, part: bubble}}
      - say: 'But careful. That 240 is the total he would have had with 75 in Biology. His real Biology mark was 57, not 75.'
        write: 'Real Biology mark $= 57$, not $75$'
      - say: 'Look at the Biology line on the card. So the imagined total is too big by the gap between 75 and 57. 75 minus 57 is 18.'
        doodle_do: [{id: card, op: circle, part: bio}, {id: card, op: label, part: bio, text: '18 short of 75'}]
        write: 'Extra marks $= 75 - 57 = 18$'
      - say: 'To get his real total, we take the imagined total of 240 and subtract those 18 extra marks.'
        write: 'Real total $= 240 - 18$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '= 240'}, at: '240', text: 'imagined total'}
          - {line: 6, kind: move, from: {line: 5, at: '= 18'}, at: '18', text: 'take away'}
      - say: '240 minus 18 is 222. That is the real total on his card.'
        doodle_do: [{id: card, op: label, part: card, text: 'real total 222'}]
        write: '$= 222$'
        point:
          - {line: 7, kind: highlight, at: '222', to: {doodle: card, part: card}}
      - say: 'Let''s check. Add the 18 marks back and 222 becomes 240, and 240 divided by 4 is 60, the average we were told.'
        write: 'Check: $\ 222 + 18 = 240,\quad 240 \div 4 = 60$'
      - say: 'So his total mark was 222, which is answer choice C.'
        write: 'Total mark $= 222$'
        answer: true
    traps:
      A: 'You went for 282. That is even bigger than the imagined total of 240. His real Biology mark was lower than 75, so his real total must be smaller: 240 minus 18 is 222.'
      B: 'You went for 240. That''s the total he would have had with 75 in Biology. The question wants what he really scored, which is 18 marks less: 222.'
      D: 'You went for 210. That takes 30 marks off, but the gap between 75 and 57 is 18. Take 18 from 240 and you get 222.'
  3:
    moments:
      - say: 'We want the L.C.M. of 48, 64 and 80, divided by their H.C.F.'
        write: '$\dfrac{\text{L.C.M. of } 48,\ 64,\ 80}{\text{H.C.F. of } 48,\ 64,\ 80}$'
      - say: 'Both the L.C.M. and the H.C.F. can be read straight off the prime factors, so the first job is to break each number into primes.'
      - say: '48 is 16 times 3, and 16 is 2 times 2 times 2 times 2, which is 2 to the power 4. Picture each number as a sack of its prime factors.'
        doodle: {name: 'custom:1986_q03_a', id: sacks, caption: 'each number as a sack of primes', size: scene}
        write: '$48 = 16 \times 3 = 2^{4} \times 3$'
      - say: 'The middle sack holds only 2s. 64 is 2 multiplied by itself six times, so 64 is 2 to the power 6.'
        doodle_do: [{id: sacks, op: highlight, part: bag64}]
        write: '$64 = 2^{6}$'
      - say: '80 is 16 times 5, so 80 is 2 to the power 4, times 5.'
        write: '$80 = 16 \times 5 = 2^{4} \times 5$'
      - say: 'Look for the yellow 2s that sit in every sack: four in each. The H.C.F. is the biggest number that divides all three. So we take only the primes found in all three, each to its lowest power. Only 2 is in all three, and its lowest power is 2 to the 4.'
        doodle_do: [{id: sacks, op: circle, part: shared}]
        write: 'H.C.F. $= 2^{4}$'
        point:
          - {line: 2, kind: circle, at: '24', text: 'lowest power'}
          - {line: 5, kind: highlight, at: '24', to: {doodle: sacks, part: shared}}
      - say: '2 to the power 4 is 2 times 2 times 2 times 2, which is 16.'
        write: '$= 16$'
      - say: 'The L.C.M. is the smallest number all three divide into. So we take every prime that appears anywhere, each to its highest power: 2 to the 6, then 3, then 5. Line up the most of each kind from any sack.'
        doodle_do: [{id: sacks, op: stage, stage: 'custom:1986_q03_a2'}]
        write: 'L.C.M. $= 2^{6} \times 3 \times 5$'
        point:
          - {line: 3, kind: circle, at: '26', text: 'highest power'}
          - {line: 7, kind: highlight, at: '26×3×5', to: {doodle: sacks, part: lcm}}
      - say: '2 to the 6 is 64, and 3 times 5 is 15.'
        write: '$= 64 \times 15$'
      - say: '64 times 10 is 640, and 64 times 5 is 320. 640 plus 320 is 960.'
        write: '$= 640 + 320 = 960$'
      - say: 'Now divide the L.C.M. we just found, 960, by the H.C.F. we found, 16.'
        write: '$\dfrac{\text{L.C.M.}}{\text{H.C.F.}} = \dfrac{960}{16}$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '= 960'}, at: '960', text: 'L.C.M.'}
          - {line: 10, kind: move, from: {line: 6, at: '= 16'}, at: '16', text: 'H.C.F.'}
      - say: 'Back to the row of primes at the bottom. 16 times 6 is 96, so 16 times 60 is 960. That means 960 divided by 16 is 60.'
        doodle_do: [{id: sacks, op: label, part: lcm, text: '960 ÷ 16 = 60'}]
        write: '$= 60$'
      - say: 'So the L.C.M. divided by the H.C.F. is 60, which is answer choice D.'
        write: 'L.C.M. $\div$ H.C.F. $= 60$'
        answer: true
    traps:
      A: 'You went for 20. That comes from an L.C.M. of 320, which uses 2 to the 4 instead of 2 to the 6. But 64 needs 2 to the 6, so the L.C.M. is 960, and 960 divided by 16 is 60.'
      B: 'You went for 30. That''s half the answer, from an L.C.M. of 480. The L.C.M. must use the highest power of 2, which is 2 to the 6, giving 960, and 960 divided by 16 is 60.'
      C: 'You went for 48. That''s one of the numbers, not the result. Find the L.C.M., 960, and the H.C.F., 16, then divide to get 60.'
  4:
    moments:
      - say: 'We want the smallest number that 252 can be multiplied by to give a perfect square.'
        write: '$252 \times k = \text{a perfect square}$'
      - say: 'Here''s the key idea. A perfect square is a number times itself, so its prime factors always come in pairs. So let''s break 252 into primes and look for a prime without a partner.'
      - say: '252 is 4 times 63.'
        write: '$252 = 4 \times 63$'
      - say: '4 is 2 times 2. 63 is 9 times 7, and 9 is 3 times 3. Picture the primes as cards looking for partners.'
        doodle: {name: 'custom:1986_q04_a', id: cards, caption: 'prime factors looking for partners'}
        write: '$= 2 \times 2 \times 3 \times 3 \times 7$'
      - say: 'Written with powers, that is 2 squared, times 3 squared, times 7.'
        write: '$= 2^{2} \times 3^{2} \times 7$'
      - say: 'On the cards, the pink 7 has no partner. Now look for pairs. The two 2s make a pair, and the two 3s make a pair. But the 7 is on its own.'
        doodle_do: [{id: cards, op: circle, part: lone}]
        write: 'Unpaired prime: $\ 7$'
        point:
          - {line: 4, kind: circle, at: '× 7', text: 'no partner'}
          - {line: 5, kind: highlight, at: '7', to: {doodle: cards, part: lone}}
      - say: 'So we give the 7 a partner by multiplying by one more 7. Then 7 appears twice, as 7 squared. A second 7 card joins the first.'
        doodle_do: [{id: cards, op: stage, stage: 'custom:1986_q04_a2'}]
        write: '$252 \times 7 = 2^{2} \times 3^{2} \times 7^{2}$'
        point:
          - {line: 6, kind: arrow, from: {line: 5, at: '7'}, at: '252 × [[7]]', text: 'one more 7'}
          - {line: 6, kind: highlight, at: '×7=', to: {doodle: cards, part: new7}}
      - say: 'Now every prime is paired, so this is a square: 2 times 3 times 7, all squared. 2 times 3 is 6, and 6 times 7 is 42.'
        doodle_do: [{id: cards, op: label, part: sq, text: '42 × 42'}]
        write: '$= (2 \times 3 \times 7)^{2} = 42^{2}$'
      - say: 'Let''s check. 252 times 7 is 1764, and 42 times 42 is also 1764.'
        write: 'Check: $\ 252 \times 7 = 1764 = 42 \times 42$'
      - say: 'Look at the new card again. Could a smaller number work? No. Whatever we multiply by must bring a partner for the lonely 7, so it must contain a 7.'
        doodle_do: [{id: cards, op: pulse, part: new7}]
      - say: 'So the smallest number is 7, which is answer choice D.'
        write: 'Smallest multiplier: $\ k = 7$'
        answer: true
    traps:
      A: 'You went for 2. But 252 already has 2 squared in it. Multiplying by 2 makes it 2 cubed, which is odd again. The unpaired prime is 7.'
      B: 'You went for 3. 252 already has 3 squared in it, so a third 3 would spoil the square. The prime that needs a partner is 7.'
      C: 'You went for 5. 5 isn''t a factor of 252 at all, so multiplying by 5 would add a new unpaired prime. The one to pair up is 7.'
  5:
    moments:
      - section: 'The question'
        say: 'Many students simplify this fraction correctly and still pick the wrong option. The question asks for the reciprocal, not the value. Let''s do both.'
        write: 'Find the reciprocal of $\dfrac{\tfrac{2}{3}}{\tfrac{1}{2} + \tfrac{1}{3}}$'
      - say: 'The reciprocal of a number is 1 divided by that number. For a fraction, it is the fraction turned upside down.'
        write: 'Reciprocal of $\dfrac{a}{b}$ is $\dfrac{b}{a}$'
      - say: 'So we first simplify the expression to one fraction, then turn it upside down.'
        write: 'Solution'
      - section: 'The denominator'
        say: 'By BODMAS, the denominator is worked out first, because the fraction line acts like a bracket. A half plus a third: the L.C.M. of 2 and 3 is 6.'
        doodle: {name: 'custom:1986_q05_a', id: bar, caption: 'a half and a third in sixths'}
        write: '$\dfrac{1}{2} + \dfrac{1}{3} = \dfrac{3 + 2}{6}$ (L.C.M. $= 6$)'
      - say: '6 divided by 2 is 3, and 6 divided by 3 is 2. On the bar, 3 sixths and 2 sixths. 3 plus 2 is 5, so the denominator is 5 over 6.'
        doodle_do: [{id: bar, op: label, part: bar, text: '5 of the 6 sixths'}]
        write: '$= \dfrac{5}{6}$'
      - section: 'Divide'
        say: 'So the expression is 2 over 3 divided by 5 over 6.'
        write: '$\dfrac{\tfrac{2}{3}}{\tfrac{5}{6}} = \dfrac{2}{3} \div \dfrac{5}{6}$'
      - say: 'To divide by a fraction, multiply by its reciprocal. 5 over 6 turned upside down is 6 over 5.'
        write: '$= \dfrac{2}{3} \times \dfrac{6}{5}$'
      - say: 'Cancel first: 3 goes into 6 twice. That leaves 2 times 2 over 5, which is 4 over 5.'
        write: '$= \dfrac{2 \times 2}{5} = \dfrac{4}{5}$'
      - section: 'The reciprocal'
        say: 'The expression is 4 over 5. Its reciprocal is 4 over 5 turned upside down: 5 over 4. Watch the card flip.'
        doodle_do: [{id: bar, op: stage, stage: 'custom:1986_q05_a2'}]
        write: '$\therefore$ Reciprocal $= \dfrac{5}{4}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= 54'}, at: '45', text: 'turn it over'}
      - section: 'Check'
        say: 'Check: a number times its reciprocal is always 1. 4 over 5 times 5 over 4 is 20 over 20, which is 1.'
        doodle_do: [{id: bar, op: highlight, part: flip}]
        write: 'Check: $\dfrac{4}{5} \times \dfrac{5}{4} = \dfrac{20}{20} = 1 \ \checkmark$'
      - section: 'Answer'
        say: 'So the reciprocal is 5 over 4, which is option B.'
        write: '$\therefore$ Reciprocal $= \dfrac{5}{4}$'
        answer: true
    traps:
      A: 'You went for 4 over 5. That is the value of the expression, and it is right as far as it goes. But the question asks for its reciprocal, so turn it over: 5 over 4.'
      C: 'You went for 2 over 5. Work the denominator out first: a half plus a third is 5 over 6. Then 2 over 3 divided by 5 over 6 is 4 over 5, and its reciprocal is 5 over 4.'
      D: 'You went for 6 over 7. The denominator is a half plus a third, which is 5 over 6, not 7 over 6. Then the value is 4 over 5, and its reciprocal is 5 over 4.'
  6:
    moments:
      - say: 'Three boys share some oranges. The first gets a third. The second gets two thirds of what is left. The third gets the last 12. How many oranges were there? Picture the three boys in a row.'
        doodle: {name: 'custom:1986_q06_a', id: share, caption: 'The third boy gets the last 12', size: scene}
        write: '1st: $\tfrac{1}{3}$ of all; 2nd: $\tfrac{2}{3}$ of the remainder; 3rd: $12$'
      - say: 'The key word is remainder. The second boy''s share is a fraction of what is left, not of the whole. So we will write each share as a fraction of the whole.'
      - say: 'Picture all the oranges as 9 equal blocks; the first boy takes 3 of them. After the first boy takes a third, what is left is 1 minus a third, which is two thirds of the oranges.'
        doodle_do: [{id: share, op: stage, stage: 'custom:1986_q06_a2'}]
        write: 'Remainder $= 1 - \tfrac{1}{3} = \tfrac{2}{3}$'
      - say: 'The second boy takes two thirds of that remainder. Of means times, so his share is two thirds times two thirds.'
        write: '2nd share $= \tfrac{2}{3} \times \tfrac{2}{3}$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '= 32'}, at: '× 32', text: 'of this'}
      - say: 'Tops: 2 times 2 is 4. Bottoms: 3 times 3 is 9. So the second boy gets 4 over 9 of the whole. On the bar, that is 4 of the 9 blocks.'
        doodle_do: [{id: share, op: stage, stage: 'custom:1986_q06_a3'}, {id: share, op: label, part: b2, text: '4 of 9'}]
        write: '$= \tfrac{4}{9}$'
      - say: 'The third boy gets whatever is left: 1, minus the first share of a third, minus the second share of 4 over 9.'
        write: '3rd share $= 1 - \tfrac{1}{3} - \tfrac{4}{9}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= 94'}, at: '− 94', text: '2nd share'}
      - say: 'Put everything over 9. 1 is 9 over 9, and a third is 3 over 9.'
        write: '$= \tfrac{9}{9} - \tfrac{3}{9} - \tfrac{4}{9}$'
      - say: '9 minus 3 is 6, and 6 minus 4 is 2. So the third boy gets 2 over 9 of the whole. The last 2 pink blocks are his.'
        doodle_do: [{id: share, op: stage, stage: 'custom:1986_q06_a4'}, {id: share, op: label, part: b3, text: '2 of 9 = 12 oranges'}]
        write: '$= \tfrac{2}{9}$'
      - say: 'Now bring in the 12. The third boy got 12 oranges, so 2 over 9 of the total is 12.'
        write: '$\tfrac{2}{9} \times \text{total} = 12$'
        point:
          - {line: 8, kind: move, from: {line: 0, at: '3rd: 12'}, at: '= 12', text: 'given'}
          - {line: 8, kind: highlight, at: '12', to: {doodle: share, part: b3}}
      - say: 'If 2 over 9 of the total is 12, then 1 over 9 of it is half of 12, which is 6.'
        write: '$\tfrac{1}{9} \times \text{total} = 12 \div 2 = 6$'
      - say: 'The whole is 9 over 9, so the total is 9 times 6, which is 54. 9 blocks of 6 oranges.'
        doodle_do: [{id: share, op: label, part: b1, text: '6 in each block'}, {id: share, op: label, part: total, text: '54'}]
        write: 'Total $= 9 \times 6 = 54$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '= 6'}, at: '× 6', text: 'one ninth'}
          - {line: 10, kind: highlight, at: '54', to: {doodle: share, part: total}}
      - say: 'Let''s check. A third of 54 is 18, which leaves 54 minus 18, that is 36.'
        write: 'Check: $\ \tfrac{1}{3} \times 54 = 18,\quad 54 - 18 = 36$'
      - say: 'Two thirds of 36 is 24, which leaves 36 minus 24, that is 12 for the third boy. Just right.'
        write: '$\tfrac{2}{3} \times 36 = 24,\quad 36 - 24 = 12$'
      - say: 'So they shared 54 oranges, which is answer choice B.'
        write: 'Oranges shared $= 54$'
        answer: true
    traps:
      A: 'You went for 60. Test it: a third of 60 is 20, leaving 40, and two thirds of 40 is not a whole number. The third boy gets 2 over 9 of the total, so the total is 54.'
      C: 'You went for 48. A third of 48 is 16, leaving 32, and two thirds of 32 isn''t whole. Work out the third boy''s fraction, 2 over 9, and set it equal to 12.'
      D: 'You went for 42. Test it: a third of 42 is 14, leaving 28, and two thirds of 28 isn''t whole. Remember the second boy takes two thirds of the remainder, not of the whole; then 2 over 9 of the total is 12, so the total is 54.'
  7:
    moments:
      - say: 'We''re told P is 18, Q is 21, R is negative 6 and S is negative 4. We want P minus Q plus 2S, all over R cubed.'
        write: '$\dfrac{P - Q + 2S}{R^{3}}$'
      - say: 'Two of the values are negative, so the danger is in the signs. The safe habit is to put every value in brackets as it goes in.'
        write: '$= \dfrac{(18) - (21) + 2(-4)}{(-6)^{3}}$'
      - say: 'Let''s do the top first. 18 minus 21 is negative 3.'
        write: 'Top: $\ 18 - 21 = -3$'
      - say: 'Next, 2 times negative 4 is negative 8.'
        write: '$2(-4) = -8$'
      - say: 'So the top is the negative 3 plus the negative 8, which is negative 11.'
        write: 'Top $= -3 + (-8) = -11$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '= −3'}, at: '−3 +', text: 'from here'}
          - {line: 4, kind: move, from: {line: 3, at: '= −8'}, at: '(−8)'}
      - say: 'Now the bottom. Negative 6 cubed means negative 6, times negative 6, times negative 6. Picture three tiles, each marked minus 6.'
        doodle: {name: 'custom:1986_q07_a', id: tiles, caption: 'three minus-6 tiles'}
        write: 'Bottom: $\ (-6)^{3} = (-6)(-6)(-6)$'
      - say: 'Pair up the first two tiles. The first two: negative 6 times negative 6 is positive 36, because two negatives make a positive.'
        doodle_do: [{id: tiles, op: stage, stage: 'custom:1986_q07_a2'}]
        write: '$= 36 \times (-6)$'
      - say: 'Now bring in the third tile. 36 times 6 is 216, and a positive times a negative is negative. So the bottom is negative 216.'
        doodle_do: [{id: tiles, op: stage, stage: 'custom:1986_q07_a3'}]
        write: '$= -216$'
        point:
          - {line: 7, kind: highlight, at: '−216', to: {doodle: tiles, part: result}}
      - say: 'Notice the idea here: an odd power of a negative number stays negative. Squaring removes the minus sign; cubing keeps it. On the tiles, the third one has no partner.'
        doodle_do: [{id: tiles, op: circle, part: t3}]
      - say: 'Now put together the top and the bottom we found: negative 11 over negative 216.'
        write: '$\dfrac{P - Q + 2S}{R^{3}} = \dfrac{-11}{-216}$'
        point:
          - {line: 9, kind: move, from: {line: 4, at: '= −11'}, at: '−11', text: 'top'}
          - {line: 9, kind: move, from: {line: 7, at: '= −216'}, at: '−216', text: 'bottom'}
      - say: 'A negative divided by a negative is positive, so the two minus signs cancel.'
        write: '$= \dfrac{11}{216}$'
      - say: 'So the value is 11 over 216, which is answer choice B.'
        write: 'Value $= \dfrac{11}{216}$'
        answer: true
    traps:
      A: 'You went for negative 11 over 216. The top is negative 11, but the bottom is negative too: negative 6 cubed is negative 216. A negative over a negative is positive.'
      C: 'You went for negative 43 over 115. That doesn''t come from these numbers. The top is 18 minus 21 plus 2 times negative 4, which is negative 11, and the bottom is negative 216.'
      D: 'You went for 41 over 116. The bottom must be R cubed, which is negative 216, and the top is negative 11. That gives 11 over 216.'
  8:
    moments:
      - section: 'The question'
        say: 'Five small decimals, multiplied and divided. Two options have the digits 1.3 and two have 7.5. Keep the top on top, and the powers of ten will settle it.'
        write: 'Simplify $\dfrac{0.03 \times 4 \times 0.00064}{0.48 \times 0.012}$'
      - say: 'We write each decimal in standard form, then deal with the numbers and the powers of ten separately, cancelling before we multiply.'
        doodle: {name: 'custom:1986_q08_a', id: hops, caption: 'the point hops right'}
        write: 'Solution'
      - section: 'Standard form'
        say: 'In the numerator, 0.03 is 3 times 10 to the minus 2: the point hops 2 places. 0.00064 is 6.4 times 10 to the minus 4: 4 hops.'
        doodle_do: [{id: hops, op: stage, stage: 'custom:1986_q08_a2'}]
        write: '$0.03 = 3 \times 10^{-2},\quad 0.00064 = 6.4 \times 10^{-4}$'
        point:
          - {line: 2, kind: highlight, at: '10−2', to: {doodle: hops, part: hops1}}
          - {line: 2, kind: highlight, at: '10−4', to: {doodle: hops, part: hops2}}
      - say: 'In the denominator, 0.48 is 4.8 times 10 to the minus 1, and 0.012 is 1.2 times 10 to the minus 2.'
        write: '$0.48 = 4.8 \times 10^{-1},\quad 0.012 = 1.2 \times 10^{-2}$'
      - say: 'Put them in, with the numbers in one fraction and the powers of ten in another.'
        write: '$= \dfrac{3 \times 4 \times 6.4}{4.8 \times 1.2} \times \dfrac{10^{-2} \times 10^{-4}}{10^{-1} \times 10^{-2}}$'
      - section: 'The numbers: cancel first'
        say: 'Cancel first. 6.4 over 4.8 is 64 over 48, and both divide by 16: 4 over 3.'
        write: '$\dfrac{6.4}{4.8} = \dfrac{64}{48} = \dfrac{4}{3}$'
      - say: 'And 3 times 4 is 12, and 12 divided by 1.2 is 10.'
        write: '$\dfrac{3 \times 4}{1.2} = \dfrac{12}{1.2} = 10$'
      - say: 'So the numbers give 10 times 4 over 3, which is 40 over 3.'
        write: 'Numbers $= 10 \times \dfrac{4}{3} = \dfrac{40}{3}$'
      - section: 'The powers'
        say: 'The laws of indices: to multiply powers, add the indices; to divide, subtract them. Numerator: minus 2 plus minus 4 is minus 6. Denominator: minus 1 plus minus 2 is minus 3.'
        write: '$\dfrac{10^{-2} \times 10^{-4}}{10^{-1} \times 10^{-2}} = \dfrac{10^{-6}}{10^{-3}}$'
      - say: 'Minus 6 minus minus 3 is minus 6 plus 3, which is minus 3.'
        write: '$= 10^{-6 - (-3)} = 10^{-3}$'
      - section: 'Put it together'
        say: '40 over 3 is 13.33 and so on. So the value is 13.33 times 10 to the minus 3.'
        write: '$\dfrac{40}{3} \times 10^{-3} = 13.33 \times 10^{-3}$'
        point:
          - {line: 10, kind: move, from: {line: 7, at: '= 340'}, at: '340', text: 'numbers'}
          - {line: 10, kind: move, from: {line: 9, at: '= 10−3'}, at: '× 10−3 =', text: 'powers'}
      - say: '13.33 is not between 1 and 10. Move the point one place to the left, and add 1 to the index: 1.333 times 10 to the minus 2.'
        write: '$= 1.333 \times 10^{-2}$'
      - say: 'To 2 significant figures, the next digit after 1.3 is 3, which is less than 5. So it is 1.3 times 10 to the minus 2.'
        write: '$\therefore$ Value $\approx 1.3 \times 10^{-2}$'
      - section: 'Check'
        say: 'Check with the decimals. The numerator is 0.0000768 and the denominator is 0.00576. The numerator is smaller, so the value is less than 1: about 0.013. It agrees.'
        write: 'Check: $\dfrac{0.0000768}{0.00576} \approx 0.013 \ \checkmark$'
      - section: 'Answer'
        say: 'So the value is 1.3 times 10 to the minus 2, which is option A.'
        write: '$\therefore$ Value $= 1.3 \times 10^{-2}$'
        answer: true
    traps:
      B: 'You went for 1.3 times 10 to the minus 3. The digits are right, but the index is off by one. 13.33 times 10 to the minus 3 is 1.333 times 10 to the minus 2.'
      C: 'You went for 7.5 times 10 to the 1, which is 75. That is the fraction turned upside down. Keep the numerator on top: the value is about 0.013.'
      D: 'You went for 7.5 times 10 to the minus 1. Those are the upside-down digits: 3 over 40 is 0.075. The numerator over the denominator is 40 over 3, times 10 to the minus 3.'
  9:
    moments:
      - section: 'The question'
        say: 'Udoh puts ₦150 in the bank. After 5 years, the simple interest is ₦55. The answer is not 11 percent, though 11 is hiding in there. Let''s find the rate.'
        doodle: {name: 'custom:1986_q09_a', id: bank, caption: '₦150 in the bank for 5 years', size: scene}
        write: 'Principal ₦150, time 5 years, simple interest ₦55. Rate $= ?$'
      - say: 'Write down the givens first. P is 150, T is 5 years, I is 55, and R is what we want.'
        doodle_do: [{id: bank, op: highlight, part: principal}]
        write: 'Solution: $P = 150,\ T = 5,\ I = 55,\ R = ?$'
      - section: 'The formula'
        say: 'Simple interest is the principal times the rate times the time, over 100.'
        write: '$I = \dfrac{PRT}{100}$'
      - say: 'We want R, so make R the subject. Multiply both sides by 100, then divide both sides by P times T.'
        write: '$R = \dfrac{100I}{PT}$'
      - section: 'Substitute'
        say: 'Substitute the givens: 100 times 55, over 150 times 5.'
        write: '$R = \dfrac{100 \times 55}{150 \times 5}$'
        point:
          - {line: 4, kind: move, from: {line: 1, at: 'I = 55'}, at: '× 55', text: 'I'}
      - say: 'Cancel first. 100 and 150 both divide by 50, giving 2 and 3. 55 and 5 both divide by 5, giving 11 and 1.'
        write: '$= \dfrac{2 \times 11}{3 \times 1}$'
      - say: '2 times 11 is 22, so R is 22 over 3.'
        write: '$= \dfrac{22}{3}$'
      - say: '3 goes into 22 seven times, remainder 1. So 22 over 3 is 7 and a third.'
        write: '$\therefore R = 7\tfrac{1}{3}\%$ per annum'
      - section: 'Check'
        say: 'Check. 7 and a third percent of ₦150 is 22 over 300 times 150, which is ₦11 a year. One pile of ₦11 for each year.'
        doodle_do: [{id: bank, op: stage, stage: 'custom:1986_q09_a2'}]
        write: 'Check: $\dfrac{22}{300} \times 150 = $₦$11$ per year'
      - say: 'Over 5 years that is 5 times 11, which is ₦55, the interest we were given.'
        doodle_do: [{id: bank, op: circle, part: interest}]
        write: '$5 \times 11 = $₦$55 \ \checkmark$'
        point:
          - {line: 9, kind: highlight, at: '55', to: {doodle: bank, part: interest}}
      - section: 'Answer'
        say: 'So the rate is 7 and a third percent per annum, which is option B.'
        doodle_do: [{id: bank, op: label, part: principal, text: '7⅓% a year'}]
        write: '$\therefore$ Rate $= 7\tfrac{1}{3}\%$ per annum'
        answer: true
    traps:
      A: 'You went for 11 percent. That is the yearly interest in naira, ₦11, not the rate. ₦11 out of ₦150 is 7 and a third percent.'
      C: 'You went for 5 percent. That is the number of years, not the rate. R equals 100 I over P T gives 7 and a third percent.'
      D: 'You went for 3 and a half percent. Check the formula: R is 100 times 55, over 150 times 5, which is 22 over 3, or 7 and a third percent.'
  10:
    moments:
      - section: 'The question'
        say: 'Pencils are shared among Bisi, Sola and Tunde in the ratio 2 to 3 to 5, and Bisi got 5. But Bisi has 2 parts, not 1, and that one fact decides the answer.'
        doodle: {name: 'custom:1986_q10_a', id: pencils, caption: 'shared in the ratio 2 : 3 : 5', size: scene}
        write: 'Bisi : Sola : Tunde $= 2 : 3 : 5$; Bisi got 5. Total $= ?$'
      - say: 'We name the total, find the sum of ratio, and write Bisi''s share as a fraction of the total.'
        write: 'Solution'
      - say: 'Let the total number of pencils shared be x.'
        write: 'Let the total be $x$'
      - section: 'Sum of ratio'
        say: 'Add the parts of the ratio: 2 plus 3 plus 5 is 10. This is the sum of ratio. Give each share its blocks: 10 blocks in all.'
        doodle_do: [{id: pencils, op: stage, stage: 'custom:1986_q10_a2'}]
        write: 'Sum of ratio $= 2 + 3 + 5 = 10$'
      - say: 'Bisi has 2 of the 10 parts, so Bisi''s share is 2 over 10 of x.'
        write: 'Bisi''s share $= \dfrac{2}{10} \times x$'
      - section: 'Form the equation'
        say: 'Bisi got 5 pencils. So 2 over 10 of x equals 5.'
        doodle_do: [{id: pencils, op: highlight, part: pb}]
        write: '$\dfrac{2}{10} \times x = 5$'
      - say: 'Multiply both sides by 10 over 2, the reciprocal of 2 over 10.'
        write: '$x = 5 \times \dfrac{10}{2}$'
      - say: '10 over 2 is 5, and 5 times 5 is 25.'
        doodle_do: [{id: pencils, op: label, part: parts, text: '25 in all'}]
        write: '$\therefore x = 25$'
      - section: 'Check'
        say: 'Check: Bisi''s share of 25 is 2 over 10 of 25, which is 50 over 10, that is 5. It agrees with the question.'
        write: 'Check: $\dfrac{2}{10} \times 25 = \dfrac{50}{10} = 5 \ \checkmark$'
      - section: 'Answer'
        say: 'So 25 pencils were shared out, which is option B.'
        write: '$\therefore$ Pencils shared $= 25$'
        answer: true
    traps:
      A: 'You went for 15. That is Bisi''s 5 times 3, which uses Sola''s part instead of the sum of ratio. Bisi''s share is 2 over 10 of the total, so the total is 25.'
      C: 'You went for 30. Then Bisi would get 2 over 10 of 30, which is 6, not 5. The equation 2 over 10 of x equals 5 gives 25.'
      D: 'You went for 50. That treats Bisi''s 5 as one part, so 10 parts make 50. But Bisi has 2 parts, and 2 over 10 of 25 is 5. The total is 25.'
  11:
    moments:
      - section: 'The question'
        say: 'Tosan and Isa: their ages differ by 6, and the product of their ages is 187. Picture the two ages as the sides of a rectangle of area 187.'
        doodle: {name: 'custom:1986_q11_a', id: rect, caption: 'two ages as a rectangle'}
        write: 'Ages differ by 6; product $= 187$'
      - section: 'Solution'
        say: 'First we name the unknowns. Let Tosan, the older, be $x$ years, and Isa be $y$ years.'
        write: 'Solution'
      - say: 'Write it down, the way you will in the exam.'
        write: 'Let Tosan be $x$ years and Isa $y$ years'
      - say: 'They differ by 6, and $x$ is bigger, so $x$ minus $y$ equals 6. That is equation 1.'
        write: '$x - y = 6 \quad \text{......(1)}$'
      - say: 'The product of their ages is 187: $xy$ equals 187. That is equation 2.'
        write: '$xy = 187 \quad \text{......(2)}$'
      - say: 'From equation 1, add $y$ to both sides: $x$ equals $y$ plus 6. Call it equation 3. The long side is 6 more than the short side.'
        doodle_do: [{id: rect, op: label, part: xside, text: 'y + 6'}]
        write: 'From (1): $x = y + 6 \quad \text{......(3)}$'
      - say: 'Substitute 3 in 2: put $y$ plus 6 in place of $x$.'
        write: 'Sub. (3) in (2): $(y + 6)y = 187$'
      - say: 'Open the bracket. $y$ times $y$ is $y$ squared, and 6 times $y$ is $6y$. On the rectangle, that is a square and a strip.'
        doodle_do: [{id: rect, op: stage, stage: 'custom:1986_q11_a2'}]
        write: '$y^{2} + 6y = 187$'
        point:
          - {line: 7, kind: highlight, at: 'y2+6y', to: {doodle: rect, part: split}}
      - say: 'Subtract 187 from both sides, so the right-hand side is zero.'
        write: '$y^{2} + 6y - 187 = 0$'
      - section: 'Factorise'
        say: 'The product is negative 187 and the sum is 6.'
        write: 'Product $= -187$, Sum $= 6$'
      - say: '187 is 11 times 17, and 17 minus 11 is 6. So plus 17 and negative 11: they multiply to negative 187 and add to 6.'
        write: 'Factors: $+17$ and $-11$'
      - say: 'Replace $6y$ with $17y$ minus $11y$.'
        write: '$y^{2} + 17y - 11y - 187 = 0$'
      - say: 'Take out $y$ from the first pair and negative 11 from the second. Both brackets are $y$ plus 17.'
        write: '$y(y + 17) - 11(y + 17) = 0$'
      - say: 'Take out the common bracket.'
        write: '$(y + 17)(y - 11) = 0$'
      - say: 'Either $y$ plus 17 is zero or $y$ minus 11 is zero.'
        write: 'Either $y + 17 = 0$ or $y - 11 = 0$'
      - say: 'So $y$ is negative 17 or 11. An age cannot be negative, so we reject negative 17. Therefore $y$ is 11.'
        doodle_do: [{id: rect, op: label, part: yside, text: '11'}]
        write: '$y = -17$ or $11$; $\therefore y = 11$'
        point:
          - {line: 15, kind: strike, at: '−17', text: 'not an age'}
      - say: 'Now back to equation 3. $x$ is 11 plus 6, which is 17.'
        doodle_do: [{id: rect, op: label, part: xside, text: '17'}]
        write: 'From (3): $x = 11 + 6 = 17$'
      - say: 'Therefore Tosan is 17 and Isa is 11.'
        write: '$\therefore (x, y) = (17, 11)$'
      - section: 'Check'
        say: 'Check both facts. 17 minus 11 is 6, and 17 times 11 is 187.'
        write: '$17 - 11 = 6,\ \ 17 \times 11 = 187\ \checkmark$'
      - say: 'So the ages are 17 and 11: option C.'
        write: '$\therefore (17, 11)$ (C)'
        answer: true
    traps:
      A: 'You went for 12 and 9. Those differ by only 3, and their product is 108, not 187. The ages are 17 and 11.'
      B: 'You went for 23 and 17. They do differ by 6, but 23 times 17 is 391, not 187. Both facts must hold.'
      D: 'You went for 18 and 12. They differ by 6, but 18 times 12 is 216, not 187. Only 17 and 11 satisfy both equations.'
  12:
    moments:
      - say: 'In 1984, Ike was 24 and his father was 45. In what year was Ike exactly half his father''s age? Picture Ike and his father in 1984.'
        doodle: {name: 'custom:1986_q12_a', id: ages, caption: 'In 1984: Ike 24, father 45', size: scene}
        write: 'In 1984: Ike $24$, father $45$'
      - say: 'Here''s the key fact for age problems: the difference between two people''s ages never changes, because both of them get one year older every year.'
      - say: 'So how much older is the father? 45 minus 24 is 21 years. That gap is 21 in every year. Look at the gap between the two bars.'
        doodle_do: [{id: ages, op: stage, stage: 'custom:1986_q12_a2'}]
        write: 'Age gap $= 45 - 24 = 21$'
        point:
          - {line: 2, kind: highlight, at: '21', to: {doodle: ages, part: gap}}
      - say: 'Ike is half his father''s age when the father is twice Ike''s age. Let Ike''s age in that year be $I$. Then the father''s age is $2I$.'
        write: 'Ike $= I$; father $= 2I$'
      - say: 'The gap on the bars never changes. The gap between them is still the 21 we found. So $2I$ minus $I$ equals 21.'
        doodle_do: [{id: ages, op: highlight, part: gap}]
        write: '$2I - I = 21$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '= 21'}, at: '= 21', text: 'same gap'}
      - say: '$2I$ minus $I$ is just $I$. So Ike was 21 in that year.'
        write: '$I = 21$'
      - say: 'And his father was 2 times 21, which is 42. On the bars, both ages drop by the same amount, so the gap stays 21.'
        doodle_do: [{id: ages, op: label, part: ikebar, text: '21'}, {id: ages, op: label, part: dadbar, text: '42'}]
        write: 'Father $= 2 \times 21 = 42$'
      - say: 'Ike was 24 in 1984. How many years before that was he 21? 24 minus 21 is 3 years.'
        write: 'Years earlier $= 24 - 21 = 3$'
        point:
          - {line: 0, kind: circle, at: 'Ike 24', text: 'in 1984'}
          - {line: 7, kind: move, from: {line: 5, at: '21'}, at: '− 21', text: 'Ike then'}
      - say: 'So the year was 3 years before 1984. 1984 minus 3 is 1981. Turn the calendar back.'
        doodle_do: [{id: ages, op: label, part: cal, text: '1981'}]
        write: 'Year $= 1984 - 3 = 1981$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= 3'}, at: '− 3', text: '3 years back'}
          - {line: 8, kind: highlight, at: '1981', to: {doodle: ages, part: cal}}
      - say: 'Let''s check. In 1981, the father was 45 minus 3, which is 42, and half of 42 is 21, Ike''s age.'
        write: 'Check: $\ 45 - 3 = 42,\quad \tfrac{1}{2} \times 42 = 21$'
      - say: 'So the year was 1981, which is answer choice B.'
        write: 'Year $= 1981$'
        answer: true
    traps:
      A: 'You went for 1982. In 1982 Ike was 22 and his father was 43, and 22 isn''t half of 43. Ike is half his father''s age when he is 21, the size of the gap.'
      C: 'You went for 1979. In 1979 Ike was 19 and his father was 40. Half of 40 is 20, not 19. The right year is 1981, when they were 21 and 42.'
      D: 'You went for 1978. In 1978 Ike was 18 and his father was 39, so Ike was less than half his age. Go back only 3 years, to 1981.'
  13:
    moments:
      - say: 'We have 1 over root 5 plus root 3, minus 1 over root 5 minus root 3, and all of that times 1 over root 3.'
        write: '$\left(\dfrac{1}{\sqrt{5} + \sqrt{3}} - \dfrac{1}{\sqrt{5} - \sqrt{3}}\right) \times \dfrac{1}{\sqrt{3}}$'
      - say: 'Let''s work on the bracket first. The two denominators are conjugates: the same surds, with opposite signs between them. When we multiply conjugates, the surds disappear.'
      - say: 'To subtract the two fractions, we put them over a common denominator, the product of the two bottoms. Each top gets multiplied by the other bottom.'
        write: 'Bracket $= \dfrac{(\sqrt{5} - \sqrt{3}) - (\sqrt{5} + \sqrt{3})}{(\sqrt{5} + \sqrt{3})(\sqrt{5} - \sqrt{3})}$'
      - say: 'The rule for the difference of two squares: a plus b, times a minus b, is a squared minus b squared.'
        write: 'Difference of two squares: $(a + b)(a - b) = a^{2} - b^{2}$'
      - say: 'The bottom is a difference of two squares: root 5 squared minus root 3 squared. Picture a square whose side is root 5.'
        doodle: {name: 'custom:1986_q13_a', id: squares, caption: 'root 5 squared minus root 3 squared', size: scene}
        write: 'Bottom: $\ (\sqrt{5} + \sqrt{3})(\sqrt{5} - \sqrt{3}) = (\sqrt{5})^{2} - (\sqrt{3})^{2}$'
      - say: 'Cut the square of area 3 out of it. Root 5 squared is 5, and root 3 squared is 3. 5 minus 3 is 2.'
        doodle_do: [{id: squares, op: stage, stage: 'custom:1986_q13_a2'}]
        write: '$= 5 - 3 = 2$'
        point:
          - {line: 5, kind: highlight, at: '5−3=2', to: {doodle: squares, part: rest}}
      - say: 'Now the top. Open the brackets carefully: the minus in front of the second bracket changes both of its signs. Picture the four terms as tiles.'
        doodle: {name: 'custom:1986_q13_b', id: tiles, caption: 'the top as four tiles'}
        write: 'Top: $\ \sqrt{5} - \sqrt{3} - \sqrt{5} - \sqrt{3}$'
      - say: 'Cross out the two yellow root 5 tiles. Root 5 minus root 5 is zero. Minus root 3, minus another root 3, is minus 2 root 3.'
        doodle_do: [{id: tiles, op: cross, part: r5a}, {id: tiles, op: cross, part: r5b}, {id: tiles, op: label, part: sum, text: '−2 root 3'}]
        write: '$= -2\sqrt{3}$'
        point:
          - {line: 6, kind: strike, at: 'Top [[5]]', text: 'cancels'}
          - {line: 6, kind: strike, at: '− 5'}
      - say: 'So the bracket is the top we found over the bottom we found: minus 2 root 3, over 2.'
        write: 'Bracket $= \dfrac{-2\sqrt{3}}{2}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '−23'}, at: '−23', text: 'top'}
          - {line: 8, kind: move, from: {line: 5, at: '= [[2]]'}, at: '= [[2]]', text: 'bottom'}
      - say: 'The 2s cancel, leaving minus root 3.'
        write: '$= -\sqrt{3}$'
      - say: 'Now go back to the whole question. We multiply that bracket by 1 over root 3.'
        write: 'Whole expression $= -\sqrt{3} \times \dfrac{1}{\sqrt{3}}$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '−3'}, at: '−3 ×', text: 'the bracket'}
      - say: 'That is minus root 3 over root 3. Root 3 over root 3 is 1, so we get minus 1.'
        write: '$= -\dfrac{\sqrt{3}}{\sqrt{3}} = -1$'
      - say: 'So the expression simplifies to minus 1, which is answer choice D.'
        write: 'Answer: $\ -1$'
        answer: true
    traps:
      A: 'You went for root 3 over root 5. Combine the fractions over their product: the bottom becomes 5 minus 3, which is 2, and the bracket is minus root 3. Times 1 over root 3 gives minus 1.'
      B: 'You went for minus 2 over root 3. The top of the bracket is minus 2 root 3, and the bottom is 2, so the bracket is minus root 3. Times 1 over root 3 gives minus 1.'
      C: 'You went for minus 2. That forgets to divide by the bottom, which is 5 minus 3, or 2. The bracket is minus root 3, and the answer is minus 1.'
  14:
    moments:
      - say: 'We want $n$ when log base 2 of 4, plus log base 2 of 7, minus log base 2 of $n$, equals 1.'
        write: '$\log_{2}4 + \log_{2}7 - \log_{2}n = 1$'
      - say: 'The plan is to squeeze the three logs into one. Remember the laws of logs, all in the same base: adding logs means multiplying the numbers, and subtracting a log means dividing by its number.'
        write: '$\log A + \log B - \log C = \log \dfrac{A \times B}{C}$'
      - say: 'So the three logs combine into one: log base 2 of 4 times 7, over $n$.'
        write: '$\log_{2}\dfrac{4 \times 7}{n} = 1$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
      - say: '4 times 7 is 28.'
        write: '$\log_{2}\dfrac{28}{n} = 1$'
      - say: 'Now undo the log. What does log base 2 of something equals 1 mean? It means 2 to the power 1 gives that something. Picture log base 2 as counting doubling steps up from 1.'
        doodle: {name: 'custom:1986_q14_a', id: stairs, caption: 'log base 2 counts doubling steps'}
        write: 'If $\log_{2}X = 1$, then $X = 2^{1}$'
      - say: 'One step up the stairs lands on 2. So 28 over $n$ equals 2 to the power 1, which is 2.'
        doodle_do: [{id: stairs, op: circle, part: s1}]
        write: '$\dfrac{28}{n} = 2^{1} = 2$'
        point:
          - {line: 4, kind: box, text: 'the rule'}
      - say: 'Multiply both sides by $n$ to bring it up from the bottom.'
        write: '$28 = 2n$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: 'n'}, at: '2[[n]]', text: 'times n'}
      - say: 'Divide both sides by 2. 28 divided by 2 is 14. So 28 over 14 sits on the first step.'
        doodle_do: [{id: stairs, op: label, part: s1, text: '28 ÷ 14 = 2'}]
        write: '$n = \dfrac{28}{2} = 14$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '= [[2]]n'}, at: '= [[2]]28', text: 'divide by 2'}
      - say: 'Look at the first step again. Let''s check by putting 14 back in. 28 over 14 is 2, and log base 2 of 2 is 1, just as the equation says.'
        doodle_do: [{id: stairs, op: pulse, part: s1}]
        write: 'Check: $\ \log_{2}\dfrac{28}{14} = \log_{2}2 = 1$'
      - say: 'So $n$ is 14, which is answer choice B.'
        write: '$n = 14$'
        answer: true
    traps:
      A: 'You went for 10. Combine the logs into log base 2 of 28 over $n$. That equals 1, so 28 over $n$ is 2, and $n$ is 14.'
      C: 'You went for 27. That looks like 28 minus 1. But logs turn adding into multiplying: 28 over $n$ must equal 2 to the power 1, so $n$ is 14.'
      D: 'You went for 28. That makes 28 over $n$ equal 1, and log base 2 of 1 is 0, not 1. Log base 2 of something equal to 1 means that something is 2, so $n$ is 14.'
  15:
    moments:
      - say: 'We need to simplify 9 to the power a third, times 27 to the power minus a half, all over 3 to the power minus 1 over 6, times 3 to the power minus two thirds.'
        write: '$\dfrac{9^{\frac{1}{3}} \times 27^{-\frac{1}{2}}}{3^{-\frac{1}{6}} \times 3^{-\frac{2}{3}}}$'
      - say: 'The key idea: every number here is a power of 3. 9 is 3 squared, and 27 is 3 cubed. Once everything is a power of 3, we just add and subtract the powers. Picture them as tiles of 3.'
        doodle: {name: 'custom:1986_q15_a', id: threes, caption: '9 and 27 as tiles of 3'}
        write: '$9 = 3^{2},\quad 27 = 3^{3}$'
      - say: 'The law of indices: a power of a power means multiply the powers.'
        write: '$(a^{m})^{n} = a^{mn}$'
      - say: 'Two tiles of 3 make 9. Start with 9 to the power a third. That is 3 squared, to the power a third. A power of a power means we multiply the powers: 2 times a third is two thirds.'
        doodle_do: [{id: threes, op: highlight, part: nine}]
        write: '$9^{\frac{1}{3}} = (3^{2})^{\frac{1}{3}} = 3^{\frac{2}{3}}$'
      - say: 'Three tiles of 3 make 27. Next, 27 to the minus a half is 3 cubed, to the minus a half. 3 times minus a half is minus 3 over 2.'
        doodle_do: [{id: threes, op: highlight, part: twentyseven}]
        write: '$27^{-\frac{1}{2}} = (3^{3})^{-\frac{1}{2}} = 3^{-\frac{3}{2}}$'
      - say: 'The law of indices: to multiply powers of the same base, add the powers.'
        write: '$a^{m} \times a^{n} = a^{m + n}$'
      - say: 'On the top, we multiply these two powers of 3, so we add the powers: two thirds, plus minus 3 over 2.'
        write: 'Top $= 3^{\frac{2}{3}} \times 3^{-\frac{3}{2}} = 3^{\frac{2}{3} - \frac{3}{2}}$'
      - say: 'To subtract, use 6 as the common denominator. Two thirds is 4 over 6, and 3 over 2 is 9 over 6. 4 minus 9 is minus 5, so the power is minus 5 over 6.'
        write: 'Top power: $\ \tfrac{2}{3} - \tfrac{3}{2} = \tfrac{4}{6} - \tfrac{9}{6} = -\tfrac{5}{6}$'
      - say: 'So the top is 3 to the power minus 5 over 6.'
        write: 'Top $= 3^{-\frac{5}{6}}$'
      - say: 'On the bottom we also multiply powers of 3, so again we add the powers: minus 1 over 6, plus minus two thirds.'
        write: 'Bottom $= 3^{-\frac{1}{6}} \times 3^{-\frac{2}{3}} = 3^{-\frac{1}{6} - \frac{2}{3}}$'
      - say: 'Two thirds is 4 over 6. Minus 1 over 6, minus 4 over 6, is minus 5 over 6.'
        write: 'Bottom power: $\ -\tfrac{1}{6} - \tfrac{4}{6} = -\tfrac{5}{6}$'
      - say: 'So the bottom is also 3 to the power minus 5 over 6, exactly the same as the top. Picture the two boxes, top and bottom.'
        doodle: {name: 'custom:1986_q15_b', id: frac, caption: 'the same power on top and bottom'}
        write: 'Bottom $= 3^{-\frac{5}{6}}$'
      - say: 'The law of indices: to divide powers of the same base, subtract the powers.'
        write: '$a^{m} \div a^{n} = a^{m - n}$'
      - say: 'The two boxes match, so they cancel. Now divide the top by the bottom. Dividing powers of 3 means subtracting the powers: minus 5 over 6, minus minus 5 over 6, is 0.'
        doodle_do: [{id: frac, op: cross, part: top}, {id: frac, op: cross, part: bottom}]
        write: '$\dfrac{3^{-\frac{5}{6}}}{3^{-\frac{5}{6}}} = 3^{-\frac{5}{6} - \left(-\frac{5}{6}\right)} = 3^{0}$'
        point:
          - {line: 8, kind: arrow, text: 'top'}
          - {line: 11, kind: arrow, text: 'bottom'}
      - say: 'And any number to the power 0 is 1.'
        doodle_do: [{id: frac, op: label, part: bottom, text: 'anything ÷ itself = 1'}]
        write: '$3^{0} = 1$'
      - say: 'So the expression simplifies to 1, which is answer choice B.'
        write: 'Answer: $\ 1$'
        answer: true
    traps:
      A: 'You went for a third. That is 3 to the power minus 1, so a power has slipped somewhere. The top and bottom are both 3 to the minus 5 over 6, so the answer is 3 to the 0, which is 1.'
      C: 'You went for 3. That comes from a slip with the fractional powers, such as adding two thirds and 3 over 2 without a common denominator. With 6 as the denominator, top and bottom are both 3 to the minus 5 over 6, so the answer is 1.'
      D: 'You went for 9. Rewrite everything as a power of 3 and use common denominators. Top and bottom both come to 3 to the minus 5 over 6, so they divide to 1.'
  16:
    moments:
      - section: 'The question'
        say: '$x$ varies directly as $y$ cubed, and $x$ is 2 when $y$ is 1. When $y$ goes up to 5, does $x$ go up 5 times? Picture $y$ cubed as a cube built of little cubes.'
        doodle: {name: 'custom:1986_q16_a', id: cubes, caption: 'y cubed as a cube of little cubes'}
        write: '$x = 2$ when $y = 1$; $\ x = ?$ when $y = 5$'
      - say: 'Solution. First, the variation statement: $x$ varies directly as $y$ cubed.'
        write: 'Solution: $\ x \propto y^{3}$'
      - say: 'Replace the sign of proportionality with $k$, the constant of variation.'
        write: '$\therefore\ x = ky^{3}$'
      - section: 'Find k'
        say: 'Start with the one little cube. Substitute the pair we are given: $x$ equals 2 and $y$ equals 1.'
        doodle_do: [{id: cubes, op: highlight, part: small}]
        write: 'When $x = 2,\ y = 1$: $\ 2 = k \times 1^{3}$'
        point:
          - {line: 3, kind: move, from: {line: 0, at: 'x = [[2]]'}, at: ':[[2]] =', text: 'x'}
      - say: '1 cubed is 1, so $k$ times 1 is 2, and $k$ is 2.'
        write: '$2 = k \times 1$ $\ \therefore\ k = 2$'
      - section: 'The equation'
        say: 'So the equation connecting $x$ and $y$ is $x$ equals 2 $y$ cubed.'
        write: '$\therefore\ x = 2y^{3}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: 'k = [[2]]'}, at: '[[2]]y3', text: 'k'}
      - section: 'Find x'
        say: 'Now substitute $y$ equals 5.'
        write: 'When $y = 5$: $\ x = 2 \times 5^{3}$'
      - say: '5 cubed is 5 times 5 times 5. 5 times 5 is 25, and 25 times 5 is 125. That is the big cube.'
        doodle_do: [{id: cubes, op: label, part: big, text: '125 little cubes'}]
        write: '$= 2 \times 125$'
      - say: '2 times 125 is 250. Each little cube is worth 2.'
        doodle_do: [{id: cubes, op: label, part: bigx, text: '250'}]
        write: '$\therefore\ x = 250$'
        point:
          - {line: 8, kind: highlight, at: '250', to: {doodle: cubes, part: bigx}}
      - section: 'Check'
        say: 'Check: $y$ went up 5 times, so $y$ cubed, and $x$ with it, went up 5 cubed, which is 125 times. 2 times 125 is 250.'
        write: 'Check: $\ 2 \times 5^{3} = 2 \times 125 = 250\ \checkmark$'
      - say: 'So $x$ is 250: option D.'
        write: '$x = 250$'
        answer: true
    traps:
      A: 'You went for 2. That''s the starting value of $x$. When $y$ goes from 1 to 5, $y$ cubed goes up 125 times, so $x$ goes from 2 to 250.'
      B: 'You went for 10. That treats $x$ as varying with $y$, not $y$ cubed. The equation is $x$ equals 2 $y$ cubed, so $x$ is 2 times 125, which is 250.'
      C: 'You went for 125. That''s 5 cubed, but you''ve left out the constant $k$, which is 2. So $x$ is 2 times 125, which is 250.'
  17:
    moments:
      - section: 'The question'
        say: 'Factorise completely. The word completely warns us there is more than one step: first a common factor, then a sum of two cubes.'
        doodle: {name: 'custom:1986_q17_a', id: cubes, caption: 'two cubes added'}
        write: '$8a + 125ax^{3}$'
      - section: 'Solution'
        say: 'Always look for a common factor first. Both terms have $a$, so take $a$ out.'
        write: 'Solution'
      - say: '$8a$ over $a$ is 8, and $125ax$ cubed over $a$ is $125x$ cubed.'
        write: '$= a(8 + 125x^{3})$'
      - say: 'Inside the bracket, 8 is 2 cubed, and $125x$ cubed is $5x$, all cubed. It is a sum of two cubes, like the two cubes in the picture.'
        doodle_do: [{id: cubes, op: pulse}]
        write: '$= a[2^{3} + (5x)^{3}]$'
      - say: 'Recall the sum of two cubes: $p$ cubed plus $q$ cubed is $p$ plus $q$, times $p$ squared minus $pq$ plus $q$ squared.'
        write: '$p^{3} + q^{3} = (p + q)(p^{2} - pq + q^{2})$'
      - say: 'Here $p$ is 2 and $q$ is $5x$. They are the edges of the two cubes.'
        doodle_do: [{id: cubes, op: label, part: small, text: 'p = 2'}, {id: cubes, op: label, part: big, text: 'q = 5x'}]
        write: '$p = 2,\ q = 5x$'
      - say: 'Substitute, keeping every value in brackets.'
        doodle_do: [{id: cubes, op: circle, part: plus}]
        write: '$= a(2 + 5x)[(2)^{2} - (2)(5x) + (5x)^{2}]$'
      - say: '2 squared is 4. 2 times $5x$ is $10x$. $5x$ squared is $25x$ squared. Notice the middle sign is minus.'
        write: '$= a(2 + 5x)(4 - 10x + 25x^{2})$'
        point:
          - {line: 7, kind: underline, at: '−10x', text: 'minus in the middle'}
      - section: 'Check'
        say: 'Check with $a$ and $x$ both 1. The question gives 8 plus 125, which is 133. The factors give 1 times 7 times 19, also 133.'
        write: '$8 + 125 = 133,\ \ 1 \times 7 \times 19 = 133\ \checkmark$'
      - say: 'So the complete factorisation is option B.'
        write: '$\therefore a(2 + 5x)(4 - 10x + 25x^{2})$ (B)'
        answer: true
    traps:
      A: 'You went for option A. Opening it gives terms like 50a squared x and 20x squared, which are not in the question. Take out a first, then use the sum of two cubes with 2 and 5x.'
      C: 'You went for option C. The a is in the wrong places. It is a common factor of the whole expression, so it comes out in front, and the last bracket is 4 minus 10x plus 25x squared.'
      D: 'You went for option D. In a sum of two cubes, the middle term of the second bracket is minus pq: minus 10x, with no a in it.'
  18:
    moments:
      - section: 'The question'
        say: 'Put negative 2 into two fractions and add. Negative numbers are where signs go wrong, so brackets will protect us. Picture negative 2 going into two machines.'
        doodle: {name: 'custom:1986_q18_a', id: machines, caption: 'minus 2 into two machines', size: scene}
        write: '$y = \dfrac{x}{x - 3} + \dfrac{x}{x + 4}$, $x = -2$'
      - section: 'Solution'
        say: 'Substitute $x$ equals negative 2 everywhere, putting it in brackets.'
        doodle_do: [{id: machines, op: highlight, part: m1}]
        write: 'Solution'
      - say: '$y$ equals negative 2 over negative 2 minus 3, plus negative 2 over negative 2 plus 4.'
        write: '$y = \dfrac{(-2)}{(-2) - 3} + \dfrac{(-2)}{(-2) + 4}$'
      - say: 'Work out the denominators. Negative 2 minus 3 is negative 5. Negative 2 plus 4 is 2.'
        write: '$= \dfrac{-2}{-5} + \dfrac{-2}{2}$'
      - say: 'A negative divided by a negative is positive, so the first is 2 over 5. The second is negative 2 over 2, which is negative 1.'
        doodle_do: [{id: machines, op: label, part: out1, text: '2/5'}, {id: machines, op: label, part: out2, text: '−1'}]
        write: '$= \dfrac{2}{5} - 1$'
      - say: 'Write 1 as 5 over 5, so both have the same denominator.'
        write: '$= \dfrac{2}{5} - \dfrac{5}{5}$'
      - say: '2 minus 5 is negative 3. Therefore $y$ is negative 3 over 5.'
        doodle_do: [{id: machines, op: label, part: sum, text: '−3/5'}]
        write: '$\therefore y = -\dfrac{3}{5}$'
      - section: 'Check'
        say: 'Check another way: add the fractions first. The L.C.M. is $x$ minus 3, times $x$ plus 4.'
        write: '$y = \dfrac{x(x + 4) + x(x - 3)}{(x - 3)(x + 4)}$'
      - say: 'Open the brackets on top: $x$ squared plus $4x$ plus $x$ squared minus $3x$ is $2x$ squared plus $x$.'
        write: '$= \dfrac{2x^{2} + x}{(x - 3)(x + 4)}$'
      - say: 'Now put $x$ equals negative 2. The top is 8 minus 2, which is 6. The bottom is negative 5 times 2, negative 10. 6 over negative 10 is negative 3 over 5.'
        write: '$= \dfrac{8 - 2}{(-5)(2)} = -\dfrac{3}{5}\ \checkmark$'
      - say: 'So $y$ is negative 3 over 5: option A.'
        write: '$\therefore y = -\tfrac{3}{5}$ (A)'
        answer: true
    traps:
      B: 'You went for 3 over 5. The first fraction is 2 over 5, but the second is negative 1, and 2 over 5 minus 1 is negative 3 over 5. Watch the sign.'
      C: 'You went for negative 7 over 5. That treats negative 2 over negative 5 as negative. A negative over a negative is positive, so it is 2 over 5, and 2 over 5 minus 1 is negative 3 over 5.'
      D: 'You went for 7 over 5. That adds 1 instead of subtracting it. Negative 2 over 2 is negative 1, so y is 2 over 5 minus 1, which is negative 3 over 5.'
  19:
    moments:
      - section: 'The question'
        say: 'Fractions on both sides of an inequality. The neat way is to clear them all in one move, with the L.C.M.'
        write: '$\tfrac{1}{3}(x + 1) - 1 > \tfrac{1}{5}(x + 4)$'
      - say: 'Solution. The denominators are 3 and 5, so the L.C.M. is 15. Multiply every term by 15. 15 is positive, so the sign stays.'
        write: 'Solution: multiply through by the L.C.M., 15'
      - say: '15 times a third is 5. 15 times 1 is 15. And 15 times a fifth is 3.'
        write: '$5(x + 1) - 15 > 3(x + 4)$'
      - say: 'Open the brackets. 5 times $x$ plus 1 is $5x$ plus 5. 3 times $x$ plus 4 is $3x$ plus 12.'
        write: '$5x + 5 - 15 > 3x + 12$'
      - say: 'Collect like terms: $x$ terms on the left, numbers on the right. Subtract $3x$ from both sides, and add 15 and take away 5.'
        write: '$5x - 3x > 12 - 5 + 15$'
      - say: '$5x$ minus $3x$ is $2x$. 12 minus 5 is 7, and 7 plus 15 is 22.'
        write: '$2x > 22$'
      - say: 'Divide both sides by 2. 2 is positive, so the sign stays. 22 divided by 2 is 11.'
        write: '$\therefore\ x > 11$'
      - section: 'The number line'
        say: 'On a number line: an open circle at 11, because 11 itself is not included, and an arrow to the right for every number bigger.'
        diagram: {id: n, kind: numberline, range: [6, 16]}
        diagram_do:
          - {id: n, op: interval, from: 11, from_open: true, text: 'x > 11', answer: true, 'on': 'open circle'}
      - section: 'Check'
        say: 'Check with $x$ equals 14. The left side: a third of 15 is 5, minus 1 is 4. The right side: a fifth of 18 is 3.6.'
        write: 'Check $x = 14$: $\ \tfrac{1}{3}(15) - 1 = 4,\ \ \tfrac{1}{5}(18) = 3.6$'
        diagram_do:
          - {id: n, op: point, x: 14, text: 'test 14'}
      - say: '4 is greater than 3.6, so 14 works.'
        write: '$4 > 3.6\ \checkmark$'
      - say: 'So $x$ is greater than 11: option D.'
        write: '$x > 11$'
        answer: true
    traps:
      A: 'You went for $x$ less than 11. The sign only reverses when you multiply or divide by a negative number. Here we used only 15 and 2, both positive, so it stays: $x$ greater than 11.'
      B: 'You went for $x$ less than minus 1. Multiply through by 15 to get $5x$ minus 10 greater than $3x$ plus 12. That gives $2x$ greater than 22, so $x$ is greater than 11.'
      C: 'You went for $x$ greater than 6. Check the numbers: 5 minus 15 is minus 10, and 3 times 4 is 12. Then $2x$ is greater than 22, so $x$ is greater than 11.'
  20:
    moments:
      - section: 'The question'
        say: 'Four terms, and nothing common to all of them. That tells us to factorise by grouping. Picture each term as a tile.'
        doodle: {name: 'custom:1986_q20_a', id: tiles, caption: 'four area tiles', size: scene}
        write: '$x^{2} + 2a + ax + 2x$'
      - section: 'Solution'
        say: 'First rearrange, so that terms with a common factor sit side by side. Then factorise each pair.'
        write: 'Solution'
      - say: 'Put $x$ squared next to $ax$; both have $x$. Put $2x$ next to $2a$; both have 2.'
        write: '$= x^{2} + ax + 2x + 2a$'
      - say: 'From the first pair take out $x$, leaving $x$ plus $a$. From the second pair take out 2, leaving $x$ plus $a$. Both brackets are the same.'
        doodle_do: [{id: tiles, op: label, part: pair1, text: 'x(x + a)'}, {id: tiles, op: label, part: pair2, text: '2(x + a)'}]
        write: '$= x(x + a) + 2(x + a)$'
      - say: 'Take out the common bracket, $x$ plus $a$. What is left is $x$ plus 2. The four tiles fit into one rectangle.'
        doodle_do: [{id: tiles, op: stage, stage: 'custom:1986_q20_a2'}]
        write: '$= (x + a)(x + 2)$'
        point:
          - {line: 4, kind: highlight, at: '(x+a)(x+2)', to: {doodle: tiles, part: rect}}
      - section: 'Check'
        say: 'Check by opening the brackets: $x$ times $x$ plus 2, then $a$ times $x$ plus 2.'
        write: '$x(x + 2) + a(x + 2)$'
      - say: 'That is $x$ squared plus $2x$ plus $ax$ plus $2a$: the four tiles of the question.'
        doodle_do: [{id: tiles, op: pulse, part: rect}]
        write: '$= x^{2} + 2x + ax + 2a\ \checkmark$'
      - say: 'So the factors are $x$ plus 2 and $x$ plus $a$: option D.'
        write: '$\therefore (x + 2)(x + a)$ (D)'
        answer: true
    traps:
      A: 'You went for (x plus 2a)(x plus 1). Opening it gives x squared plus x plus 2ax plus 2a. That has 2ax and x, not ax and 2x. Group in pairs to get (x plus 2)(x plus a).'
      B: 'You went for (x plus 2a)(x minus 1). Opening it gives a minus x and a 2ax that are not in the question. Group as x(x plus a) plus 2(x plus a).'
      C: 'You went for (x squared minus 1)(x plus a). Opening it gives x cubed, which the question does not have. The factors are (x plus 2)(x plus a).'
  21:
    moments:
      - section: 'The question'
        say: 'Look at the options: every one has a square root. That tells us this quadratic will not factorise, so we use the almighty formula.'
        doodle: {name: 'custom:1986_q21_a', id: abc, caption: 'a, b and c'}
        write: '$3x^{2} + 6x - 2 = 0$'
      - section: 'Solution'
        say: 'Write the quadratic formula first, exactly. The whole of the top is divided by $2a$.'
        write: 'Solution'
      - say: '$x$ equals negative $b$, plus or minus the square root of $b$ squared minus $4ac$, all over $2a$.'
        write: '$x = \dfrac{-b \pm \sqrt{b^{2} - 4ac}}{2a}$'
      - say: 'Compare with $ax$ squared plus $bx$ plus $c$. $a$ is 3, $b$ is 6, and $c$ is negative 2. Watch that minus sign on $c$.'
        doodle_do: [{id: abc, op: circle, part: c}]
        write: '$a = 3,\ b = 6,\ c = -2$'
      - say: 'Substitute, keeping every value in brackets.'
        write: '$x = \dfrac{-(6) \pm \sqrt{(6)^{2} - 4(3)(-2)}}{2(3)}$'
        point:
          - {line: 4, kind: underline, at: '(−2)', text: 'c in brackets'}
      - say: '6 squared is 36. 4 times 3 times negative 2 is negative 24, and minus negative 24 is plus 24. The bottom, 2 times 3, is 6.'
        doodle_do: [{id: abc, op: label, part: c, text: '−(−24) = +24'}]
        write: '$= \dfrac{-6 \pm \sqrt{36 + 24}}{6}$'
      - say: '36 plus 24 is 60.'
        write: '$= \dfrac{-6 \pm \sqrt{60}}{6}$'
      - say: 'Simplify root 60. 60 is 4 times 15, and root 4 is 2, so root 60 is 2 root 15. Picture a square of area 60 made of four squares of 15.'
        doodle: {name: 'custom:1986_q21_b', id: square, caption: 'root 60 as a square'}
        doodle_do: [{id: square, op: label, part: side, text: '2 root 15'}]
        write: '$\sqrt{60} = \sqrt{4 \times 15} = 2\sqrt{15}$'
      - say: 'Put 2 root 15 in place of root 60.'
        write: '$x = \dfrac{-6 \pm 2\sqrt{15}}{6}$'
      - say: 'Divide each term on top by 6. Negative 6 over 6 is negative 1, and 2 root 15 over 6 is root 15 over 3.'
        write: '$\therefore x = -1 \pm \dfrac{\sqrt{15}}{3}$'
      - section: 'Check'
        say: 'Check with the sum of roots, which must be negative $b$ over $a$: negative 6 over 3, negative 2. The root 15 parts cancel, and negative 1 plus negative 1 is negative 2.'
        write: 'Sum $= -1 + (-1) = -2 = -\tfrac{6}{3}\ \checkmark$'
      - say: 'And the product must be $c$ over $a$, negative 2 over 3. Negative 1 squared minus 15 over 9 is 9 over 9 minus 15 over 9, negative 6 over 9: negative 2 over 3.'
        write: 'Product $= 1 - \tfrac{15}{9} = -\tfrac{2}{3}\ \checkmark$'
      - say: 'So $x$ is negative 1 plus or minus root 15 over 3: option B.'
        write: '$\therefore x = -1 \pm \tfrac{\sqrt{15}}{3}$ (B)'
        answer: true
    traps:
      A: 'You went for negative 1 plus or minus root 3 over 3. That comes from 36 minus 24, which is 12. But c is negative, so minus 4ac is plus 24, giving 60 under the root.'
      C: 'You went for negative 2 plus or minus 2 root 3 over 3. That uses 36 minus 24 under the root and divides by 3, not 6. The bottom is 2a, which is 6, and the root is of 60.'
      D: 'You went for negative 2 plus or minus 2 root 15 over 3. The root of 60 is right, but you divided by 3, not by 2a, which is 6. Dividing by 6 gives negative 1 plus or minus root 15 over 3.'
  22:
    moments:
      - section: 'The question'
        say: 'Two fractions with different denominators. Like a fifth plus a seventh, we need the L.C.M. But first, factorise the denominators. Picture a bar cut in 5 and a bar cut in 7.'
        doodle: {name: 'custom:1986_q22_a', id: bars, caption: 'a fifth and a seventh'}
        write: '$\dfrac{1}{5x + 5} + \dfrac{1}{7x + 7}$'
      - section: 'Solution'
        say: 'With algebraic fractions, always factorise every denominator first. Then the L.C.M. is easy to see.'
        write: 'Solution'
      - say: 'Take out 5 from the first denominator: $5x$ plus 5 is 5 times $x$ plus 1.'
        write: '$5x + 5 = 5(x + 1)$'
      - say: 'Take out 7 from the second: $7x$ plus 7 is 7 times $x$ plus 1.'
        write: '$7x + 7 = 7(x + 1)$'
      - say: 'Both share $x$ plus 1. So the L.C.M. is 5 times 7 times $x$ plus 1, which is 35 times $x$ plus 1. Cut both bars into 35 pieces.'
        doodle_do: [{id: bars, op: stage, stage: 'custom:1986_q22_a2'}]
        write: 'L.C.M. $= 35(x + 1)$'
      - say: 'Write both fractions over the L.C.M. 35 divided by 5 is 7, so the first top becomes 7. 35 divided by 7 is 5, so the second top becomes 5.'
        write: '$= \dfrac{7 + 5}{35(x + 1)}$'
        point:
          - {line: 5, kind: underline, at: '7+5', text: 'new tops'}
      - say: '7 plus 5 is 12. On the bars: 7 pieces plus 5 pieces is 12 pieces out of 35.'
        doodle_do: [{id: bars, op: label, part: grid, text: '7 + 5 = 12 of 35'}]
        write: '$= \dfrac{12}{35(x + 1)}$'
      - say: 'Open the bracket in the denominator: 35 times $x$ is $35x$, and 35 times 1 is 35.'
        write: '$= \dfrac{12}{35x + 35}$'
      - section: 'Check'
        say: 'Check with $x$ equals 0. The question gives 1 over 5 plus 1 over 7, which is 7 over 35 plus 5 over 35: 12 over 35. Our answer gives 12 over 35 too.'
        write: '$x = 0$: $\tfrac{1}{5} + \tfrac{1}{7} = \tfrac{12}{35} = \tfrac{12}{0 + 35}\ \checkmark$'
      - say: 'So the sum is 12 over $35x$ plus 35: option D.'
        write: '$\therefore \dfrac{12}{35x + 35}$ (D)'
        answer: true
    traps:
      A: 'You went for 12 over 35, plus 7. That is not a single fraction, and it has lost the x. Factorise the denominators, use the L.C.M. 35(x plus 1), and you get 12 over 35x plus 35.'
      B: 'You went for 1 over 35(x plus 1). The denominator is right, but the tops do not stay as 1. The first becomes 7 and the second becomes 5, so the top is 12.'
      C: 'You went for 12x over 35(x plus 1). Adding two fractions with 1 on top cannot create an x on top. The top is 7 plus 5, which is just 12.'
  23:
    moments:
      - section: 'The question'
        say: 'Where does this upside-down curve cross the two axes? Two simple rules turn this into one quadratic.'
        write: '$y = -x^{2} + 3x + 4$'
      - say: 'Here is a sketch of the curve. It cuts the $y$-axis once and the $x$-axis twice.'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: 'y = −x² + 3x + 4', text: 'the curve'}
      - section: 'Solution'
        say: 'On the $y$-axis, $x$ is zero. On the $x$-axis, $y$ is zero. So we substitute twice.'
        write: 'Solution'
        point:
          - {figure: sketch, kind: circle, target: 'y', text: 'y-axis: x = 0'}
          - {figure: sketch, kind: circle, target: 'x', text: 'x-axis: y = 0'}
      - section: 'The y-axis'
        say: 'Put $x$ equals 0 into the equation, in brackets.'
        write: 'When $x = 0$: $y = -(0)^{2} + 3(0) + 4$'
      - say: 'Every $x$ term is zero, so $y$ is 4. The curve cuts the $y$-axis at 0, 4.'
        write: '$y = 4$; point $(0, 4)$'
        point:
          - {figure: sketch, kind: circle, target: '(0, 4)', text: 'y-axis'}
      - section: 'The x-axis'
        say: 'Now put $y$ equals 0.'
        write: 'When $y = 0$: $-x^{2} + 3x + 4 = 0$'
      - say: 'Multiply through by negative 1, so that $x$ squared is positive. Every sign changes.'
        write: '$x^{2} - 3x - 4 = 0$'
      - say: 'The product is negative 4 and the sum is negative 3.'
        write: 'Product $= -4$, Sum $= -3$'
      - say: 'Negative 4 and plus 1: they multiply to negative 4 and add to negative 3.'
        write: 'Factors: $-4$ and $+1$'
      - say: 'Replace negative $3x$ with negative $4x$ plus $x$.'
        write: '$x^{2} - 4x + x - 4 = 0$'
      - say: 'Take out $x$ from the first pair and 1 from the second. Both brackets are $x$ minus 4.'
        write: '$x(x - 4) + 1(x - 4) = 0$'
      - say: 'Take out the common bracket.'
        write: '$(x - 4)(x + 1) = 0$'
      - say: 'Either $x$ minus 4 is zero or $x$ plus 1 is zero.'
        write: 'Either $x - 4 = 0$ or $x + 1 = 0$'
      - say: 'So $x$ is 4 or negative 1. The curve cuts the $x$-axis at 4, 0 and negative 1, 0.'
        write: '$x = 4$ or $x = -1$'
        point:
          - {figure: sketch, kind: circle, target: '(4, 0)'}
          - {figure: sketch, kind: circle, target: '(−1, 0)'}
      - say: 'Therefore the three points are 0, 4, then 4, 0, and negative 1, 0.'
        write: '$\therefore (0, 4),\ (4, 0),\ (-1, 0)$'
      - section: 'Check'
        say: 'Check 4, 0 in the equation. Negative 4 squared is negative 16, plus 12, plus 4, is 0.'
        write: '$x = 4$: $-16 + 12 + 4 = 0\ \checkmark$'
      - say: 'Check negative 1, 0. Negative 1 squared is negative 1, minus 3, plus 4, is 0.'
        write: '$x = -1$: $-1 - 3 + 4 = 0\ \checkmark$'
      - say: 'So the points are option D.'
        write: '$\therefore (0, 4), (4, 0), (-1, 0)$ (D)'
        answer: true
    traps:
      A: 'You went for the set with 0, 0. The curve passes through the origin only if the constant term is 0, but here it is 4. Putting x equals 0 gives y equals 4, so the point is 0, 4.'
      B: 'You went for the set with negative 4, 0 and 1, 1. The roots of x squared minus 3x minus 4 are 4 and negative 1, not negative 4 and 1. And 1, 1 is not on an axis at all.'
      C: 'You went for 0, 0, then 0, 1, then 1, 0. None of these is on the curve. Put x equals 0 to get 0, 4, and y equals 0 to get 4, 0 and negative 1, 0.'
  24:
    moments:
      - section: 'The question'
        say: 'One square minus another square. Do not open the squares: there is a much shorter way. Picture a big square with a small square cut from its corner.'
        doodle: {name: 'custom:1986_q24_a', id: sq, caption: 'a square with a corner cut out', size: scene}
        write: '$(4a + 3)^{2} - (3a - 2)^{2}$'
      - section: 'Solution'
        say: 'This is a difference of two squares, so we use the rule for it.'
        write: 'Solution'
      - say: 'Recall: $A$ squared minus $B$ squared is $A$ minus $B$, times $A$ plus $B$.'
        write: '$A^{2} - B^{2} = (A - B)(A + B)$'
      - say: 'Here $A$ is $4a$ plus 3 and $B$ is $3a$ minus 2. Those are the sides of the two squares.'
        doodle_do: [{id: sq, op: label, part: aside, text: '4a + 3'}, {id: sq, op: label, part: bside, text: '3a − 2'}]
        write: '$A = 4a + 3,\ B = 3a - 2$'
      - say: 'Substitute, keeping $B$ in brackets, because the minus sign applies to all of it.'
        write: '$= [(4a + 3) - (3a - 2)][(4a + 3) + (3a - 2)]$'
      - say: 'Open the inner brackets. In the first, minus $3a$ minus 2 becomes minus $3a$ plus 2. In the second, nothing changes.'
        doodle_do: [{id: sq, op: stage, stage: 'custom:1986_q24_a2'}]
        write: '$= (4a + 3 - 3a + 2)(4a + 3 + 3a - 2)$'
        point:
          - {line: 5, kind: circle, at: '−3a+2', text: 'signs change'}
      - say: 'Collect like terms. In the first bracket, $4a$ minus $3a$ is $a$, and 3 plus 2 is 5. In the second, $4a$ plus $3a$ is $7a$, and 3 minus 2 is 1.'
        doodle_do: [{id: sq, op: label, part: rect, text: 'height a + 5'}, {id: sq, op: label, part: rtop, text: '7a + 1'}]
        write: '$= (a + 5)(7a + 1)$'
        point:
          - {line: 6, kind: highlight, at: '(a+5)(7a+1)', to: {doodle: sq, part: rbot}}
      - section: 'Check'
        say: 'Check with $a$ equals 0. The question gives 3 squared minus negative 2 squared: 9 minus 4, which is 5.'
        write: '$a = 0$: $3^{2} - (-2)^{2} = 9 - 4 = 5$'
      - say: 'Our factors give 5 times 1, which is 5. They agree.'
        write: '$(0 + 5)(0 + 1) = 5\ \checkmark$'
      - say: 'So the factors are $a$ plus 5 and $7a$ plus 1: option C.'
        write: '$\therefore (a + 5)(7a + 1)$ (C)'
        answer: true
    traps:
      A: 'You went for (a plus 1)(a plus 5). The a plus 5 is right, but A plus B is 4a plus 3a, which is 7a, plus 1. So the second factor is 7a plus 1.'
      B: 'You went for (a minus 5)(7a minus 1). That is a sign slip. Keep B in brackets before subtracting: minus negative 2 is plus 2, so A minus B is a plus 5.'
      D: 'You went for a(7a plus 1). That drops the numbers in A minus B. 3 minus negative 2 is 5, so the first factor is a plus 5.'
  25:
    moments:
      - say: 'We''re told 5 to the power $x$ plus $2y$ is 5, and 4 to the power $x$ plus $3y$ is 16. We want 3 to the power $x$ plus $y$.'
        write: '$5^{x + 2y} = 5,\ \ 4^{x + 3y} = 16$'
      - say: 'When the unknowns are up in the powers, we write both sides with the same base. Then the powers must be equal.'
        write: 'Same base $\Rightarrow$ equal powers'
      - say: 'Take the first equation. 5 on its own is 5 to the power 1.'
        write: '$5^{x + 2y} = 5^{1}$'
      - say: 'The bases match, so the powers match. Picture it as a strip of tiles: one $x$ and two $y$s.'
        doodle: {name: 'custom:1986_q25_a', id: strips, caption: 'x + 2y = 1 as a strip'}
        write: '$x + 2y = 1$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '5[[x + 2y]]'}, at: 'x + 2y', text: 'the powers'}
      - say: 'Now the second equation. 16 is 4 squared, so it says 4 to the $x$ plus $3y$ equals 4 squared.'
        write: '$4^{x + 3y} = 4^{2}$'
      - say: 'Again, the bases match, so we equate the powers. A second strip, with one more $y$.'
        doodle_do: [{id: strips, op: stage, stage: 'custom:1986_q25_a2'}]
        write: '$x + 3y = 2$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '4[[x + 3y]]'}, at: 'x + 3y', text: 'the powers'}
      - say: 'Now we have two simultaneous equations. Take the second minus the first, so the $x$ terms cancel.'
        write: '$(x + 3y) - (x + 2y) = 2 - 1$'
      - say: 'The strips differ by one yellow tile. $3y$ minus $2y$ is $y$, and 2 minus 1 is 1.'
        doodle_do: [{id: strips, op: circle, part: extra}]
        write: '$y = 1$'
        point:
          - {line: 7, kind: highlight, at: 'y=1', to: {doodle: strips, part: extra}}
      - say: 'Put $y$ equals 1 back into the first equation, $x$ plus $2y$ equals 1.'
        write: '$x + 2(1) = 1$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: 'y = [[1]]'}, at: '2(1)', text: 'y = 1'}
          - {line: 8, kind: arrow, from: {line: 3, at: 'x + 2y'}, at: 'x + 2(1)', text: 'into this'}
      - say: 'That is $x$ plus 2 equals 1. Take 2 from both sides: 1 minus 2 is negative 1. So the purple tile is minus 1.'
        doodle_do: [{id: strips, op: label, part: x1, text: '−1'}]
        write: '$x = 1 - 2 = -1$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '+ 2(1)'}, at: '1 [[− 2]]', text: 'across the ='}
      - say: 'So $x$ plus $y$ is negative 1 plus 1, which is 0.'
        write: '$x + y = -1 + 1 = 0$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '= −1'}, at: '−1 +', text: 'x'}
          - {line: 10, kind: move, from: {line: 7, at: 'y = 1'}, at: '+ 1', text: 'y'}
      - say: 'So 3 to the power $x$ plus $y$ is 3 to the power 0. Any number to the power 0 is 1.'
        write: '$3^{x + y} = 3^{0} = 1$'
      - say: 'So the value is 1, which is answer choice B.'
        write: '$3^{x + y} = 1$'
        answer: true
    traps:
      A: 'You went for 0. That''s $x$ plus $y$, the power, not the final answer. The question wants 3 to that power, and 3 to the 0 is 1.'
      C: 'You went for 3. That''s 3 to the power 1. But $x$ plus $y$ is negative 1 plus 1, which is 0, and 3 to the 0 is 1.'
      D: 'You went for 27, which is 3 cubed. Solve the two equations carefully: $y$ is 1 and $x$ is negative 1, so $x$ plus $y$ is 0, and 3 to the 0 is 1.'
  26:
    moments:
      - section: 'The question'
        say: 'Three fractions to add. The last denominator holds a secret: it already contains the other two. Picture $x$ squared minus 4 as a rectangle.'
        doodle: {name: 'custom:1986_q26_a', id: box, caption: 'x² − 4 as a rectangle'}
        write: '$\dfrac{1}{x - 2} + \dfrac{1}{x + 2} + \dfrac{2x}{x^{2} - 4}$'
      - section: 'Solution'
        say: 'Factorise every denominator first. $x$ squared minus 4 is a difference of two squares.'
        write: 'Solution'
      - say: '$x$ squared minus 4 is $x$ squared minus 2 squared, which is $x$ minus 2, times $x$ plus 2. Those are the two sides of the rectangle.'
        doodle_do: [{id: box, op: highlight, part: top}, {id: box, op: highlight, part: left}]
        write: '$x^{2} - 4 = (x - 2)(x + 2)$'
      - say: 'So the L.C.M. of the three denominators is $x$ minus 2, times $x$ plus 2.'
        write: 'L.C.M. $= (x - 2)(x + 2)$'
      - say: 'Write everything over the L.C.M. The first top is multiplied by $x$ plus 2, the second by $x$ minus 2, and the third stays $2x$.'
        write: '$= \dfrac{(x + 2) + (x - 2) + 2x}{(x - 2)(x + 2)}$'
      - say: 'Collect like terms on top. $x$ plus $x$ plus $2x$ is $4x$, and 2 minus 2 is 0.'
        write: '$= \dfrac{4x}{(x - 2)(x + 2)}$'
        point:
          - {line: 5, kind: circle, at: '4x', text: '2 − 2 = 0'}
      - say: 'Multiply out the denominator back to $x$ squared minus 4.'
        doodle_do: [{id: box, op: label, part: area, text: '4x over this'}]
        write: '$= \dfrac{4x}{x^{2} - 4}$'
      - section: 'Check'
        say: 'Check with $x$ equals 3. The question gives 1 over 1, plus 1 over 5, plus 6 over 5. That is 1 plus 7 over 5, which is 12 over 5.'
        write: '$x = 3$: $1 + \tfrac{1}{5} + \tfrac{6}{5} = \tfrac{12}{5}$'
      - say: 'Our answer gives 4 times 3 over 9 minus 4, which is 12 over 5. They match.'
        write: '$\dfrac{4(3)}{9 - 4} = \dfrac{12}{5}\ \checkmark$'
      - say: 'So the sum is $4x$ over $x$ squared minus 4: option D.'
        write: '$\therefore \dfrac{4x}{x^{2} - 4}$ (D)'
        answer: true
    traps:
      A: 'You went for option A, with a huge denominator. You do not need to multiply all the denominators together, because x squared minus 4 already contains the other two. Use the L.C.M., and the tops add to 4x.'
      B: 'You went for 2x over x squared minus 4. That is only the last fraction, or only the first two. Add all three tops: x plus 2, x minus 2 and 2x make 4x.'
      C: 'You went for x over x squared minus 4. The tops are x plus 2, x minus 2 and 2x, and together they make 4x, not x.'
  27:
    moments:
      - section: 'The question'
        say: 'Make $v$ the subject. $v$ is wrapped in layers: a square root outside, then a subtraction, then a fraction. We remove them from the outside in.'
        doodle: {name: 'custom:1986_q27_a', id: layers, caption: 'v is wrapped in layers'}
        write: '$S = \sqrt{\dfrac{6}{v} - \dfrac{w}{2}}$'
      - section: 'Solution'
        say: 'One operation per line, doing the same thing to both sides each time.'
        write: 'Solution'
      - say: 'The outside layer is the square root. Square both sides to remove it.'
        doodle_do: [{id: layers, op: cross, part: root}]
        write: '$S^{2} = \dfrac{6}{v} - \dfrac{w}{2}$'
      - say: 'Add $w$ over 2 to both sides, so the term with $v$ is alone on the right.'
        doodle_do: [{id: layers, op: cross, part: minus}]
        write: '$S^{2} + \dfrac{w}{2} = \dfrac{6}{v}$'
      - say: 'Make the left side one fraction. The L.C.M. is 2, so $S$ squared becomes $2S$ squared over 2.'
        write: '$\dfrac{2S^{2} + w}{2} = \dfrac{6}{v}$'
      - say: 'Now cross multiply: $v$ times $2S$ squared plus $w$ equals 2 times 6.'
        doodle_do: [{id: layers, op: highlight, part: frac}]
        write: '$v(2S^{2} + w) = 12$'
      - say: 'Divide both sides by $2S$ squared plus $w$. $v$ is out of its wrapping.'
        doodle_do: [{id: layers, op: circle, part: core}]
        write: '$\therefore v = \dfrac{12}{2S^{2} + w}$'
      - section: 'Check'
        say: 'Check with $v$ equals 1 and $w$ equals 2. Then $S$ squared is 6 over 1 minus 2 over 2, which is 6 minus 1, that is 5.'
        write: '$v = 1,\ w = 2$: $S^{2} = 6 - 1 = 5$'
      - say: 'Our formula gives 12 over 2 times 5 plus 2, which is 12 over 12, that is 1. The $v$ we started with.'
        write: '$v = \dfrac{12}{2(5) + 2} = \dfrac{12}{12} = 1\ \checkmark$'
      - say: 'So $v$ equals 12 over $2S$ squared plus $w$: option D.'
        write: '$\therefore v = \dfrac{12}{2S^{2} + w}$ (D)'
        answer: true
    traps:
      A: 'You went for 6 over S squared minus 12 over w. You cannot take the reciprocal of each term of a sum separately. Make the left side one fraction first, then cross multiply.'
      B: 'You went for 12 over 2S squared minus w. The sign has slipped. Minus w over 2 crosses the equals sign as plus w over 2, so the bottom is 2S squared plus w.'
      C: 'You went for 12 over w, minus 2S squared. That takes the reciprocal of the terms one at a time, which is not allowed. Make one fraction, then cross multiply: v is 12 over 2S squared plus w.'
  28:
    moments:
      - say: 'We want the values of $x$ for which 16 to the $x$, minus 5 times 4 to the $x$, plus 4 equals 0.'
        write: '$16^{x} - 5(4^{x}) + 4 = 0$'
      - say: 'The law of indices: a power of a power means multiply the powers.'
        write: '$(a^{m})^{n} = a^{mn}$'
      - say: 'Notice that 16 is 4 squared. So 16 to the $x$ is 4 to the $x$, all squared. Picture 16 to the $x$ as a square with side 4 to the $x$.'
        doodle: {name: 'custom:1986_q28_a', id: sq, caption: '16 to the x as a square'}
        write: '$16^{x} = (4^{2})^{x} = (4^{x})^{2}$'
      - say: 'So this equation is really a quadratic in disguise. Let''s give 4 to the $x$ a simpler name, $u$. Each side of the square is now $u$.'
        doodle_do: [{id: sq, op: label, part: top, text: u}, {id: sq, op: label, part: left, text: u}]
        write: 'Let $u = 4^{x}$'
      - say: 'The square''s area is $u$ squared. Then 16 to the $x$ is $u$ squared, and the equation becomes $u$ squared minus $5u$ plus 4 equals 0.'
        doodle_do: [{id: sq, op: label, part: area, text: 'u²'}]
        write: '$u^{2} - 5u + 4 = 0$'
        point:
          - {line: 3, kind: arrow, text: 'swap in u'}
      - say: 'To factorise, we need two numbers that multiply to 4 and add to negative 5. Those are negative 1 and negative 4.'
        write: '$(-1) \times (-4) = 4,\quad -1 + (-4) = -5$'
      - say: 'So the quadratic factorises into $u$ minus 1, times $u$ minus 4.'
        write: '$(u - 1)(u - 4) = 0$'
      - say: 'Either $u$ minus 1 is zero, or $u$ minus 4 is zero. So $u$ is 1 or $u$ is 4.'
        write: '$u = 1 \ \text{ or } \ u = 4$'
      - say: 'But we want $x$, not $u$. So go back to $u$ equals 4 to the $x$. First, 4 to the $x$ equals 1. Any number to the power 0 is 1, so $x$ is 0.'
        write: '$4^{x} = 1 = 4^{0} \Rightarrow x = 0$'
        point:
          - {line: 3, kind: box, text: 'go back'}
      - say: 'Next, 4 to the $x$ equals 4. 4 is 4 to the power 1, so $x$ is 1.'
        write: '$4^{x} = 4 = 4^{1} \Rightarrow x = 1$'
      - say: 'Let''s check $x$ equals 1 in the original equation: 16, minus 5 times 4, plus 4. That is 16 minus 20 plus 4, which is 0.'
        write: 'Check $x = 1$: $\ 16 - 5(4) + 4 = 16 - 20 + 4 = 0$'
      - say: 'And $x$ equals 0: 16 to the 0 is 1 and 4 to the 0 is 1, so we get 1 minus 5 plus 4, which is 0. Both work.'
        write: 'Check $x = 0$: $\ 1 - 5(1) + 4 = 0$'
      - say: 'So $x$ is 0 and 1, which is answer choice C.'
        write: 'Solutions: $\ x = 0$ and $x = 1$'
        answer: true
    traps:
      A: 'You went for 1 and 4. Those are the values of $u$, which is 4 to the $x$, not the values of $x$. Go back: 4 to the $x$ equals 1 gives 0, and 4 to the $x$ equals 4 gives 1.'
      B: 'You went for negative 2 and 2. Try $x$ equals 2: 256 minus 80 plus 4 is 180, not 0. The quadratic in 4 to the $x$ gives $x$ equals 0 and 1.'
      D: 'You went for 0 and 4. The 0 is right, but the 4 is a value of 4 to the $x$. 4 to the $x$ equals 4 means $x$ is 1.'
  29:
    moments:
      - section: 'The question'
        say: 'Four letters, but the answer must be in $k$ alone. The trick is to replace $a$ and $c$, so that only $b$, $d$ and $k$ are left.'
        doodle: {name: 'custom:1986_q29_a', id: stretch, caption: 'a and c are k times b and d'}
        write: '$\dfrac{a}{b} = \dfrac{c}{d} = k$'
      - say: 'We want this fraction in terms of $k$.'
        write: '$\dfrac{3a^{2} - ac + c^{2}}{3b^{2} - bd + d^{2}}$'
      - section: 'Solution'
        say: 'Change each ratio into a product, then substitute into the numerator.'
        write: 'Solution'
      - say: '$a$ over $b$ equals $k$. Multiply both sides by $b$: $a$ equals $bk$. Picture $a$ as $b$ stretched $k$ times.'
        doodle_do: [{id: stretch, op: highlight, part: ab}]
        write: '$\dfrac{a}{b} = k \Rightarrow a = bk$'
      - say: 'In the same way, $c$ over $d$ equals $k$ gives $c$ equals $dk$.'
        doodle_do: [{id: stretch, op: highlight, part: cd}]
        write: '$\dfrac{c}{d} = k \Rightarrow c = dk$'
      - say: 'Substitute into the numerator: every $a$ becomes $bk$, and every $c$ becomes $dk$, each in brackets.'
        write: 'Num. $= 3(bk)^{2} - (bk)(dk) + (dk)^{2}$'
      - say: '$bk$ squared is $b$ squared $k$ squared. $bk$ times $dk$ is $bd k$ squared. $dk$ squared is $d$ squared $k$ squared.'
        write: '$= 3b^{2}k^{2} - bdk^{2} + d^{2}k^{2}$'
      - say: 'Every term has $k$ squared. Take it out as a common factor.'
        write: '$= k^{2}(3b^{2} - bd + d^{2})$'
        point:
          - {line: 7, kind: underline, at: '(3b2−bd+d2)', text: 'the denominator!'}
      - say: 'That bracket is exactly the denominator. So put the numerator over the denominator.'
        doodle_do: [{id: stretch, op: stage, stage: 'custom:1986_q29_a2'}]
        write: '$\dfrac{k^{2}(3b^{2} - bd + d^{2})}{3b^{2} - bd + d^{2}}$'
      - say: 'Cancel the common factor, $3b$ squared minus $bd$ plus $d$ squared. Only $k$ squared is left.'
        doodle_do: [{id: stretch, op: circle, part: kk}]
        write: '$= k^{2}$'
      - section: 'Check'
        say: 'Check with $b$ and $d$ equal to 1 and $k$ equal to 2, so $a$ and $c$ are both 2.'
        write: '$b = d = 1,\ k = 2$: $a = c = 2$'
      - say: 'The top is 12 minus 4 plus 4, which is 12. The bottom is 3 minus 1 plus 1, which is 3. 12 over 3 is 4, and 2 squared is 4.'
        write: '$\dfrac{3(4) - 4 + 4}{3 - 1 + 1} = \dfrac{12}{3} = 4 = 2^{2}\ \checkmark$'
      - say: 'So the value is $k$ squared: option D.'
        write: '$\therefore k^{2}$ (D)'
        answer: true
    traps:
      A: 'You went for 3k squared. That keeps the 3 from the first term. But every term on top carries k squared, so k squared comes out as a factor and the rest cancels with the bottom.'
      B: 'You went for 3k minus k squared. Substitute a equals bk and c equals dk: every term on top gets k squared, and what is left is exactly the bottom. So the answer is k squared.'
      C: 'You went for 17 over 4, k squared. There is no 17 or 4 in the working. The top is k squared times the bottom, so the fraction is just k squared.'
  30:
    moments:
      - section: 'The question'
        say: 'A straight line cuts a curve at two points. A point on both graphs has the same $y$ on both, and that gives us a quadratic.'
        write: '$y = 2x + 1,\ \ y = 2x^{2} + 5x - 1$'
      - say: 'Here is a sketch of the line and the curve. They cross twice.'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: 'y = 2x + 1', text: 'the line'}
          - {figure: sketch, kind: underline, target: 'y = 2x² + 5x − 1', text: 'the curve'}
      - section: 'Solution'
        say: 'At the points of intersection the $y$ values are equal, so we equate the two right-hand sides.'
        write: 'Solution'
      - say: '$2x$ squared plus $5x$ minus 1 equals $2x$ plus 1.'
        write: '$2x^{2} + 5x - 1 = 2x + 1$'
      - say: 'Subtract $2x$ and 1 from both sides, so the right-hand side is zero.'
        write: '$2x^{2} + 5x - 2x - 1 - 1 = 0$'
      - say: 'Collect like terms. $5x$ minus $2x$ is $3x$, and negative 1 minus 1 is negative 2.'
        write: '$2x^{2} + 3x - 2 = 0$'
      - section: 'Factorise'
        say: 'Here $a$ is 2, $b$ is 3 and $c$ is negative 2. The product is 2 times negative 2, negative 4. The sum is 3.'
        write: 'Product $= -4$, Sum $= 3$'
      - say: 'Plus 4 and negative 1: they multiply to negative 4 and add to 3.'
        write: 'Factors: $+4$ and $-1$'
      - say: 'Replace $3x$ with $4x$ minus $x$.'
        write: '$2x^{2} + 4x - x - 2 = 0$'
      - say: 'Take out $2x$ from the first pair and negative 1 from the second. Both brackets are $x$ plus 2.'
        write: '$2x(x + 2) - 1(x + 2) = 0$'
      - say: 'Take out the common bracket.'
        write: '$(2x - 1)(x + 2) = 0$'
      - say: 'Either $2x$ minus 1 is zero or $x$ plus 2 is zero.'
        write: 'Either $2x - 1 = 0$ or $x + 2 = 0$'
      - say: 'Therefore $x$ is a half or negative 2.'
        write: '$\therefore x = \tfrac{1}{2}$ or $x = -2$'
      - section: 'Find y'
        say: 'Find each $y$ from the line, the simpler equation. When $x$ is a half, $y$ is 2 times a half plus 1, which is 2.'
        write: 'When $x = \tfrac{1}{2}$: $y = 2(\tfrac{1}{2}) + 1 = 2$'
        point:
          - {figure: sketch, kind: arrow, target: '(½, 2)', text: 'x = ½, y = 2'}
      - say: 'When $x$ is negative 2, $y$ is 2 times negative 2 plus 1, which is negative 4 plus 1, negative 3.'
        write: 'When $x = -2$: $y = 2(-2) + 1 = -3$'
      - say: 'Therefore the points are negative 2, negative 3 and a half, 2.'
        write: '$\therefore (-2, -3)$ and $(\tfrac{1}{2}, 2)$'
      - section: 'Check'
        say: 'Check that negative 2, negative 3 is on the curve too. 2 times 4 is 8, 5 times negative 2 is negative 10, then minus 1. 8 minus 10 minus 1 is negative 3.'
        write: '$2(-2)^{2} + 5(-2) - 1 = -3\ \checkmark$'
        point:
          - {figure: sketch, kind: arrow, target: '(−2, −3)', text: 'on the curve too'}
      - say: 'And a half, 2. 2 times a quarter is a half, 5 times a half is 5 over 2, minus 1. A half plus 5 over 2 is 3, and 3 minus 1 is 2.'
        write: '$2(\tfrac{1}{2})^{2} + 5(\tfrac{1}{2}) - 1 = 2\ \checkmark$'
      - say: 'So the points are option A.'
        write: '$\therefore (-2, -3)$ and $(\tfrac{1}{2}, 2)$ (A)'
        answer: true
        point:
          - {figure: sketch, kind: circle, target: '(−2, −3)'}
          - {figure: sketch, kind: circle, target: '(½, 2)'}
    traps:
      B: 'You went for negative a half, 0 and 2, 5. Both are on the line, but not on the curve: at x equals 2 the curve gives 17. Solving 2x squared plus 3x minus 2 equals 0 gives x equals a half and negative 2.'
      C: 'You went for a half, 2 and 1, 3. The first is right, but 1, 3 is only on the line. At x equals 1 the curve gives 2 plus 5 minus 1, which is 6. The second point is negative 2, negative 3.'
      D: 'You went for 1, 3 and 2, 5. Both are on the line, but neither is on the curve. A meeting point must be on both, and solving gives x equals a half and negative 2.'
