      - say: '4 times 7 is 28.'
        write: '$\log_{2}\dfrac{28}{n} = 1$'
      - say: 'Now undo the log. What does log base 2 of something equals 1 mean? It means 2 to the power 1 gives that something.'
        write: 'If $\log_{2}X = 1$, then $X = 2^{1}$'
      - say: 'So 28 over $n$ equals 2 to the power 1, which is 2.'
        write: '$\dfrac{28}{n} = 2^{1} = 2$'
        point:
          - {line: 4, kind: box, text: 'the rule'}
