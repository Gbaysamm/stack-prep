# UTME 1986 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1986.yaml. Answers match that file.
format_version: 1
exam_year: 1986
lessons:
  1:
    moments:
      - say: 'We need to work out 212 base 3, minus 121 base 3, plus 222 base 3, and give the answer in base 3.'
        write: '$212_{3} - 121_{3} + 222_{3}$'
      - say: 'The safest plan is this: change each number to base ten, do the sum there, and then change the answer back to base 3.'
      - say: 'In base 3, the place values from the right are 1, then 3, then 3 times 3, which is 9.'
        write: '$\text{place values: } 9,\ 3,\ 1$'
      - say: 'So 212 base 3 is 2 nines, plus 1 three, plus 2 ones.'
        write: '$212_{3} = 2(9) + 1(3) + 2(1)$'
      - say: '2 times 9 is 18. 18 plus 3 is 21, and 21 plus 2 is 23.'
        write: '$= 18 + 3 + 2 = 23$'
      - say: 'Next, 121 base 3 is 1 nine, plus 2 threes, plus 1 one. That''s 9 plus 6 plus 1, which is 16.'
        write: '$121_{3} = 9 + 6 + 1 = 16$'
      - say: 'And 222 base 3 is 2 nines, plus 2 threes, plus 2 ones. That''s 18 plus 6 plus 2, which is 26.'
        write: '$222_{3} = 18 + 6 + 2 = 26$'
      - say: 'Now the sum in base ten: 23 minus 16 plus 26.'
        write: '$23 - 16 + 26$'
      - say: '23 minus 16 is 7, and 7 plus 26 is 33.'
        write: '$= 7 + 26 = 33$'
      - say: 'Now we change 33 back to base 3. We keep dividing by 3 and write down the remainders. 33 divided by 3 is 11, remainder 0.'
        write: '$33 \div 3 = 11 \text{ r } 0$'
      - say: '11 divided by 3 is 3, remainder 2.'
        write: '$11 \div 3 = 3 \text{ r } 2$'
      - say: '3 divided by 3 is 1, remainder 0.'
        write: '$3 \div 3 = 1 \text{ r } 0$'
      - say: 'And 1 divided by 3 is 0, remainder 1. We stop when we reach 0.'
        write: '$1 \div 3 = 0 \text{ r } 1$'
      - say: 'Read the remainders from the bottom up: 1, 0, 2, 0. So the answer is 1020 base 3, which is answer choice C.'
        write: '$33 = 1020_{3}$'
        answer: true
    traps:
      A: 'You went for 313 base 3. That can''t be a base 3 number at all, because base 3 only uses the digits 0, 1 and 2. Any option with a 3 in it is out.'
      B: 'You went for 1000 base 3. That is 27 in base ten, but the sum is 23 minus 16 plus 26, which is 33. Check each conversion with place values 9, 3 and 1.'
      D: 'You went for 1222 base 3. That is 27 plus 18 plus 6 plus 2, which is 53, not 33. Convert 33 by dividing by 3 and reading the remainders from the bottom up.'
  2:
    moments:
      - say: 'Musa scored 57 in Biology. If he had scored 75 instead, his average over four subjects would have been 60. We want his real total.'
        write: '$\text{average} = 60,\ \text{4 subjects}$'
      - say: 'First, what total gives an average of 60 over four subjects? Average is total divided by number, so total is average times number. 4 times 60 is 240.'
        write: '$4 \times 60 = 240$'
      - say: 'But careful. 240 is the total he WOULD have had, with 75 in Biology. It is not what he really got.'
      - say: 'His real Biology mark was 57. So how many marks is the imagined total too big by? 75 minus 57 is 18.'
        write: '$75 - 57 = 18$'
      - say: 'So we take those 18 marks away from 240.'
        write: '$\text{real total} = 240 - 18$'
      - say: '240 minus 18 is 222.'
        write: '$= 222$'
      - say: 'Let''s check. 222 plus the extra 18 marks is 240, and 240 divided by 4 is 60. That matches.'
        write: '$222 + 18 = 240,\ \ 240 \div 4 = 60$'
      - say: 'So his total mark was 222, which is answer choice C.'
        write: '$\text{total} = 222$'
        answer: true
    traps:
      A: 'You went for 282. That adds marks instead of taking them away. The 75 was imagined; his real mark was 18 lower, so the real total is 240 minus 18, which is 222.'
      B: 'You went for 240. That''s the total he would have had with 75 in Biology. The question wants what he really scored, which is 18 marks less: 222.'
      D: 'You went for 210. The gap between 75 and 57 is 18, not 30. Take 18 from 240 and you get 222.'
  3:
    moments:
      - say: 'We want the L.C.M. of 48, 64 and 80, divided by their H.C.F. Both come from the prime factors, so let''s break each number down.'
        write: '$\text{L.C.M.} \div \text{H.C.F. of } 48,\ 64,\ 80$'
      - say: '48 is 16 times 3, and 16 is 2 to the power 4. So 48 is 2 to the 4, times 3.'
        write: '$48 = 2^{4} \times 3$'
      - say: '64 is 2 times itself six times. So 64 is 2 to the power 6.'
        write: '$64 = 2^{6}$'
      - say: '80 is 16 times 5. So 80 is 2 to the 4, times 5.'
        write: '$80 = 2^{4} \times 5$'
      - say: 'For the H.C.F., we take only the primes that are in all three, to the lowest power. Only 2 is in all three, and the lowest power is 4.'
        write: '$\text{H.C.F.} = 2^{4}$'
      - say: '2 to the power 4 is 16.'
        write: '$\text{H.C.F.} = 16$'
      - say: 'For the L.C.M., we take every prime that appears anywhere, to the highest power. That''s 2 to the 6, times 3, times 5.'
        write: '$\text{L.C.M.} = 2^{6} \times 3 \times 5$'
      - say: '2 to the 6 is 64, and 3 times 5 is 15. So the L.C.M. is 64 times 15.'
        write: '$= 64 \times 15$'
      - say: '64 times 10 is 640, and 64 times 5 is 320. 640 plus 320 is 960.'
        write: '$\text{L.C.M.} = 960$'
      - say: 'Now divide the L.C.M. by the H.C.F.: 960 divided by 16.'
        write: '$\dfrac{960}{16}$'
      - say: '16 times 60 is 960, so 960 divided by 16 is 60. That''s answer choice D.'
        write: '$= 60$'
        answer: true
    traps:
      A: 'You went for 20. The L.C.M. is 960 and the H.C.F. is 16, so the answer is 960 divided by 16, which is 60. Recheck the L.C.M.: it needs 2 to the 6, not 2 to the 4.'
      B: 'You went for 30. That''s half the answer. The L.C.M. must use the highest power of 2, which is 2 to the 6, giving 960, and 960 divided by 16 is 60.'
      C: 'You went for 48. That''s one of the numbers, not the result. Find the L.C.M., 960, and the H.C.F., 16, then divide to get 60.'
  4:
    moments:
      - say: 'We want the smallest number we can multiply 252 by to make a perfect square.'
        write: '$252 \times\ ? = \text{perfect square}$'
      - say: 'Here''s the key idea. In a perfect square, every prime factor appears an even number of times. So let''s break 252 into primes.'
      - say: '252 is 4 times 63.'
        write: '$252 = 4 \times 63$'
      - say: '4 is 2 squared. 63 is 9 times 7, and 9 is 3 squared.'
        write: '$= 2^{2} \times 3^{2} \times 7$'
      - say: 'The 2 is squared, and the 3 is squared. Those are fine. But the 7 appears only once, which is an odd power.'
        write: '$7 \text{ is unpaired}$'
      - say: 'So we give the 7 a partner. Multiply by one more 7, and it becomes 7 squared.'
        write: '$252 \times 7 = 2^{2} \times 3^{2} \times 7^{2}$'
      - say: 'Let''s check. 252 times 7 is 1764, and 42 times 42 is 1764. So it is a perfect square.'
        write: '$252 \times 7 = 1764 = 42^{2}$'
      - say: 'So the smallest number is 7, which is answer choice D.'
        write: '$7$'
        answer: true
    traps:
      A: 'You went for 2. But 252 already has 2 squared in it. Multiplying by 2 makes it 2 cubed, which is odd again. The unpaired prime is 7.'
      B: 'You went for 3. 252 already has 3 squared in it, so a third 3 would spoil the square. The prime that needs a partner is 7.'
      C: 'You went for 5. 5 isn''t a factor of 252 at all, so multiplying by 5 would add a new unpaired prime. The one to pair up is 7.'
  5:
    moments:
      - say: 'We have two thirds, divided by a half plus a third, and we want the reciprocal of all of that.'
        write: '$\dfrac{\tfrac{2}{3}}{\tfrac{1}{2} + \tfrac{1}{3}}$'
      - say: 'Remember, the reciprocal of a fraction is that fraction turned upside down. So first we make the whole thing one simple fraction.'
      - say: 'Start with the bottom: a half plus a third. The common denominator is 6.'
        write: '$\tfrac{1}{2} + \tfrac{1}{3} = \tfrac{3}{6} + \tfrac{2}{6}$'
      - say: '3 sixths plus 2 sixths is 5 sixths.'
        write: '$= \tfrac{5}{6}$'
      - say: 'So the expression is two thirds divided by five sixths.'
        write: '$\tfrac{2}{3} \div \tfrac{5}{6}$'
      - say: 'Dividing by a fraction means multiplying by it upside down. So it becomes two thirds times six fifths.'
        write: '$= \tfrac{2}{3} \times \tfrac{6}{5}$'
      - say: '2 times 6 is 12, and 3 times 5 is 15. That''s 12 over 15.'
        write: '$= \tfrac{12}{15}$'
      - say: 'Divide top and bottom by 3. 12 divided by 3 is 4, and 15 divided by 3 is 5. So the expression is four fifths.'
        write: '$= \tfrac{4}{5}$'
      - say: 'But the question wants the reciprocal. Turn four fifths upside down, and you get five quarters.'
        write: '$\text{reciprocal} = \tfrac{5}{4}$'
      - say: 'Check: four fifths times five quarters is 1, as it should be. So the answer is five quarters, which is answer choice B.'
        write: '$\tfrac{4}{5} \times \tfrac{5}{4} = 1$'
        answer: true
    traps:
      A: 'You went for four fifths. That''s the value of the expression, and it''s correct as far as it goes. But the question asks for its reciprocal, so turn it over: five quarters.'
      C: 'You went for two fifths. Check the bottom first: a half plus a third is five sixths. Then two thirds divided by five sixths is four fifths, and its reciprocal is five quarters.'
      D: 'You went for six sevenths. The bottom is a half plus a third, which is five sixths, not seven sixths. Then the value is four fifths, and its reciprocal is five quarters.'
  6:
    moments:
      - say: 'Three boys share some oranges. The first gets one third. The second gets two thirds of what''s left. The third gets the last 12. How many were there?'
        write: '$\text{1st: } \tfrac{1}{3},\ \ \text{2nd: } \tfrac{2}{3} \text{ of remainder},\ \ \text{3rd: } 12$'
      - say: 'The key word is remainder. The second boy''s share is a fraction of what''s left, not of the whole. So let''s track fractions of the whole.'
      - say: 'After the first boy takes one third, what''s left is 1 minus a third, which is two thirds.'
        write: '$\text{remainder} = 1 - \tfrac{1}{3} = \tfrac{2}{3}$'
      - say: 'The second boy takes two thirds of that two thirds. Of means times.'
        write: '$\text{2nd} = \tfrac{2}{3} \times \tfrac{2}{3}$'
      - say: '2 times 2 is 4, and 3 times 3 is 9. So the second boy gets four ninths of the whole.'
        write: '$= \tfrac{4}{9}$'
      - say: 'The third boy gets whatever is left: 1, minus one third, minus four ninths.'
        write: '$\text{3rd} = 1 - \tfrac{1}{3} - \tfrac{4}{9}$'
      - say: 'Put it all in ninths. 1 is 9 ninths, and one third is 3 ninths.'
        write: '$= \tfrac{9}{9} - \tfrac{3}{9} - \tfrac{4}{9}$'
      - say: '9 minus 3 is 6, and 6 minus 4 is 2. So the third boy gets two ninths.'
        write: '$= \tfrac{2}{9}$'
      - say: 'We know the third boy got 12 oranges. So two ninths of the total is 12.'
        write: '$\tfrac{2}{9} \text{ of total} = 12$'
      - say: 'If two ninths is 12, then one ninth is half of 12, which is 6.'
        write: '$\tfrac{1}{9} \text{ of total} = 6$'
      - say: 'The whole is nine ninths, so 9 times 6, which is 54.'
        write: '$\text{total} = 9 \times 6 = 54$'
      - say: 'Let''s check. A third of 54 is 18, leaving 36. Two thirds of 36 is 24, leaving 12. And 18 plus 24 plus 12 is 54.'
        write: '$18 + 24 + 12 = 54$'
      - say: 'So they shared 54 oranges, which is answer choice B.'
        write: '$54$'
        answer: true
    traps:
      A: 'You went for 60. Test it: a third of 60 is 20, leaving 40, and two thirds of 40 is not a whole number. The third boy gets two ninths of the total, so the total is 54.'
      C: 'You went for 48. A third of 48 is 16, leaving 32, and two thirds of 32 isn''t whole. Work out the third boy''s fraction, two ninths, and set it equal to 12.'
      D: 'You went for 42. Test it: a third of 42 is 14, leaving 28, and two thirds of 28 isn''t whole. Two ninths of the total is 12, so the total is 54.'
  7:
    moments:
      - say: 'We''re told P is 18, Q is 21, R is negative 6 and S is negative 4. We want P minus Q plus 2S, all over R cubed.'
        write: '$\dfrac{P - Q + 2S}{R^{3}}$'
      - say: 'Two of the values are negative, so the danger is in the signs. Let''s put every value in brackets.'
        write: '$\dfrac{18 - 21 + 2(-4)}{(-6)^{3}}$'
      - say: 'Start with the top. 18 minus 21 is negative 3.'
        write: '$18 - 21 = -3$'
      - say: '2 times negative 4 is negative 8.'
        write: '$2(-4) = -8$'
      - say: 'So the top is negative 3 minus 8, which is negative 11.'
        write: '$-3 - 8 = -11$'
      - say: 'Now the bottom. Negative 6 cubed means negative 6, times negative 6, times negative 6.'
        write: '$(-6)^{3} = (-6)(-6)(-6)$'
      - say: 'Negative 6 times negative 6 is positive 36, because two negatives make a positive.'
        write: '$= 36 \times (-6)$'
      - say: '36 times 6 is 216, and a positive times a negative is negative. So the bottom is negative 216.'
        write: '$= -216$'
      - say: 'So we have negative 11 over negative 216.'
        write: '$\dfrac{-11}{-216}$'
      - say: 'A negative divided by a negative is positive. So the answer is 11 over 216, which is answer choice B.'
        write: '$= \dfrac{11}{216}$'
        answer: true
    traps:
      A: 'You went for negative 11 over 216. The top is negative 11, but the bottom is negative too: negative 6 cubed is negative 216. A negative over a negative is positive.'
      C: 'You went for negative 43 over 115. That doesn''t come from these numbers. The top is 18 minus 21 plus 2 times negative 4, which is negative 11, and the bottom is negative 216.'
      D: 'You went for 41 over 116. The bottom must be R cubed, which is negative 216, and the top is negative 11. That gives 11 over 216.'
  8:
    moments:
      - say: 'We need to simplify 0.03 times 4 times 0.00064, all over 0.48 times 0.012.'
        write: '$\dfrac{0.03 \times 4 \times 0.00064}{0.48 \times 0.012}$'
      - say: 'Small decimals are easier in standard form. Then we can deal with the digits and the powers of ten separately.'
      - say: '0.03 is 3 times 10 to the minus 2. 0.00064 is 6.4 times 10 to the minus 4. So the top is this.'
        write: '$3 \times 10^{-2} \times 4 \times 6.4 \times 10^{-4}$'
      - say: 'The digits: 3 times 4 is 12, and 12 times 6.4 is 76.8.'
        write: '$3 \times 4 \times 6.4 = 76.8$'
      - say: 'The powers: 10 to the minus 2 times 10 to the minus 4. We add the powers, minus 2 plus minus 4 is minus 6.'
        write: '$10^{-2} \times 10^{-4} = 10^{-6}$'
      - say: 'So the top is 76.8 times 10 to the minus 6, which in standard form is 7.68 times 10 to the minus 5.'
        write: '$\text{top} = 7.68 \times 10^{-5}$'
      - say: 'Now the bottom. 0.48 is 4.8 times 10 to the minus 1, and 0.012 is 1.2 times 10 to the minus 2.'
        write: '$4.8 \times 10^{-1} \times 1.2 \times 10^{-2}$'
      - say: 'The digits: 4.8 times 1.2 is 5.76. The powers: minus 1 plus minus 2 is minus 3.'
        write: '$\text{bottom} = 5.76 \times 10^{-3}$'
      - say: 'Now divide top by bottom. Digits divide by digits, and powers of ten divide by powers of ten.'
        write: '$\dfrac{7.68}{5.76} \times \dfrac{10^{-5}}{10^{-3}}$'
      - say: '7.68 divided by 5.76 is 1.333 and so on.'
        write: '$\dfrac{7.68}{5.76} = 1.333\ldots$'
      - say: 'For the powers we subtract: minus 5 minus minus 3 is minus 2.'
        write: '$\dfrac{10^{-5}}{10^{-3}} = 10^{-2}$'
      - say: 'So the value is 1.333 times 10 to the minus 2. To two significant figures, that''s 1.3 times 10 to the minus 2, which is answer choice A.'
        write: '$1.3 \times 10^{-2}$'
        answer: true
    traps:
      B: 'You went for 1.3 times 10 to the minus 3. The digits are right, but the power is off by one. 10 to the minus 5 divided by 10 to the minus 3 is 10 to the minus 2.'
      C: 'You went for 7.5 times 10 to the 1, which is 75. That''s the fraction turned upside down. Keep the top on top: the answer is about 0.0133.'
      D: 'You went for 7.5 times 10 to the minus 1. That''s the upside-down digits. The top divided by the bottom gives 1.33, not 7.5, so it''s 1.3 times 10 to the minus 2.'
  9:
    moments:
      - say: 'Udoh put ₦150 in the bank. After 5 years the simple interest was ₦55. We want the rate per year.'
        write: '$P = 150,\ \ T = 5,\ \ I = 55$'
      - say: 'Simple interest uses one formula: interest equals principal times rate times time, over 100.'
        write: '$I = \dfrac{PRT}{100}$'
      - say: 'We want R, so let''s make R the subject. Multiply both sides by 100, then divide by P times T.'
        write: '$R = \dfrac{100I}{PT}$'
      - say: 'Now put in the numbers: 100 times 55, over 150 times 5.'
        write: '$R = \dfrac{100 \times 55}{150 \times 5}$'
      - say: '100 times 55 is 5500. 150 times 5 is 750.'
        write: '$R = \dfrac{5500}{750}$'
      - say: 'Let''s simplify. Divide top and bottom by 250. 5500 divided by 250 is 22, and 750 divided by 250 is 3.'
        write: '$R = \dfrac{22}{3}$'
      - say: '22 divided by 3 is 7, remainder 1. So that''s 7 and one third.'
        write: '$R = 7\tfrac{1}{3}$'
      - say: 'Let''s check. 7 and a third percent of ₦150 is 22 over 300 times 150, which is ₦11 a year. Over 5 years that''s 5 times 11, which is ₦55.'
        write: '$5 \times 11 = 55$'
      - say: 'So the rate is 7 and one third percent per annum, which is answer choice B.'
        write: '$7\tfrac{1}{3}\%$'
        answer: true
    traps:
      A: 'You went for 11%. That''s the yearly interest in naira, ₦11, not the rate. ₦11 out of ₦150 is 7 and a third percent.'
      C: 'You went for 5%. That''s the number of years, not the rate. Put the numbers into R equals 100 I over P T to get 7 and a third percent.'
      D: 'You went for 3 and a half percent. Check the formula: R is 100 times 55, over 150 times 5, which is 22 over 3, or 7 and a third percent.'
  10:
    moments:
      - say: 'Pencils are shared among Bisi, Sola and Tunde in the ratio 2 to 3 to 5. Bisi got 5. How many pencils were shared?'
        write: '$2 : 3 : 5,\ \ \text{Bisi} = 5$'
      - say: 'With ratios, the key is the size of one part. Once we know that, everything else follows.'
      - say: 'Bisi has 2 parts, and those 2 parts are 5 pencils.'
        write: '$2 \text{ parts} = 5$'
      - say: 'So one part is 5 divided by 2, which is 2.5.'
        write: '$1 \text{ part} = 5 \div 2 = 2.5$'
      - say: 'Now count the parts in the whole ratio. 2 plus 3 plus 5 is 10 parts.'
        write: '$2 + 3 + 5 = 10 \text{ parts}$'
      - say: 'So the total is 10 parts, each worth 2.5.'
        write: '$\text{total} = 10 \times 2.5$'
      - say: '10 times 2.5 is 25.'
        write: '$= 25$'
      - say: 'Check: Sola gets 3 times 2.5, which is 7.5, and Tunde gets 5 times 2.5, which is 12.5. 5 plus 7.5 plus 12.5 is 25.'
        write: '$5 + 7.5 + 12.5 = 25$'
      - say: 'So 25 pencils were shared out, which is answer choice B.'
        write: '$25$'
        answer: true
    traps:
      A: 'You went for 15. Bisi''s 5 pencils are 2 parts, so one part is 2.5, and the 10 parts make 25.'
      C: 'You went for 30. Find one part first: Bisi''s 2 parts are 5 pencils, so one part is 2.5. Then 10 parts are 25.'
      D: 'You went for 50. That treats Bisi''s 5 as one part. But Bisi has 2 parts, so one part is 2.5, and the total is 25.'
  11:
    moments:
      - say: 'Tosan''s and Isa''s ages differ by 6, and their product is 187. Let''s call the older age $x$ and the younger $y$.'
        write: '$x - y = 6,\ \ xy = 187$'
      - say: 'Two facts, two equations. From the first, we can get $x$ by itself: add $y$ to both sides.'
        write: '$x = y + 6$'
      - say: 'Now put $y$ plus 6 in place of $x$ in the second equation.'
        write: '$y(y + 6) = 187$'
      - say: 'Multiply out the bracket. $y$ times $y$ is $y$ squared, and $y$ times 6 is $6y$.'
        write: '$y^{2} + 6y = 187$'
      - say: 'Take 187 from both sides so the quadratic equals zero.'
        write: '$y^{2} + 6y - 187 = 0$'
      - say: 'Now factorise. We need two numbers that multiply to negative 187 and add to 6. 187 is 11 times 17, so the numbers are 17 and negative 11.'
        write: '$17 \times (-11) = -187,\ \ 17 + (-11) = 6$'
      - say: 'So the quadratic factorises like this.'
        write: '$(y + 17)(y - 11) = 0$'
      - say: 'So $y$ is negative 17 or $y$ is 11.'
        write: '$y = -17 \text{ or } y = 11$'
      - say: 'An age can''t be negative, so $y$ is 11.'
        write: '$y = 11$'
      - say: 'Then $x$ is $y$ plus 6, which is 11 plus 6, which is 17.'
        write: '$x = 11 + 6 = 17$'
      - say: 'Let''s check. 17 minus 11 is 6, and 17 times 11 is 187. Both facts hold.'
        write: '$17 - 11 = 6,\ \ 17 \times 11 = 187$'
      - say: 'So the ages are 17 and 11, which is answer choice C.'
        write: '$(17,\ 11)$'
        answer: true
    traps:
      A: 'You went for 12 and 9. Those differ by only 3, and their product is 108, not 187. The ages must be 17 and 11.'
      B: 'You went for 23 and 17. They do differ by 6, but 23 times 17 is 391, not 187. Test every option against both facts.'
      D: 'You went for 18 and 12. They differ by 6, but 18 times 12 is 216, not 187. Both facts have to hold, and only 17 and 11 do it.'
  12:
    moments:
      - say: 'In 1984, Ike was 24 and his father was 45. In what year was Ike exactly half his father''s age?'
        write: '$\text{In 1984: Ike } 24,\ \text{father } 45$'
      - say: 'Here''s the key fact for age problems: the difference between two people''s ages never changes. Both get older at the same rate.'
      - say: 'So how much older is the father? 45 minus 24 is 21 years. That gap is always 21.'
        write: '$45 - 24 = 21$'
      - say: 'Ike is half his father''s age when the father is twice Ike''s age. Let Ike''s age then be $I$, so the father''s age is $2I$.'
        write: '$\text{father} = 2I$'
      - say: 'The gap between them is still 21. So $2I$ minus $I$ is 21.'
        write: '$2I - I = 21$'
      - say: '$2I$ minus $I$ is just $I$. So Ike was 21.'
        write: '$I = 21$'
      - say: 'Ike was 24 in 1984. He was 21 how many years earlier? 24 minus 21 is 3 years.'
        write: '$24 - 21 = 3$'
      - say: 'So it was 3 years before 1984. 1984 minus 3 is 1981.'
        write: '$1984 - 3 = 1981$'
      - say: 'Let''s check. In 1981, Ike was 21 and his father was 45 minus 3, which is 42. And 21 is half of 42.'
        write: '$21 = \tfrac{1}{2} \times 42$'
      - say: 'So the year was 1981, which is answer choice B.'
        write: '$1981$'
        answer: true
    traps:
      A: 'You went for 1982. In 1982 Ike was 22 and his father was 43, and 22 isn''t half of 43. Ike is half his father''s age when he is 21, the size of the gap.'
      C: 'You went for 1979. In 1979 Ike was 19 and his father was 40. Half of 40 is 20, not 19. The right year is 1981, when they were 21 and 42.'
      D: 'You went for 1978. In 1978 Ike was 18 and his father was 39, so Ike was less than half his age. Go back only 3 years, to 1981.'
  13:
    moments:
      - say: 'We have 1 over root 5 plus root 3, minus 1 over root 5 minus root 3, and all of that times 1 over root 3.'
        write: '$\left(\dfrac{1}{\sqrt{5} + \sqrt{3}} - \dfrac{1}{\sqrt{5} - \sqrt{3}}\right) \times \dfrac{1}{\sqrt{3}}$'
      - say: 'Let''s deal with the bracket first. The two denominators are conjugates, the same surds with opposite signs. Their product will have no surd in it.'
