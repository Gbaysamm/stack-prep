  47:
    moments:
      - say: 'A number is picked at random from 40 to 50. What''s the probability that it''s a prime?'
        doodle: {name: 'custom:1986_q47_a', caption: 'One number from 40 to 50'}
        write: '$40,\ 41,\ \ldots,\ 50$'
      - say: 'Probability is the number of favourable outcomes over the number of possible outcomes. So we count carefully.'
        write: '$P = \dfrac{\text{favourable}}{\text{possible}}$'
      - say: 'First, the possible outcomes. How many numbers are there from 40 to 50? Both ends count, so it is 50 minus 40, plus 1, which is 11.'
        write: 'Possible $= 50 - 40 + 1 = 11$'
      - say: 'Now the favourable ones, the primes. A prime has exactly two factors, 1 and itself. The even numbers 40, 42, 44, 46, 48 and 50 all divide by 2, so they are out.'
        write: 'Even, not prime: $\ 40,\ 42,\ 44,\ 46,\ 48,\ 50$'
      - say: 'That leaves the odd numbers: 41, 43, 45, 47 and 49.'
        write: 'Odd: $\ 41,\ 43,\ 45,\ 47,\ 49$'
      - say: '45 is 5 times 9, so it is not prime.'
        write: '$45 = 5 \times 9$'
      - say: '49 is 7 times 7, so it is not prime either. It looks prime, but it is 7 squared.'
        write: '$49 = 7 \times 7$'
      - say: '41, 43 and 47 have no factors except 1 and themselves, so they are prime. That is 3 favourable numbers.'
        write: 'Primes: $\ 41,\ 43,\ 47$, so favourable $= 3$'
        point:
          - {line: 4, kind: strike, at: '45', text: 'not prime'}
          - {line: 4, kind: strike, at: '49'}
      - say: 'Now put the two counts into the formula: 3 favourable over 11 possible.'
        write: '$P = \dfrac{3}{11}$'
