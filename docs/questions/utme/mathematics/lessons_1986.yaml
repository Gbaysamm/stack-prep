      - say: 'A pie chart shares the full 360 degrees among the groups. Each angle is the group''s fraction of the total, times 360.'
        write: '$\text{angle} = \dfrac{\text{group}}{\text{total}} \times 360^{\circ}$'
      - say: 'First, check the total. 185 plus 135 is 320. Plus 90 is 410. Plus 110 is 520. Plus 155 is 675. Plus 225 is 900.'
        write: '$185 + 135 + 90 + 110 + 155 + 225 = 900$'
