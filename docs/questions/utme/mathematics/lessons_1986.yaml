        write: '$\text{black } 6,\ \ \text{brown } 5,\ \ \text{purple } 7$'
      - say: 'Why does it matter that his eyes are closed? Because then he can''t choose a colour, so every shirt is equally likely to be picked.'
      - say: 'When every item is equally likely, the probability is the number of favourable items over the total number of items. Here, purple shirts over all the shirts.'
        write: '$P(\text{purple}) = \dfrac{\text{number of purple shirts}}{\text{total number of shirts}}$'
      - say: 'Count all three piles. The total is 6 plus 5 plus 7. 6 plus 5 is 11, and 11 plus 7 is 18.'
        doodle_do: [{id: drawer, op: label, part: drawer, text: '18 shirts'}]
