  47:
    moments:
      - say: 'A number is picked at random from 40 to 50. What''s the probability that it''s a prime? Picture eleven cards and one being picked.'
        doodle: {name: 'custom:1986_q47_a', id: cards, caption: 'One number from 40 to 50', size: scene}
        write: '$40,\ 41,\ \ldots,\ 50$'
      - say: 'Probability is the number of favourable outcomes over the number of possible outcomes. So we count carefully.'
        write: '$P = \dfrac{\text{favourable}}{\text{possible}}$'
      - say: 'First, the possible outcomes. How many numbers are there from 40 to 50? Both ends count, so it is 50 minus 40, plus 1, which is 11. Count the cards: 11.'
        doodle_do: [{id: cards, op: stage, stage: 'custom:1986_q47_a2'}]
        write: 'Possible $= 50 - 40 + 1 = 11$'
        point:
          - {line: 2, kind: highlight, at: '11', to: {doodle: cards, part: count}}
      - say: 'Now the favourable ones, the primes. A prime has exactly two factors, 1 and itself. The even numbers 40, 42, 44, 46, 48 and 50 all divide by 2, so they are out. Cross out every even card.'
        doodle_do: [{id: cards, op: stage, stage: 'custom:1986_q47_a3'}]
        write: 'Even, not prime: $\ 40,\ 42,\ 44,\ 46,\ 48,\ 50$'
      - say: 'That leaves the odd numbers: 41, 43, 45, 47 and 49.'
        write: 'Odd: $\ 41,\ 43,\ 45,\ 47,\ 49$'
      - say: '45 is 5 times 9, so it is not prime. Cross out that card.'
        doodle_do: [{id: cards, op: cross, part: c45}]
        write: '$45 = 5 \times 9$'
      - say: '49 is 7 times 7, so it is not prime either. It looks prime, but it is 7 squared. Cross that card out too.'
        doodle_do: [{id: cards, op: cross, part: c49}]
        write: '$49 = 7 \times 7$'
      - say: 'Three cards are left standing. 41, 43 and 47 have no factors except 1 and themselves, so they are prime. That is 3 favourable numbers.'
        doodle_do: [{id: cards, op: circle, part: c41}, {id: cards, op: circle, part: c43}, {id: cards, op: circle, part: c47}]
        write: 'Primes: $\ 41,\ 43,\ 47$, so favourable $= 3$'
        point:
          - {line: 4, kind: strike, at: '45', text: 'not prime'}
          - {line: 4, kind: strike, at: '49'}
      - say: 'Now put the two counts into the formula: 3 favourable over 11 possible.'
        write: '$P = \dfrac{3}{11}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= 3'}, at: '11[[3]]', text: 'favourable'}
          - {line: 8, kind: move, from: {line: 2, at: '= 11'}, at: '= [[11]]3', text: 'possible'}
      - say: 'So the probability is 3 over 11, which is answer choice A.'
        write: 'Probability $= \dfrac{3}{11}$'
        answer: true
    traps:
      B: 'You went for 5 over 11. That counts all the odd numbers, 41, 43, 45, 47 and 49. But 45 is 5 times 9 and 49 is 7 times 7, so only 3 are prime.'
      C: 'You went for 3 over 10. The 3 primes are right, but from 40 to 50 there are 11 numbers, not 10. Both ends count, so it''s 50 minus 40, plus 1.'
      D: 'You went for 4 over 11. That includes 49, which looks prime but is 7 times 7. The primes are only 41, 43 and 47.'
