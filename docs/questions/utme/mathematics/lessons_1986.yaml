          - {figure: sketch, kind: highlight, target: MW}
          - {figure: sketch, kind: highlight, target: MU}
          - {figure: sketch, kind: highlight, target: MV}
      - say: '$MU$ is half of $UV$. So $W$ is always half of $UV$ away from $M$.'
        write: '$MW = \tfrac{1}{2}UV$'
      - say: 'Points that are always the same distance from a fixed point lie on a circle. So $W$ is on the circle with centre $M$, and radius half of $UV$.'
        write: 'Circle: centre $M$, radius $= \tfrac{1}{2}UV$'
        point:
          - {figure: sketch, kind: circle, target: 'M', text: 'centre'}
          - {figure: sketch, kind: highlight, target: 'MW', text: 'radius ½UV'}
      - say: 'The diameter is twice the radius, and twice half of $UV$ is $UV$ itself. So this circle has $UV$ as its diameter.'
        write: 'Diameter $= 2 \times \tfrac{1}{2}UV = UV$'
        point:
          - {figure: sketch, kind: underline, target: UV, text: 'diameter'}
      - say: 'One small detail: the points $U$ and $V$ themselves are left out, because there the angle $UWV$ does not exist.'
        write: 'Except $W = U$ and $W = V$'
        point:
          - {figure: sketch, kind: strike, target: U}
          - {figure: sketch, kind: strike, target: V}
