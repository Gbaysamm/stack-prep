# UTME 1986 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1986.yaml. Answers match that file.
format_version: 1
exam_year: 1986
lessons:
  1:
    moments:
      - say: 'We need to work out 212 base 3, minus 121 base 3, plus 222 base 3, and give the answer in base 3.'
        write: '$212_{3} - 121_{3} + 222_{3}$'
      - say: 'The safest plan is this: change each number to base ten, do the sum in base ten, and then change the answer back to base 3.'
        write: 'Plan: base 3 $\to$ base 10 $\to$ base 3'
      - say: 'What does a base 3 numeral mean? Each place is worth 3 times the place to its right. From the right, the places are worth 1, then 3, then 3 times 3, which is 9.'
        write: 'Place values in base 3: $\ 9,\ 3,\ 1$'
      - say: 'So 212 base 3 means 2 nines, plus 1 three, plus 2 ones.'
        write: '$212_{3} = 2(9) + 1(3) + 2(1)$'
      - say: '2 times 9 is 18, 1 times 3 is 3, and 2 times 1 is 2.'
        write: '$= 18 + 3 + 2$'
      - say: '18 plus 3 is 21, and 21 plus 2 is 23. So the first number is 23 in base ten.'
        write: '$= 23$'
      - say: 'In the same way, 121 base 3 is 1 nine, plus 2 threes, plus 1 one. That is 9 plus 6 plus 1, which is 16.'
        write: '$121_{3} = 1(9) + 2(3) + 1(1) = 9 + 6 + 1 = 16$'
      - say: 'And 222 base 3 is 2 nines, plus 2 threes, plus 2 ones. That is 18 plus 6 plus 2, which is 26.'
        write: '$222_{3} = 2(9) + 2(3) + 2(1) = 18 + 6 + 2 = 26$'
      - say: 'Now we put these three base ten values, 23, 16 and 26, back into the sum.'
        write: 'In base ten: $\ 23 - 16 + 26$'
        point:
          - {line: 8, kind: move, from: {line: 5, at: '= 23'}, at: '23', text: 'from base 3'}
          - {line: 8, kind: move, from: {line: 6, at: '= 16'}, at: '16'}
          - {line: 8, kind: move, from: {line: 7, at: '= 26'}, at: '26'}
      - say: '23 minus 16 is 7, and 7 plus 26 is 33.'
        write: '$= 7 + 26 = 33$'
      - say: 'Now we change 33 back to base 3. We keep dividing by 3 and write down each remainder. 33 divided by 3 is 11, remainder 0.'
        write: '$33 \div 3 = 11 \text{ r } 0$'
      - say: 'Now divide the 11 by 3. 11 divided by 3 is 3, remainder 2.'
        write: '$11 \div 3 = 3 \text{ r } 2$'
      - say: 'Then 3 divided by 3 is 1, remainder 0.'
        write: '$3 \div 3 = 1 \text{ r } 0$'
      - say: 'And 1 divided by 3 is 0, remainder 1. We stop when we reach 0.'
        write: '$1 \div 3 = 0 \text{ r } 1$'
      - say: 'Read the remainders from the bottom up: 1, 0, 2, 0. So 33 is 1020 in base 3.'
        write: '$33 = 1020_{3}$'
      - say: 'Let''s check with the base 3 place values 27, 9, 3 and 1. One 27, no nines, two threes and no ones is 27 plus 6, which is 33.'
        write: 'Check: $\ 1(27) + 0(9) + 2(3) + 0(1) = 27 + 6 = 33$'
      - say: 'So the answer is 1020 base 3, which is answer choice C.'
        write: '$212_{3} - 121_{3} + 222_{3} = 1020_{3}$'
        answer: true
    traps:
      A: 'You went for 313 base 3. That can''t be a base 3 number at all, because base 3 only uses the digits 0, 1 and 2. Any option with a 3 in it is out.'
      B: 'You went for 1000 base 3. That is 27 in base ten, but the sum is 23 minus 16 plus 26, which is 33. Check each conversion with place values 9, 3 and 1.'
      D: 'You went for 1222 base 3. That is 27 plus 18 plus 6 plus 2, which is 53, not 33. Convert 33 by dividing by 3 and reading the remainders from the bottom up.'
  2:
    moments:
      - say: 'If Musa had scored 75 in Biology instead of 57, his average over four subjects would have been 60. We want his real total.'
        doodle: {name: 'custom:1986_q02_a', caption: 'Biology: 57, not 75'}
        write: 'Imagined average $= 60$ over 4 subjects'
      - say: 'Remember what an average is: the total divided by the number of subjects.'
        write: '$\text{average} = \dfrac{\text{total}}{\text{number of subjects}}$'
      - say: 'Turn that round, and the total is the average times the number of subjects.'
        write: '$\text{total} = \text{average} \times \text{number of subjects}$'
      - say: 'For the imagined marks, that is 60 times 4, which is 240.'
        write: 'Imagined total $= 60 \times 4 = 240$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
      - say: 'But careful. That 240 is the total he would have had with 75 in Biology. His real Biology mark was 57, not 75.'
        write: 'Real Biology mark $= 57$, not $75$'
      - say: 'So the imagined total is too big by the gap between 75 and 57. 75 minus 57 is 18.'
        write: 'Extra marks $= 75 - 57 = 18$'
      - say: 'To get his real total, we take the imagined total of 240 and subtract those 18 extra marks.'
        write: 'Real total $= 240 - 18$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '= 240'}, at: '240', text: 'imagined total'}
          - {line: 6, kind: move, from: {line: 5, at: '= 18'}, at: '18', text: 'take away'}
      - say: '240 minus 18 is 222.'
        write: '$= 222$'
      - say: 'Let''s check. Add the 18 marks back and 222 becomes 240, and 240 divided by 4 is 60, the average we were told.'
        write: 'Check: $\ 222 + 18 = 240,\quad 240 \div 4 = 60$'
      - say: 'So his total mark was 222, which is answer choice C.'
        write: 'Total mark $= 222$'
        answer: true
    traps:
      A: 'You went for 282. That is even bigger than the imagined total of 240. His real Biology mark was lower than 75, so his real total must be smaller: 240 minus 18 is 222.'
      B: 'You went for 240. That''s the total he would have had with 75 in Biology. The question wants what he really scored, which is 18 marks less: 222.'
      D: 'You went for 210. That takes 30 marks off, but the gap between 75 and 57 is 18. Take 18 from 240 and you get 222.'
  3:
    moments:
      - say: 'We want the L.C.M. of 48, 64 and 80, divided by their H.C.F.'
        write: '$\dfrac{\text{L.C.M. of } 48,\ 64,\ 80}{\text{H.C.F. of } 48,\ 64,\ 80}$'
      - say: 'Both the L.C.M. and the H.C.F. can be read straight off the prime factors, so the first job is to break each number into primes.'
      - say: '48 is 16 times 3, and 16 is 2 times 2 times 2 times 2, which is 2 to the power 4.'
        write: '$48 = 16 \times 3 = 2^{4} \times 3$'
      - say: '64 is 2 multiplied by itself six times, so 64 is 2 to the power 6.'
        write: '$64 = 2^{6}$'
      - say: '80 is 16 times 5, so 80 is 2 to the power 4, times 5.'
        write: '$80 = 16 \times 5 = 2^{4} \times 5$'
      - say: 'The H.C.F. is the biggest number that divides all three. So we take only the primes found in all three, each to its lowest power. Only 2 is in all three, and its lowest power is 2 to the 4.'
        write: 'H.C.F. $= 2^{4}$'
        point:
          - {line: 2, kind: circle, at: '24', text: 'lowest power'}
      - say: '2 to the power 4 is 2 times 2 times 2 times 2, which is 16.'
        write: '$= 16$'
      - say: 'The L.C.M. is the smallest number all three divide into. So we take every prime that appears anywhere, each to its highest power: 2 to the 6, then 3, then 5.'
        write: 'L.C.M. $= 2^{6} \times 3 \times 5$'
        point:
          - {line: 3, kind: circle, at: '26', text: 'highest power'}
      - say: '2 to the 6 is 64, and 3 times 5 is 15.'
        write: '$= 64 \times 15$'
      - say: '64 times 10 is 640, and 64 times 5 is 320. 640 plus 320 is 960.'
        write: '$= 640 + 320 = 960$'
      - say: 'Now divide the L.C.M. we just found, 960, by the H.C.F. we found, 16.'
        write: '$\dfrac{\text{L.C.M.}}{\text{H.C.F.}} = \dfrac{960}{16}$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '= 960'}, at: '960', text: 'L.C.M.'}
          - {line: 10, kind: move, from: {line: 6, at: '= 16'}, at: '16', text: 'H.C.F.'}
      - say: '16 times 6 is 96, so 16 times 60 is 960. That means 960 divided by 16 is 60.'
        write: '$= 60$'
      - say: 'So the L.C.M. divided by the H.C.F. is 60, which is answer choice D.'
        write: 'L.C.M. $\div$ H.C.F. $= 60$'
        answer: true
    traps:
      A: 'You went for 20. That comes from an L.C.M. of 320, which uses 2 to the 4 instead of 2 to the 6. But 64 needs 2 to the 6, so the L.C.M. is 960, and 960 divided by 16 is 60.'
      B: 'You went for 30. That''s half the answer, from an L.C.M. of 480. The L.C.M. must use the highest power of 2, which is 2 to the 6, giving 960, and 960 divided by 16 is 60.'
      C: 'You went for 48. That''s one of the numbers, not the result. Find the L.C.M., 960, and the H.C.F., 16, then divide to get 60.'
  4:
    moments:
      - say: 'We want the smallest number that 252 can be multiplied by to give a perfect square.'
        write: '$252 \times k = \text{a perfect square}$'
      - say: 'Here''s the key idea. A perfect square is a number times itself, so its prime factors always come in pairs. So let''s break 252 into primes and look for a prime without a partner.'
      - say: '252 is 4 times 63.'
        write: '$252 = 4 \times 63$'
      - say: '4 is 2 times 2. 63 is 9 times 7, and 9 is 3 times 3.'
        write: '$= 2 \times 2 \times 3 \times 3 \times 7$'
      - say: 'Written with powers, that is 2 squared, times 3 squared, times 7.'
        write: '$= 2^{2} \times 3^{2} \times 7$'
      - say: 'Now look for pairs. The two 2s make a pair, and the two 3s make a pair. But the 7 is on its own.'
        write: 'Unpaired prime: $\ 7$'
        point:
          - {line: 4, kind: circle, at: '× 7', text: 'no partner'}
      - say: 'So we give the 7 a partner by multiplying by one more 7. Then 7 appears twice, as 7 squared.'
        write: '$252 \times 7 = 2^{2} \times 3^{2} \times 7^{2}$'
        point:
          - {line: 6, kind: arrow, from: {line: 5, at: '7'}, at: '252 × [[7]]', text: 'one more 7'}
      - say: 'Now every prime is paired, so this is a square: 2 times 3 times 7, all squared. 2 times 3 is 6, and 6 times 7 is 42.'
        write: '$= (2 \times 3 \times 7)^{2} = 42^{2}$'
      - say: 'Let''s check. 252 times 7 is 1764, and 42 times 42 is also 1764.'
        write: 'Check: $\ 252 \times 7 = 1764 = 42 \times 42$'
      - say: 'Could a smaller number work? No. Whatever we multiply by must bring a partner for the lonely 7, so it must contain a 7.'
      - say: 'So the smallest number is 7, which is answer choice D.'
        write: 'Smallest multiplier: $\ k = 7$'
        answer: true
    traps:
      A: 'You went for 2. But 252 already has 2 squared in it. Multiplying by 2 makes it 2 cubed, which is odd again. The unpaired prime is 7.'
      B: 'You went for 3. 252 already has 3 squared in it, so a third 3 would spoil the square. The prime that needs a partner is 7.'
      C: 'You went for 5. 5 isn''t a factor of 252 at all, so multiplying by 5 would add a new unpaired prime. The one to pair up is 7.'
  5:
    moments:
      - say: 'We have two thirds, divided by a half plus a third, and we want the reciprocal of the whole thing.'
        write: '$\dfrac{\tfrac{2}{3}}{\tfrac{1}{2} + \tfrac{1}{3}}$'
      - say: 'First, what is a reciprocal? It is 1 divided by the number. For a fraction, that just means turning it upside down. So our plan is to make the whole thing one simple fraction, then flip it.'
        write: 'Reciprocal of $\dfrac{a}{b}$ is $\dfrac{b}{a}$'
      - say: 'Start with the bottom: a half plus a third. To add them we need a common denominator, and the smallest one is 6.'
        write: 'Bottom: $\ \tfrac{1}{2} + \tfrac{1}{3} = \tfrac{3}{6} + \tfrac{2}{6}$'
      - say: 'A half is 3 over 6, and a third is 2 over 6. 3 plus 2 is 5, so the bottom is 5 over 6.'
        write: '$= \tfrac{5}{6}$'
      - say: 'Now put that back into the big fraction. It is two thirds divided by 5 over 6.'
        write: '$\dfrac{\tfrac{2}{3}}{\tfrac{5}{6}} = \tfrac{2}{3} \div \tfrac{5}{6}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= 65'}, at: '÷ 65', text: 'sub in'}
      - say: 'Dividing by a fraction means multiplying by it upside down. So it becomes two thirds times 6 over 5.'
        write: '$= \tfrac{2}{3} \times \tfrac{6}{5}$'
        point:
          - {line: 5, kind: arrow, from: {line: 4, at: '÷ 65'}, at: '× 56', text: 'upside down'}
      - say: 'Tops: 2 times 6 is 12. Bottoms: 3 times 5 is 15. That gives 12 over 15.'
        write: '$= \tfrac{12}{15}$'
      - say: 'Divide top and bottom by 3. 12 divided by 3 is 4, and 15 divided by 3 is 5. So the expression is worth 4 over 5.'
        write: '$= \tfrac{4}{5}$'
      - say: 'But the question wants the reciprocal. Turn the 4 over 5 we just found upside down, and we get 5 over 4.'
        write: 'Reciprocal of $\tfrac{4}{5}$: $\ \tfrac{5}{4}$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
          - {line: 8, kind: move, from: {line: 7, at: '= 54'}, at: 'of 54', text: 'flip this'}
      - say: 'Let''s check. A number times its reciprocal is always 1. 4 over 5 times 5 over 4 is 20 over 20, which is 1.'
        write: 'Check: $\ \tfrac{4}{5} \times \tfrac{5}{4} = \tfrac{20}{20} = 1$'
      - say: 'So the reciprocal is 5 over 4, which is answer choice B.'
        write: 'Answer: $\ \tfrac{5}{4}$'
        answer: true
    traps:
      A: 'You went for 4 over 5. That''s the value of the expression, and it''s correct as far as it goes. But the question asks for its reciprocal, so turn it over: 5 over 4.'
      C: 'You went for 2 over 5. Work the bottom out first: a half plus a third is 5 over 6. Then two thirds divided by 5 over 6 is 4 over 5, and turning that over gives 5 over 4.'
      D: 'You went for 6 over 7. The bottom is a half plus a third, which is 5 over 6, not 7 over 6. Then the value is 4 over 5, and its reciprocal is 5 over 4.'
  6:
    moments:
      - say: 'Three boys share some oranges. The first gets a third. The second gets two thirds of what is left. The third gets the last 12. How many oranges were there?'
        doodle: {name: 'custom:1986_q06_a', caption: 'The third boy gets the last 12'}
        write: '1st: $\tfrac{1}{3}$ of all; 2nd: $\tfrac{2}{3}$ of the remainder; 3rd: $12$'
      - say: 'The key word is remainder. The second boy''s share is a fraction of what is left, not of the whole. So we will write each share as a fraction of the whole.'
      - say: 'After the first boy takes a third, what is left is 1 minus a third, which is two thirds of the oranges.'
        write: 'Remainder $= 1 - \tfrac{1}{3} = \tfrac{2}{3}$'
      - say: 'The second boy takes two thirds of that remainder. Of means times, so his share is two thirds times two thirds.'
        write: '2nd share $= \tfrac{2}{3} \times \tfrac{2}{3}$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '= 32'}, at: '× 32', text: 'of this'}
      - say: 'Tops: 2 times 2 is 4. Bottoms: 3 times 3 is 9. So the second boy gets 4 over 9 of the whole.'
        write: '$= \tfrac{4}{9}$'
      - say: 'The third boy gets whatever is left: 1, minus the first share of a third, minus the second share of 4 over 9.'
        write: '3rd share $= 1 - \tfrac{1}{3} - \tfrac{4}{9}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= 94'}, at: '− 94', text: '2nd share'}
      - say: 'Put everything over 9. 1 is 9 over 9, and a third is 3 over 9.'
        write: '$= \tfrac{9}{9} - \tfrac{3}{9} - \tfrac{4}{9}$'
      - say: '9 minus 3 is 6, and 6 minus 4 is 2. So the third boy gets 2 over 9 of the whole.'
        write: '$= \tfrac{2}{9}$'
      - say: 'Now bring in the 12. The third boy got 12 oranges, so 2 over 9 of the total is 12.'
        write: '$\tfrac{2}{9} \times \text{total} = 12$'
        point:
          - {line: 8, kind: move, from: {line: 0, at: '3rd: 12'}, at: '= 12', text: 'given'}
      - say: 'If 2 over 9 of the total is 12, then 1 over 9 of it is half of 12, which is 6.'
        write: '$\tfrac{1}{9} \times \text{total} = 12 \div 2 = 6$'
      - say: 'The whole is 9 over 9, so the total is 9 times 6, which is 54.'
        write: 'Total $= 9 \times 6 = 54$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '= 6'}, at: '× 6', text: 'one ninth'}
      - say: 'Let''s check. A third of 54 is 18, which leaves 54 minus 18, that is 36.'
        write: 'Check: $\ \tfrac{1}{3} \times 54 = 18,\quad 54 - 18 = 36$'
      - say: 'Two thirds of 36 is 24, which leaves 36 minus 24, that is 12 for the third boy. Just right.'
        write: '$\tfrac{2}{3} \times 36 = 24,\quad 36 - 24 = 12$'
      - say: 'So they shared 54 oranges, which is answer choice B.'
        write: 'Oranges shared $= 54$'
        answer: true
    traps:
      A: 'You went for 60. Test it: a third of 60 is 20, leaving 40, and two thirds of 40 is not a whole number. The third boy gets 2 over 9 of the total, so the total is 54.'
      C: 'You went for 48. A third of 48 is 16, leaving 32, and two thirds of 32 isn''t whole. Work out the third boy''s fraction, 2 over 9, and set it equal to 12.'
      D: 'You went for 42. Test it: a third of 42 is 14, leaving 28, and two thirds of 28 isn''t whole. Remember the second boy takes two thirds of the remainder, not of the whole; then 2 over 9 of the total is 12, so the total is 54.'
  7:
    moments:
      - say: 'We''re told P is 18, Q is 21, R is negative 6 and S is negative 4. We want P minus Q plus 2S, all over R cubed.'
        write: '$\dfrac{P - Q + 2S}{R^{3}}$'
      - say: 'Two of the values are negative, so the danger is in the signs. The safe habit is to put every value in brackets as it goes in.'
        write: '$= \dfrac{(18) - (21) + 2(-4)}{(-6)^{3}}$'
      - say: 'Let''s do the top first. 18 minus 21 is negative 3.'
        write: 'Top: $\ 18 - 21 = -3$'
      - say: 'Next, 2 times negative 4 is negative 8.'
        write: '$2(-4) = -8$'
      - say: 'So the top is the negative 3 plus the negative 8, which is negative 11.'
        write: 'Top $= -3 + (-8) = -11$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '= −3'}, at: '−3 +', text: 'from here'}
          - {line: 4, kind: move, from: {line: 3, at: '= −8'}, at: '(−8)'}
      - say: 'Now the bottom. Negative 6 cubed means negative 6, times negative 6, times negative 6.'
        write: 'Bottom: $\ (-6)^{3} = (-6)(-6)(-6)$'
      - say: 'The first two: negative 6 times negative 6 is positive 36, because two negatives make a positive.'
        write: '$= 36 \times (-6)$'
      - say: '36 times 6 is 216, and a positive times a negative is negative. So the bottom is negative 216.'
        write: '$= -216$'
      - say: 'Notice the idea here: an odd power of a negative number stays negative. Squaring removes the minus sign; cubing keeps it.'
      - say: 'Now put together the top and the bottom we found: negative 11 over negative 216.'
        write: '$\dfrac{P - Q + 2S}{R^{3}} = \dfrac{-11}{-216}$'
        point:
          - {line: 9, kind: move, from: {line: 4, at: '= −11'}, at: '−11', text: 'top'}
          - {line: 9, kind: move, from: {line: 7, at: '= −216'}, at: '−216', text: 'bottom'}
      - say: 'A negative divided by a negative is positive, so the two minus signs cancel.'
        write: '$= \dfrac{11}{216}$'
      - say: 'So the value is 11 over 216, which is answer choice B.'
        write: 'Value $= \dfrac{11}{216}$'
        answer: true
    traps:
      A: 'You went for negative 11 over 216. The top is negative 11, but the bottom is negative too: negative 6 cubed is negative 216. A negative over a negative is positive.'
      C: 'You went for negative 43 over 115. That doesn''t come from these numbers. The top is 18 minus 21 plus 2 times negative 4, which is negative 11, and the bottom is negative 216.'
      D: 'You went for 41 over 116. The bottom must be R cubed, which is negative 216, and the top is negative 11. That gives 11 over 216.'
  8:
    moments:
      - say: 'We need to simplify 0.03 times 4 times 0.00064, all over 0.48 times 0.012.'
        write: '$\dfrac{0.03 \times 4 \times 0.00064}{0.48 \times 0.012}$'
      - say: 'Small decimals are easier in standard form. Then we can deal with the ordinary numbers and the powers of ten separately.'
      - say: '0.03 is 3 times 10 to the minus 2, because the point moves 2 places. And 0.00064 is 6.4 times 10 to the minus 4.'
        write: '$0.03 = 3 \times 10^{-2},\quad 0.00064 = 6.4 \times 10^{-4}$'
      - say: 'So the top becomes 3 times 10 to the minus 2, times 4, times 6.4 times 10 to the minus 4.'
        write: 'Top $= 3 \times 10^{-2} \times 4 \times 6.4 \times 10^{-4}$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '0.03 = 3 × 10−2'}, at: '[[3 × 10−2]] × 4', text: 'standard form'}
          - {line: 3, kind: move, from: {line: 2, at: '6.4 × 10−4'}, at: '6.4 × 10−4'}
      - say: 'The ordinary numbers first: 3 times 4 is 12, and 12 times 6.4 is 76.8.'
        write: '$3 \times 4 \times 6.4 = 12 \times 6.4 = 76.8$'
      - say: 'The law of indices: to multiply powers of the same base, add the powers.'
        write: '$a^{m} \times a^{n} = a^{m + n}$'
      - say: 'Now the powers. When we multiply powers of ten, we add the powers. Minus 2 plus minus 4 is minus 6.'
        write: '$10^{-2} \times 10^{-4} = 10^{-6}$'
      - say: 'So the top is 76.8 times 10 to the minus 6. In standard form, that is 7.68 times 10 to the minus 5.'
        write: 'Top $= 76.8 \times 10^{-6} = 7.68 \times 10^{-5}$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '= 76.8'}, at: '= [[76.8]] × 10−6', text: 'numbers'}
          - {line: 7, kind: move, from: {line: 6, at: '= 10−6'}, at: '76.8 × [[10−6]]', text: 'powers'}
      - say: 'Now the bottom. 0.48 is 4.8 times 10 to the minus 1, and 0.012 is 1.2 times 10 to the minus 2.'
        write: 'Bottom $= 4.8 \times 10^{-1} \times 1.2 \times 10^{-2}$'
      - say: 'The ordinary numbers: 4.8 times 1.2 is 5.76. The powers: minus 1 plus minus 2 is minus 3.'
        write: '$= 5.76 \times 10^{-3}$'
      - say: 'Now divide the top we found by the bottom we found. Numbers divide by numbers, and powers of ten by powers of ten.'
        write: '$\dfrac{7.68 \times 10^{-5}}{5.76 \times 10^{-3}} = \dfrac{7.68}{5.76} \times \dfrac{10^{-5}}{10^{-3}}$'
        point:
          - {line: 10, kind: move, from: {line: 7, at: '= [[7.68 × 10−5]]'}, at: '7.68 × 10−5', text: 'top'}
          - {line: 10, kind: move, from: {line: 9, at: '5.76 × 10−3'}, at: '5.76 × 10−3', text: 'bottom'}
      - say: '7.68 divided by 5.76 is 1.333 and so on.'
        write: '$\dfrac{7.68}{5.76} = 1.333\ldots$'
      - say: 'The law of indices: to divide powers of the same base, subtract the powers.'
        write: '$a^{m} \div a^{n} = a^{m - n}$'
      - say: 'For the powers, dividing means subtracting: minus 5, minus minus 3, is minus 2.'
        write: '$\dfrac{10^{-5}}{10^{-3}} = 10^{-5 - (-3)} = 10^{-2}$'
      - say: 'Put the two parts together: 1.333 times 10 to the minus 2. To two significant figures, that is 1.3 times 10 to the minus 2.'
        write: '$= 1.333\ldots \times 10^{-2} \approx 1.3 \times 10^{-2}$'
      - say: 'So the value is 1.3 times 10 to the minus 2, which is answer choice A.'
        write: 'Value $\approx 1.3 \times 10^{-2}$'
        answer: true
    traps:
      B: 'You went for 1.3 times 10 to the minus 3. The digits are right, but the power is off by one. 10 to the minus 5 divided by 10 to the minus 3 is 10 to the minus 2.'
      C: 'You went for 7.5 times 10 to the 1, which is 75. That''s the fraction turned upside down. Keep the top on top: the answer is about 0.0133.'
