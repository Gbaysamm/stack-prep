        point:
          - {line: 3, kind: highlight, at: '18', to: {doodle: drawer, part: drawer}}
      - say: 'The favourable shirts are the purple ones, and there are 7 of them. That is the purple pile.'
        doodle_do: [{id: drawer, op: circle, part: purple}]
        write: 'Purple $= 7$'
      - say: 'Now put the 7 purple shirts and the 18 in total into the formula.'
        doodle_do: [{id: drawer, op: label, part: purple, text: '7 of the 18'}]
        write: '$P(\text{purple}) = \dfrac{7}{18}$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {line: 5, kind: move, from: {line: 4, at: '= 7'}, at: '18[[7]]', text: 'purple'}
          - {line: 5, kind: move, from: {line: 3, at: '= 18'}, at: '= [[18]]7', text: 'total'}
      - say: 'Does it simplify? 7 is prime, and 18 is 2 times 3 times 3, with no 7 in it. So 7 over 18 is already in its lowest terms.'
        write: '$18 = 2 \times 3 \times 3$, no factor of $7$'
      - say: 'A sense check: purple is the biggest group but less than half the drawer, so the answer should be a bit under a half. 7 over 18 is about 0.39. Good.'
        write: 'Sense check: $\ \dfrac{7}{18} \approx 0.39 < \dfrac{1}{2}$'
      - say: 'So the probability is 7 over 18, which is answer choice C.'
        write: 'Probability $= \dfrac{7}{18}$'
        answer: true
    traps:
