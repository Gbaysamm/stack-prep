        doodle_do: [{id: bars, op: stage, stage: 'custom:1986_q50_a3'}, {id: bars, op: label, part: gt4, text: '23 students'}]
        write: 'More than 4: $\ 12 + 6 + 4 + 1 = 23$'
      - say: 'Then 27 plus 23 is 50, and all the frequencies in the table do add to 50. So the count is right.'
        write: 'All students: $\ 27 + 23 = 50$'
      - say: 'So $S$, $m$ is 27, 4, which is answer choice A.'
        write: '$(S,\ m) = (27,\ 4)$'
        answer: true
