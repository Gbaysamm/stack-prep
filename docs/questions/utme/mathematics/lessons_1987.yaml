        write: 'Co-interior angles: sum $= 180^{\circ}$'
        point:
          - {figure: 0, kind: arrow, target: {x: 216, y: 70}, text: 'co-interior'}
          - {figure: 0, kind: arrow, target: {x: 125, y: 210}, text: 'co-interior'}
