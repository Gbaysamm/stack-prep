          - {figure: sketch, kind: arc, target: ACB, text: '90°'}
      - section: 'Check'
        say: 'Check with real numbers. Suppose the angle at $A$ were 120 and the angle at $B$ 60, so they add to 180. Then $y$ is 60, $z$ is 30, and $x$ is 180 minus 90.'
        write: '$y = 60^{\circ}$, $z = 30^{\circ}$: $x = 180^{\circ} - 60^{\circ} - 30^{\circ} = 90^{\circ}$ $\checkmark$'
      - say: 'Therefore $x$ is 90 degrees, which is option C. The bisectors of co-interior angles always meet at a right angle.'
        write: '$\therefore x = 90^{\circ}$ (C)'
        answer: true
        point:
          - {figure: 0, kind: label, target: 'x', text: '90°'}
    traps:
      A: 'You went for 110 degrees. The co-interior angles add up to 180, so their halves, $y$ plus $z$, add up to 90, and the third angle of the triangle is 180 minus 90, which is 90 degrees.'
      B: 'You went for 100 degrees. We cannot find $y$ and $z$ alone, but we do not need to, because $y$ plus $z$ is 90, so $x$ is 180 minus 90, which is 90 degrees.'
      D: 'You went for 80 degrees. Half of 180 is 90, so $y$ plus $z$ is 90, and the angle between the bisectors is 180 minus 90, which is 90 degrees.'
  37:
    moments:
      - section: 'The question'
        say: 'Picture a door frame, which is a big rectangle with a smaller rectangle cut out, open at the bottom. We know the area of the frame, and we want h.'
        write: 'Find $h$.'
      - say: 'Write Solution. The figure is given, and PQRS is 2h wide and 3h tall, and the border is 2 cm wide along the top and both sides.'
        write: 'Solution'
        point:
          - {figure: 0, kind: circle, target: '2h', text: 'width', 'on': '2h wide'}
          - {figure: 0, kind: circle, target: '3h', text: 'height', 'on': '3h tall'}
          - {figure: 0, kind: arrow, target: {x: 118, y: 60}, text: '2 cm border', 'on': 'the border'}
      - section: 'What we know'
        say: 'List the givens. The big rectangle is 2h by 3h, the border is 2 cm, and the shaded area is 72 square centimetres.'
        write: '$PQRS$: $2h$ by $3h$; border $= 2$ cm; shaded area $= 72\ \text{cm}^{2}$'
      - section: 'The plan'
        say: 'The shaded frame is the big rectangle with the cut-out taken away.'
        write: 'Shaded area $=$ area of $PQRS -$ area of cut-out'
        point:
          - {figure: 0, kind: arrow, target: {x: 51, y: 160}, text: 'shaded', 'on': 'shaded frame'}
          - {figure: 0, kind: arrow, target: {x: 120, y: 170}, text: 'cut-out', 'on': 'the cut-out'}
      - section: 'The two areas'
        say: 'Area of a rectangle is length times width. The big one is 2h times 3h, which is 6h squared.'
        write: 'Area of $PQRS = 2h \times 3h = 6h^{2}$'
      - say: 'The cut-out loses 2 cm on the left and 2 cm on the right, so its width is 2h minus 4.'
        write: 'Width of cut-out $= 2h - 2 - 2 = 2h - 4$'
      - say: 'The border runs along the top only, because the bottom is open. So the height loses just 2 cm, giving 3h minus 2.'
        write: 'Height of cut-out $= 3h - 2$'
        point:
          - {figure: 0, kind: label, target: {x: 120, y: 276}, text: 'bottom open', 'on': 'bottom is open'}
      - say: 'So the cut-out is 2h minus 4, times 3h minus 2. Expand it to get 6h squared, minus 4h, minus 12h, plus 8.'
        write: 'Area of cut-out $= (2h - 4)(3h - 2) = 6h^{2} - 4h - 12h + 8$'
      - say: 'Minus 4h minus 12h is minus 16h.'
        write: '$= 6h^{2} - 16h + 8$'
      - section: 'The equation'
        say: 'Substitute into the plan. The shaded area is 72.'
        write: '$72 = 6h^{2} - (6h^{2} - 16h + 8)$'
        point:
          - {line: 9, kind: move, from: {line: 4, at: '= [[6h2]]'}, at: '= [[6h2]] −', text: 'PQRS', 'on': 'Substitute'}
          - {line: 9, kind: move, from: {line: 8, at: '6h2 − 16h + 8'}, at: '(6h2 − 16h + 8)', text: 'cut-out', 'on': 'Substitute'}
      - say: 'Removing the bracket after a minus changes every sign inside it. Then the 6h squared terms cancel.'
        write: '$72 = 6h^{2} - 6h^{2} + 16h - 8 = 16h - 8$'
        point:
          - {line: 10, kind: strike, at: '6h2 − 6h2', text: 'cancels', 'on': 'cancel'}
      - say: 'Add 8 to both sides, and 72 plus 8 is 80.'
        write: '$16h = 80$'
      - say: 'Divide both sides by 16, and 80 over 16 is 5.'
        write: '$h = \dfrac{80}{16} = 5$'
      - say: 'Therefore h is 5 centimetres.'
        write: '$\therefore h = 5$ cm'
      - section: 'Check'
        say: 'To check, with h equal to 5, PQRS is 10 by 15, which is 150. The cut-out is 6 by 13, which is 78. 150 minus 78 is 72.'
        write: 'Check: $10 \times 15 - 6 \times 13 = 150 - 78 = 72$ ✓'
        point:
          - {figure: 0, kind: label, target: {x: 51, y: 160}, text: '72 cm²', 'on': 'is 72'}
      - section: 'Answer'
        say: 'So h is 5 centimetres, which is answer choice D.'
        write: '$\therefore h = 5$ cm (D)'
        answer: true
    traps:
      A: 'You went for 12 cm. Then the shaded area would be 16 times 12 minus 8, which is 184, far more than 72. 16h minus 8 equals 72 gives h equals 5.'
      B: 'You went for 10 cm. Check it. 16 times 10 minus 8 is 152, not 72. The equation 16h minus 8 equals 72 gives h equals 5.'
      C: 'You went for 8 cm. Check it. 16 times 8 minus 8 is 120, not 72. Remember the bottom is open, so the cut-out is 3h minus 2 tall, and 16h minus 8 equals 72 gives 5.'
  38:
    moments:
      - section: 'The question'
        say: 'We want the sine, cosine and tangent of 210 degrees. 210 is beyond 90, so we need two things, the size from a basic angle, and the sign from the quadrant.'
        write: 'Find $\sin 210^{\circ},\ \cos 210^{\circ},\ \tan 210^{\circ}$'
      - section: 'Solution'
        say: 'Solution. Let me draw the quadrant diagram. Going anticlockwise from the first quadrant, we have All, Sine, Tangent and Cosine. That tells us which ratios are positive.'
        write: 'Solution: quadrants A, S, T, C (positive ratios)'
        show_sketch: true
        'on': 'quadrant diagram'
        point:
          - {figure: sketch, kind: circle, target: A, text: 'all +'}
          - {figure: sketch, kind: circle, target: S, text: 'sin +'}
          - {figure: sketch, kind: circle, target: T, text: 'tan +'}
      - say: 'You may remember it as All Students Take Coffee. Now turn 210 degrees anticlockwise from the positive $x$-axis. 210 is between 180 and 270.'
        write: '$180^{\circ} < 210^{\circ} < 270^{\circ}$: 3rd quadrant'
        point:
          - {figure: sketch, kind: circle, target: '210°'}
      - say: 'In the third quadrant, the basic angle is the angle minus 180. 210 minus 180 is 30 degrees.'
        write: 'Basic $\angle = 210^{\circ} - 180^{\circ} = 30^{\circ}$'
        point:
          - {figure: sketch, kind: circle, target: '30°', text: 'basic ∠'}
      - say: 'In the third quadrant, only T is positive. So tan is positive, and sine and cosine are negative.'
        write: '3rd quad.: $\tan +$; $\ \sin -$, $\cos -$'
        point:
          - {figure: sketch, kind: circle, target: T, text: 'only tan +'}
      - section: 'The sizes from 30°'
        say: 'Now the sizes, without tables. Take an equilateral triangle of side 2 and cut it in half. The half has sides 1, root 3 and 2, with 30 degrees at the top.'
        write: 'Half of equilateral $\triangle$: sides $1,\ \sqrt{3},\ 2$'
        show_sketch: sketch_b
        'on': 'cut it in half'
      - say: 'From the 30 degree angle, opposite is 1, adjacent is root 3, and hypotenuse is 2. By SOH, sin 30 is opposite over hypotenuse, which is 1 over 2.'
        write: '$\sin 30^{\circ} = \dfrac{\text{opp}}{\text{hyp}} = \dfrac{1}{2}$'
        point:
          - {figure: sketch_b, kind: highlight, target: BD, text: 'opp = 1'}
          - {figure: sketch_b, kind: highlight, target: AB, text: 'hyp = 2'}
      - say: 'By CAH, cos 30 is adjacent over hypotenuse, which is root 3 over 2.'
        write: '$\cos 30^{\circ} = \dfrac{\text{adj}}{\text{hyp}} = \dfrac{\sqrt{3}}{2}$'
        point:
          - {figure: sketch_b, kind: highlight, target: AD, text: 'adj = √3'}
      - say: 'By TOA, tan 30 is opposite over adjacent, which is 1 over root 3. Rationalise by multiplying top and bottom by root 3, and it becomes root 3 over 3.'
        write: '$\tan 30^{\circ} = \dfrac{1}{\sqrt{3}} = \dfrac{1 \times \sqrt{3}}{\sqrt{3} \times \sqrt{3}} = \dfrac{\sqrt{3}}{3}$'
      - section: 'Size and sign together'
        say: 'Now put each sign on its size. Sine is negative in the third quadrant, so sin 210 is minus sin 30, which is minus 1 over 2.'
        write: '$\sin 210^{\circ} = -\sin 30^{\circ} = -\dfrac{1}{2}$'
        point:
          - {line: 9, kind: move, from: {line: 6, at: '= [[21]]'}, at: '− [[21]]', text: 'size'}
          - {line: 4, kind: circle, at: 'sin −', text: 'sign'}
      - say: 'Cosine is negative too, so cos 210 is minus cos 30, which is minus root 3 over 2.'
        write: '$\cos 210^{\circ} = -\cos 30^{\circ} = -\dfrac{\sqrt{3}}{2}$'
        point:
          - {line: 4, kind: circle, at: 'cos −', text: 'sign'}
      - say: 'Tangent is positive in the third quadrant, so tan 210 is plus tan 30, which is root 3 over 3.'
        write: '$\tan 210^{\circ} = +\tan 30^{\circ} = \dfrac{\sqrt{3}}{3}$'
        point:
          - {line: 4, kind: circle, at: 'tan +', text: 'sign'}
      - section: 'Check'
        say: 'To check, tan is sin over cos. Minus 1 over 2, divided by minus root 3 over 2, is 1 over root 3, which is root 3 over 3. The minus signs cancel.'
        write: 'Check: $\dfrac{-\frac{1}{2}}{-\frac{\sqrt{3}}{2}} = \dfrac{1}{\sqrt{3}} = \dfrac{\sqrt{3}}{3}\ \checkmark$'
      - section: 'Answer'
        say: 'So they are minus 1 over 2, minus root 3 over 2, and root 3 over 3, which is answer choice A.'
        write: '$\therefore -\dfrac{1}{2},\ -\dfrac{\sqrt{3}}{2},\ \dfrac{\sqrt{3}}{3}$'
        answer: true
        point:
          - {figure: sketch, kind: label, target: P, text: '210°'}
    traps:
      B: 'You went for all three positive. Those are the values for 30 degrees, the basic angle. 210 degrees is in the third quadrant, where only tan is positive, so sine and cosine take a minus sign.'
      C: 'You went for root 3 over 2, root 3 over 3 and 1. Those are not the ratios of 30 degrees. From the half equilateral triangle, sin 30 is 1 over 2, cos 30 is root 3 over 2 and tan 30 is root 3 over 3, and then come the third-quadrant signs.'
      D: 'You went for 3 over 2, 1 over 2 and 1. A sine can never be bigger than 1, because the opposite side is never longer than the hypotenuse. Use the basic angle 30 degrees and the third-quadrant signs.'
  39:
    moments:
      - section: 'The question'
        say: 'Tan theta is $m$ squared minus $n$ squared, over 2$mn$. We want sec theta. When a ratio is in letters, draw the triangle it describes.'
        write: '$\tan\theta = \dfrac{m^{2} - n^{2}}{2mn}$; find $\sec\theta$'
      - section: 'Solution'
        say: 'Solution. Let me draw a right-angled triangle $ABC$, with the right angle at $B$ and theta at $A$.'
        write: 'Solution: right $\angle$ at $B$, $\theta$ at $A$'
        show_sketch: true
        'on': 'draw'
      - say: 'TOA says tan is opposite over adjacent. So the opposite side $BC$ is $m$ squared minus $n$ squared, and the adjacent side $AB$ is 2$mn$.'
        write: 'TOA: opp $= m^{2} - n^{2}$, adj $= 2mn$'
        point:
          - {figure: sketch, kind: highlight, target: BC, text: 'opp'}
          - {figure: sketch, kind: highlight, target: AB, text: 'adj'}
      - section: 'The hypotenuse'
        say: 'Find the hypotenuse by Pythagoras, so hyp squared equals opp squared plus adj squared.'
        write: '$\text{hyp}^{2} = (m^{2} - n^{2})^{2} + (2mn)^{2}$'
        point:
          - {figure: sketch, kind: highlight, target: AC, text: 'hyp = ?'}
      - say: 'Expand the first bracket to get $m$ to the power 4, minus 2$m$ squared $n$ squared, plus $n$ to the power 4. And 2$mn$ squared is 4$m$ squared $n$ squared.'
        write: '$= m^{4} - 2m^{2}n^{2} + n^{4} + 4m^{2}n^{2}$'
      - say: 'Collect the middle terms, and minus 2 plus 4 is plus 2.'
        write: '$= m^{4} + 2m^{2}n^{2} + n^{4}$'
      - say: 'That is a perfect square, which is $m$ squared plus $n$ squared, all squared.'
        write: '$= (m^{2} + n^{2})^{2}$'
      - say: 'Take the square root. The hypotenuse is $m$ squared plus $n$ squared.'
        write: '$\text{hyp} = m^{2} + n^{2}$'
        point:
          - {figure: sketch, kind: label, target: '?', text: 'm² + n²'}
      - section: 'sec θ'
        say: 'Sec is 1 over cos. Cos is CAH, adjacent over hypotenuse, so sec is hypotenuse over adjacent.'
        write: '$\sec\theta = \dfrac{1}{\cos\theta} = \dfrac{\text{hyp}}{\text{adj}}$'
      - say: 'Substitute the hypotenuse and the adjacent side.'
        write: '$\sec\theta = \dfrac{m^{2} + n^{2}}{2mn}$'
      - section: 'Check'
        say: 'Check with $m$ equal to 2 and $n$ equal to 1. Then tan theta is 3 over 4, which is the 3, 4, 5 triangle. So sec theta is hyp over adj, which is 5 over 4.'
        write: 'Check $m = 2,\ n = 1$: $\tan\theta = \dfrac{3}{4}$, $\sec\theta = \dfrac{5}{4}$'
      - say: 'Our formula gives 4 plus 1, over 4, which is 5 over 4. It agrees.'
        write: '$\dfrac{2^{2} + 1^{2}}{2(2)(1)} = \dfrac{5}{4}\ \checkmark$'
      - section: 'Answer'
        say: 'So sec theta is $m$ squared plus $n$ squared, over 2$mn$, which is answer choice B.'
        write: '$\therefore \sec\theta = \dfrac{m^{2} + n^{2}}{2mn}$'
        answer: true
    traps:
      A: 'You went for hypotenuse over opposite. That is cosec theta, 1 over sin. Sec goes with cos, so it is hypotenuse over adjacent, over 2$mn$.'
      C: 'You went for $mn$ over 2 times $m$ squared minus $n$ squared. That never finds the hypotenuse. Pythagoras gives $m$ squared plus $n$ squared, and sec is that over 2$mn$.'
      D: 'You went for $m$ squared $n$ squared over $m$ squared minus $n$ squared. Sec is hypotenuse over adjacent, which is $m$ squared plus $n$ squared, over 2$mn$.'
  40:
    moments:
      - section: 'The question'
        say: 'From two points $X$ and $Y$, 8 metres apart in line with a pole, the angles of elevation of the top are 30 degrees and 60 degrees. We want the height of the pole.'
        write: '$XY = 8$ m; elevations $30^{\circ}$ (from $X$), $60^{\circ}$ (from $Y$)'
      - section: 'Solution'
        say: 'Solution. Let me draw the pole $AB$ and the nearer point $Y$. The steeper angle, 60 degrees, belongs to the nearer point.'
        write: 'Solution: $\angle AYB = 60^{\circ}$, $\angle ABY = 90^{\circ}$'
        show_sketch: true
        'on': 'draw the pole'
        point:
          - {figure: sketch, kind: arc, target: AYB, text: '60°'}
      - say: 'There are two unknowns, so we name them. Let $h$ be the height of the pole, and $d$ the distance from $Y$ to its foot $B$.'
        write: 'Let $AB = h$ m and $YB = d$ m'
        point:
          - {figure: sketch, kind: circle, target: h}
          - {figure: sketch, kind: circle, target: d}
      - section: 'From Y'
        say: 'From 60 degrees, $h$ is opposite and $d$ is adjacent. Opposite and adjacent means TOA, so tangent.'
        write: '$\tan 60^{\circ} = \dfrac{\text{opp}}{\text{adj}} = \dfrac{h}{d}$ (TOA)'
        point:
          - {figure: sketch, kind: highlight, target: AB, text: 'opp'}
          - {figure: sketch, kind: underline, target: YB, text: 'adj'}
      - say: 'Tan 60 degrees is root 3. Cross-multiply, and $h$ equals $d$ root 3. Call this equation 1.'
        write: '$\sqrt{3} = \dfrac{h}{d} \Rightarrow h = d\sqrt{3}$ ... (1)'
      - section: 'From X'
        say: '$X$ is 8 metres farther back. Let me add it to the sketch. Its distance to the foot is $d$ plus 8.'
        write: '$\angle AXB = 30^{\circ}$, $XB = d + 8$'
        show_sketch: sketch_b
        'on': 'add it'
        point:
          - {figure: sketch_b, kind: highlight, target: '8 m', text: 'XY'}
          - {figure: sketch_b, kind: arc, target: AXB, text: '30°'}
      - say: 'TOA again, from 30 degrees, gives $h$ over $d$ plus 8.'
        write: '$\tan 30^{\circ} = \dfrac{h}{d + 8}$ (TOA)'
        point:
          - {figure: sketch_b, kind: underline, target: XB, text: 'd + 8'}
      - say: 'Tan 30 degrees is 1 over root 3. Cross-multiply, and $h$ equals $d$ plus 8, over root 3. Call this equation 2.'
        write: '$\dfrac{1}{\sqrt{3}} = \dfrac{h}{d + 8} \Rightarrow h = \dfrac{d + 8}{\sqrt{3}}$ ... (2)'
      - section: 'Solve for d'
        say: 'Both equations give the same height, so we equate equation 1 and equation 2.'
        write: '(1) $=$ (2): $d\sqrt{3} = \dfrac{d + 8}{\sqrt{3}}$'
        point:
          - {figure: sketch_b, kind: circle, target: h, text: 'the same h'}
      - say: 'Multiply both sides by root 3. Root 3 times root 3 is 3.'
        write: '$3d = d + 8$'
      - say: 'Subtract $d$ from both sides, and $3d$ minus $d$ is $2d$.'
        write: '$2d = 8$'
      - say: 'Divide both sides by 2.'
        write: '$d = 4$ m'
      - section: 'The height'
        say: 'Substitute $d$ equals 4 into equation 1.'
        write: 'From (1): $h = 4\sqrt{3}$'
        point:
          - {line: 12, kind: move, from: {line: 11, at: 'd=4m'}, at: '=[[4]]3', text: 'd = 4'}
      - say: 'Therefore the height of the pole is 4 root 3 metres, which is about 6.93 metres.'
        write: '$\therefore h = 4\sqrt{3}$ m'
        point:
          - {figure: sketch_b, kind: label, target: AB, text: '4√3 m'}
      - section: 'Check'
        say: 'Check with equation 2. $d$ plus 8 is 12. Rationalise 12 over root 3, and it is 12 root 3 over 3, which is 4 root 3. Both agree.'
        write: 'Check (2): $\dfrac{4 + 8}{\sqrt{3}} = \dfrac{12\sqrt{3}}{3} = 4\sqrt{3}\ \checkmark$'
      - section: 'Answer'
        say: 'So the pole is 4 root 3 metres high, which is answer choice C.'
        write: '$\therefore$ Height $= 4\sqrt{3}$ m'
        answer: true
    traps:
      A: 'You went for 4 m. That is $d$, the distance from $Y$ to the foot of the pole. The height comes from equation 1, where $h$ equals $d$ root 3, which is 4 root 3 metres.'
      B: 'You went for 8 root 3 over 3 m. That is 8 times tan 30 degrees, which treats the 8 metres as the distance from $X$ to the foot. $X$ is $d$ plus 8, 12 metres away, and 12 over root 3 is 4 root 3.'
      D: 'You went for 8 root 3 m. That treats the 8 metres as the distance from $Y$ to the pole. The 8 metres is between $X$ and $Y$. The distance from $Y$ is $d$, which is 4 metres, so the height is 4 root 3.'
  41:
    moments:
      - section: 'The question'
        say: 'A room is 12 metres long, 9 metres wide and 8 metres high. We want the cosine of the angle a diagonal of the room makes with the floor.'
        write: 'Room $12$ m $\times\ 9$ m $\times\ 8$ m; $\cos(\text{diagonal to floor})$'
      - section: 'Solution'
        say: 'Solution. Let me draw the room as a cuboid, with the length, width and height on it.'
        write: 'Solution: cuboid, $12$ m long, $9$ m wide, $8$ m high'
        show_sketch: true
        'on': 'draw the room'
        point:
          - {figure: sketch, kind: circle, target: '12 m', text: 'long'}
          - {figure: sketch, kind: circle, target: '9 m', text: 'wide'}
          - {figure: sketch, kind: circle, target: '8 m', text: 'high'}
      - say: 'The room diagonal $BH$ runs from a floor corner to the opposite top corner. Its angle with the floor is the angle it makes with the floor diagonal $BD$ just under it. Let that be theta.'
        write: 'Let $\theta = \angle HBD$ (between $BH$ and the floor)'
        show_sketch: sketch_b
        'on': 'floor diagonal'
        point:
          - {figure: sketch_b, kind: highlight, target: BH, text: 'room diagonal'}
          - {figure: sketch_b, kind: underline, target: BD, text: 'floor diagonal'}
          - {figure: sketch_b, kind: circle, target: θ}
      - section: 'The floor diagonal'
        say: 'The floor is a 12 by 9 rectangle. Its corners are right angles, so the floor diagonal $BD$ is a hypotenuse, and we use Pythagoras.'
        write: '$BD^{2} = BC^{2} + CD^{2}$ (Pythagoras)'
        point:
          - {figure: sketch_b, kind: highlight, target: BC, text: '9'}
          - {figure: sketch_b, kind: highlight, target: CD, text: '12'}
      - say: 'Substitute. 9 squared is 81, and 12 squared is 144. Together they make 225.'
        write: '$= 9^{2} + 12^{2} = 81 + 144 = 225$'
      - say: '15 times 15 is 225, so the floor diagonal is 15 metres.'
        write: '$BD = \sqrt{225} = 15$ m'
        point:
          - {figure: sketch_b, kind: label, target: BD, text: '15 m'}
      - section: 'The room diagonal'
        say: 'We re-draw triangle $HBD$ on its own. The wall edge $DH$ stands straight up from the floor, so the right angle is at $D$.'
        write: '$\triangle HBD$: $\angle BDH = 90^{\circ}$, $DH = 8$ m'
        show_sketch: sketch_c
        'on': 're-draw'
        point:
          - {figure: sketch_c, kind: arc, target: BDH, text: '90°'}
          - {figure: sketch_c, kind: highlight, target: DH, text: '8'}
      - say: 'Pythagoras again, so $BH$ squared is $BD$ squared plus $DH$ squared.'
        write: '$BH^{2} = BD^{2} + DH^{2}$ (Pythagoras)'
      - say: 'Substitute. 15 squared is 225, and 8 squared is 64. Together they make 289.'
        write: '$= 15^{2} + 8^{2} = 225 + 64 = 289$'
        point:
          - {line: 8, kind: move, from: {line: 5, at: '=15m'}, at: '=[[15]]2', text: 'BD'}
      - say: '17 times 17 is 289, so the room diagonal is 17 metres.'
        write: '$BH = \sqrt{289} = 17$ m'
        point:
          - {figure: sketch_c, kind: label, target: BH, text: '17 m'}
      - section: 'The cosine'
        say: 'From theta, $BD$ lies along the floor next to it, so it is the adjacent. $BH$ is the hypotenuse. Adjacent and hypotenuse means CAH, so cosine.'
        write: '$\cos\theta = \dfrac{\text{adj}}{\text{hyp}} = \dfrac{BD}{BH}$ (CAH)'
        point:
          - {figure: sketch_c, kind: arc, target: HBD, text: 'θ'}
      - say: 'Substitute 15 and 17.'
        write: '$\cos\theta = \dfrac{15}{17}$'
      - say: 'Therefore the cosine of the angle is 15 over 17.'
        write: '$\therefore \cos\theta = \dfrac{15}{17}$'
      - section: 'Check'
        say: 'Check. Sine theta is opposite over hypotenuse, which is 8 over 17. Sine squared plus cosine squared must be 1, and 64 plus 225 is 289, over 289.'
        write: 'Check: $\left(\dfrac{8}{17}\right)^{2} + \left(\dfrac{15}{17}\right)^{2} = \dfrac{64 + 225}{289} = 1\ \checkmark$'
      - section: 'Answer'
        say: 'So the cosine is 15 over 17, which is answer choice A.'
        write: '$\therefore \cos\theta = \dfrac{15}{17}$'
        answer: true
    traps:
      B: 'You went for 8 over 17. That is the height over the diagonal, which is opposite over hypotenuse, the sine. Cosine uses the side along the floor, 15, so it is 15 over 17.'
      C: 'You went for 8 over 15. That is the height over the floor diagonal, which is opposite over adjacent, the tangent. Cosine is adjacent over hypotenuse, which is 15 over 17.'
      D: 'You went for 12 over 17. The side next to the angle is not the room length, 12. It is the floor diagonal $BD$, 15. So the cosine is 15 over 17.'
  42:
    moments:
      - section: 'The question'
        say: 'Circles of latitude run round the earth, parallel to the equator, and they get smaller towards the poles. How long is the one at latitude theta?'
        write: 'Find the circumference of the circle of latitude $\theta$.'
      - say: 'Write Solution, then sketch a slice through the centre O of the earth, with the equator through B, a point A on latitude theta, and C, the centre of its small circle.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: arc, target: BOA, text: 'θ', 'on': 'latitude theta'}
          - {figure: sketch, kind: circle, target: C, text: 'centre of small circle', 'on': 'and C'}
      - section: 'What we know'
        say: 'List the givens. The radius of the earth is R, and the latitude is theta. Let the radius of the circle of latitude be r.'
        write: '$|OA| = R$, latitude $= \theta$; let $|CA| = r$'
        point:
          - {figure: sketch, kind: highlight, target: OA, text: 'R', 'on': 'radius of the earth'}
          - {figure: sketch, kind: highlight, target: CA, text: 'r', 'on': 'Let the radius'}
      - section: 'Find r'
        say: 'CA is parallel to the equator OB, so the angle OAC equals the angle AOB, which is theta. The reason is alternate angles.'
        write: '$\angle OAC = \angle AOB = \theta$ (alt. $\angle$s, $CA \parallel OB$)'
        point:
          - {figure: sketch, kind: arc, target: OAC, text: 'θ', 'on': 'angle OAC'}
      - say: 'Triangle OCA is right-angled at C. From the angle theta at A, CA is the adjacent side and OA is the hypotenuse. By SOH CAH TOA, that is CAH, so cos.'
        write: '$\cos\theta = \dfrac{\text{adj}}{\text{hyp}} = \dfrac{r}{R}$'
      - say: 'Multiply both sides by R.'
        write: '$r = R\cos\theta$'
      - section: 'The circumference'
        say: 'The circumference of a circle is 2 pi times its radius.'
        write: 'Circumference $= 2\pi r$'
      - say: 'Substitute r equals R cos theta.'
        write: '$= 2\pi R\cos\theta$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '= [[Rcosθ]]'}, at: 'Rcosθ', text: 'r', 'on': 'Substitute'}
      - say: 'Therefore the circumference of the circle of latitude theta is 2 pi R cos theta.'
        write: '$\therefore$ circumference $= 2\pi R\cos\theta$'
      - section: 'Check'
        say: 'To check, at the equator theta is 0, cos 0 is 1, and we get 2 pi R, the full way round. At a pole theta is 90 degrees, cos 90 is 0, and the circle shrinks to a point.'
        write: 'Check: $\theta = 0^{\circ} \Rightarrow 2\pi R$; $\theta = 90^{\circ} \Rightarrow 0$ ✓'
        point:
          - {figure: sketch, kind: circle, target: 'N', text: 'pole: a point', 'on': 'At a pole'}
      - section: 'Answer'
        say: 'So the circumference is 2 pi R cos theta, which is answer choice B.'
        write: '$\therefore$ circumference $= 2\pi R\cos\theta$ (B)'
        answer: true
    traps:
      A: 'You went for R cos theta. That is the radius of the circle of latitude. The circumference is 2 pi times the radius, which is 2 pi R cos theta.'
      C: 'You went for R sin theta. That uses sine where the adjacent side needs cos, and it is a radius, not a circumference. The answer is 2 pi R cos theta.'
      D: 'You went for 2 pi R sin theta. At the equator, sin 0 is 0, which would give the equator no length at all. The radius uses cos, so it is 2 pi R cos theta.'
  43:
    moments:
      - section: 'The question'
        say: 'Think of a tent shaped like a pyramid, with a square floor 8 cm a side, and four equal poles from the corners to the top. How tall is the tent?'
        write: 'Find the height of the pyramid.'
      - say: 'Write Solution, then sketch the pyramid VABCD on its square base, with the slant edge VC marked.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: highlight, target: VC, text: 'slant edge', 'on': 'slant edge VC'}
      - section: 'What we know'
        say: 'List the givens. The base side is 8 cm, and each slant edge is 4 root 3 cm.'
        write: '$|AB| = |BC| = 8$ cm, $|VC| = 4\sqrt{3}$ cm'
      - say: 'Drop the height from V straight down to O, the centre of the base, and join O to the corner C. Let the height VO be h.'
        write: 'Let $|VO| = h$'
        show_sketch: sketch_b
        point:
          - {figure: sketch_b, kind: underline, target: VO, text: 'h', 'on': 'height VO'}
          - {figure: sketch_b, kind: highlight, target: OC, text: 'centre to corner', 'on': 'join O'}
      - section: 'The diagonal'
        say: 'First, the diagonal AC. Triangle ABC is right-angled at B, so by Pythagoras, AC squared is 8 squared plus 8 squared.'
        write: '$|AC|^{2} = 8^{2} + 8^{2} = 128$ (Pythagoras)'
        point:
          - {figure: sketch_b, kind: underline, target: AC, text: 'diagonal', 'on': 'the diagonal AC'}
      - say: '128 is 64 times 2, so AC is the square root of 64 times root 2, which is 8 root 2.'
        write: '$|AC| = \sqrt{64 \times 2} = 8\sqrt{2}$ cm'
      - say: 'The diagonals of a square bisect each other at O, so OC is half of AC.'
        write: '$|OC| = \tfrac{1}{2} \times 8\sqrt{2} = 4\sqrt{2}$ cm (diagonals bisect)'
      - section: 'The height'
        say: 'Triangle VOC is right-angled at O. The slant edge VC is the hypotenuse, so by Pythagoras, VC squared equals VO squared plus OC squared.'
        write: '$|VC|^{2} = |VO|^{2} + |OC|^{2}$ (Pythagoras)'
      - say: 'Substitute, so 4 root 3, all squared, equals h squared plus 4 root 2, all squared.'
        write: '$(4\sqrt{3})^{2} = h^{2} + (4\sqrt{2})^{2}$'
        point:
          - {line: 8, kind: move, from: {line: 6, at: '= [[42]]cm'}, at: '(42)', text: 'OC', 'on': '4 root 2'}
      - say: '4 root 3 squared is 16 times 3, which is 48. 4 root 2 squared is 16 times 2, which is 32.'
        write: '$48 = h^{2} + 32$'
      - say: 'Subtract 32 from both sides, and h squared is 16.'
        write: '$h^{2} = 48 - 32 = 16$'
      - say: 'The square root of 16 is 4. Therefore the height is 4 centimetres.'
        write: '$\therefore h = \sqrt{16} = 4$ cm'
        point:
          - {figure: sketch_b, kind: label, target: VO, text: '4 cm', 'on': 'Therefore'}
      - section: 'Check'
        say: 'To check, put h equals 4 back. 4 squared plus 32 is 16 plus 32, which is 48, and 4 root 3 squared is 48.'
        write: 'Check: $4^{2} + 32 = 48 = (4\sqrt{3})^{2}$ ✓'
      - section: 'Answer'
        say: 'So the height is 4 centimetres, which is answer choice C.'
        write: '$\therefore h = 4$ cm (C)'
        answer: true
    traps:
      A: 'You went for 6 cm. Then the slant edge squared would be 36 plus 32, which is 68, not 48. h squared is 48 minus 32, which is 16, so h is 4.'
      B: 'You went for 5 cm. That would need h squared to be 25, but 48 minus 32 is 16. The height is 4 cm.'
      D: 'You went for 3 cm. That would need h squared to be 9. The edge squared is 48 and OC squared is 32, so h squared is 16 and h is 4.'
  44:
    moments:
      - section: 'The question'
        say: 'To name a construction, read its steps in order, from the first arc. The first step tells you what was given.'
        write: 'Name the construction in the figure'
        point:
          - {figure: 0, kind: circle, target: P, text: 'start here'}
      - section: 'Solution'
        say: 'Solution. We write out the steps the way you write a construction, with ruler and compasses only, and every arc left showing.'
        write: 'Solution. The steps:'
      - say: 'Step 1. The compass point goes on $P$, a point above the line. One arc cuts the line at two points, $Q$ and $R$.'
        write: '1. With centre $P$, draw an arc to cut the line at $Q$ and $R$'
        point:
          - {figure: 0, kind: circle, target: Q}
          - {figure: 0, kind: circle, target: R}
      - say: 'Step 2. With centre $Q$, then centre $R$, and the same radius, draw two arcs below the line. They meet at $X$.'
        write: '2. With centres $Q$ and $R$, same radius, draw arcs to meet at $X$'
        point:
          - {figure: 0, kind: circle, target: X}
      - say: 'Step 3. Join $P$ to $X$ with the ruler.'
        write: '3. Join $PX$'
        point:
          - {figure: 0, kind: highlight, target: PX}
      - say: 'Why it works. $Q$ and $R$ are on one arc from $P$, so $PQ$ equals $PR$, because they are radii of the same arc.'
        write: '$PQ = PR$ (radii of same arc)'
        point:
          - {figure: 0, kind: highlight, target: PQ}
          - {figure: 0, kind: highlight, target: PR}
      - say: 'The two arcs from $Q$ and $R$ have the same radius, so $XQ$ equals $XR$, because the arcs are equal.'
        write: '$XQ = XR$ (equal arcs)'
        point:
          - {figure: 0, kind: highlight, target: XQ}
          - {figure: 0, kind: highlight, target: XR}
      - say: '$P$ and $X$ are each the same distance from $Q$ and $R$, so both lie on the perpendicular bisector of $QR$. So $PX$ meets the line at 90 degrees.'
        write: '$PX \perp QR$ ($P$, $X$ equidistant from $Q$, $R$)'
        point:
          - {figure: 0, kind: highlight, target: PX, text: '⊥ the line'}
      - say: 'What was given at the start? Only the line and the point $P$ off it. $Q$, $R$ and $X$ were made by the steps.'
        write: 'Given: the line, and the point $P$ off it'
        point:
          - {figure: 0, kind: circle, target: P, text: 'given point'}
      - section: 'Check'
        say: 'Check the other names. It is not a perpendicular bisector of a given line, because $Q$ and $R$ were made in step 1, not given. It is not from a point on the line, because $P$ is off it.'
        write: 'Not A: $Q$, $R$ made in step 1. Not C: $P$ is off the line.'
      - say: 'Therefore the figure is the construction of the perpendicular from a given point to a given line, which is option B.'
        write: '$\therefore$ perpendicular from a given point to a given line (B)'
        answer: true
        point:
          - {figure: 0, kind: highlight, target: PX, text: 'the perpendicular'}
    traps:
      A: 'You went for the perpendicular bisector of a given line. $PX$ does bisect $QR$, but $Q$ and $R$ were made in step 1. What was given was the point $P$ off the line, so this is the perpendicular from $P$ to the line.'
      C: 'You went for a perpendicular from a point on the line. Here $P$ is off the line, above it, so it is the perpendicular from a given point to a given line.'
      D: 'You went for a given angle. No angle is copied here. The arc from $P$, then the arcs from $Q$ and $R$, build a line from $P$ at 90 degrees to the given line.'
  45:
    moments:
      - section: 'The question'
        say: 'Chords 6 centimetres long are drawn in a circle of radius 5 centimetres, centre $O$. Where do all their midpoints lie? That path is the locus.'
        write: 'Chord $= 6$ cm, $r = 5$ cm, centre $O$; locus of midpoints $= ?$'
      - section: 'Solution'
        say: 'Solution. Let me draw the circle, radius 5 centimetres, with one chord $AB$ 6 centimetres long.'
        show_sketch: true
        write: 'Solution: $|AB| = 6$ cm, $|OB| = r = 5$ cm'
        point:
          - {figure: sketch, kind: circle, target: O, text: 'centre'}
          - {figure: sketch, kind: highlight, target: AB, text: 'chord 6 cm'}
      - say: 'Let $M$ be the midpoint of $AB$. Join $O$ to $M$. The line from the centre to the midpoint of a chord is perpendicular to the chord.'
        show_sketch: sketch_b
        write: 'Let $M$ be the midpoint of $AB$: $OM \perp AB$ (line from centre to mid-pt of chord)'
        point:
          - {figure: sketch_b, kind: circle, target: M, text: 'midpoint'}
          - {figure: sketch_b, kind: arc, target: OMB, text: '90°'}
      - say: '$M$ cuts the chord in half. Half of 6 is 3 centimetres.'
        write: '$|MB| = \tfrac{1}{2} \times 6 = 3$ cm'
        point:
          - {figure: sketch_b, kind: highlight, target: MB, text: '3'}
      - say: 'Triangle $OMB$ is right-angled at $M$, with the radius $OB$ as hypotenuse. Pythagoras says the hypotenuse squared equals the sum of the squares on the other two sides.'
        write: 'In $\triangle OMB$: $|OB|^{2} = |OM|^{2} + |MB|^{2}$ (Pythagoras)'
        point:
          - {figure: sketch_b, kind: highlight, target: OB, text: 'hyp. 5'}
      - say: 'Substitute, so 5 squared equals $OM$ squared plus 3 squared.'
        write: '$5^{2} = |OM|^{2} + 3^{2}$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '= 3 cm'}, at: '+ [[3]]2', text: 'MB'}
      - say: '5 squared is 25, and 3 squared is 9.'
        write: '$25 = |OM|^{2} + 9$'
      - say: 'Subtract 9 from both sides. 25 minus 9 is 16.'
        write: '$|OM|^{2} = 25 - 9 = 16$'
      - say: 'Take the square root. The square root of 16 is 4.'
        write: '$|OM| = \sqrt{16} = 4$ cm'
        point:
          - {figure: sketch_b, kind: circle, target: '4 cm', text: 'OM'}
      - say: 'Every chord of length 6 gives the same triangle, however it is turned. So every midpoint is 4 centimetres from the fixed point $O$.'
        show_sketch: sketch_c
        write: 'Every midpoint is 4 cm from $O$'
        point:
          - {figure: sketch_c, kind: circle, target: 'locus of M', text: 'every midpoint'}
      - say: 'The standard locus says a fixed distance from a fixed point is a circle, with centre $O$ and radius 4 centimetres.'
        write: 'Fixed distance from a fixed point $\Rightarrow$ circle'
      - section: 'Check'
        say: 'To check, 3, 4 and 5 make a right-angled triangle, because 9 plus 16 is 25.'
        write: 'Check: $3^{2} + 4^{2} = 9 + 16 = 25 = 5^{2}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the locus is a circle of radius 4 centimetres with centre $O$, which is option A.'
        write: '$\therefore$ locus: a circle, centre $O$, radius 4 cm'
        answer: true
        point:
          - {figure: sketch_c, kind: underline, target: 'locus of M'}
    traps:
      B: 'You went for the perpendicular bisector of the chords. Each chord has its own perpendicular bisector through $O$, but the midpoints of all the chords are 4 cm from $O$, so they lie on a circle.'
      C: 'You went for a straight line through $O$. That is where the midpoints of PARALLEL chords lie. Here the chords point every way, and their midpoints are all 4 cm from $O$, on a circle.'
      D: 'You went for a circle of radius 6 cm. That is bigger than the circle itself, radius 5. By Pythagoras, $|OM|^{2} = 25 - 9 = 16$, so the midpoints are 4 cm from $O$.'
  46:
    moments:
      - section: 'The question'
        say: 'Daylight lasts from 5.30 a.m. to 7.00 p.m. On a pie chart of one day, we want the angles for daylight and for darkness.'
        write: 'Daylight: 5.30 a.m. to 7.00 p.m. Find the two sectoral angles.'
      - section: 'Solution'
        say: 'Solution. The whole day is 24 hours, and the whole circle is 360 degrees. So each sectoral angle is the hours over 24, times 360 degrees.'
        write: 'Sectoral angle $= \dfrac{\text{hours}}{24} \times 360^{\circ}$'
      - section: 'The hours'
        say: 'Count the daylight hours, splitting at noon. From 5.30 a.m. to 12 noon is 6 and a half hours.'
        write: '5.30 a.m. to noon $= 6\tfrac{1}{2}$ h'
      - say: 'Then down to sunset. From noon to 7 p.m. is 7 hours. 6 and a half plus 7 is 13 and a half hours of daylight.'
        write: 'Daylight $= 6\tfrac{1}{2} + 7 = 13\tfrac{1}{2}$ h'
      - say: 'Darkness is the rest of the 24 hours. 24 minus 13 and a half is 10 and a half hours.'
        write: 'Darkness $= 24 - 13\tfrac{1}{2} = 10\tfrac{1}{2}$ h'
        diagram: {id: t, kind: table, columns: [Period, 'Hours', 'Sectoral angle'], rows: [[Daylight, 13.5, ''], [Darkness, 10.5, '']]}
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': 'rest of the 24 hours'}
      - section: 'The angles'
        say: 'Daylight is 13 and a half over 24, times 360. 360 divided by 24 is 15, so it is 13.5 times 15.'
        write: 'Daylight $= \dfrac{13.5}{24} \times 360^{\circ} = 13.5 \times 15^{\circ}$'
      - say: '13 times 15 is 195, and half of 15 is 7.5. 195 plus 7.5 is 202.5 degrees.'
        write: '$= 195^{\circ} + 7.5^{\circ} = 202.5^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,3', text: '202.5°', 'on': '202.5 degrees'}
      - say: 'A degree has 60 minutes, so half a degree is 30 minutes. 202.5 degrees is 202 degrees 30 minutes.'
        write: '$202.5^{\circ} = 202^{\circ}30^{\prime}$'
      - say: 'Darkness is 10.5 times 15. 10 times 15 is 150, plus 7.5 is 157.5 degrees, which is 157 degrees 30 minutes.'
        write: 'Darkness $= 10.5 \times 15^{\circ} = 157.5^{\circ} = 157^{\circ}30^{\prime}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:2,3', text: '157.5°', 'on': '157.5 degrees'}
      - section: 'Check'
        say: 'To check, 202.5 plus 157.5 is 360 degrees, the whole circle.'
        write: '$202.5^{\circ} + 157.5^{\circ} = 360^{\circ}\ \checkmark$'
        diagram: {id: p, kind: pie, show: angle, sectors: [{label: Daylight, value: 13.5, colour: yellow}, {label: Darkness, value: 10.5, colour: purple}]}
      - section: 'Answer'
        say: 'Therefore daylight is 202 degrees 30 minutes and darkness is 157 degrees 30 minutes, which is answer choice C.'
        write: '$\therefore 202^{\circ}30^{\prime}$ and $157^{\circ}30^{\prime}$'
        answer: true
    traps:
      A: 'You went for 187 degrees 30 minutes and 172 degrees 30 minutes. That is 12 and a half hours of daylight. Split at noon, and 6 and a half plus 7 is 13 and a half hours.'
      B: 'You went for 135 and 225 degrees. That is only 9 hours of daylight. From 5.30 a.m. to 7 p.m. is 13 and a half hours, which gives 202 degrees 30 minutes.'
      D: 'You went for 195 and 165 degrees. That is 13 hours of daylight, missing the half hour from 5.30 to 6. With 13 and a half hours, the angle is 202 degrees 30 minutes.'
  47:
    moments:
      - section: 'The question'
        say: 'A table shows how many goals 40 teams scored. We want the total number of goals scored by all the teams.'
        write: 'Total number of goals $= ?$'
      - section: 'Solution'
        say: 'Solution. Draw the frequency table with goals x, frequency f, and a column f x. 15 teams scored 2 goals each, so together they scored 2 times 15 goals.'
        write: 'Total goals $= \Sigma fx$'
        diagram: {id: t, kind: table, columns: ['Goals (x)', 'Teams (f)', 'fx'], rows: [[0, 4, ''], [1, 3, ''], [2, 15, ''], [3, 16, ''], [4, 1, ''], [5, 0, ''], [6, 1, '']]}
      - say: 'Multiply each x by its f. 0 times 4 is 0. 1 times 3 is 3. 2 times 15 is 30.'
        write: '$0 \times 4 = 0,\ \ 1 \times 3 = 3,\ \ 2 \times 15 = 30$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,3', text: '0', 'on': 'is 0'}
          - {id: t, op: fill, part: 'cell:2,3', text: '3', 'on': 'is 3'}
          - {id: t, op: fill, part: 'cell:3,3', text: '30', 'on': 'is 30'}
      - say: '3 times 16 is 48. 4 times 1 is 4.'
        write: '$3 \times 16 = 48,\ \ 4 \times 1 = 4$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,3', text: '48', 'on': 'is 48'}
          - {id: t, op: fill, part: 'cell:5,3', text: '4', 'on': 'is 4'}
      - say: '5 times 0 is 0. 6 times 1 is 6.'
        write: '$5 \times 0 = 0,\ \ 6 \times 1 = 6$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:6,3', text: '0', 'on': 'is 0'}
          - {id: t, op: fill, part: 'cell:7,3', text: '6', 'on': 'is 6'}
      - section: 'Add the fx column'
        say: 'Now add the fx column. 0 plus 3 plus 30 is 33, plus 48 is 81, plus 4 is 85, plus 0 is 85, plus 6 is 91.'
        write: '$\Sigma fx = 0 + 3 + 30 + 48 + 4 + 0 + 6 = 91$'
        diagram_do:
          - {id: t, op: total, part: 'col:3', 'on': '91'}
      - section: 'Check'
        say: 'Check the f column. 4 plus 3 plus 15 plus 16 plus 1 plus 0 plus 1 is 40, the number of teams in the question.'
        write: '$\Sigma f = 4 + 3 + 15 + 16 + 1 + 0 + 1 = 40\ \checkmark$'
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': '40'}
      - section: 'Answer'
        say: 'Therefore the teams scored 91 goals in total, which is answer choice C.'
        write: '$\therefore$ total goals $= 91$'
        answer: true
    traps:
      A: 'You went for 21. That is 0 plus 1 plus 2, up to 6, the x column added alone. Each x must be multiplied by its f and then added, and sigma f x is 91.'
      B: 'You went for 40. That is sigma f, the number of teams. The goals are sigma f x, which is 91.'
      D: 'You went for 96. Check the fx column. 0, 3, 30, 48, 4, 0 and 6 add up to 91.'
  48:
    moments:
      - section: 'The question'
        say: 'There are eight marks, 3, 2, 8, 5, 7, 12, 9 and 14. $P$ is the mean and $Q$ is the median. We want $P$ plus $Q$. Picture the eight marks as bars.'
        write: 'Data: $3,\ 2,\ 8,\ 5,\ 7,\ 12,\ 9,\ 14$'
        doodle: {name: 'custom:1987_q48_a', id: bars, caption: 'eight marks as bars', size: scene, 'on': 'bars'}
      - section: 'Solution'
        say: 'Solution. First the mean. The mean, $x$ bar, is the sum of $x$ over $n$, the number of values.'
        write: 'Solution. $P = \bar{x} = \dfrac{\sum x}{n}$'
      - say: 'Add the marks. 3 plus 2 is 5, plus 8 is 13, plus 5 is 18, plus 7 is 25, plus 12 is 37, plus 9 is 46, plus 14 is 60. And there are 8 marks.'
        write: '$\sum x = 60$, $\ n = 8$'
      - say: 'Substitute, and we get 60 over 8.'
        write: '$P = \dfrac{60}{8}$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '60'}, at: '8[[60]]', text: 'Σx'}
      - say: '60 over 8 is 7.5. Level off the eight bars and they all stand at 7.5.'
        write: '$\therefore P = 7.5$'
        doodle_do:
          - {id: bars, op: stage, stage: 'custom:1987_q48_a2', 'on': 'Level'}
      - section: 'The median'
        say: 'Now the median. Arrange the marks in order of size, so 2, 3, 5, 7, 8, 9, 12, 14. Line the bars up the same way.'
        write: 'In order: $2,\ 3,\ 5,\ 7,\ 8,\ 9,\ 12,\ 14$'
        doodle_do:
          - {id: bars, op: stage, stage: 'custom:1987_q48_a3', 'on': 'Line'}
      - say: '$n$ is 8. The median is the $n$ plus 1 over 2th value, and 9 over 2 is 4 and a half. So it sits halfway between the 4th and the 5th values.'
        write: '$\left(\dfrac{8 + 1}{2}\right)$th $= 4\tfrac{1}{2}$th: between the 4th and 5th values'
      - say: 'Count along, and the 4th value is 7 and the 5th is 8. These are the two middle bars.'
        write: '4th value $= 7$, 5th value $= 8$'
        doodle_do:
          - {id: bars, op: circle, part: mid, text: '4th and 5th'}
        point:
          - {line: 5, kind: circle, at: '7,8', text: 'middle two'}
      - say: 'The median is their average. 7 plus 8 is 15, and 15 over 2 is 7.5.'
        write: '$Q = \dfrac{7 + 8}{2} = \dfrac{15}{2} = 7.5$'
      - say: 'Now add the mean and the median, and 7.5 plus 7.5 is 15.'
        write: '$P + Q = 7.5 + 7.5 = 15$'
        point:
          - {line: 9, kind: move, from: {line: 4, at: '7.5'}, at: '[[7.5]]+7.5', text: 'P'}
          - {line: 9, kind: move, from: {line: 8, at: '=[[7.5]]'}, at: '7.5+[[7.5]]', text: 'Q'}
      - section: 'Check'
        say: 'Check the mean. 8 marks times 7.5 is 60, the sum of the marks.'
        write: 'Check: $8 \times 7.5 = 60$ ✓'
      - section: 'Answer'
        say: 'So $P$ plus $Q$ is 15, which is option D.'
        write: '$\therefore P + Q = 15$'
        answer: true
    traps:
      A: 'You went for 18. Check the mean. The marks add to 60, and 60 over 8 is 7.5. The median, the average of 7 and 8, is also 7.5, so the sum is 15.'
      B: 'You went for 17 and a half. The mean is 60 over 8, which is 7.5, and the median, the average of the 4th and 5th values, 7 and 8, is also 7.5. Together they make 15.'
