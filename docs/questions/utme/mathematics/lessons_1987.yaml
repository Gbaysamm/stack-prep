# UTME 1987 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1987.yaml. Answers match that file.
format_version: 1
exam_year: 1987
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'We change two-four-one base five to base eight. There is no direct road from base five to base eight, so we go through base ten.'
        write: 'Convert $241_{5}$ to base 8.'
      - say: 'First, change two-four-one base five to base ten.'
        write: 'Solution'
      - section: 'Step 1: base 5 to base 10'
        say: 'Write the index numbers over the digits, starting from nought on the right, so nought, one and two.'
        write: '$\overset{2}{2}\,\overset{1}{4}\,\overset{0}{1}_{5}$'
      - say: 'Each digit times five to the power of its index gives two times five squared, plus four times five to the power one, plus one times five to the power nought.'
        write: '$= 2 \times 5^{2} + 4 \times 5^{1} + 1 \times 5^{0}$'
      - say: 'Five squared is 25. Five to the power one is 5. Anything to the power nought is 1.'
        write: '$= 2 \times 25 + 4 \times 5 + 1 \times 1$'
      - say: '2 times 25 is 50. 4 times 5 is 20. 1 times 1 is 1.'
        write: '$= 50 + 20 + 1$'
      - say: '50 plus 20 plus 1 is 71, base ten.'
        write: '$= 71_{10}$'
      - section: 'Step 2: base 10 to base 8'
        say: 'Now divide 71 by 8 again and again, and write the remainders by the side. This is the division ladder.'
        diagram: {id: L, kind: ladder, divisor: 8, number: 71, 'on': 'division ladder'}
      - say: '71 divided by 8 is 8, remainder 7. The remainder is what is left after making bundles of eight.'
        diagram_do:
          - {id: L, op: step, 'on': 'remainder 7'}
        doodle: {name: 'custom:1987_q01_b', id: sticks, caption: '71 = 8 eights and 7 left', 'on': 'bundles of eight'}
      - say: '8 divided by 8 is 1, remainder 0.'
        diagram_do:
          - {id: L, op: step}
      - say: '1 divided by 8 is 0, remainder 1. We stop at 0.'
        diagram_do:
          - {id: L, op: step}
      - say: 'Read the remainders from the bottom up, and we get one, zero, seven. So 71 is one-zero-seven base eight.'
        diagram_do:
          - {id: L, op: read, 'on': 'bottom up'}
        write: '$71_{10} = 107_{8}$'
        point:
          - {line: 11, kind: highlight, at: '1078', to: {diagram: L, part: result}}
      - section: 'Check'
        say: 'Check by expanding back. Write the index numbers over the digits again, two, one and nought. Then each digit times eight to the power of its index.'
        write: '$\overset{2}{1}\,\overset{1}{0}\,\overset{0}{7}_{8} = 1 \times 8^{2} + 0 \times 8^{1} + 7 \times 8^{0}$'
      - say: 'Eight squared is 64, so we get 64 plus 0 plus 7, which is 71. It agrees.'
        write: '$= 64 + 0 + 7 = 71\ \checkmark$'
        point:
          - {line: 13, kind: move, from: {line: 6, at: '7110'}, at: '71', text: 'what we started with'}
      - section: 'Answer'
        say: 'Therefore two-four-one base five is one-zero-seven base eight, which is option B.'
        write: '$\therefore 241_{5} = 107_{8}$'
        answer: true
    traps:
      A: 'You went for seven-one base eight. 71 is the base-ten value, so you stopped halfway. Divide 71 by 8 on the ladder and read the remainders from the bottom up to get one-zero-seven.'
      C: 'You went for one-seven-six base eight. You read the remainders from the top down, or slipped in a division. Read the remainders from the bottom up to get one-zero-seven.'
      D: 'You went for two-four-one base eight. You changed only the label. The digits change when the base changes, and two-four-one base five is 71, which is one-zero-seven base eight.'
  2:
    moments:
      - section: 'The question'
        say: 'One rod must cut exactly into 40 centimetre strips, and also exactly into 48 centimetre strips. We want the least such length.'
        write: 'Strips of $40$ cm or $48$ cm; least length $= ?$'
        doodle: {name: 'custom:1987_q02_a', id: rods, caption: 'Cut into 40 cm or 48 cm strips'}
      - section: 'Solution'
        say: 'Solution. A length that cuts exactly into 40s is a multiple of 40, and into 48s, a multiple of 48. The least common one is the L.C.M., the lowest common multiple.'
        write: 'Solution. Least length $=$ L.C.M. of $40$ and $48$'
      - section: 'The ladder'
        say: 'Find the L.C.M. on the division ladder. Write 40 and 48 side by side, and divide by a prime that goes into them.'
        diagram: {id: L, kind: ladder, mode: lcm, numbers: [40, 48], 'on': 'ladder'}
      - say: '2 goes into both, giving 20 and 24. 2 again gives 10 and 12. And 2 again gives 5 and 6.'
        diagram_do:
          - {id: L, op: step, n: 3, 'on': 'goes into both'}
      - say: 'Now 2 goes into 6 but not 5, so the 5 comes down unchanged, giving 5 and 3. Then 3 gives 5 and 1. Then 5 gives 1 and 1. We stop at all ones.'
        diagram_do:
          - {id: L, op: step, n: 3, 'on': 'unchanged'}
      - say: 'The L.C.M. is the product of all the divisors down the side of the ladder.'
        write: 'L.C.M. $= 2 \times 2 \times 2 \times 2 \times 3 \times 5$'
        diagram_do:
          - {id: L, op: read, 'on': 'product'}
        point:
          - {line: 5, kind: highlight, at: '2×2×2×2×3×5', to: {diagram: L, part: result}}
      - say: 'Write the four 2s as 2 to the power 4.'
        write: '$= 2^{4} \times 3 \times 5$'
      - say: '2 to the 4 is 16, and 3 times 5 is 15. 16 times 15 is 240.'
        write: '$= 16 \times 15 = 240$'
      - section: 'Check'
        say: 'Check. 240 divided by 40 is 6, so the rod cuts into 6 strips of 40 centimetres exactly.'
        write: 'Check: $240 \div 40 = 6$ strips ✓'
        doodle_do: [{id: rods, op: stage, stage: 'custom:1987_q02_a2'}, {id: rods, op: label, part: rod40, text: '6 strips'}]
      - say: 'And 240 divided by 48 is 5, so it cuts into 5 strips of 48 centimetres, with nothing left over.'
        write: '$240 \div 48 = 5$ strips ✓'
        doodle_do: [{id: rods, op: stage, stage: 'custom:1987_q02_a3'}, {id: rods, op: label, part: rod48, text: '5 strips'}]
      - section: 'Answer'
        say: 'Therefore the least length is 240 centimetres, which is answer choice B.'
        write: '$\therefore$ least length $= 240$ cm (B)'
        doodle_do: [{id: rods, op: label, part: len, text: '240 cm'}]
        answer: true
    traps:
      A: 'You went for 120 cm. It divides by 40, but 120 divided by 48 is 2.5, so the 48 centimetre strips would not come out exactly. The L.C.M. of 40 and 48 is 240.'
      C: 'You went for 360 cm. 360 divided by 48 is 7.5, so it does not cut exactly into 48 centimetre strips. The L.C.M. is 240.'
      D: 'You went for 480 cm. It works for both strips, but it is 2 times 240, so it is not the least. The least length is the L.C.M., 240.'
  3:
    moments:
      - section: 'The question'
        say: 'A lawn is measured in two different units, with its area in square yards and its length in metres. Before we divide, everything must be in one unit.'
        write: 'Find the width of the lawn in metres.'
      - say: 'Write Solution, then sketch the rectangle with the length and the area on it.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'Area 1815 yd²', text: 'yards', 'on': 'the area'}
      - section: 'What we know'
        say: 'List the givens. Area A is 1815 square yards, length l is 50 metres, and 1 metre is 1.1 yards. Let the width be w metres.'
        write: '$A = 1815\ \text{yd}^{2}$, $l = 50$ m, $1$ m $= 1.1$ yd; let width $= w$ m'
      - section: 'Convert units'
        say: 'The answer is wanted in metres, so change the area to square metres. 1 metre is 1.1 yards. A metre stick is a little longer than a yard stick.'
        write: '$1$ m $= 1.1$ yd'
      - say: 'A square metre is 1 metre by 1 metre, so it is 1.1 times 1.1, which is 1.21 square yards.'
        write: '$1\ \text{m}^{2} = 1.1 \times 1.1 = 1.21\ \text{yd}^{2}$'
      - say: 'So to change square yards to square metres, divide by 1.21.'
        write: '$A = \dfrac{1815}{1.21}\ \text{m}^{2}$'
      - say: 'Multiply top and bottom by 100 to clear the decimal, and we get 181,500 over 121. 121 times 15 is 1,815, so this is 1,500 square metres.'
        write: '$= \dfrac{181500}{121} = 1500\ \text{m}^{2}$'
      - section: 'The formula'
        say: 'Area of a rectangle is length times width.'
        write: '$A = l \times w$'
      - say: 'Substitute, and 1,500 equals 50 times w.'
        write: '$1500 = 50w$'
        point:
          - {line: 8, kind: move, from: {line: 6, at: '= [[1500]]m'}, at: '1500', text: 'area in m²', 'on': '1,500 equals'}
      - say: 'Divide both sides by 50, and 1,500 over 50 is 30.'
        write: '$w = \dfrac{1500}{50} = 30$'
      - say: 'Therefore the width of the lawn is 30 metres.'
        write: '$\therefore$ width $= 30$ m'
        point:
          - {figure: sketch, kind: label, target: '?', text: '30 m', 'on': 'Therefore'}
      - section: 'Check'
        say: 'Check in yards. 50 metres is 50 times 1.1, which is 55 yards, and 30 metres is 33 yards. 55 times 33 is 1,815. It works.'
        write: 'Check: $55 \times 33 = 1815\ \text{yd}^{2}$ ✓'
        point:
          - {figure: sketch, kind: circle, target: '50 m = 55 yd', 'on': '55 yards'}
      - section: 'Answer'
        say: 'So the width is 30 metres, which is answer choice D.'
        write: '$\therefore$ width $= 30$ m (D)'
        answer: true
    traps:
      A: 'You went for 39.93. That divides 1815 by 50, which gives 36.3, and then multiplies by 1.1, which mixes yards and metres. Change the area to square metres first. 1,815 over 1.21 is 1,500, and 1,500 over 50 is 30.'
      B: 'You went for 35.00. That does not come from the correct division. The area is 1,500 square metres, and 1,500 divided by 50 is 30 metres.'
      C: 'You went for 33.00. That is the width in yards, 1,815 over 55. The question wants metres, and 33 divided by 1.1 is 30.'
  4:
    moments:
      - section: 'The question'
        say: 'Round first, then work it out. If you work it out first and round at the end, you can land on a different option. Let''s follow the order the question gives.'
        write: 'Reduce each number to 2 s.f., then evaluate $\dfrac{0.02174 \times 1.2047}{0.023789}$'
      - say: 'Here is the rule for significant figures. Start counting at the first digit that is not zero, mark a cut after the figures you keep, and look at the next digit.'
        write: 'Solution'
      - say: 'If the next digit is 5 or more, add 1 to the last digit kept. If it is less than 5, leave it.'
        write: 'Next digit $\ge 5$: add 1. Next digit $< 5$: leave it.'
      - section: 'Round each number'
        say: 'In 0.02174, the zeros in front do not count. The first two significant figures are 2 and 1. Cut after the 1. The next digit is 7, so add 1, giving 0.022.'
        write: '$0.021|74 \approx 0.022$'
      - say: 'In 1.2047, the first two significant figures are 1 and 2. The next digit is 0, so leave it, giving 1.2.'
        write: '$1.2|047 \approx 1.2$'
      - say: 'In 0.023789, the significant figures are 2 and 3. The next digit is 7, so add 1, giving 0.024.'
        write: '$0.023|789 \approx 0.024$'
      - section: 'Evaluate'
        say: 'Put the rounded numbers into the expression.'
        write: '$\dfrac{0.022 \times 1.2}{0.024}$'
      - say: 'Clear the decimals by multiplying the numerator and the denominator by 10,000. On top, 0.022 becomes 22 and 1.2 becomes 12. Underneath, 0.024 becomes 240.'
        write: '$= \dfrac{22 \times 12}{240}$'
      - say: 'Cancel first. 12 goes into 240 twenty times. So we have 22 over 20.'
        write: '$= \dfrac{22}{20}$'
      - say: '22 divided by 20 is 1.1.'
        write: '$\therefore$ Value $= 1.1$'
      - section: 'Check'
        say: 'Check by multiplying back. 0.024 times 1.1 is 0.0264, and 0.022 times 1.2 is also 0.0264. They agree.'
        write: 'Check: $0.024 \times 1.1 = 0.0264 = 0.022 \times 1.2 \ \checkmark$'
      - section: 'Answer'
        say: 'So the value is 1.1, which is option C.'
        write: '$\therefore$ Value $= 1.1$'
        answer: true
    traps:
      A: 'You went for 0.8. The numerator, 0.022 times 1.2, is 0.0264, which is bigger than the denominator, 0.024. So the answer must be more than 1, and it is 1.1.'
      B: 'You went for 0.9. That is the fraction upside down, because 0.024 over 0.0264 is about 0.9. Keep the numerator on top, and you get 1.1.'
      D: 'You went for 1.2. That comes from rounding 0.02174 and 0.023789 to 1 significant figure, 0.02 each, so they cancel and leave 1.2. The question says 2 significant figures, and 0.022 and 0.024 give 1.1.'
  5:
    moments:
      - section: 'The question'
        say: 'A train goes from P to Q at 90 kilometres per hour and comes straight back at 45 kilometres per hour. We want the average speed for the entire journey.'
        write: 'Average speed for the entire journey $= ?$'
      - section: 'Solution'
        say: 'Solution. Let me draw the route, P to Q and back, with the two speeds on it.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '90 km/h'}
          - {figure: sketch, kind: circle, target: '45 km/h'}
      - say: 'The distance is not given, so we name it. Let the distance from P to Q be $d$ kilometres.'
        write: 'Let $|PQ| = d$ km'
        point:
          - {figure: sketch, kind: circle, target: 'd km'}
      - say: 'The givens are speed out, 90 kilometres per hour, and speed back, 45 kilometres per hour.'
        write: 'Speed out $= 90$ km/h, speed back $= 45$ km/h'
      - section: 'The times'
        say: 'Time is distance over speed. Going out, $d$ kilometres at 90 takes $d$ over 90 hours.'
        write: 'Time $= \dfrac{\text{distance}}{\text{speed}}$; $\ t_{1} = \dfrac{d}{90}$ h'
      - say: 'Now it crawls back, and $d$ kilometres at 45 takes $d$ over 45 hours.'
        write: '$t_{2} = \dfrac{d}{45}$ h'
      - say: 'The total distance is $d$ out plus $d$ back, which is $2d$.'
        write: 'Total distance $= d + d = 2d$ km'
      - say: 'The total time is $d$ over 90 plus $d$ over 45. The L.C.M. of 90 and 45 is 90.'
        write: 'Total time $= \dfrac{d}{90} + \dfrac{d}{45}$'
      - say: '90 divided by 90 is 1, times $d$ is $d$. 90 divided by 45 is 2, times $d$ is $2d$. So it is $d$ plus $2d$, over 90.'
        write: '$= \dfrac{d + 2d}{90} = \dfrac{3d}{90}$'
      - say: 'Divide the top and the bottom by 3, so the total time is $d$ over 30 hours.'
        write: '$= \dfrac{d}{30}$ h'
      - section: 'Average speed'
        say: 'Average speed is total distance over total time, never the average of the two speeds, because the train spends longer on the slow leg.'
        write: 'Average speed $= \dfrac{\text{total distance}}{\text{total time}}$'
      - say: 'Substitute, and we get $2d$ divided by $d$ over 30.'
        write: '$= 2d \div \dfrac{d}{30}$'
      - say: 'Dividing by a fraction is multiplying by its reciprocal, so $2d$ times 30 over $d$.'
        write: '$= 2d \times \dfrac{30}{d}$'
      - say: 'The $d$ on top cancels the $d$ below, leaving 2 times 30, which is 60.'
        write: '$= 2 \times 30 = 60$'
      - say: 'Therefore the average speed is 60 kilometres per hour.'
        write: '$\therefore$ Average speed $= 60$ km/h'
      - section: 'Check'
        say: 'Check with a real distance, 90 kilometres. Out takes 1 hour and back takes 2 hours, so 180 kilometres in 3 hours, which is 60.'
        write: 'Check: $\dfrac{90 + 90}{1 + 2} = \dfrac{180}{3} = 60$ ✓'
      - section: 'Answer'
        say: 'So the average speed is 60 kilometres per hour, which is option B.'
        write: '$\therefore$ Average speed $= 60.00$ km/h'
        answer: true
    traps:
      A: 'You went for 55 km/h. That is too low. Total distance over total time gives $2d$ over $d$ over 30, which is 60 km/h, or 180 km in 3 hours.'
      C: 'You went for 67.5 km/h. That is 90 plus 45, divided by 2, the plain average of the speeds. The train spends twice as long at the slow speed, so total distance over total time gives 60 km/h.'
      D: 'You went for 75 km/h. That is even higher than the plain average, but the slow return pulls the average down. Total distance over total time gives 60 km/h.'
  6:
    moments:
      - section: 'The question'
        say: 'Stretch one side of a square by 20 percent and squeeze the other by 20 percent. Does the area stay the same? Most people say yes. Let us see.'
        write: 'Find area of rectangle : area of square.'
      - say: 'Write Solution, then sketch the square and the rectangle made from it.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'square', 'on': 'the square'}
          - {figure: sketch, kind: circle, target: 'rectangle', 'on': 'the rectangle'}
      - section: 'Let'
        say: 'The side is not given, so let the side of the square be s. Its area is s squared. Picture it as 10 rows of 10 tiles, which is 100 tiles.'
        write: 'Let the side of the square be $s$; area $= s^{2}$'
        doodle: {name: 'custom:1987_q06_a', id: tiles, caption: 'the square as 100 tiles', size: scene}
        point:
          - {figure: sketch, kind: circle, target: 's²', 'on': 'area is s squared'}
      - section: 'The new sides'
        say: 'Increased by 20 percent means 100 plus 20, which is 120 percent of s. 120 over 100 is 1.2, so the length is 1.2 s.'
        write: 'Length $= \dfrac{120}{100} \times s = 1.2s$'
        point:
          - {figure: sketch, kind: circle, target: '1.2s', 'on': '1.2 s'}
      - say: 'Decreased by 20 percent means 100 minus 20, which is 80 percent of s. So the width is 0.8 s.'
        write: 'Width $= \dfrac{80}{100} \times s = 0.8s$'
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1987_q06_a2', 'on': '0.8 s'}
        point:
          - {figure: sketch, kind: circle, target: '0.8s', 'on': '0.8 s'}
      - section: 'The rectangle'
        say: 'Area of a rectangle is length times width.'
        write: 'Area of rectangle $= l \times w$'
      - say: 'Now substitute, giving 1.2 s times 0.8 s.'
        write: '$= 1.2s \times 0.8s$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '= [[1.2s]]'}, at: '1.2s', text: 'length', 'on': '1.2 s times'}
          - {line: 6, kind: move, from: {line: 4, at: '= [[0.8s]]'}, at: '0.8s', text: 'width', 'on': 'times 0.8 s'}
      - say: '12 times 8 is 96. There are two decimal places in all, so 1.2 times 0.8 is 0.96. And s times s is s squared. Count the tiles, and there are 96, against the square''s 100.'
        write: '$= 0.96s^{2}$'
        doodle_do:
          - {id: tiles, op: label, part: rect, text: '12 × 8 = 96 tiles', 'on': 'Count the tiles'}
      - section: 'The ratio'
        say: 'Now the ratio, rectangle first. s squared is on both sides, so it cancels.'
        write: 'Rectangle : square $= 0.96s^{2} : s^{2} = 0.96 : 1$'
      - say: 'Multiply both parts by 100 to clear the decimal, giving 96 to 100. Then divide both by 4 to get 24 to 25.'
        write: '$= 96 : 100 = 24 : 25$'
      - say: 'Therefore the area of the rectangle to the area of the square is 24 to 25. The area went down, so it did not stay the same.'
        write: '$\therefore$ rectangle : square $= 24 : 25$'
        point:
          - {figure: sketch, kind: label, target: '?', text: '24 : 25', 'on': 'Therefore'}
      - section: 'Check'
        say: 'Check with a 10 cm square, which has area 100. The rectangle is 12 by 8, which is 96. 96 to 100 is 24 to 25.'
        write: 'Check: $s = 10$: $12 \times 8 = 96$, $96 : 100 = 24 : 25$ ✓'
      - section: 'Answer'
        say: 'So the ratio is 24 to 25, which is answer choice D.'
        write: '$\therefore$ ratio $= 24 : 25$ (D)'
        answer: true
    traps:
      A: 'You went for 6 : 5. That is 1.2 to 1, the change in the length alone. The width shrinks too, so multiply 1.2 by 0.8 to get 0.96, which is 24 : 25.'
      B: 'You went for 25 : 24. That is the ratio upside down, square to rectangle. The question asks for the rectangle first, so it is 24 : 25.'
      C: 'You went for 5 : 6. That is 1 to 1.2, which only looks at the length. Multiply both factors, 1.2 times 0.8, to get 0.96, which is 24 : 25.'
  7:
    moments:
      - section: 'The question'
        say: 'Two brothers put ₦5,000 into a farm and sell the harvest for ₦15,000. The profit is shared 2 to 3. We want the difference between their shares, not either share.'
        doodle: {name: 'custom:1987_q07_a', id: farm, caption: 'put in ₦5,000, harvest sold ₦15,000', size: scene}
        write: 'Invested ₦5,000; sold for ₦15,000; profit shared $2 : 3$'
      - say: 'We find the profit first, then the sum of ratio, and then each share as a fraction of the profit.'
        write: 'Solution'
      - section: 'The profit'
        say: 'Profit is the selling price minus the cost price. Here the cost is the ₦5,000 they invested.'
        write: 'Profit $=$ S.P. $-$ C.P.'
      - say: '15,000 minus 5,000 is 10,000. So the profit in the sack is ₦10,000.'
        doodle_do: [{id: farm, op: label, part: sack, text: 'profit ₦10,000'}]
        write: '$= 15000 - 5000 = $₦$10000$'
      - section: 'Share the profit'
        say: 'Add the parts of the ratio, so 2 plus 3 is 5. This is the sum of ratio. Picture the profit as 5 blocks.'
        doodle_do: [{id: farm, op: stage, stage: 'custom:1987_q07_a2'}]
        write: 'Sum of ratio $= 2 + 3 = 5$'
      - say: 'The first brother has 2 parts, so his share is 2 over 5 of 10,000. 10,000 divided by 5 is 2,000, times 2 is 4,000.'
        write: 'First share $= \dfrac{2}{5} \times 10000 = $₦$4000$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '₦10000'}, at: '10000', text: 'profit'}
      - say: 'The second brother has 3 parts, which is 3 over 5 of 10,000. 2,000 times 3 is 6,000.'
        write: 'Second share $= \dfrac{3}{5} \times 10000 = $₦$6000$'
      - section: 'The difference'
        say: 'Look at the one extra block. The difference is the bigger share minus the smaller, so 6,000 minus 4,000, which is 2,000.'
        doodle_do: [{id: farm, op: circle, part: extra}]
        write: '$\therefore$ Difference $= 6000 - 4000 = $₦$2000$'
        point:
          - {line: 7, kind: highlight, at: '₦2000', to: {doodle: farm, part: extra}}
      - section: 'Check'
        say: 'Check. The two shares add up to 4,000 plus 6,000, which is 10,000, the whole profit.'
        write: 'Check: $4000 + 6000 = 10000 \ \checkmark$'
      - section: 'Answer'
        say: 'So the difference in the profit received is ₦2,000, which is option A.'
        write: '$\therefore$ Difference $=$ ₦2,000.00'
        answer: true
    traps:
      B: 'You went for ₦4,000. That is the smaller brother''s share, 2 over 5 of the profit. Take it from the bigger share, ₦6,000, to get the difference, which is ₦2,000.'
      C: 'You went for ₦6,000. That is the bigger brother''s share. Subtract the smaller share, ₦4,000, to get the difference, which is ₦2,000.'
      D: 'You went for ₦10,000. That is the whole profit. The question wants the difference between the two shares, which is ₦2,000.'
  8:
    moments:
      - section: 'The question'
        say: 'Peter earns ₦20 a week for 20 weeks, then ₦36 a week for 24 weeks. His average for the whole year is ₦30. We want his average for the last 8 weeks.'
        write: '20 weeks at ₦20, 24 weeks at ₦36, year average ₦30'
      - section: 'Solution'
        say: 'Solution. Averages cannot be added, but totals can. The total is the average times the number of weeks.'
        write: 'Solution. Total $=$ average $\times$ number of weeks'
      - say: 'A year has 52 weeks, and 20 plus 24 plus 8 is 52. So the three periods fill the year.'
        write: '$20 + 24 + 8 = 52$ weeks'
      - say: 'Let the average for the last 8 weeks be $x$ naira. That is what we want.'
        write: 'Let the average for the last 8 weeks $=$ ₦$x$'
      - say: 'The year total is 52 times 30, which is 1560 naira.'
        write: 'Year total $= 52 \times 30 = 1560$'
      - say: 'The three spells of pay together make the year total, so 20 times 20, plus 24 times 36, plus 8 times $x$.'
        write: '$20 \times 20 + 24 \times 36 + 8x = 1560$'
      - say: '20 times 20 is 400, for the first 20 weeks. 24 times 36 is 864, for the next 24.'
        write: '$400 + 864 + 8x = 1560$'
      - say: '400 plus 864 is 1264.'
        write: '$1264 + 8x = 1560$'
      - say: 'Subtract 1264 from both sides, and 1560 minus 1264 is 296. That is his pay for the last 8 weeks.'
        write: '$8x = 1560 - 1264 = 296$'
      - say: 'Divide both sides by 8, and 296 over 8 is 37.'
        write: '$x = \dfrac{296}{8} = 37$'
      - section: 'Check'
        say: 'To check, take 400 plus 864 plus 8 times 37. 8 times 37 is 296, and 400 plus 864 plus 296 is 1560, the year total.'
        write: 'Check: $400 + 864 + 8(37) = 1560$ ✓'
      - section: 'Answer'
        say: 'So his average weekly wage for the last 8 weeks is ₦37, which is option A.'
        write: '$\therefore$ Average for the last 8 weeks $=$ ₦37.00'
        answer: true
    traps:
      B: 'You went for ₦35. Check the totals. The year is 52 times 30, which is 1560. The first 44 weeks make 1264. That leaves 296, and 296 over 8 is 37.'
      C: 'You went for ₦30. That assumes the last weeks just match the year average. The first 20 weeks paid only ₦20, so the last 8 must pay more. 8$x$ is 296, so $x$ is 37.'
      D: 'You went for ₦5. That is far too small to bring the average up to ₦30. The last 8 weeks earn ₦296 in total, which is ₦37 a week.'
  9:
    moments:
      - section: 'The question'
        say: 'Money is invested at 4 percent simple interest, and after 3 years it amounts to ₦7,000. What was invested? The ₦7,000 already includes the interest, so we work backwards.'
        write: 'Simple interest at 4% p.a.; amount after 3 years ₦7,000. $P = ?$'
      - say: 'Write the givens first. A is 7,000 naira, R is 4 percent, T is 3 years, and P is what we want.'
        write: 'Solution: $A = $₦$7000,\ R = 4\%,\ T = 3$ years, $P = ?$'
      - section: 'The formulas'
        say: 'The amount is the principal plus the interest.'
        write: '$A = P + I$'
      - say: 'Simple interest is the principal times the rate times the time, over 100.'
        write: '$I = \dfrac{PRT}{100}$'
      - section: 'Substitute'
        say: 'Substitute R equals 4 and T equals 3. P times 4 times 3 is 12P, over 100. Divide top and bottom by 4 to get 3P over 25.'
        write: '$I = \dfrac{P \times 4 \times 3}{100} = \dfrac{12P}{100} = \dfrac{3P}{25}$'
      - say: 'Now put I into A equals P plus I, with A equal to 7,000.'
        write: '$\therefore P + \dfrac{3P}{25} = 7000$'
        point:
          - {line: 5, kind: highlight, at: '7000'}
      - section: 'Solve for P'
        say: 'The L.C.M. is 25. P is 25P over 25, and 25P plus 3P is 28P.'
        write: '$\dfrac{28P}{25} = 7000$ (L.C.M. $= 25$)'
      - say: 'Multiply both sides by 25 over 28.'
        write: '$P = 7000 \times \dfrac{25}{28}$'
      - say: 'Cancel first, and 28 goes into 7,000 two hundred and fifty times. Then 250 times 25 is 6,250. That is the sum invested.'
        write: '$P = 250 \times 25 = 6250$'
      - section: 'Check'
        say: 'Check with the formula. I is 6,250 times 4 times 3, over 100. That is 75,000 over 100, which is 750 naira.'
        write: 'Check: $I = \dfrac{6250 \times 4 \times 3}{100} = $₦$750$'
      - say: 'And A is 6,250 plus 750, which is 7,000 naira, the amount in the question.'
        write: '$A = 6250 + 750 = $₦$7000 \ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the sum invested was ₦6,250, which is option B.'
        write: '$\therefore P =$ ₦6,250.00'
        answer: true
    traps:
      A: 'You went for ₦7,840. That adds 12 percent of 7,000 to 7,000. But ₦7,000 is already the amount. The interest is on the unknown principal, so solve P plus 3P over 25 equals 7,000.'
      C: 'You went for ₦6,160. That takes 12 percent of 7,000 away from 7,000. The interest is 12 percent of the principal, not of the amount, so solve 28P over 25 equals 7,000.'
      D: 'You went for ₦5,833.33. That is 7,000 divided by 1.2, as if the interest were 20 percent. 4 percent for 3 years is 12 percent, and the equation gives ₦6,250.'
  10:
    moments:
      - section: 'The question'
        say: 'A trader sells 20 oranges for ₦1.35 and gains 8 percent. At ₦1.10, is it a gain or a loss, and how much? First we need what the oranges cost him.'
        write: 'S.P. ₦1.35 gives 8% profit. New S.P. ₦1.10: gain or loss $\%$?'
      - say: 'C.P. is the cost price and S.P. the selling price. Profit or loss percent is always measured against the C.P.'
        write: 'Solution'
      - section: 'Find the C.P.'
        say: 'For a gain, the C.P. is 100 over 100 plus the gain percent, times the S.P.'
        write: 'C.P. $= \dfrac{100}{100 + \text{gain}\%} \times$ S.P.'
      - say: 'Substitute. The gain is 8 percent and the S.P. is 1.35. 100 plus 8 is 108.'
        write: 'C.P. $= \dfrac{100}{108} \times 1.35$'
      - say: '100 times 1.35 is 135. So the C.P. is 135 over 108.'
        write: '$= \dfrac{100 \times 1.35}{108} = \dfrac{135}{108}$'
      - say: 'Cancel, because 135 is 5 times 27, and 108 is 4 times 27. That leaves 5 over 4, which is 1.25. So the oranges cost him ₦1.25.'
        write: 'C.P. $= \dfrac{5}{4} = $₦$1.25$'
        point:
          - {line: 5, kind: highlight, at: '₦1.25'}
      - section: 'The new sale'
        say: 'Now the new S.P. is ₦1.10. That is less than the C.P. of ₦1.25, so this time it is a loss.'
        write: 'S.P. $= $₦$1.10 <$ C.P., so a loss'
      - say: 'Loss is C.P. minus S.P., so 1.25 minus 1.10, which is 0.15.'
        write: 'Loss $=$ C.P. $-$ S.P. $= 1.25 - 1.10 = $₦$0.15$'
      - section: 'Loss percent'
        say: 'Loss percent is the loss over the C.P., times 100 percent.'
        write: 'Loss $\% = \dfrac{\text{loss}}{\text{C.P.}} \times 100\%$'
      - say: 'Now substitute. The loss is 0.15 and the C.P. is 1.25.'
        write: '$= \dfrac{0.15}{1.25} \times 100\%$'
        point:
          - {line: 9, kind: move, from: {line: 7, at: '₦0.15'}, at: '0.15', text: 'loss'}
          - {line: 9, kind: move, from: {line: 5, at: '₦1.25'}, at: '1.25', text: 'C.P.'}
      - say: 'Clear the decimals to get 15 over 125. Cancel by 5 to get 3 over 25. Then 100 divided by 25 is 4, and 3 times 4 is 12.'
        write: '$= \dfrac{15}{125} \times 100\% = \dfrac{3}{25} \times 100\% = 12\%$'
      - say: 'Therefore he makes a loss of 12 percent.'
        write: '$\therefore$ Loss $= 12\%$'
      - section: 'Check'
        say: 'To check, 12 percent of ₦1.25 is 0.15, and 1.25 minus 0.15 is 1.10, the new selling price.'
        write: 'Check: $\dfrac{12}{100} \times 1.25 = 0.15$; $1.25 - 0.15 = 1.10 \ \checkmark$'
      - section: 'Answer'
        say: 'So he makes a loss of 12 percent, which is option C.'
        write: '$\therefore$ Loss of $12\%$'
        answer: true
    traps:
      A: 'You went for 8 percent. That is the profit on the first sale. At ₦1.10 he sells below the C.P. of ₦1.25, so it is a loss, and 0.15 over 1.25 is 12 percent.'
      B: 'You went for 10 percent. The loss of ₦0.15 must be measured against the C.P., ₦1.25, not against a selling price. 0.15 over 1.25 times 100 is 12 percent.'
      D: 'You went for 15 percent. That is the 15 kobo loss read as a percentage. Divide it by the C.P., ₦1.25, and multiply by 100 to get 12 percent.'
  11:
    moments:
      - section: 'The question'
        say: 'Four boys and eight girls cut a field in 5 hours, and a boy works at a quarter of a girl''s rate. How many boys alone cut it in 3 hours?'
        write: '4 boys + 8 girls take 5 hours. Boy''s rate $= \tfrac{1}{4}$ girl''s rate.'
      - say: 'Boys and girls work at different rates, so we first change everyone into boys. Then we use proportion.'
        write: 'Solution'
      - section: 'Change girls to boys'
        say: 'A boy does a quarter of a girl''s work. So one girl does the work of 4 boys.'
        write: '1 girl $= 4$ boys'
      - say: 'So 8 girls do the work of 8 times 4, which is 32 boys.'
        write: '8 girls $= 8 \times 4 = 32$ boys'
      - say: 'Add the 4 real boys, and 4 plus 32 is 36. The whole team works like 36 boys.'
        doodle: {name: 'person-small', id: crew, caption: 'the team, counted as boys', repeat: 36, layout: grid}
        write: 'Team $= 4 + 32 = 36$ boys'
      - section: 'Inverse proportion'
        say: 'More boys finish in less time, so the number of boys and the time are in inverse proportion. Their product stays the same, because boys times hours is the same work.'
        write: 'Boys $\times$ hours $=$ constant'
      - say: '36 boys take 5 hours, so the field needs 36 times 5, which is 180 boy-hours of work.'
        doodle_do: [{id: crew, op: group, n: 36, text: '5 hours each: 180 boy-hours'}]
        write: '$36 \times 5 = 180$ boy-hours'
      - say: 'Let the number of boys needed for 3 hours be n. Then n times 3 must also be 180.'
        write: 'Let the number of boys be $n$: $\ n \times 3 = 180$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '= 180'}, at: '180', text: 'same work'}
      - say: 'Divide both sides by 3. 180 divided by 3 is 60.'
        doodle_do: [{id: crew, op: label, text: '60 boys for 3 hours'}]
        write: '$\therefore n = \dfrac{180}{3} = 60$'
      - section: 'Check'
        say: 'To check, 60 boys for 3 hours is 60 times 3, which is 180 boy-hours, the same work as the team''s. And less time needs more boys, as expected.'
        write: 'Check: $60 \times 3 = 180 = 36 \times 5 \ \checkmark$'
      - section: 'Answer'
        say: 'So 60 boys are needed, which is option B.'
        write: '$\therefore$ Number of boys $= 60$'
        answer: true
    traps:
      A: 'You went for 180. That is the total work in boy-hours. It is shared over the 3 hours, and 180 divided by 3 is 60 boys.'
      C: 'You went for 25. That is too few. A girl is worth 4 boys, so the team is worth 36 boys, the work is 180 boy-hours, and 180 over 3 hours is 60 boys.'
      D: 'You went for 20. That treats a girl as worth just one boy. 12 workers times 5 hours is 60, and 60 divided by 3 is 20. But each girl does the work of 4 boys, so the answer is 60.'
  12:
    moments:
      - section: 'The question'
        say: 'We have two fractional indices, and no tables. The rule that keeps the numbers small is to take the root first, then the power.'
        write: 'Evaluate without using tables $\dfrac{125^{\frac{4}{3}}}{16^{\frac{3}{4}}}$'
      - say: 'Solution. We work out the numerator, then the denominator.'
        write: 'Solution'
      - section: 'Fractional index'
        say: 'Recall the law for a fractional index. In $a$ to the $m$ over $n$, the bottom number $n$ is the root, and the top number $m$ is the power. Root first, then power.'
        doodle: {name: 'custom:1987_q12_a', id: blocks, caption: '125 as a cube, 16 as four tiles', size: scene}
        write: 'Recall: $a^{\frac{m}{n}} = \left(\sqrt[n]{a}\right)^{m}$'
      - section: 'The numerator'
        say: 'In 125 to the power 4 over 3, the 3 is a cube root and the 4 is the power. So it is the cube root of 125, raised to the power 4.'
        write: '$125^{\frac{4}{3}} = \left(\sqrt[3]{125}\right)^{4}$'
      - say: '5 times 5 is 25, and 25 times 5 is 125. So 125 is 5 cubed, and the cube root of 125 is 5. Each edge of the cube is 5.'
        doodle_do: [{id: blocks, op: stage, stage: 'custom:1987_q12_a2'}]
        write: '$= 5^{4}$ $\quad (\sqrt[3]{125} = 5,\ \text{since } 5^{3} = 125)$'
      - say: '5 to the 4 is 5 times 5 times 5 times 5. 25 times 25 is 625.'
        doodle_do: [{id: blocks, op: stage, stage: 'custom:1987_q12_a3'}]
        write: '$= 5 \times 5 \times 5 \times 5 = 625$'
        point:
          - {line: 5, kind: highlight, at: '625', to: {doodle: blocks, part: p625}}
      - section: 'The denominator'
        say: 'In 16 to the power 3 over 4, the 4 is a fourth root and the 3 is the power. So it is the fourth root of 16, cubed.'
        write: '$16^{\frac{3}{4}} = \left(\sqrt[4]{16}\right)^{3}$'
      - say: '2 times 2 times 2 times 2 is 16, so 16 is 2 to the 4, and the fourth root of 16 is 2. Each of the four tiles is a 2.'
        doodle_do: [{id: blocks, op: stage, stage: 'custom:1987_q12_a4'}]
        write: '$= 2^{3}$ $\quad (\sqrt[4]{16} = 2,\ \text{since } 2^{4} = 16)$'
      - say: 'Take three of those tiles. 2 times 2 times 2 is 8.'
        doodle_do: [{id: blocks, op: stage, stage: 'custom:1987_q12_a5'}]
        write: '$= 2 \times 2 \times 2 = 8$'
        point:
          - {line: 8, kind: highlight, at: '8', to: {doodle: blocks, part: p8}}
      - section: 'Divide'
        say: 'Now put the numerator, 625, over the denominator, 8.'
        write: '$\therefore \dfrac{125^{\frac{4}{3}}}{16^{\frac{3}{4}}} = \dfrac{625}{8}$'
      - section: 'Check'
        say: 'Check the numerator the other way, power of a power. 125 is 5 cubed, and 3 times 4 over 3 is 4, so it is 5 to the 4, which is 625 again.'
        write: 'Check: $(5^{3})^{\frac{4}{3}} = 5^{3 \times \frac{4}{3}} = 5^{4} = 625\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the value is 625 over 8, which is option A.'
        write: '$\therefore \dfrac{625}{8}$'
        answer: true
    traps:
      B: 'You went for 8 over 625. That is the fraction upside down. The 125 part is the numerator, and it gives 625, so the answer is 625 over 8.'
      C: 'You went for 1 over 8. The denominator, 16 to the power 3 over 4, is 8, but the numerator is not 1. The cube root of 125 is 5, and 5 to the 4 is 625.'
      D: 'You went for 8. That is only the denominator. The numerator works out to 625, so the answer is 625 over 8.'
  13:
    moments:
      - section: 'The question'
        say: 'A student rounded 35 over 6 the wrong way, to 3 decimal places instead of 3 significant figures. How big is his error? Many students stop at 0.003 and forget the standard form.'
        write: '$\dfrac{35}{6}$: 3 s.f. was wanted, 3 d.p. was written. Find the error in standard form.'
      - say: 'Solution. First we change 35 over 6 to a decimal by long division.'
        write: 'Solution'
      - section: 'The decimal'
        say: '6 into 35 goes 5 times, since 6 times 5 is 30, remainder 5.'
        write: '$35 \div 6 = 5$ remainder $5$'
      - say: 'Put the point and bring down a zero. 6 into 50 goes 8 times, since 6 times 8 is 48, remainder 2.'
        write: '$50 \div 6 = 8$ remainder $2$'
      - say: 'Bring down another zero. 6 into 20 goes 3 times, since 6 times 3 is 18, remainder 2 again. So the 3 repeats for ever.'
        write: '$20 \div 6 = 3$ remainder $2$'
      - say: 'So 35 over 6 is 5.8333, with the 3 repeating. The 3s go on for ever.'
        write: '$\therefore \dfrac{35}{6} = 5.8333\ldots$'
      - section: 'The two roundings'
        say: 'To 3 significant figures we keep 5, 8 and 3. The next digit is 3, which is less than 5, so we do not round up.'
        write: '3 s.f.: $5.83$'
      - say: 'To 3 decimal places we keep three digits after the point, which are 8, 3 and 3. The next digit is 3 again, so we do not round up.'
        write: '3 d.p.: $5.833$'
      - section: 'The error'
        say: 'His error is what he wrote, 5.833, minus what he should have written, 5.83.'
        write: 'Error $= 5.833 - 5.83$'
      - say: 'Write 5.83 as 5.830 so the places line up. 5.833 minus 5.830 is 0.003.'
        write: '$= 5.833 - 5.830 = 0.003$'
      - section: 'Standard form'
        say: 'Standard form is $A$ times 10 to the power $n$, where $A$ is at least 1 and less than 10, and $n$ is a whole number.'
        write: 'Standard form: $A \times 10^{n}$, where $1 \le A < 10$'
      - say: 'To turn 0.003 into 3, the decimal point moves 3 places to the right. Moving it to the right makes the index negative, so $n$ is negative 3.'
        write: '$0.003 = 3.0 \times 10^{-3}$'
        point:
          - {line: 11, kind: highlight, at: '10−3'}
      - section: 'Check'
        say: 'To check, 10 to the negative 3 is 1 over 1000, by the negative index law. 3 divided by 1000 is 0.003.'
        write: 'Check: $3.0 \times 10^{-3} = \dfrac{3.0}{1000} = 0.003\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the error in standard form is 3.0 times 10 to the negative 3, which is option B.'
        write: '$\therefore$ Error $= 3.0 \times 10^{-3}$'
        answer: true
    traps:
      A: 'You went for 0.003. That is the right size of error, but it is not in standard form. In standard form it is 3.0 times 10 to the negative 3.'
      C: 'You went for 0.3 times 10 squared. That is 30, far too big, and 0.3 is less than 1, so it is not standard form either. The error is 3.0 times 10 to the negative 3.'
      D: 'You went for 0.3 times 10 to the negative 3. That is 0.0003, ten times too small, and 0.3 is less than 1, so it is not standard form. The answer is 3.0 times 10 to the negative 3.'
  14:
    moments:
      - section: 'The question'
        say: 'This is a fraction made of logs, all to base 2. Work out the numerator and the denominator separately, and watch the log of a half, because it is negative.'
        write: 'Simplify $\dfrac{\log_{2}6 - \log_{2}3}{\log_{2}8 - 2\log_{2}\tfrac{1}{2}}$'
      - say: 'Solution. The numerator first, then the denominator.'
        write: 'Solution'
      - section: 'The numerator'
        say: 'Recall the quotient law of logarithms, which says subtracting two logs to the same base gives the log of the division.'
        write: 'Recall: $\log_{a}M - \log_{a}N = \log_{a}\dfrac{M}{N}$'
      - say: 'By the quotient law, log base 2 of 6 minus log base 2 of 3 is log base 2 of 6 over 3.'
        write: '$\log_{2}6 - \log_{2}3 = \log_{2}\dfrac{6}{3}$'
      - say: '6 divided by 3 is 2.'
        write: '$= \log_{2}2$'
      - say: 'The log of a number to its own base is 1, because 2 to the power 1 is 2.'
        write: '$= 1$ $\quad [\log_{a}a = 1]$'
      - section: 'The denominator'
        say: 'Let log base 2 of 8 be $x$. In index form, 2 to the power $x$ equals 8. Picture the powers of 2 as a staircase, each step up doubling.'
        doodle: {name: 'custom:1987_q14_a', id: steps, caption: 'each step up is ×2'}
        write: 'Let $\log_{2}8 = x \Rightarrow 2^{x} = 8$'
      - say: '8 is 2 cubed. The bases are the same, so equate the indices, and $x$ is 3. That is three steps up the stairs.'
        doodle_do: [{id: steps, op: circle, part: s8}]
        write: '$2^{x} = 2^{3} \quad \therefore x = 3$'
      - say: 'Let log base 2 of a half be $y$. In index form, 2 to the power $y$ equals a half.'
        write: 'Let $\log_{2}\tfrac{1}{2} = y \Rightarrow 2^{y} = \tfrac{1}{2}$'
      - say: 'By the negative index law, a half is 2 to the power minus 1. Equate the indices, and $y$ is minus 1. That is one step down from 1.'
        doodle_do: [{id: steps, op: circle, part: sh}]
        write: '$2^{y} = 2^{-1} \quad \therefore y = -1$'
      - say: 'Now put both values into the denominator, giving 3, minus 2 times minus 1.'
        write: 'Denominator $= 3 - 2(-1)$'
      - say: '2 times minus 1 is minus 2, and minus a minus is plus. So 3 plus 2 is 5.'
        write: '$= 3 + 2 = 5$'
      - section: 'Put them together'
        say: 'The numerator is 1 and the denominator is 5.'
        write: '$\dfrac{\log_{2}6 - \log_{2}3}{\log_{2}8 - 2\log_{2}\tfrac{1}{2}} = \dfrac{1}{5}$'
      - section: 'Check'
        say: 'Check the denominator with the laws of logarithms. 2 log of a half is log of a half squared, which is log of 1 over 4. And 8 divided by 1 over 4 is 32, which is 2 to the 5.'
        write: 'Check: $\log_{2}8 - \log_{2}\tfrac{1}{4} = \log_{2}32 = 5\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the expression simplifies to 1 over 5, which is option A.'
        write: '$\therefore$ the value $= \tfrac{1}{5}$'
        answer: true
    traps:
      B: 'You went for a half. The numerator is 1, but the denominator is 5, not 2. Log base 2 of a half is minus 1, so the denominator is 3 minus 2 times minus 1, which is 5.'
      C: 'You went for minus a half. The denominator is 3 minus minus 2, which is plus 5. Minus a minus is plus, so the answer is 1 over 5.'
      D: 'You went for log 3 over log 7. The logs simplify to plain numbers. The numerator is log base 2 of 2, which is 1, and the denominator is 5.'
  15:
    moments:
      - section: 'The question'
        say: 'Many students multiply everything out and end up with root 2352. Don''t. Break each number into its factors first, pull out the perfect squares, and most of it cancels.'
        write: 'Simplify $\dfrac{2\sqrt{14} \times 3\sqrt{21}}{7\sqrt{24} \times 2\sqrt{98}}$'
      - say: 'Solution. We simplify the numerator and the denominator separately, then divide.'
        write: 'Solution'
      - section: 'The law of surds'
        say: 'The law of surds says the square root of a product is the product of the square roots, root $a$ times root $b$.'
        write: '$\sqrt{ab} = \sqrt{a} \times \sqrt{b}$'
      - section: 'The numerator'
        say: 'In the numerator, multiply the whole numbers, 2 times 3, and put the two numbers under one root.'
        write: 'Numerator $= 2 \times 3 \times \sqrt{14 \times 21}$'
      - say: 'Don''t multiply 14 by 21. Write each as its factors, so 14 is 7 times 2, and 21 is 7 times 3.'
        write: '$= 6\sqrt{7 \times 2 \times 7 \times 3}$'
      - say: '7 times 7 is 49, a perfect square, and 2 times 3 is 6. Picture the 49 as a square of tiles, 7 on a side, times 6.'
        doodle: {name: 'custom:1987_q15_a', id: tiles, caption: 'pull out the square', size: scene}
        write: '$= 6\sqrt{49 \times 6}$'
        point:
          - {line: 5, kind: highlight, at: '49 × 6', to: {doodle: tiles, part: sq49}}
      - say: 'Root 49 is 7, the side of the square, so it comes out. 6 times 7 root 6 is 42 root 6.'
        doodle_do: [{id: tiles, op: circle, part: side7}]
        write: '$= 6 \times 7\sqrt{6} = 42\sqrt{6}$'
      - section: 'The denominator'
        say: 'Now the denominator. Put each surd in its basic form. 24 is 4 times 6, and root 4 is 2, so root 24 is 2 root 6.'
        write: '$\sqrt{24} = \sqrt{4 \times 6} = 2\sqrt{6}$'
      - say: '98 is 49 times 2, and root 49 is 7, so root 98 is 7 root 2.'
        write: '$\sqrt{98} = \sqrt{49 \times 2} = 7\sqrt{2}$'
      - say: 'Put them in, and we get 7 times 2 root 6, times 2 times 7 root 2.'
        write: 'Denominator $= 7(2\sqrt{6}) \times 2(7\sqrt{2})$'
      - say: '7 times 2 root 6 is 14 root 6, and 2 times 7 root 2 is 14 root 2.'
        write: '$= 14\sqrt{6} \times 14\sqrt{2}$'
      - section: 'Divide'
        say: 'Now put the numerator over the denominator.'
        write: '$\therefore$ Expression $= \dfrac{42\sqrt{6}}{14\sqrt{6} \times 14\sqrt{2}}$'
      - say: 'Root 6 is on the top and the bottom, so it cancels. 14 times 14 is 196.'
        write: '$= \dfrac{42}{196\sqrt{2}}$'
      - say: '42 and 196 both divide by 14. 42 divided by 14 is 3, and 196 divided by 14 is 14.'
        write: '$= \dfrac{3}{14\sqrt{2}}$'
      - section: 'Rationalise'
        say: 'There is still a surd in the denominator, so rationalise by multiplying the numerator and denominator by root 2. Root 2 times root 2 is 2.'
        write: '$= \dfrac{3}{14\sqrt{2}} \times \dfrac{\sqrt{2}}{\sqrt{2}} = \dfrac{3\sqrt{2}}{14 \times 2}$'
      - say: '14 times 2 is 28. So we get 3 root 2 over 28.'
        write: '$= \dfrac{3\sqrt{2}}{28}$'
      - section: 'Check'
        say: 'Check with decimals. The numerator is about 7.483 times 13.748, which is 102.88. The denominator is about 34.293 times 19.799, which is 678.96. That is about 0.1515, and 3 root 2 over 28 is also 0.1515.'
        write: 'Check: $\dfrac{102.88}{678.96} \approx 0.1515 \approx \dfrac{3 \times 1.414}{28}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the expression simplifies to 3 root 2 over 28, which is option D.'
        write: '$\therefore$ the answer is $\dfrac{3\sqrt{2}}{28}$'
        answer: true
    traps:
      A: 'You went for 3 root 14 over 4. The number part is 42 over 196 root 2, which becomes 3 over 14 root 2, not 3 over 4. After rationalising, the answer is 3 root 2 over 28.'
      B: 'You went for 3 root 21 over 4. Root 21 does not survive, because 14 times 21 is 49 times 6, so the numerator is 42 root 6, and root 6 cancels with the denominator. The answer is 3 root 2 over 28.'
      C: 'You went for 3 root 14 over 28. The 28 is right, but the surd is not. Root 6 cancels top and bottom, leaving root 2 in the denominator, and rationalising gives 3 root 2 over 28.'
  16:
    moments:
      - section: 'The question'
        say: 'This is a formula with a square root inside it. It looks heavy, but once we put in what we know, it shrinks fast and only $n$ is left.'
        write: '$p = \dfrac{2}{3} \cdot \dfrac{1 - r^{2}}{n^{2}}$'
      - section: 'Solution'
        say: 'We are given $p$ and $r$, and we want $n$. First we list the givens, then work out the pieces, then substitute and solve.'
        write: 'Solution'
      - say: '$p$ is 1, $r$ is the square root of 1 over 3, and $n$ is what we want.'
        write: '$p = 1,\ r = \sqrt{\tfrac{1}{3}},\ n = ?$'
      - say: 'First, $r$ squared. Squaring a square root undoes it, so $r$ squared is 1 over 3.'
        write: '$r^{2} = \left(\sqrt{\tfrac{1}{3}}\right)^{2} = \tfrac{1}{3}$'
      - say: 'Take that third away from 1. 1 minus 1 over 3 leaves 2 over 3.'
        write: '$1 - r^{2} = 1 - \tfrac{1}{3} = \tfrac{2}{3}$'
      - section: 'Substitute'
        say: 'Now substitute. $p$ is 1, and 1 minus $r$ squared is 2 over 3.'
        write: '$1 = \dfrac{2}{3} \times \dfrac{\tfrac{2}{3}}{n^{2}}$'
      - say: 'For 2 over 3 times 2 over 3, 2 times 2 is 4 on top, and 3 times 3 is 9 below. So the right-hand side is 4 over 9 $n$ squared.'
        write: '$1 = \dfrac{4}{9n^{2}}$'
      - say: 'Cross multiply, so 1 times 9 $n$ squared equals 4 times 1.'
        write: '$9n^{2} = 4$'
      - say: 'Divide both sides by 9 to leave $n$ squared alone. Picture a square of 9 tiles with 4 of them shaded.'
        doodle: {name: 'custom:1987_q16_b', id: square, caption: 'n² as 4 of 9 tiles'}
        write: '$n^{2} = \dfrac{4}{9}$'
        point:
          - {line: 8, kind: highlight, at: 'n2', to: {doodle: square, part: shade}}
      - say: 'Take the square root of both sides. The square root of 4 is 2 and the square root of 9 is 3. On the picture, the shaded square is 2 tiles of 3 along each side.'
        doodle_do: [{id: square, op: label, part: side, text: '⅔'}]
        write: '$n = \sqrt{\dfrac{4}{9}} = \dfrac{2}{3}$'
      - say: 'Therefore $n$ is 2 over 3. We take the positive root, since every option is positive.'
        write: '$\therefore n = \dfrac{2}{3}$'
      - section: 'Check'
        say: 'Check by putting $n$ equals 2 over 3 back. $n$ squared is 4 over 9, so the formula gives 2 over 3, times 2 over 3, divided by 4 over 9.'
        write: '$p = \dfrac{2}{3} \times \dfrac{2}{3} \div \dfrac{4}{9}$'
      - say: '2 over 3 times 2 over 3 is 4 over 9. Dividing by 4 over 9 is multiplying by 9 over 4, which gives 1. That is the $p$ we were given.'
        write: '$= \dfrac{4}{9} \times \dfrac{9}{4} = 1\ \checkmark$'
      - say: 'So $n$ is 2 over 3, which is option D.'
        write: '$\therefore n = \tfrac{2}{3}$ (D)'
        answer: true
    traps:
      A: 'You went for 3 over 2. That is the reciprocal of the answer, from getting $n$ squared as 9 over 4. Cross multiplying gives 9 $n$ squared equals 4, so $n$ squared is 4 over 9 and $n$ is 2 over 3.'
      B: 'You went for 3. That would make $n$ squared 9, and then the right-hand side is 4 over 81, far less than 1. $n$ squared is 4 over 9, so $n$ is 2 over 3.'
      C: 'You went for 1 over 3. That squares to 1 over 9, not 4 over 9. The square root of 4 over 9 is 2 over 3.'
  17:
    moments:
      - section: 'The question'
        say: 'We are given $a$ and $b$ in terms of $u$ and $v$, and we must evaluate 2 $a$ minus $b$, times $a$ minus $b$ squared, when $u$ is 1 and $v$ is minus 1. Picture two machines fed the same two values.'
        doodle: {name: 'custom:1987_q17_a', id: mach, caption: 'feed u = 1, v = −1 in'}
        write: '$a = u^{2} - 3v^{2},\ b = 2uv + v^{2};\ u = 1,\ v = -1$'
      - section: 'Solution'
        say: 'Solution. Find $a$ first. Substitute $u$ equals 1 and $v$ equals minus 1, and put the minus 1 in a bracket.'
        write: 'Solution: $a = (1)^{2} - 3(-1)^{2}$'
        doodle_do:
          - {id: mach, op: underline, part: vals}
      - say: 'Minus 1 squared is minus 1 times minus 1, which is plus 1. So we have 1 minus 3 times 1.'
        write: '$= 1 - 3(1) = 1 - 3$'
      - say: '1 minus 3 is minus 2.'
        write: '$\therefore a = -2$'
        doodle_do:
          - {id: mach, op: label, part: outa, text: '−2'}
      - say: 'Now $b$. Substitute the same values into 2 $u v$ plus $v$ squared.'
        write: '$b = 2(1)(-1) + (-1)^{2}$'
      - say: '2 times 1 times minus 1 is minus 2, and minus 1 squared is plus 1. Minus 2 plus 1 is minus 1.'
        write: '$= -2 + 1$, $\ \therefore b = -1$'
        doodle_do:
          - {id: mach, op: label, part: outb, text: '−1'}
      - section: 'The two brackets'
        say: 'Now the first bracket, 2 $a$ minus $b$. Put $a$ equals minus 2 and $b$ equals minus 1 in brackets.'
        write: '$2a - b = 2(-2) - (-1)$'
      - say: '2 times minus 2 is minus 4. Minus minus 1 is plus 1. Minus 4 plus 1 is minus 3.'
        write: '$= -4 + 1 = -3$'
      - say: 'Now the second bracket, $a$ minus $b$ squared. $b$ squared is minus 1 squared, which is plus 1.'
        write: '$a - b^{2} = -2 - (-1)^{2} = -2 - 1 = -3$'
      - section: 'Multiply'
        say: 'Now multiply the two brackets. For minus 3 times minus 3, a negative times a negative is positive, so it is plus 9.'
        write: '$(2a - b)(a - b^{2}) = (-3)(-3) = 9$'
      - section: 'Check'
        say: 'Check the trap sign. $b$ squared is plus 1 even though $b$ is negative, so $a$ minus $b$ squared is minus 2 minus 1, not minus 2 plus 1.'
        write: 'Check: $b^{2} = (-1)^{2} = +1\ \checkmark$'
      - say: 'Therefore the value is 9, which is option A.'
        write: '$\therefore (2a - b)(a - b^{2}) = 9$'
        answer: true
    traps:
      B: 'You went for 15. Check the signs. $a$ is minus 2 and $b$ is minus 1, so the brackets are minus 3 and minus 3, and minus 3 times minus 3 is 9.'
      C: 'You went for 27. Look again at the second bracket. $b$ squared is plus 1, so $a$ minus $b$ squared is minus 2 minus 1, which is minus 3. Then minus 3 times minus 3 is 9.'
      D: 'You went for 33. That comes from a sign slip, such as squaring minus 1 to get minus 1. Minus 1 squared is plus 1, which gives $a = -2$, $b = -1$ and the value 9.'
  18:
    moments:
      - section: 'The question'
        say: 'The cost in naira of feeding $n$ people for a week is $Q$ equals 15 plus 0.5 $n$. We want the extra cost, in kobo, of feeding one more person.'
        write: '$Q = 15 + 0.5n$ (naira); extra cost for $1$ more, in kobo'
      - section: 'Solution'
        say: 'Solution. Let $Q_1$ be the cost for $n$ people. That is the formula just as it is.'
        write: 'Solution: Let $Q_{1} = 15 + 0.5n$ ($n$ people)'
      - say: 'Let $Q_2$ be the cost for one more person, $n$ plus 1 people. Substitute $n$ plus 1 for $n$, in a bracket.'
        write: 'Let $Q_{2} = 15 + 0.5(n + 1)$ ($n + 1$ people)'
      - say: 'Open the bracket. 0.5 times $n$ is 0.5 $n$, and 0.5 times 1 is 0.5.'
        write: '$Q_{2} = 15 + 0.5n + 0.5$'
      - say: 'The extra cost is the new cost minus the old cost, which is $Q_2$ minus $Q_1$.'
        write: 'Extra cost $= Q_{2} - Q_{1}$'
      - say: 'Substitute both, each in a bracket so the minus sign reaches every term.'
        write: '$= (15 + 0.5n + 0.5) - (15 + 0.5n)$'
      - say: 'Open the second bracket to get minus 15 and minus 0.5 $n$. The 15s cancel and the 0.5 $n$ terms cancel, leaving 0.5 naira.'
        write: '$= 15 + 0.5n + 0.5 - 15 - 0.5n = 0.50$ naira'
      - section: 'Naira to kobo'
        say: 'The question wants kobo. 1 naira is 100 kobo, so multiply the naira by 100.'
        write: '₦$1 = 100$k'
      - say: '0.5 times 100 is 50. So the extra cost is 50 kobo.'
        write: '₦$0.50 = 0.50 \times 100 = 50$k'
      - say: 'Therefore the extra cost of feeding one more person is 50 kobo.'
        write: '$\therefore$ Extra cost $= 50$k'
        point:
          - {line: 9, kind: highlight, at: '50'}
      - section: 'Check'
        say: 'Check with numbers. 10 people cost 15 plus 5, which is 20 naira. 11 people cost 15 plus 5.5, which is 20.50 naira. The difference is 0.50 naira, which is 50 kobo.'
        write: 'Check: $Q(11) - Q(10) = 20.50 - 20 = 0.50$ naira $= 50$k $\checkmark$'
      - section: 'Answer'
        say: 'So the extra cost is 50 kobo, which is answer choice D.'
        write: '$\therefore 50$k'
        answer: true
    traps:
      A: 'You went for 350k. That does not come from the formula. The only part that changes with one more person is the 0.5 naira, which is 50 kobo.'
      B: 'You went for 200k. The fixed ₦15 does not change when one more person is added, because it cancels in $Q_2$ minus $Q_1$. Only the 0.5 naira per person is extra, and that is 50 kobo.'
      C: 'You went for 150k. That mixes in the fixed 15. In $Q_2$ minus $Q_1$ the 15s cancel, leaving 0.5 naira, which is 50 kobo.'
  19:
    moments:
      - section: 'The question'
        say: '$P$ varies inversely as $V$, and $V$ varies directly as $R$ squared. We want one equation linking $P$ straight to $R$. Picture a chain from $R$ through $V$ to $P$.'
        doodle: {name: 'custom:1987_q19_a', id: chain, caption: 'R to V to P'}
        write: 'Given: $R = 7$ when $P = 2$'
      - say: 'Solution. Write each statement with the sign of proportionality, then bring in a constant for each.'
        write: 'Solution'
      - section: 'The two variations'
        say: '$P$ varies inversely as $V$, so $P$ is proportional to 1 over $V$. So $P$ equals $k$ one over $V$. Number it equation one.'
        doodle_do: [{id: chain, op: highlight, part: flip}]
        write: '$P \propto \dfrac{1}{V}$ $\ \therefore\ P = \dfrac{k_{1}}{V} \quad \ldots (1)$'
      - say: '$V$ varies directly as $R$ squared, so $V$ equals $k$ two times $R$ squared. That is equation two.'
        doodle_do: [{id: chain, op: highlight, part: sq}]
        write: '$V \propto R^{2}$ $\ \therefore\ V = k_{2}R^{2} \quad \ldots (2)$'
      - section: 'Remove V'
        say: 'Substitute equation two into equation one, to remove $V$. On the chain, we jump straight from $R$ to $P$.'
        doodle_do: [{id: chain, op: cross, part: vb}, {id: chain, op: stage, stage: 'custom:1987_q19_a2'}]
        write: 'Sub. (2) in (1): $\ P = \dfrac{k_{1}}{k_{2}R^{2}}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= [[k2R2]]'}, at: 'k2R2', text: 'V from (2)'}
      - say: '$k$ one over $k$ two is a single constant. Let it be $k$.'
        write: 'Let $k = \dfrac{k_{1}}{k_{2}}$: $\ P = \dfrac{k}{R^{2}}$'
      - section: 'Find k'
        say: 'Now use the given pair, where $R$ is 7 when $P$ is 2.'
        write: 'When $R = 7,\ P = 2$: $\ 2 = \dfrac{k}{7^{2}} = \dfrac{k}{49}$'
      - say: 'Multiply both sides by 49. 2 times 49 is 98.'
        write: '$\therefore\ k = 2 \times 49 = 98$'
      - section: 'The equation'
        say: 'So the equation connecting $P$ and $R$ is $P$ equals 98 over $R$ squared.'
        write: '$\therefore\ P = \dfrac{98}{R^{2}}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= 98'}, at: '98', text: 'k'}
      - say: 'Multiply both sides by $R$ squared to clear the fraction.'
        write: '$PR^{2} = 98$'
        point:
          - {line: 9, kind: highlight, at: 'PR2 = 98', to: {doodle: chain, part: rp}}
      - section: 'Check'
        say: 'Check with the given pair. 2 times 7 squared is 2 times 49, which is 98.'
        write: 'Check: $\ 2 \times 7^{2} = 2 \times 49 = 98\ \checkmark$'
      - say: 'So the relationship is $P R$ squared equals 98, and that is option B.'
        write: '$\therefore\ PR^{2} = 98$'
        answer: true
    traps:
      A: 'You went for $P$ equals 98 $R$ squared. That makes $P$ grow as $R$ grows, but an inverse link followed by a direct link makes $P$ shrink as $R$ grows. It''s 98 over $R$ squared.'
      C: 'You went for $P$ equals 1 over 98 $R$. The 98 belongs on top, and $R$ must be squared. $P$ is 98 over $R$ squared.'
      D: 'You went for $P$ equals $R$ squared over 98. That''s a direct link, with $P$ growing as $R$ grows. Also, with $R$ as 7 it gives a half, not 2. The answer is $P R$ squared equals 98.'
  20:
    moments:
      - section: 'The question'
        say: 'Make $y$ the subject. Here $y$ is wrapped like a parcel, because it was cubed, put under 1, then added to $x$ squared. We unwrap it from the outside in.'
        write: '$Z = x^{2} + \dfrac{1}{y^{3}}$'
        doodle: {name: 'custom:1987_q20_a', id: layers, caption: 'y is wrapped in layers'}
      - section: 'Solution'
        say: 'To change the subject, we undo the operations on $y$ in reverse order, one per line, doing the same thing to both sides.'
        write: 'Solution'
      - say: 'The outside layer is plus $x$ squared. Subtract $x$ squared from both sides.'
        doodle_do: [{id: layers, op: cross, part: outer}]
        write: '$Z - x^{2} = \dfrac{1}{y^{3}}$'
        point:
          - {line: 2, kind: move, from: {line: 0, at: '[[x2]] +'}, at: '− x2', text: 'across the ='}
      - say: 'Now $y$ cubed is under 1. Cross multiply, and $y$ cubed times $Z$ minus $x$ squared equals 1.'
        doodle_do: [{id: layers, op: cross, part: mid}]
        write: '$y^{3}(Z - x^{2}) = 1$'
      - say: 'Divide both sides by the bracket, $Z$ minus $x$ squared, so $y$ cubed is alone.'
        write: '$y^{3} = \dfrac{1}{Z - x^{2}}$'
      - say: 'The last layer is the cube. Take the cube root of both sides.'
        doodle_do: [{id: layers, op: cross, part: cube}]
        write: '$y = \sqrt[3]{\dfrac{1}{Z - x^{2}}}$'
      - say: 'The cube root of 1 is 1. Notice that we take the cube root of the whole bracket, $Z$ minus $x$ squared, together. Now $y$ is out of its wrapping.'
        doodle_do: [{id: layers, op: circle, part: core}]
        write: '$y = \dfrac{1}{\sqrt[3]{Z - x^{2}}}$'
      - say: 'A cube root is the same as the power 1 over 3. Therefore $y$ equals 1 over the bracket to the power 1 over 3.'
        write: '$\therefore y = \dfrac{1}{(Z - x^{2})^{\frac{1}{3}}}$'
      - section: 'Check'
        say: 'Check with numbers. Take $x$ equals 1 and $Z$ equals 9. Our formula gives 1 over 9 minus 1, to the power 1 over 3. The cube root of 8 is 2, so $y$ is a half.'
        write: '$y = \dfrac{1}{(9 - 1)^{\frac{1}{3}}} = \dfrac{1}{2}$'
      - say: 'Put $y$ equals a half into the question. A half cubed is 1 over 8, and 1 over that is 8. 1 plus 8 is 9, which is $Z$.'
        write: '$1^{2} + \dfrac{1}{(\frac{1}{2})^{3}} = 1 + 8 = 9\ \checkmark$'
      - say: 'So $y$ is 1 over $Z$ minus $x$ squared, to the power 1 over 3, which is option C.'
        write: '$\therefore y = \dfrac{1}{(Z - x^{2})^{\frac{1}{3}}}$ (C)'
        answer: true
    traps:
      A: 'You went for the bracket cubed. To undo $y$ cubed you take the cube root, which is the power 1 over 3, not the power 3.'
      B: 'You went for $Z$ plus $x$ cubed. Moving $x$ squared across makes it minus $x$ squared, and it stays squared. The bracket is $Z$ minus $x$ squared.'
      D: 'You went for the cube root of $Z$ minus the cube root of $x$ squared. Roots do not split over a subtraction. The cube root of 9 minus 1 is 2, but the cube root of 9 minus the cube root of 1 is about 1.08. Keep the bracket whole.'
  21:
    moments:
      - section: 'The question'
        say: 'Which values of $m$ turn this into a perfect square? It looks like guesswork, but one rule settles it, and that rule is that the discriminant must be zero.'
        write: '$x^{2} + 2(m + 1)x + m + 3$'
        doodle: {name: 'custom:1987_q21_a', id: curve, caption: 'a perfect square touches once'}
      - section: 'Solution'
        say: 'A perfect square has two equal roots. Its graph just touches the $x$-axis once. For equal roots, $b$ squared minus 4 $a c$ equals zero.'
        write: 'Solution'
        doodle_do: [{id: curve, op: circle, part: touch}]
      - say: 'So we write the condition first, $b$ squared minus 4 $a c$ equals zero.'
        write: 'Perfect square: $b^{2} - 4ac = 0$'
      - say: 'Read off $a$, $b$ and $c$. $a$ is the coefficient of $x$ squared, 1. $b$ is the coefficient of $x$, which is 2 times, $m$ plus 1. $c$ is the rest, $m$ plus 3.'
        write: '$a = 1,\ b = 2(m + 1),\ c = m + 3$'
      - say: 'Substitute them, each in brackets.'
        write: '$[2(m + 1)]^{2} - 4(1)(m + 3) = 0$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: 'b = 2(m + 1)'}, at: '[2(m + 1)]2', text: 'b'}
      - say: '2 times $m$ plus 1, all squared, is 2 squared, which is 4, times $m$ plus 1 squared.'
        write: '$4(m + 1)^{2} - 4(m + 3) = 0$'
      - say: 'Every term has a 4, so divide both sides by 4.'
        write: '$(m + 1)^{2} - (m + 3) = 0$'
      - say: 'Open the brackets. $m$ plus 1, all squared, is $m$ squared plus 2 $m$ plus 1. The minus sign makes $m$ plus 3 into minus $m$ minus 3.'
        write: '$m^{2} + 2m + 1 - m - 3 = 0$'
      - say: 'Collect like terms. 2 $m$ minus $m$ is $m$, and 1 minus 3 is negative 2.'
        write: '$m^{2} + m - 2 = 0$'
      - section: 'Factorise'
        say: 'Now factorise. The product is $a$ times $c$, so 1 times negative 2, which is negative 2. The sum is $b$, which is 1.'
        write: 'Product $= ac = -2$, Sum $= b = 1$'
      - say: 'We need two numbers that multiply to negative 2 and add to 1, and they are plus 2 and negative 1.'
        write: 'Factors: $+2$ and $-1$'
      - say: 'Replace the middle term, $m$, with 2 $m$ minus $m$.'
        write: '$m^{2} + 2m - m - 2 = 0$'
      - say: 'Group in pairs. From the first pair take out $m$, and from the second take out negative 1. Both brackets are $m$ plus 2.'
        write: '$m(m + 2) - 1(m + 2) = 0$'
      - say: 'Take out the common bracket, $m$ plus 2. What is left is $m$ minus 1.'
        write: '$(m + 2)(m - 1) = 0$'
      - say: 'Either $m$ plus 2 is zero or $m$ minus 1 is zero.'
        write: 'Either $m + 2 = 0$ or $m - 1 = 0$'
      - say: 'Therefore $m$ is negative 2 or $m$ is 1.'
        write: '$\therefore m = -2$ or $m = 1$'
      - section: 'Check'
        say: 'Check $m$ equals 1. Then $b$ is 2 times 2, which is 4, and $c$ is 4. We get $x$ squared plus 4 $x$ plus 4, which is $x$ plus 2, all squared.'
        write: '$m = 1$: $x^{2} + 4x + 4 = (x + 2)^{2}\ \checkmark$'
      - say: 'Check $m$ equals negative 2. $b$ is 2 times negative 1, which is negative 2, and $c$ is 1. That is $x$ minus 1, all squared.'
        write: '$m = -2$: $x^{2} - 2x + 1 = (x - 1)^{2}\ \checkmark$'
      - say: 'So $m$ is 1 or negative 2, which is option C.'
        write: '$\therefore m = 1, -2$ (C)'
        answer: true
    traps:
      A: 'You went for negative 1 and 1. Try $m$ equals negative 1, and the expression becomes $x$ squared plus 2, which is not a perfect square. The equation $m$ squared plus $m$ minus 2 equals zero gives 1 and negative 2.'
      B: 'You went for negative 1 and 2. Those are the right numbers with the signs reversed. From $m$ plus 2 times $m$ minus 1 equals zero, $m$ is negative 2 or 1.'
      D: 'You went for 2 and negative 2. Only negative 2 is right. The factors are $m$ plus 2 and $m$ minus 1, so the other value is 1, not 2.'
  22:
    moments:
      - section: 'The question'
        say: 'There are powers of 6 everywhere, yet this is really a quadratic wearing a costume. Take the costume off and it factorises like any other.'
        write: '$6^{2x + 1} - 7(6^{x}) - 5$'
        doodle: {name: 'custom:1987_q22_a', id: cards, caption: 'a quadratic in disguise', size: scene}
      - section: 'Solution'
        say: 'First we rewrite 6 to the power 2 $x$ plus 1 with the laws of indices, so that only 6 to the $x$ appears.'
        write: 'Solution'
      - say: 'When we multiply powers of the same base, we add the indices. So 6 to the 2 $x$ plus 1 is 6 to the 1, times 6 to the 2 $x$.'
        write: '$6^{2x + 1} = 6^{1} \times 6^{2x}$'
      - say: 'And 6 to the 2 $x$ is 6 to the $x$, squared, because a power of a power multiplies the indices. Look at the two blue cards.'
        doodle_do: [{id: cards, op: highlight, part: cards}]
        write: '$= 6(6^{x})^{2}$'
      - say: 'Now let $u$ stand for 6 to the $x$. Put a $u$ tag on each blue card.'
        doodle_do: [{id: cards, op: stage, stage: 'custom:1987_q22_a2'}]
        write: 'Let $u = 6^{x}$'
      - say: 'The whole expression becomes 6 $u$ squared, minus 7 $u$, minus 5. That is an ordinary quadratic in $u$.'
        write: '$6u^{2} - 7u - 5$'
        point:
          - {line: 5, kind: highlight, at: '6u2 − 7u − 5', to: {doodle: cards, part: quad}}
      - section: 'Factorise'
        say: 'The product is $a$ times $c$, so 6 times negative 5, which is negative 30. The sum is $b$, negative 7.'
        write: 'Product $= ac = -30$, Sum $= b = -7$'
      - say: 'Two numbers that multiply to negative 30 and add to negative 7 are negative 10 and plus 3. Negative 10 plus 3 is negative 7.'
        write: 'Factors: $-10$ and $+3$'
      - say: 'Replace the middle term, negative 7 $u$, with negative 10 $u$ plus 3 $u$.'
        write: '$6u^{2} - 10u + 3u - 5$'
      - say: 'Group in pairs. From the first pair take out 2 $u$, and from the second take out 1. Both brackets are 3 $u$ minus 5, so we are on track.'
        write: '$2u(3u - 5) + 1(3u - 5)$'
      - say: 'Take out the common bracket, 3 $u$ minus 5. What is left is 2 $u$ plus 1. Write the two brackets under the cards.'
        doodle_do: [{id: cards, op: stage, stage: 'custom:1987_q22_a3'}]
        write: '$(3u - 5)(2u + 1)$'
      - say: 'Now put 6 to the $x$ back in place of $u$. Therefore we get 3 times 6 to the $x$ minus 5, times 2 times 6 to the $x$ plus 1.'
        doodle_do: [{id: cards, op: pulse, part: us}]
        write: '$\therefore \{3(6^{x}) - 5\}\{2(6^{x}) + 1\}$'
        point:
          - {line: 4, kind: arrow, at: 'u = 6x', text: 'put back'}
      - section: 'Check'
        say: 'Check by opening the brackets. 3 $u$ times 2 $u$ is 6 $u$ squared, 3 $u$ times 1 is 3 $u$, negative 5 times 2 $u$ is negative 10 $u$, and negative 5 times 1 is negative 5.'
        write: '$6u^{2} + 3u - 10u - 5$'
      - say: '3 $u$ minus 10 $u$ is negative 7 $u$. That is exactly what we started with.'
        write: '$= 6u^{2} - 7u - 5\ \checkmark$'
      - say: 'So the factors are 3 times 6 to the $x$ minus 5, and 2 times 6 to the $x$ plus 1, which is option A.'
        write: '$\therefore \{3(6^{x}) - 5\}\{2(6^{x}) + 1\}$ (A)'
        answer: true
    traps:
      B: 'You went for negative 1 in the second bracket. 3 $u$ minus 5, times 2 $u$ minus 1, opens to 6 $u$ squared minus 13 $u$ plus 5, so the middle and last terms are wrong. We need plus 1.'
      C: 'You went for 2 $u$ minus 5, times 3 $u$ plus 1. That opens to 6 $u$ squared minus 13 $u$ minus 5. The factors negative 10 and 3 give 3 $u$ minus 5, times 2 $u$ plus 1.'
      D: 'You went for 2 $u$ minus 5, times 3 $u$ minus 1. That opens to 6 $u$ squared minus 17 $u$ plus 5. Open your brackets to check before you choose.'
  23:
    moments:
      - section: 'The question'
        say: 'One equation is simple and one has squares. The simple one is our way in, because it hands us $x$ in terms of $y$.'
        write: '$x + y = 5,\ x^{2} - 2y^{2} = 1$'
        doodle: {name: 'custom:1987_q23_a', id: swap, caption: 'x is the same as 5 − y', size: scene}
      - section: 'Solution'
        say: 'We use substitution. Make $x$ the subject of the linear equation, then put it into the quadratic one. First, number the equations.'
        write: 'Solution'
      - say: 'Equation 1 is $x$ plus $y$ equals 5.'
        write: '$x + y = 5 \quad \text{......(1)}$'
      - say: 'Equation 2 is $x$ squared minus 2 $y$ squared equals 1.'
        write: '$x^{2} - 2y^{2} = 1 \quad \text{......(2)}$'
      - say: 'From equation 1, subtract $y$ from both sides. Call this equation 3. It is written on the card.'
        write: 'From (1): $x = 5 - y \quad \text{......(3)}$'
      - say: 'Substitute equation 3 into equation 2. Watch the card drop into the $x$ slot.'
        doodle_do: [{id: swap, op: move, part: card, path: drop}]
        write: 'Substitute (3) in (2):'
      - say: 'In place of $x$ we write 5 minus $y$, in brackets.'
        write: '$(5 - y)^{2} - 2y^{2} = 1$'
      - say: 'Open the brackets. 5 minus $y$, all squared, gives 25, minus 10 $y$, plus $y$ squared.'
        write: '$25 - 10y + y^{2} - 2y^{2} = 1$'
      - say: 'Collect like terms. $y$ squared minus 2 $y$ squared is negative $y$ squared.'
        write: '$25 - 10y - y^{2} = 1$'
      - say: 'Subtract 1 from both sides, so the right-hand side is zero. 25 minus 1 is 24.'
        write: '$24 - 10y - y^{2} = 0$'
      - say: 'Multiply through by negative 1 so that $y$ squared is positive, and write the terms in order.'
        write: '$y^{2} + 10y - 24 = 0$'
      - section: 'Factorise'
        say: 'The product is $a$ times $c$, so negative 24. The sum is $b$, so 10.'
        write: 'Product $= ac = -24$, Sum $= b = 10$'
      - say: 'Two numbers that multiply to negative 24 and add to 10 are plus 12 and negative 2.'
        write: 'Factors: $+12$ and $-2$'
      - say: 'Replace the middle term, 10 $y$, with 12 $y$ minus 2 $y$.'
        write: '$y^{2} + 12y - 2y - 24 = 0$'
      - say: 'Group in pairs. Take out $y$ from the first pair and negative 2 from the second. Both brackets are $y$ plus 12.'
        write: '$y(y + 12) - 2(y + 12) = 0$'
      - say: 'Take out the common bracket, $y$ plus 12. What is left is $y$ minus 2.'
        write: '$(y + 12)(y - 2) = 0$'
      - say: 'Either $y$ plus 12 is zero or $y$ minus 2 is zero.'
        write: 'Either $y + 12 = 0$ or $y - 2 = 0$'
      - say: 'Therefore $y$ is negative 12 or 2.'
        doodle_do: [{id: swap, op: label, part: eq, text: 'y = −12 or y = 2'}]
        write: '$\therefore y = -12$ or $y = 2$'
      - section: 'Check'
        say: 'Check $y$ equals 2. From equation 3, $x$ is 5 minus 2, which is 3. 3 squared is 9, and 2 times 2 squared is 8. 9 minus 8 is 1.'
        write: '$y = 2$: $x = 3$, $9 - 8 = 1\ \checkmark$'
      - say: 'Check $y$ equals negative 12. $x$ is 5 plus 12, which is 17. 17 squared is 289, and 2 times 144 is 288. 289 minus 288 is 1.'
        write: '$y = -12$: $x = 17$, $289 - 288 = 1\ \checkmark$'
      - say: 'So the values of $y$ are negative 12 and 2, which is option C.'
        write: '$\therefore y = -12, 2$ (C)'
        answer: true
    traps:
      A: 'You went for 12 and negative 2. Those are the right numbers with both signs reversed. From $y$ plus 12 times $y$ minus 2 equals zero, $y$ is negative 12 or 2.'
      B: 'You went for negative 12 and 12. Try $y$ equals 12. Then $x$ is negative 7, and 49 minus 288 is not 1. The values are negative 12 and 2.'
      D: 'You went for 2 and negative 2. 2 works, but $y$ equals negative 2 gives $x$ equals 7, and 49 minus 8 is 41, not 1. The other value is negative 12.'
  24:
    moments:
      - section: 'The question'
        say: 'A figure with $n$ diagonals has $n$ minus 2, all squared, sides. We are given the sides, 25, and must work back to the diagonals, $n$.'
        write: 'Sides $= (n - 2)^{2}$, diagonals $= n$; sides $= 25$'
      - section: 'Solution'
        say: 'Solution. The rule takes the number of diagonals, $n$, and gives the number of sides. Picture it as a machine, with diagonals in and sides out.'
        doodle: {name: 'custom:1987_q24_a', id: mach, caption: 'diagonals in, sides out'}
        write: 'Solution. Diagonals $n \to$ sides $(n - 2)^{2}$'
      - say: 'Here the sides are 25, so set the rule equal to 25.'
        write: '$(n - 2)^{2} = 25$'
        doodle_do: [{id: mach, op: highlight, part: output}]
      - say: 'Take the square root of both sides. A square root can be positive or negative, so we get plus or minus 5.'
        write: '$n - 2 = \pm\sqrt{25} = \pm 5$'
      - say: 'So there are two cases.'
        write: 'Either $n - 2 = 5$ or $n - 2 = -5$'
      - say: 'Add 2 to both sides in each case. 5 plus 2 is 7, and negative 5 plus 2 is negative 3.'
        write: '$n = 7$ or $n = -3$'
      - say: 'A figure cannot have a negative number of diagonals, so we reject negative 3.'
        write: '$n = -3$ is rejected; $\therefore n = 7$'
        doodle_do: [{id: mach, op: label, part: input, text: 'n = 7'}]
      - section: 'Check'
        say: 'To check, 7 minus 2 is 5, and 5 squared is 25, the number of sides we were given.'
        write: 'Check: $(7 - 2)^{2} = 5^{2} = 25$ ✓'
      - say: 'Notice that 25 is the output of the rule, not the input. Putting $n$ equal to 25 into the rule gives 23 squared, which is 529 sides, a different figure.'
        write: 'Not: $(25 - 2)^{2} = 529$'
        point:
          - {line: 8, kind: strike, at: '(25−2)2=529', text: 'not this'}
      - section: 'Answer'
        say: 'Therefore $n$, the number of diagonals, is 7, which is answer choice A.'
        write: '$\therefore n = 7$ (A)'
        answer: true
    traps:
      B: 'You went for 8. Then $n - 2$ is 6, and 6 squared is 36 sides, not 25. We need $n - 2$ to be 5.'
      C: 'You went for 9. That gives 7 squared, which is 49 sides. $(n - 2)^{2} = 25$ means $n - 2$ is 5, so $n$ is 7.'
      D: 'You went for 10. That gives 8 squared, which is 64 sides. Take the square root of 25 to get 5, then add 2, so $n$ is 7.'
  25:
    moments:
      - section: 'The question'
        say: 'The graph shows a cubic function. We want the values of $x$ for which the function vanishes.'
        write: 'Find $x$ for which $f(x)$ vanishes'
        point:
          - {figure: 0, kind: underline, target: 'f(x)', text: 'the cubic'}
      - section: 'Solution'
        say: 'Solution. A function vanishes where its value is zero. So we want the roots of $f(x) = 0$.'
        write: 'Solution: $f(x)$ vanishes $\Rightarrow f(x) = 0$'
      - say: 'On a graph, $f(x)$ is the height of the curve, its $y$-value. $f(x)$ is zero where the curve cuts the $x$-axis.'
        write: '$f(x) = 0$ where the curve cuts the $x$-axis'
        point:
          - {figure: 0, kind: circle, target: 'x', text: 'the x-axis'}
      - say: 'Read off the points from left to right. The curve comes up from below and cuts the $x$-axis at $x$ equals negative 1.'
        write: '1st point: $x = -1$'
        point:
          - {figure: 0, kind: circle, target: '−1'}
      - say: 'It rises to a maximum above the axis, then comes down and passes through the origin, where $x$ is 0.'
        write: '2nd point: $x = 0$'
        point:
          - {figure: 0, kind: circle, target: '0'}
      - say: 'It falls to a minimum below the axis, then rises and cuts the axis at $x$ equals 1.'
        write: '3rd point: $x = 1$'
        point:
          - {figure: 0, kind: circle, target: '1'}
      - say: 'A cubic has at most three roots, and we have found three. So there are no more.'
        write: 'A cubic has at most 3 roots'
      - say: 'Therefore the function vanishes at negative 1, 0 and 1.'
        write: '$\therefore\ x = -1,\ 0,\ 1$'
        point:
          - {figure: 0, kind: circle, target: '−1'}
          - {figure: 0, kind: circle, target: '0'}
          - {figure: 0, kind: circle, target: '1', text: 'all three roots'}
      - section: 'Check'
        say: 'Check with the factor theorem. If negative 1, 0 and 1 are roots, then $x + 1$, $x$ and $x - 1$ are factors, so $f(x)$ is $k$ times their product.'
        write: 'Check: $f(x) = kx(x - 1)(x + 1)$'
      - say: 'Put in $x$ equals 1, and the factor 1 minus 1 is zero, so the whole product is zero. The same happens at 0 and negative 1.'
        write: '$f(1) = k(1)(1 - 1)(1 + 1) = 0\ \checkmark$'
      - say: 'Therefore the function vanishes at negative 1, 0 and 1, which is answer choice A.'
        write: '$\therefore\ x = -1,\ 0,\ 1$'
        answer: true
    traps:
      B: 'You went for negative 1 is less than $x$ is less than 1. That is a whole stretch of the axis, where the curve is mostly above or below it. The function vanishes only at the exact points where the curve cuts the axis, at negative 1, 0 and 1.'
      C: 'You went for $x$ less than or equal to negative 1. That is a region to the left, where the curve is below the axis. The function is zero only where the curve cuts the axis, at negative 1, 0 and 1.'
      D: 'You went for $x$ greater than 1. There the curve is above the axis, so the function is positive, not zero. It vanishes only at negative 1, 0 and 1.'
  26:
    moments:
      - section: 'The question'
        say: 'Solve $x$ minus 1 is greater than 4 times $x$ plus 2. Two options differ only in the direction of the sign, so the step to watch is the division at the end.'
        write: '$x - 1 > 4(x + 2)$'
      - say: 'Solution. Solve it like an equation, with one rule, which is that multiplying or dividing both sides by a negative number reverses the sign.'
        write: 'Solution'
      - say: 'Open the bracket. 4 times $x$ is $4x$, and 4 times 2 is 8.'
        write: '$x - 1 > 4x + 8$'
      - say: 'Collect like terms, with $x$ terms on the left and numbers on the right. Subtract $4x$ from both sides, and add 1 to both sides.'
        write: '$x - 4x > 8 + 1$'
      - say: '$x$ minus $4x$ is minus $3x$, and 8 plus 1 is 9.'
        write: '$-3x > 9$'
      - section: 'Divide by a negative'
        say: 'Now divide both sides by minus 3. It is negative, so the greater-than sign reverses to less-than.'
        write: 'Divide by $-3$, reverse the sign: $\ x < \dfrac{9}{-3}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '[[−3]]x'}, at: 'by [[−3]]', text: 'negative'}
      - say: '9 divided by minus 3 is minus 3.'
        write: '$\therefore\ x < -3$'
      - section: 'The number line'
        say: 'On a number line, we draw an open circle at minus 3, because minus 3 is not included, and an arrow to the left.'
        diagram: {id: n, kind: numberline, range: [-7, 2]}
        diagram_do:
          - {id: n, op: interval, to: -3, to_open: true, text: 'x < −3', answer: true, 'on': 'open circle'}
      - section: 'Check'
        say: 'Check with minus 4, on the arrow. The left side is minus 4 minus 1, which is minus 5. The right side is 4 times minus 2, which is minus 8.'
        write: 'Check $x = -4$: $\ -4 - 1 = -5,\ \ 4(-4 + 2) = -8$'
        diagram_do:
          - {id: n, op: point, x: -4, text: 'test −4'}
      - say: 'Minus 5 is greater than minus 8, so it works.'
        write: '$-5 > -8\ \checkmark$'
      - say: 'So the solution is $x$ less than minus 3, which is option B.'
        write: '$x < -3$'
        answer: true
    traps:
      A: 'You went for $x$ greater than minus 3. That divides by minus 3 without reversing the sign. Dividing by a negative reverses the inequality, so it''s $x$ less than minus 3.'
      C: 'You went for 2 less than $x$ less than 3. This inequality has only one boundary, at minus 3. Solving gives $x$ less than minus 3.'
      D: 'You went for minus 3 less than $x$ less than minus 2. There is no second boundary at minus 2. Solving step by step gives $x$ less than minus 3.'
  27:
    moments:
      - section: 'The question'
        say: 'You cannot cancel the $x$ squared terms here. A fraction like this only simplifies by cancelling whole brackets, so first we make the brackets.'
        write: '$\dfrac{x^{2} - y^{2}}{2x^{2} + xy - y^{2}}$'
      - section: 'Solution'
        say: 'We factorise the numerator and the denominator completely, then cancel any common factor.'
        write: 'Solution'
      - say: 'The numerator is a difference of two squares, so $x$ squared minus $y$ squared is $x$ minus $y$, times $x$ plus $y$.'
        write: 'Numerator: $x^{2} - y^{2} = (x - y)(x + y)$'
      - section: 'Factorise the denominator'
        say: 'Now the denominator, 2 $x$ squared plus $x y$ minus $y$ squared. We factorise it by product and sum, just like a quadratic in $x$.'
        write: 'Denominator: $2x^{2} + xy - y^{2}$'
      - say: 'The product is 2 times negative 1, the first and last coefficients, which gives negative 2. The sum is the middle coefficient, 1.'
        write: 'Product $= 2 \times (-1) = -2$, Sum $= 1$'
      - say: 'Two numbers that multiply to negative 2 and add to 1 are plus 2 and negative 1.'
        write: 'Factors: $+2$ and $-1$'
      - say: 'Replace the middle term, $x y$, with 2 $x y$ minus $x y$.'
        write: '$= 2x^{2} + 2xy - xy - y^{2}$'
      - say: 'Group in pairs. From the first pair take out 2 $x$, and from the second take out negative $y$. Both brackets are $x$ plus $y$.'
        write: '$= 2x(x + y) - y(x + y)$'
      - say: 'Take out the common bracket, $x$ plus $y$. What is left is 2 $x$ minus $y$.'
        write: '$= (x + y)(2x - y)$'
      - section: 'Cancel'
        say: 'Now write the fraction with both parts factorised. Picture each factor as a tile.'
        doodle: {name: 'custom:1987_q27_a', id: tiles, caption: 'factor tiles', size: scene}
        write: '$\dfrac{(x - y)(x + y)}{(2x - y)(x + y)}$'
      - say: 'The bracket $x$ plus $y$ is on top and below, so cancel the common factor. Cross out that pair of tiles.'
        doodle_do: [{id: tiles, op: cross, part: t2}, {id: tiles, op: cross, part: b2}]
        write: '$= \dfrac{x - y}{2x - y}$'
      - section: 'Check'
        say: 'Check with $x$ equals 2 and $y$ equals 1. The question gives 4 minus 1, over 8 plus 2 minus 1, so 3 over 9, which is 1 over 3.'
        write: '$x = 2, y = 1$: $\dfrac{4 - 1}{8 + 2 - 1} = \dfrac{1}{3}$'
      - say: 'Our answer gives 2 minus 1, over 4 minus 1, which is also 1 over 3.'
        write: '$\dfrac{2 - 1}{4 - 1} = \dfrac{1}{3}\ \checkmark$'
      - say: 'The two tiles left are the answer, $x$ minus $y$, over 2 $x$ minus $y$, which is option C.'
        doodle_do: [{id: tiles, op: circle, part: t1}, {id: tiles, op: circle, part: b1}]
        write: '$\therefore \dfrac{x - y}{2x - y}$ (C)'
        answer: true
    traps:
      A: 'You went for $x$ plus $y$ over 2 $x$ plus $y$. The common factor is $x$ plus $y$, and that is what cancels. What is left on top is $x$ minus $y$, and below, 2 $x$ minus $y$.'
      B: 'You went for $x$ plus $y$ over 2 $x$ minus $y$. That keeps the bracket that cancels. $x$ plus $y$ is on top and below, so it goes, leaving $x$ minus $y$ on top.'
      D: 'You went for $x$ minus $y$ over 2 $x$ plus $y$. That factorises the denominator as 2 $x$ plus $y$, times $x$ minus $y$, which opens with negative $x y$ in the middle. The factors are $x$ plus $y$ and 2 $x$ minus $y$.'
  28:
    moments:
      - section: 'The question'
        say: 'Find the minimum value of $y$. Many students stop at the $x$ of the turning point. The question wants the value of $y$ there.'
        write: '$y = x^{2} - 6x + 8$'
        diagram:
          id: g
          kind: graph
          x: [-1, 7]
          y: [-2, 10]
          plots:
            - {fn: 'x^2 - 6x + 8', label: 'y = x² − 6x + 8', colour: blue}
      - section: 'Solution'
        say: 'Solution. Differentiate term by term, so multiply by the power, then reduce the power by 1. $x$ squared gives $2x$, minus $6x$ gives minus 6, and the constant 8 gives 0.'
        write: '$\dfrac{dy}{dx} = 2x - 6$'
      - section: 'Turning point'
        say: 'At the turning point, the gradient is zero. So we write that at turning point, $\dfrac{dy}{dx}$ equals 0.'
        'on': 'turning point'
        write: 'At turning point, $\dfrac{dy}{dx} = 0$'
      - say: 'So $2x$ minus 6 equals 0.'
        write: '$2x - 6 = 0$'
        point:
          - {line: 3, kind: move, from: {line: 1, at: '= [[2x − 6]]'}, at: '2x − 6', text: 'dy/dx'}
      - say: 'Add 6 to both sides. $2x$ equals 6.'
        write: '$2x = 6$'
      - say: 'Divide both sides by 2. $x$ equals 6 over 2, which is 3.'
        write: '$x = \dfrac{6}{2} = 3$'
      - section: 'Second derivative'
        say: 'Is it a maximum or a minimum? Differentiate again. $2x$ gives 2, and minus 6 gives 0.'
        write: '$\dfrac{d^{2}y}{dx^{2}} = 2$'
      - say: 'The second derivative is positive, greater than zero. A positive second derivative means a minimum, so the curve is a valley, as on the graph.'
        'on': 'positive second'
        write: '$\dfrac{d^{2}y}{dx^{2}} = 2 > 0$, $\ \therefore$ minimum'
        diagram_do:
          - {id: g, op: vertex, part: 'plot:1', text: 'minimum', on: valley}
      - section: 'Minimum value'
        say: 'Now the value. Substitute $x$ equals 3 into the original equation, with the 3 in brackets.'
        write: '$y_{\min} = (3)^{2} - 6(3) + 8$'
      - say: '3 squared is 9, and 6 times 3 is 18.'
        write: '$= 9 - 18 + 8$'
      - say: '9 minus 18 is minus 9, and minus 9 plus 8 is minus 1.'
        write: '$= -1$'
        diagram_do:
          - {id: g, op: label, part: 'point:1', text: 'y min = −1', colour: green}
      - section: 'Check'
        say: 'Here is an exam tip, as a check. For a quadratic, the turning point is at $x$ equals minus $b$ over $2a$. Here $a$ is 1 and $b$ is minus 6.'
        write: 'Exam tip: $x = -\dfrac{b}{2a} = -\dfrac{(-6)}{2(1)} = 3\ \checkmark$'
      - say: 'It agrees. Therefore the minimum value of $y$ is minus 1, which is answer choice D.'
        write: '$\therefore$ minimum value of $y = -1$'
        answer: true
    traps:
      A: 'You went for 8. That is the value of $y$ when $x$ is 0, where the curve meets the $y$-axis. At turning point, $\dfrac{dy}{dx} = 0$ gives $x = 3$, and there $y$ is minus 1.'
      B: 'You went for 3. That is the $x$ of the turning point, not the minimum value of $y$. Substitute $x = 3$ into the equation, and 9 minus 18 plus 8 is minus 1.'
      C: 'You went for 0. That is where the curve crosses the $x$-axis, at $x$ equals 2 and 4. Between them the curve dips below the axis, down to minus 1.'
  29:
    moments:
      - section: 'The question'
        say: 'We take the first 21 terms of negative 10, negative 8, negative 6, and so on. Some are negative and some positive. What do they add up to?'
        write: 'Sum of the first 21 terms of $-10,\ -8,\ -6,\ \ldots$'
        doodle: {name: 'custom:1987_q29_a', id: bars, caption: '21 terms as bars', size: scene}
      - section: 'Solution'
        say: 'Solution. Each term is 2 more than the one before, so this is an A.P., an arithmetic progression. The common difference is the second term minus the first.'
        write: 'Solution: $d = T_{2} - T_{1} = -8 - (-10) = 2$'
      - say: 'List what is given. The first term $a$ is negative 10, $d$ is 2, and we want 21 terms, so $n$ is 21.'
        write: '$a = -10,\quad d = 2,\quad n = 21$'
        doodle_do:
          - {id: bars, op: circle, part: first, 'on': 'first term'}
        point:
          - {line: 2, kind: move, from: {line: 1, at: '= 2'}, at: 'd = 2', text: 'd'}
      - say: 'The sum of the first $n$ terms of an A.P. is $n$ over 2, times, 2 $a$ plus $n$ minus 1 times $d$.'
        write: '$S_{n} = \dfrac{n}{2}[2a + (n - 1)d]$'
      - say: 'Substitute. $n$ is 21, $a$ is negative 10 in a bracket, and $d$ is 2.'
        write: '$S_{21} = \dfrac{21}{2}[2(-10) + (21 - 1)(2)]$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: 'a = −10'}, at: '(−10)', text: 'a'}
          - {line: 4, kind: move, from: {line: 2, at: 'n = 21'}, at: '(21 − 1)', text: 'n'}
      - say: 'Inside the square bracket, 2 times negative 10 is negative 20. 21 minus 1 is 20, and 20 times 2 is 40.'
        write: '$= \dfrac{21}{2}[-20 + 40]$'
      - say: 'Negative 20 plus 40 is 20.'
        write: '$= \dfrac{21}{2} \times 20$'
      - say: '20 divided by 2 is 10, and 21 times 10 is 210.'
        write: '$= 21 \times 10 = 210$'
      - say: 'Therefore the sum of the first 21 terms is 210.'
        write: '$\therefore\ S_{21} = 210$'
      - section: 'Check'
        say: 'Check with the other sum formula. First the last term, where $l$ is $a$ plus 20 $d$, so negative 10 plus 40, which is 30. That is the tallest bar.'
        write: 'Check: $l = T_{21} = -10 + 20(2) = 30$'
        doodle_do:
          - {id: bars, op: label, part: last, text: '30'}
        point:
          - {line: 9, kind: highlight, at: '= 30', to: {doodle: bars, part: last}}
      - say: '$S$ is $n$ over 2, times $a$ plus $l$, so 21 over 2, times 20, is 210 again. Levelled off, every bar is 10 tall.'
        write: '$S_{21} = \dfrac{n}{2}(a + l) = \dfrac{21}{2}(-10 + 30) = 210\ \checkmark$'
        doodle_do:
          - {id: bars, op: stage, stage: 'custom:1987_q29_a2', 'on': 'Levelled off'}
      - say: 'Therefore the sum is 210, which is answer choice D.'
        write: '$\therefore\ S_{21} = 210$'
        answer: true
    traps:
      A: 'You went for 180. That is the sum of only 20 terms. The question wants 21 terms, so $n$ is 21, and $S_{21}$ is 21 over 2 times 20, which is 210.'
      B: 'You went for 190. Check the bracket. 2 times negative 10 is negative 20, and 20 times 2 is 40, so it is 20. Then 21 over 2 times 20 is 210.'
