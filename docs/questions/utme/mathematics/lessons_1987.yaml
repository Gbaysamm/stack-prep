  19:
    moments:
      - say: '$P$ varies inversely as $V$, and $V$ varies directly as $R$ squared. We want an equation linking $P$ straight to $R$, given that $R$ is 7 when $P$ is 2.'
        write: '$P \propto \dfrac{1}{V},\quad V \propto R^{2}$'
      - say: 'First we turn each sentence into an equation. Inversely means that as $V$ goes up, $P$ goes down, so $P$ is a constant, $k$, over $V$.'
        write: '$P = \dfrac{k}{V}$'
      - say: 'Directly means $V$ grows in step with $R$ squared, so $V$ is another constant, $c$, times $R$ squared.'
        write: '$V = cR^{2}$'
      - say: 'Now we cut out $V$. Wherever the first equation has $V$, we put $c R$ squared instead.'
        write: '$P = \dfrac{k}{cR^{2}}$'
      - say: 'The two constants always appear together, so let''s call $k$ over $c$ one new constant, $K$.'
        write: 'Let $K = \dfrac{k}{c}$: $\ P = \dfrac{K}{R^{2}}$'
      - say: 'To find $K$, use the pair we are given: $R$ is 7 when $P$ is 2.'
        write: '$2 = \dfrac{K}{7^{2}}$'
      - say: '7 squared is 49.'
        write: '$2 = \dfrac{K}{49}$'
      - say: 'Multiply both sides by 49. 2 times 49 is 98.'
        write: '$K = 2 \times 49 = 98$'
      - say: 'Put $K$ equals 98 back into our equation.'
        write: '$P = \dfrac{98}{R^{2}}$'
      - say: 'Multiply both sides by $R$ squared to tidy it up.'
        write: '$PR^{2} = 98$'
      - say: 'Quick check: with $R$ equals 7, $P$ times 49 is 98, so $P$ is 2. It works.'
        write: 'Check: $P \times 49 = 98 \Rightarrow P = 2$'
      - say: 'So the relationship is $P R$ squared equals 98, which is answer choice B.'
        write: 'Therefore $PR^{2} = 98$'
        answer: true
    traps:
      A: 'You went for $P$ equals 98 $R$ squared. That makes $P$ grow as $R$ grows, but an inverse link followed by a direct link makes $P$ shrink as $R$ grows. It''s 98 over $R$ squared.'
      C: 'You went for $P$ equals 1 over 98 $R$. The 98 belongs on top, and $R$ must be squared. $P$ is 98 over $R$ squared.'
      D: 'You went for $P$ equals $R$ squared over 98. That''s a direct link, with $P$ growing as $R$ grows. Also, with $R$ as 7 it gives a half, not 2. The answer is $P R$ squared equals 98.'
  20:
    moments:
      - say: 'We want to make $y$ the subject of $Z$ equals $x$ squared plus 1 over $y$ cubed.'
        write: '$Z = x^{2} + \dfrac{1}{y^{3}}$'
      - say: 'To make $y$ the subject, we get the term with $y$ by itself, then undo what has been done to $y$, one layer at a time. Here $y$ was cubed, then put underneath a 1, then added to $x$ squared.'
        write: 'Layers on $y$: cube it, put it under $1$, add $x^{2}$'
      - say: 'So we peel the outside layer first: subtract $x$ squared from both sides.'
        write: '$Z - x^{2} = \dfrac{1}{y^{3}}$'
      - say: 'Now $y$ cubed is on the bottom. If two things are equal, their reciprocals are equal too, so we flip both sides upside down.'
        write: '$\dfrac{1}{Z - x^{2}} = y^{3}$'
      - say: 'Let''s write it the other way round, with $y$ cubed on the left.'
        write: '$y^{3} = \dfrac{1}{Z - x^{2}}$'
      - say: 'Last, take the cube root of both sides. The cube root of a fraction is the cube root of the top over the cube root of the bottom, and the cube root of 1 is 1.'
        write: '$y = \dfrac{\sqrt[3]{1}}{\sqrt[3]{Z - x^{2}}} = \dfrac{1}{\sqrt[3]{Z - x^{2}}}$'
      - say: 'A cube root is the same as the power 1 over 3. Notice that we take the cube root of the whole bracket, $Z$ minus $x$ squared, together.'
        write: '$= \dfrac{1}{(Z - x^{2})^{\frac{1}{3}}}$'
      - say: 'Let''s check with numbers: $x$ equals 1 and $Z$ equals 9. Then 9 equals 1 plus 1 over $y$ cubed, so 1 over $y$ cubed is 8.'
        write: 'Check: $9 = 1 + \dfrac{1}{y^{3}} \Rightarrow \dfrac{1}{y^{3}} = 8$'
      - say: 'Flip it: $y$ cubed is 1 over 8. And 2 cubed is 8, so $y$ is 1 over 2.'
        write: '$y^{3} = \dfrac{1}{8} \Rightarrow y = \dfrac{1}{2}$'
      - say: 'Our formula gives 1 over the cube root of 9 minus 1. 9 minus 1 is 8, and the cube root of 8 is 2, so we get 1 over 2. It matches.'
