  32:
    moments:
      - section: 'The question'
        say: 'A line parallel to the base cuts off a small triangle at the top. The triangles are similar, and with areas that means squaring. Then watch which two pieces are compared.'
        write: '$QR \parallel TS$, $QR : TS = 2 : 3$, $\triangle PQR : QRST = ?$'
        point:
          - {figure: 0, kind: highlight, target: QR, text: '2'}
          - {figure: 0, kind: highlight, target: TS, text: '3'}
      - section: 'Solution'
        say: 'Solution. We compare the small triangle $PQR$ with the big triangle $PTS$. First we show they have the same angles.'
        write: 'Solution. In $\triangle PQR$ and $\triangle PTS$:'
      - say: '$PT$ crosses the parallels $QR$ and $TS$. Angle $PQR$ and angle $PTS$ make an F, so the reason is corresponding angles.'
        write: '$\angle PQR = \angle PTS$ (corr. $\angle$s, $QR \parallel TS$)'
        point:
          - {figure: 0, kind: arc, target: PQR}
          - {figure: 0, kind: arc, target: PTS}
      - say: 'In the same way, $PS$ crosses them, and angle $PRQ$ equals angle $PST$. The reason is corresponding angles.'
        write: '$\angle PRQ = \angle PST$ (corr. $\angle$s, $QR \parallel TS$)'
        point:
          - {figure: 0, kind: arc, target: PRQ}
          - {figure: 0, kind: arc, target: PST}
      - say: 'And the angle at $P$ belongs to both triangles, so it is a common angle.'
        write: '$\angle QPR = \angle TPS$ (common)'
        point:
          - {figure: 0, kind: arc, target: QPR}
      - say: 'All three angles match, so the triangles are similar, because they are equiangular.'
        write: '$\triangle PQR \;|||\; \triangle PTS$ (equiangular)'
      - say: 'So all three pairs of matching sides are in the same ratio, and $QR$ over $TS$ gives it, which is 2 over 3.'
        write: '$\dfrac{PQ}{PT} = \dfrac{QR}{TS} = \dfrac{PR}{PS} = \dfrac{2}{3}$'
      - say: 'For similar figures, the ratio of the areas is the square of the ratio of the sides. Make each side 2 times longer and the area is 4 times bigger.'
        write: '$\dfrac{\text{Area } \triangle PQR}{\text{Area } \triangle PTS} = \left(\dfrac{2}{3}\right)^{2}$ (similar $\triangle$s)'
      - say: '2 squared is 4, and 3 squared is 9.'
        write: '$= \dfrac{4}{9}$'
      - say: 'Let the small triangle have area $4k$. Then the big triangle has area $9k$.'
        write: 'Let area $\triangle PQR = 4k$, area $\triangle PTS = 9k$'
      - say: 'The trapezium $QRST$ is the big triangle with the small one taken away. $9k$ minus $4k$ is $5k$.'
        write: 'Area $QRST = 9k - 4k = 5k$'
        point:
          - {figure: 0, kind: label, target: {x: 155, y: 228}, text: '5k'}
      - say: 'Now compare the small triangle with the trapezium. The $k$ cancels.'
        write: '$\triangle PQR : QRST = 4k : 5k = 4 : 5$'
      - section: 'Check'
        say: 'Check with heights. The heights are in the same ratio, so call them $2h$ and $3h$, and the trapezium''s height is $h$. The small triangle has area half of 2 times $2h$, which is $2h$.'
        write: 'Area $\triangle PQR = \tfrac{1}{2}(2)(2h) = 2h$'
      - say: 'For the trapezium, take half the sum of the parallel sides, times the height. Half of 2 plus 3, times $h$, is five halves $h$.'
        write: 'Area $QRST = \tfrac{1}{2}(2 + 3)h = \tfrac{5}{2}h$'
      - say: 'For $2h$ to five halves $h$, multiply both by 2, and it is 4 to 5 again.'
        write: '$2h : \tfrac{5}{2}h = 4 : 5$ $\checkmark$'
      - say: 'Therefore the ratio is 4 to 5, which is option B.'
        write: '$\therefore$ ratio $= 4 : 5$ (B)'
        answer: true
    traps:
      A: 'You went for 4 to 9. That compares the small triangle with the whole big triangle. The trapezium is only the part left over, $9k$ minus $4k$, which is $5k$. So it is 4 to 5.'
      C: 'You went for 1 to 3. That does not come from squaring the sides. The areas are 4 to 9, the trapezium is 9 minus 4, which is 5, and the ratio is 4 to 5.'
      D: 'You went for 2 to 3. That is the ratio of the sides. For areas we square it, 4 to 9, and then the trapezium is 5, so it is 4 to 5.'
