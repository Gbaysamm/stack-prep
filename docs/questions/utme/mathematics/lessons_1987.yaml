        doodle: {name: 'custom:1987_q47_a', id: board, caption: 'Goals scored by 40 teams'}
        write: 'Goals $x$: $0$ to $6$; frequencies $f$: $4, 3, 15, 16, 1, 0, 1$'
      - say: 'Each column says how many teams scored that many goals. For example, 15 teams scored 2 goals each, so together they scored 15 lots of 2. So we multiply each number of goals by its frequency, and add them all up. Picture one ball for each team, coloured by how many goals it scored.'
        doodle: {id: teams, caption: 'one ball per team, by goals', repeat: [{name: 'ball-white', n: 4}, {name: 'ball-yellow', n: 3}, {name: 'ball-blue', n: 15}, {name: 'ball-green', n: 16}, {name: 'ball-red', n: 1}, {name: 'ball-black', n: 1}], layout: grid}
        write: 'Total goals $= \sum fx$'
