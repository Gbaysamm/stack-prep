      - say: 'The room''s diagonal runs from a bottom corner to the opposite top corner. Its angle with the floor is measured against the floor diagonal directly underneath it.'
        write: 'Angle between room diagonal and floor diagonal'
        point:
          - {figure: sketch_b, kind: highlight, target: BH, text: 'room diagonal'}
          - {figure: sketch_b, kind: underline, target: BD, text: 'floor diagonal'}
      - say: 'Pythagoras: the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hypotenuse}^{2} = \text{opposite}^{2} + \text{adjacent}^{2}$'
      - say: 'So first we need the floor diagonal. The floor is a 12 by 9 rectangle, and its diagonal is the hypotenuse of a right-angled triangle, so we use Pythagoras.'
        write: 'Floor diagonal $= \sqrt{12^{2} + 9^{2}}$'
        point:
          - {figure: sketch_b, kind: highlight, target: BC, text: '9'}
          - {figure: sketch_b, kind: highlight, target: CD, text: '12'}
