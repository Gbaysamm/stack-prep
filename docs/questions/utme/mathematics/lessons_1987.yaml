        write: '$2 \times 15 = 30,\quad 3 \times 16 = 48$'
      - say: '4 goals times 1 team is 4. 5 goals times 0 teams is 0. 6 goals times 1 team is 6.'
        write: '$4 \times 1 = 4,\quad 5 \times 0 = 0,\quad 6 \times 1 = 6$'
      - say: 'Now add all those products.'
        write: '$\sum fx = 0 + 3 + 30 + 48 + 4 + 0 + 6$'
      - say: '3 plus 30 is 33, and 33 plus 48 is 81. That leaves the 4 and the 6.'
        write: '$= 81 + 4 + 6$'
      - say: '81 plus 4 is 85, and 85 plus 6 is 91. Write that on the scoreboard.'
        doodle_do: [{id: board, op: label, part: board, text: '91 goals in all'}]
        write: '$= 85 + 6 = 91$'
        point:
          - {line: 7, kind: highlight, at: '91', to: {doodle: board, part: board}}
      - say: 'Count the balls: one for each team. A check on the table: the frequencies, 4 plus 3 plus 15 plus 16 plus 1 plus 0 plus 1, add to 40, the number of teams in the question.'
        doodle_do: [{id: teams, op: count}]
        write: 'Check: $\sum f = 4 + 3 + 15 + 16 + 1 + 0 + 1 = 40$'
      - say: 'So the teams scored 91 goals in total, which is answer choice C.'
        write: 'Total goals $= 91$'
        answer: true
    traps:
      A: 'You went for 21. That''s 0 plus 1 plus 2, up to 6: just the goal numbers added. Each must be multiplied by how many teams scored it, which gives 91.'
      B: 'You went for 40. That''s the number of teams, the sum of the frequencies. The question asks for goals: multiply each goal count by its frequency, and add, to get 91.'
      D: 'You went for 96. Check the additions: 0, 3, 30, 48, 4, 0 and 6 add up to 91.'
  48:
    moments:
      - say: 'The marks are 3, 2, 8, 5, 7, 12, 9 and 14. $P$ is the mean and $Q$ is the median. We want $P$ plus $Q$. Picture the eight marks as bars.'
        doodle: {name: 'custom:1987_q48_a', id: bars, caption: 'eight marks as bars', size: scene}
        write: 'Marks: $3, 2, 8, 5, 7, 12, 9, 14$'
      - say: 'First the mean, $P$. The mean is the total of the marks divided by how many marks there are.'
        write: '$P = \dfrac{\text{sum of marks}}{\text{number of marks}}$'
      - say: 'So add the eight marks together.'
        write: 'Sum $= 3 + 2 + 8 + 5 + 7 + 12 + 9 + 14$'
      - say: 'The first five: 3 plus 2 is 5, plus 8 is 13, plus 5 is 18, plus 7 is 25.'
        write: '$= 25 + 12 + 9 + 14$'
      - say: '25 plus 12 is 37, plus 9 is 46, plus 14 is 60.'
        write: '$= 60$'
      - say: 'There are 8 marks, so the mean is 60 divided by 8.'
        write: '$P = \dfrac{60}{8}$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
          - {line: 5, kind: move, from: {line: 4, at: '= 60'}, at: '8[[60]]', text: 'sum'}
      - say: 'The mean is the height all eight bars would have if we levelled them off. 8 times 7 is 56, with 4 left over, and 4 over 8 is a half. So the mean is 7.5.'
        doodle_do: [{id: bars, op: stage, stage: 'custom:1987_q48_a2'}]
        write: '$= 7\tfrac{4}{8} = 7.5$'
        point:
          - {line: 6, kind: highlight, at: '7.5', to: {doodle: bars, part: level}}
      - say: 'Now the median, $Q$. The median is the middle value, so the marks must be put in order first. Line the bars up from shortest to tallest.'
        doodle_do: [{id: bars, op: stage, stage: 'custom:1987_q48_a3'}]
        write: 'In order: $2,\ 3,\ 5,\ 7,\ 8,\ 9,\ 12,\ 14$'
      - say: 'Look at the two orange bars in the middle. With 8 values there are two in the middle, the 4th and the 5th. They are 7 and 8.'
        doodle_do: [{id: bars, op: circle, part: mid}]
        write: '4th $= 7$, 5th $= 8$'
        point:
          - {line: 7, kind: circle, at: '7, 8', text: 'middle two'}
          - {line: 8, kind: highlight, at: '4th = 7', to: {doodle: bars, part: mid}}
      - say: 'Go halfway between the two orange bars. The median is the average of those two. 7 plus 8 is 15, and 15 divided by 2 is 7.5.'
        doodle_do: [{id: bars, op: label, part: mid, text: 'halfway: 7.5'}]
        write: '$Q = \dfrac{7 + 8}{2} = \dfrac{15}{2} = 7.5$'
      - say: 'Now add the mean and the median.'
        write: '$P + Q = 7.5 + 7.5$'
        point:
          - {line: 10, kind: move, from: {line: 6, at: '= 7.5'}, at: '[[7.5]] +', text: 'mean'}
          - {line: 10, kind: move, from: {line: 9, at: '= 7.5'}, at: '+ 7.5', text: 'median'}
      - say: '7.5 plus 7.5 is 15.'
        write: '$= 15$'
      - say: 'So $P$ plus $Q$ is 15, which is answer choice D.'
        write: 'Therefore $P + Q = 15$'
        answer: true
    traps:
      A: 'You went for 18. Check the mean: the marks add to 60, and 60 over 8 is 7.5. The median is also 7.5, so the sum is 15.'
      B: 'You went for 17 and a half. The mean is 7.5 and the median, the average of 7 and 8, is also 7.5. Together they make 15.'
      C: 'You went for 16. The median is the average of the two middle marks, 7 and 8, which is 7.5, not 8. So $P$ plus $Q$ is 7.5 plus 7.5, which is 15.'
  49:
    moments:
      - say: 'The table gives the scores in a music test and how many students got each. $C F$ of $x$ is the number of students who scored $x$ or less. We want $C F$ of 6.'
        write: 'Find $CF(6)$: students scoring $6$ or less'
      - say: 'So we need everyone who scored 6 or less. That means adding the numbers of students for scores 1, 2, 3, 4, 5 and 6. Picture a jar that collects all of those students.'
        doodle: {name: 'custom:1987_q49_a', id: jar, caption: 'everyone who scored 6 or less'}
        write: '$CF(6) = 3 + 6 + 10 + 8 + 6 + 5$'
        point:
          - {line: 0, kind: underline, at: '6 or less', text: 'up to 6'}
      - say: 'Pour in the first two scores. Let''s build the running total. 3 plus 6 is 9.'
        doodle_do: [{id: jar, op: fill, to: 0.16}]
        write: '$= 9 + 10 + 8 + 6 + 5$'
      - say: '9 plus 10 is 19.'
        write: '$= 19 + 8 + 6 + 5$'
      - say: '19 plus 8 is 27. The jar is filling.'
        doodle_do: [{id: jar, op: fill, to: 0.48}]
        write: '$= 27 + 6 + 5$'
      - say: '27 plus 6 is 33. That''s everyone up to a score of 5.'
        write: '$= 33 + 5$'
      - say: 'Now include the 5 students who scored exactly 6: 33 plus 5 is 38. That is everyone in the jar.'
        doodle_do: [{id: jar, op: fill, to: 0.68}, {id: jar, op: label, part: count, text: '38'}]
        write: '$= 38$'
        point:
          - {line: 6, kind: highlight, at: '38', to: {doodle: jar, part: count}}
      - say: 'A check from the other end. First, all the students: 3, 6, 10, 8, 6, 5, 2, 4 and 12 add up to 56.'
        write: 'Total $= 3 + 6 + 10 + 8 + 6 + 5 + 2 + 4 + 12 = 56$'
      - say: 'Those who scored more than 6, that is 7, 8 or 9, are 2 plus 4 plus 12, which is 18. And 56 minus 18 is 38 again.'
        write: 'Above 6: $2 + 4 + 12 = 18$, so $56 - 18 = 38$'
      - say: 'So $C F$ of 6 is 38, which is answer choice B.'
        write: 'Therefore $CF(6) = 38$'
        answer: true
    traps:
      A: 'You went for 40. That''s $C F$ of 7: it adds in the 2 students who scored 7. Stop at a score of 6: the running total is 3, 9, 19, 27, 33, 38.'
      C: 'You went for 33. That''s $C F$ of 5; it stops one score short. "Less than or equal to 6" includes the 5 students who scored exactly 6, making 38.'
      D: 'You went for 5. That''s only the students who scored exactly 6. $C F$ of 6 counts everyone who scored 6 or less, which is 38.'
  50:
    moments:
      - say: 'We have five shapes: a square, a rectangle, a rhombus, a kite and a trapezium. We want the probability that one picked at random is a parallelogram. Picture the five shapes written on slips in a box.'
        doodle: {name: 'custom:1987_q50_a', id: box, caption: 'five shapes on slips', size: scene}
        write: 'Shapes: square, rectangle, rhombus, kite, trapezium'
      - say: 'Let me draw the five shapes.'
        show_sketch: true
      - say: 'A parallelogram is a four-sided shape with both pairs of opposite sides parallel. Let''s test each shape against that.'
        write: 'Parallelogram: both pairs of opposite sides parallel'
      - say: 'A square: both pairs of opposite sides are parallel. Yes.'
        write: 'Square: yes'
        point:
          - {figure: sketch, kind: circle, target: square}
      - say: 'A rectangle: both pairs of opposite sides are parallel too. Yes.'
        write: 'Rectangle: yes'
        point:
          - {figure: sketch, kind: circle, target: rectangle}
      - say: 'A rhombus: all its sides are equal, and its opposite sides are parallel. Yes.'
        write: 'Rhombus: yes'
        point:
          - {figure: sketch, kind: circle, target: rhombus}
      - say: 'Cross the kite slip out. A kite: its equal sides are next to each other, and its opposite sides are not parallel. No.'
        doodle_do: [{id: box, op: cross, part: kite}]
        write: 'Kite: no'
        point:
          - {figure: sketch, kind: strike, target: kite}
      - say: 'Cross the trapezium slip out too. A trapezium: it has only one pair of parallel sides. No.'
        doodle_do: [{id: box, op: cross, part: trap}]
        write: 'Trapezium: no'
        point:
          - {figure: sketch, kind: strike, target: trapezium}
      - say: 'Three slips are left standing. So 3 of the 5 shapes are parallelograms: the square, the rectangle and the rhombus.'
        doodle_do: [{id: box, op: highlight, part: sq}, {id: box, op: highlight, part: rect}, {id: box, op: highlight, part: rhom}]
        write: 'Parallelograms: $3$ out of $5$'
      - say: 'Probability is the number of favourable outcomes over the total number of outcomes.'
        write: 'Probability $= \dfrac{\text{favourable}}{\text{total}}$'
      - say: 'Write it on the box. That is 3 over 5, which is answer choice A.'
        doodle_do: [{id: box, op: label, part: count, text: '3 out of 5'}]
        write: '$= \dfrac{3}{5}$'
        point:
          - {line: 9, kind: box, text: 'the rule'}
          - {line: 8, kind: arrow, at: '3 out of 5', text: 'counted'}
          - {line: 10, kind: highlight, at: '= 53', to: {doodle: box, part: count}}
        answer: true
    traps:
      B: 'You went for 2 over 5. That leaves out one of the parallelograms. The square, the rectangle and the rhombus all have both pairs of opposite sides parallel, so it''s 3 out of 5.'
      C: 'You went for 4 over 5. That counts the kite or the trapezium too. A kite has no parallel sides, and a trapezium has only one pair, so neither is a parallelogram: 3 out of 5.'
      D: 'You went for 1 over 5. None of the shapes is named "parallelogram", but squares, rectangles and rhombuses are all special parallelograms. That makes 3 out of 5.'
