        show_sketch: sketch_c
        point:
          - {figure: sketch_c, kind: arc, target: BDH, text: '90°'}
      - say: 'Now the floor diagonal, the 8 metre height and the room diagonal make a right-angled triangle, with the right angle at the bottom corner.'
        write: 'Room diagonal $= \sqrt{15^{2} + 8^{2}}$'
        point:
          - {line: 10, kind: move, from: {line: 8, at: '= 15'}, at: '[[15]]2', text: 'floor diagonal'}
          - {figure: sketch_c, kind: highlight, target: DH, text: '8'}
      - say: '15 squared is 225, and 8 squared is 64.'
        write: '$= \sqrt{225 + 64}$'
      - say: '225 plus 64 is 289, and 17 times 17 is 289. So the room diagonal is 17 metres.'
        write: '$= \sqrt{289} = 17$'
        point:
          - {figure: sketch_c, kind: label, target: BH, text: '17 m'}
