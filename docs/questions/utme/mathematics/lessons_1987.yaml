        diagram:
          id: t
          kind: table
          columns: ['Score (x)', 'f', 'cf']
          rows: [[1, 3, ''], [2, 6, ''], [3, 10, ''], [4, 8, ''], [5, 6, ''], [6, 5, ''], [7, 2, ''], [8, 4, ''], [9, 12, '']]
          'on': 'frequency table'
      - section: 'Solution'
        say: 'Solution. $CF$ stands for cumulative frequency, which is the frequencies added up from the lowest score, down to and including the score $x$.'
        write: 'Solution. $CF(x) =$ sum of $f$ for all scores $\leq x$'
      - say: 'So we add a cf column to the table, a running total of $f$. 3, then 3 plus 6 is 9, then 19, 27, 33, 38, 40, 44 and 56.'
        write: 'cf column: $3,\ 9,\ 19,\ 27,\ 33,\ 38,\ 40,\ 44,\ 56$'
        diagram_do:
          - {id: t, op: total, part: 'col:2', into: 'col:3', 'on': 'running total'}
      - section: 'CF(6)'
        say: '$CF$ of 6 counts everyone who scored 1, 2, 3, 4, 5 or 6. So add the frequencies from the score 1 down to the score 6.'
        write: '$CF(6) = 3 + 6 + 10 + 8 + 6 + 5$'
        diagram_do:
          - {id: t, op: highlight, part: 'row:6', text: 'score 6', 'on': 'down to the score 6'}
      - say: '3 plus 6 is 9, and 9 plus 10 is 19.'
        write: '$= 19 + 8 + 6 + 5$'
      - say: '19 plus 8 is 27, 27 plus 6 is 33, and 33 plus 5 is 38. That is the cf in the row for the score 6.'
        write: '$= 38$'
        point:
          - {line: 5, kind: highlight, at: '38', to: {diagram: t, part: 'cell:6,3'}}
      - section: 'Check'
        say: 'Check from the other end. The last cf is the total, 56 students. Those who scored more than 6 are 2 plus 4 plus 12, which is 18.'
        write: 'Check: $\sum f = 56$; above 6: $2 + 4 + 12 = 18$'
      - say: '56 minus 18 is 38 again.'
        write: '$56 - 18 = 38$ ✓'
      - section: 'Answer'
        say: 'Therefore $CF$ of 6 is 38, which is answer choice B.'
        write: '$\therefore CF(6) = 38$ (B)'
        answer: true
    traps:
