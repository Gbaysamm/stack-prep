      - say: 'Multiply out. 2 $h$ times 3 $h$ is 6 $h$ squared. 2 $h$ times minus 2 is minus 4 $h$. Minus 4 times 3 $h$ is minus 12 $h$. Minus 4 times minus 2 is plus 8.'
        write: '$= 6h^{2} - 4h - 12h + 8$'
