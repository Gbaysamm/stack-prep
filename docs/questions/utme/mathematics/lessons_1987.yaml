          - {figure: 0, kind: label, target: {x: 125, y: 210}, text: '2z'}
      - say: 'Divide both sides by 2. 180 divided by 2 is 90.'
        write: '$y + z = 90^{\circ}$'
      - say: 'Now look at the triangle made by the two bisectors and the piece of transversal between the lines. Its three angles are $y$ at the top, $z$ at the bottom, and $x$ where the bisectors meet.'
        write: 'Triangle with angles $y,\ z,\ x$'
        point:
          - {figure: 0, kind: circle, target: x}
      - say: 'The angles in a triangle add up to 180 degrees.'
        write: 'Angles in a triangle add up to $180^{\circ}$'
      - say: 'So the three angles $x$, $y$ and $z$ add up to 180 degrees.'
        write: '$x + y + z = 180^{\circ}$'
        point:
