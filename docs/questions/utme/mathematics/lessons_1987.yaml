        show_sketch: true
      - say: '210 degrees is between 180 and 270, so it is in the third quadrant. It is 210 minus 180, which is 30 degrees past 180.'
        write: 'Reference angle $= 210^{\circ} - 180^{\circ} = 30^{\circ}$'
        point:
          - {figure: sketch, kind: circle, target: '210°'}
          - {figure: sketch, kind: circle, target: '30°', text: 'reference angle'}
      - say: 'Now the sizes, from 30 degrees. The sine of 30 degrees is a half.'
        write: '$\sin 30^{\circ} = \tfrac{1}{2}$'
      - say: 'The cosine of 30 degrees is root 3 over 2.'
        write: '$\cos 30^{\circ} = \tfrac{\sqrt{3}}{2}$'
      - say: 'The tangent of 30 degrees is 1 over root 3. Multiply the top and the bottom by root 3, and it becomes root 3 over 3.'
        write: '$\tan 30^{\circ} = \tfrac{1}{\sqrt{3}} = \tfrac{\sqrt{3}}{3}$'
      - say: 'Now the signs. Remember All Students Take Coffee: in the third quadrant, only the tangent is positive. Sine and cosine are negative.'
        write: '3rd quadrant: $\sin < 0,\ \cos < 0,\ \tan > 0$'
        point:
          - {figure: sketch, kind: circle, target: III, text: 'only tan +'}
      - say: 'So the sine of 210 is the sine of 30 with a minus sign: minus a half.'
        write: '$\sin 210^{\circ} = -\sin 30^{\circ} = -\tfrac{1}{2}$'
        point:
          - {line: 7, kind: circle, at: 'sin < 0', text: 'sign'}
          - {line: 4, kind: arrow, text: 'size'}
      - say: 'The cosine of 210 is minus the cosine of 30: minus root 3 over 2.'
        write: '$\cos 210^{\circ} = -\cos 30^{\circ} = -\tfrac{\sqrt{3}}{2}$'
      - say: 'And the tangent of 210 keeps its plus sign: root 3 over 3.'
        write: '$\tan 210^{\circ} = +\tan 30^{\circ} = \tfrac{\sqrt{3}}{3}$'
        point:
          - {line: 7, kind: circle, at: 'tan > 0', text: 'positive'}
      - say: 'So they are minus a half, minus root 3 over 2, and root 3 over 3, which is answer choice A.'
        write: 'Therefore: $-\tfrac{1}{2},\ -\tfrac{\sqrt{3}}{2},\ \tfrac{\sqrt{3}}{3}$'
        answer: true
    traps:
      B: 'You went for all three positive. Those are the values for 30 degrees. 210 degrees is in the third quadrant, where sine and cosine are negative.'
      C: 'You went for root 3 over 2, root 3 over 3, 1. Those don''t match 210 degrees. The reference angle is 30 degrees: sine a half, cosine root 3 over 2, tangent root 3 over 3, with sine and cosine negative.'
      D: 'You went for 3 over 2, a half, 1. A sine can never be bigger than 1, so 3 over 2 is impossible. Use the reference angle, 30 degrees, and the third-quadrant signs.'
  39:
    moments:
      - say: 'We''re told tan theta is $m$ squared minus $n$ squared, over 2 $m n$. We want sec theta.'
        write: '$\tan\theta = \dfrac{m^{2} - n^{2}}{2mn}$'
      - say: 'When a trig ratio is given in letters, we draw the right-angled triangle it describes. Tangent is opposite over adjacent.'
        write: '$\tan\theta = \dfrac{\text{opp}}{\text{adj}}$'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: θ}
      - say: 'So the opposite side is $m$ squared minus $n$ squared, and the adjacent side is 2 $m n$.'
        write: 'Opp $= m^{2} - n^{2}$, adj $= 2mn$'
        point:
          - {figure: sketch, kind: highlight, target: BC}
          - {figure: sketch, kind: highlight, target: AB}
      - say: 'Pythagoras: the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hypotenuse}^{2} = \text{opposite}^{2} + \text{adjacent}^{2}$'
      - say: 'We will need the hypotenuse. Put the opposite and adjacent sides into Pythagoras.'
        write: '$\text{hyp}^{2} = (m^{2} - n^{2})^{2} + (2mn)^{2}$'
        point:
          - {figure: sketch, kind: highlight, target: AC}
      - say: 'Expand the first bracket: $m$ squared minus $n$ squared, all squared, is $m$ to the 4, minus 2 $m$ squared $n$ squared, plus $n$ to the 4.'
        write: '$(m^{2} - n^{2})^{2} = m^{4} - 2m^{2}n^{2} + n^{4}$'
      - say: 'And 2 $m n$, all squared, is 4 $m$ squared $n$ squared.'
        write: '$(2mn)^{2} = 4m^{2}n^{2}$'
      - say: 'Now add those two results together.'
        write: '$\text{hyp}^{2} = m^{4} - 2m^{2}n^{2} + n^{4} + 4m^{2}n^{2}$'
      - say: 'Minus 2 plus 4 is plus 2, so the middle term becomes plus 2 $m$ squared $n$ squared.'
        write: '$= m^{4} + 2m^{2}n^{2} + n^{4}$'
      - say: 'That is a perfect square: $m$ squared plus $n$ squared, all squared.'
        write: '$= (m^{2} + n^{2})^{2}$'
      - say: 'Take the square root. The hypotenuse is $m$ squared plus $n$ squared.'
        write: '$\text{hyp} = m^{2} + n^{2}$'
        point:
          - {figure: sketch, kind: label, target: AC, text: 'm² + n²'}
      - say: 'Secant is 1 over cosine. Cosine is adjacent over hypotenuse, so secant is hypotenuse over adjacent.'
        write: '$\sec\theta = \dfrac{1}{\cos\theta} = \dfrac{\text{hyp}}{\text{adj}}$'
      - say: 'Put in the hypotenuse we just found and the adjacent side, 2 $m n$.'
        write: '$\sec\theta = \dfrac{m^{2} + n^{2}}{2mn}$'
        point:
          - {line: 12, kind: move, from: {line: 10, at: 'm2 + n2'}, at: 'm2 + n2', text: 'hyp'}
          - {line: 12, kind: move, from: {line: 2, at: 'adj = 2mn'}, at: '= [[2mn]]', text: 'adj'}
      - say: 'Quick check with $m$ equals 2 and $n$ equals 1. Then tan theta is 3 over 4, the 3, 4, 5 triangle, so sec theta is 5 over 4. The formula gives 4 plus 1, over 4, which is 5 over 4.'
        write: 'Check: $\dfrac{2^{2} + 1^{2}}{2(2)(1)} = \dfrac{5}{4}$'
      - say: 'So sec theta is $m$ squared plus $n$ squared, over 2 $m n$, which is answer choice B.'
        write: 'Therefore $\sec\theta = \dfrac{m^{2} + n^{2}}{2mn}$'
        answer: true
    traps:
      A: 'You went for hypotenuse over opposite. That''s cosec theta, not sec theta. Secant goes with cosine, so it''s hypotenuse over the adjacent side, 2 $m n$.'
      C: 'You went for $m n$ over 2 times $m$ squared minus $n$ squared. That doesn''t use the hypotenuse at all. Find the hypotenuse, $m$ squared plus $n$ squared, and divide by the adjacent, 2 $m n$.'
      D: 'You went for $m$ squared $n$ squared over $m$ squared minus $n$ squared. Secant is hypotenuse over adjacent. The hypotenuse is $m$ squared plus $n$ squared and the adjacent is 2 $m n$.'
  40:
    moments:
      - say: 'From two points $X$ and $Y$, 8 metres apart in line with a pole, the angles of elevation of the top are 30 degrees and 60 degrees. We want the height of the pole.'
        write: '$XY = 8$ m, elevations $30^{\circ}$ and $60^{\circ}$'
        point:
          - {figure: sketch, kind: circle, target: '60°'}
      - say: 'Let me draw the pole and the angle of elevation.'
        show_sketch: true
      - say: 'The nearer point sees the top at the steeper angle, so $Y$, with 60 degrees, is nearer the pole, and $X$, with 30 degrees, is 8 metres farther back. Let the height be $h$, and the distance from $Y$ to the foot of the pole be $d$.'
        write: 'Let height $= h$, distance from $Y$ to foot $= d$'
        point:
          - {figure: sketch, kind: circle, target: h}
          - {figure: sketch, kind: circle, target: d}
      - say: 'SOH CAH TOA: the tangent of an angle is the opposite side over the adjacent side.'
        write: '$\tan\theta = \dfrac{\text{opposite}}{\text{adjacent}}$'
      - say: 'From $Y$, tan 60 degrees is opposite over adjacent: the height $h$ over the distance $d$.'
        write: 'From $Y$: $\tan 60^{\circ} = \dfrac{h}{d}$'
        point:
          - {figure: sketch, kind: highlight, target: AB, text: 'opposite'}
          - {figure: sketch, kind: underline, target: YB, text: 'adjacent'}
      - say: 'Tan 60 degrees is root 3, so $h$ over $d$ is root 3. Multiply both sides by $d$.'
        write: '$\sqrt{3} = \dfrac{h}{d} \Rightarrow h = d\sqrt{3}$'
      - say: 'Now let me draw the second triangle, from $X$, 8 metres farther back from the pole.'
        show_sketch: sketch_b
        point:
          - {figure: sketch_b, kind: circle, target: '8 m', text: 'XY'}
          - {figure: sketch_b, kind: arc, target: AXB, text: '30°'}
      - say: 'From $X$, the distance to the foot of the pole is $d$ plus 8. So tan 30 degrees is $h$ over, $d$ plus 8.'
        write: 'From $X$: $\tan 30^{\circ} = \dfrac{h}{d + 8}$'
        point:
          - {figure: sketch_b, kind: underline, target: XB, text: 'd + 8'}
      - say: 'Tan 30 degrees is 1 over root 3. Multiply both sides by $d$ plus 8.'
        write: '$\dfrac{1}{\sqrt{3}} = \dfrac{h}{d + 8} \Rightarrow h = \dfrac{d + 8}{\sqrt{3}}$'
      - say: 'Both expressions equal the same height $h$, so we set them equal to each other.'
        write: '$d\sqrt{3} = \dfrac{d + 8}{\sqrt{3}}$'
        point:
          - {line: 9, kind: move, from: {line: 5, at: 'h = d3'}, at: '[[d3]] =', text: 'h from Y'}
          - {line: 9, kind: move, from: {line: 8, at: 'h = 3d + 8'}, at: '= [[3d + 8]]', text: 'h from X'}
          - {figure: sketch_b, kind: circle, target: 'h', text: 'the same h'}
      - say: 'Multiply both sides by root 3. Root 3 times root 3 is 3.'
        write: '$d\sqrt{3} \times \sqrt{3} = d + 8 \Rightarrow 3d = d + 8$'
      - say: 'Subtract $d$ from both sides. 3 $d$ minus $d$ is 2 $d$.'
        write: '$2d = 8$'
        point:
          - {line: 11, kind: move, from: {line: 10, at: '3d = [[d]] + 8'}, at: '2d', text: '3d − d'}
      - say: 'Divide both sides by 2. 8 divided by 2 is 4, so $d$ is 4 metres.'
        write: '$d = 4$'
      - say: 'Now go back to $h$ equals $d$ root 3, and put in $d$ equals 4.'
        write: '$h = d\sqrt{3} = 4\sqrt{3}$'
        point:
          - {line: 13, kind: move, from: {line: 12, at: 'd = [[4]]'}, at: '= [[4]]3', text: 'd = 4'}
      - say: 'Check with the other equation. $d$ plus 8 is 12, and 12 over root 3 is 12 root 3 over 3, which is 4 root 3. Both agree.'
        write: 'Check: $\dfrac{4 + 8}{\sqrt{3}} = \dfrac{12\sqrt{3}}{3} = 4\sqrt{3}$'
      - say: 'So the pole is 4 root 3 metres tall, about 6.9 metres, which is answer choice C.'
        write: 'Height $= 4\sqrt{3}$ m'
        answer: true
        point:
          - {figure: sketch_b, kind: label, target: AB, text: '4√3 m'}
    traps:
      A: 'You went for 4 m. That''s $d$, the distance from $Y$ to the foot of the pole. The height is $d$ times root 3, which is 4 root 3 metres.'
      B: 'You went for 8 root 3 over 3 m. That is 8 times tan 30 degrees, which treats the 8 metres as the distance from $X$ to the foot of the pole. But $X$ is 8 metres from $Y$, and $Y$ is another 4 metres from the pole, so $X$ is 12 metres away, and 12 times tan 30 degrees is 4 root 3.'
      D: 'You went for 8 root 3 m. That treats the 8 metres as the distance from $Y$ to the pole. The 8 metres is between $X$ and $Y$, and the distance from $Y$ is 4 metres, so the height is 4 root 3.'
