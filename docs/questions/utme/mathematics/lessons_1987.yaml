# UTME 1987 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1987.yaml. Answers match that file.
format_version: 1
exam_year: 1987
lessons:
  1:
    moments:
      - say: 'We want to change 2, 4, 1 in base 5 into base 8.'
        write: '$241_{5} = ?_{8}$'
      - say: 'There is no direct road from base 5 to base 8. So we go through base ten: first we change 2, 4, 1 into base ten, then we change that base-ten number into base 8.'
        write: 'Plan: base 5 $\to$ base 10 $\to$ base 8'
      - say: 'In base 5, each place is worth 5 times the place to its right. From the right, the places are worth 1, then 5, then 5 squared, which is 25.'
        write: 'Place values in base 5: $25,\ 5,\ 1$'
      - say: 'So 2, 4, 1 in base 5 means 2 twenty-fives, plus 4 fives, plus 1 one.'
        write: '$241_{5} = 2 \times 25 + 4 \times 5 + 1 \times 1$'
      - say: '2 times 25 is 50. 4 times 5 is 20. And 1 times 1 is 1.'
        write: '$= 50 + 20 + 1$'
      - say: '50 plus 20 is 70, and 70 plus 1 is 71. So our number is 71 in base ten.'
        write: '$= 71_{10}$'
      - say: 'Now the second stage: we turn that 71 into base 8. We keep dividing by 8 and write down each remainder.'
        write: 'Divide $71$ by $8$ repeatedly:'
      - say: '8 eights are 64, and 71 minus 64 is 7. So 71 divided by 8 is 8, remainder 7.'
        write: '$71 \div 8 = 8 \text{ remainder } 7$'
      - say: 'Now divide that 8 by 8. That is 1, remainder 0.'
        write: '$8 \div 8 = 1 \text{ remainder } 0$'
      - say: 'Then 1 divided by 8 is 0, remainder 1. We stop once we reach zero.'
        write: '$1 \div 8 = 0 \text{ remainder } 1$'
      - say: 'Now read the remainders from the bottom up: 1, then 0, then 7.'
        write: 'Remainders from the bottom: $71_{10} = 107_{8}$'
      - say: 'Let''s check. In base 8 the places are worth 64, 8 and 1. 1 times 64, plus 0 times 8, plus 7 times 1, is 71. It works.'
        write: 'Check: $107_{8} = 1 \times 64 + 0 \times 8 + 7 \times 1 = 71$'
      - say: 'So 2, 4, 1 in base 5 is 1, 0, 7 in base 8, which is answer choice B.'
        write: 'Therefore $241_{5} = 107_{8}$'
        answer: true
    traps:
      A: 'You went for 71 in base 8. 71 is the value in base ten; you can''t just stick an 8 on it. Divide 71 by 8 again and again and read the remainders from the bottom up, and you get 1, 0, 7.'
      C: 'You went for 176 in base 8. That''s worth 64 plus 56 plus 6, which is 126 in base ten, not 71. Divide 71 by 8 repeatedly and read the remainders from the last one up: 1, 0, 7.'
      D: 'You went for 241 in base 8. That just relabels the digits. Changing the base changes the digits, so go through base ten first: 2, 4, 1 in base 5 is 71, and 71 is 1, 0, 7 in base 8.'
  2:
    moments:
      - say: 'We want the shortest rod that can be cut exactly into 40 centimetre strips, and also exactly into 48 centimetre strips.'
        write: 'Strips of $40$ cm or $48$ cm'
      - say: 'If the rod cuts exactly into 40 centimetre strips, its length is a multiple of 40. If it cuts exactly into 48 centimetre strips, it is a multiple of 48. The least length that is both is the L.C.M., the lowest common multiple.'
        write: 'Least length $= \text{L.C.M.}(40,\ 48)$'
      - say: 'To find the L.C.M., we break each number into primes. 40 is 8 times 5, and 8 is 2 times 2 times 2, which is 2 cubed.'
        write: '$40 = 8 \times 5 = 2^{3} \times 5$'
      - say: '48 is 16 times 3, and 16 is 2 times 2 times 2 times 2, which is 2 to the power 4.'
        write: '$48 = 16 \times 3 = 2^{4} \times 3$'
      - say: 'For the L.C.M. we take every prime that appears, each to its highest power. The 2 appears as 2 cubed and as 2 to the 4, so we take 2 to the 4. Then we take the 3 and the 5.'
        write: '$\text{L.C.M.} = 2^{4} \times 3 \times 5$'
      - say: '2 to the 4 is 16, and 3 times 5 is 15.'
        write: '$= 16 \times 15$'
      - say: '16 times 10 is 160, and 16 times 5 is 80. 160 plus 80 is 240.'
        write: '$= 16 \times 10 + 16 \times 5 = 160 + 80 = 240$'
      - say: 'Let''s check that 240 really works. 240 divided by 40 is 6, so it gives 6 strips of 40 centimetres exactly.'
        write: 'Check: $240 \div 40 = 6$'
      - say: 'And 240 divided by 48 is 5, so it gives 5 strips of 48 centimetres exactly too.'
        write: 'and $240 \div 48 = 5$'
      - say: 'So the least length is 240 centimetres, which is answer choice B.'
        write: 'Least length $= 240$ cm'
        answer: true
    traps:
      A: 'You went for 120 cm. It divides by 40, but 120 divided by 48 is 2.5, so the 48 centimetre strips wouldn''t come out exactly. The L.C.M. of 40 and 48 is 240.'
      C: 'You went for 360 cm. 360 divided by 48 is 7.5, so it doesn''t cut exactly into 48 centimetre strips. The lowest common multiple is 240.'
      D: 'You went for 480 cm. It does work for both strips, but it is 2 times 240, so it isn''t the least. The question asks for the least length, which is the L.C.M., 240.'
  3:
    moments:
      - say: 'A lawn has an area of 1815 square yards, and its length is 50 metres. We want its width in metres, using 1 metre equals 1.1 yards.'
        write: 'Area $= 1815\ \text{yd}^{2}$, length $= 50$ m'
      - say: 'The area is in yards but the length is in metres, so we can''t divide yet. Both must be in the same unit. Let''s change the length into yards.'
        write: '$1 \text{ m} = 1.1 \text{ yd}$'
      - say: '50 metres is 50 times 1.1 yards. 50 times 1 is 50, and 50 times 0.1 is 5, so that is 55 yards.'
        write: 'Length $= 50 \times 1.1 = 50 + 5 = 55$ yd'
      - say: 'For a rectangle, area is length times width. So width is area divided by length.'
        write: '$\text{width} = \dfrac{\text{area}}{\text{length}}$'
      - say: 'Put in the area, 1815, and the length we just found, 55 yards.'
        write: '$\text{width} = \dfrac{1815}{55}$'
      - say: '55 times 30 is 1650, and 55 times 3 is 165. 1650 plus 165 is 1815, so 55 goes into 1815 exactly 33 times.'
        write: '$55 \times 33 = 1650 + 165 = 1815$'
      - say: 'So the width is 33 yards.'
        write: 'So $\text{width} = 33 \text{ yd}$'
      - say: 'But the question wants metres. Each metre is 1.1 yards, so to go from yards to metres we divide by 1.1.'
        write: '$33 \text{ yd} = \dfrac{33}{1.1} \text{ m}$'
      - say: 'Multiply the top and the bottom by 10 to clear the decimal. That gives 330 over 11.'
        write: '$= \dfrac{330}{11} \text{ m}$'
      - say: '11 times 30 is 330, so this is 30.'
        write: '$= 30 \text{ m}$'
      - say: 'Let''s check. 50 metres by 30 metres is 1500 square metres. A square metre is 1.1 times 1.1, which is 1.21 square yards, and 1500 times 1.21 is 1815. It works.'
        write: 'Check: $50 \times 30 = 1500,\ 1500 \times 1.21 = 1815$'
      - say: 'So the width is 30 metres, which is answer choice D.'
        write: 'Width $= 30$ m'
        answer: true
    traps:
      A: 'You went for 39.93. That comes from dividing 1815 by 50, which gives 36.3, and then multiplying by 1.1, which mixes yards and metres. Change 50 metres to 55 yards first, divide to get 33 yards, then divide by 1.1.'
      B: 'You went for 35.00. That doesn''t come from the correct division. 1815 divided by 55 yards is 33 yards, and 33 divided by 1.1 is 30 metres.'
      C: 'You went for 33.00. That''s the width in yards. The question wants metres, so there''s one more step: 33 divided by 1.1 is 30.'
  4:
    moments:
      - say: 'We must round each number to two significant figures first, and only then work out the fraction.'
        write: '$\dfrac{0.02174 \times 1.2047}{0.023789}$'
      - say: 'Significant figures start at the first digit that isn''t zero. We keep two of them, then look at the next digit: 5 or more rounds up, less than 5 leaves it alone.'
        write: 'Rule: next digit $\ge 5$ rounds up'
      - say: 'Start with 0.02174. The leading zeros don''t count, so the first two significant figures are 2 and 1. The next digit is 7, which is 5 or more, so the 1 rounds up to 2.'
        write: '$0.02174 \approx 0.022$'
      - say: 'Next, 1.2047. The first two significant figures are 1 and 2. The next digit is 0, so we leave it alone.'
        write: '$1.2047 \approx 1.2$'
      - say: 'Then 0.023789. The significant figures are 2 and 3, and the next digit is 7, so the 3 rounds up to 4.'
        write: '$0.023789 \approx 0.024$'
      - say: 'Now put the three rounded numbers into the fraction.'
        write: 'Rounded: $\dfrac{0.022 \times 1.2}{0.024}$'
      - say: 'On top, 22 times 12 is 264. 0.022 has three decimal places and 1.2 has one, so the answer has four: 0.0264.'
        write: '$= \dfrac{0.0264}{0.024}$'
      - say: 'To clear the decimals, multiply the top and the bottom by 10,000. The top becomes 264 and the bottom becomes 240.'
        write: '$= \dfrac{0.0264 \times 10000}{0.024 \times 10000} = \dfrac{264}{240}$'
      - say: '240 goes into 264 once, with 24 left over. And 24 over 240 is 1 over 10, which is 0.1.'
        write: '$= 1 + \dfrac{24}{240} = 1 + 0.1$'
      - say: '1 plus 0.1 is 1.1.'
        write: '$= 1.1$'
      - say: 'So the value is 1.1, which is answer choice C.'
        write: 'Value $= 1.1$'
        answer: true
    traps:
      A: 'You went for 0.8. The rounded values give 0.0264 over 0.024. The top is bigger than the bottom, so the answer must be more than 1. It works out to 1.1.'
      B: 'You went for 0.9. That is the fraction upside down: 0.024 over 0.0264 is about 0.9. Keep 0.0264 on top and 0.024 underneath, and you get 1.1.'
      D: 'You went for 1.2. That comes from rounding 0.02174 and 0.023789 to one significant figure, 0.02 each, so they cancel and leave 1.2. The question says two significant figures: 0.022 and 0.024, which give 1.1.'
  5:
    moments:
      - say: 'A train goes from P to Q at 90 kilometres per hour and comes straight back at 45 kilometres per hour. We want the average speed for the whole journey.'
        write: 'Out at $90$ km/h, back at $45$ km/h'
      - say: 'Here''s the rule: average speed is total distance divided by total time. It is not the average of the two speeds, because the train spends longer on the slow leg.'
        write: '$\text{average speed} = \dfrac{\text{total distance}}{\text{total time}}$'
      - say: 'Let the distance from P to Q be $d$ kilometres. There and back, the total distance is $d$ plus $d$, which is $2d$.'
        write: 'Total distance $= d + d = 2d$'
      - say: 'Time is distance over speed. Going out at 90, the time is $d$ over 90 hours.'
        write: 'Time out $= \dfrac{d}{90}$'
      - say: 'Coming back at 45, the time is $d$ over 45 hours.'
        write: 'Time back $= \dfrac{d}{45}$'
      - say: 'To add these times, we need the same bottom number. Multiply the top and the bottom of $d$ over 45 by 2, and it becomes $2d$ over 90.'
        write: '$\dfrac{d}{45} = \dfrac{2d}{90}$'
      - say: 'Now add the two times. $d$ over 90 plus $2d$ over 90 is $3d$ over 90.'
        write: 'Total time $= \dfrac{d}{90} + \dfrac{2d}{90} = \dfrac{3d}{90}$'
      - say: '3 over 90 is the same as 1 over 30, because 90 divided by 3 is 30. So the total time is $d$ over 30 hours.'
        write: '$= \dfrac{d}{30}$'
      - say: 'Now put the total distance and the total time into our rule.'
        write: 'Average speed $= 2d \div \dfrac{d}{30}$'
      - say: 'Dividing by $d$ over 30 is the same as multiplying by 30 over $d$.'
        write: '$= 2d \times \dfrac{30}{d}$'
      - say: 'The $d$ on top cancels the $d$ underneath, leaving 2 times 30, which is 60.'
        write: '$= 2 \times 30 = 60$'
      - say: 'Let''s check with a real distance, 90 kilometres. Out takes 1 hour, back takes 2 hours. That is 180 kilometres in 3 hours, and 180 divided by 3 is 60.'
        write: 'Check: $\dfrac{90 + 90}{1 + 2} = \dfrac{180}{3} = 60$'
      - say: 'So the average speed is 60 kilometres per hour, which is answer choice B.'
        write: 'Average speed $= 60$ km/h'
        answer: true
    traps:
      A: 'You went for 55 km/h. That''s too low. Total distance over total time gives 60 km/h; try it with 90 km each way: 180 km in 3 hours.'
      C: 'You went for 67.5 km/h. That''s 90 plus 45 divided by 2, the plain average of the speeds. The train spends twice as long at the slow speed, so the true average is lower: 60 km/h.'
      D: 'You went for 75 km/h. That''s even higher than the plain average, but the slow return should pull the average down. Total distance over total time gives 60 km/h.'
  6:
    moments:
      - say: 'A square has its length increased by 20 percent and its width decreased by 20 percent, making a rectangle. We want the area of the rectangle compared with the area of the square.'
        write: 'Length $+20\%$, width $-20\%$'
      - say: 'Let the side of the square be $s$. Its area is $s$ times $s$, which is $s$ squared.'
        write: 'Square area $= s \times s = s^{2}$'
      - say: 'Increasing by 20 percent means we keep the 100 percent and add 20 percent, making 120 percent, which is 1.2 times.'
        write: '$100\% + 20\% = 120\% = 1.2$'
      - say: 'So the new length is 1.2 times $s$.'
        write: 'Length $= 1.2s$'
      - say: 'Decreasing by 20 percent leaves 100 minus 20, which is 80 percent, or 0.8 times.'
        write: '$100\% - 20\% = 80\% = 0.8$'
      - say: 'So the new width is 0.8 times $s$.'
        write: 'Width $= 0.8s$'
      - say: 'The rectangle''s area is its length times its width.'
        write: 'Rectangle area $= 1.2s \times 0.8s$'
      - say: '12 times 8 is 96. 1.2 and 0.8 each have one decimal place, so 1.2 times 0.8 is 0.96. And $s$ times $s$ is $s$ squared.'
        write: '$= 0.96s^{2}$'
      - say: 'Now the ratio of the rectangle to the square. The $s$ squared is on both sides, so it cancels, leaving 0.96 to 1.'
        write: 'Rectangle : square $= 0.96s^{2} : s^{2} = 0.96 : 1$'
      - say: 'Multiply both parts by 100 to clear the decimal. That gives 96 to 100.'
        write: '$= 96 : 100$'
      - say: 'Both divide by 4. 96 divided by 4 is 24, and 100 divided by 4 is 25.'
        write: '$= 24 : 25$'
      - say: 'So the ratio is 24 to 25, which is answer choice D.'
        write: 'Therefore rectangle : square $= 24 : 25$'
        answer: true
    traps:
      A: 'You went for 6 : 5. That''s just 1.2 to 1, the change in the length alone. The width shrinks too, so multiply 1.2 by 0.8 to get 0.96, which is 24 : 25.'
      B: 'You went for 25 : 24. That''s the ratio upside down: square to rectangle. The question asks for the rectangle first, so it''s 24 : 25.'
      C: 'You went for 5 : 6. That is 1 to 1.2, which only looks at the length. Multiply both factors, 1.2 times 0.8, to get 0.96, which is 24 : 25.'
  7:
    moments:
      - say: 'Two brothers put ₦5,000 into a farm and sold the harvest for ₦15,000. The profit is shared in the ratio 2 to 3, and we want the difference between their shares.'
        write: 'Invested ₦5,000, sold for ₦15,000, ratio $2 : 3$'
      - say: 'The first thing we need is the profit. Profit is the money left over after getting back what was invested.'
        write: 'Profit $=$ selling price $-$ money invested'
      - say: 'The harvest sold for ₦15,000, and ₦5,000 was invested.'
        write: '$= 15{,}000 - 5{,}000$'
      - say: '15,000 minus 5,000 is 10,000. So the profit is ₦10,000.'
        write: '$= 10{,}000$'
      - say: 'Now share it in the ratio 2 to 3. 2 plus 3 is 5, so the profit is cut into 5 equal parts.'
        write: 'Parts: $2 + 3 = 5$'
      - say: 'Each part is the profit, 10,000, divided by 5, which is ₦2,000.'
        write: '1 part $= 10{,}000 \div 5 = 2{,}000$'
      - say: 'One brother gets 2 parts: 2 times 2,000 is ₦4,000.'
        write: 'First share $= 2 \times 2{,}000 = 4{,}000$'
      - say: 'The other gets 3 parts: 3 times 2,000 is ₦6,000.'
        write: 'Second share $= 3 \times 2{,}000 = 6{,}000$'
      - say: 'The difference is 6,000 minus 4,000, which is ₦2,000.'
        write: 'Difference $= 6{,}000 - 4{,}000 = 2{,}000$'
      - say: 'Notice that''s exactly one part, because 3 parts minus 2 parts is 1 part.'
        write: 'Check: $3 - 2 = 1$ part $= 2{,}000$'
      - say: 'So the difference is ₦2,000, which is answer choice A.'
        write: 'Difference: ₦2,000'
        answer: true
    traps:
      B: 'You went for ₦4,000. That''s the smaller brother''s share, not the difference. The shares are ₦4,000 and ₦6,000, so the difference is ₦2,000.'
      C: 'You went for ₦6,000. That''s the bigger brother''s share. Subtract the smaller share, ₦4,000, to get the difference: ₦2,000.'
      D: 'You went for ₦10,000. That''s the whole profit. The question wants the difference between the two shares, which is one of the five parts: ₦2,000.'
  8:
    moments:
      - say: 'Peter earns ₦20 a week for 20 weeks, then ₦36 a week for 24 weeks. His average for the whole year is ₦30. We want his average for the last 8 weeks.'
        write: '$20$ weeks at ₦20, $24$ weeks at ₦36, year average ₦30'
      - say: 'Averages are tricky to combine, but totals are easy. An average times the number of weeks gives the total pay, so let''s work with totals.'
        write: 'Total $=$ average $\times$ weeks'
      - say: 'A year has 52 weeks. And 20 plus 24 plus 8 is 52, so the three periods fill the year exactly.'
        write: '$20 + 24 + 8 = 52$ weeks'
      - say: 'The total for the whole year is 52 weeks times ₦30.'
        write: 'Year total $= 52 \times 30$'
      - say: '50 times 30 is 1,500, and 2 times 30 is 60. So that''s ₦1,560.'
        write: '$= 1500 + 60 = 1560$'
      - say: 'The first 20 weeks earn 20 times ₦20, which is ₦400.'
        write: 'First 20 weeks $= 20 \times 20 = 400$'
      - say: 'The next 24 weeks earn 24 times ₦36.'
        write: 'Next 24 weeks $= 24 \times 36$'
      - say: '24 times 30 is 720, and 24 times 6 is 144. 720 plus 144 is ₦864.'
        write: '$= 720 + 144 = 864$'
      - say: 'Together, those first 44 weeks earn 400 plus 864, which is ₦1,264.'
        write: 'First 44 weeks $= 400 + 864 = 1264$'
      - say: 'The last 8 weeks must earn whatever is left of the year''s ₦1,560.'
        write: 'Last 8 weeks $= 1560 - 1264$'
      - say: '1,560 minus 1,264 is ₦296.'
        write: '$= 296$'
      - say: 'The average for those 8 weeks is 296 divided by 8. 8 times 37 is 296, so it''s ₦37.'
        write: 'Average $= 296 \div 8 = 37$'
      - say: 'So his average weekly wage for the last 8 weeks is ₦37, which is answer choice A.'
        write: 'Average for last 8 weeks: ₦37.00'
        answer: true
    traps:
      B: 'You went for ₦35. Check the totals: the year is 52 times 30, which is 1,560; the first two periods make 1,264; that leaves 296, and 296 divided by 8 is 37.'
      C: 'You went for ₦30. That assumes the last weeks just match the yearly average. The early weeks paid only ₦20, so the later ones must pay more to bring the average up: ₦37.'
      D: 'You went for ₦5. That''s far too small to lift the average to ₦30. The last 8 weeks earn ₦296 in total, which is ₦37 a week.'
  9:
    moments:
      - say: 'Money is invested at 4 percent simple interest. After 3 years the amount is ₦7,000. We want the sum first invested, the principal.'
        write: 'Rate $4\%$, time $3$ years, amount ₦7,000'
      - say: 'With simple interest, the amount at the end is the principal plus the interest. The interest is $P$ times $R$ times $T$, over 100.'
        write: '$A = P + \dfrac{PRT}{100}$'
      - say: 'Put in the rate, 4, and the time, 3 years.'
        write: '$A = P + \dfrac{P \times 4 \times 3}{100}$'
      - say: '4 times 3 is 12, so the interest is 12 over 100 of $P$, which is 0.12 $P$.'
        write: '$= P + \dfrac{12P}{100} = P + 0.12P$'
      - say: '$P$ plus 0.12 $P$ is 1.12 $P$.'
        write: '$= 1.12P$'
      - say: 'The amount is ₦7,000, so 1.12 $P$ equals 7,000.'
        write: '$1.12P = 7000$'
      - say: 'To get $P$ by itself, divide both sides by 1.12.'
        write: '$P = \dfrac{7000}{1.12}$'
      - say: 'Multiply the top and the bottom by 100 to clear the decimal: 700,000 over 112.'
        write: '$= \dfrac{700{,}000}{112}$'
      - say: '112 times 6,000 is 672,000. That leaves 700,000 minus 672,000, which is 28,000.'
        write: '$112 \times 6000 = 672{,}000$, remainder $28{,}000$'
      - say: 'And 112 times 250 is 28,000. So altogether 112 goes in 6,000 plus 250 times, which is 6,250.'
        write: '$112 \times 250 = 28{,}000$, so $P = 6000 + 250 = 6250$'
      - say: 'Let''s check. The interest is 6,250 times 0.12, which is 750. And 6,250 plus 750 is 7,000. It works.'
        write: 'Check: $6250 \times 0.12 = 750,\ 6250 + 750 = 7000$'
      - say: 'So the sum invested was ₦6,250, which is answer choice B.'
        write: 'Principal: ₦6,250.00'
        answer: true
    traps:
      A: 'You went for ₦7,840. That''s 7,000 plus 12 percent of 7,000. But ₦7,000 is already the final amount; we need to go backwards, dividing by 1.12, to get ₦6,250.'
      C: 'You went for ₦6,160. That''s 7,000 minus 12 percent of 7,000. The interest is 12 percent of the principal, not of the final amount, so divide 7,000 by 1.12 instead.'
      D: 'You went for ₦5,833.33. That''s 7,000 divided by 1.2, as if the interest were 20 percent. 4 percent for 3 years is 12 percent, so divide by 1.12.'
  10:
    moments:
      - say: 'A trader sells 20 oranges for ₦1.35 and makes 8 percent profit. We want his percentage gain or loss if he sells them for ₦1.10 instead.'
        write: 'Sold at ₦1.35 for $8\%$ profit; now sold at ₦1.10'
      - say: 'Profit and loss percentages are always measured against the cost price. So first we find the cost price. Let''s call it $C$.'
        write: 'Let cost price $= C$'
      - say: 'An 8 percent profit means he sold at 100 percent plus 8 percent, which is 108 percent of the cost. As a decimal, that is 1.08.'
        write: '$100\% + 8\% = 108\% = 1.08$'
      - say: 'So 1.08 times $C$ is the selling price, 1.35.'
        write: '$1.08C = 1.35$'
      - say: 'Divide both sides by 1.08.'
        write: '$C = \dfrac{1.35}{1.08}$'
      - say: 'Multiply the top and the bottom by 100 to clear the decimals. That gives 135 over 108.'
        write: '$= \dfrac{135}{108}$'
      - say: 'Both numbers divide by 27. 135 divided by 27 is 5, and 108 divided by 27 is 4.'
        write: '$= \dfrac{135 \div 27}{108 \div 27} = \dfrac{5}{4}$'
      - say: '5 over 4 is 1.25. So the cost price is ₦1.25.'
        write: '$C = 1.25$'
      - say: 'Now he sells for ₦1.10. That''s less than the cost, ₦1.25, so it''s a loss. 1.25 minus 1.10 is 0.15.'
        write: 'Loss $= 1.25 - 1.10 = 0.15$'
      - say: 'As a percentage, we divide the loss by the cost price and multiply by 100.'
        write: 'Loss $\% = \dfrac{0.15}{1.25} \times 100\%$'
      - say: 'Multiply the top and the bottom of the fraction by 100, giving 15 over 125. Both divide by 5: 15 divided by 5 is 3, and 125 divided by 5 is 25.'
        write: '$= \dfrac{15}{125} \times 100\% = \dfrac{3}{25} \times 100\%$'
      - say: '100 divided by 25 is 4, and 3 times 4 is 12.'
        write: '$= 3 \times 4\% = 12\%$'
      - say: 'So he makes a loss of 12 percent, which is answer choice C.'
        write: 'Loss $= 12\%$'
        answer: true
    traps:
      A: 'You went for 8 percent. That''s the profit on the first sale. At ₦1.10 he sells below the cost of ₦1.25, so it''s a loss, and 0.15 over 1.25 is 12 percent.'
      B: 'You went for 10 percent. The loss of ₦0.15 has to be compared with the cost price, ₦1.25, not with a selling price. 0.15 over 1.25 is 12 percent.'
