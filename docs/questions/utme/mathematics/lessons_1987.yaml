      - say: 'Put in $y$ plus $z$ equals 90, from the line before.'
        write: '$x + 90^{\circ} = 180^{\circ}$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '= 90∘'}, at: '+ 90∘', text: 'y + z'}
      - say: 'Take 90 to the other side. 180 minus 90 is 90.'
        write: '$x = 180^{\circ} - 90^{\circ} = 90^{\circ}$'
        point:
