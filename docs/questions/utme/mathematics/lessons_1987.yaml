# UTME 1987 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1987.yaml. Answers match that file.
format_version: 1
exam_year: 1987
lessons:
  1:
    moments:
      - say: 'We''re asked to convert 2, 4, 1 in base 5 into base 8.'
        write: '$241_{5} = ?_{8}$'
      - say: 'Going between two bases that are not ten is done in two stages. First we change it into base ten, then we change base ten into base 8.'
      - say: 'In base 5, the place values from the right are 1, 5, and 5 squared, which is 25.'
        write: '$\text{place values: } 25,\ 5,\ 1$'
      - say: 'So 2, 4, 1 in base 5 means 2 twenty-fives, plus 4 fives, plus 1 one.'
        write: '$241_{5} = 2 \times 25 + 4 \times 5 + 1 \times 1$'
      - say: '2 times 25 is 50. 4 times 5 is 20. 1 times 1 is 1.'
        write: '$= 50 + 20 + 1$'
      - say: '50 plus 20 is 70, plus 1 is 71. So the number is 71 in base ten.'
        write: '$= 71_{10}$'
      - say: 'Now we turn 71 into base 8. We divide by 8 again and again, keeping the remainders.'
      - say: '71 divided by 8: 8 eights are 64, so it''s 8 remainder 7, because 71 minus 64 is 7.'
        write: '$71 \div 8 = 8 \text{ remainder } 7$'
      - say: 'Next, 8 divided by 8 is 1 remainder 0.'
        write: '$8 \div 8 = 1 \text{ remainder } 0$'
      - say: 'Then 1 divided by 8 is 0 remainder 1. We stop once we reach zero.'
        write: '$1 \div 8 = 0 \text{ remainder } 1$'
      - say: 'Now read the remainders from the bottom up: 1, then 0, then 7.'
        write: '$71_{10} = 107_{8}$'
      - say: 'Let''s check. In base 8 the place values are 64, 8 and 1. 1 times 64 plus 0 times 8 plus 7 is 71. It works.'
        write: '$107_{8} = 64 + 0 + 7 = 71$'
      - say: 'So 2, 4, 1 in base 5 is 1, 0, 7 in base 8, which is answer choice B.'
        write: '$241_{5} = 107_{8}$'
        answer: true
    traps:
      A: 'You went for 71 in base 8. 71 is the value in base ten; you can''t just stick an 8 on it. Divide 71 by 8 repeatedly and read the remainders, and you get 107.'
      C: 'You went for 176 in base 8. That''s worth 126 in base ten, not 71. Remember to read the remainders from the last one up: 1, 0, 7.'
      D: 'You went for 241 in base 8. That just relabels the digits. Changing the base changes the digits, so go through base ten first.'
  2:
    moments:
      - say: 'We want the shortest rod that can be cut exactly into 40 centimetre strips, and also exactly into 48 centimetre strips.'
      - say: 'If it cuts exactly into 40 centimetre strips, its length is a multiple of 40. If it cuts into 48 centimetre strips, it''s a multiple of 48. The least such length is the L.C.M.'
        write: '$\text{length} = \text{L.C.M.}(40,\ 48)$'
      - say: 'Let''s break each number into primes. 40 is 8 times 5, and 8 is 2 cubed.'
        write: '$40 = 2^{3} \times 5$'
      - say: '48 is 16 times 3, and 16 is 2 to the power 4.'
        write: '$48 = 2^{4} \times 3$'
      - say: 'For the L.C.M. we take every prime that appears, each to its highest power. That''s 2 to the 4, times 3, times 5.'
        write: '$\text{L.C.M.} = 2^{4} \times 3 \times 5$'
      - say: '2 to the 4 is 16. 3 times 5 is 15.'
        write: '$= 16 \times 15$'
      - say: '16 times 15 is 16 times 10, which is 160, plus 16 times 5, which is 80. 160 plus 80 is 240.'
        write: '$= 240$'
      - say: 'Let''s check. 240 divided by 40 is 6 strips, exactly.'
        write: '$240 \div 40 = 6$'
      - say: 'And 240 divided by 48 is 5 strips, exactly too.'
        write: '$240 \div 48 = 5$'
      - say: 'So the least length is 240 centimetres, which is answer choice B.'
        write: '$240 \text{ cm}$'
        answer: true
    traps:
      A: 'You went for 120 cm. It divides by 40, but 120 divided by 48 is 2.5, so the 48 centimetre strips wouldn''t come out exactly.'
      C: 'You went for 360 cm. 360 divided by 48 is 7.5, so it doesn''t even cut into 48 centimetre strips. The least common multiple is 240.'
      D: 'You went for 480 cm. It does work for both strips, but it isn''t the least. 240 already works, and the question asks for the least length.'
  3:
    moments:
      - say: 'A lawn has an area of 1815 square yards and a length of 50 metres. We want the width in metres, and 1 metre is 1.1 yards.'
      - say: 'The area is in yards but the length is in metres. Before we divide, both must be in the same unit. Let''s change the length into yards.'
        write: '$1 \text{ m} = 1.1 \text{ yd}$'
      - say: '50 metres is 50 times 1.1 yards. 50 times 1 is 50, and 50 times 0.1 is 5, so that''s 55 yards.'
        write: '$50 \text{ m} = 50 \times 1.1 = 55 \text{ yd}$'
      - say: 'For a rectangle, area is length times width, so width is area divided by length.'
        write: '$\text{width} = \dfrac{\text{area}}{\text{length}}$'
      - say: 'Put in 1815 square yards and 55 yards.'
        write: '$\text{width} = \dfrac{1815}{55}$'
      - say: '55 times 30 is 1650, and 55 times 3 is 165. 1650 plus 165 is 1815, so 1815 divided by 55 is 33.'
        write: '$\text{width} = 33 \text{ yd}$'
      - say: 'But that''s in yards, and the question wants metres. To go from yards to metres, divide by 1.1.'
        write: '$33 \text{ yd} = \dfrac{33}{1.1} \text{ m}$'
      - say: '33 divided by 1.1 is the same as 330 divided by 11, which is 30.'
        write: '$= \dfrac{330}{11} = 30 \text{ m}$'
      - say: 'So the width is 30 metres, which is answer choice D.'
        write: '$\text{width} = 30 \text{ m}$'
        answer: true
    traps:
      A: 'You went for 39.93. That comes from dividing 1815 by 50 and then multiplying by 1.1, which mixes the units. Change 50 metres to 55 yards first, divide to get 33 yards, then divide by 1.1.'
      B: 'You went for 35.00. That doesn''t come from the correct division. 1815 divided by 55 yards is 33 yards, and 33 divided by 1.1 is 30 metres.'
      C: 'You went for 33.00. That''s the width in yards. The question wants metres, so there''s one more step: 33 divided by 1.1 is 30.'
  4:
    moments:
      - say: 'We must round each number to two significant figures first, and only then work out the fraction.'
        write: '$\dfrac{0.02174 \times 1.2047}{0.023789}$'
      - say: 'Start with 0.02174. The leading zeros don''t count, so the first two significant figures are 2 and 1. The next digit is 7, which is 5 or more, so we round up.'
        write: '$0.02174 \approx 0.022$'
      - say: 'Next, 1.2047. The first two significant figures are 1 and 2. The next digit is 0, so we don''t round up.'
        write: '$1.2047 \approx 1.2$'
      - say: 'Then 0.023789. The significant figures are 2 and 3, and the next digit is 7, so we round up to 0.024.'
        write: '$0.023789 \approx 0.024$'
      - say: 'Now put the rounded numbers in.'
        write: '$\dfrac{0.022 \times 1.2}{0.024}$'
      - say: 'On top, 22 times 12 is 264, and there are four decimal places in total, so 0.022 times 1.2 is 0.0264.'
        write: '$= \dfrac{0.0264}{0.024}$'
      - say: 'Multiply the top and bottom by 10,000 to clear the decimals. That gives 264 over 240.'
        write: '$= \dfrac{264}{240}$'
      - say: '240 goes into 264 once, with 24 left over, and 24 over 240 is 0.1. So the answer is 1.1.'
        write: '$= 1.1$'
      - say: 'So the value is 1.1, which is answer choice C.'
        write: '$1.1$'
        answer: true
    traps:
      A: 'You went for 0.8. The rounded values give 0.0264 over 0.024, which is a little more than 1, so 0.8 is too small. Check each rounding and the division again.'
      B: 'You went for 0.9. That''s less than 1, but the top, 0.0264, is bigger than the bottom, 0.024, so the answer must be more than 1. It''s 1.1.'
      D: 'You went for 1.2. That may come from treating the 0.022 and 0.024 as cancelling out and leaving just 1.2. They don''t cancel; 0.022 over 0.024 is less than 1, and the answer is 1.1.'
  5:
    moments:
      - say: 'A train goes from P to Q at 90 kilometres per hour and comes straight back at 45 kilometres per hour. We want the average speed for the whole trip.'
      - say: 'Here''s the rule: average speed is total distance divided by total time. It is not the average of the two speeds.'
        write: '$\text{average speed} = \dfrac{\text{total distance}}{\text{total time}}$'
      - say: 'Let the distance from P to Q be $d$ kilometres. There and back, the total distance is $2d$.'
        write: '$\text{total distance} = 2d$'
      - say: 'Time is distance over speed. Going out, the time is $d$ over 90 hours.'
        write: '$t_{1} = \dfrac{d}{90}$'
      - say: 'Coming back, the time is $d$ over 45. To match the first time, write it over 90: multiply top and bottom by 2.'
        write: '$t_{2} = \dfrac{d}{45} = \dfrac{2d}{90}$'
      - say: 'Add the times. $d$ over 90 plus $2d$ over 90 is $3d$ over 90.'
        write: '$t_{1} + t_{2} = \dfrac{3d}{90}$'
      - say: '3 over 90 simplifies to 1 over 30, so the total time is $d$ over 30 hours.'
        write: '$\text{total time} = \dfrac{d}{30}$'
      - say: 'Now divide the total distance by the total time.'
        write: '$\text{average speed} = 2d \div \dfrac{d}{30}$'
      - say: 'Dividing by $d$ over 30 is multiplying by 30 over $d$. The $d$s cancel, and 2 times 30 is 60.'
        write: '$= 2d \times \dfrac{30}{d} = 60$'
      - say: 'Let''s check with 90 kilometres. Out takes 1 hour, back takes 2 hours. 180 kilometres in 3 hours is 60 kilometres per hour.'
        write: '$\dfrac{180}{3} = 60$'
      - say: 'So the average speed is 60 kilometres per hour, which is answer choice B.'
        write: '$60 \text{ km/h}$'
        answer: true
    traps:
      A: 'You went for 55 km/h. That''s too low. Total distance over total time gives 60 km/h; try it with 90 km each way: 180 km in 3 hours.'
      C: 'You went for 67.5 km/h. That''s 90 plus 45 divided by 2, the plain average of the speeds. The train spends twice as long at the slow speed, so the true average is lower: 60 km/h.'
      D: 'You went for 75 km/h. That''s higher than the plain average, but the slow return should pull the average down. Total distance over total time gives 60 km/h.'
  6:
    moments:
      - say: 'A square has its length increased by 20% and its width decreased by 20%, making a rectangle. We want the area of the rectangle compared with the area of the square.'
      - say: 'Let the side of the square be $s$. Its area is $s$ times $s$, which is $s$ squared.'
        write: '$\text{square area} = s^{2}$'
      - say: 'Increasing by 20% means we keep 100% and add 20%, making 120%, which is 1.2 times. So the length becomes $1.2s$.'
        write: '$\text{length} = 1.2s$'
      - say: 'Decreasing by 20% leaves 80%, which is 0.8 times. So the width becomes $0.8s$.'
        write: '$\text{width} = 0.8s$'
      - say: 'The rectangle''s area is length times width.'
        write: '$\text{rectangle area} = 1.2s \times 0.8s$'
      - say: '1.2 times 0.8: 12 times 8 is 96, and with two decimal places that''s 0.96. So the area is $0.96s^2$.'
        write: '$= 0.96s^{2}$'
      - say: 'Now the ratio of rectangle to square. The $s$ squared cancels, leaving 0.96 to 1.'
        write: '$0.96s^{2} : s^{2} = 0.96 : 1$'
      - say: 'Multiply both sides by 100 to clear the decimal: 96 to 100.'
        write: '$= 96 : 100$'
      - say: 'Divide both by 4. 96 divided by 4 is 24, and 100 divided by 4 is 25.'
        write: '$= 24 : 25$'
      - say: 'So the ratio is 24 to 25, which is answer choice D.'
        write: '$24 : 25$'
        answer: true
    traps:
      A: 'You went for 6 : 5. That''s just 1.2 to 1, the change in the length alone. The width shrinks too, so multiply 1.2 by 0.8 to get 0.96, which is 24 : 25.'
      B: 'You went for 25 : 24. That''s the ratio upside down: square to rectangle. The question asks for the rectangle first, so it''s 24 : 25.'
      C: 'You went for 5 : 6. That is 1 to 1.2, which only looks at the length. Multiply both factors, 1.2 times 0.8, to get 0.96, which is 24 : 25.'
  7:
    moments:
      - say: 'Two brothers put ₦5,000 into a farm and sold the harvest for ₦15,000. The profit is shared in the ratio 2 to 3, and we want the difference between their shares.'
      - say: 'The first thing we need is the profit. Profit is what''s left after getting back the money invested.'
        write: '$\text{profit} = 15{,}000 - 5{,}000$'
      - say: '15,000 minus 5,000 is 10,000. So the profit is ₦10,000.'
        write: '$\text{profit} = 10{,}000$'
      - say: 'Now share it in the ratio 2 to 3. That''s 2 plus 3, which is 5 parts altogether.'
        write: '$2 + 3 = 5 \text{ parts}$'
      - say: 'Each part is 10,000 divided by 5, which is ₦2,000.'
        write: '$1 \text{ part} = 10{,}000 \div 5 = 2{,}000$'
      - say: 'The first brother gets 2 parts: 2 times 2,000 is ₦4,000.'
        write: '$2 \times 2{,}000 = 4{,}000$'
      - say: 'The second brother gets 3 parts: 3 times 2,000 is ₦6,000.'
        write: '$3 \times 2{,}000 = 6{,}000$'
      - say: 'The difference is 6,000 minus 4,000, which is ₦2,000. That''s exactly one part, since 3 minus 2 is 1.'
        write: '$6{,}000 - 4{,}000 = 2{,}000$'
      - say: 'So the difference is ₦2,000, which is answer choice A.'
        write: 'Difference: ₦2,000'
        answer: true
    traps:
      B: 'You went for ₦4,000. That''s the smaller brother''s share, not the difference. The shares are ₦4,000 and ₦6,000, so the difference is ₦2,000.'
      C: 'You went for ₦6,000. That''s the bigger brother''s share. Subtract the smaller share, ₦4,000, to get the difference: ₦2,000.'
      D: 'You went for ₦10,000. That''s the whole profit. The question wants the difference between the two shares, which is one of the five parts: ₦2,000.'
  8:
    moments:
      - say: 'Peter earns ₦20 a week for 20 weeks, then ₦36 a week for 24 weeks. His average for the whole year is ₦30. We want his average for the last 8 weeks.'
      - say: 'Averages are tricky to combine, but totals are easy. An average times the number of weeks gives the total, so let''s work with totals.'
        write: '$\text{total} = \text{average} \times \text{weeks}$'
      - say: 'A year has 52 weeks. And 20 plus 24 plus 8 is 52, so the three periods fill the year.'
        write: '$20 + 24 + 8 = 52$'
      - say: 'The total for the whole year is 52 times ₦30. 50 times 30 is 1,500, and 2 times 30 is 60, so that''s ₦1,560.'
        write: '$52 \times 30 = 1560$'
      - say: 'The first 20 weeks earn 20 times ₦20, which is ₦400.'
        write: '$20 \times 20 = 400$'
      - say: 'The next 24 weeks earn 24 times ₦36. 24 times 30 is 720, and 24 times 6 is 144. 720 plus 144 is ₦864.'
        write: '$24 \times 36 = 864$'
      - say: 'Together, those first 44 weeks earn 400 plus 864, which is ₦1,264.'
        write: '$400 + 864 = 1264$'
      - say: 'So the last 8 weeks must earn what''s left: 1,560 minus 1,264, which is ₦296.'
        write: '$1560 - 1264 = 296$'
      - say: 'The average for those 8 weeks is 296 divided by 8. 8 times 37 is 296, so it''s ₦37.'
        write: '$296 \div 8 = 37$'
      - say: 'So his average weekly wage for the last 8 weeks is ₦37, which is answer choice A.'
        write: 'Average: ₦37.00'
        answer: true
    traps:
      B: 'You went for ₦35. Check the totals: the year is 52 times 30, which is 1,560; the first two periods make 1,264; that leaves 296, and 296 divided by 8 is 37.'
      C: 'You went for ₦30. That assumes the last weeks just match the yearly average. The early weeks paid only ₦20, so the later ones must pay more to bring the average up: ₦37.'
      D: 'You went for ₦5. That''s far too small to lift the average to ₦30. The last 8 weeks earn ₦296 in total, which is ₦37 a week.'
  9:
    moments:
      - say: 'Money is invested at 4% simple interest. After 3 years the amount is ₦7,000. We want the sum first invested, the principal.'
      - say: 'With simple interest, the amount is the principal plus the interest. The interest is $P$ times $R$ times $T$ over 100.'
        write: '$A = P + \dfrac{PRT}{100}$'
      - say: 'Here the rate is 4 and the time is 3 years. 4 times 3 is 12, so the interest is 12 over 100 of $P$, which is $0.12P$.'
        write: '$\dfrac{P \times 4 \times 3}{100} = 0.12P$'
      - say: 'So the amount is $P$ plus $0.12P$, which is $1.12P$.'
        write: '$A = P + 0.12P = 1.12P$'
      - say: 'The amount is ₦7,000, so $1.12P$ equals 7,000.'
        write: '$1.12P = 7000$'
      - say: 'To get $P$ by itself, divide both sides by 1.12.'
        write: '$P = \dfrac{7000}{1.12}$'
      - say: 'Multiply the top and bottom by 100 to clear the decimal: 700,000 over 112.'
        write: '$P = \dfrac{700{,}000}{112}$'
      - say: '112 times 6,000 is 672,000. That leaves 28,000, and 112 times 250 is 28,000. So the answer is 6,250.'
        write: '$P = 6250$'
      - say: 'Let''s check. The interest is 6,250 times 0.12, which is 750. And 6,250 plus 750 is 7,000.'
        write: '$6250 + 750 = 7000$'
      - say: 'So the sum invested was ₦6,250, which is answer choice B.'
        write: 'Principal: ₦6,250.00'
        answer: true
    traps:
      A: 'You went for ₦7,840. That''s 7,000 plus 12% of 7,000. But ₦7,000 is already the final amount; we need to go backwards, dividing by 1.12, to get ₦6,250.'
      C: 'You went for ₦6,160. That''s 7,000 minus 12% of 7,000. The interest is 12% of the principal, not of the final amount, so divide 7,000 by 1.12 instead.'
      D: 'You went for ₦5,833.33. That''s 7,000 divided by 1.2, as if the interest were 20%. 4% for 3 years is 12%, so divide by 1.12.'
  10:
    moments:
      - say: 'A trader sells 20 oranges for ₦1.35 and makes 8% profit. We want his percentage gain or loss if he sells them for ₦1.10 instead.'
      - say: 'Profit and loss percentages are always measured against the cost price. So first let''s find the cost price, $C$.'
      - say: 'An 8% profit means he sold at 100% plus 8%, which is 108% of the cost. So 1.08 times $C$ is 1.35.'
        write: '$1.08C = 1.35$'
      - say: 'Divide both sides by 1.08.'
        write: '$C = \dfrac{1.35}{1.08}$'
      - say: 'Multiply top and bottom by 100: 135 over 108. Both divide by 27. 135 divided by 27 is 5, and 108 divided by 27 is 4.'
        write: '$C = \dfrac{135}{108} = \dfrac{5}{4}$'
      - say: '5 over 4 is 1.25. So the cost price is ₦1.25.'
        write: '$C = 1.25$'
      - say: 'Now he sells for ₦1.10. That''s less than ₦1.25, so it''s a loss. 1.25 minus 1.10 is 0.15.'
        write: '$\text{loss} = 1.25 - 1.10 = 0.15$'
      - say: 'As a percentage, divide the loss by the cost price and multiply by 100.'
        write: '$\dfrac{0.15}{1.25} \times 100\%$'
      - say: '0.15 over 1.25 is 15 over 125, after multiplying top and bottom by 100. Both divide by 5: 15 divided by 5 is 3, and 125 divided by 5 is 25.'
        write: '$= \dfrac{3}{25} \times 100\%$'
      - say: '100 divided by 25 is 4, and 3 times 4 is 12. So it''s a 12% loss.'
        write: '$= 12\%$'
      - say: 'So he makes a loss of 12%, which is answer choice C.'
        write: '$12\% \text{ loss}$'
        answer: true
    traps:
      A: 'You went for 8%. That''s the profit on the first sale. At ₦1.10 he sells below the cost of ₦1.25, so it''s a loss, and 0.15 over 1.25 is 12%.'
      B: 'You went for 10%. The loss of ₦0.15 has to be compared with the cost price, ₦1.25. 0.15 over 1.25 is 12%.'
      D: 'You went for 15%. That''s the 15 kobo loss read as a percentage. We must divide it by the cost price, ₦1.25, which gives 12%.'
  11:
    moments:
      - say: 'Four boys and eight girls cut a field in 5 hours. Boys work at a quarter of the rate of girls. We want how many boys alone would cut the field in 3 hours.'
      - say: 'Boys and girls work at different speeds, so let''s measure everything in one unit: the work one boy does in one hour. We''ll call it a boy-hour.'
      - say: 'A boy works at a quarter of a girl''s rate. Turned around, that means one girl does as much as 4 boys.'
        write: '$1 \text{ girl} = 4 \text{ boys}$'
      - say: 'So 8 girls are worth 8 times 4, which is 32 boys.'
        write: '$8 \text{ girls} = 8 \times 4 = 32 \text{ boys}$'
      - say: 'Add the 4 real boys: 4 plus 32 is 36. So the whole team works like 36 boys.'
        write: '$4 + 32 = 36 \text{ boys}$'
      - say: '36 boys take 5 hours, so the field needs 36 times 5 boy-hours of work.'
        write: '$36 \times 5 = 180 \text{ boy-hours}$'
      - say: 'Now we want that same 180 boy-hours done in only 3 hours.'
        write: '$\text{boys} \times 3 = 180$'
      - say: 'Divide both sides by 3. 180 divided by 3 is 60.'
        write: '$\text{boys} = \dfrac{180}{3} = 60$'
      - say: 'Does that make sense? Boys are slow, and we have less time, so we''d expect a lot of them. 60 fits.'
      - say: 'So 60 boys are needed, which is answer choice B.'
        write: '$60 \text{ boys}$'
        answer: true
    traps:
      A: 'You went for 180. That''s the total work in boy-hours. It still has to be shared over the 3 hours: 180 divided by 3 is 60 boys.'
      C: 'You went for 25. That''s too few. A girl is worth 4 boys, so the team is worth 36 boys, the work is 180 boy-hours, and 180 over 3 hours is 60 boys.'
      D: 'You went for 20. That treats a girl as worth just one boy: 12 workers times 5 hours is 60, divided by 3 is 20. But each girl does the work of 4 boys, so the answer is 60.'
  12:
    moments:
      - say: 'We want 125 to the power 4 thirds, divided by 16 to the power 3 quarters, without tables.'
        write: '$\dfrac{125^{\frac{4}{3}}}{16^{\frac{3}{4}}}$'
      - say: 'A fractional power has two parts. The bottom number is a root, and the top number is a power. It''s easiest to take the root first, so the numbers stay small.'
        write: '$a^{\frac{m}{n}} = \left(\sqrt[n]{a}\right)^{m}$'
      - say: 'Start with the top. 125 to the 4 thirds is the cube root of 125, raised to the power 4.'
        write: '$125^{\frac{4}{3}} = \left(\sqrt[3]{125}\right)^{4}$'
      - say: '5 times 5 times 5 is 125, so the cube root of 125 is 5.'
        write: '$= 5^{4}$'
      - say: '5 to the 4 is 5 times 5, which is 25, times 25 again, which is 625.'
        write: '$= 625$'
      - say: 'Now the bottom. 16 to the 3 quarters is the fourth root of 16, cubed.'
        write: '$16^{\frac{3}{4}} = \left(\sqrt[4]{16}\right)^{3}$'
      - say: '2 times 2 times 2 times 2 is 16, so the fourth root of 16 is 2.'
        write: '$= 2^{3}$'
      - say: '2 cubed is 8.'
        write: '$= 8$'
      - say: 'So the top is 625 and the bottom is 8, giving 625 over 8, which is answer choice A.'
        write: '$\dfrac{625}{8}$'
        answer: true
    traps:
      B: 'You went for 8 over 625. That''s the fraction upside down. The 125 part is on top, and it gives 625, so it''s 625 over 8.'
      C: 'You went for 1 over 8. The bottom, 16 to the 3 quarters, is 8, but the top isn''t 1. The cube root of 125 is 5, and 5 to the 4 is 625.'
      D: 'You went for 8. That''s only the bottom of the fraction. The top works out to 625, so the answer is 625 over 8.'
  13:
    moments:
      - say: 'A student should have written 35 over 6 to 3 significant figures, but wrote it to 3 decimal places. We want his error, in standard form.'
      - say: 'First, let''s turn 35 over 6 into a decimal. 6 goes into 35 five times, with 5 left over, then 50 divided by 6 is 8 remainder 2, then 20 divided by 6 is 3 remainder 2, and the 3 keeps repeating.'
        write: '$\dfrac{35}{6} = 5.8333\ldots$'
      - say: 'To 3 significant figures we keep 5, 8 and 3. The next digit is 3, which is less than 5, so we don''t round up.'
        write: '$\text{3 s.f.: } 5.83$'
      - say: 'To 3 decimal places we keep three digits after the point: 8, 3, 3. The next digit is 3, so again no rounding up.'
