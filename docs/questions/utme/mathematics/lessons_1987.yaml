      C: 'You went for 33. That is $CF$ of 5, which stops one score short. "Less than or equal to 6" includes the 5 students who scored exactly 6, making 38.'
      D: 'You went for 5. That is only the $f$ for the score 6, the students who scored exactly 6. $CF$ of 6 counts everyone who scored 6 or less, which is 38.'
  50:
    moments:
      - section: 'The question'
        say: 'There are five shapes, a square, a rectangle, a rhombus, a kite and a trapezium. One is picked at random. What is the probability that it is a parallelogram? None of them is called a parallelogram.'
        write: 'Five shapes: $P(\text{parallelogram}) = ?$'
        doodle: {name: 'custom:1987_q50_a', id: box, caption: 'five shapes on slips', size: scene}
      - say: 'Solution. Let $E$ be the event that the shape is a parallelogram. Let me draw the five shapes.'
        write: 'Solution: let $E$ = a parallelogram'
        show_sketch: true
      - say: 'There are 5 shapes, each equally likely. So n of $S$ is 5.'
        write: '$n(S) = 5$'
      - section: 'Test each shape'
        say: 'A parallelogram is a four-sided shape with both pairs of opposite sides parallel. Test each shape against that.'
        write: 'Parallelogram: both pairs of opposite sides parallel'
      - say: 'In a square, both pairs of opposite sides are parallel, so yes. A rectangle is the same, so yes.'
        write: 'Square: yes; rectangle: yes'
        point:
          - {figure: sketch, kind: circle, target: square}
          - {figure: sketch, kind: circle, target: rectangle}
      - say: 'A rhombus has its opposite sides parallel too, so yes.'
        write: 'Rhombus: yes'
        point:
          - {figure: sketch, kind: circle, target: rhombus}
      - say: 'In a kite, the equal sides are next to each other, and no sides are parallel. So no. Cross the kite slip out.'
        write: 'Kite: no'
        doodle_do:
          - {id: box, op: cross, part: kite}
        point:
          - {figure: sketch, kind: strike, target: kite}
      - say: 'A trapezium has only one pair of parallel sides, so no. Cross it out too.'
        write: 'Trapezium: no'
        doodle_do:
          - {id: box, op: cross, part: trap}
        point:
          - {figure: sketch, kind: strike, target: trapezium}
      - say: 'Three slips are left, the square, the rectangle and the rhombus. So n of $E$ is 3.'
        write: '$n(E) = 3$'
        doodle_do:
          - {id: box, op: highlight, part: sq}
          - {id: box, op: highlight, part: rect}
          - {id: box, op: highlight, part: rhom}
      - section: 'The probability'
        say: 'The probability of $E$ is n of $E$ over n of $S$, that is, the number of favourable outcomes over the total number of possible outcomes.'
        write: '$P(E) = \dfrac{n(E)}{n(S)}$'
      - say: 'Substitute, and we get 3 over 5.'
        write: '$= \dfrac{3}{5}$'
        doodle_do:
          - {id: box, op: label, part: count, text: '3 out of 5'}
        point:
          - {line: 10, kind: move, from: {line: 8, at: '= 3'}, at: '5[[3]]', text: 'n(E)'}
          - {line: 10, kind: move, from: {line: 2, at: '= 5'}, at: '[[5]]3', text: 'n(S)'}
      - section: 'Check'
        say: 'Check with the complement. The kite and the trapezium are not parallelograms, so 2 over 5. And 3 over 5 plus 2 over 5 is 1.'
        write: 'Check: $P(E^{\prime}) = \dfrac{2}{5}$, $\ \dfrac{3}{5} + \dfrac{2}{5} = 1\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the probability of picking a parallelogram is 3 over 5, which is option A.'
        write: '$\therefore P(\text{parallelogram}) = \dfrac{3}{5}$'
        answer: true
    traps:
      B: 'You went for 2 over 5. That leaves out one parallelogram, or it is P of E complement, the kite and the trapezium. The square, the rectangle and the rhombus all have both pairs of opposite sides parallel, so it is 3 out of 5.'
      C: 'You went for 4 over 5. That counts the kite or the trapezium too. A kite has no parallel sides and a trapezium has only one pair, so n of E is 3.'
      D: 'You went for 1 over 5. None of the shapes is named "parallelogram", but squares, rectangles and rhombuses are all special parallelograms. n of E is 3.'
