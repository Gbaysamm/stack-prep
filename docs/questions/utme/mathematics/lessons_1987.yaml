      B: 'You went for 8 over 17. That''s the height over the diagonal, which is the sine of the angle. Cosine uses the side along the floor, 15, so it''s 15 over 17.'
      C: 'You went for 8 over 15. That''s the height over the floor diagonal, which is the tangent. Cosine is adjacent over hypotenuse: 15 over 17.'
      D: 'You went for 12 over 17. The side next to the angle isn''t the room''s length, 12; it''s the floor diagonal, 15. So the cosine is 15 over 17.'
  42:
    moments:
      - say: 'The earth has radius $R$. We want the circumference of the circle of latitude theta.'
        write: 'Earth radius $R$, latitude $\theta$'
        point:
          - {figure: sketch, kind: circle, target: 'R', text: 'earth radius'}
          - {figure: sketch, kind: circle, target: 'θ', text: 'latitude'}
      - say: 'A circle of latitude runs round the earth parallel to the equator. As you move north or south, these circles get smaller. So first we need the radius of this circle. Let''s call it $r$.'
        write: 'Let radius of latitude circle $= r$'
      - say: 'Picture a slice through the centre of the earth. The line from the centre to a point at latitude theta is the earth''s radius, $R$, and it makes angle theta with the equator.'
        write: 'Hypotenuse $= R$, angle at centre $= \theta$'
        show_sketch: true
        point:
          - {figure: sketch, kind: highlight, target: OA, text: 'R'}
          - {figure: sketch, kind: arc, target: BOA, text: 'θ'}
      - say: 'The small radius $r$ is the distance from the earth''s axis across to that point. It is parallel to the equator, so in the right-angled triangle it lies next to the angle theta.'
        write: '$r$ is adjacent to $\theta$'
        point:
          - {figure: sketch, kind: highlight, target: CA, text: 'r'}
      - say: 'SOH CAH TOA: the cosine of an angle is the adjacent side over the hypotenuse.'
        write: '$\cos\theta = \dfrac{\text{adjacent}}{\text{hypotenuse}}$'
      - say: 'Adjacent over hypotenuse is cosine, so $r$ over $R$ is cos theta.'
        write: '$\cos\theta = \dfrac{r}{R}$'
      - say: 'Multiply both sides by $R$.'
        write: '$r = R\cos\theta$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= [[R]]r'}, at: '= [[R]]cos', text: 'times R'}
      - say: 'The circumference of any circle is 2 pi times its radius.'
        write: 'Circumference $= 2\pi r$'
        point:
          - {figure: sketch, kind: circle, target: 'r', text: 'its radius'}
      - say: 'Put in the radius we just found, $R$ cos theta.'
        write: '$= 2\pi R\cos\theta$'
        point:
          - {line: 7, kind: box, text: 'the rule'}
          - {line: 8, kind: move, from: {line: 6, at: '= Rcosθ'}, at: 'Rcosθ', text: 'r'}
          - {figure: sketch, kind: label, target: 'CA', text: 'R cos θ'}
      - say: 'Let''s check. At the equator theta is zero, cos zero is 1, and we get 2 pi $R$, the full distance round the earth.'
        write: 'Check $\theta = 0^{\circ}$: $2\pi R\cos 0^{\circ} = 2\pi R$'
      - say: 'At a pole, theta is 90 degrees, cos 90 degrees is zero, and the circle shrinks to a point.'
        write: 'Check $\theta = 90^{\circ}$: $2\pi R\cos 90^{\circ} = 0$'
        point:
          - {figure: sketch, kind: circle, target: 'N', text: 'pole: circle is a point'}
      - say: 'So the circumference is 2 pi $R$ cos theta, which is answer choice B.'
        write: 'Therefore circumference $= 2\pi R\cos\theta$'
        answer: true
    traps:
      A: 'You went for $R$ cos theta. That''s the radius of the circle of latitude. The circumference is 2 pi times the radius: 2 pi $R$ cos theta.'
      C: 'You went for $R$ sin theta. That would make the circle zero at the equator, which is wrong, and it''s a radius, not a circumference. The answer is 2 pi $R$ cos theta.'
      D: 'You went for 2 pi $R$ sin theta. At the equator, sin zero is zero, which would give the equator no length at all. The radius uses cosine: 2 pi $R$ cos theta.'
  43:
    moments:
      - say: 'A pyramid has a square base of side 8 centimetres, with its vertex directly above the centre. Each slant edge is 4 root 3 centimetres. We want the height.'
        write: 'Base side $= 8$ cm, slant edge $= 4\sqrt{3}$ cm'
      - say: 'Let me draw the pyramid.'
        show_sketch: true
        point:
          - {figure: sketch, kind: highlight, target: VC, text: 'slant edge'}
      - say: 'Pythagoras: the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hypotenuse}^{2} = \text{opposite}^{2} + \text{adjacent}^{2}$'
      - say: 'Now let me draw the height $VO$, straight down to the centre $O$ of the base, and join $O$ to the corner $C$.'
        show_sketch: sketch_b
        point:
          - {figure: sketch_b, kind: circle, target: O, text: 'centre'}
      - say: 'The height drops from the vertex straight down to the centre of the base. A slant edge goes from the vertex to a corner. With the line from the centre to that corner, they make a right-angled triangle.'
        write: '$\text{edge}^{2} = h^{2} + (\text{centre to corner})^{2}$'
        point:
          - {figure: sketch_b, kind: underline, target: VO, text: 'h'}
          - {figure: sketch_b, kind: highlight, target: OC, text: 'centre to corner'}
      - say: 'The centre to a corner is half the diagonal of the square. The diagonal cuts the square into two right-angled triangles with sides 8 and 8.'
        write: 'Diagonal $= \sqrt{8^{2} + 8^{2}}$'
        point:
          - {figure: sketch_b, kind: underline, target: AC, text: 'diagonal'}
      - say: '8 squared plus 8 squared is 64 plus 64, which is 128. And 128 is 64 times 2, so its square root is 8 root 2.'
        write: '$= \sqrt{128} = \sqrt{64 \times 2} = 8\sqrt{2}$'
      - say: 'Half of 8 root 2 is 4 root 2.'
        write: 'Centre to corner $= \tfrac{1}{2} \times 8\sqrt{2} = 4\sqrt{2}$'
      - say: 'Now Pythagoras. The slant edge is the hypotenuse, so $h$ squared is the edge squared minus the 4 root 2 squared.'
        write: '$h^{2} = (4\sqrt{3})^{2} - (4\sqrt{2})^{2}$'
        point:
          - {line: 8, kind: move, from: {line: 0, at: '= 43'}, at: '(43)', text: 'edge'}
          - {line: 8, kind: move, from: {line: 7, at: '= 42'}, at: '(42)', text: 'half diagonal'}
      - say: '4 root 3, all squared, is 4 squared times 3, which is 16 times 3, or 48.'
        write: '$(4\sqrt{3})^{2} = 16 \times 3 = 48$'
      - say: '4 root 2, all squared, is 16 times 2, which is 32.'
        write: '$(4\sqrt{2})^{2} = 16 \times 2 = 32$'
      - say: 'So $h$ squared is 48 minus 32, which is 16.'
        write: '$h^{2} = 48 - 32 = 16$'
      - say: 'The square root of 16 is 4.'
        write: '$h = \sqrt{16} = 4$'
        point:
          - {figure: sketch_b, kind: label, target: VO, text: '4 cm'}
      - say: 'So the height is 4 centimetres, which is answer choice C.'
        write: 'Height $= 4$ cm'
        answer: true
        point:
          - {figure: sketch_b, kind: circle, target: 'h', text: '4 cm'}
    traps:
      A: 'You went for 6 cm. Then the slant edge would be the square root of 36 plus 32, which is about 8.2, not 4 root 3. Use $h$ squared equals 48 minus 32, which gives 4.'
      B: 'You went for 5 cm. That would need $h$ squared to be 25, but 48 minus 32 is 16. The height is 4 cm.'
      D: 'You went for 3 cm. That would need $h$ squared to be 9. The edge squared is 48 and the half-diagonal squared is 32, so $h$ squared is 16 and $h$ is 4.'
  44:
    moments:
      - say: 'We''re asked to name the construction in the figure. The best way is to see where it starts, because that tells us what was given.'
        write: 'Start: point $P$ and a line'
      - say: 'In the figure, it starts at $P$, a point off the line. An arc centred at $P$ cuts the line at two points, $Q$ and $R$.'
        write: 'Arc with centre $P$ cuts the line at $Q$ and $R$'
        point:
          - {figure: 0, kind: circle, target: P, text: 'given point'}
      - say: 'Both points are on the same arc from $P$, so $P Q$ equals $P R$.'
        write: '$PQ = PR$'
        point:
          - {figure: 0, kind: highlight, target: PQ}
          - {figure: 0, kind: highlight, target: PR}
      - say: 'Next, arcs of equal radius are drawn from $Q$ and from $R$, meeting at $X$ on the other side of the line. So $X Q$ equals $X R$.'
        write: '$XQ = XR$'
        point:
          - {figure: 0, kind: highlight, target: XQ}
          - {figure: 0, kind: highlight, target: XR}
      - say: 'A point that is the same distance from $Q$ and from $R$ lies on the perpendicular bisector of $Q R$. Both $P$ and $X$ are such points.'
        write: '$P$ and $X$ lie on the perpendicular bisector of $QR$'
        point:
          - {figure: 0, kind: circle, target: 'P'}
          - {figure: 0, kind: circle, target: 'X', text: 'both equidistant from Q, R'}
      - say: 'Two points fix a line, so the line $P X$ is that perpendicular bisector. It meets the given line at a right angle.'
        write: 'So $PX \perp QR$'
        point:
          - {figure: 0, kind: underline, target: PX, text: '⊥ QR'}
      - say: 'And the line $P X$ passes through $P$, the given point off the line.'
        write: '$PX$ passes through the given point $P$'
        point:
          - {figure: 0, kind: highlight, target: 'PX', text: 'through P'}
      - say: 'So what we have made is a line from the given point $P$ that meets the given line at a right angle: the perpendicular from a point to a line.'
        write: 'Construction: perpendicular from $P$ to the line'
        point:
          - {figure: 0, kind: highlight, target: 'PX', text: 'perpendicular'}
          - {figure: 0, kind: underline, target: 'QR', text: 'the given line'}
      - say: 'The other answers don''t fit. $P$ is not on the line, so it isn''t C. And $Q$ and $R$ were made by the construction, not given, so it isn''t A.'
        write: 'Not C: $P$ is off the line. Not A: $Q$, $R$ were not given'
        point:
          - {figure: 0, kind: circle, target: 'P', text: 'off the line'}
          - {figure: 0, kind: circle, target: 'Q'}
          - {figure: 0, kind: circle, target: 'R', text: 'made by the construction'}
      - say: 'So this is the construction of the perpendicular from a given point to a given line, which is answer choice B.'
        write: 'Therefore: perpendicular from a given point to a given line'
        answer: true
        point:
          - {figure: 0, kind: highlight, target: 'PX', text: 'the perpendicular'}
    traps:
      A: 'You went for the perpendicular bisector of a given line. $P X$ does bisect $Q R$, but $Q$ and $R$ were made by the construction. What was given was the point $P$ off the line, so this is the perpendicular from $P$.'
      C: 'You went for a perpendicular from a point on the line. Here $P$ is off the line, above it, not on it. So it''s the perpendicular from a given point to a given line.'
      D: 'You went for a given angle. No angle is being copied here. The arcs from $P$, then from $Q$ and $R$, build a perpendicular from $P$ to the line.'
