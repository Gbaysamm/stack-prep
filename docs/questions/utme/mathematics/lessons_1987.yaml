# UTME 1987 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1987.yaml. Answers match that file.
format_version: 1
exam_year: 1987
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'Two-four-one base five, to base eight. There is no direct road from base five to base eight, so we go through base ten.'
        write: 'Convert $241_{5}$ to base 8.'
      - say: 'First, change two-four-one base five to base ten.'
        write: 'Solution'
      - section: 'Step 1: base 5 to base 10'
        say: 'Write the index numbers over the digits, starting from nought on the right: nought, one, two.'
        write: '$\overset{2}{2}\,\overset{1}{4}\,\overset{0}{1}_{5}$'
      - say: 'Each digit times five to the power of its index: two times five squared, plus four times five to the power one, plus one times five to the power nought.'
        write: '$= 2 \times 5^{2} + 4 \times 5^{1} + 1 \times 5^{0}$'
      - say: 'Five squared is 25. Five to the power one is 5. Anything to the power nought is 1.'
        write: '$= 2 \times 25 + 4 \times 5 + 1 \times 1$'
      - say: '2 times 25 is 50. 4 times 5 is 20. 1 times 1 is 1.'
        write: '$= 50 + 20 + 1$'
      - say: '50 plus 20 plus 1 is 71, base ten.'
        write: '$= 71_{10}$'
      - section: 'Step 2: base 10 to base 8'
        say: 'Now divide 71 by 8 again and again, and write the remainders by the side. This is the division ladder.'
        diagram: {id: L, kind: ladder, divisor: 8, number: 71, 'on': 'division ladder'}
      - say: '71 divided by 8 is 8, remainder 7. The remainder is what is left after making bundles of eight.'
        diagram_do:
          - {id: L, op: step, 'on': 'remainder 7'}
        doodle: {name: 'custom:1987_q01_b', id: sticks, caption: '71 = 8 eights and 7 left', 'on': 'bundles of eight'}
      - say: '8 divided by 8 is 1, remainder 0.'
        diagram_do:
          - {id: L, op: step}
      - say: '1 divided by 8 is 0, remainder 1. We stop at 0.'
        diagram_do:
          - {id: L, op: step}
      - say: 'Read the remainders from the bottom up: one, zero, seven. So 71 is one-zero-seven base eight.'
        diagram_do:
          - {id: L, op: read, 'on': 'bottom up'}
        write: '$71_{10} = 107_{8}$'
        point:
          - {line: 11, kind: highlight, at: '1078', to: {diagram: L, part: result}}
      - section: 'Check'
        say: 'Check by expanding back. Index numbers over the digits again: two, one, nought. Then each digit times eight to the power of its index.'
        write: '$\overset{2}{1}\,\overset{1}{0}\,\overset{0}{7}_{8} = 1 \times 8^{2} + 0 \times 8^{1} + 7 \times 8^{0}$'
      - say: 'Eight squared is 64, so we get 64 plus 0 plus 7, which is 71. It agrees.'
        write: '$= 64 + 0 + 7 = 71\ \checkmark$'
        point:
          - {line: 13, kind: move, from: {line: 6, at: '7110'}, at: '71', text: 'what we started with'}
      - section: 'Answer'
        say: 'Therefore two-four-one base five is one-zero-seven base eight: option B.'
        write: '$\therefore 241_{5} = 107_{8}$'
        answer: true
    traps:
      A: 'You went for seven-one base eight. 71 is the base-ten value: you stopped halfway. Divide 71 by 8 on the ladder and read the remainders from the bottom up: one-zero-seven.'
      C: 'You went for one-seven-six base eight. You read the remainders from the top down, or slipped in a division. Read the remainders from the bottom up: one-zero-seven.'
      D: 'You went for two-four-one base eight. You changed only the label. The digits change when the base changes: two-four-one base five is 71, which is one-zero-seven base eight.'
  2:
    moments:
      - say: 'We want the shortest rod that can be cut exactly into 40 centimetre strips, and also exactly into 48 centimetre strips. Picture the same rod, cut two different ways.'
        doodle: {name: 'custom:1987_q02_a', id: rods, caption: 'Cut into 40 cm or 48 cm strips'}
        write: 'Strips of $40$ cm or $48$ cm'
      - say: 'If the rod cuts exactly into 40 centimetre strips, its length is a multiple of 40. If it cuts exactly into 48 centimetre strips, it is a multiple of 48. The least length that is both is the L.C.M., the lowest common multiple.'
        write: 'Least length $= \text{L.C.M.}(40,\ 48)$'
      - say: 'To find the L.C.M., we break each number into primes. 40 is 8 times 5, and 8 is 2 times 2 times 2, which is 2 cubed.'
        write: '$40 = 8 \times 5 = 2^{3} \times 5$'
      - say: '48 is 16 times 3, and 16 is 2 times 2 times 2 times 2, which is 2 to the power 4.'
        write: '$48 = 16 \times 3 = 2^{4} \times 3$'
      - say: 'For the L.C.M. we take every prime that appears, each to its highest power. The 2 appears as 2 cubed and as 2 to the 4, so we take 2 to the 4. Then we take the 3 and the 5.'
        write: '$\text{L.C.M.} = 2^{4} \times 3 \times 5$'
        point:
          - {line: 3, kind: circle, at: '24', text: 'highest power'}
      - say: '2 to the 4 is 16, and 3 times 5 is 15.'
        write: '$= 16 \times 15$'
      - say: '16 times 10 is 160, and 16 times 5 is 80. 160 plus 80 is 240.'
        write: '$= 16 \times 10 + 16 \times 5 = 160 + 80 = 240$'
      - say: 'Let''s check that 240 really works. 240 divided by 40 is 6, so it gives 6 strips of 40 centimetres exactly. Watch the top rod fall into 6 strips.'
        doodle_do: [{id: rods, op: stage, stage: 'custom:1987_q02_a2'}, {id: rods, op: label, part: rod40, text: '6 strips'}]
        write: 'Check: $240 \div 40 = 6$'
      - say: 'And 240 divided by 48 is 5, so it gives 5 strips of 48 centimetres exactly too. The bottom rod falls into 5 strips, with nothing left over.'
        doodle_do: [{id: rods, op: stage, stage: 'custom:1987_q02_a3'}, {id: rods, op: label, part: rod48, text: '5 strips'}]
        write: 'and $240 \div 48 = 5$'
      - say: 'Look at the bracket under the rods. So the least length is 240 centimetres, which is answer choice B.'
        doodle_do: [{id: rods, op: label, part: len, text: '240 cm'}]
        write: 'Least length $= 240$ cm'
        answer: true
        point:
          - {line: 9, kind: highlight, at: '240', to: {doodle: rods, part: len}}
    traps:
      A: 'You went for 120 cm. It divides by 40, but 120 divided by 48 is 2.5, so the 48 centimetre strips wouldn''t come out exactly. The L.C.M. of 40 and 48 is 240.'
      C: 'You went for 360 cm. 360 divided by 48 is 7.5, so it doesn''t cut exactly into 48 centimetre strips. The lowest common multiple is 240.'
      D: 'You went for 480 cm. It does work for both strips, but it is 2 times 240, so it isn''t the least. The question asks for the least length, which is the L.C.M., 240.'
  3:
    moments:
      - say: 'A lawn has an area of 1815 square yards, and its length is 50 metres. We want its width in metres, using 1 metre equals 1.1 yards.'
        write: 'Area $= 1815\ \text{yd}^{2}$, length $= 50$ m'
      - say: 'Let me draw the lawn.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'Area 1815 yd²'}
      - say: 'The area is in yards but the length is in metres, so we can''t divide yet. Both must be in the same unit. Let''s change the length into yards. Picture a metre stick beside a yard stick: the metre sticks out a little.'
        doodle: {name: 'custom:1987_q03_a', id: sticks, caption: 'a metre is a bit more than a yard'}
        write: '$1 \text{ m} = 1.1 \text{ yd}$'
      - say: '50 metres is 50 times 1.1 yards. 50 times 1 is 50, and 50 times 0.1 is 5, so that is 55 yards. Fifty metre sticks laid end to end reach 55 yards.'
        doodle_do: [{id: sticks, op: stage, stage: 'custom:1987_q03_a2'}]
        write: 'Length $= 50 \times 1.1 = 50 + 5 = 55$ yd'
        point:
          - {figure: sketch, kind: circle, target: '50 m = 55 yd'}
          - {line: 3, kind: highlight, at: '55yd', to: {doodle: sticks, part: long}}
      - say: 'For a rectangle, area is length times width. So width is area divided by length.'
        write: '$\text{width} = \dfrac{\text{area}}{\text{length}}$'
        point:
          - {figure: sketch, kind: circle, target: '?', text: 'width'}
      - say: 'Put in the area, 1815, and the length we just found, 55 yards.'
        write: '$\text{width} = \dfrac{1815}{55}$'
        point:
          - {line: 4, kind: box, text: 'the rule'}
          - {line: 5, kind: move, from: {line: 0, at: '1815'}, at: '1815', text: 'area'}
          - {line: 5, kind: move, from: {line: 3, at: '= 55 yd'}, at: '55', text: 'length'}
      - say: '55 times 30 is 1650, and 55 times 3 is 165. 1650 plus 165 is 1815, so 55 goes into 1815 exactly 33 times.'
        write: '$55 \times 33 = 1650 + 165 = 1815$'
      - say: 'So the width is 33 yards.'
        write: 'So $\text{width} = 33 \text{ yd}$'
      - say: 'Look at the sticks again. But the question wants metres. Each metre is 1.1 yards, so to go from yards to metres we divide by 1.1.'
        doodle_do: [{id: sticks, op: circle, part: extra}]
        write: '$33 \text{ yd} = \dfrac{33}{1.1} \text{ m}$'
        point:
          - {line: 2, kind: box, text: 'convert'}
          - {line: 8, kind: move, from: {line: 7, at: '= 33 yd'}, at: '1.1[[33]]', text: 'yards'}
      - say: 'Multiply the top and the bottom by 10 to clear the decimal. That gives 330 over 11.'
        write: '$= \dfrac{330}{11} \text{ m}$'
      - say: '11 times 30 is 330, so this is 30. So 33 yards is 30 metre sticks.'
        doodle_do: [{id: sticks, op: label, part: metre, text: '33 yd = 30 m'}]
        write: '$= 30 \text{ m}$'
      - say: 'Let''s check. 50 metres by 30 metres is 1500 square metres. A square metre is 1.1 times 1.1, which is 1.21 square yards, and 1500 times 1.21 is 1815. It works.'
        write: 'Check: $50 \times 30 = 1500,\ 1500 \times 1.21 = 1815$'
      - say: 'So the width is 30 metres, which is answer choice D.'
        write: 'Width $= 30$ m'
        answer: true
    traps:
      A: 'You went for 39.93. That comes from dividing 1815 by 50, which gives 36.3, and then multiplying by 1.1, which mixes yards and metres. Change 50 metres to 55 yards first, divide to get 33 yards, then divide by 1.1.'
      B: 'You went for 35.00. That doesn''t come from the correct division. 1815 divided by 55 yards is 33 yards, and 33 divided by 1.1 is 30 metres.'
      C: 'You went for 33.00. That''s the width in yards. The question wants metres, so there''s one more step: 33 divided by 1.1 is 30.'
  4:
    moments:
      - section: 'The question'
        say: 'Round first, then work it out. If you work it out first and round at the end, you can land on a different option. Let''s follow the order the question gives.'
        doodle: {name: 'custom:1987_q04_a', id: figs, caption: 'keep two figures'}
        write: 'Reduce each number to 2 s.f., then evaluate $\dfrac{0.02174 \times 1.2047}{0.023789}$'
      - say: 'The rule for significant figures: start counting at the first digit that is not zero, mark a cut after the figures you keep, and look at the next digit.'
        write: 'Solution'
      - say: 'If the next digit is 5 or more, add 1 to the last digit kept. If it is less than 5, leave it.'
        write: 'Next digit $\ge 5$: add 1. Next digit $< 5$: leave it.'
      - section: 'Round each number'
        say: '0.02174: the zeros in front do not count. The first two significant figures are 2 and 1. Cut after the 1. The next digit is 7, so add 1: 0.022.'
        doodle_do: [{id: figs, op: label, part: cut1, text: 'next is 7: add 1'}]
        write: '$0.021|74 \approx 0.022$'
      - say: '1.2047: the first two significant figures are 1 and 2. The next digit is 0, so leave it: 1.2.'
        doodle_do: [{id: figs, op: label, part: cut2, text: 'next is 0: leave it'}]
        write: '$1.2|047 \approx 1.2$'
      - say: '0.023789: the significant figures are 2 and 3. The next digit is 7, so add 1: 0.024.'
        doodle_do: [{id: figs, op: label, part: cut3, text: 'next is 7: add 1'}]
        write: '$0.023|789 \approx 0.024$'
      - section: 'Evaluate'
        say: 'Put the rounded numbers into the expression.'
        write: '$\dfrac{0.022 \times 1.2}{0.024}$'
      - say: 'Clear the decimals: multiply the numerator and the denominator by 10,000. On top, 0.022 becomes 22 and 1.2 becomes 12. Underneath, 0.024 becomes 240.'
        write: '$= \dfrac{22 \times 12}{240}$'
      - say: 'Cancel first. 12 goes into 240 twenty times. So we have 22 over 20.'
        write: '$= \dfrac{22}{20}$'
      - say: '22 divided by 20 is 1.1.'
        write: '$\therefore$ Value $= 1.1$'
      - section: 'Check'
        say: 'Check by multiplying back: 0.024 times 1.1 is 0.0264, and 0.022 times 1.2 is also 0.0264. They agree.'
        write: 'Check: $0.024 \times 1.1 = 0.0264 = 0.022 \times 1.2 \ \checkmark$'
      - section: 'Answer'
        say: 'So the value is 1.1, which is option C.'
        write: '$\therefore$ Value $= 1.1$'
        answer: true
    traps:
      A: 'You went for 0.8. The numerator, 0.022 times 1.2, is 0.0264, which is bigger than the denominator, 0.024. So the answer must be more than 1: it is 1.1.'
      B: 'You went for 0.9. That is the fraction upside down: 0.024 over 0.0264 is about 0.9. Keep the numerator on top, and you get 1.1.'
      D: 'You went for 1.2. That comes from rounding 0.02174 and 0.023789 to 1 significant figure, 0.02 each, so they cancel and leave 1.2. The question says 2 significant figures: 0.022 and 0.024 give 1.1.'
  5:
    moments:
      - say: 'A train goes from P to Q at 90 kilometres per hour and comes straight back at 45 kilometres per hour. We want the average speed for the whole journey. Picture the train waiting at P.'
        doodle: {name: 'custom:1987_q05_a', id: trip, caption: 'out fast, back slow', size: scene}
        write: 'Out at $90$ km/h, back at $45$ km/h'
      - say: 'Let me draw the journey there and back.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '90 km/h'}
          - {figure: sketch, kind: circle, target: '45 km/h'}
      - say: 'Here''s the rule: average speed is total distance divided by total time. It is not the average of the two speeds, because the train spends longer on the slow leg.'
        write: '$\text{average speed} = \dfrac{\text{total distance}}{\text{total time}}$'
      - say: 'Let the distance from P to Q be $d$ kilometres. There and back, the total distance is $d$ plus $d$, which is $2d$.'
        write: 'Total distance $= d + d = 2d$'
        point:
          - {figure: sketch, kind: circle, target: 'd km'}
      - say: 'Watch the train go out. Time is distance over speed. Going out at 90, the time is $d$ over 90 hours.'
        doodle_do: [{id: trip, op: move, part: train, path: out}]
        write: 'Time out $= \dfrac{d}{90}$'
      - say: 'Now it crawls back. Coming back at 45, the time is $d$ over 45 hours.'
        doodle_do: [{id: trip, op: move, part: train, path: back}]
        write: 'Time back $= \dfrac{d}{45}$'
      - say: 'To add these times, we need the same bottom number. Multiply the top and the bottom of $d$ over 45 by 2, and it becomes $2d$ over 90.'
        write: '$\dfrac{d}{45} = \dfrac{2d}{90}$'
      - say: 'Now add the two times. $d$ over 90 plus $2d$ over 90 is $3d$ over 90.'
        write: 'Total time $= \dfrac{d}{90} + \dfrac{2d}{90} = \dfrac{3d}{90}$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '90d'}, at: '= [[90d]] +', text: 'time out'}
          - {line: 7, kind: move, from: {line: 6, at: '= 902d'}, at: '+ 902d', text: 'time back'}
      - say: '3 over 90 is the same as 1 over 30, because 90 divided by 3 is 30. So the total time is $d$ over 30 hours.'
        write: '$= \dfrac{d}{30}$'
      - say: 'Now put the total distance and the total time into our rule.'
        write: 'Average speed $= 2d \div \dfrac{d}{30}$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {line: 9, kind: move, from: {line: 3, at: '= 2d'}, at: '= 2d', text: 'distance'}
          - {line: 9, kind: move, from: {line: 8, at: '30d'}, at: '30d', text: 'total time'}
      - say: 'Dividing by $d$ over 30 is the same as multiplying by 30 over $d$.'
        write: '$= 2d \times \dfrac{30}{d}$'
        point:
          - {line: 10, kind: arrow, from: {line: 9, at: '÷ 30d'}, at: '× d30', text: 'upside down'}
      - say: 'The $d$ on top cancels the $d$ underneath, leaving 2 times 30, which is 60.'
        write: '$= 2 \times 30 = 60$'
        point:
          - {line: 10, kind: strike, at: '2[[d]]', text: 'cancel'}
          - {line: 10, kind: strike, at: '× [[d]]30'}
      - say: 'Let''s check with a real distance, 90 kilometres. Out takes 1 hour, back takes 2 hours. That is 180 kilometres in 3 hours, and 180 divided by 3 is 60. The slow leg takes twice as long.'
        doodle_do: [{id: trip, op: label, part: fast, text: '90 km in 1 h'}, {id: trip, op: label, part: slow, text: '90 km in 2 h'}]
        write: 'Check: $\dfrac{90 + 90}{1 + 2} = \dfrac{180}{3} = 60$'
      - say: 'So the average speed is 60 kilometres per hour, which is answer choice B.'
        write: 'Average speed $= 60$ km/h'
        answer: true
    traps:
      A: 'You went for 55 km/h. That''s too low. Total distance over total time gives 60 km/h; try it with 90 km each way: 180 km in 3 hours.'
      C: 'You went for 67.5 km/h. That''s 90 plus 45 divided by 2, the plain average of the speeds. The train spends twice as long at the slow speed, so the true average is lower: 60 km/h.'
      D: 'You went for 75 km/h. That''s even higher than the plain average, but the slow return should pull the average down. Total distance over total time gives 60 km/h.'
  6:
    moments:
      - say: 'A square has its length increased by 20 percent and its width decreased by 20 percent, making a rectangle. We want the area of the rectangle compared with the area of the square.'
        write: 'Length $+20\%$, width $-20\%$'
      - say: 'Let me draw the square and the rectangle made from it.'
        show_sketch: true
      - say: 'Let the side of the square be $s$. Its area is $s$ times $s$, which is $s$ squared. Picture the square as 10 rows of 10 tiles: 100 tiles in all.'
        doodle: {name: 'custom:1987_q06_a', id: tiles, caption: 'the square as 100 tiles', size: scene}
        write: 'Square area $= s \times s = s^{2}$'
        point:
          - {figure: sketch, kind: circle, target: 's²'}
      - say: 'Increasing by 20 percent means we keep the 100 percent and add 20 percent, making 120 percent, which is 1.2 times.'
        write: '$100\% + 20\% = 120\% = 1.2$'
      - say: 'So the new length is 1.2 times $s$.'
        write: 'Length $= 1.2s$'
        point:
          - {figure: sketch, kind: circle, target: '1.2s'}
      - say: 'Decreasing by 20 percent leaves 100 minus 20, which is 80 percent, or 0.8 times.'
        write: '$100\% - 20\% = 80\% = 0.8$'
      - say: 'So the new width is 0.8 times $s$. Now build the rectangle from the same tiles: 12 along, 8 down.'
        doodle_do: [{id: tiles, op: stage, stage: 'custom:1987_q06_a2'}]
        write: 'Width $= 0.8s$'
        point:
          - {figure: sketch, kind: circle, target: '0.8s'}
      - say: 'The area of a rectangle is its length times its width.'
        write: 'Area of a rectangle: $A = \text{length} \times \text{width}$'
      - say: 'The rectangle''s area is its length times its width.'
        write: 'Rectangle area $= 1.2s \times 0.8s$'
        point:
          - {line: 8, kind: move, from: {line: 4, at: '= 1.2s'}, at: '1.2s', text: 'length'}
          - {line: 8, kind: move, from: {line: 6, at: '= 0.8s'}, at: '0.8s', text: 'width'}
      - say: '12 times 8 is 96. 1.2 and 0.8 each have one decimal place, so 1.2 times 0.8 is 0.96. And $s$ times $s$ is $s$ squared. Count the rectangle: 96 tiles, against the square''s 100.'
        doodle_do: [{id: tiles, op: label, part: rect, text: '12 × 8 = 96 tiles'}]
        write: '$= 0.96s^{2}$'
        point:
          - {figure: sketch, kind: circle, target: '?', text: '0.96s²'}
      - say: 'Now the ratio of the rectangle to the square. The $s$ squared is on both sides, so it cancels, leaving 0.96 to 1.'
        write: 'Rectangle : square $= 0.96s^{2} : s^{2} = 0.96 : 1$'
      - say: 'Multiply both parts by 100 to clear the decimal. That gives 96 to 100.'
        write: '$= 96 : 100$'
        point:
          - {line: 11, kind: highlight, at: '96', to: {doodle: tiles, part: rect}}
      - say: 'Both divide by 4. 96 divided by 4 is 24, and 100 divided by 4 is 25.'
        write: '$= 24 : 25$'
      - say: 'So the ratio is 24 to 25, which is answer choice D.'
        write: 'Therefore rectangle : square $= 24 : 25$'
        answer: true
    traps:
      A: 'You went for 6 : 5. That''s just 1.2 to 1, the change in the length alone. The width shrinks too, so multiply 1.2 by 0.8 to get 0.96, which is 24 : 25.'
      B: 'You went for 25 : 24. That''s the ratio upside down: square to rectangle. The question asks for the rectangle first, so it''s 24 : 25.'
      C: 'You went for 5 : 6. That is 1 to 1.2, which only looks at the length. Multiply both factors, 1.2 times 0.8, to get 0.96, which is 24 : 25.'
  7:
    moments:
      - section: 'The question'
        say: 'Two brothers put ₦5,000 into a farm and sell the harvest for ₦15,000. The profit is shared 2 to 3. We want the difference between their shares, not either share.'
        doodle: {name: 'custom:1987_q07_a', id: farm, caption: 'put in ₦5,000, harvest sold ₦15,000', size: scene}
        write: 'Invested ₦5,000; sold for ₦15,000; profit shared $2 : 3$'
      - say: 'First the profit, then the sum of ratio, then each share as a fraction of the profit.'
        write: 'Solution'
      - section: 'The profit'
        say: 'Profit is the selling price minus the cost price. Here the cost is the ₦5,000 they invested.'
        write: 'Profit $=$ S.P. $-$ C.P.'
      - say: '15,000 minus 5,000 is 10,000. So the profit in the sack is ₦10,000.'
        doodle_do: [{id: farm, op: label, part: sack, text: 'profit ₦10,000'}]
        write: '$= 15000 - 5000 = $₦$10000$'
      - section: 'Share the profit'
        say: 'Add the parts of the ratio: 2 plus 3 is 5. This is the sum of ratio. Picture the profit as 5 blocks.'
        doodle_do: [{id: farm, op: stage, stage: 'custom:1987_q07_a2'}]
        write: 'Sum of ratio $= 2 + 3 = 5$'
      - say: 'The first brother has 2 parts, so his share is 2 over 5 of 10,000. 10,000 divided by 5 is 2,000, times 2 is 4,000.'
        write: 'First share $= \dfrac{2}{5} \times 10000 = $₦$4000$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '₦10000'}, at: '10000', text: 'profit'}
      - say: 'The second brother has 3 parts: 3 over 5 of 10,000. 2,000 times 3 is 6,000.'
        write: 'Second share $= \dfrac{3}{5} \times 10000 = $₦$6000$'
      - section: 'The difference'
        say: 'Look at the one extra block. The difference is the bigger share minus the smaller: 6,000 minus 4,000, which is 2,000.'
        doodle_do: [{id: farm, op: circle, part: extra}]
        write: '$\therefore$ Difference $= 6000 - 4000 = $₦$2000$'
        point:
          - {line: 7, kind: highlight, at: '₦2000', to: {doodle: farm, part: extra}}
      - section: 'Check'
        say: 'Check. The two shares add up to 4,000 plus 6,000, which is 10,000, the whole profit.'
        write: 'Check: $4000 + 6000 = 10000 \ \checkmark$'
      - section: 'Answer'
        say: 'So the difference in the profit received is ₦2,000, which is option A.'
        write: '$\therefore$ Difference $=$ ₦2,000.00'
        answer: true
    traps:
      B: 'You went for ₦4,000. That is the smaller brother''s share, 2 over 5 of the profit. Take it from the bigger share, ₦6,000, to get the difference: ₦2,000.'
      C: 'You went for ₦6,000. That is the bigger brother''s share. Subtract the smaller share, ₦4,000, to get the difference: ₦2,000.'
      D: 'You went for ₦10,000. That is the whole profit. The question wants the difference between the two shares, which is ₦2,000.'
  8:
    moments:
      - say: 'Peter earns ₦20 a week for 20 weeks, then ₦36 a week for 24 weeks. His average for the whole year is ₦30. We want his average for the last 8 weeks. Picture his year as three wage envelopes.'
        doodle: {name: 'custom:1987_q08_a', id: pay, caption: 'His year: 20 + 24 + 8 weeks'}
        write: '$20$ weeks at ₦20, $24$ weeks at ₦36, year average ₦30'
      - say: 'Averages are tricky to combine, but totals are easy. An average times the number of weeks gives the total pay, so let''s work with totals.'
        write: 'Total $=$ average $\times$ weeks'
      - say: 'A year has 52 weeks. And 20 plus 24 plus 8 is 52, so the three periods fill the year exactly.'
        write: '$20 + 24 + 8 = 52$ weeks'
      - say: 'The total for the whole year is 52 weeks times ₦30.'
        write: 'Year total $= 52 \times 30$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
      - say: '50 times 30 is 1,500, and 2 times 30 is 60. So that''s ₦1,560.'
        write: '$= 1500 + 60 = 1560$'
      - say: 'Fill the first envelope. The first 20 weeks earn 20 times ₦20, which is ₦400.'
        doodle_do: [{id: pay, op: label, part: env1, text: '₦400'}]
        write: 'First 20 weeks $= 20 \times 20 = 400$'
      - say: 'The next 24 weeks earn 24 times ₦36.'
        write: 'Next 24 weeks $= 24 \times 36$'
      - say: '24 times 30 is 720, and 24 times 6 is 144. 720 plus 144 is ₦864. That goes in the second envelope.'
        doodle_do: [{id: pay, op: label, part: env2, text: '₦864'}]
        write: '$= 720 + 144 = 864$'
      - say: 'Together, those first 44 weeks earn 400 plus 864, which is ₦1,264.'
        write: 'First 44 weeks $= 400 + 864 = 1264$'
        point:
          - {line: 8, kind: move, from: {line: 5, at: '= 400'}, at: '400'}
          - {line: 8, kind: move, from: {line: 7, at: '= 864'}, at: '864'}
      - say: 'The last 8 weeks must earn whatever is left of the year''s ₦1,560.'
        write: 'Last 8 weeks $= 1560 - 1264$'
        point:
          - {line: 9, kind: move, from: {line: 4, at: '= 1560'}, at: '1560', text: 'whole year'}
          - {line: 9, kind: move, from: {line: 8, at: '= 1264'}, at: '1264', text: 'first 44'}
      - say: '1,560 minus 1,264 is ₦296. That is what the last envelope holds.'
        doodle_do: [{id: pay, op: label, part: env3, text: '₦296'}]
        write: '$= 296$'
      - say: 'Share the last envelope over its 8 weeks. The average for those 8 weeks is 296 divided by 8. 8 times 37 is 296, so it''s ₦37.'
        doodle_do: [{id: pay, op: circle, part: env3}]
        write: 'Average $= 296 \div 8 = 37$'
        point:
          - {line: 11, kind: move, from: {line: 10, at: '= 296'}, at: '296', text: 'last 8 weeks'}
          - {line: 11, kind: highlight, at: '= 37', to: {doodle: pay, part: env3}}
      - say: 'So his average weekly wage for the last 8 weeks is ₦37, which is answer choice A.'
        write: 'Average for last 8 weeks: ₦37.00'
        answer: true
    traps:
      B: 'You went for ₦35. Check the totals: the year is 52 times 30, which is 1,560; the first two periods make 1,264; that leaves 296, and 296 divided by 8 is 37.'
      C: 'You went for ₦30. That assumes the last weeks just match the yearly average. The early weeks paid only ₦20, so the later ones must pay more to bring the average up: ₦37.'
      D: 'You went for ₦5. That''s far too small to lift the average to ₦30. The last 8 weeks earn ₦296 in total, which is ₦37 a week.'
  9:
    moments:
      - section: 'The question'
        say: 'Money is invested at 4 percent simple interest, and after 3 years it amounts to ₦7,000. What was invested? The ₦7,000 already includes the interest, so we work backwards.'
        doodle: {name: 'custom:1987_q09_a', id: pig, caption: 'after 3 years at 4%: ₦7,000', size: scene}
        write: 'Simple interest at 4% p.a.; amount after 3 years ₦7,000. $P = ?$'
      - say: 'Write the givens first. A is 7,000 naira, R is 4 percent, T is 3 years, and P is what we want.'
        write: 'Solution: $A = $₦$7000,\ R = 4\%,\ T = 3$ years, $P = ?$'
      - section: 'The formulas'
        say: 'The amount is the principal plus the interest.'
        write: '$A = P + I$'
      - say: 'Simple interest is the principal times the rate times the time, over 100.'
        write: '$I = \dfrac{PRT}{100}$'
      - section: 'Substitute'
        say: 'Substitute R equals 4 and T equals 3. P times 4 times 3 is 12P, over 100: three coins of 4 percent. Divide top and bottom by 4: 3P over 25.'
        doodle_do: [{id: pig, op: stage, stage: 'custom:1987_q09_a2'}]
        write: '$I = \dfrac{P \times 4 \times 3}{100} = \dfrac{12P}{100} = \dfrac{3P}{25}$'
      - say: 'Now put I into A equals P plus I, with A equal to 7,000.'
        doodle_do: [{id: pig, op: circle, part: amount}]
        write: '$\therefore P + \dfrac{3P}{25} = 7000$'
        point:
          - {line: 5, kind: highlight, at: '7000', to: {doodle: pig, part: amount}}
      - section: 'Solve for P'
        say: 'The L.C.M. is 25. P is 25P over 25, and 25P plus 3P is 28P.'
        write: '$\dfrac{28P}{25} = 7000$ (L.C.M. $= 25$)'
      - say: 'Multiply both sides by 25 over 28.'
        write: '$P = 7000 \times \dfrac{25}{28}$'
      - say: 'Cancel first: 28 goes into 7,000 two hundred and fifty times. Then 250 times 25 is 6,250. That is the coin that went in.'
        doodle_do: [{id: pig, op: label, part: coin, text: 'P = ₦6,250'}]
        write: '$P = 250 \times 25 = 6250$'
      - section: 'Check'
        say: 'Check with the formula. I is 6,250 times 4 times 3, over 100. That is 75,000 over 100, which is 750 naira.'
        doodle_do: [{id: pig, op: label, part: coins, text: '₦750'}]
        write: 'Check: $I = \dfrac{6250 \times 4 \times 3}{100} = $₦$750$'
      - say: 'And A is 6,250 plus 750, which is 7,000 naira, the amount in the question.'
        write: '$A = 6250 + 750 = $₦$7000 \ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the sum invested was ₦6,250, which is option B.'
        write: '$\therefore P =$ ₦6,250.00'
        answer: true
    traps:
      A: 'You went for ₦7,840. That adds 12 percent of 7,000 to 7,000. But ₦7,000 is already the amount; the interest is on the unknown principal, so solve P plus 3P over 25 equals 7,000.'
      C: 'You went for ₦6,160. That takes 12 percent of 7,000 away from 7,000. The interest is 12 percent of the principal, not of the amount, so solve 28P over 25 equals 7,000.'
      D: 'You went for ₦5,833.33. That is 7,000 divided by 1.2, as if the interest were 20 percent. 4 percent for 3 years is 12 percent, and the equation gives ₦6,250.'
  10:
    moments:
      - section: 'The question'
        say: 'A trader sells 20 oranges for ₦1.35 and gains 8 percent. At ₦1.10, is it a gain or a loss, and how much? First we need what the oranges cost him.'
        doodle: {name: 'custom:1987_q10_a', id: oranges, caption: '20 oranges: ₦1.35, then ₦1.10'}
        write: 'S.P. ₦1.35 gives 8% profit. New S.P. ₦1.10: gain or loss $\%$?'
      - say: 'C.P. is the cost price and S.P. the selling price. Profit or loss percent is always measured against the C.P.'
        write: 'Solution'
      - section: 'Find the C.P.'
        say: 'For a gain, the C.P. is 100 over 100 plus the gain percent, times the S.P.'
        write: 'C.P. $= \dfrac{100}{100 + \text{gain}\%} \times$ S.P.'
      - say: 'Substitute: the gain is 8 percent and the S.P. is 1.35. 100 plus 8 is 108.'
        doodle_do: [{id: oranges, op: highlight, part: tag1}]
        write: 'C.P. $= \dfrac{100}{108} \times 1.35$'
      - say: '100 times 1.35 is 135. So the C.P. is 135 over 108.'
        write: '$= \dfrac{100 \times 1.35}{108} = \dfrac{135}{108}$'
      - say: 'Cancel: 135 is 5 times 27, and 108 is 4 times 27. That leaves 5 over 4, which is 1.25. So the oranges cost him ₦1.25.'
        doodle_do: [{id: oranges, op: label, part: tray, text: 'C.P. ₦1.25'}]
        write: 'C.P. $= \dfrac{5}{4} = $₦$1.25$'
        point:
          - {line: 5, kind: highlight, at: '₦1.25', to: {doodle: oranges, part: tray}}
      - section: 'The new sale'
        say: 'Now the new S.P. is ₦1.10. That is less than the C.P. of ₦1.25, so this time it is a loss.'
        doodle_do: [{id: oranges, op: circle, part: tag2}]
        write: 'S.P. $= $₦$1.10 <$ C.P., so a loss'
      - say: 'Loss is C.P. minus S.P.: 1.25 minus 1.10, which is 0.15.'
        write: 'Loss $=$ C.P. $-$ S.P. $= 1.25 - 1.10 = $₦$0.15$'
      - section: 'Loss percent'
        say: 'Loss percent is the loss over the C.P., times 100 percent.'
        write: 'Loss $\% = \dfrac{\text{loss}}{\text{C.P.}} \times 100\%$'
      - say: 'Substitute: the loss is 0.15 and the C.P. is 1.25.'
        write: '$= \dfrac{0.15}{1.25} \times 100\%$'
        point:
          - {line: 9, kind: move, from: {line: 7, at: '₦0.15'}, at: '0.15', text: 'loss'}
          - {line: 9, kind: move, from: {line: 5, at: '₦1.25'}, at: '1.25', text: 'C.P.'}
      - say: 'Clear the decimals: 15 over 125. Cancel by 5: 3 over 25. Then 100 divided by 25 is 4, and 3 times 4 is 12.'
        write: '$= \dfrac{15}{125} \times 100\% = \dfrac{3}{25} \times 100\% = 12\%$'
      - say: 'Therefore he makes a loss of 12 percent.'
        doodle_do: [{id: oranges, op: label, part: tag2, text: '12% loss'}]
        write: '$\therefore$ Loss $= 12\%$'
      - section: 'Check'
        say: 'Check: 12 percent of ₦1.25 is 0.15, and 1.25 minus 0.15 is 1.10, the new selling price.'
        write: 'Check: $\dfrac{12}{100} \times 1.25 = 0.15$; $1.25 - 0.15 = 1.10 \ \checkmark$'
      - section: 'Answer'
        say: 'So he makes a loss of 12 percent, which is option C.'
        write: '$\therefore$ Loss of $12\%$'
        answer: true
    traps:
      A: 'You went for 8 percent. That is the profit on the first sale. At ₦1.10 he sells below the C.P. of ₦1.25, so it is a loss, and 0.15 over 1.25 is 12 percent.'
      B: 'You went for 10 percent. The loss of ₦0.15 must be measured against the C.P., ₦1.25, not against a selling price. 0.15 over 1.25 times 100 is 12 percent.'
      D: 'You went for 15 percent. That is the 15 kobo loss read as a percentage. Divide it by the C.P., ₦1.25, and multiply by 100: 12 percent.'
  11:
    moments:
      - section: 'The question'
        say: 'Four boys and eight girls cut a field in 5 hours, and a boy works at a quarter of a girl''s rate. How many boys alone cut it in 3 hours?'
        doodle: {name: 'custom:1987_q11_a', id: team, caption: '4 boys + 8 girls cut it in 5 hours'}
        write: '4 boys + 8 girls take 5 hours. Boy''s rate $= \tfrac{1}{4}$ girl''s rate.'
      - say: 'Boys and girls work at different rates, so we first change everyone into boys. Then we use proportion.'
        write: 'Solution'
      - section: 'Change girls to boys'
        say: 'A boy does a quarter of a girl''s work. So one girl does the work of 4 boys.'
        doodle_do: [{id: team, op: label, part: girls, text: 'each = 4 boys'}]
        write: '1 girl $= 4$ boys'
      - say: 'So 8 girls do the work of 8 times 4, which is 32 boys.'
        doodle_do: [{id: team, op: stage, stage: 'custom:1987_q11_a2'}]
        write: '8 girls $= 8 \times 4 = 32$ boys'
      - say: 'Add the 4 real boys: 4 plus 32 is 36. The whole team works like 36 boys.'
        doodle: {name: 'person-small', id: crew, caption: 'the team, counted as boys', repeat: 36, layout: grid}
        write: 'Team $= 4 + 32 = 36$ boys'
      - section: 'Inverse proportion'
        say: 'More boys finish in less time, so the number of boys and the time are in inverse proportion. Their product stays the same: boys times hours is the same work.'
        write: 'Boys $\times$ hours $=$ constant'
      - say: '36 boys take 5 hours, so the field needs 36 times 5, which is 180 boy-hours of work.'
        doodle_do: [{id: crew, op: group, n: 36, text: '5 hours each: 180 boy-hours'}]
        write: '$36 \times 5 = 180$ boy-hours'
      - say: 'Let the number of boys needed for 3 hours be n. Then n times 3 must also be 180.'
        write: 'Let the number of boys be $n$: $\ n \times 3 = 180$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '= 180'}, at: '180', text: 'same work'}
      - say: 'Divide both sides by 3. 180 divided by 3 is 60.'
        doodle_do: [{id: crew, op: label, text: '60 boys for 3 hours'}]
        write: '$\therefore n = \dfrac{180}{3} = 60$'
      - section: 'Check'
        say: 'Check: 60 boys for 3 hours is 60 times 3, which is 180 boy-hours, the same work as the team''s. And less time needs more boys, as expected.'
        write: 'Check: $60 \times 3 = 180 = 36 \times 5 \ \checkmark$'
      - section: 'Answer'
        say: 'So 60 boys are needed, which is option B.'
        write: '$\therefore$ Number of boys $= 60$'
        answer: true
    traps:
      A: 'You went for 180. That is the total work in boy-hours. It is shared over the 3 hours: 180 divided by 3 is 60 boys.'
      C: 'You went for 25. That is too few. A girl is worth 4 boys, so the team is worth 36 boys, the work is 180 boy-hours, and 180 over 3 hours is 60 boys.'
      D: 'You went for 20. That treats a girl as worth just one boy: 12 workers times 5 hours is 60, divided by 3 is 20. But each girl does the work of 4 boys, so the answer is 60.'
  12:
    moments:
      - say: 'We want 125 to the power 4 over 3, divided by 16 to the power 3 over 4, without tables.'
        write: '$\dfrac{125^{\frac{4}{3}}}{16^{\frac{3}{4}}}$'
      - say: 'A fractional power has two parts. The bottom number is a root, and the top number is a power. We take the root first, so the numbers stay small. Picture 125 as a cube of little cubes, and 16 as four equal tiles multiplied together.'
        doodle: {name: 'custom:1987_q12_a', id: blocks, caption: '125 as a cube, 16 as four tiles', size: scene}
        write: '$a^{\frac{m}{n}} = \left(\sqrt[n]{a}\right)^{m}$'
      - say: 'Start with the top. 125 to the power 4 over 3 is the cube root of 125, raised to the power 4.'
        write: 'Top: $125^{\frac{4}{3}} = \left(\sqrt[3]{125}\right)^{4}$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
      - say: '5 times 5 is 25, and 25 times 5 is 125. So the cube root of 125 is 5. Each edge of the cube is 5.'
        doodle_do: [{id: blocks, op: stage, stage: 'custom:1987_q12_a2'}]
        write: '$\sqrt[3]{125} = 5$ since $5 \times 5 \times 5 = 125$'
      - say: 'Put that 5 back in: the top is 5 to the power 4.'
        write: 'So $125^{\frac{4}{3}} = 5^{4}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= [[5]] since'}, at: '= [[5]]4', text: 'cube root'}
      - say: '5 to the 4 is 5 times 5, which is 25, times another 5 times 5, which is 25 again. And 25 times 25 is 625. Write that under the cube.'
        doodle_do: [{id: blocks, op: stage, stage: 'custom:1987_q12_a3'}]
        write: '$= 25 \times 25 = 625$'
        point:
          - {line: 5, kind: highlight, at: '625', to: {doodle: blocks, part: p625}}
      - say: 'Now the bottom. 16 to the power 3 over 4 is the fourth root of 16, cubed.'
        write: 'Bottom: $16^{\frac{3}{4}} = \left(\sqrt[4]{16}\right)^{3}$'
      - say: '2 times 2 times 2 times 2 is 16, so the fourth root of 16 is 2. Each of the four tiles is a 2.'
        doodle_do: [{id: blocks, op: stage, stage: 'custom:1987_q12_a4'}]
        write: '$\sqrt[4]{16} = 2$ since $2^{4} = 16$'
      - say: 'Take three of those tiles. So the bottom is 2 cubed, and 2 times 2 times 2 is 8.'
        doodle_do: [{id: blocks, op: stage, stage: 'custom:1987_q12_a5'}]
        write: 'So $16^{\frac{3}{4}} = 2^{3} = 8$'
        point:
          - {line: 8, kind: highlight, at: '23 = 8', to: {doodle: blocks, part: p8}}
      - say: 'Now put the top we found, 625, over the bottom, 8.'
        write: '$\dfrac{125^{\frac{4}{3}}}{16^{\frac{3}{4}}} = \dfrac{625}{8}$'
        point:
          - {line: 9, kind: move, from: {line: 5, at: '= 625'}, at: '625', text: 'top'}
          - {line: 9, kind: move, from: {line: 8, at: '= 8'}, at: '= [[8]]625', text: 'bottom'}
      - say: 'So the value is 625 over 8, which is answer choice A.'
        write: 'Therefore the value $= \dfrac{625}{8}$'
        answer: true
    traps:
      B: 'You went for 8 over 625. That''s the fraction upside down. The 125 part is on top, and it gives 625, so it''s 625 over 8.'
      C: 'You went for 1 over 8. The bottom, 16 to the power 3 over 4, is 8, but the top isn''t 1. The cube root of 125 is 5, and 5 to the 4 is 625.'
      D: 'You went for 8. That''s only the bottom of the fraction. The top works out to 625, so the answer is 625 over 8.'
  13:
    moments:
      - say: 'A student should have written 35 over 6 to 3 significant figures, but wrote it to 3 decimal places. We want his error, in standard form.'
        write: '$\dfrac{35}{6}$: 3 s.f. versus 3 d.p.'
      - say: 'First we turn 35 over 6 into a decimal by long division. 6 goes into 35 five times, since 6 times 5 is 30, with 5 left over.'
        write: '$35 \div 6 = 5$ remainder $5$'
      - say: 'Bring down a zero: 50 divided by 6 is 8, since 6 times 8 is 48, with 2 left over.'
        write: '$50 \div 6 = 8$ remainder $2$'
      - say: 'Bring down another zero: 20 divided by 6 is 3, since 6 times 3 is 18, with 2 left over again. So the 3 will repeat for ever.'
        write: '$20 \div 6 = 3$ remainder $2$'
      - say: 'So 35 over 6 is 5.8333, with the 3 repeating. Picture the digits, with the 3s going on for ever.'
        doodle: {name: 'custom:1987_q13_a', id: digits, caption: 'two ways to cut 5.8333...'}
        write: 'So $\dfrac{35}{6} = 5.8333\ldots$'
      - say: 'To 3 significant figures we keep 5, 8 and 3. The next digit is 3, which is less than 5, so we don''t round up.'
        write: '3 s.f.: $5.83$'
      - say: 'Compare the two braces. To 3 decimal places we keep three digits after the point: 8, 3 and 3. The next digit is 3 again, so no rounding up.'
        doodle_do: [{id: digits, op: highlight, part: dp}]
        write: '3 d.p.: $5.833$'
      - say: 'His error is the difference between what he wrote, 5.833, and what he should have written, 5.83.'
        write: 'Error $= 5.833 - 5.83$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '5.833'}, at: '5.833', text: 'wrote'}
          - {line: 7, kind: move, from: {line: 5, at: '5.83'}, at: '− 5.83', text: 'should be'}
      - say: 'Write 5.83 as 5.830 so the places line up. 5.833 minus 5.830 is 0.003. The error is that one extra 3.'
        doodle_do: [{id: digits, op: circle, part: gap}]
        write: '$= 5.833 - 5.830 = 0.003$'
      - say: 'Standard form means a number from 1 up to, but not including, 10, times a power of 10.'
        write: 'Standard form: $A \times 10^{n},\ 1 \le A < 10$'
      - say: 'Watch the point hop. To turn 0.003 into 3, the decimal point moves 3 places to the right. To balance that, we multiply by 10 to the power minus 3.'
        doodle_do: [{id: digits, op: stage, stage: 'custom:1987_q13_a2'}]
        write: '$0.003 = 3.0 \times 10^{-3}$'
        point:
          - {line: 10, kind: highlight, at: '10−3', to: {doodle: digits, part: hops}}
      - say: 'So the error in standard form is 3.0 times 10 to the minus 3, which is answer choice B.'
        write: 'Error $= 3.0 \times 10^{-3}$'
        answer: true
    traps:
      A: 'You went for 0.003. That''s the right size of error, but it isn''t in standard form. In standard form it''s 3.0 times 10 to the minus 3.'
      C: 'You went for 0.3 times 10 squared. That''s 30, which is far too big, and 0.3 is below 1, so it isn''t standard form either. The error is 3.0 times 10 to the minus 3.'
      D: 'You went for 0.3 times 10 to the minus 3. That''s 0.0003, ten times too small, and 0.3 is less than 1, so it isn''t standard form. The answer is 3.0 times 10 to the minus 3.'
  14:
    moments:
      - say: 'We want to simplify a fraction of logs to base 2. We''ll deal with the top and the bottom separately.'
        write: '$\dfrac{\log_{2}6 - \log_{2}3}{\log_{2}8 - 2\log_{2}\tfrac{1}{2}}$'
      - say: 'The law of logs: the log of one number minus the log of another is the log of the first divided by the second.'
        write: '$\log_{a} x - \log_{a} y = \log_{a}\dfrac{x}{y}$'
      - say: 'The top first. When you subtract logs with the same base, you divide the numbers inside.'
        write: 'Top: $\log_{2}6 - \log_{2}3 = \log_{2}\dfrac{6}{3}$'
      - say: '6 divided by 3 is 2.'
        write: '$= \log_{2}2$'
      - say: 'Picture a staircase where each step up doubles, with the steps numbered along the bottom. Log base 2 of 2 asks: 2 to what power gives 2? The answer is 1, because 2 to the power 1 is 2.'
        doodle: {name: 'custom:1987_q14_a', id: steps, caption: 'each step up is ×2'}
        doodle_do: [{id: steps, op: circle, part: s2}]
        write: '$= 1$ since $2^{1} = 2$'
        point:
          - {line: 4, kind: highlight, at: '21 = 2', to: {doodle: steps, part: s2}}
      - say: 'Now the bottom. Log base 2 of 8 asks: 2 to what power gives 8? 2 cubed is 8, so it is 3. Three steps up the stairs.'
        doodle_do: [{id: steps, op: circle, part: s8}]
        write: 'Bottom: $\log_{2}8 = 3$ since $2^{3} = 8$'
        point:
          - {line: 5, kind: highlight, at: '23 = 8', to: {doodle: steps, part: s8}}
      - say: 'Watch this part carefully. Log base 2 of a half asks: 2 to what power gives a half? 2 to the power minus 1 is 1 over 2, so it is minus 1. On the stairs, that is one step down from 1.'
        doodle_do: [{id: steps, op: circle, part: sh}]
        write: '$\log_{2}\tfrac{1}{2} = -1$ since $2^{-1} = \tfrac{1}{2}$'
        point:
          - {line: 6, kind: highlight, at: '2−1', to: {doodle: steps, part: sh}}
      - say: 'So 2 times log base 2 of a half is 2 times minus 1, which is minus 2.'
        write: '$2\log_{2}\tfrac{1}{2} = 2 \times (-1) = -2$'
      - say: 'Now put those two results into the bottom: 3, minus minus 2.'
        write: 'Bottom $= 3 - (-2)$'
        point:
          - {line: 8, kind: move, from: {line: 5, at: '= 3'}, at: '= 3', text: 'log 8'}
          - {line: 8, kind: move, from: {line: 7, at: '= −2'}, at: '(−2)', text: 'this part'}
      - say: 'Subtracting a negative is adding, so that is 3 plus 2, which is 5.'
        write: '$= 3 + 2 = 5$'
      - say: 'Now put the top we found, 1, over the bottom, 5.'
        write: 'Expression $= \dfrac{1}{5}$'
        point:
          - {line: 10, kind: move, from: {line: 4, at: '= 1'}, at: '5[[1]]', text: 'top'}
          - {line: 10, kind: move, from: {line: 9, at: '= 5'}, at: '= [[5]]1', text: 'bottom'}
      - say: 'So the expression simplifies to 1 over 5, which is answer choice A.'
        write: 'Therefore the value $= \tfrac{1}{5}$'
        answer: true
    traps:
      B: 'You went for a half. The top is 1, but the bottom is 5, not 2. Log base 2 of a half is minus 1, so the bottom is 3 minus minus 2, which is 5.'
      C: 'You went for minus a half. The bottom has 3 minus minus 2, which is plus 5. Subtracting a negative makes it bigger, so the answer is 1 over 5.'
      D: 'You went for log 3 over log 7. The logs simplify to plain numbers: the top is log base 2 of 2, which is 1, and the bottom is 5.'
  15:
    moments:
      - say: 'We want to simplify 2 root 14 times 3 root 21, over 7 root 24 times 2 root 98.'
        write: '$\dfrac{2\sqrt{14} \times 3\sqrt{21}}{7\sqrt{24} \times 2\sqrt{98}}$'
      - say: 'The law of surds: the square root of one number times the square root of another is the square root of their product.'
        write: '$\sqrt{a} \times \sqrt{b} = \sqrt{ab}$'
      - say: 'The plan: multiply the whole numbers together and the surds together, then simplify. Let''s start with the top.'
        write: 'Top: $2\sqrt{14} \times 3\sqrt{21} = (2 \times 3)\sqrt{14 \times 21}$'
      - say: '2 times 3 is 6. And 14 times 21 is 14 times 20, which is 280, plus 14, giving 294.'
        write: '$= 6\sqrt{294}$'
      - say: '294 is 49 times 6, and 49 is 7 squared. So root 294 is 7 root 6. Picture the 49 as a square of tiles, 7 on a side, times 6.'
        doodle: {name: 'custom:1987_q15_a', id: tiles, caption: 'pull out the square', size: scene}
        write: '$\sqrt{294} = \sqrt{49 \times 6} = 7\sqrt{6}$'
        point:
          - {line: 4, kind: highlight, at: '49 × 6', to: {doodle: tiles, part: sq49}}
      - say: 'The side of the square, 7, comes out. So the top is 6 times 7 root 6. 6 times 7 is 42.'
        doodle_do: [{id: tiles, op: circle, part: side7}]
        write: 'Top $= 6 \times 7\sqrt{6} = 42\sqrt{6}$'
      - say: 'Now the bottom, in the same way.'
        write: 'Bottom: $7\sqrt{24} \times 2\sqrt{98} = (7 \times 2)\sqrt{24 \times 98}$'
      - say: '7 times 2 is 14. And 24 times 98 is 24 times 100, which is 2400, minus 24 times 2, which is 48. That gives 2352.'
        write: '$= 14\sqrt{2352}$'
      - say: '2352 is 784 times 3, and 784 is 28 squared. So root 2352 is 28 root 3. Picture that as a bigger square, 28 on a side, times 3.'
        doodle_do: [{id: tiles, op: stage, stage: 'custom:1987_q15_a2'}]
        write: '$\sqrt{2352} = \sqrt{784 \times 3} = 28\sqrt{3}$'
        point:
          - {line: 8, kind: highlight, at: '784 × 3', to: {doodle: tiles, part: sq784}}
      - say: 'Its side, 28, comes out. So the bottom is 14 times 28 root 3. 14 times 28 is 392.'
        doodle_do: [{id: tiles, op: circle, part: side28}]
        write: 'Bottom $= 14 \times 28\sqrt{3} = 392\sqrt{3}$'
      - say: 'Now put the top over the bottom.'
        write: 'Expression $= \dfrac{42\sqrt{6}}{392\sqrt{3}}$'
        point:
          - {line: 10, kind: move, from: {line: 5, at: '= 426'}, at: '426', text: 'top'}
          - {line: 10, kind: move, from: {line: 9, at: '= 3923'}, at: '3923', text: 'bottom'}
      - say: 'The law of surds: one square root over another is the square root of the division.'
        write: '$\dfrac{\sqrt{a}}{\sqrt{b}} = \sqrt{\dfrac{a}{b}}$'
      - say: 'Root 6 over root 3 is root 2, because 6 divided by 3 is 2.'
        write: '$\dfrac{\sqrt{6}}{\sqrt{3}} = \sqrt{\dfrac{6}{3}} = \sqrt{2}$'
      - say: 'And 42 over 392: both divide by 14. 42 divided by 14 is 3, and 392 divided by 14 is 28.'
        write: '$\dfrac{42}{392} = \dfrac{42 \div 14}{392 \div 14} = \dfrac{3}{28}$'
      - say: 'Putting those two pieces together, the whole thing is 3 root 2 over 28, which is answer choice D.'
        write: 'Therefore the value $= \dfrac{3\sqrt{2}}{28}$'
        answer: true
    traps:
      A: 'You went for 3 root 14 over 4. The number part is 42 over 392, which is 3 over 28, not 3 over 4. And the surds simplify to root 2.'
      B: 'You went for 3 root 21 over 4. The surds do not leave root 21; root 6 over root 3 is root 2. And the number part is 3 over 28.'
      C: 'You went for 3 root 14 over 28. The number part is right, but the surds cancel further. The top gives root 6 and the bottom root 3, and root 6 over root 3 is root 2.'
  16:
    moments:
      - section: 'The question'
        say: 'A formula with a square root inside it. It looks heavy, but once we put in what we know, it shrinks fast and only $n$ is left.'
        write: '$p = \dfrac{2}{3} \cdot \dfrac{1 - r^{2}}{n^{2}}$'
      - section: 'Solution'
        say: 'We are given $p$ and $r$, and we want $n$. First we list the givens, then work out the pieces, then substitute and solve.'
        write: 'Solution'
      - say: '$p$ is 1, $r$ is the square root of 1 over 3, and $n$ is what we want.'
        write: '$p = 1,\ r = \sqrt{\tfrac{1}{3}},\ n = ?$'
      - say: 'First, $r$ squared. Squaring a square root undoes it, so $r$ squared is 1 over 3. Picture 1 as a bar of three thirds; $r$ squared is one of them.'
        doodle: {name: 'custom:1987_q16_a', id: bar, caption: '1 as three thirds'}
        write: '$r^{2} = \left(\sqrt{\tfrac{1}{3}}\right)^{2} = \tfrac{1}{3}$'
      - say: 'Take that third off the bar. 1 minus 1 over 3 leaves 2 over 3.'
        doodle_do: [{id: bar, op: cross, part: r2}, {id: bar, op: label, part: left, text: '⅔ left'}]
        write: '$1 - r^{2} = 1 - \tfrac{1}{3} = \tfrac{2}{3}$'
      - section: 'Substitute'
        say: 'Now substitute: $p$ is 1, and 1 minus $r$ squared is 2 over 3.'
        write: '$1 = \dfrac{2}{3} \times \dfrac{\tfrac{2}{3}}{n^{2}}$'
      - say: '2 over 3 times 2 over 3: 2 times 2 is 4 on top, 3 times 3 is 9 below. So the right-hand side is 4 over 9 $n$ squared.'
        write: '$1 = \dfrac{4}{9n^{2}}$'
      - say: 'Cross multiply: 1 times 9 $n$ squared equals 4 times 1.'
        write: '$9n^{2} = 4$'
      - say: 'Divide both sides by 9 to leave $n$ squared alone. Picture a square of 9 tiles with 4 of them shaded.'
        doodle: {name: 'custom:1987_q16_b', id: square, caption: 'n² as 4 of 9 tiles'}
        write: '$n^{2} = \dfrac{4}{9}$'
        point:
          - {line: 8, kind: highlight, at: 'n2', to: {doodle: square, part: shade}}
      - say: 'Take the square root of both sides. The square root of 4 is 2 and the square root of 9 is 3. On the picture, the shaded square is 2 tiles of 3 along each side.'
        doodle_do: [{id: square, op: label, part: side, text: '⅔'}]
        write: '$n = \sqrt{\dfrac{4}{9}} = \dfrac{2}{3}$'
      - say: 'Therefore $n$ is 2 over 3. We take the positive root, since every option is positive.'
        write: '$\therefore n = \dfrac{2}{3}$'
      - section: 'Check'
        say: 'Check by putting $n$ equals 2 over 3 back. $n$ squared is 4 over 9, so the formula gives 2 over 3, times 2 over 3, divided by 4 over 9.'
        write: '$p = \dfrac{2}{3} \times \dfrac{2}{3} \div \dfrac{4}{9}$'
      - say: '2 over 3 times 2 over 3 is 4 over 9. Dividing by 4 over 9 is multiplying by 9 over 4, which gives 1. That is the $p$ we were given.'
        write: '$= \dfrac{4}{9} \times \dfrac{9}{4} = 1\ \checkmark$'
      - say: 'So $n$ is 2 over 3: option D.'
        write: '$\therefore n = \tfrac{2}{3}$ (D)'
        answer: true
    traps:
      A: 'You went for 3 over 2. That is the reciprocal of the answer, from getting $n$ squared as 9 over 4. Cross multiplying gives 9 $n$ squared equals 4, so $n$ squared is 4 over 9 and $n$ is 2 over 3.'
      B: 'You went for 3. That would make $n$ squared 9, and then the right-hand side is 4 over 81, far less than 1. $n$ squared is 4 over 9, so $n$ is 2 over 3.'
      C: 'You went for 1 over 3. That squares to 1 over 9, not 4 over 9. The square root of 4 over 9 is 2 over 3.'
  17:
    moments:
      - say: 'We have $a$ equals $u$ squared minus 3 $v$ squared, and $b$ equals 2 $u v$ plus $v$ squared. We want 2 $a$ minus $b$, times $a$ minus $b$ squared, when $u$ is 1 and $v$ is minus 1. Picture two machines, one making a and one making b, both fed the same two values.'
        doodle: {name: 'custom:1987_q17_a', id: mach, caption: 'feed u = 1, v = −1 in'}
        write: '$a = u^{2} - 3v^{2},\ b = 2uv + v^{2},\ u = 1,\ v = -1$'
      - say: 'Look at the minus sign on the card. The plan: work out $a$ and $b$ first, then the two brackets. Be careful with the negative: minus 1 squared is plus 1, because a negative times a negative is positive.'
        doodle_do: [{id: mach, op: underline, part: vals}]
        write: '$(-1)^{2} = (-1)(-1) = 1$'
      - say: 'For $a$, put $u$ equals 1 and $v$ equals minus 1 into $u$ squared minus 3 $v$ squared.'
        write: '$a = 1^{2} - 3(-1)^{2}$'
        point:
          - {line: 2, kind: move, from: {line: 0, at: 'u = 1'}, at: '12', text: 'u = 1'}
          - {line: 2, kind: move, from: {line: 0, at: 'v = −1'}, at: '(−1)2', text: 'v = −1'}
      - say: '1 squared is 1. Minus 1 squared is 1, so 3 times it is 3.'
        write: '$= 1 - 3 \times 1 = 1 - 3$'
      - say: 'Out of the first machine: 1 minus 3 is minus 2.'
        doodle_do: [{id: mach, op: label, part: outa, text: '−2'}]
        write: '$a = -2$'
        point:
          - {line: 4, kind: highlight, at: 'a = -2', to: {doodle: mach, part: outa}}
      - say: 'For $b$, put the same values into 2 $u v$ plus $v$ squared.'
        write: '$b = 2(1)(-1) + (-1)^{2}$'
      - say: 'Out of the second machine: 2 times 1 times minus 1 is minus 2, and minus 1 squared is plus 1. Minus 2 plus 1 is minus 1.'
        doodle_do: [{id: mach, op: label, part: outb, text: '−1'}]
        write: '$= -2 + 1 = -1$'
        point:
          - {line: 6, kind: highlight, at: '= -1', to: {doodle: mach, part: outb}}
      - say: 'Now the first bracket, 2 $a$ minus $b$, using the $a$ equals minus 2 and $b$ equals minus 1 we just found.'
        write: '$2a - b = 2(-2) - (-1)$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: 'a = −2'}, at: '(−2)', text: 'a'}
          - {line: 7, kind: move, from: {line: 6, at: '= −1'}, at: '(−1)', text: 'b'}
      - say: '2 times minus 2 is minus 4, and taking away minus 1 is the same as adding 1. Minus 4 plus 1 is minus 3.'
        write: '$= -4 + 1 = -3$'
      - say: 'The second bracket, $a$ minus $b$ squared. $b$ squared is minus 1 squared, which is 1.'
        write: '$a - b^{2} = -2 - (-1)^{2} = -2 - 1$'
      - say: 'Minus 2 minus 1 is minus 3.'
        write: '$= -3$'
      - say: 'Now multiply the two brackets. Minus 3 times minus 3 is plus 9.'
        write: '$(2a - b)(a - b^{2}) = (-3)(-3) = 9$'
        point:
          - {line: 11, kind: move, from: {line: 8, at: '= −3'}, at: '= [[(−3)]](−3)', text: 'first'}
          - {line: 11, kind: move, from: {line: 10, at: '= −3'}, at: '(−3)[[(−3)]]', text: 'second'}
      - say: 'So the value is 9, which is answer choice A.'
        write: 'Value $= 9$'
        answer: true
    traps:
      B: 'You went for 15. Check the signs. $a$ is minus 2 and $b$ is minus 1, so the brackets are minus 3 and minus 3, and minus 3 times minus 3 is 9.'
      C: 'You went for 27. Look again at the second bracket: $b$ squared is 1, so $a$ minus $b$ squared is minus 2 minus 1, which is minus 3. Then minus 3 times minus 3 is 9.'
      D: 'You went for 33. That comes from a sign slip, like squaring minus 1 as minus 1. Minus 1 squared is plus 1, which gives $a$ as minus 2, $b$ as minus 1, and the answer 9.'
  18:
    moments:
      - say: 'The cost in naira of feeding $n$ people for a week is $Q$ equals 15 plus 0.5 $n$. We want the extra cost, in kobo, of feeding one more person. Picture the cooking pot and a plate for each person.'
        doodle: {name: 'custom:1987_q18_a', id: food, caption: 'Feeding one more person for a week'}
        write: '$Q = 15 + 0.5n$'
      - say: 'The pot is the fixed cost; the plates are the part that grows. Look at the two parts. The 15 is fixed: it stays the same however many people are fed. The 0.5 $n$ grows with each person.'
        doodle_do: [{id: food, op: label, part: pot, text: '₦15 however many'}, {id: food, op: label, part: plates, text: '0.5 each'}]
        write: 'Fixed part $= 15$, changing part $= 0.5n$'
      - say: 'To see the extra cost of one more person, we compare the cost for $n$ plus 1 people with the cost for $n$ people.'
        write: 'Extra cost $= Q(n + 1) - Q(n)$'
      - say: 'For $n$ plus 1 people, put $n$ plus 1 in place of $n$ in the formula: 15 plus 0.5 times, $n$ plus 1.'
        write: '$Q(n + 1) = 15 + 0.5(n + 1)$'
      - say: 'Open the bracket. 0.5 times $n$ is 0.5 $n$, and 0.5 times 1 is 0.5.'
        write: '$= 15 + 0.5n + 0.5$'
      - say: 'Now subtract the cost for $n$ people, 15 plus 0.5 $n$.'
        write: 'Extra cost $= (15 + 0.5n + 0.5) - (15 + 0.5n)$'
      - say: 'All that changes is the extra plate. The 15s cancel, and the 0.5 $n$ terms cancel, leaving just 0.5.'
        doodle_do: [{id: food, op: circle, part: extra}]
        write: '$= 0.5$'
        point:
          - {line: 5, kind: strike, at: '([[15 + 0.5n]] + 0.5)', text: 'cancels'}
          - {line: 5, kind: strike, at: '(15 + 0.5n)'}
      - say: 'The cost is in naira, so the extra is ₦0.50. There are 100 kobo in a naira, so we multiply by 100.'
        write: '₦0.50 $= 0.50 \times 100$ kobo'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '= 0.5'}, at: '₦0.50', text: 'naira'}
      - say: '0.5 times 100 is 50. That is the cost of the extra plate.'
        doodle_do: [{id: food, op: label, part: extra, text: '50 kobo'}]
        write: '$= 50$ kobo'
        point:
          - {line: 8, kind: highlight, at: '50', to: {doodle: food, part: extra}}
      - say: 'Check with numbers: 10 people cost 15 plus 5, which is 20. 11 people cost 15 plus 5.5, which is 20.5. The difference is 0.5 naira.'
        write: 'Check: $Q(11) - Q(10) = 20.5 - 20 = 0.5$'
      - say: 'So the extra cost is 50 kobo, which is answer choice D.'
        write: 'Extra cost $= 50\text{k}$'
        answer: true
    traps:
      A: 'You went for 350k. That doesn''t come from the formula. The only part that changes with one more person is the 0.5 naira, which is 50 kobo.'
      B: 'You went for 200k. The fixed ₦15 doesn''t change when one more person is added. Only the 0.5 naira per person does, which is 50 kobo.'
      C: 'You went for 150k. That mixes in the fixed 15. The extra cost is just the number in front of $n$: 0.5 naira, which is 50 kobo.'
  19:
    moments:
      - section: 'The question'
        say: '$P$ varies inversely as $V$, and $V$ varies directly as $R$ squared. We want one equation linking $P$ straight to $R$. Picture a chain from $R$ through $V$ to $P$.'
        doodle: {name: 'custom:1987_q19_a', id: chain, caption: 'R to V to P'}
        write: 'Given: $R = 7$ when $P = 2$'
      - say: 'Solution. Write each statement with the sign of proportionality, then bring in a constant for each.'
        write: 'Solution'
      - section: 'The two variations'
        say: '$P$ varies inversely as $V$: $P$ is proportional to 1 over $V$. So $P$ equals $k$ one over $V$. Number it equation one.'
        doodle_do: [{id: chain, op: highlight, part: flip}]
        write: '$P \propto \dfrac{1}{V}$ $\ \therefore\ P = \dfrac{k_{1}}{V} \quad \ldots (1)$'
      - say: '$V$ varies directly as $R$ squared: $V$ equals $k$ two times $R$ squared. That is equation two.'
        doodle_do: [{id: chain, op: highlight, part: sq}]
        write: '$V \propto R^{2}$ $\ \therefore\ V = k_{2}R^{2} \quad \ldots (2)$'
      - section: 'Remove V'
        say: 'Substitute equation two into equation one, to remove $V$. On the chain, we jump straight from $R$ to $P$.'
        doodle_do: [{id: chain, op: cross, part: vb}, {id: chain, op: stage, stage: 'custom:1987_q19_a2'}]
        write: 'Sub. (2) in (1): $\ P = \dfrac{k_{1}}{k_{2}R^{2}}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= [[k2R2]]'}, at: 'k2R2', text: 'V from (2)'}
      - say: '$k$ one over $k$ two is a single constant. Let it be $k$.'
        write: 'Let $k = \dfrac{k_{1}}{k_{2}}$: $\ P = \dfrac{k}{R^{2}}$'
      - section: 'Find k'
        say: 'Now use the given pair: $R$ is 7 when $P$ is 2.'
        write: 'When $R = 7,\ P = 2$: $\ 2 = \dfrac{k}{7^{2}} = \dfrac{k}{49}$'
      - say: 'Multiply both sides by 49. 2 times 49 is 98.'
        write: '$\therefore\ k = 2 \times 49 = 98$'
      - section: 'The equation'
        say: 'So the equation connecting $P$ and $R$ is $P$ equals 98 over $R$ squared.'
        write: '$\therefore\ P = \dfrac{98}{R^{2}}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= 98'}, at: '98', text: 'k'}
      - say: 'Multiply both sides by $R$ squared to clear the fraction.'
        write: '$PR^{2} = 98$'
        point:
          - {line: 9, kind: highlight, at: 'PR2 = 98', to: {doodle: chain, part: rp}}
      - section: 'Check'
        say: 'Check with the given pair: 2 times 7 squared is 2 times 49, which is 98.'
        write: 'Check: $\ 2 \times 7^{2} = 2 \times 49 = 98\ \checkmark$'
      - say: 'So the relationship is $P R$ squared equals 98: option B.'
        write: '$\therefore\ PR^{2} = 98$'
        answer: true
    traps:
      A: 'You went for $P$ equals 98 $R$ squared. That makes $P$ grow as $R$ grows, but an inverse link followed by a direct link makes $P$ shrink as $R$ grows. It''s 98 over $R$ squared.'
      C: 'You went for $P$ equals 1 over 98 $R$. The 98 belongs on top, and $R$ must be squared. $P$ is 98 over $R$ squared.'
      D: 'You went for $P$ equals $R$ squared over 98. That''s a direct link, with $P$ growing as $R$ grows. Also, with $R$ as 7 it gives a half, not 2. The answer is $P R$ squared equals 98.'
  20:
    moments:
      - section: 'The question'
        say: 'Make $y$ the subject. Here $y$ is wrapped like a parcel: it was cubed, put under 1, then added to $x$ squared. We unwrap it from the outside in.'
        write: '$Z = x^{2} + \dfrac{1}{y^{3}}$'
        doodle: {name: 'custom:1987_q20_a', id: layers, caption: 'y is wrapped in layers'}
      - section: 'Solution'
        say: 'To change the subject, we undo the operations on $y$ in reverse order, one per line, doing the same thing to both sides.'
        write: 'Solution'
      - say: 'The outside layer is plus $x$ squared. Subtract $x$ squared from both sides.'
        doodle_do: [{id: layers, op: cross, part: outer}]
        write: '$Z - x^{2} = \dfrac{1}{y^{3}}$'
        point:
          - {line: 2, kind: move, from: {line: 0, at: '[[x2]] +'}, at: '− x2', text: 'across the ='}
      - say: 'Now $y$ cubed is under 1. Cross multiply: $y$ cubed times $Z$ minus $x$ squared equals 1.'
        doodle_do: [{id: layers, op: cross, part: mid}]
        write: '$y^{3}(Z - x^{2}) = 1$'
      - say: 'Divide both sides by the bracket, $Z$ minus $x$ squared, so $y$ cubed is alone.'
        write: '$y^{3} = \dfrac{1}{Z - x^{2}}$'
      - say: 'The last layer is the cube. Take the cube root of both sides.'
        doodle_do: [{id: layers, op: cross, part: cube}]
        write: '$y = \sqrt[3]{\dfrac{1}{Z - x^{2}}}$'
      - say: 'The cube root of 1 is 1. Notice that we take the cube root of the whole bracket, $Z$ minus $x$ squared, together. Now $y$ is out of its wrapping.'
        doodle_do: [{id: layers, op: circle, part: core}]
        write: '$y = \dfrac{1}{\sqrt[3]{Z - x^{2}}}$'
      - say: 'A cube root is the same as the power 1 over 3. Therefore $y$ equals 1 over the bracket to the power 1 over 3.'
        write: '$\therefore y = \dfrac{1}{(Z - x^{2})^{\frac{1}{3}}}$'
      - section: 'Check'
        say: 'Check with numbers. Take $x$ equals 1 and $Z$ equals 9. Our formula gives 1 over 9 minus 1, to the power 1 over 3. The cube root of 8 is 2, so $y$ is a half.'
        write: '$y = \dfrac{1}{(9 - 1)^{\frac{1}{3}}} = \dfrac{1}{2}$'
      - say: 'Put $y$ equals a half into the question. A half cubed is 1 over 8, and 1 over that is 8. 1 plus 8 is 9, which is $Z$.'
        write: '$1^{2} + \dfrac{1}{(\frac{1}{2})^{3}} = 1 + 8 = 9\ \checkmark$'
      - say: 'So $y$ is 1 over $Z$ minus $x$ squared, to the power 1 over 3: option C.'
        write: '$\therefore y = \dfrac{1}{(Z - x^{2})^{\frac{1}{3}}}$ (C)'
        answer: true
    traps:
      A: 'You went for the bracket cubed. To undo $y$ cubed you take the cube root, which is the power 1 over 3, not the power 3.'
      B: 'You went for $Z$ plus $x$ cubed. Moving $x$ squared across makes it minus $x$ squared, and it stays squared. The bracket is $Z$ minus $x$ squared.'
      D: 'You went for the cube root of $Z$ minus the cube root of $x$ squared. Roots do not split over a subtraction: the cube root of 9 minus 1 is 2, but the cube root of 9 minus the cube root of 1 is about 1.08. Keep the bracket whole.'
  21:
    moments:
      - section: 'The question'
        say: 'Which values of $m$ turn this into a perfect square? It looks like guesswork, but one rule settles it: the discriminant must be zero.'
        write: '$x^{2} + 2(m + 1)x + m + 3$'
        doodle: {name: 'custom:1987_q21_a', id: curve, caption: 'a perfect square touches once'}
      - section: 'Solution'
        say: 'A perfect square has two equal roots. Its graph just touches the $x$-axis once. For equal roots, $b$ squared minus 4 $a c$ equals zero.'
        write: 'Solution'
        doodle_do: [{id: curve, op: circle, part: touch}]
      - say: 'So we write the condition first: $b$ squared minus 4 $a c$ equals zero.'
        write: 'Perfect square: $b^{2} - 4ac = 0$'
      - say: 'Read off $a$, $b$ and $c$. $a$ is the coefficient of $x$ squared, 1. $b$ is the coefficient of $x$: 2 times, $m$ plus 1. $c$ is the rest: $m$ plus 3.'
        write: '$a = 1,\ b = 2(m + 1),\ c = m + 3$'
      - say: 'Substitute them, each in brackets.'
        write: '$[2(m + 1)]^{2} - 4(1)(m + 3) = 0$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: 'b = 2(m + 1)'}, at: '[2(m + 1)]2', text: 'b'}
      - say: '2 times $m$ plus 1, all squared, is 2 squared, which is 4, times $m$ plus 1 squared.'
        write: '$4(m + 1)^{2} - 4(m + 3) = 0$'
      - say: 'Every term has a 4, so divide both sides by 4.'
        write: '$(m + 1)^{2} - (m + 3) = 0$'
      - say: 'Open the brackets. $m$ plus 1, all squared, is $m$ squared plus 2 $m$ plus 1. The minus sign makes $m$ plus 3 into minus $m$ minus 3.'
        write: '$m^{2} + 2m + 1 - m - 3 = 0$'
      - say: 'Collect like terms. 2 $m$ minus $m$ is $m$, and 1 minus 3 is negative 2.'
        write: '$m^{2} + m - 2 = 0$'
      - section: 'Factorise'
        say: 'Now factorise. The product is $a$ times $c$: 1 times negative 2, which is negative 2. The sum is $b$, which is 1.'
        write: 'Product $= ac = -2$, Sum $= b = 1$'
      - say: 'Two numbers that multiply to negative 2 and add to 1: plus 2 and negative 1.'
        write: 'Factors: $+2$ and $-1$'
      - say: 'Replace the middle term, $m$, with 2 $m$ minus $m$.'
        write: '$m^{2} + 2m - m - 2 = 0$'
      - say: 'Group in pairs. From the first pair take out $m$; from the second take out negative 1. Both brackets are $m$ plus 2.'
        write: '$m(m + 2) - 1(m + 2) = 0$'
      - say: 'Take out the common bracket, $m$ plus 2. What is left is $m$ minus 1.'
        write: '$(m + 2)(m - 1) = 0$'
      - say: 'Either $m$ plus 2 is zero or $m$ minus 1 is zero.'
        write: 'Either $m + 2 = 0$ or $m - 1 = 0$'
      - say: 'Therefore $m$ is negative 2 or $m$ is 1.'
        write: '$\therefore m = -2$ or $m = 1$'
      - section: 'Check'
        say: 'Check $m$ equals 1. Then $b$ is 2 times 2, which is 4, and $c$ is 4. We get $x$ squared plus 4 $x$ plus 4: the tiles fit into one square of side $x$ plus 2.'
        doodle: {name: 'custom:1987_q21_b', id: tiles, caption: 'x² + 4x + 4 as tiles'}
        doodle_do: [{id: tiles, op: highlight, part: units}]
        write: '$m = 1$: $x^{2} + 4x + 4 = (x + 2)^{2}\ \checkmark$'
      - say: 'Check $m$ equals negative 2. $b$ is 2 times negative 1, which is negative 2, and $c$ is 1. That is $x$ minus 1, all squared.'
        write: '$m = -2$: $x^{2} - 2x + 1 = (x - 1)^{2}\ \checkmark$'
      - say: 'So $m$ is 1 or negative 2: option C.'
        write: '$\therefore m = 1, -2$ (C)'
        answer: true
    traps:
      A: 'You went for negative 1 and 1. Try $m$ equals negative 1: the expression becomes $x$ squared plus 2, which is not a perfect square. The equation $m$ squared plus $m$ minus 2 equals zero gives 1 and negative 2.'
      B: 'You went for negative 1 and 2. Those are the right numbers with the signs reversed. From $m$ plus 2 times $m$ minus 1 equals zero, $m$ is negative 2 or 1.'
      D: 'You went for 2 and negative 2. Only negative 2 is right. The factors are $m$ plus 2 and $m$ minus 1, so the other value is 1, not 2.'
  22:
    moments:
      - section: 'The question'
        say: 'Powers of 6 everywhere, yet this is really a quadratic wearing a costume. Take the costume off and it factorises like any other.'
        write: '$6^{2x + 1} - 7(6^{x}) - 5$'
        doodle: {name: 'custom:1987_q22_a', id: cards, caption: 'a quadratic in disguise', size: scene}
      - section: 'Solution'
        say: 'First we rewrite 6 to the power 2 $x$ plus 1 with the laws of indices, so that only 6 to the $x$ appears.'
        write: 'Solution'
      - say: 'When we multiply powers of the same base, we add the indices. So 6 to the 2 $x$ plus 1 is 6 to the 1, times 6 to the 2 $x$.'
        write: '$6^{2x + 1} = 6^{1} \times 6^{2x}$'
      - say: 'And 6 to the 2 $x$ is 6 to the $x$, squared, because a power of a power multiplies the indices. Look at the two blue cards.'
        doodle_do: [{id: cards, op: highlight, part: cards}]
        write: '$= 6(6^{x})^{2}$'
      - say: 'Now let $u$ stand for 6 to the $x$. Put a $u$ tag on each blue card.'
        doodle_do: [{id: cards, op: stage, stage: 'custom:1987_q22_a2'}]
        write: 'Let $u = 6^{x}$'
      - say: 'The whole expression becomes 6 $u$ squared, minus 7 $u$, minus 5. An ordinary quadratic in $u$.'
        write: '$6u^{2} - 7u - 5$'
        point:
          - {line: 5, kind: highlight, at: '6u2 − 7u − 5', to: {doodle: cards, part: quad}}
      - section: 'Factorise'
        say: 'Product is $a$ times $c$: 6 times negative 5, which is negative 30. Sum is $b$: negative 7.'
        write: 'Product $= ac = -30$, Sum $= b = -7$'
      - say: 'Two numbers that multiply to negative 30 and add to negative 7: negative 10 and plus 3. Negative 10 plus 3 is negative 7.'
        write: 'Factors: $-10$ and $+3$'
      - say: 'Replace the middle term, negative 7 $u$, with negative 10 $u$ plus 3 $u$.'
        write: '$6u^{2} - 10u + 3u - 5$'
      - say: 'Group in pairs. From the first pair take out 2 $u$; from the second take out 1. Both brackets are 3 $u$ minus 5, so we are on track.'
        write: '$2u(3u - 5) + 1(3u - 5)$'
      - say: 'Take out the common bracket, 3 $u$ minus 5. What is left is 2 $u$ plus 1. Write the two brackets under the cards.'
        doodle_do: [{id: cards, op: stage, stage: 'custom:1987_q22_a3'}]
        write: '$(3u - 5)(2u + 1)$'
      - say: 'Now put 6 to the $x$ back in place of $u$. Therefore we get 3 times 6 to the $x$ minus 5, times 2 times 6 to the $x$ plus 1.'
        doodle_do: [{id: cards, op: pulse, part: us}]
        write: '$\therefore \{3(6^{x}) - 5\}\{2(6^{x}) + 1\}$'
        point:
          - {line: 4, kind: arrow, at: 'u = 6x', text: 'put back'}
      - section: 'Check'
        say: 'Check by opening the brackets. 3 $u$ times 2 $u$ is 6 $u$ squared, 3 $u$ times 1 is 3 $u$, negative 5 times 2 $u$ is negative 10 $u$, negative 5 times 1 is negative 5.'
        write: '$6u^{2} + 3u - 10u - 5$'
      - say: '3 $u$ minus 10 $u$ is negative 7 $u$. That is exactly what we started with.'
        write: '$= 6u^{2} - 7u - 5\ \checkmark$'
      - say: 'So the factors are 3 times 6 to the $x$ minus 5, and 2 times 6 to the $x$ plus 1: option A.'
        write: '$\therefore \{3(6^{x}) - 5\}\{2(6^{x}) + 1\}$ (A)'
        answer: true
    traps:
      B: 'You went for negative 1 in the second bracket. 3 $u$ minus 5, times 2 $u$ minus 1, opens to 6 $u$ squared minus 13 $u$ plus 5: wrong middle and last terms. We need plus 1.'
      C: 'You went for 2 $u$ minus 5, times 3 $u$ plus 1. That opens to 6 $u$ squared minus 13 $u$ minus 5. The factors negative 10 and 3 give 3 $u$ minus 5, times 2 $u$ plus 1.'
      D: 'You went for 2 $u$ minus 5, times 3 $u$ minus 1. That opens to 6 $u$ squared minus 17 $u$ plus 5. Open your brackets to check before you choose.'
  23:
    moments:
      - section: 'The question'
        say: 'One equation is simple and one has squares. The simple one is our way in: it hands us $x$ in terms of $y$.'
        write: '$x + y = 5,\ x^{2} - 2y^{2} = 1$'
        doodle: {name: 'custom:1987_q23_a', id: swap, caption: 'x is the same as 5 − y', size: scene}
      - section: 'Solution'
        say: 'We use substitution: make $x$ the subject of the linear equation, then put it into the quadratic one. First, number the equations.'
        write: 'Solution'
      - say: 'Equation 1: $x$ plus $y$ equals 5.'
        write: '$x + y = 5 \quad \text{......(1)}$'
      - say: 'Equation 2: $x$ squared minus 2 $y$ squared equals 1.'
        write: '$x^{2} - 2y^{2} = 1 \quad \text{......(2)}$'
      - say: 'From equation 1, subtract $y$ from both sides. Call this equation 3. It is written on the card.'
        write: 'From (1): $x = 5 - y \quad \text{......(3)}$'
      - say: 'Substitute equation 3 into equation 2. Watch the card drop into the $x$ slot.'
        doodle_do: [{id: swap, op: move, part: card, path: drop}]
        write: 'Substitute (3) in (2):'
      - say: 'In place of $x$ we write 5 minus $y$, in brackets.'
        write: '$(5 - y)^{2} - 2y^{2} = 1$'
      - say: 'Open the brackets. 5 minus $y$, all squared: 25, minus 10 $y$, plus $y$ squared.'
        write: '$25 - 10y + y^{2} - 2y^{2} = 1$'
      - say: 'Collect like terms. $y$ squared minus 2 $y$ squared is negative $y$ squared.'
        write: '$25 - 10y - y^{2} = 1$'
      - say: 'Subtract 1 from both sides, so the right-hand side is zero. 25 minus 1 is 24.'
        write: '$24 - 10y - y^{2} = 0$'
      - say: 'Multiply through by negative 1 so that $y$ squared is positive, and write the terms in order.'
        write: '$y^{2} + 10y - 24 = 0$'
      - section: 'Factorise'
        say: 'Product is $a$ times $c$: negative 24. Sum is $b$: 10.'
        write: 'Product $= ac = -24$, Sum $= b = 10$'
      - say: 'Two numbers that multiply to negative 24 and add to 10: plus 12 and negative 2.'
        write: 'Factors: $+12$ and $-2$'
      - say: 'Replace the middle term, 10 $y$, with 12 $y$ minus 2 $y$.'
        write: '$y^{2} + 12y - 2y - 24 = 0$'
      - say: 'Group in pairs. Take out $y$ from the first pair and negative 2 from the second. Both brackets are $y$ plus 12.'
        write: '$y(y + 12) - 2(y + 12) = 0$'
      - say: 'Take out the common bracket, $y$ plus 12. What is left is $y$ minus 2.'
        write: '$(y + 12)(y - 2) = 0$'
      - say: 'Either $y$ plus 12 is zero or $y$ minus 2 is zero.'
        write: 'Either $y + 12 = 0$ or $y - 2 = 0$'
      - say: 'Therefore $y$ is negative 12 or 2.'
        doodle_do: [{id: swap, op: label, part: eq, text: 'y = −12 or y = 2'}]
        write: '$\therefore y = -12$ or $y = 2$'
      - section: 'Check'
        say: 'Check $y$ equals 2. From equation 3, $x$ is 5 minus 2, which is 3. 3 squared is 9, and 2 times 2 squared is 8. 9 minus 8 is 1.'
        write: '$y = 2$: $x = 3$, $9 - 8 = 1\ \checkmark$'
      - say: 'Check $y$ equals negative 12. $x$ is 5 plus 12, which is 17. 17 squared is 289, and 2 times 144 is 288. 289 minus 288 is 1.'
        write: '$y = -12$: $x = 17$, $289 - 288 = 1\ \checkmark$'
      - say: 'So the values of $y$ are negative 12 and 2: option C.'
        write: '$\therefore y = -12, 2$ (C)'
        answer: true
    traps:
      A: 'You went for 12 and negative 2. Those are the right numbers with both signs reversed. From $y$ plus 12 times $y$ minus 2 equals zero, $y$ is negative 12 or 2.'
      B: 'You went for negative 12 and 12. Try $y$ equals 12: $x$ is negative 7, and 49 minus 288 is not 1. The values are negative 12 and 2.'
      D: 'You went for 2 and negative 2. 2 works, but $y$ equals negative 2 gives $x$ equals 7, and 49 minus 8 is 41, not 1. The other value is negative 12.'
  24:
    moments:
      - say: 'We''re told that a figure with $n$ minus 2, all squared, sides has $n$ diagonals. We want the number of diagonals, $n$, for a 25-sided figure.'
        write: 'Sides $= (n - 2)^{2}$, diagonals $= n$'
      - say: 'Be clear which is which. The rule starts from the number of diagonals, $n$, and gives the number of sides. Picture the rule as a machine: diagonals go in, sides come out.'
        doodle: {name: 'custom:1987_q24_a', id: mach, caption: 'diagonals in, sides out'}
        write: 'Diagonals $n \to$ sides $(n - 2)^{2}$'
      - say: 'Look at the output end of the machine. Here we know the number of sides, 25. So we set the rule equal to 25 and work backwards to $n$.'
        doodle_do: [{id: mach, op: highlight, part: output}]
        write: '$(n - 2)^{2} = 25$'
        point:
          - {line: 1, kind: underline, at: 'sides (n − 2)2', text: 'sides'}
      - say: 'To undo the square, take the square root of both sides. The square root of 25 is 5.'
        write: '$n - 2 = \sqrt{25} = 5$'
      - say: 'We use the positive root. Minus 5 would give $n$ as minus 3, and a figure can''t have a negative number of diagonals.'
        write: '$n - 2 = -5 \Rightarrow n = -3$ (rejected)'
      - say: 'Now add 2 to both sides of $n$ minus 2 equals 5. 5 plus 2 is 7. That is what went into the machine.'
        doodle_do: [{id: mach, op: label, part: input, text: 'n = 7'}]
        write: '$n = 5 + 2 = 7$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: 'n [[− 2]]'}, at: '+ 2', text: 'across the ='}
          - {line: 5, kind: highlight, at: '= 7', to: {doodle: mach, part: input}}
      - say: 'Let''s check. 7 minus 2 is 5, and 5 squared is 25. That''s the 25 sides we were given.'
        write: 'Check: $(7 - 2)^{2} = 5^{2} = 25$'
      - say: 'Remember which end of the machine the 25 is at. Notice that 25 is the number of sides, the output of the rule, not the input. Putting $n$ equals 25 into the rule would give 23 squared, which is 529 sides, a different figure.'
        doodle_do: [{id: mach, op: arrow, part: output, to_part: input}]
        write: 'Not: $(25 - 2)^{2} = 529$'
        point:
          - {line: 7, kind: strike, at: '(25 − 2)2 = 529', text: 'not this'}
      - say: 'So $n$, the number of diagonals, is 7, which is answer choice A.'
        write: 'Therefore $n = 7$'
        answer: true
    traps:
      B: 'You went for 8. That gives 8 minus 2, which is 6, and 6 squared is 36 sides, not 25. We need $n$ minus 2 to be 5.'
      C: 'You went for 9. That gives 7 squared, which is 49 sides. We need $n$ minus 2 squared to be 25, so $n$ minus 2 is 5 and $n$ is 7.'
      D: 'You went for 10. That gives 8 squared, which is 64 sides. Take the square root of 25 to get 5, then add 2: $n$ is 7.'
  25:
    moments:
      - say: 'The graph shows a cubic function. We want the values of $x$ where the function vanishes.'
        write: 'Find $x$ where $f(x)$ vanishes'
        point:
          - {figure: 0, kind: underline, target: 'f(x)', text: 'the cubic'}
      - say: 'What does vanish mean? A function vanishes where its value is zero.'
        write: 'Vanishes means $f(x) = 0$'
      - say: 'On a graph, the value of the function is the height of the curve. Height zero means the curve is on the $x$-axis. So we look for every place the curve meets the $x$-axis.'
        write: 'On the graph: height $= 0$ on the $x$-axis'
        point:
          - {figure: 0, kind: circle, target: 'x', text: 'the x-axis'}
      - say: 'Starting from the left of the diagram, the curve comes up from below and crosses the axis at $x$ equals minus 1.'
        write: 'First crossing: $x = -1$'
        point:
          - {figure: 0, kind: circle, target: '−1'}
      - say: 'It rises to a peak above the axis, then comes down and passes through the origin, where $x$ is 0.'
        write: 'Second crossing: $x = 0$'
        point:
          - {figure: 0, kind: circle, target: '0'}
      - say: 'It dips to a trough below the axis, then rises again and crosses at $x$ equals 1.'
        write: 'Third crossing: $x = 1$'
        point:
          - {figure: 0, kind: circle, target: '1'}
      - say: 'A cubic can cross the axis at most three times, and here we can see all three. So there are no more.'
        write: 'Cubic: at most $3$ roots'
        point:
          - {figure: 0, kind: circle, target: '−1'}
          - {figure: 0, kind: circle, target: '0'}
          - {figure: 0, kind: circle, target: '1', text: 'all three crossings'}
      - say: 'In fact, a cubic that is zero at minus 1, 0 and 1 is $k$ times $x$, times $x$ minus 1, times $x$ plus 1.'
        write: '$f(x) = kx(x - 1)(x + 1)$'
      - say: 'Put in $x$ equals 1, for example. 1 minus 1 is zero, so the whole product is zero. The same happens at 0 and at minus 1.'
        write: '$f(1) = k(1)(1 - 1)(1 + 1) = 0$'
      - say: 'The other options describe whole stretches of the axis, not single points. The function is zero only at the exact crossing points.'
        point:
          - {figure: 0, kind: arrow, target: '0', text: 'single points only'}
      - say: 'So the function vanishes at minus 1, 0 and 1, which is answer choice A.'
        write: 'Therefore $x = -1,\ 0,\ 1$'
        answer: true
    traps:
      B: 'You went for minus 1 is less than $x$ is less than 1. That''s a whole stretch of the axis, where the curve is mostly above or below it. Vanishes means the exact points where the curve crosses: minus 1, 0 and 1.'
      C: 'You went for $x$ less than or equal to minus 1. That''s a region to the left, where the curve is below the axis. The function is zero only at the crossing points: minus 1, 0 and 1.'
      D: 'You went for $x$ greater than 1. There the curve is above the axis, so the function is positive, not zero. It vanishes only at minus 1, 0 and 1.'
  26:
    moments:
      - section: 'The question'
        say: 'Solve $x$ minus 1 is greater than 4 times $x$ plus 2. Two options differ only in the direction of the sign, so the step to watch is the division at the end.'
        write: '$x - 1 > 4(x + 2)$'
      - say: 'Solution. Solve it like an equation, with one rule: multiplying or dividing both sides by a negative number reverses the sign.'
        write: 'Solution'
      - say: 'Open the bracket. 4 times $x$ is $4x$, and 4 times 2 is 8.'
        write: '$x - 1 > 4x + 8$'
      - say: 'Collect like terms: $x$ terms on the left, numbers on the right. Subtract $4x$ from both sides, and add 1 to both sides.'
        write: '$x - 4x > 8 + 1$'
      - say: '$x$ minus $4x$ is minus $3x$, and 8 plus 1 is 9.'
        write: '$-3x > 9$'
      - section: 'Divide by a negative'
        say: 'Now divide both sides by minus 3. It is negative, so the greater-than sign reverses to less-than.'
        write: 'Divide by $-3$, reverse the sign: $\ x < \dfrac{9}{-3}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '[[−3]]x'}, at: 'by [[−3]]', text: 'negative'}
      - say: '9 divided by minus 3 is minus 3.'
        write: '$\therefore\ x < -3$'
      - section: 'The number line'
        say: 'On a number line: an open circle at minus 3, because minus 3 is not included, and an arrow to the left.'
        diagram: {id: n, kind: numberline, range: [-7, 2]}
        diagram_do:
          - {id: n, op: interval, to: -3, to_open: true, text: 'x < −3', answer: true, 'on': 'open circle'}
      - section: 'Check'
        say: 'Check with minus 4, on the arrow. The left side is minus 4 minus 1, which is minus 5. The right side is 4 times minus 2, which is minus 8.'
        write: 'Check $x = -4$: $\ -4 - 1 = -5,\ \ 4(-4 + 2) = -8$'
        diagram_do:
          - {id: n, op: point, x: -4, text: 'test −4'}
      - say: 'Minus 5 is greater than minus 8, so it works.'
        write: '$-5 > -8\ \checkmark$'
      - say: 'So the solution is $x$ less than minus 3: option B.'
        write: '$x < -3$'
        answer: true
    traps:
      A: 'You went for $x$ greater than minus 3. That divides by minus 3 without reversing the sign. Dividing by a negative reverses the inequality, so it''s $x$ less than minus 3.'
      C: 'You went for 2 less than $x$ less than 3. This inequality has only one boundary, at minus 3. Solving gives $x$ less than minus 3.'
      D: 'You went for minus 3 less than $x$ less than minus 2. There is no second boundary at minus 2. Solving step by step gives $x$ less than minus 3.'
  27:
    moments:
      - section: 'The question'
        say: 'You cannot cancel the $x$ squared terms here. A fraction like this only simplifies by cancelling whole brackets, so first we make the brackets.'
        write: '$\dfrac{x^{2} - y^{2}}{2x^{2} + xy - y^{2}}$'
      - section: 'Solution'
        say: 'We factorise the numerator and the denominator completely, then cancel any common factor.'
        write: 'Solution'
      - say: 'The numerator is a difference of two squares: $x$ squared minus $y$ squared is $x$ minus $y$, times $x$ plus $y$.'
        write: 'Numerator: $x^{2} - y^{2} = (x - y)(x + y)$'
      - section: 'Factorise the denominator'
        say: 'Now the denominator, 2 $x$ squared plus $x y$ minus $y$ squared. We factorise it by product and sum, just like a quadratic in $x$.'
        write: 'Denominator: $2x^{2} + xy - y^{2}$'
      - say: 'The product is 2 times negative 1, the first and last coefficients: negative 2. The sum is the middle coefficient, 1.'
        write: 'Product $= 2 \times (-1) = -2$, Sum $= 1$'
      - say: 'Two numbers that multiply to negative 2 and add to 1: plus 2 and negative 1.'
        write: 'Factors: $+2$ and $-1$'
      - say: 'Replace the middle term, $x y$, with 2 $x y$ minus $x y$.'
        write: '$= 2x^{2} + 2xy - xy - y^{2}$'
      - say: 'Group in pairs. From the first pair take out 2 $x$; from the second take out negative $y$. Both brackets are $x$ plus $y$.'
        write: '$= 2x(x + y) - y(x + y)$'
      - say: 'Take out the common bracket, $x$ plus $y$. What is left is 2 $x$ minus $y$.'
        write: '$= (x + y)(2x - y)$'
      - section: 'Cancel'
        say: 'Now write the fraction with both parts factorised. Picture each factor as a tile.'
        doodle: {name: 'custom:1987_q27_a', id: tiles, caption: 'factor tiles', size: scene}
        write: '$\dfrac{(x - y)(x + y)}{(2x - y)(x + y)}$'
      - say: 'The bracket $x$ plus $y$ is on top and below, so cancel the common factor. Cross out that pair of tiles.'
        doodle_do: [{id: tiles, op: cross, part: t2}, {id: tiles, op: cross, part: b2}]
        write: '$= \dfrac{x - y}{2x - y}$'
      - section: 'Check'
        say: 'Check with $x$ equals 2 and $y$ equals 1. The question gives 4 minus 1, over 8 plus 2 minus 1: 3 over 9, which is 1 over 3.'
        write: '$x = 2, y = 1$: $\dfrac{4 - 1}{8 + 2 - 1} = \dfrac{1}{3}$'
      - say: 'Our answer gives 2 minus 1, over 4 minus 1: also 1 over 3.'
        write: '$\dfrac{2 - 1}{4 - 1} = \dfrac{1}{3}\ \checkmark$'
      - say: 'The two tiles left are the answer: $x$ minus $y$, over 2 $x$ minus $y$. Option C.'
        doodle_do: [{id: tiles, op: circle, part: t1}, {id: tiles, op: circle, part: b1}]
        write: '$\therefore \dfrac{x - y}{2x - y}$ (C)'
        answer: true
    traps:
      A: 'You went for $x$ plus $y$ over 2 $x$ plus $y$. The common factor is $x$ plus $y$, and that is what cancels. What is left on top is $x$ minus $y$, and below, 2 $x$ minus $y$.'
      B: 'You went for $x$ plus $y$ over 2 $x$ minus $y$. That keeps the bracket that cancels. $x$ plus $y$ is on top and below, so it goes, leaving $x$ minus $y$ on top.'
      D: 'You went for $x$ minus $y$ over 2 $x$ plus $y$. That factorises the denominator as 2 $x$ plus $y$, times $x$ minus $y$, which opens with negative $x y$ in the middle. The factors are $x$ plus $y$ and 2 $x$ minus $y$.'
  28:
    moments:
      - say: 'We want the minimum value of $y$ when $y$ equals $x$ squared minus 6 $x$ plus 8.'
        write: '$y = x^{2} - 6x + 8$'
      - say: 'Let me sketch the graph, so we can see its shape.'
        show_sketch: true
      - say: 'The $x$ squared term is positive, so the graph is a U shape. A U shape has a lowest point, and the $y$ at that point is the minimum value we want.'
        write: 'U-shaped graph: lowest point gives $y_{\min}$'
        point:
          - {figure: sketch, kind: circle, target: minimum}
      - say: 'To find it, we complete the square. The idea is to write $x$ squared minus 6 $x$ as a perfect square, $x$ minus some number, all squared, plus a leftover number.'
        write: 'Complete the square on $x^{2} - 6x$:'
      - say: 'The number in the bracket is half of the $x$ coefficient. The coefficient of $x$ is minus 6, and half of minus 6 is minus 3.'
        write: 'Half of $-6$: $\ -3$'
      - say: 'So we use $x$ minus 3, all squared. Let''s expand it: $x$ times $x$ is $x$ squared, twice $x$ times minus 3 is minus 6 $x$, and minus 3 squared is plus 9.'
        write: '$(x - 3)^{2} = x^{2} - 6x + 9$'
      - say: 'That is our $x$ squared minus 6 $x$, but with an extra 9. So $x$ squared minus 6 $x$ is $x$ minus 3, all squared, with that 9 taken away again.'
        write: '$x^{2} - 6x = (x - 3)^{2} - 9$'
      - say: 'Now go back to the equation for $y$, and replace its $x$ squared minus 6 $x$ with what we just found.'
        write: '$y = (x - 3)^{2} - 9 + 8$'
        point:
