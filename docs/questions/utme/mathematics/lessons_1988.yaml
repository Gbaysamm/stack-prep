        write: '$x^{2} + \dfrac{2x}{r^{2}} + \dfrac{1}{r^{4}} = 0$'
      - say: 'Before reaching for the formula, let''s look at the shape. $A$ squared plus $2AB$ plus $B$ squared is always $A$ plus $B$, all squared.'
        write: '$A^{2} + 2AB + B^{2} = (A + B)^{2}$'
      - say: 'The first term is $x$ squared, so try $A$ as $x$. The last term, 1 over $r$ to the fourth, looks like a square too, so try $B$ as 1 over $r$ squared.'
