        write: 'Longest side $= PR$ (opposite the largest $\angle$)'
        point:
          - {figure: sketch, kind: highlight, target: PR, text: 'longest'}
      - say: 'Name each side by the angle opposite it. Let $PR$ be $q$, opposite $Q$. Then $p$ is $QR$, 2, and $r$ is $PQ$, 1.'
        write: 'Let $PR = q$; $\ p = QR = 2,\ r = PQ = 1,\ Q = 120^{\circ}$'
      - say: 'We have two sides and the included angle, so the cosine rule gives the third side.'
        write: '$q^{2} = p^{2} + r^{2} - 2pr\cos Q$ (cosine rule)'
        point:
          - {figure: sketch, kind: arc, target: PQR, text: 'included angle'}
      - say: 'Substitute. $p$ is 2, $r$ is 1, and $Q$ is 120 degrees.'
        write: '$q^{2} = 2^{2} + 1^{2} - 2(2)(1)\cos 120^{\circ}$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: 'QR = [[2]]'}, at: '= [[2]]2 +', text: 'p'}
          - {line: 5, kind: move, from: {line: 3, at: 'PQ = [[1]]'}, at: '+ [[1]]2', text: 'r'}
      - say: '120 degrees is in the second quadrant, where cos is negative. So cos 120 is minus cos 60, which is minus a half.'
        write: '$\cos 120^{\circ} = -\cos 60^{\circ} = -\tfrac{1}{2}$'
      - say: '2 squared is 4, 1 squared is 1, and 2 times 2 times 1 is 4. Put in minus a half for the cosine.'
        write: '$q^{2} = 4 + 1 - 4\left(-\tfrac{1}{2}\right)$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '= −21'}, at: '(−21)', text: 'cos 120°'}
      - say: '4 times minus a half is minus 2, and minus minus 2 is plus 2. 4 plus 1 plus 2 is 7.'
        write: '$= 4 + 1 + 2 = 7$'
      - say: 'Take the square root of both sides.'
        write: '$q = \sqrt{7}$ cm'
        point:
          - {figure: sketch, kind: label, target: PR, text: '√7 cm'}
      - section: 'Check'
        say: 'To check, root 7 is about 2.65, longer than both 1 and 2, just as the side facing the obtuse angle should be.'
        write: 'Check: $\sqrt{7} \approx 2.65 > 2\ \checkmark$'
      - say: 'Therefore the longest side, $PR$, is root 7 centimetres, which is option D.'
        write: '$\therefore PR = \sqrt{7}$ cm'
        answer: true
        point:
          - {figure: sketch, kind: label, target: '?', text: '√7 cm'}
    traps:
      A: 'You went for 3 cm. That just adds 1 and 2. A side of a triangle must be shorter than the other two added together; the cosine rule gives root 7, about 2.65.'
      B: 'You went for 3 root 7 over 7. That is 3 over root 7, about 1.13, shorter than $QR$. The side facing 120 degrees must be the longest: root 7.'
      C: 'You went for 3 root 7, about 7.9: longer than 1 plus 2 together, which is impossible. The cosine rule gives $q$ squared equals 7, so root 7.'
  44:
    moments:
      - section: 'The question'
        say: 'A pipe is a solid metal cylinder with a narrower cylinder drilled out of the middle. The metal is what is left. That idea solves this question.'
        write: 'Find the volume of metal in the pipe.'
      - say: 'Write Solution, then sketch the outside of the pipe, which is a cylinder 10 cm long and 12 cm across.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '10 cm', text: 'h', 'on': '10 cm long'}
          - {figure: sketch, kind: circle, target: '12 cm', text: 'external diameter', 'on': '12 cm across'}
      - section: 'What we know'
        say: 'List the givens. Length h is 10 cm, external diameter is 12 cm, and thickness is 1 cm.'
        write: '$h = 10$ cm, external diameter $= 12$ cm, thickness $= 1$ cm'
      - say: 'The formula needs radii. The outer radius capital R is half of 12, which is 6.'
        write: '$R = \dfrac{12}{2} = 6$ cm'
      - say: 'Now the hole down the middle. The wall is 1 cm thick, so the inner radius small r is 1 less than R, and 6 minus 1 is 5.'
        write: '$r = R - \text{thickness} = 6 - 1 = 5$ cm'
        show_sketch: sketch_b
        point:
          - {figure: sketch_b, kind: circle, target: '1 cm', text: 'wall', 'on': '1 cm thick'}
      - section: 'The formula'
        say: 'Volume of a cylinder is pi r squared h. The metal is the outer cylinder minus the hole.'
        write: 'Vol. of metal $= \pi R^{2}h - \pi r^{2}h$'
      - say: 'Both terms have pi and h, so take them out as a common factor.'
        write: '$V = \pi h(R^{2} - r^{2})$'
      - section: 'Substitute'
        say: 'Now substitute. h is 10, R is 6, r is 5.'
        write: '$V = \pi \times 10 \times (6^{2} - 5^{2})$'
        point:
          - {line: 7, kind: move, from: {line: 3, at: '= [[6]]cm'}, at: '(6', text: 'R', 'on': 'R is 6'}
          - {line: 7, kind: move, from: {line: 4, at: '= [[5]]cm'}, at: '−5', text: 'r', 'on': 'r is 5'}
      - section: 'Simplify'
        say: '6 squared is 36, and 5 squared is 25. 36 minus 25 is 11.'
        write: '$= 10\pi(36 - 25) = 10\pi \times 11$'
      - say: '10 times 11 is 110. Therefore the volume of metal is 110 pi cubic centimetres.'
        write: '$\therefore V = 110\pi\ \text{cm}^{3}$'
      - section: 'Check'
        say: 'Check part by part. The outer cylinder is pi times 36 times 10, which is 360 pi. The hole is pi times 25 times 10, which is 250 pi. 360 pi minus 250 pi is 110 pi.'
        write: 'Check: $360\pi - 250\pi = 110\pi$ ✓'
      - section: 'Answer'
        say: 'So the volume of metal is 110 pi cubic centimetres, which is answer choice B.'
        write: '$\therefore V = 110\pi\ \text{cm}^{3}$ (B)'
        answer: true
    traps:
      A: 'You went for 120 pi. That is 2 pi times 6 times 10, the curved surface area of the outer cylinder, an area, not a volume. The metal is pi times 10, times 6 squared minus 5 squared: 110 pi.'
      C: 'You went for 60 pi. That is pi times 6 times 10: the outer radius not squared, and no hole taken away. Square both radii: 36 minus 25 is 11, and 10 pi times 11 is 110 pi.'
      D: 'You went for 50 pi. That is pi times 5 times 10, which is not the metal. The metal is the outer cylinder minus the hole: pi times 10, times 36 minus 25.'
  45:
    moments:
      - section: 'The question'
        say: 'Picture an ice-cream cone with a round scoop, which is a cone and a hemisphere joined at the same circle. The volume of the whole solid is the two volumes added.'
        write: 'Find the volume of the solid.'
      - say: 'Write Solution. The figure is given, and it is a cone of radius 3 cm and height 6 cm, standing on a hemisphere of the same radius.'
        write: 'Solution'
        point:
          - {figure: 0, kind: circle, target: '3 cm', text: 'r', 'on': 'radius 3 cm'}
          - {figure: 0, kind: circle, target: '6 cm', text: 'h', 'on': 'height 6 cm'}
      - section: 'What we know'
        say: 'List the givens. r is 3 cm, the height of the cone h is 6 cm, and the hemisphere has the same r.'
        write: '$r = 3$ cm, $h = 6$ cm'
      - section: 'The plan'
        say: 'The volume of the solid is the volume of the cone plus the volume of the hemisphere.'
        write: 'Vol. of solid $=$ vol. of cone $+$ vol. of hemisphere'
        point:
          - {figure: 0, kind: arrow, target: {x: 140, y: 205}, text: 'shared circular face', 'on': 'plus'}
      - section: 'The cone'
        say: 'Volume of a cone is one third pi r squared h.'
        write: 'Vol. of cone $= \tfrac{1}{3}\pi r^{2}h$'
      - say: 'Substitute r as 3 and h as 6. 3 squared is 9, and 9 times 6 is 54. A third of 54 is 18, so the cone is 18 pi.'
        write: '$= \tfrac{1}{3} \times \pi \times 3^{2} \times 6 = \tfrac{1}{3} \times 54\pi = 18\pi$'
      - section: 'The hemisphere'
        say: 'A hemisphere is half a sphere. Half of 4 over 3 pi r cubed is 2 over 3 pi r cubed.'
        write: 'Vol. of hemisphere $= \tfrac{1}{2} \times \tfrac{4}{3}\pi r^{3} = \tfrac{2}{3}\pi r^{3}$'
      - say: 'Substitute r equals 3. 3 cubed is 27. A third of 27 is 9, and 2 times 9 is 18. So the hemisphere is also 18 pi.'
        write: '$= \tfrac{2}{3} \times \pi \times 3^{3} = \tfrac{2}{3} \times 27\pi = 18\pi$'
      - section: 'Put together'
        say: 'Substitute both into the plan, and 18 pi plus 18 pi is 36 pi.'
        write: 'Vol. of solid $= 18\pi + 18\pi = 36\pi$'
        point:
          - {line: 8, kind: move, from: {line: 5, at: '= [[18π]]'}, at: '= [[18π]] +', text: 'cone', 'on': '18 pi plus'}
          - {line: 8, kind: move, from: {line: 7, at: '= [[18π]]'}, at: '+ 18π', text: 'hemisphere', 'on': 'plus 18 pi'}
      - say: 'Therefore the volume of the solid is 36 pi cubic centimetres.'
        write: '$\therefore V = 36\pi\ \text{cm}^{3}$'
      - section: 'Check'
        say: 'Check with a cylinder of radius 3 and height 6, which is 54 pi. The cone is a third of it, 18 pi. And the hemisphere, 18 pi, is exactly the same here, because its 2 r equals the cone''s height.'
        write: 'Check: cone $= \tfrac{1}{3} \times 54\pi = 18\pi$, hemisphere $= 18\pi$ ✓'
      - section: 'Answer'
        say: 'So the volume of the solid is 36 pi cubic centimetres, which is answer choice B.'
        write: '$\therefore V = 36\pi\ \text{cm}^{3}$ (B)'
        answer: true
    traps:
      A: 'You went for 18 pi. That is only one of the two parts, and it is easy to stop there because they come out equal. Add the cone and the hemisphere: 36 pi.'
      C: 'You went for 54 pi. That is pi times 9 times 6 for the cone, without the one third. The cone is a third of that, 18 pi, and the hemisphere adds another 18 pi.'
      D: 'You went for 108 pi. That is three times too big. Keep the one third in the cone formula and the two thirds in the hemisphere formula: 18 pi each, 36 pi in total.'
  46:
    moments:
      - section: 'The question'
        say: 'In triangle $PQR$, $PQ$ is 10 centimetres and angle $QPR$ is 60 degrees. $S$ obeys two locus conditions. $U$ is the foot of the perpendicular from $S$ to $PR$. We want $SU$.'
        write: '$|PQ| = 10$ cm, $\angle QPR = 60^{\circ}$; $|SU| = ?$'
      - section: 'Solution'
        say: 'Solution. Let me draw triangle $PQR$ with the givens on it.'
        show_sketch: true
        write: 'Solution: $|PQ| = 10$ cm, $\angle QPR = 60^{\circ}$'
        point:
          - {figure: sketch, kind: circle, target: '10 cm'}
          - {figure: sketch, kind: circle, target: '60°'}
      - say: 'The first condition is that $S$ is equidistant from the points $P$ and $Q$. The locus of points equidistant from two points is the perpendicular bisector of the line joining them.'
        show_sketch: sketch_b
        write: '$|SP| = |SQ| \Rightarrow S$ on the $\perp$ bisector of $PQ$'
        point:
          - {figure: sketch_b, kind: circle, target: M, text: 'midpoint'}
      - say: 'The second condition is that $S$ is equidistant from the lines $PQ$ and $PR$. The locus of points equidistant from two lines is the bisector of the angle between them.'
        show_sketch: sketch_c
        write: 'Equidistant from $PQ$ and $PR \Rightarrow S$ on the bisector of $\angle QPR$'
        point:
          - {figure: sketch_c, kind: circle, target: S, text: 'both loci meet'}
      - say: 'The perpendicular bisector meets $PQ$ at its midpoint $M$, at right angles. So $PM$ is half of 10, which is 5.'
        write: '$|PM| = \tfrac{1}{2} \times 10 = 5$ cm ($M$ is the mid-pt of $PQ$)'
        point:
          - {figure: sketch_c, kind: label, target: PM, text: '5 cm'}
      - say: 'The angle bisector cuts 60 degrees into two equal parts. 60 divided by 2 is 30.'
        write: '$\angle SPM = \tfrac{1}{2} \times 60^{\circ} = 30^{\circ}$ ($PS$ bisects $\angle QPR$)'
        point:
          - {figure: sketch_c, kind: arc, target: SPM, text: '30°'}
      - say: 'In the right-angled triangle $PMS$, $SM$ is opposite the 30 degrees and $PM$ is adjacent. In SOH CAH TOA, opposite and adjacent means we use tangent.'
        write: 'In $\triangle PMS$: $\tan 30^{\circ} = \dfrac{|SM|}{|PM|}$ (TOA)'
        point:
          - {figure: sketch_c, kind: highlight, target: SM, text: 'opp'}
          - {figure: sketch_c, kind: highlight, target: PM, text: 'adj'}
      - say: 'Substitute $PM$ equals 5.'
        write: '$\tan 30^{\circ} = \dfrac{|SM|}{5}$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '= 5 cm'}, at: '[[5]]', text: 'PM'}
      - say: 'Multiply both sides by 5. From tables, tan 30 degrees is 0.5774.'
        write: '$|SM| = 5\tan 30^{\circ} = 5 \times 0.5774$'
      - say: '5 times 0.5774 is 2.887.'
        write: '$|SM| = 2.887$ cm'
      - say: '$SM$ is the distance from $S$ to the line $PQ$. $S$ is on the angle bisector, so its distance to $PR$, which is $SU$, is the same.'
        write: '$|SU| = |SM| = 2.887$ cm ($S$ on bisector of $\angle QPR$)'
        point:
          - {figure: sketch_c, kind: highlight, target: SU}
          - {figure: sketch_c, kind: highlight, target: SM, text: 'equal'}
      - say: 'To one decimal place, the second decimal digit is 8, so 2.8 rounds up to 2.9.'
        write: '$|SU| = 2.9$ cm (1 d.p.)'
      - section: 'Check'
        say: 'Check another way. $PS$ is 5 over cos 30 degrees, which is 5.774. In triangle $PUS$ the angle at $P$ is also 30 degrees, so $SU$ is $PS$ times sin 30 degrees.'
        write: 'Check: $|PS| = \dfrac{5}{\cos 30^{\circ}} = 5.774$; $\ |SU| = 5.774 \times \sin 30^{\circ} = 2.887\ \checkmark$'
        point:
          - {figure: sketch_c, kind: highlight, target: PS}
      - section: 'Answer'
        say: 'Therefore $SU$ is 2.9 centimetres, which is option B.'
        write: '$\therefore |SU| = 2.9$ cm'
        answer: true
        point:
          - {figure: sketch_c, kind: label, target: SU, text: '2.9 cm'}
    traps:
      A: 'You went for 2.7. Check the arithmetic: $5 \times \tan 30^{\circ} = 5 \times 0.5774 = 2.887$, which is 2.9 to one decimal place.'
      C: 'You went for 3.1. $SU$ equals $SM$, which is $5\tan 30^{\circ} = 2.887$. That rounds to 2.9, not 3.1.'
      D: 'You went for 3.3. Use the right angle of the triangle: $SM$ is opposite the 30 degrees, so $SM = 5\tan 30^{\circ} = 2.887$. To one decimal place, 2.9.'
  47:
    moments:
      - section: 'The question'
        say: 'In a class of 150 students, the Physics sector of a pie chart has angle 12 degrees. How many students offer Physics?'
        write: 'Class 150. Physics sector $12^{\circ}$. Physics students $= ?$'
      - section: 'Solution'
        say: 'Solution. The givens are that the sectoral angle is 12 degrees and the total frequency, sigma f, is 150.'
        write: 'Angle $= 12^{\circ},\quad \Sigma f = 150$'
      - say: 'The sectoral angle is f over sigma f, times 360. Here we know the angle, so we turn the formula round, and f is the angle over 360, times sigma f.'
        write: '$f = \dfrac{\text{angle}}{360^{\circ}} \times \Sigma f$'
      - say: 'Substitute 12 degrees and 150.'
        write: '$f = \dfrac{12}{360} \times 150$'
      - say: 'Simplify 12 over 360. Divide both by 12, and it is 1 over 30.'
        write: '$= \dfrac{1}{30} \times 150$'
      - say: '150 divided by 30 is 5.'
        write: '$= 5$'
        diagram: {id: p, kind: pie, show: value, sectors: [{label: Physics, value: 5, colour: green}, {label: Others, value: 145, colour: grey}]}
        diagram_do:
          - {id: p, op: angle, part: 'sector:Physics', text: '12°', 'on': 'is 5'}
      - section: 'Check'
        say: 'Check with the forward formula. 5 over 150, times 360, is 1 over 30 of 360, which is 12 degrees. It agrees.'
        write: '$\dfrac{5}{150} \times 360^{\circ} = 12^{\circ}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore 5 students offer Physics, which is answer choice D.'
        write: '$\therefore$ 5 students offer Physics'
        answer: true
    traps:
      A: 'You went for 18. That is 12 per cent of 150, as if the circle were 100 degrees. A pie chart is out of 360: 12 over 360 of 150 is 5.'
      B: 'You went for 15. That is 150 divided by 10, but 12 degrees is 1 over 30 of the circle, not 1 over 10. 1 over 30 of 150 is 5.'
      C: 'You went for 10. Check the fraction: 12 over 360 is 1 over 30, and 150 divided by 30 is 5.'
  48:
    moments:
      - section: 'The question'
        say: '$x$ is the mean and $y$ is the median of these ten numbers. We want $x$ over $y$, to one decimal place. Picture them as ten cards.'
        write: 'Data: $11,\ 12,\ 13,\ 14,\ 15,\ 16,\ 17,\ 18,\ 19,\ 21$'
        doodle: {name: 'custom:1988_q48_a', id: cards, caption: 'ten numbers in order', size: scene, 'on': 'cards'}
      - section: 'Solution'
        say: 'Solution. First the mean. The mean is the sum of the values over $n$, the number of values. Here $n$ is 10.'
        write: 'Solution. $x = \dfrac{\sum x}{n}$, $\ n = 10$'
      - say: 'Add them. A quick way is to pair the cards from the outside in. 11 and 19 make 30, and so do 12 and 18, 13 and 17, 14 and 16. Four 30s are 120, plus 15 is 135, plus 21 is 156.'
        write: '$\sum x = 4 \times 30 + 15 + 21 = 156$'
        doodle_do:
          - {id: cards, op: arrow, part: c1, to_part: c9, 'on': 'pair'}
      - say: 'Substitute, and 156 over 10 is 15.6.'
        write: '$x = \dfrac{156}{10} = 15.6$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '156'}, at: '10[[156]]', text: 'Σx'}
      - section: 'The median'
        say: 'Now the median. The numbers are already in order of size. For ungrouped data the median is the $n$ plus 1 over 2th value.'
        write: 'Median $=$ the $\left(\dfrac{n + 1}{2}\right)$th value'
      - say: '10 plus 1 is 11, and 11 over 2 is 5 and a half. So the median sits halfway between the 5th and 6th values, which are 15 and 16.'
        write: '$\left(\dfrac{10 + 1}{2}\right)$th $= 5\tfrac{1}{2}$th: 5th $= 15$, 6th $= 16$'
        doodle_do:
          - {id: cards, op: stage, stage: 'custom:1988_q48_a2', 'on': 'halfway'}
      - say: 'Take their average. 15 plus 16 is 31, and 31 over 2 is 15.5.'
        write: '$y = \dfrac{15 + 16}{2} = \dfrac{31}{2} = 15.5$'
      - section: 'The ratio'
        say: 'Now divide the mean by the median, which gives 15.6 over 15.5.'
        write: '$\dfrac{x}{y} = \dfrac{15.6}{15.5}$'
        point:
          - {line: 7, kind: move, from: {line: 3, at: '=[[15.6]]'}, at: '15.5[[15.6]]', text: 'mean'}
          - {line: 7, kind: move, from: {line: 6, at: '=[[15.5]]'}, at: '[[15.5]]15.6', text: 'median'}
      - say: '15.6 divided by 15.5 is 1.006 and more. To one decimal place, look at the second decimal digit, and it is 0, so we round down.'
        write: '$= 1.006\ldots$'
      - say: 'So $x$ over $y$ is 1.0, to one decimal place.'
        write: '$\therefore \dfrac{x}{y} = 1.0$ (1 d.p.)'
      - section: 'Check'
        say: 'Check by multiplying back. 15.5 times 1.006 is about 15.59, which is 15.6 to one decimal place, the mean.'
        write: 'Check: $15.5 \times 1.006 \approx 15.59 \approx 15.6$ ✓'
      - section: 'Answer'
        say: 'So $x$ over $y$ is 1.0, which is option D.'
        write: '$\therefore \dfrac{x}{y} = 1.0$'
        answer: true
    traps:
      A: 'You went for 1.6. That looks like the mean, 15.6, with the 15 lost. The ratio 15.6 over 15.5 is only just over 1, so to one decimal place it is 1.0.'
      B: 'You went for 1.2. The mean and the median are almost equal here, 15.6 and 15.5, so their ratio is very close to 1. It rounds to 1.0.'
      C: 'You went for 1.1. 15.6 over 15.5 is 1.006 and more. The second decimal digit is 0, so it rounds down to 1.0, not up to 1.1.'
  49:
    moments:
      - section: 'The question'
        say: 'A frequency table of scores from 0 to 6. We want the mode and the median, in that order. The data are already a frequency table, so here it is.'
        write: 'Mode, median $= ?$'
        diagram:
          id: t
          kind: table
          columns: ['Score (x)', 'f', 'cf']
          rows: [[0, 7, ''], [1, 11, ''], [2, 6, ''], [3, 7, ''], [4, 7, ''], [5, 5, ''], [6, 3, '']]
          'on': 'table'
      - section: 'Solution'
        say: 'Solution. $x$ is the score, and $f$, the frequency, is the number of students with that score. Picture each score as a pile of counters, one per student.'
        write: 'Solution'
        doodle: {name: 'custom:1988_q49_a', id: piles, caption: 'one counter per student', size: scene, 'on': 'pile'}
      - section: 'The mode'
        say: 'The mode is the value with the highest frequency. Down the $f$ column, the highest is 11, the tallest pile, at the score 1. So the mode is 1.'
        write: 'Mode $= 1$ (highest frequency, 11)'
        diagram_do:
          - {id: t, op: highlight, part: 'row:2', text: 'highest f', 'on': 'highest'}
        doodle_do:
          - {id: piles, op: circle, part: s1, text: 'mode', 'on': 'tallest'}
      - section: 'The median'
        say: 'Now the cf column, the cumulative frequency, which is a running total of $f$ down the table. 7, then 18, 24, 31, 38, 43 and 46.'
        diagram_do:
          - {id: t, op: total, part: 'col:2', into: 'col:3', 'on': 'running'}
      - say: 'The last cf is the total frequency, so $N$ is 46.'
        write: '$N = \sum f = 46$'
      - say: '46 is even. So the median is the average of the $N$ over 2th value, the 23rd, and the one after it, the 24th.'
        write: '$\dfrac{N}{2} = \dfrac{46}{2} = 23$: the 23rd and 24th values'
      - say: 'Go down the cf column to the first cf that reaches 24. 18 is too small, but 24 is enough. So the 19th to the 24th values are all 2.'
        write: '23rd and 24th values: $x = 2$ (cf $= 24$)'
        diagram_do:
          - {id: t, op: highlight, part: 'row:3', text: '19th to 24th', 'on': 'enough'}
      - say: 'The average of 2 and 2 is 2.'
        write: '$\therefore$ Median $= \dfrac{2 + 2}{2} = 2$'
        point:
          - {line: 7, kind: highlight, at: '[[=2]]', to: {diagram: t, part: 'row:3'}}
      - section: 'Check'
        say: 'To check, up to the score 1 there are 18 students, fewer than 23. Up to the score 2 there are 24, which covers the 23rd and 24th. So the middle students scored 2.'
        write: 'Check: $18 < 23$ and $24 \geq 24$ ✓'
      - section: 'Answer'
        say: 'Mode first, then median, so 1 and 2. That is option B.'
        write: '$\therefore$ Mode $= 1$, median $= 2$'
        answer: true
    traps:
      A: 'You went for 1 and 3. The mode is right, but 3 is only the middle of the list of scores, 0 to 6. The median is the middle student: the cf column puts the 23rd and 24th at the score 2.'
      C: 'You went for 3 and 3. The mode is the value with the highest frequency: 11 students scored 1. And the cf column puts the 23rd and 24th students at the score 2, so the median is 2.'
      D: 'You went for 0 and 2. The median is right, but the mode is the value with the highest frequency: 11 students scored 1, so the mode is 1.'
  50:
    moments:
      - section: 'The question'
        say: 'Two dice are thrown together. What is the probability of a score of at least 10? "At least" is the word that catches students.'
        write: 'Two dice: $P(\text{score} \ge 10) = ?$'
      - say: 'Solution. Let $E$ be the event that the score is at least 10.'
        write: 'Solution: let $E$ = score at least 10'
      - section: 'The sample space'
        say: 'Draw the outcome table, with the first die down the side, the second across the top, and the score, the sum, in each cell.'
        diagram:
          id: s
          kind: table
          'on': 'outcome table'
          columns: ['+', '1', '2', '3', '4', '5', '6']
          rows: [[1, 2, 3, 4, 5, 6, 7], [2, 3, 4, 5, 6, 7, 8], [3, 4, 5, 6, 7, 8, 9], [4, 5, 6, 7, 8, 9, 10], [5, 6, 7, 8, 9, 10, 11], [6, 7, 8, 9, 10, 11, 12]]
      - say: 'Each die has 6 faces, so the table has 6 times 6 cells. n of $S$, the number of possible outcomes, is 36.'
        write: '$n(S) = 6 \times 6 = 36$'
      - section: 'The favourable outcomes'
        say: '"At least 10" means 10 or more, so a score of 10, 11 or 12.'
        write: 'At least 10: score $= 10,\ 11$ or $12$'
      - say: 'For score 10, we have 4 and 6, 5 and 5, and 6 and 4. Ring them, and that is 3 outcomes.'
        write: 'Score 10: $(4, 6),\ (5, 5),\ (6, 4) \to 3$'
        diagram_do:
          - {id: s, op: highlight, part: 'cell:4,7', 'on': 'Ring'}
          - {id: s, op: highlight, part: 'cell:5,6'}
          - {id: s, op: highlight, part: 'cell:6,5'}
      - say: 'For score 11, we have 5 and 6, and 6 and 5. That is 2 outcomes.'
        write: 'Score 11: $(5, 6),\ (6, 5) \to 2$'
        diagram_do:
          - {id: s, op: highlight, part: 'cell:5,7'}
          - {id: s, op: highlight, part: 'cell:6,6'}
      - say: 'For score 12, there is only 6 and 6. That is 1 outcome.'
        write: 'Score 12: $(6, 6) \to 1$'
        diagram_do:
          - {id: s, op: highlight, part: 'cell:6,7'}
      - say: 'Add them, and n of $E$ is 3 plus 2 plus 1, which is 6.'
        write: '$n(E) = 3 + 2 + 1 = 6$'
      - section: 'The probability'
        say: 'The probability of $E$ is n of $E$ over n of $S$, which is the number of favourable outcomes over the total number of possible outcomes.'
        write: '$P(E) = \dfrac{n(E)}{n(S)}$'
      - say: 'Substitute, and we get 6 over 36.'
        write: '$= \dfrac{6}{36}$'
        point:
          - {line: 10, kind: move, from: {line: 8, at: '= 6'}, at: '36[[6]]', text: 'n(E)'}
          - {line: 10, kind: move, from: {line: 3, at: '= 36'}, at: '[[36]]6', text: 'n(S)'}
      - say: 'Divide the top and the bottom by 6. That gives 1 over 6.'
        write: '$= \dfrac{1}{6}$'
      - section: 'Check'
        say: 'Check with the table. The ringed cells sit in the bottom right corner, 1 in row 4, 2 in row 5 and 3 in row 6. 1 plus 2 plus 3 is 6.'
        write: 'Check: by rows, $1 + 2 + 3 = 6\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the probability of a score of at least 10 is 1 over 6, which is option A.'
        write: '$\therefore P(\text{score} \ge 10) = \dfrac{1}{6}$'
        answer: true
    traps:
      B: 'You went for 1 over 12. That is 3 over 36, a score of exactly 10. "At least 10" also takes in 11 and 12: n of E is 6, and 6 over 36 is 1 over 6.'
      C: 'You went for 5 over 6. That is P of E complement, a score less than 10: the 30 cells not ringed. At least 10 is 6 out of 36, which is 1 over 6.'
      D: 'You went for 11 over 12. That is 1 minus 1 over 12, the probability of not scoring exactly 10. We want 10, 11 or 12: 6 out of 36, which is 1 over 6.'
