# UTME 1988 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1988.yaml. Answers match that file.
# The paper has no question 43.
format_version: 1
exam_year: 1988
lessons:
  1:
    moments:
      - say: 'We''re asked to simplify one and a half, divided by the bottom expression: 2 divided by a quarter of 32.'
        write: '$\dfrac{1\tfrac{1}{2}}{2 \div \tfrac{1}{4} \text{ of } 32}$'
      - say: 'The word "of" means multiply, and it is worked out before the division. So in the bottom, we deal with "a quarter of 32" first.'
        write: 'First the "of": $\tfrac{1}{4} \text{ of } 32 = \tfrac{1}{4} \times 32$'
      - say: 'A quarter of 32 means 32 divided by 4, which is 8.'
        write: '$= 32 \div 4 = 8$'
      - say: 'Now go back to the bottom of the big fraction. The quarter of 32 becomes the 8 we just found, so the bottom is 2 divided by 8.'
        write: 'Bottom: $2 \div \tfrac{1}{4} \text{ of } 32 = 2 \div 8$'
        point:
          - {line: 2, kind: arrow, at: '= 8', text: 'from here'}
      - say: '2 divided by 8 is 2 over 8. Divide the top and bottom by 2, and that is 1 over 4, a quarter.'
        write: '$= \dfrac{2}{8} = \dfrac{1}{4}$'
      - say: 'So the whole fraction is one and a half on top, divided by the quarter we just found.'
        write: 'So the fraction $= 1\tfrac{1}{2} \div \dfrac{1}{4}$'
      - say: 'Let''s turn one and a half into an improper fraction. One whole is 2 over 2, and adding 1 over 2 makes 3 over 2.'
        write: '$1\tfrac{1}{2} = \dfrac{2}{2} + \dfrac{1}{2} = \dfrac{3}{2}$'
      - say: 'Put that 3 over 2 in place of the one and a half.'
        write: '$1\tfrac{1}{2} \div \dfrac{1}{4} = \dfrac{3}{2} \div \dfrac{1}{4}$'
        point:
          - {line: 6, kind: arrow, text: 'swap in'}
      - say: 'Dividing by a fraction means multiplying by its reciprocal, the fraction turned upside down. 1 over 4 turned over is 4 over 1, which is just 4.'
        write: '$= \dfrac{3}{2} \times 4$'
      - say: '3 times 4 is 12, so we have 12 over 2.'
        write: '$= \dfrac{12}{2}$'
      - say: '12 divided by 2 is 6.'
        write: '$= 6$'
      - say: 'That makes sense: dividing by a quarter is the same as multiplying by 4, so the answer is bigger than the top. The answer is 6, which is answer choice C.'
        write: 'Answer: $6$'
        answer: true
    traps:
      A: 'You went for 3 over 256. That comes from working the bottom strictly left to right, 2 divided by a quarter is 8, then 8 times 32 is 256, which makes the answer tiny. Do the "of" first: a quarter of 32 is 8, and the bottom is 2 divided by 8, a quarter.'
      B: 'You went for 3 over 32. That comes from multiplying 2 by 8 instead of dividing: 2 times 8 is 16, and 3 over 2 divided by 16 is 3 over 32. The bottom is 2 divided by 8, which is 1 over 4.'
      D: 'You went for 85. That''s far too big. The bottom works out to 1 over 4, and 3 over 2 divided by 1 over 4 is 3 over 2 times 4, which is 6.'
  2:
    moments:
      - say: 'This question hides two small jobs. $x$ is the sum of the prime numbers between 1 and 6, $y$ is the H.C.F. of 6, 9 and 15, and we want $x$ times $y$.'
        write: '$x = \text{sum of primes between 1 and 6}, \quad y = \text{H.C.F. of } 6,\ 9,\ 15$'
      - say: 'First, $x$. What is a prime number? It''s a whole number with exactly two factors, 1 and itself. So 1 is not prime: it has only one factor.'
        write: 'Prime: exactly two factors, $1$ and itself'
      - say: 'Check each number between 1 and 6. 2, 3 and 5 are prime. 4 is not, because 4 is 2 times 2.'
        write: 'Primes between 1 and 6: $2,\ 3,\ 5 \quad (4 = 2 \times 2)$'
      - say: 'Now add those three primes. 2 plus 3 is 5, and 5 plus 5 is 10.'
        write: '$x = 2 + 3 + 5 = 10$'
      - say: 'Next, $y$. The H.C.F., the highest common factor, is the biggest number that divides all three. Let''s break each one into prime factors. 6 is 2 times 3.'
        write: '$6 = 2 \times 3$'
      - say: '9 is 3 times 3.'
        write: '$9 = 3 \times 3$'
      - say: 'And 15 is 3 times 5.'
        write: '$15 = 3 \times 5$'
      - say: 'Look back at those three lines. The only factor that appears in all of them is 3. So $y$ is 3.'
        write: 'Common factor: $y = 3$'
        point:
          - {line: 4, kind: circle, at: '× 3', text: 'in all three'}
          - {line: 6, kind: circle, at: '3 ×'}
      - say: 'Now multiply the $x$ and the $y$ we found. 10 times 3 is 30.'
        write: '$xy = 10 \times 3 = 30$'
        point:
          - {line: 3, kind: arrow, at: '= 10', text: 'x'}
          - {line: 7, kind: arrow, at: 'y = 3', text: 'y'}
      - say: 'So the product is 30, which is answer choice B.'
        write: 'Answer: $xy = 30$'
        answer: true
    traps:
      A: 'You went for 27. That''s 9 times 3, as if the primes added to 9. Check the list again: the primes are 2, 3 and 5, and they add to 10.'
      C: 'You went for 33. That counts 1 as a prime, making $x$ equal to 11. But 1 has only one factor, so it''s not prime, and $x$ is 10.'
      D: 'You went for 90. That uses 9 for $y$, but 9 does not divide 6 or 15. The only factor common to 6, 9 and 15 is 3, and 10 times 3 is 30.'
  3:
    moments:
      - say: 'A mass of 5.0 grams was weighed by Tunde as 5.1 grams. We want the percentage error.'
        write: 'True mass $= 5.0$ g, measured mass $= 5.1$ g'
      - say: 'First, the error. It''s the difference between what was measured and what is true.'
        write: 'Error $= 5.1 - 5.0$'
      - say: '5.1 minus 5.0 is 0.1 of a gram.'
        write: '$= 0.1$ g'
      - say: 'Percentage error compares that error with the true value, then turns it into a percentage by multiplying by 100.'
        write: 'Percentage error $= \dfrac{\text{error}}{\text{true value}} \times 100\%$'
      - say: 'Now put in the error we just found, 0.1, and the true value, 5.0.'
        write: '$= \dfrac{0.1}{5.0} \times 100\%$'
        point:
          - {line: 3, kind: box, text: 'the rule'}
          - {line: 2, kind: arrow, at: '0.1', text: 'error'}
      - say: 'Let''s clear the decimal. Multiply the top and bottom of the fraction by 10: 0.1 becomes 1, and 5.0 becomes 50.'
        write: '$= \dfrac{1}{50} \times 100\%$'
      - say: '1 over 50 is 0.02.'
        write: '$= 0.02 \times 100\%$'
      - say: '0.02 times 100 moves the decimal point two places to the right, which gives 2.'
        write: '$= 2\%$'
      - say: 'Does that make sense? A slip of 0.1 of a gram on 5 grams is a small slip, so a small percentage is right.'
      - say: 'So the percentage error is 2, which is answer choice B.'
        write: 'Percentage error $= 2\%$'
        answer: true
    traps:
      A: 'You went for 20. That comes from dividing 0.1 by 0.5 instead of by 5.0. The true mass is 5.0 grams, so it''s 0.1 over 5.0, which is 0.02, and that is 2%.'
      C: 'You went for 0.02. That''s the error as a fraction of the true value, before it becomes a percentage. Multiply by 100 to get 2%.'
      D: 'You went for 0.2. The decimal point has slipped: 0.1 over 5.0 is 0.02, not 0.2, and 0.02 times 100 is 2%.'
  4:
    moments:
      - say: 'We need 0.24633 divided by 0.0306, correct to one decimal place.'
        write: '$\dfrac{0.24633}{0.0306}$'
      - say: 'Dividing by a small decimal is awkward, so let''s make the bottom a whole number. Multiplying the top and the bottom by the same number, 10,000, doesn''t change the value.'
        write: '$= \dfrac{0.24633 \times 10000}{0.0306 \times 10000}$'
      - say: 'Multiplying by 10,000 moves each decimal point four places to the right. The top becomes 2463.3, and the bottom becomes 306.'
        write: '$= \dfrac{2463.3}{306}$'
      - say: 'Now divide. How many 306s fit into 2463.3? Let''s try 8. 306 times 8 is 2448.'
        write: 'Try 8: $306 \times 8 = 2448$'
      - say: '2448 is just under 2463.3, so 8 fits. Take it away: 2463.3 minus 2448 leaves 15.3.'
        write: 'Remainder: $2463.3 - 2448 = 15.3$'
      - say: 'How many 306s are in that remainder of 15.3? 306 times 5 is 1530, so 306 times 0.05 is exactly 15.3.'
        write: '$306 \times 0.05 = 15.3$'
      - say: 'So 306 goes in 8 times, and then 0.05 more. The answer is exactly 8.05.'
        write: 'So $\dfrac{2463.3}{306} = 8 + 0.05 = 8.05$'
        point:
          - {line: 3, kind: arrow, at: 'Try 8', text: '8 times'}
          - {line: 5, kind: arrow, at: '0.05', text: 'then 0.05'}
      - say: 'Now round to one decimal place. Look at the second decimal digit: it''s 5. The rule is 5 or more rounds up, so the 0 in the first decimal place goes up to 1.'
        write: '$8.05 \approx 8.1$ to one decimal place'
      - say: 'Let''s check by multiplying back. 0.0306 times 8 is 0.2448, and 0.0306 times 0.05 is 0.00153. Together that''s 0.24633, the number we started with.'
        write: 'Check: $0.0306 \times 8.05 = 0.2448 + 0.00153 = 0.24633$'
      - say: 'So the answer is 8.1, which is answer choice D.'
        write: 'Answer: $8.1$'
        answer: true
    traps:
      A: 'You went for 0.8. The decimal point has slipped by a factor of ten. After moving the point four places in both numbers, the division is 2463.3 over 306, which is about 8, not 0.8.'
      B: 'You went for 1.8. That''s far too small: 306 goes into 2463.3 eight times, since 306 times 8 is 2448. The answer is 8.05, which rounds to 8.1.'
      C: 'You went for 8.0. That chops off the 5 instead of rounding. When the next digit is 5 or more, you round up, so 8.05 becomes 8.1.'
  5:
    moments:
      - say: 'Taiwo and Kehinde own a store in the ratio 11 to 9. Kehinde sells two thirds of her share to Taiwo for ₦720. We want the value of the whole store.'
        write: 'Taiwo : Kehinde $= 11 : 9$'
      - say: 'Here''s the plan. The ₦720 tells us Kehinde''s share, and her share, through the ratio, tells us the whole store.'
      - say: 'Let''s call Kehinde''s share $K$. Two thirds of it is worth ₦720.'
        write: '$\tfrac{2}{3} \times K = 720$'
      - say: 'To get $K$ by itself, multiply both sides by 3 over 2, which is two thirds turned upside down.'
        write: '$K = 720 \times \dfrac{3}{2}$'
      - say: '720 divided by 2 is 360, and 360 times 3 is 1080. So Kehinde''s share is ₦1,080.'
        write: '$K = 360 \times 3 = 1080$'
      - say: 'Now the ratio. 11 plus 9 is 20, so the store is split into 20 equal parts, and Kehinde owns 9 of them.'
        write: 'Total parts: $11 + 9 = 20$'
      - say: 'Her 9 parts are worth the ₦1,080 we just found. So one part is 1080 divided by 9, which is 120.'
        write: 'One part $= 1080 \div 9 = 120$'
        point:
          - {line: 4, kind: arrow, at: '1080', text: 'her share'}
      - say: 'The whole store is 20 parts. 20 times 120 is 2400.'
        write: 'Store $= 20 \times 120 = 2400$'
        point:
          - {line: 5, kind: arrow, at: '= 20', text: 'all parts'}
      - say: 'Let''s check. Taiwo''s 11 parts are 11 times 120, which is 1320. And 1320 plus Kehinde''s 1080 is 2400.'
        write: 'Check: $11 \times 120 + 1080 = 1320 + 1080 = 2400$'
      - say: 'So the store is worth ₦2,400, which is answer choice B.'
        write: 'Store value: ₦2,400.00'
        answer: true
    traps:
      A: 'You went for ₦1,080. That''s Kehinde''s share, found halfway through. She owns 9 of the 20 parts, so keep going to reach the whole store.'
      C: 'You went for ₦3,000. That would make one part ₦150. Kehinde''s 9 parts are ₦1,080, so one part is 1080 divided by 9, which is ₦120, and 20 parts make ₦2,400.'
      D: 'You went for ₦3,600. That''s 720 times 5, as if the ₦720 were a single part. The ₦720 is two thirds of Kehinde''s share, so her share is ₦1,080; that is 9 of the 20 parts, and the store is ₦2,400.'
  6:
    moments:
      - say: 'A basket has green, black and blue balls in the ratio 5 to 2 to 1, and there are 10 blue balls. We remove 10 green and 10 black, and want the new ratio.'
        write: 'green : black : blue $= 5 : 2 : 1$, with blue $= 10$'
      - say: 'We can''t take balls away from a ratio directly. So first we find the actual number of balls of each colour.'
      - say: 'Blue is 1 part, and there are 10 blue balls. So one part is 10 balls.'
        write: 'One part $= 10$ balls'
      - say: 'Green is 5 parts. 5 times 10 is 50.'
        write: 'Green $= 5 \times 10 = 50$'
        point:
          - {line: 2, kind: arrow, text: 'one part'}
      - say: 'Black is 2 parts. 2 times 10 is 20.'
        write: 'Black $= 2 \times 10 = 20$'
      - say: 'Now take 10 green balls away from the 50 we found. 50 minus 10 is 40.'
        write: 'Green left $= 50 - 10 = 40$'
      - say: 'And take 10 black away from the 20. 20 minus 10 is 10.'
        write: 'Black left $= 20 - 10 = 10$'
      - say: 'No blue balls were removed, so there are still 10 blue.'
        write: 'Blue left $= 10$'
      - say: 'So the new ratio is 40 to 10 to 10.'
        write: 'New ratio $= 40 : 10 : 10$'
        point:
          - {line: 5, kind: arrow, at: '= 40', text: 'green'}
          - {line: 6, kind: arrow, at: '= 10', text: 'black'}
      - say: 'Every number divides by 10. 40 divided by 10 is 4, and 10 divided by 10 is 1.'
        write: '$= 4 : 1 : 1$'
      - say: 'So the new ratio is 4 to 1 to 1, which is answer choice D.'
        write: 'Answer: $4 : 1 : 1$'
        answer: true
    traps:
      A: 'You went for 1 to 1 to 1. That would need equal numbers of each colour. After the removal there are 40 green but only 10 black and 10 blue, so it''s 4 to 1 to 1.'
      B: 'You went for 4 to 2 to 1. That takes 10 away from the green but forgets the black. The black balls drop from 20 to 10 as well, so the ratio is 40 to 10 to 10, which is 4 to 1 to 1.'
      C: 'You went for 5 to 1 to 1. That removes the black balls but keeps all 50 green. The green drop to 40 as well, so the ratio is 4 to 1 to 1.'
  7:
    moments:
      - say: 'A taxpayer gets 1 over 8 of his income tax-free, and pays 20% on the rest. His tax is ₦490. We want his income.'
        write: 'Tax-free: $\tfrac{1}{8}$ of income; tax: $20\%$ of the rest $= 490$'
      - say: 'If 1 over 8 is free, what fraction is taxed? The whole income is 8 over 8, and 8 over 8 minus 1 over 8 is 7 over 8.'
        write: 'Taxed part $= \dfrac{8}{8} - \dfrac{1}{8} = \dfrac{7}{8}$ of income'
      - say: 'Here''s the plan: use the tax to find the taxed part, then use that fraction to find the whole income.'
      - say: 'He pays 20% of the taxed part, and that comes to ₦490. 20% is 0.2.'
        write: '$0.2 \times \text{taxed part} = 490$'
        point:
          - {line: 0, kind: highlight, at: '20% of the rest = 490', text: 'given'}
      - say: 'Divide both sides by 0.2.'
        write: 'Taxed part $= \dfrac{490}{0.2}$'
      - say: 'Dividing by 0.2 is the same as multiplying by 5, since 0.2 is 1 over 5. 490 times 5 is 2450.'
        write: '$= 490 \times 5 = 2450$'
      - say: 'Now, that ₦2,450 is the 7 over 8 of his income we found at the start.'
        write: '$\dfrac{7}{8} \times \text{income} = 2450$'
        point:
          - {line: 1, kind: arrow, text: 'taxed part'}
          - {line: 5, kind: arrow, at: '2450', text: 'from here'}
      - say: 'To get the income by itself, multiply both sides by 8 over 7.'
        write: 'Income $= 2450 \times \dfrac{8}{7}$'
      - say: '2450 divided by 7 is 350.'
        write: '$= 350 \times 8$'
      - say: '350 times 8 is 2800.'
        write: '$= 2800$'
      - say: 'Let''s check. 7 over 8 of 2800 is 2450, and 20% of 2450 is 490. That matches the tax.'
        write: 'Check: $\tfrac{7}{8} \times 2800 = 2450, \quad 0.2 \times 2450 = 490$'
      - say: 'So his income is ₦2,800, which is answer choice C.'
        write: 'Income: ₦2,800.00'
        answer: true
    traps:
      A: 'You went for ₦560. That''s 490 times 8 over 7, which skips the 20% step. First find the taxed part, 490 divided by 0.2, which is ₦2,450, and then multiply by 8 over 7.'
      B: 'You went for ₦2,450. That''s the taxed part, 7 over 8 of his income. Multiply by 8 over 7 to bring back the tax-free part: ₦2,800.'
      D: 'You went for ₦3,920. That''s 490 times 8, as if the tax were 1 over 8 of the income. The tax is 20% of 7 over 8 of the income, which leads to ₦2,800.'
  8:
    moments:
      - say: 'We need 8 to the power one third, times 5 to the power two thirds, all over 10 to the power two thirds.'
        write: '$\dfrac{8^{\frac{1}{3}} \times 5^{\frac{2}{3}}}{10^{\frac{2}{3}}}$'
      - say: 'The trick with fractional powers is to write every number in prime factors, so the powers can be combined. Start with 8, which is 2 cubed.'
        write: '$8^{\frac{1}{3}} = (2^{3})^{\frac{1}{3}}$'
      - say: 'A power of a power multiplies the indices. 3 times one third is 1, so this is 2 to the power 1, which is just 2.'
        write: '$= 2^{3 \times \frac{1}{3}} = 2^{1} = 2$'
      - say: 'Now the bottom. 10 is 2 times 5, and the power two thirds goes onto each factor.'
        write: '$10^{\frac{2}{3}} = (2 \times 5)^{\frac{2}{3}} = 2^{\frac{2}{3}} \times 5^{\frac{2}{3}}$'
      - say: 'Now rebuild the fraction: the 2 we found goes on top, and the split-up 10 goes on the bottom.'
        write: 'So the expression $= \dfrac{2 \times 5^{\frac{2}{3}}}{2^{\frac{2}{3}} \times 5^{\frac{2}{3}}}$'
        point:
          - {line: 2, kind: arrow, text: 'top'}
          - {line: 3, kind: arrow, text: 'bottom'}
      - say: '5 to the two thirds is on the top and on the bottom, so it cancels.'
        write: '$= \dfrac{2}{2^{\frac{2}{3}}}$'
      - say: 'The 2 on top is 2 to the power 1. When we divide powers of the same base, we subtract the indices.'
        write: '$= \dfrac{2^{1}}{2^{\frac{2}{3}}} = 2^{1 - \frac{2}{3}}$'
      - say: 'Write the 1 as 3 over 3. Then 3 over 3 minus 2 over 3 is 1 over 3.'
        write: '$= 2^{\frac{3}{3} - \frac{2}{3}} = 2^{\frac{1}{3}}$'
      - say: 'A power of one third means a cube root. So 2 to the one third is the cube root of 2.'
        write: '$= \sqrt[3]{2}$'
      - say: 'So the expression simplifies to the cube root of 2, which is answer choice C.'
        write: 'Answer: $\sqrt[3]{2}$'
        answer: true
    traps:
      A: 'You went for 2 over 5. The 5s don''t survive: 5 to the two thirds appears on top and bottom and cancels. What''s left is 2 over 2 to the two thirds, which is the cube root of 2.'
      B: 'You went for 5 over 3. That mixes the numbers up with the indices. Break 10 into 2 times 5, cancel the fives, and you''re left with 2 to the power one third.'
      D: 'You went for the cube root of 5. The powers of 5 cancel completely, so no 5 can be left in the answer. It''s the cube root of 2.'
  9:
    moments:
      - say: 'We''re given log 2 is 0.3010 and log 3 is 0.4771, and we want log 4.5 without tables.'
        write: '$\log 2 = 0.3010, \quad \log 3 = 0.4771$'
      - say: 'The plan is to build 4.5 out of 2s and 3s only, because those are the only logs we know.'
      - say: '4.5 is 9 divided by 2, so 4.5 is 9 over 2.'
        write: '$4.5 = \dfrac{9}{2}$'
      - say: 'And 9 is 3 squared.'
        write: '$= \dfrac{3^{2}}{2}$'
      - say: 'Now take logs. The log of a quotient is the log of the top minus the log of the bottom.'
        write: '$\log 4.5 = \log 3^{2} - \log 2$'
      - say: 'The log of a power brings the power down in front. So log of 3 squared is 2 log 3.'
        write: '$= 2\log 3 - \log 2$'
      - say: 'Now put in the values we were given at the start.'
        write: '$= 2(0.4771) - 0.3010$'
        point:
          - {line: 0, kind: arrow, text: 'given'}
      - say: '2 times 0.4771 is 0.9542.'
        write: '$= 0.9542 - 0.3010$'
      - say: '0.9542 minus 0.3010 is 0.6532.'
        write: '$= 0.6532$'
      - say: 'That makes sense: 4.5 is between 1 and 10, so its log lies between 0 and 1. So log 4.5 is 0.6532, which is answer choice C.'
        write: 'Answer: $\log_{10} 4.5 = 0.6532$'
        answer: true
    traps:
      A: 'You went for 0.3010. That''s log 2, one of the given values, not log 4.5. Build 4.5 as 9 over 2 and use both logs.'
      B: 'You went for 0.4771. That''s log 3 on its own. 4.5 is 3 squared over 2, so the answer is 2 log 3 minus log 2.'
      D: 'You went for 0.9542. That''s log 9, which is 2 log 3. You still need to subtract log 2, because 4.5 is 9 divided by 2.'
  10:
    moments:
      - say: 'We want $m$ so that $m$ plus root 3, times 1 minus root 3 all squared, equals 6 minus 2 root 3.'
        write: '$(m + \sqrt{3})(1 - \sqrt{3})^{2} = 6 - 2\sqrt{3}$'
      - say: 'The plan: expand the left side, then match the whole numbers and the root 3 parts. First the square. A squared bracket has three terms: the first squared, twice the product, and the last squared.'
        write: '$(1 - \sqrt{3})^{2} = 1^{2} - 2(1)(\sqrt{3}) + (\sqrt{3})^{2}$'
      - say: '1 squared is 1. Twice 1 times root 3 is 2 root 3. And root 3 squared is 3.'
        write: '$= 1 - 2\sqrt{3} + 3$'
      - say: '1 plus 3 is 4.'
        write: '$= 4 - 2\sqrt{3}$'
      - say: 'Now put that back into the left side, in place of the square.'
        write: 'Left side $= (m + \sqrt{3})(4 - 2\sqrt{3})$'
        point:
          - {line: 3, kind: arrow, text: 'swap in'}
      - say: 'Multiply each term of the first bracket into the second. $m$ times 4 is $4m$, and $m$ times negative 2 root 3 is negative $2m$ root 3.'
        write: '$= 4m - 2m\sqrt{3} + \sqrt{3}(4 - 2\sqrt{3})$'
      - say: 'Now root 3 times 4 is 4 root 3, and root 3 times negative 2 root 3 is negative 2 times 3, which is negative 6.'
        write: '$= 4m - 2m\sqrt{3} + 4\sqrt{3} - 6$'
      - say: 'Group the whole numbers together, and the root 3 terms together.'
        write: '$= (4m - 6) + (4 - 2m)\sqrt{3}$'
      - say: 'This must equal the right side, 6 minus 2 root 3. So the whole numbers must match, and the root 3 parts must match.'
        write: '$(4m - 6) + (4 - 2m)\sqrt{3} = 6 - 2\sqrt{3}$'
      - say: 'Match the whole numbers: $4m$ minus 6 equals 6.'
        write: 'Whole numbers: $4m - 6 = 6$'
        point:
          - {line: 8, kind: circle, at: '(4m − 6)', text: 'whole part'}
      - say: 'Add 6 to both sides. 6 plus 6 is 12.'
        write: '$4m = 12$'
      - say: 'Divide both sides by 4. 12 divided by 4 is 3.'
        write: '$m = 3$'
      - say: 'Let''s check with the root 3 parts. 4 minus 2 times 3 is 4 minus 6, which is negative 2. That matches the negative 2 root 3 on the right.'
        write: 'Root 3 parts: $4 - 2(3) = 4 - 6 = -2$'
      - say: 'Both parts agree, so $m$ is 3, which is answer choice C.'
        write: 'Answer: $m = 3$'
        answer: true
    traps:
      A: 'You went for 1. Put it back in: 4 times 1 minus 6 is negative 2, not 6. Expand the square fully to 4 minus 2 root 3, then match the parts to get $m = 3$.'
      B: 'You went for 2. With $m = 2$, the whole-number part is 4 times 2 minus 6, which is 2, not 6. Matching the parts gives $m = 3$.'
      D: 'You went for 4. With $m = 4$, the whole-number part is 16 minus 6, which is 10, not 6. Matching the parts gives $m = 3$.'
  11:
    moments:
      - say: 'An 800-page book is 18 millimetres thick. We want the thickness of one leaf, in metres, in standard form.'
        write: '800 pages $= 18$ mm thick'
