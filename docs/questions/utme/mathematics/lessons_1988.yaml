      - say: 'How do we undo a cube root? We cube both sides.'
        write: '$y = \left(\dfrac{2}{3}\right)^{3}$'
      - say: '2 cubed is 8, and 3 cubed is 27.'
        write: '$= \dfrac{2^{3}}{3^{3}} = \dfrac{8}{27}$'
