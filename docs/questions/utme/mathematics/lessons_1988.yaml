# UTME 1988 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1988.yaml. Answers match that file.
# The paper has no question 43.
format_version: 1
exam_year: 1988
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'This one is decided by the word "of". Work the bottom from left to right and you get a tiny answer, but follow BODMAS and you get a whole number.'
        write: 'Simplify $\dfrac{1\tfrac{1}{2}}{2 \div \tfrac{1}{4} \text{ of } 32}$'
      - say: 'BODMAS stands for Brackets, Of, Division, Multiplication, Addition, Subtraction. In the denominator, "of" comes before the division.'
        write: 'Solution (BODMAS: B, O, D, M, A, S)'
      - section: 'Denominator: O for of'
        say: '"Of" means multiply. So a quarter of 32 is a quarter times 32.'
        write: '$\dfrac{1}{4} \text{ of } 32 = \dfrac{1}{4} \times 32 = 8$'
      - section: 'Denominator: D for division'
        say: 'Now the division. The denominator is 2 divided by the 8 we just found.'
        write: 'Denominator $= 2 \div 8 = \dfrac{2}{8} = \dfrac{1}{4}$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '= 8'}, at: '÷ 8', text: 'of first'}
      - section: 'The whole fraction'
        say: 'So the whole fraction is one and a half divided by a quarter. Picture one and a half pies, and ask how many quarters they make.'
        doodle: {name: 'custom:1988_q01_a', id: pies, caption: '1½ shared into quarters'}
        write: '$\therefore$ Expression $= 1\tfrac{1}{2} \div \dfrac{1}{4}$'
      - say: 'Change the mixed number to an improper fraction. 1 times 2 is 2, plus 1 is 3. So one and a half is 3 over 2.'
        write: '$= \dfrac{3}{2} \div \dfrac{1}{4}$'
      - say: 'To divide by a fraction, multiply by its reciprocal. A quarter turned upside down is 4 over 1. Cut the pies into quarters.'
        doodle_do: [{id: pies, op: stage, stage: 'custom:1988_q01_a2'}]
        write: '$= \dfrac{3}{2} \times \dfrac{4}{1}$'
      - say: 'Cancel first, because 2 goes into 4 twice. So it is 3 times 2, which is 6.'
        doodle_do: [{id: pies, op: label, part: cuts, text: '6 quarters'}]
        write: '$= 3 \times 2 = 6$'
      - section: 'Check'
        say: 'To check, 6 quarters make 6 over 4, which is one and a half. So one and a half holds a quarter exactly 6 times.'
        write: 'Check: $6 \times \dfrac{1}{4} = \dfrac{6}{4} = 1\tfrac{1}{2} \ \checkmark$'
      - section: 'Answer'
        say: 'So the expression simplifies to 6, which is option C.'
        write: '$\therefore$ Answer $= 6$'
        answer: true
    traps:
      A: 'You went for 3 over 256. A tiny answer like that comes from ignoring BODMAS in the denominator, for example 2 divided by a quarter first, which is 8, and then times 32. That makes the denominator huge. BODMAS does "of" first: a quarter of 32 is 8, and 2 divided by 8 is a quarter.'
      B: 'You went for 3 over 32. That comes from 2 times 8 instead of 2 divided by 8. The denominator is 2 divided by 8, which is a quarter, and 3 over 2 divided by a quarter is 6.'
      D: 'You went for 85. That is far too big. The denominator is a quarter, and 3 over 2 times 4 is 6.'
  2:
    moments:
      - section: 'The question'
        say: 'Two small jobs. $x$ is the sum of the prime numbers between 1 and 6, and $y$ is the H.C.F. of 6, 9 and 15. Then we multiply them.'
        write: '$x =$ sum of primes between 1 and 6; $\ y =$ H.C.F. of $6,\ 9,\ 15$; $\ xy = ?$'
      - section: 'Solution'
        say: 'Solution. A prime number has exactly two factors, 1 and itself. So 1 is not prime, because it has only one factor.'
        write: 'Solution: a prime has exactly two factors, $1$ and itself'
      - say: 'The numbers between 1 and 6 are 2, 3, 4 and 5. 2, 3 and 5 are prime. 4 is not, because 4 is 2 times 2.'
        write: 'Primes between 1 and 6: $2,\ 3,\ 5$ $\ (4 = 2 \times 2)$'
      - say: 'Add them. 2 plus 3 is 5, and 5 plus 5 is 10.'
        write: '$\therefore x = 2 + 3 + 5 = 10$'
      - section: 'The H.C.F.'
        say: 'Now the H.C.F. of 6, 9 and 15. Set them side by side and divide by a prime that goes into all three. 2 does not go into 9, but 3 goes into all three.'
        write: 'H.C.F. of $6,\ 9,\ 15$'
        diagram: {id: L, kind: ladder, mode: lcm, numbers: [6, 9, 15], find: hcf}
      - say: '6 divided by 3 is 2, 9 divided by 3 is 3, and 15 divided by 3 is 5. 2, 3 and 5 share no prime factor, so we stop.'
        write: '$3\,|\,6,\ 9,\ 15 \ \Rightarrow\ 2,\ 3,\ 5$'
        diagram_do:
          - {id: L, op: step}
          - {id: L, op: read}
      - say: 'The H.C.F. is the product of the common divisors, and there is only one, which is 3.'
        write: '$\therefore y = 3$'
      - section: 'The product'
        say: 'Now multiply $x$ and $y$. 10 times 3 is 30.'
        write: '$xy = 10 \times 3 = 30$'
      - section: 'Check'
        say: 'To check, 3 divides 6, 9 and 15 exactly, and no bigger number divides all three, since 9 has only 1, 3 and 9 as factors and 9 does not go into 6.'
        write: 'Check: $6 \div 3 = 2,\ 9 \div 3 = 3,\ 15 \div 3 = 5\ \checkmark$'
      - say: 'Therefore the product of $x$ and $y$ is 30, which is option B.'
        write: '$\therefore xy = 30$'
        answer: true
    traps:
      A: 'You went for 27. That is 9 times 3, as if the primes added to 9. The primes between 1 and 6 are 2, 3 and 5, and they add to 10.'
      C: 'You went for 33. That counts 1 as a prime, making $x$ equal to 11. But 1 has only one factor, so it is not prime, and $x$ is 10.'
      D: 'You went for 90. That uses 9 for $y$, but 9 does not divide 6 or 15. The H.C.F. of 6, 9 and 15 is 3, and 10 times 3 is 30.'
  3:
    moments:
      - section: 'The question'
        say: 'Tunde''s scale reads 5.1 grams for salt that is really 5.0 grams. The options are 20, 2, 0.2 and 0.02, and one formula, with careful decimals, will choose.'
        write: 'Actual mass $= 5.0$ g, measured mass $= 5.1$ g. Percentage error $= ?$'
      - say: 'We write the formula first. Percentage error is the error over the actual value, times 100 percent.'
        write: 'Solution'
      - say: 'Here is the formula. The error is always compared with the actual value.'
        write: 'Percentage error $= \dfrac{\text{error}}{\text{actual value}} \times 100\%$'
      - section: 'Find the error'
        say: 'The scale says too much. The error is the measured value minus the actual value, so 5.1 minus 5.0, which is 0.1 gram.'
        write: 'Error $= 5.1 - 5.0 = 0.1$ g'
      - section: 'Substitute'
        say: 'Substitute, with the error, 0.1, on top, and the actual value, 5.0, underneath.'
        write: 'Percentage error $= \dfrac{0.1}{5.0} \times 100\%$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= 0.1'}, at: '5.0[[0.1]]', text: 'error'}
      - say: 'Clear the decimals by multiplying the top and bottom of the fraction by 10. 0.1 becomes 1, and 5.0 becomes 50.'
        write: '$= \dfrac{1}{50} \times 100\%$'
      - say: 'Cancel, because 50 goes into 100 twice. So it is 1 times 2, which is 2 percent.'
        write: '$= 2\%$'
      - say: 'Therefore the percentage error is 2 percent.'
        write: '$\therefore$ Percentage error $= 2\%$'
      - section: 'Check'
        say: 'To check, 1 percent of 5.0 grams is 0.05 gram, and the error, 0.1, is 2 times 0.05. So the error is 2 percent.'
        write: 'Check: $1\%$ of $5.0 = 0.05$; $0.1 = 2 \times 0.05 \ \checkmark$'
      - section: 'Answer'
        say: 'So the percentage error is 2, which is option B.'
        write: '$\therefore$ Percentage error $= 2\%$'
        answer: true
    traps:
      A: 'You went for 20. That comes from dividing 0.1 by 0.5 instead of 5.0. The actual mass is 5.0 grams: 0.1 over 5.0 times 100 percent is 2 percent.'
      C: 'You went for 0.02. That is the error over the actual value, before multiplying by 100 percent. Multiply by 100 to get 2 percent.'
      D: 'You went for 0.2. The decimal point has slipped: 0.1 over 5.0 is 0.02, not 0.2, and 0.02 times 100 percent is 2 percent.'
  4:
    moments:
      - section: 'The question'
        say: 'Two options are 8.0 and 8.1. The exact answer sits exactly on the borderline, so the rounding rule must be applied with care.'
        write: 'Find $\dfrac{0.24633}{0.0306}$ correct to 1 d.p.'
      - say: 'We make the divisor a whole number first, then do long division, and round at the end.'
        write: 'Solution'
      - section: 'Clear the decimals'
        say: 'Multiply the numerator and the denominator by 10,000. The value does not change. Both decimal points move 4 places to the right together.'
        write: '$\dfrac{0.24633}{0.0306} = \dfrac{0.24633 \times 10000}{0.0306 \times 10000}$'
      - say: 'The numerator becomes 2,463.3 and the denominator becomes 306.'
        write: '$= \dfrac{2463.3}{306}$'
      - section: 'Long division'
        say: 'Now 306 into 2,463. 306 times 8 is 2,448, which fits. Write 8 above. 2,463 minus 2,448 leaves 15.'
        write: '$306 \times 8 = 2448$; $\ 2463 - 2448 = 15$'
      - say: 'Put the decimal point in the answer, and bring down the 3 to make 153. 306 does not go into 153, so write 0 after the point.'
        write: 'Bring down 3: $153 < 306$, so $8.0$'
      - say: 'Bring down a 0 to make 1,530. 306 times 5 is 1,530 exactly, with nothing left. Write 5.'
        write: 'Bring down 0: $306 \times 5 = 1530$, remainder $0$'
      - say: 'So the division is exactly 8.05.'
        write: '$\dfrac{2463.3}{306} = 8.05$'
      - section: 'Round to 1 d.p.'
        say: 'For one decimal place, cut after the first decimal digit, so 8.0, then 5. The next digit is 5, and 5 or more means add 1. So 8.0 becomes 8.1.'
        write: '$\therefore 8.0|5 \approx 8.1$ (1 d.p.)'
      - section: 'Check'
        say: 'Check by multiplying back 0.0306 times 8.05. 0.0306 times 8 is 0.2448, and 0.0306 times 0.05 is 0.00153. Together that is 0.24633.'
        write: 'Check: $0.0306 \times 8.05 = 0.2448 + 0.00153 = 0.24633 \ \checkmark$'
      - section: 'Answer'
        say: 'So the answer, correct to one decimal place, is 8.1, which is option D.'
        write: '$\therefore$ Answer $= 8.1$ (1 d.p.)'
        answer: true
    traps:
      A: 'You went for 0.8. The decimal point has slipped by a factor of ten. After moving both points 4 places, the division is 2,463.3 over 306, which is about 8.'
      B: 'You went for 1.8. That is far too small: 306 goes into 2,463 eight times, since 306 times 8 is 2,448. The answer is 8.05, which is 8.1 to one decimal place.'
      C: 'You went for 8.0. That cuts off the 5 instead of rounding. The next digit is 5, which is 5 or more, so add 1: 8.05 becomes 8.1.'
  5:
    moments:
      - section: 'The question'
        say: 'Taiwo and Kehinde own a store in the ratio 11 to 9. Kehinde sells two thirds of her share for ₦720. That ₦720 is neither her share nor the store.'
        doodle: {name: 'custom:1988_q05_a', id: store, caption: 'Kehinde sells ⅔ of her share for ₦720'}
        write: 'Taiwo : Kehinde $= 11 : 9$; $\tfrac{2}{3}$ of Kehinde''s share $=$ ₦720'
      - say: 'We name the value of the store, find the sum of ratio, and write Kehinde''s share as a fraction of the whole.'
        write: 'Solution'
      - say: 'Let the value of the store be x naira.'
        write: 'Let the value of the store be ₦$x$'
      - section: 'Sum of ratio'
        say: 'Add the parts of the ratio, and 11 plus 9 is 20. This is the sum of ratio.'
        write: 'Sum of ratio $= 11 + 9 = 20$'
      - say: 'Kehinde has 9 of the 20 parts. So her share is 9 over 20 of x.'
        write: 'Kehinde''s share $= \dfrac{9}{20} \times x = \dfrac{9x}{20}$'
      - section: 'Form the equation'
        say: 'Look at Kehinde''s blocks. Two thirds of her share was sold for ₦720.'
        doodle_do: [{id: store, op: stage, stage: 'custom:1988_q05_a2'}]
        write: '$\dfrac{2}{3} \times \dfrac{9x}{20} = 720$'
      - say: 'Cancel first. 3 goes into 9 three times. 2 goes into 20 ten times. That leaves 3x over 10.'
        write: '$\dfrac{3x}{10} = 720$'
      - say: 'Multiply both sides by 10 over 3. 720 divided by 3 is 240, and 240 times 10 is 2,400.'
        doodle_do: [{id: store, op: circle, part: store}]
        write: '$x = 720 \times \dfrac{10}{3} = 2400$'
        point:
          - {line: 7, kind: highlight, at: '2400', to: {doodle: store, part: store}}
      - section: 'Check'
        say: 'Check. Kehinde''s share is 9 over 20 of 2,400, which is 1,080. Two thirds of 1,080 is 720, the price she sold at.'
        doodle_do: [{id: store, op: label, part: kehinde, text: '₦1,080'}]
        write: 'Check: $\tfrac{9}{20} \times 2400 = 1080$; $\tfrac{2}{3} \times 1080 = 720 \ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the store is worth ₦2,400, which is option B.'
        write: '$\therefore$ Value of the store $=$ ₦2,400.00'
        answer: true
    traps:
      A: 'You went for ₦1,080. That is Kehinde''s share, 9 over 20 of the store. The whole store is ₦2,400.'
      C: 'You went for ₦3,000. Then Kehinde''s share would be ₦1,350, and two thirds of that is ₦900, not ₦720. The equation 3x over 10 equals 720 gives ₦2,400.'
      D: 'You went for ₦3,600. That is 720 times 5. Then Kehinde''s share would be ₦1,620, and two thirds of it is ₦1,080, not ₦720. The equation gives ₦2,400.'
  6:
    moments:
      - section: 'The question'
        say: 'Balls in the ratio 5 to 2 to 1, with 10 blue, and ten green and ten black are taken out. We cannot take balls out of a ratio, so first we count them.'
        doodle: {name: 'custom:1988_q06_a', id: basket, caption: 'green : black : blue = 5 : 2 : 1'}
        write: 'Green : black : blue $= 5 : 2 : 1$; blue $= 10$. Remove 10 green, 10 black.'
      - say: 'We use the sum of ratio to find the total, then each colour''s share.'
        write: 'Solution'
      - say: 'Let the total number of balls be x.'
        write: 'Let the total number of balls be $x$'
      - section: 'Sum of ratio'
        say: 'Add the parts of the ratio, and 5 plus 2 plus 1 is 8. This is the sum of ratio.'
        write: 'Sum of ratio $= 5 + 2 + 1 = 8$'
      - say: 'Blue has 1 of the 8 parts, and there are 10 blue balls. So 1 over 8 of x equals 10.'
        doodle_do: [{id: basket, op: circle, part: blue}]
        write: '$\dfrac{1}{8} \times x = 10$'
      - say: 'Multiply both sides by 8. 10 times 8 is 80 balls in all.'
        write: '$x = 80$'
      - section: 'Each colour'
        say: 'Green has 5 of the 8 parts, so 5 over 8 of 80. 80 divided by 8 is 10, times 5 is 50.'
        doodle_do: [{id: basket, op: label, part: green, text: '50 green'}]
        write: 'Green $= \dfrac{5}{8} \times 80 = 50$'
      - say: 'Black has 2 parts, so 2 over 8 of 80, which is 20.'
        doodle_do: [{id: basket, op: label, part: black, text: '20 black'}]
        write: 'Black $= \dfrac{2}{8} \times 80 = 20$'
      - section: 'Remove the balls'
        say: 'Out of the basket they come. Green left is 50 minus 10, which is 40. Black left is 20 minus 10, which is 10. No blue balls were removed, so blue is still 10.'
        doodle_do: [{id: basket, op: shrink, part: green, by: 0.8}, {id: basket, op: shrink, part: black, by: 0.5}]
        write: 'Green $= 50 - 10 = 40$; black $= 20 - 10 = 10$; blue $= 10$'
      - say: 'So the new ratio is 40 to 10 to 10.'
        write: 'New ratio $= 40 : 10 : 10$'
      - say: 'Divide every term by 10, the H.C.F. 40 divided by 10 is 4, and 10 divided by 10 is 1.'
        write: '$\therefore$ New ratio $= 4 : 1 : 1$'
      - section: 'Check'
        say: 'To check, 40 plus 10 plus 10 is 60 balls left, and 80 minus the 20 taken out is also 60.'
        write: 'Check: $40 + 10 + 10 = 60 = 80 - 20 \ \checkmark$'
      - section: 'Answer'
        say: 'So the new ratio is 4 to 1 to 1, which is option D.'
        write: '$\therefore 4 : 1 : 1$'
        answer: true
    traps:
      A: 'You went for 1 to 1 to 1. That needs equal numbers of each colour. After the removal there are 40 green but only 10 black and 10 blue, so it is 4 to 1 to 1.'
      B: 'You went for 4 to 2 to 1. That takes 10 from the green but forgets the black. Black drops from 20 to 10 as well, so the ratio is 40 to 10 to 10, which is 4 to 1 to 1.'
      C: 'You went for 5 to 1 to 1. That removes the black balls but keeps all 50 green. Green drops to 40 as well, so the ratio is 4 to 1 to 1.'
  7:
    moments:
      - section: 'The question'
        say: 'A taxpayer gets 1 over 8 of his income tax-free, and pays 20% on the rest. His tax is ₦490. We want his income.'
        write: 'Tax-free: $\tfrac{1}{8}$ of income; tax: $20\%$ of the remainder $=$ ₦490'
        doodle: {name: 'custom:1988_q07_a', id: notes, caption: '⅛ tax-free, 20% on the rest'}
      - section: 'Solution'
        say: 'Solution. Let his income be $x$ naira.'
        write: 'Solution: Let the income be ₦$x$'
      - say: 'The tax-free part is 1 over 8 of $x$.'
        write: 'Tax-free $= \tfrac{1}{8}x$'
      - say: 'The taxable part is the remainder, $x$ minus 1 over 8 of $x$, which is 7 over 8 of $x$.'
        write: 'Taxable $= x - \tfrac{1}{8}x = \tfrac{7}{8}x$'
        doodle_do: [{id: notes, op: highlight, part: taxed, 'on': 'taxable'}]
      - say: 'He pays 20% of the taxable part, and that is ₦490. 20% means 20 over 100.'
        write: 'Tax $= \tfrac{20}{100} \times \tfrac{7}{8}x = 490$'
        doodle_do: [{id: notes, op: highlight, part: tax, 'on': '490'}]
      - say: '20 over 100 is 1 over 5. 1 over 5 times 7 over 8 is 7 over 40.'
        write: '$\dfrac{7x}{40} = 490$'
      - say: 'Cross multiply, so $7x$ equals 490 times 40, which is 19,600.'
        write: '$7x = 490 \times 40 = 19600$'
      - say: 'Divide both sides by 7. 19,600 divided by 7 is 2,800.'
        write: '$x = \dfrac{19600}{7} = 2800$'
      - say: 'Therefore his income is ₦2,800.'
        write: '$\therefore$ income $=$ ₦2,800.00'
      - section: 'Check'
        say: 'Check. 1 over 8 of 2,800 is 350, so the taxable part is 2,450. 20% of 2,450 is 490, the tax given.'
        write: 'Check: $\tfrac{1}{8}(2800) = 350,\ \ 2800 - 350 = 2450,\ \ \tfrac{20}{100}(2450) = 490\ \checkmark$'
        doodle_do: [{id: notes, op: label, part: taxed, text: '₦2,450'}, {id: notes, op: label, part: free, text: '₦350'}]
      - say: 'Therefore his income is ₦2,800, which is answer choice C.'
        write: '$\therefore$ income $=$ ₦2,800.00'
        answer: true
    traps:
      A: 'You went for ₦560. That is 490 times 8 over 7, which skips the 20%. The tax is 20% of the taxable part, so $\tfrac{7x}{40} = 490$ gives ₦2,800.'
      B: 'You went for ₦2,450. That is the taxable part, 7 over 8 of his income. Add back the tax-free 1 over 8, ₦350, to get ₦2,800.'
      D: 'You went for ₦3,920. That is 490 times 8, as if the tax were 1 over 8 of the income. The tax is 20% of 7 over 8 of the income, which leads to ₦2,800.'
  8:
    moments:
      - section: 'The question'
        say: 'Three different bases, 8, 5 and 10, with fractional indices. The way in is to break every base into prime factors, so the same bases can meet and cancel.'
        write: 'Evaluate $\dfrac{8^{\frac{1}{3}} \times 5^{\frac{2}{3}}}{10^{\frac{2}{3}}}$'
      - say: 'Solution. First we write 8 and 10 in prime factors.'
        write: 'Solution'
      - section: 'Prime factors'
        say: '8 is 2 times 2 times 2, so 8 is 2 cubed. And 10 is 2 times 5.'
        write: '$8 = 2^{3},\quad 10 = 2 \times 5$'
      - say: 'By the law of indices, a power of a power multiplies the indices. 3 times 1 over 3 is 1, so 8 to the power 1 over 3 is 2 to the power 1, which is 2.'
        write: '$8^{\frac{1}{3}} = (2^{3})^{\frac{1}{3}} = 2^{1} = 2$ $\quad [(a^{m})^{n} = a^{mn}]$'
      - say: 'The law of indices says a product to a power puts the power on each factor. So 2 times 5, to the power 2 over 3, is 2 to the 2 over 3, times 5 to the 2 over 3.'
        write: '$10^{\frac{2}{3}} = (2 \times 5)^{\frac{2}{3}} = 2^{\frac{2}{3}} \times 5^{\frac{2}{3}}$ $\quad [(ab)^{n} = a^{n}b^{n}]$'
      - section: 'Substitute'
        say: 'Put these back into the expression. Picture each factor as a tile.'
        doodle: {name: 'custom:1988_q08_a', id: tiles, caption: 'the fraction as tiles', size: scene}
        write: '$= \dfrac{2 \times 5^{\frac{2}{3}}}{2^{\frac{2}{3}} \times 5^{\frac{2}{3}}}$'
      - say: '5 to the power 2 over 3 is on the top and on the bottom, so it cancels. Cross out the two green tiles.'
        doodle_do: [{id: tiles, op: cross, part: t5}, {id: tiles, op: cross, part: b5}]
        write: '$= \dfrac{2}{2^{\frac{2}{3}}}$'
      - section: 'Divide'
        say: 'By the law of indices, to divide powers of the same base, subtract the indices. The 2 on top is 2 to the power 1.'
        doodle_do: [{id: tiles, op: arrow, part: b2, to_part: t2}]
        write: '$= 2^{1 - \frac{2}{3}}$ $\quad [a^{m} \div a^{n} = a^{m-n}]$'
      - say: 'Write 1 as 3 over 3. 3 over 3 minus 2 over 3 is 1 over 3.'
        write: '$= 2^{\frac{3 - 2}{3}} = 2^{\frac{1}{3}}$'
      - say: 'Recall that the power 1 over 3 is a cube root. So 2 to the power 1 over 3 is the cube root of 2.'
        write: '$\therefore$ the expression $= \sqrt[3]{2}$ $\quad [a^{\frac{1}{n}} = \sqrt[n]{a}]$'
      - section: 'Check'
        say: 'Check by cubing the question. Cubing undoes each power, giving 8 to the 1, times 5 squared, over 10 squared. That is 8 times 25, over 100.'
        write: 'Check: $\left(\dfrac{8^{\frac{1}{3}} \times 5^{\frac{2}{3}}}{10^{\frac{2}{3}}}\right)^{3} = \dfrac{8 \times 5^{2}}{10^{2}} = \dfrac{200}{100}$'
      - say: '200 over 100 is 2. And the cube root of 2, cubed, is 2 as well.'
        write: '$= 2 = \left(\sqrt[3]{2}\right)^{3}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the expression is the cube root of 2, which is option C.'
        write: '$\therefore \sqrt[3]{2}$'
        answer: true
    traps:
      A: 'You went for 2 over 5. The 5s do not survive: 5 to the power 2 over 3 is on the top and the bottom and cancels. What is left is 2 over 2 to the 2 over 3, which is the cube root of 2.'
      B: 'You went for 5 over 3. That mixes the numbers up with the indices. Break 10 into 2 times 5, cancel the 5s, and you are left with 2 to the power 1 over 3.'
      D: 'You went for the cube root of 5. The powers of 5 cancel completely, so no 5 can be left in the answer. It is the cube root of 2.'
  9:
    moments:
      - section: 'The question'
        say: 'We know only two logs, log 2 and log 3. So 4.5 must be built out of 2s and 3s, and then the laws of logarithms do the rest.'
        write: 'Evaluate $\log_{10}4.5$, given $\log_{10}2$ and $\log_{10}3$'
      - say: 'Solution. First write down what we are given.'
        write: 'Solution'
      - say: 'We are given that log 2 is 0.3010, and log 3 is 0.4771. All the logs here are base 10.'
        write: 'Given: $\log 2 = 0.3010, \quad \log 3 = 0.4771$'
      - section: 'Write 4.5 with 2s and 3s'
        say: '4.5 is 9 divided by 2, so 4.5 is 9 over 2. Picture 4.5 built from blocks of 3 and a 2.'
        doodle: {name: 'custom:1988_q09_a', id: blocks, caption: 'build 4.5 from 3s and 2s'}
        write: '$4.5 = \dfrac{9}{2}$'
      - say: 'And 9 is 3 squared, which is two blocks of 3.'
        doodle_do: [{id: blocks, op: circle, part: threes}]
        write: '$4.5 = \dfrac{3^{2}}{2}$'
      - section: 'Laws of logarithms'
        say: 'Recall the quotient law, which says the log of a division is the log of the top minus the log of the bottom.'
        write: 'Recall: $\log\dfrac{M}{N} = \log M - \log N$'
      - say: 'By the quotient law, log 4.5 is log of 3 squared, minus log 2.'
        write: '$\log 4.5 = \log 3^{2} - \log 2$'
      - say: 'Recall the power law, which says the log of $M$ to the power $n$ is $n$ log $M$.'
        write: 'Recall: $\log M^{n} = n\log M$'
      - say: 'By the power law, log of 3 squared is 2 log 3.'
        doodle_do: [{id: blocks, op: label, part: threes, text: '2 log 3'}]
        write: '$= 2\log 3 - \log 2$'
      - section: 'Substitute'
        say: 'Now substitute the given values. Log 3 is 0.4771, and log 2 is 0.3010.'
        write: '$= 2(0.4771) - 0.3010$'
      - say: '2 times 0.4771 is 0.9542.'
        write: '$= 0.9542 - 0.3010$'
      - say: '0.9542 minus 0.3010 is 0.6532.'
        write: '$= 0.6532$'
      - section: 'Check'
        say: 'Check the size. 4.5 lies between 1 and 10, so its log must lie between 0 and 1, and 0.6532 does.'
        write: 'Check: $1 < 4.5 < 10 \Rightarrow 0 < \log 4.5 < 1\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore log 4.5 is 0.6532, which is option C.'
        write: '$\therefore \log_{10}4.5 = 0.6532$'
        answer: true
    traps:
      A: 'You went for 0.3010. That is log 2, one of the given values, not log 4.5. Write 4.5 as 3 squared over 2 and use both logs.'
      B: 'You went for 0.4771. That is log 3 on its own. 4.5 is 3 squared over 2, so the answer is 2 log 3 minus log 2.'
      D: 'You went for 0.9542. That is log 9, which is 2 log 3. You still subtract log 2, because 4.5 is 9 divided by 2.'
  10:
    moments:
      - section: 'The question'
        say: 'One equation, but it hides two, one for the plain numbers and one for the root 3 terms. That is how we find $m$.'
        write: 'Find $m$: $(m + \sqrt{3})(1 - \sqrt{3})^{2} = 6 - 2\sqrt{3}$'
      - say: 'Solution. Expand the left side, then equate rational and irrational parts.'
        write: 'Solution'
      - section: 'Expand the square'
        say: 'For a bracket squared, $a$ minus $b$, all squared, is $a$ squared minus $2ab$ plus $b$ squared.'
        write: '$(a - b)^{2} = a^{2} - 2ab + b^{2}$'
      - say: 'Here $a$ is 1 and $b$ is root 3. 1 squared is 1, twice 1 times root 3 is 2 root 3, and root 3 squared is 3.'
        write: '$(1 - \sqrt{3})^{2} = 1 - 2\sqrt{3} + 3$'
      - say: '1 plus 3 is 4.'
        write: '$= 4 - 2\sqrt{3}$'
      - section: 'Substitute'
        say: 'Put that back into the equation in place of the square.'
        write: '$\therefore (m + \sqrt{3})(4 - 2\sqrt{3}) = 6 - 2\sqrt{3}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= 4 − 23'}, at: '(4 − 23)', text: 'swap in'}
      - say: 'Open the brackets. $m$ times 4 is $4m$, $m$ times minus 2 root 3 is minus $2m$ root 3, root 3 times 4 is 4 root 3, and root 3 times minus 2 root 3 is minus 2 times 3.'
        write: '$4m - 2m\sqrt{3} + 4\sqrt{3} - 2(3) = 6 - 2\sqrt{3}$'
      - say: 'Collect the terms with no surd together, and the root 3 terms together. 2 times 3 is 6.'
        write: '$(4m - 6) + (4 - 2m)\sqrt{3} = 6 - 2\sqrt{3}$'
      - section: 'Equate parts'
        say: 'The rational part has no surd, and the irrational part is the root 3 term. Equate rational and irrational parts, so each part on the left equals the same part on the right, like two balances.'
        doodle: {name: 'custom:1988_q10_a', id: match, caption: 'rational and irrational parts'}
        write: 'Equating rational and irrational parts:'
      - say: 'The rational parts give $4m$ minus 6 equals 6.'
        doodle_do: [{id: match, op: highlight, part: whole}]
        write: 'Rational: $4m - 6 = 6$'
        point:
          - {line: 9, kind: move, from: {line: 7, at: '(4m − 6)'}, at: '4m − 6', text: 'rational part'}
      - say: 'Add 6 to both sides. 6 plus 6 is 12.'
        write: '$4m = 12$'
      - say: 'Divide both sides by 4. 12 divided by 4 is 3.'
        doodle_do: [{id: match, op: label, part: whole, text: 'm = 3'}]
        write: '$\therefore m = 3$'
      - section: 'Check'
        say: 'Check with the irrational parts, where 4 minus $2m$ equals minus 2. That gives $2m$ equals 6, so $m$ is 3 again. Both parts agree.'
        doodle_do: [{id: match, op: highlight, part: roots}]
        write: 'Irrational: $4 - 2m = -2 \Rightarrow 2m = 6 \Rightarrow m = 3\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore $m$ is 3, which is option C.'
        write: '$\therefore m = 3$'
        answer: true
    traps:
      A: 'You went for 1. Put it back in: 4 times 1 minus 6 is minus 2, not 6. Expand the square fully to 4 minus 2 root 3, then equate rational parts to get $m = 3$.'
      B: 'You went for 2. With $m = 2$, the rational part is 4 times 2 minus 6, which is 2, not 6. Equating rational parts gives $m = 3$.'
      D: 'You went for 4. With $m = 4$, the rational part is 16 minus 6, which is 10, not 6. Equating rational parts gives $m = 3$.'
  11:
    moments:
      - section: 'The question'
        say: 'An 800-page book is 18 millimetres thick. How thick is one leaf, in metres, in standard form? The trap is in the word leaf. Picture the book, and one leaf pulled out.'
        doodle: {name: 'custom:1988_q11_a', id: book, caption: 'One leaf carries two pages'}
        write: '800 pages $= 18$ mm thick. Find the thickness of one leaf in metres, in standard form.'
      - say: 'Solution. First we count the leaves.'
        write: 'Solution'
      - section: 'Count the leaves'
        say: 'A leaf is one sheet of paper, and it carries two pages, one on each side. Look, page 1 is on the front and page 2 is on the back.'
        doodle_do: [{id: book, op: circle, part: leaf}]
        write: '1 leaf $= 2$ pages'
      - say: 'So the number of leaves is 800 divided by 2, which is 400.'
        doodle_do: [{id: book, op: label, part: book, text: '400 leaves'}]
        write: 'Number of leaves $= \dfrac{800}{2} = 400$'
      - section: 'One leaf'
        say: 'The 18 millimetres is shared equally among the 400 leaves.'
        doodle_do: [{id: book, op: highlight, part: thick}]
        write: 'Thickness of 1 leaf $= \dfrac{18}{400}$ mm'
      - say: 'Divide, and 18 divided by 400 is 0.045.'
        write: '$= 0.045$ mm'
      - section: 'Standard form'
        say: 'Standard form is $A$ times 10 to the power $n$, where $A$ is at least 1 and less than 10.'
        write: 'Standard form: $A \times 10^{n}$, where $1 \le A < 10$'
      - say: 'To turn 0.045 into 4.5, the point moves 2 places to the right, so the index is negative 2.'
        write: '$0.045$ mm $= 4.5 \times 10^{-2}$ mm'
      - section: 'Change to metres'
        say: '1000 millimetres make 1 metre, and 1000 is 10 cubed. So to change millimetres to metres, divide by 10 cubed.'
        write: '$1000$ mm $= 1$ m, and $1000 = 10^{3}$'
      - say: 'Divide by 10 cubed.'
        write: 'Thickness $= 4.5 \times 10^{-2} \div 10^{3}$ m'
      - say: 'By the law of indices, to divide powers of the same base, subtract the indices. Negative 2 minus 3 is negative 5.'
        write: '$= 4.5 \times 10^{-2 - 3}$ $\quad [a^{m} \div a^{n} = a^{m-n}]$'
        doodle_do: [{id: book, op: label, part: leaf, text: '0.000045 m thick'}]
      - say: 'So one leaf is 4.5 times 10 to the negative 5 metres.'
        write: '$\therefore$ Thickness $= 4.5 \times 10^{-5}$ m'
      - section: 'Check'
        say: 'To check, take 400 leaves times 4.5 times 10 to the negative 5 metres. 400 times 4.5 is 1800, and 1800 times 10 to the negative 5 is 0.018 metres, which is 18 millimetres.'
        write: 'Check: $400 \times 4.5 \times 10^{-5} = 0.018$ m $= 18$ mm $\checkmark$'
      - section: 'Answer'
        say: 'Therefore one leaf is 4.50 times 10 to the negative 5 metres, which is option D.'
        write: '$\therefore 4.50 \times 10^{-5}$ m'
        answer: true
    traps:
      A: 'You went for 2.25 times 10 to the negative 4. That divides by 800 pages instead of 400 leaves, and the index of 10 is off by one as well. Use 400 leaves, then divide the millimetres by 10 cubed.'
      B: 'You went for 4.50 times 10 to the negative 4. The 4.5 is right, but the index is off by one. 10 to the negative 2, divided by 10 cubed, is 10 to the negative 5.'
      C: 'You went for 2.25 times 10 to the negative 5. That divides 18 millimetres by 800 pages. But each leaf carries two pages, so there are only 400 leaves, and each is twice as thick.'
  12:
    moments:
      - section: 'The question'
        say: 'Two fractions and a minus sign between them. That minus sign is where most students lose this mark. Let us see why.'
        write: '$\dfrac{x + 2}{x + 1} - \dfrac{x - 2}{x + 2}$'
      - section: 'Solution'
        say: 'To subtract fractions we need the L.C.M. of the denominators. The two bottoms share no factor, so the L.C.M. is their product.'
        write: 'Solution'
      - say: 'L.C.M. equals $x$ plus 1, times $x$ plus 2.'
        write: 'L.C.M. $= (x + 1)(x + 2)$'
      - say: 'Each top is multiplied by the bracket its fraction is missing. Keep the second product in a bracket, because the minus sign belongs to all of it.'
        write: '$= \dfrac{(x + 2)(x + 2) - (x - 2)(x + 1)}{(x + 1)(x + 2)}$'
      - section: 'Open the brackets'
        say: 'Open the first product. $x$ times $x$ is $x$ squared, 2 $x$ plus 2 $x$ is 4 $x$, and 2 times 2 is 4.'
        write: '$(x + 2)(x + 2) = x^{2} + 4x + 4$'
      - say: 'Open the second. $x$ times $x$ is $x$ squared, $x$ minus 2 $x$ is negative $x$, and negative 2 times 1 is negative 2.'
        write: '$(x - 2)(x + 1) = x^{2} - x - 2$'
      - say: 'Put both back into the numerator, the second still in its bracket. The minus sign stands in front of that bracket.'
        write: 'Numerator $= (x^{2} + 4x + 4) - (x^{2} - x - 2)$'
      - say: 'Now the minus reaches inside and changes every sign, giving negative $x$ squared, plus $x$, plus 2.'
        write: '$= x^{2} + 4x + 4 - x^{2} + x + 2$'
      - say: 'Collect like terms. $x$ squared minus $x$ squared is zero. 4 $x$ plus $x$ is 5 $x$. 4 plus 2 is 6.'
        write: '$= 5x + 6$'
      - say: 'Therefore the answer is 5 $x$ plus 6, over the L.C.M.'
        write: '$\therefore \dfrac{5x + 6}{(x + 1)(x + 2)}$'
      - section: 'Check'
        say: 'Check with $x$ equals 0. The question gives 2 over 1, minus negative 2 over 2. That is 2 plus 1, which is 3.'
        write: '$x = 0$: $\dfrac{2}{1} - \dfrac{-2}{2} = 2 + 1 = 3$'
      - say: 'Our answer gives 6 over 1 times 2, which is 3 as well.'
        write: '$\dfrac{6}{(1)(2)} = 3\ \checkmark$'
      - say: 'So the answer is 5 $x$ plus 6, over $x$ plus 1 times $x$ plus 2, which is option C.'
        write: '$\therefore \dfrac{5x + 6}{(x + 1)(x + 2)}$ (C)'
        answer: true
    traps:
      A: 'You went for 3 over $x$ plus 1. That comes from cancelling terms across a subtraction, which is not allowed. Use the L.C.M. and open both products.'
      B: 'You went for 3 $x$ plus 2 on top. That comes from subtracting the second product without changing all its signs. Minus negative $x$ is plus $x$, and minus negative 2 is plus 2, giving 5 $x$ plus 6.'
      D: 'You went for 2 $x$ squared plus 5 $x$ plus 2 on top. When you subtract, the $x$ squared terms cancel, so no $x$ squared is left. The top is 5 $x$ plus 6.'
  13:
    moments:
      - section: 'The question'
        say: 'We are given 1 over $p$ and 1 over $q$, not $p$ and $q$. Divide the wrong pair and you land on the trap. First find $p$ and $q$ themselves.'
        write: '$\dfrac{1}{p} = \dfrac{a^{2} + 2ab + b^{2}}{a - b}$'
      - say: 'And 1 over $q$ is $a$ plus $b$, over $a$ squared minus 2 $a b$ plus $b$ squared. We want $p$ over $q$.'
        write: '$\dfrac{1}{q} = \dfrac{a + b}{a^{2} - 2ab + b^{2}}$'
      - section: 'Solution'
        say: 'First we factorise the perfect squares, then take reciprocals to get $p$ and $q$, then divide.'
        write: 'Solution'
      - say: '$a$ squared plus 2 $a b$ plus $b$ squared is a perfect square, which is $a$ plus $b$, all squared.'
        write: '$a^{2} + 2ab + b^{2} = (a + b)^{2}$'
      - say: 'And $a$ squared minus 2 $a b$ plus $b$ squared is $a$ minus $b$, all squared.'
        write: '$a^{2} - 2ab + b^{2} = (a - b)^{2}$'
      - section: 'Find p and q'
        say: 'So 1 over $p$ is $a$ plus $b$ squared, over $a$ minus $b$.'
        write: '$\dfrac{1}{p} = \dfrac{(a + b)^{2}}{a - b}$'
      - say: 'Take the reciprocal of both sides. Turn each fraction upside down, and $p$ is $a$ minus $b$, over $a$ plus $b$ squared.'
        write: '$\therefore p = \dfrac{a - b}{(a + b)^{2}}$'
      - say: 'In the same way, 1 over $q$ is $a$ plus $b$, over $a$ minus $b$ squared.'
        write: '$\dfrac{1}{q} = \dfrac{a + b}{(a - b)^{2}}$'
      - say: 'Take the reciprocal of both sides.'
        write: '$\therefore q = \dfrac{(a - b)^{2}}{a + b}$'
      - section: 'Divide'
        say: 'Now $p$ divided by $q$.'
        write: '$\dfrac{p}{q} = \dfrac{a - b}{(a + b)^{2}} \div \dfrac{(a - b)^{2}}{a + b}$'
      - say: 'Dividing by a fraction is multiplying by its reciprocal.'
        write: '$= \dfrac{a - b}{(a + b)^{2}} \times \dfrac{a + b}{(a - b)^{2}}$'
      - say: 'Cancel the common factors. One $a$ plus $b$ cancels, leaving one below. One $a$ minus $b$ cancels, leaving one below and 1 on top.'
        write: '$= \dfrac{1}{(a + b)(a - b)}$'
      - say: '$a$ plus $b$, times $a$ minus $b$, is the difference of two squares, $a$ squared minus $b$ squared.'
        write: '$\therefore \dfrac{p}{q} = \dfrac{1}{a^{2} - b^{2}}$'
      - section: 'Check'
        say: 'Check with $a$ equals 2 and $b$ equals 1. 1 over $p$ is 9 over 1, so $p$ is 1 over 9. 1 over $q$ is 3 over 1, so $q$ is 1 over 3.'
        write: '$a = 2, b = 1$: $p = \dfrac{1}{9},\ q = \dfrac{1}{3}$'
      - say: '1 over 9 divided by 1 over 3 is 1 over 3. And 1 over 4 minus 1 is also 1 over 3.'
        write: '$\dfrac{p}{q} = \dfrac{1}{3}$, $\dfrac{1}{4 - 1} = \dfrac{1}{3}\ \checkmark$'
      - say: 'So $p$ over $q$ is 1 over $a$ squared minus $b$ squared, and that is option B.'
        write: '$\therefore \dfrac{p}{q} = \dfrac{1}{a^{2} - b^{2}}$ (B)'
        answer: true
    traps:
      A: 'You went for $a$ plus $b$ over $a$ minus $b$. After you multiply, both brackets end up below, one of each. The top is just 1.'
      C: 'You went for $a$ minus $b$ over $a$ plus $b$. Count the brackets: $a$ minus $b$ is squared below, so it does not survive on top. Both brackets end up below.'
      D: 'You went for $a$ squared minus $b$ squared. That is the answer upside down, from dividing 1 over $p$ by 1 over $q$. Take the reciprocals first to get $p$ and $q$, then divide.'
  14:
    moments:
      - section: 'The question'
        say: '$x$ varies inversely as the cube root of $y$, and $x$ is 1 when $y$ is 8. When $x$ triples to 3, $y$ must shrink. By how much?'
        write: '$x = 1$ when $y = 8$; $\ y = ?$ when $x = 3$'
      - say: 'Solution. The variation statement says $x$ is proportional to 1 over the cube root of $y$.'
        write: 'Solution: $\ x \propto \dfrac{1}{\sqrt[3]{y}}$'
      - say: 'Replace the sign with the constant $k$. Inversely means we divide by the cube root of $y$.'
        write: '$\therefore\ x = \dfrac{k}{\sqrt[3]{y}}$'
      - section: 'Find k'
        say: 'Picture a rectangle $x$ wide and the cube root of $y$ tall, and its area is always $k$. Substitute the given pair, where $x$ is 1 when $y$ is 8.'
        doodle: {name: 'custom:1988_q14_a', id: boxes, caption: 'x times cube root of y stays k', size: scene}
        write: 'When $x = 1,\ y = 8$: $\ 1 = \dfrac{k}{\sqrt[3]{8}}$'
      - say: 'The cube root of 8 is 2, because 2 times 2 times 2 is 8.'
        write: '$1 = \dfrac{k}{2}$'
      - say: 'Multiply both sides by 2, and $k$ is 2. Every rectangle has area 2.'
        doodle_do: [{id: boxes, op: label, part: r1, text: 'area k = 2'}]
        write: '$\therefore\ k = 2$'
        point:
          - {line: 5, kind: highlight, at: 'k = 2', to: {doodle: boxes, part: r1}}
      - section: 'The equation'
        say: 'So the equation connecting $x$ and $y$ is $x$ equals 2 over the cube root of $y$.'
        write: '$\therefore\ x = \dfrac{2}{\sqrt[3]{y}}$'
      - section: 'Find y'
        say: 'Now substitute $x$ equals 3. Stretch the rectangle to 3 wide, and it must get shorter.'
        doodle_do: [{id: boxes, op: stage, stage: 'custom:1988_q14_a2'}]
        write: 'When $x = 3$: $\ 3 = \dfrac{2}{\sqrt[3]{y}}$'
      - say: 'Cross multiply, so 3 times the cube root of $y$ equals 2.'
        write: '$3\sqrt[3]{y} = 2$'
      - say: 'Divide both sides by 3. That is the new rectangle''s height.'
        doodle_do: [{id: boxes, op: label, part: r2, text: 'height 2/3'}]
        write: '$\sqrt[3]{y} = \dfrac{2}{3}$'
      - say: 'To undo a cube root, we cube both sides.'
        write: '$y = \left(\dfrac{2}{3}\right)^{3}$'
      - say: '2 cubed is 8, and 3 cubed is 27.'
        write: '$\therefore\ y = \dfrac{2^{3}}{3^{3}} = \dfrac{8}{27}$'
      - section: 'Check'
        say: 'To check, the cube root of 8 over 27 is 2 over 3, and 2 divided by 2 over 3 is 3. That is our $x$.'
        write: 'Check: $\ \dfrac{2}{\sqrt[3]{8/27}} = 2 \div \dfrac{2}{3} = 3\ \checkmark$'
      - say: 'A bigger $x$ goes with a smaller $y$, as inverse variation says. So $y$ is 8 over 27, which is option C.'
        write: '$y = \dfrac{8}{27}$'
        answer: true
    traps:
      A: 'You went for one third. That ignores the cube root altogether. With the cube root, you get the cube root of $y$ equals two thirds, and cubing gives 8 over 27.'
      B: 'You went for two thirds. That''s the cube root of $y$, the step before the answer. Cube it to get $y$ itself, 8 over 27.'
      D: 'You went for 4 over 9. That squares two thirds instead of cubing it. To undo a cube root you cube, so it''s 8 over 27.'
  15:
    moments:
      - section: 'The question'
        say: 'Substitution with a negative number and a fractional index. This is where signs slip, so we put every value in brackets and work one piece at a time.'
        write: 'If $a = -3,\ b = 2,\ c = 4$, calculate $\dfrac{a^{3} - b^{3} - c^{\frac{1}{2}}}{b - a - c}$'
      - say: 'Solution. We find the numerator first, then the denominator.'
        write: 'Solution'
      - section: 'The numerator'
        say: 'Substitute into the numerator, with each value in brackets.'
        write: 'Numerator $= (-3)^{3} - (2)^{3} - (4)^{\frac{1}{2}}$'
      - say: 'By BODMAS, the powers come before the subtraction. Negative 3 cubed is negative 3, times negative 3, times negative 3.'
        write: '$(-3)^{3} = (-3) \times (-3) \times (-3)$'
      - say: 'Negative 3 times negative 3 is positive 9, and 9 times negative 3 is negative 27. An odd power of a negative number stays negative.'
        write: '$= 9 \times (-3) = -27$'
      - say: '2 cubed is 2 times 2 times 2, which is 8.'
        write: '$(2)^{3} = 2 \times 2 \times 2 = 8$'
      - say: 'By the law of indices, the power 1 over 2 is a square root. The square root of 4 is 2.'
        write: '$(4)^{\frac{1}{2}} = \sqrt{4} = 2$ $\quad [a^{\frac{1}{2}} = \sqrt{a}]$'
      - say: 'Now put the three results into the numerator.'
        write: 'Numerator $= -27 - 8 - 2$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '−27'}, at: '−27', text: 'a cubed'}
          - {line: 7, kind: move, from: {line: 5, at: '=8'}, at: '−8', text: 'b cubed'}
      - say: 'Negative 27 minus 8 is negative 35, and negative 35 minus 2 is negative 37.'
        write: '$= -35 - 2 = -37$'
      - section: 'The denominator'
        say: 'Substitute into the denominator, again with brackets, so 2, minus negative 3, minus 4.'
        write: 'Denominator $= (2) - (-3) - (4)$'
      - say: 'Minus negative 3 is plus 3, because two minus signs make a plus.'
        write: '$= 2 + 3 - 4$'
      - say: '2 plus 3 is 5, and 5 minus 4 is 1.'
        write: '$= 1$'
      - section: 'Divide'
        say: 'Now the numerator over the denominator gives negative 37 over 1.'
        write: '$\therefore \dfrac{a^{3} - b^{3} - c^{\frac{1}{2}}}{b - a - c} = \dfrac{-37}{1} = -37$'
      - section: 'Check'
        say: 'Check the sign. The numerator is negative and the denominator is positive, so the answer must be negative. And dividing by 1 changes nothing.'
        write: 'Check: $\dfrac{(-)}{(+)} = (-)$, and $-37 \div 1 = -37\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the value is negative 37, which is option D.'
        write: '$\therefore -37$'
        answer: true
    traps:
      A: 'You went for 37. The size is right, but the sign is wrong. Negative 3 cubed is negative 27, so the numerator is negative 27 minus 8 minus 2, which is negative 37.'
      B: 'You went for negative 37 over 5. The denominator is not 5. With brackets, 2 minus, bracket, negative 3, minus 4 is 2 plus 3 minus 4, which is 1.'
      C: 'You went for 37 over 5. Both the sign and the denominator have slipped. The numerator is negative 37, and the denominator is 2 plus 3 minus 4, which is 1.'
  16:
    moments:
      - section: 'The question'
        say: 'Feed $y$ plus 3 into the machine $g$. The secret is the bracket, because every $y$ in the rule is replaced by the whole of $y$ plus 3.'
        write: '$g(y) = \dfrac{y - 3}{11} + \dfrac{11}{y^{2} - 9}$'
        doodle: {name: 'custom:1988_q16_a', id: g, caption: 'feed y + 3 into g'}
      - section: 'Solution'
        say: 'We substitute $y$ plus 3, in brackets, for every $y$. We do one fraction at a time, then put them together.'
        write: 'Solution'
        doodle_do: [{id: g, op: highlight, part: input}]
      - say: 'The first fraction. $y$ plus 3, minus 3, is just $y$.'
        write: '$\dfrac{(y + 3) - 3}{11} = \dfrac{y}{11}$'
      - say: 'The second fraction. Its denominator becomes $y$ plus 3, all squared, minus 9.'
        write: '$\dfrac{11}{(y + 3)^{2} - 9}$'
      - say: 'Open the bracket. $y$ plus 3, all squared, is $y$ squared, plus 2 times 3 times $y$, which is 6 $y$, plus 9.'
        write: '$(y + 3)^{2} = y^{2} + 6y + 9$'
      - say: 'Now take away the 9. Plus 9 minus 9 is zero.'
        write: '$(y + 3)^{2} - 9 = y^{2} + 6y + 9 - 9$'
        point:
          - {line: 5, kind: strike, at: '+ 9 − 9', text: 'cancel'}
      - say: 'That leaves $y$ squared plus 6 $y$. Both terms have $y$, so factorise out $y$.'
        write: '$= y^{2} + 6y = y(y + 6)$'
      - say: 'Therefore $g$ of $y$ plus 3 is $y$ over 11, plus 11 over $y$ times $y$ plus 6. That is what comes out of the machine.'
        doodle_do: [{id: g, op: circle, part: output}]
        write: '$\therefore g(y + 3) = \dfrac{y}{11} + \dfrac{11}{y(y + 6)}$'
      - section: 'Check'
        say: 'Check with $y$ equals 1, which means $g$ of 4. From the rule we get 4 minus 3 over 11, plus 11 over 16 minus 9. That is 1 over 11 plus 11 over 7.'
        write: '$g(4) = \dfrac{1}{11} + \dfrac{11}{16 - 9} = \dfrac{1}{11} + \dfrac{11}{7}$'
      - say: 'Our answer with $y$ equals 1 gives 1 over 11, plus 11 over 1 times 7. The same.'
        write: '$\dfrac{1}{11} + \dfrac{11}{1(7)} = \dfrac{1}{11} + \dfrac{11}{7}\ \checkmark$'
      - say: 'So $g$ of $y$ plus 3 is $y$ over 11, plus 11 over $y$ times $y$ plus 6, which is option A.'
        write: '$\therefore \dfrac{y}{11} + \dfrac{11}{y(y + 6)}$ (A)'
        answer: true
    traps:
      B: 'You went for $y$ times $y$ plus 3 in the second denominator. That comes from opening $y$ plus 3 squared as $y$ squared plus 3 $y$ plus 9. The middle term is doubled: 2 times 3 $y$ is 6 $y$.'
      C: 'You went for $y$ plus 30 over 11. The first fraction is $y$ plus 3, minus 3, over 11, and the 3s cancel to leave $y$ over 11.'
      D: 'You went for $y$ plus 3 over 11. That forgets the minus 3 in the rule. Replacing $y$ with $y$ plus 3 in $y$ minus 3 gives just $y$.'
  17:
    moments:
      - section: 'The question'
        say: 'A square minus a square. Students stop too early here, but the word completely means we keep factorising until nothing more comes out.'
        write: '$(x^{2} + x)^{2} - (2x + 2)^{2}$'
        doodle: {name: 'custom:1988_q17_a', id: squares, caption: 'square minus square'}
      - section: 'Solution'
        say: 'First take out the common factor inside each bracket. Then take out the common bracket, then use the difference of two squares.'
        write: 'Solution'
      - say: '$x$ squared plus $x$ has a common factor $x$.'
        write: '$x^{2} + x = x(x + 1)$'
      - say: '2 $x$ plus 2 has a common factor 2.'
        write: '$2x + 2 = 2(x + 1)$'
      - say: 'Put them back into the expression. The big square has side $x$ times $x$ plus 1, and the small one has side 2 times $x$ plus 1.'
        doodle_do: [{id: squares, op: pulse, part: big}]
        write: '$= [x(x + 1)]^{2} - [2(x + 1)]^{2}$'
      - say: 'Squaring a product squares each part. The first is $x$ squared times $x$ plus 1 squared, and the second is 4 times $x$ plus 1 squared.'
        doodle_do: [{id: squares, op: label, part: small, text: '4(x + 1)²'}]
        write: '$= x^{2}(x + 1)^{2} - 4(x + 1)^{2}$'
      - say: 'Both terms have $x$ plus 1, squared. Factorise it out.'
        write: '$= (x + 1)^{2}(x^{2} - 4)$'
      - say: 'Not complete yet. $x$ squared minus 4 is a difference of two squares, since 4 is 2 squared. It is $x$ plus 2, times $x$ minus 2.'
        write: '$x^{2} - 4 = (x + 2)(x - 2)$'
      - say: 'Put that in. Therefore the complete factorisation is $x$ plus 1 squared, times $x$ plus 2, times $x$ minus 2.'
        write: '$\therefore (x + 1)^{2}(x + 2)(x - 2)$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= (x + 2)(x − 2)'}, at: '(x + 2)(x − 2)', text: 'factorised'}
      - section: 'Check'
        say: 'Check with $x$ equals 1. In the question, 1 plus 1 is 2 and 2 plus 2 is 4. 2 squared minus 4 squared is 4 minus 16, which is negative 12.'
        write: '$x = 1$: $(2)^{2} - (4)^{2} = 4 - 16 = -12$'
      - say: 'In our answer, 2 squared is 4, times 3, times negative 1. That is also negative 12.'
        write: '$(2)^{2}(3)(-1) = -12\ \checkmark$'
      - say: 'So the answer is $x$ plus 1 squared, times $x$ plus 2, times $x$ minus 2, which is option D.'
        write: '$\therefore (x + 1)^{2}(x + 2)(x - 2)$ (D)'
        answer: true
    traps:
      A: 'You went for the answer with $x$ plus $y$ in it. There is no $y$ in the question at all. Take out $x$ plus 1 squared, then factorise $x$ squared minus 4.'
      B: 'You went for $x$ plus $y$ squared, times $x$ minus 2 squared. There is no $y$ in the question, and $x$ minus 2 appears only once. The answer is $x$ plus 1 squared, times $x$ plus 2, times $x$ minus 2.'
      C: 'You went for $x$ plus 1 squared, times $x$ plus 2 squared. The minus sign in the question must give a factor $x$ minus 2: $x$ squared minus 4 is $x$ plus 2, times $x$ minus 2.'
  18:
    moments:
      - section: 'The question'
        say: 'Cube roots on the bottom are a clue. The top, $x$ minus $y$, is secretly a difference of two cubes.'
        write: '$\dfrac{x - y}{x^{\frac{1}{3}} - y^{\frac{1}{3}}}$'
      - section: 'Solution'
        say: 'We give the cube roots short names, rewrite the top as a difference of two cubes, factorise it, and cancel.'
        write: 'Solution'
      - say: 'Let $a$ be $x$ to the power 1 over 3, and $b$ be $y$ to the power 1 over 3.'
        write: 'Let $a = x^{\frac{1}{3}}$ and $b = y^{\frac{1}{3}}$'
      - say: 'Cube both. 3 times 1 over 3 is 1, so $a$ cubed is $x$ and $b$ cubed is $y$. Picture two cubes with edges $a$ and $b$.'
        doodle: {name: 'custom:1988_q18_a', id: cubes, caption: 'a cube and a cube'}
        doodle_do: [{id: cubes, op: label, part: big, text: 'a³ = x'}, {id: cubes, op: label, part: small, text: 'b³ = y'}]
        write: '$\therefore x = a^{3}$ and $y = b^{3}$'
      - say: 'So the fraction is $a$ cubed minus $b$ cubed, over $a$ minus $b$.'
        write: '$\dfrac{x - y}{x^{\frac{1}{3}} - y^{\frac{1}{3}}} = \dfrac{a^{3} - b^{3}}{a - b}$'
      - section: 'Factorise'
        say: 'The difference of two cubes says $a$ cubed minus $b$ cubed is $a$ minus $b$, times $a$ squared plus $a b$ plus $b$ squared. Note the plus signs.'
        write: '$a^{3} - b^{3} = (a - b)(a^{2} + ab + b^{2})$'
        point:
          - {line: 5, kind: box, text: 'the rule'}
      - say: 'Put that factorisation on top.'
        write: '$= \dfrac{(a - b)(a^{2} + ab + b^{2})}{a - b}$'
      - say: 'Cancel the common factor, $a$ minus $b$.'
        write: '$= a^{2} + ab + b^{2}$'
      - section: 'Back to x and y'
        say: 'Now put back $x$ and $y$. $a$ squared is $x$ to the 1 over 3, squared, which is $x$ to the 2 over 3, since 2 times 1 over 3 is 2 over 3.'
        doodle_do: [{id: cubes, op: pulse, part: big}]
        write: '$a^{2} = (x^{\frac{1}{3}})^{2} = x^{\frac{2}{3}}$'
      - say: 'In the same way, $b$ squared is $y$ to the 2 over 3, and $a b$ is $x$ to the 1 over 3 times $y$ to the 1 over 3.'
        write: '$b^{2} = y^{\frac{2}{3}},\ ab = x^{\frac{1}{3}}y^{\frac{1}{3}}$'
      - say: 'Therefore the fraction simplifies to $x$ to the 2 over 3, plus $x$ to the 1 over 3 $y$ to the 1 over 3, plus $y$ to the 2 over 3.'
        write: '$\therefore x^{\frac{2}{3}} + x^{\frac{1}{3}}y^{\frac{1}{3}} + y^{\frac{2}{3}}$'
      - section: 'Check'
        say: 'Check with $x$ equals 8 and $y$ equals 1, whose cube roots are 2 and 1. The question gives 8 minus 1, over 2 minus 1, which is 7.'
        write: '$x = 8, y = 1$: $\dfrac{8 - 1}{2 - 1} = 7$'
      - say: 'In our answer, 8 to the 2 over 3 is 2 squared, 4. The middle term is 2 times 1, which is 2. The last is 1. 4 plus 2 plus 1 is 7.'
        write: '$4 + 2 + 1 = 7\ \checkmark$'
      - say: 'So the answer is $x$ to the 2 over 3, plus $x$ to the 1 over 3 $y$ to the 1 over 3, plus $y$ to the 2 over 3, which is option B.'
        write: '$\therefore x^{\frac{2}{3}} + x^{\frac{1}{3}}y^{\frac{1}{3}} + y^{\frac{2}{3}}$ (B)'
        answer: true
    traps:
      A: 'You went for $x$ squared plus $x y$ plus $y$ squared. That is the right pattern with the wrong powers. Here $a$ is $x$ to the 1 over 3, so $a$ squared is $x$ to the 2 over 3, not $x$ squared.'
      C: 'You went for the version with minus signs. The difference of two cubes keeps plus signs: $a$ cubed minus $b$ cubed is $a$ minus $b$, times $a$ squared plus $a b$ plus $b$ squared.'
      D: 'You went for $x$ squared minus $x y$ plus $y$ squared. That mixes the sum of two cubes pattern with whole powers. This is a difference of cubes in $x$ to the 1 over 3, which gives plus signs and powers in thirds.'
  19:
    moments:
      - section: 'The question'
        say: 'Fractions inside a quadratic look frightening. Clear them away first, and an ordinary quadratic appears, one that is a perfect square.'
        write: '$x^{2} + \dfrac{2x}{r^{2}} + \dfrac{1}{r^{4}} = 0$'
      - section: 'Solution'
        say: 'The L.C.M. of the denominators is $r$ to the power 4. Multiply every term by $r$ to the 4 to clear the fractions.'
        write: 'Solution'
      - say: '$x$ squared times $r$ to the 4 is $r$ to the 4 $x$ squared. 2 $x$ over $r$ squared, times $r$ to the 4, is 2 $r$ squared $x$. And 1 over $r$ to the 4 becomes 1.'
        write: '$r^{4}x^{2} + 2r^{2}x + 1 = 0$'
      - section: 'Factorise'
        say: 'Now factorise. Here $a$ is $r$ to the 4, $b$ is 2 $r$ squared and $c$ is 1. The product $a c$ is $r$ to the 4, and the sum is 2 $r$ squared.'
        write: 'Product $= ac = r^{4}$, Sum $= b = 2r^{2}$'
      - say: 'Two terms that multiply to $r$ to the 4 and add to 2 $r$ squared are $r$ squared and $r$ squared.'
        write: 'Factors: $r^{2}$ and $r^{2}$'
      - say: 'Replace the middle term, 2 $r$ squared $x$, with $r$ squared $x$ plus $r$ squared $x$.'
        write: '$r^{4}x^{2} + r^{2}x + r^{2}x + 1 = 0$'
      - say: 'Group in pairs. From the first pair take out $r$ squared $x$, and from the second take out 1. Both brackets are $r$ squared $x$ plus 1.'
        write: '$r^{2}x(r^{2}x + 1) + 1(r^{2}x + 1) = 0$'
      - say: 'Take out the common bracket. The two brackets are the same, so the left side is a perfect square. Picture the four tiles making one square.'
        doodle: {name: 'custom:1988_q19_a', id: square, caption: 'a square made of four tiles'}
        write: '$(r^{2}x + 1)(r^{2}x + 1) = 0$'
      - say: 'Written as a square, $r$ squared $x$ plus 1, all squared, equals zero.'
        doodle_do: [{id: square, op: circle}]
        write: '$(r^{2}x + 1)^{2} = 0$'
      - section: 'Solve'
        say: 'Both brackets give the same equation, so there is only one root, from $r$ squared $x$ plus 1 equals zero.'
        write: '$r^{2}x + 1 = 0$'
      - say: 'Subtract 1 from both sides.'
        write: '$r^{2}x = -1$'
      - say: 'Divide both sides by $r$ squared. Therefore $x$ is negative 1 over $r$ squared.'
        write: '$\therefore x = -\dfrac{1}{r^{2}}$'
      - section: 'Check'
        say: 'Check in the question. $x$ squared is 1 over $r$ to the 4. 2 $x$ over $r$ squared is negative 2 over $r$ to the 4.'
        write: '$x^{2} = \dfrac{1}{r^{4}},\ \dfrac{2x}{r^{2}} = -\dfrac{2}{r^{4}}$'
      - say: 'So the left side is 1 over $r$ to the 4, minus 2 over $r$ to the 4, plus 1 over $r$ to the 4. 1 minus 2 plus 1 is zero.'
        write: '$\dfrac{1}{r^{4}} - \dfrac{2}{r^{4}} + \dfrac{1}{r^{4}} = 0\ \checkmark$'
      - say: 'So $x$ is negative 1 over $r$ squared, which is option C.'
        write: '$\therefore x = -\dfrac{1}{r^{2}}$ (C)'
        answer: true
    traps:
      A: 'You went for $r$ squared. That is upside down and has the wrong sign. From $r$ squared $x$ equals negative 1, $x$ is negative 1 over $r$ squared.'
      B: 'You went for 1 over $r$ squared. The sign got lost when you moved the 1 across. Put it back and you get 4 over $r$ to the 4, not zero; $x$ is negative 1 over $r$ squared.'
      D: 'You went for 1 over $r$. The bracket is $r$ squared $x$ plus 1, so we divide by $r$ squared, not $r$, and the 1 moves across as negative 1. So $x$ is negative 1 over $r$ squared.'
  20:
    moments:
      - section: 'The question'
        say: 'We want the whole numbers $x$ that keep 5 minus $2x$ between 1 and 7, ends included. Watch the minus sign in front of the $2x$.'
        write: '$1 \le 5 - 2x \le 7$'
      - say: 'Solution. In a double inequality, whatever we do, we do to all three parts. First, subtract 5 from all three parts.'
        write: 'Solution: $\ 1 - 5 \le 5 - 2x - 5 \le 7 - 5$'
      - say: '1 minus 5 is minus 4. In the middle, 5 minus 5 is 0, leaving minus $2x$. And 7 minus 5 is 2.'
        write: '$-4 \le -2x \le 2$'
      - section: 'Divide by a negative'
        say: 'Now divide all three parts by minus 2. Dividing by a negative number reverses the inequality signs.'
        write: 'Divide by $-2$, reverse the signs: $\ \dfrac{-4}{-2} \ge x \ge \dfrac{2}{-2}$'
      - say: 'Minus 4 over minus 2 is 2, and 2 over minus 2 is minus 1.'
        write: '$2 \ge x \ge -1$'
      - say: 'Write it the usual way, smallest first.'
        write: '$\therefore\ -1 \le x \le 2$'
      - section: 'The number line'
        say: 'On a number line, both signs include equality, so both ends get closed circles.'
        diagram: {id: n, kind: numberline, range: [-3, 4]}
        diagram_do:
          - {id: n, op: interval, from: -1, to: 2, from_open: false, to_open: false, text: '−1 ≤ x ≤ 2', 'on': 'closed circles'}
      - say: 'Integral values means whole numbers. From minus 1 to 2, ends included, they are minus 1, 0, 1 and 2.'
        write: 'Integers: $\ x = -1,\ 0,\ 1,\ 2$'
        diagram_do:
          - {id: n, op: label, x: 0.5, text: '−1, 0, 1, 2', answer: true}
      - section: 'Check'
        say: 'Check the ends. $x$ equals minus 1 gives 5 plus 2, which is 7, so it is allowed. $x$ equals 2 gives 5 minus 4, which is 1, so it is allowed too.'
        write: 'Check: $\ 5 - 2(-1) = 7 \le 7,\ \ 5 - 2(2) = 1 \ge 1\ \checkmark$'
      - say: 'And 3 is out, because 5 minus 6 is minus 1, below 1.'
        write: '$x = 3$: $\ 5 - 2(3) = -1 < 1\ \times$'
      - say: 'So the integers are minus 1, 0, 1 and 2, which is option A.'
        write: '$\therefore\ x = -1,\ 0,\ 1,\ 2$'
        answer: true
    traps:
      B: 'You went for 0, 1, 2 and 3. Try $x$ equal to 3: 5 minus 6 is minus 1, which is below 1. And minus 1 does fit, so the list is minus 1, 0, 1, 2.'
      C: 'You went for minus 1 up to 3. The 3 doesn''t fit: 5 minus 6 is minus 1, which is below 1. The largest $x$ is 2.'
      D: 'You went for minus 1, 0, 2 and 3. That skips 1 and adds 3. With $x$ equal to 1, 5 minus 2 is 3, which fits; with $x$ equal to 3 it doesn''t. The list is minus 1, 0, 1, 2.'
  21:
    moments:
      - section: 'The question'
        say: 'Two straight lines, and we want the one point where they cross. Watch the order at the end, because the trap is the right numbers the wrong way round.'
        write: '$3x - 5y - 3 = 0,\ 2y - 6x + 5 = 0$'
        doodle: {name: 'custom:1988_q21_a', id: lines, caption: 'two lines, one crossing'}
      - section: 'Solution'
        say: 'First we rearrange each equation with $x$, then $y$, and the number on the right. Then we number them and eliminate $x$.'
        write: 'Solution'
      - say: 'Add 3 to both sides of the first equation. Call it equation 1.'
        write: '$3x - 5y = 3 \quad \text{......(1)}$'
      - say: 'In the second, subtract 5 from both sides and write the $x$ term first.'
        write: '$-6x + 2y = -5$'
      - say: 'Multiply through by negative 1, so the $x$ term is positive. Call it equation 2.'
        write: '$6x - 2y = 5 \quad \text{......(2)}$'
      - section: 'Eliminate x'
        say: 'To make the $x$ terms equal, multiply equation 1 by 2. 2 times 3 $x$ is 6 $x$, 2 times 5 $y$ is 10 $y$, and 2 times 3 is 6. Call it equation 3.'
        write: '(1) $\times 2$: $6x - 10y = 6 \quad \text{......(3)}$'
      - say: 'Now equation 2 minus equation 3. 6 $x$ minus 6 $x$ is zero. Negative 2 $y$ minus negative 10 $y$ is 8 $y$. 5 minus 6 is negative 1.'
        write: '(2) $-$ (3): $8y = -1$'
      - say: 'Divide both sides by 8. That is the height of the crossing point.'
        doodle_do: [{id: lines, op: label, part: meet, text: 'y = −1/8'}]
        write: '$y = -\dfrac{1}{8}$'
      - section: 'Find x'
        say: 'Substitute $y$ equals negative 1 over 8 in equation 1.'
        write: '$3x - 5\left(-\dfrac{1}{8}\right) = 3$'
      - say: 'Negative 5 times negative 1 over 8 is plus 5 over 8.'
        write: '$3x + \dfrac{5}{8} = 3$'
      - say: 'Subtract 5 over 8 from both sides. 3 is 24 over 8, and 24 over 8 minus 5 over 8 is 19 over 8.'
        write: '$3x = \dfrac{24}{8} - \dfrac{5}{8} = \dfrac{19}{8}$'
      - say: 'Divide both sides by 3. 19 over 8, divided by 3, is 19 over 24.'
        doodle_do: [{id: lines, op: label, part: meet, text: 'x = 19/24'}]
        write: '$x = \dfrac{19}{24}$'
      - say: 'Therefore $x$ is 19 over 24 and $y$ is negative 1 over 8. We write $x$ first, then $y$.'
        write: '$\therefore (x, y) = \left(\dfrac{19}{24}, -\dfrac{1}{8}\right)$'
      - section: 'Check'
        say: 'Check in equation 2, the one we did not substitute into. 6 times 19 over 24 is 19 over 4. 2 times negative 1 over 8 is negative 1 over 4.'
        write: '$6\left(\dfrac{19}{24}\right) - 2\left(-\dfrac{1}{8}\right)$'
      - say: '19 over 4 plus 1 over 4 is 20 over 4, which is 5. That is the right-hand side of equation 2.'
        write: '$= \dfrac{19}{4} + \dfrac{1}{4} = 5\ \checkmark$'
      - say: 'So $x$ is 19 over 24 and $y$ is negative 1 over 8, which is option D.'
        write: '$\therefore \left(\dfrac{19}{24}, -\dfrac{1}{8}\right)$ (D)'
        answer: true
    traps:
      A: 'You went for negative 1 over 8, then 19 over 24. Those are the right numbers in the wrong order. The pair is written $x$ first, then $y$.'
      B: 'You went for 8 and 24 over 10. That turns the fractions upside down. From 8 $y$ equals negative 1, $y$ is negative 1 over 8, not 8.'
      C: 'You went for negative 8 and 24 over 19. Those are the reciprocals of the right values. $x$ is 19 over 24, and $y$ is negative 1 over 8.'
  22:
    moments:
      - section: 'The question'
        say: 'You know the almighty formula. But here the letter $b$ is not where you expect it. Match by position, not by letter.'
        write: '$px^{2} + qx + b = 0$'
      - section: 'Solution'
        say: 'We use the quadratic formula. Because this question already uses $b$, we write the formula with capital letters $A$, $B$ and $C$.'
        write: 'Solution'
      - say: 'The formula solves any equation $A x$ squared plus $B x$ plus $C$ equals zero.'
        write: 'For $Ax^{2} + Bx + C = 0$:'
      - say: '$x$ equals negative $B$, plus or minus the square root of $B$ squared minus 4 $A C$, all over 2 $A$.'
        write: '$x = \dfrac{-B \pm \sqrt{B^{2} - 4AC}}{2A}$'
      - say: 'Compare. The coefficient of $x$ squared is $p$, so $A$ is $p$. The coefficient of $x$ is $q$, so $B$ is $q$. The constant is $b$, so $C$ is $b$.'
        doodle: {name: 'custom:1988_q22_a', id: slots, caption: 'match letter to slot'}
        doodle_do:
          - {id: slots, op: arrow, part: tp, to_part: sa}
          - {id: slots, op: arrow, part: tq, to_part: sb}
          - {id: slots, op: arrow, part: tb, to_part: sc}
        write: '$A = p,\ B = q,\ C = b$'
      - say: 'Substitute, each letter in brackets.'
        write: '$x = \dfrac{-(q) \pm \sqrt{(q)^{2} - 4(p)(b)}}{2(p)}$'
      - say: 'Simplify. 4 times $p$ times $b$ is 4 $b p$. Therefore $x$ is negative $q$, plus or minus root $q$ squared minus 4 $b p$, over 2 $p$.'
        write: '$\therefore x = \dfrac{-q \pm \sqrt{q^{2} - 4bp}}{2p}$'
      - section: 'Check'
        say: 'Check with numbers. Take $p$ equals 1, $q$ equals negative 3, $b$ equals 2. That gives $x$ squared minus 3 $x$ plus 2, whose roots are 1 and 2.'
        write: '$x^{2} - 3x + 2 = 0$: roots $1, 2$'
      - say: 'Our formula gives 3 plus or minus root 9 minus 8, over 2. That is 3 plus or minus 1, over 2, which gives 2 or 1.'
        write: '$\dfrac{3 \pm \sqrt{9 - 8}}{2} = 2$ or $1\ \checkmark$'
      - say: 'So the solution is negative $q$, plus or minus root $q$ squared minus 4 $b p$, over 2 $p$, and that is option C.'
        write: '$\therefore x = \dfrac{-q \pm \sqrt{q^{2} - 4bp}}{2p}$ (C)'
        answer: true
    traps:
      A: 'You went for the textbook formula in $a$, $b$ and $c$. Those letters do not match this equation, and here $b$ is even the constant. Match by position: $A$ is $p$, $B$ is $q$, $C$ is $b$.'
      B: 'You went for the one with $p$ squared minus 4 $p b$ under the root and 2 $a$ below. The root should hold $q$ squared, the square of the coefficient of $x$, and the bottom should be 2 $p$.'
      D: 'You went for $p$ squared under the root. That squares the wrong coefficient. It is $B$ squared, and $B$ is $q$, the coefficient of $x$.'
  23:
    moments:
      - section: 'The question'
        say: 'Two fractions with quadratic denominators. Factorise the bottoms and you will find they share a bracket, and the answer gets small.'
        write: '$\dfrac{1}{x^{2} + 5x + 6} + \dfrac{1}{x^{2} + 3x + 2}$'
      - section: 'Solution'
        say: 'We factorise each denominator first, then find the L.C.M., add, and cancel any common factor.'
        write: 'Solution'
      - section: 'First denominator'
        say: 'For $x$ squared plus 5 $x$ plus 6, the product is 1 times 6, which is 6. The sum is 5. So the factors are 2 and 3.'
        write: 'Product $= 6$, Sum $= 5$; Factors: $2, 3$'
      - say: 'Replace 5 $x$ with 2 $x$ plus 3 $x$.'
        write: '$x^{2} + 5x + 6 = x^{2} + 2x + 3x + 6$'
      - say: 'Group in pairs. Take out $x$, then 3. Both brackets are $x$ plus 2.'
        write: '$= x(x + 2) + 3(x + 2)$'
      - say: 'Take out the common bracket.'
        write: '$= (x + 2)(x + 3)$'
      - section: 'Second denominator'
        say: 'For $x$ squared plus 3 $x$ plus 2, the product is 2 and the sum is 3. So the factors are 1 and 2.'
        write: 'Product $= 2$, Sum $= 3$; Factors: $1, 2$'
      - say: 'Replace 3 $x$ with $x$ plus 2 $x$.'
        write: '$x^{2} + 3x + 2 = x^{2} + x + 2x + 2$'
      - say: 'Group in pairs. Take out $x$, then 2. Both brackets are $x$ plus 1.'
        write: '$= x(x + 1) + 2(x + 1)$'
      - say: 'Take out the common bracket.'
        write: '$= (x + 1)(x + 2)$'
      - section: 'Add the fractions'
        say: 'Put the factorised bottoms back. Picture each denominator as a pair of bricks.'
        doodle: {name: 'custom:1988_q23_a', id: bricks, caption: 'bottoms as bricks', size: scene}
        write: '$\dfrac{1}{(x + 2)(x + 3)} + \dfrac{1}{(x + 1)(x + 2)}$'
      - say: 'Both denominators have an $x$ plus 2 brick. The L.C.M. takes each bracket once, so $x$ plus 1, $x$ plus 2 and $x$ plus 3.'
        doodle_do: [{id: bricks, op: circle, part: f1}]
        write: 'L.C.M. $= (x + 1)(x + 2)(x + 3)$'
      - say: 'Each top is multiplied by the brick its fraction is missing. The first needs $x$ plus 1, and the second needs $x$ plus 3.'
        doodle_do: [{id: bricks, op: stage, stage: 'custom:1988_q23_a2'}]
        write: '$= \dfrac{(x + 1) + (x + 3)}{(x + 1)(x + 2)(x + 3)}$'
      - say: 'Add the tops. $x$ plus $x$ is 2 $x$, and 1 plus 3 is 4.'
        write: '$= \dfrac{2x + 4}{(x + 1)(x + 2)(x + 3)}$'
      - say: 'Always check if the top factorises. 2 $x$ plus 4 is 2 times $x$ plus 2.'
        write: '$= \dfrac{2(x + 2)}{(x + 1)(x + 2)(x + 3)}$'
      - say: 'Cancel the common factor, $x$ plus 2. Therefore the sum is 2 over $x$ plus 1 times $x$ plus 3.'
        write: '$\therefore \dfrac{2}{(x + 1)(x + 3)}$'
      - section: 'Check'
        say: 'Check with $x$ equals 0. The question gives 1 over 6 plus 1 over 2. 1 over 2 is 3 over 6, so the sum is 4 over 6, which is 2 over 3.'
        write: '$x = 0$: $\dfrac{1}{6} + \dfrac{1}{2} = \dfrac{4}{6} = \dfrac{2}{3}$'
      - say: 'Our answer gives 2 over 1 times 3, which is 2 over 3 as well.'
        write: '$\dfrac{2}{(1)(3)} = \dfrac{2}{3}\ \checkmark$'
      - say: 'So the answer is 2 over $x$ plus 1 times $x$ plus 3, which is option C.'
        write: '$\therefore \dfrac{2}{(x + 1)(x + 3)}$ (C)'
        answer: true
    traps:
      A: 'You went for $x$ plus 3 over $x$ plus 1 times $x$ plus 2. That is only one of the new tops over one denominator. Add both tops, $x$ plus 1 and $x$ plus 3, over the full L.C.M.'
      B: 'You went for 1 over all three brackets. That builds the L.C.M. but forgets to multiply the tops. The tops add to 2 $x$ plus 4, which then cancels down.'
      D: 'You went for 4 over $x$ plus 1 times $x$ plus 3. The top is 2 $x$ plus 4, which is 2 times $x$ plus 2. After cancelling $x$ plus 2, the top is 2, not 4.'
  24:
    moments:
      - section: 'The question'
        say: 'Squares on top, a quadratic below. Factorise both and one bracket appears in both places. That bracket is the key.'
        write: '$\dfrac{4a^{2} - 49b^{2}}{2a^{2} + 5ab - 7b^{2}}$'
      - section: 'Solution'
        say: 'A fraction like this simplifies only by cancelling factors. So we factorise the numerator and the denominator completely, then cancel.'
        write: 'Solution'
      - say: 'The numerator is a difference of two squares. 4 $a$ squared is 2 $a$, all squared, and 49 $b$ squared is 7 $b$, all squared.'
        write: 'Numerator: $(2a)^{2} - (7b)^{2}$'
      - say: 'A difference of two squares is the minus bracket times the plus bracket.'
        write: '$= (2a - 7b)(2a + 7b)$'
      - section: 'Factorise the denominator'
        say: 'Now the denominator, 2 $a$ squared plus 5 $a b$ minus 7 $b$ squared. We factorise it by product and sum.'
        write: 'Denominator: $2a^{2} + 5ab - 7b^{2}$'
      - say: 'The product is 2 times negative 7, the first and last coefficients, which gives negative 14. The sum is the middle coefficient, 5.'
        write: 'Product $= 2 \times (-7) = -14$, Sum $= 5$'
      - say: 'Two numbers that multiply to negative 14 and add to 5 are plus 7 and negative 2.'
        write: 'Factors: $+7$ and $-2$'
      - say: 'Replace the middle term, 5 $a b$, with 7 $a b$ minus 2 $a b$.'
        write: '$= 2a^{2} + 7ab - 2ab - 7b^{2}$'
      - say: 'Group in pairs. From the first pair take out $a$, and from the second take out negative $b$. Both brackets are 2 $a$ plus 7 $b$.'
        write: '$= a(2a + 7b) - b(2a + 7b)$'
      - say: 'Take out the common bracket, 2 $a$ plus 7 $b$. What is left is $a$ minus $b$.'
        write: '$= (2a + 7b)(a - b)$'
      - section: 'Cancel'
        say: 'Now put the factorised numerator over the factorised denominator. Picture each factor as a tile.'
        doodle: {name: 'custom:1988_q24_a', id: tiles, caption: 'factor tiles', size: scene}
        write: '$\dfrac{(2a - 7b)(2a + 7b)}{(2a + 7b)(a - b)}$'
      - say: '2 $a$ plus 7 $b$ is on top and below, so cancel the common factor. Cross out those two tiles.'
        doodle_do: [{id: tiles, op: cross, part: t2}, {id: tiles, op: cross, part: b1}]
        write: '$= \dfrac{2a - 7b}{a - b}$'
      - section: 'Check'
        say: 'Check with $a$ equals 2 and $b$ equals 1. The top is 16 minus 49, negative 33. The bottom is 8 plus 10 minus 7, which is 11. Negative 33 over 11 is negative 3.'
        write: '$a = 2, b = 1$: $\dfrac{16 - 49}{8 + 10 - 7} = -3$'
      - say: 'Our answer gives 4 minus 7, over 2 minus 1, which is negative 3. The same.'
        write: '$\dfrac{4 - 7}{2 - 1} = -3\ \checkmark$'
      - say: 'The two tiles left are the answer, 2 $a$ minus 7 $b$, over $a$ minus $b$. Option D.'
        doodle_do: [{id: tiles, op: circle, part: t1}, {id: tiles, op: circle, part: b2}]
        write: '$\therefore \dfrac{2a - 7b}{a - b}$ (D)'
        answer: true
    traps:
      A: 'You went for $a$ minus $b$ over 2 $a$ plus $b$. That turns the fraction upside down and changes a bracket. Factorise both, cancel 2 $a$ plus 7 $b$, and you get 2 $a$ minus 7 $b$ over $a$ minus $b$.'
      B: 'You went for 2 $a$ plus 7 $b$ over $a$ minus $b$. That keeps the bracket that cancels and throws away the one that stays. Cross out 2 $a$ plus 7 $b$ and keep 2 $a$ minus 7 $b$.'
      C: 'You went for 2 $a$ minus 7 $b$ over $a$ plus $b$. The top is right, but the other bracket is $a$ minus $b$: the second pair gives negative $b$ times 2 $a$ plus 7 $b$.'
  25:
    moments:
      - section: 'The question'
        say: 'The graph shows the curve $y$ equals $x$ squared plus 3, over $x$ plus 4, and the line $y$ equals 1. We use it to solve $x$ squared minus $x$ minus 1 equals zero.'
        write: '$y = \dfrac{x^{2} + 3}{x + 4}$ and $y = 1$; solve $x^{2} - x - 1 = 0$'
        point:
          - {figure: 0, kind: underline, target: 'y = (x² + 3)/(x + 4)', text: 'curve'}
          - {figure: 0, kind: underline, target: 'y = 1', text: 'line'}
      - section: 'Solution'
        say: 'Solution. At the points of intersection, the curve and the line have the same $y$. So equate them.'
        write: 'Solution. At the points of intersection: $\dfrac{x^{2} + 3}{x + 4} = 1$'
        point:
          - {figure: 0, kind: circle, target: {x: 119.1, y: 180}}
          - {figure: 0, kind: circle, target: {x: 230.9, y: 180}, text: 'points of intersection'}
      - say: 'Cross multiply, so $x^2 + 3$ equals 1 times $x + 4$.'
        write: '$x^{2} + 3 = x + 4$'
      - say: 'Bring every term to the left, so subtract $x$ and subtract 4 from both sides.'
        write: '$x^{2} - x + 3 - 4 = 0$'
      - say: '3 minus 4 is negative 1.'
        write: '$x^{2} - x - 1 = 0$'
      - say: 'That is exactly the equation we must solve. So its roots are the $x$-coordinates of the points of intersection.'
        write: '$\therefore$ roots $=$ $x$-coordinates of the points of intersection'
        point:
          - {line: 5, kind: arrow, from: {line: 4, at: 'x2−x−1=0'}, at: 'roots', text: 'same equation'}
      - section: 'Read the graph'
        say: 'Now read the graph. The left point of intersection is a little to the left of the $y$-axis, at about negative 0.6.'
        write: 'From the graph: $x \approx -0.6$'
        point:
          - {figure: 0, kind: circle, target: {x: 119.1, y: 180}, text: '≈ −0.6'}
      - say: 'The right point of intersection is between 1 and 2, at about 1.6.'
        write: 'and $x \approx 1.6$'
        point:
          - {figure: 0, kind: circle, target: {x: 230.9, y: 180}, text: '≈ 1.6'}
      - section: 'Check'
        say: 'Check with the quadratic formula. Compare with $a x^2 + b x + c = 0$, so $a$ is 1, $b$ is negative 1, and $c$ is negative 1.'
        write: 'Check: $x = \dfrac{-b \pm \sqrt{b^{2} - 4ac}}{2a}$, $\ a = 1,\ b = -1,\ c = -1$'
      - say: 'Substitute. Minus negative 1 is 1. Under the root, negative 1 squared is 1, minus 4 times 1 times negative 1 is plus 4, which makes 5.'
        write: '$x = \dfrac{1 \pm \sqrt{1 + 4}}{2} = \dfrac{1 \pm \sqrt{5}}{2}$'
      - say: 'Root 5 is about 2.236. So $x$ is about 3.236 over 2, which is 1.618, or negative 1.236 over 2, which is negative 0.618.'
        write: '$x \approx \dfrac{3.236}{2} = 1.618$ or $\dfrac{-1.236}{2} = -0.618$ ✓'
      - section: 'Answer'
        say: 'Those round to 1.6 and negative 0.6, as the graph shows. Therefore $x$ is 1.6 and $x$ is negative 0.6, which is answer choice A.'
        write: '$\therefore x = 1.6$ and $x = -0.6$ (A)'
        answer: true
        point:
          - {figure: 0, kind: label, target: {x: 119.1, y: 180}, text: 'x ≈ −0.6'}
          - {figure: 0, kind: label, target: {x: 230.9, y: 180}, text: 'x ≈ 1.6'}
    traps:
      B: 'You went for negative 1.6 and 0.6. The signs are swapped. On the graph the larger point of intersection is to the right of the $y$-axis, at 1.6.'
      C: 'You went for 1.6 and 0.6. The left point of intersection is on the negative side of the $y$-axis, at negative 0.6.'
      D: 'You went for negative 1.6 and negative 0.6. The right point of intersection is on the positive side, at 1.6. One root is positive and one is negative.'
  26:
    moments:
      - section: 'The question'
        say: 'The same curve, $y$ equals $x$ squared plus 3, over $x$ plus 4, and the line $y$ equals 1. We want the values of $x$ for which the curve is below the line.'
        write: 'Curve below line: $\dfrac{x^{2} + 3}{x + 4} < 1$'
        point:
          - {figure: 0, kind: underline, target: 'y = (x² + 3)/(x + 4)', text: 'curve'}
          - {figure: 0, kind: underline, target: 'y = 1', text: 'line'}
      - section: 'Solution'
        say: 'Solution. First find the points of intersection. There the curve equals 1. Cross multiply by $x + 4$.'
        write: 'Solution. At the points of intersection: $x^{2} + 3 = x + 4$'
        point:
          - {figure: 0, kind: circle, target: {x: 119.1, y: 180}}
          - {figure: 0, kind: circle, target: {x: 230.9, y: 180}, text: 'points of intersection'}
      - say: 'Bring every term to the left. 3 minus 4 is negative 1.'
        write: '$x^{2} - x - 1 = 0$'
      - say: 'From the graph, the points of intersection are at about negative 0.6 and about 1.6.'
        write: 'From the graph: $x \approx -0.6$ and $x \approx 1.6$'
        point:
          - {figure: 0, kind: circle, target: {x: 119.1, y: 180}, text: '≈ −0.6'}
          - {figure: 0, kind: circle, target: {x: 230.9, y: 180}, text: '≈ 1.6'}
      - section: 'Read the region'
        say: 'These two values split the $x$-axis into three intervals. In each interval the curve stays on one side of the line.'
        write: 'Intervals: $x < -0.6$, $\ -0.6 < x < 1.6$, $\ x > 1.6$'
        point:
          - {figure: 0, kind: label, target: {x: 70, y: 230}, text: 'x < −0.6'}
          - {figure: 0, kind: label, target: {x: 175, y: 230}, text: 'between'}
          - {figure: 0, kind: label, target: {x: 290, y: 230}, text: 'x > 1.6'}
      - say: 'On the graph, the curve dips below the line only in the middle interval, between the two points of intersection.'
        write: 'From the graph: curve below $y = 1$ for $-0.6 < x < 1.6$'
        point:
          - {figure: 0, kind: arrow, target: {x: 175, y: 194}, text: 'below the line'}
      - section: 'Check'
        say: 'Check with a point in the middle interval, $x$ equals 0. 0 plus 3, over 0 plus 4, is 3 over 4, which is less than 1. Below the line.'
        write: 'Check: $x = 0$: $y = \dfrac{0 + 3}{0 + 4} = \dfrac{3}{4} < 1$ ✓'
        point:
          - {figure: 0, kind: circle, target: {x: 150, y: 192.5}, text: 'x = 0'}
      - say: 'And a point outside, $x$ equals 3. 9 plus 3, over 3 plus 4, is 12 over 7, which is more than 1. Above the line, as expected.'
        write: '$x = 3$: $y = \dfrac{9 + 3}{3 + 4} = \dfrac{12}{7} > 1$ ✓'
        point:
          - {figure: 0, kind: circle, target: {x: 300, y: 144}, text: 'x = 3'}
      - section: 'Answer'
        say: 'Therefore the curve is below the line when $x$ is between negative 0.6 and 1.6, which is answer choice A.'
        write: '$\therefore -0.6 < x < 1.6$ (A)'
        answer: true
    traps:
      B: 'You went for negative 1.6 to 0.6. Those points of intersection have their signs swapped. The curve meets the line at negative 0.6 and 1.6, and it is below the line between them.'
      C: 'You went for $x$ less than negative 0.6 or greater than 1.6. That is where the curve is above the line. At $x = 0$ the curve is three-quarters, below 1, so the answer is the middle interval.'
      D: 'You went for 0 to 3. At $x = 3$ the curve is 12 over 7, which is above the line. The curve is below the line only between negative 0.6 and 1.6.'
  27:
    moments:
      - section: 'The question'
        say: 'The solutions of $x$ squared minus $2x$ minus 1 equals 0 are where two graphs meet. One graph is $y$ equals 2 plus $x$ minus $x$ squared. We want the other.'
        write: '$x^{2} - 2x - 1 = 0$; one graph $y = 2 + x - x^{2}$; second graph $= ?$'
      - section: 'Solution'
        say: 'Solution. The standard method is to write the graph and the equation one under the other, number them, and add or subtract to remove the $x$ squared.'
        write: 'Solution: $y = 2 + x - x^{2}$ ... (1)'
      - say: 'The equation to be solved goes under it, with 0 on the left.'
        write: '$0 = x^{2} - 2x - 1$ ... (2)'
      - say: 'Equation (1) has minus $x$ squared and (2) has plus $x$ squared. Adding them removes the $x$ squared.'
        write: '(1) $+$ (2): $\ y + 0 = 2 + x - x^{2} + x^{2} - 2x - 1$'
      - say: 'Minus $x$ squared plus $x$ squared is zero. $x$ minus $2x$ is minus $x$, and 2 minus 1 is 1.'
        write: '$y = 1 - x$'
      - say: 'So the second graph is the straight line $y$ equals 1 minus $x$.'
        write: '$\therefore$ second graph: $y = 1 - x$'
      - section: 'Check'
        say: 'To check, where the two graphs meet, their $y$ values are equal. So set 2 plus $x$ minus $x$ squared equal to 1 minus $x$.'
        show_sketch: true
        write: 'Check: $2 + x - x^{2} = 1 - x$'
        point:
          - {figure: sketch, kind: underline, target: 'y = 2 + x − x²'}
          - {figure: sketch, kind: underline, target: 'y = 1 − x'}
      - say: 'Move everything to the right, so add $x$ squared, subtract $x$ and subtract 2 from both sides.'
        write: '$0 = x^{2} - x - x + 1 - 2$'
      - say: 'Minus $x$ minus $x$ is minus $2x$, and 1 minus 2 is minus 1. That is the equation we were given.'
        write: '$0 = x^{2} - 2x - 1\ \checkmark$'
        point:
          - {figure: sketch, kind: circle, target: '1 − √2'}
          - {figure: sketch, kind: circle, target: '1 + √2', text: 'the solutions'}
      - section: 'Answer'
        say: 'Therefore the second graph is $y$ equals 1 minus $x$, which is option A.'
        write: '$\therefore y = 1 - x$'
        answer: true
    traps:
      B: 'You went for $y = 1 + x$. Equating it to the curve gives $x^{2} = 1$, not our equation. Adding (1) and (2) gives $y = 1 - x$.'
      C: 'You went for $y = x - 1$. Both signs are reversed. Equating it to the curve gives $x^{2} - 3 = 0$. Adding (1) and (2) gives $y = 1 - x$.'
      D: 'You went for $y = 3x + 3$. Equating that to the curve gives $x^{2} + 2x + 1 = 0$, not our equation. Adding (1) and (2) gives $y = 1 - x$.'
  28:
    moments:
      - section: 'The question'
        say: 'In an A.P., the 8th and 9th terms add up to 72, and the 4th term is negative 6. We want the common difference. Two facts and two unknowns give two equations.'
        write: '$T_{8} + T_{9} = 72,\quad T_{4} = -6,\quad d = ?$'
        doodle: {name: 'custom:1988_q28_a', id: stairs, caption: 'each step up is d', size: scene}
      - section: 'Solution'
        say: 'Solution. Let the first term be $a$ and the common difference be $d$. The $n$th term of an A.P. is $a$ plus $n$ minus 1, times $d$.'
        write: 'Solution: $T_{n} = a + (n - 1)d$'
      - say: 'For the 8th term, $n$ minus 1 is 7. For the 9th term, $n$ minus 1 is 8.'
        write: '$T_{8} = a + 7d,\quad T_{9} = a + 8d$'
        doodle_do:
          - {id: stairs, op: highlight, part: t89}
      - say: 'The question says they add up to 72.'
        write: '$(a + 7d) + (a + 8d) = 72$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '= [[a + 7d]]'}, at: '(a + 7d)', text: 'T8'}
          - {line: 3, kind: move, from: {line: 2, at: '= [[a + 8d]]'}, at: '(a + 8d)', text: 'T9'}
      - say: '$a$ plus $a$ is $2a$, and $7d$ plus $8d$ is $15d$. Call this equation 1.'
        write: '$2a + 15d = 72 \quad \ldots (1)$'
      - say: 'For the 4th term, $n$ minus 1 is 3, and it equals negative 6. Call this equation 2.'
        write: '$T_{4} = a + 3d = -6 \quad \ldots (2)$'
        doodle_do:
          - {id: stairs, op: highlight, part: t4}
      - section: 'Eliminate a'
        say: 'To eliminate $a$, multiply equation 2 by 2. Call it equation 3.'
        write: '$(2) \times 2:\quad 2a + 6d = -12 \quad \ldots (3)$'
      - say: 'Now equation 1 minus equation 3. $2a$ minus $2a$ is 0, and $15d$ minus $6d$ is $9d$.'
        write: '$(1) - (3):\quad 9d = 72 - (-12)$'
      - say: '72 minus negative 12 is 72 plus 12, which is 84.'
        write: '$9d = 84$'
      - say: 'Divide both sides by 9.'
        write: '$d = \dfrac{84}{9} = \dfrac{28}{3}$'
      - say: '28 divided by 3 is 9, remainder 1. Therefore $d$ is 9 and 1 over 3. That is the height of each step.'
        write: '$\therefore\ d = 9\tfrac{1}{3}$'
        doodle_do:
          - {id: stairs, op: label, part: step, text: 'd = 9⅓'}
      - section: 'Check'
        say: 'Check. Substitute $d$ in equation 2, and $a$ is negative 6 minus 3 times 28 over 3, which is negative 6 minus 28, negative 34.'
        write: 'Check: $a = -6 - 3\left(\dfrac{28}{3}\right) = -34$'
      - say: 'In equation 1, $2a$ is negative 68, and 15 times 28 over 3 is 140. Negative 68 plus 140 is 72. Correct.'
        write: '$2(-34) + 15\left(\dfrac{28}{3}\right) = -68 + 140 = 72\ \checkmark$'
      - say: 'Therefore the common difference is 9 and 1 over 3, which is answer choice D.'
        write: '$\therefore\ d = 9\tfrac{1}{3}$'
        answer: true
    traps:
      A: 'You went for 4. Put it back: with $d$ equal to 4, equation 2 gives $a$ as negative 18, and $2a + 15d$ is negative 36 plus 60, which is 24, not 72.'
      B: 'You went for 8. That is 72 divided by 9, which ignores the 4th term. Eliminating $a$ gives $9d$ equals 72 plus 12, which is 84.'
      C: 'You went for 6 and 2 over 3. That is 60 over 9, from 72 minus 12. But (1) minus (3) is 72 minus negative 12, which is 72 plus 12, so $9d$ is 84.'
  29:
    moments:
      - section: 'The question'
        say: 'A G.P. starts at 7, and its fourth term is 189. We want the sum of the first three terms. First we need the common ratio.'
        write: '$T_{1} = 7,\quad T_{4} = 189,\quad S_{3} = ?$'
        doodle: {name: 'custom:1988_q29_a', id: gp, caption: 'each term is the last times r'}
      - section: 'Solution'
        say: 'Solution. List what is given. In a G.P., a geometric progression, $a$ is the first term, so $a$ is 7. The 4th term is 189.'
        write: 'Solution: $a = 7,\quad T_{4} = 189,\quad r = ?$'
      - say: 'The $n$th term of a G.P. is $a$ times $r$ to the power $n$ minus 1.'
        write: '$T_{n} = ar^{n - 1}$'
      - say: 'For the 4th term, $n$ minus 1 is 3. Substitute $a$ equals 7.'
        write: '$T_{4} = 7r^{3} = 189$'
        point:
          - {line: 3, kind: move, from: {line: 1, at: 'a = 7'}, at: '7r3', text: 'a'}
      - say: 'Divide both sides by 7. 189 divided by 7 is 27.'
        write: '$r^{3} = \dfrac{189}{7} = 27$'
      - say: 'Take the cube root. 3 times 3 times 3 is 27, so $r$ is 3. Every arrow is times 3.'
        write: '$r = \sqrt[3]{27} = 3$'
        doodle_do:
          - {id: gp, op: label, part: ratios, text: 'r = 3'}
      - section: 'The sum'
        say: '$r$ is bigger than 1, so we use this form of the sum of $n$ terms of a G.P., which is $a$, times $r$ to the $n$ minus 1, over $r$ minus 1.'
        write: '$S_{n} = \dfrac{a(r^{n} - 1)}{r - 1}$'
      - say: 'Substitute $a$ equals 7, $r$ equals 3 and $n$ equals 3.'
        write: '$S_{3} = \dfrac{7(3^{3} - 1)}{3 - 1}$'
      - say: '3 cubed is 27, and 27 minus 1 is 26. On the bottom, 3 minus 1 is 2.'
        write: '$= \dfrac{7 \times 26}{2}$'
      - say: '26 divided by 2 is 13, and 7 times 13 is 91.'
        write: '$= 7 \times 13 = 91$'
      - say: 'Therefore the sum of the first three terms is 91.'
        write: '$\therefore\ S_{3} = 91$'
      - section: 'Check'
        say: 'Check by writing the terms. 7, then 7 times 3 is 21, then 21 times 3 is 63. And 63 times 3 is 189, the 4th term.'
        write: 'Check: $7,\ 21,\ 63,\ 189$'
        doodle_do:
          - {id: gp, op: label, part: b2, text: '21'}
          - {id: gp, op: label, part: b3, text: '63'}
      - say: '7 plus 21 plus 63 is 91. It agrees.'
        write: '$7 + 21 + 63 = 91\ \checkmark$'
      - say: 'Therefore the sum of the first three terms is 91, which is answer choice B.'
        write: '$\therefore\ S_{3} = 91$'
        answer: true
    traps:
      A: 'You went for 182. That is 7 times 26, the top of the sum formula. You still divide by $r$ minus 1, which is 2: 182 over 2 is 91.'
      C: 'You went for 63. That is the third term on its own. The question wants the sum of the first three terms: 7 plus 21 plus 63, which is 91.'
      D: 'You went for 28. That is only the first two terms, 7 plus 21. $S_{3}$ adds the third term, 63, as well.'
  30:
    moments:
      - section: 'The question'
        say: 'Both given angles sit outside the circle. Bring them inside first, then an isosceles triangle and a circle theorem lead to $x$.'
        write: '$QR = RS$, ext. $\angle$ at $S = 100^{\circ}$, $\angle QRT = 120^{\circ}$, $x = ?$'
        point:
          - {figure: 0, kind: circle, target: '100°'}
          - {figure: 0, kind: circle, target: '120°'}
          - {figure: 0, kind: circle, target: 'x', text: '?'}
      - section: 'Solution'
        say: 'Solution. We work on the diagram, and each angle we find goes on it, with its reason in brackets.'
        write: 'Solution'
      - say: 'At $S$, the 100 degrees and angle $PSR$ lie on the straight line. 180 minus 100 is 80. The reason is angles on a straight line.'
        write: '$\angle PSR = 180^{\circ} - 100^{\circ} = 80^{\circ}$ ($\angle$s on a str. line)'
        point:
          - {figure: 0, kind: arc, target: PSR, text: '80°'}
      - say: 'At $R$, angle $QRT$ and angle $QRS$ lie on the straight line $SRT$. 180 minus 120 is 60. Same reason.'
        write: '$\angle QRS = 180^{\circ} - 120^{\circ} = 60^{\circ}$ ($\angle$s on a str. line)'
        point:
          - {figure: 0, kind: arc, target: QRS, text: '60°'}
      - say: 'Now join $Q$ to $S$. That makes triangle $QRS$, with the equal sides $QR$ and $RS$.'
        write: 'Join $QS$'
        point:
          - {figure: 0, kind: highlight, target: QS, text: 'join QS'}
      - say: '$QR$ equals $RS$, so the base angles at $Q$ and $S$ are equal. The reason is base angles of an isosceles triangle.'
        write: '$\angle RQS = \angle RSQ$ (base $\angle$s of isos. $\triangle$)'
        point:
          - {figure: 0, kind: highlight, target: QR}
          - {figure: 0, kind: highlight, target: RS}
      - say: 'The two base angles and the 60 at $R$ add up to 180, by the angle sum of a triangle.'
        write: '$2\angle RQS + 60^{\circ} = 180^{\circ}$ ($\angle$ sum of $\triangle$)'
      - say: '180 minus 60 is 120, and 120 divided by 2 is 60.'
        write: '$\angle RQS = \dfrac{180^{\circ} - 60^{\circ}}{2} = 60^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: RQS, text: '60°'}
      - say: 'Angle $SPR$ and angle $SQR$ both stand on the chord $SR$, on the same side. The reason is angles in the same segment.'
        write: '$\angle SPR = \angle SQR = 60^{\circ}$ ($\angle$s in same segment)'
        point:
          - {figure: 0, kind: arc, target: SPR, text: '60°'}
      - say: 'Now triangle $PRS$, where $x$ at $R$, 80 at $S$ and 60 at $P$ add up to 180. The reason is the angle sum of a triangle.'
        write: '$x + 80^{\circ} + 60^{\circ} = 180^{\circ}$ ($\angle$ sum of $\triangle$)'
      - say: '80 plus 60 is 140. 180 minus 140 is 40.'
        write: '$x = 180^{\circ} - 140^{\circ} = 40^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: PRS, text: '40°'}
      - section: 'Check'
        say: 'Check another way. $Q$ is opposite $S$ in the cyclic quadrilateral $PQRS$. 180 minus 80 is 100. The reason is opposite angles of a cyclic quadrilateral.'
        write: '$\angle PQR = 180^{\circ} - 80^{\circ} = 100^{\circ}$ (opp. $\angle$s of cyclic quad.)'
        point:
          - {figure: 0, kind: arc, target: PQR, text: '100°'}
      - say: 'Take away the 60 we found at $Q$, so angle $PQS$ is 100 minus 60, which is 40.'
        write: '$\angle PQS = 100^{\circ} - 60^{\circ} = 40^{\circ}$'
      - say: 'Angle $PRS$ and angle $PQS$ stand on the chord $PS$, so they are equal, which gives 40 again.'
        write: '$x = \angle PQS = 40^{\circ}$ ($\angle$s in same segment) $\checkmark$'
      - say: 'Therefore $x$ is 40 degrees, option D.'
        write: '$\therefore x = 40^{\circ}$ (D)'
        answer: true
    traps:
      A: 'You went for 80 degrees. That is angle $PSR$, at $S$. The question wants $x$, the angle at $R$ in triangle $PRS$: 180 minus 80 minus 60, which is 40.'
      B: 'You went for 60 degrees. That is the angle at $R$ in triangle $QRS$, or the angle at $P$, found on the way. Keep going to $x$: 180 minus 80 minus 60 is 40.'
      C: 'You went for 45 degrees. There is no need to guess. In triangle $PRS$ the other angles are 80 and 60, so $x$ is 180 minus 140, which is 40.'
  31:
    moments:
      - section: 'The question'
        say: 'The line from $Q$ bends at $R$ and comes back up to $S$. With a bend like this, one extra line does all the work, which is a third parallel line through the bend.'
        write: '$PQ \parallel ST$, $\angle PQR = 3x^{\circ}$, $\angle RST = x^{\circ}$, $\angle QRS = 40^{\circ}$'
        point:
          - {figure: 0, kind: circle, target: '3x°'}
          - {figure: 0, kind: circle, target: 'x°'}
          - {figure: 0, kind: circle, target: '40°'}
      - section: 'Solution'
        say: 'Solution. We re-draw the diagram, so we can add our own line to it.'
        write: 'Solution'
        show_sketch: true
      - say: 'Through $R$, draw the line $RX$ parallel to $PQ$ and $ST$. Now each arm of the bend makes an angle with a parallel line we can use.'
        write: 'Draw $RX \parallel PQ \parallel ST$ (construction)'
        point:
          - {figure: sketch, kind: highlight, target: XR, text: 'new parallel line'}
      - say: 'Angle $PQR$ and angle $QRX$ lie between $PQ$ and $RX$, on the same side of $QR$. Co-interior angles add up to 180 degrees.'
        write: '$\angle QRX + 3x = 180^{\circ}$ (co-int. $\angle$s, $PQ \parallel RX$)'
        point:
          - {figure: sketch, kind: arc, target: PQR, text: '3x'}
          - {figure: sketch, kind: arc, target: QRX, text: '?'}
      - say: 'Take $3x$ to the other side.'
        write: '$\angle QRX = 180^{\circ} - 3x$'
        point:
          - {figure: sketch, kind: arc, target: QRX, text: '180 − 3x'}
      - say: 'Now the other arm. Angle $RST$ and angle $SRX$ make a Z between $ST$ and $RX$. Alternate angles are equal.'
        write: '$\angle SRX = \angle RST = x$ (alt. $\angle$s, $ST \parallel RX$)'
        point:
          - {figure: sketch, kind: arc, target: RST, text: 'x'}
          - {figure: sketch, kind: arc, target: SRX, text: 'x'}
      - say: 'In the diagram, $RQ$ lies inside angle $SRX$. So angle $QRS$ is the big angle, $SRX$, minus the small one, $QRX$.'
        write: '$\angle QRS = \angle SRX - \angle QRX$'
        point:
          - {figure: sketch, kind: arc, target: QRS, text: '40°'}
      - say: 'Put in what we have, which is 40 for angle $QRS$, $x$ for angle $SRX$, and 180 minus $3x$ for angle $QRX$.'
        write: '$40 = x - (180 - 3x)$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '180∘−3x'}, at: '(180−3x)', text: 'from here'}
      - say: 'Open the bracket. Minus times minus $3x$ gives plus $3x$.'
        write: '$40 = x - 180 + 3x$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '(180 [[− 3x]])'}, at: '+ 3x', text: 'sign changes'}
      - say: 'Collect like terms, and $x$ plus $3x$ is $4x$.'
        write: '$40 = 4x - 180$'
      - say: 'Add 180 to both sides. 40 plus 180 is 220.'
        write: '$4x = 40 + 180 = 220$'
      - say: 'Divide both sides by 4. 220 divided by 4 is 55.'
        write: '$x = \dfrac{220}{4} = 55$'
      - section: 'Check'
        say: 'Check. $3x$ is 165, so angle $QRX$ is 180 minus 165, which is 15. Angle $SRX$ is $x$, 55.'
        write: '$\angle QRX = 180^{\circ} - 165^{\circ} = 15^{\circ}$, $\angle SRX = 55^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: QRX, text: '15°'}
          - {figure: sketch, kind: arc, target: SRX, text: '55°'}
      - say: '55 minus 15 is 40, the angle $QRS$ we were given.'
        write: '$55^{\circ} - 15^{\circ} = 40^{\circ}\ \checkmark$'
      - say: 'Therefore $x$ is 55, option A.'
        write: '$\therefore x = 55$ (A)'
        answer: true
    traps:
      B: 'You went for 60. Then angle $PQR$ is 3 times 60, which is 180: a straight line, with no bend at $Q$. Solving 40 equals $4x$ minus 180 gives 55.'
      C: 'You went for 65. Then $3x$ is 195, more than 180, so angle $QRX$ would be negative. Solving 40 equals $4x$ minus 180 gives 55.'
      D: 'You went for 75. Then $3x$ is 225, far more than 180. Angle $QRS$ is angle $SRX$ minus angle $QRX$, which gives $4x$ minus 180 equals 40, so $x$ is 55.'
  32:
    moments:
      - section: 'The question'
        say: 'We have three exterior angles, 35, 18 and 115 degrees. A regular polygon exists only when the number of sides comes out whole, and one division tells us.'
        write: '(i) $35^{\circ}$ (ii) $18^{\circ}$ (iii) $115^{\circ}$: regular polygon possible?'
      - section: 'Solution'
        say: 'Solution. In a regular polygon all the exterior angles are equal, and the exterior angles of any polygon add up to 360 degrees. Picture a full turn cut into equal slices.'
        doodle: {name: 'custom:1988_q32_a', id: turn, caption: '360° cut into equal slices'}
        write: 'Solution'
      - say: 'So the number of sides is 360 divided by one exterior angle, because the sum of exterior angles is 360. And $n$ must be a whole number, since there is no part of a side.'
        write: '$n = \dfrac{360^{\circ}}{\text{ext. } \angle}$ (sum of ext. $\angle$s $= 360^{\circ}$)'
      - say: 'Test 35. 35 times 10 is 350, with 10 left over, so 360 over 35 is 10 and two sevenths. That is not a whole number, so it is not possible.'
        write: '(i) $n = \dfrac{360}{35} = 10\tfrac{2}{7}$, not whole: not possible'
      - say: 'Test 18. 18 times 20 is exactly 360, so $n$ is 20, which is a regular polygon with 20 sides. The slices fit with none left over.'
        doodle_do: [{id: turn, op: circle, part: slice, text: '18°'}]
        write: '(ii) $n = \dfrac{360}{18} = 20$, whole: possible'
        point:
          - {line: 4, kind: highlight, at: '= 20', to: {doodle: turn, part: turn}}
      - say: 'Test 115. 115 times 3 is 345, with 15 left over, so 360 over 115 is 3 and three twenty-thirds. That is not a whole number, so it is not possible.'
        write: '(iii) $n = \dfrac{360}{115} = 3\tfrac{3}{23}$, not whole: not possible'
      - section: 'Check'
        say: 'Check the one that works. 20 exterior angles of 18 degrees make 20 times 18, which is the full 360. Look at the turn again, with 20 slices and none left over.'
        write: '$20 \times 18^{\circ} = 360^{\circ}$ $\checkmark$'
        doodle_do: [{id: turn, op: label, part: turn, text: '20 slices, none left'}]
      - say: 'Therefore only the second angle, 18 degrees, gives a regular polygon. That is (ii) only, option B.'
        write: '$\therefore$ (ii) only (B)'
        answer: true
    traps:
      A: 'You went for (i) and (ii). 18 works, but 35 does not: 360 divided by 35 is 10 and two sevenths, and a polygon cannot have part of a side.'
      C: 'You went for (ii) and (iii). 18 works, but 115 does not: 360 divided by 115 is 3 and three twenty-thirds, not a whole number.'
      D: 'You went for (iii) only. 360 divided by 115 is not a whole number, so 115 cannot work. The one that does is 18, giving 20 sides.'
  33:
    moments:
      - section: 'The question'
        say: 'A trapezium built from parallelograms. The parallelogram''s area gives us the height, and opposite sides give us the long top side.'
        write: '$PS = 7$ cm, $RY = 9$ cm, area $PQRS = 56\ \text{cm}^{2}$, area $PQTS = ?$'
        point:
          - {figure: 0, kind: circle, target: '7 cm'}
          - {figure: 0, kind: circle, target: '9 cm'}
      - section: 'Solution'
        say: 'Solution. The parallelogram and the trapezium sit between the same two parallel lines, $PS$ and $QT$, so they have the same height. Let the height be $h$.'
        write: 'Solution. Let the height be $h$ cm.'
        point:
          - {figure: 0, kind: highlight, target: PS}
          - {figure: 0, kind: highlight, target: QT, text: 'same height'}
      - say: 'The area of a parallelogram is base times height. Here the base is $PS$.'
        write: 'Area of //gm $PQRS = PS \times h$'
      - say: 'Substitute, so 7 times $h$ is 56.'
        write: '$7 \times h = 56$'
      - say: 'Divide both sides by 7. 56 divided by 7 is 8.'
        write: '$h = \dfrac{56}{7} = 8$ cm'
      - say: 'Now the top side $QT$, piece by piece. $QR$ is opposite $PS$ in the parallelogram $PQRS$, so it is 7. The reason is opposite sides of a parallelogram.'
        write: '$QR = PS = 7$ cm (opp. sides of //gm)'
        point:
          - {figure: 0, kind: highlight, target: QR, text: '7'}
      - say: '$PYTS$ is a parallelogram too, because $PY$ is parallel to $ST$, and $YT$ is parallel to $PS$. So $YT$ is also 7, for the same reason.'
        write: '$YT = PS = 7$ cm (opp. sides of //gm $PYTS$)'
        point:
          - {figure: 0, kind: highlight, target: YT, text: '7'}
      - say: 'Add the three pieces, and 7 plus 9 plus 7 is 23.'
        write: '$QT = QR + RY + YT = 7 + 9 + 7 = 23$ cm'
        point:
          - {figure: 0, kind: label, target: QT, text: '23 cm'}
      - say: 'The area of a trapezium is half the sum of the parallel sides, times the height between them.'
        write: 'Area of trapezium $= \tfrac{1}{2}(a + b)h$'
      - say: 'Substitute. The parallel sides are 7 and 23, and the height is 8.'
        write: 'Area $PQTS = \tfrac{1}{2}(7 + 23) \times 8$'
        point:
          - {line: 9, kind: move, from: {line: 4, at: '= 8 cm'}, at: '× 8', text: 'height'}
      - say: '7 plus 23 is 30. Half of 30 is 15, and 15 times 8 is 120.'
        write: '$= \tfrac{1}{2} \times 30 \times 8 = 15 \times 8 = 120\ \text{cm}^{2}$'
      - section: 'Check'
        say: 'Check by pieces. The trapezium is the parallelogram $PQRS$ plus triangle $SRT$. $RT$ is 9 plus 7, which is 16, and the height is 8.'
        write: 'Area $\triangle SRT = \tfrac{1}{2} \times 16 \times 8 = 64\ \text{cm}^{2}$'
        point:
          - {figure: 0, kind: highlight, target: RT, text: '16'}
      - say: '56 plus 64 is 120, the same answer.'
        write: '$56 + 64 = 120\ \text{cm}^{2}$ $\checkmark$'
      - say: 'Therefore the area of the trapezium is 120 square centimetres, option C.'
        write: '$\therefore$ area $PQTS = 120\ \text{cm}^{2}$ (C)'
        answer: true
    traps:
      A: 'You went for 56. That is the area of the parallelogram $PQRS$ alone. The trapezium stretches all the way to $T$: half of 7 plus 23, times 8, is 120.'
      B: 'You went for 112. That is 2 times 56, as if the trapezium were two copies of the parallelogram. Half of 7 plus 23, times the height 8, gives 120.'
      D: 'You went for 176. That is 56 plus 120, counting the parallelogram again. $PQRS$ is already inside the trapezium, whose area is 120.'
  34:
    moments:
      - section: 'The question'
        say: 'Take a rectangular card and cut a quarter circle out of each corner. The edge of what is left is part straight, part curved. How long is it all the way round?'
        write: 'Find the perimeter of the remaining figure.'
      - say: 'Write Solution, then sketch the rectangle with a quadrant of radius 6 cm cut from each corner.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '6 cm', text: 'r', 'on': 'radius 6 cm'}
      - section: 'What we know'
        say: 'List the givens. Length is 25 cm, width is 18 cm, and each quadrant has radius r equal to 6 cm.'
        write: '$l = 25$ cm, $b = 18$ cm, $r = 6$ cm'
      - section: 'The plan'
        say: 'The perimeter is made of the straight edges that are left, plus the four curved arcs.'
        write: 'Perimeter $=$ straight edges $+$ 4 arcs'
      - section: 'Straight edges'
        say: 'Each side loses 6 cm at each end, which is 12 cm. A long side becomes 25 minus 12, which is 13.'
        write: 'Long side $= 25 - 2 \times 6 = 13$ cm'
        point:
          - {figure: sketch, kind: circle, target: '25 cm', 'on': 'long side'}
      - say: 'A short side becomes 18 minus 12, which is 6.'
        write: 'Short side $= 18 - 2 \times 6 = 6$ cm'
        point:
          - {figure: sketch, kind: circle, target: '18 cm', 'on': 'short side'}
      - say: 'There are two of each, so 2 times 13 plus 2 times 6, which is 26 plus 12, or 38 cm.'
        write: 'Straight edges $= 2(13) + 2(6) = 26 + 12 = 38$ cm'
      - section: 'The arcs'
        say: 'Each arc is a quadrant, so theta is 90 degrees. The length of arc is L equals theta over 360, times 2 pi r.'
        write: '$L = \dfrac{\theta}{360} \times 2\pi r$'
        point:
          - {figure: sketch, kind: arrow, target: {x: 258, y: 77}, text: 'quadrant arc', 'on': 'Each arc'}
      - say: 'Substitute to get 90 over 360, times 2 pi times 6. 90 over 360 is 1 over 4, and 2 times 6 is 12. 1 quarter of 12 pi is 3 pi.'
        write: '$L = \dfrac{90}{360} \times 2\pi \times 6 = \dfrac{1}{4} \times 12\pi = 3\pi$ cm'
      - say: 'There are four arcs, so 4 times 3 pi is 12 pi. The four quarters make one whole circle.'
        write: '4 arcs $= 4 \times 3\pi = 12\pi$ cm'
      - section: 'Put together'
        say: 'Substitute into the plan, giving 38 plus 12 pi.'
        write: 'Perimeter $= 38 + 12\pi$'
        point:
          - {line: 10, kind: move, from: {line: 6, at: '= [[38]]cm'}, at: '38', text: 'straight', 'on': '38 plus'}
          - {line: 10, kind: move, from: {line: 9, at: '= [[12π]]cm'}, at: '12π', text: 'arcs', 'on': 'plus 12 pi'}
      - say: 'Therefore the perimeter is 38 plus 12 pi centimetres.'
        write: '$\therefore$ perimeter $= (38 + 12\pi)$ cm'
        point:
          - {figure: sketch, kind: label, target: 'perimeter = ?', text: '38 + 12π', 'on': 'Therefore'}
      - section: 'Check'
        say: 'To check, the old perimeter was 2 times 25 plus 2 times 18, which is 86. We lost 8 corner pieces of 6 cm, which is 48, so 86 minus 48 is 38. The arcs are added on.'
        write: 'Check: $86 - 8 \times 6 = 38$ ✓'
      - section: 'Answer'
        say: 'So the perimeter is 38 plus 12 pi centimetres, which is answer choice B.'
        write: '$\therefore$ perimeter $= (38 + 12\pi)$ cm (B)'
        answer: true
    traps:
      A: 'You went for 38 cm. That is only the straight edges. Cutting the corners adds four curved arcs of 3 pi each, which together make 12 pi.'
      C: 'You went for 86 minus 12 pi. 86 is the old perimeter, and the arcs have been taken away instead of added. The straight edges shrink to 38, and the arcs add 12 pi.'
      D: 'You went for 86 minus 6 pi. The straight part is not 86 any more: each side loses 12 cm, leaving 38. And the four arcs add 4 times 3 pi, which is 12 pi.'
  35:
    moments:
      - section: 'The question'
        say: 'Two triangles share the corner $Q$, and one more pair of angles is equal. Similar triangles, and the whole skill is matching the right corners.'
        write: '$\angle QTS = \angle QRP$, $PT = TQ = 6$ cm, $QS = 5$ cm, $SR = ?$'
        point:
          - {figure: 0, kind: arc, target: QTS}
          - {figure: 0, kind: arc, target: QRP}
          - {figure: 0, kind: circle, target: '5'}
      - section: 'Solution'
        say: 'Solution. Compare the small triangle $QTS$ with the big triangle $QRP$.'
        write: 'Solution. In $\triangle QTS$ and $\triangle QRP$:'
      - say: 'The angle at $T$ equals the angle at $R$, because it is given.'
        write: '$\angle QTS = \angle QRP$ (given)'
        point:
          - {figure: 0, kind: arc, target: QTS, text: 'equal'}
          - {figure: 0, kind: arc, target: QRP, text: 'equal'}
      - say: 'And the angle at $Q$ belongs to both triangles, so it is a common angle.'
        write: '$\angle TQS = \angle RQP$ (common)'
        point:
          - {figure: 0, kind: arc, target: TQS}
      - say: 'Two angles match, so the third does too, and the triangles are equiangular. Match by the angles, so $Q$ with $Q$, $T$ with $R$, and so $S$ with $P$.'
        write: '$\triangle QTS \;|||\; \triangle QRP$ (equiangular)'
      - say: 'So all three pairs of matching sides are in the same ratio, $QT$ with $QR$, $TS$ with $RP$, and $QS$ with $QP$.'
        write: '$\dfrac{QT}{QR} = \dfrac{TS}{RP} = \dfrac{QS}{QP}$'
      - say: 'We need $QP$, the whole side. 6 plus 6 is 12.'
        write: '$QP = PT + TQ = 6 + 6 = 12$ cm'
        point:
          - {figure: 0, kind: highlight, target: QP, text: '12'}
      - say: 'We know $QT$, $QS$ and $QP$, so we take the first and the last ratio.'
        write: '$\dfrac{QT}{QR} = \dfrac{QS}{QP}$'
      - say: 'Substitute. $QT$ is 6, $QS$ is 5 and $QP$ is 12.'
        write: '$\dfrac{6}{QR} = \dfrac{5}{12}$'
      - say: 'Cross-multiply. 5 times $QR$ equals 6 times 12, which is 72.'
        write: '$5 \times QR = 6 \times 12 = 72$'
      - say: 'Divide both sides by 5.'
        write: '$QR = \dfrac{72}{5}$ cm'
        point:
          - {figure: 0, kind: highlight, target: QR, text: '72/5'}
      - say: '$SR$ is the part of $QR$ beyond $S$, which is $QR$ minus $QS$.'
        write: '$SR = QR - QS = \dfrac{72}{5} - 5$'
      - say: 'Write 5 as 25 over 5. 72 minus 25 is 47.'
        write: '$SR = \dfrac{72 - 25}{5} = \dfrac{47}{5}$ cm'
        point:
          - {figure: 0, kind: label, target: SR, text: '47/5 cm'}
      - section: 'Check'
        say: 'Check the two ratios. $QS$ over $QP$ is 5 over 12. $QT$ over $QR$ is 6 divided by 72 over 5, which is 30 over 72, and that is also 5 over 12.'
        write: '$\dfrac{6}{72/5} = \dfrac{30}{72} = \dfrac{5}{12}$ $\checkmark$'
      - say: 'Therefore $SR$ is 47 over 5 centimetres, option A.'
        write: '$\therefore SR = \dfrac{47}{5}$ cm (A)'
        answer: true
    traps:
      B: 'You went for 5. That comes from matching $QT$ with $QP$, as though $TS$ were parallel to $PR$. The equal angles are at $T$ and $R$, so $QT$ goes with $QR$, which gives 47 over 5.'
      C: 'You went for 37 over 5. That is 72 over 5 minus 7, not minus 5. $QS$ is 5, which is 25 over 5, so $SR$ is 72 minus 25, over 5: 47 over 5.'
      D: 'You went for 22 over 5. Check the matching: $QT$ over $QR$ equals $QS$ over $QP$, so $QR$ is 72 over 5, and $SR$ is 72 over 5 minus 5, which is 47 over 5.'
  36:
    moments:
      - section: 'The question'
        say: 'Four angles of a pentagon carry $x$, but we never need $x$. Many students try to find it first. Watch the $x$ terms cancel in pairs.'
        write: 'Four int. $\angle$s of a pentagon given; fifth $\angle = ?$'
      - section: 'Solution'
        say: 'Solution. Let me sketch the pentagon with its four angles. Let the fifth angle be $y$.'
        show_sketch: true
        write: 'Solution. Let the fifth angle be $y$'
        point:
          - {figure: sketch, kind: circle, target: '?', text: 'y'}
      - say: 'The interior angles of a polygon with $n$ sides add up to $n$ minus 2, times 180 degrees.'
        write: 'Sum of int. $\angle$s $= (n - 2) \times 180^{\circ}$'
      - say: 'A pentagon has 5 sides. 5 minus 2 is 3, and 3 times 180 is 540.'
        write: '$= (5 - 2) \times 180^{\circ} = 540^{\circ}$'
      - say: 'Add the first pair of given angles. Minus $x$ plus $x$ is zero, and 90 plus 90 is 180.'
        write: '$(90 - x) + (90 + x) = 180$'
        point:
          - {figure: sketch, kind: circle, target: '(90 − x)°'}
          - {figure: sketch, kind: circle, target: '(90 + x)°'}
      - say: 'Now the second pair. Minus $2x$ plus $2x$ is zero, and 110 plus 110 is 220.'
        write: '$(110 - 2x) + (110 + 2x) = 220$'
        point:
          - {figure: sketch, kind: circle, target: '(110 − 2x)°'}
          - {figure: sketch, kind: circle, target: '(110 + 2x)°'}
      - say: 'All five angles add up to 540. So 180, plus 220, plus $y$, equals 540.'
        write: '$180 + 220 + y = 540$ (sum of int. $\angle$s)'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '= 180'}, at: '[[180]] + 220', text: 'first pair'}
          - {line: 6, kind: move, from: {line: 5, at: '= 220'}, at: '+ [[220]] +', text: 'second pair'}
      - say: '180 plus 220 is 400.'
        write: '$400 + y = 540$'
      - say: 'Subtract 400 from both sides. 540 minus 400 is 140.'
        write: '$y = 540 - 400 = 140^{\circ}$'
        point:
          - {figure: sketch, kind: label, target: '?', text: '140°'}
      - section: 'Check'
        say: 'To check, the four angles make 400, and 400 plus 140 is 540, the angle sum of a pentagon.'
        write: 'Check: $400^{\circ} + 140^{\circ} = 540^{\circ}\ \checkmark$'
      - say: 'Therefore the fifth angle is 140 degrees, which is option D.'
        write: '$\therefore$ fifth angle $= 140^{\circ}$'
        answer: true
    traps:
      A: 'You went for 110 degrees. That is a number copied from the given angles. The four angles add to 400, and 540 minus 400 is 140.'
      B: 'You went for 120 degrees. Check the angle sum: a pentagon''s angles add to 3 times 180, which is 540. Take away 400, and 140 is left.'
      C: 'You went for 130 degrees. Recheck the pairs: 90 plus 90 is 180, 110 plus 110 is 220, together 400. 540 minus 400 is 140.'
  37:
    moments:
      - section: 'The question'
        say: 'One point the same distance from three others. Many students copy the 50 degrees. Spot the circle hiding in the figure, and one theorem does the rest.'
        write: '$PS = RS = QS$, $\angle QSR = 50^{\circ}$; $\angle QPR = ?$'
        point:
          - {figure: 0, kind: highlight, target: SP}
          - {figure: 0, kind: highlight, target: SQ}
          - {figure: 0, kind: highlight, target: SR}
      - section: 'Solution'
        say: 'Solution. $S$ is the same distance from $P$, $Q$ and $R$. So a circle with centre $S$ passes through all three, and $SP$, $SQ$, $SR$ are its radii.'
        write: 'Solution. Circle, centre $S$, through $P$, $Q$, $R$ (radii equal)'
        point:
          - {figure: 0, kind: circle, target: S, text: 'centre'}
