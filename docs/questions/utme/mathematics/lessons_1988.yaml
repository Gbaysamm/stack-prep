  13:
    moments:
      - say: '1 over $p$ is $a$ squared plus $2ab$ plus $b$ squared, over $a$ minus $b$. And 1 over $q$ is $a$ plus $b$, over $a$ squared minus $2ab$ plus $b$ squared. We want $p$ over $q$.'
        write: '$\dfrac{1}{p} = \dfrac{a^{2} + 2ab + b^{2}}{a - b}, \quad \dfrac{1}{q} = \dfrac{a + b}{a^{2} - 2ab + b^{2}}$'
      - say: 'Here''s the plan: turn these into $p$ and $q$ by flipping them, then divide. First, spot the perfect squares. $a$ squared plus $2ab$ plus $b$ squared is $a$ plus $b$, all squared.'
        write: '$a^{2} + 2ab + b^{2} = (a + b)^{2}$'
      - say: 'And $a$ squared minus $2ab$ plus $b$ squared is $a$ minus $b$, all squared.'
        write: '$a^{2} - 2ab + b^{2} = (a - b)^{2}$'
      - say: 'Put these squares back into the two given fractions.'
        write: 'So $\dfrac{1}{p} = \dfrac{(a + b)^{2}}{a - b}, \quad \dfrac{1}{q} = \dfrac{a + b}{(a - b)^{2}}$'
      - say: 'If 1 over $p$ is a fraction, then $p$ itself is that fraction turned upside down.'
        write: '$p = \dfrac{a - b}{(a + b)^{2}}$'
        point:
          - {line: 3, kind: arrow, text: 'flip'}
      - say: 'Turn 1 over $q$ upside down in the same way.'
        write: '$q = \dfrac{(a - b)^{2}}{a + b}$'
      - say: 'Now $p$ divided by $q$. Dividing by a fraction means multiplying by that fraction turned upside down.'
        write: '$\dfrac{p}{q} = \dfrac{a - b}{(a + b)^{2}} \times \dfrac{a + b}{(a - b)^{2}}$'
      - say: 'The $a$ plus $b$ on top cancels one of the two on the bottom, leaving one $a$ plus $b$ below.'
        write: '$= \dfrac{a - b}{(a + b)(a - b)^{2}}$'
      - say: 'The $a$ minus $b$ on top cancels one of the two on the bottom, leaving just 1 on top.'
        write: '$= \dfrac{1}{(a + b)(a - b)}$'
      - say: '$a$ plus $b$ times $a$ minus $b$ is the difference of two squares, $a$ squared minus $b$ squared.'
        write: '$= \dfrac{1}{a^{2} - b^{2}}$'
      - say: 'Let''s check with $a$ equal to 2 and $b$ equal to 1. Then 1 over $p$ is 9 over 1, so $p$ is 1 over 9; and 1 over $q$ is 3 over 1, so $q$ is 1 over 3.'
        write: 'Check $a = 2,\ b = 1$: $p = \dfrac{1}{9}, \quad q = \dfrac{1}{3}$'
      - say: 'So $p$ over $q$ is 1 over 9 divided by 1 over 3, which is 1 over 3. And our answer, 1 over 2 squared minus 1 squared, is 1 over 3 as well.'
        write: '$\dfrac{p}{q} = \dfrac{1}{9} \div \dfrac{1}{3} = \dfrac{1}{3}, \quad \dfrac{1}{2^{2} - 1^{2}} = \dfrac{1}{3}$'
      - say: 'So $p$ over $q$ is 1 over $a$ squared minus $b$ squared, which is answer choice B.'
        write: 'Answer: $\dfrac{p}{q} = \dfrac{1}{a^{2} - b^{2}}$'
        answer: true
    traps:
      A: 'You went for $a$ plus $b$ over $a$ minus $b$. After flipping and multiplying, the brackets cancel down to one $a$ plus $b$ and one $a$ minus $b$, both on the bottom. The top is just 1.'
      C: 'You went for $a$ minus $b$ over $a$ plus $b$. Count the brackets carefully: $a$ minus $b$ is squared on the bottom, so it doesn''t survive on top. Both brackets end up on the bottom.'
      D: 'You went for $a$ squared minus $b$ squared. That''s the answer upside down, from dividing 1 over $p$ by 1 over $q$. Flip both first to get $p$ and $q$, then divide.'
  14:
