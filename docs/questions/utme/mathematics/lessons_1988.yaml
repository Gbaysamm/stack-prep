# UTME 1988 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1988.yaml. Answers match that file.
# The paper has no question 43.
format_version: 1
exam_year: 1988
lessons:
  1:
    moments:
      - say: 'We''re asked to simplify one and a half, divided by the expression 2 divided by a quarter of 32.'
        write: '$\dfrac{1\tfrac{1}{2}}{2 \div \tfrac{1}{4} \text{ of } 32}$'
      - say: 'The first thing we need to deal with is the word "of". "Of" means multiply, and it is worked out before the division.'
      - say: 'So a quarter of 32 is a quarter times 32.'
        write: '$\tfrac{1}{4} \text{ of } 32 = \tfrac{1}{4} \times 32$'
      - say: 'A quarter of something means divide it by 4. 32 divided by 4 is 8.'
        write: '$= 8$'
      - say: 'Now the bottom of the big fraction becomes 2 divided by 8.'
        write: '$2 \div 8$'
      - say: '2 over 8 simplifies to one quarter, dividing top and bottom by 2.'
        write: '$2 \div 8 = \tfrac{2}{8} = \tfrac{1}{4}$'
      - say: 'So the whole thing is one and a half divided by one quarter.'
        write: '$1\tfrac{1}{2} \div \tfrac{1}{4}$'
      - say: 'Let''s turn one and a half into an improper fraction. One whole is two halves, plus one more half makes three halves.'
        write: '$1\tfrac{1}{2} = \tfrac{3}{2}$'
      - say: 'Dividing by a fraction means multiplying by its reciprocal. The reciprocal of one quarter is 4.'
        write: '$\tfrac{3}{2} \div \tfrac{1}{4} = \tfrac{3}{2} \times 4$'
      - say: '3 halves times 4 is 12 halves.'
        write: '$= \tfrac{12}{2}$'
      - say: 'And 12 divided by 2 is 6. So the answer is 6, which is answer choice C.'
        write: '$= 6$'
        answer: true
    traps:
      A: 'You went for 3 over 256. That comes from making the bottom far too big, by working left to right instead of doing "of" first. A quarter of 32 is 8, and 2 divided by 8 is a quarter.'
      B: 'You went for 3 over 32. That comes from multiplying 2 by 8 instead of dividing: 2 times 8 is 16, and three halves over 16 is 3 over 32. The bottom is 2 divided by 8, which is a quarter.'
      D: 'You went for 85. That''s far too big. The bottom works out to a quarter, and three halves divided by a quarter is three halves times 4, which is 6.'
  2:
    moments:
      - say: 'This question hides two small jobs. $x$ is the sum of the prime numbers between 1 and 6, and $y$ is the H.C.F. of 6, 9 and 15. We want $x$ times $y$.'
        write: '$\text{Find } xy$'
      - say: 'First, what is a prime number? It''s a whole number with exactly two factors, 1 and itself. So 1 is not prime, because it has only one factor.'
      - say: 'Between 1 and 6, the primes are 2, 3 and 5. 4 is not prime, because 4 is 2 times 2.'
        write: '$\text{Primes: } 2,\ 3,\ 5$'
      - say: 'Now add them up. 2 plus 3 is 5, and 5 plus 5 is 10.'
        write: '$x = 2 + 3 + 5 = 10$'
      - say: 'Next, the H.C.F., the highest common factor. That''s the biggest number that divides all three. Let''s break each number into prime factors.'
      - say: '6 is 2 times 3.'
        write: '$6 = 2 \times 3$'
      - say: '9 is 3 times 3.'
        write: '$9 = 3 \times 3$'
      - say: 'And 15 is 3 times 5.'
        write: '$15 = 3 \times 5$'
      - say: 'The only factor all three share is 3. So $y$ is 3.'
        write: '$y = 3$'
      - say: 'Now multiply. 10 times 3 is 30, which is answer choice B.'
        write: '$xy = 10 \times 3 = 30$'
        answer: true
    traps:
      A: 'You went for 27. That''s 9 times 3, as if the primes added to 9. Check the list again: the primes are 2, 3 and 5, and they add to 10.'
      C: 'You went for 33. That counts 1 as a prime, making $x$ equal to 11. But 1 has only one factor, so it''s not prime, and $x$ is 10.'
      D: 'You went for 90. That uses 9 for $y$, but 9 does not divide 6 or 15. The only factor common to 6, 9 and 15 is 3.'
  3:
    moments:
      - say: 'A mass of 5.0 grams was weighed by Tunde as 5.1 grams. We want the percentage error.'
        write: '$\text{True: } 5.0\text{ g}, \quad \text{Measured: } 5.1\text{ g}$'
      - say: 'First, the error is the difference between what was measured and what is true. 5.1 minus 5.0 is 0.1 of a gram.'
        write: '$\text{Error} = 5.1 - 5.0 = 0.1\text{ g}$'
      - say: 'Percentage error compares the error with the true value, and then turns that into a percentage.'
        write: '$\text{Percentage error} = \dfrac{\text{error}}{\text{true value}} \times 100\%$'
      - say: 'Let''s put in our numbers: 0.1 over 5.0, times 100.'
        write: '$\dfrac{0.1}{5.0} \times 100\%$'
      - say: 'Multiply top and bottom by 10 to clear the decimals. 0.1 over 5 becomes 1 over 50.'
        write: '$\dfrac{0.1}{5.0} = \dfrac{1}{50}$'
      - say: '1 divided by 50 is 0.02.'
        write: '$\dfrac{1}{50} = 0.02$'
      - say: 'Now multiply by 100 to make it a percentage. 0.02 times 100 is 2.'
        write: '$0.02 \times 100\% = 2\%$'
      - say: 'That makes sense: a slip of 0.1 gram on 5 grams is small. So the percentage error is 2, which is answer choice B.'
        write: '$2\%$'
        answer: true
    traps:
      A: 'You went for 20. That comes from dividing 0.1 by 0.5 instead of by 5.0. The true mass is 5.0 grams, and 0.1 over 5 is 0.02, which is 2%.'
      C: 'You went for 0.02. That''s the error as a fraction of the true value, before it becomes a percentage. Multiply by 100 to get 2%.'
      D: 'You went for 0.2. The decimal point has slipped. 0.1 over 5 is 0.02, and times 100 that''s 2%.'
  4:
    moments:
      - say: 'We need 0.24633 divided by 0.0306, correct to one decimal place.'
        write: '$\dfrac{0.24633}{0.0306}$'
      - say: 'Dividing by a small decimal is awkward, so first let''s make the bottom a whole number. Multiply top and bottom by 10,000. That doesn''t change the value.'
        write: '$\dfrac{0.24633 \times 10000}{0.0306 \times 10000}$'
      - say: 'Moving each decimal point four places to the right, the top becomes 2463.3 and the bottom becomes 306.'
        write: '$= \dfrac{2463.3}{306}$'
      - say: 'How many 306s fit into 2463.3? Try 8. 306 times 8 is 2448.'
        write: '$306 \times 8 = 2448$'
      - say: 'Take that away. 2463.3 minus 2448 leaves 15.3.'
        write: '$2463.3 - 2448 = 15.3$'
      - say: 'Now 15.3 divided by 306. Since 306 times 5 is 1530, 306 times 0.05 is exactly 15.3.'
        write: '$15.3 \div 306 = 0.05$'
      - say: 'So the division gives 8 plus 0.05, which is 8.05.'
        write: '$\dfrac{2463.3}{306} = 8.05$'
      - say: 'Now round to one decimal place. Look at the second decimal digit. It''s 5, and 5 or more rounds up. So 8.0 goes up to 8.1.'
        write: '$8.05 \approx 8.1$'
      - say: 'Let''s check: 0.0306 times 8.05 gives back 0.24633.'
        write: '$0.0306 \times 8.05 = 0.24633$'
      - say: 'So the answer is 8.1, which is answer choice D.'
        write: '$8.1$'
        answer: true
    traps:
      A: 'You went for 0.8. The decimal point has slipped by a factor of ten. After moving the point four places in both numbers, the answer is about 8, not 0.8.'
      B: 'You went for 1.8. That''s too small: 306 fits into 2463.3 eight times, not once. The answer is 8.05, which rounds to 8.1.'
      C: 'You went for 8.0. That chops off the 5 instead of rounding. When the next digit is 5 or more, you round up, so 8.05 becomes 8.1.'
  5:
    moments:
      - say: 'Taiwo and Kehinde share a store in the ratio 11 to 9. Kehinde sells two thirds of her share to Taiwo for ₦720. We want the value of the whole store.'
        write: '$\text{Taiwo} : \text{Kehinde} = 11 : 9$'
      - say: 'Here''s the plan: the ₦720 tells us Kehinde''s share, and her share tells us the whole store through the ratio.'
      - say: 'Two thirds of Kehinde''s share is worth ₦720. Let''s call her share $K$.'
        write: '$\tfrac{2}{3} \times K = 720$'
      - say: 'To find her whole share, multiply both sides by 3 over 2.'
        write: '$K = 720 \times \tfrac{3}{2}$'
      - say: '720 divided by 2 is 360, and 360 times 3 is 1080. So Kehinde''s share is ₦1,080.'
        write: '$K = 1080$'
      - say: 'Now the ratio. 11 plus 9 is 20 parts in all, and Kehinde has 9 of them.'
        write: '$11 + 9 = 20 \text{ parts}$'
      - say: 'So 9 parts are worth ₦1,080. One part is 1080 divided by 9, which is 120.'
        write: '$1 \text{ part} = 1080 \div 9 = 120$'
      - say: 'The whole store is 20 parts. 20 times 120 is 2400.'
        write: '$20 \times 120 = 2400$'
      - say: 'Let''s check. Taiwo''s share is 11 times 120, which is 1320, and 1320 plus 1080 is 2400.'
        write: '$1320 + 1080 = 2400$'
      - say: 'So the store is worth ₦2,400, which is answer choice B.'
        write: 'Store: ₦2,400.00'
        answer: true
    traps:
      A: 'You went for ₦1,080. That''s Kehinde''s share, found halfway through. She owns 9 of the 20 parts, so keep going to reach the whole store.'
      C: 'You went for ₦3,000. Check the ratio: there are 11 plus 9, which is 20 parts, and one part is ₦120. 20 times 120 is ₦2,400.'
      D: 'You went for ₦3,600. The ₦720 is two thirds of Kehinde''s share, so her share is ₦1,080. That is 9 of the 20 parts, which makes the store ₦2,400.'
  6:
    moments:
      - say: 'Green, black and blue balls are in the ratio 5 to 2 to 1, and there are 10 blue balls. We remove 10 green and 10 black, and want the new ratio.'
        write: '$\text{green} : \text{black} : \text{blue} = 5 : 2 : 1$'
      - say: 'We can''t take balls away from a ratio directly. So the first thing we need to do is find the actual number of each colour.'
      - say: 'Blue is 1 part, and there are 10 blue balls. So one part is 10 balls.'
        write: '$1 \text{ part} = 10$'
      - say: 'Green is 5 parts. 5 times 10 is 50 green balls.'
        write: '$\text{green} = 5 \times 10 = 50$'
      - say: 'Black is 2 parts. 2 times 10 is 20 black balls.'
        write: '$\text{black} = 2 \times 10 = 20$'
      - say: 'Now remove 10 green. 50 minus 10 is 40.'
        write: '$\text{green} = 50 - 10 = 40$'
      - say: 'Remove 10 black. 20 minus 10 is 10.'
        write: '$\text{black} = 20 - 10 = 10$'
      - say: 'The blue balls are untouched, so there are still 10.'
        write: '$\text{blue} = 10$'
      - say: 'So the new ratio is 40 to 10 to 10.'
        write: '$40 : 10 : 10$'
      - say: 'Divide every part by 10, and we get 4 to 1 to 1, which is answer choice D.'
        write: '$= 4 : 1 : 1$'
        answer: true
    traps:
      A: 'You went for 1 to 1 to 1. That would need equal numbers of each colour. After the removal there are 40 green but only 10 black and 10 blue, so it''s 4 to 1 to 1.'
      B: 'You went for 4 to 2 to 1. That takes 10 away from the green but forgets the black. The black balls drop from 20 to 10, so the ratio is 4 to 1 to 1.'
      C: 'You went for 5 to 1 to 1. That removes the black balls but keeps all 50 green. The green drop to 40 as well, so the ratio is 4 to 1 to 1.'
  7:
    moments:
      - say: 'A taxpayer gets one eighth of his income tax-free, and pays 20% on the rest. His tax is ₦490. We want his income.'
        write: '$\text{tax-free part} = \tfrac{1}{8}$'
      - say: 'If one eighth is free, how much is taxed? 1 minus one eighth is seven eighths.'
        write: '$1 - \tfrac{1}{8} = \tfrac{7}{8}$'
      - say: 'He pays 20% on that taxed part, and the tax comes to ₦490.'
        write: '$20\% \times \text{taxed part} = 490$'
      - say: '20% is 0.2, so the taxed part is 490 divided by 0.2.'
        write: '$\text{taxed part} = \dfrac{490}{0.2}$'
      - say: 'Dividing by 0.2 is the same as multiplying by 5. 490 times 5 is 2450.'
        write: '$= 2450$'
      - say: 'That ₦2,450 is seven eighths of his income.'
        write: '$\tfrac{7}{8} \times \text{income} = 2450$'
      - say: 'To get the income by itself, multiply both sides by 8 over 7.'
        write: '$\text{income} = 2450 \times \tfrac{8}{7}$'
      - say: '2450 divided by 7 is 350, and 350 times 8 is 2800.'
        write: '$= 350 \times 8 = 2800$'
      - say: 'Let''s check. Seven eighths of 2800 is 2450, and 20% of 2450 is 490. That matches.'
        write: '$0.2 \times 2450 = 490$'
      - say: 'So his income is ₦2,800, which is answer choice C.'
        write: 'Income: ₦2,800.00'
        answer: true
    traps:
      A: 'You went for ₦560. That''s 490 times 8 over 7, which skips the 20% step. First find the taxed part, 490 divided by 0.2, which is ₦2,450.'
      B: 'You went for ₦2,450. That''s the taxed part, seven eighths of his income. Multiply by 8 over 7 to bring back the tax-free eighth.'
      D: 'You went for ₦3,920. That''s 490 times 8, as if the tax were one eighth of the income. The tax is 20% of seven eighths of the income, which leads to ₦2,800.'
  8:
    moments:
      - say: 'We need 8 to the power one third, times 5 to the power two thirds, all over 10 to the power two thirds.'
        write: '$\dfrac{8^{\frac{1}{3}} \times 5^{\frac{2}{3}}}{10^{\frac{2}{3}}}$'
      - say: 'The trick with fractional powers is to write every number in prime factors. Then the powers can be combined.'
      - say: 'Start with 8. 8 is 2 cubed, and 3 times one third is 1. So 8 to the one third is just 2.'
        write: '$8^{\frac{1}{3}} = (2^{3})^{\frac{1}{3}} = 2$'
      - say: 'Now 10. 10 is 2 times 5, so the power two thirds goes onto each factor.'
        write: '$10^{\frac{2}{3}} = 2^{\frac{2}{3}} \times 5^{\frac{2}{3}}$'
      - say: 'Let''s put these into the fraction.'
        write: '$\dfrac{2 \times 5^{\frac{2}{3}}}{2^{\frac{2}{3}} \times 5^{\frac{2}{3}}}$'
      - say: '5 to the two thirds is on the top and on the bottom, so it cancels.'
        write: '$= \dfrac{2}{2^{\frac{2}{3}}}$'
      - say: 'When we divide powers of the same base, we subtract the indices. The 2 on top is 2 to the power 1.'
        write: '$= 2^{1 - \frac{2}{3}}$'
      - say: '1 minus two thirds is one third.'
        write: '$= 2^{\frac{1}{3}}$'
      - say: 'And 2 to the power one third is the cube root of 2, which is answer choice C.'
        write: '$= \sqrt[3]{2}$'
        answer: true
    traps:
      A: 'You went for 2 over 5. The 5s don''t survive: 5 to the two thirds appears on top and bottom and cancels. What''s left is 2 over 2 to the two thirds, the cube root of 2.'
      B: 'You went for 5 over 3. That mixes the numbers with the indices. Break 10 into 2 times 5, cancel the fives, and you''re left with 2 to the one third.'
      D: 'You went for the cube root of 5. The powers of 5 cancel completely, so no 5 can be left in the answer. It''s the cube root of 2.'
  9:
    moments:
      - say: 'We''re given log 2 is 0.3010 and log 3 is 0.4771, and we want log 4.5 without tables.'
        write: '$\log 2 = 0.3010, \quad \log 3 = 0.4771$'
      - say: 'The plan is to build 4.5 out of 2s and 3s only, because those are the logs we know.'
      - say: '4.5 is the same as 9 over 2.'
        write: '$4.5 = \dfrac{9}{2}$'
      - say: 'And 9 is 3 squared.'
        write: '$4.5 = \dfrac{3^{2}}{2}$'
      - say: 'Now take logs. The log of a quotient is the log of the top minus the log of the bottom.'
        write: '$\log 4.5 = \log 3^{2} - \log 2$'
      - say: 'The log of a power brings the power down in front. So the log of 3 squared is 2 log 3.'
        write: '$\log 4.5 = 2\log 3 - \log 2$'
      - say: 'Substitute the values we were given.'
        write: '$= 2(0.4771) - 0.3010$'
      - say: '2 times 0.4771 is 0.9542.'
        write: '$= 0.9542 - 0.3010$'
      - say: '0.9542 minus 0.3010 is 0.6532.'
        write: '$= 0.6532$'
      - say: 'So log 4.5 is 0.6532, which is answer choice C.'
        write: '$\log_{10} 4.5 = 0.6532$'
        answer: true
    traps:
      A: 'You went for 0.3010. That''s log 2, one of the given values, not log 4.5. Build 4.5 as 9 over 2 and use both logs.'
      B: 'You went for 0.4771. That''s log 3 on its own. 4.5 is 3 squared over 2, so the answer is 2 log 3 minus log 2.'
      D: 'You went for 0.9542. That''s log 9, which is 2 log 3. You still need to subtract log 2, because 4.5 is 9 divided by 2.'
  10:
    moments:
      - say: 'We want $m$ so that $m$ plus root 3, times 1 minus root 3 all squared, equals 6 minus 2 root 3.'
        write: '$(m + \sqrt{3})(1 - \sqrt{3})^{2} = 6 - 2\sqrt{3}$'
      - say: 'First, let''s expand the square. A squared bracket has three terms: the first squared, twice the product, and the last squared.'
        write: '$(1 - \sqrt{3})^{2} = 1^{2} - 2(1)(\sqrt{3}) + (\sqrt{3})^{2}$'
      - say: '1 squared is 1. Twice 1 times root 3 is 2 root 3. And root 3 squared is 3.'
        write: '$= 1 - 2\sqrt{3} + 3$'
      - say: '1 plus 3 is 4, so the square is 4 minus 2 root 3.'
        write: '$= 4 - 2\sqrt{3}$'
      - say: 'Now multiply this by $m$ plus root 3.'
        write: '$(m + \sqrt{3})(4 - 2\sqrt{3})$'
      - say: '$m$ times 4 is $4m$. $m$ times negative 2 root 3 is negative $2m$ root 3. Root 3 times 4 is 4 root 3. Root 3 times negative 2 root 3 is negative 2 times 3, which is negative 6.'
        write: '$= 4m - 2m\sqrt{3} + 4\sqrt{3} - 6$'
      - say: 'Let''s group the whole numbers together, and the root 3 terms together.'
        write: '$= (4m - 6) + (4 - 2m)\sqrt{3}$'
      - say: 'This must equal 6 minus 2 root 3. So the whole-number parts must match, and the root 3 parts must match.'
        write: '$(4m - 6) + (4 - 2m)\sqrt{3} = 6 - 2\sqrt{3}$'
      - say: 'Match the whole numbers: $4m$ minus 6 equals 6.'
        write: '$4m - 6 = 6$'
      - say: 'Add 6 to both sides. 6 plus 6 is 12.'
        write: '$4m = 12$'
      - say: 'Divide both sides by 4. 12 divided by 4 is 3.'
        write: '$m = 3$'
      - say: 'Let''s check with the root 3 parts. 4 minus 2 times 3 is 4 minus 6, which is negative 2. That matches the negative 2 root 3.'
        write: '$4 - 2(3) = -2$'
      - say: 'Both parts agree, so $m$ is 3, which is answer choice C.'
        write: '$m = 3$'
        answer: true
    traps:
      A: 'You went for 1. Put it back in: 4 times 1 minus 6 is negative 2, not 6. Expand the square fully to 4 minus 2 root 3, then match the parts to get $m = 3$.'
      B: 'You went for 2. With $m = 2$, the whole-number part is 4 times 2 minus 6, which is 2, not 6. Matching the parts gives $m = 3$.'
      D: 'You went for 4. With $m = 4$, the whole-number part is 16 minus 6, which is 10, not 6. Matching the parts gives $m = 3$.'
  11:
    moments:
      - say: 'An 800-page book is 18 millimetres thick. We want the thickness of one leaf, in metres, in standard form.'
        write: '$800 \text{ pages} = 18\text{ mm}$'
      - say: 'Here''s the key fact. A leaf is one sheet of paper, and it carries two pages, one on each side.'
      - say: 'So the number of leaves is 800 divided by 2, which is 400.'
        write: '$\text{leaves} = 800 \div 2 = 400$'
      - say: 'The 18 millimetres is shared equally among 400 leaves. So one leaf is 18 over 400 millimetres.'
        write: '$\text{one leaf} = \dfrac{18}{400}\text{ mm}$'
      - say: 'Divide top and bottom by 2 to get 9 over 200. And 9 divided by 200 is 0.045.'
        write: '$= \dfrac{9}{200} = 0.045\text{ mm}$'
      - say: 'Now change to metres. There are 1000 millimetres in a metre, so we divide by 1000.'
        write: '$0.045 \div 1000$'
      - say: 'Dividing by 1000 moves the decimal point three places to the left. That gives 0.000045 metres.'
        write: '$= 0.000045\text{ m}$'
      - say: 'For standard form, we want a number between 1 and 10. Move the decimal point five places to the right to get 4.5, and multiply by 10 to the negative 5 to keep the value the same.'
        write: '$0.000045 = 4.5 \times 10^{-5}$'
      - say: 'A quick sense check: a sheet of paper is a few hundredths of a millimetre thick, and 0.045 millimetres fits that.'
      - say: 'So one leaf is 4.50 times 10 to the negative 5 metres, which is answer choice D.'
        write: '$4.50 \times 10^{-5}\text{ m}$'
        answer: true
    traps:
      A: 'You went for 2.25 times 10 to the negative 4. That divides by 800 pages instead of 400 leaves, and also slips a power of ten in the conversion. Use 400 leaves, then divide the millimetres by 1000.'
      B: 'You went for 4.50 times 10 to the negative 4. The 4.5 is right, but the power of ten is off by one. 0.045 millimetres is 0.000045 metres, which is 10 to the negative 5.'
      C: 'You went for 2.25 times 10 to the negative 5. That divides 18 millimetres by 800 pages. But each leaf has two pages, so there are only 400 leaves, and each is twice as thick.'
  12:
    moments:
      - say: 'We want to simplify $x$ plus 2 over $x$ plus 1, minus $x$ minus 2 over $x$ plus 2.'
        write: '$\dfrac{x + 2}{x + 1} - \dfrac{x - 2}{x + 2}$'
      - say: 'To subtract fractions, we need a common denominator. Here it''s the product of the two bottoms.'
        write: '$\text{Common denominator: } (x + 1)(x + 2)$'
      - say: 'Multiply each top by the other bottom. Keep the second product in brackets, because the minus sign applies to all of it.'
        write: '$\dfrac{(x + 2)(x + 2) - (x - 2)(x + 1)}{(x + 1)(x + 2)}$'
      - say: 'Expand the first product. $x$ plus 2 squared is $x$ squared plus $4x$ plus 4.'
        write: '$(x + 2)(x + 2) = x^{2} + 4x + 4$'
      - say: 'Now the second. $x$ times $x$ is $x$ squared, $x$ times 1 is $x$, negative 2 times $x$ is negative $2x$, and negative 2 times 1 is negative 2.'
        write: '$(x - 2)(x + 1) = x^{2} + x - 2x - 2$'
      - say: '$x$ minus $2x$ is negative $x$, so this is $x$ squared minus $x$ minus 2.'
        write: '$= x^{2} - x - 2$'
      - say: 'Now subtract. The minus sign in front changes every sign in the second bracket.'
        write: '$x^{2} + 4x + 4 - x^{2} + x + 2$'
      - say: '$x$ squared minus $x$ squared is zero. $4x$ plus $x$ is $5x$. And 4 plus 2 is 6.'
        write: '$= 5x + 6$'
      - say: 'So the fraction is $5x$ plus 6, over $x$ plus 1 times $x$ plus 2.'
        write: '$\dfrac{5x + 6}{(x + 1)(x + 2)}$'
      - say: 'Let''s check with $x$ equal to zero. The original is 2 over 1 minus negative 2 over 2, which is 2 plus 1, or 3. Our answer gives 6 over 2, which is also 3.'
        write: '$x = 0: \ 2 + 1 = 3, \quad \tfrac{6}{2} = 3$'
      - say: 'So the answer is $5x$ plus 6 over $x$ plus 1 times $x$ plus 2, which is answer choice C.'
        write: '$\dfrac{5x + 6}{(x + 1)(x + 2)}$'
        answer: true
    traps:
      A: 'You went for 3 over $x$ plus 1. That comes from cancelling terms across a subtraction, which isn''t allowed. Use the common denominator and expand both products.'
      B: 'You went for $3x$ plus 2 on top. That comes from subtracting the second product without changing all its signs. Minus negative $x$ is plus $x$, and minus negative 2 is plus 2, giving $5x$ plus 6.'
      D: 'You went for $2x$ squared plus $5x$ plus 2 on top. When you subtract, the $x$ squared terms cancel, so no $x$ squared is left. The top is $5x$ plus 6.'
  13:
    moments:
      - say: '1 over $p$ is $a$ squared plus $2ab$ plus $b$ squared, over $a$ minus $b$. And 1 over $q$ is $a$ plus $b$, over $a$ squared minus $2ab$ plus $b$ squared. We want $p$ over $q$.'
        write: '$\dfrac{1}{p} = \dfrac{a^{2} + 2ab + b^{2}}{a - b}, \quad \dfrac{1}{q} = \dfrac{a + b}{a^{2} - 2ab + b^{2}}$'
