  39:
    moments:
      - section: 'The question'
        say: 'A man stands 14 root 3 metres from a tree. The angle of elevation of the top is 30 degrees, measured from his eye, 2 metres above the ground. We want the height of the tree.'
        write: 'Distance $14\sqrt{3}$ m; elevation $30^{\circ}$; eye $2$ m up'
      - section: 'Solution'
        say: 'Solution. Let me draw it. The horizontal line goes from his eye $A$ to the point $C$ on the tree, at eye level. The angle of elevation is measured up from that horizontal.'
        write: 'Solution: $AC = 14\sqrt{3}$ m, $\angle BAC = 30^{\circ}$, $CD = 2$ m'
        show_sketch: true
        'on': 'draw'
        point:
          - {figure: sketch, kind: circle, target: A, text: 'eye'}
          - {figure: sketch, kind: circle, target: '30°'}
          - {figure: sketch, kind: highlight, target: DC, text: '2 m'}
      - say: 'The triangle only reaches from eye level up to the top $B$. Let $h$ be that part of the tree, $BC$.'
        write: 'Let $BC = h$ m'
        point:
          - {figure: sketch, kind: highlight, target: CB, text: 'h'}
      - section: 'The part above eye level'
        say: 'From 30 degrees, $h$ is opposite and $AC$, 14 root 3, is adjacent. Opposite and adjacent means TOA, so tangent.'
        write: '$\tan 30^{\circ} = \dfrac{\text{opp}}{\text{adj}} = \dfrac{h}{14\sqrt{3}}$ (TOA)'
        point:
          - {figure: sketch, kind: highlight, target: CB, text: 'opp'}
          - {figure: sketch, kind: underline, target: AC, text: 'adj'}
      - say: 'Cross-multiply, and $h$ is 14 root 3 times tan 30.'
        write: '$h = 14\sqrt{3}\tan 30^{\circ}$'
      - say: 'Tan 30 degrees is 1 over root 3. The root 3 on top and the root 3 below cancel, leaving 14.'
        write: '$h = 14\sqrt{3} \times \dfrac{1}{\sqrt{3}} = 14$ m'
      - section: 'The whole tree'
        say: 'The tree also has the 2 metres from the ground up to eye level. So the height is $BC$ plus $CD$.'
        write: 'Height of tree $= BC + CD = h + 2$'
        point:
          - {figure: sketch, kind: highlight, target: DC, text: '2 m'}
      - say: 'Substitute $h$ equals 14, and 14 plus 2 is 16 metres.'
        write: '$= 14 + 2 = 16$ m'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '=14m'}, at: '=[[14]]+', text: 'h'}
      - say: 'Therefore the tree is 16 metres high.'
        write: '$\therefore$ Height of tree $= 16$ m'
        point:
          - {figure: sketch, kind: label, target: DB, text: '16 m'}
      - section: 'Check'
        say: 'To check, put $h$ back. 14 over 14 root 3 is 1 over root 3, which is tan 30 degrees. It agrees.'
        write: 'Check: $\dfrac{14}{14\sqrt{3}} = \dfrac{1}{\sqrt{3}} = \tan 30^{\circ}\ \checkmark$'
      - section: 'Answer'
        say: 'So the tree is 16 metres high, which is answer choice D.'
        write: '$\therefore 16$ m'
        answer: true
    traps:
      A: 'You went for 12 metres. That subtracts the 2 metres instead of adding it. His eye is above the ground, so the 2 metres is extra tree below eye level: 14 plus 2 is 16.'
      B: 'You went for 14 metres. That is $h$, the part above his eye. Add the 2 metres from the ground to eye level, and the tree is 16 metres.'
      C: 'You went for 14 root 3 metres. That is the distance $AC$, the adjacent side, not the height. The height above the eye is 14 root 3 times tan 30, which is 14; then add 2.'
  40:
    moments:
      - section: 'The question'
        say: 'Alero walks 3 km from $P$ on a bearing of 023 degrees, to a point $R$. Then she walks 4 km on a bearing of 113 degrees to $Q$. We want the bearing of $Q$ from $P$.'
        write: '$PR = 3$ km on $023^{\circ}$; $RQ = 4$ km on $113^{\circ}$'
      - section: 'Solution'
        say: 'Solution. Let me draw the walk, with a North line at $P$ and at $R$. North lines are always parallel.'
        write: 'Solution: N lines at $P$ and $R$ ($\parallel$)'
        show_sketch: true
        'on': 'draw the walk'
        point:
          - {figure: sketch, kind: circle, target: '23°', text: '023° at P'}
          - {figure: sketch, kind: circle, target: '113°', text: '113° at R'}
      - section: 'The angle at R'
        say: 'Extend the North line at $R$ down to the South. $PR$ cuts the two parallel lines, so the angle between South at $R$ and $RP$ is 23 degrees. The reason is alternate angles.'
        write: '$\angle PRS = 23^{\circ}$ (alt. $\angle$s, N lines $\parallel$)'
      - say: 'At $R$, $RQ$ is 113 degrees clockwise from North. North to South is a straight line, 180 degrees, so $RQ$ is 180 minus 113, 67 degrees, from South.'
        write: '$\angle QRS = 180^{\circ} - 113^{\circ} = 67^{\circ}$ ($\angle$s on a str. line)'
      - say: '$RP$ and $RQ$ lie on either side of the South line, so the angle inside the triangle at $R$ is the two together, and 23 plus 67 is 90 degrees.'
        write: '$\angle PRQ = 23^{\circ} + 67^{\circ} = 90^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: PRQ, text: '90°'}
      - section: 'The angle at P'
        say: 'Let me join $P$ to $Q$. Let theta be the angle $RPQ$, between the first leg and $PQ$.'
        write: 'Let $\theta = \angle RPQ$'
        show_sketch: sketch_b
        'on': 'join'
        point:
          - {figure: sketch_b, kind: highlight, target: PQ, text: 'P to Q'}
          - {figure: sketch_b, kind: arc, target: RPQ, text: 'θ'}
      - say: 'From theta, the 4 km leg is opposite and the 3 km leg is adjacent. Opposite and adjacent means TOA, so tangent.'
        write: '$\tan\theta = \dfrac{\text{opp}}{\text{adj}} = \dfrac{4}{3} = 1.3333$ (TOA)'
      - say: 'Now the tangent tables. 1.3333 sits at 53 degrees 8 minutes. So theta is 53 degrees 8 minutes.'
        write: '$\theta = 53^{\circ}8''$ (tables)'
        point:
          - {figure: sketch_b, kind: arc, target: RPQ, text: '53°8′'}
      - section: 'The bearing'
        say: 'At $P$, the first leg is 23 degrees clockwise from North. $Q$ lies a further theta clockwise, so we add theta to 23.'
        write: 'Bearing of $Q$ from $P = 023^{\circ} + \theta$'
        point:
          - {figure: sketch_b, kind: circle, target: '23°', text: 'first bearing'}
      - say: '23 plus 53 degrees 8 minutes is 76 degrees 8 minutes. In three figures, that is zero-seven-six degrees 8 minutes.'
        write: '$= 023^{\circ} + 53^{\circ}8'' = 076^{\circ}8''$'
        point:
          - {line: 9, kind: move, from: {line: 7, at: '53∘8′'}, at: '+53∘8′', text: 'θ'}
      - say: 'Therefore the bearing of $Q$ from $P$ is 076 degrees 8 minutes.'
        write: '$\therefore$ Bearing of $Q$ from $P = 076^{\circ}8''$'
        point:
          - {figure: sketch_b, kind: circle, target: '?', text: '076°8′'}
      - section: 'Check'
        say: 'Check. At $Q$, tan is 3 over 4, which the tables give as 36 degrees 52 minutes. The three angles must add up to 180 degrees.'
        write: 'Check: $53^{\circ}8'' + 36^{\circ}52'' + 90^{\circ} = 180^{\circ}\ \checkmark$'
      - section: 'Answer'
        say: 'So the bearing of $Q$ from $P$ is 76 degrees 8 minutes, which is answer choice C.'
        write: '$\therefore 076^{\circ}8''$'
        answer: true
    traps:
      A: 'You went for 26 degrees 52 minutes. That is not the angle at $P$. With 4 km opposite and 3 km adjacent, tan theta is 4 over 3, so theta is 53 degrees 8 minutes, and the bearing is 023 plus that.'
      B: 'You went for 52 degrees 8 minutes. That is about the angle at $P$ alone, without the 23 degrees of the first leg. A bearing is measured from North, so add 23: 076 degrees 8 minutes.'
      D: 'You went for 90 degrees. That is the angle $PRQ$ inside the triangle at $R$, not a bearing. The bearing of $Q$ from $P$ is 023 plus theta, 076 degrees 8 minutes.'
  41:
    moments:
      - section: 'The question'
        say: 'Cot theta is $x$ over $y$, and we want cosec theta. These are two reciprocal ratios, so draw the triangle and both come out of it.'
        write: '$\cot\theta = \dfrac{x}{y}$; find $\operatorname{cosec}\theta$'
      - section: 'Solution'
        say: 'Solution. Let me draw a right-angled triangle $ABC$, with the right angle at $B$ and theta at $A$.'
        write: 'Solution: right $\angle$ at $B$, $\theta$ at $A$'
        show_sketch: true
        'on': 'draw'
      - say: 'Cot is 1 over tan. Tan is opposite over adjacent, so cot is adjacent over opposite.'
        write: '$\cot\theta = \dfrac{1}{\tan\theta} = \dfrac{\text{adj}}{\text{opp}} = \dfrac{x}{y}$'
      - say: 'So the adjacent side $AB$ is $x$, and the opposite side $BC$ is $y$.'
        write: 'adj $= x$, opp $= y$'
        point:
          - {figure: sketch, kind: highlight, target: AB, text: 'adj = x'}
          - {figure: sketch, kind: highlight, target: BC, text: 'opp = y'}
      - section: 'The hypotenuse'
        say: 'By Pythagoras, the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: '$\text{hyp}^{2} = \text{opp}^{2} + \text{adj}^{2} = y^{2} + x^{2}$'
        point:
          - {figure: sketch, kind: highlight, target: AC, text: 'hyp = ?'}
      - say: 'Take the square root.'
        write: '$\text{hyp} = \sqrt{x^{2} + y^{2}}$'
        point:
          - {figure: sketch, kind: label, target: '?', text: '√(x² + y²)'}
      - section: 'cosec θ'
        say: 'Cosec is 1 over sin. SOH says sin is opposite over hypotenuse, so cosec is hypotenuse over opposite.'
        write: '$\operatorname{cosec}\theta = \dfrac{1}{\sin\theta} = \dfrac{\text{hyp}}{\text{opp}}$'
      - say: 'Substitute the hypotenuse and the opposite side, $y$.'
        write: '$\operatorname{cosec}\theta = \dfrac{\sqrt{x^{2} + y^{2}}}{y} = \dfrac{1}{y}\sqrt{x^{2} + y^{2}}$'
      - section: 'Check'
        say: 'Check with an identity, which says 1 plus cot squared equals cosec squared. 1 plus $x$ squared over $y$ squared is $y$ squared plus $x$ squared, over $y$ squared.'
        write: 'Check: $\operatorname{cosec}^{2}\theta = 1 + \dfrac{x^{2}}{y^{2}} = \dfrac{x^{2} + y^{2}}{y^{2}}$'
      - say: 'Take the square root, and we get root of $x$ squared plus $y$ squared, over $y$. It agrees.'
        write: '$\operatorname{cosec}\theta = \dfrac{\sqrt{x^{2} + y^{2}}}{y}\ \checkmark$'
      - section: 'Answer'
        say: 'So cosec theta is 1 over $y$, times root of $x$ squared plus $y$ squared, which is answer choice A.'
        write: '$\therefore \operatorname{cosec}\theta = \dfrac{1}{y}\sqrt{x^{2} + y^{2}}$'
        answer: true
    traps:
      B: 'You went for root of $x$ over $y$. That takes the square root of cot. Cosec is hypotenuse over opposite, and the hypotenuse is root of $x$ squared plus $y$ squared.'
      C: 'You went for 1 over $y$ times $x$ squared plus $y$. The hypotenuse comes from Pythagoras: the square root of $x$ squared plus $y$ squared, with both letters squared.'
      D: 'You went for $y$ over $x$. That is tan theta, the reciprocal of cot. Cosec is the reciprocal of sin: hypotenuse over opposite.'
  42:
    moments:
