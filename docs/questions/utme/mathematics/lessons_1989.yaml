  41:
    moments:
      - say: 'A pilot flies 10 km above the ground towards a landmark. He sees it first at an angle of depression of 35 degrees, then later at 55 degrees. We want the distance between the two points where he looked.'
        write: 'Height $= 10$ km; angles of depression $35^{\circ}$, then $55^{\circ}$'
      - say: 'Let me draw a diagram of this, to make it simpler to see.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: A, text: 'first look'}
      - say: 'An angle of depression is measured down from the horizontal. It equals the angle of elevation from the landmark up to the plane, because they are alternate angles between two horizontal lines.'
        write: 'Angle of depression $=$ angle of elevation (alternate angles)'
        point:
          - {figure: sketch, kind: circle, target: L, text: 'landmark'}
      - say: 'In a right-angled triangle, the tan of an angle is the opposite side over the adjacent side.'
        write: 'SOH CAH TOA: $\tan\theta = \dfrac{\text{opposite}}{\text{adjacent}}$'
      - say: 'So each sighting gives a right-angled triangle. The 10 km height is opposite the angle, and the horizontal distance along the ground is adjacent to it. Opposite over adjacent is tan.'
        write: '$\tan\theta = \dfrac{10}{\text{horizontal distance}}$'
        point:
          - {figure: sketch, kind: circle, target: '10 km', text: 'opposite'}
      - say: 'Rearranging, the horizontal distance is 10 over tan theta. And 1 over tan is called cot, so that is 10 cot theta.'
        write: 'Horizontal distance $= \dfrac{10}{\tan\theta} = 10\cot\theta$'
      - say: 'At the first sighting the angle is 35 degrees. That is the shallower angle, so the plane is farther away.'
        write: 'First: $d_{1} = 10\cot 35^{\circ}$'
        point:
          - {line: 5, kind: box, text: 'the rule'}
          - {figure: sketch, kind: circle, target: '35°', text: 'from A'}
      - say: 'Now let me draw the second sighting, from $B$, closer to the landmark.'
        show_sketch: sketch_b
        point:
          - {figure: sketch_b, kind: circle, target: B, text: 'later'}
          - {figure: sketch_b, kind: circle, target: '?', text: 'distance'}
      - say: 'At the second sighting the angle is steeper, 55 degrees, so the plane is closer.'
        write: 'Second: $d_{2} = 10\cot 55^{\circ}$'
        point:
          - {figure: sketch_b, kind: circle, target: '55°', text: 'from B'}
      - say: 'The distance flown between the two points is the far distance minus the near distance.'
        write: '$d_{1} - d_{2} = 10\cot 35^{\circ} - 10\cot 55^{\circ}$'
        point:
          - {line: 9, kind: move, from: {line: 6, at: '10cot35∘'}, at: '10cot35∘', text: 'far'}
          - {line: 9, kind: move, from: {line: 8, at: '10cot55∘'}, at: '10cot55∘', text: 'near'}
          - {figure: sketch_b, kind: highlight, target: AB, text: 'd₁ − d₂'}
      - say: 'Both terms have a 10, so take out the common factor 10.'
        write: '$= 10(\cot 35^{\circ} - \cot 55^{\circ})$'
      - say: 'As a rough check, cot 35 is about 1.428 and cot 55 is about 0.700. 1.428 minus 0.700 is 0.728, and 10 times that is about 7.3 km, a sensible distance.'
        write: 'Check: $10(1.428 - 0.700) = 10 \times 0.728 \approx 7.3$ km'
      - say: 'So the distance is 10 times, cot 35 minus cot 55, kilometres, which is answer choice D.'
        write: 'Distance $= 10(\cot 35^{\circ} - \cot 55^{\circ})$ km'
        answer: true
    traps:
      A: 'You went for sines. Sine would need the line of sight, the hypotenuse. We know the height, which is opposite the angle, and want the ground distance, which is adjacent, so we need tan, and 10 over tan is 10 cot.'
      B: 'You went for cosines. Cosine links the adjacent side to the hypotenuse, but we don''t know the line of sight. The height is opposite and the ground distance is adjacent, so the ground distance is 10 cot theta.'
      C: 'You went for tangents. That would treat the 10 km as the ground distance. The 10 km is the height, opposite the angle, so the ground distance is 10 divided by tan, which is 10 cot.'
