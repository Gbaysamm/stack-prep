      - say: 'So we match our expression to this pattern, one term at a time. First the $x$ squared terms: $p$ squared must be 4, so $p$ is 2.'
        write: '$p^{2} = 4 \Rightarrow p = 2$'
      - say: 'Next the $x$ terms: $2pq$ must be 5. Put in $p$ equals 2, and 2 times 2 times $q$ is $4q$.'
        write: '$2pq = 5 \Rightarrow 2(2)q = 5 \Rightarrow 4q = 5$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: 'p=2'}, at: '(2)', text: 'sub in'}
      - say: 'Divide both sides by 4, and $q$ is 5 over 4.'
        write: '$q = \tfrac{5}{4}$'
      - say: 'Finally the numbers on their own: $Q$ must be $q$ squared, which is 5 over 4, squared.'
        write: '$Q = q^{2} = \left(\tfrac{5}{4}\right)^{2}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '45'}, at: '(45)', text: 'q'}
      - say: '5 squared is 25 and 4 squared is 16. So $Q$ is 25 over 16.'
        write: '$= \dfrac{5^{2}}{4^{2}} = \dfrac{25}{16}$'
      - say: 'Let''s check by squaring $2x$ plus 5 over 4. The first term squared: $2x$ squared is $4x$ squared.'
        write: 'Check: $(2x)^{2} = 4x^{2}$'
      - say: 'The middle: 2 times $2x$ times 5 over 4. 2 times 2 is 4, and 4 times 5 over 4 is 5. So that is $5x$.'
        write: '$2 \times 2x \times \tfrac{5}{4} = 5x$'
      - say: 'The last: 5 over 4, squared, is 25 over 16. So the square is exactly our expression with $Q$ equal to 25 over 16.'
        write: '$\left(2x + \tfrac{5}{4}\right)^{2} = 4x^{2} + 5x + \tfrac{25}{16}$'
      - say: 'So $Q$ is 25 over 16, which is answer choice A.'
        write: '$Q = \tfrac{25}{16}$'
        answer: true
    traps:
