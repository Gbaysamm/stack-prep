# UTME 1989 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1989.yaml. Answers match that file.
format_version: 1
exam_year: 1989
lessons:
  1:
    moments:
      - say: 'We''re given four lists of fractions, and we want the one in descending order. Descending means going down: each number smaller than the one before it.'
      - say: 'Fractions with different denominators are hard to compare by eye. So the first thing we''ll do is turn every fraction into a decimal.'
      - say: '9 over 10 is 9 tenths, which is 0.9.'
        write: '$\tfrac{9}{10} = 0.9$'
      - say: 'For 17 over 20, multiply the top and bottom by 5 to get hundredths. 17 times 5 is 85, so it''s 85 hundredths, 0.85.'
        write: '$\tfrac{17}{20} = \tfrac{85}{100} = 0.85$'
      - say: '4 over 5: multiply top and bottom by 2. That''s 8 tenths, 0.8.'
        write: '$\tfrac{4}{5} = \tfrac{8}{10} = 0.8$'
      - say: '3 over 4 is three quarters, which is 0.75.'
        write: '$\tfrac{3}{4} = 0.75$'
      - say: 'And 17 over 10 is 17 tenths, which is 1.7. That one is bigger than 1.'
        write: '$\tfrac{17}{10} = 1.7$'
      - say: 'Now let''s read each option as decimals. Option A goes 0.9, 0.8, 0.75, then jumps up to 1.7. That''s not descending.'
        write: '$\text{A: } 0.9,\ 0.8,\ 0.75,\ 1.7$'
      - say: 'Option B starts 0.8, then 0.9. It goes up straight away, so it''s out.'
        write: '$\text{B: } 0.8,\ 0.9,\ 0.75,\ 0.85$'
      - say: 'Option D goes 0.8, 0.9, 1.7, and only then falls to 0.75. It rises twice, so it''s out.'
        write: '$\text{D: } 0.8,\ 0.9,\ 1.7,\ 0.75$'
      - say: 'Option C goes 0.9, then 0.85, then 0.8, then 0.75. Every number is smaller than the one before it.'
        write: '$\text{C: } 0.9,\ 0.85,\ 0.8,\ 0.75$'
      - say: 'So the list in descending order is 9 over 10, 17 over 20, 4 over 5, 3 over 4, which is answer choice C.'
        write: '$\tfrac{9}{10},\ \tfrac{17}{20},\ \tfrac{4}{5},\ \tfrac{3}{4}$'
        answer: true
    traps:
      A: 'You went for A. It starts well, 0.9, 0.8, 0.75, but the last fraction is 17 over 10, which is 1.7, bigger than all of them. It looks like 17 over 20, but a smaller denominator makes a bigger fraction.'
      B: 'You went for B. As decimals it begins 0.8, then 0.9, so it goes up before it goes down. Descending means every step goes down.'
      D: 'You went for D. As decimals it reads 0.8, 0.9, 1.7, 0.75, which rises twice. Turn each fraction into a decimal and check that every one is smaller than the last.'
  2:
    moments:
      - say: 'We want to evaluate 2,700,000 times 0.03, divided by 18,000, and write it in standard form.'
        write: '$2{,}700{,}000 \times 0.03 \div 18{,}000$'
      - say: 'Let''s do the multiplication first. Multiplying by 0.03 is the same as multiplying by 3 and dividing by 100.'
        write: '$0.03 = \dfrac{3}{100}$'
      - say: '2,700,000 divided by 100 is 27,000. We just take off two zeros.'
        write: '$2{,}700{,}000 \div 100 = 27{,}000$'
      - say: 'Now times 3. 27 times 3 is 81, so 27,000 times 3 is 81,000.'
        write: '$27{,}000 \times 3 = 81{,}000$'
      - say: 'Next, divide 81,000 by 18,000.'
        write: '$\dfrac{81{,}000}{18{,}000}$'
      - say: 'Cancel three zeros on the top and the bottom. That leaves 81 over 18.'
        write: '$= \dfrac{81}{18}$'
      - say: 'Both 81 and 18 divide by 9. 81 divided by 9 is 9, and 18 divided by 9 is 2. So it''s 9 over 2.'
        write: '$= \dfrac{9}{2}$'
      - say: '9 divided by 2 is 4.5.'
        write: '$= 4.5$'
      - say: 'In standard form, a number between 1 and 10 is multiplied by 10 to the power zero, because 10 to the zero is 1.'
        write: '$10^{0} = 1$'
      - say: 'So the answer is 4.5 times 10 to the power zero, which is answer choice A.'
        write: '$4.5 \times 10^{0}$'
        answer: true
    traps:
      B: 'You went for 4.5 times 10 to the 1, which is 45. The working gives 81,000 divided by 18,000, which is 4.5 exactly, so the power of 10 is zero.'
      C: 'You went for 4.5 times 10 squared, which is 450. That''s what you get if you treat 0.03 as 3. Multiplying by 0.03 makes the number smaller: 2,700,000 times 0.03 is 81,000.'
      D: 'You went for 4.5 times 10 cubed, which is 4,500. Check the zeros: 81,000 divided by 18,000 is 81 over 18, which is just 4.5.'
  3:
    moments:
      - say: 'We want the prime factors of 2,520. A prime factor is a factor that is itself a prime number.'
      - say: 'The plan is to keep dividing by the smallest prime that works. Start with 2, since 2,520 is even. Half of 2,520 is 1,260.'
        write: '$2520 \div 2 = 1260$'
      - say: '1,260 is still even. Half of it is 630.'
        write: '$1260 \div 2 = 630$'
      - say: '630 is even too. Half of 630 is 315.'
        write: '$630 \div 2 = 315$'
      - say: '315 is odd, so 2 won''t go any more. Try 3. The digits of 315 add to 9, so 3 divides it. 315 divided by 3 is 105.'
        write: '$315 \div 3 = 105$'
      - say: '105: its digits add to 6, so 3 goes again. 105 divided by 3 is 35.'
        write: '$105 \div 3 = 35$'
      - say: '35 doesn''t divide by 3. But it ends in 5, so divide by 5. 35 divided by 5 is 7.'
        write: '$35 \div 5 = 7$'
      - say: 'And 7 is prime, so we stop.'
        write: '$7 \div 7 = 1$'
      - say: 'So 2,520 is 2 cubed, times 3 squared, times 5, times 7.'
        write: '$2520 = 2^{3} \times 3^{2} \times 5 \times 7$'
      - say: 'Let''s check. 2 cubed is 8 and 3 squared is 9. 8 times 9 is 72. 5 times 7 is 35. And 72 times 35 is 2,520.'
        write: '$8 \times 9 \times 5 \times 7 = 72 \times 35 = 2520$'
      - say: 'The different primes that appear are 2, 3, 5 and 7, which is answer choice C.'
        write: '$2,\ 3,\ 5,\ 7$'
        answer: true
    traps:
      A: 'You went for 2, 9, 5. Nine does divide 2,520, but 9 is 3 times 3, so it isn''t prime. The list also leaves out 7.'
      B: 'You went for 2, 9, 7. Nine is not prime, since it''s 3 times 3, and the list misses 5. The primes are 2, 3, 5 and 7.'
      D: 'You went for 2, 3, 7, 9. Nine is 3 times 3, so it''s a factor but not a prime factor, and 5 is missing. The prime factors are 2, 3, 5 and 7.'
  4:
    moments:
      - say: 'We''re told that 12 in base twelve equals $x$ in base 7, and we want $x$.'
        write: '$12_{12} = x_{7}$'
      - say: 'The easiest route between two bases is through base ten. So first, let''s turn 12 in base twelve into base ten.'
      - say: 'In base twelve, the 1 is in the twelves place and the 2 is in the units place. So it means 1 twelve and 2 units.'
        write: '$12_{12} = 1 \times 12 + 2$'
      - say: '1 times 12 is 12, plus 2 is 14. So it''s 14 in base ten.'
        write: '$= 14_{10}$'
      - say: 'Now we write 14 in base 7. We divide by 7 and keep the remainders. 14 divided by 7 is 2, remainder 0.'
        write: '$14 \div 7 = 2 \text{ r } 0$'
      - say: 'Then 2 divided by 7 is 0, remainder 2.'
        write: '$2 \div 7 = 0 \text{ r } 2$'
      - say: 'Read the remainders from the bottom up: 2, then 0. That gives 20 in base 7.'
        write: '$14_{10} = 20_{7}$'
      - say: 'Let''s check. 20 in base 7 means 2 sevens and 0 units. 2 times 7 is 14. That matches.'
        write: '$20_{7} = 2 \times 7 + 0 = 14$'
      - say: 'So $x$ is 20, which is answer choice A.'
        write: '$x = 20$'
        answer: true
    traps:
      B: 'You went for 15. The base-ten value is 14, and in base 7 that''s 2 sevens and no units, so it''s written 20.'
      C: 'You went for 14. That''s the base-ten value, found halfway through. The question wants the numeral in base 7, so 14 has to be converted again, giving 20.'
      D: 'You went for 12. That''s just the number as printed. 12 in base twelve is 14 in base ten, and 14 in base 7 is 20.'
  5:
    moments:
      - say: 'We want to simplify the cube root of $64r^{-6}$, all raised to the power one half.'
        write: '$\left(\sqrt[3]{64r^{-6}}\right)^{\frac{1}{2}}$'
      - say: 'We''ll work from the inside out, and treat the number and the letter separately. First, the cube root.'
      - say: 'The cube root of 64 is 4, because 4 times 4 times 4 is 64.'
        write: '$\sqrt[3]{64} = 4$'
      - say: 'The cube root of $r^{-6}$ means the power $\tfrac{1}{3}$. Powers multiply, so negative 6 times one third is negative 2.'
        write: '$\sqrt[3]{r^{-6}} = r^{-6 \times \frac{1}{3}} = r^{-2}$'
      - say: 'So the cube root of the whole thing is $4r^{-2}$.'
        write: '$\sqrt[3]{64r^{-6}} = 4r^{-2}$'
      - say: 'Now raise that to the power one half, which is a square root.'
        write: '$\left(4r^{-2}\right)^{\frac{1}{2}}$'
      - say: 'The square root of 4 is 2.'
        write: '$4^{\frac{1}{2}} = 2$'
      - say: 'And $r^{-2}$ to the power one half: negative 2 times one half is negative 1.'
        write: '$\left(r^{-2}\right)^{\frac{1}{2}} = r^{-1}$'
      - say: 'So the result is $2r^{-1}$.'
        write: '$= 2r^{-1}$'
      - say: 'A negative power means one over. $r^{-1}$ is 1 over $r$, so $2r^{-1}$ is 2 over $r$.'
        write: '$2r^{-1} = \dfrac{2}{r}$'
      - say: 'So the answer is 2 over $r$, which is answer choice D.'
        write: '$\dfrac{2}{r}$'
        answer: true
    traps:
      A: 'You went for $r$. The number part doesn''t vanish: the cube root of 64 is 4, and the square root of 4 is 2. And the power of $r$ ends up negative.'
      B: 'You went for $2r$. The 2 is right, but $r$ started with a negative power, so it ends as $r^{-1}$, which puts $r$ in the denominator.'
      C: 'You went for 1 over $2r$. Only the $r$ has a negative power. The 2 comes from the square root of 4 and stays on top.'
  6:
    moments:
      - say: 'We round 0.007685 two ways: to three significant figures, and to four decimal places. Then we find the difference.'
        write: '$0.007685$'
      - say: 'Significant figures start at the first non-zero digit. Leading zeros don''t count. So the significant digits here are 7, 6, 8 and 5.'
      - say: 'We keep three of them: 7, 6, 8. The next digit is 5, so we round the 8 up to 9.'
        write: '$0.007685 \approx 0.00769 \ (3 \text{ s.f.})$'
      - say: 'Decimal places count from the decimal point. Four places takes us to 0.0076, and the next digit is 8.'
        write: '$0.0076|85$'
      - say: '8 is 5 or more, so we round the 6 up to 7.'
        write: '$0.007685 \approx 0.0077 \ (4 \text{ d.p.})$'
      - say: 'Now subtract. To line them up, write 0.0077 with five decimal places: 0.00770.'
        write: '$0.00770 - 0.00769$'
      - say: '770 hundred-thousandths minus 769 hundred-thousandths is 1 hundred-thousandth.'
        write: '$= 0.00001$'
      - say: '0.00001 is 1 over 100,000, which is 10 to the power negative 5.'
        write: '$0.00001 = \dfrac{1}{100{,}000} = 10^{-5}$'
      - say: 'So the difference is 10 to the negative 5, which is answer choice A.'
        write: '$10^{-5}$'
        answer: true
    traps:
      B: 'You went for 7 times 10 to the negative 4. That''s close to one of the rounded numbers, not their difference. 0.0077 minus 0.00769 is 0.00001.'
      C: 'You went for 8 times 10 to the negative 5. Check the rounding: 3 significant figures gives 0.00769 and 4 decimal places gives 0.0077. They differ by only 1 in the fifth decimal place.'
      D: 'You went for 10 to the negative 6. The difference is 0.00001, which has the 1 in the fifth decimal place, so it''s 10 to the negative 5.'
  7:
    moments:
      - say: 'We''re told $a$ to $b$ is 5 to 8, and $x$ to $y$ is 25 to 16. We want $\tfrac{a}{x}$ to $\tfrac{b}{y}$.'
        write: '$a : b = 5 : 8,\quad x : y = 25 : 16$'
      - say: 'A ratio only tells us proportions, so we can pick actual numbers that fit. Let''s take $a$ as 5 and $b$ as 8.'
        write: '$a = 5,\ b = 8$'
      - say: 'And take $x$ as 25 and $y$ as 16.'
        write: '$x = 25,\ y = 16$'
      - say: 'Now $a$ over $x$ is 5 over 25. Both divide by 5, so it''s 1 over 5.'
        write: '$\dfrac{a}{x} = \dfrac{5}{25} = \dfrac{1}{5}$'
      - say: 'And $b$ over $y$ is 8 over 16, which is 1 over 2.'
        write: '$\dfrac{b}{y} = \dfrac{8}{16} = \dfrac{1}{2}$'
      - say: 'So the ratio is one fifth to one half.'
        write: '$\dfrac{1}{5} : \dfrac{1}{2}$'
      - say: 'To clear the fractions, multiply both parts by 10. One fifth of 10 is 2, and one half of 10 is 5.'
        write: '$= 2 : 5$'
      - say: 'Would other numbers change it? No. If we used $5k$, $8k$, $25m$ and $16m$, the $k$ and $m$ would cancel out.'
      - say: 'So the ratio is 2 to 5, which is answer choice D.'
        write: '$\dfrac{a}{x} : \dfrac{b}{y} = 2 : 5$'
        answer: true
    traps:
      A: 'You went for 125 to 128. That comes from multiplying, 5 times 25 against 8 times 16. The question wants $a$ divided by $x$, so it''s 5 over 25 against 8 over 16.'
      B: 'You went for 3 to 5. Work out each fraction: 5 over 25 is one fifth and 8 over 16 is one half, and one fifth to one half is 2 to 5.'
      C: 'You went for 3 to 4. Put numbers in: $a$ over $x$ is 5 over 25, one fifth, and $b$ over $y$ is 8 over 16, one half. Times both by 10 to get 2 to 5.'
  8:
    moments:
      - say: 'Oke puts ₦800 in the bank at 12 and a half percent simple interest. The amount grows to one and a half times the principal. We want the number of years.'
        write: 'Principal: ₦800'
      - say: 'The amount is the principal plus the interest. One and a half times ₦800 is ₦1,200.'
        write: '$1.5 \times 800 = 1200$'
      - say: 'So the interest alone is 1,200 minus 800, which is ₦400.'
        write: '$I = 1200 - 800 = 400$'
      - say: 'Now the simple interest formula: interest equals principal times rate times time, over 100.'
        write: '$I = \dfrac{PRT}{100}$'
      - say: 'We want the time, so rearrange. Multiply both sides by 100 and divide by $P$ times $R$.'
        write: '$T = \dfrac{100I}{PR}$'
      - say: 'Substitute: 100 times 400 on top, and 800 times 12.5 on the bottom.'
        write: '$T = \dfrac{100 \times 400}{800 \times 12.5}$'
      - say: '100 times 400 is 40,000. 800 times 12 is 9,600, and 800 times a half is 400, so 800 times 12.5 is 10,000.'
        write: '$T = \dfrac{40{,}000}{10{,}000}$'
      - say: '40,000 divided by 10,000 is 4.'
        write: '$T = 4$'
      - say: 'Let''s check. 12 and a half percent of ₦800 is ₦100 a year. Four years gives ₦400. That''s the interest we needed.'
        write: '$4 \times 100 = 400$'
      - say: 'So the money was in the bank for 4 years, which is answer choice B.'
        write: '$T = 4 \text{ years}$'
        answer: true
    traps:
      A: 'You went for 2. The interest needed is ₦400, and the money earns ₦100 a year, so it takes 4 years, not 2.'
      C: 'You went for 5 and a half. The yearly interest is 12.5% of ₦800, which is ₦100, and ₦400 of interest needs exactly 4 years.'
      D: 'You went for 8. That''s how long it takes the money to double, when the interest is ₦800. Here the interest is only half the principal, ₦400, so it takes 4 years.'
  9:
    moments:
      - say: 'The surface area of a sphere goes up by 44%. We want the percentage increase in its diameter.'
      - say: 'The key fact: the surface area depends on the square of the diameter. For a sphere it''s $\pi d^{2}$.'
        write: '$A = \pi d^{2}$'
      - say: 'An increase of 44% means the new area is 100 plus 44, which is 144% of the old area. So the area is multiplied by 1.44.'
        write: '$A_{\text{new}} = 1.44\,A$'
      - say: 'Because area goes with $d$ squared, the diameter''s scale factor, squared, must equal 1.44.'
        write: '$k^{2} = 1.44$'
      - say: 'So the scale factor is the square root of 1.44. 1.2 times 1.2 is 1.44, so the square root is 1.2.'
        write: '$k = \sqrt{1.44} = 1.2$'
      - say: 'Multiplying the diameter by 1.2 means it becomes 120% of what it was.'
        write: '$d_{\text{new}} = 1.2\,d = 120\% \text{ of } d$'
      - say: '120 minus 100 is 20, so that''s a 20% increase.'
        write: '$120\% - 100\% = 20\%$'
      - say: 'Let''s check. 1.2 squared is 1.44, so the area grows by 44%. That matches.'
        write: '$1.2^{2} = 1.44$'
      - say: 'So the diameter increases by 20%, which is answer choice D.'
        write: '$20\%$'
        answer: true
    traps:
      A: 'You went for 44. That assumes the diameter grows by the same percentage as the area. But area goes with the square of the diameter, so the diameter''s factor is the square root of 1.44, which is 1.2.'
      B: 'You went for 30. The diameter''s factor, squared, must be 1.44, and 1.2 squared is 1.44. So the increase is 20%.'
      C: 'You went for 22, half of 44. Halving the percentage isn''t the same as taking a square root. The square root of 1.44 is 1.2, a 20% increase.'
  10:
    moments:
      - say: 'We want to simplify 4 minus 1 over 2 minus root 3.'
        write: '$4 - \dfrac{1}{2 - \sqrt{3}}$'
      - say: 'There''s a surd in the denominator, so first we rationalise it. We multiply the top and bottom by the conjugate, 2 plus root 3.'
        write: '$\dfrac{1}{2 - \sqrt{3}} \times \dfrac{2 + \sqrt{3}}{2 + \sqrt{3}}$'
      - say: 'On top, 1 times 2 plus root 3 is just 2 plus root 3.'
        write: '$= \dfrac{2 + \sqrt{3}}{(2 - \sqrt{3})(2 + \sqrt{3})}$'
      - say: 'On the bottom, it''s a difference of two squares: 2 squared minus root 3 squared. That''s 4 minus 3.'
        write: '$(2 - \sqrt{3})(2 + \sqrt{3}) = 4 - 3$'
      - say: '4 minus 3 is 1.'
        write: '$= 1$'
      - say: 'So the fraction is 2 plus root 3, over 1, which is just 2 plus root 3.'
        write: '$\dfrac{1}{2 - \sqrt{3}} = 2 + \sqrt{3}$'
      - say: 'Now put it back into the expression. We have 4 minus the whole bracket, 2 plus root 3.'
        write: '$4 - (2 + \sqrt{3})$'
      - say: 'The minus sign applies to both terms in the bracket. So it''s 4 minus 2 minus root 3.'
        write: '$= 4 - 2 - \sqrt{3}$'
      - say: '4 minus 2 is 2.'
        write: '$= 2 - \sqrt{3}$'
      - say: 'So the answer is 2 minus root 3, which is answer choice D.'
        write: '$2 - \sqrt{3}$'
        answer: true
    traps:
      A: 'You went for 2 root 3. The fraction simplifies to 2 plus root 3, and 4 minus that is 2 minus root 3. The root 3 is subtracted, not doubled.'
      B: 'You went for negative 2 minus root 3. That''s the fraction with a minus in front, but we still have the 4: 4 minus 2 minus root 3 is 2 minus root 3.'
      C: 'You went for negative 2 plus root 3. Both signs are reversed. The minus in front of the bracket applies to both terms, so 4 minus 2 plus root 3 in brackets is 2 minus root 3.'
  11:
    moments:
      - say: 'We''re given log base 3 of $p$, plus 3 log base 3 of $q$, equals 3. We want $p$ in terms of $q$.'
        write: '$\log_{3}p + 3\log_{3}q = 3$'
      - say: 'The plan is to squeeze the left side into a single log. First, a number in front of a log becomes a power: 3 log $q$ is log of $q$ cubed.'
        write: '$3\log_{3}q = \log_{3}q^{3}$'
      - say: 'So the equation becomes log $p$ plus log $q$ cubed equals 3.'
        write: '$\log_{3}p + \log_{3}q^{3} = 3$'
      - say: 'Adding logs with the same base means multiplying inside. So it''s log base 3 of $p$ times $q$ cubed.'
        write: '$\log_{3}\left(pq^{3}\right) = 3$'
      - say: 'Now undo the log. Log base 3 of something equals 3 means that something is 3 to the power 3.'
        write: '$pq^{3} = 3^{3}$'
      - say: '3 cubed is 27.'
        write: '$pq^{3} = 27$'
      - say: 'To get $p$ by itself, divide both sides by $q$ cubed.'
        write: '$p = \dfrac{27}{q^{3}}$'
      - say: '27 is 3 cubed, so the top and bottom are both cubes. We can write it as 3 over $q$, all cubed.'
        write: '$p = \dfrac{3^{3}}{q^{3}} = \left(\dfrac{3}{q}\right)^{3}$'
      - say: 'Let''s check with $q$ equal to 1. Then $p$ is 27. Log base 3 of 27 is 3, and 3 log of 1 is 0. 3 plus 0 is 3.'
        write: '$\log_{3}27 + 3\log_{3}1 = 3 + 0 = 3$'
      - say: 'So $p$ is 3 over $q$, all cubed, which is answer choice A.'
        write: '$p = \left(\dfrac{3}{q}\right)^{3}$'
        answer: true
    traps:
      B: 'You went for $q$ over 3 to the power one third. Both parts are turned round. $pq^{3}$ is 27, so $p$ is 27 over $q$ cubed, which is 3 over $q$, cubed.'
      C: 'You went for $q$ over 3, cubed. The fraction is upside down. $p$ times $q$ cubed is 27, so $q$ cubed goes on the bottom: $p$ is 27 over $q$ cubed.'
      D: 'You went for 3 over $q$ to the power one third. The 3 in front of the log becomes a power of 3, a cube, not a cube root.'
  12:
    moments:
      - say: 'We want the values of $y$ that satisfy 9 to the $y$, minus 4 times 3 to the $y$, plus 3, equals zero.'
        write: '$9^{y} - 4(3^{y}) + 3 = 0$'
      - say: 'Here''s the key: 9 is 3 squared. So 9 to the $y$ is 3 squared to the $y$, which is 3 to the $y$, all squared.'
        write: '$9^{y} = (3^{2})^{y} = (3^{y})^{2}$'
      - say: 'So this is a quadratic in disguise. Let''s call 3 to the $y$ by the letter $u$.'
        write: '$u = 3^{y}$'
      - say: 'Then the equation becomes $u$ squared minus $4u$ plus 3 equals zero.'
        write: '$u^{2} - 4u + 3 = 0$'
      - say: 'We need two numbers that multiply to 3 and add to negative 4. That''s negative 1 and negative 3.'
        write: '$(u - 1)(u - 3) = 0$'
      - say: 'So $u$ is 1 or $u$ is 3.'
        write: '$u = 1 \text{ or } u = 3$'
      - say: 'Now go back to $y$. First, 3 to the $y$ equals 1. Any number to the power zero is 1, so $y$ is 0.'
        write: '$3^{y} = 1 \Rightarrow y = 0$'
      - say: 'Second, 3 to the $y$ equals 3. That''s 3 to the power 1, so $y$ is 1.'
        write: '$3^{y} = 3 \Rightarrow y = 1$'
      - say: 'Check $y$ equals 1: 9 minus 12 plus 3 is 0. And $y$ equals 0: 1 minus 4 plus 3 is 0. Both work.'
        write: '$9 - 12 + 3 = 0,\quad 1 - 4 + 3 = 0$'
      - say: 'So the values of $y$ are 0 and 1, which is answer choice D.'
        write: '$y = 0 \text{ and } y = 1$'
        answer: true
    traps:
      A: 'You went for negative 1 and 0. 3 to the power negative 1 is one third, and that isn''t 1 or 3. The solutions are 3 to the $y$ equals 1, so $y$ is 0, and 3 to the $y$ equals 3, so $y$ is 1.'
      B: 'You went for negative 1 and 1. The 1 is right, but $y$ equals negative 1 gives one ninth minus four thirds plus 3, which isn''t zero. The other solution is $y$ equals 0.'
      C: 'You went for 1 and 3. Those are the values of $u$, which is 3 to the $y$. You have to go back to $y$: 3 to the $y$ equals 1 gives 0, and 3 to the $y$ equals 3 gives 1.'
  13:
    moments:
      - say: 'We want to make $R$ the subject of $S$ equals the square root of $2R$ plus $T$, over $2RT$.'
        write: '$S = \sqrt{\dfrac{2R + T}{2RT}}$'
      - say: 'The plan: remove the square root, clear the fraction, then gather the $R$ terms. First, square both sides.'
        write: '$S^{2} = \dfrac{2R + T}{2RT}$'
      - say: 'To clear the fraction, multiply both sides by $2RT$.'
        write: '$2RTS^{2} = 2R + T$'
