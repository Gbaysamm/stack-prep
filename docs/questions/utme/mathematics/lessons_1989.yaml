  50:
    moments:
      - say: 'Two numbers are picked at random from 1, 3 and 6. We want the probability that their sum is not odd.'
        write: 'Choose $2$ from $1,\ 3,\ 6$; want $P(\text{sum not odd})$'
      - say: 'Not odd means even. With only three numbers, the surest way is to list every pair we could choose.'
        write: 'Pairs: $\{1, 3\},\ \{1, 6\},\ \{3, 6\}$'
      - say: 'That is three pairs, and each one is equally likely.'
        write: 'Total outcomes $= 3$'
      - say: 'Now the sums. 1 plus 3 is 4.'
        write: '$1 + 3 = 4$'
      - say: '1 plus 6 is 7.'
        write: '$1 + 6 = 7$'
      - say: '3 plus 6 is 9.'
        write: '$3 + 6 = 9$'
      - say: 'Which of those sums are not odd? 4 is even, but 7 and 9 are odd. So only one pair works.'
        write: 'Even sums: $4$ only, so favourable outcomes $= 1$'
        point:
          - {line: 4, kind: strike, at: '= 7', text: 'odd'}
          - {line: 5, kind: strike, at: '= 9', text: 'odd'}
      - say: 'That makes sense: two numbers add to an even total only when both are odd or both are even. Here the pair of odd numbers is the only pair like that.'
        write: 'odd $+$ odd $=$ even; odd $+$ even $=$ odd'
      - say: 'Probability is favourable outcomes over total outcomes: 1 favourable pair out of 3.'
        write: '$P = \dfrac{\text{favourable}}{\text{total}} = \dfrac{1}{3}$'
      - say: 'So the probability that the sum is not odd is a third, which is answer choice C.'
        write: 'Therefore $P(\text{sum not odd}) = \dfrac{1}{3}$'
        answer: true
    traps:
      A: 'You went for two thirds. That''s the chance the sum is odd. Watch the word "not": only 1 plus 3 gives an even sum, so it''s a third.'
      B: 'You went for a half. There are three pairs, not two outcomes, and only one of them has an even sum. So it''s a third.'
      D: 'You went for 1 over 6. That counts ordered picks, 6 of them, but then only one of the two orders of 1 and 3. Counted either way, the answer is a third.'
