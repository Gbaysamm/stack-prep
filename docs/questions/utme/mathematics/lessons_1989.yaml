  26:
    moments:
      - say: 'We want to write 1 over $x + 1$, minus 1 over $x - 2$, as a single fraction.'
        write: '$\dfrac{1}{x + 1} - \dfrac{1}{x - 2}$'
      - say: 'Just like ordinary fractions, we need a common bottom. The simplest one is the two bottoms multiplied: $x$ plus 1, times $x$ minus 2.'
        write: 'Common denominator: $(x + 1)(x - 2)$'
      - say: 'For the first fraction, multiply the top and bottom by $x$ minus 2.'
        write: '$\dfrac{1}{x + 1} = \dfrac{x - 2}{(x + 1)(x - 2)}$'
      - say: 'For the second, multiply the top and bottom by $x$ plus 1.'
        write: '$\dfrac{1}{x - 2} = \dfrac{x + 1}{(x + 1)(x - 2)}$'
      - say: 'Now subtract the tops over the common bottom. Put the second top in a bracket, so the minus sign reaches both of its terms.'
        write: '$\dfrac{1}{x + 1} - \dfrac{1}{x - 2} = \dfrac{(x - 2) - (x + 1)}{(x + 1)(x - 2)}$'
      - say: 'Share out the minus: $x$ minus 2, minus $x$, minus 1.'
        write: '$= \dfrac{x - 2 - x - 1}{(x + 1)(x - 2)}$'
      - say: '$x$ minus $x$ is 0, and negative 2 minus 1 is negative 3.'
        write: '$= \dfrac{-3}{(x + 1)(x - 2)}$'
      - say: 'None of the options looks like this yet. But look: negative 1 times, $x$ minus 2, is negative $x$ plus 2, which is 2 minus $x$.'
        write: '$-(x - 2) = -x + 2 = 2 - x$'
      - say: 'So we move the minus sign from the 3 into the bracket $x$ minus 2. The top becomes positive 3, and $x$ minus 2 becomes 2 minus $x$.'
        write: '$\dfrac{-3}{(x + 1)(x - 2)} = \dfrac{3}{(x + 1)(2 - x)}$'
        point:
          - {line: 7, kind: arrow, text: 'flip sign'}
      - say: 'Let''s check with $x$ equal to 0. The original is 1 over 1, minus 1 over negative 2. That is 1 plus a half, which is 3 over 2.'
        write: 'Check $x = 0$: $\dfrac{1}{1} - \dfrac{1}{-2} = 1 + \tfrac{1}{2} = \tfrac{3}{2}$'
      - say: 'Our answer gives 3 over, 1 times 2, which is 3 over 2 as well.'
        write: '$\dfrac{3}{(0 + 1)(2 - 0)} = \dfrac{3}{2}$'
      - say: 'So the single fraction is 3 over, $x$ plus 1 times 2 minus $x$, which is answer choice B.'
        write: '$\dfrac{1}{x + 1} - \dfrac{1}{x - 2} = \dfrac{3}{(x + 1)(2 - x)}$'
        answer: true
    traps:
      A: 'You went for A. It turns $x - 2$ into $2 - x$ and also keeps the minus sign, so it changes the sign twice. At $x$ equals 0 it gives negative 3 over 2, but the true value is 3 over 2.'
      C: 'You went for negative 1 over the product. The top is $x - 2$ minus $x + 1$, and with the bracket that''s negative 3, not negative 1.'
      D: 'You went for 1 over the product. Subtracting the tops gives $x - 2 - x - 1$, which is negative 3. Keep the bracket so the minus reaches the 1 as well.'
  27:
    moments:
      - say: 'We want to simplify $x$ over $x + 1$, minus $x + 1$ to the power a half, over $x + 1$ to the power a half.'
        write: '$\dfrac{x}{x + 1} - \dfrac{(x + 1)^{\frac{1}{2}}}{(x + 1)^{\frac{1}{2}}}$'
      - say: 'Look at the second fraction first. The top and the bottom are exactly the same expression.'
      - say: 'Anything, other than zero, divided by itself is 1. So the second fraction is just 1.'
        write: '$\dfrac{(x + 1)^{\frac{1}{2}}}{(x + 1)^{\frac{1}{2}}} = 1$'
      - say: 'Put that 1 back in, and the whole expression is $x$ over $x$ plus 1, minus 1.'
