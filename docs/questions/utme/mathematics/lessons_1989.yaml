# UTME 1989 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1989.yaml. Answers match that file.
format_version: 1
exam_year: 1989
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'There are four lists of fractions, and only one goes steadily down. One option hides 17 over 10, which looks like 17 over 20 but is much bigger. Picture four bars, each one whole.'
        doodle: {name: 'custom:1989_q01_a', id: bars, caption: 'each bar is one whole'}
        write: 'Descending order of $\tfrac{9}{10},\ \tfrac{17}{20},\ \tfrac{4}{5},\ \tfrac{3}{4}$ (and $\tfrac{17}{10}$)?'
      - say: 'Descending means from the largest to the smallest. We change every fraction to a decimal, then compare.'
        write: 'Solution'
      - section: 'Change to decimals'
        say: '9 over 10 is 9 divided by 10, which is 0.9. The first bar fills to 0.9.'
        doodle_do: [{id: bars, op: stage, stage: 'custom:1989_q01_a2'}]
        write: '$\dfrac{9}{10} = 0.9$'
      - say: 'For 17 over 20, make the denominator 100 by multiplying the top and bottom by 5. 17 times 5 is 85, so it is 85 over 100, which is 0.85.'
        doodle_do: [{id: bars, op: stage, stage: 'custom:1989_q01_a3'}]
        write: '$\dfrac{17}{20} = \dfrac{17 \times 5}{20 \times 5} = \dfrac{85}{100} = 0.85$'
      - say: 'For 4 over 5, multiply the top and bottom by 2 to get 8 over 10, which is 0.8.'
        doodle_do: [{id: bars, op: stage, stage: 'custom:1989_q01_a4'}]
        write: '$\dfrac{4}{5} = \dfrac{8}{10} = 0.8$'
      - say: 'For 3 over 4, multiply the top and bottom by 25 to get 75 over 100, which is 0.75. That is the shortest bar.'
        doodle_do: [{id: bars, op: stage, stage: 'custom:1989_q01_a5'}]
        write: '$\dfrac{3}{4} = \dfrac{75}{100} = 0.75$'
      - say: 'And 17 over 10 is 17 divided by 10, which is 1.7. The numerator is bigger than the denominator, so it is more than 1.'
        write: '$\dfrac{17}{10} = 1.7$'
      - section: 'Arrange'
        say: 'Now arrange the four that are less than 1 from the largest, so 0.9, then 0.85, then 0.8, then 0.75.'
        write: '$0.9 > 0.85 > 0.8 > 0.75$'
        point:
          - {line: 7, kind: highlight, at: '0.85', to: {doodle: bars, part: fill2}}
      - say: 'Therefore, in fractions, the descending order is 9 over 10, 17 over 20, 4 over 5 and 3 over 4.'
        doodle_do: [{id: bars, op: pulse}]
        write: '$\therefore \dfrac{9}{10} > \dfrac{17}{20} > \dfrac{4}{5} > \dfrac{3}{4}$'
      - section: 'Check the options'
        say: 'Check the other options with the decimals. A ends with 17 over 10, which is 1.7, so it goes up at the end. B and D start with 0.8 then 0.9, which goes up.'
        write: 'Check: A ends $0.75,\ 1.7$ (up); B, D start $0.8,\ 0.9$ (up)'
      - section: 'Answer'
        say: 'Only option C goes down at every step. The answer is option C.'
        write: '$\therefore \tfrac{9}{10},\ \tfrac{17}{20},\ \tfrac{4}{5},\ \tfrac{3}{4}$'
        answer: true
    traps:
      A: 'You went for A. It starts well, 0.9, 0.8, 0.75, but it ends with 17 over 10, which is 1.7, bigger than all the others. A smaller denominator makes a bigger fraction.'
      B: 'You went for B. As decimals it begins 0.8, then 0.9, so it goes up before it goes down. Descending means every step goes down.'
      D: 'You went for D. As decimals it reads 0.8, 0.9, 1.7, 0.75, which rises twice. Change each fraction to a decimal and check that each one is smaller than the one before.'
  2:
    moments:
      - section: 'The question'
        say: 'All four options are 4.5, times a different power of ten. So everything rests on counting the zeros correctly.'
        write: 'Evaluate $2{,}700{,}000 \times 0.03 \div 18{,}000$'
      - say: 'We write the whole thing as one fraction, then cancel before we multiply.'
        write: 'Solution'
      - section: 'One fraction'
        say: '0.03 is 3 over 100. Dividing by 18,000 puts 18,000 in the denominator.'
        write: '$= \dfrac{2700000 \times 3}{100 \times 18000}$'
      - section: 'Cancel'
        say: 'Cancel the zeros. 2,700,000 has five zeros. 100 and 18,000 have five zeros between them. Cross them all off.'
        write: '$= \dfrac{27 \times 3}{1 \times 18}$'
      - say: '27 times 3 is 81. So we have 81 over 18.'
        write: '$= \dfrac{81}{18}$'
      - say: 'Both 81 and 18 divide by 9. 81 divided by 9 is 9, and 18 divided by 9 is 2.'
        write: '$= \dfrac{9}{2} = 4.5$'
      - section: 'Standard form'
        say: 'Standard form is a number from 1 up to 10, times a power of 10. 4.5 is already inside that window, so the power of 10 is 10 to the 0, which is 1.'
        doodle: {name: 'custom:1989_q02_a', id: win, caption: 'standard form: 1 up to 10'}
        doodle_do: [{id: win, op: circle, part: number}]
        write: '$4.5 = 4.5 \times 1 = 4.5 \times 10^{0}$'
      - say: 'Therefore the value is 4.5 times 10 to the power 0.'
        doodle_do: [{id: win, op: label, part: power, text: '10⁰ = 1'}]
        write: '$\therefore$ Value $= 4.5 \times 10^{0}$'
      - section: 'Check'
        say: 'To check, 2,700,000 times 0.03 is 81,000, and 81,000 divided by 18,000 is 4.5. It agrees.'
        write: 'Check: $2700000 \times 0.03 = 81000$; $81000 \div 18000 = 4.5 \ \checkmark$'
      - section: 'Answer'
        say: 'So the answer is 4.5 times 10 to the power 0, which is option A.'
        write: '$\therefore 4.5 \times 10^{0}$'
        answer: true
    traps:
      B: 'You went for 4.5 times 10 to the 1, which is 45. Count the zeros again. Five on top and five underneath cancel, leaving 81 over 18, which is 4.5.'
      C: 'You went for 4.5 times 10 squared, which is 450. That treats 0.03 as 3. Multiplying by 0.03 is multiplying by 3 over 100.'
      D: 'You went for 4.5 times 10 cubed, which is 4,500. Count the zeros. 81 over 18 is just 4.5, so the power is 10 to the 0.'
  3:
    moments:
      - section: 'The question'
        say: 'We want the prime factors of 2,520. A prime number has only two factors, 1 and itself, like 2, 3, 5, 7, 11 and so on. A prime factor is a factor that is prime.'
        write: 'Prime factors of $2520$; primes: $2,\ 3,\ 5,\ 7,\ 11,\ \ldots$'
      - section: 'Solution'
        say: 'Solution. Use the division ladder. Divide by the smallest prime that goes in, again and again, until we reach 1.'
        write: 'Solution: divide by the smallest prime each time'
        diagram: {id: L, kind: ladder, mode: factors, number: 2520}
      - say: '2,520 is even, so divide by 2 to get 1,260. 1,260 is even, giving 630. 630 is even, giving 315.'
        write: '$2520 \div 2 = 1260,\ \ 1260 \div 2 = 630,\ \ 630 \div 2 = 315$'
        diagram_do:
          - {id: L, op: step, n: 3, 'on': 'divide by 2'}
      - say: '315 is odd, so 2 will not go. Try 3. The digits 3, 1, 5 add up to 9, so 3 divides it. 315 divided by 3 is 105.'
        write: '$315 \div 3 = 105$'
        diagram_do:
          - {id: L, op: step, 'on': 'Try 3'}
      - say: 'The digits of 105 add up to 6, so 3 goes again. 105 divided by 3 is 35.'
        write: '$105 \div 3 = 35$'
        diagram_do:
          - {id: L, op: step, 'on': 'goes again'}
      - say: '35 does not divide by 3, but it ends in 5, so divide by 5 to get 7. And 7 is prime, so 7 divided by 7 is 1. Stop.'
        write: '$35 \div 5 = 7,\ \ 7 \div 7 = 1$'
        diagram_do:
          - {id: L, op: step, n: 2, 'on': 'divide by 5'}
      - say: 'Read the divisors down the ladder. Three 2s make 2 cubed, and two 3s make 3 squared.'
        write: '$2520 = 2 \times 2 \times 2 \times 3 \times 3 \times 5 \times 7 = 2^{3} \times 3^{2} \times 5 \times 7$'
        diagram_do:
          - {id: L, op: read, 'on': 'Read'}
      - say: 'The prime factors are the different primes on the ladder, each listed once.'
        write: '$\therefore$ prime factors: $2,\ 3,\ 5,\ 7$'
        diagram_do:
          - {id: L, op: highlight, part: divisors, text: '2, 3, 5, 7'}
      - section: 'Check'
        say: 'Check by multiplying back. 2 cubed is 8 and 3 squared is 9, and 8 times 9 is 72. 5 times 7 is 35. And 72 times 35 is 2,520.'
        write: 'Check: $8 \times 9 \times 5 \times 7 = 72 \times 35 = 2520\ \checkmark$'
      - say: 'Therefore the prime factors are 2, 3, 5 and 7, which is answer choice C.'
        write: '$\therefore$ prime factors: $2,\ 3,\ 5,\ 7$'
        answer: true
    traps:
      A: 'You went for 2, 9, 5. Nine does divide 2,520, but 9 is 3 times 3, so it is not prime. The list also leaves out 7.'
      B: 'You went for 2, 9, 7. Nine is not prime, since it is 3 times 3, and the list misses 5. The primes on the ladder are 2, 3, 5 and 7.'
      D: 'You went for 2, 3, 7, 9. Nine is 3 times 3, so it is a factor but not a prime factor, and 5 is missing. The prime factors are 2, 3, 5 and 7.'
  4:
    moments:
      - section: 'The question'
        say: 'One-two in base twelve equals x in base seven. Find x. There is no direct road between the two bases, so we go through base ten.'
        write: '$12_{e} = x_{7}$, where $e$ is twelve'
      - say: 'First, change one-two base twelve to base ten.'
        write: 'Solution'
      - section: 'Step 1: base 12 to base 10'
        say: 'Write the index numbers over the digits, one, nought. Then multiply each digit by twelve to the power of its index.'
        write: '$\overset{1}{1}\,\overset{0}{2}_{12} = 1 \times 12^{1} + 2 \times 12^{0}$'
      - say: 'Twelve to the power 1 is 12, and twelve to the power nought is 1. So we have 12 plus 2.'
        write: '$= 12 + 2$'
      - say: '12 plus 2 is 14, base ten.'
        write: '$= 14_{10}$'
      - section: 'Step 2: base 10 to base 7'
        say: 'Now divide 14 by 7 again and again on the ladder, and write the remainders by the side.'
        diagram: {id: L, kind: ladder, divisor: 7, number: 14, 'on': 'ladder'}
      - say: '14 divided by 7 is 2, remainder 0.'
        diagram_do:
          - {id: L, op: step}
      - say: '2 divided by 7 is 0, remainder 2. We stop at 0.'
        diagram_do:
          - {id: L, op: step}
      - say: 'Read the remainders from the bottom up, and we get two, zero. So 14 is two-zero base seven.'
        diagram_do:
          - {id: L, op: read, 'on': 'bottom up'}
        write: '$14_{10} = 20_{7}$'
        point:
          - {line: 8, kind: highlight, at: '207', to: {diagram: L, part: result}}
      - section: 'Check'
        say: 'Check by expanding back. The index numbers over two-zero are one, nought. 2 times 7, plus 0 times 1, is 14. It agrees.'
        write: '$\overset{1}{2}\,\overset{0}{0}_{7} = 2 \times 7^{1} + 0 \times 7^{0} = 14\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore x is two-zero, which is option A.'
        write: '$\therefore x = 20$'
        answer: true
    traps:
      B: 'You went for one-five. In base seven that is 12, not 14. On the ladder, 14 divided by 7 is 2, remainder 0, so x is two-zero.'
      C: 'You went for 14. That is the base-ten value, found halfway. The question wants x in base seven, so 14 goes on the ladder, and it gives two-zero.'
      D: 'You went for one-two. That just copies the digits across. One-two base twelve is 14, and 14 is two-zero base seven.'
  5:
    moments:
      - section: 'The question'
        say: 'We have a cube root, a negative index inside and a power 1 over 2 outside. Change the root to an index and work from the inside out, one law at a time.'
        write: 'Simplify $\left(\sqrt[3]{64r^{-6}}\right)^{\frac{1}{2}}$'
      - say: 'Solution. First the cube root becomes the index 1 over 3.'
        write: 'Solution'
      - section: 'Inside the bracket'
        say: 'Recall that the cube root is the power 1 over 3. So the cube root of $64r^{-6}$ is $64r^{-6}$ to the power 1 over 3.'
        write: '$\sqrt[3]{64r^{-6}} = (64r^{-6})^{\frac{1}{3}}$ $\quad [\sqrt[n]{a} = a^{\frac{1}{n}}]$'
      - say: 'The law of indices says a product to a power puts the power on each factor, the 64 and the $r^{-6}$.'
        write: '$= 64^{\frac{1}{3}} \times (r^{-6})^{\frac{1}{3}}$ $\quad [(ab)^{n} = a^{n}b^{n}]$'
      - say: '4 times 4 times 4 is 64, so the cube root of 64 is 4. Picture 64 small blocks packed into a cube, with 4 along each edge.'
        doodle: {name: 'custom:1989_q05_a', id: cube, caption: 'a cube of 64 blocks'}
        write: '$64^{\frac{1}{3}} = \sqrt[3]{64} = 4$'
        doodle_do: [{id: cube, op: label, part: side, text: '4 along'}]
      - say: 'By the law of indices, a power of a power multiplies the indices. Negative 6 times 1 over 3 is negative 2.'
        write: '$(r^{-6})^{\frac{1}{3}} = r^{-6 \times \frac{1}{3}} = r^{-2}$ $\quad [(a^{m})^{n} = a^{mn}]$'
      - say: 'Put the two pieces together.'
        write: '$\therefore \sqrt[3]{64r^{-6}} = 4r^{-2}$'
      - section: 'The power outside'
        say: 'Now apply the power 1 over 2 outside the bracket to $4r^{-2}$. The same law puts it on each factor.'
        write: '$\left(\sqrt[3]{64r^{-6}}\right)^{\frac{1}{2}} = (4r^{-2})^{\frac{1}{2}} = 4^{\frac{1}{2}} \times (r^{-2})^{\frac{1}{2}}$'
      - say: 'The power 1 over 2 is a square root, and the square root of 4 is 2. For the $r$, multiply the indices, so negative 2 times 1 over 2 is negative 1.'
        doodle_do: [{id: cube, op: stage, stage: 'custom:1989_q05_a2'}]
        write: '$= \sqrt{4} \times r^{-2 \times \frac{1}{2}} = 2r^{-1}$'
      - say: 'By the law of indices, a negative index means the reciprocal. $r$ to the negative 1 is 1 over $r$, so $2r^{-1}$ is 2 over $r$.'
        write: '$= 2 \times \dfrac{1}{r} = \dfrac{2}{r}$ $\quad [a^{-n} = \tfrac{1}{a^{n}}]$'
      - section: 'Check'
        say: 'Check with $r$ equals 1. The question becomes the cube root of 64, which is 4, and the square root of 4 is 2. Our answer, 2 over 1, is also 2.'
        write: 'Check $r = 1$: $\left(\sqrt[3]{64}\right)^{\frac{1}{2}} = 4^{\frac{1}{2}} = 2 = \dfrac{2}{1}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the expression simplifies to 2 over $r$, which is option D.'
        write: '$\therefore \left(\sqrt[3]{64r^{-6}}\right)^{\frac{1}{2}} = \dfrac{2}{r}$'
        answer: true
    traps:
      A: 'You went for $r$. The number part does not vanish. The cube root of 64 is 4, and the square root of 4 is 2. And the index of $r$ ends up negative, so $r$ goes to the denominator.'
      B: 'You went for $2r$. The 2 is right, but $r$ started with a negative index, so it ends as $r^{-1}$, which is 1 over $r$. The answer is 2 over $r$.'
      C: 'You went for 1 over $2r$. Only the $r$ has a negative index. The 2 comes from the square root of 4 and stays on top.'
  6:
    moments:
      - section: 'The question'
        say: 'We have one number, rounded in two different ways. Significant figures and decimal places are counted from different starting points, and that is the whole question.'
        doodle: {name: 'custom:1989_q06_a', id: line, caption: '0.007685 on the number line'}
        write: '$0.007685$ to 3 s.f. minus $0.007685$ to 4 d.p.: the difference?'
      - say: 'We round each one with a cut, using the rule that if the next digit is 5 or more, add 1, and if it is less than 5, leave it. Then we subtract.'
        write: 'Solution'
      - section: 'Three significant figures'
        say: 'Significant figures start at the first non-zero digit, here the 7. Count 7, 6, 8 and cut. The next digit is 5, so add 1, and the 8 becomes 9.'
        doodle_do: [{id: line, op: stage, stage: 'custom:1989_q06_a2'}]
        write: '$0.00768|5 \approx 0.00769$ (3 s.f.)'
      - section: 'Four decimal places'
        say: 'Decimal places are counted from the decimal point. Count 0, 0, 7, 6 and cut. The next digit is 8, so add 1, and the 6 becomes 7.'
        doodle_do: [{id: line, op: stage, stage: 'custom:1989_q06_a3'}]
        write: '$0.0076|85 \approx 0.0077$ (4 d.p.)'
      - section: 'The difference'
        say: 'Subtract the smaller from the larger. Write 0.0077 as 0.00770 so the decimal places line up.'
        write: '$\begin{array}{r} 0.00770 \\ -\ 0.00769 \\ \hline 0.00001 \end{array}$'
      - say: '770 minus 769 is 1, so the difference is 0.00001, which is a 1 in the fifth decimal place.'
        doodle_do: [{id: line, op: label, part: gap, text: '0.00001'}]
        write: 'Difference $= 0.00001$'
      - say: '0.00001 is 1 over 100,000, and 100,000 is 10 to the power 5. So the difference is 10 to the power minus 5.'
        write: '$\therefore$ Difference $= \dfrac{1}{100000} = \dfrac{1}{10^{5}} = 10^{-5}$'
      - section: 'Check'
        say: 'Check by adding back. 0.00769 plus 0.00001 is 0.00770, the 4 decimal place answer.'
        write: 'Check: $0.00769 + 0.00001 = 0.00770 \ \checkmark$'
      - section: 'Answer'
        say: 'So the difference is 10 to the power minus 5, which is option A.'
        write: '$\therefore$ Difference $= 10^{-5}$'
        answer: true
    traps:
      B: 'You went for 7 times 10 to the minus 4, which is 0.0007. That is not the gap between the two rounded numbers. 0.00770 minus 0.00769 is 0.00001.'
      C: 'You went for 8 times 10 to the minus 5. Check the rounding. 3 s.f. gives 0.00769 and 4 d.p. gives 0.0077. They differ by only 1 in the fifth decimal place.'
      D: 'You went for 10 to the minus 6. The difference is 0.00001, which has the 1 in the fifth decimal place, so it is 10 to the minus 5.'
  7:
    moments:
      - section: 'The question'
        say: 'We have two ratios, and we want a new ratio made from them. We do not know a, b, x or y, but we do not need to, because the ratios carry their own constants.'
        write: '$a : b = 5 : 8,\ \ x : y = 25 : 16$. Find $\dfrac{a}{x} : \dfrac{b}{y}$'
      - say: 'A ratio 5 to 8 means a and b are 5 and 8 times the same number. We give each ratio its own constant.'
        write: 'Solution'
      - say: 'Let a equal 5k and b equal 8k, where k is a constant.'
        write: 'Let $a = 5k,\ \ b = 8k$'
      - say: 'And let x equal 25m and y equal 16m, where m is another constant.'
        write: 'Let $x = 25m,\ \ y = 16m$'
      - section: 'Substitute'
        say: 'a over x is 5k over 25m. Cancel by 5 to get k over 5m.'
        write: '$\dfrac{a}{x} = \dfrac{5k}{25m} = \dfrac{k}{5m}$'
      - say: 'b over y is 8k over 16m. Cancel by 8 to get k over 2m.'
        write: '$\dfrac{b}{y} = \dfrac{8k}{16m} = \dfrac{k}{2m}$'
      - say: 'So the ratio we want is k over 5m, to k over 2m.'
        write: '$\dfrac{a}{x} : \dfrac{b}{y} = \dfrac{k}{5m} : \dfrac{k}{2m}$'
      - section: 'Simplify'
        say: 'Multiplying both terms of a ratio by the same number keeps the ratio. Multiply both by 10m over k, and the k and m cancel.'
        write: '$= \dfrac{10}{5} : \dfrac{10}{2}$ (both $\times \dfrac{10m}{k}$)'
      - say: '10 over 5 is 2, and 10 over 2 is 5.'
        write: '$\therefore \dfrac{a}{x} : \dfrac{b}{y} = 2 : 5$'
      - section: 'Check'
        say: 'Check with a equal to 5, x 25, b 8 and y 16. 5 over 25 is one fifth and 8 over 16 is a half. Multiplying both by 10 gives 2 to 5.'
        write: 'Check: $\dfrac{5}{25} : \dfrac{8}{16} = \dfrac{1}{5} : \dfrac{1}{2} = 2 : 5 \ \checkmark$'
      - section: 'Answer'
        say: 'So the ratio is 2 to 5, which is option D.'
        write: '$\therefore 2 : 5$'
        answer: true
    traps:
      A: 'You went for 125 to 128. That comes from multiplying, 5 times 25 against 8 times 16. The question wants a divided by x, which is 5k over 25m, and b divided by y, which is 8k over 16m.'
      B: 'You went for 3 to 5. Work out each fraction. a over x is k over 5m and b over y is k over 2m. Multiply both by 10m over k to get 2 to 5.'
      C: 'You went for 3 to 4. Put in a over x equals k over 5m and b over y equals k over 2m. Multiplying both by 10m over k gives 2 to 5.'
  8:
    moments:
      - section: 'The question'
        say: 'Oke puts 800 naira in the bank at simple interest. It grows until it is one and a half times what he put in. How many years did that take?'
        write: 'Number of years $= ?$'
        doodle: {name: 'custom:1989_q08_a', id: jar, caption: 'Oke''s money in the bank'}
        doodle_do:
          - {id: jar, op: fill, to: 0.67}
      - section: 'Solution'
        say: 'Solution. List what we are given. The principal, the money put in, is 800 naira. The rate is 12 and a half percent a year. The time $T$ is what we want.'
        write: '$P =$ ₦800, $\ R = 12\tfrac{1}{2}\%$, $\ T = ?$'
      - say: 'The amount at the end is one and a half times the principal. One and a half is 3 over 2, and 3 over 2 of 800 is 1,200 naira.'
        write: '$A = 1\tfrac{1}{2} \times 800 = \tfrac{3}{2} \times 800 = 1200$'
        doodle_do:
          - {id: jar, op: label, part: top, text: '₦1,200', 'on': '1,200 naira'}
      - section: 'The interest'
        say: 'The amount is the principal plus the interest.'
        write: '$A = P + I$'
      - say: 'So the interest is the amount minus the principal, which is 1,200 minus 800, or 400 naira. That is the gap at the top of the jar.'
        write: '$I = A - P = 1200 - 800 = 400$'
        doodle_do:
          - {id: jar, op: label, part: interest, text: '₦400 to earn', 'on': 'gap at the top'}
      - section: 'The formula'
        say: 'Now the simple interest formula, where interest equals principal, times rate, times time, all over 100.'
        'on': 'simple interest formula'
        write: '$I = \dfrac{PRT}{100}$'
      - say: 'Substitute $I$ equals 400, $P$ equals 800 and $R$ equals 12 and a half.'
        write: '$400 = \dfrac{800 \times 12\tfrac{1}{2} \times T}{100}$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '= [[400]]'}, at: '[[400]] =', text: 'I'}
      - say: '12 and a half is 25 over 2. So the top has 800 times 25 over 2.'
        write: '$400 = \dfrac{800 \times 25 \times T}{2 \times 100}$'
      - say: 'Cancel first. 800 divided by 2 times 100, which is 200, is 4. Then 4 times 25 is 100.'
        write: '$400 = 4 \times 25 \times T = 100T$'
      - say: 'Divide both sides by 100. 400 divided by 100 is 4.'
        write: '$T = \dfrac{400}{100} = 4$'
      - section: 'Check'
        say: 'Check year by year. One year''s interest is 12 and a half over 100, times 800, which is 100 naira.'
        write: 'Check: one year $= \dfrac{12\tfrac{1}{2}}{100} \times 800 = 100$'
      - say: 'In 4 years that is 4 times 100, which is 400 naira, and the jar is full, at 1,200.'
        write: '$4 \times 100 = 400\ \checkmark$'
        doodle_do:
          - {id: jar, op: fill, to: 1, 'on': 'jar is full'}
          - {id: jar, op: stage, stage: 'custom:1989_q08_a2'}
      - say: 'Therefore the money was in the bank for 4 years, which is answer choice B.'
        write: '$\therefore T = 4$ years'
        answer: true
        doodle_do:
          - {id: jar, op: label, part: years, text: '4 years'}
    traps:
      A: 'You went for 2. In 2 years the interest is only 2 times 100, which is 200 naira. It needs 400 naira of interest, so $T$ is 4 years.'
      C: 'You went for 5 and a half. Substituting into $I = \dfrac{PRT}{100}$ gives $400 = 100T$, so $T$ is exactly 4.'
      D: 'You went for 8. That is how long the money takes to double, when the interest is a full 800 naira. Here the interest is only 400 naira, so it takes 4 years.'
  9:
    moments:
      - section: 'The question'
        say: 'Think of the paint it takes to cover a ball. A bigger ball needs 44 percent more paint. How much wider is it? It is not 44 percent, as we will see.'
        write: 'Find the percentage increase in the diameter.'
        doodle: {name: 'custom:1989_q09_a', id: paint, caption: 'paint to cover = surface area'}
      - say: 'Write Solution, then sketch the old sphere and the new, bigger one.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'area A', text: 'old', 'on': 'old sphere'}
          - {figure: sketch, kind: circle, target: 'area 1.44A', text: 'new', 'on': 'bigger one'}
      - section: 'Let'
        say: 'Let the old radius be r and the new radius be capital R.'
        write: 'Let the old radius be $r$ and the new radius be $R$'
      - section: 'The formula'
        say: 'The surface area of a sphere is 4 pi r squared.'
        write: 'Surface area $= 4\pi r^{2}$'
      - say: 'Increased by 44 percent means 100 plus 44, which is 144 percent of the old area, or 1.44 times it.'
        write: 'New area $= \dfrac{144}{100} \times 4\pi r^{2} = 1.44 \times 4\pi r^{2}$'
        doodle_do:
          - {id: paint, op: circle, part: tin2, 'on': '144 percent'}
      - say: 'The new area is also 4 pi capital R squared. So set the two equal.'
        write: '$4\pi R^{2} = 1.44 \times 4\pi r^{2}$'
      - section: 'Simplify'
        say: 'Divide both sides by 4 pi.'
        write: '$R^{2} = 1.44r^{2}$'
      - say: 'Take the square root of both sides. 1.2 times 1.2 is 1.44, so the square root of 1.44 is 1.2.'
        write: '$R = \sqrt{1.44}\,r = 1.2r$'
      - say: 'The diameter is twice the radius. The old diameter is 2r, and the new diameter is 2R, which is 1.2 times 2r.'
        write: 'New diameter $= 2R = 1.2 \times 2r$'
        doodle_do:
          - {id: paint, op: label, part: d2, text: '1.2 × old', 'on': '1.2 times 2r'}
        point:
          - {figure: sketch, kind: label, target: 'kd = ?', text: '1.2 × old', 'on': 'new diameter'}
      - section: 'Percentage increase'
        say: 'Percentage increase is the increase over the original, times 100.'
        write: '$\%$ increase $= \dfrac{\text{new} - \text{old}}{\text{old}} \times 100$'
      - say: 'Substitute, giving 1.2 times 2r minus 2r, over 2r. The 2r cancels, leaving 1.2 minus 1, which is 0.2. 0.2 times 100 is 20.'
        write: '$= \dfrac{1.2(2r) - 2r}{2r} \times 100 = 0.2 \times 100 = 20$'
      - say: 'Therefore the diameter increases by 20 percent.'
        write: '$\therefore$ diameter increases by $20\%$'
      - section: 'Check'
        say: 'To check, if the diameter is 1.2 times as big, the area is 1.2 squared times as big. 1.2 squared is 1.44, a 44 percent rise.'
        write: 'Check: $1.2^{2} = 1.44$, a $44\%$ rise ✓'
      - section: 'Answer'
        say: 'So the diameter increases by 20 percent, which is answer choice D.'
        write: '$\therefore$ increase $= 20\%$ (D)'
        answer: true
    traps:
      A: 'You went for 44. That assumes the diameter grows by the same percentage as the area. But area goes with the square of the radius, so R is the square root of 1.44, times r, which is 1.2 r.'
      B: 'You went for 30. The diameter''s factor, squared, must be 1.44, and 1.2 squared is 1.44. So the increase is 20 percent.'
      C: 'You went for 22, half of 44. Halving the percentage is not the same as taking a square root. The square root of 1.44 is 1.2, a 20 percent increase.'
  10:
    moments:
      - section: 'The question'
        say: 'We can''t take a fraction with root 3 in its denominator away from 4 as it stands. Rationalise it first, and the subtraction becomes easy.'
        write: 'Simplify $4 - \dfrac{1}{2 - \sqrt{3}}$'
      - say: 'Solution. Rationalise the fraction, then subtract it from 4.'
        write: 'Solution'
      - section: 'Rationalise'
        say: 'Multiply the numerator and denominator by the conjugate of 2 minus root 3, which is 2 plus root 3, the same terms with the middle sign changed.'
        write: '$\dfrac{1}{2 - \sqrt{3}} = \dfrac{1}{2 - \sqrt{3}} \times \dfrac{2 + \sqrt{3}}{2 + \sqrt{3}}$'
      - say: 'The numerator is 2 plus root 3. The denominator is a difference of two squares, 2 squared minus root 3 squared. Picture a 2 by 2 square of 4 tiles, and a square of side root 3 with area 3.'
        doodle: {name: 'custom:1989_q10_a', id: tiles, caption: 'a root 3 square has area 3'}
        write: '$= \dfrac{2 + \sqrt{3}}{2^{2} - (\sqrt{3})^{2}}$ $\quad [(a - b)(a + b) = a^{2} - b^{2}]$'
      - say: '2 squared is 4, and root 3 squared is 3. Take 3 tiles away from 4, and one is left.'
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1989_q10_a2'}
        write: '$= \dfrac{2 + \sqrt{3}}{4 - 3}$'
      - say: '4 minus 3 is 1, the single tile left over, and anything over 1 is itself.'
        doodle_do:
          - {id: tiles, op: pulse, part: left}
        write: '$= 2 + \sqrt{3}$'
      - section: 'Substitute'
        say: 'Now go back to the expression and put this in place of the fraction. Keep it in a bracket.'
        write: '$\therefore 4 - \dfrac{1}{2 - \sqrt{3}} = 4 - (2 + \sqrt{3})$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= 2 + 3'}, at: '(2 + 3)', text: 'put this in'}
      - say: 'Open the bracket. The minus in front of it changes both signs, giving 4 minus 2, minus root 3.'
        write: '$= 4 - 2 - \sqrt{3}$'
      - say: '4 minus 2 is 2.'
        write: '$= 2 - \sqrt{3}$'
      - section: 'Check'
        say: 'Check with decimals. 2 minus root 3 is about 0.268, and 1 over 0.268 is about 3.732. 4 minus 3.732 is 0.268, the same as our answer.'
        write: 'Check: $4 - \dfrac{1}{0.268} \approx 4 - 3.732 = 0.268 \approx 2 - \sqrt{3}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the expression simplifies to 2 minus root 3, which is option D.'
        write: '$\therefore 4 - \dfrac{1}{2 - \sqrt{3}} = 2 - \sqrt{3}$'
        answer: true
    traps:
      A: 'You went for 2 root 3. The fraction rationalises to 2 plus root 3, and 4 minus that is 2 minus root 3. The root 3 is subtracted, not doubled.'
      B: 'You went for minus 2 minus root 3. That is the fraction with a minus in front, but the 4 is still there. 4 minus 2 minus root 3 is 2 minus root 3.'
      C: 'You went for minus 2 plus root 3. Both signs are reversed. The minus in front of the bracket changes both terms, so 4 minus, bracket, 2 plus root 3, is 2 minus root 3.'
  11:
    moments:
      - section: 'The question'
        say: 'There are two logs on the left and a plain 3 on the right. Squeeze the left side into one logarithm, change it to index form, and $p$ comes out in terms of $q$.'
        write: 'Find $p$ in terms of $q$ if $\log_{3}p + 3\log_{3}q = 3$'
      - say: 'Solution. First the laws of logarithms, then index form.'
        write: 'Solution'
      - section: 'A single logarithm'
        say: 'Recall the power law, which says $n$ times log $M$ is the log of $M$ to the power $n$. The number in front goes up as an index.'
        write: 'Recall: $n\log_{a}M = \log_{a}M^{n}$'
      - say: 'By the power law, 3 log base 3 of $q$ is log base 3 of $q$ cubed.'
        write: '$3\log_{3}q = \log_{3}q^{3}$'
      - say: 'Put that back into the equation.'
        write: '$\log_{3}p + \log_{3}q^{3} = 3$'
      - say: 'Recall the product law, which says adding two logs to the same base gives the log of the product.'
        write: 'Recall: $\log_{a}M + \log_{a}N = \log_{a}MN$'
      - say: 'By the product law, the left side is log base 3 of $p$ times $q$ cubed.'
        write: '$\log_{3}\left(pq^{3}\right) = 3$'
      - section: 'Index form'
        say: 'Change to index form. Log base 3 of $N$ equals 3 means $N$ is 3 to the power 3. Picture three 3s multiplied.'
        doodle: {name: 'custom:1989_q11_a', id: tower, caption: '3 to the power 3'}
        write: '$pq^{3} = 3^{3}$'
      - say: '3 cubed is 3 times 3 times 3, which is 27.'
        doodle_do:
          - {id: tower, op: label, part: result, text: '27'}
        write: '$pq^{3} = 27$'
      - say: 'Divide both sides by $q$ cubed, to get $p$ by itself.'
        write: '$p = \dfrac{27}{q^{3}}$'
      - section: 'Match the options'
        say: 'The options are written as one power. 27 is 3 cubed, so the top and the bottom are both cubes.'
        write: '$p = \dfrac{3^{3}}{q^{3}}$'
      - say: 'By the law of indices, $a$ to the $n$ over $b$ to the $n$ is $a$ over $b$, all to the power $n$. So this is 3 over $q$, all cubed.'
        write: '$\therefore p = \left(\dfrac{3}{q}\right)^{3}$ $\quad [\tfrac{a^{n}}{b^{n}} = (\tfrac{a}{b})^{n}]$'
      - section: 'Check'
        say: 'Check with $q$ equal to 1. Then $p$ is 27. Log base 3 of 27 is 3, and log base 3 of 1 is 0, so 3 plus 0 is 3. It works.'
        doodle_do:
          - {id: tower, op: circle, part: count}
        write: 'Check $q = 1$, $p = 27$: $\log_{3}27 + 3\log_{3}1 = 3 + 0 = 3\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore $p$ is 3 over $q$, all cubed, which is option A.'
        write: '$\therefore p = \left(\dfrac{3}{q}\right)^{3}$'
        answer: true
    traps:
      B: 'You went for $q$ over 3 to the power 1 over 3. Both parts are turned round. $p$ times $q$ cubed is 27, so $p$ is 27 over $q$ cubed, which is 3 over $q$, cubed.'
      C: 'You went for $q$ over 3, cubed. The fraction is upside down. $p$ times $q$ cubed is 27, so $q$ cubed goes in the denominator, and $p$ is 27 over $q$ cubed.'
      D: 'You went for 3 over $q$ to the power 1 over 3. By the power law, the 3 in front of the log becomes an index of 3, a cube, not a cube root.'
  12:
    moments:
      - section: 'The question'
        say: 'We have 9 to the $y$ and 3 to the $y$ in one equation. 9 is 3 squared, so this is a quadratic equation in disguise. Many students stop at the values of $u$, but we will go back to $y$.'
        write: 'Solve $9^{y} - 4(3^{y}) + 3 = 0$'
      - say: 'Solution. First we write 9 to the $y$ using 3 to the $y$.'
        write: 'Solution'
      - section: 'A quadratic in disguise'
        say: '9 is 3 squared. By the law of indices, a power of a power multiplies the indices. So 9 to the $y$ is 3 to the $2y$, which is 3 to the $y$, all squared.'
        write: '$9^{y} = (3^{2})^{y} = 3^{2y} = (3^{y})^{2}$ $\quad [(a^{m})^{n} = a^{mn}]$'
      - say: 'Put that into the equation.'
        write: '$(3^{y})^{2} - 4(3^{y}) + 3 = 0$'
      - say: 'Let $u$ be 3 to the $y$. The letter $u$ stands in for 3 to the $y$.'
        write: 'Let $u = 3^{y}$'
      - say: 'Then the equation becomes $u$ squared minus $4u$ plus 3 equals 0.'
        write: '$u^{2} - 4u + 3 = 0$'
      - section: 'Factorise'
        say: 'We need two numbers whose product is 3 and whose sum is negative 4. They are negative 1 and negative 3.'
        write: 'Product $= 3$, Sum $= -4$: $\ -1$ and $-3$'
      - say: 'Split the middle term, so negative $4u$ becomes negative $u$ minus $3u$.'
        write: '$u^{2} - u - 3u + 3 = 0$'
      - say: 'Then factorise in pairs, giving $u$ times, $u$ minus 1, minus 3 times, $u$ minus 1.'
        write: '$u(u - 1) - 3(u - 1) = 0$'
      - say: '$u$ minus 1 is common, so take it out.'
        write: '$(u - 1)(u - 3) = 0$'
      - say: 'Either $u$ minus 1 is zero or $u$ minus 3 is zero. So $u$ is 1 or $u$ is 3.'
        write: 'Either $u = 1$ or $u = 3$'
      - section: 'Back to y'
        say: 'But we want $y$, not $u$. Go back to $u$ equals 3 to the $y$. First, 3 to the $y$ equals 1. By the zero index law, 1 is 3 to the power 0, so equating the indices, $y$ is 0.'
        write: '$3^{y} = 1 = 3^{0} \quad \therefore y = 0$ $\quad [a^{0} = 1]$'
        point:
          - {line: 4, kind: underline, at: 'u=3y', text: 'back to y'}
          - {line: 10, kind: circle, at: 'u=1'}
      - say: 'Second, 3 to the $y$ equals 3, which is 3 to the power 1. Equating the indices, $y$ is 1.'
        write: '$3^{y} = 3 = 3^{1} \quad \therefore y = 1$'
        point:
          - {line: 10, kind: circle, at: 'u=3'}
      - section: 'Check'
        say: 'Check $y$ equals 1. 9 minus 4 times 3, plus 3, is 9 minus 12 plus 3, which is 0. Then check $y$ equals 0, and 1 minus 4 plus 3 is 0. Both work.'
        write: 'Check: $9 - 4(3) + 3 = 0$ and $1 - 4(1) + 3 = 0\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the values of $y$ are 0 and 1, which is option D.'
        write: '$\therefore y = 0$ or $y = 1$'
        answer: true
    traps:
      A: 'You went for negative 1 and 0. 3 to the power negative 1 is 1 over 3, and that is not 1 or 3. The solutions come from 3 to the $y$ equals 1, so $y$ is 0, and 3 to the $y$ equals 3, so $y$ is 1.'
      B: 'You went for negative 1 and 1. The 1 is right, but $y$ equals negative 1 gives 1 over 9, minus 4 over 3, plus 3, which is not zero. The other solution is $y$ equals 0.'
      C: 'You went for 1 and 3. Those are the values of $u$, which is 3 to the $y$. Go back to $y$. 3 to the $y$ equals 1 gives 0, and 3 to the $y$ equals 3 gives 1.'
  13:
    moments:
      - section: 'The question'
        say: 'Make $R$ the subject. $R$ is hiding twice, on top and at the bottom, under a square root. The trick is to gather both $R$ terms and factorise.'
        write: '$S = \sqrt{\dfrac{2R + T}{2RT}}$'
      - section: 'Solution'
        say: 'We undo the operations one at a time, starting with the outside one, the square root.'
        write: 'Solution'
      - say: 'Square both sides, because squaring undoes a square root.'
        write: '$S^{2} = \dfrac{2R + T}{2RT}$'
      - say: 'Cross multiply. $S$ squared times $2RT$ equals $2R$ plus $T$. We write the left side as $2RTS^{2}$.'
        write: '$2RTS^{2} = 2R + T$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '2RT'}, at: '[[2RT]]S2', text: 'cross multiply'}
      - say: 'Collect the terms in $R$ on one side. Subtract $2R$ from both sides.'
        write: '$2RTS^{2} - 2R = T$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= [[2R]]'}, at: '− 2R', text: 'across the ='}
      - say: 'Both terms on the left have $2R$, so factorise out $2R$. $2RTS^{2}$ divided by $2R$ leaves $TS^{2}$, and $2R$ divided by $2R$ leaves 1.'
        write: '$2R(TS^{2} - 1) = T$'
      - say: 'Divide both sides by 2 times the bracket, so that $R$ stands alone.'
        write: '$R = \dfrac{T}{2(TS^{2} - 1)}$'
      - section: 'Check'
        say: 'Take $R$ equals 1 and $T$ equals 2. In the question, the top is 2 plus 2, which is 4, and the bottom is 2 times 1 times 2, which is 4. So $S$ squared is 1.'
        write: '$R = 1,\ T = 2$: $S^{2} = \dfrac{4}{4} = 1$'
      - say: 'Now our formula gives 2, over 2 times, 2 times 1 minus 1. That is 2 over 2, which is 1, the $R$ we started with.'
        write: '$R = \dfrac{2}{2(2 \times 1 - 1)} = 1\ \checkmark$'
      - say: 'Therefore $R$ equals $T$ over 2 times, $TS$ squared minus 1, which is option B.'
        write: '$\therefore R = \dfrac{T}{2(TS^{2} - 1)}$ (B)'
        answer: true
    traps:
      A: 'You went for A. It is nearly right, but it loses the 2. When you factorise $2RTS^{2} - 2R$, the common factor is $2R$, the number included.'
      C: 'You went for C. The sign in the bracket is wrong and the 2 is missing. Subtracting $2R$ from both sides gives $TS^{2}$ minus 1, and the common factor is $2R$.'
      D: 'You went for D. The 2 is right, but $2R$ is subtracted from both sides, so the bracket is $TS^{2}$ minus 1, not plus 1.'
  14:
    moments:
      - section: 'The question'
        say: 'We have a negative fraction to put into three powers, and one of them is a negative index. Signs slip easily here, so we work out each power on its own, in brackets.'
        write: 'Find $\dfrac{32}{81}x^{3} - \dfrac{64}{27}x^{2} - \dfrac{81}{16}x^{-3}$ when $x = -\tfrac{3}{4}$'
      - say: 'Solution. We find each power of $x$ first, then substitute.'
        write: 'Solution'
      - section: 'The powers of x'
        say: 'By the law of indices, a fraction to a power puts the power on the top and the bottom. 3 cubed is 27 and 4 cubed is 64. Three negatives multiplied give a negative.'
        write: '$x^{3} = \left(-\tfrac{3}{4}\right)^{3} = -\dfrac{3^{3}}{4^{3}} = -\dfrac{27}{64}$ $\quad [(\tfrac{a}{b})^{n} = \tfrac{a^{n}}{b^{n}}]$'
      - say: '3 squared is 9 and 4 squared is 16. Two negatives multiplied give a positive.'
        write: '$x^{2} = \left(-\tfrac{3}{4}\right)^{2} = \dfrac{9}{16}$'
      - say: 'By the law of indices, a negative index means the reciprocal. $x$ to the negative 3 is 1 over $x$ cubed.'
        write: '$x^{-3} = \dfrac{1}{x^{3}}$ $\quad [a^{-n} = \tfrac{1}{a^{n}}]$'
      - say: 'We found $x$ cubed is negative 27 over 64. 1 over it turns the fraction upside down, giving negative 64 over 27.'
        write: '$= 1 \div \left(-\dfrac{27}{64}\right) = -\dfrac{64}{27}$'
      - section: 'Substitute'
        say: 'Now substitute the three values into the expression, each in brackets.'
        write: 'Expression $= \tfrac{32}{81}\left(-\tfrac{27}{64}\right) - \tfrac{64}{27}\left(\tfrac{9}{16}\right) - \tfrac{81}{16}\left(-\tfrac{64}{27}\right)$'
      - say: 'By BODMAS, the multiplications come before the subtractions. In the first term, cancel before multiplying. 32 into 64 is 2, and 27 into 81 is 3. So it is negative 1 over 3 times 2, which is negative 1 over 6.'
        write: '$\tfrac{32}{81} \times \left(-\tfrac{27}{64}\right) = -\tfrac{1}{3 \times 2} = -\tfrac{1}{6}$'
      - say: 'In the second term, 16 into 64 is 4, and 9 into 27 is 3. So it is 4 over 3.'
        write: '$\tfrac{64}{27} \times \tfrac{9}{16} = \tfrac{4}{3}$'
      - say: 'In the third term, 27 into 81 is 3, and 16 into 64 is 4. 3 times 4 is 12, and the sign is negative.'
        write: '$\tfrac{81}{16} \times \left(-\tfrac{64}{27}\right) = -(3 \times 4) = -12$'
      - section: 'Simplify'
        say: 'Put the three products back into the expression.'
        write: 'Expression $= -\tfrac{1}{6} - \tfrac{4}{3} - (-12)$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '=−12'}, at: '(−12)', text: 'third term'}
      - say: 'Minus negative 12 is plus 12, because two minus signs make a plus.'
        write: '$= -\tfrac{1}{6} - \tfrac{4}{3} + 12$'
      - say: 'The L.C.M. is 6. 4 over 3 is 8 over 6, and 12 is 72 over 6.'
        write: '$= \dfrac{-1 - 8 + 72}{6}$'
      - say: 'Negative 1 minus 8 is negative 9, and negative 9 plus 72 is 63.'
        write: '$= \dfrac{63}{6}$'
      - say: '63 and 6 both divide by 3, giving 21 over 2. And 21 over 2 is 10 and a half.'
        write: '$\therefore$ Expression $= \dfrac{21}{2} = 10\tfrac{1}{2}$'
      - section: 'Check'
        say: 'Check in decimals. Negative 1 over 6 is about negative 0.167, and negative 4 over 3 is about negative 1.333. Together that is negative 1.5, and negative 1.5 plus 12 is 10.5.'
        write: 'Check: $-0.167 - 1.333 + 12 = 10.5\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the value is 10 and a half, which is option A.'
        write: '$\therefore 10\tfrac{1}{2}$'
        answer: true
    traps:
      B: 'You went for 10 and 1 over 6. Check the first two terms. Negative 1 over 6 minus 8 over 6 is negative 9 over 6. Then 72 over 6 minus 9 over 6 is 63 over 6, which is 10 and a half.'
      C: 'You went for 3 and 3 over 8. The last term is the big one. 81 over 16 times negative 64 over 27 is negative 12, and subtracting it adds 12.'
      D: 'You went for negative 13 and a half. That is the double negative slip. The last term is negative 12, and minus negative 12 is plus 12. Two minus signs make a plus.'
  15:
    moments:
      - section: 'The question'
        say: 'Dinner costs ₦74 for 20 students and ₦96 for 30. Part of the bill is fixed, and part grows with the number of students. What do 15 students pay?'
        write: '₦74 for 20 students; ₦96 for 30 students'
      - say: 'Solution. Let $C$ be the cost in naira and $n$ the number of students.'
        write: 'Solution: let $C$ = cost (₦), $n$ = number of students'
      - say: 'The constant part gives a constant, $k$ one. The part that varies directly as $n$ gives $k$ two times $n$. There are two parts, so there are two constants.'
        write: '$C = k_{1} + k_{2}n$'
      - section: 'Two equations'
        say: 'When $n$ is 20, $C$ is 74. That is equation one.'
        write: '$74 = k_{1} + 20k_{2} \quad \ldots (1)$'
        point:
          - {line: 0, kind: underline, at: '₦74 for 20', text: 'given'}
      - say: 'When $n$ is 30, $C$ is 96. That is equation two.'
        write: '$96 = k_{1} + 30k_{2} \quad \ldots (2)$'
        point:
          - {line: 0, kind: underline, at: '₦96 for 30', text: 'given'}
      - section: 'Solve for the constants'
        say: 'Subtract equation one from equation two. The $k$ ones cancel. 96 minus 74 is 22, and 30 $k$ two minus 20 $k$ two is 10 $k$ two.'
        write: '$(2) - (1)$: $\ 22 = 10k_{2}$'
      - say: 'Divide both sides by 10. Each student adds ₦2.20.'
        write: '$\therefore\ k_{2} = \dfrac{22}{10} = 2.2$'
      - say: 'Substitute $k$ two equals 2.2 in equation one. 20 times 2.2 is 44.'
        write: 'Sub. in (1): $\ 74 = k_{1} + 20(2.2) = k_{1} + 44$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '= 2.2'}, at: '(2.2)', text: 'k₂'}
      - say: '74 minus 44 is 30. So the fixed part of the bill is ₦30.'
        write: '$\therefore\ k_{1} = 74 - 44 = 30$'
        point:
          - {line: 8, kind: highlight, at: '30'}
      - section: 'The equation'
        say: 'The law of variation is that cost equals 30, plus 2.2 times the number of students.'
        write: '$\therefore\ C = 30 + 2.2n$'
      - section: 'Find C for 15 students'
        say: 'Substitute $n$ equals 15. 2.2 times 15 is 33.'
        write: 'When $n = 15$: $\ C = 30 + 2.2(15) = 30 + 33$'
      - say: '30 plus 33 is 63.'
        write: '$= 63$'
      - section: 'Check'
        say: 'Check equation two. 2.2 times 30 is 66, and 30 plus 66 is 96. That matches the question.'
        write: 'Check $n = 30$: $\ 30 + 2.2(30) = 30 + 66 = 96\ \checkmark$'
      - say: 'So 15 students pay ₦63.00, which is option B.'
        write: '$\therefore$ cost for 15 students $=$ ₦63.00'
        answer: true
    traps:
      A: 'You went for ₦68.50. The cost per student is ₦2.20 and the fixed part is ₦30, so 15 students cost 30 plus 33, which is ₦63.'
      C: 'You went for ₦60.00. Check the per-student cost. 22 extra naira for 10 extra students is ₦2.20 each, and 15 times 2.20 is 33, plus 30 is 63.'
      D: 'You went for ₦52.00. That''s too far down. The fixed ₦30 doesn''t shrink with fewer students. 30 plus 15 times 2.2 is ₦63.'
  16:
    moments:
      - section: 'The question'
        say: '$f$ of $x$ plus 1 does not mean $f$ of $x$, plus 1. Picture $f$ as a machine, where the whole bracket, $x$ plus 1, goes in at the top.'
        write: '$f(x) = 2x^{2} - 5x + 3$'
        doodle: {name: 'custom:1989_q16_a', id: fm, caption: 'feed x + 1 into f'}
      - section: 'Solution'
        say: 'We substitute $x$ plus 1 for $x$, then open the brackets and collect like terms.'
        write: 'Solution'
      - say: 'Replace every $x$ in the rule by $x$ plus 1, in brackets, so that every term gets the whole input.'
        write: '$f(x + 1) = 2(x + 1)^{2} - 5(x + 1) + 3$'
        doodle_do:
          - {id: fm, op: circle, part: input}
      - say: 'Expand the square first. $x$ plus 1, squared, is $x$ plus 1 times $x$ plus 1, which is $x$ squared plus $2x$ plus 1.'
        write: '$(x + 1)^{2} = x^{2} + 2x + 1$'
      - say: 'Put it back, and open the second bracket. Negative 5 times $x$ is negative $5x$, and negative 5 times 1 is negative 5.'
        write: '$= 2(x^{2} + 2x + 1) - 5x - 5 + 3$'
      - say: 'Open the first bracket, so 2 times each term gives $2x$ squared, plus $4x$, plus 2.'
        write: '$= 2x^{2} + 4x + 2 - 5x - 5 + 3$'
      - say: 'Collect like terms. $4x$ minus $5x$ is negative $x$. For the numbers, 2 minus 5 plus 3 is 0.'
        write: '$= 2x^{2} - x + 0$'
        point:
          - {line: 6, kind: underline, at: '−x', text: '4x − 5x'}
      - say: 'Therefore what comes out of the machine is $2x$ squared minus $x$.'
        write: '$\therefore f(x + 1) = 2x^{2} - x$'
        doodle_do:
          - {id: fm, op: label, part: output, text: '2x² − x'}
      - section: 'Check'
        say: 'Take $x$ equals 0. Then $f$ of $x$ plus 1 is $f$ of 1, which is 2 minus 5 plus 3, which is 0.'
        write: '$x = 0$: $f(1) = 2 - 5 + 3 = 0$'
      - say: 'Our answer gives 2 times 0 squared, minus 0, which is also 0.'
        write: '$2(0)^{2} - 0 = 0\ \checkmark$'
      - say: 'So $f$ of $x$ plus 1 is $2x$ squared minus $x$, which is option A.'
        write: '$\therefore f(x + 1) = 2x^{2} - x$ (A)'
        answer: true
    traps:
      B: 'You went for $2x^{2}$ minus $x$ plus 10. The numbers were added as 2 plus 5 plus 3. The 5 is negative, so it is 2 minus 5 plus 3, which is 0.'
      C: 'You went for $4x^{2}$ plus $3x$ plus 2. The $x^{2}$ term stays at 2, because $x + 1$ squared starts with $x^{2}$, times 2. Open the brackets carefully and you get $2x^{2}$ minus $x$.'
      D: 'You went for $4x^{2}$ plus $3x$ plus 12. Only the $x$ inside the rule changes. The 2 in front stays as 2. Opening the brackets gives $2x^{2}$ minus $x$.'
  17:
    moments:
      - section: 'The question'
        say: 'A power of 2 equals 1. Only one index can do that. Find it, and the question becomes a factorisation.'
        write: '$2^{x^{3} - x^{2} - 2x} = 1$'
        doodle: {name: 'custom:1989_q17_a', id: piles, caption: 'halve, halve, halve: 2⁰ = 1'}
      - section: 'Solution'
        say: 'We write 1 as a power of 2, so that both sides have the same base.'
        write: 'Solution'
      - say: 'Any non-zero number to the power zero is 1. Look at the piles, 8, 4, 2, and one more halving gives 2 to the power 0, which is 1.'
        write: '$2^{x^{3} - x^{2} - 2x} = 2^{0}$'
        doodle_do:
          - {id: piles, op: circle, part: one}
      - say: 'The bases are the same, so equate the indices.'
        write: '$x^{3} - x^{2} - 2x = 0$'
      - say: 'Every term has $x$, so factorise out $x$.'
        write: '$x(x^{2} - x - 2) = 0$'
      - section: 'Factorise the bracket'
        say: 'Now the quadratic in the bracket. $a$ is 1, $b$ is negative 1 and $c$ is negative 2. The product is $ac$, negative 2. The sum is $b$, negative 1.'
        write: 'Product $= ac = -2$, Sum $= b = -1$'
      - say: 'Negative 2 times 1 is negative 2, and negative 2 plus 1 is negative 1.'
        write: 'Factors: $-2$ and $+1$'
      - say: 'Replace the middle term, negative $x$, with negative $2x$ plus $x$.'
        write: '$x^{2} - x - 2 = x^{2} - 2x + x - 2$'
      - say: 'Group in pairs. Take out $x$ from the first pair and 1 from the second. Both brackets are $x$ minus 2.'
        write: '$= x(x - 2) + 1(x - 2)$'
      - say: 'Take out the common bracket, $x$ minus 2. What is left is $x$ plus 1.'
        write: '$= (x - 2)(x + 1)$'
      - section: 'Solve'
        say: 'Put the factorised bracket back next to the $x$ we took out.'
        write: '$x(x - 2)(x + 1) = 0$'
      - say: 'A product is zero only when one of its factors is zero. So either $x$ is 0, or $x$ minus 2 is 0, or $x$ plus 1 is 0.'
        write: 'Either $x = 0$, $x - 2 = 0$ or $x + 1 = 0$'
      - say: 'Therefore $x$ is 0, 2 or negative 1.'
        write: '$\therefore x = 0,\ 2$ or $-1$'
      - say: 'The question wants the positive number. 0 is not positive, and neither is negative 1. So $x$ is 2.'
        write: 'Positive value: $x = 2$'
        point:
          - {line: 12, kind: strike, at: '0', text: 'not positive'}
          - {line: 12, kind: strike, at: '−1'}
      - section: 'Check'
        say: 'Put $x$ equals 2 in the index. 2 cubed is 8, 2 squared is 4, and 2 times 2 is 4. 8 minus 4 minus 4 is 0.'
        write: '$x = 2$: $8 - 4 - 4 = 0$'
      - say: 'And 2 to the power 0 is 1, the smallest pile.'
        write: '$2^{0} = 1\ \checkmark$'
        doodle_do:
          - {id: piles, op: pulse, part: one}
      - say: 'So the positive number is 2, which is option C.'
        write: '$\therefore x = 2$ (C)'
        answer: true
    traps:
      A: 'You went for 4. That makes the index 64 minus 16 minus 8, which is 40, and 2 to the 40 is huge. The index must be zero, which happens at $x$ equals 2.'
      B: 'You went for 3. The index would be 27 minus 9 minus 6, which is 12, not zero. Factorising gives $x$ equals 0, 2 or negative 1, and the positive one is 2.'
      D: 'You went for 1. That gives an index of 1 minus 1 minus 2, which is negative 2, and 2 to the negative 2 is a quarter, not 1. A power of 2 equals 1 only when its index is zero.'
  18:
    moments:
      - section: 'The question'
        say: 'We have a big number, 324, minus 4 $x$ squared. A square minus a square should ring a bell, because it is the difference of two squares.'
        write: '$\dfrac{324 - 4x^{2}}{2x + 18}$'
      - section: 'Solution'
        say: 'We factorise the numerator and the denominator, each on its own line, then cancel the common factor.'
        write: 'Solution'
      - say: 'Numerator first. 324 and 4 both divide by 4, so take out 4. 324 divided by 4 is 81.'
        write: 'Numerator: $324 - 4x^{2} = 4(81 - x^{2})$'
      - say: '81 is 9 squared. Picture a 9 by 9 square with an $x$ by $x$ corner cut out, and that is 9 squared minus $x$ squared.'
        write: '$= 4(9^{2} - x^{2})$'
        doodle: {name: 'custom:1989_q18_a', id: sq, caption: '81 − x²: a square with a corner cut'}
        doodle_do:
          - {id: sq, op: cross, part: corner}
      - say: 'The difference of two squares says $A$ squared minus $B$ squared is $A$ minus $B$, times $A$ plus $B$. Here $A$ is 9 and $B$ is $x$.'
        write: '$= 4(9 - x)(9 + x)$'
        doodle_do:
          - {id: sq, op: stage, stage: 'custom:1989_q18_a2'}
      - say: 'Now the denominator. Both terms divide by 2, so $2x$ over 2 is $x$, and 18 over 2 is 9.'
        write: 'Denominator: $2x + 18 = 2(x + 9)$'
      - say: 'Write the fraction with both parts factorised.'
        write: '$\dfrac{4(9 - x)(9 + x)}{2(x + 9)}$'
      - say: '9 plus $x$ is the same as $x$ plus 9, so cancel the common factor. 4 over 2 is 2. What is left is 2 times 9 minus $x$, the side marked on the cut square.'
        write: '$= 2(9 - x)$'
        doodle_do:
          - {id: sq, op: circle, part: strip}
        point:
          - {line: 6, kind: strike, at: '(9 + x)', text: 'cancels'}
          - {line: 6, kind: strike, at: '(x + 9)'}
      - say: 'The options use $x$ minus 9. 9 minus $x$ is negative, $x$ minus 9, so the minus sign comes outside.'
        write: '$= -2(x - 9)$'
      - section: 'Check'
        say: 'Take $x$ equals 0. The question gives 324 over 18, which is 18.'
        write: '$x = 0$: $\dfrac{324}{18} = 18$'
      - say: 'Our answer gives negative 2 times, 0 minus 9. Negative 2 times negative 9 is 18.'
        write: '$-2(0 - 9) = 18\ \checkmark$'
      - say: 'Therefore the fraction simplifies to negative 2 times, $x$ minus 9, which is option D.'
        write: '$\therefore -2(x - 9)$ (D)'
        answer: true
    traps:
      A: 'You went for 2 times $x - 9$. The sign is wrong. The working gives 2 times $9 - x$, and $9 - x$ is the negative of $x - 9$. Turning a bracket round costs a minus sign.'
      B: 'You went for 2 times $9 + x$. The $9 + x$ is the factor that cancels with the denominator. What is left from the numerator is $9 - x$.'
      C: 'You went for 81 minus $x^{2}$. That is the numerator without its 4, and the denominator has not been cancelled. Cancel $9 + x$, and 4 over 2, to get 2 times $9 - x$.'
  19:
    moments:
      - section: 'The question'
        say: 'We have four terms, two letters and the word completely. We group in pairs, then keep factorising until nothing more will come out.'
        write: '$y^{3} - 4xy + xy^{3} - 4y$'
      - section: 'Solution'
        say: 'No single factor is common to all four terms, so we factorise by grouping.'
        write: 'Solution'
      - say: 'First rearrange, so terms that share a factor sit side by side, with the two terms without $x$, then the two terms with $x$.'
        write: '$= y^{3} - 4y + xy^{3} - 4xy$'
      - say: 'Group in pairs. From the first pair take out $y$, and from the second pair take out $xy$. Picture two baskets, each holding the same box.'
        write: '$= y(y^{2} - 4) + xy(y^{2} - 4)$'
        doodle: {name: 'custom:1989_q19_a', id: bask, caption: 'two groups, one common bracket'}
      - say: 'Both brackets are $y$ squared minus 4, so we are on the right track. Take out the common bracket, the box in both baskets.'
        write: '$= (y + xy)(y^{2} - 4)$'
        doodle_do:
          - {id: bask, op: circle, part: box1}
          - {id: bask, op: circle, part: box2}
      - section: 'Factorise completely'
        say: 'Completely means we look inside each bracket again. $y$ plus $xy$ still has a common factor, $y$.'
        write: '$y + xy = y(1 + x)$'
      - say: '$y$ squared minus 4 is a difference of two squares, because 4 is 2 squared.'
        write: '$y^{2} - 4 = (y + 2)(y - 2)$'
      - say: 'Put both of those back. Now no bracket can be broken down any further.'
        write: '$= y(1 + x)(y + 2)(y - 2)$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '= [[y(1+x)]]'}, at: 'y(1+x)', text: 'this one'}
          - {line: 7, kind: move, from: {line: 6, at: '= [[(y+2)(y−2)]]'}, at: '(y+2)(y−2)', text: 'and this'}
      - section: 'Check'
        say: 'Take $x$ equals 1 and $y$ equals 3. The question gives 27 minus 12, plus 27 minus 12, which is 30.'
        write: '$x = 1,\ y = 3$: $27 - 12 + 27 - 12 = 30$'
      - say: 'The factors give 3, times 2, times 5, times 1, which is also 30.'
        write: '$3 \times 2 \times 5 \times 1 = 30\ \checkmark$'
      - say: 'Therefore the complete factorisation is $y$, times 1 plus $x$, times $y$ plus 2, times $y$ minus 2, which is option C.'
        write: '$\therefore y(1 + x)(y + 2)(y - 2)$ (C)'
        answer: true
    traps:
      A: 'You went for $x + xy$ times the brackets. Opening it gives terms like $xy^{2}$ and $-4x$ that are not in the question. The common piece is $y + xy$, which is $y$ times $1 + x$.'
      B: 'You went for $y + xy$ times the brackets. It is equal in value, but $y + xy$ still has a common factor $y$, so it is not completely factorised.'
      D: 'You went for $y$ times $1 - x$. The $xy^{3}$ term is positive, so the bracket is $1 + x$. Open D and you would get minus $xy^{3}$.'
  20:
    moments:
      - section: 'The question'
        say: 'Negative indices make this look strange. Turn them into fractions and a famous pattern appears, which is the difference of two cubes.'
        write: '$x^{3} - 8^{-1} = (x - 2^{-1})(\ ?\ )$'
      - section: 'Solution'
        say: 'We change the negative indices to fractions, then use the difference of two cubes.'
        write: 'Solution'
      - say: 'Recall that $a$ to the power negative $n$ is 1 over $a$ to the power $n$.'
        write: 'Recall: $a^{-n} = \dfrac{1}{a^{n}}$'
      - say: 'So 8 to the negative 1 is 1 over 8, and 2 to the negative 1 is a half.'
        write: '$8^{-1} = \tfrac{1}{8},\quad 2^{-1} = \tfrac{1}{2}$'
      - say: '2 cubed is 8, so 1 over 8 is a half, cubed. Picture a big cube of side $x$ with a little cube of side a half taken away.'
        write: '$x^{3} - \tfrac{1}{8} = x^{3} - \left(\tfrac{1}{2}\right)^{3}$'
        doodle: {name: 'custom:1989_q20_a', id: cubes, caption: 'x³ take away (½)³'}
      - say: 'The rule for a difference of two cubes is that $a$ cubed minus $b$ cubed is $a$ minus $b$, times $a$ squared plus $ab$ plus $b$ squared.'
        write: '$a^{3} - b^{3} = (a - b)(a^{2} + ab + b^{2})$'
      - say: 'Here $a$ is $x$, the big cube, and $b$ is a half, the little one. So $a$ minus $b$ is $x$ minus a half, the factor we were given.'
        write: '$a = x,\quad b = \tfrac{1}{2}$'
        doodle_do:
          - {id: cubes, op: label, part: big, text: 'a = x'}
          - {id: cubes, op: label, part: small, text: 'b = ½'}
      - say: 'So the other factor is the second bracket, $a$ squared plus $ab$ plus $b$ squared.'
        write: 'Other factor $= a^{2} + ab + b^{2}$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '(a2+ab+b2)'}, at: 'a2+ab+b2', text: 'second bracket'}
      - say: 'Substitute $a$ equals $x$ and $b$ equals a half, with brackets.'
        write: '$= x^{2} + x\left(\tfrac{1}{2}\right) + \left(\tfrac{1}{2}\right)^{2}$'
      - say: '$x$ times a half is a half $x$, and a half squared is a quarter.'
        write: '$= x^{2} + \tfrac{1}{2}x + \tfrac{1}{4}$'
      - say: 'The options use negative indices. A half is 2 to the negative 1, and a quarter is 4 to the negative 1.'
        write: '$\therefore$ Other factor $= x^{2} + 2^{-1}x + 4^{-1}$'
      - section: 'Check'
        say: 'Multiply back. $x$ times the bracket gives $x$ cubed, plus a half $x$ squared, plus a quarter $x$.'
        write: '$x(x^{2} + \tfrac{1}{2}x + \tfrac{1}{4}) = x^{3} + \tfrac{1}{2}x^{2} + \tfrac{1}{4}x$'
      - say: 'Negative a half times the bracket gives negative a half $x$ squared, negative a quarter $x$, and negative 1 over 8.'
        write: '$-\tfrac{1}{2}(x^{2} + \tfrac{1}{2}x + \tfrac{1}{4}) = -\tfrac{1}{2}x^{2} - \tfrac{1}{4}x - \tfrac{1}{8}$'
      - say: 'Add them. The $x$ squared terms cancel, and so do the $x$ terms. What is left is $x$ cubed minus 1 over 8, the expression we started with.'
        write: 'Sum $= x^{3} - \tfrac{1}{8}\ \checkmark$'
      - say: 'So the other factor is $x$ squared, plus 2 to the negative 1 $x$, plus 4 to the negative 1, and that is option C.'
        write: '$\therefore x^{2} + 2^{-1}x + 4^{-1}$ (C)'
        answer: true
    traps:
      A: 'You went for A, which ends in minus 4 to the negative 1. In a difference of cubes, every sign in the second bracket is plus, as in $a^{2}$ plus $ab$ plus $b^{2}$.'
      B: 'You went for B. Both the middle sign and the last sign are wrong. The pattern is $a^{2}$ plus $ab$ plus $b^{2}$, so both are plus.'
      D: 'You went for D, with minus a half $x$. That is the bracket for a sum of two cubes. For a difference of two cubes the middle term is plus $ab$.'
  21:
    moments:
      - section: 'The question'
        say: 'There are four terms, and the $c$ squared is hiding in the middle. Move it to the end and a perfect square jumps out.'
        write: '$4a^{2} + 12ab - c^{2} + 9b^{2}$'
      - section: 'Solution'
        say: 'We rearrange, spot a perfect square, then use the difference of two squares.'
        write: 'Solution'
      - say: 'Rearrange, with the $a$ and $b$ terms together, and minus $c$ squared at the end.'
        write: '$= 4a^{2} + 12ab + 9b^{2} - c^{2}$'
        point:
          - {line: 2, kind: move, from: {line: 0, at: '− c2'}, at: '− c2', text: 'to the end'}
      - say: '$4a$ squared is $2a$, all squared, and $9b$ squared is $3b$, all squared. Picture the tiles of a square with sides $2a$ plus $3b$.'
        write: '$4a^{2} = (2a)^{2},\quad 9b^{2} = (3b)^{2}$'
        doodle: {name: 'custom:1989_q21_a', id: tiles, caption: '(2a + 3b)² in tiles'}
      - say: 'A perfect square, $p$ plus $q$ all squared, has middle term $2pq$. To check, 2 times $2a$ times $3b$ is $12ab$, the two strips. It matches.'
        write: 'Middle term: $2(2a)(3b) = 12ab$'
        doodle_do:
          - {id: tiles, op: highlight, part: ab1}
          - {id: tiles, op: highlight, part: ab2}
      - say: 'So the first three terms fill the whole square, which is $2a$ plus $3b$, all squared.'
        write: '$4a^{2} + 12ab + 9b^{2} = (2a + 3b)^{2}$'
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1989_q21_a2'}
      - say: 'Put it back. Now we have a square minus a square.'
        write: '$= (2a + 3b)^{2} - c^{2}$'
      - section: 'Difference of two squares'
        say: 'The rule is that $A$ squared minus $B$ squared is $A$ minus $B$, times $A$ plus $B$.'
        write: '$A^{2} - B^{2} = (A - B)(A + B)$'
      - say: 'Here $A$ is the whole bracket, $2a$ plus $3b$, and $B$ is $c$.'
        write: '$A = 2a + 3b,\quad B = c$'
      - say: 'So we get $2a$ plus $3b$ minus $c$, times $2a$ plus $3b$ plus $c$.'
        write: '$= (2a + 3b - c)(2a + 3b + c)$'
      - section: 'Check'
        say: 'Take $a$, $b$ and $c$ all equal to 1. The question gives 4 plus 12 minus 1 plus 9, which is 24.'
        write: '$a = b = c = 1$: $4 + 12 - 1 + 9 = 24$'
      - say: 'The factors give 2 plus 3 minus 1, which is 4, times 2 plus 3 plus 1, which is 6. 4 times 6 is 24.'
        write: '$(4)(6) = 24\ \checkmark$'
      - say: 'Therefore the factorisation is $2a$ plus $3b$ minus $c$, times $2a$ plus $3b$ plus $c$, which is option B.'
        write: '$\therefore (2a + 3b - c)(2a + 3b + c)$ (B)'
        answer: true
    traps:
      A: 'You went for A. Open it and the middle term comes out as minus $12ab$, with an extra $-6bc$. The question has plus $12ab$ and no $bc$ term. Spot the perfect square, $2a + 3b$ all squared.'
      C: 'You went for C. That comes from $2a - 3b$ all squared, whose middle term is minus $12ab$. Ours is plus $12ab$, so the square is $2a + 3b$, all squared.'
      D: 'You went for D. Opening it gives minus $12ab$ and plus $c^{2}$, both the wrong sign. The expression is $2a + 3b$ all squared, minus $c^{2}$, which is a difference of two squares.'
  22:
    moments:
      - section: 'The question'
        say: 'There are two unknowns, $K$ and $L$, but only one statement. It is an identity, true for every $x$ and $y$. So we expand the left side and match it term by term.'
        write: '$\tfrac{1}{2}(3y - 4x)^{2} = 8x^{2} + Kxy + Ly^{2}$'
      - section: 'Solution'
        say: 'We expand the square, multiply by a half, then compare coefficients.'
        write: 'Solution'
      - say: 'Recall the square of a difference, which is first squared, minus 2 times first times second, plus second squared.'
        write: 'Recall: $(p - q)^{2} = p^{2} - 2pq + q^{2}$'
      - say: 'Here the first term is $3y$ and the second is $4x$.'
        write: '$p = 3y,\quad q = 4x$'
      - say: 'Substitute, keeping each term in brackets.'
        write: '$(3y - 4x)^{2} = (3y)^{2} - 2(3y)(4x) + (4x)^{2}$'
      - say: '$3y$ squared is $9y$ squared. 2 times 3 times 4 is 24, so the middle is negative $24xy$. And $4x$ squared is $16x$ squared.'
        write: '$= 9y^{2} - 24xy + 16x^{2}$'
      - say: 'Now multiply by the half in front. Take half of each term, so half of 9 is 9 over 2, half of 24 is 12, and half of 16 is 8.'
        write: '$\tfrac{1}{2}(3y - 4x)^{2} = \tfrac{9}{2}y^{2} - 12xy + 8x^{2}$'
      - section: 'Compare coefficients'
        say: 'Arrange our side in the same order as the right side. The $x$ squared terms are both 8, a good sign.'
        write: '$8x^{2} - 12xy + \tfrac{9}{2}y^{2} \equiv 8x^{2} + Kxy + Ly^{2}$'
      - say: 'Compare the coefficients of $xy$. On our side it is negative 12, so $K$ is negative 12.'
        write: 'Coefficient of $xy$: $K = -12$'
        point:
          - {line: 7, kind: circle, at: '−12xy', text: 'K'}
      - say: 'Compare the coefficients of $y$ squared. On our side it is 9 over 2, so $L$ is 9 over 2.'
        write: 'Coefficient of $y^{2}$: $L = \tfrac{9}{2}$'
        point:
          - {line: 7, kind: circle, at: 'y2 ≡', text: 'L'}
      - section: 'Check'
        say: 'Take $x$ and $y$ both equal to 1. The left side is a half of, 3 minus 4, squared. Negative 1 squared is 1, so we get a half.'
        write: '$x = y = 1$: $\tfrac{1}{2}(3 - 4)^{2} = \tfrac{1}{2}$'
      - say: 'The right side is 8, minus 12, plus 9 over 2. 8 minus 12 is negative 4, and negative 4 plus 4 and a half is a half.'
        write: '$8 - 12 + \tfrac{9}{2} = \tfrac{1}{2}\ \checkmark$'
      - say: 'Therefore $K$ is negative 12 and $L$ is 9 over 2, which is option A.'
        write: '$\therefore K = -12,\ L = \tfrac{9}{2}$ (A)'
        answer: true
    traps:
      B: 'You went for negative 6 and 9. The $y^{2}$ term was not halved, and the $xy$ term was halved twice. Expand fully first, $9y^{2} - 24xy + 16x^{2}$, then halve every term once.'
      C: 'You went for 6 and 9. The middle term of $3y - 4x$ all squared is minus $24xy$, and half of it is minus 12. Also, $9y^{2}$ must be halved too.'
      D: 'You went for 12 and 9 over 2. $L$ is right but the sign of $K$ is lost. The square of a difference has a negative middle term, so $K$ is negative 12.'
  23:
    moments:
      - section: 'The question'
        say: '$x$ to the negative 1 is just 1 over $x$. Give the reciprocals new letters, and this becomes an ordinary pair of simultaneous equations.'
        write: '$2x^{-1} - 3y^{-1} = 4,\quad 4x^{-1} + y^{-1} = 1$'
      - section: 'Solution'
        say: 'We change to new letters, solve by elimination, then change back to $x$ and $y$.'
        write: 'Solution'
      - say: 'Let $a$ be 1 over $x$, and let $b$ be 1 over $y$.'
        write: 'Let $a = \dfrac{1}{x},\ b = \dfrac{1}{y}$'
      - say: 'The first equation becomes $2a$ minus $3b$ equals 4. Call it equation 1.'
        write: '$2a - 3b = 4 \quad \text{......(1)}$'
      - say: 'The second becomes $4a$ plus $b$ equals 1. Call it equation 2.'
        write: '$4a + b = 1 \quad \text{......(2)}$'
      - section: 'Eliminate b'
        say: 'To eliminate $b$, multiply equation 2 by 3. Then the $b$ terms are negative $3b$ and plus $3b$.'
        write: '(2) $\times$ 3: $12a + 3b = 3 \quad \text{......(3)}$'
      - say: 'Add equations 1 and 3. Negative $3b$ plus $3b$ is 0. $2a$ plus $12a$ is $14a$, and 4 plus 3 is 7.'
        write: '(1) + (3): $14a = 7$'
      - say: 'Divide both sides by 14. 7 over 14 is a half.'
        write: '$a = \dfrac{7}{14} = \dfrac{1}{2}$'
      - say: 'Substitute $a$ equals a half in equation 2. 4 times a half is 2.'
        write: 'Substitute in (2): $4\left(\tfrac{1}{2}\right) + b = 1$'
      - say: 'So 2 plus $b$ equals 1. Subtract 2 from both sides, and 1 minus 2 is negative 1.'
        write: '$b = 1 - 2 = -1$'
      - section: 'Back to x and y'
        say: '$a$ is 1 over $x$, so 1 over $x$ is a half. Take the reciprocal of both sides, and $x$ is 2.'
        write: '$\dfrac{1}{x} = \dfrac{1}{2}$, $\therefore x = 2$'
      - say: '$b$ is 1 over $y$, so 1 over $y$ is negative 1. Take the reciprocal, and $y$ is negative 1.'
        write: '$\dfrac{1}{y} = -1$, $\therefore y = -1$'
      - section: 'Check'
        say: 'In the first equation, 2 times a half is 1, and negative 3 times negative 1 is plus 3. 1 plus 3 is 4.'
        write: '$2\left(\tfrac{1}{2}\right) - 3(-1) = 1 + 3 = 4\ \checkmark$'
      - say: 'In the second, 4 times a half is 2, and 2 plus negative 1 is 1.'
        write: '$4\left(\tfrac{1}{2}\right) + (-1) = 1\ \checkmark$'
      - say: 'Therefore $x$ is 2 and $y$ is negative 1, in that order, which is option D.'
        write: '$\therefore x = 2,\ y = -1$ (D)'
        answer: true
    traps:
      A: 'You went for negative 1 and 2. Those are the right numbers in the wrong order. The question asks for $x$ and $y$ respectively, and $x$ is 2 while $y$ is negative 1.'
      B: 'You went for 1 and 2. Check $a$ and $b$. $a$ is a half, so $x$ is 2, and $b$ is negative 1, so $y$ is negative 1.'
      C: 'You went for 2 and 1. The $x$ is right, but $b$ is 1 minus 2, which is negative 1, so $y$ is negative 1. Watch the sign.'
  24:
    moments:
      - section: 'The question'
        say: 'This is a complete square, but $x$ squared has 4 in front. Many students forget to multiply back by 4. Complete the square inside a bracket, then bring the 4 back.'
        write: '$4x^{2} + 5x + Q$ a complete square; $\ Q = ?$'
      - section: 'Solution'
        say: 'Solution. To complete the square, the coefficient of $x$ squared must be 1. So take 4 out as a factor.'
        write: 'Solution: $4x^{2} + 5x + Q = 4\left(x^{2} + \dfrac{5}{4}x + \dfrac{Q}{4}\right)$'
      - say: 'Inside the bracket, a perfect square needs its constant to be half the coefficient of $x$, squared.'
        write: 'Constant $= \left(\dfrac{1}{2} \times \text{coefficient of } x\right)^{2}$'
      - say: 'The coefficient of $x$ is 5 over 4. Half of 5 over 4 is 5 over 8.'
        write: '$\dfrac{1}{2} \times \dfrac{5}{4} = \dfrac{5}{8}$'
        point:
          - {line: 3, kind: move, from: {line: 1, at: '45x'}, at: '× [[45]] =', text: 'coefficient of x'}
      - say: 'Square it. 5 squared is 25, and 8 squared is 64.'
        write: '$\left(\dfrac{5}{8}\right)^{2} = \dfrac{25}{64}$'
      - say: 'So the constant inside the bracket, $Q$ over 4, must equal 25 over 64.'
        write: '$\dfrac{Q}{4} = \dfrac{25}{64}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= 6425'}, at: '= 6425', text: 'constant'}
      - say: 'Multiply both sides by 4. 4 times 25 over 64 is 100 over 64, and dividing top and bottom by 4 gives 25 over 16.'
        write: '$Q = 4 \times \dfrac{25}{64} = \dfrac{100}{64} = \dfrac{25}{16}$'
      - section: 'Check'
        say: 'Check by squaring $2x$ plus 5 over 4. Picture it as a square of side $2x$ plus $q$, with a big square, two strips and a corner.'
        write: 'Check: $\left(2x + \tfrac{5}{4}\right)^{2} = (2x)^{2} + 2(2x)\left(\tfrac{5}{4}\right) + \left(\tfrac{5}{4}\right)^{2}$'
        doodle: {name: 'custom:1989_q24_a', id: cs, caption: 'the corner completes the square'}
        doodle_do:
          - {id: cs, op: highlight, part: strips}
      - say: '$2x$ squared is $4x$ squared. The two strips make 2 times $2x$ times 5 over 4, which is $5x$. The corner is 5 over 4, squared, which is 25 over 16.'
        write: '$= 4x^{2} + 5x + \tfrac{25}{16}\ \checkmark$'
        doodle_do:
          - {id: cs, op: stage, stage: 'custom:1989_q24_a2'}
          - {id: cs, op: label, part: corner, text: '25/16'}
      - say: 'Here is an exam tip. $ax$ squared plus $bx$ plus $c$ is a perfect square when $b$ squared equals $4ac$. Here 25 equals 16 $Q$, so $Q$ is 25 over 16 again.'
        write: 'Exam tip: $b^{2} = 4ac$: $\ 25 = 4(4)Q \Rightarrow Q = \tfrac{25}{16}$'
      - say: 'Therefore $Q$ is 25 over 16, which is option A.'
        write: '$\therefore Q = \dfrac{25}{16}$'
        answer: true
    traps:
      B: 'You went for 25 over 64. That is the constant inside the bracket, $Q$ over 4. The 4 was taken out, so multiply back. 4 times 25 over 64 is 25 over 16.'
      C: 'You went for 5 over 8. That is half the coefficient of $x$, before squaring. Square it to get 25 over 64, then multiply by 4 to get 25 over 16.'
      D: 'You went for 5 over 4. That is the coefficient of $x$ inside the bracket. Halve it, square it and multiply by 4 to get 25 over 16.'
  25:
    moments:
      - section: 'The question'
        say: 'There are letters instead of numbers, but the method is the same as always. Clear the fractions with the L.C.M., then get $r$ by itself. We are told $a$, $b$ and $c$ are positive, and that matters.'
        write: '$\dfrac{r}{a} + \dfrac{r}{b} + \dfrac{r}{c} > 1,\quad a,\ b,\ c > 0$'
      - say: 'Solution. The denominators are $a$, $b$ and $c$, so the L.C.M. is $abc$. It is positive, because $a$, $b$ and $c$ are positive, so multiplying by it keeps the sign.'
        write: 'Solution: L.C.M. $= abc > 0$, so the sign stays'
      - say: 'Multiply every term by $abc$.'
        write: '$abc \times \dfrac{r}{a} + abc \times \dfrac{r}{b} + abc \times \dfrac{r}{c} > abc \times 1$'
      - say: '$abc$ over $a$ leaves $bc$, over $b$ it leaves $ac$, and over $c$ it leaves $ab$.'
        write: '$rbc + rac + rab > abc$'
      - say: 'Every term on the left has $r$, so take $r$ out as a common factor.'
        write: '$r(bc + ac + ab) > abc$'
      - say: 'The bracket is a sum of positive products, so it is positive. Dividing by a positive number keeps the sign.'
        write: '$bc + ac + ab > 0$'
      - say: 'Divide both sides by the bracket.'
        write: '$\therefore\ r > \dfrac{abc}{bc + ac + ab}$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: 'r[[(bc + ac + ab)]]'}, at: 'bc + ac + ab', text: 'divide'}
      - section: 'Check'
        say: 'Check with $a$, $b$ and $c$ all equal to 3. The question becomes $r$ over 3, three times, which is $r$. So it says $r$ is greater than 1.'
        write: 'Check $a = b = c = 3$: $\ \dfrac{r}{3} + \dfrac{r}{3} + \dfrac{r}{3} = r > 1$'
      - say: 'Our answer gives 27 over 9 plus 9 plus 9, which is 27 over 27, which is 1. It agrees.'
        write: '$\dfrac{3 \times 3 \times 3}{9 + 9 + 9} = \dfrac{27}{27} = 1\ \checkmark$'
      - say: 'So $r$ is greater than $abc$ over $bc$ plus $ac$ plus $ab$, which is option A.'
        write: '$r > \dfrac{abc}{bc + ac + ab}$'
        answer: true
    traps:
      B: 'You went for $r$ greater than $abc$. That forgets to divide by the bracket $bc + ac + ab$. With $a$, $b$ and $c$ all 3, it would say $r$ is greater than 27, but the true condition is $r$ greater than 1.'
      C: 'You went for $r$ greater than the sum of the reciprocals. That multiplies by the bracket instead of dividing by it. To free $r$, divide by what multiplies it.'
      D: 'You went for $r$ greater than 1 over $abc$. Multiplying through by $abc$ gives $r(bc + ac + ab) > abc$, and dividing gives $abc$ over $bc + ac + ab$.'
  26:
    moments:
      - section: 'The question'
        say: 'We have two fractions with different denominators, just like a half minus a third. Find the L.C.M. first. At the end, one sign decides between two options.'
        write: '$\dfrac{1}{x + 1} - \dfrac{1}{x - 2}$'
      - section: 'Solution'
        say: 'We find the L.C.M. of the denominators, then subtract the numerators over it.'
        write: 'Solution'
      - say: '$x$ plus 1 and $x$ minus 2 have no common factor, so the L.C.M. is their product.'
        write: 'L.C.M. $= (x + 1)(x - 2)$'
      - say: 'The L.C.M. divided by $x$ plus 1 is $x$ minus 2. The L.C.M. divided by $x$ minus 2 is $x$ plus 1. Keep the second in a bracket, so the minus reaches both terms.'
        write: '$= \dfrac{(x - 2) - (x + 1)}{(x + 1)(x - 2)}$'
      - say: 'Open the brackets. Minus times $x$ is minus $x$, and minus times plus 1 is minus 1.'
        write: '$= \dfrac{x - 2 - x - 1}{(x + 1)(x - 2)}$'
      - say: 'Collect like terms. $x$ minus $x$ is 0, and negative 2 minus 1 is negative 3.'
        write: '$= \dfrac{-3}{(x + 1)(x - 2)}$'
      - section: 'Match the options'
        say: 'The options have 2 minus $x$. Negative 1 times, $x$ minus 2, is negative $x$ plus 2, which is 2 minus $x$.'
        write: '$-(x - 2) = 2 - x$'
      - say: 'So move the minus sign from the numerator into the bracket. The numerator becomes 3, and $x$ minus 2 becomes 2 minus $x$. That is only one sign change.'
        write: '$= \dfrac{3}{(x + 1)(2 - x)}$'
      - section: 'Check'
        say: 'Take $x$ equals 0. The question gives 1 over 1, minus 1 over negative 2. That is 1 plus a half, which is 3 over 2.'
        write: '$x = 0$: $\dfrac{1}{1} - \dfrac{1}{-2} = \dfrac{3}{2}$'
      - say: 'Our answer gives 3 over, 1 times 2, which is also 3 over 2.'
        write: '$\dfrac{3}{(1)(2)} = \dfrac{3}{2}\ \checkmark$'
      - say: 'Therefore the single fraction is 3 over, $x$ plus 1 times 2 minus $x$, which is option B.'
        write: '$\therefore \dfrac{3}{(x + 1)(2 - x)}$ (B)'
        answer: true
    traps:
      A: 'You went for A. It turns $x - 2$ into $2 - x$ and also keeps the minus sign, so it changes the sign twice. At $x$ equals 0 it gives negative 3 over 2, but the true value is 3 over 2.'
      C: 'You went for negative 1 over the product. The numerator is $x - 2$ minus, $x + 1$, and with the bracket that is negative 3, not negative 1.'
      D: 'You went for 1 over the product. Subtracting the numerators gives $x - 2 - x - 1$, which is negative 3. Keep the bracket so the minus reaches the 1 as well.'
  27:
    moments:
      - section: 'The question'
        say: 'Powers of a half make this look frightening. But look closely, and the second fraction is something divided by itself. Spot that and the question shrinks.'
        write: '$\dfrac{x}{x + 1} - \dfrac{(x + 1)^{\frac{1}{2}}}{(x + 1)^{\frac{1}{2}}}$'
      - section: 'Solution'
        say: 'We simplify the second fraction first, then subtract using the L.C.M.'
        write: 'Solution'
      - say: 'Its numerator and denominator are the same, so cancel the common factor. Anything other than zero, divided by itself, is 1.'
        write: '$\dfrac{(x + 1)^{\frac{1}{2}}}{(x + 1)^{\frac{1}{2}}} = 1$'
      - say: 'Put that 1 back into the question.'
        write: '$\therefore$ Expression $= \dfrac{x}{x + 1} - 1$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '= 1'}, at: '− 1', text: 'this is 1'}
      - say: 'The denominators are $x$ plus 1 and 1, so the L.C.M. is $x$ plus 1.'
        write: 'L.C.M. $= x + 1$'
      - say: 'The L.C.M. divided by 1 is $x$ plus 1, times 1. Keep it in a bracket so the minus reaches both terms.'
        write: '$= \dfrac{x - (x + 1)}{x + 1}$'
      - say: 'Open the bracket. Minus times $x$ is minus $x$, and minus times plus 1 is minus 1.'
        write: '$= \dfrac{x - x - 1}{x + 1}$'
      - say: '$x$ minus $x$ is 0, which leaves negative 1 on top.'
        write: '$= \dfrac{-1}{x + 1}$'
        point:
          - {line: 6, kind: strike, at: 'x−x', text: 'cancels'}
      - section: 'Check'
        say: 'Take $x$ equals 3. The question gives 3 over 4, minus 1, which is negative 1 over 4.'
        write: '$x = 3$: $\dfrac{3}{4} - 1 = -\dfrac{1}{4}$'
      - say: 'Our answer gives negative 1 over, 3 plus 1, which is also negative 1 over 4.'
        write: '$-\dfrac{1}{3 + 1} = -\dfrac{1}{4}\ \checkmark$'
      - say: 'Therefore the expression is negative 1 over, $x$ plus 1, which is option B.'
        write: '$\therefore -\dfrac{1}{x + 1}$ (B)'
        answer: true
    traps:
      A: 'You went for positive 1 over $x + 1$. That subtracts the wrong way round. $x$ over $x + 1$ is less than 1 for positive $x$, so taking 1 away must give a negative answer.'
      C: 'You went for 1 over $x$. The denominator stays $x + 1$. The second fraction is 1, and 1 is written as $x + 1$ over $x + 1$.'
      D: 'You went for negative 1 over $x$. The sign is right, but the L.C.M. is $x + 1$, so the answer is negative 1 over $x + 1$.'
  28:
    moments:
      - section: 'The question'
        say: 'The curve has points labelled $a$ to $m$. We want the points where the gradient of the curve is zero.'
        write: 'Points where gradient $= 0$?'
      - section: 'Solution'
        say: 'Solution. The gradient of a curve at a point is $\dfrac{dy}{dx}$ there, which is the slope of the tangent, the straight line that just touches the curve at that point.'
        write: 'Gradient $= \dfrac{dy}{dx}$ = slope of the tangent'
      - say: 'Where is the slope zero? It is zero where the tangent is flat. That happens at a turning point, where the curve stops going one way and turns round.'
        'on': 'turning point'
        write: 'At turning point, $\dfrac{dy}{dx} = 0$'
        doodle: {name: 'custom:1989_q28_a', id: hill, caption: 'a ball rests where it is flat'}
        doodle_do:
          - {id: hill, op: stage, stage: 'custom:1989_q28_a2'}
      - say: 'A turning point is either a maximum point, the top of a hump, or a minimum point, the bottom of a dip. So we look for the tops and the bottoms.'
        write: 'Turning points: maximum points and minimum points'
      - section: 'Read the curve'
        say: 'Follow the curve from the left. It rises from $a$ to its first top at $b$, then falls. So $b$ is a maximum point.'
        write: 'Maximum points: $b$'
        point:
          - {figure: 0, kind: circle, target: b, text: 'maximum'}
      - say: 'It falls through $c$ and $d$ to the bottom of the dip at $e$, then rises. So $e$ is a minimum point.'
        write: 'Minimum points: $e$'
        point:
          - {figure: 0, kind: circle, target: e, text: 'minimum'}
      - say: 'It rises through $f$ to the next top at $g$, falls through $h$ and $i$ to the bottom at $j$, then rises through $l$ to the last top at $m$.'
        write: 'Maximum points: $b,\ g,\ m$; minimum points: $e,\ j$'
        point:
          - {figure: 0, kind: circle, target: g, text: 'maximum'}
          - {figure: 0, kind: circle, target: j, text: 'minimum'}
          - {figure: 0, kind: circle, target: m, text: 'maximum'}
      - section: 'The other points'
        say: 'At $d$, $f$, $i$ and $l$ the curve crosses the $x$-axis. There $y$ is zero, but the curve is steep, so $\dfrac{dy}{dx}$ is not zero. Do not mix up $y = 0$ with $\dfrac{dy}{dx} = 0$.'
        write: '$d,\ f,\ i,\ l$: $y = 0$, but $\dfrac{dy}{dx} \neq 0$'
        doodle_do:
          - {id: hill, op: pulse}
        point:
          - {figure: 0, kind: circle, target: d, text: 'y = 0'}
          - {figure: 0, kind: circle, target: f}
          - {figure: 0, kind: circle, target: i, text: 'crosses the x-axis'}
      - say: 'At $c$ and $h$ the curve is falling, so $\dfrac{dy}{dx}$ is negative. And $a$ is where the drawing starts, on a rising part.'
        write: '$c,\ h$: $\dfrac{dy}{dx} < 0$'
        point:
          - {figure: 0, kind: circle, target: c}
          - {figure: 0, kind: circle, target: h, text: 'falling'}
          - {figure: 0, kind: circle, target: a, text: 'start'}
      - say: 'Therefore the gradient is zero at the turning points $b$, $e$, $g$, $j$ and $m$, which is answer choice B.'
        write: '$\therefore$ gradient $= 0$ at $b,\ e,\ g,\ j,\ m$'
        answer: true
    traps:
      A: 'You went for $c$, $d$, $f$, $i$, $l$. Most of those are where the curve crosses the $x$-axis, where $y = 0$. Gradient zero means $\dfrac{dy}{dx} = 0$, which is a flat tangent, at the turning points.'
      C: 'You went for C. It has $b$ and $j$, which are turning points, but it adds the axis crossings and points on the slopes, and misses $e$, $g$ and $m$. $\dfrac{dy}{dx} = 0$ only at the maximum and minimum points.'
      D: 'You went for D. Those are points where the curve crosses the axis or is falling, so the tangent is sloped. Look for the turning points, the tops and the bottoms.'
  29:
    moments:
      - section: 'The question'
        say: 'A G.P. has $n$ terms. The first two add up to $x$, and the last two add up to $y$. We want the common ratio, in terms of $x$, $y$ and $n$.'
        write: 'First two terms: sum $x$; last two terms: sum $y$; $n$ terms'
      - section: 'Solution'
        say: 'Solution. Let the first term be $a$ and the common ratio be $r$. The $n$th term of a G.P. is $a$ times $r$ to the power $n$ minus 1.'
        write: 'Solution: $T_{n} = ar^{n - 1}$'
      - say: 'The first two terms are $a$ and $ar$. They add up to $x$. Take out the common factor $a$. Call this equation 1.'
        write: '$a + ar = a(1 + r) = x \quad \ldots (1)$'
      - say: 'The last term is the $n$th, $ar$ to the $n$ minus 1. The one before it is the $n$ minus 1th, $ar$ to the $n$ minus 2.'
        write: '$T_{n-1} = ar^{n-2},\quad T_{n} = ar^{n-1}$'
      - say: 'The last two terms add up to $y$.'
        write: '$ar^{n-2} + ar^{n-1} = y$'
      - say: 'Take out the common factor, $ar$ to the $n$ minus 2. What is left is 1 plus $r$. Call this equation 2.'
        write: '$ar^{n-2}(1 + r) = y \quad \ldots (2)$'
      - section: 'Divide (2) by (1)'
        say: 'Divide equation 2 by equation 1, so that $a$ and 1 plus $r$ cancel.'
        write: '$(2) \div (1):\quad \dfrac{ar^{n-2}(1 + r)}{a(1 + r)} = \dfrac{y}{x}$'
      - say: 'The $a$ cancels, and the 1 plus $r$ cancels. That leaves $r$ to the power $n$ minus 2.'
        write: '$r^{n-2} = \dfrac{y}{x}$'
      - say: 'To get $r$ alone, raise both sides to the power 1 over $n$ minus 2, which is the $n$ minus 2 root.'
        write: '$\therefore\ r = \left(\dfrac{y}{x}\right)^{\frac{1}{n - 2}}$'
      - section: 'Check'
        say: 'Check with a real G.P., 3, 6, 12 and 24. Here $n$ is 4 and $r$ is 2. $x$ is 3 plus 6, which is 9, and $y$ is 12 plus 24, which is 36.'
        write: 'Check: $3,\ 6,\ 12,\ 24$: $\ x = 9,\ y = 36,\ n = 4$'
        doodle: {name: 'custom:1989_q29_a', id: piles, caption: '3, 6, 12, 24: each pile doubles'}
        doodle_do:
          - {id: piles, op: label, part: first2, text: 'x = 9'}
          - {id: piles, op: label, part: last2, text: 'y = 36'}
      - say: '36 over 9 is 4. The power is 1 over 4 minus 2, which is 1 over 2. 4 to the power 1 over 2 is the square root of 4, which is 2. Correct.'
        write: '$\left(\dfrac{36}{9}\right)^{\frac{1}{4 - 2}} = 4^{\frac{1}{2}} = 2\ \checkmark$'
        doodle_do:
          - {id: piles, op: pulse}
      - say: 'Therefore the common ratio is $y$ over $x$, to the power 1 over $n$ minus 2, which is answer choice D.'
        write: '$\therefore\ r = \left(\dfrac{y}{x}\right)^{\frac{1}{n - 2}}$'
        answer: true
    traps:
      A: 'You went for $x$ over $y$. It is upside down and has no root. Equation 2 divided by equation 1 gives $r$ to the $n$ minus 2 equals $y$ over $x$, so $y$ goes on top, and we still take a root.'
      B: 'You went for $y$ over $x$. That is $r$ to the power $n$ minus 2, not $r$ itself. Take the $n$ minus 2 root to finish.'
      C: 'You went for $x$ over $y$, to the power 1 over $n$ minus 2. The fraction is upside down. In the check, 9 over 36 to the power 1 over 2 is 1 over 2, not 2.'
  30:
    moments:
      - section: 'The question'
        say: 'Negative 8, $m$, $n$ and 19 are in arithmetic progression. Two terms are hidden in the middle. We want $m$ and $n$.'
        write: '$-8,\ m,\ n,\ 19$ in A.P.; $\ (m, n) = ?$'
        doodle: {name: 'custom:1989_q30_a', id: frog, caption: 'equal hops from −8 to 19'}
      - section: 'Solution'
        say: 'Solution. List what is given. The first term $a$ is negative 8, and the 4th term is 19. Be careful, because here the letter $n$ is the third term.'
        write: 'Solution: $a = -8,\quad T_{4} = 19,\quad d = ?$'
      - say: 'The $n$th term of an A.P. is $a$ plus $n$ minus 1, times $d$.'
        write: '$T_{n} = a + (n - 1)d$'
      - say: 'For the 4th term, 4 minus 1 is 3, so $T$ 4 is $a$ plus $3d$. Substitute $a$ and $T$ 4.'
        write: '$T_{4} = a + 3d \Rightarrow -8 + 3d = 19$'
        doodle_do:
          - {id: frog, op: move, part: frog, path: hops}
        point:
          - {line: 3, kind: move, from: {line: 1, at: 'a = −8'}, at: '−8 + 3d', text: 'a'}
      - say: 'Why $3d$? Four terms have only three gaps between them. Watch the frog take three hops to reach 19.'
        write: '4 terms $\Rightarrow$ 3 gaps of $d$'
      - say: 'Add 8 to both sides. 19 plus 8 is 27.'
        write: '$3d = 19 + 8 = 27$'
      - say: 'Divide both sides by 3. Every hop is 9.'
        write: '$\therefore\ d = \dfrac{27}{3} = 9$'
        doodle_do:
          - {id: frog, op: label, part: hop2, text: '+9 each'}
      - section: 'Find m and n'
        say: '$m$ is the 2nd term, $a$ plus $d$. Negative 8 plus 9 is 1.'
        write: '$m = T_{2} = a + d = -8 + 9 = 1$'
        doodle_do:
          - {id: frog, op: label, part: m, text: '1'}
        point:
          - {line: 7, kind: highlight, at: '= 1', to: {doodle: frog, part: m}}
      - say: 'The letter $n$ is the 3rd term, $a$ plus $2d$. Negative 8 plus 18 is 10.'
        write: '$n = T_{3} = a + 2d = -8 + 2(9) = 10$'
        doodle_do:
          - {id: frog, op: label, part: n, text: '10'}
      - say: 'Therefore $m$ is 1 and $n$ is 10.'
        write: '$\therefore\ (m, n) = (1, 10)$'
      - section: 'Check'
        say: 'To check, we have negative 8, 1, 10 and 19. Each step goes up by 9, and 10 plus 9 is 19.'
        write: 'Check: $-8 \to 1 \to 10 \to 19$, each step $+9\ \checkmark$'
      - say: 'Therefore $m$ and $n$ are 1 and 10, which is answer choice A.'
        write: '$\therefore\ (m, n) = (1, 10)$'
        answer: true
    traps:
      B: 'You went for 2 and 10. The steps must be equal. Negative 8 to 2 is 10, but 2 to 10 is only 8. The common difference is 9, which gives 1 and 10.'
      C: 'You went for 3 and 13. From negative 8 to 19 is 27, in three equal gaps, so $d$ is 9. Then $m$ is negative 8 plus 9, which is 1, not 3.'
      D: 'You went for 4 and 16. The steps are 12, 12, then 3, which are not equal. Four terms have three gaps, so $3d$ is 27 and $d$ is 9.'
  31:
    moments:
      - section: 'The question'
        say: 'We have a tangent, two chords and a straight line. The alternate segment theorem moves the 60 degrees inside the circle, and two triangles finish the job.'
        write: '$\angle QMN = 60^{\circ}$, $\angle MNQ = 40^{\circ}$, $\angle RMQ = ?$'
        point:
          - {figure: 0, kind: arc, target: QMN, text: '60°'}
          - {figure: 0, kind: arc, target: MNQ, text: '40°'}
          - {figure: 0, kind: arc, target: RMQ, text: '?'}
      - section: 'Solution'
        say: 'Solution. Each line gets its reason in brackets, and every angle we find goes on the diagram.'
        write: 'Solution'
      - say: '$MN$ is a tangent and $MQ$ is a chord. The angle between them equals the angle in the alternate segment, at $R$. The reason is the alternate segment theorem.'
        write: '$\angle MRQ = \angle QMN = 60^{\circ}$ (alt. segment theorem)'
        point:
          - {figure: 0, kind: highlight, target: MN, text: 'tangent'}
          - {figure: 0, kind: arc, target: MRQ, text: '60°'}
      - say: 'Angle $MQR$ is outside triangle $MQN$, on the straight line $RQN$. So it equals the two opposite inside angles added. The reason is exterior angle of a triangle.'
        write: '$\angle MQR = \angle QMN + \angle MNQ$ (ext. $\angle$ of $\triangle$)'
        point:
          - {figure: 0, kind: highlight, target: RN, text: 'straight line'}
      - say: '60 plus 40 is 100 degrees.'
        write: '$\angle MQR = 60^{\circ} + 40^{\circ} = 100^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: MQR, text: '100°'}
      - say: 'Now triangle $RMQ$. Its three angles add up to 180 degrees, by the angle sum of a triangle.'
        write: '$\angle RMQ + 60^{\circ} + 100^{\circ} = 180^{\circ}$ ($\angle$ sum of $\triangle$)'
      - say: '60 plus 100 is 160. Take it to the other side, so 180 minus 160.'
        write: '$\angle RMQ = 180^{\circ} - 160^{\circ}$'
      - say: '180 minus 160 is 20 degrees. That is the angle at $M$, between the two chords.'
        write: '$\angle RMQ = 20^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: RMQ, text: '20°'}
      - section: 'Check'
        say: 'Check with the big triangle $RMN$. At $M$ it has 20 plus 60, which is 80. With 60 at $R$ and 40 at $N$, the three angles should make 180.'
        write: '$\angle RMN = 20^{\circ} + 60^{\circ} = 80^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: RMN, text: '80°'}
      - say: '60 plus 40 plus 80 is 180. It fits.'
        write: '$60^{\circ} + 40^{\circ} + 80^{\circ} = 180^{\circ}$ ($\angle$ sum of $\triangle$) $\checkmark$'
      - say: 'Therefore angle $RMQ$ is 20 degrees, option D.'
        write: '$\therefore \angle RMQ = 20^{\circ}$ (D)'
        answer: true
    traps:
      A: 'You went for 120 degrees, 180 minus 60. That leaves out the 100 degrees at $Q$. In triangle $RMQ$, 180 minus 60 minus 100 is 20.'
      B: 'You went for 110 degrees. Triangle $RMQ$ already has 60 at $R$, from the alternate segment theorem, and 100 at $Q$, from the exterior angle. That leaves 20 at $M$.'
      C: 'You went for 60 degrees. That is the tangent-chord angle $QMN$, and the angle at $R$ it equals. The question asks for the angle at $M$ between $MR$ and $MQ$, which is 20.'
  32:
    moments:
      - section: 'The question'
        say: 'A line parallel to the base cuts a small triangle off the top. The small and big triangles have the same shape, so their sides are in the same ratio.'
        write: '$HK \parallel QR$, $PH = 4$ cm, $HQ = 3$ cm, $KR : PR = ?$'
        point:
          - {figure: 0, kind: highlight, target: HK}
          - {figure: 0, kind: highlight, target: QR, text: 'parallel'}
      - section: 'Solution'
        say: 'Solution. We compare the small triangle $PHK$ with the big triangle $PQR$. First, their angles.'
        write: 'Solution'
      - say: 'Angle $PHK$ and angle $PQR$ sit in the same position on the two parallel lines, making an F shape. Corresponding angles are equal.'
        write: '$\angle PHK = \angle PQR$ (corr. $\angle$s, $HK \parallel QR$)'
        point:
          - {figure: 0, kind: arc, target: PHK}
          - {figure: 0, kind: arc, target: PQR, text: 'equal'}
      - say: 'In the same way, angle $PKH$ equals angle $PRQ$. Same reason.'
        write: '$\angle PKH = \angle PRQ$ (corr. $\angle$s, $HK \parallel QR$)'
        point:
          - {figure: 0, kind: arc, target: PKH}
          - {figure: 0, kind: arc, target: PRQ, text: 'equal'}
      - say: 'And the angle at $P$ belongs to both triangles.'
        write: '$\angle HPK = \angle QPR$ (common)'
        point:
          - {figure: 0, kind: arc, target: HPK, text: 'common'}
      - say: 'All three angles match, so the triangles are equiangular. That means they are similar, the same shape in different sizes.'
        write: '$\triangle PHK \;|||\; \triangle PQR$ (equiangular)'
      - say: 'So the three pairs of matching sides are in the same ratio. Write all three, small triangle on top.'
        write: '$\dfrac{PH}{PQ} = \dfrac{HK}{QR} = \dfrac{PK}{PR}$'
      - say: 'The whole side $PQ$ is $PH$ plus $HQ$, so 4 plus 3, which is 7 centimetres.'
        write: '$PQ = PH + HQ = 4 + 3 = 7$ cm'
        point:
          - {figure: 0, kind: label, target: PQ, text: '7 cm'}
      - say: 'We want a ratio on side $PR$, so take the first and the last ratios. $PH$ over $PQ$ is 4 over 7.'
        write: '$\dfrac{PK}{PR} = \dfrac{PH}{PQ} = \dfrac{4}{7}$'
      - say: 'Multiply both sides by $PR$. $PK$ is four sevenths of $PR$.'
        write: '$PK = \tfrac{4}{7}PR$'
      - say: '$KR$ is what is left of $PR$ after $PK$ is taken away.'
        write: '$KR = PR - PK = PR - \tfrac{4}{7}PR$'
        point:
          - {figure: 0, kind: highlight, target: KR, text: 'KR'}
      - say: 'One whole $PR$ minus four sevenths of $PR$ leaves three sevenths of $PR$.'
        write: '$KR = \tfrac{3}{7}PR$'
      - say: 'Divide both sides by $PR$.'
        write: '$\dfrac{KR}{PR} = \dfrac{3}{7}$'
      - section: 'Check'
        say: 'Check. $PK$ to $KR$ is 4 sevenths to 3 sevenths, which is 4 to 3, the same as $PH$ to $HQ$. A parallel line cuts both sides in the same ratio.'
        write: '$PK : KR = 4 : 3 = PH : HQ$ $\checkmark$'
      - say: 'Therefore $KR$ to $PR$ is 3 to 7, option B.'
        write: '$\therefore KR : PR = 3 : 7$ (B)'
        answer: true
    traps:
      A: 'You went for 7 to 3. That is $PR$ to $KR$, the ratio upside down. The question puts $KR$ first, and $KR$ is three sevenths of $PR$.'
      C: 'You went for 3 to 4. That is $KR$ to $PK$, one piece against the other piece. The question compares $KR$ with the whole side $PR$, so it is 3 to 7.'
      D: 'You went for 4 to 3. That is $PK$ to $KR$. The question wants $KR$, three sevenths of $PR$, against the whole of $PR$, which is 3 to 7.'
  33:
    moments:
      - section: 'The question'
        say: 'Each angle is 140 degrees, and the number of sides is written as $2k$ plus 1. Find the number of sides first, through the exterior angle. Then $k$ is one small equation.'
        write: '$n = 2k + 1$, each int. $\angle = 140^{\circ}$, $k = ?$'
      - section: 'Solution'
        say: 'Solution. Let me draw one corner of the polygon, with its side extended to show the exterior angle.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '140°', text: 'interior'}
      - say: 'At each corner, the interior and exterior angles sit on a straight line, so they add up to 180. The exterior angle is 180 minus 140.'
        write: 'Ext. $\angle = 180^{\circ} - 140^{\circ}$ ($\angle$s on a str. line)'
      - say: '180 minus 140 is 40 degrees.'
        write: 'Ext. $\angle = 40^{\circ}$'
        point:
          - {figure: sketch, kind: circle, target: '40°', text: 'exterior'}
      - say: 'Walk once round any polygon and you turn through one full turn. So the exterior angles add up to 360 degrees, and the number of sides is 360 over one exterior angle.'
        write: '$n = \dfrac{360^{\circ}}{\text{ext. } \angle}$ (sum of ext. $\angle$s $= 360^{\circ}$)'
        doodle: {name: 'custom:1989_q33_a', id: walk, caption: 'one lap = one full turn'}
        doodle_do:
          - {id: walk, op: label, part: turn, text: '40° each'}
      - say: 'Put in the exterior angle, 40 degrees.'
        write: '$n = \dfrac{360}{40}$'
      - say: '360 divided by 40 is 9. The polygon has 9 sides, with nine corners and nine turns.'
        write: '$n = 9$'
        doodle_do:
          - {id: walk, op: stage, stage: 'custom:1989_q33_a2'}
        point:
          - {figure: sketch, kind: label, target: '2k + 1 = ? sides', text: '9 sides'}
      - say: 'The question says the number of sides is $2k$ plus 1. So $2k$ plus 1 equals 9.'
        write: '$2k + 1 = 9$'
      - say: 'Take 1 to the other side. 9 minus 1 is 8.'
        write: '$2k = 9 - 1 = 8$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '+ 1'}, at: '− 1', text: 'across the ='}
      - say: 'Divide both sides by 2. 8 divided by 2 is 4.'
        write: '$k = \dfrac{8}{2} = 4$'
      - section: 'Check'
        say: 'Check with the interior angles. A 9-sided polygon has angles adding up to 9 minus 2, times 180, which is 1260 degrees.'
        write: 'Sum $= (9 - 2) \times 180^{\circ} = 1260^{\circ}$ (sum of int. $\angle$s of polygon)'
      - say: 'Shared equally among 9 angles, 1260 divided by 9 is 140, the angle we were given.'
        write: '$\dfrac{1260^{\circ}}{9} = 140^{\circ}$ $\checkmark$'
      - say: 'Therefore $k$ is 4, option A.'
        write: '$\therefore k = 4$ (A)'
        answer: true
    traps:
      B: 'You went for 4 and a half. Then $2k + 1$ is 10 sides, and each exterior angle would be 36, not 40. The exterior angle is 40, so there are 9 sides and $k$ is 4.'
      C: 'You went for 8. That is $2k$, one step before the end. Divide by 2, and $k$ is 4.'
      D: 'You went for 8 and a half. Then $2k + 1$ is 18 sides, and each exterior angle would be 20. Here the exterior angle is 180 minus 140, which is 40, so there are 9 sides and $k = 4$.'
  34:
    moments:
      - section: 'The question'
        say: 'There are three equal lengths in a row, $PQ$, $QS$ and $SR$. That makes two isosceles triangles, and the 24 degrees travels along them to $S$.'
        write: '$PQ = QS = SR$, $\angle SPQ = 24^{\circ}$, $y = ?$'
        point:
          - {figure: 0, kind: arc, target: SPQ, text: '24°'}
          - {figure: 0, kind: circle, target: y, text: 'y = ∠RST'}
      - section: 'Solution'
        say: 'Solution. We go from triangle to triangle, and each angle we find goes on the diagram.'
        write: 'Solution'
      - say: '$PQ$ equals $QS$, so triangle $PQS$ is isosceles. Its base angles, at $P$ and $S$, are equal. The reason is base angles of an isosceles triangle.'
        write: '$\angle QSP = \angle QPS = 24^{\circ}$ (base $\angle$s of isos. $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: QSP, text: '24°'}
      - say: 'Angle $SQR$ is outside triangle $PQS$, on the straight line $PQR$. It equals the two opposite inside angles added. The reason is exterior angle of a triangle.'
        write: '$\angle SQR = 24^{\circ} + 24^{\circ}$ (ext. $\angle$ of $\triangle$)'
      - say: '24 plus 24 is 48 degrees.'
        write: '$\angle SQR = 48^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: SQR, text: '48°'}
      - say: '$QS$ equals $SR$, so triangle $QSR$ is isosceles too. Its base angles, at $Q$ and $R$, are equal.'
        write: '$\angle SRQ = \angle SQR = 48^{\circ}$ (base $\angle$s of isos. $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: SRQ, text: '48°'}
      - say: 'Now the big triangle $PSR$. The angle $y$ is outside it, on the straight line $PST$. So $y$ equals the inside angles at $P$ and $R$ added.'
        write: '$y = \angle SPR + \angle SRP$ (ext. $\angle$ of $\triangle$)'
        point:
          - {figure: 0, kind: highlight, target: PT, text: 'straight line PST'}
      - say: 'That is 24 plus 48, which is 72 degrees.'
        write: '$y = 24^{\circ} + 48^{\circ} = 72^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: RST, text: '72°'}
      - section: 'Check'
        say: 'Check on the straight line at $S$. In triangle $QSR$, the angle at $S$ is 180 minus 48 minus 48, which is 84.'
        write: '$\angle QSR = 180^{\circ} - 96^{\circ} = 84^{\circ}$ ($\angle$ sum of $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: QSR, text: '84°'}
      - say: 'Along $PST$, the three angles at $S$ are 24, 84 and 72. They add up to 180, as angles on a straight line must.'
        write: '$24^{\circ} + 84^{\circ} + 72^{\circ} = 180^{\circ}$ ($\angle$s on a str. line) $\checkmark$'
      - say: 'Therefore $y$ is 72 degrees, option C.'
        write: '$\therefore y = 72^{\circ}$ (C)'
        answer: true
    traps:
      A: 'You went for 24 degrees. That is the angle at $P$, and angle $PSQ$. The angle $y$ is between $SR$ and $ST$, and it is 24 plus 48, which is 72.'
      B: 'You went for 48 degrees. That is a base angle of triangle $QSR$, at $Q$ or $R$. The angle $y$ at $S$ is the exterior angle of triangle $PSR$, so it is 24 plus 48, which is 72.'
      D: 'You went for 84 degrees. That is angle $QSR$, right next to $y$ at $S$. The angle $y$ is between $SR$ and $ST$, so it is 180 minus 24 minus 84, which is 72.'
  35:
    moments:
      - section: 'The question'
        say: 'A bisector cuts the 60 degrees in half, and the parallel chords carry one half across to $S$. It takes two short steps.'
        write: '$PQ \parallel RS$, $\angle PQR = 60^{\circ}$, $x = \angle QSR = ?$'
        point:
          - {figure: 0, kind: arc, target: PQR, text: '60°'}
          - {figure: 0, kind: circle, target: x}
      - section: 'Solution'
        say: 'Solution. First the bisector, then the parallel lines.'
        write: 'Solution'
      - say: '$QS$ bisects angle $PQR$, which means it cuts it into two equal halves. Half of 60 is 30.'
        write: '$\angle PQS = \dfrac{60^{\circ}}{2} = 30^{\circ}$ ($QS$ bisects $\angle PQR$)'
        point:
          - {figure: 0, kind: arc, target: PQS, text: '30°'}
          - {figure: 0, kind: arc, target: SQR, text: '30°'}
      - say: '$QS$ crosses the parallel lines $PQ$ and $RS$. Angle $PQS$ and angle $QSR$ make a Z shape between them. Alternate angles are equal.'
        write: '$\angle QSR = \angle PQS$ (alt. $\angle$s, $PQ \parallel RS$)'
        point:
          - {figure: 0, kind: highlight, target: PQ}
          - {figure: 0, kind: highlight, target: RS, text: 'parallel'}
      - say: 'So $x$ is 30 degrees.'
        write: '$x = 30^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: QSR, text: '30°'}
      - section: 'Check'
        say: 'Check with triangle $QRS$. It has 30 at $Q$ and 30 at $S$, so the angle at $R$ is 180 minus 30 minus 30, which is 120.'
        write: '$\angle QRS = 180^{\circ} - 30^{\circ} - 30^{\circ} = 120^{\circ}$ ($\angle$ sum of $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: QRS, text: '120°'}
      - say: 'Angles $PQR$ and $QRS$ are co-interior, on the same side of $QR$, between the parallels. They must add up to 180, and 60 plus 120 is 180.'
        write: '$60^{\circ} + 120^{\circ} = 180^{\circ}$ (co-int. $\angle$s, $PQ \parallel RS$) $\checkmark$'
      - say: 'Therefore $x$ is 30 degrees, option A.'
        write: '$\therefore x = 30^{\circ}$ (A)'
        answer: true
    traps:
      B: 'You went for 40 degrees. The bisector cuts the 60 into two halves of 30, and the alternate angle copies that 30 across to $S$.'
      C: 'You went for 60 degrees. That uses the whole angle at $Q$. The bisector halves it first, so angle $PQS$ is 30, and that is what the alternate angle copies.'
      D: 'You went for 120 degrees, 180 minus 60. That is the angle at $R$, co-interior with the 60. The angle $x$ at $S$ is alternate to angle $PQS$, which is 30.'
  36:
    moments:
      - section: 'The question'
        say: 'This looks like a rhombus question, but it is Pythagoras in disguise. The diagonals of a rhombus meet at right angles.'
        write: '$PR^{2} + QS^{2} = kPQ^{2}$, $k = ?$'
      - section: 'Solution'
        say: 'Solution. Let me draw the rhombus $PQRS$ with its two diagonals, $PR$ and $QS$.'
        write: 'Solution'
        show_sketch: true
      - say: 'The diagonals of a rhombus cut each other in half, at right angles. Let half of $PR$ be $p$, and half of $QS$ be $q$.'
        write: 'Let $\tfrac{1}{2}PR = p$, $\tfrac{1}{2}QS = q$ (diagonals of rhombus bisect at $90^{\circ}$)'
        point:
          - {figure: sketch, kind: circle, target: p, text: 'half PR'}
          - {figure: sketch, kind: circle, target: q, text: 'half QS'}
      - say: 'Look at the small triangle with $p$ and $q$ meeting at the right angle. Its longest side, facing the right angle, is the side $PQ$.'
        write: '$PQ^{2} = p^{2} + q^{2}$ (Pythagoras)'
        point:
          - {figure: sketch, kind: highlight, target: PQ, text: 'hypotenuse'}
      - say: 'The full diagonal $PR$ is $2p$. So $PR$ squared is $2p$, all squared, which is $4p$ squared.'
        write: '$PR^{2} = (2p)^{2} = 4p^{2}$'
        point:
          - {figure: sketch, kind: label, target: PR, text: '2p'}
      - say: 'In the same way, $QS$ is $2q$, so $QS$ squared is $4q$ squared.'
        write: '$QS^{2} = (2q)^{2} = 4q^{2}$'
      - say: 'Add the two.'
        write: '$PR^{2} + QS^{2} = 4p^{2} + 4q^{2}$'
      - say: 'Take out the common factor, 4.'
        write: '$PR^{2} + QS^{2} = 4(p^{2} + q^{2})$'
      - say: 'The bracket, $p$ squared plus $q$ squared, is $PQ$ squared, by Pythagoras.'
        write: '$PR^{2} + QS^{2} = 4PQ^{2}$'
        point:
          - {line: 8, kind: move, from: {line: 3, at: '[[PQ2]] ='}, at: '4[[PQ2]]', text: 'Pythagoras'}
      - say: 'Compare with the question, which says $k$ times $PQ$ squared. Both sides have $PQ$ squared.'
        write: '$kPQ^{2} = 4PQ^{2}$'
      - say: 'Divide both sides by $PQ$ squared.'
        write: '$k = 4$'
      - section: 'Check'
        say: 'Check with a square of side 1. A square is a special rhombus. Each diagonal squared is 1 squared plus 1 squared, which is 2.'
        write: '$PR^{2} = QS^{2} = 1^{2} + 1^{2} = 2$ (Pythagoras)'
      - say: 'The two together make 2 plus 2, which is 4. And $k$ times 1 squared is 4 times 1, which is 4.'
        write: '$2 + 2 = 4 = 4 \times 1^{2}$ $\checkmark$'
      - say: 'Therefore $k$ is 4, option D.'
        write: '$\therefore k = 4$ (D)'
        answer: true
    traps:
      A: 'You went for 1. That treats the full diagonals as the two shorter sides of the right-angled triangle. It is the half-diagonals that meet at the centre, and doubling them brings in the 4.'
      B: 'You went for 2. In a square of side 1, one diagonal squared is 2, but there are two diagonals, so the sum is 4. The half-diagonals give $PQ^{2}$, and the full ones give 4 times that.'
      C: 'You went for 3. The full diagonals are $2p$ and $2q$, so their squares are $4p^{2}$ and $4q^{2}$, which add up to 4 times $PQ^{2}$.'
  37:
    moments:
      - section: 'The question'
        say: 'Two equal angles mean two equal sides. Then a line from $X$ splits the triangle into two right-angled halves, and SOH CAH TOA finishes it.'
        write: '$\angle Y = \angle Z = 30^{\circ}$, $XZ = 3$ cm, $YZ = ?$'
      - section: 'Solution'
        say: 'Solution. Let me draw triangle $XYZ$, with 30 degrees at $Y$ and at $Z$.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: arc, target: XYZ, text: '30°'}
          - {figure: sketch, kind: arc, target: XZY, text: '30°'}
      - say: 'The angles at $Y$ and $Z$ are equal, so the triangle is isosceles, and the sides facing those angles are equal.'
        write: '$XY = XZ = 3$ cm (sides opp. equal $\angle$s)'
        point:
          - {figure: sketch, kind: highlight, target: XY, text: '3 cm'}
      - say: 'Draw the line from $X$ perpendicular to $YZ$, and call its foot $M$.'
        write: 'Draw $XM \perp YZ$ (construction)'
        point:
          - {figure: sketch, kind: highlight, target: XM}
      - say: 'In an isosceles triangle, this perpendicular cuts the base exactly in half.'
        write: '$YM = MZ$ (isos. $\triangle$)'
        point:
          - {figure: sketch, kind: circle, target: M, text: 'midpoint'}
      - say: 'In the right-angled triangle $XMZ$, let theta be the angle at $Z$, 30 degrees. $XZ$ faces the right angle, so it is the hypotenuse. $MZ$ is next to theta, so it is the adjacent side.'
        write: '$\theta = 30^{\circ}$, hyp $= XZ = 3$, adj $= MZ$'
        point:
          - {figure: sketch, kind: highlight, target: XZ, text: 'hyp'}
          - {figure: sketch, kind: underline, target: MZ, text: 'adj'}
      - say: 'Adjacent and hypotenuse, that is CAH in SOH CAH TOA. Cos theta is adjacent over hypotenuse.'
        write: '$\cos\theta = \dfrac{\text{adj}}{\text{hyp}}$ (SOH CAH TOA)'
      - say: 'Substitute, so cos 30 degrees equals $MZ$ over 3.'
        write: '$\cos 30^{\circ} = \dfrac{MZ}{3}$'
      - say: 'Multiply both sides by 3.'
        write: '$MZ = 3\cos 30^{\circ}$'
      - say: 'Cos 30 degrees is root 3 over 2. So $MZ$ is 3 root 3 over 2.'
        write: '$MZ = 3 \times \dfrac{\sqrt{3}}{2} = \dfrac{3\sqrt{3}}{2}$'
      - say: '$YZ$ is twice $MZ$, because $M$ is the midpoint.'
        write: '$YZ = 2 \times MZ = 2 \times \dfrac{3\sqrt{3}}{2}$'
      - say: 'The 2s cancel, leaving 3 root 3 centimetres.'
        write: '$YZ = 3\sqrt{3}$ cm'
        point:
          - {figure: sketch, kind: highlight, target: YZ, text: '3√3 cm'}
      - section: 'Check'
        say: 'Check with the sine rule. First, the angle at $X$ is 180 minus 30 minus 30, which is 120.'
        write: '$\angle X = 180^{\circ} - 60^{\circ} = 120^{\circ}$ ($\angle$ sum of $\triangle$)'
        point:
          - {figure: sketch, kind: arc, target: YXZ, text: '120°'}
      - say: 'Divide each side by the sine of the angle facing it. $YZ$ faces 120 degrees, and $XZ$, which is 3, faces 30.'
        write: '$\dfrac{YZ}{\sin 120^{\circ}} = \dfrac{3}{\sin 30^{\circ}}$ (sine rule)'
      - say: 'Sin 120 is the same as sin 60, root 3 over 2, and sin 30 is a half. 3 times root 3 over 2, divided by a half, is 3 root 3.'
        write: '$YZ = \dfrac{3 \times \frac{\sqrt{3}}{2}}{\frac{1}{2}} = 3\sqrt{3}$ $\checkmark$'
      - say: 'Therefore $YZ$ is 3 root 3 centimetres, option C.'
        write: '$\therefore YZ = 3\sqrt{3}$ cm (C)'
        answer: true
    traps:
      A: 'You went for root 3 over 2. That is just cos 30. $MZ$ is 3 times cos 30, and $YZ$ is twice that, which is 3 root 3.'
      B: 'You went for 3 root 3 over 2. That is only $MZ$, half of $YZ$. Double it to get 3 root 3.'
      D: 'You went for 2 root 3. $YZ$ is 2 times 3 cos 30, which is 2 times 3 root 3 over 2, giving 3 root 3.'
  38:
    moments:
      - section: 'The question'
        say: 'There are two angle bisectors and two exterior angles. Take one triangle at a time, and the angle at $T$ falls out.'
        write: '$\angle QPR = 46^{\circ}$, $\angle QST = 75^{\circ}$, $\angle QTS = ?$'
      - section: 'Solution'
        say: 'Solution. Let me draw triangle $PQR$, with $PQ$ produced to $V$, and the two bisectors meeting at $T$.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: arc, target: QPR, text: '46°'}
          - {figure: sketch, kind: arc, target: QST, text: '75°'}
      - say: '$PS$ bisects angle $QPR$, so it cuts the 46 degrees in half. Half of 46 is 23.'
        write: '$\angle QPS = \dfrac{46^{\circ}}{2} = 23^{\circ}$ ($PS$ bisects $\angle QPR$)'
        point:
          - {figure: sketch, kind: arc, target: QPS, text: '23°'}
      - say: '$T$ is on $PS$ produced, so angle $QST$ is outside triangle $PQS$. It equals the two opposite inside angles added. The reason is exterior angle of a triangle.'
        write: '$\angle QST = \angle QPS + \angle PQS$ (ext. $\angle$ of $\triangle$)'
      - say: 'Put in 75 for angle $QST$ and 23 for angle $QPS$.'
        write: '$75^{\circ} = 23^{\circ} + \angle PQS$'
      - say: 'Take 23 to the other side. 75 minus 23 is 52.'
        write: '$\angle PQS = 75^{\circ} - 23^{\circ} = 52^{\circ}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '23∘'}, at: '− 23∘', text: 'across the ='}
          - {figure: sketch, kind: arc, target: PQS, text: '52°'}
      - say: '$PQV$ is a straight line, so angle $VQS$ and angle $PQS$ add up to 180. 180 minus 52 is 128.'
        write: '$\angle VQS = 180^{\circ} - 52^{\circ} = 128^{\circ}$ ($\angle$s on a str. line)'
        point:
          - {figure: sketch, kind: arc, target: VQS, text: '128°'}
      - say: '$QT$ bisects angle $VQS$. Half of 128 is 64.'
        write: '$\angle SQT = \dfrac{128^{\circ}}{2} = 64^{\circ}$ ($QT$ bisects $\angle VQS$)'
        point:
          - {figure: sketch, kind: arc, target: SQT, text: '64°'}
      - say: 'Now triangle $QST$. Its three angles, at $T$, $S$ and $Q$, add up to 180 degrees.'
        write: '$\angle QTS + 75^{\circ} + 64^{\circ} = 180^{\circ}$ ($\angle$ sum of $\triangle$)'
      - say: '75 plus 64 is 139. Take it to the other side, so 180 minus 139.'
        write: '$\angle QTS = 180^{\circ} - 139^{\circ}$'
      - say: '180 minus 139 is 41 degrees.'
        write: '$\angle QTS = 41^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: QTS, text: '41°'}
      - section: 'Check'
        say: 'Check with angle $VQT$, the other half of angle $VQS$, which is 64 degrees. It is outside triangle $PQT$, so it should equal the angles at $P$ and $T$ added, 23 plus 41.'
        write: '$\angle VQT = 23^{\circ} + 41^{\circ} = 64^{\circ}$ (ext. $\angle$ of $\triangle$) $\checkmark$'
        point:
          - {figure: sketch, kind: arc, target: VQT, text: '64°'}
      - say: 'Therefore angle $QTS$ is 41 degrees, option A.'
        write: '$\therefore \angle QTS = 41^{\circ}$ (A)'
        answer: true
    traps:
      B: 'You went for 52 degrees. That is angle $PQS$, found early on. We still need to bisect angle $VQS$ and then use triangle $QST$, which gives 41.'
      C: 'You went for 64 degrees. That is half of angle $VQS$, the angle at $Q$ in triangle $QST$. The question wants the angle at $T$, which is 180 minus 75 minus 64, which is 41.'
      D: 'You went for 82 degrees, twice 41. Triangle $QST$ has 75 at $S$ and 64 at $Q$, so the angle at $T$ is 180 minus 139, which is 41.'
  39:
    moments:
      - section: 'The question'
        say: 'We have an isosceles triangle and a pair of parallel lines. The equal sides give the base angles, and the parallel lines carry one of them across to $3y$.'
        write: '$QS = QR$, $QY \parallel RS$, $\angle SQR = 56^{\circ}$, $y = ?$'
        point:
          - {figure: 0, kind: circle, target: '56°'}
          - {figure: 0, kind: circle, target: '3y°'}
          - {figure: 0, kind: circle, target: 'y°', text: 'find y'}
      - section: 'Solution'
        say: 'Solution. First triangle $QSR$, then the parallel lines.'
        write: 'Solution'
      - say: '$QS$ equals $QR$, so triangle $QSR$ is isosceles. Its base angles, at $S$ and $R$, are equal.'
        write: '$\angle QSR = \angle QRS$ (base $\angle$s of isos. $\triangle$)'
        point:
          - {figure: 0, kind: highlight, target: QS}
          - {figure: 0, kind: highlight, target: QR, text: 'equal'}
      - say: 'The three angles of the triangle add up to 180. Take away the 56 at $Q$, and the two equal base angles share what is left, which is 180 minus 56.'
        write: '$2\angle QSR = 180^{\circ} - 56^{\circ} = 124^{\circ}$ ($\angle$ sum of $\triangle$)'
      - say: 'Divide by 2. Half of 124 is 62.'
        write: '$\angle QSR = 62^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: QSR, text: '62°'}
          - {figure: 0, kind: arc, target: QRS, text: '62°'}
      - say: '$QS$ crosses the parallel lines $QY$ and $RS$. Angle $YQS$ and angle $QSR$ make a Z shape between them. Alternate angles are equal.'
        write: '$\angle YQS = \angle QSR$ (alt. $\angle$s, $QY \parallel RS$)'
        point:
          - {figure: 0, kind: highlight, target: QY}
          - {figure: 0, kind: highlight, target: RS, text: 'parallel'}
      - say: 'Angle $YQS$ is $3y$, and angle $QSR$ is 62.'
        write: '$3y = 62^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: YQS, text: '3y = 62°'}
      - say: 'Divide both sides by 3. 3 goes into 62 twenty times, remainder 2, so $y$ is 20 and two thirds.'
        write: '$y = \dfrac{62}{3} = 20\tfrac{2}{3}^{\circ}$'
      - section: 'Check'
        say: 'Check on the straight line $PQR$. Angle $YQP$ and angle $QRS$ are corresponding angles, an F shape, so angle $YQP$ is also 62.'
        write: '$\angle YQP = \angle QRS = 62^{\circ}$ (corr. $\angle$s, $QY \parallel RS$)'
        point:
          - {figure: 0, kind: arc, target: YQP, text: '62°'}
      - say: 'The three angles at $Q$ are 62, $3y$ which is 62, and 56. 62 plus 62 plus 56 is 180, as angles on a straight line must be.'
        write: '$62^{\circ} + 62^{\circ} + 56^{\circ} = 180^{\circ}$ ($\angle$s on a str. line) $\checkmark$'
      - say: 'Therefore $y$ is 20 and two thirds degrees, option C.'
        write: '$\therefore y = 20\tfrac{2}{3}^{\circ}$ (C)'
        answer: true
    traps:
      A: 'You went for 62 degrees. That is $3y$, the angle $YQS$, and also the base angle. The question wants $y$, one third of it, which is 20 and two thirds.'
      B: 'You went for 56 degrees. That is angle $SQR$, given in the question. $3y$ equals the base angle, 62, so $y$ is 20 and two thirds.'
      D: 'You went for 18 and two thirds, which is 56 divided by 3. $3y$ is not the 56 at $Q$. It is alternate to the base angle at $S$, 62. So $y$ is 62 over 3, which is 20 and two thirds.'
  40:
    moments:
      - section: 'The question'
        say: 'The two shorter sides are in the ratio 5 to 12, and the longest is 52. Write the ratio with one letter, put it into Pythagoras, and every side follows.'
        write: '$x : y = 5 : 12$, $z = 52$ cm, perimeter $= ?$'
        point:
          - {figure: 0, kind: circle, target: 'z = 52 cm'}
      - section: 'Solution'
        say: 'Solution. The right angle is at $S$, so $RT$, which is $z$, faces it, and $z$ is the hypotenuse.'
        write: 'Solution'
        point:
          - {figure: 0, kind: arc, target: RST, text: '90°'}
      - say: 'The ratio 5 to 12 means $x$ is 5 equal parts and $y$ is 12 of the same parts. Let one part be $k$.'
        write: 'Let $x = 5k$, $y = 12k$'
        point:
          - {figure: 0, kind: label, target: x, text: '5k'}
          - {figure: 0, kind: label, target: y, text: '12k'}
      - say: 'The square on the hypotenuse equals the sum of the squares on the other two sides.'
        write: '$z^{2} = x^{2} + y^{2}$ (Pythagoras)'
      - say: 'Substitute 52 for $z$, $5k$ for $x$ and $12k$ for $y$.'
        write: '$52^{2} = (5k)^{2} + (12k)^{2}$'
      - say: '52 squared is 2704. $5k$ squared is $25k$ squared, and $12k$ squared is $144k$ squared.'
        write: '$2704 = 25k^{2} + 144k^{2}$'
      - say: '25 plus 144 is 169.'
        write: '$2704 = 169k^{2}$'
      - say: 'Divide both sides by 169. 2704 divided by 169 is 16.'
        write: '$k^{2} = \dfrac{2704}{169} = 16$'
      - say: 'Take the square root. A length is positive, so $k$ is 4.'
        write: '$k = \sqrt{16} = 4$'
      - say: 'So $x$ is 5 times 4, which is 20 centimetres.'
        write: '$x = 5 \times 4 = 20$ cm'
        point:
          - {figure: 0, kind: label, target: x, text: '20 cm'}
      - say: 'And $y$ is 12 times 4, which is 48 centimetres.'
        write: '$y = 12 \times 4 = 48$ cm'
        point:
          - {figure: 0, kind: label, target: y, text: '48 cm'}
      - say: 'The perimeter is the distance all the way round, which is the three sides added.'
        write: 'Perimeter $= x + y + z$'
      - say: '20 plus 48 is 68, and 68 plus 52 is 120.'
        write: 'Perimeter $= 20 + 48 + 52 = 120$ cm'
      - section: 'Check'
        say: 'Check with Pythagoras. 20 squared is 400, 48 squared is 2304, and together they make 2704, which is 52 squared.'
        write: '$20^{2} + 48^{2} = 400 + 2304 = 2704 = 52^{2}$ $\checkmark$'
      - section: 'Exam tip'
        say: 'Here is an exam tip. 5, 12, 13 is a Pythagorean triple. So the hypotenuse is 13 parts. 13 parts are 52, so one part is 4, and the 30 parts round the triangle make 120.'
        write: '$13k = 52$, $k = 4$; $(5 + 12 + 13) \times 4 = 120$'
        doodle: {name: 'custom:1989_q40_a', id: strips, caption: '5, 12 and 13 equal parts'}
      - say: 'Therefore the perimeter is 120 centimetres, option D.'
        write: '$\therefore$ perimeter $= 120$ cm (D)'
        answer: true
    traps:
      A: 'You went for 68 centimetres. That is $x$ plus $y$, 20 plus 48, with the hypotenuse left out. The perimeter goes all the way round, so add the 52 too.'
      B: 'You went for 84 centimetres. The sides are 20, 48 and 52, and they add up to 120.'
      C: 'You went for 100 centimetres, which is 52 plus 48 only. The side $x$, 20 centimetres, is part of the perimeter too, so it is 120.'
  41:
    moments:
      - section: 'The question'
        say: 'A pilot flies 10 km above the ground towards a landmark. He sees it first at an angle of depression of 35 degrees, then later at 55 degrees. We want the distance between the two points of observation.'
        write: 'Height $10$ km; depression $35^{\circ}$, then $55^{\circ}$'
      - section: 'Solution'
        say: 'Solution. Let me draw the plane at $A$, the landmark $L$ on the ground, and the 10 km height. The angle of depression is measured down from the plane''s horizontal line of flight.'
        write: 'Solution: plane at $A$, landmark $L$, height $10$ km'
        show_sketch: true
        'on': 'draw the plane'
        point:
          - {figure: sketch, kind: circle, target: A, text: 'first look'}
          - {figure: sketch, kind: circle, target: L, text: 'landmark'}
      - say: 'The flight line and the ground are parallel. So the angle of depression at $A$ equals the angle of elevation at $L$. The reason is alternate angles.'
        write: 'Elevation at $L = 35^{\circ}$ (alt. $\angle$s, horizontals $\parallel$)'
        point:
          - {figure: sketch, kind: circle, target: '35°'}
      - section: 'The first distance'
        say: 'Let $d_1$ be the horizontal distance from $A$ to the point straight above $L$. From 35 degrees, the height 10 is opposite and $d_1$ is adjacent. That is TOA, so we use tangent.'
        write: 'Let $d_{1}$ = horiz. dist. at $A$: $\tan 35^{\circ} = \dfrac{10}{d_{1}}$ (TOA)'
        point:
          - {figure: sketch, kind: highlight, target: '10 km', text: 'opp'}
      - say: 'Cross-multiply and divide by tan 35. One over tan is called cot, short for cotangent. So $d_1$ is 10 cot 35.'
        write: '$d_{1} = \dfrac{10}{\tan 35^{\circ}} = 10\cot 35^{\circ}$'
      - section: 'The second distance'
        say: 'Now take the second sighting, from $B$, nearer the landmark. The angle is steeper, 55 degrees. Let $d_2$ be its horizontal distance.'
        write: 'Let $d_{2}$ = horiz. dist. at $B$: $\tan 55^{\circ} = \dfrac{10}{d_{2}}$ (TOA)'
        show_sketch: sketch_b
        'on': 'second sighting'
        point:
          - {figure: sketch_b, kind: circle, target: B, text: 'later'}
          - {figure: sketch_b, kind: circle, target: '55°', text: 'from B'}
      - say: 'The same steps give $d_2$ as 10 over tan 55, which is 10 cot 55.'
        write: '$d_{2} = \dfrac{10}{\tan 55^{\circ}} = 10\cot 55^{\circ}$'
      - section: 'The distance AB'
        say: '$A$ is farther from the landmark than $B$, so the distance flown, $AB$, is $d_1$ minus $d_2$.'
        write: '$AB = d_{1} - d_{2} = 10\cot 35^{\circ} - 10\cot 55^{\circ}$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '=10cot35∘'}, at: '=[[10cot35∘]]−', text: 'd₁'}
          - {line: 7, kind: move, from: {line: 6, at: '=10cot55∘'}, at: '−[[10cot55∘]]', text: 'd₂'}
          - {figure: sketch_b, kind: highlight, target: AB, text: 'd₁ − d₂'}
      - say: 'Both terms have 10, so take out the common factor 10.'
        write: '$AB = 10(\cot 35^{\circ} - \cot 55^{\circ})$ km'
      - say: 'Therefore the distance between the two points is 10 times, cot 35 minus cot 55, kilometres.'
        write: '$\therefore AB = 10(\cot 35^{\circ} - \cot 55^{\circ})$ km'
      - section: 'Check'
        say: 'Check with the tables. Tan 35 is 0.7002, so cot 35 is 1.4281. Tan 55 is 1.4281, so cot 55 is 0.7002. 10 times the difference is about 7.3 km, which is sensible.'
        write: 'Check: $10(1.4281 - 0.7002) = 7.279 \approx 7.3$ km $> 0\ \checkmark$'
      - section: 'Answer'
        say: 'So the distance is 10 times, cot 35 minus cot 55, kilometres, which is answer choice D.'
        write: '$\therefore 10(\cot 35^{\circ} - \cot 55^{\circ})$ km'
        answer: true
    traps:
      A: 'You went for sines. Sine needs the line of sight, the hypotenuse, which we do not know. The height is opposite and the ground distance is adjacent, so we use tan, and the distance is 10 over tan, which is 10 cot.'
      B: 'You went for cosines. Cosine links the adjacent side to the hypotenuse, but we do not know the line of sight. The height is opposite and the distance is adjacent, so we use tan, and each distance is 10 cot theta.'
      C: 'You went for tangents. That treats the 10 km as the ground distance. The 10 km is the height, opposite the angle, so the ground distance is 10 divided by tan, which is 10 cot.'
  42:
    moments:
      - section: 'The question'
        say: 'We want an acute angle $x$ with 4 sin squared $x$ minus 3 equal to 0. Solve for sin $x$ first, then name the special angle.'
        write: '$4\sin^{2}x - 3 = 0$, $\ 0^{\circ} < x < 90^{\circ}$'
      - section: 'Solution'
        say: 'Solution. Make sin squared $x$ the subject. Add 3 to both sides.'
        write: 'Solution: $4\sin^{2}x = 3$'
      - say: 'Divide both sides by 4.'
        write: '$\sin^{2}x = \dfrac{3}{4}$'
      - say: 'Take the square root of both sides. Root 3 over root 4 is root 3 over 2. $x$ is acute, so sin $x$ is positive, and we take the plus sign.'
        write: '$\sin x = +\sqrt{\dfrac{3}{4}} = \dfrac{\sqrt{3}}{2}$ ($x$ acute)'
      - section: 'The special angle'
        say: 'Which angle has sine root 3 over 2? Take an equilateral triangle of side 2, with every angle 60 degrees.'
        doodle: {name: 'custom:1989_q42_a', id: tri, caption: 'equilateral triangle, side 2'}
        write: 'Equilateral $\triangle$: side $2$, each $\angle = 60^{\circ}$'
      - say: 'Drop the height from the top. It cuts the base into 1 and 1. By Pythagoras the height is root of 2 squared minus 1 squared, which is root 3.'
        doodle_do: [{id: tri, op: stage, stage: 'custom:1989_q42_a2', 'on': 'Drop the height'}]
        write: 'Height $= \sqrt{2^{2} - 1^{2}} = \sqrt{3}$ (Pythagoras)'
      - say: 'From the 60 degree angle at the base, the height root 3 is opposite and the side 2 is the hypotenuse. SOH says sin is opposite over hypotenuse.'
        write: 'SOH: $\sin 60^{\circ} = \dfrac{\text{opp}}{\text{hyp}} = \dfrac{\sqrt{3}}{2}$'
        doodle_do:
          - {id: tri, op: highlight, part: height}
          - {id: tri, op: label, part: height, text: 'opp = √3'}
      - say: 'So sin $x$ equals sin 60 degrees, and 60 is between 0 and 90.'
        write: '$\sin x = \sin 60^{\circ} \Rightarrow x = 60^{\circ}$'
      - section: 'Check'
        say: 'To check, root 3 over 2, squared, is 3 over 4. 4 times 3 over 4 is 3, and 3 minus 3 is 0.'
        write: 'Check: $4\left(\dfrac{\sqrt{3}}{2}\right)^{2} - 3 = 4 \times \dfrac{3}{4} - 3 = 0\ \checkmark$'
      - section: 'Answer'
        say: 'So $x$ is 60 degrees, which is answer choice C.'
        write: '$\therefore x = 60^{\circ}$'
        answer: true
    traps:
      A: 'You went for 30 degrees. From the half triangle, sin 30 is opposite over hypotenuse, 1 over 2. It is cos 30 that is root 3 over 2.'
      B: 'You went for 45 degrees. Sin 45 is 1 over root 2, and its square is 1 over 2, not 3 over 4. Sin $x$ must be root 3 over 2, which is at 60.'
      D: 'You went for 90 degrees. Sin 90 is 1, and 4 minus 3 is 1, not 0. Also the question wants $x$ less than 90.'
  43:
    moments:
      - section: 'The question'
        say: 'The floor is in metres and the tile is in centimetres. Put both in the same unit first, then divide the area of the floor by the area of one tile.'
        write: 'Tile: $30$ cm square; floor: $7.2$ m by $4.2$ m'
      - section: 'Solution'
        say: 'Solution. Let me draw the floor, with a few tiles in one corner.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'tile 30 cm'}
      - say: 'There are 100 centimetres in a metre, so 30 centimetres is 30 over 100, which is 0.3 metres.'
        write: '$30$ cm $= \dfrac{30}{100}$ m $= 0.3$ m'
      - say: 'The area of a rectangle is length times breadth.'
        write: 'Area of rectangle $= l \times b$'
      - say: 'The floor is 7.2 times 4.2. 72 times 42 is 3024, and with two decimal places that is 30.24 square metres.'
        write: 'Floor $= 7.2 \times 4.2 = 30.24\ \text{m}^{2}$'
        point:
          - {figure: sketch, kind: underline, target: '7.2 m'}
          - {figure: sketch, kind: underline, target: '4.2 m', text: '30.24 m²'}
      - say: 'One tile is 0.3 times 0.3. 3 times 3 is 9, with two decimal places, so it is 0.09 square metres.'
        write: 'Tile $= 0.3 \times 0.3 = 0.09\ \text{m}^{2}$'
        point:
          - {figure: sketch, kind: label, target: 'tile 30 cm', text: '0.09 m²'}
      - say: 'The number of tiles is the area of the floor divided by the area of one tile.'
        write: 'No. of tiles $= \dfrac{\text{area of floor}}{\text{area of one tile}}$'
      - say: 'Substitute.'
        write: 'No. of tiles $= \dfrac{30.24}{0.09}$'
      - say: 'Multiply the top and the bottom by 100 to clear the decimals.'
        write: 'No. of tiles $= \dfrac{3024}{9}$'
      - say: '3024 divided by 9 is 336.'
        write: 'No. of tiles $= 336$'
        point:
          - {figure: sketch, kind: label, target: 'number of tiles = ?', text: '336'}
      - section: 'Check'
        say: 'Check by rows. Along the length, 7.2 divided by 0.3 is 24 tiles. Across the width, 4.2 divided by 0.3 is 14 tiles.'
        write: '$\dfrac{7.2}{0.3} = 24$ along, $\dfrac{4.2}{0.3} = 14$ across'
        point:
          - {figure: sketch, kind: label, target: '7.2 m', text: '24 tiles'}
          - {figure: sketch, kind: label, target: '4.2 m', text: '14 tiles'}
      - say: '24 rows of 14 tiles gives 24 times 14, which is 336. It matches.'
        write: '$24 \times 14 = 336$ $\checkmark$'
      - say: 'Therefore 336 tiles cover the floor, option A.'
        write: '$\therefore$ 336 tiles (A)'
        answer: true
    traps:
      B: 'You went for 420. Check the rows. 24 tiles fit along the 7.2 metres and 14 across the 4.2 metres, and 24 times 14 is 336.'
      C: 'You went for 576. That is 24 times 24, as if the floor were a square 7.2 metres each way. The width is 4.2 metres, which takes only 14 tiles, and 24 times 14 is 336.'
      D: 'You went for 720. Put everything in metres first. The tile is 0.3 metres, so 24 tiles fit along and 14 across, giving 336.'
  44:
    moments:
      - section: 'The question'
        say: 'Take a solid metal rod and drill a hole straight through its middle. Now you have a pipe. The metal left is the rod, minus the hole. That one idea solves this question.'
        write: 'Find the volume of metal in the pipe.'
        doodle: {name: 'custom:1989_q44_a', id: rod, caption: 'a pipe starts as a solid rod'}
      - say: 'Write Solution, then sketch the pipe. It is 1 metre long, and 7.2 cm across the outside.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: '1 m', text: 'length', 'on': '1 metre long'}
          - {figure: sketch, kind: underline, target: '7.2 cm', text: 'outer diameter', 'on': '7.2 cm across'}
      - say: 'Now draw the hole through the middle, which is 2.8 cm across. Watch it drilled through the rod.'
        write: 'Outer diameter $= 7.2$ cm, inner diameter $= 2.8$ cm'
        show_sketch: sketch_b
        doodle_do:
          - {id: rod, op: stage, stage: 'custom:1989_q44_a2', 'on': 'drilled through the rod'}
        point:
          - {figure: sketch_b, kind: underline, target: '2.8 cm', text: 'inner diameter', 'on': '2.8 cm across'}
      - section: 'What we know'
        say: 'The formula needs radii, not diameters. Call the outer radius capital R. It is half of 7.2, which is 3.6.'
        write: '$R = \dfrac{7.2}{2} = 3.6$ cm'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '7.2'}, at: '27.2', text: 'outer', 'on': 'half of 7.2'}
      - say: 'Call the inner radius small r. It is half of 2.8, which is 1.4.'
        write: '$r = \dfrac{2.8}{2} = 1.4$ cm'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '2.8'}, at: '22.8', text: 'inner', 'on': 'half of 2.8'}
      - say: 'Every length must be in the same unit. The radii are in centimetres, so change the length too, and 1 metre is 100 centimetres.'
        write: '$h = 1$ m $= 100$ cm'
        point:
          - {line: 5, kind: travel, at: '1 m', from: {figure: sketch_b, target: '1 m'}, text: 'length', 'on': '1 metre is'}
      - section: 'The formula'
        say: 'The volume of a cylinder is pi r squared h. So the metal is the outer cylinder, the solid rod, minus the inner cylinder, the hole.'
        write: 'Vol. of metal $=$ vol. of outer cylinder $-$ vol. of hole'
        doodle_do:
          - {id: rod, op: circle, part: rod, text: 'outer cylinder', 'on': 'solid rod'}
          - {id: rod, op: cross, part: core, text: 'take away', 'on': 'the hole'}
      - say: 'In symbols, that is pi capital R squared h, minus pi small r squared h.'
        write: '$V = \pi R^{2}h - \pi r^{2}h$'
      - say: 'Both terms have pi and h, so take them out as a common factor. That leaves R squared minus r squared in the bracket.'
        write: '$V = \pi h(R^{2} - r^{2})$'
      - section: 'Substitute'
        say: 'Substitute, so h is 100, capital R is 3.6 and small r is 1.4.'
        write: '$V = \pi \times 100 \times (3.6^{2} - 1.4^{2})$'
        point:
          - {line: 9, kind: move, from: {line: 5, at: '= 100'}, at: '× 100', text: 'h', 'on': 'h is 100'}
          - {line: 9, kind: move, from: {line: 3, at: '= [[3.6]]'}, at: '(3.6', text: 'R', 'on': 'R is 3.6'}
          - {line: 9, kind: move, from: {line: 4, at: '= [[1.4]]'}, at: '1.42)', text: 'r', 'on': 'r is 1.4'}
      - section: 'Simplify'
        say: '3.6 squared is 3.6 times 3.6, which is 12.96. 1.4 squared is 1.4 times 1.4, which is 1.96.'
        write: '$= 100\pi(12.96 - 1.96)$'
      - say: '12.96 minus 1.96 is 11.'
        write: '$= 100\pi \times 11$'
      - say: '100 times 11 is 1,100. So the volume is 1,100 pi.'
        write: '$= 1100\pi$'
        doodle_do:
          - {id: rod, op: pulse, part: rod, 'on': 'volume is'}
      - say: 'Therefore the volume of metal is 1,100 pi cubic centimetres. It is cubic because it is a volume.'
        write: '$\therefore$ volume of metal $= 1100\pi\ \text{cm}^{3}$'
      - section: 'Check'
        say: 'Check the bracket another way, by difference of two squares. 3.6 plus 1.4 is 5, 3.6 minus 1.4 is 2.2, and 5 times 2.2 is 11 again.'
        write: 'Check: $3.6^{2} - 1.4^{2} = (3.6 + 1.4)(3.6 - 1.4) = 5 \times 2.2 = 11$ ✓'
      - section: 'Answer'
        say: 'So the volume of metal is 1,100 pi cubic centimetres, which is answer choice B.'
        write: '$\therefore V = 1100\pi\ \text{cm}^{3}$ (B)'
        answer: true
    traps:
      A: 'You went for 440 pi. That comes from taking 2.8 from 7.2 first, which is 4.4, and never squaring. Use V = pi h, times R squared minus r squared. 12.96 minus 1.96 is 11, so V is 1,100 pi.'
      C: 'You went for 4,400 pi. That uses the diameters, 7.2 and 2.8, as if they were radii, which makes the answer 4 times too big. Halve the diameters first, so R is 3.6 and r is 1.4.'
      D: 'You went for 11,000 pi. That treats 1 metre as 1,000 cm. One metre is 100 cm, so h is 100 and V is 100 pi times 11, which is 1,100 pi.'
  45:
    moments:
      - section: 'The question'
        say: 'A pyramid stands on a square base 6 cm a side, and each edge from the top O down to a corner is 5 cm. How tall is it? Two right-angled triangles will get us there.'
        write: 'Find the height $OT$.'
      - say: 'Write Solution. The figure is given, and the height OT drops from O straight down to T, the centre of the square base.'
        write: 'Solution'
        point:
          - {figure: 0, kind: highlight, target: OT, text: 'height', 'on': 'height OT'}
          - {figure: 0, kind: circle, target: T, text: 'centre', 'on': 'centre of the square'}
      - section: 'What we know'
        say: 'List the givens. Each slant edge, such as OX, is 5 cm, and each side of the base, such as XW, is 6 cm.'
        write: '$|OX| = 5$ cm, $|XW| = |WZ| = 6$ cm'
        point:
          - {figure: 0, kind: highlight, target: OX, text: '5 cm', 'on': 'OX'}
          - {figure: 0, kind: highlight, target: XW, text: '6 cm', 'on': 'XW'}
      - section: 'The diagonal'
        say: 'First, the diagonal XZ of the base. Triangle XWZ is right-angled at W, so by Pythagoras, XZ squared is 6 squared plus 6 squared.'
        write: '$|XZ|^{2} = 6^{2} + 6^{2} = 72$ (Pythagoras)'
        point:
          - {figure: 0, kind: highlight, target: XZ, text: 'diagonal', 'on': 'diagonal XZ'}
      - say: '72 is 36 times 2, so XZ is 6 root 2.'
        write: '$|XZ| = \sqrt{36 \times 2} = 6\sqrt{2}$ cm'
      - say: 'The diagonals of a square bisect each other at T, so TX is half of XZ, which is 3 root 2.'
        write: '$|TX| = \tfrac{1}{2} \times 6\sqrt{2} = 3\sqrt{2}$ cm (diagonals bisect)'
        point:
          - {figure: 0, kind: label, target: TX, text: '3√2', 'on': '3 root 2'}
      - section: 'The height'
        say: 'Triangle OTX is right-angled at T, with the slant edge OX as hypotenuse. By Pythagoras, OX squared equals OT squared plus TX squared.'
        write: '$|OX|^{2} = |OT|^{2} + |TX|^{2}$ (Pythagoras)'
        point:
          - {figure: 0, kind: arc, target: OTX, text: '90°', 'on': 'right-angled at T'}
      - say: 'Substitute, so 5 squared equals OT squared plus 3 root 2, all squared.'
        write: '$5^{2} = |OT|^{2} + (3\sqrt{2})^{2}$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '= [[32]]cm'}, at: '(32)', text: 'TX', 'on': '3 root 2'}
      - say: '5 squared is 25. 3 root 2, squared, is 9 times 2, which is 18.'
        write: '$25 = |OT|^{2} + 18$'
      - say: 'Subtract 18 from both sides, and OT squared is 7.'
        write: '$|OT|^{2} = 25 - 18 = 7$'
      - say: 'Take the square root. Therefore the height OT is root 7 centimetres.'
        write: '$\therefore |OT| = \sqrt{7}$ cm'
        point:
          - {figure: 0, kind: label, target: OT, text: '√7', 'on': 'Therefore'}
      - section: 'Check'
        say: 'To check, root 7 squared plus 18 is 7 plus 18, which is 25, and 5 squared is 25.'
        write: 'Check: $7 + 18 = 25 = 5^{2}$ ✓'
      - section: 'Answer'
        say: 'So the height is root 7 centimetres, which is answer choice D.'
        write: '$\therefore |OT| = \sqrt{7}$ cm (D)'
        answer: true
    traps:
      A: 'You went for 2 root 5, which is root 20. OT squared is 25 minus TX squared, and TX is half the diagonal, 3 root 2, whose square is 18. So OT squared is 7.'
      B: 'You went for 3 cm. That is half the side of the base, not the height. The height comes from 5 squared minus 3 root 2 squared, which is 7.'
      C: 'You went for 4 cm. That uses half a side, 3, instead of half the diagonal, and the root of 25 minus 9 is 4. That is the slant height of a face. OX runs to a corner, so use half the diagonal.'
  46:
    moments:
      - section: 'The question'
        say: 'A cook used 75 g of rice, 40 g of margarine, 105 g of meat and 20 g of bread crumbs. We want the angle of the meat sector in a pie chart.'
        write: 'Meat sector $= ?$'
      - section: 'Solution'
        say: 'Solution. Draw the table of ingredients and masses. Each sectoral angle is the mass over the total mass, times 360 degrees.'
        write: 'Sectoral angle $= \dfrac{\text{mass}}{\text{total}} \times 360^{\circ}$'
        diagram: {id: t, kind: table, columns: [Ingredient, 'Mass (g)', 'Sectoral angle'], rows: [[Rice, 75, ''], [Margarine, 40, ''], [Meat, 105, ''], [Crumbs, 20, '']]}
      - say: 'First the total. 75 plus 40 is 115, plus 105 is 220, plus 20 is 240 grams.'
        write: 'Total $= 75 + 40 + 105 + 20 = 240$ g'
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': '240'}
      - section: 'The meat sector'
        say: 'Meat is 105 grams out of 240. Substitute into the formula.'
        write: 'Meat $= \dfrac{105}{240} \times 360^{\circ}$'
      - say: 'Simplify 360 over 240. Divide both by 120, and it is 3 over 2. So it is 105 times 3 over 2.'
        write: '$= 105 \times \dfrac{3}{2} = \dfrac{315}{2}$'
      - say: '315 divided by 2 is 157.5 degrees.'
        write: '$= 157.5^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:3,3', text: '157.5°', 'on': '157.5 degrees'}
      - section: 'Check'
        say: 'Check the full circle with the same 3 over 2. Rice is 112.5 degrees, margarine 60, and crumbs 30.'
        write: 'Rice $112.5^{\circ}$, margarine $60^{\circ}$, crumbs $30^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,3', text: '112.5°', 'on': '112.5'}
          - {id: t, op: fill, part: 'cell:2,3', text: '60°', 'on': '60'}
          - {id: t, op: fill, part: 'cell:4,3', text: '30°', 'on': '30'}
      - say: '112.5 plus 60 plus 157.5 plus 30 is 360 degrees, the whole circle.'
        write: '$112.5 + 60 + 157.5 + 30 = 360^{\circ}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the meat sector is 157.5 degrees, which is answer choice D.'
        write: '$\therefore$ meat sector $= 157.5^{\circ}$'
        answer: true
    traps:
      A: 'You went for 30 degrees. That is the bread crumbs sector, 20 over 240 of 360. Meat, 105 grams, is 157.5 degrees.'
      B: 'You went for 60 degrees. That is the margarine sector, 40 over 240 of 360. The question asks for the meat.'
      C: 'You went for 112.5 degrees. That is the rice sector, 75 over 240 of 360. Meat, 105 grams, is 157.5 degrees.'
  47:
    moments:
      - section: 'The question'
        say: 'A histogram shows the marks of 30 students. We want the percentage who scored more than 40.'
        write: 'Percentage scoring more than 40 $= ?$'
      - section: 'Solution'
        say: 'Solution. The classes all have the same width, 20 marks, so the height of each bar is the frequency of its class. Read the bars into a frequency table.'
        write: 'Equal class widths: height of bar $=$ frequency $f$'
        diagram: {id: t, kind: table, columns: [Marks, 'Frequency (f)'], rows: [['0–20', ''], ['20–40', ''], ['40–60', ''], ['60–80', ''], ['80–100', '']]}
        point:
          - {figure: 0, kind: circle, target: 'No. of students', text: 'frequency'}
      - say: 'The 0 to 20 bar reaches 9, and the 20 to 40 bar reaches 7.'
        write: 'Frequencies: $9,\ 7$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,2', text: '9', 'on': 'reaches 9'}
          - {id: t, op: fill, part: 'cell:2,2', text: '7', 'on': 'reaches 7'}
      - say: 'The 40 to 60 bar reaches 6, the 60 to 80 bar reaches 6, and the 80 to 100 bar reaches 2.'
        write: 'Frequencies: $6,\ 6,\ 2$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:3,2', text: '6', 'on': '40 to 60'}
          - {id: t, op: fill, part: 'cell:4,2', text: '6', 'on': '60 to 80'}
          - {id: t, op: fill, part: 'cell:5,2', text: '2', 'on': 'reaches 2'}
      - say: 'Check the table against the class. 9 plus 7 plus 6 plus 6 plus 2 is 30.'
        write: '$\Sigma f = 9 + 7 + 6 + 6 + 2 = 30\ \checkmark$'
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': '30'}
      - section: 'More than 40'
        say: 'More than 40 means the classes from 40 upwards, which are the last three bars. 6 plus 6 plus 2 is 14 students.'
        write: 'More than 40: $6 + 6 + 2 = 14$'
        diagram_do:
          - {id: t, op: highlight, part: 'row:3', 'on': 'last three bars'}
          - {id: t, op: highlight, part: 'row:4'}
          - {id: t, op: highlight, part: 'row:5', text: 'more than 40: 14'}
      - say: 'A percentage is the part over the whole, times 100.'
        write: 'Percentage $= \dfrac{14}{30} \times 100\%$'
      - say: 'Divide top and bottom by 2 to get 7 over 15. 7 times 100 is 700, so it is 700 over 15.'
        write: '$= \dfrac{7}{15} \times 100\% = \dfrac{700}{15}\%$'
      - say: '15 times 46 is 690, remainder 10. 10 over 15 is 2 over 3. So it is 46 and 2 over 3 percent.'
        write: '$= 46\tfrac{2}{3}\%$'
      - section: 'Check'
        say: 'Check with the other side. 16 students scored 40 or less, which is 53 and 1 over 3 percent. 46 and 2 over 3 plus 53 and 1 over 3 is 100.'
        write: '$46\tfrac{2}{3} + 53\tfrac{1}{3} = 100\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore 46 and 2 over 3 percent scored more than 40, which is answer choice C.'
        write: '$\therefore 46\tfrac{2}{3}\%$'
        answer: true
    traps:
      A: 'You went for 14 per cent. 14 is the number of students, not the percentage. 14 out of 30, times 100, is 46 and 2 over 3 per cent.'
      B: 'You went for 40 per cent. That is the mark in the question, not a percentage of students. 14 of the 30 scored more than 40, which is 46 and 2 over 3 per cent.'
      D: 'You went for 53 and 1 over 3 per cent. That is the students who scored 40 or less. The question asks about more than 40.'
  48:
    moments:
      - section: 'The question'
        say: 'A family of 21 people has an average age of 14. Without the grandfather, the average drops to 12. We want the grandfather''s age.'
        write: '21 people: mean 14; without the grandfather, 20 people: mean 12'
      - section: 'Solution'
        say: 'Solution. Turn the averages into totals. The mean is the total over the number of people, so the sum is the mean times the number.'
        write: 'Solution. Sum $=$ mean $\times$ number'
      - say: 'The sum of the ages of all 21 is 21 times 14. 20 times 14 is 280, and one more 14 makes 294.'
        write: 'Sum for 21 people $= 21 \times 14 = 294$'
      - say: 'Let the grandfather''s age be $x$ years.'
        write: 'Let the grandfather''s age $= x$ years'
      - say: 'Without him there are 20 people, with mean 12. Their sum is 20 times 12, which is 240.'
        write: 'Sum for the other 20 $= 20 \times 12 = 240$'
      - say: 'The other 20 plus the grandfather make all 21. So 240 plus $x$ is 294.'
        write: '$240 + x = 294$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '=240'}, at: '240', text: 'other 20'}
          - {line: 5, kind: move, from: {line: 2, at: '=294'}, at: '294', text: 'all 21'}
      - say: 'Subtract 240 from both sides.'
        write: '$x = 294 - 240$'
      - say: '294 minus 240 is 54.'
        write: '$\therefore x = 54$'
      - section: 'Check'
        say: 'To check, 240 plus 54 is 294, and 294 over 21 is 14, the average we were given.'
        write: 'Check: $\dfrac{240 + 54}{21} = \dfrac{294}{21} = 14$ ✓'
      - section: 'Answer'
        say: 'So the grandfather is 54 years old, which is option D.'
        write: '$\therefore$ Grandfather''s age $= 54$ years'
        answer: true
    traps:
      A: 'You went for 35 years. Work with sums. 21 times 14 is 294, and 20 times 12 is 240. So 240 plus $x$ is 294, and $x$ is 54.'
      B: 'You went for 40 years. The sum with the grandfather is 294 and without him is 240, so he is 294 minus 240, which is 54.'
      C: 'You went for 42 years. That is the drop in the mean, 2, times 21. But the new mean is over 20 people. Use sums. 294 minus 240 is 54.'
  49:
    moments:
      - section: 'The question'
        say: 'There are eight numbers, in no order. $n$ is the median and $m$ is the mode. We want the pair $n$, $m$. Picture them as eight cards in a jumble.'
        write: 'Data: $2.4,\ 2.1,\ 1.6,\ 2.6,\ 2.6,\ 3.7,\ 2.1,\ 2.6$'
        doodle: {name: 'custom:1989_q49_a', id: cards, caption: 'eight numbers', size: scene, 'on': 'cards'}
      - section: 'Solution'
        say: 'Solution. The median is the middle value once the data are arranged in order of size. So arrange them, smallest first, as 1.6, 2.1, 2.1, 2.4, 2.6, 2.6, 2.6 and 3.7.'
        write: 'Solution. In order: $1.6,\ 2.1,\ 2.1,\ 2.4,\ 2.6,\ 2.6,\ 2.6,\ 3.7$'
        doodle_do:
          - {id: cards, op: stage, stage: 'custom:1989_q49_a2', 'on': 'arrange'}
      - section: 'The median'
        say: 'There are 8 values. For ungrouped data the median is the 8 plus 1 over 2th value, and 9 over 2 is 4 and a half. So it sits halfway between the 4th and 5th values.'
        write: '$\left(\dfrac{8 + 1}{2}\right)$th $= 4\tfrac{1}{2}$th: between the 4th and 5th values'
      - say: 'Count along the ordered list, and the 4th value is 2.4 and the 5th is 2.6.'
        write: '4th value $= 2.4$, 5th value $= 2.6$'
        doodle_do:
          - {id: cards, op: circle, part: fourth, text: '4th'}
          - {id: cards, op: circle, part: fifth, text: '5th'}
        point:
          - {line: 1, kind: circle, at: '2.4,[[2.6]]', text: '4th and 5th'}
      - say: 'The median is their average. 2.4 plus 2.6 is 5.0, and 5.0 over 2 is 2.5.'
        write: '$n = \dfrac{2.4 + 2.6}{2} = \dfrac{5.0}{2} = 2.5$'
      - section: 'The mode'
        say: 'The mode is the value with the highest frequency. A small table of $x$ and $f$ shows it, with 1.6 once, 2.1 twice, 2.4 once, 2.6 three times and 3.7 once.'
        write: 'Mode: the value with the highest frequency'
        diagram:
          id: t
          kind: table
          columns: ['x', 'f']
          rows: [[1.6, 1], [2.1, 2], [2.4, 1], [2.6, 3], [3.7, 1]]
          'on': 'table'
      - say: 'The highest frequency is 3, for 2.6, the three cards side by side. So the mode is 2.6.'
        write: '$m = 2.6$ (highest frequency, 3)'
        diagram_do:
          - {id: t, op: highlight, part: 'row:4', text: 'highest f', 'on': 'highest'}
        doodle_do:
          - {id: cards, op: highlight, part: mode, 'on': 'cards'}
      - section: 'Check'
        say: 'Check the median. Four values sit at or below 2.4 and four at or above 2.6. So 2.5 is exactly in the middle.'
        write: 'Check: $1.6,\ 2.1,\ 2.1,\ 2.4\ |\ 2.6,\ 2.6,\ 2.6,\ 3.7$ ✓'
      - section: 'Answer'
        say: 'The question wants $n$, the median, first, then $m$, the mode, so 2.5 and 2.6. That is option B.'
        write: '$\therefore (n,\ m) = (2.5,\ 2.6)$'
        answer: true
    traps:
      A: 'You went for 2.6 and 2.6. The mode is right, but the median of 8 values is halfway between the 4th and 5th, 2.4 and 2.6, which is 2.5.'
      C: 'You went for 2.6 and 2.5. Those are the right numbers the wrong way round. $n$ is the median, 2.5, and $m$ is the mode, 2.6.'
      D: 'You went for 2.5 and 2.1. The median is right, but 2.1 has a frequency of only 2. The highest frequency is 3, for 2.6, so the mode is 2.6.'
  50:
    moments:
      - section: 'The question'
        say: 'Two numbers are chosen at random from 1, 3 and 6, so picture three cards, and we pick two. What is the probability that their sum is not odd?'
        write: 'Choose 2 from $1,\ 3,\ 6$: $P(\text{sum not odd}) = ?$'
        doodle: {name: 'custom:1989_q50_a', id: cards, caption: 'Pick two of 1, 3 and 6'}
      - say: 'Solution. Not odd means even. Let $E$ be the event that the sum is even.'
        write: 'Solution: let $E$ = sum is even (not odd)'
      - section: 'The sample space'
        say: 'Order does not matter, so 1 and 3 is the same pair as 3 and 1. So list every pair.'
        write: '$S = \{(1, 3),\ (1, 6),\ (3, 6)\}$'
        doodle_do:
          - {id: cards, op: stage, stage: 'custom:1989_q50_a2'}
      - say: 'n of $S$ is 3. As a check on the count, choosing 2 from 3 is 3 C 2, which is 3.'
        write: '${}^{3}C_{2} = \dfrac{3!}{1!\,2!} = 3$, so $n(S) = 3$'
      - section: 'The favourable outcomes'
        say: 'Now the sums. 1 plus 3 is 4, 1 plus 6 is 7, and 3 plus 6 is 9.'
        write: 'Sums: $1 + 3 = 4,\ \ 1 + 6 = 7,\ \ 3 + 6 = 9$'
        doodle_do:
          - {id: cards, op: label, part: p13, text: '4, even'}
          - {id: cards, op: label, part: p16, text: '7, odd'}
          - {id: cards, op: label, part: p36, text: '9, odd'}
      - say: 'Only 4 is even. So $E$ has just one pair, 1 and 3.'
        write: '$E = \{(1, 3)\}$'
        doodle_do:
          - {id: cards, op: circle, part: p13}
        point:
          - {line: 4, kind: strike, at: '1+6=7', text: 'odd'}
          - {line: 4, kind: strike, at: '3+6=9', text: 'odd'}
      - say: 'So n of $E$ is 1.'
        write: '$n(E) = 1$'
      - section: 'The probability'
        say: 'The probability of $E$ is n of $E$ over n of $S$, that is, the number of favourable outcomes over the total number of possible outcomes.'
        write: '$P(E) = \dfrac{n(E)}{n(S)}$'
      - say: 'Substitute, and we get 1 over 3.'
        write: '$= \dfrac{1}{3}$'
        point:
          - {line: 8, kind: move, from: {line: 6, at: '= 1'}, at: '3[[1]]', text: 'n(E)'}
          - {line: 8, kind: move, from: {line: 3, at: 'n(S) = 3'}, at: '[[3]]1', text: 'n(S)'}
      - section: 'Check'
        say: 'To check, odd plus odd is even, but odd plus even is odd. 1 and 3 are the only two odd numbers, so only one pair gives an even sum.'
        write: 'Check: only odd $+$ odd is even: $(1, 3)\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the probability that the sum is not odd is 1 over 3, which is option C.'
        write: '$\therefore P(\text{sum not odd}) = \dfrac{1}{3}$'
        answer: true
    traps:
      A: 'You went for 2 over 3. That is P of E complement, an odd sum, 7 and 9. Watch the word "not". Only 1 plus 3 is even, so it is 1 over 3.'
      B: 'You went for a half. n of S is 3 pairs, not 2 outcomes, and only one pair has an even sum. So it is 1 over 3.'
      D: 'You went for 1 over 6. That counts ordered picks, 6 of them, but only one order of 1 and 3. Counted either way, the answer is 1 over 3.'
