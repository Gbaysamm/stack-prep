      B: 'You went for $r$ greater than $abc$. That forgets the $bc + ac + ab$ on the bottom. With $a$, $b$, $c$ all 3, it would say $r$ is greater than 27, but the true condition is $r$ greater than 1.'
      C: 'You went for $r$ greater than the sum of the reciprocals. That multiplies by the bracket instead of dividing by it. To free $r$, divide by what''s multiplying it.'
