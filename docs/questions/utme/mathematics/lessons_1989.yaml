# UTME 1989 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1989.yaml. Answers match that file.
format_version: 1
exam_year: 1989
lessons:
  1:
    moments:
      - say: 'We have four lists of fractions, and we want the one in descending order. Descending means going down: every number is smaller than the one before it.'
        write: 'Fractions used: $\tfrac{9}{10},\ \tfrac{17}{20},\ \tfrac{4}{5},\ \tfrac{3}{4},\ \tfrac{17}{10}$'
      - say: 'Fractions with different bottom numbers are hard to compare by eye. So the plan is to turn each one into a decimal, and then compare the decimals.'
      - say: '9 over 10 is 9 divided by 10, which is 0.9.'
        write: '$\tfrac{9}{10} = 9 \div 10 = 0.9$'
      - say: 'For 17 over 20, multiply the top and the bottom by 5, so the bottom becomes 100. 17 times 5 is 85, so it is 85 over 100, which is 0.85.'
        write: '$\tfrac{17}{20} = \tfrac{17 \times 5}{20 \times 5} = \tfrac{85}{100} = 0.85$'
      - say: 'For 4 over 5, multiply the top and the bottom by 2. That gives 8 over 10, which is 0.8.'
        write: '$\tfrac{4}{5} = \tfrac{4 \times 2}{5 \times 2} = \tfrac{8}{10} = 0.8$'
      - say: 'For 3 over 4, multiply the top and the bottom by 25. 3 times 25 is 75, so it is 75 over 100, which is 0.75.'
        write: '$\tfrac{3}{4} = \tfrac{3 \times 25}{4 \times 25} = \tfrac{75}{100} = 0.75$'
      - say: 'And 17 over 10 is 17 divided by 10, which is 1.7. Notice that is bigger than 1, because the top is bigger than the bottom.'
        write: '$\tfrac{17}{10} = 17 \div 10 = 1.7$'
      - say: 'Now we use these decimals to read each option. Option A goes 0.9, 0.8, 0.75, and then 17 over 10, which is 1.7. It jumps up at the end, so A is out.'
        write: 'Option A: $0.9,\ 0.8,\ 0.75,\ 1.7$'
        point:
          - {line: 7, kind: strike, at: '1.7', text: 'jumps up'}
      - say: 'Option B starts with 4 over 5, which is 0.8, and then 9 over 10, which is 0.9. It goes up straight away, so B is out.'
        write: 'Option B: $0.8,\ 0.9,\ 0.75,\ 0.85$'
      - say: 'Option D goes 0.8, 0.9, then 1.7, and only then 0.75. It rises twice, so D is out.'
        write: 'Option D: $0.8,\ 0.9,\ 1.7,\ 0.75$'
        point:
          - {line: 9, kind: strike, at: '1.7', text: 'rises'}
      - say: 'Option C reads 0.9, then 0.85, then 0.8, then 0.75. Every number is smaller than the one before it.'
        write: 'Option C: $0.9 > 0.85 > 0.8 > 0.75$'
      - say: 'So the list in descending order is 9 over 10, 17 over 20, 4 over 5, 3 over 4, which is answer choice C.'
        write: 'Therefore $\tfrac{9}{10} > \tfrac{17}{20} > \tfrac{4}{5} > \tfrac{3}{4}$'
        answer: true
    traps:
      A: 'You went for A. It starts well, 0.9, 0.8, 0.75, but the last fraction is 17 over 10, which is 1.7, bigger than all the others. It looks like 17 over 20, but a smaller bottom number makes a bigger fraction.'
      B: 'You went for B. As decimals it begins 0.8, then 0.9, so it goes up before it goes down. Descending means every step goes down.'
      D: 'You went for D. As decimals it reads 0.8, 0.9, 1.7, 0.75, which rises twice. Turn each fraction into a decimal and check that every one is smaller than the last.'
  2:
    moments:
      - say: 'We want to work out 2,700,000 times 0.03, divided by 18,000, and give the answer in standard form.'
        write: '$2{,}700{,}000 \times 0.03 \div 18{,}000$'
      - say: 'Let''s do the multiplication first. 0.03 means 3 hundredths, so multiplying by 0.03 is the same as multiplying by 3 over 100.'
        write: '$0.03 = \dfrac{3}{100}$'
      - say: 'So 2,700,000 times 0.03 is 2,700,000 times 3, all over 100.'
        write: '$2{,}700{,}000 \times 0.03 = \dfrac{2{,}700{,}000 \times 3}{100}$'
      - say: 'Dividing by 100 takes two zeros off the 2,700,000, which leaves 27,000.'
        write: '$= 27{,}000 \times 3$'
      - say: '27 times 3 is 81, so 27,000 times 3 is 81,000.'
        write: '$= 81{,}000$'
      - say: 'Now we divide that 81,000 by 18,000. Let''s write the division as a fraction.'
        write: 'Then $81{,}000 \div 18{,}000 = \dfrac{81{,}000}{18{,}000}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '81,000'}, at: '[[81,000]] ÷', text: 'carried down'}
      - say: 'The top and the bottom both end in three zeros, so we can cancel them. That leaves 81 over 18.'
        write: '$= \dfrac{81}{18}$'
      - say: '81 and 18 both divide by 9. 81 divided by 9 is 9, and 18 divided by 9 is 2. So we get 9 over 2.'
        write: '$= \dfrac{81 \div 9}{18 \div 9} = \dfrac{9}{2}$'
      - say: '9 divided by 2 is 4.5.'
        write: '$= 4.5$'
      - say: 'Standard form is a number from 1 up to 10, times a power of 10. 4.5 is already between 1 and 10, so the power is zero, because 10 to the power zero is 1.'
        write: '$10^{0} = 1$'
      - say: 'So the answer is 4.5 times 10 to the power zero, which is answer choice A.'
        write: '$4.5 = 4.5 \times 10^{0}$'
        answer: true
    traps:
      B: 'You went for 4.5 times 10 to the 1, which is 45. The working gives 81,000 divided by 18,000, which is 4.5 exactly, so the power of 10 is zero.'
      C: 'You went for 4.5 times 10 squared, which is 450. That''s what you get if you treat 0.03 as 3. Multiplying by 0.03 makes the number smaller: 2,700,000 times 0.03 is 81,000.'
      D: 'You went for 4.5 times 10 cubed, which is 4,500. Check the zeros: 81,000 divided by 18,000 is 81 over 18, which is just 4.5.'
  3:
    moments:
      - say: 'We want the prime factors of 2,520. A prime factor is a factor that is itself a prime number: a number whose only factors are 1 and itself, like 2, 3, 5 and 7.'
        write: 'Prime factors of $2520$'
      - say: 'The plan is to keep dividing by the smallest prime that works. 2,520 is even, so start with 2. Half of 2,520 is 1,260.'
        write: '$2520 \div 2 = 1260$'
      - say: '1,260 is still even. Half of 1,260 is 630.'
        write: '$1260 \div 2 = 630$'
      - say: '630 is even too. Half of 630 is 315.'
        write: '$630 \div 2 = 315$'
      - say: '315 is odd, so 2 won''t go any more. Try the next prime, 3. The digits of 315 add up to 3 plus 1 plus 5, which is 9, so 3 divides it. 315 divided by 3 is 105.'
        write: 'Digit sum $3 + 1 + 5 = 9$, so $315 \div 3 = 105$'
      - say: 'For 105, the digits add up to 1 plus 0 plus 5, which is 6, so 3 goes again. 105 divided by 3 is 35.'
        write: 'Digit sum $1 + 0 + 5 = 6$, so $105 \div 3 = 35$'
      - say: '35 does not divide by 3, but it ends in 5, so divide by the next prime, 5. 35 divided by 5 is 7.'
        write: '$35 \div 5 = 7$'
      - say: '7 is itself a prime, so we divide by 7 and reach 1. Now we stop.'
        write: '$7 \div 7 = 1$'
      - say: 'Now collect every prime we divided by, going back up the list. We used 2 three times, 3 twice, then 5 once and 7 once.'
        write: '$2520 = 2 \times 2 \times 2 \times 3 \times 3 \times 5 \times 7$'
        point:
          - {line: 6, kind: circle, at: '÷ 5', text: 'primes used'}
          - {line: 7, kind: circle, at: '÷ 7'}
      - say: 'In index form, three 2s make 2 cubed, and two 3s make 3 squared.'
        write: '$= 2^{3} \times 3^{2} \times 5 \times 7$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '2×2×2'}, at: '23', text: 'three 2s'}
          - {line: 9, kind: move, from: {line: 8, at: '3×3'}, at: '32', text: 'two 3s'}
      - say: 'Let''s check. 2 cubed is 8 and 3 squared is 9, and 8 times 9 is 72. 5 times 7 is 35. And 72 times 35 is 2,520.'
        write: 'Check: $8 \times 9 \times 5 \times 7 = 72 \times 35 = 2520$'
      - say: 'The different primes on our list are 2, 3, 5 and 7, which is answer choice C.'
        write: 'Prime factors: $2,\ 3,\ 5,\ 7$'
        answer: true
    traps:
      A: 'You went for 2, 9, 5. Nine does divide 2,520, but 9 is 3 times 3, so it isn''t prime. The list also leaves out 7.'
      B: 'You went for 2, 9, 7. Nine is not prime, since it''s 3 times 3, and the list misses 5. The primes are 2, 3, 5 and 7.'
      D: 'You went for 2, 3, 7, 9. Nine is 3 times 3, so it''s a factor but not a prime factor, and 5 is missing. The prime factors are 2, 3, 5 and 7.'
  4:
    moments:
      - say: 'We''re told that 12 in base twelve equals $x$ in base 7, and we want $x$.'
        write: '$12_{12} = x_{7}$'
      - say: 'The easiest route between two unusual bases is through base ten. So first we turn 12 in base twelve into an ordinary number, and then we turn that into base 7.'
        write: 'Route: base 12 $\to$ base 10 $\to$ base 7'
      - say: 'In base twelve, the place values are units, then twelves. So in 12, the 1 is in the twelves place and the 2 is in the units place.'
        write: '$12_{12} = 1 \times 12 + 2 \times 1$'
      - say: '1 times 12 is 12, and 2 times 1 is 2. 12 plus 2 is 14.'
        write: '$= 12 + 2 = 14_{10}$'
      - say: 'Now for base 7. Its place values are units, sevens, then 49s. 14 is less than 49, so we only need sevens and units.'
        write: 'Base 7 places: $7^{0} = 1,\ 7^{1} = 7,\ 7^{2} = 49$'
      - say: 'To convert 14, we divide by 7 and keep the remainders. 14 divided by 7 is 2, remainder 0.'
        write: '$14 \div 7 = 2 \text{ r } 0$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '14'}, at: '14', text: 'carried down'}
      - say: 'Then divide that 2 by 7. 7 doesn''t go into 2, so it is 0, remainder 2.'
        write: '$2 \div 7 = 0 \text{ r } 2$'
      - say: 'Read the remainders from the bottom up: 2, then 0. That gives 20 in base 7.'
        write: '$14_{10} = 20_{7}$'
        point:
          - {line: 6, kind: circle, at: 'r 2', text: 'read first'}
          - {line: 5, kind: circle, at: 'r 0', text: 'then this'}
      - say: 'Let''s check. 20 in base 7 means 2 sevens and 0 units. 2 times 7 is 14, which matches the base ten value we found.'
        write: 'Check: $20_{7} = 2 \times 7 + 0 = 14$'
      - say: 'So $x$ is 20, which is answer choice A.'
        write: '$12_{12} = 20_{7}$, so $x = 20$'
        answer: true
    traps:
      B: 'You went for 15. The base-ten value is 14, and in base 7 that''s 2 sevens and no units, so it''s written 20.'
      C: 'You went for 14. That''s the base-ten value, found halfway through. The question wants the numeral in base 7, so 14 has to be converted again, giving 20.'
      D: 'You went for 12. That just copies the digits across. 12 in base twelve is 14 in base ten, and 14 in base 7 is 20.'
  5:
    moments:
      - say: 'We want to simplify the cube root of $64r^{-6}$, with the whole thing raised to the power a half.'
        write: '$\left(\sqrt[3]{64r^{-6}}\right)^{\frac{1}{2}}$'
      - say: 'We''ll work from the inside out. A root acts on the number and on the letter separately, so we take the cube root of the 64 and of the $r^{-6}$ one at a time.'
        write: 'Inside: $\sqrt[3]{64r^{-6}} = \sqrt[3]{64} \times \sqrt[3]{r^{-6}}$'
      - say: 'The cube root of 64 is 4, because 4 times 4 times 4 is 64.'
        write: '$\sqrt[3]{64} = 4 \quad (4 \times 4 \times 4 = 64)$'
      - say: 'A cube root is the same as the power a third. So the cube root of $r^{-6}$ is $r^{-6}$ to the power 1 over 3.'
        write: '$\sqrt[3]{r^{-6}} = \left(r^{-6}\right)^{\frac{1}{3}}$'
      - say: 'Power of a power: when a power is raised to another power, multiply the indices.'
        write: 'Power of a power: $(a^{m})^{n} = a^{mn}$'
      - say: 'When a power is raised to another power, we multiply the indices. Negative 6 times a third is negative 2.'
        write: '$= r^{-6 \times \frac{1}{3}} = r^{-2}$'
      - say: 'Putting the two pieces together, the 4 and the $r^{-2}$, the cube root of $64r^{-6}$ is $4r^{-2}$.'
        write: '$\sqrt[3]{64r^{-6}} = 4r^{-2}$'
        point:
          - {line: 6, kind: move, from: {line: 2, at: '= 4'}, at: '= [[4]]r−2', text: 'the 4'}
          - {line: 6, kind: move, from: {line: 5, at: 'r−2'}, at: 'r−2', text: 'the r part'}
      - say: 'Now go back to the power a half on the outside, and apply it to the $4r^{-2}$ we just found.'
        write: 'So $\left(\sqrt[3]{64r^{-6}}\right)^{\frac{1}{2}} = \left(4r^{-2}\right)^{\frac{1}{2}}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '4r−2'}, at: '(4r−2)', text: 'just found'}
      - say: 'Again the power acts on each part: 4 to the power a half, times $r^{-2}$ to the power a half.'
        write: '$= 4^{\frac{1}{2}} \times \left(r^{-2}\right)^{\frac{1}{2}}$'
      - say: 'The power a half is a square root, and the square root of 4 is 2. For the $r$, negative 2 times a half is negative 1.'
        write: '$= 2 \times r^{-2 \times \frac{1}{2}} = 2r^{-1}$'
      - say: 'A negative power means one over. $r^{-1}$ is 1 over $r$, so $2r^{-1}$ is 2 over $r$.'
        write: '$= 2 \times \dfrac{1}{r} = \dfrac{2}{r}$'
      - say: 'Let''s check with $r$ equal to 1. The original becomes the cube root of 64, which is 4, and the square root of 4 is 2. Our answer, 2 over 1, is also 2.'
        write: 'Check $r = 1$: $\left(\sqrt[3]{64}\right)^{\frac{1}{2}} = 4^{\frac{1}{2}} = 2 = \dfrac{2}{1}$'
      - say: 'So the expression simplifies to 2 over $r$, which is answer choice D.'
        write: '$\left(\sqrt[3]{64r^{-6}}\right)^{\frac{1}{2}} = \dfrac{2}{r}$'
        answer: true
    traps:
      A: 'You went for $r$. The number part doesn''t vanish: the cube root of 64 is 4, and the square root of 4 is 2. And the power of $r$ ends up negative.'
      B: 'You went for $2r$. The 2 is right, but $r$ started with a negative power, so it ends as $r^{-1}$, which puts $r$ in the denominator.'
      C: 'You went for 1 over $2r$. Only the $r$ has a negative power. The 2 comes from the square root of 4 and stays on top.'
  6:
    moments:
      - say: 'We round 0.007685 two ways: correct to three significant figures, and correct to four decimal places. Then we find the difference between the two results.'
        write: '$0.007685$'
      - say: 'Significant figures start at the first digit that is not zero. The zeros in front don''t count. So the significant digits here are 7, 6, 8 and 5.'
        write: 'Significant digits: $7,\ 6,\ 8,\ 5$'
      - say: 'For three significant figures we keep 7, 6 and 8. The next digit is 5, and 5 or more rounds up, so the 8 becomes 9.'
        write: 'Keep three: $0.00768|5 \to 0.00769$'
      - say: 'So to three significant figures, the number is 0.00769.'
        write: '3 s.f.: $0.007685 \approx 0.00769$'
      - say: 'Decimal places count from the decimal point instead. Four places takes us to 0.0076, and the next digit is 8.'
        write: 'Four places: $0.0076|85$'
      - say: '8 is 5 or more, so the 6 rounds up to 7. To four decimal places, the number is 0.0077.'
        write: '4 d.p.: $0.007685 \approx 0.0077$'
      - say: 'Now the difference: the bigger one, 0.0077, minus the smaller one, 0.00769.'
        write: 'Difference $= 0.0077 - 0.00769$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '≈ 0.0077'}, at: '0.0077', text: '4 d.p.'}
          - {line: 6, kind: move, from: {line: 3, at: '≈ 0.00769'}, at: '0.00769', text: '3 s.f.'}
      - say: 'To line up the decimal places, write 0.0077 as 0.00770. A zero on the end doesn''t change it.'
        write: '$= 0.00770 - 0.00769$'
      - say: '770 minus 769 is 1, so the difference is a 1 in the fifth decimal place: 0.00001.'
        write: '$= 0.00001$'
      - say: '0.00001 is 1 over 100,000, and 100,000 is 10 to the power 5. So it is 10 to the power negative 5.'
        write: '$= \dfrac{1}{100{,}000} = \dfrac{1}{10^{5}} = 10^{-5}$'
      - say: 'So the difference is 10 to the power negative 5, which is answer choice A.'
        write: 'Difference $= 10^{-5}$'
        answer: true
    traps:
      B: 'You went for 7 times 10 to the negative 4, which is 0.0007. That is not the gap between the two rounded numbers. 0.00770 minus 0.00769 is 0.00001.'
      C: 'You went for 8 times 10 to the negative 5. Check the rounding: 3 significant figures gives 0.00769 and 4 decimal places gives 0.0077. They differ by only 1 in the fifth decimal place.'
      D: 'You went for 10 to the negative 6. The difference is 0.00001, which has the 1 in the fifth decimal place, so it''s 10 to the negative 5.'
  7:
    moments:
      - say: 'We''re told $a$ to $b$ is 5 to 8, and $x$ to $y$ is 25 to 16. We want $\tfrac{a}{x}$ to $\tfrac{b}{y}$.'
        write: '$a : b = 5 : 8,\quad x : y = 25 : 16$'
      - say: 'A ratio only tells us the proportions, so we are free to pick actual numbers that fit. The simplest choice for $a$ to $b$ is $a$ equals 5 and $b$ equals 8.'
        write: '$a = 5,\ b = 8$'
      - say: 'And for $x$ to $y$, take $x$ equals 25 and $y$ equals 16.'
        write: '$x = 25,\ y = 16$'
      - say: 'Now the first part of the ratio we want, $a$ over $x$. Put in $a$ equals 5 and $x$ equals 25.'
        write: '$\dfrac{a}{x} = \dfrac{5}{25}$'
        point:
          - {line: 1, kind: circle, at: 'a = 5', text: 'sub in'}
          - {line: 2, kind: circle, at: 'x = 25'}
      - say: '5 and 25 both divide by 5. 5 divided by 5 is 1, and 25 divided by 5 is 5, so it is 1 over 5.'
        write: '$= \dfrac{5 \div 5}{25 \div 5} = \dfrac{1}{5}$'
      - say: 'Next, $b$ over $y$. Put in $b$ equals 8 and $y$ equals 16.'
        write: '$\dfrac{b}{y} = \dfrac{8}{16}$'
      - say: '8 and 16 both divide by 8. 8 divided by 8 is 1, and 16 divided by 8 is 2, so it is 1 over 2.'
        write: '$= \dfrac{8 \div 8}{16 \div 8} = \dfrac{1}{2}$'
      - say: 'Using those two results, the ratio we want is 1 over 5, to 1 over 2.'
        write: '$\dfrac{a}{x} : \dfrac{b}{y} = \dfrac{1}{5} : \dfrac{1}{2}$'
        point:
          - {line: 4, kind: arrow, text: 'a over x'}
          - {line: 6, kind: arrow, text: 'b over y'}
      - say: 'A ratio is tidier in whole numbers. Multiplying both parts by the same number keeps the ratio the same, and 10 clears both bottoms.'
        write: '$= \left(\dfrac{1}{5} \times 10\right) : \left(\dfrac{1}{2} \times 10\right)$'
      - say: '1 over 5 of 10 is 2, and a half of 10 is 5.'
        write: '$= 2 : 5$'
      - say: 'Would other numbers change it? No. If $a$ were $5k$, $b$ were $8k$, $x$ were $25m$ and $y$ were $16m$, the $k$ and $m$ cancel and we get the same fractions.'
        write: 'In general: $\dfrac{5k}{25m} : \dfrac{8k}{16m} = \dfrac{k}{5m} : \dfrac{k}{2m} = \dfrac{1}{5} : \dfrac{1}{2}$'
      - say: 'So the ratio is 2 to 5, which is answer choice D.'
        write: '$\dfrac{a}{x} : \dfrac{b}{y} = 2 : 5$'
        answer: true
    traps:
      A: 'You went for 125 to 128. That comes from multiplying, 5 times 25 against 8 times 16. The question wants $a$ divided by $x$, so it''s 5 over 25 against 8 over 16.'
      B: 'You went for 3 to 5. Work out each fraction: 5 over 25 is 1 over 5 and 8 over 16 is a half. Multiply both by 10 and 1 over 5 to a half becomes 2 to 5.'
      C: 'You went for 3 to 4. Put numbers in: $a$ over $x$ is 5 over 25, which is 1 over 5, and $b$ over $y$ is 8 over 16, which is a half. Times both by 10 to get 2 to 5.'
  8:
    moments:
      - say: 'Oke puts ₦800 in the bank at 12 and a half percent simple interest. After some time, the total amount is one and a half times the principal. We want the number of years.'
        write: 'Principal: ₦800, rate: $12\tfrac{1}{2}\%$'
      - say: 'First, the amount. It is one and a half times the principal, and one and a half times 800 is 1,200.'
        write: 'Amount $= 1.5 \times 800 = 1200$'
      - say: 'The amount is the principal plus the interest. So the interest alone is the amount, 1,200, minus the principal, 800. That is ₦400.'
        write: 'Interest $= 1200 - 800 = 400$'
        point:
          - {line: 2, kind: move, from: {line: 1, at: '= 1200'}, at: '1200', text: 'the amount'}
      - say: 'Now the simple interest formula: interest equals principal times rate times time, all over 100.'
        write: '$I = \dfrac{PRT}{100}$'
        point:
          - {line: 3, kind: box, text: 'the rule'}
      - say: 'We want the time, $T$. Multiply both sides by 100, then divide both sides by $P$ times $R$.'
        write: '$T = \dfrac{100I}{PR}$'
      - say: 'Now substitute. The interest we just found is 400, the principal is 800, and the rate is 12.5.'
        write: '$T = \dfrac{100 \times 400}{800 \times 12.5}$'
        point:
          - {line: 5, kind: move, from: {line: 2, at: '= 400'}, at: '400', text: 'interest'}
      - say: 'On top, 100 times 400 is 40,000.'
        write: '$= \dfrac{40{,}000}{800 \times 12.5}$'
      - say: 'On the bottom, 800 times 12 is 9,600, and 800 times a half is 400. 9,600 plus 400 is 10,000.'
        write: '$= \dfrac{40{,}000}{9600 + 400} = \dfrac{40{,}000}{10{,}000}$'
      - say: '40,000 divided by 10,000 is 4.'
        write: '$= 4$'
      - say: 'Let''s check another way. 12.5 percent of 800 is 100, so the money earns ₦100 each year. In 4 years that is ₦400, exactly the interest we needed.'
        write: 'Check: $\dfrac{12.5}{100} \times 800 = 100$ a year, and $4 \times 100 = 400$'
      - say: 'So the money was in the bank for 4 years, which is answer choice B.'
        write: '$T = 4$ years'
        answer: true
    traps:
      A: 'You went for 2. The interest needed is ₦400, and the money earns ₦100 a year, so it takes 4 years, not 2.'
      C: 'You went for 5 and a half. The yearly interest is 12.5% of ₦800, which is ₦100, and ₦400 of interest needs exactly 4 years.'
      D: 'You went for 8. That''s how long it takes the money to double, when the interest is ₦800. Here the interest is only half the principal, ₦400, so it takes 4 years.'
  9:
    moments:
      - say: 'The surface area of a sphere goes up by 44 percent. We want the percentage increase in its diameter.'
        write: 'Area up by $44\%$; diameter up by what percent?'
      - say: 'Let me draw the shape, so we can see its measurements.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'area A', text: 'old area'}
          - {figure: sketch, kind: circle, target: 'area 1.44A', text: 'new area'}
      - say: 'The key idea: the surface area of a sphere depends on the square of the diameter. The formula is pi $d$ squared.'
        write: '$A = \pi d^{2}$'
      - say: 'An increase of 44 percent means the new area is 100 plus 44, which is 144 percent of the old area. That is 1.44 times the old area.'
        write: '$A_{\text{new}} = 144\% \text{ of } A = 1.44A$'
      - say: 'Suppose the diameter is multiplied by some number $k$. Then the new area is pi times $kd$, all squared, which is $k$ squared times pi $d$ squared.'
        write: '$A_{\text{new}} = \pi (kd)^{2} = k^{2} \times \pi d^{2} = k^{2}A$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {figure: sketch, kind: circle, target: d, text: 'old diameter'}
          - {figure: sketch, kind: circle, target: 'kd = ?', text: 'new diameter'}
      - say: 'Now compare with the line above it. The new area is $k$ squared times $A$, and it is also 1.44 times $A$. So $k$ squared is 1.44.'
