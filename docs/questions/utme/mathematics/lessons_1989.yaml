        write: '$x = 60^{\circ}$'
      - say: 'Let''s check. Root 3 over 2, squared, is 3 over 4, and 4 times 3 over 4 is 3. 3 minus 3 is 0.'
        write: 'Check: $4\left(\dfrac{\sqrt{3}}{2}\right)^{2} - 3 = 4 \times \dfrac{3}{4} - 3 = 0$'
      - say: 'So $x$ is 60 degrees, which is answer choice C.'
        write: '$x = 60^{\circ}$'
        answer: true
    traps:
      A: 'You went for 30 degrees. It''s cos 30 that equals root 3 over 2. Sin 30 is only a half. Sine and cosine swap values at 30 and 60.'
      B: 'You went for 45 degrees. Sin 45 is 1 over root 2, and its square is a half, not three quarters. We need sine equal to root 3 over 2, which is at 60.'
      D: 'You went for 90 degrees. Sin 90 is 1, and 4 minus 3 is 1, not 0. Also, the question says $x$ is less than 90.'
