      - say: 'The median is the middle value, so the numbers must be in order first. Let''s arrange them from smallest to largest.'
        write: 'In order: $1.6,\ 2.1,\ 2.1,\ 2.4,\ 2.6,\ 2.6,\ 2.6,\ 3.7$'
      - say: 'There are 8 numbers, an even count, so there is no single middle number. The median is the average of the two in the middle, the 4th and the 5th.'
        write: 'Count $= 8$, so median $=$ mean of the 4th and 5th'
