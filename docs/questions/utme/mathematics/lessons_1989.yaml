  25:
    moments:
      - say: 'We want the values of $r$ for which $r$ over $a$, plus $r$ over $b$, plus $r$ over $c$, is greater than 1. And $a$, $b$, $c$ are all positive.'
        write: '$\dfrac{r}{a} + \dfrac{r}{b} + \dfrac{r}{c} > 1$'
      - say: 'Let me draw this on a number line, so we can see the values.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'r = ? (r greater than this)'}
      - say: 'Every term has an $r$ on top, so take $r$ out as a common factor.'
        write: '$r\left(\dfrac{1}{a} + \dfrac{1}{b} + \dfrac{1}{c}\right) > 1$'
      - say: 'Now combine the bracket over the common bottom $abc$. For 1 over $a$, multiply top and bottom by $bc$. For 1 over $b$, multiply by $ac$. For 1 over $c$, multiply by $ab$.'
        write: '$\dfrac{1}{a} = \dfrac{bc}{abc},\quad \dfrac{1}{b} = \dfrac{ac}{abc},\quad \dfrac{1}{c} = \dfrac{ab}{abc}$'
      - say: 'Now they share a bottom, so we add the three tops.'
        write: '$\dfrac{1}{a} + \dfrac{1}{b} + \dfrac{1}{c} = \dfrac{bc + ac + ab}{abc}$'
      - say: 'Put that back in place of the bracket. The inequality reads: $r$ times this fraction is greater than 1.'
        write: '$r \times \dfrac{bc + ac + ab}{abc} > 1$'
        point:
          - {line: 4, kind: arrow, text: 'the bracket'}
      - say: 'Here is the key point. $a$, $b$ and $c$ are positive, so this fraction is positive. Dividing both sides of an inequality by a positive number keeps the sign the same way round.'
        write: 'Fraction $> 0$, so the sign stays $>$'
      - say: 'So, to get $r$ by itself, divide both sides by the fraction.'
        write: '$r > 1 \div \dfrac{bc + ac + ab}{abc}$'
      - say: 'Dividing by a fraction means multiplying by its flip. So 1 divided by the fraction is 1 times $abc$ over $bc$ plus $ac$ plus $ab$.'
        write: '$r > 1 \times \dfrac{abc}{bc + ac + ab}$'
      - say: 'So $r$ is greater than $abc$ over $bc$ plus $ac$ plus $ab$.'
        write: '$r > \dfrac{abc}{bc + ac + ab}$'
        point:
          - {figure: sketch, kind: circle, target: abc, text: 'top'}
          - {figure: sketch, kind: circle, target: 'ab + bc + ca', text: 'bottom'}
      - say: 'Let''s check with $a$, $b$ and $c$ all equal to 3. The original is $r$ over 3, three times, which adds up to $r$. So it says $r$ is greater than 1.'
        write: 'Check $a = b = c = 3$: $\dfrac{r}{3} + \dfrac{r}{3} + \dfrac{r}{3} = r > 1$'
      - say: 'Our formula gives 3 times 3 times 3, which is 27, over 9 plus 9 plus 9, which is 27. 27 over 27 is 1. It matches.'
        write: '$\dfrac{3 \times 3 \times 3}{9 + 9 + 9} = \dfrac{27}{27} = 1$'
      - say: 'So the range is $r$ greater than $abc$ over $bc$ plus $ac$ plus $ab$, which is answer choice A.'
        write: '$r > \dfrac{abc}{bc + ac + ab}$'
        answer: true
