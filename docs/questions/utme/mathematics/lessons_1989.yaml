        write: '$= \dfrac{x}{x + 1} - \dfrac{x + 1}{x + 1}$'
      - say: 'Now subtract the tops, keeping $x$ plus 1 in a bracket so the minus reaches both terms.'
        write: '$= \dfrac{x - (x + 1)}{x + 1}$'
      - say: 'Share out the minus: $x$ minus $x$ minus 1. The $x$ terms cancel, leaving negative 1.'
