      - say: 'Pythagoras: the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hypotenuse}^{2} = \text{opposite}^{2} + \text{adjacent}^{2}$'
      - say: 'First, the base. A diagonal cuts the square into two right-angled triangles, so by Pythagoras, the diagonal squared is 6 squared plus 6 squared.'
        write: '$\text{diagonal}^{2} = 6^{2} + 6^{2} = 36 + 36 = 72$'
        point:
          - {figure: 0, kind: highlight, target: XZ, text: 'diagonal'}
      - say: 'So the diagonal is root 72. 72 is 36 times 2, and the square root of 36 is 6, so that is 6 root 2.'
        write: '$\text{diagonal} = \sqrt{72} = \sqrt{36 \times 2} = 6\sqrt{2}$'
        point:
          - {figure: 0, kind: label, target: XZ, text: '6√2'}
      - say: '$T$ is the midpoint of the diagonal. So the distance from $T$ to a corner, $TX$, is half of 6 root 2, which is 3 root 2.'
        write: '$TX = \tfrac{1}{2} \times 6\sqrt{2} = 3\sqrt{2}$'
        point:
          - {figure: 0, kind: label, target: TX, text: '3√2'}
      - say: 'Now triangle $OTX$. It is right-angled at $T$, and its hypotenuse is the slanting edge $OX$. So Pythagoras gives this.'
        write: 'In $\triangle OTX$: $OX^{2} = OT^{2} + TX^{2}$'
        point:
          - {figure: 0, kind: arc, target: OTX, text: '90°'}
      - say: 'Rearrange for $OT$ squared: subtract $TX$ squared from both sides.'
        write: '$OT^{2} = OX^{2} - TX^{2}$'
      - say: 'Now substitute: $OX$ is 5, and $TX$ is the 3 root 2 we found.'
        write: '$= 5^{2} - (3\sqrt{2})^{2}$'
        point:
          - {line: 8, kind: move, from: {line: 0, at: '5'}, at: '[[5]]2', text: 'OX'}
          - {line: 8, kind: move, from: {line: 5, at: '= [[32]]'}, at: '(32)', text: 'TX'}
      - say: '5 squared is 25. And 3 root 2, squared, is 3 squared times root 2 squared, which is 9 times 2, or 18.'
        write: '$= 25 - 9 \times 2 = 25 - 18$'
      - say: '25 minus 18 is 7.'
        write: '$= 7$'
      - say: 'So $OT$ squared is 7, and $OT$ is the square root of 7.'
        write: '$OT = \sqrt{7}$'
        point:
          - {figure: 0, kind: label, target: OT, text: '√7'}
      - say: 'So the height is root 7 centimetres, which is answer choice D.'
        write: '$OT = \sqrt{7}\ \text{cm}$'
        answer: true
    traps:
      A: 'You went for 2 root 5, which is root 20. $OT$ squared is 25 minus $TX$ squared, and $TX$ is half the diagonal, 3 root 2, whose square is 18. So $OT$ squared is 7.'
      B: 'You went for 3 cm. That''s half the side of the base, not the height. The height comes from 5 squared minus 3 root 2 squared, which is 7.'
      C: 'You went for 4 cm. That uses half a side, 3, instead of half the diagonal: root of 25 minus 9 is 4. That''s the slant height of a face. The edge $OX$ runs to a corner, so use half the diagonal.'
  46:
    moments:
      - say: 'A cook used 75 g of rice, 40 g of margarine, 105 g of meat and 20 g of bread crumbs. We want the angle for meat on a pie chart.'
        write: 'Rice $75$ g, margarine $40$ g, meat $105$ g, crumbs $20$ g'
      - say: 'Let me draw the pie chart, so we can see the parts of the whole.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'meat 105 g'}
      - say: 'In a pie chart, each item gets the same fraction of 360 degrees as it is of the total. So first, find the total mass.'
        write: 'Total $= 75 + 40 + 105 + 20$'
      - say: '75 plus 40 is 115. 115 plus 105 is 220. 220 plus 20 is 240.'
        write: '$= 115 + 105 + 20 = 220 + 20 = 240$ g'
      - say: 'Meat is 105 grams out of that total of 240.'
        write: 'Meat fraction $= \dfrac{105}{240}$'
        point:
          - {line: 4, kind: move, from: {line: 0, at: '105'}, at: '105', text: 'meat'}
          - {line: 4, kind: move, from: {line: 3, at: '= 240'}, at: '240', text: 'total'}
      - say: 'Each sector angle is the item over the total, times 360 degrees.'
        write: 'Sector angle $= \dfrac{\text{item}}{\text{total}} \times 360^{\circ}$'
      - say: 'So its angle is 105 over 240, times 360 degrees.'
        write: 'Meat angle $= \dfrac{105}{240} \times 360^{\circ}$'
        point:
          - {figure: sketch, kind: circle, target: 'angle ?', text: '105/240 of 360°'}
      - say: 'Let''s do the 360 over 240 part first. Both divide by 120, giving 3 over 2, which is 1.5. So every gram is worth 1.5 degrees.'
        write: '$= 105 \times \dfrac{360}{240} = 105 \times \dfrac{3}{2} = 105 \times 1.5$'
      - say: '105 times 1.5 is 105 plus half of 105. Half of 105 is 52.5, so that makes 157.5.'
        write: '$= 105 + 52.5 = 157.5^{\circ}$'
        point:
          - {figure: sketch, kind: label, target: 'angle ?', text: '157.5°'}
      - say: 'Let''s check that all four sectors make a full turn. Rice is 75 times 1.5, which is 112.5. Margarine is 40 times 1.5, which is 60. Crumbs are 20 times 1.5, which is 30.'
        write: 'Check: $75 \times 1.5 = 112.5,\ 40 \times 1.5 = 60,\ 20 \times 1.5 = 30$'
        point:
          - {figure: sketch, kind: label, target: '75 g', text: '112.5°'}
          - {figure: sketch, kind: label, target: '40 g', text: '60°'}
          - {figure: sketch, kind: label, target: '20 g', text: '30°'}
      - say: '112.5 plus 60 plus 157.5 plus 30 is 360, a full turn.'
        write: '$112.5 + 60 + 157.5 + 30 = 360$'
      - say: 'So the meat sector is 157.5 degrees, which is answer choice D.'
        write: 'Meat sector $= 157.5^{\circ}$'
        answer: true
    traps:
      A: 'You went for 30 degrees. That''s the sector for bread crumbs, 20 times 1.5. Meat is 105 grams, so its angle is 105 times 1.5, which is 157.5.'
      B: 'You went for 60 degrees. That''s the margarine, 40 times 1.5. The question asks for the meat.'
      C: 'You went for 112.5 degrees. That''s the rice, 75 times 1.5. Meat is 105 grams, which gives 157.5.'
