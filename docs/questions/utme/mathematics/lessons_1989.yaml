  29:
    moments:
      - say: 'In a geometric progression of $n$ terms, the first two terms add to $x$ and the last two add to $y$. We want the common ratio.'
        write: '$n$ terms: first two add to $x$, last two add to $y$'
      - say: 'Let''s call the first term $a$ and the common ratio $r$. Each term is the one before times $r$, so the first two terms are $a$ and $ar$.'
        write: 'First two terms: $a,\ ar$'
      - say: 'They add to $x$. Take out the common factor $a$, which leaves 1 plus $r$.'
        write: '$x = a + ar = a(1 + r)$'
      - say: 'The nth term of a geometric progression is the first term times r to the power n minus 1.'
        write: 'GP: $T_{n} = ar^{n - 1}$'
      - say: 'In a geometric progression, the $n$th term is $a$ times $r$ to the power $n$ minus 1. So the last term is $ar$ to the $n$ minus 1, and the one before it is $ar$ to the $n$ minus 2.'
        write: 'Last two terms: $ar^{n-2},\ ar^{n-1}$'
      - say: 'They add to $y$.'
        write: '$y = ar^{n-2} + ar^{n-1}$'
      - say: 'Take out the common factor $ar$ to the $n$ minus 2. $ar$ to the $n$ minus 1, divided by that, is just $r$, so the bracket is 1 plus $r$.'
        write: '$= ar^{n-2}(1 + r)$'
      - say: 'Now divide $y$ by $x$, using the two lines we just found.'
        write: '$\dfrac{y}{x} = \dfrac{ar^{n-2}(1 + r)}{a(1 + r)}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: 'arn−2(1+r)'}, at: 'arn−2(1+r)', text: 'y'}
          - {line: 7, kind: move, from: {line: 2, at: '= [[a(1+r)]]'}, at: 'a(1+r)', text: 'x'}
      - say: 'The $a$ cancels, and the 1 plus $r$ cancels. That leaves $r$ to the power $n$ minus 2.'
        write: '$= r^{n-2}$'
      - say: 'To get $r$ by itself, take the $n$ minus 2 root of both sides, which is the power 1 over $n$ minus 2.'
        write: '$r = \left(\dfrac{y}{x}\right)^{\frac{1}{n - 2}}$'
      - say: 'Let''s check with 3, 6, 12, 24, where $n$ is 4 and $r$ is 2. $x$ is 3 plus 6, which is 9, and $y$ is 12 plus 24, which is 36.'
        write: 'Check: $x = 3 + 6 = 9,\ y = 12 + 24 = 36,\ n = 4$'
      - say: '36 over 9 is 4. The power is 1 over, 4 minus 2, which is a half, and 4 to the power a half is 2. That is the ratio.'
        write: '$\left(\dfrac{36}{9}\right)^{\frac{1}{4 - 2}} = 4^{\frac{1}{2}} = 2$'
      - say: 'So the common ratio is $y$ over $x$, to the power 1 over $n$ minus 2, which is answer choice D.'
        write: '$r = \left(\dfrac{y}{x}\right)^{\frac{1}{n - 2}}$'
        answer: true
    traps:
      A: 'You went for $x$ over $y$. It''s upside down and has no root. $y$ over $x$ is $r$ to the $n - 2$, so we take a root, and $y$ goes on top.'
      B: 'You went for $y$ over $x$. That''s $r$ to the power $n - 2$, not $r$ itself. Take the $n - 2$ root to finish.'
      C: 'You went for $x$ over $y$ to the power 1 over $n - 2$. The fraction is upside down. In our example, 9 over 36 to the half is a half, not 2.'
