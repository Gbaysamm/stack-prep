      - say: 'Now take the square root of both sides. The square root of 3 is root 3, and the square root of 4 is 2. A square root can be positive or negative.'
        write: '$\sin x = \pm\sqrt{\dfrac{3}{4}} = \pm\dfrac{\sqrt{3}}{2}$'
      - say: 'Between 0 and 90 degrees, sine is positive, so we keep the positive one.'
        write: '$\sin x = \dfrac{\sqrt{3}}{2}$'
      - say: 'Which special angle has sine equal to root 3 over 2? Picture the triangle with angles 30, 60 and 90 degrees. Its sides are 1, root 3 and 2, opposite those angles.'
        write: 'Special triangle: sides $1,\ \sqrt{3},\ 2$ opposite $30^{\circ},\ 60^{\circ},\ 90^{\circ}$'
      - say: 'Sine is opposite over hypotenuse. For 60 degrees, the opposite side is root 3 and the hypotenuse is 2, so sin 60 is root 3 over 2.'
        write: '$\sin 60^{\circ} = \dfrac{\text{opposite}}{\text{hypotenuse}} = \dfrac{\sqrt{3}}{2}$'
        point:
          - {line: 6, kind: arrow, from: {line: 4, at: '= 23'}, at: 'opposite = 23', text: 'same value'}
