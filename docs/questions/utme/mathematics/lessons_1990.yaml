  25:
    moments:
      - section: 'The question'
        say: 'Three fractions, and the last denominator is a difference of two squares. Factorise it, and the L.C.M. is staring at you.'
        write: '$\dfrac{x}{x + y} + \dfrac{y}{x - y} - \dfrac{x^{2}}{x^{2} - y^{2}}$'
      - section: 'Solution'
        say: 'We factorise every denominator first, find the L.C.M., then combine the numerators over it.'
        write: 'Solution'
      - say: '$x$ squared minus $y$ squared is a difference of two squares: $x$ plus $y$, times $x$ minus $y$.'
        write: '$x^{2} - y^{2} = (x + y)(x - y)$'
      - say: 'That product already contains the other two denominators, so it is the L.C.M.'
        write: 'L.C.M. $= (x + y)(x - y)$'
      - say: 'L.C.M. over $x$ plus $y$ is $x$ minus $y$, times $x$. L.C.M. over $x$ minus $y$ is $x$ plus $y$, times $y$. L.C.M. over itself is 1, times $x$ squared.'
        write: '$= \dfrac{x(x - y) + y(x + y) - x^{2}}{(x + y)(x - y)}$'
      - say: 'Open the brackets. $x$ times, $x$ minus $y$, is $x$ squared minus $xy$. $y$ times, $x$ plus $y$, is $xy$ plus $y$ squared.'
        write: '$= \dfrac{x^{2} - xy + xy + y^{2} - x^{2}}{(x + y)(x - y)}$'
      - say: 'Collect like terms. Minus $xy$ and plus $xy$ cancel. $x$ squared and minus $x$ squared cancel. Only $y$ squared is left.'
        write: '$= \dfrac{y^{2}}{(x + y)(x - y)}$'
      - say: 'Multiply the denominator back out, to match the options.'
        write: '$= \dfrac{y^{2}}{x^{2} - y^{2}}$'
      - section: 'Check'
        say: 'Take $x$ equals 3 and $y$ equals 2. The question gives 3 over 5, plus 2 over 1, minus 9 over 5.'
        write: '$x = 3,\ y = 2$: $\dfrac{3}{5} + \dfrac{2}{1} - \dfrac{9}{5} = \dfrac{4}{5}$'
      - say: '3 over 5 minus 9 over 5 is negative 6 over 5, and 2 minus 6 over 5 is 4 over 5. Our answer gives 4 over, 9 minus 4, which is also 4 over 5.'
        write: '$\dfrac{2^{2}}{3^{2} - 2^{2}} = \dfrac{4}{5}\ \checkmark$'
      - say: 'Therefore the expression is $y$ squared over, $x$ squared minus $y$ squared: option B.'
        write: '$\therefore \dfrac{y^{2}}{x^{2} - y^{2}}$ (B)'
        answer: true
    traps:
      A: 'You went for $\dfrac{x^{2}}{x^{2} - y^{2}}$. That is the last fraction alone, as if the other two cancelled. They add to $\dfrac{x^{2} + y^{2}}{x^{2} - y^{2}}$, and taking away $x^{2}$ leaves $y^{2}$.'
      C: 'You went for $\dfrac{x}{x^{2} - y^{2}}$. When you open the brackets in the numerator, the $x^{2}$ and $xy$ terms all cancel, and what is left is $y^{2}$, not $x$.'
      D: 'You went for $\dfrac{y}{x^{2} - y^{2}}$. Close, but the leftover term is $y$ times $y$, which is $y^{2}$. With $x = 3$ and $y = 2$, your option gives 2 over 5, not 4 over 5.'
  26:
    moments:
      - say: 'We''re given $x^{2} + y^{2} + z^{2} = 194$, with $x = 7$ and root $y$ equal to 3. Picture three squares with sides $x$, $y$ and $z$: their areas add to 194. We want $z$.'
        write: '$x^{2} + y^{2} + z^{2} = 194$'
        doodle: {name: 'custom:1990_q26_a', id: sqs, caption: 'three squares, areas add to 194'}
