# UTME 1990 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1990.yaml. Answers match that file.
format_version: 1
exam_year: 1990
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'Mixed numbers on top, the word "of" underneath. The numerator is a smaller number minus a bigger one, so watch the sign. Picture the numerator as a hop back along a number line.'
        doodle: {name: 'custom:1990_q01_a', id: hop, caption: 'the numerator: a hop back of 6¼'}
        write: 'Simplify $\dfrac{4\tfrac{3}{4} - 6\tfrac{1}{4}}{4\tfrac{1}{5} \text{ of } 1\tfrac{1}{4}}$'
      - say: 'By BODMAS, the "of" in the denominator is a multiplication, done before the final division. We change every mixed number to an improper fraction first.'
        write: 'Solution'
      - section: 'The numerator'
        say: '4 and three quarters: 4 times 4 is 16, plus 3 is 19, so 19 over 4. 6 and a quarter: 6 times 4 is 24, plus 1 is 25, so 25 over 4.'
        write: 'Numerator $= \dfrac{19}{4} - \dfrac{25}{4}$'
      - say: 'Same denominator, so subtract the numerators: 19 minus 25 is minus 6.'
        write: '$= -\dfrac{6}{4}$'
      - say: 'Divide the top and bottom by 2: minus 3 over 2. The hop lands one and a half below zero.'
        doodle_do: [{id: hop, op: label, part: land, text: '−3/2'}]
        write: '$= -\dfrac{3}{2}$'
        point:
          - {line: 4, kind: highlight, at: '−23', to: {doodle: hop, part: land}}
      - section: 'The denominator: O for of'
        say: '"Of" means multiply. 4 and a fifth is 21 over 5, because 4 times 5 is 20, plus 1. And 1 and a quarter is 5 over 4.'
        write: 'Denominator $= \dfrac{21}{5} \times \dfrac{5}{4}$'
      - say: 'Cancel first: the 5 on top cancels the 5 underneath, leaving 21 over 4.'
        write: '$= \dfrac{21}{4}$'
      - section: 'Divide'
        say: 'Now divide the numerator by the denominator: minus 3 over 2, divided by 21 over 4.'
        doodle_do: [{id: hop, op: pulse, part: land}]
        write: 'Expression $= -\dfrac{3}{2} \div \dfrac{21}{4}$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '= −23'}, at: '−23', text: 'numerator'}
          - {line: 7, kind: move, from: {line: 6, at: '= 421'}, at: '421', text: 'denominator'}
      - say: 'To divide by a fraction, multiply by its reciprocal: 21 over 4 becomes 4 over 21.'
        write: '$= -\dfrac{3}{2} \times \dfrac{4}{21}$'
      - say: 'Cancel first. 3 goes into 21 seven times, and 2 goes into 4 twice. That leaves minus 1 times 2, over 7.'
        write: '$\therefore$ Expression $= -\dfrac{2}{7}$'
      - section: 'Check'
        say: 'Check with decimals: minus 1.5 divided by 5.25 is about minus 0.286, and minus 2 over 7 is also about minus 0.286.'
        write: 'Check: $-1.5 \div 5.25 \approx -0.286 \approx -\tfrac{2}{7} \ \checkmark$'
      - section: 'Answer'
        say: 'So the value is minus 2 over 7, which is option B.'
        write: '$\therefore$ Answer $= -\dfrac{2}{7}$'
        answer: true
    traps:
      A: 'You went for minus 7 and 7 over 8. That is minus 3 over 2 times 21 over 4, which is minus 63 over 8. The fraction line means divide, so take the reciprocal of 21 over 4 first.'
      C: 'You went for minus 10 over 21. Check the denominator: 4 and a fifth of 1 and a quarter is 21 over 5 times 5 over 4, which is 21 over 4. Then minus 3 over 2 divided by 21 over 4 is minus 2 over 7.'
      D: 'You went for plus 10 over 21. The numerator is a smaller number minus a bigger one, so it is negative, and the whole answer must be negative.'
  2:
    moments:
      - section: 'The question'
        say: 'Two expressions, and we want the biggest thing that divides both. Picture each one as a bag of its factors. The H.C.F. is what the two bags share.'
        write: '$a^{2}bx + abx^{2}\quad\text{and}\quad a^{2}b - b^{3}$'
        doodle: {name: 'custom:1990_q02_a', id: bags, size: scene, caption: 'a bag of factors for each'}
      - section: 'Solution'
        say: 'We factorise each expression completely, list the factors, and pick out the ones common to both.'
        write: 'Solution'
      - say: 'In the first expression, both terms contain $a$, $b$ and $x$. Factorise out $abx$; what is left in the bracket is $a$ plus $x$.'
        write: '1st: $a^{2}bx + abx^{2} = abx(a + x)$'
      - say: 'In the second, both terms contain $b$. Factorise out $b$, and $a$ squared minus $b$ squared is left.'
        write: '2nd: $a^{2}b - b^{3} = b(a^{2} - b^{2})$'
      - say: '$a$ squared minus $b$ squared is a difference of two squares: $a$ minus $b$, times $a$ plus $b$.'
        write: '$= b(a - b)(a + b)$'
      - section: 'Compare'
        say: 'List the factors of the first: $a$, $b$, $x$ and the bracket $a$ plus $x$. Into the first bag they go.'
        write: 'Factors of 1st: $a,\ b,\ x,\ (a + x)$'
        doodle_do:
          - {id: bags, op: stage, stage: 'custom:1990_q02_a2'}
      - say: 'The factors of the second: $b$, $a$ minus $b$, and $a$ plus $b$. Into the second bag.'
        write: 'Factors of 2nd: $b,\ (a - b),\ (a + b)$'
        doodle_do:
          - {id: bags, op: stage, stage: 'custom:1990_q02_a3'}
      - say: 'Which factor is in both bags? Only $b$. Careful: $a$ plus $x$ is not the same as $a$ plus $b$.'
        write: 'Common factor: $b$ only'
        doodle_do:
          - {id: bags, op: circle, part: b1}
          - {id: bags, op: circle, part: b2}
        point:
          - {line: 7, kind: highlight, at: 'b only', to: {doodle: bags, part: b2}}
      - say: 'Therefore the H.C.F. is $b$.'
        write: '$\therefore$ H.C.F. $= b$'
      - section: 'Check'
        say: 'Divide each expression by $b$. The first leaves $ax$ times, $a$ plus $x$. The second leaves $a$ minus $b$, times $a$ plus $b$.'
        write: 'Left: $ax(a + x)$ and $(a - b)(a + b)$'
      - say: 'These two have no factor in common, so nothing bigger than $b$ divides both.'
        write: 'No common factor left $\checkmark$'
      - say: 'So the H.C.F. is $b$: option A.'
        write: '$\therefore$ H.C.F. $= b$ (A)'
        answer: true
    traps:
      B: 'You went for $a + b$. It divides the second expression, but the first has the bracket $a + x$, not $a + b$. Read each bracket letter by letter.'
      C: 'You went for $a(a + b)$. The second expression, $b(a - b)(a + b)$, has no factor $a$ on its own, and the first has no $a + b$. The only common factor is $b$.'
      D: 'You went for $abx(a^{2} - b^{2})$. That is bigger than either expression can share; it does not even divide the first one. A common factor must divide BOTH, and here only $b$ does.'
  3:
    moments:
      - section: 'The question'
        say: 'Two options use 2172 and two use 1448 or 14. The 1448 answers come from doubling 3 instead of squaring it. Let''s square properly and round once, at the end.'
        write: 'Correct $241.34 \times (3 \times 10^{-3})^{2}$ to 4 s.f.'
      - say: 'By BODMAS, the bracket and its power come first, then the multiplication, and the rounding last.'
        write: 'Solution'
      - section: 'The bracket'
        say: 'The laws of indices: a power of a product puts the power on each factor, and a power of a power multiplies the indices.'
        write: '$(ab)^{n} = a^{n}b^{n},\quad (a^{m})^{n} = a^{mn}$'
      - say: 'So the bracket squared is 3 squared times 10 to the minus 3, squared. 3 squared is 9, and minus 3 times 2 is minus 6.'
        write: '$(3 \times 10^{-3})^{2} = 3^{2} \times 10^{-6} = 9 \times 10^{-6}$'
      - section: 'Multiply'
        say: 'Now multiply 241.34 by 9. Leave out the point: 24,134 times 9 is 217,206.'
        write: '$\begin{array}{r} 24134 \\ \times\ \ \ \ 9 \\ \hline 217206 \end{array}$'
      - say: '241.34 has 2 decimal places, so the product has 2: 2,172.06.'
        write: '$241.34 \times 9 = 2172.06$'
      - say: 'So the value is 2,172.06 times 10 to the minus 6. Picture its digits in a row of boxes.'
        doodle: {name: 'custom:1990_q03_a', id: digits, size: scene, caption: '2172.06 × 10⁻⁶: the point hops'}
        write: 'Value $= 2172.06 \times 10^{-6}$'
      - say: 'Multiplying by 10 to the minus 6 moves the point 6 places to the left. Watch it hop past 2, 7, 1 and 2, then two more places, which fill with zeros.'
        doodle_do: [{id: digits, op: move, part: point, path: hop}, {id: digits, op: label, part: gaps, text: 'zeros fill the gaps'}]
        write: '$= 0.00217206$'
      - section: 'Round to 4 s.f.'
        say: 'Significant figures start at the first digit that is not zero, the 2. Count 2, 1, 7, 2 and cut. The next digit is 0, which is less than 5, so leave it.'
        doodle_do: [{id: digits, op: circle, part: sig}, {id: digits, op: cross, part: tail}]
        write: '$0.002172|06 \approx 0.002172$ (4 s.f.)'
        point:
          - {line: 8, kind: highlight, at: '≈ 0.002172', to: {doodle: digits, part: sig}}
      - say: 'Therefore, correct to 4 significant figures, the value is 0.002172.'
        write: '$\therefore 241.34 \times (3 \times 10^{-3})^{2} \approx 0.002172$'
      - section: 'Check'
        say: 'Check the size: 240 times 9 is 2,160, and times 10 to the minus 6 that is 0.00216. Our answer, 0.002172, is close.'
        write: 'Check: $240 \times 9 \times 10^{-6} = 0.00216 \approx 0.002172 \ \checkmark$'
      - section: 'Answer'
        say: 'So the answer is 0.002172, which is option D.'
        write: '$\therefore$ Answer $= 0.002172$ (4 s.f.)'
        answer: true
    traps:
      A: 'You went for 0.0014. That comes from doubling the 3 instead of squaring it, and then keeping only 2 significant figures. 3 squared is 9, and the question wants 4 figures.'
      B: 'You went for 0.001448. That is 241.34 times 6 times 10 to the minus 6: the 3 was doubled, not squared. 3 squared is 3 times 3, which is 9.'
      C: 'You went for 0.0022. That is the right number to only 2 significant figures. The question asks for 4: 2, 1, 7, 2.'
  4:
    moments:
      - section: 'The question'
        say: '₦100 in the bank for 5 years earns only ₦7.50 simple interest. That is very little, so the rate must be small. Picture the bank, with a space for each year''s interest.'
        doodle: {name: 'custom:1990_q04_a', id: bank, caption: '₦100 for 5 years earns ₦7.50'}
        write: '₦100 for 5 years gives simple interest ₦7.50. Rate $= ?$'
      - say: 'Write the givens first. P is 100, T is 5 years, I is 7.50, and R is what we want.'
        write: 'Solution: $P = 100,\ T = 5,\ I = 7.50,\ R = ?$'
      - section: 'The formula'
        say: 'Simple interest is the principal times the rate times the time, over 100.'
        write: '$I = \dfrac{PRT}{100}$'
      - say: 'Make R the subject: multiply both sides by 100, then divide both sides by P times T.'
        write: '$R = \dfrac{100I}{PT}$'
      - section: 'Substitute'
        say: 'Substitute: 100 times 7.50, over 100 times 5.'
        write: '$R = \dfrac{100 \times 7.50}{100 \times 5}$'
        point:
          - {line: 4, kind: move, from: {line: 1, at: 'I = 7.50'}, at: '7.50', text: 'I'}
      - say: 'Cancel first: the 100 on top cancels the 100 underneath. That leaves 7.50 over 5.'
        write: '$= \dfrac{7.50}{5}$'
      - say: '7.50 divided by 5 is 1.5. So the rate is 1.5 percent, which is 1 and a half percent per annum.'
        doodle_do: [{id: bank, op: label, part: rate, text: '1½% a year'}]
        write: '$\therefore R = 1.5\% = 1\tfrac{1}{2}\%$ per annum'
      - section: 'Check'
        say: 'Check with the formula. 1.5 percent of ₦100 is ₦1.50 in one year: the first coin.'
        doodle_do: [{id: bank, op: stage, stage: 'custom:1990_q04_a2'}, {id: bank, op: label, part: coin1, text: '₦1.50'}]
        write: 'Check: $I = \dfrac{100 \times 1.5 \times 1}{100} = $₦$1.50$ a year'
      - say: 'Over 5 years that is 1.50 times 5, which is ₦7.50: a coin in every space. It agrees.'
        doodle_do: [{id: bank, op: stage, stage: 'custom:1990_q04_a3'}]
        write: '$1.50 \times 5 = $₦$7.50 \ \checkmark$'
        point:
          - {line: 8, kind: highlight, at: '₦7.50', to: {doodle: bank, part: total}}
      - section: 'Answer'
        say: 'So the rate is 1 and a half percent per annum, which is option A.'
        write: '$\therefore$ Rate $= 1\tfrac{1}{2}\%$ per annum'
        answer: true
    traps:
      B: 'You went for 2 and a half percent. That would earn ₦2.50 a year, which is ₦12.50 over 5 years, not ₦7.50. R equals 100 I over P T gives 1.5 percent.'
      C: 'You went for 15 percent. That is ₦15 a year, far more than ₦7.50 in total. Check the division: 7.50 over 5 is 1.5, not 15.'
      D: 'You went for 25 percent. That would earn ₦25 every year. The whole 5 years earned only ₦7.50, so the yearly rate is small: 1.5 percent.'
  5:
    moments:
      - section: 'The question'
        say: 'Three children share a basket of mangoes. The words that matter are "of the remainder": the second child''s three quarters is not three quarters of the whole basket.'
        doodle: {name: 'custom:1990_q05_a', id: tray, size: scene, caption: '¼, then ¾ of the rest, then ?'}
        write: '1st: $\tfrac{1}{4}$; 2nd: $\tfrac{3}{4}$ of the remainder; 3rd: $?$'
      - say: 'We take the whole basket as 1, find what is left after each child, and use "of" to mean multiply.'
        write: 'Solution: let the whole basket $= 1$'
      - section: 'After the first child'
        say: 'The first child takes a quarter. The remainder is 1 minus a quarter, which is three quarters.'
        doodle_do: [{id: tray, op: stage, stage: 'custom:1990_q05_a2'}]
        write: 'Remainder $= 1 - \dfrac{1}{4} = \dfrac{3}{4}$'
      - section: 'The second child'
        say: 'The second child takes three quarters of that remainder. "Of" means multiply.'
        write: '2nd child $= \dfrac{3}{4} \text{ of } \dfrac{3}{4} = \dfrac{3}{4} \times \dfrac{3}{4}$'
      - say: '3 times 3 is 9, and 4 times 4 is 16. So the second child takes 9 over 16 of the basket: 9 of the 16 squares.'
        doodle_do: [{id: tray, op: stage, stage: 'custom:1990_q05_a3'}]
        write: '$= \dfrac{9}{16}$'
        point:
          - {line: 4, kind: highlight, at: '169', to: {doodle: tray, part: second}}
      - section: 'The third child'
        say: 'The third child takes what is left: the remainder, three quarters, minus the second child''s 9 over 16.'
        write: '3rd child $= \dfrac{3}{4} - \dfrac{9}{16}$'
      - say: 'The L.C.M. of 4 and 16 is 16. 16 divided by 4 is 4, times 3 is 12. So it is 12 minus 9, over 16.'
        write: '$= \dfrac{12 - 9}{16}$ (L.C.M. $= 16$)'
      - say: '12 minus 9 is 3. So the third child gets 3 over 16: the last 3 squares on the tray.'
        doodle_do: [{id: tray, op: circle, part: third}, {id: tray, op: label, part: c3, text: '3/16'}]
        write: '$\therefore$ 3rd child $= \dfrac{3}{16}$'
        point:
          - {line: 7, kind: highlight, at: '163', to: {doodle: tray, part: third}}
      - section: 'Check'
        say: 'Check: the three shares must make the whole basket. A quarter is 4 over 16. 4 plus 9 plus 3 is 16, so 16 over 16, which is 1.'
        write: 'Check: $\dfrac{4}{16} + \dfrac{9}{16} + \dfrac{3}{16} = \dfrac{16}{16} = 1 \ \checkmark$'
      - section: 'Answer'
        say: 'So the third child took 3 over 16 of the mangoes, which is option A.'
        write: '$\therefore$ 3rd child $= \dfrac{3}{16}$'
        answer: true
    traps:
      B: 'You went for 7 over 16. That is 1 minus 9 over 16, which forgets the first child''s quarter. The remainder is three quarters, and three quarters minus 9 over 16 is 3 over 16.'
      C: 'You went for 9 over 16. That is the second child''s share, found on the way. The question asks about the third child.'
      D: 'You went for 13 over 16. That is what the first two children took together, 4 over 16 plus 9 over 16. The third child gets what is left: 3 over 16.'
  6:
    moments:
      - say: 'We need to simplify 0.00275 times 0.00640, over 0.025 times 0.08, and write it in standard form.'
        write: '$\dfrac{0.00275 \times 0.00640}{0.025 \times 0.08}$'
      - say: 'The plan: write each decimal in standard form, then sort the ordinary numbers and the powers of ten into two trays, and handle each tray separately.'
        write: 'Plan: standard form, then numbers and powers separately'
        doodle: {name: 'custom:1990_q06_a', id: trays, caption: 'numbers in one tray, tens in another'}
      - say: 'For 0.00275, the decimal point moves 3 places right to give 2.75. So it is 2.75 times 10 to the negative 3.'
        write: '$0.00275 = 2.75 \times 10^{-3}$'
      - say: 'In the same way, 0.00640 is 6.4 times 10 to the negative 3.'
        write: '$0.00640 = 6.4 \times 10^{-3}$'
      - say: '0.025 moves 2 places to give 2.5, so it is 2.5 times 10 to the negative 2.'
        write: '$0.025 = 2.5 \times 10^{-2}$'
      - say: 'And 0.08 is 8 times 10 to the negative 2.'
        write: '$0.08 = 8 \times 10^{-2}$'
      - say: 'Now the top. 2.75 times 6.4 in two pieces: 2.75 times 6 is 16.5, and 2.75 times 0.4 is 1.1. Together that is 17.6.'
        write: 'Top numbers: $2.75 \times 6.4 = 16.5 + 1.1 = 17.6$'
      - say: 'Multiplying powers of the same base: add the indices.'
        write: 'Law of indices: $a^{m} \times a^{n} = a^{m + n}$'
      - say: 'Multiplying powers of ten adds the indices: negative 3 plus negative 3 is negative 6.'
        write: 'Top powers: $10^{-3} \times 10^{-3} = 10^{-3 + (-3)} = 10^{-6}$'
      - say: 'Now the bottom. 2.5 times 8 is 20, and negative 2 plus negative 2 is negative 4.'
        write: 'Bottom: $2.5 \times 8 = 20,\quad 10^{-2} \times 10^{-2} = 10^{-4}$'
      - say: 'So the whole fraction is 17.6 times 10 to the negative 6, over 20 times 10 to the negative 4.'
        write: 'So the fraction $= \dfrac{17.6 \times 10^{-6}}{20 \times 10^{-4}}$'
        point:
          - {line: 10, kind: move, from: {line: 6, at: '= 17.6'}, at: '17.6', text: 'top'}
          - {line: 10, kind: move, from: {line: 9, at: '= 20'}, at: '20', text: 'bottom'}
      - say: 'Divide the numbers first, the first tray. 17.6 divided by 20 is 0.88.'
        write: 'Numbers: $\dfrac{17.6}{20} = 0.88$'
        doodle_do:
          - {id: trays, op: label, part: nums, text: '0.88'}
      - say: 'Dividing powers of the same base: subtract the indices.'
        write: 'Law of indices: $a^{m} \div a^{n} = a^{m - n}$'
      - say: 'Now the second tray. To divide powers of ten, subtract the indices. Negative 6 minus negative 4 is negative 2.'
        write: 'Powers: $\dfrac{10^{-6}}{10^{-4}} = 10^{-6 - (-4)} = 10^{-2}$'
        doodle_do:
          - {id: trays, op: label, part: pows, text: '10⁻²'}
      - say: 'Put the two results back together: 0.88 times 10 to the negative 2.'
        write: 'Fraction $= 0.88 \times 10^{-2}$'
        point:
          - {line: 14, kind: move, from: {line: 11, at: '= 0.88'}, at: '0.88', text: 'numbers'}
          - {line: 14, kind: move, from: {line: 13, at: '= 10−2'}, at: '10−2', text: 'powers'}
      - say: 'Standard form needs a number from 1 to 10 in front. 0.88 is 8.8 times 10 to the negative 1.'
        write: '$= 8.8 \times 10^{-1} \times 10^{-2}$'
      - say: 'Negative 1 plus negative 2 is negative 3. So the answer, the two trays joined, is 8.8 times 10 to the negative 3, which is answer choice C.'
        write: '$= 8.8 \times 10^{-3}$'
        doodle_do:
          - {id: trays, op: label, part: result, text: '8.8 × 10⁻³'}
        answer: true
    traps:
      A: 'You went for 8.8 times 10 to the negative 1. That''s off by a factor of 100: the powers of ten were lost along the way. Keep them in their own column: 10 to the negative 6 over 10 to the negative 4 is 10 to the negative 2.'
      B: 'You went for 8.8 times 10 to the 2. That''s a big number, but a tiny number over a small number here gives about 0.0088. The power must be negative.'
      D: 'You went for 8.8 times 10 to the 3. The sign of the power has flipped. The answer is 0.0088, which is 8.8 times 10 to the negative 3.'
  7:
    moments:
      - section: 'The question'
        say: 'Three brothers share a profit. The first gets a third, the second two thirds of the remainder, and the third the last ₦12,000. Picture the profit as one long bar.'
        doodle: {name: 'custom:1990_q07_a', id: bar, size: scene, caption: 'the third brother gets ₦12,000'}
        write: '1st: $\tfrac{1}{3}$; 2nd: $\tfrac{2}{3}$ of the remainder; 3rd: ₦12,000. Profit $= ?$'
      - say: 'We name the profit, write each share in terms of it, and form an equation from the third share.'
        write: 'Solution'
      - say: 'Let the total profit be x naira.'
        write: 'Let the profit be ₦$x$'
      - section: 'Each share'
        say: 'The first brother gets a third of x. The remainder is x minus x over 3, which is 2x over 3.'
        doodle_do: [{id: bar, op: stage, stage: 'custom:1990_q07_a2'}]
        write: '1st $= \dfrac{x}{3}$; remainder $= x - \dfrac{x}{3} = \dfrac{2x}{3}$'
      - say: 'The second gets two thirds of that remainder. "Of" means multiply: 2 over 3 times 2x over 3 is 4x over 9.'
        doodle_do: [{id: bar, op: stage, stage: 'custom:1990_q07_a3'}]
        write: '2nd $= \dfrac{2}{3} \times \dfrac{2x}{3} = \dfrac{4x}{9}$'
      - say: 'The third gets the rest of the remainder: 2x over 3 minus 4x over 9.'
        write: '3rd $= \dfrac{2x}{3} - \dfrac{4x}{9}$'
      - say: 'The L.C.M. of 3 and 9 is 9, and 2x over 3 is 6x over 9. 6x minus 4x is 2x. So the third brother gets 2x over 9: the last 2 pieces.'
        doodle_do: [{id: bar, op: circle, part: third}, {id: bar, op: label, part: third, text: '2/9'}]
        write: '$= \dfrac{6x - 4x}{9} = \dfrac{2x}{9}$'
      - section: 'Form the equation'
        say: 'The third brother received ₦12,000. So 2x over 9 equals 12,000.'
        write: '$\dfrac{2x}{9} = 12000$'
        point:
          - {line: 7, kind: highlight, at: '12000', to: {doodle: bar, part: s3}}
      - say: 'Multiply both sides by 9 over 2. 12,000 divided by 2 is 6,000, and 6,000 times 9 is 54,000: the whole bar.'
        doodle_do: [{id: bar, op: label, part: whole, text: '₦54,000'}]
        write: '$\therefore x = 12000 \times \dfrac{9}{2} = 54000$'
      - section: 'Check'
        say: 'Check. A third of 54,000 is 18,000, leaving 36,000. Two thirds of 36,000 is 24,000.'
        write: 'Check: 1st $= 18000$; 2nd $= \tfrac{2}{3} \times 36000 = 24000$'
      - say: 'And 54,000 minus 18,000 minus 24,000 is 12,000 for the third brother, as the question says.'
        write: '3rd $= 54000 - 18000 - 24000 = 12000 \ \checkmark$'
      - section: 'Answer'
        say: 'So the profit they shared was ₦54,000, which is option B.'
        write: '$\therefore$ Profit $=$ ₦54,000.00'
        answer: true
    traps:
      A: 'You went for ₦60,000. That treats ₦12,000 as a fifth of the profit. The third brother''s share is 2x over 9, so the profit is 12,000 times 9 over 2, which is ₦54,000.'
      C: 'You went for ₦48,000. That treats ₦12,000 as a quarter of the profit. The third share is 2x over 9, not x over 4.'
