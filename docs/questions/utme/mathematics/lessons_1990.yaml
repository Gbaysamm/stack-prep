# UTME 1990 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1990.yaml. Answers match that file.
format_version: 1
exam_year: 1990
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'There are mixed numbers on top and the word "of" underneath. The numerator is a smaller number minus a bigger one, so watch the sign. Picture the numerator as a hop back along a number line.'
        doodle: {name: 'custom:1990_q01_a', id: hop, caption: 'the numerator: a hop back of 6¼'}
        write: 'Simplify $\dfrac{4\tfrac{3}{4} - 6\tfrac{1}{4}}{4\tfrac{1}{5} \text{ of } 1\tfrac{1}{4}}$'
      - say: 'By BODMAS, the "of" in the denominator is a multiplication, done before the final division. We change every mixed number to an improper fraction first.'
        write: 'Solution'
      - section: 'The numerator'
        say: 'For 4 and three quarters, 4 times 4 is 16, plus 3 is 19, so 19 over 4. For 6 and a quarter, 6 times 4 is 24, plus 1 is 25, so 25 over 4.'
        write: 'Numerator $= \dfrac{19}{4} - \dfrac{25}{4}$'
      - say: 'Same denominator, so subtract the numerators, and 19 minus 25 is minus 6.'
        write: '$= -\dfrac{6}{4}$'
      - say: 'Divide the top and bottom by 2 to get minus 3 over 2. The hop lands one and a half below zero.'
        doodle_do: [{id: hop, op: label, part: land, text: '−3/2'}]
        write: '$= -\dfrac{3}{2}$'
        point:
          - {line: 4, kind: highlight, at: '−23', to: {doodle: hop, part: land}}
      - section: 'The denominator: O for of'
        say: '"Of" means multiply. 4 and a fifth is 21 over 5, because 4 times 5 is 20, plus 1. And 1 and a quarter is 5 over 4.'
        write: 'Denominator $= \dfrac{21}{5} \times \dfrac{5}{4}$'
      - say: 'Cancel first. The 5 on top cancels the 5 underneath, leaving 21 over 4.'
        write: '$= \dfrac{21}{4}$'
      - section: 'Divide'
        say: 'Now divide the numerator by the denominator, so minus 3 over 2, divided by 21 over 4.'
        doodle_do: [{id: hop, op: pulse, part: land}]
        write: 'Expression $= -\dfrac{3}{2} \div \dfrac{21}{4}$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '= −23'}, at: '−23', text: 'numerator'}
          - {line: 7, kind: move, from: {line: 6, at: '= 421'}, at: '421', text: 'denominator'}
      - say: 'To divide by a fraction, multiply by its reciprocal, so 21 over 4 becomes 4 over 21.'
        write: '$= -\dfrac{3}{2} \times \dfrac{4}{21}$'
      - say: 'Cancel first. 3 goes into 21 seven times, and 2 goes into 4 twice. That leaves minus 1 times 2, over 7.'
        write: '$\therefore$ Expression $= -\dfrac{2}{7}$'
      - section: 'Check'
        say: 'Check with decimals. Minus 1.5 divided by 5.25 is about minus 0.286, and minus 2 over 7 is also about minus 0.286.'
        write: 'Check: $-1.5 \div 5.25 \approx -0.286 \approx -\tfrac{2}{7} \ \checkmark$'
      - section: 'Answer'
        say: 'So the value is minus 2 over 7, which is option B.'
        write: '$\therefore$ Answer $= -\dfrac{2}{7}$'
        answer: true
    traps:
      A: 'You went for minus 7 and 7 over 8. That is minus 3 over 2 times 21 over 4, which is minus 63 over 8. The fraction line means divide, so take the reciprocal of 21 over 4 first.'
      C: 'You went for minus 10 over 21. Check the denominator. 4 and a fifth of 1 and a quarter is 21 over 5 times 5 over 4, which is 21 over 4. Then minus 3 over 2 divided by 21 over 4 is minus 2 over 7.'
      D: 'You went for plus 10 over 21. The numerator is a smaller number minus a bigger one, so it is negative, and the whole answer must be negative.'
  2:
    moments:
      - section: 'The question'
        say: 'We have two expressions, and we want the biggest thing that divides both. Picture each one as a bag of its factors. The H.C.F. is what the two bags share.'
        write: '$a^{2}bx + abx^{2}\quad\text{and}\quad a^{2}b - b^{3}$'
        doodle: {name: 'custom:1990_q02_a', id: bags, size: scene, caption: 'a bag of factors for each'}
      - section: 'Solution'
        say: 'We factorise each expression completely, list the factors, and pick out the ones common to both.'
        write: 'Solution'
      - say: 'In the first expression, both terms contain $a$, $b$ and $x$. Factorise out $abx$, and what is left in the bracket is $a$ plus $x$.'
        write: '1st: $a^{2}bx + abx^{2} = abx(a + x)$'
      - say: 'In the second, both terms contain $b$. Factorise out $b$, and $a$ squared minus $b$ squared is left.'
        write: '2nd: $a^{2}b - b^{3} = b(a^{2} - b^{2})$'
      - say: '$a$ squared minus $b$ squared is a difference of two squares, which is $a$ minus $b$, times $a$ plus $b$.'
        write: '$= b(a - b)(a + b)$'
      - section: 'Compare'
        say: 'List the factors of the first, which are $a$, $b$, $x$ and the bracket $a$ plus $x$. Into the first bag they go.'
        write: 'Factors of 1st: $a,\ b,\ x,\ (a + x)$'
        doodle_do:
          - {id: bags, op: stage, stage: 'custom:1990_q02_a2'}
      - say: 'The factors of the second are $b$, $a$ minus $b$, and $a$ plus $b$. Into the second bag.'
        write: 'Factors of 2nd: $b,\ (a - b),\ (a + b)$'
        doodle_do:
          - {id: bags, op: stage, stage: 'custom:1990_q02_a3'}
      - say: 'Which factor is in both bags? Only $b$. Be careful, because $a$ plus $x$ is not the same as $a$ plus $b$.'
        write: 'Common factor: $b$ only'
        doodle_do:
          - {id: bags, op: circle, part: b1}
          - {id: bags, op: circle, part: b2}
        point:
          - {line: 7, kind: highlight, at: 'b only', to: {doodle: bags, part: b2}}
      - say: 'Therefore the H.C.F. is $b$.'
        write: '$\therefore$ H.C.F. $= b$'
      - section: 'Check'
        say: 'Divide each expression by $b$. The first leaves $ax$ times, $a$ plus $x$. The second leaves $a$ minus $b$, times $a$ plus $b$.'
        write: 'Left: $ax(a + x)$ and $(a - b)(a + b)$'
      - say: 'These two have no factor in common, so nothing bigger than $b$ divides both.'
        write: 'No common factor left $\checkmark$'
      - say: 'So the H.C.F. is $b$, which is option A.'
        write: '$\therefore$ H.C.F. $= b$ (A)'
        answer: true
    traps:
      B: 'You went for $a + b$. It divides the second expression, but the first has the bracket $a + x$, not $a + b$. Read each bracket letter by letter.'
      C: 'You went for $a(a + b)$. The second expression, $b(a - b)(a + b)$, has no factor $a$ on its own, and the first has no $a + b$. The only common factor is $b$.'
      D: 'You went for $abx(a^{2} - b^{2})$. That is bigger than either expression can share, and it does not even divide the first one. A common factor must divide BOTH, and here only $b$ does.'
  3:
    moments:
      - section: 'The question'
        say: 'Two options use 2172 and two use 1448 or 14. The 1448 answers come from doubling 3 instead of squaring it. Let''s square properly and round once, at the end.'
        write: 'Correct $241.34 \times (3 \times 10^{-3})^{2}$ to 4 s.f.'
      - say: 'By BODMAS, the bracket and its power come first, then the multiplication, and the rounding last.'
        write: 'Solution'
      - section: 'The bracket'
        say: 'Recall the laws of indices. A power of a product puts the power on each factor, and a power of a power multiplies the indices.'
        write: '$(ab)^{n} = a^{n}b^{n},\quad (a^{m})^{n} = a^{mn}$'
      - say: 'So the bracket squared is 3 squared times 10 to the minus 3, squared. 3 squared is 9, and minus 3 times 2 is minus 6.'
        write: '$(3 \times 10^{-3})^{2} = 3^{2} \times 10^{-6} = 9 \times 10^{-6}$'
      - section: 'Multiply'
        say: 'Now multiply 241.34 by 9. Leave out the point, and 24,134 times 9 is 217,206.'
        write: '$\begin{array}{r} 24134 \\ \times\ \ \ \ 9 \\ \hline 217206 \end{array}$'
      - say: '241.34 has 2 decimal places, so the product has 2, giving 2,172.06.'
        write: '$241.34 \times 9 = 2172.06$'
      - say: 'So the value is 2,172.06 times 10 to the minus 6.'
        write: 'Value $= 2172.06 \times 10^{-6}$'
      - say: 'Multiplying by 10 to the minus 6 moves the point 6 places to the left. It moves past 2, 7, 1 and 2, then two more places, which fill with zeros.'
        write: '$= 0.00217206$'
      - section: 'Round to 4 s.f.'
        say: 'Significant figures start at the first digit that is not zero, the 2. Count 2, 1, 7, 2 and cut. The next digit is 0, which is less than 5, so leave it.'
        write: '$0.002172|06 \approx 0.002172$ (4 s.f.)'
        point:
          - {line: 8, kind: highlight, at: '≈ 0.002172'}
      - say: 'Therefore, correct to 4 significant figures, the value is 0.002172.'
        write: '$\therefore 241.34 \times (3 \times 10^{-3})^{2} \approx 0.002172$'
      - section: 'Check'
        say: 'Check the size. 240 times 9 is 2,160, and times 10 to the minus 6 that is 0.00216. Our answer, 0.002172, is close.'
        write: 'Check: $240 \times 9 \times 10^{-6} = 0.00216 \approx 0.002172 \ \checkmark$'
      - section: 'Answer'
        say: 'So the answer is 0.002172, which is option D.'
        write: '$\therefore$ Answer $= 0.002172$ (4 s.f.)'
        answer: true
    traps:
      A: 'You went for 0.0014. That comes from doubling the 3 instead of squaring it, and then keeping only 2 significant figures. 3 squared is 9, and the question wants 4 figures.'
      B: 'You went for 0.001448. That is 241.34 times 6 times 10 to the minus 6, so the 3 was doubled, not squared. 3 squared is 3 times 3, which is 9.'
      C: 'You went for 0.0022. That is the right number to only 2 significant figures. The question asks for 4, which are 2, 1, 7 and 2.'
  4:
    moments:
      - section: 'The question'
        say: '₦100 in the bank for 5 years earns only ₦7.50 simple interest. That is very little, so the rate must be small. Picture the bank, with a space for each year''s interest.'
        doodle: {name: 'custom:1990_q04_a', id: bank, caption: '₦100 for 5 years earns ₦7.50'}
        write: '₦100 for 5 years gives simple interest ₦7.50. Rate $= ?$'
      - say: 'Write the givens first. P is 100, T is 5 years, I is 7.50, and R is what we want.'
        write: 'Solution: $P = 100,\ T = 5,\ I = 7.50,\ R = ?$'
      - section: 'The formula'
        say: 'Simple interest is the principal times the rate times the time, over 100.'
        write: '$I = \dfrac{PRT}{100}$'
      - say: 'Make R the subject. Multiply both sides by 100, then divide both sides by P times T.'
        write: '$R = \dfrac{100I}{PT}$'
      - section: 'Substitute'
        say: 'Substitute, and we get 100 times 7.50, over 100 times 5.'
        write: '$R = \dfrac{100 \times 7.50}{100 \times 5}$'
        point:
          - {line: 4, kind: move, from: {line: 1, at: 'I = 7.50'}, at: '7.50', text: 'I'}
      - say: 'Cancel first, so the 100 on top cancels the 100 underneath. That leaves 7.50 over 5.'
        write: '$= \dfrac{7.50}{5}$'
      - say: '7.50 divided by 5 is 1.5. So the rate is 1.5 percent, which is 1 and a half percent per annum.'
        doodle_do: [{id: bank, op: label, part: rate, text: '1½% a year'}]
        write: '$\therefore R = 1.5\% = 1\tfrac{1}{2}\%$ per annum'
      - section: 'Check'
        say: 'Check with the formula. 1.5 percent of ₦100 is ₦1.50 in one year, which is the first coin.'
        doodle_do: [{id: bank, op: stage, stage: 'custom:1990_q04_a2'}, {id: bank, op: label, part: coin1, text: '₦1.50'}]
        write: 'Check: $I = \dfrac{100 \times 1.5 \times 1}{100} = $₦$1.50$ a year'
      - say: 'Over 5 years that is 1.50 times 5, which is ₦7.50, a coin in every space. It agrees.'
        doodle_do: [{id: bank, op: stage, stage: 'custom:1990_q04_a3'}]
        write: '$1.50 \times 5 = $₦$7.50 \ \checkmark$'
        point:
          - {line: 8, kind: highlight, at: '₦7.50', to: {doodle: bank, part: total}}
      - section: 'Answer'
        say: 'So the rate is 1 and a half percent per annum, which is option A.'
        write: '$\therefore$ Rate $= 1\tfrac{1}{2}\%$ per annum'
        answer: true
    traps:
      B: 'You went for 2 and a half percent. That would earn ₦2.50 a year, which is ₦12.50 over 5 years, not ₦7.50. R equals 100 I over P T gives 1.5 percent.'
      C: 'You went for 15 percent. That is ₦15 a year, far more than ₦7.50 in total. Check the division. 7.50 over 5 is 1.5, not 15.'
      D: 'You went for 25 percent. That would earn ₦25 every year. The whole 5 years earned only ₦7.50, so the yearly rate is small, only 1.5 percent.'
  5:
    moments:
      - section: 'The question'
        say: 'Three children share a basket of mangoes. The words that matter are "of the remainder", because the second child''s three quarters is not three quarters of the whole basket.'
        doodle: {name: 'custom:1990_q05_a', id: tray, size: scene, caption: '¼, then ¾ of the rest, then ?'}
        write: '1st: $\tfrac{1}{4}$; 2nd: $\tfrac{3}{4}$ of the remainder; 3rd: $?$'
      - say: 'We take the whole basket as 1, find what is left after each child, and use "of" to mean multiply.'
        write: 'Solution: let the whole basket $= 1$'
      - section: 'After the first child'
        say: 'The first child takes a quarter. The remainder is 1 minus a quarter, which is three quarters.'
        doodle_do: [{id: tray, op: stage, stage: 'custom:1990_q05_a2'}]
        write: 'Remainder $= 1 - \dfrac{1}{4} = \dfrac{3}{4}$'
      - section: 'The second child'
        say: 'The second child takes three quarters of that remainder. "Of" means multiply.'
        write: '2nd child $= \dfrac{3}{4} \text{ of } \dfrac{3}{4} = \dfrac{3}{4} \times \dfrac{3}{4}$'
      - say: '3 times 3 is 9, and 4 times 4 is 16. So the second child takes 9 over 16 of the basket, which is 9 of the 16 squares.'
        doodle_do: [{id: tray, op: stage, stage: 'custom:1990_q05_a3'}]
        write: '$= \dfrac{9}{16}$'
        point:
          - {line: 4, kind: highlight, at: '169', to: {doodle: tray, part: second}}
      - section: 'The third child'
        say: 'The third child takes what is left, which is the remainder, three quarters, minus the second child''s 9 over 16.'
        write: '3rd child $= \dfrac{3}{4} - \dfrac{9}{16}$'
      - say: 'The L.C.M. of 4 and 16 is 16. 16 divided by 4 is 4, times 3 is 12. So it is 12 minus 9, over 16.'
        write: '$= \dfrac{12 - 9}{16}$ (L.C.M. $= 16$)'
      - say: '12 minus 9 is 3. So the third child gets 3 over 16, the last 3 squares on the tray.'
        doodle_do: [{id: tray, op: circle, part: third}, {id: tray, op: label, part: c3, text: '3/16'}]
        write: '$\therefore$ 3rd child $= \dfrac{3}{16}$'
        point:
          - {line: 7, kind: highlight, at: '163', to: {doodle: tray, part: third}}
      - section: 'Check'
        say: 'To check, the three shares must make the whole basket. A quarter is 4 over 16. 4 plus 9 plus 3 is 16, so 16 over 16, which is 1.'
        write: 'Check: $\dfrac{4}{16} + \dfrac{9}{16} + \dfrac{3}{16} = \dfrac{16}{16} = 1 \ \checkmark$'
      - section: 'Answer'
        say: 'So the third child took 3 over 16 of the mangoes, which is option A.'
        write: '$\therefore$ 3rd child $= \dfrac{3}{16}$'
        answer: true
    traps:
      B: 'You went for 7 over 16. That is 1 minus 9 over 16, which forgets the first child''s quarter. The remainder is three quarters, and three quarters minus 9 over 16 is 3 over 16.'
      C: 'You went for 9 over 16. That is the second child''s share, found on the way. The question asks about the third child.'
      D: 'You went for 13 over 16. That is what the first two children took together, 4 over 16 plus 9 over 16. The third child gets what is left, which is 3 over 16.'
  6:
    moments:
      - section: 'The question'
        say: 'We have four small decimals, and the answer must be in standard form. The danger is losing count of the zeros. Writing each number in standard form first keeps them safe.'
        write: 'Simplify and express in standard form $\dfrac{0.00275 \times 0.00640}{0.025 \times 0.08}$'
      - say: 'Solution. First, recall what standard form means.'
        write: 'Solution'
      - section: 'Standard form'
        say: 'Standard form is $A$ times 10 to the power $n$, where $A$ is at least 1 and less than 10. Count how many places the point moves. Moving it to the right gives a negative index.'
        write: 'Standard form: $A \times 10^{n}$, where $1 \le A < 10$'
      - say: 'For 0.00275, the point moves 3 places to the right to give 2.75. So it is 2.75 times 10 to the power negative 3.'
        write: '$0.00275 = 2.75 \times 10^{-3}$'
      - say: 'For 0.00640, the point also moves 3 places, to give 6.4. So it is 6.4 times 10 to the power negative 3.'
        write: '$0.00640 = 6.4 \times 10^{-3}$'
      - say: 'For 0.025, the point moves 2 places to give 2.5. So it is 2.5 times 10 to the power negative 2.'
        write: '$0.025 = 2.5 \times 10^{-2}$'
      - say: 'And for 0.08, the point moves 2 places to give 8. So it is 8 times 10 to the power negative 2.'
        write: '$0.08 = 8 \times 10^{-2}$'
      - section: 'Substitute'
        say: 'Substitute, and put the numbers in one fraction and the powers of 10 in another. Multiplication can be done in any order, so this is allowed.'
        write: 'Expression $= \dfrac{2.75 \times 6.4}{2.5 \times 8} \times \dfrac{10^{-3} \times 10^{-3}}{10^{-2} \times 10^{-2}}$'
      - section: 'The numbers'
        say: 'The numbers first. Pair 2.75 with 2.5, and 6.4 with 8, because each pair divides neatly.'
        write: '$\dfrac{2.75 \times 6.4}{2.5 \times 8} = \dfrac{2.75}{2.5} \times \dfrac{6.4}{8}$'
      - say: '2.75 divided by 2.5 is 1.1, and 6.4 divided by 8 is 0.8.'
        write: '$= 1.1 \times 0.8$'
      - say: '11 times 8 is 88, and there are two decimal places, so 1.1 times 0.8 is 0.88.'
        write: '$= 0.88$'
      - section: 'The powers of 10'
        say: 'Now the powers of 10. Here is the law of indices for multiplying. When we multiply powers of the same base, we add the indices.'
        write: 'Law of indices: $a^{m} \times a^{n} = a^{m + n}$'
      - say: 'On top, negative 3 plus negative 3 is negative 6. Underneath, negative 2 plus negative 2 is negative 4.'
        write: '$\dfrac{10^{-3} \times 10^{-3}}{10^{-2} \times 10^{-2}} = \dfrac{10^{-6}}{10^{-4}}$'
      - say: 'The law of indices for dividing says that when we divide powers of the same base, we subtract the indices.'
        write: 'Law of indices: $a^{m} \div a^{n} = a^{m - n}$'
      - say: 'So the index is negative 6 minus negative 4. Minus a negative is plus, so that is negative 6 plus 4, which is negative 2.'
        write: '$= 10^{-6 - (-4)} = 10^{-2}$'
      - section: 'Join them'
        say: 'Now join the two results to get 0.88 times 10 to the power negative 2.'
        write: '$\therefore$ Expression $= 0.88 \times 10^{-2}$'
      - say: 'But 0.88 is less than 1, so this is not yet standard form. The point moves 1 place to the right, so 0.88 is 8.8 times 10 to the power negative 1.'
        write: '$= 8.8 \times 10^{-1} \times 10^{-2}$'
      - say: 'Add the indices again, and negative 1 plus negative 2 is negative 3.'
        write: '$= 8.8 \times 10^{-1 + (-2)} = 8.8 \times 10^{-3}$'
      - section: 'Check'
        say: 'To check, 8.8 times 10 to the power negative 3 is 0.0088. The bottom, 0.025 times 0.08, is 0.002. And 0.0088 times 0.002 is 0.0000176, which is exactly the top, 0.00275 times 0.0064.'
        write: 'Check: $0.0088 \times 0.002 = 0.0000176 = 0.00275 \times 0.0064\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the answer is 8.8 times 10 to the power negative 3, which is option C.'
        write: '$\therefore$ Expression $= 8.8 \times 10^{-3}$'
        answer: true
    traps:
      A: 'You went for 8.8 times 10 to the power negative 1. That is only the numbers, 0.88, put in standard form. The powers of 10 give another 10 to the power negative 2, and negative 1 plus negative 2 is negative 3.'
      B: 'You went for 8.8 times 10 to the power 2. A positive index makes the answer bigger than 1, but the answer is 0.0088. Dividing the powers gives negative 6 minus negative 4, which is negative 2, and the final index is negative 3.'
      D: 'You went for 8.8 times 10 to the power 3. The sign of the index has flipped. The answer is 0.0088, which is 8.8 times 10 to the power negative 3.'
  7:
    moments:
      - section: 'The question'
        say: 'Three brothers share a profit. The first gets a third, the second two thirds of the remainder, and the third the last ₦12,000. Picture the profit as one long bar.'
        doodle: {name: 'custom:1990_q07_a', id: bar, size: scene, caption: 'the third brother gets ₦12,000'}
        write: '1st: $\tfrac{1}{3}$; 2nd: $\tfrac{2}{3}$ of the remainder; 3rd: ₦12,000. Profit $= ?$'
      - say: 'We name the profit, write each share in terms of it, and form an equation from the third share.'
        write: 'Solution'
      - say: 'Let the total profit be x naira.'
        write: 'Let the profit be ₦$x$'
      - section: 'Each share'
        say: 'The first brother gets a third of x. The remainder is x minus x over 3, which is 2x over 3.'
        doodle_do: [{id: bar, op: stage, stage: 'custom:1990_q07_a2'}]
        write: '1st $= \dfrac{x}{3}$; remainder $= x - \dfrac{x}{3} = \dfrac{2x}{3}$'
      - say: 'The second gets two thirds of that remainder. "Of" means multiply, so 2 over 3 times 2x over 3 is 4x over 9.'
        doodle_do: [{id: bar, op: stage, stage: 'custom:1990_q07_a3'}]
        write: '2nd $= \dfrac{2}{3} \times \dfrac{2x}{3} = \dfrac{4x}{9}$'
      - say: 'The third gets the rest of the remainder, which is 2x over 3 minus 4x over 9.'
        write: '3rd $= \dfrac{2x}{3} - \dfrac{4x}{9}$'
      - say: 'The L.C.M. of 3 and 9 is 9, and 2x over 3 is 6x over 9. 6x minus 4x is 2x. So the third brother gets 2x over 9, the last 2 pieces.'
        doodle_do: [{id: bar, op: circle, part: third}, {id: bar, op: label, part: third, text: '2/9'}]
        write: '$= \dfrac{6x - 4x}{9} = \dfrac{2x}{9}$'
      - section: 'Form the equation'
        say: 'The third brother received ₦12,000. So 2x over 9 equals 12,000.'
        write: '$\dfrac{2x}{9} = 12000$'
        point:
          - {line: 7, kind: highlight, at: '12000', to: {doodle: bar, part: s3}}
      - say: 'Multiply both sides by 9 over 2. 12,000 divided by 2 is 6,000, and 6,000 times 9 is 54,000, which is the whole bar.'
        doodle_do: [{id: bar, op: label, part: whole, text: '₦54,000'}]
        write: '$\therefore x = 12000 \times \dfrac{9}{2} = 54000$'
      - section: 'Check'
        say: 'Check. A third of 54,000 is 18,000, leaving 36,000. Two thirds of 36,000 is 24,000.'
        write: 'Check: 1st $= 18000$; 2nd $= \tfrac{2}{3} \times 36000 = 24000$'
      - say: 'And 54,000 minus 18,000 minus 24,000 is 12,000 for the third brother, as the question says.'
        write: '3rd $= 54000 - 18000 - 24000 = 12000 \ \checkmark$'
      - section: 'Answer'
        say: 'So the profit they shared was ₦54,000, which is option B.'
        write: '$\therefore$ Profit $=$ ₦54,000.00'
        answer: true
    traps:
      A: 'You went for ₦60,000. That treats ₦12,000 as a fifth of the profit. The third brother''s share is 2x over 9, so the profit is 12,000 times 9 over 2, which is ₦54,000.'
      C: 'You went for ₦48,000. That treats ₦12,000 as a quarter of the profit. The third share is 2x over 9, not x over 4.'
      D: 'You went for ₦42,000. That is what the first two brothers got together, ₦18,000 plus ₦24,000. Add the third brother''s ₦12,000 to get the whole profit.'
  8:
    moments:
      - section: 'The question'
        say: 'We have a root inside a root inside a root. It looks frightening, but each layer turns into a perfect square if you start from the inside.'
        write: 'Simplify $\sqrt{160r^{2} + \sqrt{71r^{4} + \sqrt{100r^{8}}}}$'
      - say: 'Solution. We work from the innermost root outwards, like opening boxes packed inside boxes.'
        doodle: {name: 'custom:1990_q08_a', id: boxes, caption: 'roots inside roots: open from inside'}
        write: 'Solution'
      - section: 'The innermost root'
        say: 'The innermost root is root of $100r^{8}$. By the law of surds, it splits into root 100 times root $r^{8}$.'
        write: '$\sqrt{100r^{8}} = \sqrt{100} \times \sqrt{r^{8}}$ $\quad [\sqrt{ab} = \sqrt{a} \times \sqrt{b}]$'
      - say: 'Root 100 is 10. And $r^{4}$ squared is $r^{8}$, by the law of indices, so root $r^{8}$ is $r^{4}$. The innermost box gives $10r^{4}$.'
        doodle_do:
          - {id: boxes, op: label, part: inner, text: '10r⁴'}
        write: '$= 10r^{4}$ $\quad [(r^{4})^{2} = r^{8}]$'
      - section: 'The middle root'
        say: 'Put $10r^{4}$ into the middle root. $71r^{4}$ and $10r^{4}$ are like terms, and 71 plus 10 is 81.'
        write: '$\sqrt{71r^{4} + 10r^{4}} = \sqrt{81r^{4}}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= 10r4'}, at: '+ 10r4', text: 'inner root'}
      - say: 'Root 81 is 9, and root $r^{4}$ is $r^{2}$. The middle box gives $9r^{2}$.'
        doodle_do:
          - {id: boxes, op: label, part: middle, text: '9r²'}
        write: '$= 9r^{2}$'
      - section: 'The outer root'
        say: 'Now $9r^{2}$ goes into the outer root. Again these are like terms, so 160 plus 9 is 169.'
        write: '$\sqrt{160r^{2} + 9r^{2}} = \sqrt{169r^{2}}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= 9r2'}, at: '+ 9r2', text: 'middle root'}
      - say: '169 is 13 squared, so root 169 is 13. And root $r^{2}$ is $r$. The outer box gives $13r$.'
        doodle_do:
          - {id: boxes, op: label, part: outer, text: '13r'}
        write: '$= \sqrt{169} \times \sqrt{r^{2}} = 13r$'
      - section: 'Check'
        say: 'Check by squaring back. $13r$ squared is $169r^{2}$, which is $160r^{2}$ plus $9r^{2}$. And $9r^{2}$ squared is $81r^{4}$, which is $71r^{4}$ plus $10r^{4}$.'
        write: 'Check: $(13r)^{2} = 169r^{2}$, $\ (9r^{2})^{2} = 81r^{4}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the expression simplifies to $13r$, which is option C.'
        write: '$\therefore \sqrt{160r^{2} + \sqrt{71r^{4} + \sqrt{100r^{8}}}} = 13r$'
        answer: true
    traps:
      A: 'You went for $9r^{2}$. That is the value of the middle root. There is still the outer root to take, the root of $160r^{2}$ plus $9r^{2}$.'
      B: 'You went for $12\sqrt{3}\,r$. Squaring that gives $432r^{2}$, but under the outer root we have $169r^{2}$. Work from the inside out, adding like terms at each layer.'
      D: 'You went for $\sqrt{13}\,r$. That takes the root of 13, but the number under the root is 169, and 169 is 13 squared. So its square root is 13 exactly.'
  9:
    moments:
      - section: 'The question'
        say: 'Root 27 and 3 over root 3 look nothing alike. But both turn into a number times root 3, and then they add like ordinary like terms.'
        write: 'Simplify $\sqrt{27} + \dfrac{3}{\sqrt{3}}$'
      - say: 'Solution. Write each term in its basic form, as a number times root 3, then add.'
        write: 'Solution'
      - section: 'The first term'
        say: 'For root 27, find the largest perfect-square factor of 27. 27 is 9 times 3, and 9 is a perfect square.'
        write: '$\sqrt{27} = \sqrt{9 \times 3}$'
      - say: 'By the law of surds, that is root 9 times root 3. Root 9 is 3, so root 27 is 3 root 3. Picture root 3 as a rod of fixed length, and this is three rods.'
        doodle: {name: 'custom:1990_q09_a', id: rods, caption: 'root 3 as a rod'}
        doodle_do:
          - {id: rods, op: label, part: first, text: '3√3'}
        write: '$= \sqrt{9} \times \sqrt{3} = 3\sqrt{3}$ $\quad [\sqrt{ab} = \sqrt{a} \times \sqrt{b}]$'
      - section: 'The second term'
        say: 'The second term has root 3 in the denominator, so rationalise by multiplying the numerator and denominator by root 3.'
        write: '$\dfrac{3}{\sqrt{3}} = \dfrac{3}{\sqrt{3}} \times \dfrac{\sqrt{3}}{\sqrt{3}}$'
      - say: 'The numerator is 3 root 3. In the denominator, root 3 times root 3 is 3.'
        write: '$= \dfrac{3\sqrt{3}}{3}$'
      - say: 'The 3 in the numerator cancels with the 3 in the denominator, leaving root 3, which is one more rod.'
        doodle_do:
          - {id: rods, op: stage, stage: 'custom:1990_q09_a2'}
        write: '$= \sqrt{3}$'
      - section: 'Add'
        say: 'Now go back to the sum and put in both terms, so we get 3 root 3 plus root 3.'
        write: '$\therefore \sqrt{27} + \dfrac{3}{\sqrt{3}} = 3\sqrt{3} + \sqrt{3}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '= 3'}, at: '33[[+3]]', text: 'second'}
      - say: 'They are like surds, so add the numbers in front. 3 plus 1 is 4. That makes four rods.'
        doodle_do:
          - {id: rods, op: label, part: total, text: '4√3'}
        write: '$= (3 + 1)\sqrt{3} = 4\sqrt{3}$'
      - section: 'Check'
        say: 'Check with decimals. Root 27 is about 5.196, and 3 over 1.732 is 1.732. Together that is 6.928, and 4 times 1.732 is 6.928 too.'
        write: 'Check: $5.196 + 1.732 = 6.928 = 4 \times 1.732\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore root 27 plus 3 over root 3 is 4 root 3, which is option A.'
        write: '$\therefore$ the answer is $4\sqrt{3}$'
        answer: true
    traps:
      B: 'You went for 4 over root 3. That is only about 2.3, but root 27 alone is over 5. The second term, 3 over root 3, rationalises to root 3, and the total is 4 root 3.'
      C: 'You went for 3 root 3. That is root 27 on its own, and the second term was dropped. Add the root 3 from 3 over root 3 to get 4 root 3.'
      D: 'You went for 3 root 4. Root 4 is just 2, so that is 6, but the answer is about 6.93. The common surd here is root 3, not root 4.'
  10:
    moments:
      - section: 'The question'
        say: 'We have four logs to base 6. Multiplying everything out gives a huge number. Instead, gather them into one log and write every number as a power of 2 and 3.'
        write: 'Simplify $3\log_{6}9 + \log_{6}12 + \log_{6}64 - \log_{6}72$'
      - say: 'Solution. First the laws of logarithms, then the laws of indices.'
        write: 'Solution'
      - section: 'Laws of logarithms'
        say: 'Recall the power law, which says $n$ times log $M$ is the log of $M$ to the power $n$.'
        write: 'Recall: $n\log_{a}M = \log_{a}M^{n}$'
      - say: 'By the power law, 3 log base 6 of 9 is log base 6 of 9 cubed. Leave it as 9 cubed for now.'
        write: '$3\log_{6}9 = \log_{6}9^{3}$'
      - say: 'Recall the product law. Adding logs to the same base gives the log of the product.'
        write: 'Recall: $\log_{a}M + \log_{a}N = \log_{a}MN$'
      - say: 'And the quotient law says that subtracting a log gives the log of the division.'
        write: 'Recall: $\log_{a}M - \log_{a}N = \log_{a}\dfrac{M}{N}$'
      - section: 'A single logarithm'
        say: 'By the product law, the three added logs become one log of 9 cubed times 12 times 64. By the quotient law, minus log 72 puts 72 in the denominator.'
        write: 'Expression $= \log_{6}\dfrac{9^{3} \times 12 \times 64}{72}$'
      - say: 'Simplify before multiplying. 72 is 6 times 12, so 12 over 72 is 1 over 6.'
        write: '$= \log_{6}\dfrac{9^{3} \times 64}{6}$'
      - section: 'Powers, not big numbers'
        say: 'Now write 9 and 64 as powers. 9 is 3 squared, and 64 is 2 to the power 6.'
        write: '$9^{3} \times 64 = (3^{2})^{3} \times 2^{6}$'
      - say: 'By the law of indices for a power of a power, multiply the indices, so 3 squared, cubed, is 3 to the power 6.'
        write: '$= 3^{6} \times 2^{6}$ $\quad [(a^{m})^{n} = a^{mn}]$'
      - say: 'Both have the same index, 6. So 3 to the 6, times 2 to the 6, is 3 times 2, to the power 6. That is 6 to the power 6.'
        write: '$= (3 \times 2)^{6} = 6^{6}$ $\quad [a^{n}b^{n} = (ab)^{n}]$'
      - say: 'Put 6 to the power 6 back into the log.'
        write: 'Expression $= \log_{6}\dfrac{6^{6}}{6}$'
      - say: 'By the law of indices for division, subtract the indices. 6 minus 1 is 5.'
        write: '$= \log_{6}6^{5}$ $\quad [a^{m} \div a^{n} = a^{m - n}]$'
      - say: 'By the power law, the index 5 comes down in front.'
        write: '$= 5\log_{6}6$'
      - say: 'The log of a number to its own base is 1. So this is 5 times 1, which is 5.'
        write: '$= 5 \times 1 = 5$ $\quad [\log_{a}a = 1]$'
      - section: 'Check'
        say: 'Check what is inside the log. 6 to the power 5 is 6 times 6 times 6 times 6 times 6. Picture a tower of 6s.'
        doodle: {name: 'custom:1990_q10_a', id: tower, caption: 'how many 6s make 7776?'}
        write: 'Check: $6^{5} = 6 \times 6 \times 6 \times 6 \times 6$'
      - say: '6 squared is 36, then 216, then 1,296, then 7,776. So the number inside the log is 7,776, and its log to base 6 is 5.'
        doodle_do:
          - {id: tower, op: stage, stage: 'custom:1990_q10_a2'}
        write: '$= 7776$, and $\log_{6}7776 = 5\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the expression simplifies to 5, which is option A.'
        write: '$\therefore$ the expression $= 5$'
        answer: true
    traps:
      B: 'You went for 7776. That is the number inside the log. 7776 is 6 to the power 5, so the log to base 6 is 5.'
      C: 'You went for log base 6 of 31. That adds and subtracts the numbers themselves. By the laws of logarithms, adding logs multiplies the numbers, and subtracting divides them.'
      D: 'You went for 7776 to the power 6. The laws of logarithms turn the expression into log base 6 of 6 to the power 5, and that is just 5.'
  11:
    moments:
      - section: 'The question'
        say: 'There are three negative indices in one expression. It looks heavy, but one law of indices handles all three, because a negative index means the reciprocal.'
        write: 'Simplify $\left(\dfrac{1}{x^{-1}} + \dfrac{1}{y^{-1}}\right)^{-1}$'
      - say: 'Solution. We work inside the bracket first, then deal with the power outside it.'
        write: 'Solution'
      - section: 'The law'
        say: 'The law of indices for a negative index says $a$ to the power negative $n$ is 1 over $a$ to the power $n$. So the power negative 1 turns a fraction upside down.'
        write: 'Law of indices: $a^{-n} = \dfrac{1}{a^{n}}$'
      - section: 'Inside the bracket'
        say: 'By that law, $x$ to the power negative 1 is 1 over $x$.'
        write: '$x^{-1} = \dfrac{1}{x}$'
      - say: 'So the first term, 1 over $x$ to the power negative 1, is 1 divided by 1 over $x$.'
        write: '$\therefore \dfrac{1}{x^{-1}} = 1 \div \dfrac{1}{x}$'
      - say: 'To divide by a fraction, turn it upside down and multiply. 1 times $x$ over 1 is $x$.'
        write: '$= 1 \times \dfrac{x}{1} = x$'
      - say: 'The second term works the same way. $y$ to the power negative 1 is 1 over $y$, and 1 divided by 1 over $y$ is $y$.'
        write: '$\dfrac{1}{y^{-1}} = 1 \div \dfrac{1}{y} = 1 \times \dfrac{y}{1} = y$'
      - section: 'The power outside'
        say: 'Put the two terms back into the bracket. The bracket becomes $x$ plus $y$, still to the power negative 1.'
        write: '$\therefore \left(\dfrac{1}{x^{-1}} + \dfrac{1}{y^{-1}}\right)^{-1} = (x + y)^{-1}$'
      - say: 'Use the same law on the whole bracket, so $x$ plus $y$, to the power negative 1, is 1 over $x$ plus $y$.'
        write: '$= \dfrac{1}{x + y}$'
      - section: 'Check'
        say: 'Check with $x$ equal to 2 and $y$ equal to 3. 1 over 2 to the power negative 1 is 2, and 1 over 3 to the power negative 1 is 3. 2 plus 3 is 5, and 5 to the power negative 1 is 1 over 5.'
        write: 'Check, $x = 2,\ y = 3$: $(2 + 3)^{-1} = \dfrac{1}{5}$'
      - say: 'Our answer gives 1 over 2 plus 3, which is also 1 over 5. They agree.'
        write: '$\dfrac{1}{x + y} = \dfrac{1}{2 + 3} = \dfrac{1}{5}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the expression simplifies to 1 over $x$ plus $y$, which is option C.'
        write: '$\therefore \left(\dfrac{1}{x^{-1}} + \dfrac{1}{y^{-1}}\right)^{-1} = \dfrac{1}{x + y}$'
        answer: true
    traps:
      A: 'You went for $x$ over $y$. The two terms in the bracket are added, so they give $x$ plus $y$, not $x$ divided by $y$. Then the power negative 1 gives 1 over $x$ plus $y$.'
      B: 'You went for $xy$. The bracket is a sum, $x$ plus $y$, not a product. And the power negative 1 outside means the reciprocal, 1 over $x$ plus $y$.'
      D: 'You went for $xy$ to the power negative 1. That treats the plus as a times. With $x$ equal to 2 and $y$ equal to 3 it gives 1 over 6, but the expression is 1 over 5.'
  12:
    moments:
      - section: 'The question'
        say: 'We are given $a$ equals 2, $b$ equals minus 2 and $c$ equals minus a half, and we must evaluate the product of two brackets. Two of the values are negative, so watch every sign.'
        write: '$a = 2,\ b = -2,\ c = -\tfrac{1}{2}$; $\ (ab^{2} - bc^{2})(a^{2}c - abc) = ?$'
      - section: 'Solution: first bracket'
        say: 'Solution. Substitute into the first bracket, with every negative value in brackets.'
        write: 'Solution: $ab^{2} - bc^{2} = 2(-2)^{2} - (-2)\left(-\tfrac{1}{2}\right)^{2}$'
      - say: 'By BODMAS, powers come first. Minus 2 squared is plus 4, and minus a half squared is plus a quarter.'
        write: '$= 2(4) - (-2)\left(\tfrac{1}{4}\right)$'
      - say: '2 times 4 is 8. Minus 2 times a quarter is minus a half, and taking away minus a half is adding a half.'
        write: '$= 8 - \left(-\tfrac{1}{2}\right) = 8 + \tfrac{1}{2} = 8\tfrac{1}{2}$'
      - section: 'Second bracket'
        say: 'Now the second bracket. Substitute again, with the negatives in brackets.'
        write: '$a^{2}c - abc = (2)^{2}\left(-\tfrac{1}{2}\right) - (2)(-2)\left(-\tfrac{1}{2}\right)$'
      - say: '2 squared is 4, and 4 times minus a half is minus 2. 2 times minus 2 is minus 4, and minus 4 times minus a half is plus 2.'
        write: '$= -2 - (2)$'
      - say: 'Minus 2 minus 2 is minus 4.'
        write: '$= -4$'
      - section: 'Multiply'
        say: 'Now multiply the two brackets, that is 8 and a half times minus 4. Change 8 and a half to an improper fraction, which is 17 over 2.'
        write: '$(ab^{2} - bc^{2})(a^{2}c - abc) = \dfrac{17}{2} \times (-4)$'
      - say: 'Cancel first, so 4 divided by 2 is 2. 17 times 2 is 34, and a positive times a negative is negative.'
        write: '$= 17 \times (-2) = -34$'
      - section: 'Check'
        say: 'Check the second bracket another way. Take out the common factor $a c$, giving $a c$ times, bracket, $a$ minus $b$. That is 2 times minus a half, times 2 minus minus 2, so minus 1 times 4, which is minus 4.'
        write: 'Check: $ac(a - b) = (2)\left(-\tfrac{1}{2}\right)(2 + 2) = -1 \times 4 = -4\ \checkmark$'
      - say: 'Therefore the value is minus 34, which is option D.'
        write: '$\therefore (ab^{2} - bc^{2})(a^{2}c - abc) = -34$'
        answer: true
    traps:
      A: 'You went for 0. Neither bracket is zero. The first is 8 and a half and the second is minus 4. Their product is minus 34.'
      B: 'You went for minus 28. That is 7 times minus 4, so the first bracket went wrong. $ab^{2}$ is 8 and $bc^{2}$ is minus a half, so the first bracket is 8 and a half.'
      C: 'You went for minus 30. That is 7 and a half times minus 4, because you took 8 minus a half. But $bc^{2}$ is minus a half, and subtracting a negative adds it, giving 8 and a half.'
  13:
    moments:
      - section: 'The question'
        say: '$Y$ varies inversely as $X$ squared, and $X$ varies directly as $Z$ squared. We want the link between $Y$ and $Z$ alone. Picture a chain where $Z$ drives $X$, and $X$ drives $Y$.'
        doodle: {name: 'custom:1990_q13_a', id: chain, caption: 'Z drives X, X drives Y'}
        write: 'Relationship between $Y$ and $Z$?'
      - say: 'Solution. Write each statement with the sign of proportionality, then bring in a constant for each.'
        write: 'Solution'
      - section: 'The two variations'
        say: '$Y$ varies inversely as $X$ squared, so $Y$ equals $k$ one over $X$ squared. That is equation one.'
        write: '$Y \propto \dfrac{1}{X^{2}}$ $\ \therefore\ Y = \dfrac{k_{1}}{X^{2}} \quad \ldots (1)$'
      - say: '$X$ varies directly as $Z$ squared, so $X$ equals $k$ two times $Z$ squared. That is equation two.'
        write: '$X \propto Z^{2}$ $\ \therefore\ X = k_{2}Z^{2} \quad \ldots (2)$'
      - section: 'Remove X'
        say: 'Substitute equation two into equation one, so $X$ drops out of the chain. Keep it in a bracket, because the whole of $X$ is squared.'
        doodle_do: [{id: chain, op: cross, part: x}]
        write: 'Sub. (2) in (1): $\ Y = \dfrac{k_{1}}{(k_{2}Z^{2})^{2}}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= [[k2Z2]]'}, at: '(k2Z2)', text: 'X from (2)'}
      - say: 'Square each factor in the bracket. $k$ two squared, and $Z$ squared, squared, is $Z$ to the power 4, because the indices multiply and 2 times 2 is 4.'
        write: '$(k_{2}Z^{2})^{2} = k_{2}^{2}Z^{4}$'
      - say: 'So $Y$ is $k$ one over $k$ two squared $Z$ to the fourth.'
        write: '$Y = \dfrac{k_{1}}{k_{2}^{2}Z^{4}}$'
      - say: '$k$ one over $k$ two squared is one constant. The question calls it $C$.'
        write: 'Let $C = \dfrac{k_{1}}{k_{2}^{2}}$: $\ Y = \dfrac{C}{Z^{4}}$'
      - section: 'The relationship'
        say: 'Multiply both sides by $Z$ to the fourth.'
        write: '$\therefore\ Z^{4}Y = C$'
      - section: 'Check'
        say: 'Check on the chain. If $Z$ doubles, $X$ becomes 4 times bigger, $X$ squared 16 times bigger, so $Y$ is divided by 16. And 16 is 2 to the power 4.'
        doodle_do: [{id: chain, op: stage, stage: 'custom:1990_q13_a2'}]
        write: 'Check: $Z \times 2 \Rightarrow X \times 4 \Rightarrow Y \div 16 = Y \div 2^{4}\ \checkmark$'
        point:
          - {line: 9, kind: highlight, at: '÷16', to: {doodle: chain, part: y16}}
      - say: 'So the relationship is $Z$ to the fourth times $Y$ equals $C$, which is option C.'
        write: '$Z^{4}Y = C$'
        answer: true
    traps:
      A: 'You went for $Z^{2}Y = C$. That substitutes $X = k_{2}Z^{2}$ but forgets that $X$ is squared in equation one. Bracket it first, and $(k_{2}Z^{2})^{2}$ gives $Z^{4}$.'
      B: 'You went for $Y = CZ^{2}$. That says $Y$ grows as $Z$ grows, but $Y$ varies inversely, so $Z$ must end up in the denominator, as in $Y = \dfrac{C}{Z^{4}}$.'
      D: 'You went for $Y = C$. That says $Y$ never changes. But $Y$ depends on $X$, and $X$ depends on $Z$, so $Y$ must depend on $Z$.'
  14:
    moments:
      - section: 'The question'
        say: 'Make $r$ the subject. $r$ appears twice, on top and at the bottom, so we must gather the $r$ terms and factorise. Think of the equation as a balance.'
        write: '$\dfrac{p}{2} = \dfrac{r}{r + q}$'
        doodle: {name: 'custom:1990_q14_a', id: scale, caption: 'an equation is a balance'}
      - section: 'Solution'
        say: 'We clear the fractions, collect the terms in $r$, and factorise out $r$. Whatever we do to one side of the balance, we do to the other.'
        write: 'Solution'
      - say: 'Cross multiply, and $p$ times, $r$ plus $q$, equals 2 times $r$.'
        write: '$p(r + q) = 2r$'
        doodle_do:
          - {id: scale, op: pulse, part: beam}
      - say: 'Open the bracket. $p$ times $r$ is $pr$, and $p$ times $q$ is $pq$.'
        write: '$pr + pq = 2r$'
      - say: 'Collect the terms in $r$ on one side. Subtract $pr$ from both sides.'
        write: '$pq = 2r - pr$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '[[pr]] +'}, at: '− pr', text: 'across the ='}
      - say: 'Both terms on the right have $r$, so factorise out $r$.'
        write: '$pq = r(2 - p)$'
      - say: 'Divide both sides by 2 minus $p$, so that $r$ stands alone.'
        write: '$r = \dfrac{pq}{2 - p}$'
      - section: 'Check'
        say: 'Take $p$ equals 1 and $q$ equals 3. The formula gives 1 times 3, over 2 minus 1, which is 3.'
        write: '$p = 1,\ q = 3$: $r = \dfrac{3}{2 - 1} = 3$'
      - say: 'Put these in the question. $r$ over $r$ plus $q$ is 3 over 6, a half. And $p$ over 2 is also a half, so the balance is level.'
        write: '$\dfrac{3}{3 + 3} = \dfrac{1}{2} = \dfrac{1}{2}\ \checkmark$'
        doodle_do:
          - {id: scale, op: label, part: lpan, text: '½'}
          - {id: scale, op: label, part: rpan, text: '½'}
      - say: 'Therefore $r$ equals $pq$ over, 2 minus $p$, which is option D.'
        write: '$\therefore r = \dfrac{pq}{2 - p}$ (D)'
        answer: true
    traps:
      A: 'You went for $\dfrac{q}{2 - p^{2}}$. Nothing in the working is ever squared, and the $p$ on top has gone missing. Cross multiply, collect the $r$ terms and factorise to get $r = \dfrac{pq}{2 - p}$.'
      B: 'You went for $\dfrac{pq^{2}}{2 - q^{2}}$. No step squares anything, so no $q^{2}$ can appear. The answer is $\dfrac{pq}{2 - p}$.'
      C: 'You went for $\dfrac{p^{2}q^{2}}{2 - pq}$. Again, nothing is squared along the way. After $pq = r(2 - p)$, just divide both sides by $2 - p$.'
  15:
    moments:
      - section: 'The question'
        say: 'The rule is given for $f$ of $x$ minus 4, not $f$ of $x$. Feed 2 straight into it and you land on a trap. Picture the $f$ machine with 2 going in.'
        write: '$f(x - 4) = x^{2} + 2x + 3$'
        doodle: {name: 'custom:1990_q15_a', id: machine, caption: 'the f machine: 2 goes in'}
      - section: 'Solution'
        say: 'We find the $x$ that makes the input, $x$ minus 4, equal to 2. Then we substitute that $x$.'
        write: 'Solution'
      - say: 'Let $x$ minus 4 equal 2.'
        write: 'Let $x - 4 = 2$'
      - say: 'Add 4 to both sides. 2 plus 4 is 6.'
        write: '$\therefore x = 2 + 4 = 6$'
        doodle_do:
          - {id: machine, op: label, part: in, text: 'x = 6 gives x − 4 = 2'}
      - say: 'Substitute $x$ equals 6 on both sides, in brackets.'
        write: '$f(6 - 4) = (6)^{2} + 2(6) + 3$'
      - say: '6 minus 4 is 2, so the left side is $f$ of 2. 6 squared is 36, and 2 times 6 is 12.'
        write: '$f(2) = 36 + 12 + 3$'
      - say: '36 plus 12 is 48, and 48 plus 3 is 51. Out of the machine comes 51.'
        write: '$\therefore f(2) = 51$'
        doodle_do:
          - {id: machine, op: label, part: out, text: '51'}
      - section: 'Check'
        say: 'Check another way, by finding $f$ of $t$. Let $t$ equal $x$ minus 4, so $x$ is $t$ plus 4.'
        write: 'Let $t = x - 4$, $\therefore x = t + 4$'
      - say: 'Replace every $x$ in the rule with $t$ plus 4, in brackets.'
        write: '$f(t) = (t + 4)^{2} + 2(t + 4) + 3$'
      - say: 'Open the brackets. $t$ plus 4, squared, is $t$ squared plus $8t$ plus 16. 2 times, $t$ plus 4, is $2t$ plus 8.'
        write: '$= t^{2} + 8t + 16 + 2t + 8 + 3$'
      - say: 'Collect like terms. $8t$ plus $2t$ is $10t$, and 16 plus 8 plus 3 is 27.'
        write: '$= t^{2} + 10t + 27$'
      - say: 'Now put $t$ equals 2. 4 plus 20 plus 27 is 51 again.'
        write: '$f(2) = 4 + 20 + 27 = 51\ \checkmark$'
      - say: 'So $f$ of 2 is 51, and that is option D.'
        write: '$\therefore f(2) = 51$ (D)'
        answer: true
    traps:
      A: 'You went for 6. That is the value of $x$ that makes $x - 4 = 2$. It still has to go into $x^{2} + 2x + 3$.'
      B: 'You went for 11. That puts 2 straight into $x^{2} + 2x + 3$, as if the rule were for $f(x)$. The rule is for $f(x - 4)$, so use $x = 6$.'
      C: 'You went for 27. That is what $x = 4$ gives, and $x = 4$ makes $x - 4 = 0$, so that is $f(0)$. For $f(2)$ we need $x = 6$.'
  16:
    moments:
      - section: 'The question'
        say: 'We have two squared brackets with a minus between them. Opening them all up is slow. This is a difference of two squares in disguise.'
        write: '$9(x + y)^{2} - 4(x - y)^{2}$'
      - section: 'Solution'
        say: 'We write each term as something squared, then use the difference of two squares.'
        write: 'Solution'
      - say: '9 is 3 squared and 4 is 2 squared. So the first term is 3 times $x$ plus $y$, all squared, and the second is 2 times $x$ minus $y$, all squared.'
        write: '$= [3(x + y)]^{2} - [2(x - y)]^{2}$'
      - say: 'The rule is that $A$ squared minus $B$ squared is $A$ minus $B$, times $A$ plus $B$. Picture a big square with a small square cut from its corner.'
        write: '$A^{2} - B^{2} = (A - B)(A + B)$'
        doodle: {name: 'custom:1990_q16_a', id: sq, size: scene, caption: 'A² − B²: a square, corner cut'}
      - say: 'Here $A$ is 3 times $x$ plus $y$, the big side, and $B$ is 2 times $x$ minus $y$, the small one.'
        write: '$A = 3(x + y),\quad B = 2(x - y)$'
        doodle_do:
          - {id: sq, op: label, part: biga, text: 'A = 3(x + y)'}
          - {id: sq, op: label, part: smallb, text: 'B = 2(x − y)'}
      - section: 'Each bracket'
        say: 'First, $A$ minus $B$. Open the brackets, and the minus 2 reaches both terms. Minus 2 times negative $y$ is plus $2y$.'
        write: '$A - B = 3x + 3y - 2x + 2y$'
      - say: 'Collect like terms. $3x$ minus $2x$ is $x$, and $3y$ plus $2y$ is $5y$.'
        write: '$= x + 5y$'
      - say: 'Next, $A$ plus $B$. Opening the brackets gives $3x$ plus $3y$, plus $2x$ minus $2y$.'
        write: '$A + B = 3x + 3y + 2x - 2y$'
      - say: 'Collect like terms. $3x$ plus $2x$ is $5x$, and $3y$ minus $2y$ is $y$.'
        write: '$= 5x + y$'
      - say: 'Multiply the two brackets. In the picture, the L-shape slides into a rectangle, $A$ minus $B$ by $A$ plus $B$.'
        write: '$= (x + 5y)(5x + y)$'
        doodle_do:
          - {id: sq, op: stage, stage: 'custom:1990_q16_a2'}
        point:
          - {line: 9, kind: move, from: {line: 6, at: '= x+5y'}, at: '(x+5y)', text: 'A − B'}
          - {line: 9, kind: move, from: {line: 8, at: '= 5x+y'}, at: '(5x+y)', text: 'A + B'}
      - section: 'Check'
        say: 'Take $x$ equals 1 and $y$ equals 0. The question gives 9 times 1, minus 4 times 1, which is 5.'
        write: '$x = 1,\ y = 0$: $9(1)^{2} - 4(1)^{2} = 5$'
      - say: 'Our factors give 1 times 5, which is also 5.'
        write: '$(1)(5) = 5\ \checkmark$'
      - say: 'Therefore the factors are $x$ plus $5y$, and $5x$ plus $y$, so the answer is option C.'
        write: '$\therefore (x + 5y)(5x + y)$ (C)'
        answer: true
    traps:
      A: 'You went for $(x + y)(5x + y)$. The second bracket is right, but the first went wrong. Minus 2 times minus $y$ is PLUS $2y$, so $3y + 2y = 5y$, giving $x + 5y$.'
      B: 'You went for $(x + y)^{2}$. The two squared brackets are different, $x + y$ and $x - y$, so they cannot just be combined. Use the difference of two squares.'
      D: 'You went for $5(x + y)^{2}$. That does 9 minus 4 as if both brackets were the same. They are not, because one is $x + y$ and the other is $x - y$.'
  17:
    moments:
      - section: 'The question'
        say: 'We know $a$ squared plus $b$ squared, and $2ab$. We want $a$ minus $b$, which is how far apart $a$ and $b$ sit on a number line, and which way round. No need to find $a$ and $b$.'
        write: '$a^{2} + b^{2} = 16,\quad 2ab = 7$'
        doodle: {name: 'custom:1990_q17_a', id: line, caption: 'how far apart are a and b?'}
      - section: 'Solution'
        say: 'One identity links exactly these pieces, and that is the square of $a$ minus $b$.'
        write: 'Solution'
      - say: 'Recall that $a$ minus $b$, all squared, is $a$ squared minus $2ab$ plus $b$ squared.'
        write: 'Recall: $(a - b)^{2} = a^{2} - 2ab + b^{2}$'
      - say: 'Group $a$ squared and $b$ squared together, because we know their sum.'
        write: '$(a - b)^{2} = (a^{2} + b^{2}) - 2ab$'
      - say: 'Now substitute. $a$ squared plus $b$ squared is 16, and $2ab$ is 7.'
        write: '$= 16 - 7$'
        point:
          - {line: 4, kind: move, from: {line: 0, at: '16'}, at: '16', text: 'a² + b²'}
          - {line: 4, kind: move, from: {line: 0, at: '= 7'}, at: '− 7', text: '2ab'}
      - say: '16 minus 7 is 9.'
        write: '$= 9$'
      - say: 'Take the square root of both sides. A positive number has two square roots, plus and minus.'
        write: '$a - b = \pm\sqrt{9}$'
      - say: 'The square root of 9 is 3. So $a$ and $b$ are 3 apart.'
        write: '$\therefore a - b = \pm 3$'
        doodle_do:
          - {id: line, op: label, part: gap, text: '3 apart'}
      - say: 'Both signs really happen. If we swap $a$ and $b$, then $a$ squared plus $b$ squared and $2ab$ stay the same, but $a$ minus $b$ changes sign.'
        write: 'Swap $a$ and $b$: $b - a = -(a - b)$'
        doodle_do:
          - {id: line, op: move, part: ta, path: swap-a}
          - {id: line, op: move, part: tb, path: swap-b}
          - {id: line, op: label, part: diff, text: 'now a − b = −3'}
      - section: 'Check'
        say: 'Square each value. 3 squared is 9, and negative 3 squared is also 9, which is 16 minus 7.'
        write: '$3^{2} = 9,\quad (-3)^{2} = 9\ \checkmark$'
      - say: 'So $a$ minus $b$ is 3 or negative 3, which is option A.'
        write: '$\therefore a - b = 3$ or $-3$ (A)'
        answer: true
    traps:
      B: 'You went for 2 and negative 2. Those square to 4, but $(a - b)^{2} = 16 - 7 = 9$. The square roots of 9 are 3 and negative 3.'
      C: 'You went for 1 and negative 1. Those square to 1, not 9. Use $(a - b)^{2} = a^{2} + b^{2} - 2ab = 16 - 7 = 9$.'
      D: 'You went for 3 and negative 1. The 3 is right, but negative 1 squared is 1, not 9. Both values must square to 9, so they are 3 and negative 3.'
  18:
    moments:
      - section: 'The question'
        say: 'Divide a cubic by $x$ minus 1. We do it exactly like long division of numbers, so we divide, multiply, subtract and bring down. Then repeat.'
        write: '$(x^{3} - 2x^{2} - 5x + 6) \div (x - 1)$'
      - section: 'Solution'
        say: 'Long division. Each time, divide the first term of what is left by $x$, the first term of $x$ minus 1.'
        write: 'Solution'
      - say: 'First divide. $x$ cubed divided by $x$ is $x$ squared. That is the first term of the quotient.'
        write: '$x^{3} \div x = x^{2}$'
      - say: 'Then multiply, and $x$ squared times, $x$ minus 1, is $x$ cubed minus $x$ squared.'
        write: '$x^{2}(x - 1) = x^{3} - x^{2}$'
      - say: 'Subtract. $x$ cubed minus $x$ cubed is 0. For negative $2x$ squared minus negative $x$ squared, change the sign and add, which gives negative $x$ squared. Bring down negative $5x$.'
        write: 'Subtract: $-x^{2} - 5x$'
      - say: 'Divide again. Negative $x$ squared divided by $x$ is negative $x$.'
        write: '$-x^{2} \div x = -x$'
      - say: 'Multiply, so negative $x$ times, $x$ minus 1, is negative $x$ squared plus $x$.'
        write: '$-x(x - 1) = -x^{2} + x$'
      - say: 'Subtract. Negative $5x$ minus $x$ is negative $6x$. Bring down plus 6.'
        write: 'Subtract: $-6x + 6$'
      - say: 'Now divide. Negative $6x$ divided by $x$ is negative 6.'
        write: '$-6x \div x = -6$'
      - say: 'Multiply again, and negative 6 times, $x$ minus 1, is negative $6x$ plus 6.'
        write: '$-6(x - 1) = -6x + 6$'
      - say: 'Subtract, and negative $6x$ plus 6, minus itself, is 0. So the remainder is 0, and $x$ minus 1 divides exactly.'
        write: 'Subtract: $0$, Remainder $= 0$'
      - say: 'The quotient is the three terms we found, which are $x$ squared, negative $x$ and negative 6.'
        write: '$\therefore$ Quotient $= x^{2} - x - 6$'
        point:
          - {line: 11, kind: move, from: {line: 2, at: '= x2'}, at: 'x2', text: '1st'}
          - {line: 11, kind: move, from: {line: 5, at: '= −x'}, at: '[[−x]]−6', text: '2nd'}
          - {line: 11, kind: move, from: {line: 8, at: '= −6'}, at: '−6', text: '3rd'}
      - section: 'Check'
        say: 'Multiply back. Take $x$ times the bracket, then negative 1 times the bracket.'
        write: '$(x - 1)(x^{2} - x - 6)$'
      - say: '$x$ times the bracket is $x$ cubed minus $x$ squared minus $6x$. Negative 1 times it is negative $x$ squared plus $x$ plus 6.'
        write: '$= x^{3} - x^{2} - 6x - x^{2} + x + 6$'
      - say: 'Collect like terms, which are negative $2x$ squared and negative $5x$. That is the cubic we started with.'
        write: '$= x^{3} - 2x^{2} - 5x + 6\ \checkmark$'
      - say: 'Here is an exam tip. The remainder theorem agrees. Put $x$ equals 1 in the cubic, and 1 minus 2 minus 5 plus 6 is 0, so the remainder is 0.'
        write: 'Exam tip: $f(1) = 1 - 2 - 5 + 6 = 0$'
      - say: 'So the quotient is $x$ squared minus $x$ minus 6, which is option A.'
        write: '$\therefore x^{2} - x - 6$ (A)'
        answer: true
    traps:
      B: 'You went for $x^{2} - 5x + 6$. That just keeps the last two coefficients of the cubic. Multiply it back by $x - 1$ and you get $x^{3} - 6x^{2} + 11x - 6$, not the cubic in the question.'
      C: 'You went for $x^{2} - 7x + 6$. Multiply it back by $x - 1$ and you get $x^{3} - 8x^{2} + 13x - 6$. In the division, negative $2x^{2}$ minus negative $x^{2}$ is negative $x^{2}$, so the second term is negative $x$.'
      D: 'You went for $x^{2} - 5x - 6$. Multiplying back gives $x^{3} - 6x^{2} - x + 6$, not the cubic. When you subtract, change the sign and add, so negative $2x^{2}$ plus $x^{2}$ is negative $x^{2}$.'
  19:
    moments:
      - section: 'The question'
        say: 'We do not need to find $x$ at all. Squaring both sides hands us the answer. Picture a square with side $x$ plus 1 over $x$.'
        write: '$x + \dfrac{1}{x} = 4$'
        doodle: {name: 'custom:1990_q19_a', id: sq, caption: 'a square of side x + 1/x'}
      - section: 'Solution'
        say: 'We square both sides, then take away the middle term.'
        write: 'Solution'
      - say: 'Square both sides.'
        write: '$\left(x + \dfrac{1}{x}\right)^{2} = 4^{2}$'
      - say: 'Expand it as first squared, plus 2 times first times second, plus second squared. 4 squared is 16.'
        write: '$x^{2} + 2(x)\left(\dfrac{1}{x}\right) + \dfrac{1}{x^{2}} = 16$'
      - say: 'Look at the middle term, the two strips in the square. $x$ times 1 over $x$ is 1, so the middle term is 2. The $x$ disappears.'
        write: '$x^{2} + 2 + \dfrac{1}{x^{2}} = 16$'
        doodle_do:
          - {id: sq, op: label, part: mid, text: '1 + 1 = 2'}
      - say: 'Subtract 2 from both sides, to leave $x$ squared plus 1 over $x$ squared.'
        write: '$x^{2} + \dfrac{1}{x^{2}} = 16 - 2$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '+[[2]]+'}, at: '− 2', text: 'across the ='}
      - say: '16 minus 2 is 14, which is the big square and the small corner square together.'
        write: '$\therefore x^{2} + \dfrac{1}{x^{2}} = 14$'
        doodle_do:
          - {id: sq, op: circle, part: xx}
          - {id: sq, op: circle, part: inv}
      - section: 'Check'
        say: 'Take a real value. $x$ equals 2 plus root 3 works, because 1 over it is 2 minus root 3, and the two add to 4.'
        write: '$x = 2 + \sqrt{3}$, $\dfrac{1}{x} = 2 - \sqrt{3}$'
      - say: 'Square each. 2 plus root 3, squared, is 7 plus 4 root 3. 2 minus root 3, squared, is 7 minus 4 root 3. When we add, the roots cancel, giving 14.'
        write: '$(7 + 4\sqrt{3}) + (7 - 4\sqrt{3}) = 14\ \checkmark$'
      - say: 'So $x$ squared plus 1 over $x$ squared is 14, option B.'
        write: '$\therefore 14$ (B)'
        answer: true
    traps:
      A: 'You went for 16. That is 4 squared, but squaring $x + \dfrac{1}{x}$ also gives a middle term of 2. Take it away, and 16 minus 2 is 14.'
      C: 'You went for 12. The middle term is 2 times $x$ times $\dfrac{1}{x}$, which is 2, not 4. So subtract 2 from 16, giving 14.'
      D: 'You went for 9. Squaring both sides gives $x^{2} + 2 + \dfrac{1}{x^{2}} = 16$, so the answer is 16 minus 2, which is 14.'
  20:
    moments:
      - section: 'The question'
        say: 'Something must be added to make a perfect square. Many students add 1 or minus 1. Match the expression to the pattern of a perfect square.'
        write: '$4x^{2} - 4 + k$ a perfect square; $\ k = ?$'
      - section: 'Solution'
        say: 'Solution. A perfect square of two terms has this pattern, where $a$ minus $b$, all squared, is $a$ squared, minus $2ab$, plus $b$ squared.'
        write: 'Solution: $(a - b)^{2} = a^{2} - 2ab + b^{2}$'
        doodle: {name: 'custom:1990_q20_a', id: sq, caption: 'the pieces of a perfect square'}
      - say: 'Match the first term. $a$ squared is $4x$ squared, so $a$ is $2x$.'
        write: '$a^{2} = 4x^{2} \Rightarrow a = 2x$'
        doodle_do:
          - {id: sq, op: label, part: aa, text: '4x², so a = 2x'}
      - say: 'The minus 4 must be the middle term, minus $2ab$. Substitute $a$ equals $2x$.'
        write: '$-2ab = -4 \Rightarrow -2(2x)b = -4$'
        doodle_do:
          - {id: sq, op: label, part: mid, text: '−2ab = −4'}
        point:
          - {line: 3, kind: move, from: {line: 2, at: 'a = [[2x]]'}, at: '(2x)', text: 'a'}
      - say: 'Minus 2 times $2x$ is minus $4x$.'
        write: '$-4xb = -4$'
      - say: 'Divide both sides by minus $4x$. Minus 4 over minus $4x$ is 1 over $x$.'
        write: '$b = \dfrac{-4}{-4x} = \dfrac{1}{x}$'
      - say: 'The term to add is the last one in the pattern, $b$ squared. 1 over $x$, squared, is 1 over $x$ squared.'
        write: '$k = b^{2} = \left(\dfrac{1}{x}\right)^{2} = \dfrac{1}{x^{2}}$'
        doodle_do:
          - {id: sq, op: label, part: corner, text: '1/x²'}
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= x1'}, at: '(x1)', text: 'b'}
          - {line: 6, kind: highlight, at: 'x21', to: {doodle: sq, part: corner}}
      - section: 'Check'
        say: 'Check by expanding $2x$ minus 1 over $x$, all squared, with the same pattern.'
        write: 'Check: $\left(2x - \dfrac{1}{x}\right)^{2} = (2x)^{2} - 2(2x)\left(\dfrac{1}{x}\right) + \dfrac{1}{x^{2}}$'
      - say: '$2x$ squared is $4x$ squared. 2 times $2x$ times 1 over $x$ is 4, with the minus. So we get back $4x$ squared minus 4, plus 1 over $x$ squared.'
        write: '$= 4x^{2} - 4 + \dfrac{1}{x^{2}}\ \checkmark$'
      - say: 'Therefore we must add 1 over $x$ squared, which is option B.'
        write: '$\therefore$ add $\dfrac{1}{x^{2}}$'
        answer: true
    traps:
      A: 'You went for minus 1 over $x$ squared. The last term of a perfect square is $b$ squared, and a square is never negative. It must be plus 1 over $x$ squared.'
      C: 'You went for 1. Adding 1 gives $4x^{2} - 3$, which is not a perfect square. The minus 4 is the middle term, $-2(2x)b$, so $b$ is 1 over $x$ and the last term is $\dfrac{1}{x^{2}}$.'
      D: 'You went for minus 1. The last term of a perfect square is a square, so it cannot be negative. Matching the pattern gives $\dfrac{1}{x^{2}}$.'
  21:
    moments:
      - section: 'The question'
        say: 'We have $x$ and root $x$ in one equation. But $x$ is just root $x$, squared, so picture a square of side root $x$ and area $x$. So this is a quadratic in disguise.'
        write: '$x - 8\sqrt{x} + 15 = 0$'
        doodle: {name: 'custom:1990_q21_a', id: tiles, caption: 'side u, area x'}
      - section: 'Solution'
        say: 'We give root $x$ a new letter, solve the quadratic by factorisation, then go back to $x$.'
        write: 'Solution'
      - say: 'Let root $x$ be $u$. Then $x$ is $u$ squared.'
        write: 'Let $\sqrt{x} = u$, $\therefore x = u^{2}$'
      - say: 'Replace $x$ with $u$ squared and root $x$ with $u$.'
        write: '$u^{2} - 8u + 15 = 0$'
      - section: 'Factorise'
        say: 'Here $a$ is 1, $b$ is negative 8 and $c$ is 15. The product is $ac$, 15. The sum is $b$, negative 8.'
        write: 'Product $= ac = 15$, Sum $= b = -8$'
      - say: 'Negative 3 times negative 5 is 15, and negative 3 plus negative 5 is negative 8.'
        write: 'Factors: $-3$ and $-5$'
      - say: 'Replace the middle term, negative $8u$, with negative $3u$ minus $5u$.'
        write: '$u^{2} - 3u - 5u + 15 = 0$'
      - say: 'Group in pairs. Take $u$ out of the first pair and negative 5 out of the second. Both brackets are $u$ minus 3.'
        write: '$u(u - 3) - 5(u - 3) = 0$'
      - say: 'Take out the common bracket, $u$ minus 3. What is left is $u$ minus 5.'
        write: '$(u - 3)(u - 5) = 0$'
      - say: 'Either the first bracket is zero or the second one is.'
        write: 'Either $u - 3 = 0$ or $u - 5 = 0$'
      - say: 'Therefore $u$ is 3 or $u$ is 5.'
        write: '$\therefore u = 3$ or $u = 5$'
      - section: 'Back to x'
        say: 'But the question wants $x$. $u$ is root $x$, so if root $x$ is 3, square both sides and $x$ is 9, a 3 by 3 square.'
        write: '$\sqrt{x} = 3$, $\therefore x = 3^{2} = 9$'
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1990_q21_a2'}
        point:
          - {line: 2, kind: underline, at: '[[x=u]], ∴', text: 'u is √x'}
      - say: 'If root $x$ is 5, then $x$ is 5 squared, which is 25, a 5 by 5 square.'
        write: '$\sqrt{x} = 5$, $\therefore x = 5^{2} = 25$'
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1990_q21_a3'}
        point:
          - {line: 12, kind: highlight, at: '= 25', to: {doodle: tiles, part: sq5}}
      - section: 'Check'
        say: 'Check $x$ equals 9. Root 9 is 3, and 8 times 3 is 24. 9 minus 24 plus 15 is 0.'
        write: '$x = 9$: $9 - 8(3) + 15 = 0\ \checkmark$'
      - say: 'Check $x$ equals 25. Root 25 is 5, and 8 times 5 is 40. 25 minus 40 plus 15 is 0.'
        write: '$x = 25$: $25 - 8(5) + 15 = 0\ \checkmark$'
      - say: 'So $x$ is 9 or 25, and that is option C.'
        write: '$\therefore x = 9$ or $25$ (C)'
        answer: true
    traps:
      A: 'You went for 3 and 5. Those are the values of root $x$, the letter $u$. Square them to get back to $x$, which gives 9 and 25.'
      B: 'You went for negative 3 and negative 5. The factors $(u - 3)(u - 5)$ give positive 3 and 5, and root $x$ cannot be negative anyway. Then square them to get 9 and 25.'
      D: 'You went for negative 9 and 25. The 25 is right, but negative 9 has no real square root, so it cannot fit an equation with root $x$ in it. Root $x$ equals 3 gives $x$ equals 9.'
  22:
    moments:
      - section: 'The question'
        say: 'The three sides are all written with $x$. Pythagoras turns them into one equation, and almost everything cancels.'
        write: 'Sides: $x$, $(3x - 1)$, $(3x + 1)$ cm; $x = ?$'
      - section: 'Solution'
        say: 'Solution. Let me draw the right-angled triangle. The longest side, $3x$ plus 1, faces the right angle, so it is the hypotenuse.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: highlight, target: AC, text: 'hypotenuse'}
      - say: 'The square on the hypotenuse equals the sum of the squares on the other two sides.'
        write: '$|AC|^{2} = |AB|^{2} + |BC|^{2}$ (Pythagoras)'
      - say: 'Substitute the three sides.'
        write: '$(3x + 1)^{2} = x^{2} + (3x - 1)^{2}$'
      - say: 'Expand $3x$ plus 1, all squared. We get $9x$ squared, plus 2 times $3x$ times 1, which is $6x$, plus 1.'
        write: '$(3x + 1)^{2} = 9x^{2} + 6x + 1$'
      - say: 'In the same way, $3x$ minus 1, all squared, is $9x$ squared minus $6x$ plus 1.'
        write: '$(3x - 1)^{2} = 9x^{2} - 6x + 1$'
      - say: 'Put both expansions back into the equation.'
        write: '$9x^{2} + 6x + 1 = x^{2} + 9x^{2} - 6x + 1$'
      - say: 'Both sides have $9x$ squared and both have 1. Subtract them from both sides.'
        write: '$6x = x^{2} - 6x$'
      - say: 'Bring everything to one side. Do not divide by $x$, or you lose a root.'
        write: '$x^{2} - 12x = 0$'
      - say: 'Both terms have $x$, so factorise by taking out $x$.'
        write: '$x(x - 12) = 0$'
      - say: 'Either $x$ is 0, or $x$ minus 12 is 0.'
        write: 'Either $x = 0$ or $x - 12 = 0$'
      - say: 'A side cannot have length 0, so $x$ is 12.'
        write: '$x = 12$ (a length is not 0)'
      - section: 'Check'
        say: 'Check. With $x = 12$, the sides are 12, then 36 minus 1, which is 35, and 36 plus 1, which is 37.'
        write: 'Sides: $12$, $35$, $37$'
      - say: '12 squared is 144, and 35 squared is 1225. Together they make 1369, which is 37 squared.'
        write: '$144 + 1225 = 1369 = 37^{2}$ $\checkmark$'
      - say: 'Therefore $x$ is 12, option D.'
        write: '$\therefore x = 12$ (D)'
        answer: true
    traps:
      A: 'You went for 5, maybe thinking of the 3, 4, 5 triangle. Then the sides are 5, 14 and 16, and 25 plus 196 is 221, not 256. The algebra gives 12.'
      B: 'You went for 7. The sides would be 7, 20 and 22, and 49 plus 400 is 449, not 484. Solving $x^{2} - 12x = 0$ gives 12.'
      C: 'You went for 8. The sides would be 8, 23 and 25, and 64 plus 529 is 593, not 625. Solving $x^{2} - 12x = 0$ gives 12.'
  23:
    moments:
      - section: 'The question'
        say: 'A lawn has 24 metres of fence round it, and 35 one-metre squares of turf inside. How wide is it?'
        write: 'Find the width of the lawn.'
        doodle: {name: 'custom:1990_q23_a', id: lawn, caption: '24 m of fence, 35 m² of turf'}
      - say: 'Write Solution, then sketch the lawn as a rectangle with its perimeter and area.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'Perimeter 24 m', 'on': 'its perimeter'}
          - {figure: sketch, kind: circle, target: 'Area 35 m²', 'on': 'and area'}
      - section: 'Let'
        say: 'Let the length be l metres and the width be w metres.'
        write: 'Let the length be $l$ m and the width be $w$ m'
        point:
          - {figure: sketch, kind: circle, target: L, text: 'l', 'on': 'length be l'}
          - {figure: sketch, kind: circle, target: 'W = ?', text: 'w', 'on': 'width be w'}
      - section: 'Two equations'
        say: 'Perimeter of a rectangle is 2 times, length plus width. That is 24. Call it equation 1.'
        write: '$2(l + w) = 24$ ... (1)'
      - say: 'Area of a rectangle is length times width. That is 35. Call it equation 2.'
        write: '$lw = 35$ ... (2)'
        doodle_do:
          - {id: lawn, op: label, part: turf, text: 'l × w = 35', 'on': 'equation 2'}
      - section: 'Substitute'
        say: 'Divide equation 1 by 2, and l plus w is 12. So l equals 12 minus w. Call it equation 3.'
        write: 'From (1): $l + w = 12 \Rightarrow l = 12 - w$ ... (3)'
        doodle_do:
          - {id: lawn, op: label, part: roll, text: 'l + w = 12', 'on': 'l plus w is 12'}
      - say: 'Substitute equation 3 into equation 2, in place of l.'
        write: 'Sub. (3) in (2): $(12 - w)w = 35$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: 'l = [[12 − w]]'}, at: '(12−w)', text: 'l', 'on': 'in place of l'}
      - say: 'Expand, and 12w minus w squared equals 35. Bring everything to one side to get a quadratic equal to zero.'
        write: '$12w - w^{2} = 35 \Rightarrow w^{2} - 12w + 35 = 0$'
      - section: 'Factorise'
        say: 'We need a product of 35 and a sum of minus 12. The numbers are minus 5 and minus 7.'
        write: 'Product $= 35$, sum $= -12$: $-5, -7$'
      - say: 'So the quadratic factorises as w minus 5, times w minus 7, equals zero.'
        write: '$(w - 5)(w - 7) = 0$'
      - say: 'Either w minus 5 is 0, or w minus 7 is 0. So w is 5 or 7.'
        write: 'Either $w = 5$ or $w = 7$'
      - say: 'From equation 3, if w is 5, l is 7, and if w is 7, l is 5. Either way the sides are 5 m and 7 m. The width is the shorter side.'
        write: 'Sides are $5$ m and $7$ m; width $=$ shorter side'
        doodle_do:
          - {id: lawn, op: stage, stage: 'custom:1990_q23_a2', 'on': 'sides are 5 m and 7 m'}
      - say: 'Therefore the lawn is 5 metres wide.'
        write: '$\therefore$ width $= 5$ m'
        point:
          - {figure: sketch, kind: label, target: 'W = ?', text: '5 m', 'on': 'Therefore'}
      - section: 'Check'
        say: 'To check, 2 times, 7 plus 5, is 24, and 7 times 5 is 35. Both equations hold.'
        write: 'Check: $2(7 + 5) = 24$ ✓, $7 \times 5 = 35$ ✓'
      - section: 'Answer'
        say: 'So the lawn is 5 metres wide, which is answer choice A.'
        write: '$\therefore$ width $= 5$ m (A)'
        answer: true
    traps:
      B: 'You went for 7 m. That is the length. Both 5 and 7 come out of the working, and how wide asks for the shorter side.'
      C: 'You went for 12 m. That is the length plus the width, half the perimeter. The width on its own is 5 m.'
      D: 'You went for 14 m. That is two lengths, 7 plus 7. The sides are 5 and 7, and the width is the shorter, 5 m.'
  24:
    moments:
      - section: 'The question'
        say: 'A painter earns ₦40 a day and his assistant ₦10 a day. The painter worked 10 days more, and together they got ₦2,000. We want the assistant''s pay.'
        write: 'Painter ₦40/day, assistant ₦10/day, total ₦2,000'
        doodle: {name: 'custom:1990_q24_a', id: days, size: scene, caption: 'Painter ₦40 a day, assistant ₦10'}
      - section: 'Solution'
        say: 'Solution. Everything is measured from the assistant''s days, so let the assistant work $d$ days. Then the painter worked $d$ plus 10 days.'
        write: 'Solution. Let the assistant work $d$ days; painter: $(d + 10)$ days'
        doodle_do:
          - {id: days, op: highlight, part: astrip}
          - {id: days, op: circle, part: extra}
      - say: 'Pay is rate times days. The painter earns 40 naira for each of his $d$ plus 10 days.'
        write: 'Painter''s pay $= 40(d + 10)$'
      - say: 'The assistant earns 10 naira for each of his $d$ days.'
        write: 'Assistant''s pay $= 10d$'
      - section: 'Form the equation'
        say: 'Together they received 2,000 naira, so the two amounts add to 2000.'
        write: '$40(d + 10) + 10d = 2000$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '40(d+10)'}, at: '40(d+10)', text: 'painter'}
          - {line: 4, kind: move, from: {line: 3, at: '10d'}, at: '10d', text: 'assistant'}
      - say: 'Open the bracket. 40 times $d$ is $40d$, and 40 times 10 is 400, which is the pay for the painter''s 10 extra days.'
        write: '$40d + 400 + 10d = 2000$'
        doodle_do:
          - {id: days, op: label, part: extra, text: '10 × ₦40 = ₦400'}
      - say: 'Collect like terms, so $40d$ plus $10d$ is $50d$.'
        write: '$50d + 400 = 2000$'
      - say: 'Subtract 400 from both sides. 2000 minus 400 is 1600.'
        write: '$50d = 2000 - 400 = 1600$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '+ 400'}, at: '− 400', text: 'across the ='}
      - say: 'Divide both sides by 50. 1600 divided by 50 is 32. So the assistant worked 32 days.'
        write: '$d = \dfrac{1600}{50} = 32$'
        doodle_do:
          - {id: days, op: label, part: astrip, text: '32 days'}
      - say: 'But the question wants his pay, not his days. 10 naira a day for 32 days is 320 naira.'
        write: 'Assistant''s pay $= 10d = 10 \times 32 = ₦320$'
        doodle_do:
          - {id: days, op: label, part: apay, text: '₦320'}
        point:
          - {line: 9, kind: move, from: {line: 8, at: '= 32'}, at: '× [[32]]', text: 'days'}
      - section: 'Check'
        say: 'Check. The painter worked 32 plus 10, which is 42 days, and 40 times 42 is 1680. 1680 plus 320 is 2000, the total given.'
        write: 'Check: $40 \times 42 + 320 = 1680 + 320 = 2000$ ✓'
      - section: 'Answer'
        say: 'Therefore the assistant received ₦320, which is answer choice B.'
        write: '$\therefore$ the assistant received ₦320.00 (B)'
        answer: true
    traps:
      A: 'You went for ₦32. That is the number of DAYS the assistant worked. Multiply by his ₦10 a day to get his pay, ₦320.'
      C: 'You went for ₦800. That would mean 80 days for the assistant and 90 for the painter, and 90 times 40 is 3,600, already over ₦2,000. Solve $40(d + 10) + 10d = 2000$.'
      D: 'You went for ₦1,000, half the total. The painter earns four times as much a day and works longer, so the assistant gets much less than half.'
  25:
    moments:
      - section: 'The question'
        say: 'There are three fractions, and the last denominator is a difference of two squares. Factorise it, and the L.C.M. is staring at you.'
        write: '$\dfrac{x}{x + y} + \dfrac{y}{x - y} - \dfrac{x^{2}}{x^{2} - y^{2}}$'
      - section: 'Solution'
        say: 'We factorise every denominator first, find the L.C.M., then combine the numerators over it.'
        write: 'Solution'
      - say: '$x$ squared minus $y$ squared is a difference of two squares, so it is $x$ plus $y$, times $x$ minus $y$.'
        write: '$x^{2} - y^{2} = (x + y)(x - y)$'
      - say: 'That product already contains the other two denominators, so it is the L.C.M.'
        write: 'L.C.M. $= (x + y)(x - y)$'
      - say: 'L.C.M. over $x$ plus $y$ is $x$ minus $y$, times $x$. L.C.M. over $x$ minus $y$ is $x$ plus $y$, times $y$. L.C.M. over itself is 1, times $x$ squared.'
        write: '$= \dfrac{x(x - y) + y(x + y) - x^{2}}{(x + y)(x - y)}$'
      - say: 'Open the brackets. $x$ times, $x$ minus $y$, is $x$ squared minus $xy$. $y$ times, $x$ plus $y$, is $xy$ plus $y$ squared.'
        write: '$= \dfrac{x^{2} - xy + xy + y^{2} - x^{2}}{(x + y)(x - y)}$'
      - say: 'Collect like terms. Minus $xy$ and plus $xy$ cancel. $x$ squared and minus $x$ squared cancel. Only $y$ squared is left.'
        write: '$= \dfrac{y^{2}}{(x + y)(x - y)}$'
      - say: 'Multiply the denominator back out, to match the options.'
        write: '$= \dfrac{y^{2}}{x^{2} - y^{2}}$'
      - section: 'Check'
        say: 'Take $x$ equals 3 and $y$ equals 2. The question gives 3 over 5, plus 2 over 1, minus 9 over 5.'
        write: '$x = 3,\ y = 2$: $\dfrac{3}{5} + \dfrac{2}{1} - \dfrac{9}{5} = \dfrac{4}{5}$'
      - say: '3 over 5 minus 9 over 5 is negative 6 over 5, and 2 minus 6 over 5 is 4 over 5. Our answer gives 4 over, 9 minus 4, which is also 4 over 5.'
        write: '$\dfrac{2^{2}}{3^{2} - 2^{2}} = \dfrac{4}{5}\ \checkmark$'
      - say: 'Therefore the expression is $y$ squared over, $x$ squared minus $y$ squared, which is option B.'
        write: '$\therefore \dfrac{y^{2}}{x^{2} - y^{2}}$ (B)'
        answer: true
    traps:
      A: 'You went for $\dfrac{x^{2}}{x^{2} - y^{2}}$. That is the last fraction alone, as if the other two cancelled. They add to $\dfrac{x^{2} + y^{2}}{x^{2} - y^{2}}$, and taking away $x^{2}$ leaves $y^{2}$.'
      C: 'You went for $\dfrac{x}{x^{2} - y^{2}}$. When you open the brackets in the numerator, the $x^{2}$ and $xy$ terms all cancel, and what is left is $y^{2}$, not $x$.'
      D: 'You went for $\dfrac{y}{x^{2} - y^{2}}$. Close, but the leftover term is $y$ times $y$, which is $y^{2}$. With $x = 3$ and $y = 2$, your option gives 2 over 5, not 4 over 5.'
  26:
    moments:
      - section: 'The question'
        say: 'We are given $x^{2} + y^{2} + z^{2} = 194$, with $x = 7$ and root $y$ equal to 3. Picture three squares whose areas add to 194. We want $z$.'
        write: 'Solution: $x^{2} + y^{2} + z^{2} = 194$'
        doodle: {name: 'custom:1990_q26_a', id: sqs, caption: 'three squares, areas add to 194'}
      - say: 'List the givens. Be careful, because we are not given $y$ itself, only its square root.'
        write: 'Given: $x = 7,\ \ \sqrt{y} = 3,\ \ z = ?$'
      - section: 'Find y first'
        say: 'To undo a square root, square both sides. 3 squared is 9, so $y$ is 9.'
        write: '$\sqrt{y} = 3 \Rightarrow y = 3^{2} = 9$'
        point:
          - {line: 2, kind: move, from: {line: 1, at: 'y=3'}, at: '32', text: 'square both sides'}
      - section: 'Substitute'
        say: 'Now substitute $x = 7$ and $y = 9$ into the equation.'
        write: '$7^{2} + 9^{2} + z^{2} = 194$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '= 9'}, at: '[[9]]2+z', text: 'y'}
      - say: '7 squared is 49, the first square. 9 squared is 81, the middle square.'
        write: '$49 + 81 + z^{2} = 194$'
        doodle_do:
          - {id: sqs, op: label, part: sqx, text: '49'}
          - {id: sqs, op: label, part: sqy, text: '81'}
      - say: 'Collect the numbers. 49 plus 81 is 130.'
        write: '$130 + z^{2} = 194$'
      - say: 'Subtract 130 from both sides. 194 minus 130 is 64, which is the area left for the last square.'
        write: '$z^{2} = 194 - 130 = 64$'
        doodle_do:
          - {id: sqs, op: label, part: sqz, text: '64'}
        point:
          - {line: 6, kind: move, from: {line: 5, at: '130'}, at: '− 130', text: 'across the ='}
          - {line: 6, kind: highlight, at: '64', to: {doodle: sqs, part: sqz}}
      - say: 'Take the square root of both sides. The square root of 64 is 8, and we take the positive root, as the options do.'
        write: '$z = \sqrt{64} = 8$'
        doodle_do:
          - {id: sqs, op: label, part: zlab, text: 'z = 8'}
      - section: 'Check'
        say: 'To check, put the three squares back in. 49 plus 81 plus 64 is 194, as given.'
        write: 'Check: $7^{2} + 9^{2} + 8^{2} = 49 + 81 + 64 = 194\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore $z$ is 8, option B.'
        write: '$\therefore z = 8$'
        answer: true
    traps:
      A: 'You went for root 10. Then $z^{2}$ would be 10, but $194 - 49 - 81$ is 64. Remember root $y$ is 3, so $y$ is 9 and $y^{2}$ is 81.'
      C: 'You went for 12.2. Its square is about 149, far more than the 64 left for $z^{2}$. Root $y$ is 3, so $y = 9$ and $y^{2} = 81$.'
      D: 'You went for 13.4. Its square is about 180, far more than what is left. With $x^{2} = 49$ and $y^{2} = 81$, $z^{2}$ is 64, so $z$ is 8.'
  27:
    moments:
      - section: 'The question'
        say: 'The terms are log $a$, log $a$ squared, log $a$ cubed and so on. The question says this is an arithmetic progression. We want the sum of the first twenty terms.'
        write: '$S_{20}$ of $\log a,\ \log a^{2},\ \log a^{3},\ \ldots$'
        doodle: {name: 'custom:1990_q27_a', id: stairs, caption: 'twenty steps, each log a higher'}
      - section: 'Solution'
        say: 'Solution. First use a law of logarithms, which says the power inside a log comes out in front, as a multiplier.'
        write: 'Solution: $\log a^{n} = n\log a$'
      - say: 'So the terms are log $a$, 2 log $a$, 3 log $a$, and so on. Each is log $a$ more than the one before.'
        write: 'Terms: $\log a,\ 2\log a,\ 3\log a,\ \ldots$'
      - say: 'The common difference is the second term minus the first, so 2 log $a$ minus log $a$, which is log $a$.'
        write: '$d = 2\log a - \log a = \log a$'
      - say: 'List what is given. The first term is log $a$, $d$ is log $a$, and $n$ is 20.'
        write: 'First term $= \log a,\quad d = \log a,\quad n = 20$'
      - say: 'The sum of the first $n$ terms of an A.P. is $n$ over 2, times, twice the first term plus $n$ minus 1 times $d$.'
        write: '$S_{n} = \dfrac{n}{2}[2(\text{first term}) + (n - 1)d]$'
      - say: 'Now substitute. $n$ is 20, the first term is log $a$, and $d$ is log $a$.'
        write: '$S_{20} = \dfrac{20}{2}[2\log a + (20 - 1)\log a]$'
      - say: '20 over 2 is 10. 20 minus 1 is 19.'
        write: '$= 10[2\log a + 19\log a]$'
      - say: '2 log $a$ plus 19 log $a$ is 21 log $a$.'
        write: '$= 10 \times 21\log a$'
      - say: '10 times 21 is 210.'
        write: '$= 210\log a$'
        doodle_do:
          - {id: stairs, op: label, part: sum, text: '210 log a'}
      - say: 'Now use the same law backwards, so the 210 goes back up as the power.'
        write: '$\therefore\ S_{20} = \log a^{210}$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '210'}, at: 'a210', text: 'up as the power'}
      - section: 'Check'
        say: 'Check with the other formula. The 20th term, the top step, is 20 log $a$. First plus last is 21 log $a$, and a flipped copy of the stairs makes every column that tall.'
        write: 'Check: $S_{20} = \dfrac{20}{2}(\log a + 20\log a) = 10 \times 21\log a\ \checkmark$'
        doodle_do:
          - {id: stairs, op: label, part: last, text: '20 log a'}
          - {id: stairs, op: stage, stage: 'custom:1990_q27_a2', 'on': 'flipped copy'}
          - {id: stairs, op: label, part: twin, text: 'each column: 21 log a'}
      - say: 'Therefore the sum of the first twenty terms is log $a$ to the power 210, which is answer choice D.'
        write: '$\therefore\ S_{20} = \log a^{210}$'
        answer: true
    traps:
      A: 'You went for log $a$ to the 20. That is the twentieth term, $T_{20}$. The question asks for the sum of the first twenty terms, $S_{20}$.'
      B: 'You went for log $a$ to the 21. That is only the bracket, 21 log $a$. The formula also multiplies by $n$ over 2, which is 10, giving 210 log $a$.'
      C: 'You went for log $a$ to the 200. That is 10 times the last term, 20 log $a$, alone. The bracket must be 2 log $a$ plus 19 log $a$, which is 21 log $a$, and 10 times that is 210 log $a$.'
  28:
    moments:
      - section: 'The question'
        say: 'The series is 3, 6, 12 and so on, for 18 terms. The options are all written with powers of 2, so we leave the answer in that form. Watch the power and the bracket.'
        write: 'Sum of the first 18 terms of $3,\ 6,\ 12,\ \ldots$'
        doodle: {name: 'custom:1990_q28_a', id: piles, caption: '3, 6, 12, … as piles'}
      - section: 'Solution'
        say: 'Solution. Divide each term by the one before. 6 over 3 is 2, and 12 over 6 is 2. The ratio is the same each time, so this is a G.P.'
        write: 'Solution: $r = \dfrac{6}{3} = \dfrac{12}{6} = 2$'
        doodle_do:
          - {id: piles, op: circle, part: ratio}
      - say: 'List what is given. The first term $a$ is 3, $r$ is 2, and $n$ is 18.'
        write: '$a = 3,\quad r = 2,\quad n = 18$'
      - say: '$r$ is bigger than 1, so we use this form of the sum of $n$ terms of a G.P., which is $a$, times $r$ to the $n$ minus 1, over $r$ minus 1.'
        write: '$S_{n} = \dfrac{a(r^{n} - 1)}{r - 1}$'
      - say: 'Substitute $a$ equals 3, $r$ equals 2 and $n$ equals 18.'
        write: '$S_{18} = \dfrac{3(2^{18} - 1)}{2 - 1}$'
      - say: 'On the bottom, 2 minus 1 is 1.'
        write: '$= \dfrac{3(2^{18} - 1)}{1}$'
      - say: 'Dividing by 1 changes nothing. There is no need to work out 2 to the 18, because the options keep the power.'
        write: '$\therefore\ S_{18} = 3(2^{18} - 1)$'
      - section: 'Check'
        say: 'Check the formula on the first three terms. With $n$ equal to 3, 2 cubed is 8, 8 minus 1 is 7, and 3 times 7 is 21.'
        write: 'Check: $S_{3} = 3(2^{3} - 1) = 3 \times 7 = 21$'
      - say: 'Adding the first three piles directly, 3 plus 6 plus 12 is also 21. The formula works.'
        write: '$3 + 6 + 12 = 21\ \checkmark$'
        doodle_do:
          - {id: piles, op: label, part: piles, text: '3 + 6 + 12 = 21'}
        point:
          - {line: 8, kind: highlight, at: '= 21', to: {doodle: piles, part: piles}}
      - say: 'Therefore the sum of the first 18 terms is 3 times, 2 to the 18 minus 1, which is answer choice D.'
        write: '$\therefore\ S_{18} = 3(2^{18} - 1)$'
        doodle_do:
          - {id: piles, op: label, part: more, text: '3(2¹⁸ − 1)'}
        answer: true
    traps:
      A: 'You went for 3 times, 2 to the 17 minus 1. The power 17 is $n$ minus 1, which belongs to the $n$th term, $ar^{n - 1}$. The sum formula uses $r$ to the power $n$, so the power is 18.'
      B: 'You went for 3 times 2 to the 18, minus 1. The bracket is in the wrong place, because the 3 multiplies the whole of 2 to the 18 minus 1.'
      C: 'You went for 3 times, 2 to the 18 plus 1. The formula has $r$ to the $n$ minus 1. Test it with three terms. 3 times 9 is 27, but the sum is 21.'
  29:
    moments:
      - section: 'The question'
        say: 'We need the equation of the quadratic drawn in the graph. Read the roots and the $y$-intercept off the graph, then build the equation from its factors.'
        write: 'Find the quadratic from the graph'
      - section: 'Solution'
        say: 'Solution. The curve cuts the $x$-axis at negative 1 and at 2. Those are the roots, where $y$ is 0.'
        write: 'Solution: roots $x = -1,\ x = 2$'
        point:
          - {figure: 0, kind: circle, target: '−1', text: 'root'}
          - {figure: 0, kind: circle, target: {x: 220, y: 150}, text: 'root'}
      - say: 'By the factor theorem, a root at negative 1 gives the factor $x + 1$, and a root at 2 gives the factor $x - 2$.'
        write: 'Factors: $(x + 1)$ and $(x - 2)$'
      - say: 'Let the equation be $k$ times the two factors, where $k$ is a number to be found.'
        write: 'Let $y = k(x + 1)(x - 2)$'
      - say: 'The curve cuts the $y$-axis at 2. So when $x$ is 0, $y$ is 2. Substitute.'
        write: 'At $(0,\ 2)$: $\ 2 = k(0 + 1)(0 - 2)$'
        point:
          - {figure: 0, kind: circle, target: {x: 120, y: 50}, text: 'y = 2'}
      - say: '0 plus 1 is 1, and 0 minus 2 is negative 2. So 2 equals negative $2k$.'
        write: '$2 = -2k$'
      - say: 'Divide both sides by negative 2.'
        write: '$k = \dfrac{2}{-2} = -1$'
        point:
          - {figure: 0, kind: label, target: {x: 145, y: 37}, text: 'opens downwards'}
      - say: 'Substitute $k$ equals negative 1 back.'
        write: '$y = -(x + 1)(x - 2)$'
      - say: 'Expand the brackets. $x$ times $x$ is $x^{2}$, $x$ times negative 2 is negative $2x$, 1 times $x$ is $x$, and 1 times negative 2 is negative 2.'
        write: '$y = -(x^{2} - 2x + x - 2) = -(x^{2} - x - 2)$'
      - say: 'The minus sign in front changes every sign inside the bracket.'
        write: '$\therefore\ y = -x^{2} + x + 2$'
      - section: 'Check'
        say: 'Check the shape. The coefficient of $x^{2}$ is negative, so the curve opens downwards, as in the graph. Then check the root at 2, and negative 4 plus 2 plus 2 is 0.'
        write: 'Check: $-(2)^{2} + 2 + 2 = -4 + 4 = 0\ \checkmark$'
      - say: 'Therefore the equation is $y = -x^{2} + x + 2$, which is answer choice D.'
        write: '$\therefore\ y = -x^{2} + x + 2$'
        answer: true
    traps:
      A: 'You went for $y = x^{2} + x - 2$. That opens upwards and its roots are 1 and negative 2. The curve in the graph opens downwards, with roots negative 1 and 2.'
      B: 'You went for $y = x^{2} - x - 2$. Its roots, negative 1 and 2, are right, but that is $k = 1$, so it opens upwards and cuts the $y$-axis at negative 2. The $y$-intercept 2 gives $k = -1$.'
      C: 'You went for $y = -x^{2} - x + 2$. It opens the right way, but its roots are 1 and negative 2, because the signs of the factors are swapped. A root at negative 1 gives the factor $x + 1$.'
  30:
    moments:
      - section: 'The question'
        say: 'At what value of $x$ is the function a minimum? This time the question wants the $x$ of the lowest point, not the value of the function.'
        write: '$y = x^{2} + x + 1$'
        diagram:
          id: g
          kind: graph
          x: [-3, 2]
          y: [-1, 5]
          plots:
            - {fn: 'x^2 + x + 1', label: 'y = x² + x + 1', colour: blue}
      - section: 'Solution'
        say: 'Solution. Differentiate term by term. $x$ squared gives $2x$, $x$ gives 1, and the constant 1 gives 0.'
        write: '$\dfrac{dy}{dx} = 2x + 1$'
      - section: 'Turning point'
        say: 'At the turning point, the gradient is zero. So we write that at the turning point, $\dfrac{dy}{dx}$ equals 0.'
        'on': 'turning point'
        write: 'At turning point, $\dfrac{dy}{dx} = 0$'
      - say: 'So $2x$ plus 1 equals 0.'
        write: '$2x + 1 = 0$'
        point:
          - {line: 3, kind: move, from: {line: 1, at: '= [[2x + 1]]'}, at: '2x + 1', text: 'dy/dx'}
      - say: 'Subtract 1 from both sides. $2x$ equals minus 1.'
        write: '$2x = -1$'
      - say: 'Divide both sides by 2. $x$ equals minus 1 over 2.'
        write: '$x = -\dfrac{1}{2}$'
      - section: 'Second derivative'
        say: 'Is it a minimum? Differentiate again. $2x$ gives 2, and the 1 gives 0.'
        write: '$\dfrac{d^{2}y}{dx^{2}} = 2$'
      - say: 'The second derivative is positive, greater than zero. A positive second derivative means a minimum, so the curve is a valley, as on the graph.'
        'on': 'positive second'
        write: '$\dfrac{d^{2}y}{dx^{2}} = 2 > 0$, $\ \therefore$ minimum'
        diagram_do:
          - {id: g, op: vertex, part: 'plot:1', text: 'minimum', on: valley}
      - section: 'Check'
        say: 'Here is an exam tip, as a check. For a quadratic, the turning point is at $x$ equals minus $b$ over $2a$. Here $a$ is 1 and $b$ is 1.'
        write: 'Exam tip: $x = -\dfrac{b}{2a} = -\dfrac{1}{2(1)} = -\dfrac{1}{2}\ \checkmark$'
      - say: 'It agrees. Therefore the function is a minimum at $x$ equals minus 1 over 2, which is answer choice B.'
        write: '$\therefore$ minimum at $x = -\dfrac{1}{2}$'
        answer: true
        diagram_do:
          - {id: g, op: label, part: 'point:1', text: 'x = −½', colour: green}
    traps:
      A: 'You went for minus 1. That is $2x = -1$ without the last step. Divide both sides by 2, and $x$ is minus 1 over 2.'
      C: 'You went for a half. That drops the minus sign. From $2x + 1 = 0$, $2x$ is minus 1, so $x$ is minus 1 over 2.'
      D: 'You went for 1. At $x = 1$ the gradient $2x + 1$ is 3, not 0, so it is not a turning point. The gradient is 0 at $x = -\tfrac{1}{2}$.'
  31:
    moments:
      - section: 'The question'
        say: 'We have a trapezium whose short parallel side is a third of the long one. Give the long side a letter, and the area formula becomes one simple equation.'
        write: '$A = 73.5\ \text{cm}^{2}$, $h = 10.5$ cm, $QR = \tfrac{1}{3}PS$'
        point:
          - {figure: 0, kind: highlight, target: QR}
          - {figure: 0, kind: highlight, target: PS, text: 'parallel'}
          - {figure: 0, kind: circle, target: '10.5 cm', text: 'height'}
      - section: 'Solution'
        say: 'Solution. We want $PS$, so let $PS$ be $s$ centimetres. Then $QR$, a third of it, is $s$ over 3.'
        write: 'Let $PS = s$ cm, then $QR = \dfrac{s}{3}$ cm'
        point:
          - {figure: 0, kind: label, target: PS, text: 's'}
          - {figure: 0, kind: label, target: QR, text: 's/3'}
      - say: 'The area of a trapezium is half the sum of the parallel sides, times the height.'
        write: 'Area of trapezium $= \tfrac{1}{2}(a + b)h$'
      - say: 'Now substitute 73.5 for the area, $s$ and $s$ over 3 for the parallel sides, and 10.5 for the height.'
        write: '$73.5 = \tfrac{1}{2}\left(s + \dfrac{s}{3}\right) \times 10.5$'
      - say: 'Inside the bracket, $s$ is $3s$ over 3. $3s$ over 3 plus $s$ over 3 is $4s$ over 3.'
        write: '$73.5 = \tfrac{1}{2} \times \dfrac{4s}{3} \times 10.5$'
      - say: 'Half of $4s$ over 3 is $2s$ over 3.'
        write: '$73.5 = \dfrac{2s}{3} \times 10.5$'
      - say: '10.5 divided by 3 is 3.5, and 2 times 3.5 is 7. So the right side is $7s$.'
        write: '$73.5 = 7s$'
      - say: 'Divide both sides by 7. 73.5 divided by 7 is 10.5.'
        write: '$s = \dfrac{73.5}{7} = 10.5$'
      - section: 'Check'
        say: 'Check. $QR$ is a third of 10.5, which is 3.5. The parallel sides add up to 14, half of 14 is 7, and 7 times 10.5 is 73.5, the area we were given.'
        write: '$\tfrac{1}{2}(10.5 + 3.5) \times 10.5 = 73.5$ $\checkmark$'
      - say: 'Therefore $PS$ is 10 and a half centimetres, option D.'
        write: '$\therefore PS = 10\tfrac{1}{2}$ cm (D)'
        answer: true
    traps:
      A: 'You went for 21 cm. Then $QR$ would be 7, and the area would be half of 28 times 10.5, which is 147, double the real area. Solving $7s = 73.5$ gives 10.5.'
      B: 'You went for 17 and a half cm. Then the area would be 7 times 17.5, which is 122.5, not 73.5. The formula simplifies to $7s = 73.5$, so $s = 10.5$.'
      C: 'You went for 14 cm. That is $PS + QR$, the sum of the parallel sides. The question wants $PS$ alone, which is 10.5 cm.'
  32:
    moments:
      - section: 'The question'
        say: 'Picture an ant walking all the way round a slice of pizza, down one straight edge, round the curved crust, and back up the other edge. That walk is the perimeter of a sector.'
        write: 'Find the perimeter of the sector.'
        doodle: {name: 'custom:1990_q32_a', id: slice, caption: 'an ant walks round the slice'}
        doodle_do:
          - {id: slice, op: move, part: ant, path: walk, 'on': 'walking all the way round'}
      - say: 'Write Solution, then draw the sector with centre O, two radii of 10.5 cm, and the angle of 48 degrees between them.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: arc, target: AOB, text: '48°', 'on': '48 degrees'}
      - section: 'What we know'
        say: 'List the givens. The radius r is 10.5 cm, the angle theta is 48 degrees, and pi is 22 over 7.'
        write: '$r = 10.5$ cm, $\theta = 48^{\circ}$, $\pi = \dfrac{22}{7}$'
      - say: 'The boundary of a sector is the two radii plus the arc. So the perimeter is 2 r plus L, where L is the length of the arc.'
        write: 'Perimeter $= 2r + L$'
        point:
          - {figure: sketch, kind: highlight, target: OA, text: 'r', 'on': 'two radii'}
          - {figure: sketch, kind: highlight, target: OB, text: 'r', 'on': 'two radii'}
          - {figure: sketch, kind: circle, target: '?', text: 'arc L', 'on': 'plus the arc'}
      - section: 'The arc'
        say: 'The length of arc is L equals theta over 360, times 2 pi r. Theta over 360 is the fraction of the whole circle the sector takes.'
        write: '$L = \dfrac{\theta}{360} \times 2\pi r$'
      - say: 'Substitute, so theta is 48, pi is 22 over 7 and r is 10.5.'
        write: '$L = \dfrac{48}{360} \times 2 \times \dfrac{22}{7} \times 10.5$'
        point:
          - {line: 5, kind: move, from: {line: 2, at: '48'}, at: '360[[48]]', text: 'θ', 'on': 'theta is 48'}
          - {line: 5, kind: move, from: {line: 2, at: '10.5'}, at: '× 10.5', text: 'r', 'on': 'r is 10.5'}
      - say: 'Simplify. For 48 over 360, divide top and bottom by 24 to get 2 over 15. And cancel the 7 into 10.5, which gives 1.5.'
        write: '$= \dfrac{2}{15} \times 2 \times 22 \times 1.5$'
      - say: '2 times 22 is 44, and 44 times 1.5 is 66. That 66 is the whole circumference.'
        write: '$= \dfrac{2}{15} \times 66$'
      - say: '2 times 66 is 132, and 132 divided by 15 is 8.8.'
        write: '$= \dfrac{132}{15} = 8.8$ cm'
        doodle_do:
          - {id: slice, op: label, part: crust, text: '8.8 cm', 'on': 'is 8.8'}
        point:
          - {figure: sketch, kind: label, target: '?', text: '8.8 cm', 'on': 'is 8.8'}
      - section: 'The perimeter'
        say: 'Now back to the perimeter, which is 2 times 10.5, plus 8.8.'
        write: 'Perimeter $= 2(10.5) + 8.8$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '8.8'}, at: '+ 8.8', text: 'arc', 'on': 'plus 8.8'}
      - say: '2 times 10.5 is 21, and 21 plus 8.8 is 29.8.'
        write: '$= 21 + 8.8 = 29.8$'
      - say: 'Therefore the perimeter of the sector is 29.8 centimetres.'
        write: '$\therefore$ perimeter $= 29.8$ cm'
        doodle_do:
          - {id: slice, op: label, part: edge, text: '21 + 8.8 = 29.8 cm', 'on': 'Therefore'}
      - section: 'Check'
        say: 'Check the arc. 360 over 48 is 7.5, so 7.5 such slices make the whole circle. 7.5 times 8.8 is 66, the circumference 2 pi r.'
        write: 'Check: $7.5 \times 8.8 = 66 = 2 \times \dfrac{22}{7} \times 10.5$ ✓'
      - section: 'Answer'
        say: 'So the perimeter is 29.8 cm, which is answer choice D.'
        write: '$\therefore$ perimeter $= 29.8$ cm (D)'
        answer: true
    traps:
      A: 'You went for 8.8 cm. That is the arc L on its own. The perimeter is 2 r plus L, so add the two radii, and 21 plus 8.8 is 29.8 cm.'
      B: 'You went for 25.4 cm. Recheck the arc. L is 48 over 360, times 2 times 22 over 7 times 10.5, which is 8.8. Then 2 r plus L is 21 plus 8.8, which is 29.8 cm.'
      C: 'You went for 25.6 cm. The two radii give 2 times 10.5, which is 21, and the arc is 2 over 15 of 66, which is 8.8. The total is 29.8 cm.'
  33:
    moments:
      - section: 'The question'
        say: 'There are three equal lengths from one point, $S$. That means a hidden circle with $S$ at its centre, and one circle theorem finishes the question.'
        write: '$PS = QS = RS$, $\angle QSR = 100^{\circ}$, $\angle QPR = ?$'
        point:
          - {figure: 0, kind: arc, target: QSR, text: '100°'}
      - section: 'Solution'
        say: 'Solution. $S$ is the same distance from $P$, $Q$ and $R$. So we re-draw the diagram with the circle, centre $S$, through all three points.'
        write: 'Solution'
        show_sketch: true
      - say: 'So $SP$, $SQ$ and $SR$ are radii of this circle.'
        write: '$SP = SQ = SR$ (radii)'
        point:
          - {figure: sketch, kind: highlight, target: SP, text: 'r'}
          - {figure: sketch, kind: highlight, target: SQ, text: 'r'}
          - {figure: sketch, kind: highlight, target: SR, text: 'r'}
      - say: 'Angle $QSR$ is at the centre, and angle $QPR$ is at the circumference. Both stand on the chord $QR$. The angle at the centre is twice the angle at the circumference.'
        write: '$\angle QSR = 2 \times \angle QPR$ ($\angle$ at centre $= 2 \times \angle$ at circumference)'
        point:
          - {figure: sketch, kind: arc, target: QSR, text: '100°'}
          - {figure: sketch, kind: arc, target: QPR, text: '?'}
      - say: 'Put in the 100 degrees.'
        write: '$100^{\circ} = 2 \times \angle QPR$'
      - say: 'Divide both sides by 2. Half of 100 is 50.'
        write: '$\angle QPR = \dfrac{100^{\circ}}{2} = 50^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: QPR, text: '50°'}
      - section: 'Check'
        say: 'Check without the theorem, using isosceles triangles. In triangle $QSR$, the base angles at $Q$ and $R$ are 180 minus 100, halved, which is 40 each.'
        write: '$\angle SQR = \angle SRQ = 40^{\circ}$ (base $\angle$s of isos. $\triangle$)'
      - say: 'Let angle $SPQ$ be $a$ and angle $SPR$ be $b$. Triangles $SPQ$ and $SPR$ are isosceles too, so angle $SQP$ is $a$ and angle $SRP$ is $b$.'
        write: '$\angle SQP = a$, $\angle SRP = b$ (base $\angle$s of isos. $\triangle$s)'
      - say: 'Triangle $PQR$ has $a$ plus $b$ at $P$, $a$ plus 40 at $Q$, and $b$ plus 40 at $R$. They add up to 180.'
        write: '$(a + b) + (a + 40) + (b + 40) = 180$ ($\angle$ sum of $\triangle$)'
      - say: 'Collect terms. $2a$ plus $2b$ plus 80 is 180, so $2a$ plus $2b$ is 100. Angle $QPR$ is $a$ plus $b$, half of that, so 50.'
        write: '$2(a + b) = 100$, so $\angle QPR = a + b = 50^{\circ}$ $\checkmark$'
      - say: 'Therefore angle $QPR$ is 50 degrees, option B.'
        write: '$\therefore \angle QPR = 50^{\circ}$ (B)'
        answer: true
    traps:
      A: 'You went for 40 degrees. That is a base angle of triangle $QSR$, which is 180 minus 100, halved. It is the angle at $Q$ or $R$, not at $P$.'
      C: 'You went for 80 degrees, which is 180 minus 100, the two base angles of triangle $QSR$ together. Angle $QPR$ is at the circumference, so it is half of 100, which is 50 degrees.'
      D: 'You went for 100 degrees. That is the angle at the centre, $S$. The angle at the circumference on the same chord is half of it, which is 50 degrees.'
  34:
    moments:
      - section: 'The question'
        say: 'We have a small triangle inside a big one, with a pair of equal angles marked. These are similar triangles, so match the angles first, then the sides.'
        write: '$XP = 4$, $XQ = 5$, $PQ = QY = 3$ (cm), $ZY = ?$'
        point:
          - {figure: 0, kind: arc, target: XQP}
          - {figure: 0, kind: arc, target: XZY, text: 'equal'}
      - section: 'Solution'
        say: 'Solution. We compare the small triangle $XQP$ with the big triangle $XZY$, angle by angle.'
        write: 'Solution'
      - say: 'Angle $XQP$ equals angle $XZY$, and the question gives us this pair.'
        write: '$\angle XQP = \angle XZY$ (given)'
      - say: 'The angle at $X$ belongs to both triangles.'
        write: '$\angle QXP = \angle ZXY$ (common)'
        point:
          - {figure: 0, kind: arc, target: ZXY, text: 'common'}
      - say: 'Two pairs of angles are equal, so the third pair must be equal too, because each triangle adds up to 180.'
        write: '$\angle XPQ = \angle XYZ$ ($\angle$ sum of $\triangle$)'
      - say: 'The triangles are equiangular, so they are similar. Keep the letters in matching order, $X$ with $X$, $Q$ with $Z$ and $P$ with $Y$.'
        write: '$\triangle XQP \;|||\; \triangle XZY$ (equiangular)'
      - say: 'So all three pairs of matching sides are in the same ratio.'
        write: '$\dfrac{XQ}{XZ} = \dfrac{QP}{ZY} = \dfrac{XP}{XY}$'
      - say: '$XY$ is $XQ$ plus $QY$, so 5 plus 3 is 8 centimetres.'
        write: '$XY = XQ + QY = 5 + 3 = 8$ cm'
        point:
          - {figure: 0, kind: label, target: XY, text: '8 cm'}
      - say: 'We know $QP$, $XP$ and $XY$, and we want $ZY$. So take the second and third ratios.'
        write: '$\dfrac{QP}{ZY} = \dfrac{XP}{XY}$'
      - say: 'Now substitute. $QP$ is 3, $XP$ is 4 and $XY$ is 8.'
        write: '$\dfrac{3}{ZY} = \dfrac{4}{8}$'
      - say: 'Cross-multiply. 4 times $ZY$ equals 3 times 8, which is 24.'
        write: '$4 \times ZY = 3 \times 8 = 24$'
      - say: 'Divide both sides by 4. 24 divided by 4 is 6.'
        write: '$ZY = \dfrac{24}{4} = 6$ cm'
        point:
          - {figure: 0, kind: highlight, target: ZY, text: '6 cm'}
      - section: 'Check'
        say: 'Check with the first ratio. $XQ$ over $XZ$ is also 4 over 8, so $XZ$ is 10.'
        write: '$\dfrac{5}{XZ} = \dfrac{4}{8}$, so $XZ = 10$ cm'
      - say: 'The small triangle has sides 3, 4 and 5, and the big one has 6, 8 and 10. Every side is doubled, as it should be.'
        write: '$3, 4, 5 \;\to\; 6, 8, 10$ (scale factor 2) $\checkmark$'
      - say: 'Therefore $ZY$ is 6 centimetres, option B.'
        write: '$\therefore ZY = 6$ cm (B)'
        answer: true
    traps:
      A: 'You went for 8 cm. That is $XY$, used on the way. $ZY$ matches $QP$, and 3 over $ZY$ equals 4 over 8 gives 6.'
      C: 'You went for 4 cm. That is $XP$. The side that matches $ZY$ is $QP$, 3, and the big triangle is twice the size, so $ZY$ is 6.'
      D: 'You went for 3 cm. That treats the triangles as the same size. They are similar with sides doubled, so $ZY$ is twice $QP$, which is 6 cm.'
  35:
    moments:
      - section: 'The question'
        say: 'The diagonals of a rhombus cut it into four right-angled triangles. Halve the diagonals first, then use Pythagoras.'
        write: 'Diagonals $8$ cm and $6$ cm, side $= ?$'
      - section: 'Solution'
        say: 'Solution. Let me draw the rhombus $ABCD$, with diagonals $AC$, 8 centimetres, and $BD$, 6 centimetres, crossing at $O$.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '8 cm'}
          - {figure: sketch, kind: circle, target: '6 cm'}
      - say: 'The diagonals of a rhombus bisect each other at right angles. So $AO$ is half of 8, which is 4.'
        write: '$|AO| = \tfrac{1}{2} \times 8 = 4$ cm (diagonals of rhombus bisect at $90^{\circ}$)'
        point:
          - {figure: sketch, kind: label, target: AO, text: '4'}
      - say: 'And $BO$ is half of 6, which is 3. The angle at $O$ is 90 degrees.'
        write: '$|BO| = \tfrac{1}{2} \times 6 = 3$ cm'
        point:
          - {figure: sketch, kind: label, target: BO, text: '3'}
          - {figure: sketch, kind: arc, target: AOB, text: '90°'}
      - say: 'In triangle $AOB$, the side $AB$ faces the right angle, so it is the hypotenuse.'
        write: '$|AB|^{2} = |AO|^{2} + |BO|^{2}$ (Pythagoras)'
        point:
          - {figure: sketch, kind: highlight, target: AB, text: 'hypotenuse'}
      - say: 'Substitute 4 and 3.'
        write: '$|AB|^{2} = 4^{2} + 3^{2}$'
      - say: '4 squared is 16 and 3 squared is 9. 16 plus 9 is 25.'
        write: '$|AB|^{2} = 16 + 9 = 25$'
      - say: 'Take the square root. The square root of 25 is 5.'
        write: '$|AB| = \sqrt{25} = 5$ cm'
        point:
          - {figure: sketch, kind: label, target: AB, text: '5 cm'}
      - section: 'Check'
        say: 'Check by working back, because 5 squared minus 4 squared should give 3 squared. 25 minus 16 is 9, and 9 is 3 squared.'
        write: '$5^{2} - 4^{2} = 25 - 16 = 9 = 3^{2}$ $\checkmark$'
      - say: 'Therefore each side of the rhombus is 5 centimetres, option B.'
        write: '$\therefore$ side $= 5$ cm (B)'
        answer: true
    traps:
      A: 'You went for 8 cm. That is the longer diagonal, not a side. Halve both diagonals to 4 and 3, then Pythagoras gives 5. The whole diagonals would give 10, which is not an option either.'
      C: 'You went for 4 cm. That is half of the longer diagonal, one short side of the right-angled triangle. The side of the rhombus is the hypotenuse, which is 5 cm.'
      D: 'You went for 3 cm. That is half of the shorter diagonal. The side of the rhombus is the hypotenuse, the square root of 16 plus 9, which is 5.'
  36:
    moments:
      - section: 'The question'
        say: 'Each interior angle is 140 degrees, and we want the number of sides. With a regular polygon, the short road always goes through the exterior angle.'
        write: 'Int. $\angle = 140^{\circ}$, $n = ?$'
      - section: 'Solution'
        say: 'Solution. Let me draw one corner of the polygon. Inside is the interior angle, 140 degrees. Extend one side, and the angle outside is the exterior angle.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '140°', text: 'interior'}
          - {figure: sketch, kind: circle, target: 'ext.', text: 'exterior'}
      - say: 'At each corner, the interior and exterior angles lie on a straight line, so they add up to 180 degrees. The reason is angles on a straight line.'
        write: 'Int. $\angle$ + Ext. $\angle = 180^{\circ}$ ($\angle$s on a str. line)'
      - say: 'So the exterior angle is 180 minus 140.'
        write: 'Ext. $\angle = 180^{\circ} - 140^{\circ}$'
      - say: '180 minus 140 is 40 degrees. The polygon is regular, so every exterior angle is 40.'
        write: 'Ext. $\angle = 40^{\circ}$'
        point:
          - {figure: sketch, kind: label, target: 'ext.', text: '40°'}
      - say: 'Walk once round any polygon and you turn through one full turn, so the exterior angles add up to 360. The number of sides is 360 divided by one exterior angle.'
        write: '$n = \dfrac{360^{\circ}}{\text{ext. } \angle}$ (sum of ext. $\angle$s $= 360^{\circ}$)'
        doodle: {name: 'custom:1990_q36_a', id: walk, caption: 'walk round, turning at each corner'}
        doodle_do:
          - {id: walk, op: move, part: walker, path: walk}
          - {id: walk, op: label, part: full, text: '360°'}
      - say: 'Put in 40 degrees for the exterior angle.'
        write: '$n = \dfrac{360}{40}$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '40∘'}, at: '40', text: 'ext. angle'}
      - say: '360 divided by 40 is 9. The polygon has 9 sides, because 9 turns of 40 degrees make the full turn.'
        write: '$n = 9$'
        doodle_do:
          - {id: walk, op: pulse, part: full}
        point:
          - {figure: sketch, kind: label, target: 'n = ? sides', text: '9 sides'}
      - section: 'Check'
        say: 'Check with the interior angles. Their sum is $n$ minus 2, times 180 degrees.'
        write: 'Sum of int. $\angle$s $= (n - 2) \times 180^{\circ}$'
      - say: 'For 9 sides, 9 minus 2 is 7, and 7 times 180 is 1260 degrees.'
        write: '$= (9 - 2) \times 180^{\circ} = 1260^{\circ}$'
      - say: 'And with 9 corners of 140 degrees each, 9 times 140 is also 1260. It matches.'
        write: '$9 \times 140^{\circ} = 1260^{\circ}\ \checkmark$'
      - say: 'Therefore the polygon has 9 sides, option A.'
        write: '$\therefore n = 9$ (A)'
        answer: true
    traps:
      B: 'You went for 8. A regular 8-sided polygon has exterior angles of 360 over 8, which is 45, so its interior angles are 180 minus 45, which is 135, not 140.'
      C: 'You went for 7. Seven sides give exterior angles of about 51 degrees and interior angles of about 129, not 140. Here the exterior angle is 40, and 360 over 40 is 9.'
      D: 'You went for 5. A regular pentagon has exterior angles of 72 and interior angles of 108 degrees. For 140, the exterior angle is 40, and 360 over 40 is 9.'
  37:
    moments:
      - section: 'The question'
        say: 'We have four points on a circle, and two lines that meet outside it at $T$. One triangle, then one cyclic quadrilateral, carry the given angles across to $x$.'
        write: '$\angle SPQ = 81^{\circ}$, $\angle PTS = 22^{\circ}$, $x = ?$'
        point:
          - {figure: 0, kind: arc, target: SPQ, text: '81°'}
          - {figure: 0, kind: arc, target: PTS, text: '22°'}
          - {figure: 0, kind: circle, target: x, text: '?'}
      - section: 'Solution'
        say: 'Solution. First the big triangle $PST$, where two angles are known. Then the cyclic quadrilateral $PQRS$. Each line gets its reason in brackets.'
        write: 'Solution'
      - say: 'In triangle $PST$, the three angles add up to 180 degrees. The reason is the angle sum of a triangle.'
        write: '$\angle PST + 81^{\circ} + 22^{\circ} = 180^{\circ}$ ($\angle$ sum of $\triangle$)'
      - say: '81 plus 22 is 103. Take it to the other side, so 180 minus 103.'
        write: '$\angle PST = 180^{\circ} - 103^{\circ}$'
      - say: '180 minus 103 is 77 degrees.'
        write: '$\angle PST = 77^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: PST, text: '77°'}
      - say: '$R$ lies on the line $ST$, so angle $PSR$ is the same angle as $PST$. It is the angle of the quadrilateral at $S$, which is 77 degrees.'
        write: '$\angle PSR = \angle PST = 77^{\circ}$ ($R$ on $ST$)'
        point:
          - {figure: 0, kind: highlight, target: ST, text: 'S, R, T in a line'}
      - say: '$P$, $Q$, $R$ and $S$ lie on the circle, so $PQRS$ is a cyclic quadrilateral. $x$ at $Q$ is opposite the angle at $S$. The reason is that opposite angles of a cyclic quadrilateral add up to 180.'
        write: '$x + \angle PSR = 180^{\circ}$ (opp. $\angle$s of cyclic quad.)'
        point:
          - {figure: 0, kind: circle, target: x, text: 'opposite S'}
      - say: 'Put in the 77 degrees we found at $S$.'
