          - {line: 4, kind: move, from: {line: 2, at: 'a = [[3]]'}, at: '[[3]](', text: 'a'}
          - {line: 4, kind: move, from: {line: 2, at: 'r = [[2]]'}, at: '[[2]]18', text: 'r'}
      - say: 'On the bottom, 2 minus 1 is 1.'
        write: '$= \dfrac{3(2^{18} - 1)}{1}$'
      - say: 'Dividing by 1 changes nothing. There is no need to work out 2 to the 18, because every option is written with powers of 2.'
        write: '$= 3(2^{18} - 1)$'
      - say: 'Let''s test the formula on the first three terms. With $n = 3$ it gives 3 times 2 cubed minus 1. 2 cubed is 8, 8 minus 1 is 7, and 3 times 7 is 21.'
        write: 'Test $n = 3$: $3(2^{3} - 1) = 3(8 - 1) = 3 \times 7 = 21$'
      - say: 'Adding the first three terms directly, 3 plus 6 plus 12 is also 21. The formula works.'
        write: '$3 + 6 + 12 = 21\ \checkmark$'
      - say: 'So the sum is 3 times $2^{18}$ minus 1, which is answer choice D.'
        write: 'So $S_{18} = 3(2^{18} - 1)$'
        answer: true
    traps:
