# UTME 1990 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1990.yaml. Answers match that file.
format_version: 1
exam_year: 1990
lessons:
  1:
    moments:
      - say: 'We''re asked to simplify a fraction built from mixed numbers. On top, 4 and three-quarters minus 6 and a quarter. Underneath, 4 and a fifth of 1 and a quarter.'
        write: '$\dfrac{4\tfrac{3}{4} - 6\tfrac{1}{4}}{4\tfrac{1}{5} \text{ of } 1\tfrac{1}{4}}$'
      - say: 'The first thing we need to do is deal with the top and the bottom separately. And the safest way to work with mixed numbers is to turn each one into an improper fraction.'
      - say: 'Start with 4 and three-quarters. 4 times 4 is 16, plus 3 is 19. So it''s 19 quarters.'
        write: '$4\tfrac{3}{4} = \tfrac{19}{4}$'
      - say: 'Now 6 and a quarter. 6 times 4 is 24, plus 1 is 25. So it''s 25 quarters.'
        write: '$6\tfrac{1}{4} = \tfrac{25}{4}$'
      - say: 'The top is 19 quarters minus 25 quarters. The denominators match, so we subtract the numerators. 19 minus 25 is negative 6.'
        write: '$\tfrac{19}{4} - \tfrac{25}{4} = -\tfrac{6}{4}$'
      - say: 'Divide top and bottom by 2, and negative 6 over 4 becomes negative 3 over 2.'
        write: '$-\tfrac{6}{4} = -\tfrac{3}{2}$'
      - say: 'Now the bottom. In mathematics, the word "of" means multiply.'
        write: '$4\tfrac{1}{5} \times 1\tfrac{1}{4}$'
      - say: '4 and a fifth: 4 times 5 is 20, plus 1 is 21, so 21 fifths. And 1 and a quarter is 5 quarters.'
        write: '$\tfrac{21}{5} \times \tfrac{5}{4}$'
      - say: 'The 5 on top cancels with the 5 underneath, leaving 21 over 4.'
        write: '$= \tfrac{21}{4}$'
      - say: 'So the whole fraction is negative 3 over 2, divided by 21 over 4.'
        write: '$-\tfrac{3}{2} \div \tfrac{21}{4}$'
      - say: 'To divide by a fraction, we flip it and multiply. 21 over 4 becomes 4 over 21.'
        write: '$-\tfrac{3}{2} \times \tfrac{4}{21}$'
      - say: 'Cancel before multiplying. 3 goes into 21 seven times, and 2 goes into 4 twice.'
        write: '$-\tfrac{1}{1} \times \tfrac{2}{7}$'
      - say: 'So the value is negative 2 over 7, which is answer choice B.'
        write: '$= -\tfrac{2}{7}$'
        answer: true
    traps:
      A: 'You went for negative 7 and seven-eighths. That''s negative 3 over 2 TIMES 21 over 4, which is negative 63 over 8. The line between top and bottom means divide, so flip 21 over 4 before multiplying.'
      C: 'You went for negative 10 over 21. Check the bottom again: 4 and a fifth "of" 1 and a quarter is 21 fifths times 5 quarters, which is 21 over 4. Then negative 3 over 2 divided by 21 over 4 is negative 2 over 7.'
      D: 'You went for positive 10 over 21. The top is a smaller number minus a bigger one, so it''s negative, and the whole fraction must be negative. Any positive option is out.'
  2:
    moments:
      - say: 'We want the highest common factor of $a^{2}bx + abx^{2}$ and $a^{2}b - b^{3}$.'
        write: '$a^{2}bx + abx^{2},\quad a^{2}b - b^{3}$'
      - say: 'The H.C.F. is the biggest expression that divides both. The plan is to factorise each one completely, then keep only the factors they share.'
      - say: 'Look at the first expression. Both terms contain $a$, $b$ and $x$. The first term is $abx$ times $a$, and the second is $abx$ times $x$.'
        write: '$a^{2}bx + abx^{2} = abx \times a + abx \times x$'
      - say: 'So we take $abx$ outside a bracket, and $a$ plus $x$ stays inside.'
        write: '$= abx(a + x)$'
      - say: 'Now the second expression. Both terms contain $b$. The first is $b$ times $a^{2}$, the second is $b$ times $b^{2}$.'
        write: '$a^{2}b - b^{3} = b(a^{2} - b^{2})$'
      - say: 'Inside the bracket, $a^{2} - b^{2}$ is a difference of two squares. It splits into $a$ minus $b$, times $a$ plus $b$.'
        write: '$= b(a - b)(a + b)$'
      - say: 'Let''s list the factors. The first expression has $a$, $b$, $x$ and the bracket $a$ plus $x$.'
        write: '$\text{First: } a,\ b,\ x,\ (a + x)$'
      - say: 'The second has $b$, the bracket $a$ minus $b$, and the bracket $a$ plus $b$.'
        write: '$\text{Second: } b,\ (a - b),\ (a + b)$'
      - say: 'Which factors appear in both lists? Only $b$. Notice $a$ plus $x$ is not the same as $a$ plus $b$.'
        write: '$\text{Common: } b$'
      - say: 'So the H.C.F. is $b$, which is answer choice A.'
        write: '$\text{H.C.F.} = b$'
        answer: true
    traps:
      B: 'You went for $a + b$. It divides the second expression, but the first has the bracket $a + x$, not $a + b$. Read each bracket letter by letter.'
      C: 'You went for $a(a + b)$. The second expression, $b(a - b)(a + b)$, has no factor of $a$ on its own, and the first has no $a + b$. The only shared factor is $b$.'
      D: 'You went for $abx(a^{2} - b^{2})$. That''s much bigger than either expression can share; it doesn''t even divide the first one. A common factor must divide BOTH, and here only $b$ does.'
  3:
    moments:
      - say: 'We need to work out 241.34 times the bracket 3 times 10 to the negative 3, all squared, and give the answer to 4 significant figures.'
        write: '$241.34 \times (3 \times 10^{-3})^{2}$'
      - say: 'Order matters: first the bracket, then the multiplication, and only at the very end, the rounding.'
      - say: 'When we square the bracket, both parts get squared: the 3 and the power of ten.'
        write: '$(3 \times 10^{-3})^{2} = 3^{2} \times (10^{-3})^{2}$'
      - say: '3 squared is 9. And squaring a power of ten doubles its index, so negative 3 becomes negative 6.'
        write: '$= 9 \times 10^{-6}$'
      - say: 'So now we have 241.34 times 9 times 10 to the negative 6.'
        write: '$241.34 \times 9 \times 10^{-6}$'
      - say: 'Let''s do 241.34 times 9. 241 times 9 is 2169, and 0.34 times 9 is 3.06. Together that''s 2172.06.'
        write: '$241.34 \times 9 = 2172.06$'
      - say: 'So the value is 2172.06 times 10 to the negative 6.'
        write: '$2172.06 \times 10^{-6}$'
      - say: 'Multiplying by 10 to the negative 6 moves the decimal point six places to the left.'
        write: '$= 0.00217206$'
      - say: 'Now the rounding. Zeros at the front don''t count as significant figures. We start counting at the first non-zero digit, the 2. The first four are 2, 1, 7, 2.'
        write: '$0.002172\ |\ 06$'
      - say: 'The next digit is 0, which is less than 5, so we don''t round up.'
        write: '$\approx 0.002172$'
      - say: 'So the answer to 4 significant figures is 0.002172, which is answer choice D.'
        write: '$0.002172$'
        answer: true
    traps:
      A: 'You went for 0.0014. That comes from doubling the 3 instead of squaring it, and then keeping only 2 significant figures. 3 squared is 9, and the question wants 4 figures.'
      B: 'You went for 0.001448. That''s 241.34 times 6 times 10 to the negative 6: the 3 was doubled, not squared. Squaring means multiplying by itself, so 3 squared is 9.'
      C: 'You went for 0.0022. That''s the right number, but to only 2 significant figures. The question asks for 4: 2, 1, 7, 2.'
  4:
    moments:
      - say: '₦100 is deposited for 5 years and earns ₦7.50 simple interest. We want the rate.'
        write: '$P = 100,\quad T = 5,\quad I = 7.50$'
      - say: 'Simple interest is principal times rate times time, over 100.'
        write: '$I = \dfrac{PRT}{100}$'
      - say: 'We want $R$, so let''s rearrange. Multiply both sides by 100.'
        write: '$100I = PRT$'
      - say: 'Now divide both sides by $P$ times $T$ to get $R$ by itself.'
        write: '$R = \dfrac{100I}{PT}$'
      - say: 'Substitute: 100 times 7.50 on top, and 100 times 5 underneath.'
        write: '$R = \dfrac{100 \times 7.50}{100 \times 5}$'
      - say: '100 times 7.50 is 750. 100 times 5 is 500.'
        write: '$R = \dfrac{750}{500}$'
      - say: '750 divided by 500 is 1.5.'
        write: '$R = 1.5$'
      - say: 'Let''s check. 1.5 percent of ₦100 is ₦1.50 a year. Over 5 years, 1.50 times 5 is 7.50. That matches.'
        write: '$1.50 \times 5 = 7.50$'
      - say: 'So the rate is 1 and a half percent per year, which is answer choice A.'
        write: '$R = 1\tfrac{1}{2}\%$'
        answer: true
    traps:
      B: 'You went for 2 and a half percent. That would earn ₦2.50 a year, which is ₦12.50 over 5 years, not ₦7.50. Use $R = \dfrac{100I}{PT}$ and you get 1.5.'
      C: 'You went for 15 percent. That''s ₦15 a year, far more than ₦7.50 in total. Check the division: 750 over 500 is 1.5, not 15.'
      D: 'You went for 25 percent. That would earn ₦25 every year. The whole 5 years only earned ₦7.50, so the yearly rate must be small: 1.5 percent.'
  5:
    moments:
      - say: 'Three children share mangoes. The first takes a quarter, the second takes three-quarters of the remainder, and we want the third child''s fraction.'
        write: '$\text{1st: } \tfrac{1}{4},\quad \text{2nd: } \tfrac{3}{4} \text{ of remainder}$'
      - say: 'The key words are "of the remainder". The second child''s fraction is taken from what is left, not from the whole basket.'
      - say: 'Call the whole basket 1. The first child takes a quarter, so the remainder is 1 minus a quarter, which is three-quarters.'
        write: '$1 - \tfrac{1}{4} = \tfrac{3}{4}$'
      - say: 'The second child takes three-quarters of that three-quarters. "Of" means multiply.'
        write: '$\tfrac{3}{4} \times \tfrac{3}{4}$'
      - say: '3 times 3 is 9, and 4 times 4 is 16. So the second child takes 9 sixteenths of the basket.'
        write: '$= \tfrac{9}{16}$'
      - say: 'The third child takes whatever is left: the whole, minus a quarter, minus 9 sixteenths.'
        write: '$1 - \tfrac{1}{4} - \tfrac{9}{16}$'
      - say: 'Let''s put everything in sixteenths. 1 is 16 sixteenths, and a quarter is 4 sixteenths.'
        write: '$= \tfrac{16}{16} - \tfrac{4}{16} - \tfrac{9}{16}$'
      - say: '16 minus 4 is 12, and 12 minus 9 is 3. So 3 sixteenths.'
        write: '$= \tfrac{3}{16}$'
      - say: 'A quick check: 4 sixteenths plus 9 sixteenths plus 3 sixteenths is 16 sixteenths, the whole basket.'
        write: '$\tfrac{4}{16} + \tfrac{9}{16} + \tfrac{3}{16} = 1$'
      - say: 'So the third child took 3 sixteenths of the mangoes, which is answer choice A.'
        write: '$\tfrac{3}{16}$'
        answer: true
    traps:
      B: 'You went for 7 sixteenths. That''s 1 minus 9 sixteenths, which forgets the first child''s quarter. Take away both shares: 1 minus 4 sixteenths minus 9 sixteenths is 3 sixteenths.'
      C: 'You went for 9 sixteenths. That''s the SECOND child''s share, found on the way. The question asks about the third child.'
      D: 'You went for 13 sixteenths. That''s what the first two children took together, 4 sixteenths plus 9 sixteenths. The third child gets what''s left: 3 sixteenths.'
  6:
    moments:
      - say: 'We need to simplify 0.00275 times 0.00640, over 0.025 times 0.08, and write it in standard form.'
        write: '$\dfrac{0.00275 \times 0.00640}{0.025 \times 0.08}$'
      - say: 'The plan: write each decimal in standard form, then handle the ordinary numbers and the powers of ten separately.'
      - say: 'For 0.00275, the decimal point moves 3 places right to give 2.75. So it''s 2.75 times 10 to the negative 3.'
        write: '$0.00275 = 2.75 \times 10^{-3}$'
      - say: 'In the same way, 0.00640 is 6.4 times 10 to the negative 3.'
        write: '$0.00640 = 6.4 \times 10^{-3}$'
      - say: '0.025 moves 2 places to give 2.5, so it''s 2.5 times 10 to the negative 2.'
        write: '$0.025 = 2.5 \times 10^{-2}$'
      - say: 'And 0.08 is 8 times 10 to the negative 2.'
        write: '$0.08 = 8 \times 10^{-2}$'
      - say: 'Now the top. 2.75 times 6.4: 2.75 times 6 is 16.5, and 2.75 times 0.4 is 1.1, so 17.6. The powers add: negative 3 plus negative 3 is negative 6.'
        write: '$\text{Top} = 17.6 \times 10^{-6}$'
      - say: 'The bottom. 2.5 times 8 is 20. Negative 2 plus negative 2 is negative 4.'
        write: '$\text{Bottom} = 20 \times 10^{-4}$'
      - say: 'Now divide the numbers and the powers separately.'
        write: '$\dfrac{17.6}{20} \times \dfrac{10^{-6}}{10^{-4}}$'
      - say: '17.6 divided by 20 is 0.88.'
        write: '$\dfrac{17.6}{20} = 0.88$'
      - say: 'To divide powers of ten, subtract the indices. Negative 6 minus negative 4 is negative 2.'
        write: '$\dfrac{10^{-6}}{10^{-4}} = 10^{-2}$'
      - say: 'So we have 0.88 times 10 to the negative 2.'
        write: '$0.88 \times 10^{-2}$'
      - say: 'Standard form needs a number from 1 to 10 in front. 0.88 is 8.8 times 10 to the negative 1.'
        write: '$= 8.8 \times 10^{-1} \times 10^{-2}$'
      - say: 'Negative 1 plus negative 2 is negative 3. So the answer is 8.8 times 10 to the negative 3, which is answer choice C.'
        write: '$= 8.8 \times 10^{-3}$'
        answer: true
    traps:
      A: 'You went for 8.8 times 10 to the negative 1. That''s off by a factor of 100: the powers of ten were lost along the way. Keep them in their own column: 10 to the negative 6 over 10 to the negative 4 is 10 to the negative 2.'
      B: 'You went for 8.8 times 10 to the 2. That''s a big number, but a tiny number over a small number here gives about 0.0088. The power must be negative.'
      D: 'You went for 8.8 times 10 to the 3. The sign of the power has flipped. The answer is 0.0088, which is 8.8 times 10 to the negative 3.'
  7:
    moments:
      - say: 'Three brothers share a profit. The first gets a third, the second gets two-thirds of the remainder, and the third gets ₦12,000. We want the whole profit.'
        write: '$\text{3rd share} = 12000$'
      - say: 'The plan: find what fraction of the profit the third brother got. Then his ₦12,000 will tell us the total.'
      - say: 'Call the profit 1. The first brother takes a third, which leaves two-thirds.'
        write: '$1 - \tfrac{1}{3} = \tfrac{2}{3}$'
      - say: 'The second takes two-thirds of that remainder. 2 times 2 is 4, and 3 times 3 is 9. So 4 ninths of the whole.'
        write: '$\tfrac{2}{3} \times \tfrac{2}{3} = \tfrac{4}{9}$'
      - say: 'The third brother gets the rest: 1 minus a third minus 4 ninths.'
        write: '$1 - \tfrac{1}{3} - \tfrac{4}{9}$'
      - say: 'In ninths, 1 is 9 ninths and a third is 3 ninths. 9 minus 3 is 6, and 6 minus 4 is 2. So 2 ninths.'
        write: '$= \tfrac{9}{9} - \tfrac{3}{9} - \tfrac{4}{9} = \tfrac{2}{9}$'
      - say: 'So 2 ninths of the profit $P$ is 12,000.'
        write: '$\tfrac{2}{9}P = 12000$'
      - say: 'Multiply both sides by 9. 12,000 times 9 is 108,000.'
        write: '$2P = 108000$'
      - say: 'Divide both sides by 2. 108,000 divided by 2 is 54,000.'
        write: '$P = 54000$'
      - say: 'Let''s check. A third of 54,000 is 18,000. That leaves 36,000, and two-thirds of 36,000 is 24,000. The third gets 12,000. They add to 54,000.'
        write: '$18000 + 24000 + 12000 = 54000$'
      - say: 'So the profit they shared was ₦54,000, which is answer choice B.'
        write: 'Profit: ₦54,000.00'
        answer: true
    traps:
      A: 'You went for ₦60,000. That treats ₦12,000 as a fifth of the profit. The third brother''s share is 2 ninths, so the profit is 12,000 times 9 over 2, which is ₦54,000.'
      C: 'You went for ₦48,000. That treats ₦12,000 as a quarter of the profit. Work out the third share carefully: 1 minus a third minus 4 ninths is 2 ninths.'
      D: 'You went for ₦42,000. That''s what the first two brothers got together, ₦18,000 plus ₦24,000. Add the third brother''s ₦12,000 to get the whole profit.'
  8:
    moments:
      - say: 'We need to simplify a root inside a root inside a root.'
        write: '$\sqrt{160r^{2} + \sqrt{71r^{4} + \sqrt{100r^{8}}}}$'
      - say: 'With nested roots, we always work from the inside out. Each inner root, once we find it, joins the terms around it.'
      - say: 'The innermost root is the square root of $100r^{8}$. The square root of 100 is 10. And $r^{4}$ squared is $r^{8}$, so the square root of $r^{8}$ is $r^{4}$.'
        write: '$\sqrt{100r^{8}} = 10r^{4}$'
      - say: 'Put that back in. The middle root now holds $71r^{4}$ plus $10r^{4}$.'
        write: '$\sqrt{71r^{4} + 10r^{4}}$'
      - say: 'These are like terms. 71 plus 10 is 81.'
        write: '$= \sqrt{81r^{4}}$'
      - say: 'The square root of 81 is 9, and the square root of $r^{4}$ is $r^{2}$.'
        write: '$= 9r^{2}$'
      - say: 'Now the outer root holds $160r^{2}$ plus $9r^{2}$.'
        write: '$\sqrt{160r^{2} + 9r^{2}}$'
      - say: '160 plus 9 is 169.'
        write: '$= \sqrt{169r^{2}}$'
      - say: '169 is 13 squared, so its square root is 13. And the square root of $r^{2}$ is $r$. So the answer is $13r$, which is answer choice C.'
        write: '$= 13r$'
        answer: true
    traps:
      A: 'You went for $9r^{2}$. That''s the value of the MIDDLE root. There''s still one more root to take: $\sqrt{160r^{2} + 9r^{2}}$.'
      B: 'You went for $12\sqrt{3}\,r$. Squaring that gives $432r^{2}$, but under the outer root we have $169r^{2}$. Work from the inside out, adding like terms at each layer.'
      D: 'You went for $\sqrt{13}\,r$. That takes the root of 13, but the number under the root is 169, and 169 is 13 squared. So its square root is 13 exactly.'
  9:
    moments:
      - say: 'We want to simplify root 27 plus 3 over root 3.'
        write: '$\sqrt{27} + \dfrac{3}{\sqrt{3}}$'
      - say: 'Surds are like algebra: we can only add like terms. So the plan is to write both terms as multiples of root 3.'
      - say: 'For root 27, look for the biggest perfect square inside 27. 27 is 9 times 3, and 9 is a perfect square.'
        write: '$\sqrt{27} = \sqrt{9 \times 3}$'
      - say: 'That splits into root 9 times root 3. Root 9 is 3, so this is 3 root 3.'
        write: '$= \sqrt{9} \times \sqrt{3} = 3\sqrt{3}$'
      - say: 'Now 3 over root 3. We don''t like a root on the bottom, so we rationalise: multiply top and bottom by root 3.'
        write: '$\dfrac{3}{\sqrt{3}} \times \dfrac{\sqrt{3}}{\sqrt{3}}$'
      - say: 'On top we get 3 root 3. On the bottom, root 3 times root 3 is 3.'
        write: '$= \dfrac{3\sqrt{3}}{3}$'
      - say: 'The 3s cancel, leaving just root 3.'
        write: '$= \sqrt{3}$'
      - say: 'Now both terms are multiples of root 3, so we can add them: 3 root 3 plus 1 root 3.'
        write: '$3\sqrt{3} + \sqrt{3}$'
      - say: '3 plus 1 is 4. So the answer is 4 root 3, which is answer choice A.'
        write: '$= 4\sqrt{3}$'
        answer: true
    traps:
      B: 'You went for 4 over root 3. That''s only about 2.3, but root 27 alone is over 5. The second term, 3 over root 3, simplifies to root 3, and the total is 4 root 3.'
      C: 'You went for 3 root 3. That''s root 27 on its own; the second term was dropped. Add the root 3 from 3 over root 3 to get 4 root 3.'
      D: 'You went for 3 root 4. Root 4 is just 2, so that''s 6, but the answer is about 6.93. The common surd here is root 3, not root 4.'
  10:
    moments:
      - say: 'We need to simplify 3 log 9, plus log 12, plus log 64, minus log 72, all in base 6.'
        write: '$3\log_{6}9 + \log_{6}12 + \log_{6}64 - \log_{6}72$'
      - say: 'The plan is to gather everything into a single logarithm, using the laws of logs. First, a number in front becomes a power.'
        write: '$n\log a = \log a^{n}$'
      - say: 'So 3 log 9 becomes log of 9 cubed.'
        write: '$3\log_{6}9 = \log_{6}9^{3}$'
      - say: '9 times 9 is 81, and 81 times 9 is 729.'
        write: '$= \log_{6}729$'
      - say: 'Now the whole expression is log 729 plus log 12 plus log 64 minus log 72.'
        write: '$\log_{6}729 + \log_{6}12 + \log_{6}64 - \log_{6}72$'
      - say: 'Adding logs means multiplying the numbers, and subtracting means dividing. So everything goes into one log.'
        write: '$= \log_{6}\dfrac{729 \times 12 \times 64}{72}$'
      - say: 'Let''s simplify. 12 over 72 is one-sixth, since 72 is 6 times 12.'
        write: '$= \log_{6}\dfrac{729 \times 64}{6}$'
      - say: '729 times 64. 700 times 64 is 44,800, and 29 times 64 is 1,856. Together that''s 46,656.'
        write: '$= \log_{6}\dfrac{46656}{6}$'
      - say: '46,656 divided by 6 is 7,776.'
        write: '$= \log_{6}7776$'
      - say: 'A log in base 6 asks, "6 to what power gives this number?" Let''s build the powers of 6: 36, 216, 1,296, then 7,776. So 7,776 is 6 to the power 5.'
        write: '$6^{5} = 7776$'
      - say: 'So we have log base 6 of 6 to the 5.'
        write: '$= \log_{6}6^{5}$'
      - say: 'That''s simply 5, which is answer choice A.'
        write: '$= 5$'
        answer: true
    traps:
      B: 'You went for 7776. That''s the number INSIDE the log. A log asks "what power?", and 7776 is 6 to the power 5, so the log is 5.'
      C: 'You went for log base 6 of 31. That adds and subtracts the numbers themselves. Adding logs means multiplying the numbers, and subtracting means dividing.'
      D: 'You went for 7776 to the power 6. The laws of logs turn the expression into log base 6 of 7776, and since 7776 is 6 to the 5, that''s just 5.'
  11:
    moments:
      - say: 'We need to simplify 1 over $x$ to the negative 1, plus 1 over $y$ to the negative 1, with the whole bracket to the power negative 1.'
        write: '$\left(\dfrac{1}{x^{-1}} + \dfrac{1}{y^{-1}}\right)^{-1}$'
      - say: 'A negative index simply means "take the reciprocal". So $x$ to the negative 1 is 1 over $x$.'
        write: '$x^{-1} = \dfrac{1}{x}$'
      - say: 'That means the first term is 1 divided by 1 over $x$.'
        write: '$\dfrac{1}{x^{-1}} = \dfrac{1}{\;\tfrac{1}{x}\;}$'
      - say: 'Dividing by a fraction means flipping it and multiplying. 1 times $x$ over 1 is just $x$.'
        write: '$= x$'
      - say: 'In exactly the same way, 1 over $y$ to the negative 1 is just $y$.'
        write: '$\dfrac{1}{y^{-1}} = y$'
      - say: 'So the bracket is $x$ plus $y$, still raised to the power negative 1.'
        write: '$(x + y)^{-1}$'
      - say: 'The power negative 1 flips the whole bracket upside down.'
        write: '$= \dfrac{1}{x + y}$'
      - say: 'Let''s test it with $x = 2$ and $y = 3$. Inside the bracket we get 2 plus 3, which is 5, and 5 to the negative 1 is one-fifth. Our answer gives 1 over 2 plus 3, also one-fifth.'
        write: '$x = 2,\ y = 3:\ (2 + 3)^{-1} = \tfrac{1}{5}$'
      - say: 'So the expression simplifies to 1 over $x$ plus $y$, which is answer choice C.'
        write: '$\dfrac{1}{x + y}$'
        answer: true
    traps:
      A: 'You went for $x$ over $y$. The two terms inside the bracket are ADDED, so they give $x + y$, not a division. Then the power negative 1 flips it to $\dfrac{1}{x + y}$.'
      B: 'You went for $xy$. The bracket is a sum, $x + y$, not a product. And the outer power negative 1 turns it upside down, giving $\dfrac{1}{x + y}$.'
      D: 'You went for $(xy)^{-1}$. That treats the plus as a times. With $x = 2$ and $y = 3$ it gives one-sixth, but the expression is one-fifth. The reciprocal of a sum doesn''t split into a product.'
  12:
    moments:
      - say: 'We''re given $a = 2$, $b = -2$ and $c = -\tfrac{1}{2}$, and we must evaluate the product of two brackets.'
        write: '$(ab^{2} - bc^{2})(a^{2}c - abc)$'
      - say: 'Two of the values are negative, so the plan is to work out each term on its own and watch every sign.'
      - say: 'First, $b^{2}$. Negative 2 squared is positive 4.'
        write: '$b^{2} = (-2)^{2} = 4$'
      - say: 'So $ab^{2}$ is 2 times 4, which is 8.'
        write: '$ab^{2} = 2 \times 4 = 8$'
      - say: 'Next, $c^{2}$. Negative a half squared is positive a quarter.'
