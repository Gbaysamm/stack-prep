          - {line: 6, kind: highlight, at: '=9', to: {doodle: walk, part: full}}
      - say: 'Let''s check with the interior angle sum, $n$ minus 2, times 180. For 9 sides, 9 minus 2 is 7.'
        write: 'Check: $(n - 2) \times 180^{\circ} = (9 - 2) \times 180^{\circ}$'
      - say: '7 times 180 is 1260 degrees.'
        write: '$= 7 \times 180^{\circ} = 1260^{\circ}$'
      - say: 'And 9 corners of 140 degrees each: 9 times 140 is also 1260. It matches.'
        write: '$9 \times 140^{\circ} = 1260^{\circ}\ \checkmark$'
      - say: 'So the polygon has 9 sides, which is answer choice A.'
        write: 'So the polygon has $n = 9$ sides'
