      D: 'You went for 1. At $x = 1$ the expression is 3, but at $x = -\tfrac{1}{2}$ it is only three quarters. The minimum is at negative a half.'
  31:
    moments:
      - say: 'In the diagram, $QR$ is parallel to $PS$, so $PQRS$ is a trapezium. Its area is 73.5 square centimetres and its height is 10.5 centimetres. $QR$ is a third of $PS$, and we want $PS$.'
        write: '$A = 73.5,\quad h = 10.5,\quad QR = \tfrac{1}{3}PS$'
        point:
          - {figure: 0, kind: highlight, target: QR}
          - {figure: 0, kind: highlight, target: PS, text: 'parallel'}
          - {figure: 0, kind: circle, target: '10.5 cm', text: 'height'}
      - say: 'The area of a trapezium is half the sum of the two parallel sides, times the height between them.'
        write: 'Area of a trapezium $= \tfrac{1}{2}(a + b)h$'
      - say: 'Here the parallel sides are $PS$ and $QR$.'
        write: 'Trapezium: $A = \tfrac{1}{2}(PS + QR)h$'
        point:
          - {figure: 0, kind: underline, target: PS}
          - {figure: 0, kind: underline, target: QR, text: 'parallel sides'}
      - say: 'Let''s call $PS$ by the letter $s$. Then $QR$, a third of it, is $s$ over 3.'
        write: 'Let $PS = s$, so $QR = \dfrac{s}{3}$'
        point:
          - {figure: 0, kind: label, target: PS, text: 's'}
          - {figure: 0, kind: label, target: QR, text: 's/3'}
      - say: 'Add the parallel sides. $s$ is the same as $3s$ over 3, and $3s$ over 3 plus $s$ over 3 is $4s$ over 3.'
        write: '$PS + QR = \dfrac{3s}{3} + \dfrac{s}{3} = \dfrac{4s}{3}$'
      - say: 'Now substitute into the area formula: 73.5 for the area, $4s$ over 3 for the sides, and 10.5 for the height.'
        write: '$73.5 = \dfrac{1}{2} \times \dfrac{4s}{3} \times 10.5$'
        point:
