# UTME 1990 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1990.yaml. Answers match that file.
format_version: 1
exam_year: 1990
lessons:
  1:
    moments:
      - say: 'We''re asked to simplify this fraction. On top, 4 and three quarters minus 6 and a quarter. Underneath, 4 and a fifth of 1 and a quarter.'
        write: '$\dfrac{4\tfrac{3}{4} - 6\tfrac{1}{4}}{4\tfrac{1}{5} \text{ of } 1\tfrac{1}{4}}$'
      - say: 'We''ll work out the top and the bottom separately. The safest way to handle mixed numbers is to turn each one into an improper fraction first.'
        write: 'Plan: top and bottom separately, as improper fractions'
      - say: 'Start with the top. 4 and three quarters: 4 times 4 is 16, plus 3 is 19. So it is 19 over 4.'
        write: 'Top: $4\tfrac{3}{4} = \dfrac{4 \times 4 + 3}{4} = \dfrac{19}{4}$'
      - say: 'Now 6 and a quarter: 6 times 4 is 24, plus 1 is 25. So it is 25 over 4.'
        write: '$6\tfrac{1}{4} = \dfrac{6 \times 4 + 1}{4} = \dfrac{25}{4}$'
      - say: 'So the top is 19 over 4 minus 25 over 4. The bottoms match, so we subtract the tops: 19 minus 25 is negative 6.'
        write: 'So top $= \dfrac{19}{4} - \dfrac{25}{4} = -\dfrac{6}{4}$'
      - say: 'Divide the top and bottom of negative 6 over 4 by 2. That gives negative 3 over 2.'
        write: '$= -\dfrac{3}{2}$'
      - say: 'Now the bottom of the big fraction. In maths, the word "of" means multiply.'
        write: 'Bottom: $4\tfrac{1}{5} \text{ of } 1\tfrac{1}{4} = 4\tfrac{1}{5} \times 1\tfrac{1}{4}$'
      - say: '4 and a fifth: 4 times 5 is 20, plus 1 is 21, so it is 21 over 5. And 1 and a quarter is 5 over 4.'
        write: '$= \dfrac{21}{5} \times \dfrac{5}{4}$'
      - say: 'The 5 on top cancels with the 5 underneath, leaving 21 over 4.'
        write: '$= \dfrac{21}{4}$'
      - say: 'Now we put the two parts together: the top we found, negative 3 over 2, divided by the bottom, 21 over 4.'
        write: 'Top $\div$ bottom $= -\dfrac{3}{2} \div \dfrac{21}{4}$'
        point:
          - {line: 9, kind: move, from: {line: 5, at: '= −23'}, at: '−23', text: 'top'}
          - {line: 9, kind: move, from: {line: 8, at: '= 421'}, at: '421', text: 'bottom'}
      - say: 'To divide by a fraction, we flip it and multiply. 21 over 4 becomes 4 over 21.'
        write: '$= -\dfrac{3}{2} \times \dfrac{4}{21}$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '421'}, at: '214', text: 'flipped'}
      - say: 'Cancel before multiplying. 3 goes into 21 seven times, and 2 goes into 4 twice.'
        write: '$= -\dfrac{1}{1} \times \dfrac{2}{7}$'
      - say: 'So the value is negative 2 over 7, which is answer choice B.'
        write: '$= -\dfrac{2}{7}$'
        answer: true
    traps:
      A: 'You went for negative 7 and 7 over 8. That is negative 3 over 2 TIMES 21 over 4, which is negative 63 over 8. The fraction line means divide, so flip 21 over 4 before multiplying.'
      C: 'You went for negative 10 over 21. Check the bottom again: 4 and a fifth "of" 1 and a quarter is 21 over 5 times 5 over 4, which is 21 over 4. Then negative 3 over 2 divided by 21 over 4 is negative 2 over 7.'
      D: 'You went for positive 10 over 21. The top is a smaller number minus a bigger one, so it is negative, and the whole fraction must be negative. Any positive option is out.'
  2:
    moments:
      - say: 'We want the highest common factor of $a^{2}bx + abx^{2}$ and $a^{2}b - b^{3}$.'
        write: '$a^{2}bx + abx^{2}\quad\text{and}\quad a^{2}b - b^{3}$'
      - say: 'The H.C.F. is the biggest expression that divides both. The plan is to factorise each one completely, then keep only the factors they share.'
        write: 'Plan: factorise both fully, then compare'
      - say: 'Look at the first expression. Both terms contain $a$, $b$ and $x$. The first term is $abx$ times $a$, and the second is $abx$ times $x$.'
        write: 'First: $a^{2}bx + abx^{2} = abx \times a + abx \times x$'
      - say: 'So we take $abx$ outside a bracket, and $a$ plus $x$ stays inside.'
        write: '$= abx(a + x)$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '= [[abx]]'}, at: 'abx', text: 'taken out'}
      - say: 'Now the second expression. Both terms contain $b$. The first is $b$ times $a^{2}$, and the second is $b$ times $b^{2}$.'
        write: 'Second: $a^{2}b - b^{3} = b \times a^{2} - b \times b^{2}$'
      - say: 'So we take $b$ outside a bracket, and $a^{2}$ minus $b^{2}$ stays inside.'
        write: '$= b(a^{2} - b^{2})$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= [[b]]'}, at: '[[b]](', text: 'taken out'}
      - say: 'Inside that bracket, $a^{2} - b^{2}$ is a difference of two squares. It splits into $a$ minus $b$, times $a$ plus $b$.'
        write: '$= b(a - b)(a + b)$'
      - say: 'Now list the factors. From $abx(a + x)$, the first expression has $a$, $b$, $x$ and the bracket $a$ plus $x$.'
        write: 'Factors of the first: $a,\ b,\ x,\ (a + x)$'
      - say: 'From $b(a - b)(a + b)$, the second has $b$, the bracket $a$ minus $b$, and the bracket $a$ plus $b$.'
        write: 'Factors of the second: $b,\ (a - b),\ (a + b)$'
      - say: 'Which factors appear in both lists? Only $b$. Careful: $a$ plus $x$ is not the same as $a$ plus $b$.'
        write: 'In both lists: $b$ only'
        point:
          - {line: 7, kind: circle, at: 'b', text: 'in both'}
          - {line: 8, kind: circle, at: 'second: [[b]]'}
      - say: 'So the H.C.F. is $b$, which is answer choice A.'
        write: 'H.C.F. $= b$'
        answer: true
    traps:
      B: 'You went for $a + b$. It divides the second expression, but the first has the bracket $a + x$, not $a + b$. Read each bracket letter by letter.'
      C: 'You went for $a(a + b)$. The second expression, $b(a - b)(a + b)$, has no factor of $a$ on its own, and the first has no $a + b$. The only shared factor is $b$.'
      D: 'You went for $abx(a^{2} - b^{2})$. That is far bigger than either expression can share; it does not even divide the first one. A common factor must divide BOTH, and here only $b$ does.'
  3:
    moments:
      - say: 'We need to work out 241.34 times the bracket 3 times 10 to the negative 3, all squared, and give the answer to 4 significant figures.'
        write: '$241.34 \times (3 \times 10^{-3})^{2}$'
      - say: 'Order matters here: first the bracket, then the multiplying, and only at the very end, the rounding.'
        write: 'Order: bracket, multiply, then round'
      - say: 'A power of a product: every factor inside the bracket gets the power. And a power of a power multiplies the indices.'
        write: 'Laws of indices: $(ab)^{n} = a^{n}b^{n},\ \ (a^{m})^{n} = a^{mn}$'
      - say: 'When we square the bracket, both parts get squared: the 3 and the power of ten.'
        write: 'Bracket: $(3 \times 10^{-3})^{2} = 3^{2} \times (10^{-3})^{2}$'
      - say: '3 squared is 9. And squaring a power of ten doubles its index, so negative 3 becomes negative 6.'
        write: '$= 9 \times 10^{-6}$'
      - say: 'Now put that back into the question. We have 241.34 times 9 times 10 to the negative 6.'
        write: 'So $241.34 \times (3 \times 10^{-3})^{2} = 241.34 \times 9 \times 10^{-6}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= 9×10−6'}, at: '9×10−6', text: 'bracket'}
      - say: 'Let''s do 241.34 times 9 in two pieces. 241 times 9 is 2169, and 0.34 times 9 is 3.06.'
        write: '$241.34 \times 9 = 2169 + 3.06$'
      - say: '2169 plus 3.06 is 2172.06.'
        write: '$= 2172.06$'
      - say: 'So the value is 2172.06 times 10 to the negative 6.'
        write: 'Value $= 2172.06 \times 10^{-6}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= 2172.06'}, at: '2172.06', text: 'carried down'}
      - say: 'Multiplying by 10 to the negative 6 moves the decimal point six places to the left.'
        write: '$= 0.00217206$'
      - say: 'Now the rounding. Zeros at the front don''t count as significant figures. We start at the first non-zero digit, the 2. The first four are 2, 1, 7 and 2.'
        write: 'First 4 significant figures: $0.002172\ |\ 06$'
      - say: 'The next digit after them is 0, which is less than 5, so the last 2 stays as it is.'
        write: 'Next digit $0 < 5$, so no rounding up'
        point:
          - {line: 10, kind: circle, at: '06', text: 'next digit'}
      - say: 'So to 4 significant figures the answer is 0.002172, which is answer choice D.'
        write: '$241.34 \times (3 \times 10^{-3})^{2} \approx 0.002172$'
        answer: true
    traps:
      A: 'You went for 0.0014. That comes from doubling the 3 instead of squaring it, and then keeping only 2 significant figures. 3 squared is 9, and the question wants 4 figures.'
      B: 'You went for 0.001448. That is 241.34 times 6 times 10 to the negative 6: the 3 was doubled, not squared. Squaring means multiplying by itself, so 3 squared is 9.'
      C: 'You went for 0.0022. That is the right number, but to only 2 significant figures. The question asks for 4: 2, 1, 7, 2.'
  4:
    moments:
      - say: '₦100 is deposited for 5 years and earns ₦7.50 simple interest. We want the rate.'
        write: '$P = 100,\quad T = 5,\quad I = 7.50$'
      - say: 'Simple interest is the principal times the rate times the time, all over 100.'
        write: 'Simple interest: $I = \dfrac{PRT}{100}$'
      - say: 'We want $R$, so let''s rearrange. First multiply both sides by 100.'
        write: '$100I = PRT$'
        point:
          - {line: 2, kind: move, from: {line: 1, at: '100'}, at: '100', text: 'across the ='}
      - say: 'Now divide both sides by $P$ times $T$ to get $R$ by itself.'
        write: '$R = \dfrac{100I}{PT}$'
      - say: 'Now substitute the values from the first line: $I$ is 7.50, $P$ is 100 and $T$ is 5.'
        write: '$R = \dfrac{100 \times 7.50}{100 \times 5}$'
        point:
          - {line: 3, kind: box, text: 'the rule'}
          - {line: 4, kind: move, from: {line: 0, at: '7.50'}, at: '7.50', text: 'I'}
          - {line: 4, kind: move, from: {line: 0, at: 'T = [[5]]'}, at: '× 5', text: 'T'}
      - say: '100 times 7.50 is 750, and 100 times 5 is 500.'
        write: '$= \dfrac{750}{500}$'
      - say: '750 divided by 500 is 1.5.'
        write: '$= 1.5$'
      - say: 'So the rate is 1.5 percent per year, which is the same as 1 and a half percent.'
        write: '$R = 1.5\% = 1\tfrac{1}{2}\%$'
      - say: 'Let''s check. 1.5 percent of ₦100 is ₦1.50 in one year.'
        write: 'Check: $1.5\%$ of ₦100 $=$ ₦1.50 a year'
      - say: 'Over 5 years that is 1.50 times 5, which is 7.50. That matches the interest we were given.'
        write: '$1.50 \times 5 = 7.50\ \checkmark$'
      - say: 'So the rate is 1 and a half percent per year, which is answer choice A.'
        write: 'Rate $= 1\tfrac{1}{2}\%$ per year'
        answer: true
    traps:
      B: 'You went for 2 and a half percent. That would earn ₦2.50 a year, which is ₦12.50 over 5 years, not ₦7.50. Use $R = \dfrac{100I}{PT}$ and you get 1.5.'
      C: 'You went for 15 percent. That''s ₦15 a year, far more than ₦7.50 in total. Check the division: 750 over 500 is 1.5, not 15.'
      D: 'You went for 25 percent. That would earn ₦25 every year. The whole 5 years only earned ₦7.50, so the yearly rate must be small: 1.5 percent.'
  5:
    moments:
      - say: 'Three children share a basket of mangoes. The first takes a quarter, the second takes three quarters of the remainder, and we want the third child''s fraction.'
        write: 'First: $\tfrac{1}{4}$; second: $\tfrac{3}{4}$ of the remainder'
      - say: 'The key words are "of the remainder". The second child''s share is taken from what is left after the first child, not from the whole basket.'
        write: 'Second child''s share is taken from what is left'
      - say: 'Call the whole basket 1. The first child takes a quarter, so the remainder is 1 minus a quarter, which is three quarters.'
        write: 'Remainder $= 1 - \tfrac{1}{4} = \tfrac{3}{4}$'
      - say: 'The second child takes three quarters of that remainder. "Of" means multiply.'
        write: 'Second child $= \tfrac{3}{4} \times \tfrac{3}{4}$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '= 43'}, at: '× [[43]]', text: 'remainder'}
      - say: '3 times 3 is 9, and 4 times 4 is 16. So the second child takes 9 over 16 of the basket.'
        write: '$= \dfrac{9}{16}$'
      - say: 'The third child takes whatever is left: the whole basket, minus the first share, a quarter, minus the second share, 9 over 16.'
        write: 'Third child $= 1 - \dfrac{1}{4} - \dfrac{9}{16}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= 169'}, at: '169', text: 'second'}
      - say: 'Let''s put everything over 16. 1 is 16 over 16, and a quarter is 4 over 16.'
        write: '$= \dfrac{16}{16} - \dfrac{4}{16} - \dfrac{9}{16}$'
      - say: '16 minus 4 is 12, and 12 minus 9 is 3. So the third child gets 3 over 16.'
        write: '$= \dfrac{16 - 4 - 9}{16} = \dfrac{3}{16}$'
      - say: 'A quick check: the three shares, 4 over 16, 9 over 16 and 3 over 16, should make the whole basket. 4 plus 9 plus 3 is 16.'
        write: 'Check: $\dfrac{4}{16} + \dfrac{9}{16} + \dfrac{3}{16} = \dfrac{16}{16} = 1\ \checkmark$'
      - say: 'So the third child took 3 over 16 of the mangoes, which is answer choice A.'
        write: 'Third child $= \dfrac{3}{16}$'
        answer: true
    traps:
      B: 'You went for 7 over 16. That is 1 minus 9 over 16, which forgets the first child''s quarter. Take away both shares: 1 minus 4 over 16 minus 9 over 16 is 3 over 16.'
      C: 'You went for 9 over 16. That is the SECOND child''s share, found on the way. The question asks about the third child.'
      D: 'You went for 13 over 16. That is what the first two children took together, 4 over 16 plus 9 over 16. The third child gets what is left: 3 over 16.'
  6:
    moments:
      - say: 'We need to simplify 0.00275 times 0.00640, over 0.025 times 0.08, and write it in standard form.'
        write: '$\dfrac{0.00275 \times 0.00640}{0.025 \times 0.08}$'
      - say: 'The plan: write each decimal in standard form, then handle the ordinary numbers and the powers of ten separately.'
        write: 'Plan: standard form, then numbers and powers separately'
      - say: 'For 0.00275, the decimal point moves 3 places right to give 2.75. So it is 2.75 times 10 to the negative 3.'
        write: '$0.00275 = 2.75 \times 10^{-3}$'
      - say: 'In the same way, 0.00640 is 6.4 times 10 to the negative 3.'
        write: '$0.00640 = 6.4 \times 10^{-3}$'
      - say: '0.025 moves 2 places to give 2.5, so it is 2.5 times 10 to the negative 2.'
        write: '$0.025 = 2.5 \times 10^{-2}$'
      - say: 'And 0.08 is 8 times 10 to the negative 2.'
        write: '$0.08 = 8 \times 10^{-2}$'
      - say: 'Now the top. 2.75 times 6.4 in two pieces: 2.75 times 6 is 16.5, and 2.75 times 0.4 is 1.1. Together that is 17.6.'
        write: 'Top numbers: $2.75 \times 6.4 = 16.5 + 1.1 = 17.6$'
      - say: 'Multiplying powers of the same base: add the indices.'
        write: 'Law of indices: $a^{m} \times a^{n} = a^{m + n}$'
      - say: 'Multiplying powers of ten adds the indices: negative 3 plus negative 3 is negative 6.'
        write: 'Top powers: $10^{-3} \times 10^{-3} = 10^{-3 + (-3)} = 10^{-6}$'
      - say: 'Now the bottom. 2.5 times 8 is 20, and negative 2 plus negative 2 is negative 4.'
        write: 'Bottom: $2.5 \times 8 = 20,\quad 10^{-2} \times 10^{-2} = 10^{-4}$'
      - say: 'So the whole fraction is 17.6 times 10 to the negative 6, over 20 times 10 to the negative 4.'
        write: 'So the fraction $= \dfrac{17.6 \times 10^{-6}}{20 \times 10^{-4}}$'
        point:
          - {line: 10, kind: move, from: {line: 6, at: '= 17.6'}, at: '17.6', text: 'top'}
          - {line: 10, kind: move, from: {line: 9, at: '= 20'}, at: '20', text: 'bottom'}
      - say: 'Divide the numbers first. 17.6 divided by 20 is 0.88.'
        write: 'Numbers: $\dfrac{17.6}{20} = 0.88$'
      - say: 'Dividing powers of the same base: subtract the indices.'
        write: 'Law of indices: $a^{m} \div a^{n} = a^{m - n}$'
      - say: 'To divide powers of ten, subtract the indices. Negative 6 minus negative 4 is negative 2.'
        write: 'Powers: $\dfrac{10^{-6}}{10^{-4}} = 10^{-6 - (-4)} = 10^{-2}$'
      - say: 'Put the two results back together: 0.88 times 10 to the negative 2.'
        write: 'Fraction $= 0.88 \times 10^{-2}$'
        point:
          - {line: 14, kind: move, from: {line: 11, at: '= 0.88'}, at: '0.88', text: 'numbers'}
          - {line: 14, kind: move, from: {line: 13, at: '= 10−2'}, at: '10−2', text: 'powers'}
      - say: 'Standard form needs a number from 1 to 10 in front. 0.88 is 8.8 times 10 to the negative 1.'
        write: '$= 8.8 \times 10^{-1} \times 10^{-2}$'
      - say: 'Negative 1 plus negative 2 is negative 3. So the answer is 8.8 times 10 to the negative 3, which is answer choice C.'
        write: '$= 8.8 \times 10^{-3}$'
        answer: true
    traps:
      A: 'You went for 8.8 times 10 to the negative 1. That''s off by a factor of 100: the powers of ten were lost along the way. Keep them in their own column: 10 to the negative 6 over 10 to the negative 4 is 10 to the negative 2.'
      B: 'You went for 8.8 times 10 to the 2. That''s a big number, but a tiny number over a small number here gives about 0.0088. The power must be negative.'
      D: 'You went for 8.8 times 10 to the 3. The sign of the power has flipped. The answer is 0.0088, which is 8.8 times 10 to the negative 3.'
  7:
    moments:
      - say: 'Three brothers share a profit. The first gets a third, the second gets two thirds of the remainder, and the third gets ₦12,000. We want the whole profit.'
        write: 'First: $\tfrac{1}{3}$; second: $\tfrac{2}{3}$ of the remainder; third: ₦12,000'
      - say: 'The plan: find what fraction of the profit the third brother got. Then his ₦12,000 will tell us the whole.'
        write: 'Plan: find the third brother''s fraction'
      - say: 'Call the whole profit 1. The first brother takes a third, which leaves 1 minus a third, that is two thirds.'
        write: 'Remainder $= 1 - \tfrac{1}{3} = \tfrac{2}{3}$'
      - say: 'The second takes two thirds of that remainder. 2 times 2 is 4, and 3 times 3 is 9. So he gets 4 over 9 of the whole profit.'
        write: 'Second $= \tfrac{2}{3} \times \tfrac{2}{3} = \dfrac{4}{9}$'
      - say: 'The third brother gets the rest: 1, minus the first share, a third, minus the second share, 4 over 9.'
        write: 'Third $= 1 - \dfrac{1}{3} - \dfrac{4}{9}$'
      - say: 'Put everything over 9. 1 is 9 over 9, and a third is 3 over 9.'
        write: '$= \dfrac{9}{9} - \dfrac{3}{9} - \dfrac{4}{9}$'
      - say: '9 minus 3 is 6, and 6 minus 4 is 2. So the third brother gets 2 over 9 of the profit.'
        write: '$= \dfrac{9 - 3 - 4}{9} = \dfrac{2}{9}$'
      - say: 'Call the profit $P$. The 2 over 9 of $P$ we just found is the ₦12,000 he received.'
        write: 'So $\dfrac{2}{9}P = 12000$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '= 92'}, at: '92', text: 'his fraction'}
          - {line: 7, kind: move, from: {line: 0, at: '12,000'}, at: '12000', text: 'given'}
      - say: 'Multiply both sides by 9. 12,000 times 9 is 108,000.'
        write: '$2P = 12000 \times 9 = 108000$'
      - say: 'Divide both sides by 2. 108,000 divided by 2 is 54,000.'
        write: '$P = \dfrac{108000}{2} = 54000$'
      - say: 'Let''s check. A third of 54,000 is 18,000, which leaves 54,000 minus 18,000, that is 36,000.'
        write: 'Check: first $= \tfrac{1}{3} \times 54000 = 18000$, leaving $36000$'
      - say: 'Two thirds of 36,000 is 24,000. And 36,000 minus 24,000 leaves 12,000 for the third brother, just as the question says.'
        write: 'Second $= \tfrac{2}{3} \times 36000 = 24000$, third $= 36000 - 24000 = 12000\ \checkmark$'
      - say: 'So the profit they shared was ₦54,000, which is answer choice B.'
        write: 'Profit $=$ ₦54,000.00'
        answer: true
    traps:
      A: 'You went for ₦60,000. That treats ₦12,000 as a fifth of the profit. The third brother''s share is 2 over 9, so the profit is 12,000 times 9 over 2, which is ₦54,000.'
      C: 'You went for ₦48,000. That treats ₦12,000 as a quarter of the profit. Work out the third share carefully: 1 minus a third minus 4 over 9 is 2 over 9.'
      D: 'You went for ₦42,000. That''s what the first two brothers got together, ₦18,000 plus ₦24,000. Add the third brother''s ₦12,000 to get the whole profit.'
  8:
    moments:
      - say: 'We need to simplify a root inside a root inside a root.'
        write: '$\sqrt{160r^{2} + \sqrt{71r^{4} + \sqrt{100r^{8}}}}$'
      - say: 'With roots inside roots, we always work from the inside out. Each inner root, once we find it, joins the terms around it.'
        write: 'Plan: work from the innermost root outwards'
      - say: 'The innermost root is the square root of $100r^{8}$. It splits into root 100 times root $r^{8}$.'
        write: 'Innermost: $\sqrt{100r^{8}} = \sqrt{100} \times \sqrt{r^{8}}$'
      - say: 'Root 100 is 10. And $r^{4}$ times $r^{4}$ is $r^{8}$, so root $r^{8}$ is $r^{4}$.'
        write: '$= 10r^{4}$'
      - say: 'Now put that $10r^{4}$ back into the middle root, in place of the innermost root.'
        write: 'Middle: $\sqrt{71r^{4} + \sqrt{100r^{8}}} = \sqrt{71r^{4} + 10r^{4}}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= 10r4'}, at: '+ 10r4', text: 'inner root'}
      - say: '$71r^{4}$ and $10r^{4}$ are like terms. 71 plus 10 is 81.'
        write: '$= \sqrt{81r^{4}}$'
      - say: 'The square root of 81 is 9, and the square root of $r^{4}$ is $r^{2}$, because $r^{2}$ times $r^{2}$ is $r^{4}$.'
        write: '$= 9r^{2}$'
      - say: 'Now that middle value, $9r^{2}$, goes into the outer root.'
        write: 'Outer: $\sqrt{160r^{2} + 9r^{2}}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '= 9r2'}, at: '9r2', text: 'middle root'}
      - say: 'Again these are like terms. 160 plus 9 is 169.'
        write: '$= \sqrt{169r^{2}}$'
      - say: '169 is 13 squared, so its square root is 13. And the square root of $r^{2}$ is $r$.'
        write: '$= \sqrt{169} \times \sqrt{r^{2}} = 13r$'
      - say: 'So the whole expression simplifies to $13r$, which is answer choice C.'
        write: 'So $\sqrt{160r^{2} + \sqrt{71r^{4} + \sqrt{100r^{8}}}} = 13r$'
        answer: true
    traps:
      A: 'You went for $9r^{2}$. That''s the value of the MIDDLE root. There''s still one more root to take: $\sqrt{160r^{2} + 9r^{2}}$.'
      B: 'You went for $12\sqrt{3}\,r$. Squaring that gives $432r^{2}$, but under the outer root we have $169r^{2}$. Work from the inside out, adding like terms at each layer.'
      D: 'You went for $\sqrt{13}\,r$. That takes the root of 13, but the number under the root is 169, and 169 is 13 squared. So its square root is 13 exactly.'
  9:
    moments:
      - say: 'We want to simplify root 27 plus 3 over root 3.'
        write: '$\sqrt{27} + \dfrac{3}{\sqrt{3}}$'
