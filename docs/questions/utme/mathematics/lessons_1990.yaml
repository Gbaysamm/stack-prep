  32:
    moments:
      - say: 'A sector has radius 10.5 centimetres and angle 48 degrees. We want its perimeter, taking pi as 22 over 7.'
        write: '$r = 10.5,\quad \theta = 48^{\circ},\quad \pi = \tfrac{22}{7}$'
