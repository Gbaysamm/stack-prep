        write: 'From $\sqrt{y} = 3$: $\ y = 3^{2} = 9$'
      - say: 'Now the squares the equation needs. $x^{2}$ is 7 squared, which is 49: the first square.'
        write: '$x^{2} = 7^{2} = 49$'
        doodle_do:
          - {id: sqs, op: label, part: sqx, text: '49'}
      - say: 'And $y^{2}$ is the 9 we just found, squared, which is 81: the middle square.'
        write: '$y^{2} = 9^{2} = 81$'
        doodle_do:
          - {id: sqs, op: label, part: sqy, text: '81'}
        point:
          - {line: 3, kind: move, from: {line: 1, at: '= 9'}, at: '[[9]]2', text: 'y'}
      - say: 'Substitute 49 and 81 into the equation.'
        write: '$49 + 81 + z^{2} = 194$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '= 49'}, at: '49', text: 'x²'}
          - {line: 4, kind: move, from: {line: 3, at: '= 81'}, at: '81', text: 'y²'}
      - say: '49 plus 81 is 130.'
        write: '$130 + z^{2} = 194$'
      - say: 'Subtract 130 from both sides. 194 minus 130 is 64: the area left for the last square.'
        write: '$z^{2} = 194 - 130 = 64$'
