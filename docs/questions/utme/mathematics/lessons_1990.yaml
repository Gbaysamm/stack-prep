        write: 'Outer radius: $R = 10 + 3 = 13$'
        point:
          - {figure: sketch_b, kind: circle, target: '10 cm', text: 'inner'}
          - {figure: sketch_b, kind: circle, target: '3 cm', text: 'thickness'}
      - say: 'The area of a circle is pi r squared.'
        write: 'Area of a circle $= \pi r^{2}$'
      - say: 'Part one, the whole outer circle, radius 13: pi times 13 squared is 169 pi.'
        write: 'Outer circle: $\pi \times 13^{2} = 169\pi$'
        point:
          - {figure: sketch_b, kind: circle, target: '3 cm', text: 'outer edge, R = 13'}
      - say: 'Part two, the hole, radius 10: pi times 10 squared is 100 pi.'
        write: 'Hole: $\pi \times 10^{2} = 100\pi$'
        point:
          - {figure: sketch_b, kind: circle, target: '10 cm', text: 'hole, r = 10'}
      - say: 'The ring, one washer, is the outer circle minus the hole: 169 pi minus 100 pi is 69 pi.'
        write: 'Ring $= 169\pi - 100\pi = 69\pi$'
        doodle_do:
          - {id: pipe, op: label, part: washer, text: '69π cm²'}
        point:
          - {line: 8, kind: highlight, at: '= [[69π]]', to: {doodle: pipe, part: washer}}
      - say: 'The ring''s area is the big circle minus the small circle: pi times 13 squared, minus pi times 10 squared.'
        write: 'Ring area $= \pi R^{2} - \pi r^{2} = \pi(13^{2} - 10^{2})$'
        point:
          - {line: 9, kind: move, from: {line: 4, at: '= 13'}, at: '[[13]]2', text: 'R'}
      - say: '13 squared is 169, and 10 squared is 100.'
        write: '$= \pi(169 - 100)$'
      - say: '169 minus 100 is 69.'
        write: '$= 69\pi\ \text{cm}^{2}$'
      - say: 'The length must be in centimetres too. 1 metre is 100 centimetres, so 3 metres is 3 times 100, which is 300 centimetres: 300 washers, each 1 centimetre thick.'
        write: 'Length: $3\ \text{m} = 3 \times 100 = 300\ \text{cm}$'
        doodle_do:
          - {id: pipe, op: label, part: slices, text: '300 slices'}
        point:
          - {figure: sketch_b, kind: circle, target: '3 m', text: 'length'}
      - say: 'Now go back to the first line: multiply the ring area, 69 pi, by the length, 300.'
        write: '$V = 69\pi \times 300$'
        point:
          - {line: 13, kind: move, from: {line: 11, at: '69π'}, at: '69π', text: 'ring'}
          - {line: 13, kind: move, from: {line: 12, at: '= 300'}, at: '300', text: 'length'}
      - say: '69 times 3 is 207, and times 100 more makes 20,700: all 300 washers together.'
        write: '$= 207 \times 100 \times \pi = 20{,}700\pi$'
        doodle_do:
          - {id: pipe, op: label, part: pipe, text: '20,700π cm³'}
      - say: 'So the volume of metal is 20,700 pi cubic centimetres, which is answer choice D.'
        write: 'Volume of metal $= 20{,}700\pi\ \text{cm}^{3}$'
        answer: true
    traps:
      A: 'You went for 153 pi. That takes the thickness off the inside, giving radii 10 and 7, and leaves the length as 3. The inside radius is 10, so the outside is 13, and 3 m is 300 cm.'
      B: 'You went for 207 pi. The ring area is right, but the length was left as 3 instead of 300 centimetres. Use one unit throughout.'
      C: 'You went for 15,300 pi. That takes the outer radius as 10 and the inner as 7. The INTERNAL radius is 10, so the outer radius is 13, and the ring is 69 pi.'
  43:
    moments:
      - say: 'Two cylinders have heights in the ratio 2 to 3 and base radii in the ratio 9 to 8. We want the ratio of their volumes.'
        write: '$h_{1} : h_{2} = 2 : 3,\quad r_{1} : r_{2} = 9 : 8$'
      - say: 'Let me draw the two cylinders.'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: 'height 2'}
          - {figure: sketch, kind: underline, target: 'height 3'}
          - {figure: sketch, kind: circle, target: 'volume ratio = ?'}
      - say: 'The volume of a cylinder is pi times the radius squared times the height.'
        write: 'Cylinder: $V = \pi r^{2}h$'
      - say: 'So the ratio of the volumes is pi $r_1$ squared $h_1$ to pi $r_2$ squared $h_2$.'
        write: '$V_{1} : V_{2} = \pi r_{1}^{2}h_{1} : \pi r_{2}^{2}h_{2}$'
      - say: 'Pi is on both sides, so it cancels. Notice the radius counts twice, because it is squared, while the height counts once.'
        write: '$= r_{1}^{2}h_{1} : r_{2}^{2}h_{2}$'
        point:
          - {line: 3, kind: strike, at: '= [[π]]', text: 'cancels'}
          - {line: 3, kind: strike, at: ': [[π]]'}
      - say: 'A ratio only needs the sizes compared, so we can take the radii as 9 and 8, and the heights as 2 and 3.'
        write: '$= 9^{2} \times 2 : 8^{2} \times 3$'
        point:
          - {line: 0, kind: highlight, text: 'given'}
          - {figure: sketch, kind: circle, target: 'radius 9'}
          - {figure: sketch, kind: circle, target: 'radius 8'}
      - say: '9 squared is 81, and 8 squared is 64.'
        write: '$= 81 \times 2 : 64 \times 3$'
      - say: '81 times 2 is 162, and 64 times 3 is 192.'
        write: '$= 162 : 192$'
      - say: 'Both numbers divide by 6, so we simplify. 162 divided by 6 is 27, and 192 divided by 6 is 32.'
        write: '$= \dfrac{162}{6} : \dfrac{192}{6} = 27 : 32$'
      - say: 'A sense check: the first cylinder is a little wider but clearly shorter, so it should hold a little less. 27 is a little less than 32.'
        write: 'Check: $27 < 32$, the first holds a little less $\checkmark$'
      - say: 'So the ratio of their volumes is 27 to 32, which is answer choice A.'
        write: 'Therefore $V_{1} : V_{2} = 27 : 32$'
        answer: true
        point:
          - {figure: sketch, kind: label, target: 'volume ratio = ?', text: '27 : 32'}
    traps:
      B: 'You went for 27 to 23. The 27 is right, but the second cylinder''s part is 64 times 3, which is 192, and 192 over 6 is 32.'
      C: 'You went for 23 to 32. The first cylinder''s part is 81 times 2, which is 162, and 162 over 6 is 27, not 23.'
      D: 'You went for 21 to 27. Square the radii to 81 and 64, multiply by the heights to get 162 and 192, and simplify: 27 to 32.'
  44:
    moments:
      - say: 'The figure is a frustum of a cone: top radius 4, base radius 6, and height 6 centimetres. We want its curved surface area.'
        write: '$r_{1} = 4,\quad r_{2} = 6,\quad h = 6$'
        point:
          - {figure: 0, kind: circle, target: '4 cm', text: 'top radius'}
      - say: 'The curved surface of a frustum is pi times the sum of the two radii, times $l$, the SLANT height. That is the length along the sloping side, not straight up.'
        write: 'Curved surface: $\text{CSA} = \pi(r_{1} + r_{2})l$'
        point:
          - {figure: 0, kind: circle, target: l, text: 'slant height'}
      - say: 'To find the slant height, picture a small right-angled triangle down the side of the frustum. Its vertical side is the height, 6.'
        write: 'Vertical side $= h = 6$'
        point:
          - {figure: 0, kind: circle, target: {x: 108, y: 104}, text: 'height 6'}
      - say: 'Its flat side is how far the sloping side moves outwards from top to bottom: the difference of the radii, 6 minus 4, which is 2.'
        write: 'Flat side $= r_{2} - r_{1} = 6 - 4 = 2$'
        point:
          - {figure: 0, kind: label, target: {x: 230, y: 158}, text: '6 − 4 = 2'}
      - say: 'Pythagoras: the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hypotenuse}^{2} = \text{opposite}^{2} + \text{adjacent}^{2}$'
      - say: 'The slant is the hypotenuse of that triangle, so we use Pythagoras.'
        write: 'Pythagoras: $l^{2} = 6^{2} + 2^{2}$'
        point:
          - {figure: 0, kind: circle, target: l, text: 'hypotenuse'}
      - say: '6 squared is 36, and 2 squared is 4. Together that is 40.'
        write: '$l^{2} = 36 + 4 = 40$'
      - say: '40 is 4 times 10, and root 4 is 2. So $l$ is 2 root 10.'
        write: '$l = \sqrt{40} = \sqrt{4 \times 10} = 2\sqrt{10}$'
      - say: 'Now substitute into the formula from the second line: the radii 4 and 6, and the slant height 2 root 10.'
        write: '$\text{CSA} = \pi(4 + 6)(2\sqrt{10})$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
          - {line: 8, kind: move, from: {line: 7, at: '= 210'}, at: '(210)', text: 'slant'}
      - say: '4 plus 6 is 10.'
        write: '$= \pi \times 10 \times 2\sqrt{10}$'
      - say: '10 times 2 root 10 is 20 root 10. So the curved surface area is 20 root 10 pi square centimetres, which is answer choice B.'
        write: '$= 20\sqrt{10}\,\pi\ \text{cm}^{2}$'
        answer: true
    traps:
      A: 'You went for 16 root 10 pi. The sum of the radii is 4 plus 6, which is 10, and 10 times 2 root 10 is 20 root 10.'
      C: 'You went for 24 pi. There''s no root 10 in it, so the slant height was never found. The slant is $\sqrt{6^{2} + 2^{2}} = 2\sqrt{10}$.'
      D: 'You went for 60 pi. That uses the vertical height 6 in place of the slant height. The surface lies along the slope, so use $l = 2\sqrt{10}$.'
  45:
    moments:
      - say: 'A point moves so that it is always the same distance from two straight lines that cross each other. What path does it trace?'
        write: 'Locus: distance to line 1 $=$ distance to line 2'
        point:
          - {figure: sketch, kind: circle, target: O, text: 'lines cross'}
      - say: 'First, how do we measure the distance from a point to a line? Always along the perpendicular, the shortest way.'
        write: 'Distance to a line $=$ perpendicular distance'
        point:
          - {figure: sketch, kind: circle, target: 'd₁', text: 'perpendicular'}
      - say: 'Let me draw the two crossing lines, and a point the same distance from both.'
        show_sketch: true
      - say: 'Where two lines cross, they make an angle. Take a point on the line that cuts that angle exactly in two.'
        write: 'Point on the bisector: $\angle 1 = \angle 2$'
        point:
          - {figure: sketch, kind: circle, target: P, text: 'on the bisector'}
      - say: 'From that point, drop a perpendicular to each line. That makes two right-angled triangles.'
        write: 'Each triangle has a $90^{\circ}$ angle'
        point:
          - {figure: sketch, kind: highlight, target: PA}
          - {figure: sketch, kind: highlight, target: PB, text: 'perpendiculars'}
      - say: 'Both triangles share the same hypotenuse: the line from the crossing point to our point.'
        write: 'Common side: the shared hypotenuse'
        point:
          - {figure: sketch, kind: highlight, target: OP, text: 'shared'}
      - say: 'Their angles at the crossing point are equal, because the bisector cuts the angle exactly in two. A right angle, an equal angle and a shared hypotenuse make the triangles congruent.'
        write: 'Right angle, equal angle, common hypotenuse $\Rightarrow$ congruent'
        point:
          - {figure: sketch, kind: arc, target: AOP}
          - {figure: sketch, kind: arc, target: POB, text: 'equal'}
      - say: 'Congruent triangles have equal sides, so the two perpendicular distances are equal.'
        write: 'So $d_{1} = d_{2}$'
        point:
          - {figure: sketch, kind: circle, target: 'd₁'}
          - {figure: sketch, kind: circle, target: 'd₂', text: 'equal'}
      - say: 'This works for every point on that bisecting line, and for no other points. In fact there are two angle bisectors, one for each pair of angles, and they cross at right angles.'
        write: 'Locus: the angle bisectors, at $90^{\circ}$ to each other'
        point:
          - {figure: sketch, kind: highlight, target: OP, text: 'bisector'}
      - say: 'Compare this with two points: being equal distances from two points gives the perpendicular bisector. Two lines give the angle bisector.'
        write: 'Two points $\to$ perpendicular bisector; two lines $\to$ angle bisector'
      - say: 'So the locus is the angle bisector of the two lines, which is answer choice B.'
        write: 'Locus $=$ angle bisector of the two lines'
        answer: true
    traps:
      A: 'You went for the perpendicular bisector. That''s the locus of points equidistant from two POINTS. Here we have two LINES, and the answer is the angle bisector.'
      C: 'You went for "bisector of the two lines". That doesn''t say what is being bisected. It''s the ANGLE between the lines that is cut in half.'
      D: 'You went for a line parallel to the two lines. The two lines cross, so no single line can be parallel to both. Equal distance from both lines means halving the angle between them.'
  46:
    moments:
      - say: 'The numbers 4, 16, 30, 20, 10, 14 and 26 are shown on a pie chart. We want the total angle for the numbers that are 16 or more.'
        write: '$4,\ 16,\ 30,\ 20,\ 10,\ 14,\ 26$'
      - say: 'Let me draw the pie chart, so we can see the parts of the whole.'
        show_sketch: true
      - say: 'In a pie chart, each number''s angle is its share of the total, times 360 degrees. So first we need the total.'
        write: 'Angle $= \dfrac{\text{number}}{\text{total}} \times 360^{\circ}$'
      - say: 'Let''s add them in pairs. 4 plus 16 is 20, 30 plus 20 is 50, and 10 plus 14 is 24. The 26 is left on its own.'
        write: 'Total $= 4 + 16 + 30 + 20 + 10 + 14 + 26 = 20 + 50 + 24 + 26$'
      - say: '20 plus 50 is 70, and 24 plus 26 is 50. 70 plus 50 is 120.'
        write: '$= 70 + 50 = 120$'
      - say: 'The whole circle, 360 degrees, is shared among 120 units. 360 divided by 120 is 3, so every unit is worth 3 degrees.'
        write: 'Each unit $= \dfrac{360^{\circ}}{120} = 3^{\circ}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= 120'}, at: '120', text: 'total'}
      - say: 'Which numbers are 16 or more? 16, 30, 20 and 26. The 4, 10 and 14 are less than 16, so they are left out.'
        write: 'Numbers $\ge 16$: $\ 16,\ 30,\ 20,\ 26$'
        point:
          - {figure: sketch, kind: circle, target: '16'}
          - {figure: sketch, kind: circle, target: '30'}
          - {figure: sketch, kind: circle, target: '20'}
      - say: '16 plus 30 is 46, and 20 plus 26 is also 46. 46 plus 46 is 92.'
        write: '$16 + 30 + 20 + 26 = 46 + 46 = 92$'
        point:
          - {figure: sketch, kind: circle, target: '26', text: '16 or more'}
      - say: 'Now convert those 92 units to degrees, at 3 degrees each.'
        write: 'Their angles $= 92 \times 3^{\circ}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= 92'}, at: '92', text: 'units'}
          - {line: 8, kind: move, from: {line: 5, at: '= 3∘'}, at: '3∘', text: 'per unit'}
      - say: '92 times 3 is 276.'
        write: '$= 276^{\circ}$'
      - say: 'Let''s check using the numbers we left out. 4 plus 10 plus 14 is 28, and 28 times 3 is 84 degrees.'
        write: 'Check: $(4 + 10 + 14) \times 3^{\circ} = 28 \times 3^{\circ} = 84^{\circ}$'
        point:
          - {figure: sketch, kind: strike, target: '4'}
          - {figure: sketch, kind: strike, target: '10'}
          - {figure: sketch, kind: strike, target: '14', text: 'left out'}
      - say: 'The whole circle minus those 84 degrees: 360 minus 84 is 276. It matches.'
        write: '$360^{\circ} - 84^{\circ} = 276^{\circ}\ \checkmark$'
      - say: 'So the sectors for the numbers 16 or more add to 276 degrees, which is answer choice D.'
        write: 'Sum of the angles $= 276^{\circ}$'
        answer: true
    traps:
      A: 'You went for 48 degrees. That''s just the sector for 16. The question wants every number 16 or more: 16, 30, 20 and 26.'
      B: 'You went for 84 degrees. That''s the other numbers, 4, 10 and 14, which are LESS than 16. Their angles add to 84, and the rest is 360 minus 84, which is 276.'
      C: 'You went for 92 degrees. That''s the sum of the numbers, not their angles. Each unit is worth 3 degrees, so 92 times 3 is 276.'
  47:
    moments:
      - say: 'The mean of ten positive numbers is 16: picture ten stacks, all levelled at 16. When an eleventh number is added, the mean becomes 18. We want that eleventh number.'
        write: '$\text{10 numbers: mean } 16,\quad \text{11 numbers: mean } 18$'
        doodle: {name: 'custom:1990_q47_a', id: stacks, caption: 'ten stacks levelled at 16'}
      - say: 'Mean questions are easiest with totals. The mean is the total divided by the count, so the total is the mean times the count.'
        write: 'Total $=$ mean $\times$ count'
      - say: 'Ten numbers with mean 16 total 10 times 16, which is 160: the ten stacks together.'
        write: 'Ten numbers: total $= 10 \times 16 = 160$'
        doodle_do:
          - {id: stacks, op: label, part: cols, text: 'total 160'}
      - say: 'Eleven numbers with mean 18 total 11 times 18. 10 times 18 is 180, plus one more 18 makes 198.'
        write: 'Eleven numbers: total $= 11 \times 18 = 180 + 18 = 198$'
      - say: 'The total went up only because the eleventh number, the new tall stack, was added. So the eleventh number is the new total minus the old total.'
        write: 'Eleventh number $=$ new total $-$ old total'
        doodle_do:
          - {id: stacks, op: stage, stage: 'custom:1990_q47_a2'}
      - say: 'That is 198 minus 160.'
        write: '$= 198 - 160$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '= 198'}, at: '198', text: 'new total'}
          - {line: 5, kind: move, from: {line: 2, at: '= 160'}, at: '160', text: 'old total'}
      - say: '198 minus 160 is 38: the height of the new stack.'
        write: '$= 38$'
        doodle_do:
          - {id: stacks, op: label, part: new, text: '38'}
        point:
          - {line: 6, kind: highlight, at: '38', to: {doodle: stacks, part: new}}
      - say: 'Let''s check: 160 plus 38 is 198, and 198 divided by 11 is 18, the new mean. Level the stacks again: the new one gives 2 to each of the ten, and keeps 18 for itself.'
        write: 'Check: $\dfrac{160 + 38}{11} = \dfrac{198}{11} = 18\ \checkmark$'
        doodle_do:
          - {id: stacks, op: stage, stage: 'custom:1990_q47_a3'}
      - say: 'So the eleventh number is 38, which is answer choice D.'
        write: 'Eleventh number $= 38$'
        answer: true
    traps:
      A: 'You went for 3. A small number would pull the mean DOWN, not up to 18. Use totals: 198 minus 160 is 38.'
      B: 'You went for 16, the old mean. Adding 16 would leave the mean at 16. To push it up to 18, the new number must be much bigger: 38.'
      C: 'You went for 18, the new mean. Adding a number equal to 18 wouldn''t lift the mean of eleven numbers by 2. Totals give 198 minus 160, which is 38.'
  48:
    moments:
      - say: 'The table shows scores from 1 to 6, with 1, 4, 5, 6, $x$ and 2 students. Picture the students as blocks on a see-saw, each at its score: the average, 3.5, is where it balances. We want $x$.'
        write: '$\text{Scores } 1\text{--}6,\quad f = 1, 4, 5, 6, x, 2$'
        doodle: {name: 'custom:1990_q48_a', id: seesaw, caption: 'the mean is the balance point'}
      - say: 'The mean of a frequency table is the sum of score times frequency, divided by the total frequency.'
        write: '$\text{mean} = \dfrac{\sum fx}{\sum f}$'
      - say: 'The total number of students, all the blocks: 1 plus 4 plus 5 plus 6 plus 2 is 18, plus $x$.'
        write: '$\sum f = 1 + 4 + 5 + 6 + x + 2 = 18 + x$'
        doodle_do:
          - {id: seesaw, op: label, part: stacks, text: '18 + x students'}
      - say: 'Now each score times its frequency.'
        write: '$\sum fx = 1(1) + 2(4) + 3(5) + 4(6) + 5(x) + 6(2)$'
      - say: 'That''s 1, 8, 15, 24, $5x$ and 12.'
        write: '$= 1 + 8 + 15 + 24 + 5x + 12$'
      - say: '1 plus 8 is 9, plus 15 is 24, plus 24 is 48, plus 12 is 60. So the sum is 60 plus $5x$.'
        write: '$= 60 + 5x$'
      - say: 'Now put both sums into the mean formula, with 60 plus $5x$ on top and 18 plus $x$ underneath, and set it equal to 3.5.'
        write: 'Mean: $\dfrac{60 + 5x}{18 + x} = 3.5$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= 60+5x'}, at: '60+5x', text: 'top'}
          - {line: 6, kind: move, from: {line: 2, at: '= 18+x'}, at: '18+x', text: 'bottom'}
      - say: 'Multiply both sides by 18 plus $x$.'
        write: '$60 + 5x = 3.5(18 + x)$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '18+x'}, at: '(18+x)', text: 'multiply across'}
      - say: '3.5 times 18 is 63, and 3.5 times $x$ is $3.5x$.'
        write: '$60 + 5x = 3.5 \times 18 + 3.5x = 63 + 3.5x$'
      - say: 'Subtract $3.5x$ from both sides. $5x$ minus $3.5x$ is $1.5x$.'
        write: '$60 + 1.5x = 63$'
      - say: 'Subtract 60 from both sides. 63 minus 60 is 3.'
        write: '$1.5x = 63 - 60 = 3$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '60'}, at: '− 60', text: 'across the ='}
      - say: 'Divide by 1.5. 3 divided by 1.5 is 2: two blocks at score 5.'
        write: '$x = \dfrac{3}{1.5} = 2$'
        doodle_do:
          - {id: seesaw, op: stage, stage: 'custom:1990_q48_a2'}
        point:
          - {line: 11, kind: highlight, at: '=2', to: {doodle: seesaw, part: xblocks}}
      - say: 'Check: with $x = 2$, the top is 60 plus 5 times 2, which is 70, and the bottom is 18 plus 2, which is 20. 70 over 20 is 3.5: the see-saw balances.'
        write: 'Check: $\dfrac{60 + 5(2)}{18 + 2} = \dfrac{70}{20} = 3.5\ \checkmark$'
        doodle_do:
          - {id: seesaw, op: label, part: pivot, text: '70 ÷ 20 = 3.5'}
      - say: 'So $x$ is 2, which is answer choice B.'
        write: 'Therefore $x = 2$'
        answer: true
    traps:
      A: 'You went for 1. Then the mean is 65 over 19, about 3.42, not 3.5. Solve $\dfrac{60 + 5x}{18 + x} = 3.5$ to get 2.'
      C: 'You went for 3. Then the mean is 75 over 21, about 3.57, a bit too high. The equation gives $x = 2$.'
      D: 'You went for 4. Then the mean is 80 over 22, about 3.64, too high. Remember $x$ goes in the total frequency as well: $\dfrac{60 + 5x}{18 + x} = 3.5$ gives 2.'
  49:
    moments:
      - say: 'Two numbers are removed at random from 1, 2, 3 and 4. Picture four numbered balls: the odd ones yellow, the even ones blue. What is the probability that their sum is even?'
        write: '$\{1,\ 2,\ 3,\ 4\}$'
        doodle: {name: 'custom:1990_q49_a', id: balls, caption: 'Take two of 1, 2, 3 and 4'}
      - say: 'With only four numbers, the safest approach is to list every possible pair. The order doesn''t matter, so 1 and 2 is the same pair as 2 and 1.'
        write: 'List every pair (order does not matter)'
      - say: 'The pairs that use 1 are: 1 and 2, 1 and 3, 1 and 4.'
        write: 'Pairs with 1: $\{1,2\},\ \{1,3\},\ \{1,4\}$'
      - say: 'The pairs without 1 are: 2 and 3, 2 and 4, and 3 and 4.'
        write: 'Pairs without 1: $\{2,3\},\ \{2,4\},\ \{3,4\}$'
      - say: 'So there are 3 plus 3, which is 6 possible pairs: the 6 lines joining the balls.'
        write: 'Possible pairs $= 3 + 3 = 6$'
        doodle_do:
          - {id: balls, op: stage, stage: 'custom:1990_q49_a2'}
      - say: 'Now the sums of the first three pairs: 1 plus 2 is 3, 1 plus 3 is 4, and 1 plus 4 is 5.'
        write: 'Sums: $1 + 2 = 3,\quad 1 + 3 = 4,\quad 1 + 4 = 5$'
      - say: 'And the other three: 2 plus 3 is 5, 2 plus 4 is 6, and 3 plus 4 is 7.'
        write: 'Sums: $2 + 3 = 5,\quad 2 + 4 = 6,\quad 3 + 4 = 7$'
      - say: 'The even sums are 4, from 1 and 3, and 6, from 2 and 4: the two crossing lines. That is 2 favourable pairs.'
        write: 'Even sums: $4$ from $\{1,3\}$ and $6$ from $\{2,4\}$, so favourable $= 2$'
        doodle_do:
          - {id: balls, op: highlight, part: diags}
          - {id: balls, op: label, part: diags, text: '2 even sums'}
        point:
          - {line: 5, kind: circle, at: '1+3=4', text: 'even'}
          - {line: 6, kind: circle, at: '2+4=6', text: 'even'}
          - {line: 7, kind: highlight, at: 'favourable = 2', to: {doodle: balls, part: diags}}
      - say: 'That makes sense: a sum is even only when both numbers are odd or both are even, two yellows or two blues, and there is just one pair of each here.'
        write: 'Even sum: odd $+$ odd, or even $+$ even'
