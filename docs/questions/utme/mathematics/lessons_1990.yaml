          - {line: 4, kind: move, from: {line: 3, at: '10d'}, at: '10d', text: 'assistant'}
          - {line: 4, kind: move, from: {line: 0, at: '2,000'}, at: '2000', text: 'given'}
      - say: 'Expand the bracket. 40 times $d$ is $40d$, and 40 times 10 is 400: the pay for the painter''s 10 extra days.'
