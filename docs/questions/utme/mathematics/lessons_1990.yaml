          - {id: walk, op: move, part: walker, path: walk}
          - {id: walk, op: label, part: full, text: '360°'}
      - say: 'In a regular polygon the exterior angles are all equal. So $n$ lots of 40 degrees make 360.'
        write: '$n \times 40^{\circ} = 360^{\circ}$'
        point:
