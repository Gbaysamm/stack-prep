          - {line: 6, kind: highlight, at: '64', to: {doodle: sqs, part: sqz}}
      - say: 'Take the square root, the side of that square. The square root of 64 is 8, and we take the positive root, as the options do.'
        write: '$z = \sqrt{64} = 8$'
        doodle_do:
          - {id: sqs, op: label, part: zlab, text: 'z = 8'}
      - say: 'Check: 49 plus 81 plus 64 is 194.'
        write: 'Check: $49 + 81 + 64 = 194\ \checkmark$'
      - say: 'So $z$ is 8, which is answer choice B.'
        write: 'Therefore $z = 8$'
        answer: true
    traps:
      A: 'You went for root 10. Then $z^{2}$ would be 10, but $194 - 49 - 81$ is 64. Remember $y$ is 9, so $y^{2}$ is 81.'
      C: 'You went for 12.2. Its square is about 149, far more than what is left for $z^{2}$. Root $y$ is 3, so $y$ is 9 and $y^{2}$ is 81, which leaves $z^{2} = 64$.'
      D: 'You went for 13.4. Its square is about 180, far more than what is left for $z^{2}$. With $x^{2} = 49$ and $y^{2} = 81$, $z^{2}$ is 64 and $z$ is 8.'
  27:
    moments:
      - say: 'We want the sum of the first twenty terms of log $a$, log $a^{2}$, log $a^{3}$, and so on.'
        write: '$\log a,\ \log a^{2},\ \log a^{3}, \ldots$'
      - say: 'One law of logs makes this friendly: a power inside a log comes out in front.'
        write: 'Law: $\log a^{n} = n\log a$'
      - say: 'Using that law on each term, the terms are 1 log $a$, 2 log $a$, 3 log $a$, and so on: picture them as a staircase, each step one log $a$ higher.'
        write: 'So the terms are $\log a,\ 2\log a,\ 3\log a, \ldots$'
        doodle: {name: 'custom:1990_q27_a', id: stairs, caption: 'twenty steps, each log a higher'}
        point:
          - {line: 1, kind: box, text: 'the law'}
      - say: 'Each term is log $a$ more than the one before. So it is an arithmetic progression: first term log $a$, common difference 2 log $a$ minus log $a$, which is log $a$.'
        write: 'First term $= \log a$, common difference $= 2\log a - \log a = \log a$'
      - say: 'The nth term of an arithmetic progression is the first term plus n minus 1 common differences.'
        write: 'AP: $T_{n} = a + (n - 1)d$'
      - say: 'The twentieth term, the top step, is the first term plus 19 differences: log $a$ plus 19 log $a$, which is 20 log $a$.'
        write: '$T_{20} = \log a + 19\log a = 20\log a$'
        doodle_do:
          - {id: stairs, op: label, part: last, text: '20 log a'}
      - say: 'The sum of an A.P. is the number of terms over 2, times the first term plus the last term.'
        write: 'Sum: $S_{n} = \dfrac{n}{2}(\text{first} + \text{last})$'
      - say: 'Here $n$ is 20, the first term is log $a$, and the last is the 20 log $a$ we just found.'
        write: '$S_{20} = \dfrac{20}{2}(\log a + 20\log a)$'
        point:
          - {line: 6, kind: box, text: 'the rule'}
          - {line: 7, kind: move, from: {line: 5, at: '= 20loga'}, at: '20loga', text: 'last term'}
      - say: '20 over 2 is 10. And log $a$ plus 20 log $a$ is 21 log $a$. Picture a flipped copy of the stairs on top: every column is then 21 log $a$ tall, and our stairs are half of those 20 columns.'
        write: '$= 10 \times 21\log a$'
        doodle_do:
          - {id: stairs, op: stage, stage: 'custom:1990_q27_a2'}
          - {id: stairs, op: label, part: twin, text: 'each column: 21 log a'}
        point:
          - {line: 8, kind: highlight, at: '21loga', to: {doodle: stairs, part: twin}}
      - say: '10 times 21 is 210: half of 20 columns of 21.'
        write: '$= 210\log a$'
        doodle_do:
          - {id: stairs, op: label, part: sum, text: '210 log a'}
      - say: 'Now use the law of logs backwards: the 210 goes back up as a power. So the sum is log $a$ to the 210, which is answer choice D.'
        write: '$= \log a^{210}$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '210'}, at: '210', text: 'up as the power'}
        answer: true
    traps:
      A: 'You went for log $a$ to the 20. That''s the twentieth TERM. The question asks for the SUM of the first twenty terms.'
      B: 'You went for log $a$ to the 21. That''s the first term plus the last term. The sum formula also multiplies by $\dfrac{n}{2}$, which is 10, giving 210.'
      C: 'You went for log $a$ to the 200. That''s 10 times the last term only. The bracket must hold the first term plus the last: 1 plus 20 is 21, and 10 times 21 is 210.'
  28:
    moments:
      - say: 'We want the sum of the first 18 terms of 3, 6, 12, and so on. Picture them as piles of blocks.'
        write: '$3,\ 6,\ 12, \ldots$'
        doodle: {name: 'custom:1990_q28_a', id: piles, caption: '3, 6, 12, … as piles'}
      - say: 'First, what kind of progression is it? Divide each term by the one before. 6 over 3 is 2, and 12 over 6 is 2.'
        write: 'Ratios: $\dfrac{6}{3} = 2,\quad \dfrac{12}{6} = 2$'
      - say: 'The same ratio each time, each pile double the one before, so it is geometric. The first term is 3 and the common ratio is 2.'
        write: 'Geometric: $a = 3,\quad r = 2$'
        doodle_do:
          - {id: piles, op: circle, part: ratio}
      - say: 'For a geometric progression with $r$ bigger than 1, the sum of the first $n$ terms is $a$ times $r^{n}$ minus 1, over $r$ minus 1.'
        write: 'Sum: $S_{n} = \dfrac{a(r^{n} - 1)}{r - 1}$'
      - say: 'Substitute $a = 3$ and $r = 2$ from the line above, and $n = 18$.'
        write: '$S_{18} = \dfrac{3(2^{18} - 1)}{2 - 1}$'
        point:
          - {line: 3, kind: box, text: 'the rule'}
          - {line: 4, kind: move, from: {line: 2, at: 'a = [[3]]'}, at: '[[3]](', text: 'a'}
          - {line: 4, kind: move, from: {line: 2, at: 'r = [[2]]'}, at: '[[2]]18', text: 'r'}
      - say: 'On the bottom, 2 minus 1 is 1.'
        write: '$= \dfrac{3(2^{18} - 1)}{1}$'
      - say: 'Dividing by 1 changes nothing. There is no need to work out 2 to the 18, because every option is written with powers of 2.'
        write: '$= 3(2^{18} - 1)$'
      - say: 'Let''s test the formula on the first three terms. With $n = 3$ it gives 3 times 2 cubed minus 1. 2 cubed is 8, 8 minus 1 is 7, and 3 times 7 is 21.'
        write: 'Test $n = 3$: $3(2^{3} - 1) = 3(8 - 1) = 3 \times 7 = 21$'
      - say: 'Adding the first three piles directly, 3 plus 6 plus 12 is also 21. The formula works.'
        write: '$3 + 6 + 12 = 21\ \checkmark$'
        doodle_do:
          - {id: piles, op: label, part: piles, text: '3 + 6 + 12 = 21'}
        point:
          - {line: 8, kind: highlight, at: '21', to: {doodle: piles, part: piles}}
      - say: 'So the sum of all 18 piles is 3 times $2^{18}$ minus 1, which is answer choice D.'
        write: 'So $S_{18} = 3(2^{18} - 1)$'
        doodle_do:
          - {id: piles, op: label, part: more, text: '3(2¹⁸ − 1)'}
        answer: true
    traps:
      A: 'You went for $3(2^{17} - 1)$. The power 17 is $n - 1$, which belongs to the $n$th-term formula $ar^{n-1}$. The SUM formula uses $r^{n}$, so the power is 18.'
      B: 'You went for $3(2^{18}) - 1$. The bracket is in the wrong place. The 3 multiplies the whole of $2^{18} - 1$.'
      C: 'You went for $3(2^{18} + 1)$. The sum formula has $r^{n}$ MINUS 1. Test it with three terms: $3(2^{3} + 1)$ is 27, but the sum is 21.'
  29:
    moments:
      - say: 'We need the equation of the quadratic drawn in the graph. The graph gives us three clues.'
        write: 'Find the quadratic from the graph'
      - say: 'Clue one: in the diagram, the curve crosses the $x$-axis at negative 1 and at 2. Those crossing points are the roots.'
        write: 'Roots: $x = -1,\ x = 2$'
        point:
          - {figure: 0, kind: circle, target: '−1', text: 'root'}
          - {figure: 0, kind: circle, target: {x: 220, y: 150}, text: 'root'}
      - say: 'A root at negative 1 gives the factor $x + 1$, because it is zero when $x$ is negative 1. A root at 2 gives the factor $x - 2$.'
        write: 'Factors: $(x + 1)$ and $(x - 2)$'
      - say: 'So the curve is some number $k$ times those two factors.'
        write: 'So $y = k(x + 1)(x - 2)$'
      - say: 'Clue two: the curve crosses the $y$-axis at 2. So when $x$ is 0, $y$ is 2. Put those into our equation.'
        write: 'At $x = 0$, $y = 2$: $\ 2 = k(0 + 1)(0 - 2)$'
        point:
          - {figure: 0, kind: circle, target: {x: 120, y: 50}, text: 'y = 2'}
      - say: '0 plus 1 is 1, and 0 minus 2 is negative 2. 1 times negative 2 is negative 2.'
        write: '$2 = k(1)(-2) = -2k$'
      - say: 'Divide both sides by negative 2, and $k$ is negative 1. Clue three agrees: the curve opens downwards, so $k$ must be negative.'
        write: '$k = \dfrac{2}{-2} = -1$'
        point:
          - {figure: 0, kind: label, target: {x: 145, y: 37}, text: 'opens downwards'}
      - say: 'Put $k = -1$ back into the equation.'
        write: '$y = -(x + 1)(x - 2)$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '= −1'}, at: '= [[−]](', text: 'k'}
      - say: 'Expand the brackets. $x$ times $x$ is $x^{2}$, $x$ times negative 2 is minus $2x$, 1 times $x$ is $x$, and 1 times negative 2 is negative 2.'
        write: '$(x + 1)(x - 2) = x^{2} - 2x + x - 2 = x^{2} - x - 2$'
      - say: 'Now the minus sign in front changes every sign inside.'
        write: '$y = -(x^{2} - x - 2) = -x^{2} + x + 2$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '= x2−x−2'}, at: '(x2−x−2)', text: 'expanded'}
      - say: 'Check the root at 2: negative 2 squared is negative 4, so negative 4 plus 2 plus 2 is 0.'
        write: 'Check $x = 2$: $-(2)^{2} + 2 + 2 = -4 + 2 + 2 = 0\ \checkmark$'
      - say: 'And the root at negative 1: negative 1 minus 1 plus 2 is 0.'
        write: 'Check $x = -1$: $-(-1)^{2} + (-1) + 2 = -1 - 1 + 2 = 0\ \checkmark$'
      - say: 'So the equation is $y = -x^{2} + x + 2$, which is answer choice D.'
        write: 'Therefore $y = -x^{2} + x + 2$'
        answer: true
    traps:
      A: 'You went for $y = x^{2} + x - 2$. That opens UPWARDS and its roots are 1 and negative 2. The curve in the diagram opens downwards, with roots negative 1 and 2.'
      B: 'You went for $y = x^{2} - x - 2$. Its roots, negative 1 and 2, are right, but it opens upwards and crosses the $y$-axis at negative 2. The graph opens downwards and crosses at positive 2.'
      C: 'You went for $y = -x^{2} - x + 2$. It opens the right way, but its roots are 1 and negative 2: the signs of the factors are swapped. A root at negative 1 gives the factor $x + 1$.'
  30:
