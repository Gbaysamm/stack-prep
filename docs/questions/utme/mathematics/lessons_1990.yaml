  39:
    moments:
      - say: 'We''re told cos theta is 12 over 13, and we want 1 plus cot squared theta.'
        write: '$\cos\theta = \tfrac{12}{13}$'
      - say: 'Let''s start from the basic identity: sine squared plus cosine squared is 1.'
        write: 'Identity: $\sin^{2}\theta + \cos^{2}\theta = 1$'
      - say: 'Divide every term by sine squared. Sine squared over sine squared is 1, and cosine squared over sine squared is cot squared.'
        write: '$1 + \dfrac{\cos^{2}\theta}{\sin^{2}\theta} = \dfrac{1}{\sin^{2}\theta}$'
      - say: 'So 1 plus cot squared is 1 over sine squared, which is cosec squared. Now we just need sine.'
        write: '$1 + \cot^{2}\theta = \dfrac{1}{\sin^{2}\theta}$'
      - say: 'In a right-angled triangle, the cos of an angle is the adjacent side over the hypotenuse.'
        write: 'SOH CAH TOA: $\cos\theta = \dfrac{\text{adjacent}}{\text{hypotenuse}}$'
      - say: 'Draw a right-angled triangle. Cosine is adjacent over hypotenuse, so from 12 over 13, the adjacent side is 12 and the hypotenuse is 13.'
        write: 'Triangle: adjacent $= 12$, hypotenuse $= 13$'
        show_sketch: true
        point:
          - {figure: sketch, kind: highlight, target: AB, text: 'adjacent'}
          - {figure: sketch, kind: highlight, target: AC, text: 'hypotenuse'}
      - say: 'Pythagoras: the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hypotenuse}^{2} = \text{opposite}^{2} + \text{adjacent}^{2}$'
      - say: 'By Pythagoras, the opposite side squared is 13 squared minus 12 squared.'
        write: '$\text{opp}^{2} = 13^{2} - 12^{2}$'
        point:
          - {figure: sketch, kind: highlight, target: BC, text: 'opposite'}
      - say: '13 squared is 169, and 12 squared is 144. 169 minus 144 is 25.'
        write: '$= 169 - 144 = 25$'
      - say: 'The square root of 25 is 5.'
        write: '$\text{opp} = \sqrt{25} = 5$'
        point:
          - {figure: sketch, kind: label, target: BC, text: '5'}
      - say: 'So sine theta is opposite over hypotenuse, 5 over 13.'
        write: '$\sin\theta = \dfrac{\text{opp}}{\text{hyp}} = \dfrac{5}{13}$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '= 5'}, at: '5', text: 'opposite'}
      - say: 'Square it. 5 squared is 25, and 13 squared is 169.'
        write: '$\sin^{2}\theta = \dfrac{25}{169}$'
      - say: 'Now go back to our identity: 1 plus cot squared is 1 over that. 1 over a fraction flips it.'
        write: '$1 + \cot^{2}\theta = \dfrac{1}{\tfrac{25}{169}} = \dfrac{169}{25}$'
        point:
          - {line: 3, kind: box, text: 'identity'}
          - {line: 11, kind: arrow, text: 'sin²'}
      - say: 'A direct check. Cot is adjacent over opposite, 12 over 5. Squared, that is 144 over 25. Add 1, which is 25 over 25, and we get 169 over 25.'
        write: 'Check: $\cot\theta = \dfrac{12}{5}$, so $1 + \dfrac{144}{25} = \dfrac{25}{25} + \dfrac{144}{25} = \dfrac{169}{25}\ \checkmark$'
      - say: 'So 1 plus cot squared theta is 169 over 25, which is answer choice A.'
        write: 'Therefore $1 + \cot^{2}\theta = \dfrac{169}{25}$'
        answer: true
    traps:
      B: 'You went for 25 over 169. That''s sine squared. We need 1 over sine squared, which flips it to 169 over 25.'
      C: 'You went for 169 over 144. That''s 1 plus TAN squared, which is sec squared. Cot goes with cosec: 1 plus cot squared is 169 over 25.'
      D: 'You went for 144 over 169. That''s cosine squared. We need 1 plus cot squared, which is 1 over sine squared: 169 over 25.'
