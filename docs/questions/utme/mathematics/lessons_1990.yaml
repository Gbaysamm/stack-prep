          - {line: 7, kind: highlight, at: '400', to: {doodle: days, part: extra}}
      - say: 'Divide both sides by 50. 1600 divided by 50 is 32. So the assistant worked 32 days: his strip is 32 days long.'
        write: '$d = \dfrac{1600}{50} = 32$'
