          - {line: 9, kind: move, from: {line: 3, at: '= 16'}, at: '16', text: 'possible'}
      - say: 'Divide top and bottom by 2: 2 shaded squares out of 16. So the probability is 1 over 8, which is answer choice C.'
        write: '$= \dfrac{1}{8}$'
        doodle_do:
          - {id: grid, op: label, part: q, text: '2 of 16 = 1/8'}
        answer: true
