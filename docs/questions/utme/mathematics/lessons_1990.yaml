          - {line: 5, kind: move, from: {line: 4, at: '= [[34s]]'}, at: '34s', text: 'sides'}
          - {figure: 0, kind: circle, target: '10.5 cm', text: 'h'}
      - say: 'Half of $4s$ over 3 is $2s$ over 3.'
        write: '$73.5 = \dfrac{2s}{3} \times 10.5$'
      - say: '10.5 divided by 3 is 3.5, and 2 times 3.5 is 7. So the right side is just $7s$.'
        write: '$73.5 = 2s \times 3.5 = 7s$'
      - say: 'Divide both sides by 7. 73.5 divided by 7 is 10.5.'
        write: '$s = \dfrac{73.5}{7} = 10.5$'
      - say: 'Let''s check. $QR$ is a third of 10.5, which is 3.5.'
        write: 'Check: $QR = \dfrac{10.5}{3} = 3.5$'
      - say: 'The parallel sides add to 10.5 plus 3.5, which is 14. Half of 14 is 7, and 7 times 10.5 is 73.5, the area we were given.'
        write: '$\tfrac{1}{2}(10.5 + 3.5)(10.5) = 7 \times 10.5 = 73.5\ \checkmark$'
      - say: 'So $PS$ is 10 and a half centimetres, which is answer choice D.'
        write: 'So $PS = 10\tfrac{1}{2}\ \text{cm}$'
        answer: true
    traps:
