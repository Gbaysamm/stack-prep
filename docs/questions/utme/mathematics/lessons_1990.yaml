          - {figure: sketch, kind: label, target: AB, text: '8.8 cm'}
      - say: '10.5 plus 10.5 is 21, and 8.8 plus 21 is 29.8. So the perimeter, the ant''s whole walk, is 29.8 centimetres, which is answer choice D.'
        write: '$= 8.8 + 21 = 29.8\ \text{cm}$'
