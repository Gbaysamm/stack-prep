  45:
    moments:
      - say: 'A point moves so that it is always the same distance from two straight lines that cross each other. What path does it trace?'
        write: 'Locus: distance to line 1 $=$ distance to line 2'
        point:
          - {figure: sketch, kind: circle, target: O, text: 'lines cross'}
      - say: 'First, how do we measure the distance from a point to a line? Always along the perpendicular, the shortest way.'
        write: 'Distance to a line $=$ perpendicular distance'
        point:
          - {figure: sketch, kind: circle, target: 'd₁', text: 'perpendicular'}
      - say: 'Let me draw a diagram of the circle first, so we can see what we are working with.'
        show_sketch: true
      - say: 'Where two lines cross, they make an angle. Take a point on the line that cuts that angle exactly in two.'
        write: 'Point on the bisector: $\angle 1 = \angle 2$'
        point:
          - {figure: sketch, kind: circle, target: P, text: 'on the bisector'}
      - say: 'From that point, drop a perpendicular to each line. That makes two right-angled triangles.'
        write: 'Each triangle has a $90^{\circ}$ angle'
        point:
          - {figure: sketch, kind: highlight, target: PA}
          - {figure: sketch, kind: highlight, target: PB, text: 'perpendiculars'}
      - say: 'Both triangles share the same hypotenuse: the line from the crossing point to our point.'
        write: 'Common side: the shared hypotenuse'
        point:
          - {figure: sketch, kind: highlight, target: OP, text: 'shared'}
      - say: 'Their angles at the crossing point are equal, because the bisector cuts the angle exactly in two. A right angle, an equal angle and a shared hypotenuse make the triangles congruent.'
        write: 'Right angle, equal angle, common hypotenuse $\Rightarrow$ congruent'
        point:
          - {figure: sketch, kind: arc, target: AOP}
          - {figure: sketch, kind: arc, target: POB, text: 'equal'}
      - say: 'Congruent triangles have equal sides, so the two perpendicular distances are equal.'
        write: 'So $d_{1} = d_{2}$'
        point:
          - {figure: sketch, kind: circle, target: 'd₁'}
          - {figure: sketch, kind: circle, target: 'd₂', text: 'equal'}
      - say: 'This works for every point on that bisecting line, and for no other points. In fact there are two angle bisectors, one for each pair of angles, and they cross at right angles.'
        write: 'Locus: the angle bisectors, at $90^{\circ}$ to each other'
        point:
          - {figure: sketch, kind: highlight, target: OP, text: 'bisector'}
      - say: 'Compare this with two points: being equal distances from two points gives the perpendicular bisector. Two lines give the angle bisector.'
        write: 'Two points $\to$ perpendicular bisector; two lines $\to$ angle bisector'
      - say: 'So the locus is the angle bisector of the two lines, which is answer choice B.'
        write: 'Locus $=$ angle bisector of the two lines'
        answer: true
    traps:
      A: 'You went for the perpendicular bisector. That''s the locus of points equidistant from two POINTS. Here we have two LINES, and the answer is the angle bisector.'
      C: 'You went for "bisector of the two lines". That doesn''t say what is being bisected. It''s the ANGLE between the lines that is cut in half.'
      D: 'You went for a line parallel to the two lines. The two lines cross, so no single line can be parallel to both. Equal distance from both lines means halving the angle between them.'
