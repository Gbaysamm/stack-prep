      - say: 'We need to simplify $x$ over $x + y$, plus $y$ over $x - y$, minus $x^{2}$ over $x^{2} - y^{2}$.'
        write: '$\dfrac{x}{x + y} + \dfrac{y}{x - y} - \dfrac{x^{2}}{x^{2} - y^{2}}$'
      - say: 'We need a common denominator. $x^{2} - y^{2}$ is a difference of two squares: $x + y$ times $x - y$. So it contains both of the other denominators.'
        write: '$x^{2} - y^{2} = (x + y)(x - y)$'
      - say: 'For the first fraction, the bottom is missing the factor $x - y$, so multiply top and bottom by $x - y$.'
        write: 'First: $\dfrac{x}{x + y} = \dfrac{x(x - y)}{(x + y)(x - y)} = \dfrac{x(x - y)}{x^{2} - y^{2}}$'
      - say: 'For the second, the bottom is missing $x + y$, so multiply top and bottom by $x + y$.'
        write: 'Second: $\dfrac{y}{x - y} = \dfrac{y(x + y)}{(x - y)(x + y)} = \dfrac{y(x + y)}{x^{2} - y^{2}}$'
      - say: 'Now all three fractions are over $x^{2} - y^{2}$, so we combine the tops, keeping the minus in front of $x^{2}$.'
        write: 'Sum $= \dfrac{x(x - y) + y(x + y) - x^{2}}{x^{2} - y^{2}}$'
      - say: 'Expand the top. $x$ times $x - y$ is $x^{2} - xy$, and $y$ times $x + y$ is $xy + y^{2}$.'
        write: '$= \dfrac{x^{2} - xy + xy + y^{2} - x^{2}}{x^{2} - y^{2}}$'
      - say: 'Minus $xy$ and plus $xy$ cancel. $x^{2}$ and minus $x^{2}$ cancel. Only $y^{2}$ is left.'
        write: '$= \dfrac{y^{2}}{x^{2} - y^{2}}$'
        point:
          - {line: 5, kind: strike, at: '−xy', text: 'cancel'}
          - {line: 5, kind: strike, at: '+xy'}
      - say: 'Let''s test with $x = 3$ and $y = 2$. The question becomes 3 over 5, plus 2 over 1, minus 9 over 5.'
        write: 'Test $x = 3,\ y = 2$: $\dfrac{3}{5} + \dfrac{2}{1} - \dfrac{9}{5}$'
      - say: '3 over 5 minus 9 over 5 is negative 6 over 5. And 2 minus 6 over 5 is 10 over 5 minus 6 over 5, which is 4 over 5.'
        write: '$= \dfrac{10}{5} - \dfrac{6}{5} = \dfrac{4}{5}$'
      - say: 'Our answer gives 2 squared over 3 squared minus 2 squared, that is 4 over 9 minus 4, which is also 4 over 5.'
        write: '$\dfrac{2^{2}}{3^{2} - 2^{2}} = \dfrac{4}{9 - 4} = \dfrac{4}{5}\ \checkmark$'
      - say: 'So the expression simplifies to $y^{2}$ over $x^{2} - y^{2}$, which is answer choice B.'
        write: 'So the expression $= \dfrac{y^{2}}{x^{2} - y^{2}}$'
        answer: true
    traps:
      A: 'You went for $\dfrac{x^{2}}{x^{2} - y^{2}}$. That is the last fraction alone, assuming the other two cancel. They add to $\dfrac{x^{2} + y^{2}}{x^{2} - y^{2}}$, and taking away $x^{2}$ leaves $y^{2}$.'
      C: 'You went for $\dfrac{x}{x^{2} - y^{2}}$. When you expand the numerator, the $x^{2}$ and $xy$ terms all cancel, and what is left is $y^{2}$, not $x$.'
      D: 'You went for $\dfrac{y}{x^{2} - y^{2}}$. Close, but the leftover term is $y$ times $y$, which is $y^{2}$. With $x = 3$, $y = 2$ your option gives 2 over 5, not 4 over 5.'
  26:
