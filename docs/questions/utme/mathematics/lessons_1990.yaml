  38:
    moments:
      - section: 'The question'
        say: 'A regular pentagon is full of isosceles triangles. The angle we want sits in one of them, and the interior angle of the pentagon unlocks it.'
        write: 'Regular pentagon $PQRST$, $\angle RQS = ?$'
      - section: 'Solution'
        say: 'Solution. Let me draw the regular pentagon $PQRST$, with the diagonals $PR$ and $QS$ crossing at $O$. The angle we want is at $Q$, between $QR$ and $QS$.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '?', text: '∠RQS'}
      - say: 'First the interior angle, through the exterior angle. The five exterior angles are equal and add up to 360 degrees, so each is 360 divided by 5.'
        write: 'Ext. $\angle = \dfrac{360^{\circ}}{5}$ (sum of ext. $\angle$s $= 360^{\circ}$)'
      - say: '360 divided by 5 is 72 degrees.'
        write: 'Ext. $\angle = 72^{\circ}$'
      - say: 'At each corner, the interior and exterior angles lie on a straight line. So the interior angle is 180 minus 72. The reason is angles on a straight line.'
        write: 'Int. $\angle = 180^{\circ} - 72^{\circ}$ ($\angle$s on a str. line)'
      - say: '180 minus 72 is 108 degrees. Every corner of the pentagon is 108, including the corner at $R$.'
        write: 'Int. $\angle = 108^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: QRS, text: '108°'}
      - say: 'Now triangle $QRS$. $QR$ and $RS$ are both sides of the regular pentagon, so they are equal.'
        write: '$|QR| = |RS|$ (sides of regular pentagon)'
        point:
          - {figure: sketch, kind: highlight, target: QR}
          - {figure: sketch, kind: highlight, target: RS, text: 'equal'}
      - say: 'So triangle $QRS$ is isosceles, and its base angles at $Q$ and $S$ are equal. The reason is base angles of an isosceles triangle.'
        write: '$\angle RQS = \angle RSQ$ (base $\angle$s of isos. $\triangle$)'
        point:
          - {figure: sketch, kind: arc, target: RQS}
          - {figure: sketch, kind: arc, target: RSQ}
      - say: 'The three angles of triangle $QRS$, which are the two equal base angles and the 108 at $R$, add up to 180. The reason is the angle sum of a triangle.'
        write: '$2\angle RQS + 108^{\circ} = 180^{\circ}$ ($\angle$ sum of $\triangle$)'
      - say: 'Take 108 to the other side, so we have 180 minus 108.'
        write: '$2\angle RQS = 180^{\circ} - 108^{\circ}$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '+ 108∘'}, at: '− 108∘', text: 'across'}
      - say: '180 minus 108 is 72.'
        write: '$2\angle RQS = 72^{\circ}$'
      - say: 'Divide both sides by 2. 72 divided by 2 is 36 degrees.'
        write: '$\angle RQS = \dfrac{72^{\circ}}{2} = 36^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: RQS, text: '36°'}
      - section: 'Check'
        say: 'Check the triangle. 36 plus 36 plus 108 is 180. Notice that the point $O$ was not needed for this angle.'
        write: '$36^{\circ} + 36^{\circ} + 108^{\circ} = 180^{\circ}\ \checkmark$'
        point:
          - {figure: sketch, kind: circle, target: O, text: 'not needed'}
      - say: 'Therefore angle $RQS$ is 36 degrees, option A.'
        write: '$\therefore \angle RQS = 36^{\circ}$ (A)'
        answer: true
    traps:
      B: 'You went for 72 degrees. That is the exterior angle of the pentagon, or the two base angles of triangle $QRS$ together. Each base angle is half of 72, which is 36.'
      C: 'You went for 108 degrees. That is the whole interior angle at a corner of the pentagon. Angle $RQS$ is only the part of the angle at $Q$ cut off by the diagonal $QS$.'
      D: 'You went for 144 degrees. That is 180 minus 36, not an angle of triangle $QRS$. Its base angles are 180 minus 108, which is 72, shared between two, which gives 36 each.'
  39:
    moments:
      - section: 'The question'
        say: 'We know cos theta is 12 over 13, and we want 1 plus cot squared theta. No tables are needed, because a right-angled triangle gives every ratio.'
        write: '$\cos\theta = \dfrac{12}{13}$, find $1 + \cot^{2}\theta$'
      - section: 'Solution'
        say: 'Solution. Let me draw a right-angled triangle $ABC$, with the right angle at $B$ and theta at $A$.'
        write: 'Solution: right $\angle$ at $B$, $\theta$ at $A$'
        show_sketch: true
        'on': 'draw'
        point:
          - {figure: sketch, kind: circle, target: θ}
      - say: 'Label the sides from theta. $BC$, across from theta, is the opposite. $AB$, next to theta, is the adjacent. $AC$, across from the right angle, is the hypotenuse.'
        write: 'opp $= |BC|$, adj $= |AB|$, hyp $= |AC|$'
        point:
          - {figure: sketch, kind: highlight, target: BC, text: 'opp'}
          - {figure: sketch, kind: highlight, target: AB, text: 'adj'}
          - {figure: sketch, kind: highlight, target: AC, text: 'hyp'}
      - say: 'SOH CAH TOA. Cos is CAH, which is adjacent over hypotenuse.'
        write: 'CAH: $\cos\theta = \dfrac{\text{adj}}{\text{hyp}} = \dfrac{12}{13}$'
      - say: 'So the adjacent side is 12 and the hypotenuse is 13.'
        write: 'adj $= 12$, hyp $= 13$'
        point:
          - {figure: sketch, kind: circle, target: '12', text: 'adj'}
          - {figure: sketch, kind: circle, target: '13', text: 'hyp'}
      - section: 'The opposite side'
        say: 'Find the opposite side by Pythagoras, where the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hyp}^{2} = \text{opp}^{2} + \text{adj}^{2}$'
      - say: 'Substitute, and 13 squared equals opp squared plus 12 squared.'
        write: '$13^{2} = \text{opp}^{2} + 12^{2}$'
      - say: 'Take 12 squared to the other side. 169 minus 144 is 25.'
        write: '$\text{opp}^{2} = 169 - 144 = 25$'
      - say: 'The square root of 25 is 5. So the opposite side is 5.'
        write: '$\text{opp} = \sqrt{25} = 5$'
        point:
          - {figure: sketch, kind: label, target: '?', text: '5'}
      - section: 'cot θ'
        say: 'Cot is the reciprocal of tan. Tan is opposite over adjacent, so cot is adjacent over opposite, which is 12 over 5.'
        write: '$\cot\theta = \dfrac{1}{\tan\theta} = \dfrac{\text{adj}}{\text{opp}} = \dfrac{12}{5}$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '= [[5]]'}, at: '[[5]]12', text: 'opp'}
      - say: 'Square it. 12 squared is 144, and 5 squared is 25.'
        write: '$\cot^{2}\theta = \dfrac{144}{25}$'
      - section: 'The answer'
        say: 'Now add 1. Write 1 as 25 over 25, so both fractions have the same denominator.'
        write: '$1 + \cot^{2}\theta = \dfrac{25}{25} + \dfrac{144}{25}$'
        point:
          - {line: 11, kind: move, from: {line: 10, at: '= [[25144]]'}, at: '+ [[25144]]', text: 'cot²θ'}
      - say: '25 plus 144 is 169. So it is 169 over 25.'
        write: '$= \dfrac{169}{25}$'
      - section: 'Check'
        say: 'Check with an identity. Divide sin squared plus cos squared equals 1 by sin squared, and we get 1 plus cot squared equals cosec squared.'
        write: 'Check: $1 + \cot^{2}\theta = \operatorname{cosec}^{2}\theta = \dfrac{1}{\sin^{2}\theta}$'
      - say: 'Sin theta is opposite over hypotenuse, 5 over 13. So 1 over sin squared is 169 over 25. It agrees.'
        write: '$\sin\theta = \dfrac{5}{13}$: $\ \dfrac{1}{\sin^{2}\theta} = \dfrac{169}{25}\ \checkmark$'
      - section: 'Answer'
        say: 'So 1 plus cot squared theta is 169 over 25, which is answer choice A.'
        write: '$\therefore 1 + \cot^{2}\theta = \dfrac{169}{25}$'
        answer: true
    traps:
      B: 'You went for 25 over 169. That is sin squared theta. 1 plus cot squared is cosec squared, 1 over sin squared, so it turns over to 169 over 25.'
      C: 'You went for 169 over 144. That is 1 plus TAN squared, which is sec squared. Cot is adjacent over opposite, 12 over 5, so 1 plus cot squared is 169 over 25.'
      D: 'You went for 144 over 169. That is cos squared theta, 12 over 13 squared. We need 1 plus cot squared, and 1 plus 144 over 25, which is 169 over 25.'
  40:
    moments:
      - section: 'The question'
        say: 'Two angles and one side are given. That is exactly when the sine rule does the work, once we know the third angle.'
        write: '$\angle X = 30^{\circ}$, $\angle Y = 105^{\circ}$, $|XY| = 8$ cm'
        point:
          - {figure: 0, kind: arc, target: YXZ, text: '30°'}
          - {figure: 0, kind: arc, target: XYZ, text: '105°'}
          - {figure: 0, kind: circle, target: '?', text: '|YZ| = ?'}
      - section: 'Solution'
        say: 'Solution. First the angle at $Z$, from the angle sum. Then the sine rule, pairing each side with the angle opposite it.'
        write: 'Solution'
      - say: 'The three angles of triangle $XYZ$ add up to 180 degrees. The reason is the angle sum of a triangle.'
        write: '$\angle Z + 30^{\circ} + 105^{\circ} = 180^{\circ}$ ($\angle$ sum of $\triangle$)'
      - say: '30 plus 105 is 135. Take it to the other side, so 180 minus 135.'
        write: '$\angle Z = 180^{\circ} - 135^{\circ}$'
      - say: '180 minus 135 is 45 degrees.'
        write: '$\angle Z = 45^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: XZY, text: '45°'}
      - say: 'Now the sine rule. Each side, divided by the sine of the angle opposite it, gives the same value. Small $a$ is the side opposite angle $A$, small $b$ the side opposite $B$.'
        write: '$\dfrac{a}{\sin A} = \dfrac{b}{\sin B}$ (sine rule)'
      - say: '$YZ$ is the side opposite the angle at $X$. $XY$ is the side opposite the angle at $Z$. So we pair them like this.'
        write: '$\dfrac{|YZ|}{\sin X} = \dfrac{|XY|}{\sin Z}$'
        point:
          - {figure: 0, kind: highlight, target: YZ, text: 'opp. X'}
          - {figure: 0, kind: highlight, target: XY, text: 'opp. Z'}
      - say: 'Now substitute. Angle $X$ is 30 degrees, $XY$ is 8, and angle $Z$ is 45 degrees.'
        write: '$\dfrac{|YZ|}{\sin 30^{\circ}} = \dfrac{8}{\sin 45^{\circ}}$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '45∘'}, at: '45∘', text: 'angle Z'}
      - say: 'Cross-multiply, that is, multiply both sides by sine 30, so that $YZ$ stands alone.'
        write: '$|YZ| = \dfrac{8 \sin 30^{\circ}}{\sin 45^{\circ}}$'
      - say: 'Sine 30 is a half, and sine 45 is 1 over root 2. Both are special angles to know by heart.'
        write: '$|YZ| = \dfrac{8 \times \frac{1}{2}}{\frac{1}{\sqrt{2}}}$'
      - say: '8 times a half is 4.'
        write: '$|YZ| = 4 \div \dfrac{1}{\sqrt{2}}$'
      - say: 'Dividing by 1 over root 2 is the same as multiplying by root 2, so turn the fraction upside down and multiply.'
        write: '$|YZ| = 4 \times \sqrt{2}$'
      - say: 'So $YZ$ is 4 root 2 centimetres.'
        write: '$|YZ| = 4\sqrt{2}$ cm'
        point:
          - {figure: 0, kind: label, target: YZ, text: '4√2 cm'}
      - section: 'Check'
        say: 'Check. $YZ$ faces the smallest angle, 30 degrees, so it must be the shortest side. Root 2 is about 1.414, so 4 root 2 is about 5.66, which is less than 8.'
        write: '$4\sqrt{2} \approx 4 \times 1.414 \approx 5.66 < 8\ \checkmark$'
      - say: 'Therefore $YZ$ is 4 root 2 centimetres, option C.'
        write: '$\therefore |YZ| = 4\sqrt{2}$ cm (C)'
        answer: true
    traps:
      A: 'You went for 16 root 2 cm. That is 8 divided by sine 30 and then divided by sine 45 as well. The sine rule gives $YZ$ as 8 sine 30 over sine 45, which is 4 times root 2.'
      B: 'You went for 8 root 2 cm. That swaps the sines to give 8 sine 45 over sine 30. Pair each side with the angle opposite it, so $YZ$ goes with 30 degrees and $XY$ with 45 degrees.'
      D: 'You went for 2 root 2 cm. That is 4 times 1 over root 2, because the last step multiplied by sine 45 instead of dividing. Dividing 4 by 1 over root 2 gives 4 root 2.'
  41:
    moments:
      - section: 'The question'
        say: 'The figure is a rectangle with a semicircle below it and a right-angled triangle cut out of the top. The 6 and the 8 look like extras, but they give the width.'
        write: '$|OP| = 11$, $|OT| = 6$, $|TS| = 8$, $\angle OTS = 90^{\circ}$'
        point:
          - {figure: 0, kind: circle, target: '11 cm', text: 'OP'}
          - {figure: 0, kind: highlight, target: OT, text: '6'}
          - {figure: 0, kind: highlight, target: TS, text: '8'}
      - section: 'Solution'
        say: 'Solution. The shaded part is the rectangle, plus the semicircle below it, minus the triangle cut out of the top. We find each piece.'
        write: 'Solution'
      - say: 'So the plan, written down, is shaded area equals rectangle plus semicircle minus triangle $OTS$.'
        write: 'Shaded $=$ rect. $+$ semicircle $- \triangle OTS$'
        point:
          - {figure: 0, kind: circle, target: Q, text: 'semicircle'}
          - {figure: 0, kind: circle, target: T, text: 'cut out'}
      - say: 'First the width $OS$. Triangle $OTS$ has its right angle at $T$, so $OS$ is the hypotenuse. The reason is Pythagoras.'
        write: '$|OS|^{2} = |OT|^{2} + |TS|^{2}$ (Pythagoras)'
        point:
          - {figure: 0, kind: arc, target: OTS, text: '90°'}
          - {figure: 0, kind: highlight, target: OS, text: 'hypotenuse'}
      - say: 'Substitute 6 and 8.'
        write: '$|OS|^{2} = 6^{2} + 8^{2}$'
      - say: '6 squared is 36, and 8 squared is 64. 36 plus 64 is 100.'
        write: '$|OS|^{2} = 36 + 64 = 100$'
      - say: 'The square root of 100 is 10. The rectangle is 10 centimetres wide.'
        write: '$|OS| = \sqrt{100} = 10$ cm'
        point:
          - {figure: 0, kind: label, target: OS, text: '10 cm'}
      - say: 'The area of a rectangle is length times breadth.'
        write: 'Area of rect. $= l \times b$'
      - say: 'The length is 11 and the breadth is 10. 11 times 10 is 110 square centimetres.'
        write: '$= 11 \times 10 = 110\ \text{cm}^{2}$'
      - say: '$PR$ is opposite $OS$ in the rectangle, so it is also 10. $PR$ is the diameter of the semicircle.'
        write: '$|PR| = |OS| = 10$ cm (opp. sides of rect.)'
        point:
          - {figure: 0, kind: highlight, target: PR, text: 'diameter'}
      - say: 'The radius is half the diameter. Half of 10 is 5.'
        write: '$r = \dfrac{10}{2} = 5$ cm'
      - say: 'A semicircle is half a circle, so its area is a half of pi $r$ squared.'
        write: 'Area of semicircle $= \dfrac{1}{2}\pi r^{2}$'
      - say: 'Substitute 22 over 7 for pi, and 5 for $r$.'
        write: '$= \dfrac{1}{2} \times \dfrac{22}{7} \times 5^{2}$'
      - say: 'Half of 22 is 11, and 5 squared is 25. 11 times 25 is 275, over 7.'
        write: '$= \dfrac{11 \times 25}{7} = \dfrac{275}{7}$'
      - say: '7 times 39 is 273, remainder 2. So it is 39 and 2 over 7 square centimetres.'
        write: '$= 39\tfrac{2}{7}\ \text{cm}^{2}$'
      - say: 'The area of a triangle is a half, times base, times height.'
        write: 'Area of $\triangle = \dfrac{1}{2} \times b \times h$'
      - say: 'In triangle $OTS$, the sides 6 and 8 meet at the right angle, so they are the base and the height.'
        write: '$= \dfrac{1}{2} \times 6 \times 8 = 24\ \text{cm}^{2}$'
        point:
          - {figure: 0, kind: highlight, target: OT}
          - {figure: 0, kind: highlight, target: TS, text: 'base, height'}
      - say: 'Now the plan, which is the rectangle, plus the semicircle, minus the triangle.'
        write: 'Shaded $= 110 + 39\tfrac{2}{7} - 24$'
        point:
          - {line: 17, kind: move, from: {line: 8, at: '= 110'}, at: '110', text: 'rectangle'}
          - {line: 17, kind: move, from: {line: 16, at: '= 24'}, at: '24', text: 'triangle'}
      - say: '110 minus 24 is 86, and 86 plus 39 and 2 over 7 is 125 and 2 over 7.'
        write: '$= 125\tfrac{2}{7}\ \text{cm}^{2}$'
      - section: 'Check'
        say: 'Check in the other order. Rectangle plus semicircle is 149 and 2 over 7. Take away the triangle, 24, and 125 and 2 over 7 is left.'
        write: '$149\tfrac{2}{7} - 24 = 125\tfrac{2}{7}\ \checkmark$'
      - say: 'Therefore the shaded area is 125 and 2 over 7 square centimetres, option A.'
        write: '$\therefore$ Shaded area $= 125\tfrac{2}{7}\ \text{cm}^{2}$ (A)'
        answer: true
    traps:
      B: 'You went for 149 and 2 over 7. That is the rectangle plus the semicircle, with the triangle never taken away. The triangle at the top is not shaded, so subtract its 24.'
      C: 'You went for 243 and 1 over 7. That uses 10 as the radius, so the semicircle becomes 157 and 1 over 7. 10 is the diameter $PR$, so the radius is 5.'
      D: 'You went for 267 and a half. That is about 110 plus 157 and 1 over 7, with the radius taken as 10 and the triangle not taken away. With radius 5 and the triangle subtracted, the area is 125 and 2 over 7.'
  42:
    moments:
      - section: 'The question'
        say: 'Slice a metal pipe across, and every slice is a ring, like a washer. Stack the washers end to end and you have the pipe. We want the metal in 3 metres of it.'
        write: 'Find the volume of metal in 3 m of the pipe.'
        doodle: {name: 'custom:1990_q42_a', id: pipe, caption: 'the pipe as a stack of washers'}
      - say: 'Write Solution, then sketch the pipe from outside as a cylinder 3 metres long.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: '3 m', text: 'length', 'on': '3 metres long'}
      - say: 'Now the end of the pipe. The hole has internal radius 10 cm, and the metal wall around it is 3 cm thick.'
        write: 'Internal radius $= 10$ cm, thickness $= 3$ cm'
        show_sketch: sketch_b
        point:
          - {figure: sketch_b, kind: underline, target: '10 cm', text: 'internal radius', 'on': 'internal radius 10'}
          - {figure: sketch_b, kind: underline, target: '3 cm', text: 'thickness', 'on': '3 cm thick'}
      - section: 'What we know'
        say: 'Call the inner radius small r, and it is 10 cm.'
        write: '$r = 10$ cm'
      - say: 'The wall sits outside the hole, so the outer radius, capital R, is 10 plus 3, which is 13.'
        write: '$R = 10 + 3 = 13$ cm'
        point:
          - {figure: sketch_b, kind: circle, target: '3 cm', text: 'R = 10 + 3', 'on': '10 plus 3'}
      - say: 'Every length must be in centimetres. 1 metre is 100 cm, so 3 metres is 300 cm.'
        write: '$h = 3$ m $= 300$ cm'
        doodle_do:
          - {id: pipe, op: label, part: slices, text: '300 cm long', 'on': '300 cm'}
      - section: 'The formula'
        say: 'The metal is the solid outer cylinder minus the hole through it.'
        write: 'Vol. of metal $=$ vol. of outer cylinder $-$ vol. of hole'
      - say: 'Volume of a cylinder is pi r squared h. So V is pi capital R squared h, minus pi small r squared h. Take out pi h as a common factor.'
        write: '$V = \pi R^{2}h - \pi r^{2}h = \pi h(R^{2} - r^{2})$'
      - section: 'Substitute'
        say: 'Substitute, so h is 300, capital R is 13 and small r is 10.'
        write: '$V = \pi \times 300 \times (13^{2} - 10^{2})$'
        point:
          - {line: 8, kind: move, from: {line: 5, at: '= 300'}, at: '× 300', text: 'h', 'on': 'h is 300'}
          - {line: 8, kind: move, from: {line: 4, at: '= 13'}, at: '(13', text: 'R', 'on': 'R is 13'}
      - section: 'Simplify'
        say: '13 squared is 169, and 10 squared is 100.'
        write: '$= 300\pi(169 - 100)$'
      - say: '169 minus 100 is 69. That 69 pi is the area of one ring, one washer.'
        write: '$= 300\pi \times 69$'
        doodle_do:
          - {id: pipe, op: label, part: washer, text: 'ring = 69π cm²', 'on': 'one washer'}
      - say: 'For 300 times 69, 3 times 69 is 207, and times 100 gives 20,700.'
        write: '$= 20\,700\pi$'
      - say: 'Therefore the volume of metal is 20,700 pi cubic centimetres. It is cubic because it is a volume.'
        write: '$\therefore$ volume of metal $= 20\,700\pi\ \text{cm}^{3}$'
        doodle_do:
          - {id: pipe, op: label, part: pipe, text: '20,700π cm³', 'on': 'Therefore'}
      - section: 'Check'
        say: 'Check the bracket by difference of two squares. 13 plus 10 is 23, 13 minus 10 is 3, and 23 times 3 is 69 again.'
        write: 'Check: $13^{2} - 10^{2} = (13 + 10)(13 - 10) = 23 \times 3 = 69$ ✓'
      - section: 'Answer'
        say: 'So the volume of metal is 20,700 pi cubic centimetres, which is answer choice D.'
        write: '$\therefore V = 20\,700\pi\ \text{cm}^{3}$ (D)'
        answer: true
    traps:
      A: 'You went for 153 pi. That takes the 3 cm off the inside, giving radii 10 and 7, and leaves h as 3. The internal radius is 10, so R is 13, and h is 300 cm.'
      B: 'You went for 207 pi. The ring, 69 pi, is right, but h was left as 3. Change 3 m to 300 cm first. Then 69 pi times 300 is 20,700 pi.'
      C: 'You went for 15,300 pi. That takes 10 as the outer radius and 7 as the inner. The INTERNAL radius is 10, so R is 10 plus 3, which is 13, and R squared minus r squared is 69.'
  43:
    moments:
      - section: 'The question'
        say: 'Two cylinders have heights in the ratio 2 to 3 and base radii in the ratio 9 to 8. We want the ratio of their volumes.'
        write: '$h_{1} : h_{2} = 2 : 3,\quad r_{1} : r_{2} = 9 : 8,\quad V_{1} : V_{2} = ?$'
      - section: 'Solution'
        say: 'Solution. Let me draw the two cylinders, with their heights and radii.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: 'height 2'}
          - {figure: sketch, kind: underline, target: 'height 3'}
      - say: 'Write each ratio as a fraction. $r$ 1 over $r$ 2 is 9 over 8, and $h$ 1 over $h$ 2 is 2 over 3.'
        write: '$\dfrac{r_{1}}{r_{2}} = \dfrac{9}{8},\quad \dfrac{h_{1}}{h_{2}} = \dfrac{2}{3}$'
        point:
          - {figure: sketch, kind: circle, target: 'radius 9'}
          - {figure: sketch, kind: circle, target: 'radius 8'}
      - section: 'The formula'
        say: 'The volume of a cylinder is pi $r$ squared $h$.'
        write: '$V = \pi r^{2}h$'
      - say: 'So the ratio of the volumes is pi $r$ 1 squared $h$ 1, over pi $r$ 2 squared $h$ 2.'
        write: '$\dfrac{V_{1}}{V_{2}} = \dfrac{\pi r_{1}^{2}h_{1}}{\pi r_{2}^{2}h_{2}}$'
      - say: 'Pi is on the top and the bottom, so it cancels. What is left is $r$ 1 over $r$ 2, squared, times $h$ 1 over $h$ 2.'
        write: '$= \left(\dfrac{r_{1}}{r_{2}}\right)^{2} \times \dfrac{h_{1}}{h_{2}}$'
      - section: 'Substitute'
        say: 'Substitute 9 over 8 and 2 over 3.'
        write: '$= \left(\dfrac{9}{8}\right)^{2} \times \dfrac{2}{3}$'
      - say: '9 squared is 81, and 8 squared is 64.'
        write: '$= \dfrac{81}{64} \times \dfrac{2}{3}$'
      - say: 'Cancel first. 3 goes into 81 twenty-seven times. 2 goes into 64 thirty-two times.'
        write: '$= \dfrac{27}{32} \times \dfrac{1}{1} = \dfrac{27}{32}$'
      - section: 'Check'
        say: 'Check without cancelling. 81 times 2 is 162, and 64 times 3 is 192. Divide both by 6 to get 27 and 32.'
        write: 'Check: $\dfrac{81 \times 2}{64 \times 3} = \dfrac{162}{192} = \dfrac{27}{32}\ \checkmark$'
      - say: 'Therefore the ratio of their volumes is 27 to 32, which is option A.'
        write: '$\therefore V_{1} : V_{2} = 27 : 32$'
        answer: true
        point:
          - {figure: sketch, kind: label, target: 'volume ratio = ?', text: '27 : 32'}
    traps:
      B: 'You went for 27 to 23. The 27 is right, but the second part is 64 times 3, which is 192, and 192 divided by 6 is 32.'
      C: 'You went for 23 to 32. The first part is 81 times 2, which is 162, and 162 divided by 6 is 27, not 23.'
      D: 'You went for 21 to 27. Square the radius ratio first. 9 over 8, squared, is 81 over 64, and times 2 over 3 that is 27 over 32.'
  44:
    moments:
      - section: 'The question'
        say: 'A frustum is a cone with its top sliced off. We want its curved surface area, which is the sloping side only, not the two flat circles.'
        write: 'Find the curved surface area of the frustum.'
        point:
          - {figure: 0, kind: highlight, target: l, text: 'curved side', 'on': 'the sloping side'}
      - say: 'Write Solution. Then complete the cone by extending the sloping sides until they meet at the vertex V. The small cone we cut off sits on top.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: V, text: 'vertex', 'on': 'the vertex V'}
      - section: 'What we know'
        say: 'List the givens. The top radius r is 4 cm, the base radius capital R is 6 cm, and the frustum is 6 cm high.'
        write: '$r = 4$ cm, $R = 6$ cm, height of frustum $= 6$ cm'
        point:
          - {figure: 0, kind: circle, target: '4 cm', text: 'r', 'on': 'top radius r'}
      - say: 'We do not know how tall the small cone is, so we give it a letter.'
        write: 'Let the height of the small cone be $x$ cm.'
        point:
          - {figure: sketch, kind: circle, target: x, text: 'small cone', 'on': 'give it a letter'}
      - section: 'Similar triangles'
        say: 'The small cone and the big cone are similar, so height over radius is in the same ratio. Small height x over big height x plus 6, equals 4 over 6.'
        write: '$\dfrac{x}{x + 6} = \dfrac{4}{6}$ (similar $\triangle$s)'
      - say: 'Cross-multiply, so 6 times x equals 4 times x plus 6. That gives 6x equals 4x plus 24.'
        write: '$6x = 4x + 24$'
      - say: 'Take 4x from both sides, so 2x equals 24, and x is 12.'
        write: '$2x = 24 \Rightarrow x = 12$ cm'
        point:
          - {figure: sketch, kind: label, target: x, text: '12 cm', 'on': 'x is 12'}
      - say: 'So the big cone is 12 plus 6, which is 18 cm tall.'
        write: 'Height of big cone $= 12 + 6 = 18$ cm'
      - section: 'Slant heights'
        say: 'The curved surface of a cone needs its slant height, l. Radius, height and slant make a right-angled triangle, so by Pythagoras, l squared is r squared plus h squared.'
        write: '$l^{2} = r^{2} + h^{2}$ (Pythagoras)'
      - say: 'For the big cone, slant capital L, we have 6 squared plus 18 squared. 36 plus 324 is 360.'
        write: '$L^{2} = 6^{2} + 18^{2} = 36 + 324 = 360$'
      - say: '360 is 36 times 10, and root 36 is 6. So capital L is 6 root 10.'
        write: '$L = \sqrt{36 \times 10} = 6\sqrt{10}$'
      - say: 'For the small cone, slant small l, we have 4 squared plus 12 squared. 16 plus 144 is 160.'
        write: '$l^{2} = 4^{2} + 12^{2} = 16 + 144 = 160$'
      - say: '160 is 16 times 10, and root 16 is 4. So small l is 4 root 10.'
        write: '$l = \sqrt{16 \times 10} = 4\sqrt{10}$'
      - section: 'The curved surface'
        say: 'The curved surface of the frustum is the curved surface of the big cone, minus that of the small cone we cut off.'
        write: 'CSA of frustum $=$ CSA of big cone $-$ CSA of small cone'
      - say: 'Curved surface area of a cone is pi r l. So it is pi capital R capital L, minus pi small r small l.'
        write: '$= \pi RL - \pi rl$'
      - say: 'Substitute. Capital R is 6 and capital L is 6 root 10, then small r is 4 and small l is 4 root 10.'
        write: '$= \pi(6)(6\sqrt{10}) - \pi(4)(4\sqrt{10})$'
        point:
          - {line: 15, kind: move, from: {line: 10, at: '= 610'}, at: '(610)', text: 'L', 'on': 'capital L is 6 root 10'}
          - {line: 15, kind: move, from: {line: 12, at: '= 410'}, at: '(410)', text: 'l', 'on': 'small l is 4 root 10'}
      - say: '6 times 6 is 36, and 4 times 4 is 16.'
        write: '$= 36\sqrt{10}\,\pi - 16\sqrt{10}\,\pi$'
      - say: '36 minus 16 is 20. So it is 20 root 10 pi.'
        write: '$= 20\sqrt{10}\,\pi$'
      - say: 'Therefore the curved surface area is 20 root 10 pi square centimetres.'
        write: '$\therefore$ CSA $= 20\sqrt{10}\,\pi\ \text{cm}^{2}$'
      - section: 'Check'
        say: 'Check with the frustum formula, pi times R plus r, times the frustum''s own slant. Its slant is 6 root 10 minus 4 root 10, which is 2 root 10.'
        write: 'Check: $\pi(6 + 4)(2\sqrt{10}) = 20\sqrt{10}\,\pi$ ✓'
      - section: 'Answer'
        say: 'So the curved surface area is 20 root 10 pi square centimetres, which is answer choice B.'
        write: '$\therefore$ CSA $= 20\sqrt{10}\,\pi\ \text{cm}^{2}$ (B)'
        answer: true
    traps:
      A: 'You went for 16 root 10 pi. That is the curved surface of the small cone, pi times 4 times 4 root 10. The frustum is the big cone minus the small one, so 36 root 10 pi minus 16 root 10 pi, which is 20 root 10 pi.'
      C: 'You went for 24 pi. There is no root 10 in it, so a slant height was never found. Pythagoras gives slants 6 root 10 and 4 root 10, and the answer is 20 root 10 pi.'
      D: 'You went for 60 pi. That is pi times 6 plus 4, times 6, with the vertical height used as the slant. The curved surface lies along the slope, so the slant, 2 root 10, is needed.'
  45:
    moments:
      - section: 'The question'
        say: 'A point moves so that it is always equidistant from two straight lines that cross each other. This is one of the four standard loci. Name it exactly.'
        write: 'Equidistant from two intersecting lines; locus $= ?$'
      - section: 'Solution'
        say: 'Solution. A locus is the path traced by a moving point under a given condition. Equidistant means at equal distances, and distance from a line is measured along the perpendicular.'
        write: 'Solution: distance from a line $=$ perpendicular distance'
      - say: 'Recall the four standard loci, which are a circle, the perpendicular bisector, a pair of parallel lines, and the angle bisector.'
        write: 'Standard loci: circle; $\perp$ bisector; parallel lines; $\angle$ bisector'
      - say: 'The locus of points equidistant from two intersecting lines is the bisector of the angle between them.'
        write: 'Equidistant from two lines $\Rightarrow$ bisector of the angle between them'
      - say: 'Construct it with ruler and compasses. Let the lines cross at $O$. With centre $O$, draw an arc to cut the two lines at $A$ and $B$.'
        show_sketch: true
        write: 'Centre $O$, any radius: arc cuts the lines at $A$ and $B$'
        point:
          - {figure: sketch, kind: circle, target: O}
          - {figure: sketch, kind: circle, target: A}
          - {figure: sketch, kind: circle, target: B}
      - say: 'With centres $A$ and $B$ and the same radius, draw two arcs to meet at $C$.'
        write: 'Centres $A$ and $B$, same radius: arcs meet at $C$'
        point:
          - {figure: sketch, kind: circle, target: C}
      - say: 'Join $O$ to $C$. The line $OC$ cuts the angle $AOB$ into two equal angles, so it is the angle bisector, the locus.'
        write: 'Join $OC$: $\angle AOC = \angle BOC$'
        point:
          - {figure: sketch, kind: arc, target: AOC}
          - {figure: sketch, kind: arc, target: BOC, text: 'equal'}
          - {figure: sketch, kind: highlight, target: OC, text: 'locus'}
      - section: 'Check'
        say: 'Check why it works. $OA$ equals $OB$, the first arc. $AC$ equals $BC$, the same radius. And $OC$ is common. So the two triangles are congruent, by three sides.'
        write: 'Check: $|OA| = |OB|$, $|AC| = |BC|$, $OC$ common $\Rightarrow \triangle OAC \equiv \triangle OBC$ (SSS)'
        point:
          - {figure: sketch, kind: highlight, target: AC}
          - {figure: sketch, kind: highlight, target: BC}
      - say: 'So the angles at $O$ are equal, and $OC$ really does bisect the angle. The two lines make two pairs of angles, so there is a second bisector, dotted, at right angles to $OC$.'
        write: '$\therefore \angle AOC = \angle BOC\ \checkmark$ (two bisectors, at $90^{\circ}$)'
      - say: 'Leave the construction arcs showing in the exam, because they are the evidence that earns the marks.'
        write: 'Keep the arcs: they earn the marks'
      - section: 'Answer'
        say: 'Therefore the locus is the angle bisector of the two lines, which is option B.'
        write: '$\therefore$ locus: the angle bisector of the two lines'
        answer: true
        point:
          - {figure: sketch, kind: circle, target: locus}
    traps:
      A: 'You went for the perpendicular bisector. That is the locus of points equidistant from two POINTS. Here the fixed objects are two LINES, so the locus is the angle bisector.'
      C: 'You went for "bisector of the two lines". It does not say what is bisected. It is the ANGLE between the lines that is cut in half, so it is the angle bisector.'
      D: 'You went for a line parallel to the two lines. The two lines cross, so no line can be parallel to both. Equal distances from both lines put the point on the angle bisector.'
  46:
    moments:
      - section: 'The question'
        say: 'The numbers 4, 16, 30, 20, 10, 14 and 26 are shown on a pie chart. We want the sum of the angles for the numbers equal to or greater than 16.'
        write: 'Sum of the angles for the numbers $\ge 16$ $= ?$'
      - section: 'Solution'
        say: 'Solution. Draw the table with each number f, and its sectoral angle, f over sigma f, times 360 degrees.'
        write: 'Sectoral angle $= \dfrac{f}{\Sigma f} \times 360^{\circ}$'
        diagram: {id: t, kind: table, columns: ['Number (f)', 'Sectoral angle'], rows: [[4, ''], [16, ''], [30, ''], [20, ''], [10, ''], [14, ''], [26, '']]}
      - say: 'First sigma f. In pairs, 4 plus 16 is 20, 30 plus 20 is 50, 10 plus 14 is 24, and 26 on its own. 20 plus 50 plus 24 plus 26 is 120.'
        write: '$\Sigma f = 4 + 16 + 30 + 20 + 10 + 14 + 26 = 120$'
        diagram_do:
          - {id: t, op: total, part: 'col:1', 'on': '120'}
      - say: 'So each angle is f over 120, times 360. 360 divided by 120 is 3, so each angle is 3 times f.'
        write: 'Sectoral angle $= \dfrac{f}{120} \times 360^{\circ} = 3f$ degrees'
      - section: 'The numbers 16 or more'
        say: 'The numbers 16 or more are 16, 30, 20 and 26. 16 times 3 is 48 degrees, and 30 times 3 is 90.'
        write: '$16 \to 48^{\circ},\ \ 30 \to 90^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:2,2', text: '48°', 'on': '48 degrees'}
          - {id: t, op: fill, part: 'cell:3,2', text: '90°', 'on': 'is 90'}
      - say: '20 times 3 is 60 degrees, and 26 times 3 is 78.'
        write: '$20 \to 60^{\circ},\ \ 26 \to 78^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,2', text: '60°', 'on': '60 degrees'}
          - {id: t, op: fill, part: 'cell:7,2', text: '78°', 'on': 'is 78'}
      - say: 'Add those four angles. 48 plus 90 is 138, plus 60 is 198, plus 78 is 276 degrees.'
        write: 'Sum $= 48 + 90 + 60 + 78 = 276^{\circ}$'
      - section: 'Check'
        say: 'Check with the numbers left out, 4, 10 and 14. Their angles are 12, 30 and 42, which make 84. 276 plus 84 is 360 degrees.'
        write: '$12 + 30 + 42 = 84^{\circ};\ \ 276 + 84 = 360^{\circ}\ \checkmark$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,2', text: '12°', 'on': '12'}
          - {id: t, op: fill, part: 'cell:5,2', text: '30°', 'on': '30'}
          - {id: t, op: fill, part: 'cell:6,2', text: '42°', 'on': '42'}
      - section: 'Answer'
        say: 'Therefore the angles for the numbers 16 or more add up to 276 degrees, which is answer choice D.'
        write: '$\therefore$ sum of the angles $= 276^{\circ}$'
        answer: true
    traps:
      A: 'You went for 48 degrees. That is the sector for 16 alone. The question wants every number 16 or more, that is 16, 30, 20 and 26, which give 276 degrees.'
      B: 'You went for 84 degrees. That is the numbers less than 16, which are 4, 10 and 14. The numbers 16 or more take the rest, and 360 minus 84 is 276.'
      C: 'You went for 92 degrees. 92 is the sum of the numbers 16, 30, 20 and 26, not their angles. Each angle is 3 times f, so the sum is 276 degrees.'
  47:
    moments:
      - section: 'The question'
        say: 'Ten positive numbers have a mean of 16. One more number is added and the mean rises to 18. That one number must be big. How big?'
        write: 'Mean of 10 numbers $= 16$; mean of 11 numbers $= 18$'
        doodle: {name: 'custom:1990_q47_a', id: stacks, caption: 'ten stacks levelled at 16'}
      - section: 'Solution'
        say: 'Solution. The mean is the sum divided by the number of items. So turn it round, and the sum is the mean times the number.'
        write: 'Solution. Sum $=$ mean $\times$ number'
      - say: 'The sum of the ten numbers is 16 times 10, which is 160, the ten stacks together.'
        write: 'Sum of 10 numbers $= 16 \times 10 = 160$'
        doodle_do:
          - {id: stacks, op: label, part: cols, text: 'sum 160'}
      - say: 'The sum of the eleven numbers is 18 times 11, which is 198.'
        write: 'Sum of 11 numbers $= 18 \times 11 = 198$'
      - say: 'Let the eleventh number be $x$, which is the new stack.'
        write: 'Let the 11th number be $x$'
        doodle_do:
          - {id: stacks, op: stage, stage: 'custom:1990_q47_a2'}
          - {id: stacks, op: label, part: new, text: 'x'}
      - say: 'The old sum plus $x$ makes the new sum, so 160 plus $x$ equals 198.'
        write: '$160 + x = 198$'
        point:
          - {line: 5, kind: move, from: {line: 2, at: '=[[160]]'}, at: '[[160]]+x', text: 'old sum'}
          - {line: 5, kind: move, from: {line: 3, at: '=[[198]]'}, at: '=[[198]]', text: 'new sum'}
      - say: 'Subtract 160 from both sides.'
        write: '$x = 198 - 160$'
      - say: '198 minus 160 is 38.'
        write: '$\therefore x = 38$'
        point:
          - {line: 7, kind: highlight, at: '38', to: {doodle: stacks, part: new}}
      - section: 'Check'
        say: 'To check, 160 plus 38 is 198, and 198 divided by 11 is 18, the new mean. If we level the stacks, the new one gives 2 to each of the ten and keeps 18.'
        write: 'Check: $\dfrac{160 + 38}{11} = \dfrac{198}{11} = 18$ ✓'
        doodle_do:
          - {id: stacks, op: stage, stage: 'custom:1990_q47_a3'}
      - section: 'Answer'
        say: 'So the eleventh number is 38, which is option D.'
        write: '$\therefore$ the 11th number $= 38$'
        answer: true
    traps:
      A: 'You went for 3. A small number would pull the mean down, not up to 18. Sum $=$ mean $\times$ number gives 198 minus 160, which is 38.'
      B: 'You went for 16, the old mean. Adding 16 would leave the mean at 16. To lift it to 18, the new number must be 198 minus 160, which is 38.'
      C: 'You went for 18, the new mean. A number of 18 would lift the mean only a little. The sums give 198 minus 160, which is 38.'
  48:
    moments:
      - section: 'The question'
        say: 'The scores are 1 to 6, and one frequency is missing, because $x$ students scored 5. The average is 3.5. The mean formula still works with a letter in the table. Table first.'
        write: '$\bar{x} = 3.5$; find $x$'
        diagram:
          id: t
          kind: table
          columns: ['Score (x)', 'f', 'fx']
          rows: [[1, 1, ''], [2, 4, ''], [3, 5, ''], [4, 6, ''], [5, 'x', ''], [6, 2, '']]
          'on': 'Table'
      - section: 'Solution'
        say: 'Solution. As always, add the $fx$ column, which is each score times its frequency. 1 times 1 is 1. 2 times 4 is 8. 3 times 5 is 15.'
        write: 'Solution'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,3', text: '1'}
          - {id: t, op: fill, part: 'cell:2,3', text: '8'}
          - {id: t, op: fill, part: 'cell:3,3', text: '15'}
      - say: '4 times 6 is 24. 5 times $x$ is $5x$. 6 times 2 is 12.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,3', text: '24'}
          - {id: t, op: fill, part: 'cell:5,3', text: '5x'}
          - {id: t, op: fill, part: 'cell:6,3', text: '12'}
      - say: 'Add down the $f$ column. 1 plus 4 plus 5 plus 6 plus 2 is 18, and then the $x$.'
        write: '$\sum f = 1 + 4 + 5 + 6 + x + 2 = 18 + x$'
      - say: 'Add down the $fx$ column. 1 plus 8 is 9, plus 15 is 24, plus 24 is 48, plus 12 is 60, and then the $5x$.'
        write: '$\sum fx = 1 + 8 + 15 + 24 + 5x + 12 = 60 + 5x$'
      - section: 'The equation'
        say: 'The mean, $x$ bar, is the sum of $fx$ over the sum of $f$. Picture it as the balance point of a see-saw.'
        write: '$\bar{x} = \dfrac{\sum fx}{\sum f}$'
        doodle: {name: 'custom:1990_q48_a', id: seesaw, caption: 'the mean is the balance point', 'on': 'balance'}
      - say: 'Substitute both sums, and put the mean, 3.5, on the other side.'
        write: '$\dfrac{60 + 5x}{18 + x} = 3.5$'
        doodle_do:
          - {id: seesaw, op: label, part: pivot, text: 'x̄ = 3.5'}
        point:
          - {line: 6, kind: move, from: {line: 4, at: '[[60+5x]]'}, at: '60+5x', text: 'Σfx'}
          - {line: 6, kind: move, from: {line: 3, at: '[[18+x]]'}, at: '[[18+x]]60', text: 'Σf'}
      - say: 'Cross-multiply by multiplying both sides by 18 plus $x$.'
        write: '$60 + 5x = 3.5(18 + x)$'
      - say: 'Expand the bracket. 3.5 times 18 is 63, and 3.5 times $x$ is $3.5x$.'
        write: '$60 + 5x = 63 + 3.5x$'
      - say: 'Collect the $x$ terms on the left and the numbers on the right.'
        write: '$5x - 3.5x = 63 - 60$'
      - say: '$5x$ minus $3.5x$ is $1.5x$, and 63 minus 60 is 3.'
        write: '$1.5x = 3$'
      - say: 'Divide both sides by 1.5. 3 over 1.5 is 2. So two students scored 5.'
        write: '$\therefore x = \dfrac{3}{1.5} = 2$'
        doodle_do:
          - {id: seesaw, op: stage, stage: 'custom:1990_q48_a2'}
        point:
          - {line: 11, kind: highlight, at: '=2', to: {doodle: seesaw, part: xblocks}}
      - section: 'Check'
        say: 'Now check. With $x$ equal to 2, the sum of $fx$ is 60 plus 10, which is 70, and the sum of $f$ is 20. 70 over 20 is 3.5. The see-saw balances.'
        write: 'Check: $\dfrac{60 + 5(2)}{18 + 2} = \dfrac{70}{20} = 3.5$ ✓'
      - section: 'Answer'
        say: 'So $x$ is 2, which is option B.'
        write: '$\therefore x = 2$'
        answer: true
    traps:
      A: 'You went for 1. Then the mean is 65 over 19, about 3.42, not 3.5. Solving 60 plus $5x$ over 18 plus $x$ equal to 3.5 gives 2.'
      C: 'You went for 3. Then the mean is 75 over 21, about 3.57, a little too high. The equation gives $x = 2$.'
      D: 'You went for 4. Then the mean is 80 over 22, about 3.64. Remember $x$ goes into $\sum f$ as well as $\sum fx$, and the equation gives 2.'
  49:
    moments:
      - section: 'The question'
        say: 'Two numbers are removed at random from 1, 2, 3 and 4. Picture four numbered balls, with the odd ones yellow and the even ones blue. What is the probability that their sum is even?'
        write: 'Two from $\{1,\ 2,\ 3,\ 4\}$: $P(\text{sum even}) = ?$'
        doodle: {name: 'custom:1990_q49_a', id: balls, caption: 'Take two of 1, 2, 3 and 4'}
      - say: 'Solution. Let $E$ be the event that the sum of the two numbers is even.'
        write: 'Solution: let $E$ = sum is even'
      - section: 'The sample space'
        say: 'Order does not matter, so list every pair once, first the pairs with 1, then the pairs without 1.'
        write: '$S = \{(1,2), (1,3), (1,4), (2,3), (2,4), (3,4)\}$'
      - say: 'n of $S$ is 6, the 6 lines joining the balls. To check the count, 4 C 2 is 4 factorial over 2 factorial times 2 factorial, which is 6.'
        write: '$n(S) = {}^{4}C_{2} = \dfrac{4!}{2!\,2!} = 6$'
        doodle_do:
          - {id: balls, op: stage, stage: 'custom:1990_q49_a2'}
      - section: 'The favourable outcomes'
        say: 'Now the six sums, in the same order, are 3, 4, 5, 5, 6 and 7.'
        write: 'Sums: $3,\ 4,\ 5,\ 5,\ 6,\ 7$'
      - say: 'The even sums are 4, from 1 and 3, and 6, from 2 and 4, which are the two crossing lines.'
        write: '$E = \{(1, 3),\ (2, 4)\}$'
        doodle_do:
          - {id: balls, op: highlight, part: diags}
          - {id: balls, op: label, part: diags, text: '2 even sums'}
        point:
          - {line: 5, kind: highlight, at: '(1, 3)', to: {doodle: balls, part: diags}}
      - say: 'So n of $E$ is 2.'
        write: '$n(E) = 2$'
      - section: 'The probability'
        say: 'The probability of $E$ is n of $E$ over n of $S$, that is, the number of favourable outcomes over the total number of possible outcomes.'
        write: '$P(E) = \dfrac{n(E)}{n(S)}$'
      - say: 'Substitute, and we get 2 over 6.'
        write: '$= \dfrac{2}{6}$'
        point:
          - {line: 8, kind: move, from: {line: 6, at: '= 2'}, at: '6[[2]]', text: 'n(E)'}
          - {line: 8, kind: move, from: {line: 3, at: '= 6'}, at: '[[6]]2', text: 'n(S)'}
      - say: 'Divide the top and the bottom by 2. That gives 1 over 3.'
        write: '$= \dfrac{1}{3}$'
      - section: 'Check'
        say: 'Check. A sum is even only for odd plus odd, or even plus even. That means two yellows, 1 and 3, or two blues, 2 and 4, so just 2 pairs.'
        write: 'Check: odd $+$ odd or even $+$ even: $2$ pairs $\checkmark$'
        doodle_do:
          - {id: balls, op: pulse, part: balls}
      - section: 'Answer'
        say: 'Therefore the probability that the sum is even is 1 over 3, which is option C.'
        write: '$\therefore P(\text{sum even}) = \dfrac{1}{3}$'
        doodle_do:
          - {id: balls, op: label, part: p, text: '1/3'}
        answer: true
    traps:
      A: 'You went for 2 over 3. That is P of E complement, an ODD sum, which comes from 4 of the 6 pairs. The even sums come from only 2 pairs.'
      B: 'You went for a half, as if even and odd sums were equally likely. List the 6 pairs, and only 2 give an even sum.'
      D: 'You went for 1 over 4. n of S is 6 pairs, not 8. Two of them give an even sum, so it is 2 over 6, which is 1 over 3.'
  50:
    moments:
      - section: 'The question'
        say: 'A number is picked at random from 41 to 56, so picture them all in a grid. What is the probability that it is a multiple of 9? Both counts must be exact.'
        write: '$41$ to $56$: $P(\text{multiple of } 9) = ?$'
        doodle: {name: 'custom:1990_q50_a', id: grid, caption: 'One number from 41 to 56'}
      - say: 'Solution. Let $E$ be the event that the number is a multiple of 9.'
        write: 'Solution: let $E$ = a multiple of 9'
      - section: 'The sample space'
        say: 'The sample space is every number from 41 to 56. Both ends are included, so n of $S$ is 56 minus 41, plus 1.'
        write: '$n(S) = 56 - 41 + 1$'
      - say: '56 minus 41 is 15, and 15 plus 1 is 16. Count the grid, and there are 16 numbers.'
        write: '$= 16$'
        doodle_do:
          - {id: grid, op: label, part: grid, text: '16 numbers'}
        point:
          - {line: 3, kind: highlight, at: '16', to: {doodle: grid, part: grid}}
      - say: 'Why plus 1? Take a small case. From 1 to 3 there are 3 numbers, but 3 minus 1 is only 2. Adding 1 counts both ends.'
        write: 'From 1 to 3: $\ 3 - 1 + 1 = 3$ numbers'
      - section: 'The favourable outcomes'
        say: 'Now the multiples of 9. 9 times 4 is 36, too small. 9 times 5 is 45, and 9 times 6 is 54. 9 times 7 is 63, too big.'
        write: '$9 \times 5 = 45,\quad 9 \times 6 = 54$'
      - say: 'So $E$ is 45 and 54, shaded in the grid.'
        write: '$E = \{45,\ 54\}$'
        doodle_do:
          - {id: grid, op: stage, stage: 'custom:1990_q50_a2'}
        point:
          - {line: 6, kind: highlight, at: '45, 54', to: {doodle: grid, part: nines}}
      - say: 'So n of $E$ is 2.'
        write: '$n(E) = 2$'
      - section: 'The probability'
        say: 'The probability of $E$ is n of $E$ over n of $S$, which means the number of favourable outcomes over the total number of possible outcomes.'
        write: '$P(E) = \dfrac{n(E)}{n(S)}$'
      - say: 'Substitute, giving 2 over 16.'
        write: '$= \dfrac{2}{16}$'
        point:
          - {line: 9, kind: move, from: {line: 7, at: '= 2'}, at: '16[[2]]', text: 'n(E)'}
          - {line: 9, kind: move, from: {line: 3, at: '= 16'}, at: '[[16]]2', text: 'n(S)'}
      - say: 'Divide the top and the bottom by 2. That gives 1 over 8.'
        write: '$= \dfrac{1}{8}$'
      - section: 'Check'
        say: 'Check the ends. 9 times 4 is 36, below 41, and 9 times 7 is 63, above 56. So no other multiple of 9 fits.'
        write: 'Check: $9 \times 4 = 36 < 41$, $\ 9 \times 7 = 63 > 56\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the probability of a multiple of 9 is 1 over 8, option C.'
        write: '$\therefore P(\text{multiple of } 9) = \dfrac{1}{8}$'
        doodle_do:
          - {id: grid, op: label, part: q, text: '2 of 16 = 1/8'}
        answer: true
    traps:
      A: 'You went for 1 over 9. That is how often multiples of 9 turn up in the long run. Here we count exactly. n of E is 2 and n of S is 16, which gives 1 over 8.'
      B: 'You went for 2 over 15. That takes n of S as 56 minus 41, which is 15, and forgets the plus 1. Both ends are included, so n of S is 16.'
      D: 'You went for 7 over 8. That is P of E complement, NOT a multiple of 9, which is 14 of the 16 numbers. We want the multiples, which give 1 over 8.'
