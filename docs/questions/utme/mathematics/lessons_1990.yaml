      - say: 'Let''s see why, by completing the square. Half of the number in front of $x$ is a half, and $x$ plus a half, squared, is $x^{2}$ plus $x$ plus a quarter.'
        write: '$\left(x + \tfrac{1}{2}\right)^{2} = x^{2} + x + \tfrac{1}{4}$'
      - say: 'Our expression ends in 1, not a quarter, so we add three quarters more. A quarter plus three quarters is 1.'
        write: '$x^{2} + x + 1 = \left(x + \tfrac{1}{2}\right)^{2} + \tfrac{3}{4}$'
      - say: 'A square is never negative, so the expression is smallest when the bracket is zero.'
        write: 'Smallest when $x + \tfrac{1}{2} = 0$'
      - say: 'Take a half from both sides, and $x$ is negative a half. The same answer as the formula.'
        write: '$x = -\tfrac{1}{2}$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '+ 21'}, at: '−21', text: 'across the ='}
      - say: 'At that point the value is a quarter, minus a half, plus 1, which is three quarters, the smallest the expression can be.'
        write: 'Minimum value $= \tfrac{1}{4} - \tfrac{1}{2} + 1 = \tfrac{3}{4}$'
        point:
          - {figure: sketch, kind: label, target: A, text: 'value ¾'}
      - say: 'So the minimum is at $x$ equals negative a half, which is answer choice B.'
        write: 'So the minimum is at $x = -\tfrac{1}{2}$'
        answer: true
    traps:
