  27:
    moments:
      - say: 'We want the sum of the first twenty terms of log $a$, log $a^{2}$, log $a^{3}$, and so on.'
        write: '$\log a,\ \log a^{2},\ \log a^{3}, \ldots$'
      - say: 'One law of logs makes this friendly: a power inside a log comes out in front.'
        write: 'Law: $\log a^{n} = n\log a$'
      - say: 'Using that law on each term, the terms are 1 log $a$, 2 log $a$, 3 log $a$, and so on.'
        write: 'So the terms are $\log a,\ 2\log a,\ 3\log a, \ldots$'
        point:
          - {line: 1, kind: box, text: 'the law'}
      - say: 'Each term is log $a$ more than the one before. So it is an arithmetic progression: first term log $a$, common difference 2 log $a$ minus log $a$, which is log $a$.'
        write: 'First term $= \log a$, common difference $= 2\log a - \log a = \log a$'
      - say: 'The nth term of an arithmetic progression is the first term plus n minus 1 common differences.'
        write: 'AP: $T_{n} = a + (n - 1)d$'
      - say: 'The twentieth term is the first term plus 19 differences: log $a$ plus 19 log $a$, which is 20 log $a$.'
        write: '$T_{20} = \log a + 19\log a = 20\log a$'
      - say: 'The sum of an A.P. is the number of terms over 2, times the first term plus the last term.'
        write: 'Sum: $S_{n} = \dfrac{n}{2}(\text{first} + \text{last})$'
      - say: 'Here $n$ is 20, the first term is log $a$, and the last is the 20 log $a$ we just found.'
        write: '$S_{20} = \dfrac{20}{2}(\log a + 20\log a)$'
        point:
          - {line: 6, kind: box, text: 'the rule'}
          - {line: 7, kind: move, from: {line: 5, at: '= 20loga'}, at: '20loga', text: 'last term'}
      - say: '20 over 2 is 10. And log $a$ plus 20 log $a$ is 21 log $a$.'
        write: '$= 10 \times 21\log a$'
      - say: '10 times 21 is 210.'
        write: '$= 210\log a$'
      - say: 'Now use the law of logs backwards: the 210 goes back up as a power. So the sum is log $a$ to the 210, which is answer choice D.'
        write: '$= \log a^{210}$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '210'}, at: '210', text: 'up as the power'}
        answer: true
    traps:
      A: 'You went for log $a$ to the 20. That''s the twentieth TERM. The question asks for the SUM of the first twenty terms.'
      B: 'You went for log $a$ to the 21. That''s the first term plus the last term. The sum formula also multiplies by $\dfrac{n}{2}$, which is 10, giving 210.'
      C: 'You went for log $a$ to the 200. That''s 10 times the last term only. The bracket must hold the first term plus the last: 1 plus 20 is 21, and 10 times 21 is 210.'
  28:
    moments:
      - say: 'We want the sum of the first 18 terms of 3, 6, 12, and so on.'
        write: '$3,\ 6,\ 12, \ldots$'
      - say: 'First, what kind of progression is it? Divide each term by the one before. 6 over 3 is 2, and 12 over 6 is 2.'
        write: 'Ratios: $\dfrac{6}{3} = 2,\quad \dfrac{12}{6} = 2$'
      - say: 'The same ratio each time, so it is geometric. The first term is 3 and the common ratio is 2.'
        write: 'Geometric: $a = 3,\quad r = 2$'
      - say: 'For a geometric progression with $r$ bigger than 1, the sum of the first $n$ terms is $a$ times $r^{n}$ minus 1, over $r$ minus 1.'
        write: 'Sum: $S_{n} = \dfrac{a(r^{n} - 1)}{r - 1}$'
      - say: 'Substitute $a = 3$ and $r = 2$ from the line above, and $n = 18$.'
