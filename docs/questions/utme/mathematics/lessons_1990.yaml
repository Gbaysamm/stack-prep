          - {line: 9, kind: highlight, at: '320', to: {doodle: days, part: apay}}
      - say: 'Let''s check. The painter worked 32 plus 10, which is 42 days, and 40 times 42 is 1680.'
        write: 'Check: painter $= 40 \times (32 + 10) = 40 \times 42 = 1680$'
      - say: '1680 plus the assistant''s 320 is 2000, the total we were given.'
        write: '$1680 + 320 = 2000\ \checkmark$'
      - say: 'So the assistant received ₦320, which is answer choice B.'
        write: 'Assistant received ₦320.00'
