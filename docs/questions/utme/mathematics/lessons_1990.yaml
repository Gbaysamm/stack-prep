  50:
    moments:
      - say: 'A number is picked at random from 41 to 56: picture them all in a grid. What is the probability that it''s a multiple of 9?'
        write: '$41,\ 42,\ \ldots,\ 56$'
        doodle: {name: 'custom:1990_q50_a', id: grid, caption: 'One number from 41 to 56'}
      - say: 'Probability is the number of favourable choices over the number of possible choices. Both counts must be exact.'
        write: '$P = \dfrac{\text{favourable}}{\text{possible}}$'
      - say: 'How many numbers are there from 41 to 56? Both ends are included, so it is 56 minus 41, plus 1.'
        write: 'Possible $= 56 - 41 + 1$'
      - say: '56 minus 41 is 15, and 15 plus 1 is 16: count the grid, 16 numbers.'
        write: '$= 15 + 1 = 16$'
        doodle_do:
          - {id: grid, op: label, part: grid, text: '16 numbers'}
        point:
          - {line: 3, kind: highlight, at: '16', to: {doodle: grid, part: grid}}
      - say: 'Why plus 1? Try a small case. From 1 to 3 there are 3 numbers, but 3 minus 1 is only 2. We add 1 so that both ends are counted.'
        write: 'From 1 to 3: $\ 3 - 1 + 1 = 3$ numbers'
      - say: 'Now the multiples of 9. 9 times 4 is 36, which is too small.'
        write: '$9 \times 4 = 36 < 41$'
      - say: '9 times 5 is 45, and 9 times 6 is 54. Both are between 41 and 56.'
        write: '$9 \times 5 = 45,\quad 9 \times 6 = 54$'
      - say: '9 times 7 is 63, which is too big.'
        write: '$9 \times 7 = 63 > 56$'
      - say: 'So there are just 2 favourable numbers, 45 and 54, shaded in the grid.'
        write: 'Favourable $= 2$'
        doodle_do:
          - {id: grid, op: stage, stage: 'custom:1990_q50_a2'}
        point:
