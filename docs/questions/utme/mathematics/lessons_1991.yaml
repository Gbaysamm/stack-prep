  50:
    moments:
      - say: 'A crate has 10 bottles of Coca-Cola, 8 of Fanta and 6 of Sprite. One bottle is picked at random. We want the probability that it is NOT a Coca-Cola.'
        write: '$\text{Coca-Cola } 10,\ \text{Fanta } 8,\ \text{Sprite } 6$'
      - say: 'Probability is the number of favourable outcomes over the total number of equally likely outcomes.'
        write: '$P = \dfrac{\text{favourable}}{\text{total}}$'
      - say: 'The total number of bottles is 10 plus 8 plus 6, which is 24.'
        write: '$10 + 8 + 6 = 24$'
      - say: 'The bottles that are not Coca-Cola are the Fanta and the Sprite. 8 plus 6 is 14.'
        write: '$8 + 6 = 14$'
      - say: 'So the probability is 14 over 24.'
        write: '$P(\text{not Coca-Cola}) = \dfrac{14}{24}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= 14'}, at: '14', text: 'favourable'}
          - {line: 4, kind: move, from: {line: 2, at: '= 24'}, at: '24', text: 'total'}
      - say: 'Divide top and bottom by 2. 14 over 2 is 7, and 24 over 2 is 12.'
        write: '$= \dfrac{7}{12}$'
      - say: 'Check with the complement. The chance it IS a Coca-Cola is 10 over 24, which simplifies to 5 over 12.'
        write: 'Check: $P(\text{Coca-Cola}) = \dfrac{10}{24} = \dfrac{5}{12}$'
      - say: 'Not Coca-Cola is everything else, so it is 1 minus 5 over 12. 1 is 12 over 12, and 12 minus 5 is 7, which gives 7 over 12 again.'
        write: '$P(\text{not Coca-Cola}) = 1 - \dfrac{5}{12} = \dfrac{12}{12} - \dfrac{5}{12} = \dfrac{7}{12}\ \checkmark$'
      - say: 'So the probability that it is not a Coca-Cola bottle is 7 over 12, which is answer choice D.'
        write: 'Probability $= \dfrac{7}{12}$'
        answer: true
    traps:
      A: 'You went for 5 over 12. That is the probability that it IS a Coca-Cola, 10 out of 24. The question says NOT, so we count the 14 Fanta and Sprite bottles: 14 over 24, which is 7 over 12.'
      B: 'You went for a third. That is 8 out of 24, the Fanta alone. Not Coca-Cola means Fanta or Sprite, 8 plus 6, which is 14 out of 24.'
      C: 'You went for three quarters. That would be 18 bottles out of 24. The bottles that are not Coca-Cola are 8 Fanta and 6 Sprite, which is 14, giving 7 over 12.'
