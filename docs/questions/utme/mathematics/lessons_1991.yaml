# UTME 1991 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1991.yaml. Answers match that file.
format_version: 1
exam_year: 1991
lessons:
  1:
    moments:
      - say: 'We are asked to simplify three and a third, minus one and a quarter times two thirds, plus one and two fifths.'
        write: '$3\tfrac{1}{3} - 1\tfrac{1}{4} \times \tfrac{2}{3} + 1\tfrac{2}{5}$'
      - say: 'The first thing to notice is the order of operations. Multiplication is done before addition and subtraction, even though it sits in the middle of the line.'
        write: '$1\tfrac{1}{4} \times \tfrac{2}{3} \text{ first}$'
      - say: 'So let''s do the multiplication. Change one and a quarter into an improper fraction. 1 times 4 is 4, plus 1 is 5, so it is five quarters.'
        write: '$1\tfrac{1}{4} = \tfrac{5}{4}$'
      - say: 'Now multiply. 5 times 2 is 10 on top, and 4 times 3 is 12 underneath.'
        write: '$\tfrac{5}{4} \times \tfrac{2}{3} = \tfrac{10}{12}$'
      - say: 'Divide the top and the bottom by 2, and ten twelfths becomes five sixths.'
        write: '$\tfrac{10}{12} = \tfrac{5}{6}$'
      - say: 'So the expression is now three and a third, minus five sixths, plus one and two fifths.'
        write: '$3\tfrac{1}{3} - \tfrac{5}{6} + 1\tfrac{2}{5}$'
      - say: 'Let''s turn the other mixed numbers into improper fractions too. 3 times 3 is 9, plus 1 is 10, so three and a third is ten thirds.'
        write: '$3\tfrac{1}{3} = \tfrac{10}{3}$'
      - say: '1 times 5 is 5, plus 2 is 7, so one and two fifths is seven fifths.'
        write: '$1\tfrac{2}{5} = \tfrac{7}{5}$'
      - say: 'The denominators are 3, 6 and 5. The smallest number all three divide into is 30.'
        write: '$\text{LCM}(3, 6, 5) = 30$'
      - say: 'Ten thirds: 30 divided by 3 is 10, and 10 times 10 is 100. So it becomes 100 over 30.'
        write: '$\tfrac{10}{3} = \tfrac{100}{30}$'
      - say: 'Five sixths: 30 divided by 6 is 5, and 5 times 5 is 25. So 25 over 30.'
        write: '$\tfrac{5}{6} = \tfrac{25}{30}$'
      - say: 'Seven fifths: 30 divided by 5 is 6, and 7 times 6 is 42. So 42 over 30.'
        write: '$\tfrac{7}{5} = \tfrac{42}{30}$'
      - say: 'Now combine the tops. 100 minus 25 is 75, and 75 plus 42 is 117.'
        write: '$\dfrac{100 - 25 + 42}{30} = \dfrac{117}{30}$'
      - say: '30 goes into 117 three times, which uses up 90, and 117 minus 90 leaves 27.'
        write: '$\dfrac{117}{30} = 3\tfrac{27}{30}$'
      - say: 'Finally, divide 27 and 30 by 3 to get nine tenths. So the answer is three and nine tenths, which is answer choice B.'
        write: '$3\tfrac{9}{10}$'
        answer: true
    traps:
      A: 'You went for two and seventeen thirtieths. That is too small. Do the multiplication first to get five sixths, then put all three fractions over 30: 100 minus 25 plus 42 is 117 thirtieths.'
      C: 'You went for four and one tenth. That is a little too big. Check each fraction over 30: ten thirds is 100, five sixths is 25 and seven fifths is 42, which make 117 thirtieths, not 123.'
      D: 'You went for four and eleven thirty-sixths. The lowest common denominator of 3, 6 and 5 is 30, not 36. Multiply first, then put everything over 30.'

  2:
    moments:
      - say: 'In some base $n$, 7056 minus 4577 gives 2257. We need to find the base $n$.'
        write: '$7056_n - 4577_n = 2257_n$'
      - say: 'First, look at the digits. The biggest digit used is 7, and every digit must be smaller than the base. So $n$ is at least 8.'
        write: '$n \geq 8$'
      - say: 'Rather than solve for $n$, let''s test the options. Try base 8. In base 8 the place values are 512, 64, 8 and 1.'
        write: '$8^{3} = 512,\ 8^{2} = 64,\ 8^{1} = 8,\ 8^{0} = 1$'
      - say: 'Convert 7056 to base ten. 7 times 512 is 3584, 0 times 64 is 0, 5 times 8 is 40, and then the 6 units.'
        write: '$7056_8 = 3584 + 0 + 40 + 6$'
      - say: '3584 plus 40 is 3624, and plus 6 is 3630.'
        write: '$7056_8 = 3630$'
      - say: 'Now 4577. 4 times 512 is 2048, 5 times 64 is 320, 7 times 8 is 56, and then 7 units.'
        write: '$4577_8 = 2048 + 320 + 56 + 7$'
      - say: '2048 plus 320 is 2368, plus 56 is 2424, plus 7 is 2431.'
        write: '$4577_8 = 2431$'
      - say: 'Subtract in base ten. 3630 minus 2431 is 1199.'
        write: '$3630 - 2431 = 1199$'
      - say: 'Does 2257 in base 8 also equal 1199? 2 times 512 is 1024, 2 times 64 is 128, 5 times 8 is 40, and then 7.'
        write: '$2257_8 = 1024 + 128 + 40 + 7$'
      - say: '1024 plus 128 is 1152, plus 40 is 1192, plus 7 is 1199. It matches, so base 8 works.'
        write: '$2257_8 = 1199\ \checkmark$'
      - say: 'There''s a quicker check in the units column. 6 minus 7 needs a borrow, and borrowing brings in one whole $n$. So 6 plus $n$ minus 7 must give the 7 in the answer.'
        write: '$6 + n - 7 = 7$'
      - say: '6 minus 7 is negative 1, so $n$ minus 1 equals 7. Add 1 to both sides, and $n$ is 8.'
        write: '$n - 1 = 7$'
      - say: 'So the subtraction was done in base 8, which is answer choice A.'
        write: '$n = 8$'
        answer: true
    traps:
      B: 'You went for 9. Test the units column: 6 plus 9 minus 7 is 8, but the answer shows 7 there. Only base 8 gives 6 plus 8 minus 7, which is 7.'
      C: 'You went for 10, the base we use every day. But in base ten 7056 minus 4577 is 2479, not 2257, so base ten does not work.'
      D: 'You went for 11. In the units column, 6 plus 11 minus 7 is 10, not the 7 in the answer. Only base 8 makes that column work.'

  3:
    moments:
      - say: 'We need the value of this expression, correct to 3 decimal places. Let''s work on each bracket in turn.'
        write: '$\left(\dfrac{1}{0.05} \div \dfrac{1}{5.005}\right) - (0.05 \times 2.05)$'
      - say: 'Start with 1 over 0.05. How many times does 0.05 go into 1? 0.05 is one twentieth, so it goes in 20 times.'
        write: '$\dfrac{1}{0.05} = 20$'
      - say: 'Next, dividing by a fraction means multiplying by its reciprocal. The reciprocal of 1 over 5.005 is just 5.005.'
        write: '$20 \div \dfrac{1}{5.005} = 20 \times 5.005$'
      - say: '20 times 5 is 100, and 20 times 0.005 is 0.1. So the first bracket is 100.1.'
        write: '$20 \times 5.005 = 100.1$'
      - say: 'Now the second bracket, 0.05 times 2.05. 5 times 205 is 1025, and there are four decimal places altogether, so it is 0.1025.'
        write: '$0.05 \times 2.05 = 0.1025$'
      - say: 'Now subtract the second bracket from the first.'
        write: '$100.1 - 0.1025$'
      - say: 'Line up the decimal points. 100.1000 minus 0.1025 is 99.9975.'
        write: '$100.1000 - 0.1025 = 99.9975$'
      - say: 'To round to 3 decimal places, look at the fourth decimal digit. It is 5, so we round the third place up. 99.997 becomes 99.998.'
        write: '$99.9975 \approx 99.998$'
      - say: 'A quick size check: the first part is about 100 and we take away about a tenth, so the answer must be just under 100. So it is 99.998, which is answer choice A.'
        write: '$99.998$'
        answer: true
    traps:
      B: 'You went for 98.999. That is about 1 too small. The first bracket is 100.1 and we take away only 0.1025, so the answer is 99.9975, which rounds to 99.998.'
      C: 'You went for 89.899. That is about 10 too small. Check the first bracket: 20 times 5.005 is 100.1, and taking away 0.1025 leaves 99.9975.'
      D: 'You went for 9.998. That is ten times too small, a decimal point slip. Remember that 1 divided by 0.05 is 20, because dividing by a small number makes the answer bigger.'

  4:
    moments:
      - say: 'We want 62 over 3 as a decimal, correct to 3 significant figures.'
        write: '$\dfrac{62}{3}$'
      - say: 'First the division. 3 times 20 is 60, which leaves 2 over. So 62 over 3 is 20 and two thirds.'
        write: '$\dfrac{62}{3} = 20\tfrac{2}{3}$'
      - say: 'Two thirds as a decimal is 0.666 and so on, with the 6 repeating forever.'
        write: '$\tfrac{2}{3} = 0.6666\ldots$'
      - say: 'So 62 over 3 is 20.6666 and so on.'
        write: '$\dfrac{62}{3} = 20.6666\ldots$'
      - say: 'Significant figures are counted from the first non-zero digit. The first three are 2, 0 and 6.'
        write: '$20.6\,|\,666\ldots$'
      - say: 'Should we round up or not? Look at the next digit. It is a 6, which is 5 or more, so we round the last kept digit up. The 6 becomes a 7.'
        write: '$20.6 \to 20.7$'
      - say: 'So 62 over 3 is 20.7 to 3 significant figures, which is answer choice D.'
        write: '$20.7$'
        answer: true
    traps:
      A: 'You went for 20.6. That chops off the digits without rounding. The next digit is a 6, which is 5 or more, so the 6 must round up to 7.'
      B: 'You went for 20.667. That is correctly rounded, but to 5 significant figures. The question asks for 3: the digits 2, 0 and 7.'
      C: 'You went for 20.67. That is correctly rounded, but to 4 significant figures. The question asks for only 3, which gives 20.7.'

  5:
    moments:
      - say: 'Factory P makes 20,000 bags a day and factory Q makes 15,000. P goes down by 5% and Q goes up by 5%. We want the overall loss per day.'
        write: '$P = 20{,}000,\quad Q = 15{,}000$'
      - say: 'The two changes go in opposite directions, so the plan is to work out each change in bags, then combine them.'
      - say: 'P reduces by 5%. 5% is 0.05, and 0.05 times 20,000 is 1,000. So P makes 1,000 fewer bags.'
        write: '$0.05 \times 20{,}000 = 1{,}000$'
      - say: 'Q increases by 5%. 0.05 times 15,000 is 750. So Q makes 750 more bags.'
        write: '$0.05 \times 15{,}000 = 750$'
      - say: 'Now combine them: a loss of 1,000 and a gain of 750. Negative 1,000 plus 750 is negative 250.'
        write: '$-1{,}000 + 750 = -250$'
      - say: 'Let''s check with totals. Before the change, 20,000 plus 15,000 is 35,000 bags.'
        write: '$\text{before: } 20{,}000 + 15{,}000 = 35{,}000$'
      - say: 'After the change, P makes 20,000 minus 1,000, which is 19,000, and Q makes 15,000 plus 750, which is 15,750. Together that is 34,750.'
        write: '$\text{after: } 19{,}000 + 15{,}750 = 34{,}750$'
      - say: '35,000 minus 34,750 is 250.'
        write: '$35{,}000 - 34{,}750 = 250$'
      - say: 'The two 5% changes do not cancel, because they are 5% of different amounts. So the loss is 250 bags a day, which is answer choice A.'
        write: '$\text{loss} = 250$'
        answer: true
    traps:
      B: 'You went for 750. That is only Q''s gain. P loses 1,000 bags, and the gain of 750 only partly makes up for it, leaving a loss of 250.'
      C: 'You went for 1,000. That is P''s loss on its own. Q gains 750 bags at the same time, so the overall loss is 1,000 minus 750, which is 250.'
      D: 'You went for 1,250. The gain and the loss go opposite ways, so take the 750 away from the 1,000. That leaves 250.'

  6:
    moments:
      - say: 'Musa borrows ₦10.00 at 2% a month simple interest, and pays back ₦8.00 after 4 months. How much does he still owe?'
        write: 'Principal ₦10.00, 2% a month, 4 months'
      - say: 'Simple interest grows by the same amount every month. So first, one month''s interest: 2% of ₦10 is 0.02 times 10, which is 0.20.'
        write: '$0.02 \times 10 = 0.20$'
      - say: 'Over 4 months, that is 4 times 0.20, which is 0.80.'
        write: '$4 \times 0.20 = 0.80$'
      - say: 'We can check with the formula: interest equals $P$ times $R$ times $T$ over 100. 10 times 2 is 20, times 4 is 80, and 80 over 100 is 0.80.'
        write: '$I = \dfrac{10 \times 2 \times 4}{100} = 0.80$'
      - say: 'So after 4 months his debt is ₦10.00 plus ₦0.80, which is ₦10.80.'
        write: '$10.00 + 0.80 = 10.80$'
      - say: 'But he then pays back ₦8.00. 10.80 minus 8.00 is 2.80.'
        write: '$10.80 - 8.00 = 2.80$'
      - say: 'So he still owes ₦2.80, which is answer choice C.'
        write: 'Still owed: ₦2.80'
        answer: true
    traps:
      A: 'You went for ₦10.80. That is what he owes after 4 months, before paying anything back. He then repays ₦8.00, leaving ₦2.80.'
      B: 'You went for ₦10.67. That is not the interest we get. Simple interest is ₦0.20 a month, so ₦0.80 over 4 months, and after he repays ₦8.00 he owes ₦2.80.'
      D: 'You went for ₦2.67. The subtraction is right, but the interest is not. 2% of ₦10 for 4 months is exactly ₦0.80, so the debt is ₦10.80 and he still owes ₦2.80.'

  7:
    moments:
      - say: 'We mix 3 gallons of spirit that is 20% water with 5 gallons that is 15% water. What percentage of the mixture is water?'
        write: '$3 \text{ gal at } 20\%,\quad 5 \text{ gal at } 15\%$'
      - say: 'We can''t just average the two percentages, because the amounts are different. So the first thing we need to do is find the actual gallons of water.'
      - say: '20% of 3 gallons: 0.2 times 3 is 0.6 gallons of water.'
        write: '$0.20 \times 3 = 0.6$'
      - say: '15% of 5 gallons: 0.15 times 5 is 0.75 gallons of water.'
        write: '$0.15 \times 5 = 0.75$'
      - say: 'Total water: 0.6 plus 0.75 is 1.35 gallons.'
        write: '$0.6 + 0.75 = 1.35$'
      - say: 'Total mixture: 3 plus 5 is 8 gallons.'
        write: '$3 + 5 = 8$'
      - say: 'Water as a percentage is the water over the whole mixture, times 100.'
        write: '$\dfrac{1.35}{8} \times 100\%$'
      - say: '1.35 times 100 is 135, and 135 divided by 8 is 16.875.'
        write: '$\dfrac{135}{8} = 16.875\%$'
      - say: 'And 0.875 is seven eighths.'
        write: '$0.875 = \tfrac{7}{8}$'
      - say: 'Sense check: the answer is between 15% and 20%, and closer to 15% because there is more of that spirit. So it is 16 and seven eighths percent, which is answer choice B.'
        write: '$16\tfrac{7}{8}\%$'
        answer: true
    traps:
      A: 'You went for two and four fifths percent. That is far too small: mixing a 20% spirit with a 15% spirit must give something between 15% and 20%. Divide the 1.35 gallons of water by the 8 gallons of mixture.'
      C: 'You went for 18 and one eighth percent. That leans too far towards the 20% spirit. There are 5 gallons at 15% and only 3 at 20%, so the answer sits nearer 15%: 1.35 over 8 is 16 and seven eighths percent.'
      D: 'You went for 18 and seven eighths percent. That is even above the plain average of 17 and a half. There is more of the 15% spirit, so the mixture is nearer 15%: 1.35 over 8 gives 16 and seven eighths.'

  8:
    moments:
      - say: 'We need the product of 27 over 5, 3 to the power negative 3, and one fifth to the power negative 1.'
        write: '$\dfrac{27}{5} \times 3^{-3} \times \left(\dfrac{1}{5}\right)^{-1}$'
      - say: 'A product means we multiply them all together. First, let''s put each one in a simple form. 27 over 5 is already simple.'
      - say: 'What does a negative index mean? It means take the reciprocal. So 3 to the negative 3 is 1 over 3 cubed.'
        write: '$3^{-3} = \dfrac{1}{3^{3}}$'
      - say: '3 cubed is 3 times 3 times 3. 3 times 3 is 9, and 9 times 3 is 27.'
        write: '$3^{-3} = \dfrac{1}{27}$'
      - say: 'One fifth to the power negative 1 is the reciprocal of one fifth. Turn it upside down, and it is 5.'
        write: '$\left(\tfrac{1}{5}\right)^{-1} = 5$'
      - say: 'Now multiply all three.'
        write: '$\dfrac{27}{5} \times \dfrac{1}{27} \times 5$'
      - say: 'The 27 on top cancels with the 27 underneath.'
        write: '$= \dfrac{1}{5} \times 5$'
      - say: 'And one fifth times 5 is 1. So the product is 1, which is answer choice C.'
        write: '$= 1$'
        answer: true
    traps:
      A: 'You went for 5. There are two 5s to cancel: one under the 27 and one from one fifth to the power negative 1. Once both cancel, and the 27s cancel, only 1 is left.'
      B: 'You went for 3. That happens if 3 to the negative 3 is taken as one ninth. But 3 cubed is 27, not 9, so it is one twenty-seventh, and the product is 1.'
      D: 'You went for one twenty-fifth. That keeps one fifth to the power negative 1 as one fifth. A negative index turns the number upside down, so it is 5, and the product is 1.'

  9:
    moments:
      - say: 'We want to simplify 2 log two fifths, minus log 72 over 125, plus log 9. The plan is to squeeze everything into one log, then match the options.'
        write: '$2\log\dfrac{2}{5} - \log\dfrac{72}{125} + \log 9$'
      - say: 'First the power law: a number in front of a log can go up as a power. Two fifths squared is 4 over 25.'
        write: '$2\log\tfrac{2}{5} = \log\tfrac{4}{25}$'
      - say: 'So the expression is now log 4 over 25, minus log 72 over 125, plus log 9.'
        write: '$\log\tfrac{4}{25} - \log\tfrac{72}{125} + \log 9$'
      - say: 'Subtracting logs means dividing, and adding logs means multiplying. So it all becomes one log.'
        write: '$= \log\left(\dfrac{4}{25} \div \dfrac{72}{125} \times 9\right)$'
      - say: 'Dividing by 72 over 125 means multiplying by its reciprocal, 125 over 72.'
        write: '$= \log\left(\dfrac{4}{25} \times \dfrac{125}{72} \times 9\right)$'
      - say: '125 divided by 25 is 5, so the 25 and the 125 leave just a 5 on top.'
        write: '$= \log\left(\dfrac{4 \times 5 \times 9}{72}\right)$'
      - say: '4 times 5 is 20, and 20 times 9 is 180.'
        write: '$= \log\dfrac{180}{72}$'
      - say: 'Divide top and bottom by 36. 180 divided by 36 is 5, and 72 divided by 36 is 2.'
        write: '$= \log\dfrac{5}{2}$'
      - say: 'The options are written with log 2 and log 3, so let''s rewrite five halves. Multiply top and bottom by 2, and it is ten quarters.'
        write: '$\log\dfrac{5}{2} = \log\dfrac{10}{4}$'
      - say: 'The log of a quotient is a difference of logs.'
        write: '$= \log 10 - \log 4$'
      - say: 'In base ten, log 10 is 1. And 4 is 2 squared, so log 4 is 2 log 2.'
        write: '$= 1 - \log 2^{2}$'
      - say: 'So the answer is 1 minus 2 log 2, which is answer choice D.'
        write: '$= 1 - 2\log 2$'
        answer: true
    traps:
      A: 'You went for 1 minus 4 log 3. The 3s cancel completely: 72 is 8 times 9, and the 9 on top cancels it. So there is no log 3 left in the answer.'
      B: 'You went for negative 1 plus 2 log 3. The factors of 3 in 72 and 9 cancel, so log 3 cannot appear. Everything simplifies to log five halves, which is 1 minus 2 log 2.'
      C: 'You went for negative 1 plus 5 log 2. That is log 32 over 10, which is log 3.2. The expression simplifies to log five halves, which is log 10 minus log 4.'

  10:
    moments:
      - say: 'We need to rationalise this fraction, which means clearing the surds from the denominator.'
        write: '$\dfrac{2\sqrt{3} + 3\sqrt{2}}{3\sqrt{2} - 2\sqrt{3}}$'
      - say: 'The tool is the conjugate: the same two terms with the sign between them changed. The denominator is 3 root 2 minus 2 root 3, so we multiply top and bottom by 3 root 2 plus 2 root 3.'
        write: '$\times \dfrac{3\sqrt{2} + 2\sqrt{3}}{3\sqrt{2} + 2\sqrt{3}}$'
      - say: 'Denominator first. It is a difference of two squares: the first term squared minus the second term squared.'
        write: '$(3\sqrt{2})^{2} - (2\sqrt{3})^{2}$'
      - say: '3 root 2 squared is 9 times 2, which is 18. 2 root 3 squared is 4 times 3, which is 12.'
        write: '$= 18 - 12$'
      - say: '18 minus 12 is 6. The surds are gone from the bottom.'
        write: '$= 6$'
      - say: 'Now the numerator. 2 root 3 plus 3 root 2, times 3 root 2 plus 2 root 3, is the same two terms in a different order. So it is 2 root 3 plus 3 root 2, squared.'
        write: '$(2\sqrt{3} + 3\sqrt{2})^{2}$'
      - say: 'Expand it as $a$ squared plus 2 $a b$ plus $b$ squared.'
        write: '$= (2\sqrt{3})^{2} + 2(2\sqrt{3})(3\sqrt{2}) + (3\sqrt{2})^{2}$'
      - say: '2 root 3 squared is 12. In the middle, 2 times 2 times 3 is 12, and root 3 times root 2 is root 6, so 12 root 6. 3 root 2 squared is 18.'
        write: '$= 12 + 12\sqrt{6} + 18$'
      - say: '12 plus 18 is 30.'
        write: '$= 30 + 12\sqrt{6}$'
      - say: 'Now put the new numerator over the new denominator, 6.'
        write: '$\dfrac{30 + 12\sqrt{6}}{6}$'
      - say: '30 divided by 6 is 5, and 12 divided by 6 is 2. So the answer is 5 plus 2 root 6, which is answer choice B.'
        write: '$= 5 + 2\sqrt{6}$'
        answer: true
    traps:
      A: 'You went for 5 minus 2 root 6. That comes from squaring the top as $a$ minus $b$ instead of $a$ plus $b$. Its value is about 0.1, far too small: the original top is about 7.7 and the bottom about 0.78.'
      C: 'You went for 5 root 3. The top squares to 30 plus 12 root 6, and dividing by 6 gives 5 plus 2 root 6. The 5 and the surd are separate terms, and the surd is root 6, not root 3.'
      D: 'You went for 5. That is only part of it: the middle term of the square, 12 root 6, also has to be divided by 6, giving 5 plus 2 root 6.'

  11:
    moments:
      - say: 'We need to simplify 1 over 3 plus root 5, minus 1 over 3 minus root 5.'
        write: '$\dfrac{1}{3 + \sqrt{5}} - \dfrac{1}{3 - \sqrt{5}}$'
      - say: 'To subtract fractions we need a common denominator. Here the two denominators are conjugates, partners that differ only in the sign, and that makes things tidy.'
      - say: 'The common denominator is the product of the two.'
        write: '$(3 + \sqrt{5})(3 - \sqrt{5})$'
      - say: 'That is a difference of two squares. 3 squared is 9, and root 5 squared is 5. 9 minus 5 is 4.'
        write: '$= 9 - 5 = 4$'
      - say: 'For the first fraction, we multiply top and bottom by 3 minus root 5. The top becomes 3 minus root 5.'
        write: '$\dfrac{1}{3 + \sqrt{5}} = \dfrac{3 - \sqrt{5}}{4}$'
      - say: 'For the second fraction, we multiply top and bottom by 3 plus root 5. The top becomes 3 plus root 5.'
        write: '$\dfrac{1}{3 - \sqrt{5}} = \dfrac{3 + \sqrt{5}}{4}$'
      - say: 'Now subtract the numerators over the 4. Keep the second numerator in a bracket.'
        write: '$\dfrac{(3 - \sqrt{5}) - (3 + \sqrt{5})}{4}$'
      - say: 'The minus sign in front of the bracket changes both signs inside it.'
        write: '$= \dfrac{3 - \sqrt{5} - 3 - \sqrt{5}}{4}$'
      - say: '3 minus 3 is zero. Negative root 5 minus root 5 is negative 2 root 5.'
        write: '$= \dfrac{-2\sqrt{5}}{4}$'
      - say: '2 over 4 is one half.'
        write: '$= -\tfrac{1}{2}\sqrt{5}$'
      - say: 'Does the sign make sense? The second fraction has the smaller denominator, so it is the bigger fraction. Taking it away must give a negative answer. So it is negative one half root 5, which is answer choice A.'
        write: '$-\tfrac{1}{2}\sqrt{5}$'
        answer: true
    traps:
      B: 'You went for positive one half root 5. The size is right but the sign is not. The second fraction is the bigger one, so subtracting it gives a negative answer.'
      C: 'You went for negative one quarter root 5. When you subtract, both root 5 terms are negative, so they make negative 2 root 5, not negative root 5. Over 4 that is negative one half root 5.'
      D: 'You went for zero. The two fractions are not equal: the 3s cancel, but the root 5 terms add up to negative 2 root 5. Over 4, that is negative one half root 5.'

  12:
    moments:
      - say: 'We need to multiply $x$ squared minus $3x$ plus 1 by $x$ minus $a$.'
        write: '$(x^{2} - 3x + 1)(x - a)$'
      - say: 'Every term in the first bracket must meet every term in the second. Let''s start by multiplying the whole first bracket by $x$.'
        write: '$x(x^{2} - 3x + 1) = x^{3} - 3x^{2} + x$'
      - say: 'Now multiply the first bracket by negative $a$, one term at a time. Negative $a$ times $x$ squared is negative $a x$ squared.'
        write: '$-a \times x^{2} = -ax^{2}$'
      - say: 'Watch this one. Negative $a$ times negative $3x$ is positive $3ax$, because a negative times a negative is a positive.'
        write: '$-a \times (-3x) = +3ax$'
      - say: 'And negative $a$ times 1 is negative $a$.'
        write: '$-a \times 1 = -a$'
      - say: 'So the second row is negative $a x$ squared, plus $3ax$, minus $a$.'
