# UTME 1991 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1991.yaml. Answers match that file.
format_version: 1
exam_year: 1991
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'A minus, a times and a plus, all in one line. Work from left to right and you get a wrong option. BODMAS tells us which operation goes first.'
        write: 'Simplify $3\tfrac{1}{3} - 1\tfrac{1}{4} \times \tfrac{2}{3} + 1\tfrac{2}{5}$'
      - say: 'BODMAS stands for Brackets, Of, Division, Multiplication, Addition, Subtraction. There is no bracket and no "of", so the multiplication in the middle comes first.'
        write: 'Solution (BODMAS: M before A and S)'
      - section: 'M: multiply first'
        say: 'Change 1 and a quarter to an improper fraction. Picture a bar of quarters, where 1 times 4 is 4, plus 1 is 5. So it is 5 over 4.'
        doodle: {name: 'custom:1991_q01_a', id: bar, caption: '1¼ bars: five quarters'}
        doodle_do: [{id: bar, op: label, part: bar, text: '5 quarters = 5/4'}]
        write: '$1\tfrac{1}{4} \times \dfrac{2}{3} = \dfrac{5}{4} \times \dfrac{2}{3}$'
      - say: 'Cancel first, because 2 goes into 4 twice. That leaves 5 over 2 times 1 over 3, which is 5 over 6. Five sixths of one bar is shaded.'
        doodle_do: [{id: bar, op: stage, stage: 'custom:1991_q01_a2'}, {id: bar, op: label, part: share, text: '= 5/6 of a bar'}]
        write: '$= \dfrac{5}{2 \times 3} = \dfrac{5}{6}$'
        point:
          - {line: 3, kind: highlight, at: '= 65', to: {doodle: bar, part: share}}
      - say: 'Put the 5 over 6 back in its place in the line.'
        write: 'Expression $= 3\tfrac{1}{3} - \dfrac{5}{6} + 1\tfrac{2}{5}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= 65'}, at: '65', text: 'product'}
      - section: 'A and S: add and subtract'
        say: 'Change the other mixed numbers. 3 times 3 is 9, plus 1 is 10, giving 10 over 3. 1 times 5 is 5, plus 2 is 7, giving 7 over 5.'
        write: '$= \dfrac{10}{3} - \dfrac{5}{6} + \dfrac{7}{5}$'
      - say: 'The denominators are 3, 6 and 5. The L.C.M. of 3, 6 and 5 is 30.'
        write: 'L.C.M. of 3, 6 and 5 $= 30$'
      - say: '30 divided by 3 is 10, times 10 is 100. 30 divided by 6 is 5, times 5 is 25. 30 divided by 5 is 6, times 7 is 42.'
        write: '$= \dfrac{100 - 25 + 42}{30}$'
      - say: '100 minus 25 is 75, and 75 plus 42 is 117. So we have 117 over 30.'
        write: '$= \dfrac{117}{30}$'
      - say: '30 goes into 117 three times, which is 90, remainder 27. So it is 3 and 27 over 30. Cancel 27 over 30 by 3 to get 9 over 10.'
        write: '$\therefore$ Expression $= 3\tfrac{27}{30} = 3\tfrac{9}{10}$'
      - section: 'Check'
        say: 'Check with decimals. 3.333 minus 0.833 plus 1.4 is 3.9, and 3 and 9 over 10 is 3.9.'
        write: 'Check: $3.333 - 0.833 + 1.4 = 3.9 \ \checkmark$'
      - section: 'Answer'
        say: 'So the answer is 3 and 9 over 10, which is option B.'
        write: '$\therefore$ Answer $= 3\tfrac{9}{10}$'
        answer: true
    traps:
      A: 'You went for 2 and 17 over 30. That is too small. Multiply first to get 5 over 6, then put everything over 30: 100 minus 25 plus 42 is 117 over 30, which is 3 and 9 over 10.'
      C: 'You went for 4 and 1 over 10, which is 123 over 30. Check each fraction over 30: 10 over 3 is 100, 5 over 6 is 25 and 7 over 5 is 42, and 100 minus 25 plus 42 is 117, not 123.'
      D: 'You went for 4 and 11 over 36. The L.C.M. of 3, 6 and 5 is 30, not 36. Multiply first, then put everything over 30.'

  2:
    moments:
      - section: 'The question'
        say: 'In base n, seven-zero-five-six minus four-five-seven-seven gives two-two-five-seven. Find n. Set the subtraction out in columns, as you would in the exam.'
        write: '$\begin{array}{rrrrr} & 7 & 0 & 5 & 6 \\ - & 4 & 5 & 7 & 7 \\ \hline & 2 & 2 & 5 & 7 \end{array}$ in base $n$'
      - say: 'A base must be bigger than every digit it uses. The largest digit here is 7, so n is bigger than 7.'
        write: 'Solution: largest digit is 7, so $n > 7$'
      - section: 'The units column'
        say: 'Start with the units. 6 minus 7 cannot be done, so we borrow 1 from the next column.'
        write: 'Units: $6 - 7$, borrow 1 from the next column'
      - say: 'In base n, a borrowed 1 is worth n units, just as in base ten it is worth 10.'
        write: 'A borrowed 1 $= n$ units'
      - say: 'So the units become n plus 6. Taking away 7 must leave the 7 in the answer.'
        write: '$n + 6 - 7 = 7$'
      - say: '6 minus 7 is minus 1, so n minus 1 equals 7.'
        write: '$n - 1 = 7$'
      - say: 'Add 1 to both sides. n is 8.'
        write: '$n = 8$'
      - section: 'Check: add back in base 8'
        say: 'Check by adding the answer back to four-five-seven-seven, in base eight. We should get seven-zero-five-six.'
        write: '$\begin{array}{rrrrr} & 2 & 2 & 5 & 7 \\ + & 4 & 5 & 7 & 7 \\ \hline & & & & \end{array}$ in base 8'
      - say: 'In the units, 7 plus 7 is 14. 14 is one eight and 6 over, so write 6 and carry 1.'
        write: 'Units: $7 + 7 = 14 = 1 \times 8 + 6$: write 6, carry 1'
      - say: 'In the eights, 5 plus 7, plus the carried 1, is 13. That is one eight and 5 over, so write 5, carry 1.'
        write: 'Eights: $5 + 7 + 1 = 13 = 1 \times 8 + 5$: write 5, carry 1'
      - say: 'In the next column, 2 plus 5, plus 1, is 8. That is one eight and nought over, so write 0 and carry 1.'
        write: 'Next: $2 + 5 + 1 = 8 = 1 \times 8 + 0$: write 0, carry 1'
      - say: 'In the last column, 2 plus 4, plus 1, is 7. Write 7.'
        write: 'Last: $2 + 4 + 1 = 7$: write 7'
      - say: 'We get seven-zero-five-six base eight, the number we started from. It agrees.'
        write: '$2257_{8} + 4577_{8} = 7056_{8}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore n is 8, which is option A.'
        write: '$\therefore n = 8$'
        answer: true
    traps:
      B: 'You went for 9. Test the units column: in base 9 the borrow is worth 9, and 9 plus 6 minus 7 is 8, but the answer shows 7. Only n equals 8 fits.'
      C: 'You went for 10, the base we use every day. In base ten, 7056 minus 4577 is 2479, not two-two-five-seven, so base ten does not work.'
      D: 'You went for 11. In the units column, 11 plus 6 minus 7 is 10, not the 7 in the answer. Only n equals 8 makes that column work.'

  3:
    moments:
      - section: 'The question'
        say: 'Two brackets, divisions by small decimals, and an answer to 3 decimal places. The exact answer lands right on a borderline, so the rounding rule decides it.'
        write: 'Find $\left(\dfrac{1}{0.05} \div \dfrac{1}{5.005}\right) - (0.05 \times 2.05)$ to 3 d.p.'
      - say: 'By BODMAS, each bracket is worked out first, then the subtraction. We round only at the very end.'
        write: 'Solution'
      - section: 'First bracket'
        say: 'For 1 over 0.05, multiply the top and bottom by 100 to clear the decimal. That gives 100 over 5, which is 20.'
        write: '$\dfrac{1}{0.05} = \dfrac{100}{5} = 20$'
      - say: 'To divide by 1 over 5.005, multiply by its reciprocal, 5.005.'
        write: '$20 \div \dfrac{1}{5.005} = 20 \times 5.005$'
      - say: 'For 20 times 5.005, 2 times 5.005 is 10.010, and times 10 is 100.10. So the first bracket is 100.1.'
        write: 'First bracket $= 100.1$'
      - section: 'Second bracket'
        say: 'Now 0.05 times 2.05. Leave out the points, and 5 times 205 is 1,025. There are 2 plus 2, so 4, decimal places, giving 0.1025.'
        write: 'Second bracket $= 0.05 \times 2.05 = 0.1025$'
      - section: 'Subtract'
        say: 'Subtract with the decimal points in a line. Write 100.1 as 100.1000. The difference is 99.9975.'
        write: '$\begin{array}{r} 100.1000 \\ -\ \ \ 0.1025 \\ \hline 99.9975 \end{array}$'
      - section: 'Round to 3 d.p.'
        say: 'Picture 99.9975 on a number line, exactly half way between 99.997 and 99.998. Cut after 3 decimal places, so we have 99.997, then 5.'
        doodle: {name: 'custom:1991_q03_a', id: sign, caption: '99.9975 between two posts'}
        write: '$99.997|5$'
      - say: 'The next digit is 5. The rule is 5 or more, add 1. So the 7 becomes 8, and the answer is 99.998.'
        doodle_do: [{id: sign, op: stage, stage: 'custom:1991_q03_a2'}, {id: sign, op: circle, part: high}]
        write: '$\therefore 99.9975 \approx 99.998$ (3 d.p.)'
        point:
          - {line: 8, kind: highlight, at: '99.998', to: {doodle: sign, part: high}}
      - section: 'Check'
        say: 'Check the size. The first bracket is about 100, and we take away about a tenth. So the answer must be just under 100. 99.998 fits.'
        write: 'Check: $100.1 - 0.1 \approx 100$, just under $\ \checkmark$'
      - section: 'Answer'
        say: 'So the answer, correct to 3 decimal places, is 99.998, which is option A.'
        write: '$\therefore$ Answer $= 99.998$ (3 d.p.)'
        answer: true
    traps:
      B: 'You went for 98.999. That is about 1 too small. The first bracket is 100.1 and we take away only 0.1025, so the answer is 99.9975, which is 99.998.'
      C: 'You went for 89.899. That is about 10 too small. 20 times 5.005 is 100.1, and taking away 0.1025 leaves 99.9975.'
      D: 'You went for 9.998. That is ten times too small. 1 divided by 0.05 is 20, because dividing by a small number makes the answer bigger.'

  4:
    moments:
      - section: 'The question'
        say: 'Four options, all starting 20.6 or 20.7. They differ in how many figures they keep and how they round. Three significant figures means exactly three.'
        write: 'Express $\dfrac{62}{3}$ as a decimal to 3 s.f.'
      - say: 'We divide 62 by 3, then round with a cut after the third significant figure.'
        write: 'Solution'
      - section: 'Divide'
        say: 'Short division. 3 into 6 goes 2. 3 into 2 goes 0, remainder 2. Put the point. 3 into 20 goes 6, remainder 2, and that happens again and again.'
        write: '$\dfrac{62}{3} = 62 \div 3 = 20.666\ldots$'
      - section: 'Round to 3 s.f.'
        say: 'Significant figures start at the first digit that is not zero, so 2, then 0, then 6. Cut after the 6. The next digit is another 6.'
        write: '$20.6|66\ldots$'
      - say: 'Picture 20.666 between two posts, 20.6 and 20.7. The rule says next digit 5 or more, add 1. 6 is more than 5, so the 6 becomes 7.'
        doodle: {name: 'custom:1991_q04_a', id: sign, caption: '20.666… between 20.6 and 20.7'}
        doodle_do: [{id: sign, op: stage, stage: 'custom:1991_q04_a2'}, {id: sign, op: circle, part: high}]
        write: '$\therefore \dfrac{62}{3} \approx 20.7$ (3 s.f.)'
        point:
          - {line: 4, kind: highlight, at: '20.7', to: {doodle: sign, part: high}}
      - section: 'Check'
        say: 'To check, 20.7 times 3 is 62.1, very close to 62. And 20.7 has exactly 3 significant figures, which are 2, 0 and 7.'
        write: 'Check: $20.7 \times 3 = 62.1 \approx 62 \ \checkmark$'
      - section: 'Answer'
        say: 'So 62 over 3 is 20.7 to 3 significant figures, which is option D.'
        write: '$\therefore \dfrac{62}{3} = 20.7$ (3 s.f.)'
        answer: true
    traps:
      A: 'You went for 20.6. That cuts off the digits without rounding. The next digit after the cut is 6, which is 5 or more, so add 1: 20.7.'
      B: 'You went for 20.667. That is rounded correctly, but to 5 significant figures. The question asks for 3: the digits 2, 0 and 7.'
      C: 'You went for 20.67. That is rounded correctly, but to 4 significant figures. The question asks for 3, which gives 20.7.'

  5:
    moments:
      - section: 'The question'
        say: 'Factory P goes down 5 percent and factory Q goes up 5 percent. Do they cancel out? No, because they are 5 percent of different amounts. Picture the two factories.'
        doodle: {name: 'custom:1991_q05_a', id: plants, caption: '20,000 bags −5%, 15,000 bags +5%'}
        write: 'P: 20,000 bags a day, down 5%. Q: 15,000 bags a day, up 5%. Net loss $= ?$'
      - say: 'To find x percent of a quantity, we write x over 100 times the quantity. We work out each change in bags, then combine.'
        write: 'Solution: $x\%$ of $Q = \dfrac{x}{100} \times Q$'
      - section: 'Change in each factory'
        say: 'P loses 5 percent of 20,000. For 5 over 100 times 20,000, cancel 100 into 20,000, which gives 200, and 5 times 200 is 1,000 bags.'
        doodle_do: [{id: plants, op: label, part: p-change, text: '−1,000 bags'}]
        write: 'Decrease in P $= \dfrac{5}{100} \times 20000 = 1000$ bags'
        point:
          - {line: 2, kind: highlight, at: '1000', to: {doodle: plants, part: p-change}}
      - say: 'Q gains 5 percent of 15,000. 15,000 over 100 is 150, and 5 times 150 is 750 bags.'
        doodle_do: [{id: plants, op: label, part: q-change, text: '+750 bags'}]
        write: 'Increase in Q $= \dfrac{5}{100} \times 15000 = 750$ bags'
        point:
          - {line: 3, kind: highlight, at: '750', to: {doodle: plants, part: q-change}}
      - section: 'Combine'
        say: 'The decrease is bigger than the increase, so overall the two factories lose. The effective loss is 1,000 minus 750.'
        write: 'Effective loss $= 1000 - 750$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '= 1000'}, at: '1000', text: 'P loses'}
          - {line: 4, kind: move, from: {line: 3, at: '= 750'}, at: '750', text: 'Q gains'}
      - say: '1,000 minus 750 is 250. So together they make 250 fewer bags a day.'
        doodle_do: [{id: plants, op: label, text: 'net: 250 fewer bags a day'}]
        write: '$\therefore$ Effective loss $= 250$ bags per day'
      - section: 'Check'
        say: 'Check with totals. Before, 20,000 plus 15,000 is 35,000 bags. After, 19,000 plus 15,750 is 34,750 bags.'
        write: 'Check: before $35000$; after $19000 + 15750 = 34750$'
      - say: '35,000 minus 34,750 is 250. The same loss.'
        doodle_do: [{id: plants, op: pulse}]
        write: '$35000 - 34750 = 250 \ \checkmark$'
      - section: 'Answer'
        say: 'So the effective loss is 250 bags a day, which is option A.'
        write: '$\therefore$ Effective loss $= 250$ bags'
        answer: true
    traps:
      B: 'You went for 750. That is only Q''s increase. P loses 1,000 bags, and Q''s 750 only partly makes up for it, leaving a loss of 250.'
      C: 'You went for 1,000. That is P''s decrease on its own. Q gains 750 at the same time, so the effective loss is 1,000 minus 750, which is 250.'
      D: 'You went for 1,250. The decrease and the increase go opposite ways, so subtract: 1,000 minus 750 is 250.'

  6:
    moments:
      - section: 'The question'
        say: 'Musa borrows ₦10 at 2 percent a month simple interest, and pays back ₦8 after 4 months. How much does he still owe? Picture his debt as a jar.'
        doodle: {name: 'custom:1991_q06_a', id: jar, caption: 'borrow ₦10, repay ₦8 after 4 months'}
        doodle_do: [{id: jar, op: fill, to: 0.9}]
        write: 'Borrowed ₦10.00 at 2% per month simple interest; repays ₦8.00 after 4 months'
      - say: 'Write the givens first. P is 10 naira, R is 2 percent per month, and T is 4 months. The rate is per month, so T stays in months.'
        write: 'Solution: $P = $₦$10,\ R = 2\%$ per month, $T = 4$ months'
      - section: 'The interest'
        say: 'Simple interest is the principal times the rate times the time, over 100.'
        write: '$I = \dfrac{PRT}{100}$'
      - say: 'Substitute, so 10 times 2 times 4, over 100. 10 times 2 is 20, times 4 is 80. So 80 over 100, which is 80 kobo.'
        doodle_do: [{id: jar, op: stage, stage: 'custom:1991_q06_a2'}]
        write: '$I = \dfrac{10 \times 2 \times 4}{100} = \dfrac{80}{100} = $₦$0.80$'
      - section: 'The amount owed'
        say: 'The amount owed after 4 months is the principal plus the interest, so A equals P plus I. 10 plus 0.80 is 10.80.'
        doodle_do: [{id: jar, op: fill, to: 1}, {id: jar, op: label, part: coins, text: '+₦0.80 interest'}]
        write: '$A = P + I = 10.00 + 0.80 = $₦$10.80$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '₦0.80'}, at: '+ [[0.80]]', text: 'interest'}
      - say: 'He then pays back ₦8.00, and the jar drops. Take it from the amount owed, and 10.80 minus 8.00 is 2.80.'
        doodle_do: [{id: jar, op: fill, to: 0.26}, {id: jar, op: circle, part: repay}]
        write: 'Still owed $= 10.80 - 8.00 = $₦$2.80$'
        point:
          - {line: 5, kind: highlight, at: '₦2.80', to: {doodle: jar, part: owed}}
      - say: 'Therefore he still owes ₦2.80.'
        doodle_do: [{id: jar, op: label, part: owed, text: '₦2.80'}]
        write: '$\therefore$ Musa still owes ₦2.80'
      - section: 'Check'
        say: 'To check, each month the interest is 2 percent of ₦10, which is 20 kobo. Four months make 80 kobo, the same interest.'
        write: 'Check: $\dfrac{2}{100} \times 10 = $₦$0.20$ a month; $4 \times 0.20 = $₦$0.80 \ \checkmark$'
      - section: 'Answer'
        say: 'So Musa still owes ₦2.80, which is option C.'
        write: '$\therefore$ Still owed $=$ ₦2.80'
        answer: true
    traps:
      A: 'You went for ₦10.80. That is the amount owed after 4 months, before he repays anything. He then pays back ₦8.00, leaving ₦2.80.'
      B: 'You went for ₦10.67. That is not the amount we get. I is 10 times 2 times 4 over 100, which is ₦0.80, so A is ₦10.80; after repaying ₦8.00 he owes ₦2.80.'
      D: 'You went for ₦2.67. The subtraction is right, but the interest is not. 2 percent of ₦10 for 4 months is exactly ₦0.80, so A is ₦10.80 and he still owes ₦2.80.'

  7:
    moments:
      - section: 'The question'
        say: 'Two spirits are mixed, where one is 20 percent water and the other 15 percent. Is the mixture 17 and a half percent water? No, because there is more of one spirit. Picture the two jugs.'
        doodle: {name: 'custom:1991_q07_a', id: spirits, caption: '3 gal at 20%, 5 gal at 15% water'}
        write: '3 gal at 20% water + 5 gal at 15% water. Water in the mixture $= ?\%$'
      - say: 'We find the actual gallons of water in each spirit, then the water as a percentage of the whole mixture. x percent of a quantity is x over 100 times the quantity.'
        write: 'Solution'
      - section: 'Water in each spirit'
        say: '20 percent of 3 gallons is 20 over 100 times 3. 20 times 3 is 60, over 100, which is 0.6 gallon of water.'
        doodle_do: [{id: spirits, op: label, part: jug1, text: '0.6 gal water'}]
        write: 'Water in 1st $= \dfrac{20}{100} \times 3 = 0.6$ gal'
      - say: '15 percent of 5 gallons is 15 over 100 times 5. 15 times 5 is 75, over 100, so 0.75 gallon.'
        doodle_do: [{id: spirits, op: label, part: jug2, text: '0.75 gal water'}]
        write: 'Water in 2nd $= \dfrac{15}{100} \times 5 = 0.75$ gal'
      - section: 'The mixture'
        say: 'Pour both into the bucket. Total water is 0.6 plus 0.75, which is 1.35 gallons.'
        doodle_do: [{id: spirits, op: fill, to: 0.17}, {id: spirits, op: label, part: mix, text: '1.35 gal water'}]
        write: 'Total water $= 0.6 + 0.75 = 1.35$ gal'
        point:
          - {line: 4, kind: highlight, at: '1.35', to: {doodle: spirits, part: mix}}
      - say: 'Total mixture is 3 plus 5, which is 8 gallons.'
        write: 'Total mixture $= 3 + 5 = 8$ gal'
      - section: 'Percentage of water'
        say: 'Percentage of water is the water over the whole mixture, times 100 percent.'
        write: '$\%$ water $= \dfrac{\text{water}}{\text{mixture}} \times 100\%$'
      - say: 'Substitute 1.35 gallons of water over 8 gallons of mixture.'
        write: '$= \dfrac{1.35}{8} \times 100\%$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '= 1.35'}, at: '81.35', text: 'water'}
      - say: '1.35 times 100 is 135. So it is 135 over 8 percent.'
        write: '$= \dfrac{135}{8}\%$'
      - say: '8 goes into 135 sixteen times, which is 128, remainder 7. So it is 16 and 7 over 8 percent.'
        doodle_do: [{id: spirits, op: label, part: pct, text: '16⅞%'}]
        write: '$\therefore$ Water $= 16\tfrac{7}{8}\%$'
      - section: 'Check'
        say: 'Check. The answer must lie between 15 and 20 percent, and nearer 15, because there is more of the 15 percent spirit. 16 and 7 over 8 fits.'
        write: 'Check: $15\% < 16\tfrac{7}{8}\% < 17\tfrac{1}{2}\% \ \checkmark$'
      - section: 'Answer'
        say: 'So the mixture is 16 and 7 over 8 percent water, which is option B.'
        write: '$\therefore$ Water in the mixture $= 16\tfrac{7}{8}\%$'
        answer: true
    traps:
      A: 'You went for 2 and 4 over 5 percent. That is far too small: mixing a 20 percent spirit with a 15 percent spirit must give between 15 and 20 percent. Divide the 1.35 gallons of water by the 8 gallons of mixture.'
      C: 'You went for 18 and 1 over 8 percent. That leans towards the 20 percent spirit. There are 5 gallons at 15 percent and only 3 at 20, so the answer is nearer 15: 135 over 8 is 16 and 7 over 8.'
      D: 'You went for 18 and 7 over 8 percent. That is even above the plain average of 17 and a half. There is more of the 15 percent spirit, so the mixture is nearer 15 percent: 16 and 7 over 8.'

  8:
    moments:
      - section: 'The question'
        say: 'Three factors, and two of them carry negative indices. Many students drop a sign here. One law of indices turns each factor into a plain number.'
        write: 'Find the product of $\dfrac{27}{5}$, $(3)^{-3}$ and $\left(\dfrac{1}{5}\right)^{-1}$'
      - say: 'Solution. A product means we multiply the three factors together.'
        write: 'Solution'
      - say: 'So write the product with a times sign between the factors.'
        write: 'Product $= \dfrac{27}{5} \times 3^{-3} \times \left(\dfrac{1}{5}\right)^{-1}$'
        doodle: {name: 'custom:1991_q08_a', id: tower, caption: 'a tower of 3s and a card, 1/5'}
      - section: 'The law'
        say: 'The law of indices for a negative index says $a$ to the power negative $n$ is 1 over $a$ to the power $n$. A negative index means the reciprocal.'
        write: 'Law of indices: $a^{-n} = \dfrac{1}{a^{n}}$'
      - section: 'The second factor'
        say: 'By that law, 3 to the power negative 3 is 1 over 3 cubed. Watch the tower of 3s go under a 1.'
        write: '$3^{-3} = \dfrac{1}{3^{3}}$'
        doodle_do:
          - {id: tower, op: stage, stage: 'custom:1991_q08_a2'}
      - say: '3 cubed is 3 times 3 times 3. 3 times 3 is 9, and 9 times 3 is 27.'
        write: '$= \dfrac{1}{3 \times 3 \times 3} = \dfrac{1}{27}$'
        doodle_do:
          - {id: tower, op: label, part: stack, text: '3 × 3 × 3 = 27'}
      - section: 'The third factor'
        say: 'The third factor, 1 over 5 to the power negative 1, is 1 divided by 1 over 5.'
        write: '$\left(\dfrac{1}{5}\right)^{-1} = 1 \div \dfrac{1}{5}$'
      - say: 'To divide by a fraction, turn it upside down and multiply. 1 times 5 over 1 is 5. The card flips over.'
        write: '$= 1 \times \dfrac{5}{1} = 5$'
        doodle_do:
          - {id: tower, op: stage, stage: 'custom:1991_q08_a3'}
      - section: 'Multiply'
        say: 'Now substitute the plain forms into the product, which gives 27 over 5, times 1 over 27, times 5.'
        write: '$\therefore$ Product $= \dfrac{27}{5} \times \dfrac{1}{27} \times 5$'
      - say: 'Put it over one line, with 27 times 1 times 5 on top, and 5 times 27 underneath.'
        write: '$= \dfrac{27 \times 1 \times 5}{5 \times 27}$'
      - say: 'The 27 on top cancels the 27 underneath, and the 5 on top cancels the 5 underneath. That leaves 1.'
        write: '$= 1$'
        doodle_do:
          - {id: tower, op: cross, part: stack}
      - section: 'Check'
        say: 'Check with indices. 27 is 3 cubed, so the 3s give 3 cubed times 3 to the power negative 3, which is 3 to the power 0, which is 1. The 5s give 5 to the power negative 1 times 5, which is also 1.'
        write: 'Check: $3^{3} \times 3^{-3} = 3^{0} = 1,\ \ 5^{-1} \times 5^{1} = 5^{0} = 1\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the product is 1, which is option C.'
        write: '$\therefore$ Product $= 1$'
        answer: true
    traps:
      A: 'You went for 5. The 27s cancel, and so do the two 5s: the 5 under the 27, and the 5 from 1 over 5 to the power negative 1. Once both pairs cancel, the product is 1.'
      B: 'You went for 3. That happens if 3 to the power negative 3 is taken as 1 over 9. But 3 cubed is 27, so it is 1 over 27, and the product is 1.'
      D: 'You went for 1 over 25. That keeps 1 over 5 to the power negative 1 as 1 over 5. A negative index means the reciprocal, so it is 5, and the product is 1.'

  9:
    moments:
      - section: 'The question'
        say: 'Three logs with fractions inside. Express them as a single logarithm, simplify the fraction, then split it to match the options, which use log 2.'
        write: 'Simplify $2\log\dfrac{2}{5} - \log\dfrac{72}{125} + \log 9$'
      - say: 'Solution. All the logs here are base 10.'
        write: 'Solution'
      - section: 'The power law'
        say: 'Recall the power law, where $n$ times log $M$ is the log of $M$ to the power $n$.'
        write: 'Recall: $n\log M = \log M^{n}$'
      - say: 'By the power law, 2 log of 2 over 5 is the log of 2 over 5, squared.'
        write: '$2\log\dfrac{2}{5} = \log\left(\dfrac{2}{5}\right)^{2}$'
      - say: '2 over 5, squared, is 4 over 25.'
        write: '$= \log\dfrac{4}{25}$'
      - say: 'Put that back in.'
        write: 'Expression $= \log\dfrac{4}{25} - \log\dfrac{72}{125} + \log 9$'
      - section: 'A single logarithm'
        say: 'Recall the quotient law. Log $M$ minus log $N$ is log of $M$ over $N$.'
        write: 'Recall: $\log M - \log N = \log\dfrac{M}{N}$'
      - say: 'And the product law says log $M$ plus log $N$ is log of $M$ times $N$.'
        write: 'Recall: $\log M + \log N = \log MN$'
      - say: 'By the quotient law, the first two terms become the log of 4 over 25, divided by 72 over 125. By the product law, plus log 9 multiplies by 9.'
        write: '$= \log\left(\dfrac{4}{25} \div \dfrac{72}{125} \times 9\right)$'
      - say: 'Dividing by a fraction means multiplying by its reciprocal. The reciprocal of 72 over 125 is 125 over 72.'
        write: '$= \log\left(\dfrac{4}{25} \times \dfrac{125}{72} \times 9\right)$'
      - say: '125 divided by 25 is 5, so the 25 cancels and leaves 5 on top.'
        write: '$= \log\dfrac{4 \times 5 \times 9}{72}$'
      - say: '4 times 5 is 20, and 20 times 9 is 180.'
        write: '$= \log\dfrac{180}{72}$'
      - say: 'Divide the top and bottom by 36. 180 divided by 36 is 5, and 72 divided by 36 is 2.'
        write: '$= \log\dfrac{5}{2}$'
      - section: 'Match the options'
        say: 'The options use log 2 but no log 5. So multiply the top and bottom by 2, and 5 over 2 is 10 over 4.'
        write: '$= \log\dfrac{10}{4}$'
      - say: 'By the quotient law, the log of 10 over 4 is log 10 minus log 4.'
        write: '$= \log 10 - \log 4$'
      - say: 'In base 10, log 10 is 1, because 10 to the power 1 is 10. And 4 is 2 squared. Picture one 10, and two 2s.'
        doodle: {name: 'custom:1991_q09_a', id: blocks, caption: 'one 10; two 2s'}
        doodle_do:
          - {id: blocks, op: circle, part: ten}
        write: '$= 1 - \log 2^{2}$ $\quad [\log_{10}10 = 1]$'
      - say: 'By the power law, log of 2 squared is 2 log 2.'
        doodle_do:
          - {id: blocks, op: highlight, part: twos}
        write: '$= 1 - 2\log 2$'
      - section: 'Check'
        say: 'Check with the values from tables. Log 2.5 is about 0.3979, and 1 minus 2 times 0.3010 is 0.3980. They agree.'
        write: 'Check: $\log 2.5 \approx 0.398$, $\ 1 - 2(0.3010) = 0.398\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the expression simplifies to 1 minus 2 log 2, which is option D.'
        write: '$\therefore$ the expression $= 1 - 2\log 2$'
        answer: true
    traps:
      A: 'You went for 1 minus 4 log 3. The 3s cancel completely: 72 is 8 times 9, and the 9 on top cancels it. So no log 3 is left in the answer.'
      B: 'You went for minus 1 plus 2 log 3. The factors of 3 in 72 and 9 cancel, so log 3 cannot appear. Everything simplifies to log of 5 over 2, which is 1 minus 2 log 2.'
      C: 'You went for minus 1 plus 5 log 2. That is log of 32 over 10, which is log 3.2. The expression simplifies to log 2.5, which is log 10 minus log 4.'

  10:
    moments:
      - section: 'The question'
        say: 'Look closely, because the numerator and the denominator use the same two surds, 2 root 3 and 3 root 2. That makes the conjugate do double work here.'
        write: 'Rationalise $\dfrac{2\sqrt{3} + 3\sqrt{2}}{3\sqrt{2} - 2\sqrt{3}}$'
      - say: 'Solution. Multiply the numerator and the denominator by the conjugate of the denominator.'
        write: 'Solution'
      - section: 'The conjugate'
        say: 'The denominator is 3 root 2 minus 2 root 3, so its conjugate is 3 root 2 plus 2 root 3, which is the same two terms with the sign between them changed.'
        write: 'Conjugate of $3\sqrt{2} - 2\sqrt{3}$ is $3\sqrt{2} + 2\sqrt{3}$'
      - say: 'Multiply the numerator and the denominator by it. Something over itself is 1, so the value does not change.'
        write: '$= \dfrac{(2\sqrt{3} + 3\sqrt{2})(3\sqrt{2} + 2\sqrt{3})}{(3\sqrt{2} - 2\sqrt{3})(3\sqrt{2} + 2\sqrt{3})}$'
      - section: 'The denominator'
        say: 'The denominator is a difference of two squares, so $a$ minus $b$, times $a$ plus $b$, is $a$ squared minus $b$ squared.'
        write: '$(a - b)(a + b) = a^{2} - b^{2}$'
      - say: 'Here $a$ is 3 root 2 and $b$ is 2 root 3. Picture each square as tiles.'
        doodle: {name: 'custom:1991_q10_a', id: tiles, caption: 'surds squared, as tiles'}
        write: 'Denominator $= (3\sqrt{2})^{2} - (2\sqrt{3})^{2}$'
      - say: 'Square the number and the surd. 3 root 2 squared is 9 times 2, which is 18. 2 root 3 squared is 4 times 3, which is 12.'
        doodle_do:
          - {id: tiles, op: label, part: big, text: '18'}
          - {id: tiles, op: label, part: small, text: '12'}
        write: '$= 9 \times 2 - 4 \times 3 = 18 - 12$'
      - say: '18 minus 12 is 6. The denominator has no surd left.'
        write: '$= 6$'
      - section: 'The numerator'
        say: 'Now the numerator. 2 root 3 plus 3 root 2, and 3 root 2 plus 2 root 3, are the same two terms in a different order. So the numerator is that bracket squared.'
        write: 'Numerator $= (2\sqrt{3} + 3\sqrt{2})^{2}$'
      - say: 'When squaring a sum, $a$ plus $b$, all squared, is $a$ squared plus $2ab$ plus $b$ squared.'
        write: '$(a + b)^{2} = a^{2} + 2ab + b^{2}$'
      - say: 'Here $a$ is 2 root 3 and $b$ is 3 root 2. The first squared, plus twice the product, plus the second squared.'
        write: '$= (2\sqrt{3})^{2} + 2(2\sqrt{3})(3\sqrt{2}) + (3\sqrt{2})^{2}$'
      - say: '2 root 3 squared is 4 times 3, which is 12. In the middle, 2 times 2 times 3 is 12, and root 3 times root 2 is root 6. 3 root 2 squared is 18.'
        write: '$= 12 + 12\sqrt{6} + 18$'
      - say: '12 plus 18 is 30.'
        write: '$= 30 + 12\sqrt{6}$'
      - section: 'Divide'
        say: 'Now put the numerator over the denominator, the 6 we found.'
        write: '$\therefore$ Fraction $= \dfrac{30 + 12\sqrt{6}}{6}$'
        point:
          - {line: 13, kind: move, from: {line: 7, at: '= 6'}, at: '[[6]]30', text: 'denominator'}
      - say: 'Divide each term by 6. 30 over 6 is 5, and 12 over 6 is 2.'
        write: '$= \dfrac{30}{6} + \dfrac{12\sqrt{6}}{6} = 5 + 2\sqrt{6}$'
      - section: 'Check'
        say: 'Check with decimals. The numerator of the question is about 3.464 plus 4.243, which is 7.707. The denominator is about 0.779. 7.707 over 0.779 is about 9.90, and 5 plus 2 root 6 is about 9.90.'
        write: 'Check: $\dfrac{7.707}{0.779} \approx 9.90 \approx 5 + 2(2.449)\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the fraction rationalises to 5 plus 2 root 6, which is option B.'
        write: '$\therefore$ the answer is $5 + 2\sqrt{6}$'
        answer: true
    traps:
      A: 'You went for 5 minus 2 root 6. That comes from squaring the numerator as $a$ minus $b$ instead of $a$ plus $b$. Its value is about 0.1, far too small: the fraction is about 7.7 over 0.78.'
      C: 'You went for 5 root 3. The numerator squares to 30 plus 12 root 6, and dividing by 6 gives 5 plus 2 root 6. The 5 and the surd are separate terms, and the surd is root 6, not root 3.'
      D: 'You went for 5. That is only part of it: the middle term of the square, 12 root 6, also has to be divided by 6, giving 5 plus 2 root 6.'

  11:
    moments:
      - section: 'The question'
        say: 'Two fractions whose denominators are conjugates, 3 plus root 5 and 3 minus root 5. Their product is a whole number, so the subtraction comes out clean.'
        write: 'Simplify $\dfrac{1}{3 + \sqrt{5}} - \dfrac{1}{3 - \sqrt{5}}$'
      - say: 'Solution. Put the two fractions over one denominator, the product of the two denominators.'
        write: 'Solution'
      - section: 'One denominator'
        say: 'The L.C.M. of the denominators is their product. Each numerator is multiplied by the other denominator, giving 1 times 3 minus root 5, minus 1 times 3 plus root 5.'
        write: '$= \dfrac{(3 - \sqrt{5}) - (3 + \sqrt{5})}{(3 + \sqrt{5})(3 - \sqrt{5})}$'
      - section: 'The denominator'
        say: 'The denominator is a difference of two squares, where $a$ plus $b$, times $a$ minus $b$, is $a$ squared minus $b$ squared.'
        write: '$(a + b)(a - b) = a^{2} - b^{2}$'
      - say: 'So it is 3 squared minus root 5 squared. Picture a 3 by 3 square of tiles, with a square of side root 5 in its corner. 3 squared is 9, and root 5 squared is 5.'
        doodle: {name: 'custom:1991_q11_a', id: tiles, caption: '3 × 3 square, root-5 corner'}
        doodle_do:
          - {id: tiles, op: label, part: nine, text: '9'}
          - {id: tiles, op: label, part: five, text: '5'}
        write: 'Denominator $= 3^{2} - (\sqrt{5})^{2} = 9 - 5$'
      - say: 'Take the corner away, and 9 minus 5 is 4.'
        doodle_do:
          - {id: tiles, op: cross, part: five}
          - {id: tiles, op: label, part: left, text: '4 left'}
        write: '$= 4$'
        point:
          - {line: 5, kind: highlight, at: '4', to: {doodle: tiles, part: left}}
      - section: 'The numerator'
        say: 'Now the numerator. The minus in front of the second bracket changes both signs inside it.'
        write: 'Numerator $= 3 - \sqrt{5} - 3 - \sqrt{5}$'
      - say: '3 minus 3 is 0. Minus root 5, minus another root 5, is minus 2 root 5.'
        write: '$= -2\sqrt{5}$'
      - section: 'Put together'
        say: 'Put the numerator over the denominator, which is minus 2 root 5, over 4.'
        write: '$\therefore$ Expression $= \dfrac{-2\sqrt{5}}{4}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= −25'}, at: '−25', text: 'numerator'}
      - say: '2 over 4 is 1 over 2, a half. So we have minus a half root 5.'
        write: '$= -\dfrac{1}{2}\sqrt{5}$'
      - section: 'Check'
        say: 'Check with decimals. 1 over 5.236 is about 0.191, and 1 over 0.764 is about 1.309. 0.191 minus 1.309 is minus 1.118, and a half of root 5 is 1.118.'
        write: 'Check: $0.191 - 1.309 = -1.118 \approx -\tfrac{1}{2}(2.236)\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the expression simplifies to minus a half root 5, which is option A.'
        write: '$\therefore$ the answer is $-\dfrac{1}{2}\sqrt{5}$'
        answer: true
    traps:
      B: 'You went for positive a half root 5. The size is right but the sign is not. The second fraction has the smaller denominator, so it is the bigger fraction, and subtracting it gives a negative answer.'
      C: 'You went for minus 1 over 4 root 5. When you open the bracket, both root 5 terms are negative, so they make minus 2 root 5, not minus root 5. Over 4, that is minus a half root 5.'
      D: 'You went for 0. The two fractions are not equal: the 3s cancel, but the root 5 terms add up to minus 2 root 5. Over 4, that is minus a half root 5.'

  12:
    moments:
      - section: 'The question'
        say: 'Multiply $x$ squared minus $3x$ plus 1 by $x$ minus $a$. Six products hide in here, and missing just one of them lands you on a trap option.'
        write: '$(x^{2} - 3x + 1)(x - a)$'
        doodle: {name: 'custom:1991_q12_a', id: grid, caption: 'every term meets every term'}
      - section: 'Solution'
        say: 'Every term in the first bracket must meet every term in the second. So we multiply the whole first bracket by $x$, then by negative $a$.'
        write: 'Solution'
      - say: 'Write it out as $x$ times the bracket, minus $a$ times the bracket.'
        write: '$= x(x^{2} - 3x + 1) - a(x^{2} - 3x + 1)$'
      - say: 'Open the first bracket. $x$ times $x$ squared is $x$ cubed, $x$ times negative $3x$ is negative $3x$ squared, and $x$ times 1 is $x$. That is the top row of the grid.'
        write: '$x(x^{2} - 3x + 1) = x^{3} - 3x^{2} + x$'
        doodle_do:
          - {id: grid, op: stage, stage: 'custom:1991_q12_a2'}
      - say: 'Open the second bracket. Negative $a$ times $x$ squared is negative $ax$ squared. Negative $a$ times negative $3x$ is plus $3ax$. Negative $a$ times 1 is negative $a$.'
        write: '$-a(x^{2} - 3x + 1) = -ax^{2} + 3ax - a$'
        doodle_do:
          - {id: grid, op: stage, stage: 'custom:1991_q12_a3'}
        point:
          - {line: 4, kind: highlight, at: '+ 3ax', text: 'negative times negative', to: {doodle: grid, part: row2}}
      - say: 'Put the two rows together, and that is all six boxes of the grid.'
        write: '$= x^{3} - 3x^{2} + x - ax^{2} + 3ax - a$'
        doodle_do:
          - {id: grid, op: pulse}
      - say: 'Collect like terms. Bring the two $x$ squared terms together, and the two $x$ terms together.'
        write: '$= x^{3} - 3x^{2} - ax^{2} + x + 3ax - a$'
      - say: 'Factorise the $x$ squared terms. Negative 3 $x$ squared minus $ax$ squared is negative, 3 plus $a$, $x$ squared.'
        write: '$-3x^{2} - ax^{2} = -(3 + a)x^{2}$'
      - say: 'Factorise the $x$ terms. $x$ plus $3ax$ is 1 plus $3a$, times $x$.'
        write: '$x + 3ax = (1 + 3a)x$'
      - say: 'Therefore the product is $x$ cubed, minus 3 plus $a$ $x$ squared, plus 1 plus $3a$ $x$, minus $a$.'
        write: '$\therefore x^{3} - (3 + a)x^{2} + (1 + 3a)x - a$'
        point:
          - {line: 9, kind: move, from: {line: 7, at: '= −(3+a)x2'}, at: '−(3+a)x2', text: 'x² terms'}
          - {line: 9, kind: move, from: {line: 8, at: '= (1+3a)x'}, at: '(1+3a)x', text: 'x terms'}
      - section: 'Check'
        say: 'Check with numbers. Take $x$ equals 2 and $a$ equals 1. The question gives 4 minus 6 plus 1, which is negative 1, times 2 minus 1, which is 1.'
        write: '$x = 2,\ a = 1$: $(4 - 6 + 1)(2 - 1) = -1$'
      - say: 'Our answer gives 8, minus 4 times 4, plus 4 times 2, minus 1. That is 8 minus 16 plus 8 minus 1, which is negative 1. They agree.'
        write: '$8 - 4(4) + 4(2) - 1 = -1\ \checkmark$'
      - say: 'So the product is option C.'
        write: '$x^{3} - (3 + a)x^{2} + (1 + 3a)x - a$ (C)'
        answer: true
    traps:
      A: 'You went for the one ending in negative 1. The last terms of the two brackets are 1 and negative $a$, and 1 times negative $a$ is negative $a$, not negative 1.'
      B: 'You went for the one with $3ax$ as the $x$ term. That forgets $x$ times 1 from the first bracket. The $x$ terms are $x$ plus $3ax$, which is 1 plus $3a$, times $x$.'
      D: 'You went for plus 3 plus $a$, times $x$ squared. Both $x$ squared terms, negative $3x$ squared and negative $ax$ squared, are negative, so the bracket takes a minus sign.'

  13:
    moments:
      - section: 'The question'
        say: 'Negative numbers, squares and two letters make a minefield for signs. Factorise first, and most of the danger disappears before we put any number in.'
        write: '$\dfrac{xy^{2} - x^{2}y}{x^{2} - xy}$, $x = -2,\ y = 3$'
      - section: 'Solution'
        say: 'With an algebraic fraction, we factorise the numerator and the denominator first, then cancel, then substitute.'
        write: 'Solution'
      - say: 'Numerator. Both terms contain $xy$, so take it out. $xy$ squared divided by $xy$ is $y$, and $x$ squared $y$ divided by $xy$ is $x$.'
        write: 'Numerator: $xy^{2} - x^{2}y = xy(y - x)$'
      - say: 'Denominator. Both terms contain $x$, so take it out, leaving $x$ minus $y$.'
        write: 'Denominator: $x^{2} - xy = x(x - y)$'
      - say: 'Put the factorised forms back into the fraction.'
        write: '$= \dfrac{xy(y - x)}{x(x - y)}$'
      - say: 'Cancel the common factor $x$, top and bottom.'
        write: '$= \dfrac{y(y - x)}{x - y}$'
      - say: 'The brackets are not the same yet. $y$ minus $x$ is the negative of $x$ minus $y$, because when you change the order of a subtraction the sign changes.'
        write: '$y - x = -(x - y)$'
      - say: 'So replace $y$ minus $x$ on top with negative, $x$ minus $y$.'
        write: '$= \dfrac{-y(x - y)}{x - y}$'
      - say: 'Now the brackets are the same. Cancel the common factor $x$ minus $y$, and negative $y$ is left.'
        write: '$= -y$'
        point:
          - {line: 7, kind: strike, at: '−y([[x−y]])', text: 'cancel'}
          - {line: 7, kind: strike, at: '= [[x−y]]'}
      - say: 'Substitute $y$ equals 3.'
        write: '$= -(3) = -3$'
      - say: 'Therefore the value is negative 3.'
        write: '$\therefore$ Value $= -3$'
      - section: 'Check'
        say: 'Check by substituting straight into the question. The numerator is negative 2 times 3 squared, minus negative 2 squared times 3.'
        write: 'Numerator $= (-2)(9) - (4)(3)$'
      - say: 'Negative 2 times 9 is negative 18, and 4 times 3 is 12. Negative 18 minus 12 is negative 30.'
        write: '$= -18 - 12 = -30$'
      - say: 'In the denominator, negative 2 squared is 4. Minus negative 2 times 3 is minus negative 6, which is plus 6. So 10.'
        write: 'Denominator $= 4 - (-6) = 10$'
      - say: 'Negative 30 over 10 is negative 3. Both ways agree.'
        write: '$\dfrac{-30}{10} = -3\ \checkmark$'
      - say: 'So the value is negative 3, which is option A.'
        write: '$\therefore -3$ (A)'
        answer: true
    traps:
      B: 'You went for negative 3 over 5. That is $y$ over $x$ minus $y$, 3 over negative 5. It comes from cancelling $y$ minus $x$ on top as if it were nothing. A bracket cancels only with an identical bracket.'
      C: 'You went for 3 over 5. Both the sign and the size are off. The numerator is negative 30 and the denominator is 10, so the value is negative 3.'
      D: 'You went for positive 3. That comes from cancelling $y$ minus $x$ with $x$ minus $y$ as if they were equal. They are negatives of each other, so a minus sign is left: negative $y$, which is negative 3.'

  14:
    moments:
      - section: 'The question'
        say: 'A car goes $p$ kilometres from Calabar to Enugu at $u$ kilometres per hour, then $q$ kilometres on to Benin at $w$ kilometres per hour. We want its average speed from Calabar to Benin.'
        write: 'Average speed, Calabar to Benin $= ?$'
      - section: 'Solution'
        say: 'Solution. Let me draw the route in its two legs, with each distance and speed on it.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: 'p km'}
          - {figure: sketch, kind: underline, target: 'q km'}
      - say: 'The givens. The first leg is $p$ kilometres at $u$ kilometres per hour. The second leg is $q$ kilometres at $w$ kilometres per hour.'
        write: 'Leg 1: $p$ km at $u$ km/h; Leg 2: $q$ km at $w$ km/h'
        doodle: {name: 'custom:1991_q14_a', id: dials, caption: 'two legs, two speeds'}
      - section: 'The times'
        say: 'Time is distance over speed. The first leg takes $p$ over $u$ hours.'
        write: 'Time $= \dfrac{\text{distance}}{\text{speed}}$; $\ t_{1} = \dfrac{p}{u}$'
        doodle_do:
          - {id: dials, op: label, part: t1, text: 'p/u hours'}
        point:
          - {figure: sketch, kind: circle, target: 'u km/h', text: 'p/u hours'}
      - say: 'The second leg takes $q$ over $w$ hours.'
        write: '$t_{2} = \dfrac{q}{w}$'
        doodle_do:
          - {id: dials, op: label, part: t2, text: 'q/w hours'}
        point:
          - {figure: sketch, kind: circle, target: 'w km/h', text: 'q/w hours'}
      - say: 'The total distance is $p$ plus $q$ kilometres.'
        write: 'Total distance $= p + q$'
        point:
          - {figure: sketch, kind: circle, target: Benin, text: 'p + q km'}
      - say: 'The total time is $p$ over $u$ plus $q$ over $w$. The L.C.M. of $u$ and $w$ is $uw$.'
        write: 'Total time $= \dfrac{p}{u} + \dfrac{q}{w}$'
      - say: '$uw$ divided by $u$ is $w$, times $p$ is $pw$. $uw$ divided by $w$ is $u$, times $q$ is $qu$.'
        write: '$= \dfrac{pw + qu}{uw}$'
      - section: 'Average speed'
        say: 'Average speed is total distance over total time, never the average of the two speeds, because the car spends different times on the two legs.'
        write: 'Average speed $= \dfrac{\text{total distance}}{\text{total time}}$'
      - say: 'Substitute, so $p$ plus $q$, divided by $pw$ plus $qu$ over $uw$.'
        write: '$= (p + q) \div \dfrac{pw + qu}{uw}$'
      - say: 'Dividing by a fraction is multiplying by its reciprocal, so turn $pw$ plus $qu$ over $uw$ upside down.'
        write: '$= (p + q) \times \dfrac{uw}{pw + qu}$'
      - say: 'Multiply out, and write the bottom the way the options do, as $wp$ plus $uq$.'
        write: '$\therefore$ Average speed $= \dfrac{uw(p + q)}{wp + uq}$'
      - section: 'Check'
        say: 'Check with numbers. If both legs are 60 kilometres at 30 kilometres per hour, the average must be 30. The formula gives 30 times 30 times 120, over 1800 plus 1800.'
        write: 'Check: $\dfrac{30 \times 30 \times 120}{1800 + 1800} = \dfrac{108\,000}{3600} = 30$ ✓'
      - section: 'Answer'
        say: 'So the average speed is $uw$ times $p$ plus $q$, over $wp$ plus $uq$, which is option C.'
        write: '$\therefore$ Average speed $= \dfrac{uw(p + q)}{wp + uq}$ km/h'
        answer: true
    traps:
      A: 'You went for $p$ plus $q$ over $up$ plus $wq$. Speed times distance is not a time. The time for each leg is distance over speed: $p$ over $u$ and $q$ over $w$.'
      B: 'You went for $u$ plus $w$, adding the two speeds. With both speeds 30 km/h that gives 60, which is impossible. Use total distance over total time.'
      D: 'You went for $wp$ plus $uq$ over $u$ plus $wq$. That is not total distance over total time. The total time is $pw$ plus $qu$ over $uw$, and $p$ plus $q$ divided by it gives option C.'

  15:
    moments:
      - section: 'The question'
        say: '$w$ varies inversely as $uv$ over $u$ plus $v$, and $w$ is 8 when $u$ is 2 and $v$ is 6. We want the equation linking all three.'
        write: '$w = 8$ when $u = 2,\ v = 6$'
      - say: 'Solution. The variation statement says $w$ is proportional to 1 over that whole fraction.'
        write: 'Solution: $\ w \propto \dfrac{1}{\;\frac{uv}{u + v}\;}$'
      - say: 'Replace the sign with the constant $k$. Picture a see-saw, where as one side goes up, the other comes down.'
        doodle: {name: 'custom:1991_q15_a', id: seesaw, caption: 'one goes up, the other down'}
        write: '$\therefore\ w = \dfrac{k}{\;\frac{uv}{u + v}\;}$'
      - say: 'Dividing by a fraction is multiplying by its reciprocal. So $w$ equals $k$ times $u$ plus $v$, over $uv$.'
        write: '$w = \dfrac{k(u + v)}{uv}$'
      - section: 'Find k'
        say: 'Substitute the given values. $w$ is 8, $u$ is 2 and $v$ is 6.'
        write: 'When $w = 8,\ u = 2,\ v = 6$: $\ 8 = \dfrac{k(2 + 6)}{2 \times 6}$'
      - say: '2 plus 6 is 8, and 2 times 6 is 12.'
        write: '$8 = \dfrac{8k}{12}$'
      - say: 'Cross multiply. 8 times 12 is 96.'
        write: '$8k = 96$'
      - say: 'Divide both sides by 8. 96 divided by 8 is 12.'
        doodle_do: [{id: seesaw, op: label, part: k, text: 'k = 12'}]
        write: '$\therefore\ k = 12$'
        point:
          - {line: 7, kind: highlight, at: 'k = 12', to: {doodle: seesaw, part: k}}
      - section: 'The equation'
        say: 'Put $k$ equals 12 back into the equation.'
        write: '$w = \dfrac{12(u + v)}{uv}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '12'}, at: '12(', text: 'k'}
      - say: 'Multiply both sides by $uv$ to clear the fraction.'
        write: '$\therefore\ uvw = 12(u + v)$'
      - section: 'Check'
        say: 'Check with the given values. $uvw$ is 2 times 6 times 8, which is 96. 12 times 2 plus 6 is 12 times 8, also 96.'
        write: 'Check: $\ 2 \times 6 \times 8 = 96,\ \ 12(2 + 6) = 96\ \checkmark$'
      - say: 'So the relationship is $uvw$ equals 12 times $u$ plus $v$, and that is option C.'
        write: '$uvw = 12(u + v)$'
        answer: true
    traps:
      A: 'You went for $uvw$ equals 16 times $u$ plus $v$. The form is right, but the constant is not. With the given values, $uvw$ is 96 and $u$ plus $v$ is 8, so the constant is 96 over 8, which is 12.'
      B: 'You went for 16 $uv$ equals 3 $w$ times $u$ plus $v$. It fits the one set of values, but it says $w$ varies directly as $uv$ over $u$ plus $v$. The question says inversely.'
      D: 'You went for 12 $uvw$ equals $u$ plus $v$. The 12 is on the wrong side. With the given values, 12 times 96 is not 8. It should be $uvw$ equals 12 times $u$ plus $v$.'

  16:
    moments:
      - section: 'The question'
        say: 'Think of $g$ as a machine. Feed it $x$ plus 1 instead of $x$, and how much more comes out? Most slips here come from squaring $x$ plus 1.'
        write: '$g(x) = x^{2} + 3x$'
        doodle: {name: 'custom:1991_q16_a', id: machine, caption: 'the machine g'}
      - section: 'Solution'
        say: 'First find $g$ of $x$ plus 1, then subtract $g$ of $x$.'
        write: 'Solution'
      - say: 'Replace every $x$ in the rule with the whole bracket, $x$ plus 1. That is what goes into the machine.'
        write: '$g(x + 1) = (x + 1)^{2} + 3(x + 1)$'
        doodle_do:
          - {id: machine, op: circle, part: in}
      - say: 'Open the first bracket. $x$ plus 1, squared, is $x$ plus 1 times $x$ plus 1, which gives $x$ squared plus $x$ plus $x$ plus 1. Don''t lose the middle term.'
        write: '$(x + 1)^{2} = x^{2} + 2x + 1$'
      - say: 'Open the second bracket. 3 times $x$ plus 1 is $3x$ plus 3.'
        write: '$3(x + 1) = 3x + 3$'
      - say: 'Put the two pieces together.'
        write: '$g(x + 1) = x^{2} + 2x + 1 + 3x + 3$'
      - say: 'Collect like terms. $2x$ plus $3x$ is $5x$, and 1 plus 3 is 4. That is what comes out of the machine.'
        write: '$= x^{2} + 5x + 4$'
        doodle_do:
          - {id: machine, op: label, part: out, text: 'x² + 5x + 4'}
      - section: 'Subtract g(x)'
        say: 'Now subtract $g$ of $x$, $x$ squared plus $3x$. Keep it in a bracket, so the minus reaches both terms.'
        write: '$g(x + 1) - g(x)$'
        doodle_do:
          - {id: machine, op: stage, stage: 'custom:1991_q16_a2'}
      - say: 'Put in both expressions, each in its bracket.'
        write: '$= (x^{2} + 5x + 4) - (x^{2} + 3x)$'
      - say: 'Open the brackets. The minus sign changes both signs in the second bracket.'
        write: '$= x^{2} + 5x + 4 - x^{2} - 3x$'
      - say: 'Collect like terms. $x$ squared minus $x$ squared is zero. $5x$ minus $3x$ is $2x$. The 4 stays.'
        write: '$= 2x + 4$'
        doodle_do:
          - {id: machine, op: label, part: minus, text: 'leaves 2x + 4'}
      - say: 'Take out the common factor 2. Therefore $g$ of $x$ plus 1, minus $g$ of $x$, is 2 times $x$ plus 2.'
        write: '$\therefore g(x + 1) - g(x) = 2(x + 2)$'
      - section: 'Check'
        say: 'Check with $x$ equals 1. $g$ of 2 is 4 plus 6, which is 10. $g$ of 1 is 1 plus 3, which is 4. 10 minus 4 is 6.'
        write: '$g(2) - g(1) = 10 - 4 = 6$'
      - say: 'And 2 times, 1 plus 2, is 2 times 3, which is 6. It matches.'
        write: '$2(1 + 2) = 6\ \checkmark$'
      - say: 'So the answer is 2 times $x$ plus 2, which is option B.'
        write: '$\therefore 2(x + 2)$ (B)'
        answer: true
    traps:
      A: 'You went for $x$ plus 2. That is half the answer. It comes from squaring $x$ plus 1 as $x$ squared plus 1 and losing the middle term $2x$.'
      C: 'You went for $2x$ plus 1. That is only the change in the $x$ squared part. The $3x$ part changes too: 3 times $x$ plus 1, minus $3x$, adds another 3, giving $2x$ plus 4.'
      D: 'You went for $x$ plus 4. Check the $x$ terms: $2x$ plus $3x$ is $5x$, and $5x$ minus $3x$ leaves $2x$, not $x$. The answer is $2x$ plus 4.'

  17:
    moments:
      - section: 'The question'
        say: 'Four terms, and nothing common to all four. The trick is grouping into two pairs that turn out to share the same bracket. Picture each pair as a rectangle.'
        write: '$m^{3} - m^{2} + 2m - 2$'
        doodle: {name: 'custom:1991_q17_a', id: rects, caption: 'two rectangles, one width'}
      - section: 'Solution'
        say: 'We factorise by grouping, so the first two terms go together, and the last two together.'
        write: 'Solution'
      - say: 'Group in pairs.'
        write: '$= (m^{3} - m^{2}) + (2m - 2)$'
      - say: 'From the first pair take out $m$ squared, leaving $m$ minus 1, the tall rectangle. From the second pair take out 2, leaving $m$ minus 1 again, the short one. Both brackets are the same.'
        write: '$= m^{2}(m - 1) + 2(m - 1)$'
        doodle_do:
          - {id: rects, op: label, part: r1, text: 'm²(m − 1)'}
          - {id: rects, op: label, part: r2, text: '2(m − 1)'}
      - say: 'Take out the common bracket, $m$ minus 1. Watch the short rectangle slide onto the tall one, and what is left is $m$ squared plus 2.'
        write: '$= (m - 1)(m^{2} + 2)$'
        doodle_do:
          - {id: rects, op: move, part: r2, path: join}
          - {id: rects, op: label, part: r1, text: '(m − 1)(m² + 2)'}
        point:
          - {line: 4, kind: move, from: {line: 3, at: 'm2[[(m−1)]]'}, at: '(m−1)', text: 'taken out'}
      - say: '$m$ squared plus 2 cannot be factorised further, because $m$ squared is never negative, so $m$ squared plus 2 is never zero. Therefore these are the factors.'
        write: '$\therefore$ Factors: $(m^{2} + 2)(m - 1)$'
      - section: 'Check'
        say: 'Check by expanding. $m$ squared times $m$ is $m$ cubed, $m$ squared times negative 1 is negative $m$ squared, 2 times $m$ is $2m$, and 2 times negative 1 is negative 2.'
        write: '$(m^{2} + 2)(m - 1)$'
      - say: 'That is exactly the expression we started with.'
        write: '$= m^{3} - m^{2} + 2m - 2\ \checkmark$'
      - say: 'So the factorisation is $m$ squared plus 2, times $m$ minus 1, which is option D.'
        write: '$\therefore (m^{2} + 2)(m - 1)$ (D)'
        answer: true
    traps:
      A: 'You went for $m$ squared plus 1, times $m$ minus 2. Expanding it gives $m$ cubed minus $2m$ squared plus $m$ minus 2, which has the wrong middle terms. Expanding back is your safety net.'
      B: 'You went for $m$ plus 1, times $m$ plus 1, times $m$ plus 2. Every term there is positive, so it expands with plus $m$ squared, but our expression has minus $m$ squared. Group in pairs instead.'
      C: 'You went for $m$ plus 1, times $m$ plus 1, times $m$ minus 2. If $m$ minus 2 were a factor, putting $m$ equals 2 would give zero. But 8 minus 4 plus 4 minus 2 is 6, not zero.'

  18:
    moments:
      - section: 'The question'
        say: 'Factorise 1 minus, $a$ minus $b$, squared. Three options look almost the same, and the whole question is one sign. Picture a 1 by 1 square with a corner cut away.'
        write: '$1 - (a - b)^{2}$'
        doodle: {name: 'custom:1991_q18_a', id: square, caption: '1 squared, minus a corner B squared'}
      - section: 'Solution'
        say: '1 is 1 squared, so this is one square minus another square, which makes it a difference of two squares.'
        write: 'Solution'
      - say: 'Write the 1 as 1 squared.'
        write: '$= 1^{2} - (a - b)^{2}$'
      - say: 'The rule for a difference of two squares is that $A$ squared minus $B$ squared equals $A$ minus $B$, times $A$ plus $B$. The L-shape that is left re-cuts into a rectangle.'
        write: '$A^{2} - B^{2} = (A - B)(A + B)$'
        doodle_do:
          - {id: square, op: stage, stage: 'custom:1991_q18_a2'}
      - say: 'Here $A$ is 1 and $B$ is $a$ minus $b$.'
        write: '$A = 1,\ B = a - b$'
      - say: 'Substitute, keeping $B$ in its own bracket.'
        write: '$= [1 - (a - b)][1 + (a - b)]$'
        point:
          - {line: 3, kind: box, text: 'the rule'}
      - say: 'Open the first inner bracket. The minus sign in front changes both signs, giving 1 minus $a$ plus $b$.'
        write: '$1 - (a - b) = 1 - a + b$'
      - say: 'Open the second. A plus sign in front changes nothing, so we get 1 plus $a$ minus $b$.'
        write: '$1 + (a - b) = 1 + a - b$'
      - say: 'Therefore the factors are 1 minus $a$ plus $b$, and 1 plus $a$ minus $b$, which are the two sides of the rectangle.'
        write: '$\therefore$ Factors: $(1 - a + b)(1 + a - b)$'
        doodle_do:
          - {id: square, op: circle, part: rect}
      - section: 'Check'
        say: 'Check with $a$ equals 3 and $b$ equals 1. In the question, 1 minus, 3 minus 1, squared, is 1 minus 4, which is negative 3.'
        write: '$a = 3,\ b = 1$: $1 - (2)^{2} = -3$'
      - say: 'In our factors, 1 minus 3 plus 1 is negative 1, and 1 plus 3 minus 1 is 3. Negative 1 times 3 is negative 3. It matches.'
        write: '$(1 - 3 + 1)(1 + 3 - 1) = -3\ \checkmark$'
      - say: 'So the factorisation is option B.'
        write: '$\therefore (1 - a + b)(1 + a - b)$ (B)'
        answer: true
    traps:
      A: 'You went for the same bracket twice, 1 minus $a$ minus $b$. A difference of two squares gives two different brackets, and the minus in front of $a$ minus $b$ turns minus $b$ into plus $b$.'
      C: 'You went for 1 minus $a$ plus $b$, twice. That is a perfect square, which is never negative, but with $a$ equals 3 and $b$ equals 1 the question gives negative 3. The second bracket is 1 plus $a$ minus $b$.'
      D: 'You went for 1 minus $a$ minus $b$, times 1 plus $a$ minus $b$. The second bracket is right, but in the first the minus sign in front of $a$ minus $b$ changes minus $b$ into plus $b$.'

  19:
    moments:
      - section: 'The question'
        say: 'Which of these is a factor? Four terms, four letters, and no letter common to all of them. Grouping will find it. Picture a rectangle $s$ plus $t$ wide.'
        write: '$rs + tr - pt - ps$'
        doodle: {name: 'custom:1991_q19_a', id: block, caption: 's + t wide, r tall, less p'}
      - section: 'Solution'
        say: 'We factorise by grouping. First rearrange, so the two $r$ terms sit together and the two $p$ terms sit together. $tr$ is the same as $rt$.'
        write: 'Solution'
      - say: 'Rearrange the terms.'
        write: '$= rs + rt - ps - pt$'
      - say: 'Group in pairs. Taking the minus sign outside the second bracket changes both signs inside it.'
        write: '$= (rs + rt) - (ps + pt)$'
      - say: 'From the first pair take out $r$, leaving $s$ plus $t$, the whole rectangle. From the second take out $p$, leaving $s$ plus $t$ again, which is the strip taken away. Both brackets are the same.'
        write: '$= r(s + t) - p(s + t)$'
        doodle_do:
          - {id: block, op: label, part: rblock, text: 'r(s + t)'}
          - {id: block, op: cross, part: pstrip, text: '−p(s + t)'}
      - say: 'Take out the common bracket, $s$ plus $t$. What is left is $r$ minus $p$, the height of the rectangle that remains.'
        write: '$= (r - p)(s + t)$'
        doodle_do:
          - {id: block, op: label, part: left, text: '(s + t)(r − p)'}
        point:
          - {line: 5, kind: move, from: {line: 4, at: 'r[[(s+t)]]'}, at: '(s+t)', text: 'taken out'}
      - say: 'Therefore the factors are $r$ minus $p$, and $s$ plus $t$.'
        write: '$\therefore$ Factors: $(r - p)$ and $(s + t)$'
      - section: 'Check'
        say: 'Check by expanding. $r$ times $s$ is $rs$, $r$ times $t$ is $rt$, negative $p$ times $s$ is negative $ps$, negative $p$ times $t$ is negative $pt$.'
        write: '$(r - p)(s + t) = rs + rt - ps - pt$'
      - say: 'Those are the four terms we started with.'
        write: '$= rs + tr - pt - ps\ \checkmark$'
      - say: 'Of the options, only $r$ minus $p$ is one of our factors, so the answer is option C.'
        write: '$\therefore r - p$ (C)'
        answer: true
    traps:
      A: 'You went for $p$ minus $s$. That mixes a letter from each pair. The expression factorises as $r$ minus $p$, times $s$ plus $t$.'
      B: 'You went for $s$ minus $p$. The factors are $s$ plus $t$ and $r$ minus $p$. Group the $r$ terms and the $p$ terms, then take out $r$ and $p$.'
      D: 'You went for $r$ plus $p$. That comes from forgetting the minus sign in front of the $p$ pair. The second pair is minus $p$ times $s$ plus $t$, so the factor is $r$ minus $p$.'

  20:
    moments:
      - section: 'The question'
        say: 'Two equations, two balances. Find the two values of $y$. Watch out, because the quadratic gives $x$ first, and one option is waiting for students who stop there.'
        write: '$3x + y = 8$ and $x^{2} + xy = 6$'
        doodle: {name: 'custom:1991_q20_a', id: scales, caption: 'two equations, two balances'}
      - section: 'Solution'
        say: 'One equation is linear and one is quadratic, so we use substitution. First, number the equations.'
        write: 'Solution'
      - say: 'Equation 1 is $3x$ plus $y$ equals 8.'
        write: '$3x + y = 8 \quad \text{......(1)}$'
      - say: 'Equation 2 is $x$ squared plus $xy$ equals 6.'
        write: '$x^{2} + xy = 6 \quad \text{......(2)}$'
      - say: 'Make $y$ the subject of the linear one, equation 1, by subtracting $3x$ from both sides. Call this equation 3.'
        write: 'From (1): $y = 8 - 3x \quad \text{......(3)}$'
        doodle_do:
          - {id: scales, op: highlight, part: scale1}
      - say: 'Now substitute equation 3 into equation 2, the lower balance.'
        write: 'Substitute (3) in (2):'
        doodle_do:
          - {id: scales, op: stage, stage: 'custom:1991_q20_a2'}
      - say: 'Wherever $y$ appears in equation 2, write 8 minus $3x$ in a bracket.'
        write: '$x^{2} + x(8 - 3x) = 6$'
        point:
          - {line: 6, kind: highlight, at: '(8−3x)', to: {doodle: scales, part: sub}}
      - say: 'Open the bracket. $x$ times 8 is $8x$, and $x$ times negative $3x$ is negative $3x$ squared.'
        write: '$x^{2} + 8x - 3x^{2} = 6$'
      - say: 'Collect like terms. $x$ squared minus $3x$ squared is negative $2x$ squared.'
        write: '$-2x^{2} + 8x = 6$'
      - say: 'Subtract 6 from both sides, so the right-hand side is zero.'
        write: '$-2x^{2} + 8x - 6 = 0$'
      - say: 'Divide every term by negative 2. Every sign changes, and the numbers get smaller.'
        write: '$x^{2} - 4x + 3 = 0$'
      - section: 'Factorise'
        say: 'Here $a$ is 1, $b$ is negative 4, $c$ is 3. The product is $ac$, 3. The sum is $b$, negative 4.'
        write: 'Product $= ac = 3$, Sum $= b = -4$'
      - say: 'We want two numbers that multiply to 3 and add to negative 4, and they are negative 3 and negative 1.'
        write: 'Factors: $-3$ and $-1$'
      - say: 'Replace negative $4x$ with negative $3x$ minus $x$.'
        write: '$x^{2} - 3x - x + 3 = 0$'
      - say: 'Group in pairs. From the first take out $x$, and from the second take out negative 1. Both brackets are $x$ minus 3.'
        write: '$x(x - 3) - 1(x - 3) = 0$'
      - say: 'Take out the common bracket, $x$ minus 3. What is left is $x$ minus 1.'
        write: '$(x - 3)(x - 1) = 0$'
      - say: 'Either the first bracket is zero or the second one is.'
        write: 'Either $x - 3 = 0$ or $x - 1 = 0$'
      - say: 'Therefore $x$ equals 3 or $x$ equals 1. But these are values of $x$. The question wants $y$.'
        write: '$\therefore x = 3$ or $x = 1$'
      - section: 'Find y'
        say: 'Use equation 3. When $x$ is 3, $y$ is 8 minus 3 times 3, which is 8 minus 9, negative 1.'
        write: 'When $x = 3$: $y = 8 - 3(3) = -1$'
        point:
          - {line: 18, kind: move, from: {line: 4, at: 'y=8−3x'}, at: '8−3(3)', text: 'equation (3)'}
      - say: 'When $x$ is 1, $y$ is 8 minus 3 times 1, which is 5.'
        write: 'When $x = 1$: $y = 8 - 3(1) = 5$'
      - say: 'Therefore $y$ equals negative 1 or $y$ equals 5.'
        write: '$\therefore y = -1$ or $y = 5$'
      - section: 'Check'
        say: 'Check each pair in equation 2. With $x$ equals 3 and $y$ equals negative 1, 9 plus 3 times negative 1 is 9 minus 3, which is 6.'
        write: '$(3)^{2} + (3)(-1) = 9 - 3 = 6\ \checkmark$'
      - say: 'With $x$ equals 1 and $y$ equals 5, 1 plus 1 times 5 is 6. Both balances stay level.'
        write: '$(1)^{2} + (1)(5) = 1 + 5 = 6\ \checkmark$'
      - say: 'So the two values of $y$ are negative 1 and 5, option A.'
        write: '$\therefore y = -1, 5$ (A)'
        doodle_do:
          - {id: scales, op: label, text: 'y = −1 and y = 5'}
        answer: true
    traps:
      B: 'You went for negative 5 and 1. Both signs are flipped. With $x$ equals 1, $y$ is 8 minus 3, which is positive 5; with $x$ equals 3, $y$ is 8 minus 9, which is negative 1.'
      C: 'You went for 1 and 5. The 1 is a value of $x$, not $y$. Put $x$ equals 3 into equation 3 to get the other $y$, which is negative 1.'
      D: 'You went for 1 and 1. Those look like values of $x$ rather than $y$. The $x$ values are 3 and 1, and equation 3 turns them into $y$ equals negative 1 and 5.'

  21:
    moments:
      - section: 'The question'
        say: 'Three fractions of $x$ add up to less than 1. Clear all three in one move with the L.C.M., and the inequality becomes easy.'
        write: '$\dfrac{x}{2} + \dfrac{x}{3} + \dfrac{x}{4} < 1$'
      - say: 'Solution. The denominators are 2, 3 and 4. The L.C.M. is 12, the smallest number they all divide into.'
        write: 'Solution: L.C.M. of 2, 3, 4 $= 12$'
      - say: 'Multiply every term by 12. 12 is positive, so the sign stays.'
        write: '$12 \times \dfrac{x}{2} + 12 \times \dfrac{x}{3} + 12 \times \dfrac{x}{4} < 12 \times 1$'
      - say: '12 over 2 is 6, 12 over 3 is 4, and 12 over 4 is 3.'
        write: '$6x + 4x + 3x < 12$'
      - say: '6 plus 4 plus 3 is 13.'
        write: '$13x < 12$'
      - say: 'Divide both sides by 13. It is positive, so the sign stays.'
        write: '$\therefore\ x < \dfrac{12}{13}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '[[13]]x'}, at: '[[13]]12', text: 'divide'}
      - section: 'The number line'
        say: 'On a number line, 12 over 13 is just under 1. Put an open circle there, because it is not included, and an arrow to the left.'
        diagram: {id: n, kind: numberline, range: [-2, 2]}
        diagram_do:
          - {id: n, op: interval, to: 0.923, to_open: true, text: 'x < 12/13', answer: true, 'on': 'open circle'}
      - section: 'Check'
        say: 'Check at the boundary. A half plus a third plus a quarter is 6 over 12 plus 4 over 12 plus 3 over 12, which is 13 over 12.'
        write: 'Check: $\ \tfrac{1}{2} + \tfrac{1}{3} + \tfrac{1}{4} = \tfrac{6 + 4 + 3}{12} = \tfrac{13}{12}$'
      - say: 'So at $x$ equals 12 over 13, the left side is 12 over 13 times 13 over 12, exactly 1. Any smaller $x$ gives less than 1.'
        write: '$\tfrac{12}{13} \times \tfrac{13}{12} = 1\ \checkmark$'
      - say: 'So $x$ is less than 12 over 13, which is option A.'
        write: '$x < \tfrac{12}{13}$'
        answer: true
    traps:
      B: 'You went for $x$ less than 13. Multiplying by 12 gives $13x$ less than 12, so we divide 12 by 13. The 13 multiplies $x$; it is not the bound.'
      C: 'You went for $x$ less than 9. Clearing the fractions with 12 gives 6 plus 4 plus 3, which is $13x$ less than 12, so $x$ is less than 12 over 13.'
      D: 'You went for $x$ less than 13 over 12, the fraction upside down. From $13x < 12$, divide 12 by 13, which gives 12 over 13.'

  22:
    moments:
      - section: 'The question'
        say: 'A word problem. Turn the sentence into an equation, phrase by phrase. Many students divide by $n$ and lose a root, so we factorise instead.'
        write: 'Thrice its square $=$ twelve times the number; $\ n > 0$'
      - section: 'Solution'
        say: 'Solution. Let the number be $n$.'
        write: 'Solution. Let the number be $n$'
        doodle: {name: 'custom:1991_q22_a', id: shapes, caption: '3 squares and 12 strips'}
      - say: '"Thrice its square" is 3 times $n$ squared, because the square belongs to $n$, and the 3 multiplies it. "Twelve times the number" is $12n$.'
        write: '$3n^{2} = 12n$'
        doodle_do:
          - {id: shapes, op: highlight, part: squares}
      - say: 'Bring every term to one side, so the right-hand side is zero. Subtract $12n$ from both sides.'
        write: '$3n^{2} - 12n = 0$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '= 12n'}, at: '− 12n', text: 'across the ='}
      - say: 'Both terms contain $3n$, so take it out as a common factor. $3n$ squared over $3n$ is $n$, and $12n$ over $3n$ is 4.'
        write: '$3n(n - 4) = 0$'
      - say: 'A product is zero only when one factor is zero. So either $3n$ is zero, or $n$ minus 4 is zero.'
        write: 'Either $3n = 0$ or $n - 4 = 0$'
      - say: 'So $n$ is zero, or $n$ is 4.'
        write: '$n = 0$ or $n = 4$'
      - say: 'The number must be positive, so zero is rejected. With $n$ equal to 4, each square cuts into exactly 4 strips.'
        write: '$n > 0$, $\ \therefore n = 4$'
        doodle_do:
          - {id: shapes, op: stage, stage: 'custom:1991_q22_a2'}
          - {id: shapes, op: label, part: squares, text: 'n = 4: 4 strips each'}
        point:
          - {line: 6, kind: strike, at: 'n = 0', text: 'not positive'}
      - section: 'Check'
        say: 'To check, 4 squared is 16, and thrice 16 is 48. Twelve times 4 is also 48.'
        write: 'Check: $3(4)^{2} = 48,\ \ 12(4) = 48\ \checkmark$'
      - say: 'Therefore the number is 4, which is option D.'
        write: '$\therefore n = 4$'
        answer: true
    traps:
      A: 'You went for 1. Check it: thrice 1 squared is 3, but twelve times 1 is 12. They are not equal. $3n(n - 4) = 0$ gives $n = 4$.'
      B: 'You went for 2. Thrice 2 squared is 12, but twelve times 2 is 24. Not equal. Factorising $3n^{2} - 12n$ gives $n = 4$.'
      C: 'You went for 3. Thrice 3 squared is 27, but twelve times 3 is 36. Not equal. Either $3n = 0$ or $n - 4 = 0$, and the positive root is 4.'

  23:
    moments:
      - section: 'The question'
        say: 'Solve $x$ minus 2, times $x$ minus 3, equals 12. It looks factorised already, and that is the trap. Picture a rectangle of area 12.'
        write: '$(x - 2)(x - 3) = 12$'
        doodle: {name: 'custom:1991_q23_a', id: rect, caption: 'a rectangle of area 12'}
      - section: 'Solution'
        say: 'We can only put each bracket equal to zero when the right-hand side is zero. Here it is 12, so first we open the brackets.'
        write: 'Solution'
        point:
          - {line: 0, kind: underline, at: '= 12', text: 'not 0', 'on': 'right-hand side'}
      - say: 'Open the brackets. $x$ times $x$ is $x$ squared, $x$ times negative 3 is negative $3x$, negative 2 times $x$ is negative $2x$, negative 2 times negative 3 is plus 6.'
        write: '$x^{2} - 3x - 2x + 6 = 12$'
      - say: 'Collect like terms, so negative $3x$ minus $2x$ is negative $5x$. Then subtract 12 from both sides, so the right-hand side is zero.'
        write: '$x^{2} - 5x + 6 - 12 = 0$'
      - say: '6 minus 12 is negative 6.'
        write: '$x^{2} - 5x - 6 = 0$'
        doodle_do:
          - {id: rect, op: pulse, part: area}
      - section: 'Factorise'
        say: 'Now factorise. Here $a$ is 1, $b$ is negative 5 and $c$ is negative 6. The product is $a$ times $c$, negative 6. The sum is $b$, negative 5.'
        write: 'Product $= ac = -6$, Sum $= b = -5$'
      - say: 'We need two numbers that multiply to negative 6 and add to negative 5. They are negative 6 and plus 1, because negative 6 times 1 is negative 6, and negative 6 plus 1 is negative 5.'
        write: 'Factors: $-6$ and $+1$'
      - say: 'Replace the middle term, negative $5x$, with negative $6x$ plus $x$.'
        write: '$x^{2} - 6x + x - 6 = 0$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '−6'}, at: '−6x', text: '−5x split'}
      - say: 'Group in pairs. From the first pair take out $x$, and from the second pair take out 1. Both brackets are $x$ minus 6, so we are on the right track.'
        write: '$x(x - 6) + 1(x - 6) = 0$'
      - say: 'Take out the common bracket, $x$ minus 6. What is left is $x$ plus 1.'
        write: '$(x - 6)(x + 1) = 0$'
      - section: 'Solve'
        say: 'Now the right-hand side is zero, so either the first bracket is zero or the second one is.'
        write: 'Either $x - 6 = 0$ or $x + 1 = 0$'
      - say: 'Therefore $x$ equals 6 or $x$ equals negative 1.'
        write: '$\therefore x = 6$ or $x = -1$'
      - section: 'Check'
        say: 'Check $x$ equals negative 1 in the question. Negative 1 minus 2 is negative 3, and negative 1 minus 3 is negative 4. Negative 3 times negative 4 is 12.'
        write: '$x = -1$: $(-3)(-4) = 12\ \checkmark$'
      - say: 'Check $x$ equals 6. 6 minus 2 is 4 and 6 minus 3 is 3. On the rectangle, that is 4 by 3, and 4 times 3 is 12.'
        write: '$x = 6$: $(4)(3) = 12\ \checkmark$'
        doodle_do:
          - {id: rect, op: stage, stage: 'custom:1991_q23_a2'}
          - {id: rect, op: label, part: top, text: '4'}
          - {id: rect, op: label, part: side, text: '3'}
        point:
          - {line: 13, kind: highlight, at: '(4)(3)', to: {doodle: rect, part: area}}
      - say: 'So $x$ is negative 1 or 6, and that is option C.'
        write: '$\therefore x = -1, 6$ (C)'
        answer: true
    traps:
      A: 'You went for 2 and 3. They make each bracket zero, but that only works when the right-hand side is zero. Here it is 12: at $x$ equals 2 the product is 0 times negative 1, which is 0, not 12.'
      B: 'You went for 3 and 6. The 6 is right, but at $x$ equals 3 the second bracket is zero, so the product is 0, not 12. The factors are $x$ minus 6 and $x$ plus 1, so the other root is negative 1.'
      D: 'You went for 1 and 6. The 6 is right, but the factor is $x$ plus 1, so $x$ plus 1 equals 0 gives negative 1, not 1. At $x$ equals 1 the product is negative 1 times negative 2, which is 2.'

  24:
    moments:
      - section: 'The question'
        say: 'Letters under the roots, but the method is the same as with numbers. And here the conjugate of the denominator is exactly the numerator.'
        write: 'Simplify $\dfrac{\sqrt{1 + x} + \sqrt{x}}{\sqrt{1 + x} - \sqrt{x}}$'
      - say: 'Solution. Multiply the numerator and the denominator by the conjugate of the denominator.'
        write: 'Solution'
      - section: 'The conjugate'
        say: 'The conjugate of root of 1 plus $x$, minus root $x$, is root of 1 plus $x$, plus root $x$, which is the same terms with the sign changed.'
        write: 'Conjugate of $\sqrt{1 + x} - \sqrt{x}$ is $\sqrt{1 + x} + \sqrt{x}$'
      - say: 'Multiply the numerator and the denominator by it. Something over itself is 1, so the value does not change.'
        write: '$= \dfrac{(\sqrt{1 + x} + \sqrt{x})(\sqrt{1 + x} + \sqrt{x})}{(\sqrt{1 + x} - \sqrt{x})(\sqrt{1 + x} + \sqrt{x})}$'
      - section: 'The denominator'
        say: 'The denominator is a difference of two squares, and $a$ minus $b$, times $a$ plus $b$, is $a$ squared minus $b$ squared.'
        write: '$(a - b)(a + b) = a^{2} - b^{2}$'
      - say: 'Here $a$ is root of 1 plus $x$, and $b$ is root $x$.'
        write: 'Denominator $= (\sqrt{1 + x})^{2} - (\sqrt{x})^{2}$'
      - say: 'Squaring a square root removes the root. So this is 1 plus $x$, minus $x$, which is 1.'
        write: '$= (1 + x) - x = 1$'
      - section: 'The numerator'
        say: 'The numerator is the same bracket times itself, so it is a square.'
        write: 'Numerator $= (\sqrt{1 + x} + \sqrt{x})^{2}$'
      - say: 'To square a sum, $a$ plus $b$, all squared, is $a$ squared plus $2ab$ plus $b$ squared.'
        write: '$(a + b)^{2} = a^{2} + 2ab + b^{2}$'
      - say: 'The first squared is 1 plus $x$. Twice the product is 2 root $x$ times root of 1 plus $x$. The last squared is $x$.'
        write: '$= (1 + x) + 2\sqrt{x}\sqrt{1 + x} + x$'
      - say: 'By the law of surds, root $x$ times root of 1 plus $x$ is root of $x$ times 1 plus $x$. And $x$ plus $x$ is $2x$.'
        write: '$= 1 + 2x + 2\sqrt{x(1 + x)}$ $\quad [\sqrt{a}\sqrt{b} = \sqrt{ab}]$'
      - section: 'Divide'
        say: 'Put the numerator over the denominator. The denominator is 1, and dividing by 1 changes nothing.'
        write: '$\therefore$ Fraction $= 1 + 2x + 2\sqrt{x(1 + x)}$'
      - section: 'Check'
        say: 'Check with $x$ equal to 1. The question becomes root 2 plus 1, over root 2 minus 1. That is 2.414 over 0.414, about 5.83.'
        write: 'Check, $x = 1$: $\dfrac{\sqrt{2} + 1}{\sqrt{2} - 1} = \dfrac{2.414}{0.414} \approx 5.83$'
      - say: 'Our answer at $x$ equal to 1 is 1 plus 2 plus 2 root 2, which is 3 plus 2.83, or 5.83. It agrees.'
        write: '$1 + 2 + 2\sqrt{2} \approx 3 + 2.83 = 5.83\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the fraction simplifies to 1 plus $2x$ plus 2 root of $x$ times 1 plus $x$, which is option B.'
        write: '$\therefore$ the answer is $1 + 2x + 2\sqrt{x(1 + x)}$'
        answer: true
    traps:
      A: 'You went for 1 minus $2x$ minus 2 root of $x$ times 1 plus $x$. Every term in the square of a sum is positive: 1 plus $x$, plus the middle term, plus $x$.'
      C: 'You went for root of $x$ times 1 plus $x$. That is only part of the middle term. Squaring the numerator gives 1 plus $x$, plus 2 root of $x$ times 1 plus $x$, plus $x$.'
      D: 'You went for the one with a minus before the surd. That comes from multiplying by the denominator instead of its conjugate. At $x$ equal to 1 it gives about 0.17, far too small. The conjugate has a plus sign.'

  25:
    moments:
      - section: 'The question'
        say: 'One term has a negative index, the other a fractional one. Change the negative index into a fraction, and this becomes an ordinary subtraction of fractions.'
        write: 'Simplify $x^{2}(x^{2} - 1)^{-\frac{1}{2}} - (x^{2} - 1)^{\frac{1}{2}}$'
      - say: 'Solution. We start with the negative index.'
        write: 'Solution'
      - section: 'The negative index'
        say: 'The law of indices for a negative index tells us that $a$ to the power negative $n$ is 1 over $a$ to the power $n$.'
        write: 'Law of indices: $a^{-n} = \dfrac{1}{a^{n}}$'
      - say: 'So $x$ squared minus 1, to the power negative 1 over 2, goes under the line as $x$ squared minus 1 to the power 1 over 2.'
        write: '$= \dfrac{x^{2}}{(x^{2} - 1)^{\frac{1}{2}}} - (x^{2} - 1)^{\frac{1}{2}}$'
      - section: 'Common denominator'
        say: 'Now subtract the fractions. The second term has denominator 1, so the L.C.M. of the denominators is $x$ squared minus 1, to the power 1 over 2.'
        write: 'L.C.M. $= (x^{2} - 1)^{\frac{1}{2}}$'
      - say: 'To bring the second term over the L.C.M., we multiply it by $x$ squared minus 1 to the power 1 over 2. The law of indices for multiplying says add the indices.'
        write: 'Law of indices: $a^{m} \times a^{n} = a^{m + n}$'
      - say: '1 over 2 plus 1 over 2 is 1. So the second term becomes $x$ squared minus 1, to the power 1, on top.'
        write: '$(x^{2} - 1)^{\frac{1}{2}} \times (x^{2} - 1)^{\frac{1}{2}} = (x^{2} - 1)^{1}$'
      - say: 'So the whole expression is $x$ squared, minus bracket $x$ squared minus 1, all over the L.C.M.'
        write: '$= \dfrac{x^{2} - (x^{2} - 1)}{(x^{2} - 1)^{\frac{1}{2}}}$'
      - say: 'Open the bracket. The minus in front changes both signs inside, giving minus $x$ squared, plus 1.'
        write: '$= \dfrac{x^{2} - x^{2} + 1}{(x^{2} - 1)^{\frac{1}{2}}}$'
      - say: '$x$ squared minus $x$ squared is 0, so the top is just 1.'
        write: '$= \dfrac{1}{(x^{2} - 1)^{\frac{1}{2}}}$'
      - say: 'Use the negative-index law backwards, so 1 over $a$ to the power $n$ is $a$ to the power negative $n$.'
        write: '$\therefore$ Expression $= (x^{2} - 1)^{-\frac{1}{2}}$'
      - section: 'Check'
        say: 'Check with $x$ equal to root 5, so $x$ squared is 5 and $x$ squared minus 1 is 4. The expression is 5 times 4 to the power negative 1 over 2, minus 4 to the power 1 over 2. That is 5 over 2 minus 2, which is 1 over 2.'
        write: 'Check, $x = \sqrt{5}$: $5 \times 4^{-\frac{1}{2}} - 4^{\frac{1}{2}} = \tfrac{5}{2} - 2 = \tfrac{1}{2}$'
      - say: 'Our answer gives 4 to the power negative 1 over 2, which is 1 over root 4, which is 1 over 2. They agree.'
        write: '$(x^{2} - 1)^{-\frac{1}{2}} = 4^{-\frac{1}{2}} = \dfrac{1}{\sqrt{4}} = \tfrac{1}{2}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the expression simplifies to $x$ squared minus 1, to the power negative 1 over 2, which is option D.'
        write: '$\therefore$ Expression $= (x^{2} - 1)^{-\frac{1}{2}}$'
        answer: true
    traps:
      A: 'You went for $x$ squared minus 1 to the power 1 over 2. The base is right, but the answer sits under the line: 1 over $x$ squared minus 1 to the power 1 over 2, so the index is negative 1 over 2.'
      B: 'You went for $x$ squared minus 1. With $x$ equal to root 5 that is 4, but the expression is 1 over 2. Over the L.C.M. the top is just 1.'
      C: 'You went for $x$ squared minus 1 to the power negative 1. With $x$ equal to root 5 that is 1 over 4, but the expression is 1 over 2. The denominator has index 1 over 2, not 1.'

  26:
    moments:
      - section: 'The question'
        say: 'We want the gradient of the line passing through negative 2, 0 and 0, negative 4. The gradient tells us how steep the line is, and which way it slopes.'
        write: 'Gradient of the line through $(-2,\ 0)$ and $(0,\ -4)$'
      - section: 'Solution'
        say: 'Solution. Let me plot the two points, A and B, and join them with a straight line.'
        write: 'Solution'
        diagram:
          id: g
          kind: graph
          x: [-3, 2]
          y: [-5, 2]
          step: 1
          plots:
            - {points: [[-2, 0], [0, -4]], join: straight, label: 'line AB', colour: blue}
          points:
            - {x: -2, y: 0, text: 'A (−2, 0)'}
            - {x: 0, y: -4, text: 'B (0, −4)'}
          'on': 'plot'
      - say: 'Label the points before using any formula. Let $x$ 1, $y$ 1 be A, negative 2, 0. Let $x$ 2, $y$ 2 be B, 0, negative 4.'
        write: 'Let $(x_{1},\ y_{1}) = (-2,\ 0)$ and $(x_{2},\ y_{2}) = (0,\ -4)$'
        point:
          - {line: 2, kind: highlight, at: '(−2, 0)', to: {diagram: g, part: 'point:1'}}
          - {line: 2, kind: highlight, at: '(0, −4)', to: {diagram: g, part: 'point:2'}}
      - section: 'The formula'
        say: 'The gradient, $m$, is the change in $y$ over the change in $x$, that is, $y$ 2 minus $y$ 1, over $x$ 2 minus $x$ 1.'
        write: 'Gradient, $m = \dfrac{y_{2} - y_{1}}{x_{2} - x_{1}}$'
      - say: 'Substitute, with the negative numbers in brackets. The second point comes first on top and underneath.'
        write: '$= \dfrac{-4 - 0}{0 - (-2)}$'
      - say: 'On top, negative 4 minus 0 is negative 4. Underneath, 0 minus negative 2 is 0 plus 2, which is 2.'
        write: '$= \dfrac{-4}{2}$'
        diagram_do:
          - {id: g, op: label, part: 'plot:1', text: 'change in y −4, change in x 2', 'on': 'Underneath'}
      - say: 'Negative 4 divided by 2 is negative 2.'
        write: '$\therefore\ m = -2$'
      - section: 'Check'
        say: 'To check, going from left to right, the line falls from A down to B. A line that falls has a negative gradient, so negative 2 fits.'
        write: 'Check: the line falls from left to right, so $m < 0\ \checkmark$'
        diagram_do:
          - {id: g, op: highlight, part: 'plot:1', text: 'falls left to right', 'on': 'falls'}
      - say: 'Therefore the gradient of the line is negative 2, which is answer choice C.'
        write: '$\therefore$ gradient $= -2$'
        answer: true
    traps:
      A: 'You went for positive 2. That comes from subtracting in opposite orders, top and bottom. Take the second point first in both: negative 4 over 2 is negative 2.'
      B: 'You went for negative 4. That is only the change in $y$. Divide it by the change in $x$, which is 2, to get negative 2.'
      D: 'You went for 4. The line falls from left to right, so the gradient is negative. The change in $y$ is negative 4 and the change in $x$ is 2, giving negative 2.'

  27:
    moments:
      - section: 'The question'
        say: 'At what value of $x$ is the function a minimum? The question wants the $x$ of the lowest point, not the value of $y$.'
        write: '$y = x^{2} - 2x - 3$'
        diagram:
          id: g
          kind: graph
          x: [-2, 4]
          y: [-5, 5]
          plots:
            - {fn: 'x^2 - 2x - 3', label: 'y = x² − 2x − 3', colour: blue}
      - section: 'Solution'
        say: 'Solution. Differentiate term by term, so multiply by the power, then reduce the power by 1. $x$ squared gives $2x$, minus $2x$ gives minus 2, and minus 3 gives 0.'
        write: '$\dfrac{dy}{dx} = 2x - 2$'
      - section: 'Turning point'
        say: 'At the turning point, the gradient is zero. So we write that at turning point, $\dfrac{dy}{dx}$ equals 0.'
        'on': 'turning point'
        write: 'At turning point, $\dfrac{dy}{dx} = 0$'
      - say: 'So $2x$ minus 2 equals 0.'
        write: '$2x - 2 = 0$'
        point:
          - {line: 3, kind: move, from: {line: 1, at: '= [[2x − 2]]'}, at: '2x − 2', text: 'dy/dx'}
      - say: 'Add 2 to both sides. $2x$ equals 2.'
        write: '$2x = 2$'
      - say: 'Divide both sides by 2. $x$ equals 1.'
        write: '$x = \dfrac{2}{2} = 1$'
      - section: 'Second derivative'
        say: 'Is it a minimum? Differentiate again. $2x$ gives 2, and minus 2 gives 0.'
        write: '$\dfrac{d^{2}y}{dx^{2}} = 2$'
      - say: 'The second derivative is positive, greater than zero. A positive second derivative means a minimum, and the curve is a valley, as on the graph.'
        'on': 'positive second'
        write: '$\dfrac{d^{2}y}{dx^{2}} = 2 > 0$, $\ \therefore$ minimum'
        diagram_do:
          - {id: g, op: vertex, part: 'plot:1', text: 'minimum', on: valley}
      - section: 'Check'
        say: 'Here is an exam tip, as a check. For a quadratic, the turning point is at $x$ equals minus $b$ over $2a$. Here $a$ is 1 and $b$ is minus 2.'
        write: 'Exam tip: $x = -\dfrac{b}{2a} = -\dfrac{(-2)}{2(1)} = 1\ \checkmark$'
      - say: 'The minimum value of $y$ there is minus 4. But the question asks for the $x$, not the $y$.'
        write: '$y_{\min} = 1 - 2 - 3 = -4$ (not asked)'
        point:
          - {line: 9, kind: strike, at: '−4', text: 'not asked'}
      - say: 'Therefore the function is a minimum at $x$ equals 1, which is answer choice A.'
        write: '$\therefore$ minimum at $x = 1$'
        answer: true
        diagram_do:
          - {id: g, op: label, part: 'point:1', text: 'x = 1', colour: green}
    traps:
      B: 'You went for minus 1. Watch the signs: $2x - 2 = 0$ gives $2x = 2$, so $x$ is plus 1.'
      C: 'You went for minus 4. That is the minimum value of $y$, not the $x$ where it happens. The question asks "at what value of $x$", and that is 1.'
      D: 'You went for 4. At $x$ equals 4 the gradient $2x - 2$ is 6, not 0. The gradient is 0 at $x$ equals 1.'

  28:
    moments:
      - section: 'The question'
        say: 'Twenty-seven, 9, 3, and so on. The terms are shrinking. Two options are A.P. formulas and two are not. First decide what kind of progression this is.'
        write: '$n$th term of $27,\ 9,\ 3,\ \ldots$'
        doodle: {name: 'custom:1991_q28_a', id: piles, caption: '27, 9, 3: shrinking piles'}
      - section: 'Solution'
        say: 'Solution. Test for an A.P. first. 9 minus 27 is negative 18, but 3 minus 9 is negative 6. The differences are not equal, so it is not an A.P.'
        write: 'Solution: $9 - 27 = -18,\quad 3 - 9 = -6$: not an A.P.'
      - say: 'Now test the ratios. 9 over 27 is 1 over 3, and 3 over 9 is 1 over 3. They are equal, so it is a G.P.'
        write: '$r = \dfrac{9}{27} = \dfrac{3}{9} = \dfrac{1}{3}$'
        doodle_do:
          - {id: piles, op: label, part: r1, text: '× 1/3'}
          - {id: piles, op: label, part: r2, text: '× 1/3'}
      - say: 'List what is given. The first term $a$ is 27, and the common ratio $r$ is 1 over 3.'
        write: '$a = 27,\quad r = \dfrac{1}{3}$'
      - say: 'The $n$th term of a G.P. is $a$ times $r$ to the power $n$ minus 1.'
        write: '$T_{n} = ar^{n - 1}$'
      - say: 'Substitute $a$ equals 27 and $r$ equals 1 over 3.'
        write: '$\therefore\ T_{n} = 27\left(\dfrac{1}{3}\right)^{n - 1}$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: 'a = 27'}, at: '= 27', text: 'a'}
      - section: 'Check'
        say: 'Check with $n$ equal to 1. The power is 0, and anything to the power 0 is 1. 27 times 1 is 27, the first pile.'
        write: 'Check: $T_{1} = 27\left(\dfrac{1}{3}\right)^{0} = 27$'
        doodle_do:
          - {id: piles, op: circle, part: t1}
      - say: 'With $n$ equal to 2, 27 times 1 over 3 is 9, the second pile.'
        write: '$T_{2} = 27 \times \dfrac{1}{3} = 9$'
        doodle_do:
          - {id: piles, op: circle, part: t2}
      - say: 'With $n$ equal to 3, 27 times 1 over 9 is 3, which is the third pile. All three agree.'
        write: '$T_{3} = 27 \times \dfrac{1}{9} = 3\ \checkmark$'
        doodle_do:
          - {id: piles, op: circle, part: t3}
      - say: 'Therefore the $n$th term is 27 times, 1 over 3 to the power $n$ minus 1, which is answer choice A.'
        write: '$\therefore\ T_{n} = 27\left(\dfrac{1}{3}\right)^{n - 1}$'
        answer: true
    traps:
      B: 'You went for 3 to the power $n$ plus 2. It gives 27 when $n$ is 1, but 81 when $n$ is 2. The terms get smaller, so the ratio is 1 over 3, not 3.'
      C: 'You went for 27 plus 18 times $n$ minus 1. That is an A.P. formula with $d$ equal to 18, and the differences here are not equal. When $n$ is 2 it gives 45, not 9.'
      D: 'You went for 27 plus 6 times $n$ minus 1. That is an A.P. formula, and it grows: when $n$ is 2 it gives 33, not 9. The ratios are equal, so it is a G.P.'

  29:
    moments:
      - section: 'The question'
        say: 'An A.P. of 20 terms starts at 7 and ends at 117. We want the sum. We are not given the common difference, and we will not need it.'
        write: 'Sum of 20 terms: first term 7, last term 117'
        doodle: {name: 'custom:1991_q29_a', id: stairs, caption: '20 even steps, 7 up to 117'}
      - section: 'Solution'
        say: 'Solution. List what is given, so $n$ is 20, the first term $a$ is 7, and the last term, $l$, is 117.'
        write: 'Solution: $n = 20,\quad a = 7,\quad l = 117$'
      - say: 'When the first and last terms are known, the sum of an A.P. is $n$ over 2, times $a$ plus $l$.'
        write: '$S_{n} = \dfrac{n}{2}(a + l)$'
      - say: 'Here is why it works. Fit an upside-down copy of the stairs on top. Every column is then first plus last, 7 plus 117, and our stairs are half of the 20 columns.'
        write: 'Each pair: $a + l = 7 + 117 = 124$'
        doodle_do:
          - {id: stairs, op: stage, stage: 'custom:1991_q29_a2', 'on': 'upside-down copy'}
          - {id: stairs, op: label, part: pair, text: '7 + 117 = 124'}
      - say: 'Substitute $n$ equals 20, $a$ equals 7 and $l$ equals 117.'
        write: '$S_{20} = \dfrac{20}{2}(7 + 117)$'
        point:
          - {line: 4, kind: move, from: {line: 1, at: 'a = 7'}, at: '([[7]] +', text: 'a'}
          - {line: 4, kind: move, from: {line: 1, at: 'l = 117'}, at: '+ 117', text: 'l'}
      - say: '20 over 2 is 10, and 7 plus 117 is 124.'
        write: '$= 10 \times 124$'
      - say: '10 times 124 is 1240.'
        write: '$\therefore\ S_{20} = 1240$'
      - section: 'Check'
        say: 'Check with the other sum formula. First find $d$. The last term is $a$ plus 19 $d$, so 117 equals 7 plus 19 $d$, and 19 $d$ is 110.'
        write: 'Check: $l = a + 19d \Rightarrow 19d = 117 - 7 = 110$'
      - say: 'Put $a$ and 19 $d$ into the first sum formula, which gives 20 over 2, times, 2 times 7 plus 110.'
        write: '$S_{20} = \dfrac{20}{2}[2(7) + 110]$'
      - say: '2 times 7 is 14, and 14 plus 110 is 124. 10 times 124 is 1240 again.'
        write: '$= 10 \times 124 = 1240\ \checkmark$'
      - say: 'Therefore the sum of the first 20 terms is 1240, which is answer choice B.'
        write: '$\therefore\ S_{20} = 1240$'
        answer: true
    traps:
      A: 'You went for 2480, which is 20 times 124. The $n$ over 2 was forgotten: the formula multiplies by 20 over 2, which is 10.'
      C: 'You went for 620. That divides by 2 twice. The formula is 20 over 2, which is 10, times 124, giving 1240.'
      D: 'You went for 124. That is only $a$ plus $l$, the bracket. Multiply by $n$ over 2, which is 10, to get 1240.'

  30:
    moments:
      - section: 'The question'
        say: 'The line from $Q$ bends at $R$ and comes back to $S$. With a bend between parallel lines, one extra line does all the work, and that is a third parallel line through the bend.'
        write: '$PQ \parallel TS$, $\angle PQR = 110^{\circ}$, $\angle RST = 120^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: PQR, text: '110°'}
          - {figure: 0, kind: arc, target: RST, text: '120°'}
          - {figure: 0, kind: circle, target: x, text: 'x = ?'}
      - section: 'Solution'
        say: 'Solution. We re-draw the diagram, so we can add our own line to it.'
        write: 'Solution'
        show_sketch: true
      - say: 'Through the bend $R$, draw the line $RX$ parallel to $PQ$ and $TS$. It splits $x$ into two parts, angle $QRX$ above it and angle $XRS$ below it.'
        write: 'Draw $RX \parallel PQ \parallel TS$ (construction)'
        point:
          - {figure: sketch, kind: highlight, target: XR, text: 'new parallel line'}
      - say: 'Angle $PQR$ and angle $QRX$ lie between $PQ$ and $RX$, on the same side of $QR$. Co-interior angles like these add up to 180 degrees.'
        write: '$\angle QRX + 110^{\circ} = 180^{\circ}$ (co-int. $\angle$s, $PQ \parallel RX$)'
        point:
          - {figure: sketch, kind: arc, target: PQR, text: '110°'}
          - {figure: sketch, kind: arc, target: QRX, text: '?'}
      - say: 'Take 110 to the other side, so we get 180 minus 110.'
        write: '$\angle QRX = 180^{\circ} - 110^{\circ}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '+ 110∘'}, at: '− 110∘', text: 'across'}
      - say: '180 minus 110 is 70 degrees.'
        write: '$\angle QRX = 70^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: QRX, text: '70°'}
      - say: 'The lower part works the same way. Angle $XRS$ and angle $RST$ lie between $RX$ and $TS$, on the same side of $RS$. Co-interior again.'
        write: '$\angle XRS + 120^{\circ} = 180^{\circ}$ (co-int. $\angle$s, $RX \parallel TS$)'
        point:
          - {figure: sketch, kind: arc, target: RST, text: '120°'}
          - {figure: sketch, kind: arc, target: XRS, text: '?'}
      - say: 'Take 120 to the other side, which gives 180 minus 120.'
        write: '$\angle XRS = 180^{\circ} - 120^{\circ}$'
      - say: '180 minus 120 is 60 degrees.'
        write: '$\angle XRS = 60^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: XRS, text: '60°'}
      - say: 'The line $RX$ lies inside the angle at $R$, so $x$ is the two parts added together.'
        write: '$x = \angle QRX + \angle XRS$'
      - say: 'Put in the 70 and the 60 we found.'
        write: '$x = 70^{\circ} + 60^{\circ}$'
        point:
          - {line: 10, kind: move, from: {line: 5, at: '70∘'}, at: '70∘', text: 'upper'}
          - {line: 10, kind: move, from: {line: 8, at: '60∘'}, at: '60∘', text: 'lower'}
      - say: '70 plus 60 is 130 degrees.'
        write: '$x = 130^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: QRS, text: '130°'}
      - section: 'Check'
        say: 'Check. The two co-interior pairs make 180 plus 180, which is 360. So 110, 130 and 120 together must make 360, and they do.'
        write: '$110^{\circ} + 130^{\circ} + 120^{\circ} = 360^{\circ}\ \checkmark$'
      - say: 'Therefore $x$ is 130 degrees, option A.'
        write: '$\therefore x = 130^{\circ}$ (A)'
        answer: true
    traps:
      B: 'You went for 110 degrees, copying the angle at $Q$ across as if it were alternate. Here the angles are co-interior, so they add up to 180. The two parts are 70 and 60, which make 130.'
      C: 'You went for 100 degrees. Draw $RX$ through $R$ parallel to both lines: the parts are 180 minus 110, which is 70, and 180 minus 120, which is 60. Together they make 130.'
      D: 'You went for 90 degrees. The angle at $R$ is not a right angle here. Its two parts are 70 and 60 degrees, which add up to 130.'

  31:
    moments:
      - section: 'The question'
        say: 'Four angles, all in terms of $x$. We cannot tell which is smallest until we know $x$, and the angle sum of a quadrilateral gives it.'
        write: '$(5x - 30)$, $(4x + 60)$, $(60 - x)$, $(3x + 61)$'
      - section: 'Solution'
        say: 'Solution. Let me draw the quadrilateral $ABCD$ with its four angles marked.'
        write: 'Solution'
        show_sketch: true
      - say: 'The interior angles of a polygon with $n$ sides add up to $n$ minus 2, times 180 degrees.'
        write: 'Sum of int. $\angle$s $= (n - 2) \times 180^{\circ}$'
      - say: 'A quadrilateral has 4 sides. 4 minus 2 is 2, and 2 times 180 is 360. Tear off the four corners of a paper quadrilateral and they fit round a point, making 360.'
        write: '$= (4 - 2) \times 180^{\circ} = 360^{\circ}$'
        doodle: {name: 'custom:1991_q31_a', id: corners, caption: 'a paper quadrilateral'}
        doodle_do:
          - {id: corners, op: stage, stage: 'custom:1991_q31_a2'}
      - say: 'So add the four angles and set the total equal to 360. The sum is long, so it runs over two lines.'
        write: '$(5x - 30) + (4x + 60)$'
      - say: 'Plus 60 minus $x$, plus $3x$ plus 61, equals 360.'
        write: '$+ (60 - x) + (3x + 61) = 360$'
      - say: 'Collect like terms. For the $x$ terms, $5x$ plus $4x$ is $9x$, minus $x$ is $8x$, plus $3x$ is $11x$.'
        write: '$5x + 4x - x + 3x = 11x$'
      - say: 'For the numbers, minus 30 plus 60 is 30, plus 60 is 90, plus 61 is 151.'
        write: '$-30 + 60 + 60 + 61 = 151$'
      - say: 'So the equation is $11x$ plus 151 equals 360.'
        write: '$11x + 151 = 360$'
        point:
          - {line: 8, kind: move, from: {line: 6, at: '= 11x'}, at: '11x', text: 'x terms'}
          - {line: 8, kind: move, from: {line: 7, at: '= 151'}, at: '151', text: 'numbers'}
      - say: 'Take 151 to the other side, so 360 minus 151.'
        write: '$11x = 360 - 151$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '+ 151'}, at: '− 151', text: 'across'}
      - say: '360 minus 151 is 209.'
        write: '$11x = 209$'
      - say: 'Divide both sides by 11. 11 times 19 is 209, so $x$ is 19.'
        write: '$x = \dfrac{209}{11} = 19$'
      - say: 'Now each angle. 5 times 19 is 95, minus 30 is 65 degrees.'
        write: '$5x - 30 = 5(19) - 30 = 65^{\circ}$'
        point:
          - {figure: sketch, kind: label, target: '(5x−30)°', text: '65°'}
      - say: '4 times 19 is 76, plus 60 is 136 degrees.'
        write: '$4x + 60 = 4(19) + 60 = 136^{\circ}$'
        point:
          - {figure: sketch, kind: label, target: '(4x+60)°', text: '136°'}
      - say: '60 minus 19 is 41 degrees.'
        write: '$60 - x = 60 - 19 = 41^{\circ}$'
        point:
          - {figure: sketch, kind: label, target: '(60−x)°', text: '41°'}
      - say: '3 times 19 is 57, plus 61 is 118 degrees.'
        write: '$3x + 61 = 3(19) + 61 = 118^{\circ}$'
        point:
          - {figure: sketch, kind: label, target: '(3x+61)°', text: '118°'}
      - section: 'Check'
        say: 'Check that they add up to 360. 65 plus 136 is 201, plus 41 is 242, plus 118 is 360.'
        write: '$65 + 136 + 41 + 118 = 360\ \checkmark$'
        point:
          - {line: 16, kind: circle, at: '41', text: 'smallest'}
      - say: 'The smallest is 41 degrees, the thinnest corner of the paper, and it is the angle 60 minus $x$. Therefore the answer is option C.'
        write: '$\therefore$ smallest $= (60 - x)^{\circ} = 41^{\circ}$ (C)'
        answer: true
        doodle_do:
          - {id: corners, op: circle, part: small}
          - {id: corners, op: label, part: small, text: '41°'}
        point:
          - {figure: sketch, kind: circle, target: '(60−x)°', text: 'smallest'}
    traps:
      A: 'You went for $5x$ minus 30. It looks smallest because of the minus 30, but with $x$ equal to 19 it is 65 degrees. The angle 60 minus $x$ is only 41 degrees.'
      B: 'You went for $4x$ plus 60. With $x$ equal to 19 that is 136 degrees, the largest angle of all. The smallest is 60 minus $x$, which is 41 degrees.'
      D: 'You went for $3x$ plus 61. With $x$ equal to 19 that is 118 degrees. Work out all four: the smallest is 60 minus $x$, at 41 degrees.'

  32:
    moments:
      - section: 'The question'
        say: 'We know the area of a square, and we want its diagonal, the line from one corner to the opposite corner. First the side, then the diagonal.'
        write: 'Find the length of the diagonal of the square.'
      - say: 'Write Solution, then draw the square ABCD with its diagonal AC.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: highlight, target: AC, text: 'diagonal', 'on': 'its diagonal AC'}
      - section: 'The side'
        say: 'We are given that the area is 144 square centimetres.'
        write: 'Area $= 144\ \text{cm}^{2}$'
        point:
          - {figure: sketch, kind: circle, target: 'Area = 144 cm²', text: 'given', 'on': 'the area is 144'}
      - say: 'We do not know the side yet, so we give it a letter.'
        write: 'Let the side of the square be $s$ cm.'
        point:
          - {figure: sketch, kind: highlight, target: AB, text: 's', 'on': 'give it a letter'}
      - say: 'Area of a square is side times side, s squared. So s squared equals 144.'
        write: '$s^{2} = 144$'
      - say: 'Take the square root. 12 times 12 is 144, so the side is 12 cm.'
        write: '$s = \sqrt{144} = 12$ cm'
        point:
          - {figure: sketch, kind: label, target: AB, text: '12 cm', 'on': 'the side is 12'}
      - section: 'The diagonal'
        say: 'The diagonal cuts the square into two right-angled triangles. In triangle ABC, the angle at B is 90 degrees, because every angle of a square is a right angle.'
        write: 'In $\triangle ABC$, $\angle ABC = 90^{\circ}$ (angle of a square)'
        point:
          - {figure: sketch, kind: arc, target: ABC, text: '90°', 'on': 'the angle at B'}
      - say: 'AC is the hypotenuse, the side facing the right angle. By Pythagoras, AC squared equals AB squared plus BC squared.'
        write: '$|AC|^{2} = |AB|^{2} + |BC|^{2}$ (Pythagoras)'
      - say: 'Both sides are 12. 12 squared is 144, and 144 plus 144 is 288.'
        write: '$= 12^{2} + 12^{2} = 144 + 144 = 288$'
        point:
          - {line: 8, kind: move, from: {line: 5, at: '= 12'}, at: '= [[12]]2', text: 'side', 'on': 'Both sides are 12'}
      - say: 'So AC is the square root of 288. Simplify the surd, because 288 is 144 times 2, and 144 is a perfect square.'
        write: '$|AC| = \sqrt{288} = \sqrt{144 \times 2}$'
      - say: 'Root 144 is 12, and root 2 stays as it is. So AC is 12 root 2.'
        write: '$= 12\sqrt{2}$'
      - say: 'Therefore the diagonal is 12 root 2 centimetres.'
        write: '$\therefore$ diagonal $= 12\sqrt{2}$ cm'
        point:
          - {figure: sketch, kind: label, target: '?', text: '12√2 cm', 'on': 'Therefore'}
      - section: 'Check'
        say: 'To check, root 2 is about 1.414, so 12 root 2 is about 17 cm. A diagonal must be longer than the 12 cm side, and 17 is.'
        write: 'Check: $12\sqrt{2} \approx 12 \times 1.414 \approx 17$ cm $> 12$ cm ✓'
      - section: 'Answer'
        say: 'So the diagonal is 12 root 2 centimetres, which is answer choice C.'
        write: '$\therefore |AC| = 12\sqrt{2}$ cm (C)'
        answer: true
    traps:
      A: 'You went for 11 root 3. That is the square root of 363, not 288. AC squared is 12 squared plus 12 squared, which is 288, and root 288 is 12 root 2.'
      B: 'You went for 12 cm. That is the side s, not the diagonal. The diagonal is the hypotenuse of triangle ABC, so it is longer than a side: 12 root 2 cm.'
      D: 'You went for 13 cm. 13 squared is 169, not 288. By Pythagoras, AC squared is 144 plus 144, which is 288, so AC is 12 root 2 cm.'

  33:
    moments:
      - section: 'The question'
        say: 'A rhombus with a 60-degree angle hides an equilateral triangle. Find it, and the long diagonal follows from Pythagoras.'
        write: 'One $\angle = 60^{\circ}$, short diagonal $= 8$ cm'
      - section: 'Solution'
        say: 'Solution. Let me draw the rhombus $ABCD$, with the 60-degree angle at $A$. The short diagonal $BD$ is 8 centimetres, and the long diagonal $AC$ is what we want.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '60°', text: 'angle at A'}
          - {figure: sketch, kind: highlight, target: BD, text: '8 cm'}
      - say: 'All four sides of a rhombus are equal. So in triangle $ABD$, $AB$ equals $AD$.'
        write: '$|AB| = |AD|$ (sides of rhombus)'
        point:
          - {figure: sketch, kind: highlight, target: AB}
          - {figure: sketch, kind: highlight, target: AD, text: 'equal sides'}
      - say: 'So triangle $ABD$ is isosceles, and its base angles at $B$ and $D$ are equal. The reason is base angles of an isosceles triangle.'
        write: '$\angle ABD = \angle ADB$ (base $\angle$s of isos. $\triangle$)'
      - say: 'The three angles of triangle $ABD$, the two equal base angles and the 60 at $A$, add up to 180.'
        write: '$2\angle ABD + 60^{\circ} = 180^{\circ}$ ($\angle$ sum of $\triangle$)'
      - say: 'Take 60 to the other side. 180 minus 60 is 120.'
        write: '$2\angle ABD = 120^{\circ}$'
      - say: 'Divide both sides by 2. Half of 120 is 60.'
        write: '$\angle ABD = \angle ADB = 60^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: ABD, text: '60°'}
          - {figure: sketch, kind: arc, target: ADB, text: '60°'}
      - say: 'All three angles are 60 degrees, so triangle $ABD$ is equilateral. Its sides are all equal to $BD$, so the side of the rhombus is 8 centimetres.'
        write: '$|AB| = |BD| = 8$ cm (equilateral $\triangle$)'
        point:
          - {figure: sketch, kind: label, target: AB, text: '8 cm'}
      - say: 'The diagonals of a rhombus cut each other in half at right angles. So $BO$ is half of 8, which is 4, and the angle at $O$ is 90 degrees.'
        write: '$|BO| = \dfrac{8}{2} = 4$ cm (diagonals of rhombus bisect at $90^{\circ}$)'
        point:
          - {figure: sketch, kind: label, target: BO, text: '4'}
          - {figure: sketch, kind: arc, target: AOB, text: '90°'}
      - say: 'In triangle $AOB$, the right angle is at $O$, so $AB$ is the hypotenuse. The reason is Pythagoras.'
        write: '$|AB|^{2} = |AO|^{2} + |BO|^{2}$ (Pythagoras)'
        point:
          - {figure: sketch, kind: highlight, target: AO, text: '?'}
      - say: 'Substitute 8 for $AB$ and 4 for $BO$.'
        write: '$8^{2} = |AO|^{2} + 4^{2}$'
      - say: '8 squared is 64 and 4 squared is 16. Take 16 to the other side, and 64 minus 16 is 48.'
        write: '$|AO|^{2} = 64 - 16 = 48$'
      - say: 'Take the square root of both sides.'
        write: '$|AO| = \sqrt{48}$'
      - say: '48 is 16 times 3, and the square root of 16 is 4. So $AO$ is 4 root 3.'
        write: '$|AO| = \sqrt{16 \times 3} = 4\sqrt{3}$'
        point:
          - {figure: sketch, kind: label, target: AO, text: '4√3'}
      - say: 'The diagonals bisect each other, so the long diagonal $AC$ is twice $AO$. 2 times 4 root 3 is 8 root 3.'
        write: '$|AC| = 2 \times 4\sqrt{3} = 8\sqrt{3}$ cm'
        point:
          - {line: 14, kind: move, from: {line: 13, at: '= 43'}, at: '× [[43]]', text: 'AO'}
          - {figure: sketch, kind: highlight, target: AC, text: '8√3 cm'}
      - section: 'Check'
        say: 'Check with SOH CAH TOA. $AC$ bisects the 60 degrees at $A$, so angle $BAO$ is 30. Using adjacent over hypotenuse, $AO$ is 8 cos 30, which is 8 times root 3 over 2.'
        write: '$|AO| = 8\cos 30^{\circ} = 8 \times \dfrac{\sqrt{3}}{2}$'
      - say: '8 over 2 is 4, so $AO$ is 4 root 3 again. It matches.'
        write: '$|AO| = 4\sqrt{3}\ \checkmark$'
      - say: 'Therefore the longer diagonal is 8 root 3 centimetres, option A.'
        write: '$\therefore$ longer diagonal $= 8\sqrt{3}$ cm (A)'
        answer: true
    traps:
      B: 'You went for 16 over root 3. That is twice 8 tan 30: tan used where cos belongs. In triangle $AOB$ the side 8 is the hypotenuse, so $AO$ is 8 cos 30, which is 4 root 3, and $AC$ is 8 root 3.'
      C: 'You went for 5 root 3. The side of the rhombus is 8, because the short diagonal makes an equilateral triangle. Pythagoras gives $AO$ as root 48, which is 4 root 3, so $AC$ is 8 root 3.'
      D: 'You went for 10 over root 3. The side is 8 and half the short diagonal is 4. $AO$ squared is 64 minus 16, which is 48, so $AO$ is 4 root 3 and $AC$ is 8 root 3.'

  34:
    moments:
      - section: 'The question'
        say: 'Five exterior angles, all in terms of $x$. Whatever the polygon, its exterior angles always add up to the same total, and that gives us the equation.'
        write: 'Ext. $\angle$s: $x$, $x + 5$, $x + 10$, $x + 15$, $x + 20$'
      - section: 'Solution'
        say: 'Solution. Let me draw the pentagon with each side extended, so that the five exterior angles show.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'x°'}
      - say: 'The exterior angles of any polygon add up to 360 degrees. Walk once round the shape, and at each corner you turn, so the five turns together make one full turn.'
        write: 'Sum of ext. $\angle$s $= 360^{\circ}$'
        doodle: {name: 'custom:1991_q34_a', id: turn, caption: 'five turns, one full turn'}
        doodle_do:
          - {id: turn, op: pulse, part: turns}
      - say: 'So add the five angles and set the total equal to 360. The sum is long, so it runs over two lines.'
        write: '$x + (x + 5) + (x + 10)$'
      - say: 'Plus $x$ plus 15, plus $x$ plus 20, equals 360.'
        write: '$+ (x + 15) + (x + 20) = 360$'
      - say: 'Collect like terms. Five $x$s make $5x$. For the numbers, 5 plus 10 plus 15 plus 20 is 50.'
        write: '$5x + 50 = 360$'
      - say: 'Take 50 to the other side, giving 360 minus 50.'
        write: '$5x = 360 - 50$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '+ 50'}, at: '− 50', text: 'across'}
      - say: '360 minus 50 is 310.'
        write: '$5x = 310$'
      - say: 'Divide both sides by 5. 310 divided by 5 is 62.'
        write: '$x = \dfrac{310}{5} = 62$'
      - section: 'Check'
        say: 'Check. Put $x$ equal to 62 into each angle, and we get 62, 67, 72, 77 and 82, the five turns in the ring.'
        write: 'Angles: $62,\ 67,\ 72,\ 77,\ 82$'
        doodle_do:
          - {id: turn, op: label, part: turns, text: '62, 67, 72, 77, 82'}
        point:
          - {figure: sketch, kind: label, target: 'x°', text: '62°'}
          - {figure: sketch, kind: label, target: '(x+5)°', text: '67°'}
          - {figure: sketch, kind: label, target: '(x+10)°', text: '72°'}
      - say: '62 plus 67 is 129, plus 72 is 201, plus 77 is 278, plus 82 is 360. One full turn, as it should be.'
        write: '$62 + 67 + 72 + 77 + 82 = 360\ \checkmark$'
        doodle_do:
          - {id: turn, op: label, part: walker, text: 'one full turn: 360°'}
        point:
          - {figure: sketch, kind: label, target: '(x+15)°', text: '77°'}
          - {figure: sketch, kind: label, target: '(x+20)°', text: '82°'}
      - say: 'Therefore $x$ is 62 degrees, option C.'
        write: '$\therefore x = 62^{\circ}$ (C)'
        answer: true
        point:
          - {figure: sketch, kind: label, target: 'x = ?', text: '62°'}
    traps:
      A: 'You went for 118 degrees. That is 180 minus 62, the interior angle next to the exterior angle $x$. The question gives exterior angles, which add up to 360, so $x$ is 62.'
      B: 'You went for 72 degrees. That is 360 divided by 5, the exterior angle of a regular pentagon. Here the angles are not equal: $5x$ plus 50 equals 360 gives $x$ equal to 62.'
      D: 'You went for 36 degrees. The exterior angles add up to 360: $5x$ plus 50 equals 360, so $5x$ is 310 and $x$ is 62.'

  35:
    moments:
      - section: 'The question'
        say: 'Two secants and a tangent from one outside point $P$. One fact links all three lines, so one product gives both answers. We want $PR$ first, then $PT$.'
        write: '$PM = 5$, $PN = 12$, $PQ = 4.8$'
        point:
          - {figure: 0, kind: circle, target: '5', text: 'PM'}
          - {figure: 0, kind: circle, target: '4.8', text: 'PQ'}
          - {figure: 0, kind: highlight, target: PN, text: 'PN = 12'}
      - section: 'Solution'
        say: 'Solution. From a point outside a circle, the two lengths along each secant multiply to the same number. For the tangent, that number is $PT$ squared.'
        write: 'Solution'
      - say: 'For the two secants from $P$, $PQ$ times $PR$ equals $PM$ times $PN$. The reason is intersecting secants.'
        write: '$PQ \times PR = PM \times PN$ (intersecting secants)'
        point:
          - {figure: 0, kind: highlight, target: PR, text: 'PR = ?'}
      - say: 'Now substitute. $PQ$ is 4.8, $PM$ is 5 and $PN$ is 12.'
        write: '$4.8 \times PR = 5 \times 12$'
      - say: '5 times 12 is 60.'
        write: '$4.8 \times PR = 60$'
      - say: 'Divide both sides by 4.8.'
        write: '$PR = \dfrac{60}{4.8}$'
      - say: 'Multiply top and bottom by 10 to clear the decimal, which gives 600 over 48. 48 times 12 is 576, and the 24 left is half of 48. So $PR$ is 12.5 centimetres.'
        write: '$PR = \dfrac{600}{48} = 12.5$ cm'
        point:
          - {figure: 0, kind: label, target: PR, text: '12.5'}
      - say: 'Now the tangent. $PT$ squared equals $PM$ times $PN$, and the reason is the tangent-secant theorem. The tangent is like a secant whose two lengths are equal.'
        write: '$PT^{2} = PM \times PN$ (tangent–secant theorem)'
        point:
          - {figure: 0, kind: highlight, target: PT, text: 'tangent'}
      - say: 'Substitute 5 and 12, and 5 times 12 is 60 again.'
        write: '$PT^{2} = 5 \times 12 = 60$'
      - say: 'Take the square root of both sides.'
        write: '$PT = \sqrt{60}$'
      - say: '7 squared is 49 and 8 squared is 64, so root 60 is between 7 and 8. It is about 7.746, which is 7.7 to one decimal place.'
        write: '$PT \approx 7.746 \approx 7.7$ cm'
        point:
          - {figure: 0, kind: label, target: PT, text: '7.7'}
      - section: 'Check'
        say: 'Check. 4.8 times 12.5 is 60, the same as 5 times 12. And the tangent, 7.7, lies between the near lengths, 5 and 4.8, and the far lengths, 12 and 12.5.'
        write: '$4.8 \times 12.5 = 60 = 5 \times 12\ \checkmark$'
      - say: 'The question asks for $PR$ first, then $PT$. Therefore 12.5 and 7.7, option C.'
        write: '$\therefore PR = 12.5$ cm, $PT = 7.7$ cm (C)'
        answer: true
    traps:
      A: 'You went for 7.3 and 5.9. Neither fits the rule. $PM$ times $PN$ is 60, so $PR$ is 60 over 4.8, which is 12.5, and $PT$ is root 60, about 7.7.'
