        point:
          - {figure: sketch, kind: circle, target: '4 cm', text: 'radius'}
          - {figure: sketch, kind: circle, target: '5 cm', text: 'height'}
      - say: 'A solid cylinder has three surfaces, like a tin: two circular ends and the curved side, where the label goes. Let''s find each one.'
        doodle: {name: 'custom:1991_q45_a', id: tin, caption: 'two ends and a label'}
        point:
