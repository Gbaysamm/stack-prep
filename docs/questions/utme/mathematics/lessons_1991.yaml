  50:
    moments:
      - say: 'Picture the crate. It has 10 bottles of Coca-Cola, 8 of Fanta and 6 of Sprite. One bottle is picked at random. We want the probability that it is NOT a Coca-Cola.'
        write: '$\text{Coca-Cola } 10,\ \text{Fanta } 8,\ \text{Sprite } 6$'
        doodle: {name: 'custom:1991_q50_a', id: crate, caption: '10 Coke, 8 Fanta, 6 Sprite'}
      - say: 'Probability is the number of favourable outcomes over the total number of equally likely outcomes.'
        write: '$P = \dfrac{\text{favourable}}{\text{total}}$'
      - say: 'The total number of bottles is 10 plus 8 plus 6, which is 24: one ball here for each bottle.'
        write: '$10 + 8 + 6 = 24$'
        doodle: {id: bottles, caption: 'red Coke, yellow Fanta, green Sprite', repeat: [{name: 'ball-red', n: 10}, {name: 'ball-yellow', n: 8}, {name: 'ball-green', n: 6}], layout: grid}
        doodle_do:
          - {id: bottles, op: count}
      - say: 'The bottles that are not Coca-Cola are the Fanta and the Sprite. Split off the 10 red Coca-Colas: 8 plus 6 is 14 are left.'
        write: '$8 + 6 = 14$'
        doodle_do:
          - {id: bottles, op: split, n: 10, text: 'Coca-Cola 10 | not Coca-Cola 14'}
      - say: 'So the probability is 14 over 24.'
        write: '$P(\text{not Coca-Cola}) = \dfrac{14}{24}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= 14'}, at: '14', text: 'favourable'}
          - {line: 4, kind: move, from: {line: 2, at: '= 24'}, at: '24', text: 'total'}
      - say: 'Divide top and bottom by 2. 14 over 2 is 7, and 24 over 2 is 12.'
        write: '$= \dfrac{7}{12}$'
      - say: 'Check with the complement. The probability it IS a Coca-Cola, the first section of the crate, is 10 over 24, which simplifies to 5 over 12.'
        write: 'Check: $P(\text{Coca-Cola}) = \dfrac{10}{24} = \dfrac{5}{12}$'
        doodle_do:
          - {id: crate, op: circle, part: coke}
      - say: 'Not Coca-Cola is everything else, so it is 1 minus 5 over 12. 1 is 12 over 12, and 12 minus 5 is 7, which gives 7 over 12 again.'
        write: '$P(\text{not Coca-Cola}) = 1 - \dfrac{5}{12} = \dfrac{12}{12} - \dfrac{5}{12} = \dfrac{7}{12}\ \checkmark$'
      - say: 'So the probability that it is not a Coca-Cola bottle, a Fanta or a Sprite, is 7 over 12, which is answer choice D.'
        write: 'Probability $= \dfrac{7}{12}$'
        doodle_do:
          - {id: crate, op: circle, part: fanta}
          - {id: crate, op: circle, part: sprite}
