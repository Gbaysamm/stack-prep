      C: 'You went for 96 pi. Check the curved side: 2 times pi times 4 times 5 is 40 pi. Add the two ends, 32 pi, to get 72 pi.'
      D: 'You went for 192 pi. That is far too large. The two ends are 16 pi each and the curved side is 40 pi, which makes 72 pi.'

  46:
    moments:
      - say: 'The figure is a cylinder of radius $a$ and height $y$, with a cone of the same radius and height $x$ on top. We want its volume.'
        write: 'Cylinder: radius $a$, height $y$; cone: radius $a$, height $x$'
        point:
          - {figure: 0, kind: circle, target: y, text: 'cylinder height'}
          - {figure: 0, kind: circle, target: x, text: 'cone height'}
      - say: 'This solid is two shapes we know, stacked together. So its volume is the cylinder''s volume plus the cone''s.'
        write: '$V = V_{\text{cylinder}} + V_{\text{cone}}$'
      - say: 'A cylinder''s volume is the area of its circular base, pi $r$ squared, times its height.'
        write: 'Cylinder: $V = \pi r^{2}h$'
        point:
          - {figure: 0, kind: label, target: {x: 150, y: 352}, text: 'base πr²'}
      - say: 'Here the radius is $a$ and the height is $y$, so the cylinder is pi $a$ squared $y$.'
        write: '$V_{\text{cylinder}} = \pi a^{2}y$'
        point:
          - {figure: 0, kind: circle, target: {x: 195, y: 320}, text: 'radius a'}
          - {figure: 0, kind: circle, target: y, text: 'height y'}
      - say: 'A cone holds exactly a third of the cylinder with the same base and height: pour one cone of water in, and the cylinder is a third full. So its volume is a third of pi $r$ squared $h$.'
        write: 'Cone: $V = \tfrac{1}{3}\pi r^{2}h$'
        doodle: {name: 'custom:1991_q46_a', id: pour, caption: 'one cone fills a third'}
        doodle_do:
          - {id: pour, op: fill, to: 0.34}
        point:
          - {figure: 0, kind: label, target: {x: 150, y: 100}, text: 'cone'}
      - say: 'Our cone has radius $a$ and height $x$, so it is a third of pi $a$ squared $x$.'
        write: '$V_{\text{cone}} = \tfrac{1}{3}\pi a^{2}x$'
        doodle_do:
          - {id: pour, op: label, part: cone, text: '⅓πa²x'}
        point:
          - {figure: 0, kind: circle, target: {x: 195, y: 140}, text: 'radius a'}
          - {figure: 0, kind: circle, target: x, text: 'height x'}
      - say: 'Now add the two volumes we just found: the cylinder and the cone.'
        write: '$V = \pi a^{2}y + \tfrac{1}{3}\pi a^{2}x$'
        doodle_do:
          - {id: pour, op: pulse}
        point:
          - {line: 6, kind: move, from: {line: 3, at: 'πa2y'}, at: 'πa2y', text: 'cylinder'}
          - {line: 6, kind: move, from: {line: 5, at: '= 31πa2x'}, at: '31πa2x', text: 'cone'}
      - say: 'Both terms share pi $a$ squared, so take it out as a common factor. That leaves $y$ plus a third of $x$.'
        write: '$= \pi a^{2}\left(y + \tfrac{1}{3}x\right)$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '= [[πa2]]y'}, at: 'πa2', text: 'taken out'}
      - say: 'Swap the order inside the bracket to match the way the options are written.'
        write: '$= \pi a^{2}\left(\tfrac{1}{3}x + y\right)$'
      - say: 'So the volume is pi $a$ squared, times a third of $x$ plus $y$, which is answer choice D.'
        write: 'Volume $= \pi a^{2}\left(\tfrac{1}{3}x + y\right)$'
        answer: true
    traps:
      A: 'You went for one third pi $a$ squared. That is not even a volume: it has no height in it. Add the cylinder, pi $a$ squared $y$, and the cone, one third pi $a$ squared $x$.'
      B: 'You went for pi $a$ squared $y$. That is only the cylinder; the cone on top is forgotten. Add one third pi $a$ squared $x$ for the cone.'
      C: 'You went for one third pi $a$ squared times $y$ plus $x$. That treats the whole solid as one cone. Only the cone part is divided by 3; the cylinder is pi $a$ squared $y$.'

  47:
    moments:
      - say: 'A family''s income is split: 59% food, 3% electricity, 20% transport, 11% education and 7% extended family. We want the pie chart angles for education and food, in that order.'
        write: '$59\%,\ 3\%,\ 20\%,\ 11\%,\ 7\%$'
      - say: 'Let me draw the pie chart, so we can see the parts of the whole.'
        show_sketch: true
      - say: 'First check that the percentages make a whole. Picture the income as a hundred squares. 59 plus 3 is 62, plus 20 is 82, plus 11 is 93, plus 7 is 100. Good.'
        write: '$59 + 3 + 20 + 11 + 7 = 100$'
        doodle: {name: 'custom:1991_q47_a', id: hundred, caption: '100 squares of income'}
      - say: 'A pie chart shares out the 360 degrees of a full circle, so each item gets its percentage of 360.'
        write: 'Angle $= \dfrac{\text{percentage}}{100} \times 360^{\circ}$'
      - say: 'A handy shortcut: 1% of 360 degrees is 360 over 100, which is 3.6 degrees. So each percent, each little square, is worth 3.6 degrees.'
        write: '$1\%$ of $360^{\circ} = \dfrac{360^{\circ}}{100} = 3.6^{\circ}$'
        doodle_do:
