          - {figure: sketch, kind: label, target: 'angle ?', text: '212.4°'}
      - say: 'Let''s check the rest. Electricity is 3 times 3.6, which is 10.8. Transport is 20 times 3.6, which is 72. Extended family is 7 times 3.6, which is 25.2.'
