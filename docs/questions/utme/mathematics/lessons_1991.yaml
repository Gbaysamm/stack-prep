          - {figure: sketch, kind: circle, target: '5 cm', text: 'width = h'}
      - say: '2 times 4 is 8, and 8 times 5 is 40. So the curved side is 40 pi.'
        write: '$= 40\pi$'
      - say: 'Add the ends and the label. 32 pi plus 40 pi is 72 pi.'
        write: '$32\pi + 40\pi = 72\pi$'
        doodle_do:
          - {id: tin, op: label, text: '32π + 40π = 72π'}
        point:
          - {line: 7, kind: move, from: {line: 4, at: '= 32π'}, at: '32π', text: 'ends'}
          - {line: 7, kind: move, from: {line: 6, at: '= 40π'}, at: '40π', text: 'side'}
      - say: 'The one-line formula agrees: 2 pi $r$, times $r$ plus $h$. 4 plus 5 is 9, and 2 times 4 times 9 is 72.'
        write: '$2\pi r(r + h) = 2\pi(4)(9) = 72\pi\ \checkmark$'
