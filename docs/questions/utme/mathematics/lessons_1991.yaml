# UTME 1991 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1991.yaml. Answers match that file.
format_version: 1
exam_year: 1991
lessons:
  1:
    moments:
      - say: 'We are asked to simplify 3 and a third, minus 1 and a quarter times 2 over 3, plus 1 and 2 over 5.'
        write: '$3\tfrac{1}{3} - 1\tfrac{1}{4} \times \tfrac{2}{3} + 1\tfrac{2}{5}$'
      - say: 'The order of operations decides this one. Multiplication is done before addition and subtraction, even though it sits in the middle of the line. So we start with 1 and a quarter times 2 over 3.'
        write: 'Multiply first: $1\tfrac{1}{4} \times \tfrac{2}{3}$'
      - say: 'Change 1 and a quarter into an improper fraction. 1 times 4 is 4, plus 1 is 5, so it is 5 over 4.'
        write: '$1\tfrac{1}{4} = \dfrac{1 \times 4 + 1}{4} = \dfrac{5}{4}$'
      - say: 'Now multiply. Tops together: 5 times 2 is 10. Bottoms together: 4 times 3 is 12.'
        write: '$\dfrac{5}{4} \times \dfrac{2}{3} = \dfrac{5 \times 2}{4 \times 3} = \dfrac{10}{12}$'
      - say: 'Divide the top and bottom of 10 over 12 by 2, and it becomes 5 over 6.'
        write: '$= \dfrac{5}{6}$'
      - say: 'So the multiplication in the middle gives 5 over 6. Put it back into the line in its place.'
        write: 'Expression $= 3\tfrac{1}{3} - \dfrac{5}{6} + 1\tfrac{2}{5}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= 65'}, at: '65', text: 'product'}
      - say: 'Now turn the other two mixed numbers into improper fractions. 3 times 3 is 9, plus 1 is 10, so 3 and a third is 10 over 3.'
        write: '$3\tfrac{1}{3} = \dfrac{3 \times 3 + 1}{3} = \dfrac{10}{3}$'
      - say: '1 times 5 is 5, plus 2 is 7, so 1 and 2 over 5 is 7 over 5.'
        write: '$1\tfrac{2}{5} = \dfrac{1 \times 5 + 2}{5} = \dfrac{7}{5}$'
      - say: 'Using those two, the expression is 10 over 3, minus 5 over 6, plus 7 over 5.'
        write: 'Expression $= \dfrac{10}{3} - \dfrac{5}{6} + \dfrac{7}{5}$'
        point:
          - {line: 8, kind: move, from: {line: 6, at: '= 310'}, at: '310', text: '3⅓'}
          - {line: 8, kind: move, from: {line: 7, at: '= 57'}, at: '57', text: '1⅖'}
      - say: 'To add and subtract, we need one common denominator. The denominators are 3, 6 and 5, and the smallest number all three divide into is 30.'
        write: 'LCM of 3, 6 and 5 $= 30$'
      - say: '30 divided by 3 is 10, so 10 over 3 becomes 100 over 30. 30 divided by 6 is 5, so 5 over 6 becomes 25 over 30. 30 divided by 5 is 6, so 7 over 5 becomes 42 over 30.'
        write: '$= \dfrac{100}{30} - \dfrac{25}{30} + \dfrac{42}{30}$'
      - say: 'Now everything is over 30, so we combine the tops. 100 minus 25 is 75, and 75 plus 42 is 117.'
        write: '$= \dfrac{100 - 25 + 42}{30} = \dfrac{117}{30}$'
      - say: 'Back to a mixed number. 30 goes into 117 three times, which uses up 90, and 117 minus 90 leaves 27. So it is 3 and 27 over 30.'
        write: '$= 3\tfrac{27}{30}$'
      - say: 'Finally, 27 and 30 both divide by 3, so 27 over 30 is 9 over 10. The answer is 3 and 9 over 10, which is answer choice B.'
        write: '$= 3\tfrac{9}{10}$'
        answer: true
    traps:
      A: 'You went for 2 and 17 over 30. That is too small. Do the multiplication first to get 5 over 6, then put all three fractions over 30: 100 minus 25 plus 42 is 117 over 30, which is 3 and 9 over 10.'
      C: 'You went for 4 and 1 over 10, which is 123 over 30. Check each fraction over 30: 10 over 3 is 100, 5 over 6 is 25 and 7 over 5 is 42, and 100 minus 25 plus 42 is 117, not 123.'
      D: 'You went for 4 and 11 over 36. The lowest common denominator of 3, 6 and 5 is 30, not 36. Multiply first, then put everything over 30.'

  2:
    moments:
      - say: 'In some base $n$, 7056 minus 4577 gives 2257. We need to find the base $n$.'
        write: '$7056_{n} - 4577_{n} = 2257_{n}$'
      - say: 'First, look at the digits. The biggest digit used is 7, and every digit must be smaller than the base. So $n$ is at least 8, and every option passes that test.'
        write: 'Biggest digit is 7, so $n \ge 8$'
      - say: 'The quickest way in is the units column. 6 take away 7 cannot be done, so we borrow from the next column. In base $n$, a borrowed 1 is worth $n$ units.'
        write: 'Units column: $6 - 7$ needs a borrow of $n$'
      - say: 'So the units column becomes 6 plus $n$, minus 7, and that must equal the 7 we see in the units of the answer.'
        write: '$6 + n - 7 = 7$'
      - say: '6 minus 7 is negative 1, so $n$ minus 1 equals 7.'
        write: '$n - 1 = 7$'
      - say: 'Add 1 to both sides, and $n$ is 8.'
        write: '$n = 8$'
      - say: 'Let''s make sure by turning all three numbers into base ten. In base 8, the place values are 8 cubed, 8 squared, 8 and 1: that is 512, 64, 8 and 1.'
        write: 'Base 8 place values: $512,\ 64,\ 8,\ 1$'
      - say: 'So 7056 in base 8 is 7 times 512, plus 0 times 64, plus 5 times 8, plus 6.'
        write: '$7056_{8} = 7(512) + 0(64) + 5(8) + 6$'
      - say: '7 times 512 is 3584, and 5 times 8 is 40. 3584 plus 40 plus 6 is 3630.'
        write: '$= 3584 + 0 + 40 + 6 = 3630$'
      - say: 'Now 4577 in base 8 is 4 times 512, plus 5 times 64, plus 7 times 8, plus 7.'
        write: '$4577_{8} = 4(512) + 5(64) + 7(8) + 7$'
      - say: '4 times 512 is 2048, 5 times 64 is 320, and 7 times 8 is 56. 2048 plus 320 is 2368, plus 56 is 2424, plus 7 is 2431.'
        write: '$= 2048 + 320 + 56 + 7 = 2431$'
      - say: 'Take the two numbers we just found: 3630 minus 2431 is 1199.'
        write: 'Difference: $3630 - 2431 = 1199$'
        point:
          - {line: 11, kind: move, from: {line: 8, at: '= 3630'}, at: '3630', text: '7056'}
          - {line: 11, kind: move, from: {line: 10, at: '= 2431'}, at: '2431', text: '4577'}
      - say: 'And the answer, 2257 in base 8, is 2 times 512, plus 2 times 64, plus 5 times 8, plus 7.'
        write: '$2257_{8} = 2(512) + 2(64) + 5(8) + 7$'
      - say: '1024 plus 128 is 1152, plus 40 is 1192, plus 7 is 1199. That matches the difference, so the base is 8, which is answer choice A.'
        write: '$= 1024 + 128 + 40 + 7 = 1199$, so $n = 8$'
        answer: true
    traps:
      B: 'You went for 9. Test the units column: 6 plus 9 minus 7 is 8, but the answer shows 7 there. Only base 8 gives 6 plus 8 minus 7, which is 7.'
      C: 'You went for 10, the base we use every day. But in base ten 7056 minus 4577 is 2479, not 2257, so base ten does not work.'
      D: 'You went for 11. In the units column, 6 plus 11 minus 7 is 10, not the 7 in the answer. Only base 8 makes that column work.'

  3:
    moments:
      - say: 'We need the value of this expression, correct to 3 decimal places. We work out each bracket, then subtract.'
        write: '$\left(\dfrac{1}{0.05} \div \dfrac{1}{5.005}\right) - (0.05 \times 2.05)$'
      - say: 'Start with 1 over 0.05. Multiply the top and bottom by 100 to clear the decimal. That gives 100 over 5, which is 20.'
        write: '$\dfrac{1}{0.05} = \dfrac{100}{5} = 20$'
      - say: 'Next, dividing by a fraction means multiplying by it turned upside down. 1 over 5.005 turned upside down is 5.005.'
        write: '$20 \div \dfrac{1}{5.005} = 20 \times 5.005$'
      - say: 'Split the 5.005 into 5 and 0.005. 20 times 5 is 100, and 20 times 0.005 is 0.1.'
        write: '$= 20 \times 5 + 20 \times 0.005 = 100 + 0.1$'
      - say: 'So the first bracket is 100.1.'
        write: 'First bracket $= 100.1$'
      - say: 'Now the second bracket, 0.05 times 2.05. Ignore the decimal points for a moment: 5 times 205 is 1025.'
        write: '$5 \times 205 = 1025$'
      - say: '0.05 has 2 decimal places and 2.05 has 2, so the answer has 4 decimal places. 1025 becomes 0.1025.'
        write: 'Second bracket: $0.05 \times 2.05 = 0.1025$'
      - say: 'Now take the second bracket away from the first. Write 100.1 as 100.1000 so the decimal places line up. The difference is 99.9975.'
        write: 'Expression $= 100.1000 - 0.1025 = 99.9975$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '100.1'}, at: '100.1000', text: 'first'}
          - {line: 7, kind: move, from: {line: 6, at: '= 0.1025'}, at: '0.1025', text: 'second'}
      - say: 'To round to 3 decimal places, look at the fourth decimal digit. It is 5, so the third place rounds up, and 99.997 becomes 99.998.'
        write: '$99.9975 \approx 99.998$'
      - say: 'A quick size check: the first bracket is about 100 and we take away about a tenth, so the answer must be just under 100. So it is 99.998, which is answer choice A.'
        write: 'To 3 decimal places: $99.998$'
        answer: true
    traps:
      B: 'You went for 98.999. That is about 1 too small. The first bracket is 100.1 and we take away only 0.1025, so the answer is 99.9975, which rounds to 99.998.'
      C: 'You went for 89.899. That is about 10 too small. Check the first bracket: 20 times 5.005 is 100.1, and taking away 0.1025 leaves 99.9975.'
      D: 'You went for 9.998. That is ten times too small, a decimal point slip. Remember that 1 divided by 0.05 is 20, because dividing by a small number makes the answer bigger.'

  4:
    moments:
      - say: 'We want 62 over 3 as a decimal, correct to 3 significant figures.'
        write: '$\dfrac{62}{3}$ to 3 significant figures'
      - say: 'First, the division. 3 times 20 is 60, so 3 goes into 62 twenty times with 2 left over.'
        write: '$62 = 3 \times 20 + 2$'
      - say: 'So 62 over 3 is 20, plus the 2 left over divided by 3.'
        write: '$\dfrac{62}{3} = 20 + \dfrac{2}{3}$'
      - say: 'Now 2 over 3 as a decimal. 3 into 2.0 goes 0.6 times with 0.2 left over, and that happens again and again, so the 6 repeats forever.'
        write: '$\dfrac{2}{3} = 0.6666\ldots$'
      - say: 'Put the two parts together: 20 plus 0.6666 and so on.'
        write: '$\dfrac{62}{3} = 20.6666\ldots$'
      - say: 'Significant figures are counted from the first non-zero digit, whichever side of the decimal point it is on. The first is 2, the second is 0, and the third is 6.'
        write: 'First three figures: $2,\ 0,\ 6$'
      - say: 'So the answer will be either 20.6 or 20.7. To decide, we look at the next digit, the fourth one, which is another 6.'
        write: 'Fourth figure: $6$'
        point:
          - {line: 4, kind: underline, at: '20.6', text: 'keep three'}
      - say: 'That 6 is 5 or more, so we round the last kept digit up. The 6 in the first decimal place becomes a 7.'
        write: '$6 \ge 5$, so $20.6 \to 20.7$'
      - say: 'So 62 over 3 is 20.7, correct to 3 significant figures, which is answer choice D.'
        write: '$\dfrac{62}{3} = 20.7$ to 3 s.f.'
        answer: true
    traps:
      A: 'You went for 20.6. That chops off the digits without rounding. The next digit is a 6, which is 5 or more, so the 6 must round up to 7.'
      B: 'You went for 20.667. That is correctly rounded, but to 5 significant figures. The question asks for 3: the digits 2, 0 and 7.'
      C: 'You went for 20.67. That is correctly rounded, but to 4 significant figures. The question asks for only 3, which gives 20.7.'

  5:
    moments:
      - say: 'Factory P makes 20,000 bags a day and factory Q makes 15,000. P goes down by 5% and Q goes up by 5%. We want the overall loss per day.'
        write: 'P makes $20{,}000$, Q makes $15{,}000$'
      - say: 'It is tempting to think the two 5% changes cancel out. They don''t, because they are 5% of different amounts. So we work out each change in actual bags.'
      - say: '5% means 5 over 100, which is 0.05. So P loses 0.05 times its 20,000 bags.'
        write: 'P loses $0.05 \times 20{,}000$'
      - say: '0.05 times 20,000 is 1,000. So P makes 1,000 fewer bags a day.'
        write: '$= 1{,}000$ bags'
      - say: 'Q gains 5% of its 15,000 bags, which is 0.05 times 15,000.'
        write: 'Q gains $0.05 \times 15{,}000$'
      - say: '0.05 times 15,000 is 750. So Q makes 750 more bags a day.'
        write: '$= 750$ bags'
      - say: 'Now combine the two changes we just found. A loss counts as negative and a gain as positive, so it is negative 1,000 plus 750.'
        write: 'Net change $= -1{,}000 + 750$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '1,000'}, at: '1,000', text: 'loss'}
          - {line: 6, kind: move, from: {line: 5, at: '750'}, at: '750', text: 'gain'}
      - say: 'Negative 1,000 plus 750 is negative 250. The minus sign tells us it is a loss.'
        write: '$= -250$'
      - say: 'Let''s check with totals. Before the change, 20,000 plus 15,000 is 35,000 bags a day.'
        write: 'Before: $20{,}000 + 15{,}000 = 35{,}000$'
      - say: 'After the change, P makes 20,000 minus 1,000, which is 19,000, and Q makes 15,000 plus 750, which is 15,750. Together that is 34,750.'
        write: 'After: $19{,}000 + 15{,}750 = 34{,}750$'
      - say: '35,000 minus 34,750 is 250, the same as before. So the effective loss is 250 bags a day, which is answer choice A.'
        write: 'Loss $= 35{,}000 - 34{,}750 = 250$ bags'
        answer: true
    traps:
      B: 'You went for 750. That is only Q''s gain. P loses 1,000 bags, and the gain of 750 only partly makes up for it, leaving a loss of 250.'
      C: 'You went for 1,000. That is P''s loss on its own. Q gains 750 bags at the same time, so the overall loss is 1,000 minus 750, which is 250.'
      D: 'You went for 1,250. The gain and the loss go opposite ways, so take the 750 away from the 1,000. That leaves 250.'

  6:
    moments:
      - say: 'Musa borrows ₦10.00 at 2% a month simple interest, and pays back ₦8.00 after 4 months. How much does he still owe?'
        write: 'Borrowed ₦10.00 at 2% a month, repays ₦8.00 after 4 months'
      - say: 'Simple interest is always worked out on the amount first borrowed, so it is the same amount every month. We find one month''s interest, then the total, then take off the repayment.'
      - say: 'One month''s interest is 2% of ₦10. 2% is 0.02, so that is 0.02 times 10.'
        write: 'Interest for 1 month $= 0.02 \times 10$'
      - say: '0.02 times 10 is 0.20, so the interest is 20 kobo a month.'
        write: '$= 0.20$'
      - say: 'Over 4 months, the interest is 4 times that 0.20.'
        write: 'Interest for 4 months $= 4 \times 0.20$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= 0.20'}, at: '0.20', text: 'one month'}
      - say: '4 times 0.20 is 0.80.'
        write: '$= 0.80$'
      - say: 'We can check with the formula: interest equals $P$ times $R$ times $T$, over 100. Put in 10 for $P$, 2 for $R$ and 4 for $T$.'
        write: '$I = \dfrac{PRT}{100} = \dfrac{10 \times 2 \times 4}{100}$'
      - say: '10 times 2 is 20, times 4 is 80, and 80 over 100 is 0.80. The same interest.'
        write: '$= \dfrac{80}{100} = 0.80$'
      - say: 'So after 4 months his debt is the ₦10.00 he borrowed plus the ₦0.80 interest, which is ₦10.80.'
        write: 'Debt after 4 months $= 10.00 + 0.80 = 10.80$'
        point:
          - {line: 8, kind: move, from: {line: 5, at: '= 0.80'}, at: '+ 0.80', text: 'interest'}
      - say: 'But he then pays back ₦8.00. Take it away from that debt: 10.80 minus 8.00 is 2.80.'
        write: 'Still owed $= 10.80 - 8.00 = 2.80$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '= 10.80'}, at: '10.80', text: 'debt'}
          - {line: 9, kind: move, from: {line: 0, at: '8.00'}, at: '− 8.00', text: 'repaid'}
      - say: 'So he still owes ₦2.80, which is answer choice C.'
        write: 'Still owed: ₦2.80'
        answer: true
    traps:
      A: 'You went for ₦10.80. That is what he owes after 4 months, before paying anything back. He then repays ₦8.00, leaving ₦2.80.'
      B: 'You went for ₦10.67. That is not the interest we get. Simple interest is ₦0.20 a month, so ₦0.80 over 4 months, and after he repays ₦8.00 he owes ₦2.80.'
      D: 'You went for ₦2.67. The subtraction is right, but the interest is not. 2% of ₦10 for 4 months is exactly ₦0.80, so the debt is ₦10.80 and he still owes ₦2.80.'

  7:
    moments:
      - say: 'We mix 3 gallons of spirit that is 20% water with 5 gallons that is 15% water. What percentage of the mixture is water?'
        write: '$3 \text{ gal at } 20\%,\quad 5 \text{ gal at } 15\%$'
      - say: 'We can''t just average the two percentages, because there are different amounts of each spirit. So the first thing we need to do is find the actual gallons of water in each.'
      - say: '20% of 3 gallons is 0.20 times 3, which is 0.6 gallons of water.'
        write: 'Water in the first $= 0.20 \times 3 = 0.6$ gallons'
      - say: '15% of 5 gallons is 0.15 times 5, which is 0.75 gallons of water.'
        write: 'Water in the second $= 0.15 \times 5 = 0.75$ gallons'
      - say: 'Now add the two amounts of water we just found. 0.6 plus 0.75 is 1.35 gallons.'
        write: 'Total water $= 0.6 + 0.75 = 1.35$ gallons'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '= 0.6'}, at: '0.6', text: 'first'}
          - {line: 4, kind: move, from: {line: 3, at: '= 0.75'}, at: '+ 0.75', text: 'second'}
      - say: 'The whole mixture is 3 gallons plus 5 gallons, which is 8 gallons.'
        write: 'Total mixture $= 3 + 5 = 8$ gallons'
      - say: 'The percentage of water is the water over the whole mixture, times 100.'
        write: 'Water $= \dfrac{1.35}{8} \times 100\%$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '1.35 gallons'}, at: '1.35', text: 'water'}
          - {line: 6, kind: move, from: {line: 5, at: '= 8'}, at: '8', text: 'whole'}
      - say: '1.35 times 100 is 135, so this is 135 over 8 percent.'
        write: '$= \dfrac{135}{8}\%$'
      - say: '8 goes into 135 sixteen times, which uses up 128, and 135 minus 128 leaves 7. So it is 16 and 7 over 8 percent. As a decimal, that is 16.875.'
        write: '$= 16\tfrac{7}{8}\% = 16.875\%$'
      - say: 'Sense check: the answer must lie between 15% and 20%, and nearer 15% because there is more of that spirit. 16 and 7 over 8 fits.'
        write: 'Check: $15\% < 16\tfrac{7}{8}\% < 20\%$'
      - say: 'So the mixture is 16 and 7 over 8 percent water, which is answer choice B.'
        write: 'Water in mixture $= 16\tfrac{7}{8}\%$'
        answer: true
    traps:
      A: 'You went for 2 and 4 over 5 percent. That is far too small: mixing a 20% spirit with a 15% spirit must give something between 15% and 20%. Divide the 1.35 gallons of water by the 8 gallons of mixture.'
      C: 'You went for 18 and 1 over 8 percent. That leans too far towards the 20% spirit. There are 5 gallons at 15% and only 3 at 20%, so the answer sits nearer 15%: 135 over 8 is 16 and 7 over 8.'
      D: 'You went for 18 and 7 over 8 percent. That is even above the plain average of 17 and a half. There is more of the 15% spirit, so the mixture is nearer 15%: 135 over 8 gives 16 and 7 over 8.'

  8:
    moments:
      - say: 'We need the product of 27 over 5, 3 to the power negative 3, and 1 over 5 to the power negative 1.'
        write: '$\dfrac{27}{5} \times 3^{-3} \times \left(\dfrac{1}{5}\right)^{-1}$'
      - say: 'A product means we multiply them all together. First, let''s put each factor into a plain form. The first one, 27 over 5, is already plain.'
        write: 'First factor: $\dfrac{27}{5}$'
      - say: 'What does a negative index mean? It means take the reciprocal, turn it upside down. So 3 to the power negative 3 is 1 over 3 cubed.'
        write: '$3^{-3} = \dfrac{1}{3^{3}}$'
      - say: '3 cubed is 3 times 3 times 3. 3 times 3 is 9, and 9 times 3 is 27.'
        write: '$= \dfrac{1}{3 \times 3 \times 3} = \dfrac{1}{27}$'
      - say: 'The third factor is 1 over 5, to the power negative 1. The negative index again means turn it upside down, and 1 over 5 upside down is 5 over 1, which is just 5.'
        write: '$\left(\dfrac{1}{5}\right)^{-1} = \dfrac{5}{1} = 5$'
      - say: 'Now multiply the three plain forms we just found.'
        write: 'Product $= \dfrac{27}{5} \times \dfrac{1}{27} \times 5$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '= 271'}, at: '271', text: 'second'}
          - {line: 5, kind: move, from: {line: 4, at: '= 5'}, at: '× 5', text: 'third'}
      - say: 'Put it all over one line: on top, 27 times 1 times 5, and underneath, 5 times 27.'
        write: '$= \dfrac{27 \times 1 \times 5}{5 \times 27}$'
      - say: 'The 27 on top cancels with the 27 underneath, leaving 5 over 5.'
        write: '$= \dfrac{5}{5}$'
      - say: '5 over 5 is 1. So the product is 1, which is answer choice C.'
        write: '$= 1$'
        answer: true
    traps:
      A: 'You went for 5. The 27s cancel, and so do the two 5s: one under the 27 and one from 1 over 5 to the power negative 1. Once both pairs cancel, only 1 is left.'
      B: 'You went for 3. That happens if 3 to the power negative 3 is taken as 1 over 9. But 3 cubed is 27, not 9, so it is 1 over 27, and the product is 1.'
      D: 'You went for 1 over 25. That keeps 1 over 5 to the power negative 1 as 1 over 5. A negative index turns the number upside down, so it is 5, and the product is 1.'

  9:
    moments:
      - say: 'We want to simplify 2 log of 2 over 5, minus log of 72 over 125, plus log 9. The plan is to squeeze everything into one log, then match the options.'
        write: '$2\log\dfrac{2}{5} - \log\dfrac{72}{125} + \log 9$'
      - say: 'We need three laws of logs. A number in front can go up as a power. Adding logs means multiplying. Subtracting logs means dividing.'
        write: 'Laws: $n\log a = \log a^{n}$, $\ \log a + \log b = \log ab$, $\ \log a - \log b = \log\dfrac{a}{b}$'
      - say: 'First the power law. The 2 in front goes up as a power, and 2 over 5, squared, is 4 over 25.'
        write: '$2\log\dfrac{2}{5} = \log\left(\dfrac{2}{5}\right)^{2} = \log\dfrac{4}{25}$'
        point:
          - {line: 2, kind: move, from: {line: 2, at: '[[2]]log'}, at: '(52)[[2]]', text: 'up as the power'}
      - say: 'Put that back in, and the expression is log 4 over 25, minus log 72 over 125, plus log 9.'
        write: 'Expression $= \log\dfrac{4}{25} - \log\dfrac{72}{125} + \log 9$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '= [[log254]]'}, at: 'log254', text: 'power law'}
      - say: 'Subtracting a log means dividing, and adding a log means multiplying. So it all becomes one log.'
        write: '$= \log\left(\dfrac{4}{25} \div \dfrac{72}{125} \times 9\right)$'
        point:
          - {line: 1, kind: box, text: 'the laws'}
      - say: 'Dividing by 72 over 125 means multiplying by it turned upside down, 125 over 72.'
        write: '$= \log\left(\dfrac{4}{25} \times \dfrac{125}{72} \times 9\right)$'
      - say: '125 divided by 25 is 5, so the 25 and the 125 leave just a 5 on top.'
        write: '$= \log\left(\dfrac{4 \times 5 \times 9}{72}\right)$'
      - say: '4 times 5 is 20, and 20 times 9 is 180.'
        write: '$= \log\dfrac{180}{72}$'
      - say: 'Divide top and bottom by 36. 180 divided by 36 is 5, and 72 divided by 36 is 2.'
        write: '$= \log\dfrac{5}{2}$'
      - say: 'The options use log 2 and log 3, but no log 5. So let''s rewrite 5 over 2: multiply top and bottom by 2 to get 10 over 4.'
        write: '$= \log\dfrac{10}{4}$'
      - say: 'Now the division law backwards: the log of a quotient is the log of the top minus the log of the bottom.'
        write: '$= \log 10 - \log 4$'
      - say: 'In base ten, log 10 is 1. And 4 is 2 squared.'
        write: '$= 1 - \log 2^{2}$'
