  38:
    moments:
      - section: 'The question'
        say: 'Three equal lengths from one point $P$. That means isosceles triangles, and their base angles carry the 68 degrees up to $P$.'
        write: '$PQ = PR = PS$, $\angle SRT = 68^{\circ}$, $\angle QPS = ?$'
        point:
          - {figure: 0, kind: highlight, target: PQ}
          - {figure: 0, kind: highlight, target: PR}
          - {figure: 0, kind: highlight, target: PS, text: 'all equal'}
      - section: 'Solution'
        say: 'Solution. Name the base angles, $a$ in triangle $PQR$ and $b$ in triangle $PRS$. Then the straight line at $R$ connects them to the 68 degrees.'
        write: 'Solution'
        point:
          - {figure: 0, kind: arc, target: SRT, text: '68°'}
      - say: '$PQ$ equals $PR$, so triangle $PQR$ is isosceles, and its base angles at $Q$ and $R$ are equal. Let each be $a$.'
        write: 'Let $\angle PQR = \angle PRQ = a$ (base $\angle$s of isos. $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: PQR, text: 'a'}
          - {figure: 0, kind: arc, target: PRQ, text: 'a'}
      - say: '$PR$ equals $PS$, so triangle $PRS$ is isosceles too. Its base angles at $R$ and $S$ are equal. Let each be $b$.'
        write: 'Let $\angle PRS = \angle PSR = b$ (base $\angle$s of isos. $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: PRS, text: 'b'}
          - {figure: 0, kind: arc, target: PSR, text: 'b'}
      - say: 'At $R$, three angles sit along the straight line $QRT$, which are $a$, $b$ and the 68 degrees. The reason is that angles on a straight line add up to 180.'
        write: '$a + b + 68^{\circ} = 180^{\circ}$ ($\angle$s on a str. line)'
      - say: 'Take 68 to the other side, which gives 180 minus 68.'
        write: '$a + b = 180^{\circ} - 68^{\circ}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '+ 68∘'}, at: '− 68∘', text: 'across'}
      - say: '180 minus 68 is 112 degrees.'
        write: '$a + b = 112^{\circ}$'
      - say: 'Now the angles at $P$. In triangle $PQR$, the two base angles are $a$ each, so the angle at $P$ is 180 minus $2a$. The reason is the angle sum of a triangle.'
        write: '$\angle QPR = 180^{\circ} - 2a$ ($\angle$ sum of $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: QPR, text: '180° − 2a'}
      - say: 'In the same way, in triangle $PRS$ the angle at $P$ is 180 minus $2b$.'
        write: '$\angle RPS = 180^{\circ} - 2b$ ($\angle$ sum of $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: RPS, text: '180° − 2b'}
      - say: 'Angle $QPS$ is those two angles added together.'
        write: '$\angle QPS = (180^{\circ} - 2a) + (180^{\circ} - 2b)$'
      - say: '180 plus 180 is 360. And $2a$ plus $2b$ is 2 times, $a$ plus $b$.'
        write: '$\angle QPS = 360^{\circ} - 2(a + b)$'
      - say: 'Put in 112 for $a$ plus $b$.'
        write: '$\angle QPS = 360^{\circ} - 2 \times 112^{\circ}$'
        point:
          - {line: 11, kind: move, from: {line: 6, at: '112∘'}, at: '112∘', text: 'a + b'}
      - say: '2 times 112 is 224.'
        write: '$\angle QPS = 360^{\circ} - 224^{\circ}$'
      - say: '360 minus 224 is 136 degrees.'
        write: '$\angle QPS = 136^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: QPS, text: '136°'}
      - section: 'Check'
        say: 'Check with a circle. $Q$, $R$ and $S$ are all the same distance from $P$, so they lie on a circle with centre $P$. $PQ$, $PR$ and $PS$ are radii.'
        write: '$Q$, $R$, $S$ on a circle, centre $P$ (radii)'
      - say: 'At $R$, angle $QRS$ is 180 minus 68, which is 112. The reason is angles on a straight line.'
        write: '$\angle QRS = 180^{\circ} - 68^{\circ} = 112^{\circ}$ ($\angle$s on a str. line)'
      - say: 'Angle $QRS$ is at the circumference. The angle at the centre on the same arc is twice it, so 224 degrees, the reflex angle at $P$, on the side away from $R$.'
        write: 'Reflex $\angle QPS = 2 \times 112^{\circ} = 224^{\circ}$ ($\angle$ at centre $= 2 \times \angle$ at circumference)'
      - say: 'Angles at a point add up to 360. So angle $QPS$ is 360 minus 224, which is 136 again.'
        write: '$\angle QPS = 360^{\circ} - 224^{\circ} = 136^{\circ}$ ($\angle$s at a point) $\checkmark$'
      - say: 'Therefore angle $QPS$ is 136 degrees, option A.'
