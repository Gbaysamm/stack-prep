      C: 'You went for 112 degrees. That is $a$ plus $b$, the angle $QRS$ at $R$. The question asks for the angle at $P$, which is 360 minus 224, or 136.'
      D: 'You went for 68 degrees, the angle given at $R$. The angle at $P$ is 360 minus twice 112, which is 136 degrees.'

  39:
    moments:
      - section: 'The question'
        say: 'A flagstaff stands on top of a tower. From 60 m away, the top of the flagstaff is seen at 64 degrees and its bottom at 62 degrees. We want the length of the flagstaff.'
        write: '$60$ m away; elevation of top $64^{\circ}$, of bottom $62^{\circ}$'
      - section: 'Solution'
        say: 'Solution. Let me draw the tower $BC$ with the flagstaff $CD$ on top, and the man at $A$, 60 m from the foot $B$. Both angles are measured up from $AB$.'
        write: 'Solution: $AB = 60$ m, $\angle BAC = 62^{\circ}$, $\angle BAD = 64^{\circ}$'
        show_sketch: true
        'on': 'draw'
        point:
          - {figure: sketch, kind: circle, target: '60 m', text: 'adj'}
          - {figure: sketch, kind: arc, target: BAC, text: '62°'}
          - {figure: sketch, kind: arc, target: BAD, text: '64°'}
      - say: 'Let $h$ be the height of the tower, $BC$, and $f$ the length of the flagstaff, $CD$.'
        write: 'Let $BC = h$, $\ CD = f$'
        point:
          - {figure: sketch, kind: highlight, target: BC, text: 'h'}
          - {figure: sketch, kind: highlight, target: CD, text: 'f'}
      - section: 'The tower'
        say: 'In triangle $ABC$, from 62 degrees, $h$ is opposite and 60 is adjacent. Opposite and adjacent means TOA, so tangent.'
        write: '$\tan 62^{\circ} = \dfrac{\text{opp}}{\text{adj}} = \dfrac{h}{60}$ (TOA)'
        point:
          - {figure: sketch, kind: underline, target: AB, text: 'adj'}
      - say: 'Cross-multiply, and $h$ is 60 tan 62. Call this equation 1.'
        write: '$h = 60\tan 62^{\circ}$ ... (1)'
      - section: 'Tower and flagstaff'
        say: 'In triangle $ABD$, from 64 degrees, the whole height $BD$, which is $h$ plus $f$, is opposite. TOA again.'
        write: '$\tan 64^{\circ} = \dfrac{h + f}{60}$ (TOA)'
      - say: 'Cross-multiply, so $h$ plus $f$ is 60 tan 64. Call this equation 2.'
        write: '$h + f = 60\tan 64^{\circ}$ ... (2)'
      - section: 'The flagstaff'
        say: 'Subtract equation 1 from equation 2. The $h$ cancels, leaving the flagstaff.'
        write: '(2) $-$ (1): $f = 60\tan 64^{\circ} - 60\tan 62^{\circ}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '=60tan64∘'}, at: '=[[60tan64∘]]−', text: '(2)'}
          - {line: 7, kind: move, from: {line: 4, at: '=60tan62∘'}, at: '−[[60tan62∘]]', text: '(1)'}
          - {figure: sketch, kind: circle, target: f, text: 'what is left'}
      - say: 'Both terms have 60, so take out the common factor.'
        write: '$f = 60(\tan 64^{\circ} - \tan 62^{\circ})$'
      - say: 'Therefore the length of the flagstaff is 60 times, tan 64 minus tan 62.'
        write: '$\therefore$ Flagstaff $= 60(\tan 64^{\circ} - \tan 62^{\circ})$'
      - section: 'Check'
        say: 'Check the size with the tables. Tan 64 is 2.0503 and tan 62 is 1.8807. The difference is 0.1696, and 60 times that is about 10.2 m, which is a sensible flagstaff, and positive.'
        write: 'Check: $60(2.0503 - 1.8807) = 60 \times 0.1696 \approx 10.2$ m $\checkmark$'
      - section: 'Answer'
        say: 'So the flagstaff is 60 times, tan 64 minus tan 62, which is answer choice D.'
        write: '$\therefore 60(\tan 64^{\circ} - \tan 62^{\circ})$'
        answer: true
    traps:
      A: 'You went for 60 times, tan 62 minus tan 64. That subtracts the wrong way: (1) minus (2) instead of (2) minus (1). Tan 62 is smaller than tan 64, so it is negative, and a length cannot be.'
      B: 'You went for the cotangent form. Cotangent comes in only when the height is known and the ground distance is wanted. Here the 60 m is the ground distance, the adjacent side, so each height is 60 tan.'
      C: 'You went for 60 times, cot 62 minus cot 64. The 60 m is adjacent to the angle, so the heights are 60 tan 62 and 60 tan 64, not cotangents.'

  40:
    moments:
      - section: 'The question'
        say: 'Simplify cos squared $x$, times sec squared $x$ plus sec squared $x$ tan squared $x$. One identity and one reciprocal do it.'
        write: 'Simplify $\cos^{2}x\left(\sec^{2}x + \sec^{2}x\tan^{2}x\right)$'
      - section: 'Solution'
        say: 'Solution. Inside the bracket, both terms have sec squared $x$. So factorise by taking it out as a common factor.'
        write: 'Solution: $= \cos^{2}x \cdot \sec^{2}x\left(1 + \tan^{2}x\right)$'
      - say: 'The identity we need comes from dividing sin squared plus cos squared equals 1 by cos squared. Then 1 plus tan squared equals sec squared.'
        write: 'Identity: $1 + \tan^{2}x = \sec^{2}x$'
      - say: 'Replace the bracket with sec squared $x$.'
        write: '$= \cos^{2}x \cdot \sec^{2}x \cdot \sec^{2}x$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '= [[sec2x]]'}, at: 'sec2x⋅[[sec2x]]', text: '1 + tan²x'}
      - say: 'Sec is the reciprocal of cos, so sec $x$ is 1 over cos $x$. So sec squared $x$ is 1 over cos squared $x$.'
        write: '$\sec^{2}x = \dfrac{1}{\cos^{2}x}$'
      - say: 'So cos squared $x$ times sec squared $x$ is cos squared over cos squared, which is 1.'
        write: '$\cos^{2}x \cdot \dfrac{1}{\cos^{2}x} = 1$'
      - say: 'That leaves 1 times sec squared $x$.'
        write: '$= 1 \times \sec^{2}x = \sec^{2}x$'
      - section: 'Check'
        say: 'Check with $x$ equal to 60 degrees. From the half equilateral triangle, cos 60 is 1 over 2, so cos squared is 1 over 4, sec squared is 4 and tan squared is 3.'
        write: 'Check $x = 60^{\circ}$: $\cos^{2} = \dfrac{1}{4}$, $\sec^{2} = 4$, $\tan^{2} = 3$'
      - say: 'In the question, we have 1 over 4, times 4 plus 4 times 3. 4 plus 12 is 16, and 16 over 4 is 4. Our answer, sec squared 60, is also 4.'
        write: '$\dfrac{1}{4}(4 + 12) = 4 = \sec^{2}60^{\circ}\ \checkmark$'
      - section: 'Answer'
        say: 'So the expression simplifies to sec squared $x$, which is answer choice C.'
        write: '$\therefore \cos^{2}x\left(\sec^{2}x + \sec^{2}x\tan^{2}x\right) = \sec^{2}x$'
        answer: true
    traps:
      A: 'You went for tan $x$. At 60 degrees tan is about 1.73, but the expression is 4. Factorise sec squared $x$ and use 1 plus tan squared equals sec squared.'
      B: 'You went for tan $x$ sec $x$. At 60 degrees that is about 3.46, but the expression is 4. The bracket becomes sec squared times sec squared, and cos squared cancels one of them.'
      D: 'You went for cosec squared $x$. At 60 degrees that is 4 over 3, not 4. The identity is 1 plus tan squared equals sec squared, which leaves sec squared $x$.'

  41:
    moments:
      - section: 'The question'
        say: 'Cos $x$ is root $a$ over $b$, and we want cosec $x$. With a ratio in letters, draw the triangle it describes.'
        write: '$\cos x = \dfrac{\sqrt{a}}{b}$; find $\operatorname{cosec} x$'
      - section: 'Solution'
        say: 'Solution. Let me draw a right-angled triangle $ABC$, with the right angle at $B$ and the angle $x$ at $A$.'
        write: 'Solution: right $\angle$ at $B$, $x$ at $A$'
        show_sketch: true
        'on': 'draw'
      - say: 'CAH says cos is adjacent over hypotenuse. So the adjacent side $AB$ is root $a$, and the hypotenuse $AC$ is $b$.'
        write: 'CAH: $\dfrac{\text{adj}}{\text{hyp}} = \dfrac{\sqrt{a}}{b}$: adj $= \sqrt{a}$, hyp $= b$'
        point:
          - {figure: sketch, kind: highlight, target: AB, text: 'adj = √a'}
          - {figure: sketch, kind: highlight, target: AC, text: 'hyp = b'}
      - section: 'The opposite side'
        say: 'By Pythagoras, the opposite squared is the hypotenuse squared minus the adjacent squared. Root $a$ squared is just $a$.'
        write: '$\text{opp}^{2} = b^{2} - (\sqrt{a})^{2} = b^{2} - a$'
        point:
          - {figure: sketch, kind: highlight, target: BC, text: 'opp'}
      - say: 'Take the square root.'
        write: '$\text{opp} = \sqrt{b^{2} - a}$'
        point:
          - {figure: sketch, kind: label, target: '?', text: '√(b² − a)'}
      - section: 'cosec x'
        say: 'Cosec is 1 over sin. SOH tells us sin is opposite over hypotenuse, so cosec is hypotenuse over opposite.'
        write: '$\operatorname{cosec} x = \dfrac{1}{\sin x} = \dfrac{\text{hyp}}{\text{opp}}$'
      - say: 'Substitute the hypotenuse, $b$, and the opposite side.'
        write: '$\operatorname{cosec} x = \dfrac{b}{\sqrt{b^{2} - a}}$'
      - section: 'Check'
        say: 'Check with the identity sin squared plus cos squared equals 1. Sin squared is opposite squared over $b$ squared, and cos squared is $a$ over $b$ squared.'
        write: 'Check: $\dfrac{b^{2} - a}{b^{2}} + \dfrac{a}{b^{2}} = \dfrac{b^{2}}{b^{2}} = 1\ \checkmark$'
      - section: 'Answer'
        say: 'So cosec $x$ is $b$ over root of $b$ squared minus $a$, which is answer choice A.'
        write: '$\therefore \operatorname{cosec} x = \dfrac{b}{\sqrt{b^{2} - a}}$'
        answer: true
    traps:
      B: 'You went for root of $b$ over $a$. That never finds the opposite side. Pythagoras gives it as root of $b$ squared minus $a$, and cosec is hypotenuse over opposite.'
      C: 'You went for $b$ over root of $b$ minus $a$. That squares the hypotenuse as $b$ instead of $b$ squared. Opp squared is $b$ squared minus $a$.'
      D: 'You went for root of $b$ minus $a$, over $a$. Cosec is hypotenuse over opposite: $b$ over root of $b$ squared minus $a$.'

