# UTME 1991 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1991.yaml. Answers match that file.
format_version: 1
exam_year: 1991
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'A minus, a times and a plus, all in one line. Work from left to right and you get a wrong option. BODMAS tells us which operation goes first.'
        write: 'Simplify $3\tfrac{1}{3} - 1\tfrac{1}{4} \times \tfrac{2}{3} + 1\tfrac{2}{5}$'
      - say: 'BODMAS: Brackets, Of, Division, Multiplication, Addition, Subtraction. There is no bracket and no "of", so the multiplication in the middle comes first.'
        write: 'Solution (BODMAS: M before A and S)'
      - section: 'M: multiply first'
        say: 'Change 1 and a quarter to an improper fraction. Picture a bar of quarters: 1 times 4 is 4, plus 1 is 5. So it is 5 over 4.'
        doodle: {name: 'custom:1991_q01_a', id: bar, caption: '1¼ bars: five quarters'}
        doodle_do: [{id: bar, op: label, part: bar, text: '5 quarters = 5/4'}]
        write: '$1\tfrac{1}{4} \times \dfrac{2}{3} = \dfrac{5}{4} \times \dfrac{2}{3}$'
      - say: 'Cancel first: 2 goes into 4 twice. That leaves 5 over 2 times 1 over 3, which is 5 over 6. Five sixths of one bar is shaded.'
        doodle_do: [{id: bar, op: stage, stage: 'custom:1991_q01_a2'}, {id: bar, op: label, part: share, text: '= 5/6 of a bar'}]
        write: '$= \dfrac{5}{2 \times 3} = \dfrac{5}{6}$'
        point:
          - {line: 3, kind: highlight, at: '= 65', to: {doodle: bar, part: share}}
      - say: 'Put the 5 over 6 back in its place in the line.'
        write: 'Expression $= 3\tfrac{1}{3} - \dfrac{5}{6} + 1\tfrac{2}{5}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= 65'}, at: '65', text: 'product'}
      - section: 'A and S: add and subtract'
        say: 'Change the other mixed numbers. 3 times 3 is 9, plus 1 is 10: 10 over 3. 1 times 5 is 5, plus 2 is 7: 7 over 5.'
        write: '$= \dfrac{10}{3} - \dfrac{5}{6} + \dfrac{7}{5}$'
      - say: 'The denominators are 3, 6 and 5. The L.C.M. of 3, 6 and 5 is 30.'
        write: 'L.C.M. of 3, 6 and 5 $= 30$'
      - say: '30 divided by 3 is 10, times 10 is 100. 30 divided by 6 is 5, times 5 is 25. 30 divided by 5 is 6, times 7 is 42.'
        write: '$= \dfrac{100 - 25 + 42}{30}$'
      - say: '100 minus 25 is 75, and 75 plus 42 is 117. So we have 117 over 30.'
        write: '$= \dfrac{117}{30}$'
      - say: '30 goes into 117 three times, which is 90, remainder 27. So it is 3 and 27 over 30. Cancel 27 over 30 by 3: 9 over 10.'
        write: '$\therefore$ Expression $= 3\tfrac{27}{30} = 3\tfrac{9}{10}$'
      - section: 'Check'
        say: 'Check with decimals: 3.333 minus 0.833 plus 1.4 is 3.9, and 3 and 9 over 10 is 3.9.'
        write: 'Check: $3.333 - 0.833 + 1.4 = 3.9 \ \checkmark$'
      - section: 'Answer'
        say: 'So the answer is 3 and 9 over 10, which is option B.'
        write: '$\therefore$ Answer $= 3\tfrac{9}{10}$'
        answer: true
    traps:
      A: 'You went for 2 and 17 over 30. That is too small. Multiply first to get 5 over 6, then put everything over 30: 100 minus 25 plus 42 is 117 over 30, which is 3 and 9 over 10.'
      C: 'You went for 4 and 1 over 10, which is 123 over 30. Check each fraction over 30: 10 over 3 is 100, 5 over 6 is 25 and 7 over 5 is 42, and 100 minus 25 plus 42 is 117, not 123.'
      D: 'You went for 4 and 11 over 36. The L.C.M. of 3, 6 and 5 is 30, not 36. Multiply first, then put everything over 30.'

  2:
    moments:
      - section: 'The question'
        say: 'In base n, seven-zero-five-six minus four-five-seven-seven gives two-two-five-seven. Find n. Set the subtraction out in columns, as you would in the exam.'
        write: '$\begin{array}{rrrrr} & 7 & 0 & 5 & 6 \\ - & 4 & 5 & 7 & 7 \\ \hline & 2 & 2 & 5 & 7 \end{array}$ in base $n$'
      - say: 'A base must be bigger than every digit it uses. The largest digit here is 7, so n is bigger than 7.'
        write: 'Solution: largest digit is 7, so $n > 7$'
      - section: 'The units column'
        say: 'Start with the units. 6 minus 7 cannot be done, so we borrow 1 from the next column.'
        write: 'Units: $6 - 7$, borrow 1 from the next column'
      - say: 'In base n, a borrowed 1 is worth n units, just as in base ten it is worth 10.'
        write: 'A borrowed 1 $= n$ units'
      - say: 'So the units become n plus 6. Taking away 7 must leave the 7 in the answer.'
        write: '$n + 6 - 7 = 7$'
      - say: '6 minus 7 is minus 1, so n minus 1 equals 7.'
        write: '$n - 1 = 7$'
      - say: 'Add 1 to both sides. n is 8.'
        write: '$n = 8$'
      - section: 'Check: add back in base 8'
        say: 'Check by adding the answer back to four-five-seven-seven, in base eight. We should get seven-zero-five-six.'
        write: '$\begin{array}{rrrrr} & 2 & 2 & 5 & 7 \\ + & 4 & 5 & 7 & 7 \\ \hline & & & & \end{array}$ in base 8'
      - say: 'Units: 7 plus 7 is 14. 14 is one eight and 6 over: write 6, carry 1.'
        write: 'Units: $7 + 7 = 14 = 1 \times 8 + 6$: write 6, carry 1'
      - say: 'Eights: 5 plus 7, plus the carried 1, is 13. That is one eight and 5 over: write 5, carry 1.'
        write: 'Eights: $5 + 7 + 1 = 13 = 1 \times 8 + 5$: write 5, carry 1'
      - say: 'Next column: 2 plus 5, plus 1, is 8. That is one eight and nought over: write 0, carry 1.'
        write: 'Next: $2 + 5 + 1 = 8 = 1 \times 8 + 0$: write 0, carry 1'
      - say: 'Last column: 2 plus 4, plus 1, is 7. Write 7.'
        write: 'Last: $2 + 4 + 1 = 7$: write 7'
      - say: 'We get seven-zero-five-six base eight, the number we started from. It agrees.'
        write: '$2257_{8} + 4577_{8} = 7056_{8}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore n is 8, which is option A.'
        write: '$\therefore n = 8$'
        answer: true
    traps:
      B: 'You went for 9. Test the units column: in base 9 the borrow is worth 9, and 9 plus 6 minus 7 is 8, but the answer shows 7. Only n equals 8 fits.'
      C: 'You went for 10, the base we use every day. In base ten, 7056 minus 4577 is 2479, not two-two-five-seven, so base ten does not work.'
      D: 'You went for 11. In the units column, 11 plus 6 minus 7 is 10, not the 7 in the answer. Only n equals 8 makes that column work.'

  3:
    moments:
      - section: 'The question'
        say: 'Two brackets, divisions by small decimals, and an answer to 3 decimal places. The exact answer lands right on a borderline, so the rounding rule decides it.'
        write: 'Find $\left(\dfrac{1}{0.05} \div \dfrac{1}{5.005}\right) - (0.05 \times 2.05)$ to 3 d.p.'
      - say: 'By BODMAS, each bracket is worked out first, then the subtraction. We round only at the very end.'
        write: 'Solution'
      - section: 'First bracket'
        say: '1 over 0.05: multiply the top and bottom by 100 to clear the decimal. That gives 100 over 5, which is 20.'
        write: '$\dfrac{1}{0.05} = \dfrac{100}{5} = 20$'
      - say: 'To divide by 1 over 5.005, multiply by its reciprocal, 5.005.'
        write: '$20 \div \dfrac{1}{5.005} = 20 \times 5.005$'
      - say: '20 times 5.005: 2 times 5.005 is 10.010, and times 10 is 100.10. So the first bracket is 100.1.'
        write: 'First bracket $= 100.1$'
      - section: 'Second bracket'
        say: 'Now 0.05 times 2.05. Leave out the points: 5 times 205 is 1,025. There are 2 plus 2, so 4, decimal places: 0.1025.'
        write: 'Second bracket $= 0.05 \times 2.05 = 0.1025$'
      - section: 'Subtract'
        say: 'Subtract with the decimal points in a line. Write 100.1 as 100.1000. The difference is 99.9975.'
        write: '$\begin{array}{r} 100.1000 \\ -\ \ \ 0.1025 \\ \hline 99.9975 \end{array}$'
      - section: 'Round to 3 d.p.'
        say: 'Picture 99.9975 on a number line, exactly half way between 99.997 and 99.998. Cut after 3 decimal places: 99.997, then 5.'
        doodle: {name: 'custom:1991_q03_a', id: sign, caption: '99.9975 between two posts'}
        write: '$99.997|5$'
      - say: 'The next digit is 5. The rule: 5 or more, add 1. So the 7 becomes 8, and the answer is 99.998.'
        doodle_do: [{id: sign, op: stage, stage: 'custom:1991_q03_a2'}, {id: sign, op: circle, part: high}]
        write: '$\therefore 99.9975 \approx 99.998$ (3 d.p.)'
        point:
          - {line: 8, kind: highlight, at: '99.998', to: {doodle: sign, part: high}}
      - section: 'Check'
        say: 'Check the size: the first bracket is about 100, and we take away about a tenth. So the answer must be just under 100. 99.998 fits.'
        write: 'Check: $100.1 - 0.1 \approx 100$, just under $\ \checkmark$'
      - section: 'Answer'
        say: 'So the answer, correct to 3 decimal places, is 99.998, which is option A.'
        write: '$\therefore$ Answer $= 99.998$ (3 d.p.)'
        answer: true
    traps:
      B: 'You went for 98.999. That is about 1 too small. The first bracket is 100.1 and we take away only 0.1025, so the answer is 99.9975, which is 99.998.'
      C: 'You went for 89.899. That is about 10 too small. 20 times 5.005 is 100.1, and taking away 0.1025 leaves 99.9975.'
      D: 'You went for 9.998. That is ten times too small. 1 divided by 0.05 is 20, because dividing by a small number makes the answer bigger.'

  4:
    moments:
      - section: 'The question'
        say: 'Four options, all starting 20.6 or 20.7. They differ in how many figures they keep and how they round. Three significant figures means exactly three.'
        write: 'Express $\dfrac{62}{3}$ as a decimal to 3 s.f.'
      - say: 'We divide 62 by 3, then round with a cut after the third significant figure.'
        write: 'Solution'
      - section: 'Divide'
        say: 'Short division. 3 into 6 goes 2. 3 into 2 goes 0, remainder 2. Put the point. 3 into 20 goes 6, remainder 2, and that happens again and again.'
        write: '$\dfrac{62}{3} = 62 \div 3 = 20.666\ldots$'
      - section: 'Round to 3 s.f.'
        say: 'Significant figures start at the first digit that is not zero: 2, then 0, then 6. Cut after the 6. The next digit is another 6.'
        write: '$20.6|66\ldots$'
      - say: 'Picture 20.666 between two posts, 20.6 and 20.7. The rule: next digit 5 or more, add 1. 6 is more than 5, so the 6 becomes 7.'
        doodle: {name: 'custom:1991_q04_a', id: sign, caption: '20.666… between 20.6 and 20.7'}
        doodle_do: [{id: sign, op: stage, stage: 'custom:1991_q04_a2'}, {id: sign, op: circle, part: high}]
        write: '$\therefore \dfrac{62}{3} \approx 20.7$ (3 s.f.)'
        point:
          - {line: 4, kind: highlight, at: '20.7', to: {doodle: sign, part: high}}
      - section: 'Check'
        say: 'Check: 20.7 times 3 is 62.1, very close to 62. And 20.7 has exactly 3 significant figures: 2, 0 and 7.'
        write: 'Check: $20.7 \times 3 = 62.1 \approx 62 \ \checkmark$'
      - section: 'Answer'
        say: 'So 62 over 3 is 20.7 to 3 significant figures, which is option D.'
        write: '$\therefore \dfrac{62}{3} = 20.7$ (3 s.f.)'
        answer: true
    traps:
      A: 'You went for 20.6. That cuts off the digits without rounding. The next digit after the cut is 6, which is 5 or more, so add 1: 20.7.'
      B: 'You went for 20.667. That is rounded correctly, but to 5 significant figures. The question asks for 3: the digits 2, 0 and 7.'
      C: 'You went for 20.67. That is rounded correctly, but to 4 significant figures. The question asks for 3, which gives 20.7.'

  5:
    moments:
      - section: 'The question'
        say: 'Factory P goes down 5 percent and factory Q goes up 5 percent. Do they cancel out? No, because they are 5 percent of different amounts. Picture the two factories.'
        doodle: {name: 'custom:1991_q05_a', id: plants, caption: '20,000 bags −5%, 15,000 bags +5%'}
        write: 'P: 20,000 bags a day, down 5%. Q: 15,000 bags a day, up 5%. Net loss $= ?$'
      - say: 'To find x percent of a quantity, we write x over 100 times the quantity. We work out each change in bags, then combine.'
        write: 'Solution: $x\%$ of $Q = \dfrac{x}{100} \times Q$'
      - section: 'Change in each factory'
        say: 'P loses 5 percent of 20,000. 5 over 100 times 20,000: cancel 100 into 20,000, which gives 200, and 5 times 200 is 1,000 bags.'
        doodle_do: [{id: plants, op: label, part: p-change, text: '−1,000 bags'}]
        write: 'Decrease in P $= \dfrac{5}{100} \times 20000 = 1000$ bags'
        point:
          - {line: 2, kind: highlight, at: '1000', to: {doodle: plants, part: p-change}}
      - say: 'Q gains 5 percent of 15,000. 15,000 over 100 is 150, and 5 times 150 is 750 bags.'
        doodle_do: [{id: plants, op: label, part: q-change, text: '+750 bags'}]
        write: 'Increase in Q $= \dfrac{5}{100} \times 15000 = 750$ bags'
        point:
          - {line: 3, kind: highlight, at: '750', to: {doodle: plants, part: q-change}}
      - section: 'Combine'
        say: 'The decrease is bigger than the increase, so overall the two factories lose. The effective loss is 1,000 minus 750.'
        write: 'Effective loss $= 1000 - 750$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '= 1000'}, at: '1000', text: 'P loses'}
          - {line: 4, kind: move, from: {line: 3, at: '= 750'}, at: '750', text: 'Q gains'}
      - say: '1,000 minus 750 is 250. So together they make 250 fewer bags a day.'
        doodle_do: [{id: plants, op: label, text: 'net: 250 fewer bags a day'}]
        write: '$\therefore$ Effective loss $= 250$ bags per day'
      - section: 'Check'
        say: 'Check with totals. Before: 20,000 plus 15,000 is 35,000 bags. After: 19,000 plus 15,750 is 34,750 bags.'
        write: 'Check: before $35000$; after $19000 + 15750 = 34750$'
      - say: '35,000 minus 34,750 is 250. The same loss.'
        doodle_do: [{id: plants, op: pulse}]
        write: '$35000 - 34750 = 250 \ \checkmark$'
      - section: 'Answer'
        say: 'So the effective loss is 250 bags a day, which is option A.'
        write: '$\therefore$ Effective loss $= 250$ bags'
        answer: true
    traps:
      B: 'You went for 750. That is only Q''s increase. P loses 1,000 bags, and Q''s 750 only partly makes up for it, leaving a loss of 250.'
      C: 'You went for 1,000. That is P''s decrease on its own. Q gains 750 at the same time, so the effective loss is 1,000 minus 750, which is 250.'
      D: 'You went for 1,250. The decrease and the increase go opposite ways, so subtract: 1,000 minus 750 is 250.'

  6:
    moments:
      - section: 'The question'
        say: 'Musa borrows ₦10 at 2 percent a month simple interest, and pays back ₦8 after 4 months. How much does he still owe? Picture his debt as a jar.'
        doodle: {name: 'custom:1991_q06_a', id: jar, caption: 'borrow ₦10, repay ₦8 after 4 months'}
        doodle_do: [{id: jar, op: fill, to: 0.9}]
        write: 'Borrowed ₦10.00 at 2% per month simple interest; repays ₦8.00 after 4 months'
      - say: 'Write the givens first. P is 10 naira, R is 2 percent per month, and T is 4 months. The rate is per month, so T stays in months.'
        write: 'Solution: $P = $₦$10,\ R = 2\%$ per month, $T = 4$ months'
      - section: 'The interest'
        say: 'Simple interest is the principal times the rate times the time, over 100.'
        write: '$I = \dfrac{PRT}{100}$'
      - say: 'Substitute: 10 times 2 times 4, over 100. 10 times 2 is 20, times 4 is 80. So 80 over 100, which is 80 kobo.'
        doodle_do: [{id: jar, op: stage, stage: 'custom:1991_q06_a2'}]
        write: '$I = \dfrac{10 \times 2 \times 4}{100} = \dfrac{80}{100} = $₦$0.80$'
      - section: 'The amount owed'
        say: 'The amount owed after 4 months is the principal plus the interest: A equals P plus I. 10 plus 0.80 is 10.80.'
        doodle_do: [{id: jar, op: fill, to: 1}, {id: jar, op: label, part: coins, text: '+₦0.80 interest'}]
        write: '$A = P + I = 10.00 + 0.80 = $₦$10.80$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '₦0.80'}, at: '+ [[0.80]]', text: 'interest'}
      - say: 'He then pays back ₦8.00, and the jar drops. Take it from the amount owed: 10.80 minus 8.00 is 2.80.'
        doodle_do: [{id: jar, op: fill, to: 0.26}, {id: jar, op: circle, part: repay}]
        write: 'Still owed $= 10.80 - 8.00 = $₦$2.80$'
        point:
          - {line: 5, kind: highlight, at: '₦2.80', to: {doodle: jar, part: owed}}
      - say: 'Therefore he still owes ₦2.80.'
        doodle_do: [{id: jar, op: label, part: owed, text: '₦2.80'}]
        write: '$\therefore$ Musa still owes ₦2.80'
      - section: 'Check'
        say: 'Check: each month the interest is 2 percent of ₦10, which is 20 kobo. Four months make 80 kobo, the same interest.'
        write: 'Check: $\dfrac{2}{100} \times 10 = $₦$0.20$ a month; $4 \times 0.20 = $₦$0.80 \ \checkmark$'
      - section: 'Answer'
        say: 'So Musa still owes ₦2.80, which is option C.'
        write: '$\therefore$ Still owed $=$ ₦2.80'
        answer: true
    traps:
      A: 'You went for ₦10.80. That is the amount owed after 4 months, before he repays anything. He then pays back ₦8.00, leaving ₦2.80.'
      B: 'You went for ₦10.67. That is not the amount we get. I is 10 times 2 times 4 over 100, which is ₦0.80, so A is ₦10.80; after repaying ₦8.00 he owes ₦2.80.'
      D: 'You went for ₦2.67. The subtraction is right, but the interest is not. 2 percent of ₦10 for 4 months is exactly ₦0.80, so A is ₦10.80 and he still owes ₦2.80.'

  7:
    moments:
      - section: 'The question'
        say: 'Two spirits are mixed: one is 20 percent water, the other 15 percent. Is the mixture 17 and a half percent water? No, because there is more of one spirit. Picture the two jugs.'
        doodle: {name: 'custom:1991_q07_a', id: spirits, caption: '3 gal at 20%, 5 gal at 15% water'}
        write: '3 gal at 20% water + 5 gal at 15% water. Water in the mixture $= ?\%$'
      - say: 'We find the actual gallons of water in each spirit, then the water as a percentage of the whole mixture. x percent of a quantity is x over 100 times the quantity.'
        write: 'Solution'
      - section: 'Water in each spirit'
        say: '20 percent of 3 gallons is 20 over 100 times 3. 20 times 3 is 60, over 100: 0.6 gallon of water.'
        doodle_do: [{id: spirits, op: label, part: jug1, text: '0.6 gal water'}]
        write: 'Water in 1st $= \dfrac{20}{100} \times 3 = 0.6$ gal'
      - say: '15 percent of 5 gallons is 15 over 100 times 5. 15 times 5 is 75, over 100: 0.75 gallon.'
        doodle_do: [{id: spirits, op: label, part: jug2, text: '0.75 gal water'}]
        write: 'Water in 2nd $= \dfrac{15}{100} \times 5 = 0.75$ gal'
      - section: 'The mixture'
        say: 'Pour both into the bucket. Total water is 0.6 plus 0.75, which is 1.35 gallons.'
        doodle_do: [{id: spirits, op: fill, to: 0.17}, {id: spirits, op: label, part: mix, text: '1.35 gal water'}]
        write: 'Total water $= 0.6 + 0.75 = 1.35$ gal'
        point:
          - {line: 4, kind: highlight, at: '1.35', to: {doodle: spirits, part: mix}}
      - say: 'Total mixture is 3 plus 5, which is 8 gallons.'
        write: 'Total mixture $= 3 + 5 = 8$ gal'
      - section: 'Percentage of water'
        say: 'Percentage of water is the water over the whole mixture, times 100 percent.'
        write: '$\%$ water $= \dfrac{\text{water}}{\text{mixture}} \times 100\%$'
      - say: 'Substitute: 1.35 gallons of water over 8 gallons of mixture.'
        write: '$= \dfrac{1.35}{8} \times 100\%$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '= 1.35'}, at: '81.35', text: 'water'}
      - say: '1.35 times 100 is 135. So it is 135 over 8 percent.'
        write: '$= \dfrac{135}{8}\%$'
      - say: '8 goes into 135 sixteen times, which is 128, remainder 7. So it is 16 and 7 over 8 percent.'
        doodle_do: [{id: spirits, op: label, part: pct, text: '16⅞%'}]
        write: '$\therefore$ Water $= 16\tfrac{7}{8}\%$'
      - section: 'Check'
        say: 'Check: the answer must lie between 15 and 20 percent, and nearer 15, because there is more of the 15 percent spirit. 16 and 7 over 8 fits.'
        write: 'Check: $15\% < 16\tfrac{7}{8}\% < 17\tfrac{1}{2}\% \ \checkmark$'
      - section: 'Answer'
        say: 'So the mixture is 16 and 7 over 8 percent water, which is option B.'
        write: '$\therefore$ Water in the mixture $= 16\tfrac{7}{8}\%$'
        answer: true
    traps:
      A: 'You went for 2 and 4 over 5 percent. That is far too small: mixing a 20 percent spirit with a 15 percent spirit must give between 15 and 20 percent. Divide the 1.35 gallons of water by the 8 gallons of mixture.'
      C: 'You went for 18 and 1 over 8 percent. That leans towards the 20 percent spirit. There are 5 gallons at 15 percent and only 3 at 20, so the answer is nearer 15: 135 over 8 is 16 and 7 over 8.'
      D: 'You went for 18 and 7 over 8 percent. That is even above the plain average of 17 and a half. There is more of the 15 percent spirit, so the mixture is nearer 15 percent: 16 and 7 over 8.'

  8:
    moments:
      - say: 'We need the product of 27 over 5, 3 to the power negative 3, and 1 over 5 to the power negative 1.'
        write: '$\dfrac{27}{5} \times 3^{-3} \times \left(\dfrac{1}{5}\right)^{-1}$'
      - say: 'A product means we multiply them all together. First, let''s put each factor into a plain form. The first one, 27 over 5, is already plain. The picture holds the other two: a tower of 3s, and a card showing 1 over 5.'
        write: 'First factor: $\dfrac{27}{5}$'
        doodle: {name: 'custom:1991_q08_a', id: tower, caption: 'a tower of 3s and a card, 1/5'}
      - say: 'What does a negative index mean? It means take the reciprocal, turn it upside down. Watch the tower go under a 1. So 3 to the power negative 3 is 1 over 3 cubed.'
        write: '$3^{-3} = \dfrac{1}{3^{3}}$'
        doodle_do:
          - {id: tower, op: stage, stage: 'custom:1991_q08_a2'}
      - say: '3 cubed is the tower: 3 times 3 times 3. 3 times 3 is 9, and 9 times 3 is 27.'
        write: '$= \dfrac{1}{3 \times 3 \times 3} = \dfrac{1}{27}$'
        doodle_do:
          - {id: tower, op: label, part: stack, text: '3 × 3 × 3 = 27'}
      - say: 'The third factor is 1 over 5, to the power negative 1. The negative index again means turn it upside down: watch the card flip. 1 over 5 upside down is 5 over 1, which is just 5.'
        write: '$\left(\dfrac{1}{5}\right)^{-1} = \dfrac{5}{1} = 5$'
        doodle_do:
          - {id: tower, op: stage, stage: 'custom:1991_q08_a3'}
      - say: 'Now multiply the three plain forms we just found.'
        write: 'Product $= \dfrac{27}{5} \times \dfrac{1}{27} \times 5$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '= 271'}, at: '271', text: 'second'}
          - {line: 5, kind: move, from: {line: 4, at: '= 5'}, at: '× 5', text: 'third'}
      - say: 'Put it all over one line: on top, 27 times 1 times 5, and underneath, 5 times 27.'
        write: '$= \dfrac{27 \times 1 \times 5}{5 \times 27}$'
      - say: 'The 27 on top cancels with the 27 underneath, the tower, leaving 5 over 5.'
        write: '$= \dfrac{5}{5}$'
        doodle_do:
          - {id: tower, op: cross, part: stack}
      - say: '5 over 5 is 1. So the product is 1, which is answer choice C.'
        write: '$= 1$'
        answer: true
    traps:
      A: 'You went for 5. The 27s cancel, and so do the two 5s: one under the 27 and one from 1 over 5 to the power negative 1. Once both pairs cancel, only 1 is left.'
      B: 'You went for 3. That happens if 3 to the power negative 3 is taken as 1 over 9. But 3 cubed is 27, not 9, so it is 1 over 27, and the product is 1.'
      D: 'You went for 1 over 25. That keeps 1 over 5 to the power negative 1 as 1 over 5. A negative index turns the number upside down, so it is 5, and the product is 1.'

  9:
    moments:
      - say: 'We want to simplify 2 log of 2 over 5, minus log of 72 over 125, plus log 9. The plan is to squeeze everything into one log, then match the options.'
        write: '$2\log\dfrac{2}{5} - \log\dfrac{72}{125} + \log 9$'
      - say: 'We need three laws of logs. A number in front can go up as a power. Adding logs means multiplying. Subtracting logs means dividing.'
        write: 'Laws: $n\log a = \log a^{n}$, $\ \log a + \log b = \log ab$, $\ \log a - \log b = \log\dfrac{a}{b}$'
      - say: 'First the power law. The 2 in front goes up as a power, and 2 over 5, squared, is 4 over 25.'
        write: '$2\log\dfrac{2}{5} = \log\left(\dfrac{2}{5}\right)^{2} = \log\dfrac{4}{25}$'
        point:
          - {line: 2, kind: move, from: {line: 2, at: '[[2]]log'}, at: '(52)[[2]]', text: 'up as the power'}
      - say: 'Put that back in, and the expression is log 4 over 25, minus log 72 over 125, plus log 9.'
        write: 'Expression $= \log\dfrac{4}{25} - \log\dfrac{72}{125} + \log 9$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '= [[log254]]'}, at: 'log254', text: 'power law'}
      - say: 'Subtracting a log means dividing, and adding a log means multiplying. So it all becomes one log.'
        write: '$= \log\left(\dfrac{4}{25} \div \dfrac{72}{125} \times 9\right)$'
        point:
          - {line: 1, kind: box, text: 'the laws'}
      - say: 'Dividing by 72 over 125 means multiplying by it turned upside down, 125 over 72.'
        write: '$= \log\left(\dfrac{4}{25} \times \dfrac{125}{72} \times 9\right)$'
      - say: '125 divided by 25 is 5, so the 25 and the 125 leave just a 5 on top.'
        write: '$= \log\left(\dfrac{4 \times 5 \times 9}{72}\right)$'
      - say: '4 times 5 is 20, and 20 times 9 is 180.'
        write: '$= \log\dfrac{180}{72}$'
      - say: 'Divide top and bottom by 36. 180 divided by 36 is 5, and 72 divided by 36 is 2.'
        write: '$= \log\dfrac{5}{2}$'
      - say: 'The options use log 2 and log 3, but no log 5. So let''s rewrite 5 over 2: multiply top and bottom by 2 to get 10 over 4.'
        write: '$= \log\dfrac{10}{4}$'
      - say: 'Now the division law backwards: the log of a quotient is the log of the top minus the log of the bottom.'
        write: '$= \log 10 - \log 4$'
      - say: 'In base ten, log 10 is 1: a log counts how many 10s multiply to make the number, and 10 is just one 10, as in the picture. And 4 is 2 squared: two 2s multiplied.'
        write: '$= 1 - \log 2^{2}$'
        doodle: {name: 'custom:1991_q09_a', id: blocks, caption: 'log counts the factors'}
        doodle_do:
          - {id: blocks, op: circle, part: ten}
      - say: 'The power law once more: log of 2 squared is 2 log 2, one log 2 for each block of 2. So the answer is 1 minus 2 log 2, which is answer choice D.'
        write: '$= 1 - 2\log 2$'
        doodle_do:
          - {id: blocks, op: highlight, part: twos}
        point:
          - {line: 12, kind: move, from: {line: 11, at: 'log2[[2]]'}, at: '[[2]]log', text: 'power to the front'}
          - {line: 12, kind: highlight, at: '2 log 2', to: {doodle: blocks, part: twos}}
        answer: true
    traps:
      A: 'You went for 1 minus 4 log 3. The 3s cancel completely: 72 is 8 times 9, and the 9 on top cancels it. So there is no log 3 left in the answer.'
      B: 'You went for negative 1 plus 2 log 3. The factors of 3 in 72 and 9 cancel, so log 3 cannot appear. Everything simplifies to log of 5 over 2, which is 1 minus 2 log 2.'
      C: 'You went for negative 1 plus 5 log 2. That is log of 32 over 10, which is log 3.2. The expression simplifies to log of 5 over 2, which is log 2.5, so it is log 10 minus log 4.'

  10:
    moments:
      - say: 'We need to rationalise this fraction, which means clearing the surds out of the denominator.'
        write: '$\dfrac{2\sqrt{3} + 3\sqrt{2}}{3\sqrt{2} - 2\sqrt{3}}$'
      - say: 'The tool is the conjugate: the same two terms with the sign between them changed. The denominator is 3 root 2 minus 2 root 3, so its conjugate is 3 root 2 plus 2 root 3.'
        write: 'Conjugate of $3\sqrt{2} - 2\sqrt{3}$ is $3\sqrt{2} + 2\sqrt{3}$'
      - say: 'Multiply the top and the bottom by that conjugate. Multiplying by something over itself is multiplying by 1, so the value does not change.'
        write: '$= \dfrac{(2\sqrt{3} + 3\sqrt{2})(3\sqrt{2} + 2\sqrt{3})}{(3\sqrt{2} - 2\sqrt{3})(3\sqrt{2} + 2\sqrt{3})}$'
      - say: 'Difference of two squares: a minus b, times a plus b, is a squared minus b squared.'
        write: 'Difference of two squares: $(a - b)(a + b) = a^{2} - b^{2}$'
      - say: 'Denominator first. It is a difference of two squares: the first term squared minus the second term squared. Picture each square as tiles.'
        write: 'Denominator $= (3\sqrt{2})^{2} - (2\sqrt{3})^{2}$'
        doodle: {name: 'custom:1991_q10_a', id: tiles, caption: 'surds squared, as tiles'}
      - say: '3 root 2 squared is 9 times 2, which is 18: 9 cells of 2 tiles. 2 root 3 squared is 4 times 3, which is 12: 4 cells of 3 tiles.'
        write: '$= 9 \times 2 - 4 \times 3 = 18 - 12$'
        doodle_do:
          - {id: tiles, op: label, part: big, text: '18 tiles'}
          - {id: tiles, op: label, part: small, text: '12 tiles'}
        point:
          - {line: 5, kind: highlight, at: '18', to: {doodle: tiles, part: big}}
      - say: 'Take the 12 tiles from the 18: 18 minus 12 is 6. The surds are gone from the bottom.'
        write: '$= 6$'
        doodle_do:
          - {id: tiles, op: label, text: '18 − 12 = 6'}
      - say: 'Now the numerator. Look closely: 2 root 3 plus 3 root 2, and 3 root 2 plus 2 root 3, are the same two terms in a different order. So the numerator is that bracket squared.'
        write: 'Numerator $= (2\sqrt{3} + 3\sqrt{2})^{2}$'
      - say: 'Squaring a sum: a plus b, all squared, is a squared plus 2ab plus b squared.'
        write: 'Perfect square: $(a + b)^{2} = a^{2} + 2ab + b^{2}$'
      - say: 'Expand it as the first term squared, plus twice the product of the two terms, plus the second term squared.'
        write: '$= (2\sqrt{3})^{2} + 2(2\sqrt{3})(3\sqrt{2}) + (3\sqrt{2})^{2}$'
      - say: '2 root 3 squared is 12. In the middle, 2 times 2 times 3 is 12, and root 3 times root 2 is root 6, so 12 root 6. 3 root 2 squared is 18.'
        write: '$= 12 + 12\sqrt{6} + 18$'
      - say: '12 plus 18 is 30.'
        write: '$= 30 + 12\sqrt{6}$'
      - say: 'Now put this new numerator over the new denominator, the 6 we found earlier.'
        write: 'Fraction $= \dfrac{30 + 12\sqrt{6}}{6}$'
        point:
          - {line: 12, kind: move, from: {line: 6, at: '= 6'}, at: '[[6]]30', text: 'denominator'}
          - {line: 12, kind: move, from: {line: 11, at: '30+126'}, at: '30+126', text: 'numerator'}
      - say: 'Divide each term by 6. 30 over 6 is 5, and 12 over 6 is 2. So the answer is 5 plus 2 root 6, which is answer choice B.'
        write: '$= \dfrac{30}{6} + \dfrac{12\sqrt{6}}{6} = 5 + 2\sqrt{6}$'
        answer: true
    traps:
      A: 'You went for 5 minus 2 root 6. That comes from squaring the top as $a$ minus $b$ instead of $a$ plus $b$. Its value is about 0.1, far too small: the original top is about 7.7 and the bottom about 0.78.'
      C: 'You went for 5 root 3. The top squares to 30 plus 12 root 6, and dividing by 6 gives 5 plus 2 root 6. The 5 and the surd are separate terms, and the surd is root 6, not root 3.'
      D: 'You went for 5. That is only part of it: the middle term of the square, 12 root 6, also has to be divided by 6, giving 5 plus 2 root 6.'

  11:
    moments:
      - say: 'We need to simplify 1 over 3 plus root 5, minus 1 over 3 minus root 5.'
        write: '$\dfrac{1}{3 + \sqrt{5}} - \dfrac{1}{3 - \sqrt{5}}$'
      - say: 'To subtract fractions we need a common denominator. Here the two denominators are conjugates, partners that differ only in the sign, so their product is a whole number.'
        write: 'Common denominator $= (3 + \sqrt{5})(3 - \sqrt{5})$'
      - say: 'Difference of two squares: a minus b, times a plus b, is a squared minus b squared.'
        write: 'Difference of two squares: $(a - b)(a + b) = a^{2} - b^{2}$'
      - say: 'That is a difference of two squares: 3 squared minus root 5 squared. Picture a 3 by 3 square of tiles, with a root 5 by root 5 square in its corner. 3 squared is 9, and root 5 squared is 5.'
        write: '$= 3^{2} - (\sqrt{5})^{2} = 9 - 5$'
        doodle: {name: 'custom:1991_q11_a', id: tiles, caption: '3 × 3 square, root-5 corner'}
        doodle_do:
          - {id: tiles, op: label, part: nine, text: '9'}
          - {id: tiles, op: label, part: five, text: '5'}
      - say: 'Take the corner away: 9 minus 5 is 4.'
        write: '$= 4$'
        doodle_do:
          - {id: tiles, op: cross, part: five}
          - {id: tiles, op: label, part: left, text: '4 left'}
        point:
          - {line: 4, kind: highlight, at: '4', to: {doodle: tiles, part: left}}
      - say: 'For the first fraction, multiply top and bottom by 3 minus root 5. The top becomes 3 minus root 5, and the bottom is the 4 we just found, the tiles left over.'
        write: '$\dfrac{1}{3 + \sqrt{5}} = \dfrac{3 - \sqrt{5}}{(3 + \sqrt{5})(3 - \sqrt{5})} = \dfrac{3 - \sqrt{5}}{4}$'
        doodle_do:
          - {id: tiles, op: pulse, part: left}
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= 4'}, at: '= [[4]]3', text: 'common bottom'}
      - say: 'For the second fraction, multiply top and bottom by 3 plus root 5. The top becomes 3 plus root 5, and again the bottom is 4.'
        write: '$\dfrac{1}{3 - \sqrt{5}} = \dfrac{3 + \sqrt{5}}{(3 - \sqrt{5})(3 + \sqrt{5})} = \dfrac{3 + \sqrt{5}}{4}$'
      - say: 'Now take the first minus the second. Both are over 4, so we subtract the tops, keeping the second top in a bracket.'
        write: 'Expression $= \dfrac{(3 - \sqrt{5}) - (3 + \sqrt{5})}{4}$'
      - say: 'The minus sign in front of the bracket changes both signs inside it.'
        write: '$= \dfrac{3 - \sqrt{5} - 3 - \sqrt{5}}{4}$'
      - say: '3 minus 3 is zero. Negative root 5 minus root 5 is negative 2 root 5.'
        write: '$= \dfrac{-2\sqrt{5}}{4}$'
      - say: '2 over 4 simplifies to 1 over 2, a half. So we have negative a half root 5.'
        write: '$= -\dfrac{1}{2}\sqrt{5}$'
      - say: 'Does the sign make sense? The second fraction has the smaller denominator, so it is the bigger fraction. Taking the bigger one away must leave a negative answer.'
        write: 'Check: $\dfrac{1}{3 - \sqrt{5}} > \dfrac{1}{3 + \sqrt{5}}$, so the answer is negative'
      - say: 'So the expression simplifies to negative a half root 5, which is answer choice A.'
        write: 'Expression $= -\dfrac{1}{2}\sqrt{5}$'
        answer: true
    traps:
      B: 'You went for positive a half root 5. The size is right but the sign is not. The second fraction is the bigger one, so subtracting it gives a negative answer.'
      C: 'You went for negative a quarter root 5. When you subtract, both root 5 terms are negative, so they make negative 2 root 5, not negative root 5. Over 4, that is negative a half root 5.'
      D: 'You went for zero. The two fractions are not equal: the 3s cancel, but the root 5 terms add up to negative 2 root 5. Over 4, that is negative a half root 5.'

  12:
    moments:
      - section: 'The question'
        say: 'Multiply $x$ squared minus $3x$ plus 1 by $x$ minus $a$. Six products hide in here, and missing just one of them lands you on a trap option.'
        write: '$(x^{2} - 3x + 1)(x - a)$'
        doodle: {name: 'custom:1991_q12_a', id: grid, caption: 'every term meets every term'}
      - section: 'Solution'
        say: 'Every term in the first bracket must meet every term in the second. So we multiply the whole first bracket by $x$, then by negative $a$.'
        write: 'Solution'
      - say: 'Write it out: $x$ times the bracket, minus $a$ times the bracket.'
        write: '$= x(x^{2} - 3x + 1) - a(x^{2} - 3x + 1)$'
      - say: 'Open the first bracket. $x$ times $x$ squared is $x$ cubed, $x$ times negative $3x$ is negative $3x$ squared, and $x$ times 1 is $x$. That is the top row of the grid.'
        write: '$x(x^{2} - 3x + 1) = x^{3} - 3x^{2} + x$'
        doodle_do:
          - {id: grid, op: stage, stage: 'custom:1991_q12_a2'}
      - say: 'Open the second bracket. Negative $a$ times $x$ squared is negative $ax$ squared. Negative $a$ times negative $3x$ is plus $3ax$. Negative $a$ times 1 is negative $a$.'
        write: '$-a(x^{2} - 3x + 1) = -ax^{2} + 3ax - a$'
        doodle_do:
          - {id: grid, op: stage, stage: 'custom:1991_q12_a3'}
        point:
          - {line: 4, kind: highlight, at: '+ 3ax', text: 'negative times negative', to: {doodle: grid, part: row2}}
      - say: 'Put the two rows together: all six boxes of the grid.'
        write: '$= x^{3} - 3x^{2} + x - ax^{2} + 3ax - a$'
        doodle_do:
          - {id: grid, op: pulse}
      - say: 'Collect like terms. Bring the two $x$ squared terms together, and the two $x$ terms together.'
        write: '$= x^{3} - 3x^{2} - ax^{2} + x + 3ax - a$'
      - say: 'Factorise the $x$ squared terms. Negative 3 $x$ squared minus $ax$ squared is negative, 3 plus $a$, $x$ squared.'
        write: '$-3x^{2} - ax^{2} = -(3 + a)x^{2}$'
      - say: 'Factorise the $x$ terms. $x$ plus $3ax$ is 1 plus $3a$, times $x$.'
        write: '$x + 3ax = (1 + 3a)x$'
      - say: 'Therefore the product is $x$ cubed, minus 3 plus $a$ $x$ squared, plus 1 plus $3a$ $x$, minus $a$.'
        write: '$\therefore x^{3} - (3 + a)x^{2} + (1 + 3a)x - a$'
        point:
          - {line: 9, kind: move, from: {line: 7, at: '= −(3+a)x2'}, at: '−(3+a)x2', text: 'x² terms'}
          - {line: 9, kind: move, from: {line: 8, at: '= (1+3a)x'}, at: '(1+3a)x', text: 'x terms'}
      - section: 'Check'
        say: 'Check with numbers. Take $x$ equals 2 and $a$ equals 1. The question gives 4 minus 6 plus 1, which is negative 1, times 2 minus 1, which is 1.'
        write: '$x = 2,\ a = 1$: $(4 - 6 + 1)(2 - 1) = -1$'
      - say: 'Our answer gives 8, minus 4 times 4, plus 4 times 2, minus 1. That is 8 minus 16 plus 8 minus 1, which is negative 1. They agree.'
        write: '$8 - 4(4) + 4(2) - 1 = -1\ \checkmark$'
      - say: 'So the product is option C.'
        write: '$x^{3} - (3 + a)x^{2} + (1 + 3a)x - a$ (C)'
        answer: true
    traps:
      A: 'You went for the one ending in negative 1. The last terms of the two brackets are 1 and negative $a$, and 1 times negative $a$ is negative $a$, not negative 1.'
      B: 'You went for the one with $3ax$ as the $x$ term. That forgets $x$ times 1 from the first bracket. The $x$ terms are $x$ plus $3ax$, which is 1 plus $3a$, times $x$.'
      D: 'You went for plus 3 plus $a$, times $x$ squared. Both $x$ squared terms, negative $3x$ squared and negative $ax$ squared, are negative, so the bracket takes a minus sign.'

  13:
    moments:
      - section: 'The question'
        say: 'Negative numbers, squares and two letters: a minefield for signs. Factorise first, and most of the danger disappears before we put any number in.'
        write: '$\dfrac{xy^{2} - x^{2}y}{x^{2} - xy}$, $x = -2,\ y = 3$'
      - section: 'Solution'
        say: 'With an algebraic fraction, we factorise the numerator and the denominator first, then cancel, then substitute.'
        write: 'Solution'
      - say: 'Numerator. Both terms contain $xy$, so take it out. $xy$ squared divided by $xy$ is $y$; $x$ squared $y$ divided by $xy$ is $x$.'
        write: 'Numerator: $xy^{2} - x^{2}y = xy(y - x)$'
      - say: 'Denominator. Both terms contain $x$, so take it out, leaving $x$ minus $y$.'
        write: 'Denominator: $x^{2} - xy = x(x - y)$'
      - say: 'Put the factorised forms back into the fraction.'
        write: '$= \dfrac{xy(y - x)}{x(x - y)}$'
      - say: 'Cancel the common factor $x$, top and bottom.'
        write: '$= \dfrac{y(y - x)}{x - y}$'
      - say: 'The brackets are not the same yet. $y$ minus $x$ is the negative of $x$ minus $y$: change the order of a subtraction and the sign changes.'
        write: '$y - x = -(x - y)$'
      - say: 'So replace $y$ minus $x$ on top with negative, $x$ minus $y$.'
        write: '$= \dfrac{-y(x - y)}{x - y}$'
      - say: 'Now the brackets are the same. Cancel the common factor $x$ minus $y$, and negative $y$ is left.'
        write: '$= -y$'
        point:
          - {line: 7, kind: strike, at: '−y([[x−y]])', text: 'cancel'}
          - {line: 7, kind: strike, at: '= [[x−y]]'}
      - say: 'Substitute $y$ equals 3.'
        write: '$= -(3) = -3$'
      - say: 'Therefore the value is negative 3.'
        write: '$\therefore$ Value $= -3$'
      - section: 'Check'
        say: 'Check by substituting straight into the question. Numerator: negative 2 times 3 squared, minus negative 2 squared times 3.'
        write: 'Numerator $= (-2)(9) - (4)(3)$'
      - say: 'Negative 2 times 9 is negative 18, and 4 times 3 is 12. Negative 18 minus 12 is negative 30.'
        write: '$= -18 - 12 = -30$'
      - say: 'Denominator: negative 2 squared is 4. Minus negative 2 times 3 is minus negative 6, which is plus 6. So 10.'
        write: 'Denominator $= 4 - (-6) = 10$'
      - say: 'Negative 30 over 10 is negative 3. Both ways agree.'
        write: '$\dfrac{-30}{10} = -3\ \checkmark$'
      - say: 'So the value is negative 3: option A.'
        write: '$\therefore -3$ (A)'
        answer: true
    traps:
      B: 'You went for negative 3 over 5. That is $y$ over $x$ minus $y$, 3 over negative 5. It comes from cancelling $y$ minus $x$ on top as if it were nothing. A bracket cancels only with an identical bracket.'
      C: 'You went for 3 over 5. Both the sign and the size are off. The numerator is negative 30 and the denominator is 10, so the value is negative 3.'
      D: 'You went for positive 3. That comes from cancelling $y$ minus $x$ with $x$ minus $y$ as if they were equal. They are negatives of each other, so a minus sign is left: negative $y$, which is negative 3.'

  14:
    moments:
      - say: 'A car goes $p$ km at $u$ km per hour, then $q$ km at $w$ km per hour. We want its average speed for the whole journey.'
        write: 'First leg: $p$ km at $u$ km/h; second leg: $q$ km at $w$ km/h'
      - say: 'Let me draw the route in two parts.'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: 'p km'}
          - {figure: sketch, kind: underline, target: 'q km'}
      - say: 'Here''s the one rule to hold on to. Average speed is total distance divided by total time. It is not the average of the two speeds on these two dials, because the car spends different amounts of time on each leg.'
        write: 'Average speed $= \dfrac{\text{total distance}}{\text{total time}}$'
        doodle: {name: 'custom:1991_q14_a', id: dials, caption: 'two legs, two speeds'}
      - say: 'The total distance is easy: $p$ plus $q$ km.'
        write: 'Total distance $= p + q$'
        point:
          - {figure: sketch, kind: circle, target: Calabar}
          - {figure: sketch, kind: circle, target: Benin, text: 'p + q km'}
      - say: 'Time equals distance divided by speed.'
        write: 'Time $= \dfrac{\text{distance}}{\text{speed}}$'
      - say: 'Now the times. Time is distance over speed. The first leg is $p$ km at $u$ km per hour, the left dial, so it takes $p$ over $u$ hours.'
        write: 'Time for first leg $= \dfrac{p}{u}$'
        doodle_do:
          - {id: dials, op: label, part: t1, text: 'p/u hours'}
        point:
          - {figure: sketch, kind: circle, target: 'p km'}
          - {figure: sketch, kind: circle, target: 'u km/h', text: 'p/u hours'}
          - {line: 5, kind: highlight, at: 'first leg', to: {doodle: dials, part: t1}}
      - say: 'The second leg is $q$ km at $w$ km per hour, the right dial, so it takes $q$ over $w$ hours.'
        write: 'Time for second leg $= \dfrac{q}{w}$'
        doodle_do:
          - {id: dials, op: label, part: t2, text: 'q/w hours'}
        point:
          - {figure: sketch, kind: circle, target: 'q km'}
          - {figure: sketch, kind: circle, target: 'w km/h', text: 'q/w hours'}
      - say: 'The total time is the sum of those two times, the two clocks.'
        write: 'Total time $= \dfrac{p}{u} + \dfrac{q}{w}$'
        doodle_do:
          - {id: dials, op: pulse, part: t1}
          - {id: dials, op: pulse, part: t2}
      - say: 'Add them over the common denominator $u w$. Multiply the top and bottom of $p$ over $u$ by $w$, and the top and bottom of $q$ over $w$ by $u$.'
        write: '$= \dfrac{pw}{uw} + \dfrac{qu}{uw}$'
      - say: 'So the total time is $p w$ plus $q u$, all over $u w$.'
        write: '$= \dfrac{pw + qu}{uw}$'
      - say: 'Now back to our rule: the total distance, $p$ plus $q$, divided by the total time we just found.'
        write: 'Average speed $= (p + q) \div \dfrac{pw + qu}{uw}$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {line: 10, kind: move, from: {line: 3, at: 'p + q'}, at: '(p + q)', text: 'distance'}
          - {line: 10, kind: move, from: {line: 9, at: 'uwpw+qu'}, at: 'uwpw+qu', text: 'total time'}
      - say: 'Dividing by a fraction means multiplying by it turned upside down.'
        write: '$= (p + q) \times \dfrac{uw}{pw + qu}$'
        point:
          - {line: 11, kind: move, from: {line: 10, at: 'uwpw+qu'}, at: 'pw+quuw', text: 'flipped'}
      - say: 'That gives $u w$ times $p$ plus $q$, over $p w$ plus $q u$. Written the way the options write it, the bottom is $w p$ plus $u q$.'
        write: '$= \dfrac{uw(p + q)}{wp + uq}$'
      - say: 'Let''s test it. If both legs are 60 km and both speeds are 30 km per hour, the average must be 30. Our formula gives 30 times 30 times 120, over 30 times 60 plus 30 times 60.'
        write: 'Test: $\dfrac{30 \times 30 \times 120}{30 \times 60 + 30 \times 60} = \dfrac{108\,000}{3600}$'
      - say: '108,000 over 3,600 is 30, just as it should be. So the average speed is $u w$ times $p$ plus $q$, over $w p$ plus $u q$, which is answer choice C.'
        write: '$= 30\ \checkmark$'
        answer: true
    traps:
      A: 'You went for $p$ plus $q$ over $u p$ plus $w q$. Speed times distance is not a time. The time for each leg is distance divided by speed: $p$ over $u$ and $q$ over $w$.'
      B: 'You went for $u$ plus $w$, adding the two speeds. If both speeds were 30 km per hour, that would give 60, which is impossible. Use total distance over total time.'
      D: 'You went for $w p$ plus $u q$ over $u$ plus $w q$. That is not total distance over total time. The total time is $p w$ plus $q u$ over $u w$, and dividing $p$ plus $q$ by it gives option C.'

  15:
    moments:
      - section: 'The question'
        say: '$w$ varies inversely as $uv$ over $u$ plus $v$, and $w$ is 8 when $u$ is 2 and $v$ is 6. We want the equation linking all three.'
        write: '$w = 8$ when $u = 2,\ v = 6$'
      - say: 'Solution. The variation statement: $w$ is proportional to 1 over that whole fraction.'
        write: 'Solution: $\ w \propto \dfrac{1}{\;\frac{uv}{u + v}\;}$'
      - say: 'Replace the sign with the constant $k$. Picture a see-saw: as one side goes up, the other comes down.'
        doodle: {name: 'custom:1991_q15_a', id: seesaw, caption: 'one goes up, the other down'}
        write: '$\therefore\ w = \dfrac{k}{\;\frac{uv}{u + v}\;}$'
      - say: 'Dividing by a fraction is multiplying by its reciprocal. So $w$ equals $k$ times $u$ plus $v$, over $uv$.'
        write: '$w = \dfrac{k(u + v)}{uv}$'
      - section: 'Find k'
        say: 'Substitute the given values: $w$ is 8, $u$ is 2 and $v$ is 6.'
        write: 'When $w = 8,\ u = 2,\ v = 6$: $\ 8 = \dfrac{k(2 + 6)}{2 \times 6}$'
      - say: '2 plus 6 is 8, and 2 times 6 is 12.'
        write: '$8 = \dfrac{8k}{12}$'
      - say: 'Cross multiply. 8 times 12 is 96.'
        write: '$8k = 96$'
      - say: 'Divide both sides by 8. 96 divided by 8 is 12.'
        doodle_do: [{id: seesaw, op: label, part: k, text: 'k = 12'}]
        write: '$\therefore\ k = 12$'
        point:
          - {line: 7, kind: highlight, at: 'k = 12', to: {doodle: seesaw, part: k}}
      - section: 'The equation'
        say: 'Put $k$ equals 12 back into the equation.'
        write: '$w = \dfrac{12(u + v)}{uv}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '12'}, at: '12(', text: 'k'}
      - say: 'Multiply both sides by $uv$ to clear the fraction.'
        write: '$\therefore\ uvw = 12(u + v)$'
      - section: 'Check'
        say: 'Check with the given values. $uvw$ is 2 times 6 times 8, which is 96. 12 times 2 plus 6 is 12 times 8, also 96.'
        write: 'Check: $\ 2 \times 6 \times 8 = 96,\ \ 12(2 + 6) = 96\ \checkmark$'
      - say: 'So the relationship is $uvw$ equals 12 times $u$ plus $v$: option C.'
        write: '$uvw = 12(u + v)$'
        answer: true
    traps:
      A: 'You went for $uvw$ equals 16 times $u$ plus $v$. The form is right, but the constant is not. With the given values, $uvw$ is 96 and $u$ plus $v$ is 8, so the constant is 96 over 8, which is 12.'
      B: 'You went for 16 $uv$ equals 3 $w$ times $u$ plus $v$. It fits the one set of values, but it says $w$ varies directly as $uv$ over $u$ plus $v$. The question says inversely.'
      D: 'You went for 12 $uvw$ equals $u$ plus $v$. The 12 is on the wrong side. With the given values, 12 times 96 is not 8. It should be $uvw$ equals 12 times $u$ plus $v$.'

  16:
    moments:
      - section: 'The question'
        say: 'Think of $g$ as a machine. Feed it $x$ plus 1 instead of $x$: how much more comes out? Most slips here come from squaring $x$ plus 1.'
        write: '$g(x) = x^{2} + 3x$'
        doodle: {name: 'custom:1991_q16_a', id: machine, caption: 'the machine g'}
      - section: 'Solution'
        say: 'First find $g$ of $x$ plus 1, then subtract $g$ of $x$.'
        write: 'Solution'
      - say: 'Replace every $x$ in the rule with the whole bracket, $x$ plus 1. That is what goes into the machine.'
        write: '$g(x + 1) = (x + 1)^{2} + 3(x + 1)$'
        doodle_do:
          - {id: machine, op: circle, part: in}
      - say: 'Open the first bracket. $x$ plus 1, squared, is $x$ plus 1 times $x$ plus 1: $x$ squared plus $x$ plus $x$ plus 1. Don''t lose the middle term.'
        write: '$(x + 1)^{2} = x^{2} + 2x + 1$'
      - say: 'Open the second bracket. 3 times $x$ plus 1 is $3x$ plus 3.'
        write: '$3(x + 1) = 3x + 3$'
      - say: 'Put the two pieces together.'
        write: '$g(x + 1) = x^{2} + 2x + 1 + 3x + 3$'
      - say: 'Collect like terms. $2x$ plus $3x$ is $5x$, and 1 plus 3 is 4. That is what comes out of the machine.'
        write: '$= x^{2} + 5x + 4$'
        doodle_do:
          - {id: machine, op: label, part: out, text: 'x² + 5x + 4'}
      - section: 'Subtract g(x)'
        say: 'Now subtract $g$ of $x$, $x$ squared plus $3x$. Keep it in a bracket, so the minus reaches both terms.'
        write: '$g(x + 1) - g(x)$'
        doodle_do:
          - {id: machine, op: stage, stage: 'custom:1991_q16_a2'}
      - say: 'Put in both expressions, each in its bracket.'
        write: '$= (x^{2} + 5x + 4) - (x^{2} + 3x)$'
      - say: 'Open the brackets. The minus sign changes both signs in the second bracket.'
        write: '$= x^{2} + 5x + 4 - x^{2} - 3x$'
      - say: 'Collect like terms. $x$ squared minus $x$ squared is zero. $5x$ minus $3x$ is $2x$. The 4 stays.'
        write: '$= 2x + 4$'
        doodle_do:
          - {id: machine, op: label, part: minus, text: 'leaves 2x + 4'}
      - say: 'Take out the common factor 2. Therefore $g$ of $x$ plus 1, minus $g$ of $x$, is 2 times $x$ plus 2.'
        write: '$\therefore g(x + 1) - g(x) = 2(x + 2)$'
      - section: 'Check'
        say: 'Check with $x$ equals 1. $g$ of 2 is 4 plus 6, which is 10. $g$ of 1 is 1 plus 3, which is 4. 10 minus 4 is 6.'
        write: '$g(2) - g(1) = 10 - 4 = 6$'
      - say: 'And 2 times, 1 plus 2, is 2 times 3, which is 6. It matches.'
        write: '$2(1 + 2) = 6\ \checkmark$'
      - say: 'So the answer is 2 times $x$ plus 2: option B.'
        write: '$\therefore 2(x + 2)$ (B)'
        answer: true
    traps:
      A: 'You went for $x$ plus 2. That is half the answer. It comes from squaring $x$ plus 1 as $x$ squared plus 1 and losing the middle term $2x$.'
      C: 'You went for $2x$ plus 1. That is only the change in the $x$ squared part. The $3x$ part changes too: 3 times $x$ plus 1, minus $3x$, adds another 3, giving $2x$ plus 4.'
      D: 'You went for $x$ plus 4. Check the $x$ terms: $2x$ plus $3x$ is $5x$, and $5x$ minus $3x$ leaves $2x$, not $x$. The answer is $2x$ plus 4.'

  17:
    moments:
      - section: 'The question'
        say: 'Four terms, and nothing common to all four. The trick is grouping: two pairs that turn out to share the same bracket. Picture each pair as a rectangle.'
        write: '$m^{3} - m^{2} + 2m - 2$'
        doodle: {name: 'custom:1991_q17_a', id: rects, caption: 'two rectangles, one width'}
      - section: 'Solution'
        say: 'We factorise by grouping: the first two terms together, and the last two together.'
        write: 'Solution'
      - say: 'Group in pairs.'
        write: '$= (m^{3} - m^{2}) + (2m - 2)$'
      - say: 'From the first pair take out $m$ squared, leaving $m$ minus 1: the tall rectangle. From the second pair take out 2, leaving $m$ minus 1 again: the short one. Both brackets are the same.'
        write: '$= m^{2}(m - 1) + 2(m - 1)$'
        doodle_do:
          - {id: rects, op: label, part: r1, text: 'm²(m − 1)'}
          - {id: rects, op: label, part: r2, text: '2(m − 1)'}
      - say: 'Take out the common bracket, $m$ minus 1. Watch the short rectangle slide onto the tall one: what is left is $m$ squared plus 2.'
        write: '$= (m - 1)(m^{2} + 2)$'
        doodle_do:
          - {id: rects, op: move, part: r2, path: join}
          - {id: rects, op: label, part: r1, text: '(m − 1)(m² + 2)'}
        point:
          - {line: 4, kind: move, from: {line: 3, at: 'm2[[(m−1)]]'}, at: '(m−1)', text: 'taken out'}
      - say: '$m$ squared plus 2 cannot be factorised further: $m$ squared is never negative, so $m$ squared plus 2 is never zero. Therefore these are the factors.'
        write: '$\therefore$ Factors: $(m^{2} + 2)(m - 1)$'
      - section: 'Check'
        say: 'Check by expanding. $m$ squared times $m$ is $m$ cubed; $m$ squared times negative 1 is negative $m$ squared; 2 times $m$ is $2m$; 2 times negative 1 is negative 2.'
        write: '$(m^{2} + 2)(m - 1)$'
      - say: 'That is exactly the expression we started with.'
        write: '$= m^{3} - m^{2} + 2m - 2\ \checkmark$'
      - say: 'So the factorisation is $m$ squared plus 2, times $m$ minus 1: option D.'
        write: '$\therefore (m^{2} + 2)(m - 1)$ (D)'
        answer: true
    traps:
      A: 'You went for $m$ squared plus 1, times $m$ minus 2. Expanding it gives $m$ cubed minus $2m$ squared plus $m$ minus 2, which has the wrong middle terms. Expanding back is your safety net.'
      B: 'You went for $m$ plus 1, times $m$ plus 1, times $m$ plus 2. Every term there is positive, so it expands with plus $m$ squared, but our expression has minus $m$ squared. Group in pairs instead.'
      C: 'You went for $m$ plus 1, times $m$ plus 1, times $m$ minus 2. If $m$ minus 2 were a factor, putting $m$ equals 2 would give zero. But 8 minus 4 plus 4 minus 2 is 6, not zero.'

  18:
    moments:
      - section: 'The question'
        say: 'Factorise 1 minus, $a$ minus $b$, squared. Three options look almost the same, and the whole question is one sign. Picture a 1 by 1 square with a corner cut away.'
        write: '$1 - (a - b)^{2}$'
        doodle: {name: 'custom:1991_q18_a', id: square, caption: '1 squared, minus a corner B squared'}
      - section: 'Solution'
        say: '1 is 1 squared, so this is one square minus another square: a difference of two squares.'
        write: 'Solution'
      - say: 'Write the 1 as 1 squared.'
        write: '$= 1^{2} - (a - b)^{2}$'
      - say: 'The rule for a difference of two squares: $A$ squared minus $B$ squared equals $A$ minus $B$, times $A$ plus $B$. The L-shape that is left re-cuts into a rectangle.'
        write: '$A^{2} - B^{2} = (A - B)(A + B)$'
        doodle_do:
          - {id: square, op: stage, stage: 'custom:1991_q18_a2'}
      - say: 'Here $A$ is 1 and $B$ is $a$ minus $b$.'
        write: '$A = 1,\ B = a - b$'
      - say: 'Substitute, keeping $B$ in its own bracket.'
        write: '$= [1 - (a - b)][1 + (a - b)]$'
        point:
          - {line: 3, kind: box, text: 'the rule'}
      - say: 'Open the first inner bracket. The minus sign in front changes both signs: 1 minus $a$ plus $b$.'
        write: '$1 - (a - b) = 1 - a + b$'
      - say: 'Open the second. A plus sign in front changes nothing: 1 plus $a$ minus $b$.'
        write: '$1 + (a - b) = 1 + a - b$'
      - say: 'Therefore the factors are 1 minus $a$ plus $b$, and 1 plus $a$ minus $b$: the two sides of the rectangle.'
        write: '$\therefore$ Factors: $(1 - a + b)(1 + a - b)$'
        doodle_do:
          - {id: square, op: circle, part: rect}
      - section: 'Check'
        say: 'Check with $a$ equals 3 and $b$ equals 1. The question: 1 minus, 3 minus 1, squared, is 1 minus 4, which is negative 3.'
        write: '$a = 3,\ b = 1$: $1 - (2)^{2} = -3$'
      - say: 'Our factors: 1 minus 3 plus 1 is negative 1; 1 plus 3 minus 1 is 3. Negative 1 times 3 is negative 3. It matches.'
        write: '$(1 - 3 + 1)(1 + 3 - 1) = -3\ \checkmark$'
      - say: 'So the factorisation is option B.'
        write: '$\therefore (1 - a + b)(1 + a - b)$ (B)'
        answer: true
    traps:
      A: 'You went for the same bracket twice, 1 minus $a$ minus $b$. A difference of two squares gives two different brackets, and the minus in front of $a$ minus $b$ turns minus $b$ into plus $b$.'
      C: 'You went for 1 minus $a$ plus $b$, twice. That is a perfect square, which is never negative, but with $a$ equals 3 and $b$ equals 1 the question gives negative 3. The second bracket is 1 plus $a$ minus $b$.'
      D: 'You went for 1 minus $a$ minus $b$, times 1 plus $a$ minus $b$. The second bracket is right, but in the first the minus sign in front of $a$ minus $b$ changes minus $b$ into plus $b$.'

  19:
    moments:
      - section: 'The question'
        say: 'Which of these is a factor? Four terms, four letters, and no letter common to all of them. Grouping will find it. Picture a rectangle $s$ plus $t$ wide.'
        write: '$rs + tr - pt - ps$'
        doodle: {name: 'custom:1991_q19_a', id: block, caption: 's + t wide, r tall, less p'}
      - section: 'Solution'
        say: 'We factorise by grouping. First rearrange, so the two $r$ terms sit together and the two $p$ terms sit together. $tr$ is the same as $rt$.'
        write: 'Solution'
      - say: 'Rearrange the terms.'
        write: '$= rs + rt - ps - pt$'
      - say: 'Group in pairs. Taking the minus sign outside the second bracket changes both signs inside it.'
        write: '$= (rs + rt) - (ps + pt)$'
      - say: 'From the first pair take out $r$, leaving $s$ plus $t$: the whole rectangle. From the second take out $p$, leaving $s$ plus $t$ again: the strip taken away. Both brackets are the same.'
        write: '$= r(s + t) - p(s + t)$'
        doodle_do:
          - {id: block, op: label, part: rblock, text: 'r(s + t)'}
          - {id: block, op: cross, part: pstrip, text: '−p(s + t)'}
      - say: 'Take out the common bracket, $s$ plus $t$. What is left is $r$ minus $p$, the height of the rectangle that remains.'
        write: '$= (r - p)(s + t)$'
        doodle_do:
          - {id: block, op: label, part: left, text: '(s + t)(r − p)'}
        point:
          - {line: 5, kind: move, from: {line: 4, at: 'r[[(s+t)]]'}, at: '(s+t)', text: 'taken out'}
      - say: 'Therefore the factors are $r$ minus $p$, and $s$ plus $t$.'
        write: '$\therefore$ Factors: $(r - p)$ and $(s + t)$'
      - section: 'Check'
        say: 'Check by expanding. $r$ times $s$ is $rs$, $r$ times $t$ is $rt$, negative $p$ times $s$ is negative $ps$, negative $p$ times $t$ is negative $pt$.'
        write: '$(r - p)(s + t) = rs + rt - ps - pt$'
      - say: 'Those are the four terms we started with.'
        write: '$= rs + tr - pt - ps\ \checkmark$'
      - say: 'Of the options, only $r$ minus $p$ is one of our factors: option C.'
        write: '$\therefore r - p$ (C)'
        answer: true
    traps:
      A: 'You went for $p$ minus $s$. That mixes a letter from each pair. The expression factorises as $r$ minus $p$, times $s$ plus $t$.'
      B: 'You went for $s$ minus $p$. The factors are $s$ plus $t$ and $r$ minus $p$. Group the $r$ terms and the $p$ terms, then take out $r$ and $p$.'
      D: 'You went for $r$ plus $p$. That comes from forgetting the minus sign in front of the $p$ pair. The second pair is minus $p$ times $s$ plus $t$, so the factor is $r$ minus $p$.'

  20:
    moments:
      - section: 'The question'
        say: 'Two equations, two balances. Find the two values of $y$. Watch out: the quadratic gives $x$ first, and one option is waiting for students who stop there.'
        write: '$3x + y = 8$ and $x^{2} + xy = 6$'
        doodle: {name: 'custom:1991_q20_a', id: scales, caption: 'two equations, two balances'}
      - section: 'Solution'
        say: 'One equation is linear and one is quadratic, so we use substitution. First, number the equations.'
        write: 'Solution'
      - say: 'Equation 1: $3x$ plus $y$ equals 8.'
        write: '$3x + y = 8 \quad \text{......(1)}$'
      - say: 'Equation 2: $x$ squared plus $xy$ equals 6.'
        write: '$x^{2} + xy = 6 \quad \text{......(2)}$'
      - say: 'Make $y$ the subject of the linear one, equation 1: subtract $3x$ from both sides. Call this equation 3.'
        write: 'From (1): $y = 8 - 3x \quad \text{......(3)}$'
        doodle_do:
          - {id: scales, op: highlight, part: scale1}
      - say: 'Now substitute equation 3 into equation 2, the lower balance.'
        write: 'Substitute (3) in (2):'
        doodle_do:
          - {id: scales, op: stage, stage: 'custom:1991_q20_a2'}
      - say: 'Wherever $y$ appears in equation 2, write 8 minus $3x$ in a bracket.'
        write: '$x^{2} + x(8 - 3x) = 6$'
        point:
          - {line: 6, kind: highlight, at: '(8−3x)', to: {doodle: scales, part: sub}}
      - say: 'Open the bracket. $x$ times 8 is $8x$, and $x$ times negative $3x$ is negative $3x$ squared.'
        write: '$x^{2} + 8x - 3x^{2} = 6$'
      - say: 'Collect like terms. $x$ squared minus $3x$ squared is negative $2x$ squared.'
        write: '$-2x^{2} + 8x = 6$'
      - say: 'Subtract 6 from both sides, so the right-hand side is zero.'
        write: '$-2x^{2} + 8x - 6 = 0$'
      - say: 'Divide every term by negative 2. Every sign changes, and the numbers get smaller.'
        write: '$x^{2} - 4x + 3 = 0$'
      - section: 'Factorise'
        say: 'Here $a$ is 1, $b$ is negative 4, $c$ is 3. The product is $ac$, 3. The sum is $b$, negative 4.'
        write: 'Product $= ac = 3$, Sum $= b = -4$'
      - say: 'Two numbers that multiply to 3 and add to negative 4: negative 3 and negative 1.'
        write: 'Factors: $-3$ and $-1$'
      - say: 'Replace negative $4x$ with negative $3x$ minus $x$.'
        write: '$x^{2} - 3x - x + 3 = 0$'
      - say: 'Group in pairs. From the first take out $x$; from the second take out negative 1. Both brackets are $x$ minus 3.'
        write: '$x(x - 3) - 1(x - 3) = 0$'
      - say: 'Take out the common bracket, $x$ minus 3. What is left is $x$ minus 1.'
        write: '$(x - 3)(x - 1) = 0$'
      - say: 'Either the first bracket is zero or the second one is.'
        write: 'Either $x - 3 = 0$ or $x - 1 = 0$'
      - say: 'Therefore $x$ equals 3 or $x$ equals 1. But these are values of $x$. The question wants $y$.'
        write: '$\therefore x = 3$ or $x = 1$'
      - section: 'Find y'
        say: 'Use equation 3. When $x$ is 3, $y$ is 8 minus 3 times 3, which is 8 minus 9, negative 1.'
        write: 'When $x = 3$: $y = 8 - 3(3) = -1$'
        point:
          - {line: 18, kind: move, from: {line: 4, at: 'y=8−3x'}, at: '8−3(3)', text: 'equation (3)'}
      - say: 'When $x$ is 1, $y$ is 8 minus 3 times 1, which is 5.'
        write: 'When $x = 1$: $y = 8 - 3(1) = 5$'
      - say: 'Therefore $y$ equals negative 1 or $y$ equals 5.'
        write: '$\therefore y = -1$ or $y = 5$'
      - section: 'Check'
        say: 'Check each pair in equation 2. $x$ equals 3, $y$ equals negative 1: 9 plus 3 times negative 1 is 9 minus 3, which is 6.'
        write: '$(3)^{2} + (3)(-1) = 9 - 3 = 6\ \checkmark$'
      - say: '$x$ equals 1, $y$ equals 5: 1 plus 1 times 5 is 6. Both balances stay level.'
        write: '$(1)^{2} + (1)(5) = 1 + 5 = 6\ \checkmark$'
      - say: 'So the two values of $y$ are negative 1 and 5: option A.'
        write: '$\therefore y = -1, 5$ (A)'
        doodle_do:
          - {id: scales, op: label, text: 'y = −1 and y = 5'}
        answer: true
    traps:
      B: 'You went for negative 5 and 1. Both signs are flipped. With $x$ equals 1, $y$ is 8 minus 3, which is positive 5; with $x$ equals 3, $y$ is 8 minus 9, which is negative 1.'
      C: 'You went for 1 and 5. The 1 is a value of $x$, not $y$. Put $x$ equals 3 into equation 3 to get the other $y$, which is negative 1.'
      D: 'You went for 1 and 1. Those look like values of $x$ rather than $y$. The $x$ values are 3 and 1, and equation 3 turns them into $y$ equals negative 1 and 5.'

  21:
    moments:
      - section: 'The question'
        say: 'Three fractions of $x$ add up to less than 1. Clear all three in one move with the L.C.M., and the inequality becomes easy.'
        write: '$\dfrac{x}{2} + \dfrac{x}{3} + \dfrac{x}{4} < 1$'
      - say: 'Solution. The denominators are 2, 3 and 4. The L.C.M. is 12, the smallest number they all divide into.'
        write: 'Solution: L.C.M. of 2, 3, 4 $= 12$'
      - say: 'Multiply every term by 12. 12 is positive, so the sign stays.'
        write: '$12 \times \dfrac{x}{2} + 12 \times \dfrac{x}{3} + 12 \times \dfrac{x}{4} < 12 \times 1$'
      - say: '12 over 2 is 6, 12 over 3 is 4, and 12 over 4 is 3.'
        write: '$6x + 4x + 3x < 12$'
      - say: '6 plus 4 plus 3 is 13.'
        write: '$13x < 12$'
      - say: 'Divide both sides by 13. It is positive, so the sign stays.'
        write: '$\therefore\ x < \dfrac{12}{13}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '[[13]]x'}, at: '[[13]]12', text: 'divide'}
      - section: 'The number line'
        say: 'On a number line: 12 over 13 is just under 1. Open circle there, because it is not included, and an arrow to the left.'
        diagram: {id: n, kind: numberline, range: [-2, 2]}
        diagram_do:
          - {id: n, op: interval, to: 0.923, to_open: true, text: 'x < 12/13', answer: true, 'on': 'open circle'}
      - section: 'Check'
        say: 'Check at the boundary. A half plus a third plus a quarter is 6 over 12 plus 4 over 12 plus 3 over 12, which is 13 over 12.'
        write: 'Check: $\ \tfrac{1}{2} + \tfrac{1}{3} + \tfrac{1}{4} = \tfrac{6 + 4 + 3}{12} = \tfrac{13}{12}$'
      - say: 'So at $x$ equals 12 over 13, the left side is 12 over 13 times 13 over 12, exactly 1. Any smaller $x$ gives less than 1.'
        write: '$\tfrac{12}{13} \times \tfrac{13}{12} = 1\ \checkmark$'
      - say: 'So $x$ is less than 12 over 13: option A.'
        write: '$x < \tfrac{12}{13}$'
        answer: true
    traps:
      B: 'You went for $x$ less than 13. Multiplying by 12 gives $13x$ less than 12, so we divide 12 by 13. The 13 multiplies $x$; it is not the bound.'
      C: 'You went for $x$ less than 9. Clearing the fractions with 12 gives 6 plus 4 plus 3, which is $13x$ less than 12, so $x$ is less than 12 over 13.'
      D: 'You went for $x$ less than 13 over 12, the fraction upside down. From $13x < 12$, divide 12 by 13, which gives 12 over 13.'

  22:
    moments:
      - say: 'We want the positive number $n$ where three times its square equals twelve times the number. Let''s picture it, and translate the words one phrase at a time.'
        write: 'Find the positive number $n$'
        doodle: {name: 'custom:1991_q22_a', id: shapes, caption: '3 squares and 12 strips'}
      - say: '"Thrice its square" means 3 times $n$ squared: three $n$ by $n$ squares. The square belongs to $n$, and the 3 multiplies it.'
        write: 'Thrice its square $= 3n^{2}$'
        doodle_do:
          - {id: shapes, op: highlight, part: squares}
      - say: '"Twelve times the number" means 12 times $n$: twelve strips, each $n$ long.'
        write: 'Twelve times the number $= 12n$'
        doodle_do:
          - {id: shapes, op: highlight, part: strips}
      - say: '"Is equal to" joins the two phrases we just wrote.'
        write: '$3n^{2} = 12n$'
        point:
          - {line: 3, kind: move, from: {line: 1, at: '= 3n2'}, at: '3n2', text: 'thrice its square'}
          - {line: 3, kind: move, from: {line: 2, at: '= 12n'}, at: '12n', text: 'twelve times'}
      - say: 'Now, don''t divide both sides by $n$ straight away, because that can lose a solution. Instead, subtract $12n$ from both sides.'
        write: '$3n^{2} - 12n = 0$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= 12n'}, at: '− 12n', text: 'across the ='}
      - say: 'Both terms contain $3n$, so take it out. $3n$ squared divided by $3n$ is $n$, and $12n$ divided by $3n$ is 4.'
        write: '$3n(n - 4) = 0$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '[[3n]]2'}, at: '3n(', text: 'taken out'}
      - say: 'A product is zero only when one of its factors is zero. So $n$ is zero, or $n$ is 4.'
        write: '$n = 0 \text{ or } n = 4$'
      - say: 'The question wants the positive number, so zero is ruled out. With $n$ equal to 4, each square cuts into exactly 4 strips.'
        write: '$n = 4$'
        doodle_do:
          - {id: shapes, op: stage, stage: 'custom:1991_q22_a2'}
          - {id: shapes, op: label, part: squares, text: 'n = 4: 4 strips each'}
        point:
          - {line: 6, kind: strike, at: 'n=0', text: 'not positive'}
          - {line: 7, kind: highlight, at: 'n = 4', to: {doodle: shapes, part: squares}}
      - say: 'Let''s check. 4 squared is 16, and three times 16 is 48. Twelve times 4 is also 48. So $n$ is 4, which is answer choice D.'
        write: '$3(4^{2}) = 48 = 12(4)\ \checkmark$'
        answer: true
    traps:
      A: 'You went for 1. Check it: three times 1 squared is 3, but twelve times 1 is 12. They are not equal. The equation $3n$ squared equals $12n$ gives $n$ equals 4.'
      B: 'You went for 2. Three times 2 squared is 12, but twelve times 2 is 24. They are not equal. Factorising $3n$ squared minus $12n$ gives $n$ equals 4.'
      C: 'You went for 3. Three times 3 squared is 27, but twelve times 3 is 36. Not equal. Solve $3n$ times $n$ minus 4 equals zero to get $n$ equals 4.'

  23:
    moments:
      - section: 'The question'
        say: 'Solve $x$ minus 2, times $x$ minus 3, equals 12. It looks factorised already, and that is the trap. Picture a rectangle of area 12.'
        write: '$(x - 2)(x - 3) = 12$'
        doodle: {name: 'custom:1991_q23_a', id: rect, caption: 'a rectangle of area 12'}
      - section: 'Solution'
        say: 'We can only put each bracket equal to zero when the right-hand side is zero. Here it is 12, so first we open the brackets.'
        write: 'Solution'
        point:
          - {line: 0, kind: underline, at: '= 12', text: 'not 0', 'on': 'right-hand side'}
      - say: 'Open the brackets. $x$ times $x$ is $x$ squared, $x$ times negative 3 is negative $3x$, negative 2 times $x$ is negative $2x$, negative 2 times negative 3 is plus 6.'
        write: '$x^{2} - 3x - 2x + 6 = 12$'
      - say: 'Collect like terms: negative $3x$ minus $2x$ is negative $5x$. Then subtract 12 from both sides, so the right-hand side is zero.'
        write: '$x^{2} - 5x + 6 - 12 = 0$'
      - say: '6 minus 12 is negative 6.'
        write: '$x^{2} - 5x - 6 = 0$'
        doodle_do:
          - {id: rect, op: pulse, part: area}
      - section: 'Factorise'
        say: 'Now factorise. Here $a$ is 1, $b$ is negative 5 and $c$ is negative 6. The product is $a$ times $c$, negative 6. The sum is $b$, negative 5.'
        write: 'Product $= ac = -6$, Sum $= b = -5$'
      - say: 'We need two numbers that multiply to negative 6 and add to negative 5. Negative 6 and plus 1: negative 6 times 1 is negative 6, and negative 6 plus 1 is negative 5.'
        write: 'Factors: $-6$ and $+1$'
      - say: 'Replace the middle term, negative $5x$, with negative $6x$ plus $x$.'
        write: '$x^{2} - 6x + x - 6 = 0$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '−6'}, at: '−6x', text: '−5x split'}
      - say: 'Group in pairs. From the first pair take out $x$; from the second pair take out 1. Both brackets are $x$ minus 6, so we are on the right track.'
        write: '$x(x - 6) + 1(x - 6) = 0$'
      - say: 'Take out the common bracket, $x$ minus 6. What is left is $x$ plus 1.'
        write: '$(x - 6)(x + 1) = 0$'
      - section: 'Solve'
        say: 'Now the right-hand side is zero, so either the first bracket is zero or the second one is.'
        write: 'Either $x - 6 = 0$ or $x + 1 = 0$'
      - say: 'Therefore $x$ equals 6 or $x$ equals negative 1.'
        write: '$\therefore x = 6$ or $x = -1$'
      - section: 'Check'
        say: 'Check $x$ equals negative 1 in the question. Negative 1 minus 2 is negative 3; negative 1 minus 3 is negative 4. Negative 3 times negative 4 is 12.'
        write: '$x = -1$: $(-3)(-4) = 12\ \checkmark$'
      - say: 'Check $x$ equals 6. 6 minus 2 is 4 and 6 minus 3 is 3. On the rectangle, that is 4 by 3, and 4 times 3 is 12.'
        write: '$x = 6$: $(4)(3) = 12\ \checkmark$'
        doodle_do:
          - {id: rect, op: stage, stage: 'custom:1991_q23_a2'}
          - {id: rect, op: label, part: top, text: '4'}
          - {id: rect, op: label, part: side, text: '3'}
        point:
          - {line: 13, kind: highlight, at: '(4)(3)', to: {doodle: rect, part: area}}
      - say: 'So $x$ is negative 1 or 6: option C.'
        write: '$\therefore x = -1, 6$ (C)'
        answer: true
    traps:
      A: 'You went for 2 and 3. They make each bracket zero, but that only works when the right-hand side is zero. Here it is 12: at $x$ equals 2 the product is 0 times negative 1, which is 0, not 12.'
      B: 'You went for 3 and 6. The 6 is right, but at $x$ equals 3 the second bracket is zero, so the product is 0, not 12. The factors are $x$ minus 6 and $x$ plus 1, so the other root is negative 1.'
      D: 'You went for 1 and 6. The 6 is right, but the factor is $x$ plus 1, so $x$ plus 1 equals 0 gives negative 1, not 1. At $x$ equals 1 the product is negative 1 times negative 2, which is 2.'

  24:
    moments:
      - say: 'We need to simplify root of 1 plus $x$, plus root $x$, over root of 1 plus $x$, minus root $x$.'
        write: '$\dfrac{\sqrt{1 + x} + \sqrt{x}}{\sqrt{1 + x} - \sqrt{x}}$'
      - say: 'To clear surds from the denominator, we multiply top and bottom by the conjugate. Here the conjugate is root of 1 plus $x$, plus root $x$, which is exactly the numerator.'
        write: '$= \dfrac{(\sqrt{1 + x} + \sqrt{x})(\sqrt{1 + x} + \sqrt{x})}{(\sqrt{1 + x} - \sqrt{x})(\sqrt{1 + x} + \sqrt{x})}$'
      - say: 'Difference of two squares: a minus b, times a plus b, is a squared minus b squared.'
        write: 'Difference of two squares: $(a - b)(a + b) = a^{2} - b^{2}$'
      - say: 'The new denominator is a difference of two squares: the first term squared minus the second term squared.'
        write: 'Denominator $= (\sqrt{1 + x})^{2} - (\sqrt{x})^{2}$'
      - say: 'Squaring a square root removes it. So this is 1 plus $x$, minus $x$, which is just 1. The surds vanish completely.'
        write: '$= (1 + x) - x = 1$'
      - say: 'The new numerator is the old numerator times itself, so it is a square.'
        write: 'Numerator $= (\sqrt{1 + x} + \sqrt{x})^{2}$'
      - say: 'Squaring a sum: a plus b, all squared, is a squared plus 2ab plus b squared.'
        write: 'Perfect square: $(a + b)^{2} = a^{2} + 2ab + b^{2}$'
      - say: 'Expand it as the first squared, plus twice the product, plus the second squared.'
        write: '$= (\sqrt{1 + x})^{2} + 2\sqrt{1 + x}\sqrt{x} + (\sqrt{x})^{2}$'
      - say: 'The first square is 1 plus $x$. The middle term is 2 root of $x$ times 1 plus $x$. The last square is $x$.'
        write: '$= (1 + x) + 2\sqrt{x(1 + x)} + x$'
      - say: 'Collect the terms. $x$ plus $x$ is $2x$.'
        write: '$= 1 + 2x + 2\sqrt{x(1 + x)}$'
      - say: 'Now put this numerator over the denominator, which we found is just 1. Dividing by 1 changes nothing.'
        write: 'Fraction $= \dfrac{1 + 2x + 2\sqrt{x(1 + x)}}{1} = 1 + 2x + 2\sqrt{x(1 + x)}$'
        point:
          - {line: 10, kind: move, from: {line: 4, at: '− x = [[1]]'}, at: '= [[1]]', text: 'denominator'}
          - {line: 10, kind: move, from: {line: 9, at: '1+2x+2x(1+x)'}, at: '= 1[[1+2x+2x(1+x)]]', text: 'numerator'}
      - say: 'Let''s check with $x$ equal to 1. The original is root 2 plus 1, over root 2 minus 1. That is 2.414 over 0.414, which is about 5.83.'
        write: 'Check at $x = 1$: $\ \dfrac{\sqrt{2} + 1}{\sqrt{2} - 1} = \dfrac{2.414}{0.414} \approx 5.83$'
      - say: 'Our answer gives 1 plus 2 plus 2 root 2, which is 3 plus 2.83, or 5.83. It matches.'
        write: 'Our answer at $x = 1$: $\ 1 + 2 + 2\sqrt{2} \approx 3 + 2.83 = 5.83$'
      - say: 'So the fraction simplifies to 1 plus $2x$ plus 2 root of $x$ times 1 plus $x$, which is answer choice B.'
        write: 'Simplified: $1 + 2x + 2\sqrt{x(1 + x)}$'
        answer: true
    traps:
      A: 'You went for 1 minus $2x$ minus 2 root of $x$ times 1 plus $x$. Every term in the square of a sum is positive: 1 plus $x$, plus the middle term, plus $x$.'
      C: 'You went for root of $x$ times 1 plus $x$. That is only part of the middle term. Squaring the numerator gives 1 plus $x$, plus 2 root of $x$ times 1 plus $x$, plus $x$.'
      D: 'You went for the one with a minus before the surd. That comes from multiplying by the denominator instead of its conjugate. At $x$ equal to 1 it gives about 0.17, far too small. The conjugate has a plus sign.'

  25:
    moments:
      - say: 'We need to simplify $x$ squared times, $x$ squared minus 1, to the power negative one half, minus, $x$ squared minus 1, to the power one half.'
        write: '$x^{2}(x^{2} - 1)^{-\frac{1}{2}} - (x^{2} - 1)^{\frac{1}{2}}$'
      - say: 'Both terms contain a power of $x$ squared minus 1. The key move is to take out the lower power as a common factor. The powers are negative one half and one half, so the lower one is negative one half.'
        write: 'Lower power is $-\tfrac{1}{2}$, so take out $(x^{2} - 1)^{-\frac{1}{2}}$'
      - say: 'The first term already has that factor, with $x$ squared left behind.'
        write: 'First term: $x^{2}(x^{2} - 1)^{-\frac{1}{2}}$ leaves $x^{2}$'
      - say: 'Multiplying powers of the same base: add the indices.'
        write: 'Law of indices: $a^{m} \times a^{n} = a^{m + n}$'
      - say: 'For the second term, split the power. Negative a half plus 1 is a half, so the power a half is the power negative a half times the power 1.'
        write: 'Second term: $(x^{2} - 1)^{\frac{1}{2}} = (x^{2} - 1)^{-\frac{1}{2}}(x^{2} - 1)$'
      - say: 'So the second term leaves $x$ squared minus 1 behind. Now take out the common factor from both terms, and write what is left in a square bracket.'
        write: 'Expression $= (x^{2} - 1)^{-\frac{1}{2}}\left[x^{2} - (x^{2} - 1)\right]$'
        point:
          - {line: 1, kind: box, text: 'take this out'}
      - say: 'Inside the square bracket, the minus changes both signs. $x$ squared minus $x$ squared plus 1 is just 1.'
        write: 'Inside the bracket: $x^{2} - x^{2} + 1 = 1$'
        point:
          - {line: 6, kind: strike, at: 'x2−x2', text: 'cancel'}
      - say: 'So the whole expression is $x$ squared minus 1, to the power negative a half, times that 1.'
        write: 'Expression $= (x^{2} - 1)^{-\frac{1}{2}} \times 1 = (x^{2} - 1)^{-\frac{1}{2}}$'
      - say: 'Let''s check with $x$ equal to root 5. Then $x$ squared is 5, and $x$ squared minus 1 is 4. The original is 5 times 4 to the power negative a half, minus 4 to the power a half.'
        write: 'Check at $x = \sqrt{5}$: $\ 5 \times 4^{-\frac{1}{2}} - 4^{\frac{1}{2}}$'
      - say: '4 to the power negative a half is 1 over root 4, which is a half, and 4 to the power a half is 2. 5 times a half is 2.5, and 2.5 minus 2 is 0.5.'
        write: '$= 5 \times \tfrac{1}{2} - 2 = 2.5 - 2 = 0.5$'
      - say: 'Our answer gives 4 to the power negative a half, which is also a half, or 0.5. It matches, so the answer is $x$ squared minus 1, to the power negative a half. That is answer choice D.'
        write: 'Our answer: $4^{-\frac{1}{2}} = \tfrac{1}{2} = 0.5\ \checkmark$'
        answer: true
    traps:
      A: 'You went for $x$ squared minus 1 to the power one half. The base is right but the sign of the index is lost. We took out the lower power, negative one half, and what was left was just 1.'
      B: 'You went for $x$ squared minus 1. With $x$ equal to root 5 that is 4, but the expression is one half. Taking out the power negative one half leaves 1 in the bracket.'
      C: 'You went for $x$ squared minus 1 to the power negative 1. With $x$ equal to root 5 that is one quarter, but the expression is one half. The factor we took out has power negative one half.'

  26:
    moments:
      - say: 'We want the gradient of the line through negative 2, 0 and 0, negative 4.'
        write: '$(-2,\ 0) \text{ and } (0,\ -4)$'
      - say: 'Let me plot the two points and join them.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '(−2, 0)'}
          - {figure: sketch, kind: circle, target: '(0, −4)'}
      - say: 'Gradient measures steepness, like a hill: how much $y$ changes for each step in $x$. So it is the change in $y$ over the change in $x$.'
        write: 'Gradient $m = \dfrac{y_{2} - y_{1}}{x_{2} - x_{1}}$'
        doodle: {name: 'custom:1991_q26_a', id: hill, caption: 'gradient as a hill'}
      - say: 'Let the first point be negative 2, 0 and the second be 0, negative 4.'
        write: '$(x_{1}, y_{1}) = (-2, 0),\quad (x_{2}, y_{2}) = (0, -4)$'
        point:
          - {figure: sketch, kind: circle, target: A, text: 'first point'}
          - {figure: sketch, kind: circle, target: B, text: 'second point'}
      - say: 'The only danger is the order of subtraction. Whichever point we take first on top, we must take first underneath too.'
        write: 'Same order top and bottom: second point minus first point'
      - say: 'The change in $y$ is the second $y$, negative 4, minus the first $y$, 0. That is negative 4: the ground drops 4.'
        write: 'Change in $y$: $\ y_{2} - y_{1} = -4 - 0 = -4$'
        doodle_do:
          - {id: hill, op: label, part: down, text: '−4'}
      - say: 'The change in $x$ is the second $x$, 0, minus the first $x$, negative 2. 0 minus negative 2 is 0 plus 2, which is 2: 2 steps across.'
        write: 'Change in $x$: $\ x_{2} - x_{1} = 0 - (-2) = 2$'
        doodle_do:
          - {id: hill, op: label, part: across, text: '+2'}
      - say: 'Now put those two changes into the formula.'
        write: '$m = \dfrac{-4 - 0}{0 - (-2)}$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '−4−0'}, at: '−4−0', text: 'top'}
          - {line: 7, kind: move, from: {line: 6, at: '0−(−2)'}, at: '0−(−2)', text: 'bottom'}
      - say: 'The top is negative 4, and the bottom is 2.'
        write: '$= \dfrac{-4}{2}$'
      - say: 'Negative 4 divided by 2 is negative 2, the gradient of the hill.'
        write: '$= -2$'
        doodle_do:
          - {id: hill, op: label, part: grad, text: '−2'}
        point:
          - {line: 9, kind: highlight, at: '-2', to: {doodle: hill, part: grad}}
      - say: 'Sense check: going from left to right, like the walker going down the hill, the line drops from height 0 to height negative 4, so it slopes downwards, and a downward slope has a negative gradient.'
        write: 'Check: $y$ falls as $x$ rises, so $m < 0$'
        doodle_do:
          - {id: hill, op: move, part: walker, path: slide}
        point:
          - {figure: sketch, kind: highlight, target: AB, text: 'slopes down'}
      - say: 'So the gradient is negative 2, which is answer choice C.'
        write: 'Gradient $= -2$'
        answer: true
    traps:
      A: 'You went for positive 2. That comes from subtracting in opposite orders on top and bottom. Whichever point comes first must come first in both: negative 4 over 2 is negative 2.'
      B: 'You went for negative 4. That is only the change in $y$. We still divide it by the change in $x$, which is 2, to get negative 2.'
      D: 'You went for 4. The line falls from left to right, so the gradient is negative. The change in $y$ is negative 4 and the change in $x$ is 2, giving negative 2.'

  27:
    moments:
      - say: 'We want the value of $x$ at which $y$ equals $x$ squared minus $2x$ minus 3 is a minimum.'
        write: '$y = x^{2} - 2x - 3$'
      - say: 'Let me sketch the graph, so we can see its shape.'
        show_sketch: true
      - say: 'The number in front of $x$ squared is positive, so the curve is U-shaped and has a lowest point. For $a x$ squared plus $b x$ plus $c$, that point is at $x$ equals negative $b$ over $2a$.'
        write: '$x = -\dfrac{b}{2a}$'
        point:
          - {figure: sketch, kind: circle, target: A, text: 'lowest point'}
      - say: 'Here $a$ is 1 and $b$ is negative 2.'
        write: '$a = 1,\quad b = -2$'
      - say: 'Put $a$ equal to 1 and $b$ equal to negative 2 into the formula.'
        write: '$x = -\dfrac{-2}{2(1)}$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {line: 3, kind: circle, at: 'a=1,b=−2', text: 'sub in'}
      - say: 'The two minus signs make a plus, and 2 over 2 is 1.'
        write: '$x = \dfrac{2}{2} = 1$'
        point:
          - {figure: sketch, kind: label, target: A, text: 'x = 1'}
      - say: 'We can confirm with calculus. The derivative of $x$ squared minus $2x$ minus 3 is $2x$ minus 2.'
        write: '$\dfrac{dy}{dx} = 2x - 2$'
      - say: 'At a turning point the derivative is zero. So $2x$ minus 2 equals zero, $2x$ equals 2, and $x$ is 1.'
        write: '$2x - 2 = 0 \Rightarrow x = 1$'
        point:
          - {figure: sketch, kind: circle, target: A, text: 'gradient 0 here'}
      - say: 'The second derivative is 2, which is positive, so this is a minimum, not a maximum.'
        write: '$\dfrac{d^{2}y}{dx^{2}} = 2 > 0$'
      - say: 'Notice the minimum value of $y$ is 1 minus 2 minus 3, which is negative 4. But that is not what is asked. The question wants the $x$.'
        write: '$y_{\min} = 1 - 2 - 3 = -4$'
        point:
          - {line: 9, kind: strike, at: '−4', text: 'not asked'}
      - say: 'So the function is a minimum at $x$ equals 1, which is answer choice A.'
        write: '$x = 1$'
        answer: true
    traps:
      B: 'You went for negative 1. That misses the minus sign in the formula. $x$ is negative $b$ over $2a$, and negative of negative 2 is positive 2, so $x$ is 1.'
      C: 'You went for negative 4. That is the minimum value of $y$, not the $x$ where it happens. The question asks "at what value of $x$", and that is 1.'
      D: 'You went for 4. The derivative $2x$ minus 2 is zero at $x$ equals 1, not 4. At $x$ equals 4, the gradient is 6.'

  28:
    moments:
      - say: 'We want the $n$th term of the progression 27, 9, 3, and so on. Picture three piles, each smaller than the last. First, let''s find out what kind of progression it is.'
        write: '$27,\ 9,\ 3,\ \ldots$'
        doodle: {name: 'custom:1991_q28_a', id: piles, caption: '27, 9, 3: shrinking piles'}
      - say: 'Try the differences. 9 minus 27 is negative 18, and 3 minus 9 is negative 6. They are not equal, so it is not arithmetic.'
        write: '$9 - 27 = -18,\quad 3 - 9 = -6$'
      - say: 'Try the ratios. 9 over 27 is one third, and 3 over 9 is one third: each pile is a third of the one before. They are equal, so it is geometric.'
        write: '$\dfrac{9}{27} = \dfrac{1}{3},\quad \dfrac{3}{9} = \dfrac{1}{3}$'
        doodle_do:
          - {id: piles, op: label, part: r1, text: '× 1/3'}
          - {id: piles, op: label, part: r2, text: '× 1/3'}
      - say: 'So the common ratio is one third, and the first term is 27.'
        write: '$a = 27,\quad r = \tfrac{1}{3}$'
      - say: 'The $n$th term of a geometric progression is $a$ times $r$ to the power $n$ minus 1.'
        write: '$T_{n} = ar^{n - 1}$'
      - say: 'Substitute $a$ equal to 27 and $r$ equal to one third.'
        write: '$T_{n} = 27\left(\tfrac{1}{3}\right)^{n - 1}$'
        point:
          - {line: 4, kind: box, text: 'the rule'}
          - {line: 5, kind: move, from: {line: 3, at: 'a = 27'}, at: '27(', text: 'a'}
          - {line: 5, kind: move, from: {line: 3, at: 'r = 31'}, at: '(31)', text: 'r'}
      - say: 'Let''s check. When $n$ is 1, the power is zero, and 27 times 1 is 27, the first pile.'
        write: '$T_{1} = 27\left(\tfrac{1}{3}\right)^{0} = 27$'
        doodle_do:
          - {id: piles, op: circle, part: t1}
      - say: 'When $n$ is 2, 27 times one third is 9, the second pile.'
        write: '$T_{2} = 27 \times \tfrac{1}{3} = 9$'
        doodle_do:
          - {id: piles, op: circle, part: t2}
        point:
          - {line: 7, kind: highlight, at: '= 9', to: {doodle: piles, part: t2}}
      - say: 'When $n$ is 3, 27 times one ninth is 3, the third pile. All three match, so the answer is 27 times one third to the power $n$ minus 1, which is answer choice A.'
        write: '$T_{3} = 27 \times \tfrac{1}{9} = 3$'
        doodle_do:
          - {id: piles, op: circle, part: t3}
        answer: true
    traps:
      B: 'You went for 3 to the power $n$ plus 2. It gives 27 when $n$ is 1, but 81 when $n$ is 2. The terms get smaller, so the ratio must be one third.'
      C: 'You went for 27 plus 18 times $n$ minus 1. That is an arithmetic formula, and the differences are not equal. When $n$ is 2 it gives 45, not 9.'
      D: 'You went for 27 plus 6 times $n$ minus 1. That is arithmetic, and it grows: when $n$ is 2 it gives 33, not 9. The ratio between terms is one third, so it is geometric.'

  29:
    moments:
      - say: 'An arithmetic progression has 20 terms, the first term is 7, and the last term is 117. Picture it as evenly rising stairs. We want the sum.'
        write: '$n = 20,\quad a = 7,\quad l = 117$'
        doodle: {name: 'custom:1991_q29_a', id: stairs, caption: '20 even steps, 7 up to 117'}
      - say: 'When we know the first and last terms, there''s a lovely short formula: the sum is $n$ over 2, times first plus last.'
        write: '$S_{n} = \dfrac{n}{2}(a + l)$'
      - say: 'Why does it work? Pair the first term with the last, the second with the second-last, and so on: fit an upside-down copy of the stairs on top. Each step in goes up by the common difference at one end and down by it at the other, so every pair adds up to the same total.'
        write: 'Every pair adds to $a + l$'
        doodle_do:
          - {id: stairs, op: stage, stage: 'custom:1991_q29_a2'}
      - say: '20 terms make 20 over 2, which is 10 pairs. That is where the $n$ over 2 in the formula comes from.'
        write: 'Number of pairs $= \dfrac{20}{2} = 10$'
      - say: 'The first and last terms add up to 7 plus 117, which is 124, the height of every column. So every pair adds up to 124.'
        write: 'Each pair: $a + l = 7 + 117 = 124$'
        doodle_do:
          - {id: stairs, op: label, part: pair, text: '7 + 117 = 124'}
        point:
          - {line: 4, kind: highlight, at: '124', to: {doodle: stairs, part: pair}}
      - say: 'Now substitute $n$ equal to 20, $a$ equal to 7 and $l$ equal to 117 into the formula.'
        write: '$S_{20} = \dfrac{20}{2}(7 + 117)$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
          - {line: 5, kind: move, from: {line: 0, at: 'a = [[7]]'}, at: '([[7]] +', text: 'a'}
          - {line: 5, kind: move, from: {line: 0, at: '117'}, at: '117', text: 'l'}
      - say: '20 over 2 is the 10 pairs, and 7 plus 117 is the 124 each pair adds to.'
        write: '$= 10 \times 124$'
      - say: '10 times 124 is 1240.'
        write: '$= 1240$'
      - say: 'A quick check that such a progression exists: the last term is $a$ plus 19 $d$, so 117 equals 7 plus 19 $d$, and $d$ is 110 over 19. Awkward, but fine, and our formula never needed it.'
        write: 'Check: $117 = 7 + 19d$, so $d = \dfrac{110}{19}$'
      - say: 'So the sum of the first 20 terms is 1240, which is answer choice B.'
        write: 'Sum of 20 terms $= 1240$'
        answer: true
