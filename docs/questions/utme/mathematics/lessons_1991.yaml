      - say: '$P Q R S$ is a square of side 8 cm. $U Q$ is 4, $Q V$ is 6 and $W R$ is 2. We want the area of the shaded triangle $U V W$.'
        write: '$\text{side} = 8,\quad UQ = 4,\quad QV = 6,\quad WR = 2$'
        point:
