          - {figure: sketch, kind: label, target: {x: 80, y: 105}, text: 'curved side'}
      - say: 'Each circular end, the top and the bottom of the tin, has area pi $r$ squared. 4 squared is 16, so each end is 16 pi.'
        write: '$\pi r^{2} = \pi(4)^{2} = 16\pi$'
        doodle_do:
          - {id: tin, op: highlight, part: ends}
      - say: 'There are two ends. 2 times 16 pi is 32 pi.'
        write: '$2 \times 16\pi = 32\pi$'
      - say: 'The curved side unrolls into a rectangle, like peeling off the label. Its length is the circumference, 2 pi $r$, and its width is the height. So its area is 2 pi $r h$.'
        write: '$2\pi rh = 2\pi(4)(5)$'
        doodle_do:
          - {id: tin, op: stage, stage: 'custom:1991_q45_a2'}
          - {id: tin, op: label, part: sheet, text: '2πr by h'}
