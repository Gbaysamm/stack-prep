      C: 'You went for 6 and 6.7. Both numbers are right, but in the wrong order. The question asks for the mean first, 6.7, then the median, 6.'
      D: 'You went for 6.5 and 6.7. The mean is 333 over 50, which is 6.7, and the median is 6. The question wants the mean first.'

