          - {figure: 0, kind: circle, target: V}
          - {figure: 0, kind: circle, target: W, text: 'shaded UVW'}
      - say: 'The triangle is awkward to measure directly. But the pieces of the square outside it are easy. So we find the whole square and subtract those pieces.'
        point:
