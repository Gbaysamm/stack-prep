        write: '$P(\text{not Coca-Cola}) = \dfrac{14}{24}$'
      - say: 'Divide top and bottom by 2. 14 over 2 is 7, and 24 over 2 is 12.'
        write: '$= \dfrac{7}{12}$'
      - say: 'Check with the complement. The chance it IS Coca-Cola is 10 over 24, which is 5 over 12. And 1 minus 5 twelfths is 7 twelfths.'
        write: '$1 - \dfrac{10}{24} = 1 - \dfrac{5}{12} = \dfrac{7}{12}\ \checkmark$'
      - say: 'So the probability that it is not a Coca-Cola bottle is 7 over 12, which is answer choice D.'
        write: '$\dfrac{7}{12}$'
