        write: '$\angle XZY = 90^{\circ}$ (N and E are $\perp$)'
      - say: 'The bearing of $Y$ from $X$ is taken at $X$, the point after the word from. Let me draw the North line at $X$ and join $X$ to $Y$. The North line at $X$ runs along $XZ$.'
        write: 'N line at $X$ along $XZ$; join $XY$'
        show_sketch: sketch_b
        'on': 'North line'
        point:
          - {figure: sketch_b, kind: circle, target: N, text: 'north'}
          - {figure: sketch_b, kind: highlight, target: XY}
      - say: 'Let theta be the angle at $X$ between North and $XY$. Measured clockwise from North, theta is the bearing.'
        write: 'Let $\theta = \angle ZXY$ (clockwise from N)'
        point:
          - {figure: sketch_b, kind: circle, target: θ}
      - section: 'The angle'
        say: 'From theta, $ZY$ is opposite and $XZ$ is adjacent. Opposite and adjacent gives TOA, so tangent.'
        write: '$\tan\theta = \dfrac{\text{opp}}{\text{adj}} = \dfrac{ZY}{XZ}$ (TOA)'
        point:
          - {figure: sketch_b, kind: underline, target: ZY, text: 'opp'}
          - {figure: sketch_b, kind: underline, target: XZ, text: 'adj'}
      - say: 'Substitute. The 60s cancel, leaving root 3.'
        write: '$\tan\theta = \dfrac{60\sqrt{3}}{60} = \sqrt{3}$'
      - say: 'From the special angles, tan 60 degrees is root 3. So theta is 60 degrees.'
        write: '$\theta = \tan^{-1}\sqrt{3} = 60^{\circ}$'
        point:
          - {figure: sketch_b, kind: label, target: θ, text: '60°'}
      - section: 'The bearing'
        say: 'Theta is measured clockwise from North at $X$, so it is the bearing. In three figures, that is zero-six-zero degrees.'
        write: '$\therefore$ Bearing of $Y$ from $X = 060^{\circ}$'
        point:
          - {figure: sketch_b, kind: circle, target: θ, text: '060°'}
      - section: 'Check'
        say: 'Check with Pythagoras. $XY$ squared is 60 squared plus 60 root 3 squared, which is 3600 plus 10800, or 14400. So $XY$ is 120.'
        write: 'Check: $XY = \sqrt{3600 + 10800} = \sqrt{14400} = 120$'
      - say: 'Then cos theta is adjacent over hypotenuse, so 60 over 120, a half. Cos 60 degrees is a half. It agrees.'
        write: '$\cos\theta = \dfrac{60}{120} = \dfrac{1}{2} = \cos 60^{\circ}\ \checkmark$'
      - section: 'Answer'
        say: 'So the bearing of $Y$ from $X$ is 060 degrees, which is answer choice C.'
        write: '$\therefore 060^{\circ}$'
        answer: true
    traps:
      A: 'You went for 030 degrees. That is the angle at $Y$, or the angle from the East direction. Bearings start from North at $X$: tan theta is root 3, so theta is 60, and the bearing is 060.'
      B: 'You went for 045 degrees. That would need the north and east distances to be equal. Here east is 60 root 3, bigger than 60, so tan theta is root 3 and the bearing is 060.'
      D: 'You went for 090 degrees, which is due East. But $Y$ is also 60 m north of $X$, so the bearing is less than 90: tan theta is root 3, giving 060.'

  43:
    moments:
      - section: 'The question'
        say: 'A surveyor walks 500 metres up a hill that slopes at 30 degrees. The path and the height make a right-angled triangle, and one ratio from SOH CAH TOA gives the rise.'
        write: 'Slope $= 30^{\circ}$, walk $= 500$ m, rise $h = ?$'
        doodle: {name: 'custom:1991_q43_a', id: walk, caption: '500 m up a 30° slope'}
      - section: 'Solution'
        say: 'Solution. Let me draw the slope. He walks from $A$ up to $B$, and $BC$ is the height he rises, with a right angle at $C$.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '500 m', text: 'along the slope'}
          - {figure: sketch, kind: circle, target: '30°', text: 'θ'}
          - {figure: sketch, kind: circle, target: h, text: 'want'}
      - say: 'Label the sides relative to the 30-degree angle at $A$. $AB$, the path he walks, is the hypotenuse. $BC$, the height, is opposite the angle.'
        write: 'hyp $= |AB| = 500$ m, opp $= |BC| = h$'
        doodle_do:
          - {id: walk, op: move, part: surveyor, path: walk}
        point:
          - {figure: sketch, kind: highlight, target: AB, text: 'hyp'}
          - {figure: sketch, kind: highlight, target: BC, text: 'opp'}
      - say: 'Opposite and hypotenuse are involved, so we use sine. S, O, H means sine is opposite over hypotenuse.'
        write: '$\sin \theta = \dfrac{\text{opp}}{\text{hyp}}$ (SOH)'
      - say: 'Now substitute. Theta is 30 degrees, the opposite side is $h$, and the hypotenuse is 500.'
        write: '$\sin 30^{\circ} = \dfrac{h}{500}$'
      - say: 'Cross-multiply by multiplying both sides by 500, so that $h$ stands alone.'
        write: '$h = 500 \sin 30^{\circ}$'
      - say: 'Sine 30 is exactly a half. It is a special angle worth knowing by heart.'
        write: '$h = 500 \times \dfrac{1}{2}$'
      - say: 'Half of 500 is 250. He rises 250 metres.'
        write: '$h = 250$ m'
        doodle_do:
          - {id: walk, op: label, part: height, text: '250 m'}
        point:
          - {figure: sketch, kind: label, target: BC, text: '250 m'}
          - {line: 7, kind: highlight, at: '250', to: {doodle: walk, part: height}}
      - section: 'Check'
        say: 'Check with Pythagoras. The flat distance $AC$ is adjacent to the angle, so by CAH it is 500 cos 30, which is 250 root 3.'
        write: '$|AC| = 500\cos 30^{\circ} = 250\sqrt{3}$ m'
      - say: '250 squared plus 250 root 3 squared is 62,500 plus 187,500, which is 250,000. That is 500 squared, so the sides fit.'
        write: '$250^{2} + (250\sqrt{3})^{2} = 500^{2}$ (Pythagoras) $\checkmark$'
      - say: 'Therefore he rises 250 metres, option A.'
        write: '$\therefore h = 250$ m (A)'
        answer: true
    traps:
      B: 'You went for 500 root 3 over 3. That is 500 tan 30, which treats 500 m as the flat ground. The 500 m is walked along the slope, so it is the hypotenuse, and the height is 500 sin 30.'
      C: 'You went for 250 root 2. That is 500 sin 45, the ratio for a 45-degree slope. The slope is 30 degrees, and sin 30 is a half, so the rise is 250 m.'
      D: 'You went for 250 root 3. That is 500 cos 30, the flat distance covered. The height is opposite the angle, so use sine: 500 times a half is 250.'

  44:
    moments:
      - section: 'The question'
        say: 'The shaded triangle is awkward to measure directly. But the pieces of the square outside it are easy, so we take them away from the whole square.'
        write: '$|PQ| = 8$, $|UQ| = 4$, $|QV| = 6$, $|WR| = 2$'
        point:
          - {figure: 0, kind: circle, target: U}
          - {figure: 0, kind: circle, target: V}
          - {figure: 0, kind: circle, target: W, text: 'shaded UVW'}
      - section: 'Solution'
        say: 'Solution. Outside the triangle are three pieces, which are triangle $UQV$, triangle $VRW$, and the trapezium $PUWS$ on the left.'
        write: 'Solution'
        point:
          - {figure: 0, kind: label, target: {x: 100, y: 136}, text: 'trapezium PUWS'}
      - say: 'So the area of triangle $UVW$ is the square minus those three pieces.'
        write: '$\triangle UVW = \text{square} - \text{3 pieces}$'
      - say: 'The area of a square is the side squared.'
        write: 'Area of square $= l^{2}$'
      - say: 'The side is 8. 8 squared is 64 square centimetres.'
        write: '$= 8^{2} = 64\ \text{cm}^{2}$'
      - say: 'The area of a triangle is a half, times base, times height.'
        write: 'Area of $\triangle = \dfrac{1}{2} \times b \times h$'
      - say: 'Triangle $UQV$ has its right angle at $Q$, the corner of the square, so 4 and 6 are its base and height. Half of 4 times 6 is 12.'
        write: '$\triangle UQV = \dfrac{1}{2} \times 4 \times 6 = 12$'
        point:
          - {figure: 0, kind: highlight, target: UQ, text: '4'}
          - {figure: 0, kind: highlight, target: QV, text: '6'}
      - say: 'For triangle $VRW$, first $VR$. $QR$ is 8 and $QV$ is 6, so $VR$ is 8 minus 6, which is 2.'
        write: '$|VR| = 8 - 6 = 2$'
        point:
          - {figure: 0, kind: label, target: VR, text: '2'}
      - say: 'Its right angle is at $R$, with sides 2 and 2. Half of 2 times 2 is 2.'
        write: '$\triangle VRW = \dfrac{1}{2} \times 2 \times 2 = 2$'
      - say: 'For the trapezium, $PU$ is 8 minus 4, which is 4, and $SW$ is 8 minus 2, which is 6.'
        write: '$|PU| = 8 - 4 = 4$, $|SW| = 8 - 2 = 6$'
        point:
          - {figure: 0, kind: label, target: PU, text: '4'}
          - {figure: 0, kind: label, target: SW, text: '6'}
      - say: 'The area of a trapezium is a half of the sum of the parallel sides, times the height between them.'
        write: 'Area of trapezium $= \dfrac{1}{2}(a + b)h$'
      - say: 'The parallel sides are $PU$ and $SW$, 4 and 6. The height between them is $PS$, 8.'
        write: '$PUWS = \dfrac{1}{2}(4 + 6) \times 8$'
        point:
          - {figure: 0, kind: highlight, target: PS, text: 'height 8'}
      - say: '4 plus 6 is 10. Half of 10 is 5, and 5 times 8 is 40.'
        write: '$= \dfrac{1}{2} \times 10 \times 8 = 40$'
      - say: 'Put the three pieces together, and 12 plus 2 plus 40 is 54.'
        write: '3 pieces $= 12 + 2 + 40 = 54$'
      - say: 'Take them from the square, so 64 minus 54 is 10 square centimetres.'
        write: '$\triangle UVW = 64 - 54 = 10\ \text{cm}^{2}$'
        point:
          - {line: 14, kind: move, from: {line: 4, at: '= 64'}, at: '64', text: 'square'}
          - {line: 14, kind: move, from: {line: 13, at: '= 54'}, at: '54', text: 'pieces'}
          - {figure: 0, kind: label, target: {x: 206, y: 153}, text: '10 cm²'}
      - section: 'Check'
        say: 'Check. The triangle and the three pieces must fill the whole square, and 12 plus 2 plus 40 plus 10 is 64.'
        write: '$12 + 2 + 40 + 10 = 64\ \checkmark$'
      - say: 'Therefore the area of triangle $UVW$ is 10 square centimetres, option D.'
        write: '$\therefore$ Area of $\triangle UVW = 10\ \text{cm}^{2}$ (D)'
        answer: true
    traps:
      A: 'You went for 64. That is the whole square. The triangle is only part of it: take away the three outside pieces, 12, 2 and 40, to leave 10.'
      B: 'You went for 54. That is the area outside the triangle. The last step is 64 minus 54, which leaves 10.'
      C: 'You went for 50. That is 64 minus 12 minus 2: the trapezium on the left was not taken away. Take away its 40 as well, and 10 is left.'

  45:
    moments:
      - section: 'The question'
        say: 'A solid cylinder is like a closed tin of milk, with a top, a bottom, and the curved side where the label goes. The total surface area is all three together.'
        write: 'Find the total surface area of the solid cylinder.'
        doodle: {name: 'custom:1991_q45_a', id: tin, caption: 'two ends and a label'}
      - say: 'Write Solution, then sketch the cylinder with radius 4 cm and height 5 cm.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '4 cm', text: 'radius', 'on': 'radius 4'}
          - {figure: sketch, kind: circle, target: '5 cm', text: 'height', 'on': 'height 5'}
      - section: 'What we know'
        say: 'List the givens. The radius r is 4 cm and the height h is 5 cm.'
        write: '$r = 4$ cm, $h = 5$ cm'
      - section: 'The formula'
        say: 'The total surface area is the two circular ends, 2 pi r squared, plus the curved side, 2 pi r h.'
        write: 'TSA $= 2\pi r^{2} + 2\pi rh$'
        doodle_do:
          - {id: tin, op: highlight, part: ends, text: 'two ends', 'on': 'two circular ends'}
          - {id: tin, op: circle, part: label, text: 'curved side', 'on': 'plus the curved side'}
      - say: 'Both terms have 2 pi r, so factorise to get 2 pi r, times r plus h.'
        write: 'TSA $= 2\pi r(r + h)$'
      - section: 'Substitute'
        say: 'Substitute r is 4 and h is 5. So it is 2 times pi times 4, times 4 plus 5.'
        write: '$= 2 \times \pi \times 4 \times (4 + 5)$'
        point:
          - {line: 5, kind: move, from: {line: 2, at: '5'}, at: '+ 5', text: 'h', 'on': 'h is 5'}
      - section: 'Simplify'
        say: 'Bracket first, by BODMAS, so 4 plus 5 is 9. And 2 times 4 is 8, so we have 8 pi times 9.'
        write: '$= 8\pi \times 9$'
      - say: '8 times 9 is 72.'
        write: '$= 72\pi$'
      - say: 'Therefore the total surface area is 72 pi square centimetres. Square, because it is an area.'
        write: '$\therefore$ TSA $= 72\pi\ \text{cm}^{2}$'
      - section: 'Check'
        say: 'Check part by part. Peel off the label and it opens into a rectangle, 2 pi r long and h wide, which is 40 pi. The two ends are 16 pi each, 32 pi. 32 pi plus 40 pi is 72 pi.'
        write: 'Check: $2\pi(4)^{2} + 2\pi(4)(5) = 32\pi + 40\pi = 72\pi$ ✓'
        doodle_do:
          - {id: tin, op: stage, stage: 'custom:1991_q45_a2', 'on': 'Peel off the label'}
          - {id: tin, op: label, part: sheet, text: '2πr by h = 40π', 'on': '40 pi'}
      - section: 'Answer'
        say: 'So the total surface area is 72 pi square centimetres, which is answer choice B.'
        write: '$\therefore$ TSA $= 72\pi\ \text{cm}^{2}$ (B)'
        answer: true
    traps:
      A: 'You went for 56 pi. That is 16 pi plus 40 pi: one end only, like an open cup. A solid cylinder is closed at both ends, so TSA is 2 pi r squared plus 2 pi r h: 32 pi plus 40 pi, which is 72 pi.'
      C: 'You went for 96 pi. Recheck the curved side: 2 times pi times 4 times 5 is 40 pi. With the two ends, 32 pi, the TSA is 2 pi r times r plus h: 72 pi.'
      D: 'You went for 192 pi. That is far too big. With r 4 and h 5, TSA is 2 pi times 4, times 9, which is 72 pi.'

  46:
    moments:
      - section: 'The question'
        say: 'This solid is two shapes we know, stacked, with a cylinder at the bottom, and a cone standing on its top face. We want the volume of the whole figure.'
        write: 'Find the volume of the figure.'
        point:
          - {figure: 0, kind: label, target: {x: 150, y: 245}, text: 'cylinder', 'on': 'a cylinder at the bottom'}
          - {figure: 0, kind: label, target: {x: 150, y: 110}, text: 'cone', 'on': 'a cone standing'}
      - say: 'Write Solution, and read the givens off the figure. The cylinder has radius a and height y.'
        write: 'Solution'
        point:
          - {figure: 0, kind: circle, target: y, text: 'height y', 'on': 'height y'}
      - section: 'What we know'
        say: 'The cone has the same radius, a, and its height is x. List them.'
        write: 'Cylinder: $r = a,\ h = y$; cone: $r = a,\ h = x$'
        point:
          - {figure: 0, kind: circle, target: x, text: 'height x', 'on': 'its height is x'}
      - section: 'The plan'
        say: 'The volume of a compound solid is the sum of its parts, so the cylinder plus the cone.'
        write: 'Vol. of figure $=$ vol. of cylinder $+$ vol. of cone'
      - section: 'Each part'
        say: 'Volume of a cylinder is pi r squared h. With radius a and height y, that is pi a squared y.'
        write: 'Vol. of cylinder $= \pi r^{2}h = \pi a^{2}y$'
      - say: 'Volume of a cone is one third pi r squared h. Pour one full cone of water into the cylinder of the same base and height, and it is a third full. With radius a and height x, that is one third pi a squared x.'
        write: 'Vol. of cone $= \tfrac{1}{3}\pi r^{2}h = \tfrac{1}{3}\pi a^{2}x$'
        doodle: {name: 'custom:1991_q46_a', id: pour, caption: 'one cone fills a third'}
        doodle_do:
          - {id: pour, op: fill, to: 0.34, 'on': 'a third full'}
          - {id: pour, op: label, part: cone, text: '⅓πa²x', 'on': 'one third pi a squared x'}
      - section: 'Add'
        say: 'Add the two parts, and we get pi a squared y, plus one third pi a squared x.'
        write: '$V = \pi a^{2}y + \tfrac{1}{3}\pi a^{2}x$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '= πa2y'}, at: 'πa2y', text: 'cylinder', 'on': 'pi a squared y'}
          - {line: 6, kind: move, from: {line: 5, at: '= 31πa2x'}, at: '31πa2x', text: 'cone', 'on': 'plus one third'}
      - say: 'Both terms have pi a squared, so factorise by taking it outside the bracket.'
        write: '$= \pi a^{2}\left(y + \tfrac{1}{3}x\right)$'
      - say: 'Therefore the volume is pi a squared, times one third x plus y.'
        write: '$\therefore V = \pi a^{2}\left(\tfrac{1}{3}x + y\right)$'
      - section: 'Check'
        say: 'Check with numbers, taking a as 3, x as 3 and y as 1. The cylinder is 9 pi and the cone is 9 pi, 18 pi in all. The formula gives 9 pi times 2, which is 18 pi.'
        write: 'Check: $a = 3,\ x = 3,\ y = 1$: $9\pi + 9\pi = 18\pi = 9\pi(1 + 1)$ ✓'
      - section: 'Answer'
        say: 'So the volume is pi a squared, times one third x plus y, which is answer choice D.'
        write: '$\therefore V = \pi a^{2}\left(\tfrac{1}{3}x + y\right)$ (D)'
        answer: true
    traps:
      A: 'You went for one third pi a squared. That has no height in it, so it is an area, not a volume. Add the cylinder, pi a squared y, to the cone, one third pi a squared x.'
      B: 'You went for pi a squared y. That is the cylinder only; the cone on top is left out. Add one third pi a squared x.'
      C: 'You went for one third pi a squared, times y plus x. That treats the whole solid as one cone. Only the cone is divided by 3; the cylinder is pi a squared y.'

  47:
    moments:
      - section: 'The question'
        say: 'A family spends 59 percent of its income on food, 3 on electricity, 20 on transport, 11 on education and 7 on extended family. We want the angles for education and food, in that order.'
        write: 'Angles for education and food $= ?$'
      - section: 'Solution'
        say: 'Solution. Draw the table of items and percentages. Check the total first, because 59 plus 3 plus 20 plus 11 plus 7 is 100 percent, the whole income.'
        write: '$59 + 3 + 20 + 11 + 7 = 100\%$'
        diagram: {id: t, kind: table, columns: [Item, 'Percentage', 'Sectoral angle'], rows: [[Food, 59, ''], [Electricity, 3, ''], [Transport, 20, ''], [Education, 11, ''], [Family, 7, '']]}
        doodle: {name: 'custom:1991_q47_a', id: hundred, caption: '100 squares of income'}
      - say: 'The whole income, 100 percent, is the whole circle, 360 degrees. So each sectoral angle is the percentage over 100, times 360 degrees.'
        write: 'Sectoral angle $= \dfrac{\text{percentage}}{100} \times 360^{\circ}$'
        doodle_do:
          - {id: hundred, op: label, part: key, text: '100 squares = 360°'}
      - section: 'Education'
        say: 'Education is 11 percent, so 11 over 100, times 360.'
        write: 'Education $= \dfrac{11}{100} \times 360^{\circ}$'
        doodle_do:
          - {id: hundred, op: circle, part: edu}
      - say: '11 times 360 is 3960, and 3960 over 100 is 39.6 degrees.'
        write: '$= \dfrac{3960}{100} = 39.6^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,3', text: '39.6°', 'on': '39.6 degrees'}
      - section: 'Food'
        say: 'Food is 59 percent, which gives 59 over 100, times 360.'
        write: 'Food $= \dfrac{59}{100} \times 360^{\circ}$'
        doodle_do:
          - {id: hundred, op: circle, part: food}
      - say: '59 times 360 is 21240, and 21240 over 100 is 212.4 degrees.'
        write: '$= \dfrac{21240}{100} = 212.4^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,3', text: '212.4°', 'on': '212.4 degrees'}
      - section: 'Check'
        say: 'Check the full circle. Electricity is 10.8 degrees, transport 72, and extended family 25.2.'
        write: 'Electricity $10.8^{\circ}$, transport $72^{\circ}$, family $25.2^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:2,3', text: '10.8°', 'on': '10.8'}
          - {id: t, op: fill, part: 'cell:3,3', text: '72°', 'on': '72'}
          - {id: t, op: fill, part: 'cell:5,3', text: '25.2°', 'on': '25.2'}
      - say: '212.4 plus 10.8 plus 72 plus 39.6 plus 25.2 is 360 degrees, the whole circle.'
        write: '$212.4 + 10.8 + 72 + 39.6 + 25.2 = 360^{\circ}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore education is 39.6 degrees and food is 212.4 degrees, which is answer choice D.'
        write: '$\therefore 39.6^{\circ}$ and $212.4^{\circ}$'
        answer: true
    traps:
      A: 'You went for 76.8 and 25.2 degrees. 25.2 is the extended family sector, 7 percent. Education is 11 over 100 of 360, which is 39.6, and food is 212.4.'
      B: 'You went for 10.8 and 224.6 degrees. 10.8 is the electricity sector, 3 percent. Education is 39.6 degrees and food is 212.4.'
      C: 'You went for 112.4 and 72 degrees. 72 is the transport sector, 20 percent. Education is 39.6 degrees and food is 212.4.'

  48:
    moments:
      - section: 'The question'
        say: 'Fifty boxes of bolts, and the number of defective bolts in each. We want the mean and the median. Every statistics answer starts with a table, so here it is.'
        write: 'Mean, median $= ?$'
        diagram:
          id: t
          kind: table
          columns: ['x', 'f', 'fx', 'cf']
          rows: [[4, 2, '', ''], [5, 7, '', ''], [6, 17, '', ''], [7, 10, '', ''], [8, 8, '', ''], [9, 6, '', '']]
          'on': 'table'
      - section: 'Solution'
        say: 'Solution. $x$ is the number defective in a box, and $f$, the frequency, is the number of boxes. We add a column for $f$ times $x$, and one for the cumulative frequency, cf.'
        write: 'Solution'
      - section: 'The mean'
        say: 'The $fx$ column is each $x$ times its frequency. 4 times 2 is 8. 5 times 7 is 35. 6 times 17 is 102.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,3', text: '8'}
          - {id: t, op: fill, part: 'cell:2,3', text: '35'}
          - {id: t, op: fill, part: 'cell:3,3', text: '102'}
      - say: '7 times 10 is 70. 8 times 8 is 64. 9 times 6 is 54.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,3', text: '70'}
          - {id: t, op: fill, part: 'cell:5,3', text: '64'}
          - {id: t, op: fill, part: 'cell:6,3', text: '54'}
      - say: 'Add down the $f$ column. 2 plus 7 is 9, plus 17 is 26, plus 10 is 36, plus 8 is 44, plus 6 is 50. That is the fifty boxes.'
        write: '$\sum f = 50$'
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': 'Add'}
      - say: 'Add down the $fx$ column. 8 plus 35 is 43, plus 102 is 145, plus 70 is 215, plus 64 is 279, plus 54 is 333.'
        write: '$\sum fx = 333$'
        diagram_do:
          - {id: t, op: total, part: 'col:3', 'on': 'Add'}
      - say: 'The mean, $x$ bar, is the sum of $fx$ over the sum of $f$.'
        write: '$\bar{x} = \dfrac{\sum fx}{\sum f}$'
      - say: 'Substitute, and we get 333 over 50.'
        write: '$= \dfrac{333}{50}$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '333'}, at: '50[[333]]', text: 'Σfx'}
          - {line: 7, kind: move, from: {line: 4, at: '50'}, at: '[[50]]333', text: 'Σf'}
      - say: '333 divided by 50 is 6.66, which is 6.7 to one decimal place. Picture the stacks of boxes on a see-saw, and they balance at 6.7.'
        write: '$\therefore \bar{x} = 6.66 \approx 6.7$'
        doodle: {name: 'custom:1991_q48_a', id: stacks, caption: 'boxes stacked by defects', 'on': 'stacks'}
        doodle_do:
          - {id: stacks, op: stage, stage: 'custom:1991_q48_a2', 'on': 'balance'}
          - {id: stacks, op: label, part: mean, text: 'x̄ ≈ 6.7', 'on': 'balance'}
      - section: 'The median'
        say: 'Now the cf column, the cumulative frequency, which is a running total of $f$ down the table. 2, then 9, 26, 36, 44 and 50.'
        diagram_do:
