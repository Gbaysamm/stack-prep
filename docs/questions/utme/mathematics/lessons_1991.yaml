          - {line: 6, kind: move, from: {line: 2, at: '= 50'}, at: '50', text: 'Σf'}
      - say: 'Now the median. With 50 values in order, the middle lies between the 25th and 26th values, so we need those two.'
        write: 'Median: average of the 25th and 26th values'
      - say: 'Count along the table. The first 2 boxes have 4. Then 2 plus 7 is 9 boxes up to 5. Then 9 plus 17 is 26 boxes up to 6.'
        write: '$2,\quad 2 + 7 = 9,\quad 9 + 17 = 26$'
      - say: 'So boxes 10 to 26 all have 6 defective: the tall stack. The 25th and 26th both fall there, so the median is 6.'
        write: '$\text{median} = 6$'
        doodle_do:
          - {id: stacks, op: circle, part: stack6}
          - {id: stacks, op: label, part: stack6, text: '25th and 26th here'}
        point:
          - {line: 8, kind: circle, at: '9+17=26', text: 'up to 26th'}
          - {line: 9, kind: highlight, at: 'median = 6', to: {doodle: stacks, part: stack6}}
      - say: 'The question asks for the mean first, then the median. The mean we found is 6.7 and the median is 6. That is answer choice A.'
