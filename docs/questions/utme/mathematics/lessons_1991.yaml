          - {figure: sketch, kind: label, target: 'family 7%', text: '25.2°'}
      - say: 'All five: 39.6 plus 212.4 is 252, plus 10.8 is 262.8, plus 72 is 334.8, plus 25.2 is 360. Good.'
        write: 'Check: $39.6 + 212.4 + 10.8 + 72 + 25.2 = 360\ \checkmark$'
      - say: 'Education first, then food: 39.6 degrees and 212.4 degrees. That is answer choice D.'
