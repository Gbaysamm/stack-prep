          - {figure: sketch, kind: label, target: '11%, ?', text: '39.6°'}
      - say: 'Food is 59%, the 59 orange squares, so its angle is 59 times 3.6. 60 times 3.6 is 216, and taking away one 3.6 gives 212.4 degrees.'
        write: '$59 \times 3.6^{\circ} = 216 - 3.6 = 212.4^{\circ}$'
        doodle_do:
          - {id: hundred, op: circle, part: food}
          - {id: hundred, op: label, part: food, text: '212.4°'}
        point:
