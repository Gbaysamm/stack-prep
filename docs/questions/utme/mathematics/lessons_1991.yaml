      - say: 'The area of a square is its side squared.'
        write: 'Area of a square $= \text{side}^{2}$'
      - say: 'The square has area 8 times 8, which is 64.'
        write: '$\text{square} = 8 \times 8 = 64$'
      - say: 'The area of a triangle is half the base times the height.'
        write: 'Area of a triangle $= \tfrac{1}{2} \times \text{base} \times \text{height}$'
      - say: 'The first piece is the right-angled triangle $U Q V$ at the top right. Its legs are 4 and 6, so its area is half of 4 times 6, which is 12.'
        write: '$\triangle UQV = \tfrac{1}{2}(4)(6) = 12$'
        point:
          - {figure: 0, kind: highlight, target: UQ, text: '4'}
          - {figure: 0, kind: highlight, target: QV, text: '6'}
      - say: 'The second piece is the small triangle $V R W$. $V R$ is 8 minus 6, which is 2.'
        write: '$VR = 8 - 6 = 2$'
        point:
          - {figure: 0, kind: label, target: VR, text: '2'}
      - say: 'Its legs are 2 and 2, so its area is half of 2 times 2, which is 2.'
        write: '$\triangle VRW = \tfrac{1}{2}(2)(2) = 2$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '= 2'}, at: '[[(2)]](2)', text: 'VR'}
      - say: 'The third piece is the trapezium $P U W S$ on the left. $P U$ is 8 minus 4, which is 4.'
        write: '$PU = 8 - 4 = 4$'
        point:
          - {figure: 0, kind: label, target: PU, text: '4'}
      - say: 'And $S W$ is 8 minus 2, which is 6.'
        write: '$SW = 8 - 2 = 6$'
        point:
          - {figure: 0, kind: label, target: SW, text: '6'}
      - say: 'The area of a trapezium is half the sum of the two parallel sides, times the height between them.'
        write: 'Area of a trapezium $= \tfrac{1}{2}(a + b)h$'
      - say: 'The trapezium has parallel sides 4 and 6, and height 8. Its area is half the sum of the parallel sides times the height.'
        write: '$\text{trapezium} = \tfrac{1}{2}(4 + 6)(8)$'
        point:
          - {line: 11, kind: move, from: {line: 8, at: '= 4'}, at: '(4', text: 'PU'}
          - {line: 11, kind: move, from: {line: 9, at: '= 6'}, at: '+ 6', text: 'SW'}
          - {figure: 0, kind: highlight, target: PS, text: 'height 8'}
      - say: '4 plus 6 is 10, half of 10 is 5, and 5 times 8 is 40.'
        write: '$= 40$'
      - say: 'Together the three pieces cover 12 plus 2 plus 40, which is 54.'
        write: '$12 + 2 + 40 = 54$'
      - say: 'Take the square minus that: 64 minus 54 is 10. So the triangle has area 10 square centimetres, which is answer choice D.'
        write: '$\triangle UVW = 64 - 54 = 10\ \text{cm}^{2}$'
        answer: true
        point:
          - {line: 14, kind: move, from: {line: 3, at: '= 64'}, at: '64', text: 'square'}
          - {line: 14, kind: move, from: {line: 13, at: '= 54'}, at: '54', text: 'pieces'}
          - {figure: 0, kind: label, target: {x: 206, y: 153}, text: '10 cm²'}
    traps:
      A: 'You went for 64. That is the whole square. The triangle is only part of it: take away the three outside pieces, 12, 2 and 40, to leave 10.'
      B: 'You went for 54. That is the area outside the triangle. The last step is 64 minus 54, which leaves 10.'
      C: 'You went for 50. Check the pieces outside: 12, 2 and 40 make 54, and 64 minus 54 is 10.'

  45:
    moments:
      - say: 'We want the total surface area of a solid cylinder with radius 4 cm and height 5 cm.'
        write: '$r = 4,\quad h = 5$'
      - say: 'Let me draw the cylinder.'
