  49:
    moments:
      - section: 'The question'
        say: 'Fifty boxes were inspected for defective bolts. We want the percentage of boxes with at least 5 defective bolts each. Let me copy the frequency table.'
        write: 'Percentage of boxes with at least 5 defective $= ?$'
        diagram:
          id: f
          kind: table
          columns: ['No. defective', 'No. of boxes']
          rows: [[4, 2], [5, 7], [6, 17], [7, 10], [8, 8], [9, 6]]
      - section: 'Solution'
        say: 'Solution. At least 5 means 5 or more. So it includes the boxes with exactly 5 defective, and leaves out only the 4s.'
        write: 'Solution: at least 5 $\Rightarrow 5,\ 6,\ 7,\ 8$ or $9$ defective'
        diagram_do:
          - {id: f, op: highlight, part: 'row:1', colour: red, text: 'fewer than 5: left out'}
      - section: 'Count the boxes'
        say: 'Add the boxes for 5, 6, 7, 8 and 9 defective. 7 plus 17 is 24, plus 10 is 34, plus 8 is 42, plus 6 is 48.'
        write: 'No. of boxes $= 7 + 17 + 10 + 8 + 6 = 48$'
      - say: 'The total number of boxes is the sum of the whole column. It is 50, just as the question says.'
        write: 'Total $= \Sigma f = 2 + 7 + 17 + 10 + 8 + 6 = 50$'
        diagram_do:
          - {id: f, op: total, part: 'col:2'}
      - section: 'The percentage'
        say: 'The percentage is the part over the whole, times 100 percent.'
        write: 'Percentage $= \dfrac{\text{part}}{\text{whole}} \times 100\%$'
      - say: 'Substitute 48 boxes out of 50.'
        write: '$= \dfrac{48}{50} \times 100\%$'
      - say: 'Cancel first, because 100 divided by 50 is 2. 48 times 2 is 96.'
        write: '$= 48 \times 2\% = 96\%$'
      - section: 'Check'
        say: 'Check the other way. Only 2 boxes have fewer than 5 defective, and 50 minus 2 is 48 again.'
        write: 'Check: $50 - 2 = 48\ \checkmark$'
      - say: 'Therefore 96 percent of the boxes have at least 5 defective bolts, which is option A.'
        write: '$\therefore$ percentage $= 96\%$'
        answer: true
    traps:
      B: 'You went for 94. That is 47 boxes out of 50. At least 5 includes exactly 5, so add 7, 17, 10, 8 and 6: 48 boxes, which is 96 percent.'
      C: 'You went for 92. That is 46 boxes out of 50. Only the 2 boxes with 4 defective are left out, so 48 boxes count: 96 percent.'
      D: 'You went for 90. That is 45 boxes out of 50. Adding 7, 17, 10, 8 and 6 gives 48 boxes, and 48 over 50 times 100 is 96 percent.'

  50:
    moments:
      - section: 'The question'
        say: 'A crate has 10 bottles of Coca-Cola, 8 of Fanta and 6 of Sprite. One bottle is picked at random. What is the probability that it is NOT a Coca-Cola? Watch the word "not".'
        write: 'Coca-Cola $10$, Fanta $8$, Sprite $6$'
        doodle: {name: 'custom:1991_q50_a', id: crate, caption: '10 Coke, 8 Fanta, 6 Sprite'}
      - say: 'Solution. Let $C$ be the event that the bottle is a Coca-Cola. Not Coca-Cola is $C$ complement, written $C$ prime.'
        write: 'Solution: let $C$ = Coca-Cola; want $P(C^{\prime})$'
      - section: 'The sample space'
        say: 'n of $S$ is every bottle in the crate, so 10 plus 8 plus 6, which is 24. One ball here for each bottle.'
        write: '$n(S) = 10 + 8 + 6 = 24$'
        doodle: {id: bottles, caption: 'red Coke, yellow Fanta, green Sprite', repeat: [{name: 'ball-red', n: 10}, {name: 'ball-yellow', n: 8}, {name: 'ball-green', n: 6}], layout: grid}
        doodle_do:
          - {id: bottles, op: count}
      - section: 'The favourable outcomes'
        say: 'Not Coca-Cola means Fanta or Sprite. Split off the 10 red Coca-Colas, and n of $C$ prime is 8 plus 6, which is 14.'
        write: '$n(C^{\prime}) = 8 + 6 = 14$'
        doodle_do:
          - {id: bottles, op: split, n: 10, text: 'Coca-Cola 10 | not Coca-Cola 14'}
      - section: 'The probability'
        say: 'The probability is the number of favourable outcomes over the total number of possible outcomes.'
        write: '$P(C^{\prime}) = \dfrac{n(C^{\prime})}{n(S)}$'
      - say: 'Substitute to get 14 over 24.'
        write: '$= \dfrac{14}{24}$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '= 14'}, at: '24[[14]]', text: 'not Coca-Cola'}
          - {line: 5, kind: move, from: {line: 2, at: '= 24'}, at: '[[24]]14', text: 'n(S)'}
      - say: 'Divide the top and the bottom by 2. 14 divided by 2 is 7, and 24 divided by 2 is 12.'
        write: '$= \dfrac{7}{12}$'
      - section: 'Check'
        say: 'Check with the complement rule. First P of $C$, the Coca-Cola section of the crate, is 10 over 24, which is 5 over 12.'
        write: 'Check: $P(C) = \dfrac{10}{24} = \dfrac{5}{12}$'
        doodle_do:
          - {id: crate, op: circle, part: coke}
      - say: 'P of $C$ prime is 1 minus P of $C$. 1 is 12 over 12, and 12 minus 5 is 7. So 7 over 12 again.'
        write: '$P(C^{\prime}) = 1 - \dfrac{5}{12} = \dfrac{7}{12}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the probability that the bottle is not a Coca-Cola, a Fanta or a Sprite, is 7 over 12, which is option D.'
        write: '$\therefore P(\text{not Coca-Cola}) = \dfrac{7}{12}$'
        doodle_do:
          - {id: crate, op: circle, part: fanta}
          - {id: crate, op: circle, part: sprite}
        answer: true
    traps:
      A: 'You went for 5 over 12. That is P of C, that it IS a Coca-Cola: 10 out of 24. The question says NOT, so count the 14 Fanta and Sprite bottles: 14 over 24, which is 7 over 12.'
      B: 'You went for 1 over 3. That is 8 out of 24, the Fanta alone. Not Coca-Cola means Fanta or Sprite, 8 plus 6, which is 14 out of 24.'
      C: 'You went for 3 over 4. That would be 18 bottles out of 24. The bottles that are not Coca-Cola are 8 Fanta and 6 Sprite, which is 14, giving 7 over 12.'
