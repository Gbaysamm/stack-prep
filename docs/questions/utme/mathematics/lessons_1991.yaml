  48:
    moments:
      - say: 'Fifty boxes of bolts were checked for defective bolts. Picture the boxes stacked by the number defective in each. We want the mean and then the median of the number defective per box.'
        write: '$x:\ 4,\ 5,\ 6,\ 7,\ 8,\ 9 \qquad f:\ 2,\ 7,\ 17,\ 10,\ 8,\ 6$'
        doodle: {name: 'custom:1991_q48_a', id: stacks, caption: '50 boxes, stacked by defects'}
      - say: 'The mean of a frequency table is the sum of f times x, over the sum of f.'
        write: 'Mean $= \dfrac{\sum fx}{\sum f}$'
      - say: 'The mean is the sum of $f$ times $x$, divided by the sum of $f$. First, the total number of boxes, all the stacks together. 2 plus 7 is 9, plus 17 is 26, plus 10 is 36, plus 8 is 44, plus 6 is 50.'
        write: '$\sum f = 2 + 7 + 17 + 10 + 8 + 6 = 50$'
        doodle_do:
          - {id: stacks, op: pulse}
      - say: 'Now each $f$ times $x$. 4 times 2 is 8, 5 times 7 is 35, and 6 times 17 is 102.'
        write: '$4 \times 2 = 8,\quad 5 \times 7 = 35,\quad 6 \times 17 = 102$'
      - say: '7 times 10 is 70, 8 times 8 is 64, and 9 times 6 is 54.'
        write: '$7 \times 10 = 70,\quad 8 \times 8 = 64,\quad 9 \times 6 = 54$'
      - say: 'Add them. 8 plus 35 is 43, plus 102 is 145, plus 70 is 215, plus 64 is 279, plus 54 is 333.'
        write: '$\sum fx = 333$'
      - say: 'So the mean is 333 over 50, which is 6.66. To one decimal place, that is 6.7: the point where the stacks would balance.'
        write: '$\text{mean} = \dfrac{333}{50} = 6.66 \approx 6.7$'
        doodle_do:
          - {id: stacks, op: stage, stage: 'custom:1991_q48_a2'}
          - {id: stacks, op: label, part: mean, text: 'mean 6.7'}
        point:
