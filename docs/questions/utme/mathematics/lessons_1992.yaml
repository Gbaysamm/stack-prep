      - say: 'What is an identity element? Picture a machine that combines $m$ with $e$. The identity is the $e$ that leaves everything unchanged: $m$ star $e$ gives back $m$, for every $m$.'
        write: '$m * e = m$'
        doodle: {name: 'custom:1992_q21_a', id: machine, caption: 'a machine that changes nothing'}
        doodle_do:
