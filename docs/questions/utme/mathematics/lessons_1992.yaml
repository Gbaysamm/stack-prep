# UTME 1992 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1992.yaml. Answers match that file.
format_version: 1
exam_year: 1992
lessons:
  1:
    moments:
      - say: 'We''re told that 34 in base $n$ equals 10011 in base 2, and we want to find the base $n$.'
        write: '$34_{n} = 10011_{2}$'
      - say: 'Two numbers in different bases can only be compared once both are written in base ten. So the plan is to convert each side to base ten, then set them equal.'
        write: 'Plan: change both sides to base ten'
      - say: 'Let''s start with the binary side, because it has no unknown. Reading from the right, the place values in base 2 are 1, 2, 4, 8 and 16.'
        write: 'Place values in base 2: $16,\ 8,\ 4,\ 2,\ 1$'
      - say: 'Now multiply each digit by its place value: 1 times 16, 0 times 8, 0 times 4, 1 times 2, and 1 times 1.'
        write: '$10011_{2} = 1 \times 16 + 0 \times 8 + 0 \times 4 + 1 \times 2 + 1 \times 1$'
      - say: '1 times 16 is 16. The two zeros give nothing. 1 times 2 is 2, and 1 times 1 is 1.'
        write: '$= 16 + 0 + 0 + 2 + 1$'
      - say: '16 plus 2 is 18, and 18 plus 1 is 19. So the binary side is 19 in base ten.'
        write: '$= 19$'
      - say: 'Now the left side, 34 in base $n$. The 4 is in the units place, and the 3 is in the $n$ place. So it means 3 lots of $n$, plus 4 units.'
        write: '$34_{n} = 3 \times n + 4 \times 1$'
      - say: 'That is simply $3n$ plus 4.'
        write: '$= 3n + 4$'
      - say: 'Both sides are the same number. So the $3n$ plus 4 we just found must equal the 19 from the binary side.'
        write: '$3n + 4 = 19$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '3n + 4'}, at: '3n + 4', text: 'left side'}
          - {line: 8, kind: move, from: {line: 5, at: '19'}, at: '19', text: 'right side'}
      - say: 'Subtract 4 from both sides. 19 minus 4 is 15.'
        write: '$3n = 19 - 4 = 15$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '+ 4'}, at: '− 4', text: 'across the ='}
      - say: 'Now divide both sides by 3. 15 divided by 3 is 5.'
        write: '$n = \dfrac{15}{3} = 5$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '[[3]]n'}, at: '3', text: 'divide by 3'}
      - say: 'One quick check: in base 5 you may only use the digits 0 to 4. Our digits are 3 and 4, both less than 5, so base 5 is allowed.'
        write: 'Digits: $3 < 5$ and $4 < 5$'
      - say: 'And putting 5 back in, 34 in base 5 is 3 times 5 plus 4, which is 19. That matches the binary side.'
        write: 'Check: $34_{5} = 3 \times 5 + 4 = 19\ \checkmark$'
      - say: 'So $n$ is 5, which is answer choice A.'
        write: '$n = 5$'
        answer: true
    traps:
      B: 'You went for 6. Check it: $34_{6}$ is 3 times 6 plus 4, which is 22, not 19. Solve $3n + 4 = 19$ and you get 5.'
      C: 'You went for 7. $34_{7}$ is 3 times 7 plus 4, which is 25, not 19. The 3 counts lots of $n$, so $3n + 4 = 19$ gives $n = 5$.'
      D: 'You went for 8. $34_{8}$ is 3 times 8 plus 4, which is 28, not 19. Convert $10011_{2}$ to 19 first, then solve $3n + 4 = 19$.'
  2:
    moments:
      - say: 'The radius of a circle is 5 centimetres, but it may be out by 0.1 centimetres. We want the percentage error this causes in the area.'
        write: '$r = 5\text{ cm},\quad \text{error in } r = 0.1\text{ cm}$'
      - say: 'Let me draw a diagram of the circle first, so we can see what we are working with.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'r = 5 cm', text: 'radius'}
          - {figure: sketch, kind: circle, target: 'error 0.1 cm', text: 'out by this'}
      - say: 'The area of a circle is pi $r$ squared. Because the radius is squared, an error in the radius gets doubled in the area. Let''s see how.'
        write: 'Area: $A = \pi r^{2}$'
        point:
          - {figure: sketch, kind: circle, target: 'A = ?', text: 'A = πr²'}
      - say: 'First, the relative error in the radius. That is the error divided by the radius itself: 0.1 over 5.'
        write: 'Relative error in $r = \dfrac{0.1}{5}$'
      - say: '0.1 divided by 5 is 0.02.'
        write: '$= 0.02$'
      - say: 'Why does it double for the area? Because $r$ squared is $r$ times $r$, and each of those two $r$s carries the same relative error. The two errors add.'
        write: 'Relative error in $r^{2} = 2 \times$ relative error in $r$'
      - say: 'So the relative error in the area is 2 times the 0.02 we just found. 2 times 0.02 is 0.04.'
        write: 'Relative error in $A = 2 \times 0.02 = 0.04$'
        point:
          - {line: 5, kind: box, text: 'the rule'}
          - {line: 6, kind: move, from: {line: 4, at: '0.02'}, at: '0.02', text: 'from here'}
      - say: 'To turn a relative error into a percentage, multiply by 100. 0.04 times 100 is 4.'
        write: 'Percentage error $= 0.04 \times 100 = 4\%$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '0.04'}, at: '0.04'}
      - say: 'Let''s check it the long way. The true area is pi times 5 squared. 5 squared is 25, so that is 25 pi.'
        write: 'True area $= \pi(5)^{2} = 25\pi$'
      - say: 'The largest possible radius is 5 plus 0.1, which is 5.1. And 5.1 squared is 26.01, so the largest area is 26.01 pi.'
        write: 'Largest area $= \pi(5.1)^{2} = 26.01\pi$'
        point:
          - {figure: sketch, kind: underline, target: 'error 0.1 cm', text: 'r = 5.1 cm'}
      - say: 'The error in the area is the difference: 26.01 pi minus 25 pi, which is 1.01 pi.'
        write: 'Error in area $= 26.01\pi - 25\pi = 1.01\pi$'
      - say: 'As a percentage of the true area: 1.01 pi over 25 pi, times 100. The pi cancels, giving 4.04 percent, which is 4 percent to the nearest whole number.'
        write: 'Percentage error $= \dfrac{1.01\pi}{25\pi} \times 100 = 4.04\% \approx 4\%$'
        point:
          - {line: 11, kind: move, from: {line: 10, at: '1.01π'}, at: '1.01π', text: 'the error'}
          - {line: 11, kind: move, from: {line: 8, at: '25π'}, at: '25π', text: 'true area'}
      - say: 'Both ways agree. So the percentage error in the area is 4, which is answer choice C.'
        write: 'Percentage error in area $= 4\%$'
        answer: true
    traps:
      A: 'You went for 1 over 25. That is 0.04, the relative error in the area, but it has not been turned into a percentage yet. Multiply by 100 and you get 4.'
      B: 'You went for a quarter. That doesn''t come from the error at all. The relative error in the radius is 0.1 over 5, which is 0.02; double it to 0.04, and as a percentage that is 4.'
      D: 'You went for 25. That''s the area $25\pi$ without the $\pi$, not an error. The percentage error is 2 times 0.1 over 5, times 100, which is 4.'
  3:
    moments:
      - say: 'We''re asked to evaluate log to base $b$ of $a$ to the $n$, where $b$ is $a$ to the power 1 over $n$.'
        write: '$\log_{b}a^{n},\quad b = a^{1/n}$'
      - say: 'Notice that the base, $b$, and the number, $a$ to the $n$, are both powers of $a$. So the plan is to change the base of the logarithm to $a$.'
        write: 'Plan: change the base to $a$'
      - say: 'The change-of-base rule says log to base $b$ of $X$ equals log to base $a$ of $X$, divided by log to base $a$ of $b$.'
        write: 'Change of base: $\log_{b}X = \dfrac{\log_{a}X}{\log_{a}b}$'
      - say: 'Using that rule with $X$ as $a$ to the $n$, our logarithm becomes log base $a$ of $a$ to the $n$, over log base $a$ of $b$.'
        write: '$\log_{b}a^{n} = \dfrac{\log_{a}a^{n}}{\log_{a}b}$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
      - say: 'Now the top. Log base $a$ of $a$ to the $n$ asks: what power of $a$ gives $a$ to the $n$? The answer is simply $n$.'
        write: 'Top: $\log_{a}a^{n} = n$'
      - say: 'Now the bottom. We were told that $b$ is $a$ to the 1 over $n$, so we put that in for $b$.'
        write: 'Bottom: $\log_{a}b = \log_{a}a^{1/n}$'
        point:
          - {line: 5, kind: move, from: {line: 0, at: 'a1/n'}, at: 'a1/n', text: 'given'}
      - say: 'Same idea: what power of $a$ gives $a$ to the 1 over $n$? It is 1 over $n$.'
        write: '$= \dfrac{1}{n}$'
      - say: 'Now go back to our fraction and put in the top, $n$, and the bottom, 1 over $n$.'
        write: '$\log_{b}a^{n} = \dfrac{n}{\;1/n\;}$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '=[[n]]'}, at: '1/n[[n]]', text: 'top'}
          - {line: 7, kind: move, from: {line: 6, at: 'n1'}, at: '1/n', text: 'bottom'}
      - say: 'Dividing by a fraction means multiplying by that fraction turned upside down. 1 over $n$ turned upside down is $n$ over 1, which is just $n$.'
        write: '$= n \times \dfrac{n}{1} = n \times n$'
      - say: '$n$ times $n$ is $n$ squared.'
        write: '$= n^{2}$'
      - say: 'Let''s check from the meaning of a log. If the answer is $n$ squared, then $b$ raised to the power $n$ squared should give $a$ to the $n$. Put in $b$ as $a$ to the 1 over $n$.'
        write: 'Check: $b^{n^{2}} = \left(a^{1/n}\right)^{n^{2}}$'
      - say: 'A power of a power: multiply the indices. 1 over $n$ times $n$ squared is $n$. So we get $a$ to the $n$, exactly our number.'
        write: '$= a^{n^{2}/n} = a^{n}\ \checkmark$'
      - say: 'So log base $b$ of $a$ to the $n$ is $n$ squared, which is answer choice A.'
        write: '$\log_{b}a^{n} = n^{2}$'
        answer: true
    traps:
      B: 'You went for $n$. That''s only the top of the fraction, log base $a$ of $a$ to the $n$. You still have to divide by log base $a$ of $b$, which is 1 over $n$, and that gives $n$ squared.'
      C: 'You went for 1 over $n$. That''s log base $a$ of $b$, the bottom of the change-of-base fraction. Keep going: $n$ divided by 1 over $n$ is $n$ squared.'
      D: 'You went for 1 over $n$ squared. That''s the fraction turned upside down. It''s the top, $n$, divided by the bottom, 1 over $n$, which gives $n$ squared.'
  4:
    moments:
      - say: 'We want the value of $x$ that makes 4 to the $2x$, divided by 4 to the $3x$, equal to 2.'
        write: '$\dfrac{4^{2x}}{4^{3x}} = 2$'
      - say: 'The plan is to write both sides as powers of the same number. Then the powers themselves must be equal.'
        write: 'Plan: the same base on both sides'
      - say: 'The rule for dividing powers of the same base: subtract the indices.'
        write: 'Division law: $\dfrac{a^{m}}{a^{n}} = a^{m - n}$'
      - say: 'First, the left side. When we divide powers of the same base, we subtract the indices: the top index minus the bottom index.'
        write: '$\dfrac{4^{2x}}{4^{3x}} = 4^{2x - 3x}$'
        point:
          - {line: 3, kind: move, from: {line: 3, at: '4[[3x]]4'}, at: '−3x', text: 'subtract'}
      - say: '$2x$ minus $3x$ is negative $x$. So the equation now reads 4 to the negative $x$ equals 2.'
        write: '$4^{-x} = 2$'
      - say: 'The right side is 2, which is not a whole power of 4. But 4 is 2 squared, so let''s replace the 4 with 2 squared.'
        write: '$\left(2^{2}\right)^{-x} = 2$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '4'}, at: '(22)', text: '4 = 2²'}
      - say: 'The rule for a power of a power: multiply the indices.'
        write: 'Power of a power: $\left(a^{m}\right)^{n} = a^{mn}$'
      - say: 'A power of a power means we multiply the indices. 2 times negative $x$ is negative $2x$.'
        write: '$2^{-2x} = 2$'
      - say: 'And the 2 on the right is 2 to the power 1.'
        write: '$2^{-2x} = 2^{1}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '=[[2]]'}, at: '21'}
      - say: 'Now both sides are powers of 2, so the indices must be equal: negative $2x$ equals 1.'
        write: '$-2x = 1$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '−2x'}, at: '−2x', text: 'this power'}
          - {line: 9, kind: move, from: {line: 8, at: '2[[1]]'}, at: '1', text: 'equals this'}
      - say: 'To get $x$ by itself, divide both sides by negative 2. 1 divided by negative 2 is negative 1 over 2.'
        write: '$x = \dfrac{1}{-2} = -\dfrac{1}{2}$'
      - say: 'Let''s check in the original equation. With $x$ as negative 1 over 2, $2x$ is negative 1 and $3x$ is negative 3 over 2.'
        write: 'Check: $2x = -1,\quad 3x = -\dfrac{3}{2}$'
      - say: 'So the fraction is 4 to the negative 1, over 4 to the negative 3 over 2. Subtract the indices: negative 1 minus negative 3 over 2 is positive 1 over 2.'
        write: '$\dfrac{4^{-1}}{4^{-3/2}} = 4^{-1 + 3/2} = 4^{1/2}$'
      - say: '4 to the power a half is the square root of 4, which is 2. That matches the right-hand side.'
        write: '$= \sqrt{4} = 2\ \checkmark$'
      - say: 'So $x$ is negative a half, which is answer choice B.'
        write: '$x = -\dfrac{1}{2}$'
        answer: true
    traps:
      A: 'You went for negative 2. That divides the wrong way round at the end. From negative $2x$ equals 1, $x$ is 1 divided by negative 2, which is negative 1 over 2.'
      C: 'You went for a half. The sign is wrong. Top index minus bottom index is $2x$ minus $3x$, which is negative $x$, so the answer comes out negative.'
      D: 'You went for 2. That''s the right-hand side of the equation, not $x$. Write both sides in base 2: negative $2x$ equals 1, so $x$ is negative a half.'
  5:
    moments:
      - say: 'We need to simplify this standard form fraction: 1.25 times 10 to the 4, times 2.0 times 10 to the negative 1, all over 6.25 times 10 to the 5.'
        write: '$\dfrac{(1.25 \times 10^{4}) \times (2.0 \times 10^{-1})}{6.25 \times 10^{5}}$'
      - say: 'The tidy way is to handle the ordinary numbers and the powers of ten separately, because each follows its own simple rule.'
        write: 'Plan: numbers and powers of ten separately'
      - say: 'Start with the top. Multiply the numbers: 1.25 times 2.0 is 2.5.'
        write: 'Top numbers: $1.25 \times 2.0 = 2.5$'
      - say: 'The rule for multiplying powers of the same base: add the indices.'
        write: 'Multiplication law: $a^{m} \times a^{n} = a^{m + n}$'
      - say: 'Now the powers of ten on the top. When we multiply powers, we add the indices. 4 plus negative 1 is 3.'
        write: 'Top powers: $10^{4} \times 10^{-1} = 10^{4 + (-1)} = 10^{3}$'
      - say: 'Putting those two results together, the top is 2.5 times 10 cubed, and the bottom is still 6.25 times 10 to the 5.'
        write: '$= \dfrac{2.5 \times 10^{3}}{6.25 \times 10^{5}}$'
        point:
          - {line: 5, kind: move, from: {line: 2, at: '= [[2.5]]'}, at: '[[2.5]] × 103', text: 'numbers'}
          - {line: 5, kind: move, from: {line: 4, at: '103'}, at: '103', text: 'powers'}
      - say: 'Now divide the numbers. 2.5 divided by 6.25 is 0.4. You can see it because 6.25 times 0.4 is 2.5.'
        write: 'Numbers: $2.5 \div 6.25 = 0.4$'
      - say: 'The rule for dividing powers of the same base: subtract the indices.'
        write: 'Division law: $\dfrac{a^{m}}{a^{n}} = a^{m - n}$'
      - say: 'Then the powers of ten. When we divide powers, we subtract the indices. 3 minus 5 is negative 2.'
        write: 'Powers: $10^{3} \div 10^{5} = 10^{3 - 5} = 10^{-2}$'
      - say: 'Putting the 0.4 and the 10 to the negative 2 together, we have 0.4 times 10 to the negative 2.'
        write: '$= 0.4 \times 10^{-2}$'
        point:
          - {line: 9, kind: move, from: {line: 6, at: '0.4'}, at: '0.4'}
          - {line: 9, kind: move, from: {line: 8, at: '10−2'}, at: '10−2'}
      - say: 'But that is not standard form yet. In standard form, the number in front must be at least 1 and less than 10, and 0.4 is less than 1.'
        write: 'Standard form needs $1 \le \text{number} < 10$'
      - say: '0.4 is the same as 4.0 times 10 to the negative 1. So we replace the 0.4 with that.'
        write: '$= 4.0 \times 10^{-1} \times 10^{-2}$'
        point:
          - {line: 11, kind: move, from: {line: 9, at: '0.4'}, at: '4.0 × 10−1', text: 'same as 0.4'}
      - say: 'Multiplying powers of ten, add the indices: negative 1 plus negative 2 is negative 3.'
        write: '$= 4.0 \times 10^{-1 + (-2)} = 4.0 \times 10^{-3}$'
      - say: 'So the answer is 4.0 times 10 to the negative 3, which is answer choice A.'
        write: 'Answer: $4.0 \times 10^{-3}$'
        answer: true
    traps:
      B: 'You went for 5.0 times 10 to the negative 2. Check the division of the numbers: 2.5 divided by 6.25 is 0.4, not 5. Then 0.4 times 10 to the negative 2 becomes 4.0 times 10 to the negative 3.'
      C: 'You went for 2.0 times 10 to the negative 1. That''s just the second number in the question. Multiply the top out to 2.5 times 10 cubed first, then divide by 6.25 times 10 to the 5.'
      D: 'You went for 5.0 times 10 cubed. The power of ten should come out negative: 10 cubed divided by 10 to the 5 is 10 to the negative 2. The final answer is 4.0 times 10 to the negative 3.'
  6:
    moments:
      - say: 'We need to simplify 5 root 18, minus 3 root 72, plus 4 root 50.'
        write: '$5\sqrt{18} - 3\sqrt{72} + 4\sqrt{50}$'
      - say: 'We can only add or subtract surds when they have the same number under the root. So the plan is to break each surd down, pulling out the biggest perfect square inside it.'
        write: 'Plan: simplify each surd first'
      - say: 'Start with root 18. 18 is 9 times 2, and 9 is a perfect square.'
        write: '$\sqrt{18} = \sqrt{9 \times 2}$'
      - say: 'The rule for splitting a root: the square root of a product is the product of the square roots.'
        write: 'Surd rule: $\sqrt{ab} = \sqrt{a} \times \sqrt{b}$'
      - say: 'The square root of 9 is 3, so root 18 is 3 root 2.'
        write: '$= \sqrt{9} \times \sqrt{2} = 3\sqrt{2}$'
      - say: 'So the first term, 5 root 18, is 5 times 3 root 2. 5 times 3 is 15.'
        write: '$5\sqrt{18} = 5 \times 3\sqrt{2} = 15\sqrt{2}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '32'}, at: '32', text: 'root 18'}
      - say: 'Next, root 72. 72 is 36 times 2, and the square root of 36 is 6. So root 72 is 6 root 2.'
        write: '$\sqrt{72} = \sqrt{36 \times 2} = 6\sqrt{2}$'
      - say: 'So the second term, 3 root 72, is 3 times 6 root 2. 3 times 6 is 18.'
        write: '$3\sqrt{72} = 3 \times 6\sqrt{2} = 18\sqrt{2}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '62'}, at: '62', text: 'root 72'}
      - say: 'Now root 50. 50 is 25 times 2, and the square root of 25 is 5. So root 50 is 5 root 2.'
        write: '$\sqrt{50} = \sqrt{25 \times 2} = 5\sqrt{2}$'
      - say: 'So the third term, 4 root 50, is 4 times 5 root 2. 4 times 5 is 20.'
        write: '$4\sqrt{50} = 4 \times 5\sqrt{2} = 20\sqrt{2}$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '52'}, at: '52', text: 'root 50'}
      - say: 'Now go back to the whole expression and put in the three terms we just found: 15 root 2, minus 18 root 2, plus 20 root 2.'
        write: '$5\sqrt{18} - 3\sqrt{72} + 4\sqrt{50} = 15\sqrt{2} - 18\sqrt{2} + 20\sqrt{2}$'
        point:
          - {line: 10, kind: move, from: {line: 5, at: '152'}, at: '152'}
          - {line: 10, kind: move, from: {line: 7, at: '182'}, at: '182'}
          - {line: 10, kind: move, from: {line: 9, at: '202'}, at: '202'}
      - say: 'Every term is now a multiple of root 2, so they are like terms. We combine the numbers in front and keep the root 2.'
        write: '$= (15 - 18 + 20)\sqrt{2}$'
      - say: '15 minus 18 is negative 3, and negative 3 plus 20 is 17.'
        write: '$= 17\sqrt{2}$'
      - say: 'So the expression simplifies to 17 root 2, which is answer choice C.'
        write: 'Answer: $17\sqrt{2}$'
        answer: true
    traps:
      A: 'You went for 17 root 4. The 17 is right, but every surd broke down to a multiple of root 2, not root 4. And root 4 is just 2, so 17 root 4 would really be the whole number 34.'
      B: 'You went for 4 root 17. That swaps the two numbers. The coefficients add up to 17, and the surd that is left over is root 2, giving 17 root 2.'
      D: 'You went for 12 root 4. Break each surd down using its biggest square factor: 15 root 2, minus 18 root 2, plus 20 root 2. That gives 17 root 2.'
  7:
    moments:
      - say: 'We''re told $x$ is 3 minus root 3, and we want $x$ squared plus 36 over $x$ squared.'
        write: '$x = 3 - \sqrt{3}$'
      - say: 'The plan: step 1, find $x$ squared. Step 2, find 36 over $x$ squared. Step 3, add them.'
        write: 'Step 1: $x^{2} = (3 - \sqrt{3})^{2}$'
      - say: 'First the pattern for squaring a bracket: $a$ minus $b$, all squared, is $a$ squared, minus $2ab$, plus $b$ squared.'
        write: 'Perfect square: $(a - b)^{2} = a^{2} - 2ab + b^{2}$'
      - say: 'To square a bracket, use the pattern: the first term squared, minus twice the first times the second, plus the second squared.'
        write: '$= 3^{2} - 2(3)(\sqrt{3}) + (\sqrt{3})^{2}$'
      - say: '3 squared is 9. 2 times 3 is 6, so the middle term is 6 root 3. And root 3 squared is just 3.'
        write: '$= 9 - 6\sqrt{3} + 3$'
      - say: '9 plus 3 is 12. So $x$ squared is 12 minus 6 root 3.'
        write: '$= 12 - 6\sqrt{3}$'
      - say: 'Step 2: 36 over $x$ squared. We put in the 12 minus 6 root 3 we just found for $x$ squared.'
        write: 'Step 2: $\dfrac{36}{x^{2}} = \dfrac{36}{12 - 6\sqrt{3}}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '12 − 63'}, at: '12 − 63', text: 'from step 1'}
      - say: 'Divide top and bottom by 6 to keep the numbers small. 36 over 6 is 6, 12 over 6 is 2, and 6 root 3 over 6 is root 3.'
        write: '$= \dfrac{6}{2 - \sqrt{3}}$'
      - say: 'There is a surd on the bottom, so we rationalise. Multiply top and bottom by the conjugate, 2 plus root 3.'
        write: '$= \dfrac{6(2 + \sqrt{3})}{(2 - \sqrt{3})(2 + \sqrt{3})}$'
      - say: 'The difference of two squares: $a$ minus $b$, times $a$ plus $b$, is $a$ squared minus $b$ squared.'
        write: 'Difference of two squares: $(a - b)(a + b) = a^{2} - b^{2}$'
      - say: 'The bottom is a difference of two squares: 2 squared minus root 3 squared. That is 4 minus 3, which is 1.'
        write: 'Bottom: $(2 - \sqrt{3})(2 + \sqrt{3}) = 2^{2} - (\sqrt{3})^{2} = 4 - 3 = 1$'
      - say: 'So the bottom is just 1. The top is 6 times 2, which is 12, plus 6 times root 3.'
        write: '$\dfrac{36}{x^{2}} = \dfrac{6(2 + \sqrt{3})}{1} = 12 + 6\sqrt{3}$'
      - say: 'Step 3: add the two parts. $x$ squared is 12 minus 6 root 3, from step 1, and 36 over $x$ squared is 12 plus 6 root 3, from step 2.'
        write: 'Step 3: $x^{2} + \dfrac{36}{x^{2}} = (12 - 6\sqrt{3}) + (12 + 6\sqrt{3})$'
        point:
