        write: '$z + 2 = 2 + 2 = 4$'
        doodle_do:
          - {id: seats, op: label, part: d3, text: '4'}
      - say: 'Putting those three numbers on the diagonal, the matrix $P$ becomes this.'
        write: '$P = \begin{pmatrix} 2 & 1 & 3 \\ 0 & 3 & 1 \\ 0 & 0 & 4 \end{pmatrix}$'
      - say: 'Now expand down the first column. Its entries are 2, 0 and 0. The zeros give nothing, so we get 2 times the small determinant left when we cover the row and column of the 2.'
        write: '$|P| = 2\begin{vmatrix} 3 & 1 \\ 0 & 4 \end{vmatrix} - 0 + 0$'
      - say: 'The rule for a 2 by 2 determinant: $a$ times $d$, minus $b$ times $c$.'
        write: 'Determinant: $\begin{vmatrix} a & b \\ c & d \end{vmatrix} = ad - bc$'
      - say: 'Now apply $ad - bc$ to the small determinant: 3 times 4, minus 1 times 0.'
        write: '$= 2(3 \times 4 - 1 \times 0)$'
      - say: '3 times 4 is 12, and 1 times 0 is 0.'
        write: '$= 2(12 - 0) = 2 \times 12$'
      - say: '2 times 12 is 24.'
        write: '$= 24$'
      - say: 'Notice that 24 is just 2 times 3 times 4, the product of the diagonal entries. That is the second fact: when every entry below the diagonal is zero, the determinant is the product of the diagonal.'
        write: 'Fact 2: $|P| = 2 \times 3 \times 4 = 24$'
        doodle_do:
