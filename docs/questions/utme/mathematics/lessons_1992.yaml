      D: 'You went for the empty set. That''s $E$ intersection $F$ itself. Don''t forget the dash: the complement of the empty set is the whole universal set $U$.'
  10:
    moments:
      - say: 'We need to make $t$ the subject of $s$ equals $ut$ plus a half $a t$ squared.'
        write: '$s = ut + \tfrac{1}{2}at^{2}$'
      - say: '$t$ appears squared and also on its own, so this is a quadratic in $t$. The plan is to arrange it in the standard form and use the quadratic formula.'
        write: 'Plan: write it as $At^{2} + Bt + C = 0$'
      - say: 'First, clear the fraction. Multiply every term by 2: $s$ becomes $2s$, $ut$ becomes $2ut$, and a half $at$ squared becomes $at$ squared.'
        write: '$2s = 2ut + at^{2}$'
      - say: 'Now bring everything to one side, highest power of $t$ first. Subtract $2s$ from both sides.'
        write: '$at^{2} + 2ut - 2s = 0$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '2s'}, at: '− 2s', text: 'across the ='}
      - say: 'Compare with $A t$ squared plus $B t$ plus $C$. The number in front of $t$ squared is $a$, in front of $t$ it is $2u$, and the constant is negative $2s$.'
        write: '$A = a,\quad B = 2u,\quad C = -2s$'
      - say: 'The quadratic formula says $t$ is negative $B$, plus or minus the root of $B$ squared minus $4AC$, all over $2A$.'
        write: '$t = \dfrac{-B \pm \sqrt{B^{2} - 4AC}}{2A}$'
      - say: 'Let''s work out the part under the root first, putting in $B$ as $2u$, $A$ as $a$, and $C$ as negative $2s$.'
        write: 'Under the root: $B^{2} - 4AC = (2u)^{2} - 4(a)(-2s)$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '2u'}, at: '(2u)', text: 'B'}
          - {line: 6, kind: move, from: {line: 4, at: '−2s'}, at: '(−2s)', text: 'C'}
      - say: '$2u$ squared is $4u$ squared. And 4 times $a$ times negative $2s$ is negative $8as$; minus a negative is plus. So we get $4u$ squared plus $8as$.'
        write: '$= 4u^{2} + 8as$'
      - say: 'Both terms have a factor of 4, so take the 4 out.'
        write: '$= 4(u^{2} + 2as)$'
      - say: 'So the square root is root 4 times the root of $u$ squared plus $2as$. And root 4 is 2.'
        write: '$\sqrt{B^{2} - 4AC} = \sqrt{4}\sqrt{u^{2} + 2as} = 2\sqrt{u^{2} + 2as}$'
      - say: 'Now put everything into the formula. Negative $B$ is negative $2u$, the root is the one we just found, and $2A$ is $2a$.'
        write: '$t = \dfrac{-2u \pm 2\sqrt{u^{2} + 2as}}{2a}$'
        point:
          - {line: 5, kind: box, text: 'the rule'}
          - {line: 10, kind: move, from: {line: 9, at: '2u2 + 2as'}, at: '2u2 + 2as', text: 'the root'}
      - say: 'Every term has a factor of 2, so cancel the 2 from the top and the bottom.'
        write: '$t = \dfrac{-u \pm \sqrt{u^{2} + 2as}}{a}$'
