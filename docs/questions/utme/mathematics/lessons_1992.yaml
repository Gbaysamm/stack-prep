        write: 'Total ₦280, at $5\%$ and $4\%$; total interest ₦12.80'
        doodle: {name: 'custom:1992_q13_a', caption: '₦280 split: part at 5%, rest at 4%'}
      - say: 'Let''s give the unknown a name. Let $x$ be the amount invested at 5%.'
        write: 'Amount at $5\%$: $x$'
      - say: 'The rest of the ₦280 is invested at 4%, so that part is 280 minus $x$.'
        write: 'Amount at $4\%$: $280 - x$'
      - say: 'Simple interest is the principal times the rate times the time, all over 100. Here the time is 1 year.'
        write: 'Simple interest: $I = \dfrac{PRT}{100}$'
      - say: 'Interest for one year is the rate times the amount, and 5% is 0.05. So the 5% part earns 0.05 times $x$.'
        write: 'Interest at $5\% = 0.05 \times x = 0.05x$'
      - say: 'In the same way, the 4% part earns 0.04 times the amount at 4%, which is 280 minus $x$.'
        write: 'Interest at $4\% = 0.04(280 - x)$'
        point:
          - {line: 5, kind: move, from: {line: 2, at: '280 − x'}, at: '(280 − x)', text: 'amount at 4%'}
      - say: 'Open the bracket. 0.04 times 280 is 11.20, and 0.04 times $x$ is $0.04x$.'
        write: '$= 0.04 \times 280 - 0.04x = 11.20 - 0.04x$'
      - say: 'The two interests together make ₦12.80. So we add the $0.05x$ from the first part to the 11.20 minus $0.04x$ from the second part.'
        write: '$0.05x + 11.20 - 0.04x = 12.80$'
        point:
