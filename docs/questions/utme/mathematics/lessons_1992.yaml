      - say: 'In triangle $PSQ$, the angles at $P$ and $Q$ share the 90 degrees left after the right angle at $S$. The reason is the angle sum of a triangle.'
        write: '$\angle QPS + \angle PQS = 90^{\circ}$ ($\angle$ sum of $\triangle$)'
      - say: 'At $Q$, the right angle $PQR$ is split into angle $PQS$ and angle $SQR$. They also add up to 90.'
        write: '$\angle SQR + \angle PQS = 90^{\circ}$ ($\angle PQR = 90^{\circ}$)'
        point:
