      - say: 'We''re choosing, not arranging, so order doesn''t matter. That means combinations: $n$ choose $r$ is $n$ factorial over $r$ factorial times $n$ minus $r$ factorial.'
        write: 'Combinations: $^{n}C_{r} = \dfrac{n!}{r!\,(n - r)!}$'
      - say: 'He takes 5 courses, and exactly 2 are Physics. So 5 minus 2, which is 3, must be Mathematics.'
