        write: 'Physics, 2 from 3: $^{3}C_{2} = \dfrac{3!}{2!\,1!}$'
      - say: '3 factorial is 3 times 2 times 1, which is 6. 2 factorial times 1 factorial is 2 times 1, which is 2. 6 divided by 2 is 3.'
