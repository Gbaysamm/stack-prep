  27:
    moments:
      - section: 'The question'
        say: 'Two towns, P and Q, both lie on latitude 60 degrees north, the same ring round the globe. P is 20 degrees east and Q is 25 degrees west. How far apart are they along the surface?'
        write: 'Find the distance $PQ$ along latitude $60^{\circ}$N.'
        doodle: {name: 'custom:1992_q27_a', id: globe, caption: 'two towns on latitude 60°N', size: scene}
        doodle_do:
          - {id: globe, op: highlight, part: ring, 'on': 'the same ring'}
      - say: 'Write Solution, then draw the earth with centre O, the equator, and the circle of latitude 60 degrees north with centre C. P and Q sit on that circle.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'lat. 60°N', text: 'parallel of latitude', 'on': 'circle of latitude'}
      - section: 'What we know'
        say: 'List the givens. P is 60 degrees north, 20 degrees east, and Q is 60 degrees north, 25 degrees west. The radius of the earth, capital R, is 6400 km.'
        write: '$P(60^{\circ}\text{N}, 20^{\circ}\text{E})$, $Q(60^{\circ}\text{N}, 25^{\circ}\text{W})$, $R = 6400$ km'
        doodle_do:
          - {id: globe, op: label, part: towns, text: '20°E and 25°W', 'on': '25 degrees west'}
      - section: 'The angle'
        say: 'The angle between them is the difference in longitude, theta. One is east and one is west of Greenwich, on opposite sides, so we add, and 20 plus 25 is 45 degrees.'
        write: '$\theta = 20^{\circ} + 25^{\circ} = 45^{\circ}$ (E and W: add)'
        point:
          - {figure: sketch, kind: arc, target: PCQ, text: '45°', 'on': '45 degrees'}
      - section: 'The formula'
        say: 'P and Q are on a small circle, not a great circle, so compare the two hoops. The radius of the small circle is R cos alpha, where alpha is the latitude, so its circumference is 2 pi R cos alpha. The arc from P to Q is theta over 360 of that circle, so the distance along the parallel is theta over 360, times 2 pi R cos alpha.'
        write: '$PQ = \dfrac{\theta}{360} \times 2\pi R\cos\alpha$'
        doodle_do:
          - {id: globe, op: stage, stage: 'custom:1992_q27_a2', 'on': 'compare the two hoops'}
        point:
          - {figure: sketch, kind: highlight, target: CP, text: 'r = R cos α', 'on': 'R cos alpha'}
      - section: 'Substitute'
        say: 'Substitute, so theta is 45, capital R is 6400, and alpha is 60 degrees.'
        write: '$= \dfrac{45}{360} \times 2 \times \pi \times 6400 \times \cos 60^{\circ}$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '= 45∘'}, at: '360[[45]]', text: 'θ', 'on': 'theta is 45'}
          - {figure: sketch, kind: circle, target: '60°', text: 'α', 'on': 'alpha is 60'}
      - section: 'Simplify'
        say: '45 over 360 is 1 over 8, since 8 times 45 is 360. And cos 60 degrees is a half.'
        write: '$= \dfrac{1}{8} \times 2\pi \times 6400 \times \dfrac{1}{2}$'
      - say: 'The 2 and the half cancel, leaving 1 over 8 of 6400 pi.'
        write: '$= \dfrac{1}{8} \times 6400\pi$'
      - say: '6400 divided by 8 is 800.'
        write: '$= 800\pi$'
      - say: 'Therefore the distance from P to Q is 800 pi kilometres.'
        write: '$\therefore PQ = 800\pi$ km'
        doodle_do:
          - {id: globe, op: move, part: plane, path: fly, 'on': 'from P to Q'}
          - {id: globe, op: label, part: plane, text: '800π km', 'on': 'kilometres'}
        point:
          - {figure: sketch, kind: label, target: 'arc PQ = ?', text: '800π km', 'on': 'Therefore'}
      - section: 'Check'
        say: 'Check in two steps. The radius of the parallel is 6400 cos 60, which is 3200 km. Its circumference is 2 pi times 3200, which is 6400 pi, and 1 over 8 of that is 800 pi.'
        write: 'Check: $r = 6400\cos 60^{\circ} = 3200$; $\dfrac{1}{8} \times 2\pi(3200) = 800\pi$ ✓'
        doodle_do:
          - {id: globe, op: label, part: small-hoop, text: '3200 km', 'on': '3200 km'}
        point:
          - {figure: sketch, kind: label, target: r, text: '3200 km', 'on': '3200 km'}
      - section: 'Answer'
        say: 'So the distance is 800 pi kilometres, which is answer choice C.'
        write: '$\therefore PQ = 800\pi$ km (C)'
        answer: true
    traps:
      A: 'You went for 800 pi over 9. The angle is 45 degrees, which is 1 over 8 of 360, and 1 over 8 of 6400 pi is 800 pi. There is no division by 9.'
      B: 'You went for 800 root 3 pi over 9. That uses sin 60 instead of cos 60, and also divides by 9. Along a parallel the radius is R cos alpha, which is 6400 times a half, or 3200.'
      D: 'You went for 800 root 3 pi. That uses sin 60 in place of cos 60. The radius of the parallel is R cos alpha, which is 3200, so PQ is 800 pi.'
