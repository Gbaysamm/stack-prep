  11:
    moments:
      - say: 'We need to factorise $9p$ squared minus $q$ squared plus $6qr$ minus $9r$ squared.'
        write: '$9p^{2} - q^{2} + 6qr - 9r^{2}$'
      - say: 'Four terms, and no common factor. But notice that the last three terms involve only $q$ and $r$. That is a hint to group them together.'
        write: 'Group the last three terms:'
      - say: 'Put the last three in a bracket with a minus sign in front. Taking out a minus flips every sign inside, so the plus $6qr$ becomes minus $6qr$ inside the bracket.'
        write: '$9p^{2} - q^{2} + 6qr - 9r^{2} = 9p^{2} - \left(q^{2} - 6qr + 9r^{2}\right)$'
      - say: 'Let''s check by opening the bracket again: minus $q$ squared, plus $6qr$, minus $9r$ squared. That is exactly what we started with.'
        write: 'Check: $-\left(q^{2} - 6qr + 9r^{2}\right) = -q^{2} + 6qr - 9r^{2}\ \checkmark$'
      - say: 'Now, the bracket is a perfect square. $q$ minus $3r$, all squared, is $q$ squared, minus 2 times $q$ times $3r$, plus $3r$ squared.'
        write: '$(q - 3r)^{2} = q^{2} - 2(q)(3r) + (3r)^{2}$'
      - say: '2 times $q$ times $3r$ is $6qr$, and $3r$ squared is $9r$ squared. That is exactly the bracket we made.'
        write: '$= q^{2} - 6qr + 9r^{2}$'
      - say: 'So we replace the bracket with $q$ minus $3r$, all squared.'
        write: '$9p^{2} - q^{2} + 6qr - 9r^{2} = 9p^{2} - (q - 3r)^{2}$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '(q − 3r)2'}, at: '(q − 3r)2', text: 'perfect square'}
      - say: 'And $9p$ squared is $3p$, all squared, because 3 squared is 9.'
        write: '$= (3p)^{2} - (q - 3r)^{2}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '=[[9p2]]'}, at: '(3p)2'}
      - say: 'Now this is a difference of two squares. $A$ squared minus $B$ squared factorises as $A$ minus $B$, times $A$ plus $B$.'
        write: 'Difference of two squares: $A^{2} - B^{2} = (A - B)(A + B)$'
      - say: 'Here $A$ is $3p$ and $B$ is $q$ minus $3r$. Put them in, keeping $B$ inside its own bracket.'
        write: '$= \left[3p - (q - 3r)\right]\left[3p + (q - 3r)\right]$'
        point:
          - {line: 8, kind: box, text: 'the rule'}
      - say: 'In the first bracket, the minus sign in front flips both signs: minus $q$, plus $3r$.'
        write: 'First bracket: $3p - (q - 3r) = 3p - q + 3r$'
      - say: 'In the second bracket, the plus sign changes nothing: plus $q$, minus $3r$.'
        write: 'Second bracket: $3p + (q - 3r) = 3p + q - 3r$'
      - say: 'So the factors are $3p$ minus $q$ plus $3r$, times $3p$ plus $q$ minus $3r$, which is answer choice C.'
        write: '$= (3p - q + 3r)(3p + q - 3r)$'
        answer: true
    traps:
      A: 'You went for option A. Multiply its $q$ terms: negative $3q$ times negative $q$ is plus $3q$ squared, but the expression has minus $q$ squared. The grouping gives $3p$ minus $q$ plus $3r$, times $3p$ plus $q$ minus $3r$.'
      B: 'You went for option B. Multiply its first terms: $6p$ times $3p$ is $18p$ squared, not $9p$ squared. The expression is $3p$ squared minus the square of $q$ minus $3r$.'
      D: 'You went for option D. It has minus $q$ in both brackets, so multiplying gives plus $q$ squared, the wrong sign. The second bracket must reverse every sign: plus $q$ minus $3r$.'
  12:
