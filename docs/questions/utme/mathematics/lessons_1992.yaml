  22:
    moments:
      - say: '$P$ is the 3 by 3 matrix shown, and $Q$ is its transpose. We want the determinant of $P$ transpose when $x$ is 0, $y$ is 1 and $z$ is 2.'
        write: '$P = \begin{pmatrix} x + 2 & 1 & 3 \\ 0 & y + 2 & 1 \\ 0 & 0 & z + 2 \end{pmatrix}$'
      - say: 'We want the determinant of $P$ transpose. The first fact that helps: transposing a matrix, which turns its rows into columns, never changes its determinant.'
        write: 'Fact 1: $\left|P^{T}\right| = |P|$'
      - say: 'So we only need the determinant of $P$ itself. Picture the matrix as entries in rows and columns: every entry below the diagonal holds a 0. Let''s put in the values on the diagonal. With $x$ as 0, $x$ plus 2 is 0 plus 2, which is 2.'
        write: '$x + 2 = 0 + 2 = 2$'
