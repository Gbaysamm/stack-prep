# UTME 1992 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1992.yaml. Answers match that file.
format_version: 1
exam_year: 1992
lessons:
  1:
    moments:
      - say: 'We''re told that $34$ in base $n$ equals $10011$ in base 2, and we want the base $n$.'
        write: '$34_{n} = 10011_{2}$'
      - say: 'Two numbers in different bases can only be compared once both are in base ten. So the plan is to convert each side to base ten, then set them equal.'
      - say: 'Let''s start with the binary side. Reading from the right, the place values in base 2 are 1, 2, 4, 8 and 16.'
        write: '$10011_{2} = 1 \times 16 + 0 \times 8 + 0 \times 4 + 1 \times 2 + 1 \times 1$'
      - say: '1 times 16 is 16. The zeros give nothing. 1 times 2 is 2, and 1 times 1 is 1.'
        write: '$= 16 + 0 + 0 + 2 + 1$'
      - say: '16 plus 2 plus 1 is 19.'
        write: '$= 19$'
      - say: 'Now the left side. In $34_{n}$, the 4 is in the units place, and the 3 is in the $n$ place. So it means 3 lots of $n$, plus 4.'
        write: '$34_{n} = 3 \times n + 4 \times 1$'
      - say: 'That''s simply $3n$ plus 4.'
        write: '$34_{n} = 3n + 4$'
      - say: 'Both sides are the same number, so we set the base-ten values equal.'
        write: '$3n + 4 = 19$'
      - say: 'Subtract 4 from both sides. 19 minus 4 is 15.'
        write: '$3n = 15$'
      - say: 'Now divide both sides by 3. 15 divided by 3 is 5.'
        write: '$n = 5$'
      - say: 'One quick check: in base 5 you may only use the digits 0 to 4. Our digits are 3 and 4, both less than 5, so base 5 is allowed.'
        write: '$3 < 5,\ 4 < 5$'
      - say: 'So $n$ is 5, which is answer choice A.'
        write: '$n = 5$'
        answer: true
    traps:
      B: 'You went for 6. Check it: $34_{6}$ is 3 times 6 plus 4, which is 22, not 19. Solve $3n + 4 = 19$ and you get 5.'
      C: 'You went for 7. $34_{7}$ is 3 times 7 plus 4, which is 25, not 19. The 3 counts lots of $n$, so $3n + 4 = 19$ gives $n = 5$.'
      D: 'You went for 8. $34_{8}$ is 3 times 8 plus 4, which is 28, not 19. Convert $10011_{2}$ to 19 first, then solve $3n + 4 = 19$.'
  2:
    moments:
      - say: 'The radius of a circle is 5 centimetres, with a possible error of 0.1 centimetres. We want the percentage error in the area.'
        write: '$r = 5\text{ cm},\quad \Delta r = 0.1\text{ cm}$'
      - say: 'The key idea: the area uses the radius squared. When you square a measurement, its relative error doubles.'
        write: '$A = \pi r^{2}$'
      - say: 'First, the relative error in the radius. That''s the error divided by the radius: 0.1 over 5.'
        write: '$\dfrac{\Delta r}{r} = \dfrac{0.1}{5}$'
      - say: '0.1 divided by 5 is 0.02.'
        write: '$\dfrac{\Delta r}{r} = 0.02$'
      - say: 'Because $r$ is squared, the relative error in the area is 2 times the relative error in the radius.'
        write: '$\dfrac{\Delta A}{A} = 2 \times \dfrac{\Delta r}{r}$'
      - say: '2 times 0.02 is 0.04.'
        write: '$\dfrac{\Delta A}{A} = 2 \times 0.02 = 0.04$'
      - say: 'To turn that into a percentage, multiply by 100. 0.04 times 100 is 4.'
        write: '$0.04 \times 100 = 4\%$'
      - say: 'Let''s check it the long way. The true area is $\pi$ times 5 squared, which is $25\pi$.'
        write: '$\pi(5)^{2} = 25\pi$'
      - say: 'The largest area is $\pi$ times 5.1 squared. 5.1 squared is 26.01, so that''s $26.01\pi$.'
        write: '$\pi(5.1)^{2} = 26.01\pi$'
      - say: 'The difference is $1.01\pi$. Divided by $25\pi$ and times 100, that''s 4.04%, which is 4% to the nearest whole number.'
        write: '$\dfrac{1.01\pi}{25\pi} \times 100 = 4.04\% \approx 4\%$'
      - say: 'So the percentage error in the area is 4, which is answer choice C.'
        write: '$4\%$'
        answer: true
    traps:
      A: 'You went for one twenty-fifth. That comes from the raw numbers, not the ratio. The relative error in the radius is 0.1 over 5, which is 0.02; double it and multiply by 100 to get 4%.'
      B: 'You went for one quarter. That doesn''t come from the error ratio. Find 0.1 divided by 5, which is 0.02, double it to 0.04, and as a percentage that is 4.'
      D: 'You went for 25. That''s the area $25\pi$ without the $\pi$, not an error. The percentage error is 2 times 0.1 over 5, times 100, which is 4.'
  3:
    moments:
      - say: 'We''re asked to evaluate log to base $b$ of $a$ to the $n$, where $b$ is $a$ to the power one over $n$.'
        write: '$\log_{b}a^{n},\quad b = a^{1/n}$'
      - say: 'Both the base and the number are powers of $a$. So the plan is to change the base of the logarithm to $a$.'
      - say: 'The change-of-base rule says log to base $b$ of $X$ equals log to base $a$ of $X$, divided by log to base $a$ of $b$.'
        write: '$\log_{b}X = \dfrac{\log_{a}X}{\log_{a}b}$'
      - say: 'So our logarithm becomes log base $a$ of $a$ to the $n$, over log base $a$ of $b$.'
        write: '$\log_{b}a^{n} = \dfrac{\log_{a}a^{n}}{\log_{a}b}$'
      - say: 'Now the top. Log base $a$ of $a$ to the $n$ is just $n$, because a power of the base logs down to its own index.'
        write: '$\log_{a}a^{n} = n$'
      - say: 'Now the bottom. $b$ is $a$ to the one over $n$, so log base $a$ of $b$ is one over $n$.'
        write: '$\log_{a}b = \log_{a}a^{1/n} = \dfrac{1}{n}$'
      - say: 'Put those back in. We have $n$ divided by one over $n$.'
        write: '$\log_{b}a^{n} = \dfrac{n}{1/n}$'
      - say: 'Dividing by a fraction means multiplying by its reciprocal. The reciprocal of one over $n$ is $n$.'
        write: '$= n \times n$'
      - say: '$n$ times $n$ is $n$ squared.'
        write: '$= n^{2}$'
      - say: 'Let''s check. Raise $b$ to the $n$ squared: that''s $a$ to the one over $n$, all to the $n$ squared, which is $a$ to the $n$. That''s exactly our number.'
        write: '$b^{n^{2}} = \left(a^{1/n}\right)^{n^{2}} = a^{n}\ \checkmark$'
      - say: 'So the value is $n$ squared, which is answer choice A.'
        write: '$\log_{b}a^{n} = n^{2}$'
        answer: true
    traps:
      B: 'You went for $n$. That''s only the top of the fraction, log base $a$ of $a$ to the $n$. You still have to divide by log base $a$ of $b$, which is one over $n$, and that gives $n$ squared.'
      C: 'You went for one over $n$. That''s log base $a$ of $b$, the bottom of the change-of-base fraction. Keep going: $n$ divided by one over $n$ is $n$ squared.'
      D: 'You went for one over $n$ squared. That''s the fraction turned upside down. It''s the top, $n$, divided by the bottom, one over $n$, which gives $n$ squared.'
  4:
    moments:
      - say: 'We want the value of $x$ that makes 4 to the $2x$, divided by 4 to the $3x$, equal to 2.'
        write: '$\dfrac{4^{2x}}{4^{3x}} = 2$'
      - say: 'The plan is to get both sides to the same base, so we can set the powers equal.'
      - say: 'First, the left side. Dividing powers of the same base means subtracting the indices: top index minus bottom index.'
        write: '$4^{2x - 3x} = 2$'
      - say: '$2x$ minus $3x$ is negative $x$.'
        write: '$4^{-x} = 2$'
      - say: 'Now, 2 is not a power of 4 as it stands. But 4 is 2 squared, so let''s write everything in base 2.'
        write: '$\left(2^{2}\right)^{-x} = 2$'
      - say: 'A power of a power means multiplying the indices. 2 times negative $x$ is negative $2x$.'
        write: '$2^{-2x} = 2$'
      - say: 'And the 2 on the right is 2 to the power 1.'
        write: '$2^{-2x} = 2^{1}$'
      - say: 'The bases are equal, so the powers must be equal.'
        write: '$-2x = 1$'
      - say: 'To get $x$ by itself, divide both sides by negative 2.'
        write: '$x = -\dfrac{1}{2}$'
      - say: 'Let''s check. With $x$ equal to negative a half, 4 to the $2x$ is 4 to the negative 1, which is a quarter.'
        write: '$4^{-1} = \tfrac{1}{4}$'
      - say: 'And 4 to the $3x$ is 4 to the negative three halves, which is one over 8. A quarter divided by an eighth is 2. It works.'
        write: '$\tfrac{1}{4} \div \tfrac{1}{8} = 2\ \checkmark$'
      - say: 'So $x$ is negative a half, which is answer choice B.'
        write: '$x = -\tfrac{1}{2}$'
        answer: true
    traps:
      A: 'You went for negative 2. You may have divided the wrong way round at the end. From negative $2x$ equals 1, $x$ is 1 divided by negative 2, which is negative a half.'
      C: 'You went for a half. The sign is wrong. Top index minus bottom index is $2x$ minus $3x$, which is negative $x$, so the answer comes out negative.'
      D: 'You went for 2. That''s the right-hand side of the equation, not $x$. Write both sides in base 2: negative $2x$ equals 1, so $x$ is negative a half.'
  5:
    moments:
      - say: 'We need to simplify this standard form fraction: 1.25 times 10 to the 4, times 2.0 times 10 to the negative 1, all over 6.25 times 10 to the 5.'
        write: '$\dfrac{(1.25 \times 10^{4}) \times (2.0 \times 10^{-1})}{6.25 \times 10^{5}}$'
      - say: 'The tidy way is to handle the decimal numbers and the powers of ten separately.'
      - say: 'Start with the top. Multiply the decimals: 1.25 times 2 is 2.5.'
        write: '$1.25 \times 2.0 = 2.5$'
      - say: 'Now the powers of ten on the top. When we multiply, we add the indices. 4 plus negative 1 is 3.'
        write: '$10^{4} \times 10^{-1} = 10^{3}$'
      - say: 'So the top is 2.5 times 10 cubed.'
        write: '$\dfrac{2.5 \times 10^{3}}{6.25 \times 10^{5}}$'
      - say: 'Now divide the decimals. 2.5 divided by 6.25 is 0.4. You can see it because 0.4 times 6.25 is 2.5.'
        write: '$2.5 \div 6.25 = 0.4$'
      - say: 'Then the powers of ten. When we divide, we subtract the indices. 3 minus 5 is negative 2.'
        write: '$10^{3} \div 10^{5} = 10^{-2}$'
      - say: 'Putting those together, we have 0.4 times 10 to the negative 2.'
        write: '$0.4 \times 10^{-2}$'
      - say: 'But that''s not standard form yet, because 0.4 is less than 1. We move the point one place right, so 0.4 becomes 4.0.'
      - say: 'Moving the point right makes the number bigger, so the power of ten must go down by one to balance it. Negative 2 minus 1 is negative 3.'
        write: '$0.4 \times 10^{-2} = 4.0 \times 10^{-3}$'
      - say: 'So the answer is 4.0 times 10 to the negative 3, which is answer choice A.'
        write: '$4.0 \times 10^{-3}$'
        answer: true
    traps:
      B: 'You went for 5.0 times 10 to the negative 2. The division 2.5 over 6.25 is 0.4, not 5. And when you rewrite 0.4 as 4.0, the power of ten must drop by one, giving 10 to the negative 3.'
      C: 'You went for 2.0 times 10 to the negative 1. That''s just the second number in the question. Multiply the top out to 2.5 times 10 cubed first, then divide by 6.25 times 10 to the 5.'
      D: 'You went for 5.0 times 10 cubed. The power of ten should come out negative: 10 cubed divided by 10 to the 5 is 10 to the negative 2. The final answer is 4.0 times 10 to the negative 3.'
  6:
    moments:
      - say: 'We need to simplify 5 root 18, minus 3 root 72, plus 4 root 50.'
        write: '$5\sqrt{18} - 3\sqrt{72} + 4\sqrt{50}$'
      - say: 'We can only add or subtract surds when they have the same number under the root. So the plan is to break each surd down into its simplest form.'
      - say: 'Start with root 18. 18 is 9 times 2, and 9 is a perfect square.'
        write: '$\sqrt{18} = \sqrt{9 \times 2}$'
      - say: 'The square root of 9 is 3, so root 18 is 3 root 2.'
        write: '$\sqrt{18} = 3\sqrt{2}$'
      - say: 'So 5 root 18 is 5 times 3 root 2. 5 times 3 is 15.'
        write: '$5\sqrt{18} = 15\sqrt{2}$'
      - say: 'Next, root 72. 72 is 36 times 2, and the square root of 36 is 6. So root 72 is 6 root 2.'
        write: '$\sqrt{72} = \sqrt{36 \times 2} = 6\sqrt{2}$'
      - say: 'So 3 root 72 is 3 times 6 root 2. 3 times 6 is 18.'
        write: '$3\sqrt{72} = 18\sqrt{2}$'
      - say: 'Now root 50. 50 is 25 times 2, and the square root of 25 is 5. So root 50 is 5 root 2.'
        write: '$\sqrt{50} = \sqrt{25 \times 2} = 5\sqrt{2}$'
      - say: 'So 4 root 50 is 4 times 5 root 2. 4 times 5 is 20.'
        write: '$4\sqrt{50} = 20\sqrt{2}$'
      - say: 'Now every term is a multiple of root 2, so we can put them back together like ordinary like terms.'
        write: '$15\sqrt{2} - 18\sqrt{2} + 20\sqrt{2}$'
      - say: 'Combine the numbers in front. 15 minus 18 is negative 3, and negative 3 plus 20 is 17.'
        write: '$= (15 - 18 + 20)\sqrt{2}$'
      - say: 'So the answer is 17 root 2, which is answer choice C.'
        write: '$= 17\sqrt{2}$'
        answer: true
    traps:
      A: 'You went for 17 root 4. The 17 is right, but the root should be root 2. Every surd broke down to a multiple of root 2, and root 4 is just 2 anyway.'
      B: 'You went for 4 root 17. That swaps the two numbers. The coefficients add up to 17, and the surd that is left over is root 2, giving 17 root 2.'
      D: 'You went for 12 root 4. Break each surd down using its biggest square factor: 15 root 2, minus 18 root 2, plus 20 root 2. That gives 17 root 2.'
  7:
    moments:
      - say: 'We''re told $x$ is 3 minus root 3, and we want $x$ squared plus 36 over $x$ squared.'
        write: '$x = 3 - \sqrt{3}$'
      - say: 'The plan: find $x$ squared first, then find 36 over $x$ squared, then add them.'
      - say: 'Let''s square $x$. Using the pattern for a bracket squared: first squared, minus twice the product, plus last squared.'
        write: '$x^{2} = 3^{2} - 2(3)(\sqrt{3}) + (\sqrt{3})^{2}$'
      - say: '3 squared is 9. 2 times 3 is 6, so the middle is 6 root 3. And root 3 squared is 3.'
        write: '$x^{2} = 9 - 6\sqrt{3} + 3$'
      - say: '9 plus 3 is 12.'
        write: '$x^{2} = 12 - 6\sqrt{3}$'
      - say: 'Now the second term: 36 over $x$ squared.'
        write: '$\dfrac{36}{x^{2}} = \dfrac{36}{12 - 6\sqrt{3}}$'
      - say: 'Let''s make the numbers smaller by dividing top and bottom by 6. 36 over 6 is 6, 12 over 6 is 2, and 6 root 3 over 6 is root 3.'
        write: '$= \dfrac{6}{2 - \sqrt{3}}$'
      - say: 'We have a surd in the denominator, so we rationalise. Multiply top and bottom by the conjugate, 2 plus root 3.'
        write: '$= \dfrac{6(2 + \sqrt{3})}{(2 - \sqrt{3})(2 + \sqrt{3})}$'
      - say: 'The bottom is a difference of two squares: 2 squared minus root 3 squared. That''s 4 minus 3, which is 1.'
        write: '$(2 - \sqrt{3})(2 + \sqrt{3}) = 4 - 3 = 1$'
      - say: 'So the bottom is just 1, and the top is 6 times 2 plus 6 times root 3.'
        write: '$\dfrac{36}{x^{2}} = 12 + 6\sqrt{3}$'
      - say: 'Now add the two parts together.'
        write: '$x^{2} + \dfrac{36}{x^{2}} = (12 - 6\sqrt{3}) + (12 + 6\sqrt{3})$'
      - say: 'Negative 6 root 3 and positive 6 root 3 cancel out. 12 plus 12 is 24.'
        write: '$= 24$'
      - say: 'So the answer is 24, which is answer choice C.'
        write: '$24$'
        answer: true
    traps:
      A: 'You went for 9. That''s only 3 squared, the first piece of $x$ squared. Square the whole of 3 minus root 3 to get 12 minus 6 root 3, then add 36 over it.'
      B: 'You went for 18. Each part is 12 plus or minus 6 root 3, and the surds cancel when you add them, leaving 12 plus 12, which is 24.'
      D: 'You went for 27. Check $x$ squared: 9 plus 3 is 12, minus 6 root 3. Then 36 over that is 12 plus 6 root 3, and the total is 24.'
  8:
    moments:
      - say: '$x$ is the set of prime factors of 44, and $y$ is the set of prime factors of 60. We want $x$ union $y$, and $x$ intersection $y$.'
      - say: 'A prime factor is a factor that is itself a prime number. So we break each number down completely into primes.'
      - say: 'Start with 44. 44 is 2 times 22, and 22 is 2 times 11.'
        write: '$44 = 2 \times 22 = 2 \times 2 \times 11$'
      - say: 'So the distinct primes in 44 are 2 and 11.'
        write: '$x = \{2, 11\}$'
      - say: 'Now 60. 60 is 2 times 30, 30 is 2 times 15, and 15 is 3 times 5.'
        write: '$60 = 2 \times 2 \times 3 \times 5$'
      - say: 'So the distinct primes in 60 are 2, 3 and 5.'
        write: '$y = \{2, 3, 5\}$'
      - say: 'Notice that 4 is a factor of both numbers, but 4 is not prime, so it never belongs in these sets.'
      - say: 'The union collects everything in either set, writing repeats only once. That''s 2, 3, 5 and 11.'
        write: '$x \cup y = \{2, 3, 5, 11\}$'
      - say: 'The intersection keeps only what''s in both sets. The only number in both lists is 2.'
        write: '$x \cap y = \{2\}$'
      - say: 'So the union is 2, 3, 5, 11, and the intersection is just 2, which is answer choice D.'
        write: '$\{2, 3, 5, 11\} \text{ and } \{2\}$'
        answer: true
    traps:
      A: 'You went for the option with 4 in it. 4 is a factor of 44 and of 60, but it isn''t prime, since 4 is 2 times 2. The prime factors are 2 and 11 for 44, and 2, 3, 5 for 60.'
      B: 'You went for the option with 4 and no 2. 4 is not a prime, and 2 is the prime that divides both numbers. So the intersection is just 2.'
      C: 'You went for 2, 5, 11 and 2. The intersection is right, but the union is missing 3. 60 is 2 times 2 times 3 times 5, so 3 belongs in the union.'
  9:
    moments:
      - say: 'We have a universal set $U$, a set $E$, and a set $F$ of odd numbers whose square is 2 to the 6. We want the complement of $E$ intersection $F$.'
        write: '$F = \{x : x^{2} = 2^{6},\ x \text{ odd}\}$'
      - say: 'The plan is to find out what''s actually in $F$ by testing its conditions one at a time.'
      - say: 'First, 2 to the 6. That''s 2 times itself six times: 2, 4, 8, 16, 32, 64.'
        write: '$2^{6} = 64$'
      - say: 'So we need $x$ squared equals 64.'
        write: '$x^{2} = 64$'
      - say: 'The numbers whose square is 64 are 8 and negative 8.'
        write: '$x = 8 \text{ or } x = -8$'
      - say: 'Now the second condition: $x$ must be odd. But 8 and negative 8 are both even, so neither one is allowed.'
      - say: 'So $F$ has no elements at all. It is the empty set.'
        write: '$F = \varnothing$'
      - say: 'Now $E$ intersection $F$. Nothing can be in both sets when $F$ is empty, so the intersection is empty too.'
        write: '$E \cap F = \varnothing$'
      - say: 'Finally, the complement. The dash means everything in the universal set that is not in $E$ intersection $F$. Since that set is empty, nothing is left out.'
        write: '$(E \cap F)^{\prime} = \varnothing^{\prime}$'
      - say: 'So the complement is the whole universal set, $U$, which is answer choice B.'
        write: '$(E \cap F)^{\prime} = U$'
        answer: true
    traps:
      A: 'You went for the set containing 0. 0 is in $E$, but $F$ is empty, so $E$ intersection $F$ is empty and its complement is all of $U$.'
      C: 'You went for $E$. That''s just one of the two sets. We need $E$ intersection $F$ first, which is empty because $F$ is empty, and the complement of the empty set is the universal set $U$.'
      D: 'You went for the empty set. That''s $E$ intersection $F$ itself. Don''t forget the dash: the complement of the empty set is the whole universal set $U$.'
  10:
    moments:
      - say: 'We need to make $t$ the subject of $s$ equals $ut$ plus a half $a t$ squared.'
        write: '$s = ut + \tfrac{1}{2}at^{2}$'
      - say: '$t$ appears squared and also on its own, so this is a quadratic in $t$. We''ll need the quadratic formula.'
      - say: 'First, clear the fraction. Multiply every term by 2.'
        write: '$2s = 2ut + at^{2}$'
      - say: 'Now bring everything to one side, highest power of $t$ first. Subtract $2s$ from both sides.'
        write: '$at^{2} + 2ut - 2s = 0$'
      - say: 'Compare with the standard quadratic. The coefficient of $t$ squared is $a$, the coefficient of $t$ is $2u$, and the constant is negative $2s$.'
        write: '$A = a,\quad B = 2u,\quad C = -2s$'
      - say: 'The quadratic formula says $t$ is negative $B$, plus or minus root of $B$ squared minus $4AC$, all over $2A$.'
        write: '$t = \dfrac{-B \pm \sqrt{B^{2} - 4AC}}{2A}$'
      - say: 'Let''s work out the part under the root. $2u$ squared is $4u$ squared.'
        write: '$B^{2} - 4AC = (2u)^{2} - 4(a)(-2s)$'
      - say: 'Now watch the signs. 4 times $a$ times negative $2s$ is negative $8as$, and minus a negative is plus. So we get $4u$ squared plus $8as$.'
        write: '$= 4u^{2} + 8as$'
      - say: 'Take 4 out as a common factor inside the root.'
        write: '$\sqrt{4u^{2} + 8as} = \sqrt{4(u^{2} + 2as)}$'
      - say: 'The square root of 4 is 2, so it comes out as 2 times root of $u$ squared plus $2as$.'
        write: '$= 2\sqrt{u^{2} + 2as}$'
      - say: 'Now put everything into the formula. Negative $B$ is negative $2u$, and $2A$ is $2a$.'
        write: '$t = \dfrac{-2u \pm 2\sqrt{u^{2} + 2as}}{2a}$'
      - say: 'Every term has a 2, so cancel the 2 from the top and the bottom.'
        write: '$t = \dfrac{-u \pm \sqrt{u^{2} + 2as}}{a}$'
      - say: 'Written the way the options have it, that''s one over $a$ times the bracket, which is answer choice D.'
        write: '$t = \tfrac{1}{a}\left[-u \pm \sqrt{u^{2} + 2as}\right]$'
        answer: true
    traps:
      A: 'You went for option A. Two signs are off. The formula starts with negative $B$, so it''s negative $u$; and because $C$ is negative $2s$, the root holds $u$ squared plus $2as$.'
      B: 'You went for option B. The negative $u$ is right, but the sign under the root isn''t. 4 times $a$ times negative $2s$ is negative $8as$, and subtracting that makes it plus.'
      C: 'You went for option C. The root is right, but the formula begins with negative $B$, and $B$ is $2u$. So the front should be negative $u$, not $u$.'
  11:
    moments:
      - say: 'We need to factorise $9p$ squared minus $q$ squared plus $6qr$ minus $9r$ squared.'
        write: '$9p^{2} - q^{2} + 6qr - 9r^{2}$'
      - say: 'Four terms, no common factor. But notice the last three terms only involve $q$ and $r$. That''s a hint to group them.'
      - say: 'Let''s put the last three in a bracket with a minus sign in front. Taking out a minus flips every sign inside, so plus $6qr$ becomes minus $6qr$.'
        write: '$= 9p^{2} - \left(q^{2} - 6qr + 9r^{2}\right)$'
      - say: 'Let''s check the bracket by opening it again: minus $q$ squared, plus $6qr$, minus $9r$ squared. Yes, that''s what we started with.'
      - say: 'Now, the bracket is a perfect square. $q$ minus $3r$, squared, gives $q$ squared, minus 2 times $q$ times $3r$, plus $3r$ squared.'
        write: '$(q - 3r)^{2} = q^{2} - 6qr + 9r^{2}$'
      - say: 'So we can replace the bracket with $q$ minus $3r$, all squared.'
        write: '$= 9p^{2} - (q - 3r)^{2}$'
      - say: 'And $9p$ squared is $3p$, all squared, because 3 squared is 9.'
        write: '$= (3p)^{2} - (q - 3r)^{2}$'
      - say: 'Now this is a difference of two squares. $A$ squared minus $B$ squared factorises as $A$ minus $B$, times $A$ plus $B$.'
        write: '$A^{2} - B^{2} = (A - B)(A + B)$'
      - say: 'Here $A$ is $3p$ and $B$ is $q$ minus $3r$.'
        write: '$= \left[3p - (q - 3r)\right]\left[3p + (q - 3r)\right]$'
      - say: 'In the first bracket, the minus sign flips both signs: minus $q$, plus $3r$.'
