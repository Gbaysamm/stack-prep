          - {figure: sketch, kind: circle, target: 'E', text: 'nothing shared with F'}
      - say: 'Finally, the dash. The complement means everything in the universal set that is not in the set. So we want the complement of the empty set.'
        write: '$(E \cap F)^{\prime} = \varnothing^{\prime}$'
      - say: 'Nothing is in the empty set, so nothing gets left out. The complement is every single element of $U$.'
        write: '$= \{0, 2, 3, 6, 7, 8, 9, 10\} = U$'
        point:
          - {figure: sketch, kind: circle, target: 'U', text: 'all of U'}
      - say: 'So the complement of $E$ intersection $F$ is the whole universal set $U$, which is answer choice B.'
        write: 'Answer: $(E \cap F)^{\prime} = U$'
