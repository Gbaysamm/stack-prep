          - {figure: sketch, kind: circle, target: '(p + 20)°'}
          - {figure: sketch, kind: circle, target: '4p°'}
      - say: 'Collect like terms. $p$ plus $p$ plus $4p$ is $6p$. 10 plus 20 plus 90 is 120.'
        write: '$6p + 120 = 360$'
      - say: 'Take 120 to the other side. 360 minus 120 is 240.'
        write: '$6p = 360 - 120 = 240$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '+ 120'}, at: '− 120', text: 'across the ='}
      - say: 'Divide both sides by 6. 240 divided by 6 is 40.'
        write: '$p = \dfrac{240}{6} = 40$'
      - section: 'Check'
