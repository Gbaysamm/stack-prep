          - {figure: 0, kind: arc, target: SQR, text: 'equal'}
      - say: 'The right angles at $S$ match, and so do the equal angles at $P$ and $Q$. So the triangles are similar, because they are equiangular. $P$ matches $Q$, $S$ matches $S$, and $Q$ matches $R$.'
        write: '$\triangle PSQ \;|||\; \triangle QSR$ (equiangular)'
      - say: 'Similar triangles have their matching sides in the same ratio. Write all three ratios, in the order of the corners.'
        write: '$\dfrac{PS}{QS} = \dfrac{SQ}{SR} = \dfrac{PQ}{QR}$'
        point:
