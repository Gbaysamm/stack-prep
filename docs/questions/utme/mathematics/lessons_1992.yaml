          - {line: 4, kind: move, from: {line: 3, at: '= [[cosx]]'}, at: 'cosx', text: 'dv/dx'}
          - {line: 4, kind: move, from: {line: 3, at: '= [[1]]'}, at: '× 1', text: 'du/dx'}
      - say: 'Sine $x$ times 1 is just sine $x$. So the first derivative is sine $x$ plus $x$ cos $x$.'
        write: '$= \sin x + x\cos x$'
      - say: 'Now differentiate this again, one term at a time. The derivative of sine $x$ is cos $x$.'
        write: 'First term: $\dfrac{d}{dx}(\sin x) = \cos x$'
      - say: '$x$ cos $x$ is another product. Now $u$ is $x$ and $v$ is cos $x$. The derivative of cos $x$ is negative sine $x$, so we get $x$ times negative sine $x$, plus cos $x$ times 1.'
        write: 'Second term: $\dfrac{d}{dx}(x\cos x) = x(-\sin x) + \cos x \times 1$'
