      C: 'You went for negative 24. Transposing never changes the sign of a determinant; swapping two rows does that. The determinant of $P$ transpose is positive 24.'
      D: 'You went for negative 48. Transposing leaves the determinant exactly the same. The diagonal gives 2 times 3 times 4, which is positive 24.'
  23:
