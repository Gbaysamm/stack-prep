          - {line: 3, kind: move, from: {line: 0, at: '6.3'}, at: '6.3', text: 'YZ'}
          - {line: 3, kind: move, from: {line: 0, at: '[[12]] km'}, at: '[[12]]6.3', text: 'ZX'}
      - say: '6.3 divided by 12 is 0.525.'
        write: '$= 0.525$'
      - say: 'The angle whose sine is 0.525 is about 31.7 degrees. That is close to 30 degrees, whose sine is exactly 0.5, so we work with about 30 degrees.'
        write: '$\angle YXZ \approx 31.7^{\circ} \approx 30^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: YXZ, text: '≈ 30°'}
      - say: 'Now the direction. Standing at $X$, the point $Y$ is due west, because $X$ is east of $Y$. Due west is a bearing of 270 degrees.'
        write: 'Bearing of $Y$ from $X = 270^{\circ}$ (due west)'
        point:
          - {figure: 'sketch', kind: 'highlight', target: 'XY', text: 'due west, 270°'}
      - say: '$Z$ is south of $Y$, so from $X$ it lies below that westward line, towards the south. Turning from west towards south is anticlockwise, so the bearing gets smaller by our angle.'
        write: 'From west, turn towards south by $\angle YXZ$'
        point:
          - {figure: 'sketch', kind: 'arc', target: 'YXZ', text: 'turn towards south'}
      - say: 'So the bearing is 270 minus 30, which is 240 degrees.'
        write: 'Bearing of $Z$ from $X = 270^{\circ} - 30^{\circ} = 240^{\circ}$'
        point:
          - {line: 8, kind: move, from: {line: 6, at: '270∘'}, at: '270∘', text: 'due west'}
          - {line: 8, kind: move, from: {line: 5, at: '≈ [[30∘]]'}, at: '30∘', text: 'the angle'}
          - {figure: sketch, kind: label, target: '?', text: '240°'}
      - say: 'Check: $Z$ is south and west of $X$, so its bearing must be between 180 and 270 degrees. 240 is.'
        write: 'Check: $180^{\circ} < 240^{\circ} < 270^{\circ}\ \checkmark$'
        point:
          - {figure: 'sketch', kind: 'circle', target: 'Z', text: 'south-west of X'}
      - say: 'So the bearing of $Z$ from $X$ is 240 degrees, which is answer choice A.'
        write: 'Bearing $= 240^{\circ}$'
        answer: true
        point:
          - {figure: 'sketch', kind: 'circle', target: '?', text: '240°'}
    traps:
      B: 'You went for 210 degrees. That''s 180 plus 30, measuring the angle from due south. But the angle at $X$ is measured from the westward line $XY$, so start at 270 and turn back by about 30, giving 240.'
      C: 'You went for 150 degrees. That would put $Z$ south and east of $X$, but $Z$ is to the west of $X$. The bearing must lie between 180 and 270.'
      D: 'You went for 60 degrees. That''s the bearing of $X$ from $Z$, the reverse direction. Reverse bearings differ by 180, so from $X$ it''s 240.'
  30:
    moments:
      - say: 'The diagram is a circle with centre $O$ and two perpendicular radii of 6 centimetres. We want the area of the shaded part, between the chord and the arc.'
        write: '$r = 6\text{ cm}$'
        point:
          - {figure: 0, kind: 'circle', target: 'O', text: 'centre'}
          - {figure: 0, kind: 'circle', target: {x: 180, y: 70}, text: 'shaded'}
      - say: 'That shaded piece, between a chord and its arc, is called a segment. Its area is the sector, the slice of the circle, minus the triangle inside the slice.'
        write: 'Segment $=$ sector $-$ triangle'
        point:
          - {figure: 0, kind: 'circle', target: {x: 180, y: 70}, text: 'segment'}
      - say: 'The two radii are at right angles, so the sector''s angle is 90 degrees. 90 over 360 is a quarter, so the sector is a quarter of the circle.'
        write: 'Sector angle $= 90^{\circ}$, so sector $= \dfrac{90}{360} = \dfrac{1}{4}$ of the circle'
        point:
          - {figure: 0, kind: label, target: O, text: '90°'}
      - say: 'The whole circle has area pi $r$ squared. The radius is 6, and 6 squared is 36, so that is 36 pi.'
        write: 'Circle $= \pi r^{2} = \pi(6)^{2} = 36\pi$'
        point:
          - {figure: 0, kind: 'circle', target: {x: 88, y: 80}, text: 'r = 6'}
      - say: 'A quarter of 36 pi is 9 pi.'
        write: 'Sector $= \dfrac{1}{4} \times 36\pi = 9\pi$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '36π'}, at: '36π'}
      - say: 'Now the triangle. It has a right angle at the centre, and both short sides are radii of 6. So its area is a half, times base 6, times height 6.'
        write: 'Triangle $= \dfrac{1}{2} \times \text{base} \times \text{height} = \dfrac{1}{2} \times 6 \times 6$'
        point:
          - {figure: 0, kind: 'circle', target: {x: 127, y: 118}, text: 'right angle'}
      - say: '6 times 6 is 36, and half of 36 is 18.'
        write: '$= \dfrac{1}{2} \times 36 = 18$'
      - say: 'Now go back to segment equals sector minus triangle. The sector is 9 pi and the triangle is 18.'
        write: 'Segment $= 9\pi - 18$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '= [[9π]]'}, at: '9π', text: 'sector'}
          - {line: 7, kind: move, from: {line: 6, at: '= [[18]]'}, at: '18', text: 'triangle'}
          - {figure: 0, kind: 'circle', target: {x: 180, y: 70}, text: '9π − 18'}
      - say: '9 goes into both terms, since 18 is 9 times 2. So take out the 9 as a common factor.'
        write: '$= 9\pi - 9 \times 2 = 9(\pi - 2)$'
      - say: 'As a check, 9 pi is about 28.3, and 28.3 minus 18 is about 10.3. That is sensibly smaller than the quarter circle it sits inside.'
        write: 'Check: $9\pi - 18 \approx 28.3 - 18 = 10.3$'
      - say: 'So the shaded area is 9 times pi minus 2, square centimetres, which is answer choice B.'
        write: 'Shaded area $= 9(\pi - 2)\ \text{cm}^{2}$'
        answer: true
        point:
          - {figure: 0, kind: 'label', target: {x: 180, y: 70}, text: '9(π − 2) cm²'}
    traps:
      A: 'You went for 9 pi. That''s the whole quarter sector, with the triangle still in it. The shaded part is bounded by the chord, so subtract the triangle of 18.'
      C: 'You went for 18 pi. That''s half the circle. The two radii make a quarter, which is 9 pi, and then you subtract the triangle of 18.'
      D: 'You went for 36 pi. That''s the area of the whole circle. The shaded segment is a quarter of it, 9 pi, minus the triangle of 18.'
  31:
    moments:
      - say: 'We want the locus of a point that is the same distance from two fixed points. A locus is simply the path traced by all the points that obey a rule.'
        write: 'Locus: all points the same distance from two fixed points'
      - say: 'Let me draw a diagram of the circle first, so we can see what we are working with.'
        show_sketch: true
      - say: 'Let''s call the fixed points $A$ and $B$. The rule is that a point $X$ is as far from $A$ as it is from $B$.'
        write: 'Rule: $XA = XB$'
        point:
          - {figure: sketch, kind: highlight, target: XA}
          - {figure: sketch, kind: highlight, target: XB}
      - say: 'One point obviously works: the midpoint $M$ of $AB$. It is the same distance from each end.'
        write: 'Midpoint $M$: $MA = MB$'
        point:
          - {figure: sketch, kind: circle, target: M, text: 'midpoint'}
      - say: 'Now take any other point $X$ that obeys the rule, and join it to $M$. Look at the two triangles this makes, $XMA$ and $XMB$.'
        write: 'Compare $\triangle XMA$ and $\triangle XMB$'
        point:
          - {figure: 'sketch', kind: 'highlight', target: 'XM', text: 'join to M'}
      - say: '$XA$ equals $XB$ by the rule. $MA$ equals $MB$, since $M$ is the midpoint. And the side $XM$ is shared by both.'
        write: '$XA = XB,\quad MA = MB,\quad XM = XM$'
        point:
          - {figure: sketch, kind: underline, target: MA}
          - {figure: sketch, kind: underline, target: MB}
          - {figure: sketch, kind: highlight, target: XM, text: 'shared'}
      - say: 'Three pairs of equal sides, so the two triangles are congruent: exactly the same shape and size.'
        write: '$\triangle XMA \equiv \triangle XMB$'
      - say: 'So the angles at $M$ are equal. And those two angles sit side by side on the straight line $AB$, so together they make 180 degrees.'
        write: '$\angle XMA = \angle XMB,\quad \angle XMA + \angle XMB = 180^{\circ}$'
        point:
          - {figure: 'sketch', kind: 'arc', target: 'XMA'}
          - {figure: 'sketch', kind: 'arc', target: 'XMB'}
          - {figure: 'sketch', kind: 'highlight', target: 'AB', text: 'straight line'}
      - say: 'Two equal angles adding to 180 means each one is 180 divided by 2, which is 90 degrees.'
        write: '$\angle XMA = \angle XMB = \dfrac{180^{\circ}}{2} = 90^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: XMA, text: '90°'}
      - say: 'So every such point lies on the line through the midpoint of $AB$, at right angles to $AB$. That line cuts $AB$ in half at right angles; it is called the perpendicular bisector.'
        write: 'Line through $M$ at $90^{\circ}$ to $AB$ $=$ perpendicular bisector'
        point:
          - {figure: sketch, kind: circle, target: locus, text: 'perpendicular bisector'}
      - say: 'And it works the other way too: any point on that line makes two congruent triangles, so it is equally far from $A$ and $B$.'
        write: 'Any point on it: $XA = XB$'
        point:
          - {figure: 'sketch', kind: 'circle', target: 'locus', text: 'XA = XB'}
      - say: 'So the locus is the perpendicular bisector of the line joining the two points, which is answer choice A.'
        write: 'Locus $=$ perpendicular bisector of $AB$'
        answer: true
        point:
          - {figure: 'sketch', kind: 'circle', target: 'locus', text: 'perpendicular bisector'}
    traps:
      B: 'You went for a parallel line. A point on a line parallel to $AB$ is usually much nearer one end than the other. Equal distances from two points puts you on the perpendicular bisector.'
      C: 'You went for a transverse line. Just crossing the line $AB$ isn''t enough; it must cross at the midpoint and at right angles. That''s the perpendicular bisector.'
      D: 'You went for an angle bisector with the horizontal. The locus has nothing to do with the horizontal. It depends only on the two points: it''s the perpendicular bisector of the line joining them.'
  32:
    moments:
      - say: 'We want the perpendicular distance from the point 2, 3 to the line $2x$ minus $4y$ plus 3 equals zero.'
        write: '$(2,\ 3),\quad 2x - 4y + 3 = 0$'
      - say: 'Let me sketch the graph, so we can see its shape.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'P', text: '(2, 3)'}
          - {figure: sketch, kind: underline, target: '2x − 4y + 3 = 0'}
          - {figure: sketch, kind: circle, target: 'd = ?', text: 'distance'}
      - say: 'There''s a formula for exactly this. For a point $x_1$, $y_1$ and a line $Ax$ plus $By$ plus $C$ equals zero, the distance is the modulus of $Ax_1$ plus $By_1$ plus $C$, over root of $A$ squared plus $B$ squared.'
        write: 'Distance formula: $d = \dfrac{\left|Ax_{1} + By_{1} + C\right|}{\sqrt{A^{2} + B^{2}}}$'
      - say: 'Read off the values. From the line, $A$ is 2, $B$ is negative 4 and $C$ is 3. From the point, $x_1$ is 2 and $y_1$ is 3.'
        write: '$A = 2,\ B = -4,\ C = 3,\ x_{1} = 2,\ y_{1} = 3$'
      - say: 'Start with the top: put the point into the left side of the line''s equation.'
        write: 'Top: $Ax_{1} + By_{1} + C = 2(2) + (-4)(3) + 3$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
      - say: '2 times 2 is 4, and negative 4 times 3 is negative 12. So it is 4 minus 12 plus 3. 4 minus 12 is negative 8, and negative 8 plus 3 is negative 5.'
        write: '$= 4 - 12 + 3 = -5$'
      - say: 'The modulus bars make it positive, because a distance can''t be negative. So the top is 5.'
        write: 'Modulus: $|-5| = 5$'
      - say: 'Now the bottom: the root of $A$ squared plus $B$ squared, with $A$ as 2 and $B$ as negative 4.'
        write: 'Bottom: $\sqrt{A^{2} + B^{2}} = \sqrt{2^{2} + (-4)^{2}}$'
      - say: '2 squared is 4, and negative 4 squared is 16. 4 plus 16 is 20.'
        write: '$= \sqrt{4 + 16} = \sqrt{20}$'
      - say: '20 is 4 times 5, and root 4 is 2, so root 20 is 2 root 5.'
        write: '$= \sqrt{4 \times 5} = 2\sqrt{5}$'
      - say: 'Now put the top, 5, over the bottom, 2 root 5.'
        write: '$d = \dfrac{5}{2\sqrt{5}}$'
        point:
          - {line: 10, kind: move, from: {line: 6, at: '= [[5]]'}, at: '25[[5]]', text: 'top'}
          - {line: 10, kind: move, from: {line: 9, at: '= [[25]]'}, at: '[[25]]5', text: 'bottom'}
          - {figure: sketch, kind: highlight, target: 'PN', text: 'd'}
      - say: 'Rationalise: multiply top and bottom by root 5. Root 5 times root 5 is 5.'
        write: '$= \dfrac{5 \times \sqrt{5}}{2\sqrt{5} \times \sqrt{5}} = \dfrac{5\sqrt{5}}{2 \times 5}$'
      - say: '2 times 5 is 10. And 5 over 10 is a half, so we get root 5 over 2.'
        write: '$= \dfrac{5\sqrt{5}}{10} = \dfrac{\sqrt{5}}{2}$'
      - say: 'So the distance is root 5 over 2, which is answer choice A.'
        write: '$d = \dfrac{\sqrt{5}}{2}$'
        answer: true
        point:
          - {figure: sketch, kind: circle, target: 'd = ?', text: '√5/2'}
    traps:
      B: 'You went for negative root 5 over 20. A distance can never be negative, and the modulus removes the sign. The top is 5, the bottom is 2 root 5, which gives root 5 over 2.'
      C: 'You went for negative 5 over root 13. The root 13 comes from 2 squared plus 3 squared, using the point instead of the line. The bottom uses the line''s coefficients: root of 4 plus 16.'
      D: 'You went for 0. That would mean the point is on the line, but 2 times 2 minus 4 times 3 plus 3 is negative 5, not zero. The distance is root 5 over 2.'
  33:
    moments:
      - say: 'We want the equation of the line through 5, 7 that is parallel to $7x$ plus $5y$ equals 12.'
        write: '$(5,\ 7),\quad 7x + 5y = 12$'
      - say: 'Let me sketch the graph, so we can see its shape.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '7x + 5y = 12', text: 'given line'}
          - {figure: sketch, kind: circle, target: 'P', text: '(5, 7)'}
      - say: 'Parallel lines have the same gradient, the same steepness. So let''s find the gradient of the given line by making $y$ the subject.'
        write: 'Parallel lines: same gradient'
      - say: 'Start from $7x$ plus $5y$ equals 12, and subtract $7x$ from both sides.'
        write: 'From $7x + 5y = 12$: $5y = -7x + 12$'
        point:
          - {line: 3, kind: move, from: {line: 3, at: '[[7x]] + 5y'}, at: '−7x', text: 'across the ='}
      - say: 'Divide every term by 5.'
        write: '$y = -\dfrac{7}{5}x + \dfrac{12}{5}$'
      - say: 'The number in front of $x$ is the gradient: negative 7 over 5. Notice it depends only on the 7 and the 5, not on the 12.'
        write: 'Gradient $m = -\dfrac{7}{5}$'
      - say: 'So a parallel line keeps $7x$ plus $5y$ exactly as it is; only the constant on the right changes. Let''s call the new constant $k$.'
        write: 'Parallel line: $7x + 5y = k$'
        point:
          - {figure: sketch, kind: circle, target: 'parallel line = ?', text: '7x + 5y = k'}
      - say: 'Our line must pass through the point 5, 7, so put $x$ as 5 and $y$ as 7.'
        write: '$7(5) + 5(7) = k$'
        point:
          - {line: 7, kind: move, from: {line: 0, at: '([[5]], 7)'}, at: '7([[5]])', text: 'x = 5'}
          - {line: 7, kind: move, from: {line: 0, at: '(5, [[7]])'}, at: '5([[7]])', text: 'y = 7'}
      - say: '7 times 5 is 35, and 5 times 7 is 35.'
        write: '$35 + 35 = k$'
      - say: '35 plus 35 is 70, so $k$ is 70.'
        write: '$k = 70$'
      - say: 'So the line is $7x$ plus $5y$ equals 70. Check: it keeps the 7 and the 5, so it is parallel, and the point 5, 7 gives 35 plus 35, which is 70.'
        write: 'Check: $7(5) + 5(7) = 70\ \checkmark$'
      - say: 'The equation is $7x$ plus $5y$ equals 70, which is answer choice B.'
        write: '$7x + 5y = 70$'
        answer: true
        point:
          - {figure: sketch, kind: circle, target: 'parallel line = ?', text: '7x + 5y = 70'}
    traps:
      A: 'You went for $5x$ plus $7y$ equals 120. That swaps the coefficients, which changes the gradient to negative 5 over 7. A parallel line keeps $7x$ plus $5y$, and only the constant changes.'
      C: 'You went for $x$ plus $y$ equals 7. That has gradient negative 1, not negative 7 over 5, and 5 plus 7 is 12, so it doesn''t even pass through 5, 7.'
      D: 'You went for $15x$ plus $17y$ equals 90. That has the wrong gradient, and 15 times 5 plus 17 times 7 is 194, not 90. Keep $7x$ plus $5y$ and find the new constant: 70.'
  34:
    moments:
      - say: '$\theta$ is an acute angle and sine $\theta$ is $m$ over $n$. We want cot $\theta$.'
        write: '$\sin\theta = \dfrac{m}{n}$'
      - say: 'The quickest way is to draw a right-angled triangle in which this is true, then read cot straight off it.'
        write: 'Draw a right-angled triangle with angle $\theta$'
        show_sketch: true
        point:
          - {figure: sketch, kind: arc, target: CAB, text: 'θ'}
      - say: 'Sine is opposite over hypotenuse, and we are told it is $m$ over $n$.'
        write: '$\sin\theta = \dfrac{\text{opposite}}{\text{hypotenuse}} = \dfrac{m}{n}$'
      - say: 'So we can take the opposite side as $m$, and the hypotenuse as $n$.'
        write: 'So opposite $= m$, hypotenuse $= n$'
        point:
          - {figure: sketch, kind: circle, target: m, text: 'opposite'}
          - {figure: sketch, kind: circle, target: n, text: 'hypotenuse'}
      - say: 'Pythagoras: the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hypotenuse}^{2} = \text{opposite}^{2} + \text{adjacent}^{2}$'
      - say: 'The third side, the adjacent, comes from Pythagoras. Adjacent squared plus $m$ squared equals $n$ squared.'
        write: 'Pythagoras: $\text{adjacent}^{2} + m^{2} = n^{2}$'
        point:
          - {figure: sketch, kind: highlight, target: AB, text: 'adjacent'}
      - say: 'Subtract $m$ squared from both sides.'
        write: '$\text{adjacent}^{2} = n^{2} - m^{2}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '+ m2'}, at: '− m2', text: 'across the ='}
      - say: 'Take the square root of both sides.'
        write: '$\text{adjacent} = \sqrt{n^{2} - m^{2}}$'
        point:
          - {figure: sketch, kind: circle, target: '√(n² − m²)'}
      - say: 'Now, cot is 1 over tan. Tan is opposite over adjacent, so cot is the other way up: adjacent over opposite.'
        write: '$\cot\theta = \dfrac{1}{\tan\theta} = \dfrac{\text{adjacent}}{\text{opposite}}$'
      - say: 'Put in the adjacent side we just found, root of $n$ squared minus $m$ squared, and the opposite side, $m$.'
        write: '$\cot\theta = \dfrac{\sqrt{n^{2} - m^{2}}}{m}$'
        point:
          - {line: 9, kind: move, from: {line: 7, at: 'n2 − m2'}, at: 'n2 − m2', text: 'adjacent'}
          - {line: 9, kind: move, from: {line: 3, at: '= [[m]]'}, at: '[[m]]n2', text: 'opposite'}
          - {figure: 'sketch', kind: 'circle', target: '√(n² − m²)', text: 'adjacent'}
      - say: 'Let''s test with 30 degrees. Sine 30 is a half, so $m$ is 1 and $n$ is 2.'
        write: 'Test: $\sin 30^{\circ} = \dfrac{1}{2}$, so $m = 1,\ n = 2$'
      - say: 'Our answer gives the root of 2 squared minus 1 squared, over 1. That is root of 4 minus 1, which is root 3. And cot 30 is indeed root 3.'
        write: '$\dfrac{\sqrt{2^{2} - 1^{2}}}{1} = \sqrt{4 - 1} = \sqrt{3} = \cot 30^{\circ}\ \checkmark$'
      - say: 'So cot $\theta$ is root of $n$ squared minus $m$ squared, over $m$, which is answer choice A.'
        write: '$\cot\theta = \dfrac{\sqrt{n^{2} - m^{2}}}{m}$'
        answer: true
    traps:
      B: 'You went for option B. It puts the whole fraction under the root, so the $m$ ends up square-rooted too. Test with $m$ equals 3, $n$ equals 5: cot is 4 over 3, but B gives root of 16 over 3, about 2.31.'
      C: 'You went for option C. That''s opposite over adjacent, which is tan $\theta$. Cot is the other way up: adjacent over opposite.'
      D: 'You went for option D. Test it at 30 degrees, with $m$ as 1 and $n$ as 2: it gives the root of 2 over 3, about 0.82, but cot 30 is root 3. Cot is adjacent over opposite.'
  35:
    moments:
      - say: 'In the figure, $XZ$ is 10 centimetres. $R$ and $Y$ are on the vertical line through $Z$. We want $RY$.'
        write: '$XZ = 10\text{ cm}$'
        point:
          - {figure: 0, kind: highlight, target: XZ}
      - say: 'From $X$, the line to $R$ makes 30 degrees with $XZ$. The extra 15 degrees takes it up to $Y$, so the line to $Y$ makes 30 plus 15, which is 45 degrees.'
        write: 'Angle to $Y$: $\angle ZXY = 30^{\circ} + 15^{\circ} = 45^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: ZXY, text: '45°'}
      - say: 'So we have two right-angled triangles on the same base $XZ$, with the right angle at $Z$. $R$ is below $Y$ on the same vertical line, so $RY$ is the gap between their heights.'
        write: '$RY = ZY - ZR$'
        point:
          - {figure: 0, kind: highlight, target: RY, text: 'RY'}
      - say: 'Tan is the opposite side over the adjacent side.'
        write: 'SOH CAH TOA: $\tan\theta = \dfrac{\text{opposite}}{\text{adjacent}}$'
      - say: 'Start with the smaller triangle, $XZR$. $ZR$ is opposite the 30 degrees, and $XZ$ is next to it, the adjacent side. Opposite over adjacent is tan.'
        write: 'Triangle $XZR$: $\tan 30^{\circ} = \dfrac{ZR}{XZ} = \dfrac{ZR}{10}$'
        point:
          - {figure: 0, kind: arc, target: ZXR, text: '30°'}
          - {figure: 0, kind: underline, target: ZR, text: 'opposite'}
      - say: 'Multiply both sides by 10.'
        write: '$ZR = 10\tan 30^{\circ}$'
      - say: 'Tan 30 is 1 over root 3, so $ZR$ is 10 times 1 over root 3, which is 10 over root 3.'
        write: '$= 10 \times \dfrac{1}{\sqrt{3}} = \dfrac{10}{\sqrt{3}}$'
      - say: 'Now the bigger triangle, $XZY$, with the 45 degrees. Again, opposite over adjacent.'
        write: 'Triangle $XZY$: $\tan 45^{\circ} = \dfrac{ZY}{10}$'
        point:
          - {figure: 0, kind: underline, target: ZY, text: 'opposite'}
      - say: 'Multiply by 10. Tan 45 is 1, so $ZY$ is 10 times 1, which is 10.'
        write: '$ZY = 10\tan 45^{\circ} = 10 \times 1 = 10$'
      - say: 'Now go back to $RY$ equals $ZY$ minus $ZR$, and put in the 10 and the 10 over root 3 we just found.'
        write: '$RY = 10 - \dfrac{10}{\sqrt{3}}$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '1 = [[10]]'}, at: 'RY = [[10]]', text: 'ZY'}
          - {line: 9, kind: move, from: {line: 6, at: '= [[310]]'}, at: '− [[310]]', text: 'ZR'}
      - say: 'Both terms have a 10, so take out 10 as a common factor.'
        write: '$= 10\left(1 - \dfrac{1}{\sqrt{3}}\right)$'
      - say: 'Check: 1 over root 3 is about 0.577, so this is 10 times 0.423, about 4.23 centimetres. That is positive and less than 10, as it should be.'
        write: 'Check: $10(1 - 0.577) = 10(0.423) = 4.23$ cm'
      - say: 'So $RY$ is 10 times 1 minus 1 over root 3, which is answer choice B.'
        write: '$RY = 10\left(1 - \dfrac{1}{\sqrt{3}}\right)$ cm'
        answer: true
    traps:
      A: 'You went for 10. That''s $ZY$, the whole height up to $Y$. $RY$ is only the part above $R$, so subtract $ZR$, which is 10 over root 3.'
      C: 'You went for 10 times 1 minus root 3. Tan 30 is 1 over root 3, not root 3. And 1 minus root 3 is negative, which can''t be a length.'
