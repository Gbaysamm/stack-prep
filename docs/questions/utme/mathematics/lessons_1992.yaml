          - {id: seats, op: circle, part: col}
      - say: '$PP$ would need $Q$ to be $P$ itself. That only happens when $P$ equals its own transpose, and nothing tells us that.'
        write: 'Option D: $PP$ needs $P^{T} = P$'
      - say: 'And $P$ times $P$ to the minus $T$ involves an inverse, which nothing in the question takes.'
        write: 'Option B: $P^{-T}$ is an inverse, not the transpose'
