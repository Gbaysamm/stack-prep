        write: 'Option C: $QP = P^{T}P$'
      - say: 'Matrix multiplication is not commutative: changing the order usually changes the answer. A row and a column do not swap places for free. So $P$ transpose times $P$ is not the same as $P$ times $P$ transpose in general.'
        write: '$P^{T}P \ne PP^{T}$ in general'
        doodle_do:
