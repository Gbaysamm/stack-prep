          - {line: 7, kind: move, from: {line: 6, at: '11.20 − 0.04x'}, at: '11.20 − 0.04x', text: 'second part'}
          - {line: 7, kind: move, from: {line: 0, at: '12.80'}, at: '12.80', text: 'total'}
      - say: 'Collect the $x$ terms. $0.05x$ minus $0.04x$ is $0.01x$.'
        write: '$0.01x + 11.20 = 12.80$'
