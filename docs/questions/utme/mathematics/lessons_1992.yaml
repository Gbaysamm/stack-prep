        point:
          - {figure: sketch, kind: arc, target: CDA, text: '90°'}
      - say: 'The interior angles of a polygon with $n$ sides add up to $n$ minus 2, times 180 degrees. The reason is the sum of interior angles of a polygon.'
        write: 'Sum of int. $\angle$s $= (n - 2) \times 180^{\circ}$'
      - say: 'A quadrilateral has 4 sides, so $n$ is 4. 4 minus 2 is 2, and 2 times 180 is 360. Tear off the four corners and they fill a full turn.'
        write: '$= (4 - 2) \times 180^{\circ} = 360^{\circ}$'
        doodle_do:
          - {id: paper, op: stage, stage: 'custom:1992_q25_a2'}
        point:
          - {line: 3, kind: highlight, at: '360', to: {doodle: paper, part: turn}}
