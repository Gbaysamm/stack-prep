        write: 'Differentiation: $\dfrac{d}{dx}\left(x^{n}\right) = nx^{n - 1}$'
      - say: 'At a turning point, the gradient is zero. So we differentiate: $x$ cubed gives $3x$ squared, minus $12x$ gives minus 12, and the 11 gives nothing.'
        write: 'Gradient: $f^{\prime}(x) = 3x^{2} - 12$'
      - say: 'At the turning points, this gradient is zero.'
        write: 'Turning points: $3x^{2} - 12 = 0$'
      - say: 'Add 12 to both sides.'
