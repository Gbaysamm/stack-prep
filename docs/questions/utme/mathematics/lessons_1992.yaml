        write: '$|YZ| = 6$ km (due south of $Y$), $\ |XZ| = 12$ km'
      - section: 'Solution'
        say: 'Solution. Let me draw it, with North lines. $X$ is due east of $Y$, and $Z$ is due south of $Y$. East and south are at right angles, so the angle at $Y$ is 90 degrees.'
        write: 'Solution: $\ \angle XYZ = 90^{\circ}$ (E and S are $\perp$)'
        show_sketch: true
        'on': 'draw'
        point:
          - {figure: sketch, kind: highlight, target: '6 km', text: 'YZ'}
          - {figure: sketch, kind: highlight, target: '12 km', text: 'XZ'}
          - {figure: sketch, kind: arc, target: XYZ, text: '90°'}
      - say: 'A bearing is measured clockwise from North, in three figures. The bearing of $Z$ from $X$ is measured at $X$, the point after the word from.'
        write: 'Bearing of $Z$ from $X$: at $X$, clockwise from N'
        point:
          - {figure: sketch, kind: circle, target: X, text: 'measure here'}
      - say: 'Let theta be the angle $YXZ$, the angle at $X$ inside the triangle.'
        write: 'Let $\theta = \angle YXZ$'
        point:
          - {figure: sketch, kind: arc, target: YXZ, text: 'θ'}
      - say: 'From $X$, the side $YZ$ is opposite theta, and $XZ$ is the hypotenuse. Opposite and hypotenuse means SOH, so we use sine.'
        write: '$\sin\theta = \dfrac{\text{opp}}{\text{hyp}}$ (SOH)'
        point:
          - {figure: sketch, kind: highlight, target: YZ, text: 'opp'}
          - {figure: sketch, kind: highlight, target: XZ, text: 'hyp'}
      - say: 'Now substitute. The opposite is 6 and the hypotenuse is 12. 6 over 12 is 0.5.'
        write: '$\sin\theta = \dfrac{6}{12} = 0.5$'
        point:
          - {line: 5, kind: move, from: {line: 0, at: '= 6'}, at: '12[[6]]', text: 'opp'}
          - {line: 5, kind: move, from: {line: 0, at: '= 12'}, at: '[[12]]6', text: 'hyp'}
      - say: 'The angle whose sine is 0.5 is 30 degrees, because sine 30 is a half.'
        write: '$\theta = \sin^{-1} 0.5 = 30^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: YXZ, text: '30°'}
      - section: 'The bearing'
        say: 'Now the North line at $X$. Clockwise from North, East is 090, South is 180 and West is 270. $Y$ is due west of $X$.'
        write: 'Bearing of $Y$ from $X = 270^{\circ}$ (due west)'
        doodle: {name: 'custom:1992_q29_a', id: compass, caption: 'the compass at X'}
        doodle_do:
          - {id: compass, op: label, part: toy, text: '270°'}
        point:
          - {figure: sketch, kind: highlight, target: XY, text: 'due west, 270°'}
      - say: '$Z$ is on the south side of the line $XY$. So, turning clockwise from North, we stop theta short of West. Subtract theta.'
        write: 'Bearing of $Z$ from $X = 270^{\circ} - \theta$'
      - say: '270 minus 30 is 240.'
        write: '$= 270^{\circ} - 30^{\circ}$'
        point:
          - {line: 9, kind: move, from: {line: 6, at: '= [[30∘]]'}, at: '− [[30∘]]', text: 'θ'}
      - say: 'Therefore the bearing of $Z$ from $X$ is 240 degrees. It is already three figures.'
        write: '$\therefore$ Bearing of $Z$ from $X = 240^{\circ}$'
        doodle_do:
          - {id: compass, op: stage, stage: 'custom:1992_q29_a2'}
          - {id: compass, op: label, part: toz, text: '240°'}
        point:
          - {figure: sketch, kind: label, target: '?', text: '240°'}
      - section: 'Check'
        say: 'Check with the back bearing. At $Z$, the North line runs along $ZY$. Angles in a triangle add up to 180, so the angle $YZX$ is 180 minus 90 minus 30.'
        write: 'Check: $\angle YZX = 180^{\circ} - 90^{\circ} - 30^{\circ} = 60^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: YZX, text: '60°'}
      - say: 'So the bearing of $X$ from $Z$ is 060. A back bearing differs by 180, and 060 plus 180 is 240. It agrees.'
        write: '$060^{\circ} + 180^{\circ} = 240^{\circ}\ \checkmark$'
      - section: 'Answer'
        say: 'So the bearing of $Z$ from $X$ is 240 degrees, which is option A.'
        write: '$\therefore$ Bearing $= 240^{\circ}$'
        answer: true
        doodle_do:
          - {id: compass, op: circle, part: north}
        point:
          - {figure: sketch, kind: circle, target: '?', text: '240°'}
          - {line: 13, kind: highlight, at: '240', to: {doodle: compass, part: toz}}
    traps:
      B: 'You went for 210 degrees. That is 180 plus 30, turning the 30 degrees from South. But theta is the angle at $X$ from the line $XY$, which points West, so the bearing is 270 minus 30, which is 240.'
      C: 'You went for 150 degrees. That points south-east of $X$, but $Z$ is south-west of $X$, so its bearing is between 180 and 270. It is 270 minus 30, which is 240.'
      D: 'You went for 60 degrees. That is the bearing of $X$ from $Z$, the back bearing. "From $X$" means we stand at $X$, and 060 plus 180 is 240.'
  30:
    moments:
      - section: 'The question'
        say: 'The shaded piece lies between a chord and the arc above it. A piece like that is called a segment. We want its area.'
        write: 'Find the area of the shaded portion.'
        point:
          - {figure: 0, kind: circle, target: {x: 180, y: 70}, text: 'segment', 'on': 'called a segment'}
      - say: 'Write Solution, and read the figure. Two radii of 6 cm meet at the centre O at a right angle, and the chord joins their ends.'
        write: 'Solution'
        point:
          - {figure: 0, kind: circle, target: O, text: 'centre', 'on': 'the centre O'}
          - {figure: 0, kind: label, target: {x: 127, y: 118}, text: '90°', 'on': 'a right angle'}
      - section: 'What we know'
        say: 'List the givens. The radius r is 6 cm, and the angle at the centre, theta, is 90 degrees.'
        write: '$r = 6$ cm, $\theta = 90^{\circ}$'
      - say: 'The sector is the slice between the two radii. Take away the triangle inside it, and the segment is left.'
        write: 'Area of segment $=$ area of sector $-$ area of $\triangle$'
      - section: 'The sector'
        say: 'The area of a sector is theta over 360, times pi r squared.'
        write: 'Area of sector $= \dfrac{\theta}{360} \times \pi r^{2}$'
      - say: 'Substitute, with theta as 90 and r as 6.'
        write: '$= \dfrac{90}{360} \times \pi \times 6^{2}$'
      - say: '90 over 360 is a quarter, and 6 squared is 36. A quarter of 36 pi is 9 pi.'
        write: '$= \dfrac{1}{4} \times 36\pi = 9\pi\ \text{cm}^{2}$'
      - section: 'The triangle'
        say: 'The triangle has its right angle at O, so its base and height are the two radii, 6 and 6. The area of a triangle is a half, times base, times height.'
        write: 'Area of $\triangle = \dfrac{1}{2} \times 6 \times 6$'
      - say: '6 times 6 is 36, and half of 36 is 18.'
        write: '$= 18\ \text{cm}^{2}$'
      - section: 'The segment'
        say: 'Back to the segment, which is the sector, 9 pi, minus the triangle, 18.'
        write: 'Area of segment $= 9\pi - 18$'
        point:
          - {line: 9, kind: move, from: {line: 6, at: '= [[9π]]'}, at: '9π', text: 'sector', 'on': 'the sector, 9 pi'}
          - {line: 9, kind: move, from: {line: 8, at: '18'}, at: '− 18', text: 'triangle', 'on': 'the triangle, 18'}
      - say: '18 is 9 times 2, so take out 9 as a common factor.'
        write: '$= 9(\pi - 2)$'
      - say: 'Therefore the shaded area is 9 times pi minus 2, square centimetres.'
        write: '$\therefore$ shaded area $= 9(\pi - 2)\ \text{cm}^{2}$'
        point:
          - {figure: 0, kind: label, target: {x: 180, y: 70}, text: '9(π − 2) cm²', 'on': 'Therefore'}
      - section: 'Check'
        say: 'Check the size. 9 pi is about 28.3, so the segment is about 28.3 minus 18, which is 10.3. That is smaller than the quarter circle it sits in, as it must be.'
        write: 'Check: $9\pi - 18 \approx 28.3 - 18 = 10.3 < 28.3$ ✓'
      - section: 'Answer'
        say: 'So the shaded area is 9 times pi minus 2, square centimetres, which is answer choice B.'
        write: '$\therefore$ shaded area $= 9(\pi - 2)\ \text{cm}^{2}$ (B)'
        answer: true
    traps:
      A: 'You went for 9 pi. That is the whole sector, with the triangle still in it. The shaded part is a segment, so subtract the triangle, 18. 9 pi minus 18 is 9 times pi minus 2.'
      C: 'You went for 18 pi. That is half the circle. The angle is 90 degrees, so the sector is a quarter, 9 pi. Then subtract the triangle, 18.'
      D: 'You went for 36 pi. That is the whole circle, pi times 6 squared. The sector is 90 over 360 of it, 9 pi, and the segment is 9 pi minus 18.'
  31:
    moments:
      - section: 'The question'
        say: 'A point is always equidistant from two fixed points. This is one of the four standard loci. Name it exactly.'
        write: 'Equidistant from two fixed points; locus $= ?$'
      - section: 'Solution'
        say: 'Solution. A locus is the path traced by a moving point under a given condition. Call the fixed points $A$ and $B$, and the moving point $X$.'
        write: 'Solution: let the fixed points be $A$ and $B$; $|XA| = |XB|$'
      - say: 'Recall the four standard loci. They are a circle, the perpendicular bisector, a pair of parallel lines, and the angle bisector.'
        write: 'Standard loci: circle; $\perp$ bisector; parallel lines; $\angle$ bisector'
      - say: 'The locus of points equidistant from two fixed points is the perpendicular bisector of the line joining them.'
        write: 'Equidistant from two points $\Rightarrow$ $\perp$ bisector of $AB$'
      - say: 'Construct it with ruler and compasses. Join $A$ and $B$. With centre $A$ and radius more than half of $AB$, draw arcs above and below $AB$.'
        show_sketch: true
        write: 'Join $AB$; centre $A$, radius $> \tfrac{1}{2}|AB|$: arcs above and below'
        point:
          - {figure: sketch, kind: highlight, target: AB}
      - say: 'With centre $B$ and the same radius, draw arcs to cut the first two at $C$ and $D$.'
        write: 'Centre $B$, same radius: arcs cut them at $C$ and $D$'
        point:
          - {figure: sketch, kind: circle, target: C}
          - {figure: sketch, kind: circle, target: D}
      - say: 'Join $C$ and $D$. The line $CD$ cuts $AB$ at its midpoint $M$, at right angles. That line is the locus.'
        write: 'Join $CD$: it bisects $AB$ at $M$, at $90^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: BMC, text: '90°'}
          - {figure: sketch, kind: circle, target: locus}
      - section: 'Check'
        say: 'Why does it work? Picture two houses, $A$ and $B$. The villager at the midpoint is as far from one house as from the other.'
        doodle: {name: 'custom:1992_q31_a', id: village, caption: 'who stands as far from A as from B?', size: scene}
        doodle_do:
          - {id: village, op: circle, part: mid}
        write: 'Check: $|MA| = |MB|$'
        point:
          - {figure: sketch, kind: circle, target: M, text: 'midpoint'}
      - say: 'Take a villager $X$ further up the line. Triangles $XMA$ and $XMB$ have $MA$ equal to $MB$, $XM$ common, and right angles at $M$. So they are congruent.'
        doodle_do:
          - {id: village, op: stage, stage: 'custom:1992_q31_a2'}
        write: '$\triangle XMA \equiv \triangle XMB$ (SAS) $\Rightarrow |XA| = |XB|\ \checkmark$'
        point:
          - {figure: sketch, kind: highlight, target: XA}
          - {figure: sketch, kind: highlight, target: XB}
      - say: 'So every villager who is as far from $A$ as from $B$ stands on that one straight line.'
        doodle_do:
          - {id: village, op: stage, stage: 'custom:1992_q31_a3'}
      - say: 'Leave the construction arcs showing in the exam, since they are the evidence that earns the marks.'
        write: 'Keep the arcs: they earn the marks'
      - section: 'Answer'
        say: 'Therefore the locus is the perpendicular bisector of the straight line joining the two points, which is option A.'
        write: '$\therefore$ locus: the perpendicular bisector of $AB$'
        answer: true
    traps:
      B: 'You went for a parallel line. A point on a line parallel to $AB$ is usually much nearer one end than the other. Equal distances from two points give the perpendicular bisector.'
      C: 'You went for a transverse line. Just crossing $AB$ is not enough, because the line must cross at the midpoint and at right angles. That is the perpendicular bisector.'
      D: 'You went for an angle bisector with the horizontal. The locus has nothing to do with the horizontal, and an angle bisector is for two LINES. Two POINTS give the perpendicular bisector of $AB$.'
  32:
    moments:
      - section: 'The question'
        say: 'We want the distance from a point to a line. Many students leave a minus sign in the answer. A distance is a length, so the modulus keeps it positive.'
        write: 'Point $(2, 3)$; line $2x - 4y + 3 = 0$; $\ d = ?$'
      - section: 'Solution'
        say: 'Solution. Let me sketch the line and the point $P$, 2, 3, with the perpendicular $PN$ from $P$ to the line.'
        show_sketch: true
        write: 'Solution'
        point:
          - {figure: sketch, kind: circle, target: 'P', text: '(2, 3)'}
          - {figure: sketch, kind: underline, target: '2x − 4y + 3 = 0'}
      - say: 'The perpendicular distance from the point $x_1$, $y_1$ to the line $ax$ plus $by$ plus $c$ equals zero is given by this formula.'
        write: '$d = \dfrac{|ax_{1} + by_{1} + c|}{\sqrt{a^{2} + b^{2}}}$'
      - say: 'List the values. From the line, $a$ is 2, $b$ is minus 4 and $c$ is 3. From the point, $x_1$ is 2 and $y_1$ is 3.'
        write: '$a = 2,\ b = -4,\ c = 3;\ \ x_{1} = 2,\ y_{1} = 3$'
      - say: 'Substitute them, with the minus 4 in brackets.'
        write: '$d = \dfrac{|2(2) + (-4)(3) + 3|}{\sqrt{2^{2} + (-4)^{2}}}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: 'b = [[−4]]'}, at: '(−4)(3)', text: 'b'}
      - say: 'On top, 2 times 2 is 4 and minus 4 times 3 is minus 12. Below, 2 squared is 4 and minus 4 squared is 16.'
        write: '$= \dfrac{|4 - 12 + 3|}{\sqrt{4 + 16}}$'
      - say: '4 minus 12 plus 3 is minus 5, and the modulus of minus 5 is 5. 4 plus 16 is 20.'
        write: '$= \dfrac{|-5|}{\sqrt{20}} = \dfrac{5}{\sqrt{20}}$'
      - say: 'Simplify the surd. 20 is 4 times 5, and the root of 4 is 2.'
        write: '$\sqrt{20} = \sqrt{4 \times 5} = 2\sqrt{5}$'
      - say: 'So $d$ is 5 over 2 root 5. Rationalise by multiplying top and bottom by root 5. Root 5 times root 5 is 5.'
        write: '$d = \dfrac{5}{2\sqrt{5}} \times \dfrac{\sqrt{5}}{\sqrt{5}} = \dfrac{5\sqrt{5}}{10}$'
      - say: '5 over 10 is a half, so $d$ is root 5 over 2.'
        write: '$= \dfrac{\sqrt{5}}{2}$'
        point:
          - {figure: sketch, kind: label, target: 'd = ?', text: '√5/2'}
      - section: 'Check'
        say: 'Check another way. The line has gradient a half, so the perpendicular through $P$ has gradient minus 2, which gives $y$ equals minus $2x$ plus 7. It meets the line at $N$, 2 and a half, 2.'
        write: 'Check: $PN$: $y = -2x + 7$ meets the line at $N\left(2\tfrac{1}{2},\ 2\right)$'
        point:
          - {figure: sketch, kind: circle, target: 'N'}
      - say: 'From $P$, 2, 3, to $N$, we go across a half and down 1. The distance is root of a quarter plus 1, which is root 5 over 2 again.'
        write: '$PN = \sqrt{\left(\tfrac{1}{2}\right)^{2} + 1^{2}} = \sqrt{\tfrac{5}{4}} = \dfrac{\sqrt{5}}{2}\ \checkmark$'
      - say: 'Therefore the distance is root 5 over 2, which is option A.'
        write: '$\therefore d = \dfrac{\sqrt{5}}{2}$'
        answer: true
    traps:
      B: 'You went for minus root 5 over 20. A distance is never negative, because the modulus removes the sign. The top is 5 and the bottom is 2 root 5, which gives root 5 over 2.'
      C: 'You went for minus 5 over root 13. The root 13 comes from 2 squared plus 3 squared, the point instead of the line. The bottom uses $a$ and $b$ from the line, giving root of 4 plus 16.'
      D: 'You went for 0. That would put the point on the line, but 2 times 2 minus 4 times 3 plus 3 is minus 5, not zero. The distance is root 5 over 2.'
  33:
    moments:
      - section: 'The question'
        say: 'We want the equation of the line through the point 5, 7 that is parallel to the line $7x$ plus $5y$ equals 12.'
        write: 'Line through $(5,\ 7)$ parallel to $7x + 5y = 12$'
      - section: 'Solution'
        say: 'Solution. Let me draw the given line, and plot the point 5, 7.'
        write: 'Solution'
        diagram:
          id: g
          kind: graph
          x: [-1, 11]
          y: [-2, 15]
          step: 1
          plots:
            - {fn: '(12 - 7x)/5', label: '7x + 5y = 12', colour: blue}
            - {fn: '(70 - 7x)/5', label: '7x + 5y = 70', colour: green, later: true}
          points:
            - {x: 5, y: 7, text: '(5, 7)'}
          'on': 'draw'
      - section: 'Gradient of the given line'
        say: 'First the gradient of the given line. Make $y$ the subject by subtracting $7x$ from both sides.'
        write: '$5y = -7x + 12$'
      - say: 'Divide every term by 5.'
        write: '$y = -\dfrac{7}{5}x + \dfrac{12}{5}$'
      - say: 'Compare with $y$ equals $mx$ plus $c$. The gradient is the coefficient of $x$, negative 7 over 5.'
        write: '$\therefore\ m_{1} = -\dfrac{7}{5}$'
      - say: 'Parallel lines have equal gradients. So our line also has gradient negative 7 over 5.'
        write: '$m_{2} = m_{1} = -\dfrac{7}{5}$ (parallel lines)'
        diagram_do:
          - {id: g, op: highlight, part: 'plot:1', text: 'gradient −7/5', 'on': 'Parallel'}
      - section: 'The equation'
        say: 'The equation of a line through the point $x$ 1, $y$ 1, with gradient $m$, is $y$ minus $y$ 1 equals $m$ times, $x$ minus $x$ 1.'
        write: '$y - y_{1} = m(x - x_{1})$'
      - say: 'Substitute, so $x$ 1 is 5, $y$ 1 is 7, and $m$ is negative 7 over 5.'
        write: '$y - 7 = -\dfrac{7}{5}(x - 5)$'
      - say: 'Multiply both sides by 5 to clear the fraction. 5 times, $y$ minus 7, is $5y$ minus 35. Negative 7 times, $x$ minus 5, is negative $7x$ plus 35.'
        write: '$5y - 35 = -7x + 35$'
      - say: 'Add $7x$ to both sides, and add 35 to both sides. 35 plus 35 is 70.'
        write: '$7x + 5y = 70$'
        diagram_do:
          - {id: g, op: plot, 'on': '70'}
      - section: 'Check'
        say: 'Check that 5, 7 is on our line. 7 times 5 is 35, and 5 times 7 is 35. 35 plus 35 is 70.'
        write: 'Check: $7(5) + 5(7) = 35 + 35 = 70\ \checkmark$'
        diagram_do:
          - {id: g, op: highlight, part: 'point:1', text: 'on the new line'}
      - say: 'Here is an exam tip. A line parallel to $7x$ plus $5y$ equals 12 keeps $7x$ plus $5y$, and only the constant changes. Putting in 5, 7 gives 70 at once.'
        write: 'Exam tip: parallel line is $7x + 5y = k$'
      - say: 'Therefore the equation is $7x$ plus $5y$ equals 70, which is answer choice B.'
        write: '$\therefore\ 7x + 5y = 70$'
        answer: true
        diagram_do:
          - {id: g, op: label, part: 'plot:2', text: '7x + 5y = 70', answer: true}
    traps:
      A: 'You went for $5x$ plus $7y$ equals 120. That swaps the coefficients, which changes the gradient to negative 5 over 7. A parallel line keeps $7x$ plus $5y$, and only the constant changes.'
      C: 'You went for $x$ plus $y$ equals 7. That has gradient negative 1, not negative 7 over 5, and 5 plus 7 is 12, so it does not even pass through 5, 7.'
      D: 'You went for $15x$ plus $17y$ equals 90. That has the wrong gradient, and 15 times 5 plus 17 times 7 is 194, not 90. Keep $7x$ plus $5y$, and the constant is 70.'
  34:
    moments:
      - section: 'The question'
        say: 'Theta is acute and sin theta is $m$ over $n$. We want cot theta. With a ratio in letters, draw the triangle it describes.'
        write: '$\sin\theta = \dfrac{m}{n}$, $\theta$ acute; find $\cot\theta$'
      - section: 'Solution'
        say: 'Solution. Let me draw a right-angled triangle $ABC$, with the right angle at $B$ and theta at $A$.'
        write: 'Solution: right $\angle$ at $B$, $\theta$ at $A$'
        show_sketch: true
        'on': 'draw'
      - say: 'SOH says sin is opposite over hypotenuse. So the opposite side $BC$ is $m$ and the hypotenuse $AC$ is $n$.'
        write: 'SOH: $\dfrac{\text{opp}}{\text{hyp}} = \dfrac{m}{n}$: opp $= m$, hyp $= n$'
        point:
          - {figure: sketch, kind: highlight, target: BC, text: 'opp = m'}
          - {figure: sketch, kind: highlight, target: AC, text: 'hyp = n'}
      - section: 'The adjacent side'
        say: 'By Pythagoras, the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $n^{2} = m^{2} + \text{adj}^{2}$'
      - say: 'Take $m$ squared to the other side, then take the square root.'
        write: '$\text{adj}^{2} = n^{2} - m^{2} \Rightarrow \text{adj} = \sqrt{n^{2} - m^{2}}$'
        point:
          - {figure: sketch, kind: highlight, target: AB, text: 'adj'}
      - section: 'cot θ'
        say: 'Cot is 1 over tan. Tan is opposite over adjacent, so cot is adjacent over opposite.'
        write: '$\cot\theta = \dfrac{1}{\tan\theta} = \dfrac{\text{adj}}{\text{opp}}$'
      - say: 'Substitute the adjacent and the opposite side, $m$.'
        write: '$\cot\theta = \dfrac{\sqrt{n^{2} - m^{2}}}{m}$'
      - section: 'Check'
        say: 'Check with 30 degrees. From the half equilateral triangle, sin 30 is 1 over 2, so take $m$ as 1 and $n$ as 2.'
        write: 'Check: $\sin 30^{\circ} = \dfrac{1}{2}$: $m = 1,\ n = 2$'
      - say: 'Our formula gives root of 4 minus 1, over 1, which is root 3. And cot 30 is adjacent over opposite, root 3 over 1. It agrees.'
        write: '$\dfrac{\sqrt{2^{2} - 1^{2}}}{1} = \sqrt{3} = \cot 30^{\circ}\ \checkmark$'
      - section: 'Answer'
        say: 'So cot theta is root of $n$ squared minus $m$ squared, over $m$, which is answer choice A.'
        write: '$\therefore \cot\theta = \dfrac{\sqrt{n^{2} - m^{2}}}{m}$'
        answer: true
    traps:
      B: 'You went for option B. It puts the whole fraction under the root, so the $m$ in the denominator is square-rooted too. Only the adjacent side carries the root.'
      C: 'You went for option C. That is opposite over adjacent, which is tan theta. Cot is adjacent over opposite.'
      D: 'You went for option D. At 30 degrees, with $m$ as 1 and $n$ as 2, it gives root of 2 over 3, about 0.82, but cot 30 is root 3. Cot is adjacent over opposite.'
  35:
    moments:
      - section: 'The question'
        say: 'In the figure, $XZ$ is 10 centimetres, with a right angle at $Z$. $R$ and $Y$ are on the vertical line through $Z$. We want $RY$.'
        write: 'Solution: $|XZ| = 10$ cm, $\angle XZY = 90^{\circ}$'
        point:
          - {figure: 0, kind: highlight, target: XZ}
      - say: '$RY$ is the part of $ZY$ above $R$. So we find the two heights, $ZY$ and $ZR$, and subtract.'
        write: '$|RY| = |ZY| - |ZR|$'
        point:
          - {figure: 0, kind: highlight, target: RY, text: 'RY'}
      - section: 'Triangle XZR'
        say: 'Start with the smaller triangle, $XZR$. $ZR$ is opposite the 30 degrees, and $XZ$ is adjacent. Opposite over adjacent is TOA, so tan.'
        write: 'In $\triangle XZR$: $\tan 30^{\circ} = \dfrac{|ZR|}{|XZ|}$ (TOA)'
        point:
          - {figure: 0, kind: arc, target: ZXR, text: '30°'}
          - {figure: 0, kind: underline, target: ZR, text: 'opposite'}
      - say: 'Multiply both sides by $XZ$, which is 10.'
        write: '$|ZR| = 10\tan 30^{\circ}$'
      - say: 'Tan 30 degrees is 1 over root 3, so $ZR$ is 10 over root 3.'
        write: '$= 10 \times \dfrac{1}{\sqrt{3}} = \dfrac{10}{\sqrt{3}}$'
      - section: 'Triangle XZY'
        say: 'The line to $Y$ makes the 30 degrees plus the extra 15 degrees with $XZ$, which is 45 degrees.'
        write: '$\angle ZXY = 30^{\circ} + 15^{\circ} = 45^{\circ}$ (adjacent $\angle$s)'
        point:
          - {figure: 0, kind: arc, target: ZXY, text: '45°'}
      - say: 'In the bigger triangle, $XZY$, $ZY$ is opposite the 45 degrees. We use tan again.'
        write: 'In $\triangle XZY$: $\tan 45^{\circ} = \dfrac{|ZY|}{10}$ (TOA)'
        point:
          - {figure: 0, kind: underline, target: ZY, text: 'opposite'}
      - say: 'Multiply by 10. Tan 45 degrees is 1, so $ZY$ is 10.'
        write: '$|ZY| = 10\tan 45^{\circ} = 10 \times 1 = 10$'
      - section: 'Subtract'
        say: 'Now substitute into $RY$ equals $ZY$ minus $ZR$, giving 10 minus 10 over root 3.'
        write: '$|RY| = 10 - \dfrac{10}{\sqrt{3}}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '1 = [[10]]'}, at: '= [[10]] −', text: 'ZY'}
          - {line: 8, kind: move, from: {line: 4, at: '= [[310]]'}, at: '− [[310]]', text: 'ZR'}
      - say: 'Both terms have a 10, so factorise by taking out 10 as the common factor.'
        write: '$= 10\left(1 - \dfrac{1}{\sqrt{3}}\right)$'
      - section: 'Check'
        say: 'To check, 1 over root 3 is about 0.577, so this is 10 times 0.423, about 4.23 centimetres. It is positive and less than 10, as $RY$ must be.'
        write: 'Check: $10(1 - 0.577) = 10(0.423) \approx 4.23$ cm $\checkmark$'
      - section: 'Answer'
        say: 'Therefore $RY$ is 10 times, 1 minus 1 over root 3, centimetres, which is option B.'
        write: '$\therefore |RY| = 10\left(1 - \dfrac{1}{\sqrt{3}}\right)$ cm'
        answer: true
    traps:
      A: 'You went for 10. That is $ZY$, the whole height up to $Y$. $RY$ is only the part above $R$, so subtract $ZR$, which is 10 over root 3.'
      C: 'You went for 10 times, 1 minus root 3. Tan 30 degrees is 1 over root 3, not root 3. And 1 minus root 3 is negative, which cannot be a length.'
      D: 'You went for 10 times, 1 minus 1 over root 2. That uses a 45-degree ratio, sine or cosine 45, in the lower triangle. The lower angle is 30 degrees, and tan 30 degrees is 1 over root 3.'
  36:
    moments:
      - section: 'The question'
        say: 'Put in 2 and the top and the bottom both vanish. That 0 over 0 is a signal to factorise, not an answer.'
        write: '$\displaystyle\lim_{x \to 2}\dfrac{(x - 2)(x^{2} + 3x - 2)}{x^{2} - 4}$'
      - section: 'Solution'
        say: 'Solution. First, substitute directly by putting 2 for every $x$. The top has 2 minus 2, which is 0, and the bottom is 4 minus 4, also 0.'
        'on': 'substitute directly'
        write: 'Direct substitution: $\dfrac{(2 - 2)(4 + 6 - 2)}{2^{2} - 4} = \dfrac{0}{0}$'
      - say: '0 over 0 is called indeterminate, because it tells us nothing yet. When that happens, we factorise and cancel the common factor.'
        write: '$\dfrac{0}{0}$ is indeterminate, so factorise'
      - section: 'Factorise'
        say: 'The bottom, $x$ squared minus 4, is a difference of two squares, so it is $x$ minus 2, times $x$ plus 2.'
        write: '$x^{2} - 4 = (x - 2)(x + 2)$'
      - say: 'Write the limit again with the bottom factorised.'
        write: '$= \displaystyle\lim_{x \to 2}\dfrac{(x - 2)(x^{2} + 3x - 2)}{(x - 2)(x + 2)}$'
      - say: '$x$ tends to 2 but is never equal to 2, so $x$ minus 2 is not zero. Cancel it from the top and the bottom.'
        'on': 'Cancel'
        write: '$= \displaystyle\lim_{x \to 2}\dfrac{x^{2} + 3x - 2}{x + 2}$'
        point:
          - {line: 4, kind: strike, at: '(x+2)[[(x−2)]](x2', text: 'cancel'}
          - {line: 4, kind: strike, at: '[[(x−2)]](x+2)'}
      - section: 'Substitute again'
        say: 'Now the bottom is not zero at 2, so substitute $x$ equals 2 again.'
        write: '$= \dfrac{2^{2} + 3(2) - 2}{2 + 2}$'
      - say: '2 squared is 4, and 3 times 2 is 6. 4 plus 6 minus 2 is 8. The bottom is 4.'
        write: '$= \dfrac{4 + 6 - 2}{4} = \dfrac{8}{4}$'
      - say: 'Therefore the limit is 8 over 4, which is 2. That is answer choice B.'
        write: '$\therefore \displaystyle\lim_{x \to 2}\dfrac{(x - 2)(x^{2} + 3x - 2)}{x^{2} - 4} = 2$'
        answer: true
    traps:
      A: 'You went for 0. The top is 0 at $x$ equals 2, but so is the bottom, and 0 over 0 is indeterminate. Factorise, cancel $x - 2$, then substitute to get 8 over 4, which is 2.'
      C: 'You went for 3. After cancelling, check the top. 4 plus 6 minus 2 is 8, and the bottom is 2 plus 2, which is 4. 8 over 4 is 2.'
      D: 'You went for 4. That is only the bottom, $x + 2$, at $x$ equals 2. The top is 8, and 8 over 4 is 2.'
  37:
    moments:
      - section: 'The question'
        say: 'The second derivative means we differentiate, then differentiate the answer again. And $x$ times sine $x$ is a product, so the product rule comes in both times.'
        write: '$y = x\sin x$'
      - section: 'Solution'
        say: 'Solution. Name the two parts. Let $u$ be $x$, and let $v$ be sine $x$.'
        write: 'Let $u = x$, $\ v = \sin x$'
      - say: 'Differentiate each. $x$ gives 1, and sine $x$ gives cos $x$.'
        write: '$\dfrac{du}{dx} = 1$, $\ \dfrac{dv}{dx} = \cos x$'
      - say: 'The product rule says $\dfrac{dy}{dx}$ equals $u$ $\dfrac{dv}{dx}$ plus $v$ $\dfrac{du}{dx}$.'
        'on': 'product rule'
        write: '$\dfrac{dy}{dx} = u\dfrac{dv}{dx} + v\dfrac{du}{dx}$'
      - say: 'Substitute, and we get $x$ times cos $x$, plus sine $x$ times 1.'
        write: '$\dfrac{dy}{dx} = x\cos x + \sin x(1) = x\cos x + \sin x$'
        point:
          - {line: 3, kind: box, text: 'the rule'}
      - section: 'Differentiate again'
        say: 'Now differentiate $\dfrac{dy}{dx}$ term by term. $x$ cos $x$ is another product, so let $u$ be $x$, and $v$ be cos $x$.'
        write: 'For $x\cos x$: let $u = x$, $\ v = \cos x$'
      - say: '$\dfrac{du}{dx}$ is 1. The derivative of cos $x$ is minus sine $x$, so watch that minus.'
        write: '$\dfrac{du}{dx} = 1$, $\ \dfrac{dv}{dx} = -\sin x$'
      - say: 'By the product rule, we get $x$ times minus sine $x$, plus cos $x$ times 1.'
        write: '$\dfrac{d}{dx}(x\cos x) = x(-\sin x) + \cos x(1) = \cos x - x\sin x$'
      - say: 'The second term, sine $x$, differentiates to cos $x$.'
        write: '$\dfrac{d}{dx}(\sin x) = \cos x$'
      - say: 'Add the two results.'
        write: '$\dfrac{d^{2}y}{dx^{2}} = \cos x - x\sin x + \cos x$'
        point:
          - {line: 9, kind: move, from: {line: 7, at: '= [[cosx − xsinx]]'}, at: '[[cosx − xsinx]] +', text: 'first term'}
          - {line: 9, kind: move, from: {line: 8, at: '= [[cosx]]'}, at: 'xsinx + [[cosx]]', text: 'second term'}
      - say: 'Cos $x$ plus cos $x$ is 2 cos $x$. Therefore the second derivative is 2 cos $x$ minus $x$ sine $x$, which is answer choice A.'
        write: '$\therefore \dfrac{d^{2}y}{dx^{2}} = 2\cos x - x\sin x$'
        answer: true
    traps:
      B: 'You went for sine $x$ plus $x$ cos $x$. That is $\dfrac{dy}{dx}$, the first derivative. The question wants the second, so differentiate once more.'
      C: 'You went for sine $x$ minus $x$ cos $x$. That is the first derivative with a sign slip. Differentiate $x\cos x + \sin x$ again to get 2 cos $x$ minus $x$ sine $x$.'
      D: 'You went for $x$ sine $x$ minus 2 cos $x$. Both signs are flipped. Sine $x$ gives plus cos $x$, and cos $x$ gives minus sine $x$.'
  38:
    moments:
      - section: 'The question'
        say: 'Ice forms at 4 minus 0.6 $t$ grams per minute. That is a rate, $\dfrac{dm}{dt}$, where $m$ is the mass of ice after $t$ minutes. At the start there are already 2 grams.'
        write: '$\dfrac{dm}{dt} = 4 - 0.6t$, $\ m = 2$ g when $t = 0$'
      - section: 'Solution'
        say: 'Solution. To get the mass from its rate, we integrate the rate with respect to $t$.'
        write: '$m = \displaystyle\int (4 - 0.6t)\,dt$'
      - say: 'The rule is to add 1 to the power, divide by the new power, and add the constant $c$.'
        write: '$\displaystyle\int t^{n}\,dt = \dfrac{t^{n + 1}}{n + 1} + c$'
      - say: 'Integrate term by term. 4 gives $4t$. 0.6 $t$ gives 0.6 $t$ squared over 2.'
        write: '$m = 4t - \dfrac{0.6t^{2}}{2} + c$'
      - say: '0.6 over 2 is 0.3.'
        write: '$m = 4t - 0.3t^{2} + c$'
      - section: 'Find c'
        say: 'To find $c$, use the start, when $t$ is 0 and $m$ is 2. Substitute.'
        write: 'When $t = 0$, $m = 2$: $\ 2 = 4(0) - 0.3(0)^{2} + c$'
      - say: 'Both terms with $t$ are 0, so $c$ is 2.'
        write: '$\therefore c = 2$'
      - say: 'So the mass after $t$ minutes is $4t$ minus 0.3 $t$ squared, plus 2.'
        write: '$m = 4t - 0.3t^{2} + 2$'
      - section: 'After 5 minutes'
        say: 'Now substitute $t$ equals 5.'
        write: 'When $t = 5$: $\ m = 4(5) - 0.3(5)^{2} + 2$'
      - say: '4 times 5 is 20. 5 squared is 25, and 0.3 times 25 is 7.5.'
        write: '$= 20 - 7.5 + 2$'
      - say: '20 minus 7.5 is 12.5, and 12.5 plus 2 is 14.5 grams.'
        write: '$= 14.5$ g'
      - section: 'Check'
        say: 'To check, the ice formed in the 5 minutes is the definite integral from 0 to 5, which is 12.5 grams. Add the 2 grams at the start, and we get 14.5 grams.'
        write: 'Check: $\left[4t - 0.3t^{2}\right]_{0}^{5} = 12.5$; $\ 2 + 12.5 = 14.5\ \checkmark$'
      - say: 'Therefore there are 14.5 grams of ice in the box after 5 minutes, which is answer choice C.'
        write: '$\therefore$ mass after 5 minutes $= 14.5$ g'
        answer: true
    traps:
      A: 'You went for 19.5. At $t = 5$, 0.3 $t$ squared is 0.3 times 25, which is 7.5. So $m$ is 20 minus 7.5 plus 2, which is 14.5.'
      B: 'You went for 17.0. The integral of 0.6 $t$ is 0.3 $t$ squared, so at 5 you subtract 7.5. Then $m$ is 20 minus 7.5 plus 2, which is 14.5.'
      D: 'You went for 12.5. That is only the ice formed in the 5 minutes. The constant $c$ is 2, the ice already there, so $m$ is 14.5.'
  39:
    moments:
      - section: 'The question'
        say: 'Find the maximum value of the function. A cubic has two turning points, a maximum and a minimum, so we must pick the right one.'
        write: '$f(x) = x^{3} - 12x + 11$'
        diagram:
          id: g
          kind: graph
          x: [-4, 4]
          y: [-10, 30]
          y_step: 5
          plots:
            - {fn: 'x^3 - 12x + 11', label: 'y = x³ − 12x + 11', colour: blue}
      - section: 'Solution'
        say: 'Solution. Differentiate term by term, which means multiply by the power, then reduce the power by 1. $x$ cubed gives $3x$ squared, minus $12x$ gives minus 12, and 11 gives 0.'
        write: '$f^{\prime}(x) = 3x^{2} - 12$'
      - section: 'Turning points'
        say: 'At the turning point, the gradient is zero. So we write that at turning point, $f$ prime of $x$ equals 0.'
        'on': 'turning point'
        write: 'At turning point, $f^{\prime}(x) = 0$'
      - say: 'So $3x$ squared minus 12 equals 0.'
        write: '$3x^{2} - 12 = 0$'
        point:
          - {line: 3, kind: move, from: {line: 1, at: '= [[3x2 − 12]]'}, at: '3x2 − 12', text: 'f′(x)'}
      - say: 'Add 12 to both sides.'
        write: '$3x^{2} = 12$'
      - say: 'Divide both sides by 3. 12 divided by 3 is 4.'
        write: '$x^{2} = 4$'
      - say: 'Take the square root of both sides. Remember the plus and the minus, so $x$ is 2 or minus 2.'
        write: '$x = 2$ or $x = -2$'
      - section: 'Second derivative'
        say: 'Which is the maximum? Differentiate again. $3x$ squared gives $6x$, and minus 12 gives 0.'
        write: '$f^{\prime\prime}(x) = 6x$'
      - say: 'The rule is that a positive second derivative means a minimum, the bottom of a valley, and a negative one means a maximum. At $x$ equals 2, 6 times 2 is 12, which is positive, so it is a minimum.'
        write: '$f^{\prime\prime}(2) = 6(2) = 12 > 0$, minimum'
        diagram_do:
          - {id: g, op: point, part: 'plot:1', x: 2, text: 'minimum'}
      - say: 'At $x$ equals minus 2, 6 times minus 2 is minus 12, which is negative. Negative means a maximum, the top of the hill.'
        'on': 'Negative means'
        write: '$f^{\prime\prime}(-2) = 6(-2) = -12 < 0$, maximum'
        diagram_do:
          - {id: g, op: point, part: 'plot:1', x: -2, text: 'maximum', on: hill}
      - section: 'Maximum value'
        say: 'Now the value. Substitute $x$ equals minus 2 into the original function, with minus 2 in brackets.'
        write: '$f(-2) = (-2)^{3} - 12(-2) + 11$'
      - say: 'Minus 2, cubed, is minus 8. Minus 12 times minus 2 is plus 24.'
        write: '$= -8 + 24 + 11$'
      - say: 'Minus 8 plus 24 is 16, and 16 plus 11 is 27.'
        write: '$= 27$'
        diagram_do:
          - {id: g, op: label, part: 'point:2', text: 'f max = 27', colour: green}
      - section: 'Check'
        say: 'To check, the minimum value is $f$ of 2. 8 minus 24 plus 11 is minus 5, which is less than 27. So 27 is the larger, the maximum.'
        write: 'Check: $f(2) = 8 - 24 + 11 = -5 < 27\ \checkmark$'
      - say: 'Therefore the maximum value is 27, which is answer choice D.'
        write: '$\therefore$ maximum value $= 27$'
        answer: true
    traps:
      A: 'You went for minus 5. That is the minimum value, at $x$ equals 2, where the second derivative is positive. The maximum is at $x = -2$, and $f(-2)$ is 27.'
      B: 'You went for minus 2. That is the $x$ of the maximum, not the maximum value. Substitute $x = -2$ into $f(x)$ to get 27.'
      C: 'You went for 5. Check the signs in $f(-2)$. Minus 2 cubed is minus 8, and minus 12 times minus 2 is plus 24. Minus 8 plus 24 plus 11 is 27.'
  40:
    moments:
      - section: 'The question'
        say: 'A balloon swells as a student blows it up. We are told how fast its volume grows, the rate, and we want the volume itself after 2 seconds.'
        write: 'Find the volume after 2 seconds.'
      - say: 'Write Solution. A rate of change of volume with time is written d V by d t.'
        write: 'Solution'
      - section: 'What we know'
        say: 'List the givens. d V by d t equals pi times 20 minus t squared. At t equals 0, V is 0. We want V when t is 2.'
        write: '$\dfrac{dV}{dt} = \pi(20 - t^{2})$; $V = 0$ when $t = 0$'
      - section: 'Integrate'
        say: 'We have the rate, so to get V back we integrate with respect to t.'
        write: '$V = \displaystyle\int \pi(20 - t^{2})\,dt$'
      - say: 'The rule is that to integrate a power of t, we add 1 to the power and divide by the new power. Then add the constant c.'
        write: '$\displaystyle\int t^{n}\,dt = \dfrac{t^{n + 1}}{n + 1} + c$'
      - say: 'Pi is a constant, so it stays outside. 20 integrates to 20 t, and t squared integrates to t cubed over 3.'
        write: '$V = \pi\left(20t - \dfrac{t^{3}}{3}\right) + c$'
      - section: 'Find c'
        say: 'Use the starting value, that when t is 0, V is 0. Substitute, and everything but c is zero, so c is 0.'
        write: 'When $t = 0$, $V = 0$: $0 = \pi(0 - 0) + c \Rightarrow c = 0$'
      - say: 'So the volume at any time t is pi, times 20 t minus t cubed over 3.'
        write: '$\therefore V = \pi\left(20t - \dfrac{t^{3}}{3}\right)$'
      - section: 'Substitute t = 2'
        say: 'Now put t equals 2.'
        write: 'When $t = 2$: $V = \pi\left(20(2) - \dfrac{2^{3}}{3}\right)$'
      - say: '20 times 2 is 40, and 2 cubed is 8.'
        write: '$= \pi\left(40 - \dfrac{8}{3}\right)$'
      - say: 'To subtract, write 40 as 120 over 3. 120 over 3 minus 8 over 3 is 112 over 3.'
        write: '$= \pi\left(\dfrac{120}{3} - \dfrac{8}{3}\right) = \dfrac{112}{3}\pi$'
      - say: '112 divided by 3 is 37.33, to two decimal places.'
        write: '$= 37.33\pi$'
      - say: 'Therefore the volume after 2 seconds is 37.33 pi cubic centimetres.'
        write: '$\therefore V = 37.33\pi\ \text{cm}^{3}$'
      - section: 'Check'
        say: 'Check by differentiating V back. 20 t gives 20, and t cubed over 3 gives 3 t squared over 3, which is t squared. That is the rate we were given.'
        write: 'Check: $\dfrac{d}{dt}\left[\pi\left(20t - \dfrac{t^{3}}{3}\right)\right] = \pi(20 - t^{2})$ ✓'
      - section: 'Answer'
        say: 'So the volume after 2 seconds is 37.33 pi cubic centimetres, which is answer choice B.'
        write: '$\therefore V = 37.33\pi\ \text{cm}^{3}$ (B)'
        answer: true
    traps:
      A: 'You went for 37.00 pi. That rounds 8 over 3 down to 3. But 8 over 3 is 2.67, and 40 minus 2.67 is 37.33.'
      C: 'You went for 40 pi. That integrates the 20 but drops the t squared term. Subtract t cubed over 3 at t equals 2, which is 8 over 3, to get 37.33 pi.'
      D: 'You went for 42.67 pi. That adds the 8 over 3 instead of subtracting it. The rate is 20 minus t squared, so V is 40 minus 8 over 3, which is 37.33 pi.'
  41:
    moments:
      - section: 'The question'
        say: 'This is a definite integral of cos $2x$, from 0 to pi over 4. Pi over 4 radians is 45 degrees. Let me draw the curve, with $x$ in degrees.'
        write: '$\displaystyle\int_{0}^{\pi/4}\cos 2x\,dx$'
        diagram:
          id: g
          kind: graph
          x: [-5, 95]
          y: [-1.2, 1.2]
          x_step: 15
          y_step: 0.5
          x_label: 'x (degrees)'
          plots:
            - {fn: 'cos(2x)', label: 'y = cos 2x', colour: blue}
          points:
            - {x: 45, y: 0, text: 'π/4 = 45°'}
      - section: 'Solution'
        say: 'Solution. The standard integral says cos $ax$ integrates to 1 over $a$, sine $ax$, plus $c$. Here $a$ is 2.'
        'on': 'standard integral'
        write: '$\displaystyle\int \cos ax\,dx = \dfrac{1}{a}\sin ax + c$'
      - say: 'So cos $2x$ integrates to a half sine $2x$. For a definite integral the $c$ cancels, so we leave it out, and keep the limits on the square bracket.'
        write: '$\displaystyle\int_{0}^{\pi/4}\cos 2x\,dx = \left[\dfrac{1}{2}\sin 2x\right]_{0}^{\pi/4}$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
        diagram_do:
          - {id: g, op: shade, part: 'plot:1', x: [0, 45], text: 'area = ?', colour: orange}
      - section: 'Upper minus lower'
        say: 'Substitute the upper limit, pi over 4, then subtract the value at the lower limit, 0.'
        write: '$= \dfrac{1}{2}\sin\left(2 \times \dfrac{\pi}{4}\right) - \dfrac{1}{2}\sin(2 \times 0)$'
      - say: '2 times pi over 4 is pi over 2, and 2 times 0 is 0.'
        write: '$= \dfrac{1}{2}\sin\dfrac{\pi}{2} - \dfrac{1}{2}\sin 0$'
      - say: 'Pi over 2 is 90 degrees. Sine 90 degrees is 1, and sine 0 is 0.'
        write: '$= \dfrac{1}{2}(1) - \dfrac{1}{2}(0)$'
      - say: 'A half minus 0 is a half.'
        write: '$= \dfrac{1}{2}$'
        diagram_do:
          - {id: g, op: label, part: 'shade:1', text: 'area = ½', colour: green}
      - section: 'Check'
        say: 'Check by differentiating back. Sine $2x$ gives 2 cos $2x$ by the chain rule, so a half sine $2x$ gives cos $2x$.'
        write: 'Check: $\dfrac{d}{dx}\left(\dfrac{1}{2}\sin 2x\right) = \dfrac{1}{2} \times 2\cos 2x = \cos 2x\ \checkmark$'
      - say: 'Therefore the integral is a half, which is answer choice C.'
        write: '$\therefore \displaystyle\int_{0}^{\pi/4}\cos 2x\,dx = \dfrac{1}{2}$'
        answer: true
    traps:
      A: 'You went for minus a half. The integral of cos is plus sine, not minus sine. Sine of pi over 2 is plus 1, so the answer is plus a half.'
      B: 'You went for minus 1. Cos $2x$ integrates to plus a half sine $2x$. At the limits that is a half minus 0.'
      D: 'You went for 1. That forgets the 1 over $a$, because cos $2x$ integrates to a half sine $2x$, not sine $2x$.'
  42:
    moments:
      - section: 'The question'
        say: 'A storekeeper has five commodities, F, G, H, K and M, with quantities 215, 113, 108, 216 and 68. We want the angle for commodity $H$ on a pie chart.'
        write: '$F = 215,\ G = 113,\ H = 108,\ K = 216,\ M = 68$'
        doodle: {name: 'custom:1992_q42_a', id: stock, caption: 'the store''s five stacks of stock'}
      - section: 'Solution'
        say: 'Solution. Draw the table with each commodity, its quantity, and its sectoral angle. The whole circle, 360 degrees, stands for the total quantity.'
        write: 'Sectoral angle $= \dfrac{\text{quantity}}{\text{total}} \times 360^{\circ}$'
        diagram: {id: t, kind: table, columns: [Commodity, Quantity, 'Sectoral angle'], rows: [[F, 215, ''], [G, 113, ''], [H, 108, ''], [K, 216, ''], [M, 68, '']]}
      - say: 'First the total quantity, so add all five.'
        write: 'Total $= 215 + 113 + 108 + 216 + 68$'
      - say: '215 plus 113 is 328, plus 108 is 436, plus 216 is 652, plus 68 is 720.'
        write: '$= 720$'
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': '720'}
        doodle_do:
          - {id: stock, op: label, part: shelf, text: '720 in all'}
      - section: 'The sector for H'
        say: 'Now substitute for $H$, which is its quantity, 108, over the total, 720, times 360 degrees.'
        write: 'Angle for $H = \dfrac{108}{720} \times 360^{\circ}$'
        doodle_do:
          - {id: stock, op: circle, part: h}
        point:
          - {line: 4, kind: move, from: {line: 0, at: 'H = [[108]]'}, at: '108', text: 'H'}
          - {line: 4, kind: move, from: {line: 3, at: '= 720'}, at: '720', text: 'total'}
      - say: '360 over 720 is a half, so this is 108 times a half.'
        write: '$= 108 \times \dfrac{1}{2}$'
      - say: 'Half of 108 is 54. So $H$ gets 54 degrees.'
        write: '$= 54^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:3,3', text: '54°', 'on': '54 degrees'}
        doodle_do:
          - {id: stock, op: label, part: h, text: '54°'}
      - section: 'Check'
        say: 'Check by going back. 720 units share 360 degrees, so one degree stands for 2 units. 54 degrees times 2 is 108, the quantity of $H$.'
        write: 'Check: $54 \times \dfrac{720}{360} = 54 \times 2 = 108\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore commodity $H$ is represented by 54 degrees, which is answer choice D.'
        write: '$\therefore$ angle for $H = 54^{\circ}$'
        answer: true
    traps:
      A: 'You went for 216 degrees. That is commodity $K$''s quantity, not an angle. $H$''s sectoral angle is 108 over 720, times 360, which is 54 degrees.'
      B: 'You went for 108 degrees. That is $H$''s quantity copied across as an angle. The total is 720, so the sectoral angle is 108 over 720, times 360, which is 54 degrees.'
      C: 'You went for 68 degrees. That is commodity $M$''s quantity. $H$''s sectoral angle is 108 over 720, times 360, which is 54 degrees.'
  43:
    moments:
      - section: 'The question'
        say: 'The mean is given, 5.2, but one frequency is a letter, $y$. Build the usual table with the letter in it, and the mean formula becomes an equation. Table first.'
        write: '$\bar{x} = 5.2$; find $y$'
        diagram:
          id: t
          kind: table
          columns: ['x', 'f', 'fx']
          rows: [[2, 4, ''], [4, 'y', ''], [6, 6, ''], [8, 5, '']]
          'on': 'Table'
      - section: 'Solution'
        say: 'Solution. In the $fx$ column, 2 times 4 is 8. 4 times $y$ is $4y$.'
        write: 'Solution'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,3', text: '8'}
          - {id: t, op: fill, part: 'cell:2,3', text: '4y'}
      - say: '6 times 6 is 36. 8 times 5 is 40.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:3,3', text: '36'}
          - {id: t, op: fill, part: 'cell:4,3', text: '40'}
      - say: 'Add down the $f$ column. 4 plus 6 plus 5 is 15, and then the $y$.'
        write: '$\sum f = 4 + y + 6 + 5 = 15 + y$'
      - say: 'Add down the $fx$ column. 8 plus 36 is 44, plus 40 is 84, and then the $4y$.'
        write: '$\sum fx = 8 + 4y + 36 + 40 = 84 + 4y$'
      - section: 'The equation'
        say: 'The mean, $x$ bar, is the sum of $fx$ over the sum of $f$, which is the balance point of a beam with the blocks on it.'
        write: '$\bar{x} = \dfrac{\sum fx}{\sum f}$'
        doodle: {name: 'custom:1992_q43_a', id: beam, caption: 'the mean is where the beam balances', 'on': 'beam'}
      - say: 'Substitute both sums, and set the fraction equal to 5.2.'
        write: '$\dfrac{84 + 4y}{15 + y} = 5.2$'
        doodle_do:
          - {id: beam, op: circle, part: pivot, text: '5.2'}
        point:
          - {line: 6, kind: move, from: {line: 4, at: '=[[84+4y]]'}, at: '84+4y', text: 'Σfx'}
          - {line: 6, kind: move, from: {line: 3, at: '=[[15+y]]'}, at: '[[15+y]]84', text: 'Σf'}
      - say: 'Cross-multiply by multiplying both sides by 15 plus $y$.'
        write: '$84 + 4y = 5.2(15 + y)$'
      - say: 'Expand. 5.2 times 15 is 78, and 5.2 times $y$ is $5.2y$.'
        write: '$84 + 4y = 78 + 5.2y$'
      - say: 'Collect like terms, with the numbers on the left and the $y$ terms on the right.'
        write: '$84 - 78 = 5.2y - 4y$'
      - say: '84 minus 78 is 6, and $5.2y$ minus $4y$ is $1.2y$.'
        write: '$6 = 1.2y$'
      - say: 'Divide both sides by 1.2. 6 over 1.2 is 5, since 1.2 times 5 is 6. So 5 blocks sit at 4 on the beam.'
        write: '$\therefore y = \dfrac{6}{1.2} = 5$'
        doodle_do:
          - {id: beam, op: label, part: ystack, text: 'y = 5'}
        point:
          - {line: 11, kind: highlight, at: '=5', to: {doodle: beam, part: ystack}}
      - section: 'Check'
        say: 'To check, with $y$ equal to 5, the sum of $fx$ is 84 plus 20, which is 104, and the sum of $f$ is 20. 104 over 20 is 5.2.'
        write: 'Check: $\dfrac{84 + 4(5)}{15 + 5} = \dfrac{104}{20} = 5.2$ ✓'
      - section: 'Answer'
        say: 'So $y$ is 5.0, which is option C.'
        write: '$\therefore y = 5.0$'
        answer: true
    traps:
      A: 'You went for 6. Then $\sum fx$ is 108 and $\sum f$ is 21, and 108 over 21 is about 5.14, not 5.2. The equation gives $y = 5$.'
      B: 'You went for 5.2. That is the mean itself, not the missing frequency. Put 84 plus $4y$ over 15 plus $y$ equal to 5.2 and solve, which gives $y = 5$.'
      D: 'You went for 4. Then $\sum fx$ is 100 and $\sum f$ is 19, giving about 5.26. Remember $y$ goes into $\sum f$ too. Then $6 = 1.2y$, so $y = 5$.'
  44:
    moments:
      - section: 'The question'
        say: 'The table shows families and their number of children. We want the mode first, then the median. Both come straight out of one table with a cf column. Table first.'
        write: 'Mode, median $= ?$'
        diagram:
          id: t
          kind: table
          columns: ['x (children)', 'f (families)', 'cf']
          rows: [[0, 7, ''], [1, 11, ''], [2, 6, ''], [3, 7, ''], [4, 7, ''], [5, 5, ''], [6, 3, '']]
          'on': 'Table'
      - section: 'Solution'
        say: 'Solution. $x$ is the number of children, and $f$, the frequency, is the number of families with that many.'
        write: 'Solution'
      - section: 'The mode'
        say: 'The mode is the value of $x$ with the highest frequency. The highest $f$ is 11, at 1 child. So the mode is 1.'
        write: 'Highest frequency $= 11$ at $x = 1$; $\therefore$ mode $= 1$'
        diagram_do:
          - {id: t, op: highlight, part: 'row:2', text: 'highest f: mode', 'on': 'highest', on_nth: 2}
      - section: 'The median'
        say: 'Now the cf column, the cumulative frequency, which is a running total of $f$. The totals are 7, then 18, 24, 31, 38, 43 and 46.'
        diagram_do:
          - {id: t, op: total, part: 'col:2', into: 'col:3', 'on': 'running'}
      - say: 'The last cf is $N$, the total number of families, which is 46.'
        write: '$N = \sum f = 46$'
      - say: '46 is even, so the median is the average of the $N$ over 2th value, the 23rd, and the next, the 24th.'
        write: '$\dfrac{N}{2} = \dfrac{46}{2} = 23$: the 23rd and 24th values'
      - say: 'Go down the cf column. 18 is too small to reach 23. The next cf is 24, at 2 children. So the 19th to the 24th values are all 2.'
        write: '23rd and 24th values: $x = 2$ (cf $= 24$)'
        diagram_do:
          - {id: t, op: highlight, part: 'row:3', text: '19th to 24th', 'on': '24th'}
      - say: 'The average of 2 and 2 is 2. So the median is 2.'
        write: '$\therefore$ Median $= \dfrac{2 + 2}{2} = 2$'
      - section: 'Check'
        say: 'To check, the cf before the 2-children row is 18, less than 23, and the cf of that row is 24, so it holds both the 23rd and the 24th values.'
        write: 'Check: cf before $= 18 < 23$; cf $= 24 \ge 24$ ✓'
      - section: 'Answer'
        say: 'The mode comes first, then the median, so 1 and 2. That is option B.'
        write: '$\therefore$ Mode, median $= 1,\ 2$'
        answer: true
    traps:
      A: 'You went for 2, 1. Those are the right numbers in the wrong order. The question asks for the mode first, which is 1, then the median, which is 2.'
      C: 'You went for 1, 5. The mode is right, but the cf column shows the 23rd and 24th values are both 2. 5 is far down the table.'
      D: 'You went for 5, 2. The mode is the value of $x$ with the highest frequency. 11 families have 1 child, so the mode is 1, not 5.'
  45:
    moments:
      - section: 'The question'
        say: 'Three students scored 5, 6 and 7. How spread out are the scores? The standard deviation, S.D., measures that.'
        write: 'Scores: $5,\ 6,\ 7$; S.D. $= ?$'
      - section: 'Solution'
        say: 'Solution. The S.D. is the square root of the sum of the squared deviations over $n$. The deviations need the mean, so the mean comes first.'
        write: 'S.D. $= \sqrt{\dfrac{\sum(x - \bar{x})^{2}}{n}}$'
      - say: 'The mean, $x$ bar, is the sum of the scores over $n$. 5 plus 6 plus 7 is 18, and 18 over 3 is 6.'
        write: '$\bar{x} = \dfrac{\sum x}{n} = \dfrac{5 + 6 + 7}{3} = \dfrac{18}{3} = 6$'
      - section: 'The deviation table'
        say: 'Now the deviation table, with each score, its deviation from the mean, and the square of the deviation.'
        diagram:
          id: d
          kind: table
          columns: ['x', 'x − x̄', '(x − x̄)²']
          rows: [[5, '', ''], [6, '', ''], [7, '', '']]
          'on': 'table'
      - say: '5 minus 6 is minus 1. 6 minus 6 is 0. 7 minus 6 is 1. That is how far each score is from the mean.'
        diagram_do:
          - {id: d, op: fill, part: 'cell:1,2', text: '−1'}
          - {id: d, op: fill, part: 'cell:2,2', text: '0'}
          - {id: d, op: fill, part: 'cell:3,2', text: '1'}
      - say: 'Square each one. Minus 1 squared is 1, 0 squared is 0, and 1 squared is 1. We square because the plain deviations add to 0 and would cancel out.'
        diagram_do:
          - {id: d, op: fill, part: 'cell:1,3', text: '1'}
          - {id: d, op: fill, part: 'cell:2,3', text: '0'}
          - {id: d, op: fill, part: 'cell:3,3', text: '1'}
      - say: 'Add the last column, and 1 plus 0 plus 1 is 2.'
        write: '$\sum(x - \bar{x})^{2} = 2$'
        diagram_do:
          - {id: d, op: total, part: 'col:3', 'on': 'Add'}
      - section: 'The variance'
        say: 'The variance is that sum over $n$, the number of scores, which is 2 over 3.'
        write: 'Variance $= \dfrac{\sum(x - \bar{x})^{2}}{n} = \dfrac{2}{3}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '=[[2]]'}, at: '3[[2]]', text: 'Σ(x − x̄)²'}
      - say: 'The S.D. is the square root of the variance, so the square root of 2 over 3.'
        write: '$\therefore$ S.D. $= \sqrt{\dfrac{2}{3}}$'
      - section: 'Check'
        say: 'Check. The deviations themselves add to 0, as they always must. Minus 1 plus 0 plus 1 is 0. So the mean of 6 was right.'
        write: 'Check: $\sum(x - \bar{x}) = -1 + 0 + 1 = 0$ ✓'
      - section: 'Answer'
        say: 'So the standard deviation is the square root of 2 over 3, which is option C.'
        write: '$\therefore$ S.D. $= \sqrt{\dfrac{2}{3}}$'
        answer: true
    traps:
      A: 'You went for 2 over 3. That is the variance, one step too early. The S.D. is its square root, which is the square root of 2 over 3.'
      B: 'You went for 3 over 2 root 3. That does not come from the table. The squared deviations add to 2. Divide by 3 to get 2 over 3, then take the square root.'
      D: 'You went for the square root of 3 over 2. That is the fraction upside down. The sum is 2, divided by $n$, 3, so it is the square root of 2 over 3.'
  46:
    moments:
      - section: 'The question'
        say: 'There are two formulas for the sample variance. One divides by $n$, the other by $n$ minus 1. In class we divide by $n$. When does the choice stop mattering?'
        write: '$S^{2} = \dfrac{1}{n}\sum(x - \bar{x})^{2}$ or $\dfrac{1}{n - 1}\sum(x - \bar{x})^{2}$'
      - section: 'Solution'
        say: 'Solution. The top, the sum of the squared deviations, is the same in both. Only the divisor differs, which is $n$ or $n$ minus 1.'
        write: 'Solution. Same $\sum(x - \bar{x})^{2}$; divisors $n$ and $n - 1$'
      - say: 'Divide the second formula by the first. The sums cancel, and 1 over $n$ minus 1, divided by 1 over $n$, is $n$ over $n$ minus 1.'
        write: '$\dfrac{\text{second}}{\text{first}} = \dfrac{1}{n - 1} \div \dfrac{1}{n} = \dfrac{n}{n - 1}$'
      - say: 'Try a small sample, $n$ equal to 5, so picture 5 people. 5 over 4 is 1.25, so the two answers are 25 percent apart. That is a big difference.'
        write: '$n = 5$: $\dfrac{5}{4} = 1.25$, 25% apart'
        doodle: {name: 'person-small', id: small, repeat: 5, layout: row, caption: 'a sample of 5'}
        doodle_do:
          - {id: small, op: split, n: 1, text: '1 | 4 left'}
      - say: 'Now $n$ equal to 35, that is 35 people. 35 over 34 is about 1.03, so they are only about 3 percent apart.'
        write: '$n = 35$: $\dfrac{35}{34} \approx 1.03$, about 3% apart'
      - say: 'And for $n$ equal to 100, 100 over 99 is about 1.01, so they are only 1 percent apart.'
        write: '$n = 100$: $\dfrac{100}{99} \approx 1.01$, about 1% apart'
      - say: 'So as $n$ grows, $n$ over $n$ minus 1 gets closer and closer to 1, and the two variances become practically equal.'
        write: 'As $n$ increases, $\dfrac{n}{n - 1} \to 1$'
      - section: 'Check'
        say: 'Check with the usual rule in statistics, which says a sample above about 30 to 35 is a large sample, and for a large sample dividing by $n$ is accepted.'
        write: 'Check: large sample $\Rightarrow$ divide by $n$ ✓'
      - section: 'Answer'
        say: 'So there is practically no difference when $n$ is greater than 35, which is option B.'
        write: '$\therefore$ no practical difference when $n > 35$'
        answer: true
    traps:
      A: 'You went for $n$ equal to 35. That is only the boundary. $n$ over $n$ minus 1 keeps shrinking towards 1 as $n$ grows, so it is when $n$ is greater than 35.'
      C: 'You went for $n$ less than 35. That is the small-sample case, where dividing by $n$ minus 1 matters most. For $n$ equal to 5 the two are 25 percent apart.'
      D: 'You went for $n$ equal to 5. That is where they differ most, because 5 over 4 is 1.25, a 25 percent difference. They agree only for large samples.'
  47:
    moments:
      - section: 'The question'
        say: 'Two fair dice are thrown together. What is the probability of a total score of 8? A 2 then a 6 is not the same outcome as a 6 then a 2.'
        write: 'Two dice: $P(\text{total} = 8) = ?$'
      - say: 'Solution. Let $E$ be the event that the total score is 8.'
        write: 'Solution: let $E$ = total score of 8'
      - section: 'The sample space'
        say: 'Draw the outcome table, with the first die down the side, the second across the top, and the total in each cell.'
        diagram:
          id: s
          kind: table
          'on': 'outcome table'
          columns: ['+', '1', '2', '3', '4', '5', '6']
          rows: [[1, 2, 3, 4, 5, 6, 7], [2, 3, 4, 5, 6, 7, 8], [3, 4, 5, 6, 7, 8, 9], [4, 5, 6, 7, 8, 9, 10], [5, 6, 7, 8, 9, 10, 11], [6, 7, 8, 9, 10, 11, 12]]
      - say: 'Each die has 6 faces, so the table has 6 times 6 cells. n of $S$, the number of possible outcomes, is 36.'
        write: '$n(S) = 6 \times 6 = 36$'
      - section: 'The favourable outcomes'
        say: 'The 8s lie on one slanting line of the table. They are 2 and 6, 3 and 5, and 4 and 4. I ring them.'
        write: '$E = \{(2, 6),\ (3, 5),\ (4, 4),\ (5, 3),\ (6, 2)\}$'
        diagram_do:
          - {id: s, op: highlight, part: 'cell:2,7', 'on': 'ring'}
          - {id: s, op: highlight, part: 'cell:3,6'}
          - {id: s, op: highlight, part: 'cell:4,5'}
      - say: 'Then 5 and 3, and 6 and 2. That is 5 outcomes, so n of $E$ is 5.'
        write: '$n(E) = 5$'
        diagram_do:
          - {id: s, op: highlight, part: 'cell:5,4'}
          - {id: s, op: highlight, part: 'cell:6,3'}
      - section: 'The probability'
        say: 'The probability of $E$ is n of $E$ over n of $S$, so the number of favourable outcomes over the total number of possible outcomes.'
        write: '$P(E) = \dfrac{n(E)}{n(S)}$'
      - say: 'Substitute to get 5 over 36. 5 and 36 share no factor, so it stays.'
        write: '$= \dfrac{5}{36}$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '= 5'}, at: '36[[5]]', text: 'n(E)'}
          - {line: 7, kind: move, from: {line: 3, at: '= 36'}, at: '[[36]]5', text: 'n(S)'}
      - section: 'Check'
        say: 'Check. A first die of 1 cannot make 8, because the second would need 7. For a first die of 2 up to 6, exactly one face of the second die works. That is 5.'
        write: 'Check: 1st die $2$ to $6$, one partner each: $5\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the probability of a total score of 8 is 5 over 36, which is option B.'
        write: '$\therefore P(\text{total} = 8) = \dfrac{5}{36}$'
        answer: true
    traps:
      A: 'You went for 1 over 12, which is 3 over 36. That counts only 2 and 6, 3 and 5, and 4 and 4. But 2 then 6 and 6 then 2 are different cells of the table, so n of E is 5.'
      C: 'You went for 1 over 8. n of S is 36, not a multiple of 8. Five cells of the table make 8, so it is 5 over 36.'
      D: 'You went for 7 over 36. Only 5 cells make 8, and they are 2 6, 3 5, 4 4, 5 3 and 6 2. So it is 5 over 36.'
  48:
    moments:
      - section: 'The question'
        say: 'The probability of $P$ is 3 over 4, of $Q$ is 1 over 6, and of both is 1 over 12. What is the probability of $P$ or $Q$? Adding is not enough here.'
        write: '$P(P) = \tfrac{3}{4},\ P(Q) = \tfrac{1}{6},\ P(P \cap Q) = \tfrac{1}{12}$'
      - say: 'Solution. $P$ and $Q$ can happen together, with probability 1 over 12. So they are not mutually exclusive.'
        write: 'Solution: $P$ and $Q$ are not mutually exclusive'
      - say: 'In the Venn diagram, the overlap is both, $P$ intersection $Q$. When we add $P$ and $Q$, the overlap is counted twice, so we subtract it once.'
        write: 'Overlap counted twice: subtract it once'
        diagram:
          id: v
          kind: venn
          'on': 'Venn diagram'
          sets:
            - {key: P, name: 'P', total: '3/4'}
            - {key: Q, name: 'Q', total: '1/6'}
          counts: {'P∩Q': '1/12'}
        diagram_do:
          - {id: v, op: highlight, part: 'P∩Q', text: 'counted twice', 'on': 'counted twice'}
      - section: 'The addition rule'
        say: 'The addition rule says P of $P$ union $Q$ is P of $P$, plus P of $Q$, minus P of $P$ intersection $Q$.'
        write: '$P(P \cup Q) = P(P) + P(Q) - P(P \cap Q)$'
      - say: 'Substitute, and we get 3 over 4, plus 1 over 6, minus 1 over 12.'
        write: '$= \dfrac{3}{4} + \dfrac{1}{6} - \dfrac{1}{12}$'
        point:
          - {line: 0, kind: highlight, text: 'given'}
      - say: 'The L.C.M. of 4, 6 and 12 is 12. 3 over 4 is 9 over 12, and 1 over 6 is 2 over 12.'
        write: '$= \dfrac{9}{12} + \dfrac{2}{12} - \dfrac{1}{12}$'
      - say: '9 plus 2 is 11, and 11 minus 1 is 10. So we have 10 over 12.'
        write: '$= \dfrac{9 + 2 - 1}{12} = \dfrac{10}{12}$'
      - say: 'Divide the top and the bottom by 2. That gives 5 over 6.'
        write: '$= \dfrac{5}{6}$'
        diagram_do:
          - {id: v, op: shade, part: 'P∪Q', text: 'P ∪ Q = 5/6'}
      - section: 'Check'
        say: 'To check, P or Q must be at least the bigger one, 3 over 4, which is 0.75, and at most 1. 5 over 6 is about 0.83, so it fits.'
        write: 'Check: $0.75 \le \dfrac{5}{6} \approx 0.83 \le 1\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the probability of $P$ or $Q$ is 5 over 6, and that is option C.'
        write: '$\therefore P(P \cup Q) = \dfrac{5}{6}$'
        answer: true
    traps:
      A: 'You went for 1 over 96. That multiplies all three probabilities. For "P or Q" the addition rule adds and then subtracts the overlap, giving 9 over 12, plus 2 over 12, minus 1 over 12.'
      B: 'You went for 1 over 8. That is 3 over 4 times 1 over 6, which would be "both" for independent events. For "or", use the addition rule to get 5 over 6.'
      D: 'You went for 11 over 12. That adds P of P and P of Q but forgets to subtract the overlap, which was counted twice. Take off 1 over 12 to get 10 over 12, which is 5 over 6.'
  49:
    moments:
      - section: 'The question'
        say: 'Five people stand in a row for a group photograph, and a married couple insist on being next to each other. How many arrangements are there?'
        write: 'Five in a row; the couple side by side'
        doodle: {name: 'custom:1992_q49_a', id: photo, caption: 'the couple, treated as one unit', size: scene}
      - say: 'Solution. Treat the couple as one unit. Then arrange the units, and after that arrange the couple inside their unit.'
        write: 'Solution: treat the couple as one unit'
        doodle_do:
          - {id: photo, op: circle, part: couple}
      - say: 'Take out the 2 people of the couple and put them back as 1 unit. That leaves 3 other people plus the couple, which makes 4 units.'
        write: 'Units $= 3 + 1 = 4$'
        doodle_do:
          - {id: photo, op: highlight, part: units}
      - section: 'Arrange the units'
        say: 'n different things in a row can be arranged in n factorial ways. So 4 units can be arranged in 4 factorial ways.'
        write: 'Units in a row: $4!$ ways'
      - say: '4 factorial is 4 times 3 times 2 times 1, which is 24.'
        write: '$4! = 4 \times 3 \times 2 \times 1 = 24$'
      - section: 'Arrange the couple'
        say: 'Inside their unit, the 2 can stand in 2 factorial ways, with the husband on the left, or the wife on the left.'
        write: '$2! = 2 \times 1 = 2$'
        doodle_do:
          - {id: photo, op: stage, stage: 'custom:1992_q49_a2'}
      - section: 'Total'
        say: 'Every arrangement of the units goes with every order of the couple, so multiply, and we get 4 factorial times 2 factorial.'
        write: 'Number of arrangements $= 4! \times 2!$'
      - say: '24 times 2 is 48.'
        write: '$= 24 \times 2 = 48$'
        doodle_do:
          - {id: photo, op: label, part: swap, text: '24 × 2 = 48'}
        point:
          - {line: 7, kind: move, from: {line: 4, at: '= 24'}, at: '= 24', text: '4!'}
          - {line: 7, kind: move, from: {line: 5, at: '1 = [[2]]'}, at: '× 2', text: '2!'}
      - section: 'Check'
        say: 'To check, with no condition, 5 people give 5 factorial, which is 120 arrangements. Our 48 is part of those 120, as it must be.'
        write: 'Check: $5! = 120$, $\ 48 < 120\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore there are 48 arrangements, which is option A.'
        write: '$\therefore$ 48 arrangements'
        answer: true
    traps:
      B: 'You went for 24. That is 4 factorial for the units, but it forgets that the couple can swap places inside their unit. Multiply by 2 factorial to get 48.'
      C: 'You went for 20. Treat the couple as one unit. Then 4 units give 4 factorial, which is 24, and the couple''s 2 factorial orders double it to 48.'
      D: 'You went for 10. The arrangements are 4 factorial for the units, 24, times 2 factorial for the couple, which is 48.'
  50:
    moments:
      - section: 'The question'
        say: 'A student takes 5 courses from 4 Mathematics and 3 Physics courses, so picture them as books on a shelf. In how many ways can he choose, with exactly 2 Physics courses?'
        write: '5 courses from 4 Maths, 3 Physics; exactly 2 Physics'
        doodle: {name: 'custom:1992_q50_a', id: books, caption: '4 Maths, 3 Physics; choose 5'}
      - say: 'Solution. He takes 5 courses and exactly 2 are Physics, so 5 minus 2, which is 3, are Mathematics.'
        write: 'Solution: Physics $2$, Maths $5 - 2 = 3$'
        doodle_do:
          - {id: books, op: stage, stage: 'custom:1992_q50_a2'}
      - say: 'Choosing courses is a selection, so order does not matter. So we use combinations. n C r is n factorial over n minus r factorial, times r factorial.'
        write: '${}^{n}C_{r} = \dfrac{n!}{(n - r)!\,r!}$'
      - section: 'Physics: 2 from 3'
        say: 'For Physics, choose 2 from 3. That is 3 C 2, which is 3 factorial over 3 minus 2 factorial, times 2 factorial.'
        write: '${}^{3}C_{2} = \dfrac{3!}{(3 - 2)!\,2!} = \dfrac{3!}{1!\,2!}$'
      - say: 'Expand 3 factorial only down to 2 factorial, as 3 times 2 factorial. The 2 factorials cancel, leaving 3.'
        write: '$= \dfrac{3 \times 2!}{1 \times 2!} = 3$'
        doodle_do:
          - {id: books, op: label, part: pickp, text: '3 ways'}
      - section: 'Maths: 3 from 4'
        say: 'For Mathematics, choose 3 from 4. That is 4 C 3, which is 4 factorial over 4 minus 3 factorial, times 3 factorial.'
        write: '${}^{4}C_{3} = \dfrac{4!}{(4 - 3)!\,3!} = \dfrac{4!}{1!\,3!}$'
      - say: '4 factorial is 4 times 3 factorial. The 3 factorials cancel, leaving 4.'
        write: '$= \dfrac{4 \times 3!}{1 \times 3!} = 4$'
        doodle_do:
          - {id: books, op: label, part: pickm, text: '4 ways'}
      - section: 'Both together'
        say: 'He chooses the Physics AND the Maths, so multiply, because every Physics pair goes with every set of three Maths courses.'
        write: 'Number of ways $= {}^{3}C_{2} \times {}^{4}C_{3}$'
      - say: '3 times 4 is 12.'
        write: '$= 3 \times 4 = 12$'
        point:
          - {line: 8, kind: move, from: {line: 4, at: '= 3'}, at: '[[3]] × 4', text: 'Physics'}
          - {line: 8, kind: move, from: {line: 6, at: '= 4'}, at: '3 × [[4]]', text: 'Maths'}
      - section: 'Check'
        say: 'Check the Physics count by listing. Call the courses $P_1$, $P_2$ and $P_3$, and the pairs are $P_1 P_2$, $P_1 P_3$ and $P_2 P_3$. That is 3.'
        write: 'Check: $P_{1}P_{2},\ P_{1}P_{3},\ P_{2}P_{3} \to 3\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore he can choose his courses in 12 ways, which is option B.'
        write: '$\therefore$ 12 ways'
        answer: true
    traps:
      A: 'You went for 11. The Physics choices are 3 C 2, which is 3, and the Maths choices are 4 C 3, which is 4. He makes both choices, so multiply, and 3 times 4 is 12.'
