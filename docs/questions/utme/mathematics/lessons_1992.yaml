  14:
    moments:
      - say: 'We''re told that $x$ plus 1 is a factor of $x$ cubed plus $3x$ squared plus $kx$ plus 4, and we want $k$.'
        write: '$f(x) = x^{3} + 3x^{2} + kx + 4$'
      - say: 'The factor theorem says: if $x$ minus $c$ is a factor of $f(x)$, then $f(c)$ is zero. Putting that value in makes the whole polynomial vanish.'
        write: 'Factor theorem: $x - c$ is a factor $\Rightarrow f(c) = 0$'
      - say: 'Here the factor is $x$ plus 1, which is $x$ minus negative 1. So the value to put in is negative 1, not positive 1.'
        write: 'From $x + 1 = 0$: $x = -1$'
      - say: 'So we put negative 1 in place of every $x$.'
        write: '$f(-1) = (-1)^{3} + 3(-1)^{2} + k(-1) + 4$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '= [[−1]]'}, at: '= [[(−1)]]3', text: 'sub in'}
      - say: 'Negative 1 cubed is negative 1 times negative 1 times negative 1, which is negative 1. An odd power of a negative stays negative.'
        write: '$(-1)^{3} = -1$'
      - say: 'Negative 1 squared is positive 1, so 3 times that is 3.'
        write: '$3(-1)^{2} = 3 \times 1 = 3$'
      - say: '$k$ times negative 1 is negative $k$. And the 4 stays as it is.'
        write: '$k(-1) = -k$'
      - say: 'Now put those three pieces back into $f(-1)$: negative 1, plus 3, minus $k$, plus 4.'
        write: '$f(-1) = -1 + 3 - k + 4$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '= −1'}, at: '= [[−1]] +', text: 'cubed'}
          - {line: 7, kind: move, from: {line: 5, at: '1 = [[3]]'}, at: '+ 3', text: 'squared'}
          - {line: 7, kind: move, from: {line: 6, at: '−k'}, at: '− k'}
      - say: 'Negative 1 plus 3 is 2, and 2 plus 4 is 6. So we have 6 minus $k$.'
        write: '$= 6 - k$'
      - say: 'Since $x$ plus 1 is a factor, the factor theorem says $f(-1)$ must be zero.'
