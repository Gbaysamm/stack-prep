        write: '$t = \tfrac{1}{a}\left[-u \pm \sqrt{u^{2} + 2as}\right]$'
        answer: true
    traps:
      A: 'You went for option A. Two signs are off. The formula starts with negative $B$, so it''s negative $u$; and because $C$ is negative $2s$, the root holds $u$ squared plus $2as$.'
      B: 'You went for option B. The negative $u$ is right, but the sign under the root isn''t. 4 times $a$ times negative $2s$ is negative $8as$, and subtracting that makes it plus.'
