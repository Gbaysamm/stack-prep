      B: 'You went for 24. That arranges the 4 units but forgets that the couple can swap places inside their unit. Multiply by 2 to get 48.'
      C: 'You went for 20. Tie the couple into one unit to get 4 units: 4 factorial is 24, and doubling for the couple''s two orders gives 48.'
      D: 'You went for 10. The arrangements are 4 factorial for the units, which is 24, times 2 for the couple, which is 48.'
