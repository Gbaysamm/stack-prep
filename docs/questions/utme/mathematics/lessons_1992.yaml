      - say: 'Let''s check. $m$ star zero is $m$ times zero, plus $m$, plus zero. That''s just $m$: what goes into the machine comes out.'
        write: '$m * 0 = 0 + m + 0 = m\ \checkmark$'
        doodle_do:
          - {id: machine, op: circle, part: output}
      - say: 'And the other way: zero star $m$ is zero plus zero plus $m$, which is $m$ too.'
        write: '$0 * m = 0 + 0 + m = m\ \checkmark$'
