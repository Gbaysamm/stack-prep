        doodle: {name: 'custom:1992_q25_a', id: paper, caption: 'a paper quadrilateral, corners coloured'}
      - section: 'Solution'
        say: 'Solution. Let me draw the quadrilateral $ABCD$ with its four angles. The right angle is at $D$.'
