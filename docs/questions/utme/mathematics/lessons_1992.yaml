      - say: 'Divide both sides by 0.01, which is the same as multiplying by 100. 1.60 times 100 is 160.'
        write: '$x = \dfrac{1.60}{0.01} = 160$'
      - say: 'Let''s check. ₦160 at 5% is 0.05 times 160, which is ₦8.'
