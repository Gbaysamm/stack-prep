      - say: 'Next, the radius. A circle of latitude gets smaller as you move away from the equator: compare the two hoops. At latitude $\theta$ its radius is $R$ cos $\theta$, where $R$ is the earth''s radius.'
        write: 'Radius of the latitude circle: $r = R\cos\theta$'
        doodle_do:
          - {id: globe, op: stage, stage: 'custom:1992_q27_a2'}
        point:
          - {figure: sketch, kind: highlight, target: CP}
          - {figure: sketch, kind: highlight, target: OP}
      - say: 'We take the earth''s radius $R$ as 6400 kilometres, and $\theta$ is 60 degrees.'
        write: '$r = 6400 \cos 60^{\circ}$'
        point:
          - {line: 4, kind: box, text: 'the rule'}
          - {figure: sketch, kind: circle, target: '60°', text: 'θ'}
      - say: 'Cos 60 degrees is a half, and half of 6400 is 3200: the small hoop is half the size of the equator.'
        write: '$= 6400 \times \dfrac{1}{2} = 3200\text{ km}$'
        doodle_do:
          - {id: globe, op: label, part: small-hoop, text: '3200 km'}
        point:
          - {figure: sketch, kind: label, target: r, text: '3200 km'}
          - {line: 6, kind: highlight, at: '3200', to: {doodle: globe, part: small-hoop}}
      - say: 'The arc length is the angle over 360, times the full way round the circle, which is 2 pi $r$.'
        write: 'Arc length $= \dfrac{\text{angle}}{360^{\circ}} \times 2\pi r$'
        point:
          - {figure: 'sketch', kind: 'circle', target: 'arc PQ = ?', text: 'arc = angle/360 × 2πr'}
      - say: 'Put in the 45 degrees and the radius of 3200 that we just found.'
        write: '$= \dfrac{45}{360} \times 2\pi \times 3200$'
        point:
          - {line: 8, kind: move, from: {line: 3, at: '= [[45∘]]'}, at: '45', text: 'angle'}
          - {line: 8, kind: move, from: {line: 6, at: '3200'}, at: '3200', text: 'radius'}
          - {figure: 'sketch', kind: 'circle', target: '45°'}
      - say: '45 over 360 is 1 over 8, since 8 times 45 is 360.'
        write: '$= \dfrac{1}{8} \times 2\pi \times 3200$'
      - say: '2 pi times 3200 is 6400 pi. That is the full way round this circle of latitude.'
        write: '$= \dfrac{1}{8} \times 6400\pi$'
      - say: '6400 divided by 8 is 800, so we get 800 pi.'
        write: '$= 800\pi$'
      - say: 'So the plane flies 800 pi kilometres from $P$ to $Q$, which is answer choice C.'
        write: 'Distance $= 800\pi$ km'
        doodle_do:
          - {id: globe, op: move, part: plane, path: fly}
          - {id: globe, op: label, part: plane, text: '800π km'}
        point:
          - {figure: sketch, kind: label, target: 'arc PQ = ?', text: '800π km'}
        answer: true
    traps:
      A: 'You went for 800 pi over 9. The longitude difference is 45 degrees, which is 1 over 8 of the circle, and 1 over 8 of 6400 pi is 800 pi. There''s no division by 9.'
      B: 'You went for the option with root 3 over 9. The root 3 comes from using sin 60 instead of cos 60. The circle of latitude has radius $R$ cos 60, which is 3200.'
      D: 'You went for 800 root 3 $\pi$. That uses sin 60 in place of cos 60. Circles of latitude shrink by the cosine: 6400 times a half is 3200, giving 800 $\pi$.'
  28:
    moments:
      - say: 'In the diagram, $FG$ is parallel to $KM$. The path goes from $G$ to $H$ to $K$. Angle $FGH$ is 24 degrees and angle $HKM$ is 109 degrees. We want $x$, the angle at $H$.'
        write: '$FG \parallel KM$'
        point:
          - {figure: 0, kind: highlight, target: FG}
          - {figure: 0, kind: highlight, target: KM}
      - say: 'Here''s the trick for a bend between parallel lines: draw a line through $H$ parallel to both. It splits $x$ into two pieces, one on each side of the new line.'
        write: 'Draw a line through $H$ parallel to $FG$ and $KM$'
        point:
          - {figure: 0, kind: circle, target: H}
      - say: 'First piece: the part of $x$ between $HG$ and the downward direction of the new line. With $GH$ as the transversal, it is alternate to angle $FGH$, so it is 24 degrees.'
        write: 'Alternate angles: piece 1 $= \angle FGH = 24^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: FGH, text: '24°'}
      - say: 'Second piece: the part of $x$ between $HK$ and that same downward direction. For this one, we use $HK$ as the transversal.'
        write: 'Piece 2: use the transversal $HK$'
        point:
          - {figure: 0, kind: highlight, target: HK}
      - say: 'At $K$, angle $HKM$ is 109 degrees, between $KH$ and $KM$, which points down. Its alternate angle at $H$ is between $HK$ and the upward direction, so that is 109 too.'
        write: 'Angle between $HK$ and upward at $H = 109^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: HKM, text: '109°'}
      - say: 'Up and down make a straight line, 180 degrees. So measured from the downward direction, $HK$ is 180 minus 109, which is 71 degrees.'
        write: 'Piece 2 $= 180^{\circ} - 109^{\circ} = 71^{\circ}$'
        point:
          - {figure: 0, kind: 'circle', target: '109°', text: '180 − 109 = 71°'}
      - say: 'The two pieces sit on either side of the downward line, and together they make up $x$.'
        write: '$x = \text{piece 1} + \text{piece 2}$'
        point:
          - {figure: 0, kind: 'circle', target: 'x', text: '24° + 71°'}
      - say: 'Piece 1 is the 24 we found first, and piece 2 is the 71. 24 plus 71 is 95.'
        write: '$= 24^{\circ} + 71^{\circ} = 95^{\circ}$'
        point:
          - {line: 7, kind: move, from: {line: 2, at: '24∘'}, at: '24∘', text: 'piece 1'}
          - {line: 7, kind: move, from: {line: 5, at: '71∘'}, at: '71∘', text: 'piece 2'}
          - {figure: 0, kind: arc, target: GHK, text: 'x = 95°'}
      - say: 'Putting both steps into one rule: $x$ is angle $FGH$, plus 180 minus angle $HKM$.'
        write: 'One rule: $x = \angle FGH + (180^{\circ} - \angle HKM)$'
        point:
          - {figure: 0, kind: 'circle', target: '24°'}
          - {figure: 0, kind: 'circle', target: '109°'}
      - say: 'Check it: 24 plus 180 is 204, and 204 minus 109 is 95. The same answer.'
        write: '$= 24^{\circ} + 180^{\circ} - 109^{\circ} = 95^{\circ}\ \checkmark$'
      - say: 'So $x$ is 95 degrees, which is answer choice B.'
        write: '$x = 95^{\circ}$'
        answer: true
    traps:
      A: 'You went for 75 degrees. Split $x$ with a line through $H$ parallel to $FG$: the pieces are 24 and 180 minus 109, which is 71. Together that''s 95.'
      C: 'You went for 105 degrees. That would need 34 degrees at $G$, but the figure gives 24. The pieces are 24 and 71, making 95.'
      D: 'You went for 125 degrees. That is too big. Piece 1 is 24, and piece 2 is 180 minus 109, which is 71, so $x$ is 24 plus 71, which is 95.'
  29:
    moments:
      - section: 'The question'
        say: 'Three points on a coast and a bearing to find. One right angle and one sine ratio settle it. Here is the sketch, with a North line at the points.'
        write: '$|YZ| = 6$ km (due south of $Y$), $\ |XZ| = 12$ km'
        show_sketch: true
        point:
          - {figure: sketch, kind: highlight, target: '6 km', text: 'YZ'}
          - {figure: sketch, kind: highlight, target: '12 km', text: 'XZ'}
      - section: 'Solution'
        say: 'Solution. $X$ is due east of $Y$, and $Z$ is due south of $Y$. East and south are at right angles, so the angle at $Y$ is 90 degrees.'
        write: 'Solution: $\ \angle XYZ = 90^{\circ}$ (east and south)'
        point:
          - {figure: sketch, kind: arc, target: XYZ, text: '90°'}
      - say: 'A bearing is measured clockwise from North, in three figures. The bearing of $Z$ from $X$ is measured at $X$, the point after the word from.'
        write: 'Bearing of $Z$ from $X$: at $X$, clockwise from N'
        point:
          - {figure: sketch, kind: circle, target: X, text: 'measure here'}
      - say: 'Let theta be the angle $YXZ$, the angle at $X$ inside the triangle.'
        write: 'Let $\theta = \angle YXZ$'
        point:
          - {figure: sketch, kind: arc, target: YXZ, text: 'θ'}
      - say: 'From $X$, the side $YZ$ is opposite theta, and $XZ$ is the hypotenuse. Opposite and hypotenuse: SOH, so we use sine.'
        write: '$\sin\theta = \dfrac{\text{opp}}{\text{hyp}}$ (SOH)'
        point:
          - {figure: sketch, kind: highlight, target: YZ, text: 'opp'}
          - {figure: sketch, kind: highlight, target: XZ, text: 'hyp'}
      - say: 'Substitute: the opposite is 6 and the hypotenuse is 12. 6 over 12 is 0.5.'
        write: '$\sin\theta = \dfrac{6}{12} = 0.5$'
        point:
          - {line: 5, kind: move, from: {line: 0, at: '= 6'}, at: '12[[6]]', text: 'opp'}
          - {line: 5, kind: move, from: {line: 0, at: '= 12'}, at: '[[12]]6', text: 'hyp'}
      - say: 'The angle whose sine is 0.5 is 30 degrees, because sine 30 is a half.'
        write: '$\theta = \sin^{-1} 0.5 = 30^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: YXZ, text: '30°'}
      - section: 'The bearing'
        say: 'Now the North line at $X$. Clockwise from North, East is 090, South is 180 and West is 270. $Y$ is due west of $X$.'
        write: 'Bearing of $Y$ from $X = 270^{\circ}$ (due west)'
        doodle: {name: 'custom:1992_q29_a', id: compass, caption: 'the compass at X'}
        doodle_do:
          - {id: compass, op: label, part: toy, text: '270°'}
        point:
          - {figure: sketch, kind: highlight, target: XY, text: 'due west, 270°'}
      - say: '$Z$ is on the south side of the line $XY$. So, turning clockwise from North, we stop theta short of West. Subtract theta.'
        write: 'Bearing of $Z$ from $X = 270^{\circ} - \theta$'
      - say: '270 minus 30 is 240.'
        write: '$= 270^{\circ} - 30^{\circ}$'
        point:
          - {line: 9, kind: move, from: {line: 6, at: '= [[30∘]]'}, at: '− [[30∘]]', text: 'θ'}
      - say: 'Therefore the bearing of $Z$ from $X$ is 240 degrees. It is already three figures.'
        write: '$\therefore$ Bearing of $Z$ from $X = 240^{\circ}$'
        doodle_do:
          - {id: compass, op: stage, stage: 'custom:1992_q29_a2'}
          - {id: compass, op: label, part: toz, text: '240°'}
        point:
          - {figure: sketch, kind: label, target: '?', text: '240°'}
      - section: 'Check'
        say: 'Check with the back bearing. At $Z$, the North line runs along $ZY$. Angles in a triangle add up to 180, so the angle $YZX$ is 180 minus 90 minus 30.'
        write: 'Check: $\angle YZX = 180^{\circ} - 90^{\circ} - 30^{\circ} = 60^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: YZX, text: '60°'}
      - say: 'So the bearing of $X$ from $Z$ is 060. A back bearing differs by 180: 060 plus 180 is 240. It agrees.'
        write: '$060^{\circ} + 180^{\circ} = 240^{\circ}\ \checkmark$'
      - section: 'Answer'
        say: 'So the bearing of $Z$ from $X$ is 240 degrees, which is option A.'
        write: '$\therefore$ Bearing $= 240^{\circ}$'
        answer: true
        doodle_do:
          - {id: compass, op: circle, part: north}
        point:
          - {figure: sketch, kind: circle, target: '?', text: '240°'}
          - {line: 13, kind: highlight, at: '240', to: {doodle: compass, part: toz}}
    traps:
      B: 'You went for 210 degrees. That is 180 plus 30, turning the 30 degrees from South. But theta is the angle at $X$ from the line $XY$, which points West, so the bearing is 270 minus 30, which is 240.'
      C: 'You went for 150 degrees. That points south-east of $X$, but $Z$ is south-west of $X$, so its bearing is between 180 and 270. It is 270 minus 30, which is 240.'
      D: 'You went for 60 degrees. That is the bearing of $X$ from $Z$, the back bearing. "From $X$" means we stand at $X$: 060 plus 180 is 240.'
  30:
    moments:
      - say: 'The diagram is a circle with centre $O$ and two perpendicular radii of 6 centimetres. We want the area of the shaded part, between the chord and the arc.'
        write: '$r = 6\text{ cm}$'
        point:
          - {figure: 0, kind: 'circle', target: 'O', text: 'centre'}
          - {figure: 0, kind: 'circle', target: {x: 180, y: 70}, text: 'shaded'}
      - say: 'That shaded piece, between a chord and its arc, is called a segment. Its area is the sector, the slice of the circle, minus the triangle inside the slice.'
        write: 'Segment $=$ sector $-$ triangle'
        point:
          - {figure: 0, kind: 'circle', target: {x: 180, y: 70}, text: 'segment'}
      - say: 'The two radii are at right angles, so the sector''s angle is 90 degrees. 90 over 360 is a quarter, so the sector is a quarter of the circle.'
        write: 'Sector angle $= 90^{\circ}$, so sector $= \dfrac{90}{360} = \dfrac{1}{4}$ of the circle'
        point:
          - {figure: 0, kind: label, target: O, text: '90°'}
      - say: 'The whole circle has area pi $r$ squared. The radius is 6, and 6 squared is 36, so that is 36 pi.'
        write: 'Circle $= \pi r^{2} = \pi(6)^{2} = 36\pi$'
        point:
          - {figure: 0, kind: 'circle', target: {x: 88, y: 80}, text: 'r = 6'}
      - say: 'A quarter of 36 pi is 9 pi.'
        write: 'Sector $= \dfrac{1}{4} \times 36\pi = 9\pi$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '36π'}, at: '36π'}
      - say: 'Now the triangle. It has a right angle at the centre, and both short sides are radii of 6. So its area is a half, times base 6, times height 6.'
        write: 'Triangle $= \dfrac{1}{2} \times \text{base} \times \text{height} = \dfrac{1}{2} \times 6 \times 6$'
        point:
          - {figure: 0, kind: 'circle', target: {x: 127, y: 118}, text: 'right angle'}
      - say: '6 times 6 is 36, and half of 36 is 18.'
        write: '$= \dfrac{1}{2} \times 36 = 18$'
      - say: 'Now go back to segment equals sector minus triangle. The sector is 9 pi and the triangle is 18.'
        write: 'Segment $= 9\pi - 18$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '= [[9π]]'}, at: '9π', text: 'sector'}
          - {line: 7, kind: move, from: {line: 6, at: '= [[18]]'}, at: '18', text: 'triangle'}
          - {figure: 0, kind: 'circle', target: {x: 180, y: 70}, text: '9π − 18'}
      - say: '9 goes into both terms, since 18 is 9 times 2. So take out the 9 as a common factor.'
        write: '$= 9\pi - 9 \times 2 = 9(\pi - 2)$'
      - say: 'As a check, 9 pi is about 28.3, and 28.3 minus 18 is about 10.3. That is sensibly smaller than the quarter circle it sits inside.'
        write: 'Check: $9\pi - 18 \approx 28.3 - 18 = 10.3$'
      - say: 'So the shaded area is 9 times pi minus 2, square centimetres, which is answer choice B.'
        write: 'Shaded area $= 9(\pi - 2)\ \text{cm}^{2}$'
        answer: true
        point:
          - {figure: 0, kind: 'label', target: {x: 180, y: 70}, text: '9(π − 2) cm²'}
    traps:
      A: 'You went for 9 pi. That''s the whole quarter sector, with the triangle still in it. The shaded part is bounded by the chord, so subtract the triangle of 18.'
      C: 'You went for 18 pi. That''s half the circle. The two radii make a quarter, which is 9 pi, and then you subtract the triangle of 18.'
      D: 'You went for 36 pi. That''s the area of the whole circle. The shaded segment is a quarter of it, 9 pi, minus the triangle of 18.'
  31:
    moments:
      - say: 'We want the locus of a point that is the same distance from two fixed points. A locus is simply the path traced by all the points that obey a rule.'
        write: 'Locus: all points the same distance from two fixed points'
      - say: 'Let me draw the two fixed points, and a point the same distance from both.'
        show_sketch: true
      - say: 'Let''s call the fixed points $A$ and $B$: picture two houses. The rule is that a point $X$ is as far from $A$ as it is from $B$.'
        write: 'Rule: $XA = XB$'
        doodle: {name: 'custom:1992_q31_a', id: village, caption: 'who stands as far from A as from B?', size: scene}
        point:
          - {figure: sketch, kind: highlight, target: XA}
          - {figure: sketch, kind: highlight, target: XB}
      - say: 'One point obviously works: the midpoint $M$ of $AB$, the villager halfway along the path. It is the same distance from each end.'
        write: 'Midpoint $M$: $MA = MB$'
        doodle_do:
          - {id: village, op: circle, part: mid}
        point:
          - {figure: sketch, kind: circle, target: M, text: 'midpoint'}
      - say: 'Now take any other point $X$ that obeys the rule, like this villager further up, and join it to $M$. Look at the two triangles this makes, $XMA$ and $XMB$.'
        write: 'Compare $\triangle XMA$ and $\triangle XMB$'
        doodle_do:
          - {id: village, op: stage, stage: 'custom:1992_q31_a2'}
        point:
          - {figure: 'sketch', kind: 'highlight', target: 'XM', text: 'join to M'}
      - say: '$XA$ equals $XB$ by the rule. $MA$ equals $MB$, since $M$ is the midpoint. And the side $XM$ is shared by both.'
        write: '$XA = XB,\quad MA = MB,\quad XM = XM$'
        point:
          - {figure: sketch, kind: underline, target: MA}
          - {figure: sketch, kind: underline, target: MB}
          - {figure: sketch, kind: highlight, target: XM, text: 'shared'}
      - say: 'Three pairs of equal sides, so the two triangles are congruent: exactly the same shape and size.'
        write: '$\triangle XMA \equiv \triangle XMB$'
      - say: 'So the angles at $M$ are equal. And those two angles sit side by side on the straight line $AB$, so together they make 180 degrees.'
        write: '$\angle XMA = \angle XMB,\quad \angle XMA + \angle XMB = 180^{\circ}$'
        point:
          - {figure: 'sketch', kind: 'arc', target: 'XMA'}
          - {figure: 'sketch', kind: 'arc', target: 'XMB'}
          - {figure: 'sketch', kind: 'highlight', target: 'AB', text: 'straight line'}
      - say: 'Two equal angles adding to 180 means each one is 180 divided by 2, which is 90 degrees.'
        write: '$\angle XMA = \angle XMB = \dfrac{180^{\circ}}{2} = 90^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: XMA, text: '90°'}
      - say: 'So every such point lies on the line through the midpoint of $AB$, at right angles to $AB$: all the villagers stand on one straight line. That line cuts $AB$ in half at right angles; it is called the perpendicular bisector.'
        write: 'Line through $M$ at $90^{\circ}$ to $AB$ $=$ perpendicular bisector'
        doodle_do:
          - {id: village, op: stage, stage: 'custom:1992_q31_a3'}
        point:
          - {figure: sketch, kind: circle, target: locus, text: 'perpendicular bisector'}
      - say: 'And it works the other way too: any point on that line makes two congruent triangles, so it is equally far from $A$ and $B$.'
        write: 'Any point on it: $XA = XB$'
        point:
          - {figure: 'sketch', kind: 'circle', target: 'locus', text: 'XA = XB'}
      - say: 'So the locus is the perpendicular bisector of the line joining the two points, which is answer choice A.'
        write: 'Locus $=$ perpendicular bisector of $AB$'
        answer: true
        point:
          - {figure: 'sketch', kind: 'circle', target: 'locus', text: 'perpendicular bisector'}
    traps:
      B: 'You went for a parallel line. A point on a line parallel to $AB$ is usually much nearer one end than the other. Equal distances from two points puts you on the perpendicular bisector.'
      C: 'You went for a transverse line. Just crossing the line $AB$ isn''t enough; it must cross at the midpoint and at right angles. That''s the perpendicular bisector.'
      D: 'You went for an angle bisector with the horizontal. The locus has nothing to do with the horizontal. It depends only on the two points: it''s the perpendicular bisector of the line joining them.'
  32:
    moments:
      - say: 'We want the perpendicular distance from the point 2, 3 to the line $2x$ minus $4y$ plus 3 equals zero.'
        write: '$(2,\ 3),\quad 2x - 4y + 3 = 0$'
      - say: 'Let me draw the line and the point 2, 3 on the axes.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'P', text: '(2, 3)'}
          - {figure: sketch, kind: underline, target: '2x − 4y + 3 = 0'}
          - {figure: sketch, kind: circle, target: 'd = ?', text: 'distance'}
      - say: 'There''s a formula for exactly this. For a point $x_1$, $y_1$ and a line $Ax$ plus $By$ plus $C$ equals zero, the distance is the modulus of $Ax_1$ plus $By_1$ plus $C$, over root of $A$ squared plus $B$ squared.'
        write: 'Distance formula: $d = \dfrac{\left|Ax_{1} + By_{1} + C\right|}{\sqrt{A^{2} + B^{2}}}$'
      - say: 'Read off the values. From the line, $A$ is 2, $B$ is negative 4 and $C$ is 3. From the point, $x_1$ is 2 and $y_1$ is 3.'
        write: '$A = 2,\ B = -4,\ C = 3,\ x_{1} = 2,\ y_{1} = 3$'
      - say: 'Start with the top: put the point into the left side of the line''s equation.'
        write: 'Top: $Ax_{1} + By_{1} + C = 2(2) + (-4)(3) + 3$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
      - say: '2 times 2 is 4, and negative 4 times 3 is negative 12. So it is 4 minus 12 plus 3. 4 minus 12 is negative 8, and negative 8 plus 3 is negative 5.'
        write: '$= 4 - 12 + 3 = -5$'
      - say: 'The modulus bars make it positive, because a distance can''t be negative. So the top is 5.'
        write: 'Modulus: $|-5| = 5$'
      - say: 'Now the bottom: the root of $A$ squared plus $B$ squared, with $A$ as 2 and $B$ as negative 4.'
        write: 'Bottom: $\sqrt{A^{2} + B^{2}} = \sqrt{2^{2} + (-4)^{2}}$'
      - say: '2 squared is 4, and negative 4 squared is 16. 4 plus 16 is 20.'
        write: '$= \sqrt{4 + 16} = \sqrt{20}$'
      - say: '20 is 4 times 5, and root 4 is 2, so root 20 is 2 root 5.'
        write: '$= \sqrt{4 \times 5} = 2\sqrt{5}$'
      - say: 'Now put the top, 5, over the bottom, 2 root 5.'
        write: '$d = \dfrac{5}{2\sqrt{5}}$'
        point:
          - {line: 10, kind: move, from: {line: 6, at: '= [[5]]'}, at: '25[[5]]', text: 'top'}
          - {line: 10, kind: move, from: {line: 9, at: '= [[25]]'}, at: '[[25]]5', text: 'bottom'}
          - {figure: sketch, kind: highlight, target: 'PN', text: 'd'}
      - say: 'Rationalise: multiply top and bottom by root 5. Root 5 times root 5 is 5.'
        write: '$= \dfrac{5 \times \sqrt{5}}{2\sqrt{5} \times \sqrt{5}} = \dfrac{5\sqrt{5}}{2 \times 5}$'
      - say: '2 times 5 is 10. And 5 over 10 is a half, so we get root 5 over 2.'
        write: '$= \dfrac{5\sqrt{5}}{10} = \dfrac{\sqrt{5}}{2}$'
      - say: 'So the distance is root 5 over 2, which is answer choice A.'
        write: '$d = \dfrac{\sqrt{5}}{2}$'
        answer: true
        point:
          - {figure: sketch, kind: circle, target: 'd = ?', text: '√5/2'}
    traps:
      B: 'You went for negative root 5 over 20. A distance can never be negative, and the modulus removes the sign. The top is 5, the bottom is 2 root 5, which gives root 5 over 2.'
      C: 'You went for negative 5 over root 13. The root 13 comes from 2 squared plus 3 squared, using the point instead of the line. The bottom uses the line''s coefficients: root of 4 plus 16.'
      D: 'You went for 0. That would mean the point is on the line, but 2 times 2 minus 4 times 3 plus 3 is negative 5, not zero. The distance is root 5 over 2.'
  33:
    moments:
      - say: 'We want the equation of the line through 5, 7 that is parallel to $7x$ plus $5y$ equals 12.'
        write: '$(5,\ 7),\quad 7x + 5y = 12$'
      - say: 'Let me draw the given line, and the point 5, 7 on the axes.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '7x + 5y = 12', text: 'given line'}
          - {figure: sketch, kind: circle, target: 'P', text: '(5, 7)'}
      - say: 'Parallel lines have the same gradient, the same steepness. So let''s find the gradient of the given line by making $y$ the subject.'
        write: 'Parallel lines: same gradient'
      - say: 'Start from $7x$ plus $5y$ equals 12, and subtract $7x$ from both sides.'
        write: 'From $7x + 5y = 12$: $5y = -7x + 12$'
        point:
          - {line: 3, kind: move, from: {line: 3, at: '[[7x]] + 5y'}, at: '−7x', text: 'across the ='}
      - say: 'Divide every term by 5.'
        write: '$y = -\dfrac{7}{5}x + \dfrac{12}{5}$'
      - say: 'The number in front of $x$ is the gradient: negative 7 over 5. Notice it depends only on the 7 and the 5, not on the 12.'
        write: 'Gradient $m = -\dfrac{7}{5}$'
      - say: 'So a parallel line keeps $7x$ plus $5y$ exactly as it is; only the constant on the right changes. Let''s call the new constant $k$.'
        write: 'Parallel line: $7x + 5y = k$'
        point:
          - {figure: sketch, kind: circle, target: 'parallel line = ?', text: '7x + 5y = k'}
      - say: 'Our line must pass through the point 5, 7, so put $x$ as 5 and $y$ as 7.'
        write: '$7(5) + 5(7) = k$'
        point:
          - {line: 7, kind: move, from: {line: 0, at: '([[5]], 7)'}, at: '7([[5]])', text: 'x = 5'}
          - {line: 7, kind: move, from: {line: 0, at: '(5, [[7]])'}, at: '5([[7]])', text: 'y = 7'}
      - say: '7 times 5 is 35, and 5 times 7 is 35.'
        write: '$35 + 35 = k$'
      - say: '35 plus 35 is 70, so $k$ is 70.'
        write: '$k = 70$'
      - say: 'So the line is $7x$ plus $5y$ equals 70. Check: it keeps the 7 and the 5, so it is parallel, and the point 5, 7 gives 35 plus 35, which is 70.'
        write: 'Check: $7(5) + 5(7) = 70\ \checkmark$'
      - say: 'The equation is $7x$ plus $5y$ equals 70, which is answer choice B.'
        write: '$7x + 5y = 70$'
        answer: true
        point:
          - {figure: sketch, kind: circle, target: 'parallel line = ?', text: '7x + 5y = 70'}
    traps:
      A: 'You went for $5x$ plus $7y$ equals 120. That swaps the coefficients, which changes the gradient to negative 5 over 7. A parallel line keeps $7x$ plus $5y$, and only the constant changes.'
      C: 'You went for $x$ plus $y$ equals 7. That has gradient negative 1, not negative 7 over 5, and 5 plus 7 is 12, so it doesn''t even pass through 5, 7.'
      D: 'You went for $15x$ plus $17y$ equals 90. That has the wrong gradient, and 15 times 5 plus 17 times 7 is 194, not 90. Keep $7x$ plus $5y$ and find the new constant: 70.'
  34:
    moments:
      - say: '$\theta$ is an acute angle and sine $\theta$ is $m$ over $n$. We want cot $\theta$.'
        write: '$\sin\theta = \dfrac{m}{n}$'
      - say: 'The quickest way is to draw a right-angled triangle in which this is true, then read cot straight off it.'
        write: 'Draw a right-angled triangle with angle $\theta$'
        show_sketch: true
        point:
          - {figure: sketch, kind: arc, target: CAB, text: 'θ'}
      - say: 'Sine is opposite over hypotenuse, and we are told it is $m$ over $n$.'
        write: '$\sin\theta = \dfrac{\text{opposite}}{\text{hypotenuse}} = \dfrac{m}{n}$'
      - say: 'So we can take the opposite side as $m$, and the hypotenuse as $n$.'
        write: 'So opposite $= m$, hypotenuse $= n$'
        point:
          - {figure: sketch, kind: circle, target: m, text: 'opposite'}
          - {figure: sketch, kind: circle, target: n, text: 'hypotenuse'}
      - say: 'Pythagoras: the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hypotenuse}^{2} = \text{opposite}^{2} + \text{adjacent}^{2}$'
      - say: 'The third side, the adjacent, comes from Pythagoras. Adjacent squared plus $m$ squared equals $n$ squared.'
        write: 'Pythagoras: $\text{adjacent}^{2} + m^{2} = n^{2}$'
        point:
          - {figure: sketch, kind: highlight, target: AB, text: 'adjacent'}
      - say: 'Subtract $m$ squared from both sides.'
        write: '$\text{adjacent}^{2} = n^{2} - m^{2}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '+ m2'}, at: '− m2', text: 'across the ='}
      - say: 'Take the square root of both sides.'
        write: '$\text{adjacent} = \sqrt{n^{2} - m^{2}}$'
        point:
          - {figure: sketch, kind: circle, target: '√(n² − m²)'}
      - say: 'Now, cot is 1 over tan. Tan is opposite over adjacent, so cot is the other way up: adjacent over opposite.'
        write: '$\cot\theta = \dfrac{1}{\tan\theta} = \dfrac{\text{adjacent}}{\text{opposite}}$'
      - say: 'Put in the adjacent side we just found, root of $n$ squared minus $m$ squared, and the opposite side, $m$.'
        write: '$\cot\theta = \dfrac{\sqrt{n^{2} - m^{2}}}{m}$'
        point:
          - {line: 9, kind: move, from: {line: 7, at: 'n2 − m2'}, at: 'n2 − m2', text: 'adjacent'}
          - {line: 9, kind: move, from: {line: 3, at: '= [[m]]'}, at: '[[m]]n2', text: 'opposite'}
          - {figure: 'sketch', kind: 'circle', target: '√(n² − m²)', text: 'adjacent'}
      - say: 'Let''s test with 30 degrees. Sine 30 is a half, so $m$ is 1 and $n$ is 2.'
        write: 'Test: $\sin 30^{\circ} = \dfrac{1}{2}$, so $m = 1,\ n = 2$'
      - say: 'Our answer gives the root of 2 squared minus 1 squared, over 1. That is root of 4 minus 1, which is root 3. And cot 30 is indeed root 3.'
        write: '$\dfrac{\sqrt{2^{2} - 1^{2}}}{1} = \sqrt{4 - 1} = \sqrt{3} = \cot 30^{\circ}\ \checkmark$'
      - say: 'So cot $\theta$ is root of $n$ squared minus $m$ squared, over $m$, which is answer choice A.'
        write: '$\cot\theta = \dfrac{\sqrt{n^{2} - m^{2}}}{m}$'
        answer: true
    traps:
      B: 'You went for option B. It puts the whole fraction under the root, so the $m$ ends up square-rooted too. Test with $m$ equals 3, $n$ equals 5: cot is 4 over 3, but B gives root of 16 over 3, about 2.31.'
      C: 'You went for option C. That''s opposite over adjacent, which is tan $\theta$. Cot is the other way up: adjacent over opposite.'
      D: 'You went for option D. Test it at 30 degrees, with $m$ as 1 and $n$ as 2: it gives the root of 2 over 3, about 0.82, but cot 30 is root 3. Cot is adjacent over opposite.'
  35:
    moments:
      - say: 'In the figure, $XZ$ is 10 centimetres. $R$ and $Y$ are on the vertical line through $Z$. We want $RY$.'
        write: '$XZ = 10\text{ cm}$'
        point:
          - {figure: 0, kind: highlight, target: XZ}
      - say: 'From $X$, the line to $R$ makes 30 degrees with $XZ$. The extra 15 degrees takes it up to $Y$, so the line to $Y$ makes 30 plus 15, which is 45 degrees.'
        write: 'Angle to $Y$: $\angle ZXY = 30^{\circ} + 15^{\circ} = 45^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: ZXY, text: '45°'}
      - say: 'So we have two right-angled triangles on the same base $XZ$, with the right angle at $Z$. $R$ is below $Y$ on the same vertical line, so $RY$ is the gap between their heights.'
        write: '$RY = ZY - ZR$'
        point:
          - {figure: 0, kind: highlight, target: RY, text: 'RY'}
      - say: 'Tan is the opposite side over the adjacent side.'
        write: 'SOH CAH TOA: $\tan\theta = \dfrac{\text{opposite}}{\text{adjacent}}$'
      - say: 'Start with the smaller triangle, $XZR$. $ZR$ is opposite the 30 degrees, and $XZ$ is next to it, the adjacent side. Opposite over adjacent is tan.'
        write: 'Triangle $XZR$: $\tan 30^{\circ} = \dfrac{ZR}{XZ} = \dfrac{ZR}{10}$'
        point:
          - {figure: 0, kind: arc, target: ZXR, text: '30°'}
          - {figure: 0, kind: underline, target: ZR, text: 'opposite'}
      - say: 'Multiply both sides by 10.'
        write: '$ZR = 10\tan 30^{\circ}$'
      - say: 'Tan 30 is 1 over root 3, so $ZR$ is 10 times 1 over root 3, which is 10 over root 3.'
        write: '$= 10 \times \dfrac{1}{\sqrt{3}} = \dfrac{10}{\sqrt{3}}$'
      - say: 'Now the bigger triangle, $XZY$, with the 45 degrees. Again, opposite over adjacent.'
        write: 'Triangle $XZY$: $\tan 45^{\circ} = \dfrac{ZY}{10}$'
        point:
          - {figure: 0, kind: underline, target: ZY, text: 'opposite'}
      - say: 'Multiply by 10. Tan 45 is 1, so $ZY$ is 10 times 1, which is 10.'
        write: '$ZY = 10\tan 45^{\circ} = 10 \times 1 = 10$'
      - say: 'Now go back to $RY$ equals $ZY$ minus $ZR$, and put in the 10 and the 10 over root 3 we just found.'
        write: '$RY = 10 - \dfrac{10}{\sqrt{3}}$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '1 = [[10]]'}, at: 'RY = [[10]]', text: 'ZY'}
          - {line: 9, kind: move, from: {line: 6, at: '= [[310]]'}, at: '− [[310]]', text: 'ZR'}
      - say: 'Both terms have a 10, so take out 10 as a common factor.'
        write: '$= 10\left(1 - \dfrac{1}{\sqrt{3}}\right)$'
      - say: 'Check: 1 over root 3 is about 0.577, so this is 10 times 0.423, about 4.23 centimetres. That is positive and less than 10, as it should be.'
        write: 'Check: $10(1 - 0.577) = 10(0.423) = 4.23$ cm'
      - say: 'So $RY$ is 10 times 1 minus 1 over root 3, which is answer choice B.'
        write: '$RY = 10\left(1 - \dfrac{1}{\sqrt{3}}\right)$ cm'
        answer: true
    traps:
      A: 'You went for 10. That''s $ZY$, the whole height up to $Y$. $RY$ is only the part above $R$, so subtract $ZR$, which is 10 over root 3.'
      C: 'You went for 10 times 1 minus root 3. Tan 30 is 1 over root 3, not root 3. And 1 minus root 3 is negative, which can''t be a length.'
      D: 'You went for 10 times 1 minus 1 over root 2. That uses a 45-degree ratio for the lower triangle. The lower angle is 30 degrees, and tan 30 is 1 over root 3.'
  36:
    moments:
      - say: 'We want the limit, as $x$ tends to 2, of $x$ minus 2 times $x$ squared plus $3x$ minus 2, all over $x$ squared minus 4.'
        write: '$\displaystyle\lim_{x \to 2}\dfrac{(x - 2)(x^{2} + 3x - 2)}{x^{2} - 4}$'
      - say: 'If we just put in 2, the top has $x$ minus 2, which is zero, and the bottom is 2 squared minus 4, which is also zero.'
        write: 'At $x = 2$: $\dfrac{(2 - 2)(4 + 6 - 2)}{2^{2} - 4} = \dfrac{0}{0}$'
      - say: 'Zero over zero tells us nothing yet. It is a sign that a common factor is hiding in the top and the bottom, and we must cancel it first.'
        write: 'Zero over zero: look for a common factor'
      - say: 'The difference of two squares: $a$ minus $b$, times $a$ plus $b$, is $a$ squared minus $b$ squared.'
        write: 'Difference of two squares: $(a - b)(a + b) = a^{2} - b^{2}$'
      - say: 'The top already shows $x$ minus 2. The bottom, $x$ squared minus 4, is a difference of two squares, so it has $x$ minus 2 as well.'
        write: 'Difference of two squares: $x^{2} - 4 = (x - 2)(x + 2)$'
      - say: 'So we rewrite the limit with the bottom factorised.'
        write: '$= \displaystyle\lim_{x \to 2}\dfrac{(x - 2)(x^{2} + 3x - 2)}{(x - 2)(x + 2)}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '(x − 2)(x + 2)'}, at: '(x − 2)(x + 2)', text: 'factorised'}
      - say: '$x$ is only getting close to 2, never equal to it, so $x$ minus 2 isn''t zero. We can cancel it from top and bottom.'
        write: '$= \displaystyle\lim_{x \to 2}\dfrac{x^{2} + 3x - 2}{x + 2}$'
        point:
          - {line: 5, kind: strike, at: '[[(x − 2)]](x2', text: 'cancels'}
          - {line: 5, kind: strike, at: '[[(x − 2)]](x + 2)', text: 'cancels'}
      - say: 'Now there is no zero on the bottom, so we can put in $x$ as 2.'
        write: '$= \dfrac{2^{2} + 3(2) - 2}{2 + 2}$'
      - say: 'On top: 2 squared is 4, and 3 times 2 is 6. 4 plus 6 is 10, minus 2 is 8. On the bottom: 2 plus 2 is 4.'
        write: '$= \dfrac{4 + 6 - 2}{4} = \dfrac{8}{4}$'
      - say: '8 divided by 4 is 2.'
        write: '$= 2$'
      - say: 'So the limit is 2, which is answer choice B.'
        write: 'Limit $= 2$'
        answer: true
    traps:
      A: 'You went for 0. The top is zero at $x$ equals 2, but so is the bottom, so it''s zero over zero. Cancel $x$ minus 2 first; then you get 8 over 4, which is 2.'
      C: 'You went for 3. After cancelling, check the top: 4 plus 6 minus 2 is 8, and the bottom is 4. So it''s 8 over 4, which is 2.'
      D: 'You went for 4. That''s just the bottom, $x$ plus 2. The top is 8, and 8 divided by 4 is 2.'
  37:
    moments:
      - say: '$y$ equals $x$ sine $x$, and we want the second derivative.'
        write: '$y = x\sin x$'
      - say: '$y$ is a product of two functions, $x$ and sine $x$. So we need the product rule, and since we want the second derivative, we''ll use it twice.'
        write: 'A product: use the product rule'
      - say: 'The product rule: the derivative of $uv$ is $u$ times $dv$ by $dx$, plus $v$ times $du$ by $dx$.'
        write: 'Product rule: $\dfrac{d}{dx}(uv) = u\dfrac{dv}{dx} + v\dfrac{du}{dx}$'
      - say: 'Let $u$ be $x$ and $v$ be sine $x$. Then $du$ by $dx$ is 1, and $dv$ by $dx$ is cos $x$.'
        write: '$u = x,\ v = \sin x,\ \dfrac{du}{dx} = 1,\ \dfrac{dv}{dx} = \cos x$'
      - say: 'Put those into the rule: $x$ times cos $x$, plus sine $x$ times 1.'
        write: '$\dfrac{dy}{dx} = x\cos x + \sin x \times 1$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {line: 4, kind: move, from: {line: 3, at: '= [[cosx]]'}, at: 'cosx', text: 'dv/dx'}
          - {line: 4, kind: move, from: {line: 3, at: '= [[1]]'}, at: '× 1', text: 'du/dx'}
      - say: 'Sine $x$ times 1 is just sine $x$. So the first derivative is sine $x$ plus $x$ cos $x$.'
        write: '$= \sin x + x\cos x$'
      - say: 'Now differentiate this again, one term at a time. The derivative of sine $x$ is cos $x$.'
        write: 'First term: $\dfrac{d}{dx}(\sin x) = \cos x$'
      - say: '$x$ cos $x$ is another product. Now $u$ is $x$ and $v$ is cos $x$. The derivative of cos $x$ is negative sine $x$, so we get $x$ times negative sine $x$, plus cos $x$ times 1.'
        write: 'Second term: $\dfrac{d}{dx}(x\cos x) = x(-\sin x) + \cos x \times 1$'
      - say: 'That is cos $x$ minus $x$ sine $x$.'
        write: '$= \cos x - x\sin x$'
      - say: 'Now add the derivatives of the two terms: cos $x$ from the first, and cos $x$ minus $x$ sine $x$ from the second.'
        write: '$\dfrac{d^{2}y}{dx^{2}} = \cos x + (\cos x - x\sin x)$'
        point:
          - {line: 9, kind: move, from: {line: 6, at: '= cosx'}, at: '[[cosx]] + (', text: 'first term'}
          - {line: 9, kind: move, from: {line: 8, at: 'cosx − xsinx'}, at: '(cosx − xsinx)', text: 'second term'}
      - say: 'Cos $x$ plus cos $x$ is 2 cos $x$.'
        write: '$= 2\cos x - x\sin x$'
      - say: 'So the second derivative is 2 cos $x$ minus $x$ sine $x$, which is answer choice A.'
        write: '$\dfrac{d^{2}y}{dx^{2}} = 2\cos x - x\sin x$'
        answer: true
    traps:
      B: 'You went for sine $x$ plus $x$ cos $x$. That''s the first derivative. The question wants the second, so differentiate once more.'
      C: 'You went for sine $x$ minus $x$ cos $x$. That''s close to the first derivative with a sign changed. Differentiate the first derivative again to get 2 cos $x$ minus $x$ sine $x$.'
      D: 'You went for $x$ sine $x$ minus 2 cos $x$. Both signs are flipped. The derivative of sine $x$ is plus cos $x$, and of cos $x$ is minus sine $x$, giving 2 cos $x$ minus $x$ sine $x$.'
  38:
    moments:
      - say: 'Picture ice building up in a fridge''s ice-box. It forms at a rate of 4 minus 0.6 $t$ grams per minute. At the start there are 2 grams, a thin layer at the bottom. We want the mass of ice after 5 minutes.'
        write: 'Rate: $\dfrac{dm}{dt} = 4 - 0.6t$, starting with 2 g'
        doodle: {name: 'custom:1992_q38_a', id: fridge, caption: '2 g of ice at the start'}
        doodle_do:
          - {id: fridge, op: fill, to: 0.14}
      - say: 'A rate tells us how fast the ice builds up. To get the amount formed over a stretch of time, we integrate the rate over that time, here from 0 to 5 minutes on the stopwatch.'
        write: 'Mass formed $= \displaystyle\int_{0}^{5}(4 - 0.6t)\,dt$'
        doodle_do:
          - {id: fridge, op: circle, part: clock}
      - say: 'To integrate a power, add one to the power and divide by the new power.'
        write: 'Integration: $\displaystyle\int x^{n}\,dx = \dfrac{x^{n + 1}}{n + 1}$'
      - say: 'Integrate term by term. 4 integrates to $4t$.'
        write: 'First term: $\displaystyle\int 4\,dt = 4t$'
      - say: '0.6 $t$ integrates to 0.6 $t$ squared over 2, and 0.6 over 2 is 0.3. So that is 0.3 $t$ squared.'
        write: 'Second term: $\displaystyle\int 0.6t\,dt = \dfrac{0.6t^{2}}{2} = 0.3t^{2}$'
      - say: 'So the mass formed is $4t$ minus 0.3 $t$ squared, taken between the limits 0 and 5.'
        write: 'Mass formed $= \left[4t - 0.3t^{2}\right]_{0}^{5}$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '= [[4t]]'}, at: '4t'}
          - {line: 5, kind: move, from: {line: 4, at: '= [[0.3t2]]'}, at: '0.3t2'}
      - say: 'Put in the limits: the value at 5, minus the value at 0.'
        write: '$= \left(4(5) - 0.3(5)^{2}\right) - \left(4(0) - 0.3(0)^{2}\right)$'
      - say: 'At 5: 4 times 5 is 20. 5 squared is 25, and 0.3 times 25 is 7.5. At zero, both terms are zero.'
        write: '$= (20 - 7.5) - 0$'
      - say: '20 minus 7.5 is 12.5. So 12.5 grams of ice formed in the 5 minutes: watch it pile up in the ice-box.'
        write: '$= 12.5\text{ g}$'
        doodle_do:
          - {id: fridge, op: fill, to: 1}
      - say: 'But the box did not start empty: it already had 2 grams, the layer at the bottom. So the total is the 2 grams at the start plus the 12.5 grams formed.'
        write: 'Total $= 2 + 12.5 = 14.5\text{ g}$'
        doodle_do:
          - {id: fridge, op: circle, part: start}
          - {id: fridge, op: label, part: total, text: '14.5 g'}
        point:
          - {line: 9, kind: move, from: {line: 0, at: 'with [[2]] g'}, at: '[[2]] + 12.5', text: 'start'}
          - {line: 9, kind: move, from: {line: 8, at: '12.5'}, at: '12.5', text: 'formed'}
          - {line: 9, kind: highlight, at: '14.5', to: {doodle: fridge, part: total}}
      - say: 'A quick check: the rate starts at 4 and falls to 4 minus 0.6 times 5, which is 1, gram per minute. That averages 2.5, and 2.5 times 5 minutes is 12.5 grams formed.'
        write: 'Check: $\dfrac{4 + 1}{2} \times 5 = 2.5 \times 5 = 12.5\ \checkmark$'
      - say: 'So there are 14.5 grams of ice after 5 minutes, which is answer choice C.'
        write: 'Mass after 5 minutes $= 14.5\text{ g}$'
        answer: true
    traps:
      A: 'You went for 19.5. Check the integral at 5: 4 times 5 is 20, minus 0.3 times 25, which is 7.5. That gives 12.5, and adding the 2 grams gives 14.5.'
      B: 'You went for 17.0. The integral of 0.6 $t$ is 0.3 $t$ squared, so at 5 you subtract 7.5, giving 12.5. Then add the starting 2 grams for 14.5.'
      D: 'You went for 12.5. That''s the ice formed in the 5 minutes, but the box already had 2 grams. Add them: 14.5 grams.'
  39:
    moments:
      - say: 'We want the maximum value of $f$ of $x$ equals $x$ cubed minus $12x$ plus 11.'
        write: '$f(x) = x^{3} - 12x + 11$'
      - say: 'Let me sketch the graph, so we can see its shape.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'f(x)'}
      - say: 'To differentiate a power, bring the power down in front and reduce the power by one.'
        write: 'Differentiation: $\dfrac{d}{dx}\left(x^{n}\right) = nx^{n - 1}$'
      - say: 'At a turning point, the gradient is zero. So we differentiate: $x$ cubed gives $3x$ squared, minus $12x$ gives minus 12, and the 11 gives nothing.'
        write: 'Gradient: $f^{\prime}(x) = 3x^{2} - 12$'
      - say: 'At the turning points, this gradient is zero.'
        write: 'Turning points: $3x^{2} - 12 = 0$'
      - say: 'Add 12 to both sides.'
        write: '$3x^{2} = 12$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '− 12'}, at: '= 12', text: 'across the ='}
      - say: 'Divide both sides by 3. 12 divided by 3 is 4.'
        write: '$x^{2} = \dfrac{12}{3} = 4$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '[[3]]x2'}, at: '3', text: 'divide by 3'}
      - say: 'Which numbers square to 4? 2, and negative 2.'
        write: '$x = 2$ or $x = -2$'
      - say: 'A cubic has two turning points, one maximum and one minimum. To tell which is which, differentiate again: $3x$ squared gives $6x$.'
        write: 'Second derivative: $f^{\prime\prime}(x) = 6x$'
      - say: 'At $x$ equals 2, 6 times 2 is 12, which is positive. The curve bends upwards there, like a cup, so that is a minimum.'
        write: '$f^{\prime\prime}(2) = 6(2) = 12 > 0\ \Rightarrow \text{minimum}$'
        point:
          - {figure: sketch, kind: circle, target: 'min', text: 'at x = 2'}
      - say: 'At $x$ equals negative 2, 6 times negative 2 is negative 12, which is negative. The curve bends downwards, like a hill, so that is the maximum.'
        write: '$f^{\prime\prime}(-2) = 6(-2) = -12 < 0\ \Rightarrow \text{maximum}$'
        point:
          - {figure: sketch, kind: circle, target: 'max = ?', text: 'at x = −2'}
      - say: 'Now find the maximum value by putting negative 2 back into $f$ of $x$.'
        write: '$f(-2) = (-2)^{3} - 12(-2) + 11$'
        point:
          - {line: 10, kind: circle, at: 'maximum', text: 'use x = −2'}
          - {line: 11, kind: move, from: {line: 7, at: '−2'}, at: '(−2)3', text: 'sub in'}
      - say: 'Negative 2 cubed is negative 8. Negative 12 times negative 2 is positive 24.'
        write: '$= -8 + 24 + 11$'
      - say: 'Negative 8 plus 24 is 16, and 16 plus 11 is 27.'
        write: '$= 27$'
      - say: 'For comparison, the minimum value is $f$ of 2: 2 cubed is 8, 12 times 2 is 24, so 8 minus 24 plus 11, which is negative 5.'
        write: 'Minimum: $f(2) = 2^{3} - 12(2) + 11 = 8 - 24 + 11 = -5$'
      - say: 'So the maximum value is 27, which is answer choice D.'
        write: '$f_{\max} = 27$'
        answer: true
        point:
          - {figure: sketch, kind: circle, target: 'max = ?', text: '27'}
    traps:
      A: 'You went for negative 5. That''s the minimum value, at $x$ equals 2. The second derivative is negative at $x$ equals negative 2, so the maximum is $f$ of negative 2, which is 27.'
      B: 'You went for negative 2. That''s where the maximum happens, the $x$-value, not the value of the function. Put negative 2 into $f$ to get 27.'
      C: 'You went for 5. Check the signs in $f$ of negative 2: negative 8, plus 24, plus 11, which is 27.'
  40:
    moments:
      - say: 'A student blows up a balloon, and its volume grows at $\pi$ times 20 minus $t$ squared cubic centimetres per second. It starts at zero. We want the volume of the balloon after 2 seconds.'
        write: '$\dfrac{dV}{dt} = \pi(20 - t^{2})$'
        doodle: {name: 'custom:1992_q40_a', id: balloon, caption: 'the balloon swells for 2 seconds'}
      - say: 'Volume is building up at a known rate, so we integrate the rate from 0 to 2 seconds, while the balloon swells.'
        write: '$V = \displaystyle\int_{0}^{2}\pi(20 - t^{2})\,dt$'
        doodle_do:
          - {id: balloon, op: grow, part: balloon, by: 1.3}
      - say: '$\pi$ is just a constant, so we can take it outside.'
        write: '$V = \pi\displaystyle\int_{0}^{2}(20 - t^{2})\,dt$'
      - say: 'To integrate a power, add one to the power and divide by the new power.'
        write: 'Integration: $\displaystyle\int x^{n}\,dx = \dfrac{x^{n + 1}}{n + 1}$'
      - say: 'Integrate term by term. 20 integrates to $20t$, and $t$ squared integrates to $t$ cubed over 3.'
        write: 'Integrals: $\displaystyle\int 20\,dt = 20t,\quad \int t^{2}\,dt = \dfrac{t^{3}}{3}$'
      - say: 'So $V$ is pi times the bracket $20t$ minus $t$ cubed over 3, between the limits 0 and 2.'
        write: '$V = \pi\left[20t - \dfrac{t^{3}}{3}\right]_{0}^{2}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '20t'}, at: '20t'}
          - {line: 5, kind: move, from: {line: 4, at: '3t3'}, at: '3t3'}
      - say: 'Put in the limits: the value at 2, minus the value at 0.'
        write: '$= \pi\left[\left(20(2) - \dfrac{2^{3}}{3}\right) - \left(20(0) - \dfrac{0^{3}}{3}\right)\right]$'
      - say: 'At 2: 20 times 2 is 40, and 2 cubed is 8, giving 40 minus 8 over 3. At zero, everything is zero. And the balloon started empty, so there is nothing extra to add.'
        write: '$= \pi\left(40 - \dfrac{8}{3}\right)$'
        doodle_do:
          - {id: balloon, op: pulse, part: balloon}
      - say: 'To subtract, write 40 as 120 over 3. Then 120 over 3 minus 8 over 3 is 112 over 3.'
        write: '$= \pi\left(\dfrac{120}{3} - \dfrac{8}{3}\right) = \dfrac{112}{3}\pi$'
      - say: '112 divided by 3 is 37.33, to two decimal places. That is how much air is in the balloon.'
        write: '$= 37.33\pi$'
        doodle_do:
          - {id: balloon, op: grow, part: balloon, by: 1.3}
          - {id: balloon, op: label, part: vol, text: '37.33π cm³'}
        point:
          - {line: 9, kind: highlight, at: '37.33', to: {doodle: balloon, part: vol}}
      - say: 'So the volume after 2 seconds is 37.33 pi cubic centimetres, which is answer choice B.'
        write: '$V = 37.33\pi\ \text{cm}^{3}$'
        answer: true
    traps:
      A: 'You went for 37.00 pi. That rounds 8 over 3 to 3. But 8 over 3 is 2.67, and 40 minus 2.67 is 37.33.'
      C: 'You went for 40 pi. That integrates the 20 but drops the $t$ squared term. Subtract $t$ cubed over 3 at 2, which is 8 over 3, to get 37.33 pi.'
      D: 'You went for 42.67 pi. That adds the 8 over 3 instead of subtracting it. The rate is 20 minus $t$ squared, so the result is 40 minus 8 over 3, which is 37.33.'
  41:
    moments:
      - say: 'We want the integral of cos $2x$, from 0 to $\pi$ over 4.'
        write: '$\displaystyle\int_{0}^{\pi/4}\cos 2x\,dx$'
      - say: 'Let me sketch the graph, so we can see its shape.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'y = cos 2x'}
          - {figure: sketch, kind: circle, target: 'area = ?', text: 'the integral'}
      - say: 'To integrate, think backwards: what do we differentiate to get cos $2x$? Try sine $2x$. By the chain rule, its derivative is cos $2x$ times the 2 from inside, which is 2 cos $2x$.'
        write: 'Chain rule: $\dfrac{d}{dx}(\sin 2x) = \cos 2x \times 2 = 2\cos 2x$'
      - say: 'That is twice too big. So to get just cos $2x$, we need half of sine $2x$. That half is the extra factor that comes from the 2 inside the cosine.'
        write: '$\displaystyle\int\cos 2x\,dx = \dfrac{1}{2}\sin 2x$'
      - say: 'Now we use it between the limits, 0 and pi over 4.'
        write: '$\displaystyle\int_{0}^{\pi/4}\cos 2x\,dx = \left[\dfrac{1}{2}\sin 2x\right]_{0}^{\pi/4}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '21sin2x'}, at: '21sin2x', text: 'from here'}
          - {figure: sketch, kind: circle, target: '0', text: 'lower limit'}
          - {figure: sketch, kind: circle, target: 'π/4', text: 'upper limit'}
      - say: 'Put in the limits: the value at pi over 4, minus the value at 0.'
        write: '$= \dfrac{1}{2}\sin\left(2 \times \dfrac{\pi}{4}\right) - \dfrac{1}{2}\sin(2 \times 0)$'
      - say: '2 times pi over 4 is pi over 2, and 2 times 0 is 0.'
        write: '$= \dfrac{1}{2}\sin\dfrac{\pi}{2} - \dfrac{1}{2}\sin 0$'
      - say: 'Sine of pi over 2, which is sine 90 degrees, is 1. And sine 0 is 0.'
        write: '$= \dfrac{1}{2} \times 1 - \dfrac{1}{2} \times 0$'
      - say: 'A half times 1 is a half, and a half times 0 is 0. A half minus 0 is a half.'
        write: '$= \dfrac{1}{2} - 0 = \dfrac{1}{2}$'
      - say: 'A rough check: cos $2x$ falls from 1 to 0 across a width of pi over 4, about 0.785. So the area under it must lie between 0 and 0.785, and a half does.'
        write: 'Check: $0 < \dfrac{1}{2} < \dfrac{\pi}{4} \approx 0.785\ \checkmark$'
      - say: 'So the integral is a half, which is answer choice C.'
        write: 'Integral $= \dfrac{1}{2}$'
        answer: true
        point:
          - {figure: sketch, kind: circle, target: 'area = ?', text: '½'}
    traps:
      A: 'You went for negative a half. The sign is wrong. The integral of cos is plus sine, and sine of $\pi$ over 2 is positive 1, giving positive a half.'
      B: 'You went for negative 1. The integral of cos $2x$ is plus a half sine $2x$, not a negative. At the limits that gives a half minus zero.'
      D: 'You went for 1. That forgets the half. Differentiating sine $2x$ gives 2 cos $2x$, so the integral of cos $2x$ is a half sine $2x$.'
  42:
    moments:
      - say: 'A storekeeper has five commodities: picture them as five stacks, with quantities 215, 113, 108, 216 and 68. We want the angle for commodity $H$ on a pie chart.'
        write: '$F = 215,\ G = 113,\ H = 108,\ K = 216,\ M = 68$'
        doodle: {name: 'custom:1992_q42_a', id: stock, caption: 'the store''s five stacks of stock'}
      - say: 'Let me draw the pie chart, so we can see the parts of the whole.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'H', text: 'this sector'}
      - say: 'A pie chart shares out the full 360 degrees in proportion. Each angle is the item''s fraction of the total, times 360. It is never the raw quantity itself.'
        write: 'Sector angle $= \dfrac{\text{quantity}}{\text{total}} \times 360^{\circ}$'
      - say: 'So first we need the total of all five stacks.'
        write: 'Total $= 215 + 113 + 108 + 216 + 68$'
        doodle_do:
          - {id: stock, op: pulse}
      - say: '215 plus 113 is 328.'
        write: '$= 328 + 108 + 216 + 68$'
      - say: '328 plus 108 is 436.'
        write: '$= 436 + 216 + 68$'
      - say: '436 plus 216 is 652.'
        write: '$= 652 + 68$'
      - say: '652 plus 68 is 720: that is all the stock on the shelf.'
        write: '$= 720$'
        doodle_do:
          - {id: stock, op: label, part: shelf, text: '720 in all'}
      - say: 'Now go back to the sector formula. $H$, the yellow stack, has 108 out of the total of 720.'
        write: 'Angle for $H = \dfrac{108}{720} \times 360^{\circ}$'
        doodle_do:
          - {id: stock, op: circle, part: h}
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {line: 8, kind: move, from: {line: 0, at: 'H = [[108]]'}, at: '108', text: 'H'}
          - {line: 8, kind: move, from: {line: 7, at: '720'}, at: '720', text: 'total'}
      - say: '360 over 720 is a half, so this is 108 times a half.'
        write: '$= 108 \times \dfrac{360}{720} = 108 \times \dfrac{1}{2}$'
        point:
          - {figure: sketch, kind: circle, target: '108 (?°)', text: '108 of 720'}
      - say: 'Half of 108 is 54: stack $H$ gets 54 degrees of the pie.'
        write: '$= 54^{\circ}$'
        doodle_do:
          - {id: stock, op: label, part: h, text: '54°'}
        point:
          - {line: 10, kind: highlight, at: '54', to: {doodle: stock, part: h}}
      - say: 'So commodity $H$ gets 54 degrees, which is answer choice D.'
        write: 'Angle for $H = 54^{\circ}$'
        answer: true
        point:
          - {figure: sketch, kind: circle, target: 'H', text: '54°'}
    traps:
      A: 'You went for 216 degrees. That''s commodity $K$''s quantity, not an angle. $H$''s angle is 108 over 720, times 360, which is 54.'
      B: 'You went for 108 degrees. That''s $H$''s quantity copied across as an angle. The total is 720, so each unit is worth half a degree, and 108 units give 54 degrees.'
      C: 'You went for 68 degrees. That''s commodity $M$''s quantity. $H$''s angle is 108 over 720 times 360, which is 54.'
  43:
    moments:
      - say: 'The mean of this frequency table is 5.2, and one frequency is unknown, $y$. Picture the mean as the balance point of a beam: stacks of blocks at 2, 4, 6 and 8 balance on a pivot at 5.2. We want $y$.'
        write: '$\bar{x} = 5.2$, frequencies $4,\ y,\ 6,\ 5$'
        doodle: {name: 'custom:1992_q43_a', id: beam, caption: 'the mean is where the beam balances'}
      - say: 'The mean of a frequency table is the sum of $f$ times $x$, divided by the sum of the frequencies $f$.'
        write: 'Mean: $\bar{x} = \dfrac{\sum fx}{\sum f}$'
      - say: 'Work out each $f$ times $x$: the number of blocks times where they sit on the beam. 2 times 4 is 8. 4 times $y$ is $4y$. 6 times 6 is 36. 8 times 5 is 40.'
        write: 'Products: $2 \times 4 = 8,\ \ 4 \times y = 4y,\ \ 6 \times 6 = 36,\ \ 8 \times 5 = 40$'
        doodle_do:
          - {id: beam, op: pulse, part: beam}
      - say: 'Add them. 8 plus 36 is 44, and 44 plus 40 is 84. So the total is 84 plus $4y$.'
        write: '$\sum fx = 8 + 4y + 36 + 40 = 84 + 4y$'
      - say: 'Now the frequencies. 4 plus 6 plus 5 is 15, so the total is 15 plus $y$.'
        write: '$\sum f = 4 + y + 6 + 5 = 15 + y$'
      - say: 'Now put these two sums into the mean formula, and set it equal to 5.2, the pivot.'
        write: '$\dfrac{84 + 4y}{15 + y} = 5.2$'
        doodle_do:
          - {id: beam, op: circle, part: pivot}
        point:
          - {line: 5, kind: move, from: {line: 3, at: '= [[84 + 4y]]'}, at: '84 + 4y', text: 'Σfx'}
          - {line: 5, kind: move, from: {line: 4, at: '= [[15 + y]]'}, at: '15 + y', text: 'Σf'}
      - say: 'Multiply both sides by 15 plus $y$ to clear the fraction.'
        write: '$84 + 4y = 5.2(15 + y)$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '15 + y'}, at: '(15 + y)', text: 'times both sides'}
      - say: 'Expand the right side. 5.2 times 15 is 78, and 5.2 times $y$ is $5.2y$.'
        write: '$84 + 4y = 78 + 5.2y$'
      - say: 'Take 78 from both sides, and $4y$ from both sides. That leaves 84 minus 78 on the left, and $5.2y$ minus $4y$ on the right.'
        write: '$84 - 78 = 5.2y - 4y$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= [[78]]'}, at: '− 78', text: 'across'}
          - {line: 8, kind: move, from: {line: 7, at: '+ 4y'}, at: '− 4y', text: 'across'}
      - say: '84 minus 78 is 6, and $5.2y$ minus $4y$ is $1.2y$.'
        write: '$6 = 1.2y$'
      - say: 'Divide both sides by 1.2. 6 divided by 1.2 is 5, since 1.2 times 5 is 6. So 5 blocks sit at 4 on the beam.'
        write: '$y = \dfrac{6}{1.2} = 5$'
        doodle_do:
          - {id: beam, op: label, part: ystack, text: 'y = 5 blocks'}
        point:
          - {line: 10, kind: highlight, at: '= 5', to: {doodle: beam, part: ystack}}
      - say: 'Check: with $y$ as 5, the $fx$ total is 84 plus 20, which is 104, and the frequencies total 20. 104 over 20 is 5.2.'
        write: 'Check: $\dfrac{84 + 4(5)}{15 + 5} = \dfrac{104}{20} = 5.2\ \checkmark$'
      - say: 'So $y$ is 5, which is answer choice C.'
        write: '$y = 5.0$'
        answer: true
    traps:
      A: 'You went for 6. Check it: the $fx$ total would be 108 and the frequencies 21, and 108 over 21 is about 5.14, not 5.2. Solving gives $y$ equals 5.'
      B: 'You went for 5.2. That''s the mean itself, not the frequency. Set up 84 plus $4y$, over 15 plus $y$, equal to 5.2 and solve: $y$ is 5.'
      D: 'You went for 4. Then the $fx$ total is 100 and the frequencies 19, giving about 5.26, not 5.2. The equation gives $6$ equals $1.2y$, so $y$ is 5.'
  44:
    moments:
      - say: 'We want the mode and then the median of this distribution of children per family.'
        write: 'Families: $7,\ 11,\ 6,\ 7,\ 7,\ 5,\ 3$ for $0$ to $6$ children'
      - say: 'The mode is the value that happens most often. So we look along the families row for the biggest number.'
        write: 'Mode: the number of children with the most families'
      - say: 'The biggest frequency is 11, and it sits under 1 child. So the mode is 1: more families have exactly one child than any other number.'
        write: 'Biggest frequency $= 11$, at 1 child, so mode $= 1$'
      - say: 'For the median, we first need the total number of families. Picture them all, one house for each family.'
        write: 'Total $= 7 + 11 + 6 + 7 + 7 + 5 + 3$'
        doodle: {name: 'house-small', id: fam, repeat: 46, layout: grid, caption: '46 families, fewest children first'}
      - say: '7 plus 11 is 18, plus 6 is 24, plus 7 is 31.'
        write: '$= 31 + 7 + 5 + 3$'
      - say: '31 plus 7 is 38, plus 5 is 43, plus 3 is 46 families in all.'
        write: '$= 46$'
        doodle_do:
          - {id: fam, op: pulse}
      - say: 'The median is the middle value when all 46 are lined up in order. Half of 46 is 23, and 46 is even, so the middle falls between the 23rd and the 24th values.'
        write: 'Middle: $\dfrac{46}{2} = 23$, so the 23rd and 24th values'
      - say: 'Let''s count through the houses in order. The 7 families with 0 children fill positions 1 to 7.'
        write: '0 children: positions $1$ to $7$'
        doodle_do:
          - {id: fam, op: group, n: 7, text: '0 children: 1 to 7'}
      - say: 'The 11 families with 1 child come next. 7 plus 11 is 18, so they fill positions 8 to 18.'
        write: '1 child: positions $8$ to $18$, since $7 + 11 = 18$'
        doodle_do:
          - {id: fam, op: group, n: 18, text: 'up to 1 child: 18'}
      - say: 'The 6 families with 2 children come next. 18 plus 6 is 24, so they fill positions 19 to 24.'
        write: '2 children: positions $19$ to $24$, since $18 + 6 = 24$'
        doodle_do:
          - {id: fam, op: group, n: 24, text: 'up to 2 children: 24'}
      - say: 'Both the 23rd and the 24th are in that block, so both are 2. The average of 2 and 2 is 2.'
        write: 'Median $= \dfrac{2 + 2}{2} = 2$'
        point:
          - {line: 6, kind: underline, at: '23rd and 24th', text: 'middle'}
          - {line: 9, kind: arrow, text: 'both here'}
      - say: 'So the mode is 1 and the median is 2, which is answer choice B.'
        write: 'Mode $= 1$, median $= 2$'
        answer: true
    traps:
      A: 'You went for 2, 1. Those are the right numbers in the wrong order. The question asks for the mode first, which is 1, then the median, which is 2.'
      C: 'You went for 1, 5. The mode is right, but 5 isn''t the median. With 46 families, the 23rd and 24th values both fall among the families with 2 children.'
      D: 'You went for 5, 2. The mode is the value with the biggest frequency. 11 families have 1 child, so the mode is 1, not 5.'
  45:
    moments:
      - say: 'Three students scored 5, 6 and 7: picture them holding up their scores. We want the standard deviation.'
        write: '$5,\ 6,\ 7$'
        doodle: {name: 'custom:1992_q45_a', id: kids, caption: 'three scores: 5, 6 and 7'}
      - say: 'Standard deviation measures how spread out the scores are around the mean, so we find the mean first. 5 plus 6 plus 7 is 18, and 18 divided by 3 is 6, the middle student''s score.'
        write: 'Mean: $\bar{x} = \dfrac{5 + 6 + 7}{3} = \dfrac{18}{3} = 6$'
        doodle_do:
          - {id: kids, op: circle, part: s6}
      - say: 'Now each score minus the mean of 6. 5 minus 6 is negative 1. 6 minus 6 is 0. 7 minus 6 is 1. Each student now shows how far they are from the mean.'
        write: 'Deviations: $5 - 6 = -1,\ \ 6 - 6 = 0,\ \ 7 - 6 = 1$'
        doodle_do:
          - {id: kids, op: stage, stage: 'custom:1992_q45_a2'}
      - say: 'Why not just add these? Because the negatives and positives cancel: negative 1 plus 0 plus 1 is 0. So we square them first, which makes them all positive.'
        write: 'Unsquared: $-1 + 0 + 1 = 0$, so we square'
      - say: 'Negative 1 squared is 1, 0 squared is 0, and 1 squared is 1. Squaring turns every gap under the students positive.'
        write: 'Squares: $(-1)^{2} = 1,\ \ 0^{2} = 0,\ \ 1^{2} = 1$'
        doodle_do:
          - {id: kids, op: label, part: devs, text: 'squares: 1, 0, 1'}
      - say: 'Add them up. 1 plus 0 plus 1 is 2.'
        write: '$\sum(x - \bar{x})^{2} = 1 + 0 + 1 = 2$'
      - say: 'The variance is that sum divided by the number of scores, which is 3. So it is 2 over 3.'
        write: 'Variance $= \dfrac{\sum(x - \bar{x})^{2}}{n} = \dfrac{2}{3}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= [[2]]'}, at: '3[[2]]', text: 'the sum'}
      - say: 'The standard deviation is the square root of the variance, so it is the root of 2 over 3.'
        write: 'Standard deviation $= \sqrt{\text{variance}} = \sqrt{\dfrac{2}{3}}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '= [[32]]'}, at: '32', text: 'variance'}
      - say: '2 over 3 is about 0.667, and its square root is about 0.816. That is a sensible spread for scores within one mark of the mean.'
        write: 'Check: $\sqrt{0.667} \approx 0.816$'
      - say: 'So the standard deviation is the root of 2 over 3, which is answer choice C.'
        write: 'Standard deviation $= \sqrt{\dfrac{2}{3}}$'
        answer: true
    traps:
      A: 'You went for 2 over 3. That''s the variance, one step too early. The standard deviation is its square root: the root of 2 over 3.'
      B: 'You went for 3 over 2 root 3. That doesn''t come from the squared deviations. They add to 2; divide by 3 to get 2 over 3, then take the square root.'
      D: 'You went for the root of 3 over 2. That''s the fraction upside down. The sum of squares is 2, divided by 3 scores, so it''s the root of 2 over 3.'
  46:
    moments:
      - say: 'Sample variance can be defined with 1 over $n$ or with 1 over $n$ minus 1. When is there practically no difference?'
        write: '$\dfrac{1}{n} \quad \text{vs} \quad \dfrac{1}{n - 1}$'
      - say: 'The two formulas are exactly the same except for what we divide by. So we''re really asking: when are dividing by $n$ and dividing by $n$ minus 1 practically the same?'
        write: 'Only difference: divide by $n$ or by $n - 1$'
      - say: 'The two divisors always differ by exactly 1. What matters is how big that 1 is compared with $n$ itself.'
        write: 'Gap between divisors: $n - (n - 1) = 1$'
      - say: 'Try a small sample, $n$ equals 5: picture 5 people. The divisors are 5 and 4, one person fewer. A gap of 1 compared with 4 is 1 over 4, or 25 percent. Not negligible at all.'
        write: '$n = 5$: divisors 5 and 4, gap $\dfrac{1}{4} = 25\%$'
        doodle: {name: 'person-small', id: small, repeat: 5, layout: row, caption: 'a sample of 5'}
        doodle_do:
          - {id: small, op: split, n: 1, text: '1 | 4 left'}
      - say: 'Try $n$ equals 35: now 35 people. The divisors are 35 and 34. One person fewer out of 34 is about 2.9 percent. Smaller, but still a real gap.'
        write: '$n = 35$: divisors 35 and 34, gap $\dfrac{1}{34} \approx 2.9\%$'
        doodle: {name: 'person-small', id: big, repeat: 35, layout: grid, caption: 'a sample of 35'}
        doodle_do:
          - {id: big, op: split, n: 1, text: '1 | 34 left'}
      - say: 'Try $n$ equals 100. The divisors are 100 and 99, and 1 over 99 is about 1 percent.'
        write: '$n = 100$: gap $\dfrac{1}{99} \approx 1\%$'
      - say: 'And for $n$ equals 1000, 1 over 999 is only about 0.1 percent.'
        write: '$n = 1000$: gap $\dfrac{1}{999} \approx 0.1\%$'
      - say: 'So the bigger the sample, the less one person matters. Statisticians treat around 30 to 35 as the line between small samples and large samples.'
        write: 'As $n$ grows, the gap shrinks towards $0$'
        doodle_do:
          - {id: big, op: pulse}
      - say: 'So there''s practically no difference when $n$ is greater than 35, which is answer choice B.'
        write: 'No practical difference when $n > 35$'
        answer: true
    traps:
      A: 'You went for $n$ equals 35. That''s just the boundary. The difference keeps shrinking as $n$ grows, so it''s when $n$ is bigger than 35 that the two agree.'
      C: 'You went for $n$ less than 35. That''s the small-sample case, where the $n$ minus 1 matters most. The two formulas agree for large $n$.'
      D: 'You went for $n$ equals 5. That''s where they differ the most: dividing by 5 or by 4 is a 25% difference. They only agree for large samples.'
  47:
    moments:
      - say: 'Two fair dice are thrown. Picture every way they can land as a grid of cells. We want the probability that the total is 8.'
        write: 'Two dice: total score of 8'
        doodle: {name: 'custom:1992_q47_a', id: dice, caption: 'every way two dice can land'}
      - say: 'Probability is the number of outcomes that work, over the total number of outcomes. The two dice are different, so a 2 then a 6 is not the same as a 6 then a 2. We count ordered pairs.'
        write: '$P = \dfrac{\text{favourable outcomes}}{\text{total outcomes}}$'
      - say: 'Each die has 6 faces, and each face of the first can go with each face of the second: 6 rows of 6 cells in the grid. So the total number of outcomes is 6 times 6, which is 36.'
        write: 'Total outcomes $= 6 \times 6 = 36$'
        doodle_do:
          - {id: dice, op: label, part: grid, text: '36 cells'}
      - say: 'Now list the pairs that add to 8, going through the first die in turn. If the first die is 1, the second would need 8 minus 1, which is 7. That is impossible.'
        write: 'First die 1: needs $8 - 1 = 7$, impossible'
      - say: 'First die 2: the second needs 8 minus 2, which is 6.'
        write: 'First die 2: $8 - 2 = 6$, giving $(2, 6)$'
      - say: 'First die 3: the second needs 8 minus 3, which is 5.'
        write: 'First die 3: $8 - 3 = 5$, giving $(3, 5)$'
      - say: 'First die 4: the second needs 8 minus 4, which is 4.'
        write: 'First die 4: $8 - 4 = 4$, giving $(4, 4)$'
      - say: 'First die 5: the second needs 3. First die 6: the second needs 2.'
        write: 'First die 5 and 6: $(5, 3)$ and $(6, 2)$'
      - say: 'Counting them up: 2 6, 3 5, 4 4, 5 3 and 6 2. On the grid they lie along one slanting line. That is 5 outcomes altogether.'
        write: 'Favourable outcomes $= 5$'
        doodle_do:
          - {id: dice, op: stage, stage: 'custom:1992_q47_a2'}
          - {id: dice, op: label, part: hits, text: '5 ways'}
      - say: 'So the probability is 5 cells out of 36, 5 over 36, which is answer choice B.'
        write: '$P = \dfrac{5}{36}$'
        doodle_do:
          - {id: dice, op: circle, part: hits}
        point:
          - {line: 9, kind: move, from: {line: 8, at: '= [[5]]'}, at: '36[[5]]', text: 'favourable'}
          - {line: 9, kind: move, from: {line: 2, at: '= [[36]]'}, at: '[[36]]5', text: 'total'}
