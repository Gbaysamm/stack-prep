        write: '$e(m + 1) = 0$'
      - say: 'Now, this must be true for every real number $m$. Try $m$ as 2: then $m$ plus 1 is 3, so 3 times $e$ must be zero.'
        write: 'For $m = 2$: $e(2 + 1) = 3e = 0$'
