  49:
    moments:
      - say: 'Five people are arranged in a row, and a married couple insist on sitting together. How many arrangements are there?'
        write: 'Five people in a row; the couple sit together'
      - say: 'The trick: tie the couple together and treat them as one single unit, looped together in the photo. Then arrange the units, and finally arrange the couple inside their unit.'
        write: 'Tie the couple into one unit'
        doodle: {name: 'custom:1992_q49_a', id: photo, caption: 'the couple, tied into one unit', size: scene}
        doodle_do:
          - {id: photo, op: circle, part: couple}
      - say: 'Take the 2 people of the couple out, and put them back as 1 unit. That leaves 3 other people plus the couple, which is 4 units, numbered under the photo.'
        write: 'Units $= 3 + 1 = 4$'
        doodle_do:
          - {id: photo, op: highlight, part: units}
      - say: 'How many ways can 4 units stand in a row? The first place has 4 choices, the next has 3, then 2, then 1.'
        write: 'Ways to arrange the units $= 4 \times 3 \times 2 \times 1$'
      - say: '4 times 3 is 12, times 2 is 24, times 1 is 24. This is called 4 factorial.'
        write: '$= 4! = 24$'
      - say: 'But inside their loop, the couple can sit two ways: husband on the left, or wife on the left.'
        write: 'Couple inside the unit: $2 \times 1 = 2$ ways'
        doodle_do:
          - {id: photo, op: stage, stage: 'custom:1992_q49_a2'}
      - say: 'So each of the 24 arrangements of units comes in 2 versions, one for each way the couple swap. 24 times 2 is 48.'
        write: 'Total $= 24 \times 2 = 48$'
        doodle_do:
          - {id: photo, op: label, part: swap, text: '24 × 2 = 48'}
        point:
          - {line: 6, kind: move, from: {line: 4, at: '= [[24]]'}, at: '24', text: 'units'}
          - {line: 6, kind: move, from: {line: 5, at: '= [[2]] ways'}, at: '× 2', text: 'couple'}
          - {line: 6, kind: highlight, at: '48', to: {doodle: photo, part: swap}}
      - say: 'Sense check: with no restriction there would be 5 factorial arrangements. 5 times 4 times 3 times 2 times 1 is 120.'
        write: 'No restriction: $5! = 5 \times 4 \times 3 \times 2 \times 1 = 120$'
      - say: '48 out of 120: divide top and bottom by 24 to get 2 over 5. A believable share of arrangements where two named people are side by side.'
        write: 'Share: $\dfrac{48}{120} = \dfrac{2}{5}$'
      - say: 'So there are 48 arrangements, which is answer choice A.'
        write: 'Arrangements $= 48$'
        answer: true
