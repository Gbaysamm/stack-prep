# UTME 1993 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1993.yaml. Answers match that file.
format_version: 1
exam_year: 1993
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'Change 71, base ten, to base eight. To leave base ten, we divide by the new base again and again, on the division ladder.'
        write: 'Change $71_{10}$ to base 8.'
      - say: 'Set up the ladder: the base, 8, on the left of the bar, and 71 on the right.'
        write: 'Solution'
        diagram: {id: L, kind: ladder, divisor: 8, number: 71, 'on': 'the ladder'}
      - say: '8 times 8 is 64, and 71 minus 64 is 7. So 71 divided by 8 is 8, remainder 7: eight bundles of eight, and 7 left over.'
        diagram_do:
          - {id: L, op: step, 'on': 'remainder 7'}
        doodle: {name: 'custom:1993_q01_a', id: sticks, caption: '71 = 8 eights and 7 left', 'on': 'eight bundles'}
      - say: 'Bring the quotient, 8, down and divide again. 8 divided by 8 is 1, remainder 0.'
        diagram_do:
          - {id: L, op: step, 'on': 'remainder 0'}
      - say: '1 divided by 8 is 0, remainder 1. The quotient is now 0, so we stop.'
        diagram_do:
          - {id: L, op: step, 'on': 'remainder 1'}
      - say: 'Read the remainders from the bottom up: one, zero, seven. The last remainder is the biggest place value, so it is written first.'
        diagram_do:
          - {id: L, op: read, 'on': 'bottom up'}
        write: '$71_{10} = 107_{8}$'
        point:
          - {line: 5, kind: highlight, at: '1078', to: {diagram: L, part: result}}
      - section: 'Check'
        say: 'Check by expanding back. Write the index numbers over one-zero-seven: two, one, nought. Each digit times eight to the power of its index.'
        write: '$\overset{2}{1}\,\overset{1}{0}\,\overset{0}{7}_{8} = 1 \times 8^{2} + 0 \times 8^{1} + 7 \times 8^{0}$'
      - say: 'Eight squared is 64, eight to the power one is 8, and eight to the power nought is 1.'
        write: '$= 1 \times 64 + 0 \times 8 + 7 \times 1$'
      - say: '64 plus 0 plus 7 is 71, the number we started with.'
        write: '$= 64 + 0 + 7 = 71\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore 71 base ten is one-zero-seven base eight, which is option A.'
        write: '$\therefore 71_{10} = 107_{8}$'
        answer: true
    traps:
      B: 'You went for one-zero-six base eight. That is 64 plus 6, which is 70, one short. The first remainder is 7, because 71 minus 64 is 7.'
      C: 'You went for seven-one base eight. That only changes the label. Seven-one base eight is 7 eights plus 1, which is 57, not 71. Divide by 8 on the ladder instead.'
      D: 'You went for one-seven base eight. You dropped the remainder 0 in the middle. Every remainder is a digit: one-seven base eight is only 15.'
  2:
    moments:
      - section: 'The question'
        say: 'Dividing by 0.05 makes a number bigger, much bigger. Two options keep the right digits but the wrong size. Let''s get both the value and the rounding right.'
        write: 'Evaluate $\dfrac{3524}{0.05}$ correct to 3 s.f.'
      - say: 'We clear the decimal in the divisor, divide, and round only at the end.'
        write: 'Solution'
      - section: 'Clear the decimal'
        say: 'Multiply the numerator and the denominator by 100. The value does not change. 3,524 times 100 is 352,400, and 0.05 times 100 is 5.'
        write: '$\dfrac{3524}{0.05} = \dfrac{3524 \times 100}{0.05 \times 100} = \dfrac{352400}{5}$'
      - section: 'Divide'
        say: 'Short division by 5. 5 into 35 goes 7. 5 into 2 goes 0, remainder 2. 5 into 24 goes 4, remainder 4. 5 into 40 goes 8. Then 5 into 0 goes 0.'
        write: '$352400 \div 5 = 70480$'
      - section: 'Round to 3 s.f.'
        say: 'Significant figures start at the first digit that is not zero: 7, 0, 4. Cut after the 4. The next digit is 8, so add 1: the 4 becomes 5.'
        write: '$704|80 \to 705$'
      - say: 'The digits after the cut become zeros, so the number keeps its size. 70,480 becomes 70,500.'
        write: '$\therefore 70480 \approx 70500$ (3 s.f.)'
      - section: 'Check'
        say: 'Check another way: 0.05 is 1 over 20. Picture ₦1 as twenty 5-kobo coins. So dividing by 0.05 is multiplying by 20, and 3,524 times 20 is 70,480.'
        doodle: {name: 'custom:1993_q02_a', id: coins, caption: '₦1 is twenty 5-kobo coins'}
        doodle_do: [{id: coins, op: label, part: total, text: '70,480 coins'}]
        write: 'Check: $3524 \times 20 = 70480 \ \checkmark$'
        point:
          - {line: 6, kind: highlight, at: '70480', to: {doodle: coins, part: total}}
      - section: 'Answer'
        say: 'So the answer, correct to 3 significant figures, is 70,500, which is option D.'
        write: '$\therefore$ Answer $= 70500$ (3 s.f.)'
        answer: true
    traps:
      A: 'You went for 705. Those are the right three digits, but the zeros that keep the place were dropped. The answer is about seventy thousand, not 705.'
      B: 'You went for 70,000. That is 70,480 to 2 significant figures. For 3 we keep 7, 0 and 4, and the next digit 8 makes the 4 a 5: 70,500.'
      C: 'You went for 70,480. That is the exact value, which has 4 significant figures. The question asks us to round it to 3.'
  3:
    moments:
      - say: 'We have 9 to the power $x - \tfrac{1}{2}$ equals 3 to the power $x^{2}$, and we want $x$.'
        write: '$9^{(x - 1/2)} = 3^{x^{2}}$'
      - say: 'The two sides are powers of different bases, 9 and 3. We can only compare the powers when the bases match. Picture nine tiles in a square, 3 along each side: 9 is 3 squared, so let''s write 9 that way.'
        write: '$9 = 3^{2}$'
        doodle: {name: 'custom:1993_q03_a', id: nine, caption: '9 tiles make a 3 by 3 square'}
      - say: 'Put 3 squared in place of the 9 on the left side.'
        write: 'So $\left(3^{2}\right)^{(x - 1/2)} = 3^{x^{2}}$'
        point:
          - {line: 2, kind: move, from: {line: 1, at: '32'}, at: '(32)', text: 'swap in'}
      - say: 'The rule for a power of a power: multiply the indices.'
        write: 'Power of a power: $\left(a^{m}\right)^{n} = a^{mn}$'
      - say: 'A power of a power means we multiply the indices. So the index on the left becomes 2 times the bracket, $x$ minus a half.'
        write: '$3^{2(x - 1/2)} = 3^{x^{2}}$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '(3[[2]])'}, at: '3[[2]](x', text: 'multiply the indices'}
      - say: '2 times $x$ is $2x$, and 2 times a half is 1. So the index is $2x - 1$.'
        write: '$3^{2x - 1} = 3^{x^{2}}$'
      - say: 'Now both sides are powers of 3. When the bases are equal, the indices must be equal too.'
        write: 'Equate the indices: $2x - 1 = x^{2}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '2x − 1'}, at: '2x − 1'}
          - {line: 6, kind: move, from: {line: 5, at: '= 3[[x2]]'}, at: 'x2'}
      - say: 'Let''s bring everything to one side. Subtract $2x$ from both sides and add 1.'
        write: '$x^{2} - 2x + 1 = 0$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '[[2x]] − 1'}, at: '− 2x', text: 'across the ='}
          - {line: 7, kind: move, from: {line: 6, at: '[[− 1]] = x2'}, at: '+ 1', text: 'across the ='}
      - say: 'To factorise, we need two numbers that multiply to 1 and add to negative 2. Negative 1 and negative 1 work.'
        write: '$(-1) \times (-1) = 1, \quad (-1) + (-1) = -2$'
      - say: 'So it factorises as $x - 1$ times $x - 1$, which is $x - 1$ all squared.'
        write: '$(x - 1)(x - 1) = (x - 1)^{2} = 0$'
      - say: 'If $x - 1$ squared is zero, then $x - 1$ itself is zero, so $x$ is 1.'
        write: '$x - 1 = 0 \Rightarrow x = 1$'
      - say: 'Let''s check in the original equation. On the left, 1 minus a half is a half, and 9 to the power a half is the square root of 9, the side of our square of tiles, which is 3.'
        write: 'Left: $9^{(1 - 1/2)} = 9^{1/2} = 3$'
        doodle_do:
          - {id: nine, op: circle, part: side}
      - say: 'On the right, 1 squared is 1, and 3 to the power 1 is 3. Both sides are 3.'
        write: 'Right: $3^{1^{2}} = 3^{1} = 3$'
      - say: 'So $x$ equals 1, which is answer choice B.'
        write: 'Answer: $x = 1$'
        answer: true
    traps:
      A: 'You went for a half. Try it: the left side becomes 9 to the power 0, which is 1, but the right side is 3 to the power a quarter, which is not 1. Write 9 as 3 squared and equate the indices; you get $(x-1)^2 = 0$.'
      C: 'You went for 2. Then the left side is 9 to the power 1.5, which is 27, and the right side is 3 to the power 4, which is 81. They don''t match.'
      D: 'You went for 3. Then the left is 9 to the power 2.5, which is 243, but the right is 3 to the power 9. Make the bases equal and the quadratic gives $x = 1$ only.'
  4:
    moments:
      - say: 'We have 10 to the $y$, times 5 to the $2y - 2$, times 4 to the $y - 1$, all equal to 1. We need $y$.'
        write: '$10^{y} \times 5^{(2y - 2)} \times 4^{(y - 1)} = 1$'
      - say: 'There are three different bases here: 10, 5 and 4. The plan is to break every base into its prime factors, which are only 2s and 5s. Then we can collect them.'
        write: 'Write every base using 2 and 5:'
      - say: 'First, 10 is 2 times 5. So 10 to the $y$ is 2 to the $y$ times 5 to the $y$.'
        write: '$10^{y} = (2 \times 5)^{y} = 2^{y} \times 5^{y}$'
      - say: '5 to the power $2y - 2$ is already a power of 5, so it stays as it is.'
        write: '$5^{(2y - 2)}$ stays as it is'
      - say: 'The rule for a power of a power: multiply the indices.'
        write: 'Power of a power: $\left(a^{m}\right)^{n} = a^{mn}$'
      - say: 'Next, 4 is 2 squared. A power of a power multiplies the indices, so 4 to the $y - 1$ is 2 to the power 2 times $y - 1$, which is $2y - 2$.'
        write: '$4^{(y - 1)} = \left(2^{2}\right)^{(y - 1)} = 2^{(2y - 2)}$'
      - say: 'Now rewrite the whole left side of the equation with only 2s and 5s, using the three pieces we just found.'
        write: 'So $2^{y} \times 5^{y} \times 5^{(2y - 2)} \times 2^{(2y - 2)} = 1$'
        point:
          - {line: 6, kind: move, from: {line: 2, at: '2y × 5y'}, at: '2y × 5y', text: 'from 10'}
          - {line: 6, kind: move, from: {line: 5, at: '2(2y − 2)'}, at: '2(2y − 2)', text: 'from 4'}
      - say: 'The rule for multiplying powers of the same base: add the indices.'
        write: 'Multiplication law: $a^{m} \times a^{n} = a^{m + n}$'
      - say: 'Collect the powers of 2. When we multiply powers of the same base, we add the indices: $y$ plus $2y - 2$ is $3y - 2$.'
        write: 'Powers of 2: $2^{y} \times 2^{(2y - 2)} = 2^{(3y - 2)}$'
      - say: 'Collect the powers of 5 the same way. Again, $y$ plus $2y - 2$ is $3y - 2$.'
        write: 'Powers of 5: $5^{y} \times 5^{(2y - 2)} = 5^{(3y - 2)}$'
      - say: 'Both have the same index, $3y - 2$. So the 2 and the 5 join back together as 10, with that index.'
        write: '$2^{(3y - 2)} \times 5^{(3y - 2)} = 10^{(3y - 2)}$'
      - say: 'So the equation is 10 to the $3y - 2$ equals 1. And any number to the power 0 is 1: picture the piles, 100, then 10, then 1, dividing by 10 each step. So we can write the 1 as 10 to the power 0.'
        write: 'So $10^{(3y - 2)} = 1 = 10^{0}$'
        doodle: {name: 'custom:1993_q04_a', id: piles, caption: '÷10, ÷10: 10⁰ = 1'}
        doodle_do:
          - {id: piles, op: circle, part: one}
      - say: 'The bases match, so the indices are equal.'
        write: '$3y - 2 = 0$'
      - say: 'Add 2 to both sides.'
        write: '$3y = 2$'
        point:
          - {line: 13, kind: move, from: {line: 12, at: '− 2'}, at: '= 2', text: 'across the ='}
      - say: 'Divide both sides by 3. So $y$ is 2 over 3, which is answer choice B.'
        write: 'Answer: $y = \dfrac{2}{3}$'
        point:
          - {line: 14, kind: move, from: {line: 13, at: '[[3]]y'}, at: '[[3]]2', text: 'divide by 3'}
        answer: true
    traps:
      A: 'You went for 3 over 4. Then $3y - 2$ is 9 over 4 minus 2, which is 1 over 4, and 10 to the power 1 over 4 is not 1. The index must be zero, so $3y = 2$.'
      C: 'You went for 1. Then the index $3y - 2$ is 1, and 10 to the power 1 is 10, not 1. The index must be zero.'
      D: 'You went for 5 over 4. Break every base into 2s and 5s; both indices come to $3y - 2$, and setting that to zero gives 2 over 3.'
  5:
    moments:
      - say: 'We want to simplify 1 over root 3 minus 2, minus 1 over root 3 plus 2.'
        write: '$\dfrac{1}{\sqrt{3} - 2} - \dfrac{1}{\sqrt{3} + 2}$'
      - say: 'To subtract two fractions, we need a common denominator. The simplest one is the two bottoms multiplied together.'
        write: 'Common denominator: $(\sqrt{3} - 2)(\sqrt{3} + 2)$'
      - say: 'Each fraction takes the other one''s bottom onto its top. So the first top becomes root 3 plus 2, and the second top becomes root 3 minus 2.'
        write: '$= \dfrac{(\sqrt{3} + 2) - (\sqrt{3} - 2)}{(\sqrt{3} - 2)(\sqrt{3} + 2)}$'
      - say: 'The difference of two squares: $a$ minus $b$, times $a$ plus $b$, is $a$ squared minus $b$ squared.'
        write: 'Difference of two squares: $(a - b)(a + b) = a^{2} - b^{2}$'
      - say: 'Let''s do the bottom first. It has the pattern $a$ minus $b$, times $a$ plus $b$. That''s a difference of two squares, $a$ squared minus $b$ squared: picture a square of side root 3, with area 3, and a 2 by 2 square of 4 tiles.'
        write: 'Bottom: $(\sqrt{3} - 2)(\sqrt{3} + 2) = (\sqrt{3})^{2} - 2^{2}$'
        doodle: {name: 'custom:1993_q05_a', id: tiles, caption: '(√3)² is 3, 2² is 4'}
      - say: 'Root 3 squared is 3, and 2 squared is 4. 3 minus 4 is negative 1: we are one tile short.'
        write: '$= 3 - 4 = -1$'
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1993_q05_a2'}
      - say: 'Now the top. Open the second bracket carefully. The minus in front changes both signs: minus root 3, and minus negative 2 is plus 2.'
        write: 'Top: $(\sqrt{3} + 2) - (\sqrt{3} - 2) = \sqrt{3} + 2 - \sqrt{3} + 2$'
      - say: 'Root 3 minus root 3 is 0, so the surds cancel. And 2 plus 2 is 4.'
        write: '$= 4$'
      - say: 'Now put the top we found, 4, over the bottom we found, the negative 1 from the tiles.'
        write: 'So the expression $= \dfrac{4}{-1}$'
        doodle_do:
          - {id: tiles, op: circle, part: short}
        point:
          - {line: 8, kind: move, from: {line: 7, at: '4'}, at: '4', text: 'top'}
          - {line: 8, kind: move, from: {line: 5, at: '= −1'}, at: '−1', text: 'bottom'}
      - say: '4 divided by negative 1 is negative 4.'
        write: '$= -4$'
      - say: 'So the expression simplifies to negative 4, which is answer choice D.'
        write: 'Answer: $-4$'
        answer: true
    traps:
      A: 'You went for 4. The top is 4, but the bottom is 3 minus 4, which is negative 1. Dividing by negative 1 flips the sign.'
      B: 'You went for two thirds. The surds cancel completely: the top is 4 and the bottom is negative 1, so there''s no 3 left to divide by.'
      C: 'You went for zero. The two fractions are not equal, so they don''t cancel. When you subtract the second bracket, minus negative 2 becomes plus 2, giving 4 on top.'
  6:
    moments:
      - say: 'We''re told 2 log base 3 of $y$ plus log base 3 of $x^{2}$ equals 4, and we want $y$.'
        write: '$2\log_{3}y + \log_{3}x^{2} = 4$'
      - say: 'The power law of logs: a number in front of a log can move inside as a power.'
        write: 'Power law: $k\log_{a}M = \log_{a}M^{k}$'
      - say: 'We want $y$ by itself, so we need to get out of logs. The first step is to combine the two logs into one, starting with the power law.'
        write: '$2\log_{3}y = \log_{3}y^{2}$'
        point:
          - {line: 2, kind: move, from: {line: 2, at: '[[2]]log'}, at: 'y[[2]]', text: 'up as the power'}
      - say: 'Put log of $y$ squared back into the equation in place of 2 log $y$.'
        write: 'So $\log_{3}y^{2} + \log_{3}x^{2} = 4$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '= [[log3y2]]'}, at: 'log3y2', text: 'swap in'}
      - say: 'The product law of logs: adding two logs with the same base gives the log of the product.'
        write: 'Product law: $\log_{a}M + \log_{a}N = \log_{a}(MN)$'
      - say: 'So the two logs become one: the log of $x$ squared times $y$ squared.'
        write: '$\log_{3}\left(x^{2}y^{2}\right) = 4$'
      - say: 'Now change from log form to index form. Log base 3 of something equals 4 means that something is four 3s multiplied: 3 to the power 4. Picture a tower of four 3s.'
        write: '$x^{2}y^{2} = 3^{4}$'
        doodle: {name: 'custom:1993_q06_a', id: tower, caption: 'log₃ = 4: four 3s'}
        point:
          - {line: 6, kind: move, from: {line: 5, at: 'log[[3]]'}, at: '[[3]]4', text: 'the base'}
          - {line: 6, kind: move, from: {line: 5, at: '= [[4]]'}, at: '3[[4]]', text: 'the power'}
      - say: '3 to the power 4 is 3 times 3 times 3 times 3. 3 times 3 is 9, 9 times 3 is 27, and 27 times 3 is 81: the tower makes 81.'
        write: '$3^{4} = 3 \times 3 \times 3 \times 3 = 81$'
        doodle_do:
          - {id: tower, op: label, part: result, text: '81'}
        point:
          - {line: 7, kind: highlight, at: '81', to: {doodle: tower, part: result}}
      - say: 'So $x$ squared times $y$ squared is 81. And $x$ squared times $y$ squared is the same as $xy$, all squared.'
        write: 'So $(xy)^{2} = 81$'
      - say: 'Take the square root of both sides. The square root of 81 is 9, and we must keep both signs, because negative 9 squared is also 81.'
        write: '$xy = \pm\sqrt{81} = \pm 9$'
      - say: 'To get $y$ by itself, divide both sides by $x$.'
        write: '$y = \pm\dfrac{9}{x}$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '[[x]]y'}, at: 'x', text: 'divide by x'}
      - say: 'So $y$ is plus or minus 9 over $x$, which is answer choice D.'
        write: 'Answer: $y = \pm\dfrac{9}{x}$'
        answer: true
    traps:
      A: 'You went for 4 minus log $x^{2}$, over 2. That gives log base 3 of $y$, not $y$ itself. We still have to change from logs back to numbers.'
      B: 'You went for 4 over log $x^{2}$. That treats the log like a number you can divide by. Combine the logs first, then change to index form.'
      C: 'You went for 2 over $x$. The 4 on the right is a power of 3, so $x^2y^2$ is 81, not 4. Then the square root gives plus or minus 9.'
  7:
    moments:
      - say: 'Without tables, we need log base 5 of 62.5, minus log base 5 of a half.'
        write: '$\log_{5}(62.5) - \log_{5}\left(\tfrac{1}{2}\right)$'
      - say: 'The quotient law of logs: subtracting two logs with the same base gives the log of the division.'
        write: 'Quotient law: $\log_{a}M - \log_{a}N = \log_{a}\dfrac{M}{N}$'
      - say: 'Both logs have base 5. When we subtract two logs with the same base, they combine into the log of a division.'
        write: '$= \log_{5}\left(62.5 \div \tfrac{1}{2}\right)$'
      - say: 'Dividing by a half is the same as multiplying by 2. Think of it: a half fits into each whole one twice, so it fits into 62.5 twice as often.'
        write: '$= \log_{5}(62.5 \times 2)$'
      - say: '62.5 times 2 is 125.'
        write: '$= \log_{5}125$'
      - say: 'Log base 5 of 125 asks a question: what power of 5 gives 125? In other words, how many 5s do we stack up and multiply to make 125?'
        write: 'Find the power: $5^{?} = 125$'
        doodle: {name: 'custom:1993_q07_a', id: tower, caption: 'how many 5s make 125?'}
      - say: 'Let''s count. 5 times 5 is 25, and 25 times 5 is 125. Watch the tower grow: that''s three 5s multiplied together.'
        write: '$5 \times 5 \times 5 = 125$'
        doodle_do:
          - {id: tower, op: stage, stage: 'custom:1993_q07_a2'}
          - {id: tower, op: stage, stage: 'custom:1993_q07_a3'}
      - say: 'So 125 is 5 to the power 3.'
        write: '$125 = 5^{3}$'
      - say: 'Put 5 cubed in place of 125 in our log.'
        write: 'So $\log_{5}125 = \log_{5}5^{3}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '53'}, at: '53', text: 'swap in'}
      - say: 'Log base 5 of 5 to the power 3 is just that power, 3: the three 5s in the tower.'
        write: '$= 3$'
        doodle_do:
          - {id: tower, op: circle, part: count}
      - say: 'So the answer is 3, which is answer choice A.'
        write: 'Answer: $3$'
        answer: true
    traps:
      B: 'You went for 4. 5 to the power 4 is 625, not 125. Dividing 62.5 by a half gives 125, which is 5 cubed.'
      C: 'You went for 5. 5 to the power 5 is 3125, far too big. Combine the logs into log base 5 of 125 and count the 5s.'
      D: 'You went for 8. Log base 5 of 125 asks for the power, not for a product of numbers. Since 125 is 5 cubed, the answer is 3.'
  8:
    moments:
      - say: 'Picture a sack of ₦225 earning interest: it earns ₦27 simple interest in $x$ years, at 4% per year. We want $x$, the number of years.'
        write: 'Principal ₦225, interest ₦27, rate 4% per year'
        doodle: {name: 'custom:1993_q08_a', id: sack, caption: '₦225 earns ₦27 at 4% a year'}
      - say: 'Simple interest is the principal times the rate times the time, all over 100.'
        write: '$I = \dfrac{PRT}{100}$'
      - say: 'Now match the numbers to the letters. The interest $I$ is 27. The principal $P$ is 225. The rate $R$ is 4. And the time $T$ is $x$.'
        write: '$I = 27, \ P = 225, \ R = 4, \ T = x$'
      - say: 'Put these values into the formula.'
        write: '$27 = \dfrac{225 \times 4 \times x}{100}$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
          - {line: 3, kind: move, from: {line: 2, at: 'I = [[27]]'}, at: '27', text: 'I'}
          - {line: 3, kind: move, from: {line: 2, at: 'P = [[225]]'}, at: '225', text: 'P'}
      - say: '225 times 4 is 900, so the top becomes $900x$.'
        write: '$27 = \dfrac{900x}{100}$'
      - say: '900 divided by 100 is 9.'
        write: '$27 = 9x$'
      - say: 'To get $x$ alone, divide both sides by 9. 27 divided by 9 is 3.'
        write: '$x = \dfrac{27}{9} = 3$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '[[9]]x'}, at: '9', text: 'divide by 9'}
      - say: 'Let''s check. One year''s interest is 4 over 100 times 225, which is ₦9: one coin for each year.'
        write: 'Check: $\dfrac{4}{100} \times 225 = 9$ per year'
        doodle_do:
          - {id: sack, op: stage, stage: 'custom:1993_q08_a2'}
        point:
          - {line: 7, kind: highlight, at: '=9', to: {doodle: sack, part: coins}}
      - say: 'In 3 years, that''s 3 coins of ₦9, which is ₦27, exactly the interest we were given.'
        write: '$3 \times 9 = 27$'
        doodle_do:
          - {id: sack, op: circle, part: interest}
      - say: 'So $x$ is 3 years, which is answer choice A.'
        write: 'Answer: $x = 3$ years'
        doodle_do:
          - {id: sack, op: label, part: years, text: '3 years'}
        answer: true
    traps:
      B: 'You went for 4. That''s the rate, not the time. The interest is ₦9 a year, and ₦27 needs 3 years.'
      C: 'You went for 12. Check it: 12 years at ₦9 a year would give ₦108 interest, not ₦27.'
      D: 'You went for 27. That''s the interest itself. Put it into $I = PRT/100$ and solve for the time.'
  9:
    moments:
      - say: 'In the diagram there are three circles, $X$, $Y$ and $Z$, and one region is shaded. We want to name the shaded region in set language.'
        point:
          - {figure: 0, kind: 'circle', target: {x: 100, y: 145}, text: 'shaded'}
      - say: 'Three overlapping circles make seven separate regions. The calm way to name one is to ask about each circle in turn: is the shading inside it, or outside it?'
        write: 'For each circle: inside or outside?'
      - say: 'First, $X$, the circle at the top left. The shading lies inside $X$.'
        write: 'Circle $X$: inside'
        point:
          - {figure: 0, kind: circle, target: X, text: 'inside'}
      - say: 'Next, $Y$, the circle at the top right. Its edge cuts across the overlap, and the shading stops right there. So the shading is outside $Y$.'
        write: 'Circle $Y$: outside'
        point:
          - {figure: 0, kind: circle, target: Y, text: 'outside'}
      - say: 'Outside $Y$ means not in $Y$. That is the complement of $Y$, read Y complement. This paper writes it $Y^{c}$; many textbooks write $Y''$.'
        write: 'Not in $Y$: $Y^{c}$'
      - say: 'Last, $Z$, the lower circle. The shading lies inside $Z$.'
        write: 'Circle $Z$: inside'
        point:
          - {figure: 0, kind: circle, target: Z, text: 'inside'}
      - say: 'So a point in the shaded part is in $X$, and in $Y$ complement, and in $Z$. In set language, the word "and" means intersection.'
        write: '"And" means intersection: $\cap$'
        point:
          - {figure: 0, kind: 'circle', target: {x: 100, y: 145}, text: 'in X and Z, not Y'}
      - say: 'Now join our three answers, $X$, $Y$ complement and $Z$, with intersections.'
        write: 'Shaded region $= X \cap Y^{c} \cap Z$'
      - say: 'So the shaded portion is $X$ intersect $Y$ complement intersect $Z$, which is answer choice C.'
        write: 'Answer: $X \cap Y^{c} \cap Z$'
        answer: true
        point:
          - {figure: 0, kind: 'label', target: {x: 100, y: 145}, text: 'X ∩ Yᶜ ∩ Z'}
    traps:
      A: 'You went for $X \cap Z$. That is the whole overlap of $X$ and $Z$, including the middle part that is also inside $Y$. That middle part isn''t shaded.'
      B: 'You went for $X^c \cap Y \cap Z$. That region is outside $X$ but inside $Y$ and $Z$, on the right. The shading is inside $X$ and outside $Y$.'
      D: 'You went for $X \cap Y \cap Z^c$. That is the patch inside $X$ and $Y$ but outside $Z$, at the top. The shaded part is inside $Z$ and outside $Y$.'
  10:
    moments:
      - section: 'The question'
        say: 'A square root equals $x$ plus 1. Picture a right-angled triangle with legs $x$ and 3: by Pythagoras its long side is the root of $x$ squared plus 9.'
        write: '$\sqrt{x^{2} + 9} = x + 1$'
        doodle: {name: 'custom:1993_q10_a', id: tri, caption: 'legs x and 3'}
      - section: 'Solution'
        say: 'To remove a square root, square both sides. The root is already alone on the left, which keeps this tidy.'
        write: 'Solution'
      - say: 'Square both sides. Squaring a square root gives back what was inside it.'
        write: '$x^{2} + 9 = (x + 1)^{2}$'
      - say: 'Open the bracket. $x$ plus 1, squared, is $x$ plus 1 times $x$ plus 1: $x$ squared plus $x$ plus $x$ plus 1, which is $x$ squared plus $2x$ plus 1.'
        write: '$x^{2} + 9 = x^{2} + 2x + 1$'
      - say: 'Collect like terms: the $x$ terms on the left, the numbers on the right. Moving a term across the equals sign changes its sign.'
        write: '$x^{2} - x^{2} - 2x = 1 - 9$'
      - say: '$x$ squared minus $x$ squared is zero. 1 minus 9 is negative 8.'
        write: '$-2x = -8$'
      - say: 'Divide both sides by negative 2. Negative 8 divided by negative 2 is 4.'
        write: '$\therefore x = 4$'
      - section: 'Check'
        say: 'Squaring can create false answers, so check in the question. Left: 4 squared is 16, plus 9 is 25, and root 25 is 5. The triangle is the famous 3, 4, 5.'
        write: 'Left: $\sqrt{4^{2} + 9} = \sqrt{25} = 5$'
        doodle_do:
          - {id: tri, op: label, part: leg, text: '4'}
          - {id: tri, op: label, part: hyp, text: '5'}
        point:
          - {line: 7, kind: highlight, at: '25=[[5]]', to: {doodle: tri, part: hyp}}
      - say: 'Right: 4 plus 1 is 5. Both sides are 5.'
        write: 'Right: $4 + 1 = 5\ \checkmark$'
      - say: 'So $x$ is 4: option B.'
        write: '$\therefore x = 4$ (B)'
        answer: true
    traps:
      A: 'You went for 5. That is the value of each side when $x$ is 4, not $x$ itself. Check 5: root 34 is not 6.'
      C: 'You went for 3. Then the left is root 18 and the right is 4. They do not match. Open the bracket fully: $x$ plus 1, squared, has a middle term $2x$.'
      D: 'You went for 1. Then the left is root 10 and the right is 2. Square both sides and open the bracket in full, and 9 equals $2x$ plus 1.'
  11:
    moments:
      - section: 'The question'
        say: 'Make $x$ the subject. The trouble is that $x$ sits on the top and on the bottom. The trick is to gather both $x$ terms, then factorise $x$ out.'
        write: '$\dfrac{1 + ax}{1 - ax} = \dfrac{p}{q}$'
      - section: 'Solution'
        say: 'Clear the fractions, collect the $x$ terms on one side, factorise out $x$, then divide.'
        write: 'Solution'
      - say: 'Cross multiply: $q$ times 1 plus $ax$ equals $p$ times 1 minus $ax$.'
        write: '$q(1 + ax) = p(1 - ax)$'
      - say: 'Open the brackets. $q$ times 1 is $q$, $q$ times $ax$ is $aqx$. $p$ times 1 is $p$, $p$ times negative $ax$ is negative $apx$.'
        write: '$q + aqx = p - apx$'
      - say: 'Collect the terms in $x$ on the left and the others on the right. Negative $apx$ crosses as plus $apx$; $q$ crosses as minus $q$.'
        write: '$aqx + apx = p - q$'
      - say: 'Both terms on the left contain $ax$. Factorise out $ax$, leaving $q$ plus $p$, which we write as $p$ plus $q$.'
        write: '$ax(p + q) = p - q$'
      - say: 'Divide both sides by $a$ times $p$ plus $q$, so that $x$ stands alone.'
        write: '$\therefore x = \dfrac{p - q}{a(p + q)}$'
      - section: 'Check'
        say: 'Check with numbers. Take $a$ equals 1 and $x$ equals one third. 1 plus a third is 4 thirds; 1 minus a third is 2 thirds. So $p$ over $q$ is 2.'
        write: '$\dfrac{1 + \frac{1}{3}}{1 - \frac{1}{3}} = \dfrac{4}{3} \div \dfrac{2}{3} = 2$'
      - say: 'So we can take $p$ equals 2 and $q$ equals 1. Our formula gives 2 minus 1, over 1 times 2 plus 1: one third, the $x$ we started with.'
        write: '$x = \dfrac{2 - 1}{1(2 + 1)} = \dfrac{1}{3}\ \checkmark$'
      - say: 'So $x$ is $p$ minus $q$, over $a$ times $p$ plus $q$: option B.'
        write: '$\therefore x = \dfrac{p - q}{a(p + q)}$ (B)'
        answer: true
    traps:
      A: 'You went for $p$ plus $q$ over $a$ times $p$ minus $q$. The two brackets are upside down. After collecting, the $x$ terms give $ax$ times $p$ plus $q$, and the others give $p$ minus $q$.'
      C: 'You went for $p$ minus $q$ over $apq$. The $p$ and $q$ come from adding $aqx$ and $apx$, so factorising out $ax$ leaves $p$ plus $q$, not $pq$.'
      D: 'You went for $pq$ over $a$ times $p$ minus $q$. Cross multiply and open the brackets carefully: the terms without $x$ give $p$ minus $q$, not $pq$.'
  12:
    moments:
      - section: 'The question'
        say: 'Which is a factor? The expression is written back to front, with a negative $x$ squared. Two of the options use the 3, two use the 5. Only one sign is right.'
        write: '$15 + 7x - 2x^{2}$'
      - section: 'Solution'
        say: 'We factorise by product and sum, keeping the terms in the order given. The first number is 15, the last is negative 2.'
        write: 'Solution'
      - say: 'The product is 15 times negative 2, negative 30. The sum is the middle number, 7.'
        write: 'Product $= 15 \times (-2) = -30$, Sum $= 7$'
      - say: 'Two numbers that multiply to negative 30 and add to 7: plus 10 and negative 3.'
        write: 'Factors: $+10$ and $-3$'
      - say: 'Replace $7x$ with $10x$ minus $3x$.'
        write: '$15 + 10x - 3x - 2x^{2}$'
      - say: 'Group in pairs. From the first take out 5, leaving 3 plus $2x$. From the second take out negative $x$, leaving 3 plus $2x$. Both brackets are the same.'
        write: '$= 5(3 + 2x) - x(3 + 2x)$'
      - say: 'Take out the common bracket, 3 plus $2x$. What is left is 5 minus $x$.'
        write: '$= (3 + 2x)(5 - x)$'
      - say: 'The options write $x$ first. 5 minus $x$ is the negative of $x$ minus 5, so $x$ minus 5 is a factor too.'
        write: '$5 - x = -(x - 5)$'
      - say: 'Therefore $x$ minus 5 is a factor.'
        write: '$\therefore x - 5$ is a factor'
      - section: 'Check'
        say: 'Check with the factor theorem. Let $x$ minus 5 equal zero, so $x$ is 5. Then the expression must be zero.'
        write: 'Let $x - 5 = 0$, $\therefore x = 5$'
      - say: 'Substitute 5 for $x$, in brackets.'
        write: '$15 + 7(5) - 2(5)^{2}$'
      - say: '7 times 5 is 35. 5 squared is 25, and 2 times 25 is 50. 15 plus 35 minus 50 is zero, so $x$ minus 5 is a factor.'
        write: '$= 15 + 35 - 50 = 0\ \checkmark$'
      - say: 'So $x$ minus 5 is a factor: option C.'
        write: '$\therefore x - 5$ (C)'
        answer: true
    traps:
      A: 'You went for $x$ minus 3. Put $x$ equals 3 in: 15 plus 21 minus 18 is 18, not zero. So $x$ minus 3 is not a factor.'
      B: 'You went for $x$ plus 3. Put $x$ equals negative 3 in: 15 minus 21 minus 18 is negative 24, not zero. The factor with 3 in it is 3 plus $2x$, not $x$ plus 3.'
      D: 'You went for $x$ plus 5. That puts $x$ equals negative 5, which gives negative 70, not zero. The bracket is 5 minus $x$, so the factor is $x$ minus 5.'
  13:
    moments:
      - section: 'The question'
        say: 'Expanding both squares would take ages. Notice the shape: one thing squared minus another thing squared, a big square with a smaller square cut away.'
        write: '$\left(x + \dfrac{1}{x} + 1\right)^{2} - \left(x - \dfrac{1}{x} - 1\right)^{2}$'
        doodle: {name: 'custom:1993_q13_a', id: sq, caption: 'A² − B²: a square with a corner cut'}
      - section: 'Solution'
        say: 'This is a difference of two squares, so we name the two brackets and use the rule.'
        write: 'Solution'
      - say: 'Call the first bracket $A$, the big square''s side.'
        write: 'Let $A = x + \dfrac{1}{x} + 1$'
        doodle_do:
          - {id: sq, op: label, part: big, text: 'A = x + 1/x + 1'}
      - say: 'Call the second bracket $B$, the cut corner''s side.'
        write: 'Let $B = x - \dfrac{1}{x} - 1$'
        doodle_do:
          - {id: sq, op: label, part: small, text: 'B = x − 1/x − 1'}
      - say: 'The rule: $A$ squared minus $B$ squared equals $A$ plus $B$, times $A$ minus $B$.'
        write: '$A^{2} - B^{2} = (A + B)(A - B)$'
      - section: 'A + B and A − B'
        say: 'First, $A$ plus $B$. Write the two brackets side by side.'
        write: '$A + B = x + \dfrac{1}{x} + 1 + x - \dfrac{1}{x} - 1$'
      - say: 'Collect like terms. $x$ plus $x$ is $2x$. 1 over $x$ minus 1 over $x$ is zero, and 1 minus 1 is zero.'
        write: '$= 2x$'
      - say: 'Now $A$ minus $B$. The minus sign in front of $B$ changes every sign inside it.'
        write: '$A - B = x + \dfrac{1}{x} + 1 - x + \dfrac{1}{x} + 1$'
      - say: 'Collect like terms. $x$ minus $x$ is zero. 1 over $x$ plus 1 over $x$ is 2 over $x$. 1 plus 1 is 2.'
        write: '$= \dfrac{2}{x} + 2$'
      - section: 'Multiply'
        say: 'Back to the rule: the expression is $A$ plus $B$, times $A$ minus $B$.'
        write: '$(A + B)(A - B) = 2x\left(\dfrac{2}{x} + 2\right)$'
        point:
          - {line: 4, kind: box, text: 'the rule'}
      - say: 'Open the bracket. $2x$ times 2 over $x$: the $x$ cancels, leaving 4. $2x$ times 2 is $4x$.'
        write: '$= 4 + 4x$'
      - say: 'Take out the common factor 4. Therefore the expression equals 4 times, 1 plus $x$.'
        write: '$\therefore 4(1 + x)$'
      - section: 'Check'
        say: 'Check with $x$ equals 1. The first bracket is 1 plus 1 plus 1, which is 3. The second is 1 minus 1 minus 1, which is negative 1.'
        write: '$x = 1$: $(3)^{2} - (-1)^{2} = 9 - 1 = 8$'
      - say: 'Our answer: 4 times, 1 plus 1, is 8. It matches.'
        write: '$4(1 + 1) = 8\ \checkmark$'
      - say: 'So the expression equals 4 times, 1 plus $x$: option D.'
        write: '$\therefore 4(1 + x)$ (D)'
        answer: true
    traps:
      A: 'You went for $4x$ squared. That is $A$ plus $B$, squared. The sum $A$ plus $B$ is $2x$, but the difference $A$ minus $B$ is 2 over $x$ plus 2, not $2x$. Multiply those two.'
      B: 'You went for 2 over $x$ plus 2, all squared. That is $A$ minus $B$, squared. The difference of two squares is $A$ plus $B$ times $A$ minus $B$, and $A$ plus $B$ is $2x$.'
      C: 'You went for 4. That is only part of it. $2x$ times 2 over $x$ gives 4, but $2x$ times 2 gives another $4x$.'
  14:
    moments:
      - section: 'The question'
        say: 'One equation has $x$ squared, the other is a straight line. Find $x$. One option has the right numbers with the signs swapped, so watch the signs.'
        write: '$x^{2} + y - 5 = 0$ and $y - 7x + 3 = 0$'
      - section: 'Solution'
        say: 'One equation is quadratic and one is linear, so we use substitution. First, number the equations.'
        write: 'Solution'
      - say: 'Equation 1: $x$ squared plus $y$ minus 5 equals zero.'
        write: '$x^{2} + y - 5 = 0 \quad \text{......(1)}$'
      - say: 'Equation 2: $y$ minus $7x$ plus 3 equals zero.'
        write: '$y - 7x + 3 = 0 \quad \text{......(2)}$'
      - say: 'Make $y$ the subject of the linear one, equation 2: add $7x$ to both sides and subtract 3. Call this equation 3.'
        write: 'From (2): $y = 7x - 3 \quad \text{......(3)}$'
      - say: 'Now substitute equation 3 into equation 1.'
        write: 'Substitute (3) in (1):'
      - say: 'Wherever $y$ appears in equation 1, write $7x$ minus 3 in a bracket.'
        write: '$x^{2} + (7x - 3) - 5 = 0$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: 'y=[[7x−3]]'}, at: '(7x−3)', text: 'equation (3)'}
      - say: 'Open the bracket and collect like terms. Negative 3 minus 5 is negative 8.'
        write: '$x^{2} + 7x - 8 = 0$'
      - section: 'Factorise'
        say: 'Here $a$ is 1, $b$ is 7, $c$ is negative 8. The product is $ac$, negative 8. The sum is $b$, 7.'
        write: 'Product $= ac = -8$, Sum $= b = 7$'
      - say: 'Two numbers that multiply to negative 8 and add to 7: plus 8 and negative 1.'
        write: 'Factors: $+8$ and $-1$'
      - say: 'Replace $7x$ with $8x$ minus $x$.'
        write: '$x^{2} + 8x - x - 8 = 0$'
      - say: 'Group in pairs. From the first take out $x$; from the second take out negative 1. Both brackets are $x$ plus 8.'
        write: '$x(x + 8) - 1(x + 8) = 0$'
      - say: 'Take out the common bracket, $x$ plus 8. What is left is $x$ minus 1.'
        write: '$(x + 8)(x - 1) = 0$'
      - say: 'Either the first bracket is zero or the second one is.'
        write: 'Either $x + 8 = 0$ or $x - 1 = 0$'
      - say: 'Therefore $x$ equals negative 8 or $x$ equals 1.'
        write: '$\therefore x = -8$ or $x = 1$'
      - section: 'Check'
        say: 'Check $x$ equals 1. Equation 3 gives $y$ equals 7 minus 3, which is 4. In equation 1: 1 plus 4 minus 5 is zero.'
        write: '$x = 1,\ y = 4$: $1 + 4 - 5 = 0\ \checkmark$'
      - say: 'Check $x$ equals negative 8. $y$ is negative 56 minus 3, negative 59. In equation 1: 64 minus 59 minus 5 is zero.'
        write: '$x = -8,\ y = -59$: $64 - 59 - 5 = 0\ \checkmark$'
      - say: 'So $x$ is 1 or negative 8: option D.'
        write: '$\therefore x = 1, -8$ (D)'
        answer: true
    traps:
      A: 'You went for negative 2 and 4. Try $x$ equals 4: $y$ is 25, and 16 plus 25 minus 5 is not zero. The quadratic is $x$ squared plus $7x$ minus 8 equals zero.'
      B: 'You went for 2 and 4. Substitute equation 3 into equation 1 and you get $x$ squared plus $7x$ minus 8 equals zero, whose roots are 1 and negative 8.'
      C: 'You went for negative 1 and 8. The signs are swapped. The factors are $x$ plus 8 and $x$ minus 1, so either $x$ plus 8 is zero, giving negative 8, or $x$ minus 1 is zero, giving 1.'
  15:
    moments:
      - section: 'The question'
        say: 'The same bracket, $3x$ minus 2, sits on both sides, like the same block on both pans of a balance. It is tempting to divide it away. Don''t: you would lose a root.'
        write: '$(3x - 2)(5x - 4) = (3x - 2)^{2}$'
        doodle: {name: 'custom:1993_q15_a', id: bal, caption: 'the same block on both pans'}
      - section: 'Solution'
        say: 'Dividing by $3x$ minus 2 throws away the answer that makes it zero. So bring everything to one side and factorise instead.'
        write: 'Solution'
      - say: 'Subtract $3x$ minus 2, squared, from both sides, so the right-hand side is zero.'
        write: '$(3x - 2)(5x - 4) - (3x - 2)^{2} = 0$'
      - say: '$3x$ minus 2, squared, is $3x$ minus 2 times $3x$ minus 2. So both terms share the bracket $3x$ minus 2, the block. Take it out.'
        write: '$(3x - 2)[(5x - 4) - (3x - 2)] = 0$'
        doodle_do:
          - {id: bal, op: circle, part: shared1}
          - {id: bal, op: circle, part: shared2}
      - say: 'Open the brackets inside. The minus sign changes both signs of $3x$ minus 2: minus $3x$, plus 2.'
        write: '$(3x - 2)(5x - 4 - 3x + 2) = 0$'
      - say: 'Collect like terms. $5x$ minus $3x$ is $2x$. Negative 4 plus 2 is negative 2.'
        write: '$(3x - 2)(2x - 2) = 0$'
      - say: 'Either the first bracket is zero or the second one is.'
        write: 'Either $3x - 2 = 0$ or $2x - 2 = 0$'
      - say: '$3x$ equals 2 gives $x$ equals 2 over 3. $2x$ equals 2 gives $x$ equals 1.'
        write: '$\therefore x = \dfrac{2}{3}$ or $x = 1$'
      - section: 'Check'
        say: 'Check $x$ equals 1. $3$ minus 2 is 1 and 5 minus 4 is 1. Left: 1 times 1. Right: 1 squared. Both are 1.'
        write: '$x = 1$: $(1)(1) = (1)^{2}\ \checkmark$'
      - say: 'Check $x$ equals 2 over 3. Then $3x$ minus 2 is zero: the shared block weighs nothing. Left: zero times something. Right: zero squared. Both are zero.'
        write: '$x = \tfrac{2}{3}$: $(0)\left(\tfrac{10}{3} - 4\right) = (0)^{2}\ \checkmark$'
        doodle_do:
          - {id: bal, op: label, part: shared1, text: '0 when x = 2/3'}
      - say: 'So $x$ is 2 over 3 or 1: option C.'
        write: '$\therefore x = \dfrac{2}{3}, 1$ (C)'
        answer: true
    traps:
      A: 'You went for negative 3 over 2, and 1. The 1 is right, but the other root comes from $3x$ minus 2 equals zero, which gives positive 2 over 3.'
      B: 'You went for 1 only. That is what you get if you divide both sides by $3x$ minus 2. Dividing throws away the root 2 over 3, which makes that bracket zero.'
      D: 'You went for 2 over 3 and 4 over 5. 4 over 5 makes $5x$ minus 4 zero, but then the right-hand side, $3x$ minus 2 squared, is not zero. Subtract and factorise out $3x$ minus 2 instead.'
  16:
    moments:
      - say: 'The figure shows two curves: $y = x(2 - x)$ and $y = (x - 1)(x - 3)$. We want the $x$-coordinates of the marked points $p$, $q$ and $r$.'
        write: '$y = x(2 - x), \quad y = (x - 1)(x - 3)$'
      - say: 'In the figure, $p$, $q$ and $r$ sit on the $x$-axis, where the curves cross it. On the $x$-axis, $y$ is zero.'
        write: 'On the $x$-axis: $y = 0$'
        point:
          - {figure: 0, kind: 'circle', target: 'p'}
          - {figure: 0, kind: 'circle', target: 'q'}
          - {figure: 0, kind: 'circle', target: 'r'}
      - say: 'Both curves are already factorised, so we can read the crossings straight off. Take the first curve and set it equal to zero.'
        write: 'First curve: $x(2 - x) = 0$'
        point:
          - {figure: 0, kind: 'label', target: {x: 140, y: 110}, text: 'y = x(2 − x)'}
      - say: 'A product is zero when one of its factors is zero. Either $x$ is 0, or $2 - x$ is 0, which means $x$ is 2.'
        write: '$x = 0 \quad \text{or} \quad 2 - x = 0 \Rightarrow x = 2$'
        point:
          - {figure: 0, kind: circle, target: '0', text: 'x = 0'}
      - say: 'Multiplying it out gives $2x$ minus $x$ squared. The $x$ squared term is negative, so this curve is a hill: it rises from 0 and comes back down at 2.'
        write: '$y = 2x - x^{2}$: opens downwards'
        point:
          - {figure: 0, kind: 'circle', target: {x: 140, y: 110}, text: 'hill'}
          - {figure: 0, kind: 'circle', target: '0'}
          - {figure: 0, kind: 'circle', target: 'q', text: '2'}
      - say: 'Now the second curve. Set $x - 1$ times $x - 3$ equal to zero.'
        write: 'Second curve: $(x - 1)(x - 3) = 0$'
        point:
          - {figure: 0, kind: 'label', target: {x: 200, y: 190}, text: 'y = (x − 1)(x − 3)'}
      - say: 'Either $x - 1$ is 0, giving 1, or $x - 3$ is 0, giving 3.'
        write: '$x - 1 = 0 \Rightarrow x = 1 \quad \text{or} \quad x - 3 = 0 \Rightarrow x = 3$'
      - say: 'Multiplying it out gives $x$ squared minus $4x$ plus 3. Its $x$ squared term is positive, so this one is a valley, dipping below the axis between 1 and 3.'
        write: '$y = x^{2} - 4x + 3$: opens upwards'
        point:
          - {figure: 0, kind: 'circle', target: {x: 200, y: 190}, text: 'valley'}
          - {figure: 0, kind: 'circle', target: 'p', text: '1'}
          - {figure: 0, kind: 'circle', target: 'r', text: '3'}
      - say: 'So, putting both curves together, they cross the $x$-axis at 0, 1, 2 and 3.'
        write: 'Crossings: $x = 0,\ 1,\ 2,\ 3$'
        point:
          - {line: 3, kind: arrow, text: 'first curve'}
          - {line: 6, kind: arrow, text: 'second curve'}
          - {figure: 0, kind: 'circle', target: '0', text: '0'}
      - say: 'In the diagram, the crossing at the origin is already marked 0. So $p$, $q$ and $r$ are the next three crossings, from left to right: 1, then 2, then 3.'
        write: 'So $p = 1, \quad q = 2, \quad r = 3$'
        point:
          - {figure: 0, kind: label, target: p, text: '1'}
          - {figure: 0, kind: label, target: q, text: '2'}
          - {figure: 0, kind: label, target: r, text: '3'}
      - say: 'So the $x$-coordinates of $p$, $q$ and $r$ are 1, 2 and 3, which is answer choice D.'
        write: 'Answer: $1,\ 2,\ 3$'
        answer: true
    traps:
      A: 'You went for 1, 3, 2. Those are the right numbers in the wrong order. Reading left to right, $p$ is at 1, $q$ at 2 and $r$ at 3.'
      B: 'You went for 0, 0, 0. Only the first curve passes through the origin. Set each bracket to zero to find the other crossings: 1, 2 and 3.'
      C: 'You went for 0, 2, 3. The origin is already marked 0, and you missed the crossing at 1, where the second curve starts.'
  17:
    moments:
      - say: 'The function is defined by $f$ of $x + 2$ equals $2x^{2}$ plus $7x$ minus 5. We want $f$ of negative 1.'
        write: '$f(x + 2) = 2x^{2} + 7x - 5$'
      - say: 'Here''s the twist. Picture $f$ as a machine whose input slot reads $x + 2$, not $x$. So to get $f$ of negative 1, we need the $x$ that makes $x + 2$ equal to negative 1.'
        write: 'We need: $x + 2 = -1$'
        doodle: {name: 'custom:1993_q17_a', id: fm, caption: 'the slot reads x + 2'}
        doodle_do:
          - {id: fm, op: circle, part: input}
      - say: 'Subtract 2 from both sides. Negative 1 minus 2 is negative 3: that is the $x$ to feed in.'
        write: '$x = -1 - 2 = -3$'
        doodle_do:
          - {id: fm, op: label, part: input, text: 'x = −3'}
        point:
          - {line: 2, kind: move, from: {line: 1, at: '+ 2'}, at: '− 2', text: 'across the ='}
      - say: 'So $f$ of negative 1 is what the right-hand side gives when $x$ is negative 3. Put negative 3 in for every $x$.'
        write: '$f(-1) = 2(-3)^{2} + 7(-3) - 5$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '= −3'}, at: '2[[(−3)]]2', text: 'sub in'}
          - {line: 3, kind: move, from: {line: 2, at: '= −3'}, at: '7[[(−3)]]', text: 'sub in'}
      - say: 'Term by term. Negative 3 squared is 9, and 2 times 9 is 18.'
        write: '$2(-3)^{2} = 2 \times 9 = 18$'
      - say: 'Next, 7 times negative 3 is negative 21.'
        write: '$7(-3) = -21$'
      - say: 'Put those two results back into the line for $f$ of negative 1.'
        write: 'So $f(-1) = 18 - 21 - 5$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '= 18'}, at: '18'}
          - {line: 6, kind: move, from: {line: 5, at: '= −21'}, at: '− 21'}
      - say: '18 minus 21 is negative 3.'
        write: '$= -3 - 5$'
      - say: 'And negative 3 minus 5 is negative 8: what comes out of the machine.'
        write: '$= -8$'
        doodle_do:
          - {id: fm, op: label, part: output, text: '−8'}
        point:
          - {line: 8, kind: highlight, at: '-8', to: {doodle: fm, part: output}}
      - say: 'So $f$ of negative 1 is negative 8, which is answer choice B.'
        write: 'Answer: $f(-1) = -8$'
        answer: true
    traps:
      A: 'You went for negative 10. That''s what you get by putting $x = -1$ straight in: 2 minus 7 minus 5. But that gives $f(1)$, since the input is $x + 2$.'
      C: 'You went for 4. Check the signs: 18 minus 21 is negative 3, and minus 5 more is negative 8.'
      D: 'You went for 10. Solve $x + 2 = -1$ first to get $x = -3$, then substitute carefully: 18 minus 21 minus 5 is negative 8.'
  18:
    moments:
      - section: 'The question'
        say: 'A cubic divided by a quadratic. Picture a rectangle: its area is the cubic, one side is $x$ squared minus 1, and the division finds the other side.'
        write: '$(x^{3} + 7x^{2} - x - 7) \div (-1 + x^{2})$'
        doodle: {name: 'custom:1993_q18_a', id: rect, caption: 'divide the area by one side'}
      - section: 'Solution'
        say: 'We use long division. First write the divisor in descending powers of $x$, with $0x$ for the missing $x$ term.'
        write: 'Solution'
      - say: 'Negative 1 plus $x$ squared, rearranged, is $x$ squared plus $0x$ minus 1.'
        write: 'Divisor: $-1 + x^{2} = x^{2} + 0x - 1$'
      - section: 'Long division'
        say: 'Divide the first term by the first term. $x$ cubed divided by $x$ squared is $x$. That is the first term of the quotient.'
        write: '$x^{3} \div x^{2} = x$'
      - say: 'Multiply the whole divisor by $x$.'
        write: '$x(x^{2} + 0x - 1) = x^{3} + 0x^{2} - x$'
      - say: 'Subtract it from the first three terms: change the signs and add. $x$ cubed cancels, $7x$ squared stays, and negative $x$ minus negative $x$ is zero. Bring down the negative 7.'
        write: 'Subtract: $7x^{2} + 0x - 7$'
      - say: 'Divide again, first term by first term. $7x$ squared divided by $x$ squared is 7. That is the next term of the quotient.'
        write: '$7x^{2} \div x^{2} = 7$'
      - say: 'Multiply the whole divisor by 7.'
        write: '$7(x^{2} + 0x - 1) = 7x^{2} + 0x - 7$'
      - say: 'Subtract. Everything cancels, so the remainder is zero.'
        write: 'Subtract: remainder $= 0$'
      - say: 'The quotient is $x$ plus 7: the other side of the rectangle.'
        write: '$\therefore$ Quotient $= x + 7$'
        doodle_do:
          - {id: rect, op: label, part: side2, text: 'x + 7'}
        point:
          - {line: 9, kind: highlight, at: 'x + 7', to: {doodle: rect, part: side2}}
      - section: 'Check'
        say: 'Check: quotient times divisor must give back the cubic. $x$ times $x$ squared is $x$ cubed, $x$ times negative 1 is negative $x$, 7 times $x$ squared is $7x$ squared, 7 times negative 1 is negative 7.'
        write: '$(x + 7)(x^{2} - 1) = x^{3} - x + 7x^{2} - 7$'
      - say: 'In descending powers, that is exactly the cubic we started with.'
        write: '$= x^{3} + 7x^{2} - x - 7\ \checkmark$'
      - section: 'Exam tip'
        say: 'Exam tip: grouping is a quicker way. $x$ squared times $x$ plus 7, minus 1 times $x$ plus 7, shows the cubic is $x$ plus 7 times $x$ squared minus 1.'
        write: '$x^{2}(x + 7) - 1(x + 7) = (x + 7)(x^{2} - 1)$'
      - say: 'So the answer is $x$ plus 7: option D.'
        write: '$\therefore x + 7$ (D)'
        answer: true
    traps:
      A: 'You went for negative $x$ cubed plus $7x$ squared minus $x$ minus 7. That is the cubic with one sign changed, not divided at all. A cubic divided by a quadratic leaves a first-degree answer, here $x$ plus 7.'
      B: 'You went for negative $x$ cubed minus $7x$ plus 7. A cubic divided by a quadratic gives a first-degree quotient. The long division gives $x$, then 7: $x$ plus 7.'
      C: 'You went for $x$ minus 7. Check it: $x$ minus 7, times $x$ squared minus 1, gives negative $7x$ squared, not plus $7x$ squared. The quotient is $x$ plus 7.'
  19:
    moments:
      - section: 'The question'
        say: 'A fraction whose top and bottom are themselves fractions. It looks frightening, but simplify the top and the bottom one at a time and it collapses.'
        write: '$\dfrac{\dfrac{1}{p} - \dfrac{1}{q}}{\dfrac{p}{q} - \dfrac{q}{p}}$'
      - section: 'Solution'
        say: 'Simplify the numerator, then the denominator, then divide. For both, the L.C.M. of the denominators is $pq$.'
        write: 'Solution'
      - say: 'Numerator. Over the L.C.M. $pq$, 1 over $p$ is $q$ over $pq$, and 1 over $q$ is $p$ over $pq$. Subtract the tops.'
        write: 'Numerator: $\dfrac{1}{p} - \dfrac{1}{q} = \dfrac{q - p}{pq}$'
      - say: 'Denominator. Over $pq$, $p$ over $q$ is $p$ squared over $pq$, and $q$ over $p$ is $q$ squared over $pq$.'
        write: 'Denominator: $\dfrac{p}{q} - \dfrac{q}{p} = \dfrac{p^{2} - q^{2}}{pq}$'
      - say: 'So the expression is the numerator divided by the denominator.'
        write: '$= \dfrac{q - p}{pq} \div \dfrac{p^{2} - q^{2}}{pq}$'
      - say: 'To divide by a fraction, multiply by its reciprocal.'
        write: '$= \dfrac{q - p}{pq} \times \dfrac{pq}{p^{2} - q^{2}}$'
      - say: 'Cancel the common factor $pq$, top and bottom.'
        write: '$= \dfrac{q - p}{p^{2} - q^{2}}$'
        point:
          - {line: 5, kind: strike, at: '= [[pq]]', text: 'cancel'}
          - {line: 5, kind: strike, at: 'q2[[pq]]'}
      - say: '$p$ squared minus $q$ squared is a difference of two squares: $p$ minus $q$, times $p$ plus $q$.'
        write: '$= \dfrac{q - p}{(p - q)(p + q)}$'
      - say: '$q$ minus $p$ is the negative of $p$ minus $q$: change the order of a subtraction and the sign changes.'
        write: '$= \dfrac{-(p - q)}{(p - q)(p + q)}$'
      - say: 'Now cancel the common factor $p$ minus $q$. The minus sign stays.'
        write: '$\therefore$ Expression $= -\dfrac{1}{p + q}$'
      - section: 'Check'
        say: 'Check with $p$ equals 2 and $q$ equals 1. Numerator: a half minus 1 is negative a half. Denominator: 2 minus a half is 3 over 2.'
        write: '$\left(\tfrac{1}{2} - 1\right) \div \left(2 - \tfrac{1}{2}\right) = -\tfrac{1}{2} \div \tfrac{3}{2}$'
      - say: 'Negative a half divided by 3 over 2 is negative a third. And negative 1 over 2 plus 1 is negative a third. It matches.'
        write: '$= -\tfrac{1}{3}$ and $-\dfrac{1}{2 + 1} = -\tfrac{1}{3}\ \checkmark$'
      - say: 'So the expression simplifies to negative 1 over $p$ plus $q$: option B.'
        write: '$\therefore -\dfrac{1}{p + q}$ (B)'
        answer: true
    traps:
      A: 'You went for 1 over $p$ minus $q$. The denominator factorises as $p$ minus $q$, times $p$ plus $q$, and it is $p$ minus $q$ that cancels, leaving $p$ plus $q$ below, with a minus sign.'
      C: 'You went for 1 over $pq$. The $pq$ cancels when we divide, because it is under both the numerator and the denominator.'
      D: 'You went for 1 over $pq$ times $p$ minus $q$. The $pq$ cancels between top and bottom, and so does $p$ minus $q$, leaving negative 1 over $p$ plus $q$.'
  20:
    moments:
      - section: 'The question'
        say: 'A quadratic inequality. Its answer is usually two stretches of the number line, not one, and the sign table shows which.'
        write: '$y^{2} - 3y > 18$'
      - say: 'Solution. First bring everything to one side, so we compare with zero. Subtract 18 from both sides.'
        write: 'Solution: $\ y^{2} - 3y - 18 > 0$'
      - section: 'Factorise'
        say: 'Factorise by product and sum. The product is 1 times minus 18, which is minus 18. The sum is minus 3. Minus 6 and plus 3 work: they multiply to minus 18 and add to minus 3.'
        write: 'Product $= -18$, $\ $Sum $= -3$: $\ -6,\ +3$'
      - say: 'Split the middle term, minus $3y$, into minus $6y$ plus $3y$.'
        write: '$y^{2} - 6y + 3y - 18 > 0$'
      - say: 'Group in pairs. Take $y$ out of the first pair, and 3 out of the second. The brackets match.'
        write: '$y(y - 6) + 3(y - 6) > 0$'
      - say: 'Take out the common bracket, $y$ minus 6.'
        write: '$(y + 3)(y - 6) > 0$'
      - say: 'The critical values are where each bracket is zero: $y$ equals minus 3 and $y$ equals 6. They split the number line into three regions.'
        write: 'Critical values: $\ y = -3,\ \ y = 6$'
      - section: 'Sign table'
        say: 'Now the sign table. One column for each region, and one row for each bracket, then the product.'
        diagram:
          id: t
          kind: table
          columns: ['Factor', 'y < −3', '−3 < y < 6', 'y > 6']
          rows: [['y + 3', '', '', ''], ['y − 6', '', '', ''], ['product', '', '', '']]
      - say: '$y$ plus 3 is negative below minus 3, and positive above it.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,2', text: '−'}
          - {id: t, op: fill, part: 'cell:1,3', text: '+'}
          - {id: t, op: fill, part: 'cell:1,4', text: '+'}
      - say: '$y$ minus 6 is negative below 6, and positive above it.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:2,2', text: '−'}
          - {id: t, op: fill, part: 'cell:2,3', text: '−'}
          - {id: t, op: fill, part: 'cell:2,4', text: '+'}
      - say: 'Multiply the signs down each column. Minus times minus is plus. Plus times minus is minus. Plus times plus is plus.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:3,2', text: '+', colour: green}
          - {id: t, op: fill, part: 'cell:3,3', text: '−', colour: red}
          - {id: t, op: fill, part: 'cell:3,4', text: '+', colour: green}
      - section: 'Answer'
        say: 'We want the product greater than zero, which means positive. That is the first and last columns.'
        write: '$\therefore\ y < -3$ or $y > 6$'
        point:
          - {line: 1, kind: underline, at: '> 0', text: 'positive'}
      - say: 'On a number line: open circles at minus 3 and 6, because they are not included, with arrows pointing outwards.'
        diagram: {id: n, kind: numberline, range: [-6, 9]}
        diagram_do:
          - {id: n, op: interval, to: -3, to_open: true, text: 'y < −3', answer: true, 'on': 'open circles'}
          - {id: n, op: interval, from: 6, from_open: true, text: 'y > 6', answer: true, 'on': 'arrows'}
      - section: 'Check'
        say: 'Check with $y$ equals 7: 49 minus 21 is 28, more than 18. And $y$ equals 0, in the middle, gives 0, which is not more than 18.'
        write: 'Check: $\ y = 7$: $49 - 21 = 28 > 18\ \checkmark$; $\ y = 0$: $0 > 18\ \times$'
      - say: 'So $y$ is less than minus 3 or greater than 6: option B.'
        write: '$y < -3$ or $y > 6$'
        answer: true
    traps:
      A: 'You went for minus 2 less than $y$ less than 6. A region between the roots is where the product is negative, and minus 2 is not even a critical value. Test $y = 0$: it fails.'
      C: 'You went for $y$ greater than minus 3 or greater than 6. That includes $y = 0$, which fails. The sign table gives $y$ less than minus 3 on the left.'
      D: 'You went for $y$ less than minus 3 or less than 6. That also includes $y = 0$, which fails. The sign table gives $y$ greater than 6 on the right.'
  21:
    moments:
      - section: 'The question'
        say: '$x$ is in a denominator, and $x$ is negative. Multiplying across could reverse the sign. So we bring everything to one side and let a sign table decide.'
        write: '$\dfrac{x + 1}{3} > \dfrac{1}{x + 3},\quad x < 0$'
      - say: 'Solution. Subtract 1 over $x$ plus 3 from both sides, so we compare with zero.'
        write: 'Solution: $\ \dfrac{x + 1}{3} - \dfrac{1}{x + 3} > 0$'
      - say: 'Make one fraction. The L.C.M. of the denominators is 3 times $x$ plus 3.'
        write: '$\dfrac{(x + 1)(x + 3) - 3}{3(x + 3)} > 0$'
      - say: 'Open the brackets on top. $x$ plus 1 times $x$ plus 3 is $x$ squared plus $4x$ plus 3. Minus 3 leaves $x$ squared plus $4x$.'
        write: '$\dfrac{x^{2} + 4x + 3 - 3}{3(x + 3)} = \dfrac{x^{2} + 4x}{3(x + 3)} > 0$'
      - say: 'Factorise the top: take out $x$.'
        write: '$\dfrac{x(x + 4)}{3(x + 3)} > 0$'
      - say: 'Critical values: $x$ is zero at 0, $x$ plus 4 at minus 4, and $x$ plus 3 at minus 3. The 3 outside is positive, so it never changes the sign.'
        write: 'Critical values: $\ x = -4,\ \ x = -3,\ \ x = 0$'
      - section: 'Sign table'
        say: 'Now the sign table. Four regions. Each factor is negative to the left of its critical value and positive to the right.'
        diagram:
          id: t
          kind: table
          columns: ['Factor', 'x < −4', '−4 < x < −3', '−3 < x < 0', 'x > 0']
          rows: [['x', '−', '−', '−', '+'], ['x + 4', '−', '+', '+', '+'], ['x + 3', '−', '−', '+', '+'], ['fraction', '', '', '', '']]
      - say: 'Now the fraction, column by column. Below minus 4: minus times minus over minus is minus. Between minus 4 and minus 3: minus times plus over minus is plus.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,2', text: '−'}
          - {id: t, op: fill, part: 'cell:4,3', text: '+', colour: green}
      - say: 'Between minus 3 and 0: minus times plus over plus is minus. Above 0: all plus, so plus.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,4', text: '−'}
          - {id: t, op: fill, part: 'cell:4,5', text: '+'}
      - section: 'Answer'
        say: 'The fraction is positive in two columns.'
        write: '$-4 < x < -3$ or $x > 0$'
      - say: 'But the question says $x$ is negative, so $x$ greater than 0 is ruled out.'
        write: '$x < 0$: $\ \therefore\ -4 < x < -3$'
      - say: 'On a number line: open circles at minus 4 and minus 3, and the stretch between.'
        diagram: {id: n, kind: numberline, range: [-6, 1]}
        diagram_do:
          - {id: n, op: interval, from: -4, to: -3, from_open: true, to_open: true, text: '−4 < x < −3', answer: true, 'on': 'open circles'}
      - section: 'Check'
        say: 'Check $x$ equals minus 3.5. Minus 2.5 over 3 is about minus 0.83. 1 over minus 0.5 is minus 2. Minus 0.83 is greater than minus 2.'
        write: 'Check $x = -3.5$: $\ \dfrac{-2.5}{3} \approx -0.83 > \dfrac{1}{-0.5} = -2\ \checkmark$'
      - say: 'So $x$ lies between minus 4 and minus 3: option B.'
        write: '$-4 < x < -3$'
        answer: true
    traps:
      A: 'You went for 3 less than $x$ less than 4. The question says $x$ is negative, so positive values are ruled out. The sign table gives minus 4 less than $x$ less than minus 3.'
      C: 'You went for minus 2 less than $x$ less than minus 1. That is in the column from minus 3 to 0, where the fraction is negative. Try $x = -1.5$: the left is about minus 0.17, the right about 0.67, so it fails.'
      D: 'You went for minus 3 less than $x$ less than zero. In that column the fraction is negative. Try $x = -1$: 0 is not greater than a half.'
  22:
    moments:
      - say: 'A man starts on ₦540 a month, and after every six months his salary rises by ₦36 a month: picture it as a staircase, one step for each six months. We want his salary in the eighth month of the third year.'
        write: 'Start: ₦540 a month; rise: ₦36 after every 6 months'
        doodle: {name: 'custom:1993_q22_a', id: stairs, caption: '₦36 more every 6 months', size: scene}
      - say: 'First, which month is that, counting from the very start? Two full years is 24 months, and the eighth month of the third year is 8 months more.'
        write: 'Month number: $24 + 8 = 32$'
      - say: 'Now, when does the salary change? After each six-month period. So a new salary starts in months 7, 13, 19, 25 and 31.'
        write: 'New salary starts in months $7,\ 13,\ 19,\ 25,\ 31$'
      - say: 'Let''s list the bands. Months 1 to 6 pay ₦540. Months 7 to 12 pay 540 plus 36, which is 576.'
        write: 'Months 1–6: ₦540; months 7–12: $540 + 36 = 576$'
      - say: 'Months 13 to 18: 576 plus 36 is 612. Months 19 to 24: 612 plus 36 is 648. Watch him climb to the fourth step.'
        write: 'Months 13–18: $576 + 36 = 612$; months 19–24: $612 + 36 = 648$'
        doodle_do:
          - {id: stairs, op: move, part: man, path: up1}
      - say: 'Months 25 to 30: 648 plus 36 is 684. Months 31 to 36: 684 plus 36 is 720. Up two more steps.'
        write: 'Months 25–30: $648 + 36 = 684$; months 31–36: $684 + 36 = 720$'
        doodle_do:
          - {id: stairs, op: move, part: man, path: up2}
      - say: 'Month 32, the month we found at the start, falls in the band from 31 to 36, the top step. So he earns ₦720 that month.'
        write: 'Month 32 is in months 31–36: ₦720'
        doodle_do:
          - {id: stairs, op: label, part: last, text: '₦720'}
        point:
          - {line: 1, kind: circle, at: '= 32', text: 'our month'}
          - {line: 6, kind: highlight, at: '720', to: {doodle: stairs, part: last}}
      - say: 'Another way to see it: count the rises, the steps he has climbed by month 32. They came in months 7, 13, 19, 25 and 31, which is five rises. 5 times 36 is 180.'
        write: 'Five rises: $5 \times 36 = 180$'
        doodle_do:
          - {id: stairs, op: highlight, part: rises}
      - say: 'Add that to the starting salary: 540 plus 180 is 720. The same answer.'
        write: '$540 + 180 = 720$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= [[180]]'}, at: '180', text: 'five rises'}
      - say: 'So his salary is ₦720.00, which is answer choice C.'
        write: 'Answer: ₦720.00'
        answer: true
    traps:
      A: 'You went for ₦828. That is 8 rises: 540 plus 288. But by month 32 only five rises have happened, one at the start of months 7, 13, 19, 25 and 31.'
      B: 'You went for ₦756. That is six rises. Month 32 is in the sixth band, but the first band had no rise, so only five increases have taken place.'
      D: 'You went for ₦684. That is the salary for months 25 to 30. There''s one more rise at month 31, so month 32 pays ₦720.'
  23:
    moments:
      - say: 'We''re told $k + 1$, $2k - 1$ and $3k + 1$ are three terms in a row of a geometric progression. We want the possible common ratios.'
        write: '$k + 1, \ 2k - 1, \ 3k + 1$'
      - say: 'In a geometric progression, each term divided by the one before gives the same common ratio.'
        write: 'GP: $\dfrac{\text{2nd term}}{\text{1st term}} = \dfrac{\text{3rd term}}{\text{2nd term}}$'
      - say: 'Here the three terms are $k + 1$, $2k - 1$ and $3k + 1$. So the second term over the first equals the third term over the second.'
        write: '$\dfrac{2k - 1}{k + 1} = \dfrac{3k + 1}{2k - 1}$'
      - say: 'Cross-multiply. The middle term squared equals the product of the outer two.'
        write: '$(2k - 1)^{2} = (k + 1)(3k + 1)$'
      - say: 'Expand the left. $2k$ squared is $4k$ squared, twice $2k$ times negative 1 is negative $4k$, and negative 1 squared is 1.'
        write: 'Left: $(2k - 1)^{2} = 4k^{2} - 4k + 1$'
      - say: 'Expand the right. $k$ times $3k$ is $3k$ squared. $k$ times 1 is $k$, and 1 times $3k$ is $3k$, which together make $4k$. And 1 times 1 is 1.'
        write: 'Right: $(k + 1)(3k + 1) = 3k^{2} + k + 3k + 1 = 3k^{2} + 4k + 1$'
      - say: 'Now set the two expanded sides equal.'
        write: 'So $4k^{2} - 4k + 1 = 3k^{2} + 4k + 1$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '= [[4k2 − 4k + 1]]'}, at: '4k2 − 4k + 1', text: 'left'}
          - {line: 6, kind: move, from: {line: 5, at: '= [[3k2 + 4k + 1]]'}, at: '3k2 + 4k + 1', text: 'right'}
      - say: 'Subtract $3k$ squared, $4k$ and 1 from both sides. $4k$ squared minus $3k$ squared is $k$ squared, and negative $4k$ minus $4k$ is negative $8k$.'
        write: '$k^{2} - 8k = 0$'
      - say: 'Both terms contain $k$, so factor it out.'
        write: '$k(k - 8) = 0$'
      - say: 'So $k$ is 0, or $k - 8$ is 0, which means $k$ is 8.'
        write: '$k = 0 \quad \text{or} \quad k = 8$'
      - say: 'But the question wants the common ratio, not $k$. Put $k = 0$ back into the three terms: 0 plus 1 is 1, 0 minus 1 is negative 1, and 0 plus 1 is 1.'
        write: '$k = 0$: terms $1,\ -1,\ 1$'
        point:
          - {line: 9, kind: circle, at: 'k = 0'}
      - say: 'The ratio is the second term over the first: negative 1 over 1, which is negative 1.'
        write: 'Ratio $r = \dfrac{-1}{1} = -1$'
