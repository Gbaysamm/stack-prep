        write: 'Pythagoras: $\text{hypotenuse}^{2} = \text{opposite}^{2} + \text{adjacent}^{2}$'
      - say: 'Here the hypotenuse is $OQ$, and the other two sides are $ST$ and 7.'
        write: 'Here: hypotenuse $= OQ$, other sides $= ST$ and $7$'
      - say: 'Pythagoras says the hypotenuse squared equals the sum of the squares of the other two sides.'
        write: '$OQ^{2} = ST^{2} + 7^{2}$'
