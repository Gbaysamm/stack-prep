      - say: 'The proportion 7 gets 7 of those shares.'
        write: 'Sector for 7 $= 7 \times 20^{\circ}$'
        doodle_do:
          - {id: shares, op: group, n: 7, text: 'proportion 7: 7 shares'}
        point:
          - {line: 6, kind: move, from: {line: 5, at: '20∘'}, at: '20∘', text: 'one share'}
          - {figure: sketch, kind: circle, target: '7', text: '7 × 20°'}
      - say: '7 times 20 is 140.'
        write: '$= 140^{\circ}$'
      - say: 'Let''s check that the sectors fill the circle. The others are 1 times 20, which is 20, 4 times 20, which is 80, and 6 times 20, which is 120.'
        write: 'Others: $1 \times 20 = 20, \ 4 \times 20 = 80, \ 6 \times 20 = 120$'
      - say: '20 plus 80 plus 120 plus 140 is 360, the whole circle.'
        write: 'Check: $20 + 80 + 120 + 140 = 360$'
      - say: 'So the sector for the proportion 7 has an angle of 140 degrees, which is answer choice D.'
        write: 'Answer: $140^{\circ}$'
        answer: true
        point:
          - {figure: sketch, kind: circle, target: '?°', text: '140°'}
    traps:
      A: 'You went for 20 degrees. That''s the sector for the proportion 1. We want proportion 7, which is 7 times 20.'
      B: 'You went for 80 degrees. That''s the sector for the proportion 4. The question asks for proportion 7.'
      C: 'You went for 120 degrees. That''s the sector for the proportion 6. The proportion 7 gets 7 times 20, which is 140.'
  43:
    moments:
      - say: 'The bar chart shows the marks in a class test. We want the number of students who took the test.'
        point:
          - {figure: 0, kind: 'circle', target: 'Marks'}
