        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '7', text: 'this sector'}
      - say: 'A pie chart shares out the full 360 degrees in these proportions. First, let''s add up the proportions to see how many equal shares there are altogether: picture each share as a coin.'
        write: 'Total shares $= 1 + 4 + 6 + 7$'
