  31:
    moments:
      - section: 'The question'
        say: 'We have a tangent and a pair of parallel lines. Each one moves a given angle into triangle $QUR$, and then the angle sum gives $x$.'
        write: '$\angle TUR = 35^{\circ}$, $\angle SRU = 50^{\circ}$, $QU \parallel RS$, $x = ?$'
        point:
          - {figure: 0, kind: arc, target: TUR, text: '35°'}
          - {figure: 0, kind: arc, target: SRU, text: '50°'}
          - {figure: 0, kind: circle, target: x}
