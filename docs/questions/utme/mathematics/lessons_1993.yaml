# UTME 1993 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1993.yaml. Answers match that file.
format_version: 1
exam_year: 1993
lessons:
  1:
    moments:
      - say: 'We''re asked to change 71 in base ten into base 8.'
        write: '$71_{10} = ?_{8}$'
      - say: 'To change a number out of base ten, we divide by the new base again and again, and write down the remainder each time.'
      - say: 'So let''s divide 71 by 8. 8 times 8 is 64, and 71 minus 64 is 7. So 71 divided by 8 is 8, remainder 7.'
        write: '$71 \div 8 = 8 \text{ remainder } 7$'
      - say: 'Now we divide the 8 we got by 8 again. 8 divided by 8 is exactly 1, remainder zero.'
        write: '$8 \div 8 = 1 \text{ remainder } 0$'
      - say: 'And one more time. 1 divided by 8 is zero, remainder 1. Once we reach zero, we stop.'
        write: '$1 \div 8 = 0 \text{ remainder } 1$'
      - say: 'Now read the remainders from the bottom up: 1, then 0, then 7.'
        write: '$71_{10} = 107_{8}$'
      - say: 'Let''s check by going back to base ten. The place values in base 8 are 64, 8 and 1.'
        write: '$107_{8} = (1 \times 64) + (0 \times 8) + (7 \times 1)$'
      - say: '1 times 64 is 64. 0 times 8 is 0. 7 times 1 is 7. 64 plus 0 plus 7 is 71. It works.'
        write: '$= 64 + 0 + 7 = 71$'
      - say: 'So 71 in base ten is 1 0 7 in base 8, which is answer choice A.'
        write: '$107_{8}$'
        answer: true
    traps:
      B: 'You went for 1 0 6 base 8. That is 64 plus 6, which is 70 — one short. The last remainder is 7, because 71 minus 64 is 7.'
      C: 'You went for 7 1 base 8. That just copies the digits and changes the label. 7 1 in base 8 is 7 eights plus 1, which is 57, not 71.'
      D: 'You went for 1 7 base 8. You dropped the zero in the middle. That zero holds the eights place; without it, 1 7 base 8 is only 15.'
  2:
    moments:
      - say: 'We need to work out 3524 divided by 0.05, and give the answer correct to 3 significant figures.'
        write: '$\dfrac{3524}{0.05}$'
      - say: 'Dividing by a decimal is awkward, so the first thing we do is clear the decimal. Multiply the top and the bottom by 100.'
        write: '$\dfrac{3524 \times 100}{0.05 \times 100}$'
      - say: '3524 times 100 is 352,400. 0.05 times 100 is 5.'
        write: '$= \dfrac{352400}{5}$'
      - say: 'Now divide by 5. 35 divided by 5 is 7. 2 divided by 5 is 0 remainder 2. 24 divided by 5 is 4 remainder 4. 40 divided by 5 is 8. And the last 0 gives 0.'
        write: '$= 70480$'
      - say: 'That is the exact value. But the question wants 3 significant figures. The first three significant digits are 7, 0 and 4.'
        write: '$70\,4 \mid 80$'
      - say: 'Look at the next digit. It is 8, which is 5 or more, so the 4 rounds up to 5.'
        write: '$4 \to 5$'
      - say: 'The places after it become zeros, to keep the size of the number.'
        write: '$70480 \approx 70500$'
      - say: 'A quick size check: dividing by 0.05 is the same as multiplying by 20, and 20 times about 3500 is about 70,000. That fits.'
        write: '$3524 \times 20 = 70480$'
      - say: 'So the answer, correct to 3 significant figures, is 70,500, which is answer choice D.'
        write: '$70500$'
        answer: true
    traps:
      A: 'You went for 705. Those are the right three digits, but the zeros that hold the place were dropped. The answer is about 70 thousand, not 705.'
      B: 'You went for 70,000. That is 70,480 rounded to 1 or 2 significant figures. For 3 significant figures we keep 7, 0 and 4, and the 4 rounds up to 5.'
      C: 'You went for 70,480. That is the exact value, which has 5 significant figures. The question asks us to round it to 3.'
  3:
    moments:
      - say: 'We have 9 to the power $x - \tfrac{1}{2}$ equals 3 to the power $x^{2}$, and we want $x$.'
        write: '$9^{(x - 1/2)} = 3^{x^{2}}$'
      - say: 'The two sides have different bases, 9 and 3. We can only compare powers when the bases are the same. Since 9 is 3 squared, let''s write 9 as $3^{2}$.'
        write: '$\left(3^{2}\right)^{(x - 1/2)} = 3^{x^{2}}$'
      - say: 'A power of a power means we multiply the indices. So the index on the left becomes 2 times the bracket $x - \tfrac{1}{2}$.'
        write: '$3^{2(x - 1/2)} = 3^{x^{2}}$'
      - say: '2 times $x$ is $2x$, and 2 times a half is 1. So the index is $2x - 1$.'
        write: '$3^{2x - 1} = 3^{x^{2}}$'
      - say: 'Now the bases are both 3, so the indices must be equal.'
        write: '$2x - 1 = x^{2}$'
      - say: 'Let''s bring everything to one side. Subtract $2x$ and add 1 to both sides.'
        write: '$x^{2} - 2x + 1 = 0$'
      - say: 'This is a perfect square. Two numbers that multiply to 1 and add to negative 2 are negative 1 and negative 1.'
        write: '$(x - 1)(x - 1) = 0$'
      - say: 'So $x - 1$ squared is zero.'
        write: '$(x - 1)^{2} = 0$'
      - say: 'That means $x - 1$ is zero, so $x$ is 1.'
        write: '$x = 1$'
      - say: 'Let''s check. On the left, 1 minus a half is a half, and 9 to the power a half is the square root of 9, which is 3.'
        write: '$9^{1/2} = 3$'
      - say: 'On the right, 1 squared is 1, and 3 to the power 1 is 3. Both sides are 3.'
        write: '$3^{1^{2}} = 3^{1} = 3$'
      - say: 'So $x$ equals 1, which is answer choice B.'
        write: '$x = 1$'
        answer: true
    traps:
      A: 'You went for a half. Try it: 9 to the power zero is 1, but 3 to the power one quarter is not 1. Write 9 as 3 squared and equate the indices; you get $(x-1)^2 = 0$.'
      C: 'You went for 2. Then the left side is 9 to the power 1.5, which is 27, and the right side is 3 to the power 4, which is 81. They don''t match.'
      D: 'You went for 3. Then the left is 9 to the power 2.5, which is 243, but the right is 3 to the power 9. Make the bases equal and the quadratic gives $x = 1$ only.'
  4:
    moments:
      - say: 'We have 10 to the $y$, times 5 to the $2y - 2$, times 4 to the $y - 1$, all equal to 1. We need $y$.'
        write: '$10^{y} \times 5^{(2y - 2)} \times 4^{(y - 1)} = 1$'
      - say: 'There are three different bases here. The plan is to break every base down into its prime factors, which are 2 and 5.'
      - say: 'First, 10 is 2 times 5. So 10 to the $y$ is 2 to the $y$ times 5 to the $y$.'
        write: '$10^{y} = 2^{y} \times 5^{y}$'
      - say: '5 to the $2y - 2$ is already a power of 5, so we leave it.'
        write: '$5^{(2y - 2)}$'
      - say: 'Next, 4 is 2 squared. A power of a power multiplies the indices, so 4 to the $y - 1$ is 2 to the $2y - 2$.'
        write: '$4^{(y - 1)} = \left(2^{2}\right)^{(y - 1)} = 2^{(2y - 2)}$'
      - say: 'Now collect the powers of 2. We add the indices: $y$ plus $2y - 2$ is $3y - 2$.'
        write: '$2^{y} \times 2^{(2y - 2)} = 2^{(3y - 2)}$'
      - say: 'Collect the powers of 5 the same way: $y$ plus $2y - 2$ is again $3y - 2$.'
        write: '$5^{y} \times 5^{(2y - 2)} = 5^{(3y - 2)}$'
      - say: 'So the left side is 2 to the $3y - 2$ times 5 to the $3y - 2$. Same index, so we can put 2 times 5 back together as 10.'
        write: '$2^{(3y - 2)} \times 5^{(3y - 2)} = 10^{(3y - 2)}$'
      - say: 'So the equation is 10 to the $3y - 2$ equals 1.'
        write: '$10^{(3y - 2)} = 1$'
      - say: 'Any number to the power zero is 1. So 1 is 10 to the power zero.'
        write: '$10^{(3y - 2)} = 10^{0}$'
      - say: 'The bases match, so the indices are equal: $3y - 2$ equals zero.'
        write: '$3y - 2 = 0$'
      - say: 'Add 2 to both sides: $3y$ equals 2.'
        write: '$3y = 2$'
      - say: 'Divide both sides by 3. So $y$ is two thirds, which is answer choice B.'
        write: '$y = \dfrac{2}{3}$'
        answer: true
    traps:
      A: 'You went for three quarters. Check the index: the powers of 2 and 5 each come to $3y - 2$, so we need $3y = 2$, not $4y = 3$.'
      C: 'You went for 1. Then the index $3y - 2$ is 1, and 10 to the power 1 is 10, not 1. The index must be zero.'
      D: 'You went for five quarters. Break every base into 2s and 5s; both indices come to $3y - 2$, and setting that to zero gives two thirds.'
  5:
    moments:
      - say: 'We want to simplify 1 over root 3 minus 2, minus 1 over root 3 plus 2.'
        write: '$\dfrac{1}{\sqrt{3} - 2} - \dfrac{1}{\sqrt{3} + 2}$'
      - say: 'To subtract two fractions, we put them over a common denominator. The common denominator is the two bottoms multiplied together.'
        write: '$= \dfrac{(\sqrt{3} + 2) - (\sqrt{3} - 2)}{(\sqrt{3} - 2)(\sqrt{3} + 2)}$'
      - say: 'Let''s do the bottom first. It''s a difference of two squares: the first term squared minus the second term squared.'
        write: '$(\sqrt{3} - 2)(\sqrt{3} + 2) = (\sqrt{3})^{2} - 2^{2}$'
      - say: 'Root 3 squared is 3. 2 squared is 4. 3 minus 4 is negative 1.'
        write: '$= 3 - 4 = -1$'
      - say: 'Now the top. Open the second bracket carefully: minus root 3, and minus negative 2 is plus 2.'
        write: '$\sqrt{3} + 2 - \sqrt{3} + 2$'
      - say: 'The root 3s cancel, and 2 plus 2 is 4.'
        write: '$= 4$'
      - say: 'So the whole expression is 4 over negative 1.'
        write: '$\dfrac{4}{-1}$'
      - say: '4 divided by negative 1 is negative 4, which is answer choice D.'
        write: '$= -4$'
        answer: true
    traps:
      A: 'You went for 4. The top is 4, but the bottom is 3 minus 4, which is negative 1. Dividing by negative 1 flips the sign.'
      B: 'You went for two thirds. The surds cancel completely: the top is 4 and the bottom is negative 1, so there''s no 3 left to divide by.'
      C: 'You went for zero. The two fractions are not equal, so they don''t cancel. When you subtract the second bracket, minus negative 2 becomes plus 2, giving 4 on top.'
  6:
    moments:
      - say: 'We''re told 2 log base 3 of $y$ plus log base 3 of $x^{2}$ equals 4, and we want $y$.'
        write: '$2\log_{3}y + \log_{3}x^{2} = 4$'
      - say: 'First, the power law. A number in front of a log can go inside as a power. So 2 log $y$ becomes log of $y^{2}$.'
        write: '$\log_{3}y^{2} + \log_{3}x^{2} = 4$'
      - say: 'Next, adding two logs with the same base gives the log of the product.'
        write: '$\log_{3}\left(x^{2}y^{2}\right) = 4$'
      - say: 'Now change from log form to index form. Log base 3 of something equals 4 means that something is 3 to the power 4.'
        write: '$x^{2}y^{2} = 3^{4}$'
      - say: '3 to the power 4 is 3 times 3 times 3 times 3, which is 81.'
        write: '$x^{2}y^{2} = 81$'
      - say: '$x^{2}$ times $y^{2}$ is the same as $xy$ all squared.'
        write: '$(xy)^{2} = 81$'
      - say: 'Take the square root of both sides. The square root of 81 is 9, and we must keep both signs, plus and minus.'
        write: '$xy = \pm 9$'
      - say: 'Divide both sides by $x$ to get $y$ by itself. So $y$ is plus or minus 9 over $x$, which is answer choice D.'
        write: '$y = \pm\dfrac{9}{x}$'
        answer: true
    traps:
      A: 'You went for 4 minus log $x^{2}$, over 2. That gives log base 3 of $y$, not $y$ itself. We still have to change from logs back to numbers.'
      B: 'You went for 4 over log $x^{2}$. That treats the log like a number you can divide by. Combine the logs first, then change to index form.'
      C: 'You went for 2 over $x$. The 4 on the right is a power of 3, so $x^2y^2$ is 81, not 4. Then the square root gives plus or minus 9.'
  7:
    moments:
      - say: 'Without tables, we need log base 5 of 62.5, minus log base 5 of a half.'
        write: '$\log_{5}(62.5) - \log_{5}\left(\tfrac{1}{2}\right)$'
      - say: 'When we subtract two logs with the same base, we get the log of the division.'
        write: '$= \log_{5}\left(62.5 \div \tfrac{1}{2}\right)$'
      - say: 'Dividing by a half is the same as multiplying by 2.'
        write: '$= \log_{5}(62.5 \times 2)$'
      - say: '62.5 times 2 is 125.'
        write: '$= \log_{5}125$'
      - say: 'Now, log base 5 of 125 asks: what power of 5 gives 125? 5 times 5 is 25, and 25 times 5 is 125.'
        write: '$5 \times 5 \times 5 = 125$'
      - say: 'So 125 is 5 to the power 3.'
        write: '$\log_{5}5^{3}$'
      - say: 'So the answer is 3, which is answer choice A.'
        write: '$= 3$'
        answer: true
    traps:
      B: 'You went for 4. 5 to the power 4 is 625, not 125. Dividing 62.5 by a half gives 125, which is 5 cubed.'
      C: 'You went for 5. 5 to the power 5 is 3125, far too big. Combine the logs into log base 5 of 125 and count the 5s.'
      D: 'You went for 8. Log base 5 of 125 asks for the power, not for a product of numbers. Since 125 is 5 cubed, the answer is 3.'
  8:
    moments:
      - say: '₦225 earns ₦27 simple interest in $x$ years at 4% per year. We want $x$.'
      - say: 'Simple interest is principal times rate times time, over 100.'
        write: '$I = \dfrac{PRT}{100}$'
      - say: 'The interest $I$ is 27. The principal $P$ is 225. The rate $R$ is 4. The time is $x$.'
        write: '$27 = \dfrac{225 \times 4 \times x}{100}$'
      - say: '225 times 4 is 900.'
        write: '$27 = \dfrac{900x}{100}$'
      - say: '900 divided by 100 is 9.'
        write: '$27 = 9x$'
      - say: 'Divide both sides by 9. 27 divided by 9 is 3.'
        write: '$x = 3$'
      - say: 'Let''s check. 4% of ₦225 is ₦9 a year. In 3 years, that''s 3 times 9, which is ₦27. Correct.'
        write: '$3 \times 9 = 27$'
      - say: 'So $x$ is 3 years, which is answer choice A.'
        write: '$x = 3 \text{ years}$'
        answer: true
    traps:
      B: 'You went for 4. That''s the rate, not the time. The interest is ₦9 a year, and ₦27 needs 3 years.'
      C: 'You went for 12. Check it: 12 years at ₦9 a year would give ₦108 interest, not ₦27.'
      D: 'You went for 27. That''s the interest itself. Put it into $I = PRT/100$ and solve for the time.'
  9:
    moments:
      - say: 'In the diagram there are three circles, $X$, $Y$ and $Z$, and one region is shaded. We want to name it.'
      - say: 'The calm way to do this is to ask about each circle in turn: is the shading inside it, or outside it?'
      - say: 'First, $X$, the circle at the top left. The shading is inside $X$.'
        write: '$\text{in } X$'
      - say: 'Next, $Y$, the circle at the top right. The edge of $Y$ cuts across, and the shading stops there. So the shading is outside $Y$. Outside $Y$ is written $Y$ complement.'
        write: '$\text{not in } Y: \ Y^{c}$'
      - say: 'Last, $Z$, the lower circle. The shading is inside $Z$.'
        write: '$\text{in } Z$'
      - say: 'So a point in the shaded part is in $X$, and in $Y$ complement, and in $Z$. And means intersection.'
        write: '$X \cap Y^{c} \cap Z$'
      - say: 'So the shaded portion is $X$ intersect $Y$ complement intersect $Z$, which is answer choice C.'
        write: '$X \cap Y^{c} \cap Z$'
        answer: true
    traps:
      A: 'You went for $X \cap Z$. That is the whole overlap of $X$ and $Z$, including the middle part that is also inside $Y$. That middle part isn''t shaded.'
      B: 'You went for $X^c \cap Y \cap Z$. That region is outside $X$ but inside $Y$ and $Z$, on the right. The shading is inside $X$ and outside $Y$.'
      D: 'You went for $X \cap Y \cap Z^c$. That is the patch inside $X$ and $Y$ but outside $Z$, at the top. The shaded part is inside $Z$ and outside $Y$.'
  10:
    moments:
      - say: 'We have the square root of $x^{2} + 9$ equals $x + 1$, and we want $x$.'
        write: '$\sqrt{x^{2} + 9} = x + 1$'
      - say: 'To remove a square root, we square both sides.'
        write: '$x^{2} + 9 = (x + 1)^{2}$'
      - say: 'Now expand $x + 1$ squared properly. It''s $x + 1$ times $x + 1$, which is $x^{2}$ plus $2x$ plus 1.'
        write: '$(x + 1)^{2} = x^{2} + 2x + 1$'
      - say: 'So the equation becomes this.'
        write: '$x^{2} + 9 = x^{2} + 2x + 1$'
      - say: 'There''s $x^{2}$ on both sides, so subtract $x^{2}$ from both sides. It cancels.'
        write: '$9 = 2x + 1$'
      - say: 'Subtract 1 from both sides. 9 minus 1 is 8.'
        write: '$2x = 8$'
      - say: 'Divide both sides by 2. 8 divided by 2 is 4.'
        write: '$x = 4$'
      - say: 'Squaring can create false answers, so we must check. On the left, 4 squared is 16, plus 9 is 25, and the square root of 25 is 5.'
        write: '$\sqrt{16 + 9} = \sqrt{25} = 5$'
      - say: 'On the right, 4 plus 1 is 5. Both sides are 5.'
        write: '$4 + 1 = 5$'
      - say: 'So $x$ is 4, which is answer choice B.'
        write: '$x = 4$'
        answer: true
    traps:
      A: 'You went for 5. That''s the value of each side when $x$ is 4, not $x$ itself. Check 5: root of 34 is not 6.'
      C: 'You went for 3. Then the left is root of 18 and the right is 4. They don''t match. Expand $(x+1)^2$ fully and you get $x = 4$.'
      D: 'You went for 1. Then the left is root 10 and the right is 2. Square both sides and expand the bracket in full: $9 = 2x + 1$.'
  11:
    moments:
      - say: 'We need to make $x$ the subject of 1 plus $ax$, over 1 minus $ax$, equals $p$ over $q$.'
        write: '$\dfrac{1 + ax}{1 - ax} = \dfrac{p}{q}$'
      - say: '$x$ is on the top and on the bottom. So first we clear the fractions by cross-multiplying.'
        write: '$q(1 + ax) = p(1 - ax)$'
      - say: 'Now expand both brackets. $q$ times 1 is $q$, and $q$ times $ax$ is $aqx$. $p$ times 1 is $p$, and $p$ times negative $ax$ is negative $apx$.'
        write: '$q + aqx = p - apx$'
      - say: 'Let''s gather the $x$ terms on the left. Add $apx$ to both sides.'
        write: '$q + aqx + apx = p$'
      - say: 'Now move the $q$ to the right by subtracting $q$ from both sides.'
        write: '$aqx + apx = p - q$'
      - say: 'Both terms on the left have $ax$ in them, so factor out $ax$.'
        write: '$ax(q + p) = p - q$'
      - say: 'To get $x$ by itself, divide both sides by $a$ times $p + q$.'
        write: '$x = \dfrac{p - q}{a(p + q)}$'
      - say: 'Let''s check with numbers. Take $a = 1$ and $x = \tfrac{1}{3}$. Then the top is four thirds and the bottom is two thirds, so $p$ over $q$ is 2. Let $p = 2$ and $q = 1$.'
        write: '$\dfrac{4/3}{2/3} = 2$'
      - say: 'Our formula gives 2 minus 1, over 2 plus 1, which is one third. That matches.'
        write: '$\dfrac{2 - 1}{2 + 1} = \dfrac{1}{3}$'
      - say: 'So $x$ is $p - q$ over $a$ times $p + q$, which is answer choice B.'
        write: '$x = \dfrac{p - q}{a(p + q)}$'
        answer: true
    traps:
      A: 'You went for $p + q$ over $a(p - q)$. The two brackets are upside down. After collecting, the $x$ terms add to $ax(p + q)$, and the constants give $p - q$.'
      C: 'You went for $p - q$ over $apq$. The $p$ and $q$ come from adding $aqx$ and $apx$, so we factor out $ax$ and get $p + q$, not $pq$.'
      D: 'You went for $pq$ over $a(p - q)$. Cross-multiply and expand carefully; the right side after collecting is $p - q$, not $pq$.'
  12:
    moments:
      - say: 'We want a factor of 15 plus $7x$ minus $2x^{2}$.'
        write: '$15 + 7x - 2x^{2}$'
      - say: 'It''s written back to front. Let''s reorder it with the $x^{2}$ term first.'
        write: '$= -2x^{2} + 7x + 15$'
      - say: 'A negative leading term is awkward, so take out negative 1.'
        write: '$= -(2x^{2} - 7x - 15)$'
      - say: 'Now factorise the bracket. Multiply the first and last numbers: 2 times negative 15 is negative 30. We need two numbers that multiply to negative 30 and add to negative 7.'
        write: '$2 \times (-15) = -30$'
      - say: 'Negative 10 and 3 work. Negative 10 times 3 is negative 30, and negative 10 plus 3 is negative 7.'
        write: '$-10 + 3 = -7$'
      - say: 'So split the middle term, negative $7x$, into negative $10x$ plus $3x$.'
        write: '$2x^{2} - 10x + 3x - 15$'
      - say: 'Group in pairs. From the first pair take out $2x$, and from the second take out 3.'
        write: '$= 2x(x - 5) + 3(x - 5)$'
      - say: 'Both parts have $x - 5$, so take it out.'
        write: '$= (2x + 3)(x - 5)$'
      - say: 'So the expression is negative, times $2x + 3$, times $x - 5$.'
        write: '$15 + 7x - 2x^{2} = -(2x + 3)(x - 5)$'
      - say: 'Let''s check that $x - 5$ really is a factor: put $x = 5$ in. 7 times 5 is 35, and 2 times 25 is 50. 15 plus 35 minus 50 is zero.'
        write: '$15 + 35 - 50 = 0$'
      - say: 'So $x - 5$ is a factor, which is answer choice C.'
        write: '$x - 5$'
        answer: true
    traps:
      A: 'You went for $x - 3$. Put $x = 3$ in: 15 plus 21 minus 18 is 18, not zero. So $x - 3$ is not a factor.'
      B: 'You went for $x + 3$. Put $x = -3$ in: 15 minus 21 minus 18 is negative 24, not zero. The factor with 3 in it is $2x + 3$, not $x + 3$.'
      D: 'You went for $x + 5$. The root that goes with $x + 5$ is negative 5, and that gives negative 70. The root is positive 5, so the factor is $x - 5$.'
  13:
    moments:
      - say: 'We need to evaluate $x$ plus 1 over $x$ plus 1, all squared, minus $x$ minus 1 over $x$ minus 1, all squared.'
        write: '$\left(x + \dfrac{1}{x} + 1\right)^{2} - \left(x - \dfrac{1}{x} - 1\right)^{2}$'
      - say: 'Expanding both squares would take ages. Instead, notice it''s one thing squared minus another thing squared. That''s a difference of two squares.'
        write: '$A^{2} - B^{2} = (A + B)(A - B)$'
      - say: 'Let''s call the first bracket $A$ and the second bracket $B$.'
        write: '$A = x + \dfrac{1}{x} + 1, \quad B = x - \dfrac{1}{x} - 1$'
      - say: 'First, $A$ plus $B$. $x$ plus $x$ is $2x$. 1 over $x$ minus 1 over $x$ is zero. 1 minus 1 is zero.'
        write: '$A + B = 2x$'
      - say: 'Now $A$ minus $B$. $x$ minus $x$ is zero. 1 over $x$ minus negative 1 over $x$ is 2 over $x$. 1 minus negative 1 is 2.'
        write: '$A - B = \dfrac{2}{x} + 2$'
      - say: 'So the expression is $A + B$ times $A - B$.'
        write: '$= 2x\left(\dfrac{2}{x} + 2\right)$'
      - say: 'Multiply out. $2x$ times 2 over $x$: the $x$ cancels, leaving 4. And $2x$ times 2 is $4x$.'
        write: '$= 4 + 4x$'
      - say: 'Take out the common factor of 4.'
        write: '$= 4(1 + x)$'
      - say: 'So the answer is 4 times $1 + x$, which is answer choice D.'
        write: '$4(1 + x)$'
        answer: true
    traps:
      A: 'You went for $4x^{2}$. The sum $A + B$ is $2x$, but the difference $A - B$ is $\tfrac{2}{x} + 2$, not $2x$. Multiply those two.'
      B: 'You went for $(\tfrac{2}{x} + 2)^2$. That is $A - B$ squared. The difference of two squares is $(A + B)$ times $(A - B)$, and $A + B$ is $2x$.'
      C: 'You went for 4. That''s only part of it. $2x$ times $\tfrac{2}{x}$ gives 4, but $2x$ times 2 gives another $4x$.'
  14:
    moments:
