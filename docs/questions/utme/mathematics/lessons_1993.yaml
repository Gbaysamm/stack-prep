        write: '$= 5 + 6 + 7 = 11 + 7 = 18$'
        doodle_do:
          - {id: shares, op: count}
      - say: 'So the whole circle, 360 degrees, is split into 18 equal shares. One share is 360 divided by 18.'
        write: 'One share $= \dfrac{360^{\circ}}{18}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= [[18]]'}, at: '18', text: 'total'}
