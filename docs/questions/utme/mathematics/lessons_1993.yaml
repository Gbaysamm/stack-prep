          - {line: 7, kind: highlight, at: '14', to: {doodle: trays, part: atleast}}
      - say: 'So 14 students scored at least 50, which is answer choice D.'
        write: 'Answer: $14$'
        answer: true
    traps:
      A: 'You went for 6. That''s the number who scored below 50. The question asks for those who scored at least 50: 20 minus 6.'
      B: 'You went for 10. That''s half the class, but the marks aren''t split evenly. Only six are below 50, so 14 are at least 50.'
      C: 'You went for 13. You left out the student who scored exactly 50. At least 50 includes 50, so the count is 14.'
  45:
    moments:
      - say: 'Picture coconuts being weighed in grams and sorted into piles. We want to estimate the mode of their weights in the table.'
        write: '$10,\ 27,\ 19,\ 6,\ 2$'
        doodle: {name: 'custom:1993_q45_a', id: nuts, caption: 'coconuts weighed in grams', size: scene}
      - say: 'The modal class is the class with the highest frequency, the tallest pile. The biggest number of coconuts is 27, in the class 10 to 20 grams.'
        write: 'Modal class (highest frequency, 27): $10\text{–}20$ g'
        doodle_do:
          - {id: nuts, op: circle, part: c2}
      - say: 'The mode lies somewhere inside that class. It leans towards whichever neighbouring class has more coconuts. For grouped data, we estimate it with this formula.'
        write: 'Mode $= L + \left(\dfrac{f_{1} - f_{0}}{(f_{1} - f_{0}) + (f_{1} - f_{2})}\right) \times c$'
      - say: '$L$ is the lower boundary of the modal class, 10. $f_{1}$ is the modal frequency, 27. $f_{0}$ is the pile before, 10. $f_{2}$ is the pile after, 19. And $c$ is the class width, 10.'
        write: '$L = 10, \ f_{1} = 27, \ f_{0} = 10, \ f_{2} = 19, \ c = 10$'
        doodle_do:
          - {id: nuts, op: highlight, part: c1}
          - {id: nuts, op: highlight, part: c3}
      - say: 'First difference: the modal frequency minus the class before. 27 minus 10 is 17.'
        write: '$f_{1} - f_{0} = 27 - 10 = 17$'
      - say: 'Second difference: the modal frequency minus the class after. 27 minus 19 is 8.'
        write: '$f_{1} - f_{2} = 27 - 19 = 8$'
      - say: 'So the fraction in the formula is 17, over 17 plus 8, which is 17 over 25.'
        write: 'Fraction $= \dfrac{17}{17 + 8} = \dfrac{17}{25}$'
      - say: 'Now put everything into the formula: 10, plus 17 over 25 times 10.'
        write: 'Mode $= 10 + \dfrac{17}{25} \times 10$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {line: 7, kind: move, from: {line: 3, at: 'L = [[10]]'}, at: '= [[10]] +', text: 'L'}
          - {line: 7, kind: move, from: {line: 6, at: '= [[2517]]'}, at: '2517', text: 'fraction'}
      - say: '17 over 25 is 0.68, because 25 times 4 is 100 and 17 times 4 is 68. And 0.68 times 10 is 6.8.'
        write: '$= 10 + 0.68 \times 10 = 10 + 6.8$'
      - say: '10 plus 6.8 is 16.8. That''s inside the class 10 to 20, and above the middle, 15, since the pile after has more coconuts than the pile before.'
        write: '$= 16.8$ g'
        doodle_do:
          - {id: nuts, op: stage, stage: 'custom:1993_q45_a2'}
        point:
          - {line: 9, kind: highlight, at: '16.8', to: {doodle: nuts, part: mode}}
      - say: 'So the mode is about 16.8 grams, which is answer choice C.'
        write: 'Answer: $16.8$ g'
        answer: true
    traps:
      A: 'You went for 13.2 grams. That''s 20 minus 6.8, working down from the top of the class. The formula adds to the lower boundary: 10 plus 6.8.'
      B: 'You went for 15.0 grams. That''s the middle of the modal class. The mode leans towards the neighbour with more coconuts, so it''s more than 15.'
      D: 'You went for 17.5 grams. Check the differences: 27 minus 10 is 17 and 27 minus 19 is 8, so the fraction is 17 over 25, giving 6.8, not 7.5.'
  46:
    moments:
      - say: 'Ten pupils have a mean age of 16: picture the ten of them. When the teacher''s age is added, the mean becomes 19. We want the teacher''s age.'
        write: 'Mean of 10 pupils $= 16$; with the teacher, mean $= 19$'
        doodle: {name: 'student-small', id: pupils, repeat: 10, layout: row, caption: '10 pupils, mean 16'}
      - say: 'A mean is a total divided by a count. So we can turn each mean back into a total: the total is the mean times the count.'
        write: 'Total $=$ mean $\times$ count'
      - say: 'Ten pupils with mean 16: 10 times 16 is 160. That''s the pupils'' ages added together.'
        write: 'Pupils'' total $= 10 \times 16 = 160$'
        doodle_do:
          - {id: pupils, op: count}
      - say: 'When the teacher joins them, there are 11 people, not 10.'
        write: 'People now $= 10 + 1 = 11$'
        doodle: {name: 'custom:1993_q46_a', id: teacher, caption: 'then their teacher joins'}
      - say: 'Their mean is 19, so their total is 11 times 19. 11 times 20 is 220, and taking away one 11 gives 209.'
        write: 'New total $= 11 \times 19 = 220 - 11 = 209$'
      - say: 'The only thing added between the first total and the second is the teacher''s age. So the teacher''s age is the second total minus the first: 209 minus 160.'
        write: 'Teacher $= 209 - 160$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= [[209]]'}, at: '209', text: 'new total'}
          - {line: 5, kind: move, from: {line: 2, at: '= [[160]]'}, at: '160', text: 'pupils'}
      - say: '209 minus 160 is 49: the teacher''s age.'
        write: '$= 49$'
        doodle_do:
          - {id: teacher, op: label, part: age, text: '49 years'}
        point:
          - {line: 6, kind: highlight, at: '49', to: {doodle: teacher, part: age}}
      - say: 'Let''s check: 160 plus 49 is 209, and 209 divided by 11 is 19, the new mean.'
        write: 'Check: $\dfrac{160 + 49}{11} = \dfrac{209}{11} = 19$'
      - say: 'So the teacher is 49 years old, which is answer choice D.'
        write: 'Answer: $49$'
        answer: true
    traps:
      A: 'You went for 27. Turn each mean into a total: 11 times 19 is 209 and 10 times 16 is 160. The difference is 49.'
      B: 'You went for 35. That''s 16 plus 19. Work with totals instead: 209 minus 160 is 49.'
      C: 'You went for 38. That''s twice the new mean, not a difference of totals. Turn each mean into a total: 11 times 19 is 209 and 10 times 16 is 160, and the difference is 49.'
  47:
    moments:
      - say: 'We want the median of the grouped data in the table.'
        write: '$2,\ 4,\ 5,\ 2,\ 3,\ 2,\ 1,\ 1$'
      - say: 'First, the total frequency: picture everyone in the table standing in one queue, in order. 2 plus 4 is 6. Plus 5 is 11. Plus 2 is 13. Plus 3 is 16. Plus 2 is 18. Plus 1 is 19. Plus 1 is 20.'
        write: 'Total $n = 2 + 4 + 5 + 2 + 3 + 2 + 1 + 1 = 20$'
        doodle: {name: 'person-small', id: queue, repeat: 20, layout: row, caption: '20 in order'}
      - say: 'The median is the middle value once everything is in order. Half of 20 is 10, so we are looking for the 10th person in the queue.'
        write: 'Median position $= \dfrac{n}{2} = \dfrac{20}{2} = 10$'
        doodle_do:
          - {id: queue, op: count, n: 10}
      - say: 'Now run a total down the classes to find where the 10th value sits. Up to the class 1 to 5, there are 2. Up to 6 to 10, 2 plus 4 is 6: the first 6 in the queue.'
        write: 'Cumulative: up to 1–5: $2$; up to 6–10: $2 + 4 = 6$'
        doodle_do:
          - {id: queue, op: group, n: 6, text: 'up to 6–10: 6'}
      - say: '6 is short of 10, so add the next class: 6 plus 5 is 11. That passes 10, so the 10th person is in the class 11 to 15.'
        write: 'Up to 11–15: $6 + 5 = 11 \ge 10$, so the median class is 11–15'
        doodle_do:
          - {id: queue, op: group, n: 11, text: 'up to 11–15: 11'}
      - say: 'To place the median inside that class, we use this formula.'
        write: 'Median $= L + \left(\dfrac{\tfrac{n}{2} - cf}{f}\right) \times c$'
      - say: 'The classes have gaps between them, so the lower boundary of 11 to 15 is 10.5, halfway between 10 and 11. $cf$ is the total before this class, the 6 we found. $f$ is 5, and the width $c$ is 5.'
        write: '$L = 10.5, \ cf = 6, \ f = 5, \ c = 5$'
      - say: 'Put those values into the formula, with $n$ over 2 equal to 10.'
        write: 'Median $= 10.5 + \left(\dfrac{10 - 6}{5}\right) \times 5$'
        point:
          - {line: 5, kind: box, text: 'the rule'}
          - {line: 7, kind: move, from: {line: 6, at: 'L = [[10.5]]'}, at: '10.5', text: 'L'}
          - {line: 7, kind: move, from: {line: 6, at: 'cf = [[6]]'}, at: '10 − [[6]]', text: 'cf'}
      - say: '10 minus 6 is 4. 4 over 5, times 5, is 4.'
        write: '$= 10.5 + \dfrac{4}{5} \times 5 = 10.5 + 4$'
      - say: '10.5 plus 4 is 14.5.'
        write: '$= 14.5$'
      - say: 'So the median is 14.5, which is answer choice D.'
        write: 'Answer: $14.5$'
        answer: true
    traps:
      A: 'You went for 11.5. The median class is 11 to 15, and we must move 4 into it from the boundary 10.5. So it''s 10.5 plus 4.'
      B: 'You went for 12.5. That''s the middle of the class 11 to 15. The formula places the median using the cumulative frequency: 10.5 plus 4.'
      C: 'You went for 14.0. Use the class boundary 10.5, not 10. The 10th value is 4 units into the class, so it''s 14.5.'
  48:
    moments:
      - say: 'A number is chosen at random between 20 and 30, including both. We want the probability it''s a prime.'
      - say: 'Probability is the number of favourable outcomes over the total number of outcomes. So we need two counts: all the numbers, and the primes.'
        write: '$P(\text{prime}) = \dfrac{\text{number of primes}}{\text{number of outcomes}}$'
      - say: 'First, list the numbers. "Both inclusive" means 20 and 30 are in the list, so it runs from 20 up to 30. Picture a bowl of number balls, one for each.'
        write: 'Numbers: $20, 21, 22, \ldots, 30$'
        doodle: {name: 'custom:1993_q48_a', id: bowl, caption: 'pick one from 20 to 30'}
      - say: 'How many is that? 30 minus 20 is 10, and we add 1 because both ends are included: 11 balls.'
        write: 'Outcomes $= 30 - 20 + 1 = 11$'
        doodle_do:
          - {id: bowl, op: label, text: '11 balls'}
      - say: 'Now the primes. A prime has exactly two factors, 1 and itself. The even balls, 20, 22, 24, 26, 28 and 30, all divide by 2, so none of them is prime.'
        write: 'Even, so not prime: $20, 22, 24, 26, 28, 30$'
        doodle_do:
          - {id: bowl, op: cross, part: evens}
      - say: 'Now test the odd ones. 21 is 3 times 7, so it''s not prime.'
        write: '$21 = 3 \times 7$'
      - say: '25 is 5 times 5, and 27 is 3 times 9. Neither is prime.'
        write: '$25 = 5 \times 5, \quad 27 = 3 \times 9$'
      - say: 'That leaves 23 and 29. Neither divides by 2, 3 or 5, so both are prime: two balls out of the bowl.'
        write: 'Primes: $23,\ 29$, which is 2 primes'
        doodle_do:
          - {id: bowl, op: circle, part: p23}
          - {id: bowl, op: circle, part: p29}
        point:
          - {line: 7, kind: highlight, at: '23', to: {doodle: bowl, part: p23}}
      - say: 'Now put the counts into the probability: 2 primes out of 11 numbers.'
        write: 'So $P(\text{prime}) = \dfrac{2}{11}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '[[2]] primes'}, at: '11[[2]]', text: 'primes'}
          - {line: 8, kind: move, from: {line: 3, at: '= [[11]]'}, at: '[[11]]2', text: 'outcomes'}
      - say: 'So the probability is 2 over 11, which is answer choice A.'
        write: 'Answer: $\dfrac{2}{11}$'
        answer: true
    traps:
      B: 'You went for 5 over 11. That''s the count of odd numbers, 21, 23, 25, 27 and 29. But 21, 25 and 27 are not prime.'
      C: 'You went for 6 over 11. That''s the count of even numbers, and even numbers above 2 are never prime.'
      D: 'You went for 8 over 11. Test each number for factors: only 23 and 29 are prime, so it''s 2 out of 11.'
  49:
    moments:
      - say: 'We want the standard deviation of 7, 8, 9, 10, 11, 12 and 13.'
        write: '$7,\ 8,\ 9,\ 10,\ 11,\ 12,\ 13$'
      - say: 'Standard deviation measures how spread out the numbers are around the mean, so first we need the mean. Add the numbers: 7 plus 13 is 20, 8 plus 12 is 20, 9 plus 11 is 20, and the 10 makes 70.'
        write: 'Sum $= 7 + 8 + 9 + 10 + 11 + 12 + 13 = 70$'
      - say: 'There are 7 numbers, so the mean is 70 over 7, which is 10. Picture seven stacks of blocks, 7 up to 13 tall, with a line across at the mean, 10.'
        write: 'Mean $\bar{x} = \dfrac{70}{7} = 10$'
        doodle: {name: 'custom:1993_q49_a', id: stacks, caption: 'how far is each stack from 10?', size: scene}
      - say: 'Now the deviations: how far each stack is from the line. 7 minus 10 is negative 3, 8 minus 10 is negative 2, and so on, up to 13 minus 10, which is 3.'
        write: 'Deviations $x - 10$: $\ -3,\ -2,\ -1,\ 0,\ 1,\ 2,\ 3$'
        doodle_do:
          - {id: stacks, op: stage, stage: 'custom:1993_q49_a2'}
      - say: 'Square each deviation, so the negatives don''t cancel the positives. Negative 3 squared is 9, negative 2 squared is 4, negative 1 squared is 1, 0 squared is 0, and 1, 2 and 3 give 1, 4 and 9.'
        write: 'Squares $(x - 10)^{2}$: $\ 9,\ 4,\ 1,\ 0,\ 1,\ 4,\ 9$'
      - say: 'Add the squares. 9 plus 4 is 13, plus 1 is 14, plus 0 is 14, plus 1 is 15, plus 4 is 19, plus 9 is 28.'
        write: '$\sum (x - \bar{x})^{2} = 9 + 4 + 1 + 0 + 1 + 4 + 9 = 28$'
      - say: 'The variance is the sum of the squared deviations, divided by the number of values.'
        write: 'Variance $= \dfrac{\sum (x - \bar{x})^{2}}{n}$'
      - say: 'The variance is this total divided by the number of values, 7. 28 divided by 7 is 4.'
        write: 'Variance $= \dfrac{28}{7} = 4$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '= [[28]]'}, at: '28', text: 'from here'}
      - say: 'The standard deviation is the square root of the variance. The square root of 4 is 2: a typical stack sits about 2 away from the line.'
        write: '$\sigma = \sqrt{4} = 2$'
        doodle_do:
          - {id: stacks, op: pulse, part: mean}
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= [[4]]'}, at: '[[4]] =', text: 'variance'}
      - say: 'So the standard deviation is 2, which is answer choice A.'
        write: 'Answer: $\sigma = 2$'
        answer: true
    traps:
      B: 'You went for 4. That''s the variance. The standard deviation is its square root, which is 2.'
      C: 'You went for 10. That''s the mean, the middle of the data. The standard deviation measures how spread out the data is around it.'
      D: 'You went for 11. Work through the deviations from the mean: their squares add to 28, divide by 7 to get 4, and the square root is 2.'
  50:
    moments:
      - say: 'Three independent events $X$, $Y$ and $Z$ have probabilities a half, two thirds and a quarter: picture three spinners, shaded that much. We want the probability that $Y$ and $Z$ only occur.'
        write: '$P(X) = \tfrac{1}{2}, \ P(Y) = \tfrac{2}{3}, \ P(Z) = \tfrac{1}{4}$'
        doodle: {name: 'custom:1993_q50_a', id: spin, caption: 'three spinners, X, Y and Z'}
      - say: 'The word "only" matters. "$Y$ and $Z$ only" means $Y$ happens, $Z$ happens, and $X$ does NOT happen: a cross under $X$, ticks under $Y$ and $Z$.'
        write: 'We want: $Y$ and $Z$ and not $X$'
        doodle_do:
          - {id: spin, op: stage, stage: 'custom:1993_q50_a2'}
      - say: 'The probability that $X$ does not happen is 1 minus the probability that it does: 1 minus a half, which is a half, the unshaded part of its spinner.'
        write: '$P(\text{not } X) = 1 - \dfrac{1}{2} = \dfrac{1}{2}$'
        doodle_do:
          - {id: spin, op: label, part: x, text: 'not X: ½'}
      - say: 'The events are independent, so the probability of all three together is the three probabilities multiplied.'
        write: '$P = P(\text{not } X) \times P(Y) \times P(Z)$'
      - say: 'Put in the numbers: a half for not $X$, which we just found, 2 over 3 for $Y$, and a quarter for $Z$.'
        write: '$= \dfrac{1}{2} \times \dfrac{2}{3} \times \dfrac{1}{4}$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '= [[21]]'}, at: '21', text: 'not X'}
          - {line: 4, kind: move, from: {line: 0, at: 'P(Y) = [[32]]'}, at: '32', text: 'Y'}
          - {line: 4, kind: move, from: {line: 0, at: 'P(Z) = [[41]]'}, at: '41', text: 'Z'}
      - say: 'Multiply the tops: 1 times 2 times 1 is 2. Multiply the bottoms: 2 times 3 times 4 is 24.'
        write: '$= \dfrac{1 \times 2 \times 1}{2 \times 3 \times 4} = \dfrac{2}{24}$'
      - say: 'Divide the top and bottom by 2. 2 over 24 is 1 over 12.'
        write: '$= \dfrac{1}{12}$'
        doodle_do:
          - {id: spin, op: pulse}
      - say: 'Notice what "only" did. Without it, we would just multiply 2 over 3 by a quarter, which is 1 over 6. The word "only" brings in the extra factor of a half for not $X$.'
        write: 'Without "only": $\dfrac{2}{3} \times \dfrac{1}{4} = \dfrac{1}{6}$'
      - say: 'So the probability of $Y$ and $Z$ only is 1 over 12, which is answer choice C.'
        write: 'Answer: $\dfrac{1}{12}$'
        answer: true
    traps:
      A: 'You went for 1 over 8. That''s a half times a quarter, which leaves out $Y$. We need not $X$, and $Y$, and $Z$: a half times 2 over 3 times a quarter.'
      B: 'You went for 1 over 24. Check $Y$: its probability is 2 over 3, not 1 over 3. A half times 2 over 3 times a quarter is 1 over 12.'
      D: 'You went for a quarter. That''s just the probability of $Z$. "Only" means not $X$, and $Y$, and $Z$ together, so multiply all three probabilities.'
