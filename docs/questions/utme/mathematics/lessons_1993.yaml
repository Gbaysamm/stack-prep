      - say: 'Go through the first ten marks: 53, 30, 70, 84, 59, 43, 90, 20, 78, 48. Of these, 30, 43, 20 and 48 are below 50. That''s 4.'
        write: 'First ten: $30,\ 43,\ 20,\ 48$ are below 50, that is 4'
      - say: 'Now the second ten: 44, 60, 81, 73, 50, 37, 67, 68, 64, 52. Of these, 44 and 37 are below 50. That''s 2.'
        write: 'Second ten: $44,\ 37$ are below 50, that is 2'
      - say: 'What about the 50? It is not below 50, so it belongs with the "at least 50" group.'
        write: '$50 \ge 50$, so 50 counts as at least 50'
        point:
          - {line: 1, kind: underline, at: '≥ 50', text: 'or more'}
      - say: '4 plus 2 is 6 scores below 50: six scripts in the first tray.'
        write: 'Below 50: $4 + 2 = 6$'
        doodle_do:
          - {id: trays, op: label, part: below, text: '6'}
      - say: 'There are 20 students altogether, so the rest scored at least 50. 20 minus 6 is 14.'
        write: 'At least 50: $20 - 6 = 14$'
