      - say: 'Expand the right. $k$ times $3k$ is $3k$ squared. $k$ times 1 is $k$, and 1 times $3k$ is $3k$, which together make $4k$. And 1 times 1 is 1.'
        write: 'Right: $(k + 1)(3k + 1) = 3k^{2} + k + 3k + 1 = 3k^{2} + 4k + 1$'
      - say: 'Now set the two expanded sides equal.'
        write: 'So $4k^{2} - 4k + 1 = 3k^{2} + 4k + 1$'
