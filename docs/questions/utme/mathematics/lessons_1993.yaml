      - say: 'Expand the right. $k$ times $3k$ is $3k^{2}$, then $k$ plus $3k$ is $4k$, and 1 times 1 is 1.'
        write: '$(k + 1)(3k + 1) = 3k^{2} + 4k + 1$'
      - say: 'Set them equal.'
        write: '$4k^{2} - 4k + 1 = 3k^{2} + 4k + 1$'
      - say: 'Subtract $3k^{2}$, subtract $4k$ and subtract 1 from both sides.'
        write: '$k^{2} - 8k = 0$'
      - say: 'Factor out $k$.'
        write: '$k(k - 8) = 0$'
      - say: 'So $k$ is zero or $k$ is 8.'
        write: '$k = 0 \quad \text{or} \quad k = 8$'
