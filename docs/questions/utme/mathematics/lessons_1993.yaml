          - {figure: 0, kind: arc, target: PSQ, text: '?'}
      - section: 'Solution'
        say: 'Solution. $S$, $O$ and $Q$ lie on one straight line through the centre, so $SQ$ is a diameter. We work in triangle $PSQ$.'
        write: 'Solution'
        point:
          - {figure: 0, kind: highlight, target: SQ, text: 'diameter'}
      - say: '$P$ is on the circle and $SQ$ is a diameter, so the angle at $P$ is a right angle. The reason is the angle in a semicircle.'
        write: '$\angle SPQ = 90^{\circ}$ ($\angle$ in a semicircle)'
        point:
          - {figure: 0, kind: arc, target: SPQ, text: '90°'}
      - say: 'The line $TQ$ cuts the parallels $PQ$ and $RT$. Angle $PQS$ and angle $RTS$ make a Z, on opposite sides of $TQ$. Alternate angles are equal.'
        write: '$\angle PQS = \angle RTS = 32^{\circ}$ (alt. $\angle$s, $PQ \parallel RT$)'
        point:
          - {figure: 0, kind: highlight, target: PQ}
          - {figure: 0, kind: highlight, target: RT}
          - {figure: 0, kind: arc, target: PQS, text: '32°'}
      - say: 'The three angles of triangle $PSQ$ add up to 180 degrees. The reason is the angle sum of a triangle.'
        write: '$\angle PSQ + 90^{\circ} + 32^{\circ} = 180^{\circ}$ ($\angle$ sum of $\triangle$)'
      - say: '90 plus 32 is 122. Take it to the other side, giving 180 minus 122.'
        write: '$\angle PSQ = 180^{\circ} - 122^{\circ}$'
      - say: '180 minus 122 is 58 degrees.'
        write: '$\angle PSQ = 58^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: PSQ, text: '58°'}
      - section: 'Check'
        say: 'Check. With a right angle at $P$, the other two angles of the triangle must add up to 90. 58 plus 32 is 90.'
        write: '$58^{\circ} + 32^{\circ} = 90^{\circ}\ \checkmark$'
      - say: 'Therefore angle $PSQ$ is 58 degrees, option C.'
        write: '$\therefore \angle PSQ = 58^{\circ}$ (C)'
        answer: true
    traps:
      A: 'You went for 32 degrees. That is angle $PQS$, at $Q$. We want the angle at $S$, and 180 minus 90 minus 32 is 58.'
      B: 'You went for 45 degrees. That needs two equal angles in the triangle. Here the angle at $Q$ is 32, so the angle at $S$ is 90 minus 32, which is 58.'
      D: 'You went for 90 degrees. That is the angle at $P$, in the semicircle. The angle at $S$ is what is left, so 180 minus 90 minus 32, which is 58.'
  29:
    moments:
      - section: 'The question'
        say: 'Two radii, $OR$ and $OQ$, make an isosceles triangle. Spot it, and the 96 degrees does the rest.'
        write: '$POQ$ diameter, $\angle POR = 96^{\circ}$, $\angle ORQ = ?$'
        point:
          - {figure: 0, kind: arc, target: POR, text: '96°'}
          - {figure: 0, kind: arc, target: ORQ, text: '?'}
      - section: 'Solution'
        say: 'Solution. Mark the centre $O$ and the radii first. $OR$ and $OQ$ both run from the centre to the circle.'
        write: 'Solution'
      - say: '$POQ$ is a straight line, so angles $POR$ and $ROQ$ add up to 180. Angle $ROQ$ is 180 minus 96, which is 84.'
        write: '$\angle ROQ = 180^{\circ} - 96^{\circ} = 84^{\circ}$ ($\angle$s on a str. line)'
        point:
          - {figure: 0, kind: arc, target: ROQ, text: '84°'}
      - say: '$OR$ and $OQ$ are radii of the same circle, so they are equal, because they are radii.'
        write: '$OR = OQ$ (radii)'
        point:
          - {figure: 0, kind: highlight, target: OR, text: 'r'}
          - {figure: 0, kind: highlight, target: OQ, text: 'r'}
      - say: 'So triangle $ORQ$ is isosceles, and its base angles at $R$ and $Q$ are equal. The reason is base angles of an isosceles triangle.'
        write: '$\angle ORQ = \angle OQR$ (base $\angle$s of isos. $\triangle$)'
      - say: 'The angles of triangle $ORQ$ add up to 180. The two equal angles make 2 times angle $ORQ$.'
        write: '$2\angle ORQ + 84^{\circ} = 180^{\circ}$ ($\angle$ sum of $\triangle$)'
      - say: 'Take 84 to the other side. 180 minus 84 is 96.'
        write: '$2\angle ORQ = 180^{\circ} - 84^{\circ} = 96^{\circ}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '+ 84∘'}, at: '− 84∘', text: 'across'}
      - say: 'Divide both sides by 2. 96 divided by 2 is 48.'
        write: '$\angle ORQ = \dfrac{96^{\circ}}{2} = 48^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: ORQ, text: '48°'}
          - {figure: 0, kind: arc, target: OQR, text: '48°'}
      - section: 'Check'
        say: 'Check by another theorem. Angle $POR$ at the centre and angle $PQR$ at the circumference stand on the same arc $PR$. The angle at the centre is twice the angle at the circumference.'
        write: '$\angle PQR = \dfrac{96^{\circ}}{2} = 48^{\circ}$ ($\angle$ at centre $= 2 \times \angle$ at circumference)'
      - say: 'And angle $PQR$ is the same as angle $OQR$, which equals angle $ORQ$. That is 48 again.'
        write: '$\angle ORQ = \angle OQR = 48^{\circ}\ \checkmark$'
      - say: 'Therefore angle $ORQ$ is 48 degrees, option B.'
        write: '$\therefore \angle ORQ = 48^{\circ}$ (B)'
        answer: true
    traps:
      A: 'You went for 84 degrees. That is angle $ROQ$, the angle at the centre. Angle $ORQ$ is one of the two equal base angles, so it is half of 180 minus 84, which is 48.'
      C: 'You went for 45 degrees. That would be right only if angle $ROQ$ were 90. Here it is 84, so each base angle is half of 96, which is 48.'
      D: 'You went for 42 degrees. That is half of 84. Halve what is left after taking 84 from 180. Half of 96 is 48.'
